l_turkish:
 cm__ab_roads_ignore_shortage_name: "Build Through Shortages"
 cm__ab_roads_ignore_shortage_desc: "Lay roads even when the market is short of lumber, masonry or sand. The gold is paid at once; a shortage only slows the work."
 cm__ab_roads_ignore_shortage: "cm__ab_roads_ignore_shortage"
 cm__ab_core_foreign_markets_name: "Markets Centred Elsewhere Too"
 cm__ab_core_foreign_markets_desc: "Build core goods in markets whose centre belongs to another country too, where you own locations. Without it Construction Manager only works markets you hold the centre of."
 cm__ab_core_foreign_markets: "cm__ab_core_foreign_markets"
 cm__ab_food_horizon_name: "Hiring Horizon for RGOs, Years"
 cm__ab_food_horizon_desc: "How many years Auto-Build will wait for population growth to staff a new food RGO level with laborers or slaves. A level is built only if growth covers the shortfall within this time. Lower builds less often, but levels do not stand empty."
 cm__ab_food_horizon: "cm__ab_food_horizon"
 cm__ab_food_take_manual_name: "Take Hand-Enabled Breadbaskets"
 cm__ab_food_take_manual_desc: "While auto-food is off, Auto-Build also builds in locations whose breadbasket you enabled by hand, from the food budget and by this tab's rules."
 cm__ab_food_take_manual: "cm__ab_food_take_manual"
