l_russian:
 cm__ab_roads_ignore_shortage_name: "Строить при нехватке товаров"
 cm__ab_roads_ignore_shortage_desc: "Прокладывать дороги, даже когда на рынке не хватает пиломатериалов, камня или песка. Золото списывается сразу, нехватка только замедляет стройку."
 cm__ab_roads_ignore_shortage: "cm__ab_roads_ignore_shortage"
 cm__ab_core_foreign_markets_name: "И на чужом рынке"
 cm__ab_core_foreign_markets_desc: "Строить основные товары и на рынках, центр которых принадлежит другой державе, если там есть ваши районы. Без этого Construction Manager работает только на рынках со своим центром."
 cm__ab_core_foreign_markets: "cm__ab_core_foreign_markets"
 cm__ab_food_horizon_name: "Срок найма для RGO, лет"
 cm__ab_food_horizon_desc: "Сколько лет автостройка готова ждать, пока прирост населения заполнит новый уровень RGO еды рабочими или рабами. Уровень строится, только если нехватку закроет прирост за этот срок. Меньше — строит реже, но уровни не стоят пустыми."
 cm__ab_food_horizon: "cm__ab_food_horizon"
 cm__ab_production_horizon_name: "Срок найма, лет"
 cm__ab_production_horizon_desc: "За сколько лет повышение должно закрыть уже начатую нехватку людей нужного типа, прежде чем автостройка начнёт ещё один уровень производственного здания или RGO. Первый уровень строится всегда, если свободных крестьян хватает на нехватку всех сословий плюс 500. Меньше — нехватки не копятся."
 cm__ab_production_horizon: "cm__ab_production_horizon"
 cm__ae_horizon_name: "Срок найма для авторасширения, лет"
 cm__ae_horizon_desc: "То же, что «Срок найма» автостройки, для авторасширения зданий и RGO: за сколько лет повышение должно закрыть уже начатую нехватку людей, прежде чем строить следующий уровень."
 cm__ae_horizon: "cm__ae_horizon"
 cm__af_horizon_name: "Срок найма для житниц, лет"
 cm__af_horizon_desc: "То же, что «Срок найма» автостройки, для авторасширения еды (житниц): за сколько лет повышение должно закрыть уже начатую нехватку людей, прежде чем строить следующий уровень."
 cm__af_horizon: "cm__af_horizon"
 cm__ab_food_take_manual_name: "Брать житницы, включённые вручную"
 cm__ab_food_take_manual_desc: "Когда авторасширение еды выключено, автостройка строит и в районах, где житница включена вручную, — из бюджета продовольствия, по правилам этой вкладки."
 cm__ab_food_take_manual: "cm__ab_food_take_manual"
