l_russian:
 mapmode_cm_industry_support_name: "Рекомендуемая поддержка отрасли"
 MAPMODE_CM_INDUSTRY_SUPPORT: "#T $mapmode_cm_industry_support_name$#!\nОкрашивает каждую [area|e] по [industry_promotion|e], которая поднимет больше всего того, что там будут производить. Каждая провинция области даёт отрасли долю её товаров, которые там будут: товары своего рекомендуемого городского права, сталь — где есть железо, фарфор — где есть глина, лак — где есть краски. Так отрасль из двух товаров и отрасль из четырёх меряются одинаково."
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_WATER: "[ROOT.GetLocation.GetName] — не суша."
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_NONE: "В области [ROOT.GetLocation.GetArea.GetName] не будут производить ни одного товара отраслей — рекомендовать нечего."
 cm_ind_legend_none: "Нечего рекомендовать"
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_TEXTILES: "Область [ROOT.GetLocation.GetArea.GetName]: поддержка «#Y $textiles$#!»\nДоли товаров отраслей, сумма по провинциям ([ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_towns')|0]):\n  $textiles$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_textiles')|2]\n  $crafts$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_crafts')|2]\n  $arms$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_arms')|2]\n  $luxury$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_luxury')|2]\n  $paper_goods$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_paper_goods')|2]\n  $furnishings$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_furnishings')|2]\n  $naval$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_naval')|2]\n  $beverages$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_beverages')|2]"
