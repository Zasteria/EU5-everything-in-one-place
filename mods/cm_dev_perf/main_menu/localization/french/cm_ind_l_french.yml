 cm__map_modes__industry_name: "Industry Support"
 cm__map_modes__industry_desc: "How the Recommended Industry Support map adds up an area's provinces."
 cm__industry_mode: "cm__industry_mode"
 cm__industry_mode_name: "Industry Map Scoring"
 cm__industry_mode_desc: "How every province of an area votes with its recommended urban right. A change recomputes the map at once; if it is open, switch map modes away and back."
 cm__industry_mode_option_1_name: "Average by Rights"
 cm__industry_mode_option_1_desc: "The goods of the province's best right count whole, and an industry's sum is divided by how many of its goods some right raises: crafts by 3, luxury by 2. Steel, porcelain and lacquerware do not count."
 cm__industry_mode_option_2_name: "Right Shares (as before)"
 cm__industry_mode_option_2_desc: "The province's best right is split among industries by the share of its goods: masonry gives crafts ½ and luxury ½. The rule before this setting."
 cm__industry_mode_option_3_name: "With Porcelain, Steel, Lacquer"
 cm__industry_mode_option_3_desc: "As Average by Rights, plus steel where there is iron, porcelain where there is clay and lacquerware where there are dyes, each sum divided by all of the industry's goods. A map for the late ages."
