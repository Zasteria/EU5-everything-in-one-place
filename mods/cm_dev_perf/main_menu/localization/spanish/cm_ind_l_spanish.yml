l_spanish:
 mapmode_cm_industry_support_name: "Recommended industry support"
 MAPMODE_CM_INDUSTRY_SUPPORT: "#T $mapmode_cm_industry_support_name$#!\nColours every [area|e] by the [industry_promotion|e] to choose for it from the recommended urban rights map: every province of the area votes with the right that map colours it with, split between industries by the share of the right's goods. The textile and book rights partly go to dyes, which no industry covers."
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_WATER: "[ROOT.GetLocation.GetName] is not land."
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_NONE: "Area [ROOT.GetLocation.GetArea.GetName] has no province with a recommended right — nothing to recommend."
 cm_ind_legend_none: "No province with a recommendation"
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_TEXTILES: "Area [ROOT.GetLocation.GetArea.GetName]: support «#Y $textiles$#!»\nProvince votes by recommended right ([ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_towns')|0]):\n  $textiles$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_textiles')|1]\n  $crafts$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_crafts')|1]\n  $arms$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_arms')|1]\n  $luxury$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_luxury')|1]\n  $paper_goods$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_paper_goods')|1]\n  $furnishings$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_furnishings')|1]\n  $naval$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_naval')|1]\n  $beverages$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_ind_sv_beverages')|1]"
