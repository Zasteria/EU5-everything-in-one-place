l_russian:
 mapmode_cm_industry_support_name: "Рекомендуемая поддержка отрасли"
 MAPMODE_CM_INDUSTRY_SUPPORT: "#T $mapmode_cm_industry_support_name$#!\nОкрашивает каждую [area|e] по [industry_promotion|e], которая поднимет больше всего того, что там будут производить. Каждая провинция области голосует своим рекомендуемым городским правом; как именно — выбирается на странице мода в настройках CMF, «Счёт карты отраслей»."
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_WATER: "[ROOT.GetLocation.GetName] — не суша."
 MAPMODE_CM_INDUSTRY_SUPPORT_TT_NONE: "В области [ROOT.GetLocation.GetArea.GetName] не будут производить ни одного товара отраслей — рекомендовать нечего."
 cm_ind_legend_none: "Нечего рекомендовать"
