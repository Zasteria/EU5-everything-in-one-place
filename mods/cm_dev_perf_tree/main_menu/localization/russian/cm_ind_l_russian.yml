 cm__map_modes__industry_name: "Поддержка отрасли"
 cm__map_modes__industry_desc: "Как карта «Рекомендуемая поддержка отрасли» складывает провинции области."
 cm__industry_mode: "cm__industry_mode"
 cm__industry_mode_name: "Счёт карты отраслей"
 cm__industry_mode_desc: "Как каждая провинция области голосует своим рекомендуемым городским правом. Смена пересчитывает карту сразу; если она открыта, переключите режим карты туда и обратно."
 cm__industry_mode_option_1_name: "Среднее по правам"
 cm__industry_mode_option_1_desc: "Товары лучшего права провинции считаются целиком, и сумма отрасли делится на число её товаров, которые поднимает хоть одно право: ремёсла на 3, роскошь на 2. Сталь, фарфор и лак не считаются."
 cm__industry_mode_option_2_name: "Доли права (как было)"
 cm__industry_mode_option_2_desc: "Лучшее право провинции делится между отраслями по доле своих товаров: каменщики дают ремёслам ½ и роскоши ½. Правило до этой настройки."
 cm__industry_mode_option_3_name: "С фарфором, сталью, лаком"
 cm__industry_mode_option_3_desc: "Как «Среднее по правам», но сталь считается там, где есть железо, фарфор — где глина, лак — где краски, и сумма делится на все товары отрасли. Карта на поздние эпохи."
