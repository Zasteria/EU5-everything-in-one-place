 bag_wpr_victim_text: "жертва"
 bag_wpr_row_count: "детей в ряду: [PdxGuiWidget.AccessParent.GetChildrenCount]"
 bag_wpr_btn_kill: "Уничтожить жертву"
 bag_wpr_btn_kill_tt: "Зовёт PdxGuiDestroyWidget на соседний виджет с именем bag_wpr_victim. Слово «жертва» слева должно пропасть, а счётчик детей ряда — упасть с 3 на 2."
 bag_wpr_btn_clear: "gui.clearwidgets"
 bag_wpr_btn_clear_tt: "Консольная команда, которой игра гасит свою библиотеку интерфейса. Что она чистит на самом деле — неизвестно, это и проверяем. Смотреть на счётчик виджетов в performance_degradation.log."
 bag_wpr_btn_tips: "Закрыть все подсказки"
 bag_wpr_btn_tips_tt: "CloseAllTooltips — то же, чем игра закрывает подсказки сама. Вопрос в том, освобождает ли оно виджеты подсказок."
 bag_wpr_btn_close: "Свернуть"
 bag_wpr_btn_close_tt: "Убрать панель с экрана. Остаётся маленькая кнопка «Зонд», ею же и открывается обратно."
 bag_wpr_btn_open: "Зонд"
 bag_wpr_btn_open_tt: "Открыть или свернуть панель зонда. Кнопку можно перетащить мышью куда угодно."
