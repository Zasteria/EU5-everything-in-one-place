l_russian:
 bag_wpr_title: "Пробник виджетов"
 bag_wpr_frame: "Время кадра: [PdxProfilerGetFrameTimeMs|2] мс"
 bag_wpr_lvl0: "0 · [PdxGuiWidget.GetName] — детей [PdxGuiWidget.GetChildrenCount], видимых [PdxGuiWidget.CountVisibleChildren]"
 bag_wpr_lvl1: "1 · [PdxGuiWidget.AccessParent.GetName] — детей [PdxGuiWidget.AccessParent.GetChildrenCount], видимых [PdxGuiWidget.AccessParent.CountVisibleChildren]"
 bag_wpr_lvl2: "2 · [PdxGuiWidget.AccessParent.AccessParent.GetName] — детей [PdxGuiWidget.AccessParent.AccessParent.GetChildrenCount], видимых [PdxGuiWidget.AccessParent.AccessParent.CountVisibleChildren]"
 bag_wpr_lvl3: "3 · [PdxGuiWidget.AccessParent.AccessParent.AccessParent.GetName] — детей [PdxGuiWidget.AccessParent.AccessParent.AccessParent.GetChildrenCount], видимых [PdxGuiWidget.AccessParent.AccessParent.AccessParent.CountVisibleChildren]"
 bag_wpr_lvl4: "4 · [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.GetName] — детей [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.GetChildrenCount], видимых [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.CountVisibleChildren]"
 bag_wpr_lvl5: "5 · [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.AccessParent.GetName] — детей [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.AccessParent.GetChildrenCount], видимых [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.AccessParent.CountVisibleChildren] · [PdxGuiWidget.AccessParent.AccessParent.AccessParent.AccessParent.AccessParent.GetOutlinerEntryDebug]"
 bag_wpr_victim_text: "жертва"
 bag_wpr_row_count: "детей в ряду: [PdxGuiWidget.AccessParent.GetChildrenCount]"
 bag_wpr_btn_kill: "Уничтожить жертву"
 bag_wpr_btn_kill_tt: "Зовёт PdxGuiDestroyWidget на соседний виджет с именем bag_wpr_victim. Слово «жертва» слева должно пропасть, а счётчик детей ряда — упасть с 3 на 2. Если ничего не изменилось, вызов из мода не работает."
 bag_wpr_btn_clear: "gui.clearwidgets"
 bag_wpr_btn_clear_tt: "Консольная команда, которой игра гасит свою библиотеку интерфейса. Что она чистит на самом деле — неизвестно, это и проверяем. Смотреть на время кадра сверху и на счётчик виджетов в performance_degradation.log."
 bag_wpr_btn_tips: "Закрыть все подсказки"
 bag_wpr_btn_tips_tt: "CloseAllTooltips — то же, чем игра закрывает подсказки сама. Бесплатно и безопасно; вопрос в том, освобождает ли оно виджеты подсказок."
 bag_wpr_btn_prof: "Профайлер: вкл/выкл"
 bag_wpr_btn_prof_tt: "Если время кадра сверху стоит на нуле — нажать это и посмотреть снова."
 bag_wpr_hint: "Строки 0–5 идут вверх по дереву окна. ERROR в строке значит, что цепочка кончилась выше — это ответ, а не поломка. Контейнер с десятками тысяч детей — это и есть адрес утечки."
