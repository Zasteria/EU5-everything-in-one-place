 # Construction Manager Dev 2.3.0: nine keys its English files carry and its
 # Russian files do not, so the game-rules screen printed the raw keys (09-27).
 rule_cm_ln_lucky_nation_effects:0 "Менеджер строительства: эффекты счастливых держав"
 setting_cm_ln_lucky_nation_effects_decisions_and_setup:0 "Решения и стартовые изменения"
 setting_cm_ln_lucky_nation_effects_decisions_and_setup_desc:0 "Улучшенные решения о строительстве и взаимодействии с сословиями и несколько мелких изменений стартовой обстановки (например, чтобы Кастилия не присоединила Португалию)."
 setting_cm_ln_lucky_nation_effects_decisions:0 "Только решения"
 setting_cm_ln_lucky_nation_effects_decisions_desc:0 "Улучшенные решения о строительстве и взаимодействии с сословиями."
 setting_cm_ln_lucky_nations_european_powers:0 "Европейские державы"
 setting_cm_ln_lucky_nations_european_powers_desc:0 "Предоставляет автостроительство Менеджера строительства Австрии, Бранденбургу, Кастилии, Англии, Франции, Голландии, Московии, Османам, Польше, Португалии и Швеции."
 AUTOMATED_SYSTEM_DESTROYBUILDINGS_CLICK:0 "Открыть настройки Менеджера строительства"
 AUTOMATED_SYSTEM_DESTROYBUILDINGS_DESC:0 "Менеджер строительства сносит производственные здания, переставшие приносить доход, там, где в районе не осталось места, а также закрытые им ранее здания, если их район с тех пор заполнился."
 # Auto Child Education 0.2.2 (мастерская 3826420741): его «russian» — английский
 # текст под русским заголовком (10-26). Названия черт и образования — как в игре.
 cea_name: "Автообразование детей"
 cea_desc: "Уведомление о детях, которым можно дать лучшее образование, и автоматический выбор образования."
 cea__settings_name: "Настройки"
 cea__settings__settings_name: "Автообразование детей"
 cea__settings__settings_desc: "Уведомление и автообразование проверяются раз в месяц."
 cea__alert_enabled_name: "Уведомление"
 cea__alert_enabled_desc: "Показывать уведомление, когда у ребёнка стоит сбалансированное образование."
 cea__who_name: "Кого учитывать"
 cea__who_desc: "На каких детей смотрят уведомление и автообразование."
 cea__who_option_1_name: "Семьи правителя и наследников"
 cea__who_option_1_desc: "Дети и внуки правителя, а также первые наследники в линии наследования и их дети и внуки. Глубина наследования ограничивает только семьи дополнительных наследников. «Учитывать девочек» действует на всех отслеживаемых детей."
 cea__who_option_2_name: "Дети семьи при дворе"
 cea__who_option_2_desc: "Каждый наследник в линии при нашем дворе, его дети и внуки, а также династия правителя и дети и внуки правителя, даже из другой династии."
 cea__depth_name: "Мест в линии наследования"
 cea__depth_desc: "Сколько первых мест в линии наследования учитывается. Только для варианта с наследниками, иначе недоступно. Например, 3 — первые три наследника, мужчины среди них, их дети и внуки."
 cea__women_name: "Учитывать девочек"
 cea__women_desc: "Учитывать и девочек. Выключено — только мальчики. Действует на уведомление, автообразование и дорогое образование при любом варианте «Кого учитывать»."
 cea__future_royals_name: "Только будущая корона"
 cea__future_royals_desc: "Сужает «Кого учитывать»: из выбранных детей остаются только те, кто окажется в сословии короны, когда будет править первый наследник, — сам наследник и его близкие родственники (дети, внуки, братья и сёстры, племянники, родители, дяди и тёти). Например, дети братьев и сестёр наследника остаются, а его двоюродные братья и сёстры и их дети выпадают: при смене правителя они станут знатью."
 cea__auto_name: "Автообразование"
 cea__auto_desc: "Раз в месяц назначает образование детям со сбалансированным образованием. Образование, выбранное вами вручную, сохраняется."
 cea__auto_option_1_name: "Выкл."
 cea__auto_option_1_desc: "Образование выбираете вы."
 cea__auto_option_2_name: "По чертам"
 cea__auto_option_2_desc: "Незаурядный ум — административное, коммуникабельность — дипломатическое, непоседливость — военное; честолюбие, благородство и цепкий ум — по большему из двух их навыков; остальные — по лучшему навыку."
 cea__auto_option_3_name: "Административное"
 cea__auto_option_3_desc: "Административное образование для каждого ребёнка."
 cea__auto_option_4_name: "Дипломатическое"
 cea__auto_option_4_desc: "Дипломатическое образование для каждого ребёнка."
 cea__auto_option_5_name: "Военное"
 cea__auto_option_5_desc: "Военное образование для каждого ребёнка."
 CEA_OPEN_SETTINGS: "Автообразование детей"
 cea_child_education_name: "Детям можно дать лучшее образование"
 cea_child_education_tooltip: "У отслеживаемого ребёнка сбалансированное образование или оно не выбрано. Административное, дипломатическое или военное образование ускоряет рост соответствующего навыка.\n\nНажмите, чтобы открыть настройки и список детей. Выберите ребёнка в списке, чтобы открыть его панель персонажа. Проверка раз в месяц."
 cea__paid_name: "Дорогое образование"
 cea__paid__paid_traits_name: "Дорогое образование"
 cea__paid__paid_traits_desc: "Дети с отмеченными чертами раз в месяц получают дорогое образование, оплаченное как в игре. Если стране не хватает денег, действует настройка автообразования, а дорогое — когда деньги появятся. Работает и при выключенном автообразовании."
 cea__paid_traits_name: "Дорогое образование"
 cea__paid_traits_desc: "Дети с отмеченными чертами раз в месяц получают дорогое образование, оплаченное как в игре. Если стране не хватает денег, действует настройка автообразования, а дорогое — когда деньги появятся. Работает и при выключенном автообразовании."
 cea__paid_traits_item_column_name: "Черта"
 cea__paid_traits__boys_name: "Мальчики"
 cea__paid_traits__boys_desc: "Дорогое образование мальчикам с этой чертой."
 cea__paid_traits__girls_name: "Девочки"
 cea__paid_traits__girls_desc: "Дорогое образование девочкам с этой чертой."
 cea__paid_traits_i1_name: "@cea_child_prodigy! Одарённость"
 cea__paid_traits_i2_name: "@cea_child_gifted! Незаурядные способности"
 cea__paid_traits_i3_name: "@cea_healthy! Крепкое здоровье"
 cea__paid_traits_i4_name: "@cea_child_intelligent! Незаурядный ум"
 cea__paid_traits_i5_name: "@cea_child_gregarious! Коммуникабельность"
 cea__paid_traits_i6_name: "@cea_child_rowdy! Непоседливость"
 cea__paid_traits_i7_name: "@cea_child_ambitious! Честолюбие"
 cea__paid_traits_i8_name: "@cea_child_gallant! Благородство"
 cea__paid_traits_i9_name: "@cea_child_shrewd! Цепкий ум"
 cea__paid_traits_i10_name: "@cea_child_slow! Скромный ум"
 cea__paid_traits_i11_name: "@cea_child_idiot! Тупость"
 cea__paid_traits_i12_name: "@cea_sickly! Болезненность"
 CEA_UI_SUBTITLE: "Образование наследников и семьи"
 CEA_UI_SCOPE: "Кого учитывать и как учить"
 CEA_UI_DEPTH: "Мест в линии наследования"
 CEA_UI_AUTO_HINT: "Проверка раз в месяц. Образование, выбранное вручную, сохраняется."
 CEA_UI_CHILD_HINT: "Выберите ребёнка, чтобы открыть его панель персонажа. Показывается до восьми детей."
 CEA_UI_EMPTY: "Отслеживаемых детей без образования нет. Список можно обновить в любой момент."
 CEA_UI_FOOTER: "Дорогое образование стоит как в игре, и на него нужно золото. Черты для него выбираются на вкладке «Дорогое образование»."
