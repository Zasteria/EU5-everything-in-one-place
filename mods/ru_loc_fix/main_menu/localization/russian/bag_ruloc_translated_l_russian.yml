 cape_route_to_india_events.10.a:0 "Задобрить товарами — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] продаст нам право на постройку."
 cape_route_to_india_events.10.c:0 "Перебить цену [ShowCultureGroupNameWithNoTooltip('arabian_group')]их купцов — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] склонится к нам."
 cape_route_to_india_events.10.d:0 "Пока уступить — здесь распоряжается [target_ruler_country.Custom('GetRulerOrRegentTitle')]. Идти на север."
 cape_route_to_india_events.11.a:0 "Уйти до рассвета — такое гостеприимство не стоит риска."
 cape_route_to_india_events.11.c:0 "Если они замышляют измену, ударим первыми. Готовить людей."
 cape_route_to_india_events.2.a:0 "Вложить средства здесь и расширить форпост, охраняющий наш южный путь."
 cape_route_to_india_events.3.a:0 "Основать торговую факторию — этот остров того стоит."
 cape_route_to_india_events.3.a.owned:0 "Вложить в остров ещё больше — [ShowLocationNameWithNoTooltip('sao_tome')] уже под нашим флагом."
 cape_route_to_india_events.3.b:0 "Установить #italic падран#! и объявить остров владением короны."
 cape_route_to_india_events.4.a:0 "Просить аудиенции — пусть нас примет [target_owner.Custom('GetRulerOrRegentTitle')] этой земли."
 cape_route_to_india_events.4.b:0 "Выменять всё, что предложат: [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')] и прочее."
 cape_route_to_india_events.4.c:0 "Нанести устье реки на карты и идти на юг — медлить нельзя."
 cape_route_to_india_events.5.a.owned:0 "Расширить наш большой форпост в [ShowLocationNameWithNoTooltip('luanda')] — ничто на этом побережье с ним не сравнится."
 cape_route_to_india_events.5.b.owned:0 "Расширить факторию и склад припасов, которые у нас здесь уже есть."
 cape_route_to_india_events.5.c:0 "Отметить место на картах и идти дальше на юг."
 cape_route_to_india_events.6.a:0 "Ободрить людей: Мыс наконец близко. Вперёд!"
 cape_route_to_india_events.6.b:0 "Эти течения и ветра говорят — дайте мне их прочесть."
 cape_route_to_india_events.6.c:0 "Дать людям отдых — силы понадобятся им в грядущих штормах."
 cape_route_to_india_events.7.d:0 "Довольно — Мыс пройден. Поворачиваем домой."
 cape_route_to_india_events.7.historical_info:0 "Бартоломеу Диаш впервые обогнул Мыс в 1488 году и назвал его #italic Cabo das Tormentas#! (мыс Бурь). Согласно португальским источникам, король Жуан II переименовал его в #italic Cabo da Boa Esperança#! (мыс Доброй Надежды), чтобы вдохновить будущие экспедиции, хотя этот рассказ, возможно, вымысел. Мыс не является самой южной точкой Африки — эта честь принадлежит мысу Игольному, лежащему примерно в двухстах километрах к востоку, — но именно здесь встречаются Атлантический и Индийский океаны, и именно здесь открывается дверь на восток."
 cape_route_to_india_events.8.a:0 "Отдать за скот [ShowGoodsNameWithNoTooltip('copper')] и [ShowGoodsNameWithNoTooltip('cloth')]; установить #italic падран#!."
 cape_route_to_india_events.8.a.morale_tt:0 "Боевой дух команд заметно растёт (#G +10#! Боевой дух экипажа)"
 cape_route_to_india_events.8.b:0 "Воздвигнуть #italic падран#! — пусть этой землёй владеет [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.b.morale_tt:0 "Боевой дух команд немного растёт (#G +8#! Боевой дух экипажа)"
 cape_route_to_india_events.8.c.morale_tt:0 "Боевой дух команд заметно растёт (#G +10#! Боевой дух экипажа)"
 cape_route_to_india_events.9.a:0 "Пусть здесь встанет большая [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — с этим золотом [ROOT.GetCountry.GetNameWithNoTooltip] разбогатеет."
 cape_route_to_india_events.9.a.owned:0 "Вложить средства в наш форпост в [ShowLocationNameWithNoTooltip('sofala')] — с этим золотом [ROOT.GetCountry.GetNameWithNoTooltip] разбогатеет."
 cardinal_scope_equal:0 "Является [CHARACTER.GetName]"
 cartographic_survey_events.30.desc:0 "На третий день работ поднялась буря: она выбросила съёмочное судно на подветренный берег, где оно две холодные ночи билось в бурунах, и разметала шлюпки, посланные снять картографов с рабочих станций. Когда ветер стих и судно сняли с мели, сезон был уже потерян, инструменты промокли, а двух помощников боцмана похоронили в дюнах над берегом. Карта побережья у [target_location.GetName] осталась такой же пустой, как прежде."
 castelnaudary.catalan_dialect:0 "Кастельноу-д’Арри"
 castile_conquer_maghreb:0 "Захват побережья региона $maghreb_region$"
 castile_less_likely_to_conquer_portugal_tt:0 "[target_ally.GetName] с гораздо меньшей вероятностью станет [Concept('conquer', 'завоёвывать')|e] области [ShowAreaName('north_portugal_area')] или [ShowAreaName('south_portugal_area')]"
 castres.catalan_dialect:0 "Кастрес"
 catholic_pop_conversion.tt:0 "Они обратят часть [Concept('pops', 'населения')|e] района [THIS.GetLocation.GetName] в [ShowReligionName('catholic')]"
 cawa:0 "Полки чева"
 character_named_script_value_less_than:0 "Возраст персонажа [CHARACTER.GetName] меньше $VALUE|0$"
 character_on_pilgrimage_duration_desc:0 "до окончания паломничества"
 chi_expedition_is_returning_to_china:0 "$expedition_name_treasure_voyage$ раздала все дары и до конца плавания больше не будет заходить в чужеземные порты"
 chi_leading_expedition_duration_desc:0 "до окончания экспедиции золотого флота"
 chi_we_will_continue_playing_as_target_country:0 "Мы продолжим игру за мятежников, которые станут державой [ShowFormableCountryName('CSH_f')]"
 circumnavigation_expedition_events.10.b:0 "Высадить вооружённых людей, вернуть шлюпку и взять то, что нам нужно."
 circumnavigation_expedition_events.10.c:0 "Забрать с каноэ что удастся и немедленно уходить в море."
 circumnavigation_expedition_events.11.a:0 "Вступиться за союзника. Пусть Мактан узнает нашу силу."
 circumnavigation_expedition_events.11.b:0 "Взять то, что дают острова, и плыть дальше. Это не наша война."
 circumnavigation_expedition_events.11.c:0 "Водрузить королевский штандарт. Пусть корона запишет это открытие."
 circumnavigation_expedition_events.11.title:0 "Кровь и вера на Себу"
 circumnavigation_expedition_events.12.a:0 "Забить трюмы доверху; наш груз — [ShowGoodsNameWithNoTooltip('cloves')]. Ради этого мы и прошли полмира."
 circumnavigation_expedition_events.12.b:0 "Заключить договор с султаном. Союз ценнее любого груза."
 circumnavigation_expedition_events.14.a:0 "Привести судно в порядок: законопатить швы, наполнить бочки, накормить людей."
 circumnavigation_expedition_events.14.b:0 "Лишь короткая стоянка. Как следует люди отдохнут дома."
 circumnavigation_expedition_events.15.a:0 "Держаться легенды. Закупиться быстро, пока не начались расспросы."
 circumnavigation_expedition_events.15.b:0 "Не рисковать в гавани соперника. Идти домой, пусть и впроголодь."
 circumnavigation_expedition_events.16.a:0 "Отправить охотников за козами и наполнить бочки у родников."
 circumnavigation_expedition_events.18.b:0 "Подавить мятеж силой. Зачинщики ответят за всё."
 circumnavigation_expedition_events.19.a:0 "Отдохнуть и полностью пополнить запасы. Такой дружественный берег — редкость."
 circumnavigation_expedition_events.19.b:0 "Короткая стоянка с благодарностью — и на юг. Время года не ждёт."
 circumnavigation_expedition_events.19.historical_info:0 "Северо-восточный выступ Бразилии — Пернамбуку, Параиба, Риу-Гранди — был одной из самых ранних и богатых областей иберийских поселений в Новом Свете: его побережье окаймляли заросли бразильского дерева, а вскоре и сахарные плантации. Корона, владевшая этими гаванями, могла снабдить флот водой и провизией на собственной земле перед долгим переходом в южные широты — роскошь, которой Магеллан, пробиравшийся через воды соперника, так и не знал."
 circumnavigation_expedition_events.20.a:0 "Осторожно выменять провизию в колонии державы [rival_crown.GetNameWithNoTooltip]."
 circumnavigation_expedition_events.21.a:0 "Выдавать свежие припасы по норме и стоять, пока не минует худшее."
 circumnavigation_expedition_events.21.b:0 "Нет времени. Идти дальше; сильные выдержат."
 circumnavigation_expedition_events.21.b.tt:0 "Переход продолжается, а больные брошены на волю судьбы. Многие не увидят дальнего берега, а выживших будет слишком мало, чтобы привести домой весь флот"
 circumnavigation_expedition_events.22.b.lose_tt:0 "Риск не оправдывается: во тьме флот разбрасывает в стороны, и с рассветом один из кораблей может не отозваться"
 circumnavigation_expedition_events.23.a.tt:0 "Флот кренгуется на пустынном берегу и делает что может; работа медленная и дорогостоящая, но корпуса ещё какое-то время продержатся"
 circumnavigation_expedition_events.23.c:0 "Идти в ближайшую дружественную гавань и переоснастить судно."
 circumnavigation_expedition_events.23.c.tt:0 "Флот заходит в ближайшую дружественную гавань и спокойно чинится — ремонт куда надёжнее, чем на любом пустынном берегу, а командам выпадает долгожданный отдых"
