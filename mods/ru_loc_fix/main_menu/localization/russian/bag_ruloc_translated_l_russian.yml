 guelphs_and_ghibellines_factional_deadlock:0 "Тупик в борьбе фракций"
 guelphs_and_ghibellines_factional_deadlock_desc:0 "Обе фракции немного теряют в [Concept('prestige', 'престиже')|e] и [Concept('government_power', 'власти правительства')|e], а если [GetUniqueInternationalOrganization('hre').GetName] ещё существует, итальянские участники фракции гвельфов покидают её."
 guelphs_and_ghibellines_ghibelline_triumph:0 "[GetUniqueInternationalOrganization('ghibellines_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_ghibelline_triumph_desc:0 "[GetUniqueInternationalOrganization('hre').GetName] вбирает в себя все подходящие итальянские державы вместе с их районами."
