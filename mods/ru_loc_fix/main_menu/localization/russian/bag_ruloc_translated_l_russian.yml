 chinese_treasure_expeditions_send_tooltip:0 "$expedition_name_treasure_voyage$ отправляется в путь. Цель — [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName], во главе — [character_expedition_leader_target.GetName].\nНа борту флота груз стоимостью #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [Concept('gold', 'дукатов')|e], предназначенный в дар [Concept('countries', 'державам')|e], которые он посетит"
