 nav_appanage_support_for_french_throne_tt:0 "Если [ROOT.GetCountry.GetNameWithNoTooltip] — апанаж, то при отношениях #G +150#! с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
