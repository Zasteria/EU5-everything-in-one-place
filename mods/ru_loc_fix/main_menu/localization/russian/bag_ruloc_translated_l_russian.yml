 zaragoza_basilica_del_pilar_work_of_art_desc:0 "Базилика Нуэстра-Сеньора-дель-Пилар посвящена Деве Марии и, по преданию, была основана после явления Девы апостолу Иакову, который, как считается, проповедовал $christian$ на Пиренейском полуострове. Со временем церковь расширялась, а романский храм начали возводить после завоевания города [ShowLocationName('zaragoza')] в XII веке."
 zayyanid_pretenders_decision.desc.entry:0 "Правление нашего сюзерена поистине тиранично. Оно до основания подрывает превосходство племён $banu_al_wad$. Пригласим же принца из династии [ShowDynastyName('zayyanid_dynasty')], чтобы он вновь правил нами, и сплотим сословие «[ShowEstateTypeName('tribes_estate')]» против общего врага."
