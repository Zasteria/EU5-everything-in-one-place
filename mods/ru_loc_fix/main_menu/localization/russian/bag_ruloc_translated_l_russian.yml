 council_of_trent.1001.desc:0 "[GetCountry('PAP').Custom('GetRulerOrRegentTitle')] приглашает нас на $council_of_trent$, чтобы обсудить, какие реформы нужны, чтобы исцелить церковь от испорченности и других недугов. Собор обсудит, что следует считать [ShowReligionAdjective('lutheran')]ой ересью, и определит церковное учение о Писании и Предании, первородном грехе, оправдании, таинствах, евхаристии на мессе и почитании святых. Он также попытается ответить на [ShowReligionAdjectiveWithNoTooltip('lutheran')]ие претензии, рассмотрев запрет обычаев, которые пятнают доброе имя церкви, — например, частого отсутствия епископов на своих кафедрах и всевозможных мирских излишеств духовенства."
