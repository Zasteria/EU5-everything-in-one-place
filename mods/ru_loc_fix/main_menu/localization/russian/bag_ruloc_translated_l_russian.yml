 expedition_succession_events.1.desc:0 "В [ROOT.GetCountry.GetCapital.GetName] приходит донесение о том, что командир экспедиции скончался. К счастью, среди офицеров на борту есть человек, чьих знаний и отваги достаточно, чтобы читать морские карты и держать экипаж в руках, и после этой утраты остальные уже слушаются его.\n\nЭкипаж утверждает его командиром, и экспедиция продолжает путь под его началом."
 expedition_succession_events.2.desc:0 "В [ROOT.GetCountry.GetCapital.GetName] приходит донесение о том, что адмирал флота скончался. Без командира флоту в этих водах не пройти, но, к счастью, один из офицеров достаточно старший и опытный, чтобы остальные приняли его слово как закон, и он уже занял место на квартердеке.\n\nОфицеры признают его новым командующим флотом, и плавание продолжается под его руководством."
 flavor_cas.126.a:0 "Приятного аппетита!"
 flavor_cas.147.desc_positive:0 "Нашему поисковому отряду наконец удалось найти обломки «Сан-Хосе». Галеон затонул у самого берега, на мелководье, и наши ныряльщики и спасатели смогли добраться до его драгоценного груза. Большую часть сокровищ подняли со дна, и теперь ими владеет [ROOT.GetCountry.GetName]. Осталось решить, как распределить вновь обретённое богатство."
 flavor_cas.35.desc:0 "Честолюбивый и храбрый конкистадор по имени [target.GetName] явился ко двору, взахлёб рассказывая о несметных богатствах и плодородных землях далёкого Нового Света. Отвага и решимость этого человека не подлежат сомнению, и теперь он хочет, чтобы сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» поддержало его экспедицию для исследования и покорения загадочных земель в Андах."
 flavor_cas.35.title:0 "Экспедиция: [target.GetLastNameWithNoTooltip]"
 flavor_cas.36.a:0 "Поддержать экспедицию: [target.GetLastNameWithNoTooltip]."
 flavor_cas.36.desc:0 "Конкистадор по имени [target.GetName] прославился своими дерзкими деяниями в Новом Свете. [target.GetLastNameWithNoTooltip] известен стремлением расширить влияние державы [ROOT.GetCountry.GetName] в регионе [ShowRegionName('mesoamerica_region')] и уже нацелился на [ShowLocationName('tenochtitlan')]. Теперь он ищет нашей поддержки для новых предприятий. Ходят рассказы о несметных богатствах и невиданных возможностях, и кое-кто полагает, что его поддержка принесёт державе [ROOT.GetCountry.GetNameWithNoTooltip] небывалую славу и богатство."
