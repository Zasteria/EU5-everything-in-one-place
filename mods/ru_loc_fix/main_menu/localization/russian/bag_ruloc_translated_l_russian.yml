 religious_orders.1.title:0 "Благочестивое завещание"
 religious_orders.202.a:0 "Пусть возводят своё командорство."
 religious_orders.202.b:0 "На рубеже им пока не место."
 religious_orders.202.desc:0 "Наши воины вырвали из рук неверных район [ro_conquest_location.GetName], и [ro_conquest_order.GetName] уже видит в нём своё предназначение. Там, где вера ещё не пустила корней, братья хотели бы основать командорство — дом молитвы и меча на новом рубеже — и просят нашего дозволения его воздвигнуть."
 religious_orders.202.title:0 "Плацдарм в землях неверных"
 rila_monastery_holy_site:0 "Рильский монастырь"
 rila_monastery_work_of_art:0 "Рильский монастырь"
 rila_monastery_work_of_art_desc:0 "Основанный в X веке отшельником Святым Иоанном Рильским в суровых горах того же названия, этот православный монастырь вскоре стал духовным маяком славянского христианства. Он был важным местом паломничества и с момента основания получал щедрые пожертвования от всех болгарских правителей. В тяжёлые времена монастырь играл ключевую роль в сохранении болгарского языка, литературы и религиозных традиций, а его монахи хранили богатую традицию переписки рукописей, иконописи и сочинения церковных гимнов."
 rise_of_the_ottomans_anatolia_fragmented:0 "[ShowRegionNameWithNoTooltip('anatolia_region')] остаётся раздробленной"
 rise_of_the_ottomans_anatolia_fragmented_desc:0 "Каждый уцелевший бейлик, у которого ещё есть принцип «[ShowGovernmentReformName('legacy_of_osman')]», лишается его, а вместе с ним и полученной благодаря ему [Concept('government_power', 'власти правительства')|e]."
 rise_of_the_ottomans_beylik_ascendant:0 "Один из бейликов возвышается"
 rise_of_the_ottomans_beylik_ascendant_desc:0 "Господствующий бейлик получает доступ к государственным принципам державы османского образца и к политике «[ShowPolicyName('eyalet_division')]»."
 rise_of_the_ottomans_beyliks_extinguished:0 "Бейлики угасли"
 rise_of_the_ottomans_beyliks_extinguished_desc:0 "Каждый уцелевший бейлик, у которого ещё есть принцип «[ShowGovernmentReformName('legacy_of_osman')]», лишается его, а вместе с ним и полученной благодаря ему [Concept('government_power', 'власти правительства')|e]."
 rise_of_the_ottomans_era_closes:0 "Эпоха бейликов завершается"
 rise_of_the_ottomans_era_closes_desc:0 "Каждый уцелевший бейлик, у которого ещё есть принцип «[ShowGovernmentReformName('legacy_of_osman')]», лишается его, а вместе с ним и полученной благодаря ему [Concept('government_power', 'власти правительства')|e]."
 rise_of_timur_conquests_stall:0 "Завоевания остановились"
 rise_of_timur_conquests_stall_desc:0 "[GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.GetName] лишается бонуса к походам, а все ещё не исполненные завоевательные претензии к державе [GetCountry('TIM').GetName] утрачивают силу, если только [GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.GetNameWithNoTooltip] и его потомки не обрели прочный императорский титул."
 rise_of_timur_empire_forged:0 "Выкована империя"
 rise_of_timur_timurids_subjugated:0 "[GetCountry('TIM').GetNameWithNoTooltip] покорены"
 rodos.english_language:0 "Родос"
 rus_free_economic_society_decision.desc:0 "Сельское хозяйство по-прежнему остаётся основой нашего общества, однако приёмы земледелия, которыми пользуются [ShowPopTypeName('peasants')], косны и малоурожайны в сравнении с соперничающими державами. Один из творцов нашей политики предложил за скромную цену учредить экономическое общество для развития знаний в земледелии и торговле и вызвался сам взять на себя руководство им.\n\nЕсли общество добьётся успеха, ему следует также заняться просвещением земледельцев и подготовкой умелых работников — давать практические советы, издавать журналы и научные труды по этим вопросам."
 rus_nakaz_decision.a:0 "Прогресс бывает болезненным."
 rus_nakaz_decision.b:0 "Ограничимся реформой уголовных наказаний."
 rus_nakaz_decision.c:0 "Мы не осмелимся."
 rus_nakaz_decision.desc:0 "Всё очевиднее, что [ROOT.GetCountry.GetName] нуждается в скорейшем вступлении в новую эпоху просвещения и прогресса. Этому послужит смелый пересмотр свода законов в согласии с животворными принципами, охватившими Европу, — разумом, справедливостью и человеколюбием. Приняв эти ценности, мы наконец избавимся от устаревших правовых практик, что тормозят общественное развитие. Встанем же на путь реформ и утвердим равенство всех подданных перед законом."
 rus_nakaz_decision.historical_info:0 "#italic Наказ#!, или #italic Наказ Комиссии о составлении проекта нового Уложения#!, — свод законов, составленный Екатериной Великой для реформы и модернизации правовой системы. Написанный под влиянием идей Просвещения, он стремился согласовать законодательство с прогрессивной философией своего времени, а также упростить и прояснить законы. Наказ вводил более гуманные наказания, ограничивал применение пыток и провозглашал равенство всех подданных перед законом. Из-за сопротивления многочисленных консервативных сил он так и не был воплощён в полной мере, и со временем Екатерина обратилась к иным заботам."
 rus_nakaz_decision.title:0 "Наказ"
 rus_nakaz_decision.tt1:0 "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] возмущены угрозой своему могуществу"
 rus_nakaz_decision.tt3:0 "Уступки консерваторам усиливают их позиции"
 rus_proclaim_tsardom_decision.desc:0 "Собирание земель Русских завершено, [GetInternationalOrganizationType('tatar_yoke').GetName] сброшено. Как [GetCountry('RUS').GetFlavorRank], мы ныне стоим превыше всех прочих княжеств, и [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] призывают нас принять сан, достойный такого величия: пусть наш государь венчается как [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], наследник древних императоров и хранитель [ShowReligionAdjective('orthodox')]ой веры.\n\nТакое венчание возвестит каждому двору Европы и каждому ханству степи, что [GetCountry('RUS').GetName] не склоняется ни перед какой чужеземной короной."
 rus_proclaim_tsardom_decision.historical_info:0 "16 января 1547 года Иван IV Московский венчался на царство в Успенском соборе Кремля — первым из московских правителей он был официально облечён царским титулом. Митрополит Макарий, ратовавший за новый сан, возложил на него шапку Мономаха — украшенный драгоценными камнями венец с меховой опушкой, который, по придворному преданию, был за несколько столетий до того дарован византийским императором Константином IX великому князю Владимиру Мономаху.\n\nНовый титул знаменовал сознательный отказ от прежнего великокняжеского титулования и утверждал ранг, равный императорскому, — ранг наследника павших христианских империй Востока. Иностранные дворы не спешили его признавать: понадобились десятилетия дипломатии, прежде чем Священная Римская империя и папский престол согласились считать царя равным королю, а не просто переводом титула великого князя."
 sacred_war_banner:0 "Священное знамя"
 sacred_war_banner_desc:0 "Боевое знамя из выцветшей, истёртой ткани, которое, как говорят, реяло над победами первых верующих. Ныне его хранят как священное сокровище государства и выносят лишь в самые святые дни, чтобы пробудить в верующих праведную ярость."
 santiago_de_compostela_holy_site:0 "Сантьяго-де-Компостела"
 santiago_de_compostela_work_of_art:0 "Собор Святого Иакова"
 santiago_de_compostela_work_of_art_desc:0 "$santiago_de_compostela_work_of_art$ — конечная точка #italic Камино-де-Сантьяго#!, самого многолюдного христианского паломнического пути средневекового мира; по преданию, здесь покоится апостол Иаков Старший. Строительство собора началось в 1075 году при Альфонсо VI Кастильском, а главный неф в романском стиле был в основном завершён в начале XIII века. Его вечно раскачивающееся #italic ботафумейро#! — огромное серебряное кадило — очищает верующих, проделавших долгий путь со всех концов христианского мира."
