 flavor_dan_skane_war.8.desc:0 "Держава [GetCountry('SWE').GetName] отвергла наше предложение выкупить сюзеренитет над державой [GetCountry('SKE').GetName]. Этот досадный поворот событий не оставляет нам иного выбора, кроме как искать другие средства, если мы и дальше хотим добиваться того, чтобы держава [GetCountry('SKE').GetNameWithNoTooltip] перешла к нам."
