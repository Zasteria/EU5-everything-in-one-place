 flavor_fra.1134.entry:0 "$name_stephen.french_language$ $Marcel$ погиб"
 flavor_hol.19.title:0 "Узник Голландии"
 flavor_hun.380.title:0 "Королевское плацет"
 flavor_hun.470.title:0 "Привилегия для славян"
 flavor_iberian_union.1.desc:0 "Брак, соединивший короны двух держав — [iu_member_a.GetName] и [iu_member_b.GetName], — даёт нам возможность выковать прочную связь между нашими королевствами. Пусть этот союз родился из политической нужды, [ROOT.GetCountry.GetGovernment.GetAdjective]ая чета, похоже, вполне счастлива в браке: супруги вместе трудятся над укреплением унии, возводя прочное политическое здание, которое сможет стать одной из ведущих сил на континенте [ShowContinentName('europe')]."
 flavor_iberian_union.1.historical_info:0 "Самая знаменитая из иберийских династических уний возникла в 1469 году благодаря браку Изабеллы I Кастильской и Фердинанда II Арагонского — Католических королей. Их союз объединил две величайшие короны полуострова, сохранив при этом собственные институты каждой из них, а их внук Карл унаследовал обе короны как единое государство. Столетие спустя, в 1580 году, Филипп II Испанский заявил права на опустевший португальский престол и объединил Кастилию, Арагон и Португалию под властью испанских Габсбургов — вплоть до Португальской реставрации 1640 года."
 flavor_iberian_union.2.a:0 "Пусть наши королевства процветают как одно целое."
 flavor_iberian_union.2.desc:0 "Короны региона [ShowRegionName('iberia_region')] перешли к одному государю. То, что начиналось как брак двух домов, стало личной унией: престолы наших держав ныне венчают одно чело. Каждое королевство хранит свои законы, свои суды и свою гордость, но в вопросах легитимности и династии они говорят единым голосом. Рождается Иберийская уния, а с ней — надежда на державу, способную соперничать с любой другой во всём христианском мире."
 flavor_iberian_union.2.historical_info:0 "Когда наследник двух корон получал обе, возникало не единое королевство, а составная монархия — отдельные государства под властью общего государя. Именно так была устроена Испанская монархия: Кастилия, Арагон, а позднее и Португалия сохраняли собственные #italic кортесы#!, законы и управление под властью общего короля. Такие унии существовали лишь до тех пор, пока жила общая династия, и отсутствие наследника могло разъединить то, что соединил брак."
 flavor_iberian_union.3.a:0 "Отправим брачное предложение стране [iu_partner_a.GetNameWithNoTooltip]."
 flavor_iberian_union.3.b:0 "Лучше обратимся к стране [iu_partner_b.GetNameWithNoTooltip]."
 flavor_iberian_union.3.desc:0 "Пока [initiator_candidate.GetName] [Select_CString(initiator_candidate.IsFemale, 'не замужем', 'не женат')], вопрос престолонаследия тяжким грузом нависает над страной [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] настаивает, чтобы сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подыскало подходящий брак и тем обеспечило преемственность власти. Прозвучало и предложение связать нашу судьбу с одной из других [ShowReligionGroupAdjective('christian')]их корон региона [ShowRegionName('iberia_region')]. Без сильного наследника нашей державе ([ROOT.GetCountry.GetFlavorRank]) могут грозить смуты, соперничество претендентов и даже иноземное вмешательство."
 flavor_iberian_union.3.historical_info:0 "Событие под названием «Иберийская свадьба» отражает борьбу за наследство Энрике IV Кастильского. После его смерти престол оспаривали две претендентки: Изабелла Кастильская, которую поддерживал её муж Фердинанд Арагонский, и её племянница Хуана, за которой стояла Португалия. Война завершилась победой Изабеллы и Фердинанда: власть Изабеллы утвердилась, и началось знаменитое правление Католических королей. Позднее этот союз Кастилии и Арагона привёл к созданию единой Испании."
 flavor_iberian_union.4.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] принимает посланника из страны [iu_initiator.GetName]. Нам предлагают династический брак между [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] из нашего собственного дома, чтобы соединить наши королевства. Это предложение сулит взаимное процветание и стабильность, однако некоторые наши советники относятся к нему с недоверием. Такой союз мог бы обеспечить нам поддержку против общих врагов и даже привести к объединению корон, но иные предостерегают, что со временем он может угрожать нашей независимости."
 flavor_iberian_union.5.desc:0 "Колокола звонят по всей нашей державе ([ROOT.GetCountry.GetFlavorRank]) и по всей стране [iu_chosen.GetName]: [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] вступают в брак, соединяясь в единый [ROOT.GetCountry.GetGovernment.GetAdjective]ий дом. Люди заполняют улицы, а оба двора поднимают кубки за союз, который так долго и упорно устраивали послы и епископы. То, что прежде было делом холодного расчёта, ныне скреплено клятвами и празднеством.\n\nЭтот брак дарует нам куда больше, чем один сезон торжеств. Наши династии соединены, наши дома связаны кровью, и если этот союз будет благословлён ребёнком, который унаследует обе короны, однажды наши королевства смогут стать единым целым. А пока наше престолонаследие стало прочнее, и великолепие торжества возвышает нас среди дворов всего христианского мира."
 flavor_iberian_union.6.desc:0 "Страна [iu_chosen.GetName] отвергла наше брачное предложение. Это решение, несомненно, ещё долгие годы будет омрачать наши отношения, но главное — вопрос о нашем престолонаследии так и остаётся нерешённым."
 flavor_iberian_union.7.a:0 "Это оскорбление не останется без ответа."
 flavor_iberian_union.7.desc:0 "Правители страны [iu_initiator.GetName] предпочли связать свой дом с правящим домом страны [iu_chosen.GetName], а не с нами, хотя мы были ничуть не худшей партией. Обида жжёт, но она открывает и возможности: подобное оскорбление — достаточный повод силой взять то, что должно было достаться нам через брак."
 flavor_iberian_union.7.title:0 "Нами пренебрегли"
 flavor_kor.100.entry:0 "Северная экспедиция правителя"
 flavor_maj.28.title:0 "[target_location.GetNameWithNoTooltip] во всём блеске"
 flavor_mor.31.title:0 "Создание гарнизона: [ShowBuildingTypeNameWithNoTooltip('guich_garrison')]"
 flavor_mos.38.tt1:0 "$trinity_lavra_st_sergius_work_of_art$ находится в районе [ShowLocationName('pushkino')]"
 flavor_mos.38.tt2:0 "$st_sergius_relics$ находятся в районе [ShowLocationName('pushkino')]"
 flavor_mos.80.entry:0 "Восстание $Bolotnikov$а"
 flavor_nap.12.title:0 "#italic Государство Президий#!"
 flavor_nap.401.historical_info:0 "Восстание Томмазо Аньелло 1647 года было недолгим, но успешным выступлением простонародья против власти ненавистного герцога Аркоса. Итогом восстания стало провозглашение недолговечной Неаполитанской республики."
 flavor_nav.1.desc:0 "Взойдя в 1329 году на престол державы [ROOT.GetCountry.GetName], [target_character.GetName] и [target_character_2.GetName] правят рука об руку, и [ROOT.GetCountry.GetFlavorRank] не знает при них раздоров; однако соправители явно отдают предпочтение владениям в регионе [ShowRegionName('france_region')], которыми располагает [target_character_2.GetNameWithNoTooltip], и нередко уезжают туда — [ROOT.GetCountry.GetNameWithNoTooltip] подолгу остаётся без государей, пока они живут в своих [ShowCultureGroupNameWithNoTooltip('french_group')]их владениях.\n\nХотя в отсутствие правителей [ROOT.GetCountry.GetGovernment.GetCourtTitle] нашёл немало способных регентов и [ROOT.GetCountry.GetFlavorRank] не осталось без управления, в последние годы недовольство всё растёт: многие [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие сеньоры желают просить обоих государей надолго обосноваться в городе [ROOT.GetCountry.GetCapital.GetName], дабы [ROOT.GetCountry.GetFlavorRank] не показалось слабым в глазах алчных иноземных держав."
 flavor_nav.10.entry:0 "Столкновение Легисамонов и Самудио"
 flavor_nav.11.desc:0 "Хотя противостояние между сторонниками [ROOT.GetCountry.GetAdjective]ой и [GetCountry('CAS').GetAdjective]ой короны опустошило край и [ShowScriptedGeographyName('nav_contested_basque_borderlands')] лежит в руинах, [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие семьи совершили почти невозможное и в значительной мере восстановили влияние державы [ROOT.GetCountry.GetNameWithNoTooltip] на всё [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. И хотя [GetCountry('CAS').GetNameWithNoTooltip] ещё может попытаться вернуть контроль над краем, это, несомненно, дорого обойдётся — [GetCountry('CAS').GetAdjectiveWithNoTooltip]ий [GetCountry('CAS').GetGovernment.GetCourtTitle] заплатит за это немалую цену."
 flavor_nav.12.desc:0 "Хотя эрмандады, которые есть у державы [ROOT.GetCountry.GetName], прежде не раз проявляли себя надёжными союзниками, десятилетия кровной вражды между [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ими семьями довели страсти до точки кипения.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] не поскупился: многие сановники внесли средства на содержание [ROOT.GetCountry.GetGovernment.GetAdjective|U]ой ветви эрмандад. Дело это недешёвое, но, набрав силу, эрмандады помогут утвердить власть, которой обладает [our_ruler.GetName], над враждующими семействами и раз и навсегда их обуздать."
 flavor_nav.13.a:0 "[target_character.GetHeShe|U] [Select_CString(target_character.IsFemale, 'станет отличной наставницей', 'станет отличным наставником')]."
 flavor_nav.14.b:0 "[target_character.GetHerHis|U] влияние вызывает тревогу: [scope_our_consort.GetNameWithNoTooltip] слишком к нему прислушивается. Нужно их разлучить."
 flavor_nav.15.b:0 "Встать на сторону законного правителя державы [ROOT.GetCountry.GetNameWithNoTooltip] — [the_legal_heir.GetNameWithNoTooltip]!"
 flavor_nav.15.desc:0 "Хотя [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'правила', 'правил')] твёрдой рукой, недавно [our_ruler.GetSheHe] [Select_CString(our_ruler.IsFemale, 'тяжело заболела и слегла', 'тяжело заболел и слёг')]. Опасаясь, что [ROOT.GetCountry.GetGovernment.GetRulerTitle] доживает последние дни, Аграмонты, для которых [the_consort_usurper.GetName] — единственный достойный государь, втайне вручили [the_consort_usurper.GetHerHim] корону державы [ROOT.GetCountry.GetName].\n\nПока [the_legal_heir.GetNameWithNoTooltip] далеко и [ROOT.GetCountry.GetGovernment.GetCourtTitle] лишён [Select_CString(the_legal_heir.IsFemale, 'её', 'его')] присмотра, кое-кто из Бомонтов втайне отправил письма [the_legal_heir.GetHerHis] свите, надеясь сообщить [the_legal_heir.GetHerHim] об измене Аграмонтов. Если письма придут вовремя, ещё можно успеть собрать достаточно сторонников, чтобы раздавить заговор Аграмонтов, прежде чем он принесёт плоды."
 flavor_nav.16.c:0 "[target_character.GetSheHe|U] [Select_CString(target_character.IsFemale, 'должна быть остановлена', 'должен быть остановлен')]."
 flavor_nav.21.historical_info:0 "Хотя Жанна была обручена с Педро IV Арагонским, брак так и не состоялся. Историки предполагают, что она могла страдать каким-то недугом, из-за которого считалась незавидной невестой. Её место заняла младшая сестра Мария, которая и вышла замуж за Педро.\n\nПосле этого брака Жанна была вынуждена отказаться от прав на престол и удалилась во францисканское аббатство Лоншан под Парижем, вступив в орден клариссинок."
 flavor_nav.3.desc:0 "Унаследовав земли, которыми владели [GetCharacter('nav_philip_iii_evreux').GetName] и [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] правит теперь обширными владениями: в них входят [ROOT.GetCountry.GetName] и ряд земель в регионе [ShowRegionName('france_region')]. Хотя [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] и [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] правили совместно и [ROOT.GetCountry.GetNameWithNoTooltip] была их общей державой, [ROOT.GetCountry.GetFlavorRank] видело их лишь изредка: сами они предпочитали жить в регионе [ShowRegionNameWithNoTooltip('france_region')].\n\nТеперь, когда [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол, [ROOT.GetCountry.GetGovernment.GetCourtTitle] полон союзников, и многие из них настойчиво советуют [target_character.GetHerHim] надолго обосноваться в державе [ROOT.GetCountry.GetNameWithNoTooltip]; другие же полагают, что [ROOT.GetCountry.GetGovernment.GetRulerTitle] может питать куда более высокие замыслы — вплоть до спорного престола, ведь [ShowRegionNameWithNoTooltip('france_region')] до сих пор не знает бесспорного государя."
 flavor_nav.4.desc:0 "Многие и прежде подозревали, что [target_character.GetName] — [Select_CString(target_character.IsFemale, 'честолюбивая', 'честолюбивый')] [ROOT.GetCountry.GetGovernment.GetRulerTitle], но мало кто ожидал услышать о [target_character.GetHerHis] желании напрямую притязать на престол державы [fra_country.GetName]. Права, которыми обладает [target_character.GetNameWithNoTooltip], весомы, ведь [GetCharacter('nav_jeanne_ii_capet').GetShortName] происходила из династии [ShowDynastyName('capet_dynasty')]; однако одним из условий, на которых [GetCharacter('nav_jeanne_ii_capet').GetHerHis] признали наследницей державы [ROOT.GetCountry.GetName], был отказ от притязаний на престол державы [fra_country.GetNameWithNoTooltip].\n\nК тому же многие сеньоры державы [fra_country.GetNameWithNoTooltip] вряд ли в полной мере признают права, на которые притязает [target_character.GetNameWithNoTooltip], — этому препятствует древний [ShowHeirSelectionName('salic_law')]; и всё же некоторые полагают, что [target_character.GetHerHis] политического влияния в державе [fra_country.GetNameWithNoTooltip] хватит, чтобы [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'сумела', 'сумел')] переубедить самых могущественных сеньоров."
 flavor_nav.5.desc:0 "Поначалу усилия, которые [target_character.GetName] [Select_CString(target_character.IsFemale, 'прилагала', 'прилагал')], чтобы заручиться поддержкой, ни к чему не приводили: немало [fra_country.GetAdjectiveWithNoTooltip]их сеньоров заявили, что [fra_ruler.GetName] остаётся для них единственным законным государем, и отвергли права, на которые притязает [target_character.GetNameWithNoTooltip]. Но если склонить на свою сторону нескольких мелких [fra_country.GetAdjectiveWithNoTooltip]их сеньоров [target_character.GetNameWithNoTooltip] всё же [Select_CString(target_character.IsFemale, 'сумела', 'сумел')], то никто из советников, которых держит при себе [target_character.GetShortNameWithNoTooltip], не ожидал, что [Select_CString(target_character_2.IsFemale, 'влиятельная', 'влиятельный')] [target_character_2.GetName] примкнёт к лагерю, который возглавляет [target_character.GetNameWithNoTooltip], и предложит [target_character_2.GetHerHis] поддержку. Хотя [target_character_2.GetNameWithNoTooltip] принадлежит к [fra_country.GetAdjectiveWithNoTooltip]ому сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]», [Select_CString(target_character_2.IsFemale, 'она давно стала', 'он давно стал')] сущей занозой для короны: [fra_ruler.GetNameWithNoTooltip] не раз [Select_CString(fra_ruler.IsFemale, 'видела', 'видел')], как в Генеральных штатах срываются многие [fra_ruler.GetHerHis] начинания. Без сомнения, [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'стала', 'стал')] бы бесценным приобретением, однако кое-кто опасается, что [target_character_2.GetHerHis] устремления могут разойтись с замыслами, которые лелеет [target_character.GetNameWithNoTooltip], а потому [target_character_2.GetSheHe] может оказаться обузой.\n\nКроме того, [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'принесла', 'принёс')] весть: сеньоры державы [nrm_country.GetName] недовольны тем, как правит [fra_ruler.GetNameWithNoTooltip], и, вероятно, охотно поддержат притязания, которые выдвигает [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.6.a:0 "[target_character.GetHerHis|U] правление запомнят как честолюбивое, но ужасное."
 flavor_nav.6.b:0 "[target_character.GetSheHe|U] войдёт в историю как [Select_CString(target_character.IsFemale, 'покорительница', 'покоритель')] — ведь перед [Select_CString(target_character.IsFemale, 'ней', 'ним')] склонилась [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c:0 "[target_character.GetSheHe|U] запомнится тем, что [target_character.GetHerHis] сердце принадлежало державе [ROOT.GetCountry.GetNameWithNoTooltip], несмотря на [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')]ое происхождение."
 flavor_nav.6.desc:0 "Хотя [target_character.GetName] в последние годы [Select_CString(target_character.IsFemale, 'всё чаще хворала', 'всё чаще хворал')], [ROOT.GetCountry.GetGovernment.GetCourtTitle] был потрясён известием: минувшей ночью [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'погибла', 'погиб')] при пожаре в [target_character.GetHerHis] покоях. Слухи, которыми полнится [ROOT.GetCountry.GetGovernment.GetCourtTitle], шепчут, что во время лечения от [target_character.GetHerHis] недуга свеча упала на ложе, где [Select_CString(target_character.IsFemale, 'лежала', 'лежал')] [target_character.GetNameWithNoTooltip], и постель вспыхнула.\n\nТеперь на престол восходит [scope_our_heir.GetName], и честолюбия у нового государя меньше, чем было у [our_ruler.GetHerHis] предшественника; многие гадают, какими запомнят летописцы державы [ROOT.GetCountry.GetName] годы, когда [Select_CString(target_character.IsFemale, 'правила', 'правил')] [target_character.GetNameWithNoTooltip]."
 flavor_nav.7.desc:0 "Хотя в прошлом [ROOT.GetCountry.GetName] и [cas_country.GetName] не раз враждовали, правители державы [cas_country.GetNameWithNoTooltip] никогда не стремились покорить [ROOT.GetCountry.GetFlavorRank] целиком. Однако в пограничных землях — [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')] и [ShowProvinceDefinitionName('alava_province')] — уже давно нарастает напряжённость между самыми могущественными местными семействами: границы края очерчены плохо.\n\nПредставители, которых направили [cas_country.GetNameWithNoTooltip] и [our_ruler.GetName], трудились над разрешением пограничных споров, однако [ShowDisasterNameWithNoTooltip('castilian_civil_war')], охватившая державу [cas_country.GetNameWithNoTooltip], надолго застопорила переговоры, и вражда между видными местными династиями лишь усилилась.\n\nТеперь, когда держава [cas_country.GetNameWithNoTooltip] погрязла во внутренних распрях, представители этих семейств обратились к государю — [our_ruler.GetNameWithNoTooltip] — с прошением начать вторжение и занять спорные земли."
 flavor_nav.8.desc:0 "[ShowDisasterNameWithNoTooltip('castilian_civil_war')] окончена, однако её отголоски по-прежнему ощущаются по всему региону [ShowRegionName('iberia_region')]. Пограничные земли лишились большей части гарнизонов, и давняя вражда между местными семействами переросла в открытую войну.\n\nПоскольку держава [cas_country.GetName] ослаблена, [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetName] вряд ли сумеет в одиночку унять столь яростную смуту."
 flavor_nav.9.desc:0 "Хотя [ShowProvinceDefinitionName('biscay_province')] издавна служит яблоком раздора, за которое борются [cas_country.GetName] и [ROOT.GetCountry.GetName], этот край — родина многих знатных семейств, из которых самыми влиятельными и верными вассалами показали себя Аро. Однако [cas_country.GetNameWithNoTooltip] принялась напрямую упразднять титулы в этих землях, а затем и присоединять спорные владения, входящие в провинцию [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')].\n\nСвоими действиями [cas_country.GetNameWithNoTooltip] привела семейство Аро в ярость, и теперь Аро призывают [ROOT.GetCountry.GetGovernment.GetCourtTitle] финансировать мятежников в провинции [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')], чтобы расправиться с теми, кто поддержал [cas_country.GetAdjectiveWithNoTooltip]ую аннексию края."
 flavor_pap.1400.a:0 "Идите и воспламените весь мир!"
 flavor_pap.1401.a:0 "К вящей славе Божией!"
 flavor_pap.30.title:0 "«Конституции Святой Матери-Церкви»"
 flavor_pap.5.a:0 "Или Цезарь, или ничто."
 flavor_pol.19.entry:0 "Славный король"
 flavor_pol.20.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] с едва скрываемой досадой взирает на разлаженную машину власти, что зовётся у нас [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [ShowEstatePrivilegeName('liberum_veto')] срывает одно заседание за другим, а [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] превращают каждое из них в забаву: они мечут вето, словно дротики, и любое предложение гибнет прямо в зале заседаний.\n\nНо надежда ещё есть. Те, кто страшится навязанной извне централизации, — а таких среди сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» немало, — как ни парадоксально, могут предпочесть хаосу привилегий, что ныне грозят гибелью всему государству, реформы, после которых [ROOT.GetCountry.GetFlavorRank] окрепнет как единое целое."
 flavor_pol.20.entry:0 "Великий замысел короля"
 flavor_pol.21.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол с реформаторским пылом, который несёт с собой [ShowInstitutionName('enlightenment')], — и пыл этот тревожит наших соседей не меньше, чем восхищает наших философов. [target_character.GetHerHis|U] советники подготовили предложения, которые сметут и [ShowEstatePrivilegeName('liberum_veto')], и [ShowEstatePrivilegeName('nieszawa_privileges')], а на смену дворянскому своеволию придёт действенный законодательный порядок.\n\nОднако соседние дворы пристально следят за нами. Иностранным державам выгодно, чтобы наша держава, [ROOT.GetCountry.GetLongName], оставалась слабой, и их посланники, чья учтивость едва прикрывает угрозу, ясно дали понять, что любое усиление центральной власти будет воспринято как провокация. [ROOT.GetCountry.GetAdjective]ая корона, по их разумению, должна оставаться бессильной — и вопрос лишь в том, осмелимся ли мы на реформы под их бдительным взором."
 flavor_pol.21.entry:0 "Первый натиск короля"
 flavor_pol.22.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] выносит на суд собрания, что зовётся [ROOT.GetCountry.GetGovernment.GetParliament.GetName], самый смелый замысел обновления за всю историю государства [ROOT.GetCountry.GetName]: новую конституцию, которая упразднит [ShowEstatePrivilegeName('liberum_veto')], укрепит положение сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» и превратит нашу раздробленную страну в действенное современное государство.\n\nПосланники соседей уже передали свои послания. Слова их дипломатичны, смысл — нет. Если мы пойдём дальше, то рискуем навлечь иностранное вмешательство. Если же отступим, последний шанс на суверенитет, что ещё остаётся у нашей державы, [ROOT.GetCountry.GetNameWithNoTooltip], будет погребён под теми же дворянскими привилегиями, что душат нас уже больше века. Так или иначе, история запомнит этот миг."
 flavor_pol.40.title:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] державы [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_por.67.desc:0 "Моря за нашими берегами по-прежнему окутаны тайной, но купцы и путешественники рассказывают о далёких рынках, ломящихся от немыслимых богатств. Другие толкуют о могучем царстве пресвитера Иоанна, который, как говорят, основал свою державу где-то далеко в Индиях. Если бы нам только удалось отыскать морской путь в те земли за океаном, [ROOT.GetCountry.GetName] смогла бы напрямую прикоснуться к богатствам, которыми славится $india$ и лежащие за ней земли, и, быть может, даже объединить силы со сказочным царством пресвитера Иоанна."
 flavor_por.67.title:0 "В неизвестность"
 flavor_por.73.desc:0 "Минули годы с тех пор, как мы впервые обнаружили драгоценные металлы в регионе [ShowRegionName('brazil_region')], и за это время наши #italic бандейранты#! открыли обширные залежи, что манят людей из дальних краёв. Искатели удачи и работники в небывалых количествах стекаются теперь в регион [ShowRegionNameWithNoTooltip('brazil_region')], и по мере того как [ROOT.GetCountry.GetName] получает всё больше золота, наша казна наполняется сверх всякого прежнего воображения."
 flavor_por.73.title:0 "Бразильская золотая лихорадка"
 flavor_por.74.desc:0 "[ROOT.GetCountry.GetAdjective]ое влияние в регионе растёт: экспедиции наших #italic бандейрантов#! продолжают покорять внутренние земли региона [ShowRegionName('brazil_region')]. Недавно одна из таких экспедиций нанесла на карту прежде неведомые земли области [target_area.GetName]; [Select_CString(target_character.IsFemale, 'вела', 'вёл')] её [target_character.GetName]. Теперь [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'готова', 'готов')] поделиться с сословием «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» знаниями, которые [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'обрела', 'обрёл')] в том походе, если мы поддержим будущие экспедиции."
 flavor_por.74.historical_info:0 "Антониу Рапозу Таварес был одним из самых значительных #italic бандейрантов#!, исследовавших внутренние области Бразилии. Хотя его экспедиции повинны и в разорении иезуитских миссий, и в порабощении тысяч коренных жителей, походы Рапозу Тавареса значительно расширили португальское влияние за пределы, установленные Тордесильясским договором."
 flavor_por.75.desc:0 "Растущая потребность в рабочих руках в наших колониальных владениях толкнула многих #italic бандейрантов#! на набеги за рабами среди местных жителей. Теперь снаряжаются экспедиции, которые уходят далеко вглубь материка, чтобы захватывать коренных жителей и отправлять их на работу в рудники."
 flavor_por.75.historical_info:0 "Поначалу #italic бандейранты#! были исследователями и первопроходцами, но со временем их экспедиции всё чаще превращались в набеги ради захвата коренных жителей в рабство. На протяжении всего XVII века набеги на общины коренных народов и иезуитские миссии стали отличительной чертой многих #italic бандейр#, поставлявших подневольный труд для плантаций, поселений, а затем и для стремительно растущей горнодобывающей промышленности."
 flavor_por.76.historical_info:0 "Фернан Диаш, прозванный Охотником за изумрудами, был одним из самых прославленных #italic бандейрантов#!. Он известен семилетней экспедицией в неизведанные земли за Минас-Жерайсом на поиски легендарных изумрудов Сабарабусу — сказочного горного хребта, в недрах которого, как считалось, таились несметные богатства. Хотя своей изначальной цели экспедиция так и не достигла, Диаш подробно нанёс на карту неизведанные области, основал новые поселения и помог проложить пути, которые в конце концов привели к открытию богатейших золотых месторождений в глубине Бразилии."
 flavor_por.77.title_success:0 "Охотник за изумрудами"
 flavor_por.81.a:0 "Посмотрим, на что [target_artist.GetSheHe] [Select_CString(target_artist.IsFemale, 'способна', 'способен')]!"
 flavor_por.81.b:0 "Не будем стеснять [target_artist.GetHimHer]: пусть работает самостоятельно."
 flavor_por.81.desc:0 "Недавно на суд представили несколько работ, автор которых — [target_artist.GetName], и [ROOT.GetCountry.GetGovernment.GetCourtTitle] высоко ценит [target_artist.GetHimHer] мастерство. При дворе теперь советуют сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подумать о том, чтобы нанять [target_artist.GetHimHer] для создания новых произведений во славу державы [ROOT.GetCountry.GetName]."
 flavor_rus.27.entry:0 "Восстание $pugatchev$а"
 flavor_swe.48.title:0 "[birgitta_scope_for_ui.GetNameWithNoTooltip] причислена к лику святых"
 flavor_tim.1100.entry:0 "Возвышение Фазлуллаха"
 flavor_tim.5.entry:0 "Посольство в Китай"
 flavor_tle.13.a:0 "Превосходная мысль!"
 flavor_tle.3.desc:0 "Город [target.GetName], сердце всей нашей возлюбленной державы — [ROOT.GetCountry.GetFlavorRank], — пал под натиском гнусных врагов из страны [from_country.GetLongName]. И словно этой трагедии было мало, во время штурма погибли многие члены нашего любимого рода [target_dynasty.GetName].\n\nЭто бедствие повергло в отчаяние всю державу [ROOT.GetCountry.GetLongName] и сделало продолжение войны почти невозможным. Одних лишь убийств недостаточно, чтобы парализовать страну, — но утраты доверия к её правителям для этого вполне хватит. Племена-союзники нас покинули, боевой дух упал как никогда низко, а организованного сопротивления нет и в помине. Для нас [target_war.GetName] подходит к концу."
 flavor_tle.5.desc:0 "[target_character.GetName], претендент на [from_country.GetAdjective]ий престол, только что [Select_CString(target_character.IsFemale, 'вступила', 'вступил')] в [ROOT.GetCountry.GetCapital.GetName] под рукоплескания сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]» и посланцев сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]». Это открытое объявление войны: [from_country.GetName] бросает вызов державе [target_country.GetLongName], слишком долго правившей городом [ROOT.GetCountry.GetCapital.GetName]. [target_character.GetShortNameWithNoTooltip] пользуется широкой поддержкой в стране [from_country.GetNameWithNoTooltip], но главное — на [Select_CString(target_character.IsFemale, 'её', 'его')] стороне [ShowModifier('tle_zayyanid_tribe_support')]: [Select_CString(target_character.IsFemale, 'её', 'его')] поддерживает крупнейшее и могущественнейшее [ShowCultureName('zenati')]ое племя во всей державе ([ROOT.GetCountry.GetFlavorRank]), родное племя рода [target_dynasty.GetName].\n\nМы покажем этим [target_country.GetAdjectiveWithNoTooltip]им мерзавцам, за кем останется победа, — [target_war.GetName] решит всё!"
 flavor_tle.6.desc:0 "Все наши пылкие старания — дарованные привилегии, дипломатические миссии, роскошные подарки, пожалованные должности — пошли прахом: племена [from_country.GetName] по-прежнему поддерживают тирана [target_character.GetName] из рода [target_dynasty.GetName], а не куда более милосердную [target_country.GetAdjective]ую власть.\n\nЧто ж, быть по сему! Пусть испытают на себе гнев наших армий! Мы станем карающей десницей, и [ROOT.GetCountry.GetReligion.GetGodName] свершит через нас свой суд! Победа в этой войне — [target_war.GetName] — будет за нами!"
 flavor_tun.11.desc:0 "Децентрализация державы [ROOT.GetCountry.GetLongName] вырвана с корнем. Время, когда действовал принцип «[ShowGovernmentReformName('tun_strong_familial_governors')]», прошло, и весь регион [ShowScriptedGeographyName('ifriqiya_geography')] вновь объединён под знамёнами рода [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. Больше [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие сельские земли не будут страдать от разгула преступности; больше [ROOT.GetCountry.GetAdjectiveWithNoTooltip]их эмиров не будет шантажировать сословие «[ShowEstateTypeName('nobles_estate')]»; больше [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое государство не будет зависеть от поддержки чужеземцев.\n\nНастал час расплаты для старого порядка — и прекрасная возможность открыть новую эпоху."
 flavor_tun.13.desc:0 "[ShowReligionGroupAdjective('christian')]ие купцы, торгующие в стране [ROOT.GetCountry.GetName], уже получили обширные права — [ShowGovernmentReformName('catalan_merchant_privileges')]. И всё же, несмотря на это, несмотря на кварталы, которые мы так щедро им отводим, на право судиться лишь у своих, на дарованную им свободу вероисповедания, [target_country.GetAdjective]ие [target_country.GetGovernment.GetEstateName('burghers_estate')] по-прежнему требуют большего — иначе их родина может и вовсе прекратить с нами торговлю."
 flavor_tun.2.desc:0 "$flavor_tun.2.caliphal_backstory$\n\nСегодня от былого великолепия почти ничего не осталось. Внутренние неурядицы сильно подорвали власть нашего правителя — [ROOT.GetCountry.GetGovernment.GetRulerTitle], — который зовётся «$rank_empire_muslim_ruler_male$» лишь на словах. Мы должны вернуть державе [ROOT.GetCountry.GetLongName] власть халифа!"
 flavor_tun.3.desc:0 "$flavor_tun.2.caliphal_backstory$\n\nХотя в следующем столетии эта власть пошатнулась, нам удалось уберечь державу [ROOT.GetCountry.GetLongName] от падения в безвестность. Ныне [ROOT.GetCountry.GetFlavorRank] снова входит в число главных государств [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]ого мира."
 flavor_tun.4.desc:0 "[aging_monarch.GetName] всё сильнее тревожится о самом мрачном, но и самом важном решении, какое только приходится принимать стареющему монарху: о выборе [aging_monarch.GetHerHis] преемника. Казалось бы, ответ очевиден: [preferred_heir.GetName] всегда [Select_CString(preferred_heir.IsFemale, 'была любимицей', 'был любимцем')] нашего дорогого правителя — [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Загвоздка в других [aging_monarch.GetHerHis] детях. Это [future_usurper.GetName], [Select_CString(future_usurper.IsFemale, 'которая', 'который')] помогает вести дела правительства в городе [ROOT.GetCountry.GetCapital.GetName], и [third_way.GetName] из страны [target_country2.GetName] — возможный претендент на престол.\n\nЭтот выбор надолго определит стабильность державы [ROOT.GetCountry.GetLongName] — и тогда, когда [aging_monarch.GetShortNameWithNoTooltip] уже не будет в живых."
 flavor_tun.8.desc:0 "Престол державы [from_country.GetLongName] по праву наследования должен был перейти к [target_character2.GetName], однако власть [Select_CString(target_character.IsFemale, 'узурпировала', 'узурпировал')] [target_character2.GetHerHis] [target_character.GetSisterBrother] — [target_character.GetName]. [Select_CString(target_character.IsFemale, 'Она', 'Он')] стремительно [Select_CString(target_character.IsFemale, 'взяла', 'взял')] под контроль всю державу ([from_country.GetFlavorRank]) и [Select_CString(target_character.IsFemale, 'подчинила', 'подчинил')] себе двор — [from_country.GetGovernment.GetCourtTitle].\n\nКакое унижение: [target_character2.GetShortNameWithNoTooltip] не может стерпеть, что [target_character2.GetHerHis] имя так запятнано! [target_character.GetShortNameWithNoTooltip] не уйдёт от возмездия."
 flavor_ven.4.title:0 "«Искусство абака»"
 foix.catalan_dialect:0 "Фош"
 forcalquier.catalan_dialect:0 "Форкалкер"
 foreign_league_balkan_200_tt:0 "[GetUniqueInternationalOrganization('foreign_league_balkan').GetName] владеет не менее чем #Y 200#! [Concept('locations', 'районами')|e] в регионе [ShowRegionName('italy_region')]"
 fra_code_louis_decision.b.entry:0 "Пока что введём кодекс лишь в северных провинциях — остальная $FRA$ подождёт."
 fra_fouage_tax_decision.a.entry:0 "Введём подать в пользу сословия «$crown_estate$»."
 fra_fouage_tax_decision.c.entry:0 "Государство не станет оплачивать роскошь правителя."
 fra_marcel_great_ordinance_decision.desc.entry:0 "Генеральные штаты зашли в тупик в спорах о том, как оплатить наши нынешние войны. Третье сословие во главе с влиятельными купцами предложило «Великий ордонанс»: свою поддержку оно готово обменять на новые привилегии и полномочия для себя. Мы можем принять это предложение или же найти иной способ добиться денег от Генеральных штатов."
 fra_versailles_permanent_decision.a.entry:0 "$nobles_estate$ навсегда померкли в блеске Версаля."
 fra_versailles_permanent_decision.b.entry:0 "$nobles_estate$ исстари обладают властью, и с этим по-прежнему нужно считаться."
 fra_versailles_residence_decision.b.entry:0 "Дворец строили для услады королевской семьи — пусть так и остаётся."
 game_bias_modifier_struct:0 "#TOOLTIP:BIAS_MODIFIER,$DESC_KEY$ $KEY_LOC|L$#!"
 game_concept_ambition:0 "Амбиция"
 game_concept_ambition_definition:0 "Тип амбиции"
 game_concept_ambition_definition_desc:0 "<Вставьте описание типа добавляемого объекта>"
 game_concept_ambition_definitions:0 "Типы амбиций"
 game_concept_ambition_desc:0 "<Добавьте описание конкретного объекта, когда он станет активен>"
 game_concept_ambition_modifier:0 "Модификатор амбиции"
 game_concept_ambition_modifier_desc:0 "[Concept('modifier', 'Модификатор')|e], относящийся к [Concept('ambition', 'амбиции')|e]. Действует всё время, пока мы стремимся осуществить эту амбицию."
 game_concept_ambition_modifiers:0 "Модификаторы амбиций"
 game_concept_ambitions:0 "Амбиции"
 game_concept_industry_promotion_desc:0 "Поддержка отрасли закрепляет одну [Concept('area', 'область')|e] за одной отраслью промышленности. Каждая отрасль охватывает набор [Concept('goods', 'товаров')|e]: её поддержка повышает [Concept('output', 'объём выпуска')|e] каждого [Concept('building', 'сооружения')|e] в этой [Concept('area', 'области')], производящего эти [Concept('goods', 'товары')], а также повышает спрос ваших [Concept('pops', 'групп населения')|e] на них по всей [Concept('country', 'державе')|e].\n\nДля поддержки отраслей требуется [Concept('advance', 'улучшение')|e] [advance_icon][ShowAdvanceName('industry_promotion_advance')]. Сколько отраслей можно поддерживать одновременно, определяет показатель «$MODIFIER_TYPE_NAME_possible_industry_promotions$»; он растёт вместе с рангом [Concept('country', 'державы')], а также благодаря вашим [Concept('government_reforms', 'государственным принципам')|e] и последующим [Concept('advances', 'улучшениям')]. Поддержку можно отменить в любой момент, чтобы освободить ячейку."
 game_concept_industry_promotions:0 "Поддержка отраслей"
 game_concept_location_rank_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_capital_list_title:0 "[Concept('capital', 'Столицы держав')|e]"
 game_concept_location_rank_list_title:0 "Обычные районы"
 game_concept_location_rank_province_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_province_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_province_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_province_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_province_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_province_capital_list_title:0 "[Concept('province_capital', 'Столицы провинций')|e]"
 game_concept_location_rank_upper_desc:0 "У каждого [Concept('location', 'района')|e] свой ранг: район может быть [Concept('urban_location', 'городским')|e] или [Concept('rural_location', 'сельским')|e].\n\nЦвет значка ранга показывает, является ли [Concept('location', 'район')] столицей."
 game_concept_private_regiment:0 "Частный полк"
 game_concept_private_regiment_desc:0 "Частный полк — это [Concept('regiment', 'полк')|e], который [Concept('estate', 'сословие')|e] набирает и содержит в собственной частной армии, не расходуя наше [Concept('manpower', 'число рекрутов')|e]. Мы можем призвать такие полки к себе на службу, а после роспуска они возвращаются к сословию, а не пополняют наш запас рекрутов. Сословие, поднявшее восстание, отзывает все частные полки, которые нам одолжило."
 game_concept_private_regiments:0 "Частные полки"
 game_concept_promote_industry:0 "Поддержать отрасль"
 game_concept_tax_base_ratio_desc:0 "Каждый [Concept('location', 'район')|e] целиком добавляет своё [Concept('wealth', 'богатство')] к вашей [Concept('economical_base', 'экономической базе')|e]. [Concept('gold', 'Дукаты')|E] же поступают только с той [Concept('tax_base', 'налоговой базы')], которую вы собираете, поэтому низкое соотношение — признак страны, которая выглядит могущественной, но мало что может оплатить: её экономика так и не доходит до казны.\n\nПричина разрыва — [Concept('control', 'контроль')|e]. [Concept('location', 'Район')] теряет [Concept('tax_base', 'налоговую базу')] пропорционально своему [Concept('wealth', 'богатству')], поэтому больше всего даёт повышение контроля в богатых [Concept('locations', 'районах')], где он низок. Для этого не нужны ни новые сооружения, ни [Concept('pops', 'группы населения')|e] — лишь более крепкая власть над богатством, которое вы уже производите."
 game_concept_unit_families:0 "Семейства войск"
 game_concept_unit_family:0 "Семейство войск"
 game_concept_unit_family_desc:0 "Некоторые [Concept('unit_types', 'типы войск')|e] объединены в семейства, и у всех членов одного семейства общий лимит найма. Улучшение отряда до более нового члена того же семейства никогда не занимает дополнительного места, поэтому лимит ограничивает, сколько таких отрядов вы можете выставить всего, а не сколько отрядов каждой [Concept('age', 'эпохи')|e]."
 game_concept_unit_formation_preference_desc:0 "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
