 pilgrimage_expedition_outcome_overview:0 "$BULLET$Каждое [Concept('holy_site', 'святое место')|e], до которого доберётся наш [Concept('ruler', 'правитель')|e], само даёт награду по прибытии: ещё [Concept('legitimacy', 'легитимность')|e], [Concept('prestige', 'престиж')|e] или благодарность сословия [ShowEstateTypeName('clergy_estate')].\n$BULLET$Завершённое паломничество затем даёт — тем больше, чем благочестивее оно прошло:\n$BULLET_WITH_TAB$До #G +20#! [legitimacy].\n$BULLET_WITH_TAB$[Concept('estate_satisfaction', 'Удовлетворённость')|e] сословия [ShowEstateTypeName('clergy_estate')].\n$BULLET_WITH_TAB$Лучшее [Concept('opinion', 'мнение')|e] со стороны [GetCountry('PAP').GetName]."
 pilgrimage_expedition_ruler_owner_tt:0 "[pilgrimage_ruler.GetName] находится при дворе державы [pilgrimage_ruler.GetCourtCountry.GetName]"
