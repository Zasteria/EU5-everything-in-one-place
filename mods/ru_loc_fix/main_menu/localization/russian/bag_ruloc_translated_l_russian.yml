 WAR_LATERALVIEW_REIN_IN_SUBJECT_TOOLTIP:0 "Начать мирные переговоры, чтобы завершить эту войну за независимость и сохранить державу [COUNTRY.GetName] своим ленником.\n\nЕсли заключить мир без предоставления независимости, держава [COUNTRY.GetName] вернётся в статус [Concept('subject', 'ленника')|e]. Можно также просто договориться о [Concept('white_peace', 'мире на условиях «статус-кво»')|e] и закончить войну без территориальных изменений.\n\n#S У вас достаточно [Concept('war_score', 'военного счёта')|e], чтобы принудить державу [COUNTRY.GetName] к миру.#!"
