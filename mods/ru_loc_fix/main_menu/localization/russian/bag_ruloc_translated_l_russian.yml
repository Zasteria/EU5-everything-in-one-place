 relic_expedition_events.2.desc_damascus_repeat:0 "И снова [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] теперь знает, к кому здесь прислушиваются ([location_scope.GetRank.GetNameWithNoTooltip]) и во что это обходится."
 relic_expedition_events.2.desc_tyre_first:0 "Экспедиция прибывает в город [ShowLocationName('sur')]. [location_scope.GetRank.GetName] этот столь древен, что, по свидетельству Евангелий, через его земли проходил сам Христос; кроме того, это одна из последних твердынь на материке, которые крестоносцы удерживали до 1291 года. Здешнее архиепископство два столетия вело свои записи. То, что от них уцелело, разбросано по дюжине частных домов, и ни один хозяин не согласен с другим в том, что именно у него хранится."
 relic_expedition_events.3.desc_acre:0 "Простукиваются полые стены, переворачивается обрушившаяся кладка там, где её не тревожили поколениями. [relic_hunt_loc.GetRank.GetName] [ShowLocationNameWithNoTooltip('acre')] велик, но людей в нём почти не осталось, а один отряд может обыскать лишь малую его часть."
 removal_of_head_of_cabinet_takes_stab_tt:0 "[target_character.GetShortName] является нашим [Concept('head_of_the_cabinet', 'главой совета')|e], поэтому это [Concept('action', 'действие')|e] дополнительно будет стоить нам [ShowNamedValue('stability_mild_penalty')|+=2] [Concept('stability', 'стабильности')|e]"
 rise_of_timur.13.c:0 "[target_character.GetNameWithNoTooltip] — законный носитель титула «[ROOT.GetCountry.GetGovernment.GetRulerTitle]»."
 secretnoye_byuro_policy_tt:0 "Канцелярия была учреждена в ходе [Concept('decision', 'решения')|e] #Y «$rus_secretnoye_byuro_decision.title$»#!"
 selected_area_inspected_tt:0 "В выбранной [Concept('area', 'области')|e] будет проведена инспекция. Это снизит [Concept('pop_satisfaction', 'довольство')|e], но повысит [Concept('control', 'контроль')|e] над ключевыми [Concept('provinces', 'провинциями')|e] этой области.\n#italic Эффективность инспекции главным образом зависит от [Concept('population', 'населения')|e] [Concept('area', 'области')|e] и нашего показателя «[ShowModifierTypeName('legislative_efficiency')]»#!"
