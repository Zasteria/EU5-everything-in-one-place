 trinity_lavra_st_sergius_work_of_art_desc:0 "Этот монастырь, посвящённый Святой Троице, — средоточие духовной жизни $russian_group$ой $orthodox_ADJ$ой церкви. Со временем он разросся из скромной деревянной обители и стал привлекать людей со всех концов."
