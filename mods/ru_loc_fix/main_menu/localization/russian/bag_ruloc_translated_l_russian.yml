 namgyeong_desc:0 "В защищённой горами котловине, где река Хан изгибается в сторону Жёлтого моря, лежит область Ханян, заселённая ещё с доисторических времён. В древности за обладание ею соперничали царства Пэкче и Когурё. При династии Корё значение этого места выросло: здесь возник #italic Намгён#!, или Южная столица, — одна из трёх второстепенных столиц в дополнение к царской резиденции в Гэгёне. Сменявшие друг друга правители не раз задумывались о переносе сюда двора по совету геомантов, восхвалявших благоприятное расположение города. К началу XIV века Ханян вырос в крупный город Корё, находящийся под номинальным сюзеренитетом монгольского государства Юань, а стратегическое положение на реке Хан сделало его естественными вратами, соединяющими Корейский полуостров с остальным миром."
 nanbokuchou_imperial_line_broken:0 "Императорский род пресёкся"
 nanbokuchou_imperial_line_broken_desc:0 "Ни одному двору не удаётся утвердиться на престоле: столица остаётся на прежнем месте, священные регалии не собраны воедино, а императорское престолонаследие просто прерывается."
 nanbokuchou_imperial_reunification:0 "Императорский род воссоединяется"
 nanbokuchou_imperial_reunification_desc:0 "Один двор присоединяет другой под властью их общего правителя и образует воссоединённую державу [ShowFormableCountryName('YMT_f')], переносит столицу в [ShowLocationName('kyoto')] и помещает там три священные регалии."
