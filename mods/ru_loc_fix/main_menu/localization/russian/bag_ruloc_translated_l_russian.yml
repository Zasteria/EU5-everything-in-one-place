 secretnoye_byuro_policy_tt:0 "Канцелярия была учреждена в ходе [Concept('decision', 'решения')|e] #Y «$rus_secretnoye_byuro_decision.title$»#!"
 selected_area_inspected_tt:0 "В выбранной [Concept('area', 'области')|e] будет проведена инспекция. Это снизит [Concept('pop_satisfaction', 'довольство')|e], но повысит [Concept('control', 'контроль')|e] над ключевыми [Concept('provinces', 'провинциями')|e] этой области.\n#italic Эффективность инспекции главным образом зависит от [Concept('population', 'населения')|e] [Concept('area', 'области')|e] и нашего показателя «[ShowModifierTypeName('legislative_efficiency')]»#!"
 selected_holding_gains_grange_clearing:0 "Выбранное [Concept('holding', 'владение')|E] получит [Concept('modifier', 'модификатор')|e] «[ShowModifier('cultivators_grange_clearing_modifier')]» на #Y 5#! лет"
