 gaude_mater_polonia:0 "Гимн «Gaude Mater Polonia»"
 golden_age_of_piracy_brethren_crushed:0 "Пиратское братство разгромлено"
 golden_age_of_piracy_era_ends:0 "Золотой век угасает"
 golden_age_of_piracy_era_ends_desc:0 "Если независимая пиратская держава всё ещё располагает сильнейшим флотом среди своих собратьев, она получает модификатор «[ShowModifier('great_pirate_state_modifier')]», а её правитель остаётся в памяти как выдающийся администратор, дипломат и полководец."
 gra_construct_alhambra_increment_tt:0 "Добавляет #G +1#! к максимальному уровню сооружения [ShowBuildingTypeName('alhambra')]"
 grand_embassy.11.a:0 "Наблюдать и запоминать."
 grand_embassy.11.desc:0 "Покрой камзола, посадка парика, должная глубина поклона: придворные в [embassy_country.GetName] изучают всё это так же пристально, как любой договор, а неудачная длина подола может стоить репутации, на восстановление которой уйдут годы. Каждая складка и каждое перо несут смысл, недоступный непосвящённым, и делегацию, одетую не так, как подобает, здесь по-настоящему и не замечают. Один из придворных негромко предлагает объяснить, что здесь носят и почему, кому следует кланяться первым — и насколько низко."
 grand_embassy.11.title:0 "Придворная мода"
 grand_embassy.12.a:0 "Сидеть тихо и слушать."
 grand_embassy.12.desc:0 "В особняке неподалёку от дворца купцы, учёные и праздные дворяне почти каждый вечер собираются за кофе, чтобы спорить о том, о чём прежде предпочитали молчать: о налогах, о вере и о том, где пролегают пределы власти короны. Беседы затягиваются допоздна и становятся всё громче по мере того, как догорают свечи, и никого, похоже, не заботит, кто слушает, — лишь бы и ему было что сказать. Добиться приглашения в этот круг, пусть даже чужестранцу, вполне возможно — если кофе хорош, а суждения смелы."
 grand_embassy.12.title:0 "Салон идей"
 grand_embassy.2.a:0 "Пусть говорит [figurehead.GetShortNameWithNoTooltip], а [target_ruler.GetShortNameWithNoTooltip] останется среди свиты."
 grand_embassy.2.b:0 "Представить [target_ruler.GetShortNameWithNoTooltip] открыто — пусть все увидят [target_ruler.GetHerHim] без маски."
 grand_embassy.2.c:0 "Обойти [embassy_country.GetGovernment.GetCourtTitle] стороной. Мы приехали не для того, чтобы показываться."
 grand_embassy.3.a:0 "Открыть им доступ."
 grand_embassy.3.b:0 "Наши чудеса открыты для всех."
 grand_embassy.3.c:0 "Мы не позволим чужеземцам выведать наши секреты."
 grand_embassy.3.d:0 "Открыть им доступ, но без огласки."
 grand_embassy.4.a:0 "С благодарностью принять приглашение."
 grand_embassy.4.b:0 "Упросить хозяев позволить нам задержаться ещё дольше."
 grand_embassy.4.desc:0 "Теперь, когда стало известно, кто на самом деле путешествует с делегацией, [embassy_country.GetGovernment.GetCourtTitle] державы [embassy_country.GetName] передал нам приглашение: задержаться ещё ненадолго и увидеть больше из того, что здесь стоит увидеть."
 grand_embassy.5.a:0 "Вернуться домой."
 grand_embassy.5.b:0 "Попытаться спасти хоть что-то в [target_1.GetNameWithNoTooltip]."
 grand_embassy.7.a:0 "Вернуться домой."
 grand_embassy.7.b:0 "Отправиться дальше — в [target_1.GetNameWithNoTooltip]."
 grand_embassy.discretion_down_4_tt:0 "Проблеск узнавания (#R -4#! Осторожность)"
 grand_embassy_expedition_outcome_overview:0 "$BULLET$От того, насколько скрытно путешествует делегация, зависит, как долго её истинная цель остаётся тайной для каждого хозяина и как двор поведёт себя, когда правда раскроется.\n$BULLET$Каждый посещённый двор даёт некоторое количество «Возможностей» поучиться у него, а случайные встречи в пути могут развить навыки самого правителя, углубить «Модернизацию» или подорвать «Скрытность».\n$BULLET$По завершении посольства накопленная «Модернизация» ускоряет распространение [Concept('institutions', 'институтов')|e] во всех наших районах, причём в столице сильнее, чем в остальных, а также повышает [Concept('army_tradition', 'армейские традиции')|e] и, если посольство хоть раз заходило в порт, [Concept('navy_tradition', 'морские традиции')|e].\n$BULLET$Двор, отказавший делегации, стоит нам [Concept('prestige', 'престижа')|e]; двор, предоставивший доступ или уступивший просьбам о большем, приносит [Concept('prestige', 'престиж')|e] и новые «Возможности»."
 grand_tour_cooldown:0 "Гран-тур"
 grand_tour_events.1.a:0 "Тамошние дворы научат [target_leader.GetHerHim] тому, чему не научат книги."
 grand_tour_events.1.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в сборе, сундуки уложены, на дороге, ведущей на юг, выстраивается эскорт. Впереди ждёт [ShowRegionName('italy_region')] — край древних руин, учёности, которую принесло [ShowInstitutionName('renaissance')], и дворов, чьё политическое искусство заставляет север казаться юнцом. Всё, чему наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] научится там, определит судьбу державы на целое поколение. Остаётся лишь решить, чему именно мы намерены [target_leader.GetHerHim] научить."
 grand_tour_events.10.desc:0 "[target_location.GetName] — город, где построили колокольню, неспособную стоять прямо, но вместо того, чтобы снести её, просто продолжили строить; [target_location.GetRank.GetName] считает этот наклон предметом гордости, а не позором. Галер, что некогда делали его морской державой и соперником таких городов, как [ShowLocationName('genoa')] и [ShowLocationName('venice')], больше нет, но университет и соборная площадь остались.\n\nЗаезжий [ROOT.GetCountry.GetGovernment.GetHeirTitle] может здесь как учиться, так и бродить по гавани, что когда-то так много значила."
 grand_tour_events.11.desc:0 "[target_location.GetName] взбирается по зелёному склону вокруг базилики, воздвигнутой, чтобы хранить кости уроженца этих мест — монаха, у которого не было ничего и который сделал [target_location.GetRank.GetName] одним из величайших мест паломничества на Западе. Расписанные фресками стены базилики привлекают живописцев и паломников в равном числе.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] может провести это время среди фресок или среди братьев, что по сей день хранят устав ордена."
 grand_tour_events.12.desc:0 "[target_location.GetName] высится на холме за стенами, которые этруски возвели задолго до того, как Рим стал хоть что-то значить, и [target_location.GetRank.GetName] по сей день ежедневно проходит через их ворота, не задумываясь. Здешние живописцы в последнее время прославились так, что о них знает вся [ShowRegionName('italy_region')], а лекционные залы университета никогда не пустуют.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] может изучать либо старые стены, либо новые картины — как подскажет склонность."
 grand_tour_events.13.desc:0 "[target_location.GetName] стережёт речную переправу, где сходятся дороги из таких краёв, как [ShowRegionName('italy_region')], [ShowRegionName('balkan_region')] и [ShowLanguageName('german_language')]ие земли, и [target_location.GetRank.GetName] разжирел на пошлинах. В центре возвышается герцогский Хофбург — резиденция двора, который мнит себя чем-то большим, чем просто местная власть.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] наконец перевалил через Альпы; дальше дороги пойдут легче."
 grand_tour_events.14.desc:0 "[target_location.GetName] лежит на обоих берегах Влтавы, каменный мост связывает Старый город с замковым холмом, и [target_location.GetRank.GetName] держится как столица империи. Университет на холме притягивает студентов со всех концов [ShowLanguageName('german_language')]их земель и из краёв куда более дальних.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит город, который измеряет свою значимость веками, а не временами года."
 grand_tour_events.15.desc:0 "[target_location.GetName] берёт само своё имя от монахов, чьё поселение стояло здесь ещё до того, как герцоги поставили рядом рынок и монетный двор, и [target_location.GetRank.GetName] с тех пор изрядно разросся. Герцогский двор Виттельсбахов держит [target_location.GetRank.GetNameWithNoTooltip] в большем порядке, чем бывает в иных местах, а местные пивовары исправно снабжают его пивом.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] найдёт здесь и учёных, и хорошо устроенный двор."
 grand_tour_events.16.desc:0 "[target_location.GetName] лежит по обе стороны реки вокруг острова, увенчанного великим собором, и [target_location.GetRank.GetName] больше почти любого места, какое наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] успел повидать за это путешествие. Университетский квартал на левом берегу обучает богословию и праву больше студентов, чем живёт людей в большинстве городов.\n\nКоролевский двор, принимая гостей, держится с такой церемонностью, что не оставляет сомнений, какого он о себе мнения."
 grand_tour_events.17.desc:0 "[target_location.GetName] стоит при слиянии двух рек, и [target_location.GetRank.GetName] обратил это слияние в богатство: купцы из таких краёв, как [ShowRegionName('italy_region')], [ShowCultureGroupName('german_group')]ие земли и Фландрия, съезжаются сюда на королевские ярмарки, и тогда улицы так полнятся товарами — [ShowGoodsName('silk')], [ShowGoodsName('dyes')], — что склады не в силах их вместить. Здешние печатные станки работают почти так же быстро, как ткацкие.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] обнаруживает город, живущий торговлей, а не церемониями."
 grand_tour_events.18.desc:0 "Само имя — [target_location.GetName] — дано этому месту по дорогам, что здесь пересекаются, и [target_location.GetRank.GetName] по-прежнему служит той же цели: он стоит на реке, отделяющей [ShowLanguageName('french_language')]оязычные земли от [ShowLanguageName('german_language')]их. Шпиль его собора поднимается выше всего, что наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] видел за всё путешествие, — одинокая башня, парная к которой так и не была построена.\n\nВольный город управляет собой сам, и его печатники в последнее время стали значить не меньше, чем купцы."
 grand_tour_events.19.desc:0 "[target_location.GetName] — порт, существовавший ещё до того, как появился Рим: его основали [ShowCultureName('greek_culture')]ие мореходы, которые увидели гавань и остались здесь навсегда, и [target_location.GetRank.GetName] до сих пор насквозь пропах солью и дёгтем. У набережной теснятся галеры с половины Средиземноморья, а на рынках продают товары, которые никогда не доберутся до глубин страны, имя которой — [GetCountry('FRA').GetName].\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] понимает, что истинный правитель здесь — само море, а [target_location.GetRank.GetNameWithNoTooltip] лишь ему служит."
 grand_tour_events.2.desc:0 "$grand_tour_events.2.desc.geography_intro$ [ShowBuildingTypeName('venetian_arsenal')], раскинувшийся в восточной части города, способен за один рабочий день заложить киль боевого корабля и спустить его на воду полностью готовым. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal:0 "$grand_tour_events.2.desc.geography_intro$ Восточную часть города занимают обычные верфи, где без спешки, привычной для всех портов, какими славится [ShowContinentNameWithNoTooltip('europe')], строят торговые суда и боевые галеры. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.historical_info:0 "На Вознесенской неделе 1645 года английский джентльмен Джон Ивлин, совершавший тогда собственное долгое путешествие по Франции и Италии, побывал в одном из публичных театров Венеции на опере #italic «Эрколе в Лидии»#!. В дневнике он восхищается декорациями, сменявшимися тринадцать раз, и особо выделяет сопрано Анну Ренци, хотя одного певца-кастрата счёл даже превосходящим её, а генуэзского баса назвал «несравненным». Среди расписных перспектив и летающих машин зрелище «держало в плену наши глаза и уши до двух часов ночи». Венецию он покинул следующей весной, увозя сундуки, полные книг, гравюр и банок знаменитого венецианского териака."
 grand_tour_events.20.desc:0 "Имя этому месту — [target_location.GetName] — дал основавший его император, и с тех пор [target_location.GetRank.GetName] не переставал расти. Здешние банкирские дома ворочают суммами, рядом с которыми иные королевские казны выглядят скромно, а рейхстаг собирается здесь так часто, что [target_location.GetRank.GetNameWithNoTooltip] привык принимать князей.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] видит, что о деньгах здесь говорят так же открыто, как о родословной."
 grand_tour_events.21.desc:0 "[target_location.GetName] строит свой собор дольше, чем помнит кто-либо из ныне живущих: над крышами высится недостроенная башня, и на её вершине всё ещё стоит кран — там, где его оставили каменщики, — а [target_location.GetRank.GetName] давно привык к этому зрелищу. [target_location.GetRank.GetNameWithNoTooltip] стоит на Рейне, и река проносит мимо него больше товаров, чем почти где-либо ещё в [ShowLanguageName('german_language')]их землях, а здешний архиепископ правит не хуже любого князя.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит город, который измеряет терпение веками."
 grand_tour_events.22.desc:0 "[target_location.GetName] ведёт историю своих стен от римской колонии, некогда стоявшей здесь, и [target_location.GetRank.GetName] вырос в самый оживлённый порт этого побережья: гавань полна галер, везущих [ShowGoodsName('wool')], пряности и [ShowGoodsName('dyes')] по всему западному Средиземноморью. К здешнему морскому кодексу обращаются даже капитаны, ни разу не ступавшие на эту землю.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] почти завершил долгий путь домой."
 grand_tour_events.23.desc:0 "[target_location.GetName] венчает свой холм замком, где королей коронуют и хоронят, и [target_location.GetRank.GetName] относится к обоим обрядам с равной торжественностью. Здешний университет, старше большинства тех, что знают [ShowLanguageName('german_language')]ие земли, обучает астрономии и праву студентов со всего края, а купцы, везущие [ShowGoodsName('amber')] и [ShowGoodsName('salt')], круглый год не дают рынкам затихнуть.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] достигает последней великой остановки перед домом."
 grand_tour_events.26.desc:0 "[target_location.GetName] тянется вдоль реки за стенами, которые первыми возвели римляне, и [target_location.GetRank.GetName] давно их перерос, а мост его застроен собственными домами и лавками. Склады полны товара, и прежде всего это [ShowGoodsName('wool')], а парламент собирается так часто, что [target_location.GetRank.GetNameWithNoTooltip] привык быть местом, где решаются дела королевства.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит двор, ничуть не уступающий в честолюбии любому двору на континенте."
 grand_tour_events.27.desc:0 "[target_location.GetName] стоит там, где Луара поворачивает на север, прежде чем вновь устремиться к морю, и [target_location.GetRank.GetName] издавна наживается на движении по реке. Здешний университет преподаёт право почти так же строго, как тот, которым славится [ShowLocationName('bologna')], а стены выдерживали осады, которых не пережили другие города.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит здесь и учёных, и солдат, которым есть что рассказать."
 grand_tour_events.3.desc:0 "[target_location.GetName] меньше своей славы и куда необычнее. [target_location.GetRank.GetName] гудит от новых идей: философы зовут это возрождением античности, купцы — выгодным делом, живописцы — тем, как свет ложится на штукатурку. Прибыв на место, наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что нынче вечером двор принимает иноземных гостей, если только [target_leader.GetSheHe] не [Select_CString(target_leader.IsFemale, 'слишком утомлена', 'слишком утомлён')] дорогой.\n\nКроме того, есть и отдельное приглашение в монастырскую библиотеку, где тихо дожидается своего часа самое замечательное на всём христианском Западе собрание [ShowCultureName('greek_culture')]их рукописей."
 grand_tour_events.3.historical_info:0 "Осенью 1764 года больной шотландский романист Тобиас Смоллетт посетил галерею Уффици и, стоя перед Венерой Медицейской, которую все прочие путешественники Гран-тура восхваляли на веру, написал: «Не могу отделаться от мысли, что в чертах Венеры нет никакой красоты, а поза её неуклюжа и неестественна». Позднее Лоренс Стерн увековечил эту вспышку: его вымышленный Йорик у Пантеона в Риме корит «Смельфунгуса» за то, что тот «набросился на богиню и обошёлся с ней хуже, чем с последней уличной девкой, без малейшего к тому повода». Их спор из-за одной мраморной Венеры пережил их обоих."
 grand_tour_events.3.title:0 "[target_location.GetNameWithNoTooltip] — [target_location.GetRank.GetNameWithNoTooltip], где родилось [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.4.desc:0 "[target_location.GetName] живёт сразу в двух эпохах. Форум лежит под зимней травой, его колонны торчат под причудливыми углами посреди коровьих пастбищ, а мрамор за минувшую тысячу лет растаскивал всякий подрядчик, которому он был нужен. Надо всем этим возвышается церковь, которой суждено стать престолом всего христианского мира, — сердце, вокруг которого живёт нынешний [target_location.GetRank.GetName].\n\n[target_leader.GetName] волен выбирать: среди руин или среди живых пройдут [target_leader.GetHisHer] дни здесь. Папский двор стар, церемонен и связан с каждым [ShowReligionAdjective('catholic')]им троном, какой только знает [ShowContinentName('europe')]."
 grand_tour_events.4.historical_info:0 "15 октября 1764 года английский джентльмен Эдвард Гиббон, завершавший тогда собственный Гран-тур по Италии, сидел в раздумьях среди руин на Капитолийском холме, пока босоногие монахи пели вечерню в здании, которое он принял за древний храм Юпитера. Позднее он писал в мемуарах, что именно там, среди обломков колонн и затихающего вечернего пения, «мне впервые пришла мысль написать об упадке и разрушении города». Замысел, рождённый одним римским вечером, за следующие двадцать лет занятий в Англии вырос в #italic «Историю упадка и разрушения Римской империи»#!."
 grand_tour_events.5.desc:0 "[target_location.GetName] — самая южная точка путешествия и древнейший из великих [ShowCultureGroupName('italian_group')]их дворов: [target_location.GetRank.GetName] с миллионом душ, раскинувшийся в тени Везувия. Его история ложилась слоями — [ShowCultureName('greek_culture')]ий пласт под [ShowCultureName('roman_culture')]им, затем [ShowCultureName('norman')]ий и пласты ещё более поздних хозяев, — и каждое завоевание видно в зодчестве, если знать, куда смотреть. [target_country.GetGovernment.GetAdjective]ий [target_country.GetGovernment.GetCourtTitle] принимает гостей с такой церемонностью, что северные дворы, которых немало знает [ShowContinentName('europe')], кажутся рядом с ним наспех устроенными.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] уже побывал в трёх городах: [ShowLocationName('venice')], [ShowLocationName('florence')], [ShowLocationName('rome')]. Это последний урок."
 grand_tour_events.5.historical_info:0 "В январе 1786 года Эстер Пиоцци поднялась на Везувий, привязанная верёвкой к своему проводнику Бартоломео — «Циклопу Везувия», — и остановилась передохнуть у кельи отшельника на полпути к вершине. Отшельник, француз, вдруг узнал её: «Мадам, не видел ли я вас прежде? Ну конечно, видел — и даже причёсывал, когда был цирюльником в Лондоне». Устыдившись, когда узнала, что четырёхлетний мальчик из её спутников уже добрался до края кратера, Пиоцци продолжила путь, чтобы своими глазами увидеть дымящееся жерло, и описала всю эту встречу в опубликованных путевых письмах."
 grand_tour_events.5.title:0 "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.6.desc:0 "[target_location.GetName] стоит у излучины реки; [target_location.GetRank.GetName] вырос в долгой тени амфитеатра, что старше любого двора, какой знает [ShowRegionName('italy_region')]. Римская арена почти целиком уцелела: её каменные ярусы поднимаются над крышами, здесь проходят рынки и ярмарки, а в редкий праздничный день — нечто почти похожее на игры, ради которых она и строилась.\n\nЕсть здесь и лекционные залы, и руины, и двор, который будет рад принять у себя такого гостя, как наш [ROOT.GetCountry.GetGovernment.GetHeirTitle]."
 grand_tour_events.6.historical_info:0 "Прибыв в Верону в апреле 1785 года, Эстер Пиоцци почувствовала, как её сердце «ощутимо расширилось» при виде столь хорошо сохранившегося римского амфитеатра, а позже назвала этот город «самым весёлым на вид из всех, где мне доводилось жить». Гид, показывавший ей древности Филармонической академии, уверял, что английские Арунделовы мраморы давно погублены угольным дымом, — пока она не узнала в его словах дословную цитату из путеводителя #italic Verona illustrata#!, который он выучил наизусть. В опубликованном рассказе о путешествии она назвала этот обман «malafede и весьма нелепым предрассудком»."
 grand_tour_events.6.title:0 "[target_location.GetNameWithNoTooltip], город древней арены"
 grand_tour_events.7.desc:0 "[target_location.GetName] — не плод случая, и это видно с первого взгляда. Широкие прямые улицы прорезают [target_location.GetRank.GetName] по плану, какого не сложилось бы само собой ни в одном средневековом городке: всё здесь нарочно устроено так, чтобы этим любовались не меньше, чем в этом жили. Герцогский театр, типографии и поэты, подолгу задерживающиеся при дворе, служат одной цели — чтобы этот небольшой [target_location.GetRank.GetNameWithNoTooltip] стал образцом градостроительства будущего.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит двор, который интересуется стихами не меньше, чем искусством управления."
 grand_tour_events.7.historical_info:0 "В апреле 1817 года лорд Байрон, путешествуя по Италии, посетил госпиталь Святой Анны в Ферраре, где ему показали тесную келью, в которой, по преданию, герцог Альфонсо II д’Эсте в 1580-х годах держал взаперти поэта Торквато Тассо, сочтя его безумным. Эта реликвия тронула Байрона сильнее, чем стоявший неподалёку памятник Ариосто, и на следующий день он сочинил «Жалобу Тассо» — драматический монолог, в котором звучит отчаяние поэта. Этот визит стал одним из самых знаменитых паломничеств Гран-тура эпохи романтизма и навсегда запечатлел в воображении путешественников павший двор Эсте в Ферраре."
 grand_tour_events.7.title:0 "[target_location.GetNameWithNoTooltip], идеальный город"
 grand_tour_events.8.desc:0 "[target_location.GetName] учит праву и искусству спора дольше, чем любое другое место христианского мира, и [target_location.GetRank.GetName] не скрывает своей учёности: портики полны студентов из всех народов, а лекционные залы старше большинства окружающих их церквей. Заезжий [ROOT.GetCountry.GetGovernment.GetHeirTitle] мог бы провести здесь всю жизнь и так и не исчерпать всего, что написали доктора права.\n\nЕсть здесь и двор, который стоит повидать, если политика занимает нас больше, чем юриспруденция."
 grand_tour_events.9.desc:0 "[target_location.GetName] — это три гряды холмов вокруг площади в форме раковины и полосатый собор, видный с любой улицы, что взбирается к нему. [target_location.GetRank.GetName] нажил богатство на банковском деле и на товаре, имя которому — [ShowGoodsName('wool')], пока его не затмила [ShowLocationName('florence')], и так и не простил ей этого: соперничество до сих пор окрашивает каждый разговор при дворе.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает как раз к скачкам, которые дважды в год заполняют площадь, — со знамёнами и всем прочим."
 grand_tour_events.opportunity_accept:0 "Принять предложение."
 grand_tour_expedition:0 "Гран-тур"
 grand_tour_expedition_heir_completed_tt:0 "Наследник ещё не совершал Гран-тур"
 grand_tour_expedition_outcome_overview:0 "$BULLET$Каждый посещённый город прибавляет знаний, связей или опыта — в зависимости от сделанного выбора — и даёт [Concept('research_progress', 'прогресс исследования')|e] за время, потраченное на учёбу, или [Concept('legitimacy', 'легитимность')|e] за время, проведённое при дворе.\n$BULLET$Посещение хотя бы трёх великих городов региона [ShowRegionNameWithNoTooltip('italy_region')] затем даёт:\n$BULLET_WITH_TAB$Свойство «[ShowTraitName('free_thinker')]», «[ShowTraitName('well_connected')]» или «[ShowTraitName('worldly')]» — смотря по тому, чего накопится больше всего.\n$BULLET_WITH_TAB$Постоянный [Concept('modifier', 'модификатор')|e] «[ShowModifier('returned_from_grand_tour')]».\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')|e].\n$BULLET$Сокращённое путешествие приносит лишь #G +5#! [Concept('prestige', 'престижа')] и не даёт [Concept('trait', 'свойства')|e]."
 grand_tour_expedition_stalled_status:0 "Пребывание в городе"
 great_pestilence.8.desc:0 "Из нашей колонии [target_location.GetName] приходят полные страха письма: Чёрная смерть косит там коренное население так, что никто не может найти этому объяснения. Колонисты видят, как болезнь распространяется, не встречая преград, и не сомневаются, что рано или поздно она обрушится и на них. Они умоляют корону прислать серебро и припасы, врачей и провиант — всё, что могло бы уберечь их от участи, которую они видят повсюду вокруг.\n\nОткликнемся ли мы на их мольбу и отправим за океан всю помощь, какую сможем, или оставим их встречать мор с тем немногим, что у них есть?"
 great_pestilence_disease_exhausted:0 "Мор отступает"
 great_pestilence_disease_exhausted_desc:0 "Модификаторы, оставленные мором, снимаются со всех земель, которых он коснулся, а уцелевшие после него ещё сильнее склоняются к ценности «[ShowSocietyDirectionName('spiritualist')]»."
 grenoble.catalan_dialect:0 "Гренобле"
 guelphs_and_ghibellines_factional_deadlock:0 "Тупик в борьбе фракций"
 guelphs_and_ghibellines_factional_deadlock_desc:0 "Обе фракции немного теряют в [Concept('prestige', 'престиже')|e] и [Concept('government_power', 'власти правительства')|e], а если [GetUniqueInternationalOrganization('hre').GetName] ещё существует, итальянские участники фракции гвельфов покидают её."
 guelphs_and_ghibellines_ghibelline_triumph:0 "[GetUniqueInternationalOrganization('ghibellines_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_ghibelline_triumph_desc:0 "[GetUniqueInternationalOrganization('hre').GetName] вбирает в себя все подходящие итальянские державы вместе с их районами."
 guelphs_and_ghibellines_guelph_triumph:0 "[GetUniqueInternationalOrganization('guelphs_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_guelph_triumph_desc:0 "[GetUniqueInternationalOrganization('hre').GetName]: [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|E] и все итальянские участники покидают империю вместе со своими районами."
 hab_geheime_kabinettskanzlei_decision.a_tt:0 "Открывает [Concept('government_reform', 'государственный принцип')|e] [ShowGovernmentReformName('geheime_kabinettskanzlei')]"
 hab_monastery_reform_accepted_decision.title.entry:0 "$HAB$: совет «[ShowBuildingTypeNameWithNoTooltip('monastery')]»"
 hab_privilegium_maius_decision.desc.entry:0 "Прежние императоры отказывали нам в полном провозглашении наших законных привилегий. Теперь, когда императорская корона венчает нашу голову, пришло время исправить эту несправедливость."
 hab_tractatus_incorporalibus_decision.b.entry:0 "$peasants_estate$ смеют что-то от нас требовать?"
 hajj_caravan_events.1.b:0 "Снарядить караван и набрать охрану в дорогу."
 hajj_caravan_events.1.c:0 "Снабдить и защитить караван, а впереди нести #italic махмаль#!."
 hajj_caravan_events.1.title:0 "Путь в святой город [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.10.desc:0 "Колодцы впереди пусты — на дне лишь растрескавшаяся грязь: их до последней капли вычерпал какой-то караван, прошедший здесь несколько дней назад. Бурдюки на боках верблюдов уже полегчали, животные ревут от жажды, а солнце поднимается всё выше, не зная пощады. Проводники принимаются ворчать о том, как далеко до следующей хорошей воды."
 hajj_caravan_events.12.desc:0 "Всё начинается с нескольких случаев, но к утру болезнь уже в каждом шатре: лихорадка, что за считаные дни иссушает даже самых крепких. В дорожной тесноте паломникам никак её не избежать."
 hajj_caravan_events.13.c:0 "Пусть [toll_owner.GetGovernment.GetRulerTitle] взглянет на наш караван и пересмотрит пошлину."
 hajj_caravan_events.13.title:0 "Цену назначает [toll_owner.GetGovernment.GetRulerTitle]"
 hajj_caravan_events.17.desc:0 "Небо чернеет, и море вздымается серыми водяными холмами. Корабль швыряет, снасти визжат, и одна неверно встреченная волна может проломить корпус или утянуть судно на дно со всеми, кто на борту."
 hajj_caravan_events.20.title:0 "Корсары"
 hajj_caravan_events.22.desc:0 "Нас окликает торговое судно, его палубы заставлены рулонами шёлка и тонких тканей из далёких портов. Капитан готов торговать по купеческой цене — но лишь после неспешного купеческого торга."
 hajj_caravan_events.3.a:0 "Щедро раздавать золото. Пусть ни один паломник здесь не останется голодным."
 hajj_caravan_events.3.d:0 "Наш [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] уже обо всём позаботился."
 hajj_caravan_events.3.e:0 "Не жалеть затрат. Украсить караван золотом и шёлком."
 hajj_caravan_events.7.a:0 "Да будет известно: путь в город [ShowLocationNameWithNoTooltip('mecca')] и обратно пройден, ибо так пожелал [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.7.historical_info:0 "Аския Мухаммед Туре из Сонгайской империи совершил хадж в 1496–1497 годах со свитой в несколько сотен человек и целым состоянием в золоте, которое раздавал в пути как милостыню. В Каире аббасидский претендент на халифат пожаловал ему титул халифа Судана, и он вернулся домой как аль-Хадж: паломничество утвердило его власть над исламом Западной Африки."
 hajj_caravan_events.8.title:0 "Смерть на пути в город [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.9.c:0 "Это паломники, идущие в город [ShowLocationNameWithNoTooltip('mecca')], и их хранит [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.adorn:0 "Украсить караван знамёнами и шёлком, а затем ждать."
 hajj_caravan_events.guards_up_tt:0 "Охрана каравана усиливается (#G +25#! к охранному конвою)"
 hajj_caravan_expedition_outcome_overview:0 "$BULLET$Достигнув района [ShowLocationNameWithNoTooltip('mecca')], караван получает награду в зависимости от своего великолепия — до:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'престижа')|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Возвращение домой затем даёт:\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$[Concept('modifier', 'Модификатор')|e] «[ShowModifier('hajj_pious_return')]» на 5 лет.\n$BULLET_WITH_TAB$Постоянное почётное звание «[ShowModifier('hajji_pilgrim')]» — за первый хадж [Concept('ruler', 'правителя')|e].\n$BULLET$Караван должен добраться до района [ShowLocationNameWithNoTooltip('mecca')] в тот же год, когда отправился в путь, иначе паломничество будет полностью потеряно."
 has_penalty_for_weak_imam:0 "Больше не соответствует требованиям, и [Concept('event', 'событие')|e] #Y $ibadi_events.2.title$#! уже произошло"
 has_unlocks_formalize_relations_action:0 "Открыто [Concept('diplomatic_action', 'дипломатическое действие')|e] «[ShowCountryInteractionName('formalize_relations')]» благодаря [Concept('decision', 'решению')|e] «$fra_formalized_relations_decision.title$»."
 holy_site_pilgrimage_expedition_outcome_overview:0 "$BULLET$Прибытие к выбранной [Concept('holy_site', 'святыне')|e] дарует награду, зависящую от нашей [Concept('religion', 'религии')|e]:\n$BULLET_WITH_TAB$#G +10#! [Concept('religious_influence', 'религиозного влияния')|e], [Concept('purity', 'чистоты')|e] или [Concept('karma', 'кармы')|e]; чем дальше святыня от нашей столицы, тем больше награда — вплоть до #G +100#!.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]ие религии вместо этого сдвигают [Concept('yanantin', 'янантин')|e] на #Y 20#! в сторону природы [Concept('god', 'божества')|e] этой [Concept('holy_site', 'святыни')].\n$BULLET_WITH_TAB$Подходящие [ShowReligionGroupAdjective('muslim')]ие школы сдвигаются ещё на #Y 10#! в сторону ценности «[ShowSocietyDirectionName('mysticism')]» или «[ShowSocietyDirectionName('jurisprudence')]»."
 holy_war.1.a:0 "Мы встаём под знамёна веры!"
 holy_war.1.b:0 "Не сейчас."
 holy_war.1.desc:0 "Ко двору прибыли проповедники, охрипшие от пыла, и призывают всякого истинно верующего поднять оружие против державы [preach_io.GetTarget.GetName]. Взоры верующих обращены к нам. Ответим ли мы на призыв?"
 holy_war.1.title:0 "Призыв к священной войне"
 holy_war.10.a:0 "Мы соглашаемся и присоединяемся к джихаду."
 holy_war.10.b:0 "Мы отклоняем предложение."
 holy_war.10.desc:0 "Держава [recognition_offerer.GetName], возглавляющая «[recognition_io.GetName]», предлагает признать наше положение среди верующих — даровать нам религиозный авторитет и легитимность, — если мы присоединимся к священной войне против неверных. Примем ли мы предложение?"
 holy_war.10.title:0 "Предложение признания"
 holy_war.17.a:0 "Объявить его исцеление чудом и воодушевить воинство!"
 holy_war.17.a.muslim:0 "$holy_war.17.a$"
 holy_war.17.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.17.b:0 "Замять дело, пока лагерь не охватил страх."
 holy_war.17.desc:0 "Простой солдат, которого лагерные лекари уже сочли покойником, поднялся с одра болезни целым и невредимым, и многие уже называют это делом Небес. Но в горячечном бреду ему являлись странные и тревожные сны — видения, которые, как он клянётся, предрекли грядущее, — и воины с беспокойством перешёптываются о них. Как нам поступить?"
 holy_war.17.title:0 "Чудесное исцеление"
 holy_war.18.a:0 "Устроить для воинства великую проповедь и пир."
 holy_war.18.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.18.b:0 "Пусть верующие сами разожгут в себе огонь."
 holy_war.18.b.tt:0 "Снижает религиозное рвение священной войны на #R 5#! и отбрасывает её подготовку на #R 5#!"
 holy_war.18.desc:0 "Долгое ожидание жестоко изматывает воинство. Молитвы, звучавшие некогда с жаром, теперь бормочут по привычке, из-за малейших пустяков вспыхивают ссоры, а у ночных костров вновь тлеют старые распри. Пыл, что когда-то привёл верующих под знамёна, остыл до серого пепла, и если вскоре ничто не разожжёт их дух вновь, всё предприятие может зачахнуть прежде, чем будет нанесён хоть один удар. Что же делать?"
 holy_war.18.title:0 "Пыл в лагере угасает"
 holy_war.19.a:0 "Дать ему полную волю собирать верующих."
 holy_war.19.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.19.b:0 "Обуздать его, пока он не посеял смуту."
 holy_war.19.desc:0 "На краю лагеря появился проповедник с безумным взором: одежды его истрепались в дороге, а голос охрип от многодневных неустанных призывов. Его пламенные речи собирают всё растущую толпу бедняков и благочестивцев, батраков и безземельных, и все они требуют выступить за веру сей же час. Рвение его не знает удержу, сам он совершенно неуправляем, и ни один из наших сеньоров не имеет над ним никакой власти. Как нам быть с этим смутьяном?"
 holy_war.19.title:0 "Пламенный проповедник"
 holy_war.2.a:0 "Выделить скромную сумму."
 holy_war.2.b:0 "Заплатить щедро."
 holy_war.2.c:0 "Лучше уж самим присоединиться к походу."
 holy_war.2.d:0 "Мы не станем платить за чужую войну."
 holy_war.2.desc:0 "К нам прибывают послы с торжественной просьбой. Их направляет предводитель объединения «[levy_io.GetName]» — [levy_leader.GetLongName]. Священная война против державы [levy_io.GetTarget.GetName] пожирает монету так же быстро, как проливает кровь, и нас, братьев по вере, призывают пополнить её военную казну. Откроем ли мы свои сундуки ради общего дела?"
 holy_war.2.title:0 "Сбор средств на священную войну"
 holy_war.21.a:0 "Пусть наши люди возьмут то, что заслужили."
 holy_war.21.a.tt:0 "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.21.b:0 "Сдержать их ради общего дела."
 holy_war.21.b.tt:0 "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.21.desc:0 "Едва город пал, как наши солдаты и воины союзного войска сцепились из-за дележа добычи. В тесных улочках обнажены ножи, палатки опрокинуты, и старые обиды между двумя лагерями выплёскиваются в открытую драку. Если ссору не уладить быстро, она может отравить весь поход и обратить брата против брата, пока враг ещё стоит. Как нам её разрешить?"
 holy_war.21.title:0 "Ссора из-за добычи"
 holy_war.22.a:0 "Продолжать поход, чего бы это ни стоило."
 holy_war.22.b:0 "Дать войску отдых, пока болезнь не отступит."
 holy_war.22.b.tt:0 "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.22.desc:0 "Изнурительная лихорадка расползлась по тесным осадным линиям, и каждое серое утро из палаток выносят всё больше людей в беспамятстве. Лагерные лекари пускают им кровь, дают слабительное и молятся над ними, но ничто не останавливает болезнь, и смрад умирающих тяжело висит над всем лагерем. С каждым днём войско теряет силы, которых ему так недостаёт вдали от дома, перед всё ещё несокрушёнными стенами. Как нам встретить эту напасть?"
 holy_war.22.title:0 "Болезнь в войске"
 holy_war.23.a:0 "Провозгласить его мучеником за веру!"
 holy_war.23.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 10#!"
 holy_war.23.b:0 "Почтить его память со сдержанным достоинством."
 holy_war.23.b.tt:0 "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.23.desc:0 "Осада продолжается: [sieged_location.GetName] всё ещё держится, а у осаждённых стен в самой гуще боя пал [fallen_champion.GetName] — сражённый на валу после подвигов, о которых будут слагать песни ещё целое поколение. Войско оплакивает героя, любимого и простым солдатом, и гордым сеньором, но даже в скорби кровь воинов вскипает, и многие теперь молят о чести отомстить врагу за павшего. Как нам почтить эту смерть?"
 holy_war.23.title:0 "Гибель героя"
 holy_war.24.a:0 "Изгнать лжеверующих из войска."
 holy_war.24.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.24.b:0 "Закрыть на это глаза. Нам нужен каждый меч."
 holy_war.24.b.tt:0 "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.24.desc:0 "По лагерю ползут недобрые слухи, будто среди верующих затесались еретики и лжеверующие: их молитвы — пустое глумление, а их верность под большим сомнением. Самые набожные в войске требуют вырвать их с корнем, пока они не отравили всю армию, а более трезвые головы напоминают, что меч в руке остаётся мечом, какая бы вера ни таилась в сердце. Как нам ответить на это обвинение?"
 holy_war.24.title:0 "Лжеверующие в рядах"
 holy_war.25.a:0 "Пустить эти деньги на нашу собственную войну."
 holy_war.25.b:0 "Передать их в военную казну священной войны."
 holy_war.25.b.tt:0 "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.25.c:0 "Раздать их верующим как милостыню."
 holy_war.25.c.tt:0 "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.25.desc:0 "Богатый магнат нашего государства, недавно отошедший в вечность, завещал священной войне огромную сумму. Душеприказчики передали это богатство на наше попечение — запечатанные сундуки с монетой, которую мы можем потратить на общее дело по своему усмотрению, — и вот уже духовенство, военачальники и бедняки наперебой притязают на неё. Куда направить это состояние?"
 holy_war.25.title:0 "Благочестивое завещание"
 holy_war.27.a:0 "Алчность побеждает там, где меч бессилен."
 holy_war.27.a.tt:0 "Держава [desertion_member.GetName] приняла взятку и покинула «[desertion_io.GetName]»"
 holy_war.27.desc:0 "Наше серебро тихо сделало своё дело. Держава [desertion_member.GetName] приняла взятку и отступилась от общего дела: свернула знамёна и украдкой побрела домой, прикрываясь отговорками, в которые никто по-настоящему не верит. С её уходом наши враги ослабли. Золото вновь купило нам то, чего не смогли добыть ни сталь, ни проповедь, и один докучливый противник тихо убран с доски. Пожалуй, это урок об истинной цене верности."
 holy_war.27.title:0 "Подкуп удался"
 holy_war.28.a.tt:0 "Они отказались от взятки"
 holy_war.28.desc:0 "Держава [desertion_member.GetName] наотрез отвергла наше тайное предложение и изгнала нашего посланника со своего двора, поклявшись продолжать войну, не страшась и не прельщаясь нашей монетой. Хуже того, слух о нашей попытке ещё может разойтись, и если он дойдёт до людских ушей, наше имя будет запятнано как имя подкупщика и обманщика. Из всей этой затеи мы вынесли лишь риск."
 holy_war.28.title:0 "Наше серебро отвергнуто"
 holy_war.29.a:0 "Принять легата под наши знамёна."
 holy_war.29.a.tt:0 "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.29.b:0 "Отправить его обратно в Рим с благодарностью."
 holy_war.29.desc:0 "Его Святейшество направил к нам своего легата — [papal_legate.GetName], воинственного прелата, сведущего в ратном деле не меньше, чем в духовном, — чтобы тот ехал во главе нашего воинства и даровал «[holy_war.GetName]» полное благословение Рима. Такой человек мог бы закалить наши армии и ещё теснее связать нас со Святым Престолом, хотя подчиняется он прежде всего папе и лишь затем — нам. Примем ли мы его на службу?"
 holy_war.29.title:0 "Папский легат"
 holy_war.3.a.tt:0 "Мы ничего не предпринимаем против насильственных обращений"
 holy_war.3.desc:0 "В землях, которые враг отнял у нас, его духовенство ходит из деревни в деревню, принуждая наших людей отречься от веры отцов — или пострадать за неё. О каждом обращении становится известно при нашем дворе, и это бесчинство не будет забыто."
 holy_war.3.title:0 "Наш народ обращают в чужую веру"
 holy_war.30.a:0 "Пусть их выручка пополнит военную казну."
 holy_war.30.a.tt:0 "Снижает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 3#!"
 holy_war.30.b:0 "Тихо направить монету в нашу собственную казну."
 holy_war.30.b.tt:0 "Снижает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 5#!"
 holy_war.30.c:0 "Изгнать торгашей из лагеря."
 holy_war.30.c.tt:0 "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.30.desc:0 "На лагерь, словно стервятники на свежую падаль, слетелась ватага продавцов индульгенций: они сбывают отпущения грехов и святые безделушки любому солдату, готовому расстаться с монетой. Их выручка растёт так же быстро, как ропот благочестивых, называющих всю эту торговлю позором для священного дела. И всё же монета есть монета, а одними молитвами ещё ни одна священная война не была выиграна. Как с ними поступить?"
 holy_war.30.title:0 "Продавцы индульгенций в лагере"
 holy_war.31.a:0 "Поместить их в святилище нашей столицы."
 holy_war.31.b:0 "Нести их в бой перед войском."
 holy_war.31.b.tt:0 "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 8#!"
 holy_war.31.desc:0 "К нам на хранение попали мощи почитаемого святого: их доставили ко двору благодарные монахи, оберегавшие святыню на протяжении многих опасных лиг пути. Такие реликвии — сокровище, которому нет цены в золоте, ведь там, где они наконец обретут покой, тысячами соберутся верующие, чтобы молиться и дивиться им. Где же хранить эти святые останки?"
 holy_war.31.title:0 "Мощи святого"
 holy_war.32.a:0 "Пусть [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] лично ведёт воинство."
 holy_war.32.a.tt:0 "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.32.b:0 "Государству больше пользы, когда [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] на троне."
 holy_war.32.desc:0 "Перед всем собравшимся двором [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'преклонила', 'преклонил')] колени у алтаря и [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'принесла', 'принёс')] великий обет лично принять крест: повести верующих в самое сердце священной войны и разделить все тяготы и опасности похода наравне с последним пехотинцем. Это смелое обещание — и опасное, и всё государство теперь ждёт нашего слова. Позволим ли мы этому обету остаться в силе?"
 holy_war.32.title:0 "Обет крестоносца"
 holy_war.33.a:0 "Призвать рыцарей и дворян под знамёна."
 holy_war.33.b:0 "Собрать великое войско из простого люда."
 holy_war.33.desc:0 "По государству прокатилась великая волна священного пыла, и люди всякого звания рвутся нашить крест на одежду и выступить за веру. Гордые рыцари и землевладельцы соперничают друг с другом за славу авангарда, а в деревнях простой люд хватает любое оружие, какое попадётся под руку. Чей пыл нам обратить на пользу дела?"
 holy_war.33.title:0 "Христианский мир принимает крест"
 holy_war.34.a:0 "Принять шейха при нашем дворе."
 holy_war.34.a.tt:0 "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 5#!"
 holy_war.34.b:0 "Держать странствующего мистика на расстоянии."
 holy_war.34.b.tt:0 "Снижает религиозное рвение [Concept('jihad', 'джихада')|e] на #R 3#!"
 holy_war.34.desc:0 "В наш лагерь прибыл почитаемый суфийский шейх [sufi_shaykh.GetName], чьё благочестие и учёность славятся во всём мусульманском мире, а за ним следует отряд преданных учеников. Его проповеди у вечерних костров зажигают сердца гази, и те, кто ещё вчера устало брёл в строю, теперь с сияющими глазами говорят о мученичестве. Как нам принять этого святого человека?"
 holy_war.34.title:0 "Суфийский шейх"
 holy_war.35.a:0 "Выделить гази их долю добычи."
 holy_war.35.a.tt:0 "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 5#!"
 holy_war.35.b:0 "Добыча принадлежит войне, а не алчности."
 holy_war.35.b.tt:0 "Снижает религиозное рвение [Concept('jihad', 'джихада')|e] на #R 3#!"
 holy_war.35.desc:0 "Добровольцы, стекавшиеся на наш призыв, теперь настойчиво требуют обещанной добычи: они толпятся перед нашим шатром, громко шумят, и терпение их на исходе. Они сражались за веру, говорят они, но и за своих жён и детей, а с пустыми руками к следующей тяжёлой битве опустеют и ряды. Как нам ответить на их требование?"
 holy_war.35.title:0 "Гази требуют свою долю"
 holy_war.36.a:0 "Разнести фетву во все уголки."
 holy_war.36.a.tt:0 "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 8#!"
 holy_war.36.b:0 "Принять её со сдержанной благодарностью."
 holy_war.36.b.tt:0 "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 3#!"
 holy_war.36.desc:0 "Почтенный законовед, чьё слово весомо от одного края #italic уммы#! до другого, издал #italic фетву#!, провозглашающую священную войну святым долгом каждого верующего, способного носить оружие. Переписанное сотней рук и разнесённое от мечети к мечети, такое решение могло бы воспламенить ради нашего дела весь исламский мир. Распространим ли мы её повсюду?"
 holy_war.36.title:0 "Фетва законоведа"
 holy_war.37.a:0 "Принять добровольцев в войско."
 holy_war.37.a.tt:0 "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 3#!"
 holy_war.37.b:0 "Мы не можем кормить каждого бродячего фанатика."
 holy_war.37.desc:0 "Весть о священной войне разнеслась далеко за нашими пределами, и теперь на сбор войска из далёких мусульманских земель прибывают отряды добровольцев-гази. Со сбитыми ногами, покрытые пылью, полные рвения, они просят лишь места в строю и возможности ударить по врагу. Правда, это много лишних ртов, но и много охочих до боя мечей. Примем ли мы их?"
 holy_war.37.title:0 "Добровольцы со всей уммы"
 holy_war.38.a:0 "Высоко поднять его над войском."
 holy_war.38.a.tt:0 "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 5#!"
 holy_war.38.b:0 "Хранить его как подлинное сокровище."
 holy_war.38.desc:0 "Нам вверено древнее боевое знамя, которое, как говорят, реяло над победами первых верующих в самые ранние дни веры. Пусть ткань его выцвела и истёрлась, один его вид пробуждает в верующих праведную ярость, и воины клянутся без колебаний следовать за ним навстречу любой опасности. Как нам поступить с такой драгоценной реликвией?"
 holy_war.38.title:0 "Священное знамя"
 holy_war.39.a:0 "Благодарение Богу!"
 holy_war.4.a:0 "Клянёмся удвоить усилия."
 holy_war.4.b:0 "Мы никому не обязаны отчётом."
 holy_war.4.desc:0 "Предводитель священной войны обвиняет нас в уклонении от священного долга и грозит тяжкими последствиями, если мы не докажем свою преданность. Что мы ответим?"
 holy_war.4.title:0 "Упрёк верующих"
 holy_war.40.a:0 "Да будет так."
 holy_war.41.a:0 "Аллах велик!"
 holy_war.42.a:0 "Да будет так."
 holy_war.6.a:0 "#italic Так хочет Бог#!."
 holy_war.6.desc:0 "Весть о нашем вновь пробудившемся рвении к священной войне разнеслась далеко, и предводители верующих теперь произносят наше имя с теплотой. Где прежде было сомнение, ныне благосклонность."
 holy_war.6.title:0 "Верующие довольны"
 holy_war.7.a:0 "Верующие собираются."
 holy_war.7.desc:0 "Держава [preach_target.GetName] вняла нашим проповедям и вступила в священную войну, отдав делу веры меч и казну. Ещё один клинок обнажён за веру, и воинство растёт."
 holy_war.7.title:0 "Наш призыв услышан"
 holy_war.8.a.tt:0 "Они пренебрегли нашим предложением"
 holy_war.8.desc:0 "Держава [preach_target.GetName] осталась глуха к нашим проповедям: холодные слова, запертые ворота — и никакого участия в священной войне. Верующие запомнят это оскорбление."
 holy_war.8.title:0 "Наш призыв отвергнут"
 holy_war.9.a:0 "Мы принимаем эту честь и присоединяемся к крестовому походу."
 holy_war.9.b:0 "Мы отклоняем предложение."
 holy_war.9.desc:0 "Держава [cardinal_offerer.GetName], возглавляющая «[cardinal_io.GetName]», предлагает возвести одного из наших прелатов в кардинальское достоинство, если мы примем крест, и учредить эту кафедру в пределах нашего собственного государства. Такое покровительство крепко связало бы нас со священным делом. Примем ли мы предложение?"
 holy_war.9.title:0 "Предложение кардинальской кафедры"
 hre.700.desc:0 "Рейхстаг собрался и одобрил важнейшее изменение в законах, по которым живёт [GetInternationalOrganizationType('hre').GetName]. Отныне коллегия выборщиков, в которой представлена вся [GetInternationalOrganizationType('hre').GetNameWithNoTooltip], станет полностью светской, и ни один правитель-теократ больше не сможет влиять на избрание следующего императора.\n\nЭто угрожает самому нашему положению в империи, и нам придётся выбрать один из двух путей. Мы можем указом секуляризировать нашу державу и сохранить статус «[ShowSpecialStatusName('elector')]» — теперь уже как светский князь, каких немало знает [GetInternationalOrganizationType('hre').GetNameWithNoTooltip], — или сохранить теократическое правление, довольствуясь скромным статусом «[ShowSpecialStatusName('imperial_prelate')]»."
 hussite_wars_bohemia_reconverted:0 "[GetCountry('BOH').GetNameWithNoTooltip] и [GetCountry('PAP').GetNameWithNoTooltip] вновь едины"
 hussite_wars_bohemia_reconverted_desc:0 "Держава [GetCountry('BOH').GetName] силой возвращена в лоно католической церкви: её [Concept('stability', 'стабильность')|e] и [Concept('government_power', 'власть правительства')|e] жестоко пострадают, а правителя и его семью заставят сменить веру."
 hussite_wars_bohemia_subdued:0 "[GetCountry('BOH').GetNameWithNoTooltip] покоряется"
 hussite_wars_emperor_converted:0 "[GetUniqueInternationalOrganization('hre').GetLeaderTitle] принимает гуситство"
 hussite_wars_emperor_converted_desc:0 "Раз на сторону гуситов перешёл сам император, гуситские земли надолго получают прибавку к [Concept('stability', 'стабильности')|e], [Concept('government_power', 'власти правительства')|e] и [Concept('religious_influence', 'религиозному влиянию')|e]."
 hussite_wars_empire_dissolved:0 "[GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] распадается"
 hussite_wars_hussite_bohemia_endures:0 "[GetCountry('BOH').GetNameWithNoTooltip] хранит гуситскую веру"
 hussite_wars_hussite_bohemia_endures_desc:0 "[GetCountry('BOH').GetName] выдерживает испытание верой: эта держава и её единоверцы-гуситы надолго получают прибавку к [Concept('stability', 'стабильности')|e], [Concept('government_power', 'власти правительства')|e] и [Concept('religious_influence', 'религиозному влиянию')|e]."
 hyw_france_recently_received_demand_tt:0 "Последние #Y 6#! мес. ни один [Concept('subject', 'ленник')|e] не предъявлял требований державе [GetCountry('FRA').GetName]"
 ibadi_events.1.a:0 "Наступает новая эпоха."
 ibadi_events.1.b:0 "Воистину, [ROOT.GetCountry.GetReligion.GetGodName] благоволит нам!"
 ibadi_events.1.desc:0 "$legacy_of_rustamids_desc$\n\nВ духе древнего имамата [target_character.GetName] [Select_CString(target_character.IsFemale, 'провозглашена первой', 'провозглашён первым')] правителем региона [ShowRegionName('maghreb_region')], [Select_CString(target_character.IsFemale, 'носящей', 'носящим')] титул «[ShowPolicyName('ibadi_zuhur_imam_policy')]». Отныне правоверным больше не придётся таиться — [ShowPolicyNameWithNoTooltip('ibadi_kitman_imam_policy')] уходит в прошлое."
 ibadi_events.2.a:0 "Мы должны найти более достойного предводителя."
 ibadi_events.2.desc:0 "[target_estate.GetName] всё сильнее недовольны правлением, которое ведёт [target_character.GetName] — [ShowPolicyName('ibadi_daif_imam_policy')]. В конце концов, власть слабого имама терпят лишь во времена бедствий, а [ShowReligionAdjective('ibadi')]им правоверным державы [ROOT.GetCountry.GetName] больше ничего не угрожает."
 ibadi_events.2.title:0 "Слабый имам"
 ibadi_weak_imam_penalty_tt:0 "[ShowPolicyName('ibadi_daif_imam_policy')] будет приносить нам нарастающие штрафы, пока мы не сменим [Concept('ruler', 'правителя')|e] с помощью действия «[ShowGenericActionName('return_to_zuhur_imamate')]»"
 iberian_culture.1.a:0 "Пусть они звучат на поле боя!"
 iberian_culture.1.b:0 "Пусть они зовут людей под наши знамёна!"
 iberian_culture.1.desc:0 "Наши схватки с неверными вдохновили и менестрелей, и простой люд слагать песни во славу отваги наших воинов, сражающихся за торжество [ShowReligionGroupAdjective('christian')|U]ого дела. Эти напевы звучат всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и могут сослужить нам добрую службу — воодушевлять солдат в бою и, быть может, привлекать в наши ряды новых людей."
 iberian_culture.1.title:0 "Песни Реконкисты"
 iberian_culture.10.a:0 "Мастерство важнее вероисповедания."
 iberian_culture.10.b:0 "Лучше назначить [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]ого лекаря."
 iberian_culture.10.desc:0 "В последнее время лекари-мудехары завоёвывают широкую славу всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всё больше полагаются на их искусство. Некоторые советники предлагают официально назначить их придворными лекарями — пусть их услугами пользуется [ROOT.GetCountry.GetGovernment.GetCourtTitle]; однако влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] решительно против."
 iberian_culture.10.title:0 "Прославленные лекари-мудехары"
 iberian_culture.11.a:0 "Наши церковные суды должны расследовать эту ересь."
 iberian_culture.11.b:0 "Это клевета!"
 iberian_culture.11.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] обсуждает тревожное известие: [target_character.GetName], искусный купец, чья семья когда-то исповедовала [ShowReligionName('judaism')], но затем приняла крещение, обвиняется в том, что втайне по-прежнему соблюдает обряды прежней веры. В донесении говорится о запретных молитвах и тайных сборищах, однако есть и те, кто уверен: эти обвинения порождены завистью и спорами о долгах."
 iberian_culture.11.title:0 "Конверсо под подозрением"
 iberian_culture.12.a:0 "Конфисковать их богатства."
 iberian_culture.12.a.tt:0 "[ShowCultureName('sephardi')]ие [ShowPopTypeName('burghers')]: все их [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.12.b:0 "Мы не можем действовать без доказательств."
 iberian_culture.12.b.tt:0 "[ShowPopTypeName('burghers')] любой культуры, кроме [ShowCultureName('sephardi')]ой: все их [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.12.desc:0 "Нескольких видных [ShowCultureName('sephardi')]их купцов из района [target_location.GetName] обвиняют в том, что они сколотили состояние нечестными путями: пользовались лазейками в налогах, давали деньги в рост под грабительский процент и вздували цены себе на пользу. Обвинения исходят от их торговых соперников, и мы не можем знать наверняка, правдивы ли они, но действовать нужно прежде, чем раздор разгорится ещё сильнее."
 iberian_culture.12.title:0 "[ShowCultureNameWithNoTooltip('sephardi')]их купцов обвиняют"
 iberian_culture.13.a:0 "Обеспечить их гашёной известью."
 iberian_culture.13.a.tt:0 "Все [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.13.b.tt:0 "Все [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.13.desc:0 "В южных краях, которыми владеет [ROOT.GetCountry.GetFlavorRank], издавна принято белить дома гашёной известью, чтобы под палящим солнцем в них сохранялась прохлада. Считается также, что побелка помогает уберечься от болезней. Недавно жителям района [target_location.GetName] стало не хватать гашёной извести, и теперь они просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] помогли им защитить свои дома."
 iberian_culture.13.title:0 "Против зноя и мора"
 iberian_culture.14.a:0 "Подтвердить древнее право пастухов на проход."
 iberian_culture.14.a.tt:0 "[ShowPopTypeName('peasants')]: все их [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.14.b:0 "Разрешить спор в пользу местных жителей."
 iberian_culture.14.desc:0 "С каждой сменой времён года миллионы овец гонят по Каньядас-Реалес — старинным королевским скотопрогонным трактам, что пересекают наши земли. Однако жители района [target_location.GetName] отказываются пропускать пастухов через своё поселение, опасаясь, что стада вытопчут их поля."
 iberian_culture.14.title:0 "Спор о Каньядас-Реалес"
 iberian_culture.15.a:0 "Предпочтение получит район [target_location_1.GetNameWithNoTooltip]."
 iberian_culture.15.b:0 "Поля в районе [target_location_2.GetNameWithNoTooltip] важнее."
 iberian_culture.15.c:0 "Воду разделят поровну."
 iberian_culture.15.desc:0 "В последнее время старинный Водный трибунал разбирает спор между районами [target_location_1.GetName] и [target_location_2.GetName]. Под палящим летним солнцем воды в округе не хватает, чтобы вдоволь напоить поля обоих поселений, и их жители спорят о праве на её распределение."
 iberian_culture.15.title:0 "Раздор в Водном трибунале"
 iberian_culture.16.a:0 "Уважать хартии."
 iberian_culture.16.b:0 "Нужды государства превыше всего!"
 iberian_culture.16.desc:0 "Нашего сборщика налогов, посланного в район [target_location.GetName], местные магистраты попросту не пустили в город. Здешняя знать ссылается на свои древние #italic фуэрос#! — привилегии, по которым она полностью освобождена от налогов, что взимают [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], если только их не одобрило её собственное собрание."
 iberian_culture.16.title:0 "Защита фуэрос"
 iberian_culture.17.a:0 "У нас нет лишних людей."
 iberian_culture.17.b:0 "Снарядить отряд и очистить от них горы."
 iberian_culture.17.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает тревожные вести: хорошо вооружённые разбойники захватили труднопроходимые горные перевалы вокруг района [target_location.GetName]. Они грабят караваны и обозы, и торговля во всём крае задыхается. Если ничего не предпринять, к разбойникам могут примкнуть и другие."
 iberian_culture.17.title:0 "Разбойники Сьерры"
 iberian_culture.18.a:0 "Одобрить их труд."
 iberian_culture.18.b:0 "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]ому искусству не место рядом с престолом."
 iberian_culture.18.desc:0 "Веками жители региона [ShowRegionName('iberia_region')] восхищались [ShowReligionGroupAdjective('muslim')]им зодчеством, расцветшим во времена аль-Андалуса. Многие архитекторы стали вплетать приёмы искусства мудехаров в романские и готические постройки — будь то геометрический орнамент или узорная резьба по штукатурке. Ныне [target_artist.GetName] — мастер, которому покровительствуют [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], — просит у престола дозволения использовать этот стиль в королевских заказах."
 iberian_culture.18.title:0 "Искусство мудехаров"
 iberian_culture.19.a:0 "Пусть камень возвестит нашу славу!"
 iberian_culture.19.desc:0 "Строители из всех земель, что объединяет [ROOT.GetCountry.GetFlavorRank], создают архитектурный стиль, не похожий ни на один другой во всём христианском мире. Вдохновлённые устремлёнными ввысь соборами западных народов и прочными строительными традициями наших земель, они возводят памятники, возвещающие и славу Господа, и величие, которым блистает [ROOT.GetCountry.GetName]. Этот стиль, получивший название испанской готики, может на века оставить свой след в облике наших земель — если мы решим ему покровительствовать."
 iberian_culture.19.title:0 "Испанская готика"
 iberian_culture.2.a:0 "[new_general.GetSheHe|U] возглавит наши армии."
 iberian_culture.2.b:0 "Мы найдём [new_general.GetHerHis] талантам иное применение."
 iberian_culture.2.desc:0 "Среди множества храбрецов, сражающихся в войне, где нашим противником выступает [GetCountry('GRA').GetName], особо выделяется [new_general.GetName]: отвагой и воинским искусством [new_general.GetHerselfHimself] [Select_CString(new_general.IsFemale, 'стяжала', 'стяжал')] себе славу. [new_general.GetHerHis|U] имя гремит всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], слава бежит впереди [new_general.GetHerHim], и многие считают, что такой талант заслуживает командования, достойного [new_general.GetHerHis] заслуг."
 iberian_culture.2.title:0 "Герой Реконкисты"
 iberian_culture.20.a:0 "Принять новую традицию."
 iberian_culture.20.b:0 "Хранить старые традиции."
 iberian_culture.20.desc:0 "Из региона [ShowRegionName('italy_region')] к нам приходят новые художественные идеи, которые называют общим именем — [ShowInstitutionNameWithNoTooltip('renaissance')]. Их уже впитывает [ROOT.GetCountry.GetFlavorRank]: многие наши зодчие и живописцы сплетают эти веяния с родными традициями. Всё больше заказчиков желают видеть работы в новом, едва зарождающемся стиле, и, если поощрить это художественное течение, оно, быть может, откроет эпоху процветания и новшеств."
 iberian_culture.20.title:0 "Испанский проторенессанс"
 iberian_culture.21.a:0 "Принять их в лоно веры."
 iberian_culture.21.b:0 "Заставить обратиться и остальных."
 iberian_culture.21.b.tt:0 "Все [ShowReligionAdjective('judaism')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.21.desc:0 "Немалая часть [ShowReligionAdjective('judaism')]ого населения района [target_location.GetName] решила добровольно принять крещение и исповедовать [ShowReligionName('catholic')]. Многие видят в новообращённых доказательство успехов Церкви, но другие сомневаются в их искренности и зовут их «новыми христианами», отличая от тех, чьи семьи издавна исповедуют эту веру."
 iberian_culture.21.title:0 "Обращение новых христиан"
 iberian_culture.22.b:0 "Мы не станем поддерживать эту варварскую забаву!"
 iberian_culture.22.b.tt:0 "Все [Concept('pops', 'группы населения')|e] в районе [ShowLocationName('cuellar')] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.22.desc:0 "Считается, что старейший праздник бега быков во всём регионе [ShowRegionName('iberia_region')] проводят в поселении [ShowLocationName('cuellar')], но его жителям не хватает средств на ежегодное торжество. Они просят денег и обещают: если [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] возьмут расходы на себя, то героем праздника станет не Богоматерь Розария, их небесная покровительница, которую обычно чествуют в эти дни, а [target_ruler.GetName]."
 iberian_culture.22.title:0 "Бег быков"
 iberian_culture.23.a:0 "Расправиться с просветлёнными."
 iberian_culture.23.b:0 "Не за каждым слухом скрывается еретик."
 iberian_culture.23.b.tt:0 "Если ничего не предпринять, влияние секты может распространиться дальше"
 iberian_culture.23.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] и церковные иерархи получают тревожные донесения о странном мистическом братстве, которое исподволь набирает сторонников всюду, куда простирается [ROOT.GetCountry.GetFlavorRank]. Его члены называют себя «просветлёнными» и утверждают, что истинно верующий может получить божественное озарение прямо от Святого Духа, а значит, священники, таинства, паломничества и даже святая месса ему не нужны. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] опасаются, что это учение сродни протестантским ересям, и требуют начать расследование."
 iberian_culture.23.title:0 "Секта алумбрадос"
 iberian_culture.24.a:0 "Мы не можем преследовать каждого инакомыслящего."
 iberian_culture.24.a.tt:0 "15% всех [ShowReligionAdjective('catholic')]их [Concept('pops', 'групп населения')|e] в провинции [target_province.GetName] перейдут в [ShowReligionName('lutheran')]"
 iberian_culture.24.a.tt2:0 "Все [ShowReligionAdjective('catholic')]ие [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.24.b:0 "Они были правы, и нам следует действовать осмотрительно."
 iberian_culture.24.b.tt:0 "5% всех [ShowReligionAdjective('catholic')]их [Concept('pops', 'групп населения')|e] в провинции [target_province.GetName] перейдут в [ShowReligionName('lutheran')]"
 iberian_culture.24.b.tt2:0 "Все [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.24.desc:0 "Наше нежелание расследовать слухи о просветлённых оказалось ошибкой. Влияние секты в провинции [target_province.GetName] сильно выросло, и её последователи открыто признали себя приверженцами [ShowReligionAdjective('lutheran')]ой ереси. Теперь [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] утверждают, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] пренебрегли предостережениями и просьбами о расследовании, а ведь решительные меры предотвратили бы эту вспышку ереси."
 iberian_culture.24.title:0 "Маски сброшены"
 iberian_culture.25.a:0 "Оплатить восстановление."
 iberian_culture.25.b:0 "Мы не можем позволить себе такие траты."
 iberian_culture.25.desc:0 "Во времена [ShowReligionGroupAdjective('muslim')]ого владычества в области [ShowAreaName('granada_area')] была создана сложная сеть каналов — [ShowBuildingTypeName('irrigation_systems')], — по которой драгоценная вода течёт со Сьерра-Невады к полям и садам плодородных долин. Бои за этот край нанесли немалый урон каналам, от которых издавна зависит пропитание местных жителей."
 iberian_culture.25.title:0 "[ShowBuildingTypeNameWithNoTooltip('irrigation_systems')] под угрозой"
 iberian_culture.26.a:0 "Не жалеть средств ради паломников."
 iberian_culture.26.b:0 "Сейчас у нас есть дела поважнее."
 iberian_culture.26.desc:0 "Каждый год тысячи паломников пускаются в долгий путь, цель которого — [ShowLocationName('santiago_compostela')]. Поток странников принёс достаток бесчисленным поселениям, но дорога по-прежнему трудна: многие пути и мосты обветшали. Жители района [target_location.GetName] просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] привели в порядок дороги к Компостеле: по их словам, это и укрепит благочестие, и оживит торговлю, которой живёт [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.26.title:0 "Путь в Сантьяго"
 iberian_culture.27.a:0 "Взять сохранение традиции под покровительство."
 iberian_culture.27.b:0 "Укреплять позиции нашего языка."
 iberian_culture.27.desc:0 "Из поколения в поколение трубадуры области [ShowAreaName('galicia_area')] пели свои традиционные #italic кантиги#! на [ShowDialectName('galician_dialect')]ом — почтенном литературном языке, влияние которого вышло далеко за пределы области [ShowAreaNameWithNoTooltip('galicia_area')]. Однако это не тот язык, на котором говорит [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetName], и традиция понемногу угасает."
 iberian_culture.27.title:0 "Угасающая традиция"
 iberian_culture.28.a:0 "Укрепить их гильдию."
 iberian_culture.28.b:0 "Их опыт нужен нашему флоту."
 iberian_culture.28.desc:0 "Рыбаки района [target_location.GetName] объединились в гильдию, которую называют Рыбацким братством. Говорят, её цель — упорядочить промысел, сберечь морские знания и защищать интересы тех, кто бросает вызов волнам. Кроме того, братство стало опорой местной общины: в тяжёлые времена оно помогает своим членам и их семьям выстоять."
 iberian_culture.28.title:0 "Рыбацкие братства"
 iberian_culture.29.a:0 "Вложить его в местные промыслы."
 iberian_culture.29.b:0 "Этим богатствам найдёт применение [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.29.desc:0 "Ткачи, которыми славится [ShowLocationName('valencia')], прославились тонкими тканями — [ShowGoodsName('silk')] их работы восхищает знатоков, и им любуется вся [ShowContinentName('europe')]. Богатство, что приносит это цветущее ремесло, наполнило сундуки купцов, и свою долю получают также [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] никак не придёт к согласию о том, как распорядиться этим богатством."
 iberian_culture.29.title:0 "Валенсийский [ShowGoodsNameWithNoTooltip('silk')] приносит богатство"
 iberian_culture.3.a:0 "Позволить им переселиться."
 iberian_culture.3.b:0 "Постараться ограничить число поселенцев."
 iberian_culture.3.desc:0 "Теперь, когда область [ShowAreaName('granada_area')] наконец освобождена от [ShowReligionGroupAdjective('muslim')]ого владычества, многие семьи обращают взоры к этим землям в поисках лучшей доли. Недавно до нас дошли вести о переселенцах из провинции [origin_province.GetName]: их влекут обещания брошенных земель и надежда начать новую жизнь в провинции [target_province.GetName]."
 iberian_culture.3.title:0 "Заселение юга"
 iberian_culture.30.a:0 "Пусть виноградники разрастаются."
 iberian_culture.30.b:0 "Сберечь наши традиции виноделия."
 iberian_culture.30.desc:0 "В плодородных долинах Эбро уже много поколений процветают виноградники Риохи. Здешние вина отличаются исключительным качеством, и на это обратили внимание наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]: они видят возможность создать крупный промысел, засадив виноградниками все земли, которыми владеет [ROOT.GetCountry.GetFlavorRank]. Однако [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] возражают: это может нарушить местные обычаи, веками определявшие, как делать вино."
 iberian_culture.30.title:0 "Виноградники Риохи"
 iberian_culture.4.a:0 "Вложить деньги в местные нужды."
 iberian_culture.4.b:0 "Отдать пожертвования: пусть ими распоряжаются [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 iberian_culture.4.c:0 "Раздать милостыню бедным."
 iberian_culture.4.d:0 "Этими пожертвованиями распорядятся [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 iberian_culture.4.desc:0 "Разнеслась весть о чуде, будто бы случившемся в районе [target_location.GetName]. По словам местных жителей, на холме над поселением явилась Пресвятая Дева Мария. Кое-кто сомневается в чуде, но оно уже привлекло паломников из ближних и дальних краёв. Улицы заполнены странниками, и местные жители охотно на них наживаются. В здешнюю казну рекой текут пожертвования, и о том, как распорядиться нежданным богатством, идут жаркие споры."
 iberian_culture.4.title:0 "Чудо Девы Марии"
 iberian_culture.5.a:0 "Пусть каждое плавание учится на опыте предыдущего."
 iberian_culture.5.b:0 "Океан сулит бесконечные возможности."
 iberian_culture.5.desc:0 "[ShowCultureName('basque')]ие китобои вернулись из очередного плавания в далёкие северные моря. Бросив вызов коварным штормам и водам, неведомым большинству мореходов, они привезли домой и ценный груз, и богатый опыт. Теперь [ROOT.GetCountry.GetGovernment.GetCourtTitle] спорит о том, как распорядиться этими знаниями."
 iberian_culture.5.title:0 "Возвращение из северных морей"
 iberian_culture.6.a:0 "Талант не измеряется верой."
 iberian_culture.6.b:0 "Такие почести подобают лишь [ShowReligionGroupAdjective('christian')|U]им подданным."
 iberian_culture.6.desc:0 "Нам сообщили, что [target_character.GetName], искусный мастер [ShowReligionGroupAdjective('muslim')]ой веры, завоёвывает признание всюду, куда простирается [ROOT.GetCountry.GetFlavorRank]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить [target_character.GetHimHer] к нам на службу, однако многие [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] возражают против того, чтобы оказывать такую честь мудехару."
 iberian_culture.6.title:0 "Искусный мастер-мудехар"
 iberian_culture.7.a:0 "Справедливость должна восторжествовать."
 iberian_culture.7.a.tt1:0 "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.7.a.tt2:0 "Все [ShowReligionAdjective('catholic')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.7.b:0 "Мы должны защищать своих."
 iberian_culture.7.b.tt1:0 "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.7.b.tt2:0 "Все [ShowReligionAdjective('catholic')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.7.c:0 "Пусть разбираются сами."
 iberian_culture.7.desc:0 "В районе [target_location.GetName] вспыхнул раздор: [ShowReligionAdjective('sunni')]ие и [ShowReligionAdjective('catholic')]ие купцы обвиняют друг друга в том, что местные чиновники и гильдии благоволят соперникам. Нас просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] вмешались и рассудили этот спор."
 iberian_culture.7.title:0 "Раздор на рынке"
 iberian_culture.8.a:0 "Пусть праздник продолжается."
 iberian_culture.8.a.tt:0 "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.8.b:0 "Положить конец празднеству."
 iberian_culture.8.b.tt:0 "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.8.desc:0 "В районе [target_location.GetName] местные [ShowReligionAdjective('sunni')]ие общины вновь собрались на один из своих традиционных праздников — этот обычай живёт уже много поколений. Многие считают такие гулянья безобидной частью повседневной жизни, однако [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] настаивают на их запрете: по их словам, подобные публичные торжества подрывают [ShowReligionAdjective('catholic')]ий дух, на котором зиждется [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.8.title:0 "Спор о традициях мудехаров"
 iberian_culture.9.a:0 "Процветание идёт на пользу всем."
 iberian_culture.9.b:0 "Изъять часть их богатств, чтобы ограничить их влияние."
 iberian_culture.9.b.tt:0 "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.9.desc:0 "Квартал мудехаров в районе [target_location.GetName] процветает: он привлекает множество ремесленников и купцов, чьё трудолюбие принесло поселению новый достаток. Растущее богатство квартала идёт на пользу местному хозяйству, однако часть здешней знати уже опасается, что однажды влияние общины сравняется с её собственным."
 iberian_culture.9.title:0 "Процветающий квартал мудехаров"
