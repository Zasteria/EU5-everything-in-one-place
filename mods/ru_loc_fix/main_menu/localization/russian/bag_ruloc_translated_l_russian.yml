 aurillac.catalan_dialect:0 "Аурильяк"
 batalha_monastery_holy_site:0 "Монастырь Баталья"
 batalha_monastery_work_of_art:0 "Монастырь Баталья"
 batalha_monastery_work_of_art_desc:0 "Монастырь строился 131 год под руководством целых 15 архитекторов. Он сочетает в себе несколько художественных стилей и считается одним из самых красивых и значимых монастырей, которыми может похвастаться $POR$."
 black_death_plague_burns_out:0 "Чума угасает"
 bookmark_1337_desc:0 "Европу раздирают династические распри, а на горизонте уже маячит Чёрная смерть. От степей Золотой Орды до молодых итальянских республик — каждая держава стоит на распутье."
 bookmark_1337_name:0 "Столетняя война"
 bookmark_1658_desc:0 "Тестовая закладка для проверки семантики include и переопределений. Большинство файлов начальных условий через include берут данные закладки 1337 года; для SWE переопределены границы 1658 года (Сконе, Халланд, Эстония, Ливония). В журнале ожидаются ERRORLOGs о районах, которые уже кому-то принадлежат, — это описано в agent_docs/bookmark_overrides.md."
 bookmark_1658_name:0 "Эпоха великодержавия (тест)"
 break_others_alliance_no_countries:0 "@trigger_no! У них нет союзников, с которыми можно было бы порвать."
 build_panama_canal.b:0 "Не сейчас."
 build_panama_canal.title:0 "Построить Панамский канал"
 build_suez_canal.b:0 "Не сейчас."
 build_suez_canal.title:0 "Построить Суэцкий канал"
 byz_army_reform_decision.a:0 "Армия будет служить лишь одному человеку — [target_character.GetNameWithNoTooltip]."
 byz_army_reform_decision.a.entry:0 "Армия будет служить государю"
 byz_army_reform_decision.b:0 "Не будем умалять роль сословия [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 byz_army_reform_decision.b.entry:0 "Не будем умалять роль сословия $nobles_estate$."
 byz_army_reform_decision.desc:0 "Если раньше наша армия одерживала победы благодаря фемам и многочисленным ополчениям, которые они предоставляли, то рост благосостояния и централизация государств привели к тому, что военная служба стала постоянной профессией. [target_character.GetName] и [target_character.GetHerHis] совет усердно трудятся над новым устройством армии, которое будет меньше зависеть от войск, выставляемых сословием [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]."
 byz_army_reform_decision.title:0 "Реформа [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой армии"
 byz_army_reform_decision.title.entry:0 "Реформа византийской армии"
 byzantine_cataphracts:0 "Катафрактарии"
 cabalgada_raid_scales_with_selected_zeal:0 "Сила этого [Concept('modifier', 'модификатора')|e] зависит от [Concept('zeal', 'рвения')|e] выбранного [Concept('religious_order', 'религиозного ордена')|e]"
 cape_route_to_india_events.1.desc:0 "Таких флотов наши воды не видели целое поколение. Четыре корабля, сто семьдесят человек, припасов на долгие годы — [ShowGoodsName('salt')], [ShowGoodsName('fish')], твёрдые сухари, — и приказ найти морской путь туда, где лежит $india$: так [Select_CString(ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale, 'повелела', 'повелел')] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]. Священники благословляют корабли. Толпа теснится у самой воды. Кто-то плачет.\n\n[target_leader.GetName] стоит на носу, когда корабли минуют отмель у входа в гавань и выходят в открытый [ShowContinentName('atlantic_ocean_continent')]. Позади — гавань: [target_leader.GetHerHim] видно, как она тает белым пятнышком на зелёном холме. А впереди [target_leader.GetHerHim] открывается океан, без конца и края во все стороны. [target_leader.GetSheHe|U] [Select_CString(target_leader.IsFemale, 'всё рассчитала', 'всё рассчитал')]. [target_leader.GetSheHe|U] знает, чего потребует это плавание. А довольно ли этого — о том, как всегда, ведает лишь [ROOT.GetCountry.GetReligion.GetGodName]."
 cape_route_to_india_events.10.a:0 "Задобрить товарами — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] продаст нам право на постройку."
 cape_route_to_india_events.10.c:0 "Перебить цену [ShowCultureGroupNameWithNoTooltip('arabian_group')]их купцов — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] склонится к нам."
 cape_route_to_india_events.10.d:0 "Пока уступить — здесь распоряжается [target_ruler_country.Custom('GetRulerOrRegentTitle')]. Идти на север."
 cape_route_to_india_events.10.desc:0 "Маленький остров, не больше трёх километров из конца в конец, отделённый от материка узким проливом, глубины которого едва хватает для океанских судов. Над островом господствует каменная торговая фактория под зелёным флагом, а гавань забита доу со всех концов, что омывает [ShowContinentName('indian_ocean_continent')]. Из глубины материка идут [ShowGoodsName('ivory')] и чёрное дерево, с материка гонят невольников и невольниц, с юга поднимается [ShowGoodsName('copper')], а [ShowGoodsName('cloth')] и [ShowGoodsName('porcelain')] везут из краёв, где лежат $india$ и $china$, — и всё это переходит из рук в руки в торговой сети, что действует уже шесть столетий.\n\nПравит здесь [target_ruler_country.Custom('GetRulerOrRegentTitle')], и [Select_CString(target_ruler.IsFemale, 'правительница богата и подозрительна', 'правитель богат и подозрителен')]. [ShowCultureGroupName('arabian_group')]ие купцы, прибывшие раньше флота, уже нашептали [target_ruler.GetHimHer], что чужеземцы — [ROOT.GetCountry.GetReligion.GetAdjective]ие пираты, которые уничтожают всё, что не могут украсть. [target_ruler.GetHeShe|U] принимает посланника флота с подчёркнутой учтивостью, в окружении вооружённой стражи, и задаёт много вопросов о вооружении. [target_ruler.GetHerHis|U] собственное положение — в самом сердце гавани, окружённой жерлами пушек, — [ROOT.GetCountry.GetAdjective]ие гости вряд ли назвали бы удобным."
 cape_route_to_india_events.11.a:0 "Уйти до рассвета — такое гостеприимство не стоит риска."
 cape_route_to_india_events.11.c:0 "Если они замышляют измену, ударим первыми. Готовить людей."
 cape_route_to_india_events.11.desc:0 "Вход в гавань [ShowLocationName('mombasa')] узок — не шире двух кабельтовых, с возвышенностями по обоим берегам. Пока флот проходит пролив, люди начинают чуять неладное: на набережной слоняются люди с той нарочитой небрежностью, какая бывает у тяжело вооружённых бойцов, которым велели казаться безоружными; одно доу встало на якорь в странном месте — как раз там, где оно перекроет выход из пролива; а посланник — его шлёт [target_ruler_country.Custom('GetRulerOrRegentTitle')] — поднимается на флагман с пышными церемониями, подарками и слишком многими вопросами о том, сколько на борту бойцов.\n\nНочью толмач, нанятый флотом, пробирается в каюту капитана. Перед тем как вернуться на берег, посланник — тот, кого шлёт [target_ruler_country.Custom('GetRulerOrRegentTitle')], — говорил со своими спутниками на [location.GetDominantCulture.GetLanguage.GetName]ом наречии, а этот человек его понимает. Слова были недвусмысленны: из гавани [ShowLocationNameWithNoTooltip('mombasa')] флот выпускать нельзя."
 cape_route_to_india_events.12.a:0 "С радостью принять лоцмана — дар от [target_ruler.GetNameWithNoTooltip] — и [target_ruler.GetHerHis] дружбу."
 cape_route_to_india_events.12.b:0 "Дары, наше присутствие и защита — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] получит всё это."
 cape_route_to_india_events.12.c:0 "Помолимся перед переходом — нас привёл сюда [ROOT.GetCountry.GetReligion.GetGodName|U]."
 cape_route_to_india_events.12.d:0 "Вернуться домой — Каликут слишком далеко, а переход слишком опасен."
 cape_route_to_india_events.12.desc:0 "В [ShowLocationName('malindi')] всё иначе, чем прежде. [target_ruler.GetName], [target_ruler_country.Custom('GetRulerOrRegentTitle')], [target_ruler.GetHerselfHimself] спускается в гавань — в белых и зелёных шелках, в сопровождении музыкантов, играющих на инструменте, звуков которого не слышал ещё ни один [ROOT.GetCountry.GetAdjective]ий моряк. [target_ruler.GetSheHe|U] знает о флоте от [target_ruler.GetHerHis] людей на юге и давно ждёт его прибытия.\n\n[target_ruler.GetSheHe|U] предлагает дар ценнее слоновой кости: на [target_ruler.GetHerHis] службе, говорит [target_ruler.GetSheHe], состоит человек, двенадцать раз ходивший в Каликут. Человек, знающий каждое течение, каждый риф, каждую перемену ветра отсюда до Малабарского берега. Знающий, когда юго-западный муссон пронесёт корабль через [ShowContinentName('indian_ocean_continent')] за три недели, а когда погубит тот же корабль за сутки. Имя лоцмана, объясняет [target_ruler.GetNameWithNoTooltip], трудно передать на европейском языке. Но [target_ruler.GetHerHis] знание передать нетрудно, и цена ему — дружба."
 cape_route_to_india_events.12.historical_info:0 "Султан Малинди издавна соперничал с Момбасой и потому был расположен к португальцам, в которых видел возможный противовес своим врагам. Лоцман Индийского океана, которого он дал Васко да Гаме, — в португальских источниках его называют Малемо Канака, — уже не одно столетие остаётся предметом научных споров. Одни историки отождествляют его с Ахмадом ибн Маджидом, величайшим арабским мореплавателем XV века и автором нескольких трудов о мореплавании в Индийском океане. Другие считают это отождествление ошибочным и полагают, что лоцман был гуджаратским купцом. Кем он был на самом деле, по-прежнему неизвестно."
 cape_route_to_india_events.13.a:0 "Разложить наши товары — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] увидит их — и просить о фактории."
 cape_route_to_india_events.13.b:0 "Предложить договор: твёрдые пошлины, безопасная стоянка, защита."
 cape_route_to_india_events.13.c:0 "Назвать [ShowCultureGroupNameWithNoTooltip('arabian_group')]их купцов лжецами — пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')] выбирает."
 cape_route_to_india_events.13.d:0 "Наш лоцман бывал здесь: [target_ruler_country.GetGovernment.GetCourtTitle|l] ему не в новинку, и его совет направит наши слова."
 cape_route_to_india_events.13.desc:0 "[ShowLocationName('kozhikode')] больше, чем [ROOT.GetCountry.GetCapital.GetName]. В гавани больше кораблей, чем могут сосчитать офицеры флота, — суда отовсюду: [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')], [ShowAreaName('java_area')]. Целый мир стянут воедино притяжением пряностей — [ShowGoodsName('pepper')], корица, кардамон, [ShowGoodsName('cloves')], — и всё это течёт через этот порт. Флот бросает якорь на рейде, и без того тесном от доу, под пристальными взглядами [ShowCultureGroupName('arabian_group')]их купцов на набережной.\n\nДва месяца они твердят, что эти пришельцы — пираты с холодного севера, а не купцы; и слушает их сам [target_ruler_country.Custom('GetRulerOrRegentTitle')] — владыка Каликута, что правит из-за пышных церемониальных стен. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] [Select_CString(target_ruler.IsFemale, 'согласилась', 'согласился')] принять капитана флота, но [target_ruler.GetHerHis] [target_ruler_country.GetGovernment.GetCourtTitle|l] настороже, а [target_ruler.GetHerHis] купцы нервничают. В воздухе стоит запах — чёрный [ShowGoodsNameWithNoTooltip('pepper')] и соль моря, видевшего тысячу лет торговли. Всё, ради чего затевалось плавание, решится тем, что будет сказано в ближайший час."
 cape_route_to_india_events.13.e:0 "Установить #italic падран Сан-Габриэл#! у всех на виду."
 cape_route_to_india_events.14.a:0 "Возвести Сан-Жоржи-да-Мину — [ShowCultureNameWithNoTooltip('akan')]ие торговцы продают тому, кто ею владеет."
 cape_route_to_india_events.14.b:0 "Договориться о пленниках, которых [ShowCultureNameWithNoTooltip('akan')]ие вожди берут как военную дань."
 cape_route_to_india_events.14.c:0 "Взять поселение штурмом, пока купцы-вангара не ушли."
 cape_route_to_india_events.14.d:0 "Отметить размах торговли и идти на юг. Задерживаться некогда."
 cape_route_to_india_events.14.desc:0 "Лес начинается в дне пути от берега, и тропа между побережьем и лесом хорошо утоптана. Караваны выходят к берегу два-три раза в неделю: носильщики несут кожаные мешочки золотого песка, намытого из речного гравия в глубине материка, где [ShowCultureName('akan')]ие короли держат в руках прииски и сбывают излишки через сеть купцов-вангара, что сложилась ещё четыре столетия назад.\n\n[ROOT.GetCountry.GetAdjective]ие мореходы наслышаны об этом месте. Каждый [ShowCultureGroupName('arabian_group')]ий капитан, торговавший у этих берегов, говорил о рынках Золотого Берега как о самых прибыльных на всём Гвинейском побережье. Здешние люди видели чужеземные корабли и прежде. Они не боятся. Они прикидывают, чего стоят пришельцы."
 cape_route_to_india_events.15.a:0 "Основать факторию — остров держит в руках торговлю, что идёт через [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
 cape_route_to_india_events.15.b:0 "Установить #italic падран#!, нанести остров на карты и заявить на него права."
 cape_route_to_india_events.15.c:0 "Кренговать корпуса, наполнить бочки и добыть провизию на острове."
 cape_route_to_india_events.15.desc:0 "Из Гвинейского залива поднимается остров: вулканическая вершина в шлейфе облаков и густые джунгли до самой воды. [ShowCultureName('bubi_culture')]ий народ, живущий здесь, ещё не видел европейцев. Люди наблюдают с опушки леса, как флот бросает якорь в естественной бухте и спускает шлюпку.\n\nМореплаватель, давший острову своё имя, проходил здесь поколение назад и грубо нанёс его на карты. Эта карта есть у лоцмана флота. Но на ней не сказано, стоит ли здесь останавливаться."
 cape_route_to_india_events.15.desc.owned:0 "Остров поднимается из моря, как и прежде, — вулканическая вершина в шлейфе облаков, джунгли до самой воды, — но над якорной стоянкой уже реет наш флаг, а лодки, что выходят навстречу флоту, — наши.\n\nГадать, стоит ли здесь останавливаться, не нужно — [target_leader.GetName] знает ответ. Вопрос теперь лишь в том, сколько ещё можно извлечь из опорного пункта, которым [ROOT.GetCountry.GetNameWithNoTooltip] уже владеет здесь, на торговом пути через [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
 cape_route_to_india_events.16.a:0 "Торговать с [ShowCultureNameWithNoTooltip('somali_culture')]ими купцами. Любая связь на счету."
 cape_route_to_india_events.16.b:0 "Наблюдать, записывать и идти на север. Нам нужна $india$, а не это."
 cape_route_to_india_events.16.c:0 "Повернуть назад. Путь неведом, провизии не хватит."
 cape_route_to_india_events.16.desc:0 "[ShowLocationName('mogadishu')] больше, чем мы ожидали. Гавань полна доу из дальних краёв — [ShowRegionName('arabia_region')], $india$, — и в их трюмах [ShowGoodsName('cloth')], [ShowGoodsName('copper')] и [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] — владение державы [target_owner.GetName]; правит здесь [target_owner.Custom('GetRulerOrRegentTitle')], в чьих руках торговля между [ShowCultureName('somali_culture')]ими глубинными землями и широким миром океана. Купцы на набережной разглядывают наши корабли расчётливым взглядом. Мы не первые чужаки, что прибыли сюда под странными парусами со странными товарами, но, быть может, первые, кто пришёл с такого далёкого запада."
 cape_route_to_india_events.17.a:0 "Разыскать [ShowCultureNameWithNoTooltip('omani_culture')]ие власти и объявить о себе."
 cape_route_to_india_events.17.b:0 "Заплатить [ShowCultureGroupNameWithNoTooltip('arabian_group')]им штурманам за карты: нам нужна $india$."
 cape_route_to_india_events.17.c:0 "Пополнить запасы и уйти. [ShowCultureNameWithNoTooltip('omani_culture')]ие моряки нам не друзья."
 cape_route_to_india_events.17.historical_info:0 "Маскат был главным портом Ибадитского имамата Омана, одной из крупнейших морских держав западной части Индийского океана. Оманские моряки были среди самых искусных мореплавателей мира и прекрасно знали муссонные ветра, от которых зависело время перехода между Аравией и Индийским субконтинентом. Появление португальцев угрожало посреднической роли Омана в торговле пряностями, и отношения между Португалией и Оманом оставались враждебными большую часть XVI века, вылившись в череду войн за господство над Персидским заливом и портами Восточной Африки. В конце концов в XVII веке Оман изгнал португальцев из значительной части их восточноафриканских владений."
 cape_route_to_india_events.18.a:0 "Выбора нет — их пушки весомее наших протестов."
 cape_route_to_india_events.18.b:0 "Заявить протест и потребовать уважения к нашему суверенитету."
 cape_route_to_india_events.18.desc:0 "Их корабли пришли без предупреждения, встали на якорь на внешнем рейде и навели пушки на гавань. Просьба была вежливой по форме и непреклонной по сути. Они желали построить торговую факторию. Они станут платить небольшую ренту. Они будут уважать местные законы. Чего они не сказали — да и говорить не требовалось, — так это того, что будет, если мы откажем. Брёвна были уже нарублены и погружены в их трюмы. Фактория выросла за считаные дни. Теперь над ней реет [por_feitoria_builder.GetAdjective]ий крест — там, где прежде развевалось наше знамя."
 cape_route_to_india_events.18.title:0 "Португальская [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] на нашей земле"
 cape_route_to_india_events.19.a:0 "Разделить последние фрукты и на всех парусах идти к земле."
 cape_route_to_india_events.19.b:0 "Ничего не поделать. Похоронить мёртвых и молиться за живых."
 cape_route_to_india_events.2.a:0 "Вложить средства здесь и расширить форпост, охраняющий наш южный путь."
 cape_route_to_india_events.2.desc:0 "Десять вулканических островов поднимаются из плоского, пустого моря — это и есть [ShowProvinceDefinitionName('cape_verde_province')]. Флот знал, что их встретит, и всё же они приносят облегчение: твёрдая земля после недель открытого океана. Резиденция губернатора в [ShowLocationName('santiago')] — скромное строение из белёного камня. Гавань пахнет солью и вяленой рыбой, а ещё, едва уловимо, лишайником-орселью, который соскребают со скал ради красителя.\n\n[target_leader.GetName] взвешивает выбор. [ROOT.GetCountry.GetName] владеет этими островами уже не одно десятилетие, но «владеет» — слишком щедрое слово: маленький гарнизон, горстка поселенцев, один корабль с припасами в год. Если этот путь хоть что-то значит для будущего, которое ждёт [ROOT.GetCountry.GetNameWithNoTooltip], острова должны стать чем-то большим, чем место для стоянки."
 cape_route_to_india_events.20.a:0 "Убрать паруса и лечь в дрейф. Положимся на корабли."
 cape_route_to_india_events.20.b:0 "Бежать по ветру под малыми парусами и молиться, чтобы волна не накрыла с кормы."
 cape_route_to_india_events.21.b:0 "Спустить шлюпки и идти на буксире — всё лучше этого штиля."
 cape_route_to_india_events.22.a:0 "Кренговать корабли и выжечь червя из обшивки."
 cape_route_to_india_events.24.a:0 "Высадить зачинщиков на берег, и пусть малодушные уходят."
 cape_route_to_india_events.24.c:0 "Говорить с ними о том, что ждёт впереди: $india$, богатство и слава."
 cape_route_to_india_events.24.desc:0 "Это назревало неделями — в разговорах вполголоса, что смолкают при приближении офицера, в угрюмой медлительности, с какой исполняются приказы, во взглядах. Теперь это вырвалось наружу. Кучка людей на баке, у одного в кулаке свайка, а за ними толпа тех, кто ещё не решил, на чью сторону встать. Их требования — требования напуганных людей, уверенных, что их ведут на смерть: повернуть назад, идти в [ROOT.GetCountry.GetReligion.GetAdjective]ий порт, что угодно — лишь бы не плыть дальше в океан, который уже поглотил стольких их товарищей. [target_leader.GetName] стоит в одиночестве у края шканцев. От того, что [target_leader.GetSheHe] сделает в ближайшую минуту, зависит, останется ли от плавания хоть что-то."
 cape_route_to_india_events.25.a:0 "Отправить шлюпки на берег за водой и всем, что даст земля."
 cape_route_to_india_events.25.b:0 "Слишком рискованно у этого берега. Отметить на карте и идти дальше."
 cape_route_to_india_events.26.a:0 "Выменять на свежие припасы всё, что есть: [ShowGoodsNameWithNoTooltip('iron')] и [ShowGoodsNameWithNoTooltip('cloth')]."
 cape_route_to_india_events.28.a:0 "Заявить права на острова — пусть встанет [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] под нашим флагом."
 cape_route_to_india_events.28.b:0 "Высадиться за водой и взять всё, что дадут острова."
 cape_route_to_india_events.28.desc.foreign:0 "Над стоянкой у [ShowLocationName('santiago')] хлопают [rival_owner.GetAdjective]ие знамёна. Нас опередили — здесь уже прочно обосновалась держава [rival_owner.GetName]: гарнизон, батарея, начальник гавани, который выходит на шлюпке спросить о наших делах тоном столь же учтивым, сколь и неприветливым. Острова лежат прямо поперёк вод, через которые проходит наш путь; в [rival_owner.GetAdjectiveWithNoTooltip]их руках они — нож у горла каждого плавания на юг. [target_leader.GetName] молча разглядывает укрепления с борта и думает о многом."
 cape_route_to_india_events.29.desc.rafael:0 "Флот встал в устье широкой мутной реки, которую лоцманы уже зовут [ShowLocationNameWithNoTooltip('quelimane')] — Рекой Добрых Знаков, — ибо здесь люди наконец нашли то, ради чего пересекли полмира: местные суда с [ShowCultureGroupName('arabian_group')]им парусным вооружением и торговцев, которые знают слово «$india$» и, произнося его, указывают на восток. Великий переход близок. В трюме лежат отделанные известняковые столпы, привезённые из дома именно для этого, — каждый увенчан крестом и королевским гербом. Плотник спрашивает, не свезти ли один на берег. Воздвигнуть его — значит закрепить право в камне и, пока работают каменщики, запастись пресной водой и лесом; но это будет стоить флоту дней, которых у него может не быть."
 cape_route_to_india_events.3.a:0 "Основать торговую факторию — этот остров того стоит."
 cape_route_to_india_events.3.b:0 "Установить #italic падран#! и объявить остров владением короны."
 cape_route_to_india_events.3.desc:0 "$cape_route_to_india_events.3.desc_common$\n\nНа западном берегу ютится небольшое поселение. Здешняя земля, по словам поселенцев, необычайно плодородна: что ни посади — всё растёт. На сахаре с этого острова можно сколотить состояние — были бы только руки, чтобы его возделывать."
 cape_route_to_india_events.3.desc.foreign:0 "$cape_route_to_india_events.3.desc_common$\n\nНа западном берегу уже ютится поселение, и флаг над ним не наш: причалы, часовня, первые свежие плантации тростника — [rival_owner.GetAdjective]ие поселенцы добрались до этого плодородного острова раньше, чем [ROOT.GetCountry.GetName]. Земля здесь и впрямь так богата, как обещали рассказы, но у неё уже есть хозяин. Всё, что мы хотим получить от острова [ShowLocationNameWithNoTooltip('sao_tome')], теперь придётся взять силой или выторговать — хозяин здесь [rival_owner.GetNameWithNoTooltip]."
 cape_route_to_india_events.3.desc.uninhabited:0 "$cape_route_to_india_events.3.desc_common$\n\nНи над одним берегом не поднимается дым. Ни в одной бухте не ждёт лодка. Остров совершенно безлюден — шлюпки флота первыми касаются этого песка. И всё же почва там, где удаётся вырубить джунгли, черна, глубока и бесконечно плодородна. На сахаре с такого острова можно сколотить состояние — были бы только руки, чтобы его возделывать, и если экваториальные лихорадки не сведут тебя в могилу раньше."
 cape_route_to_india_events.30.a:0 "Да будет так. Вернёмся с тем немногим, что узнали."
 cape_route_to_india_events.30.desc:0 "Приказ отдан, и на корабле никто не спорит — на одних лицах облегчение, на других разочарование. Нос корабля поворачивает. Позади уходит неведомый берег; впереди — долгая знакомая дорога домой. Ни карт — $india$ так и останется неведомой; ни трюмов, где лежал бы [ShowGoodsName('pepper')]; ни места в летописях среди тех, кто первым нашёл морской путь на восток. Зато корабли целы, команды живы, а родная гавань — уже не надежда, а уверенность.\n\n[target_leader.GetName] долго смотрит на горизонт за кормой, прежде чем [target_leader.GetHerHis] внимание займут дела плавания, что ещё предстоят [target_leader.GetHerHim]."
 cape_route_to_india_events.31.desc:0 "Их капитан сошёл на берег с подарками, а не с пушкарями, и условия были улажены за три дня переговоров: участок земли у воды — там встанет их [ShowBuildingTypeName('por_feitoria')], — рента в нашу казну, наши собственные суды для любых ссор между их людьми и нашими и их флот, который встанет между этой гаванью и нашими соперниками. Брёвна вышли из их трюмов уже обтёсанными по мерке, и фактория выросла за считаные дни.\n\nНад ней реют два герба — наш и тот, что носит [por_feitoria_builder.GetName], — а стоянка внизу оживлённее, чем бывала за целое поколение. Наши внуки, может, ещё проклянут эту сделку, но сегодня счёт ясен: у нас порох, ткани и друг с пушками, а у них — склад и пристань."
 cape_route_to_india_events.4.a:0 "Просить аудиенции — пусть нас примет [target_owner.Custom('GetRulerOrRegentTitle')] этой земли."
 cape_route_to_india_events.4.b:0 "Выменять всё, что предложат: [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')] и прочее."
 cape_route_to_india_events.4.c:0 "Нанести устье реки на карты и идти на юг — медлить нельзя."
 cape_route_to_india_events.4.desc:0 "Здесь океан становится бурым. Уже целый день флот наблюдает, как это происходит: с юга в море растекается цвет крепкого чая, густой от ила. Затем открывается причина: река шире любой реки, что знает [ROOT.GetCountry.GetName], шире любой, какую доводилось видеть хоть одному из этих людей, бурым потоком вливается в [ShowContinentName('atlantic_ocean_continent')] и окрашивает море на многие километры во все стороны.\n\nИз-за мангровых зарослей появляются долблёные каноэ. Они огромны — выдолблены из цельного ствола, длиной в тридцать футов, и дюжина гребцов работает вёслами в безупречном согласии. Люди, стоящие на носу, безоружны. Они разглядывают флот со спокойным любопытством тех, кто никогда не боялся чужаков."
 cape_route_to_india_events.5.c:0 "Отметить место на картах и идти дальше на юг."
 cape_route_to_india_events.5.desc:0 "Каждый офицер экспедиции понимает это с первого взгляда. Ни один из моряков не видел на всём африканском берегу подобной гавани: длинная изогнутая бухта, укрытая с юго-запада естественной песчаной косой, глубокая вода у самого берега, а за ней — низкий мыс, с которого видно на все стороны. Местные рыбаки зовут это место Луанда — «ровное место».\n\n[target_leader.GetName] в предвечернем свете проходит всю косу из конца в конец: по одну руку бухта, по другую — открытый [ShowContinentName('atlantic_ocean_continent')]. [target_leader.GetSheHe|U] уже думает о стенах. О пресной воде. О том, сколько кораблей сумел бы защитить здешний гарнизон — или перехватить. Город, построенный здесь, мог бы держать в руках всю торговлю южной Атлантики."
 cape_route_to_india_events.5.desc.owned:0 "Флот входит в бухту, цену которой объяснять не нужно: [ShowLocationName('luanda')] уже под нашими цветами — здесь правит [ROOT.GetCountry.GetName], и длинная песчаная коса укрывает корабли, подвластные нашей собственной короне.\n\n[target_leader.GetName] в предвечернем свете проходит косу из конца в конец: по одну руку бухта, по другую — открытый [ShowContinentName('atlantic_ocean_continent')]. Думать приходится не о том, захватывать ли эту землю, а о том, сколько ещё она может дать. Если укрепить город ещё сильнее, он мог бы держать в руках всю торговлю южной Атлантики."
 cape_route_to_india_events.6.a:0 "Ободрить людей: Мыс наконец близко. Вперёд!"
 cape_route_to_india_events.6.b:0 "Эти течения и ветра говорят — дайте мне их прочесть."
 cape_route_to_india_events.6.c:0 "Дать людям отдых — силы понадобятся им в грядущих штормах."
 cape_route_to_india_events.6.desc:0 "Здесь пустыня выходит к самому морю: красные дюны поднимаются прямо от линии прибоя, и ветер срывает с их гребней песок. Деревьев нет. Пресной воды не видно. Побережье к северу — люди уже зовут его так: [ShowLocationName('skeleton_coast')], за китовые кости, белеющие на берегу, — на сотни миль во все стороны не выказывает ни малейших признаков человеческого жилья.\n\nИ всё же бухта спокойна. Укрытая от самой сильной зыби, она даёт флоту возможность починить повреждённую мачту и наполнить бочки из солоноватого источника среди дюн. На мысу над бухтой корабельный штурман измеряет высоту солнца своими инструментами и что-то записывает. Мыс, говорит он, не дальше недели пути к югу. Некоторые из моряков крестятся."
 cape_route_to_india_events.7.d:0 "Довольно — Мыс пройден. Поворачиваем домой."
 cape_route_to_india_events.7.desc:0 "Ничто за три месяца плавания не подготовило их к этому. Шторм налетает без предупреждения, с юго-запада, гоня перед собой волны высотой в сорок футов. Головной корабль исчезает во впадине и не показывается целых тридцать секунд. Снасти сорваны. Людей сбрасывает с рей. [target_leader.GetName] обеими руками вцепляется в кормовой поручень и смотрит на хаос, которому [target_leader.GetHerHim] не найти имени, — и где-то посреди воя ветра и грохота разбивающихся волн [target_leader.GetSheHe] понимает: они прошли. Мыс — великая южная оконечность африканского материка, край известного мира — остался за кормой.\n\nПуть туда, где лежит $india$, открыт."
 cape_route_to_india_events.7.historical_info:0 "Бартоломеу Диаш впервые обогнул Мыс в 1488 году и назвал его #italic Cabo das Tormentas#! (мыс Бурь). Согласно португальским источникам, король Жуан II переименовал его в #italic Cabo da Boa Esperança#! (мыс Доброй Надежды), чтобы вдохновить будущие экспедиции, хотя этот рассказ, возможно, вымысел. Мыс не является самой южной точкой Африки — эта честь принадлежит мысу Игольному, лежащему примерно в двухстах километрах к востоку, — но именно здесь встречаются Атлантический и Индийский океаны, и именно здесь открывается дверь на восток."
 cape_route_to_india_events.8.a:0 "Отдать за скот [ShowGoodsNameWithNoTooltip('copper')] и [ShowGoodsNameWithNoTooltip('cloth')]; установить #italic падран#!."
 cape_route_to_india_events.8.b:0 "Воздвигнуть #italic падран#! — пусть этой землёй владеет [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.desc:0 "Бухта спокойна и прекрасна, укрытая с юго-запада низким мысом. Вдоль берега молочные деревья дарят желанную тень. А на склоне над пляжем — скот. Тучные, здоровые коровы пасутся огромными стадами под присмотром высоких людей, украшенных охрой и стеклянными бусами; с безопасного расстояния они наблюдают за флотом с тех самых пор, как он бросил якорь.\n\nУ иных моряков при виде свежего мяса наворачиваются слёзы. Уже не одну неделю они живут на солёной рыбе и сухарях. Наконец один из пастухов спускается к кромке воды и стоит там, наблюдая, пока капитан флота не садится в шлюпку и не гребёт ему навстречу. Начинается обмен: кольца — [ShowGoodsName('copper')] здесь в цене, — сушёная рыба и долгие терпеливые жесты. К ночи в трюме уже три коровы. Их мычание кажется каждому на флоте самым прекрасным звуком, какой он слышал в жизни."
 cape_route_to_india_events.9.a:0 "Пусть здесь встанет большая [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — с этим золотом [ROOT.GetCountry.GetNameWithNoTooltip] разбогатеет."
 cape_route_to_india_events.9.desc:0 "Гавань [ShowLocationName('sofala')] полна доу. Это не те маленькие рыбачьи лодки, к которым флот привык на южном побережье, а океанские суда из далёких краёв — [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], — глубоко осевшие под грузом: [ShowGoodsName('ivory')], чёрное дерево, [ShowGoodsName('cloth')]. На набережной купцы ведут дела на [ShowLanguageName('arabic_language')]ом и на [location.GetDominantCulture.GetLanguage.GetName]ом — языке, которого не может распознать ни один из толмачей флота. Щепотки золотого песка переходят из рук в руки в обмен на штуки индийского хлопка.\n\nАрабские торговцы, веками заправлявшие этим портом, наблюдают за прибытием [ROOT.GetCountry.GetAdjective]ого флота из-под навесов своих складов. Лица их непроницаемы, но держатся они так, что ошибиться невозможно: появление этих чужаков с железными пушками и крестами на парусах их вовсе не радует. Капитан флота примечает самые большие склады, места стоянок доу, глубину воды у входа в бухту."
 cape_route_to_india_events.cargo_spent_tt:0 "Трюмы полегчали — груз, отданный за эту милость, уже не продать в конце пути (#R -20#! Груз)"
 cape_route_to_india_events.ship_lost_tt:0 "Корабль потерян, экспедиция поредела (#R -1#! Корабли)"
 cape_route_to_india_events.supplies_down_tt:0 "Запасы провизии флота тают (#R -10#! Провизия)"
 cape_route_to_india_expedition_outcome_overview:0 "$BULLET$На каждой остановке вдоль африканского побережья можно основать [ShowBuildingTypeName('por_feitoria')], а в ничейной гавани — [ShowBuildingTypeName('por_trading_post')], получив [Concept('location', 'район')|e] в полное владение; каждое из них даёт свой долговременный торговый [Concept('modifier', 'модификатор')|e].\n$BULLET$Прибытие в район [ShowLocationName('kozhikode')] даёт «[ShowModifier('calicut_trade_rights')]» и полный трюм товара «[ShowGoodsName('pepper')]», который продаётся за [Concept('gold', 'дукаты')|e] по рыночной цене.\n$BULLET$Завершение плавания затем даёт:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Постоянный [Concept('modifier', 'модификатор')] «[ShowModifier('cape_route_pioneer')]» либо, если основаны три или пять фейторий, вместо него «[ShowModifier('portuguese_african_network')]» или «[ShowModifier('east_africa_trade_dominance')]»."
 cardinal_scope_equal:0 "Является [CHARACTER.GetName]"
 cartographic_survey_events.1.a:0 "Заказать лучшие латунные инструменты и нанять лучших картографов."
 cartographic_survey_events.1.b:0 "Хватит и обычных картографов. Излишества ни к чему."
 cartographic_survey_events.10.a:0 "Раздать карту рыбацким деревням — на пользу торговле."
 cartographic_survey_events.11.a:0 "Отвести лучшие рощи под [ROOT.GetCountry.GetGovernment.GetAdjective]ий корабельный лес."
 cartographic_survey_events.12.a:0 "Отправить карту чиновникам, чтобы [ShowGoodsNameWithNoTooltip('salt')] продавалась по установленным правилам."
 cartographic_survey_events.12.desc:0 "Съёмочное судно занесло в журнал каждую выпарную площадку, где добывается [ShowGoodsName('salt')], каждый рассольный источник и каждую отмель вдоль побережья у [target_location.GetName]. Пересчитаны солеварные котлы, записаны привычные сезоны работ, опрошены местные торговцы, что возят [ShowGoodsNameWithNoTooltip('salt')], — о ценах, о спросе и о путях, по которым [ShowGoodsNameWithNoTooltip('salt')] уходит вглубь страны. Получившаяся карта открывает прибрежное хозяйство, в котором сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» до сих пор почти не разбиралось и которое принесло бы щедрый доход, если распространить на него налог на [ShowGoodsNameWithNoTooltip('salt')]."
 cartographic_survey_events.12.title:0 "Соляные промыслы взяты на учёт"
 cartographic_survey_events.14.a:0 "Отправить карту тем, кто возит [ShowGoodsNameWithNoTooltip('wine')], — пусть точнее выбирают сроки."
 cartographic_survey_events.15.a:0 "Отправить карту в деревни и торговцам, что сбывают [ShowGoodsNameWithNoTooltip('cloth')]."
 cartographic_survey_events.15.desc:0 "Съёмка нанесла на карту местное побережье красителей в [target_location.GetName]: отмели багрянок, из которых добывают тирский пурпур, кермесовые дубы над утёсами, посадки индиго на равнинах в глубине суши — или иное местное растение либо раковину, что даёт краску, за которую платят торговцы, сбывающие [ShowGoodsName('cloth')]. На карте отмечены сезоны работ, привычные места сбора и пути, по которым [ShowGoodsName('dyes')] попадают в ткацкие города."
 cartographic_survey_events.20.a:0 "Выставить створы и как следует нанести гавань на карту."
 cartographic_survey_events.21.a:0 "Отметить створные вехи. Проход ложится на карту."
 cartographic_survey_events.30.a:0 "Двигаться дальше. Слишком поздно начинать сезон заново."
 cartographic_survey_events.30.desc:0 "На третий день работ поднялась буря: она выбросила съёмочное судно на подветренный берег, где оно две холодные ночи билось в бурунах, и разметала шлюпки, посланные снять картографов с рабочих станций. Когда ветер стих и судно сняли с мели, сезон был уже потерян, инструменты промокли, а двух помощников боцмана похоронили в дюнах над берегом. Карта побережья у [target_location.GetName] осталась такой же пустой, как прежде."
 cartographic_survey_events.31.a:0 "Починить судно. По крайней мере, мель теперь на нашей карте."
 cartographic_survey_events.32.a:0 "Двигаться дальше. Под враждебным взором карты не составить."
 cartographic_survey_events.32.desc:0 "Судно без флага, под латинскими парусами и явно вооружённое, внезапно вынырнуло из дымки и направилось к съёмочному судну, стоявшему на якоре в [target_location.GetName]. Нашим людям, работавшим на берегу с инструментами, пришлось бросить работу, сесть в шлюпки и вернуться на корабль с недописанными журналами. Неизвестное судно полдня шло следом, а затем отвалило курсом, который указывает на враждебный порт приписки, — и съёмка этого участка побережья пошла прахом. Картографов теперь не уговорить вернуться."
 cartographic_survey_expedition_outcome_overview:0 "$BULLET$Каждый исследованный [Concept('port', 'порт')|e] может получить долговременный [Concept('location_modifier', 'модификатор района')|e] на срок от 10 до 20 лет, повышающий выпуск одного из нескольких товаров — например, «[ShowGoodsName('fish')]», «[ShowGoodsName('pearls')]» или «[ShowGoodsName('amber')]» — либо улучшающий саму гавань; кроме того, исследование приносит [Concept('prestige', 'престиж')|e].\n$BULLET$Исследование трёх и более портов также даёт:\n$BULLET_WITH_TAB$[Concept('modifier', 'Модификатор')|e] «[ShowModifier('accurate_charts')]» на 15 лет.\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')].\n$BULLET$Исследование меньшего числа портов приносит лишь #G +5#! [Concept('prestige', 'престижа')]."
