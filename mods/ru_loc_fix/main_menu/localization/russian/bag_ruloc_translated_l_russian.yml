 crisis_of_faith.1.a.tt:0 "Духовенство в нескольких самых неспокойных провинциях всё равно примкнёт к фракции «[ShowDisasterName('crisis_of_faith')]»"
 crisis_of_faith.10.a.tt:0 "Довольство всех групп населения, поддерживающих сейчас фракцию «[ShowDisasterName('crisis_of_faith')]», немного повысится"
 crisis_of_faith.100.desc:0 "Раскол преодолён. Раскольничьи проповедники рассеяны, их последователи вернулись в лоно церкви, а духовенство вновь сплотилось вокруг единого учения. Наша церковь обновилась: её авторитет и наше благочестие восстановлены."
 crisis_of_faith.101.b:0 "Пусть ересиарх взойдёт на престол."
 crisis_of_faith.101.desc:0 "Раскол одержал верх. Реформированное учение пускает корни в наших церквях и при нашем дворе, а прежнее учение отброшено. Целое поколение наша держава будет жить с расколотой верой и с духовенством, которое больше не подчиняется нашему трону безраздельно."
 crisis_of_faith.101.desc.heresiarch:0 "Раскол одержал верх, и у него есть лицо. Реформированное учение, которое проповедует [crisis_of_faith_heresiarch_scope.GetName], уже невозможно заставить умолкнуть, хотя сломили нашу власть на поле боя восставшие священники. Теперь победившее духовенство провозглашает [crisis_of_faith_heresiarch_scope.GetHerHis] возвышение, и в нашей церкви не осталось никого, кто осмелился бы им отказать. То, что мы защищали как священное, тихо отбрасывается."
 crisis_of_faith.102.a:0 "Церковь больше не в нашей власти."
 crisis_of_faith.102.desc:0 "Мы больше не правим как церковь. Что бы ни проповедовали раскольники, наше духовенство им не ответит, ибо оно больше не говорит от имени государства. Учение, от защиты которого мы отказались, по-прежнему звучит из уст верующих, а те, кто хранил для нас старую ортодоксию, помнят, кто оставил их с ней один на один."
 crisis_of_faith.102.title:0 "Оставленная вера"
 crisis_of_faith.11.a.tt:0 "Довольство всех групп населения, поддерживающих сейчас фракцию «[ShowDisasterName('crisis_of_faith')]», немного повысится"
 crisis_of_faith.12.a:0 "Выкупить эту преданность обратно."
 crisis_of_faith.12.b:0 "Мы не можем уследить за каждым залом."
 crisis_of_faith.12.desc:0 "Раскол обрёл кошелёк. [crisis_of_faith_heresiarch_scope.GetName] находит приём в великом зале одного из знатных домов нашей державы, и дворянин, распахнувший перед ересиархом двери, теперь оплачивает переписку проповедей, которые мы запретили. Мы можем негласно сделать встречное предложение, чтобы вернуть себе эту преданность, или смириться с тем, что не в силах уследить за каждым залом в стране."
 crisis_of_faith.12.title:0 "Покровитель раскола"
 crisis_of_faith.13.a:0 "Пресечь проповедь."
 crisis_of_faith.13.b:0 "Пусть верующие судят сами."
 crisis_of_faith.13.desc:0 "[crisis_of_faith_heresiarch_scope.GetName] больше не проповедует в подвалах. На рыночной площади собралась толпа, чтобы услышать раскольническое учение, произнесённое вслух, и никто не попытался этому помешать. Если заставить проповедь умолкнуть, все увидят, что наша церковь по-прежнему обладает властью, хотя стащить проповедника с кафедры на глазах у толпы — это скандал особого рода."
 crisis_of_faith.13.title:0 "Проповедь под открытым небом"
 crisis_of_faith.3.desc:0 "Наперекор расколу толпы благочестивых верующих собираются, чтобы вновь подтвердить верность утвердившейся вере. Их рвение может заново разжечь благочестие по всему государству, но такие страсти легко перерастают в беспорядки, если их не сдерживать."
 crisis_of_faith.6.a:0 "Назвать имя ересиарха."
 crisis_of_faith.6.a.tt:0 "Ересиарх вычислен, открыто действие «Осуждение ересиарха»"
 crisis_of_faith.6.desc:0 "Наши агенты проследили путь запрещённых проповедей через переписчиков и гонцов, которые их разносили, и все следы ведут к одной и той же двери. Автор раскольнического учения — [crisis_of_faith_heresiarch_scope.GetName], и до сих пор [crisis_of_faith_heresiarch_scope.GetSheHe] проповедует его изнутри нашей собственной церкви."
 crisis_of_faith.6.title:0 "Рука, стоящая за расколом"
 crisis_of_faith.7.a:0 "Осудить ересиарха перед верующими."
 crisis_of_faith.7.a.fail_tt:0 "У короны недостаточно власти, чтобы выступить против ересиарха"
 crisis_of_faith.7.desc.not_ready:0 "Мы бы назвали перед собравшимися верующими имя — [crisis_of_faith_heresiarch_scope.GetName] — и покончили с расколом, но корона не владеет залом. Духовенство, укрывающее [crisis_of_faith_heresiarch_scope.GetHerHim], сильнее трона, который хотел бы [crisis_of_faith_heresiarch_scope.GetHerHim] осудить, а неудавшееся осуждение запомнится как осуждение, которое отвергли."
 crisis_of_faith.7.desc.ready:0 "Корона вновь говорит со всей властью, и настал момент этим воспользоваться. Мы назовём перед собравшимися верующими имя — [crisis_of_faith_heresiarch_scope.GetName], — изложим [crisis_of_faith_heresiarch_scope.GetHerHis] заблуждения во всей полноте и лишим [crisis_of_faith_heresiarch_scope.GetHerHim] положения, сделавшего раскол возможным. Без своего автора реформированное учение — лишь слух."
 crisis_of_faith.7.title:0 "Осуждение ересиарха"
 crisis_of_faith.8.a:0 "Пусть получат своё учение."
 crisis_of_faith.8.desc:0 "Раскол не сломить — значит, его придётся купить. Мы даруем реформаторам учение, которого они требуют, и положение в нашей церкви, которое к нему прилагается. Фракция рассеется, а её проповедники вернутся к общинам, которые отныне по праву принадлежат им. Наше благочестие от этого не оправится, а уступку уже не взять назад."
 crisis_of_faith.8.title:0 "Уступить раскольникам"
