 integration_level_icon_integrated:0 "@integration_integrated!"
 italian_wars_exhausted_peninsula:0 "Полуостров истощён"
 italian_wars_exhausted_peninsula_desc:0 "Все здания «[ShowBuildingTypeName('italian_administration_center')]» обращаются в руины, а главы иноземных лиг получают тяжёлый удар по [Concept('government_power', 'власти правительства')|e]."
 italian_wars_foreign_league_triumph:0 "Иноземная лига торжествует"
 italian_wars_foreign_league_triumph_desc:0 "Глава победившей коалиции получает [Concept('prestige', 'престиж')|e] и долговременную награду за победу, а её участники сближаются друг с другом. Все итальянские и соперничающие иноземные лиги расплачиваются за это своим положением."
 italian_wars_italian_league_triumph:0 "Итальянская лига торжествует"
 italian_wars_italian_league_triumph_desc:0 "Глава победившей лиги получает [Concept('prestige', 'престиж')|e] и [Concept('stability', 'стабильность')|e], открывает новый административный закон и может силой или договором добиться верности её участников. Все соперничающие итальянские и иноземные лиги расплачиваются за это своим положением."
 itinerant_court_policy_at_risk_tt:0 "#italic Постройка «[ShowBuildingTypeName('itinerant_court_seat')]» будет утрачена, если показатель «[ShowSocietyDirectionName('decentralization')]» опустится ниже #W 10#! #!"
 jihad_cannot_leave_tt:0 "Державы не могут выйти из [Concept('jihad', 'джихада')|e] по своей воле. Участие прекращается, когда [jihad] расформировывается — после того, как война против его цели завершится."
 kirishitan.10.a:0 "#italic Слава Господу#!."
 koutoubia_marrakesh_holy_site:0 "Мечеть Аль-Кутубия"
 koutoubia_marrakesh_work_of_art:0 "Мечеть Аль-Кутубия"
 koutoubia_marrakesh_work_of_art_desc:0 "$koutoubia_marrakesh_work_of_art$, дважды возведённая в городе [ShowLocationName('marrakesh')], — яркий образец альморавидской архитектуры и важная достопримечательность в самом центре города. Своё название мечеть получила от книготорговцев, что вели дела вокруг неё."
 kyiv_pechersk_lavra_holy_site:0 "Киево-Печерская лавра"
 kyiv_pechersk_lavra_work_of_art:0 "Печерская лавра ($ORIGIN$)"
 kyiv_pechersk_lavra_work_of_art_desc:0 "Основанная в 1051 году монахами Антонием и Феодосием, Киево-Печерская лавра, или #italic Печерский монастырь#!, — один из старейших и важнейших центров восточного православия. Частично построенный под землёй, монастырь использовал свои пещеры и как кельи, и как места погребения. Со временем лавра разрослась в обширный религиозный и культурный комплекс, где изучали богословие и переписывали рукописи. К XIV веку она стала средоточием духовной жизни и просвещения Киевской Руси."
 lalibela_church_st_george_holy_site:0 "Скальные церкви Лалибэлы"
 lalibela_church_st_george_work_of_art:0 "Церковь Святого Георгия в Лалибэле"
 lalibela_church_st_george_work_of_art_desc:0 "Церковь Святого Георгия, высеченная в скале в правление короля Лалибэлы в XII веке, — вершина эфиопской монолитной архитектуры. Возведённая из стремления создать #italic Новый Иерусалим#!, она отражает религиозные чаяния своей эпохи и самобытное христианское наследие, которым славится $ETH$."
 legionaries:0 "Легионеры"
 little_ice_age_climate_recovers:0 "Долгая зима заканчивается"
 location_region_not_equal:0 "Район [LOCATION.GetName] НЕ находится в регионе [TARGET_REGION.GetName]"
 location_valid_for_calling:0 "Район [LOCATION.GetName] подходит для резиденции ордена с [Concept('calling', 'призванием')|e] «[TARGET_CALLING.GetName]»"
 location_valid_for_religious_order_type:0 "Район [LOCATION.GetName] отвечает требованиям для основания ордена типа «[TARGET_RELIGIOUS_ORDER_TYPE.GetName]»"
 marry_noble_effect:0 "[CHARACTER.GetName] и [TARGET_CHARACTER.GetName] вступают в брак."
 mining_survey_events.1.a:0 "Не скупиться. Отправить искусных пробирщиков и золото на образцы."
 mining_survey_events.1.b:0 "Хватит и скромной платы. Старейшины дадут проводников и кров."
 mining_survey_events.10.b:0 "Разрабатывать тихо. Соперникам-литейщикам пока незачем об этом знать."
 mining_survey_events.11.a:0 "Разрабатывать открыто. Пусть [ROOT.GetCountry.GetFlavorRank] знает: у нас есть [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b:0 "Разрабатывать тихо. Латунщики платят больше, пока слухи не расползлись."
 mining_survey_events.12.a:0 "Объявить о находке. Новая жила, где добывают [ShowGoodsNameWithNoTooltip('tin')], — дело государственной важности."
 mining_survey_events.12.b:0 "Держать в тайне. Прибрать к рукам торговлю бронзой раньше соперников."
 mining_survey_events.13.b:0 "Тихо распродать добычу по договорам пороховым мельницам и печатникам."
 mining_survey_events.14.a:0 "Возвестить о находке — пусть [ROOT.GetCountry.GetFlavorRank] знает. Рудник, где добывают [ShowGoodsNameWithNoTooltip('silver')], — это триумф."
 mining_survey_events.14.b:0 "Держать в тайне. Чужие глаза, обращённые на наше [ShowGoodsNameWithNoTooltip('silver')], сулят беду."
 mining_survey_events.14.historical_info:0 "Добыча серебра преобразила экономику Европы в позднее Средневековье и раннее Новое время. Открытие крупных серебряных жил в Шваце в Тироле и в Яхимове в Богемии в конце XV века, а затем находка в Потоси в Андах в 1545 году наводнили Европу слитками и подпитали великую инфляцию XVI века. Доходный серебряный рудник был стратегическим достоянием того же масштаба, что флот или крепость."
 mining_survey_events.15.b:0 "Разрабатывать тихо. [ShowGoodsNameWithNoTooltip('goods_gold')] притягивает непрошеных гостей."
 mining_survey_events.16.a:0 "Разрабатывать по [ROOT.GetCountry.GetGovernment.GetAdjective]ой грамоте. Пусть узнает и [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.16.b:0 "Сдать выработки в аренду железозаводчикам за постоянную долю."
 mining_survey_events.17.a:0 "Взять выработки под [ROOT.GetCountry.GetGovernment.GetAdjective]ий контроль. [ShowGoodsNameWithNoTooltip('stone')] — стратегический товар."
 mining_survey_events.17.b:0 "Сдать каменоломню в аренду гильдии каменщиков за постоянную плату."
 mining_survey_events.18.a:0 "Объявить о находке. Великая каменоломня, где добывают [ShowGoodsNameWithNoTooltip('marble')], — национальное сокровище."
 mining_survey_events.18.b:0 "Тихо приберечь [ShowGoodsNameWithNoTooltip('marble')] для [ROOT.GetCountry.GetGovernment.GetAdjective]их нужд."
 mining_survey_events.19.a:0 "Объявить о находке. Копи, где добывают [ShowGoodsNameWithNoTooltip('gems')], — чудо, которым стоит похвастаться."
 mining_survey_events.19.b:0 "Тихо приберечь [ShowGoodsNameWithNoTooltip('gems')] для [ROOT.GetCountry.GetGovernment.GetAdjective]ой казны."
 mining_survey_events.20.b:0 "Разрабатывать тихо. Монополия на [ShowGoodsNameWithNoTooltip('mercury')] — великая сила."
 mining_survey_events.20.desc:0 "В нагорье вскрыто месторождение киновари: её ярко-красная руда безошибочно указывает, что в породе есть [ShowGoodsName('mercury')]. Реторту и конденсатор уже устанавливают на безопасном расстоянии от выработок, ведь известно, что пары, выделяющиеся при обжиге, расшатывают зубы и мутят рассудок. Алхимики, пробирщики и золотильщики будут черпать из этого рудника ещё целое поколение, а за столь редкий и полезный металл можно запросить любую цену."
 mining_survey_events.21.b:0 "Сдать промысел в аренду торговцам солью за постоянную долю."
 mining_survey_events.22.a:0 "Объявить о находке. [ShowGoodsNameWithNoTooltip('alum')] — торжество мастерства, которым славится [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.22.b:0 "Разрабатывать тихо. Папской монополии на [ShowGoodsNameWithNoTooltip('alum')] знать об этом незачем."
 mining_survey_events.23.a:0 "Разрабатывать на правах [ROOT.GetCountry.GetGovernment.GetAdjective]ой монополии. [ShowGoodsNameWithNoTooltip('saltpeter')] — это война."
 mining_survey_events.23.b:0 "Позволить торговцам порохом разрабатывать залежь в обмен на право первыми получать добычу."
 mining_survey_events.30.a:0 "Отозвать отряд. Не всякая земля стоит того, чтобы хоронить в ней людей."
 mining_survey_events.31.a:0 "Оставить разработку. Местные не зря говорят о дурном воздухе."
 mining_survey_events.33.a:0 "Закрыть шахту. Свободные люди — опора, на которой стоит [ROOT.GetCountry.GetFlavorRank], и мы пришли не затем, чтобы их хоронить."
 mining_survey_events.33.historical_info:0 "Отравление свинцом, #italic colica plumbica#! древних, было хорошо известной профессиональной болезнью рудокопов, плавильщиков, стекольщиков и гончаров. Трактат Бернардино Рамаццини #italic De morbis artificum diatriba#! (1700), основополагающий труд медицины труда, отводил этому недугу обширную главу. Обычные средства — кровопускание, слабительное и питьё молока — не помогали, и единственной настоящей профилактикой было ограничение контакта со свинцом, к чему у владельцев рудников почти не было экономических стимулов."
 mining_survey_events.34.historical_info:0 "Серебряные жилы славились своей изменчивостью по простиранию: на одних участках они раздувались в рудные тела толщиной в несколько футов, на других сужались до пустых прожилков. Капризы строения жил превращали добычу серебра в ремесло просвещённого азарта, и взлёт и упадок средневековых горняцких городов, таких как Яхимов, Швац и Иглау, с мрачной закономерностью следовали за открытием и истощением отдельных жил."
 mining_survey_events.35.a:0 "Собираться и уходить. «Золото дураков» — старейшая ловушка старателей."
 mining_survey_events.35.title:0 "Не всё то золото, что блестит"
 mining_survey_events.36.a:0 "Закрыть выработку. Мы ещё не готовы бороться с рудничным газом."
 mining_survey_events.38.a:0 "Закрыть каменоломню. Трещиноватый [ShowGoodsNameWithNoTooltip('marble')] годится лишь на щебень для дорог."
 mining_survey_events.42.a:0 "Закрыть промысел. [ShowGoodsNameWithNoTooltip('alum')] здесь не получатся — химия не та."
 mining_survey_events.43.a:0 "Покинуть долину. Почва мертва, и [ShowGoodsNameWithNoTooltip('saltpeter')] здесь не образуется."
 montserrat_holy_site:0 "Монсеррат"
 montserrat_work_of_art:0 "Аббатство Святой Марии Монсерратской"
 montserrat_work_of_art_desc:0 "Этот монастырь на горе Монсеррат хранит [ShowWorkOfArtName('moreneta_key')] и служит важнейшим центром духовной жизни и паломничества. [ShowCultureName('catalan')]ая культура видит в нём также символ своей самобытности."
 mos_aptekarsky_prikaz_decision.desc.entry:0 "Приказы плохо приспособлены к тому, чтобы бороться со вспышками болезней и наводить порядок в тех частях страны, что поразила чума. Нам следует учредить новое ведомство, отдельное от прежних приказов, которое будет оказывать помощь, если мор снова обрушится на наш народ."
 mos_greek_latin_academy_decision.desc.entry:0 "Нашим дипломатам недостаёт владения [ShowLanguageName('latin_language')]им языком, и это сильно вредит нашим иностранным делам. $name_simeon.east_slavic_language$ $Sitnianowicz$ предлагает как следует обучить их этому языку, а сверх того вызвался преподавать простому народу риторику, чтобы люди лучше владели словом."
 mos_greek_latin_academy_decision.title:0 "Основание: $greek_latin_academy$"
