 ven_venetian_palaces_desc:0 "Города Венето строили своё богатство и порядок на #italic Comùn#! (#italic Comune#! на литературном итальянском — коммуна) — договоре горожан и знати о том, чтобы сообща нести бремя управления, а не оставлять его одному сеньору. От Падуи до Вероны и горных городков за ними эта традиция выборных советов, писаных статутов и городских судов придала нашей городской жизни такую устойчивость и уверенность, с какой не могли сравниться чисто феодальные края. Это общинное наследие делает наши учреждения стойкими, а горожан — кровно заинтересованными в процветании города, которым они помогают управлять."
