 war_of_religions_peace_of_westphalia_desc:0 "Война заканчивается без победителя: [GetUniqueInternationalOrganization('hre').GetName] получает долговременный удар по имперской власти и принимает политику, признающую законными все христианские вероисповедания в своих границах."
 war_of_religions_religious_supremacy_imposed:0 "Религиозное господство установлено"
 war_of_religions_religious_supremacy_imposed_desc:0 "Побеждённая сторона получает тяжёлый удар по [Concept('stability', 'стабильности')|e] и резко смещается к ценности «[ShowSocietyDirectionName('aristocracy')]», а [GetUniqueInternationalOrganization('hre').GetName] делает веру победителя своей имперской религиозной политикой."
 war_of_the_roses.18.title:0 "[ShowDisasterNameWithNoTooltip('war_of_the_roses')] разгорается"
 western_ocean_voyage_events.1.a:0 "Вперёд, что бы ни таил океан. Мы найдём это первыми."
 western_ocean_voyage_events.1.columbus:0 "[target_leader.GetNameWithNoTooltip] уверяет: по точным расчётам — три тысячи миль, не больше."
 western_ocean_voyage_events.4.a:0 "Водрузить флаг. Что бы это ни была за земля, она принадлежит нам."
 western_ocean_voyage_events.4.b:0 "Это не похоже ни на одно описание Индий. Пока ни на что не притязать."
 western_ocean_voyage_events.4.columbus:0 "Водрузить знамя. [target_leader.GetShortNameWithNoTooltip] не сомневается: это Индии."
 western_ocean_voyage_events.4.title:0 "Земля!"
 western_ocean_voyage_events.5.a:0 "Проложить курс с оглядкой на него — вдруг старые карты не лгут."
 western_ocean_voyage_events.5.b:0 "На картах мореходов полно островов, которых никогда не было."
 western_ocean_voyage_events.5.historical_info:0 "Антилия, Остров Семи Городов, появлялась на португальских и генуэзских картах уже в 1424 году: так обозначали большой остров к западу от Азорских островов. Согласно стоявшей за ним легенде, в 714 году, во время завоевания Иберии Омейядами, семь вестготских епископов бежали оттуда и основали семь городов на острове в западном океане. Легенда пережила эпоху великих открытий, которая будто бы её опровергла: когда десятилетия спустя Франсиско Васкес де Коронадо отправился искать семь золотых городов на юго-западе Северной Америки, он назвал свою цель в честь этого более древнего, чисто европейского предания."
 western_ocean_voyage_events.5.title:0 "Остров Семи Городов"
 western_ocean_voyage_events.6.a:0 "Записать всё как есть, вместе с противоречиями."
 western_ocean_voyage_events.6.b:0 "Оставить лишь то, в чём сходятся все: вглубь земли — и золото."
 western_ocean_voyage_events.6.historical_info:0 "Ранние свидетельства о первых контактах в Карибском море описывают таино, носивших небольшие золотые украшения — искусно обработанные, но, насколько могли судить пришельцы, не добытые на месте в сколько-нибудь заметном количестве. Когда островитян жестами спрашивали, откуда золото, они раз за разом указывали вглубь суши, а по некоторым рассказам — на земли дальше к югу и западу. Именно эти указания, переданные из вторых рук и неверно истолкованные, а вовсе не подтверждённые находки, определили, где следующие поколения исследователей искали золото в Америке."
 western_ocean_voyage_events.6.title:0 "Откуда берётся золото"
 western_ocean_voyage_events.7.a:0 "Пусть отчёт останется таким, как написан."
 western_ocean_voyage_events.7.historical_info:0 "Письменные и устные доклады вернувшихся экспедиций зачитывались при королевских дворах по всей Западной Европе уже через несколько месяцев после каждой высадки, а их переводы затем расходились повсюду. Эти рассказы, искажённые переводом и честолюбием рассказчиков, описывали богатства глубинных земель, которых ни один европеец ещё не видел своими глазами. Именно эти свидетельства из вторых рук, а не подтверждённые открытия, гнали следующие поколения исследователей всё дальше вглубь материка и всё дальше на юг на поиски того, что первые прибывшие видели лишь мельком."
