 game_concept_ambition:0 "Амбиция"
 game_concept_ambition_definition:0 "Тип амбиции"
 game_concept_ambition_definition_desc:0 "<Вставьте описание типа добавляемого объекта>"
 game_concept_ambition_definitions:0 "Типы амбиций"
 game_concept_ambition_desc:0 "<Добавьте описание конкретного объекта, когда он станет активен>"
 game_concept_ambition_modifier:0 "Модификатор амбиции"
 game_concept_ambition_modifier_desc:0 "[Concept('modifier', 'Модификатор')|e], относящийся к [Concept('ambition', 'амбиции')|e]. Действует всё время, пока мы стремимся осуществить эту амбицию."
 game_concept_ambition_modifiers:0 "Модификаторы амбиций"
 game_concept_ambitions:0 "Амбиции"
 game_concept_calling_desc:0 "Дело, которому посвящает себя [Concept('religious_order', 'религиозный орден')|e]: молитва, учёность, врачевание или война. Призвание подталкивает орден к определённым [Concept('societal_values', 'общественным ценностям')|e] и решает, что дают его [Concept('holdings', 'владения')|e]. Оно же окрашивает отношения ордена с принимающей его [Concept('country', 'страной')|e]: преданный орден благословляет державу своим призванием, а утративший преданность превращает то же призвание в бремя."
 game_concept_holding_desc:0 "[Concept('location', 'Район')|e], которым владеет [Concept('religious_order', 'религиозный орден')|e], — например, монастырь или капитул. Владение укрепляет район, в котором находится, и служит основой положения ордена в принимающей его [Concept('country', 'стране')|e]. В небольших державах владения весят больше: каждое из них заметнее на фоне всей страны."
 game_concept_industry_promotion_desc:0 "Поддержка отрасли закрепляет одну [Concept('area', 'область')|e] за одной отраслью промышленности. Каждая отрасль охватывает набор [Concept('goods', 'товаров')|e]: её поддержка повышает [Concept('output', 'объём выпуска')|e] каждого [Concept('building', 'сооружения')|e] в этой [Concept('area', 'области')], производящего эти [Concept('goods', 'товары')], а также повышает спрос ваших [Concept('pops', 'групп населения')|e] на них по всей [Concept('country', 'державе')|e].\n\nДля поддержки отраслей требуется [Concept('advance', 'улучшение')|e] [advance_icon][ShowAdvanceName('industry_promotion_advance')]. Сколько отраслей можно поддерживать одновременно, определяет показатель «$MODIFIER_TYPE_NAME_possible_industry_promotions$»; он растёт вместе с рангом [Concept('country', 'державы')], а также благодаря вашим [Concept('government_reforms', 'государственным принципам')|e] и последующим [Concept('advances', 'улучшениям')]. Поддержку можно отменить в любой момент, чтобы освободить ячейку."
 game_concept_industry_promotions:0 "Поддержка отраслей"
 game_concept_location_rank_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_capital_list_title:0 "[Concept('capital', 'Столицы держав')|e]"
 game_concept_location_rank_list_title:0 "Обычные районы"
 game_concept_location_rank_province_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_province_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_province_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_province_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_province_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_province_capital_list_title:0 "[Concept('province_capital', 'Столицы провинций')|e]"
 game_concept_location_rank_upper_desc:0 "У каждого [Concept('location', 'района')|e] свой ранг: район может быть [Concept('urban_location', 'городским')|e] или [Concept('rural_location', 'сельским')|e].\n\nЦвет значка ранга показывает, является ли [Concept('location', 'район')] столицей."
 game_concept_private_regiment:0 "Частный полк"
 game_concept_private_regiment_desc:0 "Частный полк — это [Concept('regiment', 'полк')|e], который [Concept('estate', 'сословие')|e] набирает и содержит в собственной частной армии, не расходуя наше [Concept('manpower', 'число рекрутов')|e]. Мы можем призвать такие полки к себе на службу, а после роспуска они возвращаются к сословию, а не пополняют наш запас рекрутов. Сословие, поднявшее восстание, отзывает все частные полки, которые нам одолжило."
 game_concept_private_regiments:0 "Частные полки"
 game_concept_promote_industry:0 "Поддержать отрасль"
 game_concept_religious_order_desc:0 "Братство, посвятившее себя служению [Concept('religion', 'религии')|e]. Оно может распространяться на многие [Concept('countries', 'державы')|e] и не подчиняется ни одному правителю. Орден живёт и гибнет вместе со своим [Concept('zeal', 'рвением')|e], следует [Concept('calling', 'призванию')|e], определяющему его поведение, и основывает [Concept('holdings', 'владения')|e] в [Concept('locations', 'районах')|e], расширяя своё присутствие. Его [Concept('religious_order_standing_short', 'влияние')|e] там, где он укоренился, — во благо или во вред — зависит от того же [Concept('zeal', 'рвения')|e]."
 game_concept_religious_order_standing_desc:0 "Насколько велико значение [Concept('religious_order', 'религиозного ордена')|e] в [Concept('country', 'державе')|e]. Исходное значение равно доле [Concept('holdings', 'владений')|e] ордена, приходящейся на эту державу; оно растёт или снижается в зависимости от довольства духовенства и от того, служат ли члены ордена правителем, регентом, членами совета или командирами, а затем умножается на [Concept('zeal', 'рвение')|e] ордена. Положение усиливает действующие на всю державу эффекты [Concept('calling', 'призвания')|e] ордена — не более чем до 200%."
 game_concept_unit_families:0 "Семейства войск"
 game_concept_unit_family:0 "Семейство войск"
 game_concept_unit_family_desc:0 "Некоторые [Concept('unit_types', 'типы войск')|e] объединены в семейства, и у всех членов одного семейства общий лимит найма. Улучшение отряда до более нового члена того же семейства никогда не занимает дополнительного места, поэтому лимит ограничивает, сколько таких отрядов вы можете выставить всего, а не сколько отрядов каждой [Concept('age', 'эпохи')|e]."
 game_concept_unit_formation_preference_desc:0 "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
 game_concept_zeal_desc:0 "Жизненная сила [Concept('religious_order', 'религиозного ордена')|e]. Каждый месяц рвение стремится к цели, которую задают [Concept('holdings', 'владения')|e] ордена и его положение в землях, где он действует; орден, чьё рвение иссякло, распускается. Ревностный орден обладает большим [Concept('religious_order_standing_short', 'влиянием')|e] везде, где действует, и воспитывает куда более способных вождей, а угасший — лишь слабых."
 game_timeline_country_map_struct:0 "#TOOLTIP:TIMELINE_COUNTRY_MAP,$DESC_KEY$,$MAP_SIZE$,$OWNER_KEY$ X#!"
 game_unit_family_struct:0 "#TOOLTIP:UNITFAMILY,$DESC_KEY$ $KEY_LOC|L$#!"
 gaude_mater_polonia:0 "Гимн «Gaude Mater Polonia»"
 generic_war_goal_independence:0 "Освобождение державы [COUNTRY.GetNameWithNoTooltip]"
 golden_age_of_piracy_brethren_crushed:0 "Пиратское братство разгромлено"
 golden_age_of_piracy_era_ends:0 "Золотой век угасает"
 golden_age_of_piracy_era_ends_desc:0 "Если независимая пиратская держава всё ещё располагает сильнейшим флотом среди своих собратьев, она получает модификатор «[ShowModifier('great_pirate_state_modifier')]», а её правитель остаётся в памяти как выдающийся администратор, дипломат и полководец."
 grand_embassy.1.a:0 "Подготовить делегацию как обычно."
 grand_embassy.1.a.tt:0 "Обычные приготовления, обычная секретность (Скрытность: 55)"
 grand_embassy.1.b:0 "Приложить все усилия, чтобы сохранить тайну."
 grand_embassy.1.b.tt:0 "Особая забота даёт настоящую безвестность (Скрытность: 75)"
 grand_embassy.1.c:0 "Отправить ложные делегации."
 grand_embassy.1.c.tt:0 "Ложные делегации запутывают след (Скрытность: 95)"
 grand_embassy.1.desc:0 "Прежде чем делегация отправится в путь, нужно решить, какой ей быть. Правитель, которого водят по пирам и стерегут в отведённых покоях, видит лишь то, что хозяева хотят показать; мастерские, сухие доки и учебные плацы остаются закрыты для почётных гостей. Лицом делегации станет [figurehead.GetName], а [target_ruler.GetName] будет держаться среди свиты, не привлекая внимания. Как далеко нам стоит зайти, чтобы так всё и оставалось?"
 grand_embassy.1.title:0 "Подготовка делегации"
 grand_embassy.10.a:0 "Принять их методы к сведению."
 grand_embassy.10.b:0 "Заплатить за полный рассказ об их ремесле."
 grand_embassy.10.c:0 "Заплатить за полный обзор и остаться, чтобы освоить его в совершенстве."
 grand_embassy.10.desc:0 "Общество писцов в городе [embassy_country.GetCapital.GetName] взялось подсчитывать всё подряд: рождения, урожаи, корабли в порту, даже цену хлеба от недели к неделе. Их книги занимают целые полки, каждый столбец датирован и сопоставлен с предыдущим, пока сами числа не начинают рассказывать историю, какую не поведал бы ни один летописец. Их альманахи будто бы показывают державу вернее любой хроники, предсказывая и голод, и изобилие по закономерностям, которые, похоже, замечают только они. За плату они объяснят свои методы любому, у кого хватит терпения высидеть всю арифметику."
 grand_embassy.10.title:0 "Составители альманахов"
 grand_embassy.11.a:0 "Наблюдать и запоминать."
 grand_embassy.11.b:0 "Заплатить придворному за более подробный урок."
 grand_embassy.11.c:0 "Заплатить за полный урок и остаться, чтобы освоить его в совершенстве."
 grand_embassy.11.desc:0 "Покрой камзола, посадка парика, должная глубина поклона: придворные в [embassy_country.GetName] изучают всё это так же пристально, как любой договор, а неудачная длина подола может стоить репутации, на восстановление которой уйдут годы. Каждая складка и каждое перо несут смысл, недоступный непосвящённым, и делегацию, одетую не так, как подобает, здесь по-настоящему и не замечают. Один из придворных негромко предлагает объяснить, что здесь носят и почему, кому следует кланяться первым — и насколько низко."
 grand_embassy.11.title:0 "Придворная мода"
 grand_embassy.12.a:0 "Сидеть тихо и слушать."
 grand_embassy.12.b:0 "Заплатить за вход в этот круг."
 grand_embassy.12.c:0 "Заплатить за полноправное место в кругу и остаться, чтобы освоить всё в совершенстве."
 grand_embassy.12.desc:0 "В особняке неподалёку от дворца купцы, учёные и праздные дворяне почти каждый вечер собираются за кофе, чтобы спорить о том, о чём прежде предпочитали молчать: о налогах, о вере и о том, где пролегают пределы власти короны. Беседы затягиваются допоздна и становятся всё громче по мере того, как догорают свечи, и никого, похоже, не заботит, кто слушает, — лишь бы и ему было что сказать. Добиться приглашения в этот круг, пусть даже чужестранцу, вполне возможно — если кофе хорош, а суждения смелы."
 grand_embassy.12.title:0 "Салон идей"
 grand_embassy.13.a:0 "Понаблюдать за отливкой."
 grand_embassy.13.b:0 "Заплатить мастеру, чтобы он объяснил своё ремесло."
 grand_embassy.13.c:0 "Заплатить мастеру сполна и остаться, чтобы освоить ремесло в совершенстве."
 grand_embassy.13.desc:0 "Литейщики державы [embassy_country.GetName] отливают пушки способами, за знание которых наши оружейники дорого бы заплатили: состав сплава, очертания формы, время остывания. Над жерлами печей дрожит раскалённый воздух, а работники движутся вокруг расплавленного металла с выверенным спокойствием, в котором видна долгая привычка, а не просто умение. Мастер литейного цеха, весь в потёках пота и явно гордый своей работой, готов рассказать больше — за плату, — и, похоже, ничто не доставляет ему большего удовольствия, чем зрители, которые действительно понимают, на что смотрят."
 grand_embassy.13.title:0 "В литейном цехе"
 grand_embassy.14.a:0 "Понаблюдать за учениями."
 grand_embassy.14.b:0 "Заплатить сержанту, чтобы рассмотреть всё поближе."
 grand_embassy.14.c:0 "Заплатить сержанту сполна и остаться, чтобы освоить строевую выучку в совершенстве."
 grand_embassy.14.desc:0 "На учебном плацу за городом [embassy_country.GetCapital.GetName] роты перестраиваются и перезаряжают оружие в ногу, быстрее, чем смогло бы любое наше ополчение; сапоги бьют в утоптанную землю в ритме, который, кажется, никогда не сбивается. Офицеры выкрикивают команды, и ряды отвечают раньше, чем слова успевают сорваться с губ, а весь строй разворачивается как единое тело, а не сотня отдельных людей. Польщённый нашим вниманием, сержант предлагает показать всю муштру целиком — от первой команды до последнего залпа."
 grand_embassy.14.title:0 "Учебный плац"
 grand_embassy.15.a:0 "Преподнести привычный подарок."
 grand_embassy.15.b:0 "Преподнести куда более щедрый подарок."
 grand_embassy.15.desc:0 "Камергер, устраивающий наши аудиенции, негромко даёт понять, что подарок в нужные руки способен открыть очень многие двери и что некоторые имена в некоторых списках имеют обыкновение забываться, стоит монете перейти из рук в руки. Он упоминает об этом почти мимоходом, как говорят о погоде, и ждёт, поймём ли мы намёк. Дело это мелкое и вполне обычное при любом дворе, хотя цена, как правило, растёт с каждой новой просьбой."
 grand_embassy.15.title:0 "Слово в нужное ухо"
 grand_embassy.16.a:0 "Нанять посредника."
 grand_embassy.16.b:0 "Нанять посредника и вдобавок заплатить за его молчание."
 grand_embassy.16.desc:0 "Посредник, который зарабатывает на жизнь тем, что облегчает путь иноземным гостям, предлагает свои услуги и уверяет, что у него есть связи в каждой караульне и на каждой таможенной заставе отсюда до самой границы. Он говорит осторожными полуфразами, никогда не называя прямо, кто ему обязан, — лишь то, что такие люди есть. За плату он может позаботиться о том, чтобы вопросов о том, куда и зачем направляется делегация, задавали поменьше, а ответы, если уж станут допытываться, звучали удовлетворительно расплывчато."
 grand_embassy.16.title:0 "Осмотрительный посредник"
 grand_embassy.17.a:0 "Теперь уже ничего не поделаешь."
 grand_embassy.17.b:0 "Заплатить, чтобы слух заглох."
 grand_embassy.17.desc:0 "Один из членов нашей свиты, изрядно выпив в таверне и желая произвести впечатление на компанию незнакомцев, сказал куда больше, чем следовало, о том, кто на самом деле возглавляет эту делегацию. Наутро он даже не помнит своих слов, зато их помнит трактирщик — и все, кто пил за соседним столом. Слух уже расходится по людским, передаваясь с тем особым смаком, который приберегают для тайн, слишком хороших, чтобы их хранить."
 grand_embassy.17.title:0 "Длинный язык"
 grand_embassy.18.a:0 "Остаётся надеяться, что он будет держать язык за зубами."
 grand_embassy.18.b:0 "Найти его и заплатить за молчание."
 grand_embassy.18.desc:0 "Купец, который когда-то, много лет назад и в более счастливые времена, торговал в державе [ROOT.GetCountry.GetName], проходит мимо делегации на улице и замирает на полушаге: его взгляд на миг дольше, чем следовало бы, задерживается на лице того, кого зовут [target_ruler.GetName], — после чего купец молча спешит прочь. Ошибиться в мелькнувшем на нём выражении невозможно: это не праздное любопытство, а внезапное, ошеломлённое узнавание. Он точно знает, кого увидел, и оставит ли он это при себе — от нас никак не зависит."
 grand_embassy.18.title:0 "Узнавание на улице"
 grand_embassy.19.a:0 "Отвечать как можно меньше."
 grand_embassy.19.b:0 "Заплатить ему достаточно, чтобы он перестал спрашивать."
 grand_embassy.19.desc:0 "У трактирщика, у которого остановилась делегация, слишком много вопросов, и каждый задан с нарочитой небрежностью человека, который уже догадывается, что ответы важны: почему столь знатная свита путешествует так скромно, почему монета всегда наготове и её никогда не пересчитывают дважды, почему никто в отряде не смотрит ему в глаза, когда он спрашивает об их делах. Он ещё не подозревает, а лишь любопытствует, перебирая в уме мелкие странности, как перебирают монету, проверяя, не обрезана ли она. Долго это может не продлиться."
 grand_embassy.19.title:0 "Любопытный трактирщик"
 grand_embassy.2.a:0 "Пусть говорит [figurehead.GetShortNameWithNoTooltip], а [target_ruler.GetShortNameWithNoTooltip] останется среди свиты."
 grand_embassy.2.a_no_figurehead:0 "Пусть [target_ruler.GetShortNameWithNoTooltip] остаётся среди свиты."
 grand_embassy.2.b:0 "Представить [target_ruler.GetShortNameWithNoTooltip] открыто — пусть все увидят [target_ruler.GetHerHim] без маски."
 grand_embassy.2.c:0 "Обойти [embassy_country.GetGovernment.GetCourtTitle] стороной. Мы приехали не для того, чтобы показываться."
 grand_embassy.2.desc.inland:0 "Делегация прибыла в город [embassy_country.GetCapital.GetName]. Мы приехали ради доступа — к мастерским и плацам, где ремесленники и строевые наставники державы [embassy_country.GetName] уже преобразили её торговлю и армию. [embassy_country.GetGovernment.GetCourtTitle] будет решать, сколько из этого нам на самом деле покажут, — глядя на то, как мы себя представим."
 grand_embassy.2.desc.port:0 "Делегация прибыла в город [embassy_country.GetCapital.GetName]. Мы приехали ради доступа — к сухим докам и арсеналам, где держава [embassy_country.GetName] строит флоты, благодаря которым опережает других на море. [embassy_country.GetGovernment.GetCourtTitle] будет решать, сколько из этого нам на самом деле покажут, — глядя на то, как мы себя представим."
 grand_embassy.20.a:0 "Вернуть его уже невозможно."
 grand_embassy.20.b:0 "Не жалеть денег, чтобы найти его и сжечь."
 grand_embassy.20.desc:0 "Письмо на родину, в котором прямо названо имя — [target_ruler.GetName] — и истинная цель делегации описана подробнее, чем допустила бы любая осторожность, пропало где-то между гонцом и кораблём. Ни требования выкупа, ни обвинений, ни малейшего следа — и это по-своему тревожнее, чем если бы они были. Где оно оказалось, кто его прочёл и что намерен делать с узнанным, мы сказать не можем."
 grand_embassy.20.title:0 "Перехваченное письмо"
 grand_embassy.21.a:0 "Высидеть до конца."
 grand_embassy.21.b:0 "Ускользнуть, чтобы увидеть что-нибудь более полезное."
 grand_embassy.21.desc:0 "[embassy_country.GetGovernment.GetCourtTitle] устраивает пир в честь делегации — с тостами, подношениями и речами, которых хватит на целый день; каждая перемена блюд изысканнее предыдущей, будто кухни соревнуются между собой. Каждое блюдо нужно похвалить, на каждый тост ответить тем же и каждого многословного сановника выслушать до конца, сколь бы мало он ни говорил по существу. Отказаться — значит нанести оскорбление; прийти — значит целиком потерять день на церемонии и полные тарелки."
 grand_embassy.21.title:0 "Пир в нашу честь"
 grand_embassy.22.a:0 "Следовать, куда ведут."
 grand_embassy.22.b:0 "Настоять на большем, как подобает гостям нашего ранга."
 grand_embassy.22.desc:0 "[embassy_country.GetGovernment.GetCourtTitle] приставляет к делегации чиновника, который должен сопровождать каждый наш шаг: любезного, неутомимого и твёрдо решившего, что мы не увидим ничего, кроме садов и галерей, как бы вежливо мы ни просили о большем. На каждый вопрос у него готов ответ, на каждую паузу — отвлекающий манёвр, и он возвращает разговор к фонтанам и фрескам всякий раз, когда тот подбирается слишком близко к чему-нибудь полезному. Мастерские остаются наглухо закрыты, сколько бы мы ни просили."
 grand_embassy.22.title:0 "Приставленный провожатый"
 grand_embassy.23.a:0 "Вежливо вытерпеть."
 grand_embassy.23.b:0 "Оборвать аудиенцию — и пусть чины обижаются."
 grand_embassy.23.desc:0 "Аудиенция у мелкого чиновника тянется часами: обмен любезностями, восхищение подарками, ни слова по существу — одни и те же учтивости повторяются в слегка ином порядке, пока совсем не теряют смысл. Он, похоже, никуда не спешит и наслаждается вниманием иноземных гостей куда больше, чем сутью того, о чём они могли бы говорить. Когда аудиенция наконец заканчивается, время для чего-либо полезного давно упущено."
 grand_embassy.23.title:0 "Долгая аудиенция"
 grand_embassy.24.a:0 "Заплатить управителю, чтобы записи стали скуднее."
 grand_embassy.24.b:0 "Заплатить управителю, чтобы записи бесследно пропали."
 grand_embassy.24.desc:0 "Управитель, ведущий ежедневный учёт двора, намекает — с той осторожностью, что выдаёт человека, делавшего это и прежде, — что за должное вознаграждение некоторые имена могут попросту не попасть в записи. Он не просит напрямую: он позволяет просить тишине и с выверенным терпением ждёт, когда мы её нарушим."
 grand_embassy.24.title:0 "Сговорчивый управитель"
 grand_embassy.25.a:0 "Раздать немного монет."
 grand_embassy.25.b:0 "Раздать очень много монет."
 grand_embassy.25.desc:0 "Делегация соперников от двора поменьше, прибывшая почти одновременно с нашей, вызывает куда больше пересудов: она шумная, бесцеремонная, и обсуждать её гораздо проще. Немного монет, розданных нужным слугам, помогут сохранить такое положение, направив все праздные языки на их приезды и отъезды вместо наших."
 grand_embassy.25.title:0 "Слух-приманка"
 grand_embassy.26.a:0 "Нанять проводника."
 grand_embassy.26.b:0 "Нанять проводника и вдобавок заплатить за особую осторожность."
 grand_embassy.26.desc:0 "Местный проводник, знающий, какие улицы и двери укрыты от чужих глаз и в какие часы стража смотрит в другую сторону, предлагает незаметно сопровождать делегацию во всех её передвижениях. Он не спрашивает, зачем нужна такая осторожность, — лишь во сколько мы её ценим."
 grand_embassy.26.title:0 "Безмолвный проводник"
 grand_embassy.3.a:0 "Открыть им доступ."
 grand_embassy.3.b:0 "Наши чудеса открыты для всех."
 grand_embassy.3.c:0 "Мы не позволим чужеземцам выведать наши секреты."
 grand_embassy.3.d:0 "Открыть им доступ, но без огласки."
 grand_embassy.3.desc.aware:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] уже негласно знает, кто на самом деле путешествует с этой делегацией. Если открыто объявить, что среди гостей — [target_ruler.GetName], неловко станет всем причастным; и всё же принимать правителя, готового учиться у чудес державы [ROOT.GetCountry.GetName], пусть и инкогнито, — немалая честь. Похоже, скрытность — палка о двух концах."
 grand_embassy.3.desc.unaware:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] принимает делегацию державы [from.GetName]: по их собственным словам, это ничем не примечательные путешественники, которым не терпится увидеть, как всё устроено в державе [ROOT.GetCountry.GetName]. Впустить ли их в наши мастерские и государственные институты или отправить восвояси?"
 grand_embassy.3.e:0 "Столь важные гости могут беспрепятственно увидеть наши чудеса."
 grand_embassy.3.f:0 "[target_ruler.GetShortNameWithNoTooltip], мы знаем, кто вы, и вам здесь не рады."
 grand_embassy.3.title:0 "Делегация при дворе"
 grand_embassy.4.a:0 "С благодарностью принять приглашение."
 grand_embassy.4.b:0 "Упросить хозяев позволить нам задержаться ещё дольше."
 grand_embassy.4.desc:0 "Теперь, когда стало известно, кто на самом деле путешествует с делегацией, [embassy_country.GetGovernment.GetCourtTitle] державы [embassy_country.GetName] передал нам приглашение: задержаться ещё ненадолго и увидеть больше из того, что здесь стоит увидеть."
 grand_embassy.5.b:0 "Попытаться спасти хоть что-то в [target_1.GetNameWithNoTooltip]."
 grand_embassy.5.c:0 "Поискать более тёплого приёма в державе [target_2.GetNameWithNoTooltip]."
 grand_embassy.5.d:0 "Держава [target_3.GetNameWithNoTooltip], возможно, окажется гостеприимнее."
 grand_embassy.5.e:0 "Попытать счастья в державе [target_4.GetNameWithNoTooltip]."
 grand_embassy.5.f:0 "Ещё можно нанести визит в державу [target_5.GetNameWithNoTooltip]."
 grand_embassy.7.b:0 "Отправиться дальше — в [target_1.GetNameWithNoTooltip]."
 grand_embassy.7.c:0 "Взять курс на державу [target_2.GetNameWithNoTooltip]."
 grand_embassy.7.d:0 "Нацелиться на державу [target_3.GetNameWithNoTooltip]."
 grand_embassy.7.e:0 "Ещё предстоит посетить державу [target_4.GetNameWithNoTooltip]."
 grand_embassy.7.f:0 "Повернуть делегацию к державе [target_5.GetNameWithNoTooltip]."
 grand_embassy.8.a:0 "Мы должны немедленно вернуться домой."
 grand_embassy.8.b:0 "Уроки, которые ещё предстоит усвоить, стоят такой цены."
 grand_embassy.8.desc:0 "До делегации дошли вести, что на родине начались беспорядки. Пока [target_ruler.GetName] находится за границей, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] желают знать, почему их [ROOT.GetCountry.GetGovernment.GetRulerTitle] отсутствует. Прервать путешествие сейчас — значит вернуться домой ни с чем. Продолжить путь — значит ещё какое-то время править заочно."
 grand_embassy.8.title:0 "Беда дома"
 grand_embassy.9.a:0 "Принять метод к сведению."
 grand_embassy.9.b:0 "Заплатить, чтобы изучить реестры полностью."
 grand_embassy.9.c:0 "Заплатить за доступ ко всем книгам и остаться, чтобы освоить их в совершенстве."
 grand_embassy.9.desc:0 "В державе [embassy_country.GetName] хранитель счетов проводит нас по книгам учёта и податным спискам, благодаря которым работает казна. Испачканные чернилами пальцы без малейших колебаний скользят по каждому столбцу, а итоги, кажется, никогда не лгут. Счетовод записывает каждую сумму дважды — один раз как причитающуюся, другой как уплаченную, — чтобы ни одна монета не ускользнула незамеченной, и ещё до конца недели сверяет записи с портовыми описями грузов. Здесь есть чему поучиться — тем, кто готов заплатить за время счетовода и кому хватит терпения проследить за методом до конца."
 grand_embassy.9.title:0 "Счётная контора"
 grand_embassy.discretion_down_10_tt:0 "Двор начинает подозревать (#R -10#! Скрытность)"
 grand_embassy.discretion_down_20_tt:0 "Слишком большая благосклонность привлекает слишком много глаз (#R -20#! Скрытность)"
 grand_embassy.discretion_down_30_tt:0 "Маскировка раскрыта (#R -30#! Скрытность)"
 grand_embassy.discretion_down_4_tt:0 "Проблеск узнавания (#R -4#! Скрытность)"
 grand_embassy.discretion_down_5_tt:0 "Укрыться всё труднее (#R -5#! Скрытность)"
 grand_embassy.discretion_set_0_tt:0 "Притворству конец (Скрытность: 0)"
 grand_embassy.discretion_up_10_tt:0 "Мы не попались на глаза (#G +10#! Скрытность)"
 grand_embassy.discretion_up_20_tt:0 "За монету можно купить немало забывчивости (#G +20#! Скрытность)"
 grand_embassy.modernization_up_0to10_tt:0 "Урок усваивается лучше без посторонних глаз (#G от +0 до +10#! Модернизация)"
 grand_embassy.modernization_up_15_tt:0 "Урок усвоен в совершенстве (#G +15#! Модернизация)"
 grand_embassy.modernization_up_5_tt:0 "Урок усвоен хорошо (#G +5#! Модернизация)"
 grand_embassy.opportunities_down_1_tt:0 "День потрачен (#R -1#! Возможности)"
 grand_embassy.opportunities_set_1_tt:0 "Чужаку показывают немногое (Возможности: 1)"
 grand_embassy.opportunities_set_2_tt:0 "Некоторые двери открываются в любом случае (Возможности: 2)"
 grand_embassy.opportunities_set_3_tt:0 "Перед нами открыты все двери (Возможности: 3)"
 grand_embassy.opportunities_set_4_tt:0 "От нас ничего не утаивают (Возможности: 4)"
 grand_embassy.opportunities_up_1_tt:0 "Приглашение открывает ещё одну дверь (#G +1#! Возможности)"
 grand_embassy.opportunities_up_2_tt:0 "Настойчивость, пусть и не слишком достойная, открывает ещё две (#G +2#! Возможности)"
 grand_tour_events.1.a:0 "Тамошние дворы научат [target_leader.GetHerHim] тому, чему не научат книги."
 grand_tour_events.1.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в сборе, сундуки уложены, на дороге, ведущей на юг, выстраивается эскорт. Впереди ждёт [ShowRegionName('italy_region')] — край древних руин, учёности, которую принесло [ShowInstitutionName('renaissance')], и дворов, чьё политическое искусство заставляет север казаться юнцом. Всё, чему наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] научится там, определит судьбу державы на целое поколение. Остаётся лишь решить, чему именно мы намерены [target_leader.GetHerHim] научить."
 grand_tour_events.1.party:0 "Потратим деньги на последнюю ночь веселья перед дорогой."
 grand_tour_events.10.connections:0 "Представимся ко двору — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.10.experience:0 "Побываем в старом арсенале и у кожевников на берегах Арно."
 grand_tour_events.10.historical_info:0 "В конце 1821 года Перси и Мэри Шелли поселились в Пизе и уговорили лорда Байрона присоединиться к ним, устроив его в палаццо Ланфранки на Лунгарно; вместе с Эдвардом и Джейн Уильямс, а позже и с Эдвардом Трелони они составили кружок, впоследствии известный как «Пизанский кружок». Байрон прибыл со свитой из лошадей, собак и обезьян, и всю зиму компания строила планы литературного журнала #italic «Либерал»#!. Ли Хант добрался до Италии лишь следующим летом, высадившись всего за несколько дней до того, как в июле Шелли утонул у тосканского побережья; кружок, собранный Шелли в Пизе, распался за считаные месяцы, оставив городу славу одного из самых овеянных легендами пристанищ романтизма."
 grand_tour_events.10.knowledge:0 "Посетим лекции в университете на Соборной площади."
 grand_tour_events.10.party:0 "Оставим лекцию ради ночи в портовых тавернах."
 grand_tour_events.11.connections:0 "Встретимся с местной властью — нас примут [court_host.GetNameWithNoTooltip] и городские чиновники."
 grand_tour_events.11.experience:0 "Осмотрим мастерские, где изготавливают предметы благочестия и паломнические значки."
 grand_tour_events.11.historical_info:0 "Вечером 26 октября 1786 года Иоганн Вольфганг фон Гёте добрался до Ассизи и, как он сам пишет в #italic «Итальянском путешествии»#!, с нескрываемым отвращением отвернулся от «огромной громады церквей, нагромождённых одна на другую на вавилонский манер», где покоятся останки святого Франциска, пренебрегши этим местом паломничества. Вместо этого он поднялся к римскому храму Минервы на площади старого города, назвав его «первым целиком сохранившимся памятником древности, какой я когда-либо видел». То, что Гёте пренебрёг самой знаменитой святыней Ассизи ради языческого храма, стало одним из самых поразительных личных суждений, дошедших до нас от эпохи Гран-тура."
 grand_tour_events.11.knowledge:0 "Изучим фрески и житие святого."
 grand_tour_events.11.party:0 "Оставим общество монахов ради более оживлённого вечера в городе."
 grand_tour_events.12.connections:0 "Добьёмся представления при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.12.experience:0 "Побываем в мастерских гончаров, знаменитых своей майоликой."
 grand_tour_events.12.historical_info:0 "В начале 1765 года романист Тобиас Смоллетт возвращался из Рима во Флоренцию, когда на крутом подъёме к Перудже его выбившиеся из сил лошади начали сползать назад под тяжестью кареты, увлекая её к краю обрыва. Случайный прохожий в последний миг подложил под колесо большой камень и остановил скольжение, избавив всех путников от участи быть, по словам самого Смоллетта, разбитыми вдребезги. Сменных лошадей в тот день не нашлось, и Смоллетту с семьёй пришлось заночевать в городе; они осмотрели его церкви и картины его уроженца Пьетро Перуджино, прежде чем вновь пуститься в дорогу на Флоренцию."
 grand_tour_events.12.knowledge:0 "Поучимся в университете и пройдёмся вдоль старых этрусских стен."
 grand_tour_events.12.party:0 "Оставим старые стены ради ночи в студенческих тавернах."
 grand_tour_events.13.connections:0 "Представимся в Хофбурге — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.13.experience:0 "Осмотрим арсенал и пристани лодочников на Дунае."
 grand_tour_events.13.historical_info:0 "В 1775 году врач Джон Мур посетил Вену как спутник юного герцога Гамильтона, и обоих удостоили частной аудиенции сначала у императора Иосифа II, а затем и у самой императрицы Марии Терезии в Шёнбрунне. Мур отмечал, что хвалёная чопорность двора растаяла, едва государственный канцлер князь Кауниц заметил путешествовавшего с ними четырнадцатилетнего сына Мура и настоял, чтобы император и императрица приняли и его. Мур записал и старую придворную историю о вспышке оспы, поразившей семью Габсбургов восемью годами ранее: узнав, что заразилась, одна из дочерей императрицы тотчас велела подать зеркало и весело простилась с красотой, которую болезнь вот-вот должна была погубить."
 grand_tour_events.13.knowledge:0 "Посетим соборные школы и городских учёных."
 grand_tour_events.13.party:0 "Сменим соборные школы на ночь на берегу Дуная."
 grand_tour_events.14.experience:0 "Осмотрим стекольные мастерские и золотых дел мастеров Золотой улочки."
 grand_tour_events.14.historical_info:0 "Путешествуя по Богемии в 1775 году в качестве спутника юного герцога Гамильтона, врач Джон Мур стоял со своим подопечным на одной из пражских улиц, когда проходивший мимо священник, состоявший при одной из городских семинарий, услышал их разговор и объявил: «Уверяю вас, я тоже ирландец». На вопрос, как он с такой лёгкостью определил их происхождение, священник ответил, что понял это, едва услышал английскую речь. До конца визита он служил им проводником и среди прочего показал окно канцелярии, из которого в 1618 году выбросили двух вельмож и их секретаря, — прецедент, который Мур с усмешкой рекомендовал государственным мужам всех стран."
 grand_tour_events.14.knowledge:0 "Посетим лекции в университете на холме."
 grand_tour_events.14.party:0 "Оставим университет ради ночи в прибрежных тавернах."
 grand_tour_events.15.connections:0 "Представимся при герцогском дворе — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.15.experience:0 "Осмотрим герцогский арсенал и торговые склады, где хранится [ShowGoodsNameWithNoTooltip('salt')]."
 grand_tour_events.15.historical_info:0 "В 1786 году писательница Эстер Линч Пиоцци проезжала через Мюнхен вместе с мужем во время долгого свадебного путешествия по континенту: они прибыли на рассвете после ночного перехода через Альпы из Инсбрука и задержались, чтобы осмотреть картинную галерею и кунсткамеру курфюрста. Среди вещей, которые показал ей один местный собиратель, было тончайшее изображение Девы Марии с Младенцем, исполненное словно из сотканной паутины, — настолько мелкое, что фигуры нельзя было различить невооружённым глазом и они становились видны лишь под микроскопом. Пиоцци с изумлением описала это зрелище, дивясь тому, сколько труда было потрачено на столь хрупкое и бесполезное изделие."
 grand_tour_events.15.knowledge:0 "Посетим соборные школы и городских летописцев."
 grand_tour_events.15.party:0 "Отложим летописи ради ночи в компании пивоваров."
 grand_tour_events.16.experience:0 "Побываем у переплётчиков и в типографиях близ университета."
 grand_tour_events.16.historical_info:0 "Во время пребывания в Париже в октябре 1763 года романист Тобиас Смоллетт увидел, как на дороге в Шуази остановилась наёмная карета и из неё высыпали пятеро или шестеро вооружённых мужчин, каждый из которых занял позицию за отдельным деревом. Решив, что это разбойники или стражники, преследующие преступника, Смоллетт спросил слугу, кто они такие, и узнал, что это господа, выбравшиеся из города на денёк поохотиться на зайцев и стрелявшие из укрытия во всякую пробегавшую мимо дичь. Всё это зрелище показалось Смоллетту нелепым, и он сухо заметил, что это, по крайней мере, действенный способ очистить поле от зайцев."
 grand_tour_events.16.knowledge:0 "Посетим диспуты в университете на левом берегу."
 grand_tour_events.16.party:0 "Променяем диспуты на таверны левого берега."
 grand_tour_events.17.connections:0 "Нанесём визиты — нас примут [court_host.GetNameWithNoTooltip] и самые видные купцы, которыми славится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.17.experience:0 "Побываем в печатнях и заглянем в счётные книги купцов."
 grand_tour_events.17.historical_info:0 "В октябре 1763 года романист Тобиас Смоллетт, направляясь на юг в Италию, добрался до Лиона и описал этот визит в письмах, позднее изданных как #italic «Путешествие по Франции и Италии»#!. Его направили в меблированные комнаты, где не оказалось мест, и тогда его привели в трактир, где запросили двенадцать ливров в день за три убогие комнаты и ещё тридцать два — за стол; возмущённый таким вымогательством, он молча удалился и отправился прямиком в соперничающую гостиницу. Рассказ Смоллетта о лионских трактирщиках-обиралах стал одним из самых цитируемых мест его книги и привычной жалобой английских путешественников на пути в Италию."
 grand_tour_events.17.knowledge:0 "Разыщем поэтов-гуманистов, что собираются у печатных станков."
 grand_tour_events.17.party:0 "Отложим счётные книги ради ночи среди гуляк."
 grand_tour_events.18.connections:0 "Встретимся с городским советом — нас примут [court_host.GetNameWithNoTooltip] и почтенные советники."
 grand_tour_events.18.experience:0 "Поднимемся на соборную башню и побываем в печатных мастерских."
 grand_tour_events.18.historical_info:0 "В начале 1770-х годов шотландский врач Джон Мур, путешествуя по континенту в качестве спутника герцога Гамильтона, поднялся на 466-футовый шпиль Страсбургского собора и описал свой визит в книге #italic «Взгляд на общество и нравы во Франции, Швейцарии и Германии»#!. Он рассказывает, как вместе с толпой ждал, когда к мессе прибудет внебрачный сын Людовика XV, но пробил полдень, вельможа так и не появился, и прихожане разошлись ни с чем, после чего Мур выслушал пламенную проповедь о тирании страстей. Отметил Мур и большой рог собора, в который трубили каждую ночь в память о заговоре, который проводники по-прежнему винили в резне, случившейся четыре столетия назад."
 grand_tour_events.18.knowledge:0 "Посетим лекцию в гимназии Иоганна Штурма."
 grand_tour_events.18.party:0 "Оставим печатни ради ночи у подножия шпиля."
 grand_tour_events.19.connections:0 "Нанесём визит — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.19.experience:0 "Побываем в гавани и поговорим со средиземноморскими моряками."
 grand_tour_events.19.historical_info:0 "В мае 1765 года романист Тобиас Смоллетт, возвращаясь через Прованс, добрался до Марселя и описал этот портовый город в письмах, позднее изданных как #italic «Путешествие по Франции и Италии»#!. Прогуливаясь по набережной гавани, он наблюдал за галерными каторжниками, которых корона отдавала внаём заниматься ремёслами в крохотных арендованных лавочках: прикованные за одну ногу, они, по его словам, жили неплохо и выглядели весёлыми — сапожники, серебряных дел мастера, книготорговцы. Смоллетт счёл Марсель благородным и процветающим городом, хотя и ворчал, что здешние трактирщики брали с него по четыре ливра с человека за каждую трапезу."
 grand_tour_events.19.knowledge:0 "Изучим надписи, напоминающие о том, что этот [target_location.GetRank.GetNameWithNoTooltip] основали [ShowCultureNameWithNoTooltip('greek_culture')]ие переселенцы."
 grand_tour_events.19.party:0 "Сменим сплетни на ночь в портовых тавернах."
 grand_tour_events.2.connections:0 "Посетим приём, который устраивает [court_host.GetNameWithNoTooltip]."
 grand_tour_events.2.desc.ducal_palace:0 "А над лагуной розовеет роскошный Дворец дожей, всем напоказ являя изысканность и богатство."
 grand_tour_events.2.desc.geography_intro:0 "[target_location.GetName] — [target_location.GetRank.GetName], существующий наперекор самой географии: выстроенный на илистых отмелях, держащийся на плаву благодаря торговле и управляемый советом купеческих семейств, который пережил все династии, какие только знала [ShowContinentName('europe')]."
 grand_tour_events.2.desc.heir_arrival:0 "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает, пожалуй, в самый космополитичный [target_location.GetRank.GetNameWithNoTooltip], какой только знает [ShowContinentNameWithNoTooltip('europe')]: на его рынках звучат все языки Средиземноморья, а за подходящую цену здесь можно купить любые сведения."
 grand_tour_events.2.experience:0 "Осмотрим верфи, где строит свои военные галеры [target_location.GetNameWithNoTooltip]."
 grand_tour_events.2.historical_info:0 "На Вознесенской неделе 1645 года английский джентльмен Джон Ивлин, совершавший тогда собственное долгое путешествие по Франции и Италии, побывал в одном из публичных театров Венеции на опере #italic «Эрколе в Лидии»#!. В дневнике он восхищается декорациями, сменявшимися тринадцать раз, и особо выделяет сопрано Анну Ренци, хотя одного певца-кастрата счёл даже превосходящим её, а генуэзского баса назвал «несравненным». Среди расписных перспектив и летающих машин зрелище «держало в плену наши глаза и уши до двух часов ночи». Венецию он покинул следующей весной, увозя сундуки, полные книг, гравюр и банок знаменитого венецианского териака."
 grand_tour_events.2.knowledge:0 "Изучим кораблестроение там, где работает [ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]."
 grand_tour_events.2.party:0 "Сменим счётные книги на ночь среди гуляк на каналах."
 grand_tour_events.20.connections:0 "Посетим приём, который устраивает [court_host.GetNameWithNoTooltip]."
 grand_tour_events.20.experience:0 "Изучим счётные книги великих банкирских домов."
 grand_tour_events.20.historical_info:0 "Утром 15 июля 1772 года английский историк музыки Чарльз Бёрни, проехав всю ночь, прибыл в Аугсбург и сразу отправился в собор, где услышал немецкую проповедь и мессу, которую по случаю праздника пели два хора. Певцами он восхитился, но гармонии органиста нашёл столь грубыми и надуманными, что исполнение скорее терзало слух, чем услаждало его, а при возношении Святых Даров его поразил грубый раскат барабанов и труб — обычай, который прежде он слышал только в Антверпене. Узнав, что кантор, к которому он вёз рекомендательные письма, в отъезде, Бёрни, собиравший материал для своей истории музыки, задерживаться не стал."
 grand_tour_events.20.knowledge:0 "Обратимся к городским древностям и рукописям гуманистов."
 grand_tour_events.20.party:0 "Отложим счётные книги ради игорных столов."
 grand_tour_events.21.experience:0 "Осмотрим литейни, где отливают колокола для церквей Рейнской области."
 grand_tour_events.21.historical_info:0 "В сентябре 1794 года писательница Анна Радклиф добралась до Кёльна, путешествуя с мужем по Рейнской области, — эта поездка описана в её опубликованных путевых заметках #italic «Путешествие, совершённое летом 1794 года»#!. Город она нашла переполненным беженцами, спасавшимися от французских армий, что наступали на Льеж и Маастрихт, а его улицы — забитыми госпитальными повозками с ранеными и умирающими. Все гостиницы были полны; путешественники за неимением комнат спали в каретах, на бильярдных столах и кушетках. Позднее Радклиф писала, что эта картина рассказала ей об истинной цене войны больше, чем любая битва, о которой она читала."
 grand_tour_events.21.knowledge:0 "Побываем на строительстве собора и у университетских учёных."
 grand_tour_events.21.party:0 "Оставим строительство собора ради ночи на берегу Рейна."
 grand_tour_events.22.connections:0 "Представимся ко двору — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.22.experience:0 "Изучим морской кодекс, хранящийся на купеческой бирже."
 grand_tour_events.22.historical_info:0 "В конце октября 1775 года английский антиквар Генри Суинберн добрался до Барселоны перед самым закрытием городских ворот на ночь — этот эпизод он описал в своих #italic «Путешествиях по Испании в 1775 и 1776 годах»#!. Засвидетельствовав почтение губернатору, он отправился в театр и поначалу ворчал, что «на этой сцене воздвигла свой трон Скука», но несколько дней спустя был покорён живым представлением #italic «Сида Кампеадора»#!, сыгранным в старинных испанских костюмах. Осмотрел он и цитадель, отметив, что её низкое, сырое, кишащее комарами место выбрали не ради здоровья, а для того, чтобы держать в страхе раскинувшийся внизу город."
 grand_tour_events.22.knowledge:0 "Посетим лекцию о законах каталонских #italic кортесов#!."
 grand_tour_events.22.party:0 "Сменим морской кодекс на портовые таверны."
 grand_tour_events.23.experience:0 "Осмотрим Суконные ряды, где купцы торгуют своими товарами."
 grand_tour_events.23.historical_info:0 "25 июля 1778 года Уильям Кокс, наставник юного лорда Герберта в долгом Гран-туре по северной и восточной Европе, переправился через Вислу в Краков и нашёл старую польскую столицу израненной ядрами и картечью недавних осад, а её роскошные дома — лежащими в руинах. Он осмотрел университет, основанный Казимиром Великим, где библиотекарь показал ему турецкую книгу, сама по себе не представлявшую большой ценности, но дорогую как диковина: взятая среди трофеев в битве под Хотином, она была подарена университету самим королём Яном Собеским в память о победе, которая спасла Польшу и принесла ему её трон."
 grand_tour_events.23.party:0 "Променяем лекционный зал на ночь у стен замка."
 grand_tour_events.24.a:0 "Сделаем крюк и заедем в город [ShowLocationNameWithNoTooltip('verona')]."
 grand_tour_events.24.b:0 "Лучше направимся в город [ShowLocationNameWithNoTooltip('ferrara')]."
 grand_tour_events.24.c:0 "Свернём в город [ShowLocationNameWithNoTooltip('bologna')]."
 grand_tour_events.24.d:0 "Двинемся дальше, в город [ShowLocationNameWithNoTooltip('florence')]."
 grand_tour_events.24.desc:0 "Отсюда, где стоит [target_location.GetName], расходится несколько дорог. Куда двинется путешествие дальше, решает [target_leader.GetName]: вглубь края, имя которому [ShowRegionName('italy_region')], или к дому."
 grand_tour_events.24.e:0 "Сделаем остановку в городе [ShowLocationNameWithNoTooltip('siena')]."
 grand_tour_events.24.f:0 "Сначала заглянем в город [ShowLocationNameWithNoTooltip('pisa')]."
 grand_tour_events.24.g:0 "Повернём к городу [ShowLocationNameWithNoTooltip('assisi')]."
 grand_tour_events.24.h:0 "Лучше направимся в город [ShowLocationNameWithNoTooltip('perugia')]."
 grand_tour_events.24.i:0 "Двинемся дальше, в город [ShowLocationNameWithNoTooltip('rome')]."
 grand_tour_events.24.j:0 "Продолжим путь в город [ShowLocationNameWithNoTooltip('naples')]."
 grand_tour_events.24.k:0 "Увиденного довольно. Вернёмся домой."
 grand_tour_events.24.title:0 "Куда дальше?"
 grand_tour_events.25.a:0 "Сделаем остановку в городе [ShowLocationNameWithNoTooltip('vienna')]."
 grand_tour_events.25.b:0 "Дадим отдых лошадям в городе [ShowLocationNameWithNoTooltip('prague')]."
 grand_tour_events.25.c:0 "Повернём к дому через город [ShowLocationNameWithNoTooltip('munich')]."
 grand_tour_events.25.d:0 "Остановимся в городе [ShowLocationNameWithNoTooltip('paris')] перед последним отрезком пути."
 grand_tour_events.25.desc:0 "Наконец путешествие поворачивает к дому. Чтобы не проделывать заново весь путь на юг, [target_leader.GetName] выбирает, где сделать остановку перед последним отрезком пути: дать отдых лошадям и, быть может, побывать при ещё одном дворе перед возвращением."
 grand_tour_events.25.desc.second:0 "Одной остановки мало, чтобы назвать это возвращением домой. Прежде чем дорога наконец приведёт в столицу — [ROOT.GetCountry.GetCapital.GetName], — [target_leader.GetName] выбирает ещё один город для остановки: последний двор, последняя диковина, прежде чем путешествие и впрямь завершится."
 grand_tour_events.25.e:0 "Проедем через город [ShowLocationNameWithNoTooltip('lyon')] по пути домой."
 grand_tour_events.25.f:0 "Переправимся в город [ShowLocationNameWithNoTooltip('london')], прежде чем повернуть вглубь материка."
 grand_tour_events.25.g:0 "Сначала сделаем остановку в городе [ShowLocationNameWithNoTooltip('strasbourg')]."
 grand_tour_events.25.h:0 "Проложим путь через город [ShowLocationNameWithNoTooltip('marseille')]."
 grand_tour_events.25.i:0 "Направимся в город [ShowLocationNameWithNoTooltip('augsburg')] перед последним переходом."
 grand_tour_events.25.k:0 "Отдохнём немного в городе [ShowLocationNameWithNoTooltip('cologne')]."
 grand_tour_events.25.l:0 "Отплывём домой через город [ShowLocationNameWithNoTooltip('barcelona')]."
 grand_tour_events.25.n:0 "Сделаем остановку в городе [ShowLocationNameWithNoTooltip('orleans')]."
 grand_tour_events.25.o:0 "Проедем через город [ShowLocationNameWithNoTooltip('krakow')] перед последним переходом к дому."
 grand_tour_events.25.p:0 "Довольно задержек. Направимся прямо домой."
 grand_tour_events.25.title:0 "Дорога домой"
 grand_tour_events.26.experience:0 "Побываем у торговцев, продающих [ShowGoodsNameWithNoTooltip('wool')], и в городских гильдейских залах."
 grand_tour_events.26.historical_info:0 "В 1765 году французский магистрат и литератор Пьер-Жан Гросле провёл почти год в Лондоне, собирая материал для книги, позднее переведённой на английский под названием #italic «Путешествие в Лондон»#!. Среди прочего он записал, как один государственный министр провёл двадцать четыре часа без перерыва за игорным столом, всё это время подкрепляясь лишь холодной говядиной, зажатой между двумя ломтиками поджаренного хлеба. «Это новое блюдо, — писал Гросле, — вошло в большую моду, пока я жил в Лондоне», и с тех пор его называли по имени изобретателя. Этот анекдот, приукрашенный или нет, стал самой цитируемой строкой его «Путешествия»."
 grand_tour_events.26.knowledge:0 "Послушаем чтения об общем праве в Судебных иннах."
 grand_tour_events.26.party:0 "Отложим гильдейские залы ради ночи в тавернах, которыми славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.27.experience:0 "Осмотрим винные погреба и гильдию луарских лодочников."
 grand_tour_events.27.historical_info:0 "В апреле 1644 года молодой автор дневников Джон Ивлин, спускаясь по Луаре, сделал остановку в Орлеане — во время одного из самых ранних задокументированных Гран-туров. Он посетил древний университет, студенты которого по-прежнему делились на четыре исторических «нации» — французскую, нормандскую, пикардийскую и верхненемецкую, — каждую со своими должностными лицами, и пользовался двумя городскими публичными библиотеками, отметив, что учёный мог взять книгу к себе на квартиру, просто оставив расписку, — щедрость, показавшаяся ему поразительной. Видел он и коллегиальную церковь Святого Креста, некогда величественную, но всё ещё носившую явные следы недавних гражданских войн."
 grand_tour_events.27.party:0 "Променяем лекции по праву на таверны у реки."
 grand_tour_events.27.title:0 "[target_location.GetNameWithNoTooltip] — Город на Луаре"
 grand_tour_events.28.desc.scholar:0 "До свиты доходит весть об учёном, живущем в городе [target_location.GetName], чья слава привлекает студентов со всего континента; за плату и ради достойного ученика его, возможно, удастся уговорить на время давать уроки, и учеником станет [target_leader.GetName]."
 grand_tour_events.28.desc.university:0 "До свиты доходит весть: место среди студентов университета, которым славится [target_location.GetName], может получить и [target_leader.GetName] — лекции, диспуты и общество учёных, чьи имена будут помнить ещё долго после того, как об этом путешествии забудут."
 grand_tour_events.28.title:0 "Возможность поучиться"
 grand_tour_events.29.desc:0 "Месяцы учёбы подходят к концу, и [target_leader.GetName] решает, чему на самом деле удалось научиться в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.29.title:0 "Конец лекций"
 grand_tour_events.3.connections:0 "Постигнем искусство меценатства при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.3.experience:0 "Осмотрим мастерские, где прядут [ShowGoodsNameWithNoTooltip('wool')], и золотых дел мастеров на Понте-Веккьо."
 grand_tour_events.3.historical_info:0 "Осенью 1764 года больной шотландский романист Тобиас Смоллетт посетил галерею Уффици и, стоя перед Венерой Медицейской, которую все прочие путешественники Гран-тура восхваляли на веру, написал: «Не могу отделаться от мысли, что в чертах Венеры нет никакой красоты, а поза её неуклюжа и неестественна». Позднее Лоренс Стерн увековечил эту вспышку: его вымышленный Йорик у Пантеона в Риме корит «Смельфунгуса» за то, что тот «набросился на богиню и обошёлся с ней хуже, чем с последней уличной девкой, без малейшего к тому повода». Их спор из-за одной мраморной Венеры пережил их обоих."
 grand_tour_events.3.knowledge:0 "Добьёмся знакомства с учёными монастыря."
 grand_tour_events.3.party:0 "Отложим рукописи ради азартных игр — игорными столами славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.3.title:0 "[target_location.GetNameWithNoTooltip] — [target_location.GetRank.GetNameWithNoTooltip], где родилось [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.30.desc:0 "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что [target_country.GetLongName] ведёт войну и что тамошние офицеры готовы принять гостей с надлежащими рекомендациями. Командования [target_leader.GetName] не получит и за судьбу солдат отвечать не будет, зато сможет скакать бок о бок с бывалыми офицерами, своими глазами увидеть военную кампанию и постичь то, что до конца не удалось передать ни одной книге о стратегии."
 grand_tour_events.30.title:0 "Возможность увидеть войну"
 grand_tour_events.31.desc:0 "Сезон походов подходит к концу, и [target_leader.GetName] решает, чему на самом деле удалось научиться у офицеров в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.31.title:0 "Конец кампании"
 grand_tour_events.32.desc:0 "[target_leader.GetName] получает приглашение провести сезон гостем при дворе: [target_country.GetLongName] предлагает покои во дворце, постоянное приглашение на каждый приём и знакомство со всеми придворными и заезжими дипломатами, которых стоит знать."
 grand_tour_events.32.desc.no_owner:0 "[target_leader.GetName] получает приглашение провести сезон гостем в доме виднейшего семейства, которым славится [target_location.GetName]: знакомство со всеми влиятельными людьми, которых стоит знать, и постоянное место за их столом."
 grand_tour_events.32.title:0 "Возможность завести связи"
 grand_tour_events.33.a:0 "Обдумаем приобретённое и продолжим путь."
 grand_tour_events.33.desc:0 "Сезон при дворе подходит к концу, и [target_leader.GetName] решает, что на самом деле дали знакомства, заведённые в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.33.title:0 "Сезон при дворе окончен"
 grand_tour_events.34.desc:0 "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что в городе [target_location.GetName] живёт поистине прославленный мастер фехтования, готовый взять на сезон многообещающего ученика. Ни одной по-настоящему значимой дуэли [target_leader.GetName] не проведёт и ни одной настоящей ссоры не разрешит, зато сможет освоить работу ног, чувство дистанции и времени и ту особую отвагу, которую до конца не удалось передать ни одному фехтовальному наставлению."
 grand_tour_events.34.title:0 "Возможность учиться фехтованию"
 grand_tour_events.35.desc:0 "Сезон уроков подходит к концу, и [target_leader.GetName] решает, чему на самом деле научили поединки в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.35.title:0 "Конец уроков"
 grand_tour_events.36.a:0 "Отметим это скромным празднеством."
 grand_tour_events.36.b:0 "Нам некогда думать о старом дворе на родине."
 grand_tour_events.36.desc:0 "Наконец путешественников настигает письмо: его прислала родина — [ROOT.GetCountry.GetName]. В нём [ROOT.GetCountry.GetGovernment.GetRuler.GetName] с нежностью пишет, что при дворе с похвалой отзываются о том, как держится [target_leader.GetName], и о рассказах о том, как [target_leader.GetHerHim] принимают за границей и как проходит [target_leader.GetHerHis] время в чужих краях, — их уже не раз обсуждали за ужином."
 grand_tour_events.36.title:0 "Письмо из дома"
 grand_tour_events.37.a:0 "Пусть [target_leader.GetHerHim] представят нужным людям."
 grand_tour_events.37.b:0 "Примем [gt_admirer.GetHerHis] подарок — прекрасные наряды, достойные путешествия."
 grand_tour_events.37.c:0 "Примем [gt_admirer.GetHerHis] приглашение остановиться в [gt_admirer.GetHerHis] собственном доме."
 grand_tour_events.37.desc:0 "[gt_admirer.GetName], юная особа из местной знати, явно очарованная [target_leader.GetHerHis] положением и воспитанием, разыскивает [target_leader.GetHerHim], желая хоть чем-то быть полезной во время [target_leader.GetHerHis] визита в город [target_location.GetName]."
 grand_tour_events.37.title:0 "Местный почитатель"
 grand_tour_events.38.a:0 "Попросим о представлении, рискуя произвести неловкое впечатление."
 grand_tour_events.38.b:0 "Будем добиваться этого изо всех сил — к чёрту неловкость."
 grand_tour_events.38.c:0 "Насладимся вечером, и на этом всё."
 grand_tour_events.38.desc:0 "На званом ужине [target_leader.GetName] оказывается рядом со скромным молодым человеком по имени [gt_secretary.GetName], который мало говорит о себе, пока случайная обмолвка не выдаёт в нём секретаря кардинала [target_cardinal.GetName]. Он невзначай даёт понять, что одного его слова довольно — и [target_leader.GetNameWithNoTooltip] удостоится приёма у самого кардинала, если впечатление от сегодняшнего вечера окажется верным."
 grand_tour_events.38.title:0 "Полезное знакомство"
 grand_tour_events.39.a:0 "Разовьём мысль дальше, рискуя стать посмешищем, если она ошибочна."
 grand_tour_events.39.b:0 "Доведём её до предела — к чёрту насмешки."
 grand_tour_events.39.c:0 "Сегодня мы показали себя достойно. На этом и остановимся."
 grand_tour_events.39.desc:0 "Посреди диспута в городе [target_location.GetName] довод, который приводит [target_leader.GetName], вдруг оказывается гениальной находкой, и собравшиеся учёные умолкают, а затем одобрительно кивают."
 grand_tour_events.39.title:0 "Миг озарения"
 grand_tour_events.4.experience:0 "Обойдём древние руины и обмерим памятники."
 grand_tour_events.4.historical_info:0 "15 октября 1764 года английский джентльмен Эдвард Гиббон, завершавший тогда собственный Гран-тур по Италии, сидел в раздумьях среди руин на Капитолийском холме, пока босоногие монахи пели вечерню в здании, которое он принял за древний храм Юпитера. Позднее он писал в мемуарах, что именно там, среди обломков колонн и затихающего вечернего пения, «мне впервые пришла мысль написать об упадке и разрушении города». Замысел, рождённый одним римским вечером, за следующие двадцать лет занятий в Англии вырос в #italic «Историю упадка и разрушения Римской империи»#!."
 grand_tour_events.4.knowledge:0 "Обратимся к рукописям Ватиканской библиотеки и к тамошним гуманистам."
 grand_tour_events.4.party:0 "Сменим руины на ночь в винных погребках, которыми славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.40.a:0 "Пойдём в атаку, рискуя неудачно упасть."
 grand_tour_events.40.b:0 "Навяжем схватку — к чёрту увечья."
 grand_tour_events.40.c:0 "Покажем себя достойно, и на этом всё."
 grand_tour_events.40.desc:0 "Во время поединка в фехтовальной школе в городе [target_location.GetName] [target_leader.GetName] находит брешь в защите, которой не учил ни один наставник, и на миг весь зал замирает, глядя, что [target_leader.GetSheHe] с ней сделает."
 grand_tour_events.40.injury_tt:0 "[target_leader.GetName] неудачно падает и надолго укладывается в постель, залечивая синяки и уязвлённую гордость"
 grand_tour_events.40.title:0 "Демонстрация мастерства"
 grand_tour_events.41.a:0 "Пошлём за лекарем."
 grand_tour_events.41.b:0 "Пошлём за лучшим лекарем, какого только можно найти."
 grand_tour_events.41.c:0 "Пусть болезнь идёт своим чередом."
 grand_tour_events.41.desc:0 "[target_leader.GetName] мучается тяжёлым расстройством желудка, вызванным, как подозревают лекари, местной водой: ничего опасного для жизни, уверяют они свиту, но достаточно неприятно, чтобы на несколько дней уложить [target_leader.GetHerHim] в постель, а их услуги стоят недёшево."
 grand_tour_events.41.title:0 "Приступ болезни"
 grand_tour_events.42.a:0 "Напишем домой письмо со скромным подарком, чтобы порадовать [target_parent.GetHerHim]."
 grand_tour_events.42.b:0 "Закажем портрет и отправим его в подарок, чтобы порадовать [target_parent.GetHerHim]."
 grand_tour_events.42.c:0 "Прервём путешествие и вернёмся домой, чтобы снова увидеть [target_parent.GetHerHim]."
 grand_tour_events.42.desc:0 "Новизна пребывания приелась, и [target_leader.GetName] ловит себя на том, что [target_leader.GetHerHis] мысли уносятся домой, и прежде всего туда, где ждёт [target_parent.GetName]. Сосредоточенности [target_leader.GetHerHis] это ничуть не способствует."
 grand_tour_events.42.title:0 "Тоска по дому"
 grand_tour_events.43.a:0 "Преподнесём небольшой подарок в знак извинения, рискуя, что он не возымеет действия."
 grand_tour_events.43.b:0 "Принесём извинения с размахом."
 grand_tour_events.43.c:0 "Оставим всё как есть."
 grand_tour_events.43.desc:0 "Лишь задним числом выясняется, что на вчерашнем приёме вышла неловкость: местного магистрата поприветствовали не в свой черёд, и виной тому — [target_leader.GetName]. Нарушение старшинства заметили все в зале, кроме свиты. Хозяин вечера вряд ли забудет об этом без какого-либо жеста раскаяния, хотя неуклюжий жест легко может сделать только хуже."
 grand_tour_events.43.title:0 "Дорогостоящая оплошность"
 grand_tour_events.44.a:0 "Утром донесём на стражников магистрату."
 grand_tour_events.44.b:0 "Сразимся со стражниками прямо в переулке."
 grand_tour_events.44.c:0 "Бросимся на улицу с криками о помощи."
 grand_tour_events.44.d:0 "Отдадим кошелёк и уйдём."
 grand_tour_events.44.desc:0 "Возвращаясь затемно, [target_leader.GetName] попадает в засаду в переулке: нападают люди в ливреях городской стражи, которых кошелёк чужестранца интересует куда больше, чем закон, который они поклялись блюсти."
 grand_tour_events.44.title:0 "Продажная стража"
 grand_tour_events.46.desc:0 "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis|U] кошелёк, как признаётся [gt_friend.GetSheHe], опустошила полоса неудач за карточным столом, и [gt_friend.GetSheHe], явно смущаясь, спрашивает, не можем ли мы хоть чем-то помочь, пока долг не обернулся скандалом."
 grand_tour_events.5.connections:0 "Проведём последние недели при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.5.experience:0 "Присоединимся к землекопам, откапывающим погребённый Геркуланум."
 grand_tour_events.5.historical_info:0 "В январе 1786 года Эстер Пиоцци поднялась на Везувий, привязанная верёвкой к своему проводнику Бартоломео — «Циклопу Везувия», — и остановилась передохнуть у кельи отшельника на полпути к вершине. Отшельник, француз, вдруг узнал её: «Мадам, не видел ли я вас прежде? Ну конечно, видел — и даже причёсывал, когда был цирюльником в Лондоне». Устыдившись, когда узнала, что четырёхлетний мальчик из её спутников уже добрался до края кратера, Пиоцци продолжила путь, чтобы своими глазами увидеть дымящееся жерло, и описала всю эту встречу в опубликованных путевых письмах."
 grand_tour_events.5.knowledge:0 "Проведём последние недели среди библиотек и руин."
 grand_tour_events.5.party:0 "Сменим уроки на последнюю ночь в тавернах, которыми славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.5.title:0 "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.6.connections:0 "Нанесём визиты — нас примут [court_host.GetNameWithNoTooltip] и знатнейшие семейства, которыми славится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.6.experience:0 "Осмотрим каменоломни, где добывают [ShowGoodsNameWithNoTooltip('marble')], и речную торговлю на Адидже."
 grand_tour_events.6.historical_info:0 "Прибыв в Верону в апреле 1785 года, Эстер Пиоцци почувствовала, как её сердце «ощутимо расширилось» при виде столь хорошо сохранившегося римского амфитеатра, а позже назвала этот город «самым весёлым на вид из всех, где мне доводилось жить». Гид, показывавший ей древности Филармонической академии, уверял, что английские Арунделовы мраморы давно погублены угольным дымом, — пока она не узнала в его словах дословную цитату из путеводителя #italic Verona illustrata#!, который он выучил наизусть. В опубликованном рассказе о путешествии она назвала этот обман «malafede и весьма нелепым предрассудком»."
 grand_tour_events.6.knowledge:0 "Изучим римские руины и древнее инженерное искусство арены."
 grand_tour_events.6.party:0 "Променяем амфитеатр на ночь в тавернах у его подножия."
 grand_tour_events.7.connections:0 "Посетим представление при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.7.experience:0 "Осмотрим герцогский арсенал и шлюзы на каналах, которыми гордится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.7.historical_info:0 "В апреле 1817 года лорд Байрон, путешествуя по Италии, посетил госпиталь Святой Анны в Ферраре, где ему показали тесную келью, в которой, по преданию, герцог Альфонсо II д’Эсте в 1580-х годах держал взаперти поэта Торквато Тассо, сочтя его безумным. Эта реликвия тронула Байрона сильнее, чем стоявший неподалёку памятник Ариосто, и на следующий день он сочинил «Жалобу Тассо» — драматический монолог, в котором звучит отчаяние поэта. Этот визит стал одним из самых знаменитых паломничеств Гран-тура эпохи романтизма и навсегда запечатлел в воображении путешественников павший двор Эсте в Ферраре."
 grand_tour_events.7.knowledge:0 "Почитаем рыцарские романы из герцогской библиотеки."
 grand_tour_events.7.party:0 "Отложим герцогские стихи ради вечера повеселее."
 grand_tour_events.8.experience:0 "Осмотрим шелкопрядильни, благодаря которым своими нитями славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.8.historical_info:0 "В 1739 году Шарль де Бросс, французский магистрат, путешествовавший по Италии, провёл вечер в Болонье в доме Лауры Басси — к тому времени первой в Европе женщины, получившей университетскую кафедру, — где местные учёные собирались обсуждать новую науку об электричестве. Позднее де Бросс вспоминал, как ему пришлось стряхнуть пыль со своей подзабытой школьной латыни, чтобы спорить о магнетизме и «необычайном притяжении наэлектризованных тел» перед всем собранием. Он описал этот вечер в своих #italic «Дружеских письмах из Италии»#!, а салон Басси стал одной из самых посещаемых остановок для путешественников Гран-тура, проезжавших через город."
 grand_tour_events.8.knowledge:0 "Посетим лекцию по гражданскому праву в университете."
 grand_tour_events.8.party:0 "Променяем лекционный зал на вино в компании студентов."
 grand_tour_events.9.connections:0 "Посмотрим скачки с лоджии, которую нам предоставит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.9.experience:0 "Изучим фрески и знаменитые банковские книги, которыми славится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.9.historical_info:0 "Осенью 1764 года романист Тобиас Смоллетт прервал путь из Флоренции в Рим ночёвкой в Сиене и ворчал в опубликованном #italic «Путешествии по Франции и Италии»#!, что его «кое-как поселили в доме, вонявшем, как отхожее место», и «прескверно накормили за ужином». Он признавал, что город «велик и хорошо выстроен», и отмечал, что сиенцы «гордятся своей учтивостью и чистотой своего наречия» — настолько, что иностранцы селились здесь лишь затем, чтобы выучиться правильному итальянскому произношению. Рассказ Смоллетта стал одной из самых известных английских жалоб на гостеприимство Тосканы времён Гран-тура."
 grand_tour_events.9.knowledge:0 "Посетим лекцию по каноническому праву в университете."
 grand_tour_events.9.party:0 "Сменим фрески на игорные столы на площади Кампо."
 grand_tour_events.attend_university_lectures:0 "Посетим лекции в университете."
 grand_tour_events.opportunity_commit:0 "Посвятим себя этому целиком, пусть даже в ущерб прочим занятиям."
 grand_tour_events.opportunity_decline:0 "Вежливо откажемся и продолжим путь."
 grand_tour_events.prodigy_connections:0 "Пусть [target_leader.GetNameWithNoTooltip] блеснёт как юное дарование в искусстве заводить связи."
 grand_tour_events.prodigy_experience:0 "Пусть [target_leader.GetNameWithNoTooltip] блеснёт как юное дарование, умудрённое опытом не по годам."
 grand_tour_events.prodigy_knowledge:0 "Пусть [target_leader.GetNameWithNoTooltip] блеснёт как юное дарование на поприще учёности."
 grand_tour_events.reflect_and_continue:0 "Обдумаем усвоенное и продолжим путь."
 grand_tour_events.seek_audience:0 "Попросим аудиенции — пусть нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.seek_castle_audience:0 "Попросим аудиенции в замке — пусть нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.worth_the_delay:0 "и стоило ли это задержки в путешествии."
 grand_tour_expedition_heir_completed_tt:0 "Наследник ещё не совершал Гран-тур"
 grand_tour_expedition_stalled_status:0 "Пребывание в городе"
 great_pestilence_disease_exhausted:0 "Мор отступает"
 great_pestilence_disease_exhausted_desc:0 "Модификаторы, оставленные мором, снимаются со всех земель, которых он коснулся, а уцелевшие после него ещё сильнее склоняются к ценности «[ShowSocietyDirectionName('spiritualist')]»."
 grenoble.catalan_dialect:0 "Гренобле"
 guelphs_and_ghibellines_factional_deadlock:0 "Тупик в борьбе фракций"
 guelphs_and_ghibellines_factional_deadlock_desc:0 "Обе фракции немного теряют в [Concept('prestige', 'престиже')|e] и [Concept('government_power', 'власти правительства')|e], а если [GetUniqueInternationalOrganization('hre').GetName] ещё существует, итальянские участники фракции гвельфов покидают её."
 guelphs_and_ghibellines_ghibelline_triumph:0 "[GetUniqueInternationalOrganization('ghibellines_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_ghibelline_triumph_desc:0 "[GetUniqueInternationalOrganization('hre').GetName] вбирает в себя все подходящие итальянские державы вместе с их районами."
 guelphs_and_ghibellines_guelph_triumph:0 "[GetUniqueInternationalOrganization('guelphs_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_guelph_triumph_desc:0 "[GetUniqueInternationalOrganization('hre').GetName]: [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|E] и все итальянские участники покидают империю вместе со своими районами."
 hafsid_caliphate_decision.desc.entry:0 "Нам не удалось утвердиться в качестве преемников [GetCountry('ALM').GetAdjective]ского халифата. С этим нельзя мириться! [ShowReligionAdjective('sunni')]ая община должна вновь признать нас своими главами!"
 hajj_caravan_events.13.c:0 "Пусть [toll_owner.GetGovernment.GetRulerTitle] взглянет на наш караван и пересмотрит пошлину."
 hajj_caravan_events.17.desc:0 "Небо чернеет, и море вздымается серыми водяными холмами. Корабль швыряет, снасти визжат, и одна неверно встреченная волна может проломить корпус или утянуть судно на дно со всеми, кто на борту."
 hajj_caravan_events.20.b.chance_tt:0 "Наш вооружённый конвой может не отбиться от корсаров, и тогда вместо [Concept('prestige', 'престижа')|e] мы потеряем часть конвоя и роскоши"
 hajj_caravan_events.20.title:0 "Корсары"
 hajj_caravan_events.22.desc:0 "Нас окликает торговое судно, его палубы заставлены рулонами шёлка и тонких тканей из далёких портов. Капитан готов торговать по купеческой цене — но лишь после неспешного купеческого торга."
 has_unlocked_bureaucracy_via_flavor_byz_31_tt:0 "Мы разблокировали этот [Concept('bureaucracy', 'бюрократический механизм')|e] благодаря [Concept('decision', 'решению')|e] «[ShowDecisionName('byz_army_reform_decision')]»"
 has_unlocks_formalize_relations_action:0 "Открыто [Concept('diplomatic_action', 'дипломатическое действие')|e] «[ShowCountryInteractionName('formalize_relations')]» благодаря [Concept('decision', 'решению')|e] «$fra_formalized_relations_decision.title$»."
 heavy_ship_1_repair:0 "Ремонт тяжёлого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_1_traditions')]"
 heavy_ship_2_repair:0 "Ремонт тяжёлого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_2_renaissance')]"
 heavy_ship_3_repair:0 "Ремонт тяжёлого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_3_discovery')]"
 heavy_ship_4_repair:0 "Ремонт тяжёлого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_4_reformation')]"
 heavy_ship_5_repair:0 "Ремонт тяжёлого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_5_absolutism')]"
 heavy_ship_6_repair:0 "Ремонт тяжёлого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_6_revolutions')]"
 holy_war.10.a:0 "Мы соглашаемся и присоединяемся к джихаду."
 holy_war.10.b:0 "Мы отклоняем предложение."
 holy_war.10.desc:0 "Держава [recognition_offerer.GetName], возглавляющая «[recognition_io.GetName]», предлагает признать наше положение среди верующих — даровать нам религиозный авторитет и легитимность, — если мы присоединимся к священной войне против неверных. Примем ли мы предложение?"
 holy_war.10.title:0 "Предложение признания"
 holy_war.17.a:0 "Объявить его исцеление чудом и воодушевить воинство!"
 holy_war.17.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.17.b:0 "Замять дело, пока лагерь не охватил страх."
 holy_war.17.desc:0 "Простой солдат, которого лагерные лекари уже сочли покойником, поднялся с одра болезни целым и невредимым, и многие уже называют это делом Небес. Но в горячечном бреду ему являлись странные и тревожные сны — видения, которые, как он клянётся, предрекли грядущее, — и воины с беспокойством перешёптываются о них. Как нам поступить?"
 holy_war.17.title:0 "Чудесное исцеление"
 holy_war.18.a:0 "Устроить для воинства великую проповедь и пир."
 holy_war.18.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.18.b:0 "Пусть верующие сами разожгут в себе огонь."
 holy_war.18.b.tt:0 "Снижает религиозное рвение священной войны на #R 5#! и отбрасывает её подготовку на #R 5#!"
 holy_war.18.desc:0 "Долгое ожидание жестоко изматывает воинство. Молитвы, звучавшие некогда с жаром, теперь бормочут по привычке, из-за малейших пустяков вспыхивают ссоры, а у ночных костров вновь тлеют старые распри. Пыл, что когда-то привёл верующих под знамёна, остыл до серого пепла, и если вскоре ничто не разожжёт их дух вновь, всё предприятие может зачахнуть прежде, чем будет нанесён хоть один удар. Что же делать?"
 holy_war.18.title:0 "Пыл в лагере угасает"
 holy_war.19.a:0 "Дать ему полную волю собирать верующих."
 holy_war.19.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.19.b:0 "Обуздать его, пока он не посеял смуту."
 holy_war.19.desc:0 "На краю лагеря появился проповедник с безумным взором: одежды его истрепались в дороге, а голос охрип от многодневных неустанных призывов. Его пламенные речи собирают всё растущую толпу бедняков и благочестивцев, батраков и безземельных, и все они требуют выступить за веру сей же час. Рвение его не знает удержу, сам он совершенно неуправляем, и ни один из наших сеньоров не имеет над ним никакой власти. Как нам быть с этим смутьяном?"
 holy_war.19.title:0 "Пламенный проповедник"
 holy_war.2.d.tt:0 "Все участники объединения «[levy_io.GetName]» получают мнение #R [ROOT.GetCountry.GetBiasConfig('opinion_shirked_holy_war').GetNameWithTooltip]#! о нас"
 holy_war.20.a:0 "Мы должны принять их приговор."
 holy_war.20.desc:0 "Срок, отпущенный нам на исполнение обетов, истёк, а мы ничего не сделали, чтобы их сдержать. Предводители священной войны не забыли ни наших обещаний, ни того, что мы их не выполнили, и обещанный ими упрёк теперь обрушивается на нас."
 holy_war.20.title:0 "Верующие недовольны"
 holy_war.21.a:0 "Пусть наши люди возьмут то, что заслужили."
 holy_war.21.a.tt:0 "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.21.b:0 "Сдержать их ради общего дела."
 holy_war.21.b.tt:0 "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.21.desc:0 "Едва город пал, как наши солдаты и воины союзного войска сцепились из-за дележа добычи. В тесных улочках обнажены ножи, палатки опрокинуты, и старые обиды между двумя лагерями выплёскиваются в открытую драку. Если ссору не уладить быстро, она может отравить весь поход и обратить брата против брата, пока враг ещё стоит. Как нам её разрешить?"
 holy_war.21.title:0 "Ссора из-за добычи"
 holy_war.22.a:0 "Продолжать поход, чего бы это ни стоило."
 holy_war.22.b:0 "Дать войску отдых, пока болезнь не отступит."
 holy_war.22.b.tt:0 "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.22.desc:0 "Изнурительная лихорадка расползлась по тесным осадным линиям, и каждое серое утро из палаток выносят всё больше людей в беспамятстве. Лагерные лекари пускают им кровь, дают слабительное и молятся над ними, но ничто не останавливает болезнь, и смрад умирающих тяжело висит над всем лагерем. С каждым днём войско теряет силы, которых ему так недостаёт вдали от дома, перед всё ещё несокрушёнными стенами. Как нам встретить эту напасть?"
 holy_war.22.title:0 "Болезнь в войске"
 holy_war.23.a:0 "Провозгласить его мучеником за веру!"
 holy_war.23.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 10#!"
 holy_war.23.b:0 "Почтить его память со сдержанным достоинством."
 holy_war.23.b.tt:0 "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.23.desc:0 "Осада продолжается: [sieged_location.GetName] всё ещё держится, а у осаждённых стен в самой гуще боя пал [fallen_champion.GetName] — сражённый на валу после подвигов, о которых будут слагать песни ещё целое поколение. Войско оплакивает героя, любимого и простым солдатом, и гордым сеньором, но даже в скорби кровь воинов вскипает, и многие теперь молят о чести отомстить врагу за павшего. Как нам почтить эту смерть?"
 holy_war.23.title:0 "Гибель героя"
 holy_war.24.a:0 "Изгнать лжеверующих из войска."
 holy_war.24.a.tt:0 "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.24.b:0 "Закрыть на это глаза. Нам нужен каждый меч."
 holy_war.24.b.tt:0 "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.24.desc:0 "По лагерю ползут недобрые слухи, будто среди верующих затесались еретики и лжеверующие: их молитвы — пустое глумление, а их верность под большим сомнением. Самые набожные в войске требуют вырвать их с корнем, пока они не отравили всю армию, а более трезвые головы напоминают, что меч в руке остаётся мечом, какая бы вера ни таилась в сердце. Как нам ответить на это обвинение?"
 holy_war.24.title:0 "Лжеверующие в рядах"
 holy_war.25.a:0 "Пустить эти деньги на нашу собственную войну."
 holy_war.25.b:0 "Передать их в военную казну священной войны."
 holy_war.25.b.tt:0 "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.25.c:0 "Раздать их верующим как милостыню."
 holy_war.25.c.tt:0 "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.25.desc:0 "Богатый магнат нашего государства, недавно отошедший в вечность, завещал священной войне огромную сумму. Душеприказчики передали это богатство на наше попечение — запечатанные сундуки с монетой, которую мы можем потратить на общее дело по своему усмотрению, — и вот уже духовенство, военачальники и бедняки наперебой притязают на неё. Куда направить это состояние?"
 holy_war.25.title:0 "Благочестивое завещание"
 holy_war.27.a:0 "Алчность побеждает там, где меч бессилен."
 holy_war.27.a.tt:0 "Держава [desertion_member.GetName] приняла взятку и покинула «[desertion_io.GetName]»"
 holy_war.27.desc:0 "Наше серебро тихо сделало своё дело. Держава [desertion_member.GetName] приняла взятку и отступилась от общего дела: свернула знамёна и украдкой побрела домой, прикрываясь отговорками, в которые никто по-настоящему не верит. С её уходом наши враги ослабли. Золото вновь купило нам то, чего не смогли добыть ни сталь, ни проповедь, и один докучливый противник тихо убран с доски. Пожалуй, это урок об истинной цене верности."
 holy_war.27.title:0 "Подкуп удался"
 holy_war.28.a.tt:0 "Они отказались от взятки"
 holy_war.28.desc:0 "Держава [desertion_member.GetName] наотрез отвергла наше тайное предложение и изгнала нашего посланника со своего двора, поклявшись продолжать войну, не страшась и не прельщаясь нашей монетой. Хуже того, слух о нашей попытке ещё может разойтись, и если он дойдёт до людских ушей, наше имя будет запятнано как имя подкупщика и обманщика. Из всей этой затеи мы вынесли лишь риск."
 holy_war.28.title:0 "Наше серебро отвергнуто"
 holy_war.29.a:0 "Принять легата под наши знамёна."
 holy_war.29.a.tt:0 "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.29.b:0 "Отправить его обратно в Рим с благодарностью."
 holy_war.29.desc:0 "Его Святейшество направил к нам своего легата — [papal_legate.GetName], воинственного прелата, сведущего в ратном деле не меньше, чем в духовном, — чтобы тот ехал во главе нашего воинства и даровал «[holy_war.GetName]» полное благословение Рима. Такой человек мог бы закалить наши армии и ещё теснее связать нас со Святым Престолом, хотя подчиняется он прежде всего папе и лишь затем — нам. Примем ли мы его на службу?"
 holy_war.29.title:0 "Папский легат"
 holy_war.3.a.tt:0 "Мы ничего не предпринимаем против насильственных обращений"
 holy_war.30.a:0 "Пусть их выручка пополнит военную казну."
 holy_war.30.a.tt:0 "Снижает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 3#!"
 holy_war.30.b:0 "Тихо направить монету в нашу собственную казну."
 holy_war.30.b.tt:0 "Снижает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 5#!"
 holy_war.30.c:0 "Изгнать торгашей из лагеря."
 holy_war.30.c.tt:0 "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.30.desc:0 "На лагерь, словно стервятники на свежую падаль, слетелась ватага продавцов индульгенций: они сбывают отпущения грехов и святые безделушки любому солдату, готовому расстаться с монетой. Их выручка растёт так же быстро, как ропот благочестивых, называющих всю эту торговлю позором для священного дела. И всё же монета есть монета, а одними молитвами ещё ни одна священная война не была выиграна. Как с ними поступить?"
 holy_war.30.title:0 "Продавцы индульгенций в лагере"
 holy_war.31.desc:0 "К нам на хранение попали мощи почитаемого святого: их доставили ко двору благодарные монахи, оберегавшие святыню на протяжении многих опасных лиг пути. Такие реликвии — сокровище, которому нет цены в золоте, ведь там, где они наконец обретут покой, тысячами соберутся верующие, чтобы молиться и дивиться им. Где же хранить эти святые останки?"
 holy_war.31.title:0 "Мощи святого"
 holy_war.39.a:0 "Благодарение Богу!"
 holy_war.4.a:0 "Клянёмся удвоить усилия."
 holy_war.4.a.tt:0 "Предводитель священной войны даёт нам #G 2 года#!, чтобы проявить себя. Если к тому времени наше участие в священной войне возрастёт, верующие будут довольны; если нет — их упрёк всё равно падёт на нас."
 holy_war.4.b:0 "Мы никому не обязаны отчётом."
 holy_war.4.desc:0 "Предводитель священной войны обвиняет нас в уклонении от священного долга и грозит тяжкими последствиями, если мы не докажем свою преданность. Что мы ответим?"
 holy_war.4.title:0 "Упрёк верующих"
 holy_war.6.a:0 "#italic Так хочет Бог#!."
 holy_war.6.a.muslim:0 "#italic Аллаху акбар#!."
 holy_war.6.desc:0 "Весть о нашем вновь пробудившемся рвении к священной войне разнеслась далеко, и предводители верующих теперь произносят наше имя с теплотой. Где прежде было сомнение, ныне благосклонность."
 holy_war.6.title:0 "Верующие довольны"
 holy_war.7.a:0 "Верующие собираются."
 holy_war.7.desc:0 "Держава [preach_target.GetName] вняла нашим проповедям и вступила в священную войну, отдав делу веры меч и казну. Ещё один клинок обнажён за веру, и воинство растёт."
 holy_war.7.title:0 "Наш призыв услышан"
 holy_war.8.a.tt:0 "Они пренебрегли нашим предложением"
 holy_war.8.desc:0 "Держава [preach_target.GetName] осталась глуха к нашим проповедям: холодные слова, запертые ворота — и никакого участия в священной войне. Верующие запомнят это оскорбление."
 holy_war.8.title:0 "Наш призыв отвергнут"
 holy_war.9.a:0 "Мы принимаем эту честь и присоединяемся к крестовому походу."
 holy_war.9.a.no_seat_tt:0 "В каждом поселении нашего государства уже есть кардинальская кафедра, поэтому вместо этого нам оказывают честь, повышая наш престиж"
 holy_war.9.b:0 "Мы отклоняем предложение."
 holy_war.9.desc:0 "Держава [cardinal_offerer.GetName], возглавляющая «[cardinal_io.GetName]», предлагает возвести одного из наших прелатов в кардинальское достоинство, если мы примем крест, и учредить эту кафедру в пределах нашего собственного государства. Такое покровительство крепко связало бы нас со священным делом. Примем ли мы предложение?"
 holy_war.9.title:0 "Предложение кардинальской кафедры"
 hre.700.a:0 "Последуем духу времени и проведём реформы."
 hre.700.b:0 "Мы отказываемся менять наше правление!"
 hre.910.a.tt:0 "[ShowReligionGroupAdjective('christian')]ие участники объединения «[GetUniqueInternationalOrganization('hre').GetName]» получают [ShowBiasValue('antagonism_hre_member_under_infidel_domination')|+=0] к [Concept('antagonism', 'неприязни')|e] по отношению к державе [foreign_overlord.GetName]"
 humiliated_grand_embassy:0 "Великое посольство унижено"
 hussite_wars_bohemia_reconverted:0 "[GetCountry('BOH').GetNameWithNoTooltip] и [GetCountry('PAP').GetNameWithNoTooltip] вновь едины"
 hussite_wars_bohemia_reconverted_desc:0 "Держава [GetCountry('BOH').GetName] силой возвращена в лоно католической церкви: её [Concept('stability', 'стабильность')|e] и [Concept('government_power', 'власть правительства')|e] жестоко пострадают, а правителя и его семью заставят сменить веру."
 hussite_wars_bohemia_subdued:0 "[GetCountry('BOH').GetNameWithNoTooltip] покоряется"
 hussite_wars_emperor_converted:0 "[GetUniqueInternationalOrganization('hre').GetLeaderTitle] принимает гуситство"
 hussite_wars_emperor_converted_desc:0 "Раз на сторону гуситов перешёл сам император, гуситские земли надолго получают прибавку к [Concept('stability', 'стабильности')|e], [Concept('government_power', 'власти правительства')|e] и [Concept('religious_influence', 'религиозному влиянию')|e]."
 hussite_wars_empire_dissolved:0 "[GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] распадается"
 hussite_wars_hussite_bohemia_endures:0 "[GetCountry('BOH').GetNameWithNoTooltip] хранит гуситскую веру"
 hussite_wars_hussite_bohemia_endures_desc:0 "[GetCountry('BOH').GetName] выдерживает испытание верой: эта держава и её единоверцы-гуситы надолго получают прибавку к [Concept('stability', 'стабильности')|e], [Concept('government_power', 'власти правительства')|e] и [Concept('religious_influence', 'религиозному влиянию')|e]."
 hyw_france_recently_received_demand_tt:0 "Последние #Y 6#! мес. ни один [Concept('subject', 'ленник')|e] не предъявлял требований державе [GetCountry('FRA').GetName]"
 iberian_culture.1.a:0 "Пусть они звучат на поле боя!"
 iberian_culture.1.b:0 "Пусть они зовут людей под наши знамёна!"
 iberian_culture.1.desc:0 "Наши схватки с неверными вдохновили и менестрелей, и простой люд слагать песни во славу отваги наших воинов, сражающихся за торжество [ShowReligionGroupAdjective('christian')|U]ого дела. Эти напевы звучат всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и могут сослужить нам добрую службу — воодушевлять солдат в бою и, быть может, привлекать в наши ряды новых людей."
 iberian_culture.10.a:0 "Мастерство важнее вероисповедания."
 iberian_culture.10.b:0 "Лучше назначить [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]ого лекаря."
 iberian_culture.10.desc:0 "В последнее время лекари-мудехары завоёвывают широкую славу всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всё больше полагаются на их искусство. Некоторые советники предлагают официально назначить их придворными лекарями — пусть их услугами пользуется [ROOT.GetCountry.GetGovernment.GetCourtTitle]; однако влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] решительно против."
 iberian_culture.11.a:0 "Наши церковные суды должны расследовать эту ересь."
 iberian_culture.11.b:0 "Это клевета!"
 iberian_culture.11.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] обсуждает тревожное известие: [target_character.GetName], искусный купец, чья семья когда-то исповедовала [ShowReligionName('judaism')], но затем приняла крещение, обвиняется в том, что втайне по-прежнему соблюдает обряды прежней веры. В донесении говорится о запретных молитвах и тайных сборищах, однако есть и те, кто уверен: эти обвинения порождены завистью и спорами о долгах."
 iberian_culture.11.title:0 "Конверсо под подозрением"
 iberian_culture.12.a:0 "Конфисковать их богатства."
 iberian_culture.12.b:0 "Мы не можем действовать без доказательств."
 iberian_culture.12.desc:0 "Нескольких видных [ShowCultureName('sephardi')]их купцов из района [target_location.GetName] обвиняют в том, что они сколотили состояние нечестными путями: пользовались лазейками в налогах, давали деньги в рост под грабительский процент и вздували цены себе на пользу. Обвинения исходят от их торговых соперников, и мы не можем знать наверняка, правдивы ли они, но действовать нужно прежде, чем раздор разгорится ещё сильнее."
 iberian_culture.12.title:0 "[ShowCultureNameWithNoTooltip('sephardi')]их купцов обвиняют"
 iberian_culture.13.a:0 "Обеспечить их гашёной известью."
 iberian_culture.13.desc:0 "В южных краях, которыми владеет [ROOT.GetCountry.GetFlavorRank], издавна принято белить дома гашёной известью, чтобы под палящим солнцем в них сохранялась прохлада. Считается также, что побелка помогает уберечься от болезней. Недавно жителям района [target_location.GetName] стало не хватать гашёной извести, и теперь они просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] помогли им защитить свои дома."
 iberian_culture.13.title:0 "Против зноя и мора"
 iberian_culture.14.a:0 "Подтвердить древнее право пастухов на проход."
 iberian_culture.14.desc:0 "С каждой сменой времён года миллионы овец гонят по Каньядас-Реалес — старинным королевским скотопрогонным трактам, что пересекают наши земли. Однако жители района [target_location.GetName] отказываются пропускать пастухов через своё поселение, опасаясь, что стада вытопчут их поля."
 iberian_culture.14.title:0 "Спор о Каньядас-Реалес"
 iberian_culture.15.a:0 "Предпочтение получит район [target_location_1.GetNameWithNoTooltip]."
 iberian_culture.15.b:0 "Поля в районе [target_location_2.GetNameWithNoTooltip] важнее."
 iberian_culture.15.c:0 "Воду разделят поровну."
 iberian_culture.15.desc:0 "В последнее время старинный Водный трибунал разбирает спор между районами [target_location_1.GetName] и [target_location_2.GetName]. Под палящим летним солнцем воды в округе не хватает, чтобы вдоволь напоить поля обоих поселений, и их жители спорят о праве на её распределение."
 iberian_culture.15.title:0 "Раздор в Водном трибунале"
 iberian_culture.16.a:0 "Уважать хартии."
 iberian_culture.16.b:0 "Нужды государства превыше всего!"
 iberian_culture.16.desc:0 "Нашего сборщика налогов, посланного в район [target_location.GetName], местные магистраты попросту не пустили в город. Здешняя знать ссылается на свои древние #italic фуэрос#! — привилегии, по которым она полностью освобождена от налогов, что взимают [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], если только их не одобрило её собственное собрание."
 iberian_culture.16.title:0 "Защита фуэрос"
 iberian_culture.17.a:0 "У нас нет лишних людей."
 iberian_culture.17.b:0 "Снарядить отряд и очистить от них горы."
 iberian_culture.17.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает тревожные вести: хорошо вооружённые разбойники захватили труднопроходимые горные перевалы вокруг района [target_location.GetName]. Они грабят караваны и обозы, и торговля во всём крае задыхается. Если ничего не предпринять, к разбойникам могут примкнуть и другие."
 iberian_culture.17.title:0 "Разбойники Сьерры"
 iberian_culture.18.a:0 "Одобрить их труд."
 iberian_culture.18.b:0 "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]ому искусству не место рядом с престолом."
 iberian_culture.18.desc:0 "Веками жители региона [ShowRegionName('iberia_region')] восхищались [ShowReligionGroupAdjective('muslim')]им зодчеством, расцветшим во времена аль-Андалуса. Многие архитекторы стали вплетать приёмы искусства мудехаров в романские и готические постройки — будь то геометрический орнамент или узорная резьба по штукатурке. Ныне [target_artist.GetName] — мастер, которому покровительствуют [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], — просит у престола дозволения использовать этот стиль в королевских заказах."
 iberian_culture.19.a:0 "Пусть камень возвестит нашу славу!"
 iberian_culture.19.desc:0 "Строители из всех земель, что объединяет [ROOT.GetCountry.GetFlavorRank], создают архитектурный стиль, не похожий ни на один другой во всём христианском мире. Вдохновлённые устремлёнными ввысь соборами западных народов и прочными строительными традициями наших земель, они возводят памятники, возвещающие и славу Господа, и величие, которым блистает [ROOT.GetCountry.GetName]. Этот стиль, получивший название испанской готики, может на века оставить свой след в облике наших земель — если мы решим ему покровительствовать."
 iberian_culture.2.a:0 "[new_general.GetSheHe|U] возглавит наши армии."
 iberian_culture.2.b:0 "Мы найдём [new_general.GetHerHis] талантам иное применение."
 iberian_culture.2.desc:0 "Среди множества храбрецов, сражающихся в войне, где нашим противником выступает [GetCountry('GRA').GetName], особо выделяется [new_general.GetName]: отвагой и воинским искусством [new_general.GetHerselfHimself] [Select_CString(new_general.IsFemale, 'стяжала', 'стяжал')] себе славу. [new_general.GetHerHis|U] имя гремит всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], слава бежит впереди [new_general.GetHerHim], и многие считают, что такой талант заслуживает командования, достойного [new_general.GetHerHis] заслуг."
 iberian_culture.2.title:0 "Герой Реконкисты"
 iberian_culture.20.a:0 "Принять новую традицию."
 iberian_culture.20.b:0 "Хранить старые традиции."
 iberian_culture.20.desc:0 "Из региона [ShowRegionName('italy_region')] к нам приходят новые художественные идеи, которые называют общим именем — [ShowInstitutionNameWithNoTooltip('renaissance')]. Их уже впитывает [ROOT.GetCountry.GetFlavorRank]: многие наши зодчие и живописцы сплетают эти веяния с родными традициями. Всё больше заказчиков желают видеть работы в новом, едва зарождающемся стиле, и, если поощрить это художественное течение, оно, быть может, откроет эпоху процветания и новшеств."
 iberian_culture.20.title:0 "Испанский проторенессанс"
 iberian_culture.21.a:0 "Принять их в лоно веры."
 iberian_culture.21.b:0 "Заставить обратиться и остальных."
 iberian_culture.21.desc:0 "Немалая часть [ShowReligionAdjective('judaism')]ого населения района [target_location.GetName] решила добровольно принять крещение и исповедовать [ShowReligionName('catholic')]. Многие видят в новообращённых доказательство успехов Церкви, но другие сомневаются в их искренности и зовут их «новыми христианами», отличая от тех, чьи семьи издавна исповедуют эту веру."
 iberian_culture.21.title:0 "Обращение новых христиан"
 iberian_culture.22.b:0 "Мы не станем поддерживать эту варварскую забаву!"
 iberian_culture.22.desc:0 "Считается, что старейший праздник бега быков во всём регионе [ShowRegionName('iberia_region')] проводят в поселении [ShowLocationName('cuellar')], но его жителям не хватает средств на ежегодное торжество. Они просят денег и обещают: если [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] возьмут расходы на себя, то героем праздника станет не Богоматерь Розария, их небесная покровительница, которую обычно чествуют в эти дни, а [target_ruler.GetName]."
 iberian_culture.23.a:0 "Расправиться с просветлёнными."
 iberian_culture.23.b:0 "Не за каждым слухом скрывается еретик."
 iberian_culture.23.b.tt:0 "Если ничего не предпринять, влияние секты может распространиться дальше"
 iberian_culture.23.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] и церковные иерархи получают тревожные донесения о странном мистическом братстве, которое исподволь набирает сторонников всюду, куда простирается [ROOT.GetCountry.GetFlavorRank]. Его члены называют себя «просветлёнными» и утверждают, что истинно верующий может получить божественное озарение прямо от Святого Духа, а значит, священники, таинства, паломничества и даже святая месса ему не нужны. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] опасаются, что это учение сродни протестантским ересям, и требуют начать расследование."
 iberian_culture.23.title:0 "Секта алумбрадос"
 iberian_culture.24.a:0 "Мы не можем преследовать каждого инакомыслящего."
 iberian_culture.24.b:0 "Они были правы, и нам следует действовать осмотрительно."
 iberian_culture.24.desc:0 "Наше нежелание расследовать слухи о просветлённых оказалось ошибкой. Влияние секты в провинции [target_province.GetName] сильно выросло, и её последователи открыто признали себя приверженцами [ShowReligionAdjective('lutheran')]ой ереси. Теперь [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] утверждают, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] пренебрегли предостережениями и просьбами о расследовании, а ведь решительные меры предотвратили бы эту вспышку ереси."
 iberian_culture.24.title:0 "Маски сброшены"
 iberian_culture.25.a:0 "Оплатить восстановление."
 iberian_culture.25.b:0 "Мы не можем позволить себе такие траты."
 iberian_culture.25.desc:0 "Во времена [ShowReligionGroupAdjective('muslim')]ого владычества в области [ShowAreaName('granada_area')] была создана сложная сеть каналов — [ShowBuildingTypeName('irrigation_systems')], — по которой драгоценная вода течёт со Сьерра-Невады к полям и садам плодородных долин. Бои за этот край нанесли немалый урон каналам, от которых издавна зависит пропитание местных жителей."
 iberian_culture.25.title:0 "[ShowBuildingTypeNameWithNoTooltip('irrigation_systems')] под угрозой"
 iberian_culture.26.a:0 "Не жалеть средств ради паломников."
 iberian_culture.26.b:0 "Сейчас у нас есть дела поважнее."
 iberian_culture.26.desc:0 "Каждый год тысячи паломников пускаются в долгий путь, цель которого — [ShowLocationName('santiago_compostela')]. Поток странников принёс достаток бесчисленным поселениям, но дорога по-прежнему трудна: многие пути и мосты обветшали. Жители района [target_location.GetName] просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] привели в порядок дороги к Компостеле: по их словам, это и укрепит благочестие, и оживит торговлю, которой живёт [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.26.title:0 "Путь в Сантьяго"
 iberian_culture.27.a:0 "Взять сохранение традиции под покровительство."
 iberian_culture.27.b:0 "Укреплять позиции нашего языка."
 iberian_culture.27.desc:0 "Из поколения в поколение трубадуры области [ShowAreaName('galicia_area')] пели свои традиционные #italic кантиги#! на [ShowDialectName('galician_dialect')]ом — почтенном литературном языке, влияние которого вышло далеко за пределы области [ShowAreaNameWithNoTooltip('galicia_area')]. Однако это не тот язык, на котором говорит [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetName], и традиция понемногу угасает."
 iberian_culture.28.a:0 "Укрепить их гильдию."
 iberian_culture.28.b:0 "Их опыт нужен нашему флоту."
 iberian_culture.28.desc:0 "Рыбаки района [target_location.GetName] объединились в гильдию, которую называют Рыбацким братством. Говорят, её цель — упорядочить промысел, сберечь морские знания и защищать интересы тех, кто бросает вызов волнам. Кроме того, братство стало опорой местной общины: в тяжёлые времена оно помогает своим членам и их семьям выстоять."
 iberian_culture.29.a:0 "Вложить его в местные промыслы."
 iberian_culture.29.b:0 "Этим богатствам найдёт применение [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.29.desc:0 "Ткачи, которыми славится [ShowLocationName('valencia')], прославились тонкими тканями — [ShowGoodsName('silk')] их работы восхищает знатоков, и им любуется вся [ShowContinentName('europe')]. Богатство, что приносит это цветущее ремесло, наполнило сундуки купцов, и свою долю получают также [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] никак не придёт к согласию о том, как распорядиться этим богатством."
 iberian_culture.29.title:0 "Валенсийский [ShowGoodsNameWithNoTooltip('silk')] приносит богатство"
 iberian_culture.3.a:0 "Позволить им переселиться."
 iberian_culture.3.b:0 "Постараться ограничить число поселенцев."
 iberian_culture.3.desc:0 "Теперь, когда область [ShowAreaName('granada_area')] наконец освобождена от [ShowReligionGroupAdjective('muslim')]ого владычества, многие семьи обращают взоры к этим землям в поисках лучшей доли. Недавно до нас дошли вести о переселенцах из провинции [origin_province.GetName]: их влекут обещания брошенных земель и надежда начать новую жизнь в провинции [target_province.GetName]."
 iberian_culture.3.title:0 "Заселение юга"
 iberian_culture.30.b:0 "Сберечь наши традиции виноделия."
 iberian_culture.30.desc:0 "В плодородных долинах Эбро уже много поколений процветают виноградники Риохи. Здешние вина отличаются исключительным качеством, и на это обратили внимание наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]: они видят возможность создать крупный промысел, засадив виноградниками все земли, которыми владеет [ROOT.GetCountry.GetFlavorRank]. Однако [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] возражают: это может нарушить местные обычаи, веками определявшие, как делать вино."
 iberian_culture.30.title:0 "Виноградники Риохи"
 iberian_culture.4.a:0 "Вложить деньги в местные нужды."
 iberian_culture.4.b:0 "Отдать пожертвования: пусть ими распоряжаются [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 iberian_culture.4.c:0 "Раздать милостыню бедным."
 iberian_culture.4.d:0 "Этими пожертвованиями распорядятся [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 iberian_culture.4.desc:0 "Разнеслась весть о чуде, будто бы случившемся в районе [target_location.GetName]. По словам местных жителей, на холме над поселением явилась Пресвятая Дева Мария. Кое-кто сомневается в чуде, но оно уже привлекло паломников из ближних и дальних краёв. Улицы заполнены странниками, и местные жители охотно на них наживаются. В здешнюю казну рекой текут пожертвования, и о том, как распорядиться нежданным богатством, идут жаркие споры."
 iberian_culture.4.title:0 "Чудо Девы Марии"
 iberian_culture.5.a:0 "Пусть каждое плавание учится на опыте предыдущего."
 iberian_culture.5.b:0 "Океан сулит бесконечные возможности."
 iberian_culture.5.desc:0 "[ShowCultureName('basque')]ие китобои вернулись из очередного плавания в далёкие северные моря. Бросив вызов коварным штормам и водам, неведомым большинству мореходов, они привезли домой и ценный груз, и богатый опыт. Теперь [ROOT.GetCountry.GetGovernment.GetCourtTitle] спорит о том, как распорядиться этими знаниями."
 iberian_culture.5.title:0 "Возвращение из северных морей"
 iberian_culture.6.a:0 "Талант не измеряется верой."
 iberian_culture.6.b:0 "Такие почести подобают лишь [ShowReligionGroupAdjective('christian')|U]им подданным."
 iberian_culture.6.desc:0 "Нам сообщили, что [target_character.GetName], искусный мастер [ShowReligionGroupAdjective('muslim')]ой веры, завоёвывает признание всюду, куда простирается [ROOT.GetCountry.GetFlavorRank]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить [target_character.GetHimHer] к нам на службу, однако многие [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] возражают против того, чтобы оказывать такую честь мудехару."
 iberian_culture.6.title:0 "Искусный мастер-мудехар"
 iberian_culture.7.desc:0 "В районе [target_location.GetName] вспыхнул раздор: [ShowReligionAdjective('sunni')]ие и [ShowReligionAdjective('catholic')]ие купцы обвиняют друг друга в том, что местные чиновники и гильдии благоволят соперникам. Нас просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] вмешались и рассудили этот спор."
 iberian_culture.7.title:0 "Раздор на рынке"
 iberian_culture.9.b.tt:0 "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 ibn_khaldun_hit_the_road_tt:0 "[target_character.GetNameWithNoTooltip] переезжает в державу [target_country_2.GetLongNameWithNoTooltip]"
 icon_name_0:0 "$ADJECTIVE|U$ая икона: св. $SAINT|U$"
 icon_name_1:0 "Икона: св. $SAINT|U$ ($ADJECTIVE|U$ая школа)"
 ifriqiya_reunited_decision.desc.entry:0 "Слишком долго земли региона [ShowScriptedGeographyName('ifriqiya_geography')] были разделены между множеством государств, многими из которых правили ветви династии [ShowDynastyName('hafsid_dynasty')]. Мы больше не можем мириться с такой раздробленностью."
 independence_overlord:0 "$game_concept_overlord$"
 independence_overlord_desc:0 "$independence_overlord$, от которого стремится освободиться его [Concept('subject', 'ленник')|e]."
 independence_subject:0 "Ленник, стремящийся к независимости"
 independence_subject_desc:0 "[Concept('subject', 'Ленник')|e], который стремится освободиться от своего [Concept('overlord', 'сюзерена')|e].\n\n$independence_movement_hint_1$"
 invite_foreign_cleric_tt:0 "[Concept('character', 'Персонаж')|e] из сословия «[ShowEstateTypeName('clergy_estate')]» выбранной [Concept('country', 'страны')|e] прибудет к нашему [Concept('court', 'двору')|e], что улучшит [Concept('opinion', 'мнение')|e] между нами"
 invite_religious_order_desc:0 "Предоставить один из наших [Concept('locations', 'районов')|e] ордену нашей религии в качестве нового [Concept('holding', 'владения')|E]. Новое [Concept('holding', 'владение')|e] поднимает цель [Concept('zeal', 'рвения')|e] ордена, укрепляя его позиции в наших землях."
 invite_religious_order_effect_tt:0 "Выбранный район перейдёт в собственность ордена и поднимет цель его [Concept('zeal', 'рвения')|e] в наших землях. Само владение в течение следующих месяцев укрепит присутствие ордена здесь."
 italian_wars_exhausted_peninsula:0 "Полуостров истощён"
 italian_wars_exhausted_peninsula_desc:0 "Все здания «[ShowBuildingTypeName('italian_administration_center')]» обращаются в руины, а главы иноземных лиг получают тяжёлый удар по [Concept('government_power', 'власти правительства')|e]."
 italian_wars_foreign_league_triumph:0 "Иноземная лига торжествует"
 italian_wars_foreign_league_triumph_desc:0 "Глава победившей коалиции получает [Concept('prestige', 'престиж')|e] и долговременную награду за победу, а её участники сближаются друг с другом. Все итальянские и соперничающие иноземные лиги расплачиваются за это своим положением."
 italian_wars_italian_league_triumph:0 "Итальянская лига торжествует"
 italian_wars_italian_league_triumph_desc:0 "Глава победившей лиги получает [Concept('prestige', 'престиж')|e] и [Concept('stability', 'стабильность')|e], открывает новый административный закон и может силой или договором добиться верности её участников. Все соперничающие итальянские и иноземные лиги расплачиваются за это своим положением."
 itinerant_court_policy_at_risk_tt:0 "#italic Постройка «[ShowBuildingTypeName('itinerant_court_seat')]» будет утрачена, если показатель «[ShowSocietyDirectionName('decentralization')]» опустится ниже #W 10#! #!"
 iu_marriage_may_form_union_tt:0 "Это может привести к образованию [Concept('union', 'унии')|e]"
 iu_spurned_will_be_displeased_tt:0 "[iu_spurned.GetName] может не простить пренебрежения, проявленного при выборе этой партии"
 james_lancaster_exists_tt:0 "Джеймс Ланкастер существует"
 james_lancaster_leads_expedition_tt:0 "Джеймс Ланкастер возглавляет экспедицию"
 janissaries:0 "Янычары"
 jap_adopt_japan_identity_decision.a:0 "Отныне мы — $JAP$."
 jap_adopt_japan_identity_decision.color_tt:0 "Мы выбираем цветом нашей державы #Y красный#!"
 jap_adopt_japan_identity_decision.desc:0 "Кланы истощили друг друга в бесконечной борьбе, и один дом возвысился над остальными. Однако мир по-прежнему знает нас по имени этого дома, а не по земле, которой мы теперь правим.\n\nПримем же имя $JAP$, чтобы каждый двор и каждая провинция знали: держава едина, и она принадлежит нам."
 jap_adopt_japan_identity_decision.historical_info:0 "К 1603 году Токугава Иэясу положил конец более чем вековой гражданской войне и принял титул сёгуна, правя объединённой Японией из Эдо. До него Ода Нобунага и Тоётоми Хидэёси сломили могущество враждующих военачальников. Европейские торговцы и посланники того времени, как правило, считали сёгуна правителем всей Японии."
 jap_adopt_japan_identity_decision.title:0 "Принять имя $JAP$"
 jihad_cannot_leave_tt:0 "Державы не могут выйти из [Concept('jihad', 'джихада')|e] по своей воле. Участие прекращается, когда [jihad] расформировывается — после того, как война против его цели завершится."
 kirishitan.10.a:0 "#italic Слава Господу#!."
 koutoubia_marrakesh_holy_site:0 "Мечеть Аль-Кутубия"
 koutoubia_marrakesh_work_of_art:0 "Мечеть Аль-Кутубия"
 koutoubia_marrakesh_work_of_art_desc:0 "$koutoubia_marrakesh_work_of_art$, дважды возведённая в городе [ShowLocationName('marrakesh')], — яркий образец альморавидской архитектуры и важная достопримечательность в самом центре города. Своё название мечеть получила от книготорговцев, что вели дела вокруг неё."
 kyiv_pechersk_lavra_holy_site:0 "Киево-Печерская лавра"
 kyiv_pechersk_lavra_work_of_art:0 "Печерская лавра ($ORIGIN$)"
 kyiv_pechersk_lavra_work_of_art_desc:0 "Основанная в 1051 году монахами Антонием и Феодосием, Киево-Печерская лавра, или #italic Печерский монастырь#!, — один из старейших и важнейших центров восточного православия. Частично построенный под землёй, монастырь использовал свои пещеры и как кельи, и как места погребения. Со временем лавра разрослась в обширный религиозный и культурный комплекс, где изучали богословие и переписывали рукописи. К XIV веку она стала средоточием духовной жизни и просвещения Киевской Руси."
 laborers_and_peasants_happy_tt:0 "$laborers$ и $peasants$ в районе [target_location.GetName] получают [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 lalibela_church_st_george_holy_site:0 "Скальные церкви Лалибэлы"
 lalibela_church_st_george_work_of_art:0 "Церковь Святого Георгия в Лалибэле"
 lalibela_church_st_george_work_of_art_desc:0 "Церковь Святого Георгия, высеченная в скале в правление короля Лалибэлы в XII веке, — вершина эфиопской монолитной архитектуры. Возведённая из стремления создать #italic Новый Иерусалим#!, она отражает религиозные чаяния своей эпохи и самобытное христианское наследие, которым славится $ETH$."
 laws.0031.desc:0 "Район [target_location.GetName] больше нам не подконтролен, поэтому сооружение «[ShowBuildingTypeName('itinerant_court_seat')]» вновь учреждено в районе [ROOT.GetCountry.GetCapital.GetName]."
 laws.0031.t:0 "Странствующий двор"
 leader_dies:0 "#Y [target_character.GetName] не выживает#!"
 leader_is_scarred:0 "#Y [target_character.GetName] выживает, но остаётся со шрамами#!"
 legionaries:0 "Легионеры"
 lesson_basics_wrap_up_2b:0 "Советы 2b"
 light_ship_1_repair:0 "Ремонт лёгкого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_1_traditions')]"
 light_ship_2_repair:0 "Ремонт лёгкого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_2_renaissance')]"
 light_ship_3_repair:0 "Ремонт лёгкого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_3_discovery')]"
 light_ship_4_repair:0 "Ремонт лёгкого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_4_reformation')]"
 light_ship_5_repair:0 "Ремонт лёгкого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_5_absolutism')]"
 light_ship_6_repair:0 "Ремонт лёгкого корабля в эпоху [ShowShortAgeNameWithNoTooltip('age_6_revolutions')]"
 lit_offer_hand_to_poland_tt:0 "Держава [GetCountry('POL').GetNameWithNoTooltip] решит, как ответить: она может согласиться, открыв путь к мирной унии, или отказаться и получить [Concept('casus_belli', 'повод для войны')|e], чтобы добиваться нашего престола"
 little_ice_age_climate_recovers:0 "Долгая зима заканчивается"
 live_forever_tt:0 "Мы приняли [Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»"
 lleida.catalan_dialect:0 "Льейда"
 local_governor_dlc_tt:0 "Совокупное число сооружений «[ShowBuildingTypeName('local_governor')]» и «[ShowBuildingTypeName('itinerant_court_seat')]» в державе [SCOPE.sCountry('actor').GetNameWithNoTooltip] меньше [SCOPE.sCountry('actor').GetModifierValue('num_local_governors')] (домов местных губернаторов: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('local_governor')|V], престолов странствующего двора: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('itinerant_court_seat')|V])"
 location_valid_for_calling:0 "Район [LOCATION.GetName] подходит для резиденции ордена с [Concept('calling', 'призванием')|e] «[TARGET_CALLING.GetName]»"
 location_valid_for_religious_order_type:0 "Район [LOCATION.GetName] отвечает требованиям для основания ордена типа «[TARGET_RELIGIOUS_ORDER_TYPE.GetName]»"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a:0 "Верность, которую хранят [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], поможет укрепить нашу власть!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry:0 "Верность сословия «$crown_estate$» поможет укрепить нашу власть!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc:0 "После падения Рустамидов многие [ShowReligionAdjective('ibadi')]ие общины региона [ShowRegionName('maghreb_region')] были вынуждены бежать в долину Мзаб. Многие из этих [ShowReligionAdjectiveWithNoTooltip('ibadi')]их государств решили участвовать в совете Маджлис Амми Саид, во главе которого встали [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], другие же предпочли сохранить независимость.\n\nТеперь, когда многие из наиболее населённых [ShowReligionAdjectiveWithNoTooltip('ibadi')]их земель вошли в состав державы [ROOT.GetCountry.GetName], [our_ruler.GetName] стремится сосредоточить совет Маджлис Амми Саид в районе [ROOT.GetCountry.GetCapital.GetName], надеясь создать сильную и влиятельную [ShowReligionAdjectiveWithNoTooltip('ibadi')]ую державу в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry:0 "Совет, рассеянный по гордо независимым [ShowReligionAdjective('ibadi')]им государствам, может советовать, но не может править. Теперь, когда самые населённые из этих земель подчиняются нам, Маджлис Амми Саид можно собрать под одной крышей и под единой властью. То, что начиналось как убежище в долине Мзаб, станет тогда самостоятельной державой во всём регионе [ShowRegionName('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.title:0 "Централизовать совет Маджлис Амми Саид"
 maghreb_masters_of_the_sahara.a:0 "Мы совершили невозможное!"
 maghreb_masters_of_the_sahara.desc:0 "Испокон веков народы региона [ShowRegionName('maghreb_region')] участвуют в транссахарской торговле, пересекая суровые пустыни с ценными товарами. Задача нелёгкая, но если мы сумеем установить прочное влияние в области [ShowAreaName('desert_area')] и расширить инфраструктуру главных караванных стоянок, наши народы, возможно, ещё укротят эти беспощадные пески."
 maghreb_masters_of_the_sahara.title:0 "Повелители Сахары"
 maghrebi_cultural_change_events.1004.a:0 "Если в регионе [ShowRegionNameWithNoTooltip('iberia_region')] так хорошо, что ж они туда не вернутся?"
 maghrebi_cultural_change_events.1004.b:0 "Попытаться успокоить обе стороны."
 maghrebi_cultural_change_events.1004.desc:0 "В последние годы из региона [ShowRegionName('iberia_region')] к нам хлынули [ShowCultureName('andalusi')]ие переселенцы, бегущие от жестоких гонений, которым подвергаются там наши [ShowReligionGroupAdjective('muslim')]ие братья. Хотя [ROOT.GetCountry.GetReligion.GetGodName] даровал им новый дом, эти дерзкие пришельцы смеют открыто жаловаться на жизнь в регионе [ShowRegionName('maghreb_region')] и превозносить тех, кто остался во владениях коварных [ShowReligionGroupAdjective('christian')]их держав!\n\nОдин известный представитель сословия [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], принадлежащий к общине «[target_pop2.GetName]», назвал такие речи «почти отступничеством от веры»."
 maghrebi_cultural_change_events.1004.title:0 "Дерзость [ShowCultureNameWithNoTooltip('andalusi')]их переселенцев"
 maghrebi_culture.1.a:0 "[target_location.GetNameWithNoTooltip] останется прибежищем для [ShowCultureNameWithNoTooltip('mustaarabi')]их евреев."
 maghrebi_culture.1.b:0 "Пусть радикальные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] добьются своего: община должна принять [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.1.desc:0 "Хотя в эпоху владычества Альмохадов значительную часть [ShowCultureName('mustaarabi')]их евреев изгнали из региона [ShowRegionName('maghreb_region')], в районе [target_location.GetName] вновь нашли убежище многие [ShowCultureNameWithNoTooltip('mustaarabi')]ие общины. И хотя [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective]ого правителя проводит более терпимую политику по отношению к [ShowReligionAdjective('judaism')]ой вере, наиболее радикальные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] заговорили о возвращении к давно отвергнутому учению Альмохадов."
 maghrebi_culture.1.title:0 "[ShowReligionAdjectiveWithNoTooltip('judaism')]ая община в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.10.a:0 "Район [target_location.GetNameWithNoTooltip] должен сохранить своё значение для транссахарской торговли!"
 maghrebi_culture.10.b:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] не может выделить средства району [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.10.desc:0 "Район [target_location.GetName] лежит на одном из многочисленных торговых путей области [ShowAreaName('desert_area')], и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] издавна делают здесь остановку. Однако в последние годы, под защитой державы [ROOT.GetCountry.GetName], [target_location.GetRank.GetName] заметно вырос в значении: многие торговцы предпочитают останавливаться именно здесь, ведь путешествовать по [ROOT.GetCountry.GetAdjective]им землям безопасно. Возросшее значение принесло району [target_location.GetNameWithNoTooltip] широкую известность по всей Сахаре, но и легло на [target_location.GetRank.GetNameWithNoTooltip] тяжким бременем.\n\nЧтобы [target_location.GetRank.GetNameWithNoTooltip] и впредь оставался влиятельным торговым узлом, [ROOT.GetCountry.GetGovernment.GetCourtTitle] просит: пусть [our_ruler.GetName] выделит средства, без которых [target_location.GetRank.GetNameWithNoTooltip] не справится с растущим потоком торговцев."
 maghrebi_culture.10.title:0 "Растущее значение района [target_location.GetNameWithNoTooltip] для транссахарской торговли"
 maghrebi_culture.11.desc:0 "Хотя район [target_location.GetName] находится в одном из самых суровых уголков региона [ShowRegionName('maghreb_region')], его жители сумели наладить жизнь благодаря недавнему расширению сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]», которое стало настоящим благом: от него особенно выиграли [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] района [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.11.title:0 "Расцвет земледелия в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.12.a:0 "Династия [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] надёжно защищает державу [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.12.b:0 "Пора сбросить оковы династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]."
 maghrebi_culture.12.desc:0 "Со времён падения Альмохадов [ShowCultureName('tunisian')]ая династия [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] сохраняет немалое влияние на востоке региона [ShowRegionName('maghreb_region')]. Хотя держава [ROOT.GetCountry.GetName] сохранила определённую независимость от державы [target_country.GetName], правители из династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] показали себя умелыми сюзеренами, способными защитить [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие земли. Однако по мере того как правление Альмохадов уходит в далёкое прошлое, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё чаще ставит под сомнение законность власти династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]: не пора ли державе [ROOT.GetCountry.GetNameWithNoTooltip] сбросить [ShowCultureNameWithNoTooltip('tunisian')]ое иго?"
 maghrebi_culture.12.title:0 "Под властью династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]"
 maghrebi_culture.13.a:0 "Изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip]!"
 maghrebi_culture.13.b:0 "Позволить [target_character.GetHerHim] остаться — [ROOT.GetCountry.GetGovernment.GetCourtTitle] стерпит."
 maghrebi_culture.13.desc:0 "Хотя [ROOT.GetCountry.GetLongName] уже давно признаёт [ShowCultureName('tunisian')]ий сюзеренитет, [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetNameWithNoTooltip] по большей части сохраняет самостоятельность. Однако недавно [target_character.GetName] [Select_CString(target_character.IsFemale, 'совершила', 'совершил')] несколько вылазок на исконные [ROOT.GetCountry.GetCulture.GetName]ие земли, и по всей державе [ROOT.GetCountry.GetNameWithNoTooltip] начались волнения. Многие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] требуют немедленно изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip], хотя такое изгнание наверняка разгневает державу [target_country.GetName]."
 maghrebi_culture.13.title:0 "[ShowCultureNameWithNoTooltip('tunisian')]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] вмешиваются во внутренние дела"
 maghrebi_culture.14.a:0 "Заставить [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] возместить ущерб от набегов."
 maghrebi_culture.14.b:0 "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получат выговор, но ущерб покроет казна."
 maghrebi_culture.14.c:0 "Поддержать [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] и не мешать набегам."
 maghrebi_culture.14.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в смятении: пришли вести о том, что в районе [target_location.GetName] караваны грабят воины, преданные сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]». Район [target_location.GetNameWithNoTooltip] лежит на одном из важнейших транссахарских торговых путей, и здесь останавливаются многие торговцы. Многие пострадавшие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] требуют, чтобы ущерб, нанесённый своевольными воинами, возместили [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.14.title:0 "Своевольные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] разоряют район [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.15.b:0 "Использовать их поддержку, чтобы укрепить наше влияние во всём [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.15.desc:0 "По мере того как [ROOT.GetCountry.GetAdjective]ая власть распространяется на регион [ShowRegionName('maghreb_region')], всё больше коренных народов присягает на верность державе [ROOT.GetCountry.GetNameWithNoTooltip]. Среди них [target_culture.GetName]ие [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] оказались самыми благосклонными к [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой власти: многие [target_culture.GetNameWithNoTooltip]ие вожди предлагают нам полную поддержку своих племён. Такой порыв со стороны [target_culture.GetNameWithNoTooltip]их племён застал [ROOT.GetCountry.GetGovernment.GetCourtTitle] врасплох: одни предлагают: пусть [our_ruler.GetName] обеспечит им полную поддержку государства и станет отстаивать [target_culture.GetNameWithNoTooltip]ие интересы по всему [ShowRegionNameWithNoTooltip('maghreb_region')]у, другие же советуют просто обратить их горячую преданность нам на пользу."
 maghrebi_culture.15.title:0 "[target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] всё сильнее поддерживают нас"
 maghrebi_culture.16.a:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] рад приветствовать [target_character.GetShortNameWithNoTooltip]!"
 maghrebi_culture.16.b:0 "Отказать [target_character.GetHimHer] в должности генерала."
 maghrebi_culture.16.desc:0 "Сближение [target_culture.GetName]их народов и [ROOT.GetCountry.GetCulture.GetName]ой элиты пошло на пользу: [ROOT.GetCountry.GetAdjective]ая власть в регионе [ShowRegionName('maghreb_region')] окрепла. Чтобы [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий [ROOT.GetCountry.GetGovernment.GetCourtTitle] окончательно убедился в их преданности, [target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предложили отдать одного из своих одарённых вождей на службу державе [ROOT.GetCountry.GetNameWithNoTooltip]. Однако некоторые [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] убеждают [our_ruler.GetName] отклонить предложение: они опасаются, что если [target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получат больше самостоятельности, это в конце концов подорвёт нашу власть в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.16.title:0 "Прославленный [target_culture.GetNameWithNoTooltip]ий генерал"
 maghrebi_culture.17.a:0 "Принять предложение, которое делают [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.17.b:0 "Мы не можем позволить, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получили ещё больше влияния."
 maghrebi_culture.17.desc:0 "Хотя [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] державы [ROOT.GetCountry.GetName] не раз становились тяжким бременем — [ROOT.GetCountry.GetGovernment.GetCourtTitle] помнит это слишком хорошо, — в последние годы некогда непокорные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] начали признавать [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ую власть по всему региону [ShowRegionName('maghreb_region')]. Чтобы [ROOT.GetCountry.GetGovernment.GetCourtTitle] убедился в их новообретённой верности, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предлагают поставить на службу державе [ROOT.GetCountry.GetNameWithNoTooltip] полководца по имени [target_character.GetName], о чьих талантах ходят легенды. Впрочем, [ROOT.GetCountry.GetGovernment.GetCourtTitle] опасается, что это лишь уловка: так [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] надеются добиться влияния, которое может дать им только [our_ruler.GetName]."
 maghrebi_culture.17.title:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предлагают многообещающего генерала"
 maghrebi_culture.18.a:0 "Нам следует искать союзников, чтобы укрепить своё положение."
 maghrebi_culture.18.b:0 "Лучше сосредоточиться на внутренней политике."
 maghrebi_culture.18.desc:0 "После падения Альмохадов династии [ShowDynastyName('marinid_dynasty')] и [ShowDynastyName('hafsid_dynasty')] сосредоточили в своих руках немалую власть в регионе [ShowRegionName('maghreb_region')]. Однако недавние военные походы, которые возглавила династия [our_ruler.GetDynasty.GetName], проложили путь к возвышению новой силы в [ShowRegionNameWithNoTooltip('maghreb_region')]е. Хотя правление династии [our_ruler.GetDynasty.GetNameWithNoTooltip] в [ShowRegionNameWithNoTooltip('maghreb_region')]е снискало поддержку коренного [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ого населения, [ROOT.GetCountry.GetGovernment.GetCourtTitle] склоняется к мысли, что нам стоит поискать союзников за пределами страны, если мы хотим превзойти других крупных игроков [ShowRegionNameWithNoTooltip('maghreb_region')]а."
 maghrebi_culture.18.title:0 "Возвышение династии [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.19.a:0 "Крепкое единство сделает нас непобедимыми!"
 maghrebi_culture.19.b:0 "Нам следует использовать наше прочное единство с [target_culture.GetNameWithNoTooltip]им народом, чтобы укрепить влияние в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.19.c:0 "Культурные узы между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]им и [target_culture.GetNameWithNoTooltip]им народами нерушимы."
 maghrebi_culture.19.desc:0 "Переселение [ShowCultureName('bedouin_culture')]их племён в регион [ShowRegionName('maghreb_region')] в одиннадцатом веке изменило политический облик края, однако [ROOT.GetCountry.GetCulture.GetName]ие и [target_culture.GetName]ие народы, живущие под [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой властью, вновь ощутили своё единство. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое владычество над их родным [ShowRegionNameWithNoTooltip('maghreb_region')]ом во многом положило конец былой межплеменной вражде, и на смену ей пришло новое, общее для этих народов единство."
 maghrebi_culture.19.title:0 "Единство с [target_culture.GetNameWithNoTooltip]ими народами"
 maghrebi_culture.2.a:0 "Мы проложим путь к сильной [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой державе в [ShowRegionNameWithNoTooltip('maghreb_region')]е!"
 maghrebi_culture.2.b:0 "Лучше нам идти собственным путём."
 maghrebi_culture.2.desc:0 "Немало времени минуло с тех пор, как в регионе [ShowRegionName('maghreb_region')] господствовала могущественная [ShowReligionAdjectiveWithNoTooltip('ibadi')]ая держава, однако [our_ruler.GetName] прилагает огромные усилия, чтобы объединить уцелевшие государства, по-прежнему верные [ShowReligionAdjective('ibadi')]ому учению. Пусть земли державы [ROOT.GetCountry.GetName] и уступают в богатстве более развитым государствам [ShowRegionNameWithNoTooltip('maghreb_region')]а, успехи, которых добивается [our_ruler.GetShortNameWithNoTooltip], ещё могут увенчаться рождением новой [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой державы."
 maghrebi_culture.2.title:0 "[ShowReligionAdjectiveWithNoTooltip('ibadi')]ие земли [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.20.a:0 "Добиться их ассимиляции в [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ое общество."
 maghrebi_culture.20.b:0 "Лучше постараться интегрировать [target_culture.GetNameWithNoTooltip]ие народы."
 maghrebi_culture.20.desc:0 "Многие представители [ROOT.GetCountry.GetCulture.GetName]ой элиты постепенно переняли [ShowCultureGroupName('arabic_group')]ие обычаи и традиции, и порой это приводило к столкновениям с более приверженными старине народами региона [ShowRegionName('maghreb_region')]. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] видят в [target_culture.GetName]их народах главный источник раздоров, и [ROOT.GetCountry.GetGovernment.GetCourtTitle] это хорошо знает: многие [target_culture.GetNameWithNoTooltip]ие старейшины отказываются вести дела с сословием «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]».\n\nПользуясь своим влиянием по всей державе [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] подали прошение: пусть [our_ruler.GetName] проводит более жёсткую политику ассимиляции [target_culture.GetNameWithNoTooltip]их народов. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] убеждает [our_ruler.GetShortNameWithNoTooltip] отклонить эти требования, опасаясь неизбежных волнений."
 maghrebi_culture.20.title:0 "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ая власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом"
 maghrebi_culture.21.a:0 "Мы не покоримся [ShowCultureGroupNameWithNoTooltip('iberian_group')]им захватчикам!"
 maghrebi_culture.21.b:0 "Нам следует быть готовыми к возможному вторжению."
 maghrebi_culture.21.desc:0 "Падение последнего [ShowReligionGroupAdjective('muslim')]ого государства в регионе [ShowRegionName('iberia_region')] посеяло новую панику по всему региону [ShowRegionName('maghreb_region')]: многие опасаются, что [ShowReligionGroupAdjectiveWithNoTooltip('christian')]ие государства региона [ShowRegionNameWithNoTooltip('iberia_region')] вскоре обратят свой взор на [ShowRegionNameWithNoTooltip('maghreb_region')]. Многие [ShowCultureName('andalusi')]ие беженцы уже устремились в державу [ROOT.GetCountry.GetNameWithNoTooltip], надеясь укрыться от гнева [ShowCultureGroupName('iberian_group')]их народов."
 maghrebi_culture.21.title:0 "Бедственное положение [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.22.a:0 "Нужно поскорее закрепиться на море."
 maghrebi_culture.22.b:0 "Мы не можем пренебречь своими транссахарскими торговыми путями."
 maghrebi_culture.22.desc:0 "Хотя жители державы [ROOT.GetCountry.GetName] куда привычнее к транссахарской торговле, походы под началом [our_ruler.GetName] помогли державе [ROOT.GetCountry.GetNameWithNoTooltip] прочно закрепиться на побережье и получить выход в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Видя в этом новые торговые возможности, многие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] призывают [ROOT.GetCountry.GetGovernment.GetCourtTitle] выделить средства на постройку нового флота, хотя некоторые опасаются, что это подорвёт традиционную транссахарскую торговлю, которая издавна приносит выгоду державе [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.22.title:0 "Выход в [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]"
 maghrebi_culture.23.a:0 "Искать компромисса между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ой и [target_culture.GetNameWithNoTooltip]ой элитами."
 maghrebi_culture.23.b:0 "[target_culture.GetNameWithNoTooltip]ому влиянию в [ShowRegionNameWithNoTooltip('maghreb_region')]е пришёл конец."
 maghrebi_culture.23.desc:0 "[target_culture.GetName]ая элита издавна обладает немалой властью в регионе [ShowRegionName('maghreb_region')]. Она же давно стала яблоком раздора для многих [ShowCultureGroupName('amazigh_group')]их народов, ведь её представители выступают за жёсткую ассимиляцию и требуют перенимать [ShowCultureGroupName('arabic_group')]ие обычаи. С возвышением державы [ROOT.GetCountry.GetName] — [ROOT.GetCountry.GetFlavorRank], где у власти по-прежнему [ROOT.GetCountry.GetCulture.GetName]ая элита, — некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] призывают [our_ruler.GetName] обуздать [target_culture.GetNameWithNoTooltip]ую знать. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] разделился во мнениях: многие видят в [target_culture.GetNameWithNoTooltip]ой элите бесценного союзника, который поможет нам укрепить растущую власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом."
 maghrebi_culture.23.title:0 "Время расплаты для арабизированной элиты"
 maghrebi_culture.24.a:0 "Извлечь выгоду из новых ковров."
 maghrebi_culture.24.b:0 "Мы должны и дальше вкладываться в новые ковры!"
 maghrebi_culture.24.desc:0 "[ROOT.GetCountry.GetCulture.GetName]ие ковры издавна ценятся во всём регионе [ShowRegionName('maghreb_region')] и служат важным товаром для многих [ROOT.GetCountry.GetAdjective]их торговцев. Однако в последние годы благодаря более надёжному источнику товара «[ShowGoodsNameWithNoTooltip('dyes')]» появилось новое поколение [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]их килимов, и спрос на эти ковры растёт как в самом регионе [ShowRegionName('maghreb_region')], так и за его пределами."
 maghrebi_culture.24.title:0 "Новые [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ие килимы"
 maghrebi_culture.25.a:0 "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] вспомнят своё место в этом мире."
 maghrebi_culture.25.b:0 "Сохранить самостоятельность, которой пользуются [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], чтобы избежать внутренних распрей."
 maghrebi_culture.25.desc:0 "Хотя сила, которой обладают [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')], не раз помогала державе [ROOT.GetCountry.GetName] отражать угрозы, по мере того как [ROOT.GetCountry.GetFlavorRank] обрастает бюрократией, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё чаще спорит о том, насколько они полезны. Да, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] помогали защищать державу [ROOT.GetCountry.GetNameWithNoTooltip], но они же доставляли немало хлопот, когда не соглашались с политикой, которую проводит [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nТеперь [ROOT.GetCountry.GetGovernment.GetCourtTitle] обсуждает мысль о том, что государство окрепло достаточно и больше не нуждается в защите, которую дают [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]. Более того, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] пора окончательно обуздать ради укрепления растущей [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой державы."
 maghrebi_culture.25.title:0 "Объединение земель, которыми владеют [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.26.a:0 "Мы станем защитниками Магриба!"
 maghrebi_culture.26.desc:0 "С крахом Альмохадов регион [ShowRegionName('maghreb_region')] вступил в эпоху нестабильности, а влияние на регион [ShowRegionName('iberia_region')] ослабло, однако держава [ROOT.GetCountry.GetName], которой правит [our_ruler.GetName], стала фактическим гегемоном края. Хотя некоторые части [ShowRegionNameWithNoTooltip('maghreb_region')]а всё ещё остаются вне [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ого влияния, [ShowCultureGroupName('iberian_group')]ие королевства, скорее всего, признают в державе [ROOT.GetCountry.GetNameWithNoTooltip] регионального соперника, которого нельзя недооценивать, если они пожелают завоевать [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.26.title:0 "Господство над [ShowRegionNameWithNoTooltip('maghreb_region')]ом"
 maghrebi_culture.27.a:0 "Пусть правление династии [our_ruler.GetDynasty.GetNameWithNoTooltip] и дальше несёт процветание"
 maghrebi_culture.27.desc:0 "Теперь, когда большая часть региона [ShowRegionName('maghreb_region')] находится под [ROOT.GetCountry.GetAdjective]ой властью, династия [our_ruler.GetDynasty.GetName] взялась за обновление многих важнейших памятников культуры в [ShowRegionNameWithNoTooltip('maghreb_region')]е и покровительствует строительству новых центров учёности. Ещё недавно этот край едва не оказался во власти чужеземных держав, но при династии [our_ruler.GetDynasty.GetNameWithNoTooltip] он превратился в могучую силу, перед которой благоговеет всё [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.title:0 "Золотой век [ShowRegionNameWithNoTooltip('maghreb_region')]а при династии [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.28.a:0 "Предоставить им полную поддержку государства."
 maghrebi_culture.28.b:0 "Позволить корсарам продолжать своё дело."
 maghrebi_culture.28.c:0 "Положить конец набегам корсаров"
 maghrebi_culture.28.desc:0 "Вся [ShowContinentName('europe')] знает каперов региона [ShowRegionName('maghreb_region')] как грозную силу, совершающую набеги на всё [ShowScriptedGeographyName('mediterranean_sea_geography')], однако до сих пор их покровители менялись от государства к государству.\n\nНо теперь, когда [ROOT.GetCountry.GetAdjective]ое влияние распространяется вдоль побережья, многие каперы обращаются к державе [ROOT.GetCountry.GetNameWithNoTooltip] в надежде заручиться нашей поддержкой, чтобы их набеги с новой силой охватили всё [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Впрочем, [ROOT.GetCountry.GetGovernment.GetCourtTitle] видит здесь и иную возможность: ослабить каперов и восстановить отношения с европейскими державами, чей гнев они навлекали на себя веками."
 maghrebi_culture.28.title:0 "Влияние на корсаров"
 maghrebi_culture.3.a:0 "Мы будем проводить политику терпимости ко всем течениям, на которые разделился [ShowReligionGroupNameWithNoTooltip('muslim')]."
 maghrebi_culture.3.b:0 "Приверженцы других течений должны принять [ShowReligionNameWithNoTooltip('ibadi')]."
 maghrebi_culture.3.desc:0 "[our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'совершила', 'совершил')] невозможное, создав новую [ShowReligionAdjective('ibadi')]ую державу в регионе [ShowRegionName('maghreb_region')]. Теперь, когда держава [ROOT.GetCountry.GetName] стала одной из главных сил [ShowRegionNameWithNoTooltip('maghreb_region')]а, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё настойчивее призывает [our_ruler.GetNameWithNoTooltip] по-новому взглянуть на другие течения, на которые разделился [ShowReligionGroupName('muslim')]. Новая [ShowReligionAdjectiveWithNoTooltip('ibadi')]ая держава привлекла новых последователей, однако многие жители [ShowRegionNameWithNoTooltip('maghreb_region')]а по-прежнему исповедуют [ShowReligionAdjective('sunni')]ий ислам."
 maghrebi_culture.3.title:0 "Возрождение [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой власти в [ShowRegionNameWithNoTooltip('maghreb_region')]е"
 maghrebi_culture.4.a:0 "Воспользоваться слабостью державы [target_country.GetNameWithNoTooltip]!"
 maghrebi_culture.4.b:0 "Они слишком раздроблены и далеки, чтобы представлять угрозу."
 maghrebi_culture.4.desc:0 "Некогда [ShowReligionAdjective('ibadi')]ий султанат обладал огромным влиянием в регионе [ShowRegionName('maghreb_region')], однако за века, прошедшие после падения Рустамидов, многие ревностные [ShowReligionAdjectiveWithNoTooltip('ibadi')]ие верующие переселились в область [ShowAreaName('desert_area')]. Теперь, когда владения державы [ROOT.GetCountry.GetName] простираются до этих земель, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает: пусть [our_ruler.GetName] начнёт поход против державы [target_country.GetName] — одного из самых слабых осколков былого султаната."
 maghrebi_culture.4.title:0 "Молодые [ShowReligionAdjectiveWithNoTooltip('ibadi')]ие государства [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.5.a:0 "Они должны обратиться в [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.5.b:0 "Лучше постараться мирно интегрировать [ShowReligionAdjectiveWithNoTooltip('ibadi')]ое население."
 maghrebi_culture.5.desc:0 "В области [ShowAreaName('desert_area')] издавна проживает многочисленное [ShowReligionAdjectiveWithNoTooltip('ibadi')]ое население, и теперь большая его часть оказалась под властью державы [ROOT.GetCountry.GetName]. Поскольку в державе [ROOT.GetCountry.GetNameWithNoTooltip] теперь живёт немало приверженцев [ShowReligionNameWithNoTooltip('ibadi')]а, [ROOT.GetCountry.GetGovernment.GetCourtTitle] настойчиво призывает [our_ruler.GetName] проводить политику терпимости по отношению к [ShowReligionAdjectiveWithNoTooltip('ibadi')]им верующим, иначе государству грозят религиозные волнения."
 maghrebi_culture.5.title:0 "Подчинение [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]ого [ShowReligionAdjectiveWithNoTooltip('ibadi')]ого населения"
 maghrebi_culture.6.a:0 "Мы установим [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ую власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом!"
 maghrebi_culture.6.desc:0 "В десятилетия после падения Альмохадов наибольшим влиянием в регионе [ShowRegionName('maghreb_region')] пользовались державы [target_country_1.GetName] и [target_country.GetName], однако под предводительством [our_ruler.GetName] нам удалось создать в [ShowRegionNameWithNoTooltip('maghreb_region')]е могущественное государство, не уступающее державе [target_country.GetNameWithNoTooltip]. И хотя знать держав [target_country_1.GetNameWithNoTooltip] и [target_country.GetNameWithNoTooltip] с опаской смотрит на [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое влияние, многие [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]ие народы приняли нашу власть куда охотнее."
 maghrebi_culture.6.title:0 "Растущее влияние державы [ROOT.GetCountry.GetNameWithNoTooltip]"
 maghrebi_culture.7.a:0 "Пусть местные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] получат средства на создание оросительной сети."
 maghrebi_culture.7.desc:0 "Хотя в регионе [ShowRegionName('maghreb_region')] немало плодородных земель, близость области [ShowAreaName('desert_area')] делает многие его уголки суровыми и неприветливыми.\n\nЖители района [target_location.GetName] просят выделить средства на постройку сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]»: [target_location.GetRank.GetName] надеется так смягчить самые тяжёлые условия жизни."
 maghrebi_culture.7.title:0 "Орошение пальмовых рощ в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.8.a:0 "Перенять особенности архитектуры района [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.8.b:0 "Лучше выделить району [target_location.GetNameWithNoTooltip] дополнительные средства."
 maghrebi_culture.8.desc:0 "Жители района [target_location.GetName] издавна славятся умением приспосабливать постройки к суровым условиям, которые диктует [ShowVegetationName('desert')], а зодчие, которых туда направил [ROOT.GetCountry.GetGovernment.GetCourtTitle], вернулись под большим впечатлением от увиденного. Хотя столица — [ROOT.GetCountry.GetCapital.GetName] — лежит в совсем иной местности, чем район [target_location.GetNameWithNoTooltip], наши зодчие уверены: если их поддержит [our_ruler.GetName], подобные улучшения можно провести и в столичном районе [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 maghrebi_culture.8.title:0 "Искусная архитектура района [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.9.a:0 "Нам следует искать сотрудничества с [ShowCultureGroupNameWithNoTooltip('arabic_group')]ой элитой."
 maghrebi_culture.9.b:0 "Лучше сохранить [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие традиции."
 maghrebi_culture.9.desc:0 "С тех пор как в одиннадцатом веке при поддержке Фатимидов многие [ShowCultureName('bedouin_culture')]ие племена переселились в регион [ShowRegionName('maghreb_region')], многим коренным [ShowCultureGroupName('amazigh_group')]им народам пришлось признать власть этой набирающей силу [ShowCultureGroupName('arabic_group')]ой элиты. Хотя под властью державы [ROOT.GetCountry.GetName] многие [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие народы сохранили самостоятельность, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить в державу [ROOT.GetCountry.GetNameWithNoTooltip] часть этой элиты: пусть [ShowCultureGroupNameWithNoTooltip('arabic_group')]ие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] придадут нашей власти законность. Однако такое приглашение наверняка разгневает [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]."
 maghrebi_culture.9.title:0 "Традиции [ShowCultureGroupNameWithNoTooltip('amazigh_group')]их народов"
 maghrebi_culture_masters_of_sahara_arid_location_bonus:0 "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»; он затронет [Concept('locations', 'районы')|e] с климатом «[ShowClimateName('arid')]»:"
 maghrebi_culture_masters_of_sahara_country_bonus:0 "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»:"
 maghrebi_culture_masters_of_sahara_desert_location_bonus:0 "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»; он затронет [Concept('locations', 'районы')|e] с флорой «[ShowVegetationName('desert')]»:"
 mapmode_dlc_name:0 "Державы дополнения"
 marry_noble_act_past:0 "Брак со знатным человеком для персонажа [CHARACTER.GetName] — выгодный способ обеспечить нашей [Concept('country', 'державе')|e] престолонаследие без чужеземного влияния!"
 marry_noble_desc_specific:0 "[CHARACTER.GetName] вступит в брак с персонажем [TARGET_CHARACTER.GetName]."
 marry_noble_past:0 "[CHARACTER.GetName] вступает в брак!"
 mfa_start_war_against_byz_decision.desc.entry:0 "Пришло время призвать союзников и наконец выступить против наших сородичей в регионе [ShowScriptedGeographyName('greece_geography')]."
 millau.catalan_dialect:0 "Мильяу"
 mining_survey_events.1.a:0 "Не скупиться. Отправить искусных пробирщиков и золото на образцы."
 mining_survey_events.1.b:0 "Хватит и скромной платы. Старейшины дадут проводников и кров."
 mining_survey_events.10.b:0 "Разрабатывать тихо. Соперникам-литейщикам пока незачем об этом знать."
 mining_survey_events.11.a:0 "Разрабатывать открыто. Пусть [ROOT.GetCountry.GetFlavorRank] знает: у нас есть [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b:0 "Разрабатывать тихо. Латунщики платят больше, пока слухи не расползлись."
 mining_survey_events.12.a:0 "Объявить о находке. Новая жила, где добывают [ShowGoodsNameWithNoTooltip('tin')], — дело государственной важности."
 mining_survey_events.12.b:0 "Держать в тайне. Прибрать к рукам торговлю бронзой раньше соперников."
 mining_survey_events.13.b:0 "Тихо распродать добычу по договорам пороховым мельницам и печатникам."
 mining_survey_events.14.a:0 "Возвестить о находке — пусть [ROOT.GetCountry.GetFlavorRank] знает. Рудник, где добывают [ShowGoodsNameWithNoTooltip('silver')], — это триумф."
 mining_survey_events.14.b:0 "Держать в тайне. Чужие глаза, обращённые на наше [ShowGoodsNameWithNoTooltip('silver')], сулят беду."
 mining_survey_events.14.historical_info:0 "Добыча серебра преобразила экономику Европы в позднее Средневековье и раннее Новое время. Открытие крупных серебряных жил в Шваце в Тироле и в Яхимове в Богемии в конце XV века, а затем находка в Потоси в Андах в 1545 году наводнили Европу слитками и подпитали великую инфляцию XVI века. Доходный серебряный рудник был стратегическим достоянием того же масштаба, что флот или крепость."
 mining_survey_events.15.b:0 "Разрабатывать тихо. [ShowGoodsNameWithNoTooltip('goods_gold')] притягивает непрошеных гостей."
 mining_survey_events.16.a:0 "Разрабатывать по [ROOT.GetCountry.GetGovernment.GetAdjective]ой грамоте. Пусть узнает и [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.16.b:0 "Сдать выработки в аренду железозаводчикам за постоянную долю."
 mining_survey_events.17.a:0 "Взять выработки под [ROOT.GetCountry.GetGovernment.GetAdjective]ий контроль. [ShowGoodsNameWithNoTooltip('stone')] — стратегический товар."
 mining_survey_events.17.b:0 "Сдать каменоломню в аренду гильдии каменщиков за постоянную плату."
 mining_survey_events.18.a:0 "Объявить о находке. Великая каменоломня, где добывают [ShowGoodsNameWithNoTooltip('marble')], — национальное сокровище."
 mining_survey_events.18.b:0 "Тихо приберечь [ShowGoodsNameWithNoTooltip('marble')] для [ROOT.GetCountry.GetGovernment.GetAdjective]их нужд."
 mining_survey_events.19.a:0 "Объявить о находке. Копи, где добывают [ShowGoodsNameWithNoTooltip('gems')], — чудо, которым стоит похвастаться."
 mining_survey_events.19.b:0 "Тихо приберечь [ShowGoodsNameWithNoTooltip('gems')] для [ROOT.GetCountry.GetGovernment.GetAdjective]ой казны."
 mining_survey_events.20.b:0 "Разрабатывать тихо. Монополия на [ShowGoodsNameWithNoTooltip('mercury')] — великая сила."
 mining_survey_events.20.desc:0 "В нагорье вскрыто месторождение киновари: её ярко-красная руда безошибочно указывает, что в породе есть [ShowGoodsName('mercury')]. Реторту и конденсатор уже устанавливают на безопасном расстоянии от выработок, ведь известно, что пары, выделяющиеся при обжиге, расшатывают зубы и мутят рассудок. Алхимики, пробирщики и золотильщики будут черпать из этого рудника ещё целое поколение, а за столь редкий и полезный металл можно запросить любую цену."
 mining_survey_events.21.b:0 "Сдать промысел в аренду торговцам солью за постоянную долю."
 mining_survey_events.22.a:0 "Объявить о находке. [ShowGoodsNameWithNoTooltip('alum')] — торжество мастерства, которым славится [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.22.b:0 "Разрабатывать тихо. Папской монополии на [ShowGoodsNameWithNoTooltip('alum')] знать об этом незачем."
 mining_survey_events.23.a:0 "Разрабатывать на правах [ROOT.GetCountry.GetGovernment.GetAdjective]ой монополии. [ShowGoodsNameWithNoTooltip('saltpeter')] — это война."
 mining_survey_events.23.b:0 "Позволить торговцам порохом разрабатывать залежь в обмен на право первыми получать добычу."
 mining_survey_events.30.a:0 "Отозвать отряд. Не всякая земля стоит того, чтобы хоронить в ней людей."
 mining_survey_events.31.a:0 "Оставить разработку. Местные не зря говорят о дурном воздухе."
 mining_survey_events.33.a:0 "Закрыть шахту. Свободные люди — опора, на которой стоит [ROOT.GetCountry.GetFlavorRank], и мы пришли не затем, чтобы их хоронить."
 mining_survey_events.33.historical_info:0 "Отравление свинцом, #italic colica plumbica#! древних, было хорошо известной профессиональной болезнью рудокопов, плавильщиков, стекольщиков и гончаров. Трактат Бернардино Рамаццини #italic De morbis artificum diatriba#! (1700), основополагающий труд медицины труда, отводил этому недугу обширную главу. Обычные средства — кровопускание, слабительное и питьё молока — не помогали, и единственной настоящей профилактикой было ограничение контакта со свинцом, к чему у владельцев рудников почти не было экономических стимулов."
 mining_survey_events.34.historical_info:0 "Серебряные жилы славились своей изменчивостью по простиранию: на одних участках они раздувались в рудные тела толщиной в несколько футов, на других сужались до пустых прожилков. Капризы строения жил превращали добычу серебра в ремесло просвещённого азарта, и взлёт и упадок средневековых горняцких городов, таких как Яхимов, Швац и Иглау, с мрачной закономерностью следовали за открытием и истощением отдельных жил."
 mining_survey_events.35.a:0 "Собираться и уходить. «Золото дураков» — старейшая ловушка старателей."
 mining_survey_events.36.a:0 "Закрыть выработку. Мы ещё не готовы бороться с рудничным газом."
 mining_survey_events.38.a:0 "Закрыть каменоломню. Трещиноватый [ShowGoodsNameWithNoTooltip('marble')] годится лишь на щебень для дорог."
 mining_survey_events.42.a:0 "Закрыть промысел. [ShowGoodsNameWithNoTooltip('alum')] здесь не получатся — химия не та."
 mining_survey_events.43.a:0 "Покинуть долину. Почва мертва, и [ShowGoodsNameWithNoTooltip('saltpeter')] здесь не образуется."
