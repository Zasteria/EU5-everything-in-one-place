 flavor_hol.19.title:0 "Узник Голландии"
 flavor_hun.380.title:0 "Королевское плацет"
 flavor_hun.470.title:0 "Привилегия для славян"
 flavor_iberian_union.1.desc:0 "Брак, соединивший короны двух держав — [iu_member_a.GetName] и [iu_member_b.GetName], — даёт нам возможность выковать прочную связь между нашими королевствами. Пусть этот союз родился из политической нужды, [ROOT.GetCountry.GetGovernment.GetAdjective]ая чета, похоже, вполне счастлива в браке: супруги вместе трудятся над укреплением унии, возводя прочное политическое здание, которое сможет стать одной из ведущих сил на континенте [ShowContinentName('europe')]."
 flavor_iberian_union.1.historical_info:0 "Самая знаменитая из иберийских династических уний возникла в 1469 году благодаря браку Изабеллы I Кастильской и Фердинанда II Арагонского — Католических королей. Их союз объединил две величайшие короны полуострова, сохранив при этом собственные институты каждой из них, а их внук Карл унаследовал обе короны как единое государство. Столетие спустя, в 1580 году, Филипп II Испанский заявил права на опустевший португальский престол и объединил Кастилию, Арагон и Португалию под властью испанских Габсбургов — вплоть до Португальской реставрации 1640 года."
 flavor_iberian_union.2.a:0 "Пусть наши королевства процветают как одно целое."
 flavor_iberian_union.2.desc:0 "Короны региона [ShowRegionName('iberia_region')] перешли к одному государю. То, что начиналось как брак двух домов, стало личной унией: престолы наших держав ныне венчают одно чело. Каждое королевство хранит свои законы, свои суды и свою гордость, но в вопросах легитимности и династии они говорят единым голосом. Рождается Иберийская уния, а с ней — надежда на державу, способную соперничать с любой другой во всём христианском мире."
 flavor_iberian_union.2.historical_info:0 "Когда наследник двух корон получал обе, возникало не единое королевство, а составная монархия — отдельные государства под властью общего государя. Именно так была устроена Испанская монархия: Кастилия, Арагон, а позднее и Португалия сохраняли собственные #italic кортесы#!, законы и управление под властью общего короля. Такие унии существовали лишь до тех пор, пока жила общая династия, и отсутствие наследника могло разъединить то, что соединил брак."
 flavor_iberian_union.3.a:0 "Отправим брачное предложение стране [iu_partner_a.GetNameWithNoTooltip]."
 flavor_iberian_union.3.b:0 "Лучше обратимся к стране [iu_partner_b.GetNameWithNoTooltip]."
 flavor_iberian_union.3.desc:0 "Пока [initiator_candidate.GetName] [Select_CString(initiator_candidate.IsFemale, 'не замужем', 'не женат')], вопрос престолонаследия тяжким грузом нависает над страной [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] настаивает, чтобы сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подыскало подходящий брак и тем обеспечило преемственность власти. Прозвучало и предложение связать нашу судьбу с одной из других [ShowReligionGroupAdjective('christian')]их корон региона [ShowRegionName('iberia_region')]. Без сильного наследника нашей державе ([ROOT.GetCountry.GetFlavorRank]) могут грозить смуты, соперничество претендентов и даже иноземное вмешательство."
 flavor_iberian_union.3.historical_info:0 "Событие под названием «Иберийская свадьба» отражает борьбу за наследство Энрике IV Кастильского. После его смерти престол оспаривали две претендентки: Изабелла Кастильская, которую поддерживал её муж Фердинанд Арагонский, и её племянница Хуана, за которой стояла Португалия. Война завершилась победой Изабеллы и Фердинанда: власть Изабеллы утвердилась, и началось знаменитое правление Католических королей. Позднее этот союз Кастилии и Арагона привёл к созданию единой Испании."
 flavor_iberian_union.4.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] принимает посланника из страны [iu_initiator.GetName]. Нам предлагают династический брак между [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] из нашего собственного дома, чтобы соединить наши королевства. Это предложение сулит взаимное процветание и стабильность, однако некоторые наши советники относятся к нему с недоверием. Такой союз мог бы обеспечить нам поддержку против общих врагов и даже привести к объединению корон, но иные предостерегают, что со временем он может угрожать нашей независимости."
 flavor_iberian_union.5.desc:0 "Колокола звонят по всей нашей державе ([ROOT.GetCountry.GetFlavorRank]) и по всей стране [iu_chosen.GetName]: [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] вступают в брак, соединяясь в единый [ROOT.GetCountry.GetGovernment.GetAdjective]ий дом. Люди заполняют улицы, а оба двора поднимают кубки за союз, который так долго и упорно устраивали послы и епископы. То, что прежде было делом холодного расчёта, ныне скреплено клятвами и празднеством.\n\nЭтот брак дарует нам куда больше, чем один сезон торжеств. Наши династии соединены, наши дома связаны кровью, и если этот союз будет благословлён ребёнком, который унаследует обе короны, однажды наши королевства смогут стать единым целым. А пока наше престолонаследие стало прочнее, и великолепие торжества возвышает нас среди дворов всего христианского мира."
 flavor_iberian_union.6.desc:0 "Страна [iu_chosen.GetName] отвергла наше брачное предложение. Это решение, несомненно, ещё долгие годы будет омрачать наши отношения, но главное — вопрос о нашем престолонаследии так и остаётся нерешённым."
 flavor_iberian_union.7.a:0 "Это оскорбление не останется без ответа."
 flavor_iberian_union.7.desc:0 "Правители страны [iu_initiator.GetName] предпочли связать свой дом с правящим домом страны [iu_chosen.GetName], а не с нами, хотя мы были ничуть не худшей партией. Обида жжёт, но она открывает и возможности: подобное оскорбление — достаточный повод силой взять то, что должно было достаться нам через брак."
 flavor_iberian_union.7.title:0 "Нами пренебрегли"
 flavor_ira.1011.c.tt:0 "Во всех наших [Concept('location', 'районах')|e] области [ROOT.GetVariable('var_target_area').GetName] [Concept('control', 'контроль')|e] меняется на #R -100.0%#!"
 flavor_kor.100.entry:0 "Северная экспедиция правителя"
 flavor_maj.28.title:0 "[target_location.GetNameWithNoTooltip] во всём блеске"
 flavor_mor.27.b:0 "Клятву, данную державе [GetCountry('TUN').GetNameWithNoTooltip], нужно сдержать любой ценой."
 flavor_mor.27.b.entry:0 "Клятву, данную Тунису, нужно сдержать любой ценой."
 flavor_mor.27.c:0 "Двух лет осады довольно — вернуть наших солдат домой."
 flavor_mor.31.title:0 "Создание гарнизона: [ShowBuildingTypeNameWithNoTooltip('guich_garrison')]"
 flavor_mos.38.tt1:0 "$trinity_lavra_st_sergius_work_of_art$ находится в районе [ShowLocationName('pushkino')]"
 flavor_mos.38.tt2:0 "$st_sergius_relics$ находятся в районе [ShowLocationName('pushkino')]"
 flavor_mos.52.tt2:0 "Во владении: [ShowWorkOfArtName('tale_of_the_princes_of_vladimir')]"
 flavor_mos.80.entry:0 "Восстание $Bolotnikov$а"
 flavor_mos.90.desc:0 "Мы рискуем отстать от соперников, которые уже освоили новые науки и лучшие способы управления. Путешествие по дворам Запада могло бы сократить этот разрыв, но лишь если совершить его тихо. Делегации, принятой как почётные гости, покажут церемонии и лесть; той, что пройдёт незамеченной, покажут мастерские, верфи и подлинный механизм их успеха. Беда в том, что сохранить тайну трудно. Слухи расходятся, и двор, понявший, кто на самом деле ходит среди придворных, может закрыть свои двери так же быстро, как открыл их."
 flavor_mos.90.tt5:0 "Открывает экспедицию «Великое посольство», которую [ROOT.GetCountry.GetGovernment.GetRuler.GetName] может предпринять в любое время"
 flavor_nap.12.title:0 "#italic Государство Президий#!"
 flavor_nap.401.historical_info:0 "Восстание Томмазо Аньелло 1647 года было недолгим, но успешным выступлением простонародья против власти ненавистного герцога Аркоса. Итогом восстания стало провозглашение недолговечной Неаполитанской республики."
 flavor_nav.10.desc:0 "Роды Легисамон и Самудьо давно имеют большое влияние в державе [ROOT.GetCountry.GetName], но столь же давно враждуют друг с другом. Пользуясь безвластием, которое принесла [ShowDisasterNameWithNoTooltip('castilian_civil_war')], оба рода постоянно сходятся в стычках по всему северу региона [ShowRegionName('iberia_region')]. Однако последнее столкновение в районе [target_location.GetName] обернулось бедой для этого места ([target_location.GetRank.GetName]): пострадала большая часть жителей.\n\nВражда дошла до опасной черты, и многие просят правителя по имени [our_ruler.GetNameWithNoTooltip] употребить всю власть, какой [our_ruler.GetSheHe] располагает, чтобы ослабить враждующие роды."
 flavor_nav.10.entry:0 "Столкновение Легисамонов и Самудио"
 flavor_nav.11.desc:0 "Хотя противостояние между сторонниками [ROOT.GetCountry.GetAdjective]ой и [GetCountry('CAS').GetAdjective]ой короны опустошило край и [ShowScriptedGeographyName('nav_contested_basque_borderlands')] лежит в руинах, [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие семьи совершили почти невозможное и в значительной мере восстановили влияние державы [ROOT.GetCountry.GetNameWithNoTooltip] на всё [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. И хотя [GetCountry('CAS').GetNameWithNoTooltip] ещё может попытаться вернуть контроль над краем, это, несомненно, дорого обойдётся — [GetCountry('CAS').GetAdjectiveWithNoTooltip]ий [GetCountry('CAS').GetGovernment.GetCourtTitle] заплатит за это немалую цену."
 flavor_nav.13.a:0 "[target_character.GetHeShe|U] [Select_CString(target_character.IsFemale, 'станет отличной наставницей', 'станет отличным наставником')]."
 flavor_nav.14.b:0 "[target_character.GetHerHis|U] влияние вызывает тревогу: [scope_our_consort.GetNameWithNoTooltip] слишком к нему прислушивается. Нужно их разлучить."
 flavor_nav.15.b:0 "Встать на сторону законного правителя державы [ROOT.GetCountry.GetNameWithNoTooltip] — [the_legal_heir.GetNameWithNoTooltip]!"
 flavor_nav.16.c:0 "[target_character.GetSheHe|U] [Select_CString(target_character.IsFemale, 'должна быть остановлена', 'должен быть остановлен')]."
 flavor_nav.6.a:0 "[target_character.GetHerHis|U] правление запомнят как честолюбивое, но ужасное."
 flavor_nav.6.b:0 "[target_character.GetSheHe|U] войдёт в историю как [Select_CString(target_character.IsFemale, 'покорительница', 'покоритель')] — ведь перед [Select_CString(target_character.IsFemale, 'ней', 'ним')] склонилась [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c:0 "[target_character.GetSheHe|U] запомнится тем, что [target_character.GetHerHis] сердце принадлежало державе [ROOT.GetCountry.GetNameWithNoTooltip], несмотря на [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')]ое происхождение."
 flavor_ned.23.desc:0 "Хотя идея «[ShowSocietyDirectionName('free_trade')]» для державы [ROOT.GetCountry.GetName] не нова, споры между протекционистами и сторонниками направления «[ShowSocietyDirectionNameWithNoTooltip('free_trade')]» разгораются всё жарче. Один из философов, участвующих в этих спорах, — [target_character2.GetName], в прошлом заморский купец на службе нашей державы ([ROOT.GetCountry.GetFlavorRank]). Он уже начал писать новый трактат и, возможно, сумеет склонить чашу весов в пользу направления «[ShowSocietyDirectionNameWithNoTooltip('free_trade')]»."
 flavor_pap.1400.a:0 "Идите и воспламените весь мир!"
 flavor_pap.1401.a:0 "К вящей славе Божией!"
 flavor_pap.30.title:0 "«Конституции Святой Матери-Церкви»"
 flavor_pap.5.a:0 "Или Цезарь, или ничто."
 flavor_pol.19.entry:0 "Славный король"
 flavor_pol.20.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] с едва скрываемой досадой взирает на разлаженную машину власти, что зовётся у нас [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [ShowEstatePrivilegeName('liberum_veto')] срывает одно заседание за другим, а [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] превращают каждое из них в забаву: они мечут вето, словно дротики, и любое предложение гибнет прямо в зале заседаний.\n\nНо надежда ещё есть. Те, кто страшится навязанной извне централизации, — а таких среди сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» немало, — как ни парадоксально, могут предпочесть хаосу привилегий, что ныне грозят гибелью всему государству, реформы, после которых [ROOT.GetCountry.GetFlavorRank] окрепнет как единое целое."
 flavor_pol.20.entry:0 "Великий замысел короля"
 flavor_pol.21.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол с реформаторским пылом, который несёт с собой [ShowInstitutionName('enlightenment')], — и пыл этот тревожит наших соседей не меньше, чем восхищает наших философов. [target_character.GetHerHis|U] советники подготовили предложения, которые сметут и [ShowEstatePrivilegeName('liberum_veto')], и [ShowEstatePrivilegeName('nieszawa_privileges')], а на смену дворянскому своеволию придёт действенный законодательный порядок.\n\nОднако соседние дворы пристально следят за нами. Иностранным державам выгодно, чтобы наша держава, [ROOT.GetCountry.GetLongName], оставалась слабой, и их посланники, чья учтивость едва прикрывает угрозу, ясно дали понять, что любое усиление центральной власти будет воспринято как провокация. [ROOT.GetCountry.GetAdjective]ая корона, по их разумению, должна оставаться бессильной — и вопрос лишь в том, осмелимся ли мы на реформы под их бдительным взором."
 flavor_pol.21.entry:0 "Первый натиск короля"
 flavor_pol.22.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] выносит на суд собрания, что зовётся [ROOT.GetCountry.GetGovernment.GetParliament.GetName], самый смелый замысел обновления за всю историю государства [ROOT.GetCountry.GetName]: новую конституцию, которая упразднит [ShowEstatePrivilegeName('liberum_veto')], укрепит положение сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» и превратит нашу раздробленную страну в действенное современное государство.\n\nПосланники соседей уже передали свои послания. Слова их дипломатичны, смысл — нет. Если мы пойдём дальше, то рискуем навлечь иностранное вмешательство. Если же отступим, последний шанс на суверенитет, что ещё остаётся у нашей державы, [ROOT.GetCountry.GetNameWithNoTooltip], будет погребён под теми же дворянскими привилегиями, что душат нас уже больше века. Так или иначе, история запомнит этот миг."
 flavor_pol.40.title:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] державы [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_por.17.concern_daughter:0 "Если на престоле [ROOT.GetCountry.GetGovernment.GetRuler.GetHimHer] сменит дочь, которую оставит [ROOT.GetCountry.GetGovernment.GetRuler.GetName], она рискует стать лишь марионеткой мужа, а тот будет править державой [ROOT.GetCountry.GetName] вместо неё."
 flavor_por.17.concern_fallback:0 "Наследника нет и в помине, а честолюбивые претенденты уже собирают сторонников, и каждый отстаивает собственное право на престол."
 flavor_por.17.concern_queen:0 "Хотя [ROOT.GetCountry.GetGovernment.GetRuler.GetName] уже занимает трон, многие опасаются, что [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] правление ещё может оспорить соперник, готовый отстоять своё право силой меча."
 flavor_por.17.desc:0 "Отсутствие живого наследника мужского пола ставит будущее нашей державы ([ROOT.GetCountry.GetFlavorRank]) под угрозу иностранного вмешательства. [ROOT.GetCountry.Custom('GetFlavorPor17SuccessionConcern')]\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] предлагают изменить закон о престолонаследии и лишить [heir.GetName] права на корону. Они сошлись на том, что если [ROOT.GetCountry.GetGovernment.GetRulerTitle] так и не обзаведётся сыном, [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] место должен занять незаконнорождённый сводный брат, дворянин [john_avis.GetName]."
 flavor_por.17.desc_no_heir:0 "Отсутствие живого наследника мужского пола ставит будущее нашей державы ([ROOT.GetCountry.GetFlavorRank]) под угрозу иностранного вмешательства. [ROOT.GetCountry.Custom('GetFlavorPor17SuccessionConcern')]\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] предлагают официально и навсегда запретить женщинам наследовать корону. Они сошлись на том, что короновать следует незаконнорождённого сводного брата, дворянина [john_avis.GetName]: его притязаниям они доверяют больше, чем праву любого преемника по женской линии."
 flavor_por.17.tt3_no_heir:0 "Женщины будут навсегда исключены из порядка престолонаследия"
 flavor_por.19.desc:0 "Влияние сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]» угасает: у него мало поддержки при дворе ([ROOT.GetCountry.GetGovernment.GetCourtTitle]) и ни одной должности в совете ([ROOT.GetCountry.GetGovernment.GetCabinetTitle]). Наши шпионы сообщают, что дерзкий смутьян по имени [target_character.GetName] ищет сторонников, чтобы свергнуть правителя по имени [ROOT.GetCountry.GetGovernment.GetRuler.GetName], а взамен вернуть сословию «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» прежнюю власть и привилегии."
 flavor_por.19.title:0 "[target_character.GetNameWithNoTooltip]"
 flavor_por.50.desc:0 "Поколениями наша корона притягивала к себе рыцарские ордена: их командорства опирались на нашу благосклонность, их магистры держали ответ перед нами. Теперь [GetCountry('PAP').GetGovernment.GetRulerTitle] торжественной буллой подтверждает то, что мы уже сделали явью: вечная власть над Орденом Христа и родственными ему орденами переходит к короне, а [target_character.GetName] и преемники становятся их верховными управляющими."
 flavor_por.67.desc:0 "Моря за нашими берегами по-прежнему окутаны тайной, но купцы и путешественники рассказывают о далёких рынках, ломящихся от немыслимых богатств. Другие толкуют о могучем царстве пресвитера Иоанна, который, как говорят, основал свою державу где-то далеко в Индиях. Если бы нам только удалось отыскать морской путь в те земли за океаном, [ROOT.GetCountry.GetName] смогла бы напрямую прикоснуться к богатствам, которыми славится $india$ и лежащие за ней земли, и, быть может, даже объединить силы со сказочным царством пресвитера Иоанна."
 flavor_por.67.title:0 "В неизвестность"
 flavor_por.73.desc:0 "Минули годы с тех пор, как мы впервые обнаружили драгоценные металлы в регионе [ShowRegionName('brazil_region')], и за это время наши #italic бандейранты#! открыли обширные залежи, что манят людей из дальних краёв. Искатели удачи и работники в небывалых количествах стекаются теперь в регион [ShowRegionNameWithNoTooltip('brazil_region')], и по мере того как [ROOT.GetCountry.GetName] получает всё больше золота, наша казна наполняется сверх всякого прежнего воображения."
 flavor_por.74.desc:0 "[ROOT.GetCountry.GetAdjective]ое влияние в регионе растёт: экспедиции наших #italic бандейрантов#! продолжают покорять внутренние земли региона [ShowRegionName('brazil_region')]. Недавно одна из таких экспедиций нанесла на карту прежде неведомые земли области [target_area.GetName]; [Select_CString(target_character.IsFemale, 'вела', 'вёл')] её [target_character.GetName]. Теперь [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'готова', 'готов')] поделиться с сословием «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» знаниями, которые [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'обрела', 'обрёл')] в том походе, если мы поддержим будущие экспедиции."
 flavor_por.74.historical_info:0 "Антониу Рапозу Таварес был одним из самых значительных #italic бандейрантов#!, исследовавших внутренние области Бразилии. Хотя его экспедиции повинны и в разорении иезуитских миссий, и в порабощении тысяч коренных жителей, походы Рапозу Тавареса значительно расширили португальское влияние за пределы, установленные Тордесильясским договором."
 flavor_por.75.desc:0 "Растущая потребность в рабочих руках в наших колониальных владениях толкнула многих #italic бандейрантов#! на набеги за рабами среди местных жителей. Теперь снаряжаются экспедиции, которые уходят далеко вглубь материка, чтобы захватывать коренных жителей и отправлять их на работу в рудники."
 flavor_por.75.historical_info:0 "Поначалу #italic бандейранты#! были исследователями и первопроходцами, но со временем их экспедиции всё чаще превращались в набеги ради захвата коренных жителей в рабство. На протяжении всего XVII века набеги на общины коренных народов и иезуитские миссии стали отличительной чертой многих #italic бандейр#!, поставлявших подневольный труд для плантаций, поселений, а затем и для стремительно растущей горнодобывающей промышленности."
 flavor_por.76.historical_info:0 "Фернан Диаш, прозванный Охотником за изумрудами, был одним из самых прославленных #italic бандейрантов#!. Он известен семилетней экспедицией в неизведанные земли за Минас-Жерайсом на поиски легендарных изумрудов Сабарабусу — сказочного горного хребта, в недрах которого, как считалось, таились несметные богатства. Хотя своей изначальной цели экспедиция так и не достигла, Диаш подробно нанёс на карту неизведанные области, основал новые поселения и помог проложить пути, которые в конце концов привели к открытию богатейших золотых месторождений в глубине Бразилии."
 flavor_por.81.a:0 "Посмотрим, на что [target_artist.GetSheHe] [Select_CString(target_artist.IsFemale, 'способна', 'способен')]!"
 flavor_por.81.b:0 "Не будем стеснять [target_artist.GetHimHer]: пусть работает самостоятельно."
 flavor_por.81.desc:0 "Недавно на суд представили несколько работ, автор которых — [target_artist.GetName], и [ROOT.GetCountry.GetGovernment.GetCourtTitle] высоко ценит [target_artist.GetHimHer] мастерство. При дворе теперь советуют сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подумать о том, чтобы нанять [target_artist.GetHimHer] для создания новых произведений во славу державы [ROOT.GetCountry.GetName]."
 flavor_rus.27.entry:0 "Восстание $pugatchev$а"
 flavor_rus.43.desc_default:0 "Лихой офицер и богатый землевладелец привлёк внимание видных придворных, и те предложили ему взять на себя дополнительные обязанности. $flavor_rus.43.desc_common$"
 flavor_swe.42.agricola_alive.tt:0 "Микаэль Агрикола жив"
 flavor_swe.48.title:0 "[birgitta_scope_for_ui.GetNameWithNoTooltip] причислена к лику святых"
 flavor_swe_teu.1.victual_brother_info:0 "Испокон веков пираты чувствуют себя как дома в Балтийском море. Многие моряки и рыбаки из района [target_location.GetName] стремятся встать на путь пиратства и беззакония. Среди них — [target_character.GetName] и его шайка так называемых «равнодольщиков»: теперь они бороздят наши моря под чёрным флагом и стремятся нажить себе состояние, грабя всех несчастных, кому не повезёт с ними повстречаться. Часть этих разбойников, известных как «Виталийские братья», захватила остров [ShowProvinceDefinitionName('gotland_province')] и учредила свою столицу в [ShowLocationName('visby')]. Их бесчинства привели к упадку торговли в этих краях, и если пиратство не прекратится, наша торговля в конце концов окончательно сойдёт на нет."
 flavor_tim.1100.entry:0 "Возвышение Фазлуллаха"
 flavor_tim.5.entry:0 "Посольство в Китай"
 flavor_tle.1.a:0 "К оружию!"
 flavor_tle.1.desc:0 "[ShowRegionName('maghreb_region')] стоит на краю пропасти: [target_siege.GetName] в самом разгаре, а на выручку вот-вот подойдут [tle_scope.GetAdjective]ие войска, так что будущее региона [ShowSubContinentName('north_africa')] может решиться за считаные дни. Выдержит ли [target_location.GetRank.GetName] натиск, который ведёт [mor_ruler.GetName] во главе [mor_ruler.GetHerHis] [mor_scope.GetAdjective]их войск, или [target_location.GetName] падёт, решив судьбу, которую разделят [tle_ruler.GetName] и [tle_ruler.GetHerHis] [tle_scope.GetFlavorRank]?"
 flavor_tle.1.title:0 "[target_war.GetNameWithNoTooltip]"
 flavor_tle.13.a:0 "Превосходная мысль!"
 flavor_tun.13.desc:0 "[ShowReligionGroupAdjective('christian')]ие купцы, торгующие в стране [ROOT.GetCountry.GetName], уже получили обширные права — [ShowGovernmentReformName('catalan_merchant_privileges')]. И всё же, несмотря на это, несмотря на кварталы, которые мы так щедро им отводим, на право судиться лишь у своих, на дарованную им свободу вероисповедания, [target_country.GetAdjective]ие [target_country.GetGovernment.GetEstateName('burghers_estate')] по-прежнему требуют большего — иначе их родина может и вовсе прекратить с нами торговлю."
 flavor_ven.4.title:0 "«Искусство абака»"
