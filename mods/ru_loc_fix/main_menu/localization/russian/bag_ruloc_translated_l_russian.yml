 sengoku_clans_reined_in:0 "Кланы обузданы"
 sengoku_clans_reined_in_desc:0 "Глава сёгуната образует державу [ShowFormableCountryName('JAP_f')], а сам сёгунат продолжает существовать наряду с прочими усмирёнными кланами."
 sengoku_shogun_and_emperor_remain:0 "Остались лишь [GetUniqueInternationalOrganization('japanese_shogunate').GetLeaderTitle] и [ShowSpecialStatusNameWithNoTooltip('japanese_emperor')]"
 sengoku_shogun_and_emperor_remain_desc:0 "Сёгунат образует державу [ShowFormableCountryName('JAP_f')] и распускает сам себя, а последнее императорское здание «[ShowBuildingTypeName('gosho')]» сносится вместе с ним."
 sengoku_shogunate_dissolved:0 "[GetUniqueInternationalOrganization('japanese_shogunate').GetNameWithNoTooltip] распадается"
 sengoku_shogunate_dissolved_desc:0 "Сёгуната больше нет, и образовать державу [ShowFormableCountryName('JAP_f')] предстоит сильнейшему из уцелевших даймё, а не роду свергнутого сёгуна."
 sengoku_sole_clan_remains:0 "Остался единственный клан"
 sengoku_sole_clan_remains_desc:0 "Последний уцелевший клан образует державу [ShowFormableCountryName('JAP_f')], а сам сёгунат распускается в миг своей безоговорочной победы."
