 pacific_crossing_cargo_loaded_effect:0 "На борт погружен груз — [ShowGoodsName('silk')], [ShowGoodsName('porcelain')] и пряности, — который будет продан, когда флот вернётся домой."
 pacific_crossing_events.1.a:0 "Снарядить флот побольше — ещё один корабль для предстоящих поисков."
 pacific_crossing_events.1.a.tt:0 "Ещё один корабль снаряжён и присоединён к флоту (#G +1#! Корабли)"
 pacific_crossing_events.1.b:0 "Запастись провизией на переход, а в остальном положиться на удачу."
 pacific_crossing_events.1.c:0 "[target_leader.GetNameWithNoTooltip] нанесёт на карту каждый ветер и каждое течение на нашем пути."
 pacific_crossing_events.11.c:0 "Бросить гибнущее судно, а его команду распределить по остальным кораблям."
 pacific_crossing_events.18.fight_win_tt:0 "Бунт подавлен, порядок восстановлен (#G +5#! Боевой дух экипажа)"
 pacific_crossing_events.2.a:0 "Выменять воду и фрукты на бусы, [ShowGoodsNameWithNoTooltip('cloth')] и [ShowGoodsNameWithNoTooltip('iron')]."
 pacific_crossing_events.20.b:0 "Подойти и торговать — показать им [ShowGoodsNameWithNoTooltip('iron')] и [ShowGoodsNameWithNoTooltip('cloth')] и надеяться на лучшее."
 pacific_crossing_events.23.a:0 "Вмешаться и разнять драку."
 pacific_crossing_events.23.b:0 "Выбросить зачинщика за борт, и дело с концом."
 pacific_crossing_events.23.break_up_lose_tt:0 "Потасовка оборачивается кровью, прежде чем удаётся восстановить порядок"
 pacific_crossing_events.23.break_up_win_tt:0 "Драку удаётся разнять прежде, чем прольётся настоящая кровь"
 pacific_crossing_events.23.c:0 "Внять им и повернуть флот назад, к Островам Пряностей."
 pacific_crossing_events.23.overboard_tt:0 "Зачинщика хватают и без лишних церемоний бросают в море. Команда смотрит на это в ледяном молчании"
 pacific_crossing_events.23.title:0 "Кровь на палубе"
 pacific_crossing_events.24.title:0 "Пожар в море"
 pacific_crossing_events.4.a:0 "Начать торговлю товарами, что идут через эти острова: [ShowGoodsNameFlat('silk')] и [ShowGoodsNameFlat('porcelain')]."
 pacific_crossing_events.5.a:0 "Заполнить трюм до отказа: [ShowGoodsNameWithNoTooltip('cloves')], до последней бочки."
 pacific_crossing_events.5.desc.no_owner:0 "Запах доходит до флота раньше, чем остров, — сладость на ветру, тяжёлая, резкая и пряная. Одинокая вулканическая вершина, окутанная облаком, зелёная до самой кромки воды. Гавань полна малайских и яванских проа, но ни знамя, ни дворец не говорят о том, кто владеет этим берегом.\n\nКаждый купец в [ShowLocationName('lisbon')] и [ShowLocationName('sevilla')] платит целое состояние за этот аромат, даже не зная, откуда он берётся. Никто в этом флоте ещё не стоял так близко к его источнику — деревья, отягощённые незрелыми [ShowGoodsName('cloves')], на склонах над заливом, где груз одного корабля стоит дороже, чем всё плавание. Трюмы можно наполнить здесь. Остаётся лишь довезти их домой."
 pacific_crossing_events.6.a:0 "Северный путь: держаться азиатского берега, затем идти на восток."
 pacific_crossing_events.6.a.tt:0 "Идти на север вдоль берегов региона [ShowRegionName('japan_region')] и дальше, а затем позволить западным ветрам высоких широт пронести флот через весь океан — туда, где лежит [ShowContinentName('america')], — и домой"
 pacific_crossing_events.6.b.tt:0 "Идти строго на восток, прямо против пассатов, мимо знакомых островов. Ветер отбрасывал назад каждый флот, что пытался пройти этим путём, — будьте готовы к тому, что вас отбросит до самых Островов Пряностей"
 pacific_crossing_events.6.c.tt:0 "Уйти далеко на юго-восток, через усеянный островами южный океан. Путь, вполне возможно, лежит именно там — но он неимоверно долог, и провизии флота может не хватить до его конца"
