 batalha_monastery_work_of_art_desc:0 "Монастырь строился 131 год под руководством целых 15 архитекторов. Он сочетает в себе несколько художественных стилей и считается одним из самых красивых и значимых монастырей, которыми может похвастаться $POR$."
