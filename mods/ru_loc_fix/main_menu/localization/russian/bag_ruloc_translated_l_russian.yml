 flavor_mos.90.desc:0 "Мы рискуем отстать от соперников, которые уже освоили новые науки и лучшие способы управления. Путешествие по дворам Запада могло бы сократить этот разрыв, но лишь если совершить его тихо. Делегации, принятой как почётные гости, покажут церемонии и лесть; той, что пройдёт незамеченной, покажут мастерские, верфи и подлинный механизм их успеха. Беда в том, что сохранить тайну трудно. Слухи расходятся, и двор, понявший, кто на самом деле ходит среди придворных, может закрыть свои двери так же быстро, как открыл их."
 flavor_nap.12.title:0 "#italic Государство Президий#!"
 flavor_nap.401.historical_info:0 "Восстание Томмазо Аньелло 1647 года было недолгим, но успешным выступлением простонародья против власти ненавистного герцога Аркоса. Итогом восстания стало провозглашение недолговечной Неаполитанской республики."
 flavor_nav.10.desc:0 "Роды Легисамон и Самудьо давно имеют большое влияние в державе [ROOT.GetCountry.GetName], но столь же давно враждуют друг с другом. Пользуясь безвластием, которое принесла [ShowDisasterNameWithNoTooltip('castilian_civil_war')], оба рода постоянно сходятся в стычках по всему северу региона [ShowRegionName('iberia_region')]. Однако последнее столкновение в районе [target_location.GetName] обернулось бедой для этого места ([target_location.GetRank.GetName]): пострадала большая часть жителей.\n\nВражда дошла до опасной черты, и многие просят правителя по имени [our_ruler.GetNameWithNoTooltip] употребить всю власть, какой [our_ruler.GetSheHe] располагает, чтобы ослабить враждующие роды."
 flavor_nav.10.entry:0 "Столкновение Легисамонов и Самудио"
 flavor_ned.23.desc:0 "Хотя идея «[ShowSocietyDirectionName('free_trade')]» для державы [ROOT.GetCountry.GetName] не нова, споры между протекционистами и сторонниками направления «[ShowSocietyDirectionNameWithNoTooltip('free_trade')]» разгораются всё жарче. Один из философов, участвующих в этих спорах, — [target_character2.GetName], в прошлом заморский купец на службе нашей державы ([ROOT.GetCountry.GetFlavorRank]). Он уже начал писать новый трактат и, возможно, сумеет склонить чашу весов в пользу направления «[ShowSocietyDirectionNameWithNoTooltip('free_trade')]»."
 flavor_pap.1400.a:0 "Идите и воспламените весь мир!"
 flavor_pap.1401.a:0 "К вящей славе Божией!"
 flavor_pap.30.title:0 "«Конституции Святой Матери-Церкви»"
 flavor_pap.5.a:0 "Или Цезарь, или ничто."
 flavor_pol.19.entry:0 "Славный король"
 flavor_pol.20.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] с едва скрываемой досадой взирает на разлаженную машину власти, что зовётся у нас [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [ShowEstatePrivilegeName('liberum_veto')] срывает одно заседание за другим, а [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] превращают каждое из них в забаву: они мечут вето, словно дротики, и любое предложение гибнет прямо в зале заседаний.\n\nНо надежда ещё есть. Те, кто страшится навязанной извне централизации, — а таких среди сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» немало, — как ни парадоксально, могут предпочесть хаосу привилегий, что ныне грозят гибелью всему государству, реформы, после которых [ROOT.GetCountry.GetFlavorRank] окрепнет как единое целое."
 flavor_pol.20.entry:0 "Великий замысел короля"
 flavor_pol.21.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол с реформаторским пылом, который несёт с собой [ShowInstitutionName('enlightenment')], — и пыл этот тревожит наших соседей не меньше, чем восхищает наших философов. [target_character.GetHerHis|U] советники подготовили предложения, которые сметут и [ShowEstatePrivilegeName('liberum_veto')], и [ShowEstatePrivilegeName('nieszawa_privileges')], а на смену дворянскому своеволию придёт действенный законодательный порядок.\n\nОднако соседние дворы пристально следят за нами. Иностранным державам выгодно, чтобы наша держава, [ROOT.GetCountry.GetLongName], оставалась слабой, и их посланники, чья учтивость едва прикрывает угрозу, ясно дали понять, что любое усиление центральной власти будет воспринято как провокация. [ROOT.GetCountry.GetAdjective]ая корона, по их разумению, должна оставаться бессильной — и вопрос лишь в том, осмелимся ли мы на реформы под их бдительным взором."
 flavor_pol.21.entry:0 "Первый натиск короля"
 flavor_pol.22.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] выносит на суд собрания, что зовётся [ROOT.GetCountry.GetGovernment.GetParliament.GetName], самый смелый замысел обновления за всю историю государства [ROOT.GetCountry.GetName]: новую конституцию, которая упразднит [ShowEstatePrivilegeName('liberum_veto')], укрепит положение сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» и превратит нашу раздробленную страну в действенное современное государство.\n\nПосланники соседей уже передали свои послания. Слова их дипломатичны, смысл — нет. Если мы пойдём дальше, то рискуем навлечь иностранное вмешательство. Если же отступим, последний шанс на суверенитет, что ещё остаётся у нашей державы, [ROOT.GetCountry.GetNameWithNoTooltip], будет погребён под теми же дворянскими привилегиями, что душат нас уже больше века. Так или иначе, история запомнит этот миг."
 flavor_pol.40.title:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] державы [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_por.17.desc:0 "Отсутствие живого наследника мужского пола ставит будущее нашей державы ([ROOT.GetCountry.GetFlavorRank]) под угрозу иностранного вмешательства. [ROOT.GetCountry.Custom('GetFlavorPor17SuccessionConcern')]\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] предлагают изменить закон о престолонаследии и лишить [heir.GetName] права на корону. Они сошлись на том, что если [ROOT.GetCountry.GetGovernment.GetRulerTitle] так и не обзаведётся сыном, [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] место должен занять незаконнорождённый сводный брат, дворянин [john_avis.GetName]."
 flavor_por.19.desc:0 "Влияние сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]» угасает: у него мало поддержки при дворе ([ROOT.GetCountry.GetGovernment.GetCourtTitle]) и ни одной должности в совете ([ROOT.GetCountry.GetGovernment.GetCabinetTitle]). Наши шпионы сообщают, что дерзкий смутьян по имени [target_character.GetName] ищет сторонников, чтобы свергнуть правителя по имени [ROOT.GetCountry.GetGovernment.GetRuler.GetName], а взамен вернуть сословию «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» прежнюю власть и привилегии."
 flavor_por.19.title:0 "[target_character.GetNameWithNoTooltip]"
 flavor_por.50.desc:0 "Поколениями наша корона притягивала к себе рыцарские ордена: их командорства опирались на нашу благосклонность, их магистры держали ответ перед нами. Теперь [GetCountry('PAP').GetGovernment.GetRulerTitle] торжественной буллой подтверждает то, что мы уже сделали явью: вечная власть над Орденом Христа и родственными ему орденами переходит к короне, а [target_character.GetName] и преемники становятся их верховными управляющими."
 flavor_rus.27.entry:0 "Восстание $pugatchev$а"
 flavor_swe.48.title:0 "[birgitta_scope_for_ui.GetNameWithNoTooltip] причислена к лику святых"
 flavor_swe_teu.1.victual_brother_info:0 "Испокон веков пираты чувствуют себя как дома в Балтийском море. Многие моряки и рыбаки из района [target_location.GetName] стремятся встать на путь пиратства и беззакония. Среди них — [target_character.GetName] и его шайка так называемых «равнодольщиков»: теперь они бороздят наши моря под чёрным флагом и стремятся нажить себе состояние, грабя всех несчастных, кому не повезёт с ними повстречаться. Часть этих разбойников, известных как «Виталийские братья», захватила остров [ShowProvinceDefinitionName('gotland_province')] и учредила свою столицу в [ShowLocationName('visby')]. Их бесчинства привели к упадку торговли в этих краях, и если пиратство не прекратится, наша торговля в конце концов окончательно сойдёт на нет."
 flavor_tim.1100.entry:0 "Возвышение Фазлуллаха"
 flavor_tim.5.entry:0 "Посольство в Китай"
 flavor_tle.1.a:0 "К оружию!"
 flavor_tle.1.desc:0 "[ShowRegionName('maghreb_region')] стоит на краю пропасти: [target_siege.GetName] в самом разгаре, а на выручку вот-вот подойдут [tle_scope.GetAdjective]ие войска, так что будущее региона [ShowSubContinentName('north_africa')] может решиться за считаные дни. Выдержит ли [target_location.GetRank.GetName] натиск, который ведёт [mor_ruler.GetName] во главе [mor_ruler.GetHerHis] [mor_scope.GetAdjective]их войск, или [target_location.GetName] падёт, решив судьбу, которую разделят [tle_ruler.GetName] и [tle_ruler.GetHerHis] [tle_scope.GetFlavorRank]?"
 flavor_tle.1.title:0 "[target_war.GetNameWithNoTooltip]"
 flavor_tle.2.desc:0 "[target.GetName], жемчужина области [target.GetArea.GetName], наконец сдаётся нашей могучей армии после долгой осады. [target.GetRank.GetName] открывает ворота, и наши войска устремляются к главной цитадели в надежде на добычу и пленников. [target_country.GetGovernment.GetAdjective]ая семья укрывалась именно там, и наши солдаты быстро схватили многих её членов. [from_country.GetAdjective]ие военачальники уже ждут пленников. Неужели [target_war.GetName] близится к концу?"
 flavor_tle.8.title:0 "[ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]"
 flavor_ven.4.title:0 "«Искусство абака»"
 game_concept_calling_desc:0 "Дело, которому посвящает себя [Concept('religious_order', 'религиозный орден')|e]: молитва, учёность, врачевание или война. Призвание подталкивает орден к определённым [Concept('societal_values', 'общественным ценностям')|e] и решает, что дают его [Concept('holdings', 'владения')|e]. Оно же окрашивает отношения ордена с принимающей его [Concept('country', 'страной')|e]: преданный орден благословляет державу своим призванием, а утративший преданность превращает то же призвание в бремя."
 game_concept_holding_desc:0 "[Concept('location', 'Район')|e], которым владеет [Concept('religious_order', 'религиозный орден')|e], — например, монастырь или капитул. Владение укрепляет район, в котором находится, и служит основой положения ордена в принимающей его [Concept('country', 'стране')|e]. В небольших державах владения весят больше: каждое из них заметнее на фоне всей страны."
 game_concept_religious_order_desc:0 "Братство, посвятившее себя служению [Concept('religion', 'религии')|e]. Оно может распространяться на многие [Concept('countries', 'державы')|e] и не подчиняется ни одному правителю. Орден живёт и гибнет вместе со своим [Concept('zeal', 'рвением')|e], следует [Concept('calling', 'призванию')|e], определяющему его поведение, и основывает [Concept('holdings', 'владения')|e] в [Concept('locations', 'районах')|e], расширяя своё присутствие. Его [Concept('religious_order_standing_short', 'влияние')|e] там, где он укоренился, — во благо или во вред — зависит от того же [Concept('zeal', 'рвения')|e]."
 game_concept_unit_formation_preference_desc:0 "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
 game_concept_zeal_desc:0 "Жизненная сила [Concept('religious_order', 'религиозного ордена')|e]. Каждый месяц рвение стремится к цели, которую задают [Concept('holdings', 'владения')|e] ордена и его положение в землях, где он действует; орден, чьё рвение иссякло, распускается. Ревностный орден обладает большим [Concept('religious_order_standing_short', 'влиянием')|e] везде, где действует, и воспитывает куда более способных вождей, а угасший — лишь слабых."
 gaude_mater_polonia:0 "Гимн «Gaude Mater Polonia»"
 generic_war_goal_independence:0 "Освобождение державы [COUNTRY.GetNameWithNoTooltip]"
 grand_embassy.18.desc:0 "Купец, который когда-то, много лет назад и в более счастливые времена, торговал в державе [ROOT.GetCountry.GetName], проходит мимо делегации на улице и замирает на полушаге: его взгляд на миг дольше, чем следовало бы, задерживается на лице того, кого зовут [target_ruler.GetName], — после чего купец молча спешит прочь. Ошибиться в мелькнувшем на нём выражении невозможно: это не праздное любопытство, а внезапное, ошеломлённое узнавание. Он точно знает, кого увидел, и оставит ли он это при себе — от нас никак не зависит."
 grand_embassy.3.title:0 "Делегация при дворе"
 grand_embassy.9.desc:0 "В державе [embassy_country.GetName] хранитель счетов проводит нас по книгам учёта и податным спискам, благодаря которым работает казна. Испачканные чернилами пальцы без малейших колебаний скользят по каждому столбцу, а итоги, кажется, никогда не лгут. Счетовод записывает каждую сумму дважды — один раз как причитающуюся, другой как уплаченную, — чтобы ни одна монета не ускользнула незамеченной, и ещё до конца недели сверяет записи с портовыми описями грузов. Здесь есть чему поучиться — тем, кто готов заплатить за время счетовода и кому хватит терпения проследить за методом до конца."
 grand_tour_events.19.knowledge:0 "Изучим надписи, напоминающие о том, что этот [target_location.GetRank.GetNameWithNoTooltip] основали [ShowCultureNameWithNoTooltip('greek_culture')]ие переселенцы."
 grand_tour_events.5.title:0 "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.7.experience:0 "Осмотрим герцогский арсенал и шлюзы на каналах, которыми гордится этот [target_location.GetRank.GetNameWithNoTooltip]."
 has_unlocked_bureaucracy_via_flavor_byz_31_tt:0 "Мы разблокировали этот [Concept('bureaucracy', 'бюрократический механизм')|e] благодаря [Concept('decision', 'решению')|e] «[ShowDecisionName('byz_army_reform_decision')]»"
 has_unlocks_formalize_relations_action:0 "Открыто [Concept('diplomatic_action', 'дипломатическое действие')|e] «[ShowCountryInteractionName('formalize_relations')]» благодаря [Concept('decision', 'решению')|e] «$fra_formalized_relations_decision.title$»."
 holy_war.27.a.tt:0 "Держава [desertion_member.GetName] приняла взятку и покинула «[desertion_io.GetName]»"
 holy_war.39.a:0 "Благодарение Богу!"
 holy_war.6.a.muslim:0 "#italic Аллаху акбар#!."
 iberian_culture.10.desc:0 "В последнее время лекари-мудехары завоёвывают широкую славу всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всё больше полагаются на их искусство. Некоторые советники предлагают официально назначить их придворными лекарями — пусть их услугами пользуется [ROOT.GetCountry.GetGovernment.GetCourtTitle]; однако влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] решительно против."
 ibn_khaldun_hit_the_road_tt:0 "[target_character.GetNameWithNoTooltip] переезжает в державу [target_country_2.GetLongNameWithNoTooltip]"
 icon_name_0:0 "$ADJECTIVE|U$ая икона: св. $SAINT|U$"
 icon_name_1:0 "Икона: св. $SAINT|U$ ($ADJECTIVE|U$ая школа)"
 independence_overlord:0 "$game_concept_overlord$"
 invite_foreign_cleric_tt:0 "[Concept('character', 'Персонаж')|e] из сословия «[ShowEstateTypeName('clergy_estate')]» выбранной [Concept('country', 'страны')|e] прибудет к нашему [Concept('court', 'двору')|e], что улучшит [Concept('opinion', 'мнение')|e] между нами"
 invite_religious_order_desc:0 "Предоставить один из наших [Concept('locations', 'районов')|e] ордену нашей религии в качестве нового [Concept('holding', 'владения')|E]. Новое [Concept('holding', 'владение')|e] поднимает цель [Concept('zeal', 'рвения')|e] ордена, укрепляя его позиции в наших землях."
 invite_religious_order_effect_tt:0 "Выбранный район перейдёт в собственность ордена и поднимет цель его [Concept('zeal', 'рвения')|e] в наших землях. Само владение в течение следующих месяцев укрепит присутствие ордена здесь."
 kirishitan.10.a:0 "#italic Слава Господу#!."
 laborers_and_peasants_happy_tt:0 "$laborers$ и $peasants$ в районе [target_location.GetName] получают [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 lesson_basics_wrap_up_2b:0 "Советы 2b"
 local_governor_dlc_tt:0 "Совокупное число сооружений «[ShowBuildingTypeName('local_governor')]» и «[ShowBuildingTypeName('itinerant_court_seat')]» в державе [SCOPE.sCountry('actor').GetNameWithNoTooltip] меньше [SCOPE.sCountry('actor').GetModifierValue('num_local_governors')] (домов местных губернаторов: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('local_governor')|V], престолов странствующего двора: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('itinerant_court_seat')|V])"
 lon_principado_de_asturias:0 "Княжество Астурийское"
 maghrebi_culture.10.desc:0 "Район [target_location.GetName] лежит на одном из многочисленных торговых путей области [ShowAreaName('desert_area')], и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] издавна делают здесь остановку. Однако в последние годы, под защитой державы [ROOT.GetCountry.GetName], [target_location.GetRank.GetName] заметно вырос в значении: многие торговцы предпочитают останавливаться именно здесь, ведь путешествовать по [ROOT.GetCountry.GetAdjective]им землям безопасно. Возросшее значение принесло району [target_location.GetNameWithNoTooltip] широкую известность по всей Сахаре, но и легло на [target_location.GetRank.GetNameWithNoTooltip] тяжким бременем.\n\nЧтобы [target_location.GetRank.GetNameWithNoTooltip] и впредь оставался влиятельным торговым узлом, [ROOT.GetCountry.GetGovernment.GetCourtTitle] просит: пусть [our_ruler.GetName] выделит средства, без которых [target_location.GetRank.GetNameWithNoTooltip] не справится с растущим потоком торговцев."
 maghrebi_culture.13.desc:0 "Хотя [ROOT.GetCountry.GetLongName] уже давно признаёт [ShowCultureName('tunisian')]ий сюзеренитет, [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetNameWithNoTooltip] по большей части сохраняет самостоятельность. Однако недавно [target_character.GetName] [Select_CString(target_character.IsFemale, 'совершила', 'совершил')] несколько вылазок на исконные [ROOT.GetCountry.GetCulture.GetName]ие земли, и по всей державе [ROOT.GetCountry.GetNameWithNoTooltip] начались волнения. Многие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] требуют немедленно изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip], хотя такое изгнание наверняка разгневает державу [target_country.GetName]."
 maghrebi_culture.7.desc:0 "Хотя в регионе [ShowRegionName('maghreb_region')] немало плодородных земель, близость области [ShowAreaName('desert_area')] делает многие его уголки суровыми и неприветливыми.\n\nЖители района [target_location.GetName] просят выделить средства на постройку сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]»: [target_location.GetRank.GetName] надеется так смягчить самые тяжёлые условия жизни."
 maghrebi_culture.9.desc:0 "С тех пор как в одиннадцатом веке при поддержке Фатимидов многие [ShowCultureName('bedouin_culture')]ие племена переселились в регион [ShowRegionName('maghreb_region')], многим коренным [ShowCultureGroupName('amazigh_group')]им народам пришлось признать власть этой набирающей силу [ShowCultureGroupName('arabic_group')]ой элиты. Хотя под властью державы [ROOT.GetCountry.GetName] многие [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие народы сохранили самостоятельность, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить в державу [ROOT.GetCountry.GetNameWithNoTooltip] часть этой элиты: пусть [ShowCultureGroupNameWithNoTooltip('arabic_group')]ие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] придадут нашей власти законность. Однако такое приглашение наверняка разгневает [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]."
 marry_lowborn_close_relative_tt:0 "Близкий родственник [Concept('ruler', 'правителя')|e] или [Concept('heir', 'наследника')|e], если правитель — [Concept('regent', 'регент')|e]"
 marry_noble_act_past:0 "Брак со знатным человеком для персонажа [CHARACTER.GetName] — выгодный способ обеспечить нашей [Concept('country', 'державе')|e] престолонаследие без чужеземного влияния!"
 marry_noble_desc_specific:0 "[CHARACTER.GetName] вступит в брак с персонажем [TARGET_CHARACTER.GetName]."
 marry_noble_past:0 "[CHARACTER.GetName] вступает в брак!"
