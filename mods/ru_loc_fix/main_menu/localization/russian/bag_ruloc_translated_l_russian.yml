 nav_appanage_support_for_french_throne_tt:0 "Если [ROOT.GetCountry.GetNameWithNoTooltip] — апанаж, то при отношениях #G +150#! с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
 nav_appanage_willingness_to_join_tt:0 "Если наши отношения с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] достигнут #G +150#!, они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] за престол"
 nav_will_be_able_to_rally_other_appanages_tt:0 "Если наши отношения с каким-либо апанажем, которым владеет [GetCountry('FRA').GetName], достигнут #G 150#!, он охотнее поддержит нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
 navarre_charles_ii_claim_to_france.desc:0 "Пусть [GetCharacter('nav_jeanne_ii_capet').GetName] и отреклась, и [GetCharacter('nav_jeanne_ii_capet').GetHerHis] притязания на престол державы [GetCountry('FRA').GetNameWithNoTooltip] угасли, [GetCharacter('nav_charles_ii_evreux').GetName] — прямой потомок старого короля по крови: его предок — [GetCharacter('fra_louis_x_capet').GetName]. И даже если [ShowHeirSelectionName('salic_law')] неправедно объявит, что [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] не может наследовать, права, которые имеет [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip], всё равно сильнее, чем у нынешних правителей державы [GetCountry('FRA').GetNameWithNoTooltip]!"
