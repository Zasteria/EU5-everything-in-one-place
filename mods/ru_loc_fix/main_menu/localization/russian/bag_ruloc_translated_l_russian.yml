 purging_entrenched_cabinet_member_tt:0 "Поскольку [target_character.GetName] — [ShowModifier('entrenched_cabinet_member')], эффект значительно сильнее"
 reform_taxation_system_action_progress_tooltip:0 "Реформа налоговой системы завершится через [cabinet.GetDaysUntilFullyImplemented]"
