 cultural_event.15.b:0 "Мы останемся теми, кем были всегда."
 cultural_event.15.desc:0 "Держава [unifying_country.GetLongName] сплотила народы [merged_group.GetName]ой группы в единый [new_merged_culture.GetName]ий народ, и теперь её посланники стоят перед нами. Они призывают нас отбросить былые распри и принять [new_merged_culture.GetName]ое имя, чтобы мы разделили с ними один народ и одну судьбу. Отречься от того, кем были наши предки, — дело нешуточное."
