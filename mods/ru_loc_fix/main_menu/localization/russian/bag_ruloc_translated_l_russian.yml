 game_concept_ambition:0 "Амбиция"
 game_concept_ambition_definition:0 "Тип амбиции"
 game_concept_ambition_definition_desc:0 "<Вставьте описание типа добавляемого объекта>"
 game_concept_ambition_definitions:0 "Типы амбиций"
 game_concept_ambition_desc:0 "<Добавьте описание конкретного объекта, когда он станет активен>"
 game_concept_ambition_modifier:0 "Модификатор амбиции"
 game_concept_ambition_modifier_desc:0 "[Concept('modifier', 'Модификатор')|e], относящийся к [Concept('ambition', 'амбиции')|e]. Действует всё время, пока мы стремимся осуществить эту амбицию."
 game_concept_ambition_modifiers:0 "Модификаторы амбиций"
 game_concept_ambitions:0 "Амбиции"
 game_concept_calling_desc:0 "Дело, которому посвящает себя [Concept('religious_order', 'религиозный орден')|e]: молитва, учёность, врачевание или война. Призвание подталкивает орден к определённым [Concept('societal_values', 'общественным ценностям')|e] и решает, что дают его [Concept('holdings', 'владения')|e]. Оно же окрашивает отношения ордена с принимающей его [Concept('country', 'страной')|e]: преданный орден благословляет державу своим призванием, а утративший преданность превращает то же призвание в бремя."
 game_concept_holding_desc:0 "[Concept('location', 'Район')|e], которым владеет [Concept('religious_order', 'религиозный орден')|e], — например, монастырь или капитул. Владение укрепляет район, в котором находится, и служит основой положения ордена в принимающей его [Concept('country', 'стране')|e]. В небольших державах владения весят больше: каждое из них заметнее на фоне всей страны."
 game_concept_industry_promotion_desc:0 "Поддержка отрасли закрепляет одну [Concept('area', 'область')|e] за одной отраслью промышленности. Каждая отрасль охватывает набор [Concept('goods', 'товаров')|e]: её поддержка повышает [Concept('output', 'объём выпуска')|e] каждого [Concept('building', 'сооружения')|e] в этой [Concept('area', 'области')], производящего эти [Concept('goods', 'товары')], а также повышает спрос ваших [Concept('pops', 'групп населения')|e] на них по всей [Concept('country', 'державе')|e].\n\nДля поддержки отраслей требуется [Concept('advance', 'улучшение')|e] [advance_icon][ShowAdvanceName('industry_promotion_advance')]. Сколько отраслей можно поддерживать одновременно, определяет показатель «$MODIFIER_TYPE_NAME_possible_industry_promotions$»; он растёт вместе с рангом [Concept('country', 'державы')], а также благодаря вашим [Concept('government_reforms', 'государственным принципам')|e] и последующим [Concept('advances', 'улучшениям')]. Поддержку можно отменить в любой момент, чтобы освободить ячейку."
 game_concept_industry_promotions:0 "Поддержка отраслей"
 game_concept_location_rank_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_capital_list_title:0 "[Concept('capital', 'Столицы держав')|e]"
 game_concept_location_rank_list_title:0 "Обычные районы"
 game_concept_location_rank_province_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_province_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_province_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_province_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_province_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_province_capital_list_title:0 "[Concept('province_capital', 'Столицы провинций')|e]"
 game_concept_location_rank_upper_desc:0 "У каждого [Concept('location', 'района')|e] свой ранг: район может быть [Concept('urban_location', 'городским')|e] или [Concept('rural_location', 'сельским')|e].\n\nЦвет значка ранга показывает, является ли [Concept('location', 'район')] столицей."
 game_concept_private_regiment:0 "Частный полк"
 game_concept_private_regiment_desc:0 "Частный полк — это [Concept('regiment', 'полк')|e], который [Concept('estate', 'сословие')|e] набирает и содержит в собственной частной армии, не расходуя наше [Concept('manpower', 'число рекрутов')|e]. Мы можем призвать такие полки к себе на службу, а после роспуска они возвращаются к сословию, а не пополняют наш запас рекрутов. Сословие, поднявшее восстание, отзывает все частные полки, которые нам одолжило."
 game_concept_private_regiments:0 "Частные полки"
 game_concept_promote_industry:0 "Поддержать отрасль"
 game_concept_religious_order_desc:0 "Братство, посвятившее себя служению [Concept('religion', 'религии')|e]. Оно может распространяться на многие [Concept('countries', 'державы')|e] и не подчиняется ни одному правителю. Орден живёт и гибнет вместе со своим [Concept('zeal', 'рвением')|e], следует [Concept('calling', 'призванию')|e], определяющему его поведение, и основывает [Concept('holdings', 'владения')|e] в [Concept('locations', 'районах')|e], расширяя своё присутствие. Его [Concept('religious_order_standing_short', 'влияние')|e] там, где он укоренился, — во благо или во вред — зависит от того же [Concept('zeal', 'рвения')|e]."
 game_concept_unit_families:0 "Семейства войск"
 game_concept_unit_family:0 "Семейство войск"
 game_concept_unit_family_desc:0 "Некоторые [Concept('unit_types', 'типы войск')|e] объединены в семейства, и у всех членов одного семейства общий лимит найма. Улучшение отряда до более нового члена того же семейства никогда не занимает дополнительного места, поэтому лимит ограничивает, сколько таких отрядов вы можете выставить всего, а не сколько отрядов каждой [Concept('age', 'эпохи')|e]."
 game_concept_unit_formation_preference_desc:0 "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
 game_concept_zeal_desc:0 "Жизненная сила [Concept('religious_order', 'религиозного ордена')|e]. Каждый месяц рвение стремится к цели, которую задают [Concept('holdings', 'владения')|e] ордена и его положение в землях, где он действует; орден, чьё рвение иссякло, распускается. Ревностный орден обладает большим [Concept('religious_order_standing_short', 'влиянием')|e] везде, где действует, и воспитывает куда более способных вождей, а угасший — лишь слабых."
 game_timeline_country_map_struct:0 "#TOOLTIP:TIMELINE_COUNTRY_MAP,$DESC_KEY$,$MAP_SIZE$,$OWNER_KEY$ X#!"
 game_unit_family_struct:0 "#TOOLTIP:UNITFAMILY,$DESC_KEY$ $KEY_LOC|L$#!"
 gaude_mater_polonia:0 "Гимн «Gaude Mater Polonia»"
 generic_war_goal_independence:0 "Освобождение державы [COUNTRY.GetNameWithNoTooltip]"
 golden_age_of_piracy_brethren_crushed:0 "Пиратское братство разгромлено"
 golden_age_of_piracy_era_ends:0 "Золотой век угасает"
 golden_age_of_piracy_era_ends_desc:0 "Если независимая пиратская держава всё ещё располагает сильнейшим флотом среди своих собратьев, она получает модификатор «[ShowModifier('great_pirate_state_modifier')]», а её правитель остаётся в памяти как выдающийся администратор, дипломат и полководец."
 grand_embassy.18.desc:0 "Купец, который когда-то, много лет назад и в более счастливые времена, торговал в державе [ROOT.GetCountry.GetName], проходит мимо делегации на улице и замирает на полушаге: его взгляд на миг дольше, чем следовало бы, задерживается на лице того, кого зовут [target_ruler.GetName], — после чего купец молча спешит прочь. Ошибиться в мелькнувшем на нём выражении невозможно: это не праздное любопытство, а внезапное, ошеломлённое узнавание. Он точно знает, кого увидел, и оставит ли он это при себе — от нас никак не зависит."
 grand_embassy.3.title:0 "Делегация при дворе"
 grand_embassy.9.desc:0 "В державе [embassy_country.GetName] хранитель счетов проводит нас по книгам учёта и податным спискам, благодаря которым работает казна. Испачканные чернилами пальцы без малейших колебаний скользят по каждому столбцу, а итоги, кажется, никогда не лгут. Счетовод записывает каждую сумму дважды — один раз как причитающуюся, другой как уплаченную, — чтобы ни одна монета не ускользнула незамеченной, и ещё до конца недели сверяет записи с портовыми описями грузов. Здесь есть чему поучиться — тем, кто готов заплатить за время счетовода и кому хватит терпения проследить за методом до конца."
 grand_embassy.discretion_down_4_tt:0 "Проблеск узнавания (#R -4#! Скрытность)"
 grand_tour_events.19.knowledge:0 "Изучим надписи, напоминающие о том, что этот [target_location.GetRank.GetNameWithNoTooltip] основали [ShowCultureNameWithNoTooltip('greek_culture')]ие переселенцы."
