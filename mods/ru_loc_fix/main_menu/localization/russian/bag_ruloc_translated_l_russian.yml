 target_order_religious_zeal_desc:0 "[Concept('zeal', 'Рвение')|e] ордена «[target.GetName]»"
 teotihuacan_temple_holy_site:0 "Священный город Теотиуакан"
 teotihuacan_temple_work_of_art:0 "Храмовый комплекс ($ORIGIN$)"
 teotihuacan_temple_work_of_art_desc:0 "Храм Солнца в Теотиуакане, построенный около 200 г. н. э., — одна из крупнейших пирамид доколумбовой Америки. Он расположен в самом сердце древнего города, недалеко от современного Мехико, был ориентирован по астрономическим явлениям и играл ключевую роль в обрядовой жизни Мезоамерики. Это сооружение из вулканического камня, покрытого штукатуркой, утверждало политическое и религиозное превосходство Теотиуакана и выглядело настолько величественно, что повлияло на более поздние цивилизации, в том числе на ацтеков, почитавших его как святыню."
 thalassocracy_events.1.a:0 "Наша морская держава будет процветать!"
 thalassocracy_events.1.b:0 "Нам придётся смириться с собственной неудачей."
 thalassocracy_events.1.desc_failure:0 "После долгих лет мучительных споров о деньгах на флот нам придётся оставить мечты о власти над морями. Без сильного флота, который подкреплял бы наши притязания на талассократию, мы не сможем защитить свои воды ни от соперников, ни от каперов."
 thalassocracy_events.1.desc_success:0 "Стремительное усиление нашего флота увенчалось блестящим успехом! Множество новых и перестроенных кораблей, на которых служат умелые моряки, без сомнения, вселит страх в сердца наших соперников и врагов. Отныне ни коварные пираты, ни эскадры под враждебными знамёнами не помешают нашему господству на волнах. Когда морские пути надёжно защищены, нам будет куда проще управлять далёкими берегами и простирать свою власть за моря."
 thalassocracy_events.1.title:0 "Плоды наших трудов"
 the_revolution_revolutionary_wave_spent:0 "Революционный пыл угасает"
 tle_rules_for_zayyanid_pretenders:0 "Если в течение любого из следующих #Y 20#! лет [target_country.GetName] не сумеет удержать [Concept('subject_loyalty', 'лояльность ленника')|e] [from_country.GetLongName] выше #Y 30#!, то [from_country.GetName] сможет объявить [Concept('war', 'войну')|e] — [ShowCasusBelliName('cb_independence_war')] — с помощью [Concept('decision', 'решения')|e] [ShowDecisionName('zayyanid_pretenders_decision')]"
 topography_equal:0 "[Concept('topography', 'Рельеф')|e] — «[TARGET_TOPOGRAPHY.GetName]»"
 treasure_fleet_events.25.desc:0 "Дозорные замечают парус на горизонте: это богато гружённый торговый флот, бороздящий те же воды, что и наш. $expedition_leader_name$ велит капитанам встретить его с миром, и начинается бойкий обмен: [ShowGoodsName('silk')] в отрезах и тонкий [ShowGoodsName('porcelain')] идут в обмен на пряности, самоцветы и диковины южных морей.\n\n$expedition_name_treasure_voyage$ идёт дальше с потяжелевшими трюмами."
 treasure_fleet_events.30.desc:0 "Пока флот стоит на якоре у [target_stop.GetName], местный двор устраивает большой пир в честь гостей, ведь в гавань пришла сама $expedition_name_treasure_voyage$. Перед гостями играют музыканты, пляшут танцоры, подают яства ста видов; $expedition_leader_name$ и капитаны в ответ подносят положенные по обычаю дары и превозносят величие, которым славится [GetInternationalOrganization('middle_kingdom').GetName].\n\nСлава о том, сколь достойно держится флот на чужбине, непременно дойдёт до родины."
 treasure_fleet_events.31.desc:0 "[target_stop.GetName] — порт, чьи рынки ломятся от чудес, неведомых в наших землях: птицы в клетках немыслимых окрасок, невиданные звери, ароматная древесина и самоцветы чужеземной огранки. Купцы, которых везёт $expedition_name_treasure_voyage$, могли бы набить целый трюм диковинками, от которых [ROOT.GetCountry.GetGovernment.GetRulerTitle] придёт в восторг, — но ради этого придётся расстаться с частью золота, отложенного на дары.\n\nОткроем ли мы сундуки?"
 treasure_fleet_events.31.title:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] и заморские диковинки"
 treasure_fleet_events.32.desc:0 "В порту [target_stop.GetName] среди тесных складов, где хранилась часть товаров флота, вспыхивает пожар. Моряки, которых привела сюда $expedition_name_treasure_voyage$, встают в цепочки с вёдрами, но пламя успевает поглотить ящики, где лежали [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')], отложенные на дары."
 treasure_fleet_events.4.desc:0 "В один из южных портов зашла джонка с вестями: донесение шлёт $expedition_name_treasure_voyage$. Флот, который ведёт $expedition_leader_name$, достиг гавани [port_location.GetName] в державе [port_country.GetName], где его по всем правилам принимает [port_country.GetGovernment.GetCourtTitle]. Наши посланники обменялись товарами, а [port_country.Custom('GetRulerOrRegentTitle')] принимает от них положенные по обычаю дары. Летописец флота сообщает, что ветер и время года благоприятствуют следующему этапу пути. Как замечает капитан, [ROOT.GetCountry.GetGovernment.GetCourtTitle] пока может не ждать дурных вестей."
 treasure_fleet_events.54.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] узнаёт, что при дворе державы [insulting_court.GetName] посланников, которых доставила $expedition_name_treasure_voyage$, встретили не с тем почтением, какого заслуживает [GetInternationalOrganization('middle_kingdom').GetName], а с открытым презрением, — и [insulting_court.GetGovernment.GetRulerTitle] даже не думает заглаживать обиду.\n\n$expedition_leader_name$ ждёт нашего слова. Ответим ли мы на такое пренебрежение или нам не пристало его замечать?"
 treasure_fleet_events.55.desc:0 "Донесения, которые получает [ROOT.GetCountry.GetGovernment.GetCourtTitle], несут неожиданные вести. Вдали от дома $expedition_leader_name$ бросает оружие и сокровища, что везёт $expedition_name_treasure_voyage$, на поддержку правителя державы [country_at_war_with.GetName], которую ныне раздирает война за престол.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] встречает эту новость по-разному. Одни дивятся тому, как далеко простирается ныне влияние, которым обладает [GetInternationalOrganization('middle_kingdom').GetName]. Другие ворчат, что распри далёких царств нас не касаются."
 treasure_fleet_events.56.desc:0 "$expedition_name_treasure_voyage$ шлёт весть: $expedition_leader_name$ отдаёт императорских воинов в помощь принимающему двору в его войне. [target_country.GetName], увидев наших людей в рядах противника, отныне числит [GetInternationalOrganization('middle_kingdom').GetName] среди своих врагов.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] не может прийти к единому мнению. Для одних это доказательство того, что рука трона дотягивается ныне даже до другого края света. Для других — ненужный враг, нажитый в войне, которая никогда не была нашей."
 treasure_fleet_events.57.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает тяжёлые вести. При дворе державы [contemptuous_court.GetName] посланников, которых доставила $expedition_name_treasure_voyage$, встретили с таким неприкрытым презрением, что флот, который ведёт $expedition_leader_name$, снялся с якоря и покинул их воды: положенные по обычаю любезности нам швырнули в лицо.\n\nЛетописец флота сделал в своей книге запись: [contemptuous_court.GetNameWithNoTooltip] — среди тех, кто оскорбил [GetInternationalOrganization('middle_kingdom').GetName]. Запомним ли мы это оскорбление или простим?"
 treasure_fleet_events.58.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает радостную весть. Воодушевлённый тем, что поблизости находится $expedition_name_treasure_voyage$, двор державы [avenging_court.GetName] поднял оружие против нашего обидчика: это [target_country.GetName], та самая держава, что некогда встретила наших посланников презрением.\n\nВидно, гнев Небес не нуждается в императорской армии, чтобы дать о себе знать. Влияние, которым обладает [GetInternationalOrganization('middle_kingdom').GetName], простирается даже на войны далёких царей."
 treasure_fleet_events.59.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает донесения о процветающей общине наших соотечественников в далёком порту [diaspora_port.GetName]. Купцы и моряки, осевшие там много поколений назад, взяли в жёны местных женщин и разбогатели, а теперь к этим далёким родичам пришла $expedition_name_treasure_voyage$, и $expedition_leader_name$ протягивает им руку.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] встречает эту новость по-разному. Одни преисполнены гордости оттого, что [GetInternationalOrganization('middle_kingdom').GetName] оставило свою кровь в каждом порту южных морей. Другие хмурятся при мысли о подданных, что обосновались так далеко от могил своих предков."
 treasure_fleet_events.60.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] узнаёт о досадном происшествии при дворе державы [offended_court.GetName]. По незнанию обрядов чужой веры наш посланник — $expedition_leader_name$ — нанёс хозяевам тяжкое оскорбление, и теперь [offended_court.GetGovernment.GetRulerTitle] требует, чтобы он загладил вину.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] колеблется. Одни полагают, что посланники, которых шлёт [GetInternationalOrganization('middle_kingdom').GetName], не обязаны склоняться перед чужими алтарями. Другие опасаются, что подобная небрежность запятнает наше имя в каждом порту, который ещё ждёт впереди."
 treasure_fleet_expedition_outcome_overview:0 "$BULLET$Флот отправляется в путь с грузом даров, оплаченных из нашей казны.\n$BULLET$Если экспедиция благополучно вернётся, всё неизрасходованное станет [Concept('gold', 'дукатами')|e], и вдобавок мы получим #G +10#! [Concept('prestige', 'престижа')|e].\n$BULLET$Каждый иноземный двор к тому же реагирует по-своему:\n$BULLET_WITH_TAB$Двор, радушно принявший нас, даёт ещё #G +5#! [Concept('prestige', 'престижа')], может стать нашим данником в организации «[GetUniqueInternationalOrganization('middle_kingdom').GetName]» и присылает дань и редкие дары, которые обогатят наш [Concept('market', 'рынок')|e].\n$BULLET_WITH_TAB$Двор, отказавшийся стать данником, вместо этого получает модификатор «[ShowModifier('chi_resisting_subjugation')]», а наше взаимное [Concept('opinion', 'мнение')|e] снижается на #R -50#!."
