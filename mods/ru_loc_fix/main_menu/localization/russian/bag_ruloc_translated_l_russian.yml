 ach_greek_populace_decision.desc:0 "С тех пор как [ShowScriptedGeographyName('greece_geography')] оказалась под [GetCountry('LAT').GetAdjective]им владычеством, прежняя [ShowCultureName('greek_culture')]ая элита пришла в упадок, однако кое-где в стране члены старых [ShowCultureNameWithNoTooltip('greek_culture')]их семейств сумели удержаться у власти, пойдя на компромисс с латинским сословием «[GetEstateName('nobles_estate')]». Но с падением державы «[GetCountry('LAT').GetLongNameWithNoTooltip]» [ShowCultureNameWithNoTooltip('greek_culture')]ое население всё упорнее противится латинскому владычеству.\n\nСтремясь упрочить своё правление, монарх пригласил ко двору представителей уцелевших [ShowCultureNameWithNoTooltip('greek_culture')]их семейств, чтобы выработать компромисс. Однако часть латинского сословия «[GetEstateNameWithNoTooltip('nobles_estate')]» вместо этого добивается дальнейшего расширения своих прав над [ShowCultureNameWithNoTooltip('greek_culture')]им населением, утверждая, что более сильная латинская элита сумеет подавить [ShowCultureNameWithNoTooltip('greek_culture')]ие волнения."
 ach_pope_proposes_latin_restoration.desc:0 "Наши походы не остались незамеченными: [ShowScriptedGeographyName('greece_geography')] стала ареной наших побед, и растущая мощь нашей державы привлекла внимание папского престола.\n\nПризнавая за нами статус «[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]», папа обещает, что [GetCountry('PAP').GetNameWithNoTooltip] окажет нам финансовую и политическую поддержку, если мы согласимся помочь ему в примирении [ShowReligionAdjective('catholic')]ой и [ShowReligionAdjective('orthodox')]ой церквей.\n\nКроме того, папа настаивает: если [ShowLocationName('constantinople')] вновь окажется в наших руках, трагедия, которую Четвёртый крестовый поход обрушил на [ShowLocationNameWithNoTooltip('constantinople')], не должна повториться."
 ara_all_our_sons_will_join_the_order_tt:0 "Каждый [Concept('child', 'сын')|e] персонажа [target_character.GetName] вступит в [Concept('chivalric_order', 'рыцарский орден')|e] «[ShowChivalricOrderName('order_of_the_jar')]»"
 ara_explain_coronation_in_zaragoza_mechanic_tt:0 "Будущие [Concept('rulers', 'правители')|e] будут получать [Concept('modifier', 'модификатор')|e] «[ShowModifier('ara_official_coronation')]», пока [ShowLocationName('zaragoza')] остаётся в наших руках; в противном случае они получат [Concept('modifier', 'модификатор')|e] «[ShowModifier('ara_lack_of_coronation')]»"
 ara_sindicat_remenca_decision.desc:0 "Дворянство державы [ROOT.GetCountry.GetLongName] начало неукоснительно следить за соблюдением правил, привязывающих крестьян к земле, а вкупе с ужесточением сеньориальных прав в целом это вызвало среди крестьян волнения. Беднейшие из них горячо ратуют за открытый мятеж, тогда как более зажиточные предпочитают просить нас о реформах и об отмене сеньориальных злоупотреблений.\n\nЭто прекрасная возможность заручиться поддержкой крестьян, ведь мы ведём непрестанную борьбу за власть с дворянством. Звучат предложения позволить крестьянам основать [ShowEstatePrivilegeName('ara_sindicat_remenca')] — крестьянскую гильдию, своего рода первый трудовой союз, — что даст им больше свободы."
 ara_we_will_unlock_coronation_deicision_tt:0 "Мы сможем воспользоваться [Concept('decision', 'решением')|e] «[ShowDecisionName('ara_coronate_ruler')]», когда [ShowLocationName('zaragoza')] снова будет в наших руках"
 aragon_ruler_brother_fleeing_tt:0 "Брат правителя бежал"
 artis_magnae_artilleriae:0 "«Великое искусство артиллерии»"
 ask_clergy_for_legitimacy_ruler_tt:0 "Правитель ещё не получал одобрения"
