 war_of_religions_peace_of_westphalia:0 "Вестфальский мир"
 war_of_religions_peace_of_westphalia_desc:0 "Война заканчивается без победителя: [GetUniqueInternationalOrganization('hre').GetName] получает долговременный удар по имперской власти и принимает политику, признающую законными все христианские вероисповедания в своих границах."
 war_of_religions_religious_supremacy_imposed:0 "Религиозное господство установлено"
 war_of_religions_religious_supremacy_imposed_desc:0 "Побеждённая сторона получает тяжёлый удар по [Concept('stability', 'стабильности')|e] и резко смещается к ценности «[ShowSocietyDirectionName('aristocracy')]», а [GetUniqueInternationalOrganization('hre').GetName] делает веру победителя своей имперской религиозной политикой."
 war_of_the_roses.18.title:0 "[ShowDisasterNameWithNoTooltip('war_of_the_roses')] разгорается"
 western_ocean_voyage_events.1.a:0 "Вперёд, что бы ни таил океан. Мы найдём это первыми."
 western_ocean_voyage_events.1.columbus:0 "[target_leader.GetNameWithNoTooltip] уверяет: по точным расчётам — три тысячи миль, не больше."
 western_ocean_voyage_events.1.desc:0 "Корабли глубоко сидят в воде: их снарядили в плавание, к которому не готовит ни одна карта. Уже много месяцев [ROOT.GetCountry.GetGovernment.GetCourtTitle] выслушивает [target_leader.GetHisHer] доводы: [target_leader.GetName] уверяет, что океан на западе не так широк, как полагают учёные, и что решительный флот вполне способен добраться до Индий.\n\nУчёные мужи по-прежнему не убеждены. Моряки встревожены. Но ветер попутный, начинается отлив, и остаётся лишь отдать швартовы."
 western_ocean_voyage_events.2.desc:0 "Счастливые острова, как называли их древние, лежат на самом краю всех карт, что есть у нас на борту. Наша стоянка — [ShowLocationName('northern_fuerteventura_coast')], а дальше у океана нет ни имён, ни промеренных глубин, ни очерченных берегов. Здешние рыбаки говорят, что перед бурей порой видят птиц, летящих с запада. [target_leader.GetName] считает это знаком того, что за горизонтом лежит земля. Команда — знаком бури.\n\nМы запасаемся пресной водой, солониной и сухарями. На закате люди смотрят, как море становится золотым, а потом темнеет."
 western_ocean_voyage_events.3.desc:0 "Хлеб плесневеет. Бочки с водой смердят. Трое слегли в лихорадке. Нынче утром [target_leader.GetName] принимает выборных от команды, и требование у них простое: они достаточно плыли на запад, не видели ничего, кроме открытого моря, и намерены повернуть на восток, хочет того [target_leader.GetNameWithNoTooltip] или нет.\n\nНи в одной стороне не видно земли. Нет ничего — лишь ветер в корму, что занёс их так далеко и ни за что не понесёт обратно."
 western_ocean_voyage_events.4.a:0 "Водрузить флаг. Что бы это ни была за земля, она принадлежит нам."
 western_ocean_voyage_events.4.b:0 "Это не похоже ни на одно описание Индий. Пока ни на что не притязать."
 western_ocean_voyage_events.4.columbus:0 "Водрузить знамя. [target_leader.GetShortNameWithNoTooltip] не сомневается: это Индии."
 western_ocean_voyage_events.4.desc:0 "Перед самым рассветом с марса доносится крик. Затем ещё один, громче. И вот уже кричит вся палуба.\n\nНа горизонте — очертания. Сначала низкие, не более чем потемнение неба, но с рассветом сомнений не остаётся: деревья, береговая линия, зелёные холмы над тихой водой. Море вокруг кораблей из тёмно-синего стало зелёным, а потом бледно-бирюзовым. Над головой кружат невиданные птицы. Мимо борта проплывают ветви с незнакомой листвой.\n\n[target_leader.GetName] стоит на носу и долго молчит.\n\nКогда лодки причаливают, островитяне уже собрались на берегу поглядеть на пришельцев, и у некоторых в носу видны маленькие золотые украшения. На вопрос, заданный скорее жестами, чем словами, — откуда это золото, — они указывают вглубь острова, а некоторые — на юг, в сторону холмов, которых отсюда не видит никто из команды."
 western_ocean_voyage_events.5.desc:0 "Где-то за серединой пути, когда ветер ровен и корабли идут ходко, лоцманы приносят старую карту, и [target_leader.GetName] склоняется над ней. Её начертили люди, никогда не ходившие по этому океану, и на ней отмечен большой остров далеко к западу от тех мест, где лежат [ShowAreaName('azores_area')]: Антилия, обнесённая стенами, с семью городами. Говорят, её основали епископы, бежавшие, когда [ShowRegionName('iberia_region')] пала под натиском армий Омейядов.\n\nНикто на борту не видел этого острова и не надеется увидеть. Но карта стара, те, кто её чертил, были не глупцы, а здесь, где ни на одном горизонте ничего нет, старая легенда стоит больше, чем в порту."
 western_ocean_voyage_events.6.desc:0 "Толмачи не могут сойтись ни в одном слове. Один уверяет, что островитяне называют место. Другой — что народ. Третий — что жест на юг и жест вглубь острова — это два разных ответа на два разных вопроса, которые никто не переводит верно.\n\nНесомненно лишь направление: вглубь острова, а дальше — на юг, к горам и рекам, которых никто из команды не видел. [target_leader.GetName] всё же велит лоцманам нанести его на карту — наполовину слух, наполовину догадку — на случай, если кому-нибудь однажды понадобится знать, где искать."
 western_ocean_voyage_events.7.desc:0 "Наконец корабли, побитые штормами и покрытые соляной коркой, входят в гавань, и уже через несколько дней [ROOT.GetCountry.GetGovernment.GetCourtTitle] слушает, как зачитывают донесение. [target_leader.GetName] рассказывает об островах, о переходе через океан, о странных птицах и ещё более странных плодах, о золоте у людей, которые и не слыхали о нас до той минуты, когда мы пришли.\n\nКое-кто сомневается в большей части сказанного, но мы всё равно записываем всё до последнего слова. Карты начинают меняться — осторожно, на западных полях, где прежде ничего не было."
