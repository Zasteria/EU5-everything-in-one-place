 crisis_of_faith.10.title:0 "Проповедь обновления"
 crisis_of_faith.100.desc:0 "Раскол преодолён. Раскольничьи проповедники рассеяны, их последователи вернулись в лоно церкви, а духовенство вновь сплотилось вокруг единого учения. Наша церковь обновилась: её авторитет и наше благочестие восстановлены."
 crisis_of_faith.101.desc:0 "Раскол одержал верх. Реформированное учение пускает корни в наших церквях и при нашем дворе, а прежнее учение отброшено. Целое поколение наша держава будет жить с расколотой верой и с духовенством, которое больше не подчиняется нашему трону безраздельно."
 crisis_of_faith.11.title:0 "Созыв собора"
 crisis_of_faith.3.desc:0 "Наперекор расколу толпы благочестивых верующих собираются, чтобы вновь подтвердить верность утвердившейся вере. Их рвение может заново разжечь благочестие по всему государству, но такие страсти легко перерастают в беспорядки, если их не сдерживать."
 crusade_cannot_leave_tt:0 "Державы не могут выйти из [Concept('crusade', 'крестового похода')|e] по своей воле. Участие прекращается, когда [crusade] расформировывается — после того, как война против его цели завершится."
 custom_search_filter_religious_order_type_category_name:0 "Типы религиозных орденов"
 d008_orthodox_events.11.a:0 "#italic Вечный город восстановлен!#!"
 eng_grand_remonstrance_decision.desc:0 "Представитель парламента подал перечень жалоб, удовлетворение которых, по мнению депутатов, развеяло бы их тревоги о коррупции и о влиянии духовенства на государственные дела. Они указывают, что [ROOT.GetCountry.GetGovernment.GetRuler.GetName] уже долгое время правит, не созывая парламента, и теперь стремятся сохранить свои права и привилегии, ограничив власть монархии.\n\nКроме того, встаёт вопрос о королевских советниках, представляющих сословие [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]: их присутствие считают продолжением влияния Церкви на дела государства. Внесено предложение запретить духовным лицам участвовать в работе кабинета. Взамен парламент будет охотнее поддерживать новые законы."
 eng_navy_board_decision.desc:0 "Признано, что наши рубежи в известной мере уязвимы для иноземного вторжения. Чтобы обеспечить будущее державы [ROOT.GetCountry.GetName], мы должны установить власть над морями, омывающими наш остров, и пресекать любые попытки посягнуть на наши земли.\n\nРасширив возможности снабжения и упорядочив управление флотом, мы сможем ускорить кораблестроение и содержать более крупный флот с меньшими затратами."
 esmeraldo_do_situ_orbis:0 "«Изумруд о положении мира»"
 every_holding_gains_almoners_almshouses_modifier_for_a_year:0 "Все [Concept('holding', 'владения')|e] выбранного [Concept('religious_order', 'религиозного ордена')|e] в нашей державе получат [Concept('modifier', 'модификатор')|e] «[ShowModifier('almoners_almshouses_modifier')]» на #Y 3#! года"
 fall_of_delhi_opposition_prevails:0 "Оппозиция одерживает верх"
 fall_of_delhi_opposition_prevails_desc:0 "Кризис миновал: [GetCountry('DLH').GetName] получает крупную долговременную прибавку и к [Concept('stability', 'стабильности')|e], и к [Concept('government_power', 'власти правительства')|e]."
 fall_of_delhi_sultanate_consolidates:0 "[GetCountry('DLH').GetNameWithNoTooltip] укрепляет свою власть"
 fall_of_delhi_sultanate_consolidates_desc:0 "[GetCountry('DLH').Custom('GetRulerOrRegentTitle')|U] прочно удерживает власть: [GetCountry('DLH').GetName] получает крупную долговременную прибавку и к [Concept('stability', 'стабильности')|e], и к [Concept('government_power', 'власти правительства')|e]."
 fall_of_delhi_sultanate_destroyed:0 "[GetCountry('DLH').GetFlavorRank|U] уничтожен"
 fall_of_delhi_sultanate_destroyed_desc:0 "Каждый претендент на престол Дели получает модификатор «[ShowModifier('dlh_heirs_of_delhi_modifier')]», а для сильнейшего из них срок его действия удваивается."
 fall_of_delhi_sultanate_dissolves:0 "[GetCountry('DLH').GetFlavorRank|U] распадается"
 fall_of_delhi_sultanate_dissolves_desc:0 "[GetCountry('DLH').GetName] избавляется от модификатора «[ShowModifier('dlh_outside_interference_modifier')]», но платит за распад тяжёлым ударом по [Concept('government_power', 'власти правительства')|e], который лишь отчасти смягчает небольшой прирост [Concept('stability', 'стабильности')|e]."
 fall_of_delhi_territories_ceded:0 "Земли уступлены"
 fall_of_delhi_territories_ceded_desc:0 "[GetCountry('DLH').GetName] избавляется от модификатора «[ShowModifier('dlh_outside_interference_modifier')]», но платит за уступки тяжёлым ударом по [Concept('government_power', 'власти правительства')|e], который лишь отчасти смягчает небольшой прирост [Concept('stability', 'стабильности')|e]."
 flavor_ara.25.desc:0 "Как бы мы ни старались править державой [ROOT.GetCountry.GetName] железной рукой, сословия, которые объединяет [ShowGovernmentReformName('crown_aragon_reform')], раз за разом находят способы помешать укреплению сословия [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Утверждая, что привилегии ограждают их от нашей власти, они к тому же собрали [ROOT.GetCountry.GetGovernment.GetCourtTitle], чтобы остановить любые наши шаги к объединению корон. [target_character.GetName] трезво оценивает нынешнее состояние унии и [Select_CString(target_character.IsFemale, 'намерена', 'намерен')] пустить в ход всё политическое влияние, каким обладает [target_character.GetSheHe], чтобы взять положение под контроль."
 flavor_ara.26.desc:0 "Влияние [ShowCultureName('catalan')]их купцов в державе [ROOT.GetCountry.GetName] постепенно начало менять наречие, на котором говорят во многих наших владениях.\n\nСвязи по всему Средиземноморью позволили им распространить свои обычаи и язык в каждом порту, с которым они торгуют. В регионе [ShowRegionName('italy_region')] многие представители сословия [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] уже торгуются на этом наречии. В области [ShowAreaName('aragon_area')], к великому неудовольствию сословия [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], его начал перенимать и простой люд. Многие из местной знати опасаются, что их обычаи будут вытеснены, и всеми силами противятся распространению наречия."
 flavor_cas.126.a:0 "Приятного аппетита!"
 flavor_cas.144.a_tt:0 "Завершение [Concept('expedition', 'экспедиции')|e] «$pacific_crossing_expedition$» откроет доступ к решению, которое вызовет следующее событие:"
 flavor_cas.146.b:0 "Отправить людей на поиски затонувшего корабля."
 flavor_cas.146.b_tt:0 "Мы отправим поисковый отряд искать затонувший сокровищный галеон, но затраты на поиски могут превысить сомнительную награду."
 flavor_cas.147.c_positive:0 "Сокровища принадлежат поисковому отряду."
 flavor_cas.147.desc_negative:0 "Поисковый отряд, отправленный за обломками «Сан-Хосе», вернулся ни с чем. Несметные сокровища по-прежнему скрыты под волнами, и где они — неизвестно. Быть может, корабль затонул там, где глубина недосягаема для любого ныряльщика, а может быть, течения унесли обломки далеко от тех мест, где их рассчитывали найти..."
 flavor_cas.147.desc_positive:0 "Нашему поисковому отряду наконец удалось найти обломки «Сан-Хосе». Галеон затонул у самого берега, на мелководье, и наши ныряльщики и спасатели смогли добраться до его драгоценного груза. Большую часть сокровищ подняли со дна, и теперь ими владеет [ROOT.GetCountry.GetName]. Осталось решить, как распределить вновь обретённое богатство."
 flavor_cas.147.expedition_tt:0 "Отправлен поисковый отряд на поиски обломков «Сан-Хосе»"
 flavor_cas.1900.b.tt:0 "Каждый [ShowCultureName('catalan')]ий [Concept('location', 'район')|e] получает «[ROOT.GetStaticModifier('cas_catalan_crackdown').GetNameWithTooltip]» на 5 лет, но его [Concept('pops', 'группы населения')|e] теряют [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 flavor_cas.1900.desc:0 "Наши [ShowCultureName('catalan')]ие провинции подняли открытый мятеж. Народ, вынужденный давать постой нашим войскам и нести тяготы войны, восстал против власти, которой обладает [target_ruler.GetName], и против самих устоев, на которых держится [ROOT.GetCountry.GetFlavorRank]. Беспорядки охватили не одно поселение, деревни в огне, а мятежники уже ищут защиты у наших врагов.\n\nМы должны решить, как ответить на это неповиновение, иначе пламя мятежа поглотит и нас."
 flavor_cas.1901.desc_annexed:0 "Наши [ShowCultureName('portuguese')]ие земли, которые давно уже включает в себя [ROOT.GetCountry.GetFlavorRank], подняли мятеж. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] сплотились, их вождь — [target_character.GetName], и они провозглашают восстановление независимого королевства.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен')] решить, как встретить этот мятеж."
 flavor_cas.1901.desc_subject:0 "[GetCountry('POR').GetName] полнится недовольством. Хотя [GetCountry('POR').GetFlavorRank] по-прежнему сохраняет под нашей короной собственные законы и обычаи, многие [ShowCultureName('portuguese')]ие подданные вновь мечтают о независимом королевстве.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен')] решить, насколько крепко [ROOT.GetCountry.GetFlavorRank] будет удерживать наши владения вместе."
 flavor_cas.1902.a.tt:0 "Каждый [ShowCultureGroupName('italian_group')]ий [Concept('location', 'район')|e] получает «[ROOT.GetStaticModifier('cas_naples_crackdown').GetNameWithTooltip]» на 5 лет, но его [Concept('pops', 'группы населения')|e] теряют [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 flavor_cas.1902.desc:0 "В наших [ShowCultureGroupName('italian_group')]их владениях вспыхнула народная революция. Во многих тамошних поселениях люди восстали против непосильных налогов, которыми мы оплачиваем свои войны, и теперь улицы в руках революционных правительств. От их ярости страдают [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] — не меньше, чем власть, которую олицетворяет [target_character.GetName].\n\n[ROOT.GetCountry.GetFlavorRank] не может медлить: порядок нужно восстановить прежде, чем зараза расползётся дальше."
 flavor_cas.60.title:0 "Конгрегация De Auxiliis"
 flavor_dan.1000.a:0 "Курс — $india$!"
 flavor_dan.1000.b:0 "У нас есть заботы и поближе."
 flavor_dan.1000.desc:0 "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] принимает группу [ShowCultureName('danish')]их купцов, задумавших снарядить экспедицию, цель которой — $india$. Они клянутся хранить ту верность, какой вправе требовать [ROOT.GetCountry.GetGovernment.GetRulerTitle] державы [ROOT.GetCountry.GetName], и хотят, чтобы у нашей страны появилась своя [ShowBuildingTypeName('trade_office')]. Успех экспедиции далеко не гарантирован, но, если мы рискнём, она поможет нам укрепить влияние на выгодную торговлю, которой славится [ShowContinentName('asia')]."
 flavor_dan.1000.entry:0 "$flavor_dan.1000.title$"
 flavor_dan.1000.title:0 "$india$ манит наших купцов"
 flavor_dan.1000.tt:0 "Мы отправим экспедицию, чтобы основать торговую миссию. Её цель — $india$. Если экспедиция увенчается успехом, вложения окупятся с прибылью"
 flavor_dlh.1200.entry:0 "Подрыв $TIM_ADJ$ой власти"
 flavor_eng.142.title:0 "«Ни на кого иного не уповаю»"
 flavor_eng.149.entry:0 "Заговор $Babington$а"
 flavor_eng.162.title:0 "«Си Венчур»"
 flavor_eng.19.entry:0 "Валютные реформы $name_thomas$а $Gresham$а"
 flavor_eng.211.entry:0 "Машина $Savery$"
 flavor_eng.667.entry:0 "$flavor_eng.667.title$"
 flavor_eng.93.title:0 "«О сожжении еретика»"
 flavor_eng.98.entry:0 "Вопрос об останках $Wycliffe$а"
 flavor_eth.156.title:0 "Восстание движения «[rebels_scope.GetNameWithNoTooltip]»"
 flavor_eth.270.entry:0 "Правитель $IFA$а поднимает мятеж"
 flavor_hol.19.title:0 "Узник Голландии"
 flavor_hun.380.title:0 "Королевское плацет"
 flavor_hun.470.title:0 "Привилегия для славян"
 flavor_maj.28.title:0 "[target_location.GetNameWithNoTooltip] во всём блеске"
 flavor_nap.12.title:0 "#italic Государство Президий#!"
 flavor_nap.401.historical_info:0 "Восстание Томмазо Аньелло 1647 года было недолгим, но успешным выступлением простонародья против власти ненавистного герцога Аркоса. Итогом восстания стало провозглашение недолговечной Неаполитанской республики."
 flavor_pap.1400.a:0 "Идите и воспламените весь мир!"
 flavor_pap.1401.a:0 "К вящей славе Божией!"
 flavor_pap.30.title:0 "«Конституции Святой Матери-Церкви»"
 flavor_pap.5.a:0 "Или Цезарь, или ничто."
 flavor_por.67.desc:0 "Моря за нашими берегами по-прежнему окутаны тайной, но купцы и путешественники рассказывают о далёких рынках, ломящихся от немыслимых богатств. Другие толкуют о могучем царстве пресвитера Иоанна, который, как говорят, основал свою державу где-то далеко в Индиях. Если бы нам только удалось отыскать морской путь в те земли за океаном, [ROOT.GetCountry.GetName] смогла бы напрямую прикоснуться к богатствам, которыми славится $india$ и лежащие за ней земли, и, быть может, даже объединить силы со сказочным царством пресвитера Иоанна."
 flavor_por.67.title:0 "В неизвестность"
 flavor_por.73.desc:0 "Минули годы с тех пор, как мы впервые обнаружили драгоценные металлы в регионе [ShowRegionName('brazil_region')], и за это время наши #italic бандейранты#! открыли обширные залежи, что манят людей из дальних краёв. Искатели удачи и работники в небывалых количествах стекаются теперь в регион [ShowRegionNameWithNoTooltip('brazil_region')], и по мере того как [ROOT.GetCountry.GetName] получает всё больше золота, наша казна наполняется сверх всякого прежнего воображения."
 flavor_por.73.title:0 "Бразильская золотая лихорадка"
 flavor_por.74.desc:0 "[ROOT.GetCountry.GetAdjective]ое влияние в регионе растёт: экспедиции наших #italic бандейрантов#! продолжают покорять внутренние земли региона [ShowRegionName('brazil_region')]. Недавно одна из таких экспедиций нанесла на карту прежде неведомые земли области [target_area.GetName]; [Select_CString(target_character.IsFemale, 'вела', 'вёл')] её [target_character.GetName]. Теперь [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'готова', 'готов')] поделиться с сословием «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» знаниями, которые [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'обрела', 'обрёл')] в том походе, если мы поддержим будущие экспедиции."
 flavor_por.74.historical_info:0 "Антониу Рапозу Таварес был одним из самых значительных #italic бандейрантов#!, исследовавших внутренние области Бразилии. Хотя его экспедиции повинны и в разорении иезуитских миссий, и в порабощении тысяч коренных жителей, походы Рапозу Тавареса значительно расширили португальское влияние за пределы, установленные Тордесильясским договором."
 flavor_por.75.desc:0 "Растущая потребность в рабочих руках в наших колониальных владениях толкнула многих #italic бандейрантов#! на набеги за рабами среди местных жителей. Теперь снаряжаются экспедиции, которые уходят далеко вглубь материка, чтобы захватывать коренных жителей и отправлять их на работу в рудники."
 flavor_por.75.historical_info:0 "Поначалу #italic бандейранты#! были исследователями и первопроходцами, но со временем их экспедиции всё чаще превращались в набеги ради захвата коренных жителей в рабство. На протяжении всего XVII века набеги на общины коренных народов и иезуитские миссии стали отличительной чертой многих #italic бандейр#, поставлявших подневольный труд для плантаций, поселений, а затем и для стремительно растущей горнодобывающей промышленности."
 flavor_por.76.historical_info:0 "Фернан Диаш, прозванный Охотником за изумрудами, был одним из самых прославленных #italic бандейрантов#!. Он известен семилетней экспедицией в неизведанные земли за Минас-Жерайсом на поиски легендарных изумрудов Сабарабусу — сказочного горного хребта, в недрах которого, как считалось, таились несметные богатства. Хотя своей изначальной цели экспедиция так и не достигла, Диаш подробно нанёс на карту неизведанные области, основал новые поселения и помог проложить пути, которые в конце концов привели к открытию богатейших золотых месторождений в глубине Бразилии."
 flavor_por.77.title_success:0 "Охотник за изумрудами"
 flavor_por.81.a:0 "Посмотрим, на что [target_artist.GetSheHe] [Select_CString(target_artist.IsFemale, 'способна', 'способен')]!"
 flavor_por.81.b:0 "Не будем стеснять [target_artist.GetHimHer]: пусть работает самостоятельно."
 flavor_por.81.desc:0 "Недавно на суд представили несколько работ, автор которых — [target_artist.GetName], и [ROOT.GetCountry.GetGovernment.GetCourtTitle] высоко ценит [target_artist.GetHimHer] мастерство. При дворе теперь советуют сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подумать о том, чтобы нанять [target_artist.GetHimHer] для создания новых произведений во славу державы [ROOT.GetCountry.GetName]."
 flavor_rus.27.entry:0 "Восстание $pugatchev$а"
 flavor_swe.48.title:0 "[birgitta_scope_for_ui.GetNameWithNoTooltip] причислена к лику святых"
 flavor_tim.1100.entry:0 "Возвышение Фазлуллаха"
 flavor_tim.5.entry:0 "Посольство в Китай"
 flavor_ven.4.title:0 "«Искусство абака»"
 foreign_league_balkan_200_tt:0 "[GetUniqueInternationalOrganization('foreign_league_balkan').GetName] владеет не менее чем #Y 200#! [Concept('locations', 'районами')|e] в регионе [ShowRegionName('italy_region')]"
 game_bias_modifier_struct:0 "#TOOLTIP:BIAS_MODIFIER,$DESC_KEY$ $KEY_LOC|L$#!"
 game_concept_industry_promotion_desc:0 "Поддержка отрасли закрепляет одну [Concept('area', 'область')|e] за одной отраслью промышленности. Каждая отрасль охватывает набор [Concept('goods', 'товаров')|e]: её поддержка повышает [Concept('output', 'объём выпуска')|e] каждого [Concept('building', 'сооружения')|e] в этой [Concept('area', 'области')], производящего эти [Concept('goods', 'товары')], а также повышает спрос ваших [Concept('pops', 'групп населения')|e] на них по всей [Concept('country', 'державе')|e].\n\nДля поддержки отраслей требуется [Concept('advance', 'улучшение')|e] [advance_icon][ShowAdvanceName('industry_promotion_advance')]. Сколько отраслей можно поддерживать одновременно, определяет показатель «$MODIFIER_TYPE_NAME_possible_industry_promotions$»; он растёт вместе с рангом [Concept('country', 'державы')], а также благодаря вашим [Concept('government_reforms', 'государственным принципам')|e] и последующим [Concept('advances', 'улучшениям')]. Поддержку можно отменить в любой момент, чтобы освободить ячейку."
 game_concept_industry_promotions:0 "Поддержка отраслей"
 game_concept_location_rank_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_capital_list_title:0 "[Concept('capital', 'Столицы держав')|e]"
 game_concept_location_rank_list_title:0 "Обычные районы"
 game_concept_location_rank_province_capital_list:0 "$BULLET_WITH_TAB$@megalopolis_province_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_province_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_province_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_province_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_province_capital_list_title:0 "[Concept('province_capital', 'Столицы провинций')|e]"
 game_concept_location_rank_upper_desc:0 "У каждого [Concept('location', 'района')|e] свой ранг: район может быть [Concept('urban_location', 'городским')|e] или [Concept('rural_location', 'сельским')|e].\n\nЦвет значка ранга показывает, является ли [Concept('location', 'район')] столицей."
 game_concept_private_regiment:0 "Частный полк"
 game_concept_private_regiment_desc:0 "Частный полк — это [Concept('regiment', 'полк')|e], который [Concept('estate', 'сословие')|e] набирает и содержит в собственной частной армии, не расходуя наше [Concept('manpower', 'число рекрутов')|e]. Мы можем призвать такие полки к себе на службу, а после роспуска они возвращаются к сословию, а не пополняют наш запас рекрутов. Сословие, поднявшее восстание, отзывает все частные полки, которые нам одолжило."
 game_concept_private_regiments:0 "Частные полки"
 game_concept_promote_industry:0 "Поддержать отрасль"
 game_concept_tax_base_ratio_desc:0 "Каждый [Concept('location', 'район')|e] целиком добавляет своё [Concept('wealth', 'богатство')] к вашей [Concept('economical_base', 'экономической базе')|e]. [Concept('gold', 'Дукаты')|E] же поступают только с той [Concept('tax_base', 'налоговой базы')], которую вы собираете, поэтому низкое соотношение — признак страны, которая выглядит могущественной, но мало что может оплатить: её экономика так и не доходит до казны.\n\nПричина разрыва — [Concept('control', 'контроль')|e]. [Concept('location', 'Район')] теряет [Concept('tax_base', 'налоговую базу')] пропорционально своему [Concept('wealth', 'богатству')], поэтому больше всего даёт повышение контроля в богатых [Concept('locations', 'районах')], где он низок. Для этого не нужны ни новые сооружения, ни [Concept('pops', 'группы населения')|e] — лишь более крепкая власть над богатством, которое вы уже производите."
 game_concept_unit_families:0 "Семейства войск"
 game_concept_unit_family:0 "Семейство войск"
 game_concept_unit_family_desc:0 "Некоторые [Concept('unit_types', 'типы войск')|e] объединены в семейства, и у всех членов одного семейства общий лимит найма. Улучшение отряда до более нового члена того же семейства никогда не занимает дополнительного места, поэтому лимит ограничивает, сколько таких отрядов вы можете выставить всего, а не сколько отрядов каждой [Concept('age', 'эпохи')|e]."
 game_concept_unit_formation_preference_desc:0 "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
