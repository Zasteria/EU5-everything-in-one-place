 choose_religion_for_hire_knight:0 "Выберите религию"
 choose_religion_for_hire_mercenaries:0 "Выберите религию"
 choose_religion_for_hire_monk:0 "Выберите религию"
 choose_religion_for_requisition_manpower:0 "Выберите религию"
