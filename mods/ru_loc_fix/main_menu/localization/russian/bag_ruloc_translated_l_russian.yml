 chukotko_kamchatkan_group_desc:0 "$chukotko_kamchatkan_group$ая $group_text$ $chukotko_kamchatkan_language$ого языка."
 circumnavigation_expedition_events.1.a:0 "Курс на Канарские острова. Что лежит дальше — мы узнаем сами."
 circumnavigation_expedition_events.1.desc:0 "Пять кораблей. Двести семьдесят человек. Припасов на год — и путь, которым ещё не ходил ни один лоцман. [target_leader.GetName] спокойно рассказывает об островах, густо поросших гвоздикой, и о западном проходе к Островам Пряностей. Начальник порта не верит [target_leader.GetHimHer]. Лоцманы колеблются. Но корабли снаряжены, ветер попутный, а на грамоте стоит королевская печать.\n\nВпереди — всё то, чего ещё нет ни на одной карте."
 circumnavigation_expedition_events.10.b:0 "Высадить вооружённых людей, вернуть шлюпку и взять то, что нам нужно."
 circumnavigation_expedition_events.10.c:0 "Забрать с каноэ что удастся и немедленно уходить в море."
 circumnavigation_expedition_events.10.desc:0 "На самом пределе сил впередсмотрящие замечают зелёные горы — наконец-то настоящая земля, с водой, плодами и рыбой. Навстречу флоту устремляется множество каноэ с балансирами; их мореходы быстры и бесстрашны — они поднимаются на борт и уносят всё, что не принайтовлено. Для них то, что оставлено без присмотра, можно брать свободно; для изголодавшихся команд это грабёж.\n\nЭти острова могут спасти экспедицию — если [target_leader.GetName] сумеет добыть здесь провизию."
 circumnavigation_expedition_events.11.a:0 "Вступиться за союзника. Пусть Мактан узнает нашу силу."
 circumnavigation_expedition_events.11.b:0 "Взять то, что дают острова, и плыть дальше. Это не наша война."
 circumnavigation_expedition_events.11.c:0 "Водрузить королевский штандарт. Пусть корона запишет это открытие."
 circumnavigation_expedition_events.11.desc:0 "Острова спасли экспедицию. После мучительного перехода люди, которых ведёт [target_leader.GetName], пополняют запасы воды, плодов и свежего мяса, а на Себу раджа принимает их пиром. Договор скреплён кровью: его народ примет [ROOT.GetCountry.GetReligion.GetName], а взамен пушки чужеземцев будут служить его престолу. Под тропическим солнцем за один день обращаются сотни людей.\n\nЗатем приходит час платить за союз. За узким проливом, на острове Мактан, непокорный вождь не признаёт ни нового повелителя, ни того, кого мы зовём [ROOT.GetCountry.GetReligion.GetGodName], — и наш союзник ждёт, что мы его усмирим. Обрести друга на этих островах — значит унаследовать его врагов."
 circumnavigation_expedition_events.11.title:0 "Кровь и вера на Себу"
 circumnavigation_expedition_events.12.a:0 "Забить трюмы доверху; наш груз — [ShowGoodsNameWithNoTooltip('cloves')]. Ради этого мы и прошли полмира."
 circumnavigation_expedition_events.12.b:0 "Заключить договор с султаном. Союз ценнее любого груза."
 circumnavigation_expedition_events.12.desc:0 "Молуккские острова. Точка на всех картах, до которой ещё ни один иберийский корабль не добирался с запада. Запах достигает кораблей прежде, чем показываются острова: гвоздика, густая и тёмная, — её аромат несёт тот же ветер, что гнал их через два океана.\n\n[target_leader.GetName] стоит на палубе, пока лоцманы выкрикивают глубины, и долго молчит. Трюмы почти пусты. От команды осталась лишь тень. Но они здесь, и лодки султана уже идут им навстречу."
 circumnavigation_expedition_events.13.desc:0 "Мыс оказывается именно таким, каким его рисовали рассказы старых моряков, — стеной серой воды и ветра, которая швыряет корабли, будто листья. Команда — то, что от неё осталось, — не ропщет. Эти люди уже прошли пролив, который казался непроходимым, океан, не имевший имени, и архипелаг, едва не поглотивший флот. Мыс Доброй Надежды — всего лишь очередное препятствие.\n\nКогда флагман огибает мыс и ветер стихает, [target_leader.GetName] смотрит на восток, затем на запад. Теперь они побывали во всех океанах мира."
 circumnavigation_expedition_events.14.a:0 "Привести судно в порядок: законопатить швы, наполнить бочки, накормить людей."
 circumnavigation_expedition_events.14.b:0 "Лишь короткая стоянка. Как следует люди отдохнут дома."
 circumnavigation_expedition_events.14.desc:0 "Над островами впереди реют флаги державы [ROOT.GetCountry.GetName]. После долгих лет за пределами всех карт флот наконец пристаёт к дружественному берегу — к гавани, где можно законопатить судно, наполнить бочки и накормить поредевшую команду, не опасаясь ни нападения, ни обмана. Люди губернатора выходят на пристань поглазеть на измождённых оборванцев, которые утверждают, что обогнули весь свет.\n\nРодные воды уже близко. Осталось решить лишь одно — сколько отдыхать, и решает это [target_leader.GetName]."
 circumnavigation_expedition_events.15.a:0 "Держаться легенды. Закупиться быстро, пока не начались расспросы."
 circumnavigation_expedition_events.15.b:0 "Не рисковать в гавани соперника. Идти домой, пусть и впроголодь."
 circumnavigation_expedition_events.15.desc:0 "Последний корабль течёт по всем швам, команда голодает, а над единственной гаванью в пределах досягаемости реет флаг соперничающей короны. [target_leader.GetName] приказывает зайти в порт, сочинив легенду: будто они возвращаются из Америки, а не с запретного Востока. Но когда матросы на берегу спрашивают, какой сегодня день, ответ на день расходится с их счётом: где-то на пути вокруг света флот потерял сутки, и это расхождение может выдать всё.\n\nПровизия совсем рядом — если обман не раскроется."
 circumnavigation_expedition_events.16.a:0 "Отправить охотников за козами и наполнить бочки у родников."
 circumnavigation_expedition_events.16.desc:0 "Острова необитаемы — сухие, обдуваемые ветрами груды камней и кустарника, — но это земля, с укрытой стоянкой и родниками среди скал. Более того, по склонам бродят одичавшие козы, оставленные каким-то прежним кораблём, и у моряков текут слюнки при мысли о свежем мясе после стольких месяцев гнилья и долгоносиков.\n\nСтоянка не стоит ничего, кроме времени, а время — единственное, чем может поступиться корабль на пути домой. [target_leader.GetName] отдаёт приказ."
 circumnavigation_expedition_events.17.desc:0 "Время года сменяет другое, а [capital_location.GetName] всё ждёт вестей от флота — пока не иссякает сама надежда. Экспедиция не вернётся домой. Где-то за краем известного мира — поглощённые морем, слишком широким, чтобы его пересечь, или истаявшие до столь малого числа кораблей и рук, что плыть дальше стало невозможно, — суда и их команды сгинули. От флота, что отправился обогнуть земной шар, не вернулось ничего, кроме молчания и имён погибших.\n\nМечта переживает тех, кто за ней гнался. Другое царствование, другая команда ещё могут завершить то, что начато сейчас."
 circumnavigation_expedition_events.18.b:0 "Подавить мятеж силой. Зачинщики ответят за всё."
 circumnavigation_expedition_events.18.desc:0 "Всё начинается так, как всегда начинаются подобные вещи: слово, брошенное вполголоса на ночной вахте, кучка людей, умолкающих при приближении офицера, капитан, что отводит взгляд, едва его окликает [target_leader.GetName]. Провизии мало, людям холодно и страшно, а нанимались они в плавание к Индиям, а не на край света. Теперь недовольство обрело очертания: один из капитанов наотрез отказался выполнить приказ, и его команда стоит за ним стеной, требуя повернуть флот домой.\n\n[target_leader.GetNameWithNoTooltip] располагает, быть может, лишь сутками, прежде чем гниль перекинется на другие корабли. Решать нужно сейчас."
 circumnavigation_expedition_events.19.a:0 "Отдохнуть и полностью пополнить запасы. Такой дружественный берег — редкость."
 circumnavigation_expedition_events.19.b:0 "Короткая стоянка с благодарностью — и на юг. Время года не ждёт."
 circumnavigation_expedition_events.19.desc:0 "Позади недели плавания; [ShowContinentName('atlantic_ocean_continent')] наконец отступает, и на западном горизонте проступает низкая зелёная полоса — а над маленьким портовым городком реют наши собственные знамёна. Колония державы [ROOT.GetCountry.GetName], основанная на этом далёком берегу, распахивает свои склады перед кораблями короны. Пресная вода, плоды, солонина и лес для починки — всё это можно получить, и даром, среди соотечественников.\n\n[target_leader.GetName] может взять на борт всё, что способен вместить флот, прежде чем повернуть на юг, в неизведанное."
 circumnavigation_expedition_events.19.historical_info:0 "Северо-восточный выступ Бразилии — Пернамбуку, Параиба, Риу-Гранди — был одной из самых ранних и богатых областей иберийских поселений в Новом Свете: его побережье окаймляли заросли бразильского дерева, а вскоре и сахарные плантации. Корона, владевшая этими гаванями, могла снабдить флот водой и провизией на собственной земле перед долгим переходом в южные широты — роскошь, которой Магеллан, пробиравшийся через воды соперника, так и не знал."
 circumnavigation_expedition_events.2.a:0 "Взять полный запас провизии. Возможно, мы больше не пройдём этим путём."
 circumnavigation_expedition_events.2.b:0 "Отплывать сейчас, пока люди не растеряли мужества."
 circumnavigation_expedition_events.2.desc:0 "[current_location.GetProvince.GetName] поднимается из моря плоскими бурыми уступами — каменные твердыни под всё тем же небом, что и в родном порту — [departure_port.GetName]. Лоцманы делают последние промеры глубин. Матросы пьют пресную воду из окованных железом бочек и чинят такелаж, истрёпанный атлантической зыбью. За последним мысом карты заканчиваются.\n\nКто-то молится. Кое-кто пишет письма, отправить которые не будет никакой возможности. [target_leader.GetName] меряет шагами палубу, словно пытается измерить неизмеримое. Всего, что погрузят сейчас, должно хватить на переход через океан — и дальше."
 circumnavigation_expedition_events.2.historical_info:0 "Канарские острова, в то время принадлежавшие Кастилии, на протяжении всей эпохи открытий служили обычной стоянкой, где иберийские экспедиции в Атлантику пополняли запасы. Флот Магеллана зашёл на Тенерифе, чтобы взять свежую провизию перед долгим переходом через Атлантику к берегам Южной Америки. Кастилия колонизировала острова в начале XV века, и они служили одновременно складом припасов и отправной точкой для плаваний в неизведанные воды. От того, насколько основательно флот запасался здесь провизией, могло зависеть, переживут ли его команды пустынные лиги, что ждали впереди."
 circumnavigation_expedition_events.20.a:0 "Осторожно выменять провизию в колонии державы [rival_crown.GetNameWithNoTooltip]."
 circumnavigation_expedition_events.20.desc:0 "Позади недели плавания; [ShowContinentName('atlantic_ocean_continent')] наконец отступает, и на западном горизонте проступает низкая зелёная полоса — но знамёна над гаванью принадлежат державе [rival_crown.GetName]. Её колония владеет этим берегом, и флот на нашей службе не имеет законного права на её причалы. И всё же склады полны, местные факторы вполне готовы торговать за звонкую монету, а люди изголодались по всему, что не похоже на сухари с долгоносиками.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить: зайти в гавань под пушками соперника или держать курс на юг."
 circumnavigation_expedition_events.21.a:0 "Выдавать свежие припасы по норме и стоять, пока не минует худшее."
 circumnavigation_expedition_events.21.b:0 "Нет времени. Идти дальше; сильные выдержат."
 circumnavigation_expedition_events.21.b.tt:0 "Переход продолжается, а больные брошены на волю судьбы. Многие не увидят дальнего берега, а выживших будет слишком мало, чтобы привести домой весь флот"
 circumnavigation_expedition_events.21.desc:0 "Болезнь, что преследует каждое долгое плавание, наконец пришла. Дёсны чернеют и кровоточат, старые шрамы сами собой расходятся, зубы шатаются, а люди, что месяц назад были здоровы, уже не могут подняться с палубы. У лекаря нет иного средства, кроме покоя и свежей пищи, а того и другого почти не осталось.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, насколько можно гнать умирающую команду."
 circumnavigation_expedition_events.22.b.lose_tt:0 "Риск не оправдывается: во тьме флот разбрасывает в стороны, и с рассветом один из кораблей может не отозваться"
 circumnavigation_expedition_events.22.desc:0 "Небо наливается цветом синяка, а море вздымается серыми горами. Ветер рвёт такелаж, и корабли с трудом выбираются из провалов меж волн, в которых могла бы скрыться колокольня. Зелёная вода перехлёстывает через палубы, и лоцманы уже не могут разглядеть один корабль с другого.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] выбрать: встретить бурю лицом к лицу или бежать перед ней, молясь, чтобы флот не рассеялся."
 circumnavigation_expedition_events.23.a.tt:0 "Флот кренгуется на пустынном берегу и делает что может; работа медленная и дорогостоящая, но корпуса ещё какое-то время продержатся"
 circumnavigation_expedition_events.23.c:0 "Идти в ближайшую дружественную гавань и переоснастить судно."
 circumnavigation_expedition_events.23.c.tt:0 "Флот заходит в ближайшую дружественную гавань и спокойно чинится — ремонт куда надёжнее, чем на любом пустынном берегу, а командам выпадает долгожданный отдых"
 circumnavigation_expedition_events.23.desc:0 "В этих тёплых водах корабельный червь точит обшивку быстрее, чем любой плотник успевает заделывать ходы, и вскоре доски становятся похожи на пчелиные соты. У помп стоят круглые сутки, а вода в трюмах всё прибывает. Корпусу в таком состоянии нельзя доверить переход через океан без надлежащего кренгования — нужно вытащить судно на берег, выжечь наросты с днища и заново просмолить швы.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, как удержать флот на плаву."
 circumnavigation_expedition_events.24.desc:0 "Ветер стихает совсем. Паруса безвольно висят на мачтах, море лежит гладкое, как стекло, под белым безжалостным небом, и корабли день за днём стоят недвижно, а вода в бочках тухнет и еда подходит к концу. Люди сперва мрачнеют, затем начинают бояться: они шепчутся, что флот уплыл за пределы ветров этого мира и больше никогда их не почувствует.\n\n[target_leader.GetName] может лишь ждать — или посадить людей на вёсла шлюпок."
 circumnavigation_expedition_events.27.desc:0 "Трюмы пустеют, но по траверзу тянется низкий зелёный берег — необитаемый, насколько могут судить впередсмотрящие: ни дыма очагов, ни каноэ, выходящих навстречу. С камней дюжиной ручьёв струится пресная вода, на отмелях толпятся птицы, а лес сулит плоды, древесину и дичь любому отряду, готовому сойти на берег и взять их.\n\nЧтобы собрать достаточно, флоту придётся потратить дни, которых у него почти нет, но пустые желудки обойдутся дороже. [target_leader.GetName] отдаёт приказ."
 circumnavigation_expedition_events.28.desc.christian:0 "Трюмы пустеют, но неподалёку на побережье лежит христианский [trade_shore.GetRank.GetName]: над водой едва слышен колокольный звон, над гаванью возвышается крест. Жители выходят на лодках поглядеть на чужаков — настороженно, но без вражды, а где есть общая вера, там найдётся и общий язык для торга. Зерно, солонину, плоды и пресную воду можно получить за монету и товары.\n\nНесколько дней на якоре здесь снова наполнят трюмы. [target_leader.GetName] соизмеряет промедление с тающими запасами."
 circumnavigation_expedition_events.28.desc.muslim:0 "Трюмы пустеют, но неподалёку на побережье лежит мусульманский [trade_shore.GetRank.GetName]: над водой плывёт призыв к молитве, вдоль берега вытащены доу. Местные торговцы выходят навстречу флоту — расчётливые и бесстрашные, ведь эти люди покупали и продавали на всех морях мира. Рис, финики, солёную рыбу и пресную воду можно получить за добрую монету и подходящие товары.\n\nНесколько дней на якоре здесь снова наполнят трюмы. [target_leader.GetName] соизмеряет промедление с тающими запасами."
 circumnavigation_expedition_events.28.desc.pagan:0 "Трюмы пустеют, но неподалёку на побережье лежит [trade_shore.GetRank.GetName], жители которого поклоняются богам, о которых капелланы флота даже не слыхали. Они осторожно выходят на каноэ, предлагая коренья, плоды, рыбу и тыквенные сосуды с пресной водой, и с любопытством разглядывают железо, ткани и безделушки, которые чужеземцы протягивают им взамен. Ни одна из сторон не знает языка другой, но голоду и меновой торговле язык не нужен.\n\nНесколько дней торговли здесь снова наполнят трюмы. [target_leader.GetName] соизмеряет промедление с тающими запасами."
 circumnavigation_expedition_events.3.a:0 "Высадиться за дровами, водой и плодами; поторговать с местными."
 circumnavigation_expedition_events.3.desc:0 "Позади недели плавания; [ShowContinentName('atlantic_ocean_continent')] наконец отступает, и на западном горизонте проступает низкая зелёная полоса — берег Нового Света. В лесу кричат попугаи, а сотни рек несут к морю пресную воду. От берега отваливают каноэ; гребцы глядят с любопытством и без страха и предлагают дрова, воду и диковинные плоды. Здесь есть всё, чего только может пожелать уставший флот, — но время года меняется, а проход на юге всё ещё не найден.\n\n[target_leader.GetName] взвешивает: отдых на берегу — или мили, которые ещё предстоит пройти."
 circumnavigation_expedition_events.3.historical_info:0 "Флот Магеллана достиг бразильского побережья в конце 1519 года, пристав к берегу в окрестностях мыса Санту-Агостинью, а затем двинулся на юг. По Тордесильясскому договору Бразилия входила в португальскую половину мира, поэтому флот на испанской службе не мог открыто задерживаться у её берегов; тем не менее прибрежные тупи охотно торговали, и после перехода через Атлантику изобилие этой земли стало для моряков долгожданным облегчением."
 circumnavigation_expedition_events.4.a:0 "Дать командам отдых и полностью пополнить запасы: такого изобилия больше не будет."
 circumnavigation_expedition_events.4.b:0 "Выменять сколько удастся провизии и уйти в течение недели."
 circumnavigation_expedition_events.4.desc:0 "Флот входит в залив, столь огромный и укрытый от ветров, что он кажется подарком судьбы: его кольцом обступают зелёные горы, а воды серебрятся от рыбы. Жители побережья толпами выходят навстречу, меняя птицу, плоды и рыбу на рыболовные крючки и ножи, и предлагают больше, чем способны вместить трюмы. После долгого перехода через Атлантику это сущий рай, и матросы с радостью остались бы здесь навсегда.\n\nНо рай — дурной помощник в плавании. Сколько флоту здесь задерживаться, решает [target_leader.GetName]."
 circumnavigation_expedition_events.4.historical_info:0 "Огромный залив, на берегах которого впоследствии вырастет Рио-де-Жанейро, подарил флоту Магеллана самое щедрое пополнение запасов за всё плавание. Его укрытые воды кишели рыбой, а прибрежные тупи в поразительных количествах выменивали провизию на безделушки и железные инструменты. Основательно запасшись здесь, команды встречали холодные широты и поиски пролива во всеоружии; флот, спешивший дальше, расплачивался за свою поспешность на юге."
 circumnavigation_expedition_events.5.a:0 "Как следует исследовать устье: эти знания могут пригодиться."
 circumnavigation_expedition_events.5.desc:0 "Лоцманы знали: проход должен существовать. Ни один материк не может тянуться бесконечно. Но великое устье так широко, что дальнего берега не видно даже с мачты, а вода, пусть и солоноватая, на сорок лиг в море окрашена илом в бурый цвет. На две недели вверх по устью отправляют шлюпки.\n\nОни возвращаются с вестями о сомах, мелководье и о том, что прохода в другой океан здесь нет. Где-то южнее ждёт настоящий проход — если он вообще существует."
 circumnavigation_expedition_events.5.historical_info:0 "Рио-де-ла-Плату — «Серебряную реку» — в 1516 году исследовал испанский мореплаватель Хуан Диас де Солис, вскоре после высадки убитый местными жителями. Экспедиция Магеллана обследовала устье в январе 1520 года, ошибочно полагая, что это и есть западный проход. Ошибка стоила ей нескольких недель, зато позволила провести первую подробную испанскую съёмку региона Ла-Платы. Река получила своё название по серебру, которым здесь торговали народы чарруа и гуарани, однако слухи о серебряных горах в глубине материка так и не подтвердились."
 circumnavigation_expedition_events.6.a:0 "Вести корабли вперёд. Одному лишь ветру нас уже не остановить."
 circumnavigation_expedition_events.6.b:0 "Зимовать здесь. С отдохнувшими командами пролив будет милосерднее."
 circumnavigation_expedition_events.6.desc:0 "Пролив холоден, узок и смертоносен. По обе стороны отвесно вздымаются стены чёрного камня, а русло петляет так, что лоцманы перестают понимать, где запад. Главный враг — ветер: он обрушивается со снежных полей и без предупреждения меняет направление, с воем проносясь сквозь такелаж внезапными белыми шквалами, которые отбрасывают корабли назад и на целые дни прижимают их к скалам.\n\n[target_leader.GetName] молча стоит на носу флагмана, а каменные стены смыкаются всё теснее. Лоцманы уверяют, что пролив проходим. Матросы не уверены, в своём ли уме лоцманы. Где-то впереди — если картам вообще можно верить — лежит океан столь бескрайний, что у него ещё нет имени."
 circumnavigation_expedition_events.7.b:0 "Поднять все паруса. Чем раньше увидим землю, тем меньше умрёт."
 circumnavigation_expedition_events.7.desc:0 "Последний чёрный мыс пролива остаётся за кормой, и перед флотом распахивается безбрежный океан. [target_leader.GetName] нарекает его #italic Mar Pacífico#! — Тихим — за спокойствие, которое вскоре обернётся проклятием. Неделя сменяет неделю, а на горизонте не показывается ни единого острова. Вода в бочках желтеет и тухнет; сухари превратились в труху с долгоносиками; люди грызут бычьи шкуры, размоченные за бортом, и платят за крысу полдуката.\n\nЛоцманы не могут сказать, насколько широко это море, ведь его ещё никто не пересекал. Как бы [target_leader.GetName] ни [Select_CString(target_leader.IsFemale, 'решила', 'решил')] встретить это испытание, некоторым из тех, кто пустился в путь, не суждено увидеть дальнего берега."
 circumnavigation_expedition_events.8.a:0 "Спустить шлюпки и обыскать риф в поисках воды или пищи."
 circumnavigation_expedition_events.8.desc:0 "Уже больше шестидесяти дней флот не видит ничего, кроме воды. И вдруг крик с мачты: земля! Надежда пробегает по кораблям, как пламя, — пока к берегу не подходят шлюпки. «Земля» оказывается низким кольцом кораллов и пальм, о которое бьётся прибой; здесь нет дна, чтобы удержать якорь, и ни следа пресной воды. Над головой кружат птицы; на деревьях нет ничего, чем мог бы насытиться голодный.\n\nОстров дарит лишь жестокость обманутой надежды. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить: задержаться и искать — или идти дальше."
 circumnavigation_expedition_events.9.a:0 "Ещё раз спустить шлюпки и попытаться пробиться к берегу сквозь прибой."
 circumnavigation_expedition_events.9.desc:0 "Из моря поднимается второй остров — столь же бесплодный, как и первый: кораллы и кустарник в кольце прибоя, и негде встать на якорь. Единственная жизнь в его водах — акулы: они скользят серыми тенями под днищами, и их так много, что моряки осеняют себя крестным знамением. Здесь не высадиться, нет ни воды, ни пищи — лишь всё тот же пустой океан, и надежда людей тает с каждым днём.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, как флоту пережить это отчаяние."
 circumnavigation_expedition_events.provisioned_tt:0 "Флот полностью обеспечен провизией, и его команды лучше выдержат предстоящий великий переход (#G +30#! Провизия)"
 circumnavigation_expedition_events.ship_lost_tt:0 "Один корабль потерян, и экспедиция сокращается (#R -1#! Корабли)"
 circumnavigation_expedition_events.wintered_tt:0 "Зимовка восстанавливает корабли и команду, и они встретят великий переход в куда лучшем состоянии (#G +20#! Провизия)"
