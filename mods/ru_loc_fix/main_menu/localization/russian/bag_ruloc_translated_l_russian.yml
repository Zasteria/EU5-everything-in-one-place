 independence_subject_desc:0 "[Concept('subject', 'Ленник')|e], который стремится освободиться от своего [Concept('overlord', 'сюзерена')|e].\n\n$independence_movement_hint_1$"
 integration_level_icon_integrated:0 "@integration_integrated!"
 italian_wars_exhausted_peninsula:0 "Полуостров истощён"
 italian_wars_exhausted_peninsula_desc:0 "Все здания «[ShowBuildingTypeName('italian_administration_center')]» обращаются в руины, а главы иноземных лиг получают тяжёлый удар по [Concept('government_power', 'власти правительства')|e]."
 italian_wars_foreign_league_triumph:0 "Иноземная лига торжествует"
 italian_wars_foreign_league_triumph_desc:0 "Глава победившей коалиции получает [Concept('prestige', 'престиж')|e] и долговременную награду за победу, а её участники сближаются друг с другом. Все итальянские и соперничающие иноземные лиги расплачиваются за это своим положением."
 italian_wars_italian_league_triumph:0 "Итальянская лига торжествует"
 italian_wars_italian_league_triumph_desc:0 "Глава победившей лиги получает [Concept('prestige', 'престиж')|e] и [Concept('stability', 'стабильность')|e], открывает новый административный закон и может силой или договором добиться верности её участников. Все соперничающие итальянские и иноземные лиги расплачиваются за это своим положением."
 itinerant_court_policy_at_risk_tt:0 "#italic Постройка «[ShowBuildingTypeName('itinerant_court_seat')]» будет утрачена, если показатель «[ShowSocietyDirectionName('decentralization')]» опустится ниже #W 10#! #!"
 iu_marriage_may_form_union_tt:0 "Это может привести к образованию [Concept('union', 'унии')|e]"
 iu_spurned_will_be_displeased_tt:0 "[iu_spurned.GetName] может не простить пренебрежения, проявленного при выборе этой партии"
 janissaries:0 "Янычары"
 jewish_expulsion_threat.desc:0 "Корона выдвигает еврейским общинам официальный ультиматум: уплатить чрезвычайный сбор или отправиться в изгнание. Угроза приносит немедленную выгоду — перепуганные общины собирают деньги, — однако воцарившаяся атмосфера неуверенности нарушает работу торговых сетей, которые издавна держались на посредниках-евреях."
 jewish_expulsion_threat.title:0 "Угроза изгнания"
 jews_may_choose_to_leave_tt:0 "[ShowReligionAdjective('judaism')]ие [Concept('pops', 'группы населения')|e] в большинстве своём переселятся в соседние [Concept('countries', 'державы')|e]\n\nКаждый [Concept('location', 'район')|e], который они покинут, получит модификатор «[ShowModifier('jewish_expulsion_threat')]», сила которого зависит от доли, которую в нём составляли [ShowReligionAdjectiveWithNoTooltip('judaism')]ие [Concept('pops', 'группы населения')]"
 jihad_cannot_leave_tt:0 "Державы не могут выйти из [Concept('jihad', 'джихада')|e] по своей воле. Участие прекращается, когда [jihad] расформировывается — после того, как война против его цели завершится."
 kirishitan.10.a:0 "#italic Слава Господу#!."
 koutoubia_marrakesh_holy_site:0 "Мечеть Аль-Кутубия"
 koutoubia_marrakesh_work_of_art:0 "Мечеть Аль-Кутубия"
 koutoubia_marrakesh_work_of_art_desc:0 "$koutoubia_marrakesh_work_of_art$, дважды возведённая в городе [ShowLocationName('marrakesh')], — яркий образец альморавидской архитектуры и важная достопримечательность в самом центре города. Своё название мечеть получила от книготорговцев, что вели дела вокруг неё."
 kyiv_pechersk_lavra_holy_site:0 "Киево-Печерская лавра"
 kyiv_pechersk_lavra_work_of_art:0 "Печерская лавра ($ORIGIN$)"
 kyiv_pechersk_lavra_work_of_art_desc:0 "Основанная в 1051 году монахами Антонием и Феодосием, Киево-Печерская лавра, или #italic Печерский монастырь#!, — один из старейших и важнейших центров восточного православия. Частично построенный под землёй, монастырь использовал свои пещеры и как кельи, и как места погребения. Со временем лавра разрослась в обширный религиозный и культурный комплекс, где изучали богословие и переписывали рукописи. К XIV веку она стала средоточием духовной жизни и просвещения Киевской Руси."
 lalibela_church_st_george_holy_site:0 "Скальные церкви Лалибэлы"
 lalibela_church_st_george_work_of_art:0 "Церковь Святого Георгия в Лалибэле"
 lalibela_church_st_george_work_of_art_desc:0 "Церковь Святого Георгия, высеченная в скале в правление короля Лалибэлы в XII веке, — вершина эфиопской монолитной архитектуры. Возведённая из стремления создать #italic Новый Иерусалим#!, она отражает религиозные чаяния своей эпохи и самобытное христианское наследие, которым славится $ETH$."
 lat_frankokratia_pope_proposes_latin_restoration.desc:0 "Наша держава набирает силу, и сегодня [ShowScriptedGeographyName('greece_geography')] видит в нас одну из ведущих сил региона — это не ускользнуло от внимания папы. Теперь, когда [GetCountry('BYZ').GetName] клонится к упадку, папа видит именно в нас главного претендента, благодаря которому [GetCountry('LAT').GetLongName] может возродиться, а [ShowLocationName('constantinople')] — вновь стать её столицей.\n\nЕсли мы пойдём навстречу некоторым [GetCountry('PAP').GetAdjectiveWithNoTooltip]им требованиям и если [ShowLocationNameWithNoTooltip('constantinople')] снова станет нашим, папа обещает полную поддержку — за нами будет стоять [GetCountry('PAP').GetLongNameWithNoTooltip], — и признает нашего монарха законным правителем державы «[GetCountry('LAT').GetLongNameWithNoTooltip]»."
 lat_greater_claims_of_the_latin_empire.desc:0 "Когда в 1204 году пал [ShowLocationName('constantinople')], старая латинская знать поспешила укрепить власть над [GetCountry('BYZ').GetAdjective]ими владениями, которыми была усеяна [ShowScriptedGeographyName('greece_geography')], а также заявить о верховной власти над регионом [ShowRegionName('balkan_region')]. Однако в то время [GetCountry('SER').GetName] и [GetCountry('BUL').GetName] оказались опасными соперниками латинян, причём именно [GetCountry('BUL').GetNameWithNoTooltip] своими непрестанными походами на латинские земли в конце концов сыграла главную роль в крушении прежней империи.\n\nТеперь, когда Латинская империя восстановлена, мы можем заявить права на эти земли и добиться того, что оказалось не под силу прежней империи."
 lat_restore_the_holy_patriarchate.desc:0 "Хотя папа поначалу осуждал разграбление, которому в 1204 году подвергся [ShowLocationName('constantinople')], то, что [ShowLocationNameWithNoTooltip('constantinople')] оказался в руках [ShowReligionAdjective('catholic')]их крестоносцев, открыло возможность восстановить патриархат и тем возвысить [GetCountry('PAP').GetAdjective]ий престол. Однако в 1261 году [GetCharacter('byz_michael_viii_palaiologos').GetName] отвоевал [ShowLocationNameWithNoTooltip('constantinople')], и титул вновь утратил всякое значение.\n\nТеперь, когда [ShowLocationNameWithNoTooltip('constantinople')] снова под латинской властью, многие из сословия «[GetEstateNameWithNoTooltip('clergy_estate')]» призывают нас восстановить патриархат."
 laws.0031.a:0 "Да будет так."
 legionaries:0 "Легионеры"
 little_ice_age_climate_recovers:0 "Долгая зима заканчивается"
 lleida.catalan_dialect:0 "Льейда"
 location_region_not_equal:0 "Район [LOCATION.GetName] НЕ находится в регионе [TARGET_REGION.GetName]"
 location_valid_for_calling:0 "Район [LOCATION.GetName] подходит для резиденции ордена с [Concept('calling', 'призванием')|e] «[TARGET_CALLING.GetName]»"
 location_valid_for_religious_order_type:0 "Район [LOCATION.GetName] отвечает требованиям для основания ордена типа «[TARGET_RELIGIOUS_ORDER_TYPE.GetName]»"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a:0 "Верность, которую хранят [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], поможет укрепить нашу власть!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc:0 "После падения Рустамидов многие [ShowReligionAdjective('ibadi')]ие общины региона [ShowRegionName('maghreb_region')] были вынуждены бежать в долину Мзаб. Многие из этих [ShowReligionAdjectiveWithNoTooltip('ibadi')]их государств решили участвовать в совете Маджлис Амми Саид, во главе которого встали [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], другие же предпочли сохранить независимость.\n\nТеперь, когда многие из наиболее населённых [ShowReligionAdjectiveWithNoTooltip('ibadi')]их земель вошли в состав державы [ROOT.GetCountry.GetName], [our_ruler.GetName] стремится сосредоточить совет Маджлис Амми Саид в районе [ROOT.GetCountry.GetCapital.GetName], надеясь создать сильную и влиятельную [ShowReligionAdjectiveWithNoTooltip('ibadi')]ую державу в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghreb_ibadi_nation_establish_majlis_ammi_said.title:0 "Централизовать совет Маджлис Амми Саид"
 maghreb_masters_of_the_sahara.a:0 "Мы совершили невозможное!"
 maghreb_masters_of_the_sahara.desc:0 "Испокон веков народы региона [ShowRegionName('maghreb_region')] участвуют в транссахарской торговле, пересекая суровые пустыни с ценными товарами. Задача нелёгкая, но если мы сумеем установить прочное влияние в области [ShowAreaName('desert_area')] и расширить инфраструктуру главных караванных стоянок, наши народы, возможно, ещё укротят эти беспощадные пески."
 maghreb_masters_of_the_sahara.title:0 "Повелители Сахары"
 maghrebi_cultural_change_events.1004.a:0 "Если в регионе [ShowRegionNameWithNoTooltip('iberia_region')] так хорошо, что ж они туда не вернутся?"
 maghrebi_cultural_change_events.1004.b:0 "Попытаться успокоить обе стороны."
 maghrebi_cultural_change_events.1004.desc:0 "В последние годы из региона [ShowRegionName('iberia_region')] к нам хлынули [ShowCultureName('andalusi')]ие переселенцы, бегущие от жестоких гонений, которым подвергаются там наши [ShowReligionGroupAdjective('muslim')]ие братья. Хотя [ROOT.GetCountry.GetReligion.GetGodName] даровал им новый дом, эти дерзкие пришельцы смеют открыто жаловаться на жизнь в регионе [ShowRegionName('maghreb_region')] и превозносить тех, кто остался во владениях коварных [ShowReligionGroupAdjective('christian')]их держав!\n\nОдин известный представитель сословия [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], принадлежащий к общине «[target_pop2.GetName]», назвал такие речи «почти отступничеством от веры»."
 maghrebi_cultural_change_events.1004.title:0 "Дерзость [ShowCultureNameWithNoTooltip('andalusi')]их переселенцев"
 maghrebi_culture.1.a:0 "[target_location.GetNameWithNoTooltip] останется прибежищем для [ShowCultureNameWithNoTooltip('mustaarabi')]их евреев."
 maghrebi_culture.1.b:0 "Пусть радикальные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] добьются своего: община должна принять [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.1.desc:0 "Хотя в эпоху владычества Альмохадов значительную часть [ShowCultureName('mustaarabi')]их евреев изгнали из региона [ShowRegionName('maghreb_region')], в районе [target_location.GetName] вновь нашли убежище многие [ShowCultureNameWithNoTooltip('mustaarabi')]ие общины. И хотя [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective]ого правителя проводит более терпимую политику по отношению к [ShowReligionAdjective('judaism')]ой вере, наиболее радикальные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] заговорили о возвращении к давно отвергнутому учению Альмохадов."
 maghrebi_culture.1.title:0 "[ShowReligionAdjectiveWithNoTooltip('judaism')]ая община в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.10.a:0 "Район [target_location.GetNameWithNoTooltip] должен сохранить своё значение для транссахарской торговли!"
 maghrebi_culture.10.b:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] не может выделить средства району [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.10.desc:0 "Район [target_location.GetName] лежит на одном из многочисленных торговых путей области [ShowAreaName('desert_area')], и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] издавна делают здесь остановку. Однако в последние годы, под защитой державы [ROOT.GetCountry.GetName], [target_location.GetRank.GetName] заметно вырос в значении: многие торговцы предпочитают останавливаться именно здесь, ведь путешествовать по [ROOT.GetCountry.GetAdjective]им землям безопасно. Возросшее значение принесло району [target_location.GetNameWithNoTooltip] широкую известность по всей Сахаре, но и легло на [target_location.GetRank.GetNameWithNoTooltip] тяжким бременем.\n\nЧтобы [target_location.GetRank.GetNameWithNoTooltip] и впредь оставался влиятельным торговым узлом, [ROOT.GetCountry.GetGovernment.GetCourtTitle] просит: пусть [our_ruler.GetName] выделит средства, без которых [target_location.GetRank.GetNameWithNoTooltip] не справится с растущим потоком торговцев."
 maghrebi_culture.10.title:0 "Растущее значение района [target_location.GetNameWithNoTooltip] для транссахарской торговли"
 maghrebi_culture.11.desc:0 "Хотя район [target_location.GetName] находится в одном из самых суровых уголков региона [ShowRegionName('maghreb_region')], его жители сумели наладить жизнь благодаря недавнему расширению сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]», которое стало настоящим благом: от него особенно выиграли [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] района [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.11.title:0 "Расцвет земледелия в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.12.a:0 "Династия [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] надёжно защищает державу [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.12.b:0 "Пора сбросить оковы династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]."
 maghrebi_culture.12.desc:0 "Со времён падения Альмохадов [ShowCultureName('tunisian')]ая династия [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] сохраняет немалое влияние на востоке региона [ShowRegionName('maghreb_region')]. Хотя держава [ROOT.GetCountry.GetName] сохранила определённую независимость от державы [target_country.GetName], правители из династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] показали себя умелыми сюзеренами, способными защитить [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие земли. Однако по мере того как правление Альмохадов уходит в далёкое прошлое, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё чаще ставит под сомнение законность власти династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]: не пора ли державе [ROOT.GetCountry.GetNameWithNoTooltip] сбросить [ShowCultureNameWithNoTooltip('tunisian')]ое иго?"
 maghrebi_culture.12.title:0 "Под властью династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]"
 maghrebi_culture.13.a:0 "Изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip]!"
 maghrebi_culture.13.b:0 "Позволить [target_character.GetHerHim] остаться — [ROOT.GetCountry.GetGovernment.GetCourtTitle] стерпит."
 maghrebi_culture.13.desc:0 "Хотя [ROOT.GetCountry.GetLongName] уже давно признаёт [ShowCultureName('tunisian')]ий сюзеренитет, [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetNameWithNoTooltip] по большей части сохраняет самостоятельность. Однако недавно [target_character.GetName] [Select_CString(target_character.IsFemale, 'совершила', 'совершил')] несколько вылазок на исконные [ROOT.GetCountry.GetCulture.GetName]ие земли, и по всей державе [ROOT.GetCountry.GetNameWithNoTooltip] начались волнения. Многие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] требуют немедленно изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip], хотя такое изгнание наверняка разгневает державу [target_country.GetName]."
 maghrebi_culture.13.title:0 "[ShowCultureNameWithNoTooltip('tunisian')]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] вмешиваются во внутренние дела"
 maghrebi_culture.14.a:0 "Заставить [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] возместить ущерб от набегов."
 maghrebi_culture.14.b:0 "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получат выговор, но ущерб покроет казна."
 maghrebi_culture.14.c:0 "Поддержать [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] и не мешать набегам."
 maghrebi_culture.14.desc:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в смятении: пришли вести о том, что в районе [target_location.GetName] караваны грабят воины, преданные сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]». Район [target_location.GetNameWithNoTooltip] лежит на одном из важнейших транссахарских торговых путей, и здесь останавливаются многие торговцы. Многие пострадавшие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] требуют, чтобы ущерб, нанесённый своевольными воинами, возместили [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.14.title:0 "Своевольные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] разоряют район [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.15.a:0 "Мы рады их поддержке!"
 maghrebi_culture.15.b:0 "Использовать их поддержку, чтобы укрепить наше влияние во всём [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.15.desc:0 "По мере того как [ROOT.GetCountry.GetAdjective]ая власть распространяется на регион [ShowRegionName('maghreb_region')], всё больше коренных народов присягает на верность державе [ROOT.GetCountry.GetNameWithNoTooltip]. Среди них [target_culture.GetName]ие [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] оказались самыми благосклонными к [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой власти: многие [target_culture.GetNameWithNoTooltip]ие вожди предлагают нам полную поддержку своих племён. Такой порыв со стороны [target_culture.GetNameWithNoTooltip]их племён застал [ROOT.GetCountry.GetGovernment.GetCourtTitle] врасплох: одни предлагают: пусть [our_ruler.GetName] обеспечит им полную поддержку государства и станет отстаивать [target_culture.GetNameWithNoTooltip]ие интересы по всему [ShowRegionNameWithNoTooltip('maghreb_region')]у, другие же советуют просто обратить их горячую преданность нам на пользу."
 maghrebi_culture.15.title:0 "[target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] всё сильнее поддерживают нас"
 maghrebi_culture.16.a:0 "[ROOT.GetCountry.GetGovernment.GetCourtTitle] рад приветствовать [target_character.GetShortNameWithNoTooltip]!"
 maghrebi_culture.16.b:0 "Отказать [target_character.GetHimHer] в должности генерала."
 maghrebi_culture.16.desc:0 "Сближение [target_culture.GetName]их народов и [ROOT.GetCountry.GetCulture.GetName]ой элиты пошло на пользу: [ROOT.GetCountry.GetAdjective]ая власть в регионе [ShowRegionName('maghreb_region')] окрепла. Чтобы [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий [ROOT.GetCountry.GetGovernment.GetCourtTitle] окончательно убедился в их преданности, [target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предложили отдать одного из своих одарённых вождей на службу державе [ROOT.GetCountry.GetNameWithNoTooltip]. Однако некоторые [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] убеждают [our_ruler.GetName] отклонить предложение: они опасаются, что если [target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получат больше самостоятельности, это в конце концов подорвёт нашу власть в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.16.title:0 "Прославленный [target_culture.GetNameWithNoTooltip]ий генерал"
 maghrebi_culture.17.a:0 "Принять предложение, которое делают [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.17.b:0 "Мы не можем позволить, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получили ещё больше влияния."
 maghrebi_culture.17.desc:0 "Хотя [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] державы [ROOT.GetCountry.GetName] не раз становились тяжким бременем — [ROOT.GetCountry.GetGovernment.GetCourtTitle] помнит это слишком хорошо, — в последние годы некогда непокорные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] начали признавать [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ую власть по всему региону [ShowRegionName('maghreb_region')]. Чтобы [ROOT.GetCountry.GetGovernment.GetCourtTitle] убедился в их новообретённой верности, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предлагают поставить на службу державе [ROOT.GetCountry.GetNameWithNoTooltip] полководца по имени [target_character.GetName], о чьих талантах ходят легенды. Впрочем, [ROOT.GetCountry.GetGovernment.GetCourtTitle] опасается, что это лишь уловка: так [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] надеются добиться влияния, которое может дать им только [our_ruler.GetName]."
 maghrebi_culture.17.title:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предлагают многообещающего генерала"
 maghrebi_culture.18.a:0 "Нам следует искать союзников, чтобы укрепить своё положение."
 maghrebi_culture.18.b:0 "Лучше сосредоточиться на внутренней политике."
 maghrebi_culture.18.desc:0 "После падения Альмохадов династии [ShowDynastyName('marinid_dynasty')] и [ShowDynastyName('hafsid_dynasty')] сосредоточили в своих руках немалую власть в регионе [ShowRegionName('maghreb_region')]. Однако недавние военные походы, которые возглавила династия [our_ruler.GetDynasty.GetName], проложили путь к возвышению новой силы в [ShowRegionNameWithNoTooltip('maghreb_region')]е. Хотя правление династии [our_ruler.GetDynasty.GetNameWithNoTooltip] в [ShowRegionNameWithNoTooltip('maghreb_region')]е снискало поддержку коренного [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ого населения, [ROOT.GetCountry.GetGovernment.GetCourtTitle] склоняется к мысли, что нам стоит поискать союзников за пределами страны, если мы хотим превзойти других крупных игроков [ShowRegionNameWithNoTooltip('maghreb_region')]а."
 maghrebi_culture.18.title:0 "Возвышение династии [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.19.a:0 "Крепкое единство сделает нас непобедимыми!"
 maghrebi_culture.19.b:0 "Нам следует использовать наше прочное единство с [target_culture.GetNameWithNoTooltip]им народом, чтобы укрепить влияние в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.19.c:0 "Культурные узы между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]им и [target_culture.GetNameWithNoTooltip]им народами нерушимы."
 maghrebi_culture.19.desc:0 "Переселение [ShowCultureName('bedouin_culture')]их племён в регион [ShowRegionName('maghreb_region')] в одиннадцатом веке изменило политический облик края, однако [ROOT.GetCountry.GetCulture.GetName]ие и [target_culture.GetName]ие народы, живущие под [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой властью, вновь ощутили своё единство. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое владычество над их родным [ShowRegionNameWithNoTooltip('maghreb_region')]ом во многом положило конец былой межплеменной вражде, и на смену ей пришло новое, общее для этих народов единство."
 maghrebi_culture.19.title:0 "Единство с [target_culture.GetNameWithNoTooltip]ими народами"
 maghrebi_culture.2.a:0 "Мы проложим путь к сильной [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой державе в [ShowRegionNameWithNoTooltip('maghreb_region')]е!"
 maghrebi_culture.2.b:0 "Лучше нам идти собственным путём."
 maghrebi_culture.2.desc:0 "Немало времени минуло с тех пор, как в регионе [ShowRegionName('maghreb_region')] господствовала могущественная [ShowReligionAdjectiveWithNoTooltip('ibadi')]ая держава, однако [our_ruler.GetName] прилагает огромные усилия, чтобы объединить уцелевшие государства, по-прежнему верные [ShowReligionAdjective('ibadi')]ому учению. Пусть земли державы [ROOT.GetCountry.GetName] и уступают в богатстве более развитым государствам [ShowRegionNameWithNoTooltip('maghreb_region')]а, успехи, которых добивается [our_ruler.GetShortNameWithNoTooltip], ещё могут увенчаться рождением новой [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой державы."
 maghrebi_culture.2.title:0 "[ShowReligionAdjectiveWithNoTooltip('ibadi')]ие земли [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.20.a:0 "Добиться их ассимиляции в [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ое общество."
 maghrebi_culture.20.b:0 "Лучше постараться интегрировать [target_culture.GetNameWithNoTooltip]ие народы."
 maghrebi_culture.20.desc:0 "Многие представители [ROOT.GetCountry.GetCulture.GetName]ой элиты постепенно переняли [ShowCultureGroupName('arabic_group')]ие обычаи и традиции, и порой это приводило к столкновениям с более приверженными старине народами региона [ShowRegionName('maghreb_region')]. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] видят в [target_culture.GetName]их народах главный источник раздоров, и [ROOT.GetCountry.GetGovernment.GetCourtTitle] это хорошо знает: многие [target_culture.GetNameWithNoTooltip]ие старейшины отказываются вести дела с сословием «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]».\n\nПользуясь своим влиянием по всей державе [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] подали прошение: пусть [our_ruler.GetName] проводит более жёсткую политику ассимиляции [target_culture.GetNameWithNoTooltip]их народов. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] убеждает [our_ruler.GetShortNameWithNoTooltip] отклонить эти требования, опасаясь неизбежных волнений."
 maghrebi_culture.20.title:0 "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ая власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом"
 maghrebi_culture.21.a:0 "Мы не покоримся [ShowCultureGroupNameWithNoTooltip('iberian_group')]им захватчикам!"
 maghrebi_culture.21.b:0 "Нам следует быть готовыми к возможному вторжению."
 maghrebi_culture.21.desc:0 "Падение последнего [ShowReligionGroupAdjective('muslim')]ого государства в регионе [ShowRegionName('iberia_region')] посеяло новую панику по всему региону [ShowRegionName('maghreb_region')]: многие опасаются, что [ShowReligionGroupAdjectiveWithNoTooltip('christian')]ие государства региона [ShowRegionNameWithNoTooltip('iberia_region')] вскоре обратят свой взор на [ShowRegionNameWithNoTooltip('maghreb_region')]. Многие [ShowCultureName('andalusi')]ие беженцы уже устремились в державу [ROOT.GetCountry.GetNameWithNoTooltip], надеясь укрыться от гнева [ShowCultureGroupName('iberian_group')]их народов."
 maghrebi_culture.21.title:0 "Бедственное положение [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.22.a:0 "Нужно поскорее закрепиться на море."
 maghrebi_culture.22.b:0 "Мы не можем пренебречь своими транссахарскими торговыми путями."
 maghrebi_culture.22.desc:0 "Хотя жители державы [ROOT.GetCountry.GetName] куда привычнее к транссахарской торговле, походы под началом [our_ruler.GetName] помогли державе [ROOT.GetCountry.GetNameWithNoTooltip] прочно закрепиться на побережье и получить выход в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Видя в этом новые торговые возможности, многие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] призывают [ROOT.GetCountry.GetGovernment.GetCourtTitle] выделить средства на постройку нового флота, хотя некоторые опасаются, что это подорвёт традиционную транссахарскую торговлю, которая издавна приносит выгоду державе [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.22.title:0 "Выход в [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]"
 maghrebi_culture.23.a:0 "Искать компромисса между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ой и [target_culture.GetNameWithNoTooltip]ой элитами."
 maghrebi_culture.23.b:0 "[target_culture.GetNameWithNoTooltip]ому влиянию в [ShowRegionNameWithNoTooltip('maghreb_region')]е пришёл конец."
 maghrebi_culture.23.desc:0 "[target_culture.GetName]ая элита издавна обладает немалой властью в регионе [ShowRegionName('maghreb_region')]. Она же давно стала яблоком раздора для многих [ShowCultureGroupName('amazigh_group')]их народов, ведь её представители выступают за жёсткую ассимиляцию и требуют перенимать [ShowCultureGroupName('arabic_group')]ие обычаи. С возвышением державы [ROOT.GetCountry.GetName] — [ROOT.GetCountry.GetFlavorRank], где у власти по-прежнему [ROOT.GetCountry.GetCulture.GetName]ая элита, — некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] призывают [our_ruler.GetName] обуздать [target_culture.GetNameWithNoTooltip]ую знать. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] разделился во мнениях: многие видят в [target_culture.GetNameWithNoTooltip]ой элите бесценного союзника, который поможет нам укрепить растущую власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом."
 maghrebi_culture.23.title:0 "Время расплаты для арабизированной элиты"
 maghrebi_culture.24.a:0 "Извлечь выгоду из новых ковров."
 maghrebi_culture.24.b:0 "Мы должны и дальше вкладываться в новые ковры!"
 maghrebi_culture.24.desc:0 "[ROOT.GetCountry.GetCulture.GetName]ие ковры издавна ценятся во всём регионе [ShowRegionName('maghreb_region')] и служат важным товаром для многих [ROOT.GetCountry.GetAdjective]их торговцев. Однако в последние годы благодаря более надёжному источнику товара «[ShowGoodsNameWithNoTooltip('dyes')]» появилось новое поколение [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]их килимов, и спрос на эти ковры растёт как в самом регионе [ShowRegionName('maghreb_region')], так и за его пределами."
 maghrebi_culture.24.title:0 "Новые [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ие килимы"
 maghrebi_culture.25.a:0 "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] вспомнят своё место в этом мире."
 maghrebi_culture.25.b:0 "Сохранить самостоятельность, которой пользуются [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], чтобы избежать внутренних распрей."
 maghrebi_culture.25.desc:0 "Хотя сила, которой обладают [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')], не раз помогала державе [ROOT.GetCountry.GetName] отражать угрозы, по мере того как [ROOT.GetCountry.GetFlavorRank] обрастает бюрократией, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё чаще спорит о том, насколько они полезны. Да, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] помогали защищать державу [ROOT.GetCountry.GetNameWithNoTooltip], но они же доставляли немало хлопот, когда не соглашались с политикой, которую проводит [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nТеперь [ROOT.GetCountry.GetGovernment.GetCourtTitle] обсуждает мысль о том, что государство окрепло достаточно и больше не нуждается в защите, которую дают [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]. Более того, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] пора окончательно обуздать ради укрепления растущей [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой державы."
 maghrebi_culture.25.title:0 "Объединение земель, которыми владеют [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.26.a:0 "Мы станем защитниками Магриба!"
 maghrebi_culture.26.desc:0 "С крахом Альмохадов регион [ShowRegionName('maghreb_region')] вступил в эпоху нестабильности, а влияние на регион [ShowRegionName('iberia_region')] ослабло, однако держава [ROOT.GetCountry.GetName], которой правит [our_ruler.GetName], стала фактическим гегемоном края. Хотя некоторые части [ShowRegionNameWithNoTooltip('maghreb_region')]а всё ещё остаются вне [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ого влияния, [ShowCultureGroupName('iberian_group')]ие королевства, скорее всего, признают в державе [ROOT.GetCountry.GetNameWithNoTooltip] регионального соперника, которого нельзя недооценивать, если они пожелают завоевать [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.26.title:0 "Господство над [ShowRegionNameWithNoTooltip('maghreb_region')]ом"
 maghrebi_culture.27.a:0 "Пусть правление династии [our_ruler.GetDynasty.GetNameWithNoTooltip] и дальше несёт процветание"
 maghrebi_culture.27.desc:0 "Теперь, когда большая часть региона [ShowRegionName('maghreb_region')] находится под [ROOT.GetCountry.GetAdjective]ой властью, династия [our_ruler.GetDynasty.GetName] взялась за обновление многих важнейших памятников культуры в [ShowRegionNameWithNoTooltip('maghreb_region')]е и покровительствует строительству новых центров учёности. Ещё недавно этот край едва не оказался во власти чужеземных держав, но при династии [our_ruler.GetDynasty.GetNameWithNoTooltip] он превратился в могучую силу, перед которой благоговеет всё [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.title:0 "Золотой век [ShowRegionNameWithNoTooltip('maghreb_region')]а при династии [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.28.a:0 "Предоставить им полную поддержку государства."
 maghrebi_culture.28.b:0 "Позволить корсарам продолжать своё дело."
 maghrebi_culture.28.c:0 "Положить конец набегам корсаров"
 maghrebi_culture.28.desc:0 "Вся [ShowContinentName('europe')] знает каперов региона [ShowRegionName('maghreb_region')] как грозную силу, совершающую набеги на всё [ShowScriptedGeographyName('mediterranean_sea_geography')], однако до сих пор их покровители менялись от государства к государству.\n\nНо теперь, когда [ROOT.GetCountry.GetAdjective]ое влияние распространяется вдоль побережья, многие каперы обращаются к державе [ROOT.GetCountry.GetNameWithNoTooltip] в надежде заручиться нашей поддержкой, чтобы их набеги с новой силой охватили всё [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Впрочем, [ROOT.GetCountry.GetGovernment.GetCourtTitle] видит здесь и иную возможность: ослабить каперов и восстановить отношения с европейскими державами, чей гнев они навлекали на себя веками."
 maghrebi_culture.28.title:0 "Влияние на корсаров"
 maghrebi_culture.3.a:0 "Мы будем проводить политику терпимости ко всем течениям, на которые разделился [ShowReligionGroupNameWithNoTooltip('muslim')]."
 maghrebi_culture.3.b:0 "Приверженцы других течений должны принять [ShowReligionNameWithNoTooltip('ibadi')]."
 maghrebi_culture.3.desc:0 "[our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'совершила', 'совершил')] невозможное, создав новую [ShowReligionAdjective('ibadi')]ую державу в регионе [ShowRegionName('maghreb_region')]. Теперь, когда держава [ROOT.GetCountry.GetName] стала одной из главных сил [ShowRegionNameWithNoTooltip('maghreb_region')]а, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё настойчивее призывает [our_ruler.GetNameWithNoTooltip] по-новому взглянуть на другие течения, на которые разделился [ShowReligionGroupName('muslim')]. Новая [ShowReligionAdjectiveWithNoTooltip('ibadi')]ая держава привлекла новых последователей, однако многие жители [ShowRegionNameWithNoTooltip('maghreb_region')]а по-прежнему исповедуют [ShowReligionAdjective('sunni')]ий ислам."
 maghrebi_culture.3.title:0 "Возрождение [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой власти в [ShowRegionNameWithNoTooltip('maghreb_region')]е"
 maghrebi_culture.4.a:0 "Воспользоваться слабостью державы [target_country.GetNameWithNoTooltip]!"
 maghrebi_culture.4.b:0 "Они слишком раздроблены и далеки, чтобы представлять угрозу."
 maghrebi_culture.4.desc:0 "Некогда [ShowReligionAdjective('ibadi')]ий султанат обладал огромным влиянием в регионе [ShowRegionName('maghreb_region')], однако за века, прошедшие после падения Рустамидов, многие ревностные [ShowReligionAdjectiveWithNoTooltip('ibadi')]ие верующие переселились в область [ShowAreaName('desert_area')]. Теперь, когда владения державы [ROOT.GetCountry.GetName] простираются до этих земель, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает: пусть [our_ruler.GetName] начнёт поход против державы [target_country.GetName] — одного из самых слабых осколков былого султаната."
 maghrebi_culture.4.title:0 "Молодые [ShowReligionAdjectiveWithNoTooltip('ibadi')]ие государства [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.5.a:0 "Они должны обратиться в [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.5.b:0 "Лучше постараться мирно интегрировать [ShowReligionAdjectiveWithNoTooltip('ibadi')]ое население."
 maghrebi_culture.5.desc:0 "В области [ShowAreaName('desert_area')] издавна проживает многочисленное [ShowReligionAdjectiveWithNoTooltip('ibadi')]ое население, и теперь большая его часть оказалась под властью державы [ROOT.GetCountry.GetName]. Поскольку в державе [ROOT.GetCountry.GetNameWithNoTooltip] теперь живёт немало приверженцев [ShowReligionNameWithNoTooltip('ibadi')]а, [ROOT.GetCountry.GetGovernment.GetCourtTitle] настойчиво призывает [our_ruler.GetName] проводить политику терпимости по отношению к [ShowReligionAdjectiveWithNoTooltip('ibadi')]им верующим, иначе государству грозят религиозные волнения."
 maghrebi_culture.5.title:0 "Подчинение [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]ого [ShowReligionAdjectiveWithNoTooltip('ibadi')]ого населения"
 maghrebi_culture.6.a:0 "Мы установим [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ую власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом!"
 maghrebi_culture.6.desc:0 "В десятилетия после падения Альмохадов наибольшим влиянием в регионе [ShowRegionName('maghreb_region')] пользовались державы [target_country_1.GetName] и [target_country.GetName], однако под предводительством [our_ruler.GetName] нам удалось создать в [ShowRegionNameWithNoTooltip('maghreb_region')]е могущественное государство, не уступающее державе [target_country.GetNameWithNoTooltip]. И хотя знать держав [target_country_1.GetNameWithNoTooltip] и [target_country.GetNameWithNoTooltip] с опаской смотрит на [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое влияние, многие [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]ие народы приняли нашу власть куда охотнее."
 maghrebi_culture.6.title:0 "Растущее влияние державы [ROOT.GetCountry.GetNameWithNoTooltip]"
 maghrebi_culture.7.a:0 "Пусть местные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] получат средства на создание оросительной сети."
 maghrebi_culture.7.desc:0 "Хотя в регионе [ShowRegionName('maghreb_region')] немало плодородных земель, близость области [ShowAreaName('desert_area')] делает многие его уголки суровыми и неприветливыми.\n\nЖители района [target_location.GetName] просят выделить средства на постройку сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]»: [target_location.GetRank.GetName] надеется так смягчить самые тяжёлые условия жизни."
 maghrebi_culture.7.title:0 "Орошение пальмовых рощ в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.8.a:0 "Перенять особенности архитектуры района [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.8.b:0 "Лучше выделить району [target_location.GetNameWithNoTooltip] дополнительные средства."
 maghrebi_culture.8.desc:0 "Жители района [target_location.GetName] издавна славятся умением приспосабливать постройки к суровым условиям, которые диктует [ShowVegetationName('desert')], а зодчие, которых туда направил [ROOT.GetCountry.GetGovernment.GetCourtTitle], вернулись под большим впечатлением от увиденного. Хотя столица — [ROOT.GetCountry.GetCapital.GetName] — лежит в совсем иной местности, чем район [target_location.GetNameWithNoTooltip], наши зодчие уверены: если их поддержит [our_ruler.GetName], подобные улучшения можно провести и в столичном районе [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 maghrebi_culture.8.title:0 "Искусная архитектура района [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.9.a:0 "Нам следует искать сотрудничества с [ShowCultureGroupNameWithNoTooltip('arabic_group')]ой элитой."
 maghrebi_culture.9.b:0 "Лучше сохранить [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие традиции."
 maghrebi_culture.9.desc:0 "С тех пор как в одиннадцатом веке при поддержке Фатимидов многие [ShowCultureName('bedouin_culture')]ие племена переселились в регион [ShowRegionName('maghreb_region')], многим коренным [ShowCultureGroupName('amazigh_group')]им народам пришлось признать власть этой набирающей силу [ShowCultureGroupName('arabic_group')]ой элиты. Хотя под властью державы [ROOT.GetCountry.GetName] многие [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие народы сохранили самостоятельность, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить в державу [ROOT.GetCountry.GetNameWithNoTooltip] часть этой элиты: пусть [ShowCultureGroupNameWithNoTooltip('arabic_group')]ие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] придадут нашей власти законность. Однако такое приглашение наверняка разгневает [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]."
 maghrebi_culture.9.title:0 "Традиции [ShowCultureGroupNameWithNoTooltip('amazigh_group')]их народов"
 maghrebi_culture_masters_of_sahara_arid_location_bonus:0 "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»; он затронет [Concept('locations', 'районы')|e] с климатом «[ShowClimateName('arid')]»:"
 maghrebi_culture_masters_of_sahara_country_bonus:0 "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»:"
 maghrebi_culture_masters_of_sahara_desert_location_bonus:0 "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»; он затронет [Concept('locations', 'районы')|e] с флорой «[ShowVegetationName('desert')]»:"
 mapmode_local_population_growth_name:0 "Прирост населения"
 mapmode_religious_orders_name:0 "Религиозные ордены"
 marry_noble_effect:0 "[CHARACTER.GetName] и [TARGET_CHARACTER.GetName] вступают в брак."
 may_adopt_a_different_color:0 "Мы можем принять #Y тёмно-синий цвет#! в качестве цвета нашей страны"
 mch_mandarin_language_reforms_decision.b.entry:0 "Оказать благоволение сословию $tribes_estate$."
 mfa_start_war_against_byz_decision.desc:0 "$flavor_mfa.1002.desc$"
 mfa_start_war_against_byz_decision.title:0 "$flavor_mfa.1002.title$"
 millau.catalan_dialect:0 "Мильяу"
 mining_survey_events.1.a:0 "Не скупиться. Отправить искусных пробирщиков и золото на образцы."
 mining_survey_events.1.b:0 "Хватит и скромной платы. Старейшины дадут проводников и кров."
 mining_survey_events.10.b:0 "Разрабатывать тихо. Соперникам-литейщикам пока незачем об этом знать."
 mining_survey_events.11.a:0 "Разрабатывать открыто. Пусть [ROOT.GetCountry.GetFlavorRank] знает: у нас есть [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b:0 "Разрабатывать тихо. Латунщики платят больше, пока слухи не расползлись."
 mining_survey_events.12.a:0 "Объявить о находке. Новая жила, где добывают [ShowGoodsNameWithNoTooltip('tin')], — дело государственной важности."
 mining_survey_events.12.b:0 "Держать в тайне. Прибрать к рукам торговлю бронзой раньше соперников."
 mining_survey_events.13.b:0 "Тихо распродать добычу по договорам пороховым мельницам и печатникам."
 mining_survey_events.14.a:0 "Возвестить о находке — пусть [ROOT.GetCountry.GetFlavorRank] знает. Рудник, где добывают [ShowGoodsNameWithNoTooltip('silver')], — это триумф."
 mining_survey_events.14.b:0 "Держать в тайне. Чужие глаза, обращённые на наше [ShowGoodsNameWithNoTooltip('silver')], сулят беду."
 mining_survey_events.14.historical_info:0 "Добыча серебра преобразила экономику Европы в позднее Средневековье и раннее Новое время. Открытие крупных серебряных жил в Шваце в Тироле и в Яхимове в Богемии в конце XV века, а затем находка в Потоси в Андах в 1545 году наводнили Европу слитками и подпитали великую инфляцию XVI века. Доходный серебряный рудник был стратегическим достоянием того же масштаба, что флот или крепость."
 mining_survey_events.15.b:0 "Разрабатывать тихо. [ShowGoodsNameWithNoTooltip('goods_gold')] притягивает непрошеных гостей."
 mining_survey_events.16.a:0 "Разрабатывать по [ROOT.GetCountry.GetGovernment.GetAdjective]ой грамоте. Пусть узнает и [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.16.b:0 "Сдать выработки в аренду железозаводчикам за постоянную долю."
 mining_survey_events.17.a:0 "Взять выработки под [ROOT.GetCountry.GetGovernment.GetAdjective]ий контроль. [ShowGoodsNameWithNoTooltip('stone')] — стратегический товар."
 mining_survey_events.17.b:0 "Сдать каменоломню в аренду гильдии каменщиков за постоянную плату."
 mining_survey_events.18.a:0 "Объявить о находке. Великая каменоломня, где добывают [ShowGoodsNameWithNoTooltip('marble')], — национальное сокровище."
 mining_survey_events.18.b:0 "Тихо приберечь [ShowGoodsNameWithNoTooltip('marble')] для [ROOT.GetCountry.GetGovernment.GetAdjective]их нужд."
 mining_survey_events.19.a:0 "Объявить о находке. Копи, где добывают [ShowGoodsNameWithNoTooltip('gems')], — чудо, которым стоит похвастаться."
 mining_survey_events.19.b:0 "Тихо приберечь [ShowGoodsNameWithNoTooltip('gems')] для [ROOT.GetCountry.GetGovernment.GetAdjective]ой казны."
 mining_survey_events.20.b:0 "Разрабатывать тихо. Монополия на [ShowGoodsNameWithNoTooltip('mercury')] — великая сила."
 mining_survey_events.20.desc:0 "В нагорье вскрыто месторождение киновари: её ярко-красная руда безошибочно указывает, что в породе есть [ShowGoodsName('mercury')]. Реторту и конденсатор уже устанавливают на безопасном расстоянии от выработок, ведь известно, что пары, выделяющиеся при обжиге, расшатывают зубы и мутят рассудок. Алхимики, пробирщики и золотильщики будут черпать из этого рудника ещё целое поколение, а за столь редкий и полезный металл можно запросить любую цену."
 mining_survey_events.21.b:0 "Сдать промысел в аренду торговцам солью за постоянную долю."
 mining_survey_events.22.a:0 "Объявить о находке. [ShowGoodsNameWithNoTooltip('alum')] — торжество мастерства, которым славится [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.22.b:0 "Разрабатывать тихо. Папской монополии на [ShowGoodsNameWithNoTooltip('alum')] знать об этом незачем."
 mining_survey_events.23.a:0 "Разрабатывать на правах [ROOT.GetCountry.GetGovernment.GetAdjective]ой монополии. [ShowGoodsNameWithNoTooltip('saltpeter')] — это война."
 mining_survey_events.23.b:0 "Позволить торговцам порохом разрабатывать залежь в обмен на право первыми получать добычу."
 mining_survey_events.30.a:0 "Отозвать отряд. Не всякая земля стоит того, чтобы хоронить в ней людей."
 mining_survey_events.31.a:0 "Оставить разработку. Местные не зря говорят о дурном воздухе."
 mining_survey_events.33.a:0 "Закрыть шахту. Свободные люди — опора, на которой стоит [ROOT.GetCountry.GetFlavorRank], и мы пришли не затем, чтобы их хоронить."
 mining_survey_events.33.historical_info:0 "Отравление свинцом, #italic colica plumbica#! древних, было хорошо известной профессиональной болезнью рудокопов, плавильщиков, стекольщиков и гончаров. Трактат Бернардино Рамаццини #italic De morbis artificum diatriba#! (1700), основополагающий труд медицины труда, отводил этому недугу обширную главу. Обычные средства — кровопускание, слабительное и питьё молока — не помогали, и единственной настоящей профилактикой было ограничение контакта со свинцом, к чему у владельцев рудников почти не было экономических стимулов."
 mining_survey_events.34.historical_info:0 "Серебряные жилы славились своей изменчивостью по простиранию: на одних участках они раздувались в рудные тела толщиной в несколько футов, на других сужались до пустых прожилков. Капризы строения жил превращали добычу серебра в ремесло просвещённого азарта, и взлёт и упадок средневековых горняцких городов, таких как Яхимов, Швац и Иглау, с мрачной закономерностью следовали за открытием и истощением отдельных жил."
 mining_survey_events.35.a:0 "Собираться и уходить. «Золото дураков» — старейшая ловушка старателей."
 mining_survey_events.35.title:0 "Не всё то золото, что блестит"
 mining_survey_events.36.a:0 "Закрыть выработку. Мы ещё не готовы бороться с рудничным газом."
 mining_survey_events.38.a:0 "Закрыть каменоломню. Трещиноватый [ShowGoodsNameWithNoTooltip('marble')] годится лишь на щебень для дорог."
 mining_survey_events.42.a:0 "Закрыть промысел. [ShowGoodsNameWithNoTooltip('alum')] здесь не получатся — химия не та."
 mining_survey_events.43.a:0 "Покинуть долину. Почва мертва, и [ShowGoodsNameWithNoTooltip('saltpeter')] здесь не образуется."
 mining_survey_expedition_outcome_overview:0 "$BULLET$Каждое исследование оставляет [Concept('modifier', 'модификатор')|e] «[ShowModifier('thorough_survey')]» на 20 лет, повышающий выпуск сырья по всей державе.\n$BULLET$Каждое найденное месторождение также оставляет после себя богатые залежи — например, «[ShowModifier('rich_silver_vein')]» или «[ShowModifier('rich_gold_strike')]», — которые можно разрабатывать открыто ради [Concept('prestige', 'престижа')|e] или тайно ради [Concept('gold', 'дукатов')|e].\n$BULLET$Кроме того, это даёт:\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')] за два и более найденных месторождения.\n$BULLET_WITH_TAB$#G +5#! за каждое исследованное высокогорье."
 modernization:0 "Модернизация"
