 country_history_GRA:0 "[ShowReligionGroupAdjective('muslim')]ое государство [GetCountry('GRA').GetLongName] — последнее на землях [ShowRegionName('iberia_region')]; его основал столетие назад [GetCharacter('gra_muhammad_i_nasrid').GetName] среди обломков державы Альмохадов. [GetCountry('GRA').GetFlavorRank], зажатый между горами и морем, с тех пор выживает, стравливая соседей друг с другом: платит дань [GetCountry('CAS').GetLongName] на правах «[ShowSubjectTypeName('tributary')]» и зовёт на помощь [GetCountry('MOR').GetLongName] из-за [ShowLocationName('strait_of_gibraltar')]. [ShowReligionGroupAdjective('christian')]ие армии не раз шли на юг, и всякий раз помощь приходила из-за моря.\n\n[GetCharacter('gra_yusuf_i_nasrid').GetName] взошёл на престол в 1333 году, после того как его брата [GetCharacter('gra_muhammad_iv_nasrid').GetName] убили собственные военачальники — всего через несколько недель после того, как тот с помощью [ShowDynastyName('marinid_dynasty')] отбил [ShowLocationName('gibraltar')] у [GetCountry('CAS').GetNameWithNoTooltip]. Молодой и образованный, [GetCharacter('gra_yusuf_i_nasrid').GetShortNameWithNoTooltip] мечтает о дворе учёных и поэтов вокруг [ShowBuildingTypeName('alhambra')], однако гарнизоны [ShowDynastyNameWithNoTooltip('marinid_dynasty')] в [ShowLocationName('algeciras')] и [ShowLocationName('ronda')] напоминают: [GetCountry('GRA').GetFlavorRank] может однажды увидеть, как его покровители становятся хозяевами.\n\nСумеет ли династия [ShowDynastyName('nasrid_dynasty')] и дальше идти узкой тропой между [GetCountry('CAS').GetNameWithNoTooltip] и [GetCountry('MOR').GetNameWithNoTooltip], или [GetCountry('GRA').GetNameWithNoTooltip] вырвется на свободу и вернёт славу $ADU_f$?"
