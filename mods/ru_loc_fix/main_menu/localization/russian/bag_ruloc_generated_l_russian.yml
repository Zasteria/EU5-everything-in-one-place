 bureaucrat_die_desc:0 "[CHARACTER.GetName] [Select_CString(CHARACTER.IsFemale, 'скончалась', 'скончался' )]. Кое-кто из [Select_CString(CHARACTER.IsFemale, 'её', 'его' )] соперников уже успели издевательски поинтересоваться, не [Select_CString(CHARACTER.IsFemale, 'забыла ли она', 'забыл ли он' )] оформить все необходимые на том свете справки, а другие просто облегченно вздыхают, думая о том, что им самим больше не придётся оформлять никаких справок."
 byz_woa_was_moved:0 "[Concept('work_of_art', 'Творение')|e] «[target_woa.GetName]» перевезли [target.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_ACC')|L]#!#!"
