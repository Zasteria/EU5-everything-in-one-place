 king_in_prussia.1.desc:0 "Вслед за возвышением нашей великой страны [target_character.GetName] [Select_CString(target_character.IsFemale, 'заявила', 'заявил')] о своих намерениях возвести #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! в ранг #TOOLTIP:COUNTRY_RANK,rank_kingdom,X #L королевства#!#!, а себя провозгласить [Select_CString(target_character.IsFemale, 'королевой', 'королём')]. [Select_CString(target_character.IsFemale, 'Княгиня', 'Князь')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской империи#!#! считает, что было бы неподобающе не узнать мнение [Select_CString(emperor_character.IsFemale, 'императрицы', 'императора')] по этому вопросу, поэтому [Select_CString(target_character.IsFemale, 'составила', 'составил')] предложение, с которым стоит внимательно ознакомиться."
 latinization_vs_hellenization.13.desc:0 "Знатные жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] обратились ко двору с просьбой дать им право собирать собственный городской совет. Они указывают на опыт самоорганизуемых коммун в итальянских городах как на доказательство того, что самоуправление — залог процветания. Если пойти на уступки, это ослабит контроль со стороны центральной власти и подтолкнёт [ROOT.GetCountry.Custom('rank_ru_ACC')|l] к латинским моделям управления, однако отказ может настроить против нас влиятельные слои общества."
 lesson_economy_4_desc:0 "[markets_with_icon|e] никогда не бывают полностью изолированными друг от друга. Движение [Concept('goods_with_icon', 'товаров')|e] между двумя [Concept('markets', 'рынками')] называется [Concept('trade_with_icon', 'торговлей')|e].\n\n[countries_with_icon|e] могут перемещать [Concept('goods', 'товары')] между [Concept('markets', 'рынками')], расходуя на это [Concept('merchant_capacity_wth_icon', 'торговый потенциал')|e] и получая при этом прибыль или убыток. Кроме того, @burghers! #TOOLTIP:POPTYPE,burghers,X #L горожане#!#!, живущие на рынке, ведут собственную [Concept('trade', 'торговлю')].\n\nПо умолчанию торговля @automation! #high автоматизирована#! на всех [Concept('markets', 'рынках')], то есть, весь ваш [Concept('merchant_capacity', 'торговый потенциал')] на [Concept('market', 'рынке')] будет автоматически задействоваться для наиболее выгодных сделок. Мы советуем доверить [Concept('trade', 'торговлю')] автоматизации, пока вы не освоитесь в игре.\n\nКогда придёт время, вы сможете подробнее познакомиться с [Concept('trade', 'торговлей')] здесь:\n$TAB$[Link('hints', 'selected_hint = hint_trade_wth_icon', 'Совет о торговле')]."
 lieutenancy_tt:0 "Если совокупное число #TOOLTIP:BUILDING_TYPE,local_governor,X #L домов губернаторов#!#! и #TOOLTIP:BUILDING_TYPE,lieutenancy,X #L лейтенантств#!#! [SCOPE.sCountry('actor').Custom('predlog_vvo')] [SCOPE.sCountry('actor').Custom('CL_PREP')] меньше [SCOPE.sCountry('actor').GetModifierValue('num_local_governors')] (дома губернаторов: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('local_governor')|V], лейтенантства: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('lieutenancy')|V])."
