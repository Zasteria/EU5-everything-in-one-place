 cancel_iberian_wedding_pact_happened_desc:0 "Мы расторгли иберийский брачный союз [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!. У наших держав больше не будет общего престолонаследия."
