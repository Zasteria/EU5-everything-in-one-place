 location_suffix_ukrainian:0 "ский"
 lots_of_lollards:0 "Многие [ROOT.GetCountry.GetCulture.GetName|l]ие#! [Concept('pops', 'группы населения')|e] #TOOLTIP:REGION,great_britain_region,X #L Великобритании#!#!, исповедующие #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#!, перейдут в #TOOLTIP:RELIGION,$lollardy_tt$,X #L лоллардизм#!#!"
 miaphysite_flavor.2.title:0 "Святое сердце #ONCLICK:COUNTRY,[from.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from.Custom('CL_tt')],X [from.Custom('CL_GEN')|L]#!#!"
 mission_peace_integrate_province_tip:0 "@arrow_bonus_tier_2! Перейдите на [Link('government', 'tabcontent = cabinet_wth_icon', 'Панель правительства > Совет')], чтобы увидеть ваш [Concept('cabinet_wth_icon', 'совет')|e].\n\n@arrow_bonus_tier_1! Поручите [Concept('cabinet_member', '@cabinet_member! члену совета')|e] [Concept('cabinet_action', 'задание')|e] по #TOOLTIP:CABINET_ACTION,integrate_province,X #L интеграции провинции#!#!.\n\n#italic Подробнее об этом можно почитать здесь: [Link('hints', 'selected_hint = hint_has_conquered_provinces_wth_icon', '$hint_has_conquered_provinces$')]."
 mission_raise_literacy_tip:0 "Существует несколько способов повысить [Concept('literacy_wth_icon', 'грамотность')|e] в вашей [Concept('country_wth_icon', 'державе')|e]:\n$TAB$@arrow_bonus_tier_1! увеличение числа [Concept('pops_wth_icon', 'групп населения')|e], принадлежащих к [Concept('upper_class', 'высшему обществу')|e], за счёт строительства [Concept('buildings_wth_icon', 'сооружений')|e] на [Link('production', '', '@production_panel! Панели производства > Сооружения')];\n$TAB$@arrow_bonus_tier_1! строительство #TOOLTIP:BUILDING_TYPE,library,X #L библиотек#!#! в ваших самых густонаселённых [Concept('locations', 'районах')];\n$TAB$@arrow_bonus_tier_1! изучение [Concept('advances_wth_icon', 'улучшений')|e], которые повышают [Concept('literacy', 'грамотность')] (это можно сделать на [Link('technology_view', '', '@advances_panel! панели улучшений')]);\n$TAB$@arrow_bonus_tier_1! улучшение [Concept('rural_locations', 'сельских районов')|e] до [Concept('urban_locations', 'городских районов')|e].\n\n#italic Проверить ваш текущий уровень [Concept('literacy', 'грамотности')] можно на @advances_panel![Link('advances', '', 'панели улучшений')]#!."
 no_valid_religious_faction:0 "@trigger_no! Мы можем присоединиться к #TOOLTIP:INTERNATIONAL_ORGANIZATION,$protestant_union.tt$,X #L Евангелической унии#!#! или #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_league.tt$,X #L Католической лиге#!#! только если являемся частью #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, и нас не ограничивает перерыв."
 none_impacted_by_foreign_destabilization_efforts_modifier_tt:0 "На каждого [Concept('rival', 'соперника')|e], затронутого действием #TOOLTIP:SCRIPTED_RELATION_TYPE,sow_discontent,X #L «Распространение недовольства»#!#!, в рамках [Concept('event', 'события')|e] будет влиять [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,foreign_destabilization_efforts_modifier,X #V #L «Попытки дестабилизации из-за границы»#!#!"
 offer_deny_market_access_cta_to_unknown:0 "Откажите [Concept('country', 'державе')|e] в доступе к рынку"
 ori_double_elephant_hunting_ground_level_tt:0 "Максимальный уровень [Concept('building', 'сооружений')|e] типа #TOOLTIP:BUILDING_TYPE,elephant_hunting_grounds,X #L «места охоты на слонов»#!#! повысится на #G 2#!."
 papal_conclave_events.6.tt:0 "Каждая [Concept('pop', 'группа населения')|e] получит [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]. [Concept('pops', 'Группы населения')|U] в [Concept('capital', 'столице')|e] ещё получат дополнительные [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 parliaments.24.desc:0 "Похоже, финансовые проблемы нашего правительства и его отчаянные попытки найти средства стали достоянием общественности. Несмотря на потерю репутации [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! и за границей, это принесло нам определённую выгоду, поскольку несколько членов [ROOT.GetCountry.Custom('parliament_ru_GEN')|l], представляющих [target_location.Custom('LR_ACC')|l] [target_location.GetName], обратились к нам с предложением о помощи. Взамен они просят предоставить им возможность более активно участвовать в управлении страной, а также создать официальные механизмы, которые позволят государству обращаться к ним за помощью в будущем."
 personality_events.12.b:0 "Кровь и плоть [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'нашей повелительницы', 'нашего повелителя')] заслуживает доверия."
 personality_events.23.d:0 "[target_heir.GetNameWithNoTooltip] и без того [Select_CString(target_heir.IsFemale,'готова', 'готов')] к правлению!"
 pirate_events.2.desc:0 "Корабль [Select_CString(target_character.IsFemale, 'знаменитой пиратки', 'знаменитого пирата')] [target_culture.GetName] и [Select_CString(target_character.IsFemale, 'её', 'его')] банды кровожадных головорезов вошёл в порт [target_location.Custom('LR_GEN')|l] [target_location.GetName], и капитан требует, чтобы [target_character_2.GetName] [Select_CString(target_character_2.IsFemale, 'предоставила', 'предоставил')] [Select_CString(target_character.IsFemale, 'ей', 'ему')] аудиенцию. [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'известна', 'известен')] своей жестокостью — только за этот год [Select_CString(target_character.IsFemale, 'она потопила', 'он потопил')] десятки вражеских кораблей и [Select_CString(target_character.IsFemale, 'заполучила', 'заполучил')] немало рискованных трофеев. Говорят, на Тайване [target_character.GetSheHe] вырезала целую деревню местных, чтобы их кровью заделать щели в корпусе корабля.\n\nКапитан заявляет, что [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл')] в [target_location.Custom('LR_ACC')|l] с целью предложить свои услуги, в обмен на которые [ROOT.GetCountry.GetFlavorRank|l] предоставит [Select_CString(target_character.IsFemale, 'ей', 'ему')] убежище от [target_culture.GetNameWithNoTooltip]их властей. Однако, если учесть [Select_CString(target_character.IsFemale, 'её', 'его')] репутацию и величину [Select_CString(target_character.IsFemale, 'её', 'его')] флотилии, вполне вероятно, что [Select_CString(target_character.IsFemale, 'её', 'его')] истинные амбиции в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] куда больше, чем [target_character.GetSheHe] заявляет."
