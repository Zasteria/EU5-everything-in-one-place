 invite_to_order_of_chivalry_act_past:0 "[Select_CString(SCOPE.sCharacter('recipient').IsFemale,'Она', 'Он')] получает следующие эффекты:\n[SCOPE.sCountry('actor').GetActiveChivalricOrder.GetCharacterModifierText]"
 invite_to_order_of_chivalry_desc_specific:0 "[SCOPE.sCharacter('recipient').GetName] получит приглашение в наш #Y [SCOPE.sCountry('actor').GetActiveChivalricOrder.GetNameWithNoTooltip]#!. В случае вступления [SelectLocalization(SCOPE.sCharacter('recipient').IsFemale, 'она', 'он')] получит следующие эффекты:\n[SCOPE.sCountry('actor').GetActiveChivalricOrder.GetCharacterModifierText]"
