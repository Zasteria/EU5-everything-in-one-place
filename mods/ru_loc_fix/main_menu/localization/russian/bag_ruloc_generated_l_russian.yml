 strongest_beylik_has_over_75_locations:0 "#ONCLICK:COUNTRY,[GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.Custom('CL_tt')],X [GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.Custom('CL_DAT')|L]#!#! принадлежит хотя бы 500 [Concept('locations', 'районов')|e] (сейчас: [GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.GetOwnedLocationCount]) и 50 [Concept('towns_or_cities', 'городов')|e] (сейчас: [GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.GetTownsAndCities])"
 subject_interaction_events.4.a:0 "[better_ruler.GetNameWithNoTooltip] будет более [Select_CString(better_ruler.IsFemale, 'подходящей правительницей', 'подходящим правителем')]"
 succession_crisis.10.desc:0 "Несмотря на то, что движение «[succession_crisis_pretender_scope.GetName]» раскололо наш народ, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] продолжают объединять верующих и указывать им путь. Понимая опасность, которой грозит раскол [ROOT.GetCountry.Custom('rank_ru_GEN')|l], духовные лидеры этого сословия предложили нам свою поддержку.\n\nВ обмен на новые привилегии они готовы заклеймить узурпатора и публично объявить народу, что лишь [target_character1.GetName] является праведным правителем. По их мнению, спасти и восстановить [ROOT.GetCountry.Custom('rank_ru_ACC')|l] может только вера."
 succession_crisis.6.desc:0 "У [ROOT.GetCountry.Custom('longname_ru_GEN')] тяжёлые времена: #TOOLTIP:DISASTER_TYPE,succession_crisis,X #L кризис престолонаследия#!#! угрожает расколоть [ROOT.GetCountry.Custom('rank_ru_ACC')|l] на части. Претенденты набирают силу, готовясь нанести удар в самое сердце страны. [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName] в опасности. Падение [ROOT.GetCountry.Custom('rank_ru_GEN')|l] приведёт к тому, что [target_character1.GetName] и [Select_CString(target_character_1.IsFemale,'её', 'его')] [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] погибнут. Отчаянно нуждаясь в союзниках, мы обратились за помощью к #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_DAT')|L]#!#!."
 unionevents.98.desc:0 "[ROOT.GetCountry.GetLongName] теперь без правителя. [root_character.GetName] [Select_CString(root_character.IsFemale, 'умерла', 'умер' )]. Обычно в таких случаях [ROOT.GetCountry.GetGovernment.GetHeirSelection.GetName|l] позволяет быстро найти подходящего кандидата на управление страной. Однако сейчас обстоятельства иные: мы состоим в международном объединении «[ROOT.GetCountry.GetDiplomacy.GetUnion.GetName]», а посему [ROOT.GetCountry.Custom('rank_ru_DAT')|l] предстоит принять весьма необычное решение."
 unionevents.98.desc.union_has_leader:0 "$unionevents.98.desc$\n\n[target_character.GetName], [Select_CString(target_character.IsFemale, 'нынешняя правительница', 'нынешний правитель' )] международного объединения «[ROOT.GetCountry.GetDiplomacy.GetUnion.GetNameWithNoTooltip]», требует себе [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий трон. Это может быть приемлемым вариантом, если мы пожелаем остаться в #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#! и в будущем получить над ней контроль, хоть он и претит принципам #TOOLTIP:GOVTYPE,republic,X #L республики#!#!."
 war_of_religions.1300.desc:0 "Долгая и изнурительная война наконец-то завершилась мирными переговорами, результаты которых устроили все стороны. Вести быстро распространяются по #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, и жители истерзанной державы с восторгом приветствуют наступление мира. Наконец-то страна будет избавлена от бесчисленных отрядов мародёров, разорявших её долгие годы. Достигнутый компромисс устраивает как участников #TOOLTIP:INTERNATIONAL_ORGANIZATION,$protestant_union.tt$,X #L Евангелической унии#!#!, так и членов #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_league.tt$,X #L Католической лиги#!#!. Противники давно утратили первоначальное рвение и разуверились в решающей победе, они довольны уже тем, что обеим сторонам удалось сохранить свободу вероисповедания как для собственных подданных, так и для своих единоверцев в других частях империи."
 war_of_religions.1400.desc:0 "Нынешняя война между #TOOLTIP:INTERNATIONAL_ORGANIZATION,$protestant_union.tt$,X #L Евангелической унией#!#! и #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_league.tt$,X #L Католической лигой#!#! сломала немало детских судеб. Множество малышей остались сиротами или оказались против воли разлучены со своими родителями. [Select_CString(target_artist.IsFemale, 'Одной', 'Одним' )] из этих несчастных детей войны [Select_CString(target_artist.IsFemale, 'была', 'был' )] [target_artist.GetName]. [Select_CString(target_artist.IsFemale, 'Похищенная', 'Похищенный' )] отрядом мародёров, [Select_CString(target_artist.IsFemale, 'она провела', 'он провёл' )] большую часть юности в лагерях различных армий, почти позабыв родной #TOOLTIP:LOCATION,hanau,X #L Ханау#!#!. Оказавшись недавно в нашей стране, [Select_CString(target_artist.IsFemale, 'она принялась', 'он принялся' )] оттачивать своё писательское мастерство. По слухам, из-под [Select_CString(target_artist.IsFemale, 'её', 'его' )] пера вышла уже не одна книга, однако все они были опубликованы под чужими именами."
