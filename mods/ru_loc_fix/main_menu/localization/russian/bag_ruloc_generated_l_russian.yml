 cas_appoint_adelantado_mayor_act_past:0 "[SCOPE.sCountry('actor').GetName] назначил[SCOPE.sCountry('actor').Custom('end_fem')] персонажа [SCOPE.sCharacter('recipient').GetName] на должность старшего аделантадо пограничья."
 cas_demand_war_entry_desc:0 "Надавить на #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! с требованием вступить в войны, которые сейчас вед[GetCountry('CAS').Custom('end_etut')] [GetCountry('CAS').GetName]. Поскольку [GetCountry('CAS').GetNameWithNoTooltip] — ведущая сила на оси «$influence_over_granada$», отказ маловероятен."
 cas_demand_war_entry_effect_text:0 "[SCOPE.sCountry('recipient').GetName] присоединя[SCOPE.sCountry('recipient').Custom('end_etyut')]ся к каждой войне, которую вед[SCOPE.sCountry('actor').Custom('end_etut')] [SCOPE.sCountry('actor').GetName]"
 catholic_flavor.11.desc:0 "[pope_scope.GetName] только что [Select_CString(pope_scope.IsFemale, 'объявила', 'объявил')], что [Select_CString(ancestor_saint.IsFemale, 'одна', 'один')] из уважаемых предков нашего правителя, [ancestor_saint.GetName], [Select_CString(ancestor_saint.IsFemale, 'была святой', 'был святым')] нашей благословенной церкви и что теперь пришло время оказать [Select_CString(ancestor_saint.IsFemale, 'ей', 'ему')] должное почтение. Это повод для празднования!"
 catholics_outraged_over_infidel_rome_tt:0 "Каждая #TOOLTIP:RELIGION,$catholic_tt$,X #L католическая#!#! [Concept('country', 'держава')|e] получит [Concept('antagonism', 'неприязнь')|e] к [ROOT.GetCountry.Custom('longname_ru_DAT')] за захват города [ShowLocationNameWithNoTooltip('rome')], и каждый год, пока [ShowLocationNameWithNoTooltip('rome')] не станет ядром, [Concept('antagonism', 'неприязнь')|e] будет расти ещё на [ShowBiasValue('antagonism_infidel_holds_rome')|+=0]"
 challenge_bureaucratic_entrenchment_desc:0 "Благодаря исключительному таланту в управлении государством и ораторском искусстве мы можем использовать накопленную благосклонность [actor.Custom('parliament_ru_GEN')|l], чтобы противостоять укоренившимся бюрократическим структурам в [actor.Custom('rank_ru_PREP')|l]."
 change_societal_values_action_progress_tooltip:0 "Изменение общественных ценностей «[SOCIETAL_VALUE.GetName]» на $VAL|+=2V$ в пользу «$NAME$»"
 change_societal_values_action_progress_wordier:0 "Изменение общественных ценностей «[SOCIETAL_VALUE.GetName]» на $VAL|+=2V$ в пользу «$NAME$»"
 circumnavigation_expedition_events.11.desc:0 "Острова спасли нашу экспедицию. После тяжелейшего путешествия через океан моряки наконец смогли набрать пресной воды, фруктов и мяса в дорогу, а раджа острова Себу и вовсе встретил нас богатым пиром. В ходе переговоров [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'заключила', 'заключил' )] с местным правителем кровный договор: он и его народ примут веру «[ROOT.GetCountry.GetReligion.GetName]», а взамен наши пушки послужат его короне. В результате за один день под лучами тропического солнца обратились сразу сотни аборигенов.\n\nСовсем скоро наш новый союзник напомнил о долге. За узким проливом находится остров Мактан, и его гордый вождь отказался покоряться и заявил, что ни раджа, ни [ROOT.GetCountry.GetReligion.GetGodName] не имеют над ним власти. Теперь раджа просит, чтобы мы поставили наглеца на место. Похоже, чтобы обрести друзей на этих островах, нужно выступить против их врагов…"
 conquest_of_paradise.5.desc:0 "Ох, с чего бы начать… Вероятно, в поисках новых земель и ресурсов поселенцы из [colonial_conflict_target.Custom('longname_ru_GEN')] первыми решили войти в [colonial_conflict_source.Custom('longname_ru_ACC')]. После этого [colonial_conflict_source.GetLongName] отправил[colonial_conflict_source.Custom('endlong_fem')] ополченцев, чтобы прогнать чужаков, но они перестарались и проследовали за ополченцами уже [colonial_conflict_target.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[colonial_conflict_target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[colonial_conflict_target.Custom('CL_tt')],X [colonial_conflict_target.Custom('CL_ACC')|L]#!#!, разграбив при этом пару деревень. В ответ [colonial_conflict_target.GetName] собрал[colonial_conflict_target.Custom('end_fem')] собственное ополчение, чтобы дать отпор #L [colonial_conflict_source.GetAdjective|l]им#! налётчикам и вновь прийти на земли соседей.\n\n[colonial_conflict_source.GetGovernment.GetRulerTitle] #ONCLICK:COUNTRY,[colonial_conflict_source.Custom('CL_tt')] #TOOLTIP:COUNTRY,[colonial_conflict_source.Custom('CL_tt')],X [colonial_conflict_source.Custom('CL_GEN')|L]#!#! и [colonial_conflict_target.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[colonial_conflict_target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[colonial_conflict_target.Custom('CL_tt')],X [colonial_conflict_target.Custom('CL_GEN')|L]#!#! теперь обвиняют друг друга в разжигании конфликта. Как нам лучше разрешить этот спор, не испортив собственную репутацию?"
 consort_events.1.desc:0 "Могущественные семьи [ROOT.GetCountry.Custom('rank_ru_GEN')|l] с тревогой наблюдали, как [target_ruler.GetName] год за годом отказывается связать себя узами брака. Теперь же тревога переросла в нескрываемую панику: несмотря на отсутствие прямого наследника, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] не спешит исправлять ситуацию и не проявляет особого интереса к предложениям, которые [Select_CString(target_ruler.IsFemale,'ей', 'ему')] поступают.\n\nВсё зашло слишком далеко, и придворные надеются, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] примет одно из последних предложений прямо сейчас, ведь [Select_CString(target_ruler.IsFemale,'её', 'его')] нежелание продолжить род ставит под угрозу всю державу. Так удачно совпало, что глава одной из старейших и почтеннейших династий [target_consort.GetDynasty.GetName] из [origin_of_queens_family.Custom('LR_GEN')|l] [origin_of_queens_family.GetName], — как раз подыскивает пару своей дочери, обещая щедрое приданое."
 consort_events.102.desc:0 "Говорят, любовь родителя к ребёнку безгранична, однако, похоже, некоторых любят больше, чем других. Хотя [target_ruler.GetName] не обделяет вниманием [Select_CString(ROOT.GetCountry.GetGovernment.GetHeir.IsFemale,'свою дочь', 'своего сына')] по имени [ROOT.GetCountry.GetGovernment.GetHeir.GetName], все знают, что [Select_CString(ROOT.GetCountry.GetGovernment.GetHeir.IsFemale,'её', 'его')] [Select_CString(favorite_child.IsFemale,'сестра', 'брат')] занимает в сердце [Select_CString(target_ruler.IsFemale,'правительницы', 'правителя')] особое место. [target_ruler.GetName] души не чает в [Select_CString(favorite_child.IsFemale,'своей любимице', 'своём любимце')] и [Select_CString(target_ruler.IsFemale,'дала', 'дал')] [Select_CString(favorite_child.IsFemale,'ей', 'ему')] самое лучшее образование. Теперь [target_consort.GetName] пытается уговорами добиться того, чтобы [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(target_ruler.IsFemale,'пересмотрела', 'пересмотрел')] своё решение и [favorite_child.GetName] [Select_CString(favorite_child.IsFemale,'получила', 'получил')] право наследовать престол #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
 consort_events.2.desc:0 "Когда [target_ruler.GetName] и [target_consort.GetName] заключили брак, у нас появился не только новый член семьи, но и новый союзник в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Династия [target_consort.GetDynasty.GetName] — довольно старая и влиятельная, а её резиденция в провинции [origin_of_queens_family.GetName] — настоящая жемчужина [ROOT.GetCountry.Custom('rank_ru_GEN')|l].\n\nДружба — дело обоюдное, так что [target_consort.GetName] будет высказываться от имени своего рода, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(target_ruler.IsFemale,'должна', 'должен')] будет относиться к этим речам с особым вниманием."
 consort_events.306.desc:0 "[target_ruler.GetName] [Select_CString(target_ruler.IsFemale,'известна', 'известен')] своими административными способностями. [ROOT.GetCountry.GetGovernment.GetRulerTitle] следит за тем, чтобы и народ, и правительство придерживались законов, а все механизмы #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! постоянно дорабатывались и соответствовали эпохе. К счастью, [Select_CString(target_ruler.IsFemale,'её', 'его')] [Select_CString(target_consort.IsFemale,'жена', 'муж')] [target_consort.GetName] имеет схожие интересы!\n\n[Select_CString(target_ruler.IsFemale,'Правительница', 'Правитель')] уверяет, что не задумываясь предпочтёт разговор с [Select_CString(target_consort.IsFemale,'ней', 'ним')] любому заседанию совета. В ответ на такие признания [target_consort.GetName] лишь улыбается, не скрывая, что общение с [Select_CString(target_ruler.IsFemale,'женой', 'мужем')] на любимые темы приносит радость и [Select_CString(target_consort.IsFemale,'ей', 'ему')]."
 consort_events.309.desc:0 "Немного оправившись после смерти [Select_CString(target_char.IsFemale,'супруга', 'супруги')], [target_char.GetName] всё больше привыкает к своим новым обязанностям: пусть под [Select_CString(target_char.IsFemale,'её', 'его')] опекой находится [Select_CString(target_char_heir.IsFemale,'юная', 'юный')] [ROOT.GetCountry.GetGovernment.GetHeirTitle|l], но сейчас именно [Select_CString(target_char.IsFemale,'она', 'он')] — [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Народ убеждён, что это лишь временная необходимость и в конечном итоге [Select_CString(target_char.IsFemale,'её', 'его')] место всё равно займёт [target_char_heir.GetName]. Однако в кулуарных разговорах нередко встаёт вопрос, насколько умело [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] будет управлять своей державой… и справится ли вообще. По мнению некоторых, если к власти придёт [target_char_heir.GetShortNameWithNoTooltip], то это поставит под угрозу само существование государства, поэтому на роль главы гораздо лучше подходит [ROOT.GetCountry.GetGovernment.GetConsortTitle|l].\n\n[Select_CString(target_char.IsFemale,'Сама', 'Сам')] [ROOT.GetCountry.GetGovernment.GetConsortTitle|l] в курсе этих тайных обсуждений, но ещё не [Select_CString(target_char.IsFemale,'приняла', 'принял')] решение по такому деликатному вопросу."
 consort_events.310.desc:0 "Следуя рекомендациям советников и пользуясь своим обаянием, [target_char.GetName] [Select_CString(target_char.IsFemale,'убедила', 'убедил')] большую часть двора в том, что [target_heir.GetName], [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и [Select_CString(target_heir.IsFemale,'главная', 'главный')] [Select_CString(target_heir.IsFemale,'претендентка', 'претендент')] на престол, не годится для столь важной роли в силу своего скудоумия. Однако у этой проблемы есть простое решение…\n\nВо время очередного пышного банкета, устроенного с целью задобрить аристократов, [target_char.GetShortNameWithNoTooltip] и [Select_CString(target_char.IsFemale,'её', 'его')] прислуга смогли донести до присутствующих свой замысел: пусть [Select_CString(target_heir.IsFemale,'юная', 'юный')] [target_heir.GetShortNameWithNoTooltip] остаётся в своих покоях и как следует сосредоточится на учёбе. Конечно, из-за этого [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] может постепенно предаться народному забвению, но #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! это пойдёт лишь на пользу…"
 consort_events.51.desc:0 "Последние несколько дней мы развлекаем высочайших [origin_country_of_consort.GetGovernment.GetAdjective|l]их гостей из #ONCLICK:COUNTRY,[origin_country_of_consort.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country_of_consort.Custom('CL_tt')],X [origin_country_of_consort.Custom('CL_GEN')|L]#!#!, откуда родом [ROOT.GetCountry.GetGovernment.GetConsortTitle|l]. Спустя неделю, проведённую за охотой, пирами и сплетнями, они наконец засобирались домой, в город [origin_country_of_consort.GetCapital.GetName]. Дорогие гости уверяют, что прекрасно провели время, уговаривают [ROOT.GetCountry.GetGovernment.GetAdjective|l]ую семью как можно скорее нанести ответный визит и обещают, что, вернувшись на родину, обязательно расскажут всем, как [target_consort.GetName] здесь [Select_CString(target_consort.IsFemale,'счастлива', 'счастлив')]."
 consort_events.52.desc:0 "Народ державы [ROOT.GetCountry.GetLongName] возликовал, когда [target_ruler.GetName] [Select_CString(target_ruler.IsFemale,'объявила', 'объявил')], что [Select_CString(target_ruler.IsFemale,'она', 'он')] и [target_consort.GetName] сочетаются брачными узами. В тот момент о происхождении [Select_CString(target_consort.IsFemale,'невесты', 'жениха')], равно как и о [Select_CString(target_consort.IsFemale,'её', 'его')] воспитании в городе [origin_country_of_consort.GetCapital.GetName], было известно мало. В представлении большинства жителей [ROOT.GetCountry.Custom('CL_GEN')] [ROOT.GetCountry.GetGovernment.GetAdjective|l]ая семья — это отдельная порода людей, так что до подробностей никому не было дела, пока по стране не поползли тревожные слухи… Говорят, что [ROOT.GetCountry.GetGovernment.GetConsortTitle|l] исповедует #L [origin_country_of_consort.GetReligion.GetAdjective|l]ую#! веру и не желает от неё отрекаться. Люди ещё могут понять, зачем заключать браки с иностранцами, но они вряд ли смирятся с [Select_CString(target_consort.IsFemale,'еретичкой', 'еретиком')] у власти."
 consort_events.54.desc:0 "Едва прибыв ко двору, [target_consort.GetName] начинает проявлять большой интерес к административным делам #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Дело доходит до того, что [ROOT.GetCountry.GetGovernment.GetConsortTitle|l] становится своего рода авторитетом в вопросах управления замком и местной прислугой. [Select_CString(target_consort.IsFemale,'Ей', 'Ему')] доверяет не только [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], но и [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] в целом. В [ROOT.GetCountry.Custom('rank_ru_PREP')|l] это большая редкость."
 consort_events.57.desc:0 "Недавно [target_foreign_consort.GetName] — [ROOT.GetCountry.GetGovernment.GetConsortTitle|l] [Select_CString(target_foreign_ruler.IsFemale,'нашей сиятельной правительницы', 'нашего сиятельного правителя')], — [Select_CString(target_foreign_consort.IsFemale,'получила', 'получил')] письмо от своих родственников из династии [target_foreign_consort.GetDynasty.GetName], которые правят #ONCLICK:COUNTRY,[target_origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_origin_country.Custom('CL_tt')],X [target_origin_country.Custom('CL_INST')|L]#!#!. Судя по всему, [target_ruler.GetName] крайне нуждается в деньгах и спрашивает нас, своих «самых верных друзей», сможем ли мы чем-то помочь. [Select_CString(target_ruler.IsFemale,'Её', 'Его')] письмо пестрит комплиментами нашей великой экономике."
 consort_events.59.desc:0 "Когда [Select_CString(target_foreign_consort.IsFemale,'наша', 'наш')] [target_foreign_consort.GetName] и [marriage_partner.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[marriage_partner.Custom('CL_tt')] #TOOLTIP:COUNTRY,[marriage_partner.Custom('CL_tt')],X [marriage_partner.Custom('CL_GEN')|L]#!#! заключили брак, мы посчитали, что между нашими державами образовалась крепкая связь. Мы бы никогда не нарушили неписаный договор, но [target_foreign_ruler.GetName], похоже, делает это с лёгкостью.\n\n[target_foreign_consort.GetShortNameWithNoTooltip] [Select_CString(target_foreign_consort.IsFemale,'отправила', 'отправил')] нам ответ, и сегодня мы наконец его получили. В нём [target_foreign_ruler.GetShortNameWithNoTooltip] не только отказывает нам в помощи, но и называет нашу просьбу возмутительной!"
 country_dominant_language_equal:0 "[Concept('dominant_language', 'Доминирующий язык')|e] — #L [TARGET_LANGUAGE.GetName|l]ий#!"
 country_history_AZT:0 "За последние два столетия многие #TOOLTIP:CULTURE,$nahua_culture_tt$,X #L науа#!#!, потомки чичимеков, переселились в центр Мексики из своей мифической прародины — Ацтлана. Среди этих переселенцев был и наш народ. Как и многие другие науа, мы основали собственный #TOOLTIP:GOVERNMENT_REFORM,altepetl,X #L альтепетль#!#!, который получил название #TOOLTIP:LOCATION,tenochtitlan,X #L Теночтитлан#!#!. Он расположен на искусственном острове посреди #TOOLTIP:LOCATION,texcoco_lake,X #L озера Тескоко#!#!.\n\nПри этом наши правители оказались под сильным влиянием #TOOLTIP:CULTURE,$toltec_culture_tt$,X #L тольтекской#!#! культуры, что способствовало развитию нашей озёрной цивилизации. Соседи также признали нас искусными воинами, ведь наше мастерство превратило армии [GetFormableCountry('AZT').GetName] в грозную силу потомков Атцлана…\n\nСейчас мы служим вассалами альтепетля #ONCLICK:COUNTRY,[GetCountry('TEP').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('TEP').Custom('CL_tt')],X [GetCountry('TEP').Custom('CL_GEN')|L]#!#!, а потому наши возможности для расширения ограничены окрестными территориями. В такой ситуации только мудрый и способный правитель сможет привести [GetFormableCountry('AZT').GetName] к покорению долины Мехико и земель за её пределами. Может, [Select_CString(GetCountry('TNC').GetGovernment.GetRuler.IsFemale, 'ей', 'им' )] окажется [GetCountry('TNC').GetGovernment.GetRuler.GetShortName]?"
 country_history_CHA:0 "[GetCountry('CHA').GetName] — это группа разрозненных, полуавтономных тямских княжеств, объединившихся в [GetCountry('CHA').Custom('rank_ru_ACC')|l]. [GetCountry('CHA').GetLongNameWithNoTooltip] — единственная #TOOLTIP:RELIGION,$hindu_tt$,X #L индуистская#!#! держава в #TOOLTIP:REGION,indochina_region,X #L Индокитае#!#!, поэтому ей постоянно угрожают коварные и агрессивные враги: [GetCountry('KHM').GetLongName] на западе и [GetCountry('DAI').GetLongName] на севере. Однако, несмотря на внешние опасности, [GetCountry('CHA').GetAdjectiveWithNoTooltip|l]ий народ смог нажить огромные богатства, используя свой флот как для торговли, так и для пиратских налётов в морях #TOOLTIP:REGION,indonesia_region,X #L Индонезии#!#!.\n\nНекогда это был союз разрозненных племён, но теперь [GetCountry('CHA').GetName] — это мощная сила, с которой придётся считаться. Сможет ли эта страна занять место во главе всех держав?"
 country_history_CHI:0 "[GetCharacter('kublai_khan').GetName] [Select_CString(GetCharacter('kublai_khan').IsFemale, 'основала', 'основал' )] [GetCountry('CHI').Custom('longname_ru_ACC')], а сегодня его необъятная империя уже простирается до самого горизонта. Под властью своего легендарного правителя она подчинила себе весь Китай, а также достигла невероятных высот славы и великолепия.\n\nОднако в последнее время её влияние в регионе ослабевает, а на смену процветанию пришли междоусобицы, бунты и культурные разногласия. Враги вокруг набирают силы, чтобы низвергнуть державу и присвоить её мандат себе. С помощью заговоров и происков [GetCountry('CHI').Custom('predlog_vvo')] [GetCountry('CHI').Custom('CL_PREP')] эти предатели стремятся отыскать у империи слабое место, чтобы урвать себе крупицу власти и хотя бы одну строчку на страницах истории. Но сколько бы таких выскочек не пытались добиться славы, восседать на Троне Дракона и исполнять волю Небес может лишь один правитель."
 country_history_CSU:0 "Наш первый вождь, ведомый богом солнца Инти, основал #TOOLTIP:LOCATION,qusqu,X #L Куску#!#! в том самом месте, где коснулся земли его золотой посох. После многих столетий соседства с другими племенами #TOOLTIP:CULTURE,$inka_culture_tt$,X #L инки#!#! наконец-то взяли верх над ними и завоевали право называться сынами этих чудесных мест. Огромные вулканы и бурные реки Анд скрывают и питают Священную долину инков, где мы, сыны Солнца, живём в ожидании обещанного светлого будущего в нашем величественном городе. Нас окружают непреодолимые стены гор и плодородные террасные поля, а другие народы с завистью взирают на наши богатства.\n\nМы долгие годы набирали силу и укрепляли свою власть, и теперь пришло время сокрушить соседей, чтобы расширить свои владения за пределы долины и отправиться вдоль гор для порабощения всего мира. Вопрос лишь в том, сможем ли мы осилить этот великий поход, или враги уничтожат нас прежде, чем мы достигнем могущества?"
 country_history_FRA:0 "[GetCharacter('fra_charles_iv_capet').GetShortName] умер в 1328 году, не оставив наследника мужского пола, и так закончилось правление #L Капетингов#! в [GetCountry('FRA').Custom('longname_ru_PREP')]. Следующим корону получил [GetCharacter('fra_philip_vi_valois').GetName], родич покойного короля из младшей ветви династии. Однако [GetCharacter('eng_edward_iii').GetName] из #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! оспаривает его власть, утверждая, что #TOOLTIP:HEIRSELECTION,salic_law,X #L Салический закон#!#! хоть и отстраняет самих женщин от престолонаследия, но не отменяет право на корону по женской линии. [GetCharacter('eng_isabella_of_france').GetName], последняя из живых сестёр предыдущего короля, приходится ему матерью, поэтому он решил заявить о своих законных притязаниях на [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ий трон.\n\n[GetCharacter('sco_david_ii').GetName], юный правитель #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!, недавно попросил у нас убежища, это усугубляет и без того сложные отношения между нашими королевствами. Предоставив ему защиту, мы вызвали гнев [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ого двора, который поддерживает #ONCLICK:COUNTRY,[GetCountry('SBL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SBL').Custom('CL_tt')],X [GetCountry('SBL').Custom('CL_ACC')|L]#!#! — ещё одного претендента на [GetCountry('SCO').GetAdjectiveWithNoTooltip|l]ую корону. [GetCharacter('eng_robert_iii_artois').GetName], осуждённый в #TOOLTIP:LOCATION,paris,X #L Париже#!#! за притязания на [GetCountry('ARS').Custom('longname_ru_ACC')], в то же время бежал в Англию, где его тепло принял [GetCharacter('eng_edward_iii').GetShortNameWithNoTooltip]. По слухам, [GetCharacter('eng_robert_iii_artois').GetShortNameWithNoTooltip] подстрекает своего гостеприимного хозяина захватить [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ий престол силой…\n\nЕсли отношения продолжат накаляться, [GetCharacter('fra_philip_vi_valois').GetShortNameWithNoTooltip] будет вынужден обратиться за помощью к своим ленникам. Однако многие амбициозные #TOOLTIP:SUBJECT_TYPE,appanage,X #L апанажи#!#!, образованные ещё старой королевской династией, могут воспользоваться тяжёлым положением короны и потребовать новых привилегий за свою помощь, что рискует стать большей угрозой, чем наличие внешнего врага. Так или иначе, судьба [GetCountry('FRA').Custom('CL_GEN')] определится в ближайшие годы. Нам предстоит одновременно решать вопрос и с внешней [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ой угрозой, и с дерзкой [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ой знатью. Удастся ли [GetCountry('FRA').Custom('CL_DAT')] выстоять перед лицом трудностей и стать главной силой #TOOLTIP:CONTINENT,europe,X #L Европы#!#!?"
 country_history_HOL:0 "$country_history_low_countries_common$\n\nНаша держава зародилась на жалких болотах, но постепенно [GetCountry('HOL').GetLongName] превратил[GetCountry('HOL').Custom('endlong_assya')] в серьёзного претендента на региональное господство. Появление династии #L Авенов#! выгодно сблизило нас [GetCountry('HAI').Custom('predlog_sso')] [GetCountry('HAI').Custom('longname_ru_INST')], и мы уже направили взор на [GetCountry('FRI').Custom('longname_ru_ACC')], планируя расширить владения. Однако наши [GetCountry('HOL').GetGovernment.GetEstateName('nobles_estate')|l] и [GetCountry('HOL').GetGovernment.GetEstateName('burghers_estate')|l] вновь грызутся между собой, что всегда пагубно сказывается на делах…"
 country_history_POL:0 "[GetCountry('POL').GetLongName] веками страда[GetCountry('POL').Custom('endlong_etyut')] от войн, династических распрей и переменчивых границ. Нынешний правитель [GetCharacter('pol_casimir_iii_piast').GetName] начал своё энергичное правление в 1333 году, но несмотря на все его усилия по объединению державы, многие [GetCountry('POL').GetAdjectiveWithNoTooltip|l]ие ленники продолжают отстаивать свои традиционные свободы в противовес дипломатическим устремлениям, которые лелеет [GetCountry('POL').GetGovernment.GetRulerTitle|l]. Тем не менее, желая изменить жизнь и законы в стране, [GetCharacter('pol_casimir_iii_piast').GetShortNameWithNoTooltip] уже [Select_CString(GetCharacter('pol_casimir_iii_piast').IsFemale, 'закрепила', 'закрепил' )] некоторые права за #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейским#!#! меньшинством страны, как и за [GetCountry('POL').GetAdjectiveWithNoTooltip|l]ими крестьянами, заслужив себе прозвище «[GetCountry('POL').GetGovernment.GetRulerTitle] холопов».\n\nОднако не стихает война против [GetCountry('TEU').Custom('longname_ru_GEN')], в которой [GetCharacter('pol_casimir_iii_piast').GetShortNameWithNoTooltip] и [GetCharacter('lit_gediminas_gediminids').GetName] сражаются плечом к плечу против общего врага, надеясь вернуть занятые им земли.\n\nСможет ли [GetCountry('POL').GetGovernment.GetRuler.GetName|l] установить прочный мир [GetCountry('TEU').Custom('predlog_sso')] [GetCountry('TEU').Custom('longname_ru_INST')] и продолжить свои внутренние реформы, или война будет и дальше разорять [GetCountry('POL').GetAdjectiveWithNoTooltip|l]ие земли?"
 country_history_POR:0 "[GetCountry('POR').GetLongName] получил[GetCountry('POR').Custom('endlong_fem')] независимость после долгой и напряжённой борьбы как с #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманскими#!#!, так и с #TOOLTIP:RELIGIONGROUP,christian,X #L христианскими#!#! правителями #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!. После того, как [GetCharacter('por_dinis_i_portugal').GetShortName] провёл важные социальные, экономические и культурные реформы, его сын и наследник [GetCharacter('por_afonso_iv_portugal').GetName], а также весь #TOOLTIP:CULTURE,$portuguese_tt$,X #L португальский#!#! народ теперь стоят перед новыми задачами и возможностями.\n\nНа западе и юге простирается бескрайний #TOOLTIP:REGION,north_atlantic_ocean_region,X #L Северный Атлантический океан#!#!, благодаря чему мы можем торговать с дальними землями. На востоке лежит могущественная держава — [GetCountry('CAS').GetLongName] — которая связана [GetCountry('POR').Custom('predlog_sso')] [GetCountry('POR').Custom('CL_INST')] тесными династическими узами. Она может стать как помешать, так и помочь объединению Иберии под португальским началом.\n\nКак бы то ни было, [GetCountry('POR').Custom('CL_DAT')] предстоит укрепить позиции, чтобы гарантировать себе независимость в будущем."
 country_history_baltic_german:0 "Вместе [GetCountry('TEU').Custom('predlog_sso')] [GetCountry('TEU').Custom('longname_ru_INST')], нашими братьями по оружию, мы готовы выполнить священную миссию — привести Северную #TOOLTIP:CONTINENT,europe,X #L Европу#!#! к свету христианства. При поддержке #TOOLTIP:CULTUREGROUP,german_group,X #L немецких#!#! рыцарей и аристократов наша держава должна не только обратить язычников к свету истинной веры, но и защитить тех, кто уже принял #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#!. К сожалению, #L [GetCountry('LIT').GetAdjective|l]ое#! сопротивление всё ещё сильно, а другие страны, например, [GetCountry('DAN').GetLongName], легко могут использовать наше противостояние в собственных алчных целях.\n\nНаше будущее неразрывно связано с христианской проповедью, однако нам также стоит думать и о других материях помимо обращения язычников. Должны ли мы обратить свои усилия против #TOOLTIP:RELIGION,$orthodox_tt$,X #L православных#!#! схизматиков, или же наше государство следует реформировать?"
 country_history_bohemian:0 "Веками наши земли находились в сфере влияния #ONCLICK:COUNTRY,[GetCountry('BOH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOH').Custom('CL_tt')],X [GetCountry('BOH').Custom('CL_GEN')|L]#!#!, ими часто правили князья из богемских правящих родов. Династия, к которой причисляет себя [GetCountry('BOH').GetGovernment.GetRuler.GetName|l], поддерживала эту традицию [GetCountry('MVA').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('MVA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MVA').Custom('CL_tt')],X [GetCountry('MVA').Custom('CL_PREP')|L]#!#! после коронации, однако земли #TOOLTIP:PROVINCE_DEFINITION,niederlausitz_province,X #L Нижней Лужицы#!#! были потеряны в пользу [GetCountry('BRA').Custom('longname_ru_GEN')], а эта держава изо всех сил стремится укрепить своё влияние [GetCountry('SOR').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('SOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SOR').Custom('CL_tt')],X [GetCountry('SOR').Custom('CL_PREP')|L]#!#!.\n\nДальнейший приток #TOOLTIP:CULTUREGROUP,german_group,X #L немецких#!#! поселенцев может привести больше людей в наши земли, но если правителям не удастся сохранить свой суверенитет, в недалёком будущем это может поставить их власть под угрозу."
 country_history_france:0 "Два великих королевства борются за #TOOLTIP:REGION,france_region,X #L Францию#!#!. На протяжении десятилетий #L [GetCountry('FRA').GetAdjective|l]ая#! корона пыталась утвердить свою власть над могущественными вассалами. В это же время по другую сторону Ла-Манша #L [GetCountry('ENG').GetAdjective|l]ие#! короли угрожали целостности [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]их земель. Угли старых войн могут разгореться ярче прежнего, на горизонте нависает тень эпохи невзгод.\n\nГрядущие десятилетия станут проверкой на прочность, когда [GetCharacter('eng_edward_iii').GetShortName] направит [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ие армии [GetCountry('FRA').Custom('predlog_vvo')] [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ие земли. Союзы ненадёжны, и великие дома #L Валуа#! разрываются между верностью и амбициями."
 country_ruler_title_ACC:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_ACC')]"
 country_ruler_title_DAT:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_DAT')]"
