 join_foreign_order_of_chivalry_past:0 "[SCOPE.sCountry('target').GetActiveChivalricOrder.GetNameWithNoTooltip]"
 join_the_imperial_side_hw_action_desc:0 "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] вед[GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('endlong_etut')] тяжёлую борьбу с ересью, и наша задача — помочь стереть эту заразу с лица #TOOLTIP:CONTINENT,europe,X #L Европы#!#!!"
 king_in_prussia.1.desc:0 "Вслед за возвышением нашей великой страны [target_character.GetName] [Select_CString(target_character.IsFemale, 'заявила', 'заявил')] о своих намерениях возвести #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! в ранг #TOOLTIP:COUNTRY_RANK,rank_kingdom,X #L королевства#!#!, а себя провозгласить [Select_CString(target_character.IsFemale, 'королевой', 'королём')]. [Select_CString(target_character.IsFemale, 'Княгиня', 'Князь')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской империи#!#! считает, что было бы неподобающе не узнать мнение [Select_CString(emperor_character.IsFemale, 'императрицы', 'императора')] по этому вопросу, поэтому [Select_CString(target_character.IsFemale, 'составила', 'составил')] предложение, с которым стоит внимательно ознакомиться."
 lat_limited_conversion_efforts_desc:0 "[GetCountry('LAT').GetLongName] законодательно закрепля[GetCountry('LAT').Custom('endlong_etyut')] политику насаждения веры, которую [GetCountry('PAP').GetLongName] вед[GetCountry('PAP').Custom('endlong_etut')] по отношению к #TOOLTIP:RELIGION,$orthodox_tt$,X #L православным#!#!, однако на местах следовать ей не обязательно."
 lat_orthodox_status_with_the_empire:0 "Статус православия в [GetCountry('LAT').Custom('longname_ru_wntt_PREP')]"
 lat_reintegrate_province:0 "Реинтеграция [GetCountry('LAT').Custom('predlog_sso')] [GetCountry('LAT').Custom('longname_ru_wntt_INST')]"
 latinization_vs_hellenization.13.desc:0 "Знатные жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] обратились ко двору с просьбой дать им право собирать собственный городской совет. Они указывают на опыт самоорганизуемых коммун в итальянских городах как на доказательство того, что самоуправление — залог процветания. Если пойти на уступки, это ослабит контроль со стороны центральной власти и подтолкнёт [ROOT.GetCountry.Custom('rank_ru_ACC')|l] к латинским моделям управления, однако отказ может настроить против нас влиятельные слои общества."
 latinization_vs_hellenization.17.desc:0 "Благодаря дружбе [target_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и растущим связям между нашими дворами [Select_CString(target_character.IsFemale, 'одна бывалая', 'один бывалый' )] #L [target_culture.GetName|l][Select_CString(target_character.IsFemale, 'ая', 'ий' )]#! [Select_CString(target_character.IsFemale, 'воительница изъявила', 'воин изъявил' )] желание встать под наши знамёна. [target_character.GetSheHe|U] сможет поделиться с нами знаниями военного дела латинского Запада."
 latinization_vs_hellenization.25.desc:0 "Летописцы жалуются на упадок культурной жизни [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Меценатство выходит из моды, традиции забываются, а произведения, некогда вдохновлявшие людей, пылятся в библиотеках и архивах. Неужто мы утратили связь с великой культурой своих предков?"
 lesson_economy_4_desc:0 "[markets_with_icon|e] никогда не бывают полностью изолированными друг от друга. Движение [Concept('goods_with_icon', 'товаров')|e] между двумя [Concept('markets', 'рынками')] называется [Concept('trade_with_icon', 'торговлей')|e].\n\n[countries_with_icon|e] могут перемещать [Concept('goods', 'товары')] между [Concept('markets', 'рынками')], расходуя на это [Concept('merchant_capacity_with_icon', 'торговый потенциал')|e] и получая при этом прибыль или убыток. Кроме того, @burghers! #TOOLTIP:POPTYPE,burghers,X #L горожане#!#!, живущие на рынке, ведут собственную [Concept('trade', 'торговлю')].\n\nПо умолчанию торговля @automation! #high автоматизирована#! на всех [Concept('markets', 'рынках')], то есть, весь ваш [Concept('merchant_capacity', 'торговый потенциал')] на [Concept('market', 'рынке')] будет автоматически задействоваться для наиболее выгодных сделок. Мы советуем доверить [Concept('trade', 'торговлю')] автоматизации, пока вы не освоитесь в игре.\n\nКогда придёт время, вы сможете подробнее познакомиться с [Concept('trade', 'торговлей')] здесь:\n$TAB$[Link('hints', 'selected_hint = hint_trade_with_icon', 'Совет о торговле')]."
 lesson_location_5_desc:0 "[Concept('control_with_icon', 'Контроль')|e] над [Concept('location_with_icon', 'районом')|e] напрямую зависит от его [Concept('proximity_with_icon', 'досягаемости')|e] по отношению к вашей [Concept('capital_with_icon', 'столице')|e].\n\nВот почему [Concept('capital', 'столица')] является одним из важнейших [Concept('locations', 'районов')]: здесь у вас всегда много [Concept('control', 'контроля')], а значит, местные [Concept('buildings_with_icon', 'сооружения')|e] и места [Concept('rgo_with_icon', 'добычи ресурсов')|e] приносят вам наибольший [Concept('income_with_icon', 'доход')|e].\n\n@hint! Узнать больше о [Concept('proximity', 'досягаемости')] и [Concept('proximity', 'контроле')] можно [Link('hints', 'selected_hint = hint_control', 'здесь')]."
 lieutenancy_dlc_tt:0 "Количество #TOOLTIP:BUILDING_TYPE,lieutenancy,X #L лейтенантств#!#! [SCOPE.sCountry('actor').Custom('predlog_vvo')] [SCOPE.sCountry('actor').Custom('CL_PREP')] меньше [SCOPE.sCountry('actor').GetModifierValue('num_lieutenancy')] (сейчас: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('lieutenancy')|V])"
 lieutenancy_tt:0 "Если совокупное число #TOOLTIP:BUILDING_TYPE,local_governor,X #L домов губернаторов#!#! и #TOOLTIP:BUILDING_TYPE,lieutenancy,X #L лейтенантств#!#! [SCOPE.sCountry('actor').Custom('predlog_vvo')] [SCOPE.sCountry('actor').Custom('CL_PREP')] меньше [SCOPE.sCountry('actor').GetModifierValue('num_local_governors')] (дома губернаторов: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('local_governor')|V], лейтенантства: [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('lieutenancy')|V])."
 lit_all_lithuanian_nobles_gain_pop_satisfaction_tt:0 "[Concept('pop_satisfaction', 'Довольство')|e] всех #L [ROOT.GetCountry.GetCulture.GetName|l]их#! [Concept('pops', 'групп населения')|e] повысится на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 lit_all_primary_culture_pops_gain_satisfaction_tt:0 "[Concept('pop_satisfaction', 'Довольство')|e] всех #L [ROOT.GetCountry.GetCulture.GetName|l]их#! [Concept('pops', 'групп населения')|e] в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! повысится на [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%]"
 location_suffix_belarusian:0 "ский"
 location_suffix_novgorodian:0 "ский"
 location_suffix_russian:0 "ский"
 location_suffix_ukrainian:0 "ский"
 lots_of_lollards:0 "Многие [ROOT.GetCountry.GetCulture.GetName|l]ие#! [Concept('pops', 'группы населения')|e] #TOOLTIP:REGION,great_britain_region,X #L Великобритании#!#!, исповедующие #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#!, перейдут в #TOOLTIP:RELIGION,$lollardy_tt$,X #L лоллардизм#!#!"
 lutheranism_events.2.desc:0 "[reformer.GetName], один из самых известных сторонников Реформации в нашей стране, бежал [from.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[from.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from.Custom('CL_tt')],X [from.Custom('CL_ACC')|L]#!#!, заявив, что он опасается преследования со стороны наших #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! властей. Теперь этот человек критикует в своих памфлетах не только католическую церковь, но и свою родину."
 maintain_trunk_road_cabinet_action_action:0 "Содержание Великого колёсного пути [SCOPE.sCountry('actor').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_PREP')|L]#!#!"
 manden_kurufa_reform_desc:0 "$manden_kurufa_reform$, или Манденская Федерация, — форма правления в [GetCountry('MAL').Custom('longname_ru_PREP')]. Всё началось с так называемых #italic «Двенадцати дверей»#! — личных владений мансы. Впоследствии к ним присоединился целый ряд союзных и покорённых стран, каждая из которых обладала политическим влиянием в масштабе государства."
 merge_colonies_act:0 "Объединение #ONCLICK:COUNTRY,[SCOPE.sCountry('colony_absorber').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('colony_absorber').Custom('CL_tt')],X [SCOPE.sCountry('colony_absorber').Custom('CL_GEN')|L]#!#! [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!"
 mfa_if_we_conquer_enough_in_20_years:0 "Если [ROOT.GetCountry.GetName] довед[ROOT.GetCountry.Custom('end_etut')] численность [population_i|e] [Concept('population', 'населения')|e] хотя бы до #W [DisplayPopulationNumber('(CFixedPoint)500')]#! в течение #W 20#! лет, держава получит [SCOPE.ScriptValue('prestige_mild_bonus')|+=] к [prestige_i|e] [Concept('prestige', 'престижу')|e] и [Concept('modifier', 'модификатор')|e] «[ShowModifier('mfa_elevation_modifier')]» на #W 40#! лет; кроме того, возможно также повышение её ранга до #TOOLTIP:COUNTRY_RANK,rank_duchy,X #L герцогства#!#!, если он ниже, чем герцогство\nЕсли [ROOT.GetCountry.GetName] не смо[ROOT.GetCountry.Custom('end_gegu')] этого добиться, держава получит [SCOPE.ScriptValue('prestige_extreme_penalty')|+=] к [prestige_i|e] [Concept('prestige', 'престижу')|e] и [SCOPE.ScriptValue('stability_weak_penalty')|+=] к [stability_i|e] [Concept('stability', 'стабильности')|e], а все соседи получат [Concept('casus_belli', 'повод для войны')|e] против неё «[ShowCasusBelliName('cb_cut_down_in_size')]»"
 mission_peace_integrate_province_tip:0 "@arrow_bonus_tier_2! Перейдите на [Link('government', 'tabcontent = cabinet_with_icon', 'Панель правительства > Совет')], чтобы увидеть ваш [Concept('cabinet_with_icon', 'совет')|e].\n\n@arrow_bonus_tier_1! Поручите [Concept('cabinet_member', '@cabinet_member! члену совета')|e] [Concept('cabinet_action', 'задание')|e] по #TOOLTIP:CABINET_ACTION,integrate_province,X #L интеграции провинции#!#!.\n\n#italic Подробнее об этом можно почитать здесь: [Link('hints', 'selected_hint = hint_has_conquered_provinces_with_icon', '$hint_has_conquered_provinces$')]."
 mission_raise_literacy_tip:0 "Существует несколько способов повысить [Concept('literacy_with_icon', 'грамотность')|e] в вашей [Concept('country_with_icon', 'державе')|e]:\n$TAB$@arrow_bonus_tier_1! увеличение числа [Concept('pops_with_icon', 'групп населения')|e], принадлежащих к [Concept('upper_class', 'высшему обществу')|e], за счёт строительства [Concept('buildings_with_icon', 'сооружений')|e] на [Link('production', '', '@production_panel! Панели производства > Сооружения')];\n$TAB$@arrow_bonus_tier_1! строительство #TOOLTIP:BUILDING_TYPE,library,X #L библиотек#!#! в ваших самых густонаселённых [Concept('locations', 'районах')];\n$TAB$@arrow_bonus_tier_1! изучение [Concept('advances_with_icon', 'улучшений')|e], которые повышают [Concept('literacy', 'грамотность')] (это можно сделать на [Link('technology_view', '', '@advances_panel! панели улучшений')]);\n$TAB$@arrow_bonus_tier_1! улучшение [Concept('rural_locations', 'сельских районов')|e] до [Concept('urban_locations', 'городских районов')|e].\n\n#italic Проверить ваш текущий уровень [Concept('literacy', 'грамотности')] можно на @advances_panel![Link('advances', '', 'панели улучшений')]#!."
 mll_conditions_for_castile_support_tt:0 "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country_2.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country_2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_2.Custom('CL_tt')],X [target_country_2.Custom('CL_INST')|L]#!#! до #G +150#!, эта страна получит #G +50#! к принятию любого нашего движения за независимость"
 mll_conditions_for_genoa_support_tt:0 "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country_4.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country_4.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_4.Custom('CL_tt')],X [target_country_4.Custom('CL_INST')|L]#!#! до #G +100#!, эта страна получит #G +50#! к принятию любого нашего движения за независимость"
 mll_conditions_for_naples_support_tt:0 "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country_3.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country_3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_3.Custom('CL_tt')],X [target_country_3.Custom('CL_INST')|L]#!#! до #G +120#!, эта страна получит #G +50#! к принятию любого нашего движения за независимость"
