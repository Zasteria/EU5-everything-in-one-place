 coup_attempt.5.c:0 "Мы не можем ставить под удар #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий#! род."
 coup_attempt.7.desc:0 "Махинации Тайного совета вместе с подкупами и тщательными расследованиями помогли нам раскрыть имена тех, кто строил против нас заговор. Их судьбы теперь в наших руках. Одни советники считают, что [target_character_2.GetName] и [Select_CString(target_character_2.IsFemale, 'её', 'его' )] сообщники заслуживают скорой расправы. Другие же убеждают проявить милосердие и держать этих опасных персон поближе к себе, чтобы потом ими манипулировать."
 court_flavor_events.40.desc:0 "Прибывшая к нам #L [GetCountry('PAP').GetAdjective|l]ая#! делегация передаёт слова своего руководства, сохраняя при этом крайне серьёзный вид: «[Select_CString(target_pope.IsFemale,'Её', 'Его')] Святейшество [target_pope.GetName] знает, что вы укрываете у себя в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] еретика». Посланники требуют, чтобы мы немедленно передали [Select_CString(advisor.IsFemale,'её', 'его')] инквизиции, иначе [target_pope.GetShortNameWithNoTooltip] сочтёт нас отступниками от истинного пути и будет [Select_CString(target_pope.IsFemale,'вынуждена', 'вынужден')] принять против нас все необходимые меры."
 culture_greek.22.d:0 "В [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] нет места православным традициям."
 culture_greek.22.title:0 "Празднество в честь Богородицы в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 culture_greek.23.desc:0 "Влияние [target_location.Custom('LR_GEN')|l] [target_location.GetName] в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! становится всё более ощутимым для всех, особенно для чиновников из [target_capital.Custom('LR_GEN')|l] [target_capital.GetName]. Их весьма занимает вопрос, каким образом этот [target_location.GetRank.GetName|l] из области [target_area.GetName] смог возвыситься, причём во многом ему покровительствовали [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] и различные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Мелкие чиновники и состоятельные [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] пользуются возможностями, которые предоставляет им [target_location.GetRank.GetNameWithNoTooltip|l], а местные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] утопают в роскоши.\n\nНо если для одних это источник довольства, то для других — повод для серьёзных раздумий, поскольку растущее влияние региона подрывает положение облечённых властью в [target_capital.Custom('LR_PREP')|l] [target_capital.GetName] и других местах, тем самым нарушая политическое равновесие во всей державе."
 culture_percentage_in_country_greater_or_equal:0 "Процент групп населения указанной культуры не меньше $NUM|Y%2$"
 culture_percentage_in_country_greater_than:0 "Процент групп населения указанной культуры больше $NUM|Y%2$"
 decline_of_mali.4.b.tt:0 "[Concept('pops', 'Группы населения')|e] в провинции [target_province.GetName] присоединяются к группе «[mal_provoked_military_forces.GetName]» и получают [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 dop_law_state_council_desc:0 "Государственный совет — это высший совещательный орган [GetFormableCountry('RUS').GetName]. Он создан в качестве промежуточного звена между самодержавием и губернскими думами, введёнными в ходе #TOOLTIP:GOVERNMENT_REFORM,speransky_liberalization_reform,X #L либеральных реформ Сперанского#!#!. Совет рассматривает предлагаемые законы, а также контролирует исполнение бюджета и государственные расходы, однако не имеет права предлагать изменения. Вместо этого он даёт рекомендации по рассматриваемым вопросам."
 dynastic.1.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] находится во власти чар [Select_CString(devil_char.IsFemale, 'коварной обольстительницы', 'коварного обольстителя')]. [devil_char.GetName] является даже по ночам, когда заканчиваются [ROOT.GetCountry.GetGovernment.GetAdjective|l]ие дела и пустеют залы, — но только во снах, отчего [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] страшно терзается. С каждым днём бороться с искушением становится сложнее. Никому не ведомо, попросит ли [ruler_char.GetShortName] этим воскресеньем простить [Select_CString(ruler_char.IsFemale, 'ей', 'ему')] не только грешные помыслы…"
 dynastic.14.b.nickname:0 "Ложный"
 election.2.desc:0 "[ROOT.GetCountry.GetLongName] без правителя. [ROOT.GetCountry.GetGovernment.GetRulerTitle] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'скончалась', 'скончался')], и нам нужно проводить выборы. Избрание большинством голосов оставляет простор для коррупции или, что ещё хуже, для популизма. После многоэтапного тайного выбора кандидатов мы решили, кто будет нами править. Выборы происходили практически случайным образом."
 encourage_societal_value_towards:0 "Поддержать $SOCIETALVALUE_VALUE_ACC$ с помощью действий совета"
 every_pop_25_satisfaction_gain_tt:0 "Все крестьянские [Concept('pop', 'группы населения')|e] в [Concept('province', 'провинции')|e] [target_province.GetNameWithNoTooltip] получат [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 fate_of_the_phoenix.1.desc_b:0 "Мы получили вести из #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#!. Похоже, в древней столице сейчас неспокойно: её могущество ослабевает вследствие раздора и упадка. На протяжении веков пример #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! держал в узде #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! земли #TOOLTIP:REGION,balkan_region,X #L Балкан#!#!, объединяя нас на почве веры и предотвращая большинство конфликтов.\n\nТеперь, когда хватка Константинополя уже не так сильна, равновесие на наших границах становится всё более неустойчивым. Некоторые влиятельные семьи предупреждают, что падение этого столпа пошатнёт всю конструкцию. Другие высказываются более прямо: прежние договорённости перестают действовать и то, что прежде регулировалось традицией, скоро будет решаться силой. То, какой путь мы выберем в эти трудные времена, повлияет на мир далеко за пределами [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 fate_of_the_phoenix.4.desc:0 "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetName], колыбель #L [GetCountry('TUR').GetAdjective|l]ой#! власти, уступает натиску империи. Эта территория не только приносила хорошую дань, но и служила беям источником силы и авторитета. Захват #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! — чёткий сигнал всей #TOOLTIP:REGION,anatolia_region,X #L Анатолии#!#!: времена изменились, и [ROOT.GetCountry.GetFlavorRank|l] выход[ROOT.GetCountry.Custom('endrank_ityat')] из глухой обороны."
 flavor_bav.1400.desc:0 "Опасаясь городских бунтов, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'велела', 'велел' )] построить на окраине [target_location.Custom('LR_GEN')|l] [target_location.GetName] новую крепость — замок Нойвесте. Со временем [target_ruler.GetNameWithNoTooltip] и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] [target_country.GetGovernment.GetCourtTitle|l] обосновались в крепости на постоянной основе, превратив её в [target_country.GetGovernment.GetAdjective|l]ую резиденцию."
 flavor_byz.60.desc:0 "[target_character.GetName] и [target_character2.GetName] издавна были очень близки, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(target_character2.IsFemale, 'считала', 'считал' )] [target_character.GetHerHis] своей правой рукой. Когда [target_character2.GetNameWithNoTooltip] и [target_character2.GetHerHis] дед [GetCharacter('byz_andronikos_ii_palaiologos').GetName] затеяли конфликт, [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character2.IsFemale, 'поддержала', 'поддержал' )] первого, проявив себя верным товарищем и способным государственным деятелем.\n\nМногие считают, что [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'достойна', 'достоин' )] занять должность [Select_CString(target_character.IsFemale, 'императрицы-соправительницы', 'императора-соправителя' )], — и [target_character2.GetNameWithNoTooltip] действительно не раз [Select_CString(target_character2.IsFemale, 'предлагала', 'предлагал' )] [Select_CString(target_character.IsFemale, 'ей', 'ему' )] этот пост, — но [Select_CString(target_character.IsFemale, 'та неизменно отказывалась', 'тот неизменно отказывался' )]."
 flavor_cas.55.desc:0 "[target_character.GetName] — богослов-иезуит, известный представитель #TOOLTIP:BUILDING_TYPE,school_of_salamanca,X #L Саламанкской школы#!#!, — недавно опубликовал свою теорию суверенитета и взаимоотношений между правителем и подданными. Его аргументы в поддержку ограничения полномочий государства и добровольного согласия подданных способны укрепить моральные основы нашего правления, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] опасается, что подобные идеи могут подорвать легитимность [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой власти."
 flavor_chi.2208.desc:0 "Наши шпионы уведомили нас: [expedition_initiator.GetLongName] — эта держава проводит масштабную экспедицию «$expedition_name_treasure_voyage$» во главе которой стоит $expedition_leader_name$. Недавно её члены прибыли во вражеский порт, расположенный в районе $expedition_location_name$. Похоже, они согласились помочь #ONCLICK:COUNTRY,[from.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from.Custom('CL_tt')],X [from.Custom('CL_DAT')|L]#!#! в войне против нас!"
 flavor_chi.83.tooltip:0 "Группа мятежников «[target_rebel.GetName]» заполучит в союзники все #TOOLTIP:POPTYPE,peasants,X #L крестьянские#!#! [Concept('pop', 'группы населения')|e] в [Concept('province', 'провинции')|e] [target_province.GetName], и они получат [ROOT.ScriptValue('pop_satisfaction_mild_penalty')|%=+] к [Concept('pop_satisfaction', 'довольству')|e].\nВсе [Concept('location', 'районы')|e] [Concept('province', 'провинции')|e] [target_province.GetName] на [SCOPE.GetLocalVariable('length_of_agitation').GetValue|2-] г. получат [Concept('location_modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,chi_white_lotus_agitation,X #V #L «Пропаганда „Белого Лотоса“»#!#!."
 flavor_chi.91.desc:0 "#TOOLTIP:POLICY,haijin_policy,X #L Хайцзинь#!#! на территории #ONCLICK:COUNTRY,[from.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from.Custom('CL_tt')],X [from.Custom('CL_GEN')|L]#!#! приводит к оттоку #TOOLTIP:SUB_CONTINENT,china,X #L китайских#!#! купцов. Чтобы выжить, многие обращаются к пиратству и другим незаконным способам заработка. Теперь [target_character.GetName] — человек c немалой известностью в этих краях и значительным политическим весом среди властей #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, — намеревается стать главой новоявленных пиратов."
 flavor_dan.46.desc:0 "#TOOLTIP:ADVANCE_DEFINITION,dan_royal_life_guards,X #L Королевская лейб-гвардия#!#! — церемониальное и охранное подразделение #L [ROOT.GetCountry.GetAdjective]ой#! монархии, — играет ключевую роль в защите и поддержании статуса [ROOT.GetCountry.GetGovernment.GetAdjective]ой семьи. Этот полк не только оберегает наших правителей, но и символизирует несокрушимость королевской власти. Однако с ростом как внутренних, так и внешних угроз наши военные советники всё чаще предлагают усилить королевскую лейб-гвардию и увеличить её состав."
 flavor_dan.50.desc:0 "Мода на абсолютную монархию постепенно захлёстывает #TOOLTIP:CONTINENT,europe,X #L Европу#!#!: короли и императоры проводят реформы по централизации и составляют конституции, чтобы упрочить свою власть. Таким образом, перед нами встаёт вопрос: следует ли [ROOT.GetCountry.Custom('rank_ru_DAT')|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! поступить так же? Нам предложили создать #TOOLTIP:GOVERNMENT_REFORM,dan_the_kings_law,X #L Королевский закон#!#! — конституцию, согласно которой [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] будет [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'единоличной правительницей, на которую', 'единоличным правителем, на которого')] не могут влиять ни [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], ни иные институты. Принятие такого документа приведёт к кардинальным переменам в управлении государством: [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] получит безграничные полномочия, а [ROOT.GetCountry.Custom('CL_ACC')] ждёт приближение к другим абсолютным монархиям, возникающим по всему континенту."
 flavor_eng.25.b:0 "Члены [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] выдвигают ультиматум? Лучше пойти на уступки…"
 flavor_eng.250.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle], не посоветовавшись с двором, [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'расторгла', 'расторг' )] предыдущий брак и [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'обвенчалась', 'обвенчался' )] с другим человеком: теперь [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'её', 'его' )] новый консорт — [ROOT.GetCountry.GetGovernment.GetConsort.GetName]. Кроме того, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'порвала', 'порвал' )] все связи с Римской церковью и [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'объявила', 'объявил' )] себя главой церкви в другой державе."
 flavor_eth.155.a:0 "Земля принадлежит [ROOT.GetCountry.Custom('CL_DAT')]."
 flavor_fra.2014.a:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] своего не добьются."
 flavor_fra.2025.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale,'добилась', 'добился')] выдающихся успехов на должности министра, и [fra_ruler.GetName] признаёт [Select_CString(target_character.IsFemale,'её', 'его')] заслуги. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] всё больше беспокоится о чрезмерном влиянии [Select_CString(target_character.IsFemale,'сановницы', 'сановника')]. Многие придворные возмущены, что [target_character.GetLastNameWithNoTooltip] обладает чуть ли не монополией на большей части рынков #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. По их словам, [target_character.GetLastNameWithNoTooltip] больше заботится о собственном богатстве, чем о пополнении державной казны. Мало того, часть недовольных заявляет, что [target_character.GetLastNameWithNoTooltip] похищает гребцов для своих торговых галер, а также наживается на верфях и легковесных монетах.\n\nТеперь [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] в гневе требует, чтобы [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale,'была заключена','был заключён')] в тюрьму, [Select_CString(target_character.IsFemale,'лишена', 'лишён')] всех должностей и привилегий, а также [Select_CString(target_character.IsFemale,'предстала', 'предстал')] перед судом."
 flavor_fra.429.title:0 "[Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'Неповторимая', 'Неповторимый')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]"
 flavor_fra.521.desc:0 "После того как в державе вновь разрешили вести дискуссии о принятии буллы Unigenitus в качестве закона #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], в лице не переносящих янсенизм советников, начинает открыто осуждать это движение. Ответом на это стал всплеск недовольства янсенистов, многие из которых пользуются большим влиянием среди членов [ROOT.GetCountry.Custom('parliament_ru_GEN')|l]. За обстановкой [ROOT.GetCountry.Custom('end_predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')] внимательно следит [pap_ruler.GetName], поэтому жёсткая борьба против сторонников буллы Unigenitus наверняка вызовет у папского престола гнев. С другой стороны, если позволить советникам-подстрекателям и дальше выражаться в том же духе, недовольство проявится уже в стенах [ROOT.GetCountry.Custom('parliament_ru_GEN')|l], среди сторонников янсенизма."
 flavor_geo.10.desc:0 "Наши дипломаты вернулись домой после долгого и изнурительного путешествия на Запад. Что же [Select_CString(target_country2.GetGovernment.GetRuler.IsFemale, 'ответила', 'ответил' )] [target_country2.GetGovernment.GetRulerTitle|l]? Нам бы очень пригодилась помощь #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_GEN')|L]#!#!.\n\nИ вот печать сломана… В воздухе повисла напряжённая тишина…"
 flavor_geo.2.a:0 "Наладим торговлю с [target_country1.Custom('CL_INST')]."
 flavor_geo.2.b:0 "Лучше обратимся к [target_country2.Custom('CL_DAT')]."
 flavor_geo.2.c:0 "Мы разбогатеем благодаря [target_country3.Custom('CL_DAT')]."
 flavor_geo.28.desc:0 "[target_character2.GetName] родился в семье мелких дворян. Родители описывали его как очень смышлёного и любопытного ребёнка. Его детство прошло в [target_location.Custom('LR_PREP')|l] [target_location.GetName], где он и открыл в себе неодолимую тягу к знаниям. Говорят, он проводил долгие часы за семейными книгами. Оказавшись при дворе, он прочёл все книги, которые были собраны [ROOT.GetCountry.Custom('end_predlog_vvo')] [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой библиотеке. Он начал творить в юном возрасте, и некоторые из его произведений выглядят многообещающе. Если всерьёз взяться за его обучение, из него выйдет прекрасный писатель."
 flavor_hab.2302.desc:0 "Отличные новости из #ONCLICK:COUNTRY,[GetCountry('BUR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BUR').Custom('CL_tt')],X [GetCountry('BUR').Custom('CL_GEN')|L]#!#!! [burgundian_ruler.GetName] принимает наше предложение о браке. Это мудрое решение укрепит союз между нашими великими династиями, а обширные [GetCountry('BUR').GetAdjectiveWithNoTooltip|l]ие земли окажутся под #L [ROOT.GetCountry.GetAdjective|l]им#! контролем, что защитит их от посягательств #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!."
 flavor_hol.23.desc:0 "#L [ROOT.GetCountry.GetCulture.GetName]ое#! государство поддерживает свежие идеи, благодаря чему появляются новые пытливые мыслители, которые находят поддержку единомышленников. В число таких интеллектуалов входит [target_character.GetName], [Select_CString(target_character.IsFemale,'посвятившая', 'посвятивший')] свою жизнь сразу нескольким областям философии."
 flavor_hol.31.desc:0 "Многие жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] мечтают о новом порте. Если вложим средства в его строительство, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] будут благодарны, а мы улучшим своё положение в море."
 flavor_ira.29.desc:0 "Наша столица, [target_capital2.GetName], остаётся желанной целью для многих наших врагов. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] считает, что в случае войны против #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! оборонять #L #TOOLTIP:LOCATIONRANK,[target_capital2.Custom('LR_tt')],X [target_capital2.Custom('LR_ACC')|l]#!#! будет очень сложно. Поэтому многие считают, что [target_capital.GetName] будет лучшим местом для размещения двора и правительства.\n\n[target_character.GetName] видит в этом решении не только стратегические соображения, но и возможность обуздать непокорные аристократические семейства #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Если обеспечить им защиту от врагов, они окажутся у нас в долгу — и мы всегда сможем потребовать ответной услуги."
 flavor_iro.46.b:0 "Распределим излишки по [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]им деревням."
 flavor_iro.65.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл' )] в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName] из #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!, чтобы проповедовать там #TOOLTIP:RELIGION,$catholic_tt$,X #L католическую#!#! веру, а также наладить отношения между [GetCountry('FRA').Custom('CL_INST')] и #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!. Ранее между [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ими воинами и [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ими экспедициями не раз происходили стычки.\n\nКое-кто сомневается в том, что [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'явилась', 'явился' )] с миром — [Select_CString(target_character.IsFemale, 'её', 'его' )] миссионерская деятельность может быть лишь прикрытием…"
 flavor_kie.4.desc:0 "[target_location.GetName] — наш главный культурный центр, где было воспитано множество великих творцов. Одним из них является [target_character.GetName], выдающийся #TOOLTIP:ARTIST,iconographer,X #L иконописец#!#!, известный в религиозных кругах #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#!. Стремясь отойти от устоявшихся традиций и создать собственный стиль, он изъявил желание служить при нашем дворе. Художник надеется, что ему удастся добиться у властей разрешения основать [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! собственное культурное учреждение и тем самым помочь распространению #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! #TOOLTIP:RELIGION,$orthodox_tt$,X #L православной#!#! культуры по всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!."
 flavor_kni.3.desc:0 "На протяжении столетий небольшой, но профессиональный #L [ROOT.GetCountry.GetAdjective]ий#! флот оставался грозой наших многочисленных неприятелей-#L мусульман#!. Он безжалостно расправлялся с вражескими каперами, захватывал #L мусульманские#! торговые корабли, пополнял #L [ROOT.GetCountry.GetCapital.GetAdjective]ую#! казну и нагонял ужас на #L мусульманских#! моряков. Одним из крупнейших его достижений стал захват большой #TOOLTIP:LOCATION,alexandria,X #L александрийской#!#! каракки в [GetCurrentYear] году: трюм этого судна оказался доверху набит несметными богатствами."
 flavor_kor.3.desc:0 "[mongol_aristocrat.GetName] станет [Select_CString(mongol_aristocrat.IsFemale, 'новой представительницей', 'новым представителем')] #L [target_country.GetAdjective|l]ого#! двора в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] и будет следить за деятельностью нашего правительства."
 flavor_kor.6.title:0 "[target_character.GetNameWithNoTooltip] из [target_country.Custom('CL_GEN')]"
 flavor_lit.1000.b:0 "Мы не нуждаемся в [target_country2.GetCulture.GetNameWithNoTooltip|l]ой помощи."
 flavor_lit.31.desc:0 "Волна #TOOLTIP:SITUATION,reformation,X #L Католической Реформации#!#! прокатилась по #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ополчились друг на друга из-за теологических разногласий. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|U], заметив этот разлад, всё чаще считают, что #L [ROOT.GetCountry.GetReligion.GetAdjective]ая#! вера стала непосильным бременем для [ROOT.GetCountry.Custom('rank_ru_GEN')|l].\n\nПо всей державе люди пытаются возродить древние #L [ShowReligionAdjective('romuva')|l]ие#! верования — теперь у простого люда появился шанс избавиться от всех неудобств, которые доставляли [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]. Быть может, это знак, что и [ROOT.GetCountry.GetGovernment.GetCourtTitle] скоро вернётся к старым обычаям."
 flavor_lit.32.desc:0 "С усилением влияния #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! на #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и даже [ROOT.GetCountry.GetGovernment.GetCourtTitle] начали перенимать новую моду. Вдохновлённые #L [target_country.GetCulture.GetName|l]ими#! обычаями, они привносят в [ROOT.GetCountry.Custom('rank_ru_ACC')|l] новые идеи, книги и элементы культуры. Это помогло [ROOT.GetCountry.Custom('CL_DAT')] постепенно отказаться от изоляционизма, познакомив народ с более экзотическими традициями. Однако это также начало размывать #L [ROOT.GetCountry.GetCulture.GetName|l]ую#! культуру, превращая её в некий гибрид с [target_country.GetCulture.GetName|l]ой."
 flavor_lit.34.b:0 "Мы не станем порицать [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ие законы."
 flavor_mam.79.desc:0 "В последние годы имам [target_character.GetName] стал главной фигурой интеллектуальной жизни #TOOLTIP:LOCATION,cairo,X #L Каира#!#!. Все почитают его как мастера хадисов, #TOOLTIP:RELIGIONGROUP,muslim,X #L исламского#!#! права и истории, и его образованность принесла престиж нашему двору и институтам. [Select_CString(target_character.IsFemale, 'Она', 'Он')] пользуется большим уважением за популяризацию изучения хадисов, и [Select_CString(target_character.IsFemale, 'её', 'его')] учения привлекают последователей со всех уголков [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_mlo.51.desc:0 "Наше желание создать единое государство со столицей в центре #TOOLTIP:AREA,lombardy_area,X #L Ломбардии#!#! вынудило нас оставить наш родной [milan_location.GetRank.GetNameWithNoTooltip|l] [milan_location.GetName]. Очевидно, что нам нужна большая резиденция в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Члены [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] предложили возвести пышный дворец, который станет символом новой эпохи."
 flavor_mos.4.b.custom1:0 "Каждая соседняя держава получит #G 3 ед.#! [Concept('trust', 'доверие')|e] к #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_DAT')|L]#!#!"
 flavor_mug.10.desc:0 "В #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! господствует доктрина «[ShowReligiousSchoolName('din_i_ilahi_school')|l]», и многие предлагают создать молитвенный дом для размышлений о разных верованиях. Это место под названием [ShowBuildingTypeName('ibadat_khana')] должно объединить народ [ROOT.GetCountry.Custom('CL_GEN')] с помощью веры и стать истинным воплощением #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманизма#!#! [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_mug.13.desc:0 "Язык #TOOLTIP:LANGUAGE,rajasthani_language,X #L раджастхани#!#! довольно популярен при #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] нуждается в тех, кто сведущ в военном деле. Мы могли бы даровать таким людям более высокое положение в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], но высокопоставленные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], давно пользующиеся влиянием, будут возмущены."
 flavor_mug.7.desc:0 "В армии #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! долгое время ценились не заслуги, а количество земель в собственности. Чтобы сделать эту систему более справедливой, нужно даровать земли и богатства в зависимости от должности и достижений. Безусловно, это нарушит баланс власти в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], но зато значительно улучшит наши сухопутные войска."
 flavor_nap.222.desc:0 "[pope_scope.GetRuler.GetName] убеждается в справедливости наших слов и милостиво уступает нашей просьбе. [ROOT.GetCountry.GetGovernment.GetConsort.GetName] будет полностью восстановлен в правах и взойдёт на престол [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_nor.1.desc:0 "#L [target_character.GetCulture.GetName]ий#! дворянин и рыцарь [target_character.GetName] в прошлом был дроттсете — то есть мог управлять страной в отсутствие короля — и регентом #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Он прямой потомок древней норвежской королевской династии и с 1440 по 1445 год служил начальником крепости Акерсхус. Наконец, [target_character.GetNameWithNoTooltip] — один из главных сторонников антиганзейской политики [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')]."
 flavor_nov.4.desc:0 "[pskov_country.GetName] наконец отправляет нам ответ! [pskov_country.GetGovernment.GetRulerTitle] признаёт наши права на псковские земли и присягает на верность #L [ROOT.GetCountry.GetAdjective|l]ому#! государству. Нам больше не придётся волноваться о том, что [pskov_country.GetNameWithNoTooltip] снова попытается вырваться из-под нашего контроля."
 flavor_pol.23.desc:0 "К счастью, члены нынешнего [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] прислушались к нашим аргументам и решили поддержать нашу политику."
 flavor_pol.24.desc:0 "К сожалению, члены нынешнего [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] не вняли нашим аргументам и выступили против нашей политики."
 flavor_pol.28.desc:0 "Богатство, в том числе наследственное, — действенный инструмент, если пользоваться им в интересах народа. Пример тому — самый знаменитый и старейший университет #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. В его прекрасных стенах, несущих в себе дух Ренессанса, будут воспитываться великие умы, которые проложат нам путь к звёздам, породят и обучат деятелей, способных самостоятельно вершить историю. Но для этого здание потребуется обновить и расширить."
 flavor_pol.46.desc.a:0 "Нам стало известно, что [dead_character.GetName] скоропостижно [Select_CString(dead_character.IsFemale,'скончалась', 'скончался')]. Мы скорбим по [Select_CString(ruler_scope.IsFemale,'покойной', 'покойному')], однако утрата возможности объединить две династии печалит нас ещё больше. Не стоит и говорить, что помолвка, которую заключили между собой [polish_candidate.GetNameWithNoTooltip] и [lithuanian_candidate.GetName], отныне считается несостоявшейся."
 flavor_pol.46.desc.c:0 "Новости о том, что [lithuanian_candidate.GetName] преждевременно [Select_CString(lithuanian_candidate.IsFemale,'вступила', 'вступил')] в брак, сорвали планы объединить две династии — [polish_candidate.GetDynasty.GetName] и [lithuanian_candidate.GetDynasty.GetName]. Чёрт бы побрал всех, кто не умеет держать слово! Теперь помолвка, которую заключили между собой [polish_candidate.GetNameWithNoTooltip] и [lithuanian_candidate.GetNameWithNoTooltip], считается несостоявшейся. Надо изобрести другой способ заманить #ONCLICK:COUNTRY,[GetCountry('LIT').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LIT').Custom('CL_tt')],X [GetCountry('LIT').Custom('CL_ACC')|L]#!#! в свою сферу влияния."
 flavor_rus.26.desc:0 "Перед нами стоит сразу несколько важных задач: перестроить экономику на современный лад, укрепить государственную власть, а вместе с тем — упрочить финансовое положение, поддержать промышленность державы и нарастить экспорт. Для этого потребуется провести череду реформ — только так мы выведем #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! на путь экономического процветания и самодостаточности."
 flavor_rus.51.desc:0 "Дворянин и путешественник по имени [ivan_shuvalov.GetName], проявляющий немалый интерес к искусству, обратился к нам с просьбой посодействовать ему в культурном развитии #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! посредством подражания европейским учреждениям. Шувалов галантен и уверен в себе, а потому наверняка обрадуется возможности поддержать культуру и образование в нашей державе."
 flavor_sco.102.a:0 "Мы прогоним эту [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ую марионетку!"
 flavor_sco.103.desc:0 "Недавняя война между #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_INST')|L]#!#! приковала к себе внимание нашего двора. По условиям Старого союза, в случае нападения [GetCountry('ENG').Custom('CL_GEN')] на одну из сторон, другая обязана вмешаться и вторгнуться на [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ие территории. Хотя [ROOT.GetCountry.GetName] всё ещё оправляется от попыток династии [GetCharacter('sco_edward_balliol').GetDynasty.GetName] захватить корону, некоторые считают, что мы обязаны выполнить свой союзнический долг и напасть на [GetCountry('ENG').Custom('CL_ACC')]."
 flavor_sco.106.a:0 "Из [Select_CString(target_character.IsFemale,'неё выйдет достойная правительница','него выйдет достойный правитель')]."
 flavor_sco.1203.desc_common:0 "Пришло время подобрать достойную супругу для монарха #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!, чтобы обеспечить долгосрочный мир и укрепить наши дипломатические связи с #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_INST')|L]#!#!.\n\nПо условиям Договора о вечном мире, [GetCountry('SCO').GetGovernment.GetRuler.GetName] может взять в жёны любую незамужнюю родственницу [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ого монарха."
 flavor_sco.14.desc:0 "Некоторые члены двора обеспокоены тем, что юный [young_king_david.GetShortName] не приобщается к #L [ROOT.GetCountry.GetAdjective|l]ой#! культуре, находясь в изгнании во #ONCLICK:COUNTRY,[france.Custom('CL_tt')] #TOOLTIP:COUNTRY,[france.Custom('CL_tt')],X [france.Custom('CL_PREP')|L]#!#!. Они опасаются, что по возвращении он будет править державой, как иностранец."
 flavor_sco.210.desc:0 "Стремясь положить конец многовековому сотрудничеству #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!, #L [GetCountry('ENG').GetAdjective|l]ий#! правитель отправил посла с требованием разорвать эту давнюю связь. Хотя изначально Старый союз был предназначен для защиты от [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ой экспансии, [eng_ruler.GetName] утверждает, что союз уже давно утратил свой оборонительный характер, и теперь он якобы служит лишь для того, чтобы [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ие войска использовали [ROOT.GetCountry.Custom('CL_ACC')] как плацдарм для своего вторжения в [GetCountry('ENG').Custom('CL_ACC')].\n\n[eng_ruler.GetNameWithNoTooltip] уверяет, что в случае выполнения требований [ROOT.GetCountry.GetNameWithNoTooltip] может рассчитывать на дружественные и мирные отношения с [GetCountry('ENG').Custom('CL_INST')]. Но если мы откажемся, [Select_CString(eng_ruler.IsFemale,'она', 'он')] может посчитать это угрозой суверенитету своей державы и принять соответствующие меры."
 flavor_sco.301.desc:0 "С момента вступления на престол [sco_ruler.GetName] упорно пытается поддерживать дружественные отношения с [GetCountry('ENG').Custom('CL_INST')]. При этом [target_character.GetName] и [Select_CString(target_character.IsFemale,'её', 'его')] проповеди положили начало Реформации и религиозным конфликтам в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, из-за чего [sco_ruler.GetShortNameWithNoTooltip] [Select_CString(sco_ruler.IsFemale,'вынуждена', 'вынужден')] постоянно отвлекаться на внутренние дела.\n\nХотя [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] прилагает все усилия, чтобы уладить религиозные разногласия внутри страны, многие в совете критикуют [Select_CString(sco_ruler.IsFemale,'её', 'его')] подход. По их мнению, [sco_ruler.GetShortNameWithNoTooltip] уделяет слишком много внимания переговорам с [GetCountry('ENG').Custom('CL_INST')] и пренебрегает проблемами собственного народа, что может привести к ещё большей нестабильности."
 flavor_ser.140.desc:0 "[target_character.GetName] [target_character.GetBirthDate] года рождения — крупный #TOOLTIP:CULTURE,$serbian_tt$,X #L сербский#!#! учёный, писатель и просветитель. Его труды оказали большое влияние не только на сербскую культуру, но и на общеевропейские идеи Просвещения.\n\nПод влиянием западных мыслителей [target_character.GetLastNameWithNoTooltip] занялся обновлением языка и приведением сербской литературы в соответствие с разговорной речью. Произведения, написанные на #L [ROOT.GetCountry.GetReligion.GetLanguage.GetName|l]ом#!, — преимущественно языке богослужения, — прежде были малопонятны для простого народа.\n\nНекоторые члены правительства выступают за то, чтобы предложить учёному должность советника. Их оппоненты утверждают, что [target_character.GetLastNameWithNoTooltip] не представляет из себя ничего особенного."
 flavor_swe.23.desc:0 "Война [target_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! продолжалась успешно, пока большая группа #TOOLTIP:CULTURE,$finnish_tt$,X #L финских#!#! офицеров благородного происхождения, назвавшая себя «Аньяльским союзом», не предала нас. Эти изменники не просто вступили в тайный сговор с врагом: они надеются, что [target_country.GetNameWithNoTooltip] поддерж[target_country.Custom('itat')] их стремление к созданию независимого финского государства.\n\nВ другое время эту проблему можно было бы решить несколькими показательными казнями, но сейчас мы попросту не сможем выиграть войну без этих талантливых командиров. Если же мы закроем на это глаза, офицеры сочтут нас слабыми и станут выдвигать монарху ещё более дерзкие требования. Мы должны найти решение, которое причинит наименьший вред престижу #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! на мировой арене."
 flavor_swe_teu.4.a:0 "$pirate_events.2.a$"
 flavor_tim.9.desc:0 "[target_character.GetName] был великим завоевателем и присоединил к нашей державе обширные земли, однако оказался не самым способным руководителем. Теперь, когда значительная часть нашего населения состоит из #TOOLTIP:CULTUREGROUP,iranian_group,X #L иранцев#!#!, система управления явно нуждается в изменениях. В связи с этим [target_character2.GetName] планирует преобразовать [ROOT.GetCountry.Custom('rank_ru_ACC')|l] в более бюрократическое государство. При этом потомки нашего славного правителя получат должности наместников, чтобы набраться опыта и в будущем взять бразды правления в свои руки. Проблема состоит в том, что для достижения этих целей нам придётся принять многие иранские нормы и внедрить их в своё законодательство, что вряд ли обрадует нашу #L [ROOT.GetCountry.GetCulture.GetName|l]ую#! аристократию."
 flavor_tur.1003.desc:0 "Одержав немало побед, [target_character.GetName] [Select_CString(target_character.IsFemale, 'выделилась', 'выделился' )] среди многих славных воинов и [Select_CString(target_character.IsFemale, 'доказала', 'доказал' )], что [Select_CString(target_character.IsFemale, 'её', 'его' )] единственная цель — служение #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Теперь [Select_CString(target_character.IsFemale, 'её', 'его' )] привлекает новая должность — [ShowSubjectTypeName('uc_bey')] в #TOOLTIP:PROVINCE_DEFINITION,albania_province,X #L Албании#!#!. [target_character2.GetName] и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] высоко ценят талант и заслуги [Select_CString(target_character.IsFemale, 'этой женщины', 'этого человека' )], но опасаются, что дело может закончится мятежом — ведь [Select_CString(target_character.IsFemale, 'она', 'он' )] всё-таки [Select_CString(target_character.IsFemale, 'заложница', 'заложник' )]."
 flavor_tur.1004.desc:0 "[target_character2.GetName], много лет [Select_CString(target_character2.IsFemale, 'прослужившая', 'прослуживший' )] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, [Select_CString(target_character2.IsFemale, 'получила', 'получил' )] титул в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#! и по этой причине [Select_CString(target_character2.IsFemale, 'впала', 'впал' )] в немилость [ROOT.GetCountry.GetAdjective|l]ого двора. [Select_CString(target_character2.IsFemale, 'Она', 'Он' )] хочет создать для #TOOLTIP:CULTURE,$albanian_tt$,X #L албанцев#!#! независимое государство и надеется исполнить свою мечту вопреки нашей воле."
 flavor_tur.1005.desc:0 "Много лет прослужив #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, [target_character.GetName] [Select_CString(target_character.IsFemale, 'осознала', 'осознал' )], что никакие заслуги не позволят [Select_CString(target_character.IsFemale, 'ей', 'ему' )] добиться независимости для #TOOLTIP:CULTURE,$albanian_tt$,X #L албанцев#!#!. Поэтому сейчас [Select_CString(target_character.IsFemale, 'она бежала', 'он бежал' )] в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#!, надеясь получить от этой державы помощь в исполнении своей мечты."
 flavor_tur.68.desc:0 "[target_character.GetName] — один из суфийских мистиков, которого почитают многие [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], и просто прекрасный человек. Дав ему пост шейх-уль-ислама, мы сделаем шаг к формализации иерархии духовенства, а династия [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] станет ближе к решению вопросов фетв — но консервативные теологи в ужасе от одной мысли о том, чтобы даровать такой титул суфию."
 flavor_usa.9.b.tt:0 "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] провинции [unrest_location.GetProvince.GetName] повышается на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%], однако [Concept('control', 'контроль')|e] в её районах понижается на [ShowNamedValue('control_mild_penalty')|+=2%]"
 french_wars_religion.6.desc:0 "В [target_location.Custom('LR_PREP')|l] [target_location.GetName] разразилось массовое восстание, погрузившее столицу в хаос. Возмущённая тем, насколько [target_character.GetName] якобы благоволит еретикам, #L [ROOT.GetCountry.GetAdjective|l]ая#! #L [ROOT.GetCountry.GetReligion.GetAdjective|U]ая#! лига подняла местное население на бунт, во главе которого [Select_CString(target_character2.IsFemale,'встала', 'встал')] [target_character2.GetName]. Масла в огонь подлили слухи о том, что [Select_CString(target_character2.IsFemale,'предводительницу', 'предводителя')] хотят арестовать [ROOT.GetCountry.GetGovernment.GetAdjective]ие агенты. Вооружённое ополчение удивительно быстро соорудило баррикады и парализовало целые районы, препятствуя продвижению гвардейцев.\n\n[target_character.GetShortNameWithNoTooltip] может в любой момент быть [Select_CString(target_character.IsFemale,'вынуждена', 'вынужден')] бежать из столицы, а влияние Лиги в [target_province.Custom('LR_PREP')|l] [target_province.GetName] невероятно высоко. Хрупкий баланс сил грозит в любой момент разрушиться."
 game_concept_market_access_desc:0 "Доступ к рынку показывает, насколько легко [Concept('location', 'району')|e] взаимодействовать с местным [Concept('market', 'рынком')|e], и зависит от расстояния до [Concept('market_center', 'рыночного центра')|e].\n\nДоступ к рынку влияет на три ключевых аспекта.\n\n$BULLET$Хороший доступ к [Concept('markets', 'рынку')] повышает его [Concept('market_attraction_wth_icon', 'привлекательность')|e] для района, поэтому [Concept('locations', 'районы')] обычно примыкают к ближайшему [Concept('market', 'рынку')].\n\n$BULLET$[Concept('locations', 'Районы')] с наилучшим доступом к [Concept('market', 'рынку')] покупают [Concept('goods_wth_icon', 'товары')|e] и [Concept('food_wth_icon', 'пищу')|e] первыми, районы с наихудшим доступом — последними.\n\n$BULLET$Плохой доступ к рынку приводит к снижению [Concept('output', 'объёма производства')|e] в [Concept('buildings_wth_icon', 'сооружениях')|e] и падению доходов от [Concept('rgo_wth_icon', 'добычи ресурсов')|e].\n\nДоступ к рынку выше, если до рынка можно добраться по морю или [Concept('rivers', 'реке')|e]. Кроме того, чтобы улучшить этот показатель, можно построить [Concept('roads', 'дороги')|e] и порты, а также создать новый [Concept('market', 'рынок')]."
 game_concept_treasury_desc:0 "Это количество [Concept('gold', 'золота')|e] у [Concept('country', 'державы')|e]. Если оно становится отрицательным, державе автоматически выдаётся [Concept('loan', 'заём')|e]. Если держава больше не может брать [Concept('loans', 'займы')|e], она становится [Concept('bankrupt', 'банкротом')|e]."
 getrulertitle_ruler_ACC:0 "[ROOT.GetCountry.Custom('RL_ACC')]"
 getrulertitle_ruler_DAT:0 "[ROOT.GetCountry.Custom('RL_DAT')]"
 getrulertitle_ruler_GEN:0 "[ROOT.GetCountry.Custom('RL_GEN')]"
 getrulertitle_ruler_INST:0 "[ROOT.GetCountry.Custom('RL_INST')]"
 getrulertitle_ruler_PREP:0 "[ROOT.GetCountry.Custom('RL_PREP')]"
 grand_embassy.7.desc:0 "Визит в город [embassy_country.GetCapital.GetName] был чрезвычайно успешным, но теперь нам снова пора в путь. Куда мы направимся дальше?"
 greek_culture_prevent_coup_for_two_year:0 "Если [target_character.GetName] [Select_CString(target_character.IsFemale, 'задумывала', 'задумывал' )] переворот, [target_character.GetHerHis] планы будут отложены на #y 2#! года"
 heir_selection_this_not_equal:0 "[Concept('heir_selection', 'Правило престолонаследия')|e] — любое, кроме «[TARGET_HEIR_SELECTION.GetName]»"
 hellenism_religion.33.desc:0 "К нашему двору прибывает [Select_CString(target_character.IsFemale, 'учёная дама', 'учёный муж' )] в сане епископа — не с мечом и не с претензиями, но с вопросами. [target_character.GetName] [Select_CString(target_character.IsFemale, 'посвятила', 'посвятил' )] свою жизнь изучению платоновской философии, и [Select_CString(target_character.IsFemale, 'она', 'он' )] с тихой убеждённостью утверждает, что христианский Бог и философское понятие первоосновы есть одно и то же. Святая Троица, считает [Select_CString(target_character.IsFemale, 'она', 'он' )], это просто союз Единого, Бытия и Души, облачённые в другие названия.\n\nЭта точка зрения имеет под собой силу, и [target_character.GetName] аргументирует её со спокойной уверенностью человека, который уже слышал все возможные контраргументы раньше. Согласимся мы с такой трактовкой или отвергнем её, на этот спор обратят внимание и [ROOT.GetCountry.GetCapital.GetName], и другие города нашей державы."
 hint_battle_hint_text_1:0 "Когда [Concept('army_with_icon', 'армии')|e] воюющих сторон оказываются в одном [Concept('location_with_icon', 'районе')|e], между ними начинается [Concept('battle_with_icon', 'битва')|e]. [Concept('army', 'Армия')], пришедшая в такой [Concept('location', 'район')] первой, считается [Concept('defender_with_icon', 'обороняющейся')|e] и получает преимущества местности. Битва завершается, когда одна из сторон полностью утрачивает [Concept('morale_with_icon', 'боевой дух')|e] или теряет все свои [Concept('regiments_with_icon', 'полки')|e] — в зависимости от того, что случится раньше."
 hint_control_hint_text_1:0 "[control_icon] [Concept('control', 'Контроль')|e] является одной из важнейших характеристик наших [location_icon] [Concept('locations_with_icon', 'районов')|e]. От него зависит процент [taxes_icon] [Concept('tax_base', 'налоговой базы')|e] и [levies_icon] [Concept('levies_with_icon', 'ополчений')|e], которыми можем эффективно пользоваться мы или наши [estates_icon] [Concept('estates_with_icon', 'сословия')|e]. Сколько бы [building_icon] [Concept('buildings_with_icon', 'сооружений')|e] и [population_icon] [Concept('population_with_icon', 'населения')|e] ни было в [Concept('location', 'районе')], при отсутствии [Concept('control', 'контроля')] они не приносят нам пользы.\n\nКонтроль над каждым районом ежемесячно меняется в сторону [Concept('max_control_with_icon', 'максимального контроля')|e]. [Concept('siege_with_icon', 'Осады')|e] и другие события могут временно снизить его, но со временем контроль всё равно вернётся к максимальному значению для района.\n\n[Concept('max_control', 'Максимальный контроль')|e] зависит в первую очередь от [proximity_icon] [Concept('proximity', 'досягаемости')|e]. [capital_icon] [Concept('capital', 'Столица')|e] всегда обладает #W 100%#!-й досягаемостью, а для других районов это значение определяется расстоянием до столицы с учётом особенностей местности: [road_icon] [Concept('roads_with_icon', 'дороги')|e], поля и [seazones_icon] [Concept('seazones', 'акватории')|e] со значительным [Concept('maritime_presence', 'морским присутствием')|e] влияют на неё положительно, а горы, леса и [Concept('seazones', 'акватории')] с [Concept('pirates_with_icon', 'пиратами')|e] — отрицательно. На значение максимального контроля, помимо прочего, влияют [Concept('pop_satisfaction_with_icon', 'довольство групп населения')|e], [Concept('integration_status_with_icon', 'статус интеграции')|e] и наличие некоторых особых [Concept('buildings', 'сооружений')]."
 hint_low_republican_tradition_hint_text_2:0 "#T Рекомендации#!\n@arrow_bonus_tier_3! Поддерживайте как можно более высокий уровень [Concept('republican_tradition_with_icon', 'республиканских традиций')|e], чтобы избегать существенных штрафов.\n@arrow_bonus_tier_2! Для поддержания этого показателя можно увеличить затраты на [Concept('court_maintenance', 'содержание двора')|e].\n@arrow_bonus_tier_2! Есть и другие способы сохранить [Concept('republican_tradition_with_icon', 'республиканские традиции')|e] — например, определённые [Concept('advances_with_icon', 'улучшения')|e] или [Concept('policies_with_icon', 'политики')|e].\n@arrow_bonus_tier_1! Ещё один способ поддержать [Concept('republican_tradition_with_icon', 'республиканские традиции')|e] на высоком уровне — сменить [Concept('ruler_with_icon', 'правителя')|e] на [Concept('election_with_icon', 'выборах')|e]."
 hre.102.desc:0 "$hre.privilege_revoked.intro_desc$ Рейхстаг согласился с предложением соединить разрозненные владения империи в единое национальное государство, а [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] будет [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'коронована', 'коронован')] его [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'наследной правительницей', 'наследным правителем')]."
 hre.103.desc:0 "Рейхстаг одобрил реформу, согласно которой наша держава прекращает своё существование, а её владения переходят в руки [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!. Нам остаётся лишь утешать себя тем, что мы стали частью чего-то большего."
 hre.104.desc:0 "$hre.privilege_revoked.intro_desc$ Рейхстаг согласился ограничить автономию #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольных городов#!#! и укрепить власть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')] в пределах #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!."
 hre.106.desc:0 "$hre.privilege_revoked.intro_desc$ Рейхстаг согласился ещё сильнее ограничить автономию #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольных городов#!#!, укрепив власть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')] в пределах Священной Римской Империи."
 hre.107.a:0 "Наш город служит [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрице', 'императору')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!!"
 hre.7.desc:0 "Начиная с сегодняшнего дня имперский рейхстаг будет постоянно заседать в [diet_location.Custom('LR_PREP')|l] [diet_location.GetName], а не созываться по особым случаям, как прежде. Этот шаг несомненно повысит сплочённость империи и поможет узаконить отношения между [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицей', 'императором')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! и князьями. С другой стороны, такое решение сделает [diet_location.Custom('LR_ACC')|l] [diet_location.GetName] первостепенной целью для желающих причинить вред империи…"
 hre.801.title:0 "Смерть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')]"
 hre.900.desc:0 "Да здравствует [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрица', 'император')]! Выборщики решили всё же довериться нам, императорская корона сохраняется за #ONCLICK:COUNTRY,[GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_tt')],X [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_INST')|L]#!#!. Императорская власть растёт по мере того, как наша держава увеличивает своё влияние в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, а князья начинают видеть в нас прирождённых правителей."
 hre.900.title:0 "Смерть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')]"
 hre.909.a:0 "[Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'Бесчестная', 'Бесчестный')]? Скорее, [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'благоразумная', 'благоразумный')]!"
 hre.909.desc:0 "[Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'Императрица', 'Император')] не [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'смогла', 'смог')] защитить #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_ACC')|L]#!#! от иностранных захватчиков!"
 hre.909.title:0 "[Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'Бесчестная императрица', 'Бесчестный император')]"
 imperial_authority_desc:0 "Это показатель власти, которой пользуется [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! для принятия имперских законов.\n\nВысокий показатель имперской власти даёт следующие преимущества:\n$BULLET$ Увеличивает #TOOLTIP:PAYMENT,imperial_treasury_contribution,X #L вклад в казну#!#! и #TOOLTIP:PAYMENT,imperial_army_contribution,X #L армию#!#! со стороны [Concept('members', 'участников')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!.\n$BULLET$ [Concept('members', 'Участники')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! с большей вероятностью голосуют за [Concept('policies', 'политики')|e], которые [Concept('hre_emperor', 'император')|e] предлагает членам [GetUniqueInternationalOrganization('hre').Custom('parliament_io_ru_GEN')|l]."
 improve_opinion_with_all_catholics_tt:0 "Мы улучшим [Concept('opinion', 'мнение')|e] всех #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! [Concept('country', 'держав')|e] о нас на [ShowBiasValue('opinion_bosnian_church_diplomacy')|+=0]"
 incorruptible_die_desc:0 "[Select_CString(CHARACTER.IsFemale,'Она боролась', 'Он боролся')] с несправедливостью и [Select_CString(CHARACTER.IsFemale,'сделала','сделал')] всё, чтобы уменьшить неравенство."
 increase_control_province_action:0 "Усилить контроль в провинции [SCOPE.sProvince('selected_province').GetName] (сейчас [SCOPE.sProvince('selected_province').GetAverageControl|%])"
 inherit_in_case_of_no_heir_tt:0 "Мы немедленно получим власть над #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_ТP')|L]#!#!, если [Concept('ruler', 'правитель')|e] этой державы умрёт, не оставив [Concept('heir', 'наследника')|e] из нашей [Concept('dynasty', 'династии')|e]"
 institution_events.10.desc.dharmic:0 "$institution_events.10.desc.start$ [legalism_country.GetAdjectiveWithNoTooltip]ая концепция #TOOLTIP:RELIGIONGROUP,dharmic,X #L дхармы#!#! нашла особенно большой отклик среди жителей [ROOT.GetCountry.Custom('rank_ru_GEN')|l], которые не могли не заметить сходство традиций [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой и #TOOLTIP:RELIGIONGROUP,dharmic,X #L дхармической#!#! религии.\n\n$institution_events.10.desc.end$"
