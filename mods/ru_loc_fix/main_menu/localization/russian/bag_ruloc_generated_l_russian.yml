 WE_PERFORM_request_union_of_crowns_pact_ACTION_EFFECTS:0 "Мы заключаем союз корон [SCOPE.sCountry('actor').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_INST')|L]#!#!. Теперь страна, правитель которой умрёт первым, вступит в [Concept('union', 'унию')|e] с другой державой."
 WE_PERFORM_send_to_prussian_crusade_ACTION_EFFECTS:0 "[SCOPE.sCharacter('target').GetName] отправляется [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_ACC')|L]#!#! для участия в крестовом походе. Это может повысить [Select_CString(SCOPE.sCharacter('target').IsFemale, 'её', 'его')] характеристики, но может и привести к гибели."
 WE_PERFORM_support_heir_interaction_ACTION_EFFECTS:0 "Мы отправили персонажа [SCOPE.sCharacter('target').GetName] [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_ACC')|L]#!#!."
 WE_PERFORM_union_enforce_culture_ACTION_EFFECTS:0 "Мы принимаем меры, чтобы #L [SCOPE.sCountry('actor').GetCulture.GetName|l]ая#! культура стала [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_PREP')|L]#!#! [Concept('primary_culture', 'основной')|e]."
 YANANTIN_TT_CURRENT_TEXT:0 "Когда [yanantin|Vl] составляет [Country.GetFixedPointCurrencyValue('yanantin')|W] ед., мы получаем следующие эффекты:"
 ach_heirs_of_the_latin_empire_desc:0 "Мы потеряли контроль над #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!, который является центром власти в [GetCountry('LAT').Custom('longname_ru_PREP')], но наши притязания на него всё также сильны, как и прежде."
 angry_barlaamite_clergy_tt:0 "[target_character_1.GetName] пользуется поддержкой нескольких [Concept('pops', 'групп населения')|e] ([ROOT.GetVariable('num_barlaamite_pops_variable').GetValue|V0]) из сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]» в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Эти группы получат [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
