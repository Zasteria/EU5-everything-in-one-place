 jacquerie_revolt_warning:0 "Около #Y [ROOT.GetVariable('jacquerie_revolt_total_num_pop_variable').GetValue|V0] тыс.#! [Concept('pops', 'населения')|e] из [ROOT.GetVariable('jacquerie_revolt_total_num_provinces_variable').GetValue] [Concept('provinces', 'провинций')|e] присоединится к восстанию «[jacquerie_revolt.GetName]»\n"
