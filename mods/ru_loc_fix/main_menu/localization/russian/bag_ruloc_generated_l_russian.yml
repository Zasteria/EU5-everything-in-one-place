 coup_attempt.5.c:0 "Мы не можем ставить под удар #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий#! род."
 coup_attempt.7.desc:0 "Махинации Тайного совета вместе с подкупами и тщательными расследованиями помогли нам раскрыть имена тех, кто строил против нас заговор. Их судьбы теперь в наших руках. Одни советники считают, что [target_character_2.GetName] и [Select_CString(target_character_2.IsFemale, 'её', 'его' )] сообщники заслуживают скорой расправы. Другие же убеждают проявить милосердие и держать этих опасных персон поближе к себе, чтобы потом ими манипулировать."
 court_flavor_events.40.desc:0 "Прибывшая к нам #L [GetCountry('PAP').GetAdjective|l]ая#! делегация передаёт слова своего руководства, сохраняя при этом крайне серьёзный вид: «[Select_CString(target_pope.IsFemale,'Её', 'Его')] Святейшество [target_pope.GetName] знает, что вы укрываете у себя в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] еретика». Посланники требуют, чтобы мы немедленно передали [Select_CString(advisor.IsFemale,'её', 'его')] инквизиции, иначе [target_pope.GetShortNameWithNoTooltip] сочтёт нас отступниками от истинного пути и будет [Select_CString(target_pope.IsFemale,'вынуждена', 'вынужден')] принять против нас все необходимые меры."
 culture_greek.11.desc:0 "Язык Рима утратил значительную долю своего влияния при восточном дворе, ведь мы решили придерживаться наших славных #TOOLTIP:CULTUREGROUP,greek_group,X #L эллинских#!#! корней. Тем не менее некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] достаточно образованны, чтобы свободно цитировать #TOOLTIP:LANGUAGE,latin_language,X #L латинские#!#! высказывания.\n\n«Pro bono», — говорит придворным [target_character.GetName]. Те недоумённо хлопают глазами, и [Select_CString(target_character.IsFemale, 'ей', 'ему' )] приходится объяснять значение и происхождение этих слов. Наиболее консервативные среди аристократов высмеивают [Select_CString(target_character.IsFemale, 'её', 'его' )] любовь к чужеземным словечкам, другие же явно заинтригованы — им хочется узнать о латыни побольше. Кое-кто при дворе даже выступает за то, чтобы принять латинскую речь и популяризовать её применение в административном аппарате страны, возродив [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')] античные римские традиции."
 culture_greek.12.desc:0 "Большинство ключевых постов [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! занимают достойные и способные люди, но отдельные детали государственного аппарата нередко дают сбой.\n\nВ ходе недавней проверки вскрылись весьма любопытные факты: по слухам, [target_character.GetName] раздаёт административные должности своим родственникам, знакомым и даже тем, кто готов [Select_CString(target_character.IsFemale, 'ей', 'ему' )] заплатить. Когда об этом [Select_CString(target_character2.IsFemale, 'прознала', 'прознал' )] [target_character2.GetName], информацию поспешили списать на предвзятое отношение проверяющих, с которыми [target_character.GetNameWithNoTooltip] давно враждует.\n\nТем не менее есть смысл вмешаться в скандал и напомнить тем, кто использует свою должность в корыстных интересах, что подобные проступки не останутся без последствий."
 culture_greek.16.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'свершила', 'свершил' )] немало подвигов — кажется, [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! и в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] не осталось никого, кто бы не слышал о [Select_CString(target_character.IsFemale, 'её', 'его' )] деяниях. Придворные жаждут лично познакомиться с живой легендой нашей державы — они направили [Select_CString(target_character.IsFemale, 'ей', 'ему' )] приглашение ко двору, чтобы представить [Select_CString(target_character.IsFemale, 'её', 'его' )] самым знатным и влиятельным вельможам страны.\n\nРазумеется, [Select_CString(target_character.IsFemale, 'её', 'его' )] многочисленные соперники не слишком рады этому известию. [target_character.GetNameWithNoTooltip] и без того слишком много о себе [Select_CString(target_character.IsFemale, 'возомнила', 'возомнил' )], и кое-кто опасается, что обожание придворных подтолкнёт [Select_CString(target_character.IsFemale, 'её', 'его' )] к мысли об узурпации власти. Если [target_character.GetSheHe] потребует, чтобы [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'отреклась', 'отрёкся' )] от [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого престола, едва ли мы сможем [Select_CString(target_character.IsFemale, 'её', 'его' )] остановить…"
 culture_greek.17.desc:0 "Благодаря нашему опыту мореходства [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! были построены новые гавани и проложены новые торговые маршруты. Одним из таких портов является [target_location.GetRank.GetName|l] [target_location.GetName]. Привлечённые многочисленными привилегиями, в это молодое торговое поселение стекаются [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] со всей страны.\n\nСтремительно развивающийся город остро нуждается в дополнительных рынках, новых жилых районах, масштабном кораблестроении. Прознав об этом, [target_character.GetName] [Select_CString(target_character.IsFemale, 'созвала', 'созвал' )] придворных вельмож, чтобы найти оптимальное решение."
 culture_greek.23.desc:0 "Влияние [target_location.Custom('LR_GEN')|l] [target_location.GetName] в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! становится всё более ощутимым для всех, особенно для чиновников из [target_capital.Custom('LR_GEN')|l] [target_capital.GetName]. Их весьма занимает вопрос, каким образом этот [target_location.GetRank.GetName|l] из области [target_area.GetName] смог возвыситься, причём во многом ему покровительствовали [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] и различные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Мелкие чиновники и состоятельные [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] пользуются возможностями, которые предоставляет им [target_location.GetRank.GetNameWithNoTooltip|l], а местные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] утопают в роскоши.\n\nНо если для одних это источник довольства, то для других — повод для серьёзных раздумий, поскольку растущее влияние региона подрывает положение облечённых властью в [target_capital.Custom('LR_PREP')|l] [target_capital.GetName] и других местах, тем самым нарушая политическое равновесие во всей державе."
 culture_greek.24.desc:0 "Влияние Римской империи по-прежнему ощущается [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Несмотря на то, что титул византийских императоров нам не принадлежит, народ продолжает считать себя частью прежней империи и полагает, что [target_character.GetName] [Select_CString(target_character.IsFemale, 'должна', 'должен' )] проводить более агрессивную политику по возвращению её земель. Некоторые популисты при #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе настаивают, что нам следует не только вернуть земли, но и перенять титул императоров прошлого. А чтобы придать нам должную легитимность и престиж в обоснование наших притязаний на утраченные земли, следует изменить стиль и эстетику нашей столицы, [target_capital.Custom('LR_GEN')|l] [target_capital.GetName]."
 culture_greek.26.desc:0 "Во времена Древнего Рима на #TOOLTIP:LANGUAGE,latin_language,X #L латыни#!#! — которую часть населения #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! не желает изучать — было написано бесчисленное множество сочинений. Это побудило наших наиболее рассудительных учёных взяться за их перевод на общепринятый #L [ROOT.GetCountry.GetCommonLanguage.GetName|l]ий#! язык.\n\nПредставители элиты не могли оставить это дело без внимания, усмотрев угрозу в том, что низшие сословия смогут получить доступ к текстам, на изучение и освоение которых [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] потратили целые годы. При #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе раздались призывы запретить подобные переводы в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] ради сохранения положения и престижа элиты."
 culture_greek.28.desc_common:0 "Нестабильность [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! вынудила многих образованных людей искать лучшей доли подальше от [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 culture_greek.29.desc:0 "Жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] — ревностные последователи #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ой#! веры. [ROOT.GetCountry.GetReligion.GetGodName] — основа их повседневной жизни. Однако из-за недостатка поддержки со стороны #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и правительства нашей славной державы местный #TOOLTIP:BUILDING_TYPE,orthodox_monastery,X #L православный монастырь#!#!, расположенный в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#!, остро нуждается в обновлении убранства, чтобы соответствовать своему статусу святого места. Духовенство направило прошение к #L [ROOT.GetCountry.GetAdjective|l]ому#! двору в надежде, что [target_character.GetName] выделит средства на достойное обновление как внешнего облика, так и внутреннего убранства этой святыни. Это благодеяние не останется незамеченным и покажет всем в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] нашу преданность [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]ой вере."
 culture_greek.3.desc:0 "#TOOLTIP:CONTINENT,europe,X #L Европу#!#! захлестнула волна Реформации, и [target_character.GetName] со своими сторонниками всё чаще говорит о необходимости установить дипломатические отношения с протестантскими державами — например, [target_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#!.\n\nОчевидно, что [papal_capital.GetName] — наш общий враг. Как и мы, [target_country.GetAdjectiveWithNoTooltip|l]ие [target_country.GetGovernment.GetEstateName('crown_estate')|l] стремятся избавиться от пороков #TOOLTIP:RELIGION,$catholic_tt$,X #L католичества#!#! и править без оглядки на папу. Тем не менее между нашими доктринами остаются серьёзные разногласия — последствия векового католического владычества, которые наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] находит неприемлемыми."
 culture_greek.3.title:0 "Реформация [target_country.Custom('predlog_vvo')] [target_country.Custom('CL_PREP')]"
 d008_flavor_byz.6.desc:0 "[ROOT.GetCountry.GetName], некогда слабая держава-преемница у берегов Чёрного моря, достигла небывалых высот. #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! теперь принадлежит нам, #TOOLTIP:CULTUREGROUP,turkic_group,X #L тюркские#!#! захватчики изгнаны из #TOOLTIP:REGION,anatolia_region,X #L Анатолии#!#!, и [ROOT.GetCountry.GetLongNameWithNoTooltip] восстановил[ROOT.GetCountry.Custom('endlong_fem')] своё былое величие. Придворные учёные шепчутся о том, что [ROOT.GetCountry.GetFlavorRank] восста[ROOT.GetCountry.Custom('endrank_etyut')] из праха, словно феникс.\n\n[target_character.GetName] — отныне [Select_CString(target_character.IsFemale, 'истинная наследница', 'истинный наследник' )] Римской империи. Мы, как и наши предки, с честью выдержали испытания судьбы, и потому их институты, привилегии и цели теперь по праву принадлежат нам."
 d008_orthodox_events.11.desc:0 "Рим — колыбель империи, символ культуры и оплот античной цивилизации — долго прозябал во мраке варварства и ереси. Но теперь Вечный город снова в наших руках, и мы клянёмся, что он обретёт прежнее величие и вновь превратится в мировой центр.\n\nСила, исходящая из новой [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой столицы, распространится по свету, и все народы мира вспомнят о [ROOT.GetCountry.Custom('rank_ru_PREP')|l], о том, кто мы есть. Славься, [ShowLocationName('rome')]! Славься, [ROOT.GetCountry.GetLongName]!"
 d008_orthodox_events.4.desc:0 "[target_art.GetName] — настало время вернуть одолженное законным владельцам. Несомненно, [origin_country.GetName] жд[origin_country.Custom('end_etut')], что мы сдержим слово. Конечно, мы могли бы уклониться от выполнения обязательств, объявив, что #TOOLTIP:WORK_OF_ART_TYPE,icon,X #L икона#!#! «потерялась»…"
 d008_orthodox_events.8.desc:0 "Потеря важнейшего епископского престола в провинции [target_pentarchy.GetName] — огромный удар для нашей власти и престижа. Утрата одного из столпов пентархии станет тяжёлым испытанием для всех #TOOLTIP:RELIGION,$orthodox_tt$,X #L православных#!#! [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Неужто Господь отвернулся от нас?"
 d009_flavor_religious_orders.1.desc:0 "[old_head_of_order.GetName], верой и правдой [Select_CString(old_head_of_order.IsFemale, 'служившая', 'служивший' )] нашей державе в качестве главы #ONCLICK:COUNTRY,[target_order.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_order.Custom('CL_tt')],X [target_order.Custom('CL_GEN')|L]#!#!, внезапно [Select_CString(old_head_of_order.IsFemale, 'заболела и была вынуждена', 'заболел и был вынужден' )] уйти в отставку.\n\nХотя на [Select_CString(old_head_of_order.IsFemale, 'её', 'его' )] место претендуют многие достойные рыцари и аристократы, [target_ruler.GetShortName] уже [Select_CString(target_ruler.IsFemale, 'нашла', 'нашёл' )] для этой работы подходящего человека из числа своих фаворитов. Великим магистром [target_order.Custom('CL_GEN')] станет [target_character.GetShortName] — если, конечно, мы не позволим братьям выбирать его самим."
 d009_flavor_religious_orders.2.a:0 "[Select_CString(target_character.IsFemale, 'Она', 'Он' )] просто радеет [ROOT.GetCountry.Custom('predlog_obo')] [ROOT.GetCountry.Custom('CL_PREP')]."
 death_of_hayan_wuruk.6.title:0 "Распространение ислама [GetCountry('MAJ').Custom('predlog_vvo')] [GetCountry('MAJ').Custom('CL_PREP')]"
 death_of_hayan_wuruk_desc:0 "[GetCharacter('maj_hayam_wuruk').GetName] [Select_CString(GetCharacter('maj_hayam_wuruk').IsFemale,'скончалась. Её', 'скончался. Его')] смерть привела к тому, что в [GetCountry('MAJ').Custom('rank_ru_PREP')|l] началась страшная смута. Этот неспокойный период может затянуться на многие годы, и те, кто когда-то подчинялся нам, будут оспаривать наше право на власть. Если мы хотим выжить, необходимо срочно решить вопросы наследования и укрепить #L [GetCountry('MAJ').GetAdjective|l]ую#! власть."
 decline_of_empire.8.desc:0 "[target_character.GetName] определённо [Select_CString(target_character.IsFemale, 'засиделась', 'засиделся' )] на своей должности, о чём свидетельствуют [Select_CString(target_character.IsFemale, 'её', 'его' )] халатное отношение к работе и коррупционные скандалы с [Select_CString(target_character.IsFemale, 'её', 'его' )] участием. [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'полна', 'полон' )] решимости: пришло время восстановить стабильность в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] и отстранить от власти тех, кто действует против собственного народа."
 decline_of_mali.4.b.tt:0 "[Concept('pops', 'Группы населения')|e] в провинции [target_province.GetName] присоединяются к группе «[mal_provoked_military_forces.GetName]» и получают [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 delhi_situation.14.desc:0 "Поведение #L [target_country.GetAdjective|l]их#! дипломатов окончательно вышло за рамки приличия. От оскорблений придворных и религиозных традиций они перешли к прямым угрозам. Стоит ли говорить, что наши отношения [target_country.Custom('predlog_sso')] [target_country.Custom('longname_ru_wntt_INST')] достигли рекордно низкого уровня, так как дипломаты этой державы заявили, что будут всячески мешать нам контролировать свои обширные территории."
 destabilization_spreads_across_the_country:0 "#italic Разногласия между предпринимателями лишь усугубляются, что приводит к росту нестабильности в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]#!"
 dop_law_castilian_courts_desc:0 "#italic Кастильские кортесы#! представляют интересы сословий и ряда кастильских городов с правом голоса в [GetCountry('CAS').Custom('longname_ru_PREP')]."
 dop_law_state_council_desc:0 "Государственный совет — это высший совещательный орган [GetFormableCountry('RUS').GetName]. Он создан в качестве промежуточного звена между самодержавием и губернскими думами, введёнными в ходе #TOOLTIP:GOVERNMENT_REFORM,speransky_liberalization_reform,X #L либеральных реформ Сперанского#!#!. Совет рассматривает предлагаемые законы, а также контролирует исполнение бюджета и государственные расходы, однако не имеет права предлагать изменения. Вместо этого он даёт рекомендации по рассматриваемым вопросам."
 dynastic.1.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle] находится во власти чар [Select_CString(devil_char.IsFemale, 'коварной обольстительницы', 'коварного обольстителя')]. [devil_char.GetName] является даже по ночам, когда заканчиваются [ROOT.GetCountry.GetGovernment.GetAdjective|l]ие дела и пустеют залы, — но только во снах, отчего [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] страшно терзается. С каждым днём бороться с искушением становится сложнее. Никому не ведомо, попросит ли [ruler_char.GetShortName] этим воскресеньем простить [Select_CString(ruler_char.IsFemale, 'ей', 'ему')] не только грешные помыслы…"
 dynastic.14.b.nickname:0 "Ложный"
 election.2.desc:0 "[ROOT.GetCountry.GetLongName] без правителя. [ROOT.GetCountry.GetGovernment.GetRulerTitle] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'скончалась', 'скончался')], и нам нужно проводить выборы. Избрание большинством голосов оставляет простор для коррупции или, что ещё хуже, для популизма. После многоэтапного тайного выбора кандидатов мы решили, кто будет нами править. Выборы происходили практически случайным образом."
 encourage_societal_value_towards:0 "Поддержать позицию «$VALUE$» с помощью действий совета"
 enforce_culture_effect_text:0 "[SCOPE.sCountry('actor').GetName] устанавлива[SCOPE.sCountry('actor').Custom('end_etyut')] свою культуру [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_PREP')|L]#!#!."
 enforce_culture_effect_text_past:0 "[SCOPE.sCountry('actor').GetName] установил[SCOPE.sCountry('actor').Custom('end_fem')] свою культуру [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_PREP')|L]#!#!."
 every_pop_25_satisfaction_gain_tt:0 "Все крестьянские [Concept('pop', 'группы населения')|e] в [Concept('province', 'провинции')|e] [target_province.GetNameWithNoTooltip] получат [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 fall_of_delhi_appease_the_nobility_desc:0 "Нельзя недооценивать влияние, которым располагают [SCOPE.sCountry('actor').GetGovernment.GetEstateName('nobles_estate')|l] в вопросах успеха и процветания нашей державы. Они возводят царей на трон и следят за соблюдением законов короны, а потому обладают великой силой в [GetCountry('DLH').Custom('rank_ru_PREP')|l]. Ради нашего же блага мы должны немедленно заручиться их верностью, иначе их властолюбие погубит нас всех…"
 fate_of_the_phoenix.1.desc_b:0 "Мы получили вести из #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#!. Похоже, в древней столице сейчас неспокойно: её могущество ослабевает вследствие раздора и упадка. На протяжении веков пример #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! держал в узде #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! земли #TOOLTIP:REGION,balkan_region,X #L Балкан#!#!, объединяя нас на почве веры и предотвращая большинство конфликтов.\n\nТеперь, когда хватка Константинополя уже не так сильна, равновесие на наших границах становится всё более неустойчивым. Некоторые влиятельные семьи предупреждают, что падение этого столпа пошатнёт всю конструкцию. Другие высказываются более прямо: прежние договорённости перестают действовать и то, что прежде регулировалось традицией, скоро будет решаться силой. То, какой путь мы выберем в эти трудные времена, повлияет на мир далеко за пределами [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 fate_of_the_phoenix.16.desc:0 "Нам стало известно, что [actor.GetName] сотряса[actor.Custom('end_etyut')]ся от беспорядков. В отчаянии местные власти отправили к нам гонцов с просьбой о финансовой помощи. Взамен нам позволят распространять в [actor.Custom('rank_ru_PREP')|l] свои традиции и обычаи. Этот неожиданный жест говорит о том, что [actor.GetCapital.GetRank.GetNameWithNoTooltip|l] [actor.GetCapital.GetName] находится в самом плачевном положении."
 fate_of_the_phoenix.2.desc:0 "Знамёна [ROOT.GetCountry.Custom('rank_ru_GEN')|l] вновь развеваются над [target_location.Custom('LR_INST')|l] [target_location.GetName]. Долгое время за этот важный эгейский порт сражались #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турецкие#!#! военачальники, пираты и державы-соперницы, теперь же он вернулся [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! — свой родной дом. Его гавани и рынки разрушены, но это поправимо. Как мы поступим? Отстроим порт заново или восстановим рынки и склады? От этого решения зависит наша будущая роль в восточных морях."
 fate_of_the_phoenix.8.desc:0 "Сейчас [actor.GetName] вед[actor.Custom('end_etut')] войну против врагов истинной веры. Так как мы состоим в одном автокефальном патриархате, от нас ждут, что мы тоже возьмём в руки оружие и бросимся сражаться с мифическим общим противником. В случае отказа нам грозит исключение из патриархата, из-за чего отношения между нашими державами дадут трещину."
 flavor_ach.1.desc:0 "После #L [target_country2.GetAdjective|l]ого#! вторжения [target_country.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! [GetCharacter('byz_andronikos_iii_palaiologos').GetName] [Select_CString(GetCharacter('byz_andronikos_iii_palaiologos').IsFemale, 'изгнала', 'изгнал' )] [Select_CString(target_character.IsFemale,'законную наследницу', 'законного наследника')], [Select_CString(target_character.IsFemale,'которая должна была', 'который должен был')] взять бразды правления после того, как скончается [target_character.GetShortName], [Select_CString(target_character.IsFemale,'её', 'его')] [target_character.GetFather.GetName]. Вместо [Select_CString(target_character.IsFemale,'неё', 'него')] был назначен [target_country2.GetAdjectiveWithNoTooltip|l]ий губернатор [GetCharacter('epi_theodoros_synadenos').GetName]. К счастью, [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'была тайно вывезена', 'был тайно вывезен')] из страны при содействии противников [target_country2.GetAdjectiveWithNoTooltip|l]ой власти. [target_character2.GetName] [Select_CString(target_character2.IsFemale,'ожидала', 'ожидал')] встречи с [Select_CString(target_character.IsFemale,'ней', 'ним')]."
 flavor_ach.10.b:0 "Лучше подождать и посмотреть, правдивы ли слухи о нестабильности [byz_country.Custom('predlog_vvo')] [byz_country.Custom('CL_PREP')]."
 flavor_ach.11.title:0 "Повсеместная нестабильность [byz_country.Custom('predlog_vvo')] [byz_country.Custom('CL_PREP')]"
 flavor_ach.13.a:0 "Вместо этого пусть каталонские [athens_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] [athens_country.Custom('predlog_vvo')] [athens_country.Custom('CL_PREP')] станут нам друзьями."
 flavor_ach.2.desc:0 "[Select_CString(target_character.IsFemale, 'Последняя латинская правительница', 'Последний латинский правитель' )] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'юная', 'юный' )] [target_character.GetName], [Select_CString(target_character.IsFemale, 'была тайно вывезена', 'был тайно вывезен' )] из страны и [Select_CString(target_character.IsFemale, 'переправлена', 'переправлен' )] [target_country3.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target_country3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country3.Custom('CL_tt')],X [target_country3.Custom('CL_ACC')|L]#!#!, чей [target_country3.GetGovernment.GetRulerTitle|l] оказывает [Select_CString(target_character.IsFemale, 'ей', 'ему' )] поддержку. [target_country3.GetLongName] постара[target_country3.Custom('endlong_etyut')]ся восстановить на троне [Select_CString(target_character.IsFemale, 'изгнанную наследницу', 'изгнанного наследника' )], в этом нет никаких сомнений.\n\nМы должны остерегаться вторжений, поскольку [target_character2.GetName] может нанести удар, пока мы слабы."
 flavor_ach.7.a:0 "Мы не против: пусть [nikephoros_ii_orsini.GetLastNameWithNoTooltip] возвращается [epirus_country.Custom('predlog_vvo')] [epirus_country.Custom('CL_ACC')] при нашей поддержке."
 flavor_ach.8.a:0 "Вместо этого заключим официальный союз [epirus_country.Custom('predlog_sso')] [epirus_country.Custom('CL_INST')]."
 flavor_ach.9.title:0 "Мятеж [epirus_country.Custom('predlog_vvo')] [epirus_country.Custom('CL_PREP')]"
 flavor_ach_9_tt:0 "Если [nikephoros_ii_orsini.GetName] победит, [epirus_country.GetName] обрет[epirus_country.Custom('end_etut')] независимость"
 flavor_ara.20.desc:0 "Известный рыцарь и учёный [target_character.GetName], член ордена Святого Иоанна, пользуется немалой славой в Средиземноморье: его имя — символ воинской доблести и просвещения. [target_character.GetLastNameWithNoTooltip] известен своим вкладом не только в военные и управленческие дела, но и в распространение знания: так, благодаря его усилиям немало классических трудов было переведено на #TOOLTIP:DIALECT,aragonese_dialect,X #L арагонский#!#! и #TOOLTIP:LANGUAGE,latin_language,X #L латинский#!#! языки. [ROOT.GetCountry.GetGovernment.GetCourtTitle] считает, что [target_character.GetLastNameWithNoTooltip] — подлинное воплощение рыцарских идеалов и искусства управления государством; таких людей на свете очень мало. Его захочет принять [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] любой державы, в том числе и нашей. Он может либо поступить на службу к нам, либо применить свои стратегические таланты на поле боя. В [ROOT.GetCountry.Custom('longname_ru_PREP')] это оценят."
 flavor_ara.23.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл' )] на престол #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U] и [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] собрались в величественном #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#! [target_location.GetName], чтобы посмотреть на [Select_CString(target_character.IsFemale, 'её', 'его' )] коронацию. Здесь [Select_CString(target_character.IsFemale, 'она', 'он' )] принесёт клятву хранить законы державы, свободы народа и привилегии сословий."
 flavor_ara.24.a:0 "Вернём [target_location.Custom('LR_ACC')|l]."
 flavor_ara.24.desc:0 "[target_character.GetName] владеет #L [ROOT.GetCountry.GetAdjective]ой#! державой по праву наследования, но проку от этого немного: [target_location.GetName] — в чужих руках, а значит, мы не сможем короновать там [Select_CString(target_character.IsFemale, 'новую правительницу', 'нового правителя' )]; если же провести церемонию в другом месте, её признают незаконной. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U] требуют вернуть #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! под нашу власть, чтобы [target_character.GetName] [Select_CString(target_character.IsFemale, 'принесла', 'принёс' )] положенные клятвы и [Select_CString(target_character.IsFemale, 'подтвердила', 'подтвердил' )] своё обязательство защищать права знати."
 flavor_ara.40.desc:0 "[ShowLocationName('barcelona')], пожалуй, один из самых благополучных городов #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, однако при всём её благополучии здесь по-прежнему нет прав, которые гарантировали бы строительство и развитие учебных заведений. Учащиеся медицинской школы, что находится в самом сердце #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#!, при поддержке многочисленных гильдий начали требовать от нас официального признания, чтобы школа и впредь могла открывать свои двери простому народу. Это требование сегодня рассматривает [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]; некоторые — в том числе и [target_character.GetName] — даже открыто поддерживают пожалование городу новых прав. "
 flavor_ara.41.desc:0 "[ShowTownRightsName('studium_privileges')] самым благотворным образом способствуют распространению знаний среди жителей [target_location.Custom('LR_GEN')|l] [target_location.GetName] — как бедных, так и богатых. Но одних только этих прав недостаточно, чтобы обеспечить #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_DAT')|l]#!#! достойную его важность в научном мире. Чтобы исправить это, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] выделили средства на строительство нового #TOOLTIP:BUILDING_TYPE,university,X #L университета#!#!. Здесь будут преподавать на языках #TOOLTIP:RELIGIONGROUP,christian,X #L христианского#!#! и #TOOLTIP:RELIGIONGROUP,muslim,X #L исламского#!#! мира, чтобы всякий житель [target_location.Custom('LR_GEN')|l] смог вкусить плоды знаний."
 flavor_ara.7.desc:0 "Известный иезуитский проповедник и ректор иезуитской коллегии в #TOOLTIP:LOCATION,tarragona,X #L Таррагоне#!#! [target_character.GetName] широко прославился благодаря своему выдающемуся интеллекту. Проповеди его красноречивы, а представления о нравственности и политике глубоки, поэтому [target_character.GetLastNameWithNoTooltip] пользуется расположением среди жителей не только [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, но и в других державах. Его религиозные убеждения и размышления над вопросами о природе человека свидетельствуют как о духовной, так и о житейской мудрости.\n\nВпрочем, взгляды, которых придерживается [target_character.GetLastNameWithNoTooltip], вызывают определённые споры: в своих философских трудах он выступает против традиционного мышления, что уже привлекло к нему пристальное внимание #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католической церкви#!#!. Однако даже несмотря на это, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] нашей державы с радостью примет у себя столь умного и умеющего разбираться в сложных общественных и политических реалиях человека — там он наверняка сослужит хорошую службу."
 flavor_ath.2.desc:0 "О горе! [regent_of_athens.GetName] [Select_CString(regent_of_athens.IsFemale, 'сообщила', 'сообщил' )], что [Select_CString(scope_ruler.IsFemale, 'наша дорогая', 'наш дорогой' )] [scope_ruler.GetName] неожиданно [Select_CString(scope_ruler.IsFemale, 'скончалась', 'скончался' )] от некой тяжёлой болезни. В связи с этим [regent_of_athens.GetShortNameWithNoTooltip] [Select_CString(regent_of_athens.IsFemale, 'приняла', 'принял' )] на себя обязанности регента, которые [Select_CString(regent_of_athens.IsFemale, 'она', 'он' )] будет исполнять до тех пор, пока не будет решён вопрос наследования. [Select_CString(scope_ruler.IsFemale, 'Сама', 'Сам' )] [scope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'завещала', 'завещал' )], что [Select_CString(scope_ruler.IsFemale, 'её', 'его' )] [Select_CString(scope_heir.IsFemale, 'наследницей должна', 'наследником должен' )] стать [scope_heir.GetName], однако в данный момент [Select_CString(scope_heir.IsFemale, 'она', 'он' )] находится [sic_country.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[sic_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[sic_country.Custom('CL_tt')],X [sic_country.Custom('CL_PREP')|L]#!#! и потому не может принять бразды правления.\n\nПользуясь тем, что [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! временно образовался вакуум власти, недовольные #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонской#!#! дружиной члены двора обратились к регенту с предложением: пусть вместо [Select_CString(scope_heir.IsFemale, 'назначенной наследницы', 'назначенного наследника' )] на престол взойдёт [arg_ruler.GetName]. По их мнению, сейчас наиболее подходящий момент для того, чтобы вернуть власть династии [arg_ruler.GetDynasty.GetName]. Однако стоит учитывать, что [sic_country.GetAdjectiveWithNoTooltip|l]ое правительство непременно воспримет это решение как мятеж и, возможно, в ответ попытается лишить нашу державу всякой автономии. Кроме того, если [arg_ruler.GetShortNameWithNoTooltip] всё-таки примет наше приглашение, то нам также придётся убедить Каталонскую дружину признать [Select_CString(arg_ruler.IsFemale, 'новую наследницу', 'нового наследника' )]."
 flavor_ath.3_become_athens:0 "[ROOT.GetCountry.GetName] объедин[ROOT.GetCountry.Custom('end_ityat')]ся [scope_athens.Custom('predlog_sso')] [scope_athens.Custom('longname_ru_INST')] и получит [Concept('cores', 'национальные')|e] [Concept('locations', 'районы')|e] на всех [scope_athens.GetAdjectiveWithNoTooltip|l]их [Concept('core', 'национальных')|e] территориях"
 flavor_ath.4.desc:0 "Тайная дипломатическая миссия [arg_country_scope.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[arg_country_scope.Custom('CL_tt')] #TOOLTIP:COUNTRY,[arg_country_scope.Custom('CL_tt')],X [arg_country_scope.Custom('CL_ACC')|L]#!#!, которую [Select_CString(regent_of_athens.IsFemale, 'организовала', 'организовал' )] [regent_of_athens.GetShortName], прошла успешно: [arg_ruler.GetNameWithNoTooltip] [Select_CString(arg_ruler.IsFemale, 'рассмотрела наше предложение и согласилась', 'рассмотрел наше предложение и согласился' )] занять #L [ROOT.GetCountry.GetAdjective|l]ий#! престол. Тем временем вести о том, что [scope_ath_william.GetName] скончался, уже достигли #L [sic_country_scope.GetAdjective|l]их#! властей, и скоро им станет ясно, что [regent_of_athens.GetNameWithNoTooltip] [Select_CString(regent_of_athens.IsFemale, 'решила', 'решил' )] устроить переворот.\n\nНесмотря на то, что в 1311 году [scope_slained_brienne.GetName] [Select_CString(scope_slained_brienne.IsFemale, 'была свергнута', 'был свергнут' )] и [ROOT.GetCountry.GetFlavorRank|l] оказал[ROOT.GetCountry.Custom('endrank_assya')] под контролем #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонской#!#! дружины, [sic_country_scope.GetAdjectiveWithNoTooltip|l]ий двор не выказал наёмникам должного признания. В результате каталонцы заметно разочаровались в своих сюзеренах, и теперь они гораздо более охотно примут [arg_country_scope.GetAdjectiveWithNoTooltip|l]ую власть, если нам удастся с ними договориться."
 flavor_ath.5.desc:0 "Хотя с 1312 года [ROOT.GetCountry.GetName] формально принадлеж[ROOT.GetCountry.Custom('end_itat')] династии [scope_ath_william.GetDynasty.GetName], по факту власть в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] осуществляет #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонская#!#! дружина — разумеется, в интересах [sic_country_scope.GetAdjectiveWithNoTooltip|l]ого двора. Однако благодаря своим закулисным играм [regent_of_athens.GetName] [Select_CString(regent_of_athens.IsFemale, 'сумела', 'сумел' )] несколько изменить баланс сил, и теперь многие [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] всецело поддерживают претензии династии [scope_ruler.GetDynasty.GetName] на [ROOT.GetCountry.Custom('rank_ru_ACC')|l].\n\nПо счастливому стечению обстоятельств в последнее время многие члены дружины стали выражать недовольство [sic_country_scope.GetAdjectiveWithNoTooltip|l]ой властью. Они даже согласны уйти от своих прежних сюзеренов и встать на нашу сторону, но взамен они требуют достойное вознаграждение."
 flavor_ath.7.desc:0 "Наша тайная дипломатическая миссия [arg_country_scope.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[arg_country_scope.Custom('CL_tt')] #TOOLTIP:COUNTRY,[arg_country_scope.Custom('CL_tt')],X [arg_country_scope.Custom('CL_ACC')|L]#!#! обернулась провалом: [arg_ruler.GetName] [Select_CString(arg_ruler.IsFemale, 'отвергла наше предложение и отказалась', 'отверг наше предложение и отказался' )] от #L [ROOT.GetCountry.GetAdjective|l]ого#! престола. Пытаясь сохранить лицо, [regent_of_athens.GetName] спешно [Select_CString(regent_of_athens.IsFemale, 'приговорила', 'приговорил' )] своих подельников к заключению, однако некоторых членов двора этот спектакль совсем не убедил. Теперь они требуют бросить [Select_CString(regent_of_athens.IsFemale, 'её', 'его' )] в темницу вместе с остальными заговорщиками, пока [scope_heir.GetName] не [Select_CString(scope_heir.IsFemale, 'вернулась', 'вернулся' )] [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')]."
 flavor_ath.8.desc:0 "Династия [scope_ruler.GetDynasty.GetName] правит [ROOT.GetCountry.Custom('longname_ru_INST')] с тех самых пор, как [ROOT.GetCountry.GetFlavorRank|l] сдал[ROOT.GetCountry.Custom('endrank_assya')] #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонской#!#! дружине и присягнул[ROOT.GetCountry.Custom('endrank_fem')] на верность [sic_country.Custom('longname_ru_DAT')] в 1311 году. И хотя формально [Select_CString(scope_ruler.IsFemale, 'правительницей', 'правителем' )] считается [scope_ruler.GetName], фактически вся власть [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')] осуществляется самой дружиной. Кроме того, наёмники защищают [ROOT.GetCountry.Custom('rank_ru_ACC')|l] от посягательств со стороны других претендентов, главным из которых несомненно является [arg_ruler.GetName].\n\nДо сих пор каталонцы верно служили [sic_country.GetAdjectiveWithNoTooltip|l]ому двору, однако некоторые [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] сообщают, что в последнее время многие дружинники начали выражать своё недовольство правлением династии [scope_ruler.GetDynasty.GetNameWithNoTooltip]."
 flavor_bav.1400.desc:0 "Опасаясь городских бунтов, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'велела', 'велел' )] построить на окраине [target_location.Custom('LR_GEN')|l] [target_location.GetName] новую крепость — замок Нойвесте. Со временем [target_ruler.GetNameWithNoTooltip] и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] [target_country.GetGovernment.GetCourtTitle|l] обосновались в крепости на постоянной основе, превратив её в [target_country.GetGovernment.GetAdjective|l]ую резиденцию."
 flavor_bul.5.desc_common:0 "У [target_location.Custom('LR_GEN')|l] [target_location.GetName] наши войска впервые в истории сошлись в бою [GetCountry('TUR').Custom('predlog_sso')] #L [GetCountry('TUR').GetAdjective|l]ой#! армией."
 flavor_bul.8.desc:0 "Бедствие «$twilight_of_the_tsardom.1.title$» завершилось, и [ROOT.GetCountry.GetName] оправил[ROOT.GetCountry.Custom('end_assya')] от последствий долгой внутренней борьбы, в то время как [GetCountry('BYZ').GetName] всё ещё оста[GetCountry('BYZ').Custom('end_etyut')]ся раздробленной и уязвимой державой. У нас появилась редкая возможность нанести удар, пока империя не успела залечить раны, но нужно спешить."
 flavor_byz.1100.desc:0 "Богословские споры уже долгое время сотрясают сердце нашей империи. Мы стража и гордость #TOOLTIP:RELIGION,$orthodox_tt$,X #L православной#!#! веры, в своих поисках божественных тайн мы защищаем истинную доктрину.\n\nДо нас дошли вести о том, что [target_character_1.GetName] [Select_CString(target_character_1.IsFemale, 'обнаружила', 'обнаружил' )] тревожные расхождения в религиозных практиках монахов [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Своими духовными наставлениями [target_character_2.GetName] наталкивает монахов на смелые вопросы о сущности и энергиях Бога, а также поощряет сохранение внутреннего покоя и неустанные молитвы.\n\nВ ответ на это [target_character_1.GetShortNameWithNoTooltip] [Select_CString(target_character_1.IsFemale, 'направила', 'направил' )] свои возражения в письменной форме, где [Select_CString(target_character_1.IsFemale, 'осудила', 'осудил' )] эти идеи исихазма как опасные нововведения и [Select_CString(target_character_1.IsFemale, 'предупредила', 'предупредил' )], что подобные доктрины могут посеять смуту в умах верующих и подорвать хрупкий мир в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Советники предупреждают, что неконтролируемый фанатизм, будь то мистический или критический, может вызвать беспорядки, а то и открытый мятеж, поэтому рекомендуют подойти к делу рассудительно."
 flavor_byz.60.desc:0 "[target_character.GetName] и [target_character2.GetName] издавна были очень близки, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(target_character2.IsFemale, 'считала', 'считал' )] [target_character.GetHerHis] своей правой рукой. Когда [target_character2.GetNameWithNoTooltip] и [target_character2.GetHerHis] дед [GetCharacter('byz_andronikos_ii_palaiologos').GetName] затеяли конфликт, [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character2.IsFemale, 'поддержала', 'поддержал' )] первого, проявив себя верным товарищем и способным государственным деятелем.\n\nМногие считают, что [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'достойна', 'достоин' )] занять должность [Select_CString(target_character.IsFemale, 'императрицы-соправительницы', 'императора-соправителя' )], — и [target_character2.GetNameWithNoTooltip] действительно не раз [Select_CString(target_character2.IsFemale, 'предлагала', 'предлагал' )] [Select_CString(target_character.IsFemale, 'ей', 'ему' )] этот пост, — но [Select_CString(target_character.IsFemale, 'та неизменно отказывалась', 'тот неизменно отказывался' )]."
 flavor_byz.62.desc:0 "#L [GetCountry('EPI').GetAdjective]ая#! кампания 1337 года увенчалась грандиозным успехом. [GetCharacter('epi_nikephoros_ii_orsini').GetName] быстро [Select_CString(GetCharacter('epi_nikephoros_ii_orsini').IsFemale, 'лишилась', 'лишился' )] трона, а [target_character.GetName] и [GetCharacter('byz_andronikos_iii_palaiologos').GetName] своим блестящим руководством продемонстрировали местным жителям, что такое по-настоящему сильная держава. Побеждённые #L [target_country.GetAdjective|l]ие#! войска, поражённые нашей стремительной кампанией и великодушным обращением, разошлись по домам, разнося весть [ROOT.GetCountry.Custom('predlog_obo')] #L [ROOT.GetCountry.GetAdjective|l]ом#! милосердии к [GetCountry('EPI').GetAdjectiveWithNoTooltip|l]им воинам и о дипломатическом даре, которым обладает [target_character.GetNameWithNoTooltip]."
 flavor_byz_ser.1.desc:0 "Большая часть #L [ROOT.GetCountry.GetAdjective|l]ой#! провинции [ShowProvinceDefinitionName('vardar_province')] находится во власти могущественного магната по имени [target_character.GetName], чья слава и влияние позволили [Select_CString(target_character.IsFemale, 'ей', 'ему' )] стать практически [Select_CString(target_character.IsFemale, 'независимой правительницей', 'независимым правителем' )]. Пока что [Select_CString(target_character.IsFemale, 'она', 'он' )] сохраняет формальную преданность [ROOT.GetCountry.Custom('rank_ru_DAT')|l]. Однако столь богатые и влиятельные правители редко хранят верность сюзерену слишком долго.\n\nПо слухам, [target_character.GetNameWithNoTooltip] подумывает разорвать свои вассальные узы ради титулов в [target_country2.Custom('longname_ru_PREP')] или даже в [target_country3.Custom('longname_ru_PREP')]."
 flavor_byz_ser.3.desc:0 "[target_character.GetName], ранее [Select_CString(target_character.IsFemale, 'отличившаяся', 'отличившийся' )] в кровавой #L [target_country2.GetAdjective|l]ой#! гражданской войне, [Select_CString(target_character.IsFemale, 'приобрела', 'приобрёл' )] значительную власть и влияние [ROOT.GetCountry.Custom('predlog_vvo')] #L [ROOT.GetCountry.GetAdjective|l]ой#! провинции [ShowProvinceDefinitionName('vardar_province')]. Несмотря на то, что [Select_CString(target_character.IsFemale, 'она', 'он' )] остаётся #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассалом#!#! #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'её', 'его' )] правление практически ничем не ограничено благодаря #TOOLTIP:SOCIETAL_VALUE,centralization_vs_decentralization,X #L децентрализации#!#! [target_country.Custom('CL_GEN')]. [Select_CString(target_character.IsFemale, 'Она', 'Он' )] [target_character.GetSheHe] может стать самой влиятельной фигурой в регионе."
 flavor_byz_ser.6.desc:0 "Между #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и [target_country2.Custom('longname_ru_INST')] вспыхнул дипломатический конфликт, в ходе которого произошло нечто поистине необычное! Лорды #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_GEN')|L]#!#! перешли на сторону [target_country2.Custom('longname_ru_wntt_GEN')], присягнув врагам своих прежних повелителей. Редко какой магнат осмеливается предать своего сюзерена!\n\n[origin_country.GetGovernment.GetRulerTitle] [origin_country.Custom('CL_GEN')] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'решила', 'решил' )] судьбу провинции [ShowProvinceDefinitionName('vardar_province')] — [origin_country.GetNameWithNoTooltip] больше не склон[origin_country.Custom('end_ityat')]ся перед [target_country.Custom('CL_INST')], поскольку будущее этой державы отныне связано [target_country2.Custom('predlog_sso')] [target_country2.Custom('CL_INST')]."
 flavor_byz_ven.11.desc:0 "Наша казна оскудела. Среди обязательств, расторгнутых в результате финансового краха, оказался заём, который мы предоставили [origin_country.Custom('longname_ru_DAT')]. [target_woa.GetName] — это творение послужило залогом. Теперь контракт разорван, и бесценные сокровища, а с ним и рычаги влияния, возвращаются [origin_country.Custom('predlog_vvo')] [origin_country.Custom('CL_ACC')]."
 flavor_byz_ven.16.desc:0 "Послы из [GetCountry('VEN').Custom('longname_ru_GEN')] прибыли ко двору с заманчивым предложением: они хотят объединиться против [GetCountry('GEN').Custom('longname_ru_GEN')], чьи торговые флоты начали вести себя слишком дерзко в #TOOLTIP:AREA,aegean_sea_area,X #L Эгейском море#!#! после захвата #TOOLTIP:LOCATION,chios,X #L Хиоса#!#!.\n\nХотя наши отношения [GetCountry('VEN').Custom('predlog_sso')] [GetCountry('VEN').Custom('CL_INST')] не всегда складывались гладко, мы будем только рады обрести союзника в борьбе [GetCountry('GEN').Custom('predlog_sso')] [GetCountry('GEN').GetAdjectiveWithNoTooltip|l]ими завоевателями."
 flavor_byz_ven.2.b:0 "Пусть [origin_country.GetFlavorRank|l] пад[origin_country.Custom('endrank_etut')]."
 flavor_byz_ven.6.desc:0 "[target_army.GetName] — герои. Им удалось вернуть [Concept('work_of_art', 'творение')|e] «[target_woa.GetName]» [target.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_ACC')|L]#!#!, где их тепло приветствовали при #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе. Отныне ни один враг не сможет использовать драгоценности против нас!"
 flavor_byz_ven.6.desc_recovered:0 "[target_woa.GetName] — нам вместе [target.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_INST')|L]#!#! удалось вернуть это творение. Теперь наши регалии хранятся при #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе, где ни один враг не сможет использовать их против нас!"
 flavor_byz_ven.7.desc:0 "Недавний захват [location.Custom('LR_GEN')|l] [location.GetName] стал большим успехом для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [target_army.GetName] — эти наши войска тщательно «осмотрели» территорию. Теперь у них в руках [Concept('work_of_art', 'творение')|e] «[target_woa.GetName]», которое обладает большой ценностью для наших союзников [origin_country.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_PREP')|L]#!#!. Мы могли бы вернуть им эти драгоценности… но разве мы не заслужили свою долю добычи?"
 flavor_cas.26.desc:0 "[target_character.GetName] — выдающийся учёный, историк, поэт и государственный деятель, весьма популярный [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Его острый ум и дар красноречия пользуются большим уважением при дворе, кое-кто даже предлагает дать ему должность советника. В самом деле, [target_character.GetNameWithNoTooltip] — блестящий автор, он может составить прекрасную летопись нашего правления, сохранив память о наших достижениях для будущих поколений."
 flavor_cas.30.desc:0 "До нашего двора дошли вести, что [GetCountry('POR').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('POR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('POR').Custom('CL_tt')],X [GetCountry('POR').Custom('CL_PREP')|L]#!#! взяли на службу опытного мореплавателя по имени [magellan_scope.GetName]. Эта держава планирует снарядить амбициозную экспедицию в поисках западного морского пути к баснословно богатым Островам Пряностей. Наши страны давно соперничают в торговле и колонизации далёких берегов, и успешная реализация этих планов может нарушить сложившийся баланс сил. Многие сановники призывают к немедленным ответным действиям — например, организовать собственную экспедицию, которая опередит [GetCountry('POR').GetAdjectiveWithNoTooltip|l]ую флотилию и подтвердит наш статус ведущей морской державы. Возглавить это предприятие мог бы [target_character.GetName] — опытный мореход и судовладелец, отлично знающий моря."
 flavor_cas.40.desc:0 "Талантливый поэт и воин [target_character.GetName] прославился своим литературным даром и способностью понимать самые глубокие человеческие чувства. Черпая вдохновение в классических #TOOLTIP:REGION,italy_region,X #L итальянских#!#! традициях, он искусно объединяет их с #TOOLTIP:CULTURE,$castilian_tt$,X #L кастильской#!#! культурой, сочиняя стихи столь же изящные, сколь и новаторские. Кое-кто из советников предлагает пригласить его на службу, чтобы поднять престиж #L [ROOT.GetCountry.GetAdjective|l]ого#! двора и способствовать распространению идей #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#! в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]."
 flavor_cas.55.desc:0 "[target_character.GetName] — богослов-иезуит, известный представитель #TOOLTIP:BUILDING_TYPE,school_of_salamanca,X #L Саламанкской школы#!#!, — недавно опубликовал свою теорию суверенитета и взаимоотношений между правителем и подданными. Его аргументы в поддержку ограничения полномочий государства и добровольного согласия подданных способны укрепить моральные основы нашего правления, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] опасается, что подобные идеи могут подорвать легитимность [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой власти."
 flavor_chi.24.desc:0 "Из-за деспотической политики, которую последние несколько лет проводит [couped_character.GetName], политический климат в [ROOT.GetCountry.Custom('longname_ru_PREP')] совершенно изменился. Этот человек обладает практически неограниченной властью, его боится [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] — и даже [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'сама', 'сам' )] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]!\n\nЖелая положить конец его тирании, [recipient.GetName] задумал дворцовый переворот. Он планирует свергнуть своего дядю — а если получится, то и самому занять должность верховного канцлера. В заговоре [Select_CString(ruler_scope.IsFemale, 'замешана', 'замешан' )] даже [ruler_scope.GetName] — и немудрено, ведь [Select_CString(ruler_scope.IsFemale, 'ей', 'ему' )] не терпится освободиться от влияния могущественного вельможи."
 flavor_chi.78.desc:0 "Фискальная система [ROOT.GetCountry.Custom('longname_ru_GEN')] представляет собой хаотичное нагромождение разнообразных налоговых режимов, кое-как сосуществующих друг с другом. Неэффективность этой конструкции не позволяет правительству в полной мере использовать налоговую базу государства. Для решения этой проблемы предлагается ввести #TOOLTIP:GOVERNMENT_REFORM,single_whip_law,X #L «Закон одной плети»#!#!, который обяжет всех в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] платить государственные налоги #TOOLTIP:GOODS,silver,X #L серебром#!#!. К несчастью, в стране не хватает денежной массы, необходимой для исполнения этого требования."
 flavor_chi.83.tooltip:0 "Группа мятежников «[target_rebel.GetName]» заполучит в союзники все #TOOLTIP:POPTYPE,peasants,X #L крестьянские#!#! [Concept('pop', 'группы населения')|e] в [Concept('province', 'провинции')|e] [target_province.GetName], и они получат [ROOT.ScriptValue('pop_satisfaction_mild_penalty')|%=+] к [Concept('pop_satisfaction', 'довольству')|e].\nВсе [Concept('location', 'районы')|e] [Concept('province', 'провинции')|e] [target_province.GetName] на [SCOPE.GetLocalVariable('length_of_agitation').GetValue|2-] г. получат [Concept('location_modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,chi_white_lotus_agitation,X #V #L «Пропаганда „Белого Лотоса“»#!#!."
 flavor_chi.96.b:0 "Если он хочет разрушить нашу [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ую культуру, мы не будем ему помогать."
 flavor_chi_pap.2.desc:0 "Несколько лет назад #L [target_country.GetAdjective|l]ие#! власти направили в [papal_state.Custom('longname_ru_ACC')] посланника с просьбой выделить священников, в которых так нуждались [target_pop_cath.GetName|l]. И вот сегодня он вернулся с радостными известиями.\n\n[papal_state.GetGovernment.GetRulerTitle] тепло [Select_CString(papal_state.GetGovernment.GetRuler.IsFemale, 'встретила', 'встретил' )] посла и [Select_CString(papal_state.GetGovernment.GetRuler.IsFemale, 'решила', 'решил' )] удовлетворить нашу просьбу. В страну [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл' )] [target_character.GetName] и десятки других священнослужителей, и скоро [target_building.GetName|l] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] вновь наполнится прихожанами."
 flavor_cro.1001.desc:0 "Посланники от наших подданных [GetCountry('CRO').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('CRO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CRO').Custom('CL_tt')],X [GetCountry('CRO').Custom('CL_PREP')|L]#!#! прибыли к #L [ROOT.GetCountry.GetAdjective|l]ому#! двору с предложением объединить должности бана #TOOLTIP:AREA,croatia_area,X #L Хорватии#!#! и бана #TOOLTIP:AREA,slavonia_area,X #L Славонии#!#!. По их мнению, единое управление укрепит оборону и облегчит административную нагрузку перед лицом #L [GetCountry('TUR').GetAdjective|l]ой#! угрозы."
 flavor_cro.1100.desc:0 "Могущественный магнат по имени [target_character.GetName] постепенно усиливает своё влияние [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. На своих родных землях он сумел устранить многих своих противников, благодаря чему #L [GetCountry('HUN').GetAdjective|l]ие#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] ослабили здесь хватку. Одни считают такое положение дел выгодным, а другие опасаются, что [GetCountry('HUN').GetNameWithNoTooltip] мо[GetCountry('HUN').Custom('end_gegu')] в любой момент восстановить свою власть. Появилось предложение: если [target_character.GetNameWithNoTooltip] признает, что #L [GetCountry('HUN').GetAdjective|l]ие#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] обладают властью над этой территорией, то [GetCountry('HUN').GetNameWithNoTooltip], в свою очередь, призна[GetCountry('HUN').Custom('end_etyut')] его власть над [ROOT.GetCountry.Custom('CL_INST')]."
 flavor_cro.1102.desc:0 "Наш посол вернулся с тревожными известиями. [GetCountry('HUN').GetAdjective]ие [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] отвергли предложение признать [Select_CString(target_character.IsFemale, 'нашу госпожу законной правительницей', 'нашего господина законным правителем' )] #ONCLICK:COUNTRY,[GetCountry('CRO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CRO').Custom('CL_tt')],X [GetCountry('CRO').Custom('CL_GEN')|L]#!#!, настаивая на том, что [ROOT.GetCountry.GetFlavorRank|l] явля[ROOT.GetCountry.Custom('endrank_etyut')]ся неотъемлемой частью унии. И хотя при #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе многие согласны, что тут ничего не изменить, кое-кто предлагает крайние меры: [target_character.GetName] [Select_CString(target_character.IsFemale, 'должна', 'должен' )] аннулировать договор Pacta Conventa, связывающий наш трон [GetCountry('HUN').Custom('predlog_sso')] [GetCountry('HUN').Custom('CL_INST')], и короновать себя в качестве [Select_CString(target_character.IsFemale, 'первой', 'первого' )] за более чем два столетия [Select_CString(target_character.IsFemale, 'местной королевы', 'местного короля' )] [GetCountry('CRO').Custom('CL_GEN')]."
 flavor_dan.1200.desc:0 "[target_valdemar.GetName] и [GetCharacter('dan_valdemar_iii').GetName] из #ONCLICK:COUNTRY,[GetCountry('SLV').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SLV').Custom('CL_tt')],X [GetCountry('SLV').Custom('CL_GEN')|L]#!#! заключают соглашение, согласно которому первый должен взять в жёны сестру второго — девушку по имени [target_helvig.GetName]. В [ROOT.GetCountry.Custom('longname_ru_PREP')] [GetCharacter('shl_gerhard_iii_holstein_rendsburg').GetName] обладает большим политическим влиянием, и такой союз помог бы не только уменьшить это влияние, но и вернуть короне огромные участки земли. Благодаря этому браку [target_valdemar.GetNameWithNoTooltip] мог бы усилить свои позиции и попытаться вернуть контроль над [ROOT.GetCountry.Custom('rank_ru_INST')|l]."
 flavor_dan.46.desc:0 "#TOOLTIP:ADVANCE_DEFINITION,dan_royal_life_guards,X #L Королевская лейб-гвардия#!#! — церемониальное и охранное подразделение #L [ROOT.GetCountry.GetAdjective]ой#! монархии, — играет ключевую роль в защите и поддержании статуса [ROOT.GetCountry.GetGovernment.GetAdjective]ой семьи. Этот полк не только оберегает наших правителей, но и символизирует несокрушимость королевской власти. Однако с ростом как внутренних, так и внешних угроз наши военные советники всё чаще предлагают усилить королевскую лейб-гвардию и увеличить её состав."
 flavor_dan.50.desc:0 "Мода на абсолютную монархию постепенно захлёстывает #TOOLTIP:CONTINENT,europe,X #L Европу#!#!: короли и императоры проводят реформы по централизации и составляют конституции, чтобы упрочить свою власть. Таким образом, перед нами встаёт вопрос: следует ли [ROOT.GetCountry.Custom('rank_ru_DAT')|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! поступить так же? Нам предложили создать #TOOLTIP:GOVERNMENT_REFORM,dan_the_kings_law,X #L Королевский закон#!#! — конституцию, согласно которой [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] будет [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'единоличной правительницей, на которую', 'единоличным правителем, на которого')] не могут влиять ни [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], ни иные институты. Принятие такого документа приведёт к кардинальным переменам в управлении государством: [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] получит безграничные полномочия, а [ROOT.GetCountry.Custom('CL_ACC')] ждёт приближение к другим абсолютным монархиям, возникающим по всему континенту."
 flavor_eng.25.b:0 "Члены [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] выдвигают ультиматум? Лучше пойти на уступки…"
 flavor_eng.250.desc:0 "[ROOT.GetCountry.GetGovernment.GetRulerTitle], не посоветовавшись с двором, [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'расторгла', 'расторг' )] предыдущий брак и [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'обвенчалась', 'обвенчался' )] с другим человеком: теперь [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'её', 'его' )] новый консорт — [ROOT.GetCountry.GetGovernment.GetConsort.GetName]. Кроме того, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'порвала', 'порвал' )] все связи с Римской церковью и [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'объявила', 'объявил' )] себя главой церкви в другой державе."
 flavor_eth.155.a:0 "Земля принадлежит [ROOT.GetCountry.Custom('CL_DAT')]."
 flavor_fra.1170.b:0 "Бертран дю Геклен принесёт больше пользы [GetCountry('BRI').Custom('predlog_vvo')] [GetCountry('BRI').Custom('CL_PREP')]."
 flavor_fra.2014.a:0 "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] своего не добьются."
 flavor_fra.2025.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale,'добилась', 'добился')] выдающихся успехов на должности министра, и [fra_ruler.GetName] признаёт [Select_CString(target_character.IsFemale,'её', 'его')] заслуги. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] всё больше беспокоится о чрезмерном влиянии [Select_CString(target_character.IsFemale,'сановницы', 'сановника')]. Многие придворные возмущены, что [target_character.GetLastNameWithNoTooltip] обладает чуть ли не монополией на большей части рынков #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. По их словам, [target_character.GetLastNameWithNoTooltip] больше заботится о собственном богатстве, чем о пополнении державной казны. Мало того, часть недовольных заявляет, что [target_character.GetLastNameWithNoTooltip] похищает гребцов для своих торговых галер, а также наживается на верфях и легковесных монетах.\n\nТеперь [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] в гневе требует, чтобы [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale,'была заключена','был заключён')] в тюрьму, [Select_CString(target_character.IsFemale,'лишена', 'лишён')] всех должностей и привилегий, а также [Select_CString(target_character.IsFemale,'предстала', 'предстал')] перед судом."
 flavor_fra.2035.desc:0 "До нас дошли вести, что Лигой общественного блага вступила в открытое противостояние с [ROOT.GetCountry.Custom('longname_ru_INST')]. Как члены союза мы должны решить, стоит ли проявить верность и присоединиться к борьбе за нашу независимость или остаться в стороне, пока другие сражаются."
 flavor_fra.429.title:0 "[Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'Неповторимая', 'Неповторимый')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]"
 flavor_fra.521.desc:0 "После того как в державе вновь разрешили вести дискуссии о принятии буллы Unigenitus в качестве закона #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], в лице не переносящих янсенизм советников, начинает открыто осуждать это движение. Ответом на это стал всплеск недовольства янсенистов, многие из которых пользуются большим влиянием среди членов [ROOT.GetCountry.Custom('parliament_ru_GEN')|l]. За обстановкой [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')] внимательно следит [pap_ruler.GetName], поэтому жёсткая борьба против сторонников буллы Unigenitus наверняка вызовет у папского престола гнев. С другой стороны, если позволить советникам-подстрекателям и дальше выражаться в том же духе, недовольство проявится уже в стенах [ROOT.GetCountry.Custom('parliament_ru_GEN')|l], среди сторонников янсенизма."
 flavor_fra_sco.103.a:0 "Пожалуй, сотрудничество [GetCountry('FRA').Custom('predlog_sso')] [GetCountry('FRA').Custom('CL_INST')] нам выгоднее, чем [GetCountry('ENG').Custom('predlog_sso')] [GetCountry('ENG').Custom('CL_INST')]."
 flavor_gen.54.desc:0 "Семейство [GetDynasty('spinola_dynasty').GetName] обладает огромным влиянием [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, за счёт чего оно уже много лет влияет на торговлю и политику [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. Теперь же члены этой семьи планируют основать свой банковский дом в [spinola_bank_hq.Custom('LR_PREP')|l] [spinola_bank_hq.GetName], полагая, что благодаря своим внушительным ресурсам они смогут составить конкуренцию даже самым крупным банкам Европы."
 flavor_gen.55.desc:0 "Банковский дом [ROOT.GetCountry.GetName] [GetCountry('GEN').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('GEN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GEN').Custom('CL_tt')],X [GetCountry('GEN').Custom('CL_PREP')|L]#!#! наконец-то начал работу. У нас есть тесные связи с дворами Европы и крупными торговыми домами Средиземноморья, а потому любой, кому нужна финансовая поддержка, непременно захочет воспользоваться нашими услугами."
 flavor_gen.57.desc:0 "Как и планировалось, мы открыли свой банковский дом [GetCountry('GEN').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('GEN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GEN').Custom('CL_tt')],X [GetCountry('GEN').Custom('CL_PREP')|L]#!#!. Семейство [GetDynasty('pallavicini_dynasty').GetName] всегда славилось стремлением к совершенству и ответственным подходом к работе, и мы должны сделать всё возможное, чтобы [ROOT.GetCountry.GetFlavorRank|l] соответствовал[ROOT.GetCountry.Custom('endrank_fem')] этой репутации."
 flavor_gen_tun.2.desc:0 "Завоевав и разграбив [target_location.Custom('LR_ACC')|l] [target_location.GetName], [ROOT.GetCountry.GetFlavorRank|l] получи[ROOT.GetCountry.Custom('endrank_fem')] крупную колонию в области [target_location.GetArea.GetName], чья культура и вера сильно отличаются от культуры и веры её новой метрополии в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Возможно, стоит передать эти земли одному из соседних племён."
 flavor_gen_tun.3.desc:0 "Посланник из #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! прибыл в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName] с предложением продать нам их владения в [target_location.Custom('LR_PREP')|l] [target_location.GetName] за немалые деньги. И всё же значение #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! сложно переоценить — приобретение этих владений стало бы весьма полезным для [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_geo.10.desc:0 "Наши дипломаты вернулись домой после долгого и изнурительного путешествия на Запад. Что же [Select_CString(target_country2.GetGovernment.GetRuler.IsFemale, 'ответила', 'ответил' )] [target_country2.GetGovernment.GetRulerTitle|l]? Нам бы очень пригодилась помощь #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_GEN')|L]#!#!.\n\nИ вот печать сломана… В воздухе повисла напряжённая тишина…"
 flavor_geo.2.a:0 "Наладим торговлю с [target_country1.Custom('CL_INST')]."
 flavor_geo.2.b:0 "Лучше обратимся к [target_country2.Custom('CL_DAT')]."
 flavor_geo.2.c:0 "Мы разбогатеем благодаря [target_country3.Custom('CL_DAT')]."
 flavor_geo.28.desc:0 "[target_character2.GetName] родился в семье мелких дворян. Родители описывали его как очень смышлёного и любопытного ребёнка. Его детство прошло в [target_location.Custom('LR_PREP')|l] [target_location.GetName], где он и открыл в себе неодолимую тягу к знаниям. Говорят, он проводил долгие часы за семейными книгами. Оказавшись при дворе, он прочёл все книги, которые были собраны [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой библиотеке. Он начал творить в юном возрасте, и некоторые из его произведений выглядят многообещающе. Если всерьёз взяться за его обучение, из него выйдет прекрасный писатель."
 flavor_gra.11.desc:0 "Производимый [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! #TOOLTIP:GOODS,silk,X #L шёлк#!#! — самый прославленный в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Иностранные купцы выстраиваются в очередь за этим товаром, чтобы #TOOLTIP:LOCATION,genoa,X #L генуэзские#!#!, #TOOLTIP:LOCATION,venice,X #L венецианские#!#! и даже #TOOLTIP:LOCATION,prague,X #L пражские#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] могли удовлетворить свою потребность в роскоши. Для нас, разумеется, такое положение более чем выгодно.\n\nОднако выгода может быть не только финансовой: наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] предлагают распространить торговлю шёлком на весь мир, чтобы сподвигнуть и другие державы покупать наш товар, а значит — монополизировать торговлю им. При этом вырастет и престиж нашего государства."
 flavor_gra.6.desc:0 "Нам поступило донесение от #italic вали#! [target_location.Custom('LR_GEN')|l] [target_location.GetName]: стены по-прежнему прочны, в гавани не протолкнуться от кораблей, а денег в нашу казну за этот месяц поступило больше, чем за весь год — из других районов [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. С алькасабы, увенчанной крепостью Хибральфаро, погожим утром открывается превосходный обзор на пролив, и пусть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] найдёт умиротворение в этом знании.\n\n[ROOT.GetCountry.GetCapital.GetName] обеспечивает нам место на престоле, а [target_location.GetNameWithNoTooltip] — почти всё остальное: налоговые поступления от входящих в гавань судов, близость #L [GetCountry('GEN').GetAdjective|l]их#! торговых представительств, предпочитающих оставаться здесь на зимовку, и обилие сладкого креплёного вина из глубинки — оно пользуется славой даже [GetCountry('FLA').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('FLA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FLA').Custom('CL_tt')],X [GetCountry('FLA').Custom('CL_PREP')|L]#!#!. Если мы вдруг утратим этот город, ничто не сможет восполнить нам такую потерю.\n\nИменно в этом, впрочем, и заинтересованы наши соперники. За гаванью уже два поколения подряд зорко след[GetCountry('CAS').Custom('end_ityat')] [GetCountry('CAS').GetName], но враг может ударить и изнутри: не один наш предшественник, водрузивший своё знамя на стены этой крепости, позднее вынужден был отбивать твердыню у мятежников."
 flavor_hab.2103.desc:0 "Дальновидный чиновник предложил [target_character.GetName] реформировать землепользование в [ROOT.GetCountry.Custom('rank_ru_GEN')|l], чтобы повысить его эффективность. Его план, известный как «раабизация», подразумевает передачу обширных земель, которыми владеют [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], в наследственную аренду мелким фермерам. [target_character.GetLastNameWithNoTooltip] утверждает, что [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] — наше будущее. Расширение их прав и возможностей позволит модернизировать сельское хозяйство, а также повысить производительность труда и доходы государства."
 flavor_hab.2302.desc:0 "Отличные новости из #ONCLICK:COUNTRY,[GetCountry('BUR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BUR').Custom('CL_tt')],X [GetCountry('BUR').Custom('CL_GEN')|L]#!#!! [burgundian_ruler.GetName] принимает наше предложение о браке. Это мудрое решение укрепит союз между нашими великими династиями, а обширные [GetCountry('BUR').GetAdjectiveWithNoTooltip|l]ие земли окажутся под #L [ROOT.GetCountry.GetAdjective|l]им#! контролем, что защитит их от посягательств #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!."
 flavor_hab.74.desc:0 "Дворянин [target_character.GetName] занимает высокое положение в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], вызывая у жителей державы одновременно страх и уважение. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] всегда могли положиться на него. Многие предлагают в награду за верность дать ему должность при дворе."
 flavor_hab.97.desc:0 "[target_character.GetName] покорила сердца слушателей своими чарующими мелодиями. Эта знаменитая певица, композитор и пианистка пользуется большим уважением в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Её ценят за выдающийся талант и способность вдохнуть жизнь в любое произведение. До нас дошли слухи, что [target_character.GetLastNameWithNoTooltip] не прочь стать нашим придворным музыкантом."
 flavor_hol.23.desc:0 "#L [ROOT.GetCountry.GetCulture.GetName]ое#! государство поддерживает свежие идеи, благодаря чему появляются новые пытливые мыслители, которые находят поддержку единомышленников. В число таких интеллектуалов входит [target_character.GetName], [Select_CString(target_character.IsFemale,'посвятившая', 'посвятивший')] свою жизнь сразу нескольким областям философии."
 flavor_hol.31.desc:0 "Многие жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] мечтают о новом порте. Если вложим средства в его строительство, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] будут благодарны, а мы улучшим своё положение в море."
 flavor_hun.600.desc:0 "В последнее время верность #ONCLICK:COUNTRY,[GetCountry('BOS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOS').Custom('CL_tt')],X [GetCountry('BOS').Custom('CL_GEN')|L]#!#! всё чаще ставится под сомнение. [bosnian_ruler.GetName|U] открыто подрывает наш авторитет и делает всё, чтобы ликвидировать остатки нашего влияния [GetCountry('BOS').Custom('predlog_vvo')] [GetCountry('BOS').Custom('CL_PREP')]. Советники обеспокоены тем, что сторонники [GetCountry('BOS').GetAdjectiveWithNoTooltip|l]ой независимости могут вступить в сговор с нашими врагами и втянуть нас в войну, исход которой станет губительным для нашей державы. Возможно, целесообразнее дать [GetCountry('BOS').Custom('CL_DAT')] независимость, чем пытаться любой ценой удержать эту область."
 flavor_ira.29.desc:0 "Наша столица, [target_capital2.GetName], остаётся желанной целью для многих наших врагов. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] считает, что в случае войны против #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! оборонять #L #TOOLTIP:LOCATIONRANK,[target_capital2.Custom('LR_tt')],X [target_capital2.Custom('LR_ACC')|l]#!#! будет очень сложно. Поэтому многие считают, что [target_capital.GetName] будет лучшим местом для размещения двора и правительства.\n\n[target_character.GetName] видит в этом решении не только стратегические соображения, но и возможность обуздать непокорные аристократические семейства #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Если обеспечить им защиту от врагов, они окажутся у нас в долгу — и мы всегда сможем потребовать ответной услуги."
 flavor_iro.46.b:0 "Распределим излишки по [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]им деревням."
 flavor_iro.65.desc:0 "[target_character.GetName] [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл' )] в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName] из #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!, чтобы проповедовать там #TOOLTIP:RELIGION,$catholic_tt$,X #L католическую#!#! веру, а также наладить отношения между [GetCountry('FRA').Custom('CL_INST')] и #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!. Ранее между [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ими воинами и [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ими экспедициями не раз происходили стычки.\n\nКое-кто сомневается в том, что [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'явилась', 'явился' )] с миром — [Select_CString(target_character.IsFemale, 'её', 'его' )] миссионерская деятельность может быть лишь прикрытием…"
 flavor_jap.105.desc:0 "В [ROOT.GetCountry.Custom('longname_ru_ACC')] нежданно явился изменник [ask_tadayoshi.GetName]. Он хочет, чтобы [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'приняла', 'принял' )] его клятву верности. [ask_tadayoshi.GetNameWithNoTooltip] недоволен тем, как [jap_ruler.GetName] правит #ONCLICK:COUNTRY,[GetCountry('JAP').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('JAP').Custom('CL_tt')],X [GetCountry('JAP').Custom('CL_INST')|L]#!#!, и готов поддержать наши притязания на Хризантемовый трон."
 flavor_jap.147.desc:0 "За время своего пребывания в #L Сёкоку-дзи#! [target_character.GetName] в совершенстве освоил технику #italic суйбоку#! под руководством таких мастеров, как [josetsu.GetName]. В дальнейшем он сделал головокружительную карьеру, став ведущим придворным живописцем столицы. [target_character.GetNameWithNoTooltip] написал множество работ. В [ROOT.GetCountry.Custom('rank_ru_PREP')|l] наиболее популярной среди них считается #L «Чтение в бамбуковой роще»#!."
 flavor_kie.4.c:0 "[ROOT.GetCountry.Custom('predlog_vvo')|U] [ROOT.GetCountry.Custom('CL_PREP')] ему не рады."
 flavor_kie.4.desc:0 "[target_location.GetName] — наш главный культурный центр, где было воспитано множество великих творцов. Одним из них является [target_character.GetName], выдающийся #TOOLTIP:ARTIST,iconographer,X #L иконописец#!#!, известный в религиозных кругах #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#!. Стремясь отойти от устоявшихся традиций и создать собственный стиль, он изъявил желание служить при нашем дворе. Художник надеется, что ему удастся добиться у властей разрешения основать [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! собственное культурное учреждение и тем самым помочь распространению #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! #TOOLTIP:RELIGION,$orthodox_tt$,X #L православной#!#! культуры по всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!."
 flavor_kni.14.desc:0 "[target_character.GetName] — выдающаяся личность, широко известная в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Он славится своим непоколебимым характером и искусством вести переговоры. [target_character.GetName], защитник крепостей [ROOT.GetCountry.Custom('rank_ru_GEN')|l], твёрдо намеревается укрепить нашу хватку над Средиземноморьем, чтобы другие державы трепетали перед нашей силой. Этому человеку свойственен и другой талант: он умело лавирует в политических водах #TOOLTIP:CONTINENT,europe,X #L Европы#!#! и всегда может заключить полезный союз и заручиться финансовой поддержкой."
 flavor_kni.3.desc:0 "На протяжении столетий небольшой, но профессиональный #L [ROOT.GetCountry.GetAdjective]ий#! флот оставался грозой наших многочисленных неприятелей-#L мусульман#!. Он безжалостно расправлялся с вражескими каперами, захватывал #L мусульманские#! торговые корабли, пополнял #L [ROOT.GetCountry.GetCapital.GetAdjective]ую#! казну и нагонял ужас на #L мусульманских#! моряков. Одним из крупнейших его достижений стал захват большой #TOOLTIP:LOCATION,alexandria,X #L александрийской#!#! каракки в [GetCurrentYear] году: трюм этого судна оказался доверху набит несметными богатствами."
 flavor_kor.3.desc:0 "[mongol_aristocrat.GetName] станет [Select_CString(mongol_aristocrat.IsFemale, 'новой представительницей', 'новым представителем')] #L [target_country.GetAdjective|l]ого#! двора в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] и будет следить за деятельностью нашего правительства."
 flavor_lat.6.title:0 "Успешные походы [target_country.Custom('predlog_vvo')] [target_country.Custom('CL_ACC')]"
 flavor_lat.8.b:0 "Нужно сохранить в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ий дух."
 flavor_lit.1000.b:0 "Мы не нуждаемся в [target_country2.GetCulture.GetNameWithNoTooltip|l]ой помощи."
 flavor_lit.31.desc:0 "Волна #TOOLTIP:SITUATION,reformation,X #L Католической Реформации#!#! прокатилась по #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ополчились друг на друга из-за теологических разногласий. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|U], заметив этот разлад, всё чаще считают, что #L [ROOT.GetCountry.GetReligion.GetAdjective]ая#! вера стала непосильным бременем для [ROOT.GetCountry.Custom('rank_ru_GEN')|l].\n\nПо всей державе люди пытаются возродить древние #L [ShowReligionAdjective('romuva')|l]ие#! верования — теперь у простого люда появился шанс избавиться от всех неудобств, которые доставляли [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]. Быть может, это знак, что и [ROOT.GetCountry.GetGovernment.GetCourtTitle] скоро вернётся к старым обычаям."
 flavor_lit.32.desc:0 "С усилением влияния #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! на #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и даже [ROOT.GetCountry.GetGovernment.GetCourtTitle] начали перенимать новую моду. Вдохновлённые #L [target_country.GetCulture.GetName|l]ими#! обычаями, они привносят в [ROOT.GetCountry.Custom('rank_ru_ACC')|l] новые идеи, книги и элементы культуры. Это помогло [ROOT.GetCountry.Custom('CL_DAT')] постепенно отказаться от изоляционизма, познакомив народ с более экзотическими традициями. Однако это также начало размывать #L [ROOT.GetCountry.GetCulture.GetName|l]ую#! культуру, превращая её в некий гибрид с [target_country.GetCulture.GetName|l]ой."
 flavor_lit.34.b:0 "Мы не станем порицать [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ие законы."
 flavor_luc.1000.desc:0 "Война, которую сейчас вед[target_country.Custom('end_etut')] [target_country.GetName], предоставила нам отличную возможность перейти к другому господину — если, конечно, у нас возникнет такое желание. Вместо того чтобы добиваться этой цели военным путём, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] предлагает продаться #ONCLICK:COUNTRY,[GetCountry('PIS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PIS').Custom('CL_tt')],X [GetCountry('PIS').Custom('CL_DAT')|L]#!#!, чтобы и пополнить казну, и продемонстрировать свою добрую волю."
 flavor_maj.19.desc:0 "В [ROOT.GetCountry.Custom('longname_ru_PREP')] начал активную деятельность некий проповедник, распространяющий [target_religion.GetAdjective|l]ую веру. Его зовут [target_character.GetName], и он сумел приобрести множество последователей. Дошло даже до того, что для облегчения своей миссионерской работы он открыл [target_religion.GetAdjectiveWithNoTooltip|l]ую школу. Сейчас он является очень уважаемым лидером и членом [target_religion.GetGroup.GetAdjectiveWithNoTooltip|l]ой общины [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!."
 flavor_mch.1.desc:0 "[target_character.GetShortName] предлагает провести в [ROOT.GetCountry.Custom('longname_ru_PREP')] масштабные реформы, чтобы преобразовать правительство и судебную власть по китайской модели."
 flavor_mll.1.title:0 "Напряжённые отношения [target_country.Custom('predlog_sso')] [target_country.Custom('CL_INST')]"
 flavor_mll.10.desc:0 "С восстановлением прежних отношений между #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! [target_country.GetLongNameWithNoTooltip] вновь обратил[target_country.Custom('endlong_fem')] свой взор к #TOOLTIP:AREA,balearics_area,X #L Балеарским островам#!#!. Экономика [ROOT.GetCountry.Custom('CL_GEN')] серьёзно пострадала из-за #TOOLTIP:CULTUREGROUP,maghrebi_group,X #L магрибских#!#! набегов и последствий конфликта [target_country_1.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country_1.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_1.Custom('CL_tt')],X [target_country_1.Custom('CL_INST')|L]#!#!, и [target_country.GetAdjectiveWithNoTooltip|l]ий двор предлагает наделить [ROOT.GetCountry.Custom('longname_ru_wntt_ACC')] статусом вице-королевства, что обеспечит островам дальнейшую поддержку [target_country.GetAdjectiveWithNoTooltip|l]ой короны."
 flavor_mll.11.a:0 "Пора разобраться [source_of_piracy.Custom('predlog_sso')] [source_of_piracy.GetAdjectiveWithNoTooltip|l]ими пиратами."
 flavor_mll.15.desc:0 "Экономическая политика [ROOT.GetCountry.Custom('longname_ru_GEN')] больше не зависит от капризов #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, и многие наши купцы с энтузиазмом открывают собственные предприятия, надеясь вернуть #L [ROOT.GetCountry.GetAdjective|l]ой#! торговле былое влияние в Средиземноморье. Столкновения между #ONCLICK:COUNTRY,[target_country_1.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_1.Custom('CL_tt')],X [target_country_1.Custom('CL_INST')|L]#!#! и [target_country.Custom('CL_INST')] изрядно подорвали экономический потенциал [ROOT.GetCountry.Custom('CL_GEN')], но когда [ROOT.GetCountry.GetFlavorRank|l] обрет[ROOT.GetCountry.Custom('endrank_etut')] независимость, [ShowScriptedGeographyName('mediterranean_sea_geography')] вновь будет считаться с купцами из нашей страны.\n\nКое-кто при дворе говорит, что [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] должны получить дополнительные привилегии — вместе со снятием прежних ограничений, оставшихся со времён [target_country.GetAdjectiveWithNoTooltip|l]ого правления, чтобы развитие нашей торговли получило дополнительный импульс. Иные, впрочем, опасаются, что с усилением городского сословия [ROOT.GetCountry.GetNameWithNoTooltip] риску[ROOT.GetCountry.Custom('end_etyut')] со временем превратиться в #TOOLTIP:GOVTYPE,republic,X #L республику#!#! наподобие #TOOLTIP:REGION,italy_region,X #L итальянских#!#!."
 flavor_mll.5.c:0 "Договоримся [target_country_1.Custom('predlog_sso')] [target_country_1.Custom('CL_INST')] о передаче [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 flavor_mll.6.desc:0 "В прошлом #L [target_country.GetAdjective|l]ие#! патрули успешно сдерживали #TOOLTIP:CULTUREGROUP,maghrebi_group,X #L магрибские#!#! набеги на #TOOLTIP:AREA,balearics_area,X #L Балеарские острова#!#!, однако в последние годы нападения корсаров стали серьёзной проблемой для [ROOT.GetCountry.Custom('longname_ru_GEN')].\n\nПока в отношениях [target_country.Custom('predlog_sso')] [target_country.Custom('CL_INST')] сохраняется напряжённость, некоторые вельможи при дворе предлагают возвести комплекс береговых укреплений для обороны островов от магрибских налётчиков — а заодно и от потенциального вторжения со стороны [target_country.Custom('CL_GEN')]…"
 flavor_mll.8.desc:0 "Все попытки примирить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! [target_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! путём переговоров себя исчерпали, [target_country.GetAdjectiveWithNoTooltip|l]ие дипломаты более не верят, что [our_ruler.GetName] пойдёт на компромисс. Следует ожидать, что в скором времени [target_country.GetLongNameWithNoTooltip] начн[target_country.Custom('endlong_etut')] искать предлог для открытого захвата [ROOT.GetCountry.Custom('CL_ACC')]."
 flavor_mll.9.desc:0 "Усилиями #L [target_country.GetAdjective|l]их#! и #L [ROOT.GetCountry.GetAdjective|l]их#! дипломатов нарастающий между державами кризис был предотвращён. И хотя [target_country.GetNameWithNoTooltip] по-прежнему не призна[target_country.Custom('end_etyut')] наше стремление к независимости, мы освободились от большей части финансовых обязательств перед сюзереном. Многие при дворе считают, что [our_ruler.GetNameWithNoTooltip] уже [Select_CString(our_ruler.IsFemale, 'одержала', 'одержал' )] большую дипломатическую победу, хотя ряд вельмож полагает, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] добиваться полной независимости от [target_country.Custom('CL_GEN')]."
 flavor_mlo.51.desc:0 "Наше желание создать единое государство со столицей в центре #TOOLTIP:AREA,lombardy_area,X #L Ломбардии#!#! вынудило нас оставить наш родной [milan_location.GetRank.GetNameWithNoTooltip|l] [milan_location.GetName]. Очевидно, что нам нужна большая резиденция в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Члены [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] предложили возвести пышный дворец, который станет символом новой эпохи."
 flavor_mor.34.desc:0 "Из-за нестабильности [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! многие начинают думать, что [target_character2.GetName] — [Select_CString(target_character2.IsFemale,'слабая', 'слабый')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]. Они считают, что [target_character.GetName] из мелкого знатного рода — куда лучше подходит на эту роль, и поддерживают его. Намереваясь свергнуть [Select_CString(target_character2.IsFemale,'нынешнюю правительницу', 'нынешнего правителя')] и занять [Select_CString(target_character2.IsFemale,'её', 'его')] место, [target_character.GetName] обещает мир, свободу и справедливость в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]."
 flavor_mos.50.desc:0 "Книжник и дипломат [dmitry_gerasimov.GetName] свободно владеет несколькими языками — это результат качественного образования, полученного в [GetCountry('LIV').Custom('longname_ru_PREP')]. Эти умения придутся весьма кстати, если назначить его послом при иностранном дворе. На этой должности он поспособствует укреплению дипломатической репутации #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и, несомненно, сможет завести полезные знакомства с другими учёными Возрождения. С другой стороны, его познаниям в языках можно найти и лучшее применение — например, для перевода религиозных текстов, которые помогут в дальнейшем распространении христианской веры."
 flavor_mos.55.desc:0 "Богослов [joseph_volotsky.GetName] стремится укрепить власть церкви, вводя ряд правил для противодействия коррупции и одновременно разрешая #TOOLTIP:BUILDING_TYPE,orthodox_monastery,X #L православным#!#! монастырям в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] распоряжаться землёй по своему усмотрению. Кроме того, он решительно выступает против #TOOLTIP:RELIGION,$strigolniki_tt$,X #L стригольничества#!#!, поэтому может быть полезен нам в борьбе с еретическими идеями."
 flavor_mug.10.desc:0 "В #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! господствует доктрина «[ShowReligiousSchoolName('din_i_ilahi_school')|l]», и многие предлагают создать молитвенный дом для размышлений о разных верованиях. Это место под названием [ShowBuildingTypeName('ibadat_khana')] должно объединить народ [ROOT.GetCountry.Custom('CL_GEN')] с помощью веры и стать истинным воплощением #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманизма#!#! [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_mug.13.desc:0 "Язык #TOOLTIP:LANGUAGE,rajasthani_language,X #L раджастхани#!#! довольно популярен при #L [ROOT.GetCountry.GetAdjective|l]ом#! дворе, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] нуждается в тех, кто сведущ в военном деле. Мы могли бы даровать таким людям более высокое положение в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], но высокопоставленные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], давно пользующиеся влиянием, будут возмущены."
 flavor_mug.7.desc:0 "В армии #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! долгое время ценились не заслуги, а количество земель в собственности. Чтобы сделать эту систему более справедливой, нужно даровать земли и богатства в зависимости от должности и достижений. Безусловно, это нарушит баланс власти в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], но зато значительно улучшит наши сухопутные войска."
 flavor_nap.222.desc:0 "[pope_scope.GetRuler.GetName] убеждается в справедливости наших слов и милостиво уступает нашей просьбе. [ROOT.GetCountry.GetGovernment.GetConsort.GetName] будет полностью восстановлен в правах и взойдёт на престол [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_nap.280.desc:0 "Люди ликуют! Теперь [GetCountry('TWS').GetGovernment.GetRulerOrRegent.GetName] правит обеими Сицилиями.\n\nВ результате войны Сицилийской вечерни королевство, созданное Рожером II, было разделено на две части, и бывшие братья и сёстры превратились в чужаков, соперников и врагов. К счастью, тёмные времена позади: мы снова стали единым народом! [GetCountry('TWS').Custom('GetRulerOrRegentTitle')] может гордиться этим достижением."
 flavor_nav.3.b:0 "Разместить основной [ROOT.GetCountry.GetAdjective|l] двор [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')]."
 flavor_nav.3.desc:0 "Получив в наследство владения, которыми прежде правили [GetCharacter('nav_philip_iii_evreux').GetName] и [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] теперь распоряжается обширными землями, включающими в себя #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! и ряд владений во #TOOLTIP:REGION,france_region,X #L Франции#!#!. Несмотря на то что [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] и [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] были соправителями [ROOT.GetCountry.Custom('CL_GEN')], они лишь изредка бывали в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], предпочитая жить во #TOOLTIP:REGION,france_region,X #L Франции#!#!.\n\nПосле того как [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол, многие союзники при [ROOT.GetCountry.GetAdjective|l]ом дворе просили [Select_CString(target_character.IsFemale, 'её', 'его')] обосноваться [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')]. Другие же считают, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] может преследовать более амбициозные цели относительно оспариваемой короны #TOOLTIP:REGION,france_region,X #L Франции#!#!."
 flavor_nav.4.desc:0 "Хотя многие подозревали, что [target_character.GetName] — [Select_CString(target_character.IsFemale, 'честолюбивая правительница', 'честолюбивый правитель')], мало кто ожидал услышать о [Select_CString(target_character.IsFemale, 'её', 'его')] намерении напрямую претендовать на престол #ONCLICK:COUNTRY,[fra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[fra_country.Custom('CL_tt')],X [fra_country.Custom('CL_GEN')|L]#!#!. Притязания на трон, которые предъявляет [target_character.GetNameWithNoTooltip], довольно сильны, поскольку у [Select_CString(target_character.IsFemale, 'неё', 'него')] в родственниках [GetCharacter('nav_jeanne_ii_capet').GetName], а вместе с ней вся династия #L Капетингов#!. Но одним из условий, на которых [GetCharacter('nav_jeanne_ii_capet').GetShortName] получила #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! в наследство, был отказ от права на престол [fra_country.Custom('CL_GEN')].\n\nМногие лорды [fra_country.Custom('CL_GEN')] всё равно вряд ли признают [Select_CString(target_character.IsFemale, 'её', 'его')] притязания из-за древнего #TOOLTIP:HEIRSELECTION,salic_law,X #L салического закона#!#!, а некоторые считают, что [target_character.GetNameWithNoTooltip] может воспользоваться своим политическим влиянием [fra_country.Custom('predlog_vvo')] [fra_country.Custom('CL_PREP')], чтобы переубедить более могущественных лордов."
 flavor_nor.1.desc:0 "#L [target_character.GetCulture.GetName]ий#! дворянин и рыцарь [target_character.GetName] в прошлом был дроттсете — то есть мог управлять страной, пока [ROOT.GetCountry.GetGovernment.GetRulerTitle] не займёт трон — и регентом #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Он прямой потомок древней [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой королевской династии и с 1440 по 1445 год служил начальником крепости Акерсхус. Наконец, [target_character.GetNameWithNoTooltip] — один из главных сторонников анти#L [target_country.GetAdjective|l]ой#! политики [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')]."
 flavor_nor.5.desc:0 "Согласно Пертскому договору, подписанному в XIII веке, [ROOT.GetCountry.GetLongName] отказыва[ROOT.GetCountry.Custom('endlong_etyut')]ся от претензий на Гебридские острова, а взамен [GetCountry('SCO').GetName] ежегодно выплачива[GetCountry('SCO').Custom('end_etyut')] бывшей сопернице компенсацию. Однако долги всё копятся, и напряжение между странами периодически вырывается наружу. Что бы ни пообещали друг другу наши предки, сегодня наши возможности силового воздействия на обитателей #TOOLTIP:AREA,scottish_highlands_area,X $tt_op_L$Хайленда$tt_cl_2$ сильно поубавились, и к тому же, по соседству назревают более насущные проблемы. Недавно нам поступило предложение об окончательном решении вопроса: мы можем за неплохую плату передать шотландцам графство #TOOLTIP:LOCATION,orkney,X $tt_op_L$Оркни$tt_cl_2$.\n\nПроблема в том, что титул графа Оркни — один из высочайших в [ROOT.GetCountry.Custom('longname_ru_wntt_PREP')], и он не раз становился ключевым преимуществом в борьбе за престол. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] сильно обеспокоены такой перспективой, хотя их мнение и не является решающим."
 flavor_nov.4.desc:0 "[pskov_country.GetName] наконец отправляет нам ответ! [pskov_country.GetGovernment.GetRulerTitle] признаёт наши права на псковские земли и присягает на верность #L [ROOT.GetCountry.GetAdjective|l]ому#! государству. Нам больше не придётся волноваться о том, что [pskov_country.GetNameWithNoTooltip] снова попытается вырваться из-под нашего контроля."
 flavor_ori.1.desc:0 "Мы проводим пышные обряды в великом храме города [ShowLocationName('puri')], поклоняясь божеству, которое общается с нами через деревянную статую. Иностранные правители не раз высмеивали наши практики, однако в штате #TOOLTIP:AREA,orissa_area,X #L Орисса#!#! владыка вселенной Джаганнатха пользуется огромной популярностью.\n\n[target_character.GetName] [Select_CString(target_character.IsFemale,'благоволила', 'благоволил')] жрецам Джаганнатхи, и династия [target_character.GetDynasty.GetName] должна продолжить эту традицию. Нам стоит взять под своё покровительство храм в [ShowLocationNameWithNoTooltip('puri')] и сделать культ Джаганнатхи ведущим в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]."
 flavor_ori.8.desc:0 "Недавно [target_character.GetName] и [Select_CString(target_character.IsFemale,'её', 'его')] [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] узнали о человеке по имени [target_character2.GetName]. Его сочинения не обрели широкую известность среди народа #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, однако они написаны на превосходном #L [ROOT.GetCountry.GetCourtLanguage.GetName|l]ом#! языке. Можно с уверенностью сказать, что это лучший образчик элитарной поэзии в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]."
 flavor_plc.10.desc:0 "Недавно один из представителей духовенства по имени [target_character.GetName] приобрёл большую известность в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Благодаря своим пламенным выступлениям и проповедям перед членами [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] [target_character.GetShortNameWithNoTooltip] стал весьма влиятельной фигурой в политике, и многие государственные деятели начали к нему прислушиваться."
 flavor_plc.2002.desc:0 "Надеясь обеспечить свою безопасность, [livonian_scope.GetLongName|l] заключил[livonian_scope.Custom('endlong_fem')] вассальный договор [nation_helping.Custom('predlog_sso')] #ONCLICK:COUNTRY,[nation_helping.Custom('CL_tt')] #TOOLTIP:COUNTRY,[nation_helping.Custom('CL_tt')],X [nation_helping.Custom('CL_INST')|L]#!#!. Этот союз угрожает нашим интересам в #TOOLTIP:AREA,baltic_area,X #L Балтийском#!#! регионе — мы должны немедленно вмешаться, пока связь между этими державами не стала слишком крепкой."
 flavor_pol.23.desc:0 "К счастью, члены нынешнего [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] прислушались к нашим аргументам и решили поддержать нашу политику."
 flavor_pol.24.desc:0 "К сожалению, члены нынешнего [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] не вняли нашим аргументам и выступили против нашей политики."
 flavor_pol.28.desc:0 "Богатство, в том числе наследственное, — действенный инструмент, если пользоваться им в интересах народа. Пример тому — самый знаменитый и старейший университет #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. В его прекрасных стенах, несущих в себе дух Ренессанса, будут воспитываться великие умы, которые проложат нам путь к звёздам, породят и обучат деятелей, способных самостоятельно вершить историю. Но для этого здание потребуется обновить и расширить."
 flavor_pol.46.desc.a:0 "Нам стало известно, что [dead_character.GetName] скоропостижно [Select_CString(dead_character.IsFemale,'скончалась', 'скончался')]. Мы скорбим по [Select_CString(ruler_scope.IsFemale,'покойной', 'покойному')], однако утрата возможности объединить две династии печалит нас ещё больше. Не стоит и говорить, что помолвка, которую заключили между собой [polish_candidate.GetNameWithNoTooltip] и [lithuanian_candidate.GetName], отныне считается несостоявшейся."
 flavor_pol.46.desc.c:0 "Новости о том, что [lithuanian_candidate.GetName] преждевременно [Select_CString(lithuanian_candidate.IsFemale,'вступила', 'вступил')] в брак, сорвали планы объединить две династии — [polish_candidate.GetDynasty.GetName] и [lithuanian_candidate.GetDynasty.GetName]. Чёрт бы побрал всех, кто не умеет держать слово! Теперь помолвка, которую заключили между собой [polish_candidate.GetNameWithNoTooltip] и [lithuanian_candidate.GetNameWithNoTooltip], считается несостоявшейся. Надо изобрести другой способ заманить #ONCLICK:COUNTRY,[GetCountry('LIT').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LIT').Custom('CL_tt')],X [GetCountry('LIT').Custom('CL_ACC')|L]#!#! в свою сферу влияния."
 flavor_por.66.desc:0 "Мы создали свой банк [GetCountry('POR').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('POR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('POR').Custom('CL_tt')],X [GetCountry('POR').Custom('CL_PREP')|L]#!#!. Через нашу бухгалтерию проходят доходы от торговли специями и кредиты европейских монархов. Мы докажем свою незаменимость не только купцам, но и [GetCountry('POR').Custom('rank_ru_DAT')|l]."
 flavor_rus.26.desc:0 "Перед нами стоит сразу несколько важных задач: перестроить экономику на современный лад, укрепить государственную власть, а вместе с тем — упрочить финансовое положение, поддержать промышленность державы и нарастить экспорт. Для этого потребуется провести череду реформ — только так мы выведем #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! на путь экономического процветания и самодостаточности."
 flavor_sco.102.a:0 "Мы прогоним эту [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ую марионетку!"
 flavor_sco.103.desc:0 "Недавняя война между #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_INST')|L]#!#! приковала к себе внимание нашего двора. По условиям Старого союза, в случае нападения [GetCountry('ENG').Custom('CL_GEN')] на одну из сторон, другая обязана вмешаться и вторгнуться на [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ие территории. Хотя [ROOT.GetCountry.GetName] всё ещё оправляется от попыток династии [GetCharacter('sco_edward_balliol').GetDynasty.GetName] захватить корону, некоторые считают, что мы обязаны выполнить свой союзнический долг и напасть на [GetCountry('ENG').Custom('CL_ACC')]."
 flavor_sco.106.a:0 "Из [Select_CString(target_character.IsFemale,'неё выйдет достойная правительница','него выйдет достойный правитель')]."
 flavor_sco.1203.desc_common:0 "Пришло время подобрать достойную супругу для монарха #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!, чтобы обеспечить долгосрочный мир и укрепить наши дипломатические связи с #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_INST')|L]#!#!.\n\nПо условиям Договора о вечном мире, [GetCountry('SCO').GetGovernment.GetRuler.GetName] может взять в жёны любую незамужнюю родственницу [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ого монарха."
 flavor_sco.210.desc:0 "Стремясь положить конец многовековому сотрудничеству #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!, #L [GetCountry('ENG').GetAdjective|l]ий#! правитель отправил посла с требованием разорвать эту давнюю связь. Хотя изначально Старый союз был предназначен для защиты от [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ой экспансии, [eng_ruler.GetName] утверждает, что союз уже давно утратил свой оборонительный характер, и теперь он якобы служит лишь для того, чтобы [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ие войска использовали [ROOT.GetCountry.Custom('CL_ACC')] как плацдарм для своего вторжения в [GetCountry('ENG').Custom('CL_ACC')].\n\n[eng_ruler.GetNameWithNoTooltip] уверяет, что в случае выполнения требований [ROOT.GetCountry.GetNameWithNoTooltip] может рассчитывать на дружественные и мирные отношения с [GetCountry('ENG').Custom('CL_INST')]. Но если мы откажемся, [Select_CString(eng_ruler.IsFemale,'она', 'он')] может посчитать это угрозой суверенитету своей державы и принять соответствующие меры."
 flavor_sco.301.desc:0 "С момента вступления на престол [sco_ruler.GetName] упорно пытается поддерживать дружественные отношения с [GetCountry('ENG').Custom('CL_INST')]. При этом [target_character.GetName] и [Select_CString(target_character.IsFemale,'её', 'его')] проповеди положили начало Реформации и религиозным конфликтам в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, из-за чего [sco_ruler.GetShortNameWithNoTooltip] [Select_CString(sco_ruler.IsFemale,'вынуждена', 'вынужден')] постоянно отвлекаться на внутренние дела.\n\nХотя [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] прилагает все усилия, чтобы уладить религиозные разногласия внутри страны, многие в совете критикуют [Select_CString(sco_ruler.IsFemale,'её', 'его')] подход. По их мнению, [sco_ruler.GetShortNameWithNoTooltip] уделяет слишком много внимания переговорам с [GetCountry('ENG').Custom('CL_INST')] и пренебрегает проблемами собственного народа, что может привести к ещё большей нестабильности."
 flavor_sco.401.desc:0 "В последние годы [target_character.GetName] снискал славу выдающегося мыслителя благодаря своим смелым философским идеям. Недавно [target_character.GetLastNameWithNoTooltip] представил свой новый труд под названием #L «Трактат о человеческой природе»#!, который уже получил признание за глубокий анализ человеческого естества.\n\nЖелая поддержать философа, некоторые члены двора предлагают помочь в распространении его нового трактата в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]."
 flavor_ser.140.desc:0 "[target_character.GetName] [target_character.GetBirthDate] года рождения — крупный #TOOLTIP:CULTURE,$serbian_tt$,X #L сербский#!#! учёный, писатель и просветитель. Его труды оказали большое влияние не только на сербскую культуру, но и на общеевропейские идеи Просвещения.\n\nПод влиянием западных мыслителей [target_character.GetLastNameWithNoTooltip] занялся обновлением языка и приведением сербской литературы в соответствие с разговорной речью. Произведения, написанные на #L [ROOT.GetCountry.GetReligion.GetLanguage.GetName|l]ом#!, — преимущественно языке богослужения, — прежде были малопонятны для простого народа.\n\nНекоторые члены правительства выступают за то, чтобы предложить учёному должность советника. Их оппоненты утверждают, что [target_character.GetLastNameWithNoTooltip] не представляет из себя ничего особенного."
 flavor_swe.27.desc:0 "Необходимость внутренних реформ в [ROOT.GetCountry.Custom('longname_ru_PREP')] назрела уже давно, и особенно это касается наших урожаев. Мы наняли специалиста из- за границы, чтобы он мог давать нам советы по поводу этих улучшений. Его радикальные планы предусматривают перестройку всего нашего сельского хозяйства сверху донизу, от переселения крестьян до изъятия традиционных общинных земель и прав выпаса ради создания более крупных и эффективных ферм. Приведение в жизнь этих реформ позволит сильно увеличить наши урожаи, но [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] будут недовольны."
 flavor_swe_teu.4.a:0 "$pirate_events.2.a$"
 flavor_teu.13.desc:0 "В последнее время у жителей [ROOT.GetCountry.Custom('rank_ru_GEN')|l] стала популярна отшельница по имени [target_character.GetName], известная своим пророческим даром. В [ROOT.GetCountry.Custom('longname_ru_PREP')] повсюду обсуждают многочисленные видения этой женщины. Одни считают её откровения вымыслом, другие верят в их достоверность, а третьи вообще предпочли бы сжечь отшельницу на костре.\n\nОдин раз [target_character.GetNameWithNoTooltip] уже обвинялась в колдовстве и была оправдана, но это не мешает её врагам требовать нового суда."
 flavor_tim.9.desc:0 "[target_character.GetName] был великим завоевателем и присоединил к нашей державе обширные земли, однако оказался не самым способным руководителем. Теперь, когда значительная часть нашего населения состоит из #TOOLTIP:CULTUREGROUP,iranian_group,X #L иранцев#!#!, система управления явно нуждается в изменениях. В связи с этим [target_character2.GetName] планирует преобразовать [ROOT.GetCountry.Custom('rank_ru_ACC')|l] в более бюрократическое государство. При этом потомки нашего славного правителя получат должности наместников, чтобы набраться опыта и в будущем взять бразды правления в свои руки. Проблема состоит в том, что для достижения этих целей нам придётся принять многие иранские нормы и внедрить их в своё законодательство, что вряд ли обрадует нашу #L [ROOT.GetCountry.GetCulture.GetName|l]ую#! аристократию."
 flavor_tle.13.desc:0 "Если [target_location2.GetName] — наши врата к торговле в Сахаре, то [target_location.GetName] — наше окно к торговле в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Значение порта в [target_location.Custom('CL_PREP')] сложно переоценить, поскольку это главная гавань, связывающая нас с нашими морскими партнёрами на Средиземноморье. Возможно, стоит даровать #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_DAT')|l]#!#! дополнительные привилегии. Таким образом, местные [target_estate.GetName|l] смогут укрепить своё положение благодаря нашей помощи."
 flavor_tle.5.desc:0 "[target_character.GetName], [Select_CString(target_character.IsFemale, 'претендентка', 'претендент')] на [from_country.GetAdjective|l]ий трон, [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл')] в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName], где его приветствовали [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] и представители #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племён#!#!. Фактически этот шаг равносилен объявлению войны со стороны #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! [target_country.Custom('longname_ru_DAT')], державе, которая уже слишком долго удерживает власть над [ROOT.GetCountry.GetCapital.Custom('LR_INST')|l] [ROOT.GetCountry.GetCapital.GetName]. [target_character.GetShortNameWithNoTooltip] пользуется широкой поддержкой [from_country.Custom('predlog_vvo')] [from_country.Custom('CL_PREP')], но самое главное то, что [Select_CString(target_character.IsFemale, 'она заручилась', 'он заручился')] поддержкой Бану Абд аль-Вад, крупнейшего и сильнейшего из #TOOLTIP:CULTURE,$zenati_tt$,X #L зенетских#!#! племён в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], к которому принадлежит и династия [target_dynasty.GetName].\n\nМы ещё покажем этим [target_country.GetAdjectiveWithNoTooltip|l]им мерзавцам, что [target_war.GetName] закончится нашей победой!"
 flavor_tle.6.title:0 "Восстание в [from_country.Custom('longname_ru_wntt_PREP')]!"
 flavor_tun.14.desc:0 "[Select_CString(target_character.IsFemale, 'Одна из хафсидских принцесс', 'Один из хафсидских принцев')] по имени [target_character.GetName] [Select_CString(target_character.IsFemale, 'стала настолько влиятельной', 'стал настолько влиятельным')], что [Select_CString(target_character.IsFemale, 'потребовала', 'потребовал')] должность [Select_CString(target_character.IsFemale, 'родственной губернаторши', 'родственного губернатора')]. Если мы не уступим, и [target_character.GetNameWithNoTooltip] не получит [target_location.Custom('LR_ACC')|l] [target_location.GetName], мы рискуем спровоцировать волнения в [ROOT.GetCountry.Custom('longname_ru_PREP')]."
 flavor_tun.16.title:0 "Престолонаследие [target.Custom('predlog_vvo')] [target.Custom('CL_PREP')]"
 flavor_tun.17.title:0 "Спор о престолонаследии [from_country.Custom('predlog_vvo')] [from_country.Custom('CL_PREP')]"
 flavor_tun.5.title:0 "Назначение [from_country.Custom('predlog_vvo')] [from_country.Custom('CL_PREP')]"
 flavor_tun.7.desc:0 "Несмотря на то что [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'была объявлена наследницей', 'был объявлен наследником')] [from_country.Custom('longname_ru_GEN')], [Select_CString(target_character2.IsFemale, 'её', 'его')] непокорный сиблинг [target_character.GetName] [Select_CString(target_character.IsFemale, 'решила', 'решил')] воспользоваться своим положением в столице, чтобы присвоить себе власть в [from_country.Custom('rank_ru_PREP')|l]. [target_character2.GetShortNameWithNoTooltip] [target_country.GetAdjective][Select_CString(target_character2.IsFemale, 'ая', 'ий' )] наверняка придёт в ярость и, несомненно, выступит против [Select_CString(target_character.IsFemale, 'своей', 'своего')] [Select_CString(target_character2.IsFemale,'сестры', 'брата')] с оружием в руках."
 flavor_tun.8.desc:0 "[target_character2.GetName] [Select_CString(target_character2.IsFemale, 'лишилась', 'лишился')] своего права на престол [from_country.Custom('longname_ru_GEN')]. Власть [Select_CString(target_character.IsFemale, 'узурпировала', 'узурпировал')] [Select_CString(target_character2.IsFemale, 'её', 'его')] [Select_CString(target_character.IsFemale,'сестра', 'брат')] по имени [target_character.GetName]. [Select_CString(target_character.IsFemale,'Та', 'Тот')] незамедлительно [Select_CString(target_character.IsFemale, 'захватила', 'захватил')] власть в [from_country.Custom('rank_ru_PREP')|l] и [Select_CString(target_character.IsFemale, 'подчинила', 'подчинил')] [from_country.GetAdjective|l]ий двор.\n\n[target_character2.GetShortNameWithNoTooltip] видит, как [Select_CString(target_character2.IsFemale, 'её', 'его')] имя покрывается позором. Какое унижение! [target_character.GetShortNameWithNoTooltip] заслуживает возмездия."
 flavor_tur.1003.desc:0 "Одержав немало побед, [target_character.GetName] [Select_CString(target_character.IsFemale, 'выделилась', 'выделился' )] среди многих славных воинов и [Select_CString(target_character.IsFemale, 'доказала', 'доказал' )], что [Select_CString(target_character.IsFemale, 'её', 'его' )] единственная цель — служение #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Теперь [Select_CString(target_character.IsFemale, 'её', 'его' )] привлекает новая должность — [ShowSubjectTypeName('uc_bey')] в #TOOLTIP:PROVINCE_DEFINITION,albania_province,X #L Албании#!#!. [target_character2.GetName] и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] высоко ценят талант и заслуги [Select_CString(target_character.IsFemale, 'этой женщины', 'этого человека' )], но опасаются, что дело может закончится мятежом — ведь [Select_CString(target_character.IsFemale, 'она', 'он' )] всё-таки [Select_CString(target_character.IsFemale, 'заложница', 'заложник' )]."
 flavor_tur.1004.desc:0 "[target_character2.GetName], много лет [Select_CString(target_character2.IsFemale, 'прослужившая', 'прослуживший' )] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, [Select_CString(target_character2.IsFemale, 'получила', 'получил' )] титул в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#! и по этой причине [Select_CString(target_character2.IsFemale, 'впала', 'впал' )] в немилость [ROOT.GetCountry.GetAdjective|l]ого двора. [Select_CString(target_character2.IsFemale, 'Она', 'Он' )] хочет создать для #TOOLTIP:CULTURE,$albanian_tt$,X #L албанцев#!#! независимое государство и надеется исполнить свою мечту вопреки нашей воле."
 flavor_tur.1005.desc:0 "Много лет прослужив #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, [target_character.GetName] [Select_CString(target_character.IsFemale, 'осознала', 'осознал' )], что никакие заслуги не позволят [Select_CString(target_character.IsFemale, 'ей', 'ему' )] добиться независимости для #TOOLTIP:CULTURE,$albanian_tt$,X #L албанцев#!#!. Поэтому сейчас [Select_CString(target_character.IsFemale, 'она бежала', 'он бежал' )] в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#!, надеясь получить от этой державы помощь в исполнении своей мечты."
 flavor_tur.141.desc:0 "[muteferrika.GetName] много лет верно служил нам на дипломатическом поприще, но истинной его страстью всегда были науки, и он долго изучал историю #TOOLTIP:CONTINENT,europe,X #L Европы#!#!. Теперь он хочет основать в [capital_location.Custom('LR_PREP')|l] [capital_location.GetName] типографию, где будет использовано новое, только недавно начавшее распространяться в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] изобретение — подвижные #TOOLTIP:LANGUAGE,arabic_language,X #L арабские#!#! шрифты. Но кое-кто из духовенства резко возражает против такого нововведения — [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] утверждают, что печать уничтожит искусство каллиграфии, которое так ценят богобоязненные люди."
 flavor_tur.213.desc:0 "Похоже, наши конфликты [target_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! скоро закончатся. Когда мы захватим [target_location.Custom('LR_ACC')|l] [target_location.GetName], живущий там аббасидский халиф неизбежно окажется у нас в руках. Очевидно, что [target_country.GetNameWithNoTooltip] не в силах защитить ни свою веру, ни свои земли. Возможно, когда-нибудь мы ещё воспользуемся этой слабостью, а пока мы празднуем открытие врат #TOOLTIP:REGION,egypt_region,X #L Египта#!#!."
 flavor_tur.221.desc:0 "Хотя [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetName] давно является оплотом [ROOT.GetCountry.GetReligion.GetAdjective|l]ой веры, [target_character2.GetName] с горечью отмечает, что в последние годы #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_DAT')|l]#!#! недостаёт славы и благочестия. Поэтому [Select_CString(target_character2.IsFemale, 'она', 'он' )] желает построить новую мечеть рядом с ипподромом византийской эпохи. По [Select_CString(target_character2.IsFemale, 'её', 'его' )] поручению [target_character.GetName] проектирует самый экстравагантный архитектурный памятник за всю [ROOT.GetCountry.GetAdjective|l]ую историю, выделяющийся среди всех прочих мечетей."
 flavor_usa.9.b.tt:0 "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] провинции [unrest_location.GetProvince.GetName] повышается на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%], однако [Concept('control', 'контроль')|e] в её районах понижается на [ShowNamedValue('control_mild_penalty')|+=2%]"
 flavor_ven.45.a:0 "Хорошо, что в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] есть такие люди!"
 flavor_ven.6.b:0 "Только не у нас [ROOT.GetCountry.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')]!"
 flavor_ven.88.desc:0 "[target_character.GetName] — талантливый композитор, обучавшийся в #TOOLTIP:LOCATION,venice,X #L Венеции#!#!. Проведя несколько лет [target_country.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#!, где он служил при дворе и прославился новшествами в области светской вокальной музыки, [target_character.GetName] вернулся в [ROOT.GetCountry.Custom('rank_ru_ACC')|l]. Здесь он предлагает нам основать консерваторию, которая объединит музыкальные традиции [target_country.Custom('CL_GEN')] и #TOOLTIP:REGION,italy_region,X #L Италии#!#!."
 flavor_ven.90.desc:0 "Знаменитый драматург [target_character.GetName] собирается выпустить [ROOT.GetCountry.Custom('predlog_vvo')] #L [ROOT.GetCountry.GetAdjective|l]ом#! #TOOLTIP:BUILDING_TYPE,opera_house,X #L оперном театре#!#! несколько новых постановок, что пойдёт на пользу и жаждущей зрелищ публике, и престижу [ROOT.GetCountry.Custom('rank_ru_GEN')|l] в целом. Если его затея увенчается успехом, мы в очередной раз подтвердим, что нас по заслугам считают покровителями искусства и культуры, однако некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] предостерегают нас: они считают, что опера разлагает душу и доводит людей до греха."
 flavor_ver.3.desc:0 "[target_war.GetName] против династии [target_dynasty.GetName] [target_country.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#! идёт превосходно: недавно наши войска заняли провинцию [target_province.GetName] — местность, где [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! пользуется сильным влиянием. Возможно, стоит выдвинуть на неё притязания, чтобы наши союзники в #ONCLICK:COUNTRY,[war_leader.Custom('CL_tt')] #TOOLTIP:COUNTRY,[war_leader.Custom('CL_tt')],X [war_leader.Custom('CL_PREP')|L]#!#! знали, что у нас есть собственный интерес к владениям династии [target_dynasty.GetNameWithNoTooltip]."
 flavor_vol.1001.desc:0 "#L [target_country.GetAdjective|U]ие#! [target_country.GetGovernment.GetEstateName('nobles_estate')|l] оказались весьма убедительны, и [target_ruler.GetName] провозгласил, что его поддержку в борьбе за престол получит [target_heir.GetName]. Поскольку [target_ruler.GetShortNameWithNoTooltip] связан с нашим семейством относительно крепкими узами, мы рассчитывали, что после его смерти сможем заручиться в [target_country.Custom('rank_ru_PREP')|l] значительным влиянием, однако при таком повороте событий наши замыслы не сбудутся. Если [target_country.GetNameWithNoTooltip] отрица[target_country.Custom('end_etyut')] наше право на престолонаследие, мы возьмём своё силой."
 flavor_zan.2.desc:0 "[target_character2.GetName] — светоч добродетели и воплощение идеала мудрого правителя. Благодаря его реформам и указам в [GetCountry('ZAN').Custom('rank_ru_PREP')|l] наступила долгая эпоха процветания. В далёкие земли потянулись многочисленные обозы с нашими товарами, неизменно привозя обратно всевозможные ценности.\n\nЧтобы посодействовать нашим купцам, [target_character2.GetName] приказал ввести в оборот единую монету, поскольку так проще вести торговлю. Однако ничто в этом мире не вечно — даже великие правители. В день памяти о нём нам вновь напомнили, что когда-нибудь предстоит принять решение: начать выпускать новые монеты с его именем и образом, либо продолжать пользоваться старыми."
 form_closer_bond_iroquois_act:0 "Установление тесных связей [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!"
 form_closer_bond_iroquois_effect_text:0 "[SCOPE.sCountry('actor').GetName] устанавлива[SCOPE.sCountry('actor').Custom('end_etyut')] тесные связи [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, что способствует взаимной симпатии и доверию."
 form_closer_bond_iroquois_effect_text_past:0 "[SCOPE.sCountry('actor').GetName] установил[SCOPE.sCountry('actor').Custom('end_fem')] тесные связи [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, что способствует взаимной симпатии и доверию к [SCOPE.sCountry('actor').Custom('CL_DAT')]."
 french_wars_religion.6.desc:0 "В [target_location.Custom('LR_PREP')|l] [target_location.GetName] разразилось массовое восстание, погрузившее столицу в хаос. Возмущённая тем, насколько [target_character.GetName] якобы благоволит еретикам, #L [ROOT.GetCountry.GetAdjective|l]ая#! #L [ROOT.GetCountry.GetReligion.GetAdjective|U]ая#! лига подняла местное население на бунт, во главе которого [Select_CString(target_character2.IsFemale,'встала', 'встал')] [target_character2.GetName]. Масла в огонь подлили слухи о том, что [Select_CString(target_character2.IsFemale,'предводительницу', 'предводителя')] хотят арестовать [ROOT.GetCountry.GetGovernment.GetAdjective]ие агенты. Вооружённое ополчение удивительно быстро соорудило баррикады и парализовало целые районы, препятствуя продвижению гвардейцев.\n\n[target_character.GetShortNameWithNoTooltip] может в любой момент быть [Select_CString(target_character.IsFemale,'вынуждена', 'вынужден')] бежать из столицы, а влияние Лиги в [target_province.Custom('LR_PREP')|l] [target_province.GetName] невероятно высоко. Хрупкий баланс сил грозит в любой момент разрушиться."
 ga_only_leader_may_declare_tt:0 "Только та держава, которая [Concept('international_organization_leader_short', 'возглавляет')|e] [GetInternationalOrganizationType('grand_alliance').GetName|l], может призвать его на войну"
 game_concept_discriminated_culture_desc:0 "Это [Concept('culture', 'культура')|e], которая подвергается активному угнетению со стороны властей [Concept('country', 'державы')|e]. [pops_with_icon|e], принадлежащие к угнетаемой культуре, получают значительный штраф к [Concept('pop_satisfaction_with_icon', 'довольству')|e] ([GetDefine('NPop', 'DISCRIMINATED_CULTURE_SATISFACTION')|%G]), а также не приносят [Concept('political_power', 'политического веса')|e] своей [Concept('country', 'державе')|e] и [Concept('estate', 'сословию')|e]. Представители угнетаемой культуры не могут заседать в [Concept('cabinet', 'совете')|e] или служить в качестве [Concept('generals', 'генералов')|e], [Concept('admirals', 'адмиралов')|e] или [Concept('explorers', 'исследователей')|e]; из их рядов не выходят новые [Concept('characters', 'персонажи')|e]. Предел их [Concept('literacy', 'грамотности')|e] меняется на [GetDefine('NPop','DISCRIMINATED_CULTURE_MAX_LITERACY')|+=2/%].\n\nГруппы населения, принадлежащие к таким культурам, нельзя набирать в [Concept('army_levies', 'армейское')|e] или [Concept('navy_levies', 'флотское ополчение')|e], если не принято соответствующее [Concept('law', 'правило')|e]."
 game_concept_market_access_desc:0 "Доступ к рынку показывает, насколько легко [Concept('location', 'району')|e] взаимодействовать с местным [Concept('market', 'рынком')|e], и зависит от расстояния до [Concept('market_center', 'рыночного центра')|e].\n\nДоступ к рынку влияет на три ключевых аспекта.\n\n$BULLET$Хороший доступ к [Concept('markets', 'рынку')] повышает его [Concept('market_attraction_with_icon', 'привлекательность')|e] для района, поэтому [Concept('locations', 'районы')] обычно примыкают к ближайшему [Concept('market', 'рынку')].\n\n$BULLET$[Concept('locations', 'Районы')] с наилучшим доступом к [Concept('market', 'рынку')] покупают [Concept('goods_with_icon', 'товары')|e] и [Concept('food_with_icon', 'пищу')|e] первыми, районы с наихудшим доступом — последними.\n\n$BULLET$Плохой доступ к рынку приводит к снижению [Concept('output', 'объёма производства')|e] в [Concept('buildings_with_icon', 'сооружениях')|e] и падению доходов от [Concept('rgo_with_icon', 'добычи ресурсов')|e].\n\nДоступ к рынку выше, если до рынка можно добраться по морю или [Concept('rivers', 'реке')|e]. Кроме того, чтобы улучшить этот показатель, можно построить [Concept('roads', 'дороги')|e] и порты, а также создать новый [Concept('market', 'рынок')]."
 game_concept_non_accepted_culture_desc:0 "Любая присутствующая в [Concept('country', 'державе')|e] [Concept('culture', 'культура')|e], по отношению к которой не применяется какая-либо особенная политика (то есть эта культура не является [Concept('primary_culture', 'основной')|e], [Concept('accepted_culture', 'признанной')|e], [Concept('tolerated_culture', 'приемлемой')|e] или [Concept('discriminated_culture', 'угнетаемой')|e]), считается игнорируемой.\n\nИгнорируемые культуры не получают прибавок или штрафов к довольству, но у принадлежащих к ним [Concept('pops', 'групп населения')|e] предел [Concept('literacy', 'грамотности')|e] меняется на [GetDefine('NPop','IGNORED_CULTURE_MAX_LITERACY')|+=2/%], и их нельзя набирать в [Concept('army_levies', 'армейское')|e] или [Concept('navy_levies', 'флотское ополчение')|e], если не принято соответствующее [Concept('law', 'правило')|e]."
 game_concept_treasury_desc:0 "Это количество [Concept('gold', 'золота')|e] у [Concept('country', 'державы')|e]. Если оно становится отрицательным, державе автоматически выдаётся [Concept('loan', 'заём')|e]. Если держава больше не может брать [Concept('loans', 'займы')|e], она становится [Concept('bankrupt', 'банкротом')|e]."
 gc_flashpoints_observer_tt:0 "В ходе этой [Concept('situation', 'ситуации')|e] [gc_hegemon.Custom('predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')] могут случится [Concept('flashpoint', 'переломные моменты')|e] "
 gc_grand_alliance_prospect_tt:0 "Если [gc_hegemon.GetName] начн[gc_hegemon.Custom('end_etut')] угрожать нашим интересам, мы можем вступить в [GetInternationalOrganizationType('grand_alliance').GetName|l] против этой державы. Чем более явно гегемон [Concept('gc_european_dominance', 'доминирует в Европе')|e] и в [Concept('gc_colonial_dominance', 'колониях')|e], тем больше бонусов [Concept('members', 'участники')|e] получают от [Concept('modifier', 'модификаторов')|e] своего [Concept('international_organization', 'международного объединения')|e]"
 gc_hegemon_backer_tt:0 "Мы тесно связаны [gc_hegemon.Custom('predlog_sso')] [ROOT.GetCountry.Custom('CL_INST')], и потому пользуемся благами их триумфа. Однако против этой державы собирается [GetInternationalOrganizationType('grand_alliance').GetName|l], а значит, вскоре мы можем быть втянуты в их войну"
 getrulertitle_ruler_ACC:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_ACC')]"
 getrulertitle_ruler_DAT:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_DAT')]"
 getrulertitle_ruler_GEN:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_GEN')]"
 getrulertitle_ruler_INST:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_INST')]"
 getrulertitle_ruler_PREP:0 "[ROOT.GetCountry.Custom('GetRulerOrRegentTitle_PREP')]"
 give_subject_location_to_other_subject_effect_text:0 "[SCOPE.sCountry('recipient').GetName] переда[SCOPE.sCountry('recipient').Custom('end_etyut')] [SCOPE.sLocation('target_location').Custom('LR_ACC')|l] [SCOPE.sLocation('target_location').GetName] #ONCLICK:COUNTRY,[SCOPE.sCountry('country_that_gets_the_location').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('country_that_gets_the_location').Custom('CL_tt')],X [SCOPE.sCountry('country_that_gets_the_location').Custom('CL_DAT')|L]#!#!."
 golden_century_events.10.desc:0 "Посланцы из #ONCLICK:COUNTRY,[seizing_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[seizing_country.Custom('CL_tt')],X [seizing_country.Custom('CL_GEN')|L]#!#! тайно пробрались в наши гавани с тайным предложением, о котором не следует провозглашать во всеуслышание. Наши далёкие господа [target_overlord.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[target_overlord.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_overlord.Custom('CL_tt')],X [target_overlord.Custom('CL_PREP')|L]#!#! перестали заботиться о нас и больше не желают слышать наших жалоб. [seizing_country.GetNameWithNoTooltip] же готов[seizing_country.Custom('end_fem')] принять нас как своих и подобающе отплатить за верность.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен' )] сделать нелёгкий выбор. Согласиться — значит сменить одного сюзерена на другого и навлечь на себя гнев [target_overlord.Custom('CL_GEN')]; отказаться — значит доказать свою преданность и ещё крепче привязать себя к короне, которой мы и так служим."
 golden_century_events.25.desc.desc_spa:0 "Первые корабли наконец-то вернулись домой, доверху гружёные сахаром, красителями и разными экзотическими товарами, которые вызывают большой интерес среди жителей города [ROOT.GetCapital.GetName]. Каждое судно на причале встречает дюжина купцов, охочих поскорее заключить выгодные торговые договоры. Своими мудрыми решениями [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'привлекла', 'привлёк' )] в [ROOT.GetCountry.Custom('rank_ru_ACC')|l] огромные богатства из далёких земель, которые наши подданные едва ли смогут найти на карте.\n\nВпрочем, это лишь малая доля по сравнению с тем, что мы можем заработать в будущем. Торговцы, знающие толк в перспективных предприятиях лучше любого адмирала, уже предусмотрительно начинают строить новые склады."
 goods_camels.9.desc:0 "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] находится в крайне неудобном положении: во время торжественного приёма при дворе [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'её', 'его' )] любимый верблюд, выведенный в зал ради того, чтобы впечатлить гостей, оказался крайне разборчив в людях и посчитал, что [target_character.GetName|l] из [offended_country.Custom('longname_ru_GEN')] — его личный враг. Без всякого предупреждения животное извергло содержимое своего желудка прямо на [Select_CString(target_character.IsFemale, 'её', 'его' )] церемониальное облачение.\n\n[Select_CString(target_character.IsFemale, 'Пострадавшая', 'Пострадавший' )] кипит от ярости, а [Select_CString(target_character.IsFemale, 'её', 'его' )] свита уже составляет письмо, в котором намеревается заявить протест."
 grand_tour_events.12.desc:0 "[target_location.GetName] стоит на холме за стенами, возведёнными этрусками задолго до возвышения Рима. Жители [target_location.Custom('LR_GEN')|l] и по сей день проходят через древние ворота, не задумываясь об их истории. В последнее время местные живописцы прославились по всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!, а университет по-прежнему собирает полные лекционные залы.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] может посвятить время изучению древних стен или знакомству с новыми картинами сообразно своим интересам."
 grand_tour_events.13.desc:0 "[target_location.GetName] контролирует переправу через реку, у которой сходятся пути из #TOOLTIP:REGION,italy_region,X #L Италии#!#!, с #TOOLTIP:REGION,balkan_region,X #L Балкан#!#! и из #TOOLTIP:LANGUAGE,german_language,X #L германских#!#! земель. Доходы от пошлин принесли [target_location.Custom('LR_DAT')|l] [target_location.GetRank.GetName] немалое богатство. В самом центре возвышается герцогский дворец Хофбург, где располагается двор, претендующего на куда большее, чем положение сугубо регионального игрока.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] наконец пересекает Альпы. Теперь дороги станут ровнее, а путь — легче."
 grand_tour_events.15.desc:0 "[target_location.GetName] получил своё название от монахов, чья обитель находилась здесь ещё до того, как герцоги основали рядом рынок и монетный двор. С тех пор [target_location.GetRank.GetName|l] значительно разросся. Герцогский двор Виттельсбахов поддерживает в [target_location.Custom('LR_PREP')|l] порядок лучше, чем во многих других городах, а местные пивовары исправно снабжают горожан своим напитком.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] найдёт здесь и учёных, и хорошо организованный двор."
 grand_tour_events.19.desc:0 "[target_location.GetRank.GetName] [target_location.GetName] был портом ещё до возникновения Рима. Его основали #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческие#!#! мореплаватели, увидевшие гавань и решившие остаться здесь навсегда. И по сей день в каждом его квартале пахнет солью и дёгтем. У набережных теснится множество галер со всего Средиземноморья, а на рынках продают товары, которые не суждено попасть во внутренние области #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] увидит, что настоящим хозяином [target_location.Custom('LR_GEN')|l] остаётся море."
 grand_tour_events.21.desc:0 "Строительство кафедрального собора в [target_location.Custom('LR_PREP')|l] [target_location.GetName] длится так давно, что никто из ныне живущих не помнит, когда оно началось. Над #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_INST')|l]#!#! возвышается недостроенная башня, на вершине которой всё ещё стоит подъёмный кран, оставленный каменщиками. По Рейну мимо этого [target_location.Custom('LR_GEN')|l] проходит больше торговых судов, чем почти где-либо ещё в #TOOLTIP:LANGUAGE,german_language,X #L немецкоязычных#!#! землях, а архиепископ обладает властью, сопоставимой с властью любого князя.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает в город, где терпение измеряют столетиями."
 grand_tour_events.4.desc:0 "[target_location.GetName] существует одновременно в двух эпохах. Под открытым небом, среди зимней травы располагается Форум: его колонны стоят под причудливыми углами посреди пастбищ, а мрамор отсюда веками вывозили строители, которым требовался камень. Над руинами высится церковь, которой суждено стать престолом всего христианского мира. Она возвышается над самым сердцем современного #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#!.\n\n[target_leader.GetName] может провести время среди руин или среди живых. Папский двор хранит вековые традиции, отличается строгим церемониалом и поддерживает связи со всеми #TOOLTIP:RELIGION,$catholic_tt$,X #L католическими#!#! державами #TOOLTIP:CONTINENT,europe,X #L Европы#!#!."
 grand_tour_events.8.desc:0 "В [target_location.Custom('LR_PREP')|l] [target_location.GetName] право и искусство ведения спора преподают дольше, чем где-либо ещё в христианском мире. [target_location.GetRank.GetName] открыто демонстрирует свою учёность: его портики заполнены студентами из разных стран, а лекционные залы старше большинства окружающих их церквей. [ROOT.GetCountry.GetGovernment.GetHeirTitle] может прожить здесь всю жизнь и всё равно не прочесть всех трудов, созданных выдающимися правоведами.\n\nЕсть здесь и двор, заслуживающий внимания, если политика интересует нас больше, чем юриспруденция."
 greek_culture_prevent_coup_for_two_year:0 "Если [target_character.GetName] [Select_CString(target_character.IsFemale, 'задумывала', 'задумывал' )] переворот, [target_character.GetHerHis] планы будут отложены на #y 2#! года"
 heir_selection_this_not_equal:0 "[Concept('heir_selection', 'Правило престолонаследия')|e] — любое, кроме «[TARGET_HEIR_SELECTION.GetName]»"
 hellenism_religion.33.desc:0 "К нашему двору прибывает [Select_CString(target_character.IsFemale, 'учёная дама', 'учёный муж' )] в сане епископа — не с мечом и не с претензиями, но с вопросами. [target_character.GetName] [Select_CString(target_character.IsFemale, 'посвятила', 'посвятил' )] свою жизнь изучению платоновской философии, и [Select_CString(target_character.IsFemale, 'она', 'он' )] с тихой убеждённостью утверждает, что христианский Бог и философское понятие первоосновы есть одно и то же. Святая Троица, считает [Select_CString(target_character.IsFemale, 'она', 'он' )], это просто союз Единого, Бытия и Души, облачённые в другие названия.\n\nЭта точка зрения имеет под собой силу, и [target_character.GetName] аргументирует её со спокойной уверенностью человека, который уже слышал все возможные контраргументы раньше. Согласимся мы с такой трактовкой или отвергнем её, на этот спор обратят внимание и [ROOT.GetCountry.GetCapital.GetName], и другие города нашей державы."
 hint_battle_hint_text_1:0 "Когда [Concept('army_with_icon', 'армии')|e] воюющих сторон оказываются в одном [Concept('location_with_icon', 'районе')|e], между ними начинается [Concept('battle_with_icon', 'битва')|e]. [Concept('army', 'Армия')], пришедшая в такой [Concept('location', 'район')] первой, считается [Concept('defender_with_icon', 'обороняющейся')|e] и получает преимущества местности. Битва завершается, когда одна из сторон полностью утрачивает [Concept('morale_with_icon', 'боевой дух')|e] или теряет все свои [Concept('regiments_with_icon', 'полки')|e] — в зависимости от того, что случится раньше."
 hint_low_republican_tradition_hint_text_2:0 "#T Рекомендации#!\n@arrow_bonus_tier_3! Поддерживайте как можно более высокий уровень [Concept('republican_tradition_with_icon', 'республиканских традиций')|e], чтобы избегать существенных штрафов.\n@arrow_bonus_tier_2! Для поддержания этого показателя можно увеличить затраты на [Concept('court_maintenance', 'содержание двора')|e].\n@arrow_bonus_tier_2! Есть и другие способы сохранить [Concept('republican_tradition_with_icon', 'республиканские традиции')|e] — например, определённые [Concept('advances_with_icon', 'улучшения')|e] или [Concept('policies_with_icon', 'политики')|e].\n@arrow_bonus_tier_1! Ещё один способ поддержать [Concept('republican_tradition_with_icon', 'республиканские традиции')|e] на высоком уровне — сменить [Concept('ruler_with_icon', 'правителя')|e] на [Concept('election_with_icon', 'выборах')|e]."
 hint_red_turban_rebellions_hint_text_2:0 "#T Рекомендации#!\n@arrow_bonus_tier_3! #ONCLICK:COUNTRY,[GetCountry('CHI').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CHI').Custom('CL_tt')],X [GetCountry('CHI').Custom('CL_DAT')|L]#!#! необходимо силой #TOOLTIP:SCRIPTED_PEACE_TREATY,rtr_rein_in_rebellion,X #L усмирить восстание#!#! и подавить тех, кто стремится вырваться из-под власти державы.\n@arrow_bonus_tier_2! #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,red_turban_rebels,X #L «Красные повязки»#!#! могут потребовать от [GetCountry('CHI').Custom('CL_GEN')] #TOOLTIP:SCRIPTED_PEACE_TREATY,rtr_demand_occupied_territories,X #L передать оккупированные территории#!#!.\n@arrow_bonus_tier_1! [GetCountry('CHI').GetLongName] столкн[GetCountry('CHI').Custom('endlong_etut')]ся со множеством уникальных [Concept('events_with_icon', 'событий')|e], а земли державы заинтересуют амбициозных завоевателей."
 hint_red_turban_rebellions_hint_text_3:0 "#T Дополнительные советы#!\n@hint! Нам доступно множество уникальных [Concept('actions_with_icon', 'действий')|e] на панели [Concept('situation_with_icon', 'ситуации')|e], которые позволяют [Concept('integrate_with_icon', 'интегрировать')|e] завоёванные земли и сохранять высокий [Concept('control_with_icon', 'контроль')|e].\n@hint! Если мы одержим верх в ситуации и сумеем основать [GetFormableCountry('CHI').GetName], то автоматически получим [Concept('cores', 'национальные районы')|e] по всему Китаю."
 hre.102.desc:0 "$hre.privilege_revoked.intro_desc$ Рейхстаг согласился с предложением соединить разрозненные владения империи в единое национальное государство, а [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] будет [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'коронована', 'коронован')] его [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'наследной правительницей', 'наследным правителем')]."
 hre.103.desc:0 "Рейхстаг одобрил реформу, согласно которой наша держава прекращает своё существование, а её владения переходят в руки [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!. Нам остаётся лишь утешать себя тем, что мы стали частью чего-то большего."
 hre.104.desc:0 "$hre.privilege_revoked.intro_desc$ Рейхстаг согласился ограничить автономию #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольных городов#!#! и укрепить власть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')] в пределах #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!."
 hre.106.desc:0 "$hre.privilege_revoked.intro_desc$ Рейхстаг согласился ещё сильнее ограничить автономию #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольных городов#!#!, укрепив власть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')] в пределах Священной Римской Империи."
 hre.107.a:0 "Наш город служит [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрице', 'императору')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!!"
 hre.7.desc:0 "Начиная с сегодняшнего дня имперский рейхстаг будет постоянно заседать в [diet_location.Custom('LR_PREP')|l] [diet_location.GetName], а не созываться по особым случаям, как прежде. Этот шаг несомненно повысит сплочённость империи и поможет узаконить отношения между [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицей', 'императором')] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! и князьями. С другой стороны, такое решение сделает [diet_location.Custom('LR_ACC')|l] [diet_location.GetName] первостепенной целью для желающих причинить вред империи…"
 hre.801.title:0 "Смерть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')]"
 hre.900.desc:0 "Да здравствует [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрица', 'император')]! Выборщики решили всё же довериться нам, императорская корона сохраняется за #ONCLICK:COUNTRY,[GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_tt')],X [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_INST')|L]#!#!. Императорская власть растёт по мере того, как наша держава увеличивает своё влияние в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, а князья начинают видеть в нас прирождённых правителей."
 hre.900.title:0 "Смерть [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'императрицы', 'императора')]"
 hre.902.desc_catholic:0 "[heretic_country.GetName], где прежде господствовала наша религия, всё-таки уступа[heretic_country.Custom('end_etyut')] давлению #TOOLTIP:LOCATION,rome,X #L Рима#!#!. [heretic_country.GetGovernment.GetCourtTitle] [heretic_country.Custom('CL_GEN')] оправдывает такое решение принципом #italic «Чья страна, того и вера»#!, но страшно предположить, что теперь ждёт последователей истинной веры [heretic_country.Custom('predlog_vvo')] [heretic_country.Custom('CL_PREP')]."
 hre.902.desc_hussite:0 "Да будет [Select_CString(GetCharacter('boh_jan_hus').IsFemale, 'проклята эта', 'проклят этот' )] [GetCharacter('boh_jan_hus').GetName]! [heretic_country.GetName] заража[heretic_country.Custom('end_etyut')]ся [Select_CString(GetCharacter('boh_jan_hus').IsFemale, 'её', 'его' )] идеями. Такое предательство подрывает наши позиции в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, а последователи истинной веры [heretic_country.Custom('predlog_vvo')] [heretic_country.Custom('CL_PREP')] становятся заложниками радикальных идей."
 hre.902.title_catholic:0 "Католицизм возвращается [heretic_country.Custom('predlog_vvo')] [heretic_country.Custom('CL_ACC')]"
 hre.909.a:0 "[Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'Бесчестная', 'Бесчестный')]? Скорее, [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'благоразумная', 'благоразумный')]!"
 hre.909.desc:0 "[Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'Императрица', 'Император')] не [Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'смогла', 'смог')] защитить #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_ACC')|L]#!#! от иностранных захватчиков!"
 hre.909.title:0 "[Select_CString(GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRuler.IsFemale,'Бесчестная императрица', 'Бесчестный император')]"
 hussite_wars.4.c.desc:0 "Господь благословил нас на победу в крестовом походе против еретиков. Мы погасили пламя #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#! в [GetCountry('BOH').Custom('longname_ru_PREP')], восстановив законную власть #TOOLTIP:RELIGION,$catholic_tt$,X #L католичества#!#!. Пусть весь мир видит, что воля церкви непоколебима."
 hussite_wars.4.e.desc:0 "Тень поражения повисла над нашим гуситским движением. Несмотря на совместную борьбу с нашими братьями в [GetCountry('BOH').Custom('longname_ru_PREP')], силы #TOOLTIP:RELIGION,$catholic_tt$,X #L католичества#!#! взяли верх, вернув старые порядки. Наша вера выстоит, потому что идеи, за которые мы сражались, не так-то просто подавить."
 iberian_wedding_pact_effect_text:0 "[SCOPE.sCountry('actor').GetName] заключа[SCOPE.sCountry('actor').Custom('end_etyut')] иберийский брачный союз [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, тем самым скрепляя престолонаследие двух держав."
 iberian_wedding_pact_effect_text_past:0 "[SCOPE.sCountry('actor').GetName] заключил[SCOPE.sCountry('actor').Custom('end_fem')] иберийский брачный союз [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, тем самым скрепив престолонаследие двух держав."
 imperial_authority_desc:0 "Это показатель власти, которой пользуется [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! для принятия имперских законов.\n\nВысокий показатель имперской власти даёт следующие преимущества:\n$BULLET$ Увеличивает #TOOLTIP:PAYMENT,imperial_treasury_contribution,X #L вклад в казну#!#! и #TOOLTIP:PAYMENT,imperial_army_contribution,X #L армию#!#! со стороны [Concept('members', 'участников')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!.\n$BULLET$ [Concept('members', 'Участники')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! с большей вероятностью голосуют за [Concept('policies', 'политики')|e], которые [Concept('hre_emperor', 'император')|e] предлагает членам [GetUniqueInternationalOrganization('hre').Custom('parliament_io_ru_GEN')|l]."
 improve_opinion_with_all_catholics_tt:0 "Мы улучшим [Concept('opinion', 'мнение')|e] всех #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! [Concept('country', 'держав')|e] о нас на [ShowBiasValue('opinion_bosnian_church_diplomacy')|+=0]"
 incorruptible_die_desc:0 "[Select_CString(CHARACTER.IsFemale,'Она боролась', 'Он боролся')] с несправедливостью и [Select_CString(CHARACTER.IsFemale,'сделала','сделал')] всё, чтобы уменьшить неравенство."
 increase_control_province_action:0 "Усилить контроль в провинции [SCOPE.sProvince('selected_province').GetName] (сейчас [SCOPE.sProvince('selected_province').GetAverageControl|%])"
 inherit_in_case_of_no_heir_tt:0 "Мы немедленно получим власть над #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_INST')|L]#!#!, если [Concept('ruler', 'правитель')|e] этой державы умрёт, не оставив [Concept('heir', 'наследника')|e] из нашей [Concept('dynasty', 'династии')|e]"
 inheritance_contract_effect_text:0 "[COUNTRY.GetName] заключа[COUNTRY.Custom('end_etyut')] [Concept('inheritance_contract', 'договор о наследовании')|e] [TARGET_COUNTRY.Custom('predlog_sso')] #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_INST')|L]#!#!."
 inheritance_contract_effect_text_past:0 "[COUNTRY.GetName] заключил[COUNTRY.Custom('end_fem')] [Concept('inheritance_contract', 'договор о наследовании')|e] [TARGET_COUNTRY.Custom('predlog_sso')] #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_INST')|L]#!#!."
 institution_events.10.desc.dharmic:0 "$institution_events.10.desc.start$ [legalism_country.GetAdjectiveWithNoTooltip]ая концепция #TOOLTIP:RELIGIONGROUP,dharmic,X #L дхармы#!#! нашла особенно большой отклик среди жителей [ROOT.GetCountry.Custom('rank_ru_GEN')|l], которые не могли не заметить сходство традиций [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой и #TOOLTIP:RELIGIONGROUP,dharmic,X #L дхармической#!#! религии.\n\n$institution_events.10.desc.end$"
