 movement_factor_friendly_with_pope:0 "Хорошие отношения [GetCountry('PAP').Custom('predlog_sso')] #ONCLICK:COUNTRY,[GetCountry('PAP').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PAP').Custom('CL_tt')],X [GetCountry('PAP').Custom('CL_INST')|L]#!#!"
 mug_location_pops_gain_unrest_tt:0 "Все [Concept('pops', 'группы населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 nanbokuchou.3.desc:0 "Уже какое-то время в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X $tt_op_L$Японском сёгунате$tt_cl_2$ конфликт — враждуют дворы [target_supported_court.GetLongName] и [target_enemy_court.GetLongName]. [target_shogun.GetGovernment.GetRulerOrRegent.GetName] и [GetCountry('NTC').GetGovernment.GetRulerOrRegent.GetName] продолжают противостоять [Select_CString(GetCountry('STC').GetGovernment.GetRulerOrRegent.IsFemale,'правительнице', 'правителю')] — это [GetCountry('STC').GetGovernment.GetRulerOrRegent.GetName], [Select_CString(GetCountry('STC').GetGovernment.GetRulerOrRegent.IsFemale,'мечтающая', 'мечтающий')] занять трон. [target_supported_court.GetLongNameWithNoTooltip] — до сих пор мы поддерживали их сторону, но ветер перемен начинает набирать силу.\n\nУстав от напряжённой борьбы, обе стороны, кажется, забыли, что за поддержку надо платить, и это вызвало недовольство среди их приверженцев в [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. Посланники [target_enemy_court.Custom('longname_ru_GEN')] утверждают, что [target_enemy_emperor.GetNameWithNoTooltip] не поскупится на награды, если мы присягнём [Select_CString(target_enemy_emperor.IsFemale,'ей', 'ему')] на верность."
 nanbokuchou.4.desc:0 "[target_betrayer.GetLongName] — подлые крысы, лишённые чести. В разгар нашего противостояния [target_enemy_court.Custom('predlog_sso')] [target_enemy_court.Custom('longname_ru_INST')] они нарушили свою клятву и перебежали на сторону врага, соблазнённые лживыми обещаниями. Очевидно, они считают, что [target_enemy_emperor.GetName] сокрушит нас. Пришло время доказать им обратное на поле боя."
 nanbokuchou.9.desc:0 "Противостояние двух соперничающих императорских дворов продолжается уже несколько лет. Эта борьба грозит расколоть страну надвое, а конца конфликту всё не видно. Многие в [ROOT.GetCountry.Custom('longname_ru_PREP')] считают, что ради сохранения единства трона нам следует отказаться от своих притязаний в пользу [target_emperor.Custom('longname_ru_GEN')]. Конечно, божественное право на власть — не то, чем можно просто взять и поступиться, однако будущее страны вызывает серьёзные опасения, и разделённая династия может обернуться для нас ещё более суровыми испытаниями."
 navarre_gains_castile_basque_lands_tt:0 "Все владения #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! в оспариваемом баскском пограничье с высокой вероятностью перейдут под власть #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, если только [GetCountry('CAS').GetNameWithNoTooltip] не пойд[GetCountry('CAS').Custom('end_etut')] на крайние меры ради сохранения контроля над этими землями."
 negotiate_succession_law_act:0 "Переговоры [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#! о принятии нашего [Concept('heir_selection', 'правила престолонаследия')|e] и правила «[SCOPE.sCountry('actor').GetGovernment.GetImplementedPolicyForLawFromKey('heir_religion_law').GetName]»"
 no_attacker_union_with_recipient_tt:0 "В [Concept('union', 'унии')|e] [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#! нет атакующей стороны"
 no_defender_union_with_recipient_tt:0 "В [Concept('union', 'унии')|e] [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#! нет обороняющейся стороны"
 no_valid_religious_faction:0 "@trigger_no! Мы можем присоединиться к #TOOLTIP:INTERNATIONAL_ORGANIZATION,$protestant_union.tt$,X #L Евангелической унии#!#! или #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_league.tt$,X #L Католической лиге#!#! только если являемся частью #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, и нас не ограничивает перерыв."
 none_impacted_by_foreign_destabilization_efforts_modifier_tt:0 "На каждого [Concept('rival', 'соперника')|e], затронутого действием #TOOLTIP:SCRIPTED_RELATION_TYPE,sow_discontent,X #L «Распространение недовольства»#!#!, в рамках [Concept('event', 'события')|e] будет влиять [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,foreign_destabilization_efforts_modifier,X #V #L «Попытки дестабилизации из-за границы»#!#!"
 offer_curb_pronoia_military_action_cta:0 "Запретите любую военную активность [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_PREP')|L]#!#!"
 offer_deny_market_access_cta_to_unknown:0 "Откажите [Concept('country', 'державе')|e] в доступе к рынку"
 offer_iberian_wedding_pact_happened_desc:0 "Теперь мы связаны [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#! посредством иберийского брачного союза. Если один из правителей двух держав умрёт, не оставив наследников, то другой унаследует оба престола и тем самым образует [Concept('union', 'унию')|e]."
 offer_strengthen_family_ties_happened_desc:0 "[SCOPE.sCountry('actor').GetName] укрепля[SCOPE.sCountry('actor').Custom('end_etyut')] семейные связи [SCOPE.sCountry('recipient').Custom('predlog_sso')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, тем самым повышая [Concept('subject_loyalty', 'лояльность ленника')|e]."
 offer_support_loyalists_cta:0 "Поддержите лоялистов #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_GEN')|L]#!#!"
 ori_double_elephant_hunting_ground_level_tt:0 "Максимальный уровень [Concept('building', 'сооружений')|e] типа #TOOLTIP:BUILDING_TYPE,elephant_hunting_grounds,X #L «места охоты на слонов»#!#! повысится на #G 2#!."
 papal_conclave_events.6.tt:0 "Каждая [Concept('pop', 'группа населения')|e] получит [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]. [Concept('pops', 'Группы населения')|U] в [Concept('capital', 'столице')|e] ещё получат дополнительные [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 parliaments.24.desc:0 "Похоже, финансовые проблемы нашего правительства и его отчаянные попытки найти средства стали достоянием общественности. Несмотря на потерю репутации [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! и за границей, это принесло нам определённую выгоду, поскольку несколько членов [ROOT.GetCountry.Custom('parliament_ru_GEN')|l], представляющих [target_location.Custom('LR_ACC')|l] [target_location.GetName], обратились к нам с предложением о помощи. Взамен они просят предоставить им возможность более активно участвовать в управлении страной, а также создать официальные механизмы, которые позволят государству обращаться к ним за помощью в будущем."
 parliaments.42.desc:0 "К членам [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] обратились жители двух городов. Спор о том, какой из них получит широкие торговые привилегии [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, грозит затянуться и перерасти в скандал. У нас два варианта: либо предоставить одному из городов исключительные права, либо открыть рынок и позволить конкуренции сделать то, что так редко удаётся парламенту, — решить проблему окончательно."
 parliaments.47.desc:0 "С тех пор, как книгопечатание получило широкое распространение [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] жалуются на брошюры, которые распространяют [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]. На заседании [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] обе стороны подкрепили свою правоту серьёзными аргументами. Одна называет свою деятельность просвещением, а другая — подстрекательством к мятежу. Чьё мнение нам ближе?"
 parliaments.50.b:0 "Власть [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! принадлежит короне."
 parliaments.51.desc:0 "На заседании [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] зачитали доклад, который вызвал большую тревогу. Кое-где [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! законы фактически перестали работать. Чиновники либо некомпетентны, либо их не хватает, либо их вовсе нет. Громче всех жалуются [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], что обычно указывает на то, что проблема действительно существует. Нужно срочно исправлять ситуацию."
 personality_events.12.b:0 "Кровь и плоть [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'нашей повелительницы', 'нашего повелителя')] заслуживает доверия."
 personality_events.23.d:0 "[target_heir.GetNameWithNoTooltip] и без того [Select_CString(target_heir.IsFemale,'готова', 'готов')] к правлению!"
 petition_imperial_diet_effect_text:0 "[SCOPE.sCountry('actor').GetName] пода[SCOPE.sCountry('actor').Custom('end_etyut')] прошение рейхстагу."
 pilgrimage_expedition_events.3.c:0 "Знаменательный день. Но нам пора возвращаться в [ROOT.GetCountry.Custom('rank_ru_ACC')|l]."
 pining_expedition_events.5.desc:0 "The squadron has reached [target_location.GetName], the [norse_greenland.Custom('GetRulerOrRegentTitle')]'s seat and effective capital of the [norse_greenland.GetCulture.GetName] colony in [ShowAreaName('greenland_area')]. The settlement is much reduced from what the old sagas describe, but it is still there: a cathedral with its lead roof intact, a few dozen turf longhouses, sheep on the hillsides, fishing boats drawn up on the gravel beach. The [norse_greenland.Custom('GetRulerOrRegentTitle')] and the lawspeaker receive our captains with the gravity of men who have not seen a ship from [ShowSubContinentName('europe')] in some years. They are eager for news, eager for trade goods, and not unwilling to share what they know about the western waters."
 pining_expedition_events.5.title:0 "The [norse_greenland.GetCulture.GetNameWithNoTooltip] People"
 pirate_events.2.desc:0 "Корабль [Select_CString(target_character.IsFemale, 'знаменитой пиратки', 'знаменитого пирата')] [target_culture.GetName] и [Select_CString(target_character.IsFemale, 'её', 'его')] банды кровожадных головорезов вошёл в порт [target_location.Custom('LR_GEN')|l] [target_location.GetName], и капитан требует, чтобы [target_character_2.GetName] [Select_CString(target_character_2.IsFemale, 'предоставила', 'предоставил')] [Select_CString(target_character.IsFemale, 'ей', 'ему')] аудиенцию. [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'известна', 'известен')] своей жестокостью — только за этот год [Select_CString(target_character.IsFemale, 'она потопила', 'он потопил')] десятки вражеских кораблей и [Select_CString(target_character.IsFemale, 'заполучила', 'заполучил')] немало рискованных трофеев. Говорят, на Тайване [target_character.GetSheHe] вырезала целую деревню местных, чтобы их кровью заделать щели в корпусе корабля.\n\nКапитан заявляет, что [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл')] в [target_location.Custom('LR_ACC')|l] с целью предложить свои услуги, в обмен на которые [ROOT.GetCountry.GetFlavorRank|l] предоставит [Select_CString(target_character.IsFemale, 'ей', 'ему')] убежище от [target_culture.GetNameWithNoTooltip]их властей. Однако, если учесть [Select_CString(target_character.IsFemale, 'её', 'его')] репутацию и величину [Select_CString(target_character.IsFemale, 'её', 'его')] флотилии, вполне вероятно, что [Select_CString(target_character.IsFemale, 'её', 'его')] истинные амбиции в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] куда больше, чем [target_character.GetSheHe] заявляет."
 pradhana_maha_samanta_tt:0 "[ShowSubjectTypeName('maha_samanta')] нашей державы на протяжении хотя бы #Y 15#! лет"
 prominent_die_desc:0 "[Select_CString(CHARACTER.IsFemale,'Она облагодетельствовала','Он облагодетельствовал')] нашу нацию, и память о [Select_CString(CHARACTER.IsFemale,'ней', 'нём')] останется в веках."
 rank_county_abbey_ACC:0 "$rank_duchy_abbey_ACC$"
 rank_county_abbey_DAT:0 "$rank_duchy_abbey_DAT$"
 rank_county_abbey_GEN:0 "$rank_duchy_abbey_GEN$"
 rank_county_abbey_INST:0 "$rank_duchy_abbey_INST$"
 rank_county_abbey_PREP:0 "$rank_duchy_abbey_PREP$"
 red_turban_rebellions.19.b.tt:0 "Сейчас наша #Y преданность Юаню#! равна #Y нулю#!. Мы пока не полностью поддерживаем #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,red_turban_rebels,X #L «Красных повязок»#!#!, хотя и продолжаем вести войну [from_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_INST')|L]#!#!. Если наша преданность Юаню #G превысит 50 ед.#!, мы станем #G лоялистами#! державы #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! и откажемся от участия в движении #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,red_turban_rebels,X #L «Красных повязок»#!#!. Если же преданность снова упадёт #R ниже нуля#!, мы будем вынуждены вернуться к открытому мятежу."
 regencies.7.b:0 "[Select_CString(ROOT.GetCountry.GetGovernment.GetHeir.IsFemale,'Она', 'Он')] не [Select_CString(ROOT.GetCountry.GetGovernment.GetHeir.IsFemale,'первая никчёмная наследница', 'первый никчёмный наследник')]."
 repair_or_damage_relations_with_aragon_tt:0 "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country.Custom('predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! до #G +190#!, это позволит сгладить конфликт с [target_country.GetAdjectiveWithNoTooltip|l]им двором. В противном случае нам стоит готовиться к окончательному разрыву [target_country.Custom('predlog_sso')] [target_country.Custom('CL_INST')]."
 request_inheritance_contract_happened_desc:0 "[COUNTRY.GetName] заключил[COUNTRY.Custom('end_fem')] [TARGET_COUNTRY.Custom('predlog_sso')] #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_INST')|L]#!#! [Concept('inheritance_contract', 'договор о наследовании')|e], позволяющий унаследовать территории этой державы, если её правитель умрёт, не оставив наследника."
 rise_of_the_ottomans.102.desc:0 "[target_country2.GetGovernment.GetFullRulerName] [Select_CString(target_country2.GetGovernment.GetRuler.IsFemale, 'отправила', 'отправил')] к нам посла. Тот требует, чтобы наша держава беспрекословно покорилась #L [target_country2.GetAdjective|l]ой#! власти, присоединившись к их [target_country2.Custom('rank_ru_DAT')|l] в качестве #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассала#!#!."
 roman_history_desc:0 "$roman_history$ — это хроника в 37 томах, которая описывает события [GetCountry('BYZ').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_PREP')|L]#!#! с начала XIII века до первой половины XIV века."
 rot_plan_invasion_no_countries:0 "@trigger_no! Рядом нет [Concept('countries', 'стран')|e], которые не в [Concept('allies', 'союзе')|e] или не в состоянии [Concept('truce', 'перемирия')|e] [actor.Custom('predlog_sso')] #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_INST')|L]#!#!."
 sc_ask_help_from_the_nobility_desc:0 "[SCOPE.sCountry('actor').GetGovernment.GetEstateName('nobles_estate')] в [actor.Custom('rank_ru_PREP')|l] концентрируют в своих руках больше влияния. Заручившись помощью такой элиты, мы непременно одолеем любых конкурентов в борьбе за власть."
 sc_seek_foreign_aid_desc:0 "Ситуация с ростом количества претендентов в [actor.Custom('rank_ru_PREP')|l] выходит из-под контроля. Те, кто желает прибрать к рукам наш трон, не оставят попыток, пока мы не разделаемся с ними раз и навсегда. Чтобы гарантировать себе территориальный суверенитет и сохранить власть, надо смотреть за пределы наших земель, искать друзей и помощь за границей."
 scout_enemy_holdings_effect_text:0 "[SCOPE.sCountry('actor').GetName] провод[SCOPE.sCountry('actor').Custom('end_ityat')] разведку [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_PREP')|L]#!#!."
 scout_enemy_holdings_effect_text_past:0 "[SCOPE.sCountry('actor').GetName] завершил[SCOPE.sCountry('actor').Custom('end_fem')] разведку [SCOPE.sCountry('recipient').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_PREP')|L]#!#!."
 select_omen_god_is_active_tt:0 "[target.Custom('predlog_vvo')|U] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_PREP')|L]#!#! уже есть другое [Concept('omen', 'знамение')|e]."
 selected_bureaucracy_entrenchment_extreme_bonus_tt:0 "[Concept('entrenchment', 'Укоренённость')|e] выбранного [Concept('bureaucracy', 'бюрократического механизма')|e] уменьшится на [ShowNamedValue('entrenchment_extreme_bonus')|+]"
 sell_work_of_art_effect_text:0 "[SCOPE.sWorkOfArt('target').GetName] — [SCOPE.sCountry('actor').GetName] прода[SCOPE.sCountry('actor').Custom('end_etyut')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_DAT')|L]#!#! это творение."
 sell_work_of_art_reject_effect_text:0 "[SCOPE.sWorkOfArt('target').GetName] — [SCOPE.sCountry('recipient').GetName] отказыва[SCOPE.sCountry('recipient').Custom('end_etyut')]ся покупать это творение."
 sie_triumphant_return_means_possibility_of_coup:0 "Вернувшись [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! и став [Select_CString(target_character.IsFemale, 'правительницей', 'правителем' )], [target_character.GetName] постарается сосредоточить власть в своих руках."
 steppe_horde.19.desc:0 "$steppe_horde_small_armies_common_desc$ многие вожди племён и старейшины открыто сомневаются в том, что [target_ruler.GetName] может вести нас. [ROOT.GetCountry.GetGovernment.GetRulerTitle] [target_ruler.GetName]? Да над нами будут насмехаться! По их мнению, [target_heir.GetName] гораздо лучше справится с этой ролью."
 strengthen_government_action_progress_tooltip:0 "Каждый месяц даёт [SCOPE.sCabinet('cabinet').GetGovernmentPowerMonthlyModifier|+=2] к показателю @[SCOPE.sCountry('actor').GetGovernmentPowerKey]! «[SCOPE.sCountry('actor').GetGovernmentPowerConcept]», в результате чего его общее изменение составляет [SCOPE.sCountry('actor').GetCurrencyBalance('government_power')|+=2].\nТакими темпами показатель достигнет максимума через #W [SCOPE.sCountry('actor').GetCurrencyMonthsToMax('government_power')]#! мес."
 strigolniki_pops_tt:0 "Все #TOOLTIP:RELIGION,$strigolniki_tt$,X #L стригольнические#!#! [Concept('pops', 'группы населения')|e] получат [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 strongest_beylik_has_over_75_locations:0 "#ONCLICK:COUNTRY,[GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.Custom('CL_tt')],X [GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.Custom('CL_DAT')|L]#!#! принадлежит хотя бы 500 [Concept('locations', 'районов')|e] (сейчас: [GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.GetOwnedLocationCount]) и 50 [Concept('towns_or_cities', 'городов')|e] (сейчас: [GetSituationByKey('rise_of_the_ottomans').MakeScope.GetVariable('strongest_beylik_variable').GetCountry.GetTownsAndCities])"
 subject_interaction_events.4.a:0 "[better_ruler.GetNameWithNoTooltip] будет более [Select_CString(better_ruler.IsFemale, 'подходящей правительницей', 'подходящим правителем')]"
 succession.5.desc.new_ruler_son:0 "[new_ruler_son.GetName], [Select_CString(new_ruler_son.IsFemale, 'которой', 'которому' )] [old_ruler.GetName] приходится [Select_CString(old_ruler.IsFemale, 'матерью', 'отцом' )], наконец [Select_CString(new_ruler_son.IsFemale, 'достигла', 'достиг' )] зрелости и [Select_CString(new_ruler_son.IsFemale, 'получила', 'получил' )] право взойти на трон #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [Select_CString(new_ruler_son.IsFemale, 'Она начала', 'Он начал' )] своё правление с расправы над соперниками и консолидации власти в городе [ROOT.GetCountry.GetCapital.GetName]."
 succession_crisis.6.desc:0 "У [ROOT.GetCountry.Custom('longname_ru_GEN')] тяжёлые времена: #TOOLTIP:DISASTER_TYPE,succession_crisis,X #L кризис престолонаследия#!#! угрожает расколоть [ROOT.GetCountry.Custom('rank_ru_ACC')|l] на части. Претенденты набирают силу, готовясь нанести удар в самое сердце страны. [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName] в опасности. Падение [ROOT.GetCountry.Custom('rank_ru_GEN')|l] приведёт к тому, что [target_character1.GetName] и [Select_CString(target_character_1.IsFemale,'её', 'его')] [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] погибнут. Отчаянно нуждаясь в союзниках, мы обратились за помощью к #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_DAT')|L]#!#!."
 succession_crisis.9.desc:0 "Набирающее силу движение «[succession_crisis_pretender_scope.GetName]» поставило [ROOT.GetCountry.Custom('rank_ru_ACC')|l] на край гибели. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U], которые раньше были надёжной опорой нашей власти, теперь вынуждены оглядываться на повстанцев. Впрочем, многие из них понимают, что обязаны своими землями и привилегиями исключительно [ROOT.GetCountry.GetGovernment.GetAdjective]ой династии. Вместе со своей личной свитой и верными отрядами они готовы выступить на нашей стороне против узурпаторов, ожидая, что в благодарность мы дадим им больше рычагов влияния на государственную политику."
 timur_could_form_mughals_or_mongol_empire_tt:0 "[GetCountry('TIM').GetName] мо[GetCountry('TIM').Custom('end_gegu')] стать [GetFormableCountry('MGE').GetName] или [GetFormableCountry('MUG').GetName]"
 toulouse.aragonese_dialect:0 "$toulouse.occitan_language$"
 transfer_occupation_effect_text:0 "[SCOPE.sCountry('actor').GetName] переда[SCOPE.sCountry('actor').Custom('end_etyut')] оккупационный контроль над [SCOPE.sLocation('target').Custom('LR_INST')|l] [SCOPE.sLocation('target').GetName] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_DAT')|L]#!#!."
 transfer_subject_effect_text:0 "[SCOPE.sCountry('actor').GetName] переда[SCOPE.sCountry('actor').Custom('end_etyut')] #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_ACC')|L]#!#! #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_DAT')|L]#!#!."
 treasure_fleet_events.37.desc:0 "Местные [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] решили обмануть моряков золотого флота и открыли новые рынки рядом с гаванью района $expedition_location_name$. На этих рынках они продают товары втридорога, а наиболее жадные купцы вообще подняли цены до небес. Морякам деваться некуда — всё равно ведь купят! Из-за этого на улицах начались вооружённые стычки, которые привели к беспорядкам. [fleet_loc.GetRank.GetName] погружается в хаос."
 treaty_of_tordesillas.1.desc:0 "Нашу экспансию в [target_location.Custom('LR_ACC')|l] [target_location.GetName] заметил[other_country_scope.Custom('endlong_fem')] [other_country_scope.GetLongName]. Эта держава тоже расширяет свои владения [other_country_colony_scope.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[other_country_colony_scope.Custom('CL_tt')] #TOOLTIP:COUNTRY,[other_country_colony_scope.Custom('CL_tt')],X [other_country_colony_scope.Custom('CL_PREP')|L]#!#! и $treaty_of_tordesillas.1.common_phrase$ Чтобы избежать противостояния, стоит организовать дипломатическую встречу, где государственные деятели обеих стран смогут разделить новые земли по справедливости и к взаимному удовлетворению."
 treaty_of_tordesillas.3.desc_common:0 "После продолжительных обсуждений в #L #TOOLTIP:LOCATIONRANK,[chosen_location_scope.Custom('LR_tt')],X [chosen_location_scope.Custom('LR_PREP')|l]#!#! [chosen_location_scope.GetName] [first_country_scope.GetLongName] и [other_country_scope.GetLongName] подписали договор, разделив между собой все недавно открытые земли на #TOOLTIP:CONTINENT,america,X #L американском#!#! континенте.\n\nСоглашение, вошедшее в историю как #TOOLTIP:SITUATION,treaty_of_tordesillas,X #L Договор [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_PREP')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]#!#!, регулирует их притязания на огромные территории на новом континенте"
 treaty_of_tordesillas.3.desc_one_signatory_common:0 "Затянувшееся обсуждение в #TOOLTIP:LOCATIONRANK,[chosen_location_scope.Custom('LR_tt')],X [chosen_location_scope.Custom('LR_PREP')|l] [chosen_location_scope.GetName] внезапно завершилось. Теперь [first_country_scope.GetLongName] — единственная #TOOLTIP:RELIGION,$catholic_tt$,X #L католическая#!#! держава, способная донести слово #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католической церкви#!#! до недавно открытых земель на #TOOLTIP:CONTINENT,america,X #L американском#!#! континенте.\n\nСоглашение, вошедшее в историю как #TOOLTIP:SITUATION,treaty_of_tordesillas,X #L Договор [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_PREP')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]#!#!,"
 turmoil_in_brandenburg.1101.d:0 "Наш советник знает, как справиться [root_country.Custom('predlog_sso')] [root_country.GetAdjectiveWithNoTooltip|l]ими бедами."
 turmoil_in_brandenburg.1102.b:0 "Будем надеяться, [root_country.GetLongNameWithNoTooltip] не довед[root_country.Custom('endlong_etut')] страну до развала…"
 turmoil_in_brandenburg.1107.title:0 "[root_country.GetNameWithNoTooltip] не сда[root_country.Custom('end_etyut')]ся"
 turmoil_in_brandenburg.1303.a:0 "в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] вновь воцарился покой."
 ultramontanism_desc:0 "[GetInternationalOrganization('catholic_church').GetLeaderTitle] имеет большую власть и влияние в делах #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католической церкви#!#!. Его авторитет непогрешим."
 union_current_seat:0 "Текущий центр унии находится в городе [InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').GetCapital.GetName] [InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('CL_tt')] #TOOLTIP:COUNTRY,[InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('CL_tt')],X [InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('CL_PREP')|L]#!#!"
 unionevents.98.desc:0 "[ROOT.GetCountry.GetLongName] теперь без правителя. [root_character.GetName] [Select_CString(root_character.IsFemale, 'умерла', 'умер' )]. Обычно в таких случаях [ROOT.GetCountry.GetGovernment.GetHeirSelection.GetName|l] позволяет быстро найти подходящего кандидата на управление страной. Однако сейчас обстоятельства иные: мы состоим в международном объединении «[ROOT.GetCountry.GetDiplomacy.GetUnion.GetName]», а посему [ROOT.GetCountry.Custom('rank_ru_DAT')|l] предстоит принять весьма необычное решение."
 unionevents.98.desc.union_has_leader:0 "$unionevents.98.desc$\n\n[target_character.GetName], [Select_CString(target_character.IsFemale, 'нынешняя правительница', 'нынешний правитель' )] международного объединения «[ROOT.GetCountry.GetDiplomacy.GetUnion.GetNameWithNoTooltip]», требует себе [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий трон. Это может быть приемлемым вариантом, если мы пожелаем остаться в #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#! и в будущем получить над ней контроль, хоть он и претит принципам #TOOLTIP:GOVTYPE,republic,X #L республики#!#!."
 ver_padua_incident_rules:0 "Если #TOOLTIP:LOCATION,padova,X #L Падуя#!#! будет оккупирована до #W 1339.1.1#!, [target_country.GetName] смен[target_country.Custom('end_ityat')] сторону в конфликте «[target_war.GetName]» и обрет[target_country.Custom('end_etut')] независимость"
 war_of_religions.1300.desc:0 "Долгая и изнурительная война наконец-то завершилась мирными переговорами, результаты которых устроили все стороны. Вести быстро распространяются по #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!, и жители истерзанной державы с восторгом приветствуют наступление мира. Наконец-то страна будет избавлена от бесчисленных отрядов мародёров, разорявших её долгие годы. Достигнутый компромисс устраивает как участников #TOOLTIP:INTERNATIONAL_ORGANIZATION,$protestant_union.tt$,X #L Евангелической унии#!#!, так и членов #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_league.tt$,X #L Католической лиги#!#!. Противники давно утратили первоначальное рвение и разуверились в решающей победе, они довольны уже тем, что обеим сторонам удалось сохранить свободу вероисповедания как для собственных подданных, так и для своих единоверцев в других частях империи."
 war_of_religions.1400.desc:0 "Нынешняя война между #TOOLTIP:INTERNATIONAL_ORGANIZATION,$protestant_union.tt$,X #L Евангелической унией#!#! и #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_league.tt$,X #L Католической лигой#!#! сломала немало детских судеб. Множество малышей остались сиротами или оказались против воли разлучены со своими родителями. [Select_CString(target_artist.IsFemale, 'Одной', 'Одним' )] из этих несчастных детей войны [Select_CString(target_artist.IsFemale, 'была', 'был' )] [target_artist.GetName]. [Select_CString(target_artist.IsFemale, 'Похищенная', 'Похищенный' )] отрядом мародёров, [Select_CString(target_artist.IsFemale, 'она провела', 'он провёл' )] большую часть юности в лагерях различных армий, почти позабыв родной #TOOLTIP:LOCATION,hanau,X #L Ханау#!#!. Оказавшись недавно в нашей стране, [Select_CString(target_artist.IsFemale, 'она принялась', 'он принялся' )] оттачивать своё писательское мастерство. По слухам, из-под [Select_CString(target_artist.IsFemale, 'её', 'его' )] пера вышла уже не одна книга, однако все они были опубликованы под чужими именами."
 war_of_the_roses.18.desc:0 "Претенденты на престол выжидают, накапливая силы в мятежных провинциях [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. Они открыто восстали против нашей власти, заявив, что [target_character.GetName] и династия [target_dynasty.GetName] не имеют права на трон."
 witch_trials.1000.c:0 "[GetCountry('PAP').GetGovernment.GetRulerTitle] может дать нам дельный совет. Отправим к [Select_CString(GetCountry('PAP').GetGovernment.GetRuler.IsFemale,'ней', 'нему')] гонца."
