l_russian:
# War names. The engine hands $FIRSTNAME$ and $SECONDNAME$ as country names
# ("Bohemia–Romania War"), and the game's Russian glued an adjective ending to
# them: «1-я Богемия–Румынияая война» on Lena's screenshot, 2026-09-26. A name
# cannot be declined from here, so every form keeps it in the nominative.
 NORMAL_WAR_NAME:0 "$NUM$-я война $FIRSTNAME$ — $SECONDNAME$"
 EXCOM_WAR_NAME:0 "$NUM$-я война отлучения $FIRSTNAME$ — $SECONDNAME$"
 COLONIAL_WAR_NAME:0 "$NUM$-я колониальная война $FIRSTNAME$ — $SECONDNAME$"
 AGRESSION_WAR_NAME:0 "$NUM$-я агрессия державы $FIRSTNAME$"
 COALITION_WAR_NAME:0 "$NUM$-я война коалиции против державы $SECONDNAME$"
 CIVIL_WAR_NAME:0 "$NUM$-я гражданская война в державе $FIRSTNAME$"
