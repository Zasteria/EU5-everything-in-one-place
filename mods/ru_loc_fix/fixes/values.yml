# Round thirteen — 2026-10-25, game 1.4.4. The rest of locscan's `dropped_value`
# list, read one by one against English: 45 keys where the game's own Russian
# prints a different number than English, or none. Most are not a translator's
# choice but English moving on without the Russian — the Hussite strength now
# read from the situation's variables, morale shown as the net change, trade
# quantities «moved or desired», the zeal target instead of its monthly drift.
# Russian wording kept where it was right; the numbers are English's.

# The number was never there.
