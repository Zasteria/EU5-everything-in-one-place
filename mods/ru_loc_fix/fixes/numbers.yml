# tradition tooltip («изменяется на . Причины») started it.

# The number itself was dropped.
 TRADE_ORDER_CAPACITY_TOOLTIP_SUMMARY: "Этот [Concept('trade_order', 'торговый приказ')|e] будет использовать до [TradeOrderItem.GetEffectiveTC|2Y]@trade_capacity! (#W [TradeOrderItem.GetEffectivePercentage|0]%#! нашего [Concept('merchant_capacity', 'торгового потенциала')] на этом [Concept('market', 'рынке')]) для своих [Concept('trades', 'сделок')|e].\n\nСейчас он использует [TradeOrderItem.GetUsedTC|<2Y]@trade_capacity! в [TradeOrderItem.GetTradeCount|W] действующих [Concept('trades', 'сделках')] и приносит всего [TradeOrderItem.GetTotalProfit|+=2Y]@gold! прибыли ([TradeOrderItem.GetProfitPerCapacity|+=2] на единицу использованного [Concept('merchant_capacity', 'торгового потенциала')])."
