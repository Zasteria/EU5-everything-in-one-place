l_russian:
# Peace-treaty lines that hand a relation over (military access, food access
# and the like). Seen 2026-09-27 on the player's screenshot of the peace
# window: every such row read «Великий Новгород предлагает ет Москве», the
# relation itself missing.
#
# Two faults. `RELATION_TYPE.GetNameWithContext(...)` is in no API dump and
# prints nothing; the English key names the relation with `$RELATION$`, which
# the window supplies, so ours does too. And the `_short` form writes the whole
# verb «предлагает» and then its ending again, «ет». The ending belongs to the
# country that offers (`TARGET_COUNTRY`, the subject), not the one receiving.
 PEACE_TREATY_GAIN_RELATION:0 "[TARGET_COUNTRY.GetNameWithFlag] предлага[TARGET_COUNTRY.Custom('end_etyut')] #ONCLICK:COUNTRY,[COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[COUNTRY.Custom('CL_tt')],X [COUNTRY.Custom('CL_DAT')|L]#!#! $RELATION|l$"
 PEACE_TREATY_GAIN_RELATION_short:0 "[TARGET_COUNTRY.GetNameWithFlag] предлага[TARGET_COUNTRY.Custom('end_etyut')] #ONCLICK:COUNTRY,[COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[COUNTRY.Custom('CL_tt')],X [COUNTRY.Custom('CL_DAT')|L]#!#! $RELATION|l$"
