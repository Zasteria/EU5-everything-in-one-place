l_russian:
# Keys the game never defines, written because the rest of their family is.
#
# The game's Russian localization declines a country's rank through
# `Custom('rank_ru_GEN')` and its four siblings, which resolve to
# `<rank>_GEN` and so on. All 218 ranks have those five forms — except
# `rank_county_abbey`, which has none of them, while `rank_duchy_abbey`,
# `rank_kingdom_abbey` and `rank_empire_abbey` all do. An abbey at county rank
# therefore prints the raw key wherever a declined rank is wanted.
#
# Written as references rather than as words, the same way the game writes
# `rank_county_abbey` itself (`"$rank_duchy_abbey$"`), so if Paradox ever
# rewords the duchy forms these follow.
 rank_county_abbey_GEN:0 "$rank_duchy_abbey_GEN$"
 rank_county_abbey_DAT:0 "$rank_duchy_abbey_DAT$"
 rank_county_abbey_ACC:0 "$rank_duchy_abbey_ACC$"
 rank_county_abbey_INST:0 "$rank_duchy_abbey_INST$"
 rank_county_abbey_PREP:0 "$rank_duchy_abbey_PREP$"

# The engine's notifications (`jomini/loading_screen/localization/jomini/
# notifications_l_*.yml`): English has fourteen lines, the other ten languages
# eight, so the Workshop upload confirmation and three multiplayer alerts print
# their keys in Russian. That file is not in `reference/`, so the count is
# Russian Localization Fix 1.0.2's (2026-10-12), whose Russian this is.
 JOMINI_DLC_MANAGER_CONFIRM_UGC_UPLOAD_TITLE:0 "Подтверждение публикации в мастерской"
 JOMINI_DLC_MANAGER_CONFIRM_UGC_UPLOAD_DESC:0 "Вы действительно хотите опубликовать эту модификацию? Будет создан новый элемент в мастерской Steam.\n\nПубликуя этот элемент, вы соглашаетесь с условиями предоставления услуг мастерской Steam. Если вы ранее не приняли эти условия, откроется окно оверлея Steam с предложением ознакомиться с ними, а ваш контент будет скрыт в Steam до их принятия."
 JOMINI_JOIN_SERVER_ALERT_TITLE:0 "Не удалось подключиться к серверу"
 JOMINI_JOIN_SERVER_ALERT_DESC:0 "Пожалуйста, перейдите в главное меню, чтобы присоединиться к игре."
 JOMINI_FILE_TRANSFER_ERROR_TITLE:0 "Ошибка передачи файлов"
 JOMINI_FILE_TRANSFER_ERROR_DESC:0 "Пожалуйста, попробуйте подключиться к серверу ещё раз."
