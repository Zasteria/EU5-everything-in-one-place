 LOADING_TIP_60:0 " #T «Но кажется, что эта святая битва, выигранная близ Тарифы, была куда доблестнее той, что, как говорят, произошла у Убеды».#! \n #tooltip_subheading — Фернан Санчес де Вальядолид, кастильский хронист, сравнивая битву при Рио-Саладо с битвой при Лас-Навас-де-Толосе, #italic «Хроника Альфонсо XI»#!, ок. 1344 г.#!"
 LOADING_TIP_d009_0:0 " #T «Когда я со вниманием размышляю, светлейшая королева, и ставлю перед глазами древность всего, что было записано нам в память и назидание, одно я нахожу и вывожу как вернейшее заключение: язык всегда был спутником империи».#! \n #tooltip_subheading — Антонио де Небриха, кастильский гуманист, пролог к #italic «Грамматике кастильского языка»#!, 1492 г.#!"
 LOADING_TIP_d009_1:0 " #T «Учёность не тупит железа копья и не ослабляет меча в руке рыцаря».#! \n #tooltip_subheading — Иньиго Лопес де Мендоса, 1-й маркиз де Сантильяна, кастильский поэт и государственный деятель, #italic «Пословицы»#!, 1437 г.#!"
 LOADING_TIP_d009_2:0 " #T «Ни достоинством особ, ни красою добродетелей, ни дарованиями, коими они владели как в науках, так и в ратном деле, кастильцы ничуть не уступали тем грекам, римлянам и французам, которых столь превозносят в их писаниях».#! \n #tooltip_subheading — Эрнандо дель Пульгар, кастильский хронист, пролог к #italic «Знаменитым мужам Кастилии»#!, ок. 1486 г.#!"
 LOADING_TIP_d009_3:0 " #T «Сие творение явилось украсить Альгамбру — обитель для мирных мужей и для воинов, крепость и дворец на радость живущим».#! \n #tooltip_subheading — Ибн аль-Джайяб, придворный поэт и визирь Гранады, надпись в Альгамбре, Башня Пленницы, до 1349 г.#!"
 LOADING_TIP_d009_4:0 " #T «Я — сад, украшенный всякой красотой: взгляни на моё великолепие — и постигнешь мою суть».#! \n #tooltip_subheading — Ибн Замрак, поэт и визирь Гранады, надпись в Альгамбре, Зал Двух Сестёр, 1370-е гг.#!"
 LOADING_TIP_d009_5:0 " #T «Возьми, государь, ключи от этого рая. Я и все, кто в нём, — твои».#! \n #tooltip_subheading — Мухаммад XII по прозвищу Боабдиль, последний эмир Гранады из династии Насридов, при сдаче Гранады, 1492 г.#!"
 LOADING_TIP_d009_6:0 " #T «Воистину, я достиг своего желания в этом мире — странствовать по земле — и достиг в этом того, чего, насколько мне известно, не достигал никто другой».#! \n #tooltip_subheading — Ибн Баттута, путешественник родом из Танжера, #italic «Рихла»#!, ок. 1355 г.#!"
 LOADING_TIP_d009_7:0 " #T «Побеждённые всегда стремятся подражать победителю в его отличительных чертах, в одежде, в занятиях и во всех прочих его обстоятельствах и обычаях».#! \n #tooltip_subheading — Ибн Хальдун, историк на службе у султанов Феса из династии Маринидов, #italic «Мукаддима»#!, 1377 г.#!"
 LOADING_TIP_d009_8:0 " #T «Разгромив испанцев и завоевав Америку, мы заставили бы народы вплоть до самых Индий покориться нашей власти».#! \n #tooltip_subheading — Ахмад аль-Мансур, марокканский султан из династии Саадитов, в письме Елизавете I Английской, ок. 1600 г.#!"
