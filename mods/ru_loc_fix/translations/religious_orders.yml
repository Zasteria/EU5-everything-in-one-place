l_russian:
 RELIGIOUS_ORDER_ZEAL_DEPLETION_WARNING: "Рвения ордена «[ReligiousOrder.GetName]» больше не хватает, чтобы его поддерживать: #R если ничего не предпринять, орден будет распущен#!!"
 RELIGIOUS_ORDER_STANDING_TOOLTIP_TITLE: "Влияние в стране [Country.GetNameWithNoTooltip]"
 RELIGIOUS_ORDER_TOOLTIP_CHARACTERS: "Персонажи"
 invite_religious_order_desc: "Предоставить один из наших [Concept('locations', 'районов')|e] ордену нашей религии в качестве нового [Concept('holding', 'владения')|E]. Новое [Concept('holding', 'владение')|e] поднимает цель [Concept('zeal', 'рвения')|e] ордена, укрепляя его позиции в наших землях."
 invite_religious_order_effect_tt: "Выбранный район перейдёт в собственность ордена и поднимет цель его [Concept('zeal', 'рвения')|e] в наших землях. Само владение в течение следующих месяцев укрепит присутствие ордена здесь."
