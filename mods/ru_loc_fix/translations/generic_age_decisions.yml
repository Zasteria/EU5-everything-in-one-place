l_russian:
 jewish_expulsion_threat.title: "Угроза изгнания"
 jewish_expulsion_threat.desc: "Корона выдвигает еврейским общинам официальный ультиматум: уплатить чрезвычайный сбор или отправиться в изгнание. Угроза приносит немедленную выгоду — перепуганные общины собирают деньги, — однако воцарившаяся атмосфера неуверенности нарушает работу торговых сетей, которые издавна держались на посредниках-евреях."
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Угроза изгнания"
 jews_may_choose_to_leave_tt: "[ShowReligionAdjective('judaism')]ие [Concept('pops', 'группы населения')|e] в большинстве своём переселятся в соседние [Concept('countries', 'державы')|e]\n\nКаждый [Concept('location', 'район')|e], который они покинут, получит модификатор «[ShowModifier('jewish_expulsion_threat')]», сила которого зависит от доли, которую в нём составляли [ShowReligionAdjectiveWithNoTooltip('judaism')]ие [Concept('pops', 'группы населения')]"
