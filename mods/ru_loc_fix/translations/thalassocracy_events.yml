l_russian:
 thalassocracy_events.1.title: "Плоды наших трудов"
 thalassocracy_events.1.desc_success: "Стремительное усиление нашего флота увенчалось блестящим успехом! Множество новых и перестроенных кораблей, на которых служат умелые моряки, без сомнения, вселит страх в сердца наших соперников и врагов. Отныне ни коварные пираты, ни эскадры под враждебными знамёнами не помешают нашему господству на волнах. Когда морские пути надёжно защищены, нам будет куда проще управлять далёкими берегами и простирать свою власть за моря."
 thalassocracy_events.1.desc_failure: "После долгих лет мучительных споров о деньгах на флот нам придётся оставить мечты о власти над морями. Без сильного флота, который подкреплял бы наши притязания на талассократию, мы не сможем защитить свои воды ни от соперников, ни от каперов."
 thalassocracy_events.1.a: "Наша морская держава будет процветать!"
 thalassocracy_events.1.b: "Нам придётся смириться с собственной неудачей."
