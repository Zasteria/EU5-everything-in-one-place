 STATIC_MODIFIER_NAME_alpujarras_silk_base: "Шёлк Альпухарры"
 STATIC_MODIFIER_DESC_alpujarras_silk_base: "Тутовые рощи и шелководни деревень Альпухарры на южных склонах Сьерра-Невады дают шёлк-сырец для ткацких станков Гранады и Альмерии. Его сортируют под строгим надзором #italic хисбы#!, а скупают генуэзские агенты для рынков Фландрии и Англии."
