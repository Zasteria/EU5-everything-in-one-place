 icon_name_1: "Икона: св. $SAINT|U$ ($ADJECTIVE|U$ая школа)"
 parthenon_of_athens_work_of_art: "Парфенон ($ORIGIN$)"
 parthenon_of_athens_work_of_art_desc: "Парфенон, построенный в 447–432 гг. до н. э. на афинском Акрополе, посвящён богине Афине, покровительнице Афин. Этот храм, спроектированный зодчими Иктином и Калликратом под руководством скульптора Фидия, воплощает идеалы классической греческой архитектуры. Пропорции и скульптурное убранство храма отражают как гражданскую гордость, так и религиозное рвение. В Средневековье он служил одновременно церковью и крепостью."
 teotihuacan_temple_work_of_art: "Храмовый комплекс ($ORIGIN$)"
 teotihuacan_temple_work_of_art_desc: "Храм Солнца в Теотиуакане, построенный около 200 г. н. э., — одна из крупнейших пирамид доколумбовой Америки. Он расположен в самом сердце древнего города, недалеко от современного Мехико, был ориентирован по астрономическим явлениям и играл ключевую роль в обрядовой жизни Мезоамерики. Это сооружение из вулканического камня, покрытого штукатуркой, утверждало политическое и религиозное превосходство Теотиуакана и выглядело настолько величественно, что повлияло на более поздние цивилизации, в том числе на ацтеков, почитавших его как святыню."
 zaragoza_basilica_del_pilar_work_of_art: "Базилика Нуэстра-Сеньора-дель-Пилар"
 montserrat_work_of_art: "Аббатство Святой Марии Монсерратской"
 lalibela_church_st_george_work_of_art: "Церковь Святого Георгия в Лалибэле"
 spem_in_alium: "Мотет «Spem in alium»"
 trinity_lavra_st_sergius_work_of_art: "Троице-Сергиева лавра"
 gaude_mater_polonia: "Гимн «Gaude Mater Polonia»"
 esmeraldo_do_situ_orbis: "«Изумруд о положении мира»"
 santiago_de_compostela_work_of_art: "Собор Святого Иакова"
 koutoubia_marrakesh_work_of_art: "Мечеть Аль-Кутубия"
 qarawiyyin_fez_work_of_art: "Мечеть Аль-Карауин"
 trinity_lavra_st_sergius_work_of_art_desc: "Этот монастырь, посвящённый Святой Троице, — средоточие духовной жизни $russian_group$ой $orthodox_ADJ$ой церкви. Со временем он разросся из скромной деревянной обители и стал привлекать людей со всех концов."
 batalha_monastery_work_of_art: "Монастырь Баталья"
 batalha_monastery_work_of_art_desc: "Монастырь строился 131 год под руководством целых 15 архитекторов. Он сочетает в себе несколько художественных стилей и считается одним из самых красивых и значимых монастырей, которыми может похвастаться $POR$."
 lalibela_church_st_george_work_of_art_desc: "Церковь Святого Георгия, высеченная в скале в правление короля Лалибэлы в XII веке, — вершина эфиопской монолитной архитектуры. Возведённая из стремления создать #italic Новый Иерусалим#!, она отражает религиозные чаяния своей эпохи и самобытное христианское наследие, которым славится $ETH$."
 montserrat_work_of_art_desc: "Этот монастырь на горе Монсеррат хранит [ShowWorkOfArtName('moreneta_key')] и служит важнейшим центром духовной жизни и паломничества. [ShowCultureName('catalan')]ая культура видит в нём также символ своей самобытности."
 zaragoza_basilica_del_pilar_work_of_art_desc: "Базилика Нуэстра-Сеньора-дель-Пилар посвящена Деве Марии и, по преданию, была основана после явления Девы апостолу Иакову, который, как считается, проповедовал $christian$ на Пиренейском полуострове. Со временем церковь расширялась, а романский храм начали возводить после завоевания города [ShowLocationName('zaragoza')] в XII веке."
 santiago_de_compostela_work_of_art_desc: "$santiago_de_compostela_work_of_art$ — конечная точка #italic Камино-де-Сантьяго#!, самого многолюдного христианского паломнического пути средневекового мира; по преданию, здесь покоится апостол Иаков Старший. Строительство собора началось в 1075 году при Альфонсо VI Кастильском, а главный неф в романском стиле был в основном завершён в начале XIII века. Его вечно раскачивающееся #italic ботафумейро#! — огромное серебряное кадило — очищает верующих, проделавших долгий путь со всех концов христианского мира."
 koutoubia_marrakesh_work_of_art_desc: "$koutoubia_marrakesh_work_of_art$, дважды возведённая в городе [ShowLocationName('marrakesh')], — яркий образец альморавидской архитектуры и важная достопримечательность в самом центре города. Своё название мечеть получила от книготорговцев, что вели дела вокруг неё."
 qarawiyyin_fez_work_of_art_desc: "Основанная в 859 году Фатимой аль-Фихри, благочестивой женщиной из ифрикийской купеческой семьи, обосновавшейся в городе [ShowLocationName('fez')], $qarawiyyin_fez_work_of_art$ — один из старейших в мире непрерывно действующих центров учёности. За последующие столетия скромная мечеть выросла в великий университет, куда со всего исламского мира стекались учёные, правоведы и богословы, чтобы постигать маликитское право, богословие и рациональные науки у прославленных наставников."
 sergius_sive_capitis_caput: "«Сергий, или Голова головы»"
 simplicius_simplicissimus: "«Симплициссимус»"
 tabula_hungariae: "«Карта Венгрии»"
 artis_magnae_artilleriae: "«Великое искусство артиллерии»"
 kyiv_pechersk_lavra_work_of_art: "Печерская лавра ($ORIGIN$)"
 kyiv_pechersk_lavra_work_of_art_desc: "Основанная в 1051 году монахами Антонием и Феодосием, Киево-Печерская лавра, или #italic Печерский монастырь#!, — один из старейших и важнейших центров восточного православия. Частично построенный под землёй, монастырь использовал свои пещеры и как кельи, и как места погребения. Со временем лавра разрослась в обширный религиозный и культурный комплекс, где изучали богословие и переписывали рукописи. К XIV веку она стала средоточием духовной жизни и просвещения Киевской Руси."
 rila_monastery_work_of_art: "Рильский монастырь"
 rila_monastery_work_of_art_desc: "Основанный в X веке отшельником Святым Иоанном Рильским в суровых горах того же названия, этот православный монастырь вскоре стал духовным маяком славянского христианства. Он был важным местом паломничества и с момента основания получал щедрые пожертвования от всех болгарских правителей. В тяжёлые времена монастырь играл ключевую роль в сохранении болгарского языка, литературы и религиозных традиций, а его монахи хранили богатую традицию переписки рукописей, иконописи и сочинения церковных гимнов."
