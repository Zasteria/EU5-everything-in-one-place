l_russian:
 iberian_culture.1.title: "Песни Реконкисты"
 iberian_culture.1.desc: "Наши схватки с неверными вдохновили и менестрелей, и простой люд слагать песни во славу отваги наших воинов, сражающихся за торжество [ShowReligionGroupAdjective('christian')|U]ого дела. Эти напевы звучат всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и могут сослужить нам добрую службу — воодушевлять солдат в бою и, быть может, привлекать в наши ряды новых людей."
 iberian_culture.1.a: "Пусть они звучат на поле боя!"
 iberian_culture.1.b: "Пусть они зовут людей под наши знамёна!"
 iberian_culture.2.title: "Герой Реконкисты"
 iberian_culture.2.desc: "Среди множества храбрецов, сражающихся в войне, где нашим противником выступает [GetCountry('GRA').GetName], особо выделяется [new_general.GetName]: отвагой и воинским искусством [new_general.GetHerselfHimself] [Select_CString(new_general.IsFemale, 'стяжала', 'стяжал')] себе славу. [new_general.GetHerHis|U] имя гремит всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], слава бежит впереди [new_general.GetHerHim], и многие считают, что такой талант заслуживает командования, достойного [new_general.GetHerHis] заслуг."
 iberian_culture.2.a: "[new_general.GetSheHe|U] возглавит наши армии."
 iberian_culture.2.b: "Мы найдём [new_general.GetHerHis] талантам иное применение."
 iberian_culture.3.title: "Заселение юга"
 iberian_culture.3.desc: "Теперь, когда область [ShowAreaName('granada_area')] наконец освобождена от [ShowReligionGroupAdjective('muslim')]ого владычества, многие семьи обращают взоры к этим землям в поисках лучшей доли. Недавно до нас дошли вести о переселенцах из провинции [origin_province.GetName]: их влекут обещания брошенных земель и надежда начать новую жизнь в провинции [target_province.GetName]."
 iberian_culture.3.a: "Позволить им переселиться."
 iberian_culture.3.b: "Постараться ограничить число поселенцев."
 iberian_culture.4.title: "Чудо Девы Марии"
 iberian_culture.4.desc: "Разнеслась весть о чуде, будто бы случившемся в районе [target_location.GetName]. По словам местных жителей, на холме над поселением явилась Пресвятая Дева Мария. Кое-кто сомневается в чуде, но оно уже привлекло паломников из ближних и дальних краёв. Улицы заполнены странниками, и местные жители охотно на них наживаются. В здешнюю казну рекой текут пожертвования, и о том, как распорядиться нежданным богатством, идут жаркие споры."
 iberian_culture.4.a: "Вложить деньги в местные нужды."
 iberian_culture.4.b: "Отдать пожертвования: пусть ими распоряжаются [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 iberian_culture.4.c: "Раздать милостыню бедным."
 iberian_culture.4.d: "Этими пожертвованиями распорядятся [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 iberian_culture.5.title: "Возвращение из северных морей"
 iberian_culture.5.desc: "[ShowCultureName('basque')]ие китобои вернулись из очередного плавания в далёкие северные моря. Бросив вызов коварным штормам и водам, неведомым большинству мореходов, они привезли домой и ценный груз, и богатый опыт. Теперь [ROOT.GetCountry.GetGovernment.GetCourtTitle] спорит о том, как распорядиться этими знаниями."
 iberian_culture.5.a: "Пусть каждое плавание учится на опыте предыдущего."
 iberian_culture.5.b: "Океан сулит бесконечные возможности."
 iberian_culture.6.title: "Искусный мастер-мудехар"
 iberian_culture.6.desc: "Нам сообщили, что [target_character.GetName], искусный мастер [ShowReligionGroupAdjective('muslim')]ой веры, завоёвывает признание всюду, куда простирается [ROOT.GetCountry.GetFlavorRank]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить [target_character.GetHimHer] к нам на службу, однако многие [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] возражают против того, чтобы оказывать такую честь мудехару."
 iberian_culture.6.a: "Талант не измеряется верой."
 iberian_culture.6.b: "Такие почести подобают лишь [ShowReligionGroupAdjective('christian')|U]им подданным."
 iberian_culture.7.title: "Раздор на рынке"
 iberian_culture.7.desc: "В районе [target_location.GetName] вспыхнул раздор: [ShowReligionAdjective('sunni')]ие и [ShowReligionAdjective('catholic')]ие купцы обвиняют друг друга в том, что местные чиновники и гильдии благоволят соперникам. Нас просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] вмешались и рассудили этот спор."
 iberian_culture.7.a: "Справедливость должна восторжествовать."
 iberian_culture.7.a.tt1: "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.7.a.tt2: "Все [ShowReligionAdjective('catholic')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.7.b: "Мы должны защищать своих."
 iberian_culture.7.b.tt1: "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.7.b.tt2: "Все [ShowReligionAdjective('catholic')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.7.c: "Пусть разбираются сами."
 iberian_culture.8.title: "Спор о традициях мудехаров"
 iberian_culture.8.desc: "В районе [target_location.GetName] местные [ShowReligionAdjective('sunni')]ие общины вновь собрались на один из своих традиционных праздников — этот обычай живёт уже много поколений. Многие считают такие гулянья безобидной частью повседневной жизни, однако [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] настаивают на их запрете: по их словам, подобные публичные торжества подрывают [ShowReligionAdjective('catholic')]ий дух, на котором зиждется [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.8.a: "Пусть праздник продолжается."
 iberian_culture.8.a.tt: "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.8.b: "Положить конец празднеству."
 iberian_culture.8.b.tt: "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.9.title: "Процветающий квартал мудехаров"
 iberian_culture.9.desc: "Квартал мудехаров в районе [target_location.GetName] процветает: он привлекает множество ремесленников и купцов, чьё трудолюбие принесло поселению новый достаток. Растущее богатство квартала идёт на пользу местному хозяйству, однако часть здешней знати уже опасается, что однажды влияние общины сравняется с её собственным."
 iberian_culture.9.a: "Процветание идёт на пользу всем."
 iberian_culture.9.b: "Изъять часть их богатств, чтобы ограничить их влияние."
 iberian_culture.9.b.tt: "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.10.title: "Прославленные лекари-мудехары"
 iberian_culture.10.desc: "В последнее время лекари-мудехары завоёвывают широкую славу всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всё больше полагаются на их искусство. Некоторые советники предлагают официально назначить их придворными лекарями — пусть их услугами пользуется [ROOT.GetCountry.GetGovernment.GetCourtTitle]; однако влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] решительно против."
 iberian_culture.10.a: "Мастерство важнее вероисповедания."
 iberian_culture.10.b: "Лучше назначить [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]ого лекаря."
 iberian_culture.11.title: "Конверсо под подозрением"
 iberian_culture.11.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] обсуждает тревожное известие: [target_character.GetName], искусный купец, чья семья когда-то исповедовала [ShowReligionName('judaism')], но затем приняла крещение, обвиняется в том, что втайне по-прежнему соблюдает обряды прежней веры. В донесении говорится о запретных молитвах и тайных сборищах, однако есть и те, кто уверен: эти обвинения порождены завистью и спорами о долгах."
 iberian_culture.11.a: "Наши церковные суды должны расследовать эту ересь."
 iberian_culture.11.b: "Это клевета!"
 iberian_culture.12.title: "[ShowCultureNameWithNoTooltip('sephardi')]их купцов обвиняют"
 iberian_culture.12.desc: "Нескольких видных [ShowCultureName('sephardi')]их купцов из района [target_location.GetName] обвиняют в том, что они сколотили состояние нечестными путями: пользовались лазейками в налогах, давали деньги в рост под грабительский процент и вздували цены себе на пользу. Обвинения исходят от их торговых соперников, и мы не можем знать наверняка, правдивы ли они, но действовать нужно прежде, чем раздор разгорится ещё сильнее."
 iberian_culture.12.a: "Конфисковать их богатства."
 iberian_culture.12.a.tt: "[ShowCultureName('sephardi')]ие [ShowPopTypeName('burghers')]: все их [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.12.b: "Мы не можем действовать без доказательств."
 iberian_culture.12.b.tt: "[ShowPopTypeName('burghers')] любой культуры, кроме [ShowCultureName('sephardi')]ой: все их [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.13.title: "Против зноя и мора"
 iberian_culture.13.desc: "В южных краях, которыми владеет [ROOT.GetCountry.GetFlavorRank], издавна принято белить дома гашёной известью, чтобы под палящим солнцем в них сохранялась прохлада. Считается также, что побелка помогает уберечься от болезней. Недавно жителям района [target_location.GetName] стало не хватать гашёной извести, и теперь они просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] помогли им защитить свои дома."
 iberian_culture.13.a: "Обеспечить их гашёной известью."
 iberian_culture.13.a.tt: "Все [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 iberian_culture.13.b.tt: "Все [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.14.title: "Спор о Каньядас-Реалес"
 iberian_culture.14.desc: "С каждой сменой времён года миллионы овец гонят по Каньядас-Реалес — старинным королевским скотопрогонным трактам, что пересекают наши земли. Однако жители района [target_location.GetName] отказываются пропускать пастухов через своё поселение, опасаясь, что стада вытопчут их поля."
 iberian_culture.14.a: "Подтвердить древнее право пастухов на проход."
 iberian_culture.14.a.tt: "[ShowPopTypeName('peasants')]: все их [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.14.b: "Разрешить спор в пользу местных жителей."
 iberian_culture.15.title: "Раздор в Водном трибунале"
 iberian_culture.15.desc: "В последнее время старинный Водный трибунал разбирает спор между районами [target_location_1.GetName] и [target_location_2.GetName]. Под палящим летним солнцем воды в округе не хватает, чтобы вдоволь напоить поля обоих поселений, и их жители спорят о праве на её распределение."
 iberian_culture.15.a: "Предпочтение получит район [target_location_1.GetNameWithNoTooltip]."
 iberian_culture.15.b: "Поля в районе [target_location_2.GetNameWithNoTooltip] важнее."
 iberian_culture.15.c: "Воду разделят поровну."
 iberian_culture.16.title: "Защита фуэрос"
 iberian_culture.16.desc: "Нашего сборщика налогов, посланного в район [target_location.GetName], местные магистраты попросту не пустили в город. Здешняя знать ссылается на свои древние #italic фуэрос#! — привилегии, по которым она полностью освобождена от налогов, что взимают [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], если только их не одобрило её собственное собрание."
 iberian_culture.16.a: "Уважать хартии."
 iberian_culture.16.b: "Нужды государства превыше всего!"
 iberian_culture.17.title: "Разбойники Сьерры"
 iberian_culture.17.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает тревожные вести: хорошо вооружённые разбойники захватили труднопроходимые горные перевалы вокруг района [target_location.GetName]. Они грабят караваны и обозы, и торговля во всём крае задыхается. Если ничего не предпринять, к разбойникам могут примкнуть и другие."
 iberian_culture.17.a: "У нас нет лишних людей."
 iberian_culture.17.b: "Снарядить отряд и очистить от них горы."
 iberian_culture.18.title: "Искусство мудехаров"
 iberian_culture.18.desc: "Веками жители региона [ShowRegionName('iberia_region')] восхищались [ShowReligionGroupAdjective('muslim')]им зодчеством, расцветшим во времена аль-Андалуса. Многие архитекторы стали вплетать приёмы искусства мудехаров в романские и готические постройки — будь то геометрический орнамент или узорная резьба по штукатурке. Ныне [target_artist.GetName] — мастер, которому покровительствуют [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], — просит у престола дозволения использовать этот стиль в королевских заказах."
 iberian_culture.18.a: "Одобрить их труд."
 iberian_culture.18.b: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]ому искусству не место рядом с престолом."
 iberian_culture.19.title: "Испанская готика"
 iberian_culture.19.desc: "Строители из всех земель, что объединяет [ROOT.GetCountry.GetFlavorRank], создают архитектурный стиль, не похожий ни на один другой во всём христианском мире. Вдохновлённые устремлёнными ввысь соборами западных народов и прочными строительными традициями наших земель, они возводят памятники, возвещающие и славу Господа, и величие, которым блистает [ROOT.GetCountry.GetName]. Этот стиль, получивший название испанской готики, может на века оставить свой след в облике наших земель — если мы решим ему покровительствовать."
 iberian_culture.19.a: "Пусть камень возвестит нашу славу!"
 iberian_culture.20.title: "Испанский проторенессанс"
 iberian_culture.20.desc: "Из региона [ShowRegionName('italy_region')] к нам приходят новые художественные идеи, которые называют общим именем — [ShowInstitutionNameWithNoTooltip('renaissance')]. Их уже впитывает [ROOT.GetCountry.GetFlavorRank]: многие наши зодчие и живописцы сплетают эти веяния с родными традициями. Всё больше заказчиков желают видеть работы в новом, едва зарождающемся стиле, и, если поощрить это художественное течение, оно, быть может, откроет эпоху процветания и новшеств."
 iberian_culture.20.a: "Принять новую традицию."
 iberian_culture.20.b: "Хранить старые традиции."
 iberian_culture.21.title: "Обращение новых христиан"
 iberian_culture.21.desc: "Немалая часть [ShowReligionAdjective('judaism')]ого населения района [target_location.GetName] решила добровольно принять крещение и исповедовать [ShowReligionName('catholic')]. Многие видят в новообращённых доказательство успехов Церкви, но другие сомневаются в их искренности и зовут их «новыми христианами», отличая от тех, чьи семьи издавна исповедуют эту веру."
 iberian_culture.21.a: "Принять их в лоно веры."
 iberian_culture.21.b: "Заставить обратиться и остальных."
 iberian_culture.21.b.tt: "Все [ShowReligionAdjective('judaism')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.22.title: "Бег быков"
 iberian_culture.22.desc: "Считается, что старейший праздник бега быков во всём регионе [ShowRegionName('iberia_region')] проводят в поселении [ShowLocationName('cuellar')], но его жителям не хватает средств на ежегодное торжество. Они просят денег и обещают: если [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] возьмут расходы на себя, то героем праздника станет не Богоматерь Розария, их небесная покровительница, которую обычно чествуют в эти дни, а [target_ruler.GetName]."
 iberian_culture.22.b: "Мы не станем поддерживать эту варварскую забаву!"
 iberian_culture.22.b.tt: "Все [Concept('pops', 'группы населения')|e] в районе [ShowLocationName('cuellar')] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.23.title: "Секта алумбрадос"
 iberian_culture.23.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] и церковные иерархи получают тревожные донесения о странном мистическом братстве, которое исподволь набирает сторонников всюду, куда простирается [ROOT.GetCountry.GetFlavorRank]. Его члены называют себя «просветлёнными» и утверждают, что истинно верующий может получить божественное озарение прямо от Святого Духа, а значит, священники, таинства, паломничества и даже святая месса ему не нужны. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] опасаются, что это учение сродни протестантским ересям, и требуют начать расследование."
 iberian_culture.23.a: "Расправиться с просветлёнными."
 iberian_culture.23.b: "Не за каждым слухом скрывается еретик."
 iberian_culture.23.b.tt: "Если ничего не предпринять, влияние секты может распространиться дальше"
 iberian_culture.24.title: "Маски сброшены"
 iberian_culture.24.desc: "Наше нежелание расследовать слухи о просветлённых оказалось ошибкой. Влияние секты в провинции [target_province.GetName] сильно выросло, и её последователи открыто признали себя приверженцами [ShowReligionAdjective('lutheran')]ой ереси. Теперь [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] утверждают, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] пренебрегли предостережениями и просьбами о расследовании, а ведь решительные меры предотвратили бы эту вспышку ереси."
 iberian_culture.24.a: "Мы не можем преследовать каждого инакомыслящего."
 iberian_culture.24.a.tt: "15% всех [ShowReligionAdjective('catholic')]их [Concept('pops', 'групп населения')|e] в провинции [target_province.GetName] перейдут в [ShowReligionName('lutheran')]"
 iberian_culture.24.a.tt2: "Все [ShowReligionAdjective('catholic')]ие [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.24.b: "Они были правы, и нам следует действовать осмотрительно."
 iberian_culture.24.b.tt: "5% всех [ShowReligionAdjective('catholic')]их [Concept('pops', 'групп населения')|e] в провинции [target_province.GetName] перейдут в [ShowReligionName('lutheran')]"
 iberian_culture.24.b.tt2: "Все [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName] потеряют [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.25.title: "[ShowBuildingTypeNameWithNoTooltip('irrigation_systems')] под угрозой"
 iberian_culture.25.desc: "Во времена [ShowReligionGroupAdjective('muslim')]ого владычества в области [ShowAreaName('granada_area')] была создана сложная сеть каналов — [ShowBuildingTypeName('irrigation_systems')], — по которой драгоценная вода течёт со Сьерра-Невады к полям и садам плодородных долин. Бои за этот край нанесли немалый урон каналам, от которых издавна зависит пропитание местных жителей."
 iberian_culture.25.a: "Оплатить восстановление."
 iberian_culture.25.b: "Мы не можем позволить себе такие траты."
 iberian_culture.26.title: "Путь в Сантьяго"
 iberian_culture.26.desc: "Каждый год тысячи паломников пускаются в долгий путь, цель которого — [ShowLocationName('santiago_compostela')]. Поток странников принёс достаток бесчисленным поселениям, но дорога по-прежнему трудна: многие пути и мосты обветшали. Жители района [target_location.GetName] просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] привели в порядок дороги к Компостеле: по их словам, это и укрепит благочестие, и оживит торговлю, которой живёт [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.26.a: "Не жалеть средств ради паломников."
 iberian_culture.26.b: "Сейчас у нас есть дела поважнее."
 iberian_culture.27.title: "Угасающая традиция"
 iberian_culture.27.desc: "Из поколения в поколение трубадуры области [ShowAreaName('galicia_area')] пели свои традиционные #italic кантиги#! на [ShowDialectName('galician_dialect')]ом — почтенном литературном языке, влияние которого вышло далеко за пределы области [ShowAreaNameWithNoTooltip('galicia_area')]. Однако это не тот язык, на котором говорит [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetName], и традиция понемногу угасает."
 iberian_culture.27.a: "Взять сохранение традиции под покровительство."
 iberian_culture.27.b: "Укреплять позиции нашего языка."
 iberian_culture.28.title: "Рыбацкие братства"
 iberian_culture.28.desc: "Рыбаки района [target_location.GetName] объединились в гильдию, которую называют Рыбацким братством. Говорят, её цель — упорядочить промысел, сберечь морские знания и защищать интересы тех, кто бросает вызов волнам. Кроме того, братство стало опорой местной общины: в тяжёлые времена оно помогает своим членам и их семьям выстоять."
 iberian_culture.28.a: "Укрепить их гильдию."
 iberian_culture.28.b: "Их опыт нужен нашему флоту."
 iberian_culture.29.title: "Валенсийский [ShowGoodsNameWithNoTooltip('silk')] приносит богатство"
 iberian_culture.29.desc: "Ткачи, которыми славится [ShowLocationName('valencia')], прославились тонкими тканями — [ShowGoodsName('silk')] их работы восхищает знатоков, и им любуется вся [ShowContinentName('europe')]. Богатство, что приносит это цветущее ремесло, наполнило сундуки купцов, и свою долю получают также [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] никак не придёт к согласию о том, как распорядиться этим богатством."
 iberian_culture.29.a: "Вложить его в местные промыслы."
 iberian_culture.29.b: "Этим богатствам найдёт применение [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.30.title: "Виноградники Риохи"
 iberian_culture.30.desc: "В плодородных долинах Эбро уже много поколений процветают виноградники Риохи. Здешние вина отличаются исключительным качеством, и на это обратили внимание наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]: они видят возможность создать крупный промысел, засадив виноградниками все земли, которыми владеет [ROOT.GetCountry.GetFlavorRank]. Однако [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] возражают: это может нарушить местные обычаи, веками определявшие, как делать вино."
 iberian_culture.30.a: "Пусть виноградники разрастаются."
 iberian_culture.30.b: "Сберечь наши традиции виноделия."
