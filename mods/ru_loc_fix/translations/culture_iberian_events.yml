l_russian:
 iberian_culture.9.b.tt: "Все [ShowReligionAdjective('sunni')]ие [Concept('pops', 'группы населения')|e] в районе [target_location.GetName] потеряют [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 iberian_culture.10.desc: "В последнее время лекари-мудехары завоёвывают широкую славу всюду, куда простирается [ROOT.GetCountry.GetFlavorRank], и многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всё больше полагаются на их искусство. Некоторые советники предлагают официально назначить их придворными лекарями — пусть их услугами пользуется [ROOT.GetCountry.GetGovernment.GetCourtTitle]; однако влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] решительно против."
