l_russian:
 maghrebi_cultural_change_events.1004.title: "Дерзость [ShowCultureNameWithNoTooltip('andalusi')]их переселенцев"
 maghrebi_cultural_change_events.1004.desc: "В последние годы из региона [ShowRegionName('iberia_region')] к нам хлынули [ShowCultureName('andalusi')]ие переселенцы, бегущие от жестоких гонений, которым подвергаются там наши [ShowReligionGroupAdjective('muslim')]ие братья. Хотя [ROOT.GetCountry.GetReligion.GetGodName] даровал им новый дом, эти дерзкие пришельцы смеют открыто жаловаться на жизнь в регионе [ShowRegionName('maghreb_region')] и превозносить тех, кто остался во владениях коварных [ShowReligionGroupAdjective('christian')]их держав!\n\nОдин известный представитель сословия [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], принадлежащий к общине «[target_pop2.GetName]», назвал такие речи «почти отступничеством от веры»."
 maghrebi_cultural_change_events.1004.a: "Если в регионе [ShowRegionNameWithNoTooltip('iberia_region')] так хорошо, что ж они туда не вернутся?"
 maghrebi_cultural_change_events.1004.b: "Попытаться успокоить обе стороны."
