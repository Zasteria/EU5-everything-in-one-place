l_russian:
 rise_of_the_szlachta_crown_triumphant_desc: "Даёт модификатор #Y «$STATIC_MODIFIER_NAME_pol_supremacy_over_the_nobles_modifier$»#! на 20 лет, сила которого зависит от нашей [Concept('crown_power', 'власти правителей')|e]. Отменяет до трёх [Concept('estate_privilege', 'сословных привилегий')|e], которыми владеют $nobles_estate_szlachta$, и значительно повышает нашу [Concept('stability', 'стабильность')|e]."
 rise_of_the_szlachta_nobles_ascendant_desc: "Заменяет наш главный [Concept('government_reform', 'государственный принцип')|e] на «[ShowGovernmentReformName('rule_of_the_sejm')]», а если мы ещё не монархия, меняет нашу форму правления на «[ShowGovernmentTypeName('monarchy')]». $nobles_estate_szlachta$ получают привилегию «[ShowEstatePrivilegeName('golden_liberty')]», а престол отныне передаётся по правилу «[ShowHeirSelectionName('elective_succession')]»."
 rise_of_the_szlachta_burghers_empowered_desc: "Значительно смещает нас в сторону ценности «[ShowSocietyDirectionName('plutocracy')]», а после наступления эпохи «[ShowAgeName('age_4_reformation')]» — также в сторону ценности «[ShowSocietyDirectionName('mercantilism')]». Сословие «[ShowEstateTypeName('burghers_estate')]» получает до трёх различных [Concept('estate_privilege', 'сословных привилегий')|e]. Отныне для перехода к форме правления «[ShowGovernmentTypeName('republic')]» нам требуется гораздо меньше [Concept('societal_value', 'общественной ценности')|e], [Concept('legitimacy', 'легитимности')|e] и [Concept('estate_power', 'сословной власти')|e] сословия «[ShowEstateTypeName('burghers_estate')]»."
 variable_rise_of_szlachta_burghers_outcome_variable_tt: "Сословие «[ShowEstateTypeName('burghers_estate')]» захватило власть"
 selected_area_inspected_tt: "В выбранной [Concept('area', 'области')|e] будет проведена инспекция. Это снизит [Concept('pop_satisfaction', 'довольство')|e], но повысит [Concept('control', 'контроль')|e] над ключевыми [Concept('provinces', 'провинциями')|e] этой области.\n#italic Эффективность инспекции главным образом зависит от [Concept('population', 'населения')|e] [Concept('area', 'области')|e] и нашего показателя «[ShowModifierTypeName('legislative_efficiency')]»#!"
