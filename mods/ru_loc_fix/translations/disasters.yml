 selected_area_inspected_tt: "В выбранной [Concept('area', 'области')|e] будет проведена инспекция. Это снизит [Concept('pop_satisfaction', 'довольство')|e], но повысит [Concept('control', 'контроль')|e] над ключевыми [Concept('provinces', 'провинциями')|e] этой области.\n#italic Эффективность инспекции главным образом зависит от [Concept('population', 'населения')|e] [Concept('area', 'области')|e] и нашего показателя «[ShowModifierTypeName('legislative_efficiency')]»#!"
