l_russian:
 game_concept_unit_formation_preference_desc: "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
 game_concept_religious_order_desc: "Братство, посвятившее себя служению [Concept('religion', 'религии')|e]. Оно может распространяться на многие [Concept('countries', 'державы')|e] и не подчиняется ни одному правителю. Орден живёт и гибнет вместе со своим [Concept('zeal', 'рвением')|e], следует [Concept('calling', 'призванию')|e], определяющему его поведение, и основывает [Concept('holdings', 'владения')|e] в [Concept('locations', 'районах')|e], расширяя своё присутствие. Его [Concept('religious_order_standing_short', 'влияние')|e] там, где он укоренился, — во благо или во вред — зависит от того же [Concept('zeal', 'рвения')|e]."
 game_concept_zeal_desc: "Жизненная сила [Concept('religious_order', 'религиозного ордена')|e]. Каждый месяц рвение стремится к цели, которую задают [Concept('holdings', 'владения')|e] ордена и его положение в землях, где он действует; орден, чьё рвение иссякло, распускается. Ревностный орден обладает большим [Concept('religious_order_standing_short', 'влиянием')|e] везде, где действует, и воспитывает куда более способных вождей, а угасший — лишь слабых."
 game_concept_calling_desc: "Дело, которому посвящает себя [Concept('religious_order', 'религиозный орден')|e]: молитва, учёность, врачевание или война. Призвание подталкивает орден к определённым [Concept('societal_values', 'общественным ценностям')|e] и решает, что дают его [Concept('holdings', 'владения')|e]. Оно же окрашивает отношения ордена с принимающей его [Concept('country', 'страной')|e]: преданный орден благословляет державу своим призванием, а утративший преданность превращает то же призвание в бремя."
 game_concept_holding_desc: "[Concept('location', 'Район')|e], которым владеет [Concept('religious_order', 'религиозный орден')|e], — например, монастырь или капитул. Владение укрепляет район, в котором находится, и служит основой положения ордена в принимающей его [Concept('country', 'стране')|e]. В небольших державах владения весят больше: каждое из них заметнее на фоне всей страны."
 game_concept_bombard_phase_desc: "Обстрел — начальная [Concept('phase', 'фаза')|e] [Concept('combat', 'сражения')|e], за которой следует основная [Concept('combat_phase', 'фаза боя')|e]. Обстрел длится [GetDefine('NCombat','BOMBARD_DURATION_DAILY')|W] дн. и доступен только [Concept('regiments', 'полкам')|e], способным вести [Concept('bombard', 'обстрел')|e], например частям категории «[ShowUnitCategoryName('army_artillery')]».\n\nКаждый день подходящие [Concept('regiments', 'полки')] могут провести [Concept('bombard', 'обстрел')] и нанести вражескому [Concept('regiment', 'полку')] в той же [Concept('section', 'части боевого порядка')|e] урон, равный их [Concept('combat_power', 'боевой мощи')|e]."
 game_concept_cultural_unity_desc: "Культурное единство — это доля [Concept('population', 'населения')|e] [Concept('country', 'державы')|e], принадлежащего к её [Concept('primary_culture', 'основной культуре')|e]. Вес каждой [Concept('pop', 'группы населения')|e] пропорционален [Concept('control', 'контролю')|e] над её [Concept('location', 'районом')|e], поэтому недавно завоёванные и слабо контролируемые земли мало влияют на результат."
 game_concept_historical_capital_desc: "Это [Concept('location', 'район')|e], прежде служивший [Concept('capital', 'столицей')|e] владеющей им [Concept('country', 'державы')|e]. Статус [Concept('historical_capital', 'исторической столицы')] возникает только тогда, когда [Concept('capital', 'столица')] меняется в результате события, решения или иного особого действия. Самостоятельный перенос [Concept('capital', 'столицы')] такого статуса не даёт. У [Concept('country', 'державы')] может быть лишь одна [Concept('historical_capital', 'историческая столица')]: когда [Concept('capital', 'столица')] снова переезжает, прежняя [Concept('historical_capital', 'историческая столица')] теряет статус. Особые эффекты [Concept('buildings', 'сооружений')|e], возведённых в [Concept('capital', 'столице')], сохраняются и в [Concept('historical_capital', 'исторической столице')]. Этот [Concept('location', 'район')] также сохраняет часть преимуществ [Concept('capital', 'столицы')]: источник [Concept('proximity', 'досягаемости')|e], бонусы к [Concept('max_control', 'максимальному контролю')|e], [Concept('population_capacity', 'вместимости населения')|e], [Concept('migration_attraction', 'привлекательности для переселенцев')|e] и эффективности [Concept('fort_maintenance', 'содержания крепостей')|e], а также бесплатные уровни сооружений. Бонус к [Concept('proximity', 'досягаемости')] не действует, если [Concept('location', 'район')] уже получает более высокую [Concept('proximity', 'досягаемость')] от нынешней [Concept('capital', 'столицы')]."
 game_concept_initiative_desc: "Инициатива определяет, с какой вероятностью [Concept('regiment', 'полк')|e] сможет [Concept('engage', 'вступить в бой')|e] во время [Concept('combat_phase', 'боевой фазы')|e] [Concept('combat', 'сражения')|e].\n\nКаждый день, если позволяет [Concept('frontage', 'ширина фронта')|e], все [Concept('regiments', 'полки')], ещё не [Concept('engaged', 'вступившие в бой')], пытаются вступить в него.\n\nВероятность равна сумме двух произведений: инициатива × [GetDefine('NCombat','INITIATIVE_CHANCE_EACH_DAILY')] и число дней в бою × [GetDefine('NCombat','INITIATIVE_CHANCE_DURATION_DAILY')]. Если результат выше броска [Concept('d100', 'К100')|e], [Concept('regiment', 'полк')] считается [Concept('engaged', 'вступившим в бой')].\n\nНаивысшей инициативой обычно обладают лёгкие и стрелковые [Concept('regiments', 'полки')|e]."
 game_concept_maritime_presence_desc: "От морского присутствия у наших берегов зависят наша [Concept('merchant_power', 'торговая сила')|e] и [Concept('control', 'контроль')|e] над территорией.\n\nВ мирное время присутствие постепенно растёт при наличии [Concept('ports', 'портов')|e]. [Concept('blockade', 'Блокада')|e] быстро снижает его, а [Concept('navy', 'флот')|e] в [Concept('seazone', 'акватории')|e] помогает его восстановить.\n\nПри расчёте показателя «$game_concept_control$» высокое $game_concept_maritime_presence$ снижает потери [Concept('proximity', 'досягаемости')|e] между [Concept('seazones', 'акваториями')|e]. В прибрежных водах ($game_concept_seazones$) любого [Concept('market', 'рынка')|e] наше $game_concept_maritime_presence$ увеличивает нашу $game_concept_merchant_power$ на этом рынке."
 game_concept_phase_desc: "У [Concept('combat', 'сражения')|e] две фазы. Первой идёт [Concept('bombard_phase', 'фаза обстрела')|e] длительностью [GetDefine('NCombat','BOMBARD_DURATION_DAILY')|W] дн., если есть [Concept('regiments', 'полки')|e], способные вести [Concept('bombard', 'обстрел')|e]. Затем начинается [Concept('combat_phase', 'фаза боя')|e]."
 game_concept_religious_unity_desc: "Религиозное единство — это доля [Concept('population', 'населения')|e] [Concept('country', 'державы')|e], исповедующего официальную государственную [Concept('religion', 'религию')|e]. Вес каждой [Concept('pop', 'группы населения')|e] пропорционален [Concept('control', 'контролю')|e] над её [Concept('location', 'районом')|e], поэтому недавно завоёванные и слабо контролируемые земли мало влияют на результат."
