l_russian:
 game_concept_unit_formation_preference_desc: "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
 game_concept_religious_order_desc: "Братство, посвятившее себя служению [Concept('religion', 'религии')|e]. Оно может распространяться на многие [Concept('countries', 'державы')|e] и не подчиняется ни одному правителю. Орден живёт и гибнет вместе со своим [Concept('zeal', 'рвением')|e], следует [Concept('calling', 'призванию')|e], определяющему его поведение, и основывает [Concept('holdings', 'владения')|e] в [Concept('locations', 'районах')|e], расширяя своё присутствие. Его [Concept('religious_order_standing_short', 'влияние')|e] там, где он укоренился, — во благо или во вред — зависит от того же [Concept('zeal', 'рвения')|e]."
 game_concept_zeal_desc: "Жизненная сила [Concept('religious_order', 'религиозного ордена')|e]. Каждый месяц рвение стремится к цели, которую задают [Concept('holdings', 'владения')|e] ордена и его положение в землях, где он действует; орден, чьё рвение иссякло, распускается. Ревностный орден обладает большим [Concept('religious_order_standing_short', 'влиянием')|e] везде, где действует, и воспитывает куда более способных вождей, а угасший — лишь слабых."
 game_concept_calling_desc: "Дело, которому посвящает себя [Concept('religious_order', 'религиозный орден')|e]: молитва, учёность, врачевание или война. Призвание подталкивает орден к определённым [Concept('societal_values', 'общественным ценностям')|e] и решает, что дают его [Concept('holdings', 'владения')|e]. Оно же окрашивает отношения ордена с принимающей его [Concept('country', 'страной')|e]: преданный орден благословляет державу своим призванием, а утративший преданность превращает то же призвание в бремя."
 game_concept_holding_desc: "[Concept('location', 'Район')|e], которым владеет [Concept('religious_order', 'религиозный орден')|e], — например, монастырь или капитул. Владение укрепляет район, в котором находится, и служит основой положения ордена в принимающей его [Concept('country', 'стране')|e]. В небольших державах владения весят больше: каждое из них заметнее на фоне всей страны."
