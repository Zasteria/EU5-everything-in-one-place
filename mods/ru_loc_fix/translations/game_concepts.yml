l_russian:
 game_concept_unit_family: "Семейство войск"
 game_concept_unit_families: "Семейства войск"
 game_concept_unit_family_desc: "Некоторые [Concept('unit_types', 'типы войск')|e] объединены в семейства, и у всех членов одного семейства общий лимит найма. Улучшение отряда до более нового члена того же семейства никогда не занимает дополнительного места, поэтому лимит ограничивает, сколько таких отрядов вы можете выставить всего, а не сколько отрядов каждой [Concept('age', 'эпохи')|e]."
 game_concept_unit_formation_preference_desc: "Определяет, по какой логике выстраивается строй при действии #W $BALANCE_ARMY$#!, а также когда строй ваших отрядов задаётся автоматически."
 game_concept_private_regiment: "Частный полк"
 game_concept_private_regiments: "Частные полки"
 game_concept_private_regiment_desc: "Частный полк — это [Concept('regiment', 'полк')|e], который [Concept('estate', 'сословие')|e] набирает и содержит в собственной частной армии, не расходуя наше [Concept('manpower', 'число рекрутов')|e]. Мы можем призвать такие полки к себе на службу, а после роспуска они возвращаются к сословию, а не пополняют наш запас рекрутов. Сословие, поднявшее восстание, отзывает все частные полки, которые нам одолжило."
 game_concept_tax_base_ratio_desc: "Каждый [Concept('location', 'район')|e] целиком добавляет своё [Concept('wealth', 'богатство')] к вашей [Concept('economical_base', 'экономической базе')|e]. [Concept('gold', 'Дукаты')|E] же поступают только с той [Concept('tax_base', 'налоговой базы')], которую вы собираете, поэтому низкое соотношение — признак страны, которая выглядит могущественной, но мало что может оплатить: её экономика так и не доходит до казны.\n\nПричина разрыва — [Concept('control', 'контроль')|e]. [Concept('location', 'Район')] теряет [Concept('tax_base', 'налоговую базу')] пропорционально своему [Concept('wealth', 'богатству')], поэтому больше всего даёт повышение контроля в богатых [Concept('locations', 'районах')], где он низок. Для этого не нужны ни новые сооружения, ни [Concept('pops', 'группы населения')|e] — лишь более крепкая власть над богатством, которое вы уже производите."
 game_concept_location_rank_upper_desc: "У каждого [Concept('location', 'района')|e] свой ранг: район может быть [Concept('urban_location', 'городским')|e] или [Concept('rural_location', 'сельским')|e].\n\nЦвет значка ранга показывает, является ли [Concept('location', 'район')] столицей."
 game_concept_location_rank_list_title: "Обычные районы"
 game_concept_location_rank_province_capital_list_title: "[Concept('province_capital', 'Столицы провинций')|e]"
 game_concept_location_rank_province_capital_list: "$BULLET_WITH_TAB$@megalopolis_province_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_province_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_province_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_province_capital! [ShowLocationRankName('rural_settlement')]"
 game_concept_location_rank_capital_list_title: "[Concept('capital', 'Столицы держав')|e]"
 game_concept_location_rank_capital_list: "$BULLET_WITH_TAB$@megalopolis_capital! [ShowLocationRankName('megalopolis')]\n$BULLET_WITH_TAB$@city_capital! [ShowLocationRankName('city')]\n$BULLET_WITH_TAB$@town_capital! [ShowLocationRankName('town')]\n$BULLET_WITH_TAB$@rural_settlement_capital! [ShowLocationRankName('rural_settlement')]"
