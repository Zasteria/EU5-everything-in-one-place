 flavor_ned.23.desc: "Хотя идея «[ShowSocietyDirectionName('free_trade')]» для державы [ROOT.GetCountry.GetName] не нова, споры между протекционистами и сторонниками направления «[ShowSocietyDirectionNameWithNoTooltip('free_trade')]» разгораются всё жарче. Один из философов, участвующих в этих спорах, — [target_character2.GetName], в прошлом заморский купец на службе нашей державы ([ROOT.GetCountry.GetFlavorRank]). Он уже начал писать новый трактат и, возможно, сумеет склонить чашу весов в пользу направления «[ShowSocietyDirectionNameWithNoTooltip('free_trade')]»."
