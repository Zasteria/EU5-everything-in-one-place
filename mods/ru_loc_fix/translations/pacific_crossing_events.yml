l_russian:
 pacific_crossing_events.ship_lost_tt: "Корабль потерян (#R -1#! Корабли)"
 pacific_crossing_events.provisions_down_tt: "Запасы провизии флота сократились (#R -25#! Провизия)"
 pacific_crossing_cargo_loaded_effect: "На борт погружен груз — [ShowGoodsName('silk')], [ShowGoodsName('porcelain')] и пряности, — который будет продан, когда флот вернётся домой."
 pacific_crossing_events.1.a: "Снарядить флот побольше — ещё один корабль для предстоящих поисков."
 pacific_crossing_events.1.a.tt: "Ещё один корабль снаряжён и присоединён к флоту (#G +1#! Корабли)"
 pacific_crossing_events.1.b: "Запастись провизией на переход, а в остальном положиться на удачу."
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] нанесёт на карту каждый ветер и каждое течение на нашем пути."
 pacific_crossing_events.2.a: "Выменять воду и фрукты на бусы, [ShowGoodsNameWithNoTooltip('cloth')] и [ShowGoodsNameWithNoTooltip('iron')]."
 pacific_crossing_events.4.a: "Начать торговлю товарами, что идут через эти острова: [ShowGoodsNameFlat('silk')] и [ShowGoodsNameFlat('porcelain')]."
 pacific_crossing_events.5.a: "Заполнить трюм до отказа: [ShowGoodsNameWithNoTooltip('cloves')], до последней бочки."
 pacific_crossing_events.6.a: "Северный путь: держаться азиатского берега, затем идти на восток."
 pacific_crossing_events.6.a.tt: "Идти на север вдоль берегов региона [ShowRegionName('japan_region')] и дальше, а затем позволить западным ветрам высоких широт пронести флот через весь океан — туда, где лежит [ShowContinentName('america')], — и домой"
 pacific_crossing_events.6.b.tt: "Идти строго на восток, прямо против пассатов, мимо знакомых островов. Ветер отбрасывал назад каждый флот, что пытался пройти этим путём, — будьте готовы к тому, что вас отбросит до самых Островов Пряностей"
 pacific_crossing_events.6.c.tt: "Уйти далеко на юго-восток, через усеянный островами южный океан. Путь, вполне возможно, лежит именно там — но он неимоверно долог, и провизии флота может не хватить до его конца"
 pacific_crossing_events.11.c: "Бросить гибнущее судно, а его команду распределить по остальным кораблям."
 pacific_crossing_events.18.fight_win_tt: "Бунт подавлен, порядок восстановлен (#G +5#! Боевой дух экипажа)"
 pacific_crossing_events.20.b: "Подойти и торговать — показать им [ShowGoodsNameWithNoTooltip('iron')] и [ShowGoodsNameWithNoTooltip('cloth')] и надеяться на лучшее."
