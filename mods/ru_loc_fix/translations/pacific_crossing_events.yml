 pacific_crossing_events.5.desc.no_owner: "Запах доходит до флота раньше, чем остров, — сладость на ветру, тяжёлая, резкая и пряная. Одинокая вулканическая вершина, окутанная облаком, зелёная до самой кромки воды. Гавань полна малайских и яванских проа, но ни знамя, ни дворец не говорят о том, кто владеет этим берегом.\n\nКаждый купец в [ShowLocationName('lisbon')] и [ShowLocationName('sevilla')] платит целое состояние за этот аромат, даже не зная, откуда он берётся. Никто в этом флоте ещё не стоял так близко к его источнику — деревья, отягощённые незрелыми [ShowGoodsName('cloves')], на склонах над заливом, где груз одного корабля стоит дороже, чем всё плавание. Трюмы можно наполнить здесь. Остаётся лишь довезти их домой."
 pacific_crossing_events.23.c: "Внять им и повернуть флот назад, к Островам Пряностей."
