l_russian:
 pacific_crossing_events.ship_lost_tt: "Корабль потерян (#R -1#! Корабли)"
 pacific_crossing_events.provisions_down_tt: "Запасы провизии флота сократились (#R -25#! Провизия)"
 pacific_crossing_cargo_loaded_effect: "На борт погружен груз — [ShowGoodsName('silk')], [ShowGoodsName('porcelain')] и пряности, — который будет продан, когда флот вернётся домой."
 pacific_crossing_events.1.desc: "[ShowContinentName('asia')] — вовсе не главная цель поручения: туда корабли уже доплывали, уносимые пассатами на запад, словно лист течением ручья. Главное — вернуться. Колония на дальнем берегу этого океана ничего не стоит, если флот может доплыть до неё, но не может вернуться; всё предприятие зависит от того, удастся ли найти надёжный путь домой — такой, которым корабль сможет ходить год за годом, увозя туда [ShowGoodsName('silver')] и привозя обратно [ShowGoodsName('silk')].\n\nПопутный ветер на запад известен и постоянен. Что лежит за ним и даст ли море флоту когда-нибудь дорогу назад, не скажет ни одна карта в этой гавани. Лоцманы уверены лишь в одном: домой придётся возвращаться иной дорогой."
 pacific_crossing_events.1.a: "Снарядить флот побольше — ещё один корабль для предстоящих поисков."
 pacific_crossing_events.1.a.tt: "Ещё один корабль снаряжён и присоединён к флоту (#G +1#! Корабли)"
 pacific_crossing_events.1.b: "Запастись провизией на переход, а в остальном положиться на удачу."
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] нанесёт на карту каждый ветер и каждое течение на нашем пути."
 pacific_crossing_events.2.desc: "Недели, когда вокруг не было ничего, кроме воды и неба, обрываются криком впередсмотрящего: «Земля!» Низкий зелёный остров в кольце белого прибоя. Флот ещё не успел встать на якорь, а навстречу уже мчатся каноэ — узкие лодки с балансирами под треугольными парусами скользят с волны на волну так быстро, что лоцманы лишь стоят и смотрят. Островитяне, смеясь и ничего не боясь, взбираются по бортам и уносят всё, что не привязано. Для них нет воровства в том, чтобы взять ничейное; для голодных людей, месяц проведших в море, это вызов.\n\nНо здесь есть пресная вода, и фрукты, и рыба — и всё это можно взять, так или иначе."
 pacific_crossing_events.2.a: "Выменять воду и фрукты на бусы, [ShowGoodsNameWithNoTooltip('cloth')] и [ShowGoodsNameWithNoTooltip('iron')]."
 pacific_crossing_events.3.desc: "Ни земли, ни птиц, ни даже пучка водорослей на воде. Команда уже не одну неделю в море, и с каждой из них уверенность лоцмана тает. У людей кровоточат дёсны и шатаются зубы; один клянётся, что старая рана, зажившая много лет назад, открылась снова. Бочки с водой почти пусты, а в сухарях больше долгоносиков, чем хлеба. Ветер милостив — ровный и прохладный, — но он уносит корабли всё глубже в океан, которому не видно конца.\n\nКапитан сохраняет невозмутимое лицо и ровный голос, отсчитывает дни на карте и не говорит ничего, во что не верит сам."
 pacific_crossing_events.4.desc: "Спустя долгое время после того, как Острова воров остались позади, впередсмотрящий различает сквозь утреннюю дымку зелёные холмы. Когда флот входит в большой залив, становится ясно, что берег этот не пустынен. Над водой по склону холма поднимается поселение — белёные стены и крыши, крытые пальмовыми листьями. Навстречу кораблям выходят каноэ с балансирами; в них люди в цветных одеждах, и тревоги они не выказывают.\n\nСамый рослый из них, с золотом на шее, говорит на [location.GetDominantCulture.GetLanguage.GetName]ом языке, которого не знает ни один из лоцманов, и указывает на берег с непринуждённостью человека, привыкшего торговать с чужаками. У этих островов свой мир — и через них уже текут [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')] далёкого Катая."
 pacific_crossing_events.4.desc.owned: "Спустя долгое время после того, как Острова воров остались позади, впередсмотрящий различает сквозь утреннюю дымку зелёные холмы — а затем и безошибочно узнаваемые наши собственные флаги над поселением на склоне. Флот наткнулся не на какой-то неведомый берег, а вошёл в нашу собственную гавань: [pacific_colony.GetName], владение нашей Короны, где пристани и склады уже вовсю работают.\n\nНавстречу кораблям выходят лодки с соотечественниками, изумлёнными тем, что флот явился из пустого океана с востока. Здесь команды могут в безопасности пополнить запасы воды и провизии и погрузить [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')], которые китайские купцы привозят к нашим собственным причалам."
 pacific_crossing_events.4.desc.hostile: "Спустя долгое время после того, как Острова воров остались позади, впередсмотрящий различает сквозь утреннюю дымку зелёные холмы — а затем и чужой флаг над частоколом у самой воды. Другая держава добралась до этих островов первой. Когда флот входит в залив, вдоль стен поселения [pacific_rival_shore.GetName] уже выкачены пушки, а к кораблям направляются вооружённые лодки, чтобы потребовать объяснений.\n\nТеперь это земля державы [pacific_rival.GetName], и в лучшем случае приём будет настороженным. Шёлк и фарфор Катая по-прежнему текут через архипелаг — но через руки соперника, а не свободно в наши."
 pacific_crossing_events.4.a: "Начать торговлю товарами, что идут через эти острова: [ShowGoodsNameFlat('silk')] и [ShowGoodsNameFlat('porcelain')]."
 pacific_crossing_events.5.desc: "Запах достигает флота раньше, чем показывается остров, — сладость на ветру, густая, острая и пряная. Одинокая вулканическая вершина в шлейфе облаков, зелёная до самой кромки воды. Гавань полна малайских и яванских проа, а с якорной стоянки отчётливо виден дворец, где живёт [target_owner.Custom('GetRulerOrRegentTitle')] державы [target_owner.GetName].\n\nКаждый купец в городах [ShowLocationName('lisbon')] и [ShowLocationName('sevilla')] платит за этот аромат целое состояние, так и не узнав, откуда он берётся. Никто в этом флоте ещё не стоял так близко к его источнику — к деревьям на склонах над заливом, усыпанным незрелыми бутонами пряности, что зовётся [ShowGoodsName('cloves')]; один корабельный груз её стоит больше, чем обошлось всё плавание. Здесь можно заполнить трюмы. Осталось лишь довезти их до дома."
 pacific_crossing_events.5.desc_known: "Запах достигает флота раньше, чем показывается остров, — сладость на ветру, густая, острая и пряная. Одинокая вулканическая вершина в шлейфе облаков, зелёная до самой кромки воды. Гавань полна малайских и яванских проа, а с якорной стоянки отчётливо виден дворец, где живёт [target_owner.Custom('GetRulerOrRegentTitle')] державы [target_owner.GetName].\n\nКаждый купец в городах [ShowLocationName('lisbon')] и [ShowLocationName('sevilla')] знает этот аромат понаслышке и платит за него целое состояние. Никто в этом флоте ещё не стоял так близко к его источнику — к деревьям на склонах над заливом, усыпанным незрелыми бутонами пряности, что зовётся [ShowGoodsName('cloves')]; один корабельный груз её стоит больше, чем обошлось всё плавание. Здесь можно заполнить трюмы. Осталось лишь довезти их до дома."
 pacific_crossing_events.5.desc.driven_back: "Над носом снова поднимаются Острова Пряностей — та же зелёная вершина, та же людная якорная стоянка, — а вместе с ними приходит горькое осознание: флот отброшен туда, откуда начинал, а путь домой так и не найден. Пассаты не оставили кораблям иного выбора, кроме как бежать назад, к этим берегам.\n\nТеперь стоянка живёт по мрачному распорядку. Острова снова дадут воду и пищу; больных можно свезти на берег, командам — дать отдых, а трюмы — пополнить всем, что корабли ещё способны взять. Но каждый на борту знает, какой расчёт впереди: флоту придётся собраться с силами и снова выйти в море, чтобы ещё раз попытаться пройти домой, — а попыток у него осталось немного."
 pacific_crossing_events.5.a: "Заполнить трюм до отказа: [ShowGoodsNameWithNoTooltip('cloves')], до последней бочки."
 pacific_crossing_events.6.desc: "Трюмы полны, и лёгкая половина плавания позади. Теперь флоту предстоит сделать то единственное, чему не научит ни одна карта на борту: найти обратный путь через океан, который он только что пересёк. Ветер, так ласково нёсший корабли на запад, дует прямо навстречу их возвращению, и каждый лоцман за столом понимает, что это значит.\n\nОфицеры флота допоздна сидят над картами, и на этот раз лоцманы не могут прийти к согласию. У каждого свой курс, за который он ратует, и свои причины опасаться чужих, а за краем известного моря никто из них не может обещать, куда приведёт любой из путей, — есть лишь догадки и смелость поставить на них. Решать одному капитану, и жизнь каждой души на борту будет зависеть от курса, который он проложит."
 pacific_crossing_events.6.desc.driven_back: "Офицеры флота снова собираются вместе, и настроение за столом испорчено. Курс был выбран, и океан отбросил его назад; флот пробивался сюда лишь затем, чтобы получить этот урок. Оставшиеся пути — по-прежнему лишь доводы в споре, проверенные не лучше прежнего, а кораблей, которыми можно рискнуть, теперь меньше, и команды поредели.\n\nЛоцманы больше не повышают голоса. Каждый, кто склонился над картой, знает: на это море нельзя бросаться снова и снова без потерь. Курс из этих вод придётся прокладывать ещё раз, и шансов выбрать осталось немного."
 pacific_crossing_events.6.a: "Северный путь: держаться азиатского берега, затем идти на восток."
 pacific_crossing_events.6.a.tt: "Идти на север вдоль берегов региона [ShowRegionName('japan_region')] и дальше, а затем позволить западным ветрам высоких широт пронести флот через весь океан — туда, где лежит [ShowContinentName('america')], — и домой"
 pacific_crossing_events.6.b.tt: "Идти строго на восток, прямо против пассатов, мимо знакомых островов. Ветер отбрасывал назад каждый флот, что пытался пройти этим путём, — будьте готовы к тому, что вас отбросит до самых Островов Пряностей"
 pacific_crossing_events.6.c.tt: "Уйти далеко на юго-восток, через усеянный островами южный океан. Путь, вполне возможно, лежит именно там — но он неимоверно долог, и провизии флота может не хватить до его конца"
 pacific_crossing_events.7.desc: "Ветер стихает. Паруса обвисают, море до самого горизонта лежит гладкое, как стекло, и корабли неподвижно стоят под белым, палящим небом. Именно за такой штиль этот океан и назвали Тихим — за кротость, от которой команды уже не раз умирали с голоду.\n\nВода в бочках становится тёплой и протухает. Каждый безветренный день — это дневной паёк, потраченный без единой пройденной мили, и люди это знают. Они следят за пустым такелажем и горизонтом и уже дважды кричали «Земля!», завидев гряду облаков, что растаяла без следа. Праздные руки на заштилевшем корабле редко долго остаются праздными."
 pacific_crossing_events.9.desc: "Долгий подъём на север, в холодные серые воды, а затем бесконечная дуга на восток через пустой океан заканчиваются, когда впередсмотрящий наконец видит его: высокий лесистый берег, мысы, уходящие к югу под пеленой тумана. Это не [ShowContinentName('asia')] и не какой-нибудь остров — это западный берег, и за ним — сама [ShowContinentName('america')]. [ShowContinentName('pacific_ocean_continent')] остался позади: флот вышел на ближней стороне света, и ему осталось лишь спуститься на юг вдоль берега, уже знакомого по картам, чтобы достичь дружественного порта.\n\nПуть домой найден. Осталось лишь пройти его последний отрезок."
 pacific_crossing_events.10.desc: "Небо наливается цветом синяка, и ветер обрушивается стеной. Уже через час флот борется за жизнь: волны вздымаются выше грота-рея, зелёная вода перехлёстывает через шкафут, парусина лопается с треском, похожим на пушечные выстрелы. Корабли тяжело валяет с борта на борт, и во мгле они один за другим теряют друг друга из виду. Лоцманам остаётся лишь держаться и считать часы.\n\nВыбор есть, но взвешивать его некогда: убавить паруса и переждать бурю там, где стоят корабли, или бежать перед ней во тьму, надеясь, что корпуса выдержат."
 pacific_crossing_events.11.desc: "Корабли закладывали в спешке на новых верфях тихоокеанского побережья Америки, из древесины, которая не успела просохнуть, и строили их корабелы, никогда прежде не строившие судов для такого океана. Теперь море взыскивает долг. В средней части корпуса доска отходит от шва, конопатка расползается, внизу люди стоят в прибывающей воде, а помпы день и ночь лязгают, не одолевая её. Лицо плотника говорит само за себя.\n\nТак продолжаться не может, а до ближайшей суши — пол-океана."
 pacific_crossing_events.11.c: "Бросить гибнущее судно, а его команду распределить по остальным кораблям."
 pacific_crossing_events.12.desc: "Всё начинается с дельфинов: огромная стая гонит что-то перед собой прямо к кораблям. А затем кажется, будто вспыхнуло само море: исполинский косяк рыбы выбрасывает на поверхность, и вокруг корпусов на целые акры сверкает и кипит серебро; дельфины кружат, сжимая кольцо, пока за рыбой не становится почти не видно воды.\n\nКоманде не нужен приказ. За борт летят шлюпки, следом — лески и сети, люди перегибаются через планширь и охапками тянут рыбу на палубы, которые вскоре покрываются скользкими грудами улова. После недель сухарей и солонины это пир, нежданная удача и милость — всё сразу."
 pacific_crossing_events.13.desc: "Баталёр приходит к капитану, комкая шляпу в руках. Внизу, в трюме, вскрыли целые ярусы бочек — и всё оказалось испорчено: плохо просоленное мясо, сухари, упакованные сырыми, вода, протухшая в плохо выдержанных бочках. Провизия, в спешке погруженная и закупоренная влажной в портах отправления, сгнила в тропической жаре, и то, что должно было кормить команду неделями, превратилось в зловонную, кишащую червями гниль.\n\nЗдесь нет рынка и нет второго шанса — лишь испорченные припасы и голодные люди."
 pacific_crossing_events.17.desc: "Вести, когда они наконец приходят, обрывочны: имя, дата, последний известный курс. Флот, отплывший на поиски пути домой, так его и не нашёл. Поглотила ли корабли буря, выбросило ли их на какой-то безымянный риф или они просто дрейфовали, пока не кончилась вода, а вместе с ней и люди, — наверняка не скажет уже никто. Океан оставил их себе.\n\nПуть домой по-прежнему не найден. Где-то там ветер всё так же дует не в ту сторону."
 pacific_crossing_events.18.desc: "С людей хватит. Урезанные пайки, бесконечный океан и курс, за который не может поручиться никто, кроме лоцманов, — всё это стёрло в команде последние остатки покорности. На корме собирается кучка матросов, угрюмых и вооружённых, и прямо выдвигает требование: развернуть флот, иначе они развернут его сами. Офицеров мало, а бунтовщиков много, и мушкеты есть не только у одной стороны.\n\nЧто бы ни было решено сейчас, это обойдётся флоту тем, что нелегко будет восполнить."
 pacific_crossing_events.18.desc.last_ship: "С людей хватит. От флота остался лишь один корабль, и на его тесной, зловонной палубе офицеру негде укрыться. Зачинщики все вместе идут на корму и на этот раз не просят — они с ужасающей простотой излагают капитану правду о его положении: нет другого корабля, куда можно бежать, нет морской пехоты, которую можно позвать, а за бортом — сколько угодно океана. Поворачивай домой сейчас, говорят они, — или полетишь за борт.\n\nЛоцманы притихли. Капитан стоит один у борта, за спиной у него море, и он должен дать ответ."
 pacific_crossing_events.18.fight_win_tt: "Бунт подавлен, порядок восстановлен (#G +5#! Боевой дух экипажа)"
 pacific_crossing_events.19.desc.friendly: "Пробиваясь на восток против ветра, флот не может закрепить пройденное расстояние, и наконец над носом снова поднимаются низкие зелёные острова [ShowLocationName('guahan')]. На этот раз проа выходят навстречу без страха — островитяне помнят честный обмен, и среди них есть лица, которые моряки смутно узнают. Над лодками поднимают товары для обмена, люди объясняются жестами, и обещание воды и свежей пищи вполне понятно.\n\nФлоту отчаянно нужно и то и другое. Похоже, давняя добрая память здесь ценится больше любой карты."
 pacific_crossing_events.19.desc.hostile: "Пробиваясь на восток против ветра, флот не может закрепить пройденное расстояние, и наконец над носом снова поднимаются низкие зелёные острова [ShowLocationName('guahan')]. Но проа, что выходят теперь, идут во множестве, и смеха в них не слышно — островитяне не забыли набега и ждали. Вдоль берега щетинятся копья, и стоянка, что прежде щедро давала воду, теперь так просто её не отдаст.\n\nФлоту всё равно нужны вода и пища, и люди знают, что брать их придётся у народа, который к этому готов."
 pacific_crossing_events.20.desc: "Из бескрайнего южного моря поднимается ещё один остров — крутой, зелёный, опоясанный рифом. Этот обитаем: над деревьями поднимается дым, а с берега уже отчаливают каноэ, полные людей с раскрашенными телами и копьями в руках; над водой разносится стена звука — то ли приветствие, то ли предупреждение. Никто на борту не может сказать, что именно.\n\nЛоцманы никогда не наносили это место на карты и не знают, что за народ им владеет. Но бочки с водой почти пусты, люди голодны, а обитаемый остров — это пища, если её удастся добыть. Накормит ли этот берег флот или обернётся против него, зависит от того, как будет разыгран следующий час."
 pacific_crossing_events.20.b: "Подойти и торговать — показать им [ShowGoodsNameWithNoTooltip('iron')] и [ShowGoodsNameWithNoTooltip('cloth')] и надеяться на лучшее."
 pacific_crossing_events.21.desc: "Неделю за неделей флот с трудом продвигается на восток, и неделю за неделей море отнимает всё, что нам удалось отвоевать. Пассат не слабеет и не меняет направления: он стеной стоит прямо по носу, а течение внизу идёт туда же, унося корабли на запад ночью быстрее, чем они продвигаются на восток днём. Лоцманы берут высоту светил, сверяют расчёты и умолкают: линия на карте перестала двигаться вперёд и поползла назад.\n\nС этим не поспоришь — это не переход, а беличье колесо, и каждый день на нём впустую стоит воды и жизней. Остаётся лишь горький путь: развернуться, бежать по ветру, что одолел их, и вести флот обратно к Островам Пряностей, чтобы всё обдумать заново."
 pacific_crossing_events.22.desc: "С каждым днём припасы тают быстрее, чем прибавляются пройденные мили. Воды мало, и она протухла, сухари обратились в труху, а список больных каждое утро становится длиннее. На корму приходит делегация бывалых матросов — не бунт, пока ещё нет, но с бесстрастной убеждённостью людей, умеющих считать бочки. Они подсчитали всё плавание, и итог не в их пользу. Поворачивайте назад, говорят они, пока в трюме ещё хватит припасов, чтобы добраться до знакомого берега. Если идти дальше, флот найдёт свою могилу в этом океане.\n\nВ их словах есть логика, как бы неприятно её ни было слышать."
 pacific_crossing_events.23.desc: "Спор, начавшийся в тот день, когда петицию отклонили, так по-настоящему и не утих, а сегодня дошёл до драки. Боцман, преданный делу экспедиции, обменивается оскорблениями с кучкой матросов, всё ещё не простивших отказа повернуть назад; от оскорблений переходят к толчкам, от толчков — к потасовке, которая быстро охватывает палубу, и уже не один клинок обнажён.\n\nКогда на место прибывает [target_leader.GetName], вахта уже вовсю дерётся из-за ссоры, в которой дело никогда не было в боцмане."
 pacific_crossing_events.24.desc: "С кормы доносится крик: горит один из кораблей флота. Очередная драка из-за курса домой опрокинула в суматохе фонарь, и пламя уже взбегает по такелажу быстрее, чем успевают наполнять вёдра. Ветер несёт искры к остальным кораблям.\n\nНужно быстро решить, что прикажет [target_leader.GetName]: сблизиться и помочь тушить пожар или держаться в стороне и предоставить горящий корабль его судьбе."
 pacific_crossing_events.25.desc: "С одного из кораблей поступает сигнал, и [target_leader.GetName] узнаёт новость: команда там восстала против своих офицеров — всё тот же спор о возвращении перерос в открытый бунт. Верные люди забаррикадировались внизу, пока мятежники спорят, что делать дальше. Времени решить, вмешиваться ли, почти нет.\n\nСпущенная сейчас шлюпка ещё может склонить чашу весов на борту того корабля — или просто вручить мятежникам вторую добычу."
 pacific_crossing_events.26.desc: "Делегация вернулась — на этот раз сдержаннее, но не менее решительно настроенная. Матросы не угрожают и не повышают голоса, а просто излагают тот же расчёт, что и прежде, — лишь чуть более мрачный из-за дней, прошедших с последнего отказа. Несколько небольших уступок могли бы купить немного мира на нижней палубе, если на них согласится [target_leader.GetName].\n\nА можно ответить так же, как в прошлый раз, и отправить петицию обратно вниз ни с чем."
 pacific_crossing_events.27.desc: "Ночью кто-то побывал у припасов: бочка с водой пробита, бухта снастей перерезана наполовину. Мелочи, но сделанные с явным умыслом. Тот, кто хочет повернуть экспедицию назад, решил, что слов больше недостаточно. [target_leader.GetName] может приказать как следует поискать виновного — или просто удвоить вахты и продолжить путь, так его и не найдя.\n\nТак или иначе, послание получено."
