l_russian:
 lon_principado_de_asturias: "Княжество Астурийское"
 lon_principado_de_asturias_desc: "Княжество Астурийское — официальный титул, который получает наследник престола. Он обязывает знать признавать законный порядок наследования и наделяет наследника символической властью старейшего христианского королевства страны."
