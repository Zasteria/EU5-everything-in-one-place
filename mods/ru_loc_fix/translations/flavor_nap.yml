 flavor_nap.12.title: "#italic Государство Президий#!"
 flavor_nap.401.historical_info: "Восстание Томмазо Аньелло 1647 года было недолгим, но успешным выступлением простонародья против власти ненавистного герцога Аркоса. Итогом восстания стало провозглашение недолговечной Неаполитанской республики."
