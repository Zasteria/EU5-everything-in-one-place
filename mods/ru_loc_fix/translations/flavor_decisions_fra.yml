l_russian:
 fra_fouage_tax_decision.a.entry: "Введём подать в пользу сословия «$crown_estate$»."
 fra_fouage_tax_decision.c.entry: "Государство не станет оплачивать роскошь правителя."
 fra_code_louis_decision.b.entry: "Пока что введём кодекс лишь в северных провинциях — остальная $FRA$ подождёт."
 fra_versailles_residence_decision.b.entry: "Дворец строили для услады королевской семьи — пусть так и остаётся."
 fra_versailles_permanent_decision.a.entry: "$nobles_estate$ навсегда померкли в блеске Версаля."
 fra_versailles_permanent_decision.b.entry: "$nobles_estate$ исстари обладают властью, и с этим по-прежнему нужно считаться."
 fra_marcel_great_ordinance_decision.desc.entry: "Генеральные штаты зашли в тупик в спорах о том, как оплатить наши нынешние войны. Третье сословие во главе с влиятельными купцами предложило «Великий ордонанс»: свою поддержку оно готово обменять на новые привилегии и полномочия для себя. Мы можем принять это предложение или же найти иной способ добиться денег от Генеральных штатов."
