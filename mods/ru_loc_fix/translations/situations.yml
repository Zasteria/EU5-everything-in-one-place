 council_of_trent_council_adjourned: "Собор расходится"
 rise_of_the_ottomans_beylik_ascendant: "Один из бейликов возвышается"
 rise_of_the_ottomans_beylik_ascendant_desc: "Господствующий бейлик получает доступ к государственным принципам державы османского образца и к политике «[ShowPolicyName('eyalet_division')]»."
 rise_of_the_ottomans_beyliks_extinguished: "Бейлики угасли"
 rise_of_the_ottomans_beyliks_extinguished_desc: "Каждый уцелевший бейлик, у которого ещё есть принцип «[ShowGovernmentReformName('legacy_of_osman')]», лишается его, а вместе с ним и полученной благодаря ему [Concept('government_power', 'власти правительства')|e]."
 rise_of_the_ottomans_anatolia_fragmented: "[ShowRegionNameWithNoTooltip('anatolia_region')] остаётся раздробленной"
 rise_of_the_ottomans_anatolia_fragmented_desc: "Каждый уцелевший бейлик, у которого ещё есть принцип «[ShowGovernmentReformName('legacy_of_osman')]», лишается его, а вместе с ним и полученной благодаря ему [Concept('government_power', 'власти правительства')|e]."
 rise_of_the_ottomans_era_closes: "Эпоха бейликов завершается"
 rise_of_the_ottomans_era_closes_desc: "Каждый уцелевший бейлик, у которого ещё есть принцип «[ShowGovernmentReformName('legacy_of_osman')]», лишается его, а вместе с ним и полученной благодаря ему [Concept('government_power', 'власти правительства')|e]."
 rise_of_timur_empire_forged: "Выкована империя"
 rise_of_timur_timurids_subjugated: "[GetCountry('TIM').GetNameWithNoTooltip] покорены"
 rise_of_timur_conquests_stall: "Завоевания остановились"
 rise_of_timur_conquests_stall_desc: "[GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.GetName] лишается бонуса к походам, а все ещё не исполненные завоевательные претензии к державе [GetCountry('TIM').GetName] утрачивают силу, если только [GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.GetNameWithNoTooltip] и его потомки не обрели прочный императорский титул."
 HYW_STALEMATE: "Тупик"
 hyw_france_recently_received_demand_tt: "Последние #Y 6#! мес. ни один [Concept('subject', 'ленник')|e] не предъявлял требований державе [GetCountry('FRA').GetName]"
 nanbokuchou_northern_court_holds_throne_tt: "[GetCountry('NTC').GetName] обладает [Concept('special_status', 'особым статусом')|e] «[ShowSpecialStatusName('japanese_emperor')]»"
 nanbokuchou_southern_court_holds_throne_tt: "[GetCountry('STC').GetName] обладает [Concept('special_status', 'особым статусом')|e] «[ShowSpecialStatusName('japanese_emperor')]»"
 nanbokuchou_northern_court_prevails: "[GetCountry('NTC').GetNameWithNoTooltip] одерживает верх"
 nanbokuchou_northern_court_prevails_desc: "[GetCountry('NTC').GetName] переносит столицу в [ShowLocationName('kyoto')], помещает там три священные регалии и строит или улучшает [ShowBuildingTypeName('gosho')], а если владеет императорским титулом или сёгунатом — получает долговременную прибавку к [Concept('government_power', 'власти правительства')|e] и [Concept('prestige', 'престижу')|e]."
 nanbokuchou_southern_court_prevails: "[GetCountry('STC').GetNameWithNoTooltip] одерживает верх"
 nanbokuchou_southern_court_prevails_desc: "[GetCountry('STC').GetName] переносит столицу в [ShowLocationName('kyoto')], помещает там три священные регалии и строит или улучшает [ShowBuildingTypeName('gosho')], а если владеет императорским титулом или сёгунатом — получает долговременную прибавку к [Concept('government_power', 'власти правительства')|e] и [Concept('prestige', 'престижу')|e]."
 nanbokuchou_imperial_reunification: "Императорский род воссоединяется"
 nanbokuchou_imperial_reunification_desc: "Один двор присоединяет другой под властью их общего правителя и образует воссоединённую державу [ShowFormableCountryName('YMT_f')], переносит столицу в [ShowLocationName('kyoto')] и помещает там три священные регалии."
 nanbokuchou_imperial_line_broken: "Императорский род пресёкся"
 nanbokuchou_imperial_line_broken_desc: "Ни одному двору не удаётся утвердиться на престоле: столица остаётся на прежнем месте, священные регалии не собраны воедино, а императорское престолонаследие просто прерывается."
 sengoku_shogunate_dissolved: "[GetUniqueInternationalOrganization('japanese_shogunate').GetNameWithNoTooltip] распадается"
 sengoku_shogunate_dissolved_desc: "Сёгуната больше нет, и образовать державу [ShowFormableCountryName('JAP_f')] предстоит сильнейшему из уцелевших даймё, а не роду свергнутого сёгуна."
 sengoku_sole_clan_remains: "Остался единственный клан"
 sengoku_sole_clan_remains_desc: "Последний уцелевший клан образует державу [ShowFormableCountryName('JAP_f')], а сам сёгунат распускается в миг своей безоговорочной победы."
 sengoku_shogun_and_emperor_remain: "Остались лишь [GetUniqueInternationalOrganization('japanese_shogunate').GetLeaderTitle] и [ShowSpecialStatusNameWithNoTooltip('japanese_emperor')]"
 sengoku_shogun_and_emperor_remain_desc: "Сёгунат образует державу [ShowFormableCountryName('JAP_f')] и распускает сам себя, а последнее императорское здание «[ShowBuildingTypeName('gosho')]» сносится вместе с ним."
 sengoku_clans_reined_in: "Кланы обузданы"
 sengoku_clans_reined_in_desc: "Глава сёгуната образует державу [ShowFormableCountryName('JAP_f')], а сам сёгунат продолжает существовать наряду с прочими усмирёнными кланами."
 fall_of_delhi_sultanate_destroyed: "[GetCountry('DLH').GetFlavorRank|U] уничтожен"
 fall_of_delhi_sultanate_destroyed_desc: "Каждый претендент на престол Дели получает модификатор «[ShowModifier('dlh_heirs_of_delhi_modifier')]», а для сильнейшего из них срок его действия удваивается."
 fall_of_delhi_territories_ceded: "Земли уступлены"
 fall_of_delhi_territories_ceded_desc: "[GetCountry('DLH').GetName] избавляется от модификатора «[ShowModifier('dlh_outside_interference_modifier')]», но платит за уступки тяжёлым ударом по [Concept('government_power', 'власти правительства')|e], который лишь отчасти смягчает небольшой прирост [Concept('stability', 'стабильности')|e]."
 fall_of_delhi_sultanate_dissolves: "[GetCountry('DLH').GetFlavorRank|U] распадается"
 fall_of_delhi_sultanate_dissolves_desc: "[GetCountry('DLH').GetName] избавляется от модификатора «[ShowModifier('dlh_outside_interference_modifier')]», но платит за распад тяжёлым ударом по [Concept('government_power', 'власти правительства')|e], который лишь отчасти смягчает небольшой прирост [Concept('stability', 'стабильности')|e]."
 fall_of_delhi_sultanate_consolidates: "[GetCountry('DLH').GetNameWithNoTooltip] укрепляет свою власть"
 fall_of_delhi_sultanate_consolidates_desc: "[GetCountry('DLH').Custom('GetRulerOrRegentTitle')|U] прочно удерживает власть: [GetCountry('DLH').GetName] получает крупную долговременную прибавку и к [Concept('stability', 'стабильности')|e], и к [Concept('government_power', 'власти правительства')|e]."
 fall_of_delhi_opposition_prevails: "Оппозиция одерживает верх"
 fall_of_delhi_opposition_prevails_desc: "Кризис миновал: [GetCountry('DLH').GetName] получает крупную долговременную прибавку и к [Concept('stability', 'стабильности')|e], и к [Concept('government_power', 'власти правительства')|e]."
 red_turban_rebellions_rebel_mandate: "Повстанцы обретают Небесный мандат"
 red_turban_rebellions_rebel_mandate_desc: "Вождь повстанцев сразу же образует державу [ShowFormableCountryName('CHI_f')]; если прежняя династия ещё держится, её держава лишается своего места и получает название [ShowFormableCountryName('YUA_f')]."
 red_turban_rebellions_yuan_restored: "Династия Юань устояла"
 red_turban_rebellions_yuan_restored_desc: "[GetCountry('CHI').GetName] подавляет восстание, восстанавливает [GetUniqueInternationalOrganization('middle_kingdom').GetName] и присоединяет все мятежные земли, чья верность не пошатнулась."
 red_turban_rebellions_dynastic_interregnum: "Начинается междуцарствие"
 red_turban_rebellions_dynastic_interregnum_desc: "Учреждения восставших упраздняются. Если [GetUniqueInternationalOrganization('middle_kingdom').GetName] тоже пало, на его месте новый Китай образует тот из претендентов, чьё положение выгоднее всего."
 italian_wars_italian_league_triumph: "Итальянская лига торжествует"
 italian_wars_italian_league_triumph_desc: "Глава победившей лиги получает [Concept('prestige', 'престиж')|e] и [Concept('stability', 'стабильность')|e], открывает новый административный закон и может силой или договором добиться верности её участников. Все соперничающие итальянские и иноземные лиги расплачиваются за это своим положением."
 italian_wars_foreign_league_triumph: "Иноземная лига торжествует"
 italian_wars_foreign_league_triumph_desc: "Глава победившей коалиции получает [Concept('prestige', 'престиж')|e] и долговременную награду за победу, а её участники сближаются друг с другом. Все итальянские и соперничающие иноземные лиги расплачиваются за это своим положением."
 italian_wars_exhausted_peninsula: "Полуостров истощён"
 italian_wars_exhausted_peninsula_desc: "Все здания «[ShowBuildingTypeName('italian_administration_center')]» обращаются в руины, а главы иноземных лиг получают тяжёлый удар по [Concept('government_power', 'власти правительства')|e]."
 foreign_league_balkan_200_tt: "[GetUniqueInternationalOrganization('foreign_league_balkan').GetName] владеет не менее чем #Y 200#! [Concept('locations', 'районами')|e] в регионе [ShowRegionName('italy_region')]"
 guelphs_and_ghibellines_guelph_triumph: "[GetUniqueInternationalOrganization('guelphs_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_guelph_triumph_desc: "[GetUniqueInternationalOrganization('hre').GetName]: [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|E] и все итальянские участники покидают империю вместе со своими районами."
 guelphs_and_ghibellines_ghibelline_triumph: "[GetUniqueInternationalOrganization('ghibellines_io').GetNameWithNoTooltip] торжествуют"
 guelphs_and_ghibellines_ghibelline_triumph_desc: "[GetUniqueInternationalOrganization('hre').GetName] вбирает в себя все подходящие итальянские державы вместе с их районами."
 guelphs_and_ghibellines_factional_deadlock: "Тупик в борьбе фракций"
 guelphs_and_ghibellines_factional_deadlock_desc: "Обе фракции немного теряют в [Concept('prestige', 'престиже')|e] и [Concept('government_power', 'власти правительства')|e], а если [GetUniqueInternationalOrganization('hre').GetName] ещё существует, итальянские участники фракции гвельфов покидают её."
 the_revolution_revolutionary_wave_spent: "Революционный пыл угасает"
 golden_age_of_piracy_brethren_crushed: "Пиратское братство разгромлено"
 golden_age_of_piracy_era_ends: "Золотой век угасает"
 golden_age_of_piracy_era_ends_desc: "Если независимая пиратская держава всё ещё располагает сильнейшим флотом среди своих собратьев, она получает модификатор «[ShowModifier('great_pirate_state_modifier')]», а её правитель остаётся в памяти как выдающийся администратор, дипломат и полководец."
 war_of_religions_religious_supremacy_imposed: "Религиозное господство установлено"
 war_of_religions_religious_supremacy_imposed_desc: "Побеждённая сторона получает тяжёлый удар по [Concept('stability', 'стабильности')|e] и резко смещается к ценности «[ShowSocietyDirectionName('aristocracy')]», а [GetUniqueInternationalOrganization('hre').GetName] делает веру победителя своей имперской религиозной политикой."
 war_of_religions_peace_of_westphalia: "Вестфальский мир"
 war_of_religions_peace_of_westphalia_desc: "Война заканчивается без победителя: [GetUniqueInternationalOrganization('hre').GetName] получает долговременный удар по имперской власти и принимает политику, признающую законными все христианские вероисповедания в своих границах."
 war_of_religions_confessional_exhaustion: "Наступает конфессиональное истощение"
 colonial_revolution_never_ends: "Конца не видно"
 colonial_revolution_never_ends_tt: "У этой [Concept('situation', 'ситуации')|e] нет даты окончания"
 little_ice_age_climate_recovers: "Долгая зима заканчивается"
