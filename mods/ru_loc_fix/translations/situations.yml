 great_pestilence_disease_exhausted: "Мор отступает"
 great_pestilence_disease_exhausted_desc: "Модификаторы, оставленные мором, снимаются со всех земель, которых он коснулся, а уцелевшие после него ещё сильнее склоняются к ценности «[ShowSocietyDirectionName('spiritualist')]»."
 columbian_exchange_exchange_complete: "Обмен продолжается"
 council_of_trent_church_dissolved: "[GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip] распадается"
