l_russian:
 hajj_caravan_events.13.c: "Пусть [toll_owner.GetGovernment.GetRulerTitle] взглянет на наш караван и пересмотрит пошлину."
 hajj_caravan_events.17.desc: "Небо чернеет, и море вздымается серыми водяными холмами. Корабль швыряет, снасти визжат, и одна неверно встреченная волна может проломить корпус или утянуть судно на дно со всеми, кто на борту."
 hajj_caravan_events.22.desc: "Нас окликает торговое судно, его палубы заставлены рулонами шёлка и тонких тканей из далёких портов. Капитан готов торговать по купеческой цене — но лишь после неспешного купеческого торга."
 hajj_caravan_events.20.title: "Корсары"
 hajj_caravan_events.20.b.chance_tt: "Наш вооружённый конвой может не отбиться от корсаров, и тогда вместо [Concept('prestige', 'престижа')|e] мы потеряем часть конвоя и роскоши"
