l_russian:
 hajj_caravan_events.1.title: "Путь в святой город [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.1.b: "Снарядить караван и набрать охрану в дорогу."
 hajj_caravan_events.1.c: "Снабдить и защитить караван, а впереди нести #italic махмаль#!."
 hajj_caravan_events.guards_up_tt: "Охрана каравана усиливается (#G +25#! к охранному конвою)"
 hajj_caravan_events.3.a: "Щедро раздавать золото. Пусть ни один паломник здесь не останется голодным."
 hajj_caravan_events.3.d: "Наш [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] уже обо всём позаботился."
 hajj_caravan_events.3.e: "Не жалеть затрат. Украсить караван золотом и шёлком."
 hajj_caravan_events.7.a: "Да будет известно: путь в город [ShowLocationNameWithNoTooltip('mecca')] и обратно пройден, ибо так пожелал [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.7.historical_info: "Аския Мухаммед Туре из Сонгайской империи совершил хадж в 1496–1497 годах со свитой в несколько сотен человек и целым состоянием в золоте, которое раздавал в пути как милостыню. В Каире аббасидский претендент на халифат пожаловал ему титул халифа Судана, и он вернулся домой как аль-Хадж: паломничество утвердило его власть над исламом Западной Африки."
 hajj_caravan_events.8.title: "Смерть на пути в город [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.adorn: "Украсить караван знамёнами и шёлком, а затем ждать."
 hajj_caravan_events.9.c: "Это паломники, идущие в город [ShowLocationNameWithNoTooltip('mecca')], и их хранит [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.10.desc: "Колодцы впереди пусты — на дне лишь растрескавшаяся грязь: их до последней капли вычерпал какой-то караван, прошедший здесь несколько дней назад. Бурдюки на боках верблюдов уже полегчали, животные ревут от жажды, а солнце поднимается всё выше, не зная пощады. Проводники принимаются ворчать о том, как далеко до следующей хорошей воды."
 hajj_caravan_events.12.desc: "Всё начинается с нескольких случаев, но к утру болезнь уже в каждом шатре: лихорадка, что за считаные дни иссушает даже самых крепких. В дорожной тесноте паломникам никак её не избежать."
 hajj_caravan_events.13.title: "Цену назначает [toll_owner.GetGovernment.GetRulerTitle]"
 hajj_caravan_events.13.c: "Пусть [toll_owner.GetGovernment.GetRulerTitle] взглянет на наш караван и пересмотрит пошлину."
 hajj_caravan_events.17.desc: "Небо чернеет, и море вздымается серыми водяными холмами. Корабль швыряет, снасти визжат, и одна неверно встреченная волна может проломить корпус или утянуть судно на дно со всеми, кто на борту."
 hajj_caravan_events.22.desc: "Нас окликает торговое судно, его палубы заставлены рулонами шёлка и тонких тканей из далёких портов. Капитан готов торговать по купеческой цене — но лишь после неспешного купеческого торга."
