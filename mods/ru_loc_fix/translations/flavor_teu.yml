l_russian:
 flavor_swe_teu.1.victual_brother_info: "Испокон веков пираты чувствуют себя как дома в Балтийском море. Многие моряки и рыбаки из района [target_location.GetName] стремятся встать на путь пиратства и беззакония. Среди них — [target_character.GetName] и его шайка так называемых «равнодольщиков»: теперь они бороздят наши моря под чёрным флагом и стремятся нажить себе состояние, грабя всех несчастных, кому не повезёт с ними повстречаться. Часть этих разбойников, известных как «Виталийские братья», захватила остров [ShowProvinceDefinitionName('gotland_province')] и учредила свою столицу в [ShowLocationName('visby')]. Их бесчинства привели к упадку торговли в этих краях, и если пиратство не прекратится, наша торговля в конце концов окончательно сойдёт на нет."
