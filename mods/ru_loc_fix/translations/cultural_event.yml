l_russian:
 cultural_event.15.title: "Единый [new_merged_culture.GetName]ий народ"
 cultural_event.15.desc: "Держава [unifying_country.GetLongName] сплотила народы [merged_group.GetName]ой группы в единый [new_merged_culture.GetName]ий народ, и теперь её посланники стоят перед нами. Они призывают нас отбросить былые распри и принять [new_merged_culture.GetName]ое имя, чтобы мы разделили с ними один народ и одну судьбу. Отречься от того, кем были наши предки, — дело нешуточное."
 cultural_event.15.a: "Наш народ станет [new_merged_culture.GetName]им."
 cultural_event.15.b: "Мы останемся теми, кем были всегда."
