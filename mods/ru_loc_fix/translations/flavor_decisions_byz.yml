l_russian:
 byz_army_reform_decision.title: "Реформа [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой армии"
 byz_army_reform_decision.title.entry: "Реформа византийской армии"
 byz_army_reform_decision.desc: "Если раньше наша армия одерживала победы благодаря фемам и многочисленным ополчениям, которые они предоставляли, то рост благосостояния и централизация государств привели к тому, что военная служба стала постоянной профессией. [target_character.GetName] и [target_character.GetHerHis] совет усердно трудятся над новым устройством армии, которое будет меньше зависеть от войск, выставляемых сословием [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]."
 byz_army_reform_decision.a: "Армия будет служить лишь одному человеку — [target_character.GetNameWithNoTooltip]."
 byz_army_reform_decision.a.entry: "Армия будет служить государю"
 byz_army_reform_decision.b: "Не будем умалять роль сословия [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 byz_army_reform_decision.b.entry: "Не будем умалять роль сословия $nobles_estate$."
