l_russian:
 kings_manor_cannot_destroy_tt: "Совет Севера ещё не учреждён"
 cas_royal_mint_of_segovia_desc: "Чтобы обновить монетную систему и сосредоточить управление ею в руках короны, мы учредили королевский монетный двор для всей державы. Он позволяет нам напрямую контролировать чеканку монеты, бороться с подделками и укреплять власть над хозяйством страны.\n\nПока монетный двор стоит в Сеговии, его владелец получает следующие преимущества:\n[ShowAutoModifierEffect('cas_royal_mint_of_segovia_modifier')]"
 lieutenancy_tt: "В державе [SCOPE.sCountry('actor').GetNameWithNoTooltip] число сооружений «[ShowBuildingTypeName('lieutenancy')]» меньше [SCOPE.sCountry('actor').GetModifierValue('num_lieutenancy')] либо суммарное число сооружений «[ShowBuildingTypeName('local_governor')]», «[ShowBuildingTypeName('itinerant_court_seat')]», «[ShowBuildingTypeName('kings_manor')]» и сооружений «[ShowBuildingTypeName('lieutenancy')]» сверх этого лимита меньше [SCOPE.sCountry('actor').GetModifierValue('num_local_governors')]. Сейчас домов губернаторов — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('local_governor')|V], лейтенантств — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('lieutenancy')|V], резиденций странствующего двора — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('itinerant_court_seat')|V], королевских поместий — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('kings_manor')|V]."
 local_governor_tt: "В державе [SCOPE.sCountry('actor').GetNameWithNoTooltip] суммарное число сооружений «[ShowBuildingTypeName('local_governor')]», «[ShowBuildingTypeName('itinerant_court_seat')]», «[ShowBuildingTypeName('kings_manor')]» и сооружений «[ShowBuildingTypeName('lieutenancy')]» сверх отдельной квоты [SCOPE.sCountry('actor').GetModifierValue('num_lieutenancy')] меньше [SCOPE.sCountry('actor').GetModifierValue('num_local_governors')]. Сейчас домов губернаторов — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('local_governor')|V], резиденций странствующего двора — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('itinerant_court_seat')|V], королевских поместий — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('kings_manor')|V], лейтенантств — [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('lieutenancy')|V]."
