l_russian:
 flavor_por.67.title: "В неизвестность"
 flavor_por.67.desc: "Моря за нашими берегами по-прежнему окутаны тайной, но купцы и путешественники рассказывают о далёких рынках, ломящихся от немыслимых богатств. Другие толкуют о могучем царстве пресвитера Иоанна, который, как говорят, основал свою державу где-то далеко в Индиях. Если бы нам только удалось отыскать морской путь в те земли за океаном, [ROOT.GetCountry.GetName] смогла бы напрямую прикоснуться к богатствам, которыми славится $india$ и лежащие за ней земли, и, быть может, даже объединить силы со сказочным царством пресвитера Иоанна."
 flavor_por.73.title: "Бразильская золотая лихорадка"
 flavor_por.73.desc: "Минули годы с тех пор, как мы впервые обнаружили драгоценные металлы в регионе [ShowRegionName('brazil_region')], и за это время наши #italic бандейранты#! открыли обширные залежи, что манят людей из дальних краёв. Искатели удачи и работники в небывалых количествах стекаются теперь в регион [ShowRegionNameWithNoTooltip('brazil_region')], и по мере того как [ROOT.GetCountry.GetName] получает всё больше золота, наша казна наполняется сверх всякого прежнего воображения."
 flavor_por.74.desc: "[ROOT.GetCountry.GetAdjective]ое влияние в регионе растёт: экспедиции наших #italic бандейрантов#! продолжают покорять внутренние земли региона [ShowRegionName('brazil_region')]. Недавно одна из таких экспедиций нанесла на карту прежде неведомые земли области [target_area.GetName]; [Select_CString(target_character.IsFemale, 'вела', 'вёл')] её [target_character.GetName]. Теперь [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'готова', 'готов')] поделиться с сословием «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» знаниями, которые [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'обрела', 'обрёл')] в том походе, если мы поддержим будущие экспедиции."
 flavor_por.74.historical_info: "Антониу Рапозу Таварес был одним из самых значительных #italic бандейрантов#!, исследовавших внутренние области Бразилии. Хотя его экспедиции повинны и в разорении иезуитских миссий, и в порабощении тысяч коренных жителей, походы Рапозу Тавареса значительно расширили португальское влияние за пределы, установленные Тордесильясским договором."
 flavor_por.75.desc: "Растущая потребность в рабочих руках в наших колониальных владениях толкнула многих #italic бандейрантов#! на набеги за рабами среди местных жителей. Теперь снаряжаются экспедиции, которые уходят далеко вглубь материка, чтобы захватывать коренных жителей и отправлять их на работу в рудники."
 flavor_por.75.historical_info: "Поначалу #italic бандейранты#! были исследователями и первопроходцами, но со временем их экспедиции всё чаще превращались в набеги ради захвата коренных жителей в рабство. На протяжении всего XVII века набеги на общины коренных народов и иезуитские миссии стали отличительной чертой многих #italic бандейр#, поставлявших подневольный труд для плантаций, поселений, а затем и для стремительно растущей горнодобывающей промышленности."
 flavor_por.76.historical_info: "Фернан Диаш, прозванный Охотником за изумрудами, был одним из самых прославленных #italic бандейрантов#!. Он известен семилетней экспедицией в неизведанные земли за Минас-Жерайсом на поиски легендарных изумрудов Сабарабусу — сказочного горного хребта, в недрах которого, как считалось, таились несметные богатства. Хотя своей изначальной цели экспедиция так и не достигла, Диаш подробно нанёс на карту неизведанные области, основал новые поселения и помог проложить пути, которые в конце концов привели к открытию богатейших золотых месторождений в глубине Бразилии."
 flavor_por.77.title_success: "Охотник за изумрудами"
 flavor_por.81.desc: "Недавно на суд представили несколько работ, автор которых — [target_artist.GetName], и [ROOT.GetCountry.GetGovernment.GetCourtTitle] высоко ценит [target_artist.GetHimHer] мастерство. При дворе теперь советуют сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подумать о том, чтобы нанять [target_artist.GetHimHer] для создания новых произведений во славу державы [ROOT.GetCountry.GetName]."
 flavor_por.81.a: "Посмотрим, на что [target_artist.GetSheHe] [Select_CString(target_artist.IsFemale, 'способна', 'способен')]!"
 flavor_por.81.b: "Не будем стеснять [target_artist.GetHimHer]: пусть работает самостоятельно."
