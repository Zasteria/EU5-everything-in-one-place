l_russian:
 flavor_por.17.desc: "Отсутствие живого наследника мужского пола ставит будущее нашей державы ([ROOT.GetCountry.GetFlavorRank]) под угрозу иностранного вмешательства. [ROOT.GetCountry.Custom('GetFlavorPor17SuccessionConcern')]\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] предлагают изменить закон о престолонаследии и лишить [heir.GetName] права на корону. Они сошлись на том, что если [ROOT.GetCountry.GetGovernment.GetRulerTitle] так и не обзаведётся сыном, [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] место должен занять незаконнорождённый сводный брат, дворянин [john_avis.GetName]."
 flavor_por.19.title: "[target_character.GetNameWithNoTooltip]"
 flavor_por.19.desc: "Влияние сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]» угасает: у него мало поддержки при дворе ([ROOT.GetCountry.GetGovernment.GetCourtTitle]) и ни одной должности в совете ([ROOT.GetCountry.GetGovernment.GetCabinetTitle]). Наши шпионы сообщают, что дерзкий смутьян по имени [target_character.GetName] ищет сторонников, чтобы свергнуть правителя по имени [ROOT.GetCountry.GetGovernment.GetRuler.GetName], а взамен вернуть сословию «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» прежнюю власть и привилегии."
 flavor_por.50.desc: "Поколениями наша корона притягивала к себе рыцарские ордена: их командорства опирались на нашу благосклонность, их магистры держали ответ перед нами. Теперь [GetCountry('PAP').GetGovernment.GetRulerTitle] торжественной буллой подтверждает то, что мы уже сделали явью: вечная власть над Орденом Христа и родственными ему орденами переходит к короне, а [target_character.GetName] и преемники становятся их верховными управляющими."
