l_russian:
 grand_tour_events.opportunity_accept: "Принять предложение."
 grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в сборе, сундуки уложены, на дороге, ведущей на юг, выстраивается эскорт. Впереди ждёт [ShowRegionName('italy_region')] — край древних руин, учёности, которую принесло [ShowInstitutionName('renaissance')], и дворов, чьё политическое искусство заставляет север казаться юнцом. Всё, чему наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] научится там, определит судьбу державы на целое поколение. Остаётся лишь решить, чему именно мы намерены [target_leader.GetHerHim] научить."
 grand_tour_events.1.a: "Тамошние дворы научат [target_leader.GetHerHim] тому, чему не научат книги."
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ [ShowBuildingTypeName('venetian_arsenal')], раскинувшийся в восточной части города, способен за один рабочий день заложить киль боевого корабля и спустить его на воду полностью готовым. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Восточную часть города занимают обычные верфи, где без спешки, привычной для всех портов, какими славится [ShowContinentNameWithNoTooltip('europe')], строят торговые суда и боевые галеры. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.historical_info: "На Вознесенской неделе 1645 года английский джентльмен Джон Ивлин, совершавший тогда собственное долгое путешествие по Франции и Италии, побывал в одном из публичных театров Венеции на опере #italic «Эрколе в Лидии»#!. В дневнике он восхищается декорациями, сменявшимися тринадцать раз, и особо выделяет сопрано Анну Ренци, хотя одного певца-кастрата счёл даже превосходящим её, а генуэзского баса назвал «несравненным». Среди расписных перспектив и летающих машин зрелище «держало в плену наши глаза и уши до двух часов ночи». Венецию он покинул следующей весной, увозя сундуки, полные книг, гравюр и банок знаменитого венецианского териака."
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip] — [target_location.GetRank.GetNameWithNoTooltip], где родилось [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.3.desc: "[target_location.GetName] меньше своей славы и куда необычнее. [target_location.GetRank.GetName] гудит от новых идей: философы зовут это возрождением античности, купцы — выгодным делом, живописцы — тем, как свет ложится на штукатурку. Прибыв на место, наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что нынче вечером двор принимает иноземных гостей, если только [target_leader.GetSheHe] не [Select_CString(target_leader.IsFemale, 'слишком утомлена', 'слишком утомлён')] дорогой.\n\nКроме того, есть и отдельное приглашение в монастырскую библиотеку, где тихо дожидается своего часа самое замечательное на всём христианском Западе собрание [ShowCultureName('greek_culture')]их рукописей."
 grand_tour_events.3.historical_info: "Осенью 1764 года больной шотландский романист Тобиас Смоллетт посетил галерею Уффици и, стоя перед Венерой Медицейской, которую все прочие путешественники Гран-тура восхваляли на веру, написал: «Не могу отделаться от мысли, что в чертах Венеры нет никакой красоты, а поза её неуклюжа и неестественна». Позднее Лоренс Стерн увековечил эту вспышку: его вымышленный Йорик у Пантеона в Риме корит «Смельфунгуса» за то, что тот «набросился на богиню и обошёлся с ней хуже, чем с последней уличной девкой, без малейшего к тому повода». Их спор из-за одной мраморной Венеры пережил их обоих."
 grand_tour_events.4.desc: "[target_location.GetName] живёт сразу в двух эпохах. Форум лежит под зимней травой, его колонны торчат под причудливыми углами посреди коровьих пастбищ, а мрамор за минувшую тысячу лет растаскивал всякий подрядчик, которому он был нужен. Надо всем этим возвышается церковь, которой суждено стать престолом всего христианского мира, — сердце, вокруг которого живёт нынешний [target_location.GetRank.GetName].\n\n[target_leader.GetName] волен выбирать: среди руин или среди живых пройдут [target_leader.GetHisHer] дни здесь. Папский двор стар, церемонен и связан с каждым [ShowReligionAdjective('catholic')]им троном, какой только знает [ShowContinentName('europe')]."
 grand_tour_events.4.historical_info: "15 октября 1764 года английский джентльмен Эдвард Гиббон, завершавший тогда собственный Гран-тур по Италии, сидел в раздумьях среди руин на Капитолийском холме, пока босоногие монахи пели вечерню в здании, которое он принял за древний храм Юпитера. Позднее он писал в мемуарах, что именно там, среди обломков колонн и затихающего вечернего пения, «мне впервые пришла мысль написать об упадке и разрушении города». Замысел, рождённый одним римским вечером, за следующие двадцать лет занятий в Англии вырос в #italic «Историю упадка и разрушения Римской империи»#!."
 grand_tour_events.5.desc: "[target_location.GetName] — самая южная точка путешествия и древнейший из великих [ShowCultureGroupName('italian_group')]их дворов: [target_location.GetRank.GetName] с миллионом душ, раскинувшийся в тени Везувия. Его история ложилась слоями — [ShowCultureName('greek_culture')]ий пласт под [ShowCultureName('roman_culture')]им, затем [ShowCultureName('norman')]ий и пласты ещё более поздних хозяев, — и каждое завоевание видно в зодчестве, если знать, куда смотреть. [target_country.GetGovernment.GetAdjective]ий [target_country.GetGovernment.GetCourtTitle] принимает гостей с такой церемонностью, что северные дворы, которых немало знает [ShowContinentName('europe')], кажутся рядом с ним наспех устроенными.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] уже побывал в трёх городах: [ShowLocationName('venice')], [ShowLocationName('florence')], [ShowLocationName('rome')]. Это последний урок."
 grand_tour_events.5.historical_info: "В январе 1786 года Эстер Пиоцци поднялась на Везувий, привязанная верёвкой к своему проводнику Бартоломео — «Циклопу Везувия», — и остановилась передохнуть у кельи отшельника на полпути к вершине. Отшельник, француз, вдруг узнал её: «Мадам, не видел ли я вас прежде? Ну конечно, видел — и даже причёсывал, когда был цирюльником в Лондоне». Устыдившись, когда узнала, что четырёхлетний мальчик из её спутников уже добрался до края кратера, Пиоцци продолжила путь, чтобы своими глазами увидеть дымящееся жерло, и описала всю эту встречу в опубликованных путевых письмах."
 grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip], город древней арены"
 grand_tour_events.6.desc: "[target_location.GetName] стоит у излучины реки; [target_location.GetRank.GetName] вырос в долгой тени амфитеатра, что старше любого двора, какой знает [ShowRegionName('italy_region')]. Римская арена почти целиком уцелела: её каменные ярусы поднимаются над крышами, здесь проходят рынки и ярмарки, а в редкий праздничный день — нечто почти похожее на игры, ради которых она и строилась.\n\nЕсть здесь и лекционные залы, и руины, и двор, который будет рад принять у себя такого гостя, как наш [ROOT.GetCountry.GetGovernment.GetHeirTitle]."
 grand_tour_events.6.historical_info: "Прибыв в Верону в апреле 1785 года, Эстер Пиоцци почувствовала, как её сердце «ощутимо расширилось» при виде столь хорошо сохранившегося римского амфитеатра, а позже назвала этот город «самым весёлым на вид из всех, где мне доводилось жить». Гид, показывавший ей древности Филармонической академии, уверял, что английские Арунделовы мраморы давно погублены угольным дымом, — пока она не узнала в его словах дословную цитату из путеводителя #italic Verona illustrata#!, который он выучил наизусть. В опубликованном рассказе о путешествии она назвала этот обман «malafede и весьма нелепым предрассудком»."
 grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip], идеальный город"
 grand_tour_events.7.desc: "[target_location.GetName] — не плод случая, и это видно с первого взгляда. Широкие прямые улицы прорезают [target_location.GetRank.GetName] по плану, какого не сложилось бы само собой ни в одном средневековом городке: всё здесь нарочно устроено так, чтобы этим любовались не меньше, чем в этом жили. Герцогский театр, типографии и поэты, подолгу задерживающиеся при дворе, служат одной цели — чтобы этот небольшой [target_location.GetRank.GetNameWithNoTooltip] стал образцом градостроительства будущего.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит двор, который интересуется стихами не меньше, чем искусством управления."
 grand_tour_events.7.historical_info: "В апреле 1817 года лорд Байрон, путешествуя по Италии, посетил госпиталь Святой Анны в Ферраре, где ему показали тесную келью, в которой, по преданию, герцог Альфонсо II д’Эсте в 1580-х годах держал взаперти поэта Торквато Тассо, сочтя его безумным. Эта реликвия тронула Байрона сильнее, чем стоявший неподалёку памятник Ариосто, и на следующий день он сочинил «Жалобу Тассо» — драматический монолог, в котором звучит отчаяние поэта. Этот визит стал одним из самых знаменитых паломничеств Гран-тура эпохи романтизма и навсегда запечатлел в воображении путешественников павший двор Эсте в Ферраре."
 grand_tour_events.8.desc: "[target_location.GetName] учит праву и искусству спора дольше, чем любое другое место христианского мира, и [target_location.GetRank.GetName] не скрывает своей учёности: портики полны студентов из всех народов, а лекционные залы старше большинства окружающих их церквей. Заезжий [ROOT.GetCountry.GetGovernment.GetHeirTitle] мог бы провести здесь всю жизнь и так и не исчерпать всего, что написали доктора права.\n\nЕсть здесь и двор, который стоит повидать, если политика занимает нас больше, чем юриспруденция."
 grand_tour_events.9.desc: "[target_location.GetName] — это три гряды холмов вокруг площади в форме раковины и полосатый собор, видный с любой улицы, что взбирается к нему. [target_location.GetRank.GetName] нажил богатство на банковском деле и на товаре, имя которому — [ShowGoodsName('wool')], пока его не затмила [ShowLocationName('florence')], и так и не простил ей этого: соперничество до сих пор окрашивает каждый разговор при дворе.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает как раз к скачкам, которые дважды в год заполняют площадь, — со знамёнами и всем прочим."
 grand_tour_events.10.desc: "[target_location.GetName] — город, где построили колокольню, неспособную стоять прямо, но вместо того, чтобы снести её, просто продолжили строить; [target_location.GetRank.GetName] считает этот наклон предметом гордости, а не позором. Галер, что некогда делали его морской державой и соперником таких городов, как [ShowLocationName('genoa')] и [ShowLocationName('venice')], больше нет, но университет и соборная площадь остались.\n\nЗаезжий [ROOT.GetCountry.GetGovernment.GetHeirTitle] может здесь как учиться, так и бродить по гавани, что когда-то так много значила."
 grand_tour_events.11.desc: "[target_location.GetName] взбирается по зелёному склону вокруг базилики, воздвигнутой, чтобы хранить кости уроженца этих мест — монаха, у которого не было ничего и который сделал [target_location.GetRank.GetName] одним из величайших мест паломничества на Западе. Расписанные фресками стены базилики привлекают живописцев и паломников в равном числе.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] может провести это время среди фресок или среди братьев, что по сей день хранят устав ордена."
 grand_tour_events.12.desc: "[target_location.GetName] высится на холме за стенами, которые этруски возвели задолго до того, как Рим стал хоть что-то значить, и [target_location.GetRank.GetName] по сей день ежедневно проходит через их ворота, не задумываясь. Здешние живописцы в последнее время прославились так, что о них знает вся [ShowRegionName('italy_region')], а лекционные залы университета никогда не пустуют.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] может изучать либо старые стены, либо новые картины — как подскажет склонность."
 grand_tour_events.13.desc: "[target_location.GetName] стережёт речную переправу, где сходятся дороги из таких краёв, как [ShowRegionName('italy_region')], [ShowRegionName('balkan_region')] и [ShowLanguageName('german_language')]ие земли, и [target_location.GetRank.GetName] разжирел на пошлинах. В центре возвышается герцогский Хофбург — резиденция двора, который мнит себя чем-то большим, чем просто местная власть.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] наконец перевалил через Альпы; дальше дороги пойдут легче."
 grand_tour_events.14.desc: "[target_location.GetName] лежит на обоих берегах Влтавы, каменный мост связывает Старый город с замковым холмом, и [target_location.GetRank.GetName] держится как столица империи. Университет на холме притягивает студентов со всех концов [ShowLanguageName('german_language')]их земель и из краёв куда более дальних.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит город, который измеряет свою значимость веками, а не временами года."
 grand_tour_events.15.desc: "[target_location.GetName] берёт само своё имя от монахов, чьё поселение стояло здесь ещё до того, как герцоги поставили рядом рынок и монетный двор, и [target_location.GetRank.GetName] с тех пор изрядно разросся. Герцогский двор Виттельсбахов держит [target_location.GetRank.GetNameWithNoTooltip] в большем порядке, чем бывает в иных местах, а местные пивовары исправно снабжают его пивом.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] найдёт здесь и учёных, и хорошо устроенный двор."
 grand_tour_events.16.desc: "[target_location.GetName] лежит по обе стороны реки вокруг острова, увенчанного великим собором, и [target_location.GetRank.GetName] больше почти любого места, какое наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] успел повидать за это путешествие. Университетский квартал на левом берегу обучает богословию и праву больше студентов, чем живёт людей в большинстве городов.\n\nКоролевский двор, принимая гостей, держится с такой церемонностью, что не оставляет сомнений, какого он о себе мнения."
 grand_tour_events.17.desc: "[target_location.GetName] стоит при слиянии двух рек, и [target_location.GetRank.GetName] обратил это слияние в богатство: купцы из таких краёв, как [ShowRegionName('italy_region')], [ShowCultureGroupName('german_group')]ие земли и Фландрия, съезжаются сюда на королевские ярмарки, и тогда улицы так полнятся товарами — [ShowGoodsName('silk')], [ShowGoodsName('dyes')], — что склады не в силах их вместить. Здешние печатные станки работают почти так же быстро, как ткацкие.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] обнаруживает город, живущий торговлей, а не церемониями."
 grand_tour_events.18.desc: "Само имя — [target_location.GetName] — дано этому месту по дорогам, что здесь пересекаются, и [target_location.GetRank.GetName] по-прежнему служит той же цели: он стоит на реке, отделяющей [ShowLanguageName('french_language')]оязычные земли от [ShowLanguageName('german_language')]их. Шпиль его собора поднимается выше всего, что наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] видел за всё путешествие, — одинокая башня, парная к которой так и не была построена.\n\nВольный город управляет собой сам, и его печатники в последнее время стали значить не меньше, чем купцы."
 grand_tour_events.19.desc: "[target_location.GetName] — порт, существовавший ещё до того, как появился Рим: его основали [ShowCultureName('greek_culture')]ие мореходы, которые увидели гавань и остались здесь навсегда, и [target_location.GetRank.GetName] до сих пор насквозь пропах солью и дёгтем. У набережной теснятся галеры с половины Средиземноморья, а на рынках продают товары, которые никогда не доберутся до глубин страны, имя которой — [GetCountry('FRA').GetName].\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] понимает, что истинный правитель здесь — само море, а [target_location.GetRank.GetNameWithNoTooltip] лишь ему служит."
 grand_tour_events.20.desc: "Имя этому месту — [target_location.GetName] — дал основавший его император, и с тех пор [target_location.GetRank.GetName] не переставал расти. Здешние банкирские дома ворочают суммами, рядом с которыми иные королевские казны выглядят скромно, а рейхстаг собирается здесь так часто, что [target_location.GetRank.GetNameWithNoTooltip] привык принимать князей.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] видит, что о деньгах здесь говорят так же открыто, как о родословной."
 grand_tour_events.21.desc: "[target_location.GetName] строит свой собор дольше, чем помнит кто-либо из ныне живущих: над крышами высится недостроенная башня, и на её вершине всё ещё стоит кран — там, где его оставили каменщики, — а [target_location.GetRank.GetName] давно привык к этому зрелищу. [target_location.GetRank.GetNameWithNoTooltip] стоит на Рейне, и река проносит мимо него больше товаров, чем почти где-либо ещё в [ShowLanguageName('german_language')]их землях, а здешний архиепископ правит не хуже любого князя.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит город, который измеряет терпение веками."
 grand_tour_events.22.desc: "[target_location.GetName] ведёт историю своих стен от римской колонии, некогда стоявшей здесь, и [target_location.GetRank.GetName] вырос в самый оживлённый порт этого побережья: гавань полна галер, везущих [ShowGoodsName('wool')], пряности и [ShowGoodsName('dyes')] по всему западному Средиземноморью. К здешнему морскому кодексу обращаются даже капитаны, ни разу не ступавшие на эту землю.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] почти завершил долгий путь домой."
 grand_tour_events.23.desc: "[target_location.GetName] венчает свой холм замком, где королей коронуют и хоронят, и [target_location.GetRank.GetName] относится к обоим обрядам с равной торжественностью. Здешний университет, старше большинства тех, что знают [ShowLanguageName('german_language')]ие земли, обучает астрономии и праву студентов со всего края, а купцы, везущие [ShowGoodsName('amber')] и [ShowGoodsName('salt')], круглый год не дают рынкам затихнуть.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] достигает последней великой остановки перед домом."
 grand_tour_events.26.desc: "[target_location.GetName] тянется вдоль реки за стенами, которые первыми возвели римляне, и [target_location.GetRank.GetName] давно их перерос, а мост его застроен собственными домами и лавками. Склады полны товара, и прежде всего это [ShowGoodsName('wool')], а парламент собирается так часто, что [target_location.GetRank.GetNameWithNoTooltip] привык быть местом, где решаются дела королевства.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит двор, ничуть не уступающий в честолюбии любому двору на континенте."
 grand_tour_events.27.desc: "[target_location.GetName] стоит там, где Луара поворачивает на север, прежде чем вновь устремиться к морю, и [target_location.GetRank.GetName] издавна наживается на движении по реке. Здешний университет преподаёт право почти так же строго, как тот, которым славится [ShowLocationName('bologna')], а стены выдерживали осады, которых не пережили другие города.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит здесь и учёных, и солдат, которым есть что рассказать."
