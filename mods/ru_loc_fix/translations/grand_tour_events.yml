l_russian:
 grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в сборе, сундуки уложены, на дороге, ведущей на юг, выстраивается эскорт. Впереди ждёт [ShowRegionName('italy_region')] — край древних руин, учёности, которую принесло [ShowInstitutionName('renaissance')], и дворов, чьё политическое искусство заставляет север казаться юнцом. Всё, чему наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] научится там, определит судьбу державы на целое поколение. Остаётся лишь решить, чему именно мы намерены [target_leader.GetHerHim] научить."
 grand_tour_events.1.a: "Тамошние дворы научат [target_leader.GetHerHim] тому, чему не научат книги."
 grand_tour_events.2.historical_info: "На Вознесенской неделе 1645 года английский джентльмен Джон Ивлин, совершавший тогда собственное долгое путешествие по Франции и Италии, побывал в одном из публичных театров Венеции на опере #italic «Эрколе в Лидии»#!. В дневнике он восхищается декорациями, сменявшимися тринадцать раз, и особо выделяет сопрано Анну Ренци, хотя одного певца-кастрата счёл даже превосходящим её, а генуэзского баса назвал «несравненным». Среди расписных перспектив и летающих машин зрелище «держало в плену наши глаза и уши до двух часов ночи». Венецию он покинул следующей весной, увозя сундуки, полные книг, гравюр и банок знаменитого венецианского териака."
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip] — [target_location.GetRank.GetNameWithNoTooltip], где родилось [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.3.historical_info: "Осенью 1764 года больной шотландский романист Тобиас Смоллетт посетил галерею Уффици и, стоя перед Венерой Медицейской, которую все прочие путешественники Гран-тура восхваляли на веру, написал: «Не могу отделаться от мысли, что в чертах Венеры нет никакой красоты, а поза её неуклюжа и неестественна». Позднее Лоренс Стерн увековечил эту вспышку: его вымышленный Йорик у Пантеона в Риме корит «Смельфунгуса» за то, что тот «набросился на богиню и обошёлся с ней хуже, чем с последней уличной девкой, без малейшего к тому повода». Их спор из-за одной мраморной Венеры пережил их обоих."
 grand_tour_events.4.historical_info: "15 октября 1764 года английский джентльмен Эдвард Гиббон, завершавший тогда собственный Гран-тур по Италии, сидел в раздумьях среди руин на Капитолийском холме, пока босоногие монахи пели вечерню в здании, которое он принял за древний храм Юпитера. Позднее он писал в мемуарах, что именно там, среди обломков колонн и затихающего вечернего пения, «мне впервые пришла мысль написать об упадке и разрушении города». Замысел, рождённый одним римским вечером, за следующие двадцать лет занятий в Англии вырос в #italic «Историю упадка и разрушения Римской империи»#!."
 grand_tour_events.5.historical_info: "В январе 1786 года Эстер Пиоцци поднялась на Везувий, привязанная верёвкой к своему проводнику Бартоломео — «Циклопу Везувия», — и остановилась передохнуть у кельи отшельника на полпути к вершине. Отшельник, француз, вдруг узнал её: «Мадам, не видел ли я вас прежде? Ну конечно, видел — и даже причёсывал, когда был цирюльником в Лондоне». Устыдившись, когда узнала, что четырёхлетний мальчик из её спутников уже добрался до края кратера, Пиоцци продолжила путь, чтобы своими глазами увидеть дымящееся жерло, и описала всю эту встречу в опубликованных путевых письмах."
 grand_tour_events.6.historical_info: "Прибыв в Верону в апреле 1785 года, Эстер Пиоцци почувствовала, как её сердце «ощутимо расширилось» при виде столь хорошо сохранившегося римского амфитеатра, а позже назвала этот город «самым весёлым на вид из всех, где мне доводилось жить». Гид, показывавший ей древности Филармонической академии, уверял, что английские Арунделовы мраморы давно погублены угольным дымом, — пока она не узнала в его словах дословную цитату из путеводителя #italic Verona illustrata#!, который он выучил наизусть. В опубликованном рассказе о путешествии она назвала этот обман «malafede и весьма нелепым предрассудком»."
 grand_tour_events.7.historical_info: "В апреле 1817 года лорд Байрон, путешествуя по Италии, посетил госпиталь Святой Анны в Ферраре, где ему показали тесную келью, в которой, по преданию, герцог Альфонсо II д’Эсте в 1580-х годах держал взаперти поэта Торквато Тассо, сочтя его безумным. Эта реликвия тронула Байрона сильнее, чем стоявший неподалёку памятник Ариосто, и на следующий день он сочинил «Жалобу Тассо» — драматический монолог, в котором звучит отчаяние поэта. Этот визит стал одним из самых знаменитых паломничеств Гран-тура эпохи романтизма и навсегда запечатлел в воображении путешественников павший двор Эсте в Ферраре."
 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.opportunity_commit: "Посвятим себя этому целиком, пусть даже в ущерб прочим занятиям."
 grand_tour_events.opportunity_decline: "Вежливо откажемся и продолжим путь."
 grand_tour_events.reflect_and_continue: "Обдумаем усвоенное и продолжим путь."
 grand_tour_events.worth_the_delay: "и стоило ли это задержки в путешествии."
 grand_tour_events.seek_audience: "Попросим аудиенции — пусть нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.seek_castle_audience: "Попросим аудиенции в замке — пусть нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.attend_university_lectures: "Посетим лекции в университете."
 grand_tour_events.prodigy_knowledge: "Пусть [target_leader.GetNameWithNoTooltip] блеснёт как юное дарование на поприще учёности."
 grand_tour_events.prodigy_connections: "Пусть [target_leader.GetNameWithNoTooltip] блеснёт как юное дарование в искусстве заводить связи."
 grand_tour_events.prodigy_experience: "Пусть [target_leader.GetNameWithNoTooltip] блеснёт как юное дарование, умудрённое опытом не по годам."
 grand_tour_events.1.party: "Потратим деньги на последнюю ночь веселья перед дорогой."
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName] — [target_location.GetRank.GetName], существующий наперекор самой географии: выстроенный на илистых отмелях, держащийся на плаву благодаря торговле и управляемый советом купеческих семейств, который пережил все династии, какие только знала [ShowContinentName('europe')]."
 grand_tour_events.2.desc.ducal_palace: "А над лагуной розовеет роскошный Дворец дожей, всем напоказ являя изысканность и богатство."
 grand_tour_events.2.desc.heir_arrival: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает, пожалуй, в самый космополитичный [target_location.GetRank.GetNameWithNoTooltip], какой только знает [ShowContinentNameWithNoTooltip('europe')]: на его рынках звучат все языки Средиземноморья, а за подходящую цену здесь можно купить любые сведения."
 grand_tour_events.2.knowledge: "Изучим кораблестроение там, где работает [ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]."
 grand_tour_events.2.experience: "Осмотрим верфи, где строит свои военные галеры [target_location.GetNameWithNoTooltip]."
 grand_tour_events.2.connections: "Посетим приём, который устраивает [court_host.GetNameWithNoTooltip]."
 grand_tour_events.2.party: "Сменим счётные книги на ночь среди гуляк на каналах."
 grand_tour_events.3.knowledge: "Добьёмся знакомства с учёными монастыря."
 grand_tour_events.3.experience: "Осмотрим мастерские, где прядут [ShowGoodsNameWithNoTooltip('wool')], и золотых дел мастеров на Понте-Веккьо."
 grand_tour_events.3.connections: "Постигнем искусство меценатства при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.3.party: "Отложим рукописи ради азартных игр — игорными столами славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.4.knowledge: "Обратимся к рукописям Ватиканской библиотеки и к тамошним гуманистам."
 grand_tour_events.4.experience: "Обойдём древние руины и обмерим памятники."
 grand_tour_events.4.party: "Сменим руины на ночь в винных погребках, которыми славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.5.knowledge: "Проведём последние недели среди библиотек и руин."
 grand_tour_events.5.experience: "Присоединимся к землекопам, откапывающим погребённый Геркуланум."
 grand_tour_events.5.connections: "Проведём последние недели при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.5.party: "Сменим уроки на последнюю ночь в тавернах, которыми славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.6.knowledge: "Изучим римские руины и древнее инженерное искусство арены."
 grand_tour_events.6.experience: "Осмотрим каменоломни, где добывают [ShowGoodsNameWithNoTooltip('marble')], и речную торговлю на Адидже."
 grand_tour_events.6.connections: "Нанесём визиты — нас примут [court_host.GetNameWithNoTooltip] и знатнейшие семейства, которыми славится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.6.party: "Променяем амфитеатр на ночь в тавернах у его подножия."
 grand_tour_events.7.knowledge: "Почитаем рыцарские романы из герцогской библиотеки."
 grand_tour_events.7.experience: "Осмотрим герцогский арсенал и шлюзы на каналах, которыми гордится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.7.connections: "Посетим представление при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.7.party: "Отложим герцогские стихи ради вечера повеселее."
 grand_tour_events.8.knowledge: "Посетим лекцию по гражданскому праву в университете."
 grand_tour_events.8.experience: "Осмотрим шелкопрядильни, благодаря которым своими нитями славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.8.party: "Променяем лекционный зал на вино в компании студентов."
 grand_tour_events.8.historical_info: "В 1739 году Шарль де Бросс, французский магистрат, путешествовавший по Италии, провёл вечер в Болонье в доме Лауры Басси — к тому времени первой в Европе женщины, получившей университетскую кафедру, — где местные учёные собирались обсуждать новую науку об электричестве. Позднее де Бросс вспоминал, как ему пришлось стряхнуть пыль со своей подзабытой школьной латыни, чтобы спорить о магнетизме и «необычайном притяжении наэлектризованных тел» перед всем собранием. Он описал этот вечер в своих #italic «Дружеских письмах из Италии»#!, а салон Басси стал одной из самых посещаемых остановок для путешественников Гран-тура, проезжавших через город."
 grand_tour_events.9.knowledge: "Посетим лекцию по каноническому праву в университете."
 grand_tour_events.9.experience: "Изучим фрески и знаменитые банковские книги, которыми славится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.9.connections: "Посмотрим скачки с лоджии, которую нам предоставит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.9.party: "Сменим фрески на игорные столы на площади Кампо."
 grand_tour_events.9.historical_info: "Осенью 1764 года романист Тобиас Смоллетт прервал путь из Флоренции в Рим ночёвкой в Сиене и ворчал в опубликованном #italic «Путешествии по Франции и Италии»#!, что его «кое-как поселили в доме, вонявшем, как отхожее место», и «прескверно накормили за ужином». Он признавал, что город «велик и хорошо выстроен», и отмечал, что сиенцы «гордятся своей учтивостью и чистотой своего наречия» — настолько, что иностранцы селились здесь лишь затем, чтобы выучиться правильному итальянскому произношению. Рассказ Смоллетта стал одной из самых известных английских жалоб на гостеприимство Тосканы времён Гран-тура."
 grand_tour_events.10.knowledge: "Посетим лекции в университете на Соборной площади."
 grand_tour_events.10.experience: "Побываем в старом арсенале и у кожевников на берегах Арно."
 grand_tour_events.10.connections: "Представимся ко двору — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.10.party: "Оставим лекцию ради ночи в портовых тавернах."
 grand_tour_events.10.historical_info: "В конце 1821 года Перси и Мэри Шелли поселились в Пизе и уговорили лорда Байрона присоединиться к ним, устроив его в палаццо Ланфранки на Лунгарно; вместе с Эдвардом и Джейн Уильямс, а позже и с Эдвардом Трелони они составили кружок, впоследствии известный как «Пизанский кружок». Байрон прибыл со свитой из лошадей, собак и обезьян, и всю зиму компания строила планы литературного журнала #italic «Либерал»#!. Ли Хант добрался до Италии лишь следующим летом, высадившись всего за несколько дней до того, как в июле Шелли утонул у тосканского побережья; кружок, собранный Шелли в Пизе, распался за считаные месяцы, оставив городу славу одного из самых овеянных легендами пристанищ романтизма."
 grand_tour_events.11.knowledge: "Изучим фрески и житие святого."
 grand_tour_events.11.experience: "Осмотрим мастерские, где изготавливают предметы благочестия и паломнические значки."
 grand_tour_events.11.connections: "Встретимся с местной властью — нас примут [court_host.GetNameWithNoTooltip] и городские чиновники."
 grand_tour_events.11.party: "Оставим общество монахов ради более оживлённого вечера в городе."
 grand_tour_events.11.historical_info: "Вечером 26 октября 1786 года Иоганн Вольфганг фон Гёте добрался до Ассизи и, как он сам пишет в #italic «Итальянском путешествии»#!, с нескрываемым отвращением отвернулся от «огромной громады церквей, нагромождённых одна на другую на вавилонский манер», где покоятся останки святого Франциска, пренебрегши этим местом паломничества. Вместо этого он поднялся к римскому храму Минервы на площади старого города, назвав его «первым целиком сохранившимся памятником древности, какой я когда-либо видел». То, что Гёте пренебрёг самой знаменитой святыней Ассизи ради языческого храма, стало одним из самых поразительных личных суждений, дошедших до нас от эпохи Гран-тура."
 grand_tour_events.12.knowledge: "Поучимся в университете и пройдёмся вдоль старых этрусских стен."
 grand_tour_events.12.experience: "Побываем в мастерских гончаров, знаменитых своей майоликой."
 grand_tour_events.12.connections: "Добьёмся представления при дворе, где правит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.12.party: "Оставим старые стены ради ночи в студенческих тавернах."
 grand_tour_events.12.historical_info: "В начале 1765 года романист Тобиас Смоллетт возвращался из Рима во Флоренцию, когда на крутом подъёме к Перудже его выбившиеся из сил лошади начали сползать назад под тяжестью кареты, увлекая её к краю обрыва. Случайный прохожий в последний миг подложил под колесо большой камень и остановил скольжение, избавив всех путников от участи быть, по словам самого Смоллетта, разбитыми вдребезги. Сменных лошадей в тот день не нашлось, и Смоллетту с семьёй пришлось заночевать в городе; они осмотрели его церкви и картины его уроженца Пьетро Перуджино, прежде чем вновь пуститься в дорогу на Флоренцию."
 grand_tour_events.13.knowledge: "Посетим соборные школы и городских учёных."
 grand_tour_events.13.experience: "Осмотрим арсенал и пристани лодочников на Дунае."
 grand_tour_events.13.connections: "Представимся в Хофбурге — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.13.party: "Сменим соборные школы на ночь на берегу Дуная."
 grand_tour_events.13.historical_info: "В 1775 году врач Джон Мур посетил Вену как спутник юного герцога Гамильтона, и обоих удостоили частной аудиенции сначала у императора Иосифа II, а затем и у самой императрицы Марии Терезии в Шёнбрунне. Мур отмечал, что хвалёная чопорность двора растаяла, едва государственный канцлер князь Кауниц заметил путешествовавшего с ними четырнадцатилетнего сына Мура и настоял, чтобы император и императрица приняли и его. Мур записал и старую придворную историю о вспышке оспы, поразившей семью Габсбургов восемью годами ранее: узнав, что заразилась, одна из дочерей императрицы тотчас велела подать зеркало и весело простилась с красотой, которую болезнь вот-вот должна была погубить."
 grand_tour_events.14.knowledge: "Посетим лекции в университете на холме."
 grand_tour_events.14.experience: "Осмотрим стекольные мастерские и золотых дел мастеров Золотой улочки."
 grand_tour_events.14.party: "Оставим университет ради ночи в прибрежных тавернах."
 grand_tour_events.14.historical_info: "Путешествуя по Богемии в 1775 году в качестве спутника юного герцога Гамильтона, врач Джон Мур стоял со своим подопечным на одной из пражских улиц, когда проходивший мимо священник, состоявший при одной из городских семинарий, услышал их разговор и объявил: «Уверяю вас, я тоже ирландец». На вопрос, как он с такой лёгкостью определил их происхождение, священник ответил, что понял это, едва услышал английскую речь. До конца визита он служил им проводником и среди прочего показал окно канцелярии, из которого в 1618 году выбросили двух вельмож и их секретаря, — прецедент, который Мур с усмешкой рекомендовал государственным мужам всех стран."
 grand_tour_events.15.knowledge: "Посетим соборные школы и городских летописцев."
 grand_tour_events.15.experience: "Осмотрим герцогский арсенал и торговые склады, где хранится [ShowGoodsNameWithNoTooltip('salt')]."
 grand_tour_events.15.connections: "Представимся при герцогском дворе — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.15.party: "Отложим летописи ради ночи в компании пивоваров."
 grand_tour_events.15.historical_info: "В 1786 году писательница Эстер Линч Пиоцци проезжала через Мюнхен вместе с мужем во время долгого свадебного путешествия по континенту: они прибыли на рассвете после ночного перехода через Альпы из Инсбрука и задержались, чтобы осмотреть картинную галерею и кунсткамеру курфюрста. Среди вещей, которые показал ей один местный собиратель, было тончайшее изображение Девы Марии с Младенцем, исполненное словно из сотканной паутины, — настолько мелкое, что фигуры нельзя было различить невооружённым глазом и они становились видны лишь под микроскопом. Пиоцци с изумлением описала это зрелище, дивясь тому, сколько труда было потрачено на столь хрупкое и бесполезное изделие."
 grand_tour_events.16.knowledge: "Посетим диспуты в университете на левом берегу."
 grand_tour_events.16.experience: "Побываем у переплётчиков и в типографиях близ университета."
 grand_tour_events.16.party: "Променяем диспуты на таверны левого берега."
 grand_tour_events.16.historical_info: "Во время пребывания в Париже в октябре 1763 года романист Тобиас Смоллетт увидел, как на дороге в Шуази остановилась наёмная карета и из неё высыпали пятеро или шестеро вооружённых мужчин, каждый из которых занял позицию за отдельным деревом. Решив, что это разбойники или стражники, преследующие преступника, Смоллетт спросил слугу, кто они такие, и узнал, что это господа, выбравшиеся из города на денёк поохотиться на зайцев и стрелявшие из укрытия во всякую пробегавшую мимо дичь. Всё это зрелище показалось Смоллетту нелепым, и он сухо заметил, что это, по крайней мере, действенный способ очистить поле от зайцев."
 grand_tour_events.17.knowledge: "Разыщем поэтов-гуманистов, что собираются у печатных станков."
 grand_tour_events.17.experience: "Побываем в печатнях и заглянем в счётные книги купцов."
 grand_tour_events.17.connections: "Нанесём визиты — нас примут [court_host.GetNameWithNoTooltip] и самые видные купцы, которыми славится этот [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.17.party: "Отложим счётные книги ради ночи среди гуляк."
 grand_tour_events.17.historical_info: "В октябре 1763 года романист Тобиас Смоллетт, направляясь на юг в Италию, добрался до Лиона и описал этот визит в письмах, позднее изданных как #italic «Путешествие по Франции и Италии»#!. Его направили в меблированные комнаты, где не оказалось мест, и тогда его привели в трактир, где запросили двенадцать ливров в день за три убогие комнаты и ещё тридцать два — за стол; возмущённый таким вымогательством, он молча удалился и отправился прямиком в соперничающую гостиницу. Рассказ Смоллетта о лионских трактирщиках-обиралах стал одним из самых цитируемых мест его книги и привычной жалобой английских путешественников на пути в Италию."
 grand_tour_events.18.knowledge: "Посетим лекцию в гимназии Иоганна Штурма."
 grand_tour_events.18.experience: "Поднимемся на соборную башню и побываем в печатных мастерских."
 grand_tour_events.18.connections: "Встретимся с городским советом — нас примут [court_host.GetNameWithNoTooltip] и почтенные советники."
 grand_tour_events.18.party: "Оставим печатни ради ночи у подножия шпиля."
 grand_tour_events.18.historical_info: "В начале 1770-х годов шотландский врач Джон Мур, путешествуя по континенту в качестве спутника герцога Гамильтона, поднялся на 466-футовый шпиль Страсбургского собора и описал свой визит в книге #italic «Взгляд на общество и нравы во Франции, Швейцарии и Германии»#!. Он рассказывает, как вместе с толпой ждал, когда к мессе прибудет внебрачный сын Людовика XV, но пробил полдень, вельможа так и не появился, и прихожане разошлись ни с чем, после чего Мур выслушал пламенную проповедь о тирании страстей. Отметил Мур и большой рог собора, в который трубили каждую ночь в память о заговоре, который проводники по-прежнему винили в резне, случившейся четыре столетия назад."
 grand_tour_events.19.knowledge: "Изучим надписи, напоминающие о том, что этот [target_location.GetRank.GetNameWithNoTooltip] основали [ShowCultureNameWithNoTooltip('greek_culture')]ие переселенцы."
 grand_tour_events.19.experience: "Побываем в гавани и поговорим со средиземноморскими моряками."
 grand_tour_events.19.connections: "Нанесём визит — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.19.party: "Сменим сплетни на ночь в портовых тавернах."
 grand_tour_events.19.historical_info: "В мае 1765 года романист Тобиас Смоллетт, возвращаясь через Прованс, добрался до Марселя и описал этот портовый город в письмах, позднее изданных как #italic «Путешествие по Франции и Италии»#!. Прогуливаясь по набережной гавани, он наблюдал за галерными каторжниками, которых корона отдавала внаём заниматься ремёслами в крохотных арендованных лавочках: прикованные за одну ногу, они, по его словам, жили неплохо и выглядели весёлыми — сапожники, серебряных дел мастера, книготорговцы. Смоллетт счёл Марсель благородным и процветающим городом, хотя и ворчал, что здешние трактирщики брали с него по четыре ливра с человека за каждую трапезу."
 grand_tour_events.20.knowledge: "Обратимся к городским древностям и рукописям гуманистов."
 grand_tour_events.20.experience: "Изучим счётные книги великих банкирских домов."
 grand_tour_events.20.connections: "Посетим приём, который устраивает [court_host.GetNameWithNoTooltip]."
 grand_tour_events.20.party: "Отложим счётные книги ради игорных столов."
 grand_tour_events.20.historical_info: "Утром 15 июля 1772 года английский историк музыки Чарльз Бёрни, проехав всю ночь, прибыл в Аугсбург и сразу отправился в собор, где услышал немецкую проповедь и мессу, которую по случаю праздника пели два хора. Певцами он восхитился, но гармонии органиста нашёл столь грубыми и надуманными, что исполнение скорее терзало слух, чем услаждало его, а при возношении Святых Даров его поразил грубый раскат барабанов и труб — обычай, который прежде он слышал только в Антверпене. Узнав, что кантор, к которому он вёз рекомендательные письма, в отъезде, Бёрни, собиравший материал для своей истории музыки, задерживаться не стал."
 grand_tour_events.21.knowledge: "Побываем на строительстве собора и у университетских учёных."
 grand_tour_events.21.experience: "Осмотрим литейни, где отливают колокола для церквей Рейнской области."
 grand_tour_events.21.party: "Оставим строительство собора ради ночи на берегу Рейна."
 grand_tour_events.21.historical_info: "В сентябре 1794 года писательница Анна Радклиф добралась до Кёльна, путешествуя с мужем по Рейнской области, — эта поездка описана в её опубликованных путевых заметках #italic «Путешествие, совершённое летом 1794 года»#!. Город она нашла переполненным беженцами, спасавшимися от французских армий, что наступали на Льеж и Маастрихт, а его улицы — забитыми госпитальными повозками с ранеными и умирающими. Все гостиницы были полны; путешественники за неимением комнат спали в каретах, на бильярдных столах и кушетках. Позднее Радклиф писала, что эта картина рассказала ей об истинной цене войны больше, чем любая битва, о которой она читала."
 grand_tour_events.22.knowledge: "Посетим лекцию о законах каталонских #italic кортесов#!."
 grand_tour_events.22.experience: "Изучим морской кодекс, хранящийся на купеческой бирже."
 grand_tour_events.22.connections: "Представимся ко двору — нас примет [court_host.GetNameWithNoTooltip]."
 grand_tour_events.22.party: "Сменим морской кодекс на портовые таверны."
 grand_tour_events.22.historical_info: "В конце октября 1775 года английский антиквар Генри Суинберн добрался до Барселоны перед самым закрытием городских ворот на ночь — этот эпизод он описал в своих #italic «Путешествиях по Испании в 1775 и 1776 годах»#!. Засвидетельствовав почтение губернатору, он отправился в театр и поначалу ворчал, что «на этой сцене воздвигла свой трон Скука», но несколько дней спустя был покорён живым представлением #italic «Сида Кампеадора»#!, сыгранным в старинных испанских костюмах. Осмотрел он и цитадель, отметив, что её низкое, сырое, кишащее комарами место выбрали не ради здоровья, а для того, чтобы держать в страхе раскинувшийся внизу город."
 grand_tour_events.23.experience: "Осмотрим Суконные ряды, где купцы торгуют своими товарами."
 grand_tour_events.23.party: "Променяем лекционный зал на ночь у стен замка."
 grand_tour_events.23.historical_info: "25 июля 1778 года Уильям Кокс, наставник юного лорда Герберта в долгом Гран-туре по северной и восточной Европе, переправился через Вислу в Краков и нашёл старую польскую столицу израненной ядрами и картечью недавних осад, а её роскошные дома — лежащими в руинах. Он осмотрел университет, основанный Казимиром Великим, где библиотекарь показал ему турецкую книгу, сама по себе не представлявшую большой ценности, но дорогую как диковина: взятая среди трофеев в битве под Хотином, она была подарена университету самим королём Яном Собеским в память о победе, которая спасла Польшу и принесла ему её трон."
 grand_tour_events.24.title: "Куда дальше?"
 grand_tour_events.24.desc: "Отсюда, где стоит [target_location.GetName], расходится несколько дорог. Куда двинется путешествие дальше, решает [target_leader.GetName]: вглубь края, имя которому [ShowRegionName('italy_region')], или к дому."
 grand_tour_events.24.a: "Сделаем крюк и заедем в город [ShowLocationNameWithNoTooltip('verona')]."
 grand_tour_events.24.b: "Лучше направимся в город [ShowLocationNameWithNoTooltip('ferrara')]."
 grand_tour_events.24.c: "Свернём в город [ShowLocationNameWithNoTooltip('bologna')]."
 grand_tour_events.24.d: "Двинемся дальше, в город [ShowLocationNameWithNoTooltip('florence')]."
 grand_tour_events.24.e: "Сделаем остановку в городе [ShowLocationNameWithNoTooltip('siena')]."
 grand_tour_events.24.f: "Сначала заглянем в город [ShowLocationNameWithNoTooltip('pisa')]."
 grand_tour_events.24.g: "Повернём к городу [ShowLocationNameWithNoTooltip('assisi')]."
 grand_tour_events.24.h: "Лучше направимся в город [ShowLocationNameWithNoTooltip('perugia')]."
 grand_tour_events.24.i: "Двинемся дальше, в город [ShowLocationNameWithNoTooltip('rome')]."
 grand_tour_events.24.j: "Продолжим путь в город [ShowLocationNameWithNoTooltip('naples')]."
 grand_tour_events.24.k: "Увиденного довольно. Вернёмся домой."
 grand_tour_events.25.title: "Дорога домой"
 grand_tour_events.25.desc: "Наконец путешествие поворачивает к дому. Чтобы не проделывать заново весь путь на юг, [target_leader.GetName] выбирает, где сделать остановку перед последним отрезком пути: дать отдых лошадям и, быть может, побывать при ещё одном дворе перед возвращением."
 grand_tour_events.25.desc.second: "Одной остановки мало, чтобы назвать это возвращением домой. Прежде чем дорога наконец приведёт в столицу — [ROOT.GetCountry.GetCapital.GetName], — [target_leader.GetName] выбирает ещё один город для остановки: последний двор, последняя диковина, прежде чем путешествие и впрямь завершится."
 grand_tour_events.25.a: "Сделаем остановку в городе [ShowLocationNameWithNoTooltip('vienna')]."
 grand_tour_events.25.b: "Дадим отдых лошадям в городе [ShowLocationNameWithNoTooltip('prague')]."
 grand_tour_events.25.c: "Повернём к дому через город [ShowLocationNameWithNoTooltip('munich')]."
 grand_tour_events.25.d: "Остановимся в городе [ShowLocationNameWithNoTooltip('paris')] перед последним отрезком пути."
 grand_tour_events.25.e: "Проедем через город [ShowLocationNameWithNoTooltip('lyon')] по пути домой."
 grand_tour_events.25.f: "Переправимся в город [ShowLocationNameWithNoTooltip('london')], прежде чем повернуть вглубь материка."
 grand_tour_events.25.g: "Сначала сделаем остановку в городе [ShowLocationNameWithNoTooltip('strasbourg')]."
 grand_tour_events.25.h: "Проложим путь через город [ShowLocationNameWithNoTooltip('marseille')]."
 grand_tour_events.25.i: "Направимся в город [ShowLocationNameWithNoTooltip('augsburg')] перед последним переходом."
 grand_tour_events.25.k: "Отдохнём немного в городе [ShowLocationNameWithNoTooltip('cologne')]."
 grand_tour_events.25.l: "Отплывём домой через город [ShowLocationNameWithNoTooltip('barcelona')]."
 grand_tour_events.25.n: "Сделаем остановку в городе [ShowLocationNameWithNoTooltip('orleans')]."
 grand_tour_events.25.o: "Проедем через город [ShowLocationNameWithNoTooltip('krakow')] перед последним переходом к дому."
 grand_tour_events.25.p: "Довольно задержек. Направимся прямо домой."
 grand_tour_events.26.knowledge: "Послушаем чтения об общем праве в Судебных иннах."
 grand_tour_events.26.experience: "Побываем у торговцев, продающих [ShowGoodsNameWithNoTooltip('wool')], и в городских гильдейских залах."
 grand_tour_events.26.party: "Отложим гильдейские залы ради ночи в тавернах, которыми славится [target_location.GetNameWithNoTooltip]."
 grand_tour_events.26.historical_info: "В 1765 году французский магистрат и литератор Пьер-Жан Гросле провёл почти год в Лондоне, собирая материал для книги, позднее переведённой на английский под названием #italic «Путешествие в Лондон»#!. Среди прочего он записал, как один государственный министр провёл двадцать четыре часа без перерыва за игорным столом, всё это время подкрепляясь лишь холодной говядиной, зажатой между двумя ломтиками поджаренного хлеба. «Это новое блюдо, — писал Гросле, — вошло в большую моду, пока я жил в Лондоне», и с тех пор его называли по имени изобретателя. Этот анекдот, приукрашенный или нет, стал самой цитируемой строкой его «Путешествия»."
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip] — Город на Луаре"
 grand_tour_events.27.experience: "Осмотрим винные погреба и гильдию луарских лодочников."
 grand_tour_events.27.party: "Променяем лекции по праву на таверны у реки."
 grand_tour_events.27.historical_info: "В апреле 1644 года молодой автор дневников Джон Ивлин, спускаясь по Луаре, сделал остановку в Орлеане — во время одного из самых ранних задокументированных Гран-туров. Он посетил древний университет, студенты которого по-прежнему делились на четыре исторических «нации» — французскую, нормандскую, пикардийскую и верхненемецкую, — каждую со своими должностными лицами, и пользовался двумя городскими публичными библиотеками, отметив, что учёный мог взять книгу к себе на квартиру, просто оставив расписку, — щедрость, показавшаяся ему поразительной. Видел он и коллегиальную церковь Святого Креста, некогда величественную, но всё ещё носившую явные следы недавних гражданских войн."
 grand_tour_events.28.title: "Возможность поучиться"
 grand_tour_events.28.desc.university: "До свиты доходит весть: место среди студентов университета, которым славится [target_location.GetName], может получить и [target_leader.GetName] — лекции, диспуты и общество учёных, чьи имена будут помнить ещё долго после того, как об этом путешествии забудут."
 grand_tour_events.28.desc.scholar: "До свиты доходит весть об учёном, живущем в городе [target_location.GetName], чья слава привлекает студентов со всего континента; за плату и ради достойного ученика его, возможно, удастся уговорить на время давать уроки, и учеником станет [target_leader.GetName]."
 grand_tour_events.29.title: "Конец лекций"
 grand_tour_events.29.desc: "Месяцы учёбы подходят к концу, и [target_leader.GetName] решает, чему на самом деле удалось научиться в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.30.title: "Возможность увидеть войну"
 grand_tour_events.30.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что [target_country.GetLongName] ведёт войну и что тамошние офицеры готовы принять гостей с надлежащими рекомендациями. Командования [target_leader.GetName] не получит и за судьбу солдат отвечать не будет, зато сможет скакать бок о бок с бывалыми офицерами, своими глазами увидеть военную кампанию и постичь то, что до конца не удалось передать ни одной книге о стратегии."
 grand_tour_events.31.title: "Конец кампании"
 grand_tour_events.31.desc: "Сезон походов подходит к концу, и [target_leader.GetName] решает, чему на самом деле удалось научиться у офицеров в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.32.title: "Возможность завести связи"
 grand_tour_events.32.desc: "[target_leader.GetName] получает приглашение провести сезон гостем при дворе: [target_country.GetLongName] предлагает покои во дворце, постоянное приглашение на каждый приём и знакомство со всеми придворными и заезжими дипломатами, которых стоит знать."
 grand_tour_events.32.desc.no_owner: "[target_leader.GetName] получает приглашение провести сезон гостем в доме виднейшего семейства, которым славится [target_location.GetName]: знакомство со всеми влиятельными людьми, которых стоит знать, и постоянное место за их столом."
 grand_tour_events.33.title: "Сезон при дворе окончен"
 grand_tour_events.33.desc: "Сезон при дворе подходит к концу, и [target_leader.GetName] решает, что на самом деле дали знакомства, заведённые в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.33.a: "Обдумаем приобретённое и продолжим путь."
 grand_tour_events.34.title: "Возможность учиться фехтованию"
 grand_tour_events.34.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что в городе [target_location.GetName] живёт поистине прославленный мастер фехтования, готовый взять на сезон многообещающего ученика. Ни одной по-настоящему значимой дуэли [target_leader.GetName] не проведёт и ни одной настоящей ссоры не разрешит, зато сможет освоить работу ног, чувство дистанции и времени и ту особую отвагу, которую до конца не удалось передать ни одному фехтовальному наставлению."
 grand_tour_events.35.title: "Конец уроков"
 grand_tour_events.35.desc: "Сезон уроков подходит к концу, и [target_leader.GetName] решает, чему на самом деле научили поединки в городе [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.36.title: "Письмо из дома"
 grand_tour_events.36.desc: "Наконец путешественников настигает письмо: его прислала родина — [ROOT.GetCountry.GetName]. В нём [ROOT.GetCountry.GetGovernment.GetRuler.GetName] с нежностью пишет, что при дворе с похвалой отзываются о том, как держится [target_leader.GetName], и о рассказах о том, как [target_leader.GetHerHim] принимают за границей и как проходит [target_leader.GetHerHis] время в чужих краях, — их уже не раз обсуждали за ужином."
 grand_tour_events.36.a: "Отметим это скромным празднеством."
 grand_tour_events.36.b: "Нам некогда думать о старом дворе на родине."
 grand_tour_events.37.title: "Местный почитатель"
 grand_tour_events.37.desc: "[gt_admirer.GetName], юная особа из местной знати, явно очарованная [target_leader.GetHerHis] положением и воспитанием, разыскивает [target_leader.GetHerHim], желая хоть чем-то быть полезной во время [target_leader.GetHerHis] визита в город [target_location.GetName]."
 grand_tour_events.37.a: "Пусть [target_leader.GetHerHim] представят нужным людям."
 grand_tour_events.37.b: "Примем [gt_admirer.GetHerHis] подарок — прекрасные наряды, достойные путешествия."
 grand_tour_events.37.c: "Примем [gt_admirer.GetHerHis] приглашение остановиться в [gt_admirer.GetHerHis] собственном доме."
 grand_tour_events.38.title: "Полезное знакомство"
 grand_tour_events.38.desc: "На званом ужине [target_leader.GetName] оказывается рядом со скромным молодым человеком по имени [gt_secretary.GetName], который мало говорит о себе, пока случайная обмолвка не выдаёт в нём секретаря кардинала [target_cardinal.GetName]. Он невзначай даёт понять, что одного его слова довольно — и [target_leader.GetNameWithNoTooltip] удостоится приёма у самого кардинала, если впечатление от сегодняшнего вечера окажется верным."
 grand_tour_events.38.a: "Попросим о представлении, рискуя произвести неловкое впечатление."
 grand_tour_events.38.b: "Будем добиваться этого изо всех сил — к чёрту неловкость."
 grand_tour_events.38.c: "Насладимся вечером, и на этом всё."
 grand_tour_events.39.title: "Миг озарения"
 grand_tour_events.39.desc: "Посреди диспута в городе [target_location.GetName] довод, который приводит [target_leader.GetName], вдруг оказывается гениальной находкой, и собравшиеся учёные умолкают, а затем одобрительно кивают."
 grand_tour_events.39.a: "Разовьём мысль дальше, рискуя стать посмешищем, если она ошибочна."
 grand_tour_events.39.b: "Доведём её до предела — к чёрту насмешки."
 grand_tour_events.39.c: "Сегодня мы показали себя достойно. На этом и остановимся."
 grand_tour_events.40.title: "Демонстрация мастерства"
 grand_tour_events.40.desc: "Во время поединка в фехтовальной школе в городе [target_location.GetName] [target_leader.GetName] находит брешь в защите, которой не учил ни один наставник, и на миг весь зал замирает, глядя, что [target_leader.GetSheHe] с ней сделает."
 grand_tour_events.40.a: "Пойдём в атаку, рискуя неудачно упасть."
 grand_tour_events.40.b: "Навяжем схватку — к чёрту увечья."
 grand_tour_events.40.c: "Покажем себя достойно, и на этом всё."
 grand_tour_events.40.injury_tt: "[target_leader.GetName] неудачно падает и надолго укладывается в постель, залечивая синяки и уязвлённую гордость"
 grand_tour_events.41.title: "Приступ болезни"
 grand_tour_events.41.desc: "[target_leader.GetName] мучается тяжёлым расстройством желудка, вызванным, как подозревают лекари, местной водой: ничего опасного для жизни, уверяют они свиту, но достаточно неприятно, чтобы на несколько дней уложить [target_leader.GetHerHim] в постель, а их услуги стоят недёшево."
 grand_tour_events.41.a: "Пошлём за лекарем."
 grand_tour_events.41.b: "Пошлём за лучшим лекарем, какого только можно найти."
 grand_tour_events.41.c: "Пусть болезнь идёт своим чередом."
 grand_tour_events.42.title: "Тоска по дому"
 grand_tour_events.42.desc: "Новизна пребывания приелась, и [target_leader.GetName] ловит себя на том, что [target_leader.GetHerHis] мысли уносятся домой, и прежде всего туда, где ждёт [target_parent.GetName]. Сосредоточенности [target_leader.GetHerHis] это ничуть не способствует."
 grand_tour_events.42.a: "Напишем домой письмо со скромным подарком, чтобы порадовать [target_parent.GetHerHim]."
 grand_tour_events.42.b: "Закажем портрет и отправим его в подарок, чтобы порадовать [target_parent.GetHerHim]."
 grand_tour_events.42.c: "Прервём путешествие и вернёмся домой, чтобы снова увидеть [target_parent.GetHerHim]."
 grand_tour_events.43.title: "Дорогостоящая оплошность"
 grand_tour_events.43.desc: "Лишь задним числом выясняется, что на вчерашнем приёме вышла неловкость: местного магистрата поприветствовали не в свой черёд, и виной тому — [target_leader.GetName]. Нарушение старшинства заметили все в зале, кроме свиты. Хозяин вечера вряд ли забудет об этом без какого-либо жеста раскаяния, хотя неуклюжий жест легко может сделать только хуже."
 grand_tour_events.43.a: "Преподнесём небольшой подарок в знак извинения, рискуя, что он не возымеет действия."
 grand_tour_events.43.b: "Принесём извинения с размахом."
 grand_tour_events.43.c: "Оставим всё как есть."
 grand_tour_events.44.title: "Продажная стража"
 grand_tour_events.44.desc: "Возвращаясь затемно, [target_leader.GetName] попадает в засаду в переулке: нападают люди в ливреях городской стражи, которых кошелёк чужестранца интересует куда больше, чем закон, который они поклялись блюсти."
 grand_tour_events.44.a: "Утром донесём на стражников магистрату."
 grand_tour_events.44.b: "Сразимся со стражниками прямо в переулке."
 grand_tour_events.44.c: "Бросимся на улицу с криками о помощи."
 grand_tour_events.44.d: "Отдадим кошелёк и уйдём."
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis|U] кошелёк, как признаётся [gt_friend.GetSheHe], опустошила полоса неудач за карточным столом, и [gt_friend.GetSheHe], явно смущаясь, спрашивает, не можем ли мы хоть чем-то помочь, пока долг не обернулся скандалом."
