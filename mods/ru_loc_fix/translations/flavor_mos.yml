l_russian:
 flavor_mos.80.entry: "Восстание $Bolotnikov$а"
 flavor_mos.90.desc: "Мы рискуем отстать от соперников, которые уже освоили новые науки и лучшие способы управления. Путешествие по дворам Запада могло бы сократить этот разрыв, но лишь если совершить его тихо. Делегации, принятой как почётные гости, покажут церемонии и лесть; той, что пройдёт незамеченной, покажут мастерские, верфи и подлинный механизм их успеха. Беда в том, что сохранить тайну трудно. Слухи расходятся, и двор, понявший, кто на самом деле ходит среди придворных, может закрыть свои двери так же быстро, как открыл их."
