l_russian:
 grand_embassy.2.a: "Пусть говорит [figurehead.GetShortNameWithNoTooltip], а [target_ruler.GetShortNameWithNoTooltip] останется среди свиты."
 grand_embassy.2.b: "Представить [target_ruler.GetShortNameWithNoTooltip] открыто — пусть все увидят [target_ruler.GetHerHim] без маски."
 grand_embassy.2.c: "Обойти [embassy_country.GetGovernment.GetCourtTitle] стороной. Мы приехали не для того, чтобы показываться."
 grand_embassy.3.a: "Открыть им доступ."
 grand_embassy.3.b: "Наши чудеса открыты для всех."
 grand_embassy.3.c: "Мы не позволим чужеземцам выведать наши секреты."
 grand_embassy.3.d: "Открыть им доступ, но без огласки."
 grand_embassy.4.desc: "Теперь, когда стало известно, кто на самом деле путешествует с делегацией, [embassy_country.GetGovernment.GetCourtTitle] державы [embassy_country.GetName] передал нам приглашение: задержаться ещё ненадолго и увидеть больше из того, что здесь стоит увидеть."
 grand_embassy.4.a: "С благодарностью принять приглашение."
 grand_embassy.4.b: "Упросить хозяев позволить нам задержаться ещё дольше."
 grand_embassy.7.b: "Отправиться дальше — в [target_1.GetNameWithNoTooltip]."
 grand_embassy.5.b: "Попытаться спасти хоть что-то в [target_1.GetNameWithNoTooltip]."
 grand_embassy.discretion_down_4_tt: "Проблеск узнавания (#R -4#! Скрытность)"
 grand_embassy.11.title: "Придворная мода"
 grand_embassy.11.desc: "Покрой камзола, посадка парика, должная глубина поклона: придворные в [embassy_country.GetName] изучают всё это так же пристально, как любой договор, а неудачная длина подола может стоить репутации, на восстановление которой уйдут годы. Каждая складка и каждое перо несут смысл, недоступный непосвящённым, и делегацию, одетую не так, как подобает, здесь по-настоящему и не замечают. Один из придворных негромко предлагает объяснить, что здесь носят и почему, кому следует кланяться первым — и насколько низко."
 grand_embassy.11.a: "Наблюдать и запоминать."
 grand_embassy.12.title: "Салон идей"
 grand_embassy.12.desc: "В особняке неподалёку от дворца купцы, учёные и праздные дворяне почти каждый вечер собираются за кофе, чтобы спорить о том, о чём прежде предпочитали молчать: о налогах, о вере и о том, где пролегают пределы власти короны. Беседы затягиваются допоздна и становятся всё громче по мере того, как догорают свечи, и никого, похоже, не заботит, кто слушает, — лишь бы и ему было что сказать. Добиться приглашения в этот круг, пусть даже чужестранцу, вполне возможно — если кофе хорош, а суждения смелы."
 grand_embassy.12.a: "Сидеть тихо и слушать."
 grand_embassy.3.title: "Делегация при дворе"
 grand_embassy.1.title: "Подготовка делегации"
 grand_embassy.1.desc: "Прежде чем делегация отправится в путь, нужно решить, какой ей быть. Правитель, которого водят по пирам и стерегут в отведённых покоях, видит лишь то, что хозяева хотят показать; мастерские, сухие доки и учебные плацы остаются закрыты для почётных гостей. Лицом делегации станет [figurehead.GetName], а [target_ruler.GetName] будет держаться среди свиты, не привлекая внимания. Как далеко нам стоит зайти, чтобы так всё и оставалось?"
 grand_embassy.1.a: "Подготовить делегацию как обычно."
 grand_embassy.1.a.tt: "Обычные приготовления, обычная секретность (Скрытность: 55)"
 grand_embassy.1.b: "Приложить все усилия, чтобы сохранить тайну."
 grand_embassy.1.b.tt: "Особая забота даёт настоящую безвестность (Скрытность: 75)"
 grand_embassy.1.c: "Отправить ложные делегации."
 grand_embassy.1.c.tt: "Ложные делегации запутывают след (Скрытность: 95)"
 grand_embassy.2.desc.port: "Делегация прибыла в город [embassy_country.GetCapital.GetName]. Мы приехали ради доступа — к сухим докам и арсеналам, где держава [embassy_country.GetName] строит флоты, благодаря которым опережает других на море. [embassy_country.GetGovernment.GetCourtTitle] будет решать, сколько из этого нам на самом деле покажут, — глядя на то, как мы себя представим."
 grand_embassy.2.desc.inland: "Делегация прибыла в город [embassy_country.GetCapital.GetName]. Мы приехали ради доступа — к мастерским и плацам, где ремесленники и строевые наставники державы [embassy_country.GetName] уже преобразили её торговлю и армию. [embassy_country.GetGovernment.GetCourtTitle] будет решать, сколько из этого нам на самом деле покажут, — глядя на то, как мы себя представим."
 grand_embassy.2.a_no_figurehead: "Пусть [target_ruler.GetShortNameWithNoTooltip] остаётся среди свиты."
 grand_embassy.3.desc.unaware: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] принимает делегацию державы [from.GetName]: по их собственным словам, это ничем не примечательные путешественники, которым не терпится увидеть, как всё устроено в державе [ROOT.GetCountry.GetName]. Впустить ли их в наши мастерские и государственные институты или отправить восвояси?"
 grand_embassy.3.desc.aware: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] уже негласно знает, кто на самом деле путешествует с этой делегацией. Если открыто объявить, что среди гостей — [target_ruler.GetName], неловко станет всем причастным; и всё же принимать правителя, готового учиться у чудес державы [ROOT.GetCountry.GetName], пусть и инкогнито, — немалая честь. Похоже, скрытность — палка о двух концах."
 grand_embassy.3.e: "Столь важные гости могут беспрепятственно увидеть наши чудеса."
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip], мы знаем, кто вы, и вам здесь не рады."
 grand_embassy.7.c: "Взять курс на державу [target_2.GetNameWithNoTooltip]."
 grand_embassy.7.d: "Нацелиться на державу [target_3.GetNameWithNoTooltip]."
 grand_embassy.7.e: "Ещё предстоит посетить державу [target_4.GetNameWithNoTooltip]."
 grand_embassy.7.f: "Повернуть делегацию к державе [target_5.GetNameWithNoTooltip]."
 grand_embassy.5.c: "Поискать более тёплого приёма в державе [target_2.GetNameWithNoTooltip]."
 grand_embassy.5.d: "Держава [target_3.GetNameWithNoTooltip], возможно, окажется гостеприимнее."
 grand_embassy.5.e: "Попытать счастья в державе [target_4.GetNameWithNoTooltip]."
 grand_embassy.5.f: "Ещё можно нанести визит в державу [target_5.GetNameWithNoTooltip]."
 grand_embassy.discretion_down_5_tt: "Укрыться всё труднее (#R -5#! Скрытность)"
 grand_embassy.discretion_down_10_tt: "Двор начинает подозревать (#R -10#! Скрытность)"
 grand_embassy.discretion_down_20_tt: "Слишком большая благосклонность привлекает слишком много глаз (#R -20#! Скрытность)"
 grand_embassy.discretion_down_30_tt: "Маскировка раскрыта (#R -30#! Скрытность)"
 grand_embassy.discretion_up_10_tt: "Мы не попались на глаза (#G +10#! Скрытность)"
 grand_embassy.discretion_set_0_tt: "Притворству конец (Скрытность: 0)"
 grand_embassy.modernization_up_0to10_tt: "Урок усваивается лучше без посторонних глаз (#G от +0 до +10#! Модернизация)"
 grand_embassy.opportunities_set_1_tt: "Чужаку показывают немногое (Возможности: 1)"
 grand_embassy.opportunities_set_2_tt: "Некоторые двери открываются в любом случае (Возможности: 2)"
 grand_embassy.opportunities_set_3_tt: "Перед нами открыты все двери (Возможности: 3)"
 grand_embassy.opportunities_set_4_tt: "От нас ничего не утаивают (Возможности: 4)"
 grand_embassy.opportunities_up_1_tt: "Приглашение открывает ещё одну дверь (#G +1#! Возможности)"
 grand_embassy.opportunities_up_2_tt: "Настойчивость, пусть и не слишком достойная, открывает ещё две (#G +2#! Возможности)"
 grand_embassy.opportunities_down_1_tt: "День потрачен (#R -1#! Возможности)"
 humiliated_grand_embassy: "Великое посольство унижено"
 grand_embassy.8.title: "Беда дома"
 grand_embassy.8.desc: "До делегации дошли вести, что на родине начались беспорядки. Пока [target_ruler.GetName] находится за границей, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] желают знать, почему их [ROOT.GetCountry.GetGovernment.GetRulerTitle] отсутствует. Прервать путешествие сейчас — значит вернуться домой ни с чем. Продолжить путь — значит ещё какое-то время править заочно."
 grand_embassy.8.a: "Мы должны немедленно вернуться домой."
 grand_embassy.8.b: "Уроки, которые ещё предстоит усвоить, стоят такой цены."
 grand_embassy.modernization_up_5_tt: "Урок усвоен хорошо (#G +5#! Модернизация)"
 grand_embassy.modernization_up_15_tt: "Урок усвоен в совершенстве (#G +15#! Модернизация)"
 grand_embassy.discretion_up_20_tt: "За монету можно купить немало забывчивости (#G +20#! Скрытность)"
 grand_embassy.9.title: "Счётная контора"
 grand_embassy.9.desc: "В державе [embassy_country.GetName] хранитель счетов проводит нас по книгам учёта и податным спискам, благодаря которым работает казна. Испачканные чернилами пальцы без малейших колебаний скользят по каждому столбцу, а итоги, кажется, никогда не лгут. Счетовод записывает каждую сумму дважды — один раз как причитающуюся, другой как уплаченную, — чтобы ни одна монета не ускользнула незамеченной, и ещё до конца недели сверяет записи с портовыми описями грузов. Здесь есть чему поучиться — тем, кто готов заплатить за время счетовода и кому хватит терпения проследить за методом до конца."
 grand_embassy.9.a: "Принять метод к сведению."
 grand_embassy.9.b: "Заплатить, чтобы изучить реестры полностью."
 grand_embassy.9.c: "Заплатить за доступ ко всем книгам и остаться, чтобы освоить их в совершенстве."
 grand_embassy.10.title: "Составители альманахов"
 grand_embassy.10.desc: "Общество писцов в городе [embassy_country.GetCapital.GetName] взялось подсчитывать всё подряд: рождения, урожаи, корабли в порту, даже цену хлеба от недели к неделе. Их книги занимают целые полки, каждый столбец датирован и сопоставлен с предыдущим, пока сами числа не начинают рассказывать историю, какую не поведал бы ни один летописец. Их альманахи будто бы показывают державу вернее любой хроники, предсказывая и голод, и изобилие по закономерностям, которые, похоже, замечают только они. За плату они объяснят свои методы любому, у кого хватит терпения высидеть всю арифметику."
 grand_embassy.10.a: "Принять их методы к сведению."
 grand_embassy.10.b: "Заплатить за полный рассказ об их ремесле."
 grand_embassy.10.c: "Заплатить за полный обзор и остаться, чтобы освоить его в совершенстве."
 grand_embassy.11.b: "Заплатить придворному за более подробный урок."
 grand_embassy.11.c: "Заплатить за полный урок и остаться, чтобы освоить его в совершенстве."
 grand_embassy.12.b: "Заплатить за вход в этот круг."
 grand_embassy.12.c: "Заплатить за полноправное место в кругу и остаться, чтобы освоить всё в совершенстве."
 grand_embassy.13.title: "В литейном цехе"
 grand_embassy.13.desc: "Литейщики державы [embassy_country.GetName] отливают пушки способами, за знание которых наши оружейники дорого бы заплатили: состав сплава, очертания формы, время остывания. Над жерлами печей дрожит раскалённый воздух, а работники движутся вокруг расплавленного металла с выверенным спокойствием, в котором видна долгая привычка, а не просто умение. Мастер литейного цеха, весь в потёках пота и явно гордый своей работой, готов рассказать больше — за плату, — и, похоже, ничто не доставляет ему большего удовольствия, чем зрители, которые действительно понимают, на что смотрят."
 grand_embassy.13.a: "Понаблюдать за отливкой."
 grand_embassy.13.b: "Заплатить мастеру, чтобы он объяснил своё ремесло."
 grand_embassy.13.c: "Заплатить мастеру сполна и остаться, чтобы освоить ремесло в совершенстве."
 grand_embassy.14.title: "Учебный плац"
 grand_embassy.14.desc: "На учебном плацу за городом [embassy_country.GetCapital.GetName] роты перестраиваются и перезаряжают оружие в ногу, быстрее, чем смогло бы любое наше ополчение; сапоги бьют в утоптанную землю в ритме, который, кажется, никогда не сбивается. Офицеры выкрикивают команды, и ряды отвечают раньше, чем слова успевают сорваться с губ, а весь строй разворачивается как единое тело, а не сотня отдельных людей. Польщённый нашим вниманием, сержант предлагает показать всю муштру целиком — от первой команды до последнего залпа."
 grand_embassy.14.a: "Понаблюдать за учениями."
 grand_embassy.14.b: "Заплатить сержанту, чтобы рассмотреть всё поближе."
 grand_embassy.14.c: "Заплатить сержанту сполна и остаться, чтобы освоить строевую выучку в совершенстве."
 grand_embassy.15.title: "Слово в нужное ухо"
 grand_embassy.15.desc: "Камергер, устраивающий наши аудиенции, негромко даёт понять, что подарок в нужные руки способен открыть очень многие двери и что некоторые имена в некоторых списках имеют обыкновение забываться, стоит монете перейти из рук в руки. Он упоминает об этом почти мимоходом, как говорят о погоде, и ждёт, поймём ли мы намёк. Дело это мелкое и вполне обычное при любом дворе, хотя цена, как правило, растёт с каждой новой просьбой."
 grand_embassy.15.a: "Преподнести привычный подарок."
 grand_embassy.15.b: "Преподнести куда более щедрый подарок."
 grand_embassy.16.title: "Осмотрительный посредник"
 grand_embassy.16.desc: "Посредник, который зарабатывает на жизнь тем, что облегчает путь иноземным гостям, предлагает свои услуги и уверяет, что у него есть связи в каждой караульне и на каждой таможенной заставе отсюда до самой границы. Он говорит осторожными полуфразами, никогда не называя прямо, кто ему обязан, — лишь то, что такие люди есть. За плату он может позаботиться о том, чтобы вопросов о том, куда и зачем направляется делегация, задавали поменьше, а ответы, если уж станут допытываться, звучали удовлетворительно расплывчато."
 grand_embassy.16.a: "Нанять посредника."
 grand_embassy.16.b: "Нанять посредника и вдобавок заплатить за его молчание."
 grand_embassy.17.title: "Длинный язык"
 grand_embassy.17.desc: "Один из членов нашей свиты, изрядно выпив в таверне и желая произвести впечатление на компанию незнакомцев, сказал куда больше, чем следовало, о том, кто на самом деле возглавляет эту делегацию. Наутро он даже не помнит своих слов, зато их помнит трактирщик — и все, кто пил за соседним столом. Слух уже расходится по людским, передаваясь с тем особым смаком, который приберегают для тайн, слишком хороших, чтобы их хранить."
 grand_embassy.17.a: "Теперь уже ничего не поделаешь."
 grand_embassy.17.b: "Заплатить, чтобы слух заглох."
 grand_embassy.18.title: "Узнавание на улице"
 grand_embassy.18.desc: "Купец, который когда-то, много лет назад и в более счастливые времена, торговал в державе [ROOT.GetCountry.GetName], проходит мимо делегации на улице и замирает на полушаге: его взгляд на миг дольше, чем следовало бы, задерживается на лице того, кого зовут [target_ruler.GetName], — после чего купец молча спешит прочь. Ошибиться в мелькнувшем на нём выражении невозможно: это не праздное любопытство, а внезапное, ошеломлённое узнавание. Он точно знает, кого увидел, и оставит ли он это при себе — от нас никак не зависит."
 grand_embassy.18.a: "Остаётся надеяться, что он будет держать язык за зубами."
 grand_embassy.18.b: "Найти его и заплатить за молчание."
 grand_embassy.19.title: "Любопытный трактирщик"
 grand_embassy.19.desc: "У трактирщика, у которого остановилась делегация, слишком много вопросов, и каждый задан с нарочитой небрежностью человека, который уже догадывается, что ответы важны: почему столь знатная свита путешествует так скромно, почему монета всегда наготове и её никогда не пересчитывают дважды, почему никто в отряде не смотрит ему в глаза, когда он спрашивает об их делах. Он ещё не подозревает, а лишь любопытствует, перебирая в уме мелкие странности, как перебирают монету, проверяя, не обрезана ли она. Долго это может не продлиться."
 grand_embassy.19.a: "Отвечать как можно меньше."
 grand_embassy.19.b: "Заплатить ему достаточно, чтобы он перестал спрашивать."
 grand_embassy.20.title: "Перехваченное письмо"
 grand_embassy.20.desc: "Письмо на родину, в котором прямо названо имя — [target_ruler.GetName] — и истинная цель делегации описана подробнее, чем допустила бы любая осторожность, пропало где-то между гонцом и кораблём. Ни требования выкупа, ни обвинений, ни малейшего следа — и это по-своему тревожнее, чем если бы они были. Где оно оказалось, кто его прочёл и что намерен делать с узнанным, мы сказать не можем."
 grand_embassy.20.a: "Вернуть его уже невозможно."
 grand_embassy.20.b: "Не жалеть денег, чтобы найти его и сжечь."
 grand_embassy.21.title: "Пир в нашу честь"
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] устраивает пир в честь делегации — с тостами, подношениями и речами, которых хватит на целый день; каждая перемена блюд изысканнее предыдущей, будто кухни соревнуются между собой. Каждое блюдо нужно похвалить, на каждый тост ответить тем же и каждого многословного сановника выслушать до конца, сколь бы мало он ни говорил по существу. Отказаться — значит нанести оскорбление; прийти — значит целиком потерять день на церемонии и полные тарелки."
 grand_embassy.21.a: "Высидеть до конца."
 grand_embassy.21.b: "Ускользнуть, чтобы увидеть что-нибудь более полезное."
 grand_embassy.22.title: "Приставленный провожатый"
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle] приставляет к делегации чиновника, который должен сопровождать каждый наш шаг: любезного, неутомимого и твёрдо решившего, что мы не увидим ничего, кроме садов и галерей, как бы вежливо мы ни просили о большем. На каждый вопрос у него готов ответ, на каждую паузу — отвлекающий манёвр, и он возвращает разговор к фонтанам и фрескам всякий раз, когда тот подбирается слишком близко к чему-нибудь полезному. Мастерские остаются наглухо закрыты, сколько бы мы ни просили."
 grand_embassy.22.a: "Следовать, куда ведут."
 grand_embassy.22.b: "Настоять на большем, как подобает гостям нашего ранга."
 grand_embassy.23.title: "Долгая аудиенция"
 grand_embassy.23.desc: "Аудиенция у мелкого чиновника тянется часами: обмен любезностями, восхищение подарками, ни слова по существу — одни и те же учтивости повторяются в слегка ином порядке, пока совсем не теряют смысл. Он, похоже, никуда не спешит и наслаждается вниманием иноземных гостей куда больше, чем сутью того, о чём они могли бы говорить. Когда аудиенция наконец заканчивается, время для чего-либо полезного давно упущено."
 grand_embassy.23.a: "Вежливо вытерпеть."
 grand_embassy.23.b: "Оборвать аудиенцию — и пусть чины обижаются."
 grand_embassy.24.title: "Сговорчивый управитель"
 grand_embassy.24.desc: "Управитель, ведущий ежедневный учёт двора, намекает — с той осторожностью, что выдаёт человека, делавшего это и прежде, — что за должное вознаграждение некоторые имена могут попросту не попасть в записи. Он не просит напрямую: он позволяет просить тишине и с выверенным терпением ждёт, когда мы её нарушим."
 grand_embassy.24.a: "Заплатить управителю, чтобы записи стали скуднее."
 grand_embassy.24.b: "Заплатить управителю, чтобы записи бесследно пропали."
 grand_embassy.25.title: "Слух-приманка"
 grand_embassy.25.desc: "Делегация соперников от двора поменьше, прибывшая почти одновременно с нашей, вызывает куда больше пересудов: она шумная, бесцеремонная, и обсуждать её гораздо проще. Немного монет, розданных нужным слугам, помогут сохранить такое положение, направив все праздные языки на их приезды и отъезды вместо наших."
 grand_embassy.25.a: "Раздать немного монет."
 grand_embassy.25.b: "Раздать очень много монет."
 grand_embassy.26.title: "Безмолвный проводник"
 grand_embassy.26.desc: "Местный проводник, знающий, какие улицы и двери укрыты от чужих глаз и в какие часы стража смотрит в другую сторону, предлагает незаметно сопровождать делегацию во всех её передвижениях. Он не спрашивает, зачем нужна такая осторожность, — лишь во сколько мы её ценим."
 grand_embassy.26.a: "Нанять проводника."
 grand_embassy.26.b: "Нанять проводника и вдобавок заплатить за особую осторожность."
