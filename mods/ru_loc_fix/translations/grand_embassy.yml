l_russian:
 grand_embassy.discretion_down_4_tt: "Проблеск узнавания (#R -4#! Скрытность)"
 grand_embassy.3.title: "Делегация при дворе"
 grand_embassy.9.desc: "В державе [embassy_country.GetName] хранитель счетов проводит нас по книгам учёта и податным спискам, благодаря которым работает казна. Испачканные чернилами пальцы без малейших колебаний скользят по каждому столбцу, а итоги, кажется, никогда не лгут. Счетовод записывает каждую сумму дважды — один раз как причитающуюся, другой как уплаченную, — чтобы ни одна монета не ускользнула незамеченной, и ещё до конца недели сверяет записи с портовыми описями грузов. Здесь есть чему поучиться — тем, кто готов заплатить за время счетовода и кому хватит терпения проследить за методом до конца."
 grand_embassy.18.desc: "Купец, который когда-то, много лет назад и в более счастливые времена, торговал в державе [ROOT.GetCountry.GetName], проходит мимо делегации на улице и замирает на полушаге: его взгляд на миг дольше, чем следовало бы, задерживается на лице того, кого зовут [target_ruler.GetName], — после чего купец молча спешит прочь. Ошибиться в мелькнувшем на нём выражении невозможно: это не праздное любопытство, а внезапное, ошеломлённое узнавание. Он точно знает, кого увидел, и оставит ли он это при себе — от нас никак не зависит."
