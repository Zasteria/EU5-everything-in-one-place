l_russian:
 grand_embassy.2.a: "Пусть говорит [figurehead.GetShortNameWithNoTooltip], а [target_ruler.GetShortNameWithNoTooltip] останется среди свиты."
 grand_embassy.2.b: "Представить [target_ruler.GetShortNameWithNoTooltip] открыто — пусть все увидят [target_ruler.GetHerHim] без маски."
 grand_embassy.2.c: "Обойти [embassy_country.GetGovernment.GetCourtTitle] стороной. Мы приехали не для того, чтобы показываться."
 grand_embassy.3.a: "Открыть им доступ."
 grand_embassy.3.b: "Наши чудеса открыты для всех."
 grand_embassy.3.c: "Мы не позволим чужеземцам выведать наши секреты."
 grand_embassy.3.d: "Открыть им доступ, но без огласки."
 grand_embassy.4.desc: "Теперь, когда стало известно, кто на самом деле путешествует с делегацией, [embassy_country.GetGovernment.GetCourtTitle] державы [embassy_country.GetName] передал нам приглашение: задержаться ещё ненадолго и увидеть больше из того, что здесь стоит увидеть."
 grand_embassy.4.a: "С благодарностью принять приглашение."
 grand_embassy.4.b: "Упросить хозяев позволить нам задержаться ещё дольше."
 grand_embassy.7.a: "Вернуться домой."
 grand_embassy.7.b: "Отправиться дальше — в [target_1.GetNameWithNoTooltip]."
 grand_embassy.5.a: "Вернуться домой."
 grand_embassy.5.b: "Попытаться спасти хоть что-то в [target_1.GetNameWithNoTooltip]."
 grand_embassy.discretion_down_4_tt: "Проблеск узнавания (#R -4#! Осторожность)"
 grand_embassy.11.title: "Придворная мода"
 grand_embassy.11.desc: "Покрой камзола, посадка парика, должная глубина поклона: придворные в [embassy_country.GetName] изучают всё это так же пристально, как любой договор, а неудачная длина подола может стоить репутации, на восстановление которой уйдут годы. Каждая складка и каждое перо несут смысл, недоступный непосвящённым, и делегацию, одетую не так, как подобает, здесь по-настоящему и не замечают. Один из придворных негромко предлагает объяснить, что здесь носят и почему, кому следует кланяться первым — и насколько низко."
 grand_embassy.11.a: "Наблюдать и запоминать."
 grand_embassy.12.title: "Салон идей"
 grand_embassy.12.desc: "В особняке неподалёку от дворца купцы, учёные и праздные дворяне почти каждый вечер собираются за кофе, чтобы спорить о том, о чём прежде предпочитали молчать: о налогах, о вере и о том, где пролегают пределы власти короны. Беседы затягиваются допоздна и становятся всё громче по мере того, как догорают свечи, и никого, похоже, не заботит, кто слушает, — лишь бы и ему было что сказать. Добиться приглашения в этот круг, пусть даже чужестранцу, вполне возможно — если кофе хорош, а суждения смелы."
 grand_embassy.12.a: "Сидеть тихо и слушать."
