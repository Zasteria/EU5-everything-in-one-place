l_russian:
 cartographic_survey_events.1.a: "Заказать лучшие латунные инструменты и нанять лучших картографов."
 cartographic_survey_events.1.b: "Хватит и обычных картографов. Излишества ни к чему."
 cartographic_survey_events.10.a: "Раздать карту рыбацким деревням — на пользу торговле."
 cartographic_survey_events.11.a: "Отвести лучшие рощи под [ROOT.GetCountry.GetGovernment.GetAdjective]ий корабельный лес."
 cartographic_survey_events.12.title: "Соляные промыслы взяты на учёт"
 cartographic_survey_events.12.desc: "Съёмочное судно занесло в журнал каждую выпарную площадку, где добывается [ShowGoodsName('salt')], каждый рассольный источник и каждую отмель вдоль побережья у [target_location.GetName]. Пересчитаны солеварные котлы, записаны привычные сезоны работ, опрошены местные торговцы, что возят [ShowGoodsNameWithNoTooltip('salt')], — о ценах, о спросе и о путях, по которым [ShowGoodsNameWithNoTooltip('salt')] уходит вглубь страны. Получившаяся карта открывает прибрежное хозяйство, в котором сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» до сих пор почти не разбиралось и которое принесло бы щедрый доход, если распространить на него налог на [ShowGoodsNameWithNoTooltip('salt')]."
 cartographic_survey_events.12.a: "Отправить карту чиновникам, чтобы [ShowGoodsNameWithNoTooltip('salt')] продавалась по установленным правилам."
 cartographic_survey_events.14.a: "Отправить карту тем, кто возит [ShowGoodsNameWithNoTooltip('wine')], — пусть точнее выбирают сроки."
 cartographic_survey_events.15.desc: "Съёмка нанесла на карту местное побережье красителей в [target_location.GetName]: отмели багрянок, из которых добывают тирский пурпур, кермесовые дубы над утёсами, посадки индиго на равнинах в глубине суши — или иное местное растение либо раковину, что даёт краску, за которую платят торговцы, сбывающие [ShowGoodsName('cloth')]. На карте отмечены сезоны работ, привычные места сбора и пути, по которым [ShowGoodsName('dyes')] попадают в ткацкие города."
 cartographic_survey_events.15.a: "Отправить карту в деревни и торговцам, что сбывают [ShowGoodsNameWithNoTooltip('cloth')]."
 cartographic_survey_events.20.a: "Выставить створы и как следует нанести гавань на карту."
 cartographic_survey_events.21.a: "Отметить створные вехи. Проход ложится на карту."
 cartographic_survey_events.30.desc: "На третий день работ поднялась буря: она выбросила съёмочное судно на подветренный берег, где оно две холодные ночи билось в бурунах, и разметала шлюпки, посланные снять картографов с рабочих станций. Когда ветер стих и судно сняли с мели, сезон был уже потерян, инструменты промокли, а двух помощников боцмана похоронили в дюнах над берегом. Карта побережья у [target_location.GetName] осталась такой же пустой, как прежде."
 cartographic_survey_events.30.a: "Двигаться дальше. Слишком поздно начинать сезон заново."
 cartographic_survey_events.31.a: "Починить судно. По крайней мере, мель теперь на нашей карте."
 cartographic_survey_events.32.desc: "Судно без флага, под латинскими парусами и явно вооружённое, внезапно вынырнуло из дымки и направилось к съёмочному судну, стоявшему на якоре в [target_location.GetName]. Нашим людям, работавшим на берегу с инструментами, пришлось бросить работу, сесть в шлюпки и вернуться на корабль с недописанными журналами. Неизвестное судно полдня шло следом, а затем отвалило курсом, который указывает на враждебный порт приписки, — и съёмка этого участка побережья пошла прахом. Картографов теперь не уговорить вернуться."
 cartographic_survey_events.32.a: "Двигаться дальше. Под враждебным взором карты не составить."
