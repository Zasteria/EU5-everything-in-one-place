l_russian:
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nСегодня от былого великолепия почти ничего не осталось. Внутренние неурядицы сильно подорвали власть нашего правителя — [ROOT.GetCountry.GetGovernment.GetRulerTitle], — который зовётся «$rank_empire_muslim_ruler_male$» лишь на словах. Мы должны вернуть державе [ROOT.GetCountry.GetLongName] власть халифа!"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nХотя в следующем столетии эта власть пошатнулась, нам удалось уберечь державу [ROOT.GetCountry.GetLongName] от падения в безвестность. Ныне [ROOT.GetCountry.GetFlavorRank] снова входит в число главных государств [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]ого мира."
 flavor_tun.4.desc: "[aging_monarch.GetName] всё сильнее тревожится о самом мрачном, но и самом важном решении, какое только приходится принимать стареющему монарху: о выборе [aging_monarch.GetHerHis] преемника. Казалось бы, ответ очевиден: [preferred_heir.GetName] всегда [Select_CString(preferred_heir.IsFemale, 'была любимицей', 'был любимцем')] нашего дорогого правителя — [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Загвоздка в других [aging_monarch.GetHerHis] детях. Это [future_usurper.GetName], [Select_CString(future_usurper.IsFemale, 'которая', 'который')] помогает вести дела правительства в городе [ROOT.GetCountry.GetCapital.GetName], и [third_way.GetName] из страны [target_country2.GetName] — возможный претендент на престол.\n\nЭтот выбор надолго определит стабильность державы [ROOT.GetCountry.GetLongName] — и тогда, когда [aging_monarch.GetShortNameWithNoTooltip] уже не будет в живых."
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName] может попытаться узурпировать престол, который занимает [THIS.GetCharacter.GetName]"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "Если не случится узурпации, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] взойдёт на престол страны [from_country.GetName], объединив обе державы под [from_country.GetAdjectiveWithNoTooltip]им знаменем"
 flavor_tun.8.desc: "Престол державы [from_country.GetLongName] по праву наследования должен был перейти к [target_character2.GetName], однако власть [Select_CString(target_character.IsFemale, 'узурпировала', 'узурпировал')] [target_character2.GetHerHis] [target_character.GetSisterBrother] — [target_character.GetName]. [Select_CString(target_character.IsFemale, 'Она', 'Он')] стремительно [Select_CString(target_character.IsFemale, 'взяла', 'взял')] под контроль всю державу ([from_country.GetFlavorRank]) и [Select_CString(target_character.IsFemale, 'подчинила', 'подчинил')] себе двор — [from_country.GetGovernment.GetCourtTitle].\n\nКакое унижение: [target_character2.GetShortNameWithNoTooltip] не может стерпеть, что [target_character2.GetHerHis] имя так запятнано! [target_character.GetShortNameWithNoTooltip] не уйдёт от возмездия."
 tun_additional_benefits_for_farfanes_tt: "[ShowGovernmentReformName('catalan_merchant_privileges')] даёт бонусы к показателю «[ShowModifierTypeName]» в зависимости от количества отрядов «[ShowUnitDefinitionName('a_farfanes')]»"
 flavor_tun.11.desc: "Децентрализация державы [ROOT.GetCountry.GetLongName] вырвана с корнем. Время, когда действовал принцип «[ShowGovernmentReformName('tun_strong_familial_governors')]», прошло, и весь регион [ShowScriptedGeographyName('ifriqiya_geography')] вновь объединён под знамёнами рода [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. Больше [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие сельские земли не будут страдать от разгула преступности; больше [ROOT.GetCountry.GetAdjectiveWithNoTooltip]их эмиров не будет шантажировать сословие «[ShowEstateTypeName('nobles_estate')]»; больше [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое государство не будет зависеть от поддержки чужеземцев.\n\nНастал час расплаты для старого порядка — и прекрасная возможность открыть новую эпоху."
 flavor_tun.13.desc: "[ShowReligionGroupAdjective('christian')]ие купцы, торгующие в стране [ROOT.GetCountry.GetName], уже получили обширные права — [ShowGovernmentReformName('catalan_merchant_privileges')]. И всё же, несмотря на это, несмотря на кварталы, которые мы так щедро им отводим, на право судиться лишь у своих, на дарованную им свободу вероисповедания, [target_country.GetAdjective]ие [target_country.GetGovernment.GetEstateName('burghers_estate')] по-прежнему требуют большего — иначе их родина может и вовсе прекратить с нами торговлю."
 tun_economic_stranglehold_tt: "Показатель «[ShowModifierTypeName('global_merchant_power')]» по линии «[ShowGovernmentReformName('catalan_merchant_privileges')]» снизится на #R -10.0%#!"
