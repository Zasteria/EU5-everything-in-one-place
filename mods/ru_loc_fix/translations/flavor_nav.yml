l_russian:
 nav_appanage_support_for_french_throne_tt: "Если [ROOT.GetCountry.GetNameWithNoTooltip] — апанаж, то при отношениях #G +150#! с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
 flavor_nav.10.entry: "Столкновение Легисамонов и Самудио"
 flavor_nav.13.a: "[target_character.GetHeShe|U] [Select_CString(target_character.IsFemale, 'станет отличной наставницей', 'станет отличным наставником')]."
 flavor_nav.14.b: "[target_character.GetHerHis|U] влияние вызывает тревогу: [scope_our_consort.GetNameWithNoTooltip] слишком к нему прислушивается. Нужно их разлучить."
 flavor_nav.15.b: "Встать на сторону законного правителя державы [ROOT.GetCountry.GetNameWithNoTooltip] — [the_legal_heir.GetNameWithNoTooltip]!"
 flavor_nav.16.c: "[target_character.GetSheHe|U] [Select_CString(target_character.IsFemale, 'должна быть остановлена', 'должен быть остановлен')]."
 navarre_charles_ii_claim_to_france.desc: "Пусть [GetCharacter('nav_jeanne_ii_capet').GetName] и отреклась, и [GetCharacter('nav_jeanne_ii_capet').GetHerHis] притязания на престол державы [GetCountry('FRA').GetNameWithNoTooltip] угасли, [GetCharacter('nav_charles_ii_evreux').GetName] — прямой потомок старого короля по крови: его предок — [GetCharacter('fra_louis_x_capet').GetName]. И даже если [ShowHeirSelectionName('salic_law')] неправедно объявит, что [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] не может наследовать, права, которые имеет [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip], всё равно сильнее, чем у нынешних правителей державы [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.10.desc: "Роды Легисамон и Самудьо давно имеют большое влияние в державе [ROOT.GetCountry.GetName], но столь же давно враждуют друг с другом. Пользуясь безвластием, которое принесла [ShowDisasterNameWithNoTooltip('castilian_civil_war')], оба рода постоянно сходятся в стычках по всему северу региона [ShowRegionName('iberia_region')]. Однако последнее столкновение в районе [target_location.GetName] обернулось бедой для этого места ([target_location.GetRank.GetName]): пострадала большая часть жителей.\n\nВражда дошла до опасной черты, и многие просят правителя по имени [our_ruler.GetNameWithNoTooltip] употребить всю власть, какой [our_ruler.GetSheHe] располагает, чтобы ослабить враждующие роды."
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] вступит в войну, которую ведёт [target_character.GetName] за власть над регионом [ShowRegionName('france_region')]"
 navarre_charles_ii_claim_to_france_appanage_route.a: "Пришло время развязать гражданскую войну и добиться престола!"
