l_russian:
 flavor_nav.1.desc: "Взойдя в 1329 году на престол державы [ROOT.GetCountry.GetName], [target_character.GetName] и [target_character_2.GetName] правят рука об руку, и [ROOT.GetCountry.GetFlavorRank] не знает при них раздоров; однако соправители явно отдают предпочтение владениям в регионе [ShowRegionName('france_region')], которыми располагает [target_character_2.GetNameWithNoTooltip], и нередко уезжают туда — [ROOT.GetCountry.GetNameWithNoTooltip] подолгу остаётся без государей, пока они живут в своих [ShowCultureGroupNameWithNoTooltip('french_group')]их владениях.\n\nХотя в отсутствие правителей [ROOT.GetCountry.GetGovernment.GetCourtTitle] нашёл немало способных регентов и [ROOT.GetCountry.GetFlavorRank] не осталось без управления, в последние годы недовольство всё растёт: многие [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие сеньоры желают просить обоих государей надолго обосноваться в городе [ROOT.GetCountry.GetCapital.GetName], дабы [ROOT.GetCountry.GetFlavorRank] не показалось слабым в глазах алчных иноземных держав."
 flavor_nav.3.desc: "Унаследовав земли, которыми владели [GetCharacter('nav_philip_iii_evreux').GetName] и [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] правит теперь обширными владениями: в них входят [ROOT.GetCountry.GetName] и ряд земель в регионе [ShowRegionName('france_region')]. Хотя [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] и [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] правили совместно и [ROOT.GetCountry.GetNameWithNoTooltip] была их общей державой, [ROOT.GetCountry.GetFlavorRank] видело их лишь изредка: сами они предпочитали жить в регионе [ShowRegionNameWithNoTooltip('france_region')].\n\nТеперь, когда [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол, [ROOT.GetCountry.GetGovernment.GetCourtTitle] полон союзников, и многие из них настойчиво советуют [target_character.GetHerHim] надолго обосноваться в державе [ROOT.GetCountry.GetNameWithNoTooltip]; другие же полагают, что [ROOT.GetCountry.GetGovernment.GetRulerTitle] может питать куда более высокие замыслы — вплоть до спорного престола, ведь [ShowRegionNameWithNoTooltip('france_region')] до сих пор не знает бесспорного государя."
 nav_will_be_able_to_rally_other_appanages_tt: "Если наши отношения с каким-либо апанажем, которым владеет [GetCountry('FRA').GetName], достигнут #G 150#!, он охотнее поддержит нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
 flavor_nav.4.desc: "Многие и прежде подозревали, что [target_character.GetName] — [Select_CString(target_character.IsFemale, 'честолюбивая', 'честолюбивый')] [ROOT.GetCountry.GetGovernment.GetRulerTitle], но мало кто ожидал услышать о [target_character.GetHerHis] желании напрямую притязать на престол державы [fra_country.GetName]. Права, которыми обладает [target_character.GetNameWithNoTooltip], весомы, ведь [GetCharacter('nav_jeanne_ii_capet').GetShortName] происходила из династии [ShowDynastyName('capet_dynasty')]; однако одним из условий, на которых [GetCharacter('nav_jeanne_ii_capet').GetHerHis] признали наследницей державы [ROOT.GetCountry.GetName], был отказ от притязаний на престол державы [fra_country.GetNameWithNoTooltip].\n\nК тому же многие сеньоры державы [fra_country.GetNameWithNoTooltip] вряд ли в полной мере признают права, на которые притязает [target_character.GetNameWithNoTooltip], — этому препятствует древний [ShowHeirSelectionName('salic_law')]; и всё же некоторые полагают, что [target_character.GetHerHis] политического влияния в державе [fra_country.GetNameWithNoTooltip] хватит, чтобы [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'сумела', 'сумел')] переубедить самых могущественных сеньоров."
 nav_appanage_support_for_french_throne_tt: "Если [ROOT.GetCountry.GetNameWithNoTooltip] — апанаж, то при отношениях #G +150#! с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
 flavor_nav.5.desc: "Поначалу усилия, которые [target_character.GetName] [Select_CString(target_character.IsFemale, 'прилагала', 'прилагал')], чтобы заручиться поддержкой, ни к чему не приводили: немало [fra_country.GetAdjectiveWithNoTooltip]их сеньоров заявили, что [fra_ruler.GetName] остаётся для них единственным законным государем, и отвергли права, на которые притязает [target_character.GetNameWithNoTooltip]. Но если склонить на свою сторону нескольких мелких [fra_country.GetAdjectiveWithNoTooltip]их сеньоров [target_character.GetNameWithNoTooltip] всё же [Select_CString(target_character.IsFemale, 'сумела', 'сумел')], то никто из советников, которых держит при себе [target_character.GetShortNameWithNoTooltip], не ожидал, что [Select_CString(target_character_2.IsFemale, 'влиятельная', 'влиятельный')] [target_character_2.GetName] примкнёт к лагерю, который возглавляет [target_character.GetNameWithNoTooltip], и предложит [target_character_2.GetHerHis] поддержку. Хотя [target_character_2.GetNameWithNoTooltip] принадлежит к [fra_country.GetAdjectiveWithNoTooltip]ому сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]», [Select_CString(target_character_2.IsFemale, 'она давно стала', 'он давно стал')] сущей занозой для короны: [fra_ruler.GetNameWithNoTooltip] не раз [Select_CString(fra_ruler.IsFemale, 'видела', 'видел')], как в Генеральных штатах срываются многие [fra_ruler.GetHerHis] начинания. Без сомнения, [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'стала', 'стал')] бы бесценным приобретением, однако кое-кто опасается, что [target_character_2.GetHerHis] устремления могут разойтись с замыслами, которые лелеет [target_character.GetNameWithNoTooltip], а потому [target_character_2.GetSheHe] может оказаться обузой.\n\nКроме того, [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'принесла', 'принёс')] весть: сеньоры державы [nrm_country.GetName] недовольны тем, как правит [fra_ruler.GetNameWithNoTooltip], и, вероятно, охотно поддержат притязания, которые выдвигает [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.6.desc: "Хотя [target_character.GetName] в последние годы [Select_CString(target_character.IsFemale, 'всё чаще хворала', 'всё чаще хворал')], [ROOT.GetCountry.GetGovernment.GetCourtTitle] был потрясён известием: минувшей ночью [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'погибла', 'погиб')] при пожаре в [target_character.GetHerHis] покоях. Слухи, которыми полнится [ROOT.GetCountry.GetGovernment.GetCourtTitle], шепчут, что во время лечения от [target_character.GetHerHis] недуга свеча упала на ложе, где [Select_CString(target_character.IsFemale, 'лежала', 'лежал')] [target_character.GetNameWithNoTooltip], и постель вспыхнула.\n\nТеперь на престол восходит [scope_our_heir.GetName], и честолюбия у нового государя меньше, чем было у [our_ruler.GetHerHis] предшественника; многие гадают, какими запомнят летописцы державы [ROOT.GetCountry.GetName] годы, когда [Select_CString(target_character.IsFemale, 'правила', 'правил')] [target_character.GetNameWithNoTooltip]."
 flavor_nav.6.a: "[target_character.GetHerHis|U] правление запомнят как честолюбивое, но ужасное."
 flavor_nav.6.b: "[target_character.GetSheHe|U] войдёт в историю как [Select_CString(target_character.IsFemale, 'покорительница', 'покоритель')] — ведь перед [Select_CString(target_character.IsFemale, 'ней', 'ним')] склонилась [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c: "[target_character.GetSheHe|U] запомнится тем, что [target_character.GetHerHis] сердце принадлежало державе [ROOT.GetCountry.GetNameWithNoTooltip], несмотря на [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')]ое происхождение."
 flavor_nav.7.desc: "Хотя в прошлом [ROOT.GetCountry.GetName] и [cas_country.GetName] не раз враждовали, правители державы [cas_country.GetNameWithNoTooltip] никогда не стремились покорить [ROOT.GetCountry.GetFlavorRank] целиком. Однако в пограничных землях — [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')] и [ShowProvinceDefinitionName('alava_province')] — уже давно нарастает напряжённость между самыми могущественными местными семействами: границы края очерчены плохо.\n\nПредставители, которых направили [cas_country.GetNameWithNoTooltip] и [our_ruler.GetName], трудились над разрешением пограничных споров, однако [ShowDisasterNameWithNoTooltip('castilian_civil_war')], охватившая державу [cas_country.GetNameWithNoTooltip], надолго застопорила переговоры, и вражда между видными местными династиями лишь усилилась.\n\nТеперь, когда держава [cas_country.GetNameWithNoTooltip] погрязла во внутренних распрях, представители этих семейств обратились к государю — [our_ruler.GetNameWithNoTooltip] — с прошением начать вторжение и занять спорные земли."
 flavor_nav.8.desc: "[ShowDisasterNameWithNoTooltip('castilian_civil_war')] окончена, однако её отголоски по-прежнему ощущаются по всему региону [ShowRegionName('iberia_region')]. Пограничные земли лишились большей части гарнизонов, и давняя вражда между местными семействами переросла в открытую войну.\n\nПоскольку держава [cas_country.GetName] ослаблена, [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetName] вряд ли сумеет в одиночку унять столь яростную смуту."
 flavor_nav.9.desc: "Хотя [ShowProvinceDefinitionName('biscay_province')] издавна служит яблоком раздора, за которое борются [cas_country.GetName] и [ROOT.GetCountry.GetName], этот край — родина многих знатных семейств, из которых самыми влиятельными и верными вассалами показали себя Аро. Однако [cas_country.GetNameWithNoTooltip] принялась напрямую упразднять титулы в этих землях, а затем и присоединять спорные владения, входящие в провинцию [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')].\n\nСвоими действиями [cas_country.GetNameWithNoTooltip] привела семейство Аро в ярость, и теперь Аро призывают [ROOT.GetCountry.GetGovernment.GetCourtTitle] финансировать мятежников в провинции [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')], чтобы расправиться с теми, кто поддержал [cas_country.GetAdjectiveWithNoTooltip]ую аннексию края."
 flavor_nav.10.entry: "Столкновение Легисамонов и Самудио"
 flavor_nav.11.desc: "Хотя противостояние между сторонниками [ROOT.GetCountry.GetAdjective]ой и [GetCountry('CAS').GetAdjective]ой короны опустошило край и [ShowScriptedGeographyName('nav_contested_basque_borderlands')] лежит в руинах, [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие семьи совершили почти невозможное и в значительной мере восстановили влияние державы [ROOT.GetCountry.GetNameWithNoTooltip] на всё [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. И хотя [GetCountry('CAS').GetNameWithNoTooltip] ещё может попытаться вернуть контроль над краем, это, несомненно, дорого обойдётся — [GetCountry('CAS').GetAdjectiveWithNoTooltip]ий [GetCountry('CAS').GetGovernment.GetCourtTitle] заплатит за это немалую цену."
 flavor_nav.12.desc: "Хотя эрмандады, которые есть у державы [ROOT.GetCountry.GetName], прежде не раз проявляли себя надёжными союзниками, десятилетия кровной вражды между [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ими семьями довели страсти до точки кипения.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] не поскупился: многие сановники внесли средства на содержание [ROOT.GetCountry.GetGovernment.GetAdjective|U]ой ветви эрмандад. Дело это недешёвое, но, набрав силу, эрмандады помогут утвердить власть, которой обладает [our_ruler.GetName], над враждующими семействами и раз и навсегда их обуздать."
 flavor_nav.13.a: "[target_character.GetHeShe|U] [Select_CString(target_character.IsFemale, 'станет отличной наставницей', 'станет отличным наставником')]."
 flavor_nav.14.b: "[target_character.GetHerHis|U] влияние вызывает тревогу: [scope_our_consort.GetNameWithNoTooltip] слишком к нему прислушивается. Нужно их разлучить."
 flavor_nav.15.desc: "Хотя [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'правила', 'правил')] твёрдой рукой, недавно [our_ruler.GetSheHe] [Select_CString(our_ruler.IsFemale, 'тяжело заболела и слегла', 'тяжело заболел и слёг')]. Опасаясь, что [ROOT.GetCountry.GetGovernment.GetRulerTitle] доживает последние дни, Аграмонты, для которых [the_consort_usurper.GetName] — единственный достойный государь, втайне вручили [the_consort_usurper.GetHerHim] корону державы [ROOT.GetCountry.GetName].\n\nПока [the_legal_heir.GetNameWithNoTooltip] далеко и [ROOT.GetCountry.GetGovernment.GetCourtTitle] лишён [Select_CString(the_legal_heir.IsFemale, 'её', 'его')] присмотра, кое-кто из Бомонтов втайне отправил письма [the_legal_heir.GetHerHis] свите, надеясь сообщить [the_legal_heir.GetHerHim] об измене Аграмонтов. Если письма придут вовремя, ещё можно успеть собрать достаточно сторонников, чтобы раздавить заговор Аграмонтов, прежде чем он принесёт плоды."
 flavor_nav.15.b: "Встать на сторону законного правителя державы [ROOT.GetCountry.GetNameWithNoTooltip] — [the_legal_heir.GetNameWithNoTooltip]!"
 flavor_nav.16.c: "[target_character.GetSheHe|U] [Select_CString(target_character.IsFemale, 'должна быть остановлена', 'должен быть остановлен')]."
 flavor_nav.21.historical_info: "Хотя Жанна была обручена с Педро IV Арагонским, брак так и не состоялся. Историки предполагают, что она могла страдать каким-то недугом, из-за которого считалась незавидной невестой. Её место заняла младшая сестра Мария, которая и вышла замуж за Педро.\n\nПосле этого брака Жанна была вынуждена отказаться от прав на престол и удалилась во францисканское аббатство Лоншан под Парижем, вступив в орден клариссинок."
 navarre_charles_ii_claim_to_france.desc: "Пусть [GetCharacter('nav_jeanne_ii_capet').GetName] и отреклась, и [GetCharacter('nav_jeanne_ii_capet').GetHerHis] притязания на престол державы [GetCountry('FRA').GetNameWithNoTooltip] угасли, [GetCharacter('nav_charles_ii_evreux').GetName] — прямой потомок старого короля по крови: его предок — [GetCharacter('fra_louis_x_capet').GetName]. И даже если [ShowHeirSelectionName('salic_law')] неправедно объявит, что [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] не может наследовать, права, которые имеет [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip], всё равно сильнее, чем у нынешних правителей державы [GetCountry('FRA').GetNameWithNoTooltip]!"
 nav_appanage_willingness_to_join_tt: "Если наши отношения с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] достигнут #G +150#!, они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] за престол"
 flavor_nav.10.desc: "Роды Легисамон и Самудьо давно имеют большое влияние в державе [ROOT.GetCountry.GetName], но столь же давно враждуют друг с другом. Пользуясь безвластием, которое принесла [ShowDisasterNameWithNoTooltip('castilian_civil_war')], оба рода постоянно сходятся в стычках по всему северу региона [ShowRegionName('iberia_region')]. Однако последнее столкновение в районе [target_location.GetName] обернулось бедой для этого места ([target_location.GetRank.GetName]): пострадала большая часть жителей.\n\nВражда дошла до опасной черты, и многие просят правителя по имени [our_ruler.GetNameWithNoTooltip] употребить всю власть, какой [our_ruler.GetSheHe] располагает, чтобы ослабить враждующие роды."
