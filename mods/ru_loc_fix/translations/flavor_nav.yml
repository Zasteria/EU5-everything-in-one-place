l_russian:
 nav_appanage_support_for_french_throne_tt: "Если [ROOT.GetCountry.GetNameWithNoTooltip] — апанаж, то при отношениях #G +150#! с другими апанажами державы [GetCountry('FRA').GetNameWithNoTooltip] они охотнее поддержат нас в войне против державы [GetCountry('FRA').GetNameWithNoTooltip] в рамках [Concept('decision', 'решения')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
 flavor_nav.10.entry: "Столкновение Легисамонов и Самудио"
 flavor_nav.10.desc: "Роды Легисамон и Самудьо давно имеют большое влияние в державе [ROOT.GetCountry.GetName], но столь же давно враждуют друг с другом. Пользуясь безвластием, которое принесла [ShowDisasterNameWithNoTooltip('castilian_civil_war')], оба рода постоянно сходятся в стычках по всему северу региона [ShowRegionName('iberia_region')]. Однако последнее столкновение в районе [target_location.GetName] обернулось бедой для этого места ([target_location.GetRank.GetName]): пострадала большая часть жителей.\n\nВражда дошла до опасной черты, и многие просят правителя по имени [our_ruler.GetNameWithNoTooltip] употребить всю власть, какой [our_ruler.GetSheHe] располагает, чтобы ослабить враждующие роды."
