l_russian:
 game_concept_industry_promotions: "Поддержка отраслей"
 game_concept_promote_industry: "Поддержать отрасль"
 game_concept_industry_promotion_desc: "Поддержка отрасли закрепляет одну [Concept('area', 'область')|e] за одной отраслью промышленности. Каждая отрасль охватывает набор [Concept('goods', 'товаров')|e]: её поддержка повышает [Concept('output', 'объём выпуска')|e] каждого [Concept('building', 'сооружения')|e] в этой [Concept('area', 'области')], производящего эти [Concept('goods', 'товары')], а также повышает спрос ваших [Concept('pops', 'групп населения')|e] на них по всей [Concept('country', 'державе')|e].\n\nДля поддержки отраслей требуется [Concept('advance', 'улучшение')|e] [advance_icon][ShowAdvanceName('industry_promotion_advance')]. Сколько отраслей можно поддерживать одновременно, определяет показатель «$MODIFIER_TYPE_NAME_possible_industry_promotions$»; он растёт вместе с рангом [Concept('country', 'державы')], а также благодаря вашим [Concept('government_reforms', 'государственным принципам')|e] и последующим [Concept('advances', 'улучшениям')]. Поддержку можно отменить в любой момент, чтобы освободить ячейку."
 PROMOTE_INDUSTRY_HEADER: "Поддерживаемые отрасли"
 BROWSE_INDUSTRIES: "Обзор отраслей"
 BROWSE_INDUSTRIES_DESC: "Изучите все отрасли, которые можно поддержать, а затем выберите [Concept('area', 'область')|e] для индустриализации."
 INDUSTRY_STAT_AREA_TT_TITLE: "Эта отрасль в области [Area.GetNameWithNoTooltip]"
 INDUSTRY_STAT_BUILDINGS_TT_TEXT: "Сейчас [GetAreaIndustryLevels(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|W0] [Concept('buildings_with_icon', 'сооружений')|e] в области @area! [Area.GetName] дают [GetAreaIndustryTaxBase(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|+=2] [Concept('tax_base_with_icon', 'налоговой базы')|e] и [GetAreaIndustryIncome(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|+=2] [Concept('income_with_icon', 'дохода')|e]."
 INDUSTRY_SLOT_STATS_TT_TEXT: "Ваше производство [Concept('goods', 'товаров')|e] этой отрасли в области [IndustryPromotionSlot.GetAreaName]:"
 BEST_CANDIDATE: "Рекомендуемая область: [Area.GetNameWithNoTooltip]"
 BEST_CANDIDATE_DESC: "Больше всего в этой категории сейчас производит [Concept('area_with_icon', 'область')|e] [Area.GetName]: [GetAreaIndustryTaxBase(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|+=2] [Concept('tax_base_with_icon', 'налоговой базы')|e] и [GetAreaIndustryIncome(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|+=2] [Concept('income_with_icon', 'дохода')|e] от [GetAreaIndustryLevels(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|0W] [Concept('buildings_with_icon', 'сооружений')|e] в сумме."
 CHANGE_SELECTED_INDUSTRY: "Сменить отрасль"
