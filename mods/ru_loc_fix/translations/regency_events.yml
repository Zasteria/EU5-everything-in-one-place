l_russian:
 regencies.8.a: "Возвести на престол: [council_candidate.GetShortNameWithNoTooltip]."
 regencies.8.b: "Престол дождётся законного наследника."
 regencies.8.desc: "Наследник престола так и не найден. Наша держава ([ROOT.GetCountry.GetFlavorRank]) по-прежнему в руках духовного лица по имени [target_character.GetName]. Сан не позволяет ни принять корону, ни передать её кому-либо из [target_character.GetHerHis] потомков.\n\nПредставители сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]», устав от затянувшегося регентства, выдвинули кандидатуру на престол: [council_candidate.GetName]. Так может начаться новая династия."
 regencies.8.title: "Регентский совет"
