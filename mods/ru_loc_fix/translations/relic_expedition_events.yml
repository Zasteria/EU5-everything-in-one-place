 relic_expedition_events.relic_recovered_titulus_crucis_tt: "Экспедиция обретает реликвию «$relic_titulus_crucis_found_1$» и отправляется в обратный путь"
 relic_expedition_events.12.title: "Соперники-кладоискатели"
 relic_expedition_events.12.desc: "Трактирщик, которому только в радость получить плату дважды, приносит вести, и [target_leader.GetName] узнаёт следующее: агенты соперничающей державы сидят в тех же комнатах, угощают выпивкой тех же портовых грузчиков и расспрашивают о том самом слухе, что привёл сюда и нас. Они сошли на берег на неделю раньше и с тех пор не особенно берегут деньги. В этом городе и молчание, и содействие имеют свою цену, и кто первым её заплатит, тот и сохранит след."
 relic_expedition_events.12.a: "Предложить больше, чем они. Корона перебьёт любую сумму."
 relic_expedition_events.12.b: "Пусть гоняются за этой находкой. К весне появятся другие."
 relic_expedition_events.12.c: "Подстеречь их в теснине и там покончить с делом."
 relic_expedition_events.20.title: "Животворящий Крест обретён"
 relic_expedition_events.20.desc: "До дворов христианского мира доходит весть: $relic_true_cross_found$, бесследно пропавший после разгрома при Хаттине, найден, и теперь его хранит в своей сокровищнице [relic_finder.GetLongName]. Каждый соборный капитул захочет услышать собственный рассказ о том, как его нашли, и мало кто из них сойдётся во мнении о его подлинности."
 relic_expedition_events.20.a: "Вести в христианском мире разносятся быстро."
 relic_expedition_events.21.title: "Святое копьё вновь явилось миру"
 relic_expedition_events.21.desc: "Среди верующих разносится весть: $relic_holy_lance_found$, пропавшее после того, как Первый крестовый поход покинул город [ShowLocationName('antioch')], найдено, и теперь им владеет [relic_finder.GetLongName]. Не один паломник проложит из-за этого новый маршрут."
 relic_expedition_events.21.a: "Ещё одна реликвия находит дорогу домой."
 relic_expedition_events.22.title: "Святая плащаница найдена"
 relic_expedition_events.22.desc: "По католической Европе расходятся вести: $relic_holy_shroud_found$ — полотно, о котором давно ходили разговоры, но которое так никто и не нашёл, — обретена, и теперь ею владеет [relic_finder.GetLongName]. Скептики усомнятся, как сомневались всегда. Верующие отправятся в путь в любом случае."
 relic_expedition_events.22.a: "Пусть паломники судят сами."
 relic_expedition_events.2.desc_damascus_repeat: "И снова [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] теперь знает, к кому здесь прислушиваются ([location_scope.GetRank.GetNameWithNoTooltip]) и во что это обходится."
 relic_expedition_events.2.desc_tyre_first: "Экспедиция прибывает в город [ShowLocationName('sur')]. [location_scope.GetRank.GetName] этот столь древен, что, по свидетельству Евангелий, через его земли проходил сам Христос; кроме того, это одна из последних твердынь на материке, которые крестоносцы удерживали до 1291 года. Здешнее архиепископство два столетия вело свои записи. То, что от них уцелело, разбросано по дюжине частных домов, и ни один хозяин не согласен с другим в том, что именно у него хранится."
 relic_expedition_events.3.desc_acre: "Простукиваются полые стены, переворачивается обрушившаяся кладка там, где её не тревожили поколениями. [relic_hunt_loc.GetRank.GetName] [ShowLocationNameWithNoTooltip('acre')] велик, но людей в нём почти не осталось, а один отряд может обыскать лишь малую его часть."
 relic_expedition_events.10.desc_true_cross: "Странствующий учёный, прочитавший все хроники о Хаттине, по трём рассказам, совпадающим почти случайно, сумел определить участок земли, где отступавшие рыцари, как говорят, закопали частицу реликвии «$relic_true_cross_found$», лишь бы не отдать её Саладину. Он предлагает свои записи, свои потрёпанные карты и самого себя."
 relic_expedition_events.10.desc_holy_lance: "Знаток Первого крестового похода полагает, что по собственному рассказу, который оставил [GetCharacter('koj_petrus_bartholomaeus').GetName], ему удалось найти подвал, где в 1098 году было обретено $relic_holy_lance_found$. Он утверждает, что лежавшее рядом с ним так и не было извлечено целиком. Соперничающие клирики ещё тогда называли эту мысль фантазией, но ни один из них её не опроверг."
 relic_expedition_events.10.desc_holy_shroud: "Престарелый знаток древностей почти уверовал в слух, источник которого не может толком указать: будто бы плащаницу с изображением замуровали в крипте монахи, бежавшие от набега, о котором не упоминает ни одна хроника. Он почти слеп и хочет совершить последнее открытие — и сам приведёт нас на место."
 relic_expedition_events.10.desc_holy_nail: "Знаток реликвий указывает на полуразрушенную часовню, где, по местному преданию, бежавший священник закопал гвоздь Распятия, опережая проходивших мимо солдат."
 relic_expedition_events.10.desc_true_cross_fragment: "Три поколения монастырских книг, прочитанных от корки до корки, привели учёного к скиту, покинутому в спешке, где последний отшельник, как говорят, спрятал частицу реликвии «$relic_true_cross_found$» под полом часовни, прежде чем спасаться бегством."
 relic_expedition_events.10.desc_saint_bones: "Местный агиограф, работая с рассыпающимися приходскими книгами, остановил выбор на безымянной могиле у края старого кладбища: там лежит малоизвестный святой, чьи кости спрятали, лишь бы не оставлять их враждебному войску."
 relic_expedition_events.10.desc_baptist_head: "Опираясь на обрывки хроники, найденной в монастырском архиве, учёный утверждает, что реликварий, почитаемый как глава Иоанна Крестителя, во время давней осады спрятали под полом часовни, а затем часовня обрушилась прямо на него."
 relic_expedition_events.10.desc_virgin_milk: "Учёный, ссылаясь на дневник паломника, который больше никто не удосужился прочесть, указывает на замурованную нишу в заброшенном святилище, где хранители, как говорят, спрятали сосуд с молоком Богородицы, лишь бы не отдавать его грабителям."
 relic_expedition_events.10.desc_holy_thorn: "Учёный прочитал всю частную переписку угасшего рода и проследил путь шипа из самого Тернового венца до их склепа, запечатанного со времён чумы, опустошившей дом."
 relic_expedition_events.10.desc_holy_chalice: "Здесь есть особая ветвь легенды о Граале, не имеющая ничего общего со знаменитыми притязаниями городов [ShowLocationName('genoa')] и [ShowLocationName('valencia')]. Учёный, идущий по её следу, полагает, что простая каменная чаша лежит под часовней, разрушенной во время давней осады, а прихожане её разбрелись задолго до того, как кому-то пришло в голову копать."
 relic_expedition_events.10.desc_titulus_crucis: "Местное предание гласит, что табличка с надписью с Креста вовсе не отправилась на запад. Учёный, принимающий это предание всерьёз, считает, что её замуровали в здешней часовне во время последнего отступления крестоносцев, и предлагает помочь найти ту стену."
 relic_expedition_events.clues_up_1_tt: "След становится горячее (Зацепки: #G +1#!)"
 relic_expedition_events.clues_down_1_tt: "След остывает (Зацепки: #R -1#!)"
 relic_expedition_events.retinue_up_10_tt: "Свита экспедиции растёт (Свита: #G +10#!)"
 relic_expedition_events.retinue_down_5_tt: "Свита экспедиции редеет (Свита: #R -5#!)"
 relic_expedition_events.retinue_down_8_tt: "Свита экспедиции редеет (Свита: #R -8#!)"
 relic_expedition_events.retinue_down_10_tt: "Свита экспедиции редеет (Свита: #R -10#!)"
 relic_expedition_events.retinue_down_15_tt: "Свита экспедиции редеет (Свита: #R -15#!)"
 relic_expedition_events.retinue_down_25_tt: "Свита экспедиции редеет (Свита: #R -25#!)"
 relic_expedition_announce_true_cross_tt: "Все католические правители узнают, что реликвия «$relic_true_cross_found$» найдена"
 relic_expedition_announce_holy_lance_tt: "Все католические правители узнают, что реликвия «$relic_holy_lance_found$» найдена"
 relic_expedition_announce_holy_shroud_tt: "Все католические правители узнают, что реликвия «$relic_holy_shroud_found$» найдена"
 relic_expedition_events.13.title: "Мастерская фальсификатора"
 relic_expedition_events.13.desc: "Ремесленника ловят на том, что он продаёт доверчивому паломнику палец святого, вырезанный тем же утром из баранины и окрашенный чаем. Когда на него надавили, требуя назвать, кого ещё он обманул, он вместо этого клянётся, что знает о чём-то подлинном, на что наткнулся, собирая для мастерской старое дерево и ещё более старое железо. Он назовёт квартал, но не улицу, пока не увидит монету. Слово фальсификатора стоит ровно столько, сколько стоит слово фальсификатора."
 relic_expedition_events.13.a: "Заплатить ему за то, что он утверждает, но только один раз."
 relic_expedition_events.13.b: "Пусть свита на него надавит. Страх дешевле серебра."
 relic_expedition_events.13.forger_honest_tt: "На сей раз монета покупает правду, и рассказ фальсификатора подтверждается"
 relic_expedition_events.13.forger_cheated_tt: "В названном квартале нет ничего, кроме сплетен; фальсификатору заплатили дважды за одну и ту же ложь"
 relic_expedition_events.13.threats_work_tt: "Страх развязывает то, что не смогло развязать серебро, и фальсификатор выдаёт нечто настоящее"
 relic_expedition_events.13.threats_fail_tt: "Он лишь громче визжит оправдания; угрозы свиты не принесли ничего, кроме сбитых костяшек"
 relic_expedition_events.14.title: "Песчаная буря в пути"
 relic_expedition_events.14.desc: "Около полудня на горизонте поднимается стена охристой пыли, и уже через час она поглощает дорогу. Верблюды подгибают ноги и отказываются вставать, песок забивается в каждую складку ткани и каждый бурдюк, а проводник признаёт, что больше не различает каменных пирамидок, отмечающих путь. [target_leader.GetName] может двигаться дальше вслепую или потерять несколько дней, пережидая бурю."
 relic_expedition_events.14.a: "Пробиваться сквозь бурю. Дорога не могла уйти далеко."
 relic_expedition_events.14.b: "Придавить шатры, разбить лагерь и переждать, пока не уляжется."
 relic_expedition_events.15.title: "Лихорадка"
 relic_expedition_events.15.desc_land: "Лихорадка пришла вместе с водоносами и косит людей по двое и по трое почти без предупреждения: ломота в голове на рассвете, озноб к полудню, неглубокая могила к утру второго дня. Двое лекарей отряда уже не успевают помочь всем, кто их зовёт, а здоровые начали спать подальше от больных. [target_leader.GetName] решает, сколько корона потратит на то, чтобы сдержать заразу."
 relic_expedition_events.15.desc_sea: "Лихорадка поднялась на борт вместе с последней водой, взятой в порту, и косит людей по двое и по трое почти без предупреждения: ломота в голове на рассвете, озноб к полудню, тело, скользнувшее за борт, к утру второго дня. Двое лекарей отряда уже не успевают помочь всем, кто зовёт их в тесном трюме, а здоровые начали спать так далеко от больных, как только позволяет палуба. [target_leader.GetName] решает, сколько корона потратит на то, чтобы сдержать заразу."
 relic_expedition_events.15.a: "Не жалеть средств на лечение больных и их изоляцию."
 relic_expedition_events.15.b: "Пусть идёт своим чередом. Лихорадка скоро выгорит сама."
 relic_expedition_events.16.title: "Пустынные разбойники требуют дани"
 relic_expedition_events.16.desc: "Вооружённые люди выстроились поперёк дороги там, где она спускается между двумя хребтами, — слишком многочисленные и слишком хорошо организованные для простых грабителей. Их предводитель выезжает на коне вперёд строя, называет сумму за безопасный проход и ясно даёт понять, что уже взвесил, во что ему обойдётся другой исход."
 relic_expedition_events.16.a: "Заплатить пошлину и уйти, пока он не передумал насчёт цены."
 relic_expedition_events.16.b: "Пробиться с боем. Мы зашли так далеко не для того, чтобы нас ограбили."
 relic_expedition_events.16.c: "Пусть за нас говорит наша численность. Мало кто станет спорить с таким отрядом."
 relic_expedition_events.17.title: "Слух от паломника"
 relic_expedition_events.17.desc: "На ночь постоялый двор делит с нами караван паломников, и разговор у огня, как всегда, сворачивает на реликвии. Один из них, сын торговца шерстью из глубинки, пересказывает историю, которую смутно помнит со слов дяди, умершего двадцать лет назад: монахи выносят свёрток из горящего дома, ночь на прибрежной дороге и погребение, которого никто не должен был видеть. Назвать дом он не может. Но в дороге странно уверен."
 relic_expedition_events.17.a: "Угостить его ещё одной чаркой и выпытать каждую подробность."
 relic_expedition_events.17.b: "Ещё одна байка из тысячи. Выступаем с рассветом."
 relic_expedition_events.17.tale_confirmed_tt: "Монета развязывает ему язык, и у него вырывается подробность, которой, вероятно, не стоило делиться"
 relic_expedition_events.17.tale_fades_tt: "Ещё одна чарка не помогает; с каждым пересказом подробности лишь сильнее расплываются"
 relic_expedition_events.18.title: "Деньги на исходе"
 relic_expedition_events.18.desc: "Неудачный месяц на обмене и ростовщики, вдруг ставшие осторожными с чужеземцами, оставляют казну экспедиции куда тоньше, чем рассчитывали. Жалованье свиты уже на две недели задерживается, погонщики мулов хотят получать плату монетой, которой доверяют, а не нашей, и слухи о том, что отряду не платят, разносятся по этим городам быстрее любых наших вопросов."
 relic_expedition_events.18.a: "Быстро покрыть недостачу из собственной казны короны."
 relic_expedition_events.18.b: "Пусть ещё немного подождут жалованья. Им всё равно некуда идти."
 relic_expedition_events.19.title: "Местные власти замечают нас"
 relic_expedition_events.19.desc_muslim: "Местный #italic кади#! прослышал, что чужеземцы задают острые вопросы о франкских сокровищах и о том, какие семьи что припрятали для себя, когда пали королевства. Его секретарь является с визитом — чай, комплименты и послание, адресат которого — [target_leader.GetName], а смысл под всей учтивостью вполне ясен: подобные расспросы идут куда глаже с ведома его господина и при подобающем пожертвовании на содержание мечети."
 relic_expedition_events.19.desc_christian: "Местные [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] заметили, что чужеземный отряд слишком уж пристально расспрашивает о реликвиях, которые, по их убеждению, касаются только Церкви и больше никого. [target_leader.GetName] удостаивается приёма у архидьякона со всей учтивостью; тот подолгу рассуждает о грехе алчности и не оставляет ни малейших сомнений: его благосклонность и впредь потребует дара, возложенного на алтарь."
 relic_expedition_events.19.desc_fallback: "Слухи о расспросах экспедиции дошли до ушей, которые лучше было бы не тревожить. Человек, которого никто не удосуживается представить, приходит на постоялый двор после наступления темноты, садится без приглашения и подробно объясняет, сколько неприятностей чужеземный отряд может навлечь на себя в таком городе, как этот. Предупреждение звучит неспешно, совершенно вежливо и предельно ясно."
 relic_expedition_events.19.a: "Засвидетельствовать почтение так, чтобы это видели нужные люди."
 relic_expedition_events.19.b: "Пренебречь предупреждением и продолжать работу. Времени и так мало."
