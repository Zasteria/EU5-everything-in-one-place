l_russian:
 relic_expedition_events.1.title: "Охота за реликвией"
 relic_expedition_events.1.desc: "Епископы просят, и [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] даёт согласие. Купец, вернувшийся из Леванта, рассказывает так: один дамасский торговец слышал от собственного отца, что, когда пали крестоносные королевства, немалую часть того, что франки хранили в своих церквях, не сожгли, а вывезли и закопали. Закопанное можно выкопать. А можно и купить — если найти нужный дом в нужную неделю и не торговаться там, где могут подслушать.\n\nКакая это реликвия и где она, никто не говорит. В любом порту того побережья такие истории идут за бесценок. Но эту пересказали нужным ушам."
 relic_expedition_events.1.a: "Снарядить их как следует: дары, толмач, монах, кошелёк."
 relic_expedition_events.1.b: "Один посланец и неприметный кошелёк. Меньше глаз — меньше риска."
 relic_expedition_events.1.historical_info: "В июле 1187 года Животворящий Крест вынесли на поле битвы при Хаттине, и он достался войску Саладина. Ричард Львиное Сердце, византийский император и царица Грузии пытались его выкупить — и все потерпели неудачу. Последнее достоверное свидетельство помещает его в Дамаск, после чего он полностью исчезает из источников. Святое копьё, найденное в Антиохии в 1098 году, пропало столь же бесследно, когда Первый крестовый поход двинулся дальше. Ни одна из этих утрат так и не получила объяснения — именно поэтому искатели и не прекращали поисков."
 relic_expedition_events.4.a: "Отправить необходимые средства."
 relic_expedition_events.5.desc: "[target_leader.GetName] остаётся без охраны: люди гибли по двое-трое от рук разбойников и от лихорадки или тихо дезертировали — слишком мало им платили за поиски, которым не видно конца. А без вооружённых людей за спиной никто не станет требовать у сеньора или аббата реликвию, которую те не желают отдавать.\n\nНа этом охота заканчивается."
 relic_expedition_events.10.title: "Указания учёного"
 relic_expedition_events.10.a: "Нанять местных работников. Больше рук — больше шансов на успех."
 relic_expedition_events.10.b: "Копать силами самой экспедиции. Меньше лишних вопросов."
 relic_expedition_events.10.c: "Незачем платить чужакам. Наша свита и сама может копать."
 relic_expedition_events.11.title: "Раскопки"
 relic_expedition_events.11.desc: "Земля неподатлива, и работа идёт медленно. [target_leader.GetName] теперь остаётся лишь ждать и выяснить, умеет ли учёный читать карту."
 relic_expedition_events.11.a: "Лопаты на что-то наткнулись. Ровно там, где говорил учёный."
 relic_expedition_events.11.b: "Лишь земля и щебень. Тайник уже опустошён."
