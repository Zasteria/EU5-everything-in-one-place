 relic_expedition_events.2.desc_damascus_repeat: "И снова [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] теперь знает, к кому здесь прислушиваются ([location_scope.GetRank.GetNameWithNoTooltip]) и во что это обходится."
 relic_expedition_events.2.desc_tyre_first: "Экспедиция прибывает в город [ShowLocationName('sur')]. [location_scope.GetRank.GetName] этот столь древен, что, по свидетельству Евангелий, через его земли проходил сам Христос; кроме того, это одна из последних твердынь на материке, которые крестоносцы удерживали до 1291 года. Здешнее архиепископство два столетия вело свои записи. То, что от них уцелело, разбросано по дюжине частных домов, и ни один хозяин не согласен с другим в том, что именно у него хранится."
 relic_expedition_events.3.desc_acre: "Простукиваются полые стены, переворачивается обрушившаяся кладка там, где её не тревожили поколениями. [relic_hunt_loc.GetRank.GetName] [ShowLocationNameWithNoTooltip('acre')] велик, но людей в нём почти не осталось, а один отряд может обыскать лишь малую его часть."
