l_russian:
 relic_expedition_events.10.title: "Указания учёного"
 relic_expedition_events.10.a: "Нанять местных работников. Больше рук — больше шансов на успех."
 relic_expedition_events.10.b: "Копать силами самой экспедиции. Меньше лишних вопросов."
 relic_expedition_events.10.c: "Незачем платить чужакам. Наша свита и сама может копать."
 relic_expedition_events.11.title: "Раскопки"
 relic_expedition_events.11.desc: "Земля неподатлива, и работа идёт медленно. [target_leader.GetName] теперь остаётся лишь ждать и выяснить, умеет ли учёный читать карту."
 relic_expedition_events.11.a: "Лопаты на что-то наткнулись. Ровно там, где говорил учёный."
 relic_expedition_events.11.b: "Лишь земля и щебень. Тайник уже опустошён."
 relic_expedition_events.relic_recovered_true_cross_tt: "Экспедиция обретает реликвию «$relic_true_cross_found$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_holy_lance_tt: "Экспедиция обретает реликвию «$relic_holy_lance_found$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_holy_shroud_tt: "Экспедиция обретает реликвию «$relic_holy_shroud_found$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_holy_nail_tt: "Экспедиция обретает реликвию «$relic_holy_nail_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_true_cross_fragment_tt: "Экспедиция обретает реликвию «$relic_true_cross_fragment_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_saint_bones_tt: "Экспедиция обретает реликвию «$relic_regional_saint_bones_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_baptist_head_tt: "Экспедиция обретает реликвию «$relic_baptist_head_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_virgin_milk_tt: "Экспедиция обретает реликвию «$relic_virgin_milk_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_holy_thorn_tt: "Экспедиция обретает реликвию «$relic_holy_thorn_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_holy_chalice_tt: "Экспедиция обретает реликвию «$relic_holy_chalice_found_1$» и отправляется в обратный путь"
 relic_expedition_events.relic_recovered_titulus_crucis_tt: "Экспедиция обретает реликвию «$relic_titulus_crucis_found_1$» и отправляется в обратный путь"
 relic_expedition_events.12.title: "Соперники-кладоискатели"
 relic_expedition_events.12.desc: "Трактирщик, которому только в радость получить плату дважды, приносит вести, и [target_leader.GetName] узнаёт следующее: агенты соперничающей державы сидят в тех же комнатах, угощают выпивкой тех же портовых грузчиков и расспрашивают о том самом слухе, что привёл сюда и нас. Они сошли на берег на неделю раньше и с тех пор не особенно берегут деньги. В этом городе и молчание, и содействие имеют свою цену, и кто первым её заплатит, тот и сохранит след."
 relic_expedition_events.12.a: "Предложить больше, чем они. Корона перебьёт любую сумму."
 relic_expedition_events.12.b: "Пусть гоняются за этой находкой. К весне появятся другие."
 relic_expedition_events.12.c: "Подстеречь их в теснине и там покончить с делом."
 relic_expedition_events.20.title: "Животворящий Крест обретён"
 relic_expedition_events.20.desc: "До дворов христианского мира доходит весть: $relic_true_cross_found$, бесследно пропавший после разгрома при Хаттине, найден, и теперь его хранит в своей сокровищнице [relic_finder.GetLongName]. Каждый соборный капитул захочет услышать собственный рассказ о том, как его нашли, и мало кто из них сойдётся во мнении о его подлинности."
 relic_expedition_events.20.a: "Вести в христианском мире разносятся быстро."
 relic_expedition_events.21.title: "Святое копьё вновь явилось миру"
 relic_expedition_events.21.desc: "Среди верующих разносится весть: $relic_holy_lance_found$, пропавшее после того, как Первый крестовый поход покинул город [ShowLocationName('antioch')], найдено, и теперь им владеет [relic_finder.GetLongName]. Не один паломник проложит из-за этого новый маршрут."
 relic_expedition_events.21.a: "Ещё одна реликвия находит дорогу домой."
 relic_expedition_events.22.title: "Святая плащаница найдена"
 relic_expedition_events.22.desc: "По католической Европе расходятся вести: $relic_holy_shroud_found$ — полотно, о котором давно ходили разговоры, но которое так никто и не нашёл, — обретена, и теперь ею владеет [relic_finder.GetLongName]. Скептики усомнятся, как сомневались всегда. Верующие отправятся в путь в любом случае."
 relic_expedition_events.22.a: "Пусть паломники судят сами."
 relic_expedition_events.2.desc_damascus_repeat: "И снова [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] теперь знает, к кому здесь прислушиваются ([location_scope.GetRank.GetNameWithNoTooltip]) и во что это обходится."
 relic_expedition_events.2.desc_tripoli_first: "Экспедиция прибывает в город [ShowLocationName('tripoli_syria')], центр графства крестоносцев вплоть до его падения в 1289 году. Торговля в гавани всё так же бойка, но часовня старой цитадели стоит неосвящённой дольше, чем кто-либо здесь помнит, — и опустошить её тоже никто не удосужился."
 relic_expedition_events.2.desc_tripoli_repeat: "И снова [ShowLocationNameWithNoTooltip('tripoli_syria')]. Портовые купцы теперь сразу узнают, когда мимо проходит [target_leader.GetName]."
 relic_expedition_events.2.desc_tyre_first: "Экспедиция прибывает в город [ShowLocationName('sur')]. [location_scope.GetRank.GetName] этот столь древен, что, по свидетельству Евангелий, через его земли проходил сам Христос; кроме того, это одна из последних твердынь на материке, которые крестоносцы удерживали до 1291 года. Здешнее архиепископство два столетия вело свои записи. То, что от них уцелело, разбросано по дюжине частных домов, и ни один хозяин не согласен с другим в том, что именно у него хранится."
 relic_expedition_events.2.desc_tyre_repeat: "И снова [ShowLocationNameWithNoTooltip('sur')]. Почти всё, что оставило после себя старое архиепископство, [target_leader.GetName] уже знает чуть ли не наизусть."
 relic_expedition_events.2.desc_jaffa_first: "Экспедиция прибывает в город [ShowLocationName('jaffa')], куда когда-то паломники прибывали целыми кораблями и где, по преданию, апостол Пётр воскресил из мёртвых вдову Тавифу. Два столетия потоки паломников шли через эту гавань в обе стороны. Не всё, что сюда попало, уехало обратно."
 relic_expedition_events.2.desc_jaffa_repeat: "И снова [ShowLocationNameWithNoTooltip('jaffa')]. Портовый квартал уже привык к вопросам, которые задаёт [target_leader.GetName]."
 relic_expedition_events.2.desc_hebron_first: "Экспедиция прибывает в город [ShowLocationName('hebron')], к Пещере Патриархов, где, как говорят, покоятся Авраам, Исаак и Иаков. Это святыня для верующих трёх традиций: [ShowReligionGroupAdjective('israelite_group')]ой, [ShowReligionGroupAdjective('christian')]ой и [ShowReligionGroupAdjective('muslim')]ой. Веками три веры что-то добавляли к этому святилищу и что-то из него уносили. Небольшая вещица, спрятанная не в том столетии, могла бы пролежать здесь незамеченной целую вечность."
 relic_expedition_events.2.desc_hebron_repeat: "И снова [ShowLocationNameWithNoTooltip('hebron')]. [target_leader.GetName] здесь не впервые: ограду святилища знает хорошо, а ещё лучше знает, где не стоит попадаться на глаза."
 relic_expedition_events.2.desc_sidon_first: "Экспедиция прибывает в город [ShowLocationName('sidon')] — ещё одно место, которое, согласно Евангелиям, посетил Христос, и сеньорию крестоносцев вплоть до падения королевства. Старый франкский квартал с тех пор дважды заселяли заново. Нынешние жильцы понятия не имеют, что лежит в их собственных погребах."
 relic_expedition_events.2.desc_sidon_repeat: "И снова [ShowLocationNameWithNoTooltip('sidon')]. [target_leader.GetName] держит при себе список франкских домов, куда стоит заглянуть ещё раз."
 relic_expedition_events.2.desc_karak_first: "Экспедиция достигает крепости [ShowLocationName('karak')] — пустынного замка, которым владел Рено де Шатильон, сеньор Трансиордании. Рено годами грабил караваны паломников и, как говорят, хранил добычу здесь на случай осады, которую, как он знал, рано или поздно устроит Саладин. Каждая семья в городке под стенами рассказывает эту историю по-своему."
 relic_expedition_events.2.desc_karak_repeat: "И снова [ShowLocationNameWithNoTooltip('karak')]. [target_leader.GetName] слушает легенды о замке уже не в первый раз, а от самых словоохотливых — и не во второй."
 relic_expedition_events.2.desc_gaza_first: "Экспедиция прибывает в город [ShowLocationName('gaza')], древнее поселение, где в своё время стоял гарнизон тамплиеров, — на пустынной дороге, что ведёт на юг, в регион [ShowRegionName('egypt_region')]. Орден был упразднён, а его братья рассеялись по всему христианскому миру много поколений назад. Не всё, что они здесь хранили, ушло вместе с ними."
 relic_expedition_events.2.desc_gaza_repeat: "И снова [ShowLocationNameWithNoTooltip('gaza')]. [target_leader.GetName] уже знает в лицо большинство семей, что живут там, где некогда обитали тамплиеры."
 relic_expedition_events.2.desc_famagusta_first: "Экспедиция прибывает в город [ShowLocationName('famagusta')] — великий порт, принадлежащий [location_scope.GetOwner.GetAdjective]ой державе; это [location_scope.GetOwner.GetFlavorRank] острова [ShowProvinceDefinitionName('cyprus_province')]. После падения города [ShowLocationNameWithNoTooltip('acre')] в 1291 году сюда бежало множество латинских семей, и многие из них вывезли с материка не только свои титулы."
 relic_expedition_events.2.desc_famagusta_repeat: "И снова [ShowLocationNameWithNoTooltip('famagusta')]. В соборе Святого Николая теперь хорошо знают, кто такой [target_leader.GetName]."
 relic_expedition_events.2.desc_nicosia_first: "Экспедиция прибывает в город [ShowLocationName('nicosia_cyp')], средоточие власти на острове [ShowProvinceDefinitionName('cyprus_province')]. Здесь [location_scope.GetOwner.GetAdjective]ая держава — а точнее, [location_scope.GetOwner.GetGovernment.GetCourtTitle] — хранит длинный архив того, что изгнанная с материка знать привезла с собой, и ещё более длинный — того, что она потом заложила."
 relic_expedition_events.2.desc_nicosia_repeat: "И снова [ShowLocationNameWithNoTooltip('nicosia_cyp')]. [location_scope.GetOwner.GetAdjective]ие архивариусы уже не спрашивают, почему [target_leader.GetName] всё возвращается."
 relic_expedition_events.2.desc_rhodes_first: "Экспедиция прибывает на остров [ShowLocationName('rodos')] — это [location_scope.GetOwner.GetAdjective]ие владения. Здешний орден помнит падение города [ShowLocationNameWithNoTooltip('acre')] как часть собственной истории и хранит списки всех командорств, брошенных на материке. Ни один другой город в этих водах не откроет подобные записи католическому поисковому отряду."
 relic_expedition_events.2.desc_rhodes_repeat: "И снова [ShowLocationNameWithNoTooltip('rodos')]. Для [location_scope.GetOwner.GetAdjective]их архивариусов [target_leader.GetName] — давно знакомая докука."
 relic_expedition_events.2.desc_fallback: "Ещё одна остановка, ещё один круг знакомств. [target_leader.GetName] начинает всё сначала и ждёт, не подвернётся ли что-нибудь стоящее."
 relic_expedition_events.2.a: "Поспрашивать вокруг. Паломники и солдаты охотно болтают, а лучшая плата за их слова — [ShowGoodsNameWithNoTooltip('wine')]."
 relic_expedition_events.2.b: "Наконец-то мы напали на след реликвии."
 relic_expedition_events.2.c: "Нанять здесь людей в свиту. Хорошая охрана стоит недёшево."
 relic_expedition_events.2.d: "Подкупить придворного чиновника, чтобы узнать, что лежит в местном архиве."
 relic_expedition_events.2.e: "Найти учёного. Образованный ум лучше разбирается в слухах."
 relic_expedition_events.2.f: "Пойти по многообещающей зацепке. Она ведёт сюда: [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.2.g: "Прекратить поиски и повернуть назад."
 relic_expedition_events.3.title: "Поиски продолжаются"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] возвращается к храму Гроба Господня до рассвета, опережая толпы паломников. Ещё одна крипта, которую предстоит осмотреть при свечах, ещё одна стёртая надпись, которую нужно переписать, ещё один каноник, готовый заговорить за подходящее вознаграждение."
 relic_expedition_events.3.desc_acre: "Простукиваются полые стены, переворачивается обрушившаяся кладка там, где её не тревожили поколениями. [relic_hunt_loc.GetRank.GetName] [ShowLocationNameWithNoTooltip('acre')] велик, но людей в нём почти не осталось, а один отряд может обыскать лишь малую его часть."
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] прослеживает линию исчезнувших стен, сверяя то, что ещё стоит, с рассказами паломников о том, где было найдено Копьё. Рассказы не согласуются друг с другом, и ни один из них не согласуется с самой местностью."
 relic_expedition_events.3.desc_damascus: "Базар за базаром [target_leader.GetName] заводит дружбу с купцами и ростовщиками. В таком большом городе слухи расходятся медленно, но всё же расходятся — и приходят уже с готовой ценой."
 relic_expedition_events.3.desc_tripoli: "Часовню цитадели разбирают плита за плитой, сбивая штукатурку везде, где стена звучит не так, как должна. Одна только часовня — это недели работы."
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] разбирает уцелевшие записи архиепископства в городе [ShowLocationNameWithNoTooltip('sur')], раскладывая покрытые водяными пятнами книги рядом с полустёртыми грамотами в поисках записи, которая не сходится с остальными."
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] проводит дни в гавани города [ShowLocationNameWithNoTooltip('jaffa')], угощая выпивкой грузчиков и лодочников и расспрашивая, какие склады принимали грузы паломников до ухода франков."
 relic_expedition_events.3.desc_hebron: "Святилище осматривают ниша за нишей, медленно и с величайшей осторожностью, чтобы не оскорбить ни одну из трёх вер, которые его хранят. [target_leader.GetName] отмечает каждый замурованный проход и ни об одном не спрашивает вслух."
 relic_expedition_events.3.desc_sidon: "Дом за домом по старому франкскому кварталу: [target_leader.GetName] стучится в двери и расспрашивает о погребах и чердаках, которые никто не открывал с тех пор, как бежали последние жильцы-христиане."
 relic_expedition_events.3.desc_karak: "С фонарём в руке [target_leader.GetName] обходит подвалы и цистерны крепости [ShowLocationNameWithNoTooltip('karak')], сверяя рассказы сказителей о сокровищах Рено де Шатильона с тем, что на деле способны вместить эти стены."
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] продолжает выслеживать бывшие владения упразднённого ордена в городе [ShowLocationNameWithNoTooltip('gaza')], выспрашивая у соседей, какие кладовые тамплиеры держали под замком и кому потом достались ключи."
 relic_expedition_events.3.desc_famagusta: "Сундук за сундуком в городе [ShowLocationNameWithNoTooltip('famagusta')] перебирается домашнее добро изгнанных с материка семей: опись того, что вывезли из города [ShowLocationNameWithNoTooltip('acre')], и того, о чём с тех пор тихо забыли."
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] изучает архив, который хранит [relic_hunt_loc.GetOwner.GetAdjective]ая держава — а точнее, [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle] — в городе [ShowLocationNameWithNoTooltip('nicosia_cyp')], сверяя описи имущества со списками наследств в поисках реликвии, о которой никто и не подумал спросить."
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] настойчиво просит [relic_hunt_loc.GetOwner.GetAdjective]их архивариусов на острове [ShowLocationNameWithNoTooltip('rodos')] показать тома, которые те не спешат предлагать, и сверяет их списки с тем, что, по словам старших братьев, было вывезено из города [ShowLocationNameWithNoTooltip('acre')]."
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] не сдаётся и проверяет одну мелкую зацепку за другой, прежде чем отбросить каждую."
 relic_expedition_events.3.a: "Продолжать расспросы. Кто-то здесь знает больше, чем говорит."
 relic_expedition_events.3.b: "Наконец-то сам след. Мы нашли его."
 relic_expedition_events.3.c: "Нанять ещё людей в свиту, раз уж мы здесь."
 relic_expedition_events.3.d: "Подкупить ещё одного чиновника. В этом городе записи ведут лучше."
 relic_expedition_events.3.e: "Посоветоваться с местным учёным, прежде чем двигаться дальше."
 relic_expedition_events.3.f: "Новая зацепка указывает в другое место. Последовать за ней сюда: [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.3.g: "Прекратить поиски и повернуть назад."
 relic_expedition_events.4.title: "След остыл"
 relic_expedition_events.4.desc: "Все зацепки, по которым шёл [target_leader.GetName], ни к чему не привели. Толмачи обошли все таверны, подкупленным чиновникам больше нечего продать, а кошелёк худеет с каждой неделей, пока отряд без дела сидит в чужой стране. Короне отправлено послание: либо платить за дальнейшие поиски, либо прекратить их."
 relic_expedition_events.4.b: "Довольно. Отозвать экспедицию."
 relic_expedition_events.5.title: "Эскорт потерян"
 relic_expedition_events.5.a: "Без них миссию не продолжить."
 relic_expedition_events.6.title: "Готовый продавец"
 relic_expedition_events.6.desc_true_cross: "Городской купец, внимательно следя, чтобы никто не подслушал, говорит, что владеет частицей самой реликвии «$relic_true_cross_found$» — древа, утраченного при Хаттине, — которая дошла до него через руки, назвать которые он отказывается. А вот цену он назовёт."
 relic_expedition_events.6.desc_holy_lance: "Семья покойного солдата со времён службы прадеда хранит наконечник копья и уверяет, что это и есть реликвия «$relic_holy_lance_found$», обретённая в 1098 году. Деньги им милее."
 relic_expedition_events.6.desc_holy_shroud: "Купец разворачивает льняное полотно с едва заметным изображением распятого человека. Где оно пребывало все эти столетия, он объяснить не может, но всё равно просит за него огромную сумму."
 relic_expedition_events.6.desc_holy_nail: "Вдова кузнеца приносит почерневший от времени железный гвоздь. Родня её мужа всегда клялась, что это один из гвоздей, которыми был распят Христос. Она готова его продать."
 relic_expedition_events.6.desc_true_cross_fragment: "Бедный, полузабытый монастырь хранит в простом реликварии щепку дерева с надписью, гласящей лишь, что это частица реликвии «$relic_true_cross_found$». Настоятель тихо расстанется с ней, если выручка поможет удержать крышу над головой."
 relic_expedition_events.6.desc_saint_bones: "Приходской священник предлагает небольшой ларец с костями, на котором выцветшей латынью начертано имя святого. Плату он предпочёл бы назвать пожертвованием церкви."
 relic_expedition_events.6.desc_baptist_head: "Одна из церквей округи почитает то, что, по её словам, является главой Иоанна Крестителя. Слава об этой реликвии почти не выходила за пределы прихода, и клир готов обсудить её передачу."
 relic_expedition_events.6.desc_virgin_milk: "Небольшое святилище хранит запечатанный сосуд с белым меловым осадком, который поколениями почитают как молоко Девы Марии. Хранитель продаст его вместе с серебряным реликварием."
 relic_expedition_events.6.desc_holy_thorn: "Мелкий дворянский род владеет единственным шипом в скромном реликварии — по семейному преданию, он был подарен одному из предков из Тернового венца. Род предпочёл бы, чтобы продажа прошла незамеченной."
 relic_expedition_events.6.desc_holy_chalice: "Купец заранее знает, что ему не поверят, и прямо так и говорит, а затем предлагает простую каменную чашу, которая, как он утверждает, и есть истинная чаша Тайной вечери, что бы ни твердили более знатные претенденты в других местах. Цена у него немалая."
 relic_expedition_events.6.desc_titulus_crucis: "Местная легенда гласит, что, когда древо Креста отправилось на запад, табличка с надписью, висевшая над ним, осталась здесь и была спрятана. Одна здешняя семья утверждает, что унаследовала именно такую табличку, и готова её продать."
 relic_expedition_events.6.a: "Торговаться. Цена высока, но есть куда уступить."
 relic_expedition_events.6.b: "Заплатить сколько просят. Некоторые вещи стоят своей цены."
 relic_expedition_events.6.c: "Пусть вместо нас говорит численность нашей свиты."
 relic_expedition_events.7.title: "Сделка заключена"
 relic_expedition_events.7.desc: "Условия согласованы, реликварий завёрнут в ткань. Теперь [target_leader.GetName] решает лишь одно: какой части рассказа продавца стоит верить."
 relic_expedition_events.7.a: "Заплатить и отвезти реликвию домой."
 relic_expedition_events.7.b: "Что-то здесь не так. Уйти."
 relic_expedition_events.8.title: "Готовый сообщник"
 relic_expedition_events.8.desc_true_cross: "Слуга в доме одного из местных вельмож, затаивший на что-то обиду, которую не желает объяснять, упоминает, что его хозяин хранит среди прочих сокровищ завёрнутый обломок тёмного дерева, называя его реликвией «$relic_true_cross_found$». За плату слуга поможет нам его забрать."
 relic_expedition_events.8.desc_holy_lance: "Солдат гарнизона, которому год не платили жалованье, проговаривается, что в оружейной хранится старый наконечник копья, которого на памяти живущих никто не вносил в опись. Старики до сих пор называют его так: «$relic_holy_lance_found$». Он может нас туда провести."
 relic_expedition_events.8.desc_holy_shroud: "Монастырский привратник, с недавних пор в жестокой ссоре со своим настоятелем, рассказывает, что община хранит сложенное полотно с изображением, запертое от всех, кроме старших братьев. Он оставит одну дверь незапертой."
 relic_expedition_events.8.desc_holy_nail: "Казначейский писарь, по уши в долгах, признаётся, что старый железный гвоздь, почитаемый как один из гвоздей Распятия, лежит не внесённым в опись в боковом хранилище. Единственный ключ от него — у писаря."
 relic_expedition_events.8.desc_true_cross_fragment: "Послушник, недовольный своим призванием, предлагает оставить открытым ставень в часовню, где его обитель хранит щепку реликвии «$relic_true_cross_found$»."
 relic_expedition_events.8.desc_saint_bones: "Могильщик, которому всю жизнь платили слишком мало за его труд, знает, где приход держит ларец с мощами святого и в котором часу ризничий ложится вздремнуть после полудня."
 relic_expedition_events.8.desc_baptist_head: "Младший каноник, которого слишком часто обходили с повышением, предлагает проводить нас к реликварию, который старшее духовенство почитает как главу Иоанна Крестителя."
 relic_expedition_events.8.desc_virgin_milk: "Сам смотритель святилища, втайне взбешённый десятилетиями скудного жалованья, оставит ларец с реликвией незапертым в ночь, которую выберет сам."
 relic_expedition_events.8.desc_holy_thorn: "Управляющий, которого однажды уже выгоняли, а потом нехотя взяли обратно, точно знает, где семья хранит реликварий с единственным шипом из Тернового венца."
 relic_expedition_events.8.desc_holy_chalice: "Соборный ризничий не может сказать ничего хорошего о капитуле, которому служит уже много лет, и предлагает помочь нам унести простую каменную чашу, которую там втайне называют истинной чашей Тайной вечери."
 relic_expedition_events.8.desc_titulus_crucis: "Семья, хранящая старую и полузабытую легенду, предлагает нечто совсем иное: помочь им забрать у родственника, который отказывается её продать, то, что они считают подлинной табличкой с надписью с Креста."
 relic_expedition_events.8.a: "Осторожность стоит денег."
 relic_expedition_events.8.d: "Золото не нужно. [target_leader.GetHerHis|U] собственное обаяние обеспечит их помощь."
 relic_expedition_events.8.b: "Обойтись без сообщника. Чем меньше платных людей, тем меньше болтунов."
 relic_expedition_events.8.c: "Сообщники не нужны. Наша свита попросту заберёт её силой."
 relic_expedition_events.9.title: "Кража"
 relic_expedition_events.9.desc: "Пока что всё идёт по плану. Те, кто должен нести стражу, спят, или отлучились, или получили плату, чтобы смотреть в другую сторону, а дверь, которую обещал сообщник, не заперта. [target_leader.GetName] ждёт в темноте крика, который означал бы, что что-то пошло не так."
 relic_expedition_events.9.a: "Дело сделано. Реликвия наша, и никто ни о чём не догадался."
 relic_expedition_events.9.b: "Кто-то проснулся. Крики, топот ног. Отступаем!"
 relic_expedition_events.10.desc_true_cross: "Странствующий учёный, прочитавший все хроники о Хаттине, по трём рассказам, совпадающим почти случайно, сумел определить участок земли, где отступавшие рыцари, как говорят, закопали частицу реликвии «$relic_true_cross_found$», лишь бы не отдать её Саладину. Он предлагает свои записи, свои потрёпанные карты и самого себя."
 relic_expedition_events.10.desc_holy_lance: "Знаток Первого крестового похода полагает, что по собственному рассказу, который оставил [GetCharacter('koj_petrus_bartholomaeus').GetName], ему удалось найти подвал, где в 1098 году было обретено $relic_holy_lance_found$. Он утверждает, что лежавшее рядом с ним так и не было извлечено целиком. Соперничающие клирики ещё тогда называли эту мысль фантазией, но ни один из них её не опроверг."
 relic_expedition_events.10.desc_holy_shroud: "Престарелый знаток древностей почти уверовал в слух, источник которого не может толком указать: будто бы плащаницу с изображением замуровали в крипте монахи, бежавшие от набега, о котором не упоминает ни одна хроника. Он почти слеп и хочет совершить последнее открытие — и сам приведёт нас на место."
 relic_expedition_events.10.desc_holy_nail: "Знаток реликвий указывает на полуразрушенную часовню, где, по местному преданию, бежавший священник закопал гвоздь Распятия, опережая проходивших мимо солдат."
 relic_expedition_events.10.desc_true_cross_fragment: "Три поколения монастырских книг, прочитанных от корки до корки, привели учёного к скиту, покинутому в спешке, где последний отшельник, как говорят, спрятал частицу реликвии «$relic_true_cross_found$» под полом часовни, прежде чем спасаться бегством."
 relic_expedition_events.10.desc_saint_bones: "Местный агиограф, работая с рассыпающимися приходскими книгами, остановил выбор на безымянной могиле у края старого кладбища: там лежит малоизвестный святой, чьи кости спрятали, лишь бы не оставлять их враждебному войску."
 relic_expedition_events.10.desc_baptist_head: "Опираясь на обрывки хроники, найденной в монастырском архиве, учёный утверждает, что реликварий, почитаемый как глава Иоанна Крестителя, во время давней осады спрятали под полом часовни, а затем часовня обрушилась прямо на него."
 relic_expedition_events.10.desc_virgin_milk: "Учёный, ссылаясь на дневник паломника, который больше никто не удосужился прочесть, указывает на замурованную нишу в заброшенном святилище, где хранители, как говорят, спрятали сосуд с молоком Богородицы, лишь бы не отдавать его грабителям."
 relic_expedition_events.10.desc_holy_thorn: "Учёный прочитал всю частную переписку угасшего рода и проследил путь шипа из самого Тернового венца до их склепа, запечатанного со времён чумы, опустошившей дом."
 relic_expedition_events.10.desc_holy_chalice: "Здесь есть особая ветвь легенды о Граале, не имеющая ничего общего со знаменитыми притязаниями городов [ShowLocationName('genoa')] и [ShowLocationName('valencia')]. Учёный, идущий по её следу, полагает, что простая каменная чаша лежит под часовней, разрушенной во время давней осады, а прихожане её разбрелись задолго до того, как кому-то пришло в голову копать."
 relic_expedition_events.10.desc_titulus_crucis: "Местное предание гласит, что табличка с надписью с Креста вовсе не отправилась на запад. Учёный, принимающий это предание всерьёз, считает, что её замуровали в здешней часовне во время последнего отступления крестоносцев, и предлагает помочь найти ту стену."
 relic_expedition_events.clues_up_1_tt: "След становится горячее (Зацепки: #G +1#!)"
 relic_expedition_events.clues_down_1_tt: "След остывает (Зацепки: #R -1#!)"
 relic_expedition_events.retinue_up_10_tt: "Свита экспедиции растёт (Свита: #G +10#!)"
 relic_expedition_events.retinue_down_5_tt: "Свита экспедиции редеет (Свита: #R -5#!)"
 relic_expedition_events.retinue_down_8_tt: "Свита экспедиции редеет (Свита: #R -8#!)"
 relic_expedition_events.retinue_down_10_tt: "Свита экспедиции редеет (Свита: #R -10#!)"
 relic_expedition_events.retinue_down_15_tt: "Свита экспедиции редеет (Свита: #R -15#!)"
 relic_expedition_events.retinue_down_25_tt: "Свита экспедиции редеет (Свита: #R -25#!)"
 relic_expedition_announce_true_cross_tt: "Все католические правители узнают, что реликвия «$relic_true_cross_found$» найдена"
 relic_expedition_announce_holy_lance_tt: "Все католические правители узнают, что реликвия «$relic_holy_lance_found$» найдена"
 relic_expedition_announce_holy_shroud_tt: "Все католические правители узнают, что реликвия «$relic_holy_shroud_found$» найдена"
 relic_expedition_events.13.title: "Мастерская фальсификатора"
 relic_expedition_events.13.desc: "Ремесленника ловят на том, что он продаёт доверчивому паломнику палец святого, вырезанный тем же утром из баранины и окрашенный чаем. Когда на него надавили, требуя назвать, кого ещё он обманул, он вместо этого клянётся, что знает о чём-то подлинном, на что наткнулся, собирая для мастерской старое дерево и ещё более старое железо. Он назовёт квартал, но не улицу, пока не увидит монету. Слово фальсификатора стоит ровно столько, сколько стоит слово фальсификатора."
 relic_expedition_events.13.a: "Заплатить ему за то, что он утверждает, но только один раз."
 relic_expedition_events.13.b: "Пусть свита на него надавит. Страх дешевле серебра."
 relic_expedition_events.13.forger_honest_tt: "На сей раз монета покупает правду, и рассказ фальсификатора подтверждается"
 relic_expedition_events.13.forger_cheated_tt: "В названном квартале нет ничего, кроме сплетен; фальсификатору заплатили дважды за одну и ту же ложь"
 relic_expedition_events.13.threats_work_tt: "Страх развязывает то, что не смогло развязать серебро, и фальсификатор выдаёт нечто настоящее"
 relic_expedition_events.13.threats_fail_tt: "Он лишь громче визжит оправдания; угрозы свиты не принесли ничего, кроме сбитых костяшек"
 relic_expedition_events.14.title: "Песчаная буря в пути"
 relic_expedition_events.14.desc: "Около полудня на горизонте поднимается стена охристой пыли, и уже через час она поглощает дорогу. Верблюды подгибают ноги и отказываются вставать, песок забивается в каждую складку ткани и каждый бурдюк, а проводник признаёт, что больше не различает каменных пирамидок, отмечающих путь. [target_leader.GetName] может двигаться дальше вслепую или потерять несколько дней, пережидая бурю."
 relic_expedition_events.14.a: "Пробиваться сквозь бурю. Дорога не могла уйти далеко."
 relic_expedition_events.14.b: "Придавить шатры, разбить лагерь и переждать, пока не уляжется."
 relic_expedition_events.15.title: "Лихорадка"
 relic_expedition_events.15.desc_land: "Лихорадка пришла вместе с водоносами и косит людей по двое и по трое почти без предупреждения: ломота в голове на рассвете, озноб к полудню, неглубокая могила к утру второго дня. Двое лекарей отряда уже не успевают помочь всем, кто их зовёт, а здоровые начали спать подальше от больных. [target_leader.GetName] решает, сколько корона потратит на то, чтобы сдержать заразу."
 relic_expedition_events.15.desc_sea: "Лихорадка поднялась на борт вместе с последней водой, взятой в порту, и косит людей по двое и по трое почти без предупреждения: ломота в голове на рассвете, озноб к полудню, тело, скользнувшее за борт, к утру второго дня. Двое лекарей отряда уже не успевают помочь всем, кто зовёт их в тесном трюме, а здоровые начали спать так далеко от больных, как только позволяет палуба. [target_leader.GetName] решает, сколько корона потратит на то, чтобы сдержать заразу."
 relic_expedition_events.15.a: "Не жалеть средств на лечение больных и их изоляцию."
 relic_expedition_events.15.b: "Пусть идёт своим чередом. Лихорадка скоро выгорит сама."
 relic_expedition_events.16.title: "Пустынные разбойники требуют дани"
 relic_expedition_events.16.desc: "Вооружённые люди выстроились поперёк дороги там, где она спускается между двумя хребтами, — слишком многочисленные и слишком хорошо организованные для простых грабителей. Их предводитель выезжает на коне вперёд строя, называет сумму за безопасный проход и ясно даёт понять, что уже взвесил, во что ему обойдётся другой исход."
 relic_expedition_events.16.a: "Заплатить пошлину и уйти, пока он не передумал насчёт цены."
 relic_expedition_events.16.b: "Пробиться с боем. Мы зашли так далеко не для того, чтобы нас ограбили."
 relic_expedition_events.16.c: "Пусть за нас говорит наша численность. Мало кто станет спорить с таким отрядом."
 relic_expedition_events.17.title: "Слух от паломника"
 relic_expedition_events.17.desc: "На ночь постоялый двор делит с нами караван паломников, и разговор у огня, как всегда, сворачивает на реликвии. Один из них, сын торговца шерстью из глубинки, пересказывает историю, которую смутно помнит со слов дяди, умершего двадцать лет назад: монахи выносят свёрток из горящего дома, ночь на прибрежной дороге и погребение, которого никто не должен был видеть. Назвать дом он не может. Но в дороге странно уверен."
 relic_expedition_events.17.a: "Угостить его ещё одной чаркой и выпытать каждую подробность."
 relic_expedition_events.17.b: "Ещё одна байка из тысячи. Выступаем с рассветом."
 relic_expedition_events.17.tale_confirmed_tt: "Монета развязывает ему язык, и у него вырывается подробность, которой, вероятно, не стоило делиться"
 relic_expedition_events.17.tale_fades_tt: "Ещё одна чарка не помогает; с каждым пересказом подробности лишь сильнее расплываются"
 relic_expedition_events.18.title: "Деньги на исходе"
 relic_expedition_events.18.desc: "Неудачный месяц на обмене и ростовщики, вдруг ставшие осторожными с чужеземцами, оставляют казну экспедиции куда тоньше, чем рассчитывали. Жалованье свиты уже на две недели задерживается, погонщики мулов хотят получать плату монетой, которой доверяют, а не нашей, и слухи о том, что отряду не платят, разносятся по этим городам быстрее любых наших вопросов."
 relic_expedition_events.18.a: "Быстро покрыть недостачу из собственной казны короны."
 relic_expedition_events.18.b: "Пусть ещё немного подождут жалованья. Им всё равно некуда идти."
 relic_expedition_events.19.title: "Местные власти замечают нас"
 relic_expedition_events.19.desc_muslim: "Местный #italic кади#! прослышал, что чужеземцы задают острые вопросы о франкских сокровищах и о том, какие семьи что припрятали для себя, когда пали королевства. Его секретарь является с визитом — чай, комплименты и послание, адресат которого — [target_leader.GetName], а смысл под всей учтивостью вполне ясен: подобные расспросы идут куда глаже с ведома его господина и при подобающем пожертвовании на содержание мечети."
 relic_expedition_events.19.desc_christian: "Местные [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] заметили, что чужеземный отряд слишком уж пристально расспрашивает о реликвиях, которые, по их убеждению, касаются только Церкви и больше никого. [target_leader.GetName] удостаивается приёма у архидьякона со всей учтивостью; тот подолгу рассуждает о грехе алчности и не оставляет ни малейших сомнений: его благосклонность и впредь потребует дара, возложенного на алтарь."
 relic_expedition_events.19.desc_fallback: "Слухи о расспросах экспедиции дошли до ушей, которые лучше было бы не тревожить. Человек, которого никто не удосуживается представить, приходит на постоялый двор после наступления темноты, садится без приглашения и подробно объясняет, сколько неприятностей чужеземный отряд может навлечь на себя в таком городе, как этот. Предупреждение звучит неспешно, совершенно вежливо и предельно ясно."
 relic_expedition_events.19.a: "Засвидетельствовать почтение так, чтобы это видели нужные люди."
 relic_expedition_events.19.b: "Пренебречь предупреждением и продолжать работу. Времени и так мало."
