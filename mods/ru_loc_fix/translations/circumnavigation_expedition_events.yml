l_russian:
 circumnavigation_expedition_events.8.a: "Спустить шлюпки и обыскать риф в поисках воды или пищи."
 circumnavigation_expedition_events.9.a: "Ещё раз спустить шлюпки и попытаться пробиться к берегу сквозь прибой."
 circumnavigation_expedition_events.10.b: "Высадить вооружённых людей, вернуть шлюпку и взять то, что нам нужно."
 circumnavigation_expedition_events.10.c: "Забрать с каноэ что удастся и немедленно уходить в море."
 circumnavigation_expedition_events.11.title: "Кровь и вера на Себу"
 circumnavigation_expedition_events.11.a: "Вступиться за союзника. Пусть Мактан узнает нашу силу."
 circumnavigation_expedition_events.11.b: "Взять то, что дают острова, и плыть дальше. Это не наша война."
 circumnavigation_expedition_events.11.c: "Водрузить королевский штандарт. Пусть корона запишет это открытие."
 circumnavigation_expedition_events.12.a: "Забить трюмы доверху; наш груз — [ShowGoodsNameWithNoTooltip('cloves')]. Ради этого мы и прошли полмира."
 circumnavigation_expedition_events.12.b: "Заключить договор с султаном. Союз ценнее любого груза."
 circumnavigation_expedition_events.14.a: "Привести судно в порядок: законопатить швы, наполнить бочки, накормить людей."
 circumnavigation_expedition_events.14.b: "Лишь короткая стоянка. Как следует люди отдохнут дома."
 circumnavigation_expedition_events.15.a: "Держаться легенды. Закупиться быстро, пока не начались расспросы."
 circumnavigation_expedition_events.15.b: "Не рисковать в гавани соперника. Идти домой, пусть и впроголодь."
 circumnavigation_expedition_events.16.a: "Отправить охотников за козами и наполнить бочки у родников."
 circumnavigation_expedition_events.18.b: "Подавить мятеж силой. Зачинщики ответят за всё."
 circumnavigation_expedition_events.19.a: "Отдохнуть и полностью пополнить запасы. Такой дружественный берег — редкость."
 circumnavigation_expedition_events.19.b: "Короткая стоянка с благодарностью — и на юг. Время года не ждёт."
 circumnavigation_expedition_events.19.historical_info: "Северо-восточный выступ Бразилии — Пернамбуку, Параиба, Риу-Гранди — был одной из самых ранних и богатых областей иберийских поселений в Новом Свете: его побережье окаймляли заросли бразильского дерева, а вскоре и сахарные плантации. Корона, владевшая этими гаванями, могла снабдить флот водой и провизией на собственной земле перед долгим переходом в южные широты — роскошь, которой Магеллан, пробиравшийся через воды соперника, так и не знал."
 circumnavigation_expedition_events.20.a: "Осторожно выменять провизию в колонии державы [rival_crown.GetNameWithNoTooltip]."
 circumnavigation_expedition_events.21.a: "Выдавать свежие припасы по норме и стоять, пока не минует худшее."
 circumnavigation_expedition_events.21.b: "Нет времени. Идти дальше; сильные выдержат."
 circumnavigation_expedition_events.21.b.tt: "Переход продолжается, а больные брошены на волю судьбы. Многие не увидят дальнего берега, а выживших будет слишком мало, чтобы привести домой весь флот"
 circumnavigation_expedition_events.22.b.lose_tt: "Риск не оправдывается: во тьме флот разбрасывает в стороны, и с рассветом один из кораблей может не отозваться"
 circumnavigation_expedition_events.23.a.tt: "Флот кренгуется на пустынном берегу и делает что может; работа медленная и дорогостоящая, но корпуса ещё какое-то время продержатся"
 circumnavigation_expedition_events.23.c: "Идти в ближайшую дружественную гавань и переоснастить судно."
 circumnavigation_expedition_events.23.c.tt: "Флот заходит в ближайшую дружественную гавань и спокойно чинится — ремонт куда надёжнее, чем на любом пустынном берегу, а командам выпадает долгожданный отдых"
 circumnavigation_expedition_events.provisioned_tt: "Флот полностью обеспечен провизией, и его команды лучше выдержат предстоящий великий переход (#G +30#! Провизия)"
 circumnavigation_expedition_events.ship_lost_tt: "Один корабль потерян, и экспедиция сокращается (#R -1#! Корабли)"
 circumnavigation_expedition_events.wintered_tt: "Зимовка восстанавливает корабли и команду, и они встретят великий переход в куда лучшем состоянии (#G +20#! Провизия)"
 circumnavigation_expedition_events.9.a.tt: "Шлюпки возвращаются ни с чем, но команды видели, что попытка была сделана, и боевой дух падает лишь немного (#R -3#! Боевой дух команды)"
 circumnavigation_expedition_events.supplies_up_5_tt: "Запасы провизии флота пополняются (#G +5#! Провизия)"
