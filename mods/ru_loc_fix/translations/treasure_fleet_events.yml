l_russian:
 chinese_treasure_expeditions_send_tooltip: "$expedition_name_treasure_voyage$ отправляется в путь. Цель — [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName], во главе — [character_expedition_leader_target.GetName].\nНа борту флота груз стоимостью #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [Concept('gold', 'дукатов')|e], предназначенный в дар [Concept('countries', 'державам')|e], которые он посетит"
 treasure_fleet_events.4.desc: "В один из южных портов зашла джонка с вестями: донесение шлёт $expedition_name_treasure_voyage$. Флот, который ведёт $expedition_leader_name$, достиг гавани [port_location.GetName] в державе [port_country.GetName], где его по всем правилам принимает [port_country.GetGovernment.GetCourtTitle]. Наши посланники обменялись товарами, а [port_country.Custom('GetRulerOrRegentTitle')] принимает от них положенные по обычаю дары. Летописец флота сообщает, что ветер и время года благоприятствуют следующему этапу пути. Как замечает капитан, [ROOT.GetCountry.GetGovernment.GetCourtTitle] пока может не ждать дурных вестей."
 chi_expedition_is_returning_to_china: "$expedition_name_treasure_voyage$ раздала все дары и до конца плавания больше не будет заходить в чужеземные порты"
 treasure_fleet_events.25.desc: "Дозорные замечают парус на горизонте: это богато гружённый торговый флот, бороздящий те же воды, что и наш. $expedition_leader_name$ велит капитанам встретить его с миром, и начинается бойкий обмен: [ShowGoodsName('silk')] в отрезах и тонкий [ShowGoodsName('porcelain')] идут в обмен на пряности, самоцветы и диковины южных морей.\n\n$expedition_name_treasure_voyage$ идёт дальше с потяжелевшими трюмами."
 treasure_fleet_events.30.desc: "Пока флот стоит на якоре у [target_stop.GetName], местный двор устраивает большой пир в честь гостей, ведь в гавань пришла сама $expedition_name_treasure_voyage$. Перед гостями играют музыканты, пляшут танцоры, подают яства ста видов; $expedition_leader_name$ и капитаны в ответ подносят положенные по обычаю дары и превозносят величие, которым славится [GetInternationalOrganization('middle_kingdom').GetName].\n\nСлава о том, сколь достойно держится флот на чужбине, непременно дойдёт до родины."
 treasure_fleet_events.31.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] и заморские диковинки"
 treasure_fleet_events.31.desc: "[target_stop.GetName] — порт, чьи рынки ломятся от чудес, неведомых в наших землях: птицы в клетках немыслимых окрасок, невиданные звери, ароматная древесина и самоцветы чужеземной огранки. Купцы, которых везёт $expedition_name_treasure_voyage$, могли бы набить целый трюм диковинками, от которых [ROOT.GetCountry.GetGovernment.GetRulerTitle] придёт в восторг, — но ради этого придётся расстаться с частью золота, отложенного на дары.\n\nОткроем ли мы сундуки?"
 treasure_fleet_events.32.desc: "В порту [target_stop.GetName] среди тесных складов, где хранилась часть товаров флота, вспыхивает пожар. Моряки, которых привела сюда $expedition_name_treasure_voyage$, встают в цепочки с вёдрами, но пламя успевает поглотить ящики, где лежали [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')], отложенные на дары."
 treasure_fleet_events.54.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] узнаёт, что при дворе державы [insulting_court.GetName] посланников, которых доставила $expedition_name_treasure_voyage$, встретили не с тем почтением, какого заслуживает [GetInternationalOrganization('middle_kingdom').GetName], а с открытым презрением, — и [insulting_court.GetGovernment.GetRulerTitle] даже не думает заглаживать обиду.\n\n$expedition_leader_name$ ждёт нашего слова. Ответим ли мы на такое пренебрежение или нам не пристало его замечать?"
 treasure_fleet_events.55.desc: "Донесения, которые получает [ROOT.GetCountry.GetGovernment.GetCourtTitle], несут неожиданные вести. Вдали от дома $expedition_leader_name$ бросает оружие и сокровища, что везёт $expedition_name_treasure_voyage$, на поддержку правителя державы [country_at_war_with.GetName], которую ныне раздирает война за престол.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] встречает эту новость по-разному. Одни дивятся тому, как далеко простирается ныне влияние, которым обладает [GetInternationalOrganization('middle_kingdom').GetName]. Другие ворчат, что распри далёких царств нас не касаются."
 treasure_fleet_events.56.desc: "$expedition_name_treasure_voyage$ шлёт весть: $expedition_leader_name$ отдаёт императорских воинов в помощь принимающему двору в его войне. [target_country.GetName], увидев наших людей в рядах противника, отныне числит [GetInternationalOrganization('middle_kingdom').GetName] среди своих врагов.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] не может прийти к единому мнению. Для одних это доказательство того, что рука трона дотягивается ныне даже до другого края света. Для других — ненужный враг, нажитый в войне, которая никогда не была нашей."
 treasure_fleet_events.57.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает тяжёлые вести. При дворе державы [contemptuous_court.GetName] посланников, которых доставила $expedition_name_treasure_voyage$, встретили с таким неприкрытым презрением, что флот, который ведёт $expedition_leader_name$, снялся с якоря и покинул их воды: положенные по обычаю любезности нам швырнули в лицо.\n\nЛетописец флота сделал в своей книге запись: [contemptuous_court.GetNameWithNoTooltip] — среди тех, кто оскорбил [GetInternationalOrganization('middle_kingdom').GetName]. Запомним ли мы это оскорбление или простим?"
 treasure_fleet_events.58.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает радостную весть. Воодушевлённый тем, что поблизости находится $expedition_name_treasure_voyage$, двор державы [avenging_court.GetName] поднял оружие против нашего обидчика: это [target_country.GetName], та самая держава, что некогда встретила наших посланников презрением.\n\nВидно, гнев Небес не нуждается в императорской армии, чтобы дать о себе знать. Влияние, которым обладает [GetInternationalOrganization('middle_kingdom').GetName], простирается даже на войны далёких царей."
 treasure_fleet_events.59.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает донесения о процветающей общине наших соотечественников в далёком порту [diaspora_port.GetName]. Купцы и моряки, осевшие там много поколений назад, взяли в жёны местных женщин и разбогатели, а теперь к этим далёким родичам пришла $expedition_name_treasure_voyage$, и $expedition_leader_name$ протягивает им руку.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] встречает эту новость по-разному. Одни преисполнены гордости оттого, что [GetInternationalOrganization('middle_kingdom').GetName] оставило свою кровь в каждом порту южных морей. Другие хмурятся при мысли о подданных, что обосновались так далеко от могил своих предков."
 treasure_fleet_events.60.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] узнаёт о досадном происшествии при дворе державы [offended_court.GetName]. По незнанию обрядов чужой веры наш посланник — $expedition_leader_name$ — нанёс хозяевам тяжкое оскорбление, и теперь [offended_court.GetGovernment.GetRulerTitle] требует, чтобы он загладил вину.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] колеблется. Одни полагают, что посланники, которых шлёт [GetInternationalOrganization('middle_kingdom').GetName], не обязаны склоняться перед чужими алтарями. Другие опасаются, что подобная небрежность запятнает наше имя в каждом порту, который ещё ждёт впереди."
