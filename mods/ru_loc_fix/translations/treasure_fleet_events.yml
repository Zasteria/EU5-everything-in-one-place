l_russian:
 treasure_fleet_events.49.desc: "Отношения между [ROOT.GetCountry.GetName] и нашими гостями — участниками экспедиции «$expedition_name_treasure_voyage$» — упали ниже некуда. В последние дни между нашим гарнизоном и иноземными моряками не раз вспыхивали стычки, но формально гости всё же поддерживали с нами отношения, пусть и прохладные. Однако последние события окончательно их подорвали: $expedition_leader_name$ только что осудил [ROOT.GetCountry.GetLongNameWithNoTooltip] и её устои, а экспедиция «$expedition_name_chinese_expedition$» готовится покинуть $expedition_location_name$, пока напряжение не переросло во что-то большее."
