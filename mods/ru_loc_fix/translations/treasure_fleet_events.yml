l_russian:
 treasure_fleet_events.4.desc: "В один из южных портов зашла джонка с вестями: донесение шлёт $expedition_name_treasure_voyage$. Флот, который ведёт $expedition_leader_name$, достиг гавани [port_location.GetName] в державе [port_country.GetName], где его по всем правилам принимает [port_country.GetGovernment.GetCourtTitle]. Наши посланники обменялись товарами, а [port_country.Custom('GetRulerOrRegentTitle')] принимает от них положенные по обычаю дары. Летописец флота сообщает, что ветер и время года благоприятствуют следующему этапу пути. Как замечает капитан, [ROOT.GetCountry.GetGovernment.GetCourtTitle] пока может не ждать дурных вестей."
 chi_expedition_is_returning_to_china: "$expedition_name_treasure_voyage$ раздала все дары и до конца плавания больше не будет заходить в чужеземные порты"
 treasure_fleet_events.31.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] и заморские диковинки"
 treasure_fleet_events.32.desc: "В порту [target_stop.GetName] среди тесных складов, где хранилась часть товаров флота, вспыхивает пожар. Моряки, которых привела сюда $expedition_name_treasure_voyage$, встают в цепочки с вёдрами, но пламя успевает поглотить ящики, где лежали [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')], отложенные на дары."
 treasure_fleet_events.1.zheng_he_owned_tt: "Чжэн Хэ должен сейчас состоять у нас на службе"
 treasure_fleet_events.7.desc_shared: "Завершив миссию на территории [ROOT.GetCountry.GetName], золотой флот [expedition_initiator.GetName] пополняет запасы и через несколько месяцев собирается выйти в море. [ROOT.GetCountry.GetFlavorRank] по обычаю преподносит таким гостям всё самое лучшее, что может предложить"
 treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$, в знак признательности за их визит."
