l_russian:
 ibadi_events.1.desc: "$legacy_of_rustamids_desc$\n\nВ духе древнего имамата [target_character.GetName] [Select_CString(target_character.IsFemale, 'провозглашена первой', 'провозглашён первым')] правителем региона [ShowRegionName('maghreb_region')], [Select_CString(target_character.IsFemale, 'носящей', 'носящим')] титул «[ShowPolicyName('ibadi_zuhur_imam_policy')]». Отныне правоверным больше не придётся таиться — [ShowPolicyNameWithNoTooltip('ibadi_kitman_imam_policy')] уходит в прошлое."
 ibadi_events.1.a: "Наступает новая эпоха."
 ibadi_events.1.b: "Воистину, [ROOT.GetCountry.GetReligion.GetGodName] благоволит нам!"
 may_adopt_a_different_color: "Мы можем принять #Y тёмно-синий цвет#! в качестве цвета нашей страны"
 rustamids_adopt_different_color: "Мы принимаем #Y тёмно-синий цвет#! в качестве цвета нашей страны"
 ibadi_events.2.desc: "[target_estate.GetName] всё сильнее недовольны правлением, которое ведёт [target_character.GetName] — [ShowPolicyName('ibadi_daif_imam_policy')]. В конце концов, власть слабого имама терпят лишь во времена бедствий, а [ShowReligionAdjective('ibadi')]им правоверным державы [ROOT.GetCountry.GetName] больше ничего не угрожает."
 ibadi_events.2.a: "Мы должны найти более достойного предводителя."
 ibadi_weak_imam_penalty_tt: "[ShowPolicyName('ibadi_daif_imam_policy')] будет приносить нам нарастающие штрафы, пока мы не сменим [Concept('ruler', 'правителя')|e] с помощью действия «[ShowGenericActionName('return_to_zuhur_imamate')]»"
 has_penalty_for_weak_imam: "Больше не соответствует требованиям, и [Concept('event', 'событие')|e] #Y $ibadi_events.2.title$#! уже произошло"
