 as_long_as_we_remain_at_75_colonial_dominance_dawa_colonial_administration_modifier_tt: "Если до конца ситуации «[GetSituationByKey('golden_century').GetName]» мы сохраним [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] на уровне #Y 75#!, нам будут доступны [Concept('bureaucracy', 'бюрократическая система')|e] «[ShowBureaucracyTypeName('dawa_bureaucracy')]» и преимущества модификатора «[ShowModifier('dawa_colonial_administration_modifier')]». Если мы удержим этот уровень до завершения столетней [Concept('situation', 'ситуации')|e], дополнительная ячейка [Concept('bureaucracy', 'бюрократии')] останется у нас навсегда."
