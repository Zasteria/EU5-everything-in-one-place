l_russian:
 REBEL_POWER_OF_SUPPORT: "[Concept('political_power', 'Политический вес')|e] мятежников: $VAL|V2$\n[political_power] (требуется): $REQUIRED_POWER|V2$\nНехватка политического веса: $SHORTFALL|V2$\nЕжемесячный прогресс: $PROGRESS|+=2%$"
 RSI_ESTATE_POP_SATISFACTION: "[Concept('pops', 'Группы населения')|e] присоединяются к этим повстанцам из-за собственного уровня [Concept('pop_satisfaction', 'довольства')|e]. Показатель [Concept('estate_satisfaction', 'довольства сословия')|e] «[ESTATE.GetNameWithNoTooltip]» ($SAT|1%$) на это не влияет. Каждая [Concept('pop', 'группа населения')|e] продолжает восстание, пока её [Concept('pop_satisfaction', 'довольство')] не превысит порог для её [Concept('location', 'района')|e]."
 RSI_LOCATION_ENTRY: "$BULLET$[LOCATION.GetName]: $POP|V$@population!, довольство — $SAT|1%$. Восстание прекратится при довольстве выше $LEAVE|0%$"
 RSI_MORE_LOCATIONS: "$BULLET$Других [Concept('locations', 'районов')|e]: $COUNT|V$"
