 bookmark_1337_name: "Столетняя война"
 bookmark_1337_desc: "Европу раздирают династические распри, а на горизонте уже маячит Чёрная смерть. От степей Золотой Орды до молодых итальянских республик — каждая держава стоит на распутье."
 bookmark_1658_name: "Эпоха великодержавия (тест)"
 bookmark_1658_desc: "Тестовая закладка для проверки семантики include и переопределений. Большинство файлов начальных условий через include берут данные закладки 1337 года; для SWE переопределены границы 1658 года (Сконе, Халланд, Эстония, Ливония). В журнале ожидаются ERRORLOGs о районах, которые уже кому-то принадлежат, — это описано в agent_docs/bookmark_overrides.md."
