l_russian:
 flavor_cas.60.title: "Конгрегация De Auxiliis"
 flavor_cas.126.a: "Приятного аппетита!"
 flavor_cas.144.a_tt: "Завершение [Concept('expedition', 'экспедиции')|e] «$pacific_crossing_expedition$» откроет доступ к решению, которое вызовет следующее событие:"
 flavor_cas.146.b: "Отправить людей на поиски затонувшего корабля."
 flavor_cas.146.b_tt: "Мы отправим поисковый отряд искать затонувший сокровищный галеон, но затраты на поиски могут превысить сомнительную награду."
 flavor_cas.147.desc_positive: "Нашему поисковому отряду наконец удалось найти обломки «Сан-Хосе». Галеон затонул у самого берега, на мелководье, и наши ныряльщики и спасатели смогли добраться до его драгоценного груза. Большую часть сокровищ подняли со дна, и теперь ими владеет [ROOT.GetCountry.GetName]. Осталось решить, как распределить вновь обретённое богатство."
 flavor_cas.147.desc_negative: "Поисковый отряд, отправленный за обломками «Сан-Хосе», вернулся ни с чем. Несметные сокровища по-прежнему скрыты под волнами, и где они — неизвестно. Быть может, корабль затонул там, где глубина недосягаема для любого ныряльщика, а может быть, течения унесли обломки далеко от тех мест, где их рассчитывали найти..."
 flavor_cas.147.expedition_tt: "Отправлен поисковый отряд на поиски обломков «Сан-Хосе»"
 flavor_cas.147.c_positive: "Сокровища принадлежат поисковому отряду."
 flavor_cas.1900.desc: "Наши [ShowCultureName('catalan')]ие провинции подняли открытый мятеж. Народ, вынужденный давать постой нашим войскам и нести тяготы войны, восстал против власти, которой обладает [target_ruler.GetName], и против самих устоев, на которых держится [ROOT.GetCountry.GetFlavorRank]. Беспорядки охватили не одно поселение, деревни в огне, а мятежники уже ищут защиты у наших врагов.\n\nМы должны решить, как ответить на это неповиновение, иначе пламя мятежа поглотит и нас."
 flavor_cas.1900.b.tt: "Каждый [ShowCultureName('catalan')]ий [Concept('location', 'район')|e] получает «[ROOT.GetStaticModifier('cas_catalan_crackdown').GetNameWithTooltip]» на 5 лет, но его [Concept('pops', 'группы населения')|e] теряют [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 flavor_cas.1901.desc_subject: "[GetCountry('POR').GetName] полнится недовольством. Хотя [GetCountry('POR').GetFlavorRank] по-прежнему сохраняет под нашей короной собственные законы и обычаи, многие [ShowCultureName('portuguese')]ие подданные вновь мечтают о независимом королевстве.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен')] решить, насколько крепко [ROOT.GetCountry.GetFlavorRank] будет удерживать наши владения вместе."
 flavor_cas.1901.desc_annexed: "Наши [ShowCultureName('portuguese')]ие земли, которые давно уже включает в себя [ROOT.GetCountry.GetFlavorRank], подняли мятеж. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] сплотились, их вождь — [target_character.GetName], и они провозглашают восстановление независимого королевства.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен')] решить, как встретить этот мятеж."
 flavor_cas.1902.desc: "В наших [ShowCultureGroupName('italian_group')]их владениях вспыхнула народная революция. Во многих тамошних поселениях люди восстали против непосильных налогов, которыми мы оплачиваем свои войны, и теперь улицы в руках революционных правительств. От их ярости страдают [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] — не меньше, чем власть, которую олицетворяет [target_character.GetName].\n\n[ROOT.GetCountry.GetFlavorRank] не может медлить: порядок нужно восстановить прежде, чем зараза расползётся дальше."
 flavor_cas.1902.a.tt: "Каждый [ShowCultureGroupName('italian_group')]ий [Concept('location', 'район')|e] получает «[ROOT.GetStaticModifier('cas_naples_crackdown').GetNameWithTooltip]» на 5 лет, но его [Concept('pops', 'группы населения')|e] теряют [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [Concept('pop_satisfaction', 'довольства')|e]"
 flavor_cas.35.title: "Экспедиция: [target.GetLastNameWithNoTooltip]"
 flavor_cas.35.desc: "Честолюбивый и храбрый конкистадор по имени [target.GetName] явился ко двору, взахлёб рассказывая о несметных богатствах и плодородных землях далёкого Нового Света. Отвага и решимость этого человека не подлежат сомнению, и теперь он хочет, чтобы сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» поддержало его экспедицию для исследования и покорения загадочных земель в Андах."
 flavor_cas.36.title: "Честолюбие: [target.GetNameWithNoTooltip]"
 flavor_cas.36.desc: "Конкистадор по имени [target.GetName] прославился своими дерзкими деяниями в Новом Свете. [target.GetLastNameWithNoTooltip] известен стремлением расширить влияние державы [ROOT.GetCountry.GetName] в регионе [ShowRegionName('mesoamerica_region')] и уже нацелился на [ShowLocationName('tenochtitlan')]. Теперь он ищет нашей поддержки для новых предприятий. Ходят рассказы о несметных богатствах и невиданных возможностях, и кое-кто полагает, что его поддержка принесёт державе [ROOT.GetCountry.GetNameWithNoTooltip] небывалую славу и богатство."
 flavor_cas.36.a: "Поддержать экспедицию: [target.GetLastNameWithNoTooltip]."
