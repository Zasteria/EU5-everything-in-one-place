l_russian:
 flavor_cas.60.title: "Конгрегация De Auxiliis"
 flavor_cas.126.a: "Приятного аппетита!"
 flavor_cas.147.desc_positive: "Нашему поисковому отряду наконец удалось найти обломки «Сан-Хосе». Галеон затонул у самого берега, на мелководье, и наши ныряльщики и спасатели смогли добраться до его драгоценного груза. Большую часть сокровищ подняли со дна, и теперь ими владеет [ROOT.GetCountry.GetName]. Осталось решить, как распределить вновь обретённое богатство."
 flavor_cas.35.title: "Экспедиция: [target.GetLastNameWithNoTooltip]"
 flavor_cas.35.desc: "Честолюбивый и храбрый конкистадор по имени [target.GetName] явился ко двору, взахлёб рассказывая о несметных богатствах и плодородных землях далёкого Нового Света. Отвага и решимость этого человека не подлежат сомнению, и теперь он хочет, чтобы сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» поддержало его экспедицию для исследования и покорения загадочных земель в Андах."
 flavor_cas.36.title: "Честолюбие: [target.GetNameWithNoTooltip]"
 flavor_cas.36.desc: "Конкистадор по имени [target.GetName] прославился своими дерзкими деяниями в Новом Свете. [target.GetLastNameWithNoTooltip] известен стремлением расширить влияние державы [ROOT.GetCountry.GetName] в регионе [ShowRegionName('mesoamerica_region')] и уже нацелился на [ShowLocationName('tenochtitlan')]. Теперь он ищет нашей поддержки для новых предприятий. Ходят рассказы о несметных богатствах и невиданных возможностях, и кое-кто полагает, что его поддержка принесёт державе [ROOT.GetCountry.GetNameWithNoTooltip] небывалую славу и богатство."
 flavor_cas.36.a: "Поддержать экспедицию: [target.GetLastNameWithNoTooltip]."
 flavor_cas.1200.a.possession_tt: "Мы сможем ввести политику «[ShowPolicyName('right_of_possesion')]»"
