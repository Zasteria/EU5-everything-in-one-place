l_russian:
 great_pestilence.8.desc: "Из нашей колонии [target_location.GetName] приходят полные страха письма: Чёрная смерть косит там коренное население так, что никто не может найти этому объяснения. Колонисты видят, как болезнь распространяется, не встречая преград, и не сомневаются, что рано или поздно она обрушится и на них. Они умоляют корону прислать серебро и припасы, врачей и провиант — всё, что могло бы уберечь их от участи, которую они видят повсюду вокруг.\n\nОткликнемся ли мы на их мольбу и отправим за океан всю помощь, какую сможем, или оставим их встречать мор с тем немногим, что у них есть?"
