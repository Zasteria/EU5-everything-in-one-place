l_russian:
 mos_aptekarsky_prikaz_decision.desc.entry: "Приказы плохо приспособлены к тому, чтобы бороться со вспышками болезней и наводить порядок в тех частях страны, что поразила чума. Нам следует учредить новое ведомство, отдельное от прежних приказов, которое будет оказывать помощь, если мор снова обрушится на наш народ."
 mos_greek_latin_academy_decision.title: "Основание: $greek_latin_academy$"
 mos_greek_latin_academy_decision.desc.entry: "Нашим дипломатам недостаёт владения [ShowLanguageName('latin_language')]им языком, и это сильно вредит нашим иностранным делам. $name_simeon.east_slavic_language$ $Sitnianowicz$ предлагает как следует обучить их этому языку, а сверх того вызвался преподавать простому народу риторику, чтобы люди лучше владели словом."
 rus_free_economic_society_decision.desc: "Сельское хозяйство по-прежнему остаётся основой нашего общества, однако приёмы земледелия, которыми пользуются [ShowPopTypeName('peasants')], косны и малоурожайны в сравнении с соперничающими державами. Один из творцов нашей политики предложил за скромную цену учредить экономическое общество для развития знаний в земледелии и торговле и вызвался сам взять на себя руководство им.\n\nЕсли общество добьётся успеха, ему следует также заняться просвещением земледельцев и подготовкой умелых работников — давать практические советы, издавать журналы и научные труды по этим вопросам."
 rus_nakaz_decision.title: "Наказ"
 rus_nakaz_decision.desc: "Всё очевиднее, что [ROOT.GetCountry.GetName] нуждается в скорейшем вступлении в новую эпоху просвещения и прогресса. Этому послужит смелый пересмотр свода законов в согласии с животворными принципами, охватившими Европу, — разумом, справедливостью и человеколюбием. Приняв эти ценности, мы наконец избавимся от устаревших правовых практик, что тормозят общественное развитие. Встанем же на путь реформ и утвердим равенство всех подданных перед законом."
 rus_nakaz_decision.a: "Прогресс бывает болезненным."
 rus_nakaz_decision.b: "Ограничимся реформой уголовных наказаний."
 rus_nakaz_decision.c: "Мы не осмелимся."
 rus_nakaz_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] возмущены угрозой своему могуществу"
 rus_nakaz_decision.tt3: "Уступки консерваторам усиливают их позиции"
 rus_nakaz_decision.historical_info: "#italic Наказ#!, или #italic Наказ Комиссии о составлении проекта нового Уложения#!, — свод законов, составленный Екатериной Великой для реформы и модернизации правовой системы. Написанный под влиянием идей Просвещения, он стремился согласовать законодательство с прогрессивной философией своего времени, а также упростить и прояснить законы. Наказ вводил более гуманные наказания, ограничивал применение пыток и провозглашал равенство всех подданных перед законом. Из-за сопротивления многочисленных консервативных сил он так и не был воплощён в полной мере, и со временем Екатерина обратилась к иным заботам."
 rus_proclaim_tsardom_decision.desc: "Собирание земель Русских завершено, [GetInternationalOrganizationType('tatar_yoke').GetName] сброшено. Как [GetCountry('RUS').GetFlavorRank], мы ныне стоим превыше всех прочих княжеств, и [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] призывают нас принять сан, достойный такого величия: пусть наш государь венчается как [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], наследник древних императоров и хранитель [ShowReligionAdjective('orthodox')]ой веры.\n\nТакое венчание возвестит каждому двору Европы и каждому ханству степи, что [GetCountry('RUS').GetName] не склоняется ни перед какой чужеземной короной."
 rus_proclaim_tsardom_decision.historical_info: "16 января 1547 года Иван IV Московский венчался на царство в Успенском соборе Кремля — первым из московских правителей он был официально облечён царским титулом. Митрополит Макарий, ратовавший за новый сан, возложил на него шапку Мономаха — украшенный драгоценными камнями венец с меховой опушкой, который, по придворному преданию, был за несколько столетий до того дарован византийским императором Константином IX великому князю Владимиру Мономаху.\n\nНовый титул знаменовал сознательный отказ от прежнего великокняжеского титулования и утверждал ранг, равный императорскому, — ранг наследника павших христианских империй Востока. Иностранные дворы не спешили его признавать: понадобились десятилетия дипломатии, прежде чем Священная Римская империя и папский престол согласились считать царя равным королю, а не просто переводом титула великого князя."
