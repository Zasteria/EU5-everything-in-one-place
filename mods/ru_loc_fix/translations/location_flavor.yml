l_russian:
 namgyeong_desc: "В защищённой горами котловине, где река Хан изгибается в сторону Жёлтого моря, лежит область Ханян, заселённая ещё с доисторических времён. В древности за обладание ею соперничали царства Пэкче и Когурё. При династии Корё значение этого места выросло: здесь возник #italic Намгён#!, или Южная столица, — одна из трёх второстепенных столиц в дополнение к царской резиденции в Гэгёне. Сменявшие друг друга правители не раз задумывались о переносе сюда двора по совету геомантов, восхвалявших благоприятное расположение города. К началу XIV века Ханян вырос в крупный город Корё, находящийся под номинальным сюзеренитетом монгольского государства Юань, а стратегическое положение на реке Хан сделало его естественными вратами, соединяющими Корейский полуостров с остальным миром."
