l_russian:
 flavor_dan.1000.title: "$india$ манит наших купцов"
 flavor_dan.1000.entry: "$flavor_dan.1000.title$"
 flavor_dan.1000.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] принимает группу [ShowCultureName('danish')]их купцов, задумавших снарядить экспедицию, цель которой — $india$. Они клянутся хранить ту верность, какой вправе требовать [ROOT.GetCountry.GetGovernment.GetRulerTitle] державы [ROOT.GetCountry.GetName], и хотят, чтобы у нашей страны появилась своя [ShowBuildingTypeName('trade_office')]. Успех экспедиции далеко не гарантирован, но, если мы рискнём, она поможет нам укрепить влияние на выгодную торговлю, которой славится [ShowContinentName('asia')]."
 flavor_dan.1000.a: "Курс — $india$!"
 flavor_dan.1000.tt: "Мы отправим экспедицию, чтобы основать торговую миссию. Её цель — $india$. Если экспедиция увенчается успехом, вложения окупятся с прибылью"
 flavor_dan.1000.b: "У нас есть заботы и поближе."
