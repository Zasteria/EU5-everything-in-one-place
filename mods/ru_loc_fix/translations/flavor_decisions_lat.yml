l_russian:
 ach_greek_populace_decision.desc: "С тех пор как [ShowScriptedGeographyName('greece_geography')] оказалась под [GetCountry('LAT').GetAdjective]им владычеством, прежняя [ShowCultureName('greek_culture')]ая элита пришла в упадок, однако кое-где в стране члены старых [ShowCultureNameWithNoTooltip('greek_culture')]их семейств сумели удержаться у власти, пойдя на компромисс с латинским сословием «[GetEstateName('nobles_estate')]». Но с падением державы «[GetCountry('LAT').GetLongNameWithNoTooltip]» [ShowCultureNameWithNoTooltip('greek_culture')]ое население всё упорнее противится латинскому владычеству.\n\nСтремясь упрочить своё правление, монарх пригласил ко двору представителей уцелевших [ShowCultureNameWithNoTooltip('greek_culture')]их семейств, чтобы выработать компромисс. Однако часть латинского сословия «[GetEstateNameWithNoTooltip('nobles_estate')]» вместо этого добивается дальнейшего расширения своих прав над [ShowCultureNameWithNoTooltip('greek_culture')]им населением, утверждая, что более сильная латинская элита сумеет подавить [ShowCultureNameWithNoTooltip('greek_culture')]ие волнения."
 ach_pope_proposes_latin_restoration.desc: "Наши походы не остались незамеченными: [ShowScriptedGeographyName('greece_geography')] стала ареной наших побед, и растущая мощь нашей державы привлекла внимание папского престола.\n\nПризнавая за нами статус «[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]», папа обещает, что [GetCountry('PAP').GetNameWithNoTooltip] окажет нам финансовую и политическую поддержку, если мы согласимся помочь ему в примирении [ShowReligionAdjective('catholic')]ой и [ShowReligionAdjective('orthodox')]ой церквей.\n\nКроме того, папа настаивает: если [ShowLocationName('constantinople')] вновь окажется в наших руках, трагедия, которую Четвёртый крестовый поход обрушил на [ShowLocationNameWithNoTooltip('constantinople')], не должна повториться."
 lat_frankokratia_pope_proposes_latin_restoration.desc: "Наша держава набирает силу, и сегодня [ShowScriptedGeographyName('greece_geography')] видит в нас одну из ведущих сил региона — это не ускользнуло от внимания папы. Теперь, когда [GetCountry('BYZ').GetName] клонится к упадку, папа видит именно в нас главного претендента, благодаря которому [GetCountry('LAT').GetLongName] может возродиться, а [ShowLocationName('constantinople')] — вновь стать её столицей.\n\nЕсли мы пойдём навстречу некоторым [GetCountry('PAP').GetAdjectiveWithNoTooltip]им требованиям и если [ShowLocationNameWithNoTooltip('constantinople')] снова станет нашим, папа обещает полную поддержку — за нами будет стоять [GetCountry('PAP').GetLongNameWithNoTooltip], — и признает нашего монарха законным правителем державы «[GetCountry('LAT').GetLongNameWithNoTooltip]»."
 lat_greater_claims_of_the_latin_empire.desc: "Когда в 1204 году пал [ShowLocationName('constantinople')], старая латинская знать поспешила укрепить власть над [GetCountry('BYZ').GetAdjective]ими владениями, которыми была усеяна [ShowScriptedGeographyName('greece_geography')], а также заявить о верховной власти над регионом [ShowRegionName('balkan_region')]. Однако в то время [GetCountry('SER').GetName] и [GetCountry('BUL').GetName] оказались опасными соперниками латинян, причём именно [GetCountry('BUL').GetNameWithNoTooltip] своими непрестанными походами на латинские земли в конце концов сыграла главную роль в крушении прежней империи.\n\nТеперь, когда Латинская империя восстановлена, мы можем заявить права на эти земли и добиться того, что оказалось не под силу прежней империи."
 lat_restore_the_holy_patriarchate.desc: "Хотя папа поначалу осуждал разграбление, которому в 1204 году подвергся [ShowLocationName('constantinople')], то, что [ShowLocationNameWithNoTooltip('constantinople')] оказался в руках [ShowReligionAdjective('catholic')]их крестоносцев, открыло возможность восстановить патриархат и тем возвысить [GetCountry('PAP').GetAdjective]ий престол. Однако в 1261 году [GetCharacter('byz_michael_viii_palaiologos').GetName] отвоевал [ShowLocationNameWithNoTooltip('constantinople')], и титул вновь утратил всякое значение.\n\nТеперь, когда [ShowLocationNameWithNoTooltip('constantinople')] снова под латинской властью, многие из сословия «[GetEstateNameWithNoTooltip('clergy_estate')]» призывают нас восстановить патриархат."
