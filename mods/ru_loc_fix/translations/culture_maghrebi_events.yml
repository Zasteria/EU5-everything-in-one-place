l_russian:
 maghrebi_culture_masters_of_sahara_country_bonus: "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»:"
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»; он затронет [Concept('locations', 'районы')|e] с флорой «[ShowVegetationName('desert')]»:"
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "Следующий бонус можно получить, приняв\n[Concept('decision', 'решение')|e] «$maghreb_masters_of_the_sahara.title$»; он затронет [Concept('locations', 'районы')|e] с климатом «[ShowClimateName('arid')]»:"
 maghrebi_culture.1.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')]ая община в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.1.desc: "Хотя в эпоху владычества Альмохадов значительную часть [ShowCultureName('mustaarabi')]их евреев изгнали из региона [ShowRegionName('maghreb_region')], в районе [target_location.GetName] вновь нашли убежище многие [ShowCultureNameWithNoTooltip('mustaarabi')]ие общины. И хотя [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective]ого правителя проводит более терпимую политику по отношению к [ShowReligionAdjective('judaism')]ой вере, наиболее радикальные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] заговорили о возвращении к давно отвергнутому учению Альмохадов."
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] останется прибежищем для [ShowCultureNameWithNoTooltip('mustaarabi')]их евреев."
 maghrebi_culture.1.b: "Пусть радикальные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] добьются своего: община должна принять [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.2.title: "[ShowReligionAdjectiveWithNoTooltip('ibadi')]ие земли [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.2.desc: "Немало времени минуло с тех пор, как в регионе [ShowRegionName('maghreb_region')] господствовала могущественная [ShowReligionAdjectiveWithNoTooltip('ibadi')]ая держава, однако [our_ruler.GetName] прилагает огромные усилия, чтобы объединить уцелевшие государства, по-прежнему верные [ShowReligionAdjective('ibadi')]ому учению. Пусть земли державы [ROOT.GetCountry.GetName] и уступают в богатстве более развитым государствам [ShowRegionNameWithNoTooltip('maghreb_region')]а, успехи, которых добивается [our_ruler.GetShortNameWithNoTooltip], ещё могут увенчаться рождением новой [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой державы."
 maghrebi_culture.2.a: "Мы проложим путь к сильной [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой державе в [ShowRegionNameWithNoTooltip('maghreb_region')]е!"
 maghrebi_culture.2.b: "Лучше нам идти собственным путём."
 maghrebi_culture.3.title: "Возрождение [ShowReligionAdjectiveWithNoTooltip('ibadi')]ой власти в [ShowRegionNameWithNoTooltip('maghreb_region')]е"
 maghrebi_culture.3.desc: "[our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'совершила', 'совершил')] невозможное, создав новую [ShowReligionAdjective('ibadi')]ую державу в регионе [ShowRegionName('maghreb_region')]. Теперь, когда держава [ROOT.GetCountry.GetName] стала одной из главных сил [ShowRegionNameWithNoTooltip('maghreb_region')]а, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё настойчивее призывает [our_ruler.GetNameWithNoTooltip] по-новому взглянуть на другие течения, на которые разделился [ShowReligionGroupName('muslim')]. Новая [ShowReligionAdjectiveWithNoTooltip('ibadi')]ая держава привлекла новых последователей, однако многие жители [ShowRegionNameWithNoTooltip('maghreb_region')]а по-прежнему исповедуют [ShowReligionAdjective('sunni')]ий ислам."
 maghrebi_culture.3.a: "Мы будем проводить политику терпимости ко всем течениям, на которые разделился [ShowReligionGroupNameWithNoTooltip('muslim')]."
 maghrebi_culture.3.b: "Приверженцы других течений должны принять [ShowReligionNameWithNoTooltip('ibadi')]."
 maghrebi_culture.4.title: "Молодые [ShowReligionAdjectiveWithNoTooltip('ibadi')]ие государства [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.4.desc: "Некогда [ShowReligionAdjective('ibadi')]ий султанат обладал огромным влиянием в регионе [ShowRegionName('maghreb_region')], однако за века, прошедшие после падения Рустамидов, многие ревностные [ShowReligionAdjectiveWithNoTooltip('ibadi')]ие верующие переселились в область [ShowAreaName('desert_area')]. Теперь, когда владения державы [ROOT.GetCountry.GetName] простираются до этих земель, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает: пусть [our_ruler.GetName] начнёт поход против державы [target_country.GetName] — одного из самых слабых осколков былого султаната."
 maghrebi_culture.4.a: "Воспользоваться слабостью державы [target_country.GetNameWithNoTooltip]!"
 maghrebi_culture.4.b: "Они слишком раздроблены и далеки, чтобы представлять угрозу."
 maghrebi_culture.5.title: "Подчинение [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]ого [ShowReligionAdjectiveWithNoTooltip('ibadi')]ого населения"
 maghrebi_culture.5.desc: "В области [ShowAreaName('desert_area')] издавна проживает многочисленное [ShowReligionAdjectiveWithNoTooltip('ibadi')]ое население, и теперь большая его часть оказалась под властью державы [ROOT.GetCountry.GetName]. Поскольку в державе [ROOT.GetCountry.GetNameWithNoTooltip] теперь живёт немало приверженцев [ShowReligionNameWithNoTooltip('ibadi')]а, [ROOT.GetCountry.GetGovernment.GetCourtTitle] настойчиво призывает [our_ruler.GetName] проводить политику терпимости по отношению к [ShowReligionAdjectiveWithNoTooltip('ibadi')]им верующим, иначе государству грозят религиозные волнения."
 maghrebi_culture.5.a: "Они должны обратиться в [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.5.b: "Лучше постараться мирно интегрировать [ShowReligionAdjectiveWithNoTooltip('ibadi')]ое население."
 maghrebi_culture.6.title: "Растущее влияние державы [ROOT.GetCountry.GetNameWithNoTooltip]"
 maghrebi_culture.6.desc: "В десятилетия после падения Альмохадов наибольшим влиянием в регионе [ShowRegionName('maghreb_region')] пользовались державы [target_country_1.GetName] и [target_country.GetName], однако под предводительством [our_ruler.GetName] нам удалось создать в [ShowRegionNameWithNoTooltip('maghreb_region')]е могущественное государство, не уступающее державе [target_country.GetNameWithNoTooltip]. И хотя знать держав [target_country_1.GetNameWithNoTooltip] и [target_country.GetNameWithNoTooltip] с опаской смотрит на [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое влияние, многие [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]ие народы приняли нашу власть куда охотнее."
 maghrebi_culture.6.a: "Мы установим [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ую власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом!"
 maghrebi_culture.7.title: "Орошение пальмовых рощ в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.7.desc: "Хотя в регионе [ShowRegionName('maghreb_region')] немало плодородных земель, близость области [ShowAreaName('desert_area')] делает многие его уголки суровыми и неприветливыми.\n\nЖители района [target_location.GetName] просят выделить средства на постройку сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]»: [target_location.GetRank.GetName] надеется так смягчить самые тяжёлые условия жизни."
 maghrebi_culture.7.a: "Пусть местные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] получат средства на создание оросительной сети."
 maghrebi_culture.8.title: "Искусная архитектура района [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.8.desc: "Жители района [target_location.GetName] издавна славятся умением приспосабливать постройки к суровым условиям, которые диктует [ShowVegetationName('desert')], а зодчие, которых туда направил [ROOT.GetCountry.GetGovernment.GetCourtTitle], вернулись под большим впечатлением от увиденного. Хотя столица — [ROOT.GetCountry.GetCapital.GetName] — лежит в совсем иной местности, чем район [target_location.GetNameWithNoTooltip], наши зодчие уверены: если их поддержит [our_ruler.GetName], подобные улучшения можно провести и в столичном районе [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 maghrebi_culture.8.a: "Перенять особенности архитектуры района [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.8.b: "Лучше выделить району [target_location.GetNameWithNoTooltip] дополнительные средства."
 maghrebi_culture.9.title: "Традиции [ShowCultureGroupNameWithNoTooltip('amazigh_group')]их народов"
 maghrebi_culture.9.desc: "С тех пор как в одиннадцатом веке при поддержке Фатимидов многие [ShowCultureName('bedouin_culture')]ие племена переселились в регион [ShowRegionName('maghreb_region')], многим коренным [ShowCultureGroupName('amazigh_group')]им народам пришлось признать власть этой набирающей силу [ShowCultureGroupName('arabic_group')]ой элиты. Хотя под властью державы [ROOT.GetCountry.GetName] многие [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие народы сохранили самостоятельность, [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает пригласить в державу [ROOT.GetCountry.GetNameWithNoTooltip] часть этой элиты: пусть [ShowCultureGroupNameWithNoTooltip('arabic_group')]ие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] придадут нашей власти законность. Однако такое приглашение наверняка разгневает [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]."
 maghrebi_culture.9.a: "Нам следует искать сотрудничества с [ShowCultureGroupNameWithNoTooltip('arabic_group')]ой элитой."
 maghrebi_culture.9.b: "Лучше сохранить [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ие традиции."
 maghrebi_culture.10.title: "Растущее значение района [target_location.GetNameWithNoTooltip] для транссахарской торговли"
 maghrebi_culture.10.desc: "Район [target_location.GetName] лежит на одном из многочисленных торговых путей области [ShowAreaName('desert_area')], и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] издавна делают здесь остановку. Однако в последние годы, под защитой державы [ROOT.GetCountry.GetName], [target_location.GetRank.GetName] заметно вырос в значении: многие торговцы предпочитают останавливаться именно здесь, ведь путешествовать по [ROOT.GetCountry.GetAdjective]им землям безопасно. Возросшее значение принесло району [target_location.GetNameWithNoTooltip] широкую известность по всей Сахаре, но и легло на [target_location.GetRank.GetNameWithNoTooltip] тяжким бременем.\n\nЧтобы [target_location.GetRank.GetNameWithNoTooltip] и впредь оставался влиятельным торговым узлом, [ROOT.GetCountry.GetGovernment.GetCourtTitle] просит: пусть [our_ruler.GetName] выделит средства, без которых [target_location.GetRank.GetNameWithNoTooltip] не справится с растущим потоком торговцев."
 maghrebi_culture.10.a: "Район [target_location.GetNameWithNoTooltip] должен сохранить своё значение для транссахарской торговли!"
 maghrebi_culture.10.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] не может выделить средства району [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.11.title: "Расцвет земледелия в районе [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.11.desc: "Хотя район [target_location.GetName] находится в одном из самых суровых уголков региона [ShowRegionName('maghreb_region')], его жители сумели наладить жизнь благодаря недавнему расширению сооружения «[ShowBuildingTypeName('maghreb_palm_irrigation')]», которое стало настоящим благом: от него особенно выиграли [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] района [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.12.title: "Под властью династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]"
 maghrebi_culture.12.desc: "Со времён падения Альмохадов [ShowCultureName('tunisian')]ая династия [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] сохраняет немалое влияние на востоке региона [ShowRegionName('maghreb_region')]. Хотя держава [ROOT.GetCountry.GetName] сохранила определённую независимость от державы [target_country.GetName], правители из династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] показали себя умелыми сюзеренами, способными защитить [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие земли. Однако по мере того как правление Альмохадов уходит в далёкое прошлое, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё чаще ставит под сомнение законность власти династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]: не пора ли державе [ROOT.GetCountry.GetNameWithNoTooltip] сбросить [ShowCultureNameWithNoTooltip('tunisian')]ое иго?"
 maghrebi_culture.12.a: "Династия [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] надёжно защищает державу [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.12.b: "Пора сбросить оковы династии [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]."
 maghrebi_culture.13.title: "[ShowCultureNameWithNoTooltip('tunisian')]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] вмешиваются во внутренние дела"
 maghrebi_culture.13.desc: "Хотя [ROOT.GetCountry.GetLongName] уже давно признаёт [ShowCultureName('tunisian')]ий сюзеренитет, [ROOT.GetCountry.GetGovernment.GetCourtTitle] державы [ROOT.GetCountry.GetNameWithNoTooltip] по большей части сохраняет самостоятельность. Однако недавно [target_character.GetName] [Select_CString(target_character.IsFemale, 'совершила', 'совершил')] несколько вылазок на исконные [ROOT.GetCountry.GetCulture.GetName]ие земли, и по всей державе [ROOT.GetCountry.GetNameWithNoTooltip] начались волнения. Многие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] требуют немедленно изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip], хотя такое изгнание наверняка разгневает державу [target_country.GetName]."
 maghrebi_culture.13.a: "Изгнать [target_character.GetNameWithNoTooltip] из державы [ROOT.GetCountry.GetNameWithNoTooltip]!"
 maghrebi_culture.13.b: "Позволить [target_character.GetHerHim] остаться — [ROOT.GetCountry.GetGovernment.GetCourtTitle] стерпит."
 maghrebi_culture.14.title: "Своевольные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] разоряют район [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в смятении: пришли вести о том, что в районе [target_location.GetName] караваны грабят воины, преданные сословию «[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]». Район [target_location.GetNameWithNoTooltip] лежит на одном из важнейших транссахарских торговых путей, и здесь останавливаются многие торговцы. Многие пострадавшие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] требуют, чтобы ущерб, нанесённый своевольными воинами, возместили [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.14.a: "Заставить [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] возместить ущерб от набегов."
 maghrebi_culture.14.b: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получат выговор, но ущерб покроет казна."
 maghrebi_culture.14.c: "Поддержать [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] и не мешать набегам."
 maghrebi_culture.15.title: "[target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] всё сильнее поддерживают нас"
 maghrebi_culture.15.desc: "По мере того как [ROOT.GetCountry.GetAdjective]ая власть распространяется на регион [ShowRegionName('maghreb_region')], всё больше коренных народов присягает на верность державе [ROOT.GetCountry.GetNameWithNoTooltip]. Среди них [target_culture.GetName]ие [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] оказались самыми благосклонными к [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой власти: многие [target_culture.GetNameWithNoTooltip]ие вожди предлагают нам полную поддержку своих племён. Такой порыв со стороны [target_culture.GetNameWithNoTooltip]их племён застал [ROOT.GetCountry.GetGovernment.GetCourtTitle] врасплох: одни предлагают: пусть [our_ruler.GetName] обеспечит им полную поддержку государства и станет отстаивать [target_culture.GetNameWithNoTooltip]ие интересы по всему [ShowRegionNameWithNoTooltip('maghreb_region')]у, другие же советуют просто обратить их горячую преданность нам на пользу."
 maghrebi_culture.15.a: "Мы рады их поддержке!"
 maghrebi_culture.15.b: "Использовать их поддержку, чтобы укрепить наше влияние во всём [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.16.title: "Прославленный [target_culture.GetNameWithNoTooltip]ий генерал"
 maghrebi_culture.16.desc: "Сближение [target_culture.GetName]их народов и [ROOT.GetCountry.GetCulture.GetName]ой элиты пошло на пользу: [ROOT.GetCountry.GetAdjective]ая власть в регионе [ShowRegionName('maghreb_region')] окрепла. Чтобы [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий [ROOT.GetCountry.GetGovernment.GetCourtTitle] окончательно убедился в их преданности, [target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предложили отдать одного из своих одарённых вождей на службу державе [ROOT.GetCountry.GetNameWithNoTooltip]. Однако некоторые [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] убеждают [our_ruler.GetName] отклонить предложение: они опасаются, что если [target_culture.GetNameWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получат больше самостоятельности, это в конце концов подорвёт нашу власть в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.16.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] рад приветствовать [target_character.GetShortNameWithNoTooltip]!"
 maghrebi_culture.16.b: "Отказать [target_character.GetHimHer] в должности генерала."
 maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предлагают многообещающего генерала"
 maghrebi_culture.17.desc: "Хотя [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] державы [ROOT.GetCountry.GetName] не раз становились тяжким бременем — [ROOT.GetCountry.GetGovernment.GetCourtTitle] помнит это слишком хорошо, — в последние годы некогда непокорные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] начали признавать [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ую власть по всему региону [ShowRegionName('maghreb_region')]. Чтобы [ROOT.GetCountry.GetGovernment.GetCourtTitle] убедился в их новообретённой верности, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] предлагают поставить на службу державе [ROOT.GetCountry.GetNameWithNoTooltip] полководца по имени [target_character.GetName], о чьих талантах ходят легенды. Впрочем, [ROOT.GetCountry.GetGovernment.GetCourtTitle] опасается, что это лишь уловка: так [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] надеются добиться влияния, которое может дать им только [our_ruler.GetName]."
 maghrebi_culture.17.a: "Принять предложение, которое делают [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.17.b: "Мы не можем позволить, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] получили ещё больше влияния."
 maghrebi_culture.18.title: "Возвышение династии [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.18.desc: "После падения Альмохадов династии [ShowDynastyName('marinid_dynasty')] и [ShowDynastyName('hafsid_dynasty')] сосредоточили в своих руках немалую власть в регионе [ShowRegionName('maghreb_region')]. Однако недавние военные походы, которые возглавила династия [our_ruler.GetDynasty.GetName], проложили путь к возвышению новой силы в [ShowRegionNameWithNoTooltip('maghreb_region')]е. Хотя правление династии [our_ruler.GetDynasty.GetNameWithNoTooltip] в [ShowRegionNameWithNoTooltip('maghreb_region')]е снискало поддержку коренного [ShowCultureGroupNameWithNoTooltip('amazigh_group')]ого населения, [ROOT.GetCountry.GetGovernment.GetCourtTitle] склоняется к мысли, что нам стоит поискать союзников за пределами страны, если мы хотим превзойти других крупных игроков [ShowRegionNameWithNoTooltip('maghreb_region')]а."
 maghrebi_culture.18.a: "Нам следует искать союзников, чтобы укрепить своё положение."
 maghrebi_culture.18.b: "Лучше сосредоточиться на внутренней политике."
 maghrebi_culture.19.title: "Единство с [target_culture.GetNameWithNoTooltip]ими народами"
 maghrebi_culture.19.desc: "Переселение [ShowCultureName('bedouin_culture')]их племён в регион [ShowRegionName('maghreb_region')] в одиннадцатом веке изменило политический облик края, однако [ROOT.GetCountry.GetCulture.GetName]ие и [target_culture.GetName]ие народы, живущие под [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой властью, вновь ощутили своё единство. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое владычество над их родным [ShowRegionNameWithNoTooltip('maghreb_region')]ом во многом положило конец былой межплеменной вражде, и на смену ей пришло новое, общее для этих народов единство."
 maghrebi_culture.19.a: "Крепкое единство сделает нас непобедимыми!"
 maghrebi_culture.19.b: "Нам следует использовать наше прочное единство с [target_culture.GetNameWithNoTooltip]им народом, чтобы укрепить влияние в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghrebi_culture.19.c: "Культурные узы между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]им и [target_culture.GetNameWithNoTooltip]им народами нерушимы."
 maghrebi_culture.20.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ая власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом"
 maghrebi_culture.20.desc: "Многие представители [ROOT.GetCountry.GetCulture.GetName]ой элиты постепенно переняли [ShowCultureGroupName('arabic_group')]ие обычаи и традиции, и порой это приводило к столкновениям с более приверженными старине народами региона [ShowRegionName('maghreb_region')]. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] видят в [target_culture.GetName]их народах главный источник раздоров, и [ROOT.GetCountry.GetGovernment.GetCourtTitle] это хорошо знает: многие [target_culture.GetNameWithNoTooltip]ие старейшины отказываются вести дела с сословием «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]».\n\nПользуясь своим влиянием по всей державе [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] подали прошение: пусть [our_ruler.GetName] проводит более жёсткую политику ассимиляции [target_culture.GetNameWithNoTooltip]их народов. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] убеждает [our_ruler.GetShortNameWithNoTooltip] отклонить эти требования, опасаясь неизбежных волнений."
 maghrebi_culture.20.a: "Добиться их ассимиляции в [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ое общество."
 maghrebi_culture.20.b: "Лучше постараться интегрировать [target_culture.GetNameWithNoTooltip]ие народы."
 maghrebi_culture.21.title: "Бедственное положение [ShowRegionNameWithNoTooltip('maghreb_region')]а"
 maghrebi_culture.21.desc: "Падение последнего [ShowReligionGroupAdjective('muslim')]ого государства в регионе [ShowRegionName('iberia_region')] посеяло новую панику по всему региону [ShowRegionName('maghreb_region')]: многие опасаются, что [ShowReligionGroupAdjectiveWithNoTooltip('christian')]ие государства региона [ShowRegionNameWithNoTooltip('iberia_region')] вскоре обратят свой взор на [ShowRegionNameWithNoTooltip('maghreb_region')]. Многие [ShowCultureName('andalusi')]ие беженцы уже устремились в державу [ROOT.GetCountry.GetNameWithNoTooltip], надеясь укрыться от гнева [ShowCultureGroupName('iberian_group')]их народов."
 maghrebi_culture.21.a: "Мы не покоримся [ShowCultureGroupNameWithNoTooltip('iberian_group')]им захватчикам!"
 maghrebi_culture.21.b: "Нам следует быть готовыми к возможному вторжению."
 maghrebi_culture.22.title: "Выход в [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]"
 maghrebi_culture.22.desc: "Хотя жители державы [ROOT.GetCountry.GetName] куда привычнее к транссахарской торговле, походы под началом [our_ruler.GetName] помогли державе [ROOT.GetCountry.GetNameWithNoTooltip] прочно закрепиться на побережье и получить выход в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Видя в этом новые торговые возможности, многие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] призывают [ROOT.GetCountry.GetGovernment.GetCourtTitle] выделить средства на постройку нового флота, хотя некоторые опасаются, что это подорвёт традиционную транссахарскую торговлю, которая издавна приносит выгоду державе [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.22.a: "Нужно поскорее закрепиться на море."
 maghrebi_culture.22.b: "Мы не можем пренебречь своими транссахарскими торговыми путями."
 maghrebi_culture.23.title: "Время расплаты для арабизированной элиты"
 maghrebi_culture.23.desc: "[target_culture.GetName]ая элита издавна обладает немалой властью в регионе [ShowRegionName('maghreb_region')]. Она же давно стала яблоком раздора для многих [ShowCultureGroupName('amazigh_group')]их народов, ведь её представители выступают за жёсткую ассимиляцию и требуют перенимать [ShowCultureGroupName('arabic_group')]ие обычаи. С возвышением державы [ROOT.GetCountry.GetName] — [ROOT.GetCountry.GetFlavorRank], где у власти по-прежнему [ROOT.GetCountry.GetCulture.GetName]ая элита, — некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] призывают [our_ruler.GetName] обуздать [target_culture.GetNameWithNoTooltip]ую знать. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle] разделился во мнениях: многие видят в [target_culture.GetNameWithNoTooltip]ой элите бесценного союзника, который поможет нам укрепить растущую власть над [ShowRegionNameWithNoTooltip('maghreb_region')]ом."
 maghrebi_culture.23.a: "Искать компромисса между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ой и [target_culture.GetNameWithNoTooltip]ой элитами."
 maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip]ому влиянию в [ShowRegionNameWithNoTooltip('maghreb_region')]е пришёл конец."
 maghrebi_culture.24.title: "Новые [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]ие килимы"
 maghrebi_culture.24.desc: "[ROOT.GetCountry.GetCulture.GetName]ие ковры издавна ценятся во всём регионе [ShowRegionName('maghreb_region')] и служат важным товаром для многих [ROOT.GetCountry.GetAdjective]их торговцев. Однако в последние годы благодаря более надёжному источнику товара «[ShowGoodsNameWithNoTooltip('dyes')]» появилось новое поколение [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]их килимов, и спрос на эти ковры растёт как в самом регионе [ShowRegionName('maghreb_region')], так и за его пределами."
 maghrebi_culture.24.a: "Извлечь выгоду из новых ковров."
 maghrebi_culture.24.b: "Мы должны и дальше вкладываться в новые ковры!"
 maghrebi_culture.25.title: "Объединение земель, которыми владеют [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.25.desc: "Хотя сила, которой обладают [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')], не раз помогала державе [ROOT.GetCountry.GetName] отражать угрозы, по мере того как [ROOT.GetCountry.GetFlavorRank] обрастает бюрократией, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё чаще спорит о том, насколько они полезны. Да, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] помогали защищать державу [ROOT.GetCountry.GetNameWithNoTooltip], но они же доставляли немало хлопот, когда не соглашались с политикой, которую проводит [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nТеперь [ROOT.GetCountry.GetGovernment.GetCourtTitle] обсуждает мысль о том, что государство окрепло достаточно и больше не нуждается в защите, которую дают [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]. Более того, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] пора окончательно обуздать ради укрепления растущей [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой державы."
 maghrebi_culture.25.a: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] вспомнят своё место в этом мире."
 maghrebi_culture.25.b: "Сохранить самостоятельность, которой пользуются [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], чтобы избежать внутренних распрей."
 maghrebi_culture.26.title: "Господство над [ShowRegionNameWithNoTooltip('maghreb_region')]ом"
 maghrebi_culture.26.desc: "С крахом Альмохадов регион [ShowRegionName('maghreb_region')] вступил в эпоху нестабильности, а влияние на регион [ShowRegionName('iberia_region')] ослабло, однако держава [ROOT.GetCountry.GetName], которой правит [our_ruler.GetName], стала фактическим гегемоном края. Хотя некоторые части [ShowRegionNameWithNoTooltip('maghreb_region')]а всё ещё остаются вне [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ого влияния, [ShowCultureGroupName('iberian_group')]ие королевства, скорее всего, признают в державе [ROOT.GetCountry.GetNameWithNoTooltip] регионального соперника, которого нельзя недооценивать, если они пожелают завоевать [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.26.a: "Мы станем защитниками Магриба!"
 maghrebi_culture.27.title: "Золотой век [ShowRegionNameWithNoTooltip('maghreb_region')]а при династии [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.27.desc: "Теперь, когда большая часть региона [ShowRegionName('maghreb_region')] находится под [ROOT.GetCountry.GetAdjective]ой властью, династия [our_ruler.GetDynasty.GetName] взялась за обновление многих важнейших памятников культуры в [ShowRegionNameWithNoTooltip('maghreb_region')]е и покровительствует строительству новых центров учёности. Ещё недавно этот край едва не оказался во власти чужеземных держав, но при династии [our_ruler.GetDynasty.GetNameWithNoTooltip] он превратился в могучую силу, перед которой благоговеет всё [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.a: "Пусть правление династии [our_ruler.GetDynasty.GetNameWithNoTooltip] и дальше несёт процветание"
 maghrebi_culture.28.title: "Влияние на корсаров"
 maghrebi_culture.28.desc: "Вся [ShowContinentName('europe')] знает каперов региона [ShowRegionName('maghreb_region')] как грозную силу, совершающую набеги на всё [ShowScriptedGeographyName('mediterranean_sea_geography')], однако до сих пор их покровители менялись от государства к государству.\n\nНо теперь, когда [ROOT.GetCountry.GetAdjective]ое влияние распространяется вдоль побережья, многие каперы обращаются к державе [ROOT.GetCountry.GetNameWithNoTooltip] в надежде заручиться нашей поддержкой, чтобы их набеги с новой силой охватили всё [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Впрочем, [ROOT.GetCountry.GetGovernment.GetCourtTitle] видит здесь и иную возможность: ослабить каперов и восстановить отношения с европейскими державами, чей гнев они навлекали на себя веками."
 maghrebi_culture.28.a: "Предоставить им полную поддержку государства."
 maghrebi_culture.28.b: "Позволить корсарам продолжать своё дело."
 maghrebi_culture.28.c: "Положить конец набегам корсаров"
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Централизовать совет Маджлис Амми Саид"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "После падения Рустамидов многие [ShowReligionAdjective('ibadi')]ие общины региона [ShowRegionName('maghreb_region')] были вынуждены бежать в долину Мзаб. Многие из этих [ShowReligionAdjectiveWithNoTooltip('ibadi')]их государств решили участвовать в совете Маджлис Амми Саид, во главе которого встали [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], другие же предпочли сохранить независимость.\n\nТеперь, когда многие из наиболее населённых [ShowReligionAdjectiveWithNoTooltip('ibadi')]их земель вошли в состав державы [ROOT.GetCountry.GetName], [our_ruler.GetName] стремится сосредоточить совет Маджлис Амми Саид в районе [ROOT.GetCountry.GetCapital.GetName], надеясь создать сильную и влиятельную [ShowReligionAdjectiveWithNoTooltip('ibadi')]ую державу в [ShowRegionNameWithNoTooltip('maghreb_region')]е."
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "Верность, которую хранят [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], поможет укрепить нашу власть!"
 maghreb_masters_of_the_sahara.title: "Повелители Сахары"
 maghreb_masters_of_the_sahara.desc: "Испокон веков народы региона [ShowRegionName('maghreb_region')] участвуют в транссахарской торговле, пересекая суровые пустыни с ценными товарами. Задача нелёгкая, но если мы сумеем установить прочное влияние в области [ShowAreaName('desert_area')] и расширить инфраструктуру главных караванных стоянок, наши народы, возможно, ещё укротят эти беспощадные пески."
 maghreb_masters_of_the_sahara.a: "Мы совершили невозможное!"
 empower_the_desert_power_privilege_tt: "Привилегия «[ShowEstatePrivilegeName('desert_power')]» станет значительно сильнее и получит дополнительные преимущества, смягчающие штрафы, которые несут [Concept('locations', 'районы')|e] с флорой «[ShowVegetationName('desert')]» и климатом «[ShowClimateName('arid')]»"
 empower_the_desert_power_privilege_tt_default_bonus: "Привилегия «[ShowEstatePrivilegeName('desert_power')]» также получит #G +0.0020#! [ShowModifierTypeName('global_monthly_development')] и #G +2.50%#! [ShowModifierTypeName('global_max_control')]"
