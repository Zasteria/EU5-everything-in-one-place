l_russian:
 ara_explain_coronation_in_zaragoza_mechanic_tt: "Будущие [Concept('rulers', 'правители')|e] будут получать [Concept('modifier', 'модификатор')|e] «[ShowModifier('ara_official_coronation')]», пока [ShowLocationName('zaragoza')] остаётся в наших руках; в противном случае они получат [Concept('modifier', 'модификатор')|e] «[ShowModifier('ara_lack_of_coronation')]»"
 ara_we_will_unlock_coronation_deicision_tt: "Мы сможем воспользоваться [Concept('decision', 'решением')|e] «[ShowDecisionName('ara_coronate_ruler')]», когда [ShowLocationName('zaragoza')] снова будет в наших руках"
 flavor_ara.25.desc: "Как бы мы ни старались править державой [ROOT.GetCountry.GetName] железной рукой, сословия, которые объединяет [ShowGovernmentReformName('crown_aragon_reform')], раз за разом находят способы помешать укреплению сословия [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Утверждая, что привилегии ограждают их от нашей власти, они к тому же собрали [ROOT.GetCountry.GetGovernment.GetCourtTitle], чтобы остановить любые наши шаги к объединению корон. [target_character.GetName] трезво оценивает нынешнее состояние унии и [Select_CString(target_character.IsFemale, 'намерена', 'намерен')] пустить в ход всё политическое влияние, каким обладает [target_character.GetSheHe], чтобы взять положение под контроль."
 flavor_ara.26.desc: "Влияние [ShowCultureName('catalan')]их купцов в державе [ROOT.GetCountry.GetName] постепенно начало менять наречие, на котором говорят во многих наших владениях.\n\nСвязи по всему Средиземноморью позволили им распространить свои обычаи и язык в каждом порту, с которым они торгуют. В регионе [ShowRegionName('italy_region')] многие представители сословия [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] уже торгуются на этом наречии. В области [ShowAreaName('aragon_area')], к великому неудовольствию сословия [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], его начал перенимать и простой люд. Многие из местной знати опасаются, что их обычаи будут вытеснены, и всеми силами противятся распространению наречия."
 ara_all_our_sons_will_join_the_order_tt: "Каждый [Concept('child', 'сын')|e] персонажа [target_character.GetName] вступит в [Concept('chivalric_order', 'рыцарский орден')|e] «[ShowChivalricOrderName('order_of_the_jar')]»"
 aragon_ruler_brother_fleeing_tt: "Брат правителя бежал"
