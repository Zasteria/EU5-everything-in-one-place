 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "Ежемесячное изменение на [MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2] по следующим причинам:"
 piety: "Благочестие"
 pilgrimage_expedition_cooldown: "Великое паломничество"
 pilgrimage_expedition_ruler_owner_tt: "[pilgrimage_ruler.GetName] находится при дворе державы [pilgrimage_ruler.GetCourtCountry.GetName]"
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Прибытие к выбранной [Concept('holy_site', 'святыне')|e] дарует награду, зависящую от нашей [Concept('religion', 'религии')|e]:\n$BULLET_WITH_TAB$#G +10#! [Concept('religious_influence', 'религиозного влияния')|e], [Concept('purity', 'чистоты')|e] или [Concept('karma', 'кармы')|e]; чем дальше святыня от нашей столицы, тем больше награда — вплоть до #G +100#!.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]ие религии вместо этого сдвигают [Concept('yanantin', 'янантин')|e] на #Y 20#! в сторону природы [Concept('god', 'божества')|e] этой [Concept('holy_site', 'святыни')].\n$BULLET_WITH_TAB$Подходящие [ShowReligionGroupAdjective('muslim')]ие школы сдвигаются ещё на #Y 10#! в сторону ценности «[ShowSocietyDirectionName('mysticism')]» или «[ShowSocietyDirectionName('jurisprudence')]»."
 treasure_fleet_expedition_outcome_overview: "$BULLET$Флот отправляется в путь с грузом даров, оплаченных из нашей казны.\n$BULLET$Если экспедиция благополучно вернётся, всё неизрасходованное станет [Concept('gold', 'дукатами')|e], и вдобавок мы получим #G +10#! [Concept('prestige', 'престижа')|e].\n$BULLET$Каждый иноземный двор к тому же реагирует по-своему:\n$BULLET_WITH_TAB$Двор, радушно принявший нас, даёт ещё #G +5#! [Concept('prestige', 'престижа')], может стать нашим данником в организации «[GetUniqueInternationalOrganization('middle_kingdom').GetName]» и присылает дань и редкие дары, которые обогатят наш [Concept('market', 'рынок')|e].\n$BULLET_WITH_TAB$Двор, отказавшийся стать данником, вместо этого получает модификатор «[ShowModifier('chi_resisting_subjugation')]», а наше взаимное [Concept('opinion', 'мнение')|e] снижается на #R -50#!."
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$По пути экспедиция наносит на карту открытый океан и открывает берега, до которых доходит.\n$BULLET$Высадка на берег затем даёт:\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Ещё #G +20#! [Concept('prestige', 'престижа')] за открытие Америки, которое откроет Новый Свет для будущей колонизации."
 hajj_caravan_expedition_outcome_overview: "$BULLET$Достигнув района [ShowLocationNameWithNoTooltip('mecca')], караван получает награду в зависимости от своего великолепия — до:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'престижа')|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Возвращение домой затем даёт:\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$[Concept('modifier', 'Модификатор')|e] «[ShowModifier('hajj_pious_return')]» на 5 лет.\n$BULLET_WITH_TAB$Постоянное почётное звание «[ShowModifier('hajji_pilgrim')]» — за первый хадж [Concept('ruler', 'правителя')|e].\n$BULLET$Караван должен добраться до района [ShowLocationNameWithNoTooltip('mecca')] в тот же год, когда отправился в путь, иначе паломничество будет полностью потеряно."
 splendor: "Великолепие"
 num_ships: "Корабли"
 cape_route_to_india_expedition_outcome_overview: "$BULLET$На каждой остановке вдоль африканского побережья можно основать [ShowBuildingTypeName('por_feitoria')], а в ничейной гавани — [ShowBuildingTypeName('por_trading_post')], получив [Concept('location', 'район')|e] в полное владение; каждое из них даёт свой долговременный торговый [Concept('modifier', 'модификатор')|e].\n$BULLET$Прибытие в район [ShowLocationName('kozhikode')] даёт «[ShowModifier('calicut_trade_rights')]» и полный трюм товара «[ShowGoodsName('pepper')]», который продаётся за [Concept('gold', 'дукаты')|e] по рыночной цене.\n$BULLET$Завершение плавания затем даёт:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Постоянный [Concept('modifier', 'модификатор')] «[ShowModifier('cape_route_pioneer')]» либо, если основаны три или пять фейторий, вместо него «[ShowModifier('portuguese_african_network')]» или «[ShowModifier('east_africa_trade_dominance')]»."
 grand_tour_expedition: "Гран-тур"
 grand_tour_expedition_outcome_overview: "$BULLET$Каждый посещённый город прибавляет знаний, связей или опыта — в зависимости от сделанного выбора — и даёт [Concept('research_progress', 'прогресс исследования')|e] за время, потраченное на учёбу, или [Concept('legitimacy', 'легитимность')|e] за время, проведённое при дворе.\n$BULLET$Посещение хотя бы трёх великих городов региона [ShowRegionNameWithNoTooltip('italy_region')] затем даёт:\n$BULLET_WITH_TAB$Свойство «[ShowTraitName('free_thinker')]», «[ShowTraitName('well_connected')]» или «[ShowTraitName('worldly')]» — смотря по тому, чего накопится больше всего.\n$BULLET_WITH_TAB$Постоянный [Concept('modifier', 'модификатор')|e] «[ShowModifier('returned_from_grand_tour')]».\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')|e].\n$BULLET$Сокращённое путешествие приносит лишь #G +5#! [Concept('prestige', 'престижа')] и не даёт [Concept('trait', 'свойства')|e]."
 grand_tour_expedition_heir_completed_tt: "Наследник ещё не совершал Гран-тур"
 grand_tour_expedition_stalled_status: "Пребывание в городе"
 experience: "Опыт"
 grand_tour_cooldown: "Гран-тур"
 grand_embassy_expedition_outcome_overview: "$BULLET$От того, насколько скрытно путешествует делегация, зависит, как долго её истинная цель остаётся тайной для каждого хозяина и как двор поведёт себя, когда правда раскроется.\n$BULLET$Каждый посещённый двор даёт некоторое количество «Возможностей» поучиться у него, а случайные встречи в пути могут развить навыки самого правителя, углубить «Модернизацию» или подорвать «Скрытность».\n$BULLET$По завершении посольства накопленная «Модернизация» ускоряет распространение [Concept('institutions', 'институтов')|e] во всех наших районах, причём в столице сильнее, чем в остальных, а также повышает [Concept('army_tradition', 'армейские традиции')|e] и, если посольство хоть раз заходило в порт, [Concept('navy_tradition', 'морские традиции')|e].\n$BULLET$Двор, отказавший делегации, стоит нам [Concept('prestige', 'престижа')|e]; двор, предоставивший доступ или уступивший просьбам о большем, приносит [Concept('prestige', 'престиж')|e] и новые «Возможности»."
 modernization: "Модернизация"
 pacific_crossing_expedition_outcome_overview: "$BULLET$Нанесение на карту обратного маршрута через [ShowContinentName('pacific_ocean_continent')] даёт:\n$BULLET_WITH_TAB$#G +100#! [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +15#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Долговременный [Concept('modifier', 'модификатор')|e] торгового пути.\n$BULLET_WITH_TAB$Груз товара «[ShowGoodsName('cloves')]», собранный в области [ShowAreaName('moluccas_area')] и проданный за [Concept('gold', 'дукаты')|e] по рыночной цене.\n$BULLET_WITH_TAB$Постоянный доступ к [Concept('decision', 'решению')|e] «[ShowDecisionName('charter_manila_galleon')]», которое можно принимать раз в пять лет ради значительной суммы [Concept('gold', 'дукатов')].\n$BULLET$Флот, который так и не найдёт путь домой, не принесёт ничего."
 cartographic_survey_expedition_outcome_overview: "$BULLET$Каждый исследованный [Concept('port', 'порт')|e] может получить долговременный [Concept('location_modifier', 'модификатор района')|e] на срок от 10 до 20 лет, повышающий выпуск одного из нескольких товаров — например, «[ShowGoodsName('fish')]», «[ShowGoodsName('pearls')]» или «[ShowGoodsName('amber')]» — либо улучшающий саму гавань; кроме того, исследование приносит [Concept('prestige', 'престиж')|e].\n$BULLET$Исследование трёх и более портов также даёт:\n$BULLET_WITH_TAB$[Concept('modifier', 'Модификатор')|e] «[ShowModifier('accurate_charts')]» на 15 лет.\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')].\n$BULLET$Исследование меньшего числа портов приносит лишь #G +5#! [Concept('prestige', 'престижа')]."
 mining_survey_expedition_outcome_overview: "$BULLET$Каждое исследование оставляет [Concept('modifier', 'модификатор')|e] «[ShowModifier('thorough_survey')]» на 20 лет, повышающий выпуск сырья по всей державе.\n$BULLET$Каждое найденное месторождение также оставляет после себя богатые залежи — например, «[ShowModifier('rich_silver_vein')]» или «[ShowModifier('rich_gold_strike')]», — которые можно разрабатывать открыто ради [Concept('prestige', 'престижа')|e] или тайно ради [Concept('gold', 'дукатов')|e].\n$BULLET$Кроме того, это даёт:\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'престижа')] за два и более найденных месторождения.\n$BULLET_WITH_TAB$#G +5#! за каждое исследованное высокогорье."
