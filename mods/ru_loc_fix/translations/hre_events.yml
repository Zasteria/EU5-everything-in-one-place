l_russian:
 hre.700.desc: "Рейхстаг собрался и одобрил важнейшее изменение в законах, по которым живёт [GetInternationalOrganizationType('hre').GetName]. Отныне коллегия выборщиков, в которой представлена вся [GetInternationalOrganizationType('hre').GetNameWithNoTooltip], станет полностью светской, и ни один правитель-теократ больше не сможет влиять на избрание следующего императора.\n\nЭто угрожает самому нашему положению в империи, и нам придётся выбрать один из двух путей. Мы можем указом секуляризировать нашу державу и сохранить статус «[ShowSpecialStatusName('elector')]» — теперь уже как светский князь, каких немало знает [GetInternationalOrganizationType('hre').GetNameWithNoTooltip], — или сохранить теократическое правление, довольствуясь скромным статусом «[ShowSpecialStatusName('imperial_prelate')]»."
