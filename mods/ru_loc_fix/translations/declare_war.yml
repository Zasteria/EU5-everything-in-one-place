 PRICE_ON_WAR_TRUST_JOIN: "Вступление в эту войну $PRICE_ON_WAR_TRUST_COMMON$"
 PRICE_ON_WAR_TRUST_COMMON: "немедленно снизит [Concept('trust', 'доверие')|e] обороняющейся стороны к нам на [GetDefine('NDiplomacy', 'TRUST_CHANGE_DECLARE_WAR')|R], а если мы при этом нарушаем [Concept('truce', 'перемирие')|e] с ними — ещё на [GetDefine('NDiplomacy', 'TRUST_CHANGE_BREAK_TRUCE_DEFENDER')|R]. Нарушение перемирия снизит доверие к нам всех других держав в области досягаемости на [GetDefine('NDiplomacy', 'TRUST_CHANGE_BREAK_TRUCE_IN_RANGE')|R]."
