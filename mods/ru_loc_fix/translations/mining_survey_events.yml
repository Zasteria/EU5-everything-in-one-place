l_russian:
 mining_survey_events.1.a: "Не скупиться. Отправить искусных пробирщиков и золото на образцы."
 mining_survey_events.1.b: "Хватит и скромной платы. Старейшины дадут проводников и кров."
 mining_survey_events.10.b: "Разрабатывать тихо. Соперникам-литейщикам пока незачем об этом знать."
 mining_survey_events.11.a: "Разрабатывать открыто. Пусть [ROOT.GetCountry.GetFlavorRank] знает: у нас есть [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b: "Разрабатывать тихо. Латунщики платят больше, пока слухи не расползлись."
 mining_survey_events.12.a: "Объявить о находке. Новая жила, где добывают [ShowGoodsNameWithNoTooltip('tin')], — дело государственной важности."
 mining_survey_events.12.b: "Держать в тайне. Прибрать к рукам торговлю бронзой раньше соперников."
 mining_survey_events.13.b: "Тихо распродать добычу по договорам пороховым мельницам и печатникам."
 mining_survey_events.14.a: "Возвестить о находке — пусть [ROOT.GetCountry.GetFlavorRank] знает. Рудник, где добывают [ShowGoodsNameWithNoTooltip('silver')], — это триумф."
 mining_survey_events.14.b: "Держать в тайне. Чужие глаза, обращённые на наше [ShowGoodsNameWithNoTooltip('silver')], сулят беду."
 mining_survey_events.14.historical_info: "Добыча серебра преобразила экономику Европы в позднее Средневековье и раннее Новое время. Открытие крупных серебряных жил в Шваце в Тироле и в Яхимове в Богемии в конце XV века, а затем находка в Потоси в Андах в 1545 году наводнили Европу слитками и подпитали великую инфляцию XVI века. Доходный серебряный рудник был стратегическим достоянием того же масштаба, что флот или крепость."
 mining_survey_events.15.b: "Разрабатывать тихо. [ShowGoodsNameWithNoTooltip('goods_gold')] притягивает непрошеных гостей."
 mining_survey_events.16.a: "Разрабатывать по [ROOT.GetCountry.GetGovernment.GetAdjective]ой грамоте. Пусть узнает и [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.16.b: "Сдать выработки в аренду железозаводчикам за постоянную долю."
 mining_survey_events.17.a: "Взять выработки под [ROOT.GetCountry.GetGovernment.GetAdjective]ий контроль. [ShowGoodsNameWithNoTooltip('stone')] — стратегический товар."
 mining_survey_events.17.b: "Сдать каменоломню в аренду гильдии каменщиков за постоянную плату."
 mining_survey_events.18.a: "Объявить о находке. Великая каменоломня, где добывают [ShowGoodsNameWithNoTooltip('marble')], — национальное сокровище."
 mining_survey_events.18.b: "Тихо приберечь [ShowGoodsNameWithNoTooltip('marble')] для [ROOT.GetCountry.GetGovernment.GetAdjective]их нужд."
 mining_survey_events.19.a: "Объявить о находке. Копи, где добывают [ShowGoodsNameWithNoTooltip('gems')], — чудо, которым стоит похвастаться."
 mining_survey_events.19.b: "Тихо приберечь [ShowGoodsNameWithNoTooltip('gems')] для [ROOT.GetCountry.GetGovernment.GetAdjective]ой казны."
 mining_survey_events.20.desc: "В нагорье вскрыто месторождение киновари: её ярко-красная руда безошибочно указывает, что в породе есть [ShowGoodsName('mercury')]. Реторту и конденсатор уже устанавливают на безопасном расстоянии от выработок, ведь известно, что пары, выделяющиеся при обжиге, расшатывают зубы и мутят рассудок. Алхимики, пробирщики и золотильщики будут черпать из этого рудника ещё целое поколение, а за столь редкий и полезный металл можно запросить любую цену."
 mining_survey_events.20.b: "Разрабатывать тихо. Монополия на [ShowGoodsNameWithNoTooltip('mercury')] — великая сила."
 mining_survey_events.21.b: "Сдать промысел в аренду торговцам солью за постоянную долю."
 mining_survey_events.22.a: "Объявить о находке. [ShowGoodsNameWithNoTooltip('alum')] — торжество мастерства, которым славится [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.22.b: "Разрабатывать тихо. Папской монополии на [ShowGoodsNameWithNoTooltip('alum')] знать об этом незачем."
 mining_survey_events.23.a: "Разрабатывать на правах [ROOT.GetCountry.GetGovernment.GetAdjective]ой монополии. [ShowGoodsNameWithNoTooltip('saltpeter')] — это война."
 mining_survey_events.23.b: "Позволить торговцам порохом разрабатывать залежь в обмен на право первыми получать добычу."
 mining_survey_events.30.a: "Отозвать отряд. Не всякая земля стоит того, чтобы хоронить в ней людей."
 mining_survey_events.31.a: "Оставить разработку. Местные не зря говорят о дурном воздухе."
 mining_survey_events.33.a: "Закрыть шахту. Свободные люди — опора, на которой стоит [ROOT.GetCountry.GetFlavorRank], и мы пришли не затем, чтобы их хоронить."
 mining_survey_events.33.historical_info: "Отравление свинцом, #italic colica plumbica#! древних, было хорошо известной профессиональной болезнью рудокопов, плавильщиков, стекольщиков и гончаров. Трактат Бернардино Рамаццини #italic De morbis artificum diatriba#! (1700), основополагающий труд медицины труда, отводил этому недугу обширную главу. Обычные средства — кровопускание, слабительное и питьё молока — не помогали, и единственной настоящей профилактикой было ограничение контакта со свинцом, к чему у владельцев рудников почти не было экономических стимулов."
 mining_survey_events.34.historical_info: "Серебряные жилы славились своей изменчивостью по простиранию: на одних участках они раздувались в рудные тела толщиной в несколько футов, на других сужались до пустых прожилков. Капризы строения жил превращали добычу серебра в ремесло просвещённого азарта, и взлёт и упадок средневековых горняцких городов, таких как Яхимов, Швац и Иглау, с мрачной закономерностью следовали за открытием и истощением отдельных жил."
 mining_survey_events.35.title: "Не всё то золото, что блестит"
 mining_survey_events.35.a: "Собираться и уходить. «Золото дураков» — старейшая ловушка старателей."
 mining_survey_events.36.a: "Закрыть выработку. Мы ещё не готовы бороться с рудничным газом."
 mining_survey_events.38.a: "Закрыть каменоломню. Трещиноватый [ShowGoodsNameWithNoTooltip('marble')] годится лишь на щебень для дорог."
 mining_survey_events.42.a: "Закрыть промысел. [ShowGoodsNameWithNoTooltip('alum')] здесь не получатся — химия не та."
 mining_survey_events.43.a: "Покинуть долину. Почва мертва, и [ShowGoodsNameWithNoTooltip('saltpeter')] здесь не образуется."
