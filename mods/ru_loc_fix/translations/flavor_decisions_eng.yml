l_russian:
 eng_navy_board_decision.desc: "Признано, что наши рубежи в известной мере уязвимы для иноземного вторжения. Чтобы обеспечить будущее державы [ROOT.GetCountry.GetName], мы должны установить власть над морями, омывающими наш остров, и пресекать любые попытки посягнуть на наши земли.\n\nРасширив возможности снабжения и упорядочив управление флотом, мы сможем ускорить кораблестроение и содержать более крупный флот с меньшими затратами."
 eng_grand_remonstrance_decision.desc: "Представитель парламента подал перечень жалоб, удовлетворение которых, по мнению депутатов, развеяло бы их тревоги о коррупции и о влиянии духовенства на государственные дела. Они указывают, что [ROOT.GetCountry.GetGovernment.GetRuler.GetName] уже долгое время правит, не созывая парламента, и теперь стремятся сохранить свои права и привилегии, ограничив власть монархии.\n\nКроме того, встаёт вопрос о королевских советниках, представляющих сословие [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]: их присутствие считают продолжением влияния Церкви на дела государства. Внесено предложение запретить духовным лицам участвовать в работе кабинета. Взамен парламент будет охотнее поддерживать новые законы."
 sco_witchcraft_act_decision.title.entry: "Закон о колдовстве"
