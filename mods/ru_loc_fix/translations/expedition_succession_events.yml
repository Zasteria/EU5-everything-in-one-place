l_russian:
 expedition_succession_events.morale_down_tt: "Гибель предводителя подрывает дух команды (#R -20#! Боевой дух экипажа)"
 expedition_succession_events.1.desc: "В столицу, [ROOT.GetCountry.GetCapital.GetName], приходит весть: предводитель экспедиции скончался. По счастью, среди оставшихся на борту офицеров нашёлся человек, которому хватает и знаний, и твёрдости духа, чтобы читать карты и держать команду в руках, — и с самой утраты остальные признают его старшинство.\n\nКоманда утверждает его в должности командира, и экспедиция продолжает плавание под его началом."
 expedition_succession_events.2.desc: "В столицу, [ROOT.GetCountry.GetCapital.GetName], приходит весть: адмирал флота скончался. В этих водах флоту без предводителя не обойтись, но, к счастью, один из офицеров достаточно высок чином и опытен, чтобы остальные принимали его слово как закон, — и он уже взошёл на шканцы.\n\nОфицеры утверждают его новым командующим флотом, и плавание продолжается под его началом."
 expedition_succession_events.3.desc: "Донесение, доставленное домой последней вернувшейся лодкой, сообщает, что предводитель экспедиции, [former_leader.GetName], погиб в походе. Отряд не стал дожидаться указаний: к тому времени, как письмо запечатали, уцелевшие уже решили дело между собой, как это обычно и водится у людей, оказавшихся вдали от любого двора.\n\nКомандование принимает [target.GetName], и экспедиция продолжает путь."
