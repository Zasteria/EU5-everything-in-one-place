l_russian:
 expedition_succession_events.1.desc: "В [ROOT.GetCountry.GetCapital.GetName] приходит донесение о том, что командир экспедиции скончался. К счастью, среди офицеров на борту есть человек, чьих знаний и отваги достаточно, чтобы читать морские карты и держать экипаж в руках, и после этой утраты остальные уже слушаются его.\n\nЭкипаж утверждает его командиром, и экспедиция продолжает путь под его началом."
 expedition_succession_events.2.desc: "В [ROOT.GetCountry.GetCapital.GetName] приходит донесение о том, что адмирал флота скончался. Без командира флоту в этих водах не пройти, но, к счастью, один из офицеров достаточно старший и опытный, чтобы остальные приняли его слово как закон, и он уже занял место на квартердеке.\n\nОфицеры признают его новым командующим флотом, и плавание продолжается под его руководством."
