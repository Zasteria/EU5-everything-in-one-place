l_russian:
 COLONY_FORECAST_ETA_LINE: "#T В ожидании#! Примерно $MONTHS|v0$ мес. до заселения следующего района.\nОценка исходит из нынешнего потока [Concept('migration', 'миграции')|e] в эту колонию и изменится, если он ускорится или замедлится."
 COLONY_FORECAST_ETA_UNKNOWN: "#T В ожидании#!\nУ этой колонии пока нет источника [Concept('migration', 'миграции')|e]. Оценка появится, когда начнут прибывать поселенцы."
 BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants! Источник истощён"
 BOTTLENECK_SOURCE_DEPLETED_TT: "#T Замедление: источник истощён#!\nНаш источник поселенцев иссяк. В районе, откуда в эту колонию отправляются [ShowPopTypeName('peasants')], больше некого отправлять, поэтому [Concept('migration', 'миграция')|e] будет идти медленно, пока не найдётся новый источник."
 BOTTLENECK_GOODS: "@warning_icon! @goods! Нехватка товаров"
 BOTTLENECK_GOODS_TT: "#T Замедление: нехватка товаров#!\nКолонии не хватает припасов. Она получает меньше 75% необходимых ей [Concept('goods', 'товаров')|e], поэтому может принять меньше новых поселенцев."
 BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence! Слабое морское присутствие"
 BOTTLENECK_MARITIME_TT: "#T Замедление: слабое морское присутствие#!\nЧтобы добраться до этой колонии, поселенцам нужно пересечь море, а наше [Concept('maritime_presence', 'морское присутствие')|e] в этих водах слишком слабо, чтобы перевозить их в полную силу."
 BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration! Низкая миграция"
 BOTTLENECK_LOW_MIGRATION_TT: "#T Замедление: низкая миграция#!\nНемногие из наших подданных готовы переселяться в колонии. Наша [Concept('migration', 'миграция')|e] слишком низка, чтобы поселенцы прибывали без перебоев."
 COLONIAL_CHARTER_FIRST_FLIP_SETUP: "Когда наши колонисты заселяют первый район колониальной провинции."
 COLONIAL_CHARTER_FIRST_FLIP_TITLE: "Первое поселение: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_DESC: "Наши колонисты в провинции $PROVINCE$ закрепились в районе $LOCATION$ — это первая часть [Concept('colonial_charter', 'колониального поселения')|e] $CHARTER$, перешедшая под нашу корону."
 COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "С этого плацдарма начнётся освоение всего остального."
 COLONIAL_CHARTER_FIRST_FLIP_LOG: "$CHARTER$ — первое поселение: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "Когда заселяется первый район колониальной провинции другой державы."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "Первое поселение: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "Держава $COUNTRY$ закрепилась в районе $LOCATION$ (провинция $PROVINCE$) — это первая часть [Concept('colonial_charter', 'колониального поселения')|e] $CHARTER$, перешедшая под её корону."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "С этого плацдарма может начаться освоение всего остального."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "$CHARTER$ — первое поселение державы $COUNTRY$: $LOCATION$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "Когда у источника миграции колониального поселения заканчиваются крестьяне и выбирается новый источник."
 COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "$CHARTER$: источник истощён"
 COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "Источник миграции, питавший [Concept('colonial_charter', 'колониальное поселение')|e] $CHARTER$ в провинции $PROVINCE$, исчерпан: там закончились [ShowPopTypeName('peasants')]. Выбран новый источник, но, пока он не наберёт силу, освоение может замедлиться."
 COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "Даже самые глубокие колодцы пересыхают."
 COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "$CHARTER$: источник миграции истощён"
 COLONIAL_CHARTER_HALFWAY_SETUP: "Когда прогресс колониального поселения превышает 50%."
 COLONIAL_CHARTER_HALFWAY_TITLE: "$PROVINCE$: колонизация наполовину завершена"
 COLONIAL_CHARTER_HALFWAY_DESC: "Колонизация провинции $PROVINCE$ в рамках [Concept('colonial_charter', 'колониального поселения')|e] $CHARTER$ завершена наполовину."
 COLONIAL_CHARTER_HALFWAY_FLAVOR: "Впереди более трудная половина, но путь назад теперь длиннее пути вперёд."
 COLONIAL_CHARTER_HALFWAY_BTN1: "Продолжаем."
 COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "Когда прогресс колониального поселения другой державы превышает 50%."
 COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "$PROVINCE$: колонизация наполовину завершена"
 COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "Колонизация провинции $PROVINCE$ державой $COUNTRY$ в рамках [Concept('colonial_charter', 'колониального поселения')|e] $CHARTER$ завершена наполовину."
 COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "Более трудная половина у них ещё впереди."
 COLONY_PILL_SELF_SUSTAINING: "#G Самоокупаемая#!"
 COLONY_SELF_SUSTAINING_HEADER: "Самоокупаемая"
 COLONY_OPERATING_AT_LOSS_HEADER: "Убыточная"
 COLONY_SELF_SUSTAINING_INCOME: "Ежемесячный доход: $VAL|+=$@gold!"
 COLONY_SELF_SUSTAINING_EXPENSE: "Ежемесячные расходы: #R -$VAL|2$@gold!#!"
 COLONY_SELF_SUSTAINING_RESULT: "#italic Колония окупает себя, поскольку её ежемесячный баланс $BALANCE|+=2$@gold! достигает необходимого порога в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
 COLONY_OPERATING_AT_LOSS_RESULT: "#italic Колония убыточна, поскольку её ежемесячный баланс $BALANCE|+=2$@gold! ниже необходимого порога в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
 COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "Ежемесячные расходы × запас: $EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"
 COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "Обычно освоение колониального поселения ускоряют три [Concept('cabinet_actions', 'действия совета')|e]:\n - Поддержка миграции\n - Расширение колониального поселения\n - Заселение приграничья\n\n#weak Нажмите, чтобы сразу перейти к этим действиям.#!"
 COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "Обычно развить недавно колонизированный район помогают три [Concept('cabinet_actions', 'действия совета')|e]:\n - Усиление контроля над провинцией\n - Развитие провинции\n - Поддержка миграции\n\n#weak Нажмите, чтобы сразу перейти к этим действиям.#!"
 COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "Обычно колониальной нации помогают расти два [Concept('cabinet_actions', 'действия совета')|e]:\n - Отправка людей в колонии\n - Развитие провинции\n\n#weak Нажмите, чтобы сразу перейти к этим действиям.#!"
