l_russian:
 flavor_pol.19.entry: "Славный король"
 flavor_pol.20.entry: "Великий замысел короля"
 flavor_pol.20.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] с едва скрываемой досадой взирает на разлаженную машину власти, что зовётся у нас [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [ShowEstatePrivilegeName('liberum_veto')] срывает одно заседание за другим, а [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] превращают каждое из них в забаву: они мечут вето, словно дротики, и любое предложение гибнет прямо в зале заседаний.\n\nНо надежда ещё есть. Те, кто страшится навязанной извне централизации, — а таких среди сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]» немало, — как ни парадоксально, могут предпочесть хаосу привилегий, что ныне грозят гибелью всему государству, реформы, после которых [ROOT.GetCountry.GetFlavorRank] окрепнет как единое целое."
 flavor_pol.21.entry: "Первый натиск короля"
 flavor_pol.21.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол с реформаторским пылом, который несёт с собой [ShowInstitutionName('enlightenment')], — и пыл этот тревожит наших соседей не меньше, чем восхищает наших философов. [target_character.GetHerHis|U] советники подготовили предложения, которые сметут и [ShowEstatePrivilegeName('liberum_veto')], и [ShowEstatePrivilegeName('nieszawa_privileges')], а на смену дворянскому своеволию придёт действенный законодательный порядок.\n\nОднако соседние дворы пристально следят за нами. Иностранным державам выгодно, чтобы наша держава, [ROOT.GetCountry.GetLongName], оставалась слабой, и их посланники, чья учтивость едва прикрывает угрозу, ясно дали понять, что любое усиление центральной власти будет воспринято как провокация. [ROOT.GetCountry.GetAdjective]ая корона, по их разумению, должна оставаться бессильной — и вопрос лишь в том, осмелимся ли мы на реформы под их бдительным взором."
 flavor_pol.22.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] выносит на суд собрания, что зовётся [ROOT.GetCountry.GetGovernment.GetParliament.GetName], самый смелый замысел обновления за всю историю государства [ROOT.GetCountry.GetName]: новую конституцию, которая упразднит [ShowEstatePrivilegeName('liberum_veto')], укрепит положение сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» и превратит нашу раздробленную страну в действенное современное государство.\n\nПосланники соседей уже передали свои послания. Слова их дипломатичны, смысл — нет. Если мы пойдём дальше, то рискуем навлечь иностранное вмешательство. Если же отступим, последний шанс на суверенитет, что ещё остаётся у нашей державы, [ROOT.GetCountry.GetNameWithNoTooltip], будет погребён под теми же дворянскими привилегиями, что душат нас уже больше века. Так или иначе, история запомнит этот миг."
 flavor_pol.40.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] державы [ROOT.GetCountry.GetNameWithNoTooltip]"
