l_russian:
 TLE_once_truce_ends_zayyanid_pretenders_tt: "Как только истечёт [Concept('truce', 'перемирие')|e] с [target_country.GetName], им станет доступно [Concept('decision', 'решение')|e] [ShowDecisionName('zayyanid_pretenders_decision')], позволяющее объявить особую [Concept('war', 'войну')|e] — [ShowCasusBelliName('cb_independence_war')]"
 flavor_tle.3.desc: "Город [target.GetName], сердце всей нашей возлюбленной державы — [ROOT.GetCountry.GetFlavorRank], — пал под натиском гнусных врагов из страны [from_country.GetLongName]. И словно этой трагедии было мало, во время штурма погибли многие члены нашего любимого рода [target_dynasty.GetName].\n\nЭто бедствие повергло в отчаяние всю державу [ROOT.GetCountry.GetLongName] и сделало продолжение войны почти невозможным. Одних лишь убийств недостаточно, чтобы парализовать страну, — но утраты доверия к её правителям для этого вполне хватит. Племена-союзники нас покинули, боевой дух упал как никогда низко, а организованного сопротивления нет и в помине. Для нас [target_war.GetName] подходит к концу."
 tle_rules_for_zayyanid_pretenders: "Если в течение любого из следующих #Y 20#! лет [target_country.GetName] не сумеет удержать [Concept('subject_loyalty', 'лояльность ленника')|e] [from_country.GetLongName] выше #Y 30#!, то [from_country.GetName] сможет объявить [Concept('war', 'войну')|e] — [ShowCasusBelliName('cb_independence_war')] — с помощью [Concept('decision', 'решения')|e] [ShowDecisionName('zayyanid_pretenders_decision')]"
 flavor_tle.5.desc: "[target_character.GetName], претендент на [from_country.GetAdjective]ий престол, только что [Select_CString(target_character.IsFemale, 'вступила', 'вступил')] в [ROOT.GetCountry.GetCapital.GetName] под рукоплескания сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]» и посланцев сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]». Это открытое объявление войны: [from_country.GetName] бросает вызов державе [target_country.GetLongName], слишком долго правившей городом [ROOT.GetCountry.GetCapital.GetName]. [target_character.GetShortNameWithNoTooltip] пользуется широкой поддержкой в стране [from_country.GetNameWithNoTooltip], но главное — на [Select_CString(target_character.IsFemale, 'её', 'его')] стороне [ShowModifier('tle_zayyanid_tribe_support')]: [Select_CString(target_character.IsFemale, 'её', 'его')] поддерживает крупнейшее и могущественнейшее [ShowCultureName('zenati')]ое племя во всей державе ([ROOT.GetCountry.GetFlavorRank]), родное племя рода [target_dynasty.GetName].\n\nМы покажем этим [target_country.GetAdjectiveWithNoTooltip]им мерзавцам, за кем останется победа, — [target_war.GetName] решит всё!"
 flavor_tle.6.desc: "Все наши пылкие старания — дарованные привилегии, дипломатические миссии, роскошные подарки, пожалованные должности — пошли прахом: племена [from_country.GetName] по-прежнему поддерживают тирана [target_character.GetName] из рода [target_dynasty.GetName], а не куда более милосердную [target_country.GetAdjective]ую власть.\n\nЧто ж, быть по сему! Пусть испытают на себе гнев наших армий! Мы станем карающей десницей, и [ROOT.GetCountry.GetReligion.GetGodName] свершит через нас свой суд! Победа в этой войне — [target_war.GetName] — будет за нами!"
 flavor_tle.13.a: "Превосходная мысль!"
 flavor_tle.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_tle.1.desc: "[ShowRegionName('maghreb_region')] стоит на краю пропасти: [target_siege.GetName] в самом разгаре, а на выручку вот-вот подойдут [tle_scope.GetAdjective]ие войска, так что будущее региона [ShowSubContinentName('north_africa')] может решиться за считаные дни. Выдержит ли [target_location.GetRank.GetName] натиск, который ведёт [mor_ruler.GetName] во главе [mor_ruler.GetHerHis] [mor_scope.GetAdjective]их войск, или [target_location.GetName] падёт, решив судьбу, которую разделят [tle_ruler.GetName] и [tle_ruler.GetHerHis] [tle_scope.GetFlavorRank]?"
 flavor_tle.1.a: "К оружию!"
