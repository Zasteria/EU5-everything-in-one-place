l_russian:
 flavor_tle.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_tle.1.desc: "[ShowRegionName('maghreb_region')] стоит на краю пропасти: [target_siege.GetName] в самом разгаре, а на выручку вот-вот подойдут [tle_scope.GetAdjective]ие войска, так что будущее региона [ShowSubContinentName('north_africa')] может решиться за считаные дни. Выдержит ли [target_location.GetRank.GetName] натиск, который ведёт [mor_ruler.GetName] во главе [mor_ruler.GetHerHis] [mor_scope.GetAdjective]их войск, или [target_location.GetName] падёт, решив судьбу, которую разделят [tle_ruler.GetName] и [tle_ruler.GetHerHis] [tle_scope.GetFlavorRank]?"
 flavor_tle.1.a: "К оружию!"
 flavor_tle.2.desc: "[target.GetName], жемчужина области [target.GetArea.GetName], наконец сдаётся нашей могучей армии после долгой осады. [target.GetRank.GetName] открывает ворота, и наши войска устремляются к главной цитадели в надежде на добычу и пленников. [target_country.GetGovernment.GetAdjective]ая семья укрывалась именно там, и наши солдаты быстро схватили многих её членов. [from_country.GetAdjective]ие военачальники уже ждут пленников. Неужели [target_war.GetName] близится к концу?"
 TLE_as_per_the_warning: "Мы не прислушались к предостережениям и позволили врагу занять наш любимый [target.GetName]. Семья [target_dynasty.GetName] перебита, а мы теперь — подданные страны [from_country.GetName] на правах «[ShowSubjectTypeName('fiefdom')]»."
