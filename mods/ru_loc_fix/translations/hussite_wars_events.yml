 hussite_wars_bohemia_reconverted: "[GetCountry('BOH').GetNameWithNoTooltip] и [GetCountry('PAP').GetNameWithNoTooltip] вновь едины"
 hussite_wars_bohemia_reconverted_desc: "Держава [GetCountry('BOH').GetName] силой возвращена в лоно католической церкви: её [Concept('stability', 'стабильность')|e] и [Concept('government_power', 'власть правительства')|e] жестоко пострадают, а правителя и его семью заставят сменить веру."
 hussite_wars_emperor_converted: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle] принимает гуситство"
 hussite_wars_emperor_converted_desc: "Раз на сторону гуситов перешёл сам император, гуситские земли надолго получают прибавку к [Concept('stability', 'стабильности')|e], [Concept('government_power', 'власти правительства')|e] и [Concept('religious_influence', 'религиозному влиянию')|e]."
 hussite_wars_hussite_bohemia_endures: "[GetCountry('BOH').GetNameWithNoTooltip] хранит гуситскую веру"
 hussite_wars_hussite_bohemia_endures_desc: "[GetCountry('BOH').GetName] выдерживает испытание верой: эта держава и её единоверцы-гуситы надолго получают прибавку к [Concept('stability', 'стабильности')|e], [Concept('government_power', 'власти правительства')|e] и [Concept('religious_influence', 'религиозному влиянию')|e]."
