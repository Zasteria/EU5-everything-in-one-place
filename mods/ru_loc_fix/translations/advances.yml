 direct_domestic_migration_middle_kingdom_advance: "Имперское переселение"
 direct_domestic_migration_middle_kingdom_advance_desc: "Сын Неба в ответе за благополучие всех, кто живёт под небом. Там, где старые коренные земли перенаселены, а окраины пустуют, долг императорского двора — переселять семьи из одних в другие, чтобы каждое поле было возделано и ни один край не кормил больше ртов, чем способен."
