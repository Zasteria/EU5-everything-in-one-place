l_russian:
 flavor_iberian_union.1.desc: "Брак, соединивший короны двух держав — [iu_member_a.GetName] и [iu_member_b.GetName], — даёт нам возможность выковать прочную связь между нашими королевствами. Пусть этот союз родился из политической нужды, [ROOT.GetCountry.GetGovernment.GetAdjective]ая чета, похоже, вполне счастлива в браке: супруги вместе трудятся над укреплением унии, возводя прочное политическое здание, которое сможет стать одной из ведущих сил на континенте [ShowContinentName('europe')]."
 flavor_iberian_union.1.historical_info: "Самая знаменитая из иберийских династических уний возникла в 1469 году благодаря браку Изабеллы I Кастильской и Фердинанда II Арагонского — Католических королей. Их союз объединил две величайшие короны полуострова, сохранив при этом собственные институты каждой из них, а их внук Карл унаследовал обе короны как единое государство. Столетие спустя, в 1580 году, Филипп II Испанский заявил права на опустевший португальский престол и объединил Кастилию, Арагон и Португалию под властью испанских Габсбургов — вплоть до Португальской реставрации 1640 года."
 flavor_iberian_union.2.desc: "Короны региона [ShowRegionName('iberia_region')] перешли к одному государю. То, что начиналось как брак двух домов, стало личной унией: престолы наших держав ныне венчают одно чело. Каждое королевство хранит свои законы, свои суды и свою гордость, но в вопросах легитимности и династии они говорят единым голосом. Рождается Иберийская уния, а с ней — надежда на державу, способную соперничать с любой другой во всём христианском мире."
 flavor_iberian_union.2.historical_info: "Когда наследник двух корон получал обе, возникало не единое королевство, а составная монархия — отдельные государства под властью общего государя. Именно так была устроена Испанская монархия: Кастилия, Арагон, а позднее и Португалия сохраняли собственные #italic кортесы#!, законы и управление под властью общего короля. Такие унии существовали лишь до тех пор, пока жила общая династия, и отсутствие наследника могло разъединить то, что соединил брак."
 flavor_iberian_union.2.a: "Пусть наши королевства процветают как одно целое."
 flavor_iberian_union.3.desc: "Пока [initiator_candidate.GetName] [Select_CString(initiator_candidate.IsFemale, 'не замужем', 'не женат')], вопрос престолонаследия тяжким грузом нависает над страной [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] настаивает, чтобы сословие «[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]» подыскало подходящий брак и тем обеспечило преемственность власти. Прозвучало и предложение связать нашу судьбу с одной из других [ShowReligionGroupAdjective('christian')]их корон региона [ShowRegionName('iberia_region')]. Без сильного наследника нашей державе ([ROOT.GetCountry.GetFlavorRank]) могут грозить смуты, соперничество претендентов и даже иноземное вмешательство."
 flavor_iberian_union.3.historical_info: "Событие под названием «Иберийская свадьба» отражает борьбу за наследство Энрике IV Кастильского. После его смерти престол оспаривали две претендентки: Изабелла Кастильская, которую поддерживал её муж Фердинанд Арагонский, и её племянница Хуана, за которой стояла Португалия. Война завершилась победой Изабеллы и Фердинанда: власть Изабеллы утвердилась, и началось знаменитое правление Католических королей. Позднее этот союз Кастилии и Арагона привёл к созданию единой Испании."
 flavor_iberian_union.3.a: "Отправим брачное предложение стране [iu_partner_a.GetNameWithNoTooltip]."
 flavor_iberian_union.3.b: "Лучше обратимся к стране [iu_partner_b.GetNameWithNoTooltip]."
 flavor_iberian_union.4.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] принимает посланника из страны [iu_initiator.GetName]. Нам предлагают династический брак между [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] из нашего собственного дома, чтобы соединить наши королевства. Это предложение сулит взаимное процветание и стабильность, однако некоторые наши советники относятся к нему с недоверием. Такой союз мог бы обеспечить нам поддержку против общих врагов и даже привести к объединению корон, но иные предостерегают, что со временем он может угрожать нашей независимости."
 flavor_iberian_union.5.desc: "Колокола звонят по всей нашей державе ([ROOT.GetCountry.GetFlavorRank]) и по всей стране [iu_chosen.GetName]: [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] вступают в брак, соединяясь в единый [ROOT.GetCountry.GetGovernment.GetAdjective]ий дом. Люди заполняют улицы, а оба двора поднимают кубки за союз, который так долго и упорно устраивали послы и епископы. То, что прежде было делом холодного расчёта, ныне скреплено клятвами и празднеством.\n\nЭтот брак дарует нам куда больше, чем один сезон торжеств. Наши династии соединены, наши дома связаны кровью, и если этот союз будет благословлён ребёнком, который унаследует обе короны, однажды наши королевства смогут стать единым целым. А пока наше престолонаследие стало прочнее, и великолепие торжества возвышает нас среди дворов всего христианского мира."
 flavor_iberian_union.6.desc: "Страна [iu_chosen.GetName] отвергла наше брачное предложение. Это решение, несомненно, ещё долгие годы будет омрачать наши отношения, но главное — вопрос о нашем престолонаследии так и остаётся нерешённым."
 flavor_iberian_union.7.title: "Нами пренебрегли"
 flavor_iberian_union.7.desc: "Правители страны [iu_initiator.GetName] предпочли связать свой дом с правящим домом страны [iu_chosen.GetName], а не с нами, хотя мы были ничуть не худшей партией. Обида жжёт, но она открывает и возможности: подобное оскорбление — достаточный повод силой взять то, что должно было достаться нам через брак."
 flavor_iberian_union.7.a: "Это оскорбление не останется без ответа."
 iu_marriage_may_form_union_tt: "Это может привести к образованию [Concept('union', 'унии')|e]"
 iu_spurned_will_be_displeased_tt: "[iu_spurned.GetName] может не простить пренебрежения, проявленного при выборе этой партии"
