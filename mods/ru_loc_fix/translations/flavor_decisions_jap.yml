l_russian:
 jap_adopt_japan_identity_decision.title: "Принять имя $JAP$"
 jap_adopt_japan_identity_decision.desc: "Кланы истощили друг друга в бесконечной борьбе, и один дом возвысился над остальными. Однако мир по-прежнему знает нас по имени этого дома, а не по земле, которой мы теперь правим.\n\nПримем же имя $JAP$, чтобы каждый двор и каждая провинция знали: держава едина, и она принадлежит нам."
 jap_adopt_japan_identity_decision.a: "Отныне мы — $JAP$."
 jap_adopt_japan_identity_decision.color_tt: "Мы выбираем цветом нашей державы #Y красный#!"
 jap_adopt_japan_identity_decision.historical_info: "К 1603 году Токугава Иэясу положил конец более чем вековой гражданской войне и принял титул сёгуна, правя объединённой Японией из Эдо. До него Ода Нобунага и Тоётоми Хидэёси сломили могущество враждующих военачальников. Европейские торговцы и посланники того времени, как правило, считали сёгуна правителем всей Японии."
