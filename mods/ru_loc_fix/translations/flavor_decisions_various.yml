l_russian:
 ara_sindicat_remenca_decision.desc: "Дворянство державы [ROOT.GetCountry.GetLongName] начало неукоснительно следить за соблюдением правил, привязывающих крестьян к земле, а вкупе с ужесточением сеньориальных прав в целом это вызвало среди крестьян волнения. Беднейшие из них горячо ратуют за открытый мятеж, тогда как более зажиточные предпочитают просить нас о реформах и об отмене сеньориальных злоупотреблений.\n\nЭто прекрасная возможность заручиться поддержкой крестьян, ведь мы ведём непрестанную борьбу за власть с дворянством. Звучат предложения позволить крестьянам основать [ShowEstatePrivilegeName('ara_sindicat_remenca')] — крестьянскую гильдию, своего рода первый трудовой союз, — что даст им больше свободы."
 nov_tysiatskii_influential_decision.b.entry: "Ослабить влияние сословия $nobles_estate$ на эту должность."
 mch_mandarin_language_reforms_decision.b.entry: "Оказать благоволение сословию $tribes_estate$."
