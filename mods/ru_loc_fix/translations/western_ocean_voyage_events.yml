 western_ocean_voyage_events.morale_crash_20_tt: "Дух экипажей рушится, они на грани бунта (#R -20#! к боевому духу экипажа)"
 western_ocean_voyage_events.ship_gained_tt: "Флот получает ещё один корабль (#G +1#! корабль)"
 western_ocean_voyage_events.ship_lost_tt: "Флот теряет судно (#R -1#! корабль)"
 western_ocean_voyage_events.charted_kept_tt: "Нанесённые флотом на карту воды остаются на наших картах"
 western_ocean_voyage_events.1.b: "Плывём дальше, что бы ни таил океан. Мы найдём это первыми."
 western_ocean_voyage_events.1.c: "Пусть ветра будут нашей картой."
 western_ocean_voyage_events.2.c: "Отправить шлюпки на берег за водой и козами."
 western_ocean_voyage_events.2.c.calm_tt: "Высадившийся отряд возвращается без происшествий"
 western_ocean_voyage_events.2.c.clash_tt: "Высадившийся отряд сталкивается с островитянами"
 western_ocean_voyage_events.2.d: "Купить каравеллу у местных корабелов."
 western_ocean_voyage_events.2.e: "Набрать воды и плыть дальше с тем, что есть."
 western_ocean_voyage_events.2.f: "Люди не готовы. Поворачиваем назад."
 western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] успокаивает команду подложным судовым журналом, и боевой дух экипажа не падает"
 western_ocean_voyage_events.8.title: "Бунт в открытом море"
 western_ocean_voyage_events.8.a: "Пусть бунтовщики забирают свой корабль и плывут домой."
 western_ocean_voyage_events.8.b: "На абордаж. Корабль в море — не совет."
 western_ocean_voyage_events.8.fight_win_tt: "Офицеры берут верх и восстанавливают порядок"
 western_ocean_voyage_events.8.fight_lose_tt: "Схватка кровавая, и флот дорого за неё платит"
 western_ocean_voyage_events.8.c: "Рассказать им об Индиях и о золоте, что их там ждёт."
 western_ocean_voyage_events.8.rouse_tt: "Слова, которые произносит [target_leader.GetNameWithNoTooltip], возвращают команде решимость"
 western_ocean_voyage_events.9.title: "Лихорадка под палубой"
 western_ocean_voyage_events.9.desc: "Вода в бочках позеленела, в солонине завелись черви. Сначала лихорадка валит в гамаки нескольких человек, затем дюжину, а потом стольких, что офицерам едва хватает людей на вахты. Лекарь пускал больным кровь, давал слабительное — и больше ничего сделать не может.\n\nЗдоровые смотрят на больных, потом на пустой горизонт и не говорят вслух того, о чём думает каждый."
 western_ocean_voyage_events.9.a: "Убавить паруса и выхаживать больных, пока лихорадка не отступит."
 western_ocean_voyage_events.9.b: "Мы не можем терять дни. Похоронить мёртвых и плыть дальше."
 western_ocean_voyage_events.9.historical_info: "Долгие океанские переходы XV века ограничивала не столько навигация, сколько то, что корабль мог взять на борт. Вода в деревянных бочках портилась за несколько недель, солёные припасы гнили в жару, а экипажи, набитые в маленькие корпуса, передавали друг другу лихорадку и дизентерию. Капитаны, шедшие в открытую Атлантику, пополняли запасы в последнем возможном порту — часто на Канарах или островах Зелёного Мыса, — потому что дальше пополнить их было негде."
 western_ocean_voyage_events.10.title: "Домой, не дойдя до края"
 western_ocean_voyage_events.10.desc: "Флот возвращается в гавань гораздо раньше, чем кто-либо ждал: трюмы наполовину полны, экипажи целы. Земли они не нашли — только открытую воду и ветер, не дававший забыть, как далеко они от дома.\n\nПри дворе о плавании говорят вполголоса, если говорят вообще. И всё же лоцманы вели журналы, и наши карты западных вод теперь простираются чуть дальше, чем прежде."
 western_ocean_voyage_events.10.a: "Океан никуда не денется до следующего раза."
 western_ocean_voyage_events.11.title: "Пропали без вести"
 western_ocean_voyage_events.11.desc: "Проходят месяцы, а от флота, ушедшего на запад, нет вестей. Потом проходит год. Купцы, вложившиеся в плавание, списывают свои доли, а семьи моряков перестают ждать у стены гавани.\n\nЗатонули ли корабли в шторм, кончилась ли у них вода посреди океана или они просто плыли, пока не осталось ничего, — никто никогда не узнает. У нас осталось лишь последнее донесение, которое флот прислал домой, прежде чем уйти за пределы известного мира."
 western_ocean_voyage_events.11.a: "Море забрало их. Помолимся за их души."
 western_ocean_voyage_events.11.historical_info: "Плавания в неизвестную Атлантику нередко заканчивались бесследно. Генуэзские братья Уголино и Вадино Вивальди в 1291 году вышли на запад через Гибралтарский пролив в поисках морского пути в Индию, и больше о них никто не слышал. Два столетия спустя португальские братья Гашпар и Мигел Корте-Реал пропали в отдельных плаваниях к северо-западной Атлантике в 1501 и 1502 годах."
 western_ocean_voyage_events.13.title: "Море водорослей"
 western_ocean_voyage_events.13.desc: "Уже несколько дней корабли идут сквозь плавучие луга жёлто-зелёных водорослей, местами таких густых, что они будто держат корпуса. Бывалые моряки клянутся, что впереди мели и флот сядет на какой-нибудь подводный берег прежде, чем кто-то его увидит.\n\n[target_leader.GetName] приказывает приготовить лот. Люди смотрят на воду и ждут, что она им скажет."
 western_ocean_voyage_events.13.a: "Лечь в дрейф и промерить глубину."
 western_ocean_voyage_events.13.b: "Водоросли — не риф. Держать курс и идти насквозь."
 western_ocean_voyage_events.13.c: "Наш лоцман видит в водорослях течение, а не мель."
 western_ocean_voyage_events.13.historical_info: "Саргассово море — область Северной Атлантики, покрытая плавучими скоплениями водорослей саргассума, — лежит на пути от Канар к Карибам. Флот Колумба вошёл в него в сентябре 1492 года. Его команды боялись, что водоросли скрывают мели или задержат корабли, но промеры дна не достали, и флот прошёл без потерь."
 western_ocean_voyage_events.14.title: "Признаки земли"
 western_ocean_voyage_events.14.desc: "Впередсмотрящий замечает резную палку, проплывающую мимо носа, а затем зелёную ветку, на которой ещё листья и ягоды. В сумерках над головой проходят стаи птиц, и все летят в одну сторону — на юго-запад.\n\nВслух этого слова ещё никто не произносит. Но те, кто несколько дней назад грозил повернуть назад, теперь толпятся у борта при каждой смене вахты и вглядываются в горизонт."
 western_ocean_voyage_events.14.a: "Следовать за птицами. Земля уже близко."
 western_ocean_voyage_events.14.b: "Записать в журнал и держать курс."
 western_ocean_voyage_events.14.historical_info: "В дни перед высадкой в октябре 1492 года журнал Колумба отмечает резную палку, ветку с ягодами, тростник и огромные стаи птиц, летящих на юго-запад. 7 октября он изменил курс вслед за птицами, и через пять дней флот вышел к Багамам."
 western_ocean_voyage_events.15.c: "Наш лоцман знает эти небеса. Править к тихой стороне."
 western_ocean_voyage_events.16.c: "Наш лоцман знает, где вернётся ветер. Идём искать его."
 western_ocean_voyage_events.7.desc.later: "Корабли наконец заходят в гавань, покрытые солью и потрёпанные, и уже через несколько дней мы зачитываем вслух отчёт, который составил [target_leader.GetName]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] слушает, но без прежнего изумления: моряки другой короны добрались до этих островов раньше наших, и их донесения давно обошли все дворы.\n\nИ всё же наш флот пересёк тот же океан и вернулся домой, а это немало. Наши лоцманы теперь сами знают западные ветра, и никакая чужая карта этому не научит."
 western_ocean_voyage_events.8.desc: "Всё начинается с ропота при смене вахты и заканчивается обнажёнными ножами на главной палубе. Команда одного из наших кораблей заперла офицеров в трюме и передаёт через воду: на рассвете они повернут домой и возьмут на абордаж любой корабль, который попробует им помешать.\n\n[target_leader.GetName] стоит у борта и прикидывает расстояние между двумя корпусами. За [target_leader.GetHerHim] спиной верные экипажи ждут, что [target_leader.GetSheHe] предпримет."
