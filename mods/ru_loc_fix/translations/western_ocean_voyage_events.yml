l_russian:
 western_ocean_voyage_events.1.columbus: "[target_leader.GetNameWithNoTooltip] уверяет: по точным расчётам — три тысячи миль, не больше."
 western_ocean_voyage_events.1.a: "Вперёд, что бы ни таил океан. Мы найдём это первыми."
 western_ocean_voyage_events.4.columbus: "Водрузить знамя. [target_leader.GetShortNameWithNoTooltip] не сомневается: это Индии."
 western_ocean_voyage_events.4.a: "Водрузить флаг. Что бы это ни была за земля, она принадлежит нам."
 western_ocean_voyage_events.4.b: "Это не похоже ни на одно описание Индий. Пока ни на что не притязать."
 western_ocean_voyage_events.4.title: "Земля!"
 western_ocean_voyage_events.5.title: "Остров Семи Городов"
 western_ocean_voyage_events.5.a: "Проложить курс с оглядкой на него — вдруг старые карты не лгут."
 western_ocean_voyage_events.5.b: "На картах мореходов полно островов, которых никогда не было."
 western_ocean_voyage_events.5.historical_info: "Антилия, Остров Семи Городов, появлялась на португальских и генуэзских картах уже в 1424 году: так обозначали большой остров к западу от Азорских островов. Согласно стоявшей за ним легенде, в 714 году, во время завоевания Иберии Омейядами, семь вестготских епископов бежали оттуда и основали семь городов на острове в западном океане. Легенда пережила эпоху великих открытий, которая будто бы её опровергла: когда десятилетия спустя Франсиско Васкес де Коронадо отправился искать семь золотых городов на юго-западе Северной Америки, он назвал свою цель в честь этого более древнего, чисто европейского предания."
 western_ocean_voyage_events.6.title: "Откуда берётся золото"
 western_ocean_voyage_events.6.a: "Записать всё как есть, вместе с противоречиями."
 western_ocean_voyage_events.6.b: "Оставить лишь то, в чём сходятся все: вглубь земли — и золото."
 western_ocean_voyage_events.6.historical_info: "Ранние свидетельства о первых контактах в Карибском море описывают таино, носивших небольшие золотые украшения — искусно обработанные, но, насколько могли судить пришельцы, не добытые на месте в сколько-нибудь заметном количестве. Когда островитян жестами спрашивали, откуда золото, они раз за разом указывали вглубь суши, а по некоторым рассказам — на земли дальше к югу и западу. Именно эти указания, переданные из вторых рук и неверно истолкованные, а вовсе не подтверждённые находки, определили, где следующие поколения исследователей искали золото в Америке."
 western_ocean_voyage_events.7.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] читает доклады"
 western_ocean_voyage_events.7.a: "Пусть отчёт останется таким, как написан."
 western_ocean_voyage_events.7.historical_info: "Письменные и устные доклады вернувшихся экспедиций зачитывались при королевских дворах по всей Западной Европе уже через несколько месяцев после каждой высадки, а их переводы затем расходились повсюду. Эти рассказы, искажённые переводом и честолюбием рассказчиков, описывали богатства глубинных земель, которых ни один европеец ещё не видел своими глазами. Именно эти свидетельства из вторых рук, а не подтверждённые открытия, гнали следующие поколения исследователей всё дальше вглубь материка и всё дальше на юг на поиски того, что первые прибывшие видели лишь мельком."
 western_ocean_voyage_mythical_cities_tt: "Нанесение побережий Америки на карту откроет доступ к [Concept('expeditions', 'экспедициям')|e] на поиски её легендарных затерянных городов"
