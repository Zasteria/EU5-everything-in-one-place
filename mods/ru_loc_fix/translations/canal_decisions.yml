l_russian:
 close_suez_canal_to_enemies.title: "Закрыть Суэцкий канал для несоюзников"
 close_suez_canal_to_enemies.desc: "Разрешить проход через Суэцкий канал на время войны только нашим союзникам и ленникам. Врагам путь закрыт автоматически; это решение закрывает его также для нейтральных держав и соперников."
 close_suez_canal_to_enemies.a: "Закрыть проход для всех, кроме союзников."
 close_suez_canal_to_enemies.b: "Не сейчас."
 open_suez_canal_to_all.title: "Открыть Суэцкий канал для всех"
 open_suez_canal_to_all.desc: "Снять ограничения на проход через Суэцкий канал и вновь открыть его для всех держав, с которыми мы не воюем."
 open_suez_canal_to_all.a: "Снять ограничения."
 open_suez_canal_to_all.b: "Не сейчас."
 close_panama_canal_to_enemies.title: "Закрыть Панамский канал для несоюзников"
 close_panama_canal_to_enemies.desc: "Разрешить проход через Панамский канал на время войны только нашим союзникам и ленникам. Врагам путь закрыт автоматически; это решение закрывает его также для нейтральных держав и соперников."
 close_panama_canal_to_enemies.a: "Закрыть проход для всех, кроме союзников."
 close_panama_canal_to_enemies.b: "Не сейчас."
 open_panama_canal_to_all.title: "Открыть Панамский канал для всех"
 open_panama_canal_to_all.desc: "Снять ограничения на проход через Панамский канал и вновь открыть его для всех держав, с которыми мы не воюем."
 open_panama_canal_to_all.a: "Снять ограничения."
 open_panama_canal_to_all.b: "Не сейчас."
