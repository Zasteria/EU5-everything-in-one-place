l_russian:
 religious_orders.1.title: "Благочестивое завещание"
 religious_orders.202.title: "Плацдарм в землях неверных"
 religious_orders.202.desc: "Наши воины вырвали из рук неверных район [ro_conquest_location.GetName], и [ro_conquest_order.GetName] уже видит в нём своё предназначение. Там, где вера ещё не пустила корней, братья хотели бы основать командорство — дом молитвы и меча на новом рубеже — и просят нашего дозволения его воздвигнуть."
 religious_orders.202.a: "Пусть возводят своё командорство."
 religious_orders.202.b: "На рубеже им пока не место."
