 ACHIEVEMENT_reformatio_imperii: "Имперская реформа"
 ACHIEVEMENT_crossing_the_pillars: "За Геркулесовы столпы"
 ACHIEVEMENT_DESC_crossing_the_pillars: "Начав игру за Кастилию, Марокко или Гранаду, одержите победу в ситуациях «Битва за пролив» и «Золотой век»."
 ACHIEVEMENT_getting_things_strait: "Пролив под контролем"
 ACHIEVEMENT_DESC_getting_things_strait: "Начав игру за Кастилию, завладейте на каждом берегу Гибралтарского пролива национальным городом с береговой крепостью."
 ACHIEVEMENT_re_re_reconquista: "Ре-ре-реконкиста"
 ACHIEVEMENT_DESC_re_re_reconquista: "Начав игру за Гранаду, создайте Аль-Андалус и добейтесь того, чтобы вам или вашим ленникам принадлежали все бывшие земли Кордовского халифата Омейядов."
 ACHIEVEMENT_the_road_to_el_dorado: "Дорога в Эльдорадо"
 ACHIEVEMENT_DESC_the_road_to_el_dorado: "Откройте легендарный город Эльдорадо с помощью экспедиции."
 ACHIEVEMENT_there_and_back_again: "Туда и обратно"
 ACHIEVEMENT_DESC_there_and_back_again: "Первыми среди держав завершите экспедицию «Кругосветное плавание»."
 ACHIEVEMENT_the_last_crusade: "Последний крестовый поход"
 ACHIEVEMENT_DESC_the_last_crusade: "Играя за католическую державу, возглавьте победоносный крестовый поход в Северной Африке или на Ближнем Востоке."
 ACHIEVEMENT_DESC_tinto_monta: "Начав игру за Кастилию или Арагон, станьте старшим партнёром Иберийской унии."
 ACHIEVEMENT_live_forever: "Жить вечно"
 ACHIEVEMENT_DESC_live_forever: "Примите решение «Повелители Сахары»."
 ACHIEVEMENT_the_catalan_atlas: "Каталанский атлас"
 ACHIEVEMENT_DESC_the_catalan_atlas: "Играя за Арагон, Мальорку или Сицилию, воссоедините все земли «Арагонских титульных владений» — напрямую, через ленников или через младших партнёров личных уний."
 ACHIEVEMENT_family_matters: "Семейное дело"
 ACHIEVEMENT_DESC_family_matters: "Начав игру за Тунис, отмените реформу «Губернатор из династии Хафсидов» и избавьтесь от всех ленников типа «Родственный губернатор»."
 ACHIEVEMENT_endured_atlas: "Несокрушимый Атлас"
 ACHIEVEMENT_DESC_endured_atlas: "Начав игру за Марокко, обеспечьте безопасность родных земель и либо централизуйте правление, либо сохраните прочную поддержку соплеменников."
 ACHIEVEMENT_divide_the_land: "Разделите землю!"
 ACHIEVEMENT_DESC_divide_the_land: "Постройте канал."
