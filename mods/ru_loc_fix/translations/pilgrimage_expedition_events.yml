l_russian:
 pilgrimage_expedition_events.1.title: "[current_location.GetNameWithNoTooltip], Святой город"
 pilgrimage_expedition_events.1.desc: "После долгих месяцев изнурительного пути [target_ruler.GetName] наконец стоит у стен города [current_location.GetName] — города Распятия, города Воскресения, самой святой земли во всём христианском мире. В воздухе висит пыль, поднятая тысячей паломников, и мешается с ладаном, что струится из сотни часовен.\n\nВ самом сердце всего этого высится Храм Гроба Господня, воздвигнутый над самой скалой Голгофы. [target_ruler.GetSheHe|U] [Select_CString(target_ruler.IsFemale, 'проделала', 'проделал')] долгий путь ради этого мгновения. Бесконечная дорога, стёртые в кровь ноги, бессонные ночи — всё это отступает, когда распахиваются огромные двери и запах святого елея и древнего камня волной окутывает [target_ruler.GetHimHer]."
 pilgrimage_expedition_events.2.title: "Вечный город"
 pilgrimage_expedition_events.2.desc: "[current_location.GetName] медленно встаёт над равниной; купола и башни ловят послеполуденный свет, пока [target_ruler.GetName] со свитой пересекает последний мост через Тибр. [current_location.GetRank.GetName] огромен и древен, его улицы полны паломников со всех концов христианского мира, и всех их влечёт одно и то же незримое течение.\n\nНа вершине Ватиканского холма в небо устремляется собор Святого Петра. Здесь престол Наместника Христова, живая власть Церкви на земле. [ShowReligionAdjective('catholic')]ий мир бьётся здесь своим сердцем, и [target_ruler.GetNameWithNoTooltip] не может сдержать благоговейного трепета, оказавшись в самом его средоточии."
 pilgrimage_expedition_events.3.desc: "Последние мили #italic Камино-де-Сантьяго#! — самые многолюдные. По всем дорогам, из всех долин к великому собору города [current_location.GetName] стекаются потоки паломников: посохи их отполированы ладонями до гладкости, плащи покрыты пылью пятисот лиг. Кто-то плачет. Кто-то прошёл босиком сотню миль.\n\n[target_ruler.GetName] едет впереди — [target_ruler.GetHerHis] свита тянется следом, — но спешивается, едва вдали показываются башни собора. Последний отрезок пути подобает пройти пешком. Ветер доносит могучий гул паломнического гимна — #italic Ultreia! Ultreia!#! — и кажется, что камни дороги звенят ему в ответ."
 pilgrimage_expedition_events.3.b: "Объявить это знаком Божьей благосклонности к нашему правлению."
 pilgrimage_expedition_events.3.historical_info: "Культ святого апостола Иакова в Сантьяго-де-Компостеле зародился в IX веке, когда в Галисии были обретены мощи, признанные мощами Иакова, и король Астурии Альфонсо II поместил их в святилище. Возникший паломнический путь, #italic Камино-де-Сантьяго#!, стал одним из трёх великих паломничеств средневекового христианского мира — наряду с Римом и Иерусалимом. К XII веку вдоль дороги выросли странноприимные дома, монастыри и церкви, и шли по ней паломники из всех европейских стран. Достигший Сантьяго паломник получал свидетельство — «компостелу» — и полное отпущение грехов."
 pilgrimage_expedition_events.4.desc: "[current_location.GetRank.GetName] [current_location.GetName] — это сплошь подъёмные краны и строительные леса. Великий собор строится уже почти два столетия, и его недостроенные башни с каждым годом поднимаются всё выше — к завершению, которого не застанут ещё многие поколения. Но даже незавершённое здание огромно сверх всякой меры: говорят, это величайший храм на свете.\n\nВ южном трансепте, за алтарём, сияющим сусальным золотом и пламенем свечей, стоит Рака Трёх Королей — золотой реликварий с мощами волхвов, что шли за звездой в Вифлеем. [target_ruler.GetName] знает о ней с самого детства. И всё же ничто не могло подготовить [target_ruler.GetHimHer] к этому зрелищу."
 pilgrimage_expedition_events.5.title: "Нотр-Дам-де-[current_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.5.desc: "О витражах, которыми славится [current_location.GetName], говорят, что их невозможно описать — только увидеть. [target_ruler.GetName] стоит в нефе и понимает почему. Собор залит синим светом — светом, прошедшим сквозь тысячу цветных стёкол и обратившимся во что-то уже не вполне земное. Он ложится зыбкими пятнами на каменный пол, на лица коленопреклонённых паломников, на древнюю реликвию в золотом ковчеге за главным алтарём.\n\n#italic Sancta Camisa#! — покров Девы Марии, бывший на ней, по преданию, в час Благовещения, — притягивает сюда верующих со времён Карла Великого. [target_ruler.GetNameWithNoTooltip] замирает в неподвижности и неожиданно для себя чувствует глубокое волнение."
 pilgrimage_expedition_events.5.c: "Прекрасный собор. Но наш народ ждёт нас дома."
 pilgrimage_expedition_events.6.desc: "[ShowCultureName('english')]ие зелёные поля окружают неглубокую долину, где лежит [current_location.GetName], и башни здешнего собора видны путнику за много миль. [current_location.GetRank.GetName] полон паломников: постоялые дворы переполнены, люди ночуют в сараях и во дворах, а дороги запружены странниками, говорящими на дюжине языков, — и все они идут к одной цели.\n\nРака святого Томаса Бекета находится в капелле Святой Троицы за главным алтарём. Некогда то была самая богато украшенная святыня, какую только знала [ShowScriptedGeographyName('england_geography')]: драгоценные камни, золото, всевозможные дары по обету. [target_ruler.GetName] останавливается перед ней. Здесь был сражён человек, посмевший перечить королю. Здесь это неповиновение обернулось святостью. Так или иначе, в этом кроется некий урок."
 pilgrimage_expedition_events.7.desc: "[current_location.GetName] стоит на невысоком холме на севере региона [ShowRegionName('ireland_region')], и два здешних собора видны с окрестных полей. Это не великий город — не [ShowLocationName('rome')] и не [ShowLocationName('jerusalem')], — но свою древность он несёт с тихим достоинством. [ShowReligionGroupAdjective('christian')]ая община здесь старейшая во всём регионе [ShowRegionNameWithNoTooltip('ireland_region')]: эту кафедру основал сам святой Патрик, придя обращать остров в веру.\n\n[target_ruler.GetName] прибывает ранним утром, когда туман ещё стелется по холмам. У ворот [target_ruler.GetHimHer] встречает каноник собора и ведёт [target_ruler.GetHimHer] к месту, где, по преданию, молился Патрик. Смирение этого места неожиданно — и почему-то как нельзя более уместно."
 pilgrimage_expedition_events.8.title: "Святыня на пути"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] достигает места, что зовётся [current_location.GetName], — ещё одной остановки на долгом пути благочестия. Какая бы реликвия или память о святости ни привлекла сюда первых паломников, она влечёт их и поныне, поколение за поколением, хотя большинство идущих этой дорогой давно забыли подробности.\n\n[target_ruler.GetSheHe|U] ненадолго задерживается среди других странников, таких же усталых и запылённых, как и [target_ruler.GetHerHis] собственная свита, и благодарит Бога за то, что до сих пор путь был благополучен."
 pilgrimage_expedition_events.8.a: "Возблагодарить за благополучный путь."
 pilgrimage_expedition_events.8.b: "Оставить подношение для паломников, что придут следом."
 pilgrimage_expedition_events.8.c: "Эта святыня осталась позади. Пора поворачивать домой."
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] поднимается по последнему склону к городу [current_location.GetName], и [target_ruler.GetHimHer] взору открывается великая базилика: два яруса светлого камня, встроенные прямо в склон холма и возведённые с поразительной быстротой после смерти того, в чью честь она воздвигнута, — нищего, у которого не было ничего и которому ныне принадлежит одна из великолепнейших церквей Италии.\n\nВ нижней церкви, в крипте, высеченной в живой скале, покоится сам Франциск Ассизский. [target_ruler.GetSheHe|U] преклоняет колени перед гробницей человека, сменившего шелка и золото на верёвочный пояс и босые ноги, — человека, который, как говорят, проповедовал птицам и укротил волка. И [target_ruler.GetHimHer] не может не поразить противоречие между бедностью святого и великолепием, воздвигнутым в его память."
 pilgrimage_expedition_events.11.desc: "[current_location.GetName] пахнет морем задолго до того, как [target_ruler.GetName] достигает городских стен. [current_location.GetRank.GetName] этот — портовый, и вырос он вокруг одного великого сокровища. Под романскими сводами базилики покоится гробница Николая Мирликийского, перевезённого сюда местными моряками больше века назад из ветшающих церквей христианского Востока, который уже не в силах был их защитить.\n\nРаз в год гробницу открывают и собирают вокруг мощей святого прозрачную жидкость — #italic миро#!, которое верующие, как [ShowReligionAdjective('catholic')]ие, так и [ShowReligionAdjective('orthodox')]ие, почитают целебным. [target_ruler.GetName] видит сосуд с ним и поражается мысли, что ни одну другую святыню на этом пути не чтут так безраздельно обе ветви христианства разом."
 pilgrimage_expedition_events.12.desc: "[ShowCultureGroupName('swiss_group')]ие высокогорья, опушка тёмного леса — здесь стоит бенедиктинское аббатство [current_location.GetName], чьи монахи в чёрных рясах ведут свою преемственность от одного-единственного отшельника, много поколений назад убитого на этом месте разбойниками. [target_ruler.GetName] знает эту историю с детства: здешнюю часовню освятил не епископ, а сам Христос, сошедший с хором ангелов и святых накануне её освящения.\n\nВ часовне Богоматери стоит то, ради чего и свершилось это первое, спорное освящение: небольшая статуя Девы, за столетия потемневшая от свечной копоти до глубокой черноты. Паломники со всех немецкоязычных земель преклоняют перед ней колени, и вереница их тянется в такое далёкое прошлое, какое [target_ruler.GetNameWithNoTooltip] с трудом может себе вообразить."
 pilgrimage_expedition_events.13.desc: "#italic Ясна-Гура#!, Светлая гора, встаёт над равниной задолго до того, как [target_ruler.GetName] достигает монастырских ворот; её белые стены ловят свет — так, как, несомненно, и задумывали строившие обитель монахи-паулины. Внутри, за стеной из серебряных обетных даров и горящих свечей, висит темноликая икона Богородицы. [ShowCultureGroupName('polish_group')]ий [current_location.GetRank.GetName] невелик и скромен, но именно она сделала его целью паломников со всего севера.\n\n[target_ruler.GetName] вглядывается в лик Мадонны и видит их: два параллельных шрама на правой щеке, старые раны, которых так и не смогла до конца стереть ни одна реставрация. Давным-давно по ней ударил меч налётчика, и монахи, заново писавшие образ, раз за разом видели, как порезы проступают кровью сквозь свежую краску, — пока наконец не оставили попыток скрыть содеянное."
 pilgrimage_expedition_events.14.desc: "[current_location.GetName] стоит там, где Дунай делает излучину, и с соборного холма открывается вид на реку, некогда отмечавшую край христианской Европы. Здесь, в часовне, с тех пор не раз перестроенной, родился, принял крещение и в зимний день на рубеже тысячелетий был коронован первым христианским королём своего народа Стефан Венгерский.\n\n[target_ruler.GetName] удостаивается приёма у архиепископа — примаса Венгрии, преемника кафедры, которую основал сам Стефан: [current_location.GetNameWithNoTooltip]. Архиепископ рассказывает о юном короле, который предпочёл крещение старым богам, который выстроил эту церковь прежде, чем свой дворец, и которого причислили к лику святых лишь через несколько десятилетий после смерти — именно потому, что он понимал: христианская корона должна покоиться на христианской церкви."
 pilgrimage_expedition_events.15.desc: "На холме над городом [current_location.GetName], обращённом к заливу, стоит скромная францисканская церковь, построенная вокруг пустого места, где, как уверяют здешние паломники, некогда стояло нечто необычайное. Три года, говорят они, на этой земле стоял сам дом Святого семейства, целиком перенесённый ангелами из Назарета, когда защищать его в Святой земле стало слишком опасно, — а затем он продолжил своё чудесное странствие в Лорето, в Италии.\n\n[target_ruler.GetName] видит образ, который папа прислал, чтобы утешить этот [current_location.GetRank.GetName] после ухода дома: Дева, кормящая Младенца Христа, — по преданию, работа самого святого Луки. С тех пор поколение за поколением паломники приходят на этот склон — к святыне того, чего здесь больше нет и что всё же каким-то образом по-прежнему здесь."
 pilgrimage_expedition_events.16.desc: "Собор города [current_location.GetName] сурово и серо высится на фоне северного неба. Он построен над песчаной отмелью, где чуть больше чем через год после смерти короля вскрыли его могилу и, к изумлению всех присутствовавших, нашли тело нетленным. Волосы и ногти его, гласит предание, продолжали расти в тёмной земле, а из гроба, где должен был стоять смрад смерти, исходило благоухание.\n\n[target_ruler.GetName] стоит перед ракой Олава Харальдссона — некогда вождя викингов, павшего в бою, когда он силой пытался насадить христианство в королевстве, которое его не желало, и провозглашённого святым в течение года после смерти одним лишь всенародным признанием, без всякого далёкого папы. Странная это святость, размышляет [target_ruler.GetNameWithNoTooltip]: добытая не кроткой набожностью, а мечом — и смертью за дело, праведность которого стала очевидна лишь задним числом."
 pilgrimage_expedition_events.18.desc: "Дорога уходит вверх, в голый, иссечённый ветрами край, и сужается до тропы, что вьётся по плечу горы. [target_ruler.GetName] останавливается у развилки: длинный путь в обход самого тяжёлого подъёма — или прямой, о котором местные пастухи говорят, что неподготовленные на нём выживают не всегда.\n\n[target_ruler.GetSheHe|U] взвешивает гору против календаря. Каждый день, потраченный на поиски лёгкого пути, — это день, на который отряд не приблизился к концу странствия."
 pilgrimage_expedition_events.18.d: "Отправить отставших вниз с горы одних."
 pilgrimage_expedition_events.19.desc: "Небо над кораблём без всякого предупреждения темнеет, и уже через час команда борется с валами, что перехлёстывают через борт. [target_ruler.GetName] с размаху ударяется о мачту, прежде чем удаётся найти опору, а палуба вздымается, словно живое существо, и швыряет [target_ruler.GetHimHer] из стороны в сторону.\n\nВнизу, под палубой, паломники цепляются за всё, что прибито к доскам, и молятся разом на дюжине наречий. Больше ничего не остаётся — только ждать, пока море не решит, что с них довольно."
 pilgrimage_expedition_events.19.c: "Облегчить корабль, высадив часть свиты в шлюпки."
 pilgrimage_expedition_events.20.desc: "Дорога обрывается у реки, вздувшейся и побуревшей от недавних дождей; брод, который должен быть здесь, скрыт под течением, способным сбить с ног лошадь. С дальнего берега наблюдает паромщик — и не торопится переправляться, пока не увидит блеск доброй монеты.\n\n[target_ruler.GetName] переводит взгляд с воды на паромщика и обратно. Ни то ни другое сегодня не внушает особого доверия."
 pilgrimage_expedition_events.20.c: "Отправить часть свиты искать переправу самостоятельно."
 pilgrimage_expedition_events.21.desc: "На много миль дорога уходит в низины, залитые стоячей водой, и воздух густеет от запаха гнили и тучи кусачей мошкары. Через несколько дней кашель в свите сменяется лихорадкой, и не одного путника приходится нести на руках.\n\n[target_ruler.GetName] видит, как с каждой милью по этим местам отряд редеет и затихает, и гадает, многие ли из этих людей нанимались в паломничество, а не на мор."
 pilgrimage_expedition_events.22.desc: "Снег заметает перевал впереди сугробами выше человеческого роста, и местные жители прямо говорят: до весны этой дорогой никто не пройдёт. Целый сезон, потерянный из-за непогоды, не входил в планы, которые строит [target_ruler.GetName], но гора с дорожными планами не считается.\n\nНеподалёку есть город, где хватит места для всего отряда, если [target_ruler.GetHerHis] кошель выдержит расходы на постой. А есть и проводники, которые за плату уверяют, что знают путь даже сейчас."
 pilgrimage_expedition_events.23.desc: "Весть о приближении паломников обогнала сам отряд, и местный лорд лично выезжает навстречу с приглашением: пусть [target_ruler.GetName] отдохнёт за его столом, прежде чем продолжить путь. Гостеприимство щедрое и явно рассчитано на то, чтобы его увидели и запомнили.\n\n[target_ruler.GetSheHe|U] понимает, чем на самом деле является это предложение: если принять его с должным изяществом, оно принесёт и благочестие, и престиж."
 pilgrimage_expedition_events.23.a.host_opinion_tt: "[scope:host_lord.GetName] получает +20 к [Concept('opinion', 'мнению')|E] о нас"
 pilgrimage_expedition_events.24.desc: "Дорога впереди проходит через земли лорда, для которого [ROOT.GetCountry.GetName] — враг, и его люди уже ждут на границе с заставой и требованием. [target_ruler.GetName] рассчитывает проскользнуть незаметно, но надежда гаснет при виде пик, перегородивших дорогу.\n\nСборщик пошлины называет цену — скорее оскорбление, чем предложение, — и ждёт, чего стоит [target_ruler.GetHerHis] гордость."
 pilgrimage_expedition_events.25.desc: "[current_location.GetDominantReligion.GetAdjective]ие верующие почитают святыню, мимо которой проходит дорога; её иконы и обряды здесь незнакомы. [target_ruler.GetName] наблюдает, как местные совершают свои молитвы, поглядывая на проходящих чужаков с любопытством и некоторой опаской.\n\nСреди паломников издавна водится обычай спорить о вере с каждым, кто готов слушать. [target_ruler.GetSheHe|U] раздумывает, не сегодня ли тот день, когда стоит ему поддаться."
 pilgrimage_expedition_events.26.desc: "На этом отрезке дорогу поглощает глушь, где не действует ничья власть, и из-за деревьев появляются фигуры прежде, чем отряд успевает опомниться: вооружённые, оборванные и явно привычные грабить путников. [target_ruler.GetName] быстро пересчитывает их. Их достаточно, чтобы стать бедой, и слишком мало, чтобы зваться армией.\n\nИх главарь выходит вперёд и называет цену за безопасный проход — таким тоном, что ясно, что случится в случае отказа."
 pilgrimage_expedition_events.26.c: "Купить безопасный проход, оставив разбойникам часть свиты."
 pilgrimage_expedition_events.27.desc: "Молва бежит впереди королевского паломничества, и к тому времени, как [target_ruler.GetName] достигает следующего перекрёстка, там уже собралась нестройная колонна простых паломников в надежде пройти остаток пути под защитой свиты правителя.\n\nСреди них есть семьи и старики, бредущие пешком, — в одиночку им далеко не уйти. [target_ruler.GetSheHe|U] не может кормить всю эту толпу вечно, но прогнать их здесь — значит бросить их на произвол судьбы."
 pilgrimage_expedition_events.29.desc: "Низкий тёмный корпус прорезает горизонт; вёсла сверкают на солнце, и судно настигает корабль паломников быстрее, чем пристало ходить честному торговцу. [target_ruler.GetName] узнаёт силуэт корсара задолго до крика впередсмотрящего, а вокруг — ни порта, ни берега, ни помощи.\n\n[target_ruler.GetSheHe|U] собирает на палубе всех бойцов, каких только может выставить свита, и взвешивает, хватит ли их — или корабельные припасы стоят больше, чем бой."
 pilgrimage_expedition_events.29.c: "Купить безопасность корабля ценой части свиты."
 pilgrimage_expedition_events.30.desc: "Свита поредела в пути, и [target_ruler.GetName] теперь — лёгкая добыча; кто-то по дороге это заметил. Вооружённые люди окружают отряд прежде, чем удаётся собрать надлежащую стражу, и их главарь называет цену за свободу правителя так же буднично, как купец называет цену хлеба.\n\n[target_ruler.GetSheHe|U] может положиться лишь на горстку людей, а хороших выходов и того меньше."
 pilgrimage_expedition_events.28.desc: "Припасы отряда иссякли где-то за последним городом, достойным этого имени, и животы свиты опустели, как мешки, в которых когда-то был хлеб. [target_ruler.GetName] — не полководец, и это заметно: голоду нет дела до святости дороги впереди.\n\nЗдешняя земля по крайней мере достаточно щедра, чтобы кое-что предложить: поля, сады и деревенский рынок неподалёку — если [target_ruler.GetHerHis] отряд готов потратить на это время, монету или гордость."
