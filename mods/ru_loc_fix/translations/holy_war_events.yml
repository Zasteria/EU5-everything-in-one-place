l_russian:
 holy_war.3.a.tt: "Мы ничего не предпринимаем против насильственных обращений"
 holy_war.4.title: "Упрёк верующих"
 holy_war.4.desc: "Предводитель священной войны обвиняет нас в уклонении от священного долга и грозит тяжкими последствиями, если мы не докажем свою преданность. Что мы ответим?"
 holy_war.4.a: "Клянёмся удвоить усилия."
 holy_war.4.b: "Мы никому не обязаны отчётом."
 holy_war.6.title: "Верующие довольны"
 holy_war.6.desc: "Весть о нашем вновь пробудившемся рвении к священной войне разнеслась далеко, и предводители верующих теперь произносят наше имя с теплотой. Где прежде было сомнение, ныне благосклонность."
 holy_war.7.title: "Наш призыв услышан"
 holy_war.7.desc: "Держава [preach_target.GetName] вняла нашим проповедям и вступила в священную войну, отдав делу веры меч и казну. Ещё один клинок обнажён за веру, и воинство растёт."
 holy_war.7.a: "Верующие собираются."
 holy_war.8.title: "Наш призыв отвергнут"
 holy_war.8.desc: "Держава [preach_target.GetName] осталась глуха к нашим проповедям: холодные слова, запертые ворота — и никакого участия в священной войне. Верующие запомнят это оскорбление."
 holy_war.8.a.tt: "Они пренебрегли нашим предложением"
 holy_war.9.title: "Предложение кардинальской кафедры"
 holy_war.9.desc: "Держава [cardinal_offerer.GetName], возглавляющая «[cardinal_io.GetName]», предлагает возвести одного из наших прелатов в кардинальское достоинство, если мы примем крест, и учредить эту кафедру в пределах нашего собственного государства. Такое покровительство крепко связало бы нас со священным делом. Примем ли мы предложение?"
 holy_war.9.a: "Мы принимаем эту честь и присоединяемся к крестовому походу."
 holy_war.9.b: "Мы отклоняем предложение."
 holy_war.10.title: "Предложение признания"
 holy_war.10.desc: "Держава [recognition_offerer.GetName], возглавляющая «[recognition_io.GetName]», предлагает признать наше положение среди верующих — даровать нам религиозный авторитет и легитимность, — если мы присоединимся к священной войне против неверных. Примем ли мы предложение?"
 holy_war.10.a: "Мы соглашаемся и присоединяемся к джихаду."
 holy_war.10.b: "Мы отклоняем предложение."
 holy_war.17.title: "Чудесное исцеление"
 holy_war.17.desc: "Простой солдат, которого лагерные лекари уже сочли покойником, поднялся с одра болезни целым и невредимым, и многие уже называют это делом Небес. Но в горячечном бреду ему являлись странные и тревожные сны — видения, которые, как он клянётся, предрекли грядущее, — и воины с беспокойством перешёптываются о них. Как нам поступить?"
 holy_war.17.a: "Объявить его исцеление чудом и воодушевить воинство!"
 holy_war.17.a.tt: "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.17.b: "Замять дело, пока лагерь не охватил страх."
 holy_war.18.title: "Пыл в лагере угасает"
 holy_war.18.desc: "Долгое ожидание жестоко изматывает воинство. Молитвы, звучавшие некогда с жаром, теперь бормочут по привычке, из-за малейших пустяков вспыхивают ссоры, а у ночных костров вновь тлеют старые распри. Пыл, что когда-то привёл верующих под знамёна, остыл до серого пепла, и если вскоре ничто не разожжёт их дух вновь, всё предприятие может зачахнуть прежде, чем будет нанесён хоть один удар. Что же делать?"
 holy_war.18.a: "Устроить для воинства великую проповедь и пир."
 holy_war.18.a.tt: "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.18.b: "Пусть верующие сами разожгут в себе огонь."
 holy_war.18.b.tt: "Снижает религиозное рвение священной войны на #R 5#! и отбрасывает её подготовку на #R 5#!"
 holy_war.19.title: "Пламенный проповедник"
 holy_war.19.desc: "На краю лагеря появился проповедник с безумным взором: одежды его истрепались в дороге, а голос охрип от многодневных неустанных призывов. Его пламенные речи собирают всё растущую толпу бедняков и благочестивцев, батраков и безземельных, и все они требуют выступить за веру сей же час. Рвение его не знает удержу, сам он совершенно неуправляем, и ни один из наших сеньоров не имеет над ним никакой власти. Как нам быть с этим смутьяном?"
 holy_war.19.a: "Дать ему полную волю собирать верующих."
 holy_war.19.a.tt: "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.19.b: "Обуздать его, пока он не посеял смуту."
 holy_war.21.title: "Ссора из-за добычи"
 holy_war.21.desc: "Едва город пал, как наши солдаты и воины союзного войска сцепились из-за дележа добычи. В тесных улочках обнажены ножи, палатки опрокинуты, и старые обиды между двумя лагерями выплёскиваются в открытую драку. Если ссору не уладить быстро, она может отравить весь поход и обратить брата против брата, пока враг ещё стоит. Как нам её разрешить?"
 holy_war.21.a: "Пусть наши люди возьмут то, что заслужили."
 holy_war.21.a.tt: "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.21.b: "Сдержать их ради общего дела."
 holy_war.21.b.tt: "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.22.title: "Болезнь в войске"
 holy_war.22.desc: "Изнурительная лихорадка расползлась по тесным осадным линиям, и каждое серое утро из палаток выносят всё больше людей в беспамятстве. Лагерные лекари пускают им кровь, дают слабительное и молятся над ними, но ничто не останавливает болезнь, и смрад умирающих тяжело висит над всем лагерем. С каждым днём войско теряет силы, которых ему так недостаёт вдали от дома, перед всё ещё несокрушёнными стенами. Как нам встретить эту напасть?"
 holy_war.22.a: "Продолжать поход, чего бы это ни стоило."
 holy_war.22.b: "Дать войску отдых, пока болезнь не отступит."
 holy_war.22.b.tt: "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.23.title: "Гибель героя"
 holy_war.23.desc: "Осада продолжается: [sieged_location.GetName] всё ещё держится, а у осаждённых стен в самой гуще боя пал [fallen_champion.GetName] — сражённый на валу после подвигов, о которых будут слагать песни ещё целое поколение. Войско оплакивает героя, любимого и простым солдатом, и гордым сеньором, но даже в скорби кровь воинов вскипает, и многие теперь молят о чести отомстить врагу за павшего. Как нам почтить эту смерть?"
 holy_war.23.a: "Провозгласить его мучеником за веру!"
 holy_war.23.a.tt: "Увеличивает религиозное рвение священной войны на #G 10#!"
 holy_war.23.b: "Почтить его память со сдержанным достоинством."
 holy_war.23.b.tt: "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.24.title: "Лжеверующие в рядах"
 holy_war.24.desc: "По лагерю ползут недобрые слухи, будто среди верующих затесались еретики и лжеверующие: их молитвы — пустое глумление, а их верность под большим сомнением. Самые набожные в войске требуют вырвать их с корнем, пока они не отравили всю армию, а более трезвые головы напоминают, что меч в руке остаётся мечом, какая бы вера ни таилась в сердце. Как нам ответить на это обвинение?"
 holy_war.24.a: "Изгнать лжеверующих из войска."
 holy_war.24.a.tt: "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.24.b: "Закрыть на это глаза. Нам нужен каждый меч."
 holy_war.24.b.tt: "Снижает религиозное рвение священной войны на #R 5#!"
 holy_war.25.title: "Благочестивое завещание"
 holy_war.25.desc: "Богатый магнат нашего государства, недавно отошедший в вечность, завещал священной войне огромную сумму. Душеприказчики передали это богатство на наше попечение — запечатанные сундуки с монетой, которую мы можем потратить на общее дело по своему усмотрению, — и вот уже духовенство, военачальники и бедняки наперебой притязают на неё. Куда направить это состояние?"
 holy_war.25.a: "Пустить эти деньги на нашу собственную войну."
 holy_war.25.b: "Передать их в военную казну священной войны."
 holy_war.25.b.tt: "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.25.c: "Раздать их верующим как милостыню."
 holy_war.25.c.tt: "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.27.title: "Подкуп удался"
 holy_war.27.desc: "Наше серебро тихо сделало своё дело. Держава [desertion_member.GetName] приняла взятку и отступилась от общего дела: свернула знамёна и украдкой побрела домой, прикрываясь отговорками, в которые никто по-настоящему не верит. С её уходом наши враги ослабли. Золото вновь купило нам то, чего не смогли добыть ни сталь, ни проповедь, и один докучливый противник тихо убран с доски. Пожалуй, это урок об истинной цене верности."
 holy_war.27.a: "Алчность побеждает там, где меч бессилен."
 holy_war.27.a.tt: "Держава [desertion_member.GetName] приняла взятку и покинула «[desertion_io.GetName]»"
 holy_war.28.title: "Наше серебро отвергнуто"
 holy_war.28.desc: "Держава [desertion_member.GetName] наотрез отвергла наше тайное предложение и изгнала нашего посланника со своего двора, поклявшись продолжать войну, не страшась и не прельщаясь нашей монетой. Хуже того, слух о нашей попытке ещё может разойтись, и если он дойдёт до людских ушей, наше имя будет запятнано как имя подкупщика и обманщика. Из всей этой затеи мы вынесли лишь риск."
 holy_war.28.a.tt: "Они отказались от взятки"
 holy_war.29.title: "Папский легат"
 holy_war.29.desc: "Его Святейшество направил к нам своего легата — [papal_legate.GetName], воинственного прелата, сведущего в ратном деле не меньше, чем в духовном, — чтобы тот ехал во главе нашего воинства и даровал «[holy_war.GetName]» полное благословение Рима. Такой человек мог бы закалить наши армии и ещё теснее связать нас со Святым Престолом, хотя подчиняется он прежде всего папе и лишь затем — нам. Примем ли мы его на службу?"
 holy_war.29.a: "Принять легата под наши знамёна."
 holy_war.29.a.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.29.b: "Отправить его обратно в Рим с благодарностью."
 holy_war.30.title: "Продавцы индульгенций в лагере"
 holy_war.30.desc: "На лагерь, словно стервятники на свежую падаль, слетелась ватага продавцов индульгенций: они сбывают отпущения грехов и святые безделушки любому солдату, готовому расстаться с монетой. Их выручка растёт так же быстро, как ропот благочестивых, называющих всю эту торговлю позором для священного дела. И всё же монета есть монета, а одними молитвами ещё ни одна священная война не была выиграна. Как с ними поступить?"
 holy_war.30.a: "Пусть их выручка пополнит военную казну."
 holy_war.30.a.tt: "Снижает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 3#!"
 holy_war.30.b: "Тихо направить монету в нашу собственную казну."
 holy_war.30.b.tt: "Снижает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 5#!"
 holy_war.30.c: "Изгнать торгашей из лагеря."
 holy_war.30.c.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.31.title: "Мощи святого"
 holy_war.31.desc: "К нам на хранение попали мощи почитаемого святого: их доставили ко двору благодарные монахи, оберегавшие святыню на протяжении многих опасных лиг пути. Такие реликвии — сокровище, которому нет цены в золоте, ведь там, где они наконец обретут покой, тысячами соберутся верующие, чтобы молиться и дивиться им. Где же хранить эти святые останки?"
 holy_war.39.a: "Благодарение Богу!"
 holy_war.4.a.tt: "Предводитель священной войны даёт нам #G 2 года#!, чтобы проявить себя. Если к тому времени наше участие в священной войне возрастёт, верующие будут довольны; если нет — их упрёк всё равно падёт на нас."
 holy_war.6.a.muslim: "#italic Аллаху акбар#!."
 holy_war.20.title: "Верующие недовольны"
 holy_war.20.desc: "Срок, отпущенный нам на исполнение обетов, истёк, а мы ничего не сделали, чтобы их сдержать. Предводители священной войны не забыли ни наших обещаний, ни того, что мы их не выполнили, и обещанный ими упрёк теперь обрушивается на нас."
 holy_war.20.a: "Мы должны принять их приговор."
 holy_war.9.a.no_seat_tt: "В каждом поселении нашего государства уже есть кардинальская кафедра, поэтому вместо этого нам оказывают честь, повышая наш престиж"
