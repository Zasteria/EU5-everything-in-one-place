l_russian:
 BAG_RTK_REP_ON_TT: "Дипрепутация на время мира: включить"
 BAG_RTK_REP_OFF_TT: "Дипрепутация на время мира: вернуть как было"
 BAG_RTK_REP_DESC: "Помощник правителя. Ставит дипломатические расходы на максимум и сажает советника с лучшей дипломатией на «Дипломатические усилия». Выше дипрепутация — меньше неприязни за земли в мирном договоре.\nВторое нажатие или 1-е число месяца возвращают расходы как было и снимают советника с этого действия."
