l_russian:
 bag_rtk__main__log_name: "Журнал"
 bag_rtk__log_enabled_name: "Писать в debug.log"
 bag_rtk__log_enabled_desc: "Строки «Помощника правителя» в debug.log (месяц, сделки, браки). Нужны, чтобы разобрать, что сделал мод; без галочки мод молчит."
 bag_rtk_name: "Помощник правителя"
 bag_rtk_desc: "Мелкая автоматика для твоей страны. Каждая функция включается отдельно."
 bag_rtk__main_name: "Командиры"
 bag_rtk__main__commanders_name: "Командиры из правителей"
 bag_rtk__cmd_enabled_name: "Правители командуют в мирное время"
 bag_rtk__cmd_enabled_desc: "Раз в месяц, пока нет войны, свободные правители (сословие «Правители», кроме тех, кто в совете) встают командирами. Власть от командования армиями и от флотов — два отдельных котла, каждый делится между командирами, поэтому следующий правитель идёт туда, где отрядов меньше: при четырёх армиях и одном флоте первый встанет на флот. Внутри — на самый большой отряд. Отряды, где уже командует правитель, не трогаются. Во время войны мод командиров не меняет."
 bag_rtk__cmd_fleets_name: "И флотами"
 bag_rtk__cmd_fleets_desc: "Ставить правителей и адмиралами. Выключено — только армии."
 bag_rtk__cmd_war_ruler_name: "«Генерал-правитель» на войне"
 bag_rtk__cmd_war_ruler_desc: "Если действует политика «Генерал-правитель», а правитель во время войны ничем не командует, раз в месяц ставить его на самую большую армию, чтобы не терять легитимность."
 bag_rtk__main__prisoners_name: "Пленники"
 bag_rtk__pris_ransom_name: "Отпускать за выкуп после мира"
 bag_rtk__pris_ransom_desc: "Раз в месяц, пока нет войны, армии с пленными, которых можно выкупить, сами предлагают выкуп их прежним владельцам — как кнопка «Выкуп» у отряда."
 bag_rtk__pris_safety_name: "Уводить пленных в тыл"
 bag_rtk__pris_safety_desc: "Отряды из одних пленных уходят в безопасное место, которое выбирает игра: сразу после боя и ещё раз, когда добегут (проверка 1-го числа). Не больше двух раз на отряд."
 bag_rtk__merge_irregulars_name: "После боя объединять нерегулярные полки (пока выключено)"
 bag_rtk__merge_irregulars_desc: "Сразу после каждого боя твоей армии мод жмёт у армий пункт меню отряда «Объединить иррегулярные полки» там, где игра его даёт: потрёпанные полки ополчения и наёмников сливаются, регулярные не трогаются."
 bag_rtk__art_name: "Творения"
 bag_rtk__art__sale_name: "Продажа"
 bag_rtk__art__quality_name: "Какое качество продавать"
 bag_rtk__art_enabled_name: "Продавать творения"
 bag_rtk__art_enabled_desc: "Раз в месяц творения отмеченного качества продаются другим державам, начиная с самых дорогих. Покупатель — тот, кто согласится охотнее всех, и только тот, кто согласился бы и в обычной продаже, хорошо к нам относится, не враг и не соперник, и после покупки у него остаётся не меньше полугодового дохода. Как обычная «Продажа творения»: тратит дипломата и немного престижа. Бесценные творения и регалии не трогаются."
 bag_rtk__art_native_name: "Своим действием игры"
 bag_rtk__art_native_desc: "Продажа идёт не скриптом, а собственным действием мода в игре: как у обычной «Продажи творения» — цену платит покупатель, немного престижа и дипломат. Не больше одной продажи в одну страну в месяц."
 bag_rtk__art_keep_name: "Оставлять дипломатов"
 bag_rtk__art_keep_desc: "Сколько целых дипломатов мод оставляет: продаёт, только если после продажи их останется не меньше."
 bag_rtk__art_q1_name: "Известное в районе (0–11)"
 bag_rtk__art_q1_desc: "Продавать творения этого качества."
 bag_rtk__art_q2_name: "Хорошо известное в районе (12–24)"
 bag_rtk__art_q2_desc: "Продавать творения этого качества."
 bag_rtk__art_q3_name: "Хорошо известное в области (25–36)"
 bag_rtk__art_q3_desc: "Продавать творения этого качества."
 bag_rtk__art_q4_name: "Знаменитое в области (37–49)"
 bag_rtk__art_q4_desc: "Продавать творения этого качества."
 bag_rtk__art_q5_name: "Хорошо известное в регионе (50–61)"
 bag_rtk__art_q5_desc: "Продавать творения этого качества."
 bag_rtk__art_q6_name: "Знаменитое в регионе (62–74)"
 bag_rtk__art_q6_desc: "Продавать творения этого качества."
 bag_rtk__art_q7_name: "Выдающееся (75–86)"
 bag_rtk__art_q7_desc: "Продавать творения этого качества."
 bag_rtk__art_q8_name: "Лучшее (87–100)"
 bag_rtk__art_q8_desc: "Продавать творения этого качества."
 bag_rtk__art__log_name: "Отладка"
 bag_rtk__cd_faith__show_name: "Недоступные действия"
 bag_rtk__cd_show_all_name: "Показывать все действия"
 bag_rtk__cd_show_all_desc: "Обычно в списках напоминалки видны только действия, доступные твоей державе, а также отмеченные и те, что сейчас на откате. С галочкой видны все, во всех подвкладках «Перезарядок»."
 bag_rtk__art_log_name: "Записывать историю продаж"
 bag_rtk__art_log_desc: "Мод запоминает последние десять своих продаж: год, творение, качество, покупателя, цену, согласие и сколько золота у покупателя осталось. Смотреть — кнопкой «Показать» ниже."
 bag_rtk__art_log_show_name: "История продаж"
 bag_rtk__art_log_show_desc: "Открывает окно с последними десятью продажами мода, новые сверху. Записываются, только пока стоит галочка «Записывать историю продаж»."
 bag_rtk__art_log_show_text: "Показать"
 bag_rtk__family_name: "Семья"
 bag_rtk__family__wed_name: "Женитьба династии"
 bag_rtk__wed_enabled_name: "Женить членов династии"
 bag_rtk__wed_enabled_desc: "1-го числа каждый член правящей семьи без пары от 16 лет женится на самой молодой подходящей невесте (или жених) из правящей семьи другой страны: правитель или его близкая родня, монархия в дипломатической дистанции, та же группа вер. Брак прямой, без дипломатов и согласия; отношения «династический брак» между странами он не даёт: скриптом игра его не создаёт."
 bag_rtk__wed_women_name: "И выдавать замуж женщин"
 bag_rtk__wed_women_desc: "Без галочки женщин династии мод не трогает: их брак решаешь сам."
 bag_rtk_art.1.t: "История продаж творений"
