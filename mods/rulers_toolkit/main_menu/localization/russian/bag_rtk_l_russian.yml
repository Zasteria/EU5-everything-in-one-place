l_russian:
 bag_rtk_name: "Помощник правителя"
 bag_rtk_desc: "Мелкая автоматика для твоей страны. Каждая функция включается отдельно."
 bag_rtk__main_name: "Функции"
 bag_rtk__main__commanders_name: "Командиры из правителей"
 bag_rtk__cmd_enabled_name: "Правители командуют армиями в мирное время"
 bag_rtk__cmd_enabled_desc: "Раз в месяц, пока нет войны, самые большие армии получают командира из сословия «Правители»: сначала самого правителя, потом остальных правителей, которые не сидят в совете. Армии, которыми уже командует правитель, не трогаются. Во время войны мод командиров не меняет."
 bag_rtk__cmd_navy_name: "И флотами тоже"
 bag_rtk__cmd_navy_desc: "Правителей, кому не хватило армий, ставить адмиралами на флоты, от самого большого."
 bag_rtk__cmd_war_ruler_name: "«Генерал-правитель» на войне"
 bag_rtk__cmd_war_ruler_desc: "Если действует политика «Генерал-правитель», а правитель во время войны ничем не командует, раз в месяц ставить его на самую большую армию, чтобы не терять легитимность."
