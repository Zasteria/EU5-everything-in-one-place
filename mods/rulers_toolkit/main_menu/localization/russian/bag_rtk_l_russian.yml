l_russian:
 bag_rtk_name: "Помощник правителя"
 bag_rtk_desc: "Мелкая автоматика для твоей страны. Каждая функция включается отдельно."
 bag_rtk__main_name: "Командиры"
 bag_rtk__main__commanders_name: "Командиры из правителей"
 bag_rtk__cmd_enabled_name: "Правители командуют в мирное время"
 bag_rtk__cmd_enabled_desc: "Раз в месяц, пока нет войны, свободные правители (сословие «Правители», кроме тех, кто в совете) встают командирами. Власть от командования армиями и от флотов — два отдельных котла, каждый делится между командирами, поэтому следующий правитель идёт туда, где отрядов меньше: при четырёх армиях и одном флоте первый встанет на флот. Внутри — на самый большой отряд. Отряды, где уже командует правитель, не трогаются. Во время войны мод командиров не меняет."
 bag_rtk__cmd_fleets_name: "И флотами"
 bag_rtk__cmd_fleets_desc: "Ставить правителей и адмиралами. Выключено — только армии."
 bag_rtk__cmd_war_ruler_name: "«Генерал-правитель» на войне"
 bag_rtk__cmd_war_ruler_desc: "Если действует политика «Генерал-правитель», а правитель во время войны ничем не командует, раз в месяц ставить его на самую большую армию, чтобы не терять легитимность."
 bag_rtk__main__prisoners_name: "Пленники"
 bag_rtk__pris_ransom_name: "Отпускать за выкуп после мира"
 bag_rtk__pris_ransom_desc: "Раз в месяц, пока нет войны, армии с пленными, которых можно выкупить, сами предлагают выкуп их прежним владельцам — как кнопка «Выкуп» у отряда."
 bag_rtk__pris_safety_name: "Уводить пленных в тыл"
 bag_rtk__pris_safety_desc: "Отряды из одних пленных уходят в безопасное место, которое выбирает игра: сразу после боя и ещё раз, когда добегут (проверка 1-го числа). Не больше двух раз на отряд."
