l_english:
 bag_rtk_name: "Ruler's Toolkit"
 bag_rtk_desc: "Small automations for your country. Each one is switched on by itself."
 bag_rtk__main_name: "Commanders"
 bag_rtk__main__commanders_name: "Crown commanders"
 bag_rtk__cmd_enabled_name: "Crown commands in peacetime"
 bag_rtk__cmd_enabled_desc: "Once a month, while there is no war, free crown characters (not in the cabinet) take command. Power from commanding armies and from commanding fleets are two separate pools, each shared among its commanders, so the next one goes where there are fewer units: with four armies and one fleet the first takes the fleet. Within a branch, the largest unit. Units already led by the crown are left alone. During a war the mod does not change commanders."
 bag_rtk__cmd_fleets_name: "Fleets as well"
 bag_rtk__cmd_fleets_desc: "Crown characters may become admirals too. Off: armies only."
 bag_rtk__cmd_war_ruler_name: "Ruler General in war"
 bag_rtk__cmd_war_ruler_desc: "If the Ruler General policy is in force and the ruler commands nothing during a war, put him on the largest army once a month, so legitimacy is not lost."
 bag_rtk__main__prisoners_name: "Prisoners"
 bag_rtk__pris_ransom_name: "Ransom them after peace"
 bag_rtk__pris_ransom_desc: "Once a month, while there is no war, armies holding prisoners that can be ransomed offer the ransom to their former owners, as the unit's Ransom button does."
 bag_rtk__pris_safety_name: "Send prisoners to the rear"
 bag_rtk__pris_safety_desc: "Units holding only prisoners run to a safe place the game chooses: right after the battle, and once more after they arrive (checked on the 1st). At most twice per unit."
