l_english:
 bag_rtk_name: "Ruler's Toolkit"
 bag_rtk_desc: "Small automations for your country. Each one is switched on by itself."
 bag_rtk__main_name: "Features"
 bag_rtk__main__commanders_name: "Crown commanders"
 bag_rtk__cmd_enabled_name: "Crown leads the armies in peacetime"
 bag_rtk__cmd_enabled_desc: "Once a month, while there is no war, the largest armies get a commander from the crown: the ruler first, then free crown characters who are not in the cabinet. Armies already led by the crown are left alone. During a war the mod does not change commanders."
 bag_rtk__cmd_navy_name: "Fleets too"
 bag_rtk__cmd_navy_desc: "Crown characters left without an army become admirals of the fleets, largest first."
 bag_rtk__cmd_war_ruler_name: "Ruler General in war"
 bag_rtk__cmd_war_ruler_desc: "If the Ruler General policy is in force and the ruler commands nothing during a war, put him on the largest army once a month, so legitimacy is not lost."
