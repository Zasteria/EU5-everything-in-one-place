l_english:
 bag_rtk_name: "Ruler's Toolkit"
 bag_rtk_desc: "Small automations for your country. Each one is switched on by itself."
 bag_rtk__main_name: "Commanders"
 bag_rtk__main__commanders_name: "Crown commanders"
 bag_rtk__cmd_enabled_name: "Crown commands in peacetime"
 bag_rtk__cmd_enabled_desc: "Once a month, while there is no war, free crown characters (not in the cabinet) take command. Power from commanding armies and from commanding fleets are two separate pools, each shared among its commanders, so the next one goes where there are fewer units: with four armies and one fleet the first takes the fleet. Within a branch, the largest unit. Units already led by the crown are left alone. During a war the mod does not change commanders."
 bag_rtk__cmd_fleets_name: "Fleets as well"
 bag_rtk__cmd_fleets_desc: "Crown characters may become admirals too. Off: armies only."
 bag_rtk__cmd_war_ruler_name: "Ruler General in war"
 bag_rtk__cmd_war_ruler_desc: "If the Ruler General policy is in force and the ruler commands nothing during a war, put him on the largest army once a month, so legitimacy is not lost."
 bag_rtk__main__prisoners_name: "Prisoners"
 bag_rtk__pris_ransom_name: "Ransom them after peace"
 bag_rtk__pris_ransom_desc: "Once a month, while there is no war, armies holding prisoners that can be ransomed offer the ransom to their former owners, as the unit's Ransom button does."
 bag_rtk__pris_safety_name: "Send prisoners to the rear"
 bag_rtk__pris_safety_desc: "Units holding only prisoners run to a safe place the game chooses: right after the battle, and once more after they arrive (checked on the 1st). At most twice per unit."
 bag_rtk__art_name: "Works of art"
 bag_rtk__art__sale_name: "Sale"
 bag_rtk__art__quality_name: "Which quality to sell"
 bag_rtk__art_enabled_name: "Sell works of art"
 bag_rtk__art_enabled_desc: "Once a month, works of art of the ticked quality are sold to other countries, the most expensive first. The buyer is whoever is most willing, and only one who would accept a normal sale, likes us, is neither enemy nor rival, and keeps at least six months of income after paying. Same as a normal Sell Work of Art: it uses a diplomat and a little prestige. Priceless works and regalia are never sold."
 bag_rtk__art_keep_name: "Diplomats to keep"
 bag_rtk__art_keep_desc: "How many whole diplomats the mod keeps: it sells only if at least that many remain after the sale."
 bag_rtk__art_q1_name: "Locally Known (0–11)"
 bag_rtk__art_q1_desc: "Sell works of art of this quality."
 bag_rtk__art_q2_name: "Locally Well Known (12–24)"
 bag_rtk__art_q2_desc: "Sell works of art of this quality."
 bag_rtk__art_q3_name: "Well Known in Area (25–36)"
 bag_rtk__art_q3_desc: "Sell works of art of this quality."
 bag_rtk__art_q4_name: "Renowned in Area (37–49)"
 bag_rtk__art_q4_desc: "Sell works of art of this quality."
 bag_rtk__art_q5_name: "Regionally Well Known (50–61)"
 bag_rtk__art_q5_desc: "Sell works of art of this quality."
 bag_rtk__art_q6_name: "Regionally Renowned (62–74)"
 bag_rtk__art_q6_desc: "Sell works of art of this quality."
 bag_rtk__art_q7_name: "Masterpiece (75–86)"
 bag_rtk__art_q7_desc: "Sell works of art of this quality."
 bag_rtk__art_q8_name: "Magnum Opus (87–100)"
 bag_rtk__art_q8_desc: "Sell works of art of this quality."
 bag_rtk__art__log_name: "Debug"
 bag_rtk__cd_faith__show_name: "Unavailable actions"
 bag_rtk__cd_show_all_name: "Show every action"
 bag_rtk__cd_show_all_desc: "Normally the reminder lists show only actions your country can use, plus ticked ones and those on cooldown. Ticked, every action is shown on every Cooldowns sub-tab."
 bag_rtk__art_log_name: "Record sale history"
 bag_rtk__art_log_desc: "The mod remembers its last ten sales: year, work of art, quality, buyer, price, acceptance and the buyer's gold left. View them with the «Show» button below."
 bag_rtk__art_log_show_name: "Sale history"
 bag_rtk__art_log_show_desc: "Opens a window with the mod's last ten sales, newest first. Sales are recorded only while «Record sale history» is ticked."
 bag_rtk__art_log_show_text: "Show"
 bag_rtk__family_name: "Family"
 bag_rtk__family__wed_name: "Dynasty marriages"
 bag_rtk__wed_enabled_name: "Marry off dynasty members"
 bag_rtk__wed_enabled_desc: "On the 1st, every unmarried member of the ruling family aged 16 or more marries the youngest suitable ruling-family member of another country, 16 or older: any country of the same religious group. The marriage is made at once, with no diplomats and no waiting for consent."
 bag_rtk__wed_women_name: "Marry off women too"
 bag_rtk__wed_women_desc: "Unticked, the mod leaves the dynasty's women alone: their marriages are yours to arrange."
 bag_rtk_art.1.t: "Work of art sale history"
 bag_rtk_art.1.d: "The mod's last sales, newest first. Recorded in total: [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h_count').GetValue)|0].\n\n[SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h1_art').IsSet, 'bag_rtk_art_h1', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h2_art').IsSet, 'bag_rtk_art_h2', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h3_art').IsSet, 'bag_rtk_art_h3', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h4_art').IsSet, 'bag_rtk_art_h4', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h5_art').IsSet, 'bag_rtk_art_h5', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h6_art').IsSet, 'bag_rtk_art_h6', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h7_art').IsSet, 'bag_rtk_art_h7', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h8_art').IsSet, 'bag_rtk_art_h8', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h9_art').IsSet, 'bag_rtk_art_h9', 'bag_rtk_art_h_none')][SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_rtk_art_h10_art').IsSet, 'bag_rtk_art_h10', 'bag_rtk_art_h_none')]"
 bag_rtk_art.1.a: "Close"
 bag_rtk_art.1.b: "Clear history"
