 bag_asp__available_i19_desc: "Для улучшения мнения у ваших целей. Берёт место всегда, когда оно свободно."
 bag_asp__priority_i19_name: "[ShowCabinetActionName('diplomatic_endeavors')] (мнение)"
 bag_asp__priority_i19_desc: "Для улучшения мнения у ваших целей. Берёт место всегда, когда оно свободно."
