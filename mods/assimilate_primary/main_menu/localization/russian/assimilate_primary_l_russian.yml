 bag_asp__available_i8_name: "[ShowCabinetActionName('promote_culture')] (до 50%)"
 bag_asp__available_i8_desc: "Пока в провинции есть районы «интегрирован» или «завоёван» без половины основной или признанной культуры: на половине интегрированный район становится национальным. Первой идёт провинция с более высоким средним контролем, по ступеням в 10 пунктов (без контроля ассимиляция не идёт; при нулевом провинция не берётся); внутри ступени — где больше интегрированных районов, потом завоёванных. При полной раздаче идущая ассимиляция переезжает в провинцию выше по этому порядку. Место, чья провинция готова, освобождается, если не используется строка полной ассимиляции."
 bag_asp__priority_i8_name: "[ShowCabinetActionName('promote_culture')] (до 50%)"
 bag_asp__priority_i8_desc: "Пока в провинции есть районы «интегрирован» или «завоёван» без половины основной или признанной культуры: на половине интегрированный район становится национальным. Первой идёт провинция с более высоким средним контролем, по ступеням в 10 пунктов (без контроля ассимиляция не идёт; при нулевом провинция не берётся); внутри ступени — где больше интегрированных районов, потом завоёванных. При полной раздаче идущая ассимиляция переезжает в провинцию выше по этому порядку. Место, чья провинция готова, освобождается, если не используется строка полной ассимиляции."
