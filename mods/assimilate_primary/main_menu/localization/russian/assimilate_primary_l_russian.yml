l_russian:
 bag_asp_name: "Автоматика совета"
 bag_asp_desc: "Своя автоматика совета: места получают действия по списку приоритетов, который задаётся здесь. Ассимиляция советом идёт в основную культуру."
 bag_asp__main_name: "Совет"
 bag_asp__main__council_name: "Своя автоматика"
 bag_asp__actions_name: "Действия"
 bag_asp__auto_name: "Своя автоматика совета"
 bag_asp__auto_desc: "Включено: игровая автоматика «Совет» выключается, все места сразу распределяются по списку «Приоритет», дальше — по расписанию ниже. Каждое назначение пишется в debug.log."
 bag_asp__period_name: "Заполнять пустые места раз в, мес."
 bag_asp__period_desc: "Как часто место без действия (закончилось, новый советник) получает действие. Занятые места не трогаются."
 bag_asp__review_name: "Перераспределять все места раз в, мес."
 bag_asp__review_desc: "Как часто все места заново раздаются по «Приоритету»: верхнее действие берёт свободного советника с лучшим навыком, а место, чьё действие больше не среди выбранных, получает новое. Место, уже занятое выбранным действием, его сохраняет. 0 — никогда."
 bag_asp__actions__available_name: "Доступные"
 bag_asp__actions__priority_name: "Приоритет"
 bag_asp__available__use_name: "Использовать"
 bag_asp__available_item_column_name: "Действие"
 bag_asp__priority__ability_name: "Навык"
 bag_asp__priority_item_column_name: "Действие"
 bag_asp__available_name: "Доступные"
 bag_asp__available_desc: "Все общие действия, которые видит эта страна. Отмеченные используются."
 bag_asp__priority_name: "Приоритет"
 bag_asp__priority_desc: "Используемые действия, пробуются сверху вниз."
 bag_asp__available_i1_name: "Интеграция провинции"
 bag_asp__priority_i1_name: "Интеграция провинции"
 bag_asp__available_i1_desc: "После завоевания [Concept('province', 'провинции')|e] её необходимо [Concept('integrate', 'интегрировать')|e], чтобы она стала частью нашей [Concept('country', 'державы')|e]. Если её не интегрировать, [Concept('pops', 'группы населения')|e] в провинции могут поднять [Concept('rebel', 'мятеж')|e].\n\nНавык советника: ВОЕ"
 bag_asp__priority_i1_desc: "После завоевания [Concept('province', 'провинции')|e] её необходимо [Concept('integrate', 'интегрировать')|e], чтобы она стала частью нашей [Concept('country', 'державы')|e]. Если её не интегрировать, [Concept('pops', 'группы населения')|e] в провинции могут поднять [Concept('rebel', 'мятеж')|e].\n\nНавык советника: ВОЕ"
 bag_asp__available_i2_name: "Интеграция области"
 bag_asp__priority_i2_name: "Интеграция области"
 bag_asp__available_i2_desc: "После завоевания [Concept('area', 'области')|e] её необходимо [Concept('integrate', 'интегрировать')|e], чтобы она стала частью нашей [Concept('country', 'державы')|e]. Если её не интегрировать, [Concept('pops', 'группы населения')|e] в области могут поднять [Concept('rebel', 'мятеж')|e].\n\nНавык советника: ВОЕ"
 bag_asp__priority_i2_desc: "После завоевания [Concept('area', 'области')|e] её необходимо [Concept('integrate', 'интегрировать')|e], чтобы она стала частью нашей [Concept('country', 'державы')|e]. Если её не интегрировать, [Concept('pops', 'группы населения')|e] в области могут поднять [Concept('rebel', 'мятеж')|e].\n\nНавык советника: ВОЕ"
 bag_asp__available_i3_name: "Снизить усталость от войны"
 bag_asp__priority_i3_name: "Снизить усталость от войны"
 bag_asp__available_i3_desc: "Это действие снизит нашу [Concept('war_exhaustion', 'усталость от войны')|e].\n\nНавык советника: ДИП"
 bag_asp__priority_i3_desc: "Это действие снизит нашу [Concept('war_exhaustion', 'усталость от войны')|e].\n\nНавык советника: ДИП"
 bag_asp__available_i4_name: "Повышение стабильности в державе"
 bag_asp__priority_i4_name: "Повышение стабильности в державе"
 bag_asp__available_i4_desc: "Это один из трёх основных способов повышения [Concept('stability', 'стабильности')|e] в нашей [Concept('country', 'державе')|e]. Другой зависит от соотношения священников и общей численности населения державы, а ещё один — от того, сколько из нашего [Concept('budget', 'бюджета')|e] мы готовы на это потратить.\n\nНавык советника: ВОЕ"
 bag_asp__priority_i4_desc: "Это один из трёх основных способов повышения [Concept('stability', 'стабильности')|e] в нашей [Concept('country', 'державе')|e]. Другой зависит от соотношения священников и общей численности населения державы, а ещё один — от того, сколько из нашего [Concept('budget', 'бюджета')|e] мы готовы на это потратить.\n\nНавык советника: ВОЕ"
 bag_asp__available_i5_name: "Усиление контроля над провинцией"
 bag_asp__priority_i5_name: "Усиление контроля над провинцией"
 bag_asp__available_i5_desc: "Это действие позволит постепенно усилить наш [Concept('control', 'контроль')|e] в выбранной [Concept('province', 'провинции')|e]. Это может пригодиться, если обстоятельства изменятся, и нам нужно будет в спешном порядке усилить контроль.\n\nНавык советника: АДМ"
 bag_asp__priority_i5_desc: "Это действие позволит постепенно усилить наш [Concept('control', 'контроль')|e] в выбранной [Concept('province', 'провинции')|e]. Это может пригодиться, если обстоятельства изменятся, и нам нужно будет в спешном порядке усилить контроль.\n\nНавык советника: АДМ"
 bag_asp__available_i6_name: "Усилить контроль над областью"
 bag_asp__priority_i6_name: "Усилить контроль над областью"
 bag_asp__available_i6_desc: "Это действие позволит постепенно повысить наш [Concept('control', 'контроль')|e] в выбранной [Concept('area', 'области')|e]. Может пригодиться, если обстоятельства изменятся, и нам нужно будет быстро усилить контроль.\n\nНавык советника: АДМ"
 bag_asp__priority_i6_desc: "Это действие позволит постепенно повысить наш [Concept('control', 'контроль')|e] в выбранной [Concept('area', 'области')|e]. Может пригодиться, если обстоятельства изменятся, и нам нужно будет быстро усилить контроль.\n\nНавык советника: АДМ"
 bag_asp__available_i7_name: "Отправка тайных королевских инспекторов"
 bag_asp__priority_i7_name: "Отправка тайных королевских инспекторов"
 bag_asp__available_i7_desc: "Это действие позволит существенным образом усилить наш [Concept('control', 'контроль')|e] в выбранной провинции.\n\nНавык советника: АДМ"
 bag_asp__priority_i7_desc: "Это действие позволит существенным образом усилить наш [Concept('control', 'контроль')|e] в выбранной провинции.\n\nНавык советника: АДМ"
 bag_asp__available_i8_name: "Приобщить население к нашей культуре"
 bag_asp__priority_i8_name: "Приобщить население к нашей культуре"
 bag_asp__available_i8_desc: "Это действие приобщит местное [Concept('population', 'население')|e] к выбранной [Concept('culture', 'культуре')|e].\n\nНавык советника: ДИП"
 bag_asp__priority_i8_desc: "Это действие приобщит местное [Concept('population', 'население')|e] к выбранной [Concept('culture', 'культуре')|e].\n\nНавык советника: ДИП"
 bag_asp__available_i9_name: "Обращение провинции"
 bag_asp__priority_i9_name: "Обращение провинции"
 bag_asp__available_i9_desc: "Это действие увеличит количество [Concept('pops', 'групп населения')|e], ежемесячно [Concept('convert', 'обращающихся')|e] в выбранную [Concept('religion', 'религию')|e].\n\nВыбрать можно только [Concept('primary_religion', 'основную религию')|e] державы или религию из той же [Concept('religion_group', 'религиозной группы')|e], которую исповедует хотя бы 1% населения державы.\n\nНавык советника: ВОЕ"
 bag_asp__priority_i9_desc: "Это действие увеличит количество [Concept('pops', 'групп населения')|e], ежемесячно [Concept('convert', 'обращающихся')|e] в выбранную [Concept('religion', 'религию')|e].\n\nВыбрать можно только [Concept('primary_religion', 'основную религию')|e] державы или религию из той же [Concept('religion_group', 'религиозной группы')|e], которую исповедует хотя бы 1% населения державы.\n\nНавык советника: ВОЕ"
 bag_asp__available_i10_name: "Умиротворение населения"
 bag_asp__priority_i10_name: "Умиротворение населения"
 bag_asp__available_i10_desc: "Это действие уменьшит [Concept('unrest', 'беспорядки')|e] местного [Concept('population', 'населения')|e].\n\nНавык советника: ВОЕ"
 bag_asp__priority_i10_desc: "Это действие уменьшит [Concept('unrest', 'беспорядки')|e] местного [Concept('population', 'населения')|e].\n\nНавык советника: ВОЕ"
 bag_asp__available_i11_name: "Восстановление"
 bag_asp__priority_i11_name: "Восстановление"
 bag_asp__available_i11_desc: "Это лучший способ перейти к [Concept('prosperity', 'процветанию')|e] в выбранной [Concept('province', 'провинции')|e]. Это может быть крайне важно после войны или эпидемии.\n\nНавык советника: ДИП"
 bag_asp__priority_i11_desc: "Это лучший способ перейти к [Concept('prosperity', 'процветанию')|e] в выбранной [Concept('province', 'провинции')|e]. Это может быть крайне важно после войны или эпидемии.\n\nНавык советника: ДИП"
 bag_asp__available_i12_name: "Умиротворение сословия"
 bag_asp__priority_i12_name: "Умиротворение сословия"
 bag_asp__available_i12_desc: "Это повысит [Concept('estate_satisfaction', 'довольство')|e] [Concept('estate', 'сословия')|e].\n\nНавык советника: ДИП"
 bag_asp__priority_i12_desc: "Это повысит [Concept('estate_satisfaction', 'довольство')|e] [Concept('estate', 'сословия')|e].\n\nНавык советника: ДИП"
 bag_asp__available_i13_name: "Уменьшение тревоги"
 bag_asp__priority_i13_name: "Уменьшение тревоги"
 bag_asp__available_i13_desc: "Это действие будет ежемесячно ослаблять нашу [Concept('antagonism', 'неприязнь')|e].\n\nНавык советника: ДИП"
 bag_asp__priority_i13_desc: "Это действие будет ежемесячно ослаблять нашу [Concept('antagonism', 'неприязнь')|e].\n\nНавык советника: ДИП"
 bag_asp__available_i14_name: "Снижение инфляции"
 bag_asp__priority_i14_name: "Снижение инфляции"
 bag_asp__available_i14_desc: "Это лучший способ снизить [Concept('inflation', 'инфляцию')|e] в нашей [Concept('country', 'державе')|e]. Мы также можем чеканить меньше монет, но это может повлиять на баланс бюджета.\n\nНавык советника: АДМ"
 bag_asp__priority_i14_desc: "Это лучший способ снизить [Concept('inflation', 'инфляцию')|e] в нашей [Concept('country', 'державе')|e]. Мы также можем чеканить меньше монет, но это может повлиять на баланс бюджета.\n\nНавык советника: АДМ"
 bag_asp__available_i15_name: "Развитие провинции"
 bag_asp__priority_i15_name: "Развитие провинции"
 bag_asp__available_i15_desc: "Это лучший способ повысить [Concept('development', 'развитие')|e] в выбранной [Concept('province', 'провинции')|e]. Скорее всего, вы захотите сделать именно это в отсутствие более срочных дел.\n\nНавык советника: АДМ"
 bag_asp__priority_i15_desc: "Это лучший способ повысить [Concept('development', 'развитие')|e] в выбранной [Concept('province', 'провинции')|e]. Скорее всего, вы захотите сделать именно это в отсутствие более срочных дел.\n\nНавык советника: АДМ"
 bag_asp__available_i16_name: "Поддержка институтов"
 bag_asp__priority_i16_name: "Поддержка институтов"
 bag_asp__available_i16_desc: "Это действие позволит поддержать [Concept('institution', 'институт')|e] в выбранной [Concept('province', 'провинции')|e]. Это основной способ ускорить распространение институтов в нашей [Concept('country', 'державе')|e].\n\nНавык советника: АДМ"
 bag_asp__priority_i16_desc: "Это действие позволит поддержать [Concept('institution', 'институт')|e] в выбранной [Concept('province', 'провинции')|e]. Это основной способ ускорить распространение институтов в нашей [Concept('country', 'державе')|e].\n\nНавык советника: АДМ"
 bag_asp__available_i17_name: "Стимулирование урбанизации"
 bag_asp__priority_i17_name: "Стимулирование урбанизации"
 bag_asp__available_i17_desc: "Благодаря этому действию наше [Concept('population', 'население')|e] сможет быстрее получить [Concept('promoted', 'повышение')|e].\n\nНавык советника: АДМ"
 bag_asp__priority_i17_desc: "Благодаря этому действию наше [Concept('population', 'население')|e] сможет быстрее получить [Concept('promoted', 'повышение')|e].\n\nНавык советника: АДМ"
 bag_asp__available_i18_name: "Укрепление правительства"
 bag_asp__priority_i18_name: "Укрепление правительства"
 bag_asp__available_i18_desc: "Это лучший способ немедленно укрепить нашу [Concept('government_power', 'власть правительства')|e]. Других простых способов напрямую повлиять на неё у нас нет.\n\nНавык советника: ВОЕ"
 bag_asp__priority_i18_desc: "Это лучший способ немедленно укрепить нашу [Concept('government_power', 'власть правительства')|e]. Других простых способов напрямую повлиять на неё у нас нет.\n\nНавык советника: ВОЕ"
 bag_asp__available_i19_name: "Дипломатические усилия"
 bag_asp__priority_i19_name: "Дипломатические усилия"
 bag_asp__available_i19_desc: "Это действие повлияет на большую часть [Concept('diplomacy', 'дипломатии')|e], которую наша [Concept('country', 'держава')|e] пытается проводить. В первую очередь это будет полезно в делах, где важно [Concept('opinion', 'мнение')|e] других держав.\n\nНавык советника: ДИП"
 bag_asp__priority_i19_desc: "Это действие повлияет на большую часть [Concept('diplomacy', 'дипломатии')|e], которую наша [Concept('country', 'держава')|e] пытается проводить. В первую очередь это будет полезно в делах, где важно [Concept('opinion', 'мнение')|e] других держав.\n\nНавык советника: ДИП"
 bag_asp__available_i20_name: "Контрразведка"
 bag_asp__priority_i20_name: "Контрразведка"
 bag_asp__available_i20_desc: "Это действие защитит нашу [Concept('country', 'державу')|e] от других государств, пытающихся создать свои [Concept('spy_network', 'шпионские сети')|e] на нашей территории.\n\nНавык советника: ДИП"
 bag_asp__priority_i20_desc: "Это действие защитит нашу [Concept('country', 'державу')|e] от других государств, пытающихся создать свои [Concept('spy_network', 'шпионские сети')|e] на нашей территории.\n\nНавык советника: ДИП"
