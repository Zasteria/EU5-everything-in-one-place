 bag_asp__available_i8_desc: "Until no location of the province is «integrated» or «conquered» short of half a primary or accepted culture: at half an integrated location becomes core. Integrated locations first, conquered ones after them (they assimilate slower); the more of them in a province, the sooner. In a full hand-out a running one moves to a province with more such locations. A seat whose province is done is freed, unless the full row is in use."
