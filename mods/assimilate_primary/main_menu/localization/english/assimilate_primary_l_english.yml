 bag_asp__available_i8_name: "[ShowCabinetActionName('promote_culture')] (to half)"
 bag_asp__available_i8_desc: "Until no location of the province is «integrated» or «conquered» short of half a primary or accepted culture: at half an integrated location becomes core. The province with the higher average control goes first, counted in bands of ten points (without control nothing assimilates; none at all, never); within a band, the one with more integrated locations, then more conquered ones. In a full hand-out a running one moves to a province that ranks higher. A seat whose province is done is freed, unless the full row is in use."
