l_japanese:
 rule_qol_papal_auto_vote_rule: "#E 教皇勅書の自動投票:#! 決議"
 setting_qol_papal_auto_vote_off: "無効"
 setting_qol_papal_auto_vote_off_desc: "どの教皇の決議にも自動投票しません。投票は月の変わり目に行われます。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
 setting_qol_papal_auto_vote_all: "すべての決議"
 setting_qol_papal_auto_vote_all_desc: "破門と十字軍の召集を含む、すべての教皇の決議に自動で賛成票を投じます。投票は月の変わり目に行われます。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
 setting_qol_papal_auto_vote_non_directed: "対象の絞られていない決議"
 setting_qol_papal_auto_vote_non_directed_desc: "破門と十字軍の召集（手動のまま）を除く、すべての教皇の決議に自動で賛成票を投じます。投票は月の変わり目に行われます。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
