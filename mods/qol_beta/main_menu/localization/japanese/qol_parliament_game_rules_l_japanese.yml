l_japanese:
 rule_qol_parliament_auto_pause_rule: "#E 議会の自動一時停止:#! 会期終了"
 setting_qol_parliament_auto_pause_off: "無効"
 setting_qol_parliament_auto_pause_off_desc: "議会の会期が終わってもゲームを一時停止しません。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
 setting_qol_parliament_auto_pause_always: "常に一時停止"
 setting_qol_parliament_auto_pause_always_desc: "議案が通るかどうかに関係なく、会期終了の1日前にゲームを一時停止します。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
 setting_qol_parliament_auto_pause_if_fail: "否決されそうな場合のみ"
 setting_qol_parliament_auto_pause_if_fail_desc: "支持率が50%未満で議案が否決されそうな場合のみ、会期終了の1日前にゲームを一時停止します。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
 rule_qol_parliament_availability_rule: "#E 議会の自動一時停止:#! 招集の通知"
 setting_qol_parliament_availability_enabled: "有効"
 setting_qol_parliament_availability_enabled_desc: "新しい議会の会期を招集できるようになったときにイベントを表示し（ゲームを一時停止し）ます。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
 setting_qol_parliament_availability_disabled: "無効"
 setting_qol_parliament_availability_disabled_desc: "新しい議会の会期を招集できるようになっても通知を表示しません。注：Community Mod Framework (CMF)を導入している場合、このオプションはそのメニューから操作されます。"
