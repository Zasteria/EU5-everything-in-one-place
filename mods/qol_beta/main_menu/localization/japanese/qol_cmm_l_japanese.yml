 qol__cd_watchlist_hre_i7_desc: "10年のクールダウン。皇帝でもクライス長でもない神聖ローマ帝国の構成国のみ利用可能。それ以外の場合は監視トグルが無効になります。"
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! 局面"
 qol__cooldowns__cd_watchlist_situational_desc: "状況が進行中のみ存在するクールダウン付きアクション（現在はイタリア戦争）。チェックすると、そのクールダウンが終了したときに通知されます。"
