 qol__auto_vote_excommunicate_resolution_desc: "対象国の君主を破門します。破門が解かれるまで続きます。"
 qol__auto_vote_call_crusade_desc: "対象国に対して十字軍を召集します。対象との戦争が終わるまで続きます。10年ごとに再度召集できます。"
 qol__auto_vote_western_schism_resolution_desc: "教皇と対立教皇の間の西方教会大分裂を解決する投票を行います。大分裂が解決されるまで続きます。"
