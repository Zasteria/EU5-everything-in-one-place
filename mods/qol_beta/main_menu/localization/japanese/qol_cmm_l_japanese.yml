 qol__cd_watchlist_general_i5_name: "宮廷言語の変更を強制"
 qol__cd_watchlist_general_i5_desc: "10年のクールダウン。すべての国で利用可能。"
 qol__cd_watchlist_general_i6_name: "資金拠出の要求"
 qol__cd_watchlist_general_i6_desc: "1年のクールダウン。軍事教団が自国を支援している戦争中のみ利用可能。それ以外の場合は監視トグルが無効になります。"
 qol__cd_watchlist_general_i7_name: "同君上位の奪取"
 qol__cd_watchlist_general_i7_desc: "25年のクールダウン。先行が確立され、自国が上位の相手でない同君連合でのみ利用可能。それ以外の場合は監視トグルが無効になります。"
 qol__cooldowns__cd_watchlist_hre_name: "@hre! 神聖ローマ帝国"
 qol__cooldowns__cd_watchlist_hre_desc: "神聖ローマ帝国のクールダウン付きアクション（帝国クライスと選挙支援）。チェックすると、そのクールダウンが終了したときに通知されます。"
 qol__cd_watchlist_hre_name: "@hre! 神聖ローマ帝国"
