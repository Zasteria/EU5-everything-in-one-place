 qol__fort_build_forbidden_i3_desc: "都市の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i4_name: "@megalopolis! 大都市"
 qol__fort_build_forbidden_i4_desc: "大都市の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i5_name: "@city_capital! 自国の首都"
 qol__fort_build_forbidden_i5_desc: "自国の首都。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i6_name: "@ship! 沿岸"
 qol__fort_build_forbidden_i6_desc: "沿岸の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i7_name: "@province! 州都"
 qol__fort_build_forbidden_i7_desc: "州都の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i8_name: "@mapmode! すべての場所"
 qol__fort_build_forbidden_i8_desc: "すべての場所：自動化はいかなる要塞も建設しません。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i9_name: "@location! 州都以外"
 qol__fort_build_forbidden_i9_desc: "州都ではない場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i10_name: "@inland! 内陸"
 qol__fort_build_forbidden_i10_desc: "沿岸ではない内陸の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__papal_bulls_name: "@rite_power! 教皇勅書"
 qol__papal_bulls__auto_vote_name: "@catholic_church! 自動投票"
 qol__papal_bulls__auto_vote_desc: "自国がどの教皇勅書に自動的に投票するか、その方法を設定します。"
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! 西方教会大分裂"
 qol__papal_bulls__auto_vote_schism_desc: "西方教会大分裂の決議で自国が自動的に投票する側：ローマ支持、ローマ反対、または無効。"
 qol__auto_vote_name: "@religion! 教皇勅書の自動投票"
 qol__auto_vote_desc: "教皇勅書ごとに自動投票するかどうかを選択します：賛成、反対、または無効。投票は月の変わり目に行われます。注：Community Mod Framework (CMF)を導入している場合、この設定は対応するゲームルールより優先されます。"
 qol__auto_vote_item_column_name: "勅書"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33%、10年間持続します。"
