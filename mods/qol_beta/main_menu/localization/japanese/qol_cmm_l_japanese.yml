 qol__fort_cleanup_scope_name: "@country! 影響を受ける国"
 qol__fort_cleanup_scope_desc: "要塞整理の影響を受ける国：自国のみ、自国とその従属国（属国と下位パートナー）、従属国のみ、または全世界。"
 qol__fort_cleanup_scope_option_1_name: "@country! 自国のみ"
