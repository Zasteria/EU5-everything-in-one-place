 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1、10年間持続します。"
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2、10年間持続します。"
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2、10年間持続します。"
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05、10年間持続します。"
