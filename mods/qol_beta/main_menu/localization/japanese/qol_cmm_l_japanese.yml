 qol__cd_watchlist_hre_item_column_name: "アクション"
 qol__cd_watchlist_hre__enabled_name: "監視"
 qol__cd_watchlist_hre_i1_name: "選挙での支持を要求する"
 qol__cd_watchlist_hre_i1_desc: "2年のクールダウン。選帝侯に候補者への投票を要請も対象となります。両者は1つのクールダウンを共有します。神聖ローマ帝国の構成国のみ利用可能。それ以外の場合は監視トグルが無効になります。"
 qol__cd_watchlist_hre_i2_name: "帝国議会への請願"
