 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! 星形要塞"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! 要塞"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! 市壁"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! 沿岸要塞"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! 海軍砲台"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! 要塞の建設禁止"
 qol__qol__fort_build_forbidden_desc: "自動化が要塞を建設してはならない場所の種類を選択します。「建造物」または「建造物の自動拡張」の自動化が有効な場合、禁止された場所の種類では手動建設もブロックされます。両方無効にすると、どこでも自由に建設できます。"
 qol__qol__fort_cleanup_name: "@arrow_down! 要塞の取り壊し"
 qol__qol__fort_cleanup_desc: "取り壊す要塞の種類、場所の種類、対象国を選択します。"
 qol__fort_build_forbidden_name: "@warning_icon! 要塞の建設禁止"
 qol__fort_build_forbidden_desc: "自動化が要塞を建設してはならない場所の種類：農村集落、町、都市、大都市、自国の首都、沿岸、州都、またはすべて。通常の動作にするにはすべてのチェックを外してください。注：Community Mod Framework (CMF)を導入している場合、この設定は対応するゲームルールより優先されます。"
 qol__fort_build_forbidden_item_column_name: "場所の種類"
 qol__fort_build_forbidden__enabled_name: "禁止"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! 農村集落"
 qol__fort_build_forbidden_i1_desc: "農村集落の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
 qol__fort_build_forbidden_i2_name: "@town! 町"
 qol__fort_build_forbidden_i2_desc: "町の場所。「建造物」または「建造物の自動拡張」の自動化が有効な場合、手動建設もブロックされます。"
