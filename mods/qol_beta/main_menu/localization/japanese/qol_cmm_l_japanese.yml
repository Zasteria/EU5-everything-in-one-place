l_japanese:
 qol_name: "@hint! 生活の質 QoL"
 qol_desc: "生活の質の改善：自動化が要塞を建設できる場所の種類を選択でき、不要な要塞はいつでも取り壊せ、ズームアウトしても進捗リングは表示されたままになり、マップの国境線はより太く、より見やすくなります。「建造物」または「建造物の自動拡張」の自動化が有効な場合、禁止された場所の種類では手動建設もブロックされます。"
 qol__qol_name: "@fortress! 要塞"
