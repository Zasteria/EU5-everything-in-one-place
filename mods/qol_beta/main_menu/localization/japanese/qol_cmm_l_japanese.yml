 qol__parliament_name: "@parliament! 議会"
 qol__parliament__auto_pause_name: "@time! 議会がまもなく終了"
 qol__parliament__reminder_name: "@hint! 議会招集可能"
 qol__parliament_auto_pause_name: "@time! 自動一時停止"
 qol__parliament_auto_pause_desc: "議会の会期が終わりに近づいたときにゲームを一時停止するタイミング：なし、常に、または議案が否決されそうな場合のみ。注：Community Mod Framework (CMF)を導入している場合、この設定は対応するゲームルールより優先されます。"
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! 無効"
 qol__parliament_auto_pause_option_2_name: "@time! 常に一時停止"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! 否決されそうな場合のみ"
 qol__parliament_availability_reminder_name: "@hint! 招集の通知"
 qol__parliament_availability_reminder_desc: "新しい議会の会期を招集できるようになったときにイベントを表示し（ゲームを一時停止し）ます。注：Community Mod Framework (CMF)を導入している場合、この設定は対応するゲームルールより優先されます。"
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! 有効"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! 無効"
 qol__education_name: "@literacy! 教育"
 qol__education__auto_ce_name: "@heir! 自動教育"
 qol__education__auto_ce_desc: "毎月、対象となるすべての子供に、最も高い才能に合った教育が自動的に割り当てられます。注：Community Mod Framework (CMF)を導入している場合、これらの設定は対応するゲームルールより優先されます。"
 qol__auto_ce_educate_heirs_name: "@heir! 継承者を教育"
 qol__auto_ce_educate_heirs_desc: "毎月、継承者に自動的に教育が割り当てられます。オフにすると教育を手動で選べます。"
 qol__auto_ce_educate_crown_name: "@crown_estate! 王室領の子供を教育"
 qol__auto_ce_educate_crown_desc: "毎月、王室領の子供に自動的に教育が割り当てられます。"
 qol__auto_ce_educate_prodigy_name: "@characters! 神童を教育"
 qol__auto_ce_educate_prodigy_desc: "毎月、神童や才能のある子供に自動的に教育が割り当てられます。どの教育でも高い値に達します。"
 qol__auto_ce_expensive_scope_name: "@gold! 高額な教育"
 qol__auto_ce_expensive_scope_desc: "継承者および/または王室領の子供に高額な深い教育を自動的に割り当てます。"
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! 無効"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! 継承者のみ"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! 継承者と王室"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! すべての子供"
 qol__auto_ce_run_now_name: "@literacy! 今すぐ再評価"
 qol__auto_ce_run_now_desc: "すでに処理済みの子供も含め、対象となるすべての子供をすぐに再処理します。割り当て済みの高額な教育は変更しません。"
 qol__auto_ce_run_now_text: "@literacy! 再評価"
 qol__cooldowns_name: "@time! クールダウン"
 qol__cooldowns__alerts_name: "@warning_icon! 通知"
 qol__cooldowns__alerts_desc: "監視しているクールダウンが終了したことをCalidad de vida EU5が知らせる方法。監視対象のクールダウン付きアクションが再び利用可能になると、上部バーに通知が表示されます。"
 qol__cd_enable_alerts_name: "@warning_icon! クールダウン通知を有効化"
 qol__cd_enable_alerts_desc: "監視しているクールダウンが再び利用可能になるとCMF通知を表示します。すべてのクールダウン通知を止めるにはオフにしてください。"
 qol__cab_enable_alerts_name: "@cabinet_action! 内閣行動の通知を有効化"
 qol__cab_enable_alerts_desc: "国家の安定化または政府の強化の内閣行動が最大値に達するとCMF通知を表示します。行動は最大値での維持コストを下げるため意図的に継続されます - 通知は手動で取り消せることを知らせるだけです。この通知を止めるにはオフにしてください。"
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! 騎士団のクールダウンを監視"
 qol__cd_watch_order_of_chivalry_desc: "自国の10年間の騎士団クールダウンが終了すると通知します。外国の騎士団に入団と騎士団に勧誘で共有されるため、どちらを使っても開始されます。既定ではオン。"
 qol__cooldowns__cd_watchlist_general_name: "@country! 一般"
 qol__cooldowns__cd_watchlist_general_desc: "どの国でも使用できるクールダウン付きアクション（宗教や関係の要件がある場合は除く）。チェックすると、そのクールダウンが終了したときに通知されます。"
 qol__cd_watchlist_general_name: "@country! 一般"
 qol__cd_watchlist_general_desc: "再び利用可能になったときに通知を表示する一般的なクールダウン付きアクション。"
 qol__cd_watchlist_general_item_column_name: "アクション"
 qol__cd_watchlist_general__enabled_name: "監視"
 qol__cd_watchlist_general_i1_name: "離婚の要請"
 qol__cd_watchlist_general_i1_desc: "10年のクールダウン。カトリックの国のみ利用可能。それ以外の場合は監視トグルが無効になります。"
 qol__cd_watchlist_general_i2_name: "文化の強制"
