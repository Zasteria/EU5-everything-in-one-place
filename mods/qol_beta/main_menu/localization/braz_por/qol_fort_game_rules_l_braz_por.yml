l_braz_por:
 rule_qol_fort_build_forbidden_rule: "#E Localizações proibidas para fortalezas:#! Quando a automação de Edificações ou de Expansão Automática de Edificações está ativa"
 setting_qol_fort_build_forbidden_off: "Desativado (vanilla)"
 setting_qol_fort_build_forbidden_off_desc: "A automação pode construir fortificações em qualquer lugar, como no jogo base. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_fort_build_forbidden_rural: "Sem assentamentos rurais"
 setting_qol_fort_build_forbidden_rural_desc: "A automação não pode construir fortificações em assentamentos rurais. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, um tipo de localização proibido também bloqueia a construção manual. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_fort_build_forbidden_town: "Nada em vilas ou inferior"
 setting_qol_fort_build_forbidden_town_desc: "A automação não pode construir fortificações em vilas ou em escalões inferiores. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, um tipo de localização proibido também bloqueia a construção manual. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_fort_build_forbidden_city: "Nada em cidades ou inferior"
 setting_qol_fort_build_forbidden_city_desc: "A automação não pode construir fortificações em cidades ou em escalões inferiores. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, um tipo de localização proibido também bloqueia a construção manual. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_fort_build_forbidden_all: "Nenhuma fortificação"
 setting_qol_fort_build_forbidden_all_desc: "A automação não pode construir nenhuma fortificação em lugar nenhum: todos os tipos e escalões de localização ficam proibidos, incluindo megalópoles. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, um tipo de localização proibido também bloqueia a construção manual. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
