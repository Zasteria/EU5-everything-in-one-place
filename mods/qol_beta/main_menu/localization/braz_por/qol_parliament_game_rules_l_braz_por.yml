l_braz_por:
 rule_qol_parliament_auto_pause_rule: "#E Pausa automática do Parlamento:#! Fim da sessão"
 setting_qol_parliament_auto_pause_off: "Desativado"
 setting_qol_parliament_auto_pause_off_desc: "Não pausa o jogo quando uma sessão do Parlamento termina. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_parliament_auto_pause_always: "Pausar sempre"
 setting_qol_parliament_auto_pause_always_desc: "Pausa o jogo 1 dia antes do fim da sessão, independentemente de a questão ser aprovada. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_parliament_auto_pause_if_fail: "Somente se for falhar"
 setting_qol_parliament_auto_pause_if_fail_desc: "Pausa o jogo 1 dia antes do fim da sessão somente se o apoio estiver abaixo de 50% e a questão estiver prestes a falhar. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 rule_qol_parliament_availability_rule: "#E Pausa automática do Parlamento:#! Lembrete de convocação"
 setting_qol_parliament_availability_enabled: "Ativado"
 setting_qol_parliament_availability_enabled_desc: "Mostra um evento (e pausa o jogo) quando uma nova sessão do Parlamento puder ser convocada. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
 setting_qol_parliament_availability_disabled: "Desativado"
 setting_qol_parliament_availability_disabled_desc: "Não mostra nenhum lembrete quando uma nova sessão do Parlamento puder ser convocada. Nota: se você tiver Community Mod Framework (CMF) instalado, esta opção é controlada pelo menu dele."
