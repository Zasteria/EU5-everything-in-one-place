l_korean:
 rule_qol_fort_build_forbidden_rule: "#E 요새 금지 위치:#! "건물" 또는 "건물 자동 확장" 자동화가 켜져 있을 때"
 setting_qol_fort_build_forbidden_off: "꺼짐(바닐라)"
 setting_qol_fort_build_forbidden_off_desc: "자동화는 기본 게임처럼 어디든 요새를 지을 수 있습니다. 참고: Community Mod Framework(CMF)를 설치했다면 이 옵션은 해당 메뉴에서 제어합니다."
 setting_qol_fort_build_forbidden_rural: "농촌 정착지 없음"
 setting_qol_fort_build_forbidden_rural_desc: "자동화는 농촌 정착지에 요새를 지을 수 없습니다. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 금지된 지역 유형에서는 수동 건설도 차단됩니다. 참고: Community Mod Framework(CMF)를 설치했다면 이 옵션은 해당 메뉴에서 제어합니다."
 setting_qol_fort_build_forbidden_town: "소읍 이하 없음"
 setting_qol_fort_build_forbidden_town_desc: "자동화는 소읍 이하 단계에 요새를 지을 수 없습니다. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 금지된 지역 유형에서는 수동 건설도 차단됩니다. 참고: Community Mod Framework(CMF)를 설치했다면 이 옵션은 해당 메뉴에서 제어합니다."
 setting_qol_fort_build_forbidden_city: "도시 이하 없음"
 setting_qol_fort_build_forbidden_city_desc: "자동화는 도시 이하 단계에 요새를 지을 수 없습니다. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 금지된 지역 유형에서는 수동 건설도 차단됩니다. 참고: Community Mod Framework(CMF)를 설치했다면 이 옵션은 해당 메뉴에서 제어합니다."
 setting_qol_fort_build_forbidden_all: "요새 금지"
 setting_qol_fort_build_forbidden_all_desc: "자동화는 어디에도, 어떤 지역 유형이나 단계에서도 요새를 지을 수 없습니다(거대 도시 포함). "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 금지된 지역 유형에서는 수동 건설도 차단됩니다. 참고: Community Mod Framework(CMF)를 설치했다면 이 옵션은 해당 메뉴에서 제어합니다."
