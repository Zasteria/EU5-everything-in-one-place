l_russian:
 rule_qol_parliament_auto_pause_rule: "#E Автоматическая пауза парламента:#! Конец заседания"
 setting_qol_parliament_auto_pause_off: "Выключено"
 setting_qol_parliament_auto_pause_off_desc: "Не ставит игру на паузу, когда заседание парламента заканчивается. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_parliament_auto_pause_always: "Всегда"
 setting_qol_parliament_auto_pause_always_desc: "Ставит игру на паузу за 1 день до конца заседания, независимо от того, будет ли вопрос принят. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_parliament_auto_pause_if_fail: "Только при провале"
 setting_qol_parliament_auto_pause_if_fail_desc: "Ставит игру на паузу за 1 день до конца заседания, только если поддержка ниже 50% и вопрос провалится. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 rule_qol_parliament_availability_rule: "#E Автоматическая пауза парламента:#! Напоминание о созыве"
 setting_qol_parliament_availability_enabled: "Включено"
 setting_qol_parliament_availability_enabled_desc: "Показывает событие (и ставит игру на паузу), когда можно созвать новую сессию парламента. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
 setting_qol_parliament_availability_disabled: "Выключено"
 setting_qol_parliament_availability_disabled_desc: "Не показывает напоминаний, когда можно созвать новую сессию парламента. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
