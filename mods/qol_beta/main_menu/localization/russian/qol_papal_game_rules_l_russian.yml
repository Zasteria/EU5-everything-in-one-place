 setting_qol_papal_auto_vote_non_directed: "Ненаправленные резолюции"
 setting_qol_papal_auto_vote_non_directed_desc: "Голосует «за» по каждой активной папской резолюции, кроме отлучения от церкви и призыва к крестовому походу, которые остаются ручными. Голоса отдаются при смене месяца. Примечание: если установлен Community Mod Framework (CMF), эта опция управляется из его меню."
