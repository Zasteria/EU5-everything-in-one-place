l_turkish:
 rule_qol_fort_build_forbidden_rule: "#E Kalelerin yasak olduğu konumlar:#! "Yapılar" veya "Yapıları Otomatik Olarak Genişlet" otomasyonu açıkken"
 setting_qol_fort_build_forbidden_off: "Kapalı (vanilya)"
 setting_qol_fort_build_forbidden_off_desc: "Otomasyon, temel oyunda olduğu gibi her yerde tahkimat inşa edebilir. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_fort_build_forbidden_rural: "Kırsal yerleşim yok"
 setting_qol_fort_build_forbidden_rural_desc: "Otomasyon kırsal yerleşimlerde tahkimat inşa edemez. "Yapılar" veya "Yapıları Otomatik Olarak Genişlet" otomasyonu açıkken, yasaklı bir konum türü manuel inşayı da engeller. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_fort_build_forbidden_town: "Kasaba ve altı yasak"
 setting_qol_fort_build_forbidden_town_desc: "Otomasyon kasabalarda ve daha alt seviyelerde tahkimat inşa edemez. "Yapılar" veya "Yapıları Otomatik Olarak Genişlet" otomasyonu açıkken, yasaklı bir konum türü manuel inşayı da engeller. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_fort_build_forbidden_city: "Şehir ve altı yasak"
 setting_qol_fort_build_forbidden_city_desc: "Otomasyon şehirlerde ve daha alt seviyelerde tahkimat inşa edemez. "Yapılar" veya "Yapıları Otomatik Olarak Genişlet" otomasyonu açıkken, yasaklı bir konum türü manuel inşayı da engeller. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_fort_build_forbidden_all: "Hiçbir tahkimat yok"
 setting_qol_fort_build_forbidden_all_desc: "Otomasyon hiçbir yerde tahkimat inşa edemez: tüm konum türleri ve seviyeleri yasaktır, megakentler dahil. "Yapılar" veya "Yapıları Otomatik Olarak Genişlet" otomasyonu açıkken, yasaklı bir konum türü manuel inşayı da engeller. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
