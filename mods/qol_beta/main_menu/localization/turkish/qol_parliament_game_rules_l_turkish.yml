l_turkish:
 rule_qol_parliament_auto_pause_rule: "#E Parlamento Otomatik Duraklatma:#! Oturum sonu"
 setting_qol_parliament_auto_pause_off: "Devre dışı"
 setting_qol_parliament_auto_pause_off_desc: "Bir parlamento oturumu sona erdiğinde oyunu duraklatmaz. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_parliament_auto_pause_always: "Her zaman"
 setting_qol_parliament_auto_pause_always_desc: "Meselenin geçip geçmemesine bakılmaksızın oturumun bitiminden 1 gün önce oyunu duraklatır. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_parliament_auto_pause_if_fail: "Yalnızca başarısız olacaksa"
 setting_qol_parliament_auto_pause_if_fail_desc: "Yalnızca destek %50'nin altındaysa ve mesele başarısız olacaksa, oturumun bitiminden 1 gün önce oyunu duraklatır. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 rule_qol_parliament_availability_rule: "#E Parlamento Otomatik Duraklatma:#! Toplanma hatırlatması"
 setting_qol_parliament_availability_enabled: "Etkin"
 setting_qol_parliament_availability_enabled_desc: "Yeni bir Parlamento oturumu toplanabileceğinde bir olay penceresi gösterir (ve oyunu duraklatır). Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
 setting_qol_parliament_availability_disabled: "Devre dışı"
 setting_qol_parliament_availability_disabled_desc: "Yeni bir Parlamento oturumu toplanabileceğinde hiçbir hatırlatma göstermez. Not: Community Mod Framework (CMF) kuruluysa bu seçenek onun menüsünden kontrol edilir."
