 qol__cooldowns__alerts_name: "@warning_icon! Uyarılar"
 qol__cooldowns__alerts_desc: "Calidad de vida EU5'in, izlenen bir bekleme süresinin sona erdiğini size nasıl bildirdiği. İzlenen bekleme süreli bir eylem yeniden kullanılabilir olduğunda üst çubukta bir uyarı görüntülenir."
 qol__cd_enable_alerts_name: "@warning_icon! Bekleme süresi uyarılarını etkinleştir"
 qol__cd_enable_alerts_desc: "İzlenen bir bekleme süresi yeniden kullanılabilir olduğunda bir CMF uyarısı görüntüler. Tüm bekleme süresi uyarılarını sessize almak için kapatın."
 qol__cab_enable_alerts_name: "@cabinet_action! Kabine aksiyonu uyarılarını etkinleştir"
 qol__cab_enable_alerts_desc: "Ülkede İstikrarı Sağla veya Hükûmeti Güçlendir kabine aksiyonu maksimum değerine ulaştığında bir CMF uyarısı görüntüler. Aksiyon, maksimumda bakım maliyetini düşürmek için bilerek etkin kalır - uyarı yalnızca elle iptal edilebileceğini hatırlatır. Bu uyarıları sessize almak için kapatın."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Şövalye Tarikatı bekleme süresini izle"
 qol__cd_watch_order_of_chivalry_desc: "Ülkenizin 10 yıllık Şövalye Tarikatı bekleme süresi sona erdiğinde uyarır - Yabancı bir Şövalye Tarikatına katıl ve Şövalye Tarikatına davet et ile paylaşılır, bu yüzden bunlardan herhangi birini kullanmak onu başlatır. Varsayılan olarak açıktır."
