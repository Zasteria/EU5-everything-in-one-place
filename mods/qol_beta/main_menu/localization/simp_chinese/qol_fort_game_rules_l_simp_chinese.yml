l_simp_chinese:
 rule_qol_fort_build_forbidden_rule: "#E 禁止建造防御工事的地点:#! 当“建筑”或“自动扩建建筑”自动化启用时"
 setting_qol_fort_build_forbidden_off: "关闭（原版）"
 setting_qol_fort_build_forbidden_off_desc: "自动化可以像原版游戏一样在任何地点建造防御工事。注意：如果安装了 Community Mod Framework（CMF），此选项在其菜单中控制。"
 setting_qol_fort_build_forbidden_rural: "不含乡村聚落"
 setting_qol_fort_build_forbidden_rural_desc: "自动化不得在乡村聚落建造防御工事。启用“建筑”或“自动扩建建筑”自动化时，禁止的地点类型也会阻止手动建造。注意：如果安装了 Community Mod Framework（CMF），此选项在其菜单中控制。"
 setting_qol_fort_build_forbidden_town: "乡镇及以下不可建造"
 setting_qol_fort_build_forbidden_town_desc: "自动化不得在乡镇及更低等级的地点建造防御工事。启用“建筑”或“自动扩建建筑”自动化时，禁止的地点类型也会阻止手动建造。注意：如果安装了 Community Mod Framework（CMF），此选项在其菜单中控制。"
 setting_qol_fort_build_forbidden_city: "城市及以下不可建造"
 setting_qol_fort_build_forbidden_city_desc: "自动化不得在城市及更低等级的地点建造防御工事。启用“建筑”或“自动扩建建筑”自动化时，禁止的地点类型也会阻止手动建造。注意：如果安装了 Community Mod Framework（CMF），此选项在其菜单中控制。"
 setting_qol_fort_build_forbidden_all: "完全禁止防御工事"
 setting_qol_fort_build_forbidden_all_desc: "自动化不得在任何地点建造任何防御工事：所有地点类型和等级均被禁止，包括大都市。启用“建筑”或“自动扩建建筑”自动化时，禁止的地点类型也会阻止手动建造。注意：如果安装了 Community Mod Framework（CMF），此选项在其菜单中控制。"
