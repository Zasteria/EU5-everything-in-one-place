l_english:
 rule_qol_parliament_auto_pause_rule: "#E Parliament Auto Pause:#! Session ending"
 setting_qol_parliament_auto_pause_off: "Disabled"
 setting_qol_parliament_auto_pause_off_desc: "Does not pause the game when a parliament session ends. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_parliament_auto_pause_always: "Pause always"
 setting_qol_parliament_auto_pause_always_desc: "Pauses the game 1 day before the session ends, regardless of whether the issue will pass. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_parliament_auto_pause_if_fail: "Only if it will fail"
 setting_qol_parliament_auto_pause_if_fail_desc: "Pauses the game 1 day before the session ends only if support is below 50% and the issue is about to fail. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 rule_qol_parliament_availability_rule: "#E Parliament Auto Pause:#! Call reminder"
 setting_qol_parliament_availability_enabled: "Enabled"
 setting_qol_parliament_availability_enabled_desc: "Shows a popup (and pauses the game) when a new parliament session can be called. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_parliament_availability_disabled: "Disabled"
 setting_qol_parliament_availability_disabled_desc: "Does not show any reminder when a new parliament session can be called. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
