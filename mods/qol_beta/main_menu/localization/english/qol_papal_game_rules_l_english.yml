l_english:
 rule_qol_papal_auto_vote_rule: "#E Papal Bulls Auto-vote:#! Resolutions"
 setting_qol_papal_auto_vote_off: "Disabled"
 setting_qol_papal_auto_vote_off_desc: "Does not vote automatically on any papal resolution. Votes are cast when the month changes. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_papal_auto_vote_all: "All resolutions"
 setting_qol_papal_auto_vote_all_desc: "Votes yes on every active papal resolution, including excommunication and the call for crusade. Votes are cast when the month changes. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_papal_auto_vote_non_directed: "Non-directed resolutions"
 setting_qol_papal_auto_vote_non_directed_desc: "Votes yes on every active papal resolution except excommunication and the call for crusade, which stay manual. Votes are cast when the month changes. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
