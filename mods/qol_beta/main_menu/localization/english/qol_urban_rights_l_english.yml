l_english:

 # READ BEFORE ADDING OR EDITING ANY STRING BELOW.
 #
 # A concept link prints the concept's NAME, and several of the names this mod uses are PLURAL. An
 # alias changes only the key you type, never the text shown, so the sentence has to be built around
 # the plural rather than fight it. This has now been got wrong twice, most recently as
 # "grant another [town_rights|E] there", which rendered as "grant another Urban Rights there".
 #
 #   [town_rights|E]        -> "Urban Rights"       PLURAL, and there is no singular form
 #   [locations|E]          -> "Locations"          PLURAL
 #   [location|E]           -> "Location"           singular
 #   [production_method|E]  -> "Production Method"  singular
 #   [raw_material|E]       -> "Raw Good"           singular  (NOT "Raw Material" -- that is a
 #                                                  different vanilla key of the same name)
 #
 # Phrasings that work with a plural: "any X", "more X", "these X", "X are". Vanilla solves it the
 # same way in MAPMODE_TOWN_RIGHTS: "if they have any [town_rights|e] or not".
 #
 # WRITE COMPLETE SENTENCES. A headless fragment gives the translator nothing to anchor on, and this
 # has failed every time it was tried. Fragments have come back as prize money, as a quoted section
 # title, and as a polite request in Japanese.

 # The title names the good only. It used to read "<Good> in <Location>", which forced the bare word
 # "in" through the translator with no context -- and many languages inflect a preposition by the
 # case or gender of the noun that follows, which here is a proper place name the translator cannot
 # even see. The location moved to its own key/value row instead, so nothing here needs translating.
 urqol_marker_title: "[Location.GetRawMaterial.GetName]"
 urqol_marker_location: "[location|E]"

 # Both row labels are concept links, which is EU5's affordance for "there is more here" -- the term
 # renders highlighted and hoverable. The share row links a concept this mod registers
 # (common/game_concepts/urqol_concepts.txt) rather than the game's production_method: linking that
 # one showed the game's explanation of production methods, which answers a different question than
 # "share of what?".
 #
 # "Goods" and "Province" here are literal English, not links, so the DeepL glossary pins them to
 # Paradox's own terms. "in" is lowercase to match vanilla's own label style -- compare the modifier
 # name "Local Access to Raw Materials", which lowercases its preposition.
 #
 # This row is labelled with the GAME'S OWN NAME for the modifier it reports, referenced by key so
 # every language gets Paradox's official wording and nothing is machine-translated at all:
 #   en "Local Access to Raw Materials"   de "Lokalzugriff auf Rohstoffe"
 #   fr "Accès local aux Matières premières"   tr "Ham Maddeye Yerel Erişim"
 #
 # Hand-written English was tried twice and failed both times, because a headless fragment gives a
 # translator nothing to anchor on. "…Bonus due to Goods in Province" became a gratuity or prize
 # MONEY in Turkish and Chinese; rewording to "…from Goods in Province" fixed that but German and
 # Turkish then quoted it as if citing a section title, and French dropped "Goods" outright,
 # leaving "coming from the Province". Referencing the modifier's own key sidesteps all of it, and
 # is more correct anyway: this row IS that modifier's value, so it should carry that modifier's name.
 urqol_marker_share: "[urqol_input_share|E]"
 urqol_marker_bonus: "$MODIFIER_TYPE_NAME_raw_material_in_province_impact$"

 # "Input Goods" rather than "Inputs": German dropped a bare "Inputs" altogether, leaving "Anteil der
 # Produktionsmethoden" -- share of the production methods, which is not what the number means.
 # "Goods" is a glossary-pinned term, so it survives; it is also vanilla's own phrasing, as in
 # ALERT_BUILDINGS_MISSING_INPUT_TEXT ("are missing input goods in the following markets").
 # Map mode. The engine looks up exactly these two keys, named after the mode key: the menu label as
 # mapmode_<key>_name, and the description as MAPMODE_<KEY> uppercased. A missing key is not an
 # error -- the game auto-generates a readable label from the key and logs it -- so a typo here
 # degrades quietly rather than breaking the menu.
 #
 # "Available" is doing real work in this name. Vanilla ships its own "Urban Rights" map mode
 # (mapmode_town_rights_name) that colors locations by whether they hold any rights at all. Ours sits
 # in the same menu and must not read as a duplicate of it.
 #
 # The description is a COMPLETE SENTENCE on purpose, and copies the shape of vanilla's own
 # MAPMODE_TOWN_RIGHTS rather than using the shared $mapmode_common_start$ opener. That opener leaves
 # the translator a headless fragment, which is the failure recorded at the top of this file:
 # Japanese turned the clause into a polite request, and German and French wrapped the concept link
 # in quotation marks. A whole clause gives the translator something to anchor on.
 #
 # "can hold more" rather than "you could grant another", because [town_rights|E] prints the PLURAL
 # "Urban Rights" -- see the warning at the top of this file. "more Urban Rights" reads; "another
 # Urban Rights" does not.
 #
 # The claim is a free SLOT, not a worthwhile right. Script cannot tell whether any right actually
 # qualifies for a location, so the wording must never promise that. "can hold more" says capacity
 # and nothing about value.
 # Map mode legend and per-location hover text. Every one is a complete sentence built around the
 # PLURAL "Urban Rights" -- see the warning at the top of this file.
 #
 # The game's own name for this capacity is "Possible Urban Rights"
 # (MODIFIER_TYPE_NAME_local_possible_town_rights, described as "how many Urban Rights a Location can
 # have"). The sentences below deliberately say the same thing in plain words rather than quoting
 # that key, because "has reached its Possible Urban Rights" does not read as English.
 #
 # These claim CAPACITY and never value. Script cannot enumerate rights or read their conditions, so
 # it cannot know whether a right worth taking exists for a location. "can hold more" is true either
 # way. No separate disclaimer sentence is added: a hover that always ended with a caveat would be
 # noise, and wording that never overpromises carries the limit on its own.
 #
 # PLAIN WORDS, NOT CONCEPT LINKS, and that is deliberate. A concept link is opaque to the
 # translator, so a short sentence built from two of them gives it nothing to work with. Written as
 # "This [location|E] can hold more [town_rights|E]." the German came back as "Unter diesem Link
 # [location|E] finden Sie weitere Informationen [town_rights|E]" -- "under this link Location you
 # will find more information Urban Rights". Pure invention. The same pass also wrapped links in
 # quotation marks and appended stray plural letters outside them.
 # Both nouns are glossary-pinned to vanilla's own terms (Urban Rights -> Stadtrechte,
 # Location -> Ort), so plain words are MORE reliably correct than links here, not less: the
 # translator gets real nouns and the glossary still guarantees Paradox's wording.
 # Concept links stay in the mode description, which is a panel where the affordance earns its
 # place. A hover tooltip does not need a link inside it.
 URQOL_LEGEND_NONE_GRANTED: "No Urban Rights yet"
 URQOL_LEGEND_ROOM_LEFT: "Room for more Urban Rights"
 URQOL_MAPMODE_TT_NONE_GRANTED: "This Location can hold Urban Rights, and none have been granted."
 URQOL_MAPMODE_TT_ROOM_LEFT: "This Location can hold more Urban Rights."
 URQOL_MAPMODE_TT_FULL: "This Location already holds as many Urban Rights as it can."
 URQOL_MAPMODE_TT_CANNOT_HOLD: "This Location cannot hold Urban Rights."

 mapmode_urqol_urban_rights_available_name: "Urban Rights Available"
 MAPMODE_URQOL_URBAN_RIGHTS_AVAILABLE: "#T $mapmode_urqol_urban_rights_available_name$#!\nThis colors [locations|E] depending on whether they can hold more [town_rights|E]."

 game_concept_urqol_input_share: "Share of Production Method Input Goods"
 # "...goods that these [town_rights|E] boost", not "the goods this [town_rights|E] boosts". The
 # concept link always prints the concept's NAME, which is the plural "Urban Rights" -- an alias
 # would only change the key you type, not the text shown, and town_rights has no alias anyway. So
 # the sentence has to be built around a plural term rather than fight it.
 game_concept_urqol_input_share_desc: "The portion of a [production_method|E] input requirement supplied by this [raw_material|E].\n\nOnly production methods making goods that these [town_rights|E] boost are counted. Where several qualify, the best is shown."
