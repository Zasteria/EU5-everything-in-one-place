l_english:
 rule_qol_fort_build_forbidden_rule: "#E Forbidden fort locations:#! When the Buildings or Auto-Expand Buildings automation is on"
 setting_qol_fort_build_forbidden_off: "Off (vanilla)"
 setting_qol_fort_build_forbidden_off_desc: "The automation may build fortifications anywhere, as in the base game. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_fort_build_forbidden_rural: "No rural settlements"
 setting_qol_fort_build_forbidden_rural_desc: "The automation may not build fortifications in rural settlements. With the Buildings or Auto-Expand Buildings automation on, a forbidden location type also blocks manual builds. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_fort_build_forbidden_town: "No towns and below"
 setting_qol_fort_build_forbidden_town_desc: "The automation may not build fortifications in towns or rural settlements. With the Buildings or Auto-Expand Buildings automation on, a forbidden location type also blocks manual builds. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_fort_build_forbidden_city: "No cities and below"
 setting_qol_fort_build_forbidden_city_desc: "The automation may not build fortifications in cities, towns or rural settlements. With the Buildings or Auto-Expand Buildings automation on, a forbidden location type also blocks manual builds. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
 setting_qol_fort_build_forbidden_all: "No fortifications at all"
 setting_qol_fort_build_forbidden_all_desc: "The automation may not build any fortification anywhere: every location type and rank is forbidden, including metropolises. With the Buildings or Auto-Expand Buildings automation on, a forbidden location type also blocks manual builds. Note: if Community Mod Framework (CMF) is installed, this option is controlled from its menu."
