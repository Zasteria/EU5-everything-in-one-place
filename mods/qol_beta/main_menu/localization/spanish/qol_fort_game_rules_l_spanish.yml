l_spanish:
 rule_qol_fort_build_forbidden_rule: "#E Ubicaciones prohibidas para fortalezas:#! Cuando está activa la automatización de Edificios o de Ampliar edificios automáticamente"
 setting_qol_fort_build_forbidden_off: "Desactivado (vanilla)"
 setting_qol_fort_build_forbidden_off_desc: "La automatización puede construir fortificaciones en cualquier lugar, como en el juego base. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_fort_build_forbidden_rural: "Sin asentamientos rurales"
 setting_qol_fort_build_forbidden_rural_desc: "La automatización no puede construir fortificaciones en asentamientos rurales. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, un tipo de ubicación prohibido también bloquea la construcción manual. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_fort_build_forbidden_town: "Nada en pueblos o inferior"
 setting_qol_fort_build_forbidden_town_desc: "La automatización no puede construir fortificaciones en pueblos ni en rangos inferiores. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, un tipo de ubicación prohibido también bloquea la construcción manual. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_fort_build_forbidden_city: "Nada en ciudades o inferior"
 setting_qol_fort_build_forbidden_city_desc: "La automatización no puede construir fortificaciones en ciudades ni en rangos inferiores. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, un tipo de ubicación prohibido también bloquea la construcción manual. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_fort_build_forbidden_all: "Ninguna fortificación"
 setting_qol_fort_build_forbidden_all_desc: "La automatización no puede construir ninguna fortificación en ningún lugar: todos los tipos y rangos de ubicación quedan prohibidos, incluidas las megalópolis. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, un tipo de ubicación prohibido también bloquea la construcción manual. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
