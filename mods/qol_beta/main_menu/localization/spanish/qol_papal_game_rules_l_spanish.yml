l_spanish:
 rule_qol_papal_auto_vote_rule: "#E Voto automático en bulas papales:#! Resoluciones"
 setting_qol_papal_auto_vote_off: "Desactivado"
 setting_qol_papal_auto_vote_off_desc: "No vota automáticamente en ninguna resolución papal. Los votos se emiten al cambiar el mes. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_papal_auto_vote_all: "Todas las resoluciones"
 setting_qol_papal_auto_vote_all_desc: "Vota a favor en todas las resoluciones papales activas, incluida la excomunión y el llamamiento a la cruzada. Los votos se emiten al cambiar el mes. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_papal_auto_vote_non_directed: "Resoluciones no dirigidas"
 setting_qol_papal_auto_vote_non_directed_desc: "Vota a favor en todas las resoluciones papales activas excepto la excomunión y el llamamiento a la cruzada, que siguen siendo manuales. Los votos se emiten al cambiar el mes. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
