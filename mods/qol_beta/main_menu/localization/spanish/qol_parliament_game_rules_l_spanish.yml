l_spanish:
 rule_qol_parliament_auto_pause_rule: "#E Pausa automática del Parlamento:#! Fin de sesión"
 setting_qol_parliament_auto_pause_off: "Desactivado"
 setting_qol_parliament_auto_pause_off_desc: "No pausa el juego al terminar una sesión parlamentaria. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_parliament_auto_pause_always: "Pausar siempre"
 setting_qol_parliament_auto_pause_always_desc: "Pausa el juego 1 día antes de que termine la sesión, sin importar si la cuestión va a salir adelante. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_parliament_auto_pause_if_fail: "Solo si va a fracasar"
 setting_qol_parliament_auto_pause_if_fail_desc: "Pausa el juego 1 día antes de que termine la sesión solo si el apoyo está por debajo del 50% y la cuestión está a punto de fracasar. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 rule_qol_parliament_availability_rule: "#E Pausa automática del Parlamento:#! Aviso de convocatoria"
 setting_qol_parliament_availability_enabled: "Activado"
 setting_qol_parliament_availability_enabled_desc: "Muestra un evento emergente (y pausa el juego) cuando se puede convocar una nueva sesión del Parlamento. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
 setting_qol_parliament_availability_disabled: "Desactivado"
 setting_qol_parliament_availability_disabled_desc: "No muestra ningún aviso cuando se puede convocar una nueva sesión del Parlamento. Nota: si tienes instalado Community Mod Framework (CMF), esta opción se controla desde su menú."
