l_polish:
 rule_qol_fort_build_forbidden_rule: "#E Zakazane lokalizacje fortyfikacji:#! Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona"
 setting_qol_fort_build_forbidden_off: "Wyłączone (vanilla)"
 setting_qol_fort_build_forbidden_off_desc: "Automatyzacja może budować fortyfikacje wszędzie, jak w podstawowej grze. Uwaga: jeśli zainstalowano Community Mod Framework (CMF), ta opcja jest sterowana z jego menu."
 setting_qol_fort_build_forbidden_rural: "Bez osad wiejskich"
 setting_qol_fort_build_forbidden_rural_desc: "Automatyzacja nie może budować fortyfikacji w osadach wiejskich. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, zakazany typ lokalizacji blokuje również budowę ręczną. Uwaga: jeśli zainstalowano Community Mod Framework (CMF), ta opcja jest sterowana z jego menu."
 setting_qol_fort_build_forbidden_town: "Nic w miasteczkach i niżej"
 setting_qol_fort_build_forbidden_town_desc: "Automatyzacja nie może budować fortyfikacji w miasteczkach ani niższych rangach. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, zakazany typ lokalizacji blokuje również budowę ręczną. Uwaga: jeśli zainstalowano Community Mod Framework (CMF), ta opcja jest sterowana z jego menu."
 setting_qol_fort_build_forbidden_city: "Nic w miastach i niżej"
 setting_qol_fort_build_forbidden_city_desc: "Automatyzacja nie może budować fortyfikacji w miastach ani niższych rangach. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, zakazany typ lokalizacji blokuje również budowę ręczną. Uwaga: jeśli zainstalowano Community Mod Framework (CMF), ta opcja jest sterowana z jego menu."
 setting_qol_fort_build_forbidden_all: "Żadnych fortyfikacji"
 setting_qol_fort_build_forbidden_all_desc: "Automatyzacja nie może budować żadnych fortyfikacji nigdzie: wszystkie typy i rangi lokalizacji są zakazane, w tym metropolie. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, zakazany typ lokalizacji blokuje również budowę ręczną. Uwaga: jeśli zainstalowano Community Mod Framework (CMF), ta opcja jest sterowana z jego menu."
