l_german:
 rule_qol_fort_build_forbidden_rule: "#E Verbotene Befestigungsorte:#! Wenn die Automatisierung für Gebäude oder „Gebäude auto-erweitern" aktiv ist"
 setting_qol_fort_build_forbidden_off: "Aus (Vanilla)"
 setting_qol_fort_build_forbidden_off_desc: "Die Automatisierung darf überall Befestigungen bauen, wie im Grundspiel. Hinweis: Wenn das Community Mod Framework (CMF) installiert ist, wird diese Option über dessen Menü gesteuert."
 setting_qol_fort_build_forbidden_rural: "Keine ländlichen Siedlungen"
 setting_qol_fort_build_forbidden_rural_desc: "Die Automatisierung darf in ländlichen Siedlungen keine Befestigungen bauen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" blockiert ein verbotener Ortstyp auch manuelle Bauvorhaben. Hinweis: Wenn das Community Mod Framework (CMF) installiert ist, wird diese Option über dessen Menü gesteuert."
 setting_qol_fort_build_forbidden_town: "Nichts in Kleinstädten oder darunter"
 setting_qol_fort_build_forbidden_town_desc: "Die Automatisierung darf in Kleinstädten und niedrigeren Stufen keine Befestigungen bauen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" blockiert ein verbotener Ortstyp auch manuelle Bauvorhaben. Hinweis: Wenn das Community Mod Framework (CMF) installiert ist, wird diese Option über dessen Menü gesteuert."
 setting_qol_fort_build_forbidden_city: "Nichts in Städten oder darunter"
 setting_qol_fort_build_forbidden_city_desc: "Die Automatisierung darf in Städten und niedrigeren Stufen keine Befestigungen bauen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" blockiert ein verbotener Ortstyp auch manuelle Bauvorhaben. Hinweis: Wenn das Community Mod Framework (CMF) installiert ist, wird diese Option über dessen Menü gesteuert."
 setting_qol_fort_build_forbidden_all: "Überhaupt keine Befestigungen"
 setting_qol_fort_build_forbidden_all_desc: "Die Automatisierung darf nirgendwo Befestigungen bauen: Alle Ortstypen und -stufen sind verboten, einschließlich Megalopolen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" blockiert ein verbotener Ortstyp auch manuelle Bauvorhaben. Hinweis: Wenn das Community Mod Framework (CMF) installiert ist, wird diese Option über dessen Menü gesteuert."
