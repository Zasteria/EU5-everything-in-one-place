l_german:
 rule_qol_parliament_auto_pause_rule: "#E Automatische Parlamentspause:#! Ende der Sitzung"
 setting_qol_parliament_auto_pause_off: "Deaktiviert"
 setting_qol_parliament_auto_pause_off_desc: "Pausiert das Spiel am Ende einer Parlamentssitzung nicht. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
 setting_qol_parliament_auto_pause_always: "Immer"
 setting_qol_parliament_auto_pause_always_desc: "Pausiert das Spiel 1 Tag vor dem Ende der Sitzung, unabhängig davon, ob die Angelegenheit angenommen wird. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
 setting_qol_parliament_auto_pause_if_fail: "Nur bei Scheitern"
 setting_qol_parliament_auto_pause_if_fail_desc: "Pausiert das Spiel 1 Tag vor dem Ende der Sitzung nur, wenn die Unterstützung unter 50 % liegt und die Angelegenheit scheitern wird. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
 rule_qol_parliament_availability_rule: "#E Automatische Parlamentspause:#! Einberufungserinnerung"
 setting_qol_parliament_availability_enabled: "Aktiviert"
 setting_qol_parliament_availability_enabled_desc: "Zeigt ein Ereignis-Popup (und pausiert das Spiel), wenn eine neue Sitzung des Parlaments einberufen werden kann. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
 setting_qol_parliament_availability_disabled: "Deaktiviert"
 setting_qol_parliament_availability_disabled_desc: "Zeigt keine Erinnerung, wenn eine neue Sitzung des Parlaments einberufen werden kann. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, wird diese Option über sein Menü gesteuert."
