l_french:
 rule_qol_papal_auto_vote_rule: "#E Vote automatique des bulles pontificales :#! Résolutions"
 setting_qol_papal_auto_vote_off: "Désactivé"
 setting_qol_papal_auto_vote_off_desc: "Ne vote automatiquement sur aucune résolution pontificale. Les votes sont émis au changement de mois. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
 setting_qol_papal_auto_vote_all: "Toutes les résolutions"
 setting_qol_papal_auto_vote_all_desc: "Vote pour sur chaque résolution pontificale active, y compris l'excommunication et l'appel à la croisade. Les votes sont émis au changement de mois. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
 setting_qol_papal_auto_vote_non_directed: "Résolutions non dirigées"
 setting_qol_papal_auto_vote_non_directed_desc: "Vote pour sur chaque résolution pontificale active, sauf l'excommunication et l'appel à la croisade, qui restent manuels. Les votes sont émis au changement de mois. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
