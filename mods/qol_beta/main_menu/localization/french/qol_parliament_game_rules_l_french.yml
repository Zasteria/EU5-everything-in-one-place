l_french:
 rule_qol_parliament_auto_pause_rule: "#E Pause automatique du Parlement :#! Fin de session"
 setting_qol_parliament_auto_pause_off: "Désactivé"
 setting_qol_parliament_auto_pause_off_desc: "Ne met pas le jeu en pause à la fin d'une session parlementaire. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
 setting_qol_parliament_auto_pause_always: "Toujours"
 setting_qol_parliament_auto_pause_always_desc: "Met le jeu en pause 1 jour avant la fin de la session, que la question soit adoptée ou non. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
 setting_qol_parliament_auto_pause_if_fail: "Seulement en cas d'échec"
 setting_qol_parliament_auto_pause_if_fail_desc: "Met le jeu en pause 1 jour avant la fin de la session uniquement si le soutien est inférieur à 50 % et que la question est sur le point d'échouer. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
 rule_qol_parliament_availability_rule: "#E Pause automatique du Parlement :#! Rappel de convocation"
 setting_qol_parliament_availability_enabled: "Activé"
 setting_qol_parliament_availability_enabled_desc: "Affiche un événement (et met le jeu en pause) lorsqu'une nouvelle session du Parlement peut être convoquée. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
 setting_qol_parliament_availability_disabled: "Désactivé"
 setting_qol_parliament_availability_disabled_desc: "N'affiche aucun rappel lorsqu'une nouvelle session du Parlement peut être convoquée. Remarque : si vous avez installé Community Mod Framework (CMF), cette option se contrôle depuis son menu."
