 rule_qol_ace_auto_educate_rule: "#E Éducation automatique:#! Activée"
 setting_qol_ace_auto_educate_off: "Désactivée"
 setting_qol_ace_auto_educate_off_desc: "Les enfants ne sont pas éduqués automatiquement. Remarque : si Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
 setting_qol_ace_auto_educate_enabled: "Activée"
 setting_qol_ace_auto_educate_enabled_desc: "Chaque mois, chaque enfant éligible reçoit automatiquement l'éducation correspondant le mieux à ses aptitudes. Remarque : si Community Mod Framework (CMF) est installé, cette option est contrôlée depuis son menu."
