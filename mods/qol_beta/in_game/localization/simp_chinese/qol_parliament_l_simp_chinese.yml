l_simp_chinese:
 qol_parliament.1.t: "议会会期最后一天"
 qol_parliament.1.d: "[parliament|e]将于明日进行最后一次会议。若想让正在审议的议题获得通过，我们必须现在前往议会，在为时已晚之前确保所需的支持。"
 qol_parliament.1.a: "前往[parliament|e]以确保支持"
 qol_parliament.1.b: "让会期顺其自然进行。"
 qol_parliament.3.t: "新的议会会期已可召集"
 qol_parliament.3.d: "距离上一次召集已过去数月，现在我们可以在[parliament|e]中召集我们的[estates|e]，以解决他们的[parliament_issues|e]、申请[casus_belli|e]或征收更多的[taxes|e]和[levies]。前往议会只会强化我们的政府。"
 qol_parliament.3.a: "召集[estates|e]召开新的会期"
 qol_parliament.3.b: "我们稍后再处理。"
