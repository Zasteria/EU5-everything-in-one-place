l_french:
 qol_parliament.1.t: "Dernier jour de la session parlementaire"
 qol_parliament.1.d: "Le [parliament|e] se réunira pour la dernière fois demain. Si nous voulons que la question en débat soit adoptée, nous devons nous rendre à la chambre maintenant et obtenir le soutien nécessaire avant qu'il ne soit trop tard."
 qol_parliament.1.a: "Me rendre au [parliament|e] pour obtenir le soutien"
 qol_parliament.1.b: "Laisser la session suivre son cours."
 qol_parliament.3.t: "Une nouvelle session parlementaire est possible"
 qol_parliament.3.d: "Des mois ont passé depuis la dernière convocation et nous pouvons désormais réunir nos [estates|e] au [parliament|e] pour régler leurs [parliament_issues|e], demander un [casus_belli|e] ou lever plus de [taxes|e] et de [levies]. Se rendre à la chambre ne fera que renforcer notre gouvernement."
 qol_parliament.3.a: "Réunir les [estates|e] pour une nouvelle session"
 qol_parliament.3.b: "Nous nous en occuperons plus tard."
