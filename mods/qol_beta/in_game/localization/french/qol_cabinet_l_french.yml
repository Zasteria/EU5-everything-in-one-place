l_french:
 # Calidad de vida EU5 - alertes de tâche de cabinet au maximum.
 # Contrat d'affichage des alertes CMF : flags qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (mot de couleur) et _icon (text-icon) ; _name/_tooltip informent que la tâche
 # a atteint son maximum et reste active pour réduire le coût d'entretien au maximum.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Stabilité au maximum"
 qol_cab_ready_stabilize_tooltip: "La stabilité a atteint son maximum alors que la tâche [ShowCabinetActionName('stabilize_country')] est active. La tâche reste volontairement active pour réduire le coût d'entretien au maximum - annulez-la manuellement pour libérer l'emplacement."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Pouvoir gouvernemental au maximum"
 qol_cab_ready_strengthen_tooltip: "Le pouvoir gouvernemental a atteint son maximum alors que la tâche [ShowCabinetActionName('strengthen_government')] est active. La tâche reste volontairement active pour réduire le coût d'entretien au maximum - annulez-la manuellement pour libérer l'emplacement."