l_english:
 qol_parliament.1.t: "Last day of the parliamentary session"
 qol_parliament.1.d: "The [parliament|e] will convene for the last time tomorrow. If we want the issue under debate to pass, we must go to the chamber now and secure the support needed before it is too late."
 qol_parliament.1.a: "Go to the [parliament|e] to secure the support"
 qol_parliament.1.b: "Let the session run its course."
 qol_parliament.3.t: "A new parliamentary session is possible"
 qol_parliament.3.d: "Months have passed since the last summons and we can now gather our [estates|e] in the [parliament|e] to settle their [parliament_issues|e], request a [casus_belli|e] or raise greater [taxes|e] and [levies]. Attending the chamber will only strengthen our government."
 qol_parliament.3.a: "Gather the [estates|e] for a new session"
 qol_parliament.3.b: "We will deal with it later."
