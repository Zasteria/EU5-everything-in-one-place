l_russian:
 qol_parliament.1.t: "Последний день заседания парламента"
 qol_parliament.1.d: "[parliament|e] соберётся в последний раз завтра. Если мы хотим, чтобы обсуждаемый вопрос был принят, нам нужно сейчас отправиться в палату и заручиться необходимой поддержкой, пока не стало слишком поздно."
 qol_parliament.1.a: "Отправиться в [parliament|e], чтобы заручиться поддержкой"
 qol_parliament.1.b: "Пусть заседание идёт своим чередом."
 qol_parliament.3.t: "Возможна новая парламентская сессия"
 qol_parliament.3.d: "Прошли месяцы с последнего созыва, и теперь мы можем собрать наши [estates|e] в [parliament|e], чтобы урегулировать их [parliament_issues|e], запросить [casus_belli|e] или собрать больше [taxes|e] и [levies]. Посещение палаты лишь укрепит наше правительство."
 qol_parliament.3.a: "Собрать [estates|e] на новую сессию"
 qol_parliament.3.b: "Мы займёмся этим позже."
