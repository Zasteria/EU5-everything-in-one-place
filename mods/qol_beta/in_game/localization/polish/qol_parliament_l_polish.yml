l_polish:
 qol_parliament.1.t: "Ostatni dzień sesji parlamentu"
 qol_parliament.1.d: "[parliament|e] zbierze się po raz ostatni jutro. Jeśli chcemy, aby omawiana kwestia została przyjęta, musimy teraz udać się do izby i zapewnić sobie potrzebne poparcie, zanim będzie za późno."
 qol_parliament.1.a: "Udać się do [parliament|e], aby zapewnić poparcie"
 qol_parliament.1.b: "Pozwolić, aby sesja toczyła się swoim biegiem."
 qol_parliament.3.t: "Możliwa nowa sesja parlamentu"
 qol_parliament.3.d: "Minęły miesiące od ostatniego zwołania i możemy teraz zebrać nasze [estates|e] w [parliament|e], aby rozwiązać ich [parliament_issues|e], wystąpić o [casus_belli|e] lub zebrać większe [taxes|e] i [levies]. Udanie się do izby jedynie wzmocni nasz rząd."
 qol_parliament.3.a: "Zebrać [estates|e] na nową sesję"
 qol_parliament.3.b: "Zajmiemy się tym później."
