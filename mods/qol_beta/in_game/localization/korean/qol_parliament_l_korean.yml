l_korean:
 qol_parliament.1.t: "의회 회기 마지막 날"
 qol_parliament.1.d: "[parliament|e]은 내일 마지막으로 소집될 것이다. 논쟁 중인 안건을 통과시키고자 한다면, 늦기 전에 지금 바로 의회로 가서 필요한 지지를 확보해야 한다."
 qol_parliament.1.a: "[parliament|e]에 가서 지지를 확보한다"
 qol_parliament.1.b: "회기가 진행되도록 내버려 둔다."
 qol_parliament.3.t: "새 의회 회기 소집 가능"
 qol_parliament.3.d: "지난 소집 이후 몇 달이 지났으며, 이제 우리의 [estates|e]를 [parliament|e]에 소집하여 그들의 [parliament_issues|e]를 해결하고, [casus_belli|e]를 요청하고, 더 많은 [taxes|e]와 [levies]를 징수할 수 있다. 의회에 참석하는 것은 우리 정부를 강화할 뿐이다."
 qol_parliament.3.a: "[estates|e]를 소집하여 새 회기를 연다"
 qol_parliament.3.b: "나중에 처리하겠다."
