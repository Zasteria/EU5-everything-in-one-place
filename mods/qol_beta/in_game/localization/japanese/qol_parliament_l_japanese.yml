l_japanese:
 qol_parliament.1.t: "議会会期の最終日"
 qol_parliament.1.d: "[parliament|e]は明日、最後の会期を迎える。審議中の議題を通したいのなら、手遅れになる前に今まさに議場へ向かい、必要な支持を確保すべきだ。"
 qol_parliament.1.a: "[parliament|e]へ向かい、支持を確保する"
 qol_parliament.1.b: "会期をそのまま進める。"
 qol_parliament.3.t: "新しい議会会期が可能に"
 qol_parliament.3.d: "前回の招集から数か月が経ち、今や我々の[estates|e]を[parliament|e]に集め、彼らの[parliament_issues|e]を解決し、[casus_belli|e]を申請し、より多くの[taxes|e]と[levies]を徴収できる。議場に足を運べば、我々の政府はより強固になるだろう。"
 qol_parliament.3.a: "[estates|e]を集め、新しい会期を招集する"
 qol_parliament.3.b: "後で対応する。"
