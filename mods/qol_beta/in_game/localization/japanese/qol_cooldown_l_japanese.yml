l_japanese:
 # Calidad de vida EU5 - クールダウン通知。
 # CMFアラート表示契約: 監視対象のクールダウンの種類ごとに、フラグqol_cd_ready_<type>を基にします。
 # _color（色名）と_icon（テキストアイコン）は共通。_name/_tooltipはアクションごとに異なります。
 # アイコンはバニラの「time」テキストアイコンを使用（専用テクスチャ不要）。

 qol_cd_ready_request_divorce_color: "green"
 qol_cd_ready_request_divorce_icon: "@time!"
 qol_cd_ready_request_divorce_name: "離婚の要請が利用可能"
 qol_cd_ready_request_divorce_tooltip: "離婚の要請のクールダウンが終了し、再び使用できます。"

