l_braz_por:
 # Calidad de vida EU5 - alertas de ação de gabinete no máximo.
 # Contrato de exibição de alertas CMF: flags qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (palavra de cor) e _icon (text-icon); _name/_tooltip informam que a ação
 # atingiu o máximo e permanece ativa para reduzir o custo de manutenção no máximo.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Estabilidade no máximo"
 qol_cab_ready_stabilize_tooltip: "A estabilidade atingiu o máximo enquanto a ação [ShowCabinetActionName('stabilize_country')] está ativa. A ação permanece ativa de propósito para reduzir o custo de manutenção no máximo - cancele-a manualmente para liberar o espaço."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Poder governamental no máximo"
 qol_cab_ready_strengthen_tooltip: "O poder governamental atingiu o máximo enquanto a ação [ShowCabinetActionName('strengthen_government')] está ativa. A ação permanece ativa de propósito para reduzir o custo de manutenção no máximo - cancele-a manualmente para liberar o espaço."