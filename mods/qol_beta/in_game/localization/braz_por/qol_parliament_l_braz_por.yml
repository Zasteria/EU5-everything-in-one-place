l_braz_por:
 qol_parliament.1.t: "Último dia da sessão do Parlamento"
 qol_parliament.1.d: "O [parliament|e] se reunirá pela última vez amanhã. Se quisermos que a questão em debate seja aprovada, devemos ir à câmara agora e garantir o apoio necessário antes que seja tarde demais."
 qol_parliament.1.a: "Ir ao [parliament|e] para garantir o apoio"
 qol_parliament.1.b: "Deixar a sessão seguir seu curso."
 qol_parliament.3.t: "Uma nova sessão parlamentar é possível"
 qol_parliament.3.d: "Passaram-se meses desde a última convocação e agora podemos reunir nossos [estates|e] no [parliament|e] para resolver suas [parliament_issues|e], solicitar um [casus_belli|e] ou arrecadar mais [taxes|e] e [levies]. Ir à câmara só fortalecerá nosso governo."
 qol_parliament.3.a: "Reunir os [estates|e] em uma nova sessão"
 qol_parliament.3.b: "Deixaremos para mais tarde."
