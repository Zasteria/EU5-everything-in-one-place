l_german:
 qol_parliament.1.t: "Letzter Tag der Parlamentssitzung"
 qol_parliament.1.d: "Der [parliament|e] wird morgen zum letzten Mal zusammentreten. Wenn wir wollen, dass die zur Debatte stehende Angelegenheit angenommen wird, müssen wir jetzt in die Kammer gehen und die nötige Unterstützung sichern, bevor es zu spät ist."
 qol_parliament.1.a: "Zum [parliament|e] gehen, um die Unterstützung zu sichern"
 qol_parliament.1.b: "Die Sitzung ihren Lauf nehmen lassen."
 qol_parliament.3.t: "Eine neue Parlamentssitzung ist möglich"
 qol_parliament.3.d: "Monate sind seit der letzten Einberufung vergangen, und wir können nun unsere [estates|e] im [parliament|e] versammeln, um ihre [parliament_issues|e] zu lösen, einen [casus_belli|e] zu erbitten oder höhere [taxes|e] und [levies] zu erheben. In die Kammer zu gehen wird unsere Regierung nur stärken."
 qol_parliament.3.a: "Die [estates|e] zu einer neuen Sitzung versammeln"
 qol_parliament.3.b: "Wir werden uns später darum kümmern."
