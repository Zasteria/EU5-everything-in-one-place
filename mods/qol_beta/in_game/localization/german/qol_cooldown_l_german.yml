 # CMF-Alert-Anzeigevertrag: pro überwachter Abklingzeit, anhand der Flagge qol_cd_ready_<type>.
 # _color (Farbwort) und _icon (Text-Symbol) sind einheitlich; _name/_tooltip unterscheiden sich je Aktion.
 # Das Symbol ist das Vanilla-Textsymbol „time" (keine eigene Textur nötig).

