 qol_cd_ready_request_divorce_icon: "@time!"
 qol_cd_ready_request_divorce_name: "Scheidung fordern verfügbar"
 qol_cd_ready_request_divorce_tooltip: "Die Interaktion Scheidung fordern ist nicht mehr in der Abklingzeit und kann wieder verwendet werden."

