l_english:
 bag_cmfs_name: "Saved Settings"
 bag_cmfs_desc: "Saves every Community Mod Framework setting to a file and puts it back in the next game. This build is a probe: the button only prints the settings to debug.log."
 bag_cmfs__main_name: "Settings"
 bag_cmfs__main__save_name: "Save"
 bag_cmfs__save_now_name: "Save my settings"
 bag_cmfs__save_now_desc: "Prints every mod setting to debug.log. Then run mods.bat, item «Сохранить настройки CMF», before the game is restarted: debug.log is overwritten at every launch."
 bag_cmfs__save_now_text: "Save"
