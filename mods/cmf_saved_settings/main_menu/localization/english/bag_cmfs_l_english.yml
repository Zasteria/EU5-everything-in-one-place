l_english:
 bag_cmfs_name: "Saved Settings"
 bag_cmfs_desc: "Saves every Community Mod Framework setting and puts it into every new game: the button prints them to debug.log, mods.bat (item 5) builds a «CMF: мои настройки» mod from them."
 bag_cmfs__main_name: "Settings"
 bag_cmfs__main__save_name: "Save"
 bag_cmfs__save_now_name: "Save my settings"
 bag_cmfs__save_now_desc: "Prints every mod setting to debug.log. Then close the game and, before the next launch, run mods.bat item 5: it saves them to a file and builds the «CMF: мои настройки» mod. While the game is open the end of the log is not written yet, and a launch wipes the log."
 bag_cmfs__save_now_text: "Save"
