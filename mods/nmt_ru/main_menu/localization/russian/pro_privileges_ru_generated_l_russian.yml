l_russian:
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "The Estates General of Provence, in which nobility, clergy, and burghers participate. Strengthens the three estates and guarantees regional autonomy."
 pro_marseille_free_port_town_rights: "Free Port of Marseille"
 pro_marseille_free_port_town_rights_desc: "Declares Marseille a free port. Expands merchant trading rights and raises prosperity, population, and burgher power. Can only be granted to Marseille."
