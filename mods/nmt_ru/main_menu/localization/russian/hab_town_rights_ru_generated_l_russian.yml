l_russian:
 wiener_stadtrecht_town_rights: "Венское городское право"
 wiener_stadtrecht_town_rights_desc: "Особое городское право, даруемое одной лишь Вене: лучше доступ к рынку, выше сила торгового центра и число купцов. Даруется только Вене."
 landstadt_town_rights: "Земский город"
 landstadt_town_rights_desc: "Городские права, даруемые городам по всей империи: укрепляют власть короны и сословия знати и расширяют досягаемость управления из столицы."
