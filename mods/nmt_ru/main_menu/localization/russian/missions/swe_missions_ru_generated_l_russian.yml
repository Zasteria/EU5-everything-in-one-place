 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "The Falun copper mine supporting Europe's copper demand is in full operation."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "Iron Industry"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "Svealand's iron mines are fully operational, establishing the foundation of Sweden's defense industry."
 STATIC_MODIFIER_NAME_swe_steel_mod: "Swedish Steel"
 STATIC_MODIFIER_DESC_swe_steel_mod: "Europe's finest quality Swedish steel is supplied to armies at home and abroad."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "The Riksdag"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "Sweden's parliament established as a functional legislative body. Sweden's unique political tradition — where peasants participate — takes shape."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Absolutism"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "Anticipating Karl XI's reduktionen, absolute monarchy is established in Sweden."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "Sweden as Great Power"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "The arrival of the Stormaktstiden sees Sweden emerge as a major European power."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "Great Power Economy"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "Sweden's great power economy — built on Swedish steel, absolute monarchy, and Baltic trade — is complete."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "Catholic Sweden"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Maintaining loyalty to the Roman Church, Sweden is recognized as guardian of northern Catholic civilization."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Northern Crusader Glory"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "Sweden participates in holy war, establishing its reputation as guardian of Christendom."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Lutheran Reform"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Anticipating Gustav Vasa's Lutheran declaration, church property passes to the crown."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "Protestant Church"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "Lutheran theology training entrenches Protestant faith across Sweden."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Norse Revival"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "Faith in Odin, Thor, and Freyr is revived. The Viking age warrior spirit inhabits Sweden's armies."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "Army of Berserkers"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "The bear-warrior spirit of the Viking age is revived. Privateering is unleashed to raid infidel coasts."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "Throne of Yggdrasil"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Like Odin at the roots of the World Tree, the Swedish emperor reigns at the center of the northern world."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Finland Integrated"
 STATIC_MODIFIER_DESC_swe_finland_mod: "Finland is integrated as part of the Swedish Empire. Colonial policy opens the northern frontier."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Lapland Expansion"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "The vast forests of Norrland are integrated into Sweden."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "Arctic Empire"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Sweden extending to the Arctic Circle expands its naval presence across the North Atlantic."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Stormaktstiden"
