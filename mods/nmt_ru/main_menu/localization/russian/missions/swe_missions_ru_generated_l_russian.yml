l_russian:
 swe_stormaktstiden_mission_pack: "Stormaktstiden — Sweden's Age of Great Power"
 swe_stormaktstiden_mission_pack_DESCRIPTION: "In 1337, Sweden is an independent kingdom in personal union with Norway under King Magnus Eriksson. To the north lies powerful Denmark, and the coming struggle for Scandinavian supremacy — as foreshadowed by the Kalmar Union (1397) — is inevitable. Through Falun's copper mine, Baltic mastery, and the Varangian eastern routes, realize the Stormaktstiden (Age of Great Power) and build the Swedish Empire."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION: "As Sweden, achieve Scandinavian supremacy, unification, eastern expansion, and industrial development to found the Scandinavian Empire."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP: "Complete missions to build the Swedish Empire."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS: "From the Engelbrekt Rebellion to Stormaktstiden — forge Sweden into an Empire!"
 swe_kingdom_of_sweden: "Kingdom of Sweden"
 swe_kingdom_of_sweden_desc: "In 1337, Sweden is an independent kingdom in personal union with Norway under King Magnus Eriksson. Surrounded by powerful Denmark to the north, Russian principalities to the east, and the Hanseatic League to the south, Sweden must strengthen its legitimacy and stabilize its realm to prepare for the coming struggle for Scandinavian supremacy."
 swe_kingdom_of_sweden_tooltip: "Legitimacy 70+, stability 20+"
 swe_norway_union: "Personal Union with Norway"
 swe_norway_union_desc: "Sweden and Norway have been in personal union under King Magnus since 1319. Strengthening this alliance combines the military and economic power of the two northern kingdoms against Denmark."
 swe_norway_union_tooltip: "Norway (c:NOR) in personal union or subject, or doesn't exist"
 swe_break_from_denmark: "Counter Denmark"
 swe_break_from_denmark_desc: "The coming Kalmar Union (1397) risks giving Denmark dominance over Scandinavia — a future Sweden must avoid. Actively assert Swedish power against Denmark now and secure the groundwork for claiming Scandinavian supremacy. Anticipate the spirit of the Engelbrekt Rebellion (1434) and establish Swedish royal authority before that day comes."
 swe_break_from_denmark_tooltip: "Not under Danish (c:DAN) dominion, prestige 30+ (already met at game start in 1337)"
 swe_control_skaane: "Control Skåneland"
 swe_control_skaane_desc: "Skåne (Scania) is Sweden's southernmost region, long contested with Denmark. Seizing Malmö and Skåneland secures the Øresund Strait and gives Sweden a free outlet to the Baltic Sea."
 swe_control_skaane_tooltip: "Malmö owned by us or a subject, own 3+ locations in the Skåneland area"
 swe_defeat_denmark: "Defeat Denmark"
 swe_defeat_denmark_desc: "Denmark is Sweden's greatest enemy. Occupying Copenhagen or making Denmark a Swedish subject means the mastery of the North passes to Sweden. 'Sweden is the true leader of Scandinavia' — the position Gustav Vasa dreamed of is realized here."
 swe_defeat_denmark_tooltip: "Denmark subject, doesn't exist, or Copenhagen owned by us or a subject"
 swe_integrate_norway: "Integrate Norway"
 swe_integrate_norway_desc: "Directly owning Oslo, Bergen, and Nidaros fully integrates Norway as part of the Swedish Empire. Norway's rich fisheries and North Atlantic gateway dramatically expand Swedish power."
 swe_integrate_norway_tooltip: "Oslo, Bergen, and Nidaros directly owned by us"
 swe_unite_scandinavia: "Unite Scandinavia"
 swe_unite_scandinavia_desc: "Denmark crushed, Norway integrated — all of Scandinavia unified under the Swedish banner. This achievement — uniting all of Scandinavia, which no one has managed since the Viking age — is now realized."
 swe_unite_scandinavia_tooltip: "Own 300+ locations in the Scandinavian region"
 swe_danish_navy_seizure: "Seize the Danish Fleet"
 swe_danish_navy_seizure_desc: "After defeating Denmark, its powerful fleet passes to Sweden. The strongest naval force in the Baltic is now in Swedish hands, opening the road to North Sea mastery."
 swe_danish_navy_seizure_tooltip: "Fleet size 30+, navy tradition 40+"
 swe_sound_toll: "The Sound Toll"
 swe_sound_toll_desc: "With Skåneland secured, Sweden now controls the Øresund Strait on the Swedish side. Collecting the Sound Toll in Denmark's place generates enormous revenue."
 swe_sound_toll_tooltip: "Fleet size 25+, monthly income 100+"
 swe_control_gotland: "Control Gotland"
 swe_control_gotland_desc: "Visby on Gotland is one of the greatest trading cities of the Baltic. Seizing this prize — contested by Denmark, the Hanseatic League, and the Livonian Order — establishes Sweden's foothold in Baltic trade."
 swe_control_gotland_tooltip: "Visby owned by us or a subject"
 swe_baltic_trade: "Baltic Trade"
 swe_baltic_trade_desc: "Using Gotland as a base, Sweden enters Baltic trade in earnest. The Varangians once carried goods from Sweden all the way to Byzantium. Revive that tradition and create the age of Swedish merchants ruling the Baltic."
 swe_baltic_trade_tooltip: "Fleet size 20+, monthly income 80+"
 swe_conquer_estonia: "Conquer Estonia"
 swe_conquer_estonia_desc: "Tallinn (Reval) was originally built by Danes, but Sweden would gain Estonia in the Livonian War (1558-83). Anticipate this historic conquest and establish Sweden's bridgehead on the eastern Baltic shore."
 swe_conquer_estonia_tooltip: "Tallinn and Narva owned by us or a subject"
 swe_control_livonia: "Control Livonia"
 swe_control_livonia_desc: "Seizing Riga and Tartu (Dorpat) brings the entire eastern Baltic coast under Swedish control. Amid competition with Poland, Russia, and Denmark, Sweden becomes Livonia's ultimate master."
 swe_control_livonia_tooltip: "Riga and Tartu owned by us or a subject"
 swe_varangian_legacy: "Varangian Legacy"
 swe_varangian_legacy_desc: "In the 8th-10th centuries, Varangians (Vikings) built Novgorod and opened trade routes through the Dnieper to Constantinople. Seizing Novgorod and Pskov revives that ancient legacy in the modern era."
 swe_varangian_legacy_tooltip: "Novgorod and Pskov owned by us or a subject"
 swe_city_of_rus: "City of the Rus"
 swe_city_of_rus_desc: "Moscow is the capital of the Grand Duchy of Moscow and the center of the Rus world. As heirs of the Varangians, Sweden controlling Moscow completes the Swedish Empire stretching from the Baltic to all of Eastern Slavic civilization."
 swe_city_of_rus_tooltip: "Moscow owned by us or a subject"
 swe_bane_of_hansa: "Bane of the Hansa"
 swe_bane_of_hansa_desc: "The Hanseatic League has monopolized Baltic trade, but cracks appear as Sweden expands. Control Lübeck (the Hansa's leader) or break up the Hanseatic League entirely to transfer the starring role in Baltic trade to Sweden."
 swe_bane_of_hansa_tooltip: "Lübeck owned by us or a subject, or HSA doesn't exist"
 swe_pomeranian_coast: "Pomeranian Coast"
 swe_pomeranian_coast_desc: "Seizing Stralsund and Stettin places the Pomeranian coast along the southern Baltic under Swedish control. Anticipate what Sweden actually gained in the Thirty Years' War (1618-48) and secure this region."
 swe_pomeranian_coast_tooltip: "Stralsund and Stettin owned by us or a subject"
 swe_prussian_ambition: "Prussian Ambition"
 swe_prussian_ambition_desc: "Prussia, once ruled by the Teutonic Knights, is the southeastern Baltic hub. Securing Königsberg and the Prussia region gives Sweden complete mastery of the Baltic Sea."
 swe_prussian_ambition_tooltip: "Königsberg owned by us or a subject, own 5+ locations in the Prussia area"
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "'Dominium Maris Baltici' (Mastery of the Baltic Sea) — Sweden's ultimate strategic goal of the 17th century. Dominating the entire Baltic coastline makes this inland sea Sweden's 'lake.'"
 swe_dominium_maris_baltici_tooltip: "Fleet size 50+, Gdańsk and Königsberg owned by us or a subject"
 swe_secure_stockholm: "Secure Stockholm"
 swe_secure_stockholm_desc: "Stockholm — 'island between the waters' — is a natural fortress city between Lake Mälaren and the Baltic. Raising it to city rank with development 30+ establishes it as the center of Swedish royal power."
 swe_secure_stockholm_tooltip: "Stockholm is city rank or above, development 30+"
 swe_falun_mine: "Falun Mine"
 swe_falun_mine_desc: "Stora Kopparberget (the Great Copper Mountain) — Falun's copper mine has been operating since the 9th century, the heart of Sweden's economy. When Magnus IV granted the mining company further privileges in 1347, it covered two-thirds of Europe's copper demand. Maximize this mine."
 swe_falun_mine_tooltip: "Falun RGO level 6+, produce 10+ copper"
 swe_iron_industry: "Swedish Iron Industry"
 swe_iron_industry_desc: "Svealand's iron mines are the foundation of Sweden's defense industry. High-quality Swedish iron was coveted by armies across Europe — the cannons of the Thirty Years' War used Swedish iron. Expand this industrial advantage further."
 swe_iron_industry_tooltip: "Produce 10+ iron, own 3+ Svealand area locations with RGO level 5+"
 swe_swedish_steel: "Swedish Steel"
 swe_swedish_steel_desc: "Swedish steel — renowned as Europe's finest quality. The steel industry backed by abundant copper and iron production symbolizes the economic strength of the Swedish Empire in both equipping Swedish armies and export income."
 swe_swedish_steel_tooltip: "Produce 20+ iron, 15+ copper"
 swe_riksdag: "The Riksdag"
 swe_riksdag_desc: "The Riksdag (Parliament) was first convened in 1435 in Sweden. This estates assembly of nobles, knights, clergy, and peasants (uniquely, Swedish peasants had their own estate representation) should be strengthened to establish Sweden's distinctive political tradition."
 swe_riksdag_tooltip: "Crown estate power 20%+, or nobles estate power 50%+; legitimacy 80+"
 swe_absolutism: "Absolutism"
 swe_absolutism_desc: "In 1680, Karl XI reclaimed noble lands through 'reduktionen' (the reduction) and established absolute monarchy in Sweden. Anticipate this historic transformation and fully consolidate royal power."
 swe_absolutism_tooltip: "Crown estate power 40%+, legitimacy 95+"
 swe_great_power: "Sweden as a Great Power"
 swe_great_power_desc: "The 17th century Stormaktstiden saw Sweden emerge as a major European power under Gustavus Adolphus, Charles X Gustav, and Charles XII. Anticipate this era with vast territory, rich income, and high prestige."
 swe_great_power_tooltip: "Own 300+ locations, monthly income 300+, prestige 70+"
 swe_stormakt_economy: "Economy of a Great Power"
 swe_stormakt_economy_desc: "Swedish steel, absolute monarchy's administrative efficiency, Baltic trade — the economic foundation of the Stormaktstiden is complete. Prove Swedish imperial strength with monthly income 400+ and multiple market centers."
 swe_stormakt_economy_tooltip: "Monthly income 400+, own 3+ market centers"
 swe_religious_crossroads: "Religious Crossroads"
 swe_religious_crossroads_desc: "The storm of the Reformation is sweeping Scandinavia. The Swedish court debates fiercely: maintain loyalty to the Roman Pope — accept Martin Luther's revolutionary teachings — or return to the ancient gods the ancestors worshipped. The Swedish king's decision will determine this northern kingdom's future."
 swe_religious_crossroads_tooltip: "Reformation situation (situation:reformation) is active"
 swe_catholic_sweden: "Catholic Sweden"
 swe_catholic_sweden_desc: "The Kingdom of Sweden maintains its loyalty to the Roman Church. Close relations with the Pope give Sweden diplomatic advantages and recognition as guardian of northern Catholic civilization."
 swe_catholic_sweden_tooltip: "Dominant religion Catholic (religion:catholic), papal opinion 150+"
 swe_northern_crusade: "Northern Crusade"
 swe_northern_crusade_desc: "Sweden participates in holy war as the northern shield of Christendom. Leading northern crusades against non-Christian peoples elevates Sweden's religious authority and prestige."
 swe_northern_crusade_tooltip: "At war with a Muslim country"
 swe_church_reform: "Champion of the Pope"
 swe_church_reform_desc: "Deep trust with the papacy and control of Lübeck — Sweden has established an unshakeable position as guardian of northern Catholic civilization."
 swe_church_reform_tooltip: "Papal opinion 180+, Lübeck owned by us or a subject"
 swe_reformation: "The Reformation"
 swe_reformation_desc: "In 1527, Swedish King Gustav Vasa declared Lutheranism the de facto state religion at the Västerås Parliament. Transferring church property to the crown dramatically strengthened state finances. Anticipate this decisive act now."
 swe_reformation_tooltip: "Dominant religion Lutheran (religion:lutheran) or Calvinist (religion:calvinist)"
 swe_protestant_reform: "Protestant Church"
 swe_protestant_reform_desc: "Develop universities to train Lutheran theologians and entrench Protestant faith across Sweden. The Swedish Church's distinctiveness becomes the foundation of Swedish culture and identity."
 swe_protestant_reform_tooltip: "Own 3+ universities, clergy satisfaction 0.65+"
 swe_protestant_empire: "Protestant Empire"
 swe_protestant_empire_desc: "Lutheranism penetrates all of Scandinavia. The Swedish king reigns as the northern champion of the Protestant world, capable of confronting southern Catholic powers as in the Thirty Years' War."
 swe_protestant_empire_tooltip: "Own 300+ locations, 1+ Scandinavian region locations with 70%+ Lutheran population"
 swe_norse_revival: "Norse Revival"
 swe_norse_revival_desc: "The gods of the ancestors — Odin, Thor, Freyr — are reborn. The shape of Scandinavia before Christianization is recreated in the modern era. The Swedish king reigning as representative of the Norse gods — this revolutionary choice will shock all of Europe."
 swe_norse_revival_tooltip: "Dominant religion Norse (religion:norse)"
 swe_berserker_army: "Army of Berserkers"
 swe_berserker_army_desc: "The spirit of the Viking age bear-warriors is revived. Warriors devoted to the Norse gods are unleashed for piracy, free to raid the coasts of the infidel."
 swe_berserker_army_tooltip: "Navy tradition 50+, army size 30+"
 swe_yggdrasil_throne: "Throne of Yggdrasil"
 swe_yggdrasil_throne_desc: "Like Odin enthroned at the roots of the World Tree, the Swedish emperor reigns at the center of the northern world. With imperial rank and 500+ locations, the northern empire blessed by the Norse gods is complete."
 swe_yggdrasil_throne_tooltip: "Imperial rank, own 500+ locations directly"
 swe_finland_integration: "Integrate Finland"
 swe_finland_integration_desc: "Finland has been an integral part of Sweden since the 12th century. Directly owning Åbo, Viborg, and Uleåborg establishes Sweden's bridgehead to the North Atlantic and Barents Sea."
 swe_finland_integration_tooltip: "Åbo, Viborg, and Uleåborg directly owned by us"
 swe_lapland_expansion: "Lapland Expansion"
 swe_lapland_expansion_desc: "The vast forests of Norrland (northern Sweden) are home to the Sami people. Integrating their lands into the kingdom and securing the abundant resources of timber, fur, and iron ore begins the serious development of Sweden's northern frontier."
 swe_lapland_expansion_tooltip: "Own 5+ locations in the Norrland area"
 swe_arctic_empire: "Arctic Empire"
 swe_arctic_empire_desc: "Deploying to the Norwegian Sea and Barents Sea centered on Uleåborg — Sweden becomes a northern empire extending to the Arctic Circle. Naval governors are installed and maritime presence expanded to complete the Swedish Empire's northern frontier."
 swe_arctic_empire_tooltip: "Uleåborg owned by us or a subject, own 8+ locations in the Norrland area"
 swe_develop_stockholm: "Great Stockholm"
 swe_develop_stockholm_desc: "Stockholm has developed into a great city with a university. This city linking the Baltic and North Sea grows into Northern Europe's greatest city as the cultural, commercial, and political center of the Swedish Empire."
 swe_develop_stockholm_tooltip: "Stockholm development 40+, university built"
 swe_develop_goteborg: "Develop Gothenburg"
 swe_develop_goteborg_desc: "Gothenburg (Göteborg) was built by Gustavus Adolphus in 1621 as Sweden's western coast port. Raising it to city rank opens a direct trade route to Denmark, the Netherlands, and England."
 swe_develop_goteborg_tooltip: "Gothenburg is city rank or above"
 swe_peasant_support: "Peasant Support"
 swe_peasant_support_desc: "Sweden's peasant estate holds its own representation in the Riksdag — a unique feature. Raising peasant satisfaction and expanding grain production establishes social stability and Sweden's distinctive democratic tradition."
 swe_peasant_support_tooltip: "Peasants estate satisfaction 0.65+, produce 10+ grain"
 swe_engelbrekt: "Spirit of Engelbrekt"
 swe_engelbrekt_desc: "In 1434-36, Engelbrekt Engelbrektsson led miners and peasants in rebellion against Danish rule. He was assassinated, but his spirit became the eternal symbol of the Swedish independence movement. Formally embody this spirit now."
 swe_engelbrekt_tooltip: "Legitimacy 80+, peasants satisfaction 0.70+"
 swe_colonization: "Swedish Colonial Empire"
 swe_colonization_desc: "Sweden also built colonies in the 17th century, including New Sweden (Delaware River area). Building on Finland's development, launch overseas colonial ventures and extend the Swedish Empire's reach across the world."
 swe_colonization_tooltip: "Own 3+ colonial locations"
 swe_develop_uppsala: "Uppsala University Flourishes"
 swe_develop_uppsala_desc: "Uppsala University (founded 1477), the oldest in Sweden, produced Carl Linnaeus (taxonomy) and Anders Celsius (thermometer) — Northern Europe's finest academy. Develop this university and solidify the foundations of Swedish scholarship."
 swe_develop_uppsala_tooltip: "Uppsala has a university, development 25+"
 swe_karoliner: "The Karoliner"
 swe_karoliner_desc: "The Karoliner (soldiers of King Karl) were the elite infantry of the Swedish Empire under Charles XII in the early 18th century, known as the strongest infantry of their era. Develop high military tradition and a large army to anticipate this elite corps."
 swe_karoliner_tooltip: "Army tradition 50+, army size 30+"
 swe_amber_trade: "Amber Trade"
 swe_amber_trade_desc: "Baltic amber exported from Swedish-controlled territories to all of Europe is the 'Gold of the North.' Building on the great power's economic foundation and expanding amber trade further boosts the Swedish Empire's commercial income."
 swe_amber_trade_tooltip: "Produce 3+ amber, monthly income 200+"
 swe_stormaktstiden: "Stormaktstiden"
 swe_stormaktstiden_desc: "Scandinavia united, Baltic mastered, great power economy achieved — the three pillars align and Sweden reaches the apex of the Stormaktstiden (Age of Great Power). With 600+ locations, income 600+, prestige 80+, seize that glory."
 swe_stormaktstiden_tooltip: "Own 600+ locations, monthly income 600+, prestige 80+"
 swe_swedish_empire: "The Swedish Empire"
 swe_swedish_empire_desc: "From the Baltic to Moscow, from Scandinavia to Prussia — the Swedish Empire is complete. Sweden's journey, which began in 1337 with a personal union with Norway, ends here with the arrival of a great empire dominating all of Northern Europe. 'Sweden laughs last' — Charles XII's words are realized here."
 swe_swedish_empire_tooltip: "Own 1000+ locations, prestige 80+, monthly income 1000+"
 swe_events.30.t: "Scandinavian Unity — Dawn of the Stormaktstiden"
 swe_events.30.d: "Denmark crushed, Norway integrated — all of Scandinavia unified under the Swedish banner. This achievement, unattained since the Viking age, is finally realized. The Swedish king hereby declares the title 'King of Scandinavia,' and the construction of Northern Europe's greatest state begins. 'Engelbrekt's dream has been realized here today' — future historians will write thus."
 swe_events.30.a: "Long live Scandinavia! Unity of the North forever!"
 swe_events.40.t: "Crossroads of Faith — Sweden's Religious Choice"
 swe_events.40.d: "The storm of the Reformation is sweeping Scandinavia. The Swedish court debates fiercely. Maintain loyalty to the Pope in Rome — accept Luther's revolutionary teachings — or return to the ancient gods the ancestors worshipped? The Swedish king's decision will determine this northern kingdom's future."
 swe_events.40.a: "Hold loyalty to Rome — Catholicism is Sweden's soul"
 swe_events.40.b: "Accept Luther's teachings — the age of reform has come"
 swe_events.40.c: "Return to the ancient gods — seek Odin's blessing"
 swe_events.99.t: "The Birth of the Swedish Empire"
 swe_events.99.d: "From the Baltic to Moscow, from Scandinavia to Prussia — the Swedish Empire is finally complete. From Sweden's journey beginning in 1337 with a Norwegian personal union, Sweden has transformed from a peripheral northern nation into a great empire dominating all of Northern Europe. Stormaktstiden (the Age of Great Power) — that was the era when Sweden became a leading actor in world history. 'Again it is day — but this time it is Sweden's day.'"
 swe_events.99.a: "Long live the Emperor of the Swedish Empire! May the Northern Empire last forever!"
