 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "The Baltic Sea becomes Sweden's 'lake.' Every merchant ship that crosses this sea answers to Sweden."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Hansa Defeated"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "Sweden defeats the Hanseatic League and becomes the star of Baltic trade."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "Pomeranian Coast"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "Anticipating what Sweden gained in the Thirty Years' War, the southern Baltic coast is under Swedish control."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Prussian Ambition"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "Prussia including Königsberg has come under Swedish control."
