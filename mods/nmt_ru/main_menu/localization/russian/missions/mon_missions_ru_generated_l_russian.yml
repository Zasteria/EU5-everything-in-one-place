l_russian:
 mon_montferrat_mission_pack: "Честолюбие Палеологов и владычество над Италией"
 mon_montferrat_mission_pack_DESCRIPTION: "В 1337 году Монферратским маркграфством правит государь, в чьих жилах течёт кровь византийской династии Палеологов. Заявите права на Фессалоники и двиньтесь на восток, к Константинополю, — или выкуйте державу на севере Италии дипломатией и мечом кондотьера. Два честолюбия горят в одном государе."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION: "Мечта о Востоке или владычество на Западе — кровь Палеологов открывает оба пути."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP: "Покорите Италию и Грецию силой крови Палеологов."
 mon_montferrat_mission_pack_BUTTON_DETAILS: "От Фессалоник до Афин — именем Палеологов, от Казале до Генуи — сталью и золотом. Покорите Восток и Запад!"
 mon_palaiologos_ambition: "Честолюбие Палеологов"
 mon_palaiologos_ambition_desc: "В правителе Монферрата течёт кровь Палеологов. Горят два честолюбия: на восток, к Фессалоникам, или на запад, к владычеству над Италией."
 mon_claim_thessaloniki: "Притязание на Фессалоники"
 mon_claim_thessaloniki_desc: "Заявите притязание на Фессалоники — некогда второй город Византии — как на плацдарм для восточных замыслов."
 mon_seize_thessaloniki: "Захватить Фессалоники"
 mon_seize_thessaloniki_desc: "Захватите Фессалоники и водрузите знамя Палеологов на Белой башне."
 mon_greek_culture_shift: "Переход к греческой культуре"
 mon_greek_culture_shift_desc: "Примите греческую культуру и превратите Монферрат в преемника Византии."
 mon_orthodox_faith: "Обращение в православие"
 mon_orthodox_faith_desc: "Перейдите в православие, чтобы узаконить Монферрат как истинного наследника Византии."
 mon_conquer_macedonia: "Завоевание Македонии"
 mon_conquer_macedonia_desc: "Завоюйте Македонию — ворота в Грецию и родину Александра Македонского."
 mon_northern_greece: "Северная Греция"
 mon_northern_greece_desc: "Закрепите за собой Северную Грецию как основу для дальнейшего расширения."
 mon_conquer_morea: "Завоевание Мореи"
 mon_conquer_morea_desc: "Завоюйте Морею и Афины — сердце древнегреческой цивилизации."
 mon_aegean_control: "Власть над Эгейским морем"
 mon_aegean_control_desc: "Захватите острова Эгейского моря и раздвиньте морской размах Монферрата."
 mon_new_byzantium: "Новая Византия"
 mon_new_byzantium_desc: "Заявите права на византийское наследие и добейтесь признания как преемник Восточного Рима."
 mon_secure_piedmont: "Закрепить Пьемонт"
 mon_secure_piedmont_desc: "Закрепите за собой Пьемонт как основу для господства на севере Италии."
 mon_casale_capital: "Казале-Монферрато"
 mon_casale_capital_desc: "Превратите Казале-Монферрато в столицу, достойную маркграфства."
 mon_rival_savoy: "Соперничество с Савойей"
 mon_rival_savoy_desc: "Дайте отпор Савойе — сопернице в борьбе за Пьемонт — и утвердите своё первенство."
 mon_control_lombardy: "Взять Ломбардию"
 mon_control_lombardy_desc: "Завоюйте Ломбардию — сердце Северной Италии."
 mon_seize_genoa: "Захватить Геную"
 mon_seize_genoa_desc: "Захватите Геную — Гордую (La Superba) — и получите доступ к средиземноморской торговле."
 mon_north_italy_trade: "Торговая держава Северной Италии"
 mon_north_italy_trade_desc: "Постройте торговую державу, охватывающую Ломбардию, Лигурию и Венето."
 mon_emilia: "Завоевание Эмилии"
 mon_emilia_desc: "Завоюйте плодородный южный берег долины По — Болонью, Парму и Модену."
 mon_king_of_italy: "Король Италии"
 mon_king_of_italy_desc: "Объединив Ломбардию, Лигурию и Эмилию, провозгласите себя королём Италии."
 mon_hre_relations: "Отношения с СРИ"
 mon_hre_relations_desc: "Определите отношения со Священной Римской империей — союзник, соперник или предводитель."
 mon_dev_casale: "Казале — город учёности и богатства"
 mon_dev_casale_desc: "Превратите Казале в город учёности и богатства, где сходятся Возрождение и византийское наследие."
 mon_renaissance_court: "Двор Возрождения"
 mon_renaissance_court_desc: "Создайте двор Возрождения, где византийское классическое знание сплавляется с итальянскими новшествами в искусстве."
 mon_mercenary_tradition: "Традиция кондотьеров"
 mon_mercenary_tradition_desc: "Взрастите традицию кондотьеров — наёмное военное наследие Монферрата."
 mon_papal_alliance: "Союз с папой"
 mon_papal_alliance_desc: "Заключите союз с папой, чтобы узаконить замыслы Монферрата по всей Италии."
 mon_tuscany: "Завоевание Тосканы"
 mon_tuscany_desc: "Завоюйте Тоскану — родину культуры Возрождения Медичи — и продвигайтесь к Риму."
 mon_veneto: "Завоевание Венето"
 mon_veneto_desc: "Завоюйте Венето вместе с Венецией и завершите господство над Северной Италией."
 mon_byzantine_heritage: "Византийское наследие"
 mon_byzantine_heritage_desc: "Заявите права на всё византийское наследие: с греческой культурой и православием награда будет больше."
 mon_navy_adriatic: "Адриатический флот"
 mon_navy_adriatic_desc: "Постройте мощный адриатический флот, соединив морскую силу Генуи и Венеции."
 mon_southern_italy: "Южная Италия"
 mon_southern_italy_desc: "Продвиньтесь в Южную Италию и захватите Неаполь, чтобы объединить Апеннинский полуостров."
 mon_marquis_of_italy: "Великий маркиз Италии"
 mon_marquis_of_italy_desc: "Правьте как великий маркиз Италии, соединив Восток и Запад, Север и Юг."
 mon_new_roman_empire: "Новая Римская империя"
 mon_new_roman_empire_desc: "Провозгласите Новую Римскую империю — преемницу и Восточного, и Западного Рима."
 mon_events.10.t: "Взятие Фессалоник — знамя Палеологов над Белой башней"
 mon_events.10.d: "Фессалоники — некогда второй город Византийской империи — пали перед Монферратом. Правитель с кровью Палеологов начинает воплощать восточные замыслы. Звонят колокола Белой башни — началась новая эпоха."
 mon_events.10.a: "Да здравствуют Фессалоники! Под знамя Палеологов!"
 mon_events.20.t: "Король Италии — торжество от Казале до Святого города"
 mon_events.20.d: ""Король Италии" — Монферрат, объединивший Ломбардию, Лигурию и Эмилию, провозглашён новым хозяином Апеннинского полуострова. Двор в Казале полон ликования."
 mon_events.20.a: "Да здравствует король Италии!"
 mon_events.50.t: "Рождение Новой Византии — мечта Палеологов сбылась"
 mon_events.50.d: ""Император из рода Палеологов — преемник Рима и Константинополя" — Монферрат наследует имя Византии. Малое маркграфство Северной Италии вступает на путь к господству над Восточным Средиземноморьем."
 mon_events.50.a: "Да здравствует император Палеолог! Да здравствует Новая Византия!"
 mon_events.60.t: "Великий маркиз Италии — правитель на перекрёстке Востока и Запада"
 mon_events.60.d: "От Казале-Монферрато до Генуи, Флоренции, Неаполя — рождается Монферратская держава. Искусство Возрождения, дух Византии, меч кондотьера — три силы слились воедино и создали хозяина Италии."
 mon_events.60.a: "Да здравствует великий маркиз Италии!"
 mon_events.99.t: "Новая Римская империя — объединитель Востока и Запада"
 mon_events.99.d: ""Император из рода Палеологов — преемник Восточного и Западного Рима, король Италии, властитель Греции" — этот титул гремит по всему Средиземноморью. Честолюбие, проросшее при маленьком дворе в Казале в 1337 году, венчается созданием мировой державы. Имя Рима восстановлено."
 mon_events.99.a: "Да здравствует Новая Римская империя! Вечная слава!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Палеологи"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "Кровь Палеологов пробуждает честолюбие Монферрата на Востоке и на Западе."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Притязание на Фессалоники"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Фессалоники манят — скоро знамя Палеологов взовьётся над Эгейским морем."
 STATIC_MODIFIER_NAME_mon_greek_culture_mod: "Греческая культура"
 STATIC_MODIFIER_DESC_mon_greek_culture_mod: "Греческая культура принята — Монферрат становится преемником Византии."
 STATIC_MODIFIER_NAME_mon_orthodox_mod: "Православие"
 STATIC_MODIFIER_DESC_mon_orthodox_mod: "Православие принято — Монферрат признан истинным наследником Византии."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Македония"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Македония завоёвана — ворота в Грецию и родина Александра Македонского."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Северная Греция"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Северная Греция закреплена как основа для дальнейшего продвижения на юг."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Морея"
 STATIC_MODIFIER_DESC_mon_morea_mod: "Морея и Афины завоёваны — сердце древнегреческой цивилизации возрождено."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Эгейское море"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Острова Эгейского моря захвачены, морской размах Монферрата простирается на Средиземноморье."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Пьемонт"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Пьемонт закреплён — ополчения Северной Италии идут под знаменем Монферрата."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Казале"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Казале-Монферрато бьётся торговым сердцем маркграфства."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Савойя"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Савойя — соперница в борьбе за Пьемонт — получила отпор и подавлена."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Ломбардия"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Ломбардия — сердце Северной Италии — под властью Монферрата."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Генуя"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "Гордая Генуя захвачена — двери средиземноморской торговли распахнуты."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Торговля"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Построена торговая держава, охватывающая Ломбардию, Лигурию и Венето."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Эмилия"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "Плодородный южный берег долины По — Болонья, Парма, Модена — завоёван."
 STATIC_MODIFIER_NAME_mon_hre_mod: "СРИ"
 STATIC_MODIFIER_DESC_mon_hre_mod: "Отношения со Священной Римской империей определены — Монферрат обретает дипломатический вес."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Расцвет Казале"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Казале вступает в золотой век учёности и богатства — культурный маяк Северной Италии."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Возрождение"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Создан двор Возрождения — византийское классическое знание сплавляется с итальянскими новшествами в искусстве."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Кондотьеры"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Традиция кондотьеров взращена — наёмники дешевеют, содержание войск улучшается."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Благословение папы"
 STATIC_MODIFIER_DESC_mon_papal_mod: "Благословение папы узаконивает замыслы Монферрата по всему Апеннинскому полуострову."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Тоскана"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Тоскана — родина культуры Возрождения Медичи — завоёвана и закреплена."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Венето"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "Венето вместе с Венецией завоёвано — господство над Северной Италией завершено."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Наследие"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "Всё византийское наследие обретено — бюрократия, акведуки и легитимность текут из Древнего Рима."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Флот"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Построен мощный адриатический флот, соединивший морскую силу Генуи и Венеции."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Южная Италия"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Южная Италия и Неаполь захвачены — Апеннинский полуостров един под одним знаменем."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Великий маркиз"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "Правит великий маркиз Италии, соединивший Восток и Запад, Север и Юг."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Новый Рим"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "Провозглашена Новая Римская империя — преемница и Восточного, и Западного Рима."
 mon_carta_di_franchigia: "Вольная грамота"
 mon_carta_di_franchigia_desc: "Carta di Franchigia — «Вольная грамота». Маркиз Монферрата дарует каждому городу самоуправление и привилегии, и купцы, крестьяне и горожане получают благодатную почву для процветания. Как некогда Казале расцвёл под такой грамотой, так и всё маркграфство вкусит её благ."
 mon_acqui_terme: "Развитие Акви-Терме"
 mon_acqui_terme_desc: "Акви-Терме славится как «город горячих источников» со времён Древнего Рима. Возродите его знаменитые воды. Целебные источники, которые некогда посещали римские императоры, станут новой гордостью Монферрата: город здоровья, возрождённый, притянет гостей издалека."
 STATIC_MODIFIER_NAME_mon_city_charter_mod: "Вольная грамота провозглашена"
 STATIC_MODIFIER_DESC_mon_city_charter_mod: "Вольная грамота провозглашена — в каждом городе открыто городское право «Вольная грамота», высвобождающее силы купцов, крестьян и горожан."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Акви-Терме возрождён"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Древнеримские горячие источники восстановлены — Акви возрождён как город здоровья и процветания."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "Меркнущий свет Византии"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "Византийское наследие озаряет Монферрат — его легитимность тихо начинает расти."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "Величие Новой Византии"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "Мечта Палеологов сбылась — имперское управление, морская мощь и сеть дорог стали силой Монферрата."
