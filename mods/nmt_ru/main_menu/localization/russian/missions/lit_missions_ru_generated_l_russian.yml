l_russian:
 lit_lithuania_mission_pack: "From the Baltic to the Black Sea"
 lit_lithuania_mission_pack_DESCRIPTION: "In 1337, the Grand Duchy of Lithuania under Grand Duke Gediminas is the most dynamic power in Eastern Europe. Defeat the Teutonic Knights, conquer Ruthenia, reach the Black Sea, form a Commonwealth with Poland — and choose your faith to define Lithuania's soul."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION: "Conquer from the Baltic to the Black Sea, and form a Commonwealth with Poland to build the Lithuanian Grand Empire."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP: "Dominate Eastern Europe from the Baltic to the Black Sea as Lithuania."
 lit_lithuania_mission_pack_BUTTON_DETAILS: "'Lithuania's land, forever' — from Gediminas to Vytautas, restore the glory of the Grand Duchy!"
 lit_gediminas_legacy: "The Legacy of the Gediminids"
 lit_gediminas_legacy_desc: "Inherit the dynastic foundations laid by Grand Duke Gediminas, and walk the path toward a great empire stretching from the Baltic to the Black Sea."
 lit_teutonic_threat: "The Teutonic Threat"
 lit_teutonic_threat_desc: "The Teutonic Order, marching east under the crusader banner — this religious military state is Lithuania's greatest enemy. Contain them and secure the western frontier."
 lit_black_ruthenia_integration: "Integration of Black Ruthenia"
 lit_black_ruthenia_integration_desc: "Black Ruthenia — centered on Grodno and Brest, bring this land into Lithuania's domain as a foundation for eastward expansion."
 lit_volhynia_podolia: "Volhynia and Podolia"
 lit_volhynia_podolia_desc: "Volhynia and Podolia — bring the rich plains of western Ukraine under Lithuanian control, and open the road to the Black Sea."
 lit_smolensk: "Conquest of Smolensk"
 lit_smolensk_desc: "Smolensk — a strategic gateway to eastern Rus. Seize this fortress city and increase the pressure on Moscow."
 lit_kyiv: "Conquest of Kyiv"
 lit_kyiv_desc: "Kyiv — the mother of all Rus cities. When Lithuania seizes Kyiv, the path opens to becoming 'ruler of all Rus.'"
 lit_steppe_frontier: "The Steppe Frontier"
 lit_steppe_frontier_desc: "The great steppe roamed by Tatars and Cumans — establish a line of defense in this dangerous borderland, and open the road toward Crimea."
 lit_crimea: "Subjugation of Crimea"
 lit_crimea_desc: "The Crimean Peninsula — key to the Black Sea. Subdue the Tatar Khanate of Crimea and secure the gateway to the Black Sea."
 lit_black_sea: "Master of the Black Sea"
 lit_black_sea_desc: "The Black Sea — Lithuania's sea. From Crimea to Odessa, dye the entire Black Sea coast with the Lithuanian banner."
 lit_dominant_in_rus: "Dominant in Rus"
 lit_dominant_in_rus_desc: "Moscow, or Lithuania — in the struggle for supremacy over Eastern Europe, Lithuania triumphs and reigns as 'ruler of all Rus.'"
 lit_teutonic_defeat: "Fall of the Teutonic Knights"
 lit_teutonic_defeat_desc: "The old enemy since Grunwald, the Teutonic Order, has at last fallen — mastery of the Baltic belongs to Lithuania."
 lit_samogitia: "Samogitia"
 lit_samogitia_desc: "Samogitia — a land long contested with the Teutonic Order. Reclaim this stubborn Baltic people's homeland for Lithuania."
 lit_livonia: "Mastery of Livonia"
 lit_livonia_desc: "Riga and Livonia — bring the heart of Baltic trade under Lithuanian control, and establish influence over the Hanseatic League."
 lit_red_ruthenia: "Conquest of Red Ruthenia"
 lit_red_ruthenia_desc: "Red Ruthenia and Galicia — contested by Poland and Hungary, seize this land for Lithuania and extend its domain to the Carpathians."
 lit_moldavia: "Subjugation of Moldavia"
 lit_moldavia_desc: "Moldavia — a Romanian principality along the Danube. Subjugate this state and establish a foothold into the Balkans."
 lit_jogaila_union: "The Union of Jogaila"
 lit_jogaila_union_desc: "The union of Grand Duke Jogaila with the Kingdom of Poland — through conversion to Catholicism and marriage, Lithuania and Poland are bound together."
 lit_jagiellonian_dynasty: "The Jagiellonian Dynasty"
 lit_jagiellonian_dynasty_desc: "The Jagiellonian dynasty — ruling both Lithuania and Poland, this house rises as the greatest power in Central Europe."
 lit_lublin_union: "Union of Lublin"
 lit_lublin_union_desc: "The 1569 Union of Lublin — the historic moment when Lithuania and Poland are joined as the 'Polish-Lithuanian Commonwealth.'"
 lit_szlachta: "The Rights of the Szlachta"
 lit_szlachta_desc: "The Szlachta — the noble class of Poland-Lithuania. Guaranteeing their rights lays the foundation of the 'Golden Freedom.'"
 lit_polish_sejm: "The Polish Sejm"
 lit_polish_sejm_desc: "The Sejm — this institution, through which the szlachta take part in the state's decisions, becomes the heart of the Commonwealth."
 lit_commonwealth: "Completion of the Commonwealth"
 lit_commonwealth_desc: "The Polish-Lithuanian Commonwealth — the greatest state in Central Europe, stretching from the Baltic to the Black Sea, is complete. 'For our freedom' — this Commonwealth's banner shines across Europe."
 lit_faith_choice: "The Choice of Faith"
 lit_faith_choice_desc: "Catholic, Orthodox, or Romuva — which faith will Lithuania choose? This decision will determine the nation's future."
 lit_catholic_baptism: "Baptism into the Catholic Faith"
 lit_catholic_baptism_desc: "The 1387 baptism of Vilnius — Lithuania embraces Catholicism and becomes part of European Christendom."
 lit_catholic_crusade: "Catholic Crusade"
 lit_catholic_crusade_desc: "Under the Catholic banner — by striking back against the pagan crusader state of the Teutonic Order, Lithuania is recognized as a guardian of the Catholic world."
 lit_catholic_bishoprics: "Establishment of Bishoprics"
 lit_catholic_bishoprics_desc: "The Diocese of Vilnius — organize the structure of the Catholic Church in Lithuania and let the faith take deep root."
 lit_catholic_king: "Coronation of the Catholic King"
 lit_catholic_king_desc: "The Catholic King of Poland-Lithuania — a legitimate crown, recognized by the Pope, now shines upon the Jagiellonian dynasty."
 lit_orthodox_metropolis: "The Orthodox Metropolis"
 lit_orthodox_metropolis_desc: "The Metropolis of Kyiv — Lithuania takes the center of Rus Orthodoxy under its protection. Reign over Eastern Europe as guardian of the Orthodox faithful."
 lit_orthodox_third_rome: "The Third Rome"
 lit_orthodox_third_rome_desc: "Now that Constantinople has fallen — Kyiv becomes the new center of Orthodoxy, the 'Third Rome.'"
 lit_orthodox_unity: "Unity of the Orthodox Church"
 lit_orthodox_unity_desc: "Unity of the Orthodox faithful — the Orthodox churches of all Rus gather under Lithuania's protection."
 lit_orthodox_tsar: "The Orthodox Tsar"
 lit_orthodox_tsar_desc: "'Tsar of all Rus' — a Lithuanian monarch combining Orthodox authority with dominion over Rus surpasses Moscow itself."
 lit_romuva_maintained: "Preserving Romuva"
 lit_romuva_maintained_desc: "Romuva, the ancient Baltic faith — the eternal flame of Znich burns anew, as Lithuania stands beneath the pagan banner."
 lit_romuva_sanctuary: "Establishing the Sanctuary"
 lit_romuva_sanctuary_desc: "The sacred groves of Lithuania — protect the sanctuaries of Romuva and establish the spiritual center of the Baltic faith."
 lit_romuva_expansion: "Pagan Expansion"
 lit_romuva_expansion_desc: "Spread Romuva by the sword — convert the surrounding Orthodox, Catholics, and Muslims to Romuva, and build a 'great pagan state.'"
 lit_romuva_pagan_king: "The Pagan King"
 lit_romuva_pagan_king_desc: "'Great Pagan King' — a Lithuanian pagan monarch is born, raising the flame of Romuva and reigning from the Baltic to the Steppe."
 lit_vilnius_capital: "Development of Vilnius"
 lit_vilnius_capital_desc: "Vilnius — Lithuania's golden city. Develop its palaces, cathedral, and markets, and give it a splendor worthy of an imperial capital."
 lit_amber_road: "The Amber Road"
 lit_amber_road_desc: "The Amber Road — seize this trade route by which Baltic amber is carried to the Mediterranean, and make Lithuania a hub of European commerce."
 lit_grand_duchy_law: "The Grand Duchy Statute"
 lit_grand_duchy_law_desc: "The Lithuanian Statute — enacted in 1529 as the most advanced legal code in Central Europe, modernize Lithuania's governance."
 lit_multicultural: "The Multicultural Empire"
 lit_multicultural_desc: "Lithuanians, Ruthenians, Poles, Tatars, Jews — establish the 'tradition of tolerance' of a Grand Duchy where diverse peoples coexist."
 lit_lithuanian_army: "The Lithuanian Army"
 lit_lithuanian_army_desc: "Lithuania's mixed army, combining heavy cavalry with light Tatar horsemen — cultivate a unique military power fusing European and steppe tactics."
 lit_polish_culture: "Embrace of Polish Culture"
 lit_polish_culture_desc: "The Renaissance and Polish culture — a golden age of scholarship and art dawns in Lithuania through the universities of Kraków and Vilnius."
 lit_krakow: "Development of Kraków"
 lit_krakow_desc: "Kraków — develop this city of Jagiellonian glory, and let it shine as the second capital of the Polish-Lithuanian Commonwealth."
 lit_red_ruthenia: "Conquest of Red Ruthenia"
 lit_red_ruthenia_desc: "Red Ruthenia and Galicia — contested by Poland and Hungary, seize this land for Lithuania and extend its domain to the Carpathians."
 lit_moldavia: "Subjugation of Moldavia"
 lit_moldavia_desc: "Moldavia — a Romanian principality along the Danube. Subjugate this state and establish a foothold into the Balkans."
 lit_grand_empire: "The Lithuanian Grand Empire"
 lit_grand_empire_desc: "'From the Baltic to the Black Sea' — Grand Duke Vytautas' dream is realized. The Grand Duchy of Lithuania reigns as Europe's greatest empire."
 lit_events.5.t: "The Choice of Faith"
 lit_events.5.d: "Lithuania stands at a crossroads. Convert to Catholicism and deepen the alliance with Poland? Protect Orthodoxy and become the guardian of Rus? Or preserve the ancestral faith of Romuva and stand as a great pagan king?"
 lit_events.5.a: "Convert to Catholicism — join Christendom and deepen the Polish alliance"
 lit_events.5.b: "Choose Orthodoxy — become the guardian of Rus and Eastern Christendom"
 lit_events.5.c: "Preserve Romuva — never let the sacred flame of Znich die out"
 lit_events.10.t: "Conquest of Kyiv"
 lit_events.10.d: "Kyiv — the mother of all Rus cities — has fallen to Lithuania. It is Lithuania, not Moscow, that now bears the legacy of Kyivan Rus."
 lit_events.10.a: "Long live Kyiv! Long live the guardian of all Rus!"
 lit_events.15.t: "The Catholic King"
 lit_events.15.d: "Under papal recognition, the Catholic King of Lithuania and Poland is crowned — Lithuania is now formally part of the Catholic world."
 lit_events.15.a: "Long live the Catholic King! May the kingdom endure forever!"
 lit_events.16.t: "Tsar of Lithuania"
 lit_events.16.d: "The ruler of Lithuania proclaims himself 'Tsar of all Rus' — guardian of the Orthodox faith. It is Vilnius, not Moscow, that shall be the Third Rome."
 lit_events.16.a: "Long live the Tsar! Long live the Third Rome!"
 lit_events.17.t: "The Pagan King"
 lit_events.17.d: "The eternal flame of Znich burns bright — a 'Great Pagan King' has risen under the banner of Romuva, reigning from the Baltic to the Steppe."
 lit_events.17.a: "Long live the Pagan King! May Romuva's flame burn eternal!"
 lit_events.20.t: "Fall of the Teutonic Order"
 lit_events.20.d: "From Grunwald to the final reckoning — the Teutonic Order has fallen at last. The Baltic Sea belongs to Lithuania."
 lit_events.20.a: "The Teutonic Order is defeated! The Baltic Sea is ours!"
 lit_events.30.t: "Union of Lublin"
 lit_events.30.d: "1569 — Lithuania and Poland unite at Lublin to form the 'Polish-Lithuanian Commonwealth.' Two nations become one, creating Europe's largest state."
 lit_events.30.a: "Long live the Commonwealth! For our freedom and yours!"
 lit_events.50.t: "The Commonwealth's Golden Age"
 lit_events.50.d: "From the Baltic to the Black Sea — the Polish-Lithuanian Commonwealth enters its Golden Age as Europe's greatest power."
 lit_events.50.a: "Long live the Golden Age! Long live the Commonwealth!"
 lit_events.99.t: "The Lithuanian Grand Empire"
 lit_events.99.d: "From the Baltic to the Black Sea — Vytautas' dream is fulfilled. Lithuania reigns as Eastern Europe's greatest empire, surpassing old Rus itself."
 lit_events.99.a: "Long live the Lithuanian Grand Empire! Glory eternal!"
