 STATIC_MODIFIER_DESC_lit_black_sea_mod: "The Black Sea has become Lithuania's inland sea, bringing an immense flow of trade income."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Authority of the Catholic King"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "Recognized across Europe as a Catholic king, Lithuania's diplomatic authority is established."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Baptism into Catholicism"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "Lithuania has converted to Catholicism and become part of European Christendom."
 STATIC_MODIFIER_NAME_lit_commonwealth_mod: "Prosperity of the Commonwealth"
 STATIC_MODIFIER_DESC_lit_commonwealth_mod: "The Polish-Lithuanian Commonwealth enters a golden age as Europe's greatest parliamentary state."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Subjugation of Crimea"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "The Crimean Peninsula has come under Lithuanian control, opening the gateway to the Black Sea."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Crusading Spirit"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "The Catholic crusading spirit has forged the Lithuanian army."
 STATIC_MODIFIER_NAME_lit_culture_mod: "Embrace of Renaissance Culture"
 STATIC_MODIFIER_DESC_lit_culture_mod: "The Renaissance in Kraków and Vilnius heralds Lithuania's golden age."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "Awakening of the Gediminid Dynasty"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "The blood of the Gediminids kindles ambitions for the conquest of Eastern Europe."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Completion of the Lithuanian Grand Empire"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "From the Baltic to the Black Sea — Grand Duke Vytautas' dream is realized."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Rule of the Jagiellonian Dynasty"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "The Jagiellonian dynasty rises as the greatest royal house in Central Europe."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "The Union of Jogaila"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "The alliance with Poland has greatly strengthened Lithuania's diplomatic standing."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Prosperity of Kraków"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Kraków shines as a city of Jagiellonian glory."
 STATIC_MODIFIER_NAME_lit_law_mod: "The Grand Duchy Statute Established"
 STATIC_MODIFIER_DESC_lit_law_mod: "The Lithuanian Statute has been enacted, modernizing governance."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Mastery of Livonia"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Livonia, the heart of Baltic trade, now stands under the Lithuanian banner."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Subjugation of Moldavia"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Moldavia, as a vassal of Lithuania, becomes a foothold into the Balkans."
 STATIC_MODIFIER_NAME_lit_multicultural_mod: "Establishment of the Multicultural Empire"
 STATIC_MODIFIER_DESC_lit_multicultural_mod: "Lithuania's 'tradition of tolerance,' where diverse peoples, faiths, and cultures coexist, is established."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Protection of the Orthodox Church"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Lithuania has taken the Orthodox Church under its protection and is recognized as guardian of Rus."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "The Orthodox Tsar"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "As Tsar of all Rus, Lithuania reigns as leader of the Orthodox world."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Unity of the Orthodox Church"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "The Orthodox churches of all Rus have gathered under the Lithuanian banner."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Hegemony of the Great Pagan King"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Beneath the banner of Romuva, the pagan king reigns from the Baltic to the Steppe."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Pagan Expansion"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Under the pagan banner, the Lithuanian army sweeps across neighboring states."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Conquest of Red Ruthenia"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "Red Ruthenia and Galicia have joined Lithuania's domain."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Revival of Romuva"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "Romuva, the ancient Baltic faith, is revived, and Lithuania stands as a pagan state."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Ruler of Rus"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Lithuania has become ruler of all Rus and leader of Eastern Europe."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Subjugation of Black Ruthenia"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "Black Ruthenia has joined Lithuania's domain, establishing a foundation for eastward expansion."
 STATIC_MODIFIER_NAME_lit_samogitia_mod: "Subjugation of Samogitia"
 STATIC_MODIFIER_DESC_lit_samogitia_mod: "Samogitia has returned to Lithuania's domain, securing control of the Baltic."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Establishment of the Romuva Sanctuary"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "The sacred groves of Lithuania are established, and the pagan flame burns bright."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Establishment of the Sejm"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "The Sejm is established, modernizing Lithuania's governance."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Mastery of Smolensk"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Smolensk functions as Lithuania's eastern gatekeeper."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Establishment of the Steppe Frontier"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "The steppe frontier is established, halting Tatar incursions."
 STATIC_MODIFIER_NAME_lit_szlachta_mod: "The Golden Freedom of the Szlachta"
 STATIC_MODIFIER_DESC_lit_szlachta_mod: "The rights of the szlachta are guaranteed, establishing the foundation of Poland-Lithuania's parliamentary politics."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Resistance to the Teutonic Order"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "The threat of the Teutonic Order has forged the Lithuanian army."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "The Third Rome"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Kyiv has become the 'Third Rome,' the center of the Orthodox Church."
 STATIC_MODIFIER_NAME_lit_vilnius_mod: "Prosperity of Vilnius"
 STATIC_MODIFIER_DESC_lit_vilnius_mod: "Vilnius begins to shine as the capital of the Lithuanian Empire."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Conquest of Volhynia and Podolia"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "The plains of western Ukraine are dyed with the Lithuanian banner."
 lit_orthodox_conversion: "Conversion to Orthodoxy"
 lit_orthodox_conversion_desc: "The faith of the Rus people — by choosing Orthodoxy, Lithuania can claim the role of guardian of the Orthodox world. But friction with the Romuva faithful at home is inevitable."
 STATIC_MODIFIER_NAME_lit_orthodox_conversion_mod: "Wave of Orthodox Conversion"
 STATIC_MODIFIER_DESC_lit_orthodox_conversion_mod: "Orthodox conversion spreads — the Rus people begin to gather under the Lithuanian banner."
 lit_vilnius_jerusalem: "The Jerusalem of the North"
 lit_vilnius_jerusalem_desc: "Vilnius — 'The Jerusalem of the North.' Art and population flock to this city where diverse religions and cultures coexist, shining as Lithuania's cultural center in Europe."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "Jerusalem of the North"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Vilnius becomes 'The Jerusalem of the North' — a center for diverse peoples, religions, and cultures."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Defeat of the Teutonic Order"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "The Teutonic Order is destroyed — Lithuania's military discipline and conquest capacity greatly improved."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Vilnius Developed"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Vilnius developed as the imperial capital — monthly prosperity and development improved."
 lit_memel: "Klaipėda — Gateway to the Baltic"
 lit_memel_desc: "Klaipėda (Memel) — a port city on the Baltic coast. Reclaimed from the Teutonic Order, develop this city as Lithuania's gateway to the sea and the center of the amber trade."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Klaipėda Port Developed"
 STATIC_MODIFIER_DESC_lit_memel_mod: "Klaipėda port developed as the gateway to Baltic trade."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Benefits of the Union of Lublin"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "The parliamentary system and administration of the Commonwealth are established."
 lit_lublin_dev: "Development of Lublin"
 lit_lublin_dev_desc: "Lublin — the future site of the Union of Lublin. Develop this city as the administrative and commercial center of southern Lithuania."
 lit_lviv_dev: "Development of Lviv"
 lit_lviv_dev_desc: "Lviv (Lemberg) — a crossroads of eastern trade. Develop the center of Galicia and promote prosperity in the empire's southeast."
 lit_kaunas_dev: "Kaunas — Guardian of Lithuanian Law"
 lit_kaunas_dev_desc: "Kaunas (Kowno) — at the confluence of the Neris and Nemunas rivers, this city served as the seat of the Lithuanian Grand Duchy Tribunal (Lietuvos Vyriausiasis Tribunolas), functioning as the highest court of appeals for the Lithuanian side of the Commonwealth. Like the Royal Court of Kraków in Poland or the Parlement d'Aix in Provence, Kaunas served as a guardian of regional law, bridging central legislation and local customs. Develop Kaunas as the center of Lithuanian judicial administration."
 lit_hrodna_dev: "Development of Hrodna"
 lit_hrodna_dev_desc: "Hrodna (Grodno) — the center of Black Ruthenia. Develop this key western city of the Grand Duchy."
 lit_minsk_dev: "Development of Minsk"
 lit_minsk_dev_desc: "Minsk — the center of Belarus. Develop it as the eastern administrative hub of the Lithuanian Empire."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "Commonwealth Completed"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "The Polish-Lithuanian Commonwealth is complete — administration and military across all territories are organized."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Lublin Prosperous"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Lublin developed as the administrative and commercial center of southern Lithuania."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Lviv Prosperous"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Lviv flourishes as a crossroads of eastern trade."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Lithuanian Grand Duchy Tribunal"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Kaunas developed as an inland hub for Baltic trade."
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "Hrodna Administrative Reinforcement"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "Hrodna developed — administrative reach from the capital greatly improved."
 STATIC_MODIFIER_NAME_lit_minsk_mod: "Minsk Prosperous"
 STATIC_MODIFIER_DESC_lit_minsk_mod: "Minsk developed as the eastern administrative hub of the Lithuanian Empire."
