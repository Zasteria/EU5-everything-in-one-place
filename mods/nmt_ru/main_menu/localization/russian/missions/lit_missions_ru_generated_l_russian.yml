l_russian:
 lit_lithuania_mission_pack: "От моря до моря"
 lit_lithuania_mission_pack_DESCRIPTION: "В 1337 году Великое княжество Литовское под властью великого князя Гедимина — самая стремительно растущая держава Восточной Европы. Разбейте тевтонских рыцарей, завоюйте Русь, выйдите к Чёрному морю, заключите союз с Польшей в Речь Посполитую — и выберите веру, которая определит душу Литвы."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION: "Завоюйте земли от Балтики до Чёрного моря и вместе с Польшей образуйте Речь Посполитую, чтобы построить Великую Литовскую империю."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP: "Властвуйте над Восточной Европой от Балтики до Чёрного моря как Литва."
 lit_lithuania_mission_pack_BUTTON_DETAILS: "«Литовская земля — навеки»: от Гедимина до Витовта, верните славу Великого княжества!"
 lit_gediminas_legacy: "Наследие Гедиминовичей"
 lit_gediminas_legacy_desc: "Примите династическое наследие, заложенное великим князем Гедимином, и встаньте на путь к великой державе от Балтики до Чёрного моря."
 lit_teutonic_threat: "Тевтонская угроза"
 lit_teutonic_threat_desc: "Тевтонский орден, идущий на восток под знаменем крестового похода, — это духовно-рыцарское государство главный враг Литвы. Сдержите его и обезопасьте западную границу."
 lit_black_ruthenia_integration: "Присоединение Чёрной Руси"
 lit_black_ruthenia_integration_desc: "Чёрная Русь с Гродно и Брестом — присоедините эти земли к владениям Литвы как опору для движения на восток."
 lit_volhynia_podolia: "Волынь и Подолье"
 lit_volhynia_podolia_desc: "Волынь и Подолье — возьмите под власть Литвы богатые равнины Западной Украины и откройте дорогу к Чёрному морю."
 lit_smolensk: "Завоевание Смоленска"
 lit_smolensk_desc: "Смоленск — важнейшие ворота на восток Руси. Захватите эту крепость и усильте давление на Москву."
 lit_kyiv: "Завоевание Киева"
 lit_kyiv_desc: "Киев — мать городов русских. Взяв Киев, Литва откроет себе путь к титулу «государя всея Руси»."
 lit_steppe_frontier: "Степное пограничье"
 lit_steppe_frontier_desc: "Великая степь, где кочуют татары и половцы. Выстройте оборону на этой опасной окраине и откройте путь к Крыму."
 lit_crimea: "Покорение Крыма"
 lit_crimea_desc: "Крымский полуостров — ключ к Чёрному морю. Покорите Крымское ханство и откройте себе ворота к морю."
 lit_black_sea: "Владычица Чёрного моря"
 lit_black_sea_desc: "Чёрное море — море Литвы. От Крыма до Одессы расцветите всё побережье литовскими знамёнами."
 lit_dominant_in_rus: "Первенство на Руси"
 lit_dominant_in_rus_desc: "Москва или Литва? В борьбе за первенство в Восточной Европе побеждает Литва и правит как «государь всея Руси»."
 lit_teutonic_defeat: "Падение Тевтонского ордена"
 lit_teutonic_defeat_desc: "Давний враг со времён Грюнвальда, Тевтонский орден, наконец пал — господство на Балтике принадлежит Литве."
 lit_samogitia: "Самогития"
 lit_samogitia_desc: "Самогития — земля, за которую Литва долго спорила с Тевтонским орденом. Верните родину этого упрямого балтийского народа в состав Литвы."
 lit_livonia: "Власть над Ливонией"
 lit_livonia_desc: "Рига и Ливония — возьмите под контроль Литвы сердце балтийской торговли и распространите влияние на Ганзейский союз."
 lit_red_ruthenia: "Завоевание Червонной Руси"
 lit_red_ruthenia_desc: "Червонная Русь и Галиция, за которые спорят Польша и Венгрия. Захватите эти земли для Литвы и раздвиньте её владения до Карпат."
 lit_moldavia: "Подчинение Молдавии"
 lit_moldavia_desc: "Молдавия — румынское княжество у Дуная. Подчините его и закрепитесь на пути к Балканам."
 lit_jogaila_union: "Уния Ягайло"
 lit_jogaila_union_desc: "Союз великого князя Ягайло с Польским королевством: крещение в католичество и брак навсегда связывают Литву и Польшу."
 lit_jagiellonian_dynasty: "Династия Ягеллонов"
 lit_jagiellonian_dynasty_desc: "Ягеллоны правят и Литвой, и Польшей — этот дом становится величайшей силой Центральной Европы."
 lit_lublin_union: "Люблинская уния"
 lit_lublin_union_desc: "Люблинская уния 1569 года — исторический миг, когда Литва и Польша объединяются в Речь Посполитую."
 lit_szlachta: "Права шляхты"
 lit_szlachta_desc: "Шляхта — дворянство Польши и Литвы. Гарантии её прав закладывают основу «Золотой вольности»."
 lit_polish_sejm: "Польский сейм"
 lit_polish_sejm_desc: "Сейм, через который шляхта участвует в решениях державы, становится сердцем Речи Посполитой."
 lit_commonwealth: "Становление Речи Посполитой"
 lit_commonwealth_desc: "Речь Посполитая — величайшее государство Центральной Европы, от Балтики до Чёрного моря, построена. «За нашу и вашу свободу» — её знамя сияет над Европой."
 lit_faith_choice: "Выбор веры"
 lit_faith_choice_desc: "Католичество, православие или Ромува — какую веру выберет Литва? От этого решения зависит будущее народа."
 lit_catholic_baptism: "Крещение в католичество"
 lit_catholic_baptism_desc: "Крещение Вильнюса в 1387 году: Литва принимает католичество и входит в европейский христианский мир."
 lit_catholic_crusade: "Католический крестовый поход"
 lit_catholic_crusade_desc: "Под католическим знаменем Литва наносит ответный удар крестоносному государству Тевтонского ордена и обретает признание защитницы католического мира."
 lit_catholic_bishoprics: "Учреждение епархий"
 lit_catholic_bishoprics_desc: "Виленская епархия — выстройте в Литве устройство католической церкви, чтобы вера пустила глубокие корни."
 lit_catholic_king: "Коронация католического короля"
 lit_catholic_king_desc: "Католический король Польши и Литвы: законная корона, признанная папой, теперь сияет над династией Ягеллонов."
 lit_orthodox_metropolis: "Православная митрополия"
 lit_orthodox_metropolis_desc: "Киевская митрополия — Литва берёт под защиту средоточие русского православия. Правьте Восточной Европой как покровитель православных."
 lit_orthodox_third_rome: "Третий Рим"
 lit_orthodox_third_rome_desc: "Константинополь пал — и Киев становится новым средоточием православия, «Третьим Римом»."
 lit_orthodox_unity: "Единство православной церкви"
 lit_orthodox_unity_desc: "Единство православных — церкви всей Руси собираются под покровительством Литвы."
 lit_orthodox_tsar: "Православный царь"
 lit_orthodox_tsar_desc: "«Царь всея Руси»: литовский государь, соединивший православную власть с господством над Русью, превосходит саму Москву."
 lit_romuva_maintained: "Сохранение Ромувы"
 lit_romuva_maintained_desc: "Ромува, древняя вера балтов: вечный огонь Знича разгорается вновь, и Литва встаёт под языческое знамя."
 lit_romuva_sanctuary: "Учреждение святилища"
 lit_romuva_sanctuary_desc: "Священные рощи Литвы — сберегите святилища Ромувы и создайте духовное средоточие балтийской веры."
 lit_romuva_expansion: "Языческая экспансия"
 lit_romuva_expansion_desc: "Несите Ромуву мечом: обратите окрестных православных, католиков и мусульман в Ромуву и постройте «великую языческую державу»."
 lit_romuva_pagan_king: "Языческий король"
 lit_romuva_pagan_king_desc: "«Великий языческий король» — рождается литовский государь-язычник, который поднимает огонь Ромувы и правит от Балтики до степи."
 lit_vilnius_capital: "Развитие Вильнюса"
 lit_vilnius_capital_desc: "Вильнюс — золотой город Литвы. Отстройте дворцы, собор и рынки и придайте ему блеск, достойный имперской столицы."
 lit_amber_road: "Янтарный путь"
 lit_amber_road_desc: "Янтарный путь, которым балтийский янтарь везут к Средиземному морю, — возьмите его в свои руки и сделайте Литву узлом европейской торговли."
 lit_grand_duchy_law: "Статут Великого княжества"
 lit_grand_duchy_law_desc: "Литовский статут — принятый в 1529 году, самый передовой свод законов Центральной Европы, — осовременит управление Литвой."
 lit_multicultural: "Многонародная держава"
 lit_multicultural_desc: "Литовцы, русины, поляки, татары, евреи — утвердите в Великом княжестве, где уживаются разные народы, «традицию терпимости»."
 lit_lithuanian_army: "Литовское войско"
 lit_lithuanian_army_desc: "Смешанное войско Литвы, где тяжёлая конница стоит рядом с лёгкими татарскими всадниками, — вырастите особую силу, сплавившую европейскую и степную тактику."
 lit_polish_culture: "Польская культура"
 lit_polish_culture_desc: "Возрождение и польская культура: через университеты Кракова и Вильнюса в Литву приходит золотой век науки и искусства."
 lit_krakow: "Развитие Кракова"
 lit_krakow_desc: "Краков, город славы Ягеллонов, — развивайте его, чтобы он сиял как вторая столица Речи Посполитой."
 lit_red_ruthenia: "Завоевание Червонной Руси"
 lit_red_ruthenia_desc: "Червонная Русь и Галиция, за которые спорят Польша и Венгрия. Захватите эти земли для Литвы и раздвиньте её владения до Карпат."
 lit_moldavia: "Подчинение Молдавии"
 lit_moldavia_desc: "Молдавия — румынское княжество у Дуная. Подчините его и закрепитесь на пути к Балканам."
 lit_grand_empire: "Великая Литовская империя"
 lit_grand_empire_desc: "«От моря до моря» — мечта великого князя Витовта сбылась. Великое княжество Литовское правит как величайшая империя Европы."
 lit_events.5.t: "Выбор веры"
 lit_events.5.d: "Литва на распутье. Принять католичество и укрепить союз с Польшей? Защитить православие и стать покровителем Руси? Или сохранить веру предков, Ромуву, и встать великим языческим королём?"
 lit_events.5.a: "Принять католичество — войти в христианский мир и укрепить союз с Польшей"
 lit_events.5.b: "Выбрать православие — стать покровителем Руси и восточного христианства"
 lit_events.5.c: "Сохранить Ромуву — священный огонь Знича не угаснет никогда"
 lit_events.10.t: "Завоевание Киева"
 lit_events.10.d: "Киев, мать городов русских, пал перед Литвой. Теперь наследие Киевской Руси несёт Литва, а не Москва."
 lit_events.10.a: "Да здравствует Киев! Да здравствует покровитель всей Руси!"
 lit_events.15.t: "Католический король"
 lit_events.15.d: "С признания папы коронован католический король Литвы и Польши — отныне Литва по праву часть католического мира."
 lit_events.15.a: "Да здравствует католический король! Да стоит королевство вечно!"
 lit_events.16.t: "Царь Литвы"
 lit_events.16.d: "Государь Литвы провозглашает себя «царём всея Руси», защитником православной веры. Третьим Римом станет Вильнюс, а не Москва."
 lit_events.16.a: "Да здравствует царь! Да здравствует Третий Рим!"
 lit_events.17.t: "Языческий король"
 lit_events.17.d: "Ярко горит вечный огонь Знича: под знаменем Ромувы поднялся «великий языческий король», и он правит от Балтики до степи."
 lit_events.17.a: "Да здравствует языческий король! Да горит огонь Ромувы вечно!"
 lit_events.20.t: "Падение Тевтонского ордена"
 lit_events.20.d: "От Грюнвальда до последней расплаты — Тевтонский орден наконец пал. Балтийское море принадлежит Литве."
 lit_events.20.a: "Тевтонский орден разбит! Балтика наша!"
 lit_events.30.t: "Люблинская уния"
 lit_events.30.d: "1569 год: в Люблине Литва и Польша объединяются в Речь Посполитую. Два народа становятся одним, и рождается крупнейшее государство Европы."
 lit_events.30.a: "Да здравствует Речь Посполитая! За нашу и вашу свободу!"
 lit_events.50.t: "Золотой век Речи Посполитой"
 lit_events.50.d: "От Балтики до Чёрного моря — Речь Посполитая вступает в золотой век как величайшая держава Европы."
 lit_events.50.a: "Да здравствует золотой век! Да здравствует Речь Посполитая!"
 lit_events.99.t: "Великая Литовская империя"
 lit_events.99.d: "От Балтики до Чёрного моря — мечта Витовта исполнилась. Литва правит как величайшая империя Восточной Европы, превзойдя саму древнюю Русь."
 lit_events.99.a: "Да здравствует Великая Литовская империя! Вечная слава!"
 STATIC_MODIFIER_NAME_lit_amber_mod: "Власть над Янтарным путём"
 STATIC_MODIFIER_DESC_lit_amber_mod: "Балтийская торговля янтарём удваивает богатство Литвы."
 STATIC_MODIFIER_NAME_lit_army_mod: "Смешанное литовское войско"
 STATIC_MODIFIER_DESC_lit_army_mod: "Литовское войско, сплавившее европейскую конницу со степной тактикой, собрано."
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "Устройство епархий"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "Устройство католической церкви в Литве выстроено, и вера пустила глубокие корни."
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "Господство на Чёрном море"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "Чёрное море стало внутренним морем Литвы и приносит огромный поток торговых доходов."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Власть католического короля"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "Вся Европа признаёт Литву католическим королевством, и её дипломатический вес утвердился."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Крещение в католичество"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "Литва приняла католичество и вошла в европейский христианский мир."
 STATIC_MODIFIER_NAME_lit_commonwealth_mod: "Процветание Речи Посполитой"
 STATIC_MODIFIER_DESC_lit_commonwealth_mod: "Речь Посполитая вступает в золотой век как величайшее сословное государство Европы."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Покорение Крыма"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "Крымский полуостров перешёл под власть Литвы, ворота к Чёрному морю открыты."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Дух крестового похода"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "Католический дух крестового похода закалил литовское войско."
 STATIC_MODIFIER_NAME_lit_culture_mod: "Культура Возрождения"
 STATIC_MODIFIER_DESC_lit_culture_mod: "Возрождение в Кракове и Вильнюсе возвещает золотой век Литвы."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "Пробуждение Гедиминовичей"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "Кровь Гедиминовичей разжигает замыслы завоевать Восточную Европу."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Великая Литовская империя построена"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "От Балтики до Чёрного моря — мечта великого князя Витовта сбылась."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Правление Ягеллонов"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "Ягеллоны становятся величайшим королевским домом Центральной Европы."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "Уния Ягайло"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "Союз с Польшей сильно укрепил дипломатическое положение Литвы."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Процветание Кракова"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Краков сияет как город славы Ягеллонов."
 STATIC_MODIFIER_NAME_lit_law_mod: "Статут Великого княжества принят"
 STATIC_MODIFIER_DESC_lit_law_mod: "Литовский статут принят, управление осовременено."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Власть над Ливонией"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Ливония, сердце балтийской торговли, теперь под литовским знаменем."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Подчинение Молдавии"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Молдавия, вассал Литвы, становится опорой на пути к Балканам."
 STATIC_MODIFIER_NAME_lit_multicultural_mod: "Многонародная держава"
 STATIC_MODIFIER_DESC_lit_multicultural_mod: "В Литве утвердилась «традиция терпимости», где уживаются разные народы, веры и культуры."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Покровительство православной церкви"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Литва взяла православную церковь под защиту и признана покровителем Руси."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "Православный царь"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "Как царь всея Руси, литовский государь правит во главе православного мира."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Единство православной церкви"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "Православные церкви всей Руси собрались под литовским знаменем."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Господство великого языческого короля"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Под знаменем Ромувы языческий король правит от Балтики до степи."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Языческая экспансия"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Под языческим знаменем литовское войско сметает соседние государства."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Завоевание Червонной Руси"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "Червонная Русь и Галиция вошли во владения Литвы."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Возрождение Ромувы"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "Ромува, древняя вера балтов, возрождена, и Литва стоит как языческая держава."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Государь Руси"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Литва стала властительницей всей Руси и вождём Восточной Европы."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Подчинение Чёрной Руси"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "Чёрная Русь вошла во владения Литвы — опора для движения на восток заложена."
 STATIC_MODIFIER_NAME_lit_samogitia_mod: "Подчинение Самогитии"
 STATIC_MODIFIER_DESC_lit_samogitia_mod: "Самогития вернулась во владения Литвы, и власть над Балтикой упрочилась."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Святилище Ромувы"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Священные рощи Литвы учреждены, и языческий огонь горит ярко."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Учреждение сейма"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "Сейм учреждён, управление Литвой осовременено."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Власть над Смоленском"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Смоленск стоит восточным стражем Литвы."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Степное пограничье"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "Степной рубеж выстроен, татарские набеги остановлены."
 STATIC_MODIFIER_NAME_lit_szlachta_mod: "Золотая вольность шляхты"
 STATIC_MODIFIER_DESC_lit_szlachta_mod: "Права шляхты гарантированы, и основа сеймовой политики Польши и Литвы заложена."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Отпор Тевтонскому ордену"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "Угроза Тевтонского ордена закалила литовское войско."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "Третий Рим"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Киев стал «Третьим Римом», средоточием православной церкви."
 STATIC_MODIFIER_NAME_lit_vilnius_mod: "Процветание Вильнюса"
 STATIC_MODIFIER_DESC_lit_vilnius_mod: "Вильнюс начинает сиять как столица Литовской империи."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Завоевание Волыни и Подолья"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "Над равнинами Западной Украины реют литовские знамёна."
 lit_orthodox_conversion: "Переход в православие"
 lit_orthodox_conversion_desc: "Вера народа Руси: выбрав православие, Литва может притязать на роль покровителя православного мира. Но трения с приверженцами Ромувы внутри страны неизбежны."
 STATIC_MODIFIER_NAME_lit_orthodox_conversion_mod: "Волна обращений в православие"
 STATIC_MODIFIER_DESC_lit_orthodox_conversion_mod: "Православие распространяется — народ Руси начинает собираться под литовским знаменем."
 lit_vilnius_jerusalem: "Северный Иерусалим"
 lit_vilnius_jerusalem_desc: "Вильнюс — «Северный Иерусалим». В город, где уживаются разные веры и культуры, стекаются искусство и люди, и он сияет как культурное средоточие Литвы в Европе."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "Северный Иерусалим"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Вильнюс становится «Северным Иерусалимом» — средоточием разных народов, вер и культур."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Разгром Тевтонского ордена"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "Тевтонский орден уничтожен — воинская дисциплина Литвы и её способность к завоеваниям сильно выросли."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Вильнюс отстроен"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Вильнюс отстроен как имперская столица — ежемесячный рост процветания и развития усилен."
 lit_memel: "Клайпеда — ворота на Балтику"
 lit_memel_desc: "Клайпеда (Мемель) — портовый город на балтийском берегу. Отвоевав его у Тевтонского ордена, сделайте его морскими воротами Литвы и средоточием торговли янтарём."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Порт Клайпеды отстроен"
 STATIC_MODIFIER_DESC_lit_memel_mod: "Порт Клайпеды отстроен как ворота балтийской торговли."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Плоды Люблинской унии"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "Сеймовое устройство и управление Речи Посполитой утверждены."
 lit_lublin_dev: "Развитие Люблина"
 lit_lublin_dev_desc: "Люблин — место будущей Люблинской унии. Развивайте его как управленческое и торговое средоточие юга Литвы."
 lit_lviv_dev: "Развитие Львова"
 lit_lviv_dev_desc: "Львов (Лемберг) — перекрёсток восточной торговли. Развивайте средоточие Галиции и несите процветание на юго-восток державы."
 lit_kaunas_dev: "Каунас — страж литовского права"
 lit_kaunas_dev_desc: "Каунас (Ковно) у слияния Нериса и Немана был местом заседаний Главного трибунала Великого княжества Литовского (Lietuvos Vyriausiasis Tribunolas) — высшего апелляционного суда литовской половины Речи Посполитой. Как Коронный трибунал в Польше или Парламент Экса в Провансе, Каунас хранил местное право, связывая общие законы с местными обычаями. Развивайте Каунас как средоточие литовского правосудия."
 lit_hrodna_dev: "Развитие Гродно"
 lit_hrodna_dev_desc: "Гродно — средоточие Чёрной Руси. Развивайте этот важнейший западный город Великого княжества."
 lit_minsk_dev: "Развитие Минска"
 lit_minsk_dev_desc: "Минск — средоточие Белой Руси. Развивайте его как восточное управленческое средоточие Литовской империи."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "Речь Посполитая построена"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "Речь Посполитая построена — управление и войско во всех её землях упорядочены."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Процветание Люблина"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Люблин отстроен как управленческое и торговое средоточие юга Литвы."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Процветание Львова"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Львов процветает как перекрёсток восточной торговли."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Главный трибунал Великого княжества Литовского"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Каунас отстроен как внутренний узел балтийской торговли."
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "Гродно — опора управления"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "Гродно отстроен — власть столицы дотягивается гораздо дальше."
 STATIC_MODIFIER_NAME_lit_minsk_mod: "Процветание Минска"
 STATIC_MODIFIER_DESC_lit_minsk_mod: "Минск отстроен как восточное управленческое средоточие Литовской империи."
