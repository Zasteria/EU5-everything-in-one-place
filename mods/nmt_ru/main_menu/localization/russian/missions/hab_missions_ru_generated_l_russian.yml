 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "The silver mines of Tyrol sustain the finances of the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Declaration of the Universal Empire"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "'The Universal Empire' — all of Europe is united beneath the Habsburg banner."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "Seizure of Venice"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "The 'Queen of the Adriatic' now sustains the Habsburg Empire's naval power."
 STATIC_MODIFIER_NAME_hab_vienna_expand_mod: "The Greater City of Vienna"
 STATIC_MODIFIER_DESC_hab_vienna_expand_mod: "Vienna has begun its path toward becoming the greatest city in Europe."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Vienna — Heart of the Empire"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Vienna shines as the cultural and administrative center of the Empire."
