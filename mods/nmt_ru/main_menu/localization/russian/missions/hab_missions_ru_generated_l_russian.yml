 STATIC_MODIFIER_DESC_hab_army_mod: "A Habsburg army uniting diverse ethnic regiments is complete as the strongest land force in Europe."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Liberation of the Balkans"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "The Christians of the Balkans have been liberated from Ottoman rule."
