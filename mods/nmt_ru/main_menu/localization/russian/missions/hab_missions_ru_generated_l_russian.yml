 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Resistance to Hungarian Integration"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "The nobles of Hungary resist integration, temporarily reducing loyalty to the suzerain."
 hab_integrated_crown_desc: "An Integrated Crown Land is a special subject type that shares its ruler with the Habsburg Emperor, has restricted diplomacy, and allows the suzerain to build and develop resources directly. It cannot be annexed for 100 years."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "Acquisition of the Crown of Spain"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "The Iberian Peninsula has become part of the Habsburg Empire's domain, opening the door to an empire on which the sun never sets."
 STATIC_MODIFIER_NAME_hab_fra_loyalty_mod: "Resistance to French Integration"
 STATIC_MODIFIER_DESC_hab_fra_loyalty_mod: "The nobles of France resist integration, temporarily reducing loyalty to the suzerain."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "Seizure of Alsace-Lorraine"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "The border region along the Rhine secures the Habsburg Empire's western frontier, and imperial authority is strengthened."
 hab_events.30.b: "Continue to rule Italy as it stands"
 hab_events.15.b: "Long live the German Empire!"
 hab_events.30.a: "Reorganize the Kingdom of Italy as an integrated crown land"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Unification of the Holy Roman Empire"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "The Holy Roman Empire is unified, and the Empire's roads and armies are joined as one."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "The Birth of the German Empire"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "The German Empire is proclaimed, and a disciplined, powerful army heralds its birth."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "The Legacy of the Roman Emperors"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Recognized as heir to the Roman Emperors, the Habsburg Empire's religious authority and scholarship have advanced dramatically."
 hab_stadtrechtsbriefe: "Issue the Stadtrechtsbriefe"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe — 'town-law charters.' Under the strong royal power of the Habsburg Emperor, grant privileges to cities across the realm — the Wiener Stadtrecht for Vienna, and Landstadt rights for imperial towns elsewhere."
 hab_innsbruck_court: "The Court of Innsbruck"
 hab_innsbruck_court_desc: "Innsbruck — now that this central city of Tyrol has matured into a true city, establish a court here as the hub of Habsburg Alpine culture."
 hab_swarovski_crystal: "Swarovski Crystal"
 hab_swarovski_crystal_desc: "From 1737 onward, the glassmakers of Innsbruck perfected the art of fine crystal-cutting — long before Swarovski itself was born, Tyrolean crystal already adorned the courts of Europe."
 STATIC_MODIFIER_NAME_hab_stadtrecht_mod: "Issuance of the Stadtrechtsbriefe"
 STATIC_MODIFIER_DESC_hab_stadtrecht_mod: "By the Emperor's town-law charters, the urban privileges of the Wiener Stadtrecht and Landstadt have been unlocked."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Development of the Innsbruck Court"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Innsbruck has begun to shine as the hub of Habsburg Alpine culture."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Tyrol's Crystal Industry"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "The glassmakers of Innsbruck have perfected the art of fine crystal-cutting."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Wiener Stadtrecht"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "A special town right granted only to Vienna — advantages in trade and markets sustain Vienna's prosperity."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Landstadt"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Town rights granted across imperial cities — improving the road network while balancing crown power against noble influence."
