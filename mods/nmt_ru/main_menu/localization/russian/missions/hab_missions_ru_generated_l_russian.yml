l_russian:
 hab_habsburg_mission_pack: "Habsburg Hegemony and the Universal Empire"
 hab_habsburg_mission_pack_DESCRIPTION: "From the banks of the Danube — the ambition of the House of Habsburg reaches across all Europe. Secure the throne of the Holy Roman Emperor, conquer Hungary in the east, France and Spain in the west, Italy in the south. Then let Vienna shine as the greatest city in the world, and realize the Universal Empire."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION: "Rule the HRE, conquer the West, the East, and Italy, and realize the Universal Empire."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP: "Unite Europe under Habsburg hegemony."
 hab_habsburg_mission_pack_BUTTON_DETAILS: "'Let others wage war; thou, happy Austria, marry!' — become the master of Europe through both diplomacy and conquest!"
 hab_habsburg_ascendancy: "The Rise of the House of Habsburg"
 hab_habsburg_ascendancy_desc: "The blood of Rudolf of Habsburg pulses along the Danube — an age of diplomacy and conquest has begun."
 hab_secure_electors: "Secure the Electors"
 hab_secure_electors_desc: "The throne of the Holy Roman Emperor is decided by the vote of the electors. Through alliance or overwhelming power — secure the House of Habsburg's continued hold on the imperial crown."
 hab_imperial_authority: "Establish Imperial Authority"
 hab_imperial_authority_desc: "The authority of the Holy Roman Empire converges upon the will of the House of Habsburg — the time has come for the whole Empire to obey Vienna's command."
 hab_counter_reformation: "The Counter-Reformation"
 hab_counter_reformation_desc: "Martin Luther's heresy shakes Germany — implement the decrees of the Council of Trent and defend the Catholic faith."
 hab_charlemagne_legacy: "The Legacy of Charlemagne"
 hab_charlemagne_legacy_desc: "Reclaim under the Habsburg banner the southern Germany that Charlemagne united a thousand years ago — the foundation for imperial reform is laid."
 hab_imperial_reform: "Imperial Reform"
 hab_imperial_reform_desc: "Imperial Reform — perpetuate Habsburg rule through the reorganization of the Empire's governing institutions."
 hab_emperors_of_rome: "Heir to the Roman Emperors"
 hab_emperors_of_rome_desc: "A dream since Charlemagne — with dominion over the Eternal City of Rome and the HRE, the House of Habsburg declares itself 'heir to the Roman Emperors.'"
 hab_reclaim_burgundy: "Reclaim Burgundy"
 hab_reclaim_burgundy_desc: "Lorraine and Burgundy — reclaim these western lands that once belonged to the House of Habsburg."
 hab_austrian_netherlands: "The Austrian Netherlands"
 hab_austrian_netherlands_desc: "The rich commercial cities of Flanders and Brabant — the wealth of the Low Countries sustains the finances of the Habsburg Empire."
 hab_weaken_france: "Weaken France"
 hab_weaken_france_desc: "The old rival France — the greatest obstacle to European hegemony. Weaken it, and cut its power to interfere in Germany and Italy."
 hab_defeat_france: "The Defeat of France"
 hab_defeat_france_desc: "'Gaul has fallen' — the old rival France has been beaten by the House of Habsburg. Hegemony over Western Europe belongs to the Habsburgs."
 hab_iberian_marriage: "Marriage Diplomacy with Iberia"
 hab_iberian_marriage_desc: "'Let others wage war; thou, happy Austria, marry' — marriages with Spain and Portugal open the door to an empire on which the sun never sets."
 hab_crown_of_spain: "The Crown of Spain"
 hab_crown_of_spain_desc: "All of the Iberian Peninsula — with the House of Habsburg's declaration as 'King of Spain,' the empire on which the sun never sets begins to take shape."
 hab_italian_ambition: "Ambitions in Italy"
 hab_italian_ambition_desc: "The wealthy city-states of northern Italy — bring Milan, Venice, and Naples under Habsburg control."
 hab_duchy_of_milan: "Seize the Duchy of Milan"
 hab_duchy_of_milan_desc: "Milan — the heart of northern Italy. Seize this economic and military stronghold, and establish a base for the conquest of Italy."
 hab_papal_alliance: "Relations with the Pope"
 hab_papal_alliance_desc: "The Pope — establish relations with this spiritual authority of the Catholic world, and raise the legitimacy of the House of Habsburg."
 hab_venetian_ports: "The Ports of Venice"
 hab_venetian_ports_desc: "Venice, 'Queen of the Adriatic' — seize her ports and fleet, and secure entry into Mediterranean trade."
 hab_king_of_naples: "King of Naples"
 hab_king_of_naples_desc: "The Kingdom of Naples — the key to southern Italy. This crown is the first step toward Habsburg dominion over all Italy."
 hab_king_of_italy: "King of Italy"
 hab_king_of_italy_desc: "The 'Iron Crown' shines upon the Habsburg emperor's brow — all of Italy, from Lombardy to Sicily, is unified."
 hab_eastern_ambitions: "Ambitions in the East"
 hab_eastern_ambitions_desc: "Bohemia and Hungary — establish claims against these two great powers of Eastern Europe, and begin the Habsburg push eastward."
 hab_crown_of_bohemia: "The Crown of Bohemia"
 hab_crown_of_bohemia_desc: "The Crown of Wenceslas in Prague — this crown becomes the foundation of Habsburg expansion eastward."
 hab_royal_hungary: "Royal Hungary"
 hab_royal_hungary_desc: "Buda has been liberated from the Ottomans — the Crown of Hungary returns to the Habsburg emperor's brow, and 'Royal Hungary' is born."
 hab_bohemian_union: "Integration of the Bohemian Union"
 hab_bohemian_union_desc: "The personal union with Bohemia has deepened — now choose whether to rule it directly as an integrated crown land, or maintain the status quo."
 hab_secure_croatia: "Secure Croatia"
 hab_secure_croatia_desc: "Establish a military frontier in Croatia to halt Ottoman incursions, and use it as a foothold for the conquest of the Balkans."
 hab_ottoman_menace: "The Ottoman Menace"
 hab_ottoman_menace_desc: "The Ottoman Empire — the greatest enemy of Eastern Europe, which brought down Constantinople. Let the House of Habsburg become the bulwark that defends Christendom."
 hab_liberate_balkans: "Liberate the Balkans"
 hab_liberate_balkans_desc: "Liberate the Christians of the Balkan Peninsula from Ottoman rule — the voice of the Orthodox faithful calls the name of Habsburg."
 hab_scourge_of_europe: "The Scourge of Europe"
 hab_scourge_of_europe_desc: "The complete expulsion of the Ottoman Empire from Europe — the nightmare that began with the Siege of Vienna in 1683 has ended."
 hab_emperors_of_east: "Emperor of the East"
 hab_emperors_of_east_desc: "Constantinople — capital of both the Eastern and Western Roman Empires — now falls into Habsburg hands. Both the eastern and western imperial crowns are united."
 hab_austrian_heartland: "Establish the Austrian Heartland"
 hab_austrian_heartland_desc: "The Austrian heartland along the Danube — secure the heart of imperial expansion, and establish the foundation of its economy and military."
 hab_tyrol_styria: "Tyrol and Styria"
 hab_tyrol_styria_desc: "Silver from Schwaz and iron from Leoben — the mines of Tyrol and Styria sustain the finances and armies of the Habsburg Empire."
 hab_dev_vienna: "Development of Vienna"
 hab_dev_vienna_desc: "'City of Music,' 'White City of the Habsburgs' — fill Vienna with a splendor worthy of an imperial capital."
 hab_austrian_economy: "Development of the Austrian Economy"
 hab_austrian_economy_desc: "Trade along the Danube, mining in Bohemia, industry in Italy — unite these diverse economic foundations to make the Habsburg Empire the greatest economic power in Europe."
 hab_graz_fortress: "Fortify Graz"
 hab_graz_fortress_desc: "Graz — develop the capital of Styria into an impregnable fortress city, prepared against Ottoman incursion."
 hab_baroque_vienna: "Baroque Vienna"
 hab_baroque_vienna_desc: "Baroque music, architecture, and painting blossom in the Viennese court — universities and art academies herald the golden age of Habsburg culture."
 hab_great_vienna: "The Great City of Vienna"
 hab_great_vienna_desc: "Schönbrunn Palace, St. Stephen's Cathedral — Vienna is complete as the greatest and most beautiful city in Europe."
 hab_diplomatic_marriages: "Diplomatic Marriages"
 hab_diplomatic_marriages_desc: "'Let others wage war; thou, happy Austria, marry' — build a network of marriage diplomacy with Europe's major royal houses."
 hab_trade_empire: "A Trading Empire"
 hab_trade_empire_desc: "Venice, Antwerp, Hamburg — a Habsburg trading empire uniting Europe's major commercial cities comes to dominate world trade."
 hab_swiss_lands: "Reclaim the Swiss Lands"
 hab_swiss_lands_desc: "Wash away the humiliation symbolized by William Tell — reclaim the land of the Alpine peasants for the House of Habsburg."
 hab_south_german_cities: "The Commercial Cities of Southern Germany"
 hab_south_german_cities_desc: "Augsburg and Frankfurt — seize these wealthy cities, birthplace of the Fugger and Rothschild families."
 hab_unify_germany: "The Unification of Germany"
 hab_unify_germany_desc: "The scattered German principalities — now, at last, united under the Habsburg banner."
 hab_north_sea_trade: "North Sea Trade"
 hab_north_sea_trade_desc: "Hamburg and Amsterdam — seize control of North Sea trade, and build a new commercial empire to replace the Hanseatic League."
 hab_hegemon_of_west: "Hegemon of the West"
 hab_hegemon_of_west_desc: "France, Spain — every great power of the West that once challenged the House of Habsburg has now been subdued."
 hab_tuscany: "The Conquest of Tuscany"
 hab_tuscany_desc: "The Renaissance culture of Florence — take this land of the arts, which blossomed under the patronage of the Medici, under the wing of the Habsburg Empire."
 hab_dev_vienna_great: "The Greater City of Vienna"
 hab_dev_vienna_great_desc: "Vienna rises to even greater heights — on its way to completion as the greatest city in Europe."
 hab_sicily: "Conquest of Sicily"
 hab_sicily_desc: "Sicily, key to the Mediterranean — make this island the cornerstone of Habsburg supremacy in the Mediterranean."
 hab_surpass_poland: "Surpass Poland"
 hab_surpass_poland_desc: "The Kingdom of Poland — establish Habsburg military superiority in the confrontation with this great power of Eastern Europe."
 hab_transylvania: "Transylvania"
 hab_transylvania_desc: "Transylvania, encircled by the Carpathians — secure this land of many peoples as the Habsburg Empire's eastern frontier."
 hab_balkans_crusade: "Crusade in the Balkans"
 hab_balkans_crusade_desc: "'It is God's will' — declare a crusade against the Ottoman Empire, and liberate Christians from Islamic rule."
 hab_wallachia_moldavia: "Wallachia and Moldavia"
 hab_wallachia_moldavia_desc: "Subdue the Romanian principalities north of the Danube, and complete Habsburg dominion over the Balkans."
 hab_austrian_army: "Reorganize the Austrian Army"
 hab_austrian_army_desc: "The Habsburg military — cultivate the strongest army in Europe, forged from a union of multi-ethnic regiments."
 hab_spanish_tercios: "The Spanish Tercio"
 hab_spanish_tercios_desc: "The Tercio — introduce this revolutionary Spanish military tactic across the entire Habsburg army, and perfect the finest infantry in Europe."
 hab_multicultural: "The Multi-Ethnic Empire"
 hab_multicultural_desc: "Germans, Czechs, Hungarians, Croats, Italians — the Habsburg Empire's experiment in uniting many peoples under one banner is complete."
 hab_north_germany: "Control of Northern Germany"
 hab_north_germany_desc: "Hamburg and Brandenburg — all of northern Germany now lies within the Habsburg Empire's domain."
 hab_alsace_lorraine: "Alsace-Lorraine"
 hab_alsace_lorraine_desc: "Alsace and Lorraine along the Rhine — secure this land as the Habsburg Empire's western frontier."
 hab_dev_buda: "Development of Buda"
 hab_dev_buda_desc: "Buda — after reclaiming the ancient capital of the Kingdom of Hungary from the Ottomans, revive it as the Empire's eastern capital."
 hab_renaissance_court: "The Renaissance Court"
 hab_renaissance_court_desc: "The light of the Renaissance shines in the Viennese court — Italian art and Byzantine scholarship fuse to bring Habsburg culture into full bloom."
 hab_carinthia: "Carinthia"
 hab_carinthia_desc: "Carinthia — integrate this Alpine duchy into the Habsburg domain, and secure the corridor to Italy and the Balkans."
 hab_innsbruck: "Development of Innsbruck"
 hab_innsbruck_desc: "Innsbruck, capital of Tyrol — develop this beautiful Alpine imperial city as the Habsburg Empire's southwestern stronghold."
 hab_colonialism: "The Colonial Empire"
 hab_colonialism_desc: "Through Spain, to the Americas — build a colonial empire beneath whose Habsburg banner the sun never sets."
 hab_universal_empire: "The Universal Empire"
 hab_universal_empire_desc: "'The Universal Empire — from Lisbon in the west to Constantinople in the east, from Hamburg in the north to Palermo in the south' — the dream since Charlemagne is realized."
 hab_events.1.t: "The House of Habsburg, to the Holy Roman Throne"
 hab_events.1.d: "The electors have declared their support for the House of Habsburg — the imperial throne belongs to the Habsburgs."
 hab_events.1.a: "Long live the Habsburg Emperor! Long live the Empire!"
 hab_events.10.t: "Declaration as Heir to the Roman Emperors"
 hab_events.10.d: "Imperial reform is complete and the Eternal City of Rome is united with the HRE — the House of Habsburg declares itself 'heir to the Roman Emperors.'"
 hab_events.10.a: "Long live imperial reform! Long live the heir of Rome!"
 hab_events.15.t: "Declaration of German Unification"
 hab_events.15.d: "From north to south — a Germany once fractured into countless principalities is united under the Habsburg banner."
 hab_events.15.a: "Long live German unification!"
 hab_events.20.t: "The Decline of France — the Path to the Throne"
 hab_events.20.d: "France has at last bent the knee to the House of Habsburg. Now is the time to establish a formal claim to the French throne — declare a sixty-year claim, and set your sights on the succession of the Kingdom of France."
 hab_events.20.a: "Declare a claim to the French throne (60 years)"
 hab_events.25.t: "The Crown of Spain"
 hab_events.25.d: "'King of Spain and Archduke of Austria' — the Iberian Peninsula now lies within the Habsburg Empire's domain."
 hab_events.25.a: "Long live Spain! Long live the Habsburg Empire!"
 hab_events.30.t: "King of Italy"
 hab_events.30.d: "The 'Iron Crown' shines upon the Habsburg emperor's brow — all of Italy, from Lombardy to Sicily, is unified."
 hab_events.40.t: "The Founding of Royal Hungary"
 hab_events.40.d: "Buda has been liberated — 'Royal Hungary' becomes the eastern pillar of the Habsburg Empire."
 hab_events.40.a: "Hungary liberated! Long live Buda!"
 hab_events.45.t: "The End of the Ottoman Empire"
 hab_events.45.d: "The Ottoman Empire has been completely expelled from Europe — Christendom erupts in celebration."
 hab_events.45.a: "The triumph of Christendom! The Ottomans are defeated!"
 hab_events.50.t: "Emperor of the East"
 hab_events.50.d: "Constantinople has fallen into Habsburg hands — the capitals of both the Eastern and Western Roman Empires are now held as one."
 hab_events.50.a: "Long live Constantinople! Long live the Emperor of the East!"
 hab_events.55.t: "The Great City of Vienna"
 hab_events.55.d: "Schönbrunn Palace, St. Stephen's Cathedral — Vienna is complete as the greatest and most beautiful city in Europe."
 hab_events.55.a: "Long live the Great City of Vienna!"
 hab_events.65.t: "Bohemia — Incorporation as a Crown Land"
 hab_events.65.d: "The personal union with Bohemia has deepened, and the time for full integration has come. Rule it directly as an integrated crown land, or maintain the current personal union — decide."
 hab_events.65.a: "Incorporate Bohemia as an integrated crown land"
 hab_events.99.t: "Declaration of the Universal Empire"
 hab_events.99.d: "'The Universal Empire — the Habsburg Emperor rules from Lisbon in the west to Constantinople in the east' — this declaration echoes across all of Europe."
 hab_events.99.a: "Long live the Universal Empire! The Habsburg Empire forever!"
 hab_events.65.b: "Maintain the current personal union"
