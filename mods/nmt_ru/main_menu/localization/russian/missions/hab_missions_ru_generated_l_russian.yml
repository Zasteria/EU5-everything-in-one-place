 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "The nobles of Bohemia resist integration, temporarily reducing loyalty to the suzerain."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "The Crown of Bohemia"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "The golden city of Prague joins the Empire as the House of Habsburg's second capital."
 STATIC_MODIFIER_NAME_hab_burgundy_mod: "Reclamation of Burgundy"
 STATIC_MODIFIER_DESC_hab_burgundy_mod: "The lost territory of Burgundy has returned to Habsburg rule."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Subjugation of Carinthia"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Carinthia has become a vital Alpine corridor linking north and south for the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Triumph of the Counter-Reformation"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "The Catholic faith is protected throughout the Empire."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "The Legacy of Charlemagne"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "The legacy of Charlemagne grants the Habsburg Empire new legitimacy."
 STATIC_MODIFIER_NAME_hab_colonial_mod: "Dawn of the Colonial Empire"
 STATIC_MODIFIER_DESC_hab_colonial_mod: "A colonial empire beneath whose Habsburg banner the sun never sets has been built."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "The Croatian Military Frontier"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "A military frontier has been established in Croatia, halting Ottoman incursion."
 STATIC_MODIFIER_NAME_hab_crusade_mod: "Crusading Morale"
 STATIC_MODIFIER_DESC_hab_crusade_mod: "The fervor of the Balkan Crusade has forged the Habsburg army into its finest warriors."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Expansion of the Danubian Empire"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "The lower Danube has been subdued, completing Habsburg dominion over the entire Balkans."
 STATIC_MODIFIER_NAME_hab_dev_buda_loc_mod: "Buda — Heart of Hungary"
 STATIC_MODIFIER_DESC_hab_dev_buda_loc_mod: "Buda has been liberated, and is reborn as the capital of the Kingdom of Hungary under the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_diplomacy_mod: "The Habsburg Diplomatic Web"
 STATIC_MODIFIER_DESC_hab_diplomacy_mod: "Through marriage diplomacy, the House of Habsburg has built the greatest diplomatic network in Europe."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "The Awakening of the House of Habsburg"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "The ambition of the House of Habsburg has been kindled — an age of diplomacy and conquest begins."
 STATIC_MODIFIER_NAME_hab_economy_mod: "The Habsburg Economic Sphere"
 STATIC_MODIFIER_DESC_hab_economy_mod: "The economic strength of Bohemia, Italy, and the Low Countries has been united."
 STATIC_MODIFIER_NAME_hab_france_mod: "The War with France"
 STATIC_MODIFIER_DESC_hab_france_mod: "The old rival France has been weakened, opening the road to Habsburg hegemony over Europe."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Fortification of Graz"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Graz has been developed into an impregnable fortress city, defending against Ottoman incursion."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "The Great City of Vienna Complete"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Vienna is complete as the greatest city in Europe, shining as the Empire's eternal capital."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Stability of the Austrian Heartland"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "The Austrian heartland is stable, establishing the foundation for imperial expansion."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Hegemon of the West"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "No power in Western Europe remains to challenge Habsburg hegemony."
 STATIC_MODIFIER_NAME_hab_iberia_mod: "Alliance with Iberia"
 STATIC_MODIFIER_DESC_hab_iberia_mod: "Relations with Spain and Portugal have expanded the Habsburg Empire's global influence."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Establishment of Imperial Authority"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "The whole of the Holy Roman Empire now obeys the House of Habsburg's command."
 STATIC_MODIFIER_NAME_hab_innsbruck_mod: "Development of Innsbruck"
 STATIC_MODIFIER_DESC_hab_innsbruck_mod: "Innsbruck, capital of Tyrol, has developed into a beautiful Alpine imperial city."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Benefits of the Italian Wars"
 STATIC_MODIFIER_DESC_hab_italian_mod: "The Italian campaigns have forged the Habsburg army into an elite force."
 STATIC_MODIFIER_NAME_hab_milan_mod: "Milan — Heart of Northern Italy"
 STATIC_MODIFIER_DESC_hab_milan_mod: "Milan, as the hub of northern Italian trade, brings immense wealth to the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Establishment of the Multi-Ethnic Empire"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "The miracle of many peoples coexisting under the Habsburg banner has been realized."
 STATIC_MODIFIER_NAME_hab_naples_mod: "Seizure of the Kingdom of Naples"
 STATIC_MODIFIER_DESC_hab_naples_mod: "Habsburg rule over southern Italy is established."
 STATIC_MODIFIER_NAME_hab_netherlands_mod: "The Austrian Netherlands"
 STATIC_MODIFIER_DESC_hab_netherlands_mod: "The wealthy commercial cities of the Low Countries bring immense tax revenue to the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_north_german_mod: "Subjugation of Northern Germany"
 STATIC_MODIFIER_DESC_hab_north_german_mod: "Northern Germany has been united under the Habsburg banner."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "North Sea Trade Hegemony"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "North Sea trade has come under the control of the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "The War with the Ottoman Empire"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "Victory over the Ottoman Empire has seen the Habsburg Empire recognized as the bulwark of Christendom."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Reconciliation with the Pope"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Relations with the Pope are established, and the House of Habsburg is recognized as guardian of the Catholic world."
 STATIC_MODIFIER_NAME_hab_poland_mod: "Subjugation of Poland"
 STATIC_MODIFIER_DESC_hab_poland_mod: "Poland has fallen within the Habsburg sphere of influence, establishing hegemony in Eastern Europe."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Completion of Imperial Reform"
 STATIC_MODIFIER_DESC_hab_reform_mod: "The reorganization of governing institutions perpetuates Habsburg rule."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "The Renaissance of Vienna"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "The light of the Renaissance shines in the Viennese court, making the Empire the center of European culture."
 STATIC_MODIFIER_NAME_hab_sicily_mod: "Subjugation of Sicily"
 STATIC_MODIFIER_DESC_hab_sicily_mod: "Sicily, key to the Mediterranean, has become a cornerstone of the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "The Commercial Cities of Southern Germany"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "The wealthy free cities of southern Germany have become the core of the imperial economy."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "The Iron Mines of Leoben"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "The iron of Styria sustains the military strength of the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Subjugation of Switzerland"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "The Alpine peasant state has been conquered, establishing Habsburg hegemony."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "The Spanish Tercio"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "Tercio tactics have been introduced across the entire Habsburg army, giving birth to the finest infantry in Europe."
 STATIC_MODIFIER_NAME_hab_trade_mod: "The European Trading Empire"
 STATIC_MODIFIER_DESC_hab_trade_mod: "Europe's major trade routes have come under the control of the Habsburg Empire."
 STATIC_MODIFIER_NAME_hab_transylvania_mod: "Subjugation of Transylvania"
 STATIC_MODIFIER_DESC_hab_transylvania_mod: "Transylvania, in the Carpathians, has become the Habsburg Empire's eastern frontier."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Prosperity of Tuscany"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "The Renaissance culture of Florence blossoms under the protection of the Habsburg Empire."
