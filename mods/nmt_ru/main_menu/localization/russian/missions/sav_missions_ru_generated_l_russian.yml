l_russian:
 sav_house_of_savoy_mission_pack: "Притязания Савойского дома"
 sav_house_of_savoy_mission_pack_DESCRIPTION: "Савойскому дому, владеющему альпийскими перевалами, суждено подняться из маленького пьемонтского герцогства до господства над всей Италией и югом Франции и создать Итальянское королевство. Искусно лавируйте между папой, императором и Францией, завоюйте Геную ради морской силы, сокрушите Ломбардию, Тоскану и Венецию и возьмите Рим. Поднимитесь как Сардиния-Пьемонт и в конце концов станьте знаменосцем объединения Италии."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION: "Объедините за Савойю Пьемонт, завоюйте Италию и Францию и создайте Итальянское королевство."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP: "Выполняйте задания, чтобы осуществить притязания Савойского дома."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS: "Перейдите Альпы и объедините Италию!"
 sav_the_savoy_ambition: "Притязания Савойи"
 sav_the_savoy_ambition_desc: "Савойский дом занимает особое место на перекрёстке Альп и влияет и на Италию, и на Францию. Владея плодородными землями Пьемонта и альпийскими торговыми путями, это маленькое герцогство начинает путь к величию."
 sav_the_savoy_ambition_tooltip: "Условий нет"
 sav_unify_piedmont: "Объединить Пьемонт"
 sav_unify_piedmont_desc: "Присоединить независимые владения вроде Салуццо и Монферрата и объединить весь Пьемонт — первый шаг к великим притязаниям Савойи."
 sav_unify_piedmont_tooltip: "Владеть 20 или более районами в области Пьемонт"
 sav_glory_of_turin: "Слава Турина"
 sav_glory_of_turin_desc: "Развейте Турин, главный город Пьемонта, в цветущую столицу, достойную Савойского дома."
 sav_glory_of_turin_tooltip: "Развитие Турина 40 или выше, и столица — Турин"
 sav_shroud_of_turin: "Туринская плащаница"
 sav_shroud_of_turin_desc: "В Туринском соборе хранится льняное полотно, которое почитают погребальной пеленой Христа. Вера в эту святыню приносит державе процветание и престиж."
 sav_shroud_of_turin_tooltip: "Событие «Дворец Венария» (flavor_sav.1) произошло"
 sav_alpine_roads: "Альпийские дороги"
 sav_alpine_roads_desc: "Обустройство дорог на альпийских торговых путях умножает доходы Савойи: через неё идут купцы между Францией и Италией."
 sav_alpine_roads_tooltip: "Построено 10 или более мостов"
 sav_crossroads_of_europe: "Перекрёсток Европы"
 sav_crossroads_of_europe_desc: "Пьемонт, связывающий Геную, Венецию и Францию, становится одним из главных торговых узлов Европы."
 sav_crossroads_of_europe_tooltip: "Владеть 1 или более рыночным центром"
 sav_order_of_saints_maurice: "Орден Святых Маврикия и Лазаря"
 sav_order_of_saints_maurice_desc: "Орден Святых Маврикия и Лазаря, основанный Савойским домом, становится символом религиозного авторитета и легитимности в католическом мире."
 sav_order_of_saints_maurice_tooltip: "Папская область относится к нам с мнением 100 или выше либо не существует"
 sav_savoy_academy: "Савойская академия"
 sav_savoy_academy_desc: "Проникнувшись духом Возрождения и развивая учёные заведения вокруг Турина, Савойя прочно входит в итальянский культурный мир."
 sav_savoy_academy_tooltip: "Возрождение принято, и во владении 3 или более университета"
 sav_alpine_powerhouse: "Альпийская держава"
 sav_alpine_powerhouse_desc: "Объединив Пьемонт, развив культуру и нарастив хозяйственную мощь, Савойя признана крупной державой с сердцем в Альпах."
 sav_alpine_powerhouse_tooltip: "Всё население 2 000 или более, во владении 200 или более районов"
 sav_alpine_fortifications: "Альпийские укрепления"
 sav_alpine_fortifications_desc: "Пользуясь природной неприступностью Альп и возводя грозные крепости в ключевых местах, Савойя становится неприступным горным государством."
 sav_alpine_fortifications_tooltip: "Владеть 5 или более замками"
 sav_diplomatic_balance: "Дипломатическое равновесие"
 sav_diplomatic_balance_desc: "Для Савойи, зажатой между великими державами, дипломатическое искусство — условие выживания. Высокая дипломатическая репутация ловко отводит давление сильных соседей."
 sav_diplomatic_balance_tooltip: "Дипломатический вес 10 или выше"
 sav_savoyard_army: "Савойское войско"
 sav_savoyard_army_desc: "Савойские солдаты, закалённые суровыми Альпами, славятся как одни из лучших горных воинов Европы. Постоянное войско поддерживает военную независимость державы."
 sav_savoyard_army_tooltip: "Численность армии 10 000 или более, ежемесячный рост армейских традиций 0,05 или более"
 sav_conquer_genoa: "Завоевать Геную"
 sav_conquer_genoa_desc: "Завоевание Генуи, одного из первых морских городов Средиземноморья, избавит Савойю от сухопутной замкнутости: это первый шаг к морской силе с прямым выходом к Средиземному морю."
 sav_conquer_genoa_tooltip: "Генуя принадлежит нам или подданному"
 sav_nice_naval_base: "Военный порт в Ницце"
 sav_nice_naval_base_desc: "Военный порт в Ницце на средиземноморском берегу даст Савойе опору для господства в Тирренском море."
 sav_nice_naval_base_tooltip: "В Ницце есть верфь"
 sav_sardinia_union: "Уния с Сардинией"
 sav_sardinia_union_desc: "Захватив большую часть Сардинии и приняв титул «Королевство Сардиния», Савойский дом добивается признания как один из главных королевских домов Италии."
 sav_sardinia_union_tooltip: "Владеть 20 или более районами в области Сардиния"
 sav_seize_lombardy: "Захватить Ломбардию"
 sav_seize_lombardy_desc: "Подчинив Савойе Ломбардию с центром в Милане, Савойя станет хозяйкой Северной Италии."
 sav_seize_lombardy_tooltip: "Милан принадлежит нам или подданному либо не существует; во владении 30 или более районов в Ломбардии"
 sav_push_tuscany: "Натиск на Тоскану"
 sav_push_tuscany_desc: "Покорив богатые города-государства Тосканы во главе с Флоренцией, Савойя присоединит к своим землям колыбель ренессансной культуры."
 sav_push_tuscany_tooltip: "Владеть 15 или более районами в области Тоскана"
 sav_capture_venice: "Взять Венецию"
 sav_capture_venice_desc: "Завоевание Венеции, владычицы Адриатики, утвердит морское господство Савойи в Северной Италии."
 sav_capture_venice_tooltip: "Владеть 20 или более районами в области Венето"
 sav_emilia_and_beyond: "Эмилия и далее"
 sav_emilia_and_beyond_desc: "Захват Эмилии и оставшихся земель Северной Италии сделает господство Савойи безраздельным."
 sav_emilia_and_beyond_tooltip: "Владеть 10 или более районами в области Эмилия"
 sav_march_on_naples: "Поход на Неаполь"
 sav_march_on_naples_desc: "Завоевание Неаполя, ключевого города Южной Италии, приблизит власть над всем полуостровом."
 sav_march_on_naples_tooltip: "Неаполь принадлежит нам или подданному"
 sav_eternal_rome: "Вечный город"
 sav_eternal_rome_desc: "Кто владеет Римом, тот владеет Италией. Взяв Вечный город, Савойя являет миру свою власть законного правителя Италии."
 sav_eternal_rome_tooltip: "Рим принадлежит нам или подданному"
 sav_integrate_geneva: "Присоединить Женеву"
 sav_integrate_geneva_desc: "Прочно подчинив Савойе Женеву, тесно связанную со Швейцарской конфедерацией, Савойя закрепится для продвижения на север."
 sav_integrate_geneva_tooltip: "Женева принадлежит нам напрямую"
 sav_control_provence: "Власть над Провансом"
 sav_control_provence_desc: "Захват Прованса на средиземноморском побережье утвердит господство Савойи на юге Франции и откроет дорогу к большему."
 sav_control_provence_tooltip: "Владеть 10 или более районами в области Прованс"
 sav_against_the_swiss: "Против швейцарцев"
 sav_against_the_swiss_desc: "Усмирив своевольную Швейцарскую конфедерацию и захватив западную Швейцарию, Савойя станет хозяйкой земель к западу от Рейна."
 sav_against_the_swiss_tooltip: "Владеть 5 или более районами в области Западная Швейцария"
 sav_conquer_burgundy: "Завоевать Бургундию"
 sav_conquer_burgundy_desc: "Покорение богатых земель, некогда принадлежавших герцогству Бургундскому, откроет дорогу во Францию."
 sav_conquer_burgundy_tooltip: "Владеть 30 или более районами в регионе Франция"
 sav_savoyard_occitania: "Савойская Окситания"
 sav_savoyard_occitania_desc: "Захватите окситаноязычные земли и втяните весь юг Франции в савойский культурный мир."
 sav_savoyard_occitania_tooltip: "Владеть 20 или более районами в области Прованс"
 sav_claim_france: "Притязание на Францию"
 sav_claim_france_desc: "Настал час взять Париж, столицу Французского королевства, и подчинить нашей власти великую державу, что некогда грозила Савойе."
 sav_claim_france_tooltip: "Париж принадлежит нам или подданному либо Франции не существует"
 sav_kingdom_of_italy: "Итальянское королевство"
 sav_kingdom_of_italy_desc: "Савойский дом перешёл Альпы, объединил всю Италию и как наследник Римской империи основал Итальянское королевство. Мечта Рисорджименто сбылась."
 sav_kingdom_of_italy_tooltip: "Владеть 200 или более районами в регионе Италия и 400 или более районами всего"
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Объединение Пьемонта"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "Объединение Пьемонта ускоряет интеграцию и повышает досягаемость."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "Благословение плащаницы"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "Вера в Туринскую плащаницу повышает эффективность налогов и ежемесячный престиж."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Альпийские дороги"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "Обустройство дорог сокращает срок их строительства и повышает силу торгового центра."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Перекрёсток Европы"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "Положение торгового узла повышает силу торгового центра, защиту торговли и число купцов."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "Орден Святых Маврикия и Лазаря"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "Основание ордена повышает ежемесячную легитимность, дипломатическую репутацию и терпимость к основной вере."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "Влияние Савойской академии"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "Развитие учёных заведений ускоряет рост культурных традиций, повышает грамотность и скорость исследований."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "Альпийская держава"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "Положение крупной державы повышает досягаемость, торговый и налоговый доход."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Альпийские укрепления"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Возведение крепостей навсегда повышает обороноспособность на 30%."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Дипломатическое равновесие"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "Искусная дипломатия повышает дипломатическую репутацию и дипломатический потенциал."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Савойская гвардия"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Отборное войско повышает боевой дух армии и рост армейских традиций."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "Захват Генуи"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Завоевание Генуи повышает боевой дух флота и морское присутствие."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Военный порт в Ницце"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Порт в Ницце навсегда повышает пригодность гаваней, морское присутствие, число одновременно строящихся кораблей (+2) и скорость починки (+5%)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Уния с Сардинией"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "Уния с Сардинией повышает силу тяжёлых кораблей и морское присутствие."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "Захват Ломбардии"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "Захват Ломбардии повышает эффективность зданий и скорость строительства."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Продвижение в Тоскану"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "Продвижение в Тоскану ускоряет рост культурных традиций и усиливает власть правителя."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "Захват Венеции"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Захват Венеции повышает силу торгового центра и силу тяжёлых кораблей."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Эмилия и далее"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Захват Эмилии ускоряет интеграцию новых земель."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Поход на Неаполь"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "Поход на Неаполь повышает ежемесячную легитимность и власть правителя."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "Вечный город"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "Власть над Римом навсегда и значительно повышает ежемесячный престиж, легитимность и дипломатическую репутацию."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Присоединение Женевы"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Присоединение Женевы ускоряет интеграцию новых земель."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Власть над Провансом"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Захват Прованса повышает досягаемость."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Против швейцарцев"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "Покорение швейцарцев повышает боевой дух армии."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Завоевание Бургундии"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Завоевание Бургундии повышает ежемесячный престиж и власть правителя."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "Савойская Окситания"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Власть над Окситанией повышает досягаемость и ускоряет интеграцию."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "Притязание на Францию"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "Завоевание Франции значительно повышает культурное влияние и дипломатическую репутацию."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "Итальянское королевство"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "Объединение Италии навсегда и значительно повышает власть правителя, дипломатическую репутацию и дисциплину войск."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Слава Турина"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "Развитие Турина навсегда ускоряет рост населения и ежемесячное развитие."
 sav_events.1.t: "Притязания Савойского дома"
 sav_events.1.d: "Герцогство Савойское держит стратегические альпийские перевалы, связывающие север и юг Европы. Между Францией и Италией это маленькое княжество пробуждается к великим притязаниям. Савойский герб — белый крест на красном щите — однажды взовьётся над всей Италией. Объедините Пьемонт, завоюйте Геную, возьмите Рим и основайте Итальянское королевство — тысячелетняя мечта Савойского дома начинает сбываться."
 sav_events.1.a: "Возвеличим Савойский дом!"
 sav_events.2.t: "Слава Турина"
 sav_events.2.d: "Под властью Савойского дома Турин стремительно растёт. По всему городу поднимаются дворцы и храмы, сюда стекаются учёные и художники, и город становится культурным и политическим центром Северной Италии. Расцвет Турина как столицы, достойной Савойского дома, станет основой процветания всей державы."
 sav_events.2.a: "Турин — сияющая столица Савойского дома"
 sav_woolens_of_piedmont: "Пьемонтское сукно"
 sav_woolens_of_piedmont_desc: "Пьемонт славится как один из главных в Италии производителей шерсти и сукна. Добротная шерсть и суконное дело — торговая основа савойского богатства."
 sav_woolens_of_piedmont_tooltip: "Державой производится 5 или более шерсти или сукна"
 sav_nebbiolo_vineyards: "Виноградники неббиоло"
 sav_nebbiolo_vineyards_desc: "Виноград неббиоло с холмов Ланге в Пьемонте даёт такие прославленные вина, как бароло и барбареско. Пьемонтские вина расходятся по всей Европе и приносят огромную прибыль."
 sav_nebbiolo_vineyards_tooltip: "Державой производится 10 или более вина"
 sav_casa_savoia: "Авторитет Савойского дома"
 sav_casa_savoia_desc: "Власть Савойского дома упрочилась, и её авторитет теперь широко признан в стране и за её пределами. Законное и прочное правление — основа, что возвысит Савойю до крупной итальянской державы."
 sav_casa_savoia_tooltip: "Легитимность 90 или выше"
 sav_ordinanza_piedmontese: "Пьемонтская ординанца"
 sav_ordinanza_piedmontese_desc: "В XV веке Савойя выработала собственное учение о пехотном строе — пьемонтскую ординанцу, выкованную в альпийских высокогорьях. Выученные пикинерские построения — становой хребет савойской военной силы."
 sav_ordinanza_piedmontese_tooltip: "Численность армии 1 000 или более, ежемесячный рост армейских традиций 0,03 или более"
 sav_university_of_turin: "Туринский университет"
 sav_university_of_turin_desc: "Основанный в 1404 году Туринский университет — учёное сердце Пьемонта, где преподают право, медицину и богословие. Умственное наследие Савойи питает расцвет ренессансной культуры."
 sav_university_of_turin_tooltip: "Во владении 5 или более университетов, и развитие Турина 45 или выше"
 sav_corsica_seized: "Захват Корсики"
 sav_corsica_seized_desc: "Взятие Корсики, издавна подвластной Генуе, сильно укрепит власть Савойи над западом Тирренского моря."
 sav_corsica_seized_tooltip: "Аяччо принадлежит нам или подданному"
 sav_towers_of_sardinia: "Башни Сардинии"
 sav_towers_of_sardinia_desc: "Со Средних веков берег Сардинии усеян бесчисленными сторожевыми башнями (Torre Costiera). Обновление и укрепление этой обороны защитит Сардинию от набегов пиратов."
 sav_towers_of_sardinia_tooltip: "3 или более замка в области Сардиния"
 sav_cagliari_development: "Развитие Кальяри"
 sav_cagliari_development_desc: "Превратите Кальяри, столицу Сардинии, в важный портовый город и торговый узел западного Средиземноморья."
 sav_cagliari_development_tooltip: "Население Кальяри 30 или более и развитие 35 или выше"
 sav_tyrrhenian_sea: "Владыка Тирренского моря"
 sav_tyrrhenian_sea_desc: "Захватив Корсику и Сардинию и построив могучий флот, Савойя полностью овладела Тирренским морем. Торговля западного Средиземноморья переходит под покровительство Савойи."
 sav_tyrrhenian_sea_tooltip: "Численность флота 20 или более, во владении 1 или более рыночный центр"
 sav_languedoc: "Власть над Лангедоком"
 sav_languedoc_desc: "Захватите Лангедок, ключевую позицию на юге Франции. Взятие двух больших городов, Монпелье и Тулузы, станет опорой для власти над всем югом Франции."
 sav_languedoc_tooltip: "Владеть 20 или более районами в области Лангедок"
 sav_gascony: "Захват Гаскони"
 sav_gascony_desc: "Гасконь с центром в Бордо — богатый винодельческий край на берегу Атлантики. Разорвите её давние узы с Англией и присоедините эту землю к Савойе."
 sav_gascony_tooltip: "Бордо принадлежит нам или подданному"
 sav_lyon_gateway: "Лионские ворота"
 sav_lyon_gateway_desc: "Лион при слиянии Роны и Соны — торговый узел, связывающий юг и север Франции. Взятие этого города открывает путь вглубь Франции."
 sav_lyon_gateway_tooltip: "Лион принадлежит нам или подданному"
 sav_loire_valley: "Долина Луары"
 sav_loire_valley_desc: "Долина Луары — «сад Франции», где стояли замки французских королей. Взятие Нанта и Тура означает завоевание центра и запада Франции."
 sav_loire_valley_tooltip: "Нант и Тур принадлежат нам или подданному"
 sav_normandy_coast: "Нормандский берег"
 sav_normandy_coast_desc: "Захватите Нормандию, исторический берег, где некогда высаживались норманны. Руан в сердце этой богатой земли — ключевая позиция Северной Франции и последний рубеж перед Парижем."
 sav_normandy_coast_tooltip: "Руан принадлежит нам или подданному"
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "Пьемонтское суконное дело"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "Поддержка суконного дела навсегда повышает эффективность производства шерсти и сукна."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Виноградники неббиоло"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "Возделывание неббиоло повышает эффективность производства вина и эффективность налогов."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "Авторитет Савойского дома"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "Упрочение власти Савойского дома усиливает власть правителя и повышает ежемесячную легитимность."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "Пьемонтская ординанца"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "Введение ординанцы значительно повышает дисциплину и боевой дух армии."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "Влияние Туринского университета"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "Основание Туринского университета повышает скорость исследований, наибольшую грамотность (+5%) и мастерство новых творцов."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Захват Корсики"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Захват Корсики повышает боевой дух флота и морское присутствие."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Башни Сардинии"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Обустройство сторожевых башен навсегда повышает обороноспособность на 30%."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Процветание Кальяри"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Развитие Кальяри навсегда ускоряет рост населения и повышает силу торгового центра."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Владыка Тирренского моря"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "Господство в Тирренском море повышает силу тяжёлых кораблей, силу торгового центра и морское присутствие."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Власть над Лангедоком"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "Захват Лангедока ускоряет интеграцию и повышает досягаемость."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Захват Гаскони"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Захват Гаскони повышает ежемесячный престиж и досягаемость."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "Лионские ворота"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Захват Лиона повышает силу торгового центра и ускоряет интеграцию."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "Долина Луары"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "Захват долины Луары повышает культурное влияние и усиливает власть правителя."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "Нормандский берег"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Захват Нормандии повышает боевой дух флота и силу тяжёлых кораблей."
 sav_events.3.t: "Образование Сардинии-Пьемонта"
 sav_events.3.d: "Захватив почти всю Сардинию, Савойский дом решил официально принять титул «короля Сардинии». В истории (1720) Савойя получила Сардинию по итогам войны за испанское наследство и основала «Королевство Сардиния». Это двойное королевство Сардиния-Пьемонт станет колыбелью объединения Италии. Соединив материковый Пьемонт с островом Сардиния, королевство поднимется как крупная держава Северной Италии."
 sav_events.3.a: "Как король Сардинии — станьте знаменосцем объединения Италии!"
 sav_franchises: "Савойские вольности"
 sav_franchises_desc: "В средневековом Пьемонте Савойский дом жаловал городам права, называемые «вольностями». Свобода переселения, раскрепощение крестьян и расширенные торговые права купцов подстёгивают соперничество городов и оживляют Пьемонт. Выполнение задания позволяет жаловать районам городские права «Савойские вольности»."
 sav_franchises_tooltip: "Во владении 15 или более районов и 1 или более рыночный центр"
 sav_patria_legis: "Савойя — Валле-д'Аоста"
 sav_patria_legis_desc: "«Patria Legis» соединяет традиции самоуправления Валле-д'Аосты с принципами правления Савойского дома в разумный правовой порядок в духе Возрождения. Выполнение задания позволяет жаловать районам городские права «Савойя — Валле-д'Аоста»."
 sav_patria_legis_tooltip: "Возрождение принято, и во владении 1 или более университет"
 STATIC_MODIFIER_NAME_sav_franchises_unlock_mod: "Открыты городские права: вольности"
 STATIC_MODIFIER_DESC_sav_franchises_unlock_mod: "Позволяет жаловать районам городские права «Вольности». Действие: скорость переселения населения +50%, раскрепощение крестьян +10%, сделки на бюргера +100%."
 STATIC_MODIFIER_NAME_sav_patria_legis_unlock_mod: "Открыты городские права: Patria Legis"
 STATIC_MODIFIER_DESC_sav_patria_legis_unlock_mod: "Позволяет жаловать районам городские права «Patria Legis». Действие: ежемесячное процветание +0,2%, скорость повышения населения +20%, эффективность производства +5%."
 franchises: "Вольности"
 franchises_desc: "Городские права, дарованные Савойским домом: свобода переселения, раскрепощение крестьян и расширенные торговые права купцов."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Городские права, соединяющие традиции Валле-д'Аосты с правовыми началами Савойи: процветание городов, подвижность общества и эффективность производства."
