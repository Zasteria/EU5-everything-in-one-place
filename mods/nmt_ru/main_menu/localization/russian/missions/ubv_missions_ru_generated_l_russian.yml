l_russian:
 ubv_oberbayern_mission_pack: "The Munich Legacy — The Road to Bavarian Reunification"
 ubv_oberbayern_mission_pack_DESCRIPTION: "As the House of Munich, descended from Emperor Louis IV, unite the fractured lands of Bavaria as one once more."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION: "Develop Munich and reunify Bavaria."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP: "Develop Munich and reunify Bavaria."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS: "Rise as Duke of all Bavaria!"
 ubv_wittelsbach_legacy: "The Wittelsbach Legacy"
 ubv_wittelsbach_legacy_desc: "The Duchy of Bavaria, divided by the 1329 Treaty of Pavia — as the Munich branch descended from Emperor Louis IV, inherit this legacy."
 ubv_secure_munich: "Develop Munich"
 ubv_secure_munich_desc: "Munich on the Isar — develop this city, beloved by Emperor Louis IV, as the center of the duchy."
 ubv_salt_trade: "The Salt Trade"
 ubv_salt_trade_desc: "Salt, called 'white gold' — seize the salt mines of Reichenhall, and secure the wealth of this precious resource."
 ubv_imperial_relations: "Relations with the Empire"
 ubv_imperial_relations_desc: "The imperial throne once held by Louis IV — make our relations with the Holy Roman Empire worthy of this glorious memory."
 ubv_bavarian_ambition: "Ambition for a United Bavaria"
 ubv_bavarian_ambition_desc: "Munich's development, the salt trade, imperial relations, and rivalry with Ingolstadt — build upon these, and harbor ambition for all of Bavaria."
 ubv_reunite_bavaria: "Reunite Bavaria"
 ubv_reunite_bavaria_desc: "The fractured duchy — reclaim the lands of Lower Bavaria, and unite Bavaria as one once more."
 ubv_duke_of_all_bavaria: "Duke of All Bavaria"
 ubv_duke_of_all_bavaria_desc: "Under the bloodline of the House of Munich, all of Bavaria is at last united beneath a single banner."
 ubv_events.1.t: "Declaration of Bavarian Unity"
 ubv_events.1.d: "Under the bloodline of the House of Munich, Bavaria is at last united as one. The age of division comes to an end."
 ubv_events.1.a: "Glory to Bavaria!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "The Wittelsbach Legacy"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "The memory of a house that once wore the imperial crown brings the state prestige."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "Munich Developed"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "The city on the Isar flourishes as the center of the duchy."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "The Salt Trade"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "The salt mines of Reichenhall bring wealth to the treasury."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "Relations with the Empire"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Good relations with the Empire raise diplomatic prestige."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Bavaria Reunited"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "The reunited duchy speeds integration."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Duke of All Bavaria"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "The completion of unification has raised national prestige."
 ubv_unified_duchy: "The Unified Duchy of Bavaria"
 ubv_unified_duchy_desc: "The age of division is over — as a unified Duchy of Bavaria, open a new era."
 ubv_landrecht: "The Bavarian Landrecht"
 ubv_landrecht_desc: "One law for a unified duchy — enact the Bavarian legal code (Landrecht), and strengthen the foundation of governance."
 ubv_tyrol_ambition: "Ambition for Tyrol"
 ubv_tyrol_ambition_desc: "The County of Tyrol, cradled by the Alps — harbor ambition for this land."
 ubv_swabian_expansion: "Expansion into Swabia"
 ubv_swabian_expansion_desc: "Swabia, spreading to the southwest — strengthen our influence over this region."
 ubv_greater_bavaria: "Realize a Greater Bavaria"
 ubv_greater_bavaria_desc: "The legal code, the Estates, Tyrol, and Swabia — build upon these, and realize a greater Bavaria."
 ubv_counter_reformation_leader: "Leader of the Counter-Reformation"
 ubv_counter_reformation_leader_desc: "Embody the spirit of the Council of Trent, and stand at the forefront of the Counter-Reformation."
 ubv_electoral_dignity: "Electoral Dignity"
 ubv_electoral_dignity_desc: "In 1623, Maximilian I at last secures the rank of Elector — make this honor the eternal pride of Bavaria."
 ubv_austrian_rivalry: "Rivalry with Austria"
 ubv_austrian_rivalry_desc: "Rivalry with the House of Habsburg over hegemony within the Empire — face this contest with our great rival."
 ubv_war_of_austrian_succession: "The War of the Austrian Succession"
 ubv_war_of_austrian_succession_desc: "The war over Charles VII's claim to the imperial throne — seize this succession war to raise Bavaria's prestige."
 ubv_imperial_crown: "The Imperial Crown"
 ubv_imperial_crown_desc: "In 1742, Charles VII, Duke of Bavaria, is crowned Holy Roman Emperor — the first non-Habsburg to wear the crown in centuries."
 ubv_enlightened_absolutism: "Enlightened Absolutism"
 ubv_enlightened_absolutism_desc: "An age of enlightenment valuing reason and learning — bring this new current of thought into Bavaria's governance."
 ubv_napoleonic_alliance: "Defiance of France"
 ubv_napoleonic_alliance_desc: "Europe shaken by revolution and the ambitions of Napoleon — Bavaria secures a claim to the throne of this powerful neighbor, and charts its own course."
 ubv_kingdom_of_bavaria: "The Kingdom of Bavaria Proclaimed"
 ubv_kingdom_of_bavaria_desc: "In 1806, Elector Maximilian IV Joseph proclaims himself King of Bavaria — the long history of the House of Wittelsbach reaches a new summit here."
 ubv_events.2.t: "Joining the Thirty Years' War"
 ubv_events.2.d: "An unprecedented war engulfing the whole Empire — Bavaria throws itself into this struggle for the Catholic cause."
 ubv_events.2.a: "For God and the Catholic cause!"
 ubv_events.3.t: "The Imperial Crown"
 ubv_events.3.d: "In 1742, Charles VII, Duke of Bavaria, was crowned Holy Roman Emperor in the cathedral of Frankfurt. It has been centuries since anyone but a Habsburg wore the imperial crown."
 ubv_events.3.a: "Glory to His Imperial Majesty!"
 ubv_events.99.t: "Proclamation of the Kingdom of Bavaria"
 ubv_events.99.d: "In 1806, Elector Maximilian IV Joseph, under the Confederation of the Rhine, proclaimed himself King of Bavaria. The long history of the House of Wittelsbach reaches a new summit here."
 ubv_events.99.a: "Long live the Kingdom of Bavaria!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "The Unified Duchy of Bavaria"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "The memory of unification brings the state prestige and discipline."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "A Greater Bavaria Realized"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "The expanded duchy raises national power."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Leader of the Counter-Reformation"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "Advancing the movement of conversion speeds proselytization."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "The War of the Austrian Succession"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Experience of the succession war improves battlefield results."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "The Imperial Crown"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "The memory of wearing the imperial crown greatly raises national prestige and diplomatic standing."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Enlightened Absolutism"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "The introduction of enlightenment thought advances literacy."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Electoral Dignity"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "The rank of Elector raises diplomatic prestige and skill in improving relations."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "The Kingdom of Bavaria"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "The founding of the kingdom has led national power to its zenith."
