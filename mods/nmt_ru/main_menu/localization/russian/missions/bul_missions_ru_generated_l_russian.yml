l_russian:
 bul_bulgaria_mission_pack: "Новая Византия — наследие Второго царства и господство на Балканах"
 bul_bulgaria_mission_pack_DESCRIPTION: "Как наследник Второго Болгарского царства, утвердите независимость, добейтесь господства на Балканском полуострове, отразите османскую угрозу и воздвигните в Константинополе новую Византию."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION: "Утвердите независимость, возродите балканскую империю, отразите Османов и основайте Новую Византию."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP: "От древнего Тырнова — к новой империи, сияющей над Балканами."
 bul_bulgaria_mission_pack_BUTTON_DETAILS: "«Владыка Царьграда»: примите славу Второго царства и основайте Третье Болгарское царство!"
 bul_second_bulgarian_legacy: "Распадающееся царство"
 bul_second_bulgarian_legacy_desc: "Великая держава, созданная Иваном Асенем I и Иваном Асенем II, из-за честолюбия знати раскалывается на Тырново, Видин и Добруджу — остановите этот упадок."
 bul_assert_independence: "Власть Царьграда"
 bul_assert_independence_desc: "Царство на грани распада — как царь Тырновский, установите власть, которая не склонится ни перед одной соперничающей силой."
 bul_tarnovo_capital: "Развить Тырново"
 bul_tarnovo_capital_desc: "Тырново когда-то звали «Вторым Царьградом» — верните этой земле славу бывшей царской столицы."
 bul_bulgarian_patriarchate: "Болгарский патриархат"
 bul_bulgarian_patriarchate_desc: "Автокефальная церковь, независимая от Константинополя, — сделайте власть Болгарской православной церкви незыблемой."
 bul_boyar_council: "Боярский совет"
 bul_boyar_council_desc: "Бояре — знать, издавна служившая опорой Болгарии. Сделайте их совет столпом управления."
 bul_reunite_bulgaria: "Воссоединить Болгарию"
 bul_reunite_bulgaria_desc: "Болгария и Силистрия — соберите эти исконные земли под одним знаменем."
 bul_bulgarian_independence: "Воссоединение царства"
 bul_bulgarian_independence_desc: "Царство распалось на Видин и Добруджу — верните эти земли под одну корону и воссоедините царство вокруг Тырнова."
 bul_sofia: "Город Святой Премудрости"
 bul_sofia_desc: "Сердика, Средец, Триадица — этот город за века сменил много имён. Дайте ему название, достойное новой эпохи."
 bul_conquer_macedonia: "Завоевать Македонию"
 bul_conquer_macedonia_desc: "Македония с давних времён была средоточием болгарской культуры — верните эту землю в наши владения."
 bul_conquer_serbia: "Завоевать Сербию"
 bul_conquer_serbia_desc: "Соседние сербские земли — покорите этого соперника в борьбе за господство на Балканах."
 bul_bulgarian_empire: "Болгарское царство"
 bul_bulgarian_empire_desc: "Когда-то Болгария правила великой державой, охватывавшей большую часть Балкан. Мы вернём эти земли в наши владения!"
 bul_conquer_wallachia: "Завоевать Валахию"
 bul_conquer_wallachia_desc: "Валахия на северном берегу Дуная — утвердите своё влияние на этой земле."
 bul_conquer_moldavia: "Завоевать Молдавию"
 bul_conquer_moldavia_desc: "Молдавия к востоку от Карпат — присоедините эту богатую землю к нашим владениям."
 bul_conquer_transylvania: "Завоевать Трансильванию"
 bul_conquer_transylvania_desc: "Трансильвания, окружённая горами, — сделайте эту область частью нашего царства."
 bul_conquer_thrace_greece: "Завоевать Фракию и Северную Грецию"
 bul_conquer_thrace_greece_desc: "Земля древних фракийцев и север Греции — включите этот край в наше царство."
 bul_extend_the_empire: "Расширить царство"
 bul_extend_the_empire_desc: "Границы царства нужно раздвинуть ещё дальше. Продолжим поход в Грецию и за Карпаты."
 bul_chitalishte_movement: "Движение читалищ"
 bul_chitalishte_movement_desc: "Пусть «читальни», называемые читалищами, — общинные очаги культуры — укоренятся по всей стране, прививая горожанам грамотность и национальное самосознание. Здесь начинается Болгарское национальное возрождение."
 bul_chitalishte_unlock_tt: "Становится доступна городская привилегия «Город читалищ»."
 bul_ottoman_wars: "Войны с Османами"
 bul_ottoman_wars_desc: "Османская империя набирает силу — вступите в борьбу с этой новой угрозой."
 bul_varna_crusade: "Крестовый поход на Варну"
 bul_varna_crusade_desc: "Выступите вместе с Венгрией и возглавьте крестовый поход против Османов. В 1444 году под Варной решится ход истории."
 bul_end_ottoman_threat: "Покончить с османской угрозой"
 bul_end_ottoman_threat_desc: "Некогда грозная османская угроза — положите ей конец и упрочьте наше положение на Балканах."
 bul_constantinople_ambition: "Притязания на Константинополь"
 bul_constantinople_ambition_desc: "Город, бывший когда-то средоточием православного мира, — устремите к нему свои помыслы."
 bul_new_byzantium: "Константинополь и Рим"
 bul_new_byzantium_desc: "Константинополь, средоточие православного мира, и Рим, престол Западной церкви, — овладейте обоими городами, и пусть Болгария станет новой империей, возглавляющей обе половины христианского мира."
 bul_black_sea_trade: "Черноморская торговля"
 bul_black_sea_trade_desc: "Варна — портовый город на Чёрном море. Сделайте её опорой черноморской торговли."
 bul_black_sea_dominion: "Господство на Чёрном море"
 bul_black_sea_dominion_desc: "Протяжённое побережье Чёрного моря — установите превосходство в торговле на этих водах."
 bul_third_bulgarian_empire: "Третье Болгарское царство"
 bul_third_bulgarian_empire_desc: "Независимость, объединение Балкан, разгром Османов и основание Новой Византии — Третье Болгарское царство завершено."
 bul_events.1.t: "Провозглашение воссоединения царства"
 bul_events.1.d: "Тырново, Видин и Добруджа, некогда разделённые, вновь стали единым царством. Второе Болгарское царство обретает новую силу."
 bul_events.1.a: "Слава Болгарии!"
 bul_events.4.t: "История Софии"
 bul_events.4.d: "Этот древний город, который римляне звали Сердикой, а славяне позднее — Средцем, получит новое имя в честь церкви Святой Премудрости (Софии). Фракийцы, римляне, византийцы и болгары — пусть память хранит вес многих цивилизаций, прошедших через эту долину."
 bul_events.4.a: "Назвать его Софией"
 bul_events.4.b: "Назвать его Софией и сделать новой царской столицей"
 bul_events.2.t: "Провозглашение Болгарского царства"
 bul_events.2.d: "Властвуя над Македонией, Сербией и Рашкой, Болгария провозглашает себя царством."
 bul_events.2.a: "Да здравствует царь!"
 bul_events.3.t: "Мечта о Новой Византии"
 bul_events.3.d: "И в стенах Константинополя, и на холмах вечного Рима теперь реет знамя Болгарии. Новое средоточие православного мира и престол Западной церкви — два этих города возрождаются как две опоры новой империи."
 bul_events.3.a: "С нами Бог!"
 bul_events.99.t: "Провозглашение Третьего Болгарского царства"
 bul_events.99.d: "Долгий путь, начатый в древнем Тырнове, через объединение Балкан, разгром Османов и основание Новой Византии, здесь достиг своего истинного завершения."
 bul_events.99.a: "Да здравствует Третье Болгарское царство!"
 bul_hagia_sophia_sofia: "Церковь Святой Софии"
 bul_hagia_sophia_sofia_desc: "Базилика, воздвигнутая в VI веке при императоре Юстиниане, — её имя, означающее «Святая Премудрость», со временем перешло к выросшему вокруг неё городу. Пережив бесчисленные века, эта церковь тихо хранит свою историю как душа новой столицы в сердце Болгарии."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "Наследие Второго Болгарского царства"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Даже в буре междоусобиц законы и ремесло придворных писцов едва держатся."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Независимость утверждена"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Никто больше не смеет оспаривать власть того, кто восседает на тырновском престоле."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Велико-Тырново"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Дворцы и церкви на холме Царевец возвращают себе величие царской столицы."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "Болгарский патриархат"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "Благословение патриарха несёт мир в сердца верующих, где бы они ни жили."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "Боярский совет"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Бояре вновь присягнули престолу на верность."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Болгария воссоединена"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Над землями, некогда разорванными на части, вновь реет одно знамя."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Македония завоёвана"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "Горы, видевшие славу Самуила, вернулись во владения царя."
 STATIC_MODIFIER_NAME_bul_serbia_mod: "Сербия завоёвана"
 STATIC_MODIFIER_DESC_bul_serbia_mod: "Болгарские знамёна теперь стоят по всей Сербской равнине."
 STATIC_MODIFIER_NAME_bul_wallachia_mod: "Валахия завоёвана"
 STATIC_MODIFIER_DESC_bul_wallachia_mod: "На северном берегу Дуная наша воля обрела вес."
 STATIC_MODIFIER_NAME_bul_moldavia_mod: "Молдавия завоёвана"
 STATIC_MODIFIER_DESC_bul_moldavia_mod: "Из молдавских житниц в Тырново текут богатства."
 STATIC_MODIFIER_NAME_bul_transylvania_mod: "Трансильвания завоёвана"
 STATIC_MODIFIER_DESC_bul_transylvania_mod: "За карпатскими перевалами нам покорились новые земли."
 STATIC_MODIFIER_NAME_bul_thrace_mod: "Фракия и Северная Греция завоёваны"
 STATIC_MODIFIER_DESC_bul_thrace_mod: "Древняя земля Фракии вновь несёт следы войны."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "Царство расширено"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Растущие границы дают почувствовать нашу силу каждой соседней державе."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "Войны с Османами"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Бесчисленные стычки с турецкой угрозой закалили наших солдат."
 STATIC_MODIFIER_NAME_bul_varna_mod: "Крестовый поход на Варну"
 STATIC_MODIFIER_DESC_bul_varna_mod: "О тех, кто пал на холмах под Варной, рассказывают по сей день."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Османской угрозе конец"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Балканы облегчённо вздыхают: долго страшившая угроза отступила."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Притязания на Константинополь"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "Тень наших военных кораблей теперь ложится на морской путь из Чёрного моря в Средиземное."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Черноморская торговля"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "В гавань Варны без конца заходят и уходят чужеземные торговые суда."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Господство на Чёрном море"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Болгарские торговые суда ходят по Чёрному морю, как по своему."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "Третье Болгарское царство"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "Свет, некогда исходивший из Тырнова, теперь озаряет все Балканы."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Независимость Болгарии провозглашена"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "Разделённые земли снова едины, и каждой державе придётся считаться с этим возрождением."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "Новая Византия"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "В церквях Константинополя теперь звучат новые голоса молитвы."
