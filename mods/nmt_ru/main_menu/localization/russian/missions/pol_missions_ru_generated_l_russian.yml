 pol_lithuanian_relations: "Relations with Lithuania"
 pol_lithuanian_relations_desc: "The Grand Duchy of Lithuania is Poland's most important neighbor — a potential ally or greatest threat. In the 14th century, Lithuania was the last pagan nation in Europe and yet a formidable state stretching from the Baltic to the Black Sea. To secure the personal union with Lithuania through Queen Jadwiga's marriage policy, diplomatic groundwork must be laid first. Whether through friendly relations or military pressure, Poland can assert its claim to the Lithuanian throne."
 pol_lithuanian_relations_tooltip: "Lithuania (c:LIT) opinion 100 or more, or allied, or rival, or Vilnius owned by us or a subject"
 pol_develop_ruthenia_desc: "Galicia (Halych) and Volhynia are the two great principalities of Red Ruthenia. Lviv (Lemberg), center of the Principality of Galicia (HAL), and the Principality of Volhynia (VOL) were conquered by Poland in 1349-66. Belz is also a key Ruthenian stronghold. Bringing both Galicia and Volhynia into personal union under Poland — or directly owning Lviv and Belz — establishes control over all of Red Ruthenia. This land is one of Europe's greatest agricultural zones, and its rich soil supports Poland's population and economy."
 pol_develop_ruthenia_tooltip: "Galicia (c:HAL) and Volhynia (c:VOL) in personal union, or Lviv and Belz owned by us or a subject"
 pol_hre_influence_tooltip: "Allied with, opinion 150+, or rival with Habsburg (c:HAB), or power projection 20+. Reward includes cb_claim_throne on Habsburg"
 pol_upper_silesia_mines_tooltip: "Own 3+ Silesia area locations with RGO level 5+. Reward grants local_max_rgo_size_modifier 20% to all Silesia area locations"
 pol_moldavia_vassal_tooltip: "In personal union or subject with Moldavia (c:MOL), or Iași owned by Hungary or us/subject"
