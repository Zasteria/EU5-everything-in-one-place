 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Influence over Transylvania through the Hungarian personal union enhances Poland's cultural capacity and diplomatic power."
 pol_breadbasket_town_right_tt: "The town right [Imperial Breadbasket] is now available. Can be granted to city-rank or above locations that have 5 or more granary levels."
