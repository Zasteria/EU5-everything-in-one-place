l_russian:
 pol_jagiellonian_dynasty_mission_pack: "Glory of the Jagiellonian Dynasty"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION: "In 1337, the Kingdom of Poland is ruled by Casimir III the Great. His heir will be Louis I of Hungary (Angevin), and Louis's daughter Jadwiga will marry the Lithuanian Grand Duke Jagiello, creating the Polish-Lithuanian personal union. Conflict with the Teutonic Knights in the north, union with Hungary in the south, eastern expansion through Lithuania, and ambitions toward Bohemia — fulfill all of these and build the greatest noble republic in Central-Eastern Europe."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION: "As Poland, expand in all directions — domestic, east, north, south, and west — and realize the Polish Golden Age."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP: "Complete missions to realize the Polish Golden Age."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS: "From Casimir the Great to the Jagiellonian Golden Age — build the Republic of Nobles!"
 pol_kingdom_of_poland: "The Kingdom of Poland"
 pol_kingdom_of_poland_desc: "Casimir III — 'the Great' — ascended to the throne in 1333 and unified Poland from its fragmented state. 'He received a Poland of wood and left one of stone,' as later generations said. He promoted law reform, city-building, and protection of Jews, and his reign is considered the height of medieval Polish prosperity. Raise legitimacy and stability, and consolidate the foundations of the realm."
 pol_kingdom_of_poland_tooltip: "Legitimacy 50 or more, stability 20 or more"
 pol_integrate_mazovia: "Integrate Mazovia"
 pol_integrate_mazovia_desc: "The Duchy of Mazovia is ruled by a cadet branch of the Piast dynasty, sitting in the fertile lowlands at the heart of Poland. Securing Warsaw and Lublin and fully integrating this rich plain into the Kingdom of Poland establishes the political center of central Poland. Seize early what history will give in 1526."
 pol_integrate_mazovia_tooltip: "Warsaw and Lublin owned by us or a subject"
 pol_great_sejm: "The Great Sejm"
 pol_great_sejm_desc: "The Polish Sejm — the parliament — has developed since the 13th century. This estates assembly of magnates, szlachta (nobility), and clergy established the concept of 'Golden Liberty' (Złota Wolność) in the 15th-16th centuries, gradually transforming Poland into a noble republic. Strengthen the Sejm and balance royal power with noble rights."
 pol_great_sejm_tooltip: "Legitimacy 70 or more, nobles estate satisfaction 0.65 or more"
 pol_krakow_renaissance: "The Renaissance of Kraków"
 pol_krakow_renaissance_desc: "Kraków is the capital of the Kingdom of Poland, and Jagiellonian University — alma mater of Copernicus — is the finest academy in Central-Eastern Europe. The Italian Renaissance reaches Kraków, and Wawel Castle is rebuilt in Renaissance style. Develop the university and cultivate Kraków as the intellectual center of Central-Eastern Europe."
 pol_krakow_renaissance_tooltip: "University built in Kraków, monthly prestige 0.20 or more"
 pol_jagiellonian_university: "The Flourishing of Jagiellonian University"
 pol_jagiellonian_university_desc: "Jagiellonian University, founded by Casimir III in 1364 and revived by Queen Jadwiga in 1400, produced Nicolaus Copernicus (1473-1543) and many other great minds. Expanding universities across Poland will spread the light of learning throughout the realm."
 pol_jagiellonian_university_tooltip: "Own 5 or more universities, monthly prestige 0.30 or more"
 pol_polish_golden_age: "The Polish Golden Age"
 pol_polish_golden_age_desc: "Under the Jagiellonian dynasty, Poland enjoyed a 'Golden Age' (Złoty Wiek) in the 15th-16th centuries. Copernicus's heliocentrism, Kochanowski's poetry, Kraków's art — Poland was not only a great power but a cultural vanguard. Prove this golden age through vast territory, rich income, and high prestige."
 pol_polish_golden_age_tooltip: "Own 300 or more locations, monthly income 200 or more, prestige 60 or more"
 pol_jadwiga_union: "The Marriage of Jadwiga and Jagiello"
 pol_jadwiga_union_desc: "The Union of Krewo in 1385 arranged the marriage of Polish Queen Jadwiga and Lithuanian Grand Duke Jagiello (Władysław II Jagiello). Jagiello converted to Christianity and claimed the title of King of Poland in exchange for Catholicizing Lithuania. This marriage was the beginning of the Polish-Lithuanian union state — and the dawn of the Jagiellonian dynasty that would last over two centuries."
 pol_jadwiga_union_tooltip: "In personal union or subject relationship with Lithuania (c:LIT)"
 pol_develop_ruthenia: "Develop Ruthenia"
 pol_develop_ruthenia_desc: "Ruthenia (Red Ruthenia) is an agriculturally rich region in western Ukraine. Lviv (Lemberg), center of the Principality of Galicia-Volhynia, was conquered by Poland in 1349. Brest-Litovsk is the key frontier post on the border with Lithuania. Developing this region firmly establishes Polish dominance in the east."
 pol_develop_ruthenia_tooltip: "Lviv and Brest-Litovsk owned by us or a subject"
 pol_control_kyiv: "Control of Kyiv"
 pol_control_kyiv_desc: "Kyiv was the capital of Kievan Rus, the birthplace of Slavic civilization. After the Mongol destruction of 1240, the city fell under Lithuanian rule. Seizing Kyiv establishes control over the entire Dnieper River basin and opens the road to the Black Sea."
 pol_control_kyiv_tooltip: "Kyiv owned by us or a subject"
 pol_push_east: "Push to the East"
 pol_push_east_desc: "Minsk is the heart of Lithuania; Smolensk is a vital hub of the eastern Slavic world. As the Grand Duchy of Moscow rises, securing these cities would make the Polish-Lithuanian union the dominant power of the eastern Slavic world. The historical contest over Smolensk that Ivan III fought — this time, it unfolds in Poland's favor."
 pol_push_east_tooltip: "Minsk and Smolensk owned by us or a subject"
 pol_eastern_empire: "Eastern Empire"
 pol_eastern_empire_desc: "The Polish-Lithuanian Commonwealth became the largest state in Europe at its peak (c. 1618). From the Baltic to the Pontic Steppe (Black Sea), the entire eastern Slavic world united under the Polish flag. Build the great eastern empire that Russia, the Ottomans, and the Habsburgs equally fear."
 pol_eastern_empire_tooltip: "Own 500 or more locations, own 150 or more locations in Eastern Europe region"
 pol_prussian_confederation: "The Prussian Confederation and the Teutonic Knights"
 pol_prussian_confederation_desc: "The Teutonic Order, which conquered the Baltic pagans in the 13th century, has become Poland's hereditary enemy. At Grunwald in 1410, the Polish-Lithuanian army crushed them utterly. With the support of the Prussian Confederation — Prussian townspeople who sought Polish protection — defeat the Teutonic Order and secure Poland's outlet to the Baltic Sea."
 pol_prussian_confederation_tooltip: "Toruń owned by us or a subject, at war with Teutonic Order (c:TUE) or they don't exist or are our subject"
 pol_gdansk_port: "The Port of Gdańsk"
 pol_gdansk_port_desc: "Gdańsk (Danzig) is called the 'Gateway of Poland' — the most important port on the Baltic Sea. Located at the mouth of the Vistula River, this city was the Hanseatic League's premier hub and the key to Polish grain exports. Secured by Poland in the Peace of Thorn (1466), Gdańsk served as the heart of the Polish economy for two centuries."
 pol_gdansk_port_tooltip: "Gdańsk owned by us or a subject, city rank or above"
 pol_baltic_dominance: "Baltic Dominance"
 pol_baltic_dominance_desc: "'He who controls Gdańsk controls the Baltic grain trade' — in the 16th century, Polish grain exported through the Baltic to Amsterdam fed all of Europe. Fully seize this trade route and establish Poland as the 'Breadbasket of Europe.'"
 pol_baltic_dominance_tooltip: "Fleet size 20 or more, monthly income 100 or more"
 pol_livonian_expansion: "Expansion into Livonia"
 pol_livonian_expansion_desc: "Livonia (modern Latvia and Estonia), once ruled by the Livonian Order, became a theater of contest among Russia, Sweden, Denmark, and Poland in the 16th century. Seizing Riga and Tallinn (Reval) brings the entire Baltic Sea under Polish control."
 pol_livonian_expansion_tooltip: "Riga and Tallinn owned by us or a subject"
 pol_master_of_the_north: "Master of the North"
 pol_master_of_the_north_desc: "Königsberg (now Kaliningrad), once the Teutonic Order's stronghold, now flies the Polish banner. With a mighty fleet controlling the entire Baltic, Poland holds Scandinavia, the Hansa, and the Dutch in the palm of its hand — the supreme master of the north."
 pol_master_of_the_north_tooltip: "Königsberg owned by us or a subject, fleet size 40 or more, monthly income 200 or more"
 pol_hungarian_union: "Personal Union with Hungary"
 pol_hungarian_union_desc: "When Casimir III died without heirs in 1370, his nephew Louis I of Hungary (the Angevin) inherited the Polish throne. This was the beginning of the Polish-Hungarian personal union. Two great kingdoms united under one king — the balance of power in Central-Eastern Europe changes fundamentally."
 pol_hungarian_union_tooltip: "In personal union or subject relationship with Hungary (c:HUN)"
 pol_moldavia_vassal: "Subjugate Moldavia"
 pol_moldavia_vassal_desc: "The Principality of Moldavia (Moldova) is a buffer state contested by Poland, Hungary, and the Ottomans. Stephen the Great (r. 1457-1504) maintained nominal Polish suzerainty while preserving de facto independence. Firmly place this strategic principality under Polish protection and seize the gateway to the Black Sea."
 pol_moldavia_vassal_tooltip: "In personal union or subject relationship with Moldavia (c:MOL), or own Kyiv"
 pol_wallachia_control: "Control of Wallachia"
 pol_wallachia_control_desc: "Wallachia, the principality north of the Danube, is the frontline against the Ottoman Empire. Vlad II (father of Vlad the Impaler) served Hungary as a member of the Order of the Dragon. Bringing Wallachia under the protection of the Polish-Hungarian union establishes influence over the Balkan Peninsula."
 pol_wallachia_control_tooltip: "Wallachia (c:WAL) is our subject, or Bucharest owned by us or a subject"
 pol_battle_of_grunwald: "The Spirit of Grunwald"
 pol_battle_of_grunwald_desc: "On July 15, 1410, on the fields of Grunwald, the Polish-Lithuanian army utterly crushed the Teutonic Order. Grand Master Ulrich von Jungingen fell on the field, and Poland cemented its reputation as 'Guardian of Christendom.' Now prove that spirit again in war against the forces of Islam."
 pol_battle_of_grunwald_tooltip: "At war with a Muslim country (religion_group:muslim), army size 30 or more"
 pol_shield_of_christendom: "Shield of Christendom"
 pol_shield_of_christendom_desc: "Since Jadwiga's Christianization policy, Poland has stood on the frontline of Eastern European Catholicism. With the Ottoman Empire finally driven out, the Pope, Venice, and the Habsburgs all acknowledge that Poland is the true Antemurale Christianitatis — the Bulwark of Christendom."
 pol_shield_of_christendom_tooltip: "Pope opinion 150+ and allied, or own Kyiv; Ottoman Empire does not exist"
 pol_silesia_integration: "Integration of Silesia"
 pol_silesia_integration_desc: "Silesia (Śląsk) is the birthplace of the Piast dynasty, but in the 14th century it passed to Bohemian and Habsburg control. Reclaiming this rich industrial and commercial region centered on Wrocław (Breslau) is one of Poland's most important national and economic imperatives."
 pol_silesia_integration_tooltip: "Wrocław owned by us or a subject, own 8 or more locations in the Silesia area"
 pol_bohemian_claim: "The Bohemian Crown"
 pol_bohemian_claim_desc: "The Jagiellonian dynasty holds inheritance rights to the Bohemian and Hungarian thrones. Vladislaus II (Jagiellonian) became King of Bohemia in 1471, then also King of Hungary in 1490. Seizing the Bohemian crown in Prague creates the Polish-Bohemian-Hungarian triple monarchy."
 pol_bohemian_claim_tooltip: "In personal union or subject relationship with Bohemia (c:BOH)"
 pol_hre_influence: "Influence over the Holy Roman Empire"
 pol_hre_influence_desc: "The King of Poland who also holds the Bohemian crown can become an Elector of the Holy Roman Empire. By balancing diplomacy with the Habsburgs and expanding influence over German princes, Poland becomes the political center of Central Europe."
 pol_hre_influence_tooltip: "Diplomatic reputation 5+, allied with Habsburg (c:HAB) or opinion 150+, or power projection 20+"
 pol_central_european_power: "Central European Power"
 pol_central_european_power_desc: "A vast realm encompassing Poland, Lithuania, Bohemia, and Hungary, with rich income — Poland has emerged as the greatest power in Central-Eastern Europe. Surrounded by the three great powers of the Holy Roman Empire, the Ottoman Empire, and the Grand Duchy of Moscow, Poland shines with its own unique brilliance."
 pol_central_european_power_tooltip: "Own 400 or more locations, kingdom rank or above, monthly income 300 or more"
 pol_grand_commonwealth: "The Grand Commonwealth"
 pol_grand_commonwealth_desc: "The Commonwealth integrating Poland, Lithuania, Bohemia, and Hungary — this state with its unique political system harmonizing noble freedom and royal authority was known in the 16th-17th centuries as the 'Republic of Many Nations' (Rzeczpospolita). This remarkable political experiment encompassing multiple ethnicities, religions, and languages has reached its zenith."
 pol_grand_commonwealth_tooltip: "Own 800 or more locations, prestige 80 or more, monthly income 600 or more"
 pol_republic_of_nobles: "The Republic of Nobles"
 pol_republic_of_nobles_desc: "The small Kingdom of Poland that Casimir the Great ruled in 1337 has become the Rzeczpospolita — the Republic of Many Nations — the largest and most uniquely constituted state in European history. From the Baltic to the Black Sea, from the Ukrainian steppes to the forests of Bohemia — all united under the Polish banner. This great empire, proud of noble freedom, religious tolerance, and cultural diversity, inscribes Poland's name in the eternal record of history."
 pol_republic_of_nobles_tooltip: "Own 1,200 or more locations, prestige 80 or more, monthly income 1,000 or more"
 pol_events.10.t: "The Marriage of Jadwiga and Jagiello"
 pol_events.10.d: "The Union of Krewo has borne fruit: Polish Queen Jadwiga and Lithuanian Grand Duke Jagiello have wed. Jagiello received Christian baptism and took the name 'Władysław II' as King of Poland. Lithuania enters personal union with Poland, and the greatest political integration in Eastern Europe has begun. This marriage is more than political calculation — it is the historic moment when two peoples, two cultures, two languages unite under one dynasty. 'Poland and Lithuania are one forever,' the Union of Krewo declared."
 pol_events.10.a: "Long live the new Jagiellonian dynasty!"
 pol_events.20.t: "The Polish-Hungarian Personal Union"
 pol_events.20.d: "Poland and Hungary have formed a personal union. Two great kingdoms united under one king — this is the Angevin dynasty's diplomatic triumph and an event that reshapes the history of Central-Eastern Europe. Polish and Hungarian knights now stand shoulder to shoulder. From the Baltic Sea in the north to the Adriatic Sea in the south, a vast realm under one dynasty is taking shape. For the Ottoman Empire, this union is the greatest threat it faces."
 pol_events.20.a: "Poland and Hungary are one!"
 pol_events.99.t: "The Republic of Nobles — Poland's Golden Age"
 pol_events.99.d: "As Casimir the Great left a Poland of stone, the Polish king has now built a state without equal in the world. From the Baltic to the Pontic (Black Sea) — the entire land where Copernicus proved 'the Earth revolves around the Sun' is united under the Polish flag. The 'Republic of Nobles' (Rzeczpospolita) — a state where king and nobility stand equal before the law — is the most original political experiment in the history of European civilization. 'Poland is not yet lost' (Jeszcze Polska nie zginęła) — today's Poland embodies the meaning of those words."
 pol_events.99.a: "Nobles and king march together — Long live Poland!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "Piast Dynasty Legacy"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "The thousand-year legacy of the Piast dynasty — Poland's first royal house — underpins the legitimacy of the Polish crown."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Integration of Mazovia"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Mazovia, centered on Warsaw, has been fully integrated into Poland. This fertile lowland plain functions as the heart of the kingdom."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "The Great Sejm Established"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "Poland's Sejm has been established as the institution of Golden Liberty. A unique political system harmonizing noble autonomy and royal power emerges."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Kraków's Cultural Flowering"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Kraków, centered on Wawel Castle, is bathed in the light of the Renaissance. As Central-Eastern Europe's greatest academic city, scholars and artists gather from across Europe."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "Jagiellonian University Flourishes"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "The Jagiellonian University — alma mater of Copernicus — thrives as Central-Eastern Europe's finest academy. Knowledge and art spread across all of Poland."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "Polish Golden Age"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "Copernicus's heliocentrism, Kochanowski's poetry, Kraków's architecture — in every dimension, Poland enjoys its golden age."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Bond of the Jadwiga-Jagiello Union"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "The Polish-Lithuanian personal union has been established. A vast state stretching from the Baltic to the Black Sea is taking shape."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "Strength of the Polish-Hungarian Alliance"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "The armies of Poland and Hungary have joined forces. The alliance of the two great northern and southern powers increases pressure on the Ottomans."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Development of Ruthenia"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "The agricultural lands of Red Ruthenia have been fully developed. The Black Sea trade route through Lviv is activated."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "Gateway of Kyiv"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Kyiv, birthplace of Slavic civilization, has come under Polish control. Influence over the entire Dnieper River basin is established."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Push to the East"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "With Minsk and Smolensk secured, the entire eastern Slavic world falls within Poland's sphere of influence."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "Eastern Empire"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "The Polish empire stretching from the Baltic to the Black Sea is complete. Inscribed in history as the greatest state in Eastern Europe."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Victory over the Teutonic Order"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "The spirit of Grunwald inspires the Polish army. The memory of defeating Christendom's crusader knights becomes the pride of the military."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Gdańsk Commercial City"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Gdańsk has developed as the Baltic's greatest grain export port. Polish grain flowing through the Vistula River feeds all of Europe."
 STATIC_MODIFIER_NAME_pol_baltic_trade_mod: "Baltic Trade Dominance"
 STATIC_MODIFIER_DESC_pol_baltic_trade_mod: "Poland dominates Baltic grain trade. Grain exports to Amsterdam bring enormous wealth."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Dominion over Livonia"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "With Riga and Tallinn secured, the entire Baltic Sea falls under Polish naval control."
 STATIC_MODIFIER_NAME_pol_north_master_mod: "Master of the North"
 STATIC_MODIFIER_DESC_pol_north_master_mod: "From the Baltic to Scandinavia, the Polish fleet rules the northern seas."
 STATIC_MODIFIER_NAME_pol_moldavia_buffer_mod: "Moldavian Buffer State"
 STATIC_MODIFIER_DESC_pol_moldavia_buffer_mod: "Moldavia has come under Polish influence, establishing a bridgehead on the northern Black Sea coast."
 STATIC_MODIFIER_NAME_pol_wallachian_buffer_mod: "Wallachian Buffer State"
 STATIC_MODIFIER_DESC_pol_wallachian_buffer_mod: "Wallachia has come under the protection of the Polish-Hungarian union, enhancing influence over the Balkans."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "Glory of Grunwald"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "The spirit of Grunwald inspires the Polish army. In battle against the infidel, Poland wins ever greater glory."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Shield of Christendom"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Poland has been inscribed as Antemurale Christianitatis — the Bulwark of Christendom."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Integration of Silesia"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "Silesia, birthplace of the Piast dynasty, has returned to Poland. Its rich mining and industrial lands strengthen the Polish economy."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "Bohemian Crown"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "The Jagiellonian dynasty has seized the Bohemian crown. Prague's Bohemian royal court becomes the stage for Polish diplomacy."
 STATIC_MODIFIER_NAME_pol_hre_influence_mod: "HRE Influence"
 STATIC_MODIFIER_DESC_pol_hre_influence_mod: "Poland has established influence over German princes. Status as an Elector shapes Central European diplomacy."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Central European Power"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Poland has emerged as the greatest power in Central-Eastern Europe. Even among the three great powers, it shines with its own brilliance."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "The Grand Commonwealth"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "The Rzeczpospolita is complete — Europe's greatest political experiment encompassing multiple peoples, religions, and languages."
 STATIC_MODIFIER_NAME_pol_republic_of_nobles_final_mod: "Glory of the Republic of Nobles"
 STATIC_MODIFIER_DESC_pol_republic_of_nobles_final_mod: "The great Commonwealth stretching from the Baltic to the Black Sea is complete. Poland's golden age is inscribed in history forever."
 pol_krakow_capital: "Development of Royal Kraków"
 pol_krakow_capital_desc: "Kraków has functioned as the capital of the Kingdom of Poland for centuries. Centered on Wawel Castle atop its hill, all commercial, political, and religious functions of the realm converge on this city. Develop Kraków to city rank or above to create the foundation for all of Poland's prosperity."
 pol_krakow_capital_tooltip: "Kraków at city rank or above, monthly income 20 or more"
 pol_support_prussian_cities: "Support for the Prussian City League"
 pol_support_prussian_cities_desc: "The cities of Prussia, suffering under the Teutonic Order's heavy taxes and despotism, have appealed to the King of Poland for protection. The Prussian Confederation of 1454 — an alliance of 19 cities and 30 noble families including Gdańsk, Toruń, and Elbląg — offered submission to Poland in exchange for liberation from the Order. Seize this opportunity."
 pol_support_prussian_cities_tooltip: "Toruń and Gniezno owned by us or a subject"
 pol_tend_to_lithuania: "Lithuanian Diplomacy"
 pol_tend_to_lithuania_desc: "Even before the Union of Krewo in 1385, Poland and Lithuania shared common diplomatic interests. Facing the common enemy of the Teutonic Order, cooperation between the two realms was inevitable. Maintain good relations with Lithuania and lay the groundwork for the future personal union."
 pol_tend_to_lithuania_tooltip: "Lithuania (c:LIT) opinion 150 or more, or in union, diplomatic reputation 3 or more"
 pol_varna_aftermath: "Aftermath of Varna"
 pol_varna_aftermath_desc: "At the Battle of Varna in 1444, the Polish-Hungarian crusader coalition was crushed by the Ottomans, and King Władysław III of Poland died in battle. This defeat sent shockwaves through Christendom, but it was also an opportunity to reconfirm the bonds with Hungary. Repair relations with Hungary and prepare for the next crusade."
 pol_varna_aftermath_tooltip: "Hungary (c:HUN) opinion 150 or more, or in union or subject, 3 or more allies"
 pol_piast_revival: "Legacy of the Piast Dynasty"
 pol_piast_revival_desc: "Poznań and Gniezno are Poland's oldest cities — the birthplace of the Piast dynasty's Kingdom of Poland. Gniezno Cathedral houses the relics of Saint Adalbert (Wojciech) and functions as the heart of Polish Catholicism. Secure these holy sites and inherit the Piast legacy."
 pol_piast_revival_tooltip: "Poznań and Gniezno owned by us or a subject"
 pol_support_merchants: "Support for the Merchant Class"
 pol_support_merchants_desc: "Poland's urban burghers are a vital pillar of royal finances. By supporting the trading network centered on the Sukiennice (Cloth Hall) in Kraków, burgher loyalty and fiscal revenues both improve. Satisfy the merchant estate and build the foundations of Poland as a trading nation."
 pol_support_merchants_tooltip: "Monthly income 30 or more, burghers estate satisfaction 0.60 or more"
 pol_black_sea_access: "Access to the Black Sea"
 pol_black_sea_access_desc: "By descending the Dnieper River, Poland can reach the Black Sea. Control of the Crimean Peninsula and the northern coast of the Pontus Euxinus (Black Sea) means securing a trade route to the East that bypasses Ottoman-controlled Constantinople. Build a Black Sea fleet and extend naval dominion."
 pol_black_sea_access_tooltip: "Fleet size 10 or more, own 3 or more locations in the Crimea area"
 pol_conquer_serbia: "Conquer Serbia"
 pol_conquer_serbia_desc: "The Kingdom of Serbia was effectively subjugated by the Ottomans after the Battle of Kosovo (1389). Seizing Belgrade (Smederevo Fortress) establishes a foothold for the defense of Christendom south of the Danube. Let the combined Polish-Hungarian force liberate the Balkans."
 pol_conquer_serbia_tooltip: "Belgrade owned by us or a subject, Serbia (c:SER) is our subject or no longer exists"
 pol_east_prussia_settled: "East Prussia Pacified"
 pol_east_prussia_settled_desc: "After the victory at Grunwald, the cities of East Prussia began submitting to Polish overlordship. Simultaneously controlling Königsberg and Gdańsk brings the entire southern Baltic coast into Polish hands — the historic aspiration fulfilled by the Peace of Thorn (1466), realized here."
 pol_east_prussia_settled_tooltip: "After Grunwald (pol_battle_of_grunwald), Königsberg and Gdańsk owned by us or a subject"
 pol_greater_poland: "Greater Poland"
 pol_greater_poland_desc: "With Silesia integrated and the Bohemian crown secured, the construction of Greater Poland becomes reality. The entire Wielkopolska (Greater Poland) region centered on Poznań has come fully under Polish control, establishing the foundation for westward expansion."
 pol_greater_poland_tooltip: "Own 8 or more locations in Greater Poland area (greater_poland_area), Poznań owned by us or a subject, Bohemia integrated"
 pol_krakow_cloth_hall: "The Kraków Sukiennice (Cloth Hall)"
 pol_krakow_cloth_hall_desc: "The Sukiennice (Cloth Hall) of Kraków is a Gothic-style trading hall built in the 14th century — one of the largest commercial facilities in Central-Eastern Europe. Here, Polish linen, wool, amber, and metals were traded, and merchants from Venice, Flanders, and Persia gathered. Activate this commercial center."
 pol_krakow_cloth_hall_tooltip: "Merchant support and Kraków Renaissance complete, Kraków RGO workers 5 or more, monthly income 50 or more"
 pol_baltic_grain_trade: "Baltic Grain Trade"
 pol_baltic_grain_trade_desc: "Polish grain exports through Gdańsk exploded in the 15th-17th centuries. Grain shipped down the Vistula River and transshipped at Gdańsk for Amsterdam — this trade route made Poland the 'Breadbasket of Europe.' Establish the trade routes."
 pol_baltic_grain_trade_tooltip: "Monthly income 80 or more, own 3 or more market centers"
 pol_breadbasket_of_europe: "Breadbasket of Europe"
 pol_breadbasket_of_europe_desc: "By the late 16th century, Poland supplied most of the grain consumed in Europe. Merchants in Amsterdam, Lisbon, and Seville could not do business without Polish wheat and rye. Poland has been inscribed in history as the 'Breadbasket of Europe.'"
 pol_breadbasket_of_europe_tooltip: "Monthly income 150 or more, produce 20 or more grain in country"
 pol_konigsberg_secured: "Königsberg Secured"
 pol_konigsberg_secured_desc: "Königsberg (Królewiec), once the stronghold of the Teutonic Order, is now under Polish control. Strengthen this formidable fortress city and make it the defensive hub for the entire eastern Baltic coast. Make permanent possession of what would later become the Prussian capital."
 pol_konigsberg_secured_tooltip: "After East Prussia pacified, Königsberg owned by us or a subject, 3 or more bastions"
 pol_pontic_steppe: "The Pontic Steppe"
 pol_pontic_steppe_desc: "The steppe north of the Pontus Euxinus (Black Sea) was called the 'Wild Fields' (Pole Dzikie) and suffered ceaseless Tatar raids. Seizing this land establishes complete access to the Black Sea and creates strategic advantage against the Ottoman Empire."
 pol_pontic_steppe_tooltip: "After Black Sea access, own 80 or more locations in Eastern Europe region"
 pol_smolensk_campaign: "The Smolensk Campaign"
 pol_smolensk_campaign_desc: "Smolensk is a strategic key on the upper Dnieper, disputed repeatedly between Poland-Lithuania and the Grand Duchy of Moscow. At the Battle of Orsha (1514), Lithuanian forces crushed the Muscovite army. This historic battlefield is where Poland establishes its influence over the east."
 pol_smolensk_campaign_tooltip: "Smolensk owned by us or a subject, currently at war"
 pol_contain_muscovy: "Contain Muscovy"
 pol_contain_muscovy_desc: "Since Ivan III, the Grand Duchy of Moscow has risen rapidly and threatens the eastern reaches of Poland-Lithuania. By constructing a fortress line anchored at Minsk and Smolensk, the westward advance of Moscow can be systematically blocked. Contain the eastern giant before it becomes a great empire."
 pol_contain_muscovy_tooltip: "After Smolensk campaign, Minsk owned by us or a subject, 5 or more bastions"
 pol_balkan_advance: "Advance into the Balkans"
 pol_balkan_advance_desc: "With Serbia and Wallachia secured, the combined Polish-Hungarian forces have advanced deep into the Balkans across the Danube. The time has come to use Belgrade as a forward base and enter full-scale war against the Ottoman Empire. Defeat the Muslim forces with the spirit of Grunwald."
 pol_balkan_advance_tooltip: "After conquering Serbia, Belgrade owned by us or a subject, at war with any Muslim country"
 pol_papal_alliance: "Alliance with the Papacy"
 pol_papal_alliance_desc: "Since the conversion of Mieszko I (966), Poland has maintained a special relationship with the Holy See. By concluding an alliance with the Pope and establishing Poland's status as a true crusader state, Poland is officially recognized as the 'Shield' of Christendom."
 pol_papal_alliance_tooltip: "Pope (c:PAP) opinion 150 or more and allied"
 pol_crusade_against_turks: "Crusade Against the Turks"
 pol_crusade_against_turks_desc: "A crusade blessed by the Pope marches against the Ottoman Empire. Polish knights and Hungarian Black Army join forces — the greatest army in Central-Eastern Europe challenges the Turkish forces. The time to avenge Varna has come."
 pol_crusade_against_turks_tooltip: "After Papal Alliance, army size 40 or more, at war with Muslim country"
 pol_hre_elector: "Influence over the HRE"
 pol_hre_elector_desc: "The King of Poland, also holding the Bohemian crown, holds Elector status in the Holy Roman Empire. By increasing diplomatic pressure on the Habsburgs and establishing a voice in imperial politics, Poland is recognized as a great power that shapes Central European politics."
 pol_hre_elector_tooltip: "After Bohemian claim, diplomatic reputation 5 or more, allied with Habsburg or opinion 150+"
 pol_emperor_of_hre: "Holy Roman Emperor"
 pol_emperor_of_hre_desc: "Backed by the power of the Polish-Bohemian-Hungarian triple monarchy, the King of Poland aims for the Holy Roman Emperor's throne. With 500 or more locations and Empire rank, Poland no longer needs to rely on the Habsburgs. The imperial throne belongs to Poland."
 pol_emperor_of_hre_tooltip: "After HRE influence, 500 or more locations and empire rank, monthly income 400 or more"
 pol_habsburg_rivalry: "Challenge the Habsburgs"
 pol_habsburg_rivalry_desc: "Seizing Vienna transfers Danubian hegemony to Poland. The long diplomatic rivalry with the Habsburgs now meets its military conclusion. Against the Habsburg Empire spanning Germany, Italy, and Spain, Poland presses from the east."
 pol_habsburg_rivalry_tooltip: "After Bohemian claim, Vienna owned by us or a subject"
 pol_central_european_hegemon: "Hegemon of Central Europe"
 pol_central_european_hegemon_desc: "The fall of Vienna makes Poland the undisputed hegemon of Central-Eastern Europe. Over 400 locations, rich income, high prestige — with everything in place, the time has come to truly dominate the Holy Roman Empire."
 pol_central_european_hegemon_tooltip: "After Habsburg challenge, 400 or more locations, monthly income 300 or more, prestige 60 or more"
 pol_copernicus: "The Copernican Revolution"
 pol_copernicus_desc: "Nicolaus Copernicus (1473-1543), born in Toruń, was a Polish astronomer. His 1543 work 'De revolutionibus orbium coelestium' proposed heliocentrism and inaugurated the Scientific Revolution. The achievement of Copernicus, educated at Jagiellonian University, makes Poland known to the world as the 'land of astronomy.'"
 pol_copernicus_tooltip: "After Jagiellonian University, after 1510 or own 10 or more universities"
 pol_magnate_economy: "The Magnate Economy"
 pol_magnate_economy_desc: "Poland's great magnate families own vast estates and built an agricultural economy based on serfdom. This 'folwark system' produced enormous quantities of grain for Baltic trade, generating enormous revenues. Harness the magnates as economic partners."
 pol_magnate_economy_tooltip: "After Jagiellonian University, monthly income 100 or more, own 5 or more market centers"
 pol_folwark_system: "The Folwark System"
 pol_folwark_system_desc: "The folwark — the noble-run agricultural enterprise using serf labor to mass-produce grain — is complete. Despite its dark side (the terrible conditions of serfs), this system made Poland Europe's greatest grain exporter. All of Europe requires Polish grain, delivered through the Baltic Sea."
 pol_folwark_system_tooltip: "After Magnate Economy, monthly income 200 or more, produce 15 or more grain"
 pol_rzeczpospolita: "The Rzeczpospolita"
 pol_rzeczpospolita_desc: "Rzeczpospolita — the Polish-Lithuanian Commonwealth — derives from the Latin 'res publica' (public affair). Formally established by the Union of Lublin in 1569, this state espoused noble freedom (Złota Wolność), religious tolerance, and multiethnic coexistence. Prove these ideals through the prosperity and economic might of the Golden Age."
 pol_rzeczpospolita_tooltip: "After Polish Golden Age and Folwark System, 350 or more locations, monthly income 300 or more"
 STATIC_MODIFIER_NAME_pol_krakow_capital_mod: "Royal Kraków"
 STATIC_MODIFIER_DESC_pol_krakow_capital_mod: "Kraków, crowned by Wawel Castle, has been developed as Central-Eastern Europe's greatest royal capital. Trade and culture flourish as prosperity accelerates."
 STATIC_MODIFIER_NAME_pol_nobles_levy_mod: "Noble Levy System"
 STATIC_MODIFIER_DESC_pol_nobles_levy_mod: "The szlachta (Polish nobility) cavalry has been organized. A powerful cavalry force reminiscent of the glory of Grunwald 1410 becomes the symbol of Polish might."
 STATIC_MODIFIER_NAME_pol_grunwald_glory_mod: "Glory of Grunwald"
 STATIC_MODIFIER_DESC_pol_grunwald_glory_mod: "The memory of July 15, 1410 — Poland's greatest military victory — becomes the army's eternal pride. The spirit of the day that broke the Teutonic Order lives on forever."
 STATIC_MODIFIER_NAME_pol_lithuanian_diplomacy_mod: "Lithuanian Diplomacy"
 STATIC_MODIFIER_DESC_pol_lithuanian_diplomacy_mod: "Polish-Lithuanian diplomatic relations have matured. The groundwork for the marriage of Jadwiga and Jagiello is complete."
 STATIC_MODIFIER_NAME_pol_varna_recovery_mod: "Recovery from Varna"
 STATIC_MODIFIER_DESC_pol_varna_recovery_mod: "The 1444 disaster has been transformed into experience. Preparation for a more careful, more powerful crusade is complete. The next battle will bring victory."
 STATIC_MODIFIER_NAME_pol_piast_revival_mod: "Piast Legacy Inherited"
 STATIC_MODIFIER_DESC_pol_piast_revival_mod: "With Poznań and Gniezno secured, Poland's oldest lands have returned to the crown. A thousand years of Piast legacy is inherited by the Jagiellonians."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Merchant Support Policy"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "A support policy for Kraków's merchant guilds has activated the urban economy. Participation in Baltic trade is now a reality."
 STATIC_MODIFIER_NAME_pol_prussia_settled_mod: "East Prussia Pacified"
 STATIC_MODIFIER_DESC_pol_prussia_settled_mod: "After Grunwald, East Prussia has been fully brought under Polish control. Dominion over the southern Baltic coast is established."
 STATIC_MODIFIER_NAME_pol_greater_poland_mod: "Greater Poland Complete"
 STATIC_MODIFIER_DESC_pol_greater_poland_mod: "With Silesia and Bohemia integrated, the Greater Poland region — birthplace of the Piast dynasty — has been fully incorporated into the Kingdom of Poland."
 STATIC_MODIFIER_NAME_pol_sukiennice_mod: "Sukiennice Trade"
 STATIC_MODIFIER_DESC_pol_sukiennice_mod: "The Kraków Sukiennice (Cloth Hall) is operating at full capacity as Central-Eastern Europe's greatest commercial facility. Merchants come from Venice and Persia alike."
 STATIC_MODIFIER_NAME_pol_konigsberg_mod: "Fortress of Königsberg"
 STATIC_MODIFIER_DESC_pol_konigsberg_mod: "The former Teutonic stronghold of Königsberg has been developed as Poland's frontline fortress. The eastern Baltic defensive line is established."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Black Sea Trade Route"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Access to the Black Sea via the Dnieper River has been established. An eastern trade route bypassing the Ottomans increases Polish wealth."
 STATIC_MODIFIER_NAME_pol_steppe_frontier_mod: "Steppe Frontier"
 STATIC_MODIFIER_DESC_pol_steppe_frontier_mod: "The Pontic steppe secured, the entire northern Black Sea coast falls under Polish influence. Tatar raids are now a thing of the past."
 STATIC_MODIFIER_NAME_pol_smolensk_victory_mod: "Victory at Smolensk"
 STATIC_MODIFIER_DESC_pol_smolensk_victory_mod: "Poland has seized Smolensk and blocked the Grand Duchy of Moscow's westward advance. A glorious victory like Orsha 1514 has been inscribed once more."
 STATIC_MODIFIER_NAME_pol_muscovy_barrier_mod: "Muscovy Contained"
 STATIC_MODIFIER_DESC_pol_muscovy_barrier_mod: "The fortress line at Minsk and Smolensk systematically blocks the Grand Duchy of Moscow's western expansion. The eastern giant is contained."
 STATIC_MODIFIER_NAME_pol_danube_control_mod: "Danube Control"
 STATIC_MODIFIER_DESC_pol_danube_control_mod: "Serbia conquered, the southern Danube bank falls under Polish-Hungarian control. The road to the Balkans is open."
 STATIC_MODIFIER_NAME_pol_breadbasket_mod: "Breadbasket of Europe"
 STATIC_MODIFIER_DESC_pol_breadbasket_mod: "Poland has become Europe's greatest grain exporter. From Amsterdam to Lisbon, all of Europe needs Polish grain."
 STATIC_MODIFIER_NAME_pol_papal_blessing_mod: "Papal Blessing"
 STATIC_MODIFIER_DESC_pol_papal_blessing_mod: "The Roman Pope has officially recognized Poland as the Shield of Christendom. A crusade bull has been sent to the King of Poland, and all Christians rally under the Polish banner."
 STATIC_MODIFIER_NAME_pol_anti_ottoman_crusade_mod: "Anti-Ottoman Crusade"
 STATIC_MODIFIER_DESC_pol_anti_ottoman_crusade_mod: "The Polish-led anti-Ottoman crusade has reached its climax. Supported by the Pope, Hungary, and Venice, Poland inscribes its name in history through this holy war."
 STATIC_MODIFIER_NAME_pol_habsburg_rival_mod: "Habsburg Challenge"
 STATIC_MODIFIER_DESC_pol_habsburg_rival_mod: "The fall of Vienna has collapsed Habsburg authority. Control of the Danube region transfers to Poland."
 STATIC_MODIFIER_NAME_pol_hre_emperor_mod: "Holy Roman Emperor"
 STATIC_MODIFIER_DESC_pol_hre_emperor_mod: "The King of Poland has seized the Holy Roman Emperor's throne. Prague, Vienna, and Kraków are united under one emperor."
 STATIC_MODIFIER_NAME_pol_copernicus_mod: "Copernican Legacy"
 STATIC_MODIFIER_DESC_pol_copernicus_mod: "'The Earth moves — De revolutionibus orbium coelestium' — Copernicus's revolutionary discovery has made Poland known to the world as a land of science."
 STATIC_MODIFIER_NAME_pol_magnate_economy_mod: "Magnate Economy"
 STATIC_MODIFIER_DESC_pol_magnate_economy_mod: "The agricultural and commercial economy led by Poland's great magnate families is established. Folwark grain floods the Baltic Sea."
 STATIC_MODIFIER_NAME_pol_folwark_mod: "The Folwark System"
 STATIC_MODIFIER_DESC_pol_folwark_mod: "Folwark agricultural management based on serfdom has become the economic heart of Poland. Enormous quantities of grain flow down the Vistula River toward Gdańsk."
 STATIC_MODIFIER_NAME_pol_rzeczpospolita_mod: "Ideals of the Rzeczpospolita"
 STATIC_MODIFIER_DESC_pol_rzeczpospolita_mod: "Noble freedom, religious tolerance, multiethnic coexistence — the ideals of the Rzeczpospolita have elevated Poland to become the greatest state of the 17th century."
 pol_nieszawa_privileges: "The Nieszawa Privileges"
 pol_nieszawa_privileges_desc: "In 1454, Casimir IV Jagiellonian needed noble levies for the war against the Teutonic Order — and paid for them with the Nieszawa Statute, granting the szlachta broad privileges. Henceforth the king could neither levy new taxes nor enact new laws without noble consent. This became the cornerstone of Poland's 'Golden Liberty.'"
 pol_nieszawa_privileges_tooltip: "Nobles estate satisfaction 0.75 or more, government reform slots 1 or more"
 pol_develop_krakow: "Develop Kraków"
 pol_develop_krakow_desc: "The Polish capital Kraków has grown around Wawel Castle. Fully developing this city — raising it to city rank — establishes its status as the greatest commercial city in Central-Eastern Europe. Install a local governor and strengthen direct royal administration."
 pol_develop_krakow_tooltip: "Kraków is city rank or above"
 pol_baltic_fleet: "The Baltic Fleet"
 pol_baltic_fleet_desc: "With Gdańsk in hand, Poland has secured its Baltic outlet. The time has come to build a fleet and contest Baltic mastery. As Sweden, Denmark, and the Livonian Order all vie for these waters, the Polish fleet will become the Baltic's newest — and greatest — power."
 pol_baltic_fleet_tooltip: "Fleet size 20 or more"
 pol_sea_to_sea: "From Sea to Sea"
 pol_sea_to_sea_desc: "Livonian naval control and the capture of Kyiv and Smolensk — the Polish-Lithuanian union now spans from the Baltic to the Black Sea. From Tallinn in the north to Kyiv in the south, the greatest contiguous empire in Eastern Europe is complete. Grand Hetman Jan Zamoyski would later say: 'This Poland is a nation that God himself built.'"
 pol_sea_to_sea_tooltip: "Fleet size 30 or more, own 100 or more locations in Eastern Europe region"
 pol_challenge_habsburg: "Challenge the Habsburgs"
 pol_challenge_habsburg_desc: "By the 16th century, the Habsburgs controlled the Holy Roman Empire, Spain, Bohemia, and Hungary — the greatest dynasty in Europe. But as King of Bohemia and Poland, the Jagiellonian monarch can challenge this hegemony. Seize Vienna or bring the Habsburgs under the Polish flag."
 pol_challenge_habsburg_tooltip: "Vienna owned by us or a subject, or in personal union with Austria (c:HAB)"
 pol_codify_law: "Codify the Law"
 pol_codify_law_desc: "Casimir the Great's Wiślica Statute of 1346/47 was the first systematic codification of Polish law. Building on counting house-centered accounting and administrative infrastructure, a more comprehensive codification of Polish law dramatically improves administrative efficiency."
 pol_codify_law_tooltip: "Own 4 or more counting houses, legitimacy 80 or more"
 pol_develop_warsaw: "Develop Warsaw"
 pol_develop_warsaw_desc: "Warsaw has grown as the center of the Duchy of Mazovia. Centrally located in Poland, after the Union of Lublin in 1569 it would become the capital of the Polish-Lithuanian Commonwealth. Raising it to city rank and installing a local governor establishes the administrative foundation of the kingdom's center."
 pol_develop_warsaw_tooltip: "Warsaw is city rank or above"
 pol_amber_road: "The Amber Road"
 pol_amber_road_desc: "Baltic amber — the 'Gold of the North' — has been treasured since antiquity. Gdańsk was the main export port for Baltic amber, and exports to Italy and the Mediterranean brought enormous wealth. Revive this ancient trade route and elevate Poland's economic standing."
 pol_amber_road_tooltip: "Produce 5 or more amber, monthly income 150 or more"
 pol_poznan_commerce: "Commerce of Poznań"
 pol_poznan_commerce_desc: "Poznań is the commercial city of western Poland, the hub of trade with Brandenburg and Silesia. This city, which housed Poland's first episcopal see, has been consistently the commercial center of western Poland since the Middle Ages. Raise it to city rank and maximize its commercial potential."
 pol_poznan_commerce_tooltip: "Poznań is city rank or above"
 pol_vilnius_capital: "Develop Vilnius"
 pol_vilnius_capital_desc: "Vilnius grew rapidly as the capital of the Grand Duchy of Lithuania in the 14th century. Built by Grand Duke Gediminas, this city became home to many Jews, Catholics, and Orthodox Christians living side by side — later known as the 'Jerusalem of the North.' Raise it to city rank and develop it as the center of Lithuanian administration."
 pol_vilnius_capital_tooltip: "Vilnius owned by us or a subject, city rank or above"
 pol_russia_rivalry: "Rivalry with Moscow"
 pol_russia_rivalry_desc: "Ivan III the Great clashed fiercely with Poland-Lithuania over Smolensk. The Smolensk Wars between Moscow and Poland-Lithuania continued throughout the 16th century — a fateful contest. Declare Moscow a rival and establish eastern hegemony. Against Moscow's claim to be 'Guardian of Holy Rus,' Poland stands as 'Guardian of Liberty.'"
 pol_russia_rivalry_tooltip: "Russia (c:RUS) is our rival, or Smolensk owned by us or a subject"
 pol_malbork_castle: "Malbork Castle"
 pol_malbork_castle_desc: "Malbork Castle (Marienburg) was built as the Teutonic Order's headquarters — the largest medieval castle in Europe. Handed to Poland in the Peace of Thorn (1457), this formidable fortress can be upgraded with bastions to create the perfect defensive strongpoint."
 pol_malbork_castle_tooltip: "Malbork owned by us or a subject"
 pol_gniezno_church: "Gniezno Archdiocese"
 pol_gniezno_church_desc: "Gniezno is the historical capital of Poland and the seat of its first archbishopric. Gniezno Cathedral, built around 987, houses the relics of Saint Adalbert and has served as the heart of Polish Catholic faith ever since. Strengthen the Polish Church and fulfill the mission of guardian of Eastern European Catholicism."
 pol_gniezno_church_tooltip: "Gniezno owned by us or a subject, clergy satisfaction 0.75 or more"
 pol_hanseatic_ties: "Hanseatic Ties"
 pol_hanseatic_ties_desc: "The Hanseatic League dominated trade in the Baltic and North Seas. Polish cities like Gdańsk, Toruń, and Elbląg had close Hanseatic ties. Build a vast trade network centered on these cities, and Poland emerges as the Baltic's leading commercial power."
 pol_hanseatic_ties_tooltip: "Monthly income 120 or more, own 5 or more market centers"
 pol_transylvania_influence: "Influence over Transylvania"
 pol_transylvania_influence_desc: "Transylvania is a rich region on the border between the Kingdom of Hungary and the Polish personal union. Establishing influence over Transylvania through the Hungarian union — or directly — stabilizes Poland's southeastern border."
 pol_transylvania_influence_tooltip: "Own 5 or more locations in Transylvania area, or in personal union with Hungary"
 pol_subjugate_serbia: "Subjugate Serbia"
 pol_subjugate_serbia_desc: "The Kingdom of Serbia became an Ottoman vassal after Kosovo (1389). As part of the Polish-Hungarian union's southern expansion, securing Belgrade or bringing Serbia into vassal status establishes a firm foothold in the northern Balkans."
 pol_subjugate_serbia_tooltip: "Serbia (c:SER) is our subject, or Belgrade owned by us or a subject"
 pol_varna_revenge: "Revenge for Varna"
 pol_varna_revenge_desc: "At the Battle of Varna in 1444, the Polish-Hungarian crusader army was crushed by the Ottomans, and Polish King Władysław III died on the field. The time has finally come to avenge that humiliation. Occupy Varna while at war with a Muslim nation, and that tragedy is rewritten as victory."
 pol_varna_revenge_tooltip: "Varna owned by us or a subject, at war with a Muslim country"
 pol_upper_silesia_mines: "Upper Silesian Mines"
 pol_upper_silesia_mines_desc: "Upper Silesia is known for its abundant silver, zinc, and lead mines. Fully developing the mining districts around Cieszyn and Gliwice establishes Poland's industrial foundation. Seize early the mineral resources of this region — which later became a center of the Industrial Revolution."
 pol_upper_silesia_mines_tooltip: "Own 3 or more Silesia-area locations with RGO level 5 or above (silver)"
 pol_pomeranian_coast: "The Pomeranian Coast"
 pol_pomeranian_coast_desc: "Pomerania (Pomorze) is the Baltic coastal region centered on Stettin (Szczecin). Recovering this region — historically part of the Polish realm — gives Poland complete control of the Baltic coastline."
 pol_pomeranian_coast_tooltip: "Stettin owned by us or a subject"
 pol_prague_university: "University of Prague"
 pol_prague_university_desc: "Charles University in Prague (founded 1348) is the oldest university in Central-Eastern Europe. A hotbed of the Hussite reformation, now under Polish rule this academy can be rebuilt and developed — making Prague once again the center of Catholic scholarship."
 pol_prague_university_tooltip: "Prague owned by us or a subject, university built"
 pol_catholicism_of_lithuania: "Catholicization of Lithuania"
 pol_catholicism_of_lithuania_desc: "When Jagiello became King of Poland, he pledged to convert Lithuania to Catholicism. Build churches and monasteries across Lithuania centered on Vilnius, and transform this formerly pagan land into a fully Catholic state. Without this conversion, there can be no true integration of the Polish-Lithuanian union. 'Lithuania reborn in the faith.'"
 pol_catholicism_of_lithuania_tooltip: "Vilnius owned by us or a subject, clergy satisfaction 0.70 or more"
 pol_royal_road: "The Royal Road"
 pol_royal_road_desc: "The 'Royal Road' (Droga Królewska) running from Kraków to Gniezno, Poznań, and Gdańsk is the great artery of the Kingdom of Poland. With Mazovia integrated and Prussia conquered, developing this road dramatically improves communication, trade, and administration across the realm."
 pol_royal_road_tooltip: "Warsaw and Gniezno owned by us or a subject (after Mazovia integration and Prussian conquest)"
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Nieszawa Privileges"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "The szlachta gained veto power over royal legislation. The beginning of Poland's 'Golden Liberty.'"
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "Polish Law Code"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Systematic codification of Polish law improves administrative efficiency throughout the realm."
 STATIC_MODIFIER_NAME_pol_krakow_capital_mod: "Royal Capital Kraków"
 STATIC_MODIFIER_DESC_pol_krakow_capital_mod: "Kraków centered on Wawel Castle has been developed as Central-Eastern Europe's greatest commercial city."
 STATIC_MODIFIER_NAME_pol_warsaw_capital_mod: "Warsaw Developed"
 STATIC_MODIFIER_DESC_pol_warsaw_capital_mod: "Warsaw has been developed as the administrative hub of the kingdom's center — anticipating its future role as capital."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Merchant Support Policy"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Policies supporting Poland's merchant bourgeoisie drive up trade income."
 STATIC_MODIFIER_NAME_pol_breadbasket_mod: "Breadbasket of Europe"
 STATIC_MODIFIER_DESC_pol_breadbasket_mod: "Polish grain exports feed all of Europe. The Vistula route to Gdańsk brings enormous wealth."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "Amber Road"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "The ancient Baltic amber trade route revived. Exports of the 'Gold of the North' expand trade range and income."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Poznań Trade Hub"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "The commercial city of western Poland, Poznań, has been developed as a major trade hub."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Vilnius Flourishes"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "The capital of the Grand Duchy of Lithuania, Vilnius, thrives as a multicultural city."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Black Sea Access"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Poland has secured access to the northern Black Sea coast, entering Mediterranean trade routes."
 STATIC_MODIFIER_NAME_pol_russia_rivalry_mod: "Rivalry with Moscow"
 STATIC_MODIFIER_DESC_pol_russia_rivalry_mod: "The contest for eastern Slavic hegemony with Moscow strengthens Polish military discipline and fortress defense."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "Malbork Fortress"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "Europe's largest medieval castle has been upgraded with bastions — an impregnable defensive strongpoint."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "Gniezno Archdiocese"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "Gniezno Cathedral, home of Saint Adalbert's relics, functions as the spiritual center of Polish Catholic civilization."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Hanseatic Ties"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "The network with the Hanseatic League that dominates Baltic trade dramatically boosts Polish trade income."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Transylvania Influence"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Influence over Transylvania has stabilized Poland's southeastern border."
 STATIC_MODIFIER_NAME_pol_balkan_control_mod: "Northern Balkan Control"
 STATIC_MODIFIER_DESC_pol_balkan_control_mod: "Serbian vassalage has established Polish influence over the Balkans."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "Revenge for Varna"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "The humiliating defeat of 1444 has been avenged. Poland wins ever greater glory in battle against the Islamic world."
 STATIC_MODIFIER_NAME_pol_upper_silesia_mines_mod: "Upper Silesian Mines"
 STATIC_MODIFIER_DESC_pol_upper_silesia_mines_mod: "Upper Silesia's silver, zinc, and lead mines are in full operation."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "Pomeranian Coast"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "The Pomeranian coast centered on Stettin has been developed as the base of the Polish fleet."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "University of Prague Flourishes"
