 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Warsaw has been developed, improving administrative propagation from the capital and expanding population capacity. As the center of Mazovian integration, Warsaw becomes the kingdom's administrative hub."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Kraków Flourishes"
