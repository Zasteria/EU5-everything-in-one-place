l_russian:
 pol_jagiellonian_dynasty_mission_pack: "Слава Ягеллонов"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION: "В 1337 году Польским королевством правит Казимир III Великий. Его наследником станет Людовик I Венгерский из Анжуйской династии, а дочь Людовика Ядвига выйдет замуж за великого князя литовского Ягайло, и так родится польско-литовская личная уния. Борьба с тевтонскими рыцарями на севере, уния с Венгрией на юге, движение на восток через Литву и притязания на Богемию — исполните всё это и постройте величайшую шляхетскую республику Центрально-Восточной Европы."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION: "Расширяйте Польшу во всех направлениях — внутри страны, на восток, север, юг и запад — и воплотите польский золотой век."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP: "Выполняйте задания, чтобы воплотить польский золотой век."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS: "От Казимира Великого до золотого века Ягеллонов — постройте шляхетскую республику!"
 pol_kingdom_of_poland: "Королевство Польское"
 pol_kingdom_of_poland_desc: "Казимир III, прозванный Великим, взошёл на престол в 1333 году и собрал раздробленную Польшу. «Принял Польшу деревянной, а оставил каменной», — говорили потомки. Он проводил правовые реформы, строил города, защищал евреев, и его правление считают вершиной процветания средневековой Польши. Поднимите легитимность и стабильность и укрепите основы королевства."
 pol_kingdom_of_poland_tooltip: "Легитимность не ниже 50, стабильность не ниже 20"
 pol_integrate_mazovia: "Присоединить Мазовию"
 pol_integrate_mazovia_desc: "Мазовецким княжеством правит младшая ветвь Пястов, оно лежит в плодородной низменности в самом сердце Польши. Заняв Варшаву и Люблин и полностью присоединив эту богатую равнину к Польскому королевству, вы создадите политическое средоточие центральной Польши. Возьмите заранее то, что история отдаст лишь в 1526 году."
 pol_integrate_mazovia_tooltip: "Варшава и Люблин принадлежат нам или подданному"
 pol_great_sejm: "Великий сейм"
 pol_great_sejm_desc: "Польский сейм, то есть парламент, складывается с XIII века. В XV–XVI веках это сословное собрание магнатов, шляхты и духовенства утвердило понятие «Золотой вольности», и Польша постепенно превратилась в шляхетскую республику. Укрепите сейм и уравновесьте власть короля правами шляхты."
 pol_great_sejm_tooltip: "Легитимность не ниже 70, довольство аристократов не ниже 0.65"
 pol_krakow_renaissance: "Краковское Возрождение"
 pol_krakow_renaissance_desc: "Краков — столица Польского королевства, а Ягеллонский университет, альма-матер Коперника, — лучшая академия Центрально-Восточной Европы. Итальянское Возрождение приходит в Краков, и Вавельский замок перестраивают в новом стиле. Развивайте университет и растите Краков как умственное средоточие Центрально-Восточной Европы."
 pol_krakow_renaissance_tooltip: "В Кракове построен университет, престиж в месяц не ниже 0.20"
 pol_jagiellonian_university: "Расцвет Ягеллонского университета"
 pol_jagiellonian_university_desc: "Ягеллонский университет, основанный Казимиром III в 1364 году и возрождённый королевой Ядвигой в 1400-м, вырастил Николая Коперника (1473–1543) и многих других великих умов. Открывая университеты по всей Польше, вы разнесёте свет знания по всему королевству."
 pol_jagiellonian_university_tooltip: "Не меньше 5 университетов, престиж в месяц не ниже 0.30"
 pol_polish_golden_age: "Польский золотой век"
 pol_polish_golden_age_desc: "При Ягеллонах, в XV–XVI веках, Польша пережила «золотой век». Гелиоцентризм Коперника, стихи Кохановского, искусство Кракова — Польша была не только великой державой, но и передовым краем культуры. Докажите этот золотой век обширными землями, богатым доходом и высоким престижем."
 pol_polish_golden_age_tooltip: "Не меньше 300 районов, доход в месяц не ниже 200, престиж не ниже 60"
 pol_jadwiga_union: "Брак Ядвиги и Ягайло"
 pol_jadwiga_union_desc: "Кревская уния 1385 года устроила брак польской королевы Ядвиги с великим князем литовским Ягайло (Владиславом II Ягелло). Ягайло крестился и получил титул короля Польши, обязавшись обратить Литву в католичество. С этого брака началось польско-литовское союзное государство — и заря династии Ягеллонов, правившей больше двух веков."
 pol_jadwiga_union_tooltip: "В личной унии с Литвой (c:LIT) или она наш подданный"
 pol_develop_ruthenia: "Развить Русь"
 pol_develop_ruthenia_desc: "Червонная Русь — богатый хлебом край на западе Украины. Львов (Лемберг), средоточие Галицко-Волынского княжества, Польша взяла в 1349 году. Брест-Литовский — ключевая застава на границе с Литвой. Развив этот край, вы прочно утвердите господство Польши на востоке."
 pol_develop_ruthenia_tooltip: "Львов и Брест-Литовский принадлежат нам или подданному"
 pol_control_kyiv: "Власть над Киевом"
 pol_control_kyiv_desc: "Киев был столицей Киевской Руси, колыбели восточнославянского мира. После монгольского разорения 1240 года город отошёл под власть Литвы. Взяв Киев, вы подчините себе весь бассейн Днепра и откроете дорогу к Чёрному морю."
 pol_control_kyiv_tooltip: "Киев принадлежит нам или подданному"
 pol_push_east: "Натиск на восток"
 pol_push_east_desc: "Минск — сердце Литвы, Смоленск — важнейший узел восточнославянского мира. Пока поднимается Великое княжество Московское, эти города сделают польско-литовский союз первой силой восточных славян. Историческая борьба за Смоленск, которую вёл Иван III, на этот раз обернётся в пользу Польши."
 pol_push_east_tooltip: "Минск и Смоленск принадлежат нам или подданному"
 pol_eastern_empire: "Восточная империя"
 pol_eastern_empire_desc: "В пору расцвета (около 1618 года) Речь Посполитая была крупнейшим государством Европы. От Балтики до Причерноморской степи весь восточнославянский мир объединился под польским знаменем. Постройте великую восточную империю, которой одинаково страшатся Россия, Османы и Габсбурги."
 pol_eastern_empire_tooltip: "Не меньше 500 районов, из них не меньше 150 в регионе Восточная Европа"
 pol_prussian_confederation: "Прусский союз и тевтонские рыцари"
 pol_prussian_confederation_desc: "Тевтонский орден, в XIII веке покоривший балтийских язычников, стал наследственным врагом Польши. В 1410 году при Грюнвальде польско-литовское войско разгромило его наголову. Опираясь на Прусский союз — прусских горожан, искавших защиты у Польши, — разбейте Тевтонский орден и откройте Польше выход к Балтийскому морю."
 pol_prussian_confederation_tooltip: "Торунь принадлежит нам или подданному; война с Тевтонским орденом (c:TUE), либо ордена нет, либо он наш подданный"
 pol_gdansk_port: "Гданьский порт"
 pol_gdansk_port_desc: "Гданьск (Данциг) зовут «воротами Польши» — это важнейший порт Балтики. Город в устье Вислы был первым узлом Ганзы и ключом к польскому вывозу зерна. Закреплённый за Польшей Торуньским миром 1466 года, Гданьск два века оставался сердцем польского хозяйства."
 pol_gdansk_port_tooltip: "Гданьск принадлежит нам или подданному и имеет ранг не ниже города"
 pol_baltic_dominance: "Господство на Балтике"
 pol_baltic_dominance_desc: "«Кто держит Гданьск, тот держит балтийскую торговлю зерном». В XVI веке польское зерно, шедшее через Балтику в Амстердам, кормило всю Европу. Полностью возьмите этот торговый путь и сделайте Польшу «житницей Европы»."
 pol_baltic_dominance_tooltip: "Флот не меньше 20, доход в месяц не ниже 100"
 pol_livonian_expansion: "Движение в Ливонию"
 pol_livonian_expansion_desc: "Ливония (нынешние Латвия и Эстония), некогда владение Ливонского ордена, в XVI веке стала полем борьбы России, Швеции, Дании и Польши. Взяв Ригу и Таллин (Ревель), вы отдадите всю Балтику под власть Польши."
 pol_livonian_expansion_tooltip: "Рига и Таллин принадлежат нам или подданному"
 pol_master_of_the_north: "Властелин Севера"
 pol_master_of_the_north_desc: "Над Кёнигсбергом (ныне Калининград), бывшей твердыней Тевтонского ордена, теперь реет польское знамя. Могучий флот держит всю Балтику, и Польша держит в кулаке Скандинавию, Ганзу и голландцев — она полновластный хозяин Севера."
 pol_master_of_the_north_tooltip: "Кёнигсберг принадлежит нам или подданному, флот не меньше 40, доход в месяц не ниже 200"
 pol_hungarian_union: "Личная уния с Венгрией"
 pol_hungarian_union_desc: "Когда в 1370 году Казимир III умер без наследников, польский трон унаследовал его племянник Людовик I Венгерский из Анжуйской династии. Так началась польско-венгерская личная уния. Два великих королевства под одним королём — расклад сил в Центрально-Восточной Европе меняется в корне."
 pol_hungarian_union_tooltip: "В личной унии с Венгрией (c:HUN) или она наш подданный"
 pol_moldavia_vassal: "Подчинить Молдавию"
 pol_moldavia_vassal_desc: "Молдавское княжество — буфер, за который спорят Польша, Венгрия и Османы. Стефан Великий (правил в 1457–1504 годах) признавал польское верховенство на словах, а на деле сохранял независимость. Прочно возьмите это важное княжество под покровительство Польши и займите ворота к Чёрному морю."
 pol_moldavia_vassal_tooltip: "В личной унии с Молдавией (c:MOL) или она наш подданный, либо Киев наш"
 pol_wallachia_control: "Власть над Валахией"
 pol_wallachia_control_desc: "Валахия, княжество к северу от Дуная, — передний край борьбы с Османской империей. Влад II, отец Влада Цепеша, служил Венгрии как рыцарь ордена Дракона. Взяв Валахию под покровительство польско-венгерской унии, вы получите влияние на Балканском полуострове."
 pol_wallachia_control_tooltip: "Валахия (c:WAL) — наш подданный, либо Бухарест принадлежит нам или подданному"
 pol_battle_of_grunwald: "Дух Грюнвальда"
 pol_battle_of_grunwald_desc: "15 июля 1410 года на полях Грюнвальда польско-литовское войско наголову разбило Тевтонский орден. Великий магистр Ульрих фон Юнгинген пал в бою, и за Польшей закрепилась слава «стража христианства». Докажите этот дух вновь — в войне против сил ислама."
 pol_battle_of_grunwald_tooltip: "Война с мусульманской страной (religion_group:muslim), армия не меньше 30"
 pol_shield_of_christendom: "Щит христианства"
 pol_shield_of_christendom_desc: "Со времён крещения Литвы при Ядвиге Польша стоит на переднем крае восточноевропейского католичества. Османская империя наконец изгнана, и папа, Венеция и Габсбурги признают, что именно Польша — истинный Antemurale Christianitatis, оплот христианства."
 pol_shield_of_christendom_tooltip: "Мнение папы не ниже 150 и союз с ним, либо Киев наш; Османской империи нет"
 pol_silesia_integration: "Присоединение Силезии"
 pol_silesia_integration_desc: "Силезия — родина Пястов, но в XIV веке она ушла под власть Богемии, а затем Габсбургов. Вернуть этот богатый ремёслами и торговлей край с Вроцлавом (Бреслау) — одна из важнейших народных и хозяйственных задач Польши."
 pol_silesia_integration_tooltip: "Вроцлав принадлежит нам или подданному, не меньше 8 районов в области Силезия"
 pol_bohemian_claim: "Богемская корона"
 pol_bohemian_claim_desc: "У Ягеллонов есть права на богемский и венгерский престолы. Владислав II Ягеллон стал королём Богемии в 1471 году, а в 1490-м — ещё и королём Венгрии. Завладев богемской короной в Праге, вы создадите тройную польско-богемско-венгерскую монархию."
 pol_bohemian_claim_tooltip: "В личной унии с Богемией (c:BOH) или она наш подданный"
 pol_hre_influence: "Влияние в Священной Римской империи"
 pol_hre_influence_desc: "Король Польши, носящий и богемскую корону, может стать курфюрстом Священной Римской империи. Уравновешивая отношения с Габсбургами и расширяя влияние на германских князей, Польша становится политическим средоточием Центральной Европы."
 pol_hre_influence_tooltip: "Дипломатическая репутация не ниже 5; союз с Габсбургами (c:HAB) или их мнение не ниже 150, либо проекция силы не ниже 20"
 pol_central_european_power: "Держава Центральной Европы"
 pol_central_european_power_desc: "Огромное государство из Польши, Литвы, Богемии и Венгрии с богатым доходом — Польша стала величайшей державой Центрально-Восточной Европы. В окружении трёх великих сил — Священной Римской империи, Османской империи и Великого княжества Московского — Польша сияет своим особым блеском."
 pol_central_european_power_tooltip: "Не меньше 400 районов, ранг не ниже королевства, доход в месяц не ниже 300"
 pol_grand_commonwealth: "Великая Речь Посполитая"
 pol_grand_commonwealth_desc: "Речь Посполитая, соединившая Польшу, Литву, Богемию и Венгрию, — государство с особым строем, где шляхетская вольность уживается с королевской властью, — в XVI–XVII веках звалась «республикой многих народов». Этот удивительный опыт, вобравший разные народы, веры и языки, достиг своей вершины."
 pol_grand_commonwealth_tooltip: "Не меньше 800 районов, престиж не ниже 80, доход в месяц не ниже 600"
 pol_republic_of_nobles: "Шляхетская республика"
 pol_republic_of_nobles_desc: "Небольшое Польское королевство, которым в 1337 году правил Казимир Великий, стало Речью Посполитой — «республикой многих народов», крупнейшим и самым необычно устроенным государством в истории Европы. От Балтики до Чёрного моря, от украинских степей до лесов Богемии — всё объединено под польским знаменем. Эта великая держава, гордая шляхетской вольностью, веротерпимостью и многообразием культур, навеки вписывает имя Польши в историю."
 pol_republic_of_nobles_tooltip: "Не меньше 1 200 районов, престиж не ниже 80, доход в месяц не ниже 1 000"
 pol_events.10.t: "Брак Ядвиги и Ягайло"
 pol_events.10.d: "Кревская уния принесла плоды: польская королева Ядвига и великий князь литовский Ягайло обвенчались. Ягайло принял крещение и стал королём Польши под именем Владислава II. Литва вступает в личную унию с Польшей, и началось величайшее политическое объединение Восточной Европы. Этот брак — больше чем политический расчёт: это исторический миг, когда два народа, две культуры, два языка соединяются под одной династией. «Польша и Литва едины навеки», — провозгласила Кревская уния."
 pol_events.10.a: "Да здравствует новая династия Ягеллонов!"
 pol_events.20.t: "Польско-венгерская личная уния"
 pol_events.20.d: "Польша и Венгрия заключили личную унию. Два великих королевства под одним королём — дипломатический триумф Анжуйской династии и событие, меняющее историю Центрально-Восточной Европы. Польские и венгерские рыцари теперь стоят плечом к плечу. От Балтийского моря на севере до Адриатики на юге складывается огромное государство под одной династией. Для Османской империи этот союз — величайшая угроза."
 pol_events.20.a: "Польша и Венгрия едины!"
 pol_events.99.t: "Шляхетская республика — золотой век Польши"
 pol_events.99.d: "Как Казимир Великий оставил Польшу каменной, так нынешний польский король построил государство, которому нет равных в мире. От Балтики до Понта (Чёрного моря) вся земля, где Коперник доказал, что «Земля вращается вокруг Солнца», объединена под польским флагом. «Шляхетская республика» (Речь Посполитая), где король и шляхта равны перед законом, — самый самобытный политический опыт в истории европейской цивилизации. «Ещё Польша не погибла» — нынешняя Польша воплощает смысл этих слов."
 pol_events.99.a: "Шляхта и король идут вместе — да здравствует Польша!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "Наследие Пястов"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "Тысячелетнее наследие Пястов, первого королевского дома Польши, служит опорой законности польской короны."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Присоединение Мазовии"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Мазовия с Варшавой полностью присоединена к Польше. Эта плодородная низменность стала сердцем королевства."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "Великий сейм учреждён"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "Польский сейм утвердился как учреждение Золотой вольности. Складывается особый строй, где самоуправление шляхты уживается с властью короля."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Культурный расцвет Кракова"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Краков вокруг Вавельского замка залит светом Возрождения. В величайший учёный город Центрально-Восточной Европы съезжаются учёные и художники со всей Европы."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "Расцвет Ягеллонского университета"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "Ягеллонский университет, альма-матер Коперника, процветает как лучшая академия Центрально-Восточной Европы. Знание и искусство расходятся по всей Польше."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "Польский золотой век"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "Гелиоцентризм Коперника, стихи Кохановского, зодчество Кракова — во всём Польша переживает золотой век."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Узы союза Ядвиги и Ягайло"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "Польско-литовская личная уния заключена. Складывается огромное государство от Балтики до Чёрного моря."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "Сила польско-венгерского союза"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Войска Польши и Венгрии соединились. Союз двух великих держав севера и юга усиливает давление на Османов."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Развитие Руси"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Пашни Червонной Руси полностью освоены. Черноморский торговый путь через Львов ожил."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "Киевские ворота"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Киев, колыбель восточнославянского мира, перешёл под власть Польши. Влияние на весь бассейн Днепра утверждено."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Натиск на восток"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "С Минском и Смоленском весь восточнославянский мир входит в сферу влияния Польши."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "Восточная империя"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "Польская империя от Балтики до Чёрного моря построена и вписана в историю как величайшее государство Восточной Европы."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Победа над Тевтонским орденом"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "Дух Грюнвальда вдохновляет польское войско. Память о победе над рыцарями-крестоносцами стала гордостью армии."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Торговый Гданьск"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Гданьск вырос в крупнейший зерновой порт Балтики. Польское зерно, идущее по Висле, кормит всю Европу."
 STATIC_MODIFIER_NAME_pol_baltic_trade_mod: "Господство в балтийской торговле"
 STATIC_MODIFIER_DESC_pol_baltic_trade_mod: "Польша господствует в балтийской торговле зерном. Вывоз зерна в Амстердам приносит огромные богатства."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Власть над Ливонией"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "С Ригой и Таллином вся Балтика оказалась под властью польского флота."
 STATIC_MODIFIER_NAME_pol_north_master_mod: "Властелин Севера"
 STATIC_MODIFIER_DESC_pol_north_master_mod: "От Балтики до Скандинавии польский флот правит северными морями."
 STATIC_MODIFIER_NAME_pol_moldavia_buffer_mod: "Молдавский буфер"
 STATIC_MODIFIER_DESC_pol_moldavia_buffer_mod: "Молдавия вошла в сферу влияния Польши, и на северном берегу Чёрного моря создан плацдарм."
 STATIC_MODIFIER_NAME_pol_wallachian_buffer_mod: "Валашский буфер"
 STATIC_MODIFIER_DESC_pol_wallachian_buffer_mod: "Валахия перешла под покровительство польско-венгерской унии, и влияние на Балканах выросло."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "Слава Грюнвальда"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "Дух Грюнвальда вдохновляет польское войско. В битвах с неверными Польша стяжает всё большую славу."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Щит христианства"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Польша вписана в историю как Antemurale Christianitatis — оплот христианства."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Присоединение Силезии"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "Силезия, родина Пястов, вернулась к Польше. Её богатые рудники и ремёсла укрепляют польское хозяйство."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "Богемская корона"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "Ягеллоны завладели богемской короной. Пражский двор становится сценой польской дипломатии."
 STATIC_MODIFIER_NAME_pol_hre_influence_mod: "Влияние в Империи"
 STATIC_MODIFIER_DESC_pol_hre_influence_mod: "Польша утвердила влияние на германских князей. Сан курфюрста определяет дипломатию Центральной Европы."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Держава Центральной Европы"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Польша стала величайшей державой Центрально-Восточной Европы. Даже среди трёх великих сил она сияет своим блеском."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "Великая Речь Посполитая"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "Речь Посполитая построена — величайший политический опыт Европы, вобравший разные народы, веры и языки."
 STATIC_MODIFIER_NAME_pol_republic_of_nobles_final_mod: "Слава шляхетской республики"
 STATIC_MODIFIER_DESC_pol_republic_of_nobles_final_mod: "Великая Речь Посполитая от Балтики до Чёрного моря построена. Золотой век Польши навеки вписан в историю."
 pol_krakow_capital: "Развитие королевского Кракова"
 pol_krakow_capital_desc: "Краков веками служит столицей Польского королевства. Вокруг Вавельского замка на холме сходятся все торговые, политические и церковные дела королевства. Поднимите Краков до ранга города или выше, чтобы заложить основу процветания всей Польши."
 pol_krakow_capital_tooltip: "Краков имеет ранг не ниже города, доход в месяц не ниже 20"
 pol_support_prussian_cities: "Поддержка Прусского союза городов"
 pol_support_prussian_cities_desc: "Прусские города, страдающие от тяжёлых налогов и произвола Тевтонского ордена, просят защиты у короля Польши. Прусский союз 1454 года — 19 городов, среди них Гданьск, Торунь и Эльблонг, и 30 дворянских родов — предложил подчиниться Польше в обмен на избавление от ордена. Не упустите случай."
 pol_support_prussian_cities_tooltip: "Торунь и Гнезно принадлежат нам или подданному"
 pol_tend_to_lithuania: "Литовская дипломатия"
 pol_tend_to_lithuania_desc: "Ещё до Кревской унии 1385 года у Польши и Литвы были общие дипломатические интересы. Перед лицом общего врага, Тевтонского ордена, сотрудничество двух держав было неизбежно. Поддерживайте добрые отношения с Литвой и готовьте почву для будущей личной унии."
 pol_tend_to_lithuania_tooltip: "Мнение Литвы (c:LIT) не ниже 150 или уния с ней; дипломатическая репутация не ниже 3"
 pol_varna_aftermath: "После Варны"
 pol_varna_aftermath_desc: "В битве при Варне в 1444 году польско-венгерское войско крестоносцев было разбито Османами, и король Польши Владислав III пал в бою. Поражение потрясло христианский мир, но стало и поводом скрепить узы с Венгрией. Восстановите отношения с Венгрией и готовьтесь к следующему крестовому походу."
 pol_varna_aftermath_tooltip: "Мнение Венгрии (c:HUN) не ниже 150, или уния с ней, или она наш подданный; не меньше 3 союзников"
 pol_piast_revival: "Наследие Пястов"
 pol_piast_revival_desc: "Познань и Гнезно — древнейшие города Польши, колыбель королевства Пястов. В Гнезненском соборе покоятся мощи святого Адальберта (Войцеха), и он служит сердцем польского католичества. Займите эти святыни и примите наследие Пястов."
 pol_piast_revival_tooltip: "Познань и Гнезно принадлежат нам или подданному"
 pol_support_merchants: "Поддержка купечества"
 pol_support_merchants_desc: "Городские мещане Польши — важная опора королевской казны. Поддержав торговую сеть вокруг краковских Суконных рядов, вы поднимете и верность мещан, и доходы казны. Удовлетворите купечество и заложите основу торговой Польши."
 pol_support_merchants_tooltip: "Доход в месяц не ниже 30, довольство мещан не ниже 0.60"
 pol_black_sea_access: "Выход к Чёрному морю"
 pol_black_sea_access_desc: "Спустившись по Днепру, Польша может выйти к Чёрному морю. Власть над Крымом и северным берегом Понта Эвксинского (Чёрного моря) даёт торговый путь на Восток в обход Константинополя, который держат Османы. Постройте черноморский флот и раздвиньте морское владычество."
 pol_black_sea_access_tooltip: "Флот не меньше 10, не меньше 3 районов в области Крым"
 pol_conquer_serbia: "Завоевать Сербию"
 pol_conquer_serbia_desc: "После битвы на Косовом поле (1389) Сербское королевство фактически подчинилось Османам. Взяв Белград (Смедеревскую крепость), вы закрепитесь к югу от Дуная для защиты христианского мира. Пусть соединённые силы Польши и Венгрии освободят Балканы."
 pol_conquer_serbia_tooltip: "Белград принадлежит нам или подданному; Сербия (c:SER) — наш подданный или её больше нет"
 pol_east_prussia_settled: "Умиротворение Восточной Пруссии"
 pol_east_prussia_settled_desc: "После победы при Грюнвальде города Восточной Пруссии начали признавать польское верховенство. Держа сразу Кёнигсберг и Гданьск, Польша забирает всё южное побережье Балтики — так здесь сбывается историческое устремление, воплощённое Торуньским миром 1466 года."
 pol_east_prussia_settled_tooltip: "После «Духа Грюнвальда» (pol_battle_of_grunwald) Кёнигсберг и Гданьск принадлежат нам или подданному"
 pol_greater_poland: "Великая Польша"
 pol_greater_poland_desc: "Силезия присоединена, богемская корона в руках — строительство Великой Польши становится явью. Вся Великопольша с Познанью полностью перешла под власть Польши, и заложена основа для движения на запад."
 pol_greater_poland_tooltip: "Не меньше 8 районов в области Великая Польша (greater_poland_area), Познань принадлежит нам или подданному, Богемия присоединена"
 pol_krakow_cloth_hall: "Краковские Суконные ряды"
 pol_krakow_cloth_hall_desc: "Краковские Суконные ряды (Сукеннице) — готические торговые ряды XIV века, одно из крупнейших торговых зданий Центрально-Восточной Европы. Здесь торговали польским льном, шерстью, янтарём и металлами, сюда съезжались купцы из Венеции, Фландрии и Персии. Оживите это торговое средоточие."
 pol_krakow_cloth_hall_tooltip: "Выполнены «Поддержка купечества» и «Краковское Возрождение», в Кракове не меньше 5 работников добычи ресурсов, доход в месяц не ниже 50"
 pol_baltic_grain_trade: "Балтийская торговля зерном"
 pol_baltic_grain_trade_desc: "В XV–XVII веках вывоз польского зерна через Гданьск рос взрывными темпами. Зерно сплавляли по Висле, в Гданьске перегружали и везли в Амстердам — этот путь сделал Польшу «житницей Европы». Наладьте торговые пути."
 pol_baltic_grain_trade_tooltip: "Доход в месяц не ниже 80, не меньше 3 рынков"
 pol_breadbasket_of_europe: "Житница Европы"
 pol_breadbasket_of_europe_desc: "К концу XVI века Польша давала большую часть зерна, которое ела Европа. Купцы Амстердама, Лиссабона и Севильи не могли торговать без польской пшеницы и ржи. Польша вошла в историю как «житница Европы»."
 pol_breadbasket_of_europe_tooltip: "Доход в месяц не ниже 150, производство зерна в стране не меньше 20"
 pol_konigsberg_secured: "Кёнигсберг в наших руках"
 pol_konigsberg_secured_desc: "Кёнигсберг (Крулевец), бывшая твердыня Тевтонского ордена, теперь под властью Польши. Укрепите этот грозный город-крепость и сделайте его опорой обороны всего восточного побережья Балтики. Закрепите навсегда то, что позже стало бы столицей Пруссии."
 pol_konigsberg_secured_tooltip: "После умиротворения Восточной Пруссии Кёнигсберг принадлежит нам или подданному, не меньше 3 бастионов"
 pol_pontic_steppe: "Причерноморская степь"
 pol_pontic_steppe_desc: "Степь к северу от Понта Эвксинского (Чёрного моря) звалась «Диким полем» и не знала покоя от татарских набегов. Завладев ею, вы получите полный выход к Чёрному морю и стратегический перевес над Османской империей."
 pol_pontic_steppe_tooltip: "После выхода к Чёрному морю — не меньше 80 районов в регионе Восточная Европа"
 pol_smolensk_campaign: "Смоленский поход"
 pol_smolensk_campaign_desc: "Смоленск — стратегический ключ к верхнему Днепру, за который Польша с Литвой не раз спорили с Великим княжеством Московским. В битве под Оршей (1514) литовское войско разгромило московскую рать. На этом историческом поле Польша утверждает своё влияние на востоке."
 pol_smolensk_campaign_tooltip: "Смоленск принадлежит нам или подданному, идёт война"
 pol_contain_muscovy: "Сдержать Московию"
 pol_contain_muscovy_desc: "Со времён Ивана III Великое княжество Московское стремительно растёт и грозит восточным землям Польши и Литвы. Цепь крепостей с опорой на Минск и Смоленск последовательно преградит Москве путь на запад. Сдержите восточного великана, пока он не стал великой империей."
 pol_contain_muscovy_tooltip: "После Смоленского похода Минск принадлежит нам или подданному, не меньше 5 бастионов"
 pol_balkan_advance: "Наступление на Балканы"
 pol_balkan_advance_desc: "Сербия и Валахия в руках, и соединённые силы Польши и Венгрии перешли Дунай и углубились в Балканы. Пора сделать Белград передовой базой и начать большую войну с Османской империей. Разбейте силы ислама с духом Грюнвальда."
 pol_balkan_advance_tooltip: "После завоевания Сербии Белград принадлежит нам или подданному, идёт война с любой мусульманской страной"
 pol_papal_alliance: "Союз с папством"
 pol_papal_alliance_desc: "Со времён крещения Мешко I (966) у Польши особые отношения со Святым престолом. Заключив союз с папой и утвердив Польшу как истинное государство крестоносцев, вы добьётесь того, что Польшу официально признают «щитом» христианского мира."
 pol_papal_alliance_tooltip: "Мнение папы (c:PAP) не ниже 150 и союз с ним"
 pol_crusade_against_turks: "Крестовый поход против турок"
 pol_crusade_against_turks_desc: "Благословлённый папой крестовый поход выступает против Османской империи. Польские рыцари и венгерское Чёрное войско соединяются — величайшая армия Центрально-Восточной Европы бросает вызов туркам. Настал час отомстить за Варну."
 pol_crusade_against_turks_tooltip: "После союза с папством армия не меньше 40, идёт война с мусульманской страной"
 pol_hre_elector: "Влияние в Империи"
 pol_hre_elector_desc: "Король Польши, носящий и богемскую корону, — курфюрст Священной Римской империи. Усиливая дипломатическое давление на Габсбургов и добившись голоса в имперских делах, Польша становится признанной великой державой, определяющей политику Центральной Европы."
 pol_hre_elector_tooltip: "После «Богемской короны» дипломатическая репутация не ниже 5; союз с Габсбургами или их мнение не ниже 150"
 pol_emperor_of_hre: "Император Священной Римской империи"
 pol_emperor_of_hre_desc: "Опираясь на мощь тройной польско-богемско-венгерской монархии, король Польши метит на трон императора Священной Римской империи. С 500 районами и рангом империи Польше больше не нужны Габсбурги. Императорский престол принадлежит Польше."
 pol_emperor_of_hre_tooltip: "После влияния в Империи — не меньше 500 районов и ранг империи, доход в месяц не ниже 400"
 pol_habsburg_rivalry: "Вызов Габсбургам"
 pol_habsburg_rivalry_desc: "Взяв Вену, Польша перехватит господство на Дунае. Долгое дипломатическое соперничество с Габсбургами приходит к военной развязке. Против державы Габсбургов, раскинувшейся по Германии, Италии и Испании, Польша наступает с востока."
 pol_habsburg_rivalry_tooltip: "После «Богемской короны» Вена принадлежит нам или подданному"
 pol_central_european_hegemon: "Гегемон Центральной Европы"
 pol_central_european_hegemon_desc: "С падением Вены Польша становится бесспорным гегемоном Центрально-Восточной Европы. Больше 400 районов, богатый доход, высокий престиж — всё готово, и пора по-настоящему подчинить Священную Римскую империю."
 pol_central_european_hegemon_tooltip: "После вызова Габсбургам — не меньше 400 районов, доход в месяц не ниже 300, престиж не ниже 60"
 pol_copernicus: "Коперниканский переворот"
 pol_copernicus_desc: "Николай Коперник (1473–1543), уроженец Торуни, — польский астроном. Его труд 1543 года «О вращении небесных сфер» предложил гелиоцентрическую систему и открыл научную революцию. Благодаря Копернику, выученику Ягеллонского университета, мир узнаёт Польшу как «страну астрономии»."
 pol_copernicus_tooltip: "После расцвета Ягеллонского университета — после 1510 года или не меньше 10 университетов"
 pol_magnate_economy: "Магнатское хозяйство"
 pol_magnate_economy_desc: "Великие магнатские роды Польши владеют огромными имениями и построили сельское хозяйство на крепостном труде. Эта «фольварочная система» давала горы зерна для балтийской торговли и огромные доходы. Сделайте магнатов хозяйственными союзниками."
 pol_magnate_economy_tooltip: "После расцвета Ягеллонского университета доход в месяц не ниже 100, не меньше 5 рынков"
 pol_folwark_system: "Фольварочная система"
 pol_folwark_system_desc: "Фольварк — шляхетское хозяйство, где крепостные выращивают зерно в огромных количествах, — построен. При всей тёмной стороне (страшной доле крепостных) эта система сделала Польшу крупнейшим вывозчиком зерна в Европе. Вся Европа нуждается в польском зерне, идущем через Балтику."
 pol_folwark_system_tooltip: "После «Магнатского хозяйства» доход в месяц не ниже 200, производство зерна не меньше 15"
 pol_rzeczpospolita: "Речь Посполитая"
 pol_rzeczpospolita_desc: "Речь Посполитая — польско-литовское государство, чьё имя восходит к латинскому «res publica», «общее дело». Официально учреждённая Люблинской унией 1569 года, она провозгласила шляхетскую вольность (Золотую вольность), веротерпимость и мирное сожительство многих народов. Докажите эти идеалы процветанием и хозяйственной мощью золотого века."
 pol_rzeczpospolita_tooltip: "После «Польского золотого века» и «Фольварочной системы» — не меньше 350 районов, доход в месяц не ниже 300"
 STATIC_MODIFIER_NAME_pol_krakow_capital_mod: "Королевский Краков"
 STATIC_MODIFIER_DESC_pol_krakow_capital_mod: "Краков, увенчанный Вавельским замком, отстроен как величайшая королевская столица Центрально-Восточной Европы. Торговля и культура цветут, процветание ускоряется."
 STATIC_MODIFIER_NAME_pol_nobles_levy_mod: "Шляхетское ополчение"
 STATIC_MODIFIER_DESC_pol_nobles_levy_mod: "Шляхетская конница собрана. Мощная конница, напоминающая о славе Грюнвальда 1410 года, становится символом польской силы."
 STATIC_MODIFIER_NAME_pol_grunwald_glory_mod: "Слава Грюнвальда"
 STATIC_MODIFIER_DESC_pol_grunwald_glory_mod: "Память о 15 июля 1410 года, величайшей военной победе Польши, становится вечной гордостью войска. Дух дня, сломившего Тевтонский орден, живёт вечно."
 STATIC_MODIFIER_NAME_pol_lithuanian_diplomacy_mod: "Литовская дипломатия"
 STATIC_MODIFIER_DESC_pol_lithuanian_diplomacy_mod: "Польско-литовские отношения окрепли. Почва для брака Ядвиги и Ягайло готова."
 STATIC_MODIFIER_NAME_pol_varna_recovery_mod: "Оправившись после Варны"
 STATIC_MODIFIER_DESC_pol_varna_recovery_mod: "Беда 1444 года обращена в опыт. Подготовка к более осторожному и более мощному крестовому походу завершена. Следующая битва принесёт победу."
 STATIC_MODIFIER_NAME_pol_piast_revival_mod: "Наследие Пястов принято"
 STATIC_MODIFIER_DESC_pol_piast_revival_mod: "С Познанью и Гнезно древнейшие земли Польши вернулись к короне. Тысячелетнее наследие Пястов переходит к Ягеллонам."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Поддержка купечества"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Поддержка краковских купеческих гильдий оживила городское хозяйство. Участие в балтийской торговле стало явью."
 STATIC_MODIFIER_NAME_pol_prussia_settled_mod: "Восточная Пруссия умиротворена"
 STATIC_MODIFIER_DESC_pol_prussia_settled_mod: "После Грюнвальда Восточная Пруссия полностью под властью Польши. Господство над южным побережьем Балтики утверждено."
 STATIC_MODIFIER_NAME_pol_greater_poland_mod: "Великая Польша построена"
 STATIC_MODIFIER_DESC_pol_greater_poland_mod: "С Силезией и Богемией Великопольша, колыбель Пястов, полностью вошла в Польское королевство."
 STATIC_MODIFIER_NAME_pol_sukiennice_mod: "Торговля в Суконных рядах"
 STATIC_MODIFIER_DESC_pol_sukiennice_mod: "Краковские Суконные ряды работают в полную силу как крупнейшее торговое здание Центрально-Восточной Европы. Купцы едут сюда и из Венеции, и из Персии."
 STATIC_MODIFIER_NAME_pol_konigsberg_mod: "Крепость Кёнигсберг"
 STATIC_MODIFIER_DESC_pol_konigsberg_mod: "Бывшая тевтонская твердыня Кёнигсберг отстроена как передовая крепость Польши. Оборонительный рубеж на востоке Балтики создан."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Черноморский торговый путь"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Выход к Чёрному морю по Днепру открыт. Восточный торговый путь в обход Османов умножает богатство Польши."
 STATIC_MODIFIER_NAME_pol_steppe_frontier_mod: "Степной рубеж"
 STATIC_MODIFIER_DESC_pol_steppe_frontier_mod: "Причерноморская степь в руках, и всё северное побережье Чёрного моря в сфере влияния Польши. Татарские набеги ушли в прошлое."
 STATIC_MODIFIER_NAME_pol_smolensk_victory_mod: "Победа под Смоленском"
 STATIC_MODIFIER_DESC_pol_smolensk_victory_mod: "Польша взяла Смоленск и преградила Великому княжеству Московскому путь на запад. Славная победа, подобная Орше 1514 года, вписана в историю вновь."
 STATIC_MODIFIER_NAME_pol_muscovy_barrier_mod: "Московия сдержана"
 STATIC_MODIFIER_DESC_pol_muscovy_barrier_mod: "Цепь крепостей у Минска и Смоленска последовательно сдерживает рост Великого княжества Московского на запад. Восточный великан сдержан."
 STATIC_MODIFIER_NAME_pol_danube_control_mod: "Власть над Дунаем"
 STATIC_MODIFIER_DESC_pol_danube_control_mod: "Сербия завоевана, южный берег Дуная под властью Польши и Венгрии. Дорога на Балканы открыта."
 STATIC_MODIFIER_NAME_pol_breadbasket_mod: "Житница Европы"
 STATIC_MODIFIER_DESC_pol_breadbasket_mod: "Польша стала крупнейшим вывозчиком зерна в Европе. От Амстердама до Лиссабона вся Европа нуждается в польском зерне."
 STATIC_MODIFIER_NAME_pol_papal_blessing_mod: "Благословение папы"
 STATIC_MODIFIER_DESC_pol_papal_blessing_mod: "Римский папа официально признал Польшу щитом христианства. Королю Польши прислана булла о крестовом походе, и все христиане собираются под польским знаменем."
 STATIC_MODIFIER_NAME_pol_anti_ottoman_crusade_mod: "Крестовый поход против Османов"
 STATIC_MODIFIER_DESC_pol_anti_ottoman_crusade_mod: "Крестовый поход против Османов во главе с Польшей достиг высшей точки. При поддержке папы, Венгрии и Венеции Польша вписывает своё имя в историю этой священной войной."
 STATIC_MODIFIER_NAME_pol_habsburg_rival_mod: "Вызов Габсбургам"
 STATIC_MODIFIER_DESC_pol_habsburg_rival_mod: "С падением Вены власть Габсбургов рухнула. Господство над Подунавьем переходит к Польше."
 STATIC_MODIFIER_NAME_pol_hre_emperor_mod: "Император Священной Римской империи"
 STATIC_MODIFIER_DESC_pol_hre_emperor_mod: "Король Польши занял трон императора Священной Римской империи. Прага, Вена и Краков объединены под одним императором."
 STATIC_MODIFIER_NAME_pol_copernicus_mod: "Наследие Коперника"
 STATIC_MODIFIER_DESC_pol_copernicus_mod: "«Земля движется» — «О вращении небесных сфер»: революционное открытие Коперника прославило Польшу на весь мир как страну науки."
 STATIC_MODIFIER_NAME_pol_magnate_economy_mod: "Магнатское хозяйство"
 STATIC_MODIFIER_DESC_pol_magnate_economy_mod: "Сельское и торговое хозяйство во главе с великими магнатскими родами Польши сложилось. Фольварочное зерно заливает Балтику."
 STATIC_MODIFIER_NAME_pol_folwark_mod: "Фольварочная система"
 STATIC_MODIFIER_DESC_pol_folwark_mod: "Фольварочное хозяйство на крепостном труде стало хозяйственным сердцем Польши. Горы зерна плывут по Висле к Гданьску."
 STATIC_MODIFIER_NAME_pol_rzeczpospolita_mod: "Идеалы Речи Посполитой"
 STATIC_MODIFIER_DESC_pol_rzeczpospolita_mod: "Шляхетская вольность, веротерпимость, мирное сожительство многих народов — идеалы Речи Посполитой сделали Польшу величайшим государством XVII века."
 pol_nieszawa_privileges: "Нешавские статуты"
 pol_nieszawa_privileges_desc: "В 1454 году Казимиру IV Ягеллончику понадобилось шляхетское ополчение для войны с Тевтонским орденом — и он расплатился за него Нешавскими статутами, дав шляхте широкие привилегии. С тех пор король не мог без согласия шляхты ни вводить новые налоги, ни издавать новые законы. Это стало краеугольным камнем польской «Золотой вольности»."
 pol_nieszawa_privileges_tooltip: "Довольство аристократов не ниже 0.75, не меньше 1 ячейки реформ правления"
 pol_develop_krakow: "Развить Краков"
 pol_develop_krakow_desc: "Польская столица Краков выросла вокруг Вавельского замка. Полностью развив город и подняв его до ранга города, вы утвердите его как крупнейший торговый город Центрально-Восточной Европы. Поставьте местного наместника и укрепите прямое королевское управление."
 pol_develop_krakow_tooltip: "Краков имеет ранг не ниже города"
 pol_baltic_fleet: "Балтийский флот"
 pol_baltic_fleet_desc: "С Гданьском в руках Польша получила выход к Балтике. Пора строить флот и бороться за господство на море. Пока Швеция, Дания и Ливонский орден спорят за эти воды, польский флот станет новейшей — и величайшей — силой Балтики."
 pol_baltic_fleet_tooltip: "Флот не меньше 20"
 pol_sea_to_sea: "От моря до моря"
 pol_sea_to_sea_desc: "Власть над ливонскими водами, взятие Киева и Смоленска — польско-литовский союз раскинулся от Балтики до Чёрного моря. От Таллина на севере до Киева на юге сложилась величайшая сплошная держава Восточной Европы. Великий гетман Ян Замойский позже скажет: «Эту Польшу построил сам Бог»."
 pol_sea_to_sea_tooltip: "Флот не меньше 30, не меньше 100 районов в регионе Восточная Европа"
 pol_challenge_habsburg: "Вызов Габсбургам"
 pol_challenge_habsburg_desc: "К XVI веку Габсбурги держали Священную Римскую империю, Испанию, Богемию и Венгрию — величайшая династия Европы. Но король Богемии и Польши из дома Ягеллонов может оспорить это господство. Возьмите Вену или поставьте Габсбургов под польский флаг."
 pol_challenge_habsburg_tooltip: "Вена принадлежит нам или подданному, либо личная уния с Австрией (c:HAB)"
 pol_codify_law: "Свод законов"
 pol_codify_law_desc: "Вислицкий статут Казимира Великого 1346/47 года стал первым упорядоченным сводом польского права. Опираясь на счётные дома и управленческую опору, более полная кодификация польского права резко повысит действенность управления."
 pol_codify_law_tooltip: "Не меньше 4 счётных домов, легитимность не ниже 80"
 pol_develop_warsaw: "Развить Варшаву"
 pol_develop_warsaw_desc: "Варшава выросла как средоточие Мазовецкого княжества. Лежащая в центре Польши, после Люблинской унии 1569 года она станет столицей Речи Посполитой. Подняв её до ранга города и поставив местного наместника, вы заложите управленческую основу в центре королевства."
 pol_develop_warsaw_tooltip: "Варшава имеет ранг не ниже города"
 pol_amber_road: "Янтарный путь"
 pol_amber_road_desc: "Балтийский янтарь — «северное золото» — ценили с древности. Гданьск был главным портом вывоза балтийского янтаря, и торговля с Италией и Средиземноморьем приносила огромные богатства. Возродите этот древний торговый путь и поднимите хозяйственный вес Польши."
 pol_amber_road_tooltip: "Производство янтаря не меньше 5, доход в месяц не ниже 150"
 pol_poznan_commerce: "Торговля Познани"
 pol_poznan_commerce_desc: "Познань — торговый город западной Польши, узел торговли с Бранденбургом и Силезией. Город, где была первая епископская кафедра Польши, со Средних веков неизменно оставался торговым средоточием запада страны. Поднимите его до ранга города и раскройте его торговую силу."
 pol_poznan_commerce_tooltip: "Познань имеет ранг не ниже города"
 pol_vilnius_capital: "Развить Вильнюс"
 pol_vilnius_capital_desc: "В XIV веке Вильнюс быстро вырос как столица Великого княжества Литовского. В городе, построенном великим князем Гедимином, бок о бок жили многие евреи, католики и православные — позже его назовут «Северным Иерусалимом». Поднимите его до ранга города и развивайте как средоточие литовского управления."
 pol_vilnius_capital_tooltip: "Вильнюс принадлежит нам или подданному и имеет ранг не ниже города"
 pol_russia_rivalry: "Соперничество с Москвой"
 pol_russia_rivalry_desc: "Иван III Великий яростно бился с Польшей и Литвой за Смоленск. Смоленские войны Москвы с Польшей и Литвой шли весь XVI век — это была роковая борьба. Объявите Москву соперником и утвердите господство на востоке. Против притязаний Москвы на роль «хранительницы Святой Руси» Польша встаёт «хранительницей вольности»."
 pol_russia_rivalry_tooltip: "Россия (c:RUS) — наш соперник, либо Смоленск принадлежит нам или подданному"
 pol_malbork_castle: "Мальборкский замок"
 pol_malbork_castle_desc: "Мальборкский замок (Мариенбург) строился как резиденция Тевтонского ордена и стал крупнейшим средневековым замком Европы. Переданная Польше при Торуньском мире (1457), эта грозная крепость, усиленная бастионами, станет безупречной опорой обороны."
 pol_malbork_castle_tooltip: "Мальборк принадлежит нам или подданному"
 pol_gniezno_church: "Гнезненская архиепархия"
 pol_gniezno_church_desc: "Гнезно — историческая столица Польши и место её первого архиепископства. Гнезненский собор, построенный около 987 года, хранит мощи святого Адальберта и с тех пор остаётся сердцем польской католической веры. Укрепите польскую церковь и исполните долг хранителя католичества Восточной Европы."
 pol_gniezno_church_tooltip: "Гнезно принадлежит нам или подданному, довольство духовенства не ниже 0.75"
 pol_hanseatic_ties: "Связи с Ганзой"
 pol_hanseatic_ties_desc: "Ганзейский союз господствовал в торговле на Балтийском и Северном морях. Польские города Гданьск, Торунь и Эльблонг были тесно связаны с Ганзой. Постройте вокруг них огромную торговую сеть, и Польша станет первой торговой силой Балтики."
 pol_hanseatic_ties_tooltip: "Доход в месяц не ниже 120, не меньше 5 рынков"
 pol_transylvania_influence: "Влияние в Трансильвании"
 pol_transylvania_influence_desc: "Трансильвания — богатый край на границе Венгерского королевства и польской личной унии. Утвердив влияние в Трансильвании через унию с Венгрией или напрямую, вы успокоите юго-восточную границу Польши."
 pol_transylvania_influence_tooltip: "Не меньше 5 районов в области Трансильвания, либо личная уния с Венгрией"
 pol_subjugate_serbia: "Подчинить Сербию"
 pol_subjugate_serbia_desc: "После Косова поля (1389) Сербское королевство стало вассалом Османов. В ходе движения польско-венгерской унии на юг возьмите Белград или сделайте Сербию вассалом, чтобы прочно закрепиться на севере Балкан."
 pol_subjugate_serbia_tooltip: "Сербия (c:SER) — наш подданный, либо Белград принадлежит нам или подданному"
 pol_varna_revenge: "Месть за Варну"
 pol_varna_revenge_desc: "В битве при Варне в 1444 году польско-венгерское войско крестоносцев было разбито Османами, и польский король Владислав III пал на поле боя. Наконец пришло время отомстить за это унижение. Займите Варну в войне с мусульманской страной — и та трагедия будет переписана победой."
 pol_varna_revenge_tooltip: "Варна принадлежит нам или подданному, идёт война с мусульманской страной"
 pol_upper_silesia_mines: "Верхнесилезские рудники"
 pol_upper_silesia_mines_desc: "Верхняя Силезия славится богатыми рудниками серебра, цинка и свинца. Полностью развив горные округа у Цешина и Гливице, вы заложите промышленную основу Польши. Возьмите заранее недра края, который позже станет средоточием промышленного переворота."
 pol_upper_silesia_mines_tooltip: "Не меньше 3 районов области Силезия с добычей ресурсов уровня 5 и выше (серебро)"
 pol_pomeranian_coast: "Поморское побережье"
 pol_pomeranian_coast_desc: "Померания (Поморье) — балтийское побережье со Штеттином (Щецином). Вернув этот край, исторически часть польского королевства, Польша полностью овладеет балтийским берегом."
 pol_pomeranian_coast_tooltip: "Штеттин принадлежит нам или подданному"
 pol_prague_university: "Пражский университет"
 pol_prague_university_desc: "Карлов университет в Праге (основан в 1348 году) — старейший университет Центрально-Восточной Европы. Прежде рассадник гуситской реформации, под польской властью эта академия может быть отстроена и развита, и Прага вновь станет средоточием католической учёности."
 pol_prague_university_tooltip: "Прага принадлежит нам или подданному, университет построен"
 pol_catholicism_of_lithuania: "Обращение Литвы в католичество"
 pol_catholicism_of_lithuania_desc: "Став королём Польши, Ягайло обязался обратить Литву в католичество. Стройте церкви и монастыри по всей Литве с Вильнюсом во главе и превратите бывшую языческую землю в полностью католическое государство. Без этого обращения не будет настоящего единства польско-литовской унии. «Литва, возрождённая в вере»."
 pol_catholicism_of_lithuania_tooltip: "Вильнюс принадлежит нам или подданному, довольство духовенства не ниже 0.70"
 pol_royal_road: "Королевский тракт"
 pol_royal_road_desc: "«Королевский тракт» из Кракова в Гнезно, Познань и Гданьск — главная артерия Польского королевства. С присоединённой Мазовией и покорённой Пруссией развитие этого тракта резко улучшит связь, торговлю и управление по всему королевству."
 pol_royal_road_tooltip: "Варшава и Гнезно принадлежат нам или подданному (после присоединения Мазовии и покорения Пруссии)"
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Нешавские статуты"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "Шляхта получила право вето на королевские законы. Начало польской «Золотой вольности»."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "Польский свод законов"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Упорядоченная кодификация польского права повышает действенность управления по всему королевству."
 STATIC_MODIFIER_NAME_pol_krakow_capital_mod: "Королевская столица Краков"
 STATIC_MODIFIER_DESC_pol_krakow_capital_mod: "Краков вокруг Вавельского замка отстроен как крупнейший торговый город Центрально-Восточной Европы."
 STATIC_MODIFIER_NAME_pol_warsaw_capital_mod: "Варшава отстроена"
 STATIC_MODIFIER_DESC_pol_warsaw_capital_mod: "Варшава отстроена как управленческое средоточие центра королевства — в предвкушении её будущей роли столицы."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Поддержка купечества"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Поддержка польского купечества поднимает торговые доходы."
 STATIC_MODIFIER_NAME_pol_breadbasket_mod: "Житница Европы"
 STATIC_MODIFIER_DESC_pol_breadbasket_mod: "Вывоз польского зерна кормит всю Европу. Путь по Висле к Гданьску приносит огромные богатства."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "Янтарный путь"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Древний балтийский янтарный путь возрождён. Вывоз «северного золота» расширяет дальность торговли и доходы."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Торговый узел Познань"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "Познань, торговый город западной Польши, отстроена как крупный торговый узел."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Расцвет Вильнюса"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "Вильнюс, столица Великого княжества Литовского, процветает как город многих народов."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Выход к Чёрному морю"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Польша получила выход к северному берегу Чёрного моря и вошла в средиземноморские торговые пути."
 STATIC_MODIFIER_NAME_pol_russia_rivalry_mod: "Соперничество с Москвой"
 STATIC_MODIFIER_DESC_pol_russia_rivalry_mod: "Борьба с Москвой за первенство среди восточных славян укрепляет дисциплину польского войска и оборону крепостей."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "Крепость Мальборк"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "Крупнейший средневековый замок Европы усилен бастионами — неприступная опора обороны."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "Гнезненская архиепархия"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "Гнезненский собор, где покоятся мощи святого Адальберта, служит духовным средоточием польской католической цивилизации."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Связи с Ганзой"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "Связи с Ганзейским союзом, господствующим в балтийской торговле, резко поднимают торговые доходы Польши."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Влияние в Трансильвании"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Влияние в Трансильвании успокоило юго-восточную границу Польши."
 STATIC_MODIFIER_NAME_pol_balkan_control_mod: "Власть над северными Балканами"
 STATIC_MODIFIER_DESC_pol_balkan_control_mod: "Вассальная Сербия утвердила влияние Польши на Балканах."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "Месть за Варну"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "За позорное поражение 1444 года отомщено. В битвах с исламским миром Польша стяжает всё большую славу."
 STATIC_MODIFIER_NAME_pol_upper_silesia_mines_mod: "Верхнесилезские рудники"
 STATIC_MODIFIER_DESC_pol_upper_silesia_mines_mod: "Рудники серебра, цинка и свинца Верхней Силезии работают в полную силу."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "Поморское побережье"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "Поморское побережье со Штеттином отстроено как база польского флота."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "Расцвет Пражского университета"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "Старейший университет Центрально-Восточной Европы, Карлов университет, вновь процветает под польской властью."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Победа над Габсбургами"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Вена занята или заключена личная уния с Габсбургами — Польша стала хозяйкой Центральной Европы."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "От моря до моря"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "Польша от Балтики до Чёрного моря господствует во всей торговле Восточной Европы."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "Литовская церковь"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "Обращение Литвы в католичество принесло польско-литовской унии духовное единство."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "Королевский тракт"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Королевский тракт от Кракова до Гданьска отстроен — управление, торговля и войско королевства стали действеннее."
 pol_kingdom_of_poland_tooltip: "Легитимность не ниже 100, стабильность не ниже 30"
 pol_integrate_mazovia_tooltip: "Плоцк и Варшава принадлежат нам напрямую"
 pol_silesia_integration_tooltip: "Вроцлав принадлежит нам или подданному, не меньше 8 районов в области Силезия. В награду — повод cb_claim_throne на Богемию"
 pol_bohemian_claim_tooltip: "В личной унии с Богемией (c:BOH) или она наш подданный, либо Прага принадлежит нам напрямую"
 pol_hungarian_union_tooltip: "В личной унии с Венгрией (c:HUN) или она наш подданный, либо Буда принадлежит нам напрямую"
 pol_moldavia_vassal_tooltip: "В личной унии с Молдавией (c:MOL) или она наш подданный, либо Унгены принадлежат Венгрии, нам или нашему подданному"
 pol_lithuanian_relations: "Отношения с Литвой"
 pol_lithuanian_relations_desc: "Великое княжество Литовское — важнейший сосед Польши: возможный союзник или главная угроза. В XIV веке Литва была последним языческим народом Европы и при этом грозной державой от Балтики до Чёрного моря. Чтобы брачной политикой королевы Ядвиги закрепить личную унию с Литвой, сначала нужно подготовить дипломатическую почву. Дружбой или военным давлением Польша может заявить права на литовский престол."
 pol_lithuanian_relations_tooltip: "Мнение Литвы (c:LIT) не ниже 100, или союз с ней, или она наш соперник, либо Вильнюс принадлежит нам или подданному"
 pol_develop_ruthenia_desc: "Галиция (Галич) и Волынь — два великих княжества Червонной Руси. Львов (Лемберг), средоточие Галицкого княжества (HAL), и Волынское княжество (VOL) Польша завоевала в 1349–1366 годах. Белз — тоже важная русская твердыня. Взяв Галицию и Волынь в личную унию с Польшей или прямо владея Львовом и Белзом, вы подчините себе всю Червонную Русь. Это одна из богатейших житниц Европы, и её плодородная земля кормит население и хозяйство Польши."
 pol_develop_ruthenia_tooltip: "Галиция (c:HAL) и Волынь (c:VOL) в личной унии, либо Львов и Белз принадлежат нам или подданному"
 pol_hre_influence_tooltip: "Союз с Габсбургами (c:HAB), или их мнение не ниже 150, или они наш соперник, либо проекция силы не ниже 20. В награду — повод cb_claim_throne на Габсбургов"
 pol_upper_silesia_mines_tooltip: "Не меньше 3 районов области Силезия с добычей ресурсов уровня 5 и выше. В награду всем районам области Силезия +20% к local_max_rgo_size_modifier"
 pol_moldavia_vassal_tooltip: "В личной унии с Молдавией (c:MOL) или она наш подданный, либо Яссы принадлежат Венгрии, нам или нашему подданному"
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "Верхнесилезские рудники"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "Рудники серебра, цинка и свинца Верхней Силезии работают в полную силу. Предельный размер добычи ресурсов растёт, и выработка увеличивается."
 pol_catholicism_of_lithuania_tooltip: "Вильнюс принадлежит нам или подданному, и больше половины его населения — католики"
 pol_gniezno_church_tooltip: "Гнезно имеет ранг не ниже города"
 pol_black_sea_access_tooltip: "Не меньше 5 районов в области Запорожье"
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "Польский Балтийский флот"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "Польский флот с базой в Гданьске держит Балтийское море. От устья Вислы до Северного моря над волнами реет польское знамя."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Власть над Ливонией"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Власть над Ливонией с Ригой и Таллином утверждена. Уважение к разным культурам края и лучший сбор налогов умножают силу Польши."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Связи с Ганзой"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "Тесные связи с городами Ганзы снижают содержание купцов и сильно расширяют их общее число."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Влияние в Трансильвании"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Влияние в Трансильвании через личную унию с Венгрией усиливает культурные возможности и дипломатический вес Польши."
 pol_breadbasket_town_right_tt: "Доступно городское право [Imperial Breadbasket]. Его можно даровать районам с рангом не ниже города, где не меньше 5 уровней амбаров."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Королевская Варшава отстроена"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Варшава отстроена: власть столицы распространяется лучше, предел населения вырос. Как средоточие присоединённой Мазовии Варшава становится управленческим узлом королевства."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Расцвет Кракова"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Краков вокруг Вавельского замка полностью отстроен. Рост предельного размера добычи ресурсов и ежемесячного процветания делает его городом, достойным польской королевской столицы."
