 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "The Polish fleet based at Gdańsk controls the Baltic Sea. From the mouth of the Vistula to the North Sea, the Polish banner flies on the waves."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Dominion over Livonia"
