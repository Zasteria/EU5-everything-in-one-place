l_russian:
 byz_restoration_mission_pack: "Восстановление Римской империи"
 byz_restoration_mission_pack_desc: "Верните Константинополь, отвоюйте Анатолию и Балканы, соедините четыре патриархата, восторжествуйте в Риме и восстановите Римскую империю в её наибольших пределах."
 byz_restoration_mission_pack_BUTTON_TOOLTIP: "Восстановить земли Римской империи."
 byz_restoration_mission_pack_DESCRIPTION: "Спасите разваливающуюся империю и верните ей прежнюю славу. Как наследник Рима, соберите старые земли Востока и Запада вновь под имперское знамя."
 byz_restoration_mission_pack_BUTTON_DETAILS: "Отстройте Византийскую империю с края гибели и верните под её власть средиземноморский мир, которым когда-то правил Рим. Воплотите мечту о Renovatio Imperii!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION: "Играя за Византию, верните старые римские земли и достигните Renovatio Imperii."
 byz_retake_anatolia_west: "Отвоевать Западную Анатолию"
 byz_retake_anatolia_west_desc: "Отвоюйте Смирну и верните имперскую власть в западную Анатолию."
 byz_retake_anatolia_west_tooltip: "Закрепить за собой Смирну."
 byz_retake_anatolia_east: "Отвоевать Восточную Анатолию"
 byz_retake_anatolia_east_desc: "Завоюйте Анкару, Конью и Сивас, чтобы вся Анатолия перешла под власть империи. Управление живущими здесь людьми греческой культуры потребует нового подхода."
 byz_retake_anatolia_east_tooltip: "Закрепить за собой Анкару, Конью и Сивас."
 byz_secure_greece: "Вернуть Грецию"
 byz_secure_greece_desc: "Отвоюйте Афины и Коринф и возродите православие и греческую культуру в Элладе."
 byz_secure_greece_tooltip: "Закрепить за собой Афины и Коринф."
 byz_balkan_dominance: "Власть над Балканами"
 byz_balkan_dominance_desc: "Завоюйте Белград и Тырново и восстановите имперский порядок по всем Балканам."
 byz_balkan_dominance_tooltip: "Закрепить за собой Белград и Тырново."
 byz_invasion_of_syria: "Вторжение в Сирию"
 byz_invasion_of_syria_desc: "Завоюйте земли Сирии вместе с Антиохией, одним из пяти великих патриархатов. Древние торговые пути и богатые ремёслами города принесут империи новое процветание."
 byz_invasion_of_syria_tooltip: "Закрепить за собой Антиохию."
 byz_protect_jerusalem: "Защита Иерусалима"
 byz_protect_jerusalem_desc: "Отвоюйте Святую землю, где принял страдания Христос. Римский император обязан быть стражем святых мест. Установите терпимое правление, чтобы люди разных вер могли мирно жить на этой земле."
 byz_protect_jerusalem_tooltip: "Закрепить за собой Иерусалим и Акру."
 byz_dominion_of_aegyptus: "Власть над Египтом"
 byz_dominion_of_aegyptus_desc: "Закрепите за собой Александрию и Каир, великие средоточия учёности Египта. Плодородные земли Нила прокормят многие народы империи."
 byz_dominion_of_aegyptus_tooltip: "Закрепить за собой Александрию и Каир."
 byz_control_aegean: "Господство в Эгейском море"
 byz_control_aegean_desc: "Закрепите за собой Крит и постройте сильный флот, чтобы полностью владеть Эгейским морем."
 byz_control_aegean_tooltip: "Флот от 20, верфей от 10, закрепить за собой Крит."
 byz_retake_italy_south: "Отвоевать Южную Италию"
 byz_retake_italy_south_desc: "Отвоюйте Неаполь и Сицилию и закрепитесь на Апеннинском полуострове."
 byz_retake_italy_south_tooltip: "Закрепить за собой Неаполь и Палермо."
 byz_reclaim_rome: "Вернуть Вечный город"
 byz_reclaim_rome_desc: "Отвоюйте Вечный город Рим. Настал час законному преемнику Римской империи вернуть себе западную столицу."
 byz_reclaim_rome_tooltip: "Закрепить за собой Рим, священники от 70%, легитимность от 85"
 byz_iberian_conquest: "Завоевать Иберию"
 byz_iberian_conquest_desc: "Завоюйте Толедо и Кордову и верните империи старую провинцию Испания."
 byz_iberian_conquest_tooltip: "Закрепить за собой Толедо и Кордову."
 byz_north_africa: "Отвоевать Северную Африку"
 byz_north_africa_desc: "Завоюйте Тунис, Триполи и Алжир и верните империи старую провинцию Африка."
 byz_north_africa_tooltip: "Закрепить за собой Тунис, Триполи и Алжир."
 byz_north_italy: "Северная Италия"
 byz_north_italy_desc: "Завоюйте Венецию, Геную, Милан и Флоренцию и соедините Апеннинский полуостров под именем Рима."
 byz_north_italy_tooltip: "Закрепить за собой Венецию, Геную, Милан и Флоренцию."
 byz_invasion_of_france: "Вторжение во Францию"
 byz_invasion_of_france_desc: "С Северной Италией и Иберией в руках империя обращает взор на Галлию. Завоюйте всю область Франции и завершите владения империи на Западе."
 byz_invasion_of_france_tooltip: "Закрепить за собой Париж и Авиньон."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "Восстановление империи. От Иберии до Галлии, от Северной Африки до Италии, от Малой Азии до Балкан и Святой земли. Требуется от 1000 районов и от 2000 дохода в месяц."
 byz_renovatio_imperii_tooltip: "1000 районов, доход 2000"
 byz_events.2.t: "Процветание Смирны"
 byz_events.2.d: "Смирна и порты западной Анатолии отвоёваны. Эти древние торговые города вновь во власти византийских купцов, и эгейский торг оживает."
 byz_events.2.a: "Поощрить торговлю в Смирне"
 byz_events.3.t: "Афины — возрождение Эллады"
 byz_events.3.d: "Афины и Коринф отвоёваны. Город Сократа и Платона, холм, на котором стоит Парфенон, снова византийские. Православные монастыри отстраиваются, греческая учёность оживает."
 byz_events.3.a: "Возродить православие и греческую культуру в Элладе"
 byz_events.7.t: "Южная Италия возвращена"
 byz_events.7.d: "Неаполь и Палермо отвоёваны. Эти земли, когда-то цветущие как Великая Греция, вновь часть Римской империи. Богатство средиземноморской торговли течёт в имперскую казну."
 byz_events.7.a: "Ввести Южную Италию в состав империи"
 byz_events.8.t: "Вечный город — вступление в Рим"
 byz_events.8.d: "Рим — город семи холмов, место мученичества Петра и Павла — возвращён. Как некогда Константин Великий правил империей отсюда, так и вновь римский император сидит в Риме. История замкнула круг."
 byz_events.8.a: "Сделать Вечный город западной столицей"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "Восстановление Римской империи. От Иберии до Малой Азии, от Северной Африки до Балкан, от Италии до Святой земли. То, к чему стремился Юстиниан Великий с 527 по 565 год, о чём мечтали все средние века, — восстановление Римской империи — наконец стало явью. Средиземное море снова Mare Nostrum."
 byz_events.10.a: "Провозгласить миру Renovatio Imperii"
 byz_renovatio_unlock_tt: "Renovatio Imperii достигнуто."
 byz_reclaim_bursa: "Вернуть Бурсу"
 byz_reclaim_bursa_desc: "Отвоюйте Бурсу, некогда крупный византийский город. Он стоит на важном узле Шёлкового пути, и чем ему кормиться дальше — решать империи."
 byz_reclaim_bursa_tooltip: "Закрепить за собой Бурсу."
 byz_avoid_collapse: "Отвести крах"
 byz_avoid_collapse_desc: "Империя стоит на краю краха. Но если удержать легитимность и внутренний порядок, дорога к восстановлению ещё не закрыта."
 byz_avoid_collapse_tooltip: "Легитимность от 50, стабильность от 0."
 byz_events.20.t: "Будущее Бурсы"
 byz_events.20.d: "В мастерских Бурсы ремесленники спорят о новом пути для производства. Опереться ли на давний шелкоткацкий обычай города или взяться за тонкое сукно? Решение империи определит будущее города."
 byz_events.20.a: "Поощрить выделку шёлка"
 byz_events.20.b: "Взяться за тонкое сукно"
 byz_events.21.t: "Будущее Никомедии"
 byz_events.21.d: "Никомедия, ключевой город южного берега Мраморного моря, вернулась империи. Двор спорит, каким промыслом определить будущее города: поощрять оружейное дело или насадить тутовые деревья и начать выделку шёлка."
 byz_events.21.a: "Поощрить оружейное дело"
 byz_events.21.b: "Насадить тутовые деревья и начать выделку шёлка"
 byz_reclaim_nicomedia: "Вернуть Никомедию"
 byz_reclaim_nicomedia_desc: "Никомедия (Измит) — ключевой город южного берега Мраморного моря. Переведите её добычу на шёлк и отстройте шёлковое хозяйство империи. Контроль от 50% — первый шаг к восстановлению Римской империи."
 byz_reclaim_nicomedia_tooltip: "Закрепить за собой Измит с контролем от 50%."
 byz_orthodox_antioch: "Обратить Антиохию в православие"
 byz_orthodox_antioch_desc: "Убедитесь, что большинство жителей Антиохии перешло в православие. Город, где впервые прозвучало слово «христианин», вновь наполнится православным светом."
 byz_orthodox_antioch_tooltip: "Православных в Антиохии от 50%"
 byz_orthodox_jerusalem: "Обратить Иерусалим в православие"
 byz_orthodox_jerusalem_desc: "Убедитесь, что большинство жителей Иерусалима перешло в православие. Колокола храма Гроба Господня звонят на православной службе."
 byz_orthodox_jerusalem_tooltip: "Православных в Иерусалиме от 50%"
 byz_orthodox_alexandria: "Обратить Александрию в православие"
 byz_orthodox_alexandria_desc: "Убедитесь, что большинство жителей Александрии перешло в православие. Обычаи коптской церкви входят в православный уклад."
 byz_orthodox_alexandria_tooltip: "Православных в Александрии от 50%"
 byz_orthodox_rome: "Конец Великой схизмы"
 byz_orthodox_rome_desc: "Убедитесь, что большинство жителей Рима перешло в православие. Раскол 1054 года кончается — не примирением, а победой православия над Римом."
 byz_orthodox_rome_tooltip: "Православных в Риме от 50%"
 byz_hellenic_athens: "Возрождение Парфенона"
 byz_hellenic_athens_desc: "Афины — город Афины. На Акрополе вновь приносят дары олимпийским богам, и возрождение эллинской веры начинается здесь."
 byz_hellenic_athens_tooltip: "Эллинистов в Афинах от 50%"
 byz_hellenic_corinth: "Святилище Посейдона в Коринфе"
 byz_hellenic_corinth_desc: "В Коринфе на Коринфском перешейке у Посейдона, хранителя двух морей, когда-то стоял великий храм. Возродите это святилище и призовите на империю благословение морского бога."
 byz_hellenic_corinth_tooltip: "Эллинистов в Коринфе от 50%"
 byz_hellenic_mystras: "Святилище Аполлона в Мистре"
 byz_hellenic_mystras_desc: "Мистра близ Спарты — духовное сердце Пелопоннеса. Возродите здесь святилище Аполлона и разбудите дерзкий дух Спарты, храня память дельфийского оракула."
 byz_hellenic_mystras_tooltip: "Эллинистов в Мистре от 50%, владеть Миконосом"
 byz_hellenic_alexandria: "Восстановление Серапеума"
 byz_hellenic_alexandria_desc: "Серапеум Александрии был одним из величайших храмов древнего мира. Он посвящён Серапису, рождённому слиянием греческой и египетской веры, и его восстановление утверждает эллинскую веру в Египте и вновь собирает воедино мудрость древнего мира."
 byz_hellenic_alexandria_tooltip: "Эллинистов в Александрии от 50%"
 byz_events.11.t: "Антиохия — возвращение к первой церкви"
 byz_events.11.d: "Антиохия, где впервые прозвучало слово «христианин», наполнена теперь православным светом. Память о служении здесь Петра и Павла ожила, и город принимает новое призвание духовного средоточия православия."
 byz_events.11.a: "Отдать Антиохию под православное попечение"
 byz_events.12.t: "Иерусалим — православные колокола в Святом городе"
 byz_events.12.d: "Святой город Иерусалим, о котором тоскуют все православные, стал православным городом. В храме Гроба Господня снова звучит восточная служба. Это не просто завоевание — это торжество веры."
 byz_events.12.a: "Хранить Святую землю вечно"
 byz_events.13.t: "Александрия — обращение города учёности"
 byz_events.13.d: "Александрия, хранилище древнего знания, стала православным городом. Старые обычаи коптской церкви вливаются в большой православный поток, и разговор между неоплатонической философией и богословием вновь расцветает."
 byz_events.13.a: "Развивать Александрию как город православной учёности"
 byz_events.14.t: "Конец Великой схизмы — единство церквей"
 byz_events.14.d: "С 1054 года, когда папа Лев IX и патриарх Керуларий отлучили друг друга, прошли века. Не примирением, а православным завоеванием Рима кончается Великая схизма. Большинство римлян перешло в православие. Вечный город становится западной опорой Восточной церкви. История выбрала византийскую веру."
 byz_events.14.a: "Провозгласить миру конец Великой схизмы"
 byz_events.15.t: "Парфенон — возвращение Афины"
 byz_events.15.d: "На Акрополе вновь приносят дары Афине. Парфенон, ставший было христианским храмом, возвращён древним богам. Афиняне зовут олимпийцев по именам, и пламя эллинства разгорается снова."
 byz_events.15.a: "Вести империю под покровом Афины"
 byz_events.16.t: "Коринф — Посейдон проливов"
 byz_events.16.d: "На коринфском холме, глядящем на два моря, восстановлен храм Посейдона. Бог перешейка издавна хранил купцов и мореходов. С возвращением его обрядов Коринф снова становится духовным средоточием средиземноморской торговли."
 byz_events.16.a: "Богатеть торговлей под благословением Посейдона"
 byz_events.17.t: "Делос — родина бога света"
 byz_events.17.d: "На священном эгейском острове Делос, чтимом как родина Аполлона и Артемиды, отстроен древний храм. Со всей Эгеиды сюда стекаются паломники и жрецы, и дух древнегреческого разума и красоты оживает. Неоплатоническая империя, о которой мечтал Плифон, начинает обретать очертания."
 byz_events.17.a: "Озарить империю сиянием Делоса"
 byz_events.18.t: "Серапеум — завершение эллинского возрождения"
 byz_events.18.d: "Александрия — на этой земле, где стоял Серапеум, вера в эллинских богов вернулась.

С окончанием восстановления храма боги Олимпа вновь нисходят на великую землю Нила. Жители Александрии возобновляют древние обряды, и молитвы Серапису разносятся в рассветном небе.

Это священное возрождение катит волны эллинской веры по всей Византийской империи — новообращённые прибывают один за другим, сила знамений растёт, религиозное влияние поднимается. Зевс, Аполлон, Афина — все боги благословляют восстановление империи."Серапеум Александрии отстроен. У Сераписа, рождённого после завоевания Египта Александром слиянием греческой и египетской веры, был некогда храм среди величайших построек древнего мира. Золотая статуя Сераписа сияет в восстановленном храме, и эллинские верующие со всего света идут сюда паломниками. Из этого места, где сходятся мудрость и вера древнего мира, расцветает новая эллинская цивилизация."
 byz_events.18.a: "Сделать Серапеум святым городом эллинского мира"
 byz_faith_choice: "Выбор веры"
 byz_faith_choice_desc: "Занимается новый век мысли. При дворе в Мистре обсуждают неоплатоническое учение, а в Константинополе ставят под сомнение власть православной церкви. Империя стоит на духовном распутье."
 byz_faith_choice_tooltip: "После 1400 года."
 byz_events.19.t: "Распутье веры — православие или эллинство"
 byz_events.19.d: "Греция возвращена. С афинского Акрополя вдали виден Константинополь, а в пелопоннесских горах спят руины древних храмов. Восстановление Византийской империи — не просто возврат земель, это восстановление души. При дворе спорят два голоса. Первый принадлежит духовенству: «Мы народ Христов. Мы должны отстроить империю как хранители православной церкви». Второй — эллинским философам: «Зачем поклоняться чужому богу на земле Платона и Аристотеля? Древние греческие боги — вот истинный дом наших душ»."
 byz_events.19.a: "Хранить православную церковь — беречь восточный обычай"
 byz_events.19.a.tt: "Открывается православная ветвь веры. Дальше идут задания обратить в православие Антиохию, Иерусалим, Александрию и Рим."
 byz_events.19.b: "Возродить древних богов — разжечь эллинское пламя"
 byz_events.19.b.tt: "Открывается эллинская ветвь. Империя переходит в эллинскую веру, и становятся доступны задания возродить святилища в Афинах, Коринфе, Мистре и Александрии."
 byz_orthodox_path_start: "Православный путь"
 byz_orthodox_path_start_desc: "Путь православного хранителя открыт. Дальше — вернуть святые города и обратить их в православие."
 byz_orthodox_path_start_tooltip: "Открыта православная ветвь."
 byz_hellenic_path_start: "Эллинский путь"
 byz_hellenic_path_start_desc: "Путь древних богов открыт. Возродите святилища Эллады и отстройте древнегреческую цивилизацию."
 byz_hellenic_path_start_tooltip: "Открыта эллинская ветвь."
 byz_recovery_from_decline: "Выход из упадка"
 byz_recovery_from_decline_desc: "Умерьте силу придворной знати и верните власть короне. Вместе с имперской властью вернётся и устойчивость правления."
 byz_recovery_from_decline_tooltip: "Сила сословия короны от 20%."
 byz_city_the_world_desires: "Город, желанный всему миру"
 byz_city_the_world_desires_desc: "Константинополь вновь вырос в великий город, увидеть который мечтают со всего света. Сделайте это процветание постоянным."
 byz_city_the_world_desires_tooltip: "Население Константинополя от 400 000."
 byz_islamic_heartland: "Сердце ислама"
 byz_islamic_heartland_desc: "Мекка и Медина, два святейших города ислама, попали в наши руки. Империи предстоит важнейшее решение о судьбе этих святынь."
 byz_islamic_heartland_tooltip: "Закрепить за собой Медину и Мекку."
 byz_events.22.t: "Святыни ислама"
 byz_events.22.d: "Кааба в Мекке и мечеть Пророка в Медине — святейшие места исламского мира — под властью империи. Разрушить ли их, показав превосходство православия, или принять и получать выгоду от богатства паломников?"
 byz_events.22.a: "Разрушить святыни"
 byz_events.22.b: "Принять святыни"
 STATIC_MODIFIER_NAME_byz_constantinople_restored: "Сердце империи возвращено"
 STATIC_MODIFIER_DESC_byz_constantinople_restored: "Никомедия отвоёвана. Растут легитимность, дипломатическая репутация и налоговый доход."
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Западная Анатолия возвращена"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Разные народы западной Анатолии понемногу врастают в культуру империи."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Восточная Анатолия"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Разные народы восточной Анатолии понемногу врастают в культуру империи."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Эллада возвращена"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Православие оживает на греческих землях, сильно ускоряя обращение населения."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Балканский порядок"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Число рекрутов и военная сила на Балканах усилены."
 STATIC_MODIFIER_NAME_byz_syria_province: "Провинция Сирия"
 STATIC_MODIFIER_DESC_byz_syria_province: "Древние торговые пути и ремесло Сирии навсегда улучшают производительность по всей империи."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Провинция Иудея"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Управление Иудеей, где лежит Святая земля, воспитывает большую терпимость к многим верам империи."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Провинция Египет"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "Плодородные земли Нила позволяют империи прокормить больше народа во всех её владениях."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Господство в Эгейском море"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "Власть над Эгейским морем усиливает флот и торговый доход."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Вечный город возвращён"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Возвращение Рима поднимает престиж империи к вершине. Сильно растут легитимность, дипломатическая репутация и скорость обращения."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Провинция Испания"
 STATIC_MODIFIER_DESC_byz_hispania_province: "Обширные земли Испании шлют множество воинов в ряды имперского войска."
 STATIC_MODIFIER_NAME_byz_africa_mod: "Африканская провинция"
 STATIC_MODIFIER_DESC_byz_africa_mod: "Порты и морские базы Северной Африки навсегда поднимают боевой дух имперского флота."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Провинция Галлия"
 STATIC_MODIFIER_DESC_byz_gallia_province: "Завоевание обширных земель Галлии навсегда поднимает боевой дух имперского войска."
 STATIC_MODIFIER_NAME_byz_true_rome: "Истинный Рим"
 STATIC_MODIFIER_DESC_byz_true_rome: "Торговая сила Венеции, Генуи и Милана навсегда улучшает торговый доход империи и выгоду от продаж. Апеннинский полуостров больше не ветвь Рима, а его ствол."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "Римская империя восстановлена полностью. Стоимость дорог по удалённости от столицы снижена, власть короны от населения выше на 50%, предельный контроль выше на 5%."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Крах отведён"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "Империя ещё не пала. Пережив беду, двор легче отбирает привилегии у сильных, и сопротивление таким переменам слабее."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Шёлковая торговля Бурсы"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "В Бурсе поощряется выделка шёлка, и его выход растёт."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Торговля тонким сукном Бурсы"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "В мастерских Бурсы поощряется выделка тонкого сукна, и его выход растёт."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Оружейная торговля Никомедии"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "В мастерских Никомедии поощряется оружейное дело, и его выход растёт."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Шёлковая торговля Никомедии"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Вокруг Никомедии насажены тутовые деревья, и выход шёлка растёт."
 STATIC_MODIFIER_NAME_byz_orthodox_holy_site: "Православная святыня"
 STATIC_MODIFIER_DESC_byz_orthodox_holy_site: "Этот город признан православной святыней. Вместимость населения выше на 200%."
 STATIC_MODIFIER_NAME_byz_orthodox_rome_site: "Обращение Вечного города"
 STATIC_MODIFIER_DESC_byz_orthodox_rome_site: "Рим стал православным городом. Вся власть Восточной и Западной церквей сошлась в Византии. Растут процветание, грамотность и вместимость населения."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Эллинское святилище"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "Святилище древнегреческих богов восстановлено. Растут процветание, производительность, скорость обращения и терпимость."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "Серапеум"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "Восстановление Серапеума делает Александрию духовным средоточием древнего мира. Сильно растут процветание, производительность, грамотность, скорость обращения и терпимость."
 STATIC_MODIFIER_NAME_byz_schism_ended: "Конец Великой схизмы"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Раскол Восточной и Западной церквей кончается победой православия. Скорость обращения населения выше на 50%, скорость ассимиляции — на 50%."
 STATIC_MODIFIER_NAME_byz_hellenic_triumph: "Торжество эллинства"
 STATIC_MODIFIER_DESC_byz_hellenic_triumph: "Возрождение древнегреческой веры завершено. Сильно растут легитимность, терпимость, скорость обращения и производительность."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Выход из упадка"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "Имперская власть восстановлена, и правление устойчивее прежнего."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "Город, желанный всему миру"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Константинополь стал великим городом, влекущим людей со всего света, и его производительность и рост не знают равных."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Святыни разрушены"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "Разрушение исламских святынь громко показало превосходство православия, укрепив веру в государственную религию и престиж империи."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Святыни приняты"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "С принятием исламских святынь выросла терпимость к еретикам и иноверцам, а наплыв паломников оживил торговлю."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Выход из упадка"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "Византия выходит из упадка — сословие короны и управленческое основание укреплены."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "Город, желанный всему миру"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Константинополь отстроен как средоточие управления империей."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Провинция Африка"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "Северная Африка возвращена, морская сила Византии усилена."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "Слава Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "Восстановление Римской империи признало Византию владычицей мировой державы."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Православие Антиохии"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Антиохия возрождена как православная святыня, и это поднимает духовную власть империи."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Православие Иерусалима"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "Святой город Иерусалим обращён в православие, что даёт преимущество в бою с иноверцами."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Православие Александрии"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "Александрия возрождена как православная святыня, укрепляя людской запас империи."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Серапеум восстановлен"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "Серапеум Александрии отстроен — скорость обращения в эллинскую веру, сила священных знамений и религиозное влияние сильно возросли. Боги Олимпа вновь нисходят на землю Египта."
