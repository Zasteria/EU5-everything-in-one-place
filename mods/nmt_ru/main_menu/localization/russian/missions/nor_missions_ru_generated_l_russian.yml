l_russian:
 nor_kongedommen_mission_pack: "Kongeriket Norge — Glory of Norway"
 nor_kongedommen_mission_pack_DESCRIPTION: "In 1337, Norway is in personal union with Sweden under King Magnus Eriksson while remaining under Danish influence. As heirs of the Vikings, break free from Denmark and unite Scandinavia. Through Bergen's fisheries, North Sea mastery, colonies in Iceland and Greenland, and the great voyage to Vinland — and with the choice of faith (Catholic, Lutheran, or Norse) — build the Norwegian Empire."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION: "As Norway, achieve independence, unity, North Atlantic mastery, and colonial empire to found the Norwegian Empire."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP: "Complete missions to build the Norwegian Empire."
 nor_kongedommen_mission_pack_BUTTON_DETAILS: "With the pride of Viking heirs, forge Norway into an Empire!"
 nor_kingdom_of_norway: "Kingdom of Norway"
 nor_kingdom_of_norway_desc: "In 1337, Norway is in personal union with Sweden under King Magnus Eriksson, while Danish influence constantly threatens the North. As heirs of the Vikings, strengthen royal legitimacy and consolidate the foundations of an independent Norwegian kingdom."
 nor_kingdom_of_norway_tooltip: "Legitimacy 70+, stability 20+"
 nor_expel_danish_nobility: "Expel Danish Nobility"
 nor_expel_danish_nobility_desc: "Danish-aligned nobles entrenched in the Norwegian court block Norwegian self-rule. Drive them out and establish politics in purely Norwegian hands. The spirit of Engelbrekt breathes in Norway too."
 nor_expel_danish_nobility_tooltip: "Not under Danish (c:DAN) dominion, legitimacy 80+"
 nor_control_denmark: "Control Denmark"
 nor_control_denmark_desc: "Denmark is Norway's greatest threat and historical rival. Occupying Copenhagen or making Denmark a Norwegian subject transfers the leadership of the Kalmar Union to Norway."
 nor_control_denmark_tooltip: "Denmark in union, subject, doesn't exist, or Copenhagen owned by us or a subject"
 nor_sweden_union: "Personal Union with Sweden"
 nor_sweden_union_desc: "Strengthen and maintain the personal union with Sweden so all of northern Scandinavia's power gathers under Norway. Continue King Magnus's rule and make this alliance the foundation of Scandinavian unity."
 nor_sweden_union_tooltip: "Sweden (c:SWE) in personal union or subject, or doesn't exist"
 nor_unite_scandinavia: "Unite Scandinavia"
 nor_unite_scandinavia_desc: "Denmark controlled, Sweden in personal union — all of Scandinavia unified under the Norwegian banner. Since the Viking age, the historic moment when the northern world is governed under one king is here."
 nor_unite_scandinavia_tooltip: "Own 300+ locations in the Scandinavian region"
 nor_sound_toll: "The Sound Toll"
 nor_sound_toll_desc: "With Denmark defeated, the Øresund Strait falls under Norwegian control. Collecting the Sound Toll generates enormous revenue."
 nor_sound_toll_tooltip: "Fleet size 30+, monthly income 150+"
 nor_develop_stockholm: "Develop Stockholm"
 nor_develop_stockholm_desc: "Through the Swedish personal union, develop Stockholm as the eastern administrative hub of the Norwegian Empire."
 nor_develop_stockholm_tooltip: "Stockholm directly owned by us, development 30+"
 nor_secure_bergen: "Secure Bergen"
 nor_secure_bergen_desc: "Bergen is Norway's greatest city and the center of North Atlantic trade, long dominated by German Hanseatic merchants (the Bryggen). Raise it to city rank and reclaim Bergen from German merchant control — return commerce to Norwegian hands."
 nor_secure_bergen_tooltip: "Bergen is city rank or above, development 25+"
 nor_fleet_of_norway: "Fleet of Norway"
 nor_fleet_of_norway_desc: "Norwegians — descendants of the Vikings — are a people of the sea. Building a powerful fleet based in Bergen establishes deployment capacity across the North Sea, North Atlantic, and Baltic."
 nor_fleet_of_norway_tooltip: "Fleet size 20+, navy tradition 30+"
 nor_north_sea_markets: "North Sea Markets"
 nor_north_sea_markets_desc: "Norway leverages its geographic advantage facing the North Sea to develop commerce. Establish Norway as a major player in North Sea trade with monthly income 100+ and multiple market centers."
 nor_north_sea_markets_tooltip: "Monthly income 100+, own 3+ market centers"
 nor_iceland_colony: "Control Iceland"
 nor_iceland_colony_desc: "Iceland was settled by Norwegians in 874 — an overseas base of Norwegian culture. Owning multiple Iceland locations completes the North Atlantic bridgehead and puts Greenland and Vinland within reach."
 nor_iceland_colony_tooltip: "Own 3+ locations in the Iceland area"
 nor_greenland_expedition: "Greenland Expedition"
 nor_greenland_expedition_desc: "In 985, Erik the Red (Eiríkr rauði) established a colony in Greenland. Take this first step toward the western continent and open the path to the legendary Vinland."
 nor_greenland_expedition_tooltip: "Own 1+ locations in the Greenland area"
 nor_vinland: "Vinland"
 nor_vinland_desc: "Around the year 1000, Leif Eriksson reached the North American continent (Vinland), corresponding to modern Newfoundland. Complete colonial settlements there and make Norway the first European nation with New World colonies."
 nor_vinland_tooltip: "Own 5+ colonial locations"
 nor_orkney_shetland: "Orkney and Shetland"
 nor_orkney_shetland_desc: "The Orkney and Shetland islands have been under Norwegian influence since the Viking age. Securing these strategic islands dramatically improves deployment capacity into the North Sea and toward the British Isles."
 nor_orkney_shetland_tooltip: "Orkney and Shetland owned by us or a subject"
 nor_conquer_scotland: "Conquer Scotland"
 nor_conquer_scotland_desc: "Scotland's western coast and the Hebrides were once dominated by Vikings. Seizing Edinburgh and the Hebrides opens the path to York — the capital of the Danelaw."
 nor_conquer_scotland_tooltip: "Edinburgh owned by us or a subject, own 3+ locations in the Hebrides area"
 nor_invade_england: "Invade England"
 nor_invade_england_desc: "York was once the capital of the Viking kingdom of Jórvík. Norwegian forces occupying York revive the memory of the Danelaw in the modern era."
 nor_invade_england_tooltip: "York owned by us or a subject"
 nor_kingdom_of_britain: "Kingdom of Britain"
 nor_kingdom_of_britain_desc: "London, York, Edinburgh under Norwegian control — the entire British Isles governed under the Norwegian banner. The North Sea Empire of Cnut the Great is reborn, and Norway stands as the greatest maritime kingdom in history."
 nor_kingdom_of_britain_tooltip: "London, York, and Edinburgh owned by us or a subject"
 nor_master_of_north_sea: "Master of the North Sea"
 nor_master_of_north_sea_desc: "North Sea markets secured, Orkney and Shetland seized — Norway is the undisputed master of the North Sea. With fleet 50+ and income 200+, the Norwegian banner flies across the entire North Sea."
 nor_master_of_north_sea_tooltip: "Fleet size 50+, monthly income 200+"
 nor_secure_nidaros: "Secure Nidaros"
 nor_secure_nidaros_desc: "Nidaros (modern Trondheim) is Norway's historic capital and the shrine of Saint Olaf. The Nidaros Cathedral is the largest Gothic structure in Scandinavia. Develop it as a city to serve as the spiritual and religious center of the Norwegian kingdom."
 nor_secure_nidaros_tooltip: "Nidaros is city rank or above, development 25+"
 nor_fisheries: "Develop Fisheries"
 nor_fisheries_desc: "Norway is Europe's greatest fishing nation. Cod, herring, and salmon fill the North Atlantic in abundance. Fully develop this nation's fisheries and establish a system for mass export to the North Sea and Baltic."
 nor_fisheries_tooltip: "Produce 15+ fish, own 3+ docks"
 nor_timber_industry: "Timber Industry"
 nor_timber_industry_desc: "Norway's forests are a treasure of timber essential for shipbuilding and construction. Developing the timber industry using Norrland's abundant forest resources dramatically improves shipbuilding capacity and export income."
 nor_timber_industry_tooltip: "Own 5+ locations in the Norrland area, monthly income 100+"
 nor_arctic_trade: "Arctic Trade"
 nor_arctic_trade_desc: "Securing Hammerfest and Bodø opens the door to Arctic trade in fur, whale oil, and ivory (walrus tusk). Norway prospers as the frontline trading nation of the far north."
 nor_arctic_trade_tooltip: "Hammerfest and Bodø owned by us or a subject"
 nor_develop_oslo: "Develop Oslo"
 nor_develop_oslo_desc: "Oslo (near Akershus Fortress) is the commercial center of southern Norway. Developing it as a city and installing a local governor strengthens administration of the Danish border region."
 nor_develop_oslo_tooltip: "Oslo is city rank or above, development 30+"
 nor_absolutism: "Absolutism"
 nor_absolutism_desc: "Establish absolute monarchy in Norway. Raising royal authority and strengthening legitimacy prepares the foundation for centralized imperial governance."
 nor_absolutism_tooltip: "Crown estate power 35%+, legitimacy 90+"
 nor_northern_economy: "Northern Economy"
 nor_northern_economy_desc: "Arctic trade and the economic reforms of absolute monarchy — Norwegian economy reaches the highest level in Northern Europe. Prove this with monthly income 300+ and multiple market centers."
 nor_northern_economy_tooltip: "Monthly income 300+, own 4+ market centers"
 nor_religious_question: "The Question of Faith"
 nor_religious_question_desc: "The storm of the Reformation has swept into Norway. The clergy of Nidaros Cathedral cry out for loyalty to Rome. But more and more resonate with Luther's new teachings. And — some dream of returning to the ancient gods. The Norwegian king's choice will determine this northern kingdom's soul."
 nor_religious_question_tooltip: "Reformation situation (situation:reformation) is active"
 nor_catholic_norway: "Catholic Norway"
 nor_catholic_norway_desc: "The Kingdom of Norway maintains loyalty to the Roman Church. Guarding the tradition of northern Catholicism symbolized by Nidaros Cathedral, make Norway the guardian of northern Catholic civilization through close ties with the Pope."
 nor_catholic_norway_tooltip: "Dominant religion Catholic (religion:catholic), papal opinion 150+"
 nor_northern_crusade: "Northern Crusade"
 nor_northern_crusade_desc: "Norway participates in holy war as the northern shield of Christendom. Through battle with the infidel, Norwegian religious authority and prestige grow."
 nor_northern_crusade_tooltip: "At war with a Muslim country"
 nor_papal_champion: "Champion of the Pope"
 nor_papal_champion_desc: "Deep trust with the papacy and control of Lübeck — Norway has established an unshakeable position as the strongest guardian of northern Catholic civilization."
 nor_papal_champion_tooltip: "Papal opinion 180+, Lübeck owned by us or a subject"
 nor_reformation: "The Reformation"
 nor_reformation_desc: "Norway accepts Lutheranism (or Calvinism). Church property is transferred to the crown, strengthening state finances."
 nor_reformation_tooltip: "Dominant religion Lutheran (religion:lutheran) or Calvinist (religion:calvinist)"
 nor_protestant_church: "Protestant Church"
 nor_protestant_church_desc: "Develop universities to train Lutheran theologians and entrench Protestant faith across Norway."
 nor_protestant_church_tooltip: "Clergy satisfaction 0.65+, own 2+ universities"
 nor_protestant_empire: "Protestant Empire"
 nor_protestant_empire_desc: "Lutheranism penetrates Scandinavia. The Norwegian king reigns as the northern champion of the Protestant world."
 nor_protestant_empire_tooltip: "Own 250+ locations, 1+ Scandinavian region locations with 70%+ Lutheran population"
 nor_norse_revival: "Norse Revival"
 nor_norse_revival_desc: "The gods of the ancestors — Odin, Thor, Freyr — are reborn. The shape of Scandinavia before Christianization is recreated in the modern era. The Norwegian king reigns as representative of the Norse gods."
 nor_norse_revival_tooltip: "Dominant religion Norse (religion:norse)"
 nor_berserker_fleet: "Berserker Fleet"
 nor_berserker_fleet_desc: "The berserker spirit of the Viking age inhabits the navy. Sea warriors devoted to the Norse gods are unleashed as privateers to raid the coasts of the infidel."
 nor_berserker_fleet_tooltip: "Navy tradition 50+, fleet size 30+"
 nor_ragnarok_empire: "Empire of Ragnarök"
 nor_ragnarok_empire_desc: "Like the new world that comes after Ragnarök, Norway is reborn as a northern empire under the blessing of the ancient gods. With imperial rank and 500+ locations directly owned, seize that glory."
 nor_ragnarok_empire_tooltip: "Imperial rank, own 500+ locations directly"
 nor_bane_of_hansa: "Bane of the Hansa"
 nor_bane_of_hansa_desc: "The Hanseatic League has dominated Norwegian trade through the Bryggen (German Wharf) in Bergen. Control Lübeck or dissolve the Hanseatic League so Norwegian merchants reclaim their own trade routes."
 nor_bane_of_hansa_tooltip: "Lübeck owned by us or a subject, or HSA doesn't exist"
 nor_baltic_access: "Baltic Access"
 nor_baltic_access_desc: "Seizing Stralsund gives Norway direct access to the Baltic Sea. Norway thereby becomes the largest maritime nation in Northern Europe, controlling both the North Sea and the Baltic."
 nor_baltic_access_tooltip: "Stralsund owned by us or a subject, fleet size 30+"
 nor_hanseatic_expulsion: "Expel the Hanseatic Merchants"
 nor_hanseatic_expulsion_desc: "With the Hanseatic League dissolved and Bergen developed, Norway has completely liberated Bergen from German merchant domination. Norwegian merchants are the masters of their own harbor."
 nor_hanseatic_expulsion_tooltip: "HSA doesn't exist, monthly income 200+"
 nor_control_north_sea_trade: "Dominate North Sea Trade"
 nor_control_north_sea_trade_desc: "North Sea markets secured and the Hanseatic League crushed — Norway seizes the initiative over the entire North Sea trade route. Establish dominance with income 300+ and fleet 40+."
 nor_control_north_sea_trade_tooltip: "Monthly income 300+, fleet size 40+"
 nor_north_sea_empire: "North Sea Empire"
 nor_north_sea_empire_desc: "Norway controlling the entire North Sea coast including Lübeck has built the North Sea Empire. The North Sea Empire of Cnut the Great is reborn in the modern era."
 nor_north_sea_empire_tooltip: "Fleet size 60+, Lübeck owned by us or a subject, monthly income 350+"
 nor_develop_stavanger: "Develop Stavanger"
 nor_develop_stavanger_desc: "Stavanger is an important port on Norway's southwestern coast. Raising it to city rank develops it as a fishing and trade hub for southwestern Norway."
 nor_develop_stavanger_tooltip: "Stavanger is city rank or above"
 nor_amber_trade: "Amber Trade"
 nor_amber_trade_desc: "Baltic amber is exported to all of Europe through Norway's North Sea trade network. The 'Gold of the North' further expands Norwegian income."
 nor_amber_trade_tooltip: "Produce 3+ amber, monthly income 150+"
 nor_integrate_finland: "Integrate Finland"
 nor_integrate_finland_desc: "Through the Swedish personal union, integrate Finland as part of the Norwegian Empire. Directly owning Åbo and Uleåborg extends the realm from the North Atlantic to the Barents Sea."
 nor_integrate_finland_tooltip: "Åbo and Uleåborg directly owned by us"
 nor_engelbrekt: "Spirit of Engelbrekt"
 nor_engelbrekt_desc: "The spirit of Engelbrekt's rebellion has spread to Norway. With the support of the peasantry and firm resolve for independence, embody the tradition of northern freemen."
 nor_engelbrekt_tooltip: "Legitimacy 85+, peasants satisfaction 0.70+"
 nor_develop_hammerfest: "Develop Hammerfest"
 nor_develop_hammerfest_desc: "Hammerfest is one of the world's northernmost cities. Developing this Arctic trade post as a city establishes a permanent center of Arctic commerce."
 nor_develop_hammerfest_tooltip: "Hammerfest directly owned by us, city rank or above"
 nor_karoliner: "Norwegian Elite Army"
 nor_karoliner_desc: "A Norwegian elite army backed by high military tradition is complete. The strength of the Norwegian Empire's military — leveraging mountain terrain for defense and powerful offense — is demonstrated."
 nor_karoliner_tooltip: "Army tradition 50+, army size 25+"
 nor_great_power: "Great Power of the North"
 nor_great_power_desc: "Absolute monarchy and developed fisheries and industry — Norway emerges as a great power in Northern Europe. Establish this position with 200+ locations, income 250+, prestige 60+."
 nor_great_power_tooltip: "Own 200+ locations, monthly income 250+, prestige 60+"
 nor_colonization: "Norwegian Colonial Empire"
 nor_colonization_desc: "Building on Vinland and the development of the northern economy, a full colonial empire is constructed. With 10+ colonial locations, Norway becomes Europe's first true colonial empire."
 nor_colonization_tooltip: "Own 10+ colonial locations"
 nor_stormakt: "Stormakt — Great Power of the North"
 nor_stormakt_desc: "Scandinavia unified, North Sea Empire built, Northern Economy achieved — the three pillars align and Norway reigns as the Stormakt (Great Power) of Northern Europe. With 600+ locations, income 600+, prestige 80+, seize that glory."
 nor_stormakt_tooltip: "Own 600+ locations, monthly income 600+, prestige 80+"
 nor_norwegian_empire: "The Norwegian Empire"
 nor_norwegian_empire_desc: "From Iceland to Vinland, from Nidaros to Britain — the Norwegian Empire is complete. The descendants of the Vikings have surpassed even the dreams of their ancestors. An empire on a scale even Cnut the Great never dreamed of is born here. 'The North Sea is once again Norway's lake' — so historians will write."
 nor_norwegian_empire_tooltip: "Own 900+ locations, prestige 80+, monthly income 900+"
 nor_events.30.t: "Scandinavian Unity — Dawn of Norwegian Power"
 nor_events.30.d: "Denmark controlled, Sweden united — all of Scandinavia unified under the Norwegian banner. Since the Viking age, this achievement — which no one has managed — is finally realized. The bells of Nidaros Cathedral ring out, and the King of Norway hereby declares the title 'King of Scandinavia.'"
 nor_events.30.a: "Long live Scandinavia! Norway forever!"
 nor_events.40.t: "Crossroads of Faith — Norway's Religious Choice"
 nor_events.40.d: "The storm of the Reformation has swept over Norway. The clergy of Nidaros Cathedral cry out for loyalty to Rome. But more and more resonate with Luther's new teachings. And — there are those who dream of returning to the old gods. The Norwegian king's choice will determine this northern kingdom's future."
 nor_events.40.a: "Hold loyalty to Rome — Catholicism is Norway's soul"
 nor_events.40.b: "Accept Luther's teachings — the age of reform has come"
 nor_events.40.c: "Return to the ancient gods — seek Odin's blessing"
 nor_events.99.t: "The Birth of the Norwegian Empire"
 nor_events.99.d: "From Iceland to Vinland, from Nidaros to Britain — the Norwegian Empire is finally complete. The descendants of the Vikings have surpassed their ancestors. An empire on a scale even Cnut the Great never dreamed of is born here. 'The North Sea is once again Norway's inner sea' — historians will record this."
 nor_events.99.a: "Long live the Emperor of the Norwegian Empire! Heirs of the Vikings, forever!"
