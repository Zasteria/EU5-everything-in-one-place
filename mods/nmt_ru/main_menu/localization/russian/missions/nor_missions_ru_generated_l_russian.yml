 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Hanseatic Merchants Expelled"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Bergen liberated from German merchant domination — Norwegian merchants master their own harbor."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "North Sea Empire"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "Cnut the Great's North Sea Empire reborn in the modern era. The entire North Sea coast under Norwegian control."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "Norwegian Empire"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "The Norwegian Empire stretching from Iceland to Vinland is complete. Viking heirs surpass their ancestors."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "Steadfast in Faith"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "Unwavering Catholic devotion strengthens Norwegian royal legitimacy."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Winds of Reform"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "Luther's teachings are spreading across Norway."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "Call of the Old Gods"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "Faith in Odin and Thor is secretly reviving."
 nor_expel_danish_nobility: "Counter Denmark"
 nor_expel_danish_nobility_desc: "In 1337, Norway is an independent kingdom in personal union with Sweden under King Magnus Eriksson — not a Danish subject. Denmark is a complex neighbor, and the coming Kalmar Union (1397) risks giving Denmark dominance over Scandinavia. Establish Norway's position in Scandinavia through a clear relationship with Denmark now — whether through rivalry, alliance, or friendship."
 nor_expel_danish_nobility_tooltip: "Denmark (c:DAN) is our rival, or we are allied with Denmark, or Danish opinion 150+, or Denmark doesn't exist"
 nor_secure_bergen_desc: "The Bryggen — those colorful wooden warehouses lining Bergen's wharf are the symbol of Hanseatic merchant prosperity. But Bergen must be a Norwegian city. When the king's authority extends to this harbor, the wealth of North Atlantic trade flows into Norwegian hands."
 nor_develop_stavanger_desc: "Stavanger is an ancient bishop's city on Norway's southwestern coast. As the heart of Rogaland, where cliffs and fjords intertwine, this harbor becomes the hub of herring fishing and North Sea commerce. Develop it as Norway's second great port city after Bergen."
 nor_develop_oslo_desc: "Oslo, sheltered behind the walls of Akershus Fortress, is the southern gateway between Denmark and Sweden. East lies Sweden; south lies Denmark. By developing Oslo into a prosperous city, Norway's southern border is secured and agriculture and commerce begin to flourish."
 nor_secure_nidaros_desc: "Nidaros — this city, built where Saint Olaf fell in martyrdom, stands beneath Scandinavia's greatest Gothic cathedral and carries a thousand years of history as the spiritual center of the northern Christian world. To develop Nidaros is to have the Norwegian king's authority endorsed by both heaven and earth."
 nor_vinland_desc: "A thousand years ago, Leif, son of Erik the Red, set foot on a distant continent beyond the mist — Vinland. Now a colonial nation flying the Norwegian banner carries that dream forward. Norway is inscribed in history as the first European nation to plant roots in the New World."
 nor_colonization_desc: "From Vinland to Greenland, from Iceland to the arctic shores — Norwegian colonial nations spread across the North Atlantic. The spirit of Viking exploration lives on in the modern era, and Norway stands as a true maritime empire commanding the world beyond the seas."
 nor_kingdom_of_britain_desc: "London, York, Edinburgh — the three great cities of the British Isles unified under the Norwegian banner. The dream of Cnut the Great is realized once more. The memory of the Danelaw comes alive in the modern age, and the North Sea becomes Norway's lake."
 nor_arctic_trade_desc: "The Kola Peninsula — a frozen wilderness at the edge of the Arctic — is a treasure trove of furs, game, and walrus ivory. The arctic products brought in by Sami hunters command enormous wealth as the finest furs sought by European nobility. By seizing the Kola Peninsula, Norway becomes the absolute master of Arctic trade."
 nor_arctic_trade_tooltip: "Own 15+ locations in the Kola area (kola_area)"
 nor_timber_industry_desc: "Norway's forests are a gift to shipwrights and builders alike. Spruce, pine, and birch hewn from deep woodland — paired with the iron tools forged to work them — form the industrial backbone of the Norwegian economy. When the smoke of sawmills rises, Norway becomes Northern Europe's greatest timber exporter."
 STATIC_MODIFIER_NAME_nor_timber_mod: "Timber Industry"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Lumber and tools hewn from Norway's rich forests support the industrial foundation."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Arctic Trade"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Furs and game from the Kola Peninsula flow through Norwegian merchants to all of Europe."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "Northern Economy"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "Norwegian commerce built on fisheries, timber, fur, and Arctic trade reaches the highest level in Northern Europe. Merchant maintenance costs are reduced and more trading posts can be established."
