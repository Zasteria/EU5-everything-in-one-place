l_russian:
 brb_brabant_mission_pack: "The Legacy of Lower Lotharingia — Uniting the Low Countries and Absorbing Burgundy"
 brb_brabant_mission_pack_DESCRIPTION: "The Duchy of Brabant, ruled by an independent ducal house — unite the Low Countries, absorb the upstart Duchy of Burgundy ahead of history, and build a true golden age."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION: "Unite the Low Countries, absorb Burgundy, and found a republic to achieve a golden age."
 brb_brabant_mission_pack_BUTTON_TOOLTIP: "From a small duchy to a grand duchy ruling the Low Countries and Burgundy."
 brb_brabant_mission_pack_BUTTON_DETAILS: "'Je Maintiendrai' — reverse history, and plant Brabant's banner across the Low Countries!"
 brb_ducal_authority: "Establish Ducal Authority"
 brb_ducal_authority_desc: "As Duke of the line of Leuven, let your authority reach every corner of the duchy."
 brb_joyous_entry: "The Joyous Entry (Blijde Inkomst)"
 brb_joyous_entry_desc: "The 'Joyous Entry' — the ceremony in which a new Duke passes through the city gates and confirms the towns' privileges — establish this tradition, and grant the cities their own rights."
 brb_joyous_entry_unlock_tt: "The city privilege 'City of the Joyous Entry' becomes available."
 brb_develop_antwerp: "Develop Antwerp"
 brb_develop_antwerp_desc: "Antwerp, the commercial city at the mouth of the Scheldt — develop it further, and cement its status as a hub of North Sea trade."
 brb_unify_brabant: "Unify Brabant"
 brb_unify_brabant_desc: "The Duchy of Brabant, divided between north and south — unite it under a single banner."
 brb_flemish_rivalry: "Rivalry with Flanders"
 brb_flemish_rivalry_desc: "The County of Flanders, known for its rich cloth industry — establish our influence over this old rival."
 brb_hainaut_marriage: "A Marriage with Hainaut-Holland"
 brb_hainaut_marriage_desc: "Hainaut, Holland, and Zeeland, ruled by the House of Wittelsbach — through marriage, alliance, or rivalry alike, secure a claim to this throne."
 brb_liege_relations: "Relations with Liège"
 brb_liege_relations_desc: "The Prince-Bishopric of Liège, wielding vast secular power — through rivalry or marriage ties alike, secure a claim upon this land."
 brb_utrecht_bishopric: "The Bishopric of Utrecht"
 brb_utrecht_bishopric_desc: "The Bishopric of Utrecht, wielding vast secular power — bring it under our influence as a foundation for uniting the Low Countries."
 brb_burgundian_ambition: "Ambitions Toward Burgundy"
 brb_burgundian_ambition_desc: "Having mastered the principal lands of the Low Countries, turn the eye of ambition toward the newly-risen Duchy of Burgundy, held by a cadet branch of the French royal house."
 brb_contest_flanders_inheritance: "Contest the Flanders Inheritance"
 brb_contest_flanders_inheritance_desc: "The marriage of Margaret, heiress of Flanders — win this contested match, and seize Flanders for ourselves before the House of Burgundy can."
 brb_absorb_burgundy: "Absorb Burgundy"
 brb_absorb_burgundy_desc: "Annex or subjugate the upstart Duchy of Burgundy — reverse the tide of history, and prove that Brabant, not Burgundy, is master of the Low Countries."
 brb_valois_brabant: "The Grand Duchy of Brabant"
 brb_valois_brabant_desc: "Having absorbed the Burgundian inheritance, Brabant is no longer a mere duchy — rise as the grand power presiding over the Low Countries."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Brabant, Flanders, Holland, and the absorbed Burgundian inheritance — as master of the principal lands of the Low Countries, maintain this rule."
 brb_hansa_relations: "Hansa Relations"
 brb_hansa_relations_desc: "The Hanseatic League, dominating Baltic trade — rebuild relations with them from a position of equality."
 brb_bulk_trade: "Support the Bulk Trades"
 brb_bulk_trade_desc: "Bulk trade in grain and timber — raise the presence of our merchant fleet in the Baltic."
 brb_baltic_supremacy: "Baltic Trade Supremacy"
 brb_baltic_supremacy_desc: "The master of the northern trade routes is a true commercial power — establish supremacy in Baltic trade."
 brb_land_commercial_empire: "A Land Commercial Empire"
 brb_land_commercial_empire_desc: "Not the sea alone — master the great inland market centers, and claim mastery over overland trade as well."
 brb_secure_grain: "Secure Baltic Grain"
 brb_secure_grain_desc: "The Low Countries have long relied on Baltic grain — take this supply into our own hands."
 brb_reformation_choice: "The Choice of Reformation"
 brb_reformation_choice_desc: "Luther's teachings shake the Low Countries — standing at this crossroads of faith, which path shall we choose?"
 brb_religious_settlement: "A Religious Settlement"
 brb_religious_settlement_desc: "More than a century after the Reformation — now that the state faith holds sway over the vast majority of the populace, bring stable reconciliation between the conflicting faiths."
 brb_spanish_fury: "The Spanish Fury"
 brb_spanish_fury_desc: "Habsburg oppression and heavy taxation — the people's fury against the 'Spanish Fury' can no longer be contained."
 brb_sea_beggars: "The Sea Beggars"
 brb_sea_beggars_desc: "Privateers calling themselves the 'Sea Beggars' — their exploits punch holes in Spain's dominance of the seas."
 brb_eighty_years_war: "The Eighty Years' War"
 brb_eighty_years_war_desc: "A long struggle for independence — endure this Eighty Years' War, and win our freedom."
 brb_united_netherlands: "The United Netherlands"
 brb_united_netherlands_desc: "A federation of seven provinces — establish here a princely confederation under the Grand Duke of Brabant, carrying forward the traditions of nobility and city alike."
 brb_east_india_charter: "The East India Charter"
 brb_east_india_charter_desc: "Grant the charter for founding an East India Company, aiming for a monopoly on Asian trade."
 brb_voc_trade_empire: "The VOC Trade Empire"
 brb_voc_trade_empire_desc: "The 'United East India Company' (VOC) — the world's first joint-stock company spreads its trade network from the Spice Islands across Asia."
 brb_west_india_company: "The West India Company"
 brb_west_india_company_desc: "Trade linking the New World and Africa — found the West India Company, and share in the wealth of the Atlantic."
 brb_golden_age: "The Golden Age"
 brb_golden_age_desc: "Rembrandt, Vermeer, and flourishing commerce — reach the zenith of the 'Dutch Golden Age.'"
 brb_amsterdam_exchange: "The Amsterdam Exchange"
 brb_amsterdam_exchange_desc: "The world's first stock exchange — make Amsterdam the center of European finance."
 brb_form_netherlands: "The Grand Duchy of the Netherlands Complete"
 brb_form_netherlands_desc: "The long road that began with the legacy of Lower Lotharingia and the absorption of Burgundy, through independence and a golden age, reaches completion here as a grand duchy retaining the deep traditions of nobility and the towns."
 brb_wool_staple_calais: "The Calais Wool Staple"
 brb_wool_staple_calais_desc: "English wool, the lifeblood of the Flemish cloth industry — invigorate trade through the wool staple at Calais."
 brb_anglo_dutch_alliance: "The Anglo-Dutch Alliance"
 brb_anglo_dutch_alliance_desc: "England, our neighbor across the Channel — amid the chaos of the Hundred Years' War, cement a firm relationship with this nation, whether through alliance or rivalry."
 brb_english_channel_trade: "Mastery of Channel Trade"
 brb_english_channel_trade_desc: "The Channel linking the North Sea and the Atlantic — establish supremacy in trade across this vital strait."
 brb_valois_suzerainty_dispute: "Disputing Valois Suzerainty"
 brb_valois_suzerainty_dispute_desc: "Nominally a vassal of the French crown — dispute this suzerainty, and demand a position of equality."
 brb_hundred_years_war_intervention: "Intervention in the Hundred Years' War"
 brb_hundred_years_war_intervention_desc: "The long war tearing England and France apart — seize this opportunity to intervene for our own gain."
 brb_somme_towns: "The Towns of the Somme"
 brb_somme_towns_desc: "The rich towns of Picardy — bring the lands along the Somme into our domain."
 brb_end_french_vassalage: "End the French Vassalage"
 brb_end_french_vassalage_desc: "Sever this nominal vassalage entirely, and establish our status as a truly independent grand duchy."
 brb_events.1.t: "The Eighty Years' War Begins"
 brb_events.1.d: "Through the Union of Utrecht and the exploits of the Sea Beggars, the long war with Spain has begun. This struggle will decide our independence."
 brb_events.1.a: "Liberty or death!"
 brb_events.2.t: "Ambitions Toward Burgundy"
 brb_events.2.d: "The upstart Duchy of Burgundy — what path shall we choose regarding its fate?"
 brb_events.2.a: "Pay gold, and welcome them as a vassal"
 brb_events.2.b: "Raise a claim on Dijon, and prepare to take it by force"
 brb_events.2.c: "Watch and wait, for now"
 brb_events.3.t: "Contest the Flanders Inheritance"
 brb_events.3.d: "The succession dispute over Margaret, heiress of Flanders — how shall we secure this rich land for ourselves?"
 brb_events.3.a: "Pay gold, and welcome them as a vassal"
 brb_events.3.b: "Raise a claim on Bruges, and prepare to take it by force"
 brb_events.3.c: "Watch and wait, for now"
 brb_events.99.t: "Declaration of the Grand Duchy of the Netherlands"
 brb_events.99.d: "The small duchy that inherited Lower Lotharingia and absorbed Burgundy has been reborn, through independence and a golden age, as a grand duchy under the House of Brabant, retaining the deep traditions of nobility and the towns."
 brb_events.99.a: "Glory to the Grand Duchy!"
