l_russian:
 brb_brabant_mission_pack: "Наследие Нижней Лотарингии — объединение Нидерландов и поглощение Бургундии"
 brb_brabant_mission_pack_DESCRIPTION: "Герцогство Брабант, где правит собственный герцогский дом. Объедините Нидерланды, поглотите выскочку-герцогство Бургундию раньше, чем это случилось в истории, и постройте подлинный золотой век."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION: "Объедините Нидерланды, поглотите Бургундию и учредите республику, чтобы достичь золотого века."
 brb_brabant_mission_pack_BUTTON_TOOLTIP: "От малого герцогства — к великому герцогству, правящему Нидерландами и Бургундией."
 brb_brabant_mission_pack_BUTTON_DETAILS: "«Je Maintiendrai» («Я выстою») — переверните историю и поднимите знамя Брабанта над всеми Нидерландами!"
 brb_ducal_authority: "Утвердить власть герцога"
 brb_ducal_authority_desc: "Как герцог Лёвенского дома, пусть ваша власть дойдёт до каждого уголка герцогства."
 brb_joyous_entry: "Радостный въезд (Blijde Inkomst)"
 brb_joyous_entry_desc: "«Радостный въезд» — обряд, при котором новый герцог проходит в городские ворота и подтверждает привилегии городов. Утвердите эту традицию и даруйте городам их собственные права."
 brb_joyous_entry_unlock_tt: "Становится доступно городское право «Город Радостного въезда»."
 brb_develop_antwerp: "Развить Антверпен"
 brb_develop_antwerp_desc: "Антверпен, торговый город в устье Шельды. Развивайте его дальше и закрепите за ним место узла торговли на Северном море."
 brb_unify_brabant: "Объединить Брабант"
 brb_unify_brabant_desc: "Герцогство Брабант разделено на север и юг — объедините его под одним знаменем."
 brb_flemish_rivalry: "Соперничество с Фландрией"
 brb_flemish_rivalry_desc: "Графство Фландрия, славное своим богатым суконным делом. Утвердите своё влияние над этим старым соперником."
 brb_hainaut_marriage: "Брак с Эно-Голландией"
 brb_hainaut_marriage_desc: "Эно, Голландия и Зеландия под властью дома Виттельсбахов. Браком, союзом или соперничеством — добудьте притязание на этот престол."
 brb_liege_relations: "Отношения с Льежем"
 brb_liege_relations_desc: "Льежское княжество-епископство обладает огромной светской властью. Соперничеством или брачными узами — добудьте притязание на эту землю."
 brb_utrecht_bishopric: "Утрехтское епископство"
 brb_utrecht_bishopric_desc: "Утрехтское епископство обладает огромной светской властью. Подчините его своему влиянию как основу для объединения Нидерландов."
 brb_burgundian_ambition: "Виды на Бургундию"
 brb_burgundian_ambition_desc: "Овладев главными землями Нидерландов, обратите честолюбивый взор на недавно возвысившееся герцогство Бургундию, которым владеет младшая ветвь французского королевского дома."
 brb_contest_flanders_inheritance: "Спор о фландрском наследстве"
 brb_contest_flanders_inheritance_desc: "Брак Маргариты, наследницы Фландрии. Выиграйте эту спорную партию и заберите Фландрию себе раньше Бургундского дома."
 brb_absorb_burgundy: "Поглотить Бургундию"
 brb_absorb_burgundy_desc: "Присоедините или подчините выскочку-герцогство Бургундию. Поверните ход истории вспять и докажите, что хозяин Нидерландов — Брабант, а не Бургундия."
 brb_valois_brabant: "Великое герцогство Брабант"
 brb_valois_brabant_desc: "Поглотив бургундское наследство, Брабант больше не просто герцогство — поднимитесь как великая держава, стоящая над Нидерландами."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Брабант, Фландрия, Голландия и поглощённое бургундское наследство. Как хозяин главных земель Нидерландов, удержите эту власть."
 brb_hansa_relations: "Отношения с Ганзой"
 brb_hansa_relations_desc: "Ганзейский союз господствует в балтийской торговле. Выстройте отношения с ним заново — на равных."
 brb_bulk_trade: "Поддержать торговлю навалочными грузами"
 brb_bulk_trade_desc: "Торговля зерном и лесом навалом — усильте присутствие нашего торгового флота на Балтике."
 brb_baltic_supremacy: "Первенство в балтийской торговле"
 brb_baltic_supremacy_desc: "Хозяин северных торговых путей — подлинная торговая держава. Утвердите первенство в балтийской торговле."
 brb_land_commercial_empire: "Сухопутная торговая держава"
 brb_land_commercial_empire_desc: "Не одно лишь море: овладейте великими внутренними рынками и утвердите своё господство и в сухопутной торговле."
 brb_secure_grain: "Обеспечить балтийское зерно"
 brb_secure_grain_desc: "Нидерланды давно живут балтийским зерном — возьмите этот подвоз в свои руки."
 brb_reformation_choice: "Выбор Реформации"
 brb_reformation_choice_desc: "Учение Лютера сотрясает Нидерланды. На этом распутье веры — какой путь мы выберем?"
 brb_religious_settlement: "Религиозное примирение"
 brb_religious_settlement_desc: "Прошло больше века после Реформации. Теперь, когда государственную веру исповедует подавляющее большинство населения, принесите прочное примирение враждующим вероисповеданиям."
 brb_spanish_fury: "Испанская ярость"
 brb_spanish_fury_desc: "Гнёт Габсбургов и тяжёлые налоги — народный гнев против «Испанской ярости» больше не сдержать."
 brb_sea_beggars: "Морские гёзы"
 brb_sea_beggars_desc: "Каперы, называющие себя «морскими гёзами», — их набеги пробивают бреши в испанском господстве на морях."
 brb_eighty_years_war: "Восьмидесятилетняя война"
 brb_eighty_years_war_desc: "Долгая борьба за независимость. Выдержите эту Восьмидесятилетнюю войну и завоюйте свободу."
 brb_united_netherlands: "Соединённые Нидерланды"
 brb_united_netherlands_desc: "Союз семи провинций. Учредите здесь княжескую конфедерацию во главе с великим герцогом Брабанта, продолжающую традиции и знати, и городов."
 brb_east_india_charter: "Ост-Индская хартия"
 brb_east_india_charter_desc: "Выдайте хартию на основание Ост-Индской компании, нацеленной на монополию в азиатской торговле."
 brb_voc_trade_empire: "Торговая держава VOC"
 brb_voc_trade_empire_desc: "«Объединённая Ост-Индская компания» (VOC) — первое в мире акционерное общество раскидывает свою торговую сеть от Островов Пряностей по всей Азии."
 brb_west_india_company: "Вест-Индская компания"
 brb_west_india_company_desc: "Торговля, связывающая Новый Свет и Африку. Основайте Вест-Индскую компанию и получите свою долю атлантических богатств."
 brb_golden_age: "Золотой век"
 brb_golden_age_desc: "Рембрандт, Вермеер и цветущая торговля — достигните вершины «Золотого века Нидерландов»."
 brb_amsterdam_exchange: "Амстердамская биржа"
 brb_amsterdam_exchange_desc: "Первая в мире фондовая биржа — сделайте Амстердам средоточием европейских финансов."
 brb_form_netherlands: "Великое герцогство Нидерланды создано"
 brb_form_netherlands_desc: "Долгий путь, начатый наследием Нижней Лотарингии и поглощением Бургундии, через независимость и золотой век завершается здесь — великим герцогством, хранящим глубокие традиции знати и городов."
 brb_wool_staple_calais: "Шерстяной стапель в Кале"
 brb_wool_staple_calais_desc: "Английская шерсть — кровь фламандского суконного дела. Оживите торговлю через шерстяной стапель в Кале."
 brb_anglo_dutch_alliance: "Англо-нидерландский союз"
 brb_anglo_dutch_alliance_desc: "Англия, наш сосед за Ла-Маншем. В хаосе Столетней войны скрепите прочные отношения с этой страной — союзом ли, соперничеством ли."
 brb_english_channel_trade: "Господство в торговле Ла-Манша"
 brb_english_channel_trade_desc: "Ла-Манш соединяет Северное море с Атлантикой. Утвердите первенство в торговле через этот важнейший пролив."
 brb_valois_suzerainty_dispute: "Оспорить сюзеренитет Валуа"
 brb_valois_suzerainty_dispute_desc: "Номинально мы вассал французской короны. Оспорьте этот сюзеренитет и потребуйте положения равного."
 brb_hundred_years_war_intervention: "Вмешательство в Столетнюю войну"
 brb_hundred_years_war_intervention_desc: "Долгая война раздирает Англию и Францию. Воспользуйтесь случаем и вмешайтесь ради собственной выгоды."
 brb_somme_towns: "Города на Сомме"
 brb_somme_towns_desc: "Богатые города Пикардии — присоедините земли вдоль Соммы к своим владениям."
 brb_end_french_vassalage: "Покончить с французским вассалитетом"
 brb_end_french_vassalage_desc: "Разорвите этот номинальный вассалитет окончательно и утвердите своё положение подлинно независимого великого герцогства."
 brb_events.1.t: "Начало Восьмидесятилетней войны"
 brb_events.1.d: "Утрехтская уния и набеги морских гёзов положили начало долгой войне с Испанией. В этой борьбе решится наша независимость."
 brb_events.1.a: "Свобода или смерть!"
 brb_events.2.t: "Виды на Бургундию"
 brb_events.2.d: "Выскочка-герцогство Бургундия — какой путь мы изберём в её судьбе?"
 brb_events.2.a: "Заплатить золотом и принять её вассалом"
 brb_events.2.b: "Заявить притязание на Дижон и готовиться взять его силой"
 brb_events.2.c: "Пока выжидать и наблюдать"
 brb_events.3.t: "Спор о фландрском наследстве"
 brb_events.3.d: "Спор о наследстве Маргариты, наследницы Фландрии. Как нам закрепить за собой эту богатую землю?"
 brb_events.3.a: "Заплатить золотом и принять её вассалом"
 brb_events.3.b: "Заявить притязание на Брюгге и готовиться взять его силой"
 brb_events.3.c: "Пока выжидать и наблюдать"
 brb_events.99.t: "Провозглашение великого герцогства Нидерланды"
 brb_events.99.d: "Малое герцогство, унаследовавшее Нижнюю Лотарингию и поглотившее Бургундию, через независимость и золотой век возродилось великим герцогством под властью Брабантского дома, хранящим глубокие традиции знати и городов."
 brb_events.99.a: "Слава великому герцогству!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Власть герцога утверждена"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "Власть герцога повышает легитимность государства."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Антверпен в наших руках"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "Торговый город Антверпен процветает."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Брабант объединён"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Единый Брабант быстрее присоединяет завоёванные земли."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Соперничество с Фландрией"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Влияние на Фландрию повышает налоговый доход."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "Утрехтское епископство"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Присоединение епископства повышает веротерпимость."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Бургундия поглощена"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "Поглощённое бургундское наследство повышает налоговый доход и дипломатический престиж."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "Объединение Нидерландов укрепляет дисциплину и развитие."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Отношения с Ганзой"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Улучшенные отношения с Ганзой приносят торговые богатства."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Навалочная торговля поддержана"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Расширенная навалочная торговля ускоряет постройку кораблей."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Первенство в балтийской торговле"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "Первенство на Балтике сильно умножает торговые богатства."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "Сухопутная торговая держава"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Власть над внутренней торговой сетью повышает действенность сухопутной торговли."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Балтийское зерно обеспечено"
 STATIC_MODIFIER_DESC_brb_grain_mod: "Надёжный подвоз зерна повышает возможности мобилизации."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "Выбор Реформации"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Выбор веры повысил терпимость к еретикам."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Религиозное примирение"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Религиозное примирение приносит внутреннюю стабильность."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "Испанская ярость"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "Народный гнев поднимает боевой дух войск."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Морские гёзы"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "Набеги каперов поднимают боевой дух флота."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Соединённые Нидерланды"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Основание княжеской конфедерации подняло престиж державы."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "Ост-Индская хартия"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Выданная хартия расширяет досягаемость наших колоний."
 STATIC_MODIFIER_NAME_brb_voc_mod: "Торговая держава VOC"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Торговая сеть VOC повышает верность подданных."
 STATIC_MODIFIER_NAME_brb_wic_mod: "Вест-Индская компания"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Богатства атлантической торговли приносят рост населения."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "Золотой век"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "Расцвет культуры и торговли приносит державе процветание."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "Амстердамская биржа"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Амстердам, средоточие финансов, процветает."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "Шерстяной стапель в Кале"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "Оживлённая торговля шерстью приносит торговые богатства."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "Англо-нидерландский союз"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "Союз с Англией поднимает дипломатический престиж."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Господство в торговле Ла-Манша"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "Господство в торговле Ла-Манша расширяет размах торговли."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Спор о сюзеренитете Валуа"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Спор о сюзеренитете поднимает боевой дух войск."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Вмешательство в Столетнюю войну"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Опыт вмешательства улучшает успехи на поле боя."
 STATIC_MODIFIER_NAME_brb_somme_mod: "Города на Сомме"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Добытые города улучшают успехи на поле боя."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Конец французского вассалитета"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Подлинная независимость повышает легитимность и дипломатический престиж."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "Нидерландская республика создана"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "Создание подлинной республики привело и торговлю, и престиж к вершине."
