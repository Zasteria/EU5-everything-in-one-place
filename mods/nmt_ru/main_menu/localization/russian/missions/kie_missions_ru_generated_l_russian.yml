l_russian:
 kie_kyiv_mission_pack: "Воссоединение Руси и владыка казаков"
 kie_kyiv_mission_pack_DESCRIPTION: "В 1337 году Киевское княжество — небольшое государство, зажатое между Литвой и татарами. Но когда-то Киев сиял как сердце Киевской Руси: Святая София, Печерская лавра и Золотые ворота до сих пор говорят о его славе. Объедините Левобережную и Правобережную Украину, завоюйте Галицию и Волынь, разбейте татар силой казачьего войска, образуйте Рутению и царствуйте как Великое княжество."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION: "Воссоедините Русь, учредите Казачий гетманат, станьте хранителем православия, образуйте Рутению и царствуйте как Великое княжество Киевское."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP: "Царствуйте над всей Русью как Великое княжество Киевское."
 kie_kyiv_mission_pack_BUTTON_DETAILS: "Соберите раздробленную Русь вокруг Киева — возьмите степь казачьей саблей!"
 kie_restore_kyiv: "Возродить Киев"
 kie_restore_kyiv_desc: "Киев 1337 года — некогда золотой город Киевской Руси, опустошённый монгольским нашествием 1240 года. Святая София и Печерская лавра ещё напоминают о былой славе. Верните «матери городов русских» величие."
 kie_dev_kyiv: "Развить Киев"
 kie_dev_kyiv_desc: "Важнейший перекрёсток волховского и днепровского торговых путей — сделайте Киев средоточием торговли, культуры и политики."
 kie_secure_left_bank: "Укрепить власть на Левобережной Украине"
 kie_secure_left_bank_desc: "Укрепите власть над Левобережной Украиной — берегите культурные традиции Руси и умелым управлением сделайте эти богатые пашни опорой Киева."
 kie_secure_right_bank: "Укрепить власть на Правобережной Украине"
 kie_secure_right_bank_desc: "Укрепите власть над Правобережной Украиной — распространением украинской культуры и усилением власти правителя сделайте её исконной землёй Киева."
 kie_conquer_chernihiv: "Черниговский поход"
 kie_conquer_chernihiv_desc: "Завоюйте Чернигов, древний город русских княжеств, и закрепите власть над Левобережной Украиной."
 kie_conquer_pereyaslavl: "Подчинить Переяславль"
 kie_conquer_pereyaslavl_desc: "—"
 kie_conquer_poltava: "Поход на Полтаву"
 kie_conquer_poltava_desc: "Покорите казачью твердыню Полтаву и откройте путь на Слободскую Украину."
 kie_kyiv_metropolitan: "Киевская митрополия"
 kie_kyiv_metropolitan_desc: "Учредите Киевскую митрополию, независимую от Константинополя, как средоточие Русской православной церкви."
 kie_unite_rus: "Воссоединение Руси"
 kie_unite_rus_desc: "Соберите вокруг Киева русские княжества, раздробленные монгольским нашествием. «Мать городов русских» снова засияет как сердце всей Украины."
 kie_secure_volhynia: "Закрепиться на Волыни"
 kie_secure_volhynia_desc: "Закрепитесь на Волыни, на рубеже Руси и Польши, и утвердите влияние на западе."
 kie_conquer_lutsk: "Луцкий поход"
 kie_conquer_lutsk_desc: "Возьмите Луцк, ключевой город Волыни, и сделайте его плацдармом на запад."
 kie_conquer_galicia: "Вторжение в Галицию"
 kie_conquer_galicia_desc: "Вторгнитесь в Галицию — завоевав этот край, вы установите полную власть над западной Украиной."
 kie_conquer_halych: "Завоевание Галича"
 kie_conquer_halych_desc: "Завоюйте Галич, бывшую столицу Галицко-Волынского княжества, и утвердитесь как законный наследник Руси."
 kie_red_ruthenia: "Подчинить Червонную Русь"
 kie_red_ruthenia_desc: "Подчините Червонную Русь — покорив этот край вокруг Львова, вы завершите объединение западной Украины."
 kie_conquer_lviv: "Взять Львов"
 kie_conquer_lviv_desc: "«Город льва» Львов — завоюйте этот торговый город, основанный князем Даниилом, и возьмите в руки западную торговлю."
 kie_conquer_podolia: "Наступление в Подолье"
 kie_conquer_podolia_desc: "Наступайте в Подолье — завоюйте этот хлебный край Правобережья и обеспечьте путь к черноморскому побережью."
 kie_conquer_vinnytsia: "Занятие Винницы"
 kie_conquer_vinnytsia_desc: "Возьмите Винницу и создайте хлебную опору Правобережной Украины."
 kie_conquer_polesia: "Полесский поход"
 kie_conquer_polesia_desc: "Завоюйте болотистое Полесье — создайте северный оборонительный рубеж."
 kie_conquer_minsk: "Взять Минск"
 kie_conquer_minsk_desc: "Возьмите Минск, средоточие Белой Руси, и расширьте влияние на север."
 kie_cossack_host: "Учредить казачье войско"
 kie_cossack_host_desc: "Казаки собираются под знамёна Киева — включите воинскую традицию запорожского казачества в регулярную армию и создайте лучшую конницу Руси."
 kie_zaporizhzhia: "Запорожская Сечь"
 kie_zaporizhzhia_desc: "Постройте крепость Запорожской Сечи за днепровскими порогами как оплот степной обороны."
 kie_tatar_wars: "Войны с татарами"
 kie_tatar_wars_desc: "Дайте решающий бой крымским татарам, владеющим северным Причерноморьем. Противопоставьте им казачью конницу и верните украинскую степь."
 kie_black_sea_steppe: "Завоевать причерноморскую степь"
 kie_black_sea_steppe_desc: "Овладейте Понтийской степью — эти бескрайние просторы сделают Киев хозяином северного Причерноморья."
 kie_conquer_crimea: "Завоевание Крыма"
 kie_conquer_crimea_desc: "Завоюйте полуостров Крымского ханства и утвердите господство на Чёрном море. Возьмите генуэзскую факторию Кафу."
 kie_black_sea_coast: "Создать Черноморский флот"
 kie_black_sea_coast_desc: "Спускайтесь по Днепру к Чёрному морю на быстрых казачьих «чайках» — бросьте вызов Османам и овладейте черноморским торговым путём."
 kie_kyiv_pechersk: "Киево-Печерская лавра"
 kie_kyiv_pechersk_desc: "Киево-Печерская лавра (Пещерный монастырь), основанная в 1051 году, — духовное сердце Русской православной церкви. Развивайте эту обитель и провозгласите Киев средоточием православия."
 kie_orthodox_revival: "Возрождение православия"
 kie_orthodox_revival_desc: "Восстановите Русскую православную церковь, разорённую монгольским нашествием, — стройте соборы по всей земле и возродите «Святую Русь»."
 kie_grain_breadbasket: "Украина — житница Европы"
 kie_grain_breadbasket_desc: "Плодородный чернозём — богатые пашни Украины, которую зовут «житницей Европы». Выжмите из них всё и упрочьте продовольственную основу державы."
 kie_trade_routes: "Торговые пути Киева"
 kie_trade_routes_desc: "«Путь из варяг в греки», связавший Балтику с Чёрным морем, — возродите этот древний торговый путь, на котором держалось процветание Киева."
 kie_hetmanate: "Казачий гетманат"
 kie_hetmanate_desc: "Гетман — учредив Казачий гетманат, Киев станет государством со своим военно-политическим устройством. Опередите великое свершение Богдана Хмельницкого 1648 года."
 kie_literacy_culture: "Развивать грамотность и культуру"
 kie_literacy_culture_desc: "Книжная традиция Киева — как первопроходец монастырской рукописной культуры и соборных школ, развивайте просвещение."
 kie_dev_lviv_trade: "Торговый центр Львова"
 kie_dev_lviv_trade_desc: "—"
 kie_conquer_zhytomyr: "Развить Житомир"
 kie_conquer_zhytomyr_desc: "Сделайте Житомир, ключевой пункт Правобережной Украины, важным опорным городом с достойными постройками."
 kie_salt_of_galicia: "Соль Галиции"
 kie_salt_of_galicia_desc: "Соляные копи Галиции — овладейте краем, где добывают это «белое золото», и обеспечьте надёжный запас ценного товара."
 kie_dev_poltava: "Развить Полтаву"
 kie_dev_poltava_desc: "Сделайте Полтаву, ключевой город казачьего Левобережья, восточным передовым оплотом."
 kie_beyond_donets: "За Донцом"
 kie_beyond_donets_desc: "Слободская Украина — поселите казаков-земледельцев вдоль Донца и освойте восточную степь."
 kie_conquer_moldavia: "Вторжение в Молдавию"
 kie_conquer_moldavia_desc: "Завоюйте Молдавию на черноморском побережье и полноценно войдите в черноморскую торговлю."
 kie_amber_route: "Янтарный путь"
 kie_amber_route_desc: "Древний янтарный путь с Балтики через Луцк и Львов на юг — становой хребет рутенской торговой сети."
 kie_fortress_line: "Засечная черта"
 kie_fortress_line_desc: "Линия крепостей против степной угрозы — оборонительная система от Запорожья до Подолья защищает украинских земледельцев и города."
 kie_conquer_kamianets: "Подчинить Каменец"
 kie_conquer_kamianets_desc: "—"
 kie_great_kyiv: "Великий Киев"
 kie_great_kyiv_desc: "Верните Киеву величие, каким он был до монгольского нашествия, — отстройте его великолепным городом, вернув золотым куполам былой блеск."
 kie_ruthenian_culture: "Рутенское самосознание"
 kie_ruthenian_culture_desc: "Утвердите самобытную культуру украинской Рутении — где сливаются украинский язык, казачий уклад и православная вера."
 kie_dev_chernihiv: "Развить Чернигов"
 kie_dev_chernihiv_desc: "Сделайте Чернигов средоточием культуры и торговли Левобережной Украины."
 kie_conquer_wallachia: "Наступление в Валахию"
 kie_conquer_wallachia_desc: "Валахия на Дунае — завоюйте этот край как плацдарм на Балканы и завершите власть над черноморским побережьем."
 kie_grain_export: "Расширение хлебного вывоза"
 kie_grain_export_desc: "—"
 kie_cossack_cavalry: "Отборная казачья конница"
 kie_cossack_cavalry_desc: "Казачья конница — сделайте лёгкие и тяжёлые сотни отборными частями. Сокрушите татар их подвижностью и боевой мощью."
 kie_kyiv_academy: "Киево-Могилянская академия"
 kie_kyiv_academy_desc: "Откройте Киево-Могилянскую академию раньше 1632 года — один из старейших университетов Восточной Европы. Осуществите умственное и культурное возрождение Руси."
 kie_conquer_krakow: "Взять Краков"
 kie_conquer_krakow_desc: "Краков, историческая столица Польского королевства, — завоевав этот город с Вавельским замком, вы сильно расширите влияние в Центральной Европе."
 kie_navy_dnipro: "Днепровский флот"
 kie_navy_dnipro_desc: "Спускайтесь по Днепру к Чёрному морю на казачьих парусных «чайках» — днепровский флот охраняет черноморскую торговлю."
 kie_pacify_tatars: "Усмирить татар"
 kie_pacify_tatars_desc: "—"
 kie_protect_orthodoxy: "Защитник православия"
 kie_protect_orthodoxy_desc: "После падения Константинополя Киев становится хранителем православного мира — утвердите высшую власть Русской православной церкви."
 kie_conquer_vilnius: "Занятие Вильнюса"
 kie_conquer_vilnius_desc: "Вильнюс, столица Великого княжества Литовского, — заняв этот город, вы положите конец владычеству Литвы над Русью."
 kie_western_alliance: "Союз с Западом"
 kie_western_alliance_desc: "Наладьте дипломатические отношения с Польшей, Венгрией и Священной Римской империей и создайте западный союз против угроз с востока."
 kie_silver_route: "Серебряный путь"
 kie_silver_route_desc: "Восточное серебро течёт на запад через Киев по Днепру — утвердите место Киева в международной торговле."
 kie_ruthenian_army: "Реформа рутенского войска"
 kie_ruthenian_army_desc: "Соедините казачью традицию с западным военным делом — рутенское войско станет лучшей армией Восточной Европы."
 kie_conquer_warsaw: "Взять Варшаву"
 kie_conquer_warsaw_desc: "Варшава, столица Польши, — завершите долгую борьбу с Речью Посполитой."
 kie_beeswax_honey: "Торговля воском и мёдом"
 kie_beeswax_honey_desc: "Украинский пчелиный воск — ходовой товар для православных храмов и западноевропейских рынков."
 kie_dev_zhytomyr: "Развить город Житомир"
 kie_dev_zhytomyr_desc: "—"
 kie_form_ruthenia: "Образовать Рутению"
 kie_form_ruthenia_desc: "Провозгласите образование державы «Рутения», охватывающей Украину, Белоруссию и запад России. Мечта о единстве Руси, жившая со времён монгольского нашествия, наконец сбылась."
 kie_grand_principality: "Великое княжество Киевское"
 kie_grand_principality_desc: "«Великое княжество Киевское» — этот титул являет славу древней Киевской Руси. Киев, где сливаются казачья сила, власть православной церкви и рутенская культура, царствует как великая держава Восточной Европы."
 kie_events.1.t: "Киев пробуждается — возрождение матери городов русских"
 kie_events.1.d: "Над холмами вдоль Днепра в киевском небе сияют золотые купола Святой Софии.

В 1337 году Киевское княжество невелико, но несёт на себе вес истории как сердце Киевской Руси. «Мать городов русских» — этот титул определяет предназначение Киева.

Литва, Польша и татары теснят со всех сторон, но Киев держится щедростью Днепра, плодородным чернозёмом и казачьим духом.

Монахи Печерской лавры молятся: «Восстань вновь, Русь». Ответьте на эту молитву."
 kie_events.1.a: "Вернём Киеву славу!"
 kie_events.10.t: "Воссоединение Руси — Киев снова в центре"
 kie_events.10.d: "Левобережная и Правобережная Украина, Чернигов и Переяславль — исконные земли Киевской Руси собрались под знамёнами Киева. Через сто лет после монгольского нашествия русские люди «возвращаются к Киеву»."
 kie_events.10.a: "Да здравствует воссоединённая Русь! Да здравствует Киев!"
 kie_events.20.t: "Провозглашение Казачьего гетманата"
 kie_events.20.d: "Запорожские казаки выстраиваются под гетманским стягом — великий князь Киевский официально включает казачью силу в устройство государства и провозглашает «Казачий гетманат». Это самобытное военное государство определит будущее Рутении."
 kie_events.20.a: "Да здравствует Казачий гетманат! Да здравствует вольная Украина!"
 kie_events.60.t: "Образование Рутении — новая держава Восточной Европы"
 kie_events.60.d: "Украина, Белоруссия и Галиция под одним знаменем — единое восточнославянское государство «Рутения» встаёт как новая великая держава Восточной Европы. Все народы Руси собираются под золотыми куполами Киева."
 kie_events.60.a: "Да здравствует Рутения! Да здравствует Киев!"
 kie_events.99.t: "Великое княжество Киевское — возрождение славы Руси"
 kie_events.99.d: "«Великое княжество Киевское» — этот титул звучит по берегам Днепра. Держава, где сливаются казачья сила, власть православной церкви и рутенская культура, царствует над Восточной Европой. Киевская Русь, погубленная монголами, возродилась в новом облике — мать городов русских, Киев, снова сияет."
 kie_events.99.a: "Да здравствует Великое княжество Киевское! Вечная слава Руси!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Золотой город на Днепре"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Киев отстроен в великий город, достойный звания «матери городов русских»."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Левобережная Украина закреплена"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Левобережная Украина закреплена — восточный берег Днепра под властью Киева."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Правобережная Украина закреплена"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Правобережная Украина закреплена — западный берег Днепра соединён с восточным."
 STATIC_MODIFIER_NAME_kie_chernihiv_mod: "Оплот Левобережья"
 STATIC_MODIFIER_DESC_kie_chernihiv_mod: "Чернигов служит восточным оплотом Левобережной Украины."
 STATIC_MODIFIER_NAME_kie_pereyaslavl_mod: "Переяславль подчинён"
 STATIC_MODIFIER_DESC_kie_pereyaslavl_mod: "Переяславль подчинён, и Владимирский край переходит под влияние Киева."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Казачья твердыня взята"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "Казачья твердыня Полтава в наших руках — степное пограничье успокоено."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Сердце русского православия"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "Киевская митрополия восстановлена как сердце русского православия."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Житница Волыни"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "Плодородные равнины Волыни становятся житницей Киевского государства."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Ключ к Западной Руси"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Луцк — ключ к Западной Руси — в наших руках, путь в Галицию открыт."
