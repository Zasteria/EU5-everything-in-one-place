l_russian:
 mos_moscow_mission_pack: "From Tatar Yoke to Autocrat of All Russias"
 mos_moscow_mission_pack_DESCRIPTION: "In 1337, the Grand Duchy of Moscow is a small principality under the rule of the Golden Horde. Through Ivan I Kalita's shrewd accumulation of wealth and diplomatic skill with the Tatars, Moscow has steadily grown. But Novgorod, Tver, and Lithuania surround it, while the Tatar threat continues from the south. Break the Tatar yoke, unify the Russian principalities, proclaim yourself Tsar, reign as the Third Rome, and become the Autocrat of All Russias — ruler to the ends of Siberia."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION: "Break the Tatar yoke, conquer Kazan, Astrakhan, and Novgorod to unify Russia, claim the Tsar title, become the Third Rome, and conquer Siberia."
 mos_moscow_mission_pack_BUTTON_TOOLTIP: "Become the Autocrat of All Russias."
 mos_moscow_mission_pack_BUTTON_DETAILS: "From the Grand Duchy of Moscow to the Russian Empire — fulfill historical destiny!"
 mos_rally_the_army: "Mobilize the Army"
 mos_rally_the_army_desc: "In 1337, the Grand Duchy of Moscow has steadily grown through Ivan I Kalita's shrewd skill. Prepare the army and begin expanding Moscow's dominance over the Rus principalities."
 mos_break_tatar_yoke: "Break the Tatar Yoke"
 mos_break_tatar_yoke_desc: "Since 1237, Tatar tribute and submission has oppressed Russia. The memory of Dmitry Donskoy's victory at Kulikovo lives on. Declare full independence and break the Tatar yoke forever."
 mos_conquer_kazan: "Conquest of Kazan"
 mos_conquer_kazan_desc: "The Khanate of Kazan controls the Volga trade route. Its conquest gives Moscow mastery of the great river — anticipate Ivan the Terrible's 1552 victory."
 mos_subjugate_kazan: "Subjugate the Middle Volga"
 mos_subjugate_kazan_desc: "Following Kazan's conquest, seize the middle Volga basin — Samara and Tambov — to open the road south."
 mos_conquer_astrakhan: "Conquest of Astrakhan"
 mos_conquer_astrakhan_desc: "The Khanate of Astrakhan controls the lower Volga delta. Conquer it to establish Caspian Sea access and the eastern trade route."
 mos_destroy_hordes: "Destruction of the Hordes"
 mos_destroy_hordes_desc: "Dismantle the Tatar successor states including the Nogai Horde and open the road to the steppe."
 mos_claim_steppes: "Claim the Steppes"
 mos_claim_steppes_desc: "Seize the Pontic Steppe of the northern Black Sea coast to reveal Moscow's shape as a great continental empire."
 mos_black_sea_access: "Access to the Azov Sea"
 mos_black_sea_access_desc: "Advance to the Azov Sea to establish access to Black Sea trade — get ahead of Peter the Great's 1696 capture of Azov."
 mos_conquer_crimea: "Conquest of Crimea"
 mos_conquer_crimea_desc: "Conquer the Crimean Khanate to establish Black Sea mastery — anticipate Catherine the Great's 1783 annexation."
 mos_consolidate_russia: "Consolidation of Russia"
 mos_consolidate_russia_desc: "With Moscow as the center, consolidate the Russian principalities into a single powerful state foundation."
 mos_dev_moscow: "Development of the Kremlin"
 mos_dev_moscow_desc: "Develop the Moscow Kremlin — the symbol of Russian power. The great cathedrals filling this sacred precinct become the heart of the Russian Empire."
 mos_conquer_novgorod: "Conquest of Novgorod"
 mos_conquer_novgorod_desc: "Novgorod — once Russia's greatest commercial city-state. Realize Ivan III's decisive 1478 conquest even earlier."
 mos_conquer_tver: "Conquest of Tver"
 mos_conquer_tver_desc: "Tver, once Moscow's rival — its power has waned. Conquer this key Volga city to advance Rus unification."
 mos_conquer_ryazan: "Subjugation of Ryazan"
 mos_conquer_ryazan_desc: "Ryazan, first devastated by the Mongols in 1237 — conquer its southern steppe and build a defensive line."
 mos_conquer_smolensk: "Conquest of Smolensk"
 mos_conquer_smolensk_desc: "Smolensk, the 'Key of Russia' — control this east-west crossroads to establish western influence."
 mos_conquer_ruthenia: "Conquest of Ruthenia"
 mos_conquer_ruthenia_desc: "White Ruthenia — conquer the Lithuanian-controlled region centered on Minsk and establish pan-Slavic dominance."
 mos_window_on_west: "Window on the West"
 mos_window_on_west_desc: "Seize Viborg and Karelia to open the 'window to the west' — anticipate Peter the Great's dream of western access."
 mos_baltic_ambition: "Baltic Ambitions"
 mos_baltic_ambition_desc: "The Baltic east coast controlled by the Livonian Order — subjugating this region enables entry into North European trade."
 mos_conquer_riga: "Conquest of Riga"
 mos_conquer_riga_desc: "Riga, linchpin of the Hanseatic League — conquer this Baltic trade center to access the North European trade network."
 mos_partition_poland: "Partition of Poland"
 mos_partition_poland_desc: "Put an end to the long struggle with the Polish-Lithuanian Commonwealth over Ruthenia and eastern Europe."
 mos_metropolitan_see: "Metropolitan See of Moscow"
 mos_metropolitan_see_desc: "In 1448 Moscow established an independent church metropolitanate. This Orthodox authority supports Moscow's political legitimacy."
 mos_land_of_churches: "Land of Churches"
 mos_land_of_churches_desc: "'Holy Russia' — build Orthodox cathedrals throughout the land and consecrate Russia as God's kingdom."
 mos_tsar_title: "The Tsar's Title"
 mos_tsar_title_desc: "'Tsar (Emperor)' — Ivan IV formally adopted this title in 1547. Declare authority as successor to Rome and gain recognition as a European power."
 mos_russian_patriarchate: "The Russian Patriarchate"
 mos_russian_patriarchate_desc: "The Moscow Patriarchate, established in 1589, independent from Constantinople — consolidate the religious foundation of the 'Third Rome'."
 mos_guardian_orthodoxy: "Guardian of Orthodoxy"
 mos_guardian_orthodoxy_desc: "After Constantinople fell to the Ottomans in 1453, Russia becomes guardian of Orthodox faith. Build an Orthodox network across the land."
 mos_conquer_constantinople: "Conquest of Constantinople"
 mos_conquer_constantinople_desc: "Reclaim the Orthodox holy city of Constantinople from Ottoman hands — fulfill the mission of the 'Third Rome' and rewrite history."
 mos_third_rome: "The Third Rome"
 mos_third_rome_desc: "'Moscow is the Third Rome, and there shall be no fourth' — the words of monk Philotheus become reality. Moscow reigns as the spiritual center of the Christian world."
 mos_march_caucasus: "March to the Caucasus"
 mos_march_caucasus_desc: "Conquer Georgia, Armenia, and Azerbaijan in the Caucasus Mountains and make Russia a true continental empire."
 mos_caspian_sea: "Mastery of the Caspian Sea"
 mos_caspian_sea_desc: "The 'Russian inland sea' Caspian — seize the trade route to Persia and Central Asia."
 mos_beyond_urals: "Beyond the Urals"
 mos_beyond_urals_desc: "The Ural Mountains mark the boundary of Europe and Asia — beyond lies the vast expanse of Siberia. Get ahead of Yermak's 1582 conquest and claim the kingdom of furs."
 mos_conquer_perm: "Conquest of Perm"
 mos_conquer_perm_desc: "Perm in the upper Kama River — conquer this source of 'Kama furs' and use it as a foothold for Siberian conquest."
 mos_west_siberia: "West Siberia"
 mos_west_siberia_desc: "West Siberia centered on Tobolsk — the vast taiga supplies endless fur resources. Develop Tobolsk as the 'capital of Siberia'."
 mos_east_siberia: "East Siberia"
 mos_east_siberia_desc: "To Irkutsk — reaching Lake Baikal opens the doors to East Siberia."
 mos_pacific_coast: "Reach the Pacific Coast"
 mos_pacific_coast_desc: "'The Cossacks reached the Pacific' — from Yakutsk to the Sea of Okhotsk. The Russian flag flies at the Pacific's edge."
 mos_fur_monopoly: "Fur Monopoly"
 mos_fur_monopoly_desc: "Siberian furs — the highest-valued commodity on European markets. Monopolize their supply and gain immense wealth."
 mos_sudebnik: "The Sudebnik (Law Code)"
 mos_sudebnik_desc: "The Sudebnik of 1497, Russia's first unified law code by Ivan III — this law code, foundation of serfdom, becomes a weapon of centralization."
 mos_handle_boyars: "Control the Boyars"
 mos_handle_boyars_desc: "The Boyars control local power — break this status quo and establish direct Tsarist administrators to advance centralization."
 mos_oprichnina: "The Oprichnina"
 mos_oprichnina_desc: "Ivan IV's dark Oprichnina — the Tsar's black horsemen purged rebellious Boyars. Use this brutal but effective policy to absolutize Tsarist authority."
 mos_dev_agriculture: "Agricultural Development"
 mos_dev_agriculture_desc: "Russia's rich chernozem — develop the fertile farmland stretching from Ukraine to the Volga to increase agricultural productivity."
 mos_pomestye_system: "The Pomestye System"
 mos_pomestye_system_desc: "The Pomestye system — granting land in exchange for military service forms the foundation of Russia's military strength."
 mos_streltsy: "Establish the Streltsy"
 mos_streltsy_desc: "The Streltsy — standing gunpowder infantry created by Ivan IV. This elite unit becomes the backbone of the Russian army."
 mos_zasechnaya_cherta: "The Zasechnaya Cherta"
 mos_zasechnaya_cherta_desc: "Build the 'Zasechnaya Cherta' of felled trees and fortresses as a defensive line against Tatar cavalry incursions."
 mos_dev_arkhangelsk: "Construct Arkhangelsk"
 mos_dev_arkhangelsk_desc: "Arkhangelsk, the White Sea port — Russia's only overseas trading port before Peter the Great. Develop this port for direct trade with Western Europe."
 mos_white_sea_trade: "White Sea Trade"
 mos_white_sea_trade_desc: "The English Muscovy Company (1555) entered Russia through here — get ahead and seize the White Sea trade route."
 mos_dev_nizhny: "Develop Nizhny Novgorod"
 mos_dev_nizhny_desc: "At the confluence of the Volga and Oka — develop 'Lower Novgorod' into the center of Volga trade."
 mos_conquer_pskov: "Conquest of Pskov"
 mos_conquer_pskov_desc: "Pskov was annexed by Moscow in 1510. Following Novgorod, conquer Pskov and fully control northwest Russia."
 mos_dev_yaroslavl: "Develop Yaroslavl"
 mos_dev_yaroslavl_desc: "Yaroslavl of the 'Golden Ring' — develop this Volga trading city into a transit hub for northern trade."
 mos_conquer_vologda: "Develop Vologda"
 mos_conquer_vologda_desc: "Vologda — seize this key northern trade route crossroads and secure the connection to White Sea trade."
 mos_amber_road: "The Amber Road"
 mos_amber_road_desc: "Baltic amber — supply this commodity through Riga to European markets and increase trade income."
 mos_reform_taxation: "Tax Reform"
 mos_reform_taxation_desc: "Establish a unified tax system and strengthen national finances. Centralized tax revenue supports the Russian military."
 mos_dev_kazan_city: "Develop Kazan City"
 mos_dev_kazan_city_desc: "Develop conquered Kazan into a multiethnic city where Tatars, Russians, and Chuvash coexist."
 mos_conquer_vilnius: "Conquest of Vilnius"
 mos_conquer_vilnius_desc: "Vilnius, capital of the Grand Duchy of Lithuania — conquering it ends Lithuanian dominance and shifts eastern European hegemony to Moscow."
 mos_develop_moscow_university: "Establish Moscow University"
 mos_develop_moscow_university_desc: "Build the halls of learning ahead of Moscow University (founded 1755). Realizing Lomonosov's dream early promotes Russia's intellectual development."
 mos_teutonic_order: "Defeat the Teutonic Order"
 mos_teutonic_order_desc: "The Teutonic Order, legacy of the Baltic Crusades — subjugating their territory brings the southern Baltic fully under Russian influence."
 mos_estonian_coast: "The Estonian Coast"
 mos_estonian_coast_desc: "Tallinn — seize this key Hanseatic League port and achieve full entry into Baltic trade."
 mos_dev_tobolsk_city: "Develop Tobolsk City"
 mos_dev_tobolsk_city_desc: "Develop Tobolsk in earnest as the 'capital of Siberia' — grow it as the administrative center of Siberian conquest."
 mos_northern_caucasus: "The Northern Caucasus"
 mos_northern_caucasus_desc: "Subjugate Chechnya, Dagestan, and Kabarda in the Northern Caucasus to establish a foothold for the broader Caucasus."
 mos_streltsy_reform: "Military Reform"
 mos_streltsy_reform_desc: "Modernize the Streltsy — incorporate western military technology to bring the Russian army up to European standards."
 mos_orthodoxy_conversion: "Promote Orthodox Conversion"
 mos_orthodoxy_conversion_desc: "Spread Orthodox faith to conquered Tatars, Finnic peoples, and Siberian natives to realize the spiritual unification of the empire."
 mos_dev_yaroslavl_trading: "Yaroslavl Trade Center"
 mos_dev_yaroslavl_trading_desc: "Develop Yaroslavl as the center of northern and eastern trade — strengthen its role as a key point on the Volga trade route."
 mos_siberian_ostrog: "Siberian Ostrog Network"
 mos_siberian_ostrog_desc: "Develop the fortress (ostrog) network linking Tobolsk, Yeniseysk, and Irkutsk that supports Siberian conquest."
 mos_absolute_monarchy: "Establish Absolute Monarchy"
 mos_absolute_monarchy_desc: "Establish absolute Tsarist authority — strip the power of Boyars, church, and local lords, concentrating all authority in the emperor's hands."
 mos_peter_reforms: "The Petrine Reforms"
 mos_peter_reforms_desc: "Peter the Great (1672-1725) transformed Russia into a modern state through westernization. Military reform, navy creation, science academy. Realize the spirit of 'opening a window to the west'."
 mos_dev_st_petersburg: "Construct Saint Petersburg"
 mos_dev_st_petersburg_desc: "Built by Peter the Great in 1703 on the Neva River swamps — construct Saint Petersburg as Russia's first Western-style city."
 mos_russian_navy: "Establish the Russian Navy"
 mos_russian_navy_desc: "'Russia needs a navy' — under Peter the Great's conviction, create the Azov and Baltic fleets."
 mos_dev_suzdal: "Develop Suzdal"
 mos_dev_suzdal_desc: "Suzdal of the 'Golden Ring' — develop this ancient city with its many medieval churches as a center of religion and culture."
 mos_dev_vladimir: "Develop Vladimir"
 mos_dev_vladimir_desc: "Vladimir, once capital of the Grand Duchy — develop this ancient city as a center of agriculture and food supply."
 mos_salt_works: "Salt Industry"
 mos_salt_works_desc: "Salt from Vologda and Solikamsk — establish stable supply of salt indispensable for Russian food preservation."
 mos_beeswax_trade: "Beeswax Trade"
 mos_beeswax_trade_desc: "Russian beeswax — a key commodity in high demand for Orthodox church candles and Western European export."
 mos_grain_surplus: "Grain Surplus"
 mos_grain_surplus_desc: "Grain from the chernozem zone — the fertile farmland from Ukraine to southern Russia supports the empire's food base."
 mos_iron_works: "Iron Industry"
 mos_iron_works_desc: "Iron ore from the Ural region — lay the foundation for Ural iron production that intensifies in the Petrine era."
 mos_orthodox_mission: "Orthodox Missionary Work"
 mos_orthodox_mission_desc: "Missionary work among northern and eastern pagans — Finnic peoples, Siberian natives, Tatars — strengthens the spiritual unity of the Russian Empire."
 mos_dev_astrakhan_city: "Develop Astrakhan City"
 mos_dev_astrakhan_city_desc: "Astrakhan, the 'southern gateway' — develop it as the center of Caspian trade and seize trade with Persia and Central Asia."
 mos_cossack_cavalry: "Cossack Cavalry"
 mos_cossack_cavalry_desc: "Don Cossacks and Zaporozhian Cossacks — incorporate these finest steppe horsemen into the Russian army."
 mos_book_of_royal_degrees: "The Stepennaya Kniga"
 mos_book_of_royal_degrees_desc: "The Stepennaya Kniga records the lineage of Rus rulers, strengthening Moscow's legitimacy and administrative efficiency."
 mos_kholmogory: "Develop Kholmogory"
 mos_kholmogory_desc: "Kholmogory on the Dvina River — develop this White Sea trade outpost."
 mos_grand_duchy_rank: "Establish the Grand Duchy"
 mos_grand_duchy_rank_desc: "From the Grand Duchy of Moscow to a kingdom — Russia gains international recognition as a formal kingdom with the Tsar's title."
 mos_protect_south_slavs: "Protect the South Slavs"
 mos_protect_south_slavs_desc: "Liberate the Orthodox Christians of the Balkans from Ottoman rule and build a pan-Slavic empire."
 mos_conquer_carpathia: "Conquest of Carpathia"
 mos_conquer_carpathia_desc: "The Carpathian Mountains — subjugating this gateway to Central Europe greatly expands western influence."
 mos_westernization: "Westernization"
 mos_westernization_desc: "'Russia must learn Western technology' — realize Peter the Great's westernization spirit and gain recognition as a European power."
 mos_great_northern_war: "The Great Northern War"
 mos_great_northern_war_desc: "In the Great Northern War (1700-1721), Peter the Great defeated Sweden and established Baltic hegemony — realize this victory early."
 mos_dev_perm_city: "Develop Perm City"
 mos_dev_perm_city_desc: "Develop Perm, hub of the fur trade, into a proper city — grow it as the center of trade and fur gathering on the upper Kama River."
 mos_yakutsk_founded: "Found Yakutsk"
 mos_yakutsk_founded_desc: "Yakutsk, founded in 1632 — build it as the center of East Siberia and open the road to the Pacific."
 mos_dev_irkutsk: "Develop Irkutsk"
 mos_dev_irkutsk_desc: "Irkutsk on Lake Baikal — develop this city, later the 'Paris of Siberia', as the administrative and trade center of East Siberia."
 mos_dev_minsk: "Develop Minsk"
 mos_dev_minsk_desc: "Develop Minsk, center of Belarus, as a base of western rule."
 mos_conquer_warsaw: "Conquest of Warsaw"
 mos_conquer_warsaw_desc: "Warsaw, capital of Poland — complete the Polish partition and establish influence over Central Europe."
 mos_iron_ring_defense: "The Iron Ring Defense"
 mos_iron_ring_defense_desc: "A fortress network against invasion from south and west — an iron defensive system of bastion fortresses protects Russian territory."
 mos_form_russia: "Form Russia"
 mos_form_russia_desc: "Having broken the Tatar yoke, conquered Kazan, and unified the Rus principalities — formally declare the state of 'Russia' and reign over all as Tsar."
 mos_russian_empire: "The Russian Empire"
 mos_russian_empire_desc: "Peter the Great declared Russia an 'empire' with the Treaty of Nystad in 1721 — realize this moment early through furs, agriculture, and Petrine reforms."
 mos_autocrat_of_all_russias: "Autocrat of All Russias"
 mos_autocrat_of_all_russias_desc: "'By the grace of God, Emperor and Autocrat of All Russia' — from Baltic to Siberia, from Caucasus to Arctic Ocean, all lands lie under the Tsar's sovereign grace."
 mos_events.1.t: "Grand Duchy of Moscow — Under the Tatar Yoke"
 mos_events.1.d: "In 1337, Moscow is a small principality. Yet through the shrewd skill of Ivan I Kalita ('Moneybag'), the Tatars' tax collection agent, Moscow has accumulated strength.

Moscow's advantage is geography — its inland forest position makes direct Tatar control difficult.

The memory of the Battle of Kulikovo (1380), where Dmitry Donskoy repelled the Tatars, lives on. Break the Tatar yoke completely and unify the Russian principalities under Tsarist rule — that is Moscow's destiny."
 mos_events.1.a: "For the glory of Moscow!"
 mos_events.5.t: "Break the Tatar Yoke!"
 mos_events.5.d: "At last, Moscow's army has defeated the Tatars in battle — tribute to the Tatars is ended forever. At this historical turning point comparable to the 'Stand on the Ugra River (1480)', Moscow becomes the standard-bearer of free Russia. The Russian principalities recognize Moscow's hegemony, and the road to a unified state opens."
 mos_events.5.a: "Russia is free! Now for the unification of the Rus!"
 mos_events.10.t: "The Coronation of the Tsar"
 mos_events.10.d: "'Tsar and Grand Prince of All Russia' — by adopting this title, Moscow positions itself as the rightful successor of the Byzantine Empire. Anticipate Ivan IV's historic coronation ceremony of 1547. The courts of Europe begin to recognize Moscow as a new great power."
 mos_events.10.a: "Long live the Tsar! Long live Moscow!"
 mos_events.30.t: "Recapture of Constantinople — Completion of the Third Rome"
 mos_events.30.d: "The Orthodox holy city of Constantinople is in Russian hands! The recapture of this city, which fell to the Ottomans in 1453, means Russia becomes the spiritual leader of the Orthodox world as the 'Third Rome'. The Christian cross flies once more over the Hagia Sophia."
 mos_events.30.a: "Long live the Third Rome! Long live Russian Orthodoxy!"
 mos_events.50.t: "The Petrine Reforms — Westernization or Tradition?"
 mos_events.50.d: "A wave of westernization is about to sweep Russia. Actively incorporate Western technology, military systems, and science to develop Russia as a modern European power — or protect Orthodox tradition and the 'Russian way', building a unique empire?"
 mos_events.50.a: "Promote westernization — Russia is part of Europe"
 mos_events.60.t: "Formation of Russia — Birth of a New Empire"
 mos_events.60.d: "Ukraine, Belarus, and Galicia under one flag — the unified East Slavic state of 'Ruthenia' emerges as a new great power of Eastern Europe. All the Rus peoples gather beneath Kyiv's golden domes."
 mos_events.60.a: "Long live Russia! Long live the Tsar of All Russia!"
 mos_events.99.t: "Autocrat of All Russias — Completion of the Empire"
 mos_events.99.d: "'By the grace of God, Emperor and Autocrat of All Russia' — from Baltic to Siberia, from Caucasus to Arctic Ocean — the Russian flag flies over the world's largest empire. From the small Moscow principality of 1337 to the world's greatest empire — this historical feat will be told for eternity."
 mos_events.99.a: "Long live the Autocrat of All Russias! Long live the Russian Empire!"
 mos_events.50.b: "Maintain tradition"
 STATIC_MODIFIER_NAME_mos_moscow_dev_mod: "Consolidation of Russia"
 STATIC_MODIFIER_DESC_mos_moscow_dev_mod: "Russia is consolidated — Moscow rises as the undisputed capital of the Rus lands."
 STATIC_MODIFIER_NAME_mos_kremlin_mod: "Moscow Kremlin"
 STATIC_MODIFIER_DESC_mos_kremlin_mod: "The Moscow Kremlin is built — the eternal seat of Russian power and prestige."
 STATIC_MODIFIER_NAME_mos_kazan_mod: "Conquest of Kazan"
 STATIC_MODIFIER_DESC_mos_kazan_mod: "Kazan is conquered — the Tatar khanate falls and the Volga opens to Russian expansion."
 STATIC_MODIFIER_NAME_mos_volga_mod: "Middle Volga"
 STATIC_MODIFIER_DESC_mos_volga_mod: "The middle Volga is secured — Russia's great river becomes an imperial highway."
 STATIC_MODIFIER_NAME_mos_astrakhan_mod: "Conquest of Astrakhan"
 STATIC_MODIFIER_DESC_mos_astrakhan_mod: "Astrakhan is conquered — the lower Volga and Caspian gateway fall to Moscow."
 STATIC_MODIFIER_NAME_mos_steppes_mod: "Defeat of the Tatars"
 STATIC_MODIFIER_DESC_mos_steppes_mod: "The Tatars are defeated — the Pontic Steppe opens to Russian settlement."
 STATIC_MODIFIER_NAME_mos_pontic_mod: "Mastery of the Pontic Steppe"
 STATIC_MODIFIER_DESC_mos_pontic_mod: "Mastery of the Pontic Steppe — Russia dominates the lands north of the Black Sea."
 STATIC_MODIFIER_NAME_mos_azov_mod: "Advance to the Azov Sea"
 STATIC_MODIFIER_DESC_mos_azov_mod: "The advance to the Azov Sea opens the path to the Black Sea and Mediterranean."
 STATIC_MODIFIER_NAME_mos_crimea_mod: "Conquest of Crimea"
 STATIC_MODIFIER_DESC_mos_crimea_mod: "Crimea is conquered — Russia gains the warm-water port it long sought."
 STATIC_MODIFIER_NAME_mos_novgorod_mod: "Conquest of Novgorod"
 STATIC_MODIFIER_DESC_mos_novgorod_mod: "Novgorod is conquered — the great trading republic absorbed into the Russian state."
 STATIC_MODIFIER_NAME_mos_tver_mod: "Tver — Volga Trading City"
 STATIC_MODIFIER_DESC_mos_tver_mod: "Tver — the Volga trading city — is subjugated and integrated into Moscow."
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "Subjugation of Ryazan"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "Ryazan is subjugated — the last independent principality absorbed into Russia."
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "Smolensk — Key of Russia"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "Smolensk — the key of Russia — is reclaimed, securing the western frontier."
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "Conquest of Ruthenia"
 STATIC_MODIFIER_DESC_mos_ruthenia_mod: "Ruthenia is conquered — the Orthodox Slavs of the west come under Moscow's protection."
 STATIC_MODIFIER_NAME_mos_vyborg_mod: "Viborg — Gateway to the West"
 STATIC_MODIFIER_DESC_mos_vyborg_mod: "Viborg — the gateway to the west — is seized, granting Baltic access."
 STATIC_MODIFIER_NAME_mos_baltic_mod: "Baltic Ambitions"
 STATIC_MODIFIER_DESC_mos_baltic_mod: "Baltic ambitions are realized — Russia stakes its claim on the northern sea."
 STATIC_MODIFIER_NAME_mos_riga_mod: "Riga — Baltic Trade Hub"
 STATIC_MODIFIER_DESC_mos_riga_mod: "Riga — the Baltic trade hub — falls under Russian control."
 STATIC_MODIFIER_NAME_mos_poland_mod: "Partition of Poland"
 STATIC_MODIFIER_DESC_mos_poland_mod: "Poland is partitioned — its territory absorbed into the Russian Empire."
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "Moscow Metropolitan See"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "Moscow's metropolitan see is elevated — the church anchors Russian state power."
 STATIC_MODIFIER_NAME_mos_churches_mod: "Land of Churches"
 STATIC_MODIFIER_DESC_mos_churches_mod: "A land of churches — Orthodoxy permeates every city, town, and village of Russia."
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "Russian Patriarchate"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "The Russian Patriarchate is established — Moscow's church stands independent from Constantinople."
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "Guardian of Orthodoxy"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "Russia is recognized as guardian of Orthodoxy — the defender of the faith."
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "The Third Rome"
 STATIC_MODIFIER_DESC_mos_third_rome_mod: "Moscow proclaims itself the Third Rome — the eternal seat of Orthodox civilization."
 STATIC_MODIFIER_NAME_mos_caucasus_mod: "March to the Caucasus"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "The march to the Caucasus extends Russian influence into the mountain kingdoms."
 STATIC_MODIFIER_NAME_mos_caspian_mod: "Mastery of the Caspian"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "Mastery of the Caspian Sea opens the Persian and Central Asian trade routes."
 STATIC_MODIFIER_NAME_mos_urals_mod: "Crossing the Urals"
 STATIC_MODIFIER_DESC_mos_urals_mod: "The Urals are crossed — the door to Siberia swings open."
 STATIC_MODIFIER_NAME_mos_perm_mod: "Conquest of Perm"
 STATIC_MODIFIER_DESC_mos_perm_mod: "Perm is conquered — the gateway to the Urals and the Siberian frontier secured."
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "Establishment of Siberian Trade"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "Siberian trade is established through Tobolsk — furs and resources flow west."
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "Conquest of East Siberia"
