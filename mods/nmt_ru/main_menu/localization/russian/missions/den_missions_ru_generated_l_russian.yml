l_russian:
 den_kalmar_union_mission_pack: "Glory of the Kalmar Union"
 den_kalmar_union_mission_pack_DESCRIPTION: "In 1337, the Kingdom of Denmark stands on the brink of financial ruin and territorial fragmentation. Valdemar IV Atterdag seeks to reclaim the throne and rebuild the nation. Retake Gotland, confront the Hanseatic League, form the Kalmar Union with Norway and Sweden, master the Baltic, conquer England — and choose your faith: Catholic steadfastness, Lutheran Reformation, or the revival of the Norse gods. Build the Scandinavian Empire."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION: "As Denmark, expand in all directions — north, east, religious — and found the Scandinavian Empire."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP: "Complete missions to build the Scandinavian Empire."
 den_kalmar_union_mission_pack_BUTTON_DETAILS: "From Valdemar's restoration to the golden age of the Kalmar Union — unite Scandinavia!"
 den_restoration_of_denmark: "Valdemar's Restoration"
 den_restoration_of_denmark_desc: "In 1340, Valdemar IV Atterdag reclaimed the throne of a Denmark shattered and sold piecemeal — even Jutland had been pawned to Prussia. Piece by piece, he took it back. 'Atterdag' — 'again it is day' — his very nickname embodied his historical mission. Secure Copenhagen and raise the legitimacy of the crown."
 den_restoration_of_denmark_tooltip: "Legitimacy 50+, stability 20+, Copenhagen (kobenhavn) owned by us or a subject"
 den_secure_denmark: "Stabilize Denmark"
 den_secure_denmark_desc: "Seizing Roskilde, Aarhus, and Malmö reunites the Danish heartland. Roskilde is the traditional burial site of Danish kings and its spiritual capital; Malmö is the key gateway to the Baltic. With these secured, Denmark can look outward."
 den_secure_denmark_tooltip: "Roskilde, Aarhus, and Malmö owned by us or a subject"
 den_norway_union: "Personal Union with Norway"
 den_norway_union_desc: "Denmark and Norway entered personal union in 1380 upon the death of Håkon VI. His daughter Margaret I became regent of Norway and laid the groundwork for the Kalmar Union. Bring Norway under the Danish banner and take the first step toward Scandinavian unity."
 den_norway_union_tooltip: "Norway (c:NOR) in personal union or subject, or Norway doesn't exist"
 den_sweden_union: "Personal Union with Sweden"
 den_sweden_union_desc: "Sweden has been Denmark's great northern rival through generations of conflict. Some Swedish nobles seek Danish protection. Whether through diplomacy or conquest, bring Sweden under Danish control — and Scandinavia becomes within reach."
 den_sweden_union_tooltip: "Sweden (c:SWE) in personal union or subject, or Sweden doesn't exist"
 den_integrate_holstein: "Integrate Holstein"
 den_integrate_holstein_desc: "Holstein is a German-speaking duchy whose duke is the Danish king. Controlling Hamburg and Holstein secures the southern border and exerts pressure on the Hanseatic League. 'Danish in Holstein, Holstein in Denmark' — resolve this ambiguity once and for all."
 den_integrate_holstein_tooltip: "Hamburg owned by us or a subject, own 5+ locations in the Holstein area"
 den_kalmar_union: "The Kalmar Union"
 den_kalmar_union_desc: "The Union of Kalmar in 1397, masterminded by Margaret I, united the three crowns of Denmark, Norway, and Sweden under one king. Each country kept its own laws and traditions, but coordinated foreign and military policy. The birth of the Northern Empire."
 den_kalmar_union_tooltip: "Legitimacy 80+, stability 30+, Norway and Sweden in personal union or subject"
 den_pacify_sweden: "Subdue Sweden"
 den_pacify_sweden_desc: "Swedish nobles have always chafed under Danish rule — the Engelbrekt Revolt, the turbulent Kalmar years. Stockholm must be directly controlled and Swedish noble autonomy curtailed to transform the union into true integration."
 den_pacify_sweden_tooltip: "Sweden subject or doesn't exist, Stockholm owned by us or a subject"
 den_nobles_of_sweden: "Conciliate the Swedish Nobility"
 den_nobles_of_sweden_desc: "Sweden's nobility has always been ambivalent about the Kalmar Union. Grant them privileges while binding them to loyalty, and internal resistance to Danish rule can be kept in check."
 den_nobles_of_sweden_tooltip: "Sweden subject or doesn't exist, nobles satisfaction 0.65+"
 den_unite_scandinavia: "Unite Scandinavia"
 den_unite_scandinavia_desc: "With Sweden subdued and Holstein integrated, all of Scandinavia unites under the Danish banner. From the Baltic to the Norwegian Sea, one dynasty rules all. This is the greatest political achievement in the history of the North."
 den_unite_scandinavia_tooltip: "Own 200+ locations in the Scandinavia region, prestige 70+"
 den_integrate_norway: "Integrate Norway"
 den_integrate_norway_desc: "Seize Oslo and Bergen and fully integrate Norway as part of the Danish empire. Bergen was once the Hanseatic League's premier northern hub — now it becomes Denmark's gateway to the North Atlantic."
 den_integrate_norway_tooltip: "Oslo and Bergen owned by us or a subject"
 den_integrate_sweden: "Integrate Sweden"
 den_integrate_sweden_desc: "Fully integrate Sweden as part of the Danish empire. Owning Stockholm and holding Svealand makes Sweden an indivisible part of the realm."
 den_integrate_sweden_tooltip: "Stockholm owned by us or a subject, own 5+ locations in the Svealand area"
 den_develop_trondheim: "Develop Northern Norway"
 den_develop_trondheim_desc: "Trondheim is Norway's historic capital and the seat of its archbishop. Developing the northern Norwegian coast establishes control over the North Atlantic and the Norwegian Sea."
 den_develop_trondheim_tooltip: "Bergen and Oslo owned by us or a subject"
 den_scandinavian_golden_age: "Scandinavian Golden Age"
 den_scandinavian_golden_age_desc: "With Norway and Sweden integrated and absolutism established, Scandinavia enters its golden age as Northern Europe's greatest empire. Copenhagen flourishes as the cultural and economic center linking the Baltic and the North Sea."
 den_scandinavian_golden_age_tooltip: "Own 400+ locations, monthly income 400+, prestige 70+"
 den_retake_gotland: "Retake Gotland"
 den_retake_gotland_desc: "Visby on Gotland was once one of the Hanseatic League's greatest trading cities — a prize fought over by Sweden, Livonia, and the Teutonic Order. In 1361, Valdemar IV seized Gotland by force. Taking this island secures a crucial hub of Baltic trade."
 den_retake_gotland_tooltip: "Visby owned by us or a subject"
 den_sound_toll: "The Sound Toll"
 den_sound_toll_desc: "Denmark sits at the narrow passage between the Baltic and the North Sea; every ship must pass through the Øresund Strait and pay the toll. Formalized around 1429, this toll became the backbone of Danish royal finances. Build the fleet and control the strait completely."
 den_sound_toll_tooltip: "Fleet size 20+, monthly income 80+"
 den_humiliate_hansa: "Humiliate the Hansa"
 den_humiliate_hansa_desc: "The Hanseatic League has monopolized Baltic trade and threatened Denmark for generations. Since the humiliating Treaty of Stralsund in 1370, Denmark has waited for revenge. Control Lübeck or surpass the League economically — and shatter Hanseatic hegemony."
 den_humiliate_hansa_tooltip: "Own Lübeck, or Hansa doesn't exist, or monthly income 150+"
 den_reconquer_estonia: "Reconquer Estonia"
 den_reconquer_estonia_desc: "Tallinn (Reval) was founded as a Danish fortress in 1219 by Valdemar II — 'Taani linn' (Danish castle) is said to be the origin of its name. Sold to the Teutonic Order in 1346, reclaiming this land restores Danish influence on the eastern Baltic shore."
 den_reconquer_estonia_tooltip: "Tallinn and Narva owned by us or a subject"
 den_control_livonia: "Control Livonia"
 den_control_livonia_desc: "Livonia (modern Latvia and Estonia) is the strategic prize contested by the Teutonic Order, Poland, Sweden, and Russia. Seizing Riga and Tartu puts the entire eastern Baltic coast in Danish hands."
 den_control_livonia_tooltip: "Riga and Tartu owned by us or a subject"
 den_stralsund_treaty: "Capture Stralsund"
 den_stralsund_treaty_desc: "Stralsund and Stettin are the principal cities of Pomerania on the southern Baltic coast. In 1370, Denmark was forced into a humiliating treaty here. Now Denmark seizes the initiative — controlling these cities establishes dominance over the Pomeranian coast."
 den_stralsund_treaty_tooltip: "Stralsund and Stettin owned by us or a subject"
 den_expand_the_toll: "Expand the Toll"
 den_expand_the_toll_desc: "Extend the Sound Toll to cover the entire Baltic trade network. After subduing Pomerania and breaking the Hanseatic League, Denmark becomes the master of Northern European commerce."
 den_expand_the_toll_tooltip: "Monthly income 200+, own 4+ market centers"
 den_master_of_the_baltic: "Master of the Baltic"
 den_master_of_the_baltic_desc: "Hanseatic defeat and Livonian control — Denmark is the undisputed master of the Baltic. Seizing Königsberg and Gdańsk completes the encirclement: no merchant ship may enter or leave without Danish permission."
 den_master_of_the_baltic_tooltip: "Fleet size 50+, Königsberg and Gdańsk owned by us or a subject"
 den_eliminate_novgorod: "Eliminate Novgorod"
 den_eliminate_novgorod_desc: "The Republic of Novgorod is the great commercial state at the eastern end of the Baltic-Barents trade routes. Controlling Novgorod and Pskov brings the entire trade route for Russian furs, amber, and honey under Danish management."
 den_eliminate_novgorod_tooltip: "Novgorod and Pskov owned by us or a subject, or Novgorod doesn't exist"
 den_rival_england: "Rival England"
 den_rival_england_desc: "The Danish king Valdemar the Victorious once conquered England (1016). Cnut the Great's North Sea Empire was Denmark's greatest historical glory. The time has come to chase that dream again. Declare England a rival and contest mastery of the North Sea."
 den_rival_england_tooltip: "England (c:ENG) is our rival, or power projection 15+. Fleet size 15+"
 den_north_sea_fleet: "North Sea Fleet"
 den_north_sea_fleet_desc: "To rule the North Sea, a powerful fleet is needed. Expand Copenhagen's shipyards and build the greatest fleet in Scandinavian history. The day has come when Danish ships sail from Iceland to the Thames."
 den_north_sea_fleet_tooltip: "Fleet size 40+"
 den_danish_scotland: "Denmark in Scotland"
 den_danish_scotland_desc: "Scotland is England's eternal enemy and Denmark's potential ally. Seizing Edinburgh creates a pincer around England from north and south — reenacting the age when Vikings ruled Scotland's coasts."
 den_danish_scotland_tooltip: "Edinburgh owned by us or a subject"
 den_invade_england: "Invade England"
 den_invade_england_desc: "Danish and Norwegian forces have landed in northern England. York was once the capital of the Viking kingdom of Jórvík — heart of the Danelaw. Seizing York revives the glory of the Danelaw, the vast northern English territories ruled by Danish and Norse settlers in the 9th century."
 den_invade_england_tooltip: "York owned by us or a subject, at war with England (c:ENG)"
 den_conquer_england: "Conquer England"
 den_conquer_england_desc: "London and Edinburgh under Danish control — for the first time in a thousand years since Cnut the Great, a Scandinavian dynasty rules the British Isles. The North Sea Empire of Denmark, Norway, Sweden, and England is reborn."
 den_conquer_england_tooltip: "London and Edinburgh owned by us or a subject"
 den_religious_question: "The Question of Faith"
 den_religious_question_desc: "What should the faith of Denmark be? Maintain loyalty to the Pope in Rome — embrace Luther's teachings of reform — or return to the ancient gods of the ancestors? This choice will determine Denmark's future."
 den_religious_question_tooltip: "Clergy satisfaction 0.70+, or prestige 50+"
 den_catholic_denmark: "Catholic Denmark"
 den_catholic_denmark_desc: "The Kingdom of Denmark maintains its loyalty to the Roman Catholic Church. By preserving good relations with the Pope, Denmark stands as the guardian of northern Catholic civilization with a diplomatic advantage."
 den_catholic_denmark_tooltip: "Dominant religion is Catholic (religion:catholic), papal opinion 120+"
 den_crusade_north: "Crusade of the North"
 den_crusade_north_desc: "Denmark stands as the northern shield of Christendom, taking part in holy war against infidel nations. Leading crusades against the remaining pagan territories on the eastern Baltic coast cements Denmark's religious authority."
 den_crusade_north_tooltip: "At war with a Muslim country (religion_group:muslim)"
 den_kingdom_of_god: "Kingdom of God"
 den_kingdom_of_god_desc: "Deep trust with the papacy and control of Hamburg — Denmark has established an unshakeable position as guardian of northern Catholic civilization. Recognized by Rome, the Danish king is inscribed in history as the 'Crusader of the North.'"
 den_kingdom_of_god_tooltip: "Papal opinion 180+, Hamburg owned by us or a subject"
 den_reformation: "The Reformation"
 den_reformation_desc: "In 1517, Martin Luther published his ninety-five theses and the wave of religious reform swept across Europe. In 1536, King Christian III declared Lutheranism the state religion of Denmark. Anticipate this historic transformation and build a Lutheran Denmark."
 den_reformation_tooltip: "Dominant religion is Lutheran (religion:lutheran)"
 den_protestant_church: "The Protestant Church"
 den_protestant_church_desc: "After converting to Lutheranism, church property was transferred to the Danish crown, dramatically strengthening state finances. Develop universities to train Lutheran theologians and entrench Protestant faith across Denmark."
 den_protestant_church_tooltip: "Own 3+ universities, clergy satisfaction 0.65+"
 den_protestant_league: "Protestant League"
 den_protestant_league_desc: "Lutheran nations unite in a league centered on Denmark. Like the Schmalkaldic League, Denmark leads the Protestant world of Northern Europe as the champion of the Reformation."
 den_protestant_league_tooltip: "3+ allies, at least one ally with dominant religion Lutheran"
 den_protestant_empire: "Protestant Empire"
 den_protestant_empire_desc: "Lutheranism has penetrated all of Scandinavia; the Danish king is now the greatest Protestant monarch in the world. In place of papal authority, the Danish king reigns as the spiritual leader of Scandinavia."
 den_protestant_empire_tooltip: "1+ Scandinavia region locations with 70%+ Lutheran population, own 300+ locations"
 den_norse_revival: "Norse Revival"
 den_norse_revival_desc: "The gods of the Viking age — Odin, Thor, Freyr — have never truly left. Some Norse nobles resisted Christianization and dream of a return to the old gods. Royal patronage of this movement sparks an unprecedented religious revolution in Scandinavia."
 den_norse_revival_tooltip: "Dominant religion is Norse (religion:norse)"
 den_viking_tradition: "Viking Tradition"
 den_viking_tradition_desc: "The blood of ancient Scandinavians runs hot again. The warrior spirit of the forebears — crossing seas, entering enemy lands, raiding and conquering — inhabits the Danish army. Build a mighty land army and fleet; recreate the glory of the Viking age."
 den_viking_tradition_tooltip: "Army tradition 50+, fleet size 30+"
 den_asgard_kingdom: "Kingdom of Asgard"
 den_asgard_kingdom_desc: "Under Odin's blessing, Scandinavia is reborn as the kingdom of the ancient gods. The belief that brave warriors slain in battle are welcomed into Valhalla becomes the spiritual pillar of the nation. Unite all of Scandinavia and build the realm of the gods."
 den_asgard_kingdom_tooltip: "Own 150+ locations in the Scandinavia region, prestige 80+"
 den_strengthen_crown: "Strengthen the Crown"
 den_strengthen_crown_desc: "The Kingdom of Denmark has historically had its royal power constrained by powerful nobles. The 'handfæstning' forced each king to grant noble privileges upon accession. Slowly break these chains and strengthen the Danish monarchy."
 den_strengthen_crown_tooltip: "Legitimacy 70+, nobles satisfaction 0.65+"
 den_copenhagen_university: "University of Copenhagen"
 den_copenhagen_university_desc: "The University of Copenhagen, founded in 1479, is the oldest university in Scandinavia. Its faculties of theology, law, medicine, and philosophy make it the center of Danish culture. Build the university in Copenhagen and realize the academic capital of the North."
 den_copenhagen_university_tooltip: "University built in Copenhagen (kobenhavn)"
 den_develop_copenhagen: "Develop Copenhagen"
 den_develop_copenhagen_desc: "Copenhagen — 'the merchants' harbor' — has grown as a key hub of Baltic trade. Raise it to city rank and install a local governor, transforming it into the great royal capital Denmark deserves."
 den_develop_copenhagen_tooltip: "Copenhagen is city rank or above, development 30+"
 den_revoke_privileges: "Revoke Privileges"
 den_revoke_privileges_desc: "Abolish the noble privileges that have constrained Danish royal power. Raising royal authority and implementing government reforms sets Denmark on the path to centralized absolutism."
 den_revoke_privileges_tooltip: "Crown estate power 25%+, government reform slots 1+"
 den_danish_navy: "Danish Royal Navy"
 den_danish_navy_desc: "Develop Copenhagen's shipyards and found the Danish Royal Navy. This permanent military institution supporting Danish hegemony over the Baltic and North Sea becomes the pillar of Danish power."
 den_danish_navy_tooltip: "Fleet size 30+, dock built in Copenhagen (kobenhavn)"
 den_amber_trade: "Amber Trade"
 den_amber_trade_desc: "Baltic amber — the 'Gold of the North' — has been treasured since antiquity. Expand amber and gem exports through Denmark's Baltic trade routes and secure rich commercial income."
 den_amber_trade_tooltip: "Produce 3+ amber, monthly income 100+"
 den_develop_aarhus: "Develop Aarhus"
 den_develop_aarhus_desc: "Aarhus is the largest city of Jutland and the commercial center of western Denmark. Raising it to city rank makes it Denmark's second city after Copenhagen."
 den_develop_aarhus_tooltip: "Aarhus is city rank or above"
 den_develop_malmo: "Develop Malmö"
 den_develop_malmo_desc: "Malmö, in southern Sweden (Scania), sits across the Øresund Strait from Copenhagen. Developing this city creates a vital counterpart to Copenhagen as a hub of Danish Baltic control."
 den_develop_malmo_tooltip: "Malmö is city rank or above, development 25+"
 den_absolutism: "Absolutism"
 den_absolutism_desc: "In 1660, King Frederick III convened the three estates — nobles, clergy, and commoners — and had them proclaim hereditary absolute monarchy. One of the most dramatic political transformations in Nordic history. Raise royal authority and legitimacy to anticipate this historic shift."
 den_absolutism_tooltip: "Crown estate power 30%+, legitimacy 90+"
 den_economic_powerhouse: "Northern Commercial Power"
 den_economic_powerhouse_desc: "Sound Toll, North Sea trade, Scandinavian agriculture — Denmark with its diverse income sources has become Northern Europe's greatest economic power. Maintain income of 300+ and multiple market centers to secure economic dominance."
 den_economic_powerhouse_tooltip: "Monthly income 300+, own 5+ market centers"
 den_north_sea_dominion: "North Sea Dominion"
 den_north_sea_dominion_desc: "Scandinavia united, the Baltic mastered, the Scandinavian golden age achieved — Denmark reigns as Northern Europe's greatest empire. With 80+ ships, 600+ monthly income, and 600+ locations, claim this glorious title."
 den_north_sea_dominion_tooltip: "Own 600+ locations, monthly income 600+, fleet size 80+"
 den_scandinavian_empire: "The Scandinavian Empire"
 den_scandinavian_empire_desc: "From the Baltic to England, from Gotland to Novgorod — the Scandinavian Empire is complete. The Denmark rebuilt by Valdemar IV has grown into a great empire dominating all of Northern Europe. 1000+ locations, prestige 80+, income 1000+ — seize that glory."
 den_scandinavian_empire_tooltip: "Own 1000+ locations, prestige 80+, monthly income 1000+"
 den_events.10.t: "The Norwegian Personal Union"
 den_events.10.d: "The King of Denmark has inherited the throne of Norway. Since the Viking age, Denmark and Norway have been bound under one royal house. Norway's rich fisheries, timber, and gateway to the North Atlantic dramatically expand Danish power. The king who holds the title 'King of Two Realms' has taken the historic first step toward Scandinavian unity."
 den_events.10.a: "Norway and Denmark are one forever!"
 den_events.20.t: "The Swedish Personal Union"
 den_events.20.d: "The King of Denmark has also secured the Swedish throne. Some Swedish nobles resist, but this personal union is the decisive step toward Scandinavian unity. Queen Margaret's diplomatic genius has achieved this miracle — the dream of 'Emperor of Scandinavia' inches closer to reality."
 den_events.20.a: "To the unity of three kingdoms — forward!"
 den_events.30.t: "The Kalmar Union"
 den_events.30.d: "At Kalmar in Sweden, representatives of Denmark, Norway, and Sweden gathered and proclaimed union under King Eric of Pomerania. Each country keeps its own laws and traditions, but coordinates foreign and military policy. 'Valdemar dreamed it; Margaret made it real' — so historians will later write."
 den_events.30.a: "Long live the Kalmar Union! Scandinavia is one!"
 den_events.40.t: "The Crossroads of Faith"
 den_events.40.d: "A fierce religious debate has erupted at the Danish court. Continue traditional loyalty to the Pope in Rome — embrace Martin Luther's new teachings — or return to the ancient gods of the ancestors? This choice strikes at the very foundations of the Danish state."
 den_events.40.a: "Hold loyalty to Rome — Catholicism is Denmark's faith"
 den_events.40.a.tt: "Advance the Catholic path. Makes den_catholic_denmark mission conditions easier to fulfill."
 den_events.40.b: "Embrace Luther's teachings — the age of reform has come"
 den_events.40.b.tt: "Advance the Lutheran path. Makes den_reformation mission conditions easier to fulfill."
 den_events.40.c: "Return to the ancient gods — seek Odin's blessing"
 den_events.40.c.tt: "Advance the Norse path. Makes den_norse_revival mission conditions easier to fulfill."
 den_events.99.t: "The Birth of the Scandinavian Empire"
 den_events.99.d: "Centuries since Valdemar IV inherited a Denmark in ruins — now that Denmark has grown into a great empire dominating all of Northern Europe. From the Baltic to the North Sea, from the Novgorodian steppes to the British Isles, all falls within the Danish emperor's realm. Historians will later write: 'Atterdag — again it is day — was a true prophecy.'"
 den_events.99.a: "Long live the Emperor of the Scandinavian Empire!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "Legacy of Valdemar"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "'Atterdag — again it is day.' Valdemar IV's restoration laid the cornerstone of Denmark's rebuilding."
 STATIC_MODIFIER_NAME_den_danish_heartland_mod: "Danish Heartland"
 STATIC_MODIFIER_DESC_den_danish_heartland_mod: "With Roskilde, Aarhus, and Malmö secured, the core of the Danish kingdom is reunited."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Holstein Integrated"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "The Duchy of Holstein is fully integrated into the Danish Empire. The southern border is stabilized and southern trade routes secured."
 STATIC_MODIFIER_NAME_den_kalmar_dominance_mod: "Kalmar Dominance"
 STATIC_MODIFIER_DESC_den_kalmar_dominance_mod: "Denmark holds the initiative in the Kalmar Union. Sweden and Norway function as loyal subjects."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "Scandinavia United"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "The three kingdoms united under one banner. The birth of Northern Europe's greatest state."
 STATIC_MODIFIER_NAME_den_swedish_loyalty_mod: "Swedish Nobility Loyal"
 STATIC_MODIFIER_DESC_den_swedish_loyalty_mod: "Sweden's nobles have accepted Danish rule. Internal resistance decreases; integration accelerates."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Norway Integrated"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "Norway is integrated as part of the Danish Empire. The gateway to the North Atlantic is opened."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "Sweden Integrated"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "Sweden is integrated as part of the Danish Empire. Cultural capacity as a multi-ethnic state grows."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Visby Trade Hub"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Visby on Gotland is revived as a Danish trade hub. The former Hanseatic city flourishes again."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "The Sound Toll"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "The toll collection system is established. Every merchant ship entering or leaving the Baltic pays Denmark."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Hanseatic Defeat"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "Denmark shattered Hanseatic hegemony and seized control of Baltic trade."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Estonia Reconquered"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Tallinn (Danish castle) has returned to Denmark. Danish influence on the eastern Baltic shore is restored."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Livonia Controlled"
 STATIC_MODIFIER_DESC_den_livonia_mod: "With Riga and Tartu secured, the entire eastern Baltic coast is under Danish management."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "Pomeranian Coast"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "Seizing Stralsund and Stettin puts the entire Pomeranian coast under Danish control."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "Extended Toll"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Toll coverage extended across all Baltic trade routes. Denmark is Northern Europe's greatest commercial power."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Master of the Baltic"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "The Danish fleet dominates all of the Baltic Sea. Every port from Königsberg to Gdańsk answers to Denmark."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Eastern Trade Routes"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Novgorod conquered — the entire trade route for Russian goods is now under Danish management."
 STATIC_MODIFIER_NAME_den_naval_ambition_mod: "Naval Ambition"
 STATIC_MODIFIER_DESC_den_naval_ambition_mod: "The dream of Cnut the Great's North Sea Empire inspires the Danish fleet."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "North Sea Fleet"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "The Danish Royal Navy controls the North Sea. From Iceland to the Thames, the Danish banner flies."
 STATIC_MODIFIER_NAME_den_scotland_mod: "Denmark in Scotland"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Edinburgh seized — England can now be pinced from north and south."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "The Invasion of England"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "Danish forces occupying York revived the memory of the Danelaw."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "North Sea Empire"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "For the first time in a thousand years since Cnut the Great, a Scandinavian dynasty rules the British Isles. The North Sea Empire is reborn."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Catholic Devotion"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "Denmark maintains loyalty to the Roman Church. Papal cooperation gives Denmark a diplomatic advantage."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Northern Crusader"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "Denmark's participation in holy war earns it renown as guardian of Christendom."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Champion of the Pope"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "Denmark has established an unshakeable position as guardian of northern Catholic civilization."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Lutheran Reform"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "The declaration of Lutheranism as state religion transferred church property to the crown, dramatically strengthening royal finances."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "Protestant Church"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "University development and Lutheran theology training entrench Protestant faith across Denmark."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "Protestant League"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "A Danish-led Lutheran alliance unites the Protestant world of Northern Europe."
 STATIC_MODIFIER_NAME_den_protestant_empire_mod: "Protestant Empire"
 STATIC_MODIFIER_DESC_den_protestant_empire_mod: "Lutheranism has penetrated all of Scandinavia. The Danish king is now the world's greatest Protestant monarch."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Norse Revival"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "Worship of Odin, Thor, and Freyr is restored. The warrior spirit of the ancestors inhabits Denmark's armies."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Viking Warriors"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "The Viking age warrior spirit is reborn. Denmark's armies are unmatched in crossing seas and conquering enemy lands."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "Kingdom of Asgard"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Under Odin's blessing, Scandinavia is reborn as the realm of the ancient gods."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Royal Authority"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "Danish royal power is strengthened. Noble constraints diminish; the king's commands reach across the realm."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "University of Copenhagen"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "Scandinavia's oldest university is open in Copenhagen. It flourishes as the center of northern scholarship and culture."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Copenhagen Capital Developed"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Copenhagen developed as a great royal capital. Population capacity and administrative efficiency dramatically improved."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Absolutism"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Absolute monarchy established in Denmark — anticipating the historic transformation of 1660, royal power is fully consolidated."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Danish Economic Powerhouse"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "Denmark's economy — built on the Sound Toll, North Sea trade, and Scandinavian agriculture — is the greatest in Northern Europe."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Crown Privileges"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "Noble privileges abolished; royal power strengthened. Danish administration and government capacity expand."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "Danish Royal Navy"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "The Danish Royal Navy, based in Copenhagen, is founded — the permanent military institution supporting Baltic and North Sea supremacy."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Amber Trade"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Baltic amber exports expanded. The 'Gold of the North' circulates across all of Europe, enriching Denmark."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Aarhus Developed"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "Jutland's largest city Aarhus developed as the commercial hub of western Denmark."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Malmö Developed"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Malmö on the western shore of the Øresund Strait has grown as a Baltic trade hub matching Copenhagen."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Northern Norway Developed"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "Developing the northern Norwegian coast establishes control over the North Atlantic and Norwegian Sea."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "Scandinavian Golden Age"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "With Norway and Sweden integrated and absolutism established, Scandinavia enters its golden age as Northern Europe's greatest empire."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "North Sea Dominion"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "Denmark controlling both the Baltic and the North Sea dominates all of Northern European trade."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "Scandinavian Empire"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "The Scandinavian Empire stretching from the Baltic to the North Sea is complete. Denmark's rebuilding from Valdemar's restoration has reached its apex."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Norwegian Union Bonus"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "The Norwegian personal union has opened the path to Scandinavian unity."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "Swedish Union Bonus"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "The Swedish personal union brings the formation of the Kalmar Union into view."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "The Kalmar Union"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Denmark, Norway, and Sweden united under one king — the greatest political integration in the history of the North."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "Steadfast in Faith"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "Unwavering devotion to the Catholic faith strengthens the legitimacy of the Danish crown."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Winds of Reform"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "Luther's teachings are spreading across Denmark. The wave of reform is changing Danish society."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "Call of the Old Gods"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "Faith in Odin and Thor is secretly reviving. The blessing of the ancestral gods inspires the Danish armies."
 den_finland_integration: "Integrate Finland"
 den_finland_integration_desc: "Finland is the vast forested eastern realm of the Swedish kingdom. Åbo (Turku) is Finland's administrative and religious center; Viborg guards the Karelian frontier; Uleåborg (Oulu) is the northernmost city. Fully controlling Finland establishes the eastern frontier of the Danish empire from the northern Baltic to the Arctic Circle, enabling a colonial policy across the wilderness."
 den_finland_integration_tooltip: "Åbo, Viborg, and Uleåborg directly owned by us"
 STATIC_MODIFIER_NAME_den_finland_mod: "Finnish Frontier"
 STATIC_MODIFIER_DESC_den_finland_mod: "Finland's vast forests and waterways draw settlers. Migrants from Denmark and Sweden open up this frontier land, pushing the empire's eastern borders ever further."
 den_unite_scandinavia_tt: "Own 350 or more locations in the Scandinavia region"
