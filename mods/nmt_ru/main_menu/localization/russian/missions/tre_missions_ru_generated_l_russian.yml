 STATIC_MODIFIER_DESC_tre_antioch_mod: "Antioch — the jewel of Byzantine Syria — is retaken."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "Greek Pop"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "The Greek population grows as the cultural backbone of the restored empire."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Restore Byzantium"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "The Byzantine Empire is formally restored under Komnenian leadership."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Komnenos Final"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "The Komnenian Empire stands eternal — master of the Eastern Mediterranean."
 tre_rize_tea: "Tea Cultivation in Rize"
 tre_rize_tea_desc: "Rize — blessed with a warm, humid climate between the Pontic Mountains and the Black Sea, this region will become Turkey's greatest tea-producing area. From 1737 onwards, convert Rize's hillsides to tea plantations using cultivation techniques that arrived via Georgia. Bring the noble eastern beverage to the Komnenian Empire."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Rize Tea Plantations"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "The hillsides of Rize converted to tea plantations, establishing a tea production base for the Empire."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "Constantinople Restored"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "Constantinople begins to function as the administrative and governmental center of the Empire."
