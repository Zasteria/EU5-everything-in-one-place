 STATIC_MODIFIER_DESC_tre_silk_mod: "Silk Road trade through Trebizond dominates east-west commerce."
 STATIC_MODIFIER_NAME_tre_army_mod: "Army"
 STATIC_MODIFIER_DESC_tre_army_mod: "The Komnenian army — a blend of mercenaries and provincial forces — is forged."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Culture"
 STATIC_MODIFIER_DESC_tre_culture_mod: "Byzantine learning and arts are revived, making Trebizond a cultural beacon."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Cilicia"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Cilicia is subjugated, securing Mediterranean access."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "Cpole City"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "Constantinople is rebuilt as the magnificent capital of the restored Byzantine Empire."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Patriarch"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "The Patriarchate of Constantinople is established under Komnenian guardianship."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Georgia"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Georgia is secured, stabilizing the Caucasus flank of the empire."
