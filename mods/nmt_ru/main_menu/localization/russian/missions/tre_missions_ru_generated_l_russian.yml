l_russian:
 tre_trebizond_mission_pack: "Revival of the Komnenos Dynasty and Restoration of Byzantium"
 tre_trebizond_mission_pack_DESCRIPTION: "In 1337, the Empire of Trebizond survives as a small state on the Pontic coast, heirs of the Komnenos dynasty. Seize Black Sea trade, reconquer Anatolia, liberate Constantinople, and restore the Byzantine Empire."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION: "Conquer Anatolia, reclaim Constantinople, subjugate the Balkans, and restore the Byzantine Empire."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP: "Restore the Komnenian Empire."
 tre_trebizond_mission_pack_BUTTON_DETAILS: "From the shores of Pontus, inherit the Byzantine legacy and march triumphantly to Constantinople!"
 tre_komnenian_legacy: "Komnenian Legacy"
 tre_komnenian_legacy_desc: "The Komnenos dynasty's legacy drives Trebizond's ambition to restore Byzantine greatness."
 tre_pontus_coast: "Secure the Pontic Coast"
 tre_pontus_coast_desc: "Secure the Pontic coastline as the foundation for Black Sea trade dominance."
 tre_black_sea_trade: "Black Sea Trade"
 tre_black_sea_trade_desc: "Seize Black Sea trade from Genoese and Venetian competitors."
 tre_dev_trebizond: "Develop Trebizond"
 tre_dev_trebizond_desc: "Develop Trebizond into a thriving hub worthy of the Komnenian Empire."
 tre_orthodox_stronghold: "Orthodox Stronghold"
 tre_orthodox_stronghold_desc: "Strengthen Orthodox monasteries to assert Trebizond as the spiritual heir of Byzantium."
 tre_armenia_campaign: "Subjugate Armenia"
 tre_armenia_campaign_desc: "Subjugate Armenia to secure the eastern frontier and gain mountain warriors."
 tre_cappadocia: "Conquest of Cappadocia"
 tre_cappadocia_desc: "Conquer the cave-monastery heartland of Cappadocia and push toward central Anatolia."
 tre_central_anatolia: "Reclaim Central Anatolia"
 tre_central_anatolia_desc: "Retake central Anatolia including Ankara from Turkish rule."
 tre_west_anatolia: "March into West Anatolia"
 tre_west_anatolia_desc: "March into the wealthy Aegean coast of western Anatolia."
 tre_reclaim_nicaea: "Reclaim Nicaea"
 tre_reclaim_nicaea_desc: "Reclaim Nicaea and Bursa — the Byzantine capital in exile — and approach Constantinople."
 tre_anatolian_emperor: "Emperor of Anatolia"
 tre_anatolian_emperor_desc: "Unite all of Anatolia under the Komnenian banner."
 tre_thrace_campaign: "Seize Thrace"
 tre_thrace_campaign_desc: "Seize Thrace to encircle Constantinople and prepare for its liberation."
 tre_reclaim_constantinople: "Reclaim Constantinople"
 tre_reclaim_constantinople_desc: "Liberate Constantinople and restore the Orthodox cross over Hagia Sophia."
 tre_northern_greece: "Reclaim Northern Greece"
 tre_northern_greece_desc: "Retake northern Greece including Thessaloniki — Byzantium's second city."
 tre_bulgaria: "Conquest of Bulgaria"
 tre_bulgaria_desc: "Conquer Bulgaria to consolidate Balkan dominance."
 tre_morea: "Reclaim the Morea"
 tre_morea_desc: "Retake the Morea and Athens — the heart of ancient Greek civilization."
 tre_aegean_islands: "The Aegean Islands"
 tre_aegean_islands_desc: "Reclaim the Aegean islands from Latin Crusader occupation."
 tre_macedonian_campaign: "Conquest of Macedonia"
 tre_macedonian_campaign_desc: "Conquer Macedonia — the birthplace of Alexander the Great."
 tre_silk_trade: "The Silk Trade"
 tre_silk_trade_desc: "Control the Silk Road trade through Trebizond to dominate east-west commerce."
 tre_komnenian_army: "The Komnenian Army"
 tre_komnenian_army_desc: "Build the Komnenian army — a blend of mercenaries and provincial forces."
 tre_greek_culture: "Greek Cultural Revival"
 tre_greek_culture_desc: "Revive Byzantine learning and arts to make Trebizond a cultural beacon."
 tre_cilicia_campaign: "Subjugate Cilicia"
 tre_cilicia_campaign_desc: "Subjugate Cilicia to secure access to the Mediterranean."
 tre_dev_constantinople: "Rebuild Constantinople"
 tre_dev_constantinople_desc: "Rebuild Constantinople as the magnificent capital of the restored Byzantine Empire."
 tre_orthodox_patriarch: "Orthodox Patriarchate"
 tre_orthodox_patriarch_desc: "Establish the Patriarchate of Constantinople, making Trebizond the guardian of Orthodoxy."
 tre_georgia_campaign: "Georgian Expedition"
 tre_georgia_campaign_desc: "Lead an expedition into Georgia to secure the Caucasus flank."
 tre_komnenian_navy: "The Komnenian Navy"
 tre_komnenian_navy_desc: "Build a powerful navy to dominate the Black Sea and Aegean."
 tre_antioch_crusade: "Reclaim Antioch"
 tre_antioch_crusade_desc: "Retake Antioch — once the jewel of Byzantine Syria."
 tre_greek_population: "Growth of Greek Population"
 tre_greek_population_desc: "Grow the Greek population as the cultural backbone of the restored empire."
 tre_restore_byzantium: "Restore Byzantium"
 tre_restore_byzantium_desc: "Declare the restoration of the Byzantine Empire under Komnenian leadership."
 tre_komnenos_dynasty: "Glory of the Komnenos Dynasty"
 tre_komnenos_dynasty_desc: "Reign as the eternal Komnenian Emperor — successor of Eastern Rome, guardian of Orthodoxy."
 tre_events.10.t: "Coronation of the Anatolian Emperor"
 tre_events.10.d: "All of Anatolia under the Komnenian banner — the road to Constantinople is open."
 tre_events.10.a: "Long live the Komnenian Emperor! Rise again, Byzantium!"
 tre_events.20.t: "Constantinople Reclaimed — Byzantium Lives"
 tre_events.20.d: "Constantinople is in Komnenian hands! The Orthodox cross flies over Hagia Sophia once more. The world trembles — Byzantium has risen."
 tre_events.20.a: "Long live Constantinople in God's glory!"
 tre_events.60.t: "Declaration of Byzantine Restoration"
 tre_events.60.d: "Anatolia, the Balkans, and Constantinople united — the Komnenos dynasty declares the restoration of the Byzantine Empire. Risen from the tragedy of 1204."
 tre_events.60.a: "Long live Byzantium! Long live the Komnenos dynasty!"
 tre_events.99.t: "Eternal Glory of the Komnenos Dynasty"
 tre_events.99.d: "'Komnenian Emperor — successor of Eastern Rome and guardian of Orthodoxy' — this title echoes across the Mediterranean world. The small empire that began in Trebizond reigns as successor to history's greatest empire."
 tre_events.99.a: "Long live the Komnenos dynasty! Long live eternal glory!"
