l_russian:
 eth_ethiopia_mission_pack: "The New Solomonic Empire — A Cross Shining on the Horn of Africa"
 eth_ethiopia_mission_pack_DESCRIPTION: "Under a dynasty said to descend from the Queen of Sheba and King Solomon, contend with the Mamluks as protector of the Copts, prevail in the death struggle with Adal, and revive the glory of Aksum to build a new empire."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION: "Establish the empire, claim hegemony over the Horn of Africa, protect the Copts, and revive the glory of Aksum."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP: "From a highland fortress to an empire shining on the Red Sea."
 eth_ethiopia_mission_pack_BUTTON_DETAILS: "'King of Kings, Lion of Judah' — as heir to the Queen of Sheba, build a new Solomonic Empire!"
 eth_negus_authority: "Establish the Authority of the Negus Negast"
 eth_negus_authority_desc: "'King of Kings' — the title of Negus Negast. Let this authority reach every corner of the realm."
 eth_amba_geshen: "The Prison of Amba Geshen"
 eth_amba_geshen_desc: "To prevent succession disputes, royal princes are confined to the natural fortress of Amba Geshen — establish this custom as institution."
 eth_mobile_court: "The Itinerant Court of Ethiopia"
 eth_mobile_court_desc: "With no fixed capital, the Emperor and his army traverse the realm in a moving camp (ketema) — establish this unique style of governance as an institution of state."
 eth_coptic_church: "Protect the Ethiopian Orthodox Church"
 eth_coptic_church_desc: "The Ethiopian Orthodox Church, under the authority of Alexandria — make its faith a pillar of the state, and become protector of the Copts."
 eth_gondar_founding: "Develop Gondar"
 eth_gondar_founding_desc: "Gondar, called 'the Camelot of Africa' — develop it into a great walled city of stone."
 eth_royal_chronicle: "Compile the Royal Chronicles"
 eth_royal_chronicle_desc: "Inherit the spirit of the 'Kebra Nagast,' the chronicle recording the deeds of past emperors, and cultivate a tradition of scholarship and record-keeping."
 eth_feudal_levies: "The Feudal Levy System"
 eth_feudal_levies_desc: "Establish Ethiopia's unique feudal military system, in which regional lords lead troops at the Emperor's summons."
 eth_negus_dynasty: "The Solomonic Dynasty Secured"
 eth_negus_dynasty_desc: "With the church, chronicles, military system, and capital all in place, make the rule of the Solomonic dynasty unshakeable."
 eth_oromo_migration: "The Oromo Migrations"
 eth_oromo_migration_desc: "In the 16th century, the Oromo peoples begin a great migration — respond to this historic movement of peoples."
 eth_agaw_people: "Govern the Agaw"
 eth_agaw_people_desc: "The Agaw, ancient inhabitants of the Ethiopian highlands — govern them as subjects of the empire while respecting their culture."
 eth_beta_israel: "Coexistence with Beta Israel"
 eth_beta_israel_desc: "Beta Israel, the Ethiopian Jews also known as 'Falasha' — build a path of coexistence with them."
 eth_horn_hegemony: "Hegemony over the Horn of Africa"
 eth_horn_hegemony_desc: "As an empire uniting the Sidama, Oromo, Agaw, and Beta Israel, claim hegemony over the Horn of Africa."
 eth_nubian_alliance: "Alliance with Nubia"
 eth_nubian_alliance_desc: "Makuria and Alodia, the Coptic states to the north — forge alliances with these brethren of the same faith."
 eth_conquer_makuria: "Annex Makuria"
 eth_conquer_makuria_desc: "Makuria, the Coptic kingdom that once flourished along the Nile — protect or annex this now-declining state."
 eth_conquer_alodia: "Annex Alodia"
 eth_conquer_alodia_desc: "Alodia, the Coptic kingdom of southern Nubia — bring this land into Ethiopia's domain."
 eth_sudan_dominion: "Establish Dominion over Sudan"
 eth_sudan_dominion_desc: "From the Nile valley to the Nubian desert — establish Ethiopian dominion over this vast land."
 eth_mamluk_rivalry: "Rivalry with the Mamluks"
 eth_mamluk_rivalry_desc: "The Mamluk Sultanate ruling Egypt — as protector of the Copts, settle the rivalry with them."
 eth_liberate_jerusalem: "Liberate Jerusalem"
 eth_liberate_jerusalem_desc: "The Holy City of Jerusalem — liberate this land to protect the worship rights of the Copts."
 eth_coptic_patriarchate: "Command the Coptic Patriarchate"
 eth_coptic_patriarchate_desc: "The Coptic Patriarchate of Alexandria — bring its authority under Ethiopian control."
 eth_protector_of_copts: "Protector of the Copts"
 eth_protector_of_copts_desc: "To Copts scattered across the world, the Ethiopian Emperor is their last protector — fulfill this role."
 eth_adal_wars: "The Adal Wars"
 eth_adal_wars_desc: "The Adal Sultanate, the Islamic state on the Red Sea coast — face war with this longtime rival."
 eth_conquer_zeila: "Conquer Zeila"
 eth_conquer_zeila_desc: "Zeila, Adal's vital port city — conquer it, and gain a foothold in Red Sea trade."
 eth_conquer_harar: "Conquer Harar"
 eth_conquer_harar_desc: "Harar, a center of Islamic scholarship — conquer this holy city."
 eth_conquer_adal: "Conquer Adal"
 eth_conquer_adal_desc: "Put an end to the threat of 'Ahmad the Left-Handed' (Gragn), and conquer the longtime rival Adal Sultanate."
 eth_somali_coast: "Secure the Somali Coast"
 eth_somali_coast_desc: "The Somali coastline — sweep away the remnants of Adal, and secure this land."
 eth_red_sea_access: "Access to the Red Sea"
 eth_red_sea_access_desc: "Secure the port of Massawa, and open the long-awaited path to the sea for landlocked Ethiopia."
 eth_portuguese_contact: "Contact with the Portuguese"
 eth_portuguese_contact_desc: "The Portuguese, seeking the legendary land of 'Prester John' — contact with them brings a new age to Ethiopia."
 eth_massawa_port: "Develop the Port of Massawa"
 eth_massawa_port_desc: "Massawa, the port city on the Red Sea — develop it as a gateway for foreign trade."
 eth_firearms_adoption: "Adopt Firearms"
 eth_firearms_adoption_desc: "With Portuguese support, introduce muskets and cannon into the Ethiopian army."
 eth_european_trade: "Trade with Europe"
 eth_european_trade_desc: "Through Massawa, invigorate trade with the nations of Europe."
 eth_modernize_army: "Modernize the Army"
 eth_modernize_army_desc: "Building on firearms and European trade, transform the Ethiopian army into a modern military force."
 eth_aksum_heritage: "The Legacy of Aksum"
 eth_aksum_heritage_desc: "The Aksumite Empire, which once flourished through Red Sea trade — secure its holy city, and inherit the memory of its glory."
 eth_reclaim_aksum: "Revive Tigray"
 eth_reclaim_aksum_desc: "Tigray, the birthplace of the Aksumite Empire — revive this region as the empire's core territory."
 eth_red_sea_empire: "Rebuild the Red Sea Empire"
 eth_red_sea_empire_desc: "The Red Sea trading empire once built by Aksum — revive it in the present age."
 eth_horn_unification: "Unify the Horn of Africa"
 eth_horn_unification_desc: "Through the integration of Cushitic peoples and the revival of the Red Sea empire — unite the entirety of the Horn of Africa under Ethiopia's banner."
 eth_new_solomonic_empire: "The New Solomonic Empire"
 eth_new_solomonic_empire_desc: "Protector of the Copts, a modernized army, and a unified Horn of Africa — the bloodline of the Queen of Sheba and King Solomon is here completed as a new empire."
 eth_events.1.t: "Jerusalem Liberated"
 eth_events.1.d: "The Holy City of Jerusalem has returned to Coptic hands. For brethren scattered across the world, this day will be remembered forever."
 eth_events.1.a: "Glory to God!"
 eth_events.99.t: "Declaration of the New Solomonic Empire"
 eth_events.99.d: "A small highland kingdom has been reborn as a great empire — protector of the Copts, master of the Red Sea, ruler of the Horn of Africa. The bloodline of the Queen of Sheba and King Solomon is here completed."
 eth_events.99.a: "Glory to Ethiopia! Long live the New Solomonic Empire!"
