l_russian:
 pro_jewel_of_occitania_mission_pack: "Jewel of Occitania"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION: "As descendants of the Capetian House of Anjou, the Counts of Provence hold claims on Naples, Sicily, Aragon, Hungary, and Jerusalem. Develop Marseille into the Mediterranean's greatest port city, unite Occitania, and demonstrate the Anjou dynasty's legitimate inheritance rights to the world. The glory of 'King of Kings' awaits."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION: "As the Count of Provence, realize the inheritance rights of the House of Anjou, unite Occitania, and conquer France."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP: "Complete missions to become King of Kings."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS: "Rule the world from Marseille!"
 pro_house_of_anjou: "Ambitions of the House of Anjou"
 pro_house_of_anjou_desc: "The Capetian House of Anjou once flourished as the royal house of Sicily, Naples, and Hungary, but now retains only the County of Provence in southern France. Yet King René's heart harbors dreams of many royal claims. The time has come to reclaim glory from the soil of Provence."
 pro_house_of_anjou_tooltip: "No requirements"
 pro_statutes_of_aix: "Statutes of Aix"
 pro_statutes_of_aix_desc: "Aix-en-Provence, as the capital of the County of Provence, has developed its own legal system known as the 'Statutes of Aix.' The establishment of control and legal codification unlocks two unique institutions: the Etats de Provence (Estates General) and the Free Port of Marseille."
 pro_statutes_of_aix_tooltip: "Average control in the home region (average_control_in_home_region) is 50% or higher"
 pro_sponsor_the_arts: "Sponsor the Arts"
 pro_sponsor_the_arts_desc: "King René is renowned as one of the greatest patrons of the Italian Renaissance. Invite artists and scholars and make Provence the western center of Renaissance culture."
 pro_sponsor_the_arts_tooltip: "Has embraced the Renaissance and owns 1 or more theaters"
 pro_develop_marseille: "Develop Marseille"
 pro_develop_marseille_desc: "Marseille, the port city founded by the ancient Greeks, is a key hub of Mediterranean trade. Developing this city marks Provence's first step toward becoming a commercial and maritime power."
 pro_develop_marseille_tooltip: "Marseille has development 35 or higher and population 30 or more pops"
 pro_toulon_dockyard: "Toulon Dockyard"
 pro_toulon_dockyard_desc: "Toulon, a magnificent natural harbor, is one of the finest naval positions in the Mediterranean. Construct a grand dockyard and arsenal here to make it the home port of the Provencal fleet."
 pro_toulon_dockyard_tooltip: "Toulon has a dock, and navy size is 10 or more"
 pro_lords_of_the_rhone: "Lords of the Rhône Corridor"
 pro_lords_of_the_rhone_desc: "The Rhône River is a vital transport and trade route connecting the Alps to Provence. Fully mastering this corridor establishes Provence as the undisputed ruler of southern France."
 pro_lords_of_the_rhone_tooltip: "Own 20 or more locations in the Provence area"
 pro_avignon_question: "The Avignon Question"
 pro_avignon_question_desc: "Avignon, the seat of the Papacy from 1309 to 1377, still exists as a Papal enclave. Bring this city into Provence by diplomacy or conquest."
 pro_avignon_question_tooltip: "Avignon is directly owned, the Papal States do not exist, or the Papal States have an opinion of 150 or higher toward us"
 pro_piqure_de_marseilles: "Piqure de Marseilles"
 pro_piqure_de_marseilles_desc: "The 'piqué de Marseille,' an intricate quilted fabric, represents Provence's sophisticated textile craftsmanship. Expanding cloth and fine cloth production brings great wealth to Provence."
 pro_piqure_de_marseilles_tooltip: "Produce 5 or more cloth or fine cloth nationally"
 pro_la_marseillaise: "La Marseillaise"
 pro_la_marseillaise_desc: "The march sung by volunteers departing from Marseille. The Provencal army is now the strongest military force in southern France."
 pro_la_marseillaise_tooltip: "Army size 15 or more, monthly army tradition growth 0.05 or more"
 pro_claims_of_king_rene: "The Claims of King René"
 pro_claims_of_king_rene_desc: "Good King René was tragically ejected from the Neapolitan throne and denied the crown of Aragon. But the legitimate inheritance rights of the House of Anjou are not lost. The time has come to demonstrate these rights to the world."
 pro_claims_of_king_rene_tooltip: "Own 20 or more locations"
 pro_king_of_naples: "King of Naples"
 pro_king_of_naples_desc: "The Neapolitan throne is the legitimate inheritance of the House of Anjou. Reclaim this seat wrested away by the Trastamara dynasty of Aragon and rebuild Angevin rule in southern Italy."
 pro_king_of_naples_tooltip: "Naples is owned by us or a subject, or Naples is a subject, or we are in a personal union with Naples"
 pro_king_of_sicily: "King of Sicily"
 pro_king_of_sicily_desc: "The great Kingdom of Sicily, once built by the Normans, was also inherited by the House of Anjou. Bring Sicily once more under the banner of Provence."
 pro_king_of_sicily_tooltip: "Own 10 or more locations in the Sicily area"
 pro_king_of_aragon: "King of Aragon"
 pro_king_of_aragon_desc: "The Aragonese throne is held by the House of Anjou's greatest rival. Take revenge on the Trastamara dynasty that stole Naples and seize dominance over the Iberian Peninsula."
 pro_king_of_aragon_tooltip: "Aragon is a subject, or we are in a personal union with Aragon, or Barcelona is owned by us or a subject"
 pro_king_of_hungary: "King of Hungary"
 pro_king_of_hungary_desc: "The House of Anjou once ruled as Hungary's royal house. Reclaim this throne lost at the end of the 14th century and establish influence over Eastern Europe."
 pro_king_of_hungary_tooltip: "Hungary is a subject or does not exist, or own 5 or more locations in Transdanubia"
 pro_king_of_jerusalem: "King of Jerusalem"
 pro_king_of_jerusalem_desc: "The title of 'King of Jerusalem' has long been claimed by the House of Anjou. Put an end to this hollow title by actually conquering the Holy City and becoming the guardian of the Christian world."
 pro_king_of_jerusalem_tooltip: "Jerusalem is owned by us or a subject, and own 3 or more locations in the Levant area (→ triggers KOJ formation event)"
 pro_integrate_lorraine: "Integrate Lorraine"
 pro_integrate_lorraine_desc: "The Duchy of Lorraine is one of the few titles the House of Anjou managed to retain. Integrate the various factions and bring Lorraine fully under Provencal control."
 pro_integrate_lorraine_tooltip: "Nancy is owned by us or a subject, and own 5 or more locations in the Lorraine area"
 pro_join_the_empire: "Join the Empire"
 pro_join_the_empire_desc: "Joining the Holy Roman Empire is a wise diplomatic choice to shelter Provence from the threats of great powers. Alternatively, leading the Empire as its Archduke is also an option."
 pro_join_the_empire_tooltip: "Member of the HRE, leader of the HRE, or the HRE does not exist"
 pro_unite_occitania: "Unite Occitania"
 pro_unite_occitania_desc: "The Occitan-speaking people of southern France are exhausted from the Albigensian Crusade and the Hundred Years' War. Unite Occitania under the banner of the Counts of Provence and liberate them from French rule."
 pro_unite_occitania_tooltip: "Own 15 or more locations in Languedoc and 20 or more locations in the Provence area"
 pro_gascony: "Gascony"
 pro_gascony_desc: "Gascony, centered on Bordeaux, is a rich land with historical ties to England. Controlling Toulouse and Bordeaux seizes all of southern France."
 pro_gascony_tooltip: "Bordeaux and Toulouse are owned by us or a subject"
 pro_king_of_france: "King of France"
 pro_king_of_france_desc: "The Kingdom of France has long been Provence's rival, but the time to seize its throne has come. Conquer Paris and raise the Angevin banner across all of France."
 pro_king_of_france_tooltip: "Paris is owned by us or a subject, or France does not exist; own 30 or more locations in the France region"
 pro_king_of_kings: "King of Kings"
 pro_king_of_kings_desc: "The House of Anjou has conquered Naples, Sicily, Aragon, Hungary, Jerusalem, and France. This empire bearing many crowns is ruled by the King of Kings — a medieval dream made real."
 pro_king_of_kings_tooltip: "Own 400 or more locations and have a total population of 5,000 pops or more"
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Statutes of Aix"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "The Counts of Provence based in Aix-en-Provence developed their own legal code drawing on Roman law traditions. This written law codified the rights and duties of the nobility, clergy, and burghers, making Provence one of the most legally advanced regions in medieval France."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Patronage of the Arts"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "King René himself wielded the paintbrush and composed poetry — a rare ruler-artist. His court inherited the troubadour tradition of Provence while attracting artists from Flanders and Italy. Much of his reputation as 'Good King René' rests on this extraordinary cultural patronage."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Prosperity of Marseille"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "Founded as Massalia by Greek colonists from Phocaea around 600 BC, Marseille has been a Mediterranean trade hub since antiquity. During the Crusades it served as the primary staging point for men and materiel bound for the Holy Land. This ancient port city is the economic heart of Provence."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "Toulon Dockyard"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "The Bay of Toulon, a magnificent natural harbor sheltered by hills, has offered refuge to sailors since antiquity. The Counts of Provence developed this natural stronghold as a naval base in the 15th century. Louis XIV would later build one of Europe's greatest naval arsenals here — a legacy already taking root."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Lords of the Rhône Corridor"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "The Rhône River has been the great artery linking the Mediterranean to inland France since Roman times. Along this waterway stand Arles, Avignon, and countless trading towns through which goods, armies, and pilgrims have flowed for centuries. To control this corridor is to hold the strategic heart of Provence."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Avignon Integrated"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "From 1309 to 1377, seven popes resided in Avignon rather than Rome in what became known as the 'Avignon Papacy.' This peculiar episode transformed Avignon into one of Europe's greatest diplomatic cities. The memory of the papal court still lingers in this city — seizing it carries profound symbolic weight for the Catholic world."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "Piqure de Marseilles"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "The 'piqué de Marseille,' a quilted fabric with intricate stitching on both faces, swept across Europe in the 17th and 18th centuries. Its roots lie in the skilled medieval textile workers of Provence. The fine cloth exported through Marseille's port has long formed a cornerstone of Provence's commercial reputation."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "La Marseillaise"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "The song sung by Marseille volunteers marching to Paris during the Revolution would one day become France's national anthem. But the warrior spirit of Provence is older still — tempered in the jousting arenas of Arles, the Crusades, and countless campaigns under the Angevin banner across the Mediterranean."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "Claims of King René"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "'Good King René' held claims to Naples, Sicily, Aragon, Hungary, and Jerusalem, yet lost nearly all his wars. Still, his tenacious assertion of those titles — maintained through decades of diplomacy and artistic patronage — kept the Anjou dynasty's legitimacy alive in the courts of Europe."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Title of King of Naples"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "The Angevin Kingdom of Naples, founded by Charles I of Anjou in 1266, was once the dominant power of southern Italy. Though Sicily was lost in the Sicilian Vespers, Naples remained the crown jewel of French ambitions in Italy and the most tangible symbol of Angevin authority on the peninsula."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Title of King of Sicily"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "The Sicilian Vespers of 1282 — when the islanders rose and massacred their French rulers to the ringing of church bells — drove the Angevins from Sicily forever and brought in the Aragonese. But this island, where Norman, Arab, and Byzantine cultures once flowered together, remains the Angevins' greatest unfinished dream."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Title of King of Aragon"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "The Crown of Aragon built a Mediterranean empire spanning Sicily, Sardinia, and Naples — and did so largely at Angevin expense. More than a century of rivalry between these two dynasties shaped the politics of the western Mediterranean. Seizing Aragon's crown from the hands of the Trastamara is the ultimate revenge."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Title of King of Hungary"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "When Charles Robert (Carobert) of Anjou became King of Hungary in 1310, a branch of the family established itself in Central Europe as a great power. Under the Anjou dynasty, Hungary experienced one of its most prosperous eras before the Habsburgs and Ottomans reshaped the region."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Title of King of Jerusalem"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "When Godfrey of Bouillon led the First Crusade to victory in 1099, the Kingdom of Jerusalem was born. Lost to Saladin in 1187 and never fully recovered, the title 'King of Jerusalem' became a hollow claim passed among European dynasties. The House of Anjou has long held this title — now it becomes real."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Lorraine Integrated"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "Lorraine (Lothringen) has been a contested borderland since the Treaty of Verdun divided Charlemagne's empire. René I's father Louis II held the Duchy of Lorraine, and René himself was Duke of Lorraine before inheriting Provence. This ancient duchy bridges the French and German worlds."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "Imperial Diplomacy"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "The Holy Roman Empire has long bordered Provence, and through Lorraine the House of Anjou already has ties to the imperial world. Whether joining as a member or leading as Archduke, embedding Provence within the Empire's complex web of alliances greatly expands its diplomatic reach."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "Union of Occitania"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "The Occitan-speaking south was once home to the troubadours — poets who invented the art of courtly love and whose songs spread across Europe. The Albigensian Crusade of the 13th century and the Hundred Years' War shattered this world. To unite Occitania under Provence is to rekindle a lost civilization."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Gascony Seized"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "Gascony, centered on the great wine port of Bordeaux, was England's last significant continental possession — held for three centuries before being lost in 1453. Rich in wine, wool, and Atlantic trade, this region has always been a prize. Wresting it from English influence completes the southern arc of a Provencal France."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Title of King of France"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "The Capetian dynasty of France and its Angevin cadet branch share common blood — yet their paths diverged when Charles of Anjou sailed south to conquer Sicily. Now the cadet branch seizes the throne of the main line. The 'Most Christian King' of France, eldest son of the Church, wears the most prestigious crown in Catholic Christendom."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "King of Kings"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Naples, Sicily, Aragon, Hungary, Jerusalem, France — no medieval dynasty ever wore so many crowns simultaneously. The House of Anjou has risen from a minor Provencal county to an empire stretching from the Mediterranean to the Danube. The dream of 'Good King René' — dismissed as an impossible fantasy — stands fulfilled."
 pro_events.1.t: "Ambitions of the House of Anjou"
 pro_events.1.d: "As descendants of the Capetian House of Anjou, René I, Count of Provence, claims inheritance rights to many thrones. Naples, Sicily, Aragon, Hungary, Jerusalem — all these seats are the legitimate patrimony of the House of Anjou. Yet reality is harsh. Provence is a small county, and many of these claims exist only on paper. But King René refuses to abandon his dreams. Loving the arts, composing poetry, and facing the realities of politics, he seeks to change the world from this small jewel of a country."
 pro_events.1.a: "Provence, demonstrate your glory!"
 pro_events.2.t: "The Claims of King René"
 pro_events.2.d: "The time has come to declare the legitimate inheritance rights of the House of Anjou. The Kingdom of Naples was once Angevin, but was lost to defeat by Alfonso V's Aragonese forces. Now, in the name of King René, we contest this unjust occupation. Obtain the casus belli against Naples and prove the legitimacy of the House of Anjou by force of arms."
 pro_events.2.a: "Naples belongs to the House of Anjou!"
 pro_lorraine_marriage: "Marriage with Lorraine"
 pro_lorraine_marriage_desc: "The Duchy of Lorraine is one of the titles the House of Anjou once held. Deepen ties with the House of Lorraine through diplomatic marriage and alliance, opening the path to its enfeoffment. Establish relations with Lorraine through bloodline, marriage, or alliance."
 pro_lorraine_marriage_tooltip: "Have a royal marriage with Lorraine (c:LOR), or Lorraine does not exist, or be allied with Lorraine and it has an opinion of 200 or higher toward us"
 pro_events.3.t: "The Reign of Robert the Wise"
 pro_events.3.d: "As of 1337, Provence is governed by Robert of Anjou (Roberto d'Angiò, c.1277–1343), celebrated as 'the Wise.' As King of Naples, titular King of Jerusalem, and Count of Provence, he stands as the central figure of Italian politics. The champion of the Guelf (pro-papal) party who repelled imperial invasions, in 1336 he drove John of Bohemia out of Italy. A deep lover of arts and scholarship, respected by Petrarch and Boccaccio alike, Robert brought a cultural golden age to Naples and Provence. But his final years are troubled by the failure to reclaim Sicily and a succession crisis. Robert's heir Joanna is young, and the future of the House of Anjou is uncertain. The time has come to carry on the will of this great king and restore the glory of the House of Anjou."
 pro_events.3.a: "Carry on King Robert's will and restore the glory of Anjou!"
 pro_events.4.t: "Marriage with Lorraine"
 pro_events.4.d: "Through diplomatic maneuvering and marriage policy, our relationship with the Duchy of Lorraine has become stronger than ever before. With Angevin and Lorrainese blood intertwining, the interests of both houses are deeply bound together. The time has come to receive the Duke of Lorraine as a vassal of Provence and put his resources and military power to use in the Angevin cause."
 pro_events.4.a: "Receive the Duke of Lorraine as a vassal"
 pro_events.4.b: "Maintain independence while preserving the alliance"
 pro_events.5.t: "Formation of the Kingdom of Jerusalem"
 pro_events.5.d: "The Holy City of Jerusalem has finally come under the banner of Provence. The House of Anjou now holds the title of 'King of Jerusalem' in both name and deed, carrying on the crusader tradition. Reestablish the Kingdom of Jerusalem (KOJ) in the key positions of the Levant and have it governed as a vassal of Provence. This sacred kingdom, first founded by the First Crusade in 1099, is reborn by the hand of the House of Anjou. As guardian of the Catholic faith, defend the Holy Land against Islamic forces."
 pro_events.5.a: "Reestablish the Kingdom of Jerusalem and have it governed as an Angevin vassal!"
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "The Estates General of Provence, in which the nobility, clergy, and burghers participate. Strengthens the three estates and guarantees regional autonomy and consultative governance. Also improves cabinet efficiency."
 pro_marseille_free_port_town_rights: "Free Port of Marseille"
 pro_marseille_free_port_town_rights_desc: "Declares Marseille a free port. Greatly expands merchant trading rights and raises population growth, prosperity, and burgher power. Can only be granted to Marseille."
 STATIC_MODIFIER_NAME_pro_etats_de_provence_unlock_mod: "Unlock Town Right: Etats de Provence"
 STATIC_MODIFIER_DESC_pro_etats_de_provence_unlock_mod: "The Etats de Provence town right is now available to grant. The Estates of Provence — gathering the three orders of nobility, clergy, and commons — embodied the region's proud tradition of consultative self-governance, distinct from the centralized monarchy of northern France."
 STATIC_MODIFIER_NAME_pro_marseille_port_unlock_mod: "Unlock Town Right: Free Port of Marseille"
 STATIC_MODIFIER_DESC_pro_marseille_port_unlock_mod: "The Free Port of Marseille town right is now available to grant to Marseille. Since Greek colonists first laid anchor here, Marseille has thrived because traders from every corner of the Mediterranean could do business freely in its harbor."
 pro_events.6.t: "Resolution of the Avignon Question"
 pro_events.6.d: "Avignon has stood as a papal enclave within Provençal territory since the papacy took up residence there in 1309. When Pope Gregory XI returned to Rome in 1377, the city remained as a papal holdout, driving a wedge into Provençal lands that the Count of Provence has long resented. Now, with relations with the papacy in order, the opportunity has come to resolve the Avignon question peacefully. The Pope agrees to cede Avignon to Provence in exchange for appropriate compensation."
 pro_events.6.a: "Avignon belongs to Provence"
