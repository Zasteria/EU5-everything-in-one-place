 flo_events.1.t: "Подъём Флорентийской коммуны"
 flo_events.1.d: "В 1337 году Флоренция зажата в долгой борьбе гвельфов и гибеллинов. Великие банки семейств Барди и Перуцци, отягощённые огромными займами английскому королю, начинают шататься. С востока ползёт тень Чёрной смерти, и есть те, кто замышляет призвать тирана Готье де Бриенна. И всё же дух флорентийской коммуны — самоуправляемого города купцов — жив. Опираясь на суконную торговлю и купеческие цеха, переживите эту бурную эпоху."
 flo_events.1.a: "Будущее Флоренции в наших руках"
 flo_events.3.t: "После заговора Пацци"
 flo_events.3.d: "Покушение на Лоренцо Медичи, за которым стояли папа Сикст IV и семейство Пацци, провалилось и, как ни странно, лишь укрепило власть Медичи. Заговорщики казнены, а горожане Флоренции ещё твёрже поддерживают Медичи. Пережив это испытание, политическое устройство республики готово переродиться во что-то более утончённое."
 flo_events.3.a: "Испытание сделало нас сильнее"
 flo_events.4.t: "Поход на Рим"
 flo_events.4.d: "Древняя столица Римской империи стоит теперь под знаменем Флоренции. Константинов дар уже разоблачён как подделка — а раз так, законное право править Италией принадлежит Флоренции, добытое силой и мудростью. Эта маленькая республика, рождённая городом купцов, идёт теперь путём империи, чьё имя будет высечено в истории."
 flo_events.4.a: "Рим сияет славой Флоренции"
