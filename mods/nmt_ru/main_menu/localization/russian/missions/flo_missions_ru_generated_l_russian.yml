l_russian:
 flo_magnifico_mission_pack: "Наследие Великолепного"
 flo_magnifico_mission_pack_DESCRIPTION: "Флорентийская республика под рукой необыкновенного дома Медичи ведёт за собой всю Европу в торговле, искусстве и учёности. Станете ли вы строить на огромных богатствах суконной торговли и банка Медичи, расцветая колыбелью Возрождения? Или объедините Тоскану, двинетесь на Рим и станете хозяином Италии — Великолепным? Во Флоренции сходятся мудрость купца и честолюбие государя."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION: "Выполните задания за Флоренцию и добейтесь и расцвета торговли и культуры, и завоевания Италии."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP: "Выполняйте задания, чтобы пройти путём Великолепного."
 flo_magnifico_mission_pack_BUTTON_DETAILS: "Пусть расцветёт Возрождение — овладейте Тосканой и станьте государем Италии!"
 flo_rise_of_the_commune: "Подъём коммуны"
 flo_rise_of_the_commune_desc: "В 1337 году Флоренция выросла в «коммуну» — самоуправляемый город-государство купцов и ремесленников — посреди борьбы гвельфов (сторонников папы) и гибеллинов (сторонников императора). Банки Барди и Перуцци господствуют в финансах Европы, а суконная торговля на Арно обогащает город. Но распри партий внутри не утихают. Переживите это смутное время и приведите Флоренцию к подлинному величию."
 flo_rise_of_the_commune_tooltip: "Без условий"
 flo_the_prince: "Государь"
 flo_the_prince_desc: "Во время Итальянских войн, когда чужеземные державы разоряли Италию, флорентийский дипломат Никколо Макиавелли написал «Государя». Этот переворотный труд, трезво взглянувший на политическую действительность, выразил глубокую тоску по новому правителю, способному объединить Италию."
 flo_the_prince_tooltip: "Идут Итальянские войны"
 flo_arte_della_lana: "Суконное дело"
 flo_arte_della_lana_desc: "Арте делла Лана — цех торговцев шерстью — сердце флорентийского хозяйства. Ввозя английскую шерсть и вывозя готовое сукно по всей Европе, он создаёт богатство, на котором держится величие города."
 flo_arte_della_lana_tooltip: "Производить по всей державе 5 или больше шерсти или сукна"
 flo_medici_bank: "Основание банка Медичи"
 flo_medici_bank_desc: "Банк, основанный семейством Медичи, служит казначеем римского папства, а его отделения раскинулись по всей Европе. Эта финансовая мощь — основа, на которой Флоренция вершит своё влияние и в культуре, и в политике."
 flo_medici_bank_tooltip: "Владеть 3 или больше конторами"
 flo_arno_renewal: "Обновление Арно"
 flo_arno_renewal_desc: "С ростом города продвинулись работы на Арно, и Флоренция стала одним из богатейших городов Италии. Высокое развитие надолго ускоряет ежемесячный рост города."
 flo_arno_renewal_tooltip: "Развитие Флоренции 50 или выше"
 flo_arno_corridor: "Коридор на Арно"
 flo_arno_corridor_desc: "Понте Веккьо и каналы через Арно — торговые и управленческие артерии Флоренции. Мосты и водные пути ускорят развитие города."
 flo_arno_corridor_tooltip: "Во Флоренции есть мост и шлюзовой канал"
 flo_arno_trade_network: "Торговая сеть Арно"
 flo_arno_trade_network_desc: "Торговая сеть, протянувшаяся по Тоскане вдоль Арно, — источник торговой мощи Флоренции. Господствуя в ней, мы подчиним себе всю торговлю Северной Италии."
 flo_arno_trade_network_tooltip: "Владеть 15 или больше районами в области Тоскана"
 flo_dominate_italian_trade: "Господство в итальянской торговле"
 flo_dominate_italian_trade_desc: "Торговая сеть Флоренции покрывает теперь всю Италию. С севера до юга итальянское хозяйство не может обойтись без флорентийских купцов."
 flo_dominate_italian_trade_tooltip: "Владеть 2 или больше рыночными центрами"
 flo_duomo_di_firenze: "Санта-Мария-дель-Фьоре"
 flo_duomo_di_firenze_desc: "Завершение купола Брунеллески — свершение, раздвинувшее пределы строительного искусства своего времени. Его великий купол наполняет флорентийцев глубокой гордостью и стал вечным символом города."
 flo_duomo_di_firenze_tooltip: "Произошло событие «Флорентийский собор» (flavor_flo.28)"
 flo_birthplace_of_renaissance: "Родина Возрождения"
 flo_birthplace_of_renaissance_desc: "Флоренция как родина Возрождения ведёт за собой духовное обновление всей Европы. Дух возвращения к классической древности и гуманизм прочно укоренились в этом городе."
 flo_birthplace_of_renaissance_tooltip: "Институт «Возрождение» принят"
 flo_florentine_school_of_painting: "Флорентийская школа живописи"
 flo_florentine_school_of_painting_desc: "Флорентийская живопись, утверждённая Боттичелли и его современниками, опережает всю Европу в перспективе и правдоподобии."
 flo_florentine_school_of_painting_tooltip: "Произошло событие «Сандро Боттичелли» (flavor_flo.33)"
 flo_the_mona_lisa: "Мона Лиза"
 flo_the_mona_lisa_desc: "Шедевр Леонардо да Винчи изменил само понятие живописи. Нет равных художественной почве Флоренции, что снова и снова рождает такие дарования."
 flo_the_mona_lisa_tooltip: "Произошло событие (flavor_flo.45)"
 flo_uffizi: "Уффици"
 flo_uffizi_desc: "Собрав воедино коллекцию искусства, накопленную семейством Медичи, Уффици может стать величайшим музеем мира. Его культурный престиж навсегда возвысит имя Флоренции."
 flo_uffizi_tooltip: "Возрождение принято, и задание «Уффици и коридор Вазари» выполнено"
 flo_the_rise_of_medici: "Возвышение Медичи"
 flo_the_rise_of_medici_desc: "После краха Барди и Перуцци поднималась новая банкирская династия — Медичи. Банк Медичи, основанный в 1397 году Джованни ди Биччи де Медичи, быстро рос благодаря связям с римским папством и раскинул отделения по всей Европе. Этому семейству нести будущее Флоренции."
 flo_the_rise_of_medici_tooltip: "Произошло событие «Банк Медичи» (flavor_flo.57)"
 flo_pazzi_conspiracy: "Заговор Пацци"
 flo_pazzi_conspiracy_desc: "Покушение на Лоренцо Медичи, за которым стояли папа Сикст IV и семейство Пацци, провалилось и, как ни странно, лишь укрепило власть Медичи."
 flo_pazzi_conspiracy_tooltip: "Произошло событие «Заговор Пацци» (flavor_flo.20)"
 flo_machiavelli: "Сочинения Макиавелли"
 flo_machiavelli_desc: "В «Государе» Никколо Макиавелли хладнокровно разобрал природу власти. Его мысль глубоко повлияла на флорентийскую политическую философию."
 flo_machiavelli_tooltip: "Произошло событие «Макиавелли» (flavor_flo.46)"
 flo_republic_of_virtue: "Республика доблести"
 flo_republic_of_virtue_desc: "Флоренция стремится быть не просто торговым государством, а государством, основанным на доблести и республиканских идеалах. Легитимность и стабильность — краеугольные камни республики."
 flo_republic_of_virtue_tooltip: "Легитимность 75% или выше, стабильность 1 или выше"
 flo_camerata_fiorentina: "Флорентийская камерата"
 flo_camerata_fiorentina_desc: "Камерата, где собираются флорентийские мыслители и музыканты, становится очагом музыкальных новшеств, из которых родится опера. Город, где искусство и наука цветут заодно."
 flo_camerata_fiorentina_tooltip: "В столице есть художественная школа (art_school)"
 flo_subjugate_pisa: "Подчинить Пизу"
 flo_subjugate_pisa_desc: "Пизу, портовый город, который Флоренция издавна жаждет как ворота к морю, нужно взять. Овладев этой гаванью на Арно, Флоренция сильно раздвинет свою торговлю."
 flo_subjugate_pisa_tooltip: "Пиза принадлежит нам или нашему подданному"
 flo_siena_submitted: "Покорение Сиены"
 flo_siena_submitted_desc: "Наша давняя соперница Сиена наконец покорена. Позор Монтаперти отомщён: Флоренция принимает её торговцев шёлком и банкиров и берёт под полный контроль южную Тоскану."
 flo_siena_submitted_tooltip: "Сиена принадлежит нам или нашему подданному"
 flo_lucca_absorbed: "Лукка присоединена"
 flo_lucca_absorbed_desc: "Лукка, долго оберегавшая свою независимость, — один из последних заслонов на пути Флоренции к объединению Тосканы. Её шёлковое дело переходит под власть Флоренции."
 flo_lucca_absorbed_tooltip: "Лукка принадлежит нам или нашему подданному"
 flo_unify_tuscany: "Объединить Тоскану"
 flo_unify_tuscany_desc: "Теперь, когда почти вся Тоскана под властью Флоренции, возведение в королевство — естественное следствие. Флоренция больше не просто город-государство."
 flo_unify_tuscany_tooltip: "Владеть 25 или больше районами в области Тоскана"
 flo_push_into_lombardy: "Натиск на Ломбардию"
 flo_push_into_lombardy_desc: "Пришло время раздвинуть владения за пределы Тосканы, в самое сердце Северной Италии. Столкновение с Миланом, Генуей и Венецией неизбежно."
 flo_push_into_lombardy_tooltip: "Владеть 40 или больше районами в регионе Италия"
 flo_march_on_rome: "Поход на Рим"
 flo_march_on_rome_desc: "Кто владеет Римом, тот владеет Италией. Взяв древнюю столицу Римской империи, Флоренция заявляет права на легитимность, с которой никто не сравнится."
 flo_march_on_rome_tooltip: "Рим принадлежит нам или нашему подданному"
 flo_the_new_rome: "Новый Рим"
 flo_the_new_rome_desc: "Флоренция, покорившая Рим, господствует теперь над большей частью Апеннинского полуострова и стала империей. Пришло время строить новый Рим."
 flo_the_new_rome_tooltip: "Владеть 80 или больше районами в регионе Италия"
 flo_il_magnifico_of_italy: "Великолепный всей Италии"
 flo_il_magnifico_of_italy_desc: "Как Лоренцо Медичи звали «Великолепным», так теперь вся Флоренция стала «Великолепной» для Италии."
 flo_il_magnifico_of_italy_tooltip: "Владеть 150 или больше районами в регионе Италия"
 flo_medici_oriental_press: "Восточная типография Медичи"
 flo_medici_oriental_press_desc: "Типография, основанная семейством Медичи, собирает и печатает греческие рукописи, хлынувшие на Запад после падения Византийской империи. Древнее знание вновь вдыхает в Европу жизнь."
 flo_medici_oriental_press_tooltip: "Произошло событие «Восточная типография Медичи» (flavor_flo.8)"
 flo_clock_tower: "Часовая башня на площади Синьории"
 flo_clock_tower_desc: "Точные башенные часы на Палаццо делла Синьория стали символом флорентийского технического мастерства. Счёт времени делает торговлю и управление действеннее."
 flo_clock_tower_tooltip: "Произошло событие «Часовая башня Палаццо делла Синьория» (flavor_flo.27)"
 flo_michelangelo: "Воспитать Микеланджело"
 flo_michelangelo_desc: "Микеланджело, родившийся и выросший во Флоренции, оттачивал свой дар при дворе Лоренцо Медичи. Его скульптура и живопись — вершина искусства Возрождения."
 flo_michelangelo_tooltip: "Произошло событие «Микеланджело» (flavor_flo.1)"
 flo_first_modern_engineer: "Первый инженер нового времени"
 flo_first_modern_engineer_desc: "Филиппо Брунеллески, возводя купол, придумал переворотные способы строительства, превзошедшие Древний Рим. Его техническое наследие найдёт применение в крепостях по всей Италии."
 flo_first_modern_engineer_tooltip: "Произошло событие «Первый инженер нового времени» (flavor_flo.29)"
 flo_humiliate_venice: "Унизить Венецию"
 flo_humiliate_venice_desc: "Пришло время превзойти нашу давнюю морскую соперницу, Венецианскую республику. Поставив Царицу Адриатики на место, мы докажем, что первая держава Италии — Флоренция."
 flo_humiliate_venice_tooltip: "Соперничать с Венецией, иметь Венецию подданным, или Венеции не существует"
 flo_papal_relations: "Отношения с папством"
 flo_papal_relations_desc: "Теперь, когда Рим в наших руках, отношения с папством нужно поставить на прочную основу. Союзом ли, господством ли — Флоренция станет величайшим покровителем Римской церкви."
 flo_papal_relations_tooltip: "Быть в союзе с Папской областью, иметь её подданной, или её не существует"
 flo_vasari_corridor: "Уффици и коридор Вазари"
 flo_vasari_corridor_desc: "Коридор Вазари, соединяющий дворец Уффици с Понте Веккьо, спроектировал Джорджо Вазари по приказу Козимо I Медичи. Этот тайный крытый переход над улицами — символ власти и художественного совершенства Медичи."
 flo_vasari_corridor_tooltip: "Произошло событие (flavor_flo.44)"
 flo_academy_of_florence: "Флорентийская академия"
 flo_academy_of_florence_desc: "Академия, основанная во Флоренции, стала местом всестороннего изучения искусства, науки и философии. Отсюда знание Возрождения расходится по всему миру."
 flo_academy_of_florence_tooltip: "Построено 5 или больше университетов (university)"
 flo_italian_cultural_hegemon: "Культурный гегемон Италии"
 flo_italian_cultural_hegemon_desc: "Флоренция, где торговля, искусство и учёность расцвели заодно, стала культурным средоточием всей Италии. Её влияние простирается даже за Альпы."
 flo_italian_cultural_hegemon_tooltip: "Владеть 60 или больше районами в регионе Италия, средний контроль в родном регионе 60% или выше"
 flo_magnifico: "Великолепный"
 flo_magnifico_desc: "Из города купцов Флоренция поднялась к вершине культуры, покорила всю Италию и утвердилась наследницей Римской империи. «Il Magnifico» — имя Великолепного навеки вписано в историю."
 flo_magnifico_tooltip: "Владеть 200 или больше районами"
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Расцвет суконного дела"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "Поддержка суконного дела навсегда повышает производительность шерсти и сукна на 10%."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Первенство банка Медичи"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "Основание банка Медичи навсегда снижает процент по займам на 1%."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "Торговая сеть Арно"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "Власть над торговой сетью Арно повышает силу торгового центра и скорость распространения досягаемости столицы."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Господство в итальянской торговле"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "Господство в итальянской торговле повышает силу торгового центра и дипломатическую репутацию."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Собор завершён"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "Завершение собора навсегда повышает культурные традиции, влияние и ежемесячный престиж."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Родина Возрождения"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "Гордость родины Возрождения повышает культурные традиции и мастерство новых творцов."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Флорентийская школа живописи"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "Новшества флорентийской живописи повышают культурные традиции и влияние."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "Потрясение от Моны Лизы"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Шедевр да Винчи сильно повышает мастерство новых творцов и увеличивает возможное число придворных творцов."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "Слава Уффици"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "Основание Уффици ускоряет рост культурных традиций на 10% и сдерживает убыль престижа."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Уроки «Государя»"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Мысль Макиавелли ускоряет создание шпионской сети и повышает дипломатическую репутацию."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "Республика доблести"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Республиканская стабильность повышает действенность мер по стабильности и скорость интеграции земель."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "Флорентийская камерата"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "Деятельность камераты повышает культурные традиции и ежемесячный престиж."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "Порт Пизы"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Завоевание Пизы навсегда повышает пригодность гавани Пизы и морское присутствие."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Покорение Сиены"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Покорение Сиены навсегда повышает власть правителя и наибольший контроль в Сиене."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Шёлк и сукно Лукки"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Господство над Луккой навсегда повышает производительность шёлка и сукна на 10%."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Хозяин Тосканы"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Объединение Тосканы ускоряет распространение влияния на дальние земли."
