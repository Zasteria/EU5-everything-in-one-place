l_russian:
 flo_magnifico_mission_pack: "Legacy of Il Magnifico"
 flo_magnifico_mission_pack_DESCRIPTION: "The Republic of Florence, under the extraordinary house of the Medici, leads all of Europe in commerce, art, and learning. Will you build upon the immense wealth generated by the wool trade and the Medici Bank, blossoming as the cradle of the Renaissance? Or will you unify Tuscany, march on Rome, and become the master of Italy — Il Magnifico? In Florence, the wisdom of the merchant and the ambition of the prince converge."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION: "Complete missions as Florence and achieve both flourishing commerce and culture and the conquest of Italy."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP: "Complete missions to walk the legacy of Il Magnifico."
 flo_magnifico_mission_pack_BUTTON_DETAILS: "Let the Renaissance bloom, master Tuscany, and become the lord of Italy!"
 flo_rise_of_the_commune: "Rise of the Commune"
 flo_rise_of_the_commune_desc: "In 1337, Florence has grown as a 'Comune' — a self-governing city-state of merchants and craftsmen — amid the struggle between the Guelph (papal faction) and the Ghibelline (imperial faction). The Bardi and Peruzzi banks dominate European finance, and the wool trade along the Arno enriches the city. Yet factional strife within is unceasing. Overcome this age of turmoil and lead Florence to true greatness."
 flo_rise_of_the_commune_tooltip: "No requirements"
 flo_the_prince: "The Prince"
 flo_the_prince_desc: "During the Italian Wars, as foreign powers ravaged Italy, the Florentine diplomat Niccolò Machiavelli wrote 'The Prince.' A revolutionary work that looked upon political reality with cold eyes, it expressed a deep longing for a new ruler who could unify Italy."
 flo_the_prince_tooltip: "The Italian Wars are active"
 flo_arte_della_lana: "Wool Industry"
 flo_arte_della_lana_desc: "The Arte della Lana — the wool merchant guild — is the core of the Florentine economy. Importing English wool and exporting finished cloth across Europe, it generates the wealth that makes the city great."
 flo_arte_della_lana_tooltip: "Produce 5 or more wool or cloth nationally"
 flo_medici_bank: "Establishment of the Medici Bank"
 flo_medici_bank_desc: "The bank founded by the Medici family functions as the official bank of the Roman papacy, with branches spread across Europe. This financial power is the foundation upon which Florence wields its influence in both culture and politics."
 flo_medici_bank_tooltip: "Own 3 or more counting houses"
 flo_arno_renewal: "Renewal of the Arno"
 flo_arno_renewal_desc: "As the city develops, works along the Arno have advanced, and Florence has become one of Italy's most prosperous cities. The high level of development brings a lasting boost to the city's monthly growth."
 flo_arno_renewal_tooltip: "Florence has a development level of 50 or higher"
 flo_arno_corridor: "The Corridor on the Arno"
 flo_arno_corridor_desc: "The Ponte Vecchio and the canals spanning the Arno River are the commercial and administrative arteries of Florence. Establishing bridges and water transport will accelerate the city's development."
 flo_arno_corridor_tooltip: "Florence has bridge infrastructure and pound lock canal infrastructure"
 flo_arno_trade_network: "Arno Trade Network"
 flo_arno_trade_network_desc: "The trade network stretching across Tuscany along the Arno River is the source of Florence's commercial might. By dominating this network, we can place the entire trade of northern Italy under our control."
 flo_arno_trade_network_tooltip: "Own 15 or more locations in the Tuscany area"
 flo_dominate_italian_trade: "Dominate Italian Trade"
 flo_dominate_italian_trade_desc: "Florence's commercial network now covers all of Italy. From north to south, the Italian economy cannot function without Florentine merchants."
 flo_dominate_italian_trade_tooltip: "Own 2 or more market centers"
 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "The completion of Brunelleschi's dome is an achievement that pushed the limits of the architectural technology of its day. Its great cupola fills the citizens of Florence with deep pride and has become the eternal symbol of the city."
 flo_duomo_di_firenze_tooltip: "The 'Florence Cathedral' event (flavor_flo.28) has occurred"
 flo_birthplace_of_renaissance: "Birthplace of the Renaissance"
 flo_birthplace_of_renaissance_desc: "Florence leads the intellectual renewal of all Europe as the birthplace of the Renaissance. The spirit of returning to classical antiquity and humanism has taken firm root in this city."
 flo_birthplace_of_renaissance_tooltip: "Has embraced the Renaissance institution"
 flo_florentine_school_of_painting: "Florentine School of Painting"
 flo_florentine_school_of_painting_desc: "The Florentine painting style established by Botticelli and others is ahead of all Europe in perspective and realism."
 flo_florentine_school_of_painting_tooltip: "The 'Sandro Botticelli' event (flavor_flo.33) has occurred"
 flo_the_mona_lisa: "The Mona Lisa"
 flo_the_mona_lisa_desc: "Leonardo da Vinci's masterpiece has changed the very concept of painting. The artistic soil of Florence that continues to produce such genius is unparalleled."
 flo_the_mona_lisa_tooltip: "The event (flavor_flo.45) has occurred"
 flo_uffizi: "The Uffizi"
 flo_uffizi_desc: "Bringing together the art collection amassed by the Medici family, the Uffizi could become the greatest museum in the world. Its cultural prestige will permanently elevate the name of Florence."
 flo_uffizi_tooltip: "Has embraced the Renaissance, and the Uffizi and Vasari Corridor mission is completed"
 flo_the_rise_of_medici: "Rise of the Medici"
 flo_the_rise_of_medici_desc: "After the collapse of the Bardi and Peruzzi families, a new banking dynasty was rising: the Medici. The Medici Bank, founded in 1397 by Giovanni di Bicci de' Medici, grew rapidly on the strength of its relationship with the Roman papacy and expanded branches across Europe. This family will carry the future of Florence."
 flo_the_rise_of_medici_tooltip: "The 'Medici Bank' event (flavor_flo.57) has occurred"
 flo_pazzi_conspiracy: "The Pazzi Conspiracy"
 flo_pazzi_conspiracy_desc: "The assassination attempt on Lorenzo de' Medici, backed by Pope Sixtus IV and the Pazzi family, ended in failure and paradoxically served only to reinforce Medici authority."
 flo_pazzi_conspiracy_tooltip: "The 'Pazzi Conspiracy' event (flavor_flo.20) has occurred"
 flo_machiavelli: "The Writings of Machiavelli"
 flo_machiavelli_desc: "In 'The Prince,' Niccolò Machiavelli coolly analyzed the reality of power. His thought has deeply influenced Florentine political philosophy."
 flo_machiavelli_tooltip: "The 'Machiavelli' event (flavor_flo.46) has occurred"
 flo_republic_of_virtue: "Republic of Virtue"
 flo_republic_of_virtue_desc: "Florence aspires to be not merely a commercial state, but one founded on virtue and republican ideals. Legitimacy and stability are the cornerstones of the republic."
 flo_republic_of_virtue_tooltip: "Legitimacy is 75% or higher and stability is 1 or higher"
 flo_camerata_fiorentina: "Camerata Fiorentina"
 flo_camerata_fiorentina_desc: "The Camerata, where Florentine intellectuals and musicians gather, is becoming a hotbed of musical innovation that will lead to the birth of opera. A city where art and science bloom as one."
 flo_camerata_fiorentina_tooltip: "The capital has an art school (art_school)"
 flo_subjugate_pisa: "Subjugate Pisa"
 flo_subjugate_pisa_desc: "Pisa, the port city that Florence has long coveted as its gateway to the sea, must be secured. Taking command of this harbor on the Arno will greatly expand Florence's commercial reach."
 flo_subjugate_pisa_tooltip: "Pisa is owned by us or a subject"
 flo_siena_submitted: "The Submission of Siena"
 flo_siena_submitted_desc: "Our longstanding rival Siena has at last been brought to heel. With the shame of Montaperti avenged, Florence absorbs its silk merchants and bankers and secures complete control of southern Tuscany."
 flo_siena_submitted_tooltip: "Siena is owned by us or a subject"
 flo_lucca_absorbed: "Lucca Absorbed"
 flo_lucca_absorbed_desc: "Lucca, which has long guarded its independence, is one of the last barriers to Florence's unification of Tuscany. Placing its silk industry under Florentine authority."
 flo_lucca_absorbed_tooltip: "Lucca is owned by us or a subject"
 flo_unify_tuscany: "Unify Tuscany"
 flo_unify_tuscany_desc: "Now that nearly all of Tuscany has come under Florentine control, elevation to a kingdom is a natural consequence. Florence is no longer a mere city-state."
 flo_unify_tuscany_tooltip: "Own 25 or more locations in the Tuscany area"
 flo_push_into_lombardy: "Push into Lombardy"
 flo_push_into_lombardy_desc: "Beyond Tuscany, the time has come to extend our domain into the heart of northern Italy. Conflict with Milan, Genoa, and Venice is inevitable."
 flo_push_into_lombardy_tooltip: "Own 40 or more locations in the Italy region"
 flo_march_on_rome: "March on Rome"
 flo_march_on_rome_desc: "He who controls Rome controls Italy. By bringing the ancient capital of the Roman Empire into our domain, Florence stakes a claim to legitimacy that none can rival."
 flo_march_on_rome_tooltip: "Rome is owned by us or a subject"
 flo_the_new_rome: "The New Rome"
 flo_the_new_rome_desc: "Florence, having conquered Rome, now dominates most of the Italian Peninsula and has become an empire. The time has come to build a new Rome."
 flo_the_new_rome_tooltip: "Own 80 or more locations in the Italy region"
 flo_il_magnifico_of_italy: "Il Magnifico of Italy"
 flo_il_magnifico_of_italy_desc: "Just as Lorenzo de' Medici was called 'Il Magnifico,' all of Florence has now become the 'Magnificent One' of Italy."
 flo_il_magnifico_of_italy_tooltip: "Own 150 or more locations in the Italy region"
 flo_medici_oriental_press: "Medici Oriental Press"
 flo_medici_oriental_press_desc: "The printing house established by the Medici family collects and prints Greek manuscripts that flooded in after the fall of the Byzantine Empire. Ancient knowledge is breathing new life into Europe once more."
 flo_medici_oriental_press_tooltip: "The 'Medici Oriental Press' event (flavor_flo.8) has occurred"
 flo_clock_tower: "Clock Tower of the Piazza della Signoria"
 flo_clock_tower_desc: "The precision clock tower installed at the Palazzo della Signoria has become a symbol of Florentine technical prowess. The management of time improves the efficiency of commerce and governance."
 flo_clock_tower_tooltip: "The 'Clock Tower of the Palazzo della Signoria' event (flavor_flo.27) has occurred"
 flo_michelangelo: "Nurturing Michelangelo"
 flo_michelangelo_desc: "Michelangelo, born and raised in Florence, honed his talents at the court of Lorenzo de' Medici. His sculpture and painting stand at the pinnacle of Renaissance art."
 flo_michelangelo_tooltip: "The 'Michelangelo' event (flavor_flo.1) has occurred"
 flo_first_modern_engineer: "The First Modern Engineer"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi developed revolutionary construction methods that surpassed ancient Rome in building the dome. His technical legacy will be applied to fortress construction across all of Italy."
 flo_first_modern_engineer_tooltip: "The 'First Modern Engineer' event (flavor_flo.29) has occurred"
 flo_humiliate_venice: "Humiliate Venice"
 flo_humiliate_venice_desc: "The time has come to surpass our long-standing maritime rival, the Republic of Venice. Putting the Queen of the Adriatic in her place, we will prove that Florence is Italy's foremost nation."
 flo_humiliate_venice_tooltip: "Be a rival of Venice, have Venice as a subject, or Venice does not exist"
 flo_papal_relations: "Relations with the Papacy"
 flo_papal_relations_desc: "Now that Rome is secured, relations with the papacy must be put on a firm footing. Whether through alliance or dominance, Florence will become the greatest patron of the Roman Church."
 flo_papal_relations_tooltip: "Be allied with the Papal States, have them as a subject, or they do not exist"
 flo_vasari_corridor: "The Uffizi and the Vasari Corridor"
 flo_vasari_corridor_desc: "The Vasari Corridor, connecting the Uffizi Palace and the Ponte Vecchio, was designed by Giorgio Vasari on the orders of Cosimo I de' Medici. This secret elevated walkway symbolizes the authority and artistic excellence of the Medici."
 flo_vasari_corridor_tooltip: "The event (flavor_flo.44) has occurred"
 flo_academy_of_florence: "Academy of Florence"
 flo_academy_of_florence_desc: "The academy established in Florence has become a place of comprehensive research in art, science, and philosophy. Knowledge from the Renaissance spreads out from here to the world."
 flo_academy_of_florence_tooltip: "Have built 5 or more universities (university)"
 flo_italian_cultural_hegemon: "Italian Cultural Hegemon"
 flo_italian_cultural_hegemon_desc: "Florence, where commerce, art, and learning have blossomed as one, has become the cultural center of all Italy. Its influence extends even beyond the Alps."
 flo_italian_cultural_hegemon_tooltip: "Own 60 or more locations in the Italy region, and average control in the home region is 60% or higher"
 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "From a city of merchants, Florence has risen to the pinnacle of culture, conquered all of Italy, and established itself as the successor to the Roman Empire. 'Il Magnifico' — the name of the Magnificent One is inscribed in history for eternity."
 flo_magnifico_tooltip: "Own 200 or more locations"
