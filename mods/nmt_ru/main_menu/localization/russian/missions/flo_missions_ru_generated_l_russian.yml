 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Завершение коридора Вазари навсегда ускоряет распространение досягаемости до Флоренции."
 flo_events.5.t: "Уффици и коридор Вазари"
 flo_events.5.d: "Козимо I Медичи повелел зодчему Джорджо Вазари соединить дворец Уффици (средоточие управления) с палаццо Питти тайным крытым переходом. Этот «коридор Вазари», проходящий над Понте Веккьо, — скрытый ход, позволяющий правителю перемещаться незаметно для народа, символ власти Медичи и их господства над городом. Хитроумная постройка через Арно ясно показывает, что политика и искусство во Флоренции — одно и то же."
 flo_events.5.a: "Завершение коридора подняло управление Флоренцией на новую ступень"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "Новый государь"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "Мысль Макиавелли навсегда и сильно повышает власть правителя."
 flo_events.6.t: "Государь"
 flo_events.6.d: "Итальянские войны преподали Флоренции суровый урок. Дипломат Никколо Макиавелли написал «Государя» — труд, обнаживший саму природу власти. Чтобы объединить раздробленную Италию, нужен новый правитель, ставящий действительную силу выше морали. «Лишь государь, наделённый и доблестью, и удачей, может спасти Италию в смуте» — и, быть может, ответ кроется в самой Флоренции."
 flo_events.6.a: "Явись же, новый государь, спаситель Италии!"
