 nap_expand_influence_in_southern_france: "Влияние на юге Франции"
 nap_western_mediterranean_hegemony: "Господство в западном Средиземноморье"
 nap_anjou_homeland: "Родовые земли Анжу"
 nap_french_throne_claim: "Король Франции"
 nap_new_capital_of_sicily: "Новая столица Сицилийского королевства"
 nap_apulian_granary: "Житница Апулии"
 nap_mediterranean_greatest_city: "Величайший город Средиземноморья"
 nap_control_of_transumanza: "Власть над трансумансой"
 nap_university_of_frederick_ii: "Расцвет университета Фридриха II"
 nap_magnificent_royal_palace: "Великолепный королевский дворец"
 nap_expansion_of_naples_port: "Расширение Неаполитанского порта"
 nap_patronage_of_diverse_arts: "Покровительство многоликому искусству"
 nap_dynastic_stability: "Прочность династии"
 nap_subjugation_of_epirus: "Покорение Эпира"
 nap_southern_renaissance: "Южное Возрождение"
 nap_caserta_palace: "Дворец в Казерте"
 nap_charles_dream: "Мечта Карла I"
 nap_never_die_without_seeing_naples: "Увидеть Неаполь и умереть"
 nap_latin_empire: "Латинская империя"
 nap_new_capital_of_sicily_desc: "Лишившись Сицилии, мы избрали новой столицей вместо Палермо Неаполь. Этот город нужно развить в престол, достойный королевства."
 nap_new_capital_of_sicily_tooltip: "Суммарный уровень построек в Неаполе — 50 и больше."
 nap_apulian_granary_desc: "Плодородные равнины Апулии издавна славятся хлебом. Их урожай кормит наш народ и составляет важную статью вывоза королевства. К тому же Апулия смотрит на Грецию через пролив Отранто, что делает её важным передовым оплотом."
 nap_apulian_granary_tooltip: "Уровень добычи ресурсов в Лечче — 5 и больше."
 nap_control_of_transumanza_desc: "Трансуманса — традиционный отгонный выпас скота в Абруццо и Молизе — становой хребет хозяйства этих краёв. Если государство возьмёт на себя скотопрогонные тропы (траттури) и защитит пастухов, производство шерсти, сыра и прочих товаров расцветёт."
 nap_control_of_transumanza_tooltip: "Уровень добычи ресурсов в Аквиле — 5 и больше."
 nap_patronage_of_diverse_arts_desc: "Через Сицилию прошли греки, карфагеняне, римляне, германцы, арабы, норманны и французы, и их культуры здесь переплелись. Искусство, выросшее из этого многообразия, и есть подлинное искусство Сицилии."
 nap_patronage_of_diverse_arts_tooltip: "Владеть 5 и больше театрами."
 nap_dynastic_stability_desc: "На Сицилии никогда не укоренялась прочная династия, и это снова и снова навлекало иноземные вторжения. Укрепить династию — вернейший путь к устойчивости самой Сицилии."
 nap_dynastic_stability_tooltip: "Легитимность 100 и больше."
 nap_southern_renaissance_desc: "Творцы и учёные со всех концов, привлечённые устойчивым и достойным двором, принесли Возрождение и в Неаполь — здесь расцветает придворная культура, непохожая на культуру Северной Италии."
 nap_southern_renaissance_tooltip: "В Неаполе 20 и больше творений."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Новая столица"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Неаполь развит в престол, достойный королевства, что подстёгивает рост и производительность города."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "Житница Апулии"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "Плодородные земли Апулии навсегда поддерживают здесь добычу сырья."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Власть над трансумансой"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "Защита пастухов и надзор за скотопрогонными тропами навсегда подняли здесь добычу сырья."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Покровительство многоликому искусству"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "При дворе собрались творцы, выросшие из многих культур, что поднимает престиж королевства и его терпимость к иным верам."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Прочность династии"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "При прочной династии растёт легитимность короны и утихают внутренние волнения."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "Южное Возрождение"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Творцы, собравшиеся в Неаполе, отточили своё мастерство, и новые творцы на службе королевства стали искуснее."
 nap_divided_kingdom_desc: "В 1282 году народ Сицилии восстал против власти нашего Анжуйского дома и призвал новым королём Арагонский дом. С тех пор Сицилийское королевство расколото надвое. Мы правим материком с центром в Неаполе, но вернуть остров Сицилию — историческое предназначение, завещанное нашей династии."
 nap_divided_kingdom_tooltip: "Сицилия (SIC) объявлена соперником, или с Сицилией заключён союз."
 nap_papal_blessing_desc: "С тех пор как Карл I по приглашению папы завоевал Сицилийское королевство, наша династия поддерживает тесную связь с папством. Сохранить доверие папы необходимо, чтобы наша власть оставалась законной."
 nap_papal_blessing_tooltip: "Нет отлучения от церкви, отношения с папством 100 и больше."
 nap_army_buildup_desc: "Укрепите постоянную армию королевства, готовясь к борьбе за Сицилию. Сильная армия понадобится и для вмешательства в дела Северной Италии, и для подавления мятежей на материке."
 nap_army_buildup_tooltip: "Регулярная армия — 2 000 человек и больше."
 nap_match_aragon_navy_desc: "Чтобы противостоять арагонскому флоту, господствующему в Сицилийском проливе, и нашему королевству нужен мощный флот. Кто владеет морем, со временем овладеет и Сицилией."
 nap_match_aragon_navy_tooltip: "Флот — 30 кораблей и больше."
 nap_sword_of_the_guelphs_desc: "Борьба гвельфов (папской партии) и гибеллинов (имперской партии) сотрясает всю Северную Италию. Как союзник папы наше королевство может вступить в эту борьбу мечом гвельфов и воспользоваться случаем, чтобы распространить влияние на север."
 nap_sword_of_the_guelphs_tooltip: "Идёт ситуация «Гвельфы и гибеллины», и мы входим в партию гвельфов."
 nap_sicilian_reunification_war_desc: "Наконец пришло время послать войска на остров Сицилию. Если удастся разбить арагонский гарнизон и взять Палермо, откроется путь к воссоединению расколотого надвое королевства."
 nap_sicilian_reunification_war_tooltip: "Занять Палермо."
 nap_invest_in_provence_desc: "Графство Прованс, колыбель Анжуйского дома, всё ещё тесно связано с нашей династией. Вложения сюда создадут опору на Западе и укрепят связь с землёй предков."
 nap_invest_in_provence_tooltip: "Владеть 20 и больше районами в области Прованс."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Поддержка папы"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Благодаря тесной связи с папством наше религиозное влияние неуклонно растёт."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Преобразованное королевское войско"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "Заново устроенное королевское войско отличается высоким боевым духом и большим запасом рекрутов."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Флот против Арагона"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "Королевский флот, выстроенный против Арагона, отличается высоким боевым духом и быстротой."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "Меч гвельфов"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Вмешавшись мечом папства в распри Северной Италии, наша армия поднаторела в осадах и дисциплине."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "Война за воссоединение Сицилии"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Пройдя через ожесточённую войну за Сицилию, королевское войско может выставить больше солдат, а тяготы войны меньше давят на страну."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Вложения в Прованс"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Торговля с Провансом процветает, а обновлённая связь с родиной династии поднимает дипломатический вес королевства."
 nap_events.1.t: "Королевство, расколотое надвое"
 nap_events.1.d: "В 1282 году народ Сицилии поднял восстание, известное как Сицилийская вечерня, и сверг власть Анжуйского дома. Новым правителем он призвал короля Педро III Арагонского, и так Сицилийское королевство раскололось надвое. Мы, правящие из Неаполя на материке, остаёмся законными королями Сицилии, но за проливом ветвь Арагонского дома держит сам остров под тем же титулом. Соперничество двух королевств продолжается по сей день."
 nap_events.1.a: "Понятно"
 nap_cross_the_strait_of_otranto_desc: "Пролив Отранто шириной едва 70 километров — морские ворота между Апеннинским и Балканским полуостровами. Если переправиться через него и закрепиться в Албании, нашим флотам и торговым судам откроется путь дальше на Восток."
 nap_cross_the_strait_of_otranto_tooltip: "Все районы области Албания (albania_area) принадлежат Неаполю или его подданным."
 nap_influence_over_the_papacy_desc: "Если мы ещё теснее сблизимся с папством, сохраняя порядок дома, наша династия обретёт влияние на Святой престол, с которым нельзя будет не считаться."
 nap_influence_over_the_papacy_tooltip: "Владеть Римом или быть в союзе с Папским государством (PAP)."
 nap_the_bells_fall_silent_desc: "Остров Сицилия снова наш, и расколотое надвое королевство вновь едино. Мы должны бережно упрочить нашу власть, чтобы \"колокола\", некогда расколовшие королевство, больше никогда не зазвонили."
 nap_the_bells_fall_silent_tooltip: "Владеть Палермо."
 nap_defeat_of_aragon_desc: "Лишённый Сицилии, Арагонский дом уже не та угроза нашему королевству, что прежде. Если сокрушить сам Арагон или поставить его корону под нашу верховную власть, долгому соперничеству на Средиземном море наконец придёт конец."
 nap_defeat_of_aragon_tooltip: "Арагона (ARA) не существует, или Арагон — наш подданный."
 nap_expand_influence_in_southern_france_desc: "Из нашей опоры в Провансе влияние теперь простирается вверх по Роне до самого Лиона. Наше присутствие на юге Франции продолжает расти."
 nap_expand_influence_in_southern_france_tooltip: "Владеть хотя бы одним районом в области Лионне (lyonnais_area)."
 nap_western_mediterranean_hegemony_desc: "Если захватить Сардинию и Балеарские острова, две великие твердыни западного Средиземноморья, наши флоты будут господствовать на водах от Генуи до Иберии и станут непревзойдёнными хозяевами западного моря."
 nap_western_mediterranean_hegemony_tooltip: "Владеть 20 и больше районами в области Сардиния и 4 и больше в области Балеарские острова."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Опора за Отранто"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Опора в Албании позволяет нашим флотам и торговым судам уходить дальше."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Влияние на папство"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Наша связь с папством окрепла, упрочив законность нашей власти и терпимость к еретикам."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Умолкшие колокола"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "Власть в воссоединённом королевстве устоялась: недовольство народа улеглось, а легитимность короны выросла."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "Разгром Арагона"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "Победа над старым соперником Арагоном сильно подняла дисциплину и боевой дух королевского войска."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Влияние на юге Франции"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "Торговое и дипломатическое присутствие королевства на юге Франции продолжает расти."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Господство в западном Средиземноморье"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Завоевав Сардинию и Балеарские острова, наш флот господствует во всём западном Средиземноморье, и боевой дух его высок."
 nap_anjou_hungary_desc: "У нашего Анжуйского дома есть младшие ветви не только в Неаполе, но и в Венгрии. Если узы двух наших единокровных королевств окрепнут, у нас может появиться законный повод притязать на венгерскую корону."
 nap_anjou_hungary_tooltip: "Быть в союзе с Венгрией (HUN) или иметь с Венгрией отношения 150 и больше."
 nap_foothold_in_northern_italy_desc: "Если закрепиться в Тоскане, можно сблизиться с богатыми городами-государствами Северной Италии, такими как Флоренция и Пиза, и получить преимущество в любом походе по полуострову."
 nap_foothold_in_northern_italy_tooltip: "Владеть хотя бы одним районом в области Тоскана (tuscany_area)."
 nap_crossroads_of_civilizations_desc: "Сицилийское королевство издавна стоит на перекрёстке греческой, римской, арабской и норманнской цивилизаций. Огромное собрание творений при нашем дворе — доказательство того, что наше королевство и вправду перекрёсток цивилизаций."
 nap_crossroads_of_civilizations_tooltip: "В любом нашем районе 100 и больше творений."
 nap_anjou_homeland_desc: "Заняв Анже, мы распространили влияние на родовые земли нашего Анжуйского дома. Эта связь с землёй предков может принести нам и притязание на сам французский престол."
 nap_anjou_homeland_tooltip: "Владеть Анже."
 nap_french_throne_claim_desc: "Анжуйский дом родился как младшая ветвь французского королевского рода. Если взять сам Париж или заключить личную унию с французской короной, наш король будет носить корону Франции вместе с неаполитанской."
 nap_french_throne_claim_tooltip: "Владеть Парижем или состоять в личной унии с Францией (FRA)."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Опора в Северной Италии"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Связи с городами Тосканы позволяют нам успешнее обращать военные успехи в военный счёт по всему полуострову."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Перекрёсток цивилизаций"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "Огромное собрание творений при нашем дворе продолжает распространять культурное влияние королевства на соседние земли."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "Родовые земли Анжу"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "Связь с Анже, землёй наших предков, поднимает престиж династии и облегчает отношения с иностранными державами."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "Король Франции"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "Притязание на корону Франции сильно подняло престиж королевства, а его войска стали ходить быстрее. Мы также получили право даровать французскую городскую привилегию «Вильфранши»."
 nap_mediterranean_greatest_city_desc: "Население Неаполя достигло размаха, редкого даже для Средиземноморья. Со времён Древнего Рима ни один город на этом море не знал такого процветания."
 nap_mediterranean_greatest_city_tooltip: "Население Неаполя — 200 000 и больше."
 nap_university_of_frederick_ii_desc: "Неаполитанский университет, основанный Фридрихом II, — средоточие учёности королевства. Если снабдить его залами искусств и наук, его слава разойдётся по всей Европе."
 nap_university_of_frederick_ii_tooltip: "В Неаполе есть академия художеств."
 nap_magnificent_royal_palace_desc: "Разбить сады при королевском дворце — важное дело, чтобы явить подданным и чужеземцам блеск короны. Великолепные сады расскажут каждому гостю о процветании королевства."
 nap_magnificent_royal_palace_tooltip: "В Неаполе есть королевский сад."
 nap_expansion_of_naples_port_desc: "Док в Неаполитанском порту позволит чинить и строить корабли быстрее и сильно поможет содержанию и росту королевского флота."
 nap_expansion_of_naples_port_tooltip: "В Неаполе есть док."
 nap_subjugation_of_epirus_desc: "Переправившись через пролив Отранто и закрепившись, наши войска наконец покорили весь Эпир. Побережье Албании теперь под властью королевства."
 nap_subjugation_of_epirus_tooltip: "Владеть 30 и больше районами в области Северная Греция."
 nap_caserta_palace_desc: "Новый дворец в Казерте явит блеск короны и даст королевской семье тихое место для правления вдали от неаполитанского двора."
 nap_caserta_palace_tooltip: "Суммарный уровень построек в Казерте — 30 и больше."
 nap_charles_dream_desc: "Карл I когда-то мечтал создать великую империю в восточном Средиземноморье как продолжение крестоносного духа. Теперь, с опорой в Морее, эта мечта снова обретает очертания."
 nap_charles_dream_tooltip: "Владеть хотя бы одним районом в области Морея (morea_area)."
 nap_never_die_without_seeing_naples_desc: "Как гласит старая поговорка, \"увидеть Неаполь и умереть\" — Неаполь стал городом, который мечтают увидеть путешественники со всего света. О его красоте и процветании будут говорить поколения."
 nap_never_die_without_seeing_naples_tooltip: "Суммарный уровень построек в Неаполе — 100 и больше."
 nap_latin_empire_desc: "Сицилийское королевство больше не просто местная держава. На западе оно господствует на Средиземном море, на востоке перед ним открыт путь от Мореи до Константинополя. Пришло время объявить перед всем миром себя наследником старой Латинской империи."
 nap_latin_empire_tooltip: "Всего 300 и больше районов."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "Величайший город Средиземноморья"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Неаполь стал одним из великих городов Средиземноморья и далеко обогнал соседей в производительности и росте."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "Университет Фридриха II"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Учёные, собравшиеся в Неаполитанском университете, приносят королевству новые знания и изобретения."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "Великолепный королевский дворец"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Роскошные сады королевского дворца являют всем престиж королевства и законность короны."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Расширение Неаполитанского порта"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "Док в расширенном Неаполитанском порту ускоряет починку кораблей и позволяет строить больше судов одновременно."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Покорение Эпира"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Пройдя через эпирский поход, королевское войско может выставить больше солдат, а тяготы войны меньше давят на страну."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "Дворец в Казерте"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "Новый дворец в Казерте сильно подстегнул рост и производительность этой земли."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "Мечта Карла I"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "Давнее стремление на Восток разгорается вновь, поднимая престиж королевства и боевой дух его войск."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Увидеть Неаполь и умереть"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "Процветание Неаполя, притягивающее людей со всего света, сильно подняло престиж королевства и доход от торговли."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "Латинская империя"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "Блеск возрождённой Латинской империи простирается над всем Средиземноморьем, поднимая престиж и легитимность королевства и усиливая его позиции на мирных переговорах как никогда прежде."
