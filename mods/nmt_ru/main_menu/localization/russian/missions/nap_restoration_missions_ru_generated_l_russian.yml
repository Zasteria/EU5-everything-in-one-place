l_russian:
 nap_restoration_mission_pack: "The Path of the Kingdom of Naples"
 nap_restoration_mission_pack_DESCRIPTION: "Having lost Sicily, the kingdom seeks reunification and the restoration of its power in the Mediterranean. Under the blood and splendor of the House of Anjou, build a new golden age centered on Naples."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION: "Complete missions as the Kingdom of Naples, working toward the reunification of Sicily and the restoration of the Latin Empire."
 nap_restoration_mission_pack_BUTTON_TOOLTIP: "Complete missions to walk the path of the Kingdom of Naples."
 nap_restoration_mission_pack_BUTTON_DETAILS: "Reunite the Kingdom of Sicily, torn in two, and carve your name into history as master of the western Mediterranean and heir to the old Latin Empire!"
 nap_divided_kingdom: "A Kingdom Divided"
 nap_papal_blessing: "Win the Pope's Blessing"
