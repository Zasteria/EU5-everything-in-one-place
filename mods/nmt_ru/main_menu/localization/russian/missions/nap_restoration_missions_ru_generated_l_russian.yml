 nap_french_throne_claim: "King of France"
 nap_new_capital_of_sicily: "The New Capital of the Kingdom of Sicily"
 nap_apulian_granary: "The Granary of Apulia"
 nap_mediterranean_greatest_city: "The Greatest City of the Mediterranean"
 nap_control_of_transumanza: "Control of the Transumanza"
 nap_university_of_frederick_ii: "The Growth of the University of Frederick II"
 nap_magnificent_royal_palace: "The Magnificent Royal Palace"
 nap_expansion_of_naples_port: "Expansion of the Port of Naples"
 nap_patronage_of_diverse_arts: "Patronage of Diverse Arts"
 nap_dynastic_stability: "Dynastic Stability"
 nap_subjugation_of_epirus: "The Subjugation of Epirus"
 nap_southern_renaissance: "The Southern Renaissance"
 nap_caserta_palace: "The Palace of Caserta"
 nap_charles_dream: "The Dream of Charles I"
 nap_never_die_without_seeing_naples: "See Naples and Die"
 nap_latin_empire: "The Latin Empire"
 nap_new_capital_of_sicily_desc: "Having lost Sicily, we have chosen Naples as our new capital in place of Palermo. This city must be developed into a seat worthy of the kingdom."
 nap_new_capital_of_sicily_tooltip: "Total building levels in naples are 50+."
 nap_apulian_granary_desc: "Apulia's fertile plains have long been famed as a source of grain. Its harvests feed our people and form a key export of the kingdom. Apulia also faces Greece across the Strait of Otranto, making it a vital forward base."
 nap_apulian_granary_tooltip: "lecce has RGO level 5+."
 nap_control_of_transumanza_desc: "The transumanza, the traditional transhumance of livestock practiced in Abruzzo and Molise, forms the economic backbone of these regions. If the state manages the tratturi and protects the herders, the production of wool, cheese, and other goods will flourish."
 nap_control_of_transumanza_tooltip: "aquila has RGO level 5+."
 nap_patronage_of_diverse_arts_desc: "Sicily has been crossed by Greeks, Carthaginians, Romans, Germans, Arabs, Normans, and French, and their cultures have blended together here. Art rooted in this diversity of cultures is the true art of Sicily."
 nap_patronage_of_diverse_arts_tooltip: "Own 5+ theater buildings."
 nap_dynastic_stability_desc: "No stable dynasty has ever taken root in Sicily, and this has repeatedly invited foreign invasion. Stabilizing the dynasty is the surest path to stability for Sicily itself."
 nap_dynastic_stability_tooltip: "Legitimacy 100+."
 nap_southern_renaissance_desc: "Artists and scholars from across the lands, drawn to a stable and dignified court, have brought a renaissance to Naples as well — a court-led culture distinct from that of northern Italy now blossoms here."
 nap_southern_renaissance_tooltip: "naples contains 20+ works of art."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "A New Capital"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Naples has been developed into a seat worthy of the kingdom, promoting the city's growth and productivity."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "The Granary of Apulia"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "The fertile lands of Apulia permanently sustain raw material production here."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Control of the Transumanza"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "The protection of herders and management of the tratturi has permanently raised raw material production here."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Patronage of Diverse Arts"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Artists rooted in many cultures have gathered at court, raising the kingdom's prestige and its tolerance toward other faiths."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Dynastic Stability"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "Under a stable dynasty, the legitimacy of the crown grows and domestic unrest eases."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "The Southern Renaissance"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "The artists gathered in Naples have honed their craft, and the skill of new artists entering the kingdom's service has grown."
 nap_divided_kingdom_desc: "In 1282, the people of Sicily rose up against the rule of our House of Anjou and welcomed the House of Aragon as their new king. Ever since, the Kingdom of Sicily has been split in two. We rule the mainland centered on Naples, but reclaiming the island of Sicily remains the historic mission entrusted to our dynasty."
 nap_divided_kingdom_tooltip: "You have designated Sicily (SIC) as a rival, or are allied with Sicily."
 nap_papal_blessing_desc: "Ever since Charles I conquered the Kingdom of Sicily at the Pope's invitation, our dynasty has maintained close ties with the Papacy. Preserving the Pope's confidence is essential to upholding the legitimacy of our rule."
 nap_papal_blessing_tooltip: "Not excommunicated, relations with the Papacy are 100+."
 nap_army_buildup_desc: "Strengthen the kingdom's standing army in preparation for the struggle to reclaim Sicily. A strong army will also be needed for any intervention in northern Italy, or to put down rebellion on the mainland."
 nap_army_buildup_tooltip: "Regular army size 2,000+."
 nap_match_aragon_navy_desc: "To counter the Aragonese fleet that commands the Strait of Sicily, our kingdom too must possess a powerful navy. Whoever rules the sea will, in time, rule Sicily."
 nap_match_aragon_navy_tooltip: "Navy size 30+."
 nap_sword_of_the_guelphs_desc: "The struggle between the Guelphs (papal faction) and Ghibellines (imperial faction) is shaking all of northern Italy. As an ally of the Pope, our kingdom may join this struggle as the Sword of the Guelphs, seizing the chance to extend our influence northward."
 nap_sword_of_the_guelphs_tooltip: "The Guelphs and Ghibellines situation is active, and we are a member of the Guelph faction."
 nap_sicilian_reunification_war_desc: "At last, the time has come to send our armies to the island of Sicily. If we can break the Aragonese garrison and seize Palermo, the path will open to reunite the kingdom that was torn in two."
 nap_sicilian_reunification_war_tooltip: "Occupy palermo."
 nap_invest_in_provence_desc: "The County of Provence, birthplace of the House of Anjou, still holds deep ties to our dynasty. Investment here will build a foothold in the West while strengthening our bond with our ancestral homeland."
 nap_invest_in_provence_tooltip: "Own 20 or more locations in the Provence area."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Papal Support"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Through our close ties with the Papacy, our religious influence steadily grows."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "A Reorganized Royal Army"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "The newly reorganized royal army boasts high morale and ample reserves of manpower."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "The Anti-Aragonese Fleet"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "The royal fleet, built up to counter Aragon, boasts high morale and swift movement."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "Sword of the Guelphs"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Having intervened in the strife of northern Italy as the Papacy's sword, our army has grown skilled in siegecraft and discipline."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "The War of Sicilian Reunification"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Having fought through the fierce war for Sicily, the royal army can field more troops, and the toll of war weighs less heavily upon the realm."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Investment in Provence"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Trade with Provence flourishes, and our renewed bond with the dynasty's ancestral homeland enhances the kingdom's diplomatic standing."
 nap_events.1.t: "A Kingdom Divided in Two"
 nap_events.1.d: "In 1282, the people of Sicily rose up in the uprising known as the Sicilian Vespers, overthrowing the rule of the House of Anjou. They welcomed King Peter III of Aragon as their new ruler, and the Kingdom of Sicily was thus split in two. We, ruling from Naples on the mainland, remain the rightful Kings of Sicily, yet across the strait a branch of the House of Aragon holds the island itself under that same title. The rivalry between the two realms continues to this day."
 nap_events.1.a: "Understood"
 nap_cross_the_strait_of_otranto_desc: "The Strait of Otranto, barely 70 kilometers wide, is the maritime gateway between the Italian and Balkan peninsulas. If we can cross it and establish a foothold in Albania, our fleets and merchant ships will gain a path further into the East."
 nap_cross_the_strait_of_otranto_tooltip: "All locations in the Albania area (albania_area) are owned by Naples or its subjects."
 nap_influence_over_the_papacy_desc: "If we deepen our ties with the Papacy further while maintaining stability at home, our dynasty will come to wield influence over the Holy See that cannot be ignored."
 nap_influence_over_the_papacy_tooltip: "Own rome, or be allied with the Papal States (PAP)."
 nap_the_bells_fall_silent_desc: "The island of Sicily is once again ours, and the kingdom torn in two has been made whole. We must consolidate our rule with care, so that the \"bells\" which once tore the kingdom apart never ring again."
 nap_the_bells_fall_silent_tooltip: "Own palermo."
 nap_defeat_of_aragon_desc: "Stripped of Sicily, the House of Aragon is no longer the threat to our kingdom it once was. If Aragon itself can be brought down, or its crown placed under our suzerainty, the long rivalry across the Mediterranean may finally be brought to an end."
 nap_defeat_of_aragon_tooltip: "Aragon (ARA) does not exist, or Aragon is a subject of our realm."
 nap_expand_influence_in_southern_france_desc: "From our foothold in Provence, our influence now reaches up the Rhone as far as Lyon. Our presence across southern France continues to grow."
 nap_expand_influence_in_southern_france_tooltip: "Own at least one location in the Lyonnais area (lyonnais_area)."
 nap_western_mediterranean_hegemony_desc: "If we can seize Sardinia and the Balearic Islands, the two great strongholds of the western Mediterranean, our fleets will command the waters from Genoa to Iberia, making us unrivaled masters of the western sea."
 nap_western_mediterranean_hegemony_tooltip: "Own 20 or more locations in the Sardinia area and 4 or more in the Balearics area."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "A Foothold Across Otranto"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Our foothold in Albania allows our fleets and merchant ships to sail farther afield."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Influence over the Papacy"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Our ties with the Papacy have deepened, strengthening the legitimacy of our rule and our tolerance of heretics."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "The Silent Bells"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "The reunified kingdom's rule has stabilized; popular discontent has eased, and the legitimacy of the crown has grown."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "The Defeat of Aragon"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "Having defeated our old rival Aragon, the royal army's discipline and morale have been greatly bolstered."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Influence in Southern France"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "The kingdom's trade and diplomatic presence across southern France continues to grow."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Hegemony of the Western Mediterranean"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Having conquered Sardinia and the Balearics, our fleet commands the entire western Mediterranean, its morale running high."
 nap_anjou_hungary_desc: "Our House of Anjou has cadet branches not only in Naples but in Hungary as well. Should the bonds between our two realms of common blood deepen, we may yet find just cause to claim the Hungarian crown."
 nap_anjou_hungary_tooltip: "Be allied with Hungary (HUN), or have relations of 150+ with Hungary."
 nap_foothold_in_northern_italy_desc: "If we can secure a foothold in Tuscany, we may deepen our ties with the wealthy city-states of northern Italy such as Florence and Pisa, gaining the advantage in any military campaign across the peninsula."
 nap_foothold_in_northern_italy_tooltip: "Own at least one location in the Tuscany area (tuscany_area)."
 nap_crossroads_of_civilizations_desc: "The Kingdom of Sicily has long stood at the crossroads of Greek, Roman, Arab, and Norman civilizations. The vast collection of art gathered at our court stands as proof that our kingdom is truly a crossroads of civilizations."
 nap_crossroads_of_civilizations_tooltip: "Any one of our locations contains 100+ works of art."
 nap_anjou_homeland_desc: "Having secured Angers, our influence now extends to the ancestral homeland of our House of Anjou. This bond with our forefathers' lands may yet bring us a claim to the French throne itself."
 nap_anjou_homeland_tooltip: "Own angers."
 nap_french_throne_claim_desc: "The House of Anjou was born as a cadet branch of the French royal line. If we can secure Paris itself, or form a personal union with the French crown, our king shall wear the crown of France as well as that of Naples."
 nap_french_throne_claim_tooltip: "Own paris, or be in a personal union with France (FRA)."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "A Foothold in Northern Italy"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Our ties with the cities of Tuscany allow us to translate military gains into war score more efficiently across the peninsula."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Crossroads of Civilizations"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "The vast collection of art gathered at our court continues to spread the kingdom's cultural influence to neighboring lands."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "The Ancestral Lands of Anjou"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "Our bond with Angers, the land of our forefathers, raises the dynasty's prestige and eases relations with foreign powers."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "King of France"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "Having claimed the crown of France, the kingdom's prestige has grown greatly and its armies march with greater speed. We have also gained the right to grant the French town privilege of Villes Franches."
 nap_mediterranean_greatest_city_desc: "The population of Naples has now reached a scale rare even in the Mediterranean. Not since ancient Rome has a city on this sea known such prosperity."
 nap_mediterranean_greatest_city_tooltip: "Population of naples is 200,000+."
 nap_university_of_frederick_ii_desc: "The University of Naples, founded by Frederick II, is the kingdom's center of learning. By furnishing it with halls of art and scholarship, its renown will spread throughout Europe."
 nap_university_of_frederick_ii_tooltip: "naples has an arts_academy."
 nap_magnificent_royal_palace_desc: "Laying out gardens at the royal palace is an essential undertaking in displaying the splendor of the crown to subjects and foreigners alike. Magnificent gardens will speak of the kingdom's prosperity to all who visit."
 nap_magnificent_royal_palace_tooltip: "naples has a royal_garden."
 nap_expansion_of_naples_port_desc: "By building a dock at the port of Naples, ships can be repaired and built more efficiently, greatly aiding the upkeep and growth of the royal fleet."
 nap_expansion_of_naples_port_tooltip: "naples has a dock."
 nap_subjugation_of_epirus_desc: "Having crossed the Strait of Otranto and established a foothold, our forces have at last subdued the whole of Epirus. The coast of Albania now lies under the kingdom's rule."
 nap_subjugation_of_epirus_tooltip: "Own 30 or more locations in the Northern Greece area."
 nap_caserta_palace_desc: "Raising a new palace at Caserta will display the splendor of the crown, while giving the royal family a quiet seat of governance away from the court of Naples."
 nap_caserta_palace_tooltip: "Total building levels in caserta are 30+."
 nap_charles_dream_desc: "Charles I once dreamed of building a great empire in the eastern Mediterranean, an extension of the crusading spirit. Now, with a foothold in the Morea, that dream begins to take shape once more."
 nap_charles_dream_tooltip: "Own at least one location in the Morea area (morea_area)."
 nap_never_die_without_seeing_naples_desc: "As the old saying goes, \"See Naples and die\" — Naples has become a city that travelers from across the world long to behold. Its beauty and prosperity will be spoken of for generations."
 nap_never_die_without_seeing_naples_tooltip: "Total building levels in naples are 100+."
 nap_latin_empire_desc: "The Kingdom of Sicily is no longer a mere regional power. In the west, it commands the Mediterranean; in the east, the road from the Morea to Constantinople lies open before it. Now is the time to declare itself, before the world, the heir of the old Latin Empire."
 nap_latin_empire_tooltip: "300+ total locations."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "The Greatest City of the Mediterranean"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Naples has become one of the great cities of the Mediterranean, its productivity and growth far outpacing its neighbors."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "The University of Frederick II"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "The scholars gathered at the University of Naples bring new knowledge and innovation to the kingdom."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "The Magnificent Royal Palace"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "The splendid gardens of the royal palace display the kingdom's prestige and the legitimacy of the crown to all."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Expansion of the Port of Naples"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "The dock at the expanded port of Naples improves ship repair efficiency and allows more ships to be built at the same time."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "The Subjugation of Epirus"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Having fought through the campaign in Epirus, the royal army can field more troops, and the toll of war weighs less heavily upon the realm."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "The Palace of Caserta"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "The newly built Palace of Caserta has greatly spurred the growth and productivity of this land."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "The Dream of Charles I"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "The old ambition toward the East burns anew, raising the kingdom's prestige and the morale of its armies."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "See Naples and Die"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "The prosperity of Naples, which draws people from across the world, has greatly boosted the kingdom's prestige and trade income."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "The Latin Empire"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "The splendor of the restored Latin Empire reaches across the Mediterranean, raising the kingdom's prestige and legitimacy, and strengthening its hand in the negotiations of war as never before."
