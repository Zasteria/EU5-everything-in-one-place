l_russian:
 nap_restoration_mission_pack: "Путь Неаполитанского королевства"
 nap_restoration_mission_pack_DESCRIPTION: "Лишившись Сицилии, королевство стремится к воссоединению и возрождению своей силы на Средиземном море. Под кровью и блеском Анжуйского дома постройте новый золотой век с центром в Неаполе."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION: "Выполняйте задания за Неаполитанское королевство, стремясь воссоединить Сицилию и возродить Латинскую империю."
 nap_restoration_mission_pack_BUTTON_TOOLTIP: "Выполняйте задания, чтобы пройти путь Неаполитанского королевства."
 nap_restoration_mission_pack_BUTTON_DETAILS: "Воссоедините расколотое надвое Сицилийское королевство и впишите своё имя в историю как владыка западного Средиземноморья и наследник старой Латинской империи!"
 nap_divided_kingdom: "Разделённое королевство"
 nap_papal_blessing: "Заручиться благословением папы"
 nap_army_buildup: "Нарастить армию"
