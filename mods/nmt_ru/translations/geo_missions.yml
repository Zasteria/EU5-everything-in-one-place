l_russian:
 geo_georgia_mission_pack: "Золотое руно — царство Кавказа"
 geo_georgia_mission_pack_DESCRIPTION:0 "Под властью династии Багратиони Грузинское царство стоит на перекрёстке Кавказа. Соберите державу, возьмите верх над Кавказом и степью — или выступите крестоносцами в Анатолию и Святую землю, и пусть свет православия озарит Восток."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Воссоедините Грузию, подчините Кавказ и двиньтесь крестовым походом на юг, чтобы наступил новый золотой век."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Из земли золотого руна станьте владыкой Кавказа."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Верните славу царицы Тамары — от горного царства до защитника православного мира!"
 geo_bagrationi_legacy: "Наследие Багратиони"
 geo_bagrationi_legacy_desc: "Кровь дома Багратиони правит Кавказом. Примите это наследие и начните новый век правления."
 geo_royal_succession: "Закрепить наследование"
 geo_royal_succession_desc: "Уймите притязания знати и споры о престоле и утвердите законное правление."
 geo_reunite_georgia: "Воссоединить Грузию"
 geo_reunite_georgia_desc: "Тбилиси, Кутаиси, Ахалцихе, Батуми — соедините распавшиеся области Грузии под одной короной."
 geo_fortify_caucasia: "Укрепить Кавказ"
 geo_fortify_caucasia_desc: "Одолейте суровые горы сетью крепостей и отбейте набеги как иноверцев, так и завоевателей."
 geo_church_of_georgia: "Грузинская церковь"
 geo_church_of_georgia_desc: "Сделайте автокефальную Грузинскую православную церковь опорой державы и скрепите единство верой."
 geo_royal_court: "Царский двор"
 geo_royal_court_desc: "Украсьте царский двор в Тбилиси и сделайте его средоточием культуры и власти, какого не знает Кавказ."
 geo_georgian_army: "Грузинское войско"
 geo_georgian_army_desc: "Выкуйте могучее войско из горских народов и сделайте его мечом царства."
 geo_recover_strength: "Восстановить силы"
 geo_recover_strength_desc: "Верните силы, подорванные чередой бедствий, и откройте новое будущее союзами и перевооружением."
 geo_queen_tamar_ambition: "Замысел царицы Тамары"
 geo_queen_tamar_ambition_desc: "Земли Армении когда-то входили во владения царицы Тамары — освободите наших братьев-христиан из-под власти иноверцев и верните сюда власть Тбилиси."
 geo_reclaim_shirvan: "Вернуть Ширван"
 geo_reclaim_shirvan_desc: "Верните Ширван, некогда бывший под грузинским сюзеренитетом, и закрепитесь на Каспийском море."
 geo_heirs_of_seljuks: "Наследники сельджуков"
 geo_heirs_of_seljuks_desc: "Отвоюйте восточные земли у держав, унаследовавших дело сельджуков, и верните этому краю власть креста."
 geo_gates_of_alexander: "Александровы ворота"
 geo_gates_of_alexander_desc: "Пройдите через Кавказ так называемыми «Александровыми воротами» и покорите северные племена."
 geo_bane_of_khagan: "Погибель кагана"
 geo_bane_of_khagan_desc: "Потомки монголов всё ещё угрожают православному миру. Положите конец их власти и избавьтесь от этой напасти навсегда."
 geo_seize_crimea: "Захватить Крым"
 geo_seize_crimea_desc: "Покорите Крымский полуостров, последнее прибежище татар, и закрепите наше господство на Чёрном море."
 geo_control_black_sea: "Овладеть Чёрным морем"
 geo_control_black_sea_desc: "Заняв большую часть черноморского побережья, полностью введите это внутреннее море в торговый круг Грузии."
 geo_envoy_to_tsar: "Посольство к царю"
 geo_envoy_to_tsar_desc: "Отправьте посла к царю, поднявшемуся первой силой Руси, и поищите пути к союзу."
 geo_caucasus_hegemony: "Владычество над Кавказом"
 geo_caucasus_hegemony_desc: "Горы, степь и Чёрное море — завершите нерушимое владычество над всем Кавказом."
 geo_deal_with_trebizond: "Уговор с Трапезундом"
 geo_deal_with_trebizond_desc: "Трапезундская империя была основана при помощи царицы Тамары — обновите связь со старым другом и выберите общий путь вперёд."
 geo_conquer_jalayirids: "Покорить Джалаиридский султанат"
 geo_conquer_jalayirids_desc: "В смуте после распада государства Хулагуидов здесь поднялся Джалаиридский султанат — покорите этого наследника монголов и откройте дорогу на восток."
 geo_encroach_mamluks: "Потеснить мамлюков"
 geo_encroach_mamluks_desc: "Святая земля, утраченная крестоносцами былых времён, — продвиньтесь на восток, подвластный мамлюкам, и приготовьтесь вернуть свет веры."
 geo_conquer_cyprus: "Завоевать Кипр"
 geo_conquer_cyprus_desc: "Возьмите Кипр, опору восточного Средиземноморья, и закрепите господство в этом краю вместе с тамошними крестоносными державами."
 geo_cradle_of_civilization: "Колыбель цивилизации"
 geo_cradle_of_civilization_desc: "Освободите Месопотамию, колыбель человеческой цивилизации, из-под мусульманской власти и обратите её богатства на пользу Грузии."
 geo_claim_holy_city: "Взять Святой город"
 geo_claim_holy_city_desc: "Пока Иерусалим под властью сарацин, над христианским миром висит чёрная туча. Верните Святой город и докажите торжество веры."
 geo_light_of_east: "Свет Востока"
 geo_light_of_east_desc: "Александрия, Иерусалим, Антиохия — освободите древние восточные патриархаты и покажите миру, что свет Востока не угас."
 geo_anatolian_incursion: "Поход в Анатолию"
 geo_anatolian_incursion_desc: "Со времён поражения при Манцикерте Анатолия отошла тюркским державам — отомстите за то поражение и станьте новым владыкой этой земли."
 geo_empires_downfall: "Падение империи"
 geo_empires_downfall_desc: "Османская империя властвует над Балканами и Ближним Востоком — отправьте эту угрозу всему христианскому миру на страницы истории."
 geo_throne_of_romans: "Престол ромеев"
 geo_throne_of_romans_desc: "Великий город Константинополь давно в руках иноверцев. Освободите эту жемчужину и займите римский престол как грузинский император."
 geo_beacon_of_christendom: "Светоч христианского мира"
 geo_beacon_of_christendom_desc: "Мощь православия восстановлена, и настал час доказать миру наше благочестие и данную Богом правоту — сделайте нашу державу единым раем христианского мира."
 geo_georgian_crusader_realm: "Грузинская крестоносная держава"
 geo_georgian_crusader_realm_desc: "От Кавказа до Средиземного моря — эта великая империя, выстроенная под крестом, и есть исполнение мечты царицы Тамары."
 geo_rebuild_tbilisi: "Отстроить Тбилиси"
 geo_rebuild_tbilisi_desc: "Наша столица Тбилиси истрёпана чередой чужих нашествий — возьмитесь вернуть ей прежнее великолепие."
 geo_georgian_vineyards: "Грузинские виноградники"
 geo_georgian_vineyards_desc: "Виноделию Грузии больше тысячи лет — пусть об этом славном ремесле узнает весь мир."
 geo_revive_literature: "Возродить родную словесность"
 geo_revive_literature_desc: "Асомтаврули, нусхури, мхедрули — три письма, несущие грузинское наследие. Возродите эту культуру и распространите её язык и письмо по всему Кавказу."
 geo_legacy_of_builder: "Наследие Строителя"
 geo_legacy_of_builder_desc: "Продолжая правление Давида Строителя, принесите нашим городам славу, богатство и вес."
 geo_svetitskhoveli_cathedral: "Собор Светицховели"
 geo_svetitskhoveli_cathedral_desc: "Собор Животворящего Столпа, сердце Грузинской апостольской церкви, — отстройте его пышнее, чем когда-либо."
 geo_patriarchate_of_georgia: "Патриархат всея Грузии"
 geo_patriarchate_of_georgia_desc: "Чем весомее держава, тем громче зовут возвести автокефальную Грузинскую церковь в достоинство патриархата."
 geo_silk_road_trade: "Торговля Шёлкового пути"
 geo_silk_road_trade_desc: "Как узел, связывающий Восток и Запад Шёлковым путём, наполните города Грузии торговым богатством."
 geo_mountain_fortresses: "Горные крепости"
 geo_mountain_fortresses_desc: "Обратите себе на пользу суровый кавказский рельеф и завершите сеть крепостей, способную остановить любое войско."
 geo_golden_age: "Золотой век завершён"
 geo_golden_age_desc: "Золотой век, выстроенный царицей Тамарой и Давидом Строителем, — поднимите его славу на невиданную высоту."
 geo_events.1.t: "Падение Сарая"
 geo_events.1.d: "Сарай, столица монгольского преемника, в наших руках. Власть кагана, когда-то сотрясавшая православный мир, осталась в прошлом."
 geo_events.1.a: "Погибель кагана свершилась!"
 geo_events.2.t: "Падение Константинополя"
 geo_events.2.d: "Великий имперский город Константинополь наконец в наших руках. Над городом, что был под властью неверных, реет грузинское знамя — царь Кавказа принимает титул наследника Рима."
 geo_events.2.a: "Да здравствует Римская империя! Да здравствует грузинский император!"
 geo_events.99.t: "Провозглашение золотого века"
 geo_events.99.d: "От Кавказа до Средиземного моря — золотой век, о котором мечтала царица Тамара, наступил. Небольшое горное царство возродилось великой империей, озаряющей православный мир."
 geo_events.99.a: "Слава Грузии! Да здравствует золотой век!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "Блеск Багратиони"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "Царская кровь даёт державе престиж и легитимность."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Прочное наследование"
 STATIC_MODIFIER_DESC_geo_succession_mod: "Наследование престола прочно, внутренние волнения улеглись."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Грузия воссоединена"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "Распавшиеся области вновь соединены под одной короной."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "Сеть кавказских крепостей"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Укрепление горных краёв сильно улучшило нашу оборону."
 STATIC_MODIFIER_NAME_geo_church_mod: "Грузинская церковь"
 STATIC_MODIFIER_DESC_geo_church_mod: "Православная церковь стала опорой державы и скрепляет единство верой."
 STATIC_MODIFIER_NAME_geo_court_mod: "Блеск царского двора"
 STATIC_MODIFIER_DESC_geo_court_mod: "Царский двор в Тбилиси сияет средоточием культуры и власти на Кавказе."
 STATIC_MODIFIER_NAME_geo_army_mod: "Грузинское войско"
 STATIC_MODIFIER_DESC_geo_army_mod: "Могучее войско из горских народов собрано и служит мечом царства."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Силы восстановлены"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Союзами и перевооружением царство шагнуло к новому будущему."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "Замысел царицы Тамары"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Наши армянские братья освобождены, и власть Тбилиси дотянулась на восток."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Ширван возвращён"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Мы закрепились на Каспийском море, и богатство восточной торговли потекло к нам."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Наследники сельджуков"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "Державы, унаследовавшие дело сельджуков, отброшены, и власть креста вернулась на восток."
 STATIC_MODIFIER_NAME_geo_gates_mod: "Александровы ворота"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Северные перевалы пройдены, племена к северу от Кавказа покорены."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Крым захвачен"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "Последнее прибежище татар покорено, и через Чёрное море открылись торговые пути."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Господство на Чёрном море"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "Большая часть черноморского побережья вошла в торговый круг Грузии."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Союз с царём"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Отношения с первой силой Руси налажены, и это расширяет нашу сеть связей."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Владычество над Кавказом"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Горы, степь и Чёрное море — владычество над всем Кавказом завершено."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Уговор с Трапезундом"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "Связь со старым другом обновлена, и торговля между двумя державами процветает."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Джалаиридский султанат покорён"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "Джалаиридская угроза устранена, и это доказало силу нашего войска."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Наступление на мамлюков"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "Продвижение на восток улучшило наше положение против неверных."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Кипр завоёван"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Опора восточного Средиземноморья взята, и наша морская торговля сильно окрепла."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Колыбель цивилизации"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Богатства Месопотамии укрепили хозяйственное основание Грузии."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "Святой город взят"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "Возвращение Иерусалима подняло власть церкви и благочестие народа."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Свет Востока"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "Освобождение восточных патриархатов подняло боевой дух и честь войска."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Поход в Анатолию"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Отмщение за Манцикерт улучшило дисциплину и удачу на поле боя."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "Падение империи"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "Устранение османской угрозы сильно подняло наш престиж."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Светоч христианского мира"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "Как защитник веры мы сильно поднялись в глазах единоверцев."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Тбилиси отстроен"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "Царская столица Тбилиси возвращает себе прежнее великолепие."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Грузинские виноградники"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "Тысячелетнее виноделие приносит царству богатство и устойчивость."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Родная словесность возрождена"
 STATIC_MODIFIER_DESC_geo_literature_mod: "Распространение письма мхедрули продвинуло учёность и управление."
 STATIC_MODIFIER_NAME_geo_builder_mod: "Наследие Строителя"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Продолжая волю Давида Строителя, наши города идут дорогой процветания."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Собор Светицховели"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "Собор Животворящего Столпа отстроен и вернул себе величие средоточия веры."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Патриархат всея Грузии"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "Грузинская церковь возведена в патриархат, и её достоинство признано широко."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "Торговля Шёлкового пути"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Как узел торговли между Востоком и Западом, города Грузии полнятся богатством."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "Сеть горных крепостей"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "Сеть крепостей, выстроенная по кавказскому рельефу, остановит любое большое войско."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "Золотой век завершён"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "Золотой век, выстроенный царицей Тамарой и Давидом Строителем, поднялся на новую высоту."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "Наследие имперской Византии"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "Дипломатическая и управленческая машина тысячелетнего города перешла к нам. Приняв римское чиновничество и посольский обычай, мы видим, что подданные вернее, а присоединение земель идёт глаже."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "Сеть управления золотого века"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "Великая империя от Кавказа до Средиземного моря связана царскими дорогами и сетью наместников. Процветание, выстроенное царицей Тамарой и Давидом Строителем, доносит свет короны до самых дальних областей, и легитимность с престижем династии непоколебимы."
