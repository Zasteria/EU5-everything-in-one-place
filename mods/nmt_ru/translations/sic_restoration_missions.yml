l_russian:
 sic_restoration_mission_pack: "Путь Сицилийского королевства"
 sic_restoration_mission_pack_DESCRIPTION:0 "Отделённое от Неаполя восстанием 1282 года, Сицилийское королевство готово собрать силы острова в самом сердце Средиземноморья и снова вписать своё имя в историю. Переправитесь ли вы через пролив, чтобы вновь соединиться с Неаполем, или превратите сам остров в золотую землю? Выбор за вами, государь."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Выполняйте задания за Сицилийское королевство, стремясь восстановить Обе Сицилии или привести остров к золотому веку."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Выполняйте задания, чтобы пройти путь Сицилийского королевства."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Завоюйте Неаполь за проливом и создайте Королевство Обеих Сицилий — или отшлифуйте сам остров Сицилию в жемчужину Средиземноморья. Оба пути ведут к процветанию нового королевства!"
 sic_divided_kingdom: "По ту сторону пролива"
 sic_divided_kingdom_desc: "В 1282 году, в восстании, известном как Сицилийская вечерня, мы свергли власть Анжуйского дома. Не в силах больше терпеть произвол французских чиновников, жители острова как один поднялись под звон вечерних колоколов и изгнали французов с наших берегов. Новым королём мы призвали Педро III Арагонского, и так Сицилийское королевство раскололось надвое. За проливом, на материке с центром в Неаполе, король из Анжуйского дома всё ещё зовёт себя \"королём Сицилии.\" Лишь мы — законные короли этого острова. Соперничество двух королевств продолжается по сей день."
 sic_divided_kingdom_tooltip: "Неаполь (NAP) объявлен соперником, или с Неаполем заключён союз."
 sic_ambitions_on_naples: "Притязания на Неаполь"
 sic_ambitions_on_naples_desc: "Анжуйский король за проливом по праву выступает соперником в притязании на сам титул короля Сицилии. Пришло время нарастить постоянную армию и выдвинуть законный повод однажды забрать себе корону Неаполя."
 sic_ambitions_on_naples_tooltip: "Регулярная армия — 2 000 человек и больше."
 sic_army_of_the_island: "Флот острова"
 sic_army_of_the_island_desc: "Остров Сицилия — крепость, со всех сторон окружённая морем. Чтобы переправить войска через пролив к Неаполю, сначала нужно построить мощный флот, обеспечив и оборону острова, и безопасную переправу войск."
 sic_army_of_the_island_tooltip: "Флот — 10 кораблей и больше."
 sic_conquest_of_naples: "Завоевание Неаполя"
 sic_conquest_of_naples_desc: "Наконец наши войска переправились через пролив и высадились на неаполитанском берегу. Если разбить анжуйскую армию и завладеть короной Неаполя, королевство, расколотое надвое в 1282 году, вновь станет единым под нашей властью."
 sic_conquest_of_naples_tooltip: "Владеть Неаполем."
 sic_two_sicilies: "Обе Сицилии"
 sic_two_sicilies_desc: "Неаполь и Палермо, две короны, теперь в наших руках. Пришло время провозгласить новое королевство по обе стороны пролива — Королевство Обеих Сицилий. Это историческое свершение кладёт конец расколу 1282 года."
 sic_two_sicilies_tooltip: "Владеть и Неаполем, и Палермо."
 sic_golden_wheat_fields: "Золотые пшеничные поля"
 sic_golden_wheat_fields_desc: "С древних времён остров Сицилию зовут житницей Средиземноморья. Если развить плодородные равнины вокруг Палермо, их богатый урожай прокормит всё королевство, а излишки зерна уйдут за море ценным товаром."
 sic_golden_wheat_fields_tooltip: "Уровень добычи ресурсов в Палермо — 5 и больше."
 sic_palermo_resurgent: "Возрождение Палермо"
 sic_palermo_resurgent_desc: "Во времена Норманнского королевства Палермо был городом непревзойдённого великолепия на Средиземном море. Новые постройки здесь и возвращение хоть части былого блеска станут первым шагом к развитию всего острова."
 sic_palermo_resurgent_tooltip: "Суммарный уровень построек в Палермо — 30 и больше."
 sic_mediterranean_crossroads: "Перекрёсток средиземноморской торговли"
 sic_mediterranean_crossroads_desc: "Остров Сицилия лежит на самом перекрёстке Средиземноморья, где сходятся торговые пути Востока и Запада. Если устроить рынки в портах острова, сюда съедутся купцы из всех земель и доход королевства от торговли сильно вырастет."
 sic_mediterranean_crossroads_tooltip: "Владеть хотя бы одним районом с рыночным центром."
 sic_sicilian_renaissance: "Сицилийское Возрождение"
 sic_sicilian_renaissance_desc: "Сицилийский двор, где встречаются норманнская, арабская, византийская и латинская культуры, издавна был средоточием искусства и учёности. Множество творений, собранных в Палермо, предвещает зарю нового культурного расцвета."
 sic_sicilian_renaissance_tooltip: "В Палермо 20 и больше творений."
 sic_kingdom_resurgent: "Возрождённое королевство"
 sic_kingdom_resurgent_desc: "Как королевство по обе стороны пролива или как остров, сияющий культурой и торговлей в сердце Средиземноморья, Сицилия снова вписала своё имя в историю. Отсюда путь этого королевства ознаменует рассвет новой эпохи."
 sic_kingdom_resurgent_tooltip: "Всего 100 и больше районов."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "Флот острова"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "Заново устроенный флот острова отличается высоким боевым духом и большим запасом рекрутов."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "Завоевание Неаполя"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Пройдя через неаполитанский поход, королевское войско стало дисциплинированнее, а наши позиции на мирных переговорах — крепче."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "Обе Сицилии"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "Престиж и легитимность нового королевства по обе стороны пролива высоки как никогда."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Золотые пшеничные поля"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "Плодородная земля Сицилии сильно подняла производство пищи во всём королевстве."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Возрождение Палермо"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Возрождение Палермо сильно подстегнуло рост и производительность этой земли."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Перекрёсток средиземноморской торговли"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "Рынки, устроенные по всему острову, сильно подняли доход королевства от торговли и размах его купцов."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "Сицилийское Возрождение"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "Культура, расцветшая в Палермо, сделала искуснее новых творцов на службе королевства."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "Возрождённое королевство"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "Блеск возрождённого королевства поднял его престиж и легитимность и усилил его позиции на мирных переговорах как никогда прежде."
 sic_events.1.t: "Королевство, расколотое надвое"
 sic_events.1.d: "В 1282 году мы восстали против власти Анжуйского дома. Не в силах больше терпеть произвол чиновников, присланных из Франции, жители острова как один поднялись под звон вечерних колоколов и изгнали французов с наших берегов. Новым королём мы призвали Педро III Арагонского, и так Сицилийское королевство раскололось надвое. За проливом, на материке с центром в Неаполе, король из Анжуйского дома всё ещё зовёт себя \"королём Сицилии.\" Лишь мы — подлинные короли этого острова. Соперничество двух королевств продолжается по сей день."
 sic_events.1.a: "Понятно"
