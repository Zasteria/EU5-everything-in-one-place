l_russian:
 brb_estates_balance_reform: "Равновесие знати и горожан"
 brb_estates_balance_reform_desc: "Феодальная знать или торговые горожане — чей голос громче, тот и определяет лицо власти великого герцогства. Чем больше влияние знати, тем крепче феодальный порядок и налоговая сила; чем больше влияние горожан, тем выше торговое процветание."
