l_russian:
 hab_habsburg_mission_pack: "Господство Габсбургов и Всемирная империя"
 hab_habsburg_mission_pack_DESCRIPTION:0 "С берегов Дуная притязания Габсбургского дома простираются на всю Европу. Закрепите за собой трон императора Священной Римской империи, завоюйте Венгрию на востоке, Францию и Испанию на западе, Италию на юге. А затем пусть Вена засияет величайшим городом мира — и Всемирная империя станет явью."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "Правьте СРИ, завоюйте Запад, Восток и Италию и создайте Всемирную империю."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Объедините Европу под властью Габсбургов."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "«Пусть воюют другие, а ты, счастливая Австрия, заключай браки!» — станьте хозяином Европы и дипломатией, и завоеваниями!"
 hab_habsburg_ascendancy: "Возвышение Габсбургского дома"
 hab_habsburg_ascendancy_desc: "Кровь Рудольфа Габсбурга бьётся на берегах Дуная — началась эпоха дипломатии и завоеваний."
 hab_secure_electors: "Заручиться курфюрстами"
 hab_secure_electors_desc: "Трон императора Священной Римской империи решают голоса курфюрстов. Союзом или подавляющей силой — удержите императорскую корону за Габсбургским домом."
 hab_imperial_authority: "Утвердить императорскую власть"
 hab_imperial_authority_desc: "Власть Священной Римской империи сходится к воле Габсбургского дома — настало время всей империи повиноваться приказам Вены."
 hab_counter_reformation: "Контрреформация"
 hab_counter_reformation_desc: "Ересь Мартина Лютера сотрясает Германию — проведите в жизнь постановления Тридентского собора и защитите католическую веру."
 hab_charlemagne_legacy: "Наследие Карла Великого"
 hab_charlemagne_legacy_desc: "Верните под знамя Габсбургов южную Германию, которую тысячу лет назад объединил Карл Великий, — так закладывается основа имперской реформы."
 hab_imperial_reform: "Имперская реформа"
 hab_imperial_reform_desc: "Имперская реформа — увековечьте власть Габсбургов, перестроив правящие учреждения империи."
 hab_emperors_of_rome: "Наследник римских императоров"
 hab_emperors_of_rome_desc: "Мечта со времён Карла Великого: владея Вечным городом Римом и СРИ, Габсбургский дом провозглашает себя «наследником римских императоров»."
 hab_reclaim_burgundy: "Вернуть Бургундию"
 hab_reclaim_burgundy_desc: "Лотарингия и Бургундия — верните западные земли, некогда принадлежавшие Габсбургскому дому."
 hab_austrian_netherlands: "Австрийские Нидерланды"
 hab_austrian_netherlands_desc: "Богатые торговые города Фландрии и Брабанта — богатство Нидерландов питает казну империи Габсбургов."
 hab_weaken_france: "Ослабить Францию"
 hab_weaken_france_desc: "Давняя соперница Франция — главное препятствие к господству в Европе. Ослабьте её и лишите сил вмешиваться в дела Германии и Италии."
 hab_defeat_france: "Разгром Франции"
 hab_defeat_france_desc: "«Галлия пала» — давняя соперница Франция побеждена Габсбургским домом. Господство над Западной Европой принадлежит Габсбургам."
 hab_iberian_marriage: "Брачная дипломатия с Иберией"
 hab_iberian_marriage_desc: "«Пусть воюют другие, а ты, счастливая Австрия, заключай браки» — браки с Испанией и Португалией открывают дверь в империю, над которой никогда не заходит солнце."
 hab_crown_of_spain: "Корона Испании"
 hab_crown_of_spain_desc: "Весь Пиренейский полуостров — Габсбургский дом провозглашает себя «королём Испании», и империя, над которой никогда не заходит солнце, начинает обретать очертания."
 hab_italian_ambition: "Притязания в Италии"
 hab_italian_ambition_desc: "Богатые города-государства Северной Италии — подчините Милан, Венецию и Неаполь Габсбургам."
 hab_duchy_of_milan: "Захватить Миланское герцогство"
 hab_duchy_of_milan_desc: "Милан — сердце Северной Италии. Захватите этот хозяйственный и военный оплот и создайте опору для завоевания Италии."
 hab_papal_alliance: "Отношения с папой"
 hab_papal_alliance_desc: "Папа — наладьте отношения с этим духовным владыкой католического мира и поднимите легитимность Габсбургского дома."
 hab_venetian_ports: "Порты Венеции"
 hab_venetian_ports_desc: "Венеция, «владычица Адриатики», — захватите её порты и флот и откройте себе путь в средиземноморскую торговлю."
 hab_king_of_naples: "Король Неаполя"
 hab_king_of_naples_desc: "Неаполитанское королевство — ключ к Южной Италии. Эта корона — первый шаг к власти Габсбургов над всей Италией."
 hab_king_of_italy: "Король Италии"
 hab_king_of_italy_desc: "«Железная корона» сияет на челе императора из дома Габсбургов — вся Италия, от Ломбардии до Сицилии, объединена."
 hab_eastern_ambitions: "Притязания на Востоке"
 hab_eastern_ambitions_desc: "Богемия и Венгрия — заявите притязания на эти две великие державы Восточной Европы и начните натиск Габсбургов на восток."
 hab_crown_of_bohemia: "Корона Богемии"
 hab_crown_of_bohemia_desc: "Корона святого Вацлава в Праге — эта корона станет основой продвижения Габсбургов на восток."
 hab_royal_hungary: "Королевская Венгрия"
 hab_royal_hungary_desc: "Буда освобождена от османов — корона Венгрии возвращается на чело императора из дома Габсбургов, и рождается «Королевская Венгрия»."
 hab_bohemian_union: "Слияние унии с Богемией"
 hab_bohemian_union_desc: "Личная уния с Богемией окрепла — теперь решите: править ею напрямую как объединённой коронной землёй или сохранить всё как есть."
 hab_secure_croatia: "Закрепить Хорватию"
 hab_secure_croatia_desc: "Устройте в Хорватии Военную границу, чтобы остановить набеги османов, и сделайте её опорой для завоевания Балкан."
 hab_ottoman_menace: "Османская угроза"
 hab_ottoman_menace_desc: "Османская империя — злейший враг Восточной Европы, сокрушивший Константинополь. Пусть Габсбургский дом станет оплотом, защищающим христианский мир."
 hab_liberate_balkans: "Освободить Балканы"
 hab_liberate_balkans_desc: "Освободите христиан Балканского полуострова от османского владычества — голос православных верующих взывает к имени Габсбургов."
 hab_scourge_of_europe: "Бич Европы"
 hab_scourge_of_europe_desc: "Османская империя полностью изгнана из Европы — кошмар, начавшийся с осады Вены в 1683 году, окончен."
 hab_emperors_of_east: "Император Востока"
 hab_emperors_of_east_desc: "Константинополь — столица и Восточной, и Западной Римской империи — переходит в руки Габсбургов. Короны Востока и Запада соединены."
 hab_austrian_heartland: "Утвердить австрийское сердце державы"
 hab_austrian_heartland_desc: "Австрийские коренные земли на Дунае — закрепите сердце имперского расширения и заложите основу его хозяйства и войска."
 hab_tyrol_styria: "Тироль и Штирия"
 hab_tyrol_styria_desc: "Серебро Шваца и железо Леобена — рудники Тироля и Штирии питают казну и войска империи Габсбургов."
 hab_dev_vienna: "Развитие Вены"
 hab_dev_vienna_desc: "«Город музыки», «белый город Габсбургов» — наполните Вену великолепием, достойным имперской столицы."
 hab_austrian_economy: "Развитие австрийского хозяйства"
 hab_austrian_economy_desc: "Дунайская торговля, богемские рудники, итальянские промыслы — соедините эти разные основы хозяйства и сделайте империю Габсбургов первой хозяйственной державой Европы."
 hab_graz_fortress: "Укрепить Грац"
 hab_graz_fortress_desc: "Грац — превратите столицу Штирии в неприступный город-крепость, готовый к османским набегам."
 hab_baroque_vienna: "Барочная Вена"
 hab_baroque_vienna_desc: "Барочные музыка, зодчество и живопись расцветают при венском дворе — университеты и академии художеств возвещают золотой век культуры Габсбургов."
 hab_great_vienna: "Великий город Вена"
 hab_great_vienna_desc: "Дворец Шёнбрунн, собор Святого Стефана — Вена завершена как величайший и прекраснейший город Европы."
 hab_diplomatic_marriages: "Династические браки"
 hab_diplomatic_marriages_desc: "«Пусть воюют другие, а ты, счастливая Австрия, заключай браки» — сплетите сеть брачной дипломатии с главными королевскими домами Европы."
 hab_trade_empire: "Торговая империя"
 hab_trade_empire_desc: "Венеция, Антверпен, Гамбург — торговая империя Габсбургов, объединившая главные торговые города Европы, начинает господствовать в мировой торговле."
 hab_swiss_lands: "Вернуть швейцарские земли"
 hab_swiss_lands_desc: "Смойте позор, символом которого стал Вильгельм Телль, — верните Габсбургскому дому землю альпийских крестьян."
 hab_south_german_cities: "Торговые города Южной Германии"
 hab_south_german_cities_desc: "Аугсбург и Франкфурт — захватите эти богатые города, родину Фуггеров и Ротшильдов."
 hab_unify_germany: "Объединение Германии"
 hab_unify_germany_desc: "Разрозненные германские княжества — теперь, наконец, объединены под знаменем Габсбургов."
 hab_north_sea_trade: "Торговля в Северном море"
 hab_north_sea_trade_desc: "Гамбург и Амстердам — возьмите в свои руки торговлю в Северном море и постройте новую торговую империю на смену Ганзейскому союзу."
 hab_hegemon_of_west: "Гегемон Запада"
 hab_hegemon_of_west_desc: "Франция, Испания — все великие державы Запада, что некогда бросали вызов Габсбургскому дому, ныне покорены."
 hab_tuscany: "Завоевание Тосканы"
 hab_tuscany_desc: "Ренессансная культура Флоренции — возьмите под крыло империи Габсбургов этот край искусств, расцветший под покровительством Медичи."
 hab_dev_vienna_great: "Большая Вена"
 hab_dev_vienna_great_desc: "Вена поднимается ещё выше — на пути к завершению как величайший город Европы."
 hab_sicily: "Завоевание Сицилии"
 hab_sicily_desc: "Сицилия, ключ к Средиземноморью, — сделайте этот остров краеугольным камнем господства Габсбургов на Средиземном море."
 hab_surpass_poland: "Превзойти Польшу"
 hab_surpass_poland_desc: "Польское королевство — утвердите военное превосходство Габсбургов в противостоянии с этой великой державой Восточной Европы."
 hab_transylvania: "Трансильвания"
 hab_transylvania_desc: "Трансильвания в кольце Карпат — закрепите этот многонародный край как восточный рубеж империи Габсбургов."
 hab_balkans_crusade: "Крестовый поход на Балканы"
 hab_balkans_crusade_desc: "«Так хочет Бог» — объявите крестовый поход против Османской империи и освободите христиан от власти ислама."
 hab_wallachia_moldavia: "Валахия и Молдавия"
 hab_wallachia_moldavia_desc: "Покорите румынские княжества к северу от Дуная и завершите власть Габсбургов над Балканами."
 hab_austrian_army: "Преобразовать австрийскую армию"
 hab_austrian_army_desc: "Войско Габсбургов — вырастите сильнейшую армию Европы, выкованную из союза многонародных полков."
 hab_spanish_tercios: "Испанская терция"
 hab_spanish_tercios_desc: "Терция — введите это переворотное испанское построение во всём войске Габсбургов и доведите до совершенства лучшую пехоту Европы."
 hab_multicultural: "Многонародная империя"
 hab_multicultural_desc: "Немцы, чехи, венгры, хорваты, итальянцы — опыт империи Габсбургов по объединению многих народов под одним знаменем завершён."
 hab_north_germany: "Власть над Северной Германией"
 hab_north_germany_desc: "Гамбург и Бранденбург — вся Северная Германия теперь во владениях империи Габсбургов."
 hab_alsace_lorraine: "Эльзас-Лотарингия"
 hab_alsace_lorraine_desc: "Эльзас и Лотарингия на Рейне — закрепите эту землю как западный рубеж империи Габсбургов."
 hab_dev_buda: "Развитие Буды"
 hab_dev_buda_desc: "Буда — отвоевав у османов древнюю столицу Венгерского королевства, возродите её как восточную столицу империи."
 hab_renaissance_court: "Ренессансный двор"
 hab_renaissance_court_desc: "Свет Возрождения сияет при венском дворе — итальянское искусство и византийская учёность сливаются, и культура Габсбургов расцветает в полную силу."
 hab_carinthia: "Каринтия"
 hab_carinthia_desc: "Каринтия — включите это альпийское герцогство во владения Габсбургов и закрепите проход в Италию и на Балканы."
 hab_innsbruck: "Развитие Инсбрука"
 hab_innsbruck_desc: "Инсбрук, столица Тироля, — развивайте этот прекрасный альпийский имперский город как юго-западный оплот империи Габсбургов."
 hab_colonialism: "Колониальная империя"
 hab_colonialism_desc: "Через Испанию — в Америку: постройте колониальную империю, над знаменем Габсбургов которой никогда не заходит солнце."
 hab_universal_empire: "Всемирная империя"
 hab_universal_empire_desc: "«Всемирная империя — от Лиссабона на западе до Константинополя на востоке, от Гамбурга на севере до Палермо на юге» — мечта со времён Карла Великого сбылась."
 hab_events.1.t: "Габсбургский дом — на трон Священной Римской империи"
 hab_events.1.d: "Курфюрсты объявили о поддержке Габсбургского дома — императорский трон принадлежит Габсбургам."
 hab_events.1.a: "Да здравствует император Габсбург! Да здравствует империя!"
 hab_events.10.t: "Провозглашение наследником римских императоров"
 hab_events.10.d: "Имперская реформа завершена, и Вечный город Рим соединён с СРИ — Габсбургский дом провозглашает себя «наследником римских императоров»."
 hab_events.10.a: "Да здравствует имперская реформа! Да здравствует наследник Рима!"
 hab_events.15.t: "Провозглашение объединения Германии"
 hab_events.15.d: "С севера до юга — Германия, некогда раздробленная на бесчисленные княжества, объединена под знаменем Габсбургов."
 hab_events.15.a: "Да здравствует объединение Германии!"
 hab_events.20.t: "Упадок Франции — путь к трону"
 hab_events.20.d: "Франция наконец склонилась перед Габсбургским домом. Настало время заявить законное притязание на французский трон — объявите притязание на шестьдесят лет и нацельтесь на наследование Французского королевства."
 hab_events.20.a: "Заявить притязание на французский трон (60 лет)"
 hab_events.25.t: "Корона Испании"
 hab_events.25.d: "«Король Испании и эрцгерцог Австрийский» — Пиренейский полуостров теперь во владениях империи Габсбургов."
 hab_events.25.a: "Да здравствует Испания! Да здравствует империя Габсбургов!"
 hab_events.30.t: "Король Италии"
 hab_events.30.d: "«Железная корона» сияет на челе императора из дома Габсбургов — вся Италия, от Ломбардии до Сицилии, объединена."
 hab_events.40.t: "Основание Королевской Венгрии"
 hab_events.40.d: "Буда освобождена — «Королевская Венгрия» становится восточной опорой империи Габсбургов."
 hab_events.40.a: "Венгрия освобождена! Да здравствует Буда!"
 hab_events.45.t: "Конец Османской империи"
 hab_events.45.d: "Османская империя полностью изгнана из Европы — христианский мир ликует."
 hab_events.45.a: "Торжество христианского мира! Османы побеждены!"
 hab_events.50.t: "Император Востока"
 hab_events.50.d: "Константинополь перешёл в руки Габсбургов — столицы и Восточной, и Западной Римской империи теперь в одних руках."
 hab_events.50.a: "Да здравствует Константинополь! Да здравствует император Востока!"
 hab_events.55.t: "Великий город Вена"
 hab_events.55.d: "Дворец Шёнбрунн, собор Святого Стефана — Вена завершена как величайший и прекраснейший город Европы."
 hab_events.55.a: "Да здравствует великая Вена!"
 hab_events.65.t: "Богемия — включение как коронной земли"
 hab_events.65.d: "Личная уния с Богемией окрепла, и пришло время полного слияния. Править ею напрямую как объединённой коронной землёй или сохранить нынешнюю личную унию — решайте."
 hab_events.65.a: "Включить Богемию как объединённую коронную землю"
 hab_events.99.t: "Провозглашение Всемирной империи"
 hab_events.99.d: "«Всемирная империя — император из дома Габсбургов правит от Лиссабона на западе до Константинополя на востоке» — это провозглашение разносится по всей Европе."
 hab_events.99.a: "Да здравствует Всемирная империя! Империя Габсбургов навеки!"
 hab_events.65.b: "Сохранить нынешнюю личную унию"
 STATIC_MODIFIER_NAME_hab_army_mod: "Отборная армия Габсбургов"
 STATIC_MODIFIER_DESC_hab_army_mod: "Армия Габсбургов, объединившая полки разных народов, стала сильнейшим сухопутным войском Европы."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Освобождение Балкан"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Христиане Балкан освобождены от османского владычества."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Барочная Вена"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "Барочное искусство расцветает при венском дворе и делает его средоточием европейской культуры."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Сопротивление слиянию с Богемией"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "Знать Богемии противится слиянию и на время снижает лояльность сюзерену."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "Корона Богемии"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "Золотая Прага входит в империю как вторая столица Габсбургского дома."
 STATIC_MODIFIER_NAME_hab_burgundy_mod: "Возвращение Бургундии"
 STATIC_MODIFIER_DESC_hab_burgundy_mod: "Утраченные бургундские земли вернулись под власть Габсбургов."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Покорение Каринтии"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Каринтия стала для империи Габсбургов важным альпийским проходом, связывающим север и юг."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Торжество Контрреформации"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Католическая вера под защитой по всей империи."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "Наследие Карла Великого"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "Наследие Карла Великого даёт империи Габсбургов новую легитимность."
 STATIC_MODIFIER_NAME_hab_colonial_mod: "Заря колониальной империи"
 STATIC_MODIFIER_DESC_hab_colonial_mod: "Построена колониальная империя, над знаменем Габсбургов которой никогда не заходит солнце."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "Хорватская Военная граница"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "В Хорватии устроена Военная граница, останавливающая османские набеги."
 STATIC_MODIFIER_NAME_hab_crusade_mod: "Дух крестового похода"
 STATIC_MODIFIER_DESC_hab_crusade_mod: "Пыл Балканского крестового похода выковал из войска Габсбургов лучших воинов."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Расширение Дунайской империи"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Нижний Дунай покорён, и власть Габсбургов над всеми Балканами завершена."
 STATIC_MODIFIER_NAME_hab_dev_buda_loc_mod: "Буда — сердце Венгрии"
 STATIC_MODIFIER_DESC_hab_dev_buda_loc_mod: "Буда освобождена и возрождается как столица Венгерского королевства в составе империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_diplomacy_mod: "Дипломатическая сеть Габсбургов"
 STATIC_MODIFIER_DESC_hab_diplomacy_mod: "Брачной дипломатией Габсбургский дом сплёл величайшую дипломатическую сеть Европы."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "Пробуждение Габсбургского дома"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "Притязания Габсбургского дома разгорелись — начинается эпоха дипломатии и завоеваний."
 STATIC_MODIFIER_NAME_hab_economy_mod: "Хозяйственный мир Габсбургов"
 STATIC_MODIFIER_DESC_hab_economy_mod: "Хозяйственная мощь Богемии, Италии и Нидерландов соединена."
 STATIC_MODIFIER_NAME_hab_france_mod: "Война с Францией"
 STATIC_MODIFIER_DESC_hab_france_mod: "Давняя соперница Франция ослаблена, и дорога к господству Габсбургов в Европе открыта."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Укрепление Граца"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Грац превращён в неприступный город-крепость, отражающий османские набеги."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "Великий город Вена завершён"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Вена завершена как величайший город Европы и сияет вечной столицей империи."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Прочность австрийских коренных земель"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "Австрийские коренные земли спокойны, и основа имперского расширения заложена."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Гегемон Запада"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "В Западной Европе не осталось державы, способной бросить вызов господству Габсбургов."
 STATIC_MODIFIER_NAME_hab_iberia_mod: "Союз с Иберией"
 STATIC_MODIFIER_DESC_hab_iberia_mod: "Узы с Испанией и Португалией расширили мировое влияние империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Утверждение императорской власти"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Вся Священная Римская империя теперь повинуется приказам Габсбургского дома."
 STATIC_MODIFIER_NAME_hab_innsbruck_mod: "Развитие Инсбрука"
 STATIC_MODIFIER_DESC_hab_innsbruck_mod: "Инсбрук, столица Тироля, вырос в прекрасный альпийский имперский город."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Плоды Итальянских войн"
 STATIC_MODIFIER_DESC_hab_italian_mod: "Итальянские походы выковали из войска Габсбургов отборную силу."
 STATIC_MODIFIER_NAME_hab_milan_mod: "Милан — сердце Северной Италии"
 STATIC_MODIFIER_DESC_hab_milan_mod: "Милан как узел торговли Северной Италии приносит империи Габсбургов огромные богатства."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Многонародная империя создана"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "Чудо мирного сосуществования многих народов под знаменем Габсбургов свершилось."
 STATIC_MODIFIER_NAME_hab_naples_mod: "Захват Неаполитанского королевства"
 STATIC_MODIFIER_DESC_hab_naples_mod: "Власть Габсбургов над Южной Италией утверждена."
 STATIC_MODIFIER_NAME_hab_netherlands_mod: "Австрийские Нидерланды"
 STATIC_MODIFIER_DESC_hab_netherlands_mod: "Богатые торговые города Нидерландов приносят империи Габсбургов огромные налоги."
 STATIC_MODIFIER_NAME_hab_north_german_mod: "Покорение Северной Германии"
 STATIC_MODIFIER_DESC_hab_north_german_mod: "Северная Германия объединена под знаменем Габсбургов."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Господство в торговле Северного моря"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "Торговля в Северном море перешла под власть империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Война с Османской империей"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "Победа над Османской империей принесла империи Габсбургов славу оплота христианского мира."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Примирение с папой"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Отношения с папой налажены, и Габсбургский дом признан хранителем католического мира."
 STATIC_MODIFIER_NAME_hab_poland_mod: "Покорение Польши"
 STATIC_MODIFIER_DESC_hab_poland_mod: "Польша вошла в круг влияния Габсбургов, и господство в Восточной Европе утверждено."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Завершение имперской реформы"
 STATIC_MODIFIER_DESC_hab_reform_mod: "Перестройка правящих учреждений увековечивает власть Габсбургов."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "Венское Возрождение"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "Свет Возрождения сияет при венском дворе и делает империю средоточием европейской культуры."
 STATIC_MODIFIER_NAME_hab_sicily_mod: "Покорение Сицилии"
 STATIC_MODIFIER_DESC_hab_sicily_mod: "Сицилия, ключ к Средиземноморью, стала краеугольным камнем империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "Торговые города Южной Германии"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "Богатые вольные города Южной Германии стали ядром имперского хозяйства."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "Железные рудники Леобена"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "Штирийское железо питает военную мощь империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Покорение Швейцарии"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "Альпийское крестьянское государство завоёвано, и господство Габсбургов утверждено."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "Испанская терция"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "Построение терции введено во всём войске Габсбургов, и родилась лучшая пехота Европы."
 STATIC_MODIFIER_NAME_hab_trade_mod: "Европейская торговая империя"
 STATIC_MODIFIER_DESC_hab_trade_mod: "Главные торговые пути Европы перешли под власть империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_transylvania_mod: "Покорение Трансильвании"
 STATIC_MODIFIER_DESC_hab_transylvania_mod: "Карпатская Трансильвания стала восточным рубежом империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Процветание Тосканы"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "Ренессансная культура Флоренции цветёт под защитой империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_tyrol_silver_mod: "Серебряные рудники Шваца"
 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "Серебряные рудники Тироля питают казну империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Провозглашение Всемирной империи"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "«Всемирная империя» — вся Европа объединена под знаменем Габсбургов."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "Захват Венеции"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "«Владычица Адриатики» теперь питает морскую силу империи Габсбургов."
 STATIC_MODIFIER_NAME_hab_vienna_expand_mod: "Большая Вена"
 STATIC_MODIFIER_DESC_hab_vienna_expand_mod: "Вена вступила на путь к званию величайшего города Европы."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Вена — сердце империи"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Вена сияет как культурное и управленческое средоточие империи."
 hab_integrated_crown: "Объединённая коронная земля"
 hab_integrated_crown_plural: "Объединённые коронные земли"
 hab_events.40.b: "Сохранить нынешние отношения"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Сопротивление слиянию с Венгрией"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "Знать Венгрии противится слиянию и на время снижает лояльность сюзерену."
 hab_integrated_crown_desc: "Объединённая коронная земля — особый вид ленника: у неё общий правитель с императором из дома Габсбургов, дипломатия ограничена, а сюзерен может сам строить и развивать её ресурсы. Её нельзя аннексировать 100 лет."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "Обретение короны Испании"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "Пиренейский полуостров вошёл во владения империи Габсбургов, открыв дверь в империю, над которой никогда не заходит солнце."
 STATIC_MODIFIER_NAME_hab_fra_loyalty_mod: "Сопротивление слиянию с Францией"
 STATIC_MODIFIER_DESC_hab_fra_loyalty_mod: "Знать Франции противится слиянию и на время снижает лояльность сюзерену."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "Захват Эльзас-Лотарингии"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "Пограничный край на Рейне закрепляет западный рубеж империи Габсбургов, и императорская власть крепнет."
 hab_events.30.b: "Править Италией как прежде"
 hab_events.15.b: "Да здравствует Германская империя!"
 hab_events.30.a: "Преобразовать Итальянское королевство в объединённую коронную землю"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Объединение Священной Римской империи"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "Священная Римская империя объединена, и её дороги и войска стали единым целым."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "Рождение Германской империи"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "Провозглашена Германская империя, и её рождение возвещает выученная, могучая армия."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "Наследие римских императоров"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Признанная наследницей римских императоров, империя Габсбургов резко подняла свой религиозный авторитет и учёность."
 hab_stadtrechtsbriefe: "Даровать городские грамоты"
 hab_stadtrechtsbriefe_desc: "Штадтрехтсбрифе — «грамоты городского права». Опираясь на сильную власть императора из дома Габсбургов, даруйте привилегии городам по всей державе: Венское городское право для Вены и права земского города для прочих имперских городов."
 hab_innsbruck_court: "Инсбрукский двор"
 hab_innsbruck_court_desc: "Инсбрук — теперь, когда этот главный город Тироля стал настоящим городом, учредите здесь двор как средоточие альпийской культуры Габсбургов."
 hab_swarovski_crystal: "Хрусталь Сваровски"
 hab_swarovski_crystal_desc: "С 1737 года стеклодувы Инсбрука доводили до совершенства искусство тонкой огранки хрусталя — задолго до рождения самого Сваровски тирольский хрусталь украшал дворы Европы."
 STATIC_MODIFIER_NAME_hab_stadtrecht_mod: "Дарование городских грамот"
 STATIC_MODIFIER_DESC_hab_stadtrecht_mod: "Императорские грамоты городского права открыли городские привилегии: Венское городское право и права земского города."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Развитие Инсбрукского двора"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Инсбрук начал сиять как средоточие альпийской культуры Габсбургов."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Тирольский хрустальный промысел"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Стеклодувы Инсбрука довели до совершенства искусство тонкой огранки хрусталя."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Венское городское право"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Особое городское право, даруемое одной лишь Вене: выгоды в торговле и на рынках питают процветание Вены."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Земский город"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Городские права, даруемые имперским городам: улучшают сеть дорог и уравновешивают власть короны и влияние знати."
