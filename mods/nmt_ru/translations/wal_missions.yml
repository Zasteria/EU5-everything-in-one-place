l_russian:
 wal_wallachia_mission_pack: "Орден Дракона — страж Дуная"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Валахия, зажатая между Карпатами и Дунаем. Обуздайте боярскую знать и объедините румынские княжества вместе с Молдавией и Трансильванией — или поднимите знамя Ордена Дракона, обрушьтесь войной на Османскую империю и постройте дунайскую державу."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Укрепите воеводство, объедините румынские княжества и разбейте Османскую империю, чтобы завершить дунайскую державу."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Продолжите дело Цепеша и станьте стражем Дуная."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "«Мы — дети Дракона»: волки Карпат, поднимите крест!"
 wal_voivode_beginnings: "Заря воеводства"
 wal_voivode_beginnings_desc: "В 1330 году Басараб I повернул вспять короля Венгрии в битве при Посаде — примите его дух независимости и заложите основание нового княжества между Карпатами и Дунаем."
 wal_voivode_authority: "Власть воеводы"
 wal_voivode_authority_desc: "Престол воеводы достаётся тому, кого назовёт боярская знать, — закрепите эту власть и не допустите смуты из-за спорного наследования."
 wal_boyar_council: "Боярский совет"
 wal_boyar_council_desc: "Собрание крупных землевладельцев-бояр: без их поддержки Валахией не править. Наладьте отношения с советом."
 wal_found_bucharest: "Основать Бухарест"
 wal_found_bucharest_desc: "Джурджу у самого Дуная — здесь воевода держал свой летний двор. Разверните это место как «Букурешти», оплот южной обороны и торговли."
 wal_targoviste_dev: "Развить Тырговиште"
 wal_targoviste_dev_desc: "Тырговиште, старая столица у подножия Карпат, престол многих поколений воевод, — принесите этому городу новое процветание."
 wal_fortify_carpathians: "Укрепить Карпаты"
 wal_fortify_carpathians_desc: "Карпатские горы тянутся с юга на север — наложите на этот природный вал рукотворные крепости и постройте линию обороны, которую не прорвёт ни один захватчик."
 wal_orthodox_church: "Защитить православную церковь"
 wal_orthodox_church_desc: "Православная церковь, наследница византийской веры, — встаньте во главе её автокефального патриархата и дайте власти воеводы религиозное оправдание."
 wal_dregatori: "Назначить дрегэтори"
 wal_dregatori_desc: "Самовластие наследственной знати — враг государства. Назначайте «дрегэтори», чиновников, выбранных за умение, а не за род, и постройте управление, верное короне."
 wal_unite_voivodes: "Объединить воеводства"
 wal_unite_voivodes_desc: "Валахия и Молдавия — два румынских княжества, всё ещё разделённые, и от их вражды выигрывают одни наши враги. Держава, закрепившаяся в Молдавии, отныне вправе притязать на всю эту землю."
 wal_subdue_moldavia: "Покорить Молдавию"
 wal_subdue_moldavia_desc: "Слава Стефана Великого осталась в прошлом — приведите княжество Молдавское под власть Валахии и заложите краеугольный камень румынского единства."
 wal_conquer_transylvania: "Завоевать Трансильванию"
 wal_conquer_transylvania_desc: "Трансильвания, издавна подвластная королям Венгрии и их преемникам, — введите эту землю во владения Валахии и положите конец чужому вмешательству."
 wal_szekely_land: "Земля секеев"
 wal_szekely_land_desc: "Секеи, воинственный народ восточной Трансильвании, — уважьте их вольности и ратный обычай, и пусть их доблесть станет силой Валахии."
 wal_saxon_towns: "Присоединить саксонские города"
 wal_saxon_towns_desc: "Брашов, Сибиу и прочие саксонские города Трансильвании — сделайте эти города, богатые ещё со средних веков, опорой хозяйства державы."
 wal_secure_danube: "Взять Дунай под охрану"
 wal_secure_danube_desc: "Великая река Дунай отделяет Балканы от Карпат — закрепите её берега как становую жилу южной обороны и торговли."
 wal_carpathian_hegemony: "Карпатское владычество завершено"
 wal_carpathian_hegemony_desc: "Настал час всей земле между Карпатами и Дунаем покориться власти воеводы."
 wal_romanian_unity: "Румынское единство завершено"
 wal_romanian_unity_desc: "Валахия, Молдавия, Трансильвания — соедините наконец давно разделённые земли румынского народа под одной короной."
 wal_order_of_dragon_founding: "Вступить в Орден Дракона"
 wal_order_of_dragon_founding_desc: "Император Священной Римской империи Сигизмунд учреждает Орден Дракона ради крестового похода против османов — пусть наш государь займёт своё место в этом славном братстве."
 wal_impale_the_sultan: "Посадить султана на кол"
 wal_impale_the_sultan_desc: "Султан мнит себя в безопасности за своими стенами и своими легионами. На поле битвы против войск ислама пусть он на собственной шкуре узнает, что от Божьего суда не укрыться никому."
 wal_drive_out_turks: "Изгнать турок"
 wal_drive_out_turks_desc: "Настало время освободить греков и болгар от гнёта. Отбросьте турецких завоевателей на дальний берег Босфора."
 wal_liberate_serbia: "Освободить Сербию"
 wal_liberate_serbia_desc: "Наши сербские братья страдают под османским ярмом со времён поражения на Косовом поле — освободите их и станьте защитником православных Балкан."
 wal_reclaim_morea: "Вернуть Морею"
 wal_reclaim_morea_desc: "Морейский деспотат, где догорал последний свет Византии, — отвоюйте этот угол Пелопоннеса из рук неверных."
 wal_heir_of_rome: "Наследник Рима"
 wal_heir_of_rome_desc: "То, чего так и не добилась Византийская империя, — полный разгром и изгнание неверных из Европы — совершили мы. Никто не достойнее нас носить мантию Рима."
 wal_bulwark_of_christendom: "Оплот христианского мира"
 wal_bulwark_of_christendom_desc: "Румынские княжества — оплот христианского мира. Укреплять свои рубежи — наш долг перед Богом."
 wal_ottoman_downfall: "Падение османов"
 wal_ottoman_downfall_desc: "Османская империя, некогда властвовавшая над Балканами и Ближним Востоком, — её угроза наконец отошла в область истории."
 wal_reclaim_constantinople: "Вернуть Константинополь"
 wal_reclaim_constantinople_desc: "Константинополь давно пал под власть неверных — как наследники Ордена Дракона, освободите этот имперский город."
 wal_danubian_empire: "Дунайская империя завершена"
 wal_danubian_empire_desc: "От Карпат до Балкан и дальше до Босфора — эта борьба, начатая местью Цепеша, завершается созданием великой империи, правящей Дунаем."
 wal_danube_trade: "Дунайский торговый путь"
 wal_danube_trade_desc: "Торговый путь вдоль Дуная связывает Западную Европу с Чёрным морем — направьте этот поток богатства в казну Валахии."
 wal_treasury: "Наполнить казну"
 wal_treasury_desc: "Война, дипломатия, содержание двора — всякое дело державы требует золота. Наполните казну и приготовьтесь к любой беде."
 wal_manufactories: "Развить мануфактуры"
 wal_manufactories_desc: "В хозяйстве начинается большая перемена — без колебаний вкладывайтесь в мануфактуры и готовьтесь к веку промышленности."
 wal_events.2.t: "Константинополь возвращён"
 wal_events.2.d: "Великий имперский город Константинополь наконец в наших руках. Над городом, что был под властью неверных, реет знамя Ордена Дракона."
 wal_events.2.a: "Город Рима наш!"
 wal_events.99.t: "Провозглашение Дунайской империи"
 wal_events.99.d: "Небольшое княжество у подножия Карпат возродилось великой империей, правящей Дунаем и Балканами. Воля Цепеша исполнилась до конца."
 wal_events.99.a: "Слава Дунайской империи!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "Заря воеводства"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "Дух независимости Басараба I приносит державе престиж и дисциплину."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "Власть воеводы"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "Престол воеводы прочен, и уверенность в наследовании выросла."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "Боярский совет"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Отношения с боярской знатью ровны, и это укрепляет основание власти."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Бухарест основан"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Джурджу разрослось в «Букурешти», оплот юга."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Тырговиште развито"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "Старая столица Тырговиште продолжает богатеть."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "Сеть карпатских крепостей"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "Сеть крепостей в горах отражает любого захватчика."
 STATIC_MODIFIER_NAME_wal_church_mod: "Покровительство православной церкви"
 STATIC_MODIFIER_DESC_wal_church_mod: "Валашская православная церковь под защитой державы, и это поднимает религиозное оправдание власти."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Султан на колу"
 STATIC_MODIFIER_DESC_wal_impale_mod: "Грозная слава Божьего суда, свершённого над султаном, укрепляет решимость нашего войска против сил ислама."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Дрегэтори назначены"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Чиновники, выбранные за умение, держат на себе верное короне управление."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Молдавия покорена"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "Княжество Молдавское приведено под власть Валахии."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Трансильвания завоёвана"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Трансильвания введена во владения Валахии."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Доблесть секеев"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Ратный обычай секеев усиливает войско Валахии."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Процветание саксонских городов"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "Саксонские города Трансильвании стали опорой хозяйства державы."
 STATIC_MODIFIER_NAME_wal_danube_mod: "Дунай под охраной"
 STATIC_MODIFIER_DESC_wal_danube_mod: "Берега Дуная закреплены, и это открывает становую жилу торговли."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Карпатское владычество"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "Земля между Карпатами и Дунаем полностью покорна власти воеводы."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Румынское единство"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Валахия, Молдавия и Трансильвания соединены под одной короной."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Член Ордена Дракона"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Участие в противоосманском крестоносном союзе расширяет нашу сеть связей."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Турки изгнаны"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "Война с неверными доказала силу нашего войска."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Сербия освобождена"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Наши сербские братья свободны, и это поднимает наш вес на православных Балканах."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Морея возвращена"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Торговые пути Пелопоннеса теперь несут богатство в Валахию."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Наследник Рима"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "Положение наследника Византии приносит державе легитимность и терпимость."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Оплот христианского мира"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "Сеть пограничных крепостей служит теперь щитом христианскому миру."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "Падение османов"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "Устранение османской угрозы сильно улучшило дисциплину нашего войска."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Мануфактуры развиты"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "Вложения в промыслы улучшили производительность."
 STATIC_MODIFIER_NAME_wal_trade_mod: "Дунайский торговый путь"
 STATIC_MODIFIER_DESC_wal_trade_mod: "Торговая сеть вдоль Дуная бережёт богатство державы."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Полная казна"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Полная казна укрепила монету."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "Сеть власти Дунайской империи"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "Сам Дунай стал кровеносной жилой империи: его воды без труда несут войска вверх и вниз по течению. Легитимность династии непоколебима, а власть короны дотягивается до любого угла державы."
