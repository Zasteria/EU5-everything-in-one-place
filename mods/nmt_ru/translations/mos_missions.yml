 STATIC_MODIFIER_NAME_mos_riga_mod: "Рига — узел балтийской торговли"
 STATIC_MODIFIER_DESC_mos_riga_mod: "Рига, узел балтийской торговли, под властью России."
 STATIC_MODIFIER_NAME_mos_poland_mod: "Раздел Польши"
 STATIC_MODIFIER_DESC_mos_poland_mod: "Польша разделена — её земли вошли в Российскую империю."
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "Московская митрополия"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "Московская митрополия возвышена — церковь служит опорой русской государственной власти."
 STATIC_MODIFIER_NAME_mos_churches_mod: "Земля храмов"
 STATIC_MODIFIER_DESC_mos_churches_mod: "Земля храмов — православие пронизывает каждый город, посад и село Руси."
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "Русский патриархат"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "Учреждён Русский патриархат — московская церковь независима от Константинополя."
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "Хранитель православия"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "Россия признана хранительницей православия — защитницей веры."
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "Третий Рим"
