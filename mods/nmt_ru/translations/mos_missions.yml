 STATIC_MODIFIER_NAME_mos_st_petersburg_mod: "Санкт-Петербург — окно в Европу"
 STATIC_MODIFIER_DESC_mos_st_petersburg_mod: "Санкт-Петербург, окно России в Европу, выстроен на невских болотах."
 STATIC_MODIFIER_NAME_mos_navy_mod: "Русский флот"
 STATIC_MODIFIER_DESC_mos_navy_mod: "Основан русский флот — могучие эскадры ходят по Балтийскому и Чёрному морям."
 STATIC_MODIFIER_NAME_mos_suzdal_mod: "Суздаль — сердце Золотого кольца"
 STATIC_MODIFIER_DESC_mos_suzdal_mod: "Суздаль, сердце Золотого кольца, сияет жемчужиной древнерусской культуры."
 STATIC_MODIFIER_NAME_mos_vladimir_mod: "Владимир — древняя столица Руси"
 STATIC_MODIFIER_DESC_mos_vladimir_mod: "Владимир, древняя столица Руси, возрождён как средоточие русской державы."
 STATIC_MODIFIER_NAME_mos_salt_mod: "Солеварение"
 STATIC_MODIFIER_DESC_mos_salt_mod: "Соляной промысел России налажен — незаменимая соль доходит до каждого уголка."
 STATIC_MODIFIER_NAME_mos_beeswax_mod: "Торговля воском"
 STATIC_MODIFIER_DESC_mos_beeswax_mod: "Торговля воском обогащает Россию — свечи и воск скрепляют торговлю империи."
 STATIC_MODIFIER_NAME_mos_grain_mod: "Избыток зерна"
 STATIC_MODIFIER_DESC_mos_grain_mod: "Избыток зерна с бескрайних равнин России кормит империю и идёт на вывоз в Европу."
 STATIC_MODIFIER_NAME_mos_iron_mod: "Железоделательный промысел"
 STATIC_MODIFIER_DESC_mos_iron_mod: "Железное дело налажено — русское оружие и орудия укрепляют государство."
 STATIC_MODIFIER_NAME_mos_mission_mod: "Православная миссия"
 STATIC_MODIFIER_DESC_mos_mission_mod: "Православные миссионеры несут веру вновь покорённым народам по всей империи."
 STATIC_MODIFIER_NAME_mos_astrakhan_city_mod: "Астрахань — ворота Каспия"
 STATIC_MODIFIER_DESC_mos_astrakhan_city_mod: "Астрахань, ворота каспийской торговли, развита — процветает торговля с Персией и Средней Азией."
 STATIC_MODIFIER_NAME_mos_cossack_mod: "Казачья конница"
 STATIC_MODIFIER_DESC_mos_cossack_mod: "Казачья конница служит царю — вольные всадники степи теперь сражаются за Москву."
 STATIC_MODIFIER_NAME_mos_royal_degrees_mod: "Степенная книга"
 STATIC_MODIFIER_DESC_mos_royal_degrees_mod: "Степенная книга повествует о русской истории, узаконивая царскую династию."
 STATIC_MODIFIER_NAME_mos_kholmogory_mod: "Беломорская торговая застава"
 STATIC_MODIFIER_DESC_mos_kholmogory_mod: "Холмогоры служат беломорской торговой заставой, связывающей Россию с севером."
 STATIC_MODIFIER_NAME_mos_grand_duchy_mod: "Великое княжество"
 STATIC_MODIFIER_DESC_mos_grand_duchy_mod: "Провозглашено Великое княжество Московское — основа Русского государства."
 STATIC_MODIFIER_NAME_mos_balkans_mod: "Защита южных славян"
 STATIC_MODIFIER_DESC_mos_balkans_mod: "Россия объявляет себя защитницей южных славян от османского гнёта."
 STATIC_MODIFIER_NAME_mos_carpathia_mod: "Завоевание Карпат"
 STATIC_MODIFIER_DESC_mos_carpathia_mod: "Карпаты завоёваны — рука России дотянулась до сердца Центральной Европы."
 STATIC_MODIFIER_NAME_mos_western_mod: "Европеизация"
 STATIC_MODIFIER_DESC_mos_western_mod: "Реформы европеизации преображают Россию — перенимаются европейская техника и культура."
 STATIC_MODIFIER_NAME_mos_northern_war_mod: "Великая Северная война"
 STATIC_MODIFIER_DESC_mos_northern_war_mod: "Великая Северная война выиграна — Россия становится первой державой Балтики."
 STATIC_MODIFIER_NAME_mos_perm_city_mod: "Уральская пушная фактория"
 STATIC_MODIFIER_DESC_mos_perm_city_mod: "Пермь растёт как уральская пушная фактория — ворота между Европой и Сибирью."
 STATIC_MODIFIER_NAME_mos_yakutsk_mod: "Дальневосточный передовой пост"
 STATIC_MODIFIER_DESC_mos_yakutsk_mod: "Якутск служит дальневосточным передовым постом — Россия присутствует на берегу Тихого океана."
 STATIC_MODIFIER_NAME_mos_irkutsk_mod: "Город у Байкала"
 STATIC_MODIFIER_DESC_mos_irkutsk_mod: "Иркутск, город у Байкала, становится управленческим центром Восточной Сибири."
 STATIC_MODIFIER_NAME_mos_minsk_mod: "Минск — центр Белой Руси"
 STATIC_MODIFIER_DESC_mos_minsk_mod: "Минск, центр Белой Руси, вошёл в Российскую империю."
 STATIC_MODIFIER_NAME_mos_warsaw_mod: "Усмирение Польши"
 STATIC_MODIFIER_DESC_mos_warsaw_mod: "Варшава усмирена — столица Польши признаёт превосходство России."
 STATIC_MODIFIER_NAME_mos_iron_ring_mod: "Железное кольцо обороны"
 STATIC_MODIFIER_DESC_mos_iron_ring_mod: "Железное кольцо обороны хранит сердце России от вторжений."
 STATIC_MODIFIER_NAME_mos_great_mod: "Российская империя"
 STATIC_MODIFIER_DESC_mos_great_mod: "Провозглашена Российская империя — одна из величайших континентальных держав в истории."
 STATIC_MODIFIER_NAME_mos_autocrat_final_mod: "Самодержец всея Руси"
 STATIC_MODIFIER_DESC_mos_autocrat_final_mod: "Самодержец всея Руси — царь безраздельно правит от Балтики до Тихого океана."
 mos_great_moscow: "Основание Третьего Рима: великое расширение Москвы"
 mos_great_moscow_desc: "Расширьте Москву до великого города, достойного Третьего Рима. Соборы, дворцы, рынки и крепости выстроятся в этом величественном городе и сделают его сердцем Российской империи. Выполните все три условия — развитие, постройки и население, — чтобы Москва заслужила звание Вечного города."
 STATIC_MODIFIER_NAME_mos_great_moscow_mod: "Град Третьего Рима"
 STATIC_MODIFIER_DESC_mos_great_moscow_mod: "Москва завершена как великий город, достойный Третьего Рима. Скорость распространения дорог и рост населения повышены."
