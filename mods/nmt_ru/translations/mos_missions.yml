l_russian:
 mos_moscow_mission_pack: "От татарского ига к самодержцу всея Руси"
 mos_moscow_mission_pack_DESCRIPTION:0 "В 1337 году Великое княжество Московское — небольшое княжество под властью Золотой Орды. Благодаря расчётливому накоплению богатств и дипломатическому искусству Ивана I Калиты в делах с татарами Москва неуклонно крепнет. Но её окружают Новгород, Тверь и Литва, а с юга по-прежнему грозят татары. Сбросьте татарское иго, объедините русские княжества, провозгласите себя царём, правьте как Третий Рим и станьте самодержцем всея Руси — властелином до самых пределов Сибири."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Сбросьте татарское иго, завоюйте Казань, Астрахань и Новгород, чтобы объединить Русь, примите царский титул, станьте Третьим Римом и покорите Сибирь."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Станьте самодержцем всея Руси."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "От Великого княжества Московского к Российской империи — исполните историческое предназначение!"
 mos_rally_the_army: "Собрать войско"
 mos_rally_the_army_desc: "В 1337 году Великое княжество Московское неуклонно крепнет благодаря расчётливости Ивана I Калиты. Подготовьте войско и начните распространять власть Москвы на русские княжества."
 mos_break_tatar_yoke: "Сбросить татарское иго"
 mos_break_tatar_yoke_desc: "С 1237 года Русь угнетают татарская дань и покорность. Память о победе Дмитрия Донского на Куликовом поле жива. Объявите полную независимость и навсегда сбросьте татарское иго."
 mos_conquer_kazan: "Завоевание Казани"
 mos_conquer_kazan_desc: "Казанское ханство держит волжский торговый путь. Его завоевание отдаст Москве власть над великой рекой — опередите победу Ивана Грозного 1552 года."
 mos_subjugate_kazan: "Покорение Среднего Поволжья"
 mos_subjugate_kazan_desc: "Вслед за взятием Казани захватите Среднее Поволжье — Самару и Тамбов, — чтобы открыть дорогу на юг."
 mos_conquer_astrakhan: "Завоевание Астрахани"
 mos_conquer_astrakhan_desc: "Астраханское ханство держит дельту нижней Волги. Завоюйте его, чтобы выйти к Каспийскому морю и на восточный торговый путь."
 mos_destroy_hordes: "Разгром орд"
 mos_destroy_hordes_desc: "Сокрушите татарские государства-наследники, включая Ногайскую Орду, и откройте дорогу в степь."
 mos_claim_steppes: "Присвоить степи"
 mos_claim_steppes_desc: "Захватите Причерноморскую степь на северном берегу Чёрного моря и явите Москву великой континентальной державой."
 mos_black_sea_access: "Выход к Азовскому морю"
 mos_black_sea_access_desc: "Выйдите к Азовскому морю, чтобы получить доступ к черноморской торговле, — опередите взятие Азова Петром Великим в 1696 году."
 mos_conquer_crimea: "Завоевание Крыма"
 mos_conquer_crimea_desc: "Завоюйте Крымское ханство и утвердите господство на Чёрном море — опередите присоединение Крыма Екатериной Великой в 1783 году."
 mos_consolidate_russia: "Собирание Руси"
 mos_consolidate_russia_desc: "С Москвой в центре соберите русские княжества в основу единого сильного государства."
 mos_dev_moscow: "Развитие Кремля"
 mos_dev_moscow_desc: "Развивайте Московский Кремль — символ русской власти. Великие соборы, заполнившие эту святыню, станут сердцем Российской империи."
 mos_conquer_novgorod: "Завоевание Новгорода"
 mos_conquer_novgorod_desc: "Новгород — некогда величайший торговый город-республика Руси. Осуществите решающее завоевание Ивана III 1478 года ещё раньше."
 mos_conquer_tver: "Завоевание Твери"
 mos_conquer_tver_desc: "Тверь, давняя соперница Москвы, ослабла. Завоюйте этот ключевой волжский город и продвиньте объединение Руси."
 mos_conquer_ryazan: "Покорение Рязани"
 mos_conquer_ryazan_desc: "Рязань первой пала под ударом монголов в 1237 году. Завоюйте её южную степь и выстройте оборонительную черту."
 mos_conquer_smolensk: "Завоевание Смоленска"
 mos_conquer_smolensk_desc: "Смоленск — «ключ Руси». Возьмите под контроль этот перекрёсток между Востоком и Западом и утвердите своё влияние на западе."
 mos_conquer_ruthenia: "Завоевание Белой Руси"
 mos_conquer_ruthenia_desc: "Белая Русь — завоюйте подвластный Литве край с центром в Минске и утвердите господство над славянским миром."
 mos_window_on_west: "Окно на Запад"
 mos_window_on_west_desc: "Захватите Выборг и Карелию, чтобы «прорубить окно на Запад», — опередите мечту Петра Великого о выходе к Западу."
 mos_baltic_ambition: "Балтийские притязания"
 mos_baltic_ambition_desc: "Восточный берег Балтики во власти Ливонского ордена. Покорение этого края откроет вход в торговлю Северной Европы."
 mos_conquer_riga: "Завоевание Риги"
 mos_conquer_riga_desc: "Рига — опора Ганзейского союза. Завоюйте этот центр балтийской торговли и выйдите на торговые пути Северной Европы."
 mos_partition_poland: "Раздел Польши"
 mos_partition_poland_desc: "Положите конец долгой борьбе с Речью Посполитой за западнорусские земли и Восточную Европу."
 mos_metropolitan_see: "Московская митрополия"
 mos_metropolitan_see_desc: "В 1448 году Москва учредила независимую митрополию. Этот православный авторитет подкрепляет политическую легитимность Москвы."
 mos_land_of_churches: "Земля храмов"
 mos_land_of_churches_desc: "«Святая Русь» — возведите православные соборы по всей земле и освятите Русь как Царство Божие."
 mos_tsar_title: "Царский титул"
 mos_tsar_title_desc: "«Царь» — Иван IV официально принял этот титул в 1547 году. Провозгласите свою власть наследницей Рима и добейтесь признания среди европейских держав."
 mos_russian_patriarchate: "Русский патриархат"
 mos_russian_patriarchate_desc: "Московский патриархат, учреждённый в 1589 году и независимый от Константинополя, — укрепите религиозную основу «Третьего Рима»."
 mos_guardian_orthodoxy: "Хранитель православия"
 mos_guardian_orthodoxy_desc: "После падения Константинополя под ударом османов в 1453 году Русь становится хранительницей православной веры. Раскиньте православную сеть по всей земле."
 mos_conquer_constantinople: "Завоевание Константинополя"
 mos_conquer_constantinople_desc: "Отвоюйте у османов православную святыню Константинополь — исполните предназначение «Третьего Рима» и перепишите историю."
 mos_third_rome: "Третий Рим"
 mos_third_rome_desc: "«Два Рима пали, а третий стоит, а четвёртому не быть» — слова старца Филофея становятся явью. Москва царит как духовный центр христианского мира."
 mos_march_caucasus: "Поход на Кавказ"
 mos_march_caucasus_desc: "Завоюйте Грузию, Армению и Азербайджан в горах Кавказа и сделайте Россию подлинной континентальной империей."
 mos_caspian_sea: "Господство на Каспии"
 mos_caspian_sea_desc: "Каспий — «русское внутреннее море». Захватите торговый путь в Персию и Среднюю Азию."
 mos_beyond_urals: "За Уралом"
 mos_beyond_urals_desc: "Уральские горы — граница Европы и Азии, а за ними лежат бескрайние просторы Сибири. Опередите поход Ермака 1582 года и завладейте царством пушнины."
 mos_conquer_perm: "Завоевание Перми"
 mos_conquer_perm_desc: "Пермь в верховьях Камы — завоюйте этот источник «камской пушнины» и сделайте его опорой для покорения Сибири."
 mos_west_siberia: "Западная Сибирь"
 mos_west_siberia_desc: "Западная Сибирь с центром в Тобольске — бескрайняя тайга даёт неисчерпаемые запасы пушнины. Развивайте Тобольск как «столицу Сибири»."
 mos_east_siberia: "Восточная Сибирь"
 mos_east_siberia_desc: "Дойдите до Иркутска — выход к Байкалу откроет двери в Восточную Сибирь."
 mos_pacific_coast: "Выйти к Тихому океану"
 mos_pacific_coast_desc: "«Казаки дошли до Тихого океана» — от Якутска до Охотского моря. Русский флаг реет на краю Тихого океана."
 mos_fur_monopoly: "Пушная монополия"
 mos_fur_monopoly_desc: "Сибирская пушнина — самый дорогой товар на европейских рынках. Завладейте её поставками и обретите несметные богатства."
 mos_sudebnik: "Судебник"
 mos_sudebnik_desc: "Судебник 1497 года — первый единый свод законов Руси, изданный Иваном III. Этот свод, основа крепостного права, становится оружием централизации."
 mos_handle_boyars: "Обуздать бояр"
 mos_handle_boyars_desc: "Местная власть в руках бояр — сломайте этот порядок и поставьте прямых царских наместников, чтобы продвинуть централизацию."
 mos_oprichnina: "Опричнина"
 mos_oprichnina_desc: "Мрачная опричнина Ивана IV — чёрные всадники царя истребляли непокорных бояр. Воспользуйтесь этой жестокой, но действенной политикой, чтобы сделать царскую власть абсолютной."
 mos_dev_agriculture: "Развитие земледелия"
 mos_dev_agriculture_desc: "Богатый чернозём России — освойте плодородные пашни, что тянутся от Украины до Волги, и поднимите урожайность."
 mos_pomestye_system: "Поместная система"
 mos_pomestye_system_desc: "Поместная система — наделение землёй за военную службу — становится основой военной мощи России."
 mos_streltsy: "Учредить стрельцов"
 mos_streltsy_desc: "Стрельцы — постоянная пехота с огнестрельным оружием, созданная Иваном IV. Это отборное войско станет опорой русской армии."
 mos_zasechnaya_cherta: "Засечная черта"
 mos_zasechnaya_cherta_desc: "Возведите «Засечную черту» из поваленных деревьев и крепостей — оборонительный рубеж против набегов татарской конницы."
 mos_dev_arkhangelsk: "Построить Архангельск"
 mos_dev_arkhangelsk_desc: "Архангельск, порт на Белом море, — единственный морской торговый порт России до Петра Великого. Развивайте его для прямой торговли с Западной Европой."
 mos_white_sea_trade: "Беломорская торговля"
 mos_white_sea_trade_desc: "Английская Московская компания (1555) пришла в Россию именно этим путём — опередите её и завладейте беломорским торговым путём."
 mos_dev_nizhny: "Развить Нижний Новгород"
 mos_dev_nizhny_desc: "Там, где сливаются Волга и Ока, — превратите Нижний Новгород в центр волжской торговли."
 mos_conquer_pskov: "Завоевание Пскова"
 mos_conquer_pskov_desc: "Москва присоединила Псков в 1510 году. Вслед за Новгородом завоюйте Псков и полностью подчините себе северо-запад Руси."
 mos_dev_yaroslavl: "Развить Ярославль"
 mos_dev_yaroslavl_desc: "Ярославль из «Золотого кольца» — сделайте этот волжский торговый город перевалочным узлом северной торговли."
 mos_conquer_vologda: "Развить Вологду"
 mos_conquer_vologda_desc: "Вологда — захватите этот важный перекрёсток северных торговых путей и обеспечьте связь с беломорской торговлей."
 mos_amber_road: "Янтарный путь"
 mos_amber_road_desc: "Балтийский янтарь — поставляйте этот товар через Ригу на европейские рынки и увеличьте торговый доход."
 mos_reform_taxation: "Податная реформа"
 mos_reform_taxation_desc: "Введите единую податную систему и укрепите казну. Сосредоточенные в центре подати содержат русское войско."
 mos_dev_kazan_city: "Развить Казань"
 mos_dev_kazan_city_desc: "Превратите завоёванную Казань в многонародный город, где уживаются татары, русские и чуваши."
 mos_conquer_vilnius: "Завоевание Вильны"
 mos_conquer_vilnius_desc: "Вильна — столица Великого княжества Литовского. Её взятие положит конец литовскому господству и передаст первенство в Восточной Европе Москве."
 mos_develop_moscow_university: "Основать Московский университет"
 mos_develop_moscow_university_desc: "Возведите храм науки раньше Московского университета (основан в 1755 году). Ранее воплощённая мечта Ломоносова двинет вперёд умственное развитие России."
 mos_teutonic_order: "Разгром Тевтонского ордена"
 mos_teutonic_order_desc: "Тевтонский орден — наследие Прибалтийских крестовых походов. Покорение его земель целиком подчинит южную Балтику русскому влиянию."
 mos_estonian_coast: "Эстляндское побережье"
 mos_estonian_coast_desc: "Ревель — захватите этот важный порт Ганзейского союза и войдите в балтийскую торговлю в полную силу."
 mos_dev_tobolsk_city: "Развить Тобольск"
 mos_dev_tobolsk_city_desc: "Всерьёз развивайте Тобольск как «столицу Сибири» — растите его как управленческий центр покорения Сибири."
 mos_northern_caucasus: "Северный Кавказ"
 mos_northern_caucasus_desc: "Покорите Чечню, Дагестан и Кабарду на Северном Кавказе и закрепитесь для дальнейшего продвижения на Кавказ."
 mos_streltsy_reform: "Военная реформа"
 mos_streltsy_reform_desc: "Преобразуйте стрельцов — перенимайте западную военную технику и доведите русскую армию до европейского уровня."
 mos_orthodoxy_conversion: "Обращение в православие"
 mos_orthodoxy_conversion_desc: "Несите православную веру покорённым татарам, финским народам и коренным жителям Сибири, чтобы достичь духовного единства империи."
 mos_dev_yaroslavl_trading: "Ярославский торговый центр"
 mos_dev_yaroslavl_trading_desc: "Развивайте Ярославль как центр северной и восточной торговли — укрепите его роль ключевого пункта на волжском торговом пути."
 mos_siberian_ostrog: "Сеть сибирских острогов"
 mos_siberian_ostrog_desc: "Развивайте сеть острогов, связывающую Тобольск, Енисейск и Иркутск и служащую опорой покорения Сибири."
 mos_absolute_monarchy: "Установить абсолютную монархию"
 mos_absolute_monarchy_desc: "Утвердите самодержавную власть царя — лишите силы бояр, церковь и местных владетелей и сосредоточьте всю власть в руках государя."
 mos_peter_reforms: "Петровские реформы"
 mos_peter_reforms_desc: "Пётр Великий (1672–1725) превратил Россию в современное государство, открыв её Западу. Военная реформа, создание флота, Академия наук. Воплотите дух «окна в Европу»."
 mos_dev_st_petersburg: "Построить Санкт-Петербург"
 mos_dev_st_petersburg_desc: "Санкт-Петербург заложен Петром Великим в 1703 году на невских болотах — постройте его как первый в России город на западный лад."
 mos_russian_navy: "Создать русский флот"
 mos_russian_navy_desc: "«России нужен флот» — по убеждению Петра Великого создайте Азовский и Балтийский флоты."
 mos_dev_suzdal: "Развить Суздаль"
 mos_dev_suzdal_desc: "Суздаль из «Золотого кольца» — развивайте этот древний город с множеством средневековых храмов как центр веры и культуры."
 mos_dev_vladimir: "Развить Владимир"
 mos_dev_vladimir_desc: "Владимир, некогда столица великого княжества, — развивайте этот древний город как средоточие земледелия и продовольствия."
 mos_salt_works: "Солеварение"
 mos_salt_works_desc: "Соль из Вологды и Соликамска — наладьте надёжные поставки соли, без которой на Руси не сберечь запасов."
 mos_beeswax_trade: "Торговля воском"
 mos_beeswax_trade_desc: "Русский пчелиный воск — ходовой товар: на свечи для православных храмов и на вывоз в Западную Европу."
 mos_grain_surplus: "Избыток зерна"
 mos_grain_surplus_desc: "Зерно чернозёмной полосы — плодородные пашни от Украины до юга России кормят империю."
 mos_iron_works: "Железоделательный промысел"
 mos_iron_works_desc: "Железная руда Урала — заложите основу уральского железного дела, которое расцветёт в петровскую эпоху."
 mos_orthodox_mission: "Православная миссия"
 mos_orthodox_mission_desc: "Проповедь среди северных и восточных язычников — финских народов, сибирских инородцев, татар — укрепляет духовное единство Российской империи."
 mos_dev_astrakhan_city: "Развить Астрахань"
 mos_dev_astrakhan_city_desc: "Астрахань, «южные ворота», — развивайте её как центр каспийской торговли и завладейте торговлей с Персией и Средней Азией."
 mos_cossack_cavalry: "Казачья конница"
 mos_cossack_cavalry_desc: "Донские и запорожские казаки — включите лучших наездников степи в русское войско."
 mos_book_of_royal_degrees: "Степенная книга"
 mos_book_of_royal_degrees_desc: "Степенная книга записывает родословие русских государей, укрепляя легитимность Москвы и слаженность управления."
 mos_kholmogory: "Развить Холмогоры"
 mos_kholmogory_desc: "Холмогоры на Двине — развивайте этот передовой пункт беломорской торговли."
 mos_grand_duchy_rank: "Утвердить великое княжество"
 mos_grand_duchy_rank_desc: "От Великого княжества Московского к царству — с царским титулом Россия добивается международного признания как полноправное королевство."
 mos_protect_south_slavs: "Защита южных славян"
 mos_protect_south_slavs_desc: "Освободите православных христиан Балкан от османского владычества и постройте всеславянскую империю."
 mos_conquer_carpathia: "Завоевание Карпат"
 mos_conquer_carpathia_desc: "Карпатские горы — покорение этих ворот в Центральную Европу сильно расширит влияние на западе."
 mos_westernization: "Европеизация"
 mos_westernization_desc: "«России надобно учиться у Запада» — воплотите петровский дух европеизации и добейтесь признания как европейская держава."
 mos_great_northern_war: "Великая Северная война"
 mos_great_northern_war_desc: "В Великой Северной войне (1700–1721) Пётр Великий разбил Швецию и утвердил господство на Балтике — добейтесь этой победы раньше."
 mos_dev_perm_city: "Развить Пермь"
 mos_dev_perm_city_desc: "Превратите Пермь, узел пушной торговли, в настоящий город — растите её как центр торговли и пушного промысла на верхней Каме."
 mos_yakutsk_founded: "Основать Якутск"
 mos_yakutsk_founded_desc: "Якутск, основанный в 1632 году, — стройте его как центр Восточной Сибири и откройте дорогу к Тихому океану."
 mos_dev_irkutsk: "Развить Иркутск"
 mos_dev_irkutsk_desc: "Иркутск у Байкала — развивайте этот город, будущий «сибирский Париж», как управленческий и торговый центр Восточной Сибири."
 mos_dev_minsk: "Развить Минск"
 mos_dev_minsk_desc: "Развивайте Минск, центр Белой Руси, как опору власти на западе."
 mos_conquer_warsaw: "Завоевание Варшавы"
 mos_conquer_warsaw_desc: "Варшава, столица Польши, — завершите раздел Польши и утвердите влияние в Центральной Европе."
 mos_iron_ring_defense: "Железное кольцо обороны"
 mos_iron_ring_defense_desc: "Сеть крепостей против вторжений с юга и запада — железная оборонительная система бастионных крепостей хранит русскую землю."
 mos_form_russia: "Образовать Россию"
 mos_form_russia_desc: "Сбросив татарское иго, завоевав Казань и объединив русские княжества, официально провозгласите государство «Россия» и царствуйте над всеми."
 mos_russian_empire: "Российская империя"
 mos_russian_empire_desc: "Пётр Великий провозгласил Россию «империей» после Ништадтского мира 1721 года — воплотите этот миг раньше благодаря пушнине, земледелию и петровским реформам."
 mos_autocrat_of_all_russias: "Самодержец всея Руси"
 mos_autocrat_of_all_russias_desc: "«Божиею милостию Император и Самодержец Всероссийский» — от Балтики до Сибири, от Кавказа до Северного Ледовитого океана все земли под державной милостью царя."
 mos_events.1.t: "Великое княжество Московское под татарским игом"
 mos_events.1.d: "В 1337 году Москва — небольшое княжество. Но благодаря расчётливости Ивана I Калиты, сборщика татарской дани, Москва накопила силу.

Преимущество Москвы — в её положении: лесная глушь в глубине страны мешает татарам править ею напрямую.

Память о Куликовской битве (1380), где Дмитрий Донской отбил татар, жива. Окончательно сбросить татарское иго и объединить русские княжества под царской властью — вот предназначение Москвы."
 mos_events.1.a: "Во славу Москвы!"
 mos_events.5.t: "Долой татарское иго!"
 mos_events.5.d: "Наконец московское войско разбило татар в бою — дани татарам больше не бывать. На этом историческом переломе, сравнимом со «Стоянием на Угре (1480)», Москва становится знаменосцем свободной Руси. Русские княжества признают первенство Москвы, и путь к единому государству открыт."
 mos_events.5.a: "Русь свободна! Теперь — к собиранию русских земель!"
 mos_events.10.t: "Венчание на царство"
 mos_events.10.d: "«Царь и великий князь всея Руси» — приняв этот титул, Москва заявляет себя законной наследницей Византийской империи. Опередите историческое венчание Ивана IV 1547 года. Дворы Европы начинают признавать Москву новой великой державой."
 mos_events.10.a: "Да здравствует царь! Да здравствует Москва!"
 mos_events.30.t: "Возвращение Константинополя — Третий Рим свершился"
 mos_events.30.d: "Православная святыня Константинополь в русских руках! Возвращение города, павшего под ударом османов в 1453 году, означает, что Россия как «Третий Рим» становится духовным вождём православного мира. Над Святой Софией вновь сияет христианский крест."
 mos_events.30.a: "Да здравствует Третий Рим! Да здравствует русское православие!"
 mos_events.50.t: "Петровские реформы — Европа или старина?"
 mos_events.50.d: "Волна европеизации вот-вот захлестнёт Россию. Деятельно перенимать западную технику, военное устройство и науку и растить Россию как современную европейскую державу — или беречь православную старину и «русский путь», строя самобытную империю?"
 mos_events.50.a: "Проводить европеизацию — Россия есть часть Европы"
 mos_events.60.t: "Образование России — рождение новой империи"
 mos_events.60.d: "Украина, Белая Русь и Галиция под одним знаменем — единое восточнославянское государство «Рутения» встаёт новой великой державой Восточной Европы. Все русские народы собираются под золотыми куполами Киева."
 mos_events.60.a: "Да здравствует Россия! Да здравствует царь всея Руси!"
 mos_events.99.t: "Самодержец всея Руси — империя завершена"
 mos_events.99.d: "«Божиею милостию Император и Самодержец Всероссийский» — от Балтики до Сибири, от Кавказа до Северного Ледовитого океана русский флаг реет над величайшей империей мира. От маленького Московского княжества 1337 года до величайшей империи мира — об этом подвиге будут рассказывать вечно."
 mos_events.99.a: "Да здравствует самодержец всея Руси! Да здравствует Российская империя!"
 mos_events.50.b: "Беречь старину"
 STATIC_MODIFIER_NAME_mos_moscow_dev_mod: "Собирание Руси"
 STATIC_MODIFIER_DESC_mos_moscow_dev_mod: "Русь собрана — Москва встаёт бесспорной столицей русских земель."
