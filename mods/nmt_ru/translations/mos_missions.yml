 STATIC_MODIFIER_DESC_mos_novgorod_mod: "Новгород завоёван — великая торговая республика вошла в Русское государство."
 STATIC_MODIFIER_NAME_mos_tver_mod: "Тверь — волжский торговый город"
 STATIC_MODIFIER_DESC_mos_tver_mod: "Тверь, волжский торговый город, покорена и присоединена к Москве."
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "Покорение Рязани"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "Рязань покорена — последнее независимое княжество вошло в Россию."
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "Смоленск — ключ Руси"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "Смоленск, ключ Руси, возвращён — западный рубеж надёжно прикрыт."
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "Завоевание Белой Руси"
