 STATIC_MODIFIER_NAME_mos_pomestye_mod: "Поместная система"
 STATIC_MODIFIER_DESC_mos_pomestye_mod: "Поместная система даёт землю за военную службу — рождается дворянское войско."
 STATIC_MODIFIER_NAME_mos_streltsy_mod: "Стрельцы"
 STATIC_MODIFIER_DESC_mos_streltsy_mod: "Собрано стрелецкое войско — первая постоянная пехота России."
 STATIC_MODIFIER_NAME_mos_zaseka_mod: "Засечная черта"
 STATIC_MODIFIER_DESC_mos_zaseka_mod: "Засечная черта — великий лесной оборонительный рубеж — прикрывает Россию от степных набегов."
 STATIC_MODIFIER_NAME_mos_arkhangelsk_mod: "Архангельск — ворота Белого моря"
 STATIC_MODIFIER_DESC_mos_arkhangelsk_mod: "Архангельск открывает России окно к Белому морю и торговле Северной Европы."
 STATIC_MODIFIER_NAME_mos_white_sea_mod: "Беломорская торговля"
 STATIC_MODIFIER_DESC_mos_white_sea_mod: "Беломорские торговые пути связывают Россию с английскими и голландскими купцами."
 STATIC_MODIFIER_NAME_mos_nizhny_mod: "Нижний Новгород — слияние Волги и Оки"
 STATIC_MODIFIER_DESC_mos_nizhny_mod: "Нижний Новгород при слиянии Волги и Оки становится великой ярмаркой."
 STATIC_MODIFIER_NAME_mos_pskov_mod: "Псков — северо-западный торговый город"
 STATIC_MODIFIER_DESC_mos_pskov_mod: "Псков, северо-западный торговый город, вошёл в Русское государство."
 STATIC_MODIFIER_NAME_mos_yaroslavl_mod: "Золотой город Волги — средоточие торговли шёлком и льном"
 STATIC_MODIFIER_DESC_mos_yaroslavl_mod: "Ярославль, золотой город Волги, торгует шёлком и льном с востоком и западом."
 STATIC_MODIFIER_NAME_mos_vologda_mod: "Вологда — перекрёсток северной торговли"
 STATIC_MODIFIER_DESC_mos_vologda_mod: "Вологда, перекрёсток северной торговли, связывает Белое море с Поволжьем."
 STATIC_MODIFIER_NAME_mos_amber_mod: "Янтарный путь"
 STATIC_MODIFIER_DESC_mos_amber_mod: "Янтарный путь с Балтики проходит через подвластные России земли."
 STATIC_MODIFIER_NAME_mos_taxation_mod: "Податная реформа"
 STATIC_MODIFIER_DESC_mos_taxation_mod: "Податная реформа сосредоточивает сбор податей в центре и наполняет государеву казну."
 STATIC_MODIFIER_NAME_mos_kazan_city_mod: "Многонародный город"
