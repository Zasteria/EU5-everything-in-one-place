 STATIC_MODIFIER_NAME_mos_vilnius_mod: "Вильна — столица Литвы"
 STATIC_MODIFIER_DESC_mos_vilnius_mod: "Вильна, столица Литвы, под русским владычеством."
 STATIC_MODIFIER_NAME_mos_university_mod: "Московский университет"
 STATIC_MODIFIER_DESC_mos_university_mod: "Основан Московский университет — светоч русского просвещения."
 STATIC_MODIFIER_NAME_mos_teutonic_mod: "Разгром Тевтонского ордена"
 STATIC_MODIFIER_DESC_mos_teutonic_mod: "Тевтонский орден разбит — балтийский рубеж закреплён за Россией."
 STATIC_MODIFIER_NAME_mos_tallinn_mod: "Ревель — северный форпост Ганзы"
 STATIC_MODIFIER_DESC_mos_tallinn_mod: "Ревель, северный форпост Ганзы, взят — открыт доступ к балтийской торговле."
 STATIC_MODIFIER_NAME_mos_tobolsk_city_mod: "Торговая столица Сибири"
 STATIC_MODIFIER_DESC_mos_tobolsk_city_mod: "Тобольск становится торговой столицей Сибири — пушнина и богатства заполняют его рынки."
 STATIC_MODIFIER_NAME_mos_northern_caucasus_mod: "Северный Кавказ"
 STATIC_MODIFIER_DESC_mos_northern_caucasus_mod: "Северный Кавказ под русским влиянием — горские народы покорены."
 STATIC_MODIFIER_NAME_mos_military_reform_mod: "Военная реформа"
 STATIC_MODIFIER_DESC_mos_military_reform_mod: "Военная реформа обновляет русскую армию — растут выучка и огневая мощь."
 STATIC_MODIFIER_NAME_mos_conversion_mod: "Обращение в православие"
 STATIC_MODIFIER_DESC_mos_conversion_mod: "Православие распространяется по вновь завоёванным землям."
 STATIC_MODIFIER_NAME_mos_yaroslavl_trade_mod: "Ярославский торговый центр"
 STATIC_MODIFIER_DESC_mos_yaroslavl_trade_mod: "Ярославль становится первым торговым центром, связывающим Волгу с северными рынками."
 STATIC_MODIFIER_NAME_mos_ostrog_mod: "Сеть сибирских острогов"
