 STATIC_MODIFIER_NAME_mos_caucasus_mod: "Поход на Кавказ"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "Поход на Кавказ распространяет русское влияние на горные царства."
 STATIC_MODIFIER_NAME_mos_caspian_mod: "Господство на Каспии"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "Господство на Каспийском море открывает торговые пути в Персию и Среднюю Азию."
 STATIC_MODIFIER_NAME_mos_urals_mod: "Переход через Урал"
 STATIC_MODIFIER_DESC_mos_urals_mod: "Урал перейдён — дверь в Сибирь распахнута."
 STATIC_MODIFIER_NAME_mos_perm_mod: "Завоевание Перми"
 STATIC_MODIFIER_DESC_mos_perm_mod: "Пермь завоёвана — ворота Урала и сибирский рубеж закреплены."
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "Сибирская торговля налажена"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "Сибирская торговля идёт через Тобольск — пушнина и богатства текут на запад."
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "Завоевание Восточной Сибири"
 STATIC_MODIFIER_DESC_mos_east_siberia_mod: "Восточная Сибирь завоёвана — владения России простираются до тихоокеанского горизонта."
 STATIC_MODIFIER_NAME_mos_pacific_mod: "Выход к Тихому океану"
 STATIC_MODIFIER_DESC_mos_pacific_mod: "Тихий океан достигнут — Россия раскинулась во всю ширь Евразии."
