l_russian:
 aac_carolingian_legacy_mission_pack: "Наследие Каролингов — возрождение Франкского королевства"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "В 1337 году Ахен — вольный город Священной Римской империи, а его бургомистр — потомок династии Каролингов. Из города, где некогда стоял двор Карла Великого (742–814), верните славу Франкского королевства. Объедините Рейн, Галлию и Фландрию и правьте как «император Запада», венчанный папой."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Объедините за Ахен Рейн, Галлию и Италию и возродите Западную Римскую империю."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Выполняйте задания, чтобы возродить Франкское королевство."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "От трона Карла Великого — к Западной Римской империи!"

 aac_throne_of_charlemagne: "Трон Карла Великого"
 aac_throne_of_charlemagne_desc: "Ахенский собор — выстроенный по велению Карла Великого, место его коронации императором Запада в 800 году — вернулся в руки Каролингов. Правьте Ахеном, некогда средоточием западного мира, и сделайте первый шаг к возрождению Франкского королевства."

 aac_control_rhineland: "Взять Рейн"
 aac_control_rhineland_desc: "Кёльн, Трир, Майнц — три великих архиепископских города на Рейне были хозяйственным, церковным и политическим сердцем Франкского королевства. Овладев ими, вы вернёте Каролингам весь Рейн."

 aac_integrate_lorraine: "Присоединить Лотарингию"
 aac_integrate_lorraine_desc: "Лотарингия родилась как срединная полоса, когда Верденский договор (843) поделил Франкскую империю между внуками Карла Великого. Вернув Мец и Верден, вы воссоедините сердце Франкской империи, каким оно было до раздела."

 aac_conquer_hre: "Хозяин Священной Римской империи"
 aac_conquer_hre_desc: "Некогда в Ахене короновали императоров Священной Римской империи. Встав во главе Империи, вы предъявите права на имперское наследие Карла Великого самым законным образом."

 aac_control_flanders: "Взять Фландрию"
 aac_control_flanders_desc: "Фландрия — средоточие крупнейшего в Европе суконного дела. Захватите Брюссель и Льеж и обратите богатую торговлю и ремёсла Фландрии на возрождение Франкского королевства."

 aac_brabant_trade: "Брабантская торговля"
 aac_brabant_trade_desc: "Крупнейшая торговая сеть Нидерландов расходится из торгового Брюсселя в герцогстве Брабант. Власть над этой сетью многократно укрепит казну Франкского королевства."

 aac_push_into_france: "Поход на Париж"
 aac_push_into_france_desc: "Карл Великий правил всей Галлией, Парижем в том числе, как король франков. Отвоевав Париж, вы отомстите династии Валуа и восстановите власть Каролингов над Галлией."

 aac_conquer_northern_france: "Завоевать Северную Францию"
 aac_conquer_northern_france_desc: "Реймс — место коронации франкских королей: здесь принял крещение Хлодвиг I. Продолжив его дело, покорите Нормандию и Пикардию и утвердите полное господство над северной Галлией."

 aac_conquer_burgundy: "Завоевать Бургундию"
 aac_conquer_burgundy_desc: "Бургундия, край вина и хлеба, играла во Франкской империи важную роль. Покорив её, вы откроете дорогу на юг Франции."

 aac_conquer_southern_france: "Завоевать Южную Францию"
 aac_conquer_southern_france_desc: "Покорите Лангедок и Гасконь, и южная Галлия вернётся к Каролингам. Раздвиньте державу до Пиренеев и осуществите то полное господство над Галлией, к которому стремился Карл Великий."

 aac_reunite_gaul: "Воссоединить Галлию"
 aac_reunite_gaul_desc: "Вся Галлия — земли, которыми некогда правил Карл Великий, — под знаменем Франкского королевства. Империя, разделённая натрое Верденским договором, впервые за 500 лет снова едина."

 aac_develop_aachen: "Развить Ахен"
 aac_develop_aachen_desc: "Развивайте этот древний город вокруг Ахенского собора и сделайте его новой столицей Франкской империи. Отсюда, где живёт наследие Карла Великого, прольётся свет на возрождение Западной Европы."

 aac_frankish_law: "Франкский свод законов"
 aac_frankish_law_desc: "Карл Великий развивал право Франкской империи капитуляриями — сборниками указов. Продолжив эту традицию и издав новый Франкский свод законов, вы заложите правовую основу Империи."

 aac_missi_dominici: "Missi dominici"
 aac_missi_dominici_desc: "Missi dominici («посланцы государя») — учреждённые Карлом Великим королевские представители, которых рассылали по всей Империи надзирать за местным управлением. Возродив их, вы сможете править огромной державой из единого центра."

 aac_carolingian_renaissance: "Каролингское возрождение"
 aac_carolingian_renaissance_desc: "Карл Великий призывал ко двору учёных вроде Алкуина и Эйнхарда и положил начало «Каролингскому возрождению». Сделайте ахенский двор снова средоточием культуры и учёности и возглавьте возрождение западного мира."

 aac_trade_empire: "Торговая держава"
 aac_trade_empire_desc: "Франкская империя, владеющая торговыми путями Рейна, Мааса и Шельды, становится величайшей торговой державой Западной Европы. Утвердите торговое превосходство, опираясь на многие рынки и богатый доход."

 aac_frankish_levy: "Франкское ополчение"
 aac_frankish_levy_desc: "Франкское войско Карла Великого было сильнейшим в Европе. Возродите ополчение (систему «херибана») и восстановите военную мощь Франкской империи — от крестьян-пехотинцев до рыцарей."

 aac_palatine_guard: "Дворцовая стража"
 aac_palatine_guard_desc: "Дворцовая стража, берегущая особу императора, — отборное войско, наследник дворцовой охраны Карла Великого и воплощение ратной славы Франкской империи."

 aac_carolingian_cavalry: "Каролингская конница"
 aac_carolingian_cavalry_desc: "Сердцем побед Карла Великого была сильная конница. Возродите легендарное конное войско, в котором тяжёлые латные рыцари господствовали на поле боя и громили саксов, аваров и мусульман."

 aac_kingdom_of_franks: "Франкское королевство возрождено"
 aac_kingdom_of_franks_desc: "Галлия воссоединена, Лотарингия присоединена, missi dominici учреждены — три опоры сошлись, и Франкское королевство наконец возрождено. Впервые с 800 года знамя Каролингов реет от Рейна до Пиренеев."

 aac_papal_alliance: "Союз с папой"
 aac_papal_alliance_desc: "На Рождество 800 года в соборе Святого Петра в Риме папа Лев III возложил на Карла Великого корону императора Запада. Продолжите эту традицию, заключите прочный союз с папой и утвердите свою легитимность как «наместника Божьего»."

 aac_conquer_italy: "Завоевать Италию"
 aac_conquer_italy_desc: "Карл Великий покорил Лангобардское королевство в 774 году и принял титул короля Италии. Овладев Римом, вы завершите путь к возрождению «императора Запада» с благословения папы."

 aac_western_roman_empire: "Возрождение Западной Римской империи"
 aac_western_roman_empire_desc: "Ахен, Париж, Рим — три города Западной Римской империи вновь едины под знаменем Каролингов. Империя, созданная Карлом Великим в 800 году, возрождается в новое время, и «Renovatio Imperii Romani» («Обновление Римской империи») свершилось."

 aac_alsace_swabia: "Эльзас и Швабия"
 aac_alsace_swabia_desc: "Эльзас и Швабия на восточном берегу Рейна — важная часть Франкской империи. Овладев этой землёй от Вогезов до Альп, вы завершите господство над Рейном."

 aac_champagne_fairs: "Шампанские ярмарки"
 aac_champagne_fairs_desc: "Регулярные ярмарки Шампани были крупнейшими торговыми съездами Европы. Взяв в руки это место встречи итальянских, фламандских и немецких купцов, вы утвердите торговое превосходство франков."

 aac_conquer_brittany: "Завоевать Бретань"
 aac_conquer_brittany_desc: "Бретань — земля кельтов-бретонцев: даже Карлу Великому не удалось до конца покорить этот упрямый край. Завоевав западную оконечность, вы полностью подчините франкам западную Галлию и получите выход к Атлантике."

 aac_holy_crown: "Святая корона"
 aac_holy_crown_desc: "Глубокое доверие папского престола и высокая легитимность — папа как «наместник Христа» признаёт власть франкского короля. Утверждается власть, признанная и Богом, и людьми."

 aac_dev_reims: "Развить Реймс"
 aac_dev_reims_desc: "Реймс — место крещения франков: здесь принял христианство Хлодвиг I, и с тех пор здесь коронуют французских королей. Развив этот священный город, вы ещё больше укрепите легитимность Каролингов."

 aac_dev_paris: "Развить Париж"
 aac_dev_paris_desc: "Париж вокруг острова Сите на Сене — величайший город Галлии. Сделайте его западной столицей Франкской империи, и держава будет стоять на двух столицах — Ахене и Париже."

 aac_bretagne_fleet: "Бретонский флот"
 aac_bretagne_fleet_desc: "Морские традиции Бретани и Фландрии слились воедино, и у Франкской империи теперь сильный флот, владеющий и Атлантикой, и Северным морем."

 aac_events.20.t: "Падение Парижа — возвращение Каролингов"
 aac_events.20.d: "Знамя Валуа сорвано со стен Парижа, на его место поднят орёл Франкского королевства. Под звон колоколов Нотр-Дама в Париж вступает потомок каролингского майордома. «Наследник Карла Великого вернулся», — напишут историки."
 aac_events.20.a: "Да здравствует Париж! Выше знамя Каролингов!"

 aac_events.40.t: "Галлия воссоединена — возвращение франкского короля"
 aac_events.40.d: "От Рейна до Пиренеев, от Фландрии до Прованса — вся Галлия едина под знаменем Франкского королевства. Империя, разделённая натрое Верденским договором в 843 году, воссоединилась спустя 500 лет. «Dieu le veut» («Так хочет Бог»), — восклицает народ, собравшийся в соборе."
 aac_events.40.a: "Да здравствует Галлия! Франкское королевство вечно!"

 aac_events.50.t: "Провозглашение возрождённого Франкского королевства"
 aac_events.50.d: "Галлия воссоединена, Лотарингия присоединена, missi dominici учреждены — три опоры Франкского королевства на месте. В Ахенском соборе проходит коронация франкского короля, и впервые со времён Карла Великого рождается франкский император. «Во имя Carolus Magnus Rex Francorum (Карла Великого, короля франков) провозглашаем Империю»."
 aac_events.50.a: "Да здравствует Франкское королевство! Слава Каролингов возрождена — окрасим наши цвета в синеву Франции!"

 aac_events.99.t: "Возрождение Западной Римской империи"
 aac_events.99.d: "Ахен, Париж, Рим — три города вновь едины под знаменем Каролингов. Легендарный миг, когда на Рождество 800 года папа Лев III возложил корону на Карла Великого, повторяется в новое время. «Renovatio Imperii Romani» — эти слова навеки вписаны в историю. Сменить ли цвет Империи на каролингский багрянец?"
 aac_events.99.a: "Поднять багряное знамя — окрасить Рим в цвета Каролингов (map_ROM)"
 aac_events.99.b: "Сохранить прежние цвета — величие империи в силе, а не в цвете"

 STATIC_MODIFIER_NAME_aac_carolingian_throne_mod: "Трон Карла Великого"
 STATIC_MODIFIER_DESC_aac_carolingian_throne_mod: "Утверждена легитимность потомка Каролингов, унаследовавшего трон Карла Великого."
 STATIC_MODIFIER_NAME_aac_rhineland_mod: "Власть над Рейном"
 STATIC_MODIFIER_DESC_aac_rhineland_mod: "Три великих архиепископских города на Рейне взяты — хозяйственное и церковное сердце Франкской империи возрождено."
 STATIC_MODIFIER_NAME_aac_lorraine_mod: "Лотарингия присоединена"
 STATIC_MODIFIER_DESC_aac_lorraine_mod: "Лотарингия, отрезанная Верденским договором, воссоединена. Символ раздела Франкской империи преодолён."
 STATIC_MODIFIER_NAME_aac_hre_master_mod: "Хозяин СРИ"
 STATIC_MODIFIER_DESC_aac_hre_master_mod: "Как хозяин Империи вы по праву притязаете на имперское наследие Карла Великого."
 STATIC_MODIFIER_NAME_aac_flanders_mod: "Власть над Фландрией"
 STATIC_MODIFIER_DESC_aac_flanders_mod: "Фландрия, крупнейшее в Европе средоточие суконного дела, в руках франков."
 STATIC_MODIFIER_NAME_aac_brabant_mod: "Брабантская торговля"
 STATIC_MODIFIER_DESC_aac_brabant_mod: "Торговая сеть Нидерландов пополняет казну Франкского королевства."
 STATIC_MODIFIER_NAME_aac_northern_france_mod: "Северная Франция завоёвана"
 STATIC_MODIFIER_DESC_aac_northern_france_mod: "Нормандия и Пикардия покорены — утверждено полное господство над северной Галлией."
 STATIC_MODIFIER_NAME_aac_burgundy_mod: "Бургундия завоёвана"
 STATIC_MODIFIER_DESC_aac_burgundy_mod: "Богатая вином Бургундия вошла во Франкское королевство."
 STATIC_MODIFIER_NAME_aac_southern_france_mod: "Южная Франция завоёвана"
 STATIC_MODIFIER_DESC_aac_southern_france_mod: "Лангедок и Гасконь покорены — южная Галлия вернулась к Каролингам."
 STATIC_MODIFIER_NAME_aac_gaul_unified_mod: "Галлия воссоединена"
 STATIC_MODIFIER_DESC_aac_gaul_unified_mod: "Впервые с 843 года вся Галлия едина под знаменем Франкского королевства."
 STATIC_MODIFIER_NAME_aac_aachen_capital_mod: "Ахен — столица Империи"
 STATIC_MODIFIER_DESC_aac_aachen_capital_mod: "Ахен, город двора Карла Великого, отстроен как столица Франкской империи."
 STATIC_MODIFIER_NAME_aac_frankish_law_mod: "Франкский свод законов"
 STATIC_MODIFIER_DESC_aac_frankish_law_mod: "Франкский свод законов, продолжающий традицию капитуляриев, закладывает правовую основу Империи."
 STATIC_MODIFIER_NAME_aac_missi_dominici_mod: "Missi dominici"
 STATIC_MODIFIER_DESC_aac_missi_dominici_mod: "Королевские посланцы по всей Империи надзирают за местным управлением — власть собрана в едином центре."
 STATIC_MODIFIER_NAME_aac_renaissance_mod: "Каролингское возрождение"
 STATIC_MODIFIER_DESC_aac_renaissance_mod: "Ахенский двор вновь стал средоточием учёности и культуры западного мира."
 STATIC_MODIFIER_NAME_aac_trade_empire_mod: "Торговая держава"
 STATIC_MODIFIER_DESC_aac_trade_empire_mod: "Франкская империя, владеющая торговыми путями Рейна, Мааса и Шельды, стала величайшей торговой державой Западной Европы."
 STATIC_MODIFIER_NAME_aac_frankish_levy_mod: "Франкское ополчение"
 STATIC_MODIFIER_DESC_aac_frankish_levy_mod: "Ополчение Карла Великого возрождено — военная мощь Франкской империи восстановлена."
 STATIC_MODIFIER_NAME_aac_palatine_mod: "Дворцовая стража"
 STATIC_MODIFIER_DESC_aac_palatine_mod: "Отборная стража императора воплощает ратную славу Франкской империи."
 STATIC_MODIFIER_NAME_aac_cavalry_mod: "Каролингская конница"
 STATIC_MODIFIER_DESC_aac_cavalry_mod: "Тяжёлые латные рыцари господствуют на полях сражений франков. Легендарная конница Карла Великого возродилась."
 STATIC_MODIFIER_NAME_aac_kingdom_of_franks_mod: "Франкское королевство возрождено"
 STATIC_MODIFIER_DESC_aac_kingdom_of_franks_mod: "Слава 800 года возродилась в новое время. Франкское королевство Каролингов официально восстановлено."
 STATIC_MODIFIER_NAME_aac_papal_mod: "Союз с папой"
 STATIC_MODIFIER_DESC_aac_papal_mod: "Папа признаёт власть франкского короля. Утверждается власть, признанная и Богом, и людьми."
 STATIC_MODIFIER_NAME_aac_italy_mod: "Италия завоёвана"
 STATIC_MODIFIER_DESC_aac_italy_mod: "Лангобардский поход Карла Великого повторён. Италия вместе с Римом под властью франков."
 STATIC_MODIFIER_NAME_aac_western_roman_empire_final_mod: "Западная Римская империя возрождена"
 STATIC_MODIFIER_DESC_aac_western_roman_empire_final_mod: "Renovatio Imperii Romani свершилось. Ахен, Париж и Рим вновь едины под знаменем Каролингов."
 STATIC_MODIFIER_NAME_aac_alsace_mod: "Эльзас и Швабия"
 STATIC_MODIFIER_DESC_aac_alsace_mod: "Эльзас и Швабия на восточном берегу Рейна вошли во Франкскую империю."
 STATIC_MODIFIER_NAME_aac_champagne_mod: "Шампанские ярмарки"
 STATIC_MODIFIER_DESC_aac_champagne_mod: "Крупнейшие регулярные ярмарки Европы питают торговое превосходство Франкской империи."
 STATIC_MODIFIER_NAME_aac_brittany_mod: "Бретань завоёвана"
 STATIC_MODIFIER_DESC_aac_brittany_mod: "Упрямая земля кельтов-бретонцев завоёвана — выход к Атлантике обеспечен."
 STATIC_MODIFIER_NAME_aac_holy_crown_mod: "Святая корона"
 STATIC_MODIFIER_DESC_aac_holy_crown_mod: "Над франкским королём сияет «Святая корона», признанная и папой, и Богом."
 STATIC_MODIFIER_NAME_aac_reims_mod: "Реймс развит"
 STATIC_MODIFIER_DESC_aac_reims_mod: "Реймс, место крещения франков, стал церковной столицей."
 STATIC_MODIFIER_NAME_aac_paris_mod: "Париж развит"
 STATIC_MODIFIER_DESC_aac_paris_mod: "Париж, величайший город Галлии, стал западной столицей Франкской империи."
 STATIC_MODIFIER_NAME_aac_fleet_mod: "Бретонский флот"
 STATIC_MODIFIER_DESC_aac_fleet_mod: "Морские традиции Бретани и Фландрии слились — Франкская империя владеет и Атлантикой, и Северным морем."

 aac_aachen_megalopolis: "Ахен — величайший город Центральной Европы"
 aac_aachen_megalopolis_desc: "Ахен, город двора Карла Великого, наконец стал величайшей столицей Центральной Европы. С населением в 200 000 человек, развитым городским хозяйством и великолепными зданиями Ахен утверждается как средоточие европейской цивилизации."
 aac_events.10.t: "Трон Карла Великого — пробуждение Каролингов"
 aac_events.10.d: "Ахен — город, где некогда держал двор Карл Великий (742–814) и где в 800 году он был коронован императором Запада, — вернулся в руки Каролингов. Под торжественным куполом Ахенского собора мраморный трон ждёт возвращения хозяина.\n\nМечта Карла Великого, которого звали «отцом Европы» (Pater Europae), — единая христианская держава от Рейна до Пиренеев, от Рима до Балтики. Пришло время её осуществить. Провозгласите возрождение Каролингов и сделайте первый шаг к восстановлению Франкского королевства."
 aac_events.10.a: "Править королём из рода Каролингов — провозгласить монархию"
 aac_events.10.b: "Время ещё не пришло — копить силы при нынешнем правлении"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Великий Ахен"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Ахен стал одним из величайших городов Европы. Сильно увеличены наибольший уровень добычи ресурсов, уровни построек и вместимость населения."

 aac_events.50.b: "Да здравствует Франкское королевство! Слава Каролингов возрождена — сохраним наши прежние цвета"
 aac_events.99.a: "Принять имя и цвета Западной Римской империи (map_ROM) — возвестить миру о возрождении Рима"
 aac_events.99.b: "Провозгласить имя Западной Римской империи — но сохранить нынешние цвета"
