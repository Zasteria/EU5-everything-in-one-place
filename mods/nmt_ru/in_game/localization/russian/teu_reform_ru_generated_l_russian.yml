l_russian:
 teu_crusade_path_reform: "Discipline of the Crusader Order"
 teu_crusade_path_reform_desc: "The oath of discipline imposed by the Grand Master on all knight-monks at the outset of the Eastern Crusade. Looting is made an instrument of orderly campaigning, and the army is commanded under the banner of the holy war. The vow expires if the theocratic government is abandoned."
 teu_northern_crusade_reform: "Iron Cross Regime of Plunder"
 teu_northern_crusade_reform_desc: "A reign of terror built beneath the cross. Wealth is ruthlessly extracted from conquered lands, and those who resist are sold into slavery. The old ideals of holy war have faded; the Order is no longer merely a crusading brotherhood, but a military state built on conquest and exploitation."
 teu_northern_crusade_reform_loot_tt: "Inflicts pillage damage on occupied locations (decays over time)"
