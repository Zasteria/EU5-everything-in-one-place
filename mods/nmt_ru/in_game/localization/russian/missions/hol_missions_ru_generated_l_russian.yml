l_russian:
 hol_holland_mission_pack: "True Freedom — From the County of Holland to the United Provinces"
 hol_holland_mission_pack_DESCRIPTION: "The County of Holland, ruled by the House of Wittelsbach — triumph over the Hanseatic League, win independence from Spanish tyranny, and build a golden age as a true republic without a monarch."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION: "Unite the county, win independence, and achieve a golden age as a republic under States sovereignty."
 hol_holland_mission_pack_BUTTON_TOOLTIP: "From a small county to a united republic of commerce and freedom."
 hol_holland_mission_pack_BUTTON_DETAILS: "'Unity makes strength' — build a true republic without a monarch across the Low Countries!"
 hol_county_of_holland: "The County of Holland"
 hol_county_of_holland_desc: "The County of Holland, at the heart of the Low Countries, blessed with waterways and trade — the aging Count William III of the House of Avesnes approaches the end of his reign."
 hol_secure_dordrecht: "Develop Dordrecht"
 hol_secure_dordrecht_desc: "Dordrecht, the ancient trading city at the confluence of the Rhine and Meuse — build upon its granted staple right, and bring further development."
 hol_hoekse_kabeljauwse: "The Hooks and the Cods"
 hol_hoekse_kabeljauwse_desc: "The noble Hook faction and the urban Cod faction — quell this internal strife dividing the county over comital succession, and establish stable rule."
 hol_zeeland_unification: "Unify Zeeland"
 hol_zeeland_unification_desc: "Zeeland, a land of islands scattered across the North Sea — bring this region into the county's domain."
 hol_frisian_freedom: "West Frisian Freedom"
 hol_frisian_freedom_desc: "The people of West Frisia, who prize their autonomy — grant them freedom under the county's banner."
 hol_utrecht_relations: "Relations with Utrecht"
 hol_utrecht_relations_desc: "The Bishopric of Utrecht, wielding vast secular power — build relations with this neighbor under our influence."
 hol_wittelsbach_inheritance: "Union with Hainaut"
 hol_wittelsbach_inheritance_desc: "Through Princess Margaret, wed to Emperor Louis IV, deepen the bond with the neighboring County of Hainaut — through marriage, subjugation, or its extinction, unite Holland, Zeeland, and Hainaut under a single banner."
 hol_herring_industry: "Develop the Herring Industry"
 hol_herring_industry_desc: "The herring fishery known as the 'Great Fishery' (grote visserij) — develop this great industry further, alongside the art of salting."
 hol_hansa_rivalry: "Rivalry with the Hansa"
 hol_hansa_rivalry_desc: "The Hanseatic League, dominating Baltic trade — armed with cheap freight and efficient merchant vessels, triumph over this venerable league."
 hol_amsterdam_rise: "The Rise of Amsterdam"
 hol_amsterdam_rise_desc: "Amsterdam, a small fishing village on the IJ — develop this place into a great hub of North Sea trade."
 hol_moedernegotie: "The Mother Trade (Moedernegotie)"
 hol_moedernegotie_desc: "The Baltic grain trade — master this trade, called 'the mother of all trade,' and make it the foundation of prosperity."
 hol_contest_brabant: "Ambitions Toward Brabant"
 hol_contest_brabant_desc: "The Duchy of Brabant, the other great power of the Low Countries — turn the eye of ambition toward this land."
 hol_absorb_brabant: "The Absorption of Brabant"
 hol_absorb_brabant_desc: "Annex or subjugate the Duchy of Brabant — prove that Holland, not Brabant, is master of the Low Countries."
 hol_reformation_choice: "The Choice of Reformation"
 hol_reformation_choice_desc: "The teachings of Luther and Calvin shake the Low Countries — standing at this crossroads of faith, which path shall we choose?"
 hol_calvinist_merchants: "Calvinist Merchants"
 hol_calvinist_merchants_desc: "Calvinism, preaching a frugal and disciplined faith — accept this creed that has captured the hearts of the merchant citizenry as the state religion."
 hol_spanish_tyranny: "Spanish Tyranny"
 hol_spanish_tyranny_desc: "Heavy taxation and the Inquisition under Philip II and the Duke of Alba — the people's fury against this tyranny can no longer be contained."
 hol_union_of_utrecht: "The Union of Utrecht"
 hol_union_of_utrecht_desc: "The Union of Utrecht, formed by the northern provinces of the Low Countries — stand as its core, and face the common enemy."
 hol_watergeuzen: "The Sea Beggars (Watergeuzen)"
 hol_watergeuzen_desc: "Privateers calling themselves the 'Sea Beggars' — their exploits punch holes in Spain's dominance of the seas."
 hol_dutch_republic_proper: "Establish the True Republic"
 hol_dutch_republic_proper_desc: "A federation of seven provinces standing as equals — establish here a true republic of merchants and citizens, without a monarch."
 hol_east_india_company: "Found the East India Company"
 hol_east_india_company_desc: "Found the United East India Company (VOC), aiming for a monopoly on Asian trade."
 hol_amsterdam_bank: "The Bank of Amsterdam"
 hol_amsterdam_bank_desc: "To bring order to the chaos of competing currencies, found the Exchange Bank (Wisselbank), and build a stable system of credit."
 hol_stock_exchange: "The Amsterdam Stock Exchange"
 hol_stock_exchange_desc: "The world's first stock exchange, where shares are bought and sold — make this place the center of European finance."
 hol_dutch_golden_age: "The Dutch Golden Age"
 hol_dutch_golden_age_desc: "Rembrandt, Vermeer, and flourishing commerce — reach the zenith of the 'Dutch Golden Age.'"
 hol_estates_of_holland: "The States of Holland"
 hol_estates_of_holland_desc: "The States of Holland, composed of urban representatives — make this assembly the core of republican governance."
 hol_regent_oligarchy: "The Regent Oligarchy"
 hol_regent_oligarchy_desc: "The 'Regenten,' wealthy merchant patrician families — establish their oligarchic rule as the true governing structure of the republic."
 hol_stadtholderless_era: "The Stadtholderless Era (True Freedom)"
 hol_stadtholderless_era_desc: "An era without a Stadtholder, where the States hold sovereignty — embody the 'True Freedom' proclaimed by Johan de Witt."
 hol_states_sovereignty: "Establish States Sovereignty"
 hol_states_sovereignty_desc: "A republic without a monarch — establish the nature of its sovereignty as a lasting institution."
 hol_anglo_dutch_rivalry: "The Anglo-Dutch Rivalry"
 hol_anglo_dutch_rivalry_desc: "Rivalry with England over mastery of maritime trade — confront this contest symbolized by the Navigation Acts."
 hol_navigation_act_response: "Respond to the Navigation Act"
 hol_navigation_act_response_desc: "The English Navigation Act — counter this protectionist law, and defend our merchant fleet."
 hol_channel_trade_dominance: "Dominance of Channel Trade"
 hol_channel_trade_dominance_desc: "The strait linking the North Sea and the Atlantic — establish naval and commercial supremacy over this vital waterway."
 hol_french_relations: "Relations with France"
 hol_french_relations_desc: "The ambitions of the Sun King, Louis XIV — pay careful attention to relations with this powerful neighbor."
 hol_rampjaar_survival: "Survive the Disaster Year (Rampjaar)"
 hol_rampjaar_survival_desc: "In 1672, struck by simultaneous invasion from England and France — endure this 'Disaster Year' that threatens the nation's very existence."
 hol_glorious_revolution: "Victory over the Sun King"
 hol_glorious_revolution_desc: "Having endured the Disaster Year, the Republic now takes the offensive — push our armies deep into French soil, and make the Sun King, Louis XIV, pay for his ambitions."
 hol_united_provinces: "The United Provinces of the Netherlands"
 hol_united_provinces_desc: "From the foundations of the county, through the war of independence, and a golden age, a true republic is here complete."
 hol_events.1.t: "The Eighty Years' War Begins"
 hol_events.1.d: "Through the Union of Utrecht and the exploits of the Sea Beggars, the long war with Spain has begun. This struggle will decide our independence."
 hol_events.1.a: "Liberty or death!"
 hol_events.2.t: "Declaration of the United Provinces"
 hol_events.2.d: "A federation of seven provinces standing as equals — a true republic of merchants and citizens, without a monarch, draws its first breath."
 hol_events.2.a: "Glory to the Republic!"
 hol_events.3.t: "The Disaster Year (Rampjaar)"
 hol_events.3.d: "1672 — simultaneous invasion by France, England, Münster, and Cologne. Described as 'the people irrational, the government helpless, the country desperate,' we have endured this crisis."
 hol_events.3.a: "The Republic survives!"
 hol_events.4.t: "Victory over the Sun King"
 hol_events.4.d: "Having pushed deep into French territory, our armies have finally broken the ambitions of Louis XIV. The name of the Republic will now be known widely as a great power of Europe."
 hol_events.4.a: "Glory to the Republic!"
 hol_events.5.t: "A Crossroads for the States of Holland"
 hol_events.5.d: "The States face a fateful choice over the republic's form of governance — lean toward a monarchical order under a Stadtholder, or hold fast to a true republic of citizens and merchants."
 hol_events.5.a: "Concentrate authority in the House of Orange"
 hol_events.5.b: "Uphold the republic under States sovereignty"
 hol_events.99.t: "The United Provinces Complete"
 hol_events.99.d: "The long road that began in the County of Holland, through a war of independence and a golden age, is here complete as a true republic."
 hol_events.99.a: "Long live the United Provinces!"
 STATIC_MODIFIER_NAME_hol_county_mod: "The County of Holland"
 STATIC_MODIFIER_DESC_hol_county_mod: "The memory of a county nurtured by waterways and trade still lives on as the people's pride."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Dordrecht Developed"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "At the meeting of the Rhine and the Meuse, Dordrecht's merchant ships never cease loading and unloading their cargo."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "The Hooks and the Cods"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Those who once flew the banners of Hook and Cod now march together in the Count's ranks."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Zeeland Unified"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "On the shipways of Middelburg, timber gathered from the islands takes shape as hull after hull."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "West Frisian Freedom"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "'The Frisians have no lord' — that proud spirit of autonomy rallies many to the ranks when the hour demands."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Relations with Utrecht"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "The bells of Utrecht's towers toll out a quiet, cordial neighborliness between county and bishopric."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "Union with Hainaut"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "A new line of rulers from Bavaria brings order to the lands of Holland, Zeeland, and Hainaut."
 STATIC_MODIFIER_NAME_hol_contest_brabant_mod: "Ambitions Toward Brabant"
 STATIC_MODIFIER_DESC_hol_contest_brabant_mod: "Ambition toward our southern neighbor has put a spring in the step of every tax collector in the cities."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Brabant Absorbed"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "Holland's arms now hang in the court at Brussels, and southern wealth flows steadily into Amsterdam."
 STATIC_MODIFIER_NAME_hol_herring_mod: "The Herring Industry Developed"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Fleets laden with salted herring wind their way home through the swells of the North Sea, one after another."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Rivalry with the Hansa"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "While the merchants of Lübeck frown, our cheap freight rates win over shippers across the Baltic."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "The Rise of Amsterdam"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Once a small fishing village on the IJ, Amsterdam now draws sailing ships from every corner of the world."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "The Mother Trade"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "Grain carried from the Baltic keeps our tables and our treasury full even in years of famine."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "The Choice of Reformation"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Amid the church bells, quiet debates over old and new faiths never cease in the market squares."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Calvinist Merchants"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "Lamps burn late into the night in merchant houses where the Bible is read and puzzled over firsthand."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "The Union of Utrecht"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "The pact signed at Utrecht has become the hope to which every northern province clings."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "The Sea Beggars"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "'Better beggars than the king's men' — with that cry in mind, our sailors still hunt the Spanish flag today."
 STATIC_MODIFIER_NAME_hol_voc_mod: "The East India Company"
 STATIC_MODIFIER_DESC_hol_voc_mod: "The scent of spice from Batavia fills the warehouse district of Amsterdam."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "The Bank of Amsterdam"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "The trust locked within the Exchange Bank's vaults is the truest security this city's merchants possess."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Capital of the Exchange Bank"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "With the treasury's ledgers and the Exchange Bank's vaults under one roof, the affairs of state run all the smoother."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "The Amsterdam Stock Exchange"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "On the floor of the exchange, the shouts of brokers waving their share certificates never cease."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "The Dutch Golden Age"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "The light and shadow captured by Rembrandt's brush will tell of this age of prosperity for generations to come."
 STATIC_MODIFIER_NAME_hol_regent_mod: "The Regent Oligarchy"
 STATIC_MODIFIER_DESC_hol_regent_mod: "The quiet gatherings of wealthy patrician families are where the republic's true decisions are made."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "The Stadtholderless Era"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "The Stadtholder's seat sits empty — and yet the affairs of state run smoother than ever."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "The Anglo-Dutch Rivalry"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "Repeated exchanges of cannon fire with our rival across the Channel have forged our sailors into seasoned veterans."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Response to the Navigation Act"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "Undeterred by England's ordinances, our merchant fleets still find the loopholes that keep the trade routes open."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Dominance of Channel Trade"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "It has grown rare to see a ship in that narrow strait between the North Sea and the Atlantic not flying our colors."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Relations with France"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Unsettling rumors from the Sun King's court keep our border garrisons ever watchful."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "The United Provinces of the Netherlands"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "The unity of seven provinces without a monarch has made our name known across every sea and market in the world."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Survival of the Disaster Year"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "'The people irrational, the government helpless, the country desperate' — having shrugged off that verdict, our soldiers carry the memory with pride."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Victory over the Sun King"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Tales of our army's march deep into French soil are now told with pride across every court in Europe."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "The Republic Declared"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Delegates of citizens and merchants now gather with pride in a chamber that answers to no monarch."
