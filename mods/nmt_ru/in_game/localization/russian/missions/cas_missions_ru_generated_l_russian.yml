l_russian:
 cas_castile_dev_hub: "Development of the Crown Cities"
 cas_castile_dev_hub_desc: "Oversee the development of the cities belonging to the Castilian crown domain, and secure the economic foundation of the kingdom."
 cas_granada_dev_hub: "Revival of Granada"
 cas_granada_dev_hub_desc: "Bring new prosperity to the cities of the fallen Kingdom of Granada — Granada itself, and Malaga."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Development of the Crown Cities"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Investment in the crown cities raises the treasury's tax revenue."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Granada Revived"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "The revival of Granada speeds the pace of religious conversion."
 cas_castile_mission_pack: "The Glory of the Kingdom of Castile"
 cas_castile_mission_pack_DESCRIPTION: "In 1337, Castile is a powerful kingdom under Alfonso XI. The Reconquista is nearly complete — only Granada remains. The fall of Granada, the union with Aragon, Columbus's voyage, the conquistadors Cortés and Pizarro, and Philip II's Empire on which the Sun Never Sets. Race through Castile's history."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION: "Complete the Reconquista, form Spain, build a colonial empire, and establish the Empire on which the Sun Never Sets."
 cas_castile_mission_pack_BUTTON_TOOLTIP: "Complete missions to establish the Empire on which the Sun Never Sets."
 cas_castile_mission_pack_BUTTON_DETAILS: "From the fall of Granada to Philip II's world empire!"
 cas_sword_of_castile: "Sword of Castile"
 cas_sword_of_castile_desc: "1337 — Alfonso XI rules Castile energetically. At the Battle of Río Salado in 1340, he annihilated the combined forces of the Marinids and Granada, laying the foundation to expel the last Muslim power from the Iberian Peninsula. Raise the crowns of Castile and León and wield the sword of the Reconquista once more."
 cas_secure_castile: "Expansion of Valladolid"
 cas_secure_castile_desc: "By fully controlling both Castile and León, the central base of the Reconquista is established."
 cas_conquer_toledo: "Conquer Toledo"
 cas_conquer_toledo_desc: "Toledo, 'City of Three Cultures' — where Muslim, Jewish, and Christian cultures intersect — is the greatest cultural city in Iberia. Subjugate it."
 cas_conquer_andalusia: "Conquer Andalusia"
 cas_conquer_andalusia_desc: "Andalusia, centered on Seville, is Iberia's greatest agricultural and trading zone. Use it as a stepping stone for the assault on Granada."
 cas_conquer_murcia: "Conquer Murcia"
 cas_conquer_murcia_desc: "Murcia on the Mediterranean coast is a rich region of silk, agriculture, and trade. Subjugating it establishes control of southeastern Iberia."
 cas_fall_of_granada: "The Fall of Granada"
 cas_fall_of_granada_desc: "January 2, 1492 — the last Sultan of Granada, Boabdil, hands over the keys to Isabella of Castile at the 'Hill of Tears.' The Reconquista, spanning 780 years, is finally complete."
 cas_conquer_navarre: "Conquer Navarre"
 cas_conquer_navarre_desc: "Seizing the Kingdom of Navarre at the Pyrenean crossroads establishes the border with France and completes the northern Iberian domination."
 cas_subdue_aragon: "Union with Aragon"
 cas_subdue_aragon_desc: "The marriage of Isabella and Ferdinand (1469) created the personal union of Castile and Aragon. Under the 'Catholic Monarchs,' Spain is taking shape."
 cas_form_spain: "Formation of Spain"
 cas_form_spain_desc: "Castile, having unified most of the Iberian Peninsula, formally declares the 'Kingdom of Spain.' The birth of Europe's greatest power."
 cas_conquer_portugal: "Integration of Portugal"
 cas_conquer_portugal_desc: "In 1580, Philip II inherited the Portuguese throne — the 'Iberian Union.' This gave Spain control over Portugal's colonial empire as well."
 cas_iberian_union: "The Iberian Union"
 cas_iberian_union_desc: "The entire Iberian Peninsula falls under Spanish dominion. From the Atlantic to the Indian Ocean, Spanish and Portuguese colonies cover the world."
 cas_holy_brotherhood: "Santa Hermandad"
 cas_holy_brotherhood_desc: "The Santa Hermandad (Holy Brotherhood) established by Queen Isabella suppresses noble power and strengthens royal authority as a law enforcement organization."
 cas_inquisition: "Spanish Inquisition"
 cas_inquisition_desc: "In 1478, Pope Sixtus IV granted Isabella and Ferdinand the authority to establish the Inquisition. The inquisitors led by Torquemada work to maintain the purity of faith."
 cas_expulsion_of_jews: "Edict of Expulsion"
 cas_expulsion_of_jews_desc: "The Alhambra Decree of 1492 — the expulsion of Jews who refuse conversion from Spain is declared. This decision maintains Catholic purity but loses many talented merchants and scholars."
 cas_catholic_monarchs: "The Catholic Monarchs"
 cas_catholic_monarchs_desc: "Pope Alexander VI grants Isabella and Ferdinand the title 'Catholic Monarchs (Reyes Católicos).' Spain is recognized as the guardian of the Catholic world."
 cas_absolute_crown: "Absolute Monarchy"
 cas_absolute_crown_desc: "Limiting noble privileges and absolutizing royal power — Spain emerges as one of Europe's first modern absolutist states."
 cas_cortes: "Castilian Cortes"
 cas_cortes_desc: "The Cortes (parliament) is Castile's traditional estates assembly. Balancing royal authority and parliament establishes a stable system of governance."
 cas_leyes_de_indias: "Laws of the Indies"
 cas_leyes_de_indias_desc: "The Laws of the Indies regulating the treatment of indigenous peoples in the colonies — established in response to the humanitarian arguments of Bartolomé de las Casas."
 cas_canary_islands: "Canary Islands"
 cas_canary_islands_desc: "The Canary Islands in the Atlantic are a strategic point in the competition with Portugal. Controlling these islands begins Spain's Atlantic expansion."
 cas_atlantic_exploration: "Atlantic Exploration"
 cas_atlantic_exploration_desc: "While Portugal heads south along the African coast, Spain turns west across the Atlantic. The dream of a 'western route to the Indies' is about to become reality."
 cas_columbus_voyage: "Columbus's Voyage"
 cas_columbus_voyage_desc: "August 3, 1492 — Christopher Columbus departs from Palos. Three ships — Santa María, Pinta, and Niña — cross the Atlantic and open the door to a new world."
 cas_conquer_caribbean: "Conquer the Caribbean"
 cas_conquer_caribbean_desc: "With Hispaniola (Santo Domingo) as a base, Spanish Caribbean dominance is established. Sugar, tobacco, and precious metals create a flow of wealth to Spain."
 cas_conquer_mexico: "Conquer Mexico"
 cas_conquer_mexico_desc: "1519-1521 — Hernán Cortés conquered the Aztec capital Tenochtitlan with 500 soldiers. The 'Viceroyalty of New Spain' is born."
 cas_conquer_peru: "Conquer Peru"
 cas_conquer_peru_desc: "Francisco Pizarro overthrew the Inca Empire with 168 men — one of history's most astonishing conquests. Andean gold and silver flow into Spain."
 cas_silver_of_potosi: "Silver of Potosí"
 cas_silver_of_potosi_desc: "Potosí's silver mines (discovered 1545, altitude 4,000m) are the greatest in European history. Silver from 'Cerro Rico (Rich Mountain)' sustains the Spanish Empire's finances."
 cas_colonial_empire: "Colonial Empire"
 cas_colonial_empire_desc: "From Mexico to Peru, from the Caribbean to the North American south coast — Spanish colonial nations cover the world. The conquistadors' achievements lay the Empire's foundation."
 cas_manila_galleon: "Manila Galleon"
 cas_manila_galleon_desc: "After Manila's founding in 1571, the Manila Galleon monopolized trans-Pacific trade between Acapulco and Manila — the world's first truly global trade route, linking Asian silk and porcelain with American silver."
 cas_conquer_naples: "Conquer the Kingdom of Naples"
 cas_conquer_naples_desc: "'El Gran Capitán' Gonzalo de Córdoba defeated France and seized Naples. Spain's influence over Italy is established."
 cas_conquer_sicily: "Secure Sicily"
 cas_conquer_sicily_desc: "Sicily, the Mediterranean granary already under the Aragonese crown, is integrated into the Spanish Empire to complete Mediterranean island control."
 cas_conquer_milan: "Subdue Milan"
 cas_conquer_milan_desc: "As a final result of the Italian Wars, the Duchy of Milan falls under Spanish dominion. The entire Italian peninsula becomes Spain's sphere of influence."
 cas_mediterranean_mastery: "Mediterranean Mastery"
 cas_mediterranean_mastery_desc: "Naples, Sicily, Sardinia, Milan — Spain's Mediterranean empire is established. For the first time since ancient Rome, the Mediterranean is dominated by a single power."
 cas_battle_of_lepanto: "Battle of Lepanto"
 cas_battle_of_lepanto_desc: "October 7, 1571 — the Christian League fleet of Spain, Venice, and the Pope annihilates the Ottoman navy. The 'Victory of the Holy League.' Christian supremacy in the Mediterranean is established."
 cas_secure_ceuta: "Secure Ceuta"
 cas_secure_ceuta_desc: "Ceuta, facing the Iberian Peninsula across the Strait of Gibraltar, is the gateway to Africa. Controlling it secures the western Mediterranean entrance."
 cas_conquer_oran: "Conquer Oran"
 cas_conquer_oran_desc: "In 1509, Cardinal Cisneros conquered Oran — the first step in the 'African Reconquista.' The counterattack against Muslim forces in North Africa begins."
 cas_conquer_tunis: "Conquer Tunis"
 cas_conquer_tunis_desc: "In 1535, Charles V's Spanish forces conquered Tunis. Spain's military power competing with the Ottoman Empire for North African supremacy is demonstrated to the world."
 cas_north_africa_dominion: "Dominion over North Africa"
 cas_north_africa_dominion_desc: "From Ceuta to Oran, the North African Mediterranean coast falls under Spanish dominion. Muslim piracy is eliminated and Mediterranean trade stabilizes."
 cas_dev_sevilla: "Gateway to the Indies"
 cas_dev_sevilla_desc: "Seville on the Guadalquivir — the ancient city flourishes as the exclusive gateway for New World trade. The 'Casa de Contratación' transforms it into the world's greatest commercial city."
 cas_casa_de_contratacion: "Casa de Contratación"
 cas_casa_de_contratacion_desc: "Established in Seville in 1503, the Casa de Contratación (House of Trade) exclusively manages Spanish colonial trade. All trade with the New World passes through here."
 cas_dev_toledo: "Toledo Blade Industry"
 cas_dev_toledo_desc: "Toledo is Castile's historical capital and an industrial city famous for swords, goldwork, and silk. The fame of 'Toledo steel' spreads worldwide."
 cas_dev_madrid: "Madrid as Capital"
 cas_dev_madrid_desc: "In 1561, Philip II declared Madrid the permanent capital — a revolutionary change for Spain, where the court had previously moved from city to city. Madrid's population explodes."
 cas_dev_burgos: "City of El Cid"
 cas_dev_burgos_desc: "Burgos, 'City of El Cid' — the historical capital of Castile, thriving through wool trade exports to northern Europe."
 cas_mesta: "The Mesta"
 cas_mesta_desc: "The Mesta is a powerful shepherds' guild. Transhumance using the cañadas (pastoral roads) crossing the Iberian Peninsula forms the backbone of Castilian economy."
 cas_trade_network: "Imperial Trade Network"
 cas_trade_network_desc: "From Seville to Manila, from Antwerp to the New World — Spain's imperial trade network covers the globe."
 cas_tercio: "Tercio (Spanish Square)"
 cas_tercio_desc: "The 16th century's greatest tactic — the Tercio combines pikemen, musketeers, and swordsmen in infantry formation. 'Spanish infantry is the world's strongest' is proven on the battlefield."
 cas_military_orders: "Military Orders"
 cas_military_orders_desc: "The three Military Orders of Santiago, Calatrava, and Alcántara — during the Catholic Monarchs era, their assets and authority are brought under royal control to support military power."
 cas_grande_armada: "Spanish Armada"
 cas_grande_armada_desc: "In 1588, Philip II dispatched a great fleet of 130 ships 'La Armada' for the conquest of England — symbolizing the zenith of Spanish naval power."
 cas_conquistadors: "Conquistadors"
 cas_conquistadors_desc: "Cortés, Pizarro, Balboa, de Soto — the names of the conquerors are engraved in history. Conquering vast empires with small numbers of soldiers, they demonstrated the superiority of Spanish military technology to the world."
 cas_salamanca_university: "University of Salamanca"
 cas_salamanca_university_desc: "Founded in 1218, the University of Salamanca is one of Europe's oldest. As the finest institution of theology, law, and medicine, it trains the bureaucrats, clergy, and scholars of the Spanish Empire."
 cas_siglo_de_oro: "Golden Age (Siglo de Oro)"
 cas_siglo_de_oro_desc: "Cervantes, Lope de Vega, Velázquez, El Greco — the Spanish cultural golden age of the 16th-17th centuries blossoms. Spain leads Europe in literature, theater, and painting."
 cas_escorial: "El Escorial"
 cas_escorial_desc: "El Escorial monastery-palace, whose construction Philip II ordered in 1563 — combining palace, monastery, and mausoleum, this massive structure symbolizes the Spanish Empire's zenith."
 cas_dev_valladolid: "The Court City of Valladolid"
 cas_dev_valladolid_desc: "Valladolid, where Columbus drew his last breath, is an important administrative and cultural city of central Castile."
 cas_dev_granada_city: "Jewel of Spain"
 cas_dev_granada_city_desc: "Granada, home of the Alhambra Palace, is a city where Muslim cultural heritage breathes. Develop this 'jewel of Spain' as the cultural and economic center of the south."
 cas_dev_cordoba: "Cordovan Leather Fame"
 cas_dev_cordoba_desc: "Famous for the Mezquita, Córdoba was once the Umayyad Caliphate's capital and the world's largest city. Leverage that heritage to develop it as a center of culture and learning."
 cas_inherit_flanders: "Inherit Flanders"
 cas_inherit_flanders_desc: "Flanders was incorporated into Spain as part of the Burgundian inheritance. The wealthy textile cities of Antwerp, Bruges, and Ghent support the Spanish Empire's finances."
 cas_revolt_of_flanders: "Pacify Flanders"
 cas_revolt_of_flanders_desc: "Suppress Flemish resistance and integrate this prosperous region as a stable part of the Spanish Empire."
 cas_greatest_power: "Foundation of the Undying Empire"
 cas_greatest_power_desc: "Colonial empire, Tercios, and the Armada — the three pillars are complete, and Spain has reached an unprecedented height of prosperity. Now is the moment to take the final step toward the Empire on which the Sun Never Sets."
 cas_empire_of_the_sun: "Empire on which the Sun Never Sets"
 cas_empire_of_the_sun_desc: "'In my Empire, the sun never sets' — Charles V's words become reality. From Spain to Naples, Flanders to the New World, Manila to the Caribbean — the Spanish banner flies everywhere on Earth."
 cas_battle_rio_salado: "Victory at Río Salado"
 cas_battle_rio_salado_desc: "At the Battle of Río Salado in 1340, Alfonso XI defeated the combined forces of the Marinids and Granada — the curtain rises on the final act of the Reconquista."
 cas_conquer_extremadura: "Conquer Extremadura"
 cas_conquer_extremadura_desc: "Extremadura — 'rough land' — known for sheep grazing. And it is from here that two great conquistadors, Cortés and Pizarro, were born."
 cas_dev_leon_city: "Glory of the Old Kingdom of León"
 cas_dev_leon_city_desc: "León, the former capital of the Kingdom of León that once led the Reconquista — develop it leveraging its history and tradition."
 cas_church_reform: "Church Reform"
 cas_church_reform_desc: "Church reform led by Cardinal Cisneros — restoring monastic discipline, improving clerical education, and eliminating corruption makes Spain's Catholic Church Europe's strongest spiritual authority."
 cas_counter_reformation: "Counter-Reformation"
 cas_counter_reformation_desc: "The Society of Jesus, founded by Ignatius of Loyola — Spain-led Counter-Reformation counters the Protestant threat. The Council of Trent reaffirms Catholic doctrine."
 cas_conquer_cuba: "Conquer Cuba"
 cas_conquer_cuba_desc: "In 1511, Diego Velázquez conquered Cuba. Havana is developed as a Caribbean trade hub and becomes the key port on routes to the New World."
 cas_conquer_florida: "Explore Florida"
 cas_conquer_florida_desc: "Juan Ponce de León discovered 'La Florida (Land of Flowers)' in 1513 — pursuing the legend of the 'Fountain of Youth,' exploration of North America begins."
 cas_conquer_philippines: "Conquer the Philippines"
 cas_conquer_philippines_desc: "In 1565, Miguel López de Legazpi conquered the Philippine Islands and founded Manila. Spain's Asian expansion is realized, and the trans-Pacific Manila Galleon trade is born."
 cas_gold_fleets: "Gold and Silver Fleets"
 cas_gold_fleets_desc: "Potosí silver and Inca gold — the 'Indies Fleet (Flota de Indias)' heading to Spain each year creates the world's greatest flow of wealth."
 cas_sardinia: "Secure Sardinia"
 cas_sardinia_desc: "Sardinia, already under the Aragonese crown, is integrated into the Spanish Empire to complete western Mediterranean island control."
 cas_conquer_tunis_italy: "Establish Italian Dominion"
 cas_conquer_tunis_italy_desc: "Naples, Sicily, Sardinia, Milan — the major regions of the Italian Peninsula fall under Spanish dominion, adding Renaissance wealth to the Spanish Empire's prosperity."
 cas_garrison_system: "Fortress Defense Network"
 cas_garrison_system_desc: "A fortress defense network protecting the vast Spanish Empire — Tercios in Flanders, fortresses in Naples, and presidios in North Africa guard the Empire's borders."
 cas_dev_cadiz: "The Ancient Phoenician Port"
 cas_dev_cadiz_desc: "The ancient Phoenician city of Cádiz sits on a natural harbor on an Atlantic peninsula. It is destined to replace Seville as the gateway for Indies trade."
 cas_dev_malaga: "Develop Málaga"
 cas_dev_malaga_desc: "Málaga on the Mediterranean coast is a trading city known for silk, wine, and dried grapes. It develops rapidly after the conquest of Granada."
 cas_dev_valencia: "The City of the Sun"
 cas_dev_valencia_desc: "Valencia, 'City of the Sun,' is a Mediterranean trade hub producing silk, sugar, and rice. Developing the Aragonese crown's major city brings prosperity to Spain's eastern coast."
 cas_dev_zaragoza: "The Aragonese Capital"
 cas_dev_zaragoza_desc: "Zaragoza, the capital of the Kingdom of Aragon, is a key transportation hub on the Ebro River. Developing it activates inland Iberian trade."
 cas_dev_barcelona: "Queen of the Mediterranean"
 cas_dev_barcelona_desc: "Barcelona, the center of Mediterranean trade — develop the Catalan capital, Aragon's greatest commercial city, as the Spanish Empire's Mediterranean trade hub."
 cas_dev_segovia: "Aqueduct of Segovia"
 cas_dev_segovia_desc: "Segovia, famous for its aqueduct and royal castle, develops as a symbol of Castilian royal power."
 cas_west_africa_trade: "West African Trade"
 cas_west_africa_trade_desc: "Using the Canary Islands as a foothold, Spain enters West African trade competing with Portugal for ivory, gold, and eventually slave trade routes."
 cas_council_of_trent: "Council of Trent"
 cas_council_of_trent_desc: "The Council of Trent (1545-1563) — led by Spain to reaffirm Catholic doctrine and establish guidelines for the Counter-Reformation. The Jesuits stand at the forefront of the counterattack against Protestantism."
 cas_events.20.t: "Fall of Granada — Completion of the Reconquista"
 cas_events.20.d: "January 2, 1492 — the gates of the Alhambra open, and the last Sultan of Granada, Muhammad XII (Boabdil), hands over the keys to Isabella and Ferdinand at the 'Hill of Tears.' The Reconquista, spanning 780 years, is finally complete. 'Weep now, for you could not fight like a man' — Boabdil's mother's words remain in history."
 cas_events.20.a: "Long live Spain! The Reconquista is complete! Glory to God and the Virgin Mary!"
 cas_events.30.t: "Catholic Monarchs — Union with Aragon"
 cas_events.30.d: "Decades after the marriage of Isabella and Ferdinand — the time for the union of Castile and Aragon has come. Pope Alexander VI grants them the title 'Catholic Monarchs (Reyes Católicos),' and the formation of Spain as a nation becomes reality."
 cas_events.30.a: "Long live the Catholic Monarchs! Spain is one under a single faith!"
 cas_events.40.t: "Birth of Spain"
 cas_events.40.d: "The fall of Granada, union with Aragon, discovery of the New World — 1492 was the most dramatic year in Spanish history. The time has come to declare the birth of a new state, the 'Kingdom of Spain.' Will you change the name and map color?"
 cas_events.40.a: "Declare the birth of the 'Kingdom of Spain' and raise the golden banner (map_SPA)"
 cas_events.40.b: "Declare the birth of the 'Kingdom of Spain' — but keep the traditional Castilian colors"
 cas_events.50.t: "Columbus's Voyage — Discovery of the New World"
 cas_events.50.d: "October 12, 1492 — Christopher Columbus lands on Guanahani Island in the Bahamas. The existence of a New World unknown to Europeans is revealed. Columbus's discovery, believing he reached 'the Indies (Asia),' will bring Spain incalculable wealth."
 cas_events.50.a: "God's blessing upon the New World! Spain's banner to the far side of the Atlantic!"
 cas_events.99.t: "The Empire on which the Sun Never Sets"
 cas_events.99.d: "'In my Empire, the sun never sets (En mi Imperio nunca se pone el sol)' — Charles V's words become reality. From Spain to Naples, Flanders to the New World, the Philippines to the Caribbean, the Spanish flag flies in every corner of the world. In the reign of Philip II, the Spanish Empire is completed as humanity's first 'world empire.'"
 cas_events.99.a: "Long live the Empire on which the Sun Never Sets! Spain forever!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "The Spirit of the Reconquista"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "The Sword of Castile inspires holy war against Iberia's Muslims."
 STATIC_MODIFIER_NAME_cas_castile_secured_mod: "Castile and León Secured"
 STATIC_MODIFIER_NAME_cas_leon_dev_mod: "León Developed"
 STATIC_MODIFIER_DESC_cas_leon_dev_mod: "The city of León is developed, raising the region's economic foundation and prosperity."
 STATIC_MODIFIER_DESC_cas_castile_secured_mod: "Castile and León have become the unshakeable core of Spain."
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Victory at Río Salado"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "The crushing of the Marinid-Granada coalition at Río Salado opens the final act of the Reconquista."
 STATIC_MODIFIER_NAME_cas_extremadura_mod: "Extremadura Secured"
 STATIC_MODIFIER_DESC_cas_extremadura_mod: "The homeland of Cortés and Pizarro — Extremadura's rough lands produce Spain's greatest conquistadors."
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "Glory of the Old Kingdom of León"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "The ancient capital of León is developed as a symbol of the Reconquista's legacy."
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "Church Reform"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "Cisneros's reform makes Spain's Catholic Church Europe's most disciplined and powerful."
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "Counter-Reformation"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "Spain leads the Catholic counter-attack against the Protestant Reformation."
 STATIC_MODIFIER_NAME_cas_havana_mod: "Havana — Caribbean Hub"
 STATIC_MODIFIER_DESC_cas_havana_mod: "Havana is developed as the Caribbean's greatest trade and naval hub."
 STATIC_MODIFIER_NAME_cas_florida_mod: "La Florida"
 STATIC_MODIFIER_DESC_cas_florida_mod: "Spanish exploration of North America establishes a presence in the continent's southeast."
 STATIC_MODIFIER_NAME_cas_philippines_mod: "Philippine Islands"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "Spain's Asian expansion realized — Manila becomes the hub of trans-Pacific trade."
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "Kingdom of Sardinia"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "The Mediterranean granary Sardinia under Spanish control."
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "Italian Dominion"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "The Italian Peninsula falls under Spanish dominion — Renaissance wealth added to the Empire."
 STATIC_MODIFIER_NAME_cas_garrison_mod: "Fortress Network"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "A strategic fortress network guards the Spanish Empire's vast borders."
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "The Ancient Phoenician Port"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "Cádiz's natural harbor becomes a major Atlantic trade gateway."
 STATIC_MODIFIER_NAME_cas_malaga_mod: "Silk of Málaga"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "After the conquest of Granada, Málaga's warm climate and fertile land is developed as a silk-producing region. The craftsmen of the Alhambra support Málaga's silk industry, traded at high prices across the Mediterranean."
 STATIC_MODIFIER_NAME_cas_valencia_mod: "The City of the Sun"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "Valencia's silk and Mediterranean trade make it Spain's eastern economic center."
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "The Aragonese Capital"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "Zaragoza on the Ebro activates inland Iberian trade networks."
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "Barcelona — Mediterranean Hub"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "Barcelona as Spain's greatest Mediterranean commercial city."
 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "Reconquista Complete"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780 years of holy war complete — Spain unified under Catholic faith. The concept of 'Spain' is formed."
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "The Holy Brotherhood"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "The Hermandad strengthens royal authority and curbs noble privilege."
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "The Spanish Inquisition"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "The Inquisition safeguards the purity of the Catholic faith and speeds conversion."
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "Purity of Faith"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "The expulsion of the Jews establishes Spain's Catholic purity."
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "Legacy of the Catholic Monarchs"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "The Papally-granted title of 'Catholic Monarchs' establishes Spain's authority."
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "Absolutism"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "Royal power becomes absolute, and Spain emerges as a modern centralized state."
 STATIC_MODIFIER_NAME_cas_cortes_mod: "The Cortes"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "The Castilian Cortes is strengthened, establishing a stable system of governance."
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "Laws of the Indies"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "Colonial administrative law is codified, stabilizing the management of vast overseas territories."
 STATIC_MODIFIER_NAME_cas_canary_mod: "A Foothold in the Canaries"
 STATIC_MODIFIER_DESC_cas_canary_mod: "A foothold for Atlantic expansion has been established."
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "The Spirit of Atlantic Exploration"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "The drive to explore unknown seas makes Spain's Atlantic dominance possible."
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "Dominion of the Caribbean"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "The Caribbean becomes the 'inner sea' of the Spanish Empire."
 STATIC_MODIFIER_NAME_cas_mexico_mod: "The Viceroyalty of New Spain"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "The conquest of the Aztec Empire gives birth to the Viceroyalty of New Spain."
 STATIC_MODIFIER_NAME_cas_peru_mod: "The Viceroyalty of Peru"
 STATIC_MODIFIER_DESC_cas_peru_mod: "The conquest of the Inca Empire gives birth to the Viceroyalty of Peru. The wealth of the Andes flows to Spain."
 STATIC_MODIFIER_NAME_cas_potosi_mod: "The Silver Mines of Potosí"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "The world's largest silver mine sustains the finances of the Spanish Empire; silver becomes Spain's currency."
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "A Colonial Empire"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "A global Spanish colonial empire is complete; the conquistadors' dream becomes reality."
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "The Manila Galleon Trade"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "The Manila galleons crossing the Pacific establish the first global trade route linking Asia and the Americas."
 STATIC_MODIFIER_NAME_cas_naples_mod: "The Kingdom of Naples"
 STATIC_MODIFIER_DESC_cas_naples_mod: "The Kingdom of Naples comes under the Spanish crown, establishing influence in Italy."
 STATIC_MODIFIER_NAME_cas_sicily_mod: "The Kingdom of Sicily"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "Sicily, granary of the Mediterranean, is stabilized under Spanish rule."
 STATIC_MODIFIER_NAME_cas_milan_mod: "The Duchy of Milan"
 STATIC_MODIFIER_DESC_cas_milan_mod: "As a result of the Italian Wars, Milan falls within Spain's sphere of influence."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Hegemon of the Mediterranean"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "Spain seizes command of the Mediterranean — for the first time since ancient Rome, the sea is ruled by a single power."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "Hero of Lepanto"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "The Battle of Lepanto shatters the Ottoman navy, establishing Christian supremacy in the Mediterranean."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "The Fortress of Ceuta"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Ceuta, gateway to the Strait of Gibraltar, is secured — the door to Africa opens."
 STATIC_MODIFIER_NAME_cas_oran_mod: "The Conquest of Oran"
 STATIC_MODIFIER_DESC_cas_oran_mod: "The Reconquista expands into North Africa — Oran becomes Spain's North African stronghold."
 STATIC_MODIFIER_NAME_cas_tunis_mod: "The Subjugation of Tunis"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Having conquered Tunis, Spain contests the Ottoman Empire for supremacy in North Africa."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Dominion over North Africa"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "The Mediterranean coast of North Africa falls under Spanish rule, stabilizing Mediterranean trade."
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "The Casa de Contratación"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "Seville's Casa de Contratación monopolizes New World trade — the world's greatest trading institution is born."
 STATIC_MODIFIER_NAME_cas_tercio_mod: "The Tercio"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "The Tercio, the world's finest infantry formation, becomes the foundation of the Spanish army."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "The Military Orders"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "The military orders of Santiago, Calatrava, and Alcántara join the Spanish army."
 STATIC_MODIFIER_NAME_cas_armada_mod: "The Invincible Armada"
 STATIC_MODIFIER_DESC_cas_armada_mod: "130 ships strong, the 'Invincible Armada' embodies the height of Spanish naval power."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "The Conquistadors"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "The legend of Cortés and Pizarro lives on — Spanish conquistadors sweep across the world."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "The Golden Age"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "The age of Cervantes, Velázquez, and El Greco — Spanish culture stands at the pinnacle of the world."
 STATIC_MODIFIER_NAME_cas_escorial_mod: "El Escorial"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "Philip II's palace, monastery, and mausoleum embodies the zenith of the Spanish Empire."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "Aqueduct of Segovia"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "The great Roman-era aqueduct restored and upgraded, dramatically improving Segovia's urban water supply. This aqueduct becomes a model for water infrastructure across Castile."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "West African Trade"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "Spain enters West African trade using the Canary Islands as a foothold."
 STATIC_MODIFIER_NAME_cas_trent_mod: "Council of Trent"
 STATIC_MODIFIER_DESC_cas_trent_mod: "Spain-led Council of Trent reaffirms Catholic doctrine and establishes Counter-Reformation guidelines."
 STATIC_MODIFIER_NAME_cas_toledo_mod: "Toledo — City of Three Cultures"
 STATIC_MODIFIER_DESC_cas_toledo_mod: "Toledo secured — the greatest cultural city of Iberia becomes Spain's historical capital."
 STATIC_MODIFIER_NAME_cas_andalusia_mod: "Andalusia Conquered"
 STATIC_MODIFIER_DESC_cas_andalusia_mod: "Iberia's greatest agricultural and trading zone falls under Castilian control."
 STATIC_MODIFIER_NAME_cas_murcia_mod: "Murcia Conquered"
 STATIC_MODIFIER_DESC_cas_murcia_mod: "Murcia's silk and Mediterranean trade secured for Castile."
 STATIC_MODIFIER_NAME_cas_navarre_mod: "Navarre Conquered"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "The Pyrenean crossroads of Navarre secured — northern Iberia controlled."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "University of Salamanca"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "One of Europe's oldest universities produces Spain's elite scholars and officials."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Toledo Steel"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "Toledo steel and goldwork flourish — the historical capital is fully developed."
 STATIC_MODIFIER_NAME_cas_madrid_mod: "Madrid — Imperial Capital"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "Philip II's permanent capital Madrid becomes the heart of the world empire."
 STATIC_MODIFIER_NAME_cas_burgos_mod: "Burgos — International City of the Pilgrim Road"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "Burgos develops as Castile's historical capital and wool trade center."
 STATIC_MODIFIER_NAME_cas_mesta_mod: "The Mesta"
 STATIC_MODIFIER_DESC_cas_mesta_mod: "The Mesta shepherds' guild controls transhumance routes across Iberia."
 STATIC_MODIFIER_NAME_cas_valladolid_mod: "Valladolid Developed"
 STATIC_MODIFIER_DESC_cas_valladolid_mod: "Valladolid, where Columbus died, is developed as a central Castilian administrative hub."
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "Jewel of Spain"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "The Alhambra's city becomes Spain's southern cultural and economic center."
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "Cordovan Leather Production"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "The Mezquita's city, once the world's greatest, is developed as a center of culture and learning."
 STATIC_MODIFIER_NAME_cas_flanders_mod: "Flemish Inheritance"
 STATIC_MODIFIER_DESC_cas_flanders_mod: "Flanders's wealthy textile cities join the Spanish Empire's economic foundation."
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "Flanders Pacified"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "Flemish resistance suppressed — this prosperous region stably integrated into the Empire."
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "Foundations of the Empire on Which the Sun Never Sets"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "With all three pillars in place, Spain stands on the verge of completing 'the empire on which the sun never sets.'"
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "The Empire on Which the Sun Never Sets"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "Spain is complete as history's first global empire — the name 'the empire on which the sun never sets' is carved into history forever."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "The Treasure Fleets"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "The treasure fleets sailing to Spain each year transform the European economy."
 STATIC_MODIFIER_NAME_cas_portugal_mod: "The Union with Portugal"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "Through the Iberian Union, Portugal's colonial empire joins Spain as well."
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "The Iberian Union"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "The entire Iberian Peninsula is united, completing the foundation of the world's greatest empire."
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "Seville Flourishes"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "Seville, the New World trade gateway, developed as the world's greatest commercial city."
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "Imperial Trade Network"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "From Seville to Manila, Spain's imperial trade network covers the globe."
 STATIC_MODIFIER_NAME_cas_valladolid_dev_mod: "Expansion of Valladolid"
 STATIC_MODIFIER_DESC_cas_valladolid_dev_mod: "Valladolid, the royal castle city of Castile, is developed — RGO capacity and prosperity improved."
 STATIC_MODIFIER_NAME_cas_form_spain_mod: "Birth of the Kingdom of Spain"
 STATIC_MODIFIER_DESC_cas_form_spain_mod: "The unification of Spain improves administrative efficiency and stability."
 cas_events.1200.t: "Founding of the Mesta — Golden Age of Castilian Wool"
 cas_events.1200.d: "The shepherds of Castile have petitioned the king to establish 'La Mesta' — a powerful guild managing transhumance. This system, where flocks of sheep move from northern Castile to southern Andalusia via the cañadas (pastoral roads), supports Europe's finest wool production."
 cas_events.1200.a: "Authorize the Mesta — develop Castile's wool industry"
