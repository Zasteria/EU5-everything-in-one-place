l_russian:
 ara_crown_mission_pack: "The Path of the Crown of Aragon"
 ara_crown_mission_pack_DESCRIPTION: "The Crown of Aragon — uniting Catalonia, Aragon, and Valencia — stands at the center of history, contending for Iberian unity and Mediterranean supremacy. Join hands with Castile and forge Spain, or strike out alone, integrating Naples and marching to Constantinople. The path is yours to choose."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION: "Complete missions as the Crown of Aragon to establish Iberian unity and Mediterranean hegemony."
 ara_crown_mission_pack_BUTTON_TOOLTIP: "Complete missions to walk the path of the Crown of Aragon."
 ara_crown_mission_pack_BUTTON_DETAILS: "Lay the foundation of Spain, become master of the western Mediterranean, and seize Constantinople!"
 ara_colonial_mission_pack: "The Path to the New World"
 ara_colonial_mission_pack_DESCRIPTION: "West of the Strait of Gibraltar, beyond unknown oceans, lies a world no one yet knows. Open routes to the African coast, the New World, and the Spice Islands, and build a colonial empire spanning three seas."
 ara_colonial_mission_pack_CRITERIA_DESCRIPTION: "Complete exploration and colonization missions as the Crown of Aragon to build an empire of three oceans."
 ara_colonial_mission_pack_BUTTON_TOOLTIP: "Complete missions to become a pioneer of the Age of Exploration."
 ara_colonial_mission_pack_BUTTON_DETAILS: "Build colonies in Africa, the New World, and Asia — and reign over the world as the Empire of Three Oceans!"
 ara_accession_of_pedro_iv: "The Accession of Pedro IV"
 ara_accession_of_pedro_iv_desc: "In 1336, with the death of Alfonso IV, his son Pedro IV (Pere III the Ceremonious) ascended to the throne of the Crown of Aragon. Learned and deeply attached to courtly ceremony, this young king holds a firm resolve to strengthen royal authority and unify the realm. With the dawn of a new reign, Aragon's ambitions in the Mediterranean begin to burn once more."
 ara_accession_of_pedro_iv_tooltip: "[Starting mission] Playing as Aragon (ARA)."
 ara_kingdom_of_majorca: "The Kingdom of Majorca"
 ara_kingdom_of_majorca_desc: "The Kingdom of Majorca, once ruled by a cadet branch of the Aragonese royal house, persists as a distinct political force in the Balearic Islands. Fully integrating this territory will be the first step toward greater ambitions in the western Mediterranean."
 ara_kingdom_of_majorca_tooltip: "Majorca (c:MLL) has an opinion of 200 or higher toward us"
 ara_reconquest_of_granada: "The Reconquest of Granada"
 ara_reconquest_of_granada_desc: "The Kingdom of Granada, the last stronghold of Islam on the Iberian Peninsula, has long tormented the Christian kings with its fertile lands and magnificent palaces. Conquering this realm marks the completion of the Reconquista — an end to a struggle spanning centuries."
 ara_reconquest_of_granada_tooltip: "Own Granada."
 ara_vassalize_navarre: "Vassalize Navarre"
 ara_vassalize_navarre_desc: "The small kingdom of Navarre, wedged between France and Castile, is a strategically vital buffer zone for Aragon. Before France can absorb it, we must bring Navarre into Aragon's sphere of influence."
 ara_vassalize_navarre_tooltip: "Navarre (NAV) is our subject, or we own Navarre's territory."
 ara_intervene_in_castile: "Intervene in Castile"
 ara_intervene_in_castile_desc: "The court of Castile, sharing the Trastamara blood of our own royal house, has long been torn by factional strife. As the Infantes de Aragon once contested influence over this great kingdom, now is the time for us to intervene in its destiny."
 ara_intervene_in_castile_tooltip: "Own Toledo, or have a subject that owns Toledo."
 ara_union_of_the_crowns: "Union of the Crowns"
 ara_union_of_the_crowns_desc: "The crowns of Aragon and Castile have been joined under one royal house. This is the dawn of a new kingdom — Spain. Let us make real, by our own hands, the historic union forged in the age of Ferdinand and Isabella."
 ara_union_of_the_crowns_tooltip: "Be in a personal union with Castile (CAS), have Castile as a subject, or Castile does not exist."
 ara_war_of_the_remences: "The War of the Remences"
 ara_war_of_the_remences_desc: "The serfs of Catalonia — the remences — have risen up against centuries of noble exploitation, organizing through the Sindicat Remenca. As king, we must answer their grievances. Crush them by force, or seek reconciliation through reform? The choice will shape the kingdom's future."
 ara_war_of_the_remences_tooltip: "The 'Peasant Union' event (flavor_ara.6) has occurred"
 ara_catalan_nobility: "The Catalan Nobility"
 ara_catalan_nobility_desc: "After the uprising, we must decide the fate of the Catalan nobility. Strip their powers and strengthen royal authority, or seek coexistence within a reformed order? This decision will determine the stability of Catalonia and the future of governance across the realm."
 ara_catalan_nobility_tooltip: "The 'Justicia de Aragón' event (flavor_ara.16) has occurred"
 ara_crowns_of_iberia: "Crowns of Iberia"
 ara_crowns_of_iberia_desc: "Aragon, Castile, Navarre, Granada — all the crowns of the Iberian Peninsula have gathered under one royal house. Here, the foundation of the Spanish Empire has been laid. The time has come to announce to the world the birth of a new empire."
 ara_crowns_of_iberia_tooltip: "300+ total locations."
 ara_pacify_sardinia: "Pacify Sardinia"
 ara_pacify_sardinia_desc: "Aragon has long claimed dominion over Sardinia, yet internal revolts and competing powers have plagued the island. Fully pacifying this rich Mediterranean stronghold is an indispensable stepping stone for further expansion eastward."
 ara_pacify_sardinia_tooltip: "Own Oristano."
 ara_consulate_of_the_sea: "Consulate of the Sea"
 ara_consulate_of_the_sea_desc: "The maritime commercial law developed around Barcelona and Valencia — the Consolat de Mar — governs Mediterranean trade. Leveraging the prestige of this institution, bring the commerce of the western Mediterranean under our jurisdiction."
 ara_consulate_of_the_sea_tooltip: "The 'Consulate of the Sea' event (flavor_ara.1) has occurred"
 ara_dominate_genoa: "Dominate Genoa"
 ara_dominate_genoa_desc: "Genoa has long competed with Aragon for mastery of Mediterranean commerce. If we can seize Liguria and Genoa itself, trade across the western Mediterranean will fall completely into our hands."
 ara_dominate_genoa_tooltip: "Own Genoa, or have a subject that owns Genoa."
 ara_rule_italy: "Rule Italy"
 ara_rule_italy_desc: "Ruling all of Italy — including the Pope's domain — carries historic significance beyond mere conquest. By governing the land where Rome's legacy lives on, Aragon establishes itself as the hegemon of Europe."
 ara_rule_italy_tooltip: "Own 240+ of our own locations within the Italy region."
 ara_invade_occitania: "Invade Occitania"
 ara_invade_occitania_desc: "Provence, Languedoc, Gascony — the lands of southern France once fell within the Aragonese sphere of influence. Pushing our northern border against the Kingdom of France is an essential strategic task for the security of the Iberian Peninsula."
 ara_invade_occitania_tooltip: "Own Marseille, Toulon, or Nice, or have a subject that owns one of them."
 ara_humiliate_provence: "Humiliate Provence"
 ara_humiliate_provence_desc: "The Count of Provence has long claimed legitimate succession rights to both Aragon and Naples. We must end these arrogant pretensions and bring Provence under our control, making our western Mediterranean hegemony unassailable."
 ara_humiliate_provence_tooltip: "The County of Provence (PRO) does not exist."
 ara_aragonese_navy: "The Aragonese Navy"
 ara_aragonese_navy_desc: "The territories of the Crown of Aragon are scattered across the Mediterranean. Protecting all of them and maintaining naval supremacy requires a powerful fleet. Build the Aragonese Armada and establish command of this inland sea."
 ara_aragonese_navy_tooltip: "Navy size of 25 or more"
 ara_integrate_naples: "Integrate Naples"
 ara_integrate_naples_desc: "The Kingdom of Naples, conquered by King Alfonso V, remains one of the jewels in the Aragonese crown. By fully integrating southern Italy and the port city of Naples, our kingdom gains a bridgehead for expansion into the eastern Mediterranean."
 ara_integrate_naples_tooltip: "Own Naples, or have a subject that owns Naples."
 ara_mediterranean_ambitions: "Mediterranean Ambitions"
 ara_mediterranean_ambitions_desc: "To make our name resound as far as the eastern Mediterranean, a larger fleet and stronger naval power are required. Build a great galley fleet and fly our flag across the whole Mediterranean. A foothold in the Balkans is now within our reach."
 ara_mediterranean_ambitions_tooltip: "Navy size 100+."
 ara_combat_barbary_piracy: "Combat Barbary Piracy"
 ara_combat_barbary_piracy_desc: "The Muslim corsairs based along the North African coast are a constant threat to Aragonese shipping. Striking at their bases and freeing innocent Christians from slavery is urgent for both faith and national interest."
 ara_combat_barbary_piracy_tooltip: "Own Tlemcen, or have a subject that owns Tlemcen."
 ara_conquer_tunis: "Conquer Tunis"
 ara_conquer_tunis_desc: "Tunis is no mere pirate port. If we leave this naval power, with its ties to the Ottomans, unchecked, our Mediterranean hegemony will be constantly imperiled. Conquer Tunis and fully establish command of North Africa."
 ara_conquer_tunis_tooltip: "Own Tunis, or have a subject that owns Tunis."
 ara_occupy_alexandria: "Occupy Alexandria"
 ara_occupy_alexandria_desc: "Alexandria, key to the eastern Mediterranean, was once the center of ancient world knowledge and remains a hub of Egyptian and Asian trade. If we can seize this city and monopolize eastern commerce, Aragon will become a true Mediterranean hegemon."
 ara_occupy_alexandria_tooltip: "Own Alexandria, or have a subject that owns Alexandria."
 ara_claims_on_athens: "Claims on Athens"
 ara_claims_on_athens_desc: "As the Aragonese mercenaries — the Catalan Company — once established the Duchy of Athens, Aragon holds historical rights in Greek lands. Seize the Morea and northern Greece and secure the last foothold on the road to Constantinople."
 ara_claims_on_athens_tooltip: "Navy size 200+."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "From Gibraltar to the Sea of Marmara, the Mediterranean is our lake. No one may sail these waters without the permission of Aragon's fleet. Hegemony over the western Mediterranean is established — the next objective is that golden city behind its ancient walls."
 ara_mare_nostrum_tooltip: "Navy size 250+."
 ara_taula_de_canvi: "Taula de Canvi"
 ara_taula_de_canvi_desc: "The Taula de Canvi (Exchange Table), established in Barcelona in 1401, is one of Europe's oldest public banks. By making use of this financial institution, grown ever more sophisticated with the expansion of trade, we can place the kingdom's finances on an unshakeable foundation."
 ara_taula_de_canvi_tooltip: "Hold 300 or more gold"
 ara_valencian_silk: "Valencian Silk"
 ara_valencian_silk_desc: "Valencia is becoming known as a producer of fine silk. By building up the Silk Exchange (Llotja de la Seda) and developing Valencia's silk industry, we can gain the upper hand even against eastern competition."
 ara_valencian_silk_tooltip: "Valencia has RGO level 10+."
 ara_guilds_of_barcelona: "Guilds of Barcelona"
 ara_guilds_of_barcelona_desc: "The craftsmen's and merchants' guilds of Barcelona have long been the backbone of the city's economy. By securing their loyalty and organizing similar guilds across the realm, the foundation of industry and trade will be further reinforced."
 ara_guilds_of_barcelona_tooltip: "Total building levels in Barcelona are 50+."
 ara_industrial_districts: "Industrial Districts"
 ara_industrial_districts_desc: "Glass, wine, paper, and silk — Aragon is home to a diverse range of high-value goods. By organizing these industries and developing manufacturing, the kingdom's economic power will grow by leaps and bounds."
 ara_industrial_districts_tooltip: "Own 2+ market centers."
 ara_aragonese_renaissance: "The Aragonese Renaissance"
 ara_aragonese_renaissance_desc: "The court of Alfonso V became a center of Renaissance culture in Naples, drawing Italian humanists from across the peninsula. By spreading this cultural flowering throughout the kingdom, Aragon will establish itself as the intellectual and artistic heart of Europe."
 ara_aragonese_renaissance_tooltip: "Any one of our locations contains 50+ works of art."
 ara_golden_century: "The Golden Century"
 ara_golden_century_desc: "Having unified Iberia, mastered the Mediterranean, and seen economy and culture bloom, our kingdom is truly entering its Siglo de Oro — the Golden Century. Its brilliance will be spoken of for generations."
 ara_golden_century_tooltip: "All locations in the Iberia region are owned by us or our subjects."
 ara_city_of_the_worlds_desire: "City of the World's Desire"
 ara_city_of_the_worlds_desire_desc: "Constantinople — the city of the world's desire. Its golden walls have held back many conquerors over the centuries. Yet now, our fleet — masters of the Mediterranean — and our armies — unified across Iberia — stand ready to lay siege to this city at last. Seize both shores of the Bosphorus and make the ancient dream a reality."
 ara_city_of_the_worlds_desire_tooltip: "1,500+ total locations."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "'Plus Ultra' — further beyond. Once it was said that there was nothing west of the Pillars of Hercules. Yet our explorers now know that beyond them lies a vast unknown sea. The time has come to sail past the pillars and strike out for the ends of the world."
 ara_plus_ultra_tooltip: "Have 1+ explorer."
 ara_african_outposts: "African Outposts"
 ara_african_outposts_desc: "By pushing south along the West African coast, new routes open that bypass Muslim middlemen to reach gold and trade goods directly. First, establish footholds in the Canary Islands and along the Moroccan coast."
 ara_african_outposts_tooltip: "Own 3+ locations on the African continent."
 ara_gold_coast_trade: "The Gold Coast Trade"
 ara_gold_coast_trade_desc: "The region of the West African coast known as the Gold Coast is, true to its name, a rich source of gold. By establishing a trading post here, we can bring the wealth of Africa directly to the kingdom without relying on the overland Saharan route."
 ara_gold_coast_trade_tooltip: "Own a market center on the African continent."
 ara_discover_the_new_world: "Discover the New World"
 ara_discover_the_new_world_desc: "What lies to the west of the great ocean? Our explorers, who believe in a spherical Earth, are convinced a westward route to Asia exists. Fit out an exploration fleet and put out into the unknown sea. What you find there may be a new world beyond anyone's imagination."
 ara_discover_the_new_world_tooltip: "Own 1+ location on the American continent."
 ara_caribbean_foothold: "Caribbean Foothold"
 ara_caribbean_foothold_desc: "We have established our first bridgehead in the New World. Settle Hispaniola and surrounding islands and make them the launching point for exploration further into the continent. From here, paths south, north, and deep into the interior open before us."
 ara_caribbean_foothold_tooltip: "Own 5+ locations on the American continent."
 ara_conquest_of_the_incas: "Conquest of the Incas"
 ara_conquest_of_the_incas_desc: "Deep in the South American continent lies a great empire said to be filled with gold and silver — the Inca Empire (Tawantinsuyu). Lead conquistadors into the Andean highlands and make the wealth of this empire the kingdom's own."
 ara_conquest_of_the_incas_tooltip: "Own 15+ locations on the American continent."
 ara_new_kingdom_of_aragon: "New Kingdom of Aragon"
 ara_new_kingdom_of_aragon_desc: "The colonies we have built in the New World are no longer mere outposts. Organize them as a direct domain of the Aragonese crown — a New Kingdom of Aragon — with institutions matching those of the homeland. Sovereign of the Americas, our king shall be recorded as master of two worlds."
 ara_new_kingdom_of_aragon_tooltip: "Have a colonial nation as a subject."
 ara_route_to_the_indies: "Route to the Indies"
 ara_route_to_the_indies_desc: "Portugal has already pioneered the sea route to India around Africa's southern tip. But we cannot simply watch from the sidelines. Open a route around the world like Magellan, or reach the ports of India before Portugal does."
 ara_route_to_the_indies_tooltip: "Own 1+ location on the Asian continent."
 ara_spice_trade_outposts: "Spice Trade Outposts"
 ara_spice_trade_outposts_desc: "Cloves, nutmeg, and pepper from the Spice Islands (the Moluccas) fetch enormous prices in Europe. If we can establish a base there and monopolize the spice trade, the kingdom's treasury will be enriched in perpetuity."
 ara_spice_trade_outposts_tooltip: "Own a market center on the Asian continent."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "The archipelago that Magellan reached — the Philippines (Filipinas). By conquering and colonizing these strategically positioned islands, a new hub emerges at the center of Pacific trade. As the midpoint of the silver trade route linking China and the Americas, this territory holds incalculable value."
 ara_las_filipinas_tooltip: "Own 5+ locations on the Asian continent."
 ara_empire_of_the_three_oceans: "Empire of the Three Oceans"
 ara_empire_of_the_three_oceans_desc: "The Atlantic, the Indian Ocean, the Pacific — an empire that flies its flag across three great oceans has come into being. The scepter of Aragon now reaches not only into the courts of Europe, but into the jungles of Africa, the highlands of the New World, and the spice islands of Asia. We have achieved a feat no nation in history has ever accomplished."
 ara_empire_of_the_three_oceans_tooltip: "Hold 3+ colonial charters."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "Fleet of the Balearics"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Having secured our foothold in the western Mediterranean, our ships' range and our merchants' reach have grown."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Glory of the Crusade"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "The completion of the Reconquista has raised our tolerance of heretics and the legitimacy of the crown."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Balance of the Pyrenees"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "Bringing Navarre into our sphere has raised the kingdom's diplomatic standing."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "The Castilian Expeditionary Force"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "Having intervened in Castile, the royal army boasts high land morale."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "The Glory of the Catholic Monarchs"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "The union of Aragon and Castile has greatly raised the kingdom's prestige and legitimacy."
 STATIC_MODIFIER_NAME_ara_war_of_the_remences_mod: "The Legacy of Agrarian Reform"
 STATIC_MODIFIER_DESC_ara_war_of_the_remences_mod: "Having weathered the uprising, the kingdom's institutions have learned to maintain stability at lower cost."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "The Justicia's Verdict"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "The establishment of the Justicia de Aragon allows the discontent of the noble estate to subside more quickly."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "Spain's War Footing"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Having achieved the unification of Iberia, the kingdom's hand in the negotiations of war is greatly strengthened."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "The Sardinian Garrison"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "The pacified island of Sardinia has increased the kingdom's manpower and eased the toll of war."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "The Prestige of Maritime Law"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "The prestige of our maritime law has increased the kingdom's trade income and the reach of its merchants."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "The Ligurian Trading House"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "The trading house of Genoa has increased the reach of our merchants in this land."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Hegemon of the Peninsula"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "Ruling all of Italy has greatly raised the kingdom's prestige and strengthened its hand in the negotiations of war."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "The Occitan Expeditionary Force"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Having fought through southern France, the royal army marches faster and besieges with greater skill."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "The Subjugation of Provence"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Having seized the shipyards of Provence, the kingdom's output of naval supplies has grown."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "The Armada de Aragon"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "The reorganized Aragonese fleet boasts high morale and excellent repair capability."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "The Treasury of the Two Sicilies"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "Trade with Naples flourishes, and the royal army's manpower has grown."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "The Might of the Galley Fleet"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "The expanded fleet boasts high morale and an unmatched operating range."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "The Anti-Piracy Squadron"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Having suppressed the corsairs, the kingdom's merchant ships sail farther in safety, and the army's discipline has grown."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "The North African Garrison"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Having secured command of North Africa, our hand in the negotiations of war is stronger, and the army's manpower has grown."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "The Monopoly on Eastern Trade"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Having secured a hub of eastern trade, the kingdom's trade income and the reach of its merchants have grown greater than ever before."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "The Legacy of the Catalan Company"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Having campaigned in Greece, the royal army marches faster, and the toll of war weighs less heavily upon the realm."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "The Mediterranean Fleet High Command"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Having mastered the whole Mediterranean, our fleet boasts high morale and an unrivaled operating and trade range."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "The Credit of the Exchange Table"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "The well-organized exchange system has greatly increased income from minting."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "The Llotja de la Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "The growth of Valencia's silk industry has greatly raised fine cloth production in this land."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "The Loyalty of the Guilds"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Strengthened ties with the guilds of Barcelona have slightly raised this land's production efficiency."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "The Rise of Manufacturing"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "The well-developed industrial districts have greatly increased the kingdom's trade income and the reach of its merchants."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "The Court of the Humanists"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "This cultural flowering has raised the skill of new artists and the pace of innovation."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "The Prosperity of the Siglo de Oro"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "The prosperity of the Golden Century has greatly raised the kingdom's prestige and trade income."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Master of the Bosphorus"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "The splendor of an empire that holds Constantinople has raised its prestige and legitimacy, and strengthened its hand in the negotiations of war as never before."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "The Fever for Voyages Beyond"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "The spirit of exploration beyond has extended the reach of our colonial fleets and our navy."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "The Canary Outposts"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Our outposts along the African coast have extended the reach of the kingdom's merchant ships."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "The Network of Gold Trade"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "Trade with the Gold Coast has increased the kingdom's trade income and the reach of its merchants."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "The Spirit of the Ocean Fleet"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "The opening of the door to the New World has accelerated the flow of migrants across the kingdom."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "The Hispaniola Settlements"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Our foothold in the New World has increased its appeal to settlers."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "The Legacy of the Conquistadors"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "Having conquered the Inca Empire, the royal army's hand in the negotiations of war and its discipline have grown."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "The Crown of the Americas"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "Tribute from our New World kingdom enriches the homeland and strengthens the loyalty of our subjects."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "The Navigators' Compass"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "Opening the route to the Indies has extended our fleet's operating range."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "The Moluccan Trading House"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Our monopoly on the spice trade has greatly raised the kingdom's trade income."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "The Pacific Waystation"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "Securing this hub of Pacific trade has greatly extended our trade range and the efficiency of our sea trade."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "The Empire on Which the Sun Never Sets"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "The splendor of an empire spanning three oceans has raised the kingdom's trade income and the reach of its merchants as never before."
 ara_events.1.t: "The Accession of Pedro IV"
 ara_events.1.d: "In 1336, Alfonso IV passed away, and his son Pedro IV ascended to the throne of the Crown of Aragon. As of 1337, the realm is a loose union of the lands of Catalonia, Aragon, Valencia, and the Balearic Islands. Control over Sardinia remains unstable, and relations with neighboring Castile carry a constant undercurrent of tension. The merchant powers that command the trade routes of the Mediterranean hold great influence, and the crown must govern in consultation with the privileges of these various realms. Before the young King Pedro IV stretches a long road toward a unified Iberia and Mediterranean supremacy."
 ara_events.1.a: "A new reign begins"
 ara_events.2.t: "The Integration of the Kingdom of Majorca"
 ara_events.2.d: "The Kingdom of Majorca, once founded as a cadet branch of the Aragonese royal house by James II, has long remained within Aragon's sphere of influence — its holdings in the Balearic Islands, Roussillon, and Montpellier notwithstanding. The time has come for its full integration. Whether to annex it outright and make it a part of Aragon, or to retain it as a friendly vassal — in either case, Majorca will fall under the Aragonese crown."
 ara_events.2.a: "Annex Majorca outright"
 ara_events.2.b: "Retain Majorca as a friendly vassal"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Glory of Seizing Sicily"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "The seizure of Sicily raises naval morale and maritime presence in the Mediterranean."
