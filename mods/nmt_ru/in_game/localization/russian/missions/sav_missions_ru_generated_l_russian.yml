l_russian:
 sav_house_of_savoy_mission_pack: "Ambitions of the House of Savoy"
 sav_house_of_savoy_mission_pack_DESCRIPTION: "The House of Savoy, commanding the Alpine passes, is destined to rise from a small Piedmontese duchy to master all of Italy and southern France, building the Kingdom of Italy. Navigate skillfully between the Pope, the Emperor, and France; conquer Genoa to establish naval power; crush Lombardy, Tuscany, and Venice to claim Rome. Rise as Sardinia-Piedmont and ultimately become the standard-bearer of Italian unification."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION: "As Savoy, unify Piedmont, conquer Italy and France, and establish the Kingdom of Italy."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP: "Complete missions to fulfill the ambitions of the House of Savoy."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS: "Cross the Alps and unify Italy!"
 sav_the_savoy_ambition: "Ambitions of Savoy"
 sav_the_savoy_ambition_desc: "The House of Savoy occupies a unique position at the crossroads of the Alps, with influence over both Italy and France. By controlling the fertile lands of Piedmont and the Alpine trade routes, this small duchy begins its path toward greatness."
 sav_the_savoy_ambition_tooltip: "No requirements"
 sav_unify_piedmont: "Unify Piedmont"
 sav_unify_piedmont_desc: "Incorporating independent powers such as Saluzzo and Montferrat and unifying all of Piedmont is the first step toward Savoy's great ambitions."
 sav_unify_piedmont_tooltip: "Own 20 or more locations in the Piedmont area"
 sav_glory_of_turin: "Glory of Turin"
 sav_glory_of_turin_desc: "Develop Turin, the central city of Piedmont, into a thriving metropolis befitting the capital of the House of Savoy."
 sav_glory_of_turin_tooltip: "Turin has development of 40 or higher, and the capital is Turin"
 sav_shroud_of_turin: "The Shroud of Turin"
 sav_shroud_of_turin_desc: "The linen cloth believed to be the burial shroud of Christ rests in Turin Cathedral. Faith in this relic brings prosperity and prestige to the realm."
 sav_shroud_of_turin_tooltip: "The event 'The Palace of Venaria' (flavor_sav.1) has occurred"
 sav_alpine_roads: "Alpine Roads"
 sav_alpine_roads_desc: "Developing road infrastructure along the Alpine trade routes increases the profits flowing to Savoy as merchants crossing between France and Italy pass through."
 sav_alpine_roads_tooltip: "Have 10 or more bridge infrastructure buildings constructed"
 sav_crossroads_of_europe: "Crossroads of Europe"
 sav_crossroads_of_europe_desc: "Piedmont, connecting Genoa, Venice, and France, is becoming one of Europe's foremost commercial hubs."
 sav_crossroads_of_europe_tooltip: "Own 1 or more market centers"
 sav_order_of_saints_maurice: "Order of Saints Maurice and Lazarus"
 sav_order_of_saints_maurice_desc: "The Order of Saints Maurice and Lazarus, founded by the House of Savoy, becomes a symbol of religious authority and legitimacy in the Catholic world."
 sav_order_of_saints_maurice_tooltip: "The Papal States have an opinion of 100 or higher toward us, or do not exist"
 sav_savoy_academy: "Academy of Savoy"
 sav_savoy_academy_desc: "Embracing the Renaissance spirit and developing academic institutions centered on Turin establishes Savoy as a firm member of the Italian cultural sphere."
 sav_savoy_academy_tooltip: "Has embraced the Renaissance and owns 3 or more universities"
 sav_alpine_powerhouse: "Alpine Powerhouse"
 sav_alpine_powerhouse_desc: "Through the unification of Piedmont, cultural development, and growing economic strength, Savoy has come to be recognized as a major power centered on the Alps."
 sav_alpine_powerhouse_tooltip: "Total population 2,000 pops or more, own 200 or more locations"
 sav_alpine_fortifications: "Alpine Fortifications"
 sav_alpine_fortifications_desc: "Making full use of the Alps' natural ruggedness and constructing formidable fortresses at strategic positions makes Savoy an impregnable mountain state."
 sav_alpine_fortifications_tooltip: "Own 5 or more castles"
 sav_diplomatic_balance: "Diplomatic Balance"
 sav_diplomatic_balance_desc: "For Savoy, caught between great powers, diplomatic skill is indispensable for survival. Maintaining high diplomatic reputation deftly deflects pressure from powerful neighbors."
 sav_diplomatic_balance_tooltip: "Power projection is 10 or higher"
 sav_savoyard_army: "The Savoyard Army"
 sav_savoyard_army_desc: "Savoyard soldiers, hardened by the Alps' rugged terrain, are renowned as some of Europe's finest mountain warriors. Building a standing army supports the realm's military independence."
 sav_savoyard_army_tooltip: "Army size 10,000 or more, monthly army tradition growth 0.05 or more"
 sav_conquer_genoa: "Conquer Genoa"
 sav_conquer_genoa_desc: "Conquering Genoa, one of the Mediterranean's foremost maritime cities, allows Savoy to break free of its landlocked status and take the first step toward becoming a naval power with direct Mediterranean access."
 sav_conquer_genoa_tooltip: "Genoa is owned by us or a subject"
 sav_nice_naval_base: "The Naval Base at Nice"
 sav_nice_naval_base_desc: "Establishing a naval base at Nice on the Mediterranean coast gives Savoy a foothold for controlling the Tyrrhenian Sea."
 sav_nice_naval_base_tooltip: "Nice has a dock building"
 sav_sardinia_union: "Union with Sardinia"
 sav_sardinia_union_desc: "Seizing most of Sardinia and claiming the title of 'Kingdom of Sardinia' earns the House of Savoy recognition as one of Italy's major royal houses."
 sav_sardinia_union_tooltip: "Own 20 or more locations in the Sardinia area"
 sav_seize_lombardy: "Seize Lombardy"
 sav_seize_lombardy_desc: "Placing Lombardy, centered on Milan, under Savoyard control makes Savoy the master of northern Italy."
 sav_seize_lombardy_tooltip: "Milan is owned by us or a subject, or does not exist; own 30 or more locations in Lombardy"
 sav_push_tuscany: "Push into Tuscany"
 sav_push_tuscany_desc: "Subduing the rich city-states of Tuscany led by Florence adds the heartland of Renaissance culture to Savoyard territory."
 sav_push_tuscany_tooltip: "Own 15 or more locations in the Tuscany area"
 sav_capture_venice: "Capture Venice"
 sav_capture_venice_desc: "Conquering Venice, the Queen of the Adriatic, establishes Savoy's naval hegemony in northern Italy."
 sav_capture_venice_tooltip: "Own 20 or more locations in the Veneto area"
 sav_emilia_and_beyond: "Emilia and Beyond"
 sav_emilia_and_beyond_desc: "Seizing the Emilia region and bringing the remaining territories of northern Italy under control makes Savoyard hegemony absolute."
 sav_emilia_and_beyond_tooltip: "Own 10 or more locations in the Emilia area"
 sav_march_on_naples: "March on Naples"
 sav_march_on_naples_desc: "Conquering Naples, the key city of southern Italy, brings the completion of peninsular control within reach."
 sav_march_on_naples_tooltip: "Naples is owned by us or a subject"
 sav_eternal_rome: "The Eternal City"
 sav_eternal_rome_desc: "To control Rome is to control Italy. Having seized the Eternal City, Savoy demonstrates its authority as the legitimate ruler of Italy to the world."
 sav_eternal_rome_tooltip: "Rome is owned by us or a subject"
 sav_integrate_geneva: "Integrate Geneva"
 sav_integrate_geneva_desc: "Bringing Geneva, with its strong ties to the Swiss Confederation, firmly under Savoyard control establishes a foothold for northward expansion."
 sav_integrate_geneva_tooltip: "Geneva is directly owned by us"
 sav_control_provence: "Control Provence"
 sav_control_provence_desc: "Seizing Provence along the Mediterranean coast establishes Savoy's hegemony in southern France and opens the way to greater ambitions."
 sav_control_provence_tooltip: "Own 10 or more locations in the Provence area"
 sav_against_the_swiss: "Against the Swiss"
 sav_against_the_swiss_desc: "Suppressing the fiercely independent Swiss Confederation and seizing western Switzerland makes Savoy the master west of the Rhine."
 sav_against_the_swiss_tooltip: "Own 5 or more locations in the western Switzerland area"
 sav_conquer_burgundy: "Conquer Burgundy"
 sav_conquer_burgundy_desc: "Subduing the rich lands once controlled by the Duchy of Burgundy opens the road to the invasion of France."
 sav_conquer_burgundy_tooltip: "Own 30 or more locations in the France region"
 sav_savoyard_occitania: "Savoyard Occitania"
 sav_savoyard_occitania_desc: "Seizing the Occitan-speaking lands and drawing all of southern France into the Savoyard cultural sphere."
 sav_savoyard_occitania_tooltip: "Own 20 or more locations in the Provence area"
 sav_claim_france: "Claim France"
 sav_claim_france_desc: "The time has come to seize Paris, the capital of the Kingdom of France, and bring the great power that once threatened Savoy under our rule."
 sav_claim_france_tooltip: "Paris is owned by us or a subject, or France does not exist"
 sav_kingdom_of_italy: "Kingdom of Italy"
 sav_kingdom_of_italy_desc: "The House of Savoy has crossed the Alps to unify all of Italy and, as heir to the Roman Empire, founded the Kingdom of Italy. The dream of the Risorgimento has been realized here."
 sav_kingdom_of_italy_tooltip: "Own 200 or more locations in the Italy region, and own 400 or more locations in total"
