 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Seizure of Normandy raises naval morale and heavy ship power."
 sav_events.3.t: "Formation of Sardinia-Piedmont"
 sav_events.3.d: "Having seized nearly all of Sardinia, the House of Savoy has decided to formally adopt the title of 'King of Sardinia.' In history (1720), Savoy acquired Sardinia as a result of the War of the Spanish Succession, establishing the 'Kingdom of Sardinia.' This dual kingdom of Sardinia-Piedmont would become the cradle of Italian unification. Combining continental Piedmont with the island of Sardinia, this kingdom will emerge as a major power in northern Italy."
 sav_events.3.a: "As King of Sardinia, become the standard-bearer of Italian unification!"
 sav_franchises: "Savoyard Franchises"
 sav_franchises_desc: "In medieval Piedmont, the House of Savoy granted town rights known as 'franchises' to various towns. Guaranteeing freedom of migration, peasant enfranchisement, and expanded merchant trading rights, this system stimulates urban competition and revitalizes Piedmont. Completing this mission allows granting the 'Savoyard Franchises' town rights to locations."
 sav_franchises_tooltip: "Own 15 or more locations and have 1 or more market centers"
 sav_patria_legis: "Savoie-Val d'Aoste"
 sav_patria_legis_desc: "The 'Patria Legis' merges the traditional self-governance practices of the Val d'Aoste region with the governing ideals of the House of Savoy into a rational legal framework reflecting the Renaissance spirit. Completing this mission allows granting the 'Savoie-Val d'Aoste' town rights to locations."
 sav_patria_legis_tooltip: "Has embraced the Renaissance and owns 1 or more universities"
 STATIC_MODIFIER_NAME_sav_franchises_unlock_mod: "Unlock City Right: Franchises"
 STATIC_MODIFIER_DESC_sav_franchises_unlock_mod: "Allows granting the Franchises town right to locations. Effects: Pop migration speed +50%, peasant enfranchisement +10%, trades per burgher +100%."
 STATIC_MODIFIER_NAME_sav_patria_legis_unlock_mod: "Unlock City Right: Patria Legis"
 STATIC_MODIFIER_DESC_sav_patria_legis_unlock_mod: "Allows granting the Patria Legis town right to locations. Effects: Monthly prosperity +0.2%, pop promotion speed +20%, production efficiency +5%."
 franchises: "Franchises"
 franchises_desc: "Town rights established by the House of Savoy guaranteeing freedom of pop migration, peasant enfranchisement, and expanded merchant trading rights."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Town rights merging Val d'Aoste traditions with Savoyard legal principles, bringing urban prosperity, social mobility, and production efficiency."
