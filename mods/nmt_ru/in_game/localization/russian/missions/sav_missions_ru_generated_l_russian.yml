 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "The achievement of Italian unification permanently and greatly raises royal authority, diplomatic reputation, and military discipline."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Glory of Turin"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "The development of Turin permanently raises population growth and monthly development."
 sav_events.1.t: "Ambitions of the House of Savoy"
 sav_events.1.d: "The Duchy of Savoy occupies the strategic passes of the Alps connecting northern and southern Europe. With France and Italy on either side, this small principality is awakening to grand ambitions. The Savoyard coat of arms — a white cross on a red shield — will one day fly over all of Italy. Unify Piedmont, conquer Genoa, seize Rome, and found the Kingdom of Italy — the thousand-year dream of the House of Savoy is about to begin."
 sav_events.1.a: "Raise the glory of the House of Savoy!"
 sav_events.2.t: "The Glory of Turin"
 sav_events.2.d: "Under the rule of the House of Savoy, Turin is rapidly developing. With palaces and churches rising throughout the city and scholars and artists gathering here, this city is emerging as the cultural and political center of northern Italy. The flourishing of Turin as a capital befitting the House of Savoy will become the foundation for the prosperity of the entire realm."
 sav_events.2.a: "Turin is the shining capital of the House of Savoy"
 sav_woolens_of_piedmont: "Woolens of Piedmont"
 sav_woolens_of_piedmont_desc: "Piedmont is known as one of Italy's foremost producers of wool and cloth. Quality wool production and cloth processing form the commercial foundation of Savoyard wealth."
 sav_woolens_of_piedmont_tooltip: "Produce 5 or more wool or cloth nationally"
 sav_nebbiolo_vineyards: "Nebbiolo Vineyards"
 sav_nebbiolo_vineyards_desc: "The Nebbiolo grape grown in Piedmont's Langhe hills is the source of such renowned wines as Barolo and Barbaresco. Piedmontese wines are exported across Europe, generating great profits."
 sav_nebbiolo_vineyards_tooltip: "Produce 10 or more wine nationally"
 sav_casa_savoia: "Authority of the House of Savoy"
 sav_casa_savoia_desc: "The rule of the House of Savoy has stabilized, and its authority is now widely recognized at home and abroad. Legitimate, stable governance is the foundation that elevates Savoy to a major Italian power."
 sav_casa_savoia_tooltip: "Legitimacy is 90 or higher"
 sav_ordinanza_piedmontese: "Ordinanza Piedmontese"
 sav_ordinanza_piedmontese_desc: "In the 15th century, Savoy established a unique infantry tactics doctrine — the Ordinanza Piedmontese — forged in the Alpine highlands. Disciplined pike formations are the backbone of Savoyard military strength."
 sav_ordinanza_piedmontese_tooltip: "Army size 1,000 or more, monthly army tradition growth 0.03 or more"
 sav_university_of_turin: "University of Turin"
 sav_university_of_turin_desc: "Founded in 1404, the University of Turin serves as Piedmont's academic heart, teaching law, medicine, and theology. Savoy's intellectual heritage supports the blossoming of Renaissance culture."
 sav_university_of_turin_tooltip: "Own 5 or more universities, and Turin has development of 45 or higher"
 sav_corsica_seized: "Corsica Seized"
 sav_corsica_seized_desc: "Taking Corsica, long controlled by Genoa, greatly advances Savoyard command of the western Tyrrhenian Sea."
 sav_corsica_seized_tooltip: "Ajaccio is owned by us or a subject"
 sav_towers_of_sardinia: "Towers of Sardinia"
 sav_towers_of_sardinia_desc: "Since the Middle Ages, countless watchtowers (Torre Costiera) have lined the Sardinian coast. Developing and strengthening these defenses protects Sardinia from pirate incursions."
 sav_towers_of_sardinia_tooltip: "3 or more castles in the Sardinia area"
 sav_cagliari_development: "Development of Cagliari"
 sav_cagliari_development_desc: "Developing Cagliari, the capital of Sardinia, into an important harbor city and trading hub in the western Mediterranean."
 sav_cagliari_development_tooltip: "Cagliari has a population of 30 or more and development of 35 or higher"
 sav_tyrrhenian_sea: "Master of the Tyrrhenian Sea"
 sav_tyrrhenian_sea_desc: "Having seized both Corsica and Sardinia and built a powerful fleet, Savoy has established complete mastery of the Tyrrhenian Sea. Trade in the western Mediterranean falls under Savoyard protection."
 sav_tyrrhenian_sea_tooltip: "Navy size 20 or more, own 1 or more market centers"
 sav_languedoc: "Control of Languedoc"
 sav_languedoc_desc: "Seizing Languedoc, a key position in southern France. Taking the two great cities of Montpellier and Toulouse becomes a foothold for controlling all of southern France."
 sav_languedoc_tooltip: "Own 20 or more locations in the Languedoc area"
 sav_gascony: "Gascony Seized"
 sav_gascony_desc: "Gascony, centered on Bordeaux, is a rich wine-producing land facing the Atlantic. Severing its long historical relationship with England and adding this land to Savoyard territory."
 sav_gascony_tooltip: "Bordeaux is owned by us or a subject"
 sav_lyon_gateway: "The Gateway of Lyon"
 sav_lyon_gateway_desc: "Located at the confluence of the Rhône and Saône rivers, Lyon is the commercial hub connecting southern and northern France. Seizing this city opens the route into the French interior."
 sav_lyon_gateway_tooltip: "Lyon is owned by us or a subject"
 sav_loire_valley: "The Loire Valley"
 sav_loire_valley_desc: "The Loire Valley — the 'Garden of France' — where the châteaux of the French royal family once stood. Seizing Nantes and Tours signifies the conquest of central western France."
 sav_loire_valley_tooltip: "Nantes and Tours are owned by us or a subject"
 sav_normandy_coast: "The Norman Coast"
 sav_normandy_coast_desc: "Seizing Normandy, the historic coast where the Normans once landed. Rouen, at the heart of this rich land, is a key position in northern France and the last barrier before Paris."
 sav_normandy_coast_tooltip: "Rouen is owned by us or a subject"
