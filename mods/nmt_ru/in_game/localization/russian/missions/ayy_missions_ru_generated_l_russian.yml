 ayy_mamluk_rivalry: "Confrontation with the Mamluks"
 ayy_mamluk_rivalry_desc: "The Mamluk Sultanate — originally Turkic slave soldiers raised by the Ayyubids who overthrew the dynasty in 1250 — are our sworn enemies. Check the Mamluks and establish a claim on Aleppo as a foothold for the reconquest of Syria."
