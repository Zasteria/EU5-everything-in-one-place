l_russian:
 ayy_ayyubid_mission_pack: "The New Saladin and Master of the Middle East"
 ayy_ayyubid_mission_pack_DESCRIPTION: "In 1337, the Ayyubid dynasty survives as a small state in northern Syria. Reclaim the glory of Saladin (1138-1193) who unified Egypt, Syria, and Mesopotamia and drove the Crusaders from Jerusalem. Conquer Egypt, liberate Jerusalem, seize Baghdad, and become the Guardian of Mecca and Medina to reign as the New Saladin."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION: "Conquer Egypt, the Levant, Mesopotamia, and Arabia, and reign as master of the Middle East as guardian of Sunni Islam."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP: "Reign as the New Saladin over the Middle East."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS: "From a small state in northern Syria, defeat the Crusaders, reclaim Jerusalem, and build a great Middle Eastern empire!"
 ayy_rise_of_ayyubids: "Rise of the Ayyubids"
 ayy_rise_of_ayyubids_desc: "The Ayyubid dynasty, heirs of Saladin, begin their restoration from a small state in northern Syria."
 ayy_secure_sinai: "Secure the Sinai"
 ayy_secure_sinai_desc: "Secure the Sinai Peninsula as the gateway between Egypt and the Levant."
 ayy_conquer_lower_egypt: "Conquest of Lower Egypt"
 ayy_conquer_lower_egypt_desc: "Conquer the Nile Delta and Alexandria to seize Egypt's wealthy heartland."
 ayy_seize_cairo: "Seize Cairo"
 ayy_seize_cairo_desc: "Seize Cairo — the City of a Thousand Minarets — as the Ayyubid capital."
 ayy_upper_egypt: "Conquest of Upper Egypt"
 ayy_upper_egypt_desc: "Conquer Upper Egypt to the Aswan cataracts and complete Nile control."
 ayy_nile_breadbasket: "Breadbasket of the Nile"
 ayy_nile_breadbasket_desc: "Harness the fertile Nile floodplains to feed the empire."
 ayy_dev_cairo: "Construction of the Imperial Capital Cairo"
 ayy_dev_cairo_desc: "Build Cairo into the greatest city of the Islamic world — imperial capital of the Ayyubid Empire."
 ayy_secure_levant: "Secure the Levant"
 ayy_secure_levant_desc: "Secure the Levant centered on Damascus and drive out the Crusaders."
 ayy_seize_aleppo: "Seize Aleppo"
 ayy_seize_aleppo_desc: "Seize Aleppo — the crown of northern Syria."
 ayy_reclaim_jerusalem: "Reclaim Jerusalem"
 ayy_reclaim_jerusalem_desc: "Reclaim Jerusalem from the Crusaders as Saladin did in 1187."
 ayy_coastal_levant: "The Coastal Levant"
 ayy_coastal_levant_desc: "Seize the Mediterranean coastal cities of the Levant to control sea trade."
 ayy_antioch: "Subjugate Antioch"
 ayy_antioch_desc: "Subjugate the ancient great city of Antioch to extend northern influence."
 ayy_dominate_levant: "Dominate the Levant"
 ayy_dominate_levant_desc: "Achieve total dominance over the Levant — from Aleppo to Jerusalem, all under the Ayyubid banner."
 ayy_jazira: "Independence from the Ilkhanate"
 ayy_jazira_desc: "The Jazira region between the Tigris and Euphrates has fallen under Mongol Ilkhanate influence. Place this rich land under Ayyubid or vassal control and break free from the Mongol yoke. Elevation to a duchy will elevate Ayyubid legitimacy."
 ayy_kurdish_highlands: "The Kurdish Highlands"
 ayy_kurdish_highlands_desc: "Integrate the Kurdish mountain tribes — Saladin's own people — into the Ayyubid army."
 ayy_iraq_arabi: "Conquest of Iraq al-'Arabi"
 ayy_iraq_arabi_desc: "Conquer Iraq al-Arabi to control the Mesopotamian heartland."
 ayy_seize_baghdad: "Seize Baghdad"
 ayy_seize_baghdad_desc: "Seize Baghdad — the City of Peace — and proclaim Ayyubid dominance."
 ayy_mesopotamia_trade: "Mesopotamian Trade"
 ayy_mesopotamia_trade_desc: "Control the Mesopotamian trade network centered on Baghdad."
 ayy_hejaz: "Advance into the Hejaz"
 ayy_hejaz_desc: "Advance into the Hejaz and approach the holy cities of Mecca and Medina."
 ayy_holy_cities: "Guardian of the Holy Cities"
 ayy_holy_cities_desc: "Become Guardian of the Two Holy Cities — Mecca and Medina."
 ayy_north_yemen: "Northern Yemen"
 ayy_north_yemen_desc: "Conquer northern Yemen and gain access to Red Sea trade."
 ayy_south_yemen: "Seize the Port of Aden"
 ayy_south_yemen_desc: "Seize the port of Aden — the gateway of the Arabian Sea."
 ayy_arabian_trade: "Arabian Sea Trade"
 ayy_arabian_trade_desc: "Monopolize the Arabian trade routes connecting the Indian Ocean to the Mediterranean."
 ayy_sunni_revival: "Sunni Revival"
 ayy_sunni_revival_desc: "Revive Sunni Islam throughout the empire, reversing the Fatimid Shia legacy as Saladin once did."
 ayy_madrasa: "Establish the Madrasa"
 ayy_madrasa_desc: "Establish madrasas across the empire to revive Islamic learning."
 ayy_crusader_wars: "Holy War Against the Crusaders"
 ayy_crusader_wars_desc: "Wage holy war against the Crusaders to forge the Ayyubid army into elite warriors."
 ayy_ayyubid_army: "The Ayyubid Army"
 ayy_ayyubid_army_desc: "Build the Ayyubid army — an elite blend of Kurdish, Turkish, and Arab warriors."
 ayy_dev_damascus: "Prosperity of Damascus"
 ayy_dev_damascus_desc: "Develop Damascus — the Earthly Paradise — as the Ayyubid cultural capital."
 ayy_spice_trade: "Spice Trade"
 ayy_spice_trade_desc: "Monopolize the spice trade from the Indian Ocean through Aden to European markets."
 ayy_silk_road_control: "Control the Silk Road"
 ayy_silk_road_control_desc: "Control the Silk Road through Baghdad to dominate east-west overland trade."
 ayy_kurdish_cavalry: "Kurdish Cavalry Elite"
 ayy_kurdish_cavalry_desc: "Forge the Kurdish cavalry into the Ayyubid's finest fighting force."
 ayy_nile_fleet: "The Nile Fleet"
 ayy_nile_fleet_desc: "Build a fleet on the Nile and Mediterranean to cut Crusader supply lines."
 ayy_oman_trade: "Oman Trade"
 ayy_oman_trade_desc: "Seize Oman to control the Persian Gulf entrance and dominate Indian Ocean trade."
 ayy_defeat_crusaders: "Defeat the Crusaders"
 ayy_defeat_crusaders_desc: "Replicate Saladin's destruction of the Crusader army at Hattin."
 ayy_egypt_navy: "Egyptian Navy"
 ayy_egypt_navy_desc: "Build a powerful Egyptian navy to dominate the Mediterranean and Red Sea."
 ayy_sugar_egypt: "Sugar of Egypt"
 ayy_sugar_egypt_desc: "Monopolize Egypt's sugar production — the sweet gold of medieval commerce."
 ayy_iraq_ajam: "Advance into Iraq al-Ajam"
 ayy_iraq_ajam_desc: "Advance into Iraq al-Ajam to extend Ayyubid influence into Persia."
 ayy_build_mosques: "Build Mosques Throughout"
 ayy_build_mosques_desc: "Build mosques across the empire to unify all subjects under Sunni Islam."
 ayy_sultan_of_egypt_syria: "Sultan of Egypt and Syria"
 ayy_sultan_of_egypt_syria_desc: "Proclaim the Sultan of Egypt, Syria, Iraq, and the Hejaz — master of the Middle East."
 ayy_new_saladin: "The New Saladin"
 ayy_new_saladin_desc: "Reign as the New Saladin — master of the Middle East, successor of Saladin's legacy."
 ayy_events.1.t: "Rise of the Ayyubids — Saladin's Oath"
 ayy_events.1.d: "In the name of God — In 1337, the Ayyubid dynasty survives as a small state, but Saladin's spirit flows through its veins. The memory of the Battle of Hattin (1187) and the liberation of Jerusalem drives the Ayyubid Sultan forward. Conquer Egypt, liberate the holy city, protect Mecca — become the New Saladin, master of the Middle East."
 ayy_events.1.a: "In the path of God — Rise, Ayyubids!"
 ayy_events.10.t: "Liberation of Jerusalem — The Holy City Returns to Islam"
 ayy_events.10.d: "Allahu Akbar! — Saladin's great achievement of 1187 has been repeated. Jerusalem has returned to Muslim hands. The Dome of the Rock and the Holy Mosque ring with Islamic prayer once more. The Islamic world rejoices."
 ayy_events.10.a: "Long live Jerusalem! In the name of God!"
 ayy_events.20.t: "Entry into Baghdad — To the Heart of the Islamic World"
 ayy_events.20.d: "The City of Peace, Baghdad — Ayyubid forces have entered the city where the Abbasid Caliphs once ruled. People cry out 'Saladin's successor has come!' Baghdad's culture and learning flourishes under Ayyubid patronage."
 ayy_events.20.a: "Long live Baghdad! Long live the glory of Islam!"
 ayy_events.30.t: "Guardian of the Two Holy Cities — Protect Mecca and Medina"
 ayy_events.30.d: "Mecca and Medina — the holy sites of the Prophet Muhammad have come under Ayyubid protection. 'Khadim al-Haramayn al-Sharifayn' — this title is granted to the Ayyubid Sultan and recognized by the entire Islamic world."
 ayy_events.30.a: "As Guardian of the Two Holy Cities — In the name of God!"
 ayy_events.60.t: "Sultan of Egypt and Syria — Master of the Middle East"
 ayy_events.60.d: "Declared in the Cairo court — 'Sultan of Egypt, Syria, Iraq, and the Hejaz, Lord of the Ayyubid dynasty.' Jerusalem, Baghdad, Mecca, and Cairo are all united under the Ayyubid banner. The dream since Saladin's time has been realized."
 ayy_events.60.a: "Long live the Sultan! Long live the Ayyubids!"
 ayy_events.99.t: "The New Saladin — Eternal Master of the Middle East"
 ayy_events.99.d: "'Salah ad-Din Ayyubi — Righteousness of Faith, Master of the Middle East' — this title is inscribed in history. From the Nile in Egypt to the Tigris in Mesopotamia, from the Arabian Desert to the Anatolian mountains — all lands united under the Ayyubid banner."
 ayy_events.99.a: "Long live the New Saladin! Long live the Ayyubid Empire!"
