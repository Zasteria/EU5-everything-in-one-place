l_russian:
 mon_montferrat_mission_pack: "Palaiologos Ambition and Master of Italy"
 mon_montferrat_mission_pack_DESCRIPTION: "In 1337, the Margraviate of Montferrat is ruled by a lord with the blood of Byzantium's Palaiologos dynasty in his veins. Claim Thessaloniki and march east toward Constantinople, or forge an empire in northern Italy with diplomacy and the condottiere's sword — two ambitions burn in one sovereign."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION: "Eastern dream or western dominion — Palaiologos blood opens both paths."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP: "Use Palaiologos blood to conquer Italy and Greece."
 mon_montferrat_mission_pack_BUTTON_DETAILS: "From Thessaloniki to Athens under the Palaiologos name, from Casale to Genoa by steel and coin — conquer East and West!"
 mon_palaiologos_ambition: "Palaiologos Ambition"
 mon_palaiologos_ambition_desc: "The ruler of Montferrat carries Palaiologos blood. Two ambitions burn: east toward Thessaloniki, or west toward Italian dominion."
 mon_claim_thessaloniki: "Claim on Thessaloniki"
 mon_claim_thessaloniki_desc: "Claim Thessaloniki — once Byzantium's second city — as a foothold for eastern ambitions."
 mon_seize_thessaloniki: "Seize Thessaloniki"
 mon_seize_thessaloniki_desc: "Seize Thessaloniki and plant the Palaiologos banner on the White Tower."
 mon_greek_culture_shift: "Greek Cultural Shift"
 mon_greek_culture_shift_desc: "Adopt Greek culture to transform Montferrat into a Byzantine successor."
 mon_orthodox_faith: "Conversion to Orthodoxy"
 mon_orthodox_faith_desc: "Convert to Orthodoxy to legitimize Montferrat as the true heir of Byzantium."
 mon_conquer_macedonia: "Conquest of Macedonia"
 mon_conquer_macedonia_desc: "Conquer Macedonia — gateway to Greece and birthland of Alexander the Great."
 mon_northern_greece: "Northern Greece"
 mon_northern_greece_desc: "Secure northern Greece as the foundation for further expansion."
 mon_conquer_morea: "Conquest of the Morea"
 mon_conquer_morea_desc: "Conquer the Morea and Athens — the heart of ancient Greek civilization."
 mon_aegean_control: "Control the Aegean"
 mon_aegean_control_desc: "Seize the Aegean islands to extend Montferrat's maritime reach."
 mon_new_byzantium: "The New Byzantium"
 mon_new_byzantium_desc: "Claim the Byzantine legacy and be recognized as the successor of Eastern Rome."
 mon_secure_piedmont: "Secure Piedmont"
 mon_secure_piedmont_desc: "Secure Piedmont as the foundation for northern Italian dominance."
 mon_casale_capital: "Casale Monferrato"
 mon_casale_capital_desc: "Develop Casale Monferrato into a worthy capital of the Margraviate."
 mon_rival_savoy: "Rival Savoy"
 mon_rival_savoy_desc: "Counter Savoy — the rival for Piedmontese dominance — and establish supremacy."
 mon_control_lombardy: "Control Lombardy"
 mon_control_lombardy_desc: "Conquer Lombardy — the heart of northern Italy."
 mon_seize_genoa: "Seize Genoa"
 mon_seize_genoa_desc: "Seize Genoa — La Superba — and gain access to Mediterranean trade."
 mon_north_italy_trade: "North Italian Trade Empire"
 mon_north_italy_trade_desc: "Build a commercial empire spanning Lombardy, Liguria, and Veneto."
 mon_emilia: "Conquest of Emilia"
 mon_emilia_desc: "Conquer the fertile Po Valley south bank — Bologna, Parma, and Modena."
 mon_king_of_italy: "King of Italy"
 mon_king_of_italy_desc: "Proclaim the King of Italy after unifying Lombardy, Liguria, and Emilia."
 mon_hre_relations: "HRE Relations"
 mon_hre_relations_desc: "Define the relationship with the Holy Roman Empire — ally, rival, or leader."
 mon_dev_casale: "Casale — City of Learning and Wealth"
 mon_dev_casale_desc: "Transform Casale into a city of learning and wealth where Renaissance and Byzantine heritage unite."
 mon_renaissance_court: "Renaissance Court"
 mon_renaissance_court_desc: "Create a Renaissance court where Byzantine classical knowledge and Italian artistic innovation fuse."
 mon_mercenary_tradition: "Condottiere Tradition"
 mon_mercenary_tradition_desc: "Build the condottiere tradition — Montferrat's mercenary military heritage."
 mon_papal_alliance: "Papal Alliance"
 mon_papal_alliance_desc: "Ally with the Pope to legitimize Montferrat's ambitions across Italy."
 mon_tuscany: "Conquest of Tuscany"
 mon_tuscany_desc: "Conquer Tuscany — home of Medici Renaissance culture — and advance toward Rome."
 mon_veneto: "Conquest of Veneto"
 mon_veneto_desc: "Conquer the Veneto including Venice to complete northern Italian mastery."
 mon_byzantine_heritage: "Byzantine Heritage"
 mon_byzantine_heritage_desc: "Claim the full Byzantine legacy — in Greek culture and Orthodoxy, gain greater rewards."
 mon_navy_adriatic: "Adriatic Fleet"
 mon_navy_adriatic_desc: "Build a powerful Adriatic fleet combining Genoese and Venetian sea power."
 mon_southern_italy: "Southern Italy"
 mon_southern_italy_desc: "Advance into southern Italy and seize Naples to unite the Italian Peninsula."
 mon_marquis_of_italy: "Grand Marquis of Italy"
 mon_marquis_of_italy_desc: "Reign as Grand Marquis of Italy — uniting East and West, North and South."
 mon_new_roman_empire: "New Roman Empire"
 mon_new_roman_empire_desc: "Proclaim the New Roman Empire — successor of both Eastern and Western Rome."
 mon_events.10.t: "Seize Thessaloniki — The Palaiologos Banner over the White Tower"
 mon_events.10.d: "Thessaloniki — once the second city of the Byzantine Empire, now falls to Montferrat. The ruler with Palaiologos blood begins to make eastern ambitions reality. The White Tower bells ring — a new era has begun."
 mon_events.10.a: "Long live Thessaloniki! Under the Palaiologos banner!"
 mon_events.20.t: "King of Italy — Triumph from Casale to the Holy City"
 mon_events.20.d: ""King of Italy" — Montferrat, having unified Lombardy, Liguria, and Emilia, is declared the new master of the Italian Peninsula. Cheers ring through the Casale court."
 mon_events.20.a: "Long live the King of Italy!"
 mon_events.50.t: "Birth of New Byzantium — The Palaiologos Dream Realized"
 mon_events.50.d: ""Palaiologos Emperor — successor to Rome and Constantinople" — Montferrat inherits the Byzantine name. The journey from a small north Italian margraviate has begun its path to mastery of the Eastern Mediterranean."
 mon_events.50.a: "Long live the Palaiologos Emperor! Long live New Byzantium!"
 mon_events.60.t: "Grand Marquis of Italy — Reigning at the Crossroads of East and West"
 mon_events.60.d: "From Casale Monferrato to Genoa, Florence, Naples — the Montferrat Empire is born. Renaissance art, Byzantine spirit, condottiere sword — three powers fused to create the master of Italy."
 mon_events.60.a: "Long live the Grand Marquis of Italy!"
 mon_events.99.t: "New Roman Empire — Unifier of East and West"
 mon_events.99.d: ""Palaiologos Emperor — successor of Eastern and Western Rome, King of Italy, Lord of Greece" — this title echoes across the Mediterranean world. The ambition that sprouted in Casale's small court in 1337 now culminates in the building of a world empire. The name of Rome is restored."
 mon_events.99.a: "Long live the New Roman Empire! Long live eternal glory!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Palaiologos"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "The Palaiologos bloodline awakens Montferrat's ambitions toward East and West."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Thessaloniki Claim"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Thessaloniki beckons — the Palaiologos banner will soon fly over the Aegean."
 STATIC_MODIFIER_NAME_mon_greek_culture_mod: "Greek Culture"
 STATIC_MODIFIER_DESC_mon_greek_culture_mod: "Greek culture is adopted — Montferrat transforms into a Byzantine successor."
 STATIC_MODIFIER_NAME_mon_orthodox_mod: "Orthodox"
 STATIC_MODIFIER_DESC_mon_orthodox_mod: "Orthodoxy is embraced — Montferrat legitimized as the true heir of Byzantium."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Macedonia"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Macedonia is conquered — gateway to Greece and birthland of Alexander the Great."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Northern Greece"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Northern Greece is secured as the foundation for further expansion south."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Morea"
 STATIC_MODIFIER_DESC_mon_morea_mod: "The Morea and Athens are conquered — the heart of ancient Greek civilization restored."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Aegean"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Aegean islands are seized, extending Montferrat's maritime reach into the Mediterranean."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Piedmont"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Piedmont is secured — the levy forces of northern Italy now march under Montferrat's banner."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Casale"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Casale Monferrato beats as the commercial heart of the Margraviate."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Savoy"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Savoy — the rival for Piedmontese dominance — is countered and suppressed."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Lombardy"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Lombardy — the heart of northern Italy — falls under Montferrat's control."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Genoa"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "La Superba Genoa is seized — the door to Mediterranean trade swings open."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Trade"
 STATIC_MODIFIER_DESC_mon_trade_mod: "A commercial empire spanning Lombardy, Liguria, and Veneto is built."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Emilia"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "The fertile Po Valley south bank — Bologna, Parma, Modena — is conquered."
 STATIC_MODIFIER_NAME_mon_hre_mod: "Hre"
 STATIC_MODIFIER_DESC_mon_hre_mod: "The Holy Roman Empire's relationship is defined — Montferrat gains diplomatic standing."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Casale Dev"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Casale enters its golden age of learning and wealth — the cultural beacon of northern Italy."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Renaissance"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "A Renaissance court is created — Byzantine classical knowledge fuses with Italian artistic innovation."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Condottieri"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "The condottiere tradition is built — mercenary costs fall, maintenance improves."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Papal"
 STATIC_MODIFIER_DESC_mon_papal_mod: "The Pope's blessing legitimizes Montferrat's ambitions across the Italian Peninsula."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Tuscany"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Tuscany — home of Medici Renaissance culture — is conquered and secured."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Veneto"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "The Veneto including Venice is conquered — northern Italian mastery is complete."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Heritage"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "The full Byzantine legacy claimed — bureaucracy, aqueducts, and legitimacy flow from ancient Rome."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Navy"
 STATIC_MODIFIER_DESC_mon_navy_mod: "A powerful Adriatic fleet combining Genoese and Venetian sea power is built."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Southern Italy"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Southern Italy and Naples are seized — the Italian Peninsula unified under one banner."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Marquis Final"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "The Grand Marquis of Italy reigns — uniting East and West, North and South."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "New Roman"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "The New Roman Empire is proclaimed — successor of both Eastern and Western Rome."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "The Carta di Franchigia — 'Charter of Freedom.' The Marquis of Montferrat grants autonomy and privileges to each city, creating fertile ground for merchants, peasants, and citizens to prosper. Just as Casale once flourished under such a charter, the entire margraviate will benefit from its blessings."
 mon_acqui_terme: "Development of Acqui Terme"
 mon_acqui_terme_desc: "Acqui Terme — renowned as a 'city of thermal springs' since ancient Roman times. Restore its celebrated waters. The healing springs once visited by Roman emperors will become Montferrat's new pride, reborn as a city of health drawing visitors from afar."
 STATIC_MODIFIER_NAME_mon_city_charter_mod: "Carta di Franchigia Proclaimed"
 STATIC_MODIFIER_DESC_mon_city_charter_mod: "The Charter of Freedom proclaimed — the Carta di Franchigia town right unlocked in each city, unleashing the vitality of merchants, peasants, and citizens."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Acqui Terme Restored"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "The ancient Roman thermal springs restored — Acqui reborn as a city of health and prosperity."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "Fading Light of Byzantium"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "The Byzantine legacy illuminates Montferrat — its legitimacy quietly begins to rise."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "Majesty of the New Byzantium"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "The Palaiologos dream realized — imperial administration, naval power, and road networks crystallized as Montferrat's strength."
