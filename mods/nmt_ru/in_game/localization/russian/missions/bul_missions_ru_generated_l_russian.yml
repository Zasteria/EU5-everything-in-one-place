l_russian:
 bul_bulgaria_mission_pack: "The New Byzantium — Legacy of the Second Empire and Balkan Hegemony"
 bul_bulgaria_mission_pack_DESCRIPTION: "As heir to the legacy of the Second Bulgarian Empire, establish independence, claim hegemony over the Balkan peninsula, repel the Ottoman threat, and raise a new Byzantium at Constantinople."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION: "Establish independence, revive the Balkan empire, repel the Ottomans, and found the New Byzantium."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP: "From the ancient city of Tarnovo to a new empire shining over the Balkans."
 bul_bulgaria_mission_pack_BUTTON_DETAILS: "'Master of Tsarigrad' — inherit the glory of the Second Empire, and found the Third Bulgarian Empire!"
 bul_second_bulgarian_legacy: "A Fracturing Empire"
 bul_second_bulgarian_legacy_desc: "The glorious empire built by Ivan Asen I and Ivan Asen II is now splintering under noble ambition into Tarnovo, Vidin, and Dobrudja — halt this decline."
 bul_assert_independence: "The Authority of Tsarigrad"
 bul_assert_independence_desc: "An empire on the verge of fracture — as Tsar of Tarnovo, establish an authority that bows to no rival power."
 bul_tarnovo_capital: "Develop Tarnovo"
 bul_tarnovo_capital_desc: "Tarnovo, once called the 'Second Tsarigrad' — revive the glory of the former imperial capital in this land once more."
 bul_bulgarian_patriarchate: "The Bulgarian Patriarchate"
 bul_bulgarian_patriarchate_desc: "An autocephalous church independent from Constantinople — make the authority of the Bulgarian Orthodox Church unshakeable."
 bul_boyar_council: "The Boyar Council"
 bul_boyar_council_desc: "The Boyars, nobility who have long supported Bulgaria — make use of their council as a pillar of governance."
 bul_reunite_bulgaria: "Reunite Bulgaria"
 bul_reunite_bulgaria_desc: "Bulgaria and Silistria — reunite these historic core lands under a single banner."
 bul_bulgarian_independence: "Reunification of the Empire"
 bul_bulgarian_independence_desc: "The empire has fractured into Vidin and Dobrudja — bring these lands back under a single crown, and reunify the empire centered on Tarnovo."
 bul_sofia: "The City of Holy Wisdom"
 bul_sofia_desc: "Serdica, Sredets, Triaditsa — this city has borne many names through the ages. Rename it with a title fitting for a new era."
 bul_conquer_macedonia: "Conquer Macedonia"
 bul_conquer_macedonia_desc: "Macedonia, long a center of Bulgarian culture since ancient times — reclaim this land into our domain."
 bul_conquer_serbia: "Conquer Serbia"
 bul_conquer_serbia_desc: "The neighboring lands of Serbia — subdue this rival in the contest for Balkan hegemony."
 bul_bulgarian_empire: "Bulgarian Empire"
 bul_bulgarian_empire_desc: "Bulgaria once ruled a great Empire that spanned much of the Balkans. We shall return these lands to our domain!"
 bul_conquer_wallachia: "Conquer Wallachia"
 bul_conquer_wallachia_desc: "Wallachia, on the northern bank of the Danube — establish our influence over this land."
 bul_conquer_moldavia: "Conquer Moldavia"
 bul_conquer_moldavia_desc: "Moldavia, east of the Carpathian Mountains — bring this rich land into our domain."
 bul_conquer_transylvania: "Conquer Transylvania"
 bul_conquer_transylvania_desc: "Transylvania, surrounded by mountains — make this region part of our empire."
 bul_conquer_thrace_greece: "Conquer Thrace and Northern Greece"
 bul_conquer_thrace_greece_desc: "The land of the ancient Thracians, and northern Greece — incorporate this region into our empire."
 bul_extend_the_empire: "Extend the Empire"
 bul_extend_the_empire_desc: "The borders of the Empire must be pushed even further. Let us continue our campaign into Greece and the Carpathians."
 bul_chitalishte_movement: "The Chitalishte Movement"
 bul_chitalishte_movement_desc: "The 'reading rooms' known as chitalishte — community centers of culture — let these take root across the land, nurturing literacy and national consciousness among the townsfolk. Here begins the Bulgarian National Revival."
 bul_chitalishte_unlock_tt: "The city privilege 'Town of the Chitalishte' becomes available."
 bul_ottoman_wars: "The Ottoman Wars"
 bul_ottoman_wars_desc: "The rising Ottoman Empire — face the struggle against this new threat."
 bul_varna_crusade: "The Crusade of Varna"
 bul_varna_crusade_desc: "Rise alongside Hungary, and lead a crusade against the Ottomans. In 1444, history turns at Varna."
 bul_end_ottoman_threat: "End the Ottoman Threat"
 bul_end_ottoman_threat_desc: "The once-feared Ottoman threat — put an end to it, and secure our position in the Balkans."
 bul_constantinople_ambition: "Ambition for Constantinople"
 bul_constantinople_ambition_desc: "The city that was once the center of the Orthodox world — harbor ambition for this city."
 bul_new_byzantium: "Possession of Constantinople and Rome"
 bul_new_byzantium_desc: "Constantinople, center of the Orthodox world, and Rome, seat of the Western Church — seize both cities together, and let Bulgaria rise as a new empire presiding over both halves of Christendom."
 bul_black_sea_trade: "Black Sea Trade"
 bul_black_sea_trade_desc: "Varna, the port city on the Black Sea — develop it as a foothold for Black Sea trade."
 bul_black_sea_dominion: "Dominion over the Black Sea"
 bul_black_sea_dominion_desc: "The vast coastline of the Black Sea — establish supremacy in trade across these waters."
 bul_third_bulgarian_empire: "The Third Bulgarian Empire"
 bul_third_bulgarian_empire_desc: "Independence, unification of the Balkans, the defeat of the Ottomans, and the founding of the New Byzantium — here, the Third Bulgarian Empire is complete."
 bul_events.1.t: "Declaration of Imperial Reunification"
 bul_events.1.d: "Tarnovo, Vidin, and Dobrudja, once fractured, are united once more as a single empire. The Second Bulgarian Empire finds new strength."
 bul_events.1.a: "Glory to Bulgaria!"
 bul_events.4.t: "The History of Sofia"
 bul_events.4.d: "This ancient city, called Serdica by the Romans and later Sredets by the Slavs, will now take a new name in honor of the Church of Holy Wisdom (Sophia). Thracians, Romans, Byzantines, and Bulgarians — let the weight of the many civilizations who have passed through this basin be etched into memory."
 bul_events.4.a: "Name it Sofia"
 bul_events.4.b: "Name it Sofia, and make it the new imperial capital"
 bul_events.2.t: "Declaration of the Bulgarian Empire"
 bul_events.2.d: "As ruler over Macedonia, Serbia, and Rascia, Bulgaria here declares itself an empire."
 bul_events.2.a: "Long live the Emperor!"
 bul_events.3.t: "The Dream of a New Byzantium"
 bul_events.3.d: "Within the walls of Constantinople, and upon the hills of eternal Rome alike, the banner of Bulgaria now flies. As the new center of the Orthodox world, and the seat of the Western Church, these two cities are here reborn as the twin pillars of a new empire."
 bul_events.3.a: "God is with us!"
 bul_events.99.t: "Declaration of the Third Bulgarian Empire"
 bul_events.99.d: "The long road that began in the ancient city of Tarnovo, through the unification of the Balkans, the defeat of the Ottomans, and the founding of the New Byzantium, has here reached its true completion."
 bul_events.99.a: "Long live the Third Bulgarian Empire!"
 bul_hagia_sophia_sofia: "Church of Saint Sophia"
 bul_hagia_sophia_sofia_desc: "A basilica raised in the 6th century under the reign of Emperor Justinian — its name, meaning 'Holy Wisdom,' would in time lend itself to the city that grew around it. Having endured through countless ages, this church quietly bears witness to its history as the soul of a new capital set at the heart of Bulgaria."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "The Legacy of the Second Bulgarian Empire"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Even amid the storm of infighting, the machinery of law and the scribes' craft at court barely hold together."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Independence Established"
 STATIC_MODIFIER_DESC_bul_independence_mod: "None now dare question the authority of the one who sits upon the throne of Tarnovo."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Veliko Tarnovo"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "The palaces and churches raised upon the hill of Tsarevets are reclaiming the grandeur of an imperial capital."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "The Bulgarian Patriarchate"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "The Patriarch's blessing brings peace to the hearts of the faithful, wherever they dwell."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "The Boyar Council"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "The Boyars have renewed their oath of loyalty to the throne."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Bulgaria Reunited"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Over lands once torn apart, a single banner now flies once more."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Macedonia Conquered"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "The mountains that once witnessed Samuil's glory have returned to the Tsar's domain."
 STATIC_MODIFIER_NAME_bul_serbia_mod: "Serbia Conquered"
 STATIC_MODIFIER_DESC_bul_serbia_mod: "Bulgarian banners now stand planted across the Serbian plains."
 STATIC_MODIFIER_NAME_bul_wallachia_mod: "Wallachia Conquered"
 STATIC_MODIFIER_DESC_bul_wallachia_mod: "Along the northern bank of the Danube, our will has come to carry weight."
 STATIC_MODIFIER_NAME_bul_moldavia_mod: "Moldavia Conquered"
 STATIC_MODIFIER_DESC_bul_moldavia_mod: "Wealth flows toward Tarnovo from the granaries of Moldavia."
 STATIC_MODIFIER_NAME_bul_transylvania_mod: "Transylvania Conquered"
 STATIC_MODIFIER_DESC_bul_transylvania_mod: "Beyond the passes of the Carpathians, new lands have submitted to us."
 STATIC_MODIFIER_NAME_bul_thrace_mod: "Thrace and Northern Greece Conquered"
 STATIC_MODIFIER_DESC_bul_thrace_mod: "The ancient land of Thrace once more bears the marks of war."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "The Empire Extended"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Our expanding borders make our strength known to every neighboring realm."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "The Ottoman Wars"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Countless clashes with the Turkish threat have tempered our soldiers."
 STATIC_MODIFIER_NAME_bul_varna_mod: "The Crusade of Varna"
 STATIC_MODIFIER_DESC_bul_varna_mod: "The memory of those who fell on the hills of Varna is still told to this day."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "The Ottoman Threat Ended"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "A sigh of relief passes across the Balkans as a long-feared threat departs."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Ambition for Constantinople"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "The shadow of our warships now falls across the sea lane linking the Black Sea to the Mediterranean."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Black Sea Trade"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Foreign merchant ships come and go endlessly from the harbor of Varna."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Dominion over the Black Sea"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Bulgarian merchant vessels now ply the waves of the Black Sea as if it were their own."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "The Third Bulgarian Empire"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "The light that once shone from Tarnovo now illuminates the whole of the Balkans."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Bulgarian Independence Declared"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "The fractured lands are one once more, and every nation must reckon with this revival."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "The New Byzantium"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "New voices of prayer now echo through the churches of Constantinople."
