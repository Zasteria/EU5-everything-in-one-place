 aac_aachen_megalopolis: "Aachen — Central Europe's Greatest City"
 aac_aachen_megalopolis_desc: "Charlemagne's court city Aachen is finally complete as Central Europe's greatest metropolis. With a population of 200,000, advanced urban development, and magnificent architecture, Aachen is established as the center of European civilization."
 aac_events.10.t: "Throne of Charlemagne — The Carolingian Awakening"
 aac_events.10.d: "Aachen — this city where Charlemagne (742–814) once held his court and was crowned Western Roman Emperor in 800 — has returned to Carolingian hands. Beneath the solemn dome of Aachen Cathedral, the marble throne awaits its master's return.\n\nThe dream of Charlemagne, called 'Father of Europe (Pater Europae)' — a unified Christian empire from the Rhine to the Pyrenees, from Rome to the Baltic — the time has come to realize it. Declare the Carolingian restoration and take the first step toward rebuilding the Frankish Kingdom."
 aac_events.10.a: "Reign as king of the Carolingian dynasty — declare the monarchy"
 aac_events.10.b: "The time is not yet ripe — build strength under the current system of governance"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Aachen Megalopolis"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Aachen is complete as one of Europe's greatest cities. Maximum RGO size, building levels, and population capacity greatly increased."
 aac_events.50.b: "Long live the Frankish Kingdom! The Carolingian glory is reborn — keep our traditional colors"
 aac_events.99.a: "Adopt the name and colors of the Western Roman Empire (map_ROM) — proclaim Rome's revival to the world"
 aac_events.99.b: "Declare the name Western Roman Empire — but keep our current colors"
