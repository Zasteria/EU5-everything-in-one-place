l_russian:
 aac_carolingian_legacy_mission_pack: "Carolingian Legacy — Restoration of the Frankish Kingdom"
 aac_carolingian_legacy_mission_pack_DESCRIPTION: "In 1337, Aachen is a free city within the Holy Roman Empire whose mayor is a descendant of the Carolingian dynasty. From this city, once home to Charlemagne's (742–814) court, reclaim the glory of the Frankish Kingdom. Unite the Rhine, Gaul, and Flanders, and reign as 'Emperor of the West' with papal coronation."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION: "As Aachen, unify the Rhine, Gaul, and Italy to restore the Western Roman Empire."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP: "Complete missions to restore the Frankish Kingdom."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS: "From Charlemagne's throne to the Western Roman Empire!"
 aac_throne_of_charlemagne: "Throne of Charlemagne"
 aac_throne_of_charlemagne_desc: "Aachen Cathedral — built by Charlemagne's command and site of his coronation as Western Roman Emperor in 800 — has returned to Carolingian hands. Rule Aachen, once the center of Western civilization, and take the first step toward restoring the Frankish Kingdom."
 aac_control_rhineland: "Control the Rhine"
 aac_control_rhineland_desc: "Cologne, Trier, Mainz — the three great archbishop cities along the Rhine were the economic, religious, and political center of the Frankish Kingdom. Seizing them returns the entire Rhine to Carolingian hands."
 aac_integrate_lorraine: "Integrate Lorraine"
 aac_integrate_lorraine_desc: "Lorraine (Lotharingia) was born as the middle zone when the Treaty of Verdun (843) split the Frankish Empire among Charlemagne's grandsons. Reclaiming Metz and Verdun reintegrates the core of the Frankish Empire as it existed before the split."
 aac_conquer_hre: "Master of the Holy Roman Empire"
 aac_conquer_hre_desc: "Aachen was once the site of Holy Roman Emperor coronations. By standing as master of the Empire, Charlemagne's imperial legacy is claimed most legitimately."
 aac_control_flanders: "Control Flanders"
 aac_control_flanders_desc: "Flanders is the center of Europe's greatest woolen textile industry. Seize Brussels and Liège and use Flanders's rich commercial and industrial power to restore the Frankish Kingdom."
 aac_brabant_trade: "Brabant Trade"
 aac_brabant_trade_desc: "The greatest trade network in the Low Countries spreads from the commercial city of Brussels in the Duchy of Brabant. Controlling this trade network dramatically strengthens the Frankish Kingdom's financial foundation."
 aac_push_into_france: "March on Paris"
 aac_push_into_france_desc: "Charlemagne ruled all of Gaul including Paris as King of the Franks. Reconquering Paris avenges the Valois dynasty and revives Carolingian Gallic rule."
 aac_conquer_northern_france: "Conquer Northern France"
 aac_conquer_northern_france_desc: "Reims is the coronation site of the Frankish Kingdom — carrying on the tradition of Clovis I baptized here, subjugate Normandy and Picardy to establish complete dominance of northern Gaul."
 aac_conquer_burgundy: "Conquer Burgundy"
 aac_conquer_burgundy_desc: "Burgundy played an important role in the Frankish Empire as a land rich in wine and agriculture. Subjugating it opens the road to southern France."
 aac_conquer_southern_france: "Conquer Southern France"
 aac_conquer_southern_france_desc: "Subjugate Languedoc and Gascony, and southern Gaul returns to Carolingian hands. Extending the realm to the Pyrenees realizes the complete dominance of Gaul that Charlemagne aimed for."
 aac_reunite_gaul: "Reunite Gaul"
 aac_reunite_gaul_desc: "All of Gaul — the lands once ruled by Charlemagne — unified under the Frankish Kingdom's banner. The Empire split three ways by the Treaty of Verdun is reunited for the first time in 500 years."
 aac_develop_aachen: "Develop Aachen"
 aac_develop_aachen_desc: "Develop this ancient city centered on Aachen Cathedral and make it function as the Frankish Empire's new capital. From this place where Charlemagne's legacy resides, light radiates for the reconstruction of Western Europe."
 aac_frankish_law: "Frankish Law Code"
 aac_frankish_law_desc: "Charlemagne developed the Frankish Empire's legal system through the Capitularia (decree collection). Carrying on that tradition and establishing a new Frankish Law Code sets the Empire's legal foundation."
 aac_missi_dominici: "Missi Dominici"
 aac_missi_dominici_desc: "The Missi Dominici (lord's messengers) system established by Charlemagne — royal representatives dispatched throughout the Empire to oversee local governance. Reviving this system enables centralized governance of the vast empire."
 aac_carolingian_renaissance: "Carolingian Renaissance"
 aac_carolingian_renaissance_desc: "Charlemagne promoted the 'Carolingian Renaissance' by inviting scholars like Alcuin and Einhard. Revive the Aachen court as a center of culture and learning and lead the restoration of Western civilization."
 aac_trade_empire: "Trade Empire"
 aac_trade_empire_desc: "The Frankish Empire dominating the trade routes of the Rhine, Meuse, and Scheldt becomes Western Europe's greatest trading nation. Establish commercial supremacy with multiple market centers and rich income."
 aac_frankish_levy: "Frankish Levy System"
 aac_frankish_levy_desc: "Charlemagne's Frankish army was the strongest in Europe. Revive the levy system (host system) and rebuild the Frankish Empire's military power with broad military organization from peasant soldiers to knights."
 aac_palatine_guard: "Palatine Guard"
 aac_palatine_guard_desc: "The Palatine Guard protecting the emperor's side — an elite force carrying on the tradition of Charlemagne's palace guards embodies the Frankish Empire's military glory."
 aac_carolingian_cavalry: "Carolingian Cavalry"
 aac_carolingian_cavalry_desc: "The heart of Charlemagne's military success was powerful cavalry. Rebuild the legendary mounted force that heavy armored knights (chevaliers) dominated the battlefield and defeated Saxons, Avars, and Muslims."
 aac_kingdom_of_franks: "Kingdom of the Franks Restored"
 aac_kingdom_of_franks_desc: "Gaul reunited, Lorraine integrated, Missi Dominici established — the three pillars align and the Frankish Kingdom is finally restored. For the first time since 800, the Carolingian banner flies from the Rhine to the Pyrenees."
 aac_papal_alliance: "Papal Alliance"
 aac_papal_alliance_desc: "On Christmas 800, at St. Peter's Basilica in Rome, Pope Leo III placed the Western Roman Emperor's crown on Charlemagne. Carry on that tradition, build a firm alliance with the Pope, and establish legitimacy as 'God's representative.'"
 aac_conquer_italy: "Conquer Italy"
 aac_conquer_italy_desc: "Charlemagne conquered the Lombard Kingdom in 774 and acquired the title of King of Italy. Seizing Rome completes the path to the revival of the 'Western Roman Emperor' with papal approval."
 aac_western_roman_empire: "Restoration of the Western Roman Empire"
 aac_western_roman_empire_desc: "Aachen, Paris, Rome — the three cities of the Western Roman Empire reunified under the Carolingian banner. The Empire Charlemagne built in 800 is reborn in the modern era, and 'Renovatio Imperii Romani (Restoration of the Roman Empire)' is fulfilled."
 aac_alsace_swabia: "Alsace and Swabia"
 aac_alsace_swabia_desc: "Alsace and Swabia on the eastern Rhine bank are an important part of the Frankish Empire. Seizing this land stretching from the Vosges to the Alps completes Rhine dominance."
 aac_champagne_fairs: "Champagne Fairs"
 aac_champagne_fairs_desc: "The periodic fairs (foires) of the Champagne region were Europe's greatest trading gatherings. Controlling this meeting place of Italian, Flemish, and German merchants establishes Frankish commercial supremacy."
 aac_conquer_brittany: "Conquer Brittany"
 aac_conquer_brittany_desc: "Brittany is the land of the Celtic Bretons — even Charlemagne couldn't fully subjugate this tenacious region. Conquering this western extremity brings western Gaul completely under Frankish control and secures an Atlantic outlet."
 aac_holy_crown: "The Holy Crown"
 aac_holy_crown_desc: "Deep trust with the papacy and high legitimacy — as 'Christ's vicar,' the Pope approves the Frankish king's authority. Rule recognized by both God and man is established."
 aac_dev_reims: "Develop Reims"
 aac_dev_reims_desc: "Reims is the baptismal site of the Frankish people — Clovis I received Christian baptism here, and French coronations have been held here since. Developing this sacred city further strengthens Carolingian legitimacy."
 aac_dev_paris: "Develop Paris"
 aac_dev_paris_desc: "Paris centered on the Seine island (Île de la Cité) is Gaul's greatest city. Developing it as the Frankish Empire's western capital creates a two-capital system of Aachen and Paris supporting the Frankish Empire."
 aac_bretagne_fleet: "Breton Fleet"
 aac_bretagne_fleet_desc: "The naval traditions of Brittany and Flanders combine so the Frankish Empire now has a powerful navy controlling both the Atlantic and the North Sea."
 aac_events.20.t: "Paris Falls — Return of the Carolingians"
 aac_events.20.d: "The Valois banner is pulled from Paris's walls, replaced by the Frankish Kingdom's eagle. As Notre-Dame's bells ring out, the Carolingian mayor's descendant enters Paris. 'The heir of Charlemagne has returned' — so historians will write."
 aac_events.20.a: "Long live Paris! Raise the Carolingian banner high!"
 aac_events.40.t: "Gaul Reunited — The Return of the Frankish King"
 aac_events.40.d: "From the Rhine to the Pyrenees, from Flanders to Provence — all of Gaul unified under the Frankish Kingdom's banner. The Empire split three ways by the Treaty of Verdun in 843 is reunited after 500 years. 'Dieu le veut (God wills it)' — the people gathered in the cathedral cry out."
 aac_events.40.a: "Long live Gaul! The Frankish Kingdom is eternal!"
 aac_events.50.t: "Declaration of the Frankish Kingdom's Restoration"
 aac_events.50.d: "Gaul reunited, Lorraine integrated, Missi Dominici established — the three pillars of the Frankish Kingdom are complete. A Frankish king's coronation is held at Aachen Cathedral, and for the first time since Charlemagne, a Frankish Emperor is born. 'In the name of Carolus Magnus Rex Francorum (Charlemagne, King of the Franks), we declare the Empire.'"
 aac_events.50.a: "Long live the Frankish Kingdom! The Carolingian glory is reborn — dye our colors in the blue of France!"
 aac_events.99.t: "Restoration of the Western Roman Empire"
 aac_events.99.d: "Aachen, Paris, Rome — three cities reunified under the Carolingian banner. The legendary moment when Pope Leo III placed the crown on Charlemagne on Christmas 800 is recreated in the modern era. 'Renovatio Imperii Romani' — these words are engraved in history forever. Will you change the Empire's color to the Carolingian crimson?"
 aac_events.99.a: "Raise the crimson banner — dye Rome with Carolingian colors (map_ROM)"
 aac_events.99.b: "Keep the traditional colors — imperial dignity lies in power, not color"
