 mlo_events.1.t: "The Legend of the Biscione"
 mlo_events.1.d: "The Visconti coat of arms bears a single serpent devouring a man — the biscione. Some say it commemorates a deed of valor in the Crusades; others claim it symbolizes a conquered infidel. Whatever the truth, the emblem proclaims throughout northern Italy that the family's power, and the city-state of Milan itself, are no longer the affairs of a mere local lord. Before the Duke now lie many paths: the path of the statesman, the path of the conqueror, and the path of the diplomat who walks between great powers."
 mlo_events.1.a: "A new age has come to Milan"
 mlo_events.2.t: "Milan in 1337"
 mlo_events.2.d: "As of 1337, Milan stands under the joint rule of Luchino Visconti and his brother, Archbishop Giovanni Visconti. In the time of their predecessor Azzone, the title of Imperial Vicar was granted by Holy Roman Emperor Louis IV, lending the authority of the Empire to Milan's rule. Across northern Italy, powerful lords hold sway and vie with one another — the della Scala of Verona, the Gonzaga of Mantua, the Este of Ferrara, and more. With the Pope seated in Avignon and the Emperor's strength concentrated north of the Alps, it will be whoever seizes supremacy over Lombardy who decides the fate of northern Italy."
 mlo_events.2.a: "The foundations of Milan are understood"
 mlo_events.3.t: "The History of Castello Sforzesco"
 mlo_events.3.d: "Milan's castle began as a fortress built by the Visconti, known as the Corte dell'Arengo. When the ducal line ended with the death of Filippo Maria Visconti in 1447, the citizens proclaimed the Ambrosian Republic and tore down much of the castle, a symbol of the old rulers they had cast off. Yet in 1450, Francesco Sforza, who brought the chaos of the republic to an end and assumed the ducal title, ordered the fortress rebuilt anew, grander than before, to proclaim his own authority. Ever since, Castello Sforzesco has stood as the seat of ducal power in Milan, its splendor undimmed."
 mlo_events.3.a: "The weight of this history is understood"
