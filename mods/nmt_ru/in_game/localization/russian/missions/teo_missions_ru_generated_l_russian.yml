l_russian:
 teo_theodoro_mission_pack: "Княжество Феодоро: возрождение Готии и господство на Чёрном море"
 teo_theodoro_mission_pack_DESCRIPTION: "В 1337 году княжество Феодоро держится за горную крепость Мангуп в Крыму. Это греческое княжество, когда-то часть Византийской империи, окружено татарами, генуэзцами и поднимающимися османами. Обратите торговое чутьё и воинскую хватку рода Гаврасов на то, чтобы взять черноморскую торговлю, возродить имя Готии, вернуть Константинополь и править восточным Средиземноморьем как Готская империя."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION: "Возьмите верх на Чёрном море, изгоните генуэзцев, верните Константинополь и правьте восточным Средиземноморьем, Чёрным морем и степью как Готская империя."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP: "Править восточным Средиземноморьем как Готская империя."
 teo_theodoro_mission_pack_BUTTON_DETAILS: "Из горной крепости Мангуп постройте Готскую империю черноморской торговлей, византийским наследием и завоеванием степи!"
 teo_rise_of_theodoro: "Возвышение Феодоро"
 teo_rise_of_theodoro_desc: "Из горной крепости Мангуп княжество Феодоро начинает свой подъём. В окружении татар, генуэзцев и османов чутьё рода Гаврасов обратит беду в удачу."
 teo_black_sea_fleet: "Черноморский флот"
 teo_black_sea_fleet_desc: "За Чёрное море спорят Генуя, Венеция, татары и османы. Постройте флот и утвердите на этих важнейших водах силу Феодоро."
 teo_build_theodoro_harbor: "Гавань Феодоро"
 teo_build_theodoro_harbor_desc: "Разверните гавань Феодоро у подножия Мангупа и сделайте княжество черноморской морской державой."
 teo_genoese_question: "Генуэзский вопрос"
 teo_genoese_question_desc: "Генуэзская колония Газария правит черноморской торговлей из Кафы. Выкупите Газарию в вассалы — или сберегите казну."
 teo_expel_genoese: "Изгнать генуэзцев"
 teo_expel_genoese_desc: "Выбейте генуэзцев из Крыма и заберите их колонии, утвердив первенство Феодоро."
 teo_dominate_crimea: "Подчинить Крым"
 teo_dominate_crimea_desc: "Изгоните из Крыма всех соперников и правьте им единовластно."
 teo_tana_trade: "Торговля Таны"
 teo_tana_trade_desc: "Возьмите торговый узел Тана в устье Дона и держите в руках восточные торговые пути."
 teo_black_sea_domination: "Господство на Чёрном море"
 teo_black_sea_domination_desc: "Утвердите полное господство на Чёрном море, чтобы первенство Феодоро некому было оспорить."
 teo_greek_heritage: "Греческое наследие"
 teo_greek_heritage_desc: "Укрепите православную веру и византийское культурное наследие, на которых стоит законность Феодоро."
 teo_trebizond_relations: "Отношения с Трапезундом"
 teo_trebizond_relations_desc: "Определите отношения с Трапезундской империей Комнинов — предложите вассалитет или сохраните союз."
 teo_restore_pontus: "Возродить Понт"
 teo_restore_pontus_desc: "Завоюйте понтийское побережье и восстановите древнее царство Понт."
 teo_constantinople: "Вернуть Константинополь"
 teo_constantinople_desc: "Отвоюйте у османов Второй Рим и верните православный крест над Святой Софией."
 teo_gothia_ascendant: "Готия восходит"
 teo_gothia_ascendant_desc: "Провозгласите возрождение Готии и добейтесь признания законным преемником Византии."
 teo_aegean_supremacy: "Первенство в Эгеиде"
 teo_aegean_supremacy_desc: "Возьмите острова и побережье Эгейского моря и вынесите морскую силу Феодоро в Средиземноморье."
 teo_balkans: "Завоевать Балканы"
 teo_balkans_desc: "Завоюйте Балканы, сердцевину прежней Византийской империи, и скрепите Готскую империю."
 teo_azov_gateway: "Ворота в Азовское море"
 teo_azov_gateway_desc: "Возьмите под руку Азовское море и откройте внутренние торговые пути по Дону и Волге."
 teo_pryazovia: "Приазовье"
 teo_pryazovia_desc: "Закрепите Приазовье к северу от Азовского моря и откройте дорогу в степь."
 teo_tatar_wars: "Войны с татарами"
 teo_tatar_wars_desc: "Бейтесь с крымскими татарами и выкуйте из конницы Феодоро отборных степных воинов."
 teo_into_steppes: "В степи"
 teo_into_steppes_desc: "Завоюйте бескрайнюю Причерноморскую степь и превратите Феодоро в материковую державу."
 teo_caucasus_gateway: "Ворота на Кавказ"
 teo_caucasus_gateway_desc: "Продвиньтесь в кавказские горы Грузии, Армении и Азербайджана."
 teo_caspian_reach: "Выйти к Каспию"
 teo_caspian_reach_desc: "Выйдите к Каспийскому морю и получите доступ к персидским и среднеазиатским торговым путям."
 teo_russian_question: "Русский вопрос"
 teo_russian_question_desc: "Определите отношения с Москвой и Новгородом — заключите союз или ищите завоевания."
 teo_russian_claim: "Притязание на Русь"
 teo_russian_claim_desc: "Распространите влияние Феодоро на русские княжества."
 teo_ruthenia_conquest: "Завоевание Рутении"
 teo_ruthenia_conquest_desc: "Завоюйте Рутению вместе с Киевом и примите на себя мантию и Византии, и Руси."
 teo_dev_theodoro: "Развить Феодоро"
 teo_dev_theodoro_desc: "Разверните крепость-город Феодоро в достойную столицу Готской империи."
 teo_trade_empire: "Торговая держава"
 teo_trade_empire_desc: "Постройте торговую державу на перекрёстке Чёрного моря, Средиземноморья и Шёлкового пути."
 teo_silk_road: "Торговля Шёлкового пути"
 teo_silk_road_desc: "Держите в руках Шёлковый путь и заберите себе поток шёлка из Средней Азии на западные рынки."
 teo_spice_trade: "Торговля пряностями"
 teo_spice_trade_desc: "Возьмите под себя торговлю пряностями, идущую через порты Феодоро, и правьте черноморским торгом."
 teo_gothic_culture: "Готская культура"
 teo_gothic_culture_desc: "Взрастите особую готскую культуру, сплавленную из греческого, готского и татарского наследия."
 teo_orthodox_fortress: "Православная твердыня"
 teo_orthodox_fortress_desc: "Постройте сеть православных монастырей и воинских крепостей на защиту веры."
 teo_multiethnic_state: "Многоязыкая держава"
 teo_multiethnic_state_desc: "Постройте многоязыкую империю, принявшую под власть Феодоро понтийских греков, готов, татар и армян."
 teo_great_theodoro: "Великое Феодоро"
 teo_great_theodoro_desc: "Обратите Мангуп в вечную столицу Готской империи, светоч просвещения."
 teo_crimean_wine: "Крымское вино"
 teo_crimean_wine_desc: "Возродите древнее греческое виноделие Крыма и поставляйте вино на средиземноморские рынки."
 teo_fortress_mangup: "Крепость Мангуп"
 teo_fortress_mangup_desc: "Укрепите Мангуп — природную крепость на плато, которую и османам взять было непросто."
 teo_anatolian_coast: "Анатолийский берег"
 teo_anatolian_coast_desc: "Завоюйте южный, анатолийский берег Чёрного моря и сделайте это море озером Феодоро."
 teo_orthodox_patriarch: "Православный патриархат"
 teo_orthodox_patriarch_desc: "Учредите патриархат в Константинополе и сделайте Феодоро защитником всех православных."
 teo_merchant_republic: "Торговая республика"
 teo_merchant_republic_desc: "Постройте величайшую торговую державу Средиземноморья торгом и оружием."
 teo_dev_trebizond_city: "Развить Трапезунд"
 teo_dev_trebizond_city_desc: "Разверните Трапезунд в крупный торговый узел южного берега Чёрного моря."
 teo_gavras_triumphant: "Торжество Гаврасов"
 teo_gavras_triumphant_desc: "Торговое чутьё и воинская отвага рода Гаврасов создали великую империю из горной крепости."
 teo_gothia_empire: "Готская империя"
 teo_gothia_empire_desc: "Правьте как император Готии — владыка Чёрного моря, Средиземноморья и степи."
 teo_events.1.t: "Феодоро поднимается — греческий обычай или готская гордость?"
 teo_events.1.d: "В 1337 году с крепости на плато Мангуп княжество Феодоро начинает свой подъём. В окружении татар, генуэзцев и османов торговое чутьё и воинская отвага рода Гаврасов обратят эту беду в удачу. Возьмите черноморскую торговлю, возродите Готию и верните Константинополь."
 teo_events.1.a: "Хранить понтийский греческий обычай — мы наследники Византии"
 teo_events.5.t: "Генуэзский вопрос — переговоры или война?"
 teo_events.5.d: "Генуя правит черноморской торговлей из Кафы. Чтобы стать настоящим владыкой Чёрного моря, Феодоро должно решить генуэзский вопрос. Искать мирного соседства через переговоры или сокрушить генуэзские колонии силой?"
 teo_events.5.a: "Ужиться с Генуей миром"
 teo_events.5.b: "Изгнать Геную силой — Чёрное море принадлежит Феодоро!"
 teo_events.10.t: "Воссоединение с Трапезундом — связь Комнинов"
 teo_events.10.d: "Трапезундская империя Комнинов слабеет под напором османов. Как единоплеменным грекам, помочь ли нам Трапезунду или вобрать его в Готию?"
 teo_events.10.a: "Сделать Трапезунд вассалом — сохранить понтийское наследие под Готией"
 teo_events.20.t: "Константинополь возвращён — венчание готского государя"
 teo_events.20.d: "Константинополь в руках Готии! Отвоевание православного святого города у османов означает, что Россия становится духовным главой православного мира как «Третий Рим». Над Святой Софией вновь реет христианский крест."
 teo_events.20.a: "Да здравствует государь готов! Да здравствует Константинополь!"
 teo_events.30.t: "Русский вопрос — союз или завоевание?"
 teo_events.30.d: "Род Гаврасов связан давними узами с русскими знатными домами. Как определить наши отношения с Москвой и Новгородом — заключить союз ради общей выгоды или подчинить Русь власти Готии?"
 teo_events.30.a: "Союз с Русью — сотрудничать как православные братья"
 teo_events.30.b: "Идти на завоевание Руси — Готия станет истинным владыкой Руси"
 teo_events.60.t: "Торжество Гаврасов — рождение Готской империи"
 teo_events.60.d: "Господство на Чёрном море, возвращённый Константинополь, покорённые степи — род Гаврасов правит теперь восточным Средиземноморьем как «император Готской империи». Путь от горной крепости Мангуп завершается основанием мировой державы."
 teo_events.60.a: "Да здравствует Готская империя! Да здравствует род Гаврасов!"
 teo_events.99.t: "Готская империя — вечная слава"
 teo_events.99.d: "«Император Готии — владыка Чёрного моря, Средиземноморья и степи» — эта империя на перекрёстке восточной и западной цивилизаций стоит выше всех. Чудесная история, начавшаяся в 1337 году с малой крепости Мангуп, приходит к завершению."
 teo_events.99.a: "Да здравствует Готская империя! Да здравствует вечная слава!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "Черноморский флот"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "Черноморский флот Феодоро утверждает первенство на важнейших торговых водах."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "Гавань Феодоро"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "Гавань у подножия Мангупа служит воротами морской силы Феодоро."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Крымская торговля"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "Крымские торговые пути закреплены за Феодоро."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Крым подчинён"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "Все соперники изгнаны из Крыма — Феодоро правит им единовластно."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Торговый узел Тана"
 STATIC_MODIFIER_DESC_teo_tana_mod: "Торговый узел Тана в устье Дона в наших руках, и восточный торг открыт."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Владыка Чёрного моря"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Полное господство на Чёрном море — оспорить первенство Феодоро не смеет никто."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "Греческое наследие"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "Православная вера и византийское наследие укреплены как основание Феодоро."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Понт возрождён"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "Понтийское побережье закреплено, и открыт путь к господству на Чёрном море."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "Готия восходит"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "Готская империя провозглашена — возрождение Готии признано миром."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Первенство в Эгеиде"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "Морская сила в Эгейском море выносит влияние Феодоро в Средиземноморье."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Балканы завоёваны"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "Балканы завоёваны — Готская империя раскинулась по сердцевине прежней Византии."
 STATIC_MODIFIER_NAME_teo_azov_mod: "Ворота в Азовское море"
 STATIC_MODIFIER_DESC_teo_azov_mod: "Ворота Азовского моря открывают внутренние торговые пути по Дону и Волге."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Приазовье закреплено"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "Северный берег Азовского моря закреплён, и открыта дорога в степь."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Борьба с татарами"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "Бои с крымскими татарами выковали из конницы Феодоро отборных степных воинов."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Владыка степи"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "Бескрайняя Причерноморская степь под властью Феодоро — рождается материковая держава."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Кавказский поход"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "Кавказские ворота открывают доступ к персидской и среднеазиатской торговле."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Выход к Каспию"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "Каспийское море достигнуто — персидские и среднеазиатские торговые пути открыты."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Притязание на Русь"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Влияние Феодоро простирается на русские княжества."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Рутения завоёвана"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "Рутения вместе с Киевом завоёвана — мантия Византии и Руси принята."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Феодоро развито"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "Крепость-город Феодоро развёрнут в достойную столицу Готской империи."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "Торговая держава"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "На перекрёстке цивилизаций выстроена великая торговая держава."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Торговля Шёлкового пути"
 STATIC_MODIFIER_DESC_teo_silk_mod: "Шёлковый путь в наших руках — шёлк идёт на западные рынки через Феодоро."
 STATIC_MODIFIER_NAME_teo_spice_mod: "Торговля пряностями"
 STATIC_MODIFIER_DESC_teo_spice_mod: "Торговля пряностями через порты Феодоро правит черноморским торгом."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "Готская культура"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "Рождается особая готская культура, сплавленная из греческого, готского и татарского наследия."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Православная твердыня"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Православные монастыри и воинские крепости хранят равно веру и рубеж."
 STATIC_MODIFIER_NAME_teo_multiethnic_mod: "Многоязыкая держава"
 STATIC_MODIFIER_DESC_teo_multiethnic_mod: "Выстроена многоязыкая империя, принявшая понтийских греков, готов, татар и армян."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "Великое Феодоро"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Мангуп обращён в вечную столицу Готской империи."
 STATIC_MODIFIER_NAME_teo_wine_mod: "Крымское вино"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Крымские виноградники возрождены — добрые вина идут на средиземноморские рынки."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "Крепость Мангуп"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "Крепость Мангуп укреплена сверх всякого приступа — вечный престол Готской империи."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Анатолийский берег закреплён"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "Южный, анатолийский берег Чёрного моря завоёван — море стало озером Феодоро."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "Православный патриархат"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "Патриархат в Константинополе делает Феодоро защитником всех православных."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "Торговая республика"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "Обширная торговая сеть охватывает Средиземноморье, Чёрное море и Шёлковый путь."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "Город Трапезунд"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Трапезунд развёрнут в крупный торговый узел южного берега Чёрного моря."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Владычество Готской империи"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "Замысел династии Гаврасов исполнен — Готская империя правит морем и степью."
 teo_events.1.b: "Возродить готскую гордость — мы истинные преемники Готии"
 teo_events.5.t: "Газария — выкупить или отказаться?"
 teo_events.5.d: "Генуэзская республика управляет своей крымской торговой колонией «Газария (GAZ)». За 300 дукатов Генуя предлагает передать Газарию Феодоро в вассалы.\n\nЭто случай мирно установить власть над Крымом — но 300 дукатов цена немалая. Выкупите ли вы её?"
 teo_events.5.a: "Заплатить 300 дукатов за Газарию — Крым будет наш"
 teo_events.5.b: "Отказаться — пока сберечь казну"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "Тяготы перехода к готству"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Сто лет понтийские греки привыкают к готской культуре — ассимиляция групп населения резко замедляется, а угроза мятежа растёт. Зато за завершение Готской империи ждёт большая награда."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "Истинный преемник Готии"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "Готская империя завершена с сохранением готской культуры — дух древних готов возрождён и принёс Готской империи вечную славу."
 teo_events.10.b: "Сохранить союз — уважить гордость Комнинов"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Союз с Русью"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "Дружеский союз с русскими княжествами поднял дипломатический вес Готии."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "Воля к завоеванию Руси"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "Воля Готии завоевать Русь сдерживает получаемую неприязнь."
 teo_events.99.b: "Завершить империю готской гордостью — открыть право на вторжение в Германию"
 cb_gothic_invasion: "Готское вторжение"
 cb_gothic_invasion_desc: "Особый повод для войны против стран немецкой культурной группы — издержки завоевания и неприязнь снижены на 80%. Открывается только для основной готской культуры после завершения последнего задания Готской империи."
