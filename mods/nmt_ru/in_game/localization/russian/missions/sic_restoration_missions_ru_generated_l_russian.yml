l_russian:
 sic_restoration_mission_pack: "The Path of the Kingdom of Sicily"
 sic_restoration_mission_pack_DESCRIPTION: "Severed from Naples by the uprising of 1282, the Kingdom of Sicily now stands ready to gather the strength of this island at the heart of the Mediterranean and once more carve its name into history. Will you cross the strait and become one with Naples once again, or forge the island itself into a land of gold? The choice is yours, O King."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION: "Complete missions as the Kingdom of Sicily, working toward the restoration of the Two Sicilies or a golden age for the island of Sicily."
 sic_restoration_mission_pack_BUTTON_TOOLTIP: "Complete missions to walk the path of the Kingdom of Sicily."
 sic_restoration_mission_pack_BUTTON_DETAILS: "Conquer Naples across the strait and forge the Kingdom of the Two Sicilies, or polish the island of Sicily itself into a jewel of the Mediterranean. Down either path lies the prosperity of a new kingdom!"
 sic_divided_kingdom: "Across the Strait"
 sic_divided_kingdom_desc: "In 1282, in the uprising known as the Sicilian Vespers, we overthrew the rule of the House of Anjou. Unable to bear the tyranny of the French officials any longer, the people of the island rose as one at the sound of the evening bells and drove the French from our shores. We welcomed Peter III of Aragon as our new king, and the Kingdom of Sicily was thus split in two. Across the strait, on the mainland centered on Naples, a king of the House of Anjou still styles himself \"King of Sicily.\" We alone are the rightful kings of this island. The rivalry between our two realms continues to this day."
 sic_divided_kingdom_tooltip: "You have designated Naples (NAP) as a rival, or are allied with Naples."
 sic_ambitions_on_naples: "Ambitions on Naples"
 sic_ambitions_on_naples_desc: "The Angevin king across the strait stands, by right, as a rival claimant to the very title of King of Sicily. The time has come to build up our standing army and raise the just cause of one day claiming the crown of Naples for ourselves."
 sic_ambitions_on_naples_tooltip: "Regular army size 2,000+."
 sic_army_of_the_island: "Fleet of the Island"
 sic_army_of_the_island_desc: "The island of Sicily is a fortress surrounded on all sides by the sea. To send our armies across the strait to Naples, we must first build a powerful fleet, securing both the island's defense and the safe passage of our troops."
 sic_army_of_the_island_tooltip: "Navy size 10+."
 sic_conquest_of_naples: "The Conquest of Naples"
 sic_conquest_of_naples_desc: "At last our forces have crossed the strait and landed on the shores of Naples. If we can break the Angevin army and seize the crown of Naples, the kingdom torn in two in 1282 shall be made whole once more, under our rule."
 sic_conquest_of_naples_tooltip: "Own naples."
 sic_two_sicilies: "The Two Sicilies"
 sic_two_sicilies_desc: "Naples and Palermo, two crowns, now rest in our hands. The time has come to proclaim the founding of a new kingdom spanning both shores of the strait — the Kingdom of the Two Sicilies. This is the historic deed that brings the division of 1282 to its end."
 sic_two_sicilies_tooltip: "Own both naples and palermo."
 sic_golden_wheat_fields: "Golden Wheat Fields"
 sic_golden_wheat_fields_desc: "Since ancient times, the island of Sicily has been called the granary of the Mediterranean. By developing the fertile plains around Palermo, its abundant harvests will nourish the whole kingdom, with the surplus grain carried abroad as a valuable trade good."
 sic_golden_wheat_fields_tooltip: "palermo has RGO level 5+."
 sic_palermo_resurgent: "Palermo Resurgent"
 sic_palermo_resurgent_desc: "In the days of the Norman kingdom, Palermo was a city of unrivaled splendor in the Mediterranean. Raising new buildings here once more, and reclaiming something of that old brilliance, will be the first step toward the development of the whole island."
 sic_palermo_resurgent_tooltip: "Total building levels in palermo are 30+."
 sic_mediterranean_crossroads: "Crossroads of Mediterranean Trade"
 sic_mediterranean_crossroads_desc: "The island of Sicily sits at the very crossroads of the Mediterranean, where the trade routes of East and West meet. By establishing markets in the island's ports, merchants from every land will gather here, greatly increasing the kingdom's trade income."
 sic_mediterranean_crossroads_tooltip: "Own 1+ market center locations."
 sic_sicilian_renaissance: "The Sicilian Renaissance"
 sic_sicilian_renaissance_desc: "The Sicilian court, where Norman, Arab, Byzantine, and Latin cultures meet, has long been a center of art and learning. The many works of art gathered in Palermo hint at the dawn of a new cultural flowering."
 sic_sicilian_renaissance_tooltip: "palermo contains 20+ works of art."
 sic_kingdom_resurgent: "The Kingdom Resurgent"
 sic_kingdom_resurgent_desc: "Whether as a kingdom spanning both shores of the strait, or as an island shining with culture and trade at the heart of the Mediterranean, Sicily has once more carved its name into history. From here, this kingdom's path shall mark the dawn of a new age."
 sic_kingdom_resurgent_tooltip: "100+ total locations."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "Fleet of the Island"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "The reorganized fleet of the island boasts high morale and ample reserves of manpower."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "The Conquest of Naples"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Having fought through the campaign in Naples, the royal army's discipline has grown, and our hand in the negotiations of war is stronger."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "The Two Sicilies"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "The prestige and legitimacy of the new kingdom spanning both shores of the strait have never been higher."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Golden Wheat Fields"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "The fertile soil of Sicily has greatly raised food production across the kingdom."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Palermo Resurgent"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "The resurgence of Palermo has greatly spurred the growth and productivity of this land."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Crossroads of Mediterranean Trade"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "The markets established across the island have greatly increased the kingdom's trade income and the reach of its merchants."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "The Sicilian Renaissance"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "The culture that has flourished in Palermo has raised the skill of new artists entering the kingdom's service."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "The Kingdom Resurgent"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "The splendor of the resurgent kingdom has raised its prestige and legitimacy, and strengthened its hand in the negotiations of war as never before."
 sic_events.1.t: "A Kingdom Divided in Two"
 sic_events.1.d: "In 1282, we rose up against the rule of the House of Anjou. No longer able to bear the tyranny of officials sent from France, the people of the island rose as one at the sound of the evening bells and drove the French from our shores. We welcomed Peter III of Aragon as our new king, and the Kingdom of Sicily was thus split in two. Across the strait, on the mainland centered on Naples, a king of the House of Anjou still styles himself \"King of Sicily.\" We alone are the true kings of this island. The rivalry between our two realms continues to this day."
 sic_events.1.a: "Understood"
