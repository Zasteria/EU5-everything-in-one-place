 STATIC_MODIFIER_DESC_nov_ruler_of_rus_final_mod: "The merchant republic Novgorod built one of the world's greatest empires governing all Russia."
 nov_events.1.t: "Veliky Novgorod — The Great Republic"
 nov_events.1.d: "In 1337, the Republic of Veliky Novgorod (Great Novgorod) is Russia's greatest commercial city-state.\n\nThis city spreading across both banks of the Volkhov River is divided into the 'Sofia Side' on the west bank and the 'Trade Side' on the east bank. At its center rises Novgorod's landmark, the Cathedral of Saint Sophia.\n\nThe Veche (popular assembly) functions as the supreme decision-making body, with the Posadnik (mayor), Tysyatsky (commander of the militia), and Archbishop handling administration.\n\n'Novgorod belongs to Novgorod alone' — not a prince or emperor, but the will of the citizens drives this republic.\n\nThe Hanseatic League's kontor (trading post) is established here, with trade flourishing with Lübeck, Bruges, London, and Bergen. Furs, beeswax, flax, and fish are supplied to western Europe through Novgorod.\n\nBut Moscow steadily grows stronger, Lithuania presses from the west, and the Tatars lurk to the east. Novgorod has survived by exploiting this complex balance of power. Now use that wisdom and commercial strength to aim for mastery of the Rus."
 nov_events.1.a: "Defend Novgorod's freedom and prosperity!"
