l_russian:
 nov_novgorod_mission_pack: "Glory of Novgorod — From Merchant Republic to Ruler of the Rus"
 nov_novgorod_mission_pack_DESCRIPTION: "In 1337, the Republic of Veliky Novgorod is Russia's greatest commercial state. The Veche (popular assembly) drives politics, and trade with the Hanseatic League brings wealth. But Moscow grows steadily stronger, and the Tatar threat looms from the east. Fur trade, Baltic domination, defeat of Muscovy — reign as the Grand Prince of all the Rus."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION: "Build a trade empire, defeat Muscovy to unify Russia, dominate the Baltic and Siberia, and reign as the Grand Prince of the Rus."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP: "Complete missions to become Grand Prince of the Rus."
 nov_novgorod_mission_pack_BUTTON_DETAILS: "From Novgorod's merchant republic to the foundation of the Russian Empire!"
 nov_veche_republic: "The Veche Republic"
 nov_veche_republic_desc: "The Veche of Novgorod is a unique democratic institution where citizens, nobles, and merchants all participate. 'Novgorod belongs to Novgorod alone' — it is the will of the citizens, not a prince, that drives this state, distinguishing it from all other Russian principalities. Strengthen the Veche tradition and solidify the foundation of the merchant republic."
 nov_dev_novgorod: "Develop Great Novgorod"
 nov_dev_novgorod_desc: "'Veliky Novgorod (Great Novgorod)' on the Volkhov River is medieval Russia's greatest commercial city. Hanseatic, Byzantine, and Eastern Muslim merchants converge here, trading furs, beeswax, flax, and fish. The Novgorod 'kontor' (trading post) operates in Lübeck, Bruges, London, and Bergen."
 nov_birch_bark: "Birch Bark Manuscripts"
 nov_birch_bark_desc: "Novgorodians had the custom of writing on birch bark — evidence of the most literate medieval city in the world. Leverage this tradition of literacy to develop academic, administrative, and trade records."
 nov_hanseatic_league: "Hanseatic Trade"
 nov_hanseatic_league_desc: "Novgorod is deeply integrated into the Hanseatic League network as one of northern Europe's greatest trading cities. Strengthen trade routes connecting to Lübeck, Hamburg, and Bruges."
 nov_fur_trade: "The Fur Trade"
 nov_fur_trade_desc: "Novgorod's greatest trade commodity is fur — squirrel, sable, beaver, and mink furs extracted from Siberian forests are sold to western European nobility. The fur trade, called 'the gold of the north,' is Novgorod's source of wealth."
 nov_dev_pskov: "Develop Pskov"
 nov_dev_pskov_desc: "The fiercely independent Pskov — Novgorod's 'younger brother' city becomes the commercial and cultural sub-capital. Develop this city possessing Pskov Kremlin's walls and Trinity Cathedral."
 nov_trade_empire: "Trade Empire"
 nov_trade_empire_desc: "Furs, beeswax, salt, fish — Novgorod's trade network covers northern Europe. Merchant guilds run the state and trading posts are established everywhere. The fame of 'the Venice of the North' spreads worldwide."
 nov_merchant_republic: "The Merchant Republic Complete"
 nov_merchant_republic_desc: "The balance of Veche, merchant guilds, and Archbishop is perfected — Novgorod's unique merchant republic system complete. This distinctive polity shows a different Russian future from Moscow."
 nov_dev_staraya_russa: "Develop Staraya Russa"
 nov_dev_staraya_russa_desc: "Staraya Russa, bearing the name 'Old Rus,' is famous as a salt production center. Develop this ancient city's salt industry to contribute to Novgorod's food preservation and trade."
 nov_secure_novgorod_region: "Secure the Novgorod Region"
 nov_secure_novgorod_region_desc: "Novgorod's home territory — fully controlling both West and East Novgorod areas establishes the foundation for expansion."
 nov_conquer_tver: "Conquer Tver"
 nov_conquer_tver_desc: "The Principality of Tver, once Muscovy's rival for supremacy — its strength has now waned. Conquer this important city on the upper Volga and open the route south."
 nov_conquer_yaroslavl: "Conquer Yaroslavl"
 nov_conquer_yaroslavl_desc: "Yaroslavl, a 'Golden Ring' city on the Volga — conquer this trading city and seize the northern trade route."
 nov_conquer_moscow: "Conquer Moscow"
 nov_conquer_moscow_desc: "Since Ivan I (Kalita), Moscow has steadily expanded with Tatar support. 'Moscow or war' — defeat Novgorod's greatest threat and seize leadership of Russia."
 nov_conquer_suzdal: "Conquer Suzdal and Vladimir"
 nov_conquer_suzdal_desc: "Suzdal and Vladimir — ancient cities that once flourished as Kiev-Rus successors. Conquer these cities possessing many golden-domed churches and inherit Old Rus legitimacy."
 nov_defeat_muscovy: "Defeat Muscovy"
 nov_defeat_muscovy_desc: "The Grand Duchy of Moscow is destroyed and leadership of Russia passes to Novgorod. The ambitions of the Rurikid dynasty are crushed — the Veche Republic will decide Russia's future."
 nov_conquer_smolensk: "Conquer Smolensk"
 nov_conquer_smolensk_desc: "Smolensk, called 'the key of Russia' — controlling this east-west transportation hub establishes western influence."
 nov_conquer_ryazan: "Conquer Ryazan"
 nov_conquer_ryazan_desc: "The Ryazan principality, first devastated by the Mongol army in 1237 — conquer its southern steppe lands and build a defense line against the Tatars."
 nov_form_russia: "Form the Rus"
 nov_form_russia_desc: "A unified Rus state centered on Novgorod takes form — not Moscow but Novgorod unified Russia. What shape will this new Russia, born from this historical turning point, take?"
 nov_vologda_trade: "Vologda Trade"
 nov_vologda_trade_desc: "Controlling Vologda and Beloozero — key points of the northern trade route — establishes White Sea access and the fur trade route."
 nov_found_arkhangelsk: "Found Arkhangelsk"
 nov_found_arkhangelsk_desc: "Build the port town of Arkhangelsk on the White Sea coast — though it freezes in winter, this port enables direct trade with northern Europe and Britain. In future ages, English merchants will enter Russia through here."
 nov_white_sea_trade: "White Sea Trade Domination"
 nov_white_sea_trade_desc: "Dominate the White Sea trade route and establish direct trade with northern Europe. Arkhangelsk develops as the center of northern trade."
 nov_conquer_perm: "Conquer Perm"
 nov_conquer_perm_desc: "The Perm region on the upper Kama River — producer of 'Kama furs,' the finest quality pelts. Conquering here establishes the fur trade monopoly."
 nov_kola_fortress: "The Kola Fortress"
 nov_kola_fortress_desc: "The northernmost tip of the Kola Peninsula — seize the ice-free port of Murmansk Bay and establish a northern sea route base."
 nov_siberian_frontier: "The Siberian Frontier"
 nov_siberian_frontier_desc: "Cross the Ural Mountains into Siberia — the road to 'beyond the land' with unlimited fur resources is open. Advance into Siberia ahead of Yermak's conquest."
 nov_fur_monopoly: "Fur Trade Monopoly"
 nov_fur_monopoly_desc: "From Perm to Siberia — all fur trade routes fall under Novgorod's control. Monopolize the supply of luxury furs sought by European royalty and nobility to gain enormous wealth."
 nov_secure_karelia: "Secure Karelia"
 nov_secure_karelia_desc: "Seize the Karelia region on the northern shore of the Gulf of Finland to secure Baltic Sea access — an important strategic point establishing the border with Sweden."
 nov_conquer_viborg: "Conquer Viborg"
 nov_conquer_viborg_desc: "The Viborg fortress built by Sweden — storming this key point in the Gulf of Finland opens the door to the Baltic."
 nov_baltic_fleet: "Baltic Fleet"
 nov_baltic_fleet_desc: "Build Novgorod's Baltic fleet — naval power is essential to dominate northern European commerce."
 nov_conquer_riga: "Conquer Riga"
 nov_conquer_riga_desc: "Riga at the mouth of the Dvina River — conquering this important Hanseatic League city seizes leadership of Baltic trade. With the spirit of 'Danzig or war,' take Riga too."
 nov_livonia: "Subdue Livonia"
 nov_livonia_desc: "The Baltic eastern coast dominated by the Livonian Order — subduing this region establishes access to the Baltic states."
 nov_baltic_dominion: "Master of the Baltic"
 nov_baltic_dominion_desc: "From Viborg to Riga — the eastern Baltic shore falls under Novgorod's control. Dominate major Hanseatic ports and monopolize northern European trade."
 nov_neva_ports: "The Neva Ports"
 nov_neva_ports_desc: "Develop the port town on the Neva River — this location where Peter the Great will later build 'Petersburg' becomes the gateway to the Baltic."
 nov_orthodox_archbishop: "Orthodox Archbishopric"
 nov_orthodox_archbishop_desc: "Novgorod's Archbishop holds authority independent from Moscow and Constantinople — religious autonomy supports Novgorod's distinctiveness. Strengthen the Orthodox tradition of Novgorod with its Cathedral of Saint Sophia."
 nov_cathedral_cities: "Cities of Cathedrals"
 nov_cathedral_cities_desc: "Build cathedrals in all of Novgorod's cities — realize the ideal of 'Holy Rus' and cover the entire country with the brilliance of Orthodox faith."
 nov_guardian_of_orthodoxy: "Guardian of Orthodoxy"
 nov_guardian_of_orthodoxy_desc: "With Constantinople fallen to the Ottomans, the mission of Orthodox guardian falls to Novgorod. Seize the title of 'Third Rome' — Novgorod, not Moscow, shall hold it."
 nov_novgorod_chronicle: "The Novgorod Chronicle"
 nov_novgorod_chronicle_desc: "The Novgorod Chronicle (Novgorodskaya Letopis) — this historical work meticulously recording annual events passes Novgorod's intellectual heritage to future generations."
 nov_dev_torzhok: "Develop Torzhok"
 nov_dev_torzhok_desc: "Torzhok, located between Novgorod and Moscow — develop it as a trade hub and control the southern trade route."
 nov_kazan_subjugation: "Subjugate Kazan"
 nov_kazan_subjugation_desc: "The Khanate of Kazan — subjugating this Tatar successor state controlling the middle Volga opens the road east."
 nov_ushkuiniks: "The Ushkuiniks"
 nov_ushkuiniks_desc: "Ushkuiniks — Novgorod's mixed group of river pirates, explorers, and soldiers. Incorporate these rough characters who descend the Volga raiding Tatar merchant ships into Novgorod's regular army and train them as elite troops."
 nov_dev_suzdal: "Develop Suzdal"
 nov_dev_suzdal_desc: "Suzdal of the 'Golden Ring' — develop this ancient city possessing many medieval churches and monasteries as a cultural and religious center."
 nov_conquer_beloozero: "Conquer Beloozero"
 nov_conquer_beloozero_desc: "The Beloozero region of the 'White Lake' — rich in furs and fish, seize this area and secure the northern trade route."
 nov_dev_kholmogory: "Develop Kholmogory"
 nov_dev_kholmogory_desc: "Kholmogory on the Dvina River — develop this port town as the gateway to the White Sea, laying the foundation for future Arkhangelsk prosperity."
 nov_conquer_vladimir: "Conquer Vladimir"
 nov_conquer_vladimir_desc: "Once the capital of the Vladimir Grand Principality — this ancient city with many religious buildings including the Dmitrievsky Cathedral falls to Novgorod."
 nov_tatar_wars: "Wars against the Tatars"
 nov_tatar_wars_desc: "Novgorod was the only major Rus city that did not submit to the Tatar yoke — fight the Tatars now using that pride as a weapon. With the spirit of the Neva riverbank, defeat the steppe horsemen."
 nov_golden_horde: "Counterattack on the Golden Horde"
 nov_golden_horde_desc: "Raise Novgorod's banner in the Golden Horde (Kipchak Khanate) territory — whoever liberates Russia from Mongol rule is the true master of the Rus."
 nov_nizhny_novgorod: "Conquer Nizhny Novgorod"
 nov_nizhny_novgorod_desc: "'Lower Novgorod' Nizhny Novgorod — subdue this trading city at the confluence of the Volga and Oka rivers and seize middle Volga trade."
 nov_orthodox_mission: "Orthodox Mission"
 nov_orthodox_mission_desc: "Spread the Orthodox faith to northern and eastern pagans — missionary activities among Finnic peoples, Siberian indigenous peoples, and Tatars enhance Novgorod's legitimacy."
 nov_hanseatic_kontors: "Hanseatic Kontors"
 nov_hanseatic_kontors_desc: "Establish Novgorod trading posts (kontors) in major Hanseatic League cities — Novgorod, Riga, Lübeck — and directly control the northern European trade network."
 nov_ostrog_system: "The Ostrog System"
 nov_ostrog_system_desc: "Build a network of fortresses (ostrog) supporting the advance into Siberia — forward bases for Siberian conquest leading to Tyumen, Tobolsk, and Irkutsk."
 nov_dev_ryazan: "Develop Ryazan"
 nov_dev_ryazan_desc: "Ryazan, annihilated by the Mongols — a new Ryazan city was built on its ruins. Develop this important southern city as a forward base toward the steppe."
 nov_estonian_coast: "The Estonian Coast"
 nov_estonian_coast_desc: "Subduing the Estonian coast completes Baltic southern shore control. Seize the Hanseatic trading city of Reval (Tallinn)."
 nov_conquer_teutonic: "Defeat the Teutonic Order"
 nov_conquer_teutonic_desc: "The legacy of the Baltic Crusades ends — defeating the Teutonic Order brings the southeastern Baltic shore completely under Novgorod's control."
 nov_moscow_capital: "Develop Moscow"
 nov_moscow_capital_desc: "Develop conquered Moscow as an important city under Novgorod rule — convert the former Moscow Grand Prince's palace into the Novgorod Governor's Mansion, symbol of domination."
 nov_iron_ring: "The Iron Ring"
 nov_iron_ring_desc: "The fortress ring protecting Novgorod — the defense network linking Pskov, Novgorod, Ladoga, and Tver is complete. An iron defense system that can repel invasion from any direction."
 nov_salt_of_russa: "Salt of Staraya Russa"
 nov_salt_of_russa_desc: "The salt fields of Staraya Russa support Novgorod's food preservation industry — stable salt supply to survive the long northern winter is established."
 nov_kholmogory_trade: "Kholmogory Trade"
 nov_kholmogory_trade_desc: "From the trade hub Kholmogory on the Dvina to the White Sea — seize this northern trade route ahead of the English Muscovy Company."
 nov_eastern_orthodoxy: "Eastern Orthodox Church Established"
 nov_eastern_orthodoxy_desc: "After Constantinople's fall, Novgorod emerges as the center of the Eastern Orthodox Church. Saint Sophia Cathedral shines as successor to Hagia Sophia in Constantinople."
 nov_amber_road: "The Amber Road"
 nov_amber_road_desc: "The amber trade route running south from the Baltic Sea — Baltic amber, Novgorodian furs, and Eastern silk intersect on this route now controlled by Novgorod."
 nov_great_novgorod: "Great Novgorod Complete"
 nov_great_novgorod_desc: "Trade empire, military power, Orthodox authority — the three pillars complete and Novgorod becomes a state worthy of the title 'the Great (Veliky).' Take the final step toward 'Grand Prince of the Rus.'"
 nov_ruler_of_rus: "Grand Prince of the Rus"
 nov_ruler_of_rus_desc: "'Grand Prince of Novgorod and all the Rus' — this title rang out across Novgorod's Veche square. From the Baltic to Siberia, from the White Sea to the southern steppes — Novgorod's banner flies across all Russia. The merchant republic has built one of the world's greatest empires. History has been rewritten — Novgorod decides Russia's future."
 nov_events.10.t: "Moscow Falls — Russian Leadership to Novgorod"
 nov_events.10.d: "The Moscow Kremlin has fallen into Novgorodian hands. The ambitions of the Moscow Grand Prince family, despised as 'Tatar dogs,' are crushed. Now that Russia's future is decided by the Veche Republic of Novgorod, this victory is not merely territorial conquest — it is a turning point that fundamentally changes Russian history."
 nov_events.10.a: "Moscow has fallen! The era of Novgorod begins!"
 nov_events.20.t: "Formation of the Rus — A New State Centered on Novgorod"
 nov_events.20.d: "A unified Rus state centered on Novgorod has been born. What shall it be named? Proclaim the 'Grand Duchy of Rus' to herald a new beginning, or proudly maintain the name 'Novgorod'?"
 nov_events.20.a: "Declare the 'Grand Duchy of Rus' — birth of a new Russia"
 nov_events.20.b: "Proudly maintain the name 'Novgorod'"
 nov_events.99.t: "Grand Prince of the Rus — Novgorod Rules Russia"
 nov_events.99.d: "'Grand Prince of Novgorod and all the Rus' — this title resounded across Novgorod's Veche square. From the Baltic to Siberia, from the White Sea to the steppe — Novgorod's banner flies across all Russia. The merchant republic has built one of history's greatest empires. History has been rewritten."
 nov_events.99.a: "Long live the Grand Prince of the Rus! Novgorod forever!"
