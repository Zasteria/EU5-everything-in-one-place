l_russian:
 bur_crown_of_lothair_mission_pack: "The Crown of Lothair"
 bur_crown_of_lothair_mission_pack_DESCRIPTION: "1337: the Hundred Years' War is beginning. The Duchy of Burgundy, wedged between France and England, has the cunning and resources to play both sides — and ultimately to resurrect Lotharingia, the ancient Middle Kingdom of Charlemagne's heirs. Secure the court at Dijon, build the Order of the Golden Fleece, and dominate Flemish cloth trade; then navigate the war between England and France to extract maximum concessions before uniting Flanders, Franche-Comté, and Lorraine into a new 'Kingdom of Lotharingia.'"
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION: "As Burgundy, navigate the Hundred Years' War, consolidate internally, and restore Lotharingia."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP: "Complete missions to claim the Crown of Lothair."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS: "Survive between England and France — then surpass them both!"
 bur_duchy_of_burgundy: "Ambitions of the Duchy"
 bur_duchy_of_burgundy_desc: "1337: the House of Valois-Burgundy is rising as a cadet branch of the French royal house. Playing England and France against each other, the Duchy aims to expand into Flanders, Franche-Comté, and Lorraine. The Hundred Years' War is a once-in-a-generation opportunity for this small duchy to become a major power."
 bur_duchy_of_burgundy_tooltip: "No requirements"
 bur_court_of_dijon: "The Court of Dijon"
 bur_court_of_dijon_desc: "The Burgundian court at Dijon was one of the most splendid in 15th-century Europe. Jan van Eyck and Rogier van der Weyden worked under Burgundian patronage, and the ducal library rivaled any in France. This 'Northern Renaissance' avant la lettre was built on Flemish cloth revenues and the duke's extravagant ambition."
 bur_court_of_dijon_tooltip: "Legitimacy 100, stability 30 or higher"
 bur_flemish_cloth: "Flemish Cloth Industry"
 bur_flemish_cloth_desc: "The triangle of Bruges, Ghent, and Ypres was medieval Europe's greatest industrial region. English wool was shipped to Flanders, worked into fine draperies by skilled craftsmen, and sold throughout Europe at the Champagne fairs. This supply chain was Burgundy's economic backbone."
 bur_flemish_cloth_tooltip: "Produce 5 or more cloth or 3 or more fine cloth nationally"
 bur_golden_fleece: "The Order of the Golden Fleece"
 bur_golden_fleece_desc: "Founded at Bruges in 1430 by Philip the Good, the Order of the Golden Fleece was the most prestigious chivalric order in Catholic Christendom — membership was reserved for monarchs and great princes. Based on the legend of Jason and the Argonauts, the order's badge (a golden fleece pendant) remained a supreme honor until the 19th century."
 bur_golden_fleece_tooltip: "Current date is after 1400"
 bur_estates_general: "The Estates General"
 bur_estates_general_desc: "As a composite state ruling over Flanders, Brabant, and Franche-Comté — each with its own legal traditions — Burgundy needed representative institutions to govern effectively. The Estates General brought together the three orders across diverse regions under a single deliberative framework."
 bur_estates_general_tooltip: "Total population is 1,000 pops or more"
 bur_feast_of_pheasants: "The Feast of the Pheasant"
 bur_feast_of_pheasants_desc: "In 1454, shocked by the fall of Constantinople, Philip the Good staged the 'Feast of the Pheasant' at Lille — the most lavish banquet of the medieval age. Knights swore crusading vows over a living pheasant; Philip himself pledged to follow his king to the Holy Land. The crusade never sailed, but the feast cemented Burgundy's reputation as the guardian of Christian chivalry."
 bur_feast_of_pheasants_tooltip: "Monthly prestige 0.30 or higher, Papal States have opinion 100 or higher"
 bur_balance_of_power: "Between Two Realms"
 bur_balance_of_power_desc: "Burgundy's diplomatic genius lay in its position as balancer. A French vassal by feudal law, connected to the Empire by its eastern territories, and a potential English ally — Burgundy could tip the scales of the Hundred Years' War in either direction. This leverage was the foundation of Burgundian power."
 bur_balance_of_power_tooltip: "Power projection 7 or higher"
 bur_ally_england: "Alliance with England"
 bur_ally_england_desc: "After the murder of John the Fearless on the bridge of Montereau in 1419, Burgundy threw its weight behind England. The resulting Treaty of Troyes (1420) declared Henry V heir to the French crown — an outcome inconceivable without Burgundian support. The Burgundian-English alliance was one of the decisive military partnerships of the Hundred Years' War."
 bur_ally_england_tooltip: "Allied with England (c:ENG) and England has opinion of 100 or higher"
 bur_treaty_of_troyes: "The Treaty of Troyes"
 bur_treaty_of_troyes_desc: "The Treaty of Troyes, backed by Burgundy, made Henry V the regent and heir of France. Securing Reims (where French kings were crowned) and Paris (the capital) makes Burgundy the de facto master of France — the ultimate vindication of the English alliance."
 bur_treaty_of_troyes_tooltip: "Reims and Paris are owned by us or a subject"
 bur_ally_france: "Reconciliation with France"
 bur_ally_france_desc: "At the Congress of Arras in 1435, Philip the Good switched sides — abandoning England and reconciling with Charles VII. In return Burgundy received formal exemption from homage and the cession of strategic towns. This diplomatic pirouette made Burgundy the ultimate winner of the Hundred Years' War."
 bur_ally_france_tooltip: "Allied with France (c:FRA) and France has opinion of 100 or higher"
 bur_treaty_of_arras: "The Spirit of Arras"
 bur_treaty_of_arras_desc: "The Treaty of Arras (1435) was Burgundy's greatest diplomatic triumph — Charles VII was humiliated into a public apology while Philip walked away with territorial gains and a waived homage. Using this breathing room, Burgundy could focus on consolidating Lorraine and completing the Middle Kingdom."
 bur_treaty_of_arras_tooltip: "Own 10 or more locations in the Lorraine area, France has opinion of 150 or higher"
 bur_flanders_in_the_war: "Flanders in the Hundred Years' War"
 bur_flanders_in_the_war_desc: "The County of Flanders was one of the most fiercely contested territories of the Hundred Years' War. England supplied wool to Flemish cloth towns and held strong economic influence there; Flemish cities often sided with England against France. Yet France claimed the Count of Flanders as a vassal. Burgundy, dependent on Flemish cloth revenues, needed to draw this pivotal region into its orbit."
 bur_flanders_in_the_war_tooltip: "FLA (Flanders) is a subject of England, or FLA has opinion of 150 or higher toward us, or FLA does not exist"
 bur_integrate_brabant: "The Road to Brussels"
 bur_integrate_brabant_desc: "Antwerp, Brabant's commercial capital, would become the greatest trading city in northern Europe by the late 15th century. The Plantin printing house, diamond trade, and Spanish silver exchanges — all centered here. Securing Brabant completes Burgundian mastery of the Low Countries."
 bur_integrate_brabant_tooltip: "Own 10 or more locations in the Brabant area; Antwerp owned by us or a subject"
 bur_integrate_franche_comte: "Seize Dole"
 bur_integrate_franche_comte_desc: "Dole, the capital of Franche-Comté, was home to the University of Dole (founded 1422) — supported by the Burgundian ducal house. Securing this city means effective control of all Franche-Comté and opens the route toward Lorraine."
 bur_integrate_franche_comte_tooltip: "Dole is owned by us or a subject"
 bur_expand_into_lorraine: "Expand into Lorraine"
 bur_expand_into_lorraine_desc: "Nancy was the capital of the Duchy of Lorraine. Charles the Bold died at the Battle of Nancy in 1477 obsessing over this city — here the player writes a different ending. Seizing Nancy opens the road to Luxembourg and secures the Burgundian corridor between the Netherlands and the heartland."
 bur_expand_into_lorraine_tooltip: "Nancy is owned by us or a subject"
 bur_king_of_the_franks: "King of the Franks"
 bur_king_of_the_franks_desc: "Since the Treaty of Verdun in 843, the question of who was Charlemagne's true heir had never been settled. The Kings of France, Germany, and Italy all had claims. By seizing Paris and wearing the Frankish crown, Burgundy gives its own answer — not as a usurper, but as the legitimate heir of the Middle Kingdom."
 bur_king_of_the_franks_tooltip: "Paris is owned by us or a subject, or France does not exist; own 200 or more locations"
 bur_crown_of_lothair: "The Crown of Lothair"
 bur_crown_of_lothair_desc: "In 843, the Treaty of Verdun created Lotharingia — the Middle Kingdom stretching from Flanders to Italy along the Rhine. Swallowed by France and Germany at the Treaty of Mersen in 870, this kingdom vanished from history for a thousand years. Now the House of Burgundy restores it: not as France, not as Germany, but as something new — the resurrection of the Carolingian center."
 bur_crown_of_lothair_tooltip: "Own 50 or more locations in the France region, 10 or more in Lorraine, 15 or more in Flanders, and 300 or more locations total"
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "The Court of Dijon"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "The Burgundian court at Dijon attracted Jan van Eyck, Rogier van der Weyden, and the finest musicians and poets of the age — making it the cultural capital of northern Europe and a pioneer of the Flemish painting tradition that would transform Western art."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "Flemish Cloth Industry"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "The cloth triangle of Bruges, Ghent, and Ypres was the engine of medieval Europe's largest industrial economy. Flemish draperies were the benchmark of quality across Europe, and control of this industry gave Burgundy financial resources that rivaled any kingdom."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Order of the Golden Fleece"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "Founded in 1430, the Order of the Golden Fleece was the most exclusive honor in Christendom — its membership list read like a roll call of European royalty. Granting the fleece gave Burgundy diplomatic leverage over kings and emperors alike."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "The Estates General"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Burgundy's Estates General unified the three orders across Flanders, Brabant, and Burgundy proper into a single deliberative assembly — an early model of representative government that influenced the later Dutch Republic and French revolutionary bodies."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "Vow of the Pheasant"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "At the greatest banquet of the medieval age, Philip the Good swore over a living pheasant to lead a crusade against the Ottomans. The vow was never fulfilled, but the spectacle announced Burgundy as Christendom's foremost chivalric power and deepened its ties with the Papacy."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Between Two Realms"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Playing the balancer between England and France, Burgundy refuses full submission to either overlord and exploits the ambiguity of its feudal obligations. The chaos of the Hundred Years' War creates the perfect opportunity to build independent military power while keeping both sides at arm's length."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "The English Alliance"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "After Montereau, Burgundy and England formed the most consequential military alliance of the Hundred Years' War. Together they occupied Paris and nearly extinguished the Valois line — only Joan of Arc's intervention reversed the tide."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Treaty of Troyes"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "The Burgundian-backed Treaty of Troyes made Henry V heir to France — the high-water mark of Anglo-Burgundian power. Building on this triumph, Burgundy positions itself as the true ruler of the French realm."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "The French Alliance"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "The Congress of Arras (1435) was Burgundy's diplomatic masterpiece — abandoning England at the moment of maximum leverage and extracting humiliating concessions from a desperate Charles VII. Burgundy emerged as the indispensable partner of the eventual French victor."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Treaty of Arras"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "At Arras, Philip the Good extracted a formal apology from Charles VII and gained territory, while waiving the requirement of personal homage. This made Burgundy effectively independent while remaining nominally within the French feudal order — the perfect diplomatic outcome."
 STATIC_MODIFIER_NAME_bur_flanders_in_the_war_mod: "Flanders in the War (unused)"
 STATIC_MODIFIER_DESC_bur_flanders_in_the_war_mod: "unused"
 STATIC_MODIFIER_NAME_bur_integrate_brabant_mod: "Brabant Integrated"
 STATIC_MODIFIER_DESC_bur_integrate_brabant_mod: "Antwerp rose to become the commercial capital of the late medieval north. Its integration into Burgundy made the duchy the master of both the cloth trade and the emerging Atlantic commerce network."
 STATIC_MODIFIER_NAME_bur_integrate_franche_comte_mod: "Franche-Comté Integrated"
 STATIC_MODIFIER_DESC_bur_integrate_franche_comte_mod: "The Free County's salt, iron, and university made it economically valuable; its mountain terrain made it defensible. Securing this ancient Burgundian possession was the foundation for all eastward expansion."
 STATIC_MODIFIER_NAME_bur_expand_into_lorraine_mod: "Advance into Lorraine"
 STATIC_MODIFIER_DESC_bur_expand_into_lorraine_mod: "Lorraine was the missing link between Burgundy's northern Netherlands possessions and its southern heartland. Charles the Bold died trying to seize it. By succeeding where he failed, Burgundy closes the gap and completes the Middle Kingdom."
 STATIC_MODIFIER_NAME_bur_king_of_the_franks_mod: "King of the Franks"
 STATIC_MODIFIER_DESC_bur_king_of_the_franks_mod: "The Frankish crown had been France's exclusive possession since Charlemagne. By seizing Paris and claiming the title, Burgundy delivers the ultimate answer to the question posed in 843: the true heir of the Carolingians was neither France nor Germany, but the Middle Kingdom reborn."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "The Crown of Lothair"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "Lost in 870, the Kingdom of Lotharingia is reborn after a thousand years. From Flanders to Franche-Comté, from Lorraine to Burgundy proper, the House of Burgundy has assembled the Middle Kingdom that Charlemagne's grandsons could not keep. Europe has a new center of gravity."
 bur_events.1.t: "Ambitions of the Duchy of Burgundy"
 bur_events.1.d: "1337: the opening shots of the Hundred Years' War are about to ring out. Edward III of England is pressing his claim to the French throne — but Burgundy watches from its unique vantage point between the two giants. A cadet branch of the French Valois house, yet possessed of mighty Flanders, an elite chivalric tradition, and revenues that match any kingdom — Burgundy is the fulcrum on which this war will turn. From the splendid court at Dijon to the teeming cloth halls of Bruges and Ghent, the Duchy harbors the greatest ambitions of any power in Europe. The question is which side to back — or whether to back either side at all."
 bur_events.1.a: "Burgundy will choose its own path between England and France!"
 bur_events.2.t: "The Feast of the Pheasant"
 bur_events.2.d: "At Lille in 1454, Duke Philip staged the most extraordinary banquet of the medieval age. A living pheasant was carried into the hall adorned with a golden collar; before it, the assembled knights of Burgundy swore crusading vows by God, the Virgin, and the pheasant itself. Philip pledged to follow his king to the Holy Land. Stage machinery produced a chapel, a ship, and a castle on the dining tables. Jugglers, poets, and musicians competed for attention. The crusade never sailed — but no one in Europe doubted that Burgundy was Christendom's foremost guardian of knightly virtue."
 bur_events.2.a: "We swear before God and the Pheasant to defend Christendom!"
 bur_events.3.t: "The Crown of Lothair"
 bur_events.3.d: "In 843, the Treaty of Verdun divided Charlemagne's empire among his three grandsons. The middle portion — stretching from Flanders to Italy along the Rhine — went to Lothair I and became 'Lotharingia.' In 870, the Treaty of Mersen erased it, splitting it between France and Germany. For a thousand years, the Middle Kingdom was no more than a memory — a ghost haunting the boundaries of France and the Empire. Now the House of Burgundy, by cunning and arms, has rebuilt what the Carolingians could not hold. Let the Crown of Lothair pass to its rightful heir."
 bur_events.3.a: "The Crown of Lothair belongs to Burgundy!"
 bur_duchy_of_burgundy_tooltip: "The Hundred Years' War situation is active"
 bur_burgundy_wine: "Wines of Burgundy"
 bur_burgundy_wine_desc: "The vineyards of the Côte de Nuits and Côte de Beaune have produced wines coveted by popes and kings since the Middle Ages. Cistercian monks painstakingly cultivated the pinot noir grape through centuries of experimentation, creating the terroir-driven tradition that made Burgundy synonymous with the world's finest wine."
 bur_burgundy_wine_tooltip: "Produce 5 or more wine nationally"
 bur_court_of_beaune: "The Hôtel-Dieu of Beaune"
 bur_court_of_beaune_desc: "In 1443, Chancellor Nicolas Rolin and his wife Guigone de Salins founded the Hôtel-Dieu — the 'House of God' — at Beaune. Its Flemish Gothic polychrome tile roof stands nearly unchanged today. Rolin built what he called 'a palace for the poor,' and Roger van der Weyden painted its magnificent Last Judgment altarpiece."
 bur_court_of_beaune_tooltip: "Own 5 or more monasteries, monthly prestige 0.15 or higher"
 bur_printing_press: "The Printing Press"
 bur_printing_press_desc: "Gutenberg's press revolution spread rapidly to the Low Countries. Bruges saw its first press in 1476. The flood of printed books raised literacy across the Netherlands and spread Renaissance ideas far beyond Italy. This democratization of knowledge reinforced Burgundy's cultural advantage."
 bur_printing_press_tooltip: "Has embraced the Renaissance, owns 2 or more universities"
 bur_council_of_mechelen: "The Great Council of Mechelen"
 bur_council_of_mechelen_desc: "Philip the Good's advisors established at Mechelen a 'Great Council' with jurisdiction over all Burgundian territories — a supreme court standing above the separate legal traditions of Flanders, Brabant, and Franche-Comté. This was the institutional cornerstone of genuine centralization."
 bur_council_of_mechelen_tooltip: "Mechelen is directly owned by us (owns)"
 bur_mapmaking: "Mapping Burgundy"
 bur_mapmaking_desc: "Flemish cartographers pioneered the geographic revolution of the early modern era. Merchants from Bruges and Antwerp eagerly absorbed Portuguese charts and Italian geography, producing maps of Burgundy's vast territories with unprecedented accuracy — laying the ground for Mercator's revolutionary projection."
 bur_mapmaking_tooltip: "Own 50 or more locations, monthly income 20 or more"
 bur_champagne_fairs: "The Champagne Fairs"
 bur_champagne_fairs_desc: "The great fairs of Troyes, Provins, Lagny, and Bar were the hub of European commerce from the 12th to 14th centuries. As they declined, Bruges and Antwerp rose to replace them. Burgundy now stands at the center of this new commercial geography."
 bur_champagne_fairs_tooltip: "Monthly income 12 or more, own 1 or more market centers"
 bur_compagnie_d_ordonnance: "Compagnies d'Ordonnance"
 bur_compagnie_d_ordonnance_desc: "Charles the Bold created the Compagnies d'Ordonnance — standing, salaried heavy cavalry with standardized organization, the closest thing to a modern professional army in 15th-century Europe. Inspired partly by the French and partly by Italian condottieri, this reform prefigured the military revolution of the 16th century."
 bur_compagnie_d_ordonnance_tooltip: "Army size 10 or more, monthly army tradition 0.05 or more"
 bur_ransom_diplomacy: "Ransom Diplomacy"
 bur_ransom_diplomacy_desc: "In the chivalric warfare of the Hundred Years' War, the ransom of noble prisoners was a central diplomatic and financial instrument. John II of France's capture at Poitiers (1356) set a ransom of 3 million gold crowns. Burgundy has learned to turn battlefield victories into diplomatic leverage."
 bur_ransom_diplomacy_tooltip: "Monthly income 15 or more, diplomatic reputation 3 or higher"
 bur_siege_of_calais: "Calais Seized"
 bur_siege_of_calais_desc: "Calais was England's last foothold on the French mainland — held from 1347 to 1558. Rodin's famous 'Burghers of Calais' commemorates its heroic surrender. Seizing this strategic port gives Burgundy control of the Channel crossing and maximizes the value of the English alliance."
 bur_siege_of_calais_tooltip: "Calais is owned by us or a subject"
 bur_english_alliance_secured: "Hegemony over England and France"
 bur_english_alliance_secured_desc: "The Anglo-Burgundian partnership has reached its apex. With Rouen secured and England as a subject, Burgundy stands as the undisputed master of northern France — the ultimate vindication of the English alliance strategy."
 bur_english_alliance_secured_tooltip: "Rouen is owned by us or a subject; England is a subject"
 bur_trial_of_joan: "The Trial of Joan"
 bur_trial_of_joan_desc: "History's most painful irony: it was Burgundian troops who captured Joan of Arc at Compiègne in 1430 and sold her to England for execution at Rouen. Now Burgundy fights alongside France. By seizing Rouen and turning against England, Burgundy atones for that fateful transaction — and becomes the true guardian of French chivalry."
 bur_trial_of_joan_tooltip: "Rouen is owned by us; at war with or England does not exist"
 bur_france_allied_secured: "France Secured"
 bur_france_allied_secured_desc: "The French alliance has borne fruit. With England expelled and France under Burgundian hegemony, the Congress of Arras proved prophetic — Burgundy bet on France and won everything. The duchy now stands as the indispensable patron of the renewed French monarchy."
 bur_france_allied_secured_tooltip: "France is a subject or does not exist; own 30 or more locations in the France region"
 bur_secure_artois: "Secure Artois"
 bur_secure_artois_desc: "The County of Artois was a Burgundian hereditary possession centered on Arras. Philip the Good used the Treaty of Arras to consolidate his grip on it. Securing Arras and Valenciennes completes the southern foundation of Burgundy's Netherlandish empire."
 bur_secure_artois_tooltip: "Arras and Valenciennes owned by us or a subject"
 bur_dominate_picardy: "Dominate Picardy"
 bur_dominate_picardy_desc: "Picardy, whose cathedral at Amiens is among the greatest Gothic monuments in France, was the contested borderland where English and Burgundian power intersected. Controlling this flat corridor north of Paris opens the road to the French capital."
 bur_dominate_picardy_tooltip: "Amiens owned by us or a subject; own 5 or more locations in the Wallonia area"
 bur_hainaut_namur: "Inherit Hainaut and Namur"
 bur_hainaut_namur_desc: "Philip the Good purchased Namur in 1421 and inherited Hainaut in 1433 — completing the land bridge between Flanders and Brabant. These counties with their textile towns and strategic river crossings formed the connective tissue of the Burgundian Netherlands."
 bur_hainaut_namur_tooltip: "Namur and Mons owned by us or a subject"
 bur_holland_zeeland: "Holland and Zeeland"
 bur_holland_zeeland_desc: "The counties of Holland and Zeeland — with their herring fisheries, new commercial towns like Amsterdam, and excellent harbors — were acquired by Philip the Good in 1428. These territories would become the heartland of the Dutch Republic; under Burgundy, they are the engine of a North Sea commercial empire."
 bur_holland_zeeland_tooltip: "Rotterdam and Amsterdam are owned by us or a subject"
 bur_luxemburg: "Luxembourg"
 bur_luxemburg_desc: "Philip the Good conquered the Duchy of Luxembourg in 1443 after a campaign against Sigismund of the Habsburg line. One of the strongest fortresses in the Empire, Luxembourg was the eastern anchor of the Burgundian Netherlands — and the gateway to Lorraine and Alsace."
 bur_luxemburg_tooltip: "Luxembourg owned by us or a subject"
 bur_dominate_alsace: "Alsace"
 bur_dominate_alsace_desc: "Charles the Bold purchased the landgraviate of Alsace from the Habsburgs in 1469 — a move that triggered the Swiss wars and ultimately cost him his life. Here the player has the chance to hold what Charles could not. Strasbourg, the greatest city on the upper Rhine, is the prize."
 bur_dominate_alsace_tooltip: "Own 5 or more locations in the Alsace area; Strasbourg owned by us or a subject"
 bur_dominate_rhine: "The Rhine"
 bur_dominate_rhine_desc: "The Rhine has been the spine of European civilization from Rome to the present. To hold the river from the Netherlands to Alsace is to hold Charlemagne's heartland — the Rhineland where the Carolingian empire was administered, where cathedral cities rose, where the greatest medieval trade routes converged."
 bur_dominate_rhine_tooltip: "Own 8 or more locations in the Rhineland area"
 bur_lotharingia_united: "Lotharingia United"
 bur_lotharingia_united_desc: "Lorraine, Flanders, and Holland — the three pillars of the Middle Kingdom — are coming together. The ghost of the 843 Treaty of Verdun walks these lands. What was divided is being reunited. What was lost is being found. The Middle Kingdom stirs."
 bur_lotharingia_united_tooltip: "Own 12+ locations in Lorraine, 15+ in Flanders, 8+ in Holland"
 bur_dutch_towns: "Netherlandish Towns"
 bur_dutch_towns_desc: "Amsterdam, Leiden, Utrecht — the commercial cities of Holland were growing at a pace that alarmed their neighbors. Cloth, beer, grain, herring — the Dutch traded everything. Under Burgundian patronage, these towns would become the nucleus of the greatest commercial civilization in early modern Europe."
 bur_dutch_towns_tooltip: "Own 3 or more markets in the Holland area; Utrecht owned by us or a subject"
 bur_north_sea_trade: "North Sea Trade"
 bur_north_sea_trade_desc: "The North Sea was a Hanseatic lake — but Burgundy's Netherlandish cities were challenging that dominance. Herring from the Dutch coast, wool from England, grain from the Baltic, timber from Scandinavia — all passed through Burgundian ports. Naval power backed by Antwerp's capital would break the Hansa monopoly."
 bur_north_sea_trade_tooltip: "Navy size 15 or more; own 2 or more market centers"
 bur_burgher_power: "Burgher Power"
 bur_burgher_power_desc: "The citizens of Ghent, Bruges, and Antwerp were not passive subjects. They negotiated, bargained, and revolted. The Burgundian dukes learned to work with this urban energy rather than against it — granting privileges, convening estates, building the partnership between ducal authority and commercial wealth that was the foundation of modern governance."
 bur_burgher_power_tooltip: "Own 8 or more markets; total population 500 pops or more"
 bur_the_great_duchy: "The Great Duchy"
 bur_the_great_duchy_desc: "No longer merely a French vassal or imperial appendage, Burgundy has grown into a 'Great Duchy' — a power that rivals France and the Empire on equal terms. The 'phantom state' that historians said could not survive now commands a hundred territories and a thousand pops. The Middle Kingdom is taking shape."
 bur_the_great_duchy_tooltip: "Own 100 or more locations, total population 1,000 pops or more"
 STATIC_MODIFIER_NAME_bur_burgundy_wine_mod: "Wines of Burgundy"
 STATIC_MODIFIER_DESC_bur_burgundy_wine_mod: "Cistercian monks in Burgundy spent centuries perfecting pinot noir cultivation, creating wines that popes and kings coveted across Christendom. The vineyards of the Côte d'Or were the first estates in Europe to understand that wine's character was inseparable from its specific patch of earth."
 STATIC_MODIFIER_NAME_bur_court_of_beaune_mod: "The Hôtel-Dieu"
 STATIC_MODIFIER_DESC_bur_court_of_beaune_mod: "Chancellor Rolin's hospital at Beaune — built in 1443, still standing in its near-original form — was one of the finest buildings in northern Europe. Its magnificent polychrome tile roof and the van der Weyden altarpiece it housed made it simultaneously a charitable institution and a statement of Burgundian grandeur."
 STATIC_MODIFIER_NAME_bur_printing_press_mod: "The Printing Press"
 STATIC_MODIFIER_DESC_bur_printing_press_mod: "Gutenberg's revolution found fertile ground in the literate, commercial cities of the Low Countries. Bruges and Antwerp became early printing centers, and the flood of books that resulted helped create the culture of educated citizenship that would drive the Dutch Golden Age."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Great Council of Mechelen"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "The Great Council at Mechelen was Burgundy's answer to the problem of ruling a composite state with divergent legal traditions. By creating a supreme court above Flemish, Brabantine, and Burgundian law alike, Philip's counselors built the institutional foundation for genuine centralization."
 STATIC_MODIFIER_NAME_bur_mapmaking_mod: "Flemish Cartography"
 STATIC_MODIFIER_DESC_bur_mapmaking_mod: "Flemish mapmakers absorbed Portuguese discoveries and Italian geography to produce the most accurate charts of northern Europe. Their work prefigured Mercator's projection and made Burgundy's administrators among the best-informed in the continent."
 STATIC_MODIFIER_NAME_bur_champagne_fairs_mod: "Commercial Successor to Champagne"
 STATIC_MODIFIER_DESC_bur_champagne_fairs_mod: "As the Champagne fairs declined, Bruges and Antwerp rose to replace them as the commercial hub of northwest Europe. Italian and Hanseatic merchants, English wool exporters, and Iberian spice traders all converged on Burgundian ports."
 STATIC_MODIFIER_NAME_bur_ransom_diplomacy_mod: "Ransom Diplomacy"
 STATIC_MODIFIER_DESC_bur_ransom_diplomacy_mod: "Burgundy mastered the art of turning battlefield captures into diplomatic leverage. In the chivalric culture of the Hundred Years' War, a noble prisoner was worth more alive than dead — and Burgundy knew exactly how to price that value."
 STATIC_MODIFIER_NAME_bur_compagnie_d_ordonnance_mod: "Compagnies d'Ordonnance"
 STATIC_MODIFIER_DESC_bur_compagnie_d_ordonnance_mod: "Charles the Bold's professional cavalry companies were among the most advanced military institutions in 15th-century Europe. Salaried, standardized, and drilled, they prefigured the standing armies that would define early modern warfare."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "The Free Port of Calais"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Calais, at the narrowest point of the English Channel, has been the key transit hub connecting North Sea, Baltic, and Mediterranean trade since antiquity. England held it for over two centuries for exactly this commercial value. Burgundy now develops Calais into the premier cloth-trading entrepôt of northern Europe."
 STATIC_MODIFIER_NAME_bur_english_alliance_secured_mod: "Hegemony over England and France"
 STATIC_MODIFIER_DESC_bur_english_alliance_secured_mod: "England under Burgundian suzerainty and Rouen secured — the Hundred Years' War is over, and Burgundy is its master. The English alliance, once a pragmatic necessity, has become the foundation of a North Sea empire."
 STATIC_MODIFIER_NAME_bur_trial_of_joan_mod: "Joan's Legacy"
 STATIC_MODIFIER_DESC_bur_trial_of_joan_mod: "The sale of Joan of Arc to England was Burgundy's original sin in French memory. By fighting alongside France and seizing Rouen — the city of her execution — Burgundy has performed a historical act of expiation and claimed the mantle of French chivalry's true guardian."
 STATIC_MODIFIER_NAME_bur_france_allied_secured_mod: "France Secured"
 STATIC_MODIFIER_DESC_bur_france_allied_secured_mod: "The gamble of Arras has paid off in full. France, aided to victory by Burgundy, now exists within Burgundy's political orbit. The duchy that was once France's vassal has become France's patron — a complete reversal of the feudal order."
 STATIC_MODIFIER_NAME_bur_secure_artois_mod: "Artois Secured"
 STATIC_MODIFIER_DESC_bur_secure_artois_mod: "The County of Artois — Burgundy's hereditary heartland between Flanders and Picardy — is fully secured. Arras, with its famous tapestry industry, anchors the southern end of the Burgundian Netherlands."
 STATIC_MODIFIER_NAME_bur_dominate_picardy_mod: "Picardy Dominated"
 STATIC_MODIFIER_DESC_bur_dominate_picardy_mod: "The flat plains of Picardy — where Amiens Cathedral rises above medieval fields — are now Burgundian. The road to Paris lies open."
 STATIC_MODIFIER_NAME_bur_hainaut_namur_mod: "Hainaut and Namur Integrated"
 STATIC_MODIFIER_DESC_bur_hainaut_namur_mod: "Philip the Good completed the Burgundian land bridge between Flanders and Brabant by acquiring Namur (1421) and Hainaut (1433). These counties filled the crucial gap in the Netherlands and made Burgundy a continuous territorial power."
 STATIC_MODIFIER_NAME_bur_holland_zeeland_mod: "Holland and Zeeland"
 STATIC_MODIFIER_DESC_bur_holland_zeeland_mod: "The fishing and commercial towns of Holland and Zeeland — seized by Philip in 1428 — were the seed of the Dutch Golden Age. Under Burgundian rule, Amsterdam's commercial genius and the Dutch herring fleet became assets of a nascent North Sea empire."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Luxembourg"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "The fortress-duchy of Luxembourg, one of the strongest positions in the Empire, gave Burgundy its eastern anchor. Its acquisition in 1443 completed the encirclement of the Meuse valley and opened the road to Lorraine and Alsace."
 STATIC_MODIFIER_NAME_bur_dominate_alsace_mod: "Alsace"
 STATIC_MODIFIER_DESC_bur_dominate_alsace_mod: "Charles the Bold purchased Alsace from the Habsburgs in 1469 and lost his life trying to hold it. Here the outcome is different. Strasbourg — cathedral city and Rhine crossing — joins the Middle Kingdom."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "The Rhine"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "From the delta to the vineyards, the Rhine is now Burgundian. The greatest river of the Carolingian heartland, the trade route of medieval Europe, the border between civilization and the forest — all are under one flag."
 STATIC_MODIFIER_NAME_bur_lotharingia_united_mod: "Lotharingia United"
 STATIC_MODIFIER_DESC_bur_lotharingia_united_mod: "Lorraine, Flanders, and Holland — the three pillars of the old Middle Kingdom — are united for the first time in a thousand years. The ghost of 843 is laid to rest. What Lothair I could not hold, Burgundy has rebuilt."
 STATIC_MODIFIER_NAME_bur_dutch_towns_mod: "Netherlandish Prosperity"
 STATIC_MODIFIER_DESC_bur_dutch_towns_mod: "Amsterdam, Leiden, and Utrecht are growing at a pace that will soon astonish the world. The commercial genius of the Dutch — their tolerance, their practical innovation, their mastery of finance — is being harnessed under the Burgundian aegis."
 STATIC_MODIFIER_NAME_bur_north_sea_trade_mod: "North Sea Trade"
 STATIC_MODIFIER_DESC_bur_north_sea_trade_mod: "The North Sea has been a Hanseatic lake for two centuries. Burgundy's Netherlandish cities are breaking that monopoly. With naval power backing Antwerp's capital, the herring routes, wool trade, and Baltic grain traffic are passing into Burgundian hands."
 STATIC_MODIFIER_NAME_bur_burgher_power_mod: "Burgher Power"
 STATIC_MODIFIER_DESC_bur_burgher_power_mod: "The citizens of Ghent, Bruges, and Antwerp were not passive subjects — they were co-rulers of the Burgundian project. The dukes who learned to harness rather than suppress this commercial energy built something new: a state whose legitimacy rested on shared prosperity."
 STATIC_MODIFIER_NAME_bur_the_great_duchy_mod: "The Great Duchy"
 STATIC_MODIFIER_DESC_bur_the_great_duchy_mod: "France called it a duchy; the Empire called it a vassal; England called it an ally. All were wrong. Burgundy is a state in its own right — richer than most kingdoms, more diplomatically skilled than any, and now large enough to be taken on its own terms."
 bur_join_hre: "Join the Holy Roman Empire"
 bur_join_hre_desc: "Burgundy has the opportunity to be formally recognized as a prince of the Holy Roman Empire. A dual status — vassal of France and imperial prince — would give Burgundy a uniquely powerful diplomatic position. In 1473, Charles the Bold negotiated with Frederick III at Trier for elevation to a 'Kingdom of Burgundy' within the Empire — only for the Emperor to withdraw at the last moment. Now the chance comes again."
 bur_join_hre_tooltip: "HRE Emperor has opinion of 100 or higher, or the HRE does not exist"
 bur_franchecomte_fiefdom: "Marriage with Franche-Comté"
 bur_franchecomte_fiefdom_desc: "In the 13th century, the House of Burgundy forged deep ties with the Counts of Franche-Comté through marriage. Duke Otto IV of Burgundy married Countess Mahaut of Artois and secured Franche-Comté's allegiance to Burgundy. The salt mines, iron ore, and University of Dole of this 'Free County' make it a vital gateway for Burgundy's eastward expansion toward Switzerland and Lorraine."
 bur_franchecomte_fiefdom_tooltip: "Franche-Comté (c:FCB) does not exist, or is in a personal union with us, or Burgundy's current ruler is not bur_eudes_iv_burgundy"
 STATIC_MODIFIER_NAME_bur_join_hre_mod: "HRE Membership"
 STATIC_MODIFIER_DESC_bur_join_hre_mod: "Recognized as a prince of the Holy Roman Empire, Burgundy wields the imperial aegis alongside its French feudal status — a diplomatic dual identity that no other power can replicate. The dream of the 1473 Trier meeting is becoming reality."
 STATIC_MODIFIER_NAME_bur_franchecomte_fiefdom_mod: "Franche-Comté Enfeoffed"
 STATIC_MODIFIER_DESC_bur_franchecomte_fiefdom_mod: "The 'Free County' has been brought within the Burgundian orbit. The Jura mountains, Besançon fortress, the University of Dole, and the county's rich salt mines and iron works now serve Burgundy's strategic needs."
 bur_events.4.t: "The Holy Roman Empire"
 bur_events.4.d: "Burgundy has always occupied a liminal position — a vassal of France by feudal law, yet connected to the Empire through its eastern territories. The Emperor's favor opens the path to formal membership. In 1473, Charles the Bold met Frederick III at Trier and negotiated for 'Kingdom of Burgundy' status within the Empire — only for the Emperor to board his barge at dawn and sail away without signing. Now, with relations sufficiently warm, the door stands open again."
 bur_events.4.a: "Join the Empire and become an imperial prince"
 bur_events.4.b: "Preserve our independence for now"
 bur_events.5.t: "Marriage with Franche-Comté"
 bur_events.5.d: "In the 13th century, the Burgundian duke Otto IV married into the comital house of Franche-Comté, binding this wealthy 'Free County' to Burgundy through blood. The salt mines of the Jura, the iron forges, the University of Dole, and the mountain passes controlling the routes to Switzerland and Lorraine — all have been part of the Burgundian world for generations. The time has come to formalize what marriage has already created."
 bur_events.5.a: "Use the bonds of marriage to receive Franche-Comté as an enfeoffed subject"
 bur_events.5.b: "Maintain the marital bonds while respecting their autonomy"
 bur_events.6.t: "Flanders in the Hundred Years' War"
 bur_events.6.d: "The County of Flanders occupies a unique position in the Hundred Years' War. Flemish cloth production cannot function without English wool, and the wealthy citizens of Bruges, Ghent, and Ypres value their English trading relationship above all. France claims the Count as a vassal, but Flemish townspeople resist French domination and have repeatedly sided with England. By drawing Flanders into the Burgundian orbit, the duke can harness the wealth of these cloth cities. The choice: enfeoff Flanders as a Burgundian subject, or deepen ties while respecting its independence."
 bur_events.6.a: "Receive Flanders as a Burgundian vassal"
 bur_events.6.b: "Respect Flemish independence while deepening the alliance"
 bur_nevers_union: "Union with Nevers"
 bur_nevers_union_desc: "The County of Nevers lies to the south of Flanders and has historical ties to the Burgundian ducal house. With Flanders firmly in hand, establishing a claim on Nevers extends Burgundy's sphere of influence southward. The lands between Flanders and Nevers form a corridor for future expansion into France."
 bur_nevers_union_tooltip: "Nevers is owned by us or a subject"
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "The Low Countries Unified"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "The commercial network of the Low Countries — connecting Holland, Zeeland, Brabant, and Flanders — has been unified. The commercial power of Antwerp and Amsterdam that forms the basis of the later Dutch Golden Age."
 bur_events.3.a: "Rise as the restored Kingdom of Lotharingia"
 bur_events.3.b: "Remain as Burgundy and claim the imperial title (status quo)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotharingia Reborn"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "The Kingdom of Lotharingia, successor to Middle Francia, has been revived six centuries after its fall in 869. Heir to Charlemagne's empire, this kingdom is recognized as a third imperial power standing between the Holy Roman Empire and the Kingdom of France."
