l_russian:
 boh_crown_of_bohemia_mission_pack: "Glory of the Bohemian Crown"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION: "In 1337, Bohemia is a powerful Central European kingdom ruled by Jan I (the Blind King) of the House of Luxembourg. Race through Bohemia's turbulent history — the Holy Roman Emperor Charles IV, the founding of Charles University, the Golden Bull — and from the execution of Jan Hus to the Wagenburg tactics of the Hussite Wars. Unite Moravia, Silesia, and Slovakia, challenge the Habsburgs for mastery of the Holy Roman Empire, and found the Bohemian Commonwealth."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION: "As Bohemia, achieve imperial dominance, cultural flourishing, and southern conquest to found the Bohemian Commonwealth."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP: "Complete missions to found the Bohemian Commonwealth."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS: "Carry the Blind King's will — from Golden Prague to a Central European Empire!"
 boh_crown_of_jan: "Crown of the Blind King"
 boh_crown_of_jan_desc: "1337 — Jan I, the Blind King, reigns over Bohemia as one of Central Europe's most powerful rulers. 'I cannot see, but I can still fight' — the Blind King's spirit is Bohemia's pride. Before his heroic death at the Battle of Crécy in 1346, he elevated the House of Luxembourg to one of Europe's greatest dynasties. Establish Prague as the royal capital and consolidate the kingdom's foundations."
 boh_lion_of_empire: "Lion of the Empire"
 boh_lion_of_empire_desc: "The King of Bohemia is the Holy Roman Empire's most powerful elector. Every prince in the Empire should bow before Bohemia's sword. Establish the position of 'Lion of the Empire' through military strength and prestige."
 boh_challenge_habsburg: "Challenge the Habsburgs"
 boh_challenge_habsburg_desc: "The House of Habsburg — Bohemia's greatest rival for control of Central Europe — plots imperial dominance from their Austrian base. Bohemia must make its opposition clear."
 boh_saxony_ambitions: "Saxon Ambitions"
 boh_saxony_ambitions_desc: "Saxony, with Dresden at its heart, is an important center of trade and culture along the Elbe. Bring the Saxon electorate under control and expand Bohemia's imperial influence further."
 boh_conquer_austria: "Conquer Austria"
 boh_conquer_austria_desc: "Vienna falls and Habsburg's Austrian heartland is crushed. The arrogance of the 'Habsburgs on whom the sun never sets' is finally shattered. Bohemia is the true master of Central Europe."
 boh_dominate_hre: "Dominate the Holy Roman Empire"
 boh_dominate_hre_desc: "Bohemia dominates the Holy Roman Empire. Beyond the imperial title realized by Charles IV in 1355, Bohemia now reigns as the undisputed leader of the entire Empire."
 boh_develop_prague: "Develop Prague"
 boh_develop_prague_desc: "Prague, 'City of a Hundred Spires' — spreading across both banks of the Vltava, this city entered its golden age in the 14th century as Central Europe's greatest city. Prague Castle, Charles Bridge, and the Old Town Square proclaim the glory of the Bohemian kingdom to the world."
 boh_charles_university: "Charles University"
 boh_charles_university_desc: "In 1348, Charles IV founded Charles University in Prague — Central Europe's first university. This institution of theology, law, medicine, and philosophy produced great reformers like Jan Hus. Build a university in Prague after 1348 to achieve this historic milestone."
 boh_golden_bull: "The Golden Bull"
 boh_golden_bull_desc: "The Golden Bull of 1356, promulgated by Charles IV, codified the Holy Roman Empire's electoral system and established the King of Bohemia as the Empire's most important elector. Make Bohemia's legal and political position unassailable."
 boh_bohemian_glass: "Bohemian Glass"
 boh_bohemian_glass_desc: "Born from Bohemia's crystal-clear waters and abundant quartz sand, Bohemian glass is prized in courts across Europe for its exquisite beauty. Develop the industry so that 'Bohemian crystal' becomes synonymous with Europe's finest quality."
 boh_silver_mines: "Kutná Hora Silver Mines"
 boh_silver_mines_desc: "The silver mines of Kutná Hora were the most productive in 14th-century Europe. This silver, minted as Prague Groschen, circulated throughout Central Europe and sustained Bohemia's economic golden age."
 boh_develop_moravia: "Develop Moravia"
 boh_develop_moravia_desc: "Moravia, centered on Brno and Olomouc, is an important part of the Bohemian Crown Lands. Develop this fertile agricultural region as the second cultural and administrative center of the Bohemian Empire."
 boh_internal_prosperity: "Internal Prosperity"
 boh_internal_prosperity_desc: "Bohemian glass, Kutná Hora silver, Prague's trade markets — combined, these make Bohemia Central Europe's greatest economic power."
 boh_jan_hus_question: "The Question of Jan Hus"
 boh_jan_hus_question_desc: "News arrives in Prague that Jan Hus has been burned at the Council of Constance (1415). 'Truth prevails' — his last words spread across all of Bohemia and ignite the Hussite Wars. In the storm of the Reformation, which path will Bohemia choose?"
 boh_suppress_heresy: "Suppress Heresy"
 boh_suppress_heresy_desc: "Bohemia maintains its loyalty to the Roman Church. By suppressing the Hussites as heretics and establishing Catholic faith as the cornerstone of the state, a firm alliance with the Pope is built."
 boh_crusade_against_hussites: "Crusade Against the Hussites"
 boh_crusade_against_hussites_desc: "The Pope has proclaimed a crusade against the Hussites. By leading the charge against heresy, Bohemia establishes its reputation as guardian of Catholic Central Europe."
 boh_papal_champion: "Champion of the Pope"
 boh_papal_champion_desc: "Deep trust with the papacy and steadfast Catholic faith — Bohemia is recognized as the strongest guardian of Catholic Central Europe."
 boh_hussite_reformation: "Hussite Reformation"
 boh_hussite_reformation_desc: "'Though burned, the truth shines from the flames' — Jan Hus's spirit takes root in Bohemia. The Utraquists (Hussites), symbolized by the chalice (kalich), become the nation's faith, achieving religious independence from Rome."
 boh_wagenburg: "Boží Bojovníci (Warriors of God)"
 boh_wagenburg_desc: "The Wagenburg (wagon fortress) tactic devised by Jan Žižka — connecting fortified wagons into a defensive formation — repeatedly defeated crusading heavy cavalry. Bohemia's military genius blossoms."
 boh_king_of_heretics: "King of Heretics"
 boh_king_of_heretics_desc: "Jiří z Poděbrad reigned as 'Bohemia's heretic king' despite excommunication by the Pope. Maintain prestige amid European diplomatic isolation and demonstrate the legitimacy of the Hussite state to the world."
 boh_hungarian_succession: "Hungarian Succession"
 boh_hungarian_succession_desc: "Bohemia and Hungary have formed personal unions multiple times through the Luxembourgs and Jagiellons. Place the wealthy Danubian kingdom centered on Buda under Bohemian suzerainty and solidify Central European dominance."
 boh_control_slovakia: "Control Slovakia"
 boh_control_slovakia_desc: "Slovakia is the ancestral home of the Great Moravian Empire, where Czech and Slovak brother peoples dwell. Securing this land strengthens Bohemia's Slavic foundations."
 boh_conquer_transylvania: "Conquer Transylvania"
 boh_conquer_transylvania_desc: "Transylvania — 'the land beyond the forest' — where Romanians, Hungarians, and Germans intermingle, serves as Christendom's forward bastion against the Ottoman Empire. Controlling it opens the road to the Balkans."
 boh_nicopolis_revenge: "Revenge for Nicopolis"
 boh_nicopolis_revenge_desc: "At the Battle of Nicopolis in 1396, the crusading army led by Sigismund of Bohemia suffered a catastrophic defeat against the Ottoman Empire. The time has come to avenge that humiliation — retake Nicopolis and drive the Ottomans from the Balkans."
 boh_defend_against_turks: "Bulwark Against the Turks"
 boh_defend_against_turks_desc: "The Ottoman Empire sweeps the Balkans and approaches the gates of Central Europe. Strengthen Transylvania's fortifications and become Christendom's shield with a powerful army. Bohemia is the 'Antemurale Christianitatis' — the bulwark of Christian civilization."
 boh_push_into_balkans: "Push Into the Balkans"
 boh_push_into_balkans_desc: "Avenge Nicopolis and advance southward as liberator of Christendom. Slavs, Greeks, and Bulgarians of the Balkans are freed under the Bohemian banner."
 boh_secure_silesia: "Secure Silesia"
 boh_secure_silesia_desc: "All of Silesia falls under Bohemian direct rule. Rich in iron and coal, this land becomes the core of the Bohemian industrial empire."
 boh_polish_ambitions: "Polish Ambitions"
 boh_polish_ambitions_desc: "Seize Kraków and establish Bohemia's relationship with the Polish kingdom. The heritage of the Přemyslid dynasty belongs to Bohemia — Poland should become a neighbor under Bohemian suzerainty."
 boh_conquer_poland: "Conquer Poland"
 boh_conquer_poland_desc: "The vast plains of Polish territory fall under Bohemian control. From the Vistula to the Oder, the Slavic lands are united under the Bohemian king's banner."
 boh_baltic_access: "Baltic Access"
 boh_baltic_access_desc: "With Gdańsk seized, Bohemia gains direct access to the Baltic Sea. Transformed from a landlocked nation, Bohemia now participates in northern trade as well."
 boh_bohemian_diet: "Bohemian Diet"
 boh_bohemian_diet_desc: "The Bohemian estates assembly (Zemský Sněm) — where nobles, clergy, and burghers participate — is a political institution. Strengthening it lays the groundwork for centralized imperial governance."
 boh_absolute_monarchy: "Absolute Monarchy"
 boh_absolute_monarchy_desc: "Absolute monarchy is established in Bohemia. By limiting noble privileges and fully consolidating royal power, Bohemia transforms into a modern centralized state."
 boh_great_power_army: "Army of a Great Power"
 boh_great_power_army_desc: "Wagenburg tactics, the Black Army, elite infantry — Bohemia's military innovations produce Central Europe's strongest army. Establish Bohemia's military supremacy with high army tradition and a large standing force."
 boh_dev_brno: "Develop Brno"
 boh_dev_brno_desc: "Brno, Moravia's capital, flourishes as an industrial and commercial city at the crossroads of trade routes."
 boh_dev_wroclaw: "Develop Wrocław"
 boh_dev_wroclaw_desc: "Wrocław on the Oder is the heart of Silesia. Its multicultural commercial tradition expands the wealth of the Bohemian Empire."
 boh_amber_road: "The Amber Road"
 boh_amber_road_desc: "The ancient Amber Road stretching from the Baltic to the Mediterranean crosses Bohemia. By controlling this trade route, Bohemia becomes the hub of north-south commerce."
 boh_dev_pest: "Develop Pest"
 boh_dev_pest_desc: "Pest, facing Buda across the Danube, is Hungary's greatest commercial city. Develop it as the economic center of the southern Bohemian Empire."
 boh_renaissance_court: "Renaissance Court"
 boh_renaissance_court_desc: "Charles IV's Prague was the center of Central European Renaissance where Italian, French, and Holy Roman cultures converged. Artists, scholars, and architects gather at Prague's court as a golden age of culture blossoms."
 boh_great_moravia_restored: "Great Moravia Restored"
 boh_great_moravia_restored_desc: "For the first time since the 9th-century Great Moravian Empire, all of Bohemia, Moravia, and Silesia are unified. The dream of Svatopluk and Rastislav is reborn in the modern era, and Bohemia shines as the center of Slavic civilization."
 boh_central_european_power: "Central European Power"
 boh_central_european_power_desc: "The three pillars — Great Moravia restored, internal prosperity, and absolute monarchy — align, and Bohemia reigns as Central Europe's greatest power. With 500+ locations, income 500+, and prestige 80+, seize that glory."
 boh_bohemian_commonwealth: "Bohemian Commonwealth"
 boh_bohemian_commonwealth_desc: "Prague, Vienna, Berlin, Kraków, Buda — the five great cities of Central Europe unified under the Bohemian banner. The crown that Jan the Blind sowed in 1337 now shines as an imperial crown. 'Bohemia non perit' — Bohemia does not perish — these words are inscribed in history forever."
 boh_krecy_legacy: "Legacy of Crécy"
 boh_krecy_legacy_desc: "At the Battle of Crécy in 1346, the Blind King Jan I stood on the battlefield despite his blindness and died a hero's death. 'I cannot see, but I can still fight' — this spirit is engraved in Bohemia's martial soul."
 boh_emperor_candidate: "Imperial Candidate"
 boh_emperor_candidate_desc: "The time has come to reclaim the Holy Roman Emperor title that Charles IV achieved in 1355. The King of Bohemia is the true rightful ruler of the Empire."
 boh_styria_carinthia: "Styria and Carinthia"
 boh_styria_carinthia_desc: "Subjugating Styria and Carinthia at the foot of the Alps establishes the Bohemian Empire's southern borders. These mineral-rich and agricultural lands support imperial prosperity."
 boh_kutna_hora_mint: "Kutná Hora Mint"
 boh_kutna_hora_mint_desc: "The Prague Groschen — minted from Kutná Hora's silver — was Central Europe's most trusted currency in the 14th century. Establish Bohemia's monetary supremacy through large-scale silver mining."
 boh_gothic_architecture: "City of Gothic Architecture"
 boh_gothic_architecture_desc: "St. Vitus Cathedral, Charles Bridge, Old Town Square — the magnificent Gothic architecture built by Charles IV transformed Prague into the 'Golden City.' Raise Prague's development and anticipate this architectural glory."
 boh_bohemian_trade_network: "Bohemian Trade Network"
 boh_bohemian_trade_network_desc: "A trade network centered on Prague, connecting Vienna, Wrocław, Kraków, and Nuremberg, sustains Bohemia's commercial supremacy."
 boh_compactata: "Compactata of Prague"
 boh_compactata_desc: "The Compactata of 1436 had the Catholic Church recognize Utraquist communion from the chalice as a concession. The moderate Utraquist path brings religious stability to Bohemia."
 boh_utraquist_church: "Utraquist Church"
 boh_utraquist_church_desc: "'Sub utraque specie' (under both kinds) — the Utraquist Church, giving both bread and wine to communicants, is established as Bohemia's state religion."
 boh_protestant_alliance: "Protestant Alliance"
 boh_protestant_alliance_desc: "Bohemia's Hussite tradition becomes the forerunner of Protestant reform. Through alliance with Lutherans and Calvinists, Bohemia is recognized as a pillar of the Protestant world."
 boh_black_army: "The Black Army"
 boh_black_army_desc: "The Black Army organized by King Matthias Corvinus — one of the first standing professional armies of medieval Europe. When this elite force fights under the Bohemian banner, nothing in Central Europe can stand against it."
 boh_danube_control: "Control the Danube"
 boh_danube_control_desc: "With Buda and Pest secured, the entire Danube basin falls under Bohemian control. As 'Mistress of the Danube,' Bohemia dominates southern trade and military affairs."
 boh_dev_berlin: "Develop Berlin"
 boh_dev_berlin_desc: "The small Brandenburg town of Berlin grows as the northern administrative hub of the Bohemian Empire."
 boh_dev_konigsberg: "Develop Königsberg"
 boh_dev_konigsberg_desc: "Königsberg (the King's Castle), built by Otakar II, returns to Bohemia and becomes a hub of Baltic trade."
 boh_great_king: "The Great King"
 boh_great_king_desc: "High prestige, great legitimacy, rich income — the King of Bohemia's name as one of Central European history's greatest rulers echoes across all of Europe, surpassing even the glory of Charles IV."
 boh_fortress_europe: "Fortress of Europe"
 boh_fortress_europe_desc: "A fortress network stretching from the Alps to the Carpathians holds back the Ottoman advance. Bohemia functions as the 'Shield of Europe.'"
 boh_dev_olomouc: "Olomouc Flourishes"
 boh_dev_olomouc_desc: "Olomouc, Moravia's ancient city of learning and episcopal seat, shines as a center of northern Renaissance culture."
 boh_upper_austria: "Upper Austria"
 boh_upper_austria_desc: "Upper Austria along the upper Danube is incorporated into the Bohemian Empire, establishing a foundation for further southern advance."
 boh_carpathian_defense: "Carpathian Defense"
 boh_carpathian_defense_desc: "A fortress network along the Carpathian Mountains establishes a solid eastern defensive line for the Bohemian Empire — a shield against the Ottoman Empire, Tatars, and other eastern threats."
 boh_events.20.t: "Habsburg Crushed — Bohemian Supremacy"
 boh_events.20.d: "Vienna falls and Habsburg pride is shattered. 'The Habsburg dominance of Central Europe, continuing since Rudolf, has ended' — these words ring through Prague's court. The King of Bohemia is now the true master of Central Europe. Historians will later write: 'The House of Luxembourg was the true heir of the Empire.'"
 boh_events.20.a: "Long live Bohemia! The age of the Habsburgs is over!"
 boh_events.40.t: "The Question of Jan Hus — The Choice of Faith"
 boh_events.40.d: "News that Jan Hus has been executed at the Council of Constance reaches Prague. 'Though burned at the stake, truth shall prevail in a hundred years' — Hus's last words spread across all of Bohemia. Now the King of Bohemia faces a choice: maintain loyalty to Rome — or carry forward Hus's reformation."
 boh_events.40.a: "Hold loyalty to Rome — Catholicism is Bohemia's faith"
 boh_events.40.b: "Carry forward Hus's spirit — keep the flames of reform burning"
 boh_events.50.t: "Great Moravia Restored"
 boh_events.50.d: "Bohemia, Moravia, and Silesia are united. Four hundred years after the collapse of the Great Moravian Empire built by Svatopluk — that legacy is reborn in the modern era. In Prague's court, the King of Bohemia declares the title 'Rex Slavorum' — King of the Slavs."
 boh_events.50.a: "Long live Great Moravia! Glory to Slavic unity!"
 boh_events.99.t: "Birth of the Bohemian Commonwealth"
 boh_events.99.d: "Prague, Vienna, Berlin, Kraków, Buda — the five great cities of Central Europe unified under the Bohemian banner. The crown that Jan the Blind sowed in 1337 now shines as an imperial crown. When the spires of Gothic cathedrals soar over Prague's sky, the words 'Bohemia non perit' — Bohemia does not perish — are inscribed in history forever."
 boh_events.99.a: "Long live the Bohemian Commonwealth! May the master of Central Europe endure forever!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "Legacy of the Blind King"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "'I cannot see, but I can still fight' — the spirit of Jan I, the Blind King, laid the cornerstone of the Bohemian kingdom."
