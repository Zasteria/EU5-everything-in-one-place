 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "The rivalry between the House of Luxembourg and the Habsburgs for imperial dominance intensifies."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "Iron of Silesia"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "Silesia's abundant iron ore supports the foundation of Bohemia's defense industry."
 STATIC_MODIFIER_NAME_boh_saxony_mod: "Control of Saxony"
 STATIC_MODIFIER_DESC_boh_saxony_mod: "Dresden, the Elbe's great trading city, falls under Bohemian control."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Master of the Holy Roman Empire"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "Bohemia reigns as the undisputed leader of the Holy Roman Empire. Administrative efficiency and diplomatic influence reach their peak."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Prague, City of a Hundred Spires"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Prague on the Vltava is developed as Central Europe's greatest city."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Charles University"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "Central Europe's first university opens in Prague — shining as a center of learning and reform."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "The Golden Bull"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "The King of Bohemia's electoral status is established by the Golden Bull."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "Bohemian Glass"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "Bohemian crystal establishes its reputation as Europe's finest craftsmanship."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "Silver of Kutná Hora"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "Central Europe's greatest silver mine sustains Bohemia's economic golden age. Prague Groschen circulates widely."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Moravian Integration"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "Moravia centered on Brno and Olomouc is integrated into the Bohemian Empire."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "Internal Prosperity"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "Bohemian glass, silver, and trade markets combine to create Central Europe's greatest economic power."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Steadfast Catholic Faith"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "Bohemia, maintaining loyalty to the Roman Church, is recognized as guardian of Central European Catholic civilization."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Crusader Glory"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Leading the anti-Hussite crusade, Bohemia earns the reputation of Christendom's defender."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Shield of the Pope"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "Deep trust with the papacy makes Bohemia the leader of Catholic Central Europe."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "Hussite Church"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "Jan Hus's spirit takes root in Bohemia — an independent religious reform path is established."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Wagenburg Tactics"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "Jan Žižka's revolutionary tactics inhabit the Bohemian army. Wagon fortresses crush crusading cavalry."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Prestige of the Heretic King"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Maintaining prestige despite papal excommunication, the Bohemian king overcomes diplomatic isolation."
 STATIC_MODIFIER_NAME_boh_hungary_union_mod: "Hungarian Personal Union"
 STATIC_MODIFIER_DESC_boh_hungary_union_mod: "The wealthy Danubian kingdom of Hungary falls under Bohemian suzerainty."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Slovak Integration"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "Slovakia, ancestral home of the Great Moravian Empire, is integrated into Bohemia — Slavic foundations strengthened."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "Transylvania"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "The land beyond the forest falls under Bohemian rule — a foothold for Balkan expansion established."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "Revenge for Nicopolis"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "The humiliation of 1396 is avenged. Bohemia becomes the vanguard of the counteroffensive against the Ottoman Empire."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Shield of Christendom"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "Transylvania's fortresses become the shield that halts the Ottoman advance."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Liberator of the Balkans"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "Bohemia advances southward as liberator of Slavs and Christians of the Balkans."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Silesia Fully Integrated"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "All of Silesia under direct Bohemian rule — iron and coal industrial foundations established."
 STATIC_MODIFIER_NAME_boh_polish_claim_mod: "Influence over Poland"
 STATIC_MODIFIER_DESC_boh_polish_claim_mod: "Seizing Kraków, Bohemia establishes diplomatic influence over Poland."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Poland Subjugated"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "The Polish plains fall under Bohemian control — foundation for eastern expansion established."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Baltic Access"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "With Gdańsk seized, Bohemia can participate directly in Baltic trade."
 STATIC_MODIFIER_NAME_boh_diet_mod: "Bohemian Diet"
 STATIC_MODIFIER_DESC_boh_diet_mod: "The Zemský Sněm is strengthened — foundations for centralized imperial governance laid."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Absolute Monarchy"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "Absolute monarchy established in Bohemia — transformed into a modern centralized state."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Army of a Great Power"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "Bohemia's elite army, heir to Wagenburg and Black Army traditions, boasts Central Europe's greatest military power."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Brno Flourishes"
 STATIC_MODIFIER_DESC_boh_brno_mod: "Moravia's capital Brno develops as a center of trade and industry."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Wrocław Flourishes"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Wrocław on the Oder functions as the heart of Silesian economy."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "The Amber Road"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "Bohemia controlling the ancient Amber Road from Baltic to Mediterranean becomes the hub of north-south commerce."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Pest Flourishes"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Pest on the Danube is developed as the commercial center of the southern Bohemian Empire."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "Renaissance Court"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Prague becomes the center of Central European Renaissance where Italian, French, and Central European cultures converge."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Great Moravia Restored"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "For the first time since Svatopluk, Bohemia, Moravia, and Silesia are unified — the center of Slavic civilization reborn."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Central European Power"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "Bohemia reigns as Central Europe's greatest power, establishing supremacy in empire, culture, and military."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "Legacy of Crécy"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "The heroic death of the Blind King is passed down as Bohemia's military pride."
 STATIC_MODIFIER_NAME_boh_emperor_candidate_mod: "Imperial Candidate"
 STATIC_MODIFIER_DESC_boh_emperor_candidate_mod: "The King of Bohemia is recognized as the imperial candidate at the Electoral College."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Alpine Lands"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Styria and Carinthia integrated into the Bohemian Empire — southern Alpine defenses strengthened."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "Prague Groschen"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "Prague Groschen minted from Kutná Hora's silver becomes Central Europe's greatest international currency."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "Golden Prague"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "St. Vitus, Charles Bridge, the Hundred Spires — Prague becomes Central Europe's greatest cultural center as the 'Golden City.'"
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "Bohemian Trade Network"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "A Central European trade network centered on Prague sustains Bohemia's commercial supremacy."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Compactata of Prague"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Catholic-Utraquist reconciliation achieved — religious stability restored to Bohemia."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "Utraquist Church"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "The Utraquist Church of communion under both kinds established as Bohemia's state religion."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "Protestant Alliance"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "Bohemia with its Hussite tradition recognized as a pillar of the Protestant world."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "The Black Army"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "The Black Army spirit inhabits Bohemia — Central Europe's strongest professional army complete."
 STATIC_MODIFIER_NAME_boh_danube_mod: "Mistress of the Danube"
 STATIC_MODIFIER_DESC_boh_danube_mod: "With Buda and Pest secured, Bohemia dominates Danube commerce and military affairs."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Berlin Developed"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "The small northern town of Berlin grows as the Bohemian Empire's northern administrative hub."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Königsberg Returns"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "Königsberg built by Otakar II returns to Bohemia and becomes a Baltic trade hub."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "The Great King"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "The Bohemian king's name is inscribed in Central European history as its greatest ruler, surpassing even Charles IV."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Fortress of Europe"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "A fortress network from the Alps to the Carpathians holds back the Ottoman advance."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Olomouc Flourishes"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Olomouc, Moravia's center of learning and religion, shines as a hub of northern Renaissance culture."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Upper Austria"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Upper Austria incorporated into the Bohemian Empire — foundation for southern advance established."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Carpathian Defense"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "A fortress network along the Carpathians becomes the shield protecting the Bohemian Empire's eastern border."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Glory of the Bohemian Commonwealth"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "The Bohemian Commonwealth controlling Central Europe's five great cities is complete. 'Bohemia non perit' — these words are engraved in history forever."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Habsburg Crushed"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Vienna falls and Habsburg dominance of Central Europe ends. Bohemia stands as the true master."
 STATIC_MODIFIER_NAME_boh_faith_steadfast_mod: "Steadfast in Faith"
 STATIC_MODIFIER_DESC_boh_faith_steadfast_mod: "Unwavering Catholic devotion strengthens Bohemian royal legitimacy."
 STATIC_MODIFIER_NAME_boh_hus_reform_winds_mod: "Winds of Hussite Reform"
 STATIC_MODIFIER_DESC_boh_hus_reform_winds_mod: "Jan Hus's teachings spread across Bohemia. The flames of religious reform rise."
 boh_fortress_of_europe: "Fortress of Europe"
 boh_fortress_of_europe_desc: "A fortress network stretching from the Alps to the Carpathians holds back the Ottoman advance. Bohemia functions as the 'Shield of Europe.'"
 boh_dev_plzen: "Develop Plzeň"
 boh_dev_plzen_desc: "Plzeň — a key city of western Bohemia and future birthplace of the world-famous Pilsner beer. Located at the confluence of the Ohře and Mže rivers, developing this city promotes commerce and industry throughout western Bohemia."
 boh_dev_cheb: "Develop Cheb"
 boh_dev_cheb_desc: "Cheb, the ancient city on the Ohře, is the imperial gateway where German and Bohemian cultures intersect. Develop this city commanding the trade routes with the Holy Roman Empire as a bridgehead for western diplomacy."
 boh_dev_kutna_hora_city: "Develop Kutná Hora"
 boh_dev_kutna_hora_city_desc: "Glittering with silver wealth, Kutná Hora developed into Bohemia's second city after Prague. With St. Barbara's Cathedral under construction, develop this city into a true metropolis and establish it as the economic heart of Bohemia."
 boh_bohemian_agriculture: "Bohemian Agriculture"
 boh_bohemian_agriculture_desc: "The Bohemian lowlands along the Elbe are a rich agricultural zone. Wheat, barley, and rye ripen in abundance, and farm development greatly increases productivity. A stable food supply supports population growth across the Bohemian Empire."
 boh_moravian_wine: "Moravian Wine"
 boh_moravian_wine_desc: "Southern Moravia around Znojmo is Bohemia's greatest grape-growing region. The warm climate and limestone soil nurture Moravian wines prized even in the courts of Austria and Vienna. Their rich flavor symbolizes the cultural refinement of the Bohemian Empire."
 boh_jihlava_silver: "Jihlava Silver Mines"
 boh_jihlava_silver_desc: "Jihlava, in the Bohemian-Moravian Highlands, is a silver mining city rivaling Kutná Hora. Bringing these silver mines to full operation further expands Bohemia's silver production and increases the minting of Prague Groschen."
 boh_opava_iron: "Opava Iron Industry"
 boh_opava_iron_desc: "Opava, capital of the Duchy of Silesia, is known for its iron ore deposits. Developing this city's steel industry further strengthens Silesia's industrial foundation and dramatically improves Bohemian military equipment."
 boh_dev_litomerice: "Develop Litoměřice"
 boh_dev_litomerice_desc: "Litoměřice on the Elbe is an important trading city in northern Bohemia. Developing it as the hub of the trade route extending to Hamburg through the Elbe activates commerce with northern Germany."
 boh_silesian_mines: "Silesian Mines"
 boh_silesian_mines_desc: "Beneath Silesia's soil lie the iron and coke coal that will support future industrial revolutions. Establish a full-scale mining system and dramatically raise the Bohemian Empire's industrial production capacity."
 boh_bohemian_cloth: "Bohemian Cloth Industry"
 boh_bohemian_cloth_desc: "Alongside Bohemian glass, Bohemia's textile and cloth industry is establishing its European reputation. Northern Bohemian cloth combined with Litoměřice's trade routes makes Bohemia a center of the textile industry."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Plzeň Developed"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Plzeň, key city of western Bohemia, developed as a center of commerce and industry."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Cheb Developed"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Cheb, western gateway, functions as the trading hub with the Empire."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Kutná Hora City"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "Bohemia's silver-rich second city has developed into a full metropolis."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Bohemian Agriculture"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "The fertile Elbe agricultural zone is developed — stable food supply secured."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Znojmo Vineyards"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "Southern Moravian viticulture matures, producing high-quality wine."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Moravian Wine"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "Moravian wine becomes a prized product even at the Austrian court in Vienna."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Jihlava Silver Mine"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "Jihlava's silver mines operate at full capacity — a silver producer rivaling Kutná Hora."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Opava Steel Industry"
 STATIC_MODIFIER_DESC_boh_opava_mod: "The steel industry is developed in Opava, capital of the Duchy of Silesia."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Litoměřice Trade Hub"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Litoměřice on the Elbe develops as a hub of northern Germany trade routes."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Silesian Mines"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "Silesia's rich iron and coal mines operate at full capacity — Bohemian industrial power dramatically increased."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Bohemian Cloth Industry"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "Bohemia's textile and cloth industry established alongside glass as a major export."
 boh_sugar_beet: "Sugar Beet Cultivation"
 boh_sugar_beet_desc: "The Age of Revolution — scientific and industrial innovation transforms Bohemian agriculture. Sugar beet is the ideal crop for Bohemia's cool climate. Sugar production, once a monopoly of sugarcane, now emerges from Bohemian farmlands. The new agricultural techniques of the Industrial Revolution modernize Bohemian farming."
 boh_porcelain_industry: "Bohemian Porcelain Industry"
 boh_porcelain_industry_desc: "The Age of Revolution — the kaolin (china clay) of western Bohemia is Europe's finest porcelain material. Bohemian porcelain born from the white clay around Karlsbad (Karlovy Vary) rivals the exquisite craftsmanship of Meissen porcelain from Dresden, adorning courts across Europe."
 STATIC_MODIFIER_NAME_boh_sugar_beet_mod: "Sugar Beet Industry"
 STATIC_MODIFIER_DESC_boh_sugar_beet_mod: "Revolutionary age agricultural technology brings sugar beet production to Bohemia."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Bohemian Porcelain"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "Porcelain from western Bohemian kaolin becomes a luxury product adorning European courts."
 boh_jan_hus_question_desc: "The reformist spirit of Jan Hus is spreading across all of Bohemia. The memory of his burning at the Council of Constance (1415) is deeply engraved in the hearts of Bohemians, and fury toward the Roman Church is at the breaking point. When the question of faith can no longer be avoided, Bohemia must define its own path."
 boh_events.60.t: "Sugar Beet Cultivation Site — Dawn of a New Industry"
 boh_events.60.d: "1737 — Technology for manufacturing sugar from sugar beet (Beta vulgaris) has been developed across Europe. Bohemia's fertile farmlands are ideal for cultivating this new crop. Which location will host the first sugar beet farm — Poděbrady or Hradec Králové?"
 boh_events.60.a: "Plant sugar beets in Poděbrady's farmlands (birthplace of the 'Heretic King' Jiří)"
 boh_events.60.b: "Plant sugar beets in Hradec Králové's farmlands (fertile lands along the Elbe)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "Truth of Hus"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Jan Hus's reformist spirit takes root in Bohemia's faith. Tolerance and religious self-awareness grow."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Sugar Beet Farm"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "Sugar beet cultivation matures — Bohemian-made sugar exported to European markets."
 boh_conquer_silesia: "Integrate Silesia"
 boh_conquer_silesia_desc: "Silesia is part of the Bohemian Crown Lands. Integrating this region, rich in iron ore and silver, dramatically strengthens Bohemia's industrial and military foundation."
 boh_events.50.b: "No, preserve Bohemia's traditional colors — there is no need to change"
 boh_urban_privileges: "Bohemian Urban Privileges"
 boh_urban_privileges_desc: "With Brno and Olomouc developed, Bohemia has established a system for granting unique privileges to its cities. In feudal cities dominated by nobles, peasant bonds are strengthened; in ecclesiastical cities under clergy control, religious conversion is promoted. These privileges define each city's character and enrich Bohemia's diverse urban culture."
 STATIC_MODIFIER_NAME_boh_feudal_city_rights: "Feudal City Rights"
 STATIC_MODIFIER_DESC_boh_feudal_city_rights: "Noble authority is strengthened, stabilizing rural control and regional governance. Peasant emancipation is suppressed."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Ecclesiastical City Rights"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "Clerical authority is strengthened, promoting religious conversion and maintaining order."
 boh_urban_privileges: "Bohemian Urban Privileges"
 boh_urban_privileges_desc: "With Brno and Olomouc developed, Bohemia has established a system for granting unique privileges to its cities. Feudal cities strengthen noble control while suppressing peasant emancipation; ecclesiastical cities promote religious conversion."
 STATIC_MODIFIER_NAME_boh_feudal_city_rights: "Feudal City Rights"
 STATIC_MODIFIER_DESC_boh_feudal_city_rights: "Noble authority strengthened — regional control and social stability improve. Peasant emancipation is suppressed."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Ecclesiastical City Rights"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "Clerical authority strengthened — religious conversion and order maintenance promoted."
 boh_urban_privileges_unlock_tt: "Unlocks the Feudal City (Poddanská nebo vrchnostenská města) and Ecclesiastical City (Biskupská nebo klášterní města) town privileges."
