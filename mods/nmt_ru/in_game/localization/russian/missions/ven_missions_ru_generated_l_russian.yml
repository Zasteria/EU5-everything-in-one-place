 ven_dominate_eastern_trade_tooltip: "Monthly trade and tax income 100+."
 ven_greek_bridgehead: "Bridgehead in Greece"
 ven_greek_bridgehead_desc: "Secure Crete and Modon, establishing a bridgehead into mainland Greece and the Aegean."
 ven_greek_bridgehead_tooltip: "Secure athens."
 ven_pearl_of_adriatic: "Recovering the Pearl of the Adriatic"
 ven_pearl_of_adriatic_desc: "Restore the prosperity of the trading city of Ragusa, bringing the wealth known as the 'Pearl of the Adriatic' to the Republic."
 ven_pearl_of_adriatic_tooltip: "dubrovnik population 20,000+."
 ven_protect_corfu: "Protecting Corfu"
 ven_protect_corfu_desc: "Station a garrison on Corfu, which commands the entrance to the Adriatic, and ensure its security."
 ven_protect_corfu_tooltip: "corfu control 60%+."
 ven_occupy_cyprus: "Occupation of Cyprus"
 ven_occupy_cyprus_desc: "Secure Larnaca, making the strategically vital island of Cyprus a territory of the Republic."
 ven_occupy_cyprus_tooltip: "Secure larnaca."
 ven_second_conquest_of_constantinople: "The Second Conquest of Constantinople"
 ven_second_conquest_of_constantinople_desc: "As the Fourth Crusade once achieved, bring Constantinople under the Republic's control once again."
 ven_second_conquest_of_constantinople_tooltip: "Secure constantinople."
 ven_queen_of_the_adriatic: "The Queen of the Adriatic"
 ven_queen_of_the_adriatic_desc: "Complete the trade and defense network across the Adriatic, elevating the Republic to the status known as the 'Queen of the Adriatic'."
 ven_queen_of_the_adriatic_tooltip: "Navy size 200+."
 ven_pen_not_sword: "Take Up the Pen, Not the Sword"
 ven_pen_not_sword_desc: "Secure the Republic's interests in the eastern Mediterranean through diplomacy and treaties rather than military force, ensuring lasting prosperity."
 ven_pen_not_sword_tooltip: "Own 200+ trade office buildings worldwide."
 ven_latin_empire: "The Empire of the Latins"
 ven_latin_empire_desc: "Establish a new Empire of the Latins centered on Constantinople, marking the Republic's place in history as the master of the Mediterranean."
 ven_latin_empire_tooltip: "Secure constantinople. Own all locations in the Northern Greece, Morea, Aegean Archipelago, Thrace, and Macedonia areas."
 ven_grand_strategy_mission_pack: "The Grand Strategy of the Maritime Republic"
 ven_grand_strategy_mission_pack_desc: "The small republic built upon a lagoon walks two paths at once: expansion onto the mainland and the construction of a maritime empire. Complete the Terraferma, become the Queen of the Adriatic, and ultimately carve your name into history as the center of Italy — or as heir to the Empire of the Latins."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP: "Establish the Republic's hegemony on both land and sea."
 ven_grand_strategy_mission_pack_DESCRIPTION: "The small republic built upon the lagoon walks two paths at once: expansion onto the mainland, and the building of a maritime empire. As Queen of the Adriatic, carve your name into the history of the Mediterranean."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS: "Complete the Terraferma, become Queen of the Adriatic, and stand as heir to the Empire of the Latins — carve the Republic's name into history!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION: "As Venice, complete the Terraferma and become the Queen of the Adriatic."
 ven_events.1.t: "The Fall of the della Scala"
 ven_events.1.d: "The war against the della Scala tyrants of Verona ends in Venetian victory. The citizens of Treviso and Vicenza welcome their new rulers. The first step onto the mainland has been taken."
 ven_events.1.a: "Welcome the new territories"
 ven_events.2.t: "The Rise of the Terraferma"
 ven_events.2.d: "Verona and Bergamo join under the Republic's banner. The rich farmland and commercial cities of the Lombard plain further strengthen Venice's economic power."
 ven_events.2.a: "Support the new territories' economic development"
 ven_events.3.t: "The Splendor of the Doge's Palace"
 ven_events.3.d: "The rebuilt Doge's Palace stands complete, embodying the authority of the Doge and the prestige of the Republic. In its halls, nobles gather to debate the Republic's future."
 ven_events.3.a: "Celebrate the palace's completion"
 ven_events.4.t: "Expansion of the Arsenale"
 ven_events.4.d: "The state shipyard, the Arsenale, has been expanded, now producing galleys and merchant ships on an unprecedented scale. The Republic's naval power reaches new heights."
 ven_events.4.a: "Inspect the expanded Arsenale"
 ven_events.5.t: "The Completion of the City of Water"
 ven_events.5.d: "Canals, trading houses, libraries, shipyards — the city built upon the lagoon has achieved a prosperity unmatched in the world. The 'City of Water' has become worthy of its name."
 ven_events.5.a: "Proclaim the completion of the City of Water"
 ven_events.6.t: "The War over Ferrara"
 ven_events.6.d: "Relations with the Papal States grow tense over the status of Ferrara. The clergy condemn the Republic's ambitions, but the citizens welcome the acquisition of new territory."
 ven_events.6.a: "Address the tension with the Papal States"
 ven_events.7.t: "Render unto Caesar"
 ven_events.7.d: "The Republic has clarified the boundary between clerical privilege and secular commercial activity. The Church's authority is respected, but trade and commerce remain firmly under the Republic's control."
 ven_events.7.a: "Proclaim the establishment of secular authority"
 ven_events.8.t: "The Collapse of the League of Cambrai"
 ven_events.8.d: "The League of Cambrai, formed by the Pope, the Holy Roman Emperor, France, and Spain, sought to partition the Republic. But internal divisions caused the league to collapse, and Venice retained its independence."
 ven_events.8.a: "Witness the league's collapse"
 ven_events.9.t: "The Terraferma, Completed"
 ven_events.9.d: "The vast territories of northern Italy have at last been integrated into the Republic's system of governance. The Terraferma now stands as an unshakable foundation of Venice's economic and military strength."
 ven_events.9.a: "Celebrate the completion of the Terraferma"
 ven_events.10.t: "The Center of Italy"
 ven_events.10.d: "Having amassed power on both land and sea, the Republic is no longer merely a regional power on the Italian peninsula. The other states watch Venice's every move, and a new order on the peninsula begins to take shape."
 ven_events.10.a: "Establish a leading position in Italy"
 ven_events.11.t: "The Gateway to the Adriatic"
 ven_events.11.d: "With Zara and Pola under the Republic's control, key positions commanding the entrance to the Adriatic have been secured. The Republic's fleets can now sail with greater safety."
 ven_events.11.a: "Strengthen the defenses of the new outposts"
 ven_events.12.t: "Genoa's Retreat from the Black Sea"
 ven_events.12.d: "Genoa, the Republic's long-time rival, has lost its major footholds in the Black Sea trade. Venetian merchants begin moving into the newly opened markets."
 ven_events.12.a: "Support the expansion into new markets"
 ven_events.13.t: "A Foothold in the Aegean"
 ven_events.13.d: "With Crete and Modon secured, a foothold into the Aegean and mainland Greece is established. The Republic's merchant ships extend their eastern routes further, using these ports as waypoints."
 ven_events.13.a: "Develop the new waypoint ports"
 ven_events.14.t: "The Pearl of Cyprus"
 ven_events.14.d: "Famagusta and Nicosia have joined the Republic's domain. The strategically vital island of Cyprus brings further wealth to the Republic through the trade of spices, sugar, and cotton."
 ven_events.14.a: "Develop Cyprus's economy"
 ven_events.15.t: "To Constantinople, Once More"
 ven_events.15.d: "For the first time since the Fourth Crusade, Venice has achieved the occupation of Constantinople. The memory of the old partition stirs the Republic's ambitions once again."
 ven_events.15.a: "Build a new system of governance"
 ven_events.16.t: "The Queen of the Adriatic"
 ven_events.16.d: "The prosperity of Ragusa, called the 'Pearl of the Adriatic', and the solid defenses of Corfu are now complete. The Republic is no longer merely a power in the Adriatic — it is the master of the sea itself."
 ven_events.16.a: "Accept the title 'Queen of the Adriatic'"
 ven_events.17.t: "The Triumph of the Pen"
 ven_events.17.d: "The Republic has secured its interests in Cyprus and the surrounding region not through military force, but through diplomacy and treaties. 'Take up the pen, not the sword' — this becomes the Republic's new creed."
 ven_events.17.a: "Celebrate the diplomatic triumph"
 ven_events.18.t: "The Empire of the Latins, Reborn"
 ven_events.18.d: "A new Empire of the Latins has been established, centered on Constantinople. The trade routes of the Mediterranean, the granaries of the mainland, and the wealth of the East — all now lie in Venice's hands. The Republic has raised up a new vassal state, the \"Latin Empire,\" with its capital at Constantinople, to govern Thrace, Macedonia, the Greek mainland, the Morea, and the Aegean isles — and the small republic of the Adriatic now stands as an empire in its own right. The Senate proclaims the Republic's new imperial status to the world."
 ven_events.18.a: "Proclaim the establishment of the Empire of the Latins"
