 STATIC_MODIFIER_NAME_ven_unified_fleet: "The Unified Fleet"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "The unified fleet stands ready to set sail at a moment's notice."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Protection of the Black Sea Trade"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Escorted convoys sail confidently from the port of Negroponte toward the Black Sea."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "The Adriatic Secured"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "The harbors of Zara and Pola now serve as safe havens for the Republic's ships."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "The Trading Post of Zadar"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "At the rebuilt port of Zadar, merchant ships crossing the Adriatic unload their cargo one after another."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Victory over the Genoese Rivalry"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "The Genoese banner no longer flies over the trading posts of the Black Sea."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Dominance of the Aegean"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Ships bearing the Republic's flag pass constantly through the ports of Crete and Naxos."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Dalmatia Subdued"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "The Dalmatian coastline is now drawn on every map as the Republic's own."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Dominance of the Eastern Trade"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "Spices and silk from the East now pass through Venice's markets as a matter of course."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "The Greek Bridgehead Secured"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "From Crete and Modon, the Republic's ships push further east across the Greek seas."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "The Pearl's Prosperity"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "The markets of Ragusa once again echo with the voices of merchants, restored to their former vigor."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "The Garrison of Corfu"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "The garrison atop Corfu's walls keeps a quiet watch over the gateway to the Adriatic."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Cyprus Secured"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "Sugar and cotton from Cyprus's ports fill the Republic's warehouses."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Foundation of the Latin Empire"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "Once again, the banner of the Latins flies over the palaces of Constantinople. Under the Republic's rule, people of many faiths live in quiet peace."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "The Queen of the Adriatic"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "As ruler of the Adriatic, the Republic gains the authority to appoint another admiral to command its fleets."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Mastery of Diplomacy"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "The Republic's envoys secure favorable terms without ever drawing the sword. Foreign hostility toward the Republic eases, and its negotiators press their advantage in war with great skill."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "The Empire of the Latins"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "The trade routes of the Mediterranean, the granaries of the mainland, the wealth of the East — all now lie in Venice's hands."
 ven_italian_unity_unlock_tt: "Venice has completed the foundation of Italian unity. La Serenissima unifies the Italian peninsula from the Adriatic to the Alps — for the first time since ancient Rome, all of Italy governed under a single banner."
 ven_latin_empire_unlock_tt: "The Latin Empire (LAT), with Constantinople as its capital, is founded as a subject state under Venetian protection."
