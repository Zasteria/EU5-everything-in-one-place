 ven_expel_genoa_black_sea_tooltip: "Secure kaffa and tana."
 ven_aegean_expansion: "Expansion in the Aegean"
 ven_aegean_expansion_desc: "Secure Crete and Naxos, expanding the Republic's foothold in the Aegean Sea."
 ven_aegean_expansion_tooltip: "Secure candia and naxos."
 ven_dalmatian_subjugation: "Subjugation of Dalmatia"
