 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "The Eternal Crown of Saint Stephen"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "On Christmas Day in the year 1000, Pope Sylvester II sent a crown to István, Duke of the Hungarians, making him Stephen I — the first King of Hungary. That crown — the Holy Crown of Saint Stephen — came to be seen as the very essence of the Hungarian state: a king without it was no king of Hungary at all. Now, centuries later, diplomats from every corner of the world make pilgrimage to the Hungarian court to acknowledge its supremacy."
