l_russian:
 hun_crown_of_saint_stephen_mission_pack: "Crown of Saint Stephen"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION: "In 1337, the Kingdom of Hungary is ruled by King Charles I (Károly Róbert) of the Angevin dynasty. His heir, the brilliant Louis — later known as Louis the Great — waits in the wings, with a personal union with Poland to come in the next generation. This realm, centered on the Carpathian Basin, has ambitions in every direction: north through Poland and Bohemia, south into the Balkans, east against the Ottomans, and west to the Adriatic. Build the Black Army, bring the Renaissance to Buda, and stand as the Bulwark of Christendom."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION: "As Hungary, expand north through Poland and Bohemia, secure the Balkans, defeat the Ottomans, reach the Adriatic, and complete domestic reforms."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP: "Complete missions to restore the glory of the Crown of Saint Stephen."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS: "From the Angevin dynasty to the age of Matthias Corvinus — Hungary's greatest days await!"
 hun_crown_of_st_stephen: "Crown of Saint Stephen"
 hun_crown_of_st_stephen_desc: "Saint Stephen I founded the Kingdom of Hungary in 1000 AD, driving the conversion to Christianity. The Crown of Saint Stephen — the Holy Crown — remains the sacred symbol of Hungarian kingship to this day. In 1337, the Angevin dynasty holds this crown and rules over the greatest kingdom in Central Europe. Secure Buda and Esztergom and consolidate the foundations of the realm."
 hun_crown_of_st_stephen_tooltip: "Buda and Esztergom owned by us or a subject, legitimacy 50 or more"
 hun_angevin_diplomacy: "Angevin Diplomacy"
 hun_angevin_diplomacy_desc: "Hungary's Angevin dynasty has complex dynastic ties to Naples, Poland, and Bohemia. Louis I's mother Elisabeth was the sister of Polish King Casimir III, opening the prospect of inheriting the Polish crown. Build a network of alliances and elevate Angevin diplomatic influence across Central Europe."
 hun_angevin_diplomacy_tooltip: "2 or more allies, monthly legitimacy 0.05 or more"
 hun_polish_union: "Personal Union with Poland"
 hun_polish_union_desc: "When Casimir III the Great died without a male heir in 1370, his nephew Louis I became King of Poland as well as Hungary. This Hungarian-Polish personal union was the beginning of a powerful dual monarchy in Central Europe. Two great kingdoms under one king — the balance of power in Central Europe shifts dramatically."
 hun_polish_union_tooltip: "In personal union with or have Poland (c:POL) as subject"
 hun_bohemian_ambitions: "Bohemian Ambitions"
 hun_bohemian_ambitions_desc: "The Kingdom of Bohemia, hotbed of the Hussite heresy, is wracked by religious turmoil. As Angevins, Luxembourgs, and Habsburgs compete for the Bohemian crown, Hungary also has a legitimate claim. Seizing Prague creates a Hungarian-Bohemian dual kingdom at the heart of Central Europe."
 hun_bohemian_ambitions_tooltip: "Prague owned by us or a subject"
 hun_lord_of_the_north: "Lord of the North"
 hun_lord_of_the_north_desc: "Seizing Krakow and Gdansk extends Hungarian dominion to the Baltic Sea, creating a vast Central European empire from the Adriatic to the Baltic. The glory of the Piast and Angevin dynasties of Poland revives under the Hungarian crown."
 hun_lord_of_the_north_tooltip: "Krakow and Gdansk owned by us or a subject"
 hun_secure_transylvania: "Securing Transylvania"
 hun_secure_transylvania_desc: "Transylvania (Erdély) is a semi-autonomous eastern region of the Kingdom of Hungary, inhabited by a mix of Saxons, Hungarians, and Romanians. This land is also the frontline of defense against the Ottoman Empire. Fortify Timisoara as the anchor of the eastern borderlands."
 hun_secure_transylvania_tooltip: "Timisoara owned by us or a subject, own 5 or more locations in Transylvania area"
 hun_conquer_serbia: "Conquer Serbia"
 hun_conquer_serbia_desc: "The Kingdom of Serbia became an Ottoman vassal following the Battle of Kosovo (1389). But for Hungary, Belgrade (Nándorfehérvár) is the indispensable key to the Danube defense. In 1440, Skanderbeg and János Hunyadi's legendary defense of Belgrade against the Ottomans — let that battle be fought here."
 hun_conquer_serbia_tooltip: "Belgrade owned by us or a subject"
 hun_subjugate_wallachia: "Subjugate Wallachia"
 hun_subjugate_wallachia_desc: "Wallachia (Havasalföld) has historically acknowledged Hungarian suzerainty. Vlad II — father of Vlad the Impaler — received the Order of the Dragon from Hungary's King Sigismund. Firmly establish this buffer state under Hungarian influence."
 hun_subjugate_wallachia_tooltip: "Bucharest owned by us or a subject, or Wallachia (c:WAL) is our subject"
 hun_subjugate_moldavia: "Subjugate Moldavia"
 hun_subjugate_moldavia_desc: "Moldavia lies between the Danube delta and Poland, contested by Hungary, Poland, and the Ottomans. Bringing this principality firmly under Hungarian overlordship secures the eastern frontier."
 hun_subjugate_moldavia_tooltip: "Iasi owned by us or a subject, or Moldavia (c:MOL) is our subject"
 hun_danube_fortress_line: "The Danube Fortress Line"
 hun_danube_fortress_line_desc: "The Végvár system — Hungary's border fortress network — was the most sophisticated anti-Ottoman defensive structure in 15th-century Europe. Dozens of fortresses along the Danube communicated with each other to form an early warning and defensive line that stopped Ottoman advances dead. This system made Hungary the true first shield of Christendom."
 hun_danube_fortress_line_tooltip: "Own 10 or more fortresses"
 hun_order_of_the_dragon: "Order of the Dragon"
 hun_order_of_the_dragon_desc: "The Order of the Dragon was a chivalric order founded by King Sigismund of Hungary in 1408. Vlad II, Skanderbeg, and János Hunyadi were among its members. This order rallied the Hungarian nobility under the banner of the anti-Ottoman crusade, embodying the mission of Christian guardianship."
 hun_order_of_the_dragon_tooltip: "Nobles estate satisfaction 0.65 or more, army tradition 30 or more"
 hun_crusade_preparations: "Crusade Preparations"
 hun_crusade_preparations_desc: "János Hunyadi was the greatest anti-Ottoman crusader of the 15th century. His Long Campaign of 1442-43 drove the Ottomans back, giving Christendom hope. But the Battle of Varna in 1444 destroyed the Polish-Hungarian crusader army. This time, go in prepared."
 hun_crusade_preparations_tooltip: "Army size 20 or more, clergy estate satisfaction 0.60 or more"
 hun_battle_of_nicopolis: "Battle of Nicopolis"
 hun_battle_of_nicopolis_desc: "In 1396, the crusader army under King Sigismund of Hungary was crushed at the Battle of Nicopolis — the disaster that secured Ottoman domination of the Balkans. But this time is different — a fully prepared Hungary seizes Nicopolis and opens the door to the reconquest of the Balkans. The name of Hunyadi echoes across all Europe."
 hun_battle_of_nicopolis_tooltip: "Nicopolis owned by us or a subject, at war with Ottomans (c:TUR)"
 hun_black_army: "The Black Army"
 hun_black_army_desc: "The Black Army (Fekete Sereg) created by King Matthias Corvinus around 1458 was the most advanced professional military force in contemporary Europe — a fusion of mercenaries and standing troops in black armor, aggressively adopting firearms. Despite enormous maintenance costs, this army terrified both Ottomans and Habsburgs alike. It is the key to Hungarian hegemony."
 hun_black_army_tooltip: "Army size 30 or more, army tradition 50 or more, monthly income 50 or more"
 hun_bulwark_of_christendom: "Bulwark of Christendom"
 hun_bulwark_of_christendom_desc: "For centuries Hungary fought on the frontlines of Christendom against the Ottoman Empire. Now that the Ottomans have been driven from Europe entirely, the Pope, Emperor, and princes of Europe lavish Hungary's king with the highest honor: Antemurale Christianitatis — the Bulwark of Christendom."
 hun_bulwark_of_christendom_tooltip: "Ottoman Empire (c:TUR) no longer exists"
 hun_croatian_union: "Union with Croatia"
 hun_croatian_union_desc: "Since the Pacta Conventa of 1102, Croatia has been in personal union with Hungary — Croatian nobles accepted the Hungarian king as their own in exchange for broad autonomy. Strengthen this historic union and secure Hungary's gateway to the Adriatic."
 hun_croatian_union_tooltip: "In union with or have Croatia (c:CRO) as subject, or Zagreb owned by us or a subject"
 hun_reclaim_dalmatia: "Reclaim Dalmatia"
 hun_reclaim_dalmatia_desc: "The Dalmatian coast was part of the Hungarian-Croatian kingdom until Venice purchased it in 1409. Reclaiming Split and Ragusa (Dubrovnik) restores guaranteed Adriatic access and opens the road to Italy."
 hun_reclaim_dalmatia_tooltip: "Split and Ragusa owned by us or a subject"
 hun_adriatic_supremacy: "Adriatic Supremacy"
 hun_adriatic_supremacy_desc: "It is time to end Venice's long monopoly over the Adriatic — the 'Bride of the Adriatic'. The Hungarian-Croatian fleet will raise its flag over the Adriatic Sea."
 hun_adriatic_supremacy_tooltip: "Fleet size 15 or more"
 hun_angevin_naples: "Angevin Claim to Naples"
 hun_angevin_naples_desc: "Hungary's Angevin dynasty holds a claim to the throne of Naples. Louis I occupied Naples twice, in 1347 and 1350. Now is the time to realize the Angevin claim permanently — let the King of Hungary rule Naples forever."
 hun_angevin_naples_tooltip: "Naples owned by us or a subject"
 hun_strengthen_estates: "Strengthen the Estates"
 hun_strengthen_estates_desc: "Hungarian nobles and clergy won extensive privileges in the Golden Bull (Aranybulla) of 1222. Leveraging this tradition of estates politics, winning the support of nobles and clergy strengthens royal legitimacy. But beware — excessive concessions will cause problems later. Maintain the right balance."
 hun_strengthen_estates_tooltip: "Nobles estate satisfaction 0.70 or more, clergy estate satisfaction 0.70 or more"
 hun_tripartitum: "The Tripartitum"
 hun_tripartitum_desc: "The Tripartitum, compiled by István Werbőczy in 1514, was a systematic codification of Hungarian customary law. It defined noble privileges, peasant obligations, and royal authority. This legal code became the foundation of Hungarian law — though its codification of serfdom also contributed to the Dózsa Peasant Revolt of 1514."
 hun_tripartitum_tooltip: "Own 5 or more courthouses, legitimacy 70 or more"
 hun_matthias_reforms: "Reforms of King Matthias"
 hun_matthias_reforms_desc: "King Matthias Corvinus (r. 1458-90), called 'the Just', was the greatest of Hungarian kings. Centralized taxation, the professional Black Army, and aggressive adoption of Renaissance culture transformed Hungary into the strongest state in Central Europe."
 hun_matthias_reforms_tooltip: "Monthly income 80 or more, total population 500 or more"
 hun_buda_renaissance: "Renaissance of Buda"
 hun_buda_renaissance_desc: "The court of King Matthias imported the Italian Renaissance to Hungary. The Bibliotheca Corviniana in Buda Palace housed thousands of Latin and Greek manuscripts, drawing scholars and artists from across Europe. This cultural flowering makes Hungary the cultural center of Central Europe."
 hun_buda_renaissance_tooltip: "University built in Buda, monthly prestige 0.20 or more"
 hun_great_hungary: "Great Hungary"
 hun_great_hungary_desc: "The Balkans, Poland, Bohemia, Dalmatia — the Kingdom of Hungary has grown into a great empire far beyond the Carpathian Basin. The Black Army, Buda's Renaissance court, the Danube fortress line — all these together have created a Hungary more powerful than ever before."
 hun_great_hungary_tooltip: "Own 200 or more locations, total population 1,000 or more, monthly income 150 or more"
 hun_glory_of_st_stephen: "Glory of the Crown of Saint Stephen"
 hun_glory_of_st_stephen_desc: "The Kingdom of Hungary, founded by Saint Stephen a thousand years ago, has become a great empire dominating Central Europe and the Balkans. From the Baltic in the north to the Adriatic and Mediterranean in the south, from the Carpathians to the east — the Crown of Saint Stephen shines with unprecedented brilliance. Celebrated as the Bulwark of Christendom, the glory of Hungary has reached its absolute zenith."
 hun_glory_of_st_stephen_tooltip: "Own 400 or more locations, monthly income 500 or more, legitimacy 90 or more"
 hun_events.10.t: "The Battle of Nicopolis"
 hun_events.10.d: "In the midst of the Ottoman onslaught, the Hungarian army has achieved a historic victory at the Battle of Nicopolis. Unlike the disastrous defeat of 1396, this time the Hungarian forces were fully prepared and disciplined. Seizing this strategic key on the Danube has for the first time checked the Ottoman advance into the Balkans. The name of János Hunyadi resounds across all Europe, and it has been proven that Hungary is the true shield of Christendom."
 hun_events.10.a: "Hungary, stand as the shield of Christendom!"
 hun_events.99.t: "Glory of the Crown of Saint Stephen"
 hun_events.99.d: "The Kingdom of Saint Stephen — once confined to the Carpathian Basin — now stretches from the Baltic to the Adriatic and Mediterranean. Poland, Bohemia, and Croatia are united under the Hungarian crown; the Ottomans have been driven from the Balkans; the Angevin claim to Naples has been fulfilled. The Renaissance court of Buda is famed across all Europe; the Black Army is feared by every enemy. The Crown of Saint Stephen shines with the greatest brilliance in its thousand-year history."
 hun_events.99.a: "Saint Stephen, we have fulfilled your dream!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Angevin Prestige"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "In 1308, the Angevin prince Charles (Károly Róbert) inherited the Hungarian throne. This dynasty's bloodlines connected Hungary to Naples, Sicily, Provence, and Poland, thrusting Hungary into the center of European diplomacy. The papal court at Avignon and the Habsburgs in Vienna could not afford to ignore this Angevin court."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Angevin Diplomatic Network"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "The Angevin diplomatic network built through multiple alliances raises legitimacy and diplomatic reputation."
 STATIC_MODIFIER_NAME_hun_polish_union_mod: "Hungarian-Polish Personal Union"
 STATIC_MODIFIER_DESC_hun_polish_union_mod: "The Hungarian-Polish personal union has been realized. Two great kingdoms united under one king."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "Crown of Bohemia"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "With the Bohemian crown secured, a Hungarian-Polish-Bohemian triple monarchy has been formed."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Lord of the North"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "With access to the Baltic, Hungary has become a great power controlling key northern and eastern European trade."
 STATIC_MODIFIER_NAME_hun_transylvania_mod: "Transylvania Secured"
 STATIC_MODIFIER_DESC_hun_transylvania_mod: "Transylvania's silver mines and fortress network reinforce Hungary's financial and military foundations."
 STATIC_MODIFIER_NAME_hun_danube_fortress_mod: "Danube Fortress"
 STATIC_MODIFIER_DESC_hun_danube_fortress_mod: "The Danube fortress line anchored at Belgrade blocks Ottoman incursions."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Wallachian Buffer State"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "Wallachia functions as a Hungarian buffer state, securing the eastern frontier."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Moldavian Buffer State"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "Moldavia under Hungarian influence provides a double layer of eastern border security."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "Végvár Fortress System"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "The organized fortress network along the Danube systematically blocks Ottoman advances. Hungary becomes the frontline shield of Christendom."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "Order of the Dragon"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "King Sigismund's Order of the Dragon unites the nobility and military in a single cause. It becomes the spiritual backbone of the anti-Ottoman crusade."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Crusading Zeal"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "The crusading zeal led by János Hunyadi elevates the fighting spirit of the Hungarian army."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "The Black Army"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "The Fekete Sereg — the Black Army — created by Matthias Corvinus was the most modern military force in contemporary Europe: tens of thousands of mercenaries and standing troops clad in black armor. Built around a core of Hussite knights from Bohemia, it adopted firearms aggressively, and was feared equally by Ottomans and Habsburgs alike. The ruinous cost strained the royal treasury — but without this army, Hungary could not have survived between such giants."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Bulwark of Christendom"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Having driven the Ottomans from Europe, Hungary bears the honor of Antemurale Christianitatis."
 STATIC_MODIFIER_NAME_hun_croatian_union_mod: "Croatian Personal Union"
 STATIC_MODIFIER_DESC_hun_croatian_union_mod: "The historic union since 1102 has been strengthened. Croatian autonomy and Hungarian suzerainty are in harmony."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Adriatic Coast Secured"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "The reclamation of Dalmatia gives Hungary direct access to the Adriatic Sea."
 STATIC_MODIFIER_NAME_hun_adriatic_navy_mod: "Adriatic Fleet"
 STATIC_MODIFIER_DESC_hun_adriatic_navy_mod: "The Hungarian fleet deployed in the Adriatic opens the road to the Mediterranean."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "Angevin Italy"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "The Hungarian Angevins dominate southern Italy through Naples."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "Golden Bull Tradition"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "The estate system inheriting the spirit of the Golden Bull of 1222 supports the stability of the realm."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "The Tripartitum"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "The Tripartitum, compiled by István Werbőczy in 1514, was the culmination of Hungarian customary law — three parts covering the 'one and same liberty' of the nobility, the enserfment of the peasantry, and royal authority. The bloody Dózsa Peasant Revolt was its price. Yet even so, this law code remained the foundation of Hungarian society for centuries."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "Reforms of King Matthias"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Matthias was called 'the Just' (Igazságos Mátyás) because he held court regardless of rank and protected peasants from baronial oppression. He built a centralized bureaucracy, curtailed the power of the magnates, and extended royal authority directly to the countryside. His reign is remembered as the most perfect expression of Hungarian kingship in history."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "Buda Renaissance"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "The court of Matthias drew humanists, architects, sculptors, and musicians from across Italy. Buda Palace was rebuilt in the Renaissance style — more magnificent than Vienna — and the Bibliotheca Corviniana housed over five thousand manuscripts of classical Greek and Roman texts. When Matthias died, a humanist wrote: 'Matthias is dead. Justice has perished.'"
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "Great Hungary"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "The great Hungarian empire spanning Central Europe, the Balkans, and the Adriatic is complete."
 hun_baltic_trade: "Baltic Trade"
 hun_baltic_trade_desc: "Gdansk is the key hub of the Hanseatic League — the gateway between the North Sea and Baltic. Hungary's control of this port opens access to Baltic amber, furs, and timber trade, securing a direct route to Western Europe. This is the turning point where Hungary transforms from a landlocked agrarian state into a maritime trading power."
 hun_baltic_trade_tooltip: "Gdansk owned by us or a subject, monthly income 100 or more"
 hun_hre_influence: "Influence over the HRE"
 hun_hre_influence_desc: "With Poland and Bohemia secured, Hungary has become the most powerful neighbor of the Holy Roman Empire. Extend Hungarian influence over German princes through diplomatic reputation and multiple alliances, countering Habsburg hegemony."
 hun_hre_influence_tooltip: "Diplomatic reputation 5 or more, 3 or more allies"
 hun_challenge_habsburgs: "Challenge the Habsburgs"
 hun_challenge_habsburgs_desc: "The Habsburg dynasty of Austria has been Hungary's eternal rival. Seizing Vienna transfers Danubian hegemony to Hungary. The greatest EU4 Hungarian ambition — overthrow the Habsburgs and become HRE Emperor — is realized here."
 hun_challenge_habsburgs_tooltip: "Vienna owned by us or a subject"
 hun_conquer_bulgaria: "Conquer Bulgaria"
 hun_conquer_bulgaria_desc: "The Second Bulgarian Empire was destroyed by the Ottomans in 1396. But with Hungary now dominant in the Balkans, Sofia and Tarnovo can be recovered — reviving the Bulgarian heritage under the Hungarian crown."
 hun_conquer_bulgaria_tooltip: "Sofia and Tarnovo owned by us or a subject"
 hun_conquer_greece: "Conquer Greece"
 hun_conquer_greece_desc: "Athens and Thessaloniki — the two great cities of ancient Greek civilization — fall to Hungary. Unify the divided Greek principalities after the fall of Byzantium and extend the Hungarian banner to the southern tip of the Balkans."
 hun_conquer_greece_tooltip: "Athens and Thessaloniki owned by us or a subject"
 hun_balkan_empire: "Balkan Empire"
 hun_balkan_empire_desc: "Serbia, Bulgaria, Greece, Wallachia, Moldavia — all the Balkans under Hungarian dominion. The hegemony that Byzantium and then the Ottomans exercised over the Balkans now belongs entirely to Hungary."
 hun_balkan_empire_tooltip: "Own 300 or more locations, own 100 or more Balkan region locations"
 hun_push_into_anatolia: "Push into Anatolia"
 hun_push_into_anatolia_desc: "With Constantinople secured, Hungary now straddles two continents. Launch a crusade to reclaim the Anatolian lands that Byzantium lost and strike at the heartland of the Ottoman Empire."
 hun_push_into_anatolia_tooltip: "Constantinople owned by us or a subject"
 hun_hungarian_crusade: "The Hungarian Crusade"
 hun_hungarian_crusade_desc: "The Hungarian king who liberates Jerusalem becomes the hero of all Christendom. The dream since the days of Saint Stephen — returning the Holy Land to Christian hands — is finally realized. The crusading victory that Sigismund, founder of the Order of the Dragon, dreamed of is inscribed here."
 hun_hungarian_crusade_tooltip: "Jerusalem owned by us or a subject"
 hun_mediterranean_fleet: "Mediterranean Fleet"
 hun_mediterranean_fleet_desc: "With Naples and Sicily secured, Hungary has become a major Mediterranean naval power. A fleet of thirty or more vessels competes for control of the Mediterranean. The sea once monopolized by Venice now belongs to Hungary."
 hun_mediterranean_fleet_tooltip: "Fleet size 30 or more, Palermo owned by us or a subject"
 hun_conquer_north_africa: "Conquer North Africa"
 hun_conquer_north_africa_desc: "Seizing Tunis extends Hungarian territory to the southern shore of the Mediterranean. Crush the Barbary pirate bases and remove obstacles to Mediterranean commerce. The Hungarian flag flies at the southern edge of the Mediterranean."
 hun_conquer_north_africa_tooltip: "Tunis owned by us or a subject"
 hun_latin_empire: "Restoration of the Latin Empire"
 hun_latin_empire_desc: "With Constantinople, Rome, and Naples secured, the King of Hungary can claim to be the heir of the Latin Empire. The dream of the Fourth Crusade in 1204 is now realized through legitimate conquest. The greatest Christian empire in history is born."
 hun_latin_empire_tooltip: "Constantinople, Rome, and Naples owned by us or a subject"
 hun_corvinus_library: "Bibliotheca Corviniana"
 hun_corvinus_library_desc: "King Matthias's Bibliotheca Corviniana was the largest Latin and Greek manuscript collection in contemporary Europe — over five thousand codices housed in Buda Palace, drawing scholars and artists from Italy, France, and Germany. This cultural investment transforms Hungary into the cultural center of Central Europe."
 hun_corvinus_library_tooltip: "Own 5 or more universities, monthly prestige 0.30 or more"
 hun_hungarian_church: "The Hungarian Church"
 hun_hungarian_church_desc: "Centered on the Archbishopric of Esztergom, strengthen the Hungarian Catholic Church and secure clerical support. Before the waves of the Reformation arrive, firmly establish the relationship between the Catholic Church and Hungarian royal power."
 hun_hungarian_church_tooltip: "Clergy estate satisfaction 0.80 or more, own 15 or more temples"
 hun_economic_powerhouse: "The Golden Danube"
 hun_economic_powerhouse_desc: "Hungary, spanning the Balkans, the north, and the Adriatic, sits at the intersection of multiple major trade routes — an economic giant. Danubian agricultural production, Transylvanian silver mines, and Mediterranean trade revenues combine to generate enormous wealth."
 hun_economic_powerhouse_tooltip: "Monthly income 300 or more, own 5 or more market centers"
 hun_danube_empire: "The Danube Empire"
 hun_danube_empire_desc: "Poland, Bohemia, the Balkans, the Adriatic, the Mediterranean — all under Hungarian dominion, with refined administrative institutions and a prosperous economic base. Hungary has become the 'Danube Empire' centered on the great river. The multiethnic composite state that Austria-Hungary once dreamed of is now realized under Hungarian leadership."
 hun_danube_empire_tooltip: "Own 400 or more locations, total population 3,000 or more, monthly income 400 or more"
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Baltic Trade"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Access to Baltic trade through Gdansk expands trade range and income."
 STATIC_MODIFIER_NAME_hun_hre_influence_mod: "HRE Influence"
 STATIC_MODIFIER_DESC_hun_hre_influence_mod: "Diplomatic influence over German princes raises reputation and cabinet efficiency."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Hungary-Austria"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "The fall of Vienna collapses Habsburg authority, making Hungary master of the Danube."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Bulgarian Dominion"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Bulgarian conquest accelerates assimilation policies in the southern Balkans."
 STATIC_MODIFIER_NAME_hun_greece_mod: "Light of Greece"
 STATIC_MODIFIER_DESC_hun_greece_mod: "The legacy of ancient Greek civilization enhances Hungary's cultural tradition and prestige."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "Balkan Empire"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "Dominion over all the Balkans dramatically improves military power, integration speed, and diplomatic influence."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "New Crusade"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "The crusading spirit after seizing Constantinople raises military discipline and war efficiency against other religions."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Crusade Accomplished"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "The glory of liberating Jerusalem brings Hungary unprecedented prestige, legitimacy, and diplomatic authority."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "Mediterranean Fleet"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "A powerful Mediterranean fleet improves ship construction speed, movement speed, and light ship combat power."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "North African Base"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "North African dominion improves blockade efficiency and trade income."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Restoration of the Latin Empire"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "The prestige of the Latin Empire encompassing Constantinople, Rome, and Naples dramatically improves prestige, diplomatic reputation, and assimilation speed."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "Europe's greatest manuscript collection accelerates the promotion of arts and culture."
 STATIC_MODIFIER_NAME_hun_church_mod: "Hungarian Church"
 STATIC_MODIFIER_DESC_hun_church_mod: "A strong Hungarian Church brings legitimacy, legislative efficiency, and religious stability."
 STATIC_MODIFIER_NAME_hun_economy_mod: "The Golden Danube"
 STATIC_MODIFIER_DESC_hun_economy_mod: "Economic power supported by diverse trade routes and resources improves trade income, production efficiency, and selling efficiency."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "The Danube Empire"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "The multiethnic Danube Empire centered on the great river is complete. Tax, population, administration, and legislative efficiency all reach their peak."
 hun_transylvanian_mines: "The Lower Hungarian Mining Towns"
 hun_transylvanian_mines_desc: "Kremnica (Körmöcbánya) houses Hungary's greatest gold mint. Banská Bystrica (Besztercebánya) is famed for the largest copper mines in Central Europe. Securing these two cities makes Hungary the premier mining state of Central Europe. Matthias Corvinus reorganized this region as an imperial domain in 1467-68, using mining revenues to fund the Black Army."
 hun_transylvanian_mines_tooltip: "Kremnica and Banská Bystrica owned by us or a subject"
 hun_silver_mines: "The Silver Mines of Banská Štiavnica"
 hun_silver_mines_desc: "The Hont region (encompassing Banská Štiavnica) is the greatest silver mining district in Lower Hungary. The silver of this land was minted into thalers at the royal mint, supporting commerce across Central Europe. The 'Lower Hungarian Mining Towns' are the economic heart of the kingdom."
 hun_silver_mines_tooltip: "Hont owned by us or a subject"
 hun_salt_mines: "The Salt Mines of Transylvania"
 hun_salt_mines_desc: "Sighet (Máramarossziget) and Turda have been mined for rock salt since antiquity. Salt was once called 'white gold' — so vital a commodity that Hungary's royal salt monopoly was a critical pillar of crown finances. Secure these salt mines and establish a monopoly on salt trade."
 hun_salt_mines_tooltip: "Sighet and Turda owned by us or a subject"
 hun_tokaj_wine: "The Wines of Tokaj"
 hun_tokaj_wine_desc: "The Tokaj region around Sátoraljaújhely produces Tokaji Aszú — the 'Wine of Kings, King of Wines'. So renowned that Pope Benedict XIV presented it to Louis XV of France, this noble rot wine from the Hungarian hills is Europe's most celebrated vintage. Develop the vineyards and export the finest wine in Europe."
 hun_tokaj_wine_tooltip: "Sátoraljaújhely owned by us or a subject"
 hun_mining_empire: "The Mining Empire"
 hun_mining_empire_desc: "Kremnica's gold, Hont's silver, Banská Bystrica's copper, and the salt of Sighet and Turda — all Hungary's mineral wealth is now secured. As Central Europe's foremost mining state, Hungary earns enormous revenue from metal exports. This wealth funded Matthias's Black Army and the glories of his Renaissance court."
 hun_mining_empire_tooltip: "Monthly income 120 or more, produce silver or gold in significant quantities"
 hun_buda_capital: "Developing Buda and Pest"
 hun_buda_capital_desc: "Buda and Pest, facing each other across the Danube, are the heart of the Kingdom of Hungary. Buda's royal palace and great market, Pest's commercial harbor — when this twin city flourishes, all Hungary prospers. The court of Matthias was the largest in Europe and renowned as the center of Central European Renaissance."
 hun_buda_capital_tooltip: "Buda directly owned by us, Pest directly owned, market level 2+ in Buda"
 hun_upper_hungary_cities: "Upper Hungary's Cities"
 hun_upper_hungary_cities_desc: "Bratislava (Pozsony) guards the western gateway against the Habsburgs; Košice (Kassa) is the greatest commercial city of Upper Hungary; Trnava (Nagyszombat) is an episcopal seat. Developing these three cities makes Upper Hungary (modern Slovakia) the economic and political pivot of the north."
 hun_upper_hungary_cities_tooltip: "Bratislava, Košice, and Trnava owned by us or a subject"
 hun_pannonian_cities: "The Cities of Pannonia"
 hun_pannonian_cities_desc: "Győr (Raab) guards the Austrian frontier; Sopron (Ödenburg) is the wealthy commercial city of western Hungary; Pécs (Fünfkirchen) houses one of Central Europe's oldest universities, founded by Louis I in 1367. Develop these Pannonian cities to make western Hungary thrive."
 hun_pannonian_cities_tooltip: "Győr, Sopron, and Pécs owned by us or a subject"
 hun_great_plain_cities: "The Cities of the Great Plain"
 hun_great_plain_cities_desc: "Debrecen (center of Hungarian Calvinism), Szeged (key to the Tisza River), Kecskemét (pastoral city of the Great Plain) — develop the main cities of the Hungarian Puszta and unlock the agricultural potential of this vast grassland. Cattle, sheep, and grain from the Great Plain become Hungary's chief exports."
 hun_great_plain_cities_tooltip: "Debrecen, Szeged, and Kecskemét owned by us or a subject"
 hun_transylvania_cities: "The Cities of Transylvania"
 hun_transylvania_cities_desc: "Kolozsvár (Cluj) is the political and cultural heart of Transylvania; Nagyvárad (Oradea) is a great pilgrimage city housing the relics of Saint Ladislaus; Miskolc is the industrial center of northeastern Hungary. Integrate the multi-ethnic Transylvanian region through urban development."
 hun_transylvania_cities_tooltip: "Cluj, Oradea, and Miskolc owned by us or a subject"
 hun_kingdom_of_cities: "Kingdom of Cities"
 hun_kingdom_of_cities_desc: "Kremnica's gold, Hont's silver, Tokaj's wine, Buda's court, Košice's commerce, Pécs's university, Debrecen's agriculture, Kolozsvár's culture — every city of the Kingdom of Hungary works in organic concert. The greatest economic zone in Central Europe is complete. Urban prosperity is the true source of Hungarian imperial power."
 hun_kingdom_of_cities_tooltip: "Own 20 or more markets, monthly income 200 or more"
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "Kremnica Royal Mint"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "The Kremnica mint was established by Charles I of Hungary in 1328 at Körmöcbánya. The gold 'florin' (forint) struck here was regarded as equal in quality to the Florentine florin — and it circulated from the Baltic to Constantinople. The mint's meticulous standards made it the monetary backbone of Central European commerce."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "Banská Bystrica Copper Mines"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "Central Europe's largest copper mines at Banská Bystrica are in full operation. Copper output and maximum RGO size improve."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "Banská Štiavnica Silver Mines"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "The silver mines of the Hont region (Banská Štiavnica area) are in full operation. Silver output and population growth improve."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "Rock Salt Mine"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "The ancient rock salt mines are in full operation. Salt output and maximum RGO size improve."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Tokaji Aszú Vineyards"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "The vineyards producing the 'Wine of Kings' Tokaji Aszú are fully developed. Wine output, trade center power, and merchant capacity improve."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Royal Capital Buda"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Buda on the western Danube bank has been fully developed as the imperial capital. Prosperity, population, trade center power, and merchant capacity all greatly improve."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Pest Trading Port"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "Pest on the eastern Danube bank has been developed as a commercial port. Prosperity, trade center power, and RGO size improve."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Pozsony — Gateway City"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Pozsony (Bratislava), situated between Austria and Hungary, has been developed as a transport and political hub. Proximity source and trade center power improve."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Kassa — Commercial Center"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "Kassa (Košice), the greatest commercial city of Upper Hungary, has been developed as a major trading hub. Trade center power and merchant capacity improve."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "University of Pécs"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "The University of Pécs, one of Central Europe's oldest (founded 1367 by Louis I), flourishes. Monthly literacy and maximum literacy improve."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "Fortress of Győr"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "Győr on the Austrian frontier has been developed as a major fortress city. Defensive strength improves."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Debrecen Agricultural City"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Debrecen, the heart of the Great Plain, has been developed as an agricultural and pastoral hub. Population growth and RGO size improve."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Szeged Trading Port"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Szeged, near the confluence of the Tisza and Danube, has been developed as an inland trade hub. Prosperity, trade center power, and merchant capacity improve."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Kolozsvár — Heart of Transylvania"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "Kolozsvár (Cluj), the political and cultural center of Transylvania, has been developed. Literacy, trade center power, and merchant capacity improve."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Nagyvárad — Pilgrimage City"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Nagyvárad (Oradea) Cathedral, housing the relics of Saint Ladislaus I, has been developed as Hungary's greatest pilgrimage site. Religious tolerance and literacy improve."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "Mining Empire"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "As Central Europe's foremost mining state, Hungary's gold, silver, copper, and salt output is maximized. Raw material production efficiency and total income improve."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "Kingdom of Cities"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "Every city in the Kingdom of Hungary works in organic concert, completing Central Europe's greatest economic zone. Trade income, production efficiency, and administrative efficiency improve."
 hun_crown_of_st_stephen_tooltip: "Buda and Esztergom owned by us or a subject, legitimacy 100, stability 30 or more"
 hun_secure_transylvania: "Mastery of Transylvania"
 hun_secure_transylvania_desc: "Transylvania — long a core Hungarian territory — centers on two great cities: Kolozsvár (Cluj) and Brașov (Brassó). Hungarians, Saxons, and Wallachians (Romanians) coexist in this land. With sufficient treasury resources, invest in developing Transylvania in earnest and elevate one of its two great cities to full city status."
 hun_secure_transylvania_tooltip: "Cluj and Brașov directly owned by us, treasury 1,000 ducats or more"
 hun_croatian_union_tooltip: "In personal union or as subject with Croatia (c:CRO), and Croatia's opinion of us is 200 or more"
 hun_events.20.t: "Mastery of Transylvania"
 hun_events.20.d: "With Kolozsvár and Brașov secured and over 1,000 ducats invested, a major development program for Transylvania begins. Kolozsvár (Latin: Claudiopolis; Romanian: Cluj) is Transylvania's greatest city; Brașov (Latin: Corona; German: Kronstadt), built by Saxon settlers, is the commercial gateway to Wallachia. Which city will be prioritized for development — this decision shapes the future direction of Transylvania."
 hun_events.20.a: "Elevate Kolozsvár (cluj) to city status"
 hun_events.20.b: "Elevate Brașov (brasov) to city status"
 hun_events.30.t: "Pacta Conventa — The Historic Agreement with Croatia"
 hun_events.30.d: "In 1102, King Coloman of Hungary concluded the Pacta Conventa with representatives of twelve Croatian noble families. Croatian nobles accepted the Hungarian king as their own sovereign; in return, Croatia retained its autonomy and legal traditions. More than two centuries after this historic agreement, the time has come to clarify the relationship between Hungary and Croatia. Should Croatia be formally incorporated as a fiefdom to clarify its legal status? Or should the current flexible arrangement be maintained? The choice rests with the King of Hungary."
 hun_events.30.a: "Formally incorporate Croatia as a fiefdom"
 hun_events.30.b: "Maintain the current personal union / subject relationship"
 hun_order_of_the_dragon_tooltip: "A chivalric order has been established (after flavor_hun.370 or 410 fires)"
