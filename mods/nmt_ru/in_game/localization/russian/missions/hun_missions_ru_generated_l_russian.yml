 hun_battle_of_nicopolis_tooltip: "Currently at war with any Muslim country"
 STATIC_MODIFIER_NAME_hun_transylvania_governor_mod: "Transylvania Governorate"
 STATIC_MODIFIER_DESC_hun_transylvania_governor_mod: "A royal governor dispatched by the Hungarian king directly administers the central city of Transylvania. Prosperity, population growth, tax efficiency, and literacy all improve."
 hun_events.40.t: "Founding of the Order of the Dragon"
 hun_events.40.d: "The Order of the Dragon has been formally established."
 hun_events.40.a: "In the name of the Order of the Dragon"
 hun_order_of_the_dragon_tooltip: "The Order of the Dragon has been established (after flavor_hun.410 fires and hun_dragon_order_founded variable is set)"
