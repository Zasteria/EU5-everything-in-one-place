 STATIC_MODIFIER_NAME_kie_great_kyiv_mod: "Mother of Rus Cities"
 STATIC_MODIFIER_DESC_kie_great_kyiv_mod: "Kyiv reclaims its title as Mother of Rus Cities — the eternal capital of Ukraine."
