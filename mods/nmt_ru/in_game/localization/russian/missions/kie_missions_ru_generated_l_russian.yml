 STATIC_MODIFIER_DESC_kie_steppe_mod: "The steppe is conquered — Kyiv reigns as master of the Pontic grasslands."
 STATIC_MODIFIER_NAME_kie_crimea_mod: "Mastery of the Black Sea"
 STATIC_MODIFIER_DESC_kie_crimea_mod: "Mastery of the Black Sea is achieved — Crimea under Kyivan dominion."
 STATIC_MODIFIER_NAME_kie_black_sea_mod: "Road to the Black Sea"
 STATIC_MODIFIER_DESC_kie_black_sea_mod: "The road to the Black Sea is opened — Kyiv gains access to Mediterranean trade."
 STATIC_MODIFIER_NAME_kie_lavra_mod: "Cave Monastery"
 STATIC_MODIFIER_DESC_kie_lavra_mod: "The Kyivo-Pechersk Lavra — the Cave Monastery — is restored as the soul of Rus Orthodoxy."
 STATIC_MODIFIER_NAME_kie_orthodox_mod: "Ruthenian Orthodox Revival"
 STATIC_MODIFIER_DESC_kie_orthodox_mod: "Ruthenian Orthodoxy is revived — Kyiv reasserts its role as guardian of the faith."
 STATIC_MODIFIER_NAME_kie_grain_mod: "Breadbasket of Europe"
 STATIC_MODIFIER_DESC_kie_grain_mod: "Ukraine's fertile black soil makes Kyiv the breadbasket of Europe."
 STATIC_MODIFIER_NAME_kie_trade_mod: "Dnieper Trade Route"
 STATIC_MODIFIER_DESC_kie_trade_mod: "The Dnieper trade route from the Baltic to the Black Sea flows through Kyivan hands."
 STATIC_MODIFIER_NAME_kie_salt_mod: "White Gold of Halychyna"
 STATIC_MODIFIER_DESC_kie_salt_mod: "The white gold of Halychyna — salt — is monopolized for imperial profit."
 STATIC_MODIFIER_NAME_kie_poltava_city_mod: "Poltava Developed"
 STATIC_MODIFIER_DESC_kie_poltava_city_mod: "Poltava is developed into a thriving city of the Ukrainian steppe."
 STATIC_MODIFIER_NAME_kie_sloboda_mod: "Pioneering Free Ukraine"
 STATIC_MODIFIER_DESC_kie_sloboda_mod: "Free Ukrainian settlements pioneer the eastern frontier under Kyivan protection."
 STATIC_MODIFIER_NAME_kie_moldavia_mod: "Moldavia Conquered"
 STATIC_MODIFIER_DESC_kie_moldavia_mod: "Moldavia is conquered and united with the Kyivan realm."
 STATIC_MODIFIER_NAME_kie_amber_mod: "The Amber Route"
