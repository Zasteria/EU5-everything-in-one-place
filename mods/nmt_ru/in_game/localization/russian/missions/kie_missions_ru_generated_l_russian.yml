 STATIC_MODIFIER_DESC_kie_diplomacy_mod: "Bonds with the western powers strengthen Kyiv's international standing."
 STATIC_MODIFIER_NAME_kie_silver_route_mod: "The Silver Road"
 STATIC_MODIFIER_DESC_kie_silver_route_mod: "The silver road from the west flows into Kyivan coffers."
 STATIC_MODIFIER_NAME_kie_ruthenian_army_mod: "Birth of the Ruthenian Army"
 STATIC_MODIFIER_DESC_kie_ruthenian_army_mod: "The Ruthenian army is born — a disciplined force combining Cossack and noble cavalry."
 STATIC_MODIFIER_NAME_kie_warsaw_mod: "Pacification of Poland"
 STATIC_MODIFIER_DESC_kie_warsaw_mod: "Poland is pacified — Warsaw acknowledges Kyivan supremacy."
 STATIC_MODIFIER_NAME_kie_beeswax_mod: "Beeswax and Honey"
 STATIC_MODIFIER_DESC_kie_beeswax_mod: "Beeswax and honey from Ukrainian forests enrich Kyivan trade."
 STATIC_MODIFIER_NAME_kie_lviv_trade_mod: "Gateway of Western Trade"
 STATIC_MODIFIER_DESC_kie_lviv_trade_mod: "Lviv becomes the gateway of western trade into Kyivan Ukraine."
 STATIC_MODIFIER_NAME_kie_zhytomyr_mod: "Zhytomyr Trade Hub"
 STATIC_MODIFIER_DESC_kie_zhytomyr_mod: "Zhytomyr develops into a thriving trade hub of Right Bank Ukraine."
 STATIC_MODIFIER_NAME_kie_zhytomyr_city_mod: "Zhytomyr Developed"
 STATIC_MODIFIER_DESC_kie_zhytomyr_city_mod: "Zhytomyr is developed into a major city of the Kyivan realm."
 STATIC_MODIFIER_NAME_kie_grand_principality_mod: "Grand Principality of Kyiv"
 STATIC_MODIFIER_DESC_kie_grand_principality_mod: "The Grand Principality of Kyiv is proclaimed — eastern Europe's mightiest realm."
 STATIC_MODIFIER_NAME_kie_literacy_mod: "Learning in Kyiv"
 STATIC_MODIFIER_DESC_kie_literacy_mod: "Learning spreads through Kyiv — literacy and scholarship flourish across Ukraine."
 kie_conquer_smolensk: "The Smolensk Campaign"
 kie_conquer_smolensk_desc: "Seize Smolensk, the 'Key of Russia' and crossroads of east-west traffic — establish influence over Moscow and Poland. Using Chernihiv as a foothold, take control of the entire Smolensk region."
 STATIC_MODIFIER_NAME_kie_smolensk_mod: "Smolensk — Crossroads of East-West Trade"
 STATIC_MODIFIER_DESC_kie_smolensk_mod: "Smolensk secured as a key east-west junction."
 STATIC_MODIFIER_NAME_kie_chernihiv_mod: "Chernihiv — Left Bank Stronghold"
 STATIC_MODIFIER_DESC_kie_chernihiv_mod: "Chernihiv conquered, strengthening Left Bank Ukraine's tax base."
 kie_build_sevastopol: "Construction of Sevastopol Naval Base"
 kie_build_sevastopol_desc: "Build a Ruthenian naval base at the natural harbor of Theodoro — this naval stronghold commanding the Black Sea will become the home port of the Cossack fleet."
 kie_build_odesa: "Construction of Odesa Port"
 kie_build_odesa_desc: "Build Ruthenia's greatest commercial port on the coast of Khadjibey — this port connecting Black Sea trade with the Mediterranean will become the lifeblood of Ruthenian commerce."
 STATIC_MODIFIER_NAME_kie_sevastopol_mod: "Sevastopol Naval Base"
 STATIC_MODIFIER_DESC_kie_sevastopol_mod: "The Sevastopol naval base commanding the Black Sea established as Ruthenia's naval stronghold."
 STATIC_MODIFIER_NAME_kie_odesa_mod: "Odesa Commercial Port"
 STATIC_MODIFIER_DESC_kie_odesa_mod: "Odesa, center of Black Sea trade, built — Ruthenia's maritime commerce flourishes."
 STATIC_MODIFIER_NAME_kie_unite_rus_mod: "Legacy of Reunification"
 STATIC_MODIFIER_DESC_kie_unite_rus_mod: "The reunification of the Rus principalities has strengthened Kyiv's administrative and governing capacity."
