 STATIC_MODIFIER_NAME_kie_galicia_mod: "Halychyna Invaded"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Halychyna is invaded and the Galicia-Volhynia legacy revived."
 STATIC_MODIFIER_NAME_kie_halych_mod: "Legitimacy of Galicia-Volhynia"
 STATIC_MODIFIER_DESC_kie_halych_mod: "The ancient capital of Galicia-Volhynia legitimizes Kyivan rule over western Rus."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Chervona Rus Subjugated"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Chervona Rus — Red Ruthenia — is subjugated and united with Ukraine."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Prosperity of the Lion City"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Lviv — the Lion City — prospers as the gateway of western trade."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Black Soil Farmlands"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Podolia's black-soil farmlands are secured — agricultural wealth flows to Kyiv."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Right Bank Stronghold"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Vinnytsia serves as the stronghold of Right Bank Ukraine."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Marshland Defensive Wall"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "The marshlands of Polesia form a natural defensive wall against northern invaders."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Heart of White Ruthenia"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Minsk — heart of White Ruthenia — falls under Kyivan control."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "The Cossack Sword"
 STATIC_MODIFIER_DESC_kie_cossack_mod: "The Cossack sword forges Kyiv's fighting force into an elite steppe army."
 STATIC_MODIFIER_NAME_kie_zaporizhzhia_mod: "Freedom Beyond the Rapids"
 STATIC_MODIFIER_DESC_kie_zaporizhzhia_mod: "Beyond the Dnieper rapids, the Zaporozhian Cossacks pledge their swords to Kyiv."
 STATIC_MODIFIER_NAME_kie_tatar_wars_mod: "Struggle Against the Tatars"
