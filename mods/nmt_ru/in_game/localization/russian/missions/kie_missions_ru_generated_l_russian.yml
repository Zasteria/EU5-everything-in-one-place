l_russian:
 kie_kyiv_mission_pack: "Reunification of the Rus and Ruler of the Cossacks"
 kie_kyiv_mission_pack_DESCRIPTION: "In 1337, the Principality of Kyiv is a small state caught between Lithuania and the Tatars. Yet Kyiv once shone as the heart of Kievan Rus — Saint Sophia Cathedral, Pechersk Lavra, and the Golden Gate still speak of its glory. Unify Left and Right Bank Ukraine, conquer Halychyna and Volhynia, defeat the Tatars with Cossack military power, form Ruthenia, and reign as the Grand Principality."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION: "Reunify the Rus, establish the Cossack Hetmanate, become guardian of Orthodox faith, form Ruthenia, and reign as the Grand Principality of Kyiv."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP: "Reign as the Grand Principality of Kyiv over all the Rus."
 kie_kyiv_mission_pack_BUTTON_DETAILS: "Reunite the fragmented Rus under Kyiv — seize the steppe with the Cossack sword!"
 kie_restore_kyiv: "Restore Kyiv"
 kie_restore_kyiv_desc: "In 1337, Kyiv — once the golden city of Kievan Rus, devastated by Mongol invasion in 1240. Saint Sophia Cathedral and Pechersk Lavra still speak of past glory. Restore the 'Mother of Rus Cities' as a great city once more."
 kie_dev_kyiv: "Develop Kyiv"
 kie_dev_kyiv_desc: "The key crossroads connecting the Volkhov and Dnieper trade routes — develop Kyiv as a center of trade, culture, and politics."
 kie_secure_left_bank: "Strengthen Control of Left Bank Ukraine"
 kie_secure_left_bank_desc: "Strengthen control over Left Bank Ukraine — guard Rus cultural traditions and with capable bureaucracy make this rich agricultural land Kyiv's foundation."
 kie_secure_right_bank: "Strengthen Control of Right Bank Ukraine"
 kie_secure_right_bank_desc: "Strengthen control over Right Bank Ukraine — through Ukrainian cultural spread and crown power strengthening, make Right Bank Ukraine Kyiv's core territory."
 kie_conquer_chernihiv: "The Chernihiv Campaign"
 kie_conquer_chernihiv_desc: "Conquer Chernihiv, ancient Rus principality city, and solidify control of Left Bank Ukraine."
 kie_conquer_pereyaslavl: "Subjugate Pereyaslavl"
 kie_conquer_pereyaslavl_desc: "—"
 kie_conquer_poltava: "March on Poltava"
 kie_conquer_poltava_desc: "Subjugate the Cossack stronghold Poltava and open the door to Sloboda Ukraine."
 kie_kyiv_metropolitan: "Metropolitan See of Kyiv"
 kie_kyiv_metropolitan_desc: "Establish the Kyiv metropolitanate independent from Constantinople as the center of the Rus Orthodox Church."
 kie_unite_rus: "Reunification of the Rus"
 kie_unite_rus_desc: "Reunify the Rus principalities fragmented by Mongol invasion under Kyiv. The 'Mother of Rus Cities' shines once more as the center of all Ukraine."
 kie_secure_volhynia: "Secure Volhynia"
 kie_secure_volhynia_desc: "Secure Volhynia at the boundary of Rus and Poland to establish western influence."
 kie_conquer_lutsk: "The Lutsk Campaign"
 kie_conquer_lutsk_desc: "Seize the key Volhynian city of Lutsk to make it a bridgehead to the west."
 kie_conquer_galicia: "Invasion of Halychyna"
 kie_conquer_galicia_desc: "Invade Halychyna — conquering this region establishes full control of western Ukraine."
 kie_conquer_halych: "Conquest of Halych"
 kie_conquer_halych_desc: "Conquer Halych, once capital of the Galicia-Volhynia Principality, to establish status as the rightful Rus successor."
 kie_red_ruthenia: "Subjugate Chervona Rus"
 kie_red_ruthenia_desc: "Subjugate Chervona Rus — subjugating this region centered on Lviv completes full control of western Ukraine."
 kie_conquer_lviv: "Seize Lviv"
 kie_conquer_lviv_desc: "The 'City of the Lion' Lviv — conquer this trading city built by Prince Danylo and seize control of western trade."
 kie_conquer_podolia: "Advance into Podolia"
 kie_conquer_podolia_desc: "Advance into Podolia — conquer this Right Bank agricultural region and secure the route toward the Black Sea coast."
 kie_conquer_vinnytsia: "Occupation of Vinnytsia"
 kie_conquer_vinnytsia_desc: "Seize Vinnytsia and establish the agricultural base of Right Bank Ukraine."
 kie_conquer_polesia: "The Polissia Campaign"
 kie_conquer_polesia_desc: "Conquer the wetland Polissia — establish a northern defensive line."
 kie_conquer_minsk: "Seize Minsk"
 kie_conquer_minsk_desc: "Seize Minsk, center of White Ruthenia, to expand northern influence."
 kie_cossack_host: "Establish the Cossack Host"
 kie_cossack_host_desc: "Cossacks gather under Kyiv's banner — incorporate the Zaporozhian Cossack military tradition into the regular army and build the finest cavalry force of the Rus."
 kie_zaporizhzhia: "The Zaporizhzhian Sich"
 kie_zaporizhzhia_desc: "Construct the Zaporizhzhian Sich fortress beyond the Dnieper rapids as a base for steppe defense."
 kie_tatar_wars: "Wars Against the Tatars"
 kie_tatar_wars_desc: "Fight a decisive battle against the Crimean Tatars controlling the northern Black Sea. Use Cossack cavalry to counter them and reclaim the Ukrainian steppe."
 kie_black_sea_steppe: "Conquer the Black Sea Steppe"
 kie_black_sea_steppe_desc: "Seize the Pontic Steppe — the vast grassland makes Kyiv master of the northern Black Sea."
 kie_conquer_crimea: "Conquest of Crimea"
 kie_conquer_crimea_desc: "Conquer the Crimean Khanate's peninsula to establish Black Sea mastery. Seize the Genoese trading post Caffa."
 kie_black_sea_coast: "Establish a Black Sea Fleet"
 kie_black_sea_coast_desc: "Use Cossack 'Chaika' fast ships down the Dnieper to the Black Sea — challenge the Ottomans and seize the Black Sea trade route."
 kie_kyiv_pechersk: "Kyiv-Pechersk Lavra"
 kie_kyiv_pechersk_desc: "The Kyiv-Pechersk Lavra (Cave Monastery), founded 1051 — the spiritual heart of the Rus Orthodox Church. Develop this monastery and declare Kyiv the Orthodox center."
 kie_orthodox_revival: "Orthodox Revival"
 kie_orthodox_revival_desc: "Rebuild the Rus Orthodox Church destroyed by Mongol invasion — build cathedrals throughout the land and revive 'Holy Russia'."
 kie_grain_breadbasket: "Ukraine — Breadbasket of Europe"
 kie_grain_breadbasket_desc: "The fertile chernozem — Ukraine's rich farmland, called the 'Breadbasket of Europe'. Maximize this productivity and solidify the empire's food base."
 kie_trade_routes: "Kyiv's Trade Routes"
 kie_trade_routes_desc: "The 'Road from the Varangians to the Greeks' connecting Baltic to Black Sea — revive this ancient trade route that supported Kyiv's prosperity."
 kie_hetmanate: "The Cossack Hetmanate"
 kie_hetmanate_desc: "The Hetman — establishing the Cossack Hetmanate allows Kyiv to emerge as a state with its own military-political system. Anticipate Bohdan Khmelnytsky's great achievement of 1648."
 kie_literacy_culture: "Promote Literacy and Culture"
 kie_literacy_culture_desc: "Kyiv's intellectual tradition — as a pioneer of monastery manuscript culture and cathedral schools, promote educational culture."
 kie_dev_lviv_trade: "Lviv Trade Center"
 kie_dev_lviv_trade_desc: "—"
 kie_conquer_zhytomyr: "Develop Zhytomyr"
 kie_conquer_zhytomyr_desc: "Develop Zhytomyr, key point of Right Bank Ukraine, into an important base city with proper buildings."
 kie_salt_of_galicia: "Salt of Halychyna"
 kie_salt_of_galicia_desc: "Halychyna's rock salt mines — seize this 'white gold' producing region and secure stable supply of this important trade resource."
 kie_dev_poltava: "Develop Poltava"
 kie_dev_poltava_desc: "Develop Poltava, key city of Cossack Left Bank Ukraine, into an eastern forward base."
 kie_beyond_donets: "Beyond the Donets River"
 kie_beyond_donets_desc: "Sloboda Ukraine — settle Cossack farmers along the Donets River and develop the eastern steppe."
 kie_conquer_moldavia: "Invasion of Moldavia"
 kie_conquer_moldavia_desc: "Conquer Moldavia on the Black Sea coast and achieve full entry into Black Sea trade."
 kie_amber_route: "The Amber Route"
 kie_amber_route_desc: "The ancient amber trade route from the Baltic through Lutsk and Lviv to the south forms the backbone of the Ruthenian trade network."
 kie_fortress_line: "The Fortress Line"
 kie_fortress_line_desc: "A fortress line against steppe threats — a defensive system from Zaporizhzhia to Podolia protects Ukrainian farmers and cities."
 kie_conquer_kamianets: "Subjugate Kamianets"
 kie_conquer_kamianets_desc: "—"
 kie_great_kyiv: "The Great Kyiv"
 kie_great_kyiv_desc: "Restore Kyiv to the greatness it had before Mongol invasion — rebuild as a magnificent city with its golden domes recovered in their original glory."
 kie_ruthenian_culture: "Ruthenian Cultural Identity"
 kie_ruthenian_culture_desc: "Establish Ukrainian Ruthenian unique culture — a unique identity where the Ukrainian language, Cossack culture, and Orthodox faith merge."
 kie_dev_chernihiv: "Develop Chernihiv"
 kie_dev_chernihiv_desc: "Develop Chernihiv as a center of culture and trade in Left Bank Ukraine."
 kie_conquer_wallachia: "Advance into Wallachia"
 kie_conquer_wallachia_desc: "Wallachia along the Danube — conquer this region as a foothold toward the Balkans and complete Black Sea coastal control."
 kie_grain_export: "Grain Export Expansion"
 kie_grain_export_desc: "—"
 kie_cossack_cavalry: "Cossack Cavalry Elite"
 kie_cossack_cavalry_desc: "Cossack cavalry — light and heavy cavalry raised into elite units. Overwhelm the Tatars with their mobility and combat power."
 kie_kyiv_academy: "Kyiv-Mohyla Academy"
 kie_kyiv_academy_desc: "Establish the Kyiv-Mohyla Academy ahead of its founding in 1632 — one of Eastern Europe's oldest universities. Realize the Rus intellectual and cultural renaissance."
 kie_conquer_krakow: "Seize Krakiv"
 kie_conquer_krakow_desc: "Krakiv, historic capital of the Polish Kingdom — conquering this city with Wawel Castle greatly expands influence over Central Europe."
 kie_navy_dnipro: "The Dnipro Fleet"
 kie_navy_dnipro_desc: "Use Cossack 'Chaika' sailboats from the Dnieper River to the Black Sea — the Dnieper fleet guards Black Sea trade."
 kie_pacify_tatars: "Pacify the Tatars"
 kie_pacify_tatars_desc: "—"
 kie_protect_orthodoxy: "Protector of Orthodoxy"
 kie_protect_orthodoxy_desc: "After the fall of Constantinople, Kyiv emerges as guardian of the Orthodox world — establish the highest authority of the Rus Orthodox Church."
 kie_conquer_vilnius: "Occupation of Vilnius"
 kie_conquer_vilnius_desc: "Vilnius, capital of the Grand Duchy of Lithuania — occupying this city ends Lithuanian dominance of the Rus."
 kie_western_alliance: "Alliance with the West"
 kie_western_alliance_desc: "Build diplomatic relations with Poland, Hungary, and the Holy Roman Empire to establish a western alliance against eastern threats."
 kie_silver_route: "The Silver Route"
 kie_silver_route_desc: "Eastern silver flows west through Kyiv along the Dnieper — establish Kyiv's position in international trade."
 kie_ruthenian_army: "Ruthenian Army Reform"
 kie_ruthenian_army_desc: "Combine Cossack tradition with Western military technology — the Ruthenian army reigns as Eastern Europe's finest military force."
 kie_conquer_warsaw: "Seize Varshava"
 kie_conquer_warsaw_desc: "Varshava, Poland's capital — settle the long struggle with the Polish-Lithuanian Commonwealth."
 kie_beeswax_honey: "Beeswax and Honey Trade"
 kie_beeswax_honey_desc: "Ukrainian beeswax — a key commodity supplied to Orthodox churches and Western European markets."
 kie_dev_zhytomyr: "Develop Zhytomyr City"
 kie_dev_zhytomyr_desc: "—"
 kie_form_ruthenia: "Form Ruthenia"
 kie_form_ruthenia_desc: "Declare the formation of the state of 'Ruthenia' — encompassing Ukraine, Belarus, and western Russia. The dream of Rus unity since the Mongol invasion is finally realized."
 kie_grand_principality: "The Grand Principality of Kyiv"
 kie_grand_principality_desc: "The 'Grand Principality of Kyiv' — this title demonstrates ancient Kievan Rus glory. Kyiv, where Cossack military power, Orthodox authority, and Ruthenian culture merge, reigns as a great power of Eastern Europe."
 kie_events.1.t: "Kyiv Awakens — Restoration of the Mother of Rus Cities"
 kie_events.1.d: "Above the hills along the Dnieper River — the golden domes of Saint Sophia Cathedral gleam in the Kyiv sky.

In 1337, the Principality of Kyiv is small, yet bears the weight of history as the heart of Kievan Rus. 'Mother of all Rus cities' — this title defines Kyiv's mission.

Lithuania, Poland, and the Tatars press from all sides, but the Dnieper's bounty, the fertile chernozem, and the Cossack spirit support Kyiv.

The monks of Pechersk Lavra pray — 'Rise again, O Rus.' Answer that prayer."
 kie_events.1.a: "Reclaim Kyiv's glory!"
 kie_events.10.t: "Reunification of the Rus — Kyiv at the Center Once More"
 kie_events.10.d: "Left Bank, Right Bank Ukraine, Chernihiv, and Pereyaslavl — the core lands of Kievan Rus have gathered under Kyiv's banner. A hundred years after the Mongol invasion, the Rus peoples 'return to Kyiv'."
 kie_events.10.a: "Long live the Reunified Rus! Long live Kyiv!"
 kie_events.20.t: "Declaration of the Cossack Hetmanate"
 kie_events.20.d: "The Zaporozhian Cossacks stand in formation under the Hetman's flag — the Grand Prince of Kyiv formally incorporates Cossack power into the state system and declares the 'Cossack Hetmanate'. This unique military-state system will determine the future of Ruthenia."
 kie_events.20.a: "Long live the Cossack Hetmanate! Long live Free Ukraine!"
 kie_events.60.t: "Formation of Ruthenia — A New Power of Eastern Europe"
 kie_events.60.d: "Ukraine, Belarus, and Halychyna under one banner — the unified East Slavic state of 'Ruthenia' emerges as a new great power of Eastern Europe. All the Rus peoples gather beneath Kyiv's golden domes."
 kie_events.60.a: "Long live Ruthenia! Long live Kyiv!"
 kie_events.99.t: "Grand Principality of Kyiv — The Rebirth of Rus Glory"
 kie_events.99.d: "'Grand Principality of Kyiv' — this title echoes along the banks of the Dnieper. An empire where Cossack military power, Orthodox authority, and Ruthenian culture merge reigns as master of Eastern Europe. Kievan Rus, destroyed by the Mongols, has been reborn in new form — the Mother of Rus Cities, Kyiv, shines once more."
 kie_events.99.a: "Long live the Grand Principality of Kyiv! Long live the glory of the Rus forever!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Golden City on the Dnieper"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Kyiv is developed into a great city worthy of its title 'Mother of Rus Cities'."
