l_russian:
 por_portuguese_mission_pack: "The Age of Discovery — Portugal's Maritime Empire"
 por_portuguese_mission_pack_DESCRIPTION: "In 1337, Portugal is a small kingdom on the western tip of the Iberian Peninsula. But the expeditions organized by Prince Henry the Navigator (1394–1460) will change the world — Madeira, the Azores, West Africa, the Cape of Good Hope, India, Malacca, Brazil. From the Atlantic to the Indian Ocean, establish the 'Estado da India' where Portuguese navigators rule the seas."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION: "Develop the homeland, sail around Africa to reach the Indian Ocean, colonize Brazil, and reign as the Master of the Seas."
 por_portuguese_mission_pack_BUTTON_TOOLTIP: "Complete missions to fulfill Portugal's Age of Discovery empire."
 por_portuguese_mission_pack_BUTTON_DETAILS: "From Prince Henry the Navigator to Philip II's Portugal!"
 por_infante_henrique: "Portugal's Maritime Tradition"
 por_infante_henrique_desc: "In 1337, Portugal is a small kingdom at the western tip of the Iberian Peninsula. Under Alfonso IV's rule, Portugal supported Castile at the Battle of Río Salado (1340), repelling the Marinids as a naval power. This kingdom facing the Atlantic has long had an affinity with the sea. Lisbon's harbor, the Algarve's fishermen, the Atlantic winds — this maritime tradition is the foundation that will produce the Age of Discovery for future generations."
 por_dev_lisbon: "Develop Lisbon"
 por_dev_lisbon_desc: "Lisbon at the mouth of the Tagus is blessed with a natural harbor. Developing this city — founded by ancient Phoenicians — as the capital of the Portuguese Empire makes it the center of world trade."
 por_dev_porto: "Develop Porto"
 por_dev_porto_desc: "Porto on the Douro River is a city of wine and fishing. Develop this ancient city that will lend its name to 'Portugal (port of Porto)' for future generations."
 por_university_coimbra: "University of Coimbra"
 por_university_coimbra_desc: "The University of Coimbra, founded in 1290 — Portugal's oldest university trains navigators, lawyers, and clergy. Many scholars who served under Prince Henry studied here."
 por_lisbon_entrepot: "Lisbon as Trade Entrepôt"
 por_lisbon_entrepot_desc: "Develop Lisbon's port authority so Eastern goods are distributed throughout Europe from here. Pepper, spices, silk — Lisbon becomes Europe's greatest spice market."
 por_avis_dynasty: "Strengthening the House of Aviz"
 por_avis_dynasty_desc: "The House of Aviz, which survived the dynastic crisis of 1385 — João I's victory established a Portuguese dynasty with a stable foundation for governance."
 por_ordenacoes_afonsinas: "Ordenações Afonsinas"
 por_ordenacoes_afonsinas_desc: "The Ordenações Afonsinas, compiled in 1446, is Portugal's first systematic legal code. As the prototype for the later Manueline and Philippine codes, it establishes Portugal's legal tradition."
 por_dev_evora: "Develop Évora"
 por_dev_evora_desc: "Évora, the main city of the Alentejo region — this ancient city preserving Roman temples is developed as an agricultural and cultural center."
 por_algarve_fisheries: "Algarve Fisheries"
 por_algarve_fisheries_desc: "Southern Portugal's Algarve region borders the Atlantic fishing grounds. Rich fisheries of cod, sardines, and tuna nurture the Portuguese affinity with the sea that becomes the foundation of the Age of Discovery."
 por_ceuta_gateway: "Ceuta — Gateway to Africa"
 por_ceuta_gateway_desc: "In 1415, João I's Portuguese forces conquered Ceuta — this is the beginning of Portugal's overseas expansion. Prince Henry obtained information about Saharan trade routes from Muslim merchants here, nurturing his ambition to sail south along Africa."
 por_conquer_tangier: "Conquer Tangier"
 por_conquer_tangier_desc: "Tangier, facing Ceuta across the Strait of Gibraltar — increase pressure on North African Muslim forces and secure the Atlantic outlet."
 por_moroccan_fortress: "Moroccan Fortresses"
 por_moroccan_fortress_desc: "By controlling Moroccan trading cities including Agadir, dominate the terminus of trans-Saharan trade and monopolize profits from gold, ivory, and salt."
 por_madeira_settlement: "Settle Madeira"
 por_madeira_settlement_desc: "Madeira, reached by the Portuguese in 1419 — the first Atlantic colony. Bringing sugar to this uninhabited island established the sugar plantation model later used in Brazil and the West Indies."
 por_azores_settlement: "Settle the Azores"
 por_azores_settlement_desc: "Colonizing the Azores in the middle of the Atlantic secures a stopover on trans-Atlantic routes. Using this as a base enables further exploration westward."
 por_guinea_trade: "Guinea Trade"
 por_guinea_trade_desc: "The Gulf of Guinea, reached by Portuguese sailing south along the West African coast — trade in gold, ivory, and later slaves begins. Prince Henry's dream is becoming reality."
 por_gold_coast: "Gold Coast"
 por_gold_coast_desc: "Elmina (1482) — the first permanent trading fortress in Africa built by Portugal. Large amounts of gold flow from this 'Gold Coast' region into Portugal."
 por_sao_tome_sugar: "São Tomé Sugar"
 por_sao_tome_sugar_desc: "São Tomé Island near the equator is ideal for sugar plantations. With forced labor from the African mainland, São Tomé becomes Europe's greatest sugar supplier."
 por_angola_colony: "Angola Colony"
 por_angola_colony_desc: "Angola becomes an important Portuguese colony as the next base after São Tomé. Establish trade relations with the Kingdom of Congo and expand influence into central-western Africa."
 por_cape_of_good_hope: "The Cape of Good Hope"
 por_cape_of_good_hope_desc: "In 1488, Bartolomeu Dias reached the southernmost tip of Africa, the 'Cape of Storms.' João II renamed it the 'Cape of Good Hope' — because the road to India was now open."
 por_east_africa_trading_posts: "East Africa Trading Posts"
 por_east_africa_trading_posts_desc: "Mozambique, Sofala — seizing the Swahili coast gold and ivory trading posts achieves entry into the Indian Ocean trade network."
 por_mombasa_fort: "Fort at Mombasa"
 por_mombasa_fort_desc: "Mombasa and Malindi — subduing East Africa's greatest trading cities establishes control of the Indian Ocean. In 1498, Vasco da Gama obtained a navigation guide to India from Malindi."
 por_vasco_da_gama: "Vasco da Gama Reaches India"
 por_vasco_da_gama_desc: "May 20, 1498 — Vasco da Gama landed at Calicut (Kozhikode). At this moment, the sea route connecting Europe and Asia was opened, and the structure of the spice trade monopolized by Arab merchants and Venice changed fundamentally."
 por_conquer_goa: "Conquer Goa"
 por_conquer_goa_desc: "In 1510, Albuquerque conquered Goa — the birth of Portugal's 'Eastern Capital.' The natural harbor of Goa on India's west coast flourishes as the center of the Estado da India (Portuguese India)."
 por_malabar_trade: "Malabar Coast Spices"
 por_malabar_trade_desc: "Cochin, Calicut, Quilon — the Malabar coast produces pepper, cardamom, and ginger. By monopolizing spices here, Portugal controls European spice prices."
 por_hormuz_control: "Control Hormuz"
 por_hormuz_control_desc: "In 1515, Albuquerque conquered Hormuz at the entrance to the Persian Gulf. Controlling this point means dominating Persia-India trade and cutting off the Islamic world's commerce."
 por_conquer_malacca: "Conquer Malacca"
 por_conquer_malacca_desc: "In July 1511, Afonso de Albuquerque with 1,200 Portuguese soldiers conquered Malacca — the greatest strategic victory of the Age of Discovery. Controlling 'the throat of Eastern trade,' all trade routes for spices, silk, and porcelain are seized."
 por_spice_monopoly: "Spice Trade Monopoly"
 por_spice_monopoly_desc: "With Goa, Hormuz, and Malacca secured, the Indian Ocean spice trade routes are completely under Portuguese control. Pepper, nutmeg, and cloves are supplied to Europe via Lisbon."
 por_indian_ocean_empire: "Indian Ocean Empire"
 por_indian_ocean_empire_desc: "From East Africa to Malacca — the Portuguese navy controls the Indian Ocean. The Casa da India (India House) in Lisbon manages all spice trade, and enormous wealth flows into Portugal."
 por_brazil_discovery: "Discovery of Brazil"
 por_brazil_discovery_desc: "April 22, 1500 — while sailing to India with 13 ships, Pedro Álvares Cabral veered far west to avoid a storm and discovered unknown land. 'Ilha de Vera Cruz (Island of the True Cross)' — later called 'Brazil (from the dye tree pau-brasil).' Under the Treaty of Tordesillas, this land becomes Portuguese territory and will later become Portugal's greatest colony."
 por_brazil_colony: "Colonize Brazil"
 por_brazil_colony_desc: "In 1532, Martim Afonso de Sousa established Brazil's first permanent colony, 'São Vicente.' A new society is emerging where Portuguese settlers and indigenous peoples intermingle."
 por_brazil_sugar: "Brazil's Sugar Industry"
 por_brazil_sugar_desc: "By the mid-16th century, Brazil had become Europe's greatest sugar supplier. The engenhos (sugar mills) of Pernambuco and Bahia operate with forced labor from Africa, generating enormous wealth."
 por_brazil_empire: "Brazilian Empire"
 por_brazil_empire_desc: "Bahia, Pernambuco, Rio de Janeiro — Brazil's colonies have grown to imperial scale. Sugar, dye wood, and later gold and gems create flows of wealth to Portugal."
 por_naval_supremacy: "Naval Supremacy"
 por_naval_supremacy_desc: "The Portuguese navy controlling both Atlantic and Indian Oceans — the caravel's superior maneuverability and cannon firepower overwhelm Arab, Indian, and Chinese merchant ships."
 por_caravel: "The Caravel"
 por_caravel_desc: "The caravel (Caravela) developed in the era of Prince Henry — this small, fast sailing ship using lateen sails that can sail against the wind made the Age of Discovery possible. The Santa María was also a caravel."
 por_padroes: "Padrões (Stone Pillars)"
 por_padroes_desc: "Portuguese explorers erected stone pillars (padrões) at various locations in Africa, inscribing the name of the Portuguese king and the Christian cross. This was a declaration of discovery and dominion — Portugal's reach points carved in stone."
 por_royal_navy: "Royal Navy"
 por_royal_navy_desc: "The world's strongest navy supports Portuguese supremacy — galleons, carracks, and caravels protect everything from the Indian Ocean to Brazil."
 por_dev_setubal: "Develop Setúbal"
 por_dev_setubal_desc: "Setúbal Bay south of Lisbon is a natural harbor. Develop it as a port city complementing Lisbon, producing salt, fish, and wine."
 por_order_of_christ: "Order of Christ"
 por_order_of_christ_desc: "The Order of Christ (Ordem de Cristo), established in 1319 — this military order, founded in Portugal as successor to the Knights Templar, financially supported Prince Henry's explorations. The order's red cross was painted on Portuguese sails."
 por_treaty_tordesillas: "Treaty of Tordesillas"
 por_treaty_tordesillas_desc: "In 1494, Spain and Portugal concluded the Treaty of Tordesillas with Pope Alexander VI as mediator — dividing the Atlantic vertically, assigning west to Spain and east to Portugal. This treaty confirmed Brazil as Portuguese territory."
 por_colonial_administration: "Colonial Administration"
 por_colonial_administration_desc: "Administrative machinery to manage Portugal's empire spanning Africa, India, and Brazil — governors and viceroys report to the king in Lisbon, sending trade revenues to the homeland."
 por_estado_da_india: "Estado da India"
 por_estado_da_india_desc: "'Estado da India (State of India)' — the concept referring to Portugal's entire Asian empire. With Goa as capital and controlling sea trade routes from East Africa to Malacca, this 'empire' is history's first truly global maritime empire."
 por_dev_tomar: "Develop Tomar"
 por_dev_tomar_desc: "Tomar, headquarters of the Order of Christ — the Convent of Christ (Convento de Cristo) is known as the finest example of Portuguese Manueline architecture. Develop it with the order's financial resources."
 por_wine_trade: "Portuguese Wine Trade"
 por_wine_trade_desc: "The wines of the Douro Valley — the prototype of 'Port wine' — are a major export to England and Flanders. Establish the Anglo-Portuguese trade relationship that precedes the Methuen Treaty (1703)."
 por_dev_faro: "Develop Faro"
 por_dev_faro_desc: "Faro, the main city of the Algarve region — incorporated into Portugal by the Christian reconquest in 1249, develop this southern city as a hub of fishing and trade."
 por_cape_verde: "Cape Verde Islands"
 por_cape_verde_desc: "The Cape Verde Islands, discovered in 1456, occupy a strategic position midway between Africa and America. As a relay point for trans-Atlantic trade, they become a supply base for later Brazilian colonization."
 por_lisbon_megalopolis: "Lisbon — World City"
 por_lisbon_megalopolis_desc: "In the 16th century, Lisbon became one of Europe's greatest cities with a population exceeding 100,000. Eastern spices, African gold, and Brazilian sugar converge here, earning it the epithet 'capital of the world.'"
 por_casa_india: "Casa da India"
 por_casa_india_desc: "The Casa da India (India House) established in Lisbon exclusively manages Portugal's Eastern trade as a state institution. All spice imports pass through here, generating enormous customs revenue."
 por_brazil_wood: "Pau-Brasil (Brazilwood)"
 por_brazil_wood_desc: "Pau-brasil (brazilwood), from which Brazil takes its name — this red dye tree is exported in large quantities as an essential commodity for Europe's wool dyeing industry. It is the first product of Brazil trade."
 por_atlantic_domination: "Atlantic Domination"
 por_atlantic_domination_desc: "From Lisbon to the Azores, Madeira, Cape Verde, and Brazil — Portugal controls the entire Atlantic. Defeating Spain's competition, Portugal reigns as the protagonist of Atlantic trade."
 por_empire_of_seas: "Master of the Seas"
 por_empire_of_seas_desc: "'Portugal is a small country, but rules half the world' — a historian's words become truth. From the Atlantic to the Indian Ocean, from Brazil to Malacca — Portugal's empire dominates the world's seas. The Estado da India is complete."
 por_events.10.t: "The Cape of Good Hope — The Road to India Opens"
 por_events.10.d: "In 1488, Bartolomeu Dias's fleet rounded Africa's southernmost 'Cape of Storms' and reached the Indian Ocean. João II trembled at this news — 15 years later, Vasco da Gama would open the direct route to India. The era when Arab merchants monopolized the spice trade is about to end."
 por_events.10.a: "Glory to God and Portugal! The road to India is open!"
 por_events.20.t: "Vasco da Gama Reaches India"
 por_events.20.d: "May 20, 1498 — 10 months after departing Lisbon with four ships, Vasco da Gama landed at Calicut. The local ruler (Zamorin) was skeptical, but Portugal secured entry into the spice trade. As Arab merchants fumed with anger, Portugal's Eastern trade era began."
 por_events.20.a: "Pepper and spices — Portugal has seized India's wealth!"
 por_events.30.t: "Conquest of Malacca — Seizing the Throat of Spice Trade"
 por_events.30.d: "July 1511, Afonso de Albuquerque with 1,200 Portuguese forces conquered Malacca. 'The most important place in the East' — controlling Malacca seizes all trade routes for China, India, and the Spice Islands. Albuquerque positioned Malacca as one of three pillars of the Portuguese Empire alongside Goa and Hormuz."
 por_events.30.a: "Malacca is ours! Eastern trade is Portugal's monopoly!"
 por_events.40.t: "Cabral's Discovery of Brazil"
 por_events.40.d: "April 22, 1500 — while heading to India with a fleet of 13 ships, Pedro Álvares Cabral veered far west to avoid a storm and discovered unknown land. 'Ilha de Vera Cruz' — part of the South American continent later called 'Brazil.' Under the Treaty of Tordesillas this becomes Portuguese territory, and this land will later become Portugal's greatest colony."
 por_events.40.a: "A discovery by God's guidance! Brazil belongs to Portugal!"
 por_events.99.t: "Master of the Seas — Portugal's Empire Complete"
 por_events.99.d: "From Lisbon to Goa, from Malacca to Brazil — Portugal's empire rules the world's seas. The 'Maritime Silk Road' that Prince Henry dreamed of has become reality, and spices, gold, sugar, and ivory converge in Lisbon. Portugal has transformed from a small nation of 92,000 square kilometers to the world's first 'global maritime empire.'"
 por_events.99.a: "Portugal forever! Reign as Master of the Seas!"
