l_russian:
 teu_teutonic_mission_pack: "Teutonic Order — Sword and Cross"
 teu_teutonic_mission_pack_DESCRIPTION: "The Teutonic Order, who conquered the Baltic in God's name. Raise the Crusader banner and destroy the pagans and Orthodox of the East to complete the Northern Crusade — or secularize and lay the foundations of modern Germany as the Kingdom of Prussia. The time to choose has come."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION: "Complete the Northern Crusade on the Crusade route, or build the Kingdom of Prussia on the secularization route."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP: "Conquer the Baltic and Eastern Europe with sword and cross."
 teu_teutonic_mission_pack_BUTTON_DETAILS: "'All aid to those who ask, no mercy to the enemy' — rule the Baltic in the name of the Grand Master!"
 teu_crusaders_legacy: "Legacy of the Crusader Order"
 teu_crusaders_legacy_desc: "Founded at Acre in 1190 during the Third Crusade, the Teutonic Order began as a hospitaller order in the Holy Land. In 1226, Frederick II's Golden Bull of Rimini granted the Order the right to campaign against pagan Prussia, and ever since it has conquered the southern Baltic shore by the crusader's sword. This 'monastic knightly state,' with its capital at Marienburg, remains Europe's last crusader state, continuing its wars of conversion and colonization. Now, surrounded by the powerful rivals of Gediminid Lithuania and Jagiellonian Poland, the Order's true worth will be tested."
 teu_secure_prussia: "Secure Prussia"
 teu_secure_prussia_desc: "Prussia — once home to the Baltic Prussian peoples — was won through more than fifty years of conquest by the Teutonic Order beginning in the 1230s. After the crushing of the 'Great Uprising' of 1283, the native population was effectively annihilated and the land rebuilt as a colony of German settlers. Yet in the mountains and forests, embers of resistance still smolder. Complete the network of fortresses across Prussia and make the Order's rule unshakeable — for without Prussia, there is no Teutonic Order."
 teu_christianize_prussia: "Christianize Prussia"
 teu_christianize_prussia_desc: "The Teutonic Order's professed reason for existing is 'the conversion of the pagans.' In reality, most conquered Prussians were forcibly converted, and those who resisted were massacred. The 1249 Treaty of Christburg granted Prussian nobles rights in exchange for baptism, but subsequent revolts saw that promise broken. Now, pursue a true Catholicization and build a network of churches to establish the Order's religious legitimacy — only with the Pope's backing can this state become truly legitimate."
 teu_subdue_lithuania: "Subdue Lithuania"
 teu_subdue_lithuania_desc: "The Grand Duchy of Lithuania — a vast pagan state that under the Gediminid dynasty stretched from the Baltic to Ukraine — was both the Teutonic Order's greatest threat and its greatest crusading target. Defeat at the Battle of Durbe in 1260, catastrophe at Grunwald in 1410 — Lithuania has beaten the Order time and again. Yet with Jogaila's conversion to Catholicism in 1387, Lithuania was nominally no longer a 'pagan state,' muddying the crusade's justification. Even so, only by winning the struggle for supremacy against Lithuania can the Order truly rule the Baltic."
 teu_subdue_poland: "Subdue Poland"
 teu_subdue_poland_desc: "15 July 1410, the Battle of Tannenberg (Grunwald) — the greatest defeat in the Teutonic Order's history. Grand Master Ulrich von Jungingen and the flower of the Order's knighthood fell, and Marienburg itself was besieged. The Second Peace of Thorn in 1466 ceded West Prussia to Poland, reducing the Order to little more than a vassal. Avenge this humiliation — defeat Poland, reclaim the lost lands, and wash away the shame of Tannenberg."
 teu_order_or_prussia: "The Choice — Crusade or Secularization"
 teu_order_or_prussia_desc: "In 1511, when Albert of Hohenzollern became Grand Master, the Order stood at a crossroads of survival. As Luther's Reformation of 1517 shook Europe, Albert met with Luther himself and chose to secularize the Order, founding the Duchy of Prussia — in 1525. But what if the Order instead continued its crusading mission? Complete the 'Northern Crusade' by subduing the Orthodox, pagans, and Muslims of the East, or lay the foundations of modern Prussia as a secular principality — the choice is yours."
 teu_crusade_path: "The Path of the Northern Crusade"
 teu_crusade_path_desc: "The path of the crusade — take up the sword in God's name. The Teutonic Order's true calling is the conversion and conquest of pagans. In the East, the Orthodox lands of Rus await; on the Baltic shore, an alliance with the Livonian Order beckons. As with the conquest of Prussia before it, plant the crusader banner from the eastern Baltic shore to northern Russia. The crusading indulgence granted by Gregory IX remains eternally valid — complete the Northern Crusade in God's name, and carve the Grand Master's name into history."
 teu_livonian_alliance: "Alliance with the Livonian Order"
 teu_livonian_alliance_desc: "The Livonian Order — successor to the Brothers of the Sword, absorbed into the Teutonic Order in 1237. Based at Riga, this order controls the eastern Baltic shore but is under constant pressure from Lithuania and Rus. It suffered defeat by Alexander Nevsky at the Battle of Lake Peipus in 1242, and a devastating blow from Lithuania at Durbe in 1260. Now, forge an alliance with the Livonian Order and build a joint system to rule the eastern Baltic together — borrow the strength of the brother order to defeat the enemies of the East."
 teu_conquer_livonia: "Conquer Livonia"
 teu_conquer_livonia_desc: "Livonia — corresponding to modern Latvia and Estonia — has been a crusader frontier since the founding of the Bishopric of Riga in 1201. Estonians, Latvians, Livs — bring this land of many peoples fully under Teutonic control. In 1346, Denmark even sold Estonia (Reval) to the Order. Seize the entire eastern Baltic shore, and make Riga's trade routes and Livonia's farmland the Order's source of income — without Livonia, there is no mastery of the Baltic."
 teu_crusade_east: "Crusade to the East"
 teu_crusade_east_desc: "Turn the crusader sword eastward — the Orthodox 'schismatics,' the Romuva 'pagans,' the Muslim 'infidels.' All of these are enemies of the Catholic faith and targets of the crusade. Since the 1230s, the Teutonic Order has waged the 'Northern Crusade' across the lands of the Balts. Now broaden the horizon further east, and wage holy war against the heart of Eastern Orthodoxy and the last strongholds of the Balts. Lithuania's conversion to Catholicism in 1386 reduced the number of 'legitimate' crusade targets, but the Orthodox states of Russia still remain."
 teu_riga_crusade: "Riga, Crusader Stronghold"
 teu_riga_crusade_desc: "Riga — founded in 1201 by Bishop Albert of Buxhoeveden, this city is the most important stronghold on the eastern Baltic shore. A long power struggle has raged between the Livonian Order and the Archbishop of Riga, but if the Teutonic Order can unify the city and develop it as a forward base for the eastern crusade, it becomes a foothold for confronting Rus. Sitting at the mouth of the Daugava, Riga is vital both for trade and for war — securing it establishes the supply line for the eastward advance."
 teu_march_to_orthodox: "March on Orthodoxy"
 teu_march_to_orthodox_desc: "The 'heretical' Orthodox Church — to Roman Catholic eyes, the Byzantine and Rus churches have held the 'wrong faith' ever since the Great Schism of 1054. The Republic of Novgorod, Pskov, the Russian principalities — these Orthodox states are the true target of the Northern Crusade. In 1242, Alexander Nevsky defeated the Livonian Order on the ice of Lake Peipus and is still celebrated as 'the hero who beat the crusaders.' Avenge that defeat and plant the Catholic banner upon Orthodox soil — this is the Teutonic Order's ultimate mission."
 teu_northern_crusade_final: "The Northern Crusade Completed"
 teu_northern_crusade_final_desc: "The Northern Crusade — beginning with the conquest of Prussia and stretching across the eastern Baltic shore into the depths of Rus — is at last nearing completion. As with the Prussians before them, the Orthodox must be converted or conquered. The Baltic becomes an inland sea of the Teutonic Order, and the Grand Master's banner flies to the eastern edge of the world. The dream of the 'Northern Crusade,' carried forward from the 13th-century Brothers of the Sword — uniting the lands of Balts, Slavs, and Finns into a holy empire — is now realized."
 teu_secularize_path: "The Path of Secularization"
 teu_secularize_path_desc: "On 10 April 1525, at Krakow, Albert of Hohenzollern declared the founding of the Duchy of Prussia as a vassal of King Sigismund I of Poland — the secularization of the Teutonic Order. In exchange for converting to Lutheranism, the Order's lands would survive as a secular duchy. Catholic states raged at this 'betrayal,' but the rising tide of Protestantism gave the Order a new path forward. Ride the wave of the Reformation and, as a secular prince, lay the foundations of modern Prussia — this is the Order's new way of life in a new age."
 teu_prussian_duchy: "Duchy of Prussia"
 teu_prussian_duchy_desc: "The Duchy of Prussia — born of secularization in 1525 — developed rapidly under Hohenzollern rule. With Königsberg as its capital, it actively promoted the Lutheran Reformation and, through the University of Königsberg (founded 1544), styled itself the 'Prussia of learning.' A former crusader state now transforms into a modern duchy. Build the administration, forge cooperation with the noble Junkers, and establish the foundations of a military state — the first step toward the future Kingdom of Prussia, and later the German Empire."
 teu_control_pomerania: "Control Pomerania"
 teu_control_pomerania_desc: "Pomerania — stretching along the southern Baltic shore west of the Vistula — has long been contested by the German princes, Denmark, and Poland. The Griffin dynasty's Duchy of Pomerania is a small state squeezed between Prussia and Brandenburg, but its access to the Baltic makes it strategically vital. By seizing Pomerania, Prussia becomes the true master of the Baltic. Control the port of Stettin (Szczecin) and the Oder's waterways, and forge the 'North German axis' linking Brandenburg and Pomerania."
 teu_protestant_reformation: "Protestant Reformation"
 teu_protestant_reformation_desc: "In 1517, Martin Luther nailed his Ninety-Five Theses to the church door at Wittenberg — and the wave of Reformation struck Prussia directly. Grand Master Albert himself met with Luther and chose to secularize the Order. Prussia's embrace of Lutheranism became the foundation of a 'Protestant league' against the Catholic Habsburgs. Actively advance the Reformation, and modernize education and administration — the scholarly tradition of the University of Königsberg and Prussia's disciplined bureaucracy will become the bedrock of Prussian culture for generations to come."
 teu_dominate_hre: "Rise Within the Holy Roman Empire"
 teu_dominate_hre_desc: "The Holy Roman Empire — mocked as 'neither holy, nor Roman, nor an empire' — is a complex political order. How will Prussia navigate it? The power of the Habsburg emperors, the rivalries of the electors, the fractures caused by the Reformation — all of these create openings for Prussia's rise. The 1618 union of Brandenburg and Prussia under Hohenzollern inheritance would become the foundation of a later united Germany. Establish your status as an elector, expand your influence within the Empire, and raise Prussia as a rival to the Habsburgs and leader of northern Germany."
 teu_north_german_empire: "North German Confederation"
 teu_north_german_empire_desc: "The North German Empire — Bismarck's dream, the ambition of the House of Hohenzollern. In the 18th century, Frederick the Great proved Prussia's might in the Seven Years' War against Austria; in the 19th, Bismarck united Germany through 'blood and iron.' But long before that, as the successor state to the Teutonic Order, Prussia's dream of uniting all of northern Germany already had a long history. Brandenburg, Pomerania, Mecklenburg, Hanover — rally the princes of northern Germany, and realize here and now the North German Confederation that will be the forerunner of the modern German state."
 teu_malbork_citadel: "Strengthen Malbork Citadel"
 teu_malbork_citadel_desc: "Malbork Castle (Marienburg) — this vast brick fortress on the Vistula delta is the headquarters of the Teutonic Order. Relocated from Venice in 1309, it stands as the largest medieval brick castle in Europe. After the defeat at Grunwald in 1410, it was besieged by Polish forces but held under the command of acting Grand Master Heinrich von Plauen. Malbork's walls are the very symbol of the Order's state — fortifying it into an impregnable stronghold is the foundation of every defensive strategy."
 teu_konigsberg_dev: "Develop Königsberg"
 teu_konigsberg_dev_desc: "Königsberg (modern Kaliningrad) — founded in 1255 with the support of King Ottokar II of Bohemia, this city grew into the center of the Prussian colony. A university was founded there in 1544, later the birthplace of the philosopher Immanuel Kant. Sitting at the mouth of the Pregel, this city is a vital Baltic trading hub and has served as the de facto capital of the Order's state. Develop its urban infrastructure, expand its cathedral and markets, and let it flourish as a relay point for Nordic and Eastern European trade — strengthening the heart of Prussia is the wellspring of national power."
 teu_danzig_port: "Develop the Port of Danzig"
 teu_danzig_port_desc: "Danzig (Gdańsk) — sitting at the mouth of the Vistula, this is the greatest port city on the Baltic. In 1308, the Teutonic Order 'seized' Danzig from its Polish allies, and has since made it flourish as a hub of Baltic trade. But the Second Peace of Thorn in 1466 ceded the city to Poland, which prizes it as the heart of 'Royal Prussia.' Reclaim Danzig, integrate it into the Hanseatic trade network, and maximize the profits of the Baltic grain trade — this city, known as the 'Queen of the Baltic,' is the Order's financial lifeline."
 teu_teutonic_law: "The Teutonic Law Code"
 teu_teutonic_law_desc: "The Kulm law of the 1230s (Kulmer Handfeste) — the first legal code granted by the Teutonic Order to its colonial towns. Building on this, the Prussian legal system developed and became the legal foundation for German eastward colonization. The archiepiscopal decree of 1489, the Prussian law code of 1529 — legal development is the means by which the Order's state transforms from 'barbarous conqueror' into 'bearer of civilization.' Streamline administration, protect peasant rights, and develop commercial law — establish Prussia as a state ruled by law."
 teu_amber_trade: "Seize the Amber Trade"
 teu_amber_trade_desc: "The gold of the Baltic — amber. Called 'the gold of the North' since antiquity, this gem is found only along the Baltic coast and was once carried as far as the Mediterranean world. After conquering Prussia, the Teutonic Order claimed a monopoly on amber, punishing smugglers with death. This 'amber monopoly' is one of the Order's most vital sources of revenue. Take full control of the Baltic amber-producing regions and dominate the trade routes into Central Europe — for beside the sword, the wealth of amber is another source of the Order's power."
 teu_hanseatic_ties: "Ties with the Hanseatic League"
 teu_hanseatic_ties_desc: "The Hanseatic League — this union of German merchant cities led by Lübeck dominates trade across the Baltic and North Seas. Danzig, Riga, Reval (Tallinn) — all of these cities are major Hanseatic hubs, and their territories overlap with the Teutonic Order's own domain. Hanseatic merchants carried Prussian grain, timber, and amber to Western Europe, bringing back cloth, wine, and salt in return. Build close ties with the Hanseatic League and become the effective master of the Baltic trade network — secure the Order's prosperity through both sword and commerce."
 teu_colonize_prussia: "Colonize Prussia"
 teu_colonize_prussia_desc: "The Ostsiedlung — the great historical migration of Germans settling east of the Elbe from the 11th to the 14th century. The Teutonic Order stood at the forefront of this movement, drawing German farmers, craftsmen, and merchants into conquered Prussia. In exchange for the disappearance of the native Prussian peoples, this land was colonized as the 'German eastern frontier.' Planned town-building, agricultural development, road construction — these are the means by which a 'barbarous land' is drawn into the European sphere of civilization. Complete the colonization of Prussia and establish it firmly as German soil."
 teu_torun_city: "Develop Toruń"
 teu_torun_city_desc: "Toruń — built along the Vistula, this city was the Teutonic Order's very first stronghold, founded in 1231. The 'Treaties of Thorn' of 1454 and 1466 defined its relationship with Poland: the first brought peace, the second the Order's humiliating cession of territory. In 1473, Copernicus was born here — the astronomer who proposed the heliocentric theory. Develop Toruń, the birthplace of the Order's history, and rebuild it as a center of Vistula river trade."
 teu_memel_fortress: "Fortify Memel"
 teu_memel_fortress_desc: "Memel (Klaipėda) — at the mouth of the Neman on the Lithuanian-Prussian border, this fortress town was built by the Teutonic Order as the front line of defense against Lithuania. Memel Castle, founded in 1252, has weathered countless battles with Lithuania. Should this fortress fall, the gates to Prussia lie open — conversely, holding Memel firm is the key to blocking Lithuanian incursion. Fortify this gateway to the Baltic, and let it serve as an inland hub for the amber trade."
 teu_teutonic_order_army: "Elite Teutonic Order Army"
 teu_teutonic_order_army_desc: "The Teutonic Order's military power — heavy cavalry drawn from vow-bound knight-monks forms its elite core, supported by mercenaries, conscripted colonial farmers, and allied reinforcements. The defeat at Grunwald in 1410 was a rout caused by the numerical superiority of the Polish-Lithuanian union, but individually the Order's heavy cavalry ranked among the strongest in Europe at the time. 'The shock of the heavy knight' is the very core of Teutonic tactics — hone it, and rebuild the military might of the Order's state."
 teu_grand_master: "The Grand Master's Hegemony"
 teu_grand_master_desc: "The Grand Master (Hochmeister) — supreme leader of the Teutonic Order. As Christ's vicar, he leads the knight-monks in ruling a crusader empire stretching from the Baltic across all Eastern Europe. Hermann von Salza (1209–1239) established the Order's political foundations through diplomacy with Frederick II, and the reign of Winrich von Kniprode (1351–1382) marked the Order's golden age. Now every enemy is conquered and the Northern Crusade complete — the Grand Master's authority extends from the Baltic to the lands of the Orthodox. As a Grand Master whose name shall be carved into history, bring the will of God to the very ends of the East."
 teu_prussian_king: "Proclamation of the King of Prussia"
 teu_prussian_king_desc: "King of Prussia — on 18 January 1701, Frederick III crowned himself, at Königsberg, as King Frederick I of Prussia. By crowning himself in Prussia (the former lands of the Teutonic Order), which lay outside the jurisdiction of the Holy Roman Emperor, he found a clever way to claim a royal title without Habsburg approval. 'Frederick the Great,' Frederick II, seized Silesia and won the Seven Years' War, raising Prussia into a great European power. 'Prussia is not a country with an army, but an army with a country' — under this national philosophy, lay here and now the foundations of modern Germany."
 teu_events.10.t: "The Future of the Order — Crusade or Secularization"
 teu_events.10.d: "With Lithuania and Poland subdued, the Teutonic Order now faces a historic choice. Continue under the crusader banner, striking down the pagans and Orthodox of the East — or secularize into a modern principality and transform into the Kingdom of Prussia."
 teu_events.10.a: "The path of the Crusade — defeat the pagans and Orthodox of the East and complete the Northern Crusade"
 teu_events.10.b: "The path of secularization — build the Duchy of Prussia and lay the foundations of modern Germany"
 teu_events.50.t: "The Northern Crusade Completed"
 teu_events.50.d: "'It is God's will' — from the Baltic to the far reaches of Rus, the Teutonic Order's crusade is complete. The cross shines bright across the northern lands."
 teu_events.50.a: "Long live the crusade! The Grand Master's hegemony is established!"
 teu_constantinople_fall: "The Fall of Constantinople"
 teu_constantinople_fall_desc: "With the Northern Crusade now complete, the Teutonic Order turns its gaze to the south. Constantinople, once the eastern bulwark of Christendom, has long since fallen into the hands of heretics and infidels. Reclaim this ancient imperial city and raise the banner of the true faith over the Golden Horn once more. The road to the Holy Land of Jerusalem begins with the liberation of this city."
 teu_jerusalem_reclaimed: "The Reclamation of Jerusalem"
 teu_jerusalem_reclaimed_desc: "With Constantinople reclaimed, the crusade's final goal is now singular — the Holy Land of Jerusalem itself. Countless crusaders have tried and countless crusaders have fallen on this soil; now the time has come for the black cross of the Teutonic Order to fly here. Offer prayers at the Church of the Holy Sepulchre, and fulfill the age-old dream of Christendom."
 teu_events.55.t: "Constantinople, Ours at Last"
 teu_events.55.d: "Having completed the Northern Crusade, the Teutonic Order turned its spear southward. Constantinople, once the very symbol of Byzantine glory, had become little more than a ruin, trampled by heretics and infidels. But the Order's armies liberated the city, and once more raised the cross over the Hagia Sophia. The next goal is clear — reclaim the Holy Land of Jerusalem."
 teu_events.55.a: "The road to the Holy Land lies open — onward to Jerusalem!"
 teu_events.56.t: "Jerusalem, Liberated"
 teu_events.56.d: "A dream that crusaders have chased across the centuries, and a hope that has been dashed time and again — the reclamation of the Holy Land of Jerusalem has at last been achieved. As the Teutonic Order's banner flies above the Church of the Holy Sepulchre, all of Christendom rejoices at this victory. The Grand Master's name shall be spoken forever alongside those of the great crusader leaders of old. Through this sacred triumph, the ruler's valor and glory have become immortal."
 teu_events.56.a: "God is with us! The Holy Land is liberated!"
 teu_events.60.t: "The North German Confederation Proclaimed"
 teu_events.60.d: "From Prussia to Pomerania and Brandenburg — all of northern Germany is united under the Prussian banner. The dawn of the modern German state."
 teu_events.60.a: "Long live Prussia! Long live the North German Confederation!"
 teu_events.99.t: "The Order's Final Goal"
 teu_events.99.d: "The Teutonic Order's mission is fulfilled — its name is carved into history as a great empire that ruled the Baltic."
 teu_events.99.a: "Long live the Teutonic Order!"
 STATIC_MODIFIER_NAME_teu_amber_mod: "Amber Trade Monopoly"
 STATIC_MODIFIER_DESC_teu_amber_mod: "The Baltic's gold, amber — its monopolized trade fills the Teutonic Order's coffers."
 STATIC_MODIFIER_NAME_teu_christian_mod: "Christianization of Prussia"
 STATIC_MODIFIER_DESC_teu_christian_mod: "The Catholic faith has taken root across Prussia, establishing religious authority."
 STATIC_MODIFIER_NAME_teu_colonize_mod: "Colonization of Prussia"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "The wave of eastward colonization has brought population and settlers to Prussia."
 STATIC_MODIFIER_NAME_teu_conquer_livonia_mod: "Conquest of Livonia"
 STATIC_MODIFIER_DESC_teu_conquer_livonia_mod: "The conquest of all Livonia has strengthened heavy cavalry power and manpower."
 STATIC_MODIFIER_NAME_teu_crusade_start_mod: "Banner of the Northern Crusade"
 STATIC_MODIFIER_DESC_teu_crusade_start_mod: "Under the crusader banner, army morale, discipline, and combat power against heathens are strengthened."
 STATIC_MODIFIER_NAME_teu_danzig_mod: "Prosperity of the Port of Danzig"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "The 'Queen of the Baltic,' Danzig, has been developed as the hub of the Order's maritime trade."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Establishment of the Duchy of Prussia"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "The secularized Duchy of Prussia has been organized as a modern administrative state."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Crusade to the East"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "The holy war against the Orthodox and pagans of the East has strengthened army morale, heavy cavalry, and foreign conscription."
 STATIC_MODIFIER_NAME_teu_grand_master_mod: "The Grand Master's Hegemony"
 STATIC_MODIFIER_DESC_teu_grand_master_mod: "The Grand Master of the Teutonic Order rules from the Baltic across all of Eastern Europe."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Ties with the Hanseatic League"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Close ties with the Hanseatic League have greatly improved trade income and naval efficiency."
 STATIC_MODIFIER_NAME_teu_hre_mod: "Rise within the HRE"
 STATIC_MODIFIER_DESC_teu_hre_mod: "Prussia has risen as a central power within the Holy Roman Empire."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Prosperity of Königsberg"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Königsberg, the heart of Prussia, flourishes as a city of trade and learning."
 STATIC_MODIFIER_NAME_teu_law_mod: "The Teutonic Law Code"
 STATIC_MODIFIER_DESC_teu_law_mod: "The codification of the Order's laws has improved governance efficiency and parliamentary function."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "Legacy of the Teutonic Order"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "The Teutonic Order's tradition has increased the speed of integration across the realm."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Subjugation of Lithuania"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "The conquest of Samogitia has established a buffer zone against Lithuania and strengthened foreign conscription."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Mastery of Livonia"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "The alliance with the Livonian Order has secured control of the eastern Baltic shore."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Fortification of Malbork"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Malbork has been fortified into an impregnable stronghold, the cornerstone of the Order's defense."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Fortification of Memel"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Memel has been developed into a fortified port city, securing the frontier against Lithuania."
 STATIC_MODIFIER_NAME_teu_order_army_mod: "The Teutonic Order's Army"
 STATIC_MODIFIER_DESC_teu_order_army_mod: "Elite heavy cavalry drawn from the monastic knighthood stands at the pinnacle of the Order's military power."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "March on Orthodoxy"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "War against Orthodox states has improved war score conditions and manpower."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Subjugation of Poland"
 STATIC_MODIFIER_DESC_teu_poland_mod: "The humiliation of Grunwald has been avenged — discipline and manpower are strengthened."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Control of Pomerania"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "Antagonism from other powers is reduced, having secured control of the Baltic coast."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "Protestant Reformation"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "The Lutheran Reformation has brought great advances to Prussia's education, research, and culture."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Order of Prussia's Conquest"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "The complete subjugation of Prussia has stamped out the seeds of rebellion."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "Kingdom of Prussia"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "The modern Kingdom of Prussia is established as the master of northern Germany."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "Reclamation of Constantinople"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "Constantinople has been liberated from heretics and infidels, restoring the light of faith to the East. Conversion accelerates, and military power against heathens is increased."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Reclaimer of Jerusalem"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "As the hero who liberated the Holy Land, the ruler's martial valor and lifespan are greatly increased, and the prestige of conquest improves military discipline and occupation administration."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Riga, Crusader Stronghold"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Riga has been developed as the commercial, military, and crusading center of the eastern Baltic shore."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "The First Step of Secularization"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Secularization has improved parliamentary legislative efficiency, opening the path to a modern state."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Prosperity of Toruń"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Toruń, birthplace of Copernicus, flourishes as a center of Vistula river trade."
 teu_samogitia_campaign: "Samogitian Campaign"
 teu_samogitia_campaign_desc: "Samogitia (Žemaitija) — a land fought over for centuries between the Teutonic Order and Lithuania in western Lithuania. The Order needed control of this land to link Prussia and Livonia by land. The 1398 Treaty of Salynas saw Lithuania cede Samogitia to the Order, but after the defeat at Grunwald in 1410, the 1411 Peace of Thorn forced its return. The Samogitians resisted to the very last as a bastion of paganism — a stubborn people who kept their pagan faith even after Lithuania's conversion to Catholicism in 1387. Conquer this land and establish an overland link between Prussia and Livonia."
 teu_mazovia_subjugation: "Subjugation of Mazovia"
 teu_mazovia_subjugation_desc: "Mazovia — the Polish heartland spreading along the middle Vistula. This land, where Warsaw would later be built, is Poland's gateway to the east and a major invasion route into Prussia. The Duchy of Mazovia was ruled by a cadet branch of the Polish Piast dynasty until it was absorbed into the Kingdom of Poland in 1526 upon the extinction of its ruling line. Controlling this land removes the threat from the south and secures Prussia's safety. Make the rich farmland of the Vistula basin the Teutonic Order's granary."
 teu_narva_fortress: "Fortress of Narva"
 teu_narva_fortress_desc: "Narva — this fortress town on the Narva river on Estonia's northern coast marks the strategic border between Livonia and Russia. Across the river stands Russia's Ivangorod fortress, a true point of civilizational collision. Sold to the Teutonic Order by Denmark along with Estonia's northern tip in 1346, Narva serves as a forward base for the eastern crusade. In 1558 it is fated to fall briefly to the forces of Ivan the Terrible — but change that fate here and now. Fortify Narva into an impregnable stronghold, and keep the pressure on Orthodox Russia."
 teu_berlin_dev: "Development of Berlin"
 teu_berlin_dev_desc: "Berlin — this small town at the confluence of the Spree and Havel rivers was founded in the 13th century as twin towns (Berlin and Cölln) by the Margrave of Brandenburg. For now it is just a minor seat of the Hohenzollern Electors of Brandenburg, but once Prussia unites with Brandenburg, this place is destined to become an imperial capital. With the 1618 personal union of Brandenburg-Prussia and the founding of the Kingdom of Prussia in 1701, Berlin became the heart of northern Germany. Lay that foundation now — developing Berlin will give birth to the city that symbolizes the unification of northern Germany."
 teu_junker_system: "Establishment of the Junker System"
 teu_junker_system_desc: "Junker — German for 'young lord,' this term refers to Prussia's militarized landed nobility. Owning vast estates (Gutsherrschaft) east of the Elbe, the Junkers used serf labor to produce grain for export to Western Europe via the Baltic. But their true role was military — Junkers filled the majority of officer posts in the Prussian army, forming the very core of 'Prussia as a military state.' Frederick William I (the 'Soldier King') forcibly sent Junkers into military academies, institutionalizing their military obligation. Establish the Junker system now, and lay the foundation for the 'Prussian military culture' that endures for generations."
 teu_silesia_claim: "Control of Silesia"
 teu_silesia_claim_desc: "Silesia — spreading along the upper Oder, this region holds the potential to become Central Europe's greatest industrial zone, rich in coal, iron ore, and zinc. Once part of the Polish Piast domains, it fell under the Kingdom of Bohemia after 1335, and became part of Austria through the Habsburg succession to Bohemia in 1526. But in 1740, Frederick the Great launched a lightning invasion of Silesia at the very outset of the War of the Austrian Succession, seizing this rich land 'by force.' Take Silesia now, for Prussia — its industrial strength will become the economic foundation of the Prussian empire."
 teu_cathedral_network: "Network of Cathedrals"
 teu_cathedral_network_desc: "A network of cathedrals across all of Prussia — the Teutonic Order always built churches on conquered land. Königsberg Cathedral, the castle chapel of Marienburg, St. John's Church in Toruń — all were instruments to plant the Catholic faith in pagan soil. Organizing the parish system, establishing bishoprics, building monasteries — these are the institutional means by which 'barbarous lands' are drawn into Christian civilization. A cathedral is both an act of service to God and a symbol of colonial rule. Establish a network of cathedrals across Prussia, and strengthen the Teutonic Order's religious authority and legitimacy of rule."
 teu_elbing_dev: "Development of Elbing"
 teu_elbing_dev_desc: "Elbing (Elbląg) — founded in 1237 at the eastern edge of the Vistula delta, this city is one of Prussia's most important ports alongside Danzig, and an important member of the Hanseatic League. Linked to Königsberg by inland waterways, it flourished as an export port for grain, timber, and amber. Like Danzig, it fell under Polish control after the Second Peace of Thorn (1466), but for Prussia, full control of the Vistula delta is essential as an outlet to the sea. Develop Elbing, and establish a twin system of great Baltic ports alongside Danzig."
 STATIC_MODIFIER_NAME_teu_samogitia_mod: "Samogitia Conquered"
 STATIC_MODIFIER_DESC_teu_samogitia_mod: "Samogitia has been conquered, improving the Teutonic Order's light cavalry power."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Mazovia Subjugated"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "Mazovia has been subjugated, securing the southern border."
 STATIC_MODIFIER_NAME_teu_narva_mod: "Fortress of Narva"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Narva has been fortified into an impregnable stronghold in the east."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Development of Berlin"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Berlin has been developed as the capital of Prussia."
 STATIC_MODIFIER_NAME_teu_junker_mod: "The Junker System"
 STATIC_MODIFIER_DESC_teu_junker_mod: "The Prussian Junker system has been established, improving military power and administrative capability."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Silesia Conquered"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Silesia has been conquered, greatly improving Prussia's economic power."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "Network of Cathedrals"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "Cathedrals have been built across Prussia, and the Catholic faith has taken root."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Prosperity of the Port of Elbing"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Elbing has been developed as a major Baltic port city."
 teu_secure_prussia_tt: "No unintegrated locations in the states of Danzig and Tuchola"
 teu_mongol_empire: "The Mongol Stronghold Falls"
 teu_mongol_empire_desc: "Sarai, Kazan, Samarkand, Kaffa, Dadu, Karakorum — one by one, the great capitals of the Mongol Empire that once shook the world have fallen beneath the black cross banner. The 'Great Mongol Nation,' founded by Genghis Khan in 1206, fragmented by the end of the 13th century and its former glory is long gone. Into what remains of its domain, the iron armies of the Teutonic Order march from east and west alike, subduing the masters of the steppe. From the Pacific in the east to the Baltic in the west — the entire Mongol legacy is seized by the empire of the cross."
 teu_sacred_nomads: "The Great Khan's Throne, Usurped"
 teu_sacred_nomads_desc: "With the whole of the Mongol Empire conquered, the Grand Master now claims for himself the title the steppe peoples fear above all — 'Khan' — as a spoil of war. This is neither fusion nor coexistence; it is simply the conqueror seating himself upon the loser's throne. Heavy cavalry bearing the cross have become masters of what was once the most feared horde on earth. Unite the empires of East and West in God's will — this is the Teutonic Order's ultimate victory."
 teu_events.70.t: "The Mongol Capitals, Ours"
 teu_events.70.d: "Sarai, Kazan, Samarkand, Kaffa, Dadu, Karakorum — every capital of the Mongol Empire has fallen. From this day the Grand Master styles himself the 'German Great Khan,' but not as an heir to Mongol blood or culture. It is nothing more than a conqueror seizing the loser's title as a mark of his own authority. Pax Deus — the peace of God — now supplants what was once the dominion of the steppe."
 teu_events.70.a: "The Mongol domains are ours at last!"
 teu_events.80.t: "The Iron Cross Rules the World"
 teu_events.80.d: "As the final act of the conquest of the Mongol Empire, the Teutonic Order has brought both the eastern and western empires completely under its own rule. The peoples of the steppe submit, and a new order is imposed under the authority of the cross. This is not fusion, but the pure completion of conquest — the Order remains the Order, and has become master of the greatest empire on earth."
 teu_events.80.a: "By God's will, the world is ours!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Conquest of the Mongols"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "The Mongol Empire's military machine has been seized — the horsemen of the steppe now serve under Teutonic command."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "The Great Khan's Throne"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Ruling as master of what was once a world empire — the Mongols have been utterly conquered by the Teutonic Order."
 teu_great_khan_name: "German Great Khanate"
 teu_events.11.t: "The Vow of the Northern Crusade"
 teu_events.11.d: "The gates to the East stand open — with Lithuania and Poland subdued, the time has come for the Teutonic Order to make a historic decision. Every knight swears before the Grand Master's authority: 'By God's will, we shall destroy the pagans and Orthodox of the East, and complete the Northern Crusade.' This vow becomes the governing principle of the Teutonic Order's state, and the higher its legitimacy, the greater its discipline and order. But the moment the theocratic government is abandoned, this vow expires."
 teu_events.11.a: "We swear it — by God's will, complete the Northern Crusade!"
 teu_steppe_crusade: "Crusade of the Steppe"
 teu_steppe_crusade_desc: "The Pontic Steppe — once the heart of the Mongol Empire, an endless grassland ruled by the Tatars. Now, with the Teutonic Order's heavy cavalry fused with Mongol-style light horsemen, conquer this steppe and establish supremacy over all Eastern Europe. He who rules the steppe rules Eastern Europe — prove that truth with the strength of the Teutonic Order."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "Crusade of the Steppe"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "The conquest of the steppe has greatly improved the Teutonic Order's looting, mobility, and cavalry power."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Crusader Plunder"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "The crusade's plunder has exhausted the population — prosperity, population, and development are declining."
 teu_crusade_path_reform: "Discipline of the Crusader Order"
 teu_crusade_path_reform_desc: "The Teutonic Order is governed by the vow of the Northern Crusade. As the first step toward the eastern campaign, the Grand Master bound all knight-monks to this oath of discipline. It expires if the theocratic government is abandoned."
