 mapmode_bag_wtp_selection_name: "Where To Produce"
 mapmode_bag_wtp_selection_desc: "Bright is chosen for the plan, dim is what you are choosing from."
 bag_wtp_map_picked_tt: "Chosen for the plan."
 bag_wtp_map_browsable_tt: "Inside the ticked continents, not chosen."
