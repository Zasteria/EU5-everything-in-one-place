l_english:
 bag_wtp_food_pot_value: "[Location.MakeScope.GetVariable('bag_wtp_food_pot').GetValue|0]"
 bag_wtp_food_pot_tt: "#Y Food potential.#!\n\nThe number Construction Manager's map mode paints: how much food this location yields once its food buildings are taken to their maximum — windmill, irrigation, farming village.\n\nShown in hundredths so it reads as a whole number: 150 means 1.5.\n\nIt is what decides which location becomes a #Y granary#! (the food icon beside it) and which gets production. Empty means the location's raw material is not a food good.\n\nThe formula is copied from CM at build time, so the number matches while the mod keeps working without CM."
 bag_wtp__tech__source_name: "Buildings from other mods"
 bag_wtp__tech__source_desc: "The mods «Where To Produce» took production buildings from. Unticking one keeps that mod's buildings out of the plans — both «now» and «at the end».\n\nA building is still only placed where your country can actually build it: another nation's buildings never enter the plan anyway.\n\nThe list is gathered at build time and shows the mods whose buildings really reached the pool."
 bag_wtp__source_name: "Mods the buildings come from"
 bag_wtp__source_desc: "Every mod whose production buildings this one found at build time gets a row here.\n\nUnticking does not remove the building from the files — the script is written at build time — it closes the availability gate on it, so it stops entering both the \"now\" and the \"end\" plan.\n\nEmpty means no other mod with production buildings of its own was found at build time."
 bag_wtp__source_item_column_name: "Mod"
 bag_wtp__source__pick_name: "Read"
 bag_wtp__source__pick_desc: "Take this mod's production buildings into the plans."
 bag_wtp_raze_loc_tt: "#Y Demolish the rest: this location.#!\n\nDemolishes production buildings the plan does not put here.\n\n#R It really demolishes, with no confirmation.#!\n\nIt touches #Y production buildings only#! — the ones the plan builds with, villages included. Garrisons, ports, universities and everything else are not in that list at all.\n\nA building stays if the plan puts it here, or it is the highest available rung of what the plan puts here: a workshop under a planned mill is not demolished."
 bag_wtp_raze_prov_tt: "#Y Demolish the rest: the whole province.#!\n\nThe same across every plan location in this province.\n\n#R It really demolishes, with no confirmation.#!\n\nIt touches #Y production buildings only#! — the ones the plan builds with, villages included. Garrisons, ports, universities and everything else are not in that list at all.\n\nA building stays if the plan puts it here, or it is the highest available rung of what the plan puts here: a workshop under a planned mill is not demolished."
 bag_wtp_raze_all_tt: "#Y Demolish the rest: the whole plan.#!\n\nThe same across the whole plan.\n\n#R It really demolishes, with no confirmation.#!\n\nIt touches #Y production buildings only#! — the ones the plan builds with, villages included. Garrisons, ports, universities and everything else are not in that list at all.\n\nA building stays if the plan puts it here, or it is the highest available rung of what the plan puts here: a workshop under a planned mill is not demolished."
 bag_wtp_food_loc_tt: "#Y Granary.#!\n\nTurns on Construction Manager's granary mode for this location — the same switch as its own button in the location panel.\n\nThe plan #Y builds nothing there#!: no buildings placed, its rooms not counted. It does not vanish from the plan, its RGO still counts, and the gain its raw material gives the whole province stays."
 bag_wtp_cm_loc_tt: "#Y Auto-build: this location.#!\n\nOne press ticks Construction Manager's auto-build boxes — the two up arrows in the location's building list — for every building the plan puts here.\n\nOnly the plan's buildings that #Y can really stand in the location#! are switched: the true rank, terrain, market and advances — not the plan's town/village toggle. And the same rung the «In the plan, here» filter shows.\n\nOne button both ways: not every box ticked — it ticks them all; all ticked — it clears them.\n\n#Y The mod does nothing beyond that.#! When and what to build is Construction Manager's decision."
 bag_wtp_cm_prov_tt: "#Y Auto-build: the whole province.#!\n\nThe same at once across every plan location in this province.\n\nOnly the plan's buildings that #Y can really stand in the location#! are switched: the true rank, terrain, market and advances — not the plan's town/village toggle. And the same rung the «In the plan, here» filter shows.\n\nOne button both ways: not every box ticked — it ticks them all; all ticked — it clears them.\n\n#Y The mod does nothing beyond that.#! When and what to build is Construction Manager's decision."
 bag_wtp_cm_all_tt: "#Y Auto-build: the whole plan.#!\n\nThe same at once across the whole plan.\n\nOnly the plan's buildings that #Y can really stand in the location#! are switched: the true rank, terrain, market and advances — not the plan's town/village toggle. And the same rung the «In the plan, here» filter shows.\n\nOne button both ways: not every box ticked — it ticks them all; all ticked — it clears them.\n\n#Y The mod does nothing beyond that.#! When and what to build is Construction Manager's decision."
 search_filter_bag_wtp_planned_name: "Plannable"
 search_filter_bag_wtp_planned_desc: "Only the buildings «Where To Produce» plans with at all: production, not garrisons or ports. Reads nothing off the map — it just shortens the list."
 search_filter_bag_wtp_plan_here_name: "In the plan, here"
 search_filter_bag_wtp_plan_here_desc: "Only the buildings the plan puts #Y in this very location#!.\n\nIt shows the plan that is on the map now: load a slot in the editor and the chip shows that one.\n\n#Y The rung you can build, not the one the plan drew.#! An end-game plan puts the top of the ladder — a pottery mill where only the workshop is available yet. The chip then leaves #Y the highest rung of that same ladder you can build now#!, so the good does not vanish from the list.\n\nVillages are in the list like anything else: the plan puts them there too."
 bag_wtp_name: "Where To Produce"
 bag_wtp_desc: "A planning tool. Name a good and the ground, and the mod finds the best production method available in each location and ranks the locations by what that method would earn from the raw materials there."


