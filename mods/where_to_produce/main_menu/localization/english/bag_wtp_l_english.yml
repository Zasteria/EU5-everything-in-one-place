 mapmode_bag_wtp_food_potential_map_name: "Food Potential Per RGO Level"
 MAPMODE_BAG_WTP_FOOD_POTENTIAL: "#T $mapmode_bag_wtp_food_potential_map_name$#!\nThis colors [locations|e] by their natural food potential per [rgo|e] level. The score combines the [rgo|e] [food|e] value, the cumulative [food_productivity|e] (terrain, vegetation, climate, named static modifiers, [rgo|e]-specific output modifiers, etc.), water access, and the assumed-max bonuses from [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')], and [ShowBuildingTypeName('irrigation_systems')] where the [rgo|e] permits.\n\n[development|e] is excluded and every [location|e] is scored as if it were a rural settlement, so the score shows terrain potential rather than current output."
 MAPMODE_BAG_WTP_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] has a food potential per [rgo|e] level of [ROOT.GetLocation.MakeScope.ScriptValue('bag_wtp_fp_value')|1Y]."
 MAPMODE_BAG_WTP_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] is not land so it does not have food potential."
