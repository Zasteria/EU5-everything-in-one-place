l_english:
 mapmode_bag_wtp_best_town_right_name: "Recommended Urban Rights"
 # Shared words. cm_town_right_map_mode_l_english.yml is generated against these,
 # so keep the key names when reworking them.
 # Note to translators: "Grant" is a verb, followed by the name of an urban right.
 bag_wtp_trmm_grant_word: "Grant"
 bag_wtp_trmm_tied_with_label: "Tied with:"
 bag_wtp_trmm_open_slot_here: "Open urban right slot in this location"
 MAPMODE_BAG_WTP_BEST_TOWN_RIGHT: "#T $mapmode_bag_wtp_best_town_right_name$#!\nColors each [location|e] by the specialization [town_rights|e] whose boosted buildings can source the largest share of their input [goods|e] from the [province|e]'s [rgo|e]s. Hover a [location|e] to see every specialization option ranked.\nHover an industry's percentage in the tooltip for a breakdown of its best production method's inputs.\nTies for best show as a striped second color: the tied specialization's color, or a dedicated color when 3+ tie."
 MAPMODE_BAG_WTP_BEST_TOWN_RIGHT_TT_NONE: "[ROOT.GetLocation.GetProvince.GetName] has no [raw_material|e] used by specialized industries.[ROOT.GetLocation.Custom('bag_wtp_trmm_stripe_reason')]"
 MAPMODE_BAG_WTP_BEST_TOWN_RIGHT_TT_WATER: "$bag_wtp_trmm_tt_sea_zone$" # NO-TRANSLATE
 bag_wtp_trmm_legend_none: "No matching raw materials"
 bag_wtp_trmm_legend_granted_best: "Granted urban right at the best fit here (striped)"
 bag_wtp_trmm_legend_granted_poor: "Granted urban right far below the best fit (striped)"
 bag_wtp_trmm_legend_tied_multi: "3+ specializations tied (striped)"
 bag_wtp_trmm_legend_open_slot: "Open urban right slot (striped)"
 bag_wtp_trmm_legend_full_no_spec: "City full with no specialization granted (striped)"
 bag_wtp_trmm_reason_full_no_spec: "\n\nNo open urban right slot and no specialization granted here"
 bag_wtp_trmm_search_legend_100: "100% of inputs local"
 bag_wtp_trmm_search_legend_none: "No raw goods used by this right's industries"
 bag_wtp_trmm_search_legend_granted: "Already granted (striped)"
 bag_wtp_trmm_search_legend_best: "Best or tied-best specialization here (striped)"
 bag_wtp_trmm_search_legend_granted_other: "A different urban right granted (striped)"
 bag_wtp_trmm_search_granted_line: "\nAlready granted in this location"
 bag_wtp_trmm_search_best_line: "\nBest specialization for this location"
 bag_wtp_trmm_search_tied_best_line: "\nTied for best specialization in this location"

 # NO-TRANSLATE BELOW - data functions and shared-key references only.
 bag_wtp_trmm_reason_open_slot: "\n\n$bag_wtp_trmm_open_slot_here$"
 bag_wtp_trmm_search_legend_open_slot: "$bag_wtp_trmm_legend_open_slot$"
 bag_wtp_trmm_search_open_slot_line: "\n$bag_wtp_trmm_open_slot_here$"
 bag_wtp_trmm_tied_with_prefix: " - $bag_wtp_trmm_tied_with_label$ "
