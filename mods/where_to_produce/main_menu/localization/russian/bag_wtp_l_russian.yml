 bag_wtp_plan_provs_head: "Провинций в плане: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_provfill')|0], показано [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_provshown')|0]"
