 bag_wtp_plan_load_value: "[Location.MakeScope.GetVariable('bag_wtp_load').GetValue|0]"
 bag_wtp_plan_load_tt: "Сколько зданий план ставит в эту локацию, но не больше выданного вами лимита."
 bag_wtp_plan_province_tt: "Вся провинция, обе стороны любой границы, которая её сегодня режет."
 bag_wtp_plan_goods_tt: "Что план построил бы здесь: сверху товар, под ним — здание, которое его делает."
 bag_wtp_plan_pass_summary: "Локаций [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_candidates')|0] (городских [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_towns')|0]) · провинций [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_provfill')|0] · мест [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rooms')|0] · товаров [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_scored')|0] · норма [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_quota')|0] · прав выдано [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_rightn')|0] · зданий [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_placed')|0] в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_found')|0] локациях (в строках [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_shown')|0]) · лимиты [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_rural')|0]/[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_urban')|0] · кругов [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_sweeps')|0]"
 bag_wtp_plan_pass_tt: "Что сделал последний план — всё это считает сам проход, и строка написана так, чтобы читаться слева направо: **первый ноль и есть диагноз.**"
