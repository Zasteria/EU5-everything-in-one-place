 bag_wtp__edit_open_desc: "Открывает редактор плана в отдельном окне: три слота сохранения, товары этой земли иконками и «+1» / «−1» у каждого выбранного."
 bag_wtp_edit_window_title: "Где производить — правка плана"
 bag_wtp_edit_slots_head: "Слоты:"
