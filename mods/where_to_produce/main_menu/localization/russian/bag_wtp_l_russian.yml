 # Пикер в окне расчёта.
 bag_wtp_pick_goods_head: "Товар — отметьте один"
 bag_wtp_pick_goods_tt: "Что вы хотите производить.\n\nЗдесь все товары, которые в игре кто-нибудь делает, — и те, что даёт РГО (камень, соль, лес, глина), и те, что не даёт никогда (инструменты, оружие, ткань, стекло)."
 bag_wtp_pick_rights_head: "…или городское право"
 bag_wtp_pick_rights_tt: "Городское право вместо одного товара.\n\nСобственный процент права одинаков в любой локации мира и потому порядок не меняет; ранжирование строится на наборе товаров и их рыночных ценах."
 bag_wtp_search_by_end: "Считать на конец игры"
 bag_wtp_search_by_end_tt: "Выключено: порядок по тому, что можно построить сегодня, — быстрый ответ, лучшее на это десятилетие."
 bag_wtp_search_run: "Искать локации"
 bag_wtp_search_run_tt: "Пройти по выбранным локациям, подобрать каждой лучшие методы производства отмеченного товара (или все товары отмеченного права) и показать результат."

