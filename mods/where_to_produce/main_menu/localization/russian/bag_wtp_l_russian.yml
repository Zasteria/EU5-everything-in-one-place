 bag_wtp_plan_window_title: "Где производить — общий план"
 bag_wtp_plan_window_empty: "Пусто. Выберите землю и нажмите «Пересчитать».\n\nЕсли выбрали — на этой земле нельзя поставить ни одного здания ни под один товар."
