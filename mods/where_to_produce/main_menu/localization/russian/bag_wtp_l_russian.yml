 bag_wtp_edit_store: "Сохранить"
 bag_wtp_edit_store_tt: "Кладёт текущий план в этот слот и делает его точкой отсчёта для «показать изменения»."
 bag_wtp_edit_recall: "Загрузить"
 bag_wtp_edit_recall_tt: "Ставит план из этого слота на карту вместо того, что там сейчас, и делает его точкой отсчёта."
 bag_wtp_edit_slot1_full: "Слот 1 · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot1')|0] дом. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot1_locs')|0] лок."
 bag_wtp_edit_slot1_empty: "Слот 1 · пусто"
 bag_wtp_edit_slot2_full: "Слот 2 · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot2')|0] дом. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot2_locs')|0] лок."
 bag_wtp_edit_slot2_empty: "Слот 2 · пусто"
 bag_wtp_edit_slot3_full: "Слот 3 · [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot3')|0] дом. в [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_slot3_locs')|0] лок."
 bag_wtp_edit_slot3_empty: "Слот 3 · пусто"
 bag_wtp_edit_pool_head: "Товары этой земли — [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_pooln')|0] шт. · нажатий: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_presses')|0] · доля [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_quota')|0] (свободных мест [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_pool_rooms')|0] на [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_free')|0] товаров)"
 bag_wtp_cell_tt: "Сколько домиков этого товара стоит на выбранной земле прямо сейчас."
 bag_wtp_edit_pool_tt: "Здесь только те товары, которые какая-то локация выбранной земли действительно может производить."
 bag_wtp_edit_ground_head: "Земля:"
 bag_wtp_edit_extend: "Расширить"
 bag_wtp_edit_extend_tt: "Долить план на землю, которую вы только что добавили к выбору."
 bag_wtp_edit_ext_none: "Расширение: пока не нажимали."
 bag_wtp_edit_ext_empty: "Расширение: новой земли в выборе нет — доливать нечего."
 bag_wtp_edit_ext_done: "Расширение: локаций +[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ext_new')|0] · мест было [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ext_was')|0], добавилось [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ext_rooms')|0] · домиков поставлено [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ext_added')|0] · закреплений снято [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ext_lifted')|0] · на старой земле сдвинулось [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_ext_moved')|0]"
 bag_wtp_edit_ext_tt: "Что сделала последняя доливка.\n\n«Локаций» — сколько локаций выбора план ещё не видел."
 bag_wtp_edit_pool_empty: "Пока пусто — сделайте план, и здесь появятся товары этой земли."
 bag_wtp_edit_plus: "+1"
 bag_wtp_edit_plus_tt: "Ещё один домик этого товара — туда, где это дешевле всего."
 bag_wtp_edit_minus: "−1"
 bag_wtp_edit_minus_tt: "Один домик этого товара убрать — тот, что стоит хуже всех, — а место отдать товару, которому оно подходит лучше."
 bag_wtp_edit_right_plus_tt: "Отдать этой грамоте ещё один город — тот, где она принесёт больше всего."
 bag_wtp_edit_rights_head: "Городские права: «−1» снять с худшего города, «+1» отдать лучшему"
 bag_wtp_edit_rights_head_tt: "Грамоты не добавляются и не исчезают: каждому городу плана положена ровно одна, и нажатия их переставляют."
 bag_wtp_edit_right_minus_tt: "Снять эту грамоту с города, где она приносит меньше всего."
 bag_wtp_edit_right_count_tt: "В скольких городах выбранной земли стоит эта грамота прямо сейчас."
 bag_wtp_rslot_empty: ""
 bag_wtp_edit_skip_tt: "Пометить товар «не нужен»: в редакторе он держится на одном домике и никогда не добирается до равной доли — ни на этой земле, ни на любой следующей."
 bag_wtp_edit_last_none: "Последнее нажатие: пока ничего не нажимали."
 bag_wtp_edit_last_done: "Последнее нажатие: сделано."
 bag_wtp_edit_last_add_over: "Последнее нажатие: +1 [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetIcon] [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetName] → [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — вместо [GetGlobalVariable('bag_wtp_ev_esg_s').GetGoods.GetIcon] [GetGlobalVariable('bag_wtp_ev_esg_s').GetGoods.GetName]."
 bag_wtp_edit_last_add_free: "Последнее нажатие: +1 [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetIcon] [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetName] → [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — в свободное место, ничего не вытеснено."
 bag_wtp_edit_last_drop_refill: "Последнее нажатие: −1 [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetIcon] [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetName] ← [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — место занял [GetGlobalVariable('bag_wtp_ev_esg_s').GetGoods.GetIcon] [GetGlobalVariable('bag_wtp_ev_esg_s').GetGoods.GetName]."
 bag_wtp_edit_last_empty: "Последнее нажатие: −1 [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetIcon] [GetGlobalVariable('bag_wtp_edit_good_s').GetGoods.GetName] ← [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — занять освободившееся место нечем: ни один товар этой земли туда не подходит."
 bag_wtp_edit_last_refill: "Последнее нажатие: поставить не удалось, и всё осталось как было — домик, который освобождал место, вернулся назад."
 bag_wtp_edit_last_refused: "Последнее нажатие: ничего не изменилось — не дало правило, либо товару негде встать на этой земле."
 bag_wtp_edit_last_lost: "Последнее нажатие: товар не дошёл до эффекта — сломана кнопка, а не правило."
 bag_wtp_edit_last_nowhere: "Последнее нажатие: некуда — товар уже стоит во всех локациях, где эта земля умеет его делать."
 bag_wtp_edit_last_right_add: "Последнее нажатие: +1 [GetPlayer.Custom('bag_wtp_edit_rto_name')] → [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — город отдан [GetPlayer.Custom('bag_wtp_edit_rfrom_name')]."
 bag_wtp_edit_last_right_short: "Последнее нажатие: [GetPlayer.Custom('bag_wtp_edit_rto_name')] → [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — но связка встала не целиком: городу нечего было освободить под все её домики."
 bag_wtp_edit_last_right_drop: "Последнее нажатие: −1 [GetPlayer.Custom('bag_wtp_edit_rfrom_name')] ← [GetGlobalVariable('bag_wtp_ev_loc').GetLocation.GetName] — город достался [GetPlayer.Custom('bag_wtp_edit_rto_name')]."
 bag_wtp_edit_last_right_notown: "Последнее нажатие: некуда — нет города, где эта грамота могла бы стоять и где она уже не стоит."
 bag_wtp_edit_last_right_none: "Последнее нажатие: снимать нечего — эта грамота не стоит ни в одном городе выбранной земли."
 bag_wtp_edit_last_right_noheir: "Последнее нажатие: отказано — снять эту грамоту с города можно, но передать город некому: ни одна другая грамота державы там не встанет."
 bag_wtp_edit_right_unnamed: "грамота"
 bag_wtp_edit_last_novictim: "Последнее нажатие: место есть, но подвинуть некого — рядом только последние домики и домики из связок грамот."
 bag_wtp_edit_last_lastone: "Последнее нажатие: это последний домик товара на всей земле, а последний не забирается."
 bag_wtp_edit_last_allcharter: "Последнее нажатие: все домики этого товара — из связок грамот, а их не забирают."
 bag_wtp_edit_last_tt: "«+1» не делает ничего, когда ни одна локация этой земли не может держать товар и ни один домик нельзя под него убрать."
 bag_wtp_edit_unpin: "Снять закрепления"
 bag_wtp_edit_unpin_tt: "Снять закрепление со всех товаров: план снова волен двигать их количества."
 bag_wtp_edit_changes: "Показать изменения"
 bag_wtp_edit_changes_tt: "Открывает список всех локаций, где план теперь отличается от сохранённого, и больше ничего."
 bag_wtp_edit_no_plan: "На карте нет плана. Откройте «Показать общий план на землю» и нажмите там «Пересчитать», либо загрузите слот выше."
 bag_wtp_edit_open_button: "Редактор"
 bag_wtp_edit_open_tt: "Открывает редактор в отдельном окне: слоты, товары иконками, «+1» и «−1»."
 bag_wtp_plan_save_head: "Сохранить в:"
 bag_wtp_plan_save_slot1: "Слот 1"
 bag_wtp_plan_save_slot2: "Слот 2"
 bag_wtp_plan_save_slot3: "Слот 3"
 bag_wtp_chg_window_title: "Где производить — что изменила правка"
 bag_wtp_chg_window_empty: "С момента сохранения не сдвинулось ничего."
 bag_wtp_chg_moved: "Изменилось локаций: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_moved')|0] · нажатий: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_presses')|0], из них ничего не изменили: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_edit_idle')|0]"
 bag_wtp_chg_moved_tt: "Считается против сохранённого плана.\n\nНажатие, которому некуда было встать, номер получает, а строки не даёт: менять оказалось нечего."
 bag_wtp_chg_shuffle: "Перестановок после заливки: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_rs_swaps')|0] · выгоды они принесли: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_rs_gain')|0]"
 bag_wtp_chg_shuffle_tt: "После каждого «−1» освободившееся место занимает товар с наибольшим недобором — и это правильно."
 bag_wtp_chg_seq_value: "[Location.MakeScope.GetVariable('bag_wtp_chg_seq').GetValue|0]"
 bag_wtp_chg_seq_tt: "Каким по счёту нажатием изменена эта локация."
 bag_wtp_chg_right_tt: "Городская грамота этого города: слева — какая была в сохранённом плане, справа — какая стоит сейчас."
 bag_wtp_chg_head_out: "ушло:"
 bag_wtp_chg_head_in: "встало:"
 bag_wtp_chg_out_tt: "Что было здесь в сохранённом плане и чего в нынешнем нет."
 bag_wtp_chg_in_tt: "Что есть здесь в нынешнем плане и чего в сохранённом не было."
 bag_wtp__diag_name: "Диагностика"
 bag_wtp__diag_text: "Собрать"
 bag_wtp__diag_desc: "Записывает в лог всё, что мод знает о последнем расчёте, — одним нажатием и обычным текстом."
 bag_wtp__trmm_name: "Карта городских прав"
 bag_wtp__trmm_text: "Пересчитать"
