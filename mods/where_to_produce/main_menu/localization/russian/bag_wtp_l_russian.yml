 bag_wtp_plan_rights: "Планировать города по городским правам"
 bag_wtp_plan_rights_tt: "Включено по умолчанию.\n\n**Право получает каждый город.** Не «если повезёт»: есть город — есть и право."
 bag_wtp_plan_spec: "Режим специализации"
 bag_wtp_plan_spec_tt: "Выключено: обычный общий план — продукция расселяется по земле ровно, с долями, потолками и ступенями дефицита."
 bag_wtp_cap_urban: "Домиков на город"
 bag_wtp_cap_urban_value: "[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_urban')|0]"
 bag_wtp_cap_urban_tt: "Сколько зданий план ставит в одну городскую локацию."
 bag_wtp_cap_rural: "Домиков на село"
 bag_wtp_cap_rural_value: "[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bag_wtp_show_plan_cap_rural')|0]"
