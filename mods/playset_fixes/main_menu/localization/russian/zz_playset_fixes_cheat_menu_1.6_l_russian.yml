l_russian:
 SAKUYA_1_6_LOC_HOME_BUTTON_MEGALOPOLIS_TT: "#t  $megalopolis$ #! \n \n $SAKUYA_LC$ Измените отмеченный уровень $game_concept_location$ на #H  $megalopolis$ #! .\n \n #low  $megalopolis_desc$ #!"
 CHEAT_MENU_TT_GREAT_POWER_SCORE: "#t  $game_concept_great_power_score$ #! \n Применяется к вашему $game_concept_country$ .\n $SAKUYA_LC$ Добавьте + 100 .\n $SAKUYA_RC$ Добавьте -100 .\n $SAKUYA_AL$ Добавить + 5 .\n #p  Alt+щелкните правой кнопкой мыши #! Добавить + 1000 .\n $SAKUYA_SL$ Добавить + 20000 .\n #p  Shift+щелкните правой кнопкой мыши #! Добавить + 999999 .\n $SAKUYA_CR$ Добавьте -999999 .\n #H  Ctrl+щелкните левой кнопкой мыши #! Удалите $game_concept_modifier$, добавленный этой кнопкой."
 CHEAT_MENU_TT_GREAT_POWER_SCORE_TARGET: "#t  $game_concept_great_power_score$ #! \n Применяется к #P  с маркировкой $game_concept_country$ #! .\n $SAKUYA_LC$ Добавьте + 100 .\n $SAKUYA_RC$ Добавьте -100 .\n $SAKUYA_AL$ Добавьте + 5 .\n #p  Alt+щелкните правой кнопкой мыши #! Добавить + 1000 .\n $SAKUYA_SL$ Добавьте + 20000 .\n #p  Shift+щелчок правой кнопкой мыши #! Добавить + 999999 .\n $SAKUYA_CR$ Добавьте -999999 .\n #H  Ctrl+щелкните левой кнопкой мыши #! Выполните глобальный поиск и удалите $game_concept_great_power_score$ $game_concept_modifier$, добавленный этой кнопкой."
 SAKUYA_CHAR_TT_29: "#T $MODIFIER_TYPE_NAME_marriage_desirability$ #!\n\n $MODIFIER_TYPE_DESC_marriage_desirability$ \n\n $SAKUYA_LC$ : добавить +20. \n $SAKUYA_AL$ : добавить +5. \n $SAKUYA_SL$ : добавить +2000. \n#n Правая кнопка / Alt + правая кнопка / Shift + правая кнопка #!: добавить соответствующее отрицательное значение. \n#H Ctrl + левая кнопка #!: удалить все $game_concept_modifier$, добавленные этой кнопкой."
 SAKUYA_CHAR_TT_30: "#T Ограничения по правам доступа #!\n\n $MODIFIER_TYPE_DESC_blocked_from_being_ruler$ \n $MODIFIER_TYPE_DESC_prevented_from_being_heir$ \n $MODIFIER_TYPE_DESC_blocked_from_being_leader$ \n\n#n Левая кнопка мыши #!: добавить « $MODIFIER_TYPE_NAME_blocked_from_being_ruler$ ». \n $SAKUYA_RC$ : добавить « $MODIFIER_TYPE_NAME_prevented_from_being_heir$ ». \n#n Shift+левая кнопка мыши #!: добавить « $MODIFIER_TYPE_NAME_blocked_from_being_leader$ ». \n#n Alt+левая кнопка мыши #!: одновременно добавить все три вышеуказанных ограничения. \n#H Ctrl+левая кнопка мыши #!: удалить все ограничения, добавленные с помощью этой кнопки."
 SAKUYA_CHAR_TT_31: "#T $MODIFIER_TYPE_NAME_blocked_from_character_interactions$ #!\n\n $MODIFIER_TYPE_DESC_blocked_from_character_interactions$ \n\n#n Левая кнопка мыши #!: добавить это ограничение. \n#p Правая кнопка мыши #!: удалить ограничение, добавленное с помощью этой кнопки. \n#H Ctrl + левая кнопка мыши #!: удалить ограничение, добавленное с помощью этой кнопки."
 SAKUYA_CHAR_TT_32: "#T $MODIFIER_TYPE_NAME_can_assume_fort_command_character$ #!\n\n $MODIFIER_TYPE_DESC_can_assume_fort_command_character$ \n\n $SAKUYA_LC$ : добавить данную лицензию. \n $SAKUYA_RC$ : удалить лицензию, добавленную с помощью этой кнопки. \n#H Ctrl + левая кнопка мыши #!: удалить лицензию, добавленную с помощью этой кнопки."
 SAKUYA_CHAR_TT_15: "#t Брак и развод #!\n$SAKUYA_LC$: Принудительно заключить брак между персонажем $game_concept_character$ и правителем нашей страны $game_concept_ruler$, игнорируя обычные ограничения на вступление в брак.\n$SAKUYA_SL$: Принудительно заключить брак между целью $game_concept_character$ и нынешним $game_concept_heir$ нашей страны, игнорируя обычные ограничения на вступление в брак.\n$SAKUYA_RC$: Немедленно развести цель $game_concept_character$ с нынешним супругом.\n$SAKUYA_SR$: Запретить брак с персонажем $game_concept_character$ (добавить запрет на брак $game_concept_modifier$).\n#H Ctrl+левая кнопка мыши #!: снять все ограничения на вступление в брак $game_concept_modifier$ с персонажа $game_concept_character$.\n#p Ctrl+правая кнопка мыши « #!»: запретить персонажу $game_concept_character$ вступать в брак с представителями низших сословий (добавить запрет на брак с простолюдинами $game_concept_modifier$).\n\n#low Это моя мать, а также моя жена, сестра и дочь. #!"
 SAKUYA_1_6_LOC_MOD_PROXIMITY_SOURCE_TT: "#T  $MODIFIER_TYPE_NAME_local_proximity_source$ #! \n \n $MODIFIER_TYPE_DESC_local_proximity_source$ \n \n $SAKUYA_LC$ + 10 \n $SAKUYA_RC$ -10 \n #H  Ctrl+Левый клик#! Удалить все $game_concept_modifier$, добавленные с помощью этой кнопки \n #p  Ctrl+щелчок правой кнопкой мыши #! + 1 \n $SAKUYA_SL$ + 100"
 SAKUYA_1_6_CHAR_TT_18: "#T Разные бесполезные безделушки #!\n\n$SAKUYA_LC$: игнорировать ограничения по полу и стать полководцем $game_concept_army$ или $game_concept_navy$\n$SAKUYA_SL$: Вхождение в кабинет министров без учета гендерных ограничений\n$SAKUYA_RC$: дает право стать сёгуном\n$SAKUYA_SR$: разрешить управление крепостью\n$SAKUYA_AL$: добавить «Родилась в Фиолетовой комнате» $game_concept_modifier$\n$SAKUYA_AR$: добавить «Бедствие в Центральной Азии» $game_concept_modifier$\n#H Ctrl+левая кнопка мыши #!: удалить все дополнительные элементы $game_concept_modifier$, добавленные с помощью этой кнопки\n#p Ctrl+правая кнопка мыши « #!»: запретить $game_concept_character$ взаимодействовать с $game_concept_character$"
 SAKUYA_LOC_MOD_CAPITAL_COST_TT: "#T  $MODIFIER_TYPE_NAME_local_distance_from_capital_speed_propagation$ #! \n \n $MODIFIER_TYPE_DESC_local_distance_from_capital_speed_propagation$ \n \n $SAKUYA_LC$ + 10% \n $SAKUYA_RC$ -10% \n #H  Ctrl+Левый клик#! Удалить все $game_concept_modifier$, добавленные с помощью этой кнопки \n #p  Ctrl+щелчок правой кнопкой мыши #! + 1% \n $SAKUYA_SL$ + 1000%"
