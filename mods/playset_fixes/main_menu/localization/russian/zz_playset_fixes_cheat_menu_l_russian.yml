CHEAT_MENU_TT_ASSASSINATE: "#p ЛКМ#! Убить правителя текущей отмеченной страны\n#p ПКМ#! Убить его наследника\n#p Ctrl+ЛКМ#! Если есть супруга, немедленно убить её/его\n#p Shift+ЛКМ#! Если есть регент, немедленно убить его\n#p Shift+ПКМ#! #x Полная зачистка#!: если есть регент/супруг/правитель/наследник/министры кабинета — все будут убиты\n#H Не сработает, если страна не отмечена или нет целевого персонажа"
SAKUYA_CHAR_TT_1: "#p Условие:#! должен существовать как минимум один персонаж с переменной sakuya_the_chosen_one.\n#H Подсказка:#! ЛКМ — сброс, ПКМ — тонкая настройка, удобно для быстрого теста разных порогов."
SAKUYA_CHAR_TT_2: "#p Условие:#! должен быть отмечен хотя бы один персонаж.\n#H Описание:#! используется для проверки корректности применения/снятия стандартных модификаторов персонажей."
SAKUYA_CHAR_TT_3: "#p Условие:#! должен быть отмечен хотя бы один персонаж.\n#H Описание:#! используется для тестирования пользовательских модификаторов персонажей и их численных эффектов."
SAKUYA_CHAR_TT_4: "#p Условие:#! должен быть отмечен хотя бы один персонаж.\n#H Описание:#! тест добавления и удаления стандартных/скрытых черт."
SAKUYA_CHAR_TT_9: "#t Отладка срока жизни#!\n#p ЛКМ:#! увеличить срок жизни на 5 лет\n#p Shift+ЛКМ:#! увеличить срок жизни на 25 лет\n#n ПКМ:#! уменьшить срок жизни на 5 лет\n#n Shift+ПКМ:#! уменьшить срок жизни на 25 лет\n#H Ctrl+ЛКМ:#! удалить все модификаторы срока жизни/бессмертия\n#t Ctrl+ПКМ:#! #COLOR:{1,0.4,0} $ACHIEVEMENT_until_death_do_us_apart$"
SAKUYA_CHAR_TT_10: "#t $game_concept_fertility$ и беременность#!\n#p ЛКМ:#! увеличить $game_concept_fertility$ на 50%\n#p Shift+ЛКМ:#! увеличить $game_concept_fertility$ на 500000%\n#n ПКМ:#! уменьшить $game_concept_fertility$ на 50%\n#n Shift+ПКМ:#! уменьшить $game_concept_fertility$ на 500000%\n#H Ctrl+ЛКМ:#! удалить модификаторы, связанные с $game_concept_fertility$\n#t Ctrl+ПКМ:#! #COLOR:{1,0.4,0} Попытаться сделать выбранного персонажа беременным#!\n#low Я не нашёл GUI, который показывал бы, беременен ли персонаж, поэтому я не могу это определить. Если целевой персонаж — незамужняя женщина и всё же оказывается беременной, никогда не задумывайтесь, как это реализовано в коде.#!\nИ никогда, никогда не заставляйте беременеть мужских персонажей, особенно не пытайтесь забеременеть сами от себя (оставаясь мужчиной)! По полученным отчётам, самооплодотворение заставляет [GetPlayer.GetGovernment.GetRuler.GetName]#x вынашивать демонического ребёнка#!, а ваш сохранённый файл получит #COLOR:{1,0,0,1} необратимые повреждения#!, из-за которых все $SAKUYA_MENU_TAB_CHARACTER$ в мире больше не смогут забеременеть или довести беременность до конца.#!"
SAKUYA_CHAR_TT_11: "#t Отладка эффективности кабинета#!\n#p ЛКМ:#! эффективность кабинета персонажа +25%\n#p Shift+ЛКМ:#! эффективность кабинета персонажа +75%\n#n ПКМ:#! эффективность кабинета персонажа -25%\n#n Shift+ПКМ:#! эффективность кабинета персонажа -75%\n#H Ctrl+ЛКМ:#! удалить модификаторы эффективности\n#t Ctrl+ПКМ:#! дать модификатор «Временный глава кабинета»"
