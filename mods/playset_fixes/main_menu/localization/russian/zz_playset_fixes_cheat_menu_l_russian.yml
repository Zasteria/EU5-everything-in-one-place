 SAKUYA_CHAR_KOISHI_TT: "#t Как отметить персонажа?#!\n\n#p Если целевой персонаж находится в вашей стране (например, [GetPlayer.GetNameWithNoTooltip])...#!\nПросто нажмите на персонажа, чтобы открыть его интерфейс, или щёлкните правой кнопкой мыши на его портрет и выберите #H $sakuya_select_chosen_one$#!. Чтобы снять отметку, снова войдите в интерфейс персонажа и нажмите #H $sakuya_deselect_chosen_one$#!.\nВы также можете использовать #H $SAKUYA_AFTERBURNER$#! для более удобной отметки как отечественных, так и иностранных персонажей. $SAKUYA_AFTERBURNER$ доступен в Steam Workshop или на канале Discord.\n\n#p Если целевой персонаж не в [GetPlayer.GetNameWithNoTooltip]?#!\nВам нужно#white сначала отметить#!#x нацию#!, где находится персонаж, затем использовать #T $CHEAT_MENU_MARK_LEADER$#! в меню $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$. В настоящее время поддерживается отметка правителя, супруга, наследника или регента. Когда значок исчезнет, это означает успешную отметку.\n\n#p Не можете найти опцию $sakuya_select_chosen_one$?#!\nВ некоторых особых случаях (например, $SWE$) ваш собственный правитель может отсутствовать в вашей стране в начале. В этом случае сначала подтвердите текущее местоположение персонажа и отметьте нацию, где он находится.\n\n#p Как снять отметку?#!\nПросто отметьте любого персонажа в вашей стране и нажмите #H $sakuya_deselect_chosen_one$#!. Этот метод работает, независимо от того, находится ли целевой персонаж за границей или уже умер.\n\n#t Описание $game_concept_trait$ов#!\n\n#p Некоторые $game_concept_trait$ы требуют выполнения определённых условий для добавления.#! Например, для #n $babbling_buffoon$#! требуется, чтобы $game_concept_dip$ был ниже 80. Конкретные требования для каждого $game_concept_trait$а можно найти на EU5 Wiki."
