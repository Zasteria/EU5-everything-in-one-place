 CHEAT_MENU_TEST_TEXT_1: "#p Добро пожаловать#!\nРад со всеми познакомиться. Я — Сьер, разработчик Victoria 3 Cheat Menu Pro. Очень приятно снова увидеться с вами в Europa Universalis. #n QQ-группа:#! 734267077, присоединяйтесь!\n\n#p Тестовая функция: $SAKUYA_LOC_TITLE$ уже доступна!#!\nНажмите кнопку ниже, чтобы открыть новое меню. Просто отметьте локации и провинции, чтобы менять население, модификаторы и многое другое! Не забудьте, что#n нужно выбрать хотя бы одну локацию, прежде чем приступать к изменениям#!, или же меняйте всю страну целиком.\n\n#p $CHEAT_MENU_TITLE$ обновлён до версии 1.3!#!\nНа этот раз я принёс обновления, связанные с военной частью. Добавлено более пятидесяти настраиваемых функций и исправлено несколько ошибок. Нажмите кнопку в правом верхнем углу военной страницы, чтобы включить чит-уровень модификаторов. Конкретные значения можно посмотреть в панели #H $GOV_TAB$#!!.#!"
