 CHEAT_MENU_OPINION_ICON_TOOLTIP: "[GetPlayer.Custom('sakuya_mark_country_status')]\n\n #!\n #p Как отметить страну?#!#N \nСначала вам нужно щелкнуть на соответствующую страну, чтобы открыть ее дипломатическую панель, затем на панели $DIP_TAB$ выберите по порядку: $TAB_TOOLTIP_ARMY_ACTIONS_TITLE$ → $CUSTOM_SEARCH_FILTER_DIPLO_ACCESS_CAT_NAME$, найдите #L $offer_sakuya_mark_country$#! и щелкните, чтобы завершить отметку.\n\n#T Суть Отметки#!: Действие отметки устанавливает особые дипломатические отношения с целевой страной (используется для привязки поведения и присвоения переменных). Поэтому, если ваше количество $game_concept_diplomat$ недостаточно или цель превышает лимит $game_concept_diplomatic_range$, вам нужно сначала выполнить эти условия, прежде чем вы сможете отметить.#!\n\n#p Как отменить отметку?#!#N \nЭффект отметки длится 3 месяца и автоматически истечет по истечении времени; но особые дипломатические отношения сохранятся. Отменять ли эти дипломатические отношения, зависит от вас.\n\nЕсли вы хотите досрочно завершить эффект отметки: просто заранее отмените дипломатические отношения #H $offer_sakuya_mark_country$#! с этой страной, и отметка немедленно закончится; после окончания вы можете в любое время отметить другие страны.#!\n\n#p Я не вижу, где отменить отметку?#!#N \nЭто не ваша ошибка. Из-за ограничений движка список дипломатических действий не обновится немедленно, вам нужно выйти из меню дипломатии и войти снова.\n\nПосле повторного входа вы должны увидеть, что #H $offer_sakuya_mark_country$#! стал #H $cancel_sakuya_mark_country$#!, затем вы можете нажать, чтобы отменить. Та же проблема возникает при отметке персонажей.#!\n\n#T Важное Примечание#!: Отметка страны не имеет прямого отношения к самому дипломатическому действию, это просто привязка поведения для удобного присвоения переменных. Независимо от того, отмените ли вы отметку, эффект отметки всегда длится только 3 месяца, так как это намеренно разработано для избежания различных ошибок.#!\n#low Эти дипломатические отношения не имеют никакого эффекта и не будут автоматически отменены. Xier также предлагает игнорировать их и отменить, когда вам снова понадобится отметить эту страну.#!"необходимо сначала изменить вышеуказанные условия, прежде чем вы сможете отметить.#!\n\n#p Как отменить отметку?#!\n#n Если вы не спешите отмечать другие страны, вам просто нужно подождать 3 месяца, и фактический эффект отметки автоматически отменится, но дипломатические отношения останутся. Отменять ли сохраненные дипломатические отношения или нет - решать вам. Если вы заранее отмените дипломатические отношения #H $offer_sakuya_mark_country$#! с этой страной, отметка закончится раньше, и вы сможете в любое время отмечать другие страны.#!\n\n#p Я не вижу, где отменить отметку?#!\n#n Это не ваша ошибка. Из-за ограничений движка список дипломатических действий не обновится немедленно, поэтому вам нужно выйти из меню дипломатии, а затем войти снова. В это время вы должны увидеть, что #H $offer_sakuya_mark_country$#! превратился в #H $cancel_sakuya_mark_country$#!. Тогда вы можете отменить его. Та же проблема возникает при отметке персонажей.#!"
