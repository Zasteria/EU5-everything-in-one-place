 CHEAT_MENU_TT_WAR_CONTROL: "#P Вы можете свободно контролировать цену войны и мира! #p ЛКМ#!Значительно снизит все расходы, связанные с войной и миром (включая стоимость повода для войны, стоимость военной вассализации, агрессивное расширение и 12 других видов военных расходов), позволяя вам начинать войны или заключать мир по чрезвычайно низкой цене.\N#x Если вы действительно не постигли истинный смысл дизайна Xier для негативных бонусов, никогда не думайте о нажатии ПКМ.#!\N#LOW Шутка, вы в любом случае можете отменить негативный эффект.#!\n\n#H Ctrl+ЛКМ#!Очистить $game_concept_modifier$"
