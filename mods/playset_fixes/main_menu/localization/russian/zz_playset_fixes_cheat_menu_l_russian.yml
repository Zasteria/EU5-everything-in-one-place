SAKUYA_MIL_TT_35: "#t Настройка модификатора блокады#!\n #p Левая кнопка:#! Увеличивает эффективность блокады, снижает требуемую мощь +10%\n#n Правая кнопка:#! Снижает эффективность блокады, увеличивает требуемую мощь -10%\n#p Shift+Левая кнопка:#! Значительный бонус +10000%\n#n Shift+Правая кнопка:#! Значительный штраф -10000%\n#H Ctrl+Левая кнопка:#! Убрать все модификаторы."
CHEAT_MENU_ROYAL_MARRIAGE_TT: "#t $opinion_union_of_crowns_pact$#!\n\nУстановить $opinion_union_of_crowns_pact$ с отмеченной целевой страной\nЭто равноправный договор, ни одна сторона не управляет другой, и может сформировать оборонительный альянс, разве это не прекрасно?#low Самое лучшее, что никто не запрещает вам использовать кнопку #H убийства#!, которую предоставляет Sakuya... вы понимаете... удачи"
CHEAT_MENU_TRUCE_TT: "#t Корректировка $game_concept_truce$#!\n #n Левый клик:#! Нарушить $game_concept_truce$\n #p Правый клик:#! Добавить 5 лет $game_concept_truce$\n #H Ctrl+Левый клик:#! Нарушить $game_concept_truce$\n #p Ctrl+Правый клик:#! Добавить 1 месяц $game_concept_truce$\n #p Shift+Левый клик:#! Добавить 10 лет $game_concept_truce$\n #p Shift+Правый клик:#! Добавить 9999 лет $game_concept_truce$ (но в основном неэффективно)\n\n#low На самом деле, если целевая страна хочет вас достать, есть много способов обойти ограничения $game_concept_truce$...\nКроме того, мои тесты показали, что максимальное значение $game_concept_truce$ динамично, и почти наверняка невозможно достичь перемирия на 9999 лет. Но поскольку эта функция зарезервирована, кто знает, что может произойти в будущем..."
CHEAT_MENU_COURT_LANGUAGE_TT: "#t Корректировка $game_concept_liturgical_language$#!\n #p Левый клик:#! $game_concept_liturgical_language$ целевой страны становится вашим языком\n #H Правый клик:#! Ваш $game_concept_liturgical_language$ становится языком целевой страны\n\n#H Примечание:#! Это не изменит общий язык (общий язык связан с культурой) #low После тестирования эта кнопка имеет проблемы и может не работать правильно"
CHEAT_MENU_TRADE_TRANSFER_TT: "#t Передача торгового преимущества и мощности#!\n #p Левый клик:#! Целевая страна передает вам 30% торговли\n #n Правый клик:#! Вы передаете 30% торговли целевой стране\n #H Ctrl+Левый клик:#! Удалить все отношения передачи торговли\n\nУстановить дипломатические отношения, передать 30% торгового влияния\nПохоже на оригинальный механизм игры \"передача торговли\"\n\nТребуется сначала отметить целевую страну"
CHEAT_MENU_ADVANCE_SPREAD_TT: "#t Распространение достижений (действует 10 лет)#!\n #p Левый клик:#! Вы распространяете достижения на целевую страну\n #n Правый клик:#! Целевая страна распространяет достижения на вас\n #H Ctrl+Левый клик:#! Удалить все отношения распространения достижений\n\nУстановить дипломатические отношения, длится 10 лет\n0,2 прогресса достижений в месяц (умеренный темп)\nПохоже на механизм распространения достижений сюзерена вассалам\n\nТребуется сначала отметить целевую страну"
CHEAT_MENU_POP_TRANSFER_TT: "#t Передача населения (не поддерживается игровым движком)#!\n#X Невозможно реализовать:#!\nИгровой движок EU5 не предоставляет эффекты relocate_pop или move_pop\nsplit_pop может только разделять население на месте\nНет механизма перемещения населения между провинциями\n\n#H Предложение:#! Используйте консольные команды или другие методы"
CHEAT_MENU_TT_RESEARCH_ALPHA: "#t Скорость $game_concept_research$#!\n#p Левый клик#! добавить +10% скорости исследований\n#p Shift+Левый клик#! добавить +999999%\n#n Правый клик#! уменьшить -10%\n#n Shift+Правый клик#! уменьшить -999999%\n#H Ctrl+Левый клик#! удалить все модификаторы исследований"
