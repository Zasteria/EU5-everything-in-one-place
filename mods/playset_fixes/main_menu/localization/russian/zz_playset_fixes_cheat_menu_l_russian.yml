SAKUYA_CHAR_KOISHI_TT: "#t Как мне отметить персонажа?#!\n\n#p Если целевой персонаж находится в вашей стране (например, [GetPlayer.GetNameWithNoTooltip])...#!\nПросто нажмите на персонажа, чтобы открыть интерфейс, или щелкните правой кнопкой мыши на его портрет и выберите #H $sakuya_select_chosen_one$#!. Если вы хотите снять метку, повторно войдите в интерфейс персонажа, чтобы обновить его, и нажмите #H $sakuya_deselect_chosen_one$#!.\nВы также можете использовать #H $SAKUYA_AFTERBURNER$#! для более удобной отметки как отечественных, так и иностранных персонажей. $SAKUYA_AFTERBURNER$ доступен в Steam Workshop или на канале Discord.\n\n#p Если целевой персонаж находится не в [GetPlayer.GetNameWithNoTooltip]?#!\nВам нужно #white сначала отметить#! #x страну#!, в которой находится персонаж, а затем использовать #T $CHEAT_MENU_MARK_LEADER$#! в меню $SAKUYA_CHEAT_MENU_DIPLOMACY_TITLE$. В настоящее время поддерживается маркировка правителя, супруга(и), наследника или регента. Когда значок исчезнет, это означает, что маркировка прошла успешно.\n\n#p Не можете найти опцию $sakuya_select_chosen_one$?#!\nВ некоторых особых ситуациях (например, $SWE$) правитель вашей страны может не находиться в стране на момент начала игры. В этом случае сначала подтвердите текущее местоположение персонажа и отметьте страну, в которой он находится.\n\n#p Как отменить маркировку?#!\nСлучайно отметьте любого персонажа в вашей стране, а затем нажмите #H $sakuya_deselect_chosen_one$#!. Независимо от того, находится ли целевой персонаж за границей или уже умер, этот метод работает.\n\n#t Описание $game_concept_trait$ов#!\n\n#p Некоторые $game_concept_trait$ы требуют выполнения определённых условий для добавления.#! Например, для #n $babbling_buffoon$#! требуется, чтобы $game_concept_dip$ был ниже 80. Конкретные требования для каждого $game_concept_trait$а можно найти на EU5 Wiki."
