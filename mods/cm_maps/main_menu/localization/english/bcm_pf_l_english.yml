l_english:
 mapmode_bcm_governor_finder_name: "Recommended Governor Placement"
 # Strings shared by both placement finder map modes.
 bcm_pf_estimate_note: "This is an estimate: the Placement Finder Scoring setting chooses whether locations are ranked by tax base, by population, or by raw [proximity|e], and the Land Infrastructure and Naval Infrastructure settings choose the roads, buildings, and [maritime_presence|e] it assumes. It recalculates when you open this map mode, at most once every 4 years; use the action bar refresh button to force a fresh calculation. The colors refresh when it finishes."
 bcm_pf_tt_no_data: "Not scored yet. Use the action bar refresh button to calculate scores for the current borders."
 bcm_pf_tt_skipped: "Not evaluated: the Search Accuracy setting skipped this location. Set it to Exhaustive and refresh to evaluate every location."
 bcm_pf_tt_foreign: "Not part of your country."
 bcm_pf_source_legend: "Existing proximity source (striped)"
 # Note to translators: shown after a percentage, for example "75% of Best".
 bcm_pf_of_best: "of Best"
 bcm_pf_gov_tt_head: "Predicted max average [proximity|e] gain: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_avg_value')|1]%\nMax predicted tax base gained from [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_taxgain_value')|1]\nMax predicted population reached, weighted by [proximity|e] gained: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_popgain_value')|1]k"
 bcm_pf_gov_source_line: "Existing [proximity|e] source: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 bcm_pf_cap_tt_head: "Predicted max average [proximity|e] with capital: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_avg_value')|1]%\nMax predicted tax base from [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_taxgain_value')|1]\nMax predicted population reached, weighted by [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_popgain_value')|1]k"
 MAPMODE_BCM_GOVERNOR_FINDER: "#T $mapmode_bcm_governor_finder_name$#!\nColors your [locations|e] by how much [proximity|e] a new Local Governor or Naval Governor built there would add, given the proximity your [capital|e] and existing sources already provide. Greener is better. Your capital and existing proximity sources are striped.\n$bcm_pf_estimate_note$"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_SCORED: "$bcm_pf_gov_tt_head$\nScore: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_pct_value')|0]% of your best location[ROOT.GetLocation.Custom('bcm_pf_gf_status')]"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_BEST: "$bcm_pf_gov_tt_head$\nYour best location"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_CAPITAL: "Your [capital|e] already spreads [proximity|e] from here."
 MAPMODE_BCM_GOVERNOR_FINDER_TT_NOGAIN: "A governor provides at most 80 [proximity|e], and this location [ROOT.GetLocation.Custom('bcm_pf_nogain_basis')], so a governor built here would add nothing."
 bcm_pf_nogain_basis_current: "already has at least that much"
 bcm_pf_nogain_basis_assumed: "would already have at least that much under the assumed infrastructure"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_ZERO: "You already have high [proximity|e] everywhere a governor here could reach, so it would add little."
 MAPMODE_BCM_GOVERNOR_FINDER_TT_INELIGIBLE: "Not evaluated: no governor can be placed here ([ROOT.GetLocation.Custom('bcm_pf_inelig_reason')])."
 bcm_pf_inelig_reason_route: "no land connection to your capital and not coastal"
 bcm_pf_inelig_reason_blocked: "[ShowBuildingTypeNameWithNoTooltip('seljuk_mint')] blocks [ShowBuildingTypeNameWithNoTooltip('local_governor')], and [ShowBuildingTypeNameWithNoTooltip('naval_governor')] needs a location with no land connection to your capital"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_WATER: "This is a water location; placement scores apply to your own land."
 # Shared status line appended to the scored tooltip: rank 2/3 or a displayed local maximum.
 bcm_pf_status_second: "\nYour 2nd best location"
 bcm_pf_status_third: "\nYour 3rd best location"
 bcm_pf_status_localmax: "\nLocal Maximum: Better than all surrounding locations"
 bcm_pf_first_legend_key: "1st"
 bcm_pf_second_legend_key: "2nd"
 bcm_pf_third_legend_key: "3rd"
 bcm_pf_localmax_legend_key: "Local maximum (striped)"
 bcm_pf_gov_capital_legend_key: "Capital (striped)"
 bcm_pf_not_scored_legend_key: "Not scored yet"
 bcm_pf_skipped_legend_key: "Not evaluated (skipped)"
 mapmode_bcm_capital_finder_name: "Recommended Capital Location"
 MAPMODE_BCM_CAPITAL_FINDER: "#T $mapmode_bcm_capital_finder_name$#!\nColors your [locations|e] by how well a [capital|e] there would spread [proximity|e]. Existing governors are ignored. Striped locations already hold a proximity source, such as the current capital or a governor.\n$bcm_pf_estimate_note$"
 MAPMODE_BCM_CAPITAL_FINDER_TT_SCORED: "$bcm_pf_cap_tt_head$\nScore: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_pct_value')|0]% of your best location[ROOT.GetLocation.Custom('bcm_pf_cf_status')]"
 MAPMODE_BCM_CAPITAL_FINDER_TT_BEST: "$bcm_pf_cap_tt_head$\nYour best location"
 MAPMODE_BCM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_BCM_CAPITAL_FINDER_TT_SCORED$\nExisting proximity source: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_BCM_CAPITAL_FINDER_TT_WATER: "This is a water location; capital scores apply to your own land."
 bcm_pf_refresh_name: "Recompute Placement Scores"
 bcm_pf_refresh_tooltip: "Force a fresh calculation of the governor and capital placement scores for the current borders. Otherwise scores are reused for up to 4 years."

