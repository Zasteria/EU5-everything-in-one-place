l_english:
 mapmode_bcm_best_town_right_name: "Recommended Urban Rights"
 # Shared words. bcm_town_right_map_mode_l_english.yml is generated against these,
 # so keep the key names when reworking them.
 # Note to translators: "Grant" is a verb, followed by the name of an urban right.
 bcm_trmm_grant_word: "Grant"
 bcm_trmm_tied_with_label: "Tied with:"
 bcm_trmm_open_slot_here: "Open urban right slot in this location"
 MAPMODE_BCM_BEST_TOWN_RIGHT: "#T $mapmode_bcm_best_town_right_name$#!\nColors each [location|e] by the specialization [town_rights|e] whose boosted buildings can source the largest share of their input [goods|e] from the [province|e]'s [rgo|e]s. Hover a [location|e] to see every specialization option ranked.\nHover an industry's percentage in the tooltip for a breakdown of its best production method's inputs.\nTies for best show as a striped second color: the tied specialization's color, or a dedicated color when 3+ tie."
 MAPMODE_BCM_BEST_TOWN_RIGHT_TT_NONE: "[ROOT.GetLocation.GetProvince.GetName] has no [raw_material|e] used by specialized industries.[ROOT.GetLocation.Custom('bcm_trmm_stripe_reason')]"
 MAPMODE_BCM_BEST_TOWN_RIGHT_TT_WATER: "$bcm_txt_tt_sea_zone$" # NO-TRANSLATE
 bcm_trmm_legend_none: "No matching raw materials"
 bcm_trmm_legend_granted_best: "Granted urban right at the best fit here (striped)"
 bcm_trmm_legend_granted_poor: "Granted urban right far below the best fit (striped)"
 bcm_trmm_legend_tied_multi: "3+ specializations tied (striped)"
 bcm_trmm_legend_open_slot: "Open urban right slot (striped)"
 bcm_trmm_legend_full_no_spec: "City full with no specialization granted (striped)"
 bcm_trmm_reason_full_no_spec: "\n\nNo open urban right slot and no specialization granted here"
 bcm_trmm_search_legend_100: "100% of inputs local"
 bcm_trmm_search_legend_none: "No raw goods used by this right's industries"
 bcm_trmm_search_legend_granted: "Already granted (striped)"
 bcm_trmm_search_legend_best: "Best or tied-best specialization here (striped)"
 bcm_trmm_search_legend_granted_other: "A different urban right granted (striped)"
 bcm_trmm_search_granted_line: "\nAlready granted in this location"
 bcm_trmm_search_best_line: "\nBest specialization for this location"
 bcm_trmm_search_tied_best_line: "\nTied for best specialization in this location"

 # NO-TRANSLATE BELOW - data functions and shared-key references only.
 bcm_trmm_reason_open_slot: "\n\n$bcm_trmm_open_slot_here$"
 bcm_trmm_search_legend_open_slot: "$bcm_trmm_legend_open_slot$"
 bcm_trmm_search_open_slot_line: "\n$bcm_trmm_open_slot_here$"
 bcm_trmm_tied_with_prefix: " - $bcm_trmm_tied_with_label$ "
