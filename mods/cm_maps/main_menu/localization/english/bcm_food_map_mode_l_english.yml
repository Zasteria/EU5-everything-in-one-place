l_english:
 mapmode_bcm_breadbasket_name: "Breadbaskets"
 MAPMODE_BCM_BREADBASKET: "#T $mapmode_bcm_breadbasket_name$#!\nHighlights your [locations|e] where auto-food is currently set up to run."
 MAPMODE_BCM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] is set up for auto-food."
 MAPMODE_BCM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] is yours but does not have auto-food enabled."
 MAPMODE_BCM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] is not yours."
 MAPMODE_BCM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] is uncolonized."
 MAPMODE_BCM_BREADBASKET_TT_WATER: "$bcm_txt_tt_sea_zone$" # NO-TRANSLATE
 bcm_breadbasket_enabled_legend_key: "Auto-food enabled"
 bcm_breadbasket_owned_legend_key: "Your other locations"
 bcm_breadbasket_foreign_legend_key: "Foreign locations"
 bcm_breadbasket_uncolonized_legend_key: "Uncolonized"
 mapmode_bcm_location_food_potential_name: "Food Potential Per RGO Level"
 MAPMODE_BCM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_bcm_location_food_potential_name$#!\nThis colors [locations|e] by their natural food potential per [rgo|e] level. The score combines the [rgo|e] [food|e] value, the cumulative [food_productivity|e] (terrain, vegetation, climate, named static modifiers like the Skane Herring Market or Fertile Nile Delta, [rgo|e]-specific output modifiers, etc.), water access, and the assumed-max bonuses from [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')], and [ShowBuildingTypeName('irrigation_systems')] where the [rgo|e] permits.\n\n[development|e] is excluded and every [location|e] is scored as if it were a rural settlement, so the score shows terrain potential rather than current output."
 MAPMODE_BCM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] has a food potential per [rgo|e] level of [ROOT.GetLocation.MakeScope.ScriptValue('bcm_location_food_potential')|1Y]."
 MAPMODE_BCM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] is not land so it does not have food potential."
 bcm_location_food_potential_auto_food_legend_key: "Auto-food enabled (striped)"
 bcm_location_food_potential_bright_green_legend_key: "45 (max possible)"
 bcm_location_food_potential_green_legend_key: "27.5 (excellent)"
 bcm_location_food_potential_yellow_legend_key: "20 (good)"
 bcm_location_food_potential_orange_legend_key: "12.5 (decent)"
 bcm_location_food_potential_red_legend_key: "3.75 (low)"
 bcm_location_food_potential_black_legend_key: "0 (none)"

 # NO-TRANSLATE BELOW - shared-key references only.
 mapmode_bcm_location_food_potential_hidden_name: "$mapmode_bcm_location_food_potential_name$"
 MAPMODE_BCM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_BCM_LOCATION_FOOD_POTENTIAL$"
