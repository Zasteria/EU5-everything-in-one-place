l_english:
 mapmode_bcm_industry_support_name: "Recommended industry support"
 MAPMODE_BCM_INDUSTRY_SUPPORT: "#T $mapmode_bcm_industry_support_name$#!\nColours every [area|e] by the [industry_promotion|e] that would raise the most of what will be produced there. Every province of the area gives an industry the share of its goods that will be made there: the goods of the province's recommended urban right, steel where there is iron, porcelain where there is clay, lacquerware where there are dyes. An industry of two goods and one of four are measured alike."
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_WATER: "[ROOT.GetLocation.GetName] is not land."
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_NONE: "Area [ROOT.GetLocation.GetArea.GetName] will produce none of the industries' goods — nothing to recommend."
 bcm_ind_legend_none: "Nothing to recommend"
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_TEXTILES: "Area [ROOT.GetLocation.GetArea.GetName]: support «#Y $textiles$#!»\nShare of each industry's goods, summed over provinces ([ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_towns')|0]):\n  $textiles$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_textiles')|2]\n  $crafts$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_crafts')|2]\n  $arms$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_arms')|2]\n  $luxury$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_luxury')|2]\n  $paper_goods$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_paper_goods')|2]\n  $furnishings$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_furnishings')|2]\n  $naval$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_naval')|2]\n  $beverages$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_beverages')|2]"
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_CRAFTS: "Area [ROOT.GetLocation.GetArea.GetName]: support «#Y $crafts$#!»\nShare of each industry's goods, summed over provinces ([ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_towns')|0]):\n  $textiles$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_textiles')|2]\n  $crafts$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_crafts')|2]\n  $arms$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_arms')|2]\n  $luxury$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_luxury')|2]\n  $paper_goods$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_paper_goods')|2]\n  $furnishings$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_furnishings')|2]\n  $naval$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_naval')|2]\n  $beverages$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_beverages')|2]"
