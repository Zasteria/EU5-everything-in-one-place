l_russian:
 mapmode_bcm_industry_support_name: "Рекомендуемая поддержка отрасли"
 MAPMODE_BCM_INDUSTRY_SUPPORT: "#T $mapmode_bcm_industry_support_name$#!\nОкрашивает каждую [area|e] по [industry_promotion|e], которую стоит выбрать для неё по карте рекомендуемых городских прав: каждый город или посёлок голосует своим рекомендуемым правом, а право делится между отраслями по доле своих товаров. Права ткачей и книжников частью приходятся на краски, которых нет ни в одной отрасли."
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_WATER: "[ROOT.GetLocation.GetName] — не суша."
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_NONE: "В области [ROOT.GetLocation.GetArea.GetName] нет городов с рекомендуемым правом — рекомендовать нечего."
 bcm_ind_legend_none: "Нет городов с рекомендацией"
 MAPMODE_BCM_INDUSTRY_SUPPORT_TT_TEXTILES: "Область [ROOT.GetLocation.GetArea.GetName]: поддержка «#Y $textiles$#!»\nГолоса городов по рекомендуемым правам ([ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_towns')|0]):\n  $textiles$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_textiles')|1]\n  $crafts$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_crafts')|1]\n  $arms$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_arms')|1]\n  $luxury$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_luxury')|1]\n  $paper_goods$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_paper_goods')|1]\n  $furnishings$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_furnishings')|1]\n  $naval$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_naval')|1]\n  $beverages$: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_ind_sv_beverages')|1]"
