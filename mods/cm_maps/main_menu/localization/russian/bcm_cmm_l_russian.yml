 bcm__placement_finder_roads_option_2_name: "Макс. дорог"
 bcm__placement_finder_roads_option_2_desc: "Считать, что на каждом соединении построена лучшая из открытых вами дорог."
 bcm__placement_finder_roads_option_3_name: "$bcm_txt_best_possible$"
 bcm__placement_finder_roads_option_3_desc: "Предполагается, что на каждом соединении построена лучшая из открытых вами дорог, а все открытые здания, улучшающие сухопутную близость, построены везде, где это возможно."
 bcm__placement_finder_naval_name: "Морская инфраструктура"
 bcm__placement_finder_naval_desc: "Определяет, будет ли режим карты «Рекомендуемый губернатор» предполагать идеальную морскую инфраструктуру или использовать вашу текущую пропускную способность портов и морское присутствие."
 bcm__placement_finder_naval_option_1_name: "$bcm_txt_current$"
 bcm__placement_finder_naval_option_1_desc: "Использует вашу текущую пропускную способность гаваней и морское присутствие."
 bcm__placement_finder_naval_option_2_name: "Максимальное присутствие"
 bcm__placement_finder_naval_option_2_desc: "Предполагать полное морское присутствие повсеместно при текущей вместимости гаваней."
 bcm__placement_finder_naval_option_3_name: "$bcm_txt_best_possible$"
 bcm__placement_finder_naval_option_3_desc: "Предполагается полное морское присутствие и наличие лучших из открытых портовых зданий в каждой прибрежной локации."
 bcm__placement_finder_accuracy_name: "Точность поиска"
 bcm__placement_finder_accuracy_desc: "Насколько тщательно режим карты «Рекомендуемый губернатор» ищет лучшие локации. Пропущенные локации отображаются чёрным цветом."
 bcm__placement_finder_accuracy_option_1_name: "Исчерпывающий"
 bcm__placement_finder_accuracy_option_1_desc: "Оценивать каждую локацию. Самый точный и самый медленный."
 bcm__placement_finder_accuracy_option_2_name: "Тщательный"
 bcm__placement_finder_accuracy_option_2_desc: "Пропускать локации, которые не могут войти в тройку лучших. Состав топ-3 и их оценки идентичны режиму «Исчерпывающий», только быстрее."
 bcm__placement_finder_accuracy_option_3_name: "Сбалансированный"
 bcm__placement_finder_accuracy_option_3_desc: "Пропускать локации, которые заведомо не могут быть лучшими. Определение лучшей локации по-прежнему гарантированно точное; 2-й и 3-й маркеры могут иногда различаться."
 bcm__placement_finder_accuracy_option_4_name: "Быстро"
 bcm__placement_finder_accuracy_option_4_desc: "Также пропускать локации, которые вряд ли окажутся лучшими. Лучшая найденная локация находится в пределах 20% от истинно лучшей и обычно всё ещё совпадает с ней."
 bcm__placement_finder_accuracy_option_5_name: "Самая высокая"
 bcm__placement_finder_accuracy_option_5_desc: "Оценивает наиболее перспективную локацию в каждой провинции, затем проводит уточнение среди лидеров. Значительно быстрее для больших стран; может пропустить наилучшую локацию."
 bcm__placement_finder_debug_path_name: "Включить отладочную диагностику"
 bcm__placement_finder_debug_path_desc: "Добавляет блок диагностики во всплывающие подсказки режима карты «Рекомендуемый губернатор»: прогнозируемый маршрут от вашей столицы до каждой локации со стоимостью каждого перехода, а также прогнозируемую близость в сравнении с вашей фактической близостью."
