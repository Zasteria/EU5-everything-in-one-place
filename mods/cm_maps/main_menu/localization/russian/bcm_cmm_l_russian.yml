 bcm__placement_finder_method_option_1_name: "$bcm_txt_tax_base$"
 bcm__placement_finder_method_option_1_desc: "Сортировать по тому, насколько назначение губернатора увеличит вашу общую налоговую базу. Более богатые локации дают больший эффект."
 bcm__placement_finder_method_option_2_name: "$bcm_txt_proximity$"
 bcm__placement_finder_method_option_2_desc: "Сортировать по количеству близости, которое добавило бы размещение там губернатора."
 bcm__placement_finder_roads_name: "Наземная инфраструктура"
 bcm__placement_finder_roads_desc: "Будет ли режим карты «Рекомендуемый губернатор» предполагать идеальную наземную инфраструктуру или использовать то, что вы фактически построили."
 bcm__placement_finder_roads_option_1_name: "$bcm_txt_current$"
