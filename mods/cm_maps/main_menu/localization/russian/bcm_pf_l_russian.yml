 MAPMODE_BCM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_BCM_CAPITAL_FINDER_TT_BEST$$BCM_PF_DEBUG_BLOCK$"
 MAPMODE_BCM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_BCM_CAPITAL_FINDER_TT_SCORED$\nСуществующий источник близости: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_BCM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_BCM_CAPITAL_FINDER_TT_SOURCE$$BCM_PF_DEBUG_BLOCK$"
 MAPMODE_BCM_CAPITAL_FINDER_TT_NO_DATA: "$bcm_pf_tt_no_data$"
