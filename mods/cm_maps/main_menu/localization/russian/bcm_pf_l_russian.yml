 MAPMODE_BCM_CAPITAL_FINDER_TT_FOREIGN: "$bcm_pf_tt_foreign$"
 MAPMODE_BCM_CAPITAL_FINDER_TT_WATER: "Это водная локация; столичные показатели применяются к вашим собственным землям."

 mapmode_bcm_capital_finder_hidden_name: "$mapmode_bcm_capital_finder_name$"
 MAPMODE_BCM_CAPITAL_FINDER_HIDDEN: "$MAPMODE_BCM_CAPITAL_FINDER$"

 bcm_pf_cap_source_legend_key: "$bcm_pf_source_legend$"

 # Action bar refresh button
 bcm_pf_refresh: "bcm_pf_refresh"
 bcm_pf_refresh_color: "тёмно-бирюзовый"
 bcm_pf_refresh_icon: "@bcm_pf_refresh!"
 bcm_pf_refresh_name: "Пересчитать очки размещения"
 bcm_pf_refresh_tooltip: "Принудительно пересчитать оценки размещения губернатора и столицы для текущих границ. В противном случае оценки используются повторно на срок до 4 лет."
 bcm_pf_estimate_note: "Это приблизительная оценка: настройка «Оценка поиска размещения» определяет, будут ли локации ранжироваться по налоговой базе, населению или базовому [proximity|e], а настройки «Наземная инфраструктура» и «Морская инфраструктура» выбирают дороги, здания и [maritime_presence|e], которые при этом учитываются. Пересчет происходит при открытии этого режима карты, но не чаще одного раза в 4 года; используйте кнопку обновления на панели действий, чтобы принудительно запустить новый расчет. Цвета обновятся по завершении."
 bcm_pf_tt_no_data: "Очки ещё не подсчитаны. Используйте кнопку обновления на панели действий, чтобы рассчитать очки для текущих границ."
 bcm_pf_tt_skipped: "Не оценено: настройка точности поиска пропустила это местоположение. Установите значение «Исчерпывающая» и обновите, чтобы оценить каждое местоположение."
 bcm_pf_tt_foreign: "Не является частью вашей страны."
 bcm_pf_source_legend: "Существующий источник близости (заштриховано)"
 bcm_pf_of_best: "из лучших"
 bcm_pf_gov_tt_head: "Прогнозируемый макс. средний прирост [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_avg_value')|1]%\nМакс. прогнозируемый прирост налоговой базы от [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_taxgain_value')|1]\nМакс. прогнозируемое население, взвешенное по приросту [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_popgain_value')|1] тыс."
 bcm_pf_gov_source_line: "Существующий источник [proximity|e]: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 bcm_pf_cap_tt_head: "Прогнозируемое макс. среднее [proximity|e] со столицей: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_avg_value')|1]%\nМакс. прогнозируемая налоговая база от [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_taxgain_value')|1]\nМакс. прогнозируемое достигнутое население, с учётом [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_popgain_value')|1]k"
