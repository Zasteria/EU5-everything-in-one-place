l_russian:
 mapmode_bcm_governor_finder_name: "Рекомендуемое размещение губернатора"
 MAPMODE_BCM_GOVERNOR_FINDER: "#T $mapmode_bcm_governor_finder_name$#!\nОкрашивает ваши [locations|e] в зависимости от того, сколько [proximity|e] добавит построенный там новый Местный губернатор или Морской губернатор, с учётом близости, которую уже обеспечивают ваш [capital|e] и существующие источники. Чем зеленее, тем лучше. Ваша столица и существующие источники близости заштрихованы.\n$bcm_pf_estimate_note$"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_SCORED: "$bcm_pf_gov_tt_head$\nОценка: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_gf_pct_value')|0]% от вашей лучшей локации[ROOT.GetLocation.Custom('bcm_pf_gf_status')]"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_BEST: "$bcm_pf_gov_tt_head$\nВаша лучшая локация"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_BCM_GOVERNOR_FINDER_TT_SCORED$$BCM_PF_DEBUG_BLOCK$"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_BCM_GOVERNOR_FINDER_TT_BEST$$BCM_PF_DEBUG_BLOCK$"
 MAPMODE_BCM_GOVERNOR_FINDER_TT_CAPITAL: "Ваш [capital|e] уже распространяет [proximity|e] отсюда."
