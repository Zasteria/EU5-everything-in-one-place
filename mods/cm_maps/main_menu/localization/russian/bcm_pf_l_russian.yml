 mapmode_bcm_capital_finder_name: "Рекомендуемое местоположение столицы"
 MAPMODE_BCM_CAPITAL_FINDER: "#T $mapmode_bcm_capital_finder_name$#!\nОкрашивает ваши [locations|e] в зависимости от того, насколько хорошо [capital|e] там будет распространять [proximity|e]. Существующие губернаторы игнорируются. Заштрихованные локации уже имеют источник близости, такой как текущая столица или губернатор.\n$bcm_pf_estimate_note$"
 MAPMODE_BCM_CAPITAL_FINDER_TT_SCORED: "$bcm_pf_cap_tt_head$\nОценка: [ROOT.GetLocation.MakeScope.ScriptValue('bcm_pf_cf_pct_value')|0]% от вашей лучшей локации[ROOT.GetLocation.Custom('bcm_pf_cf_status')]"
 MAPMODE_BCM_CAPITAL_FINDER_TT_BEST: "$bcm_pf_cap_tt_head$\nВаша лучшая локация"
