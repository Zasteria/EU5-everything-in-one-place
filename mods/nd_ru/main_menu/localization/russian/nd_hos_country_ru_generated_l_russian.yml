l_russian:
 HOS: "Святой Иоанн"
 HOS_ADJ: "госпитальерский"
 HOS_f: "Суверенный орден Святого Иоанна"
 HOS_f_desc: "Заново учредите Суверенный военный госпитальерский орден Святого Иоанна Иерусалимского — крестоносное братство, потерявшее Святую землю и всё же уцелевшее. Из своей твердыни на Родосе (а позже с Мальты) рыцари-иоанниты хранят восьмиконечный белый крест как суверенный католический орден: многонациональное братство лангов, флот, травящий корсаров Средиземноморья, и госпитальерскую традицию, породившую первые настоящие больницы христианского мира."
