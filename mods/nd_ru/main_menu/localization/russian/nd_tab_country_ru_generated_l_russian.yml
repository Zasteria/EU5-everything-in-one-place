l_russian:
 TAB_f: "Таборитская республика"
 TAB_f_desc: "Выкуйте суверенное гуситское содружество из радикального крыла Гуситских войн: братство крестьян-воинов, народная церковь чаши и Четыре пражские статьи, ставшие законом. Там, где Богемия пошла на уступки при Липанах, табориты обращают своё вагенбургское ополчение, женатое священство и выборное общинное правление в постоянное государство."
