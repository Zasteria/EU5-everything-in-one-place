l_russian:
 STATIC_MODIFIER_NAME_nd_golden_liberty: "Золотая вольность"
 STATIC_MODIFIER_DESC_nd_golden_liberty: "Золотая вольность закрепляет права каждого шляхтича. Ни один король не правит без согласия сейма, ни одна война не объявляется без одобрения шляхты, и всякая вера свободно исповедуется под защитой Речи Посполитой."
 STATIC_MODIFIER_NAME_nd_jagiellonian_union: "Ягеллонская уния"
 STATIC_MODIFIER_DESC_nd_jagiellonian_union: "Династия, соединившая два великих народа, выковала державу от Балтики до Чёрного моря. Силой короны и верностью подданных Речь Посполитая устоит как держава всего материка."
 STATIC_MODIFIER_NAME_nd_spirit_of_tolerance: "Дух терпимости"
 STATIC_MODIFIER_DESC_nd_spirit_of_tolerance: "В век, когда Европа горит в религиозных войнах, Речь Посполитая стоит особняком — убежище, где католик, протестант, православный и иудей могут мирно жить бок о бок."
 STATIC_MODIFIER_NAME_nd_confessional_discipline: "Вероисповедная дисциплина"
 STATIC_MODIFIER_DESC_nd_confessional_discipline: "Истинная вера — основание государства. Укрепляя церковь и наставляя верных, Речь Посполитая сберегает духовное единство от хаоса раскола."
 STATIC_MODIFIER_NAME_nd_constitutional_republic: "Конституционная республика"
 STATIC_MODIFIER_DESC_nd_constitutional_republic: "Правительственный акт разделяет власти, отменяет liberum veto и распространяет гражданство за пределы шляхты. Новая заря Республики Обоих Народов."
 STATIC_MODIFIER_NAME_nd_royal_prerogative: "Королевская прерогатива"
 STATIC_MODIFIER_DESC_nd_royal_prerogative: "Корона вернула себе древнюю власть. Liberum veto отменено, магнаты усмирены, и король наконец может править, не спотыкаясь о шляхетское противодействие."
 nd_plc.1.t: "Уния двух народов"
 nd_plc.1.d: "В первый день июля в городе Люблине печати двух великих народов вдавили в воск. Королевство Польское и Великое княжество Литовское, связанные браком, войной и общей нуждой со времён Ягайло и Ядвиги, теперь сплавлены в единую Речь Посполитую. Rzeczpospolita Obojga Narodów, Республика Обоих Народов, раскинулась от балтийских берегов до восточных степей и вобрала поляков, литовцев, русинов, немцев, евреев, татар и армян.\n\nНо каким будет это государство? Шляхта мечтает о дворянской республике, где каждый шляхтич — король в своём имении, где сейм правит согласием, а корона лишь первая среди равных. Другие видят в унии случай построить сильную власть на ягеллонском наследии — династическое государство, способное бросить соединённые силы обоих народов против Московии, Османов и остатков Тевтонского ордена.\n\nПуть, который мы выберем сейчас, определит облик Речи Посполитой на поколения вперёд.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!"
 nd_plc.1.a: "Золотая вольность, вольность каждого шляхтича"
 nd_plc.1.b: "Ягеллонское наследие, сила в династической унии"
 nd_plc.2.t: "Варшавская конфедерация"
 nd_plc.2.d: "Двадцать восьмого января 1573 года, когда трон пустовал, а будущее было туманно, собравшаяся шляхта Речи Посполитой сделала заявление, которому суждено было звучать веками. Варшавская конфедерация, подписанная католиками, лютеранами, кальвинистами, православными и другими, обещала взаимную терпимость и мир между всеми исповеданиями.\n\n«Мы, разнящиеся в делах веры, будем хранить мир между собой, — гласит документ, — и не станем проливать крови из-за различия веры или церкви, ни карать друг друга отнятием имущества, лишением чести, заключением или изгнанием».\n\nВ век, когда Варфоломеевская ночь только что потрясла всю Европу, а религиозные войны раздирают материк, Речь Посполитая выбрала смелый путь. Но довольны не все: кардинал Гозий назвал Польшу «прибежищем еретиков», и многие католические голоса требуют, чтобы государство ревностнее защищало истинную веру."
 nd_plc.2.a: "Пусть терпимость будет законом нашей Республики"
 nd_plc.2.b: "Укрепить истинную веру, единство через убеждение"
 nd_plc.3.t: "Правительственный акт 3 мая"
 nd_plc.3.d: "После десятилетий политического паралича, иноземного вмешательства и медленного распада государственной власти Великий сейм добился того, что многие считали невозможным. Третьего мая 1791 года депутаты приняли Правительственный акт — первую писаную конституцию Европы и вторую в мире после американской 1787 года.\n\nКонституция отменяет liberum veto, позволявшее одному депутату перечеркнуть работу целой сессии. Она вводит наследственную монархию, даёт политические права мещанству и берёт крестьян под защиту государства. Гуго Коллонтай, Игнаций Потоцкий и король Станислав Август Понятовский вместе создали документ, который может спасти Речь Посполитую от держав-разделительниц.\n\nНо Россия и Пруссия не потерпят усиления Польши. Жизнь конституции зависит от того, сумеем ли мы отстоять её от тех, кто наживается на нашей слабости, — и от иноземных держав, и от магнатов Тарговицкой конфедерации, зовущих русские штыки защищать свои привилегии."
 nd_plc.3.a: "Республика возрождена, суверенитет через конституцию"
 nd_plc.3.b: "Корона восстановлена, сильная монархия для отчаянных времён"
 nd_plc.4.t: "Лисовчики: расписные всадники Речи Посполитой"
 nd_plc.4.d: "Они воюют без жалования, без обозов, без пощады. Лисовчики, названные по своему основателю Александру Юзефу Лисовскому, — нерегулярная конница, служащая Речи Посполитой за право грабежа. В приметных нарядах, на быстрых конях, они бьют глубоко в тылу врага, жгут припасы, рассеивают подкрепления и сеют ужас.\n\nСлава бежит впереди них по всей Европе. В Тридцатилетнюю войну император Священной Римской империи Фердинанд II просил их на службу, и «расписных всадников» боялись от Московии до Трансильвании. Их скорости и свирепости нет равных — как и их славе грабителей и насильников над мирными жителями.\n\nДля Речи Посполитой они — военный парадокс: страшны в бою, неуправляемы в мире. Но государству, которое не может позволить себе достаточное постоянное войско, эти самоокупаемые нерегулярные части закрывают опасную брешь в обороне."
 nd_plc.4.a: "Пусть расписные всадники служат Республике"
 nd_plc.5.t: "Хлебный путь в Гданьск"
 nd_plc.5.d: "Из великих имений в глубине страны, из фольварков Мазовии, Малой Польши и Волыни баржи плывут на север по Висле. Они везут рожь и пшеницу, которыми кормятся Амстердам, Антверпен и растущие города Запада. В Гданьске река встречается с морем, а польское зерно — с голландским серебром.\n\nГданьск держит восемь десятых этой внутренней торговли. Его мещане богатеют как посредники между шляхтой-землевладельцами и купцами Нидерландов. Хлебная торговля сделала Речь Посполитую житницей Европы, но и заперла её хозяйство в колею: шляхта расширяет имения, крепче привязывает крестьян к земле и противится любой перемене, способной помешать зерну дойти до рынка.\n\nИ всё же, пока идут урожаи и течёт Висла, богатство Речи Посполитой не иссякнет."
 nd_plc.5.a: "Река несёт наше процветание"
 nd_plc.6.t: "Сарматизм: шляхетский идеал"
 nd_plc.6.d: "Шляхту охватило новое культурное движение. Сарматизм — вера в то, что польское дворянство происходит от древних сарматских воинов степей, — стал больше чем родословной легендой. Это целый образ жизни: кунтуш, сабля, узорная карабела, щедрое гостеприимство, неистовая независимость и убеждённость, что шляхетская демократия Речи Посполитой — лучшее правление, какое когда-либо придумал человек.\n\nСарматская культура чтит воинскую доблесть, личную честь и равенство всех шляхтичей независимо от богатства. Она рождает великолепное искусство, зодчество и словесность; усадьбы и сельские храмы свидетельствуют о её замыслах. Но критики предупреждают, что сарматизм растит и ненависть к чужакам, и сопротивление реформам, и опасное самодовольство перед растущей уязвимостью Речи Посполитой.\n\nЗолотой век или позолоченная клетка — сарматизм стал определяющей чертой польско-литовской шляхты."
 nd_plc.6.a: "Вот кто мы есть"
 nd_plc_union_heritage: "Наследие унии"
 nd_plc_union_heritage_desc: "Традиция польско-литовского союза восходит к браку Ягайло и Ядвиги, связавшему два народа против общих угроз."
 nd_plc_amber_trade: "Янтарный путь"
 nd_plc_amber_trade_desc: "Древние торговые пути, по которым балтийский янтарь шёл на юг через Европу, веками обогащают купцов Речи Посполитой."
 nd_plc_szlachta_traditions: "Шляхетские традиции"
 nd_plc_szlachta_traditions_desc: "Конная шляхта Речи Посполитой воюет как конница: каждый шляхтич — воин, каждое имение — источник всадников."
 nd_plc_multi_faith_roots: "Корни веротерпимости"
 nd_plc_multi_faith_roots_desc: "Со времён Калишского статута польско-литовские земли дают защиту общинам всякой веры."
 nd_plc_jagiellonian_learning: "Ягеллонская учёность"
 nd_plc_jagiellonian_learning_desc: "Ягеллонский университет в Кракове, основанный в 1364 году, вырастил Коперника и стал одним из величайших средоточий учёности Европы."
 nd_plc_folwark_economy: "Фольварочное хозяйство"
 nd_plc_folwark_economy_desc: "Фольварки — шляхетские имения, где работают прикреплённые к земле крестьяне, — стали двигателем зернового производства Речи Посполитой."
 nd_plc_sejmik_tradition: "Традиция сеймиков"
 nd_plc_sejmik_tradition_desc: "Местные сеймики избирают послов на общий сейм, давая каждому воеводству голос в управлении."
 nd_plc_pospolite_reforms: "Реформы посполитого рушения"
 nd_plc_pospolite_reforms_desc: "Всеобщее ополчение шляхты, где каждый шляхтич обязан идти на войну, — последний военный резерв Речи Посполитой."
 nd_plc_magnate_courts: "Магнатские дворы"
 nd_plc_magnate_courts_desc: "Великие магнатские роды держат дворы, соперничающие с дворами мелких королей, и покровительствуют художникам, музыкантам и учёным."
 nd_plc_pancerni_tradition: "Панцирная конница"
 nd_plc_pancerni_tradition_desc: "Панцирные, бронная казацкая конница, — хребет конных сил Речи Посполитой, многочисленный и на всё годный."
 nd_plc_wybraniecka_infantry: "Выбранецкая пехота"
 nd_plc_wybraniecka_infantry_desc: "Выбранецкая пехота, набранная с королевских имений, — попытка Речи Посполитой создать профессиональную крестьянскую пехоту."
 nd_plc_lipka_tatars: "Служба липков"
 nd_plc_lipka_tatars_desc: "Татары-мусульмане, потомки беглецов из Золотой Орды, служат Речи Посполитой лёгкой конницей — дозорами и налётчиками."
 nd_plc_vistula_trade: "Висленская торговля зерном"
 nd_plc_vistula_trade_desc: "Зерно из глубины страны плывёт по Висле в Гданьск и кормит города Западной Европы в обмен на серебро и изделия."
 nd_plc_tabor_defense: "Боевые возы табора"
 nd_plc_tabor_defense_desc: "Подвижные укрепления из возов мгновенно создают полевую оборону и превращают открытую равнину в позицию против степных налётчиков."
 nd_plc_warsaw_confederation: "Варшавская конфедерация"
 nd_plc_warsaw_confederation_desc: "Заявление 1573 года о взаимной веротерпимости, одно из первых в истории Европы, делает Речь Посполитую убежищем гонимых."
 nd_plc_lisowczycy_tradition: "Традиция лисовчиков"
 nd_plc_lisowczycy_tradition_desc: "Нерегулярная конница налётчиков, воюющая без жалования и живущая грабежом. Её боятся по всей Европе за скорость и свирепость."
 nd_plc_magnate_fortifications: "Магнатские укрепления"
 nd_plc_magnate_fortifications_desc: "Великие магнатские роды строят в своих имениях укреплённые усадьбы и замки, и по всей Речи Посполитой складывается сеть опорных пунктов."
 nd_plc_elective_monarchy: "Выборная монархия"
 nd_plc_elective_monarchy_desc: "Вольная элекция позволяет всей шляхте участвовать в выборе короля, привлекая иноземных кандидатов и внимание дипломатов со всей Европы."
 nd_plc_gdansk_trade: "Торговое господство Гданьска"
 nd_plc_gdansk_trade_desc: "Великий балтийский порт держит вывоз зерна Речи Посполитой в Западную Европу и пропускает через свои склады огромные богатства."
 nd_plc_noble_democracy: "Шляхетская демократия"
 nd_plc_noble_democracy_desc: "Liberum veto даёт каждому шляхетскому послу право остановить закон — священное единогласие, которое и хранит вольность, и зовёт паралич."
 nd_plc_sarmatism: "Сарматизм"
 nd_plc_sarmatism_desc: "Вера в то, что польская шляхта происходит от древних сарматских воинов, породила особую культуру воинской доблести, пышности и неистовой независимости."
 nd_plc_refuge_of_nations: "Убежище народов"
 nd_plc_refuge_of_nations_desc: "Речь Посполитая принимает гонимых всех вер и народов (евреев, армян, шотландцев, немцев, татар) и обогащает свою культуру их многообразием."
 nd_plc_dual_legal_system: "Двойная правовая система"
 nd_plc_dual_legal_system_desc: "У Польши и Литвы раздельные своды законов и трибуналы, и Великое княжество сохраняет в Речи Посполитой своё лицо."
 nd_plc_may_constitution: "Конституция 3 мая"
 nd_plc_may_constitution_desc: "Первая современная конституция Европы отменяет liberum veto, разделяет власти и даёт гражданство мещанству."
 nd_plc_national_uprising: "Дух народного восстания"
 nd_plc_national_uprising_desc: "Дух Костюшко — народа, готового биться за свободу против несравнимо сильного врага, — определяет последнюю, непокорную главу Речи Посполитой."
 nd_plc_economic_reform: "Хозяйственное обновление"
 nd_plc_economic_reform_desc: "Поздние реформы Речи Посполитой вводят мануфактуры, улучшают дороги и начинают уход от чисто сельского вывозного хозяйства."
 nd_plc_unity_in_diversity: "Единство в многообразии"
 nd_plc_unity_in_diversity_desc: "Величайшая сила Речи Посполитой всегда была в умении объединить под одним знаменем поляков, литовцев, русинов, немцев, евреев, татар и армян."
 a_nd_plc_pancerni: "Панцирные"
 a_nd_plc_pancerni_desc: "Средняя бронная конница, хребет конных сил Речи Посполитой. Многочисленнее и гибче гусар, панцирные годны на всё — от разведки до преследования."
 a_nd_plc_lisowczycy: "Лисовчики"
 a_nd_plc_lisowczycy_desc: "Нерегулярная конница налётчиков, воюющая без жалования и живущая грабежом. Этих «расписных всадников», названных по Александру Юзефу Лисовскому, боялись по всей Европе."
 a_nd_plc_lisowczycy_levy: "Ополчение лисовчиков"
 a_nd_plc_lisowczycy_levy_desc: "Нерегулярная конница, поднятая шляхтой в традиции лисовчиков: быстрая, напористая и кормящаяся грабежом."
 a_nd_plc_wybraniecka: "Выбранецкая пехота"
 a_nd_plc_wybraniecka_desc: "Пехота, набиравшаяся с каждого двадцатого крестьянского двора в королевских имениях. Одна из первых попыток создать в Речи Посполитой постоянную профессиональную пехоту."
 a_nd_plc_wybraniecka_levy: "Ополчение выбранецкой пехоты"
 a_nd_plc_wybraniecka_levy_desc: "Крестьянская пехота, набранная выборкой с королевских имений, вооружённая огнестрельным оружием и обученная бою в строю."
 a_nd_plc_pospolite: "Посполитое рушение"
 a_nd_plc_pospolite_desc: "Всеобщее ополчение шляхты: каждый шляхтич обязан идти на войну в защиту Речи Посполитой. Многочисленное, но плохо слаженное."
 a_nd_plc_lipka_tatar: "Конница липков"
 a_nd_plc_lipka_tatar_desc: "Татары-мусульмане, поколениями служащие Речи Посполитой лёгкой конницей в дозорах. Потомки беглецов из Золотой Орды, получивших землю в Литве."
 a_nd_plc_tabor: "Боевой воз"
 a_nd_plc_tabor_desc: "Подвижные укрепления из возов, которые сцепляют цепями, мгновенно создавая полевую оборону. Переняты у гуситских таборов и приспособлены к открытым равнинам Речи Посполитой."
 nd_plc_folwark: "Фольварк"
 nd_plc_folwark_desc: "Шляхетское имение, выращивающее зерно на вывоз. Фольварочная система движет зерновым хозяйством Речи Посполитой, но прикрепляет крестьян к земле."
 nd_plc_sejmik_hall: "Зал сеймика"
 nd_plc_sejmik_hall_desc: "Место местного сеймика, где шляхта спорит, избирает послов на общий сейм и держит в руках настоящую власть."
 nd_plc_zamek: "Магнатский замок"
 nd_plc_zamek_desc: "Укреплённая магнатская усадьба, соединяющая пышность жилища с военным назначением. Такие твердыни держат оборонительную сеть Речи Посполитой."
 nd_plc_akademia: "Академия"
 nd_plc_akademia_desc: "Университет или академия в ягеллонской традиции, развивающие свободные искусства, право, медицину и естественные науки."
 nd_plc_amber_workshop: "Янтарная мастерская"
 nd_plc_amber_workshop_desc: "Мастерская, где сырой балтийский янтарь режут, шлифуют и готовят на продажу по древним торговым путям."
 nd_plc_spichrz: "Гданьский амбар"
 nd_plc_spichrz_desc: "Балтийский зерновой склад, где пшеницу и рожь Речи Посполитой хранят, сортируют и грузят на корабли, идущие к рынкам Западной Европы."
 nd_plc_manufaktura: "Мануфактура"
 nd_plc_manufaktura_desc: "Мастерская, выпускающая изделия, — признак позднего перехода Речи Посполитой от вывоза зерна к разностороннему хозяйству."
 nd_plc_folwark_maintenance: "Возделывание зерна"
 nd_plc_folwark_maintenance_desc: "Лес на постройки имения и скот для работы дают урожаи зерна, идущего на вывоз по Висле."
 nd_plc_sejmik_upkeep: "Делопроизводство сеймика"
 nd_plc_sejmik_upkeep_desc: "Записи, переписка и официальные бумаги местного управления требуют бумаги, тонкого сукна для церемоний и книг законов."
 nd_plc_zamek_maintenance: "Гарнизон замка"
 nd_plc_zamek_maintenance_desc: "Камень на стены, лес на починку и оружие для гарнизона держат магнатскую твердыню наготове."
 nd_plc_akademia_upkeep: "Содержание академии"
 nd_plc_akademia_upkeep_desc: "Бумага для рукописей, книги для библиотеки и стекло для линз и приборов поддерживают учёные занятия академии."
 nd_plc_amber_processing: "Обработка янтаря"
 nd_plc_amber_processing_desc: "Балтийский янтарь режут и шлифуют в украшения и поделки на вывоз по древним торговым путям."
 nd_plc_spichrz_operations: "Работа амбара"
 nd_plc_spichrz_operations_desc: "Пшеница и лес проходят через склад для сортировки и хранения; соль сберегает зерно в долгом плавании к западным рынкам."
 nd_plc_manufaktura_operations: "Работа мануфактуры"
 nd_plc_manufaktura_operations_desc: "Железо куют, а сукно обрабатывают в орудия и утварь для своего рынка и на вывоз."
 levy_nd_plc_lipka_tatar: "Конница липков"
 levy_nd_plc_lipka_tatar_desc: "Лёгкая татарская конница мусульман из поселений в Литве."
 levy_nd_plc_lisowczycy: "Лисовчики"
 levy_nd_plc_lisowczycy_desc: "Нерегулярная шляхетская конница в традиции расписных всадников."
 levy_nd_plc_wybraniecka: "Выбранецкая пехота"
 levy_nd_plc_wybraniecka_desc: "Крестьянская пехота, набранная выборкой с королевских имений."
 levy_nd_plc_pospolite: "Посполитое рушение"
 levy_nd_plc_pospolite_desc: "Всеобщее ополчение шляхты, идущей на войну."
 nd_plc_formed_tt: "Польша и Литва образованы"
 nd_plc_path_a_tt: "Избрана Золотая вольность"
 nd_plc_path_b_tt: "Избрана Ягеллонская уния"
 nd_plc_destiny: "Судьба Речи Посполитой"
 nd_plc_destiny_desc: "Речь Посполитая провозглашена. Золотой вольностью или династической мощью — путь вперёд открыт."
 nd_plc_dest_sejm_ascendant: "Возвышение сейма"
 nd_plc_dest_sejm_ascendant_desc: "Займите великий порт Гданьск, чтобы опереть на него хлебную торговлю, заведите денежные учреждения через банковское дело и наполните казну Речи Посполитой. Шляхетской республике нужны и торговля, и монета."
 nd_plc_dest_breadbasket: "Житница Европы"
 nd_plc_dest_breadbasket_desc: "Сделайте Речь Посполитую житницей, кормящей Западную Европу. Расширяйте фольварочное хозяйство, умножайте богатство страны и следите, чтобы пшеница шла через рынки столицы."
 nd_plc_dest_republic_of_nations: "Республика народов"
 nd_plc_dest_republic_of_nations_desc: "Доведите Речь Посполитую до полного расцвета: просвещённая республика многих народов, богатая учёностью, процветающая торговлей и управляемая самой передовой конституцией Европы."
 nd_plc_dest_eastern_march: "Восточные кресы"
 nd_plc_dest_eastern_march_desc: "Возьмите великие города русинского и русского пограничья. Смоленск и Киев должны перейти под власть Речи Посполитой, чтобы обезопасить восточный рубеж династии."
 nd_plc_dest_black_sea_reach: "Выход к Чёрному морю"
 nd_plc_dest_black_sea_reach_desc: "Пробейтесь на юг через Подолье к берегам Чёрного моря. Возьмите крымский порт Кафу и крепость Каменец-Подольский, чтобы властвовать над степным рубежом."
 nd_plc_dest_bulwark_of_christendom: "Оплот христианства"
 nd_plc_dest_bulwark_of_christendom_desc: "Речь Посполитая стоит щитом Европы и против востока, и против юга. Возьмите Москву и Константинополь, чтобы доказать, что ягеллонскому наследию нет равных на материке."
 nd_plc.7.t: "Судьба Речи Посполитой"
 nd_plc.7.d: "Речь Посполитая стоит на перекрёстке Европы. На западе рынки Амстердама и Лондона жаждут нашего зерна. На востоке бескрайняя степь тянется к Московии и владениям Османов. Выбор, который мы сделаем сейчас, решит, станет ли Речь Посполитая маяком свободы или колоссом завоеваний.\n\nОснования заложены. Речь Посполитая устойчива и сильна. Какую страну мы построим на них?"
 nd_plc.7.a: "Наша судьба ждёт"
 nd_plc.8.t: "Сейм возвышается"
 nd_plc.8.d: "Великий порт Гданьск наш, а с ним и ключ к балтийской хлебной торговле. Торговые доходы текут в казну Республики, и шляхта славит мудрость своей золотой вольности. С учреждёнными банками и надёжной казной шляхетская республика доказывает, что свобода и процветание не противоречат друг другу.\n\nПослы сейма говорят с новой уверенностью: Речи Посполитой не нужен деспот, чтобы процветать. Голос шляхты, звучащий в обсуждении и согласии, приведёт этот народ к величию."
 nd_plc.8.a: "Пусть сейм правит мудро"
 nd_plc.9.t: "Житница Запада"
 nd_plc.9.d: "От фольварков в глубине страны до складов балтийских портов Речь Посполитая стала для Европы незаменимой. Наша пшеница кормит города Запада, наш янтарь украшает их дворы, наш лес строит их корабли. Висла — жидкое золото, и нам принадлежит каждый её изгиб.\n\nНо как распорядиться этим богатством? Одни стоят за морское господство — власть над морскими путями и портами, которые везут наше зерно на чужие рынки. Другие зовут к шляхетскому предпринимательству — вкладывать в имения, мельницы и мастерские и строить разностороннее хозяйство, не зависящее от одного урожая."
 nd_plc.9.a: "Взять в руки балтийские торговые пути"
 nd_plc.9.b: "Вкладывать в имения и мастерские"
 nd_plc.10.t: "Республика без равных"
 nd_plc.10.d: "То, о чём рассуждают философы Парижа и Эдинбурга, Речь Посполитая построила. Республика многих народов — поляков, литовцев, русинов, немцев, евреев, татар, армян — управляется законом, богатеет торговлей и освещена светом разума. Конституция отменила liberum veto; Эдукационная комиссия создала первое в Европе министерство просвещения; университеты цветут.\n\nРеспублика Обоих Народов стала Республикой Всех Народов. Но какой облик примет это просвещённое правление? Гражданские радикалы требуют всеобщих прав, открытых границ и власти разума. Конституционные консерваторы предпочитают опереть реформу на традиции шляхты, сохранив шляхетские привилегии и обновив государство."
 nd_plc.10.a: "Гражданское просвещение для всех народов"
 nd_plc.10.b: "Реформа в шляхетской традиции"
 nd_plc.11.t: "Восточные кресы в наших руках"
 nd_plc.11.d: "Знамёна Речи Посполитой реют над Смоленском и Киевом. Восточные кресы — огромное спорное пограничье, где сходятся латинский и православный христианский мир, — прочно в руках Ягеллонов. В днепровских крепостях стоят гарнизоны Речи Посполитой, и торговые пути русинских земель ведут к Кракову и Варшаве, а не к Москве.\n\nЭто не просто завоевание. Это воплощение ягеллонского замысла: династическое государство от Балтики до сердца Руси, связывающее народы, у которых общий рубеж и общая вера — или хотя бы готовность жить вместе под одной короной."
 nd_plc.11.a: "Власть династии растёт всё дальше на восток"
 nd_plc.12.t: "Чёрное море открыто"
 nd_plc.12.d: "Речь Посполитая пробилась к Чёрному морю. Крепость Каменец-Подольский, легендарный бастион на Смотриче, стережёт наш южный рубеж, а порт Кафа открывает торговые пути на Восток. Власть Крымского ханства над степью сломлена.\n\nНо чтобы удержать этот рубеж, нужен замысел. Одни стоят за постоянную военную границу — укреплённые линии, профессиональные гарнизоны и выжженную землю, чтобы отпугнуть налётчиков. Другие зовут к союзу с казачьими войсками, знающими степь, — дать им привилегии и самоуправление в обмен на службу щитом Речи Посполитой."
 nd_plc.12.a: "Построить укреплённый рубеж"
 nd_plc.12.b: "Привлечь казаков на нашу сторону"
 nd_plc.13.t: "Antemurale Christianitatis"
 nd_plc.13.d: "Москва пала. Константинополь наш. Речь Посполитая, Antemurale Christianitatis, оплот христианства, добилась того, о чём крестоносцы, императоры и цари могли лишь мечтать. От Балтики до Босфора, от Одера до Волги ягеллонский орёл бросает тень на пол-Европы.\n\nЭтот миг будет звучать веками. Речь Посполитая может стать вечным защитником европейской цивилизации, военной силой столь грозной, что ни одна восточная орда и ни одна южная империя больше никогда не будет угрожать христианскому миру. Или же она может использовать это небывалое положение, чтобы возвысить Ягеллонов как первый род Европы и притязать на господство над материком, какого не знало ни одно государство со времён Рима."
 nd_plc.13.a: "Мы — вечный щит христианства"
 nd_plc.13.b: "Ягеллонская держава устоит"
 STATIC_MODIFIER_NAME_nd_plc_dest_vistula_dominance: "Господство в висленской торговле"
 STATIC_MODIFIER_DESC_nd_plc_dest_vistula_dominance: "Речь Посполитая держит балтийский хлебный путь от поля до порта и властвует над торговлей, кормящей Западную Европу."
 STATIC_MODIFIER_NAME_nd_plc_dest_noble_enterprise: "Шляхетское предпринимательство"
 STATIC_MODIFIER_DESC_nd_plc_dest_noble_enterprise: "Шляхта вкладывает хлебную прибыль в имения, мельницы и мастерские, и хозяйство Речи Посполитой выходит за пределы вывоза сырья."
 STATIC_MODIFIER_NAME_nd_plc_dest_civic_enlightenment: "Гражданское просвещение"
 STATIC_MODIFIER_DESC_nd_plc_dest_civic_enlightenment: "Речь Посполитая принимает всеобщие гражданские ценности, открытое правление, просвещённых граждан и власть разума над традицией."
 STATIC_MODIFIER_NAME_nd_plc_dest_noble_constitution: "Шляхетская конституция"
 STATIC_MODIFIER_DESC_nd_plc_dest_noble_constitution: "Реформа, опирающаяся на шляхетскую традицию: республика обновляет учреждения, сохраняя привилегии, которые делают её неповторимой."
 STATIC_MODIFIER_NAME_nd_plc_dest_steppe_frontier: "Степной рубеж"
 STATIC_MODIFIER_DESC_nd_plc_dest_steppe_frontier: "Постоянная военная граница из крепостей и гарнизонов защищает черноморское побережье от налётчиков и соперничающих империй."
 STATIC_MODIFIER_NAME_nd_plc_dest_cossack_alliance: "Союз с казаками"
 STATIC_MODIFIER_DESC_nd_plc_dest_cossack_alliance: "Казачьи войска служат Речи Посполитой конным авангардом в степи, отдавая воинское умение за самоуправление и привилегии."
 STATIC_MODIFIER_NAME_nd_plc_dest_antemurale: "Antemurale Christianitatis"
 STATIC_MODIFIER_DESC_nd_plc_dest_antemurale: "Речь Посполитая стоит вечным щитом христианства — военным бастионом столь грозным, что ни одна держава с востока или юга не может угрожать Европе."
 STATIC_MODIFIER_NAME_nd_plc_dest_jagiellonian_imperium: "Ягеллонская держава"
 STATIC_MODIFIER_DESC_nd_plc_dest_jagiellonian_imperium: "Ягеллоны притязают на господство над материком, простирая мощь Речи Посполитой от Балтики до Босфора."
 nd_plc_sejm_walny: "Вальный сейм"
 nd_plc_sejm_walny_desc: "Верховный парламент Республики Обоих Народов, где послы от каждого воеводства обсуждают законы, по которым живёт Речь Посполитая."
 nd_plc_hetman_arsenal: "Гетманский арсенал"
 nd_plc_hetman_arsenal_desc: "Главный военный склад войска Речи Посполитой, где силы великого гетмана снаряжают, снабжают и обучают для защиты христианского мира."
 nd_plc_sejm_walny_upkeep: "Делопроизводство сейма"
 nd_plc_sejm_walny_upkeep_desc: "Бумага для законов, тонкое сукно для церемоний, книги законов для справок и мебель для палат поддерживают работу сейма."
 nd_plc_hetman_arsenal_upkeep: "Работа арсенала"
 nd_plc_hetman_arsenal_upkeep_desc: "Куют оружие, стены чинят камнем и лесом, а железо идёт на доспехи и снаряжение для войск Речи Посполитой."
 AUTO_MODIFIER_NAME_nd_plc_bureaucracy_authority: "Республика Обоих Народов"
 AUTO_MODIFIER_DESC_nd_plc_bureaucracy_authority: "Люблинская уния слила учреждения Короны и Великого княжества в единую Речь Посполитую — союзную республику шляхты, чьи палаты, трибуналы и должности правят от Балтики до Днепра. Через эти учреждения шляхта Речи Посполитой держит власть, некогда принадлежавшую королям."
 plc_sejm_walny_bureaucracy: "Вальный сейм"
 plc_sejm_walny_bureaucracy_desc: "Учреждённый Люблинской унией 1569 года, Вальный сейм Республики Обоих Народов собирал в нижней палате 167 послов, избранных 70 воеводскими сеймиками Короны Польской и Великого княжества Литовского. Созываясь обычно раз в два года на шесть недель, сейм принимал обязательные законы, утверждал договоры и одобрял военные налоги. Двухпалатное устройство (послы спорят под Сенатом) давало шляхте обоих народов единый законодательный голос."
 plc_senat_rzeczypospolitej_bureaucracy: "Сенат Речи Посполитой"
 plc_senat_rzeczypospolitej_bureaucracy_desc: "Верхняя палата сейма из епископов, воевод, каштелянов и коронных министров — около 140 пожизненных мест, почти целиком занятых магнатскими родами, чьи латифундии затмевали королевские имения. Сенаторы-резиденты между сеймами постоянно состояли при короле и советовали ему по каждому распоряжению. Через Сенат Радзивиллы, Замойские, Острожские и Сапеги превращали земельное богатство в постоянную конституционную власть."
 plc_pacta_conventa_bureaucracy: "Pacta conventa"
 plc_pacta_conventa_bureaucracy_desc: "Начиная с избрания Генриха Валуа в 1573 году каждый государь Речи Посполитой присягал на личном договоре обязательств (pacta conventa) вместе с постоянными конституционными Генриковыми артикулами. Каждый избранный король обещал определённые дела (иноземный брак, уплату королевских долгов, защиту границ) и признавал право шляхты на вооружённое сопротивление — рокош, — если он нарушит клятву. Это учреждение сделало польскую королевскую власть договорной, а не династической."
 plc_hetmanate_bureaucracy: "Гетманство"
 plc_hetmanate_bureaucracy_desc: "Четыре пожизненные должности (великий гетман коронный, польный гетман коронный и их литовские собратья) держали верховное командование постоянным войском Речи Посполитой. С 1585 года гетмана можно было сместить только по обвинению в доказанной измене; с 1590 года его военные распоряжения имели ту же силу, что и законы сейма. Гетманы держали своих послов при Порте, у татар и в Московии и распоряжались военными деньгами без вмешательства короля."
 plc_trybunal_koronny_bureaucracy: "Коронный трибунал"
 plc_trybunal_koronny_bureaucracy_desc: "Король Стефан Баторий учредил Коронный трибунал в 1578 году, чтобы избавить королевский суд от апелляций; в 1581 году в Вильно появился Литовский трибунал. Двадцать семь светских депутатов, ежегодно избираемых сеймиками, и шесть духовных, избранных соборными капитулами, поочерёдно заседали в Петркове и Люблине и выносили окончательные решения по делам шляхты. Отняв у короля апелляционную власть, трибуналы отдали закон шляхты в руки самой шляхты."
 plc_kozak_rejestrowy_bureaucracy: "Реестровое казачество"
 plc_kozak_rejestrowy_bureaucracy_desc: "Сигизмунд II Август впервые вписал казаков в государственный реестр в 1572 году, а Стефан Баторий превратил эту систему в пограничный корпус платной конницы, державший Дикое поле против татар и московитов. Реестровые казаки освобождались от налогов, получали землю и управлялись сами под назначенной старшиной. Учреждение рухнуло в 1648 году, когда отказ Короны расширить реестр сверх двадцати тысяч вызвал восстание Хмельницкого и потерю Левобережной Украины."
 plc_liberum_veto_bureaucracy: "Liberum veto"
 plc_liberum_veto_bureaucracy_desc: "9 марта 1652 года трокский посол Владислав Сицинский крикнул «Nie pozwalam!» («Не позволяю!») и вышел из палаты сейма, сорвав заседание до истечения законного срока. Из этого прецедента выросло учение, по которому протест одного посла отменял все решения целого сейма. Основанное на равенстве каждого шляхтича, вето к XVIII веку стало орудием, которым русские, прусские и французские послы покупали паралич любой реформы."
