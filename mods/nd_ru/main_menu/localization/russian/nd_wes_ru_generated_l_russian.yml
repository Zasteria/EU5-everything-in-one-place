l_russian:
 STATIC_MODIFIER_NAME_nd_westphalian_sovereignty: "Вестфальский суверенитет"
 STATIC_MODIFIER_DESC_nd_westphalian_sovereignty: "Вестфальский порядок суверенного равенства государств, где каждый князь хозяин в своей державе и свободен от вмешательства извне в дела веры и правления."
 STATIC_MODIFIER_NAME_nd_red_earth_justice: "Красная земля"
 STATIC_MODIFIER_DESC_nd_red_earth_justice: "На Красной земле по-прежнему действует императорский Blutbann. Через древние фемические трибуналы Вестфалия держит особую традицию имперского правосудия, дотягивающегося через всю державу и наводящего порядок там, где иные власти бессильны."
 nd_wes.1.t: "Возвышение Вестфалии"
 nd_wes.1.d: "Земли между Рейном и Везером объединены под вестфальской властью. От соляных источников Хелльвега до кузниц Зауэрланда, от ганзейских торговых контор Дортмунда до потайных залов трибуналов, где судьи в капюшонах вершат императорское правосудие: это страна, вылепленная торговлей, правом и суровыми уроками религиозной войны.\n\nВестфалия стоит на распутье. Она может встать за переворотное начало, по которому всякое государство, великое или малое, обладает равным суверенитетом и правом самому определять своё исповедание, — то самое начало, что однажды будет носить её имя. Или она может опереться на свою древнюю и небывалую судебную власть, фемические суды Красной земли, и наводить порядок тяжестью имперского закона.\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_wes.1.a: "Cuius regio, eius religio: суверенитет для всех"
 nd_wes.1.b: "Красная земля помнит императорское правосудие"
 STATIC_MODIFIER_NAME_nd_wes_peace_congress_diplomacy: "Конгрессная дипломатия"
 STATIC_MODIFIER_DESC_nd_wes_peace_congress_diplomacy: "Обычай мира через дипломатический конгресс, когда споры между суверенными государствами разрешают переговорами собравшихся посланников, а не на поле боя."
 STATIC_MODIFIER_NAME_nd_wes_peace_congress_tolerance: "Религиозное сосуществование"
 STATIC_MODIFIER_DESC_nd_wes_peace_congress_tolerance: "Порука исповедных прав: католические, лютеранские и кальвинистские общины могут свободно держаться своей веры, и ни один князь не вправе принуждать к переходу подданных признанного исповедания."
 nd_wes.2.t: "Вестфальский мир"
 nd_wes.2.d: "После десятилетий разорения, унёсшего миллионы жизней и обезлюдившего целые края, воюющие державы Европы собрались в наших городах Мюнстере и Оснабрюке. Переговоры тянулись годами и свели больше сотни посольств, но договоры наконец скреплены.\n\nВестфальский мир кладёт начала, которые переустроят мир: суверенное равенство государств, право каждого князя определять веру своей державы и разрешение споров дипломатическим конгрессом, а не крестовым походом. Наши города дали имя новому порядку.\n\nКак нам почтить наследие этого мира?"
 nd_wes.2.a: "Отстаивать конгрессный порядок в дипломатии"
 nd_wes.2.b: "Закрепить права всех исповеданий"
 STATIC_MODIFIER_NAME_nd_wes_napoleonic_reform: "Кодекс Наполеона"
 STATIC_MODIFIER_DESC_nd_wes_napoleonic_reform: "Кодекс Наполеона смёл феодальные привилегии, отменил крепостное состояние и утвердил равенство перед законом. Вестфалия становится первым германским государством с современной писаной конституцией."
 nd_wes.3.t: "Кодекс Наполеона в Вестфалии"
 nd_wes.3.d: "Для Вестфалии занимается новая пора. Феодальный строй, правивший этими землями веками, разбирают по частям. Провозглашена писаная конституция — первая в каком-либо германском государстве, — устанавливающая единое управление, выборное собрание и переворотное начало равенства перед законом.\n\nКрепостное состояние отменено. Цехи теряют свои монополии. Впервые иудеи получают полное правовое равенство. Кодекс Наполеона заменяет лоскутное одеяло местных обычаев и привилегий единым разумным сводом. Уцелеют ли эти преобразования, зависит от того, что будет дальше, но прежней Вестфалия уже не станет."
 nd_wes.3.a: "Старый порядок уступает разуму"
 nd_wes_formed_tt: "Вестфалия образована"
 nd_wes_path_a_tt: "Вестфалия держится суверенного равенства"
 nd_wes_path_b_tt: "Вестфалия хранит правосудие Красной земли"
 nd_wes_hellweg_salt_trade: "Соляная торговля Хелльвега"
 nd_wes_hellweg_salt_trade_desc: "Природные соляные источники вдоль Хелльвега, древнего торгового пути с запада на восток через Вестфалию, с античности кормят цветущий соляной промысел. Такие города, как Зуст, Унна, Верль и Зальцкоттен, разбогатели, выпаривая рассол в белое золото, которым солили рыбу, вялили мясо и питали ганзейскую торговлю."
 nd_wes_vehmic_courts: "Фемические суды"
 nd_wes_vehmic_courts_desc: "Фемгерихты Вестфалии — судебное установление особого рода: тайные трибуналы судей из мирян, уполномоченных самим императором выносить смертные приговоры. Действуя из Дортмунда и по всей Красной земле, эти суды наводят порядок там, где обычное правосудие бессильно, а их приговоры исполняют связанные клятвой фрайшёффены, которые вправе преследовать осуждённого по всей Империи."
 nd_wes_soest_municipal_law: "Зустское городское право"
 nd_wes_soest_municipal_law_desc: "Зустское городское уложение, одно из самых ранних и влиятельных в средневековой Германии, послужило образцом для десятков городов Империи. Его положения о городском самоуправлении, рыночном уставе и судопроизводстве сделали вестфальские города средоточиями правового творчества."
 nd_wes_dortmund_market_rights: "Рыночные права Дортмунда"
 nd_wes_dortmund_market_rights_desc: "Положение вольного имперского города и рыночные привилегии сделали Дортмунд важнейшим ганзейским городом Вестфалии. Его ратуша служила местом городского управления и торгового третейского суда — образцом городского самоуправления, которому подражали по всему краю."
 nd_wes_hanseatic_commerce: "Ганзейская торговля"
 nd_wes_hanseatic_commerce_desc: "Дортмунд и Зуст — среди важнейших ганзейских городов Вестфалии. Их купцы торгуют солью, металлическими изделиями и сукном по пути Хелльвега и через ганзейские сети, что тянутся от Новгорода до Лондона, принося богатство и связи с миром в самое сердце Вестфалии."
 nd_wes_freischoffen_tradition: "Традиция фрайшёффенов"
 nd_wes_freischoffen_tradition_desc: "Свободные судьи фемических судов набираются из свободных людей Вестфалии и связаны священной клятвой блюсти императорское правосудие. Их воинская выучка и непреклонная преданность порядку делают из них грозное городское ополчение: воинов, что сражаются не за жалованье, а за закон."
 nd_wes_hellweg_infrastructure: "Дороги Хелльвега"
 nd_wes_hellweg_infrastructure_desc: "Хелльвег, пересекающий Вестфалию от Дуйсбурга до Падерборна, — один из древнейших и важнейших торговых путей Германии. Вложения в починку дорог, постройку мостов и путевые станции обращают его из средневековой тропы в настоящую торговую дорогу."
 nd_wes_circle_assembly: "Окружное собрание"
 nd_wes_circle_assembly_desc: "Нижнерейнско-Вестфальский имперский округ, один из округов, учреждённых реформами Максимилиана I в 1512 году, даёт место для совместного управления. Его собрания согласуют подати, военные взносы и разрешение споров между разноликими светскими и духовными владениями округа."
 nd_wes_sauerland_ironworks: "Зауэрландские железоделательные заводы"
 nd_wes_sauerland_ironworks_desc: "Горы Зауэрланда на юге Вестфалии богаты железной рудой, лесами для древесного угля и быстрыми ручьями для водяной силы. Домны на древесном угле и водяные молоты дают оружие, орудия труда и металлические изделия, которыми снабжаются рынки всей Империи."
 nd_wes_soest_feud_legacy: "Наследие Зустской распри"
 nd_wes_soest_feud_legacy_desc: "Зустская распря 1444–1449 годов, когда богатейший город Вестфалии бросил вызов архиепископу Кёльнскому и выдержал пятилетнюю осаду, показала, что вестфальские города будут яростно драться за свою самостоятельность. Наследие того упрямого сопротивления определяет вестфальские оборонительные обычаи."
 nd_wes_kreistruppen_obligation: "Обязанность крайструппен"
 nd_wes_kreistruppen_obligation_desc: "Нижнерейнско-Вестфальский округ обязан выставлять войсковые отряды в имперскую армию. Эти крайструппен, набираемые из светских и духовных владений под надзором окружных полковников, дают выученную оборонительную пехоту для защиты границ и имперских походов."
 nd_wes_westphalian_printing: "Вестфальское книгопечатание"
 nd_wes_westphalian_printing_desc: "Печатный станок быстро расходится по городам Вестфалии, выпуская богословские трактаты, правовые толкования и торговую переписку. Мюнстер, Кёльн и Дортмунд становятся местными средоточиями печатной культуры, ускоряя распространение грамотности и учёности."
 nd_wes_sauerland_arms_trade: "Оружейная торговля Зауэрланда"
 nd_wes_sauerland_arms_trade_desc: "Железные кузницы Зауэрланда снабжают не только своих: они питают растущий вывоз огнестрельного оружия. Вестфальская работа по металлу приобретает славу качественной и соперничает с оружейными Нюрнберга и Льежа.\n\n#italic Доступно в: $nd_wes_sauerland_forge$#!"
 nd_wes_peace_of_westphalia: "Вестфальский мир"
 nd_wes_peace_of_westphalia_desc: "Вестфальский мир, подписанный в Мюнстере и Оснабрюке в 1648 году, окончил Тридцатилетнюю войну и положил начала суверенной государственности и веротерпимости, которые определяют международные отношения и поныне. Вестфалия дала имя новому мировому порядку."
 nd_wes_linen_industry: "Вестфальское полотняное дело"
 nd_wes_linen_industry_desc: "Восточная Вестфалия с средоточием в Билефельде и Оснабрюке вырастает в один из первейших полотняных краёв Германии. Сельские ткачи-надомники обращают выращенный поблизости лён в полотно, которое вестфальские купцы вывозят в Нидерланды, Англию и дальше."
 nd_wes_confessional_balance: "Конфессиональное равновесие"
 nd_wes_confessional_balance_desc: "Религиозное устроение после разорения Тридцатилетней войны кладёт хрупкое равновесие между католическими и протестантскими общинами Вестфалии, где смешанное население требует делового сосуществования, а не принудительного единообразия."
 nd_wes_imperial_circle_defense: "Оборона имперского округа"
 nd_wes_imperial_circle_defense_desc: "Нижнерейнско-Вестфальский округ согласует общую оборону через строительство укреплений, гарнизонные повинности и совместные учения. Взносы округа усиливают пограничную оборону и поддерживают имперские походы против внешних угроз."
 nd_wes_line_infantry_reform: "Вестфальская линейная пехота"
 nd_wes_line_infantry_reform_desc: "Французские военные преобразования обращают вестфальские силы в современные линейные пехотные полки, обученные новейшим тактическим уставам и вооружённые единообразным оружием. Эти кадровые солдаты — решительный разрыв со старыми ополченскими обычаями."
 nd_wes_constitutional_experiments: "Конституционные опыты"
 nd_wes_constitutional_experiments_desc: "Вестфалия становится лабораторией конституционного правления, испытывая писаные конституции, представительные собрания и упорядочение управления, что предвещают общегерманское конституционное движение."
 nd_wes_textile_expansion: "Рост текстильного дела"
 nd_wes_textile_expansion_desc: "Вестфальское полотняное дело вырастает из надомного промысла в устроенную мануфактуру, где купцы направляют сети сельских прях и ткачей. Белильные поля Билефельда готовят сукно для вывоза по всей Европе.\n\n#italic Доступно в: $nd_wes_linen_house$#!"
 nd_wes_napoleonic_code: "Наполеоновский кодекс"
 nd_wes_napoleonic_code_desc: "Введение Кодекса Наполеона в Вестфальском королевстве упраздняет феодальные привилегии, утверждает равенство перед законом и создаёт первую современную конституцию в истории Германии. Эти преобразования, пусть и наложенные извне, оставляют неизгладимый след в вестфальском праве и управлении."
 nd_wes_industrial_awakening: "Промышленное пробуждение"
 nd_wes_industrial_awakening_desc: "Переход от водяных кузниц к паровым заводам преображает вестфальское хозяйство. Металлообрабатывающая традиция Зауэрланда и угольные залежи Рура вместе создают один из самых ранних промышленных краёв Германии.\n\n#italic Доступно в: $nd_wes_sauerland_forge$#!"
 nd_wes_sovereign_equality: "Суверенное равенство"
 nd_wes_sovereign_equality_desc: "Вестфальское начало суверенного равенства — что всякое государство, каким бы малым или слабым оно ни было, обладает прирождённым правом на самоуправление, — вызревает из дипломатической уловки в основополагающее учение международного права."
 nd_wes_civic_emancipation: "Гражданское равноправие"
 nd_wes_civic_emancipation_desc: "Наследие наполеоновских преобразований приносит плоды: городские жители Вестфалии получают новые свободы — отмену цеховых монополий, правовое равенство независимо от веры и рождение современного гражданского общества из остатков феодальной повинности."
 nd_wes_hellweg_saltworks: "Солеварни Хелльвега"
 nd_wes_hellweg_saltworks_desc: "Заведения для выпаривания рассола вдоль торгового пути Хелльвег, где природные соляные источники отводят в градирни и варницы, чтобы получать соль на продажу."
 nd_wes_vehmic_tribunal: "Фемический трибунал"
 nd_wes_vehmic_tribunal_desc: "Зал трибунала фемгерихта, где свободные судьи императора вершат суд под клятвой молчания, вынося смертные приговоры именем имперской власти на Красной земле Вестфалии."
 nd_wes_hanseatic_kontor: "Ганзейская контора"
 nd_wes_hanseatic_kontor_desc: "Вестфальский купеческий дом ганзейского обычая, где торговцы из Дортмунда и Зуста хранят товар, заключают договоры и поддерживают торговые связи, соединяющие Хелльвег с ганзейским миром."
 nd_wes_sauerland_forge: "Зауэрландская кузница"
 nd_wes_sauerland_forge_desc: "Железная кузница на древесном угле в горах Зауэрланда, где водяные мехи и хвостовые молоты плавят руду и дают оружие, орудия труда и металлические изделия из богатых вестфальских залежей."
 nd_wes_linen_house: "Полотняный двор"
 nd_wes_linen_house_desc: "Вестфальская ткацкая мастерская, где выращенный поблизости лён прядут, ткут и белят в полотно: основа раздаточной протопромышленной системы с средоточием в Билефельде."
 nd_wes_rathaus: "Вестфальская ратуша"
 nd_wes_rathaus_desc: "Городская ратуша в величавом вестфальском духе, средоточие городского самоуправления, где выборные советы бюргеров вершат суд, надзирают за рынками и ведут дела гордых самостоятельных торговых городов."
 nd_wes_pm_brine_evaporation: "Выпаривание рассола"
 nd_wes_pm_brine_evaporation_desc: "Природный рассол вестфальских соляных источников греют в варницах на местном лесе, а выложенные камнем выпарные чаны дают кристаллическую соль для ганзейской торговли."
 nd_wes_pm_saltworks_maintenance: "Содержание солеварни"
 nd_wes_pm_saltworks_maintenance_desc: "Содержание градирен, варниц и рассольных желобов хелльвегских солеварен."
 nd_wes_pm_tribunal_maintenance: "Содержание трибунала"
 nd_wes_pm_tribunal_maintenance_desc: "Содержание записей, печатей и исполнительного аппарата фемического судопроизводства."
 nd_wes_pm_kontor_maintenance: "Содержание конторы"
 nd_wes_pm_kontor_maintenance_desc: "Содержание складов, счётных книг и торгового хозяйства ганзейской конторы."
 nd_wes_pm_charcoal_smelting: "Выплавка на древесном угле"
 nd_wes_pm_charcoal_smelting_desc: "Железную руду с холмов Зауэрланда плавят в домнах на древесном угле и куют в оружие и орудия труда водяными молотами."
 nd_wes_pm_industrial_steel: "Промышленная сталь"
 nd_wes_pm_industrial_steel_desc: "Переход к коксовым печам и бессемеровским конвертерам позволяет выпускать сталь в большом количестве, обращая Зауэрланд из края старинного железоделания в средоточие современной тяжёлой промышленности."
 nd_wes_pm_forge_maintenance: "Содержание кузницы"
 nd_wes_pm_forge_maintenance_desc: "Содержание печей, водяных колёс и молотовых зауэрландских железных кузниц."
 nd_wes_pm_linen_weaving: "Полотняное ткачество"
 nd_wes_pm_linen_weaving_desc: "Выращенный поблизости лён прядут в нить и ткут в полотно на ручных станках, а затем белят на знаменитых билефельдских белильнях."
 nd_wes_pm_linen_maintenance: "Содержание полотняного двора"
 nd_wes_pm_linen_maintenance_desc: "Содержание станков, белилен и прядильного снаряжения вестфальских полотняных мастерских."
 nd_wes_pm_rathaus_maintenance: "Содержание ратуши"
 nd_wes_pm_rathaus_maintenance_desc: "Содержание городских записей, палат совета и управленческого хозяйства вестфальской ратуши."
 a_nd_wes_kreistruppen: "Крайструппен"
 a_nd_wes_kreistruppen_desc: "Выученная пехота Нижнерейнско-Вестфальского округа, набранная из светских и духовных владений во исполнение обязательных военных повинностей округа перед имперской армией. Обучена обороне границ и крепостной службе."
 a_nd_wes_freischoffen: "Стража фрайшёффенов"
 a_nd_wes_freischoffen_desc: "Городское ополчение из свободных судей фемических судов, связанных клятвой вестфальцев, что служат исполнителями императорского правосудия. Их выучка и решимость отражают фемическую традицию непреклонной власти."
 a_nd_wes_line_regiment: "Вестфальский линейный полк"
 a_nd_wes_line_regiment_desc: "Кадровая линейная пехота, обученная по современному тактическому уставу, с единообразными мушкетами и штыками. Вестфальская линия — это превращение феодального ополчения в выученное постоянное войско."
 levy_nd_wes_freischoffen: "Стража фрайшёффенов"
 levy_nd_wes_freischoffen_desc: "Городское ополчение связанных клятвой свободных судей, набираемое из бюргеров и служилых людей Вестфалии, чтобы обеспечивать власть фемических судов."
 levy_nd_wes_kreistruppen: "Крайструппен"
 levy_nd_wes_kreistruppen_desc: "Окружная ополченская пехота, набираемая из вестфальских владений во исполнение военных повинностей Нижнерейнско-Вестфальского округа перед имперской армией."
 nd_wes_destiny: "Судьба Вестфалии"
 nd_wes_destiny_desc: "Вестфалия поднялась. Земли между Рейном и Везером объединены, и впереди простирается будущее. Пером дипломатии или мечом правосудия — наша судьба ждёт."
 nd_wes_dest_congress: "Конгресс наций"
 nd_wes_dest_congress_desc: "Сделать Вестфалию средоточием международной торговли и дипломатии. Взять под свою руку торговые сети Амстердама и принять те денежные учреждения, что оплатят наш замысел суверенного равенства народов."
 nd_wes_dest_balance: "Равновесие сил"
 nd_wes_dest_balance_desc: "Вестфальскому порядку нужны не только начала, но и сила, чтобы их поддержать. Распространите наше влияние на Гаагу, приумножьте казну и отстройте Мюнстер в город, достойный принимать послов всех корон."
 nd_wes_dest_eternal_peace: "Вечный мир"
 nd_wes_dest_eternal_peace_desc: "Высшее выражение вестфальского суверенитета: мировой порядок, где споры решает разум, а не сила. Дотянитесь до Женевы, заключите Вестфальский мир и постройте учреждения долгого мира."
 nd_wes_dest_vehme: "Возвышение фемы"
 nd_wes_dest_vehme_desc: "Фемические суды Красной земли дотянутся дальше. Приведите Кёльн и Кассель под нашу власть, доказав, что императорское правосудие не знает границ. Держите устойчивость, пока мы расширяем свою подсудность."
 nd_wes_dest_landfriede: "Вечный земский мир"
 nd_wes_dest_landfriede_desc: "Ландфриден, клятвенный земский мир, требует принуждения. Возьмите Франкфурт, место императорских коронаций, и Брауншвейг на востоке. Пусть заседает собрание округа, и постройте войско, способное навести порядок по германским землям."
 nd_wes_dest_reichsgericht: "Имперский суд"
 nd_wes_dest_reichsgericht_desc: "Правосудие Красной земли дотянется от Северного моря до Альп. Возьмите Магдебург и Нюрнберг, великие имперские города, и учредите верховный трибунал, чтобы править германской нацией законом, за которым стоит сила."
 nd_wes.4.t: "Судьба Вестфалии"
 nd_wes.4.d: "Вестфалия едина, её народ благоденствует, её границы надёжны. Но одно единство — ещё не судьба. Мир смотрит, чем Вестфалия станет: маяком суверенного равенства, что переустроит международный порядок, или крепостью имперского правосудия, что наложит закон на разноголосицу соперничающих государств.\n\nПуть избран. Теперь надо им пройти."
 nd_wes.4.a: "Наша судьба ждёт"
 nd_wes.5.t: "Конгресс собирается"
 nd_wes.5.d: "Великие торговые дома Амстердама подчиняются теперь вестфальской власти. Купеческие князья рейнской дельты, банкиры, оплачивающие войны королей, — все признают наше верховенство. С такой торговой силой в руках Вестфалия может созвать конгресс народов не сторонним наблюдателем, а державой, чьё слово весомо, как золото.\n\nПервый конгресс вестфальской дипломатии положит начало новому международному порядку."
 nd_wes.5.a: "Пусть народы займут свои места"
 nd_wes.6.t: "Красная земля ширится"
 nd_wes.6.d: "Великий собор Кёльна стоит теперь в пределах нашей подсудности. Древние притязания архиепископа на верховенство над Вестфалией угасли: правосудие в этих землях вершат фемические суды, а не епископская кафедра. В Касселе гессенские владетели склоняются перед вестфальским законом.\n\nСудьи в капюшонах фемгерихта ездят дальше, чем когда-либо прежде. Куда они приезжают, туда приходит порядок."
 nd_wes.6.a: "Императорское правосудие достаёт далеко"
 nd_wes.7.t: "Равновесие сил"
 nd_wes.7.d: "Из Гааги дипломаты Вестфалии выстраивают хрупкое равновесие между державами Европы. Казна наша полна, земли обустроены, учреждения зрелы. Вопрос теперь в том, как этим положением распорядиться.\n\nУчредить ли постоянные суды международного третейского разбирательства, где споры суверенных государств решаются разумом и законом? Или держаться вооружённого нейтралитета, наращивая казну, что сделает Вестфалию незаменимой для всякого воюющего, пока наши собственные войска пребывают в мире?"
 nd_wes.7.a: "Учредить суды международного третейского разбирательства"
 nd_wes.7.b: "Держаться прибыльного нейтралитета"
 nd_wes.8.t: "Вечный земский мир"
 nd_wes.8.d: "Франкфурт и Брауншвейг покорились вестфальской власти. Ландфриден — клятвенный земский мир Империи — больше не чаяние, а действительность, обеспеченная вестфальским оружием. Наше войско идёт туда, куда велят фемические суды, и ни один владетель не смеет нарушить мир.\n\nНо принуждение требует устройства. Свести ли власть к короне, правя железным указом? Или свести имперские округа в общую оборону, земское ополчение, что наводит порядок общей повинностью?"
 nd_wes.8.a: "Править железным указом короны"
 nd_wes.8.b: "Свести округа в общее ополчение"
 nd_wes.9.t: "Вечный мир"
 nd_wes.9.d: "Женева в пределах досягаемости. Научная революция отворила умы разуму. Вестфалия стоит на вершине своей дипломатической мощи, самим воплощением начала, носящего её имя: суверенного равенства всех государств, великих и малых.\n\nЗал мира ждёт своего назначения. Станет ли он святилищем всеобщих прав человека, где достоинство всякого подданного признано независимо от рождения и исповедания? Или станет двигателем порядка свободной торговли, где товары народов текут беспрепятственно, а богатство обеспечивает тот мир, которого не добиться войсками?"
 nd_wes.9.a: "Провозгласить всеобщие права всех людей"
 nd_wes.9.b: "Построить порядок свободной торговли между суверенными народами"
 nd_wes.10.t: "Имперский суд"
 nd_wes.10.d: "Магдебург и Нюрнберг склоняются перед вестфальской властью. От Северного моря до сердца Империи правит правосудие Красной земли. Ни один князь не перечит трибуналу, ни один разбойник не уходит от судей в капюшонах, ни один мятеж не остаётся без кары.\n\nВерховному суду державы предстоит выбрать своё лицо. Служить ли ему орудием имперского порядка, забрасывая войска, чтобы принуждать к миру? Или стать народным судом, вбирая завоёванные земли законом и правосудием, а не гарнизоном и мечом?"
 nd_wes.10.a: "Трибунал служит имперскому порядку"
 nd_wes.10.b: "Пусть суд служит народному правосудию"
 STATIC_MODIFIER_NAME_nd_wes_dest_arbitration: "Третейский суд"
 STATIC_MODIFIER_DESC_nd_wes_dest_arbitration: "Вестфальский третейский суд разбирает споры суверенных государств, разрешая их правовым рассуждением, а не силой. Его решения имеют нравственный вес по всей Европе."
 STATIC_MODIFIER_NAME_nd_wes_dest_neutrality: "Вооружённый нейтралитет"
 STATIC_MODIFIER_DESC_nd_wes_dest_neutrality: "Вестфалия держится прибыльного нейтралитета, оплачивая чужие войны и сохраняя свои войска в мире. Меньшая усталость от войны и более дешёвые займы возмещают расходы на поддержание готовности."
 STATIC_MODIFIER_NAME_nd_wes_dest_universal_rights: "Всеобщие права"
 STATIC_MODIFIER_DESC_nd_wes_dest_universal_rights: "Вестфальская декларация всеобщих прав признаёт прирождённое достоинство всякого подданного независимо от рождения, исповедания и народности. При новом порядке развитие цветёт, хотя население и благодушествует в своём достатке."
 STATIC_MODIFIER_NAME_nd_wes_dest_free_trade_order: "Порядок свободной торговли"
 STATIC_MODIFIER_DESC_nd_wes_dest_free_trade_order: "Вестфальский порядок свободной торговли отворяет рынки через суверенные границы, обогащая всех участников беспрепятственной торговлей. Военное устройство сжимается, ибо торговля заменяет завоевание."
 STATIC_MODIFIER_NAME_nd_wes_dest_iron_law: "Железный закон"
 STATIC_MODIFIER_DESC_nd_wes_dest_iron_law: "Железный указ вестфальской короны не терпит прекословия. Сосредоточенная власть и бдительная тайная полиция обеспечивают порядок по всей державе, хотя надзорный аппарат разрастается всё больше."
 STATIC_MODIFIER_NAME_nd_wes_dest_circle_militia: "Окружное ополчение"
 STATIC_MODIFIER_DESC_nd_wes_dest_circle_militia: "Имперские округа сведены в общую оборонительную силу, и каждое владение даёт войска и припасы. Быстрый набор и надёжное снабжение достаются ценою воинской славы."
 STATIC_MODIFIER_NAME_nd_wes_dest_imperial_order: "Имперский порядок"
 STATIC_MODIFIER_DESC_nd_wes_dest_imperial_order: "Вестфальский трибунал забрасывает войска, чтобы принуждать к имперскому миру. Превосходная тактика и право вести справедливую войну делают армии державы грозным орудием порядка."
 STATIC_MODIFIER_NAME_nd_wes_dest_peoples_court: "Народное правосудие"
 STATIC_MODIFIER_DESC_nd_wes_dest_peoples_court: "Вестфальский народный суд вбирает завоёванные земли справедливым применением закона, а не военным занятием. Разорённые края под праведным правлением оправляются быстрее, а иноземные подданные принимают вестфальскую власть."
 nd_wes_friedenssaal: "Фриденссааль"
 nd_wes_friedenssaal_desc: "Зал мира по образцу палаты в ратуше Мюнстера, где был подписан Вестфальский мир. Средоточие дипломатического посредничества и международного третейского разбирательства, где начало суверенного равенства обретает плоть в камне, стекле и пергаменте."
 nd_wes_pm_friedenssaal_maintenance: "Содержание зала мира"
 nd_wes_pm_friedenssaal_maintenance_desc: "Содержание дипломатических архивов, залов заседаний и парадного убранства Фриденссааля."
 nd_wes_high_court: "Вестфальский высший суд"
 nd_wes_high_court_desc: "Верховный трибунал вестфальского правосудия, наследник древней фемической традиции, но действующий с имперским размахом. Судьи в мантиях вершат закон державы из укреплённого судебного дома, опираясь на вооружённых приставов и обширный архив прецедентов."
 nd_wes_pm_high_court_maintenance: "Содержание высшего суда"
 nd_wes_pm_high_court_maintenance_desc: "Содержание судебных архивов, залов заседаний и исполнительного аппарата Вестфальского высшего суда."
 AUTO_MODIFIER_NAME_nd_wes_bureaucracy_authority: "Вестфальская институциональная власть"
 AUTO_MODIFIER_DESC_nd_wes_bureaucracy_authority: "Сеть соборных капитулов Вестфалии, сопредседательств в имперском округе, ганзейских кварталов и фемических свободных судов способна содержать настоящие ведомства: с самого образования Вестфалии государство может держать три бюрократии на свой выбор."
 wes_reichskreis_bureaucracy: "Вестфальский имперский округ"
 wes_reichskreis_bureaucracy_desc: "Вестфальский имперский округ, учреждённый рейхстагскими реформами 1500 и 1512 годов, один из десяти областных крайсов, что согласовывали оборону, приводили в исполнение имперский закон и раскладывали военную подать Römermonate по владениям-участникам. Под сопредседательством епископа Мюнстерского и герцога Клеве-Юлихского крайстаг вводил областные сборы, устанавливал монетное дело и блюл ландфриден, а после 1648 года стал механизмом Friedensvollzug, исполнявшим земельные и исповедные статьи Вестфальского мира."
 wes_femgericht_bureaucracy: "Фемгерихт"
 wes_femgericht_bureaucracy_desc: "Фемические свободные суды, чьи тайные трибуналы заседали у Freistühle Дортмунда, Арнсберга и Фольмарштайна и достигли вершины между 1300 и 1500 годами. Действуя под именной властью архиепископа Кёльнского как герцога Вестфалии, фемгерихт вызывал обвиняемых запечатанной грамотой и приводил приговоры в исполнение — почти всегда через повешение — руками фронботов по всей Империи. Свободные судьи, связанные клятвой молчания под страхом смерти, набирались из присяжных свободных людей, а не из земельного дворянства, что делало фему параллельным правосудием в обход вотчинных судов вестфальской знати."
 wes_domkapitel_bureaucracy: "Соборные капитулы"
 wes_domkapitel_bureaucracy_desc: "Соборные капитулы Мюнстера, Падерборна и Оснабрюка, избиравшие князей-епископов Вестфалии из имперского рыцарства. Каноникат требовал Ahnenprobe — доказательства шестнадцати благородных предков, — что делало каждый капитул закрытым дворянским заповедником. Капитулы составляли избирательные капитуляции, связывавшие всякого нового князя-епископа, а через своеобразный патрициат мюнстерских Erbmänner срастили земельную церковь с городским собранием, породив свойственное Вестфалии дворянско-бюргерское правление."
 wes_hansedrittel_bureaucracy: "Вестфальская треть Ганзы"
 wes_hansedrittel_bureaucracy_desc: "Вестфальская треть Ганзейского союза, одна из трёх голосующих tertiae на ганзетаге, включавшая Дортмунд, Зуст, Мюнстер, Липпштадт, Оснабрюк и участников с Мааса и Нижнего Рейна. Эта треть согласовывала пошлины на Хелльвеге, вела конторы в Бергене и Брюгге через назначаемых альтерманов, отстаивала городские вольности против земельных князей и наказывала города-участники через Verhansung — временное исключение из союза. Под началом Зуста она господствовала во внутренней торговле солью и зерном, пока Тридцатилетняя война не разорвала её торговую сеть."
 wes_markgenossenschaft_bureaucracy: "Марковое товарищество"
 wes_markgenossenschaft_bureaucracy_desc: "Вестфальские общинные собрания, ведавшие лесом, пастбищем, торфом и водами через присяжные крестьянские советы по писаным Markenrechte под председательством Holzgrafen на маркдингах. Вместе со своеобразным держанием Eigenbehörige — когда крестьянин лично привязан к поместью, но держит наследуемый надел и имеет весомый общинный голос — марковое товарищество давало вестфальским селянам больше защищённости, чем когда-либо знали крепостные заэльбского Gutsherrschaft, и пережило всякую земельную реформу вплоть до разделов общинных угодий в девятнадцатом веке."
