l_russian:
 TGD: "Тан"
 TGD_ADJ: "танский"
 TGD_f: "Великая Тан"
 TGD_f_desc: "Династия Тан была космополитическим золотым веком Китая, когда Великий шёлковый путь шёл через Чанъань, а китайская мощь простиралась вглубь Средней Азии. Хотя династия пала в 907 году, память о ней осталась заветным образцом китайской империи — державы, определяемой не стенами, а дорогами, где буддийские монахи, согдийские купцы и тюркские полководцы равно служили под драконьим знаменем. Возродить Великую Тан — значит воссоединить китайские коренные земли с западным коридором и вернуть себе власть над Шёлковым путём."
