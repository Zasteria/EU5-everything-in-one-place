l_russian:
 rule_nd_bureaucracies_rule: "Бюрократические механизмы National Destinies"
 setting_nd_bureaucracies_enabled: "Включено"
 setting_nd_bureaucracies_enabled_desc: "Каждая образуемая страна получает при образовании от 4 до 8 исторических учреждений: [bureaucracies|e] с ползунком финансирования и ячейки, чтобы держать часть из них одновременно. Доступны и улучшения, реформы и закон, которые мод для них добавляет."
 setting_nd_bureaucracies_disabled: "Отключено"
 setting_nd_bureaucracies_disabled_desc: "Учреждения образуемых стран и их ячейки не появляются, как и улучшения, реформы и закон, которые мод для них добавляет. Собственные [bureaucracies|e] игры не меняются."
