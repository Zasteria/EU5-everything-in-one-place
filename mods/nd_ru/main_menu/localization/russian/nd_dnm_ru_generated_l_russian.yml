 nd_dnm.1.a_tt: "Облик при основании: Antemurale Christianitatis, оплот христианского мира. Сильные военные бонусы и рост уважения; цена — действенность двора."
 nd_dnm.1.b_tt: "Облик при основании: Gesamtmonarchie, централизованная всецелая монархия. Сильные управленческие и податные бонусы; цена — дипломатическая репутация."
 nd_dnm.2.a_tt: "Остриё границы: линия граничар, обращённая вовне, против османов"
 nd_dnm.2.b_tt: "Щит границы: Militaergrenze, заселённая вглубь и кормящая себя сама"
 nd_dnm.3.a_tt: "Verneuerte Landesordnung: окатоличить Богемию имперским патентом"
 nd_dnm.3.b_tt: "Верная аристократия: связать новое служилое дворянство конфискованными поместьями Белой Горы"
 nd_dnm.4.a_tt: "Прагматическая санкция: габсбургские земли сделаны одним неразлучным наследством"
 nd_dnm.5.a_tt: "Терезианская машина: камералистская реформа, обложенное и вымуштрованное государство"
 nd_dnm.5.b_tt: "Иосифинский размах: просвещённая реформа, Патент о веротерпимости и единая бюрократия"
 nd_dnm.6.a_tt: "Открыть древо судьбы: принять стратегические задачи дунайской короны"
 nd_dnm.7.a_tt: "Линия Савы, Дравы и Дуная удержана; начинается пограничный поход"
 nd_dnm.8.a_tt: "Сокрушитель стен: балканский поход идёт на укреплённые османские города"
 nd_dnm.8.b_tt: "Волна граничар: Военная граница катится на юг заселяемой волной"
 nd_dnm.9.a_tt: "Меч христианского мира: Восточный крестовый поход отстраивает христианский восток под рукой Вены"
 nd_dnm.9.b_tt: "Завоевательное войско: возвращение Балкан как чистое военное завоевание"
 nd_dnm.10.a_tt: "Заложить камералистское основание: Гофкаммер становится хребтом державы"
 nd_dnm.11.a_tt: "Коронный фиск: казначейство правит государством, золото и подати превыше всего"
 nd_dnm.11.b_tt: "Дунайский рынок: держава становится речной торговой империей"
 nd_dnm.12.a_tt: "Камералистская рука: довольство сословий связано с управленческим контролем"
 nd_dnm.12.b_tt: "Просвещённое государство: грамотность и размах учреждений по всем народам"
 nd_dnm.49.a_tt: "Иосифинское торжество признано: реформу «Единый патент» можно провести"
 nd_dnm.50.a_tt: "«Сословия устоят» признано: реформу «Сейм в совете» можно провести"
 nd_dnm.13.a_tt: "Кризис признан; империя входит в бурю"
 nd_dnm.14.a_tt: "Подавить непокорный сейм силой: даёт время, но не решает"
 nd_dnm.14.b_tt: "Уступить самостоятельность: путь раскола"
 nd_dnm.15.a_tt: "Принять компромисс: Аусглейх, Австро-Венгрия; кризис завершается"
 nd_dnm.15.b_tt: "Отвергнуть компромисс: кризис продолжается"
 nd_dnm.16.a_tt: "Раздавить национальные лиги: восстановление централизованной власти; кризис завершается"
 nd_dnm.16.b_tt: "Ещё не время: подождать более крепкого контроля, прежде чем бить"
 nd_dnm.17.a_tt: "Даёт модификатор «Австро-Венгрия»: двуединая монархия по согласию"
 nd_dnm.18.a_tt: "Даёт модификатор «Единое государство»: крепкая центральная власть при долгом озлоблении"
 nd_dnm.19.a_tt: "Одна из корон-составляющих отпускается как суверенное королевство; тяжёлый удар по стабильности"
 nd_dnm.20.a_tt: "Начинается война за наследство; стервятники двигают свои притязания на державу"
 nd_dnm.21.a_tt: "Санкция устояла: даёт модификатор Indivisibiliter ac Inseparabiliter, всякая корона-составляющая, ещё удерживаемая как вассал или младший партнёр унии, вваривается в державу целиком (её земли становятся своими и присоединяются), а имперские её земли выходят из [GetUniqueInternationalOrganization('hre').GetName]"
 nd_dnm.22.a_tt: "Санкция сломалась крахом: тяжёлый удар по стабильности и штрафной модификатор «Сломанная санкция»"
 nd_dnm.22.b_tt: "Санкция уступлена по выбору: лёгкий удар по стабильности и более мягкий модификатор «Уступленная санкция»"
 nd_dnm.23.a_tt: "Сопротивляться оружием: цена в стабильности и -3 к доверию короне; война продолжается"
 nd_dnm.23.b_tt: "Завершает кризис как «Сломанную санкцию», а не доводит войну до конца"
 nd_dnm.25.a_tt: "Принять изгойские годы: цена разрыва с Рейхом"
 nd_dnm.26.a_tt: "Рейх и курия отмечают дунайское государство как отступника"
 nd_dnm.27.a_tt: "Перетерпеть имперский нажим: накладывает малый годичный модификатор нажима; Ответ Рейха длится, пока не выполнен один из трёх выходов"
 nd_dnm.29.a_tt: "Расчёт закрыт. Примирение даёт «Дунайское признание» (а для бывшего курфюрста из Богемии император заполняет опустевшее курфюршеское место); терпение даёт «Дунай устоял»; выходы через силу и законность имеют собственные награды"
 nd_dnm.30.a_tt: "Признаёт открытый вопрос. Даёт модификатор «Открытый вопрос» (бессрочно, пока не кончится кризис наследования)"
 nd_dnm.31.a_tt: "Сплотить сеймы: снимает «Открытый вопрос», даёт «Сплочение сеймов» (бессрочно) и закладывает +15 к доверию короне, когда начнётся бедствие"
 nd_dnm.31.b_tt: "Королевское молчание: снимает «Открытый вопрос», даёт «Королевское молчание» (бессрочно); счёт доверия короне начинается без подмоги"
 nd_dnm.32.a_tt: "Утвердить патентом сейчас: разовая цена в стабильности, даёт «Составление указа» (бессрочно) и закладывает +25 к доверию короне, когда начнётся бедствие"
 nd_dnm.32.b_tt: "Отложить указ: даёт «Отложенный указ» (бессрочно); счёт доверия короне начинается без подмоги"
 nd_dnm.33.a_tt: "Даёт большую прибавку законности и двадцатилетний модификатор Indivisibiliter ac Inseparabiliter"
 nd_dnm.40.a_tt: "Заплатить 12 месяцев торгового и податного дохода (не менее 100 золота). +15 к доверию короне"
 nd_dnm.40.b_tt: "Заплатить 6 месяцев торгового и податного дохода (не менее 50 золота). +7 к доверию короне"
 nd_dnm.40.c_tt: "Отказаться платить. -3 к доверию короне и малый штраф к довольству дворянства"
 nd_dnm.41.a_tt: "Крупные дипломатические уступки (-2 к дипломатической репутации, -10 к уважению). +12 к доверию короне"
 nd_dnm.41.b_tt: "Малые дипломатические уступки (-1 к дипломатической репутации). +6 к доверию короне"
 nd_dnm.41.c_tt: "Отвергнуть предложение. -3 к доверию короне"
 nd_dnm.42.a_tt: "Раздавить восстание оружием (-12 месяцев людских сил). +12 к доверию короне"
 nd_dnm.42.b_tt: "Договориться об амнистии (4 месяца дохода, не менее 40 золота, и -1 к стабильности). +5 к доверию короне"
 nd_dnm.42.c_tt: "Не заметить восстание. -8 к доверию короне"
 nd_dnm.43.a_tt: "Пышный объезд (8 месяцев дохода, не менее 75 золота). +10 к доверию короне, малая прибавка стабильности"
 nd_dnm.43.b_tt: "Скромный объезд (3 месяца дохода, не менее 25 золота). +5 к доверию короне"
 nd_dnm.43.c_tt: "Остаться в Вене. -2 к доверию короне и малый штраф к довольству дворянства"
 nd_dnm.44.a_tt: "Двинуть войско (-15 месяцев людских сил). +6 к доверию короне: отпадение обращено вспять силой"
 nd_dnm.44.b_tt: "Откупиться от сейма (10 месяцев дохода, не менее 100 золота). +3 к доверию короне"
 nd_dnm.44.c_tt: "Уступить в принципе. -15 к доверию короне и удар по законности"
 nd_dnm.45.a_tt: "Ответить на их посольства тем же: #R -1#! к дипломатической репутации, и доверие короне падает лишь на #Y 2#!"
 nd_dnm.45.b_tt: "Терпеть. -10 к доверию короне"
 nd_dnm.46.a_tt: "+5 к доверию короне, малая прибавка законности: упорство династии даёт плоды"
 nd_dnm.47.a_tt: "-5 к доверию короне, малый штраф к законности: коалиция сжимается"
 nd_dnm.48.a_tt: "Заплатить 8 месяцев торгового и податного дохода (не менее 75 золота). Если Национальный вопрос всё же вспыхнет, нужный для восстановления власти контроль будет ниже на 0,05"
 nd_dnm.48.b_tt: "Ни цены, ни выгоды: если кризис придёт, он придёт в полную силу"
 nd_dnm.1.d.reich: "Свершилось. Наследственные земли, корона святого Вацлава и корона святого Стефана стоят одной державой, и держава эта стоит по-прежнему внутри Священной Римской империи: первейший из князей, связанный имперским правом, и сама императорская корона в досягаемости дома, способного склонить курфюрстов. Рейхстаг смотрит на члена, переросшего Рейх вокруг себя.\n\nНо держава немцев, чехов, мадьяр, хорватов, словаков и ещё дюжины народов — ещё не монархия. Что её свяжет?\n\n#bold Antemurale Christianitatis#! делает Дунай щитом христианского мира: Военная граница, поселения солдат-граничар, нескончаемая война с османами, дающая каждой короне общего врага и общее дело.\n\n#bold Gesamtmonarchie#! делает Дунай одним телом: Гофкаммер, Гофкригсрат, Прагматическая санкция, сваривающие три канцелярии в единое послушное государство.\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_dnm.1.d.no_reich: "Свершилось. Наследственные земли, корона святого Вацлава и корона святого Стефана стоят одной суверенной державой, и на карте не осталось Рейха, у которого пришлось бы спрашивать позволения. Австрия, Богемия и Венгрия подотчётны никакому сейму, кроме нашего двора.\n\nНо держава немцев, чехов, мадьяр, хорватов, словаков и ещё дюжины народов — ещё не монархия. Что её свяжет?\n\n#bold Antemurale Christianitatis#! делает Дунай щитом христианского мира: Военная граница, поселения солдат-граничар, нескончаемая война с османами, дающая каждой короне общего врага и общее дело.\n\n#bold Gesamtmonarchie#! делает Дунай одним телом: Гофкаммер, Гофкригсрат, Прагматическая санкция, сваривающие три канцелярии в единое послушное государство.\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_dnm.52.t: "Вопрос о Рейхе"
 nd_dnm.52.d.emperor: "Три короны — одна держава, и её государь носит императорскую корону. Рейх никогда не держал в себе члена такого размера, и курфюрсты понимают, что это значит: император, чьи собственные земли перевешивают Империю, которой он председательствует.\n\nОткрыты две дороги. Остаться и править Рейхом с Дуная, как правил дом Габсбургов три столетия: королевство по имперскому праву, Прагматическая санкция на милости рейхстага и корона святого Стефана, попрекающая всякую связь с Рейхом. Или сложить корону, вывести Дунай из Империи и не быть подотчётными никакому сейму, кроме собственного двора."
 nd_dnm.52.d.member: "Три короны — одна держава, и держава эта — член Священной Римской империи: больше любого князя, больше самого императора.\n\nОстаться и жить по имперскому праву первейшими из князей, имея императорскую корону в досягаемости дома, способного склонить курфюрстов. Тогда Прагматическую санкцию должен утвердить рейхстаг, а корона святого Стефана будет попрекать всякую связь с Рейхом. Или порвать с Империей: наши имперские земли выйдут из неё вместе с притязанием императора на них, мы примем ранг империи, и Рейх ответит, как сможет."
 nd_dnm.52.d.outsider: "Три короны — одна держава, и две из них держат земли Священной Римской империи, тогда как сама держава стоит вне её.\n\nДвор императора принял бы нас членом: корона святого Стефана вошла бы в Рейх, который всегда отрицала, по имперскому праву, и Санкцию нашу утверждал бы рейхстаг. Или мы удержим Дунай вне Империи: наши имперские земли выйдут из неё вместе с притязанием императора на них, мы примем ранг империи, и Рейх ответит, как сможет."
 nd_dnm.52.d.barred: "Три короны — одна держава, и две из них держат земли Священной Римской империи, тогда как сама держава стоит вне её.\n\nРейх нас не примет: вера курфюрстов не наша, и ворота его закрыты. Значит, Дунай остаётся вне Империи, наши имперские земли выйдут из неё вместе с притязанием императора на них, мы примем ранг империи, и Рейх ответит, как сможет."
 nd_dnm.52.a: "Остаться в Рейхе"
 nd_dnm.52.b: "Порвать с Рейхом"
 nd_dnm.52.a_tt: "Нас удерживает в своём составе или принимает в него [GetUniqueInternationalOrganization('hre').GetName], и живём мы по имперскому праву. Ранг королевства там, где это позволяет правило рангов Империи; императорскую корону можно и завоевать. Устоявшая Прагматическая санкция потребует утверждения рейхстагом, прежде чем короны будут сварены. Корона святого Стефана попрекает Рейх, пока Венгрия стоит подчинённой короной. Порвать с Рейхом можно и позже, той же ценой."
 nd_dnm.52.b_tt: "Всякий наш [location|e] в своём составе теряет [GetUniqueInternationalOrganization('hre').GetName], и [GetUniqueInternationalOrganization('hre').GetLeaderTitle] получает на него национальный район. Мы принимаем ранг империи. Начинается Ответ Рейха. Это необратимо."
 nd_dnm.53.t: "Рейхстаг утверждает Санкцию"
 nd_dnm.53.d: "Рейхстаг поручился за Прагматическую санкцию. Того, что скрепили курфюрсты и сословия Рейха, не оспорит ни одна корона Дуная: короны-составляющие, стоявшие под дунайской короной младшими партнёрами и вассалами, переходят в державу, их земли, их сословия и их распри с этого дня наши, и всякий их клочок по-прежнему имперский."
 nd_dnm.53.a: "Indivisibiliter ac inseparabiliter"
 nd_dnm.53.a_tt: "Всякая корона-составляющая, ещё нам подотчётная, вваривается в державу целиком (её земли становятся своими и присоединяются), а имперские её земли по-прежнему держит в своём составе [GetUniqueInternationalOrganization('hre').GetName]"
 nd_dnm.54.t: "Рейх отмечает наш уход"
 nd_dnm.54.d: "Дунайская корона вышла из Священной Римской империи. Какой бы ни была дорога наружу, последствие одно: наши имперские земли уходят с нами, притязание императора уходит с ними, ранг империи наш, и Рейх отвечает, как может."
 nd_dnm.54.a: "Да будет так"
 nd_dnm.54.a_tt: "Применяется при выходе: всякий наш имперский [location|e] уже отпустила [GetUniqueInternationalOrganization('hre').GetName], и [GetUniqueInternationalOrganization('hre').GetLeaderTitle] держит на нём национальный район; мы держим ранг империи, и Ответ Рейха начался там, где он включён."
 nd_dnm.55.t: "Рейха больше нет"
 nd_dnm.55.d: "Священная Римская империя перестала существовать, и дунайская корона, стоявшая внутри неё, стоит теперь одна. Не осталось ни рейхстага, которому что-либо утверждать, ни императора, которому подавать прошения, ни Рейха, который короне святого Стефана есть за что попрекать. Держава принимает ранг, давно заслуженный её размером."
 nd_dnm.55.a: "Своя собственная империя"
 nd_dnm.55.a_tt: "Мы держим ранг империи, а обида короны святого Стефана на Рейх кончается."
 nd_dnm.21.d.diet: "Наследство устояло. Ручавшееся на бумаге поручено кровью, и короны, стоявшие под дунайской короной младшими партнёрами и вассалами, ушли бы вслед за бумагой в державу, будь держава сама себе хозяйкой. Она не хозяйка: она член Священной Римской империи, а Санкция, растворяющая короны Рейха в одной, нуждается в поручительстве самого Рейха. Рейхстаг захочет, чтобы его спросили, и захочет, чтобы ему заплатили."
 nd_dnm.21.b: "Мы сами положим Санкцию перед рейхстагом"
 nd_dnm.21.b_tt: "Как император мы ручаемся за Санкцию в рейхстаге ценою имперской власти: даёт модификатор Indivisibiliter ac Inseparabiliter, а всякая корона-составляющая, ещё удерживаемая как вассал или младший партнёр унии, вваривается в державу целиком, и земли её остаются имперскими"
 nd_dnm.21.c: "Мы будем добиваться утверждения рейхстагом"
 nd_dnm.21.c_tt: "Короны стоят как стоят, пока рейхстаг не утвердит Санкцию. #bold Положить Санкцию перед рейхстагом#! в дипломатии — прошение, которое рассматривает [GetUniqueInternationalOrganization('hre').GetLeaderTitle]: сильный император менее сговорчив, дружественный — более. Разрыв с Рейхом делает Санкцию нашим собственным законом сразу."
 nd_dnm.21.e: "Пусть короны стоят как стоят"
 nd_dnm.21.e_tt: "Санкция держится, а короны-составляющие остаются подчинёнными коронами; их ещё можно включить в державу обычной дорогой"
 nd_dnm_compact_of_the_crowns_tt: "#bold Договор корон:#! всякая корона-составляющая, нам подотчётная ([subject|e] или младший партнёр нашей личной унии), открывает договор прочным добрым мнением о дунайской короне, что стоит [subject_loyalty|e], пока держится"
 nd_dnm_sanction_own_law_tt: "#bold Санкция становится нашим собственным законом:#! утверждение рейхстагом больше не нужно, и всякая корона-составляющая, нам подотчётная, вваривается в державу целиком"
 nd_dnm_compact_of_the_crowns: "Договор корон"
 STATIC_MODIFIER_NAME_nd_dnm_crown_of_st_stephen: "Корона святого Стефана попрекает Рейх"
 STATIC_MODIFIER_DESC_nd_dnm_crown_of_st_stephen: "Венгерский сейм никогда не признавал, что Венгерское королевство принадлежит Священной Римской империи, и не признает теперь, когда её членом стала корона, которой он подотчётен. Кончается, когда Венгрия вварена в державу или держава порвала с Рейхом."
 nd_dnm_break_with_reich: "Порвать с Рейхом"
 nd_dnm_break_with_reich_desc: "Объявить двору императора, что дунайская корона покидает Священную Римскую империю. Всякий наш имперский район уходит с нами, и император получает на него национальный район; мы принимаем ранг империи; Ответ Рейха начинается там, где он включён. Если императорскую корону носим мы сами, её сперва складывают. Это необратимо."
 nd_dnm_break_abdicate_tt: "#bold Мы складываем императорскую корону:#! курфюрсты выбирают нового императора, и наш государь уже никогда её не наденет"
 nd_dnm_break_with_reich_act: "Объявить стране [SCOPE.sCountry('recipient').GetName], что мы рвём с Рейхом."
 nd_dnm_break_with_reich_effect_text: "[SCOPE.sCountry('actor').GetName] рвут со Священной Римской империей."
 nd_dnm_break_with_reich_effect_text_past: "[SCOPE.sCountry('actor').GetName] порвали со Священной Римской империей."
 PROPOSE_nd_dnm_break_with_reich: "$ACTOR$ рвут с Рейхом.\n\n$INFO$"
 nd_dnm_seek_diet_ratification: "Положить Санкцию перед рейхстагом"
 nd_dnm_seek_diet_ratification_desc: "Просить рейхстаг поручиться за Прагматическую санкцию, поступившись доходом двух лет. Если поручительство дано, всякая корона-составляющая, ещё нам подотчётная, вваривается в державу, а земли её остаются имперскими. Сильный император менее охотно позволит одному члену проглотить три короны; дружественный, да ещё и одной с нами веры, — охотнее. Если император мы сами, прошение идёт к курфюрсту, а цена платится имперской властью."
 nd_dnm_ratification_success_tt: "Рейхстаг ручается за Санкцию: короны-составляющие, нам подотчётные, ввариваются в державу"
 nd_dnm_ratification_rejected_tt: "Прошение отклонено рейхстагом; нового нельзя подать #bold 10 лет#!"
 ND_DNM_RATIFY_BASE: "Рейхстаг не растворяет короны Рейха с лёгкостью"
 ND_DNM_RATIFY_IMPERIAL_AUTHORITY: "Сильный император не позволит одному члену проглотить три короны"
 ND_DNM_RATIFY_SAME_FAITH: "Корона одной с нами веры"
 ND_DNM_RATIFY_AT_WAR: "Воюющая корона — плохой поручитель"
 nd_dnm_seek_diet_ratification_act: "Положить Прагматическую санкцию перед страной [SCOPE.sCountry('recipient').GetName] ради поручительства рейхстага."
 nd_dnm_seek_diet_ratification_effect_text: "[SCOPE.sCountry('actor').GetName] добиваются поручительства рейхстага за Прагматическую санкцию."
 nd_dnm_seek_diet_ratification_effect_text_past: "[SCOPE.sCountry('actor').GetName] добились поручительства рейхстага за Прагматическую санкцию от страны [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnm_seek_diet_ratification: "Поручиться в рейхстаге за Прагматическую санкцию $ACTOR$ и принять её уступки?\n\n$INFO$"
