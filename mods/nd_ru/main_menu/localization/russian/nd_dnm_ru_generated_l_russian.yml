 nd_dnm_ga_cede_tt: "Разрешает кризис наследования на унизительных условиях: малая потеря [stability|e] и уступленная Санкция вместо тяжёлой потери и сломанной Санкции, которые несёт крах"
 nd_dnm_break_the_leagues: "Разбить национальные лиги"
 nd_dnm_break_the_leagues_desc: "Власть над коренными землями отвоёвана. Лиги, питавшие кризис, можно разбить поодиночке, как только у двора достанет воли."
 action_nd_dnm_break_the_leagues: "Разбить национальные лиги"
 action_nd_dnm_break_the_leagues_desc: "Власть над коренными землями отвоёвана. Лиги, питавшие кризис, можно разбить поодиночке, как только у двора достанет воли."
 nd_dnm_offer_the_compromise: "Предложить компромисс"
 nd_dnm_offer_the_compromise_desc: "Две равноправные державы, один венценосец, одна армия, одна внешняя политика. Аусглейх привязывает народы к империи их же согласием, и предложить его можно, как только короне начнут верить."
 action_nd_dnm_offer_the_compromise: "Предложить компромисс"
 action_nd_dnm_offer_the_compromise_desc: "Две равноправные державы, один венценосец, одна армия, одна внешняя политика. Аусглейх привязывает народы к империи их же согласием, и предложить его можно, как только короне начнут верить."
 nd_dnm_concede_the_crowns: "Уступить короны"
 nd_dnm_concede_the_crowns_desc: "Вопрос признаётся неразрешимым, и корона перестаёт на него отвечать. Одна из корон-составляющих пойдёт своим путём, и составная монархия станет меньше."
 action_nd_dnm_concede_the_crowns: "Уступить короны"
 action_nd_dnm_concede_the_crowns_desc: "Вопрос признаётся неразрешимым, и корона перестаёт на него отвечать. Одна из корон-составляющих пойдёт своим путём, и составная монархия станет меньше."
 nd_dnm_nq_control_met_tt: "Контроль над коренным регионом достиг уровня, нужного кризису для восстановления власти"
 nd_dnm_nq_compromise_ready_tt: "Был избран путь Gesamtmonarchie, либо у короны неотрицательная стабильность и законность не ниже 50"
 nd_dnm_ga_reassert_tt: "Разрешает Национальный вопрос восстановлением центральной власти: единое государство"
 nd_dnm_ga_ausgleich_tt: "Разрешает Национальный вопрос компромиссом: Аусглейх и Австро-Венгрия"
 nd_dnm_ga_concede_tt: "Разрешает Национальный вопрос уступкой: одна из корон-составляющих становится независимой"
 nd_dnm.1.t: "Короны Дуная"
 nd_dnm.1.d: "Свершилось. Наследственные земли, корона святого Вацлава и корона святого Стефана вместе вышли из Священной Римской империи, а императорское достоинство сложено. Курфюрсты собираются без нас; папские легаты едут в Вену с укорами; в немецких землях Рейх оставлен князьям. У нас есть то, чего не мог удержать ни один император, связанный рейхстагом: Австрия, Богемия и Венгрия как одна суверенная держава, подотчётная никакому сейму, кроме нашего двора.\n\nНо держава немцев, чехов, мадьяр, хорватов, словаков и ещё дюжины народов — ещё не монархия. Что её свяжет?\n\n#bold Antemurale Christianitatis#! делает Дунай щитом христианского мира: Военная граница, поселения солдат-граничар, нескончаемая война с османами, дающая каждой короне общего врага и общее дело.\n\n#bold Gesamtmonarchie#! делает Дунай одним телом: Гофкаммер, Гофкригсрат, Прагматическая санкция, сваривающие три канцелярии в единое послушное государство.\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_dnm.1.a: "Antemurale Christianitatis: быть оплотом христианского мира"
 nd_dnm.1.b: "Gesamtmonarchie: сварить три короны в одно тело"
 nd_dnm.2.t: "Военная граница"
 nd_dnm.2.d: "Вдоль Савы, Дравы и нижнего Дуная складывается общество нового рода. Сербские, хорватские и влашские семьи селят на границе на наследственном землевладении: свободные от феодальных повинностей, свободные в вере, но связанные от мала до велика вечной военной службой. Militaergrenze — не линия крепостей, а живая стена солдат-земледельцев, самое многочисленное военизированное население Европы, стерегущее османский рубеж от колыбели до могилы. Вопрос в том, что делать с войском, которое никогда не распускается."
 nd_dnm.2.a: "Остриё: двигать границу на юг, в османские земли"
 nd_dnm.2.b: "Щит: селить границу вглубь и дать ей кормить себя самой"
 nd_dnm.3.t: "Белая Гора"
 nd_dnm.3.d: "Ноябрьским утром под Прагой войско чешских сословий разбито за один день. Зимний король бежит; двадцать семь вождей восстания казнены на Староместской площади; выборная монархия святого Вацлава упразднена Обновлённым земским уложением, а корона объявлена наследственной, католической и габсбургской. Треть чешской земли меняет хозяев. Ни один день не сделал больше для создания составной монархии и не оставил в ней раны глубже."
 nd_dnm.3.a: "Окатоличить указом: одна вера, наложенная сверху"
 nd_dnm.3.b: "Связать новую знать: верность, купленная конфискованной землёй"
 nd_dnm.4.t: "Прагматическая санкция"
 nd_dnm.4.d: "У Карла VI нет сына, и он не допустит, чтобы труд двух столетий разделили после его смерти. Корона за короной, сейм за сеймом Прагматическая санкция утверждается: габсбургские земли переходят #italic indivisibiliter ac inseparabiliter#! (нераздельно и неразлучно) как одно тело единому наследнику, дочери или сыну. Впервые Австрия, Богемия и Венгрия — не три короны в одной руке, а одно юридическое лицо. Это конституционный хребет Gesamtmonarchie. Это же и документ, из-за которого будет вестись следующая война."
 nd_dnm.4.a: "Одна держава, один наследник, нераздельно и неразлучно"
 nd_dnm.5.t: "Терезианские реформы"
 nd_dnm.5.d: "Силезия потеряна, и потеря эта — приговор: держава, не умеющая собирать подати и учить войска, не может себя защитить. Из Вены реформа накатывает волной: единое казначейство, Директориум, рекрутские кантоны, Терезианум для подготовки тех, кто всем этим будет управлять. Там, где Мария Терезия строит машину, Иосиф II гонит её за пределы возможного: Патент о веротерпимости, единый язык канцелярии, крестьянин, освобождённый указом. На одно поколение составная монархия становится — почти — государством."
 nd_dnm.5.a: "Камералистская машина: обложенная, вымуштрованная, управляемая из центра"
 nd_dnm.5.b: "Иосифинский размах: веротерпимость, грамотность, единая бюрократия"
 STATIC_MODIFIER_NAME_nd_dnm_antemurale_christianitatis: "Antemurale Christianitatis"
 STATIC_MODIFIER_DESC_nd_dnm_antemurale_christianitatis: "Щит христианского мира на Дунае. Военная граница и поселения солдат-граничар обращают державу в стену людей против османов, а положение оплота веры приносит уважение по всей католической Европе — ценою двора, навеки занятого снабжением границы."
 STATIC_MODIFIER_NAME_nd_dnm_gesamtmonarchie: "Gesamtmonarchie"
 STATIC_MODIFIER_DESC_nd_dnm_gesamtmonarchie: "Всецелая монархия. Гофкаммер, Гофкригсрат и Прагматическая санкция сваривают три короны в одно послушное управляемое тело, обложенное податями и подчинённое Вене, — ценою недовольства сословий и имперского сейма централизующим двором."
 STATIC_MODIFIER_NAME_nd_dnm_frontier_spearhead: "Остриё границы"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_spearhead: "Военная граница, обращённая вовне: граничары как копьё отвоевания, теснящее османский рубеж на юг."
 STATIC_MODIFIER_NAME_nd_dnm_frontier_shield: "Щит границы"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_shield: "Военная граница, заселённая вглубь и кормящая себя сама, — несокрушимая стена, что сама себя питает и пополняет."
 STATIC_MODIFIER_NAME_nd_dnm_verneuerte_ordnung: "Verneuerte Landesordnung"
 STATIC_MODIFIER_DESC_nd_dnm_verneuerte_ordnung: "Чешская церковь и устройство, перекроенные императорским патентом: Контрреформация, наложенная сверху."
 STATIC_MODIFIER_NAME_nd_dnm_loyal_aristocracy: "Верная аристократия"
 STATIC_MODIFIER_DESC_nd_dnm_loyal_aristocracy: "Новое служилое дворянство, привязанное к короне конфискованными поместьями мятежников Белой Горы."
 STATIC_MODIFIER_NAME_nd_dnm_indivisible_realm: "Нераздельная держава"
 STATIC_MODIFIER_DESC_nd_dnm_indivisible_realm: "Прагматическая санкция, утверждённая короной за короной: габсбургские земли — одно юридическое тело, одно наследство, одна верность."
 STATIC_MODIFIER_NAME_nd_dnm_theresian_machine: "Терезианская машина"
 STATIC_MODIFIER_DESC_nd_dnm_theresian_machine: "Камералистская реформа Марии Терезии: единое казначейство, Директориум, рекрутские кантоны — составная монархия, управляемая как одно государство."
 STATIC_MODIFIER_NAME_nd_dnm_josephine_reach: "Иосифинский размах"
 STATIC_MODIFIER_DESC_nd_dnm_josephine_reach: "Просвещённый размах Иосифа II: Патент о веротерпимости, единый язык канцелярии, грамотная многонациональная бюрократия."
 nd_dnm_bella_gerant_alii: "Bella Gerant Alii"
 nd_dnm_bella_gerant_alii_desc: "«Пусть воюют другие; ты, счастливая Австрия, заключай браки». Бургундия, Кастилия, Богемия и Венгрия достались дому Габсбургов наследством и браком, а не завоеванием. Династическая дипломатия — основополагающее орудие дунайского государства."
 nd_dnm_hofkammer: "Венский Гофкаммер"
 nd_dnm_hofkammer_desc: "Центральная придворная палата, учреждённая в 1527 году, свела нижнеавстрийское, тирольское, чешское и венгерское казначейства в одну руку в Вене: первый финансовый хребет составной монархии. Открывает Гофкаммер."
 nd_dnm_hofkriegsrat: "Гофкригсрат"
 nd_dnm_hofkriegsrat_desc: "Придворный военный совет 1556 года, первое постоянное центральное военное управление в Европе: он планировал войну с османами, строил крепости и из одной канцелярии платил войску трёх корон."
 nd_dnm_huszar: "Венгерский гусар"
 nd_dnm_huszar_desc: "Лёгкая конница венгерской короны, поднятая против османских акынджи и к 1700 году перенятая всеми армиями Европы. Открывает ополчение венгерских гусар."
 nd_dnm_danube_staple: "Дунайское складочное право"
 nd_dnm_danube_staple_desc: "Средневековое Stapelrecht Вены заставляло всякое судно на реке разгружаться и торговать в имперской столице: установление, обратившее Дунай в единую торговую артерию. Открывает Донау-Штапель."
 nd_dnm_militaergrenze: "Militaergrenze"
 nd_dnm_militaergrenze_desc: "Военная граница: сербские, хорватские и влашские колонисты, поселённые по линии Савы и Дравы на наследственном держании за вечную пограничную службу. Открывает пограничный округ и ополчение граничар."
 nd_dnm_kleinkrieg: "Доктрина Kleinkrieg"
 nd_dnm_kleinkrieg_desc: "Малая война пограничья: засада, набег и стычка на изрезанной дунайской местности — то нерегулярное ремесло, из-за которого граничар, гайдуков и пандуров боялись от Савы до Баната."
 nd_dnm_jesuit_colleges: "Конфессиональная граница"
 nd_dnm_jesuit_colleges_desc: "Контрреформация поднималась вверх по Дунаю на плечах иезуитских коллегий Вены, Граца, Оломоуца и Трнавы, которые окатоличивали и просвещали возвращённые короны. Открывает иезуитскую коллегию."
 nd_dnm_donau_flottille: "Донау-Флотилле"
 nd_dnm_donau_flottille_desc: "Имперская дунайская военная флотилия: галеры-чайки, бившиеся с османским речным флотом от Комарома до Белграда. Открывает ополчение чаек."
 nd_dnm_renewed_constitution: "Обновлённое земское уложение"
 nd_dnm_renewed_constitution_desc: "Verneuerte Landesordnung 1627 года: после Белой Горы чешская корона была сделана наследственной габсбургской, католической и управляемой по-немецки, а выборная монархия упразднена. Основополагающий акт централизации составной монархии."
 nd_dnm_kuerassier: "Габсбургский кирасир"
 nd_dnm_kuerassier_desc: "Тяжёлая гвардейская конница в стальных латах, решающая ударная сила имперского войска от Лютцена до османского поля. Открывает ополчение кирасир."
 nd_dnm_kaiserliche_armee: "Постоянная имперская армия"
 nd_dnm_kaiserliche_armee_desc: "Kaiserliche Armee: первое на континенте постоянное многонациональное войско, оплачиваемое Гофкаммером и обучаемое Гофкригсратом. Открывает имперский арсенал."
 nd_dnm_erblande_mercantilism: "Меркантилизм наследственных земель"
 nd_dnm_erblande_mercantilism_desc: "Камералистское развитие наследственных земель: линцская шерстяная мануфактура, идрийская ртуть, штирийское железо Эрцберга, спускаемое по Дунаю на рынки державы."
 nd_dnm_pragmatic_sanction: "Прагматическая санкция"
 nd_dnm_pragmatic_sanction_desc: "Указ 1713 года, утверждённый короной за короной: габсбургские земли переходят indivisibiliter ac inseparabiliter как одно тело единому наследнику. Конституционный хребет Gesamtmonarchie."
 nd_dnm_theresian_reforms: "Терезианские реформы"
 nd_dnm_theresian_reforms_desc: "Реформа, последовавшая за потерей Силезии: единое казначейство, Директориум и рекрутские кантоны обратили составную монархию в управленческую машину."
 nd_dnm_theresianum: "Терезианум"
 nd_dnm_theresianum_desc: "Камеральная академия, основанная в Вене в 1746 году, чтобы готовить многонациональную бюрократию Gesamtmonarchie в единой управленческой манере и на едином канцелярском языке. Открывает Терезианум."
 nd_dnm_banat_colonization: "Заселение Баната"
 nd_dnm_banat_colonization_desc: "Schwabenzuege: великое переселение дунайских швабов в отвоёванные и обезлюдевшие Банат и Бачку после Пожаревацкого мира, вернувшее опустошённое пограничье к возделыванию."
 nd_dnm_liechtenstein_artillery: "Лихтенштейнская артиллерия"
 nd_dnm_liechtenstein_artillery_desc: "Артиллерийская реформа князя Йозефа Венцеля Лихтенштейнского: единообразная подвижная система орудий, сделавшая имперский парк лучше обслуживаемым, чем любой в Европе. Открывает ополчение артиллерийского парка."
 nd_dnm_grenzer_line: "Konzivilisation"
 nd_dnm_grenzer_line_desc: "Перевод пограничных полков в регулярную линию: граничары, переделанные в обученную европейскую пехоту — нечто среднее между лёгкой и линейной, ценимое на всяком театре имперских войн."
 nd_dnm_united_chancellery: "Объединённая придворная канцелярия"
 nd_dnm_united_chancellery_desc: "Vereinigte Hofkanzlei: попытка слить австрийскую и чешскую канцелярии в один управленческий орган, высшая точка централизаторского замысла."
 nd_dnm_danube_steam: "Дунайское пароходство"
 nd_dnm_danube_steam_desc: "Erste Donau-Dampfschiffahrts-Gesellschaft, пароходное общество, обратившее реку в хребет единого промышленного дунайского хозяйства от Регенсбурга до Железных Ворот. Открывает дунайскую пароходную верфь."
 a_nd_dnm_huszar_levy: "Венгерский гусар"
 a_nd_dnm_huszar_levy_desc: "Лёгкая конница венгерской короны: быстрые, далеко ходящие налётчики, рождённые пограничной войной с османами, грабящие и прикрывающие на скорости, недоступной тяжёлой коннице."
 a_nd_dnm_grenzer_levy: "Граничар"
 a_nd_dnm_grenzer_levy_desc: "Солдаты-колонисты Военной границы. Сербские, хорватские и влашские пограничники, мастера засады и стычки на изрезанной местности Савы и Дравы, воюющие налегке и живущие малым."
 n_nd_dnm_tschaike_levy: "Чайка"
 n_nd_dnm_tschaike_levy_desc: "Речная галера малой осадки дунайской военной флотилии, ходившая под началом чайкистов и бившаяся с османским флотом от Комарома вниз до Белграда."
 a_nd_dnm_kuerassier_levy: "Габсбургский кирасир"
 a_nd_dnm_kuerassier_levy_desc: "Тяжёлая гвардейская конница в стальных латах, решающая ударная сила имперского войска: удар латного дворянства, наносимый в точке надлома строя."
 a_nd_dnm_artillery_train_levy: "Лихтенштейнский артиллерийский парк"
 a_nd_dnm_artillery_train_levy_desc: "Единообразная подвижная имперская система орудий лихтенштейнской реформы, к Наполеоновским войнам — лучше всех обслуживаемая артиллерия Европы. Её лёгкие лафеты не отстают от пехоты."
 nd_dnm_hofkammer_building: "Гофкаммер"
 nd_dnm_hofkammer_building_desc: "Центральная придворная палата, Вена, 1527 год: казначейство, собравшее палаты всех корон в одну руку. Финансовый хребет Gesamtmonarchie."
 nd_dnm_donau_stapel: "Донау-Штапель"
 nd_dnm_donau_stapel_desc: "Дунайский складочный двор, где венское Stapelrecht заставляло всякое судно разгружаться и торговать, обращая реку в единую торговую артерию."
 nd_dnm_militaergrenze_building: "Militaergrenze"
 nd_dnm_militaergrenze_building_desc: "Округ Военной границы: поселения солдат-колонистов на наследственном держании за вечную пограничную службу, самое многочисленное военизированное общество Европы раннего Нового времени."
 nd_dnm_jesuit_college: "Иезуитская коллегия"
 nd_dnm_jesuit_college_desc: "Коллегия Общества Иисуса (Вена, Грац, Оломоуц, Трнава), двигатель Контрреформации и школа возвращённых корон."
 nd_dnm_imperial_arsenal: "Имперский арсенал"
 nd_dnm_imperial_arsenal_desc: "Kaiserliches Zeughaus: центральный арсенал и литейная постоянного имперского войска, отливающая пушки и хранящая мушкеты трёх корон."
 nd_dnm_theresianum_building: "Терезианум"
 nd_dnm_theresianum_building_desc: "Камеральная академия Вены 1746 года, готовившая многонациональную бюрократию составной монархии в единой управленческой манере."
 nd_dnm_danube_steam_yard: "Дунайская пароходная верфь"
 nd_dnm_danube_steam_yard_desc: "Заведение Дунайского пароходного общества, обращающее реку в хребет единого промышленного дунайского хозяйства от Регенсбурга до Железных Ворот."
 nd_dnm_destiny: "Дунайская судьба"
 nd_dnm_destiny_desc: "Три короны скованы в одну державу; чем эта держава станет, ещё не решено. Выбор при основании (оплот христианского мира или всецелая монархия) открывает путь, которым династия будет идти столетиями."
 nd_dnm_dest_sava_line: "Долгая турецкая война"
 nd_dnm_dest_sava_line_desc: "Оттеснить османский рубеж к слиянию Савы и Дуная: построить Militaergrenze, удержать Белград и перестроить его в город-крепость, взять Смедерево — ключи к речной линии, которую однажды будет держать Евгений Савойский (путь Antemurale)."
 nd_dnm_dest_balkan_drive: "Поход на Балканы"
 nd_dnm_dest_balkan_drive_desc: "Вынести остриё граничар за реки, вглубь османских земель: Ниш на Мораве, Скопье на Вардаре и София за Балканским хребтом, — с действительно принятой доктриной Kleinkrieg, малой войны пограничья. Оплот, обращённый в наступление."
 nd_dnm_dest_eastern_crusade: "Восточный крестовый поход"
 nd_dnm_dest_eastern_crusade_desc: "Оплот становится завоевателем: взять дунайские княжества в Бухаресте и Тырговиште, донести войну до самого Константинополя и оставить державу султана сломленной или преклонённой перед Веной. Открывает бастион Antemurale."
 nd_dnm_dest_cameral_foundation: "Камеральное основание"
 nd_dnm_dest_cameral_foundation_desc: "Централизация, измеряемая канцеляриями, а не завоеваниями: принять банковское дело и профессиональные армии и запустить Kameralhoheit, собственную бюрократию венского фиска (путь Gesamtmonarchie)."
 nd_dnm_dest_united_treasury: "Единое казначейство"
 nd_dnm_dest_united_treasury_desc: "Гофкаммер, сделанный полновластным: венская придворная палата поставлена над тремя коронами, а серебро карпатских рудников течёт в единый фиск."
 nd_dnm_dest_total_monarchy: "Всецелая монархия"
 nd_dnm_dest_total_monarchy_desc: "Вершина централизаторского замысла: устойчивое, просвещённое, единообразно управляемое дунайское государство, где разом работают оба столпа, податный и конфессиональный, — Kameralhoheit и Reformationskommission. Открывает Штаатсканцлей. (Компромисс двуединой монархии достигается не здесь: этот расчёт принадлежит Национальному вопросу.)"
 nd_dnm_dest_josephine_triumph: "Иосифинское торжество"
 nd_dnm_dest_josephine_triumph_desc: "Один патент, один свод — от Влтавы до Тисы: единообразное управляемое государство, доведённое до конца там, где историческая программа Иосифа II была сведена вничью, и завершённое там, где Объединённая канцелярия лишь попыталась. Невозможно для короны, уже потерявшей одно из королевств-составляющих. Открывает реформу «Единый патент»."
 nd_dnm_dest_estates_endure: "Сословия устоят"
 nd_dnm_dest_estates_endure_desc: "Другой ответ на тот же вопрос: право быть спрошенными по Золотой булле не упразднено, а оформлено. Landstaende, собственный аппарат сословных собраний, должен действительно работать. Открывает реформу «Сейм в совете»."
 nd_dnm_amb_root_tt: "Уния держится сама (стабильность не ниже 75)"
 nd_dnm_amb_sava_tt: "Граница построена, и Белград отвечает Вене, а не Константинополю (взят корень судьбы)"
 nd_dnm_amb_balkan_tt: "Доктрина малой войны выносит граничар за реки, в долины Моравы и Вардара (удержана линия Савы и принята доктрина Kleinkrieg)"
 nd_dnm_amb_crusade_tt: "Престол султана пуст или подчинён Вене: балканский поход завершён, а османская держава более не существует или является нашим [subject|e]"
 nd_dnm_amb_cameral_tt: "Предписания Гофкаммера действительно исполняются (взят корень судьбы и работает бюрократия Kameralhoheit)"
 nd_dnm_amb_treasury_tt: "Серебро идёт через один коронный фиск, а не через три (заложено камеральное основание и взято улучшение «Венский Гофкаммер»)"
 nd_dnm_amb_total_tt: "Фиск и конфессиональная комиссия отвечают одной руке (единое казначейство завершено; работают обе бюрократии — Kameralhoheit и Reformationskommission)"
 nd_dnm_amb_patent_tt: "Один патент, один свод — от Влтавы до Тисы (работает бюрократия Директориума и не потеряно ни одно королевство-составляющая)"
 nd_dnm_amb_diet_tt: "Ландтаги сохраняют своё старое право быть спрошенными (работает бюрократия Landstaende)"
 nd_dnm_uniform_patent_reform: "Единый патент"
 nd_dnm_uniform_patent_reform_desc: "Единый управленческий свод и единый канцелярский язык по всем коронным землям, наложенные патентом из Вены. То, что Иосиф II указал, а сословия отвергли, эта корона сумела удержать.\n\nДаёт +10% к законодательной действенности и +15% к скорости ассимиляции; дворянские сословия никогда не простят попрания своих привилегий."
 nd_dnm_diet_in_council_reform: "Сейм в совете"
 nd_dnm_diet_in_council_reform_desc: "Старое право быть спрошенными, ius resistendi Золотой буллы, оформленное как постоянный конституционный орган вместо упразднения, навязанного в Пресбурге в 1687 году. Сеймы заседают в совете, и корона законодательствует вместе с ними, а не через их голову.\n\nДаёт -8% к сепаратизму и +10% к верности вассалов; коронное законодательство идёт медленнее, потому что с сеймами приходится действительно советоваться."
 nd_dnm.6.t: "Судьба Дуная"
 nd_dnm.6.d: "Держава выкована, и выбор при основании сделан. Отсюда дорога длинна: столетия своего правления династия потратит на то, чтобы оправдать избранное при основании. Двор понимает, какая работа предстоит и по каким целям его будут судить."
 nd_dnm.6.d.hun: "Держава выкована, и выковала её корона святого Стефана. Старейшая из трёх корон, та, чья Золотая булла научила своё дворянство праву сопротивления, собрала Австрию и Богемию под собственные установления. Дорога впереди длинна, и венгерские сеймы будут ждать, что их спросят на каждом её шагу. Двор понимает, какая работа предстоит и по каким целям его будут судить."
 nd_dnm.6.d.boh: "Держава выкована, и выковала её корона святого Вацлава. Богемия вынесла своё курфюршеское достоинство из Рейха, чтобы построить на Дунае нечто большее, и покинутая ею коллегия из-за этого недосчиталась голоса. Дорога впереди длинна. Двор понимает, какая работа предстоит и по каким целям его будут судить."
 nd_dnm.6.a: "Да начнётся работа"
 nd_dnm.7.t: "Граница восстановлена"
 nd_dnm.7.d: "Белград и Смедерево наши, а с ними и слияние Савы с Дунаем. Граница стоит там, где однажды проведёт её Евгений Савойский: не укреплённой линией на карте, а отвоёванной страной, воротами, из которых только и может начаться всякая дальнейшая война против Порты. Войско, сделавшее это, не расходится по домам."
 nd_dnm.7.a: "Речная линия удержана"
 nd_dnm.8.t: "За реками"
 nd_dnm.8.d: "Остриё вынесено за реки, вглубь османских земель. Долина Моравы, Скопье на Вардаре, София за Балканским хребтом: оплот более не щит, а клинок, вонзённый в сердце Румелии. От того, как теперь пойдёт война, зависит, насколько глубоко войдёт этот клинок."
 nd_dnm.8.a: "Штурмовать крепостной пояс: осаждать и брать твердыни"
 nd_dnm.8.b: "По-граничарски: война движения, набега и погони"
 nd_dnm.9.t: "Меч христианского мира"
 nd_dnm.9.d: "Бухарест, Тырговиште и самые стены Константинополя. Труд оплота завершён: Дунайская монархия — тот меч, что наконец переломил османскую волну, первая католическая держава Востока. Что делать со столь полной победой?"
 nd_dnm.9.a: "Венчанный оплот: положение по всему христианскому миру"
 nd_dnm.9.b: "Завоевательное войско: армия, живущая своими завоеваниями"
 nd_dnm.10.t: "Камеральное основание"
 nd_dnm.10.d: "Это выиграно не войском. Новая управленческая наука века — банк, постоянная профессиональная армия, размежёванная и обустроенная земля — введена в державу, и построены канцелярии, что её несут. Хребет Gesamtmonarchie теперь из бумаги и гроссбуха, а не из гарнизонов."
 nd_dnm.10.a: "Канцелярии построены"
 nd_dnm.11.t: "Единое казначейство"
 nd_dnm.11.d: "Гофкаммер сделан полновластным: одно казначейство над тремя коронами, полная военная казна, серебро Кремницы и железо Эрцберга, текущие в единый фиск. Составная монархия впервые становится единым хозяйственным телом. Как держать новое богатство?"
 nd_dnm.11.a: "Коронный фиск: доход прямо в центр"
 nd_dnm.11.b: "Дунайский рынок: река как единое хозяйство"
 nd_dnm.12.t: "Всецелая монархия"
 nd_dnm.12.d: "Замысел достигает вершины: богатая, устойчивая, грамотная, просвещённая держава, управляемая из одной руки, где сословия вплетены в машину, а не выстроены против неё. На одно поколение дунайское государство становится — почти — единой современной монархией. Расчёт с народами ещё впереди; это тот централизующий инструмент, что должен ему предшествовать."
 nd_dnm.12.a: "Камералистская рука: сословия, вваренные в машину"
 nd_dnm.12.b: "Просвещённое государство: грамотное, размежёванное, единовластное"
 nd_dnm.49.t: "Патент исполнен"
 nd_dnm.49.d: "Курьеры везут один и тот же документ в каждую канцелярию от Влтавы до Тисы, и впервые в истории державы каждая канцелярия подшивает его одинаково. Один свод, один язык управления, одна корона за обоими. То, что указало поколение Иосифа и отвергли сословия, удалось удержать. Дом Австрийский, выковавший себе курфюршеское достоинство, когда Рейх ему в нём отказал, выковал теперь то, чего Рейху так и не удалось: государство, отвечающее одним голосом."
 nd_dnm.49.d.hun: "Курьеры везут один и тот же документ в каждую канцелярию от Влтавы до Тисы, и впервые в истории державы каждая канцелярия подшивает его одинаково. Один свод, один язык управления, одна корона за обоими. А то, что именно корона святого Стефана — та, чья Золотая булла научила своё дворянство праву сопротивления, — вычеркнула теперь сопротивляющихся из самой процедуры, венгерские сеймы будут пережёвывать целое столетие. Патент от этого исполняется не хуже."
 nd_dnm.49.d.boh: "Курьеры везут один и тот же документ в каждую канцелярию от Влтавы до Тисы, и впервые в истории державы каждая канцелярия подшивает его одинаково. Один свод, один язык управления, одна корона за обоими. Корона святого Вацлава некогда подавала один из семи голосов на выборах в чужой империи; она рассудила, что единообразно управлять собственной — лучшее применение основательскому достоинству. Патент исполнен."
 nd_dnm.49.a: "Один патент, один свод, одна корона"
 nd_dnm.50.t: "Старые права сохранены"
 nd_dnm.50.d: "Сеймы заседают в совете: не просителями, принятыми по милости короны, а органом самого государственного устройства. Старое право быть спрошенными, которое другие дворы весь век упраздняли, сохранено и оформлено: корона законодательствует вместе с ландтагами, а не через их голову. Дом Австрийский рассудил, что держава многих народов держится дольше всего тогда, когда каждый из них спрошен — и это записано."
 nd_dnm.50.d.hun: "Сеймы заседают в совете: не просителями, принятыми по милости короны, а органом самого государственного устройства. Старое право быть спрошенными сохранено и оформлено, и никто не удивлён этому меньше, чем сеймы Венгрии: корона святого Стефана спорила со своей же Золотой буллой за пять столетий до того, как выковала эту унию, и просто вписала свою давнюю привычку в устройство всего Дуная."
 nd_dnm.50.d.boh: "Сеймы заседают в совете: не просителями, принятыми по милости короны, а органом самого государственного устройства. Старое право быть спрошенными сохранено и оформлено. Корона святого Вацлава, чьи сословия в другой истории были сломлены за один день на Белой Горе, избрала быть короной, которая спрашивает, — и ландтаги всех коронных земель отвечают."
 nd_dnm.50.a: "Корона спрашивает; ландтаги отвечают"
 STATIC_MODIFIER_NAME_nd_dnm_dest_breaker_of_walls: "Сокрушитель стен"
 STATIC_MODIFIER_DESC_nd_dnm_dest_breaker_of_walls: "Крепости берущее войско балканского наступления: быстрое в захвате почина, далёкое в размахе и закалённое опытом, добытым в каждом проломе."
 STATIC_MODIFIER_NAME_nd_dnm_dest_grenzer_tide: "Волна граничар"
 STATIC_MODIFIER_DESC_nd_dnm_dest_grenzer_tide: "Война движения и набега, вынесенная вглубь османских земель: пограничники стремительны и неотступны, но война на ходу ослабляет хватку короны над землями, которые она проходит."
 STATIC_MODIFIER_NAME_nd_dnm_dest_sword_of_christendom: "Меч христианского мира"
 STATIC_MODIFIER_DESC_nd_dnm_dest_sword_of_christendom: "Оплот, увенчанный короной: дипломатический размах первой католической державы Востока, стойкая слава её войска, добытая трудом, и уважение, что угасает медленно."
 STATIC_MODIFIER_NAME_nd_dnm_dest_conquering_host: "Завоевательное войско"
 STATIC_MODIFIER_DESC_nd_dnm_dest_conquering_host: "Армия, что набирает и пополняет себя из взятых земель и держит гарнизоны в том, чем владеет: двигатель затяжной восточной войны."
 STATIC_MODIFIER_NAME_nd_dnm_dest_crown_fisc: "Коронный фиск"
 STATIC_MODIFIER_DESC_nd_dnm_dest_crown_fisc: "Доход, идущий прямо в центральное казначейство: золото карпатских рудников и поместная подать трёх корон, — но корона, ставящая фиск выше прочего, скупится на содержание своего орудийного парка."
 STATIC_MODIFIER_NAME_nd_dnm_dest_danube_market: "Дунайский рынок"
 STATIC_MODIFIER_DESC_nd_dnm_dest_danube_market: "Река, сваренная в единое торговое тело: складочное хозяйство трёх корон, чьи купцы и торговые средоточия несут единый дунайский рынок."
 STATIC_MODIFIER_NAME_nd_dnm_dest_cameralist_hand: "Камералистская рука"
 STATIC_MODIFIER_DESC_nd_dnm_dest_cameralist_hand: "Сословия вплетены в машину, а не выстроены против неё: хватка короны над державой не слабеет, а бюрократический аппарат обходится дёшево."
 STATIC_MODIFIER_NAME_nd_dnm_dest_enlightened_state: "Просвещённое государство"
 STATIC_MODIFIER_DESC_nd_dnm_dest_enlightened_state: "Грамотная, размежёванная, единообразно управляемая держава: иосифинская школа, доведённая до конца, и новое знание века, которое дёшево принять."
 nd_dnm_antemurale_bastion: "Бастион Antemurale"
 nd_dnm_antemurale_bastion_desc: "Великая пограничная крепость-арсенал оплота христианского мира: звёздная крепость петервардейнского и белградского образца со своим пороховым погребом, петля, на которой поворачивается вся османская война."
 nd_dnm_staatskanzlei: "Штаатсканцлей"
 nd_dnm_staatskanzlei_desc: "Государственная канцелярия: центральный орган всецелой монархии, аппарат, который составляет, подшивает и управляет всей державой из одной руки. Орудие централизации, а не компромисса, что однажды может за ней последовать."
 nd_dnm_bastion_maintenance: "Гарнизон бастиона"
 nd_dnm_bastion_maintenance_desc: "Постоянный гарнизон, орудийная прислуга и пороховые запасы, что держат пограничную крепость-арсенал в боевой готовности."
 nd_dnm_staatskanzlei_maintenance: "Штат канцелярии"
 nd_dnm_staatskanzlei_maintenance_desc: "Писцы, реестры и канцелярские припасы центральной Государственной канцелярии, управляющей всей державой."
 nd_dnm_kameralhoheit_bureaucracy: "Kameralhoheit"
 nd_dnm_kameralhoheit_bureaucracy_desc: "Когда Фердинанд I в 1527 году сделал венский Гофкаммер независимым от Надворного совета, он свёл нижнеавстрийскую, тирольскую, чешскую и венгерскую земельные палаты под один фиск; Мария Терезия подняла его до высшей власти по финансам, горному делу и торговле. Доход, который прежде вотировали и проверяли сословия коронных земель, теперь исчислялся из Вены: фиск, что забирает горное дело и торговлю в пользу короны, но вырождается в мздоимствующих писцов и порченую монету, если палату держать впроголодь."
 nd_dnm_geheime_konferenz_bureaucracy: "Geheime Konferenz"
 nd_dnm_geheime_konferenz_bureaucracy_desc: "При Леопольде I горстка доверенных магнатов, Conferenzminister, составила внутренний кабинет, который и решал вопросы войны, мира и династической политики, а секретарей брал из австрийской и имперской канцелярий. Быстрый и тайный, он привязывал высшую аристократию к династии и вовсе обходил широкий Тайный совет, но для городов был закрытой дверью, а в небрежении сворачивается в гнездо придворных партий, останавливающее всякую работу кабинета."
 nd_dnm_grenz_generalat_bureaucracy: "Grenz-Generalat"
 nd_dnm_grenz_generalat_bureaucracy_desc: "С Брукского съезда 1578 года внутренние австрийские земли содержали постоянный кордон; карловацкое и вараждинское генералаты держали общество сербских, хорватских и влашских солдат-колонистов на наследственном держании, освобождённых от податей и терпимых в вере в обмен на пожизненную пограничную службу. Самокормящаяся стена свободных ополченцев, подотчётных Вене, а не какому-либо сеньору, — но неоплаченное и неуправляемое пограничье обращается к грабежу и дезертирству. Требует Военной границы."
 nd_dnm_landstaende_bureaucracy: "Landstaende der Erblande"
 nd_dnm_landstaende_bureaucracy_desc: "Раздельные австрийская, чешская и венгерская придворные канцелярии в Вене хранили каждая право, язык и ландтаг своей короны; сеймы продолжали вотировать подати и рекрутов и оберегать дворянские привилегии от абсолютистского нажима — упорнее всех венгерские комитаты. Согласие течёт, когда сословия уважают, а законы проходят через сеймы; в небрежении сеймы упрямятся, войну приходится из них выжимать, и составная монархия расползается."
 nd_dnm_directorium_bureaucracy: "Directorium in publicis et cameralibus"
 nd_dnm_directorium_bureaucracy_desc: "После Ахенского мира Фридрих Вильгельм фон Хаугвиц в 1749 году слил австрийскую и чешскую канцелярии в один орган по общественным делам и финансам, урезал сеймы коронных земель и наложил на наследственные земли единообразный десятилетний податной рецесс. Учрежденческий двигатель Gesamtmonarchie: одно управление над многими коронами и население, сводимое в единое государство; но недостроенное единообразное государство — лишь лишняя бумажная тягота и кипящее лишённое власти дворянство. Требует Объединённой придворной канцелярии."
 nd_dnm_reformationskommission_bureaucracy: "Reformationskommission"
 nd_dnm_reformationskommission_bureaucracy_desc: "Патенты Фердинанда II 1624–1627 годов дозволяли в Богемии и Внутренней Австрии одну лишь католическую веру; религиозные комиссии изгоняли протестантское духовенство, а иезуиты, с Петером Пазманем на венгерской стороне, забрали в свои руки высшее образование и окатоличили возвращённые земли. Единство исповедания воспитывало верную церковную верхушку и питало законность династии, но принудительный аппарат без коллегий за спиной лишь плодит озлобление в городах и враждебную коалицию за рубежом. Требует католического правителя."
 AUTO_MODIFIER_NAME_nd_dnm_bureaucracy_authority: "Бюрократическая власть"
 AUTO_MODIFIER_DESC_nd_dnm_bureaucracy_authority: "Дунайская монархия имеет право содержать исторические учреждения габсбургского составного государства. Три из шести её учреждений могут действовать одновременно."
 nd_dnm_grace_tt: "Дунайское государство только что выковано: его кризисы ещё не успели собраться"
 nd_dnm_nq_resolved_tt: "Национальный вопрос доведён до разрешения"
 nd_dnm_ausgleich_reached_tt: "С народами заключён компромисс"
 nd_dnm_nq_reasserted_tt: "Центральная власть над народами восстановлена"
 nd_dnm_nq_control_target_tt: "Мера контроля, которую короне надо вернуть, чтобы совладать с кризисом"
 nd_dnm_ps_resolved_tt: "Война за наследство завершена"
 nd_dnm_ps_upheld_tt: "Прагматическая санкция отстояна"
 nd_dnm_ps_ceded_tt: "Держава предпочла уступить условия, а не доводить войну за наследство до конца"
 nd_dnm_reich_humbled_tt: "Приговор Рейха дунайскому государству сломлен на поле боя"
 nd_dnm_reich_reconciled_tt: "Император формально принял примирение с дунайским государством"
 nd_dnm_reich_endured_tt: "Отчуждение просто пережили: державы привыкли к дунайскому государству"
 nd_dnm_succession_groundwork_tt: "С сеймами подготовлена почва для нераздельного наследования"
 nd_dnm_decree_ratified_tt: "Указ о нераздельности утверждён короной за короной"
 nd_dnm_chain_30_pending_tt: "Двор ещё не столкнулся с открытым вопросом о наследстве"
 nd_dnm_chain_31_pending_tt: "Сеймы коронных земель ещё не отправили совместного посольства о наследовании"
 nd_dnm_chain_32_pending_tt: "Канцелярии ещё не составили указ о нераздельности"
 nd_dnm_chain_30_fired_tt: "Вопрос о наследстве поднят"
 nd_dnm_chain_31_fired_tt: "Сеймы высказались о наследовании"
 nd_dnm_chain_32_fired_tt: "Указ рассмотрен"
 nd_dnm_pariah_timer_tt: "Отчуждению с Рейхом ещё нет полувека"
 nd_dnm_nationalities_question: "Национальный вопрос"
 nd_dnm_nationalities_question_desc: "Наш дом правит лоскутным одеялом народов и ни одной нацией. Мадьяры, чехи, поляки, хорваты и румыны — каждый смотрит на свой язык и своё прошлое, и управлять ими всеми из одной канцелярии в Вене стало этой канцелярии не по силам..."
 nd_dnm_pragmatic_sanction_crisis: "Война за наследство"
 nd_dnm_pragmatic_sanction_crisis_desc: "Наследство, объявленное нами нераздельным, оспаривают силой. Державы, приложившие печать к Прагматической санкции, теперь двигают свои притязания армиями, против династии собирается коалиция, а короны нашей собственной державы ждут, сумеем ли мы удержать оставленное нам..."
 nd_dnm_reaction_of_the_reich: "Ответ Рейха"
 nd_dnm_reaction_of_the_reich_desc: "Дом Австрийский вывел свои короны из [GetUniqueInternationalOrganization('hre').GetName] и воздвиг на Дунае собственную монархию. [GetUniqueInternationalOrganization('hre').GetLeaderTitle] назвал новое государство отступником, а [ShowSpecialStatusName('curia')] удерживает благословение, что три столетия давалось этому дому. По всей Империи князья смотрят, способен ли ещё Рейх покарать того из своих, кто ушёл..."
 nd_dnm_reaction_of_the_reich_tt: "Рейх сторонится Дунайской монархии за выход из Империи"
 STATIC_MODIFIER_NAME_nd_dnm_reich_pariah: "Отвергнут Рейхом"
 STATIC_MODIFIER_DESC_nd_dnm_reich_pariah: "Император и курия обходятся с дунайским отступником как с изгоем."
 STATIC_MODIFIER_NAME_nd_dnm_austria_hungary: "Австро-Венгрия"
 STATIC_MODIFIER_DESC_nd_dnm_austria_hungary: "Компромисс: две равноправные державы, одна династия. Народы привязаны к империи согласием, а не штыком."
 STATIC_MODIFIER_NAME_nd_dnm_centralized_reassertion: "Единое государство"
 STATIC_MODIFIER_DESC_nd_dnm_centralized_reassertion: "Сеймы сломлены, а правление сделано единообразным из Вены — ценою долго не иссякающего озлобления."
 STATIC_MODIFIER_NAME_nd_dnm_fractured_realm: "Расколотая держава"
 STATIC_MODIFIER_DESC_nd_dnm_fractured_realm: "Одна корона выскользнула из рук династии; составное тело истекает законностью и связностью."
 STATIC_MODIFIER_NAME_nd_dnm_sanction_vindicated: "Indivisibiliter ac Inseparabiliter"
 STATIC_MODIFIER_DESC_nd_dnm_sanction_vindicated: "Прагматическая санкция устояла против вооружённого мира; нераздельное наследство теперь вне спора."
 STATIC_MODIFIER_NAME_nd_dnm_sanction_broken: "Сломанная санкция"
 STATIC_MODIFIER_DESC_nd_dnm_sanction_broken: "Война за наследство вырвала у державы земли и уважение; нераздельное наследство оказалось всё же делимым."
 STATIC_MODIFIER_NAME_nd_dnm_sanction_ceded: "Уступленная санкция"
 STATIC_MODIFIER_DESC_nd_dnm_sanction_ceded: "Корона договорилась, пока ей ещё было чем торговаться. Исход скромнее победы, но сеймы помнят, что Вена знала, когда остановиться, и держава согнута, а не сломлена."
 STATIC_MODIFIER_NAME_nd_dnm_danubian_recognition: "Дунайское признание"
 STATIC_MODIFIER_DESC_nd_dnm_danubian_recognition: "Император принял подношение и вслух прочёл формулы примирения. Дунайское государство снова официально держава среди держав, а корона, умеющая закончить ссору с императором, — корона, с которой стоит иметь дело."
 STATIC_MODIFIER_NAME_nd_dnm_danube_endures: "Дунай устоял"
 STATIC_MODIFIER_DESC_nd_dnm_danube_endures: "Ни договора, ни оправдания: мир просто привык, что великая держава существует вне старого имперского порядка. Половина отмены изгойских лет, заслуженная тем, что их пережили."
 STATIC_MODIFIER_NAME_nd_dnm_succession_anxiety: "Открытый вопрос"
 STATIC_MODIFIER_DESC_nd_dnm_succession_anxiety: "Преемство династии не решено. В Пеште и Праге магнаты спрашивают: когда этот государь умрёт, куда уйдёт наследство? Цена мала и постоянна."
 STATIC_MODIFIER_NAME_nd_dnm_rallying_the_diets: "Сплочение сеймов"
 STATIC_MODIFIER_DESC_nd_dnm_rallying_the_diets: "Двор решил отвечать на вопрос о наследстве открыто — делом и покровительством. Законность растёт вместе с работой, но само сплочение кое-где ощущается как нажим."
 STATIC_MODIFIER_NAME_nd_dnm_royal_silence: "Королевское молчание"
 STATIC_MODIFIER_DESC_nd_dnm_royal_silence: "Двор отказывается, чтобы его торопили с решением о наследовании. Держава читает молчание как слабость."
 STATIC_MODIFIER_NAME_nd_dnm_drafting_the_decree: "Составление указа"
 STATIC_MODIFIER_DESC_nd_dnm_drafting_the_decree: "Канцелярии проводят формальное утверждение патентом: работа видна в действенности управления, а публичный ответ на вопрос о наследстве приносит ровный приток законности."
 STATIC_MODIFIER_NAME_nd_dnm_postponed_decree: "Отложенный указ"
 STATIC_MODIFIER_DESC_nd_dnm_postponed_decree: "Указ составлен, но отложен до более мудрого правления. Держава читает отсрочку как неспособность решить вопрос."
 STATIC_MODIFIER_NAME_nd_dnm_reich_pressure_recent: "Имперский нажим"
 STATIC_MODIFIER_DESC_nd_dnm_reich_pressure_recent: "Имперские князья и курия работают против дунайского государства: краткое закручивание гаек поверх постоянного изгойства."
 nd_dnm.13.t: "Национальный вопрос"
 nd_dnm.13.d: "Мадьяр, чех, хорват, немец, поляк, румын, итальянец: династия правит всеми ими и не является ни одним из них. От Пешта до Праги сеймы приходят в движение, и каждый требует своего языка, своего права, своей нации. Империя есть лицо короны и ничего более, и этого уже недостаточно."
 nd_dnm.13.a: "Кризис настиг нас"
 nd_dnm.14.t: "Сейм бросает вызов Вене"
 nd_dnm.14.d: "Один из сеймов коронных земель отказывает в рекрутах и податях, пока не будут подтверждены его древние вольности. Канцелярия ждёт ответа двора."
 nd_dnm.14.a: "Подавить сейм: корона не торгуется"
 nd_dnm.14.b: "Уступить ему самостоятельность: пусть держава ослабит хватку"
 nd_dnm.15.t: "Предложен компромисс"
 nd_dnm.15.d: "Умеренные с обеих сторон намекают на соглашение: равноправные державы под одной династией, у каждого народа своё управление, связанные лицом государя и общим войском. Это Аусглейх во всём, кроме имени, и провести его можно, лишь если есть чем — централизующий аппарат или добрая воля сословий."
 nd_dnm.15.a: "Принять компромисс: двуединая держава"
 nd_dnm.15.b: "Отказать: корону не располовинят"
 nd_dnm.16.t: "Разбить национальные лиги"
 nd_dnm.16.d: "Власть над коренными землями отвоёвана. Лиги, питавшие кризис, теперь можно разбить поодиночке, если у двора достанет воли."
 nd_dnm.16.a: "Раздавить их: восстановить единообразную корону"
 nd_dnm.16.b: "Ещё не время: хватка недостаточно крепка"
 nd_dnm.17.t: "Аусглейх"
 nd_dnm.17.d: "Свершилось. Две равноправные державы, один венценосец, одно войско, одна внешняя политика: Австро-Венгрия. Народы привязаны к империи согласием, и составное тело, вопреки всем пророчествам, устояло."
 nd_dnm.17.a: "Indivisibiliter ac inseparabiliter — по согласию"
 nd_dnm.18.t: "Единое государство"
 nd_dnm.18.d: "Сеймы распущены, канцелярии слиты, один закон и один язык наложены из Вены. Держава едина и послушна, и она не забудет, что у неё отняли."
 nd_dnm.18.a: "Одна корона, одно правление"
 nd_dnm.19.t: "Держава раскалывается"
 nd_dnm.19.d: "Хватка династии не удержала. Одна корона пошла своим путём, а остальные смотрят, нельзя ли последовать за ней. Составная монархия умалена и потрясена."
 nd_dnm.19.d.hun: "Хватка династии не удержала. Корона святого Стефана выковала эту унию, и её установления дали унии законность: Венгрия не может отделиться от самой себя. Своим путём идёт Богемия, а остальные смотрят, нельзя ли последовать за ней. Составная монархия умалена и потрясена."
 nd_dnm.19.d.boh: "Хватка династии не удержала. Корона святого Вацлава выковала эту унию, и её установления дали унии законность: Богемия не может отделиться от самой себя. Своим путём идёт Венгрия, а остальные смотрят, нельзя ли последовать за ней. Составная монархия умалена и потрясена."
 nd_dnm.19.a: "Удержать оставшееся"
 nd_dnm.20.t: "Война за наследство"
 nd_dnm.20.d: "Государя не стало, и право наследника оспорено. Державы, подписавшие Прагматическую санкцию, читают её теперь как приглашение. Армии идут на нераздельное наследство со всех границ."
 nd_dnm.20.a: "Держава будет защищена"
 nd_dnm.21.t: "Санкция оправдана"
 nd_dnm.21.d: "Наследство устояло. Ручавшееся на бумаге поручено кровью, и ни одна держава не станет впредь легкомысленно испытывать нераздельную державу."
 nd_dnm.21.d.welded: "Наследство устояло. Ручавшееся на бумаге поручено кровью, и бумага теперь становится державой. Короны-составляющие, стоявшие под дунайской короной младшими партнёрами и вассалами, утвердили Санкцию собственными сеймами, и между ними и Веной не осталось ничего, кроме управления: их земли, их сословия и их распри с этого дня — свои для державы. Indivisibiliter ac inseparabiliter — уже не девиз, а карта."
 nd_dnm.21.a: "Indivisibiliter ac inseparabiliter"
 nd_dnm.22.t: "Санкция сломана"
 nd_dnm.22.d: "Наследство оказалось всё же делимым. Земли и вес стали ценой оспоренной короны; держава уцелела — меньшей и униженной."
 nd_dnm.22.d.ceded: "Наследство оказалось всё же делимым, но раздел подписала собственная рука короны. Условия выторговали, пока было чем торговаться; державы взяли свою цену и разошлись. Держава уцелела, униженная, но не сломленная, и сеймы помнят, что Вена знала, когда остановиться."
 nd_dnm.22.a: "Спасти, что можно спасти"
 nd_dnm.22.b: "Это была подпись самой короны и её собственный выбор"
 nd_dnm.23.t: "Выдвинуто соперничающее притязание"
 nd_dnm.23.d: "Чужой двор выдвигает притязание самозванца и собирает союзников, чтобы его поддержать. Спор о наследовании становится коалиционной войной.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.23.a: "Сопротивляться оружием: война тянется дальше"
 nd_dnm.23.b: "Договориться об условиях и уступить то, что придётся уступить."
 nd_dnm.40.t: "Сословие просит о верности"
 nd_dnm.40.d: "Магнат одной из возвращённых корон шлёт в Вену посланца. За достойную сумму (монетой, а не патентом) его комитат объявит себя за нераздельное наследование и приведёт с собой трёх соседних владетелей. Кошелёк династии — цена публичного ответа на вопрос о наследстве.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.40.a: "Не скупиться: купить всю партию"
 nd_dnm.40.b: "Умеренная сумма: один лишь владетель"
 nd_dnm.40.c: "Отказать: династия не покупает верность"
 nd_dnm.41.t: "Чужой двор обдумывает признание"
 nd_dnm.41.d: "Посланник одной из европейских канцелярий прибыл в Вену с предложением: Санкцию признают при его дворе, если дипломатические уступки будут достаточно велики. Признание хотя бы одной великой державы лишит коалицию уверенности.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.41.a: "Полные уступки: признание куплено разом"
 nd_dnm.41.b: "Малые уступки: размеренный обмен"
 nd_dnm.41.c: "Отказать: династия не унизится до просителя"
 nd_dnm.42.t: "Мятеж самозванца в провинциях"
 nd_dnm.42.d: "Партия самозванца собрала вооружённую силу в одной из коренных провинций. Судьи бежали. На восстание надо ответить: мечом, амнистией — или ценою того, что его не заметили.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.42.a: "Раздавить восстание оружием"
 nd_dnm.42.b: "Договориться об амнистии: купить вождей, пощадить солдат"
 nd_dnm.42.c: "Не заметить: есть пожары покрупнее"
 nd_dnm.43.t: "Объезд ради санкции"
 nd_dnm.43.d: "Государя убеждают покинуть Вену и лично объехать коронные земли: Прага, Пресбург, Буда, — представляя дело династии сеймам и магнатам лицом к лицу. Странствующий двор дорог, но такой символ ничем не заменить.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.43.a: "Пышный выезд: полное торжество, полная свита"
 nd_dnm.43.b: "Скромный выезд: один лишь приезд"
 nd_dnm.43.c: "Двор не тронется из Вены"
 nd_dnm.44.t: "Корона отпадает"
 nd_dnm.44.d: "Один из сеймов-составляющих проголосовал объявить Прагматическую санкцию недействительной на своей земле; при этом присутствовали иноземные посланники. Это открытый провал нераздельного наследства и самое дорогое событие, какое способно породить это бедствие.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.44.a: "Послать войско: привести сейм под имперское знамя"
 nd_dnm.44.b: "Откупиться от сейма: выкупить его обратно"
 nd_dnm.44.c: "Уступить в самом принципе: отпадение состоялось"
 nd_dnm.45.t: "Чужой двор поддерживает самозванца"
 nd_dnm.45.d: "Соперничающая держава официально дала денег претенденту против династии. Субсидии, признание, а быть может, и договор о взаимной поруке с партией самозванца: у войны появился иноземный покровитель.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.45.a: "Встречный нажим: наши дипломаты отвечают тем же"
 nd_dnm.45.b: "Терпеть: дипломатия здесь бессильна"
 nd_dnm.46.t: "Перелом"
 nd_dnm.46.d: "Упорство династии читают по всей Европе. Магнаты, что колебались, примыкают; чужие дворы оценивают положение и отходят от партии самозванца. Наследование уже не под вопросом на каждом пороге.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.46.a: "Династия держится"
 nd_dnm.47.t: "Коалиция сжимается"
 nd_dnm.47.d: "К коалиции против наследства примкнула новая держава. Под знамя самозванца пришли дипломаты ещё трёх дворов; субсидии удваиваются. Вес династии истекает.\n\n#bold Доверие короне:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.47.a: "Терпеть: буря ещё не в самой силе"
 nd_dnm.48.t: "Провинции ропщут"
 nd_dnm.48.d: "Донесения, приходящие ко двору, поодиночке малы, а вместе безошибочны. Прошения на языках, которые канцелярии приходится переводить. Сеймы, отвечающие медленно или старыми формулами, не уступающими ничего. Податные списки, где целые деревни записаны ушедшими в леса. Ничего из этого не мятеж. Всё это — составная держава, тихо спрашивающая, надо ли ещё слушаться Вены.\n\nНедовольство можно уладить сейчас, за настоящие деньги, пока это ещё прошения. Или двор может рассудить, что это погода, а не климат, — и, возможно, окажется прав."
 nd_dnm.48.a: "Уладить недовольство сейчас: платить, пока ещё просят"
 nd_dnm.48.b: "Пусть пройдёт само: держава роптала всегда"
 nd_dnm.25.t: "Прочь из Рейха"
 nd_dnm.25.d: "Короны Дуная вышли из Священной Римской империи, а императорское достоинство сложено. Курфюрсты негодуют, курия шепчется об отступничестве, и дунайское государство стоит одно в стуже, которую само себе устроило."
 nd_dnm.25.a: "Пусть негодуют"
 nd_dnm.26.t: "Дунайское отступничество"
 nd_dnm.26.d: "До имперского и папского дворов доходит весть: дом вырвал три короны из Рейха и поставил себя отдельной империей. Этого не забудут."
 nd_dnm.26.d.boh: "До имперского и папского дворов доходит весть: корона Богемии — один из семи курфюршеских голосов, закреплённых самой Золотой буллой, — вырвала три короны из Рейха и поставила себя отдельной империей. Коллегия курфюрстов недосчиталась теперь учредителя. Из всех возможных способов этот Рейху труднее всего не заметить и труднее всего простить."
 nd_dnm.26.d.hun: "До имперского и папского дворов доходит весть: корона святого Стефана — корона, никогда вовсе не входившая в выборное устройство Рейха, — вывела Австрию и Богемию из Империи и построила на Дунае собственную державу. Чужак ушёл с двумя коронами самого Рейха. Этого не забудут."
 nd_dnm.26.d.hab: "До имперского и папского дворов доходит весть: дом Австрийский — династия, чьим единственным основанием на курфюршеское достоинство была поддельная Privilegium maius, которую сам Карл IV отказался подтвердить, — вырвал три короны из Рейха и поставил себя отдельной империей. Подделыватели привилегий подделали теперь империю. Этого не забудут."
 nd_dnm.26.a: "Этого не забудут"
 nd_dnm.27.t: "Рейх давит"
 nd_dnm.27.d: "Имперские князья и курия терпеливо работают против дунайского государства: одиночество на сеймах, холод в канцеляриях, притязания, нашёптываемые его врагам. Сейчас не остаётся ничего, кроме как терпеть и помнить, что разрыв закроется, лишь когда держава ответит на вопрос о наследовании, сломит императора в поле, купит его примирение подношением или попросту переживёт отчуждение."
 nd_dnm.27.a: "Перетерпеть"
 nd_dnm.29.t: "Обратно из стужи"
 nd_dnm.29.d: "Отчуждение окончено. Рейх и курия, скрепя сердце, говорят с дунайским государством как с державой среди держав, а не с отступником."
 nd_dnm.29.d.reich_gone: "Отчуждаться больше не от чего: Империи нет. Короны, назвавшей нас отступником, не стало, её сеймы распущены, а её опала — мёртвая буква в ничьих руках. Ссора не пережила обеих сторон не по замыслу; она просто лишилась той стороны, что её поддерживала. Наши посланники перестают повторять доводы, которых им так и не дали высказать, и Дунай остаётся судить по тому, чем он владеет, а не по тому, откуда он ушёл."
 nd_dnm.29.d.reconciled: "Посольство возвращается с имперского двора с печатями, а не с насмешкой. Подношение принято, формулы примирения прочитаны вслух, и дунайское государство признано: не то чтобы прощено, но принято. Канцелярии Европы замечают это в тот же сезон: Дунай — держава, с которой имеют дело, а корона, сумевшая закончить ссору с императором, — корона, которую стоит иметь в друзьях."
 nd_dnm.29.d.endured: "Ни договора не подписали, ни битвы не выиграли. Отчуждение просто состарилось, а затем стало причудой. Полвека посольств, принимаемых в других местах, браков, заключаемых как ни в чём не бывало, купцов, никогда ни о чём не спрашивавших, — и однажды утром канцелярии Европы замечают, что уже годами обходятся с дунайским государством как с державой среди держав, так и не решив этого. Что устояло, то и есть."
 nd_dnm.29.a: "Расчёт закрыт"
 nd_dnm.30.t: "Вопрос о наследстве"
 nd_dnm.30.d: "Держава молода, а преемство династии не решено. От венгерских комитатских сеймов до чешских сословий идёт вопрос: когда этот государь умрёт, куда уйдёт нераздельное наследство? У двора пока нет ответа, а державы Европы начинают прислушиваться.\n\nСеймы трёх корон об этом не смолчат. Решение, которое династия примет — или откажется принять, — определит грядущую войну за наследство."
 nd_dnm.30.a: "Вопрос открыт"
 nd_dnm.31.t: "Сеймы ропщут"
 nd_dnm.31.d: "Мадьярские комитаты и чешский ландтаг отправили в Вену совместное посольство. Венгры ссылаются на Aurea Bulla, чехи — на Обновлённое уложение; и те и другие спрашивают, что станет с нераздельной державой, когда корона сменит руки. Двор должен им ответить — или ответят за него.\n\n#bold Избранный здесь путь читают иноземные канцелярии, и он закладывает вес династии к началу войны за наследство.#!"
 nd_dnm.31.a: "Сплотить сословия вокруг династии"
 nd_dnm.31.b: "Двор не станет торопиться"
 nd_dnm.32.t: "Указ составлен"
 nd_dnm.32.d: "Канцелярские писцы составили указ: габсбургские земли переходят #italic indivisibiliter ac inseparabiliter#! (нераздельно и неразлучно) как одно тело единому наследнику, дочери или сыну. Подпись под ним — только двора. Утвердить его сейчас — значит провести черту наследования собственной рукой династии; оставить его следующему правлению — значит оставить вопрос державам Европы, чтобы те ответили на него армиями.\n\n#bold Решение здесь либо даёт династии сильное начало, когда придёт война за наследство, либо оставляет её обороняться.#!"
 nd_dnm.32.a: "Утвердить патентом СЕЙЧАС"
 nd_dnm.32.b: "Указ подождёт более мудрого правления"
 nd_dnm.33.t: "Рейх смирён"
 nd_dnm.33.d: "В поле приговор обращён вспять. [GetUniqueInternationalOrganization('hre').GetLeaderTitle], провозгласивший имперскую опалу против дунайского государства, теперь просит условий; имперские князья, шептавшиеся против нас на сеймах, обнаруживают, что их слова потеряли вес. Изгойские годы кончились: державы, назвавшие нас отступником, назовут нас державой."
 nd_dnm.33.a: "Приговор сломлен"
 hint_nd_dnm_reaction_of_the_reich: "[GetSituationByKey('nd_dnm_reaction_of_the_reich').GetNameWithNoTooltip]: подсказки"
 hint_nd_dnm_reaction_of_the_reich_hint_text_1: "Мы вывели свои короны из [GetUniqueInternationalOrganization('hre').GetName], чтобы поднять собственную монархию, и [GetUniqueInternationalOrganization('hre').GetLeaderTitle] нам этого не простил. У него есть против нас [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e], а мы несём $STATIC_MODIFIER_NAME_nd_dnm_reich_pariah$, пока разрыв не закрыт."
 hint_nd_dnm_reaction_of_the_reich_hint_text_2: "#T Что стоит делать:#!\n@arrow_bonus_tier_3! Решить вопрос о наследстве. [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] придёт, и любой его исход закрывает разрыв. Отстоите его — и всякая корона, что мы держим как [subject|e] или младшего партнёра унии, входит в державу целиком.\n@arrow_bonus_tier_2! Если наши армии готовы, побейте [GetUniqueInternationalOrganization('hre').GetLeaderTitle] до #Y 80%#! военного счёта и навяжите #Y смирение Рейха#!.\n@arrow_bonus_tier_2! Иначе предложите примирение. Оно стоит #Y двух годовых доходов#!, и слабый или занятый другим император примет его охотнее. Отказ стоит [prestige|e], и просить снова придётся лишь через #Y 10 лет#!.\n@arrow_bonus_tier_1! Если ничего не вышло — терпите. Через #Y 50 лет#! державу с #Y 60#! [legitimacy|e] и #Y 50#! [prestige|e] перестают считать отступником. Одно лишь время этого не сделает."
 nd_dnm_chain_header: "Наследование"
 nd_dnm_confidence_header: "Доверие короне"
 nd_dnm_two_party_dnm_str: "Сила [GetCountry('DNM').GetRelativeMilitaryStrength(GetUniqueInternationalOrganization('hre').GetLeaderCountry.Self)|V2%]"
 nd_dnm_two_party_emperor_str: "Сила [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetRelativeMilitaryStrength(GetCountry('DNM').Self)|V2%]"
 nd_dnm_reaction_of_the_reich_situation_header: "Отчуждение"
 nd_dnm_reaction_of_the_reich_situation_body: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle] и [ShowSpecialStatusName('curia')] обходятся с Дунайской монархией как с отступником.\n\nПока длится отчуждение:\n@arrow_bonus_tier_1! Монархия несёт $STATIC_MODIFIER_NAME_nd_dnm_reich_pariah$.\n@arrow_bonus_tier_1! У [GetUniqueInternationalOrganization('hre').GetLeaderTitle] есть против неё [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e].\n@arrow_bonus_tier_1! Вопрос о наследстве будет поднят при дворе в первое же десятилетие.\n@arrow_bonus_tier_1! Время от времени имперский нажим усиливается.\n\nОно кончается, когда верно хотя бы одно:\n@arrow_bonus_tier_2! [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] завершился — отстоянным или сломанным.\n@arrow_bonus_tier_2! [GetUniqueInternationalOrganization('hre').GetLeaderTitle] побит до #Y 80%#! военного счёта и вынужден принять #Y смирение Рейха#!.\n@arrow_bonus_tier_2! [GetUniqueInternationalOrganization('hre').GetLeaderTitle] принимает предложение о примирении.\n@arrow_bonus_tier_2! Проходит #Y 50#! лет, и у монархии есть #Y 60#! [legitimacy|e] и #Y 50#! [prestige|e]."
 nd_dnm_panel_dnm_header: "Что нам надо сделать"
 nd_dnm_panel_dnm_body: "Отступник — мы, и приговор снимется, только если мы будем действовать.\n\n@arrow_bonus_tier_2! #bold Законность#!: ответить на вопрос о наследстве, когда двор его поднимет, затем разрешить [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')].\n@arrow_bonus_tier_2! #bold Сила#!: побить [GetUniqueInternationalOrganization('hre').GetLeaderTitle] до #Y 80%#! военного счёта и навязать #Y смирение Рейха#!.\n@arrow_bonus_tier_2! #bold Примирение#!: предложить императору #Y два годовых дохода#!.\n@arrow_bonus_tier_2! #bold Терпение#!: #Y 50#! лет при #Y 60#! [legitimacy|e] и #Y 50#! [prestige|e]."
 nd_dnm_panel_emperor_header: "Наше дело как императора"
 nd_dnm_panel_emperor_body: "Князь Империи забрал свои короны и ушёл. У нас есть против него [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e].\n\n@arrow_bonus_tier_1! Опалу можно объявить в любое время, и она держится, пока не закроется разрыв.\n@arrow_bonus_tier_1! Победа над ним в войне отчуждения не прекращает. Закрыть его может только он сам — или мы можем его уничтожить.\n@arrow_bonus_tier_1! Он может предложить примирение. Слабый или занятый другим император соглашается охотнее."
