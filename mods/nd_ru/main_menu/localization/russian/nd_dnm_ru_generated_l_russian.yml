 nd_dnm_sue_for_imperial_reconciliation_desc: "Отправить ко двору императора торжественное посольство с подношением в два годовых дохода и прошением: чтобы дунайское государство вновь приняли как державу среди держав, а не как отступника. Слабому императору нужны друзья; занятому другим — спокойные границы; сильный и уязвлённый прилюдно посмеётся над этим шагом, и такой насмешки двор не скоро забудет."
