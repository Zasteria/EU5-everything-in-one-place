l_russian:
 ALM_f: "Альмохадский халифат"
 ALM_f_desc: "Альмохадский халифат (аль-Муваххидун, «утверждающие единство Божие») — берберская мусульманская империя, сменившая Альморавидов и объединившая Магриб и аль-Андалус под единой властью со столицей в Марракеше. Возникший из религиозно-реформаторского движения Ибн Тумарта и укреплённый Абд аль-Мумином, в пору расцвета при Якубе аль-Мансуре он простирался от атлантических берегов Марокко до Триполитании и на север в Иберию, где полуостровным престолом служила Севилья. Магрибское суннитское государство с ядром в Марракеше и Фесе, оно требует альмохадских земель в Северной Африке; воссоединение аль-Андалуса — право халифа, а не условие для него."
