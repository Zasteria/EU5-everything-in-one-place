l_russian:
 STATIC_MODIFIER_NAME_nd_eur_universal_empire: "Всемирная империя"
 STATIC_MODIFIER_DESC_nd_eur_universal_empire: "От Карла Великого до Наполеона мечта о едином европейском империуме — один закон, одно войско, одна цель — лепила облик материка. По этому замыслу Европа говорит одним голосом, а её разные народы средоточие власти и неодолимая воля сплавляют в единую цивилизацию."
 STATIC_MODIFIER_NAME_nd_eur_concert_of_sovereigns: "Концерт государей"
 STATIC_MODIFIER_DESC_nd_eur_concert_of_sovereigns: "Просвещенческий идеал добровольного содружества: суверенные народы, связанные не завоеванием, а общим правом, взаимной выгодой и разумным сотрудничеством. Каждый участник хранит своё лицо, а вместе они составляют порядок больший, чем любая империя. Это Европа, какой её видел Кант: вечный мир через добровольный союз."
 nd_eur.1.t: "Объединение Европы"
 nd_eur.1.d: "То, чего не достиг ни один император, ни один папа, ни один завоеватель, совершили мы. Материк Европа, от атлантических берегов до уральского рубежа, от мёрзлого севера до средиземноморского солнца, стоит единым под одним знаменем. Это венец тысячи лет общей цивилизации: соборы, что пронзают всякий небосвод, университеты, что светят во всяком городе, торговые пути, что связывают всякий рынок.\n\nНо каким быть этому союзу, ещё предстоит решить. Выкуется ли Европа в единый империум, где народы её соединены одним престолом и одним законом, как мечталось Карлу Великому и Наполеону? Или станет она концертом суверенных народов, добровольно связанных общими началами и взаимным уважением, как задумывали философы Просвещения?\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_eur.1.a: "Один престол, один закон, одна Европа"
 nd_eur.1.b: "Концерт свободных народов, связанных разумом"
 nd_eur.2.t: "Республика учёных"
 nd_eur.2.d: "По всей шири нашего единого материка укоренилась революция ума. Учёные, философы и естествоиспытатели свободно переписываются через те границы, что были некогда враждебными. От парижских салонов до венских кофеен, от лондонских лабораторий до падуанских обсерваторий знание течёт беспрепятственно.\n\nЭта Республика учёных, сообщество разума поверх языка и вероисповедания, — нечто небывалое в человеческой истории. Накопленная мудрость всех европейских народов, свободно разделяемая и приумножаемая, породила такой взрыв открытий, какого не достиг бы в одиночку ни один народ."
 nd_eur.2.a: "Пусть знание течёт свободно через все границы"
 nd_eur.3.t: "Конгресс наций"
 nd_eur.3.d: "Великие державы нашего европейского государства собрались на конгресс, чтобы обсудить дела общей заботы. Век двусторонней дипломатии уступает место новому порядку — совместному обсуждению народами материка.\n\nПример, поданный в Вестфалии и отточенный в Утрехте и Вене, вырос в нечто большее: в постоянное устройство для разрешения споров, ведения торговли и согласования политики по всему материку. Но каким быть этому конгрессу, всё ещё оспаривается."
 nd_eur.3.a: "Возобладают дипломатия и общее управление"
 nd_eur.3.b: "Порядок должен быть наложен сильными"
 nd_eur.4.t: "Промышленное схождение"
 nd_eur.4.d: "Превращение, начавшееся в отдельных мастерских и рудниках, стало явлением материковым. Железные дороги связывают теперь всякий крупный город. Заводы работают по общим меркам. Сырьё течёт с окраин к промышленным средоточиям, а изделия возвращаются обратно, создавая слитное хозяйство небывалого размаха.\n\nЭто промышленное схождение открывает две дороги: мы можем направить его силу на рост производительной мощи, строя пути и сооружения, что вяжут материк всё теснее, — или взяться за расширение торгового охвата, заводя европейские торговые сети по всему свету."
 nd_eur.4.a: "Заложить промышленное основание материка"
 nd_eur.4.b: "Раскинуть наши торговые сети по всему свету"
 STATIC_MODIFIER_NAME_nd_eur_republic_of_letters_flourishing: "Цветущая Республика учёных"
 STATIC_MODIFIER_DESC_nd_eur_republic_of_letters_flourishing: "Свободный обмен знанием через европейские границы дал небывалое ускорение открытиям и учению."
 STATIC_MODIFIER_NAME_nd_eur_congress_diplomacy: "Конгрессная дипломатия"
 STATIC_MODIFIER_DESC_nd_eur_congress_diplomacy: "Конгрессное устройство завело порядок совместного обсуждения и дипломатического разрешения споров, что связывает народы Европы воедино."
 STATIC_MODIFIER_NAME_nd_eur_imposed_order: "Наложенный материковый порядок"
 STATIC_MODIFIER_DESC_nd_eur_imposed_order: "Сильные налагают порядок на материк, обеспечивая устойчивость строгой властью, а не выговоренным согласием."
 nd_eur_industrial_convergence_modifier: "Промышленное схождение"
 nd_eur_industrial_convergence_modifier_desc: "Промышленная мощь материка растёт, ибо общие мерки и связанные пути создают слитное хозяйство."
 STATIC_MODIFIER_NAME_nd_eur_commercial_expansion: "Материковое торговое расширение"
 STATIC_MODIFIER_DESC_nd_eur_commercial_expansion: "Европейские торговые сети тянутся по всему свету и несут изделия материковой промышленности в каждый его угол."
 nd_eur_latin_christendom: "Латинское христианство"
 nd_eur_latin_christendom_desc: "Общее религиозное наследие средневековой Европы, выраженное соборными школами, монастырской учёностью и всеобщим языком латыни, заложило основы общего европейского лица."
 nd_eur_champagne_fairs: "Шампанские ярмарки"
 nd_eur_champagne_fairs_desc: "Великие торговые ярмарки Шампани, Фландрии и Рейнской земли создали первые общеевропейские торговые сети, связав итальянских купцов с фламандскими ткачами и ганзейскими торговцами."
 nd_eur_gothic_cathedrals: "Готические соборы"
 nd_eur_gothic_cathedrals_desc: "Великие готические соборы — Шартр, Кёльн, Реймс, Бургос — первое подлинно материковое архитектурное движение Европы. Возводимые поколениями странствующих мастеров, они выразили общую веру камнем и светом."
 nd_eur_feudal_host: "Феодальное ополчение"
 nd_eur_feudal_host_desc: "Феодальный порядок военной повинности, где вассал был должен господину службу с оружием, создал ту латную конницу, что веками властвовала на европейских полях сражений."
 nd_eur_studia_generalia: "Studia Generalia"
 nd_eur_studia_generalia_desc: "Средневековые университеты Болоньи, Парижа и Оксфорда, studia generalia, признанные папой и императором, создали общеевропейскую учёную верхушку поверх границ, учили на латыни и заложили основы нынешней науки."
 nd_eur_urban_communes: "Городские коммуны"
 nd_eur_urban_communes_desc: "Самоуправляющиеся городские коммуны, что расцвели от ганзейских городов до итальянских городов-государств, создали особый европейский обычай гражданской самостоятельности, торгового устава и бюргерского достатка.\n\n#italic Доступно в: $nd_eur_trade_fair$#!"
 nd_eur_renaissance_humanism: "Гуманизм Возрождения"
 nd_eur_renaissance_humanism_desc: "Новое открытие античной учёности, начавшееся в Италии и разошедшееся по материку, преобразило европейское искусство, философию и управление. Гуманисты вернули тексты Цицерона и Аристотеля и тем зажгли переворот в культуре."
 nd_eur_banking_revolution: "Банкирский переворот"
 nd_eur_banking_revolution_desc: "Великие банкирские дома — Медичи во Флоренции, Фуггеры в Аугсбурге, Вельзеры в Нюрнберге — изобрели нынешние денежные дела. Заёмные письма, двойная бухгалтерия и сети международного кредита сделали материковую торговлю возможной."
 nd_eur_pike_and_shot: "Пики и мушкеты"
 nd_eur_pike_and_shot_desc: "Сочетание сомкнутого пикейного строя с огнестрельным оружием преобразило европейскую войну. От швейцарских пикинёров до испанских терций этот тактический переворот покончил с веком латного рыцаря."
 nd_eur_age_of_exploration: "Век открытий"
 nd_eur_age_of_exploration_desc: "Европейские мореходы — португальцы, испанцы, англичане, голландцы — вышли за пределы известного мира, обогнули Африку, пересекли Атлантику и обошли земной шар. Их суда открыли морские пути, связавшие материки."
 nd_eur_printing_press_revolution: "Переворот книгопечатания"
 nd_eur_printing_press_revolution_desc: "Гутенбергов печатный станок с подвижными литерами, изобретённый в Майнце около 1440 года, за десятилетия разошёлся по Европе. К 1500 году было напечатано более двадцати миллионов томов, что сделало знание доступным и питало Реформацию, научный переворот и Просвещение.\n\n#italic Доступно в: $nd_eur_universitas$#!"
 nd_eur_court_magnificence: "Придворное великолепие"
 nd_eur_court_magnificence_desc: "Взращивание придворного блеска, от изощрённого чина бургундского двора до покровительства Медичи художникам, завело особый европейский обычай государственной славы, выраженной зодчеством, искусством и обрядом."
 nd_eur_trace_italienne: "Trace italienne"
 nd_eur_trace_italienne_desc: "Угловатые приземистые звёздные крепости, выработанные итальянскими военными инженерами в ответ на пороховую артиллерию, преобразили европейскую войну. Эти укрепления, позже доведённые Вобаном, перекроили границы и удлинили осады по всему материку."
 nd_eur_professional_diplomacy: "Кадровая дипломатия"
 nd_eur_professional_diplomacy_desc: "Появление постоянных посольств, кадровых послов и дипломатического чина, начатое итальянскими городами-государствами и отточенное Францией, создало европейский порядок международных отношений, что стоит и поныне."
 nd_eur_joint_stock_companies: "Акционерные компании"
 nd_eur_joint_stock_companies_desc: "Акционерная компания, от Casa di San Giorgio до великих Ост-Индских компаний, позволила складывать средства тысяч вкладчиков. Эта новинка оплатила европейские открытия, заселение заморских земель и всемирную торговлю."
 nd_eur_military_revolution: "Военный переворот"
 nd_eur_military_revolution_desc: "Превращение европейских войск из феодальных наборов в выученный строй пики и мушкета перекроило войну. Испанская терция, голландский контрмарш и полковое устройство создали те кадровые армии, что властвовали над миром."
 nd_eur_cuius_regio: "Cuius Regio"
 nd_eur_cuius_regio_desc: "Начало «чья держава, того и вера», установленное Аугсбургским миром 1555 года и подтверждённое в Вестфалии, было тяжело давшимся Европе примирением после поколений религиозных войн. Оно признало разность вер как данность европейской жизни."
 nd_eur_scientific_method: "Научный метод"
 nd_eur_scientific_method_desc: "Порядок постижения природы через наблюдение, догадку и опыт вырос из умственного брожения европейских университетов и академий. Галилей, Кеплер и Гарвей заложили основы нынешней науки.\n\n#italic Доступно в: $nd_eur_colonial_exchange$#!"
 nd_eur_broadside_warfare: "Бортовой залп"
 nd_eur_broadside_warfare_desc: "Появление парусного военного корабля с бортовой батареей, от каракки до галеона, дало европейским флотам власть над океанами. Тактика линии баталии сводила сокрушительный огонь в согласованные залпы."
 nd_eur_westphalian_order: "Вестфальский порядок"
 nd_eur_westphalian_order_desc: "Вестфальский мир 1648 года установил основные начала европейских международных отношений: суверенитет государства, невмешательство во внутренние дела и разрешение споров дипломатическим конгрессом."
 nd_eur_standing_armies: "Постоянные армии"
 nd_eur_standing_armies_desc: "Переход от феодальных наборов и наёмных рот к постоянному кадровому войску преобразил европейское государство. Единообразная выучка, исправное жалованье и кадровые офицеры создали те выученные силы, что вылепили нынешний мир."
 nd_eur_republic_of_letters: "Республика учёных"
 nd_eur_republic_of_letters_desc: "Общеевропейская сеть учёной переписки, расцветшая с семнадцатого века и связавшая мыслителей от Лондона до Константинополя. Через письма, журналы и учёные общества Республика учёных создала наднациональное сообщество знания."
 nd_eur_mercantilist_manufactures: "Меркантилистские мануфактуры"
 nd_eur_mercantilist_manufactures_desc: "Направляемая государством промышленность меркантилистского склада создала королевские мануфактуры, арсеналы и казённые заведения, преобразившие европейские хозяйства, — от шпалерных мастерских Кольбера до фарфоровых заводов Фридриха."
 nd_eur_vauban_fortifications: "Укрепления Вобана"
 nd_eur_vauban_fortifications_desc: "Доведённая маршалом Вобаном звёздная крепость с её правильными бастионами, прикрытыми путями и перекрёстным огнём стала вершиной европейского военного строительства. Его осадные параллели и рикошетная стрельба брали крепости так же верно, как его бастионы их удерживали."
 nd_eur_baroque_splendor: "Великолепие барокко"
 nd_eur_baroque_splendor_desc: "Барокко прокатилось по всей Европе, от Рима Бернини до дворцов Вены и Версаля. Это материковое явление культуры выразило силу и уверенность европейского государства монументальным зодчеством, музыкой и искусством."
 nd_eur_global_maritime_reach: "Всемирный морской охват"
 nd_eur_global_maritime_reach_desc: "Европейские флоты с линейными кораблями бортового залпа установили власть над океанами. От Карибского до Южно-Китайского моря европейская морская сила несла материковое влияние по всему свету."
 nd_eur_enlightenment_philosophy: "Философия Просвещения"
 nd_eur_enlightenment_philosophy_desc: "Просвещение, от Локка и Вольтера до Канта и Монтескьё, произвело переворот в европейской мысли. Понятия естественных прав, разделения властей и общественного договора преобразили управление по всему материку."
 nd_eur_congress_of_nations: "Конгресс наций"
 nd_eur_congress_of_nations_desc: "Развитие европейской дипломатии от двусторонних договоров к конгрессному порядку, где великие державы совместно решали дела материковой заботы, — от Вестфалии через Утрехт к Вене."
 nd_eur_grande_armee: "Великая армия"
 nd_eur_grande_armee_desc: "Наполеоновский образец Великой армии — огромные гражданские войска, сведённые в самодостаточные корпуса, где пехота, конница и артиллерия соединены в единое сокрушительное орудие, — заново определил европейскую войну."
 nd_eur_academy_of_sciences_tradition: "Академия наук"
 nd_eur_academy_of_sciences_tradition_desc: "Великие европейские академии — лондонское Королевское общество, парижская Академия наук, академии Берлина, Санкт-Петербурга и Стокгольма — придали научному поиску устроенный вид и создали основу для приращения знания."
 nd_eur_imperial_arsenal_tradition: "Императорский арсенал"
 nd_eur_imperial_arsenal_tradition_desc: "Единообразная выделка вооружения, начатая венецианским арсеналом, льежскими оружейными и шведскими пушечными литейнями, дала европейским войскам перевес, перекроивший равновесие сил в мире."
 nd_eur_first_rate_supremacy: "Первенство кораблей первого ранга"
 nd_eur_first_rate_supremacy_desc: "Линейный корабль первого ранга, несущий сто и более орудий на трёх деках, был мощнейшей подвижной боевой машиной в человеческой истории. Европейские верфи строили эти плавучие крепости в количествах, невиданных нигде более."
 nd_eur_perpetual_peace: "Вечный мир"
 nd_eur_perpetual_peace_desc: "Кантово видение вечного мира через содружество свободных республик — добровольное, всечеловеческое, связанное всеобщим правом, а не имперской силой, — есть высшее чаяние Просвещения для европейской цивилизации."
 nd_eur_industrial_convergence: "Промышленное схождение"
 nd_eur_industrial_convergence_desc: "Распространение промышленных умений по материку, от британских новшеств к бельгийским, французским, немецким и дальше, создало слитное европейское промышленное хозяйство, связанное железными дорогами, телеграфом и общими мерками."
 STATIC_MODIFIER_NAME_nd_eur_industrial_convergence: "Промышленное схождение"
 STATIC_MODIFIER_DESC_nd_eur_industrial_convergence: "Распространение промышленных умений по материку, от британских новшеств к бельгийским, французским, немецким и дальше, создало слитное европейское промышленное хозяйство, связанное железными дорогами, телеграфом и общими мерками."
 nd_eur_citizen_army: "Гражданское войско"
 nd_eur_citizen_army_desc: "Всеобщий набор Французской революции преобразил войну: весь народ поднимался на оборону, давая огромные войска граждан-солдат, одушевлённых любовью к отечеству. Всякая европейская держава была вынуждена перенять то или иное подобие этой новинки."
 nd_eur_ius_gentium: "Ius Gentium"
 nd_eur_ius_gentium_desc: "Право народов Гуго Гроция, ius gentium, заложило основы нынешнего международного права. Правила о ведении войны, посольствах, торговле и правах народов создали правовой уклад европейского и всемирного порядка."
 nd_eur_continental_telegraph: "Материковый телеграф"
 nd_eur_continental_telegraph_desc: "Электрический телеграф связал европейские столицы минутами вместо дней. Этот переворот в связи позволил быстро согласовывать политику, торговлю и военные действия по всему материку.\n\n#italic Доступно в: $nd_eur_continental_railway$#!"
 nd_eur_universal_education: "Всеобщее образование"
 nd_eur_universal_education_desc: "Просвещенческий идеал всеобщего образования, осуществлённый народными школами и публичными библиотеками, создал самые грамотные общества в истории и заложил основу промышленной современности."
 nd_eur_ironclad_fleet: "Броненосный флот"
 nd_eur_ironclad_fleet_desc: "Переход от деревянных парусников к паровым броненосцам разом обратил века морского обычая в прах. Европейские верфи вели это превращение, выпуская броненосные эскадры, что властвовали над морями."
 nd_eur_grand_exhibition: "Всемирная выставка"
 nd_eur_grand_exhibition_desc: "Великие выставки — лондонский Хрустальный дворец 1851 года, парижская 1855 года и их преемницы — показали миру достижения европейской промышленности, науки и искусства. Они стали вершиной европейской уверенности в прогрессе и цивилизации."
 a_nd_eur_man_at_arms: "Европейский латник"
 a_nd_eur_man_at_arms_desc: "Тяжело оснащённые конные воины из феодального дворянства — лучшее, что дал средневековый европейский рыцарский обычай."
 a_nd_eur_pikeman: "Европейский пикинёр"
 a_nd_eur_pikeman_desc: "Выученная пехота с длинными пиками, обученная держать строй против конного удара. Костяк переворота пики и мушкета."
 n_nd_eur_exploration_carrack: "Каракка первооткрывателей"
 n_nd_eur_exploration_carrack_desc: "Крепкое океанское судно, устроенное для дальних плаваний. Быстрее и поворотливее обычной каракки, такие корабли открыли морские пути в Новый Свет и Ост-Индию."
 a_nd_eur_tercio: "Европейская терция"
 a_nd_eur_tercio_desc: "Соединённый строй пики и мушкета: терция была главным пехотным строем шестнадцатого века. Эти выученные каре соединяли оборонительную стойкость с наступательным огнём."
 n_nd_eur_galleon: "Европейский галеон"
 n_nd_eur_galleon_desc: "Совершенный океанский военный корабль, соединивший тяжёлое вооружение с лучшей мореходностью. Галеон властвовал и на атлантических торговых путях, и в морской войне века открытий."
 a_nd_eur_line_infantry: "Европейская линейная пехота"
 a_nd_eur_line_infantry_desc: "Кадровые солдаты, обученные линейной тактике и бьющие залпами в сомкнутых шеренгах. Постоянные армии великих держав Европы стояли на этом надёжном, вышколенном строю."
 n_nd_eur_ship_of_the_line: "Линейный корабль"
 n_nd_eur_ship_of_the_line_desc: "Мощный корабль бортового залпа, устроенный для боя в линии баталии и дающий сокрушительные согласованные залпы. Такие суда составляли костяк флота всякой европейской великой державы."
 a_nd_eur_grenadier: "Европейский гренадер"
 a_nd_eur_grenadier_desc: "Отборная ударная пехота, набранная за рост и храбрость и обученная поначалу метать гранаты в укрепления. Гренадерские роты стали первыми штурмовыми войсками европейских армий."
 n_nd_eur_first_rate: "Корабль первого ранга"
 n_nd_eur_first_rate_desc: "Крупнейший и тяжелее всех вооружённый корабль на плаву: трёхдечник со ста с лишним орудиями. Такие плавучие крепости стоили непомерно дорого, и строить и содержать их могли лишь величайшие морские державы."
 a_nd_eur_fusilier: "Европейский фузилёр"
 a_nd_eur_fusilier_desc: "Граждане-солдаты революционной Европы, вооружённые новыми мушкетами и одушевлённые любовью к отечеству. Набранные во множестве, они бились с решимостью свободных людей, защищающих родину."
 n_nd_eur_ironclad: "Европейский броненосец"
 n_nd_eur_ironclad_desc: "Паровой военный корабль, одетый в железную броню, обративший деревянные парусные флоты в древность. Броненосец был остриём европейского промышленного и корабельного дела."
 nd_eur_trade_fair: "Ярмарочный двор"
 nd_eur_trade_fair_desc: "Постоянный рыночный двор на пересечении больших торговых путей, где на сезонных ярмарках купцы со всего материка меняют товар, сводят счета и уговариваются о поставках."
 nd_eur_great_cathedral: "Великий собор"
 nd_eur_great_cathedral_desc: "Монументальный готический собор, чьи взлетающие своды, аркбутаны и витражи выражают общее религиозное и художественное наследие европейской цивилизации."
 nd_eur_universitas: "Universitas"
 nd_eur_universitas_desc: "Самоуправляющееся сообщество учёных и школяров по образцу великих средневековых университетов Болоньи, Парижа и Оксфорда, где учение не знает государственных границ."
 nd_eur_banking_house: "Банкирский дом"
 nd_eur_banking_house_desc: "Денежное заведение, что ведёт сети международного кредита, выпускает заёмные письма и питает торговлю и казённые предприятия по всему материку."
 nd_eur_grand_palace: "Большой дворец"
 nd_eur_grand_palace_desc: "Великолепная государева резиденция в обычае барокко: и седалище правления, и показ силы державы через зодчество, сады и покровительство искусствам."
 nd_eur_star_fortress: "Звёздная крепость"
 nd_eur_star_fortress_desc: "Угловатое укрепление, устроенное выдерживать артиллерийский обстрел: приземистые бастионы, широкие рвы и перекрёстный огонь. Trace italienne, доведённая Вобаном."
 nd_eur_colonial_exchange: "Колониальная биржа"
 nd_eur_colonial_exchange_desc: "Приморский торговый двор, где принимают, разбирают и развозят по материковым рынкам товары заморских держав: пряности с Востока, серебро из Америк, меха с Севера."
 nd_eur_state_manufactory: "Казённая мануфактура"
 nd_eur_state_manufactory_desc: "Направляемое государством заведение, где умелые мастера выделывают единообразный товар по меркантилистским началам: шпалеры, фарфор, часы и тонкую работу по металлу."
 nd_eur_academy_of_sciences: "Академия наук"
 nd_eur_academy_of_sciences_desc: "Учёное общество, посвящённое приращению естественной философии, математики и механических искусств, по образцу Королевского общества и парижской Академии наук."
 nd_eur_imperial_arsenal: "Императорский арсенал"
 nd_eur_imperial_arsenal_desc: "Огромный оружейный завод, выпускающий единообразные пушки, мушкеты и боевые припасы для армий и флотов единой Европы."
 nd_eur_continental_railway: "Материковая железная дорога"
 nd_eur_continental_railway_desc: "Железная дорога, связывающая города Европы и позволяющая быстро перемещать товары, людей и войска по всему материку."
 nd_eur_exhibition_hall: "Выставочный дворец"
 nd_eur_exhibition_hall_desc: "Величественный павильон, где показаны промышленные, научные и художественные достижения европейской цивилизации, привлекающий посетителей и славу со всего света."
 nd_eur_fair_goods_processing: "Обработка ярмарочного товара"
 nd_eur_fair_goods_processing_desc: "Ремесленники ярмарочного двора обращают сырые ткани в готовое сукно, прибавляя ему цены крашением и отделкой."
 nd_eur_fair_maintenance: "Содержание ярмарки"
 nd_eur_fair_maintenance_desc: "Содержание торговых рядов, складов и общих служб ярмарочного двора."
 nd_eur_cathedral_maintenance: "Содержание собора"
 nd_eur_cathedral_maintenance_desc: "Нескончаемая работа по содержанию великого собора: починка кладки, замена стекла и сбережение самого здания."
 nd_eur_printed_works: "Печатные труды"
 nd_eur_printed_works_desc: "Университетские учёные и печатники выпускают переплетённые тома античных текстов, научных трактатов и богословских сочинений для всей Европы."
 nd_eur_universitas_maintenance: "Содержание университета"
 nd_eur_universitas_maintenance_desc: "Снабжение университета бумагой, книгами и свечами для его залов и книгохранилищ."
 nd_eur_banking_maintenance: "Банкирское дело"
 nd_eur_banking_maintenance_desc: "Ведение счётных книг, переписки и самого здания международного банкирского дома."
 nd_eur_palace_maintenance: "Содержание дворца"
 nd_eur_palace_maintenance_desc: "Величие дворца в обычае барокко требует непрестанных вложений в материалы и умелый труд."
 nd_eur_bastion_maintenance: "Содержание бастионов"
 nd_eur_bastion_maintenance_desc: "Содержание стен, бастионов, вооружения и гарнизонных припасов звёздной крепости."
 nd_eur_scientific_instruments: "Научные приборы"
 nd_eur_scientific_instruments_desc: "Умелые мастера делают точные приборы — телескопы, микроскопы, навигационные снасти — для европейских учёных и мореходов."
 nd_eur_exchange_maintenance: "Содержание биржи"
 nd_eur_exchange_maintenance_desc: "Работа складов, контор и пристаней колониальной биржи."
 nd_eur_manufactory_production: "Мануфактурная выделка"
 nd_eur_manufactory_production_desc: "Казённая выделка единообразных орудий и снастей из железа, угля и леса."
 nd_eur_manufactory_maintenance: "Содержание мануфактуры"
 nd_eur_manufactory_maintenance_desc: "Содержание оборудования, запасов топлива и сырья казённой мануфактуры."
 nd_eur_academy_maintenance: "Содержание академии"
 nd_eur_academy_maintenance_desc: "Снабжение академии наук книгами, бумагой и лабораторными приборами."
 nd_eur_arsenal_production: "Выделка арсенала"
 nd_eur_arsenal_production_desc: "Литьё бронзовых и чугунных пушек в императорском арсенале и снабжение европейских войск единообразным вооружением."
 nd_eur_arsenal_maintenance: "Содержание арсенала"
 nd_eur_arsenal_maintenance_desc: "Содержание горнов, мастерских и складов императорского арсенала."
 nd_eur_telegraph_relay: "Телеграфная передача"
 nd_eur_telegraph_relay_desc: "Работа телеграфных станций вдоль железных дорог, что позволяет быстро сноситься по всему материку."
 nd_eur_railway_maintenance: "Содержание железной дороги"
 nd_eur_railway_maintenance_desc: "Содержание путей, мостов, станций и подвижного состава материковой железной дороги."
 nd_eur_exhibition_maintenance: "Содержание выставки"
 nd_eur_exhibition_maintenance_desc: "Содержание павильонов, экспозиций и угодий выставочного дворца."
 nd_eur_formed_tt: "Европа объединена"
 nd_eur_path_a_tt: "Выбрана судьба #bold Всемирная империя#!"
 nd_eur_path_b_tt: "Выбрана судьба #bold Концерт государей#!"
 nd_eur_destiny: "Судьба Европы"
 nd_eur_destiny_desc: "Материк стоит единым. Теперь приходит подлинное испытание: какой цивилизацией станет эта Европа? Сохраняйте устойчивость, выбирая путь, что определит новую эпоху человеческой истории."
 nd_eur_dest_imperium: "Imperium Mundi"
 nd_eur_dest_imperium_desc: "Наследники Рима и Карла Великого смотрят на восток и на юг. Константинополь, Иерусалим и Александрия, древние седалища империи и веры, должны перейти под европейскую руку. Лишь когда эти прославленные города склонятся перед нашим знаменем, Всемирная империя сможет притязать на своё наследство."
 nd_eur_dest_global_reach: "Всемирный империум"
 nd_eur_dest_global_reach_desc: "Власть Европы должна простереться за пределы материка. С флотами, достающими до любого моря, водрузите наше знамя в древних столицах ацтекского и китайского миров. От Теночтитлана до Гуанчжоу европейская сила должна охватить каждый океан и каждый материк."
 nd_eur_dest_pax_europaea: "Pax Europaea"
 nd_eur_dest_pax_europaea_desc: "Последнее выражение Всемирной империи: неоспоримый европейский мир, поддерживаемый по всему свету. От Ганга до Карибского моря, от Малаккского пролива до Великих равнин европейское оружие должно ручаться за порядок повсюду. Такой мир держится лишь на высшей военной силе — Великой армии всей Европы, вооружённой из пяти имперских арсеналов."
 nd_eur_dest_common_market: "Общий рынок"
 nd_eur_dest_common_market_desc: "Концерт государей начинается с торговли. Постройте материковый рынок, где свободно текут роскошные товары мира: шёлк с Востока, тонкое сукно наших собственных мастерских. Европе, связанной торговлей, не понадобятся цепи."
 nd_eur_dest_enlightened_continent: "Материковое Просвещение"
 nd_eur_dest_enlightened_continent_desc: "Свет разума должен озарить всякий угол материка. Примите научный переворот, копите богатство мирной промышленностью и заслужите ту славу, что даётся самой передовой цивилизации мира."
 nd_eur_dest_eternal_peace: "Вечный мир"
 nd_eur_dest_eternal_peace_desc: "Мечта Канта наяву: содружество свободных народов, промышленных и просвещённых, связанных правом, а не силой. Примите и промышленный переворот, и гражданское войско — не ради завоеваний, а как двойное основание цивилизации, которой стоять вечно."
 nd_eur.5.t: "Судьба Европы"
 nd_eur.5.d: "Объединение Европы завершено, но подлинная работа только началась. Материк разных народов, языков и обычаев стоит под одним знаменем впервые со времён падения Рима. От того, как мы будем править этим небывалым свершением, зависит, достигнет ли европейская цивилизация полноты своих сил или снова рассыплется на грызущиеся королевства.\n\nОснование заложено. Теперь нам на нём строить."
 nd_eur.5.a: "Судьбу Европы выковать нам"
 nd_eur.6.t: "Наследство Рима"
 nd_eur.6.d: "Наши войска вошли в Константинополь и Иерусалим, города, что некогда очерчивали пределы просвещённого мира. Святая София и храм Гроба Господня стоят теперь в наших границах. То, что начал Рим, к чему тянулся Карл Великий, о чём мечтали крестоносцы, совершили мы.\n\nДревние императорские столицы наши. Всемирная империя наследует достоинство всякого империума, что был до неё."
 nd_eur.6.a: "Мы — наследники всей цивилизации"
 nd_eur.7.t: "Материковый рынок"
 nd_eur.7.d: "Первое великое свершение Концерта государей — не победа оружия, а победа хозяйства. Шёлк и тонкое сукно текут через наши столичные рынки, и роскошные товары мира доступны нашим гражданам не завоеванием, а торговлей. Купцы всякого европейского народа торгуют свободно, по общему праву и общим меркам.\n\nВот основание, на котором строится долгий мир: общее благоденствие."
 nd_eur.7.a: "Достаток свяжет то, чего не свяжет сила"
 nd_eur.8.t: "Всемирный империум"
 nd_eur.8.d: "Европейские знамёна веют над Теночтитланом и Гуанчжоу. Великие цивилизации Америк и Азии введены в наш круг. Вопрос теперь в том, как править этими огромными новыми владениями.\n\nБудем ли мы нести свою морскую силу через океаны, строя морскую державу, что держит мировые пути? Или сосредоточим военную мощь на сердцевине материка, выковав непобедимое войско, которому никакая сила на земле не ровня?"
 nd_eur.8.a: "Владей морями — и мир последует за тобой"
 nd_eur.8.b: "Наши легионы будут непобедимы на суше"
 nd_eur.9.t: "Материковое Просвещение"
 nd_eur.9.d: "Научный переворот укоренился по всей Европе. Наши академии, университеты и учёные общества породили взрыв знания, невиданный в человеческой истории. Богатство, накопленное мирной торговлей, оплачивает новые открытия, а слава нашей цивилизации влечёт учёных со всех концов света.\n\nКуда направить эту умственную силу?"
 nd_eur.9.a: "Открыть наши рынки и строить свободно"
 nd_eur.9.b: "Воспитать новое поколение дипломатов"
 nd_eur.10.t: "Pax Europaea"
 nd_eur.10.d: "От Дели до Тумасика, от Гаваны до дальних углов всякого материка европейская сила неоспорима. Величайшее войско, какое когда-либо собиралось, готово блюсти мир по всему свету. Это вершина Всемирной империи — Pax Europaea.\n\nНо чем этот мир держать? Подавляющей наступательной силой, что раздавит всякое сопротивление? Или терпеливой работой соединения, вбирающей покорённые народы в европейское лоно?"
 nd_eur.10.a: "Наступательное превосходство обеспечит долгий мир"
 nd_eur.10.b: "Соединить и просветить мир"
 nd_eur.11.t: "Вечный мир"
 nd_eur.11.d: "Кант писал о вечном мире через содружество свободных республик. Мы превзошли даже его видение. Концерт государей — промышленный, просвещённый, связанный общим правом и взаимным уважением — стоит самой передовой цивилизацией в человеческой истории.\n\nДва последних видения спорят за душу этого свершения. Построим ли мы промышленный рай, управляемый просвещёнными республиканскими началами? Или создадим всемирный конгресс, вынеся наш образец согласного общежития всякому народу на земле?"
 nd_eur.11.a: "Построить республику прогресса"
 nd_eur.11.b: "Созвать конгресс всех народов"
 STATIC_MODIFIER_NAME_nd_eur_dest_colonial_supremacy: "Колониальное первенство"
 STATIC_MODIFIER_DESC_nd_eur_dest_colonial_supremacy: "Европейские флоты властвуют над всяким океаном. Наши блокады неодолимы, наши моряки неисчерпаемы, хотя содержание такого флота напрягает даже наши огромные средства."
 STATIC_MODIFIER_NAME_nd_eur_dest_continental_domination: "Материковое владычество"
 STATIC_MODIFIER_DESC_nd_eur_dest_continental_domination: "Европейское войско — сильнейшее на земле. Огромные наборы и отборная конница проводят имперскую волю на всяком рубеже, хотя цена таких армий питает вздорожание."
 STATIC_MODIFIER_NAME_nd_eur_dest_universal_monarchy: "Всемирная монархия"
 STATIC_MODIFIER_DESC_nd_eur_dest_universal_monarchy: "Единый престол правит величайшей военной машиной мира. Европейские военачальники берут почин в каждом деле, а их войска оправляются от неудач с поразительной быстротой."
 STATIC_MODIFIER_NAME_nd_eur_dest_roman_peace: "Римский мир"
 STATIC_MODIFIER_DESC_nd_eur_dest_roman_peace: "Подобно Риму до неё, Европейская империя вбирает покорённые народы в свою цивилизацию. Соединение и обращение идут с небывалой быстротой в духе новизны."
 STATIC_MODIFIER_NAME_nd_eur_dest_free_exchange: "Свободный обмен"
 STATIC_MODIFIER_DESC_nd_eur_dest_free_exchange: "Концерт государей понизил преграды торговле и строительству по всему материку. Корабли строятся быстрее, здания стоят дешевле, и дух свободной торговли берёт верх."
 STATIC_MODIFIER_NAME_nd_eur_dest_diplomatic_academy: "Дипломатическая академия"
 STATIC_MODIFIER_DESC_nd_eur_dest_diplomatic_academy: "Материковый обычай кадровой дипломатии укоренился. Присоединение ведётся умелыми переговорами и славою короны, хотя дипломатическое ведомство обходится недёшево."
 STATIC_MODIFIER_NAME_nd_eur_dest_industrial_harmony: "Промышленное согласие"
 STATIC_MODIFIER_DESC_nd_eur_dest_industrial_harmony: "Концерт государей достиг того, о чём мечтали философы: согласной промышленной республики, где прогресс и свобода идут вместе."
 STATIC_MODIFIER_NAME_nd_eur_dest_world_congress: "Всемирный конгресс"
 STATIC_MODIFIER_DESC_nd_eur_dest_world_congress: "Образец европейского сотрудничества вынесен в мир. Влияние культуры расходится вовне, а споры между народами выносятся на конгресс и решаются там."
 nd_eur_imperial_command: "Императорская ставка"
 nd_eur_imperial_command_desc: "Высшее военное управление Всемирной империи, что направляет войска и гарнизоны по всему свету из единого укреплённого средоточия штабных палат, конюшен и сигнальных башен."
 nd_eur_congress_hall: "Дворец конгресса"
 nd_eur_congress_hall_desc: "Величественное гражданское здание, где представители Концерта государей обсуждают дела материкового управления, торгового устава и приращения знания."
 nd_eur_command_maintenance: "Содержание ставки"
 nd_eur_command_maintenance_desc: "Содержание сигнальных снастей, конюшен, картографических палат и присутственных мест высшего военного управления."
 nd_eur_congress_maintenance: "Содержание конгресса"
 nd_eur_congress_maintenance_desc: "Содержание залов, архивов и посольских служб материкового дворца конгресса."
 eur_imperial_diet_bureaucracy: "Рейхстаг"
 eur_imperial_diet_bureaucracy_desc: "По образцу рейхстага Священной Римской империи (1495–1806): постоянное собрание курфюрстов, князей и вольных имперских городов, что законодательствовало согласием сословий, а не императорским указом. Самый долговечный союзный пример материка: законотворчество через совещательный голос великих домов."
 eur_aulic_council_bureaucracy: "Надворный совет"
 eur_aulic_council_bureaucracy_desc: "По образцу Рейхсхофрата, учреждённого Максимилианом I в 1497 году и оформленного Фердинандом I в 1559 году: личный высший суд императора по ленным спорам и делам непосредственных имперских подданных. Обходил собственный Имперский камеральный суд сословий и сосредоточивал судебную власть в руках правителя."
 eur_concert_of_powers_bureaucracy: "Концерт держав"
 eur_concert_of_powers_bureaucracy_desc: "По образцу венской системы 1814–1815 годов, где Каслри, Меттерних и император Александр I выстроили пятидержавную директорию, чтобы улаживать материковые споры конгрессом, а не войной. Концерт держал посленаполеоновский порядок с 1815 по 1914 год дворянской дипломатией ценою подавления народных и национальных движений."
 eur_hanseatic_chamber_bureaucracy: "Ганзейская палата"
 eur_hanseatic_chamber_bureaucracy_desc: "По образцу Ганзетага, собиравшегося в Любеке с 1356 года, где представители купеческих городов решали таможенные споры, дела о заморских привилегиях и общее взыскание с нарушителей. Союзный орган торговых городов, а не династий, правивший единогласием через вендскую, вестфальскую и ливонскую трети."
 eur_ecumenical_council_bureaucracy: "Вселенский собор"
 eur_ecumenical_council_bureaucracy_desc: "По образцу католического соборного обычая: Констанц (1414–1418) покончил с Великим западным расколом, Тренто (1545–1563) оформил Контрреформацию. Епископы съезжались со всего латинского христианства, чтобы устанавливать вероучение и правила, обязательные для всего материка, — самый долговечный подлинный пример общеевропейской совещательной власти."
 eur_continental_parliament_bureaucracy: "Материковый парламент"
 eur_continental_parliament_bureaucracy_desc: "По образцу «Опыта о настоящем и будущем мире Европы» Уильяма Пенна 1693 года, где предлагался европейский сейм за круглым столом, чтобы избежать споров о старшинстве, с числом посланцев по годовой стоимости производства каждого государства. Отточен «Реорганизацией» Сен-Симона 1814 года, настаивавшей на грамотном гражданском сословии как природном избирателе такого парламента."
 eur_monetary_union_bureaucracy: "Денежный союз"
 eur_monetary_union_bureaucracy_desc: "По образцу Латинского денежного союза от 23 декабря 1865 года, что связал Францию, Бельгию, Италию и Швейцарию общим биметаллическим франком в 4,5 грамма чистого серебра. Монеты его участников свободно ходили через границы, но биметаллический стандарт оказался хрупок к скачкам цены серебра, предвосхитив главное противоречие всякого последующего денежного содружества."
 AUTO_MODIFIER_NAME_nd_eur_bureaucracy_authority: "Союзная бюрократическая власть"
 AUTO_MODIFIER_DESC_nd_eur_bureaucracy_authority: "При образовании Европа получает право держать у себя общеевропейские союзные установления, взятые из исторических примеров имперских сеймов, вселенских соборов, Европейского концерта, Ганзейского союза и просвещенческих предложений о материковом парламенте. Для них открыты четыре ячейки бюрократии."
