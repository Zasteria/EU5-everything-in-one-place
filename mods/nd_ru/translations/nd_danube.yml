 nd_danube.46.a_tt: "Дело унии прибавляет #Y +25#!: один дом носит теперь две короны реки"
 nd_danube.47.a_tt: "Дело унии прибавляет #Y +25#!: один дом носит теперь две короны реки"
 nd_danube.48.a_tt: "Дело унии прибавляет #Y +25#!: один дом носит теперь две короны реки"
 nd_danube.49.a_tt: "Всякая свободная корона, которую наш дом уже носит, входит с нами в унию, и наша держава — старший партнёр"
 nd_dnb_menace_meter_tt: "#T Угроза у ворот#!\nНасколько тяжело внешняя держава давит на три короны. Пусто — спокойно. Полно — великая держава воюет с одной из корон.\n\n@arrow_bonus_tier_1! Подъём до #Y 2#! даёт делу унии #Y +10#!, единожды за подъём.\n@arrow_bonus_tier_1! На #Y 2#! и выше договорам о наследовании больше не нужен предварительный королевский брак.\n@arrow_bonus_tier_1! Чем она выше, тем охотнее каждый двор принимает договоры и помолвки."
 nd_dnb_deeds_hint: "Дела движутся поступками. Ожидание их не движет. Наведите на полосу, чтобы увидеть, что считается."
 nd_dnb_threshold_60_tt: "Отметка на #Y 60#!: здесь конгресс созывается, если один дом носит две короны. На #Y 100#! он созывается в любом случае."
 nd_dnb_web_tt: "Сумма ступеней договоров по всем трём парам (сеть). С #Y 5#! дело унии угасает вдвое медленнее; с #Y 8#! перестаёт угасать."
 nd_dnb_tier_ladder_tt: "#T Лестница договоров#!\nПредлагается как #bold предложить Erbverbruederung#! в окне дипломатии другой короны. Каждое принятое предложение поднимает на ступень:\n@arrow_bonus_tier_2! #Y 1#! Союз: мы можем вступать в их оборонительные войны, а их шаткие преемства нас касаются.\n@arrow_bonus_tier_2! #Y 2#! Помолвочный уговор: с ними можно скрепить двойную помолвку.\n@arrow_bonus_tier_2! #Y 3#! Erbverbruederung, наследственное братство: если пресечётся одна королевская линия, наследует другая. Шаткое преемство там — наше поле для действия."
 nd_danube.50.t: "Вена и Буда сближаются"
 nd_danube.50.d: "Приходит весть, что дворы Австрии и Венгрии углубили свой договор о наследовании: новый пергамент, новые печати и законники, тепло рассуждающие об общем наследстве. Всякий шаг этих двоих навстречу друг другу — шаг реки к одному дому, и дом этот не наш..."
 nd_danube.50.a: "Следить за печатями."
 nd_danube.50.a_tt: "Дело унии продвигается с каждой углублённой связью между другими коронами"
 nd_danube.51.t: "Вена и Прага сближаются"
 nd_danube.51.d: "Приходит весть, что дворы Австрии и Богемии углубили свой договор о наследовании: новый пергамент, новые печати и законники, тепло рассуждающие об общем наследстве. Всякий шаг этих двоих навстречу друг другу — шаг реки к одному дому, и дом этот не наш..."
