 nd_danube.52.a_tt: "Дело унии продвигается с каждой углублённой связью между другими коронами"
 nd_danube.53.t: "Угроза доходит до ворот"
 nd_danube.53.d: "Держава за рубежами всерьёз нависает теперь над коронами Дуная. Во всех трёх столицах довод в пользу унии становится резким и деловым: гордые дворы, требовавшие свадьбы прежде всякого договора, подпишут теперь и просто ради безопасности, а сеймы слушают иначе, когда горизонт дымится..."
 nd_danube.53.a: "Река должна ответить."
 nd_danube.53.a_tt: "Дело унии прибавляет #Y +10#!, а пока угроза стоит на #Y 2#! и выше, договорам о наследовании больше не нужен предварительный королевский брак"
