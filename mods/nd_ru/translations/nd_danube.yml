l_russian:
 nd_danube_succession: "Наследование Дуная"
 nd_danube_succession_desc: "Три короны делят одну реку. В Вене, Буде и Праге одна и та же горстка домов вступает в браки, подписывает договоры о взаимном наследовании и ждёт бездетных королей друг друга. Всякое пошатнувшееся преемство в одной столице взвешивают в двух других, а османы идут вверх по реке, пока вопрос открыт..."
 nd_dnb_situation_tt: "Три династии спорят, будет ли Дунай подчиняться одному дому"
 nd_dnb_standing_explain_tt: "#T Откуда берётся вес (пересчитывается ежемесячно)#!\n@arrow_bonus_tier_1! #G +20#! основа, #G +20#! сильнейшей по войску короне (#G +10#! второй)\n@arrow_bonus_tier_1! #G +5#! за каждый королевский брак с другой короной, #G +10#! за общую правящую династию\n@arrow_bonus_tier_1! #G +5#! за ступень договора, #G +5#! за обхаживаемый сейм, #G +10#! за двойную помолвку\n@arrow_bonus_tier_1! #G +10#! за каждую столицу соперничающей короны в наших руках, #R -20#! если соперник держит нашу\n@arrow_bonus_tier_1! #G +15#! за каждую корону, уже вошедшую в наше лоно, #R -25#! пока мы под чужим господином"
 nd_dnb_end_fulfilled_tt: "Одна держава владеет всеми уцелевшими коронами Дуная как вассалами или младшими партнёрами унии (основание Дунайской монархии тоже считается). Дорога туда — #bold Дунайский конгресс#!: он созывается, когда дело унии достигает #Y 100#! или #Y 60#! при одном доме на двух престолах. Конгресс провозглашает ту корону, чей дом держит больше престолов, вручает ей притязание на каждого свободного соперника и позволяет тут же вварить в унию вторую корону собственного дома"
 nd_dnb_end_sword_tt: "Из трёх корон уцелела самое большее одна"
 nd_dnb_end_separate_tt: "Старые вольности достигли #Y 100#! (сейчас: #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_cause_liberty').GetValue|0]#!), либо господствующая корона отреклась от вопроса, либо прошло десять тихих лет при мёртвых обоих делах и без дома на двух престолах. Эта дверь остаётся открытой и после конгресса: провозглашение, не ставшее унией, умирает вместе с вопросом"
 nd_dnb_end_epoch_tt: "С открытия вопроса прошло #Y 160#! лет (осталось около #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_epoch_years_left').GetValue|0]#!)"
 nd_dnb_legend_hab: "Австрийская кандидатура"
 nd_dnb_legend_hun: "Венгерская кандидатура"
 nd_dnb_legend_boh: "Чешская кандидатура"
 nd_dnb_legend_bound: "Связанная корона (влита в соперника или под чужим господином)"
 nd_danube_succession_situation_header: "Дунайский вопрос"
 nd_danube_succession_situation_body: "Три короны, одна река, одно оспариваемое наследство.\n\n@arrow_bonus_tier_1! Дела движутся, когда что-то происходит: скреплена помолвка, углублён договор, вынесен приговор сейма, объявлена позиция — и прежде всего когда преемство сажает один дом на второй престол.\n@arrow_bonus_tier_1! Без ухода оба дела угасают, и долгая тишина закрывает вопрос навсегда.\n@arrow_bonus_tier_1! Дело унии при #Y 100#! — или при #Y 60#!, если один дом уже носит две короны, — созывает Дунайский конгресс.\n@arrow_bonus_tier_1! Вес — это то, что стоит за всем этим. Наведите на вес, чтобы увидеть, откуда он берётся."
 hint_nd_danube_succession: "[GetSituationByKey('nd_danube_succession').GetNameWithNoTooltip]: подсказки"
 hint_nd_danube_succession_hint_text_1: "Вопрос открывается, когда династическая сеть впервые стягивается: подписан договор, дом стал общим, преемство пошатнулось при королевском браке — или, самое позднее, наступила пора чужих наследований после 1437 года. Это дорога в Дунайскую монархию. Выиграйте её — и короны, нужные для этой образуемой страны, придут к нам без завоевания."
 hint_nd_danube_succession_hint_text_2: "#T Что стоит делать:#!\n@arrow_bonus_tier_3! Направляйте наши браки на престолы: вопрос решает то, чей дом наденет вторую корону. Помолвка, которой пришёл срок, сажает туда наш дом, а конгресс, созванный при нашем доме на двух престолах, позволяет тут же сварить их в одну унию.\n@arrow_bonus_tier_3! Объявляйте себя за унию всякий раз, когда вправду намерены править всеми тремя: само объявление питает дело, сейм взвешивает наш вес за ним, а если к созыву конгресса за унию объявили себя все свободные короны, он становится выборами: короны присоединяются к нам без войны, и открытой для нашего притязания остаётся лишь та, что отказалась.\n@arrow_bonus_tier_2! Породнитесь с другими коронами, затем #bold предлагайте Erbverbruederung#! (в окне дипломатии другой короны), пока договор не дойдёт до ступени #Y 3#! (или ступени #Y 2#! при #bold двойной помолвке#!).\n@arrow_bonus_tier_2! Держите наш вес на #Y 60#! или выше. Его поднимают военная сила, королевские браки, обхаживаемые сеймы и владение столицей соперника.\n@arrow_bonus_tier_2! Следите, не пошатнётся ли корона-соседка — регентством, отсутствием наследника, ребёнком на престоле или рухнувшей законностью. Тогда мы можем обвенчать престолы или двинуть [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e], и одна выигранная война сажает нашего ставленника.\n@arrow_bonus_tier_2! Если Польша или иной чужак возьмёт корону в плен (как подданную, как младшую в унии с утвердившимся старшим или посадив на престол свой дом), #bold оспаривание чужой короны#! даёт притязание против него каждой свободной короне. Свободную корону оспорить нельзя: её берут договором и пошатнувшимся преемством.\n@arrow_bonus_tier_1! Чтобы вместо этого уйти от вопроса, поддерживайте #bold старые вольности#!, пока они не достигнут #Y 100#!, или отрекитесь от вопроса разом, когда станете господствующей силой."
 nd_dnb_propose_the_pact: "Предложить Erbverbruederung"
 nd_dnb_propose_the_pact_desc: "Предложить двум домам взаимный договор о наследовании, как подписали Рудольф с Карлом в 1364 году и Фридрих с Корвином в 1463-м: если пресечётся одна линия, наследует другая. Каждое согласие углубляет договор на ступень — от союза к помолвочному уговору и полному Erbverbruederung. Договоры держатся на королевских браках; опасность у ворот делает братьями и гордые короны."
 dip_nd_dnb_propose_the_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 nd_dnb_propose_the_pact_act: "Предложить [SCOPE.sCountry('recipient').GetName] договор о наследовании."
 nd_dnb_propose_the_pact_effect_text: "Договор между двумя коронами углубляется на ступень (скрепляется через несколько дней)."
 nd_dnb_propose_the_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] скрепили договор о наследовании с [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnb_propose_the_pact: "Связать наше наследование с домом $ACTOR$?\n\n$INFO$"
 INCOMING_OFFER_TITLE_nd_dnb_propose_the_pact: "Предложение наследственного братства"
 INCOMING_OFFER_nd_dnb_propose_the_pact: "$ACTOR$ предлагают Erbverbruederung: если пресечётся одна линия, наследует другой дом. Свяжем ли мы наши короны?\n\n$INFO$"
 nd_dnb_pact_rm_req_tt: "Две короны связаны королевским браком, либо угроза стоит у ворот (договоры держатся на браках, как и настоящие; опасность делает братьями гордые короны, как при Erbverbruederung 1463 года)"
 nd_dnb_pact_year_req_tt: "Год не ранее 1360-го (канцелярии берутся за наследственное братство в пору договора 1364 года)"
 nd_dnb_pact_tier_cap_tt: "Договор этой пары ниже ступени 3 (полный Erbverbruederung — потолок)"
 nd_dnb_pact_rejected_tt: "Отказ прилюден; двор запомнит насмешку"
 nd_dnb_court_the_diet: "Обхаживать сейм"
 nd_dnb_court_the_diet_desc: "Годовой доход в магнатские палаты чужой короны. Корвин купил своё избрание тем же способом. Десять лет их сейм помнит золото: наш вес растёт, а наше следующее предложение договора слушают на более дружелюбных скамьях."
 dip_nd_dnb_court_the_diet_CATEGORY: "CATEGORY_INFLUENCE_ACTIONS"
 nd_dnb_court_the_diet_act: "Обхаживать сейм страны [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_court_the_diet_effect_text: "Их сейм обхаживают десять лет: +5 к весу и +15 при согласии на договор."
 nd_dnb_court_the_diet_effect_text_past: "[SCOPE.sCountry('actor').GetName] обхаживали сейм страны [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnb_court_the_diet: "Обхаживать сейм страны $RECIPIENT$ ценою годового дохода?\n\n$INFO$"
 nd_dnb_courted_applied_tt: "Их сейм обхаживают ближайшие десять лет (+5 к весу, +15 при согласии на договор)"
 nd_dnb_seal_double_betrothal: "Скрепить двойную помолвку"
 nd_dnb_seal_double_betrothal_desc: "Ход Венского конгресса 1515 года: две свадьбы, обещанные разом между двумя домами. Двадцать пять лет обещание укрепляет оба дома, а пошатнувшееся преемство в любой из корон можно двинуть на одном помолвочном уговоре, без полного Erbverbruederung."
 dip_nd_dnb_seal_double_betrothal_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 nd_dnb_seal_double_betrothal_act: "Скрепить двойную помолвку с [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_seal_double_betrothal_effect_text: "Двойная помолвка связывает пару на 25 лет (+10 к весу каждому; пошатнувшееся преемство можно затем двинуть на одном помолвочном уговоре)."
 nd_dnb_seal_double_betrothal_effect_text_past: "[SCOPE.sCountry('actor').GetName] скрепили двойную помолвку с [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnb_seal_double_betrothal: "Обещать наших детей дому $ACTOR$?\n\n$INFO$"
 INCOMING_OFFER_TITLE_nd_dnb_seal_double_betrothal: "Двойная помолвка"
 INCOMING_OFFER_nd_dnb_seal_double_betrothal: "$ACTOR$ предлагают двойную помолвку между двумя домами, по образцу Венского конгресса. Обещаем ли мы детей?\n\n$INFO$"
 nd_dnb_betrothal_tier_req_tt: "Договор пары стоит на ступени помолвочного уговора или выше (ступень 2 и больше)"
 nd_dnb_betrothal_applied_tt: "Двойная помолвка связывает два дома на 25 лет"
 nd_dnb_contest_foreign_crown: "Оспорить чужую корону"
 nd_dnb_contest_foreign_crown_desc: "Одна из корон Дуная сидит младшей под чужим господином. Призвать договорную традицию против чужого устройства: каждая свободная корона получает притязание на пленный престол. Война, что за этим последует, — с господином, и вести её можно сообща."
 dip_nd_dnb_contest_foreign_crown_CATEGORY: "CATEGORY_HOSTILE_ACTIONS"
 nd_dnb_contest_foreign_crown_act: "Оспорить чужую корону над [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_contest_foreign_crown_effect_text: "Каждая свободная корона Дуная получает [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] на пленную корону."
 nd_dnb_contest_foreign_crown_effect_text_past: "[SCOPE.sCountry('actor').GetName] оспорили чужую корону над [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnb_contest_foreign_crown: "Призвать договорную традицию против чужого господина страны $RECIPIENT$?\n\n$INFO$"
 ND_DNB_ACCEPT_BASE: "Основное нежелание суверенного двора"
 ND_DNB_ACCEPT_MENACE: "Угроза у ворот делает братьями"
 ND_DNB_ACCEPT_WEAK: "Наше собственное преемство шатко"
 ND_DNB_ACCEPT_COURTED: "Их золото ещё блестит в нашем сейме"
 ND_DNB_ACCEPT_UNION_POSTURE: "Наш сейм объявил себя за дело унии"
 ND_DNB_ACCEPT_INDEPENDENCE_POSTURE: "Наш сейм объявил себя за старые вольности"
 ND_DNB_ACCEPT_PROUD_CROWN: "Более сильный дом в спокойном мире читается как господин, а не как брат"
 ND_DNB_ACCEPT_ZEITGEIST_UNION: "Настроение дворов благоприятствует унии"
 ND_DNB_ACCEPT_ZEITGEIST_LIBERTY: "Канцелярии несут старые вольности"
 nd_dnb_convene_the_diet: "Созвать сейм трёх корон"
 nd_dnb_convene_the_diet_desc: "Созвать сеймы раньше их десятилетнего срока. Собравшиеся скамьи взвешивают объявившиеся короны по весу и подталкивают ведущее дело, так что созывать их стоит, пока впереди наше."
 nd_dnb_back_the_union: "Поддержать дело унии"
 nd_dnb_back_the_union_desc: "Объявить наш двор за один дом над рекой. Пока объявление стоит, наш вес каждый месяц питает дело унии."
 nd_dnb_stand_for_liberties: "Стоять за старые вольности"
 nd_dnb_stand_for_liberties_desc: "Объявить наш двор за старые вольности: каждой короне — своё. Пока объявление стоит, наш вес каждый месяц питает старые вольности."
 nd_dnb_honor_the_league: "Исполнить союзный долг"
 nd_dnb_honor_the_league_desc: "Другая сторона договора: когда османы идут войной на участника договора, союз может выступить на защиту. Что бы ни говорили сеймы об унии, короны не смотрят, как тонет соседняя."
 nd_dnb_league_peace_tt: "Наша корона в мире"
 nd_dnb_league_no_wars: "@trigger_no! Ни один участник договора не обороняется от османов"
 nd_dnb_stance_ready_tt: "Наш двор не менял своей позиции последние 3 года"
 nd_dnb_not_already_union_tt: "Наш двор ещё не поддерживает дело унии"
 nd_dnb_not_already_liberty_tt: "Наш двор ещё не стоит за старые вольности"
 nd_dnb_stance_union_applied_tt: "Наш двор поддерживает дело унии (сменить позицию можно снова через 3 года)"
 nd_dnb_stance_liberty_applied_tt: "Наш двор стоит за старые вольности (сменить позицию можно снова через 3 года)"
 nd_dnb_convene_ready_tt: "Наш двор не созывал сейма досрочно последние 5 лет"
 nd_dnb_convene_global_tt: "Сейм корон нигде не собирался последние 5 лет"
 nd_dnb_convene_applied_tt: "Короны созваны; следующий очередной сейм — через десять лет"
 nd_dnb_renounce_the_question: "Отречься от вопроса"
 nd_dnb_renounce_the_question_desc: "Закрыть книгу об унии корон с позиции господства: обхаживать больше нечего. Каждая корона гордо остаётся при своём доме; договоры под запретом на поколение."
 nd_dnb_renounce_req_tt: "Наш вес #Y 60#! или выше, тогда как оба соперника сидят на #Y 40#! или ниже"
 nd_dnb_renounce_applied_tt: "Избраны раздельные пути: положение завершается тем, что каждая корона остаётся сама себе"
 nd_danube.1.t: "Дунайский вопрос"
 nd_danube.1.d: "Начинается это, как водится, с пергамента и обручального кольца. Дома среднего Дуная заговорили о наследовании через границы друг друга: договоры наследственного братства, помолвки, устроенные двойными парами, законники, умеющие выторговать корону в приданое. Вена, Буда и Прага видят с трёх престолов одну и ту же истину: одна река, три короны и рано или поздно один вопрос.\n\nНаш двор должен решить, какое лицо показать сеймам. Сами договоры предлагаются в окне дипломатии других корон; наши объявления и сейм делаются из окна положения."
 nd_danube.1.a: "Стремиться к унии корон."
 nd_danube.1.b: "Наша корона стоит одна."
 nd_danube.1.c: "Пусть сперва выскажутся дворы."
 nd_danube.10.t: "Сейм трёх корон"
 nd_danube.10.d.union: "Сословия дунайских корон собрались, пересчитали свои скамьи, и зал взяла партия унии. Дело одного дома продвинулось."
 nd_danube.10.d.liberty: "Сословия дунайских корон собрались, пересчитали свои скамьи, и зал взяли старые вольности. Дело раздельных корон продвинулось."
 nd_danube.10.d.hung: "Сословия дунайских корон собрались и разошлись без приговора: скамьи были слишком поровну разделены или слишком пусты, чтобы взяло верх хоть одно дело."
 nd_danube.10.a: "Сейм высказался."
 nd_danube.11.t: "Договор скреплён"
 nd_danube.11.d: "Грамоты обменены и печати приложены: наш дом и их связаны на ступень теснее в порядке наследования. Законники называют это наследственным братством; сеймы называют — смотря по скамье — страховкой или петлёй. Так или иначе, теперь это пергамент с зубами."
 nd_danube.11.a: "Дом от этого крепче."
 nd_danube.12.t: "Австрийское преемство шатается"
 nd_danube.12.d: "Весть из Вены: австрийский престол шатается. Регентство, пустая колыбель, законность, поставленная под вопрос в тех самых залах, где подделали Privilegium. Чего бы ни стоил пергамент наших договоров, дороже всего он стоит именно в этот час: при нашем дворе оживает свадебная свита, а законники уже развернули наследственные грамоты."
 nd_danube.12.a: "Обвенчать престолы."
 nd_danube.12.b: "Призвать договор."
 nd_danube.12.c: "Час проходит мимо."
 nd_danube.13.t: "Венгерское преемство шатается"
 nd_danube.13.d: "Весть из Буды: корона святого Стефана сидит нетвёрдо. Регентство, бездетный король, сейм, уже считающий голоса, которых у него не спрашивали. Наши договоры с венгерским домом подписывались именно ради этого часа, и это знает каждый двор на реке."
 nd_danube.13.a: "Обвенчать престолы."
 nd_danube.13.b: "Призвать договор."
 nd_danube.13.c: "Час проходит мимо."
 nd_danube.14.t: "Чешское преемство шатается"
 nd_danube.14.d: "Весть из Праги: чешское преемство даёт слабину. Курфюрсты державы Золотой буллы шепчутся о ненадёжном наследнике, а договорные грамоты в нашем архиве всё меньше похожи на пергамент и всё больше — на дорогу. Ведёт она прямо на Градчаны."
 nd_danube.14.a: "Обвенчать престолы."
 nd_danube.14.b: "Призвать договор."
 nd_danube.14.c: "Час проходит мимо."
 nd_danube.15.t: "Договор призван против нас"
 nd_danube.15.d: "Соперничающий двор развернул старые наследственные грамоты против нашего шаткого престола и двинул своё дело: по договору, по браку, по арифметике наследования наша корона заявлена чужой. Сейм может бросить им вызов с коронационного холма, а совет может тихо искать условий и надеяться, что войско притязателя медленнее его законников."
 nd_danube.15.a: "Бросить им вызов с коронационного холма."
 nd_danube.15.b: "Тихо искать условий."
 nd_danube.16.t: "Дело переходит и к нам"
 nd_danube.16.d: "Спор о пленной короне открыт, и по договорной традиции реки притязание переходит к каждому свободному дому Дуная — к нашему тоже. Чужой господин не отдаст корону обратно по одному письму."
 nd_danube.16.a: "Дело у нас в руках."
 nd_danube.17.t: "Чужая рука на австрийской короне"
 nd_danube.17.d: "Австрия перешла под чужую унию: за одну из трёх корон реки говорит теперь внешний господин. Дунайский вопрос никогда не предполагалось решать из-за границы, и всякий свободный сейм на реке понимает, какой это создаёт прецедент."
 nd_danube.17.a: "Принять к сведению и ждать."
 nd_danube.17.b: "Так оставаться не может."
 nd_danube.18.t: "Чужая рука на венгерской короне"
 nd_danube.18.d: "Венгрия перешла под чужую унию: корона святого Стефана подчиняется теперь внешнему господину. Такое бывало и прежде, и дворы реки помнят, как трудно это было исправить."
 nd_danube.18.a: "Принять к сведению и ждать."
 nd_danube.18.b: "Так оставаться не может."
 nd_danube.19.t: "Чужая рука на чешской короне"
 nd_danube.19.d: "Богемия перешла под чужую унию: державой Золотой буллы владеет внешний господин. Свободные короны Дуная должны решить, им ли ещё отвечать на этот вопрос."
 nd_danube.19.a: "Принять к сведению и ждать."
 nd_danube.19.b: "Так оставаться не может."
 nd_danube.31.t: "Австрийская корона угасла"
 nd_danube.31.d: "Больше некого обхаживать, сватать и обыгрывать: держава на верхнем Дунае вовсе вышла из династического мира, и та сила, что владеет теперь Веной, не отвечает ни перед каким сеймом и не сватается ни к какой свадьбе. Вопрос сужается до оставшихся корон."
 nd_danube.31.a: "Принять к сведению и ждать."
 nd_danube.31.b: "Сомкнуть ряды."
 nd_danube.32.t: "Венгерская корона угасла"
 nd_danube.32.d: "У короны святого Стефана не осталось носителя, который бы за неё отвечал: держава вовсе вышла из династического мира, и та сила, что владеет теперь Будой, не отвечает ни перед каким сеймом и не сватается ни к какой свадьбе. Вопрос сужается до оставшихся корон."
 nd_danube.32.a: "Принять к сведению и ждать."
 nd_danube.32.b: "Сомкнуть ряды."
 nd_danube.33.t: "Чешская корона угасла"
 nd_danube.33.d: "Держава Золотой буллы вовсе вышла из династического мира: та сила, что владеет теперь Прагой, не отвечает ни перед каким сеймом и не сватается ни к какой свадьбе. Вопрос сужается до оставшихся корон."
 nd_danube.33.a: "Принять к сведению и ждать."
 nd_danube.33.b: "Сомкнуть ряды."
 nd_danube.34.t: "Конгресс провозглашает Австрию"
 nd_danube.34.d: "Дело унии восторжествовало, и собравшиеся дворы назвали Австрию знаменосцем одного дома над рекой. Грамоты провозглашения несут притязание против всякой короны, стоящей особняком, — и нашей в том числе. То, что Вена зовёт честью, наша канцелярия читает как вызов в суд. Провозглашение — ещё не уния: если старые вольности возьмут сеймы прежде, чем короны будут собраны, вопрос закроется против него, и гордые короны сохранят своих королей."
 nd_danube.34.a: "Принять к сведению и ждать."
 nd_danube.34.b: "Наша корона им не принадлежит."
 nd_danube.35.t: "Конгресс провозглашает Венгрию"
 nd_danube.35.d: "Дело унии восторжествовало, и собравшиеся дворы назвали Венгрию знаменосцем одного дома над рекой. Грамоты провозглашения несут притязание против всякой короны, стоящей особняком, — и нашей в том числе. То, что Буда зовёт честью, наша канцелярия читает как вызов в суд. Провозглашение — ещё не уния: если старые вольности возьмут сеймы прежде, чем короны будут собраны, вопрос закроется против него, и гордые короны сохранят своих королей."
 nd_danube.35.a: "Принять к сведению и ждать."
 nd_danube.35.b: "Наша корона им не принадлежит."
 nd_danube.36.t: "Конгресс провозглашает Богемию"
 nd_danube.36.d: "Дело унии восторжествовало, и собравшиеся дворы назвали Богемию знаменосцем одного дома над рекой. Грамоты провозглашения несут притязание против всякой короны, стоящей особняком, — и нашей в том числе. То, что Прага зовёт честью, наша канцелярия читает как вызов в суд. Провозглашение — ещё не уния: если старые вольности возьмут сеймы прежде, чем короны будут собраны, вопрос закроется против него, и гордые короны сохранят своих королей."
 nd_danube.36.a: "Принять к сведению и ждать."
 nd_danube.36.b: "Наша корона им не принадлежит."
 nd_danube.37.t: "Конгресс созывает короны"
 nd_danube.37.d: "Дело унии восторжествовало при всех дворах реки, объявивших себя за него, и собравшиеся сеймы назвали знаменосцем наш дом. Не будет ни притязаний, ни вызова на войну: короны приглашены войти в договор по собственной воле, как сословия Богемии некогда избрали короля, вместо того чтобы терпеть навязанного. Их ответы придут в нашу канцелярию."
 nd_danube.37.a: "Пусть сеймы выскажутся."
 nd_danube.37.a.tt: "Каждая свободная корона теперь выбирает: войти в договор под нашим домом или отказаться и встретить наше притязание"
 nd_danube.38.t: "Избрание Дуная"
 nd_danube.38.d: "Дело унии восторжествовало при всех дворах, объявивших себя за него, и конгресс провозгласил Австрию. Вызов просит нашу корону войти в договор по собственной воле: наш сейм и наши законы сохранены, наше знамя рядом с их, один дом над рекой. Отказ рвёт провозглашение, и против нас будет выставлено притязание."
 nd_danube.38.a: "Войти в договор."
 nd_danube.38.b: "Наша корона им не принадлежит."
 nd_danube.39.t: "Избрание Дуная"
 nd_danube.39.d: "Дело унии восторжествовало при всех дворах, объявивших себя за него, и конгресс провозгласил Венгрию. Вызов просит нашу корону войти в договор по собственной воле: наш сейм и наши законы сохранены, наше знамя рядом с их, один дом над рекой. Отказ рвёт провозглашение, и против нас будет выставлено притязание."
 nd_danube.39.a: "Войти в договор."
 nd_danube.39.b: "Наша корона им не принадлежит."
 nd_danube.40.t: "Избрание Дуная"
 nd_danube.40.d: "Дело унии восторжествовало при всех дворах, объявивших себя за него, и конгресс провозгласил Богемию. Вызов просит нашу корону войти в договор по собственной воле: наш сейм и наши законы сохранены, наше знамя рядом с их, один дом над рекой. Отказ рвёт провозглашение, и против нас будет выставлено притязание."
 nd_danube.40.a: "Войти в договор."
 nd_danube.40.b: "Наша корона им не принадлежит."
 nd_danube.20.t: "Один дом над Дунаем"
 nd_danube.20.d: "Свершилось. Браком, договором, терпением, а там, где кончался пергамент, — мечом: всякая корона среднего Дуная подчиняется теперь одному дому. Вопрос, открывшийся поколения назад, закрыт, и канцеляриям Европы понадобятся новые карты..."
 nd_danube.20.a: "Одна река, один дом."
 nd_danube.21.t: "Вопрос решён мечом"
 nd_danube.21.d: "Дунайский вопрос закрыт — не свадьбой и не договором, а угасанием: из трёх корон, некогда деливших реку, существует лишь одна. Грамоты законников уходят в архив непрочитанными. Мечу родословная не понадобилась."
 nd_danube.21.a: "Река помнит."
 nd_danube.22.t: "Раздельные пути"
 nd_danube.22.d: "Сеймы высказались дважды, последний брак истёк, последний договор угас неподписанным. Короны Дуная решили остаться тремя: гордыми, отдельными и покончившими с вопросом. Законники запечатывают архивы; дворы впервые за поколение говорят о чём-то другом."
 nd_danube.22.a: "Каждой короне — своё."
 nd_danube.22.a.tt: "Каждая уцелевшая корона получает 25 лет $STATIC_MODIFIER_NAME_nd_dnb_proud_crown$, а договоры под запретом 30 лет"
 nd_danube.23.t: "Эпоха рассудила"
 nd_danube.23.d: "Сто шестьдесят лет договоров, свадеб, сеймов и наполовину вынутых мечей — и всё ещё ни один дом не правит рекой. Вопрос закрывается под собственным весом. Канцелярии в последний раз взвешивают три короны, и сильнейшей оказывается наша, так что остаток притязания — наш, двигать его или отложить..."
 nd_danube.23.a: "Притязания наши."
 nd_danube.23.a.tt: "У нас есть [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] на каждую уцелевшую соперничающую корону"
 nd_danube.25.t: "Лоно смыкается"
 nd_danube.25.d: "Две короны Дуная — теперь один дом: одна кандидатура влилась в державу соперника, и трёхсторонний вопрос стал поединком. Оставшемуся свободному двору стоит внимательно прочесть новую арифметику: лоно, сомкнувшееся на них, может сомкнуться и на нас."
 nd_danube.25.a: "Поединок начинается."
 nd_danube.26.t: "Дунайский конгресс"
 nd_danube.26.d: "Дело унии переросло канцелярии, что его вынянчили. Сеймы, браки и договоры сделали из честолюбия реки один дом, и собравшиеся дворы назвали его знаменосца: нас. То, что законники зовут провозглашением, другие короны прочтут как вызов в суд."
 nd_danube.26.a: "Река выбрала."
 nd_danube.26.a.tt: "Каждый договор нашего дома поднимается до помолвочного уговора, и у нас есть притязание на всякую свободную соперничающую корону"
 nd_danube.26.a_tt: "Провозглашённый защитник дела унии двигает вперёд договоры и притязания."
 nd_danube.27.t: "Вена объявляет"
 nd_danube.27.d.union: "Двор Австрии объявил себя за дело унии: его вес питает теперь мечту об одном доме над рекой."
 nd_danube.27.d.liberty: "Двор Австрии объявил себя за старые вольности: его вес держит теперь короны врозь."
 nd_danube.27.a: "Принято к сведению."
 nd_danube.27.a_tt: "Вес Австрии ежемесячно питает объявленное ею дело."
 nd_danube.28.t: "Буда объявляет"
 nd_danube.28.d.union: "Двор Венгрии объявил себя за дело унии: его вес питает теперь мечту об одном доме над рекой."
 nd_danube.28.d.liberty: "Двор Венгрии объявил себя за старые вольности: его вес держит теперь короны врозь."
 nd_danube.28.a: "Принято к сведению."
 nd_danube.28.a_tt: "Вес Венгрии ежемесячно питает объявленное ею дело."
 nd_danube.29.t: "Прага объявляет"
 nd_danube.29.d.union: "Двор Богемии объявил себя за дело унии: его вес питает теперь мечту об одном доме над рекой."
 nd_danube.29.d.liberty: "Двор Богемии объявил себя за старые вольности: его вес держит теперь короны врозь."
 nd_danube.29.a: "Принято к сведению."
 nd_danube.29.a_tt: "Вес Богемии ежемесячно питает объявленное ею дело."
 nd_danube.30.t: "Толки при дворе"
 nd_danube.30.d: "Вопрос об унии никогда толком не засыпает. В этот раз это генеалог с удобной таблицей, магнатская партия, пьющая за «одну реку, одну корону», памфлет против чужих господ, прибитый к церковной двери. Мелочи; но сеймы движутся мелочами."
 nd_danube.30.a: "Пусть свадебная партия выскажется."
 nd_danube.30.b: "Пресечь разговоры об унии."
 nd_danube.1.a_tt: "Объявить себя за дело унии с первого же дня."
 nd_danube.1.b_tt: "Объявить себя за старые вольности; сеймы удержат черту."
 nd_danube.1.c_tt: "Пока ни к чему не обязываться; позиции можно менять на каждом сейме."
 nd_danube.10.a_tt: "Ведущее дело получает свой рывок; следующий очередной сейм — через десять лет."
 nd_danube.11.a_tt: "Печати приложены; договор пары стоит на ступень глубже."
 nd_danube.12.a_tt: "Обвенчать двух государей; остальное сделает право общих престолов."
 nd_danube.12.b_tt: "Двинуть договор как военное притязание: одна выигранная война сажает нашу линию в Вене."
 nd_danube.12.c_tt: "Дать этому преемству пройти, не двигая притязания."
 nd_danube.13.a_tt: "Обвенчать двух государей; короны последуют за кольцом."
 nd_danube.13.b_tt: "Двинуть договор как военное притязание: одна выигранная война сажает нашу линию в Буде."
 nd_danube.13.c_tt: "Дать этому преемству пройти, не двигая притязания."
 nd_danube.14.a_tt: "Обвенчать двух государей; короны последуют за кольцом."
 nd_danube.14.b_tt: "Двинуть договор как военное притязание: одна выигранная война сажает нашу линию в Праге."
 nd_danube.14.c_tt: "Дать этому преемству пройти, не двигая притязания."
 nd_danube.15.a_tt: "Прилюдный вызов укрепляет престол дома."
 nd_danube.15.b_tt: "Тихие условия стоят лица, но покупают время."
 nd_danube.16.a_tt: "Притязание лежит в нашей канцелярии рядом с их."
 nd_danube.17.a_tt: "Смотреть и помнить."
 nd_danube.17.b_tt: "Повернуть наш двор к делу унии."
 nd_danube.18.a_tt: "Смотреть и помнить."
 nd_danube.18.b_tt: "Повернуть наш двор к делу унии."
 nd_danube.19.a_tt: "Смотреть и помнить."
 nd_danube.19.b_tt: "Повернуть наш двор к делу унии."
 nd_danube.31.a_tt: "Смотреть и помнить."
 nd_danube.31.b_tt: "Повернуть наш двор к делу унии."
 nd_danube.32.a_tt: "Смотреть и помнить."
 nd_danube.32.b_tt: "Повернуть наш двор к делу унии."
 nd_danube.33.a_tt: "Смотреть и помнить."
 nd_danube.33.b_tt: "Повернуть наш двор к делу унии."
 nd_danube.34.a_tt: "Смотреть и помнить."
 nd_danube.34.b_tt: "Повернуть наш двор к старым вольностям."
 nd_danube.35.a_tt: "Смотреть и помнить."
 nd_danube.35.b_tt: "Повернуть наш двор к старым вольностям."
 nd_danube.36.a_tt: "Смотреть и помнить."
 nd_danube.36.b_tt: "Повернуть наш двор к старым вольностям."
 nd_danube.37.a_tt: "Каждая свободная корона теперь отвечает на вызов; их решения приходят как обретённые вассалы или дарованные притязания."
 nd_danube.38.a_tt: "Наша корона становится державой договора под провозглашённым домом."
 nd_danube.38.b_tt: "Отказать; провозглашённая корона получает притязание против нас, а наш двор поворачивается к старым вольностям."
 nd_danube.39.a_tt: "Наша корона становится державой договора под провозглашённым домом."
 nd_danube.39.b_tt: "Отказать; провозглашённая корона получает притязание против нас, а наш двор поворачивается к старым вольностям."
 nd_danube.40.a_tt: "Наша корона становится державой договора под провозглашённым домом."
 nd_danube.40.b_tt: "Отказать; провозглашённая корона получает притязание против нас, а наш двор поворачивается к старым вольностям."
 nd_dnb_elect_enter_tt: "Мы входим в договор как держава-составляющая (вассал провозглашённой короны)"
 nd_dnb_elect_refuse_tt: "Провозглашённая корона получает против нас [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e]"
 nd_danube.20.a_tt: "На вопрос отвечено, и ответ — мы."
 nd_danube.21.a_tt: "Вопрос умер вместе с коронами, которые его задали."
 nd_danube.22.a_tt: "Завершение, гордость и поколение без договоров."
