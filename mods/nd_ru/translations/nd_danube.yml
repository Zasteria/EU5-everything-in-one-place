 nd_danube.51.a_tt: "Дело унии продвигается с каждой углублённой связью между другими коронами"
 nd_danube.52.t: "Буда и Прага сближаются"
 nd_danube.52.d: "Приходит весть, что дворы Венгрии и Богемии углубили свой договор о наследовании: новый пергамент, новые печати и законники, тепло рассуждающие об общем наследстве. Всякий шаг этих двоих навстречу друг другу — шаг реки к одному дому, и дом этот не наш..."
