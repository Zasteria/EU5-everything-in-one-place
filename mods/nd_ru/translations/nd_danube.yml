 nd_dnb_cause_explain_tt: "#T Дела#!\nДело движется, только когда что-то происходит. Уния прибавляет, когда дом занимает второй престол (#Y +25#!), скреплена помолвка (#Y +8#!), углублён договор (#Y +4#!), сейм высказался за неё (#Y +10#!), двор объявил себя за неё (#Y +8#!) или угроза дошла до ворот (#Y +10#!, единожды за подъём). Вольности прибавляют от чужих королей, нарушенных обещаний и собственных объявлений. Без ухода оба дела угасают, но сеть договоров держит унию: с #Y 5#! ступеней веса она угасает вдвое медленнее, с #Y 8#! — вовсе не угасает.\n\n@arrow_bonus_tier_1! На #Y 50#! дело склоняет дворы: при унии предложения договоров принимают #G теплее#!, при вольностях — #R холоднее#!.\n@arrow_bonus_tier_2! #bold Старые вольности#! на #Y 100#! закрывают вопрос, и короны расходятся своими путями; то же делает десятилетие тишины при обоих мёртвых делах.\n@arrow_bonus_tier_2! #bold Дело унии#! на #Y 100#! — или на #Y 60#! при одном доме на двух престолах — созывает #bold Дунайский конгресс#!: провозглашается корона, чей дом держит больше престолов, она получает притязание на каждого свободного соперника и поднятые договоры и может тут же вварить в унию вторую корону своего дома.\n@arrow_bonus_tier_2! Когда одна держава владеет всеми уцелевшими коронами, провозглашается #bold Дунайская монархия#!."
 nd_dnb_panel_levers_header: "Что мы можем сделать"
 nd_dnb_panel_levers_body: "#T В окне дипломатии другой короны#!\n@arrow_bonus_tier_2! #bold Предложить Erbverbruederung#!: договор о наследовании. Каждое принятое предложение поднимает на ступень: союз, затем помолвочный уговор, затем полный Erbverbruederung (наследственное братство: если пресечётся одна королевская линия, наследует другая).\n@arrow_bonus_tier_2! #bold Обхаживать сейм#!: золото сейчас, дружелюбный приём на десять лет.\n@arrow_bonus_tier_2! #bold Скрепить двойную помолвку#!: обещать друг другу следующее преемство. Это позволяет действовать при пошатнувшемся престоле на ступень договора раньше, а нарушенное обещание становится нашим притязанием.\n@arrow_bonus_tier_2! #bold Оспорить чужую корону#!: притязание против внешнего господина, держащего корону в плену (но никогда против свободной короны).\n\n#T На этом окне, среди действий положения#!\n@arrow_bonus_tier_2! #bold Поддержать унию#! или #bold стоять за старые вольности#!: объявить сторону нашего двора.\n@arrow_bonus_tier_2! #bold Созвать сейм#!, пока наше дело впереди.\n@arrow_bonus_tier_2! #bold Исполнить союзный долг#!: вступить в оборону участника договора против угрозы.\n@arrow_bonus_tier_2! #bold Отречься от вопроса#!, когда мы стали господствующей силой.\n\n#T Когда престол шатается#!\n@arrow_bonus_tier_1! На ступени договора #Y 3#! (#Y 2#! при скреплённой помолвке) и весе #Y 60#! мы можем обвенчать престолы или двинуть притязание.\n@arrow_bonus_tier_1! Нарушенное помолвочное обещание — это притязание: когда обещанное преемство венчают мимо нас, мы можем двинуть его войной.\n\n#T Когда заседает конгресс#!\n@arrow_bonus_tier_1! Если наш дом уже носит вторую корону, мы можем тут же сварить обе в одну унию."
 nd_danube.41.t: "Короны наши: чем нам быть?"
 nd_danube.41.d: "Свершилось. Всякая корона среднего Дуная подчиняется теперь нашему дому, и вопрос, открывшийся поколения назад, закрыт. Остаётся решить, что же мы создали. Наши канцлеры хотят одну монархию: единый двор, единое войско, одна печать от Альп до Карпат — ценою отказа от императорского достоинства. Головы постарше оставили бы короны как есть, каждую со своим сеймом и своими законами, соединёнными лишь в нашем лице..."
 nd_danube.41.a: "Пусть будет одна монархия."
 nd_danube.41.b: "Пусть каждая корона сохранит свой сейм."
 nd_danube.41.a_tt: "Основать Дунайскую монархию сейчас: мы покидаем Империю, принимаем имперский ранг, и короны становятся одной державой"
 nd_danube.41.b_tt: "Короны остаются отдельными державами под нашим домом. Монархию можно основать позже из окна образования"
 nd_dnb_sec_houses: "Дома на престолах"
 nd_dnb_word_house_one: "Один дом, две короны"
 nd_dnb_word_house_two: "Отдельные дома"
 nd_dnb_word_foreign_house: "Эту корону носит чужой дом"
 nd_dnb_grievance_swallow_tt: "Старые вольности прибавляют #Y +10#!: нарушенное обещание — ещё один довод, что каждой короне надо держаться своего короля"
 nd_danube.42.t: "Вена венчает другого"
 nd_danube.42.d: "Двойная помолвка обещала следующее австрийское преемство нашему дому, а Вена венчала вместо этого другого. Обещание лежит нарушенным на полу канцелярии. Наши посланники требуют обещанную корону; венцы отвечают, что королей делает Бог, а не пергамент. Пергамент, однако, остаётся в нашем архиве — с печатями и свидетелями, — и половина дворов христианского мира знает, что в нём написано..."
 nd_danube.42.a: "Помолвка была договором. Двинуть притязание."
 nd_danube.42.b: "Проглотить обиду."
 nd_danube.43.t: "Буда венчает другого"
 nd_danube.43.d: "Двойная помолвка обещала следующее венгерское преемство нашему дому, а сейм в Буде возвёл на престол другого. Магнаты говорят, что обещание мёртвого короля не связывает живое королевство. В нашей канцелярии лежит скреплённая печатью грамота, говорящая обратное, и каждый двор на реке смотрит, что возьмёт верх — пергамент или избрание..."
 nd_danube.43.a: "Помолвка была договором. Двинуть притязание."
 nd_danube.43.b: "Проглотить обиду."
 nd_danube.44.t: "Прага венчает другого"
 nd_danube.44.d: "Двойная помолвка обещала следующее чешское преемство нашему дому, а сословия в Праге венчали вместо этого другого. Чешская корона выборная, напоминают нам их представители, и никакая помолвка не перевесит голос сословий. Грамота в нашем архиве скреплялась в лучшей вере, чем эта, и поднятый ею вопрос тихим не останется..."
 nd_danube.44.a: "Помолвка была договором. Двинуть притязание."
 nd_danube.44.b: "Проглотить обиду."
 nd_danube.45.t: "Чужая корона на Дунае"
 nd_danube.45.d: "Дунайский вопрос закрылся, и закрылся он с нашей короной на попечении чужого дома. Унию трёх корон создадим не мы и не для нас: чем бы река теперь ни стала, считать это будут с чужого двора. Сеймы сохраняют свои законы и свои обиды и ждут следующего преемства..."
 nd_danube.45.a: "Так тому и быть."
 nd_danube.46.t: "Один дом над Веной и Будой"
 nd_danube.46.d: "Браком, избранием или смертью один и тот же дом носит теперь короны Австрии и Венгрии. То, о чём договоры говорили на пергаменте, родословное древо совершило во плоти. По всей реке канцелярии пересчитывают расклад: у унии появился кандидат, благословят его сеймы или нет..."
 nd_danube.46.a: "Река поворачивает."
 nd_danube.47.t: "Один дом над Веной и Прагой"
 nd_danube.47.d: "Браком, избранием или смертью один и тот же дом носит теперь короны Австрии и Богемии. То, о чём договоры говорили на пергаменте, родословное древо совершило во плоти. По всей реке канцелярии пересчитывают расклад: у унии появился кандидат, благословят его сеймы или нет..."
 nd_danube.47.a: "Река поворачивает."
 nd_danube.48.t: "Один дом над Будой и Прагой"
 nd_danube.48.d: "Браком, избранием или смертью один и тот же дом носит теперь короны Венгрии и Богемии. То, о чём договоры говорили на пергаменте, родословное древо совершило во плоти. По всей реке канцелярии пересчитывают расклад: у унии появился кандидат, благословят его сеймы или нет..."
 nd_danube.48.a: "Река поворачивает."
 nd_danube.49.t: "Дунайский конгресс"
 nd_danube.49.d: "Конгресс собрался и провозглашает нас защитником унии. Притязания на свободные короны — наши, а договоры стоят поднятыми в нашу пользу. Делегаты идут и дальше: если наш дом уже носит вторую корону реки, они хотели бы видеть обе сваренными в одну монархию теперь же, с сеймами, войсками и печатями, соединёнными в нашем лице. Это шаг крупнее провозглашения, и тихо его не отменить. И ещё одно делегаты говорят вполголоса: провозглашение — ещё не уния. Если старые вольности возьмут сеймы прежде, чем короны будут собраны, вопрос закроется против нас — вместе с притязаниями..."
 nd_danube.49.a: "Сварить короны в одну монархию."
 nd_danube.49.b: "Притязаний довольно. Пусть провозглашение остаётся как есть."
 nd_danube.49.b_tt: "Мы сохраняем притязания и поднятые договоры; короны остаются отдельными державами"
