l_russian:
 STATIC_MODIFIER_NAME_nd_swa_league_of_equals: "Лига равных"
 STATIC_MODIFIER_DESC_nd_swa_league_of_equals: "Города Швабии связали себя общим делом, сложив вместе богатство и оружие в защиту общих вольностей и от княжеского властолюбия, и от имперского произвола."
 STATIC_MODIFIER_NAME_nd_swa_ducal_restoration: "Возрождение герцогства"
 STATIC_MODIFIER_DESC_nd_swa_ducal_restoration: "Крепкая рука взяла раздробленное герцогство и сваривает его вздорные города и мелких владетелей в единое государство под княжеской властью, воскрешая ратные обычаи Гогенштауфенов."
 nd_swa.1.t: "Швабский вопрос"
 nd_swa.1.d: "Старое герцогство Швабия умерло с последним Гогенштауфеном, оставив по себе мозаику вольных городов, рыцарских кантонов и княжеских владений, которую держали вместе только общий язык и общая выгода. Теперь мозаика собрана под одно знамя, но какой быть этой Швабии?\n\nАугсбург, Ульм и Мемминген издавна правят собою через советы и цехи, обороняя свои вольности Швабским союзом. Их богатство и общий дух и сделали это объединение возможным. Но есть и те, кто помнит, что Швабия была некогда племенным герцогством под рукою императоров, и твердит, что удержать эти земли вместе способен лишь сильный князь.\n\nНрав Швабии висит на весах: содружество вольных городов и союзных сословий — или восстановленное герцогство с властью в одних руках.\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_swa.1.a: "Мы — союз вольных городов, связанных торговлей"
 nd_swa.1.b: "Швабии нужен сильный герцог во главе"
 nd_swa.2.t: "Дом Фуггеров"
 nd_swa.2.d: "То, что начиналось скромной ткацкой мастерской в Аугсбурге, выросло в могущественнейший банкирский дом христианского мира. Фуггеры — сперва Ханс, затем его сыновья и внуки — обратили торговлю сукном в денежную державу, что тянется от серебряных рудников Тироля до медных полей Венгрии. Их счётные конторы ссужают и пап, и императоров.\n\nЯкоб Фуггер, прозванный Богатым, забрал рудничные монополии по всей срединной Европе, предлагая габсбургским князьям ссуды, от которых нельзя отказаться, и принимая в залог права на недра. Его двойная бухгалтерия и сети международного кредита сделали Аугсбург банкирской столицей Империи.\n\nБогатство Фуггеров теперь неотделимо от швабского достатка."
 nd_swa.2.a: "Аугсбург станет счётным домом Европы"
 STATIC_MODIFIER_NAME_nd_swa_fugger_patronage: "Покровительство Фуггеров"
 STATIC_MODIFIER_DESC_nd_swa_fugger_patronage: "Огромное богатство банкирской династии Фуггеров течёт через Аугсбург, оплачивая рудники, церкви и общественные работы по всей Швабии."
 nd_swa.3.t: "Аугсбургский мир"
 nd_swa.3.d: "После десятилетий религиозной распри, что разделила соседа с соседом и разбила старый Швабский союз, князья и города Империи собрались в Аугсбурге решить вопрос об исповедании. Заключённый мир устанавливает новое начало: вера государя определяет веру его земли.\n\nДля Швабии этот час особенно весом. Сам Аугсбург давно приютил оба исповедания, и лютеранская и католическая общины делят одни городские стены в неспокойном соседстве. Одни швабские города приняли Реформацию рано, другие остались твёрдо католическими. Мир открывает две дороги: принудить всех к единому исповеданию и тем укрепить власть государства — или принять ту житейскую терпимость, какую показал опыт самого Аугсбурга."
 nd_swa.3.a: "Cuius regio, eius religio: одна вера, одна держава"
 nd_swa.3.b: "Пусть пример Аугсбурга ведёт нас к сосуществованию"
 STATIC_MODIFIER_NAME_nd_swa_cuius_regio: "Cuius Regio, Eius Religio"
 STATIC_MODIFIER_DESC_nd_swa_cuius_regio: "Начало Аугсбургского соглашения отдаёт государю власть над верой подданных, укрепляя средоточие власти и единство исповедания."
 STATIC_MODIFIER_NAME_nd_swa_augsburg_coexistence: "Аугсбургское сосуществование"
 STATIC_MODIFIER_DESC_nd_swa_augsburg_coexistence: "Давний аугсбургский обычай двуконфессионального правления становится образцом для державы, воспитывая терпимость и привлекая купцов всякой веры."
 nd_swa.4.t: "Союз выходит в поле"
 nd_swa.4.d: "Швабский союз, этот великий сговор городов, князей и рыцарей, показал себя не только дипломатическим орудием, но и грозной ратной силой. Когда крестьянские полчища поднялись по всему юго-западу против десятины и крепости, а бароны-разбойники навели ужас на торговые дороги, Союз собрал свои контингенты и выступил.\n\nПод началом Георга Трухзеса фон Вальдбурга войско Союза, собранное из десятков государств-членов, каждое со своей долей пик, конницы и пушек, размеренно и споро раздавило мятежников. Общая ратная сила Союза доказана без всяких сомнений."
 nd_swa.4.a: "Сила Союза — в его единстве"
 nd_swa_formed_tt: "Швабия образована"
 nd_swa_path_a_tt: "Швабия идёт путём Лиги равных"
 nd_swa_path_b_tt: "Швабия идёт путём Возрождения герцогства"
 nd_swa_hohenstaufen_legacy: "Наследие Гогенштауфенов"
 nd_swa_hohenstaufen_legacy_desc: "Память о великой династии Штауфенов (Фридрих Барбаросса, Генрих VI, Фридрих II) придаёт вес и славу всякому, кто зовёт Швабию своей."
 nd_swa_urban_league_tradition: "Обычай городских союзов"
 nd_swa_urban_league_tradition_desc: "Давняя привычка швабских городов связываться в союзы ради общей обороны и торговой выгоды — от первого союза 1376 года до великого сговора 1488 года."
 nd_swa_fortified_towns: "Укреплённые города"
 nd_swa_fortified_towns_desc: "Вольные города Швабии много вкладывали в стены, башни и обучение ополчения, чтобы оборонить свои вольности от княжеского натиска."
 nd_swa_fustian_industry: "Бумазейное дело"
 nd_swa_fustian_industry_desc: "Тканьё бумазеи, смеси хлопка и льна, сделало Аугсбург и Ульм текстильными столицами Империи: выделка доходила до десяти тысяч штук в год."
 nd_swa_imperial_knights: "Имперские рыцари Швабии"
 nd_swa_imperial_knights_desc: "Швабские рыцарские кантоны держали ратный обычай, независимый от любого князя, и подчинялись прямо императору."
 nd_swa_fugger_banking: "Банкирское дело Фуггеров"
 nd_swa_fugger_banking_desc: "Семейство Фуггеров из Аугсбурга выстроило могущественнейший банкирский дом Европы, ссужая Габсбургов и пап по-новому: под залог рудничных концессий."
 nd_swa_augsburg_metalworking: "Аугсбургская работа по металлу"
 nd_swa_augsburg_metalworking_desc: "Аугсбургский цех бронников и оружейников прославился по всей Европе качеством своих лат и клинков."
 nd_swa_league_collective_defense: "Общая оборона Союза"
 nd_swa_league_collective_defense_desc: "Швабский союз 1488 года оформил взаимную оборону городов, рыцарей и князей, создав союзное войско в 13 000 человек под управлением совета из трёх коллегий. Каждый член союза был обязан выставить свою долю наёмной пехоты."
 nd_swa_cannon_foundries: "Аугсбургские пушечные литейни"
 nd_swa_cannon_foundries_desc: "Аугсбургское умение лить бронзу и чугун естественно перешло на выделку артиллерии, снабжавшей осадными парками и Союз, и императора."
 nd_swa_circle_administration: "Окружное управление"
 nd_swa_circle_administration_desc: "Устройство имперских округов, оформленное при Максимилиане I, дало Швабии управленческий костяк для сбора податей, военных наборов и охранения мира."
 nd_swa_social_welfare: "Обычаи призрения"
 nd_swa_social_welfare_desc: "Основанный Якобом Фуггером в 1521 году Фуггерай, первое в мире общественное жильё, стал образцом швабского обычая городской благотворительности и призрения."
 nd_swa_league_warcraft: "Ратное дело Союза"
 nd_swa_league_warcraft_desc: "Швабский союз доказал свою ратную цену, раздавив Великую крестьянскую войну 1524–1526 годов и разбив союз баронов-разбойников во Франконской войне."
 nd_swa_confessional_coexistence: "Конфессиональное сосуществование"
 nd_swa_confessional_coexistence_desc: "Двуконфессиональное правление Аугсбурга, где лютеране и католики делили городские должности и церковные здания, стало образцом житейской терпимости в расколотой Империи."
 nd_swa_fine_cloth_manufactory: "Мануфактура тонкого сукна"
 nd_swa_fine_cloth_manufactory_desc: "Швабские ткани переходят от простой бумазеи к роскошному тонкому сукну: шесть тысяч аугсбургских ткачей оттачивают ремесло, чтобы тягаться с итальянскими и фламандскими мастерами.\n\n#italic Доступно в: $nd_swa_webhaus$#!"
 nd_swa_military_reforms: "Швабские военные преобразования"
 nd_swa_military_reforms_desc: "Превращение окружных контингентов Швабии в кадровое постоянное войско, обученное пикейно-мушкетному строю, который завели ландскнехты."
 nd_swa_augsburg_printing: "Аугсбургские печатни"
 nd_swa_augsburg_printing_desc: "Аугсбург стал одним из первых печатных средоточий Империи, выпуская духовные трактаты, торговые руководства и книги с гравюрами, расходившиеся по всей Европе."
 nd_swa_princely_splendor: "Княжеское великолепие"
 nd_swa_princely_splendor_desc: "Богатство швабских купеческих династий и княжеских домов вылилось в великолепные дворцы, церкви и собрания искусств, не уступавшие никаким в Империи."
 nd_swa_standing_kreis_army: "Постоянное окружное войско"
 nd_swa_standing_kreis_army_desc: "Швабский округ держал постоянные войска против французской и османской угрозы, и союзные контингенты выросли в кадровые постоянные полки."
 nd_swa_commercial_code: "Торговое уложение"
 nd_swa_commercial_code_desc: "Швабские города свели в уложение торговое право о договорах, товариществах и долгах, дав ту правовую твёрдость, что привлекала купцов со всей Европы."
 nd_swa_enlightenment_scholarship: "Учёность Просвещения"
 nd_swa_enlightenment_scholarship_desc: "Тюбингенский университет и другие швабские заведения стали средоточиями просвещенческой мысли и дали заметных философов, естествоиспытателей и правоведов."
 nd_swa_industrial_textiles: "Промышленный текстиль"
 nd_swa_industrial_textiles_desc: "Механизация швабского текстильного дела: водяные мельницы и первые фабрики обращают древнее тканьё в современную промышленность."
 nd_swa_civic_nationalism: "Гражданский национализм"
 nd_swa_civic_nationalism_desc: "Городские народоправные обычаи Швабии выковали особый гражданский национализм, укоренённый в самоуправлении, цеховой спайке и народовластии."
 nd_swa_autonomy_heritage: "Наследие самостоятельности"
 nd_swa_autonomy_heritage_desc: "Даже когда наполеоновская медиатизация поглотила вольные города и мелкие владения Швабии, обычай местной самостоятельности и самоуправления уцелел в городских установлениях."
 nd_swa_industrial_modernization: "Промышленное обновление"
 nd_swa_industrial_modernization_desc: "Вюртемберг вывел Швабию в промышленный век: тамошние обычаи работы по металлу и машинного дела выросли в современное производство и оружейную промышленность."
 a_nd_swa_bundschuh_militia: "Ополчение бундшу"
 a_nd_swa_bundschuh_militia_desc: "Городское ополчение из цехов и горожан вольных швабских городов, обученное оборонять свои стены и вольности от дворянского натиска."
 a_nd_swa_kreisinfanterie: "Крайсинфантерия"
 a_nd_swa_kreisinfanterie_desc: "Кадровая пехота Швабского имперского округа, устроенная общими военными повинностями его государств-членов."
 a_nd_swa_reiter: "Швабские рейтары"
 a_nd_swa_reiter_desc: "Тяжёлая конница из имперских рыцарей швабских кантонов, бьющаяся в привычной ей роли конного удара."
 a_nd_swa_augsburg_bombard: "Аугсбургская бомбарда"
 a_nd_swa_augsburg_bombard_desc: "Тяжёлая осадная артиллерия, отлитая в прославленных аугсбургских литейнях тем же умением по металлу, что дало лучшие латы Европы."
 levy_nd_swa_bundschuh_militia: "Ополчение бундшу"
 levy_nd_swa_bundschuh_militia_desc: "Ополчение, набираемое из цехов и горожан вольных швабских городов."
 levy_nd_swa_kreisinfanterie: "Ополчение крайсинфантерии"
 levy_nd_swa_kreisinfanterie_desc: "Окружная пехота, набираемая из государств-членов Швабского имперского округа."
 levy_nd_swa_reiter: "Ополчение швабских рейтаров"
 levy_nd_swa_reiter_desc: "Тяжёлая конница, набираемая из имперских рыцарей швабских кантонов."
 nd_swa_webhaus: "Ткацкий дом"
 nd_swa_webhaus_desc: "Швабский ткацкий дом, где цеховые мастера надзирают за выделкой бумазеи и тонкого сукна, продолжая текстильные обычаи Аугсбурга и Ульма."
 nd_swa_handelskontor: "Торговая контора"
 nd_swa_handelskontor_desc: "Торговая контора сети Швабского союза, что направляет торговые дела и представляет общий интерес союзных купцов."
 nd_swa_fuggerhaus: "Дом Фуггеров"
 nd_swa_fuggerhaus_desc: "Банкирский и счётный дом в обычае Фуггеров, ведающий кредитом, разменом и вложениями купеческих династий Аугсбурга."
 nd_swa_zeughaus: "Цейхгауз"
 nd_swa_zeughaus_desc: "Швабский арсенал, где аугсбургские мастера по металлу куют оружие и латы для войск Союза."
 nd_swa_fuggerei: "Фуггерай"
 nd_swa_fuggerei_desc: "Поселение общественного жилья по образцу основанного Якобом Фуггером в Аугсбурге, дающее доступный кров работникам и ремесленникам."
 nd_swa_fustian_weaving: "Тканьё бумазеи"
 nd_swa_fustian_weaving_desc: "Выделка бумазейного сукна из привозного хлопка и местной шерсти — основа текстильного богатства Швабии."
 nd_swa_fine_cloth_production: "Выделка тонкого сукна"
 nd_swa_fine_cloth_production_desc: "Тонкая обработка тканей: роскошное сукно из швабского простого сукна и привозных красителей."
 nd_swa_webhaus_maintenance: "Содержание ткацкого дома"
 nd_swa_webhaus_maintenance_desc: "Содержание станков, красильных чанов и умелых работников швабского ткацкого дома."
 nd_swa_league_commerce: "Торговля Союза"
 nd_swa_league_commerce_desc: "Торговые дела конторы Швабского союза, что направляет обмен по сети союзных городов."
 nd_swa_banking_operations: "Банкирское дело"
 nd_swa_banking_operations_desc: "Денежные дела счётного дома аугсбургского склада: кредит, размен и вложения."
 nd_swa_arms_production: "Оружейное производство"
 nd_swa_arms_production_desc: "Ковка оружия и лат в прославленных металлических мастерских Аугсбурга."
 nd_swa_fuggerei_upkeep: "Содержание Фуггерая"
 nd_swa_fuggerei_upkeep_desc: "Содержание жилья, улиц и общинных заведений поселения в обычае Фуггерая."
 nd_swa_destiny: "Судьба Швабии"
 nd_swa_destiny_desc: "Швабия впервые со времён Гогенштауфенов едина. Теперь ей выбирать дорогу: выкует ли союз городов торговую державу — или новый герцог вернёт славу старому племенному герцогству?"
 nd_swa_dest_handelsverein: "Handelsverein"
 nd_swa_dest_handelsverein_desc: "Распространить швабское торговое влияние по Рейну, закрепив за собой Страсбург и введя шёлк на наши рынки. Требует стабильности и пути Лиги."
 nd_swa_dest_rhine_trade: "Континентальный обмен"
 nd_swa_dest_rhine_trade_desc: "Построить торговую сеть от Рейна до Фландрии: взять под руку Брюгге, принять современное банкирское дело и скопить немалое богатство."
 nd_swa_dest_handelshegemonie: "Handelshegemonie"
 nd_swa_dest_handelshegemonie_desc: "Добиться торгового первенства над Европой: взять под руку Венецию, достичь высшей славы, накопить огромные средства и увидеть, как Аугсбург становится счётной конторой материка."
 nd_swa_dest_stauferreich: "Stauferreich"
 nd_swa_dest_stauferreich_desc: "Вернуть сердцевину старых владений Гогенштауфенов, завоевав Нюрнберг и Фрайбург. Требует стабильности и пути Возрождения герцогства."
 nd_swa_dest_alpine_dominion: "Власть над Альпами"
 nd_swa_dest_alpine_dominion_desc: "Взять под свою руку альпийские перевалы, отобрав Инсбрук у Габсбургов, и притом собрать грозное войско и заслужить уважение равных."
 nd_swa_dest_imperial_crown: "Императорская корона"
 nd_swa_dest_imperial_crown_desc: "Восстановить всю полноту власти Гогенштауфенов, завоевав Милан и Прагу, выставив огромное войско и отстроив Штутгарт в резиденцию, достойную короны."
 nd_swa.5.t: "Судьба Швабии"
 nd_swa.5.d: "Разбросанные обломки старого герцогства собраны в одну руку. Швабия жива снова, но вопрос о том, чем ей стать, остаётся без ответа. Дорога впереди длинна, и выбор, сделанный сейчас, будет отзываться века."
 nd_swa.5.a: "Судьба ждёт нас"
 nd_swa.6.t: "Рейнская связь"
 nd_swa.6.d: "Купцы Аугсбурга и Ульма издавна торгуют по Рейну, отправляя своё сукно и металлическую работу на север, в Нидерланды и на Балтику. Теперь, когда Страсбург в наших руках, весь верхнерейнский путь открыт швабской торговле.\n\nШёлк течёт через наши рынки, красители обогащают наши мастерские, а серебро Фуггеров смазывает колёса торговли. Старый Швабский союз был оборонительным сговором, но Handelsverein, который мы строим, — нечто куда более честолюбивое: торговое содружество, что свяжет города срединной Европы общей выгодой и общей прибылью."
 nd_swa.6.a: "Рейн станет нашей дорогой"
 nd_swa.7.t: "Континентальный обмен"
 nd_swa.7.d: "Швабские купцы торгуют теперь на великих рынках Фландрии, и склады их в Брюгге ломятся от сукна, меди и серебра. Принятые нами банкирские установления обратили Аугсбург из провинциального ткацкого городка в денежный перекрёсток Европы.\n\nВопрос теперь в том, как закрепить это торговое первенство. Одни твердят, что соглядатайские сети Аугсбурга и его денежная осведомлённость должны стать оружием, чтобы переиграть соперников. Другие полагают, что союз с ганзейскими городами севера создал бы неодолимое торговое объединение от Средиземного моря до Балтики."
 nd_swa.7.a: "Разослать наших людей по всем рынкам"
 nd_swa.7.b: "Заключить товарищество с Ганзой"
 nd_swa.8.t: "Handelshegemonie"
 nd_swa.8.d: "Венеция подпала под швабское влияние, а с нею и последняя великая самостоятельная торговая сила Европы. От ткацких залов Аугсбурга до адриатических лагун, от счётных домов Брюгге до шёлковых рынков Востока швабские деньги текут по жилам европейской торговли.\n\nЭто небывалое торговое владычество ставит корневой вопрос о самом устройстве швабского государства. Возьмут ли великие купеческие семейства — Фуггеры, Вельзеры, Хёхштеттеры — бразды правления открыто, как купеческие князья? Или рынки останутся подлинно свободными, открытыми всякому, и ни одна династия не сможет забрать торговлю себе?"
 nd_swa.8.a: "Пусть великие дома правят так же, как торгуют"
 nd_swa.8.b: "Свободные рынки служат всем, а не немногим"
 nd_swa.9.t: "Stauferreich возрождён"
 nd_swa.9.d: "Знамя Гогенштауфенов снова веет над нюрнбергским замком и башнями Фрайбурга. То, что последние государи из Штауфенов потеряли в смуте междуцарствия, новый швабский герцог вернул сталью и государственным умом.\n\nИмперские города Франконии и тучные земли Брайсгау подчиняются теперь Штутгарту. Сердцевина закреплена, но подлинные владения Фридриха Барбароссы и Фридриха II простирались далеко за эти рубежи, за альпийские перевалы и в богатые равнины Ломбардии."
 nd_swa.9.a: "Орлы возвращаются в свои гнёзда"
 nd_swa.10.t: "Владыки Альп"
 nd_swa.10.d: "Инсбрук пал. Габсбургское седалище в Тироле, ворота в Италию и страж Бреннерского перевала, поднимает теперь швабского орла. Власть над альпийскими перевалами даёт Швабии стратегическое начальство над торговыми и военными путями, что связывают Германию с Италией.\n\nВопрос в том, как распорядиться этим горным владением. Одни советуют укрепить всякий перевал и всякую долину, обратив Альпы в неприступный оплот. Другие твердят, что богатство завоёванных земель следует обратить на огромные войска для походов впереди: Милан и Прага всё ещё манят."
 nd_swa.10.a: "Укрепить всякий перевал и всякую твердыню"
 nd_swa.10.b: "Набрать горские народы для наших войн"
 nd_swa.11.t: "Императорская корона"
 nd_swa.11.d: "Милан преклонился перед швабским герцогом. Древний пражский замок признал нового господина. От Рейна до Влтавы, от Альп до равнин Ломбардии владения Гогенштауфенов восстановлены и превзойдены.\n\nТакой силы срединная Европа не видела с тех пор, как Фридрих II держал двор в Палермо и правил от Балтики до Сицилии. Вопрос теперь в том, какой быть этой империи. Одни склоняют герцога притязать на всемирную монархию: наложить швабскую волю на весь христианский мир силою оружия. Другие советуют путь размереннее: имперскую федерацию, что свяжет разные народы общими установлениями и взаимным долгом."
 nd_swa.11.a: "Одна корона, одна воля, одна империя"
 nd_swa.11.b: "Империя многих народов и одного закона"
 STATIC_MODIFIER_NAME_nd_swa_dest_continental_exchange: "Континентальный обмен"
 STATIC_MODIFIER_DESC_nd_swa_dest_continental_exchange: "Денежные осведомительные сети Аугсбурга охватывают материк, следя за рынками и двигая цены в швабскую пользу."
 STATIC_MODIFIER_NAME_nd_swa_dest_hanseatic_partnership: "Ганзейское товарищество"
 STATIC_MODIFIER_DESC_nd_swa_dest_hanseatic_partnership: "Прямой союз с ганзейскими городами создаёт торговое объединение от Альп до Балтики и делает торговлю всего края устойчивой."
 STATIC_MODIFIER_NAME_nd_swa_dest_merchant_princes: "Купеческие князья"
 STATIC_MODIFIER_DESC_nd_swa_dest_merchant_princes: "Великие купеческие династии Швабии правят так же, как торгуют: с расчётом, честолюбием и оглядкой на новизну."
 STATIC_MODIFIER_NAME_nd_swa_dest_free_market: "Республика свободного рынка"
 STATIC_MODIFIER_DESC_nd_swa_dest_free_market: "Рынки Швабии остаются открыты всякому, поощряя соперничество, терпимость и мирное благоденствие."
 STATIC_MODIFIER_NAME_nd_swa_dest_alpine_fortifications: "Альпийские укрепления"
 STATIC_MODIFIER_DESC_nd_swa_dest_alpine_fortifications: "Всякий перевал, всякая долина и всякая горная твердыня укреплены, и швабская сердцевина стала почти неприступной."
 STATIC_MODIFIER_NAME_nd_swa_dest_imperial_levies: "Имперское ополчение"
 STATIC_MODIFIER_DESC_nd_swa_dest_imperial_levies: "Завоёванные земли устроены так, чтобы дать наибольшее число ратников: всякий подчинённый народ вносит свою долю в швабское войско."
 STATIC_MODIFIER_NAME_nd_swa_dest_universal_monarchy: "Всемирная монархия"
 STATIC_MODIFIER_DESC_nd_swa_dest_universal_monarchy: "Швабский герцог притязает на власть над всем христианским миром и держит военную силу главным орудием государственного дела."
 STATIC_MODIFIER_NAME_nd_swa_dest_imperial_federation: "Имперская федерация"
 STATIC_MODIFIER_DESC_nd_swa_dest_imperial_federation: "Разные народы связаны под швабской властью общими установлениями, взаимным долгом и обещанием порядка."
 nd_swa_borsenhaus: "Биржевой дом"
 nd_swa_borsenhaus_desc: "Швабская товарная биржа, где купцы со всей Европы торгуют товаром, кредитом и поставками впредь, закрепляя за Аугсбургом место торговой столицы материка."
 nd_swa_borsenhaus_maintenance: "Дела биржи"
 nd_swa_borsenhaus_maintenance_desc: "Управление товарной биржей: торговые залы, счётные книги и курьерские сети."
 nd_swa_kaiserpfalz: "Кайзерпфальц"
 nd_swa_kaiserpfalz_desc: "Императорский дворцовый двор в обычае Гогенштауфенов: и седалище правления, и знак восстановленной герцогской власти над старым племенным герцогством."
 nd_swa_kaiserpfalz_maintenance: "Содержание дворца"
 nd_swa_kaiserpfalz_maintenance_desc: "Содержание парадных залов, укреплений и присутственных палат императорского дворца."
 AUTO_MODIFIER_NAME_nd_swa_bureaucracy_authority: "Schwäbische Verwaltung"
 AUTO_MODIFIER_DESC_nd_swa_bureaucracy_authority: "Единая швабская держава наследует набор установлений, по сложности не имеющий равных в Рейхе: союзный Bundesrat Швабского союза, Kreistag имперского округа, конституционный Tübinger Vertrag Вюртемберга, пятикантонная Reichsritterschaft и патрицианско-цеховой Stadtrat Аугсбурга. Три из них можно содержать с самого образования Швабии."
 swa_bundesrat_bureaucracy: "Bundesrat des Schwäbischen Bundes"
 swa_bundesrat_bureaucracy_desc: "Союзный совет Швабского союза, учреждённый на съезде в Эсслингене 14 февраля 1488 года. Bundesrat заседал тремя коллегиями: князья, имперские города и рыцари Общества святого Георгия, с двумя (позже тремя) гауптманами во главе и равным числом советников от каждого сословия, расширенным с восемнадцати до двадцати одного возобновлениями 1496 и 1500 годов. Он выставлял войско в тринадцать тысяч человек, подавил Крестьянскую войну 1525 года и держал южную Швабию вместе против распрей и церковного раскола, пока Реформация не разбила Союз в 1534 году."
 swa_kreistag_bureaucracy: "Schwäbischer Kreistag"
 swa_kreistag_bureaucracy_desc: "Совещательное собрание Швабского имперского округа, одного из десяти округов, созданных Максимилианом I в 1500 году. Герцоги Вюртембергские и епископы Констанцские были окружными созывающими князьями: они собирали Kreistag и председательствовали на нём. С 1512 года округ приводил в исполнение приговоры Имперского камерального суда, с 1530 года выставлял контингент имперской армии, а после 1555 года блюл Вечный земский мир на своей земле. Из десяти округов швабский считался самым устроенным и после 1563 года делился на четыре исполнительные четверти: Аугсбургскую, Констанцскую, Вюртембергскую и Баденскую."
 swa_tuebinger_vertrag_bureaucracy: "Tübinger Vertrag"
 swa_tuebinger_vertrag_bureaucracy_desc: "Конституционный договор, заключённый герцогом Ульрихом и вюртембергским ландтагом в Тюбингене 8 июля 1514 года, вслед за восстанием Бедного Конрада против его подати на мясо и вино. Договор обязал герцогство совещаться с сословиями прелатов, рыцарей и почтенного бюргерства о чрезвычайных податях, войне и отчуждении земель, а всем подданным дал право свободного выезда и законного разбирательства в делах о жизни, увечье и чести. Историки звали его Великой хартией Вюртемберга. Он оставался земской конституцией почти без изменений до наполеоновской медиатизации 1805 года."
 swa_reichsritterschaft_bureaucracy: "Reichsritterschaft Schwabens"
 swa_reichsritterschaft_bureaucracy_desc: "Собрание швабских имперских рыцарей, сложившееся между 1541 и 1545 годами из распущенного Общества святого Георгия и устроенное в пять кантонов: Дунайский, Хегау-Альгой-Боденское озеро, Неккар-Шварцвальд, Кохер и Крайхгау. Каждым кантоном правила директория во главе с пожизненно избранным рыцарским гауптманом и выборными рыцарскими советниками; кантоны собирали подати и держали военную власть над своими подданными, а рыцарские поместья продавали только другим рыцарям, чтобы сохранить рыцарские земли нетронутыми. Швабские рыцари были самым плотным рыцарским сообществом Рейха и уцелели, подчиняясь прямо императору, до медиатизации 1805–1806 годов."
 swa_augsburger_stadtrat_bureaucracy: "Augsburger Stadtrat"
 swa_augsburger_stadtrat_bureaucracy_desc: "Патрицианско-цеховое городское правление Аугсбурга, вольного имперского города с 9 марта 1276 года. До 1548 года совет заседал по цеховому уложению, что обеспечивало цехам большинство над патрициями; купеческие дома Вельзеров, Хёхштеттеров, Хервартов, Баумгартнеров и Фуггеров сидели там рядом с ремесленными цехами и городскими попечителями. После Аугсбургского мира 1555 года смешанный католическо-лютеранский совет правил преимущественно протестантским населением. Augsburger Stadtrat был учрежденческим двигателем южнонемецкого банкирского дела — частные деньги Фуггеров привычно ссужались императорам, — пока его не сломила Тридцатилетняя война."
