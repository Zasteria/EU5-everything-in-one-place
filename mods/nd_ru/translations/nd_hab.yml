l_russian:
 STATIC_MODIFIER_NAME_nd_hab_aeiou_dynasty: "AEIOU: путь Габсбургов"
 STATIC_MODIFIER_DESC_nd_hab_aeiou_dynasty: "Alles Erdreich Ist Oesterreich Untertan. Расчётливыми браками, осмотрительными союзами и династическим накоплением дом Габсбургов строит свою империю не одним мечом, но алтарём и переговорным столом."
 STATIC_MODIFIER_NAME_nd_hab_antemurale: "Antemurale Christianitatis"
 STATIC_MODIFIER_DESC_nd_hab_antemurale: "Австрия стоит оплотом христианского мира, и её войска закалены поколениями пограничной войны против османского натиска. Военная граница тянется от Адриатики до Карпат, и обороняет её кадровое солдатство, выкованное в горниле нескончаемой пограничной борьбы."
 nd_hab.1.t: "Возвышение Австрии"
 nd_hab.1.d: "Разрозненные альпийские герцогства скованы в единую державу под нашей властью. Из Вены мы озираем земли, что тянутся от Дуная до горных перевалов, — владение, построенное брачными договорами не меньше, чем воинской доблестью. Вопрос теперь в том, каким государством станет Австрия.\n\nПойдём ли мы путём Габсбургов, терпеливых собирателей корон через династические унии, сватов, перекраивающих карту Европы из опочивальни и из-за переговорного стола? Или примем роль щита христианского мира, вложив свою силу в военную границу, что стережёт восточный бок Европы от всякого, кто ему грозит?\n\n#bold Этот выбор открывает путь судьбы во вкладке традиций.#!"
 nd_hab.1.a: "Пусть воюют другие: мы будем заключать браки."
 nd_hab.1.b: "Мы — щит христианского мира."
 nd_hab.2.t: "Прагматическая санкция"
 nd_hab.2.d: "Император Карл VI, не имея наследника мужского пола, годами добивался признания того, что габсбургские владения могут перейти нераздельно к наследнице. Прагматическая санкция 1713 года утверждает начало нераздельного наследования, но подлинное испытание придёт, когда престол унаследует юная Мария Терезия и половина Европы двинется расчленять её наследство.\n\nГрядущий кризис потребует выбора. Вкладываться ли нам в правовую и дипломатическую опору, что связывает наши разноликие владения династическим правом? Или пойти путём Марии Терезии, отстроив войско с основания, учредив военные академии и выковав современную боевую силу, которой не одолеет никакая коалиция?"
 nd_hab.2.a: "Наследование должно быть обеспечено законом."
 nd_hab.2.b: "Наследование должно быть обеспечено силой."
 STATIC_MODIFIER_NAME_nd_hab_pragmatic_succession: "Прагматическое наследование"
 STATIC_MODIFIER_DESC_nd_hab_pragmatic_succession: "Прагматическая санкция связывает габсбургские владения законом. Дипломатическим признанием и династическим правом нераздельность нашей державы обеспечена."
 STATIC_MODIFIER_NAME_nd_hab_theresian_reform: "Терезианская военная реформа"
 STATIC_MODIFIER_DESC_nd_hab_theresian_reform: "После потрясения от потери Силезии Мария Терезия перестроила габсбургское войско. Кадровая выучка, единообразное снаряжение и обновлённый офицерский корпус обращают имперскую армию в современную боевую силу."
 nd_hab.3.t: "Камералистское государство"
 nd_hab.3.d: "Наука камерализма — стройное учение о государственном управлении, податной политике и хозяйстве — укоренилась в университетах габсбургских земель. Там, где прежде сбор доходов был случайным и провинциальным, новое поколение обученных чиновников прилагает к управлению разумные начала. Камералистские кафедры, учреждённые в Вене и Праге, выпускают управленцев, понимающих горные доходы, торговую политику и народонаселение как связанные между собой части одного целого.\n\nЭто превращение австрийского государства из феодальной вотчины в разумно устроенную управленческую машину и определит, сможем ли мы тягаться с великими державами Европы."
 nd_hab.3.a: "Пусть государством правит разум."
 STATIC_MODIFIER_NAME_nd_hab_cameralist_state: "Камералистское управление"
 STATIC_MODIFIER_DESC_nd_hab_cameralist_state: "Поколение обученных в университетах камералистов ведёт теперь государственные финансы, промыслы и народонаселение с последовательной разумностью."
 nd_hab.4.t: "Ландскнехты Максимилиана"
 nd_hab.4.d: "После сокрушительных швейцарских побед при Муртене и Нанси император Максимилиан I завёл солдата нового рода. Устроенные по образцу грозных швейцарских рейслойферов, но верные габсбургской короне, ландскнехты — кадровая пехота пики и пищали, сведённая в фенляйны по нескольку сот человек. Передние ряды у них составляют доппельзольднеры, опытные воины с огромными цвайхандерами или аркебузами, получающие двойное жалованье за то, что стоят на самом гибельном месте.\n\nМаксимилиан упразднил арбалет в военном деле, заменив его целиком огнестрельным оружием, — дерзкое новшество, поставившее габсбургское войско во главе пороховой революции. Эти ландскнехты станут хребтом имперских армий по всей Европе."
 nd_hab.4.a: "Собственные солдаты императора готовы."
 nd_hab_privilegium_maius: "Privilegium Maius"
 nd_hab_privilegium_maius_desc: "Поддельные привилегии Рудольфа IV поднимают положение Австрии среди имперских владений, давая эрцгерцогству исключительное правовое положение и церемониальное первенство."
 nd_hab_hofkammer_tradition: "Податное управление Гофкаммера"
 nd_hab_hofkammer_tradition_desc: "Учреждение Гофкаммера Фердинандом I в 1527 году свело габсбургский финансовый надзор в один центр, отдав ему чеканку монеты, горные доходы, пошлины и прямые подати через постоянное ведомство."
 nd_hab_schwaz_silver: "Серебро Шваца и ртуть Идрии"
 nd_hab_schwaz_silver_desc: "Великие рудники Шваца в Тироле, некогда крупнейшая серебряная копь Европы, и ртутные залежи Идрии дают Габсбургам доходы, оплачивающие и армии, и дипломатию. Ниже рудников стоят плавильни, где серебро отделяют от медной руды."
 nd_hab_landsknechte: "Традиция ландскнехтов"
 nd_hab_landsknechte_desc: "Ландскнехты Максимилиана I, кадровая пехота пики и пищали по швейцарскому образцу, составляют хребет габсбургской военной мощи. Их передние ряды из доппельзольднеров и упор на огнестрельное оружие вместо арбалета знаменуют переворот в военном деле."
 nd_hab_festungsbau: "Festungsbaukunst"
 nd_hab_festungsbau_desc: "Габсбургские военные инженеры создают изощрённые крепостные системы, приспособленные к горному пограничью, вплетая итальянские начала trace italienne в альпийскую оборонительную архитектуру."
 nd_hab_militargrenze_levy: "Militärgrenze"
 nd_hab_militargrenze_levy_desc: "Военная граница, Militärgrenze, селит хорватских и сербских колонистов вдоль османского рубежа, давая им землю в обмен на вечную военную службу в ополчении граничар."
 nd_hab_baroque_patronage: "Барочное покровительство двора"
 nd_hab_baroque_patronage_desc: "Контрреформационный двор в Вене становится средоточием барочного великолепия. Фишер фон Эрлах, Хильдебрандт и их преемники преображают столицу церквями, дворцами и библиотеками, что являют миру габсбургскую мощь и католическое благочестие."
 nd_hab_theresian_academy: "Терезианская военная академия"
 nd_hab_theresian_academy_desc: "Военная академия Марии Терезии в Винер-Нойштадте, Терезианум, делает габсбургский офицерский корпус кадровым, обучая новое поколение начальников тактике, фортификации и командованию."
 nd_hab_kurassiere: "Имперские кирасиры"
 nd_hab_kurassiere_desc: "Тяжёлые кирасирские полки габсбургского войска, латные всадники, идущие в атаку с пистолетом и саблей, остаются сокрушительной ударной силой на полях Европы и в пороховую эпоху."
 nd_hab_cameralism: "Учреждение камерализма"
 nd_hab_cameralism_desc: "Камерализм, стройная наука управления государством, вводится в габсбургских университетах и обучает чиновников податной политике, горному управлению и хозяйственному устройству."
 nd_hab_pragmatic_sanction: "Прагматическая санкция"
 nd_hab_pragmatic_sanction_desc: "Прагматическая санкция 1713 года кладёт правовое основание нераздельного наследования габсбургских владений, связывая разноликие королевства и герцогства под одним государем независимо от его пола."
 a_nd_hab_kurassiere: "Имперские кирасиры"
 a_nd_hab_kurassiere_desc: "Тяжёлая латная конница габсбургского войска, врубающаяся во вражеский строй сокрушительным ударом. Полудоспех, пистолеты и тяжёлые сабли."
 a_nd_hab_grenzer_militia: "Ополчение граничар"
 a_nd_hab_grenzer_militia_desc: "Хорватские и сербские пограничные поселенцы, служащие лёгкой пехотой на Военной границе и обороняющие габсбургский рубеж от османских набегов в обмен на земельные наделы."
 nd_hab_hofkammer: "Гофкаммер"
 nd_hab_hofkammer_desc: "Придворная палата, средоточие податного управления габсбургского государства, ведающая горными доходами, чеканкой монеты, пошлинами и сбором податей через постоянный штат чиновников."
 nd_hab_hofkammer_administration: "Податное управление"
 nd_hab_hofkammer_administration_desc: "Постоянный штат писцов и ревизоров Гофкаммера ведёт государственные книги, составляя подробные податные записи и принимая сановников при полном облачении."
 nd_hab_festung: "Габсбургская Festung"
 nd_hab_festung_desc: "Звёздная крепость, выстроенная по габсбургским инженерным началам, где итальянский замысел trace italienne приспособлен к горному альпийскому пограничью."
 nd_hab_festung_upkeep: "Содержание укреплений"
 nd_hab_festung_upkeep_desc: "Гарнизон и каменная кладка Festung требуют постоянных вложений: камня на стены и облицовку, леса на палисады и внутренние работы, оружия для защитников."
 nd_hab_cameralist_institut: "Камералистский институт"
 nd_hab_cameralist_institut_desc: "Средоточие камералистского обучения и науки, где чиновников готовят по стройной науке управления государством: податной политике, горному управлению, торговому уставу и делам народонаселения."
 nd_hab_cameralist_research: "Камералистские штудии"
 nd_hab_cameralist_research_desc: "Учёное изучение податной политики, хозяйственного устройства и управленческой науки требует печатных книг, справочных сочинений и оптических приборов для точного наблюдения, которого требует камералистский метод."
 nd_hab_theresianum: "Терезианум"
 nd_hab_theresianum_desc: "Военная академия в духе реформ Марии Терезии в Винер-Нойштадте, обучающая офицеров современной тактике, осадному делу и командованию."
 nd_hab_academy_operations: "Работа академии"
 nd_hab_academy_operations_desc: "Обучение офицерского корпуса требует учебников и карт для занятий, оружия и снаряжения для полевых учений и кожи на мундиры и конскую сбрую."
 levy_nd_hab_grenzer_militia: "Ополчение граничар"
 levy_nd_hab_grenzer_militia_desc: "Пограничное ополчение из общин Военной границы, закалённое поколениями османских набегов и обученное нерегулярной войне в горах."
 nd_hab_formed_tt: "Австрия образована"
 nd_hab_path_a_tt: "Избрано AEIOU: путь Габсбургов"
 nd_hab_path_b_tt: "Избрано Antemurale Christianitatis"
 nd_hab_destiny: "Габсбургская судьба"
 nd_hab_destiny_desc: "Австрия поднялась из горсти альпийских герцогств до великой державы. Теперь державу надо упрочить, прежде чем династия сможет взяться за своё главное честолюбие — алтарём или мечом."
 nd_hab_dest_corona: "Чешская корона"
 nd_hab_dest_corona_desc: "Добудьте корону Богемии, богатейшего королевства Империи, династическим притязанием и дипломатией. Возьмите Прагу и разверните развитое податное устройство через банковское учреждение."
 nd_hab_dest_burgundia: "Бургундское наследство"
 nd_hab_dest_burgundia_desc: "Заявите права на бургундские земли в Нидерландах, приведя богатые торговые города Фландрии под габсбургскую власть. Гент нужно удержать, а Антверпен удержать и поднять до развития 49: его великие рынки оплатят вселенское честолюбие династии."
 nd_hab_dest_monarchia: "Universalis Monarchia"
 nd_hab_dest_monarchia_desc: "Габсбургская мечта, ставшая явью: вселенская монархия от Нидерландов до итальянских герцогств, связанная династическим правом, дипломатическим мастерством и великими торговыми сетями мира."
 nd_hab_dest_ungarn: "Венгерский поход"
 nd_hab_dest_ungarn_desc: "Буду, древнюю столицу венгерских королей, надо взять под габсбургскую власть, чтобы закрепить восточный рубеж. Соберите сильное войско и упрочьте державу, прежде чем ударить на восток."
 nd_hab_dest_feldzug: "Великая турецкая война"
 nd_hab_dest_feldzug_desc: "Двиньте рубеж на юг, в османские Балканы. Белград, ключ к Дунаю, должен пасть, прежде чем Австрия заявит о власти над юго-восточной Европой. Нужны кадровые армии."
 nd_hab_dest_bollwerk: "Bollwerk des Glaubens"
 nd_hab_dest_bollwerk_desc: "Австрия стоит непоколебимым оплотом христианского мира, и её Военная граница тянется от Адриатики до Карпат. Загреб нужно удержать, а Карловац — звёздную крепость, которую эрцгерцог Карл в 1579 году возвёл на пустом месте как средоточие Хорватской границы, — удержать и поднять до развития 28."
 nd_hab.5.t: "Габсбургская судьба"
 nd_hab.5.d: "Образование Австрии — не конец, а начало. Из Вены дом Габсбургов озирает державу, раскинувшуюся по альпийскому ядру, но подлинная судьба династии лежит за этими горами. Расчётливыми браками и дипломатическим собиранием или мечом, что стережёт восточные врата христианского мира, — путь Австрии определён."
 nd_hab.5.a: "Наша судьба ждёт."
 nd_hab.6.t: "Корона святого Вацлава"
 nd_hab.6.d: "Древняя корона Богемии перешла в габсбургские руки. Прага — престол императора Священной Римской империи, средоточие учёности и торговли, ворота к серебряным рудникам Кутна-Горы — подчиняется теперь Вене. Это не простое приращение земель, а династический переворот. Чешская корона несёт с собой курфюршеское достоинство, огромные недра и королевство, чьё управление не уступит ни одному в Европе.\n\nС Богемией в руках сеть династических браков и притязаний может протянуться ещё дальше: на запад к бургундскому наследству, на юг к итальянским коронам."
 nd_hab.6.a: "Прага и Вена под одной короной."
 nd_hab.7.t: "Бургундское наследство"
 nd_hab.7.d: "Великая ставка габсбургской брачной дипломатии принесла самый богатый плод. Через союз с домом Бургундии в габсбургские руки перешли богатые города Нидерландов — Антверпен, Брюгге, Гент. Это самые развитые в торговом отношении города Европы, и через их рынки проходит больше товара, чем через целые королевства.\n\nЭта удача требует выбора. Вложиться ли нам в дипломатический и учрежденческий аппарат, нужный, чтобы править столь разбросанными владениями, воспитав поколение габсбургских управленцев и переговорщиков? Или обратить торговое богатство напрямую в дело, направив прибыль фламандской торговли в казну и сделав Австрию торговой державой?"
 nd_hab.7.a: "Воспитать дипломатов, которые будут править империей."
 nd_hab.7.b: "Направить богатство Фландрии в нашу казну."
 STATIC_MODIFIER_NAME_nd_hab_dest_diplomatenakademie: "Габсбургская Diplomatenakademie"
 STATIC_MODIFIER_DESC_nd_hab_dest_diplomatenakademie: "Поколение выученных Габсбургами дипломатов и управленцев расходится по Европе, искушённое в переговорах, составлении договоров и учрежденческом управлении, что держит вместе разбросанную монархию."
 STATIC_MODIFIER_NAME_nd_hab_dest_handelspolitik: "Габсбургская Handelspolitik"
 STATIC_MODIFIER_DESC_nd_hab_dest_handelspolitik: "Торговое богатство Нидерландов течёт по габсбургским руслам, обогащая казну и обращая Австрию из запертого в горах альпийского государства в торговую державу с интересами по всему материку."
 nd_hab.8.t: "Universalis Monarchia"
 nd_hab.8.d: "Габсбургская мечта подходит к своей вершине. От Брюсселя до Праги, от Вены до Милана владения династии опоясывают Европу. Ни одна семья ещё не держала такого простора столь разными путями — браком, наследством, избранием и договором. Вопрос теперь в том, как править этим необычайным собранием народов, языков и вер.\n\nПринять ли нам начало cuius regio, eius religio, наводя исповедный порядок и оставляя ровно столько самостоятельности, чтобы разноликие народы монархии жили в мире? Или пойти путём конгрессной дипломатии, сделав Вену столицей европейского порядка через переговоры и согласование?"
 nd_hab.8.a: "Порядок через исповедное управление."
 nd_hab.8.b: "Порядок через конгрессную дипломатию."
 STATIC_MODIFIER_NAME_nd_hab_dest_cuius_regio: "Cuius Regio, Eius Religio"
 STATIC_MODIFIER_DESC_nd_hab_dest_cuius_regio: "Начало исповедного сосуществования держит порядок по всем габсбургским владениям. Веротерпимость вкупе с твёрдым управленческим надзором позволяет монархии править своими разноликими народами без раскола."
 STATIC_MODIFIER_NAME_nd_hab_dest_kongressdiplomatie: "Kongressdiplomatie"
 STATIC_MODIFIER_DESC_nd_hab_dest_kongressdiplomatie: "Вена стала дипломатической столицей Европы. Конгрессами, договорами и терпеливыми переговорами Габсбурги держат порядок в своих обширных владениях и правят равновесием сил на материке."
 nd_hab.9.t: "Падение Буды"
 nd_hab.9.d: "Габсбургские войска вошли в Буду, древнюю столицу венгерского королевства. Поколениями этот крепостной город на Дунае служил престолом королей из домов Арпадов и Анжу, пока не пал под османским завоеванием. Ныне над ним снова реет габсбургское знамя.\n\nОтвоевание Венгрии меняет всю стратегическую карту. Австрия больше не пограничное государство, жмущееся за Лейтой. Она господствующая сила среднего Дуная, способная забрасывать войска вглубь Балкан."
 nd_hab.9.a: "Венгрия освобождена. Рубеж продвигается."
 nd_hab.10.t: "Великая турецкая война"
 nd_hab.10.d: "Белград пал. «Белая крепость» — ключ к Дунаю, ворота в османские Балканы — в габсбургских руках. Походы принца Евгения сокрушили османскую мощь в Венгрии и отодвинули рубеж вглубь Сербии. Это величайшая победа христианского мира над османами со времён Лепанто.\n\nВопрос теперь в том, как закрепить эти обширные завоевания. Вложиться ли в тыл и снабжение, выстроив сети дорог и склады, что поддержат будущие походы и дадут разорённому пограничью оправиться? Или довести до совершенства осадное искусство, взявшее Белград, чтобы наши инженеры и артиллеристы оставались лучшими в Европе?"
 nd_hab.10.a: "Строить дороги, что держат империю."
 nd_hab.10.b: "Довести до совершенства науку крепостной войны."
 STATIC_MODIFIER_NAME_nd_hab_dest_versorgungslinie: "Kaiserliche Versorgungslinien"
 STATIC_MODIFIER_DESC_nd_hab_dest_versorgungslinie: "Сеть военных дорог, складов и речных путей поддерживает габсбургские войска на всём обширном дунайском театре, позволяя быстро подводить подкрепления и восстанавливать разорённое войной пограничье."
 STATIC_MODIFIER_NAME_nd_hab_dest_belagerungskunst: "Belagerungskunst"
 STATIC_MODIFIER_DESC_nd_hab_dest_belagerungskunst: "Габсбургские военные инженеры довели до совершенства научное осадное дело. Их артиллерийские батареи и подход к взятию крепостей лучшие в Европе, хотя содержание такого мастерства и обременяет казну."
 nd_hab.11.t: "Bollwerk des Glaubens"
 nd_hab.11.d: "Австрия стоит бесспорным щитом христианского мира. Военная граница тянется непрерывно от Адриатики до Карпат, и держат её поколения поселенцев-граничар, не знающих иной жизни, кроме войны. За этой живой стеной габсбургские владения выросли в великую державу, чьи войска сломили всякую угрозу с востока.\n\nЭто свершение требует последнего выбора. Принять ли нам крестоносный дух, что привёл нас сюда, освящая наши войны, удешевляя поводы к войне против иноверцев и закаляя наш народ для вечной борьбы? Или обратиться внутрь, наводя имперский порядок на завоёванных землях, строя школы и суды, что окультурят пограничье и сделают его вправду нашим?"
 nd_hab.11.a: "Крестовый поход вечен."
 nd_hab.11.b: "Пограничьем надо править, а не просто его держать."
 STATIC_MODIFIER_NAME_nd_hab_dest_kreuzzugsgeist: "Kreuzzugsgeist"
 STATIC_MODIFIER_DESC_nd_hab_dest_kreuzzugsgeist: "В габсбургском государстве горит крестоносный дух. Войны против иноверцев обходятся дёшево, боевой дух держится и в затяжных походах, а дело христианского мира даёт нескончаемое оправдание новым завоеваниям."
 STATIC_MODIFIER_NAME_nd_hab_dest_kaiserliche_ordnung: "Kaiserliche Ordnung"
 STATIC_MODIFIER_DESC_nd_hab_dest_kaiserliche_ordnung: "На завоёванном пограничье имперский порядок сменяет военное положение. Школы, суды и управы обращают дикие окраины в доходные провинции, хотя переход от набегов к управлению и уменьшает военную добычу."
 nd_hab_hofburg: "Канцелярия Хофбурга"
 nd_hab_hofburg_desc: "Великий дворец-канцелярия габсбургской вселенской монархии, вмещающий дипломатический корпус, государственные архивы и управленческий аппарат, что правит владениями в пол-Европы."
 nd_hab_hofburg_chancellery: "Управление канцелярии"
 nd_hab_hofburg_chancellery_desc: "Обширному дипломатическому и управленческому аппарату Хофбурга нужен постоянный подвоз бумаги для договоров и переписки, тонкого сукна на парадное платье, мебели для государственных палат и стекла для дипломатических приёмов."
 nd_hab_grenzfestung: "Grenzfestung"
 nd_hab_grenzfestung_desc: "Крупный крепостной узел Военной границы, закрепляющий габсбургскую оборонительную линию тяжёлыми укреплениями, постоянным гарнизоном и запасами оружия на случай любого вторжения с востока."
 nd_hab_grenzfestung_garrison: "Пограничный гарнизон"
 nd_hab_grenzfestung_garrison_desc: "Содержание Grenzfestung требует оружия для гарнизона, камня на постоянное укрепление стен и бастионов, леса на палисады и внутренние работы и кожи на снаряжение и сбрую."
 AUTO_MODIFIER_NAME_nd_hab_bureaucracy_authority: "Габсбургская составная монархия"
 AUTO_MODIFIER_DESC_nd_hab_bureaucracy_authority: "Провозглашение австрийской монархии закрепляет её учрежденческий строй. Из Вены генерал-квартирмейстерский штаб готовит походы, Тайная конференция решает вопросы войны и мира, венгерская Cancellaria ведёт дела с мадьярскими магнатами, Ландлибель вооружает долины Тироля, а поколение камералистов готовится переустроить державу. Составная монархия может теперь выбрать, какие из её управленческих учреждений укоренить."
 hab_hofkriegsrat_bureaucracy: "Генерал-квартирмейстерский штаб"
 hab_hofkriegsrat_bureaucracy_desc: "Генерал-квартирмейстерский штаб, созданный в Семилетнюю войну после поражения при Лейтене в 1757 году; Франц Мориц фон Ласси стал начальником штаба при фельдмаршале Дауне. Его офицеры выбирали лагеря, прокладывали марши и вели карты, а после войны лист за листом сняли всю монархию. Поход больше не импровизировал полководец: его готовил для него обученный штаб, и генералы следующего поколения учились в его стенах."
 hab_geheime_konferenz_bureaucracy: "Geheime Konferenz"
 hab_geheime_konferenz_bureaucracy_desc: "Тайная конференция, выросшая из Geheimer Rat Фердинанда I и получившая законченный вид при Леопольде I после 1665 года, когда старый совет разросся настолько, что не мог хранить тайну. Малый внутренний совет из пяти-семи отобранных вельмож (Ауэрсперг, Лобковиц, Шварценберг, позже Кауниц) обсуждал династические браки, войну и мир и испанское наследство. Его протоколы, сохранённые в Haus-, Hof- und Staatsarchiv, стали главным сводом габсбургской высокой дипломатии и школой, где воспитывались поколения имперских государственных мужей."
 hab_hungarian_cancellaria_bureaucracy: "Венгерская Cancellaria"
 hab_hungarian_cancellaria_bureaucracy_desc: "Magyar Udvari Kancellaria, отдельная венгерская придворная канцелярия, учреждённая в Пожони и подтверждённая сеймом 1606 года. Венгерское дворянство отказалось, чтобы им управляли через немецкоязычную Hofkanzlei в Вене; Cancellaria хранила конституционное учение о том, что Венгрия есть regnum independens, соединённое с Австрией лишь в лице короля. Корона купила спокойствие с мадьярскими магнатами ценою вечного двойного управления."
 hab_militaergrenze_bureaucracy: "Тирольский Ландлибель"
 hab_militaergrenze_bureaucracy_desc: "Оборонный устав, который Максимилиан I дал графству Тироль 23 июня 1511 года. Сословия земли, крестьяне и города в их числе, обязались выставлять от 5 000 до 20 000 человек смотря по опасности, а за ними мог быть поднят всякий способный носить оружие. Взамен они служили только в пределах Тироля, и ни одну войну, задевавшую землю, нельзя было начать без их согласия. Долины веками держали по нему свои стрелковые роты."
 hab_directorium_bureaucracy: "Directorium in Publicis et Cameralibus"
 hab_directorium_bureaucracy_desc: "Центральный управленческий орган, введённый Фридрихом Вильгельмом графом фон Хаугвицем 2 мая 1749 года, после того как потеря Силезии обнажила несостоятельность сословных финансов. Директориум подчинил себе чешскую и австрийскую Hofkanzleien и Гофкаммер, сведя их в одну коллегию, и свёл в один центр раскладку податей, распределение рекрутских долей и терезианский кадастр. Провинциальные Landstände потеряли конституционное право отвергать Contributionale; на смену дворянам-сборщикам в уездах пришли постоянные жалованные Kreishauptleute."
 hab_josephinismus_bureaucracy: "Josephinismus"
 hab_josephinismus_bureaucracy_desc: "Иосифинская преобразовательная программа 1780–1790 годов, средоточием которой стал Патент о веротерпимости от 13 октября 1781 года (признавший лютеранское, кальвинистское и греко-православное исповедания) вместе с эдиктом о терпимости к иудеям 1782 года, отменой личного крепостного состояния в 1781 году и роспуском созерцательных монастырей, чьи вклады были обращены в Religionsfond, содержавший приходских священников и начальные школы. Иосиф II правил указами через Hofstellen, оттеснив прелатов и сословные сеймы ради камералистских Beamte, выученных в Терезиануме."
