l_english:
 bag_wsl_lab_title: "Slider lab"
 bag_wsl_yes: "yes"
 bag_wsl_no: "no"
 bag_wsl_row_minting: "Minting: value [GetEconomyView.GetCoinMinting|2], slider [GetEconomyView.GetDefaultCoinMinting|2], income [GetEconomyView.GetCoinMintingIncome|2]   ·   mod target [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_target').GetValue)|2]"
 bag_wsl_row_auto: "Auto minting: [SelectLocalization(GetPlayer.AutoCoinMinting, 'bag_wsl_yes', 'bag_wsl_no')]   ·   inflation [GetPlayer.GetFixedPointCurrencyValue('inflation')|2%] ([GetEconomyView.GetInflationChange|2-=%])   ·   panel open: [SelectLocalization(IsLateralViewOpened('economy'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_h1: "#Y Test 1. Drag this slider with the mouse#!"
 bag_wsl_h2: "#Y Test 2. The mod sets this slider's value, with the buttons below#!"
 bag_wsl_h3: "#Y Test 3. The same on maintenance: drag, or press Post#!"
 bag_wsl_row_maint: "[MaintenanceSetting.GetNameWithNoTooltip]: [MaintenanceSetting.GetSliderValue|2] / [MaintenanceSetting.GetDefault|2]"
 bag_wsl_btn_t0: "Target 0.00"
 bag_wsl_btn_t25: "Target 0.25"
 bag_wsl_btn_t50: "Target 0.50"
 bag_wsl_btn_t100: "Target 1.00"
 bag_wsl_btn_t0_tt: "Write the number into the mod's variable. Test 2's slider is bound to it and has to follow. If it follows and the panel's minting follows it, the mechanism is found."
 bag_wsl_btn_post: "Post taxes"
 bag_wsl_btn_post_tt: "Send the engine what the economy view currently holds."
 bag_wsl_btn_post_maint: "Post"
 bag_wsl_btn_post_maint_tt: "Send the engine what this maintenance setting holds."
 bag_wsl_btn_g: "Toggle auto minting"
 bag_wsl_btn_g_tt: "The vanilla checkbox, pressed by the mod. It worked in the first run, which is what proves interface calls from this window reach the game."
 bag_wsl_btn_h: "Pin window"
 bag_wsl_btn_h_tt: "Keep the window on screen with the economy panel closed."
 bag_wsl_lab_hint: "Watch the minting line above and the economy panel itself: does its slider and its income follow ours. Test 1 answers by hand, test 2 by the mod."
