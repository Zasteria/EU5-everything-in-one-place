l_english:
 bag_wsl_lab_title: "Slider lab"
 bag_wsl_yes: "yes"
 bag_wsl_no: "no"
 bag_wsl_row_panel: "Economy panel open: [SelectLocalization(IsLateralViewOpened('economy'), 'bag_wsl_yes', 'bag_wsl_no')]   ·   window pinned: [SelectLocalization(GetVariableSystem.Exists('bag_wsl_pin'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_row_minting: "Minting: value [GetEconomyView.GetCoinMinting|2], slider [GetEconomyView.GetDefaultCoinMinting|2], income [GetEconomyView.GetCoinMintingIncome|2]"
 bag_wsl_row_auto: "Auto minting: [SelectLocalization(GetPlayer.AutoCoinMinting, 'bag_wsl_yes', 'bag_wsl_no')]   ·   inflation [GetPlayer.GetFixedPointCurrencyValue('inflation')|2%] ([GetEconomyView.GetInflationChange|2-=%])"
 bag_wsl_row_maint: "[MaintenanceSetting.GetNameWithNoTooltip]: slider [MaintenanceSetting.GetSliderValue|2], value [MaintenanceSetting.GetDefault|2]"
 bag_wsl_btn_post_maint: "Post"
 bag_wsl_btn_post_maint_tt: "Send the engine whatever this maintenance setting currently holds."
 bag_wsl_btn_a: "A. Minting OnChanged"
 bag_wsl_btn_a_tt: "Call the minting slider's own handler directly, with no slider. It takes no argument — if it finds a value by itself, the slider figure above will move."
 bag_wsl_btn_b: "B. Post taxes"
 bag_wsl_btn_b_tt: "Send the engine what the economy view currently holds. Press after A or C."
 bag_wsl_btn_c: "C. Clamp minting to 0"
 bag_wsl_btn_c_tt: "Show a minting slider of our own with both caps at zero. If the handler fires on any value change and not only on the player's drag, minting drops to zero by itself."
 bag_wsl_btn_d: "D. Release minting"
 bag_wsl_btn_d_tt: "Remove our minting slider."
 bag_wsl_btn_e: "E. Clamp maintenance to 50%"
 bag_wsl_btn_e_tt: "The same for army, navy and forts: our own slider with both caps at 50%."
 bag_wsl_btn_f: "F. Release maintenance"
 bag_wsl_btn_f_tt: "Remove our maintenance sliders."
 bag_wsl_btn_g: "G. Toggle auto minting"
 bag_wsl_btn_g_tt: "The vanilla auto-minting checkbox, pressed by the mod rather than the mouse. Proves whether an interface call from our window reaches the game at all."
 bag_wsl_btn_h: "H. Pin window"
 bag_wsl_btn_h_tt: "Keep this window on screen with the economy panel closed, to see whether the economy view still answers."
 bag_wsl_lab_hint: "Order: open the economy panel, note the figures, then one button at a time from the top, watching the minting line and the panel itself."
