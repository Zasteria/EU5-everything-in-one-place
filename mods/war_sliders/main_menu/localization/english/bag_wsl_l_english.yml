l_english:
 bag_wsl_name: "Post-war sliders"
 bag_wsl_desc: "One button sets army, navy and fort maintenance to their peacetime value and works inflation off with minting. The mod watches nothing and does nothing in the background — only when the button is pressed."
 bag_wsl__main_name: "Sliders"
 bag_wsl__main__run_name: "Run"
 bag_wsl__main__maintenance_name: "Maintenance"
 bag_wsl__main__minting_name: "Minting and inflation"
 bag_wsl__main__debug_name: "Diagnostics"
 bag_wsl__run_now_name: "Fix the sliders"
 bag_wsl__run_now_desc: "One pass: maintenance goes to the values below at once. Minting: if inflation is above the target, auto-minting is switched off and the slider is set to work the excess off in one month, and stays there. If inflation is not above the target, minting is handed back to automation. So press it again a month later."
 bag_wsl__run_now_text: "Fix"
 bag_wsl__army_enabled_name: "Army maintenance"
 bag_wsl__army_enabled_desc: "Lower army maintenance when the button is pressed."
 bag_wsl__army_target_name: "Army: down to"
 bag_wsl__army_target_desc: "Where to put the slider in peacetime. It cannot go below the game's own minimum — the engine sets that limit, not the mod."
 bag_wsl__navy_enabled_name: "Navy maintenance"
 bag_wsl__navy_enabled_desc: "Lower navy maintenance when the button is pressed."
 bag_wsl__navy_target_name: "Navy: down to"
 bag_wsl__navy_target_desc: "Where to put the slider in peacetime. It cannot go below the game's own minimum."
 bag_wsl__fort_enabled_name: "Fort maintenance"
 bag_wsl__fort_enabled_desc: "Lower fort maintenance when the button is pressed."
 bag_wsl__fort_target_name: "Forts: down to"
 bag_wsl__fort_target_desc: "Where to put the slider in peacetime. It cannot go below the game's own minimum."
 bag_wsl__minting_enabled_name: "Work off inflation"
 bag_wsl__minting_enabled_desc: "The button handles minting too: inflation above the target lowers the slider for one month of correction, otherwise vanilla automation is restored. Vanilla automation keeps the monthly change at zero and never works off what has accumulated."
 bag_wsl__minting_target_name: "Minting while correcting"
 bag_wsl__minting_target_desc: "The lowest the minting slider goes during a correction. Zero is the fastest and the most expensive: that month's minting income is lost."
 bag_wsl__inflation_target_name: "Inflation target, hundredths of a percent"
 bag_wsl__inflation_target_desc: "The inflation to bring it down to. 0 means zero, 5 means 0.05%. If inflation is already not above it, the button starts no correction and hands minting back to automation."
 bag_wsl__show_lab_name: "Show the diagnostics window"
 bag_wsl__show_lab_desc: "A window beside the economy panel: what the mod remembers about the country's state, which drivers are armed, and how many have fired."
 bag_wsl_lab_title: "Post-war sliders — diagnostics"
 bag_wsl_yes: "yes"
 bag_wsl_no: "no"
 bag_wsl_row_minting: "Minting: value [GetEconomyView.GetCoinMinting|2], slider [GetEconomyView.GetDefaultCoinMinting|2], income [GetEconomyView.GetCoinMintingIncome|2]"
 bag_wsl_row_auto: "Auto minting: [SelectLocalization(GetPlayer.AutoCoinMinting, 'bag_wsl_yes', 'bag_wsl_no')]   ·   inflation [GetPlayer.GetFixedPointCurrencyValue('inflation')|2%] ([GetEconomyView.GetInflationChange|2-=%])   ·   panel open: [SelectLocalization(IsLateralViewOpened('economy'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_row_state: "Minting correction running: [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_mint_phase').IsSet, 'bag_wsl_yes', 'bag_wsl_no')]   ·   minting target [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_mint_target').GetValue)|2]"
 bag_wsl_row_mint: "Minting correction: zero point [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_m0').GetValue)|2]   ·   measured rate [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_drain').GetValue)|2%] a month   ·   remaining [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_rem').GetValue)|2%]"
 bag_wsl_row_flags: "Armed: army [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_army_go').IsSet, 'bag_wsl_yes', 'bag_wsl_no')], navy [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_navy_go').IsSet, 'bag_wsl_yes', 'bag_wsl_no')], forts [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_fort_go').IsSet, 'bag_wsl_yes', 'bag_wsl_no')]   ·   drivers fired: [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_runs').GetValue)|0]"
 bag_wsl_row_driver: "Driver awake: [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_busy').IsSet, 'bag_wsl_yes', 'bag_wsl_no')]   ·   driver armed: [SelectLocalization(GetVariableSystem.Exists('bag_wsl_armed'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_row_maint: "[MaintenanceSetting.GetNameWithNoTooltip]: [MaintenanceSetting.GetSliderValue|2] / [MaintenanceSetting.GetDefault|2]   (game minimum [MaintenanceSetting.GetMin|2])"
 bag_wsl_btn_run: "Run it now"
 bag_wsl_btn_run_tt: "The same as the Fix button on the mod's page in the CMF menu."
 bag_wsl_btn_reset: "Reset"
 bag_wsl_btn_reset_tt: "Clear armed drivers, stop any minting correction, zero the counter."
 bag_wsl_btn_h: "Pin window"
 bag_wsl_btn_h_tt: "Keep the window on screen with the economy panel closed."
 bag_wsl_lab_hint: ""Armed: yes" next to "drivers fired: 0" means the script did its part and the interface never reached the slider. Both zero means the mod never fired at all."
