l_russian:
 bag_wsl_lab_title: "Лаборатория ползунков"
 bag_wsl_yes: "да"
 bag_wsl_no: "нет"
 bag_wsl_row_panel: "Панель экономики открыта: [SelectLocalization(IsLateralViewOpened('economy'), 'bag_wsl_yes', 'bag_wsl_no')]   ·   окно закреплено: [SelectLocalization(GetVariableSystem.Exists('bag_wsl_pin'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_row_minting: "Чеканка: значение [GetEconomyView.GetCoinMinting|2], ползунок [GetEconomyView.GetDefaultCoinMinting|2], доход [GetEconomyView.GetCoinMintingIncome|2]"
 bag_wsl_row_auto: "Авто-чеканка: [SelectLocalization(GetPlayer.AutoCoinMinting, 'bag_wsl_yes', 'bag_wsl_no')]   ·   инфляция [GetPlayer.GetFixedPointCurrencyValue('inflation')|2%] ([GetEconomyView.GetInflationChange|2-=%])"
 bag_wsl_row_maint: "[MaintenanceSetting.GetNameWithNoTooltip]: ползунок [MaintenanceSetting.GetSliderValue|2], значение [MaintenanceSetting.GetDefault|2]"
 bag_wsl_btn_post_maint: "Отправить"
 bag_wsl_btn_post_maint_tt: "Послать движку то, что сейчас лежит в этом содержании. Второй шаг любого привода: сперва значение, потом отправка."
 bag_wsl_btn_a: "А. OnChanged чеканки"
 bag_wsl_btn_a_tt: "Позвать обработчик ползунка чеканки напрямую, без ползунка. Аргумента он не принимает — если возьмёт значение откуда-то сам, число «ползунок» в строке выше изменится."
 bag_wsl_btn_b: "Б. Отправить (PostTaxes)"
 bag_wsl_btn_b_tt: "Отправить движку то, что сейчас лежит в панели экономики: чеканку и налоги. Нажимать после А или В."
 bag_wsl_btn_c: "В. Зажать чеканку в 0"
 bag_wsl_btn_c_tt: "Показать наш собственный ползунок чеканки, у которого оба упора стоят в нуле. Если обработчик срабатывает не только от руки игрока, чеканка в панели уедет в 0 сама. Отправки при этом нет — её делает кнопка Б."
 bag_wsl_btn_d: "Г. Отпустить чеканку"
 bag_wsl_btn_d_tt: "Убрать наш ползунок чеканки."
 bag_wsl_btn_e: "Д. Зажать содержание в 50%"
 bag_wsl_btn_e_tt: "То же самое для армии, флота и крепостей: наш ползунок с обоими упорами в 50%. Отправка — кнопкой «Отправить» в самом ряду."
 bag_wsl_btn_f: "Е. Отпустить содержание"
 bag_wsl_btn_f_tt: "Убрать наши ползунки содержания."
 bag_wsl_btn_g: "Ж. Переключить авто-чеканку"
 bag_wsl_btn_g_tt: "Ванильная галочка автоматики чеканки, нажатая не мышью, а модом. Проверяет, доходит ли до игры вызов функции интерфейса из нашего окна вообще."
 bag_wsl_btn_h: "З. Закрепить окно"
 bag_wsl_btn_h_tt: "Оставить это окно на экране при закрытой панели экономики. Если числа продолжают печататься — значит, движок отдаёт панель экономики и закрытой, и моду не придётся её открывать."
 bag_wsl_lab_hint: "Порядок: открыть экономику, записать числа, затем по одной кнопке сверху вниз, каждый раз глядя на строку «Чеканка» и на саму панель. Нужен ответ на один вопрос: двинулось ли число хоть от одной кнопки."
