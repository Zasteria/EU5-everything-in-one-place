l_russian:
 bag_wsl_lab_title: "Лаборатория ползунков"
 bag_wsl_yes: "да"
 bag_wsl_no: "нет"
 bag_wsl_row_minting: "Чеканка: значение [GetEconomyView.GetCoinMinting|2], ползунок [GetEconomyView.GetDefaultCoinMinting|2], доход [GetEconomyView.GetCoinMintingIncome|2]   ·   цель мода [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_target').GetValue)|2]"
 bag_wsl_row_auto: "Авто-чеканка: [SelectLocalization(GetPlayer.AutoCoinMinting, 'bag_wsl_yes', 'bag_wsl_no')]   ·   инфляция [GetPlayer.GetFixedPointCurrencyValue('inflation')|2%] ([GetEconomyView.GetInflationChange|2-=%])   ·   панель открыта: [SelectLocalization(IsLateralViewOpened('economy'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_h1: "#Y Опыт 1. Потащи этот ползунок мышью#!"
 bag_wsl_h2: "#Y Опыт 2. Число этому ползунку задаёт мод — кнопками ниже#!"
 bag_wsl_h3: "#Y Опыт 3. То же на содержании: тащить мышью или жать «Отправить»#!"
 bag_wsl_row_maint: "[MaintenanceSetting.GetNameWithNoTooltip]: [MaintenanceSetting.GetSliderValue|2] / [MaintenanceSetting.GetDefault|2]"
 bag_wsl_btn_t0: "Цель 0.00"
 bag_wsl_btn_t25: "Цель 0.25"
 bag_wsl_btn_t50: "Цель 0.50"
 bag_wsl_btn_t100: "Цель 1.00"
 bag_wsl_btn_t0_tt: "Записать число в переменную мода. Ползунок опыта 2 привязан к ней и обязан поехать следом. Если поедет и за ним поедет чеканка в панели — привод найден, и мод готов."
 bag_wsl_btn_post: "Отправить (PostTaxes)"
 bag_wsl_btn_post_tt: "Послать движку то, что сейчас лежит в панели экономики. В прошлой версии эта кнопка была без обработчика — звалась через глобальный promote, а игра берёт такие вызовы только через datacontext."
 bag_wsl_btn_post_maint: "Отправить"
 bag_wsl_btn_post_maint_tt: "Послать движку то, что лежит в этом содержании."
 bag_wsl_btn_g: "Переключить авто-чеканку"
 bag_wsl_btn_g_tt: "Ванильная галочка, нажатая модом. В прошлом прогоне сработала — этим и доказано, что вызовы интерфейса из нашего окна до игры доходят."
 bag_wsl_btn_h: "Закрепить окно"
 bag_wsl_btn_h_tt: "Оставить окно на экране с закрытой панелью экономики."
 bag_wsl_lab_hint: "Смотреть надо на строку «Чеканка» вверху и на саму панель экономики: едет ли за нашим ползунком её ползунок и её доход. Опыт 1 отвечает рукой, опыт 2 — модом."
