l_russian:
 bag_wsl_name: "Ползунки после войны"
 bag_wsl_desc: "Возвращает содержание армии, флота и крепостей на мирное значение и выправляет инфляцию чеканкой — один раз, в тот месяц, когда держава перестала воевать целиком."
 bag_wsl__main_name: "Ползунки"
 bag_wsl__main__maintenance_name: "Содержание"
 bag_wsl__main__minting_name: "Чеканка и инфляция"
 bag_wsl__main__debug_name: "Диагностика"
 bag_wsl__army_enabled_name: "Содержание армии"
 bag_wsl__army_enabled_desc: "Опускать содержание армии, когда держава вышла из всех войн."
 bag_wsl__army_target_name: "Армия: до какого значения"
 bag_wsl__army_target_desc: "Куда ставить ползунок в мирное время. Ниже собственного минимума игры он не пойдёт — предел ставит движок, а не мод."
 bag_wsl__navy_enabled_name: "Содержание флота"
 bag_wsl__navy_enabled_desc: "Опускать содержание флота, когда держава вышла из всех войн."
 bag_wsl__navy_target_name: "Флот: до какого значения"
 bag_wsl__navy_target_desc: "Куда ставить ползунок в мирное время. Ниже собственного минимума игры он не пойдёт."
 bag_wsl__fort_enabled_name: "Содержание крепостей"
 bag_wsl__fort_enabled_desc: "Опускать содержание крепостей, когда держава вышла из всех войн."
 bag_wsl__fort_target_name: "Крепости: до какого значения"
 bag_wsl__fort_target_desc: "Куда ставить ползунок в мирное время. Ниже собственного минимума игры он не пойдёт."
 bag_wsl__minting_enabled_name: "Выправлять инфляцию"
 bag_wsl__minting_enabled_desc: "После войны опустить чеканку и держать её, пока инфляция не сойдёт к цели, а потом вернуть ползунок ванильной автоматике. Ванильная автоматика держит месячный прирост в нуле и накопленное не отыгрывает никогда — это и есть та половина, которой у неё нет."
 bag_wsl__minting_target_name: "Чеканка на время правки"
 bag_wsl__minting_target_desc: "Куда опускать ползунок чеканки, пока идёт правка. Ноль — самая быстрая правка и самая дорогая: доход с чеканки на эти месяцы теряется."
 bag_wsl__inflation_target_name: "Целевая инфляция, сотых процента"
 bag_wsl__inflation_target_desc: "До какой инфляции доводить. 0 — до нуля, 5 — до 0.05%. Правка не начнётся вовсе, если инфляция уже не выше цели."
 bag_wsl__show_lab_name: "Показывать окно диагностики"
 bag_wsl__show_lab_desc: "Окно рядом с панелью экономики: что мод помнит о состоянии державы, какие приводы взведены и сколько их сработало."
 bag_wsl_lab_title: "Ползунки после войны — диагностика"
 bag_wsl_yes: "да"
 bag_wsl_no: "нет"
 bag_wsl_row_minting: "Чеканка: значение [GetEconomyView.GetCoinMinting|2], ползунок [GetEconomyView.GetDefaultCoinMinting|2], доход [GetEconomyView.GetCoinMintingIncome|2]"
 bag_wsl_row_auto: "Авто-чеканка: [SelectLocalization(GetPlayer.AutoCoinMinting, 'bag_wsl_yes', 'bag_wsl_no')]   ·   инфляция [GetPlayer.GetFixedPointCurrencyValue('inflation')|2%] ([GetEconomyView.GetInflationChange|2-=%])   ·   панель открыта: [SelectLocalization(IsLateralViewOpened('economy'), 'bag_wsl_yes', 'bag_wsl_no')]"
 bag_wsl_row_state: "Мод помнит войну: [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_at_war').GetValue)|0]   ·   правка чеканки идёт: [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_mint_phase').IsSet, 'bag_wsl_yes', 'bag_wsl_no')]   ·   цель чеканки [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_mint_target').GetValue)|2]"
 bag_wsl_row_mint: "Правка чеканки: точка нуля [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_m0').GetValue)|2]   ·   измеренный темп [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_drain').GetValue)|2%] в месяц   ·   остаток [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_rem').GetValue)|2%]"
 bag_wsl_row_flags: "Взведено: армия [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_army_go').IsSet, 'bag_wsl_yes', 'bag_wsl_no')], флот [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_navy_go').IsSet, 'bag_wsl_yes', 'bag_wsl_no')], крепости [SelectLocalization(GetPlayer.MakeScope.GetVariable('bag_wsl_fort_go').IsSet, 'bag_wsl_yes', 'bag_wsl_no')]   ·   сработало приводов: [FixedPointToFloat(GetPlayer.MakeScope.GetVariable('bag_wsl_runs').GetValue)|0]"
 bag_wsl_row_maint: "[MaintenanceSetting.GetNameWithNoTooltip]: [MaintenanceSetting.GetSliderValue|2] / [MaintenanceSetting.GetDefault|2]   (минимум игры [MaintenanceSetting.GetMin|2])"
 bag_wsl_btn_run: "Сработать сейчас"
 bag_wsl_btn_run_tt: "Сделать ровно то, что мод делает в месяц выхода из войны, — но без войны. Взводит приводы по нынешним настройкам: содержание должно поехать на своё значение за мгновение, а чеканка — если инфляция выше цели."
 bag_wsl_btn_reset: "Сбросить"
 bag_wsl_btn_reset_tt: "Снять невыполненные приводы, прервать правку чеканки и обнулить счётчик."
 bag_wsl_btn_h: "Закрепить окно"
 bag_wsl_btn_h_tt: "Оставить окно на экране с закрытой панелью экономики."
 bag_wsl_lab_hint: "«Взведено: да» рядом со «сработало приводов: 0» означает, что скрипт своё сделал, а интерфейс до ползунка не дошёл. Оба нуля — мод не срабатывал вовсе."
