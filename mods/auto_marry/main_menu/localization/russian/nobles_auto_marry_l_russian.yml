 noble_auto_marry.71.t: "Предел численности дворов ИИ"
 noble_auto_marry.71.d: "Двор может содержать лишь определённое число придворных. Мы можем задать предел, сверх которого придворные стран ИИ не смогут свободно вступать в брак.\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_ai_pop_limit')]"
