 noble_auto_marry.89.t: "Ограничения по культуре"
 noble_auto_marry.89.d: "При дворе собрались люди разного происхождения и разных культур. Мы можем разрешить автоматические браки только тем, кто связан с государством общей культурой.\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_culture_settings')]"
 noble_auto_marry.89.a: "Без ограничений (в брак могут вступать все культуры)"
 noble_auto_marry.89.b: "Только основная, принятые и терпимые культуры"
