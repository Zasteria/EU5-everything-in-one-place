 noble_auto_marry.70.d: "Автоматические браки у ИИ сейчас [ROOT.GetCountry.Custom('get_noble_auto_marry_ai_toggle')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_ai_pop_limit')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_ai_non_noble_toggle')]"
