l_russian:

 noble_auto_marry.1.t: "Свадьба: [target_male.GetNameWithNoTooltip] и [target_female.GetNameWithNoTooltip]"
 noble_auto_marry.1.d: "После долгих месяцев сватовства [target_male.GetName] и [target_female.GetName] сочетались браком, и ещё два знатных дома, [target_male.GetDynasty.GetName] и [target_female.GetDynasty.GetName], стали ближе друг другу. Супругам предстоит продолжить свой род и воспитать новое поколение, достойное их предков."
 noble_auto_marry.1.a: "Поздравляем жениха и невесту"
 noble_auto_marry.1.b: "Оставим знать праздновать без нас"
 hide_marriage_events.tt: "Вы больше не будете получать события о свадьбах знати"
 noble_auto_marry.2.t: "[unmarried_royal.GetNameWithNoTooltip] ждёт пары"
 noble_auto_marry.2.d: "[unmarried_royal.GetName] напоминает правителю, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], что до сих пор не состоит в браке, и тревожится из-за этой нерешительности."
 noble_auto_marry.2.a: "[unmarried_royal.GetNameWithNoTooltip]: мы ещё найдём подходящую пару"
 noble_auto_marry.2.b: "[unmarried_royal.GetNameWithNoTooltip]: пусть выбирает по сердцу среди нашей знати"
 unmarried_royal_will_find_suitable_spouse.tt: "[unmarried_royal.GetName] выберет пару по сердцу и в течение года вступит в брак с кем-то из местной знати"
 noble_auto_marry.3.t: "Свадьба: [unmarried_royal.GetNameWithNoTooltip] и [target_suitor.GetNameWithNoTooltip]"
 noble_auto_marry.3.d: "После долгих месяцев сватовства [unmarried_royal.GetName] и [target_suitor.GetName] сочетались браком, и ещё два знатных дома, [unmarried_royal.GetDynasty.GetName] и [target_suitor.GetDynasty.GetName], стали ближе друг другу. Супругам предстоит продолжить свой род и воспитать новое поколение, достойное их предков."
 noble_auto_marry.3.a: "Поздравляем жениха и невесту"
 auto_marry_reminder_sent: "Спрашивал о браке"
 auto_marry_reminder_sent_desc: "Этот персонаж уже обращался к правителю по поводу своего брака"
 noble_auto_marry.63.t: "Брачные порядки двора"
 noble_auto_marry.63.d: "В теории правитель ([ROOT.GetCountry.GetGovernment.GetRulerTitle]) вправе одобрить или запретить любой брак между придворными. На деле же держать под полным контролем все отношения при дворе трудно, а порой и вовсе бессмысленно.\n\nСейчас [ROOT.GetCountry.Custom('get_noble_auto_marry_disabled')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_message_settings')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_royal_reminder_settings')]\n\n[ROOT.GetCountry.Custom('get_auto_marry_royal_setting')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_pop_limit')]\n\nДействующий брачный порядок: [ROOT.GetCountry.Custom('get_nobles_auto_marry_eligibility_settings')]\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_culture_settings')]\n\nБез надзора сейчас могут вступать в брак: [ROOT.GetCountry.Custom('get_noble_only_auto_marry_setting')]#color_yellow [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]#![ROOT.GetCountry.Custom('get_burghers_auto_marry_setting')][ROOT.GetCountry.Custom('get_clergy_auto_marry_setting')][ROOT.GetCountry.Custom('get_peasants_auto_marry_setting')][ROOT.GetCountry.Custom('get_dhimmi_auto_marry_setting')][ROOT.GetCountry.Custom('get_tribes_auto_marry_setting')][ROOT.GetCountry.Custom('get_cossacks_auto_marry_setting')]."
 noble_auto_marry.63.a: "Вкл./выкл. события о свадьбах"
 noble_auto_marry.63.b: "Предел численности двора"
 noble_auto_marry.63.c: "Кому можно вступать в брак"
 noble_auto_marry.63.e: "Браки незнатных сословий"
 noble_auto_marry.63.f: "Вкл./выкл. автоматические браки"
 noble_auto_marry.63.g: "Автоматические браки у ИИ"
 noble_auto_marry.63.i: "Вкл./выкл. напоминания о династических браках"
 noble_auto_marry.63.j: "Ограничения по культуре"
 noble_auto_marry.63.h: "Закрыть меню"
 noble_auto_marry.64.t: "Предел численности двора"
 noble_auto_marry.64.d: "Двор может содержать лишь определённое число придворных. Мы можем объявить, что двор не примет всех желающих, и тем самым удержать его от дальнейшего разрастания.\n\n[ROOT.GetCountry.Custom('get_noble_auto_marry_pop_limit')]. Пока двор больше этого предела, автоматических браков не будет."
 noble_auto_marry.64.a: "Объявить, что при дворе рады всем (без предела)"
 noble_auto_marry.64.g: "Предел численности: 500"
 noble_auto_marry.64.b: "Предел численности: 200"
 noble_auto_marry.64.c: "Предел численности: 100"
 noble_auto_marry.64.e: "Предел численности: 50"
 noble_auto_marry.64.f: "Закрыть меню без изменений"
 noble_auto_marry.65.t: "Кому можно вступать в брак"
 noble_auto_marry.65.d: "Власть государства над браками придворных не обязана быть абсолютной. Мы можем объявить порядок, по которому придворные, отвечающие нашим условиям, вправе вступать в брак.\n\nДействующий брачный порядок: [ROOT.GetCountry.Custom('get_nobles_auto_marry_eligibility_settings')]"
 noble_auto_marry.65.a: "Придворные вольны вступать в брак"
 noble_auto_marry.65.b: "Придворные могут вступать в брак, если их семья не слишком велика"
 noble_auto_marry.65.c: "Придворные могут вступать в брак только ради продолжения рода"
 noble_auto_marry.65.e: "Закрыть меню без изменений"
 noble_auto_marry.66.t: "Браки незнатных сословий"
 noble_auto_marry.66.d: "Браки знати строго под надзором: от каждой семьи ждут союза, достойного её положения. Но при дворе есть и представители других сословий, к чьим бракам требования куда мягче. Если пожелаем, мы можем разрешить вступать в брак и незнатным.\n\nБез надзора сейчас могут вступать в брак: [ROOT.GetCountry.Custom('get_noble_only_auto_marry_setting')]#color_yellow [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]#![ROOT.GetCountry.Custom('get_burghers_auto_marry_setting')][ROOT.GetCountry.Custom('get_clergy_auto_marry_setting')][ROOT.GetCountry.Custom('get_peasants_auto_marry_setting')][ROOT.GetCountry.Custom('get_dhimmi_auto_marry_setting')][ROOT.GetCountry.Custom('get_tribes_auto_marry_setting')][ROOT.GetCountry.Custom('get_cossacks_auto_marry_setting')]."
 noble_auto_marry.66.a: "Право на брак только у сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]»"
 noble_auto_marry.66.b: "Вкл./выкл. браки сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]»"
 noble_auto_marry.66.c: "Вкл./выкл. браки сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]»"
 noble_auto_marry.66.e: "Вкл./выкл. браки сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]»"
 noble_auto_marry.66.f: "Вкл./выкл. браки сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('dhimmi_estate')]»"
 noble_auto_marry.66.g: "Вкл./выкл. браки сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]»"
 noble_auto_marry.66.h: "Вкл./выкл. браки сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('cossacks_estate')]»"
 noble_auto_marry.66.i: "Разрешить браки всем сословиям"
 noble_auto_marry.66.j: "Закрыть меню без изменений"
