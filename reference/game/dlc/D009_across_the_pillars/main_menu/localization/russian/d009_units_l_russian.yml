l_russian:
 a_ahl_tinmal_spearmen: "Тинмальские копейщики"
 a_ahl_tinmal_spearmen_desc: "Тинмальские копейщики происходят из Атласских гор, а именно из Тинмаля — горного поселения, где когда-то был лагерь Мухаммеда ибн Тумарта, а потом и его гробница, впоследствии уничтоженная Маринидами. Сначала они брали в свои ряды лишь представителей собственного племени харга, но впоследствии стали принимать и других членов конфедерации масмуда. Их повстанческое движение фактически воевало со всем государством: к 1120 годам альморавидская власть издавала противоречивые приказы, а в её армиях Альморавидов и вовсе не осталось. Эти копейщики заложили фундамент халифата, о котором нынешнее государство масмуда с гордость вспоминает как об империи, объединившей западный исламский мир."
 a_caballeria_de_cuantia: "Кастильская кавалерия"
 a_caballeria_de_cuantia_desc: "Кастильская кавалерия представляет собой конное ополчение, состоящее из хорошо подготовленных и обеспеченных мужчин, которые не имеют благородного происхождения, но при этом способны содержать собственную лошадь и обмундирование. Эти лёгкие всадники, использующие в бою тактику #italic хинетов#!, служат промежуточным звеном между знатными рыцарями и пешими ополченцами из городов. Предоставив этим воинам определённые привилегии и налоговые послабления, корона смогла собрать большое количество опытных и относительно дешёвых всадников, которые теперь составляют костяк кастильской конницы."
 a_coronelias: "Коронелии"
 a_coronelias_desc: "Коронелиями назывались пехотные формирования, которые Гонсало Фернандес де Кордова создал в период Итальянских войн. Каждая коронелия состояла из нескольких отрядов пикинеров, мечников и аркебузиров, объединённых под командованием одного полковника. Вместо того, чтобы бросаться в бой всем скопом, разные виды войск занимали свои определённые места в строю. Знаменитые #italic терции#! тогда ещё не появились (это случилось позже в Генуе), но они были созданы на основе коронелий из числа солдат, имевших опыт сражения в них."
 a_granadan_crossbowmen: "Гранадские арбалетчики"
 a_granadan_crossbowmen_desc: "Своё оружие гранадские арбалетчики не унаследовали от предков, а заимствовали у соседей: Ибн Худайль в письме Мухаммаду V назвал его #italic кадиб афранджи#! — то есть, франкский лук. Когда-то мы захватывали арбалеты как трофеи в пограничных войнах, а теперь наши собственные мастерские производят их во вполне достаточных количествах. В отличие от лучника, который учится всю жизнь, арбалетчика можно подготовить за один сезон, а выпущенный им стальной болт пробивает доспехи, способные остановить стрелу."
 a_granadan_jinetes: "Гранадские хинеты"
 a_granadan_jinetes_2: "Современные гранадские хинеты"
 a_granadan_jinetes_2_desc: "Военное искусство гранадских хинетов совершенствовалось в течение многих поколений, что в итоге привело к созданию ещё более грозной кавалерии. В дополнение к дротикам современные хинеты оснащены кольчужными рубахами и длинными копьями, однако тактика быстрых ударов и ложных отступлений по-прежнему остаётся ключевой особенностью гранадской лёгкой конницы."
 a_granadan_jinetes_desc: "Появившиеся на полях Андалусских пограничных войн хинеты используют в бою дротики, короткие мечи и круглые кожаные щиты, а их кони лишены доспехов. Хинеты навязали Пиренейскому полуострову свой темп ведения войны, позаимствовав у берберов тактику быстрых набегов, которую быстро переняли и остальные соседние державы."
 a_guich_cavalry: "Гишская кавалерия"
 a_guich_cavalry_desc: "Гишскую кавалерию набирают из берберских и арабских племён #italic гиш#!, которые получили от марокканского султана земли и взамен обязались предоставлять ему всадников во время войны. Этот договор позволил нам создать регулярное конное войско, которое хранит верность лично султану, а в условиях политической раздробленности это качество делает гишскую кавалерию ценнее любой призывной или наёмной армии. Теперь эти хорошо подготовленные и оснащённые воины обеспечивают порядок на границе между землями мазхаба и непокорными провинциями, а также возглавляют походы против мятежных племенных конфедераций."
 a_hermandad_infantry: "Пехотинцы эрмандады"
 a_hermandad_infantry_desc: "По своей сути эти пехотинцы являются обыкновенными ополченцами из братства святой эрмандады — военной организации, созданной специально для обеспечения порядка на обширных землях Кастилии. Однако, в отличие от феодальных ополчений прошлых столетий, эти воины подчиняются не местным сеньорам, а городским советам и королевским магистратам. За счёт этого они могут похвастаться улучшенной подготовкой, дисциплиной и снаряжением, что делает их гораздо более надёжным инструментом в руках централизованного государства, чем наспех собранное феодальное войско."
 a_hilali_bedouin_cavalry: "Хилялийская кавалерия бедуинов"
 a_hilali_bedouin_cavalry_desc: "Хилялийская кавалерия состоит из лёгких всадников, принадлежащих к арабским племенным конфедерациям Бану Хиляль и Бану Сулейм, которые в XI веке перекочевали из Верхнего Египта в Магриб. В результате этого переселения берберское большинство в центральном и восточном Магрибе сменилось на арабское, а вместе с тем изменился и образ жизни всего региона. Сегодня эти конницы служат нам в качестве вспомогательных войск, которые сами назначают своих командиров и содержат собственных лошадей, при этом получая оплату в виде доли от военной добычи. За счёт своей скорости, мобильности и высокой численности эти бедуинские подразделения прекрасно дополняют нашу армию, а собственные резервы позволяют им избегать конкуренции за рекрутов с конфедерациями берберов."
 a_infanteria_de_marina: "Морская пехота"
 a_infanteria_de_marina_desc: "Морская пехота приписана к военным судам кастильского флота. Эти бойцы берут на абордаж вражеские корабли, возглавляют высадки и штурмуют береговые укрепления. Регулярные роты морской пехоты, организованные в виде #italic терций#!, могут одинаково эффективно сражаться как на палубе галеона, так и на стенах прибрежных крепостей, что делает их поистине незаменимым инструментом для укрепления нашего могущества на море и на иностранных берегах."
 a_kabyle_skirmishers: "Кабильские застрельщики"
 a_kabyle_skirmishers_desc: "Кабильские застрельщики живут среди горных хребтов Джурджура и Бабор к востоку от Алжира. Эти отважные берберские воины в течение двух тысяч лет отражали нападения римлян, вандалов, арабов и иберийцев на свои земли. Вооружённые дротиками, они устраивают засады на вражеские колонны, а затем скрываются в горах, где ни одно крупное войско не может их преследовать. Кабильская тактика горной войны даёт магрибским армиям большой простор для манёвра и фланговых атак в скалистой и лесистой местности, где регулярная пехота практически бессильна."
 a_masmuda_atlas_infantry: "Масмудские пехотинцы Атласа"
 a_masmuda_atlas_infantry_desc: "Эти берберские пехотинцы родом с Атласских гор вооружены тяжёлыми копьями и луками. За счёт своей железной дисциплины они стали опорой альмохадской армии, которая в XII веке успешно завоевала значительную часть Магриба и Иберийского полуострова. Во многом именно благодаря своему опыту в имперской армии Альмохадов они научены сражаться в плотном строю, специально приспособленном для горных боёв и стычек с тяжёлой христианской кавалерией. Эти воинские традиции отразились на армиях магрибских держав, чьи тяжёлые пехотинцы теперь могут дать отпор любому конному войску."
 a_mesnaderos: "Меснадерос"
 a_mesnaderos_desc: "Меснадерос — это тяжеловооружённые рыцари, которые непосредственно подчиняются монархам Наварры и Арагона. Будучи членами #italic меснады#!, эти воины связаны древними традициями, которые обязывают их верно служить своему господину. Несмотря на то, что обычно эти опытные рыцари принадлежат к личной свите монарха, они вполне могут участвовать в сражениях там, где феодальному ополчению недостаёт скорости и дисциплины."
 a_milicia_concejil: "Муниципальное ополчение"
 a_milicia_concejil_desc: "Эти дружины состоят на службе у кастильских и леонских #italic консехос#! — муниципалитетов, которые согласно королевскому указу обязаны готовить и снаряжать бойцов для обороны местных земель и пограничных территорий. Набранные из городских купцов и ремесленников, эти ополчения представляют собой достаточно дешёвые и доступные войска, которые при всех своих недостатках отлично знают местность и готовы до последнего защищать родные края."
 a_milicia_irmandinha: "Эрмандандское ополчение"
 a_milicia_irmandinha_desc: "Народное войско, собранное #italic ирмандадами#! — вооружёнными братствами, которые в середине XIV века объединили множество галисийских городов и организовали восстание против знати. Эти легковооружённые, но крайне отважные бойцы воплощают собой солидарность горожан и мелких землевладельцев, которые устали от произвола дворян и решили сбросить с себя сеньорское иго."
 a_miquelets: "Микелеты"
 a_miquelets_desc: "Микелеты представляют собой нерегулярные отряды пехоты, закалённые в суровых каталонских горах. Они многие поколения служили местным сеньорам и кастильским монархам, обороняя горные перевалы Пиренеев и скалистые утёсы восточного побережья Каталонии. Значительно превосходя регулярные войска в мобильности, микелеты преуспели в организации засад и налётов. Они умело обращают ландшафт в свою пользу, обрушивая на врагов свои изнуряющие удары и мгновенно исчезая в горах, где они чувствуют себя более чем вольготно."
 a_mulaththamun_spearmen: "Копейщики-мулаттамуны"
 a_mulaththamun_spearmen_desc: "Копейщики-мулаттамуны из западно-сахарской племенной конфедерации санхаджа называются так из-за #italic лисамов#! — особых головных повязок, с которыми они не расстаются никогда. Племя ламтуна особенно прославилось своими воинами, сражающимися в плотном строю и строго соблюдающими маликитское Ибн Ясина. Под знамёнами Юсуфа ибн Ташфина они прошли от сахарских эргов до долины Эбро. В первом ряду их строя стоят воины с длинными пиками, а позади — метатели дротиков; все они носят щиты-#italic ламты#! из шкуры орикса, а также повязки, скрывающие всё лицо, кроме глаз. Их несгибаемый боевой дух основан на религиозном рвении, с которым не сравнится ни одна светская военная традиция. Породившая их империя давно пала, но Магриб никогда не забудет их бесстрашия, а санхаджа и по сей день продолжает обучать отряды этих тяжёлых пехотинцев."
 a_mutatawwia: "Мутатавви"
 a_mutatawwia_desc: "#italic Мутатавви#! — это добровольческое святое воинство на службе у Насридов. Эти набожные люди участвуют в ежегодных набегах не ради денег, а ради обещанного рая и возможности участвовать в грабежах. Они легко вооружены и проворны, что позволяет им с копьём и мечом напасть на ряды христиан, а затем скрыться в горах. Благодаря этому они считаются самыми непредсказуемыми и свирепыми ополченцами Гранады."
 a_sanhaja_camel_cavalry: "Верблюжья кавалерия санхаджи"
 a_sanhaja_camel_cavalry_desc: "$a_sanhaja_camel_cavalry$ — полки лёгкой верблюжьей и лошадиной кавалерии, состоящие из воинов сахарских племён конфедерации санхаджи: ламтуна, гудала и массуфа. Именно эти воины, облачённые в закрывающие лицо головные уборы, в XI веке помогли создать империю Альморавидов, раскинувшуюся по всему Западному Магрибу и Иберии. Их верблюды способны преодолевать по пустыне огромные расстояния, недоступные обычной коннице, а натиски с лёгкими копьями наперевес не уступают в смертоносности атакам тяжеловооружённой конницы Иберии и Центрального Сахеля. Благодаря кавалерии санхаджи логистические и манёвренные возможности нашей армии на южной границе возрастают многократно."
 a_sometent: "Сометент"
 a_sometent_desc: "$a_sometent$ — городское и сельское каталонское ополчение. Слово #italic «сометент»#! с каталонского языка можно перевести как «колокольный звон» — именно так созывают всех способных держать оружие, когда граница под угрозой. Эти простые люди, вооружённые копьём и щитом, готовы отдать жизнь за свой очаг и родную деревню, а потому сломить их трудно даже опытным налётчикам."
 a_alabarderos: "Алабардерос"
 a_alabarderos_desc: "$a_alabarderos$ — королевская гвардия Кастильской короны, вооружённая алебардами. Эти воины несут прежде всего церемониальную службу: они не только охраняют монарших особ, но и украшают королевский двор."
 a_guardias_de_ornato: "Церемониальная гвардия"
 a_guardias_de_ornato_desc: "$a_guardias_de_ornato$ — парадные гвардейцы Кастильской короны, вооружённые алебардами. Эти богато одетые воины — преемники алабардерос; их задача — сопровождать монарших особ, оберегая их от врагов с помощью копий и алебард."
 a_thagri: "Сагрийцы"
 a_thagri_2: "Поздние сагрийцы"
 a_thagri_2_desc: "Многолетняя служба превратила сагрийцев из простых солдат в наследственных защитников приграничья. Умение маршировать они впитали с молоком матери, знания дорог и перевалов переняли от дедов, а строевую выучку — от отцов. Живут они по-крестьянски просто, на скромное жалование, но при этом способны месяцами держать горные рубежи там, где рыцарское войско не продержится и пары недель."
 a_thagri_desc: "#italic Сагрийцы#! — это пешие копейщики, набираемые из деревень в приграничных провинциях, #italic сугурах#!. Они знают каждый перевал и ручей на рубежах Аль-Андалуса. За счёт деревенского пропитания их обучение обходится дёшево, они способны неделями выживать на пайках, которых кастильским войскам хватило бы на несколько дней, и они готовы выступать по первому же сигналу. Они вооружены простым оружием, а Их оружие незамысловато, а жалованье скудно, однако ни одно воинство в Иберии не сравнится с ними в стойкости на горных рубежах."
 a_tornadizos: "Торнадисос"
 a_tornadizos_2: "Поздние торнадисос"
 a_tornadizos_2_desc: "Поселенцы-торнадисос служат в тяжёлой коннице, выучкой и вооружением не уступающей лучшим рыцарским орденам Иберии. За прошедшие десятилетия их копья стали длиннее, доспехи — прочнее, а численность перестала зависеть от обстановки на границе. Андалусская тяжёлая кавалерия наконец обрела силу и облик настоящего войска и сражается под нашими знамёнами против тех королевств, чьи военные традиции когда-то служили ей примером для подражания."
 a_tornadizos_desc: "Торнадисос — перебежчики из христианских королевств, предпочитающие служить по другую сторону границы. В бою эти кавалеристы, одетые в доспехи и вооружённые копьями, действуют так же, как кастильские и арагонские #italic жандармы#! — с той лишь разницей, что сражаются они под зелёными знамёнами нашего эмирата, бок о бок с гранадскими хинетами. Набирать торнадисос трудно: перебежчиков немного, но каждый воин, обученный христианскому военному делу, лишь помогает укреплять боевую мощь нашей конницы, и одолеть её способны очень немногие."
 a_tuareg_camelry: "Туарегская верблюжья кавалерия"
 a_tuareg_camelry_desc: "$a_tuareg_camelry$ — всадники на стремительных #italic мехари#! из глубин Сахары. Её основу составляют юные воины из кланов сахарских конфедераций — Кель-Ахаггар, Кель-Аир и Ивеллеммеден. Они передвигаются верхом на специально выведенных для быстрой скачки дромадерах, способных с удивительной скоростью пересекать пески и каменистые равнины. В бою туареги атакуют врага длинными копьями, а после удара берутся за мечи #italic такуба#!, чтобы добить противника. Благодаря исключительной выносливости — верблюды могут три дня обходиться без воды, чего нельзя сказать о конях, — верблюжьей кавалерии нет равных в деле контролирования путей через Сахару. Подвижные отряды туарегов — главная сила наших конфедераций: они могут и устроить налёт, и пройти дозором там, где остановится конница."
 a_zenata_cavalry: "Всадники зената"
 a_zenata_cavalry_desc: "$a_zenata_cavalry$ — лёгкая конница берберской конфедерации зената: племён Бану Марин, Бану Абд аль-Вад и Маграва. Они с детства привыкли к кочевой жизни и прекрасно знают, как вести быстрый бой в пустыне и степи. Каждый воин снаряжает себя сам: у него свой конь, оружие и отряд соплеменников, поэтому для сбора не нужны ни королевские арсеналы, ни годы подготовки. В распоряжении магрибских султанов — быстрые и подвижные ударные отряды, за которыми не способны угнаться ни христианская, ни восточная мусульманская кавалерия."
 n_carraca_portuguesa: "Португальская каракка"
 n_carraca_portuguesa_desc: "$n_carraca_portuguesa$ — залог нашей силы и влияния на востоке. Это тяжёлое, огромное, многопалубное судно способно выдержать даже самую суровую бурю по пути в Индию, обогнуть мыс Доброй Надежды и вернуться обратно с шелками и пряностями из стран Индийского океана. Ощетинившиеся множеством пушек, везущие сотни солдат каракки — подлинные плавучие крепости, благодаря которым Португалия сумела проложить новые торговые пути и распространить своё влияние далеко за пределы державы."
 n_galeota_andalusi: "Андалусский галиот"
 n_galeota_andalusi_desc: "$n_galeota_andalusi$ — быстрая гребная галера андалусских корсаров, созданная не столько для продолжительных сражений в линейном строю, сколько для внезапных набегов. На борту таких кораблей служат опытные моряки из портов Гранады и с южных берегов. Андалусские галиоты — гроза христианских рыбацких деревушек и торговых путей: они наносят удар, прежде чем враг успевает организовать оборону, и уходят по ветру, пока не прибыла подмога."
 n_ghurab_maghribi: "Магрибский гураб"
 n_ghurab_maghribi_desc: "Название #italic гураб#!, означающее «ворон», носит длинная вёсельная галера, вместо тяжёлых орудий укомплектованная большой абордажной командой. Такие галеры строятся на верфях Сале, Бадиса и Хунайна, а матросами на них служат представители прибрежных племён Магриба. Группа гурабов способно быстро догнать торговое судно и взять его на абордаж раньше, чем его команда успеет занять оборону. Благодаря традиции гребных пиратских судов у каждого магрибского султана был флот, способный бороться за проливы и прибрежные морские пути без использования дорогостоящей артиллерии."
 n_nao_castellana: "Кастильское нао"
 n_nao_castellana_desc: "$n_nao_castellana$ — огромный торговый корабль Кастильской короны, способный при этом огрызнуться мощным пушечным залпом. Благодаря широкому корпусу и высоким надстройкам #italic нао#! могут не только пересечь мировой океан, но и дать отпор любому вражескому флоту — для этого на борту всегда есть достаточно орудий и солдат. Именно на таких кораблях совершались великие географические открытия, и именно в их трюмах богатства Нового Света попадают в Кастилию."
 n_sale_rover: "Салейское пиратское судно"
 n_sale_rover_desc: "$n_sale_rover$ — лёгкий парусный корабль корсаров республики Бу-Регрег, с малой осадкой и высокой скоростью. Такие корабли строят на верфях Сале и Рабата беженцы-орначеро и мориски — жители раскинувшегося у устья реки вольного корсарского города. Их капитаны охотятся в Атлантике на суда, ходящие у берегов Иберии, Канарских островов и Западного Средиземноморья, и способны уйти от любого отправившегося в погоню многопушечного галеона. Наша держава располагает целым флотом стремительных корсарских кораблей, которым нет равных среди других пиратов."
