l_russian:
 d009_iberian_order_events.1.title: "Магистерство [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.1.entry: "Магистерство Сантьяго"
 d009_iberian_order_events.1.desc: "Магистр [target_order.GetName] мёртв, и братья собрались на капитул, чтобы назвать его преемника.\n\nНи один другой орден в [ROOT.GetCountry.GetName] не богаче и не опаснее. Его комтурства тянутся от Тахо до границы [ShowAreaName('andalusia_area')], его копья подчиняются лишь Магистру, который не обязан повиноваться никому, кроме Папы, и тот, кого изберёт капитул, будет держать в своих руках больше нашей южной границы, чем всё наше [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] вместе взятое.\n\n[target_ruler.GetName] не стал дожидаться приглашения. [target_ruler.GetSheHe|U] уже выехал в капитулярный дом, с охраной за [target_ruler.GetHerHis] спиной и кандидатом на уме."
 d009_iberian_order_events.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] назначит магистра."
 d009_iberian_order_events.1.a.entry: "$crown_estate$ назначит Магистра."
 d009_iberian_order_events.1.b: "Пусть братья [target_order.GetNameWithNoTooltip] изберут своего."
 d009_iberian_order_events.1.b.entry: "Пусть братья изберут своего."
 d009_iberian_order_events.1.c: "Пусть дело решает Папа."
 d009_iberian_order_events.2.title: "Сокровища [ShowLocationNameWithNoTooltip('ucles')]"
 d009_iberian_order_events.2.entry: "$d009_iberian_order_events.2.title$"
 d009_iberian_order_events.2.desc: "[ShowLocationName('ucles')] — это столица и казна [target_order.GetName]. Два века дани с границы, завещаний умирающих рыцарей и рент со ста комтурств хранятся за его стенами в виде утвари, монет и реликвариев.\n\nНаша собственная казна куда скромнее. Ни один закон не позволяет нам открыть эту дверь, ведь богатство ордена принадлежит [GetUniqueInternationalOrganization('catholic_church').GetName], и братья громко об этом заявят. Но между нашим указом и сокровищницей тоже нет никакого войска."
 d009_iberian_order_events.2.a: "Орден оплатит наши войны."
 d009_iberian_order_events.2.b: "Оставить всё как есть и обеспечить дом в [ShowLocationNameWithNoTooltip('ucles')]."
 d009_iberian_order_events.2.c: "Послать ревизоров и забрать долю [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.2.c.entry: "Послать ревизоров и забрать долю $crown_estate$."
 d009_iberian_order_events.3.title: "Дорога в [ShowLocationNameWithNoTooltip('santiago_compostela')]"
 d009_iberian_order_events.3.entry: "$d009_iberian_order_events.3.title$"
 d009_iberian_order_events.3.desc: "Год от года их всё больше приходит из [ShowAreaName('flanders_area')] и из-за самих Пиренеев, они идут на запад через наш [ROOT.GetCountry.GetFlavorRank] к святыне апостола. Они несут с собой серебро на дорожные нужды, и за это серебро их грабят.\n\n[target_order.GetName] был основан именно для того, чтобы охранять этот путь. Его братья содержат странноприимные дома и мосты, а магистр напоминает нам, стоит лишь прислушаться, что охрана дороги обходится дороже, чем приносит сама дорога."
 d009_iberian_order_events.3.a: "Платить братьям за охрану дороги."
 d009_iberian_order_events.3.b: "Пусть лучше берут мзду с паломников."
 d009_iberian_order_events.3.c: "Передать им странноприимный дом в [ShowLocationNameWithNoTooltip('leon')]."
 d009_iberian_order_events.11.title: "Вопрос Сито"
 d009_iberian_order_events.11.entry: "$d009_iberian_order_events.11.title$"
 d009_iberian_order_events.11.desc: "[target_order.GetName] — это цистерцианский дом, который носит копья. Его устав идёт из Сито в [ShowAreaName('burgundy_area')], его аббаты приезжают с юга с проверками, а его братья принимают дисциплину от монахов, никогда не видевших мавра.\n\nВизитация вновь настала, и на этот раз магистр спросил, должен ли он её принимать. Иноземные аббаты, которые наставляют людей, обороняющих наш рубеж, — это либо источник знаменитой дисциплины ордена, либо оскорбление нашего [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], смотря кого спросить."
 d009_iberian_order_events.11.a: "Пусть аббаты Сито сохранят право визитации."
 d009_iberian_order_events.11.b: "Орден отвечает перед нами, а не перед [ShowAreaNameWithNoTooltip('burgundy_area')]."
 d009_iberian_order_events.11.c: "Пусть законники спорят об этом ещё несколько лет."
 d009_iberian_order_events.12.title: "Магистерство [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.12.entry: "Магистерство Калатравы"
 d009_iberian_order_events.12.desc: "Пост магистра [target_order.GetName] опустел, и капитул уже расколот. У одной партии есть свой кандидат, у другой — соперник, и у обеих под рукой вооружённые слуги в дне пути от замка.\n\n[target_ruler.GetName] помнит, во что обошлись нам последние спорные выборы нашему [ROOT.GetCountry.GetFlavorRank]. Магистр [target_order.GetNameWithNoTooltip] распоряжается замками всей центральной марки; магистр, ничем нам не обязанный, распорядится ими против нас так же легко, как и за нас."
 d009_iberian_order_events.12.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] назначит магистра."
 d009_iberian_order_events.12.a.entry: "$crown_estate$ назначит магистра."
 d009_iberian_order_events.12.b: "Пусть братья [target_order.GetNameWithNoTooltip] изберут своего."
 d009_iberian_order_events.12.b.entry: "Пусть братья изберут своего."
 d009_iberian_order_events.12.c: "Пусть Сито рассудит между фракциями."
 d009_iberian_order_events.13.title: "Поле под Альмагро"
 d009_iberian_order_events.13.entry: "$d009_iberian_order_events.13.title$"
 d009_iberian_order_events.13.desc: "Альмагро — богатейшая комтурия [target_order.GetName], расположенная на самом перекрестье дорог Ла-Манчи. Пока наша [ROOT.GetCountry.Custom('end_fem')] воюет, тот, кто держит Альмагро, держит зерно, заводных лошадей и переправу.\n\nТамошний командор никому не послал заявления. Он ждёт, когда его спросят, а спрашивают его не одни мы."
 d009_iberian_order_events.13.a: "Альмагро объявит себя за [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.13.a.entry: "Альмагро объявит себя за $crown_estate$."
 d009_iberian_order_events.13.b: "Пусть комтурия следует собственной совести."
 d009_iberian_order_events.13.c: "Ни одной из сторон не позволят воспользоваться Альмагро."
 d009_iberian_order_events.21.title: "Граница у [ShowLocationNameWithNoTooltip('alcantara')]"
 d009_iberian_order_events.21.entry: "$d009_iberian_order_events.21.title$"
 d009_iberian_order_events.21.desc: "Мост у [ShowLocationName('alcantara')] — римский, и именно поэтому [target_order.GetName] стоит там, где стоит. Пока [GetCountry('POR').GetName] в оружии против нас, этот мост — кратчайшая дорога в [ROOT.GetCountry.GetFlavorRank] нашего государства и кратчайшая дорога в их владения.\n\nМагистр пишет, что может удержать переправу, сжечь дальний берег или заключить местный мир с [GetCountry('POR').GetAdjectiveWithNoTooltip] командорами, которых он знает уже двадцать лет. Он ждёт указаний, что из этого выбрать."
 d009_iberian_order_events.21.a: "Удержать мост, чего бы это ни стоило."
 d009_iberian_order_events.21.b: "Пусть совершают набеги через Тахо и оставляют себе добычу."
 d009_iberian_order_events.21.c: "Пусть он купит перемирие на границе."
 d009_iberian_order_events.22.title: "Последний магистр [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.22.entry: "Последний магистр Алькантары"
 d009_iberian_order_events.22.desc: "Магистр [target_order.GetName] — старик, скорее учёный, чем воин, и последний в своём роду, кто получил должность свободным избранием братьев.\n\n[target_ruler.GetName] не скрывает, что произойдёт после его смерти. Вопрос лишь в том, дождётся ли [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] этого, или старику стоит попросить уйти в сторону уже сейчас, пока у него ещё достанет достоинства сделать это достойно."
 d009_iberian_order_events.22.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] назначит преемника уже сейчас."
 d009_iberian_order_events.22.a.entry: "The $crown_estate$ will now name his successor."
 d009_iberian_order_events.22.b: "Пусть сохраняет сан магистра до самой смерти."
 d009_iberian_order_events.22.c: "Пусть с почётом удалится в свою библиотеку."
 d009_iberian_order_events.23.title: "Казнохранилище в [ShowLocationNameWithNoTooltip('brozas')]"
 d009_iberian_order_events.23.entry: "$d009_iberian_order_events.23.title$"
 d009_iberian_order_events.23.desc: "Казнохранилище в [ShowLocationName('brozas')] вскрыто, и вместе с ним исчезла годовая рента с половины владений [target_order.GetName]. Ни осады, ни взломанной двери — а это говорит братьям о собственном доме то, что им меньше всего хотелось бы знать.\n\nМагистр попросил нашей помощи, и уже это само по себе признание: он не стал бы просить, если бы мог найти воров сам."
 d009_iberian_order_events.23.a: "Послать людей [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] на поиски воров."
 d009_iberian_order_events.23.a.entry: "Послать людей $crown_estate$ на поиски воров."
 d009_iberian_order_events.23.b: "Орден должен сам отвечать за свои потери."
 d009_iberian_order_events.31.title: "Каравеллы [order_administrator.GetNameWithNoTooltip]"
 d009_iberian_order_events.31.entry: "Каравеллы администратора"
 d009_iberian_order_events.31.desc: "[order_administrator.GetName] заведует управлением [target_order.GetName], и [order_administrator.GetSheHe] обнаружил(а), что это значит: ренты со всех командорств нашего [ROOT.GetCountry.GetFlavorRank] — и ни у кого нет права спросить [order_administrator.GetHerHim], на что они тратятся.\n\n[order_administrator.GetSheHe|U] тратит их на корабли. Год за годом каравеллы уходят на юг мимо [ShowLocationName('cape_bojador')] и возвращаются с песком, рабами и рассказами, и год за годом доход ордена уходит на строительство нового корпуса. Братья уже начали писать нам об этом."
 d009_iberian_order_events.31.a: "Финансировать плавания также из казны [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.31.a.entry: "Финансировать плавания также из казны $crown_estate$."
 d009_iberian_order_events.31.b: "Пусть [order_administrator.GetNameWithNoTooltip] получит то, что орден может уделить."
 d009_iberian_order_events.31.b.entry: "Пусть управляющий получит то, что орден может уделить."
 d009_iberian_order_events.31.c: "Доходы ордена предназначены для границы, а не для океана."
 d009_iberian_order_events.32.title: "Тамплиерское наследство"
 d009_iberian_order_events.32.entry: "$d009_iberian_order_events.32.title$"
 d009_iberian_order_events.32.desc: "[target_order.GetName] существует лишь потому, что мы когда-то не позволили землям Храма покинуть [ROOT.GetCountry.GetName], попросту переименовав державших их людей. Это всегда было юридической уловкой, и [GetCountry('ARA').GetName] нашли законника, готового сказать об этом вслух.\n\nПритязание касается старых тамплиерских командорств. Если его удовлетворить, орден лишится владений, на которых был основан; если же оспорить его, нам придётся десятилетие спорить перед Курией."
 d009_iberian_order_events.32.a: "Отстаивать наследство перед Курией."
 d009_iberian_order_events.32.b: "Выкупить [GetCountry('ARA').GetAdjectiveWithNoTooltip] притязание."
 d009_iberian_order_events.32.b.entry: "Выкупить притязание $ARA_ADJ$."
 d009_iberian_order_events.33.title: "Крест на парусах"
 d009_iberian_order_events.33.entry: "$d009_iberian_order_events.33.title$"
 d009_iberian_order_events.33.desc: "Каждая каравелла, отправляющаяся на юг, несёт на грот-парусе крест [target_order.GetName]. Орден оплатил немалую их часть и уже начал спрашивать, чем он владеет на другом конце пути.\n\nКомандорство посреди океана — мысль странная. Когда-то такой же странной казалась и мысль о командорстве на мавританской границе."
 d009_iberian_order_events.33.a: "Даровать им [ShowLocationNameWithNoTooltip('lagos')] и долю от плаваний."
 d009_iberian_order_events.33.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] забирает свою долю от того, что они финансируют."
 d009_iberian_order_events.33.b.entry: "$crown_estate$ забирает свою долю от того, что они финансируют."
 d009_iberian_order_events.33.c: "Орден остаётся в стороне от морской затеи."
 d009_iberian_order_events.41.title: "Магистр [target_order.Custom('CL_GEN')]"
 d009_iberian_order_events.41.entry: "Магистр Авиша"
 d009_iberian_order_events.41.desc: "Трон пуст, права [ShowCultureName('castilian')] на него сильны, а наше [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ищет своего кандидата, с которым можно было бы смириться.\n\nВсе чаще взгляды обращаются к магистру [target_order.GetName]. В его жилах течёт [ROOT.GetCountry.GetGovernment.GetAdjective] кровь, хоть и не по той стороне простыни, он принёс обет безбрачия, и под его началом единственный в нашем [ROOT.GetCountry.GetFlavorRank] отряд дисциплинированной конницы, ещё никому не обещанный. Братья ордена пойдут за ним куда угодно, хоть на трон."
 d009_iberian_order_events.41.a: "Пусть [target_order.GetNameWithNoTooltip] выступит за своего магистра."
 d009_iberian_order_events.41.pretender_tt: "Магистр Авиша заявляет свои права на трон"
 d009_iberian_order_events.41.a.entry: "Посадить магистра ордена на трон."
 d009_iberian_order_events.41.b: "Права [ShowCultureNameWithNoTooltip('castilian')] — законные."
 d009_iberian_order_events.41.c: "Мы не позволим ордену выбирать наших правителей."
 d009_iberian_order_events.42.title: "Управляющий для [target_order.Custom('CL_GEN')]"
 d009_iberian_order_events.42.entry: "Управляющий для Авиша"
 d009_iberian_order_events.42.desc: "Должность магистра [target_order.GetName] вновь освободилась, и [ROOT.GetCountry.GetGovernment.GetCourtTitle] заметил то, о чём братья предпочли бы умолчать: закон не обязывает [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] дожидаться их выборов.\n\nУ [target_ruler.GetName] есть младший родственник без наследства и без занятия, а у ордена довольно земель, чтобы содержать такого человека в подобающем ему достатке. Не впервые принц надевает рясу, которую вовсе не намерен носить с честью."
 d009_iberian_order_events.42.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] сам назначит управляющего."
 d009_iberian_order_events.42.a.entry: "$crown_estate$ сам назначит управляющего."
 d009_iberian_order_events.42.b: "Оставить братьям их выборы."
 d009_iberian_order_events.43.title: "Коллегия в [ShowLocationNameWithNoTooltip('evora')]"
 d009_iberian_order_events.43.entry: "$d009_iberian_order_events.43.title$"
 d009_iberian_order_events.43.desc: "Нам предложено основать коллегию в [ShowLocationName('evora')], а средства на её содержание должна дать рента, которой владеет [target_order.GetName].\n\nОрден был основан, чтобы удерживать границу, которой больше не существует. Его командорства теперь — обычные поместья, а братья — землевладельцы. Коллегия дала бы ордену новый смысл существования — щедрая мысль это, или же признание того, что прежняя цель исчерпана, сказать сложно."
 d009_iberian_order_events.43.a: "Содержать коллегию совместно из средств [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] и ордена."
 d009_iberian_order_events.43.a.entry: "Содержать коллегию совместно из средств $crown_estate$ и ордена."
 d009_iberian_order_events.43.b: "Пусть орден даст то, что сможет выделить."
 d009_iberian_order_events.43.c: "[ShowLocationNameWithNoTooltip('evora')] подождёт."
 d009_iberian_order_events.51.title: "Земли тамплиеров"
 d009_iberian_order_events.51.entry: "$d009_iberian_order_events.51.title$"
 d009_iberian_order_events.51.desc: "Орден Храма упразднён, его братья рассеяны, а его замки в Маэстрате стоят пустыми — удерживать их по закону теперь некому. [target_order.GetName] был создан именно для того, чтобы эти замки не ускользнули из нашего [ROOT.GetCountry.GetFlavorRank].\n\n[GetCountry('KNI').GetName|U] написали нам, напоминая, что Собор передал имущество тамплиеров их ордену повсюду в [ShowReligionAdjective('catholic')] мире. [GetCountry('KNI').GetNameWithNoTooltip|U] восседают в [GetCountry('KNI').GetCapital.GetNameWithNoTooltip]. Замки же находятся в [ShowAreaName('valencia_area')]."
 d009_iberian_order_events.51.a: "[target_order.GetNameWithNoTooltip] забирает всё наследство."
 d009_iberian_order_events.51.a.entry: "Монтеса забирает всё наследство."
 d009_iberian_order_events.51.b: "Разделить его с [GetCountry('KNI').GetNameWithNoTooltip]."
 d009_iberian_order_events.51.b.entry: "Разделить его с $KNI$."
 d009_iberian_order_events.52.title: "Магистерство [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.52.entry: "Магистерство Монтесы"
 d009_iberian_order_events.52.desc: "[target_order.GetName] — последний военный орден в нашем [ROOT.GetCountry.GetFlavorRank], который до сих пор сам избирает себе магистра. Должность магистра [ShowCultureName('castilian')] перешла под власть [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] ещё поколения назад, а [target_order.GetNameWithNoTooltip] продолжает жить так, будто этого никто не заметил.\n\n[target_ruler.GetName] заметил. Мы подали прошение о булле, и она будет дарована; остаётся лишь вопрос — принять ли магистерский сан сейчас или позволить братьям провести ещё одни выборы."
 d009_iberian_order_events.52.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] сам назначит магистра."
 d009_iberian_order_events.52.a.entry: "$crown_estate$ сам назначит магистра."
 d009_iberian_order_events.52.b: "Позволить братьям провести ещё одни выборы."
 d009_iberian_order_events.53.title: "Берберийский берег"
 d009_iberian_order_events.53.entry: "$d009_iberian_order_events.53.title$"
 d009_iberian_order_events.53.desc: "Галеры приходят летом, забирают рыбаков с пляжей между [ShowLocationName('peniscola')] и [ShowLocationName('valencia')] и исчезают прежде, чем против них можно что-либо выслать. Это побережье держит в своих руках [target_order.GetName], и селения уже начали направлять прошения ордену, а не нам — что само по себе предостережение.\n\nМагистр хочет башен: целую цепь, с гарнизоном на всё лето, оплаченную кем-то другим."
 d009_iberian_order_events.53.a: "Построить башни и оплатить дозор."
 d009_iberian_order_events.53.b: "Пусть справляются тем, что у них есть."
 d009_iberian_order_events.53.c: "Побережье должно само о себе позаботиться."
 d009_iberian_order_events.61.title: "Ордены и [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]"
 d009_iberian_order_events.61.entry: "Ордены и $crown_estate$"
 d009_iberian_order_events.61.desc: "Военные ордены [ROOT.GetCountry.GetName] никогда и никем формально не спрашивались о том, для чего они существуют.\n\nОни владеют замками, собирают ренты, подчиняются магистрам, подчиняющимся Папе, и вот уже двести лет никто не разбирался, в каком отношении они стоят к [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. [target_ruler.GetName] — правитель не того склада, что [target_ruler.GetHerHis] предшественники, и уже велел выложить все счета на стол."
 d009_iberian_order_events.61.desc_council: "[ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] заседает уже довольно долго, и его писцы составили то, чего не было ни при одном прежнем правлении: полный отчёт о владениях орденов.\n\nЧтение выходит неприятное. Магистры — наши ставленники, а замки управляются от нашего имени, но ренты по-прежнему идут туда, куда шли всегда, и братья по-прежнему считают [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] скорее покровителем, чем господином. Управление, как выясняется, ещё не есть покорность."
 d009_iberian_order_events.61.a: "Подтвердить за ними все их владения."
 d009_iberian_order_events.61.b: "Их ренты отныне послужат прежде всего нашему [ROOT.GetCountry.GetFlavorRank]."
 d009_iberian_order_events.61.b.entry: "Их доходы прежде всего послужат державе."
 d009_iberian_order_events.63.title: "Управление орденами"
 d009_iberian_order_events.63.entry: "$d009_iberian_order_events.63.title$"
 d009_iberian_order_events.63.desc: "Всё делалось исподволь, по одному магистерству за раз, каждое со своей буллой и своими причинами, и лишь теперь канцелярия сопоставила их все и увидела, что получилось на деле.\n\nВеликие ордена нашего [ROOT.GetCountry.GetFlavorRank] владеют крепостями пограничья, доходами сотни командорств и лучшей тяжёлой конницей во всём [ShowReligionAdjective('catholic')] мире, и подчиняются людям, которых назначил [target_ruler.GetName]. Никогда прежде [ROOT.GetCountry.GetName] не держал в одной руке столько меча [GetUniqueInternationalOrganization('catholic_church').GetName].\n\nОстаётся решить, установление ли это, или просто укоренившаяся привычка."
 d009_iberian_order_events.63.a: "Управлять ими через единый совет."
 d009_iberian_order_events.63.b: "Оставить каждое магистерство в руках семьи."
