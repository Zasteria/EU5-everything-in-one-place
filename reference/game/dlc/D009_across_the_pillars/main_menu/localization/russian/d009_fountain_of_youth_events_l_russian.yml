l_russian:
 d009_fountain_of_youth_events.1.title: "Живительный источник"
 d009_fountain_of_youth_events.1.desc: "Проводники уводят нас с тропы к роднику, чьи холодные прозрачные потоки бьют из-под земли под сенью пальм, и наотрез отказываются идти дальше, пока мы не выпьем этой воды. Сопровождающая нас старуха жестами изображает, как сутулая спина выпрямляется, а седые волосы вновь темнеют. Один из наших солдат — пикинёр, который с самого прибытия на побережье страдал от лихорадки и едва мог ходить, — опускается на колени и пьёт из источника. К вечеру он клянётся, что боль в ногах прошла. Хирург лишь ворчит, что человек, отчаянно желающий выздороветь, почувствует себя лучше на день-другой вне зависимости от того, что пьёт. Тем не менее вода здесь действительно вкусна, а сама легенда старше любого из нас. Мы пересекали океаны, доверившись куда менее убедительным обещаниям."
 d009_fountain_of_youth_events.1.a: "Пополним запасы воды и вознаградим проводников, которые показали это место."
 d009_fountain_of_youth_events.1.b: "Лужа — она и в Африке лужа. Не будем здесь останавливаться."
 d009_fountain_of_youth_events.1.b.tt: "#italic Мы уходим, не попробовав воды в роднике, и продолжаем путь с пустыми бурдюками#!"
 the_spring_runs_potent: "#Y Вода в источнике оказывается хорошей, и мы решаем пополнить наши запасы#!"
 the_spring_is_ordinary: "#Y Вода приятная на вкус, но не более того#!"
 the_waters_may_restore_vigor_tt: "Возможно, вода, которую мы принесём домой, вернёт нашим старикам былую силу"
 d009_fountain_of_youth_events.2.title: "Цена знаний"
 d009_fountain_of_youth_events.2.desc: "Из деревни приходит целитель — старец, увешанный ракушками и костями, которого местные жители явно почитают и побаиваются. Через переводчика мы узнаём, что ему хорошо знакомы интересующие нас земли: к каким источникам несут больных и какие места считаются священными. Однако такими знаниями с вооружёнными чужаками с ходу не делятся. У них есть цена, но измеряется она не золотом. Нам необходимо проявить уважение — или убедительно это изобразить, — правильно преподнести подобающие дары и безукоризненно соблюсти старинные обряды. Наш капеллан возмущён этим языческим церемониалом, а квартирмейстер считает, что толковый проводник важнее, чем душевное спокойствие капеллана."
 d009_fountain_of_youth_events.2.a: "Отнесёмся к их обычаям с уважением и заслужим доверие целителя."
 d009_fountain_of_youth_events.2.b: "Предложим щедрое вознаграждение за проводника."
 d009_fountain_of_youth_events.2.c: "Сами заберём проводника без лишних церемоний."
 the_healer_will_accompany_us_tt: "Целитель будет сопровождать нас во время [Concept('expedition', 'экспедиции')|e], а по возвращении присоединится к нашему двору"
 coerced_guide_breeds_resentment_tt: "Наше [Concept('cultural_opinion', 'мнение')|e] о #L [target_location.GetDominantCulture.GetName|l]ой#! культуре ухудшится"
 d009_fountain_of_youth_events.3.title: "Распространение лихорадки"
 d009_fountain_of_youth_events.3.desc: "Сначала мы обращаем внимание на двух мужчин, дрожащих от озноба у костра в полуденный зной. К третьему утру заболевших уже насчитывается дюжина: все с пожелтевшими склерами и в бреду. Переходя болота вброд, мы, по всей видимости, подхватили неведомую, опасную для нас, европейцев, заразу. Хирург прибегает к кровопускательным чашам, ланцетам и иссякающим запасам лекарств; у местных свои средства: горькие отвары и припарки из листьев, которые не признал бы ни один врачеватель в Севилье. Обе стороны с недоверием относятся к методам лечения друг друга, в то время как лихорадке, похоже, всё равно, при помощи чего с ней пытаются бороться."
 d009_fountain_of_youth_events.3.a: "Позовём врачей с корабля, даже если это нам дорого обойдётся."
 d009_fountain_of_youth_events.3.b: "Доверимся местным целителям и их методам лечения."
 d009_fountain_of_youth_events.3.c: "Продолжим путь — рано или поздно болезнь пройдёт сама."
 the_fever_passes: "#Y Болезнь отступает, и люди возвращаются в строй#!"
 the_fever_claims_our_progress: "#Y Лихорадка не спадает, и мы лишаемся с трудом достигнутых к этому моменту результатов#!"
 the_remedies_take_hold: "#Y Горькие отвары действуют, и наши люди начинают доверять знахарям#!"
 the_remedies_fail: "#Y Лечение не помогает, и в итоге лихорадка сама сходит на нет#!"
 d009_fountain_of_youth_events.4.title: "Последняя надежда"
 d009_fountain_of_youth_events.4.desc: "[target_leader.GetName] уже не [Select_CString(target_leader.IsFemale, 'молода', 'молод' )], и с каждым годом это ощущается всё сильнее. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] с невиданным прежде рвением изучает карты, засиживаясь над ними допоздна, а когда отряд сбавляет шаг, в [Select_CString(target_leader.IsFemale, 'её', 'его' )] взгляде проступает нетерпение. Поговаривают, что командир ищет эти воды не столько ради короны и отечества, сколько ради собственного отражения в зеркале. Завоеватель, покоривший всё, кроме самого времени, отправляется в болота за добычей, которую не возьмёт ни один меч, — эта история стара как мир. Но что бы ни ждало в конце — слава или ранняя смерть — эта жажда уже не даст остановиться."
 d009_fountain_of_youth_events.4.a: "Подчинимся этому порыву."
 d009_fountain_of_youth_events.4.b: "Призовём набраться терпения: чрезмерная настойчивость может сломить людей."
 d009_fountain_of_youth_events.5.title: "Острова Бимини"
 d009_fountain_of_youth_events.5.desc: "В последнее время среди моряков только и разговоров, что о Бимини — острове неподалёку, где якобы бьёт источник, способный вернуть старикам отнятые морем годы. О нём все слышали, но никто его не видел. На карте изображена россыпь невысоких зелёных островов в нескольких днях пути: источник может оказаться на любом из них — а может не найтись вовсе. Свернуть с маршрута — значит рискнуть недельным запасом провизии, поверив в рыбацкую байку… Хотя, если подумать, ради этого мы уже пересекли целый океан."
 d009_fountain_of_youth_events.5.a: "Отправимся на поиски острова, о котором все говорят."
 d009_fountain_of_youth_events.5.b: "Продолжим держать курс на материк. Эти острова не стоят того, чтобы рисковать ради них жизнью."
 d009_fountain_of_youth_events.5.b.tt: "#italic Мы продолжаем плыть к материку, не пытаясь раскрыть тайну островов Бимини#!"
 the_island_rewards_the_crossing: "#Y Остров вознаграждает добравшихся до него путешественников пресной водой и более точными ориентирами#!"
 the_island_is_barren: "#Y Остров оказывается бесплодной песчаной косой, из-за которой мы теряем драгоценное время#!"
 d009_fountain_of_youth_events.fountain_desc: "В 1513 году Хуан Понсе де Леон, конкистадор и первый губернатор Пуэрто-Рико, отправился на север. Землю, на которой было решено высадиться, он назвал Флоридой в честь отмечавшейся в это же время Пасхи. Он нанёс на карту полуостров и мощное течение Гольфстрим, вступал в стычки с племенем калуса и торговал с народом тимукуа, однако чудодейственного источника не нашёл и, судя по его собственным заметкам, даже не искал. Слава искателя возвращающей молодость воды закрепилась за ним уже после его смерти — с подачи хронистов Гонсало Фернандеса де Овьедо, Антонио де Эрреры-и-Тордесильяса, а также пленника Эрнандо де Эскаланте Фонтанеды, который язвительно отмечал, что поиски заветного источника погубили многих. Слухи о целебном источнике на острове Бимини действительно ходили среди моряков и местных жителей, однако шутливая легенда о нём и одном стареющем губернаторе появилась значительно позже. Понсе де Леон вернулся во Флориду в 1521 году, чтобы основать колонию, получил от аборигена из калуса стрелу в бедро и умер от ранения в Гаване, так и не обретя ни молодости, ни покоя."
