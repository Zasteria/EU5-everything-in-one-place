l_russian:
 seven_cities_fountain.1.title: "Источник — это просто источник"
 seven_cities_fountain.1.desc: "После двух недель в пути отряд добрался до места, которое проводники-таино называют фонтаном Бимини. На поляне действительно есть родник: вода в нём холодная, чистая и слегка пахнет серой. Люди делают несколько глотков — и на следующий день остаются такими же, какими были накануне. Чудесного омоложения не произошло. Проводника расспрашивают ещё раз, уже более тщательно. Он признаётся, что сам никогда не пил из источника, но услышал о нём ещё ребёнком от своей бабушки, а она, в свою очередь, — от своей бабушки, когда та была ещё девочкой. [target_leader.GetName] пишет обо всём этом в донесении и приказывает отряду возвращаться домой."
 seven_cities_fountain.1.a: "Поворачиваем обратно. Вечной молодости здесь не найти."
 seven_cities_fountain.1.historical_info: "Путешествие Хуана Понсе де Леона во Флориду в 1513 году традиционно ассоциируется с поиском источника вечной молодости. Но эта ассоциация возникла в испанских хрониках лишь после смерти конкистадора. Более поздние историки, которые посчитали эту увлекательную историю выгодной, популяризировали её. На самом же деле это путешествие было обычной разведывательной экспедицией. Её провели на деньги частного инвестора, который собирался основать укрепление для работорговли во Флориде, которая тогда считалась островом. Имя Понсе де Леона стали связывать с источником молодости, потому что он умер не особо старым — на шестом десятке — от раны стрелой, полученной во Флориде. Испанские летописцы следующего поколения просто не смогли удержаться от иронии по поводу такого стечения обстоятельств."
 seven_cities_fountain.2.title: "Освежающий родник"
 seven_cities_fountain.2.desc: "Легендарный источник действительно существует — правда, ничего сверхъестественного в нём нет. В роще бьёт ключ с необычайно чистой водой, температура которой почти не меняется в течение года. Глоток воды из такого родника наполняет тело новой силой, что подмечает даже священник, однако ни об омоложении, ни о каком-либо ещё чуде говорить не приходится. Местный вождь тимукуа рассказывает, что этот источник считается целебным, — вода из него помогает при лихорадке и боли в суставах. Летописец записывает его рассказ — испанским врачам он наверняка пригодится. Нет, источник оказался совсем не таким, каким его описывали легенды, но главное, что он существует. [target_leader.GetName] приказывает воздвигнуть на этом месте часовню."
 seven_cities_fountain.2.a: "Объявим родник собственностью Испании. Торговля целебной водой может быть прибыльной."
 seven_cities_fountain.2.historical_info: "Флорида необычайно богата артезианскими источниками. Тимукуа и другие коренные народы полуострова почитали многие из них как священные места с чудодейственной целебной водой. С XVIII века европейцы начали устраивать здесь лечебные курорты, а вокруг крупнейших источников со временем выросли целые курортные города. Представления о целебных свойствах флоридской воды с годами менялись, но мало кто утверждал всерьёз, что она способна возвращать молодость: это верование было исключительно европейским."
 seven_cities_fountain.3.title: "Истинный фонтан"
 seven_cities_fountain.3.desc: "Источник в самом сердце земель тимукуа удивительно похож на описываемый в легенде — настолько, что летописец трижды перечитывает своё донесение, прежде чем решается переписать его начисто. Вода в роднике прозрачная, холодная, с лёгким минеральным привкусом. Спустя неделю становится заметно её воздействие: у тех, кто каждый день купался в источнике, немного убывает седина, немного меньше болит спина, немного меньше скованы суставы. Даже раны начинают заживать быстрее. Священник, которому стукнул шестьдесят один год, восклицает: «[target_leader.GetName], я чувствую себя так, словно мне двадцать пять!». До заката донесение подписывают и скрепляют печатью."
 seven_cities_fountain.3.a: "Сообщим короне: мы нашли легендарный источник."
 seven_cities_fountain.3.historical_info: "Легенды о воде, возвращающей молодость, известны в Европе с глубокой древности. Ещё Геродот писал об источнике в землях эфиопов, вода которого пахла фиалками и, как считалось, дарила необычайное долголетие тем, кто в ней купался. В начале XVI века испанцы принесли эту легенду с собой во Флориду. Необычным было не само появление подобного рассказа, а то, какое значение (пусть и недолго) придавали ему короли. В европейской истории такой источник обычно оставался литературным образом, а не становился поводом тратить казённые деньги на экспедиции."
