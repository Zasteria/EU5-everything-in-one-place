l_russian:
 d009_el_dorado_events.1.title: "Очень сомнительная карта"
 d009_el_dorado_events.1.desc: "К нашему костру вышли двое мужчин. Они держатся с непринуждённостью и уверенностью бывалых пройдох: может, это дезертиры, аферисты или сбежавшие заключённые. Их рассказ каждый раз немного меняется, но не меняется карта, которую они принесли с собой. Этот засаленный квадрат из кожи полон золотыми озёрами, горами из чистого серебра и невероятно величественными городами. Они клянутся жизнью в точности карты, и наш сержант отмечает, что именно поэтому не дал бы за неё и гроша. И всё же это единственная карта, которая у нас есть. Ложный след, по которому смело идут вперёд, завёл многие экспедиции дальше, чем честный путь, от которого в страхе отказались."
 d009_el_dorado_events.el_dorado_desc: "Легенда об Эльдорадо, (исп. el dorado — «позолоченный») сложилась на основе реальной церемонии народа муиска, обитавшего в нагорье Колумбии. В ходе этой церемонии нового правителя обтирали золотой пылью и вывозили на лодке на озеро Гуатавита. Там правитель бросал в воды озера дары богам — золото и изумруды. В пересказах испанских, а после и английских авантюристов образ «позолоченного человека» раздувался до размеров золотого города, скрытого королевства и, наконец, превратился в целую затерянную империю, скрытую в самых диких местах континента — от Анд до Ориноко и лесов Гвианы. На поиски Эльдорадо отправилось целое поколение: Хименес де Кесада, Белалькасар, Гонсало Писарро и Франсиско де Орельяна. В своей роковой экспедиции Писарро и де Орельяно не нашли золота, но стали первыми европейцами, совершившими сплав по Амазонке. Более поздние экспедиции нередко заканчивались мятежами, самым печально известным из которых стало восстание Лопе де Агирре. Другие же с огромным трудом осушали само озеро Гуатавита, извлекая ценой невероятных усилий сущие безделушки. Никакого королевства так и не нашли, ведь его никогда и не существовало. Легенда пережила всех, кто погиб в погоне за ней."
 d009_el_dorado_events.1.a: "Это лучшая карта из всех, что у нас есть. Идём по ней."
 d009_el_dorado_events.1.b: "Отправить шельмецов восвояси."
 d009_el_dorado_events.1.b.tt: "#italic Мы отправили шельмецов восвояси и продолжили путь без их залапанной карты#!"
 new_location_grants_clue_for_el_dorado: "#Y [target_new_waypoint.GetName] подсказывает, где искать Эльдорадо#!"
 cartographer_cannot_read: "#Y [Concept('expedition', 'Путешествие')|e] задерживается из-за неграмотности картографа#!"
 gasp_its_a_trap: "#Y [Concept('expedition', 'Путешествие')|e] резко обрывается: на нас устроили засаду!#!"
 will_reduce_our_chances_to_uncovering_goal_tt: "Это снизит наши шансы найти искомое"
 d009_el_dorado_events.2.title: "Ориентиры говорят о другом"
 d009_el_dorado_events.2.desc: "На этот раз карта и местность почти совпадают. Высеченный идол стоит на хребте именно там, где и показывает пергамент, — даже каменная челюсть выступает так, как и положено. Но огромный водопад, который должен грохотать к востоку от него, вместо этого низвергается на запад, а две вершины за ним и вовсе расположены в совершенно ином порядке. Картограф либо был небрежен, либо изобразил место, о котором знал лишь по чужим рассказам. Либо же сами эти края нам описали с тем расчётом, чтобы мы безвозвратно в них заблудились. [target_leader.GetName] снова и снова переворачивает пергамент, словно ожидая увидеть на обороте ответы на свои вопросы."
 d009_el_dorado_events.2.a: "Карта достаточно точная. Идём дальше."
 d009_el_dorado_events.2.b: "Мы не будем вслепую идти по ложному следу."
 d009_el_dorado_events.2.b.tt: "#italic Мы выбросили подделку и доверились собственным глазам#!"
 the_expedition_doublebacks: "#Y [Concept('expedition', 'Путешественники')|e] возвращаются уже пройденным маршрутом, тратя драгоценные дни#!"
 press_on_regardless: "#Y Мы продолжаем путь, доверяя карте больше, чем собственным глазам#!"
 extort_locals: "#Y Мы силой отнимаем у местных припасы и выбиваем из них сведения#!"
 d009_el_dorado_events.3.title: "Именно то, что мы мечтали услышать"
 d009_el_dorado_events.3.desc: "Дрожащий от страха пленник рассказывает нам всё то, что и хочет услышать [target_leader.GetName]: да, золотой владыка существует; да, его двор находится всего в нескольких днях пути вверх по реке; да, даже крыши там покрыты золотом, которое каждую весну снимают и переплавляют. Чудесная история: этот человек, глядящий на нас широко распахнутыми глазами, словно действительно понимает, ради чего мы пересекли целый континент. Наш переводчик тихо предупреждает: «[target_leader.GetName], он поклянётся в чём угодно — даже в том, что небо зелёное, лишь бы отвести вооружённых незнакомцев от своей деревни». Однако каждое его слово — это именно то, что нам и хотелось услышать."
 d009_el_dorado_events.3.a: "Заставить его рассказать больше."
 d009_el_dorado_events.3.b: "Вознаградить за честность, а не пустые слова."
 d009_el_dorado_events.3.c: "Выжать из пленника всю правду."
 guide_told_us_what_we_wished: "#Y Проводник признался, что рассказал нам лишь то, что мы хотели услышать. Путь привёл нас в никуда#!"
 fear_loosens_the_guides_tongue: "#Y Страх сделал проводника разговорчивее, и его слова звучат правдиво#!"
 forced_confession_breeds_hatred_tt: "Наше [Concept('cultural_opinion', 'мнение о культуре')|e] района [target_location.GetDominantCulture.GetName] ухудшится"
 d009_el_dorado_events.4.title: "Награда, достойная задержки"
 d009_el_dorado_events.4.desc: "Разведчики вернулись, задыхаясь от волнения. Всего в сутках пути в сторону от нашего маршрута, в долине, которую мы должны обойти мимо, есть город, который богаче всего, что мы видели с момента высадки на побережье. Террасированные поля, битком набитые склады, золотые украшения на шеях его жителей! Да, это не Эльдорадо, и отклонение от маршрута ради этого города будет стоить нам целых недель, которых сейчас и так мало, но наши люди уже увидели этот блеск. Отряд, который проходит мимо золота, которое можно увидеть, в поисках золота, о котором он только слышал, — это отряд, который начинает задавать своему командиру сложные вопросы."
 d009_el_dorado_events.4.a: "Отправиться в богатое поселение"
 d009_el_dorado_events.4.b: "Взять лишь то, что нам предложат добровольно"
 d009_el_dorado_events.4.c: "Не сходить с пути"
 d009_el_dorado_events.4.c.tt: "#italic Мы оставили золото, которое можно увидеть, позади. Мы верим, что обещанное золото ждёт нас впереди#!"
 a_modest_haul: "#Y Мы немного пополнили свои сундуки в этом поселении#!"
 a_peaceful_exchange: "Обмен прошёл мирно, и теперь мы принесём домой чуть больше"
 d009_el_dorado_events.5.title: "Хорошо охраняемый клад"
 d009_el_dorado_events.5.desc: "За лесами находится место, которое проводники обходят десятой дорогой: обнесённое стенами святилище, чьи ворота обиты искусно обработанным золотом, а у парапетов стоят молчаливые стражи. Что бы ни хранилось внутри, оно явно настолько ценно, что ради его защиты здесь готовы убивать, а значит, как считают наши офицеры, содержимое святилища стоит захватить. [target_leader.GetName] обводит взглядом ряды своих копейщиков, сопоставляет их силы с прочностью ворот и понимает, что соотношение совсем не в нашу пользу. Золото совсем рядом — достаточно лишь протянуть руку, но платить за него придётся совсем не серебром."
 d009_el_dorado_events.5.a: "Взять сокровище силой."
 d009_el_dorado_events.5.b: "Осторожно попросить себе долю."
 d009_el_dorado_events.5.c: "Оставить эту затею — охрана слишком сильная."
 d009_el_dorado_events.5.c.tt: "#italic Мы сравнили крепость стен с ценностью добычи и решили оставить всё как есть#!"
 the_hoard_is_seized: "#Y Мы захватили сокровище и вернёмся домой совсем не с пустыми руками#!"
 a_wary_bargain: "Мы вежливо попросили, и с нами немного поделились"
