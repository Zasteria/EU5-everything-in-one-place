l_russian:
 hint_battle_for_the_strait: "Советы по ситуации «[GetSituationByKey('battle_for_the_strait').GetNameWithNoTooltip]»"
 hint_battle_for_the_strait_hint_text: "$hint_battle_for_the_strait_hint_text_1$\n\n$hint_battle_for_the_strait_hint_text_2$"
 hint_battle_for_the_strait_hint_text_1: "[GetSituationByKey('battle_for_the_strait').GetName] — [Concept('situation_with_icon', 'ситуация')|e], в которой три державы состязаются за контроль за узким проливом между #TOOLTIP:REGION,iberia_region,X #L Иберией#!#! и #TOOLTIP:REGION,maghreb_region,X #L Магрибом#!#!. [GetCountry('CAS').GetName] настаива[GetCountry('CAS').Custom('end_etyut')] на продолжении Реконкисты, [GetCountry('MOR').GetName] стрем[GetCountry('MOR').Custom('end_ityat')]ся отвоевать утерянные #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманские#!#! земли, а [GetCountry('GRA').GetName] стара[GetCountry('GRA').Custom('end_etyut')]ся просто выжить между двумя крупными соседями."
 hint_battle_for_the_strait_hint_text_2: "#T Как определяется исход:#!\n@arrow_bonus_tier_2! На борьбу влияют два показателя. Первый — ось влияния на #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#!. На одном её конце расположен[GetCountry('CAS').Custom('end_fem')] [GetCountry('CAS').GetName], на другом — [GetCountry('MOR').GetName]. Каждая из этих держав старается подчинить себе #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! — добившись расположения, оказав давление или завоевав. В свою очередь [Concept('granadan_sovereignty', 'гранадский суверенитет')|e] определяет степень самостоятельности эмирата.\n@arrow_bonus_tier_1! У каждой державы свои условия победы. [GetCountry('CAS').Custom('CL_DAT')] необходимо напрямую или с помощью любых [Concept('subjects', 'ленников')|e] контролировать все нехристианские регионы Иберии; уплата дани при этом не учитывается. [GetCountry('MOR').GetNameWithNoTooltip] и [GetCountry('GRA').GetNameWithNoTooltip] должны каждый контролировать не менее пятой части полуострова. Используйте особые [Concept('actions_with_icon', 'действия')|e] на панели ситуации, чтобы склонять показатели в свою пользу до наступления следующей эпохи."
 hint_battle_for_the_strait_hint_text_3: "#T Рекомендуемые действия за [GetCountry('CAS').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Прикажите нашему [cabinet_with_icon|e] [ShowCabinetActionName('cas_pressure_andalusi_court')] — это будет ежемесячно склонять влияние в нашу сторону.\n@arrow_bonus_tier_2! Когда влияние сместится в нашу пользу более чем на #Y 25#!, [ShowGenericActionName('cas_force_tribute')] позволит привязать ослабевшую [GetCountry('GRA').GetNameWithNoTooltip] к нам. При #Y 100#! [ShowGenericActionName('vassalize_granada')] довершит дело.\n@arrow_bonus_tier_1! [ShowGenericActionName('cas_reduce_granadan_sovereignty')] и [ShowGenericActionName('cas_dismantle_fortifications')] не дадут вассальному [GetCountry('GRA').GetNameWithNoTooltip] вновь обрести самостоятельность.​"
 hint_battle_for_the_strait_hint_text_4: "#T Рекомендуемые действия за [GetCountry('MOR').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Прикажите нашему [cabinet] [ShowCabinetActionName('mor_cultivate_andalusi_influence')] и держите сильный [navy_with_icon|e] в проливе. Флоты в его водах склоняют влияние в пользу своего владельца.\n@arrow_bonus_tier_2! [ShowGenericActionName('claim_andalusi_inheritance')] даёт нам [casus_belli_with_icon|e] против страны в [ShowRegionNameWithNoTooltip('iberia_region')] — наш путь к трём нужным нам областям.\n@arrow_bonus_tier_1! Когда влияние сместится в нашу пользу более чем на #Y 25#!, [ShowGenericActionName('mor_force_tribute')] позволит привязать ослабевшую [GetCountry('GRA').GetNameWithNoTooltip] к нам, но в счёт победы идёт только [ShowSubjectTypeName('vassal')] или [ShowSubjectTypeName('taifa')]."
 hint_battle_for_the_strait_hint_text_5: "#T Рекомендуемые действия за [GetCountry('GRA').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Используйте [ShowGenericActionName('gra_reduce_castilian_influence')] и [ShowGenericActionName('gra_reduce_moroccan_influence')], чтобы удерживать влияние ближе к середине, и прикажите нашему [cabinet] [ShowCabinetActionName('gra_promote_sovereignty')].\n@arrow_bonus_tier_2! Наш [granadan_sovereignty] растёт, пока мы остаёмся независимыми и живём в мире, а наши [prestige_with_icon|e] и [crown_power_with_icon|e] поднимают его ещё выше. [ShowGenericActionName('gra_enforce_sovereignty')] и каждое расширение [ShowBuildingTypeName('alhambra')] также идут ему в прибавку.\n@arrow_bonus_tier_1! Каждый год в положении [subject_with_icon|e] обходится нам дороже в [granadan_sovereignty], чем предыдущий, а война истощает его ещё сильнее. Чем выше он поднимается над #Y 50#!, тем быстрее затем падает обратно, так что за ним нужно следить.\n@hint! [disaster_with_icon|e] в [GetCountry('CAS').GetNameWithNoTooltip] или [GetCountry('MOR').GetNameWithNoTooltip] повышает наш [granadan_sovereignty], пока длится."
 hint_battle_for_the_strait_diplomatic: "«Покорить #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! можно не только мечом. Предлагайте эмиру союзы, гарантии или брак, чтобы склонить его на свою сторону, и тогда вместе с ним будет колебаться и баланс влияния»."
 hint_battle_for_the_strait_administrative: "«В захваченных по ту сторону пролива землях будет царствовать хаос, если не наладить там управление. Укрепляйте [Concept('control_with_icon', 'контроль')|e] и следите за тем, чтобы [Concept('subjects_with_icon', 'ленники')|e] сохраняли вам верность, иначе плоды завоеваний выскользнут у нас из рук»."
 hint_battle_for_the_strait_military: "«Пролив много раз переходил из рук в руки. Мощный флот и боеспособное войско решат, кто станет владельцем его портов в новую эпоху»."
 hint_golden_century: "Советы по ситуации «[GetSituationByKey('golden_century').GetNameWithNoTooltip]»"
 hint_golden_century_hint_text: "$hint_golden_century_hint_text_1$\n\n$hint_golden_century_hint_text_2$"
 hint_golden_century_hint_text_1: "[GetSituationByKey('golden_century').GetName] — [Concept('situation_with_icon', 'ситуация')|e], которой предшествует [GetSituationByKey('battle_for_the_strait').GetName]. Победитель получит столетие господства над Европой и Новым Светом. Этот победитель станет колоссом новой эпохи, за ростом которого будут встревоженно следить соперники и соседи."
 hint_golden_century_hint_text_2: "#T Как покорить эпоху:#!\n@arrow_bonus_tier_2! Два счётчика отслеживают становление колосса. [Concept('gc_european_dominance', 'Европейское доминирование')|e] растёт за счёт побед в континентальных войнах и династического и религиозного господства в своих землях, тогда как [Concept('gc_colonial_dominance', 'колониальное доминирование')|e] растёт за счёт колонизации, золотых флотов и обращения заморских территорий. Оба растут шагами, и каждое пороговое значение от #Y 25#! до #Y 100#! даёт колоссу долговременную награду.\n@arrow_bonus_tier_1! Господство рождает опасность. Счётчик [Concept('flashpoint', 'переломного момента')|e] растёт по мере накопления долга и инфляции, подпитываемый избыточной властностью и завистью других. Когда счётчик заполняется, колосс получает переломное событие, и возникает [GetInternationalOrganizationType('grand_alliance').GetName], чтобы покончить с ним. Поражение в той войне может снизить один из счётчиков на #Y 25#!, а если колосс утратит четверть своих исходных территорий, золотой век завершится досрочно."
 hint_golden_century_diplomatic: "«Независимо от того, являемся мы колоссом, или дрожим в его тени, судьбу этой эпохи определяют союзы. Доминирующая держава опирается на своих друзей, чтобы сдержать коалицию, а желающие поставить колосса на место создают [GetInternationalOrganizationType('grand_alliance').GetName], чтобы вместе свершить воздаяние»."
 hint_golden_century_administrative: "«Золотой век строится как внутри державы, так и за её пределами. Следите за [Concept('control_with_icon', 'контролем')|e] и верностью [Concept('subjects_with_icon', 'ленников')|e] и не позволяйте долгам и беспорядкам довлеть над вами, ведь в них рождается новый [Concept('flashpoint', 'переломный момент')|e]»."
 hint_golden_century_military: "«Доминирование захватывается мечом, и от меча же теряется. Колосс должен защищать свою державу, чтобы прожить до конца золотого века, тогда как враги должны отколоть от него четверть державы, чтобы до срока завершить золотой век»."
