l_russian:
 anr_manual_digest_policy: "Свод законов Фитера"
 anr_manual_digest_policy_desc: "Кодекс Антони Фитер-и-Росселя сводит в единую систему общее право Андорры. Он служит чётким ориентиром для судов соправительства и подкрепляет незыблемые правовые традиции государства."
 anr_pareatges: "Акт-пареаж"
 anr_pareatges_desc: "Этот учредительный договор устанавливает двойной сюзеренитет над Андоррой. Он определяет правовую основу управления государством, а также обязанности каждого сюзерена перед этой землёй и её народом."
 anr_pareatges_honored_policy: "Соблюдение договора"
 anr_pareatges_honored_policy_desc: "Условия акта-пареажа соблюдаются в полном объёме: власть и права обоих сюзеренов признаются и уважаются всеми. Это хрупкое равновесие позволяет сохранить автономию Андорры и гарантирует стабильность её внешнеполитического положения."
 anr_pareatges_reinforced_policy: "Укрепление соправительства"
 anr_pareatges_reinforced_policy_desc: "Конституционные основы соправительства получили дальнейшее развитие: правовые институты укрепились, а система местного самоуправления пустила глубокие корни. Власть сюзеренов теперь ограничена, но внутренний порядок в государстве стал от этого лишь прочнее."
 bayaa_shura_council_policy: "Шура"
 bayaa_shura_council_policy_desc: "Принесение присяги и клятвы верности #italic байа#! проходит под контролем шуры — официального совещательного совета, состоящего из правоведов и знати. Их одобрение придаёт передаче власти законную силу в глазах всей мусульманской общины. Единодушное признание шуры прочно связывает власть правителя с религиозными и аристократическими традициями государства."
 bayaa_succession_law: "Присяга байа"
 bayaa_succession_law_desc: "#italic Байа#! — это присяга и клятва верности, посредством которой влиятельные люди государства (аристократы, учёные и племенные вожди, образующие совет #italic ахль аль-халль ва-ль-акд#!) подтверждают право нового правителя на власть. Этот закон определяет порядок принесения клятвы и устанавливает, чьё мнение имеет решающее значение при выборе преемника."
 bayaa_tribal_assembly_policy: "Племенное собрание"
 bayaa_tribal_assembly_policy_desc: "Принесение присяги #italic байа#! одобряется на большом собрании племенных вождей, чья совместная клятва обязывает ведущие кланы подчиняться новому правителю и гарантирует мир и порядок даже на окраинах государства. Признание со стороны вождей укрепляет авторитет правителя среди подданных, однако ставит его в зависимость от воли племенного союза."
 bled_makhzen_siba_law: "Биляд аль-махзен и биляд ас-сиба"
 bled_makhzen_siba_law_desc: "Марокканский султанат не управляет всей своей территорией напрямую. В государстве выделяются две области: #italic биляд аль-махзен#! — земли под властью правительства, где султанские чиновники собирают налоги и поддерживают порядок, и #italic биляд ас-сиба#! — мятежные земли, население которых признаёт духовный авторитет правителя, но яростно противится его фискальным притязаниям. Этот закон определяет баланс сил между ними."
 cas_alcabala_policy: "Алькабала"
 cas_alcabala_policy_desc: "Этот налог взимается со всех торговых сделок. Он приносит королевской казне большой доход, но вызывает глубокое недовольство среди купцов, поскольку распространяется на все виды обмена и на любые проданные в порту грузы."
 unlocks_cas_alcabala_tax: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('cas_alcabala_tax')]»"
 cas_encabezamiento_policy: "Энкабесамиенто"
 cas_encabezamiento_policy_desc: "Вместо полного сбора #italic алькабалы#! города договариваются о ежегодной выплате фиксированной суммы денег. Это даёт купцам уверенность в завтрашнем дне, а местным собраниям позволяет самостоятельно распределять налоговое бремя в пределах согласованного лимита."
 cas_fiscal_law: "Кастильская налоговая система"
 cas_fiscal_law_desc: "От налоговой политики короны зависит баланс между наполнением казны и благосостоянием купцов и землевладельцев."
 cat_constitucions_de_catalunya_policy: "Конституции Каталонии"
 cat_constitucions_de_catalunya_policy_desc: "Конституции Каталонии обязывают корону уважать законы и свободы подданных: ни один новый закон не может быть принят без согласия #italic кортесов#!, решения которых опираются на многовековые правовые традиции."
 centralized_makhzen_policy: "Централизованный махзен"
 centralized_makhzen_policy_desc: "Султан расширяет прямое управление государством, отправляя каидов и сборщиков налогов на отдалённые племенные территории и подчиняя местные обычаи своей воле. Казна пополняется, однако племенные союзы выражают недовольство из-за поборов, в которых видят нарушение своей традиционной автономии."
 dhimmi_persecution_policy: "Притеснение зимми"
 dhimmi_persecution_policy_desc: "Иноверцы подвергаются давлению с целью принудить их к смене веры или изгнанию. Это позволяет очистить государство от чуждых элементов и укрепить положение господствующей религии в стране."
 dhimmi_regulations_law: "Статус зимми"
 dhimmi_regulations_law_desc: "Правовое положение иноверцев при исламском правлении определяет уклад совместного проживания общин и то, какой вклад различные народы государства вносят в его процветание."
 dhimmi_status_policy: "Защита общин зимми"
 dhimmi_status_policy_desc: "Иноверцы получают официальное покровительство по законам шариата и выплачивают #italic джизью#! в обмен на свободу вероисповедания. Их торговая деятельность обогащает рынки государства, но при этом замедляет темпы исламизации населения."
 fuero_juzgo_policy: "Фуэро Хузго"
 fuero_juzgo_policy_desc: "Древний вестготский свод законов, переживший века Реконкисты, остаётся незыблемой основой нашего правосудия. Он обязывает знать подчиняться закону и легитимизирует нашу власть в глазах церкви и народа."
 limpieza_de_sangre_law: "Чистота крови"
 limpieza_de_sangre_law_desc: "Статуты о чистоте крови (#itaic limpieza de sangre#!) определяют, кто имеет право занимать государственные должности, вступать в религиозные ордена или претендовать на дворянский титул. Этот закон проводит чёткую черту между «старыми христианами» и потомками евреев, мавров или представителей других народов."
 limpieza_mainstream_enforcement_policy: "Умеренный контроль"
 limpieza_mainstream_enforcement_policy_desc: "За чистотой крови (#itaic limpieza#!) строго следят официальные институты, а любое продвижение по службе невозможно без тщательной проверки родословной. Такой подход позволяет эффективно поддерживать сложившуюся систему, не прибегая к чрезмерно жёстким трактовкам закона."
 limpieza_relaxed_enforcement_policy: "Ослабленный контроль"
 limpieza_relaxed_enforcement_policy_desc: "Растущее недовольство реформаторов и практические нужды торговли вынуждают ослабить контроль за чистотой крови. В вопросах продвижения по службе талант и богатство значат теперь гораздо больше, нежели дотошная проверка родословной."
 limpieza_strict_enforcement_policy: "Строгий контроль"
 limpieza_strict_enforcement_policy_desc: "Чистота крови проверяется с предельной строгостью, что полностью закрывает крещёным евреям и морискам доступ к государственным должностям, служению в церкви и вступлению в рыцарские ордена. Эти статуты обязывают все институты государства строго следить за соблюдением главного требования — христианского происхождения."
 mll_dret_civil_policy: "Гражданское право Мальорки"
 mll_dret_civil_policy_desc: "Гражданское право Мальорки опирается на традиции римской юриспруденции и каталонские хартии. Оно с предельной точностью регулирует вопросы собственности, контрактов и наследования, что способствует процветанию торговли и сохраняет самобытность наших подданных."
 nav_fueros_policy: "Наваррские фуэрос"
 nav_fueros_policy_desc: "Древние хартии Наварры защищают права и обычаи её жителей от посягательств со стороны короны. Каждый новый монарх обязан принести клятву соблюдать #italic фуэрос#! — лишь после этого его власть признаётся на всей территории королевства."
 negotiated_authority_policy: "Договорная власть"
 negotiated_authority_policy_desc: "Султан управляет государством на основе не прямого принуждения, а компромиссов и взаимного признания. Он соглашается с автономией племенных союзов в обмен на формальное подчинение и военную поддержку. Поступления в казну при таком строе сокращаются, однако держава сохраняет единство без постоянных конфликтов из-за попыток навязать свою волю силой."
 gra_learning_haven: "Обитель знаний для всех"
 gra_learning_haven_desc: "Вместо того, чтобы ограничивать образование религиозной принадлежностью, культурными взглядами или чем-то подобным, мы будем поощрять подлинно академическое государство, способствующее новым научным открытиям."
 ara_italian_dual_court: "Двойной двор в [ShowRegionNameWithNoTooltip('italy_region')]"
 ara_italian_dual_court_desc: "Учредив два двора в пределах нашего государства, мы сможем управлять обеими сторонами, не полагаясь на местную знать."
 unlock_italian_court_tt: "Открывает [ShowBuildingTypeName('italian_court_building')] [building|e]"
