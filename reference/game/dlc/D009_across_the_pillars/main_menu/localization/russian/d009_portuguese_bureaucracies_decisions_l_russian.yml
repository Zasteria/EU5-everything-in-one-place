l_russian:
 por_assumed_grandmastership_of_military_orders_tt: "Открывает [Concept('decision', 'решение')|e] «[ShowDecisionName('por_mesa_da_consciencia_e_ordens_decision')]»"
 por_assumed_grandmastership_of_military_orders_requirement_tt: "Держава должна была принять статус великого магистра военных орденов"
 por_mesa_da_consciencia_e_ordens_decision.title: "Учредим $por_mesa_da_consciencia_e_ordens_bureaucracy$"
 por_mesa_da_consciencia_e_ordens_decision.desc: "Наши ордена владеют командорствами и богатствами, недоступными обычным администрациям, их дела разбираются отдельно тем священником или капитаном, кому удастся добиться наибольшей монаршей милости. Мы должны создать регулярный трибунал — Палату совести и орденов — для изучения их прошений и назначения командорств, чтобы ещё плотнее связать их духовную власть с целями короны."
 por_mesa_da_consciencia_e_ordens_decision.a: "Учредить трибунал."
 establish_mesa_da_consciencia_e_ordens_tt: "Открывается [ShowBureaucracyTypeName('por_mesa_da_consciencia_e_ordens_bureaucracy')]"
 established_mesa_da_consciencia_e_ordens_tt: "Мы учредили [ShowBureaucracyTypeName('por_mesa_da_consciencia_e_ordens_bureaucracy')] решением $por_mesa_da_consciencia_e_ordens_decision.title$."
 por_estado_da_india_decision.title: "Эстадо да Индия"
 por_estado_da_india_decision.desc: "#italic Каза да Индия#! отвечает за нашу торговлю, но наши крепости и фактории от Индии до Южно-Китайского моря до сих пор не имеют единого управления. Нам поступило предложение сделать Гоа резиденцией официального вицекоролества — #italic Эстадо#! — которому будут подотчётны все гарнизоны, флоты и счётные палаты к востоку от Мыса Доброй Надежды."
 por_estado_da_india_decision.desc.entry: "Каза да Индия заведует нашими счётными книгами, но гарнизоны, флоты и фактории к востоку от Мыса Доброй Надежды не имеют единого руководства. Вице-король в Гоа объединит их в одно Эстадо."
 por_estado_da_india_decision.a: "Пусть Гоа правит востоком."
 por_estado_da_india_decision.a.tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('por_estado_da_india_reform')]»"
