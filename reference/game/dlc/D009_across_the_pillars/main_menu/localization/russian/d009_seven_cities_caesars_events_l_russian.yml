l_russian:
 seven_cities_caesars.1.title: "Пирит и кварц"
 seven_cities_caesars.1.desc: "Спустя пять месяцев странствий по Патагонии отряд нашёл долину, о которой рассказывали доставленные в Буэнос-Айрес моряки, спасшиеся с погибшего галеона. Никакого города здесь нет. Есть только несколько заброшенных хижин — судя по всему, пастушьих или охотничьих, построенных несколько десятков лет назад. Русло ручья действительно блестит, но оценщик быстро развеивает наши надежды: в почве — только «золото дураков», то есть пирит, и белый кварц. Единственное, чего здесь есть в изобилии, — это гуанако. [target_leader.GetName] пишет донесение на родину, укрывшись от ветра за базальтовой скалой. Ветер не стихает уже четвёртый день."
 seven_cities_caesars.1.a: "Нас обманули — возможно, давно. Снимем знамя и повернём обратно."
 seven_cities_caesars.1.historical_info: "Вплоть до XVIII века испанские монархи верили в существование Города Цезарей — якобы скрытого в глубине страны испаноязычного поселения, которое основали моряки, выжившие после кораблекрушения у побережья Патагонии в XVI веке. В период с 1530 по 1750 год на его поиски отправилось не менее семи экспедиций, но все они так ничего и не обнаружили. В основе этой легенды лежало стечение сразу нескольких обстоятельств. Во-первых, Патагонию в то время было действительно трудно исследовать. Во-вторых, выжившие после кораблекрушений порой рассказывали множество историй, объясняющих долгое отсутствие этих моряков. В-третьих, колониальные чиновники не игнорировали правдоподобные слухи, а всегда принимали их на веру."
 seven_cities_caesars.2.title: "Серебряный ручеёк в холодном краю"
 seven_cities_caesars.2.desc: "Открывшиеся нам земли гораздо суровее и значительно беднее, чем рассказывали спасшиеся, — и всё-таки надежда ещё теплится: в двух долинах нам попались ручьи со следами серебра в воде. А торговцы-мапуче, встретившиеся нам неделю назад, показывали небольшие изделия из этого драгоценного металла — по их словам, он добывается в предгорьях к западу отсюда. Города здесь нет, но сами земли существуют на самом деле, а значит, можно наладить торговлю. Мечтать о втором Потоси будет наивно, но кое-какой успех нам всё-таки сопутствует. [target_leader.GetName] приказывает построить на месте стоянки укреплённую факторию."
 seven_cities_caesars.2.a: "Построим факторию и оплатим расходы патагонским серебром, пусть его и мало."
 seven_cities_caesars.2.historical_info: "Ближе к концу эпохи колонизации в Патагонии открыли несколько небольших серебряных рудников, где добывали металл в количествах, достаточных для прибыльной (пусть и скромной) торговли. В основном они располагались на территории нынешней аргентинской провинции Рио-Негро и вдоль восточных склонов Анд. По сравнению с огромными серебряными месторождениями Анд, расположенными севернее, эти рудники были не столь значимы для экономики. Но и этих разработок хватило, чтобы вокруг них появились испанские, а позже — аргентинские фактории. Постепенно они вытеснили из региона местных торговцев-мапуче."
 seven_cities_caesars.3.title: "Найденные Цезари"
 seven_cities_caesars.3.desc: "Земли, о которых рассказывали спасшиеся, существуют — и город, о котором они говорили, тоже. В укромной долине между двумя горами расположилось поселение примерно на две тысячи человек. Местные жители одеваются на испанский лад и говорят на испанском языке, хотя за два поколения их речь заметно изменилась. Даже вероисповедание у них испанское, хотя здешний священник уже стар, и заменить его некому. Вот уже шестьдесят лет они живут тем, что выращивают маис в долине и добывают серебро в ручьях. Никто из них не подозревал, что когда-нибудь их найдут. Летописец всю ночь не смыкает глаз, записывая всё увиденное. [target_leader.GetName] на рассвете посылает за подкреплением."
 seven_cities_caesars.3.a: "Мы нашли потерянных подданных короны. Эта долина принадлежит нам."
 seven_cities_caesars.3.historical_info: "В испанских летописях иногда встречаются упоминания о потомках выживших после кораблекрушения мореплавателей, смешавшихся с местными жителями. Самый известный исторический пример — Гонсало Герреро, поселившийся среди майя. Однако подобные общины всегда были малочисленны и совсем не напоминали затерянные города из местных легенд. Патагонская легенда о Городе Цезарей также не нашла подтверждения: долину, где якобы находился этот скрытый от посторонних глаз город, с конца XIX века неоднократно изучали, однако ни картографы, ни старатели так и не нашли никаких следов поселения."
