l_russian:
 gold_caravan_expedition: "Золотой караван"
 gold_caravan_expedition_desc: "Вы отправите караван через Сахару на богатые рынки #italic Билад ас-Судана#!, чтобы продавать соль и ткань за богатства Сахеля. Дорога далека, пустыня полна опасностей, но в случае успешного возвращения караван доставит крупную партию золота на рынок вашей столицы."
 gold_caravan_expedition_haul_tt: "#GВ запасы нашего рынка в [ROOT.GetCountry.GetCapital.GetName] добавлено [ROOT.GetVariable('gold_caravan_last_haul').GetValue|V0]#! [ShowGoodsName('goods_gold')]"
 gold_caravan_outcome_windfall: "Купцы стекаются к успешному каравану"
 gold_caravan_outcome_nickname: "Предводитель каравана приобретает золотую репутацию"
 gold_caravan_outcome_midas: "Правителя коснулось богатство каравана"
 gold_caravan_outcome_leader_skills: "Предводитель каравана обретает опыт, добытый тяжким трудом"
 cibola_expedition: "Поиски семи городов Сиболы"
 cibola_expedition_desc: "Вы снарядите караван, чтобы отправить его на север от побережья Соноры — в страну, которую монахи и беглые рабы называют землёй семи золотых пуэбло. Путь туда непрост, а местные племена не любят чужаков, но те же монахи утверждают, что в этой земле нас ждут невиданные богатства."
 quivira_expedition: "Поиски королевства Кивира"
 quivira_expedition_desc: "Вы совершите рывок сквозь земли пуэбло в огромное море травы, раскинувшееся на востоке. Проводник-пленник утверждает, что в месяце пути через эту бескрайнюю равнину находится богатое королевство. Травяное море пустынно, а его реки текут медленно, но приз, если он вообще существует, будет равнозначен покорению всего Перу."
 sierra_de_la_plata_expedition: "Поиски Сьерра-де-ла-Плата"
 sierra_de_la_plata_expedition_desc: "Вы отправитесь на северо-запад от Ла-Платы к предгорьям Анд, чтобы найти серебряную гору Сьерра-де-ла-Плата, о которой рассказывают проводники-гуарани и выжившие члены экспедиции Солиса. Эта гора — не просто её одно месторождение драгоценного металла: она способна дать начало целому сектору экономики."
 norumbega_expedition: "Поиски Норумбеги"
 norumbega_expedition_desc: "Вы отправитесь от побережья Новой Англии вверх по Пенобскоту, чтобы найти окружённый стенами город Норумбега, о котором рассказывают лоцманы Верраццано и бристольские рыбаки. Путь туда лежит через бескрайние леса, населённые негостеприимными аборигенами, но если этот город действительно существует, он является вторым поселением европейского типа в Новом Свете — и первым, построенным не нами."
 saguenay_expedition: "Поиски королевства Сагеней"
 saguenay_expedition_desc: "Вы отправитесь вверх по Сагенею от реки Святого Лаврентия, чтобы пройти вглубь Новой Франции и найти королевство, о котором Доннакона рассказывал Картье в Стадаконе. По словам вождя, страна, где живут светлокожие люди в меховых плащах, высятся золотые горы и текут серебряные реки, находится к северу от великой канадской реки. Картье так и не смог найти её. Мы сможем."
 city_of_caesars_expedition: "Поиски Города Цезарей"
 city_of_caesars_expedition_desc: "Отправьте сухопутную экспедицию в сердце Патагонии — на юг от #TOOLTIP:REGION,la_plata_region,X #L Ла-Платы#!#!. Пережившие кораблекрушение моряки утверждают, что видели построенный между двумя горами город. Его жители говорят на кастильском диалекте испанского языка, который ни один из ныне существующих дворов не признаёт. Патагонская зима сурова, а выжившие моряки — ненадёжные свидетели, однако никакого расследования по этому поводу так и не было проведено."
 city_of_caesars_expedition_historical_info: "Вплоть до XVIII века испанские монархи верили в существование Города Цезарей — якобы скрытого в глубине страны испаноязычного поселения, которое основали моряки, выжившие после кораблекрушения у побережья Патагонии в XVI веке. В период с 1530 по 1750 год на его поиски отправилось не менее семи экспедиций, но все они так ничего и не обнаружили. В основе этой легенды лежало стечение сразу нескольких обстоятельств. Во-первых, Патагонию в то время было действительно трудно исследовать. Во-вторых, выжившие после кораблекрушений порой рассказывали множество историй, объясняющих долгое отсутствие этих моряков. В-третьих, колониальные чиновники не игнорировали правдоподобные слухи, а всегда принимали их на веру."
 city_of_caesars_expedition_outcome_overview: "$BULLET$Процесс поиска обеспечивает стабильный приток [Concept('prestige', 'престижа')|e].\n$BULLET$Результат зависит от количества найденных следов:\n$BULLET_WITH_TAB$Ничего не найдено: #R -5#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Найден один след или более: #G +10#! единиц [Concept('prestige', 'престижа')|e], [Concept('gold', 'дукаты')|e] и постоянный [Concept('location_modifier', 'модификатор района')|e] «[ShowModifier('city_of_caesars_discovered')]» на месте города.\n$BULLET_WITH_TAB$Найдено четыре следа или более: #G +20#! единиц [Concept('prestige', 'престижа')|e] и ещё больше [Concept('gold', 'дукатов')|e].\n$BULLET$Все богатства, собранные в ходе поиска, доставляются на наш [Concept('market', 'рынок')|e], и лучшие артефакты становятся [Concept('work_of_art', 'творениями')|e]."
 el_dorado_expedition: "Поиск Эльдорадо"
 el_dorado_expedition_desc: "Отправляйтесь вглубь материка из дельты Ориноко в поисках позолоченного короля, о котором говорят муиски — вождя, которого каждый год помазывают золотой пылью в самом сердце королевства, куда ещё не ступала нога подданного испанской короны. Джунгли здесь густые, реки извилистые, а туземцы — осторожные. Золото, если оно действительно существует, спрятано где-то за ними."
 el_dorado_expedition_historical_info: "Гуатавита — это священное озеро, расположенное в кратере потухшего вулкана в высокогорном районе современной Колумбии. Оно было культовым центром конфедерации муиска, правившей саванной Боготы до прихода испанцев в 30-х годах XVI века. С ним связана реальная традиция, лежащая в основе легенды об Эльдорадо и существовавшая вплоть до раннего колониального периода: нового вождя обтирали золотой пылью и вывозили к озеру. Там вождь прыгал в воду и плыл обратно, смывая тем самым «золотую кожу». Однако королевство муисков, истощённое оспой и политическим кризисом, который почти неизменно сопровождались вспышки европейских болезней, к моменту прибытия первой европейской экспедиции уже находилось в упадке."
 el_dorado_expedition_outcome_overview: "$BULLET$Процесс поиска Эльдорадо обеспечивает стабильный приток [Concept('prestige', 'престижа')|e].\n$BULLET$Результат зависит от количества найденных следов:\n$BULLET_WITH_TAB$Ничего не найдено: #R -10#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Найден один след или более: #G +10#! единиц [Concept('prestige', 'престижа')|e], [Concept('gold', 'дукаты')|e] и постоянный [Concept('location_modifier', 'модификатор района')|e] «[ShowModifier('el_dorado_discovered')]» на месте города.\n$BULLET_WITH_TAB$Найдено пять следов или более: #G +20#! единиц [Concept('prestige', 'престижа')|e] и ещё больше [Concept('gold', 'дукатов')|e].\n$BULLET$Все богатства, экзотические товары и собранные в ходе поиска артефакты доставляются на наш [Concept('market', 'рынок')|e], и лучшие из них становятся [Concept('work_of_art', 'творениями')|e]."
 fountain_of_youth_expedition: "Поиск источника вечной молодости"
 fountain_of_youth_expedition_desc: "Организуйте небольшую экспедицию на полуостров Флорида в поисках источника, который таино называют «Фонтаном Бимини». По словам старейшин, вода из этого источника возвращает мужчинам силу, а женщинам — юность и красоту. Испанские солдаты смеются над этой идеей. А старики с островов — нет."
 fountain_of_youth_expedition_historical_info: "Путешествие Хуана Понсе де Леона во Флориду в 1513 году традиционно ассоциируется с поиском источника вечной молодости. Но эта ассоциация возникла в испанских хрониках лишь после смерти конкистадора. Более поздние историки, которым увлекательная история показалась полезной, её закрепили. На самом же деле это путешествие было обычной разведывательной миссией. Её провели на деньги частного инвестора, собиравшегося основать укрепление для работорговли по Флориде, считавшейся тогда островом. Имя Понсе де Леона стало ассоциироваться с источником молодости потому, что он умер молодым — на шестом десятке — от раны стрелой, полученной во Флориде. Испанские летописцы следующего поколения просто не смогли удержаться от иронии по поводу такого стечения обстоятельств."
 fountain_of_youth_expedition_outcome_overview: "$BULLET$Процесс поиска источника обеспечивает стабильный приток [Concept('prestige', 'престижа')|e].\n$BULLET$Результат зависит от количества найденных следов:\n$BULLET_WITH_TAB$Ничего не найдено: #R -5#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Найден один след или более: #G +10#! единиц [Concept('prestige', 'престижа')|e] и постоянный [Concept('location_modifier', 'модификатор района')|e] «[ShowModifier('fountain_of_youth_discovered')]».\n$BULLET_WITH_TAB$Найдено пять следов или более: #G +20#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET$Все воды, найденные в ходе экспедиции, дают модификатор «[ShowModifier('rejuvenating_waters_modifier')]» и продлевают срок жизни наших [Concept('ruler', 'правителя')|e] и [Concept('heir', 'наследника')|e]. Также к нашему двору в качестве нового [Concept('character', 'персонажа')|e] может присоединиться туземец-лекарь."
 gold_fleet_tierra_firme_expedition: "Галеоны Тьерра-Фирме"
 gold_fleet_tierra_firme_expedition_desc: "Отправьте конвой галеонов из главного порта метрополии, чтобы забрать груз серебра, драгоценных камней и шкур из наших владений в Новой Гранаде и на Панамском перешейке. Флот Тьерра-Фирме — важнейшая артерия испанской колониальной империи, несущая богатства Нового Света на рынки Севильи."
 gold_fleet_tierra_firme_expedition_historical_info: "#italic Галеоны Тьерра-Фирме#! являлись одним из двух конвоев испанского #italic Серебряного флота#!. На флот Тьерра-Фирме была возложена задача обеспечивать торговлю с вице-королевствами Южной Америки. Его корабли вывозили серебро, добытое в рудниках Потоси в Верхнем Перу, а также другие колониальные товары через порты Портобело и Картахены. Серебро доставляли через Панамский перешеек по суше с тихоокеанского побережья и лишь затем грузили на галеоны. Филипп II закрепил систему конвоев в 1566 году, велев перевозить все грузы в составе вооружённых эскадр. Колониальные товары ввозились через Севилью, при этом #italic Каса-де-Контратасьон#! взимала в пользу государства #italic quinto real#! — пятую часть всех драгоценных металлов, добытых в Новом Свете."
 gold_fleet_tierra_firme_expedition_outcome_overview: "Погрузив в наших колониях #TOOLTIP:GOODS,silver,X #L серебро#!#! и #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, конвой доставляет их на родину в виде [Concept('gold', 'дукатов')|e] и по прибытии приносит #G +10#! к [Concept('prestige', 'престижу')|e]. Если взять на борт #TOOLTIP:GOODS,gems,X #L драгоценные камни#!#!, #TOOLTIP:GOODS,pearls,X #L жемчуг#!#! или караван мулов, ценность груза увеличится, однако конвой будет привлекать больше внимания. Встреча с флотом Новой Испании на острове [ShowScriptedGeographyName('island_of_cuba_geography')] дополнительно принесёт #G +10#! к [Concept('prestige', 'престижу')|e] и сделает безопаснее переход через Атлантику. Часть конвоя может быть потеряна вследствие штормов и нападений пиратов, а в худшем случае погибнет весь конвой."
 gold_fleet_nueva_espana_expedition: "Флот Новой Испании"
 gold_fleet_nueva_espana_expedition_desc: "Отправьте конвой Новой Испании из главного порта метрополии, чтобы забрать груз серебра и ценных красок из наших владений в Мезоамерике. Флот проходит через пролив Мона в Карибское море и собирается в Гаване перед переходом через Атлантику."
 gold_fleet_nueva_espana_expedition_historical_info: "#italic Флот Новой Испании#! был одним из двух конвоев испанского #italic Серебряного флота#!. Его корабли обеспечивали торговлю с вице-королевством Новой Испании, перевозя серебро из рудников Сакатекаса, Гуанахуато и других мексиканских месторождений, а также кошенильный краситель из Оахаки, индиго, ваниль и какао. Погрузка проводилась в порту Сан-Хуан-де-Улуа близ Веракруса. Как правило, конвой покидал Испанию весной и возвращался осенью, соединяясь в Гаване с галеонами Тьерра-Фирме для совместного перехода через Атлантику. Его путь пролегал через пролив Мона между Эспаньолой и Пуэрто-Рико —по стандартному маршруту в восточную часть Карибского моря."
 gold_fleet_nueva_espana_expedition_outcome_overview: "Погрузив в наших колониях #TOOLTIP:GOODS,silver,X #L серебро#!#! и #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, конвой доставляет их на родину в виде [Concept('gold', 'дукатов')|e] и по прибытии приносит #G +10#! к [Concept('prestige', 'престижу')|e]. Если сопровождать караван с серебром или взять на борт #TOOLTIP:GOODS,lumber,X #L лесоматериалы#!#!, ценность груза увеличится, однако конвой будет привлекать больше внимания. Встреча с галеонами Тьерра-Фирме на острове [ShowScriptedGeographyName('island_of_cuba_geography')] дополнительно принесёт #G +10#! к [Concept('prestige', 'престижу')|e] и сделает безопаснее переход через Атлантику. Часть конвоя может быть потеряна вследствие штормов и нападений пиратов, а если не повезёт, погибнет весь конвой."
 gold_fleet_tierra_firme_expedition_expedition_special: "Груз дукатов на борту: [EXPEDITION.GetVariable('gold_fleet_cargo')|0]"
 gold_fleet_nueva_espana_expedition_expedition_special: "Груз дукатов на борту: [EXPEDITION.GetVariable('gold_fleet_cargo')|0]"
 gold_fleet_cargo: "Груз сокровищ"
 gold_fleet_cargo_desc: "Серебро и золото, погруженное на корабли в ходе путешествия, в случае безопасного возвращения флота поступит в нашу казну."
 gold_fleet_danger: "Уровень опасности"
 gold_fleet_danger_desc: "Риск нападения пиратов и других неприятностей во время путешествия. Может изменяться в зависимости от сделанного выбора."
