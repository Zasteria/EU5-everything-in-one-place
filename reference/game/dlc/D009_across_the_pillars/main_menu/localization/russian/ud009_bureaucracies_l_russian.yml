l_russian:
 dar_al_tiraz_bureaucracy: "Дар аль-Тираз"
 dar_al_tiraz_bureaucracy_desc: "Роскошные ткани из Персии испокон веков используются в странах исламского мира для изготовления почётных мантий, которые правители дарят своим вассалам в знак благосклонности. За счёт государственной поддержки ткацкие мастерские #italic $dar_al_tiraz_bureaucracy$#! смогут не только одевать наш двор в изысканные расшитые одежды, но и поставлять ценный текстиль на другие рынки."
 diwan_al_mustakhlas_bureaucracy: "Диван аль-Мустахлас"
 diwan_al_mustakhlas_bureaucracy_desc: "#italic $diwan_al_mustakhlas_bureaucracy$#! отвечает за личное имущество султана: поместья, мастерские и неказённую часть доходов, которая идёт на содержание двора и Альгамбры. Грамотное управление этими средствами позволяет короне сохранять финансовую независимость от сословий, однако при отсутствии должного контроля ответственные чиновники могут воспользоваться своим положением для личного обогащения."
 diwan_al_qawafil_bureaucracy: "Диван аль-Кавафиль"
 diwan_al_qawafil_bureaucracy_desc: "#italic $diwan_al_qawafil_bureaucracy$#! контролирует торговые пути через Сиджильмасу и организует сахарские караваны, которые возят золото и рабов на север, а ткани и соль — на юг. Благодаря этому купцы могут спокойно заниматься своими делами, не беспокоясь о грабителях. Однако если диван вдруг ослабит хватку, торговые пути тут же заполонят бандиты, а местные племена неминуемо затаят злобу на тех, кто допустил этот беспорядок."
 ghuzat_mujahidin_bureaucracy: "Аль-Гузат аль-Муджахидин"
 ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! — это североафриканские всадники-добровольцы, которые считают своим священным долгом защиту мусульман по ту сторону Гибралтарского пролива. Под командованием своего шейха эти ревностные и храбрые воины ведут отчаянную борьбу против христиан, чем лишь сильнее разжигают в сердцах наших людей религиозное рвение."
 makhzan_bureaucracy: "Аль-Махзан"
 makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! служит центральным аппаратом власти султана, который занимается сбором налогов и обеспечивает исполнение указов. Сильный #italic махзан#! позволяет держать под контролем даже те племена и города, которые находятся далеко от столицы. Однако если чиновники не будут справляться со своей работой, то вся держава превратится в #italic билад ас-сиба#! — «непокорную землю», — и тогда удалённые провинции начнут бунтовать и добиваться автономии."
 marinid_madaris_bureaucracy: "Риаят аль-Мадарис"
 marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! представляет собой систему государственной поддержки медресе — учебных заведений, которые готовят юристов, писцов и чиновников. При должном финансировании этот орган не только укрепляет наши правовые институты, но и обеспечивает правительство талантливыми кадрами."
 qadi_al_jamaa_bureaucracy: "Кади аль-Джамаа"
 qadi_al_jamaa_bureaucracy_desc: "#italic $qadi_al_jamaa_bureaucracy$#! — это главный судья общины, который руководит маликитскими судами и назначает местных кади по всей державе. Когда судебная система страны работает исправно и действует согласно общепринятым законам, она придаёт правительству легитимность и укрепляет веру народа в правосудие."
 wulat_al_thughur_bureaucracy: "Вулат ас-Сугур"
 wulat_al_thughur_bureaucracy_desc: "#italic $wulat_al_thughur_bureaucracy$#! отвечают за оборону пограничных земель. Они набирают войска для крепостей, охраняют дороги и периодически ведут переговоры с крупными христианскими королевствами во избежание конфликтов. Фактически эти наместники служат щитом всей державы, ибо если наши границы будут слабы, то соседи непременно попытаются расширить свои владения за наш счёт."
 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "Диван аль-Гарб"
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#! — «западное ведомство» — управляет той частью наших андалусских владений, где проживают мосарабы и где христианских церквей по-прежнему больше, чем мечетей. Служащие этого дивана собирают подать в пользу султана, назначают кади в смешанных судах, а также способствуют дальнейшей ассимиляции местных жителей в нашу культуру. Если правильно организовать работу этого органа, нам будет гораздо проще установить контроль над этими землями, в противном же случае их быстро приберут к рукам более решительные правители."
 dawa_bureaucracy: "Диван ад-Дава"
 dawa_bureaucracy_desc: "Название #italic $dawa_bureaucracy$#! носит орган власти, посредством которого монарх управляет вопросами веры в заморских землях, посылая кади и проповедников в отдалённые провинции. Его #italic даваты#! несут свет ислама прибрежным народам, а судьи подчиняют новые колонии законам уммы. При должном содержании он превращает покорённые земли а спокойные провинции, верные монарху, но если им пренебречь, далёкие стада отвергнут своего пастыря, а слово веры утихнет."
 # Mozabite Bureaucracy
 mozabite_azzaba_bureaucracy: "Совет аззаба"
 mozabite_azzaba_bureaucracy_desc: "#italic Аззаба#! — это тайный совет ибадитских богословов, который служит основным органом управления в мзабских общинах. Он выносит решения по религиозным вопросам, разрешает споры и контролирует соблюдение строгих норм морали, которые ибадиты сумели сохранить вопреки столетиям давления извне. Мы рассматриваем совет как высшую власть в общине, а потому всецело поддерживаем его богословов и их постановления касательно божественного закона. За счёт этого аззаба пользуется большим уважением верующих и успешно продвигает среди них ибадитское право. Однако если совету будет недоставать средств, то он неизбежно утратит своё влияние, а его место займут другие традиции и течения."
 # Pre-Formation Iberian Bureaucracies
 nav_diputacion_navarra_bureaucracy: "Депутация Наварры"
 nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ регулирует правовую жизнь региона в период между заседаниями кортесов, осуществляя сбор #italic донативо#! и контролируя соблюдение #italic фуэрос#!, которые лежат в основе наваррской независимости. В состав этого органа входят аристократы, священники и горожане, которые отстаивают интересы своих сословий и круглый год участвуют в управлении державой. Таким образом, депутация по сути является гарантом стабильности страны, однако без должного финансирования она не сможет противостоять агрессивной политике централизации, которую старательно проводят крупные монархии."
 por_desembargo_do_paco_bureaucracy: "Верховный королевский суд"
 por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ — это высший судебный орган, который оценивает новые и действующие законы, объявляет о помилованиях и назначает судей, тем самым укрепляя власть короны во всех уголках державы. В отличие от общих судов, где трудятся выпускники юридических факультетов, верховный суд имеет более высокие требования к служащим: они должны быть не только специалистами в области права, но и пользоваться абсолютным доверием монарха. При надлежащей поддержке со стороны государства верховный суд не только обеспечивает точное исполнение королевских указов, но и повышает эффективность всего административного аппарата."
 por_mesa_da_consciencia_e_ordens_bureaucracy: "Палата совести и орденов"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ была основана для контроля за военными орденами Португалии — Орденом Христа, Орденом Сантьяго и Ависским орденом, чьи земли, доходы и духовная власть полностью перешли в ведение короны. Помимо этого, орган рассматривает прошения о религиозных послаблениях, распределяет командорства среди королевских подданных и разрешает споры между церковью и монархом. Благодаря учреждению палаты военные ордена превратились из независимых духовных организаций в инструменты королевской власти, которые вынуждены осуществлять религиозную политику монарха."
 # Spanish Councils - Regional
 spa_council_of_aragon_bureaucracy: "Совет Арагона"
 spa_council_of_aragon_bureaucracy_desc: "Восточные #TOOLTIP:REGION,iberia_region,X #L иберийские#!#! земли, которыми владеет [ShowScriptedGeographyName('aragon_geography')], будут подчиняться #italic совету Арагона#!. Главная задача этого органа — поддержка наших торговых связей в Средиземноморье и приведение королевских указов в соответствие с местным законодательством."
 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "#italic $spa_council_of_castile_bureaucracy$#! управляет обширными землями, которыми владеет [ShowScriptedGeographyName('castile_geography')], и следит за тем, чтобы там неукоснительно исполнялась воля монарха."
 spa_council_of_flanders_bureaucracy: "Совет Фландрии"
 spa_council_of_flanders_bureaucracy_desc: "[ShowScriptedGeographyName('spanish_netherlands_geography')] находятся далеко от наших границ, а потому за этими землями нужен особый контроль. #italic $spa_council_of_flanders_bureaucracy$#! будет поддерживать там порядок и следить за тем, чтобы регион исправно трудился на благо короны."
 spa_council_of_italy_bureaucracy: "Совет Италии"
 spa_council_of_italy_bureaucracy_desc: "С расширением нашего присутствия в #TOOLTIP:REGION,italy_region,X #L Италии#!#! у нас возникла острая необходимость в специальном органе, который будет поддерживать порядок на недавно завоёванных землях. С его помощью мы сможем более эффективно управлять удалёнными территориями прямиком из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!."
 spa_council_of_portugal_bureaucracy: "Совет Португалии"
 spa_council_of_portugal_bureaucracy_desc: "[ShowScriptedGeographyName('portugal_geography')] постепенно переходит под наш контроль, поэтому нам стоит создать специальный совет, который будет управлять нашими новыми владениями в этом регионе. Среди прочего этот орган будет контролировать нашу торговлю в Атлантике и заниматься вопросами флота."
 spa_viceroy_bureaucracy: "Палата вице-короля"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "Совет крестового похода"
 spa_council_of_crusade_bureaucracy_desc: "Основанный с согласия #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католической церкви#!#! и самого [Concept('pope', 'папы')|e], #italic совет крестового похода#! будет заниматься расширением наших границ и повсеместным распространением #L [ShowReligionAdjective('catholic')|l]ой#! веры."
 spa_council_of_finance_bureaucracy: "Совет финансов"
 spa_council_of_finance_bureaucracy_desc: "#italic $spa_council_of_finance_bureaucracy$#! заменяет две прежние счётные палаты и тем самым устраняет разногласия между ними, образуя единый орган, который занимается всеми финансовыми делами державы."
 spa_council_of_indies_bureaucracy: "Совет по делам Индий"
 spa_council_of_indies_bureaucracy_desc: "Все наши владения, что лежат за морями, будут находиться под управлением #italic совета по делам Индий#!. Этот орган будет контролировать наших заморских вассалов, а также заведовать торговлей между колониями и метрополией с тем, чтобы в нашу казну исправно поступало золото. Обеспечение порядка и благополучия на наших новообретённых территориях и их дальнейшее распределение между землевладельцами — всё это будет входить в прямые обязанности совета."
 spa_council_of_inquisition_bureaucracy: "Совет верховной инквизиции"
 spa_council_of_inquisition_bureaucracy_desc: "#italic $spa_council_of_inquisition_bureaucracy$#! состоит из нескольких папских инквизиторов под предводительством великого инквизитора. Совет поддерживает чистоту веры и рассматривает дела еретиков и отступников, выступая в роли высшего апелляционного органа по духовным вопросам."
 spa_council_of_military_orders_bureaucracy: "Совет орденов"
 spa_council_of_military_orders_bureaucracy_desc: "#italic $spa_council_of_military_orders_bureaucracy$#! управляет обширными владениями, которые прежде принадлежали духовным орденам. Благодаря этому мы можем использовать их для нужд нашей армии, набирая солдат из числа местных и проводя там подготовку будущих офицеров."
 spa_council_of_state_bureaucracy: "Государственный совет"
 spa_council_of_state_bureaucracy_desc: "#italic Государственный совет#!, во главе которого стоит наш правитель, всячески содействует правительству в решении дипломатических вопросов. В совет входят наиболее выдающиеся представители аристократии и духовенства, сведущие в международных делах. Эти люди не только руководят нашими посольствами за рубежом, но и консультируют монарха в наиболее сложных переговорах с другими державами."
