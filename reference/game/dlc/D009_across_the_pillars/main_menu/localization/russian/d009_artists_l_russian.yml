l_russian:
 muqni_at_al_sa_il: "«Мукниат ас-саиль ан аль-марад аль-хаиль»"
 muqni_at_al_sa_il_desc: "Когда чёрная смерть опустошала улицы Гранады, визирь и врач Лисан аль-Дин ибн аль-Хатиб отверг утешительную доктрину о том, что распространение чумы зависит лишь от божественной воли. Он стал свидетелем того, как больные люди заражают здоровых через одежду, воздух и нахождение в общих помещениях, а затем записал увиденное.\n\nЕго убеждённость в том, что заболевание передаётся при контакте, настроила против него правоведов, для которых подобное утверждение граничило с богохульством. Тем не менее эта идея сохранилась и была развита уже другими врачами от Феса до Каира спустя много лет, уже после того, как эпидемия пошла на спад."
