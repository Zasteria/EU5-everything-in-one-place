l_russian:
 flavor_tle.8.title: "The [ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]"
 flavor_tle.8.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] [ROOT.GetCountry.GetName] недавно издало новую фетву, разрешающую нашим единоверцам практиковать #italic такию #! перед лицом преследований. Названная в честь места, где она была провозглашена, [ShowDecisionName('oran_fatwa_decision')] достигла [ShowRegionName('iberia_region')] и широко распространяется среди угнетённых [ShowReligionAdjective('sunni')] собратьев.\n\nЭто дозволение практиковать такию позволяет тайно исповедовать [ShowReligionGroupName('muslim')], притворяясь приверженцем иной веры. Обычно запрещённая в #italic 'умме #!, эта фетва допускает такую практику в [ShowRegionNameWithNoTooltip('iberia_region')]."
 flavor_tle.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tle.8.a.entry: "$common_string_great$"
 oran_fatwa_decision.title: "[ShowLocationNameWithNoTooltip('oran')] Фетва"
 oran_fatwa_decision.desc: "$flavor_tle.8.desc$"
 oran_fatwa_decision.desc.entry: "Наши [ShowReligionAdjective('sunni')] единоверцы в [ShowRegionName('iberia_region')] страдают под гнётом. Мы не можем позволить им оставаться в #italic такии#! пока их вера слабеет. Необходимо издать фетву, чтобы помочь им в их борьбе."
 oran_fatwa_decision.a: "$flavor_tle.8.a$"
 has_most_prestige_out_of_all_maghrebi_sunni_countries: "Имеет больше [prestige|e], чем все [ShowReligionAdjective('sunni')] державы со [capital|e] в [ShowRegionName('maghreb_region')]"
 tle_enable_free_the_mudejar_cb_tt: "[ShowReligionAdjective('sunni')] [countries|e] со [capital|e] в [ShowRegionName('maghreb_region')] смогут фабриковать [ShowCasusBelliName('cb_free_the_mudejar')] [casus_belli|e] против [ShowReligionGroupAdjective('christian')] целей, имеющих [provinces|e] с [ShowReligionAdjective('sunni')] [pops|e] в [ShowRegionName('iberia_region')]"
 tle_enable_events_for_liberating_mudejar_tt: "[ShowReligionAdjective('sunni')] [countries|e], которые [occupy|e] [locations|e] с [ShowReligionAdjective('sunni')] [pops|e] в [ShowCasusBelliName('cb_free_the_mudejar')] [war|e], получат [events|e] об освобождении местного населения"
 flavor_tle.9.title: "Освобождение [target.GetNameWithNoTooltip]"
 flavor_tle.9.desc: "Времена гонений для наших [ROOT.GetCountry.GetReligion.GetAdjective] братьев в [target.GetName], похоже, наконец подошли к концу. Долгие десятилетия эти несчастные страдали от дурного обращения под тиранической властью [target.GetOwner.GetLongName]. Но теперь, когда наши войска их освободили, они наконец смогут исповедовать [ShowReligionGroupName('muslim')] в мире и спокойствии. Больше им не придётся скрывать свою веру."
 flavor_tle.9.a: "Возрадуйтесь, братья!"
 tle_fires_for_all_locations: "Этот [effect|e] действует для каждого освобождённого [location|e], но данное уведомление о [event|e] относится только к [province_capitals|e]"
 flavor_tle.10.title: "Арабизация [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_tle.10.entry: "Арабизация $TLE$"
 flavor_tle.10.desc: "[ShowAreaName('algiers_area')] — лишь одна из областей [ShowRegionName('maghreb_region')], подвергающихся сильной арабизации под влиянием [ShowCultureGroupName('arabic_group')] [ShowEstateTypeName('tribes_estate')]. По мере того как этот процесс развивается, [ShowLanguageName('tamazight_language')] выходит из употребления, а городская знать всё охотнее перенимает местный [ShowLanguageName('arabic_language')] диалект. Более того, с ростом числа переселенцев из [ShowRegionName('iberia_region')] мы видим, как наше [ShowEstateTypeName('nobles_estate')] полностью перенимает эти обычаи. Вполне возможно, что вскоре наше государство примет имя [ShowCultureName('algerian')]."
 flavor_tle.10.a: "Нам нужно укрепить наши корни."
 flavor_tle.10.b: "В этом наше будущее!"
 flavor_tle.12.title: "Отказ от племенных корней"
 flavor_tle.12.entry: "$flavor_tle.12.title$"
 flavor_tle.12.desc: "Основы государства [target_country.GetAdjective] зиждутся на [target_government_reform.GetName] — самом многочисленном племени в окрестностях [target_location.GetName]. Именно из этого племени вышла династия [target_dynasty.GetName], давшая начало тому [target_country.GetFlavorRank], которым мы являемся сегодня. Однако в последнее время влияние [target_estate.GetName] постепенно ослабевает, что угрожает равновесию сил в [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Если не предпринять мер по усилению $banu_al_wad$, их политические привилегии канут в лету."
 flavor_tle.12.a: "Нам нужно искать legitimacy не только у племён."
 flavor_tle.12.b: "Первенство $banu_al_wad$ должно быть сохранено!"
 tle_empower_banu_al_wad_reform: "[ShowGovernmentReformName('tle_support_of_banu_al_wad')] также даст нешкалируемый [ShowNamedValue('small_stability_investment')|+=] [ShowModifierTypeName('stability_investment')] [modifier|e]"
 tle_empower_banu_al_wad_reform_unlock_tt: "Открывается благодаря #Y«$flavor_tle.12.title$»#! [event|e]"
 has_more_prestige_than_root_tt: "Имеет больше [prestige|e], чем [ROOT.GetCountry.GetName]"
