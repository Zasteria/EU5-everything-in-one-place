l_russian:
 agraw_federation_reform: "Федерация агравов"
 agraw_federation_reform_desc: "#italic Аграв#! — совет старейшин, объединяющий кабильские деревни и кланы, — правит без опоры на центральную исполнительную власть. Принятые на нём решения обязательны для всех входящих в него кланов, и ни один чиновник не в силах оспорить волю собравшихся старейшин. Подобная федеративная структура делает нас почти неуязвимыми для классических методов завоевания: ни престола, который можно захватить, ни дворца, который можно предать огню, ни общего договора, расторжение которого лишило бы нас свободы. Эта система связывает селения в единое целое, не навязывая им волю далёкого султана. Мы миримся с долгим обсуждением дел ради подлинного самоуправления — ведь у народа, который сам управляет своей судьбой, нет причин восставать против собственной власти."
 alg_dey_regency_reform: "Алжирское регентство"
 alg_dey_regency_reform_desc: "В Алжирском регентстве сложилась самобытная форма правления: корпус янычар избирает #italic дея#!, сухопутными силами командует ага, а старшие офицеры образуют #italic диван#!, исполняющий роли одновременно совета и парламента. Эта система не имеет ничего общего с традиционной династией: #italic дей#! подотчётен избравшему его корпусу и в случае утраты доверия #italic оджака#! редко остаётся на своём месте дольше нескольких месяцев. И всё же эта система на удивление стабильна. Она позволяет создать эффективное военно-корсарское государство, чьё влияние на море и в торговле несопоставимо с его скромным населением. Мы утвердили это устройство как государственный строй регентства: непредсказуемость смены власти в армии — малая цена за самоуправляемое войско и пополняемую морем казну."
 amenokal_paramountcy_reform: "Верховенство аменокаля"
 amenokal_paramountcy_reform_desc: "#italic Аменокаль#! — верховный вождь конфедерации туарегов — правит без опоры на чиновников. Его власть зиждется на личном авторитете, регалии — священном барабане и преданности благородной касты #italic имашаген#!, которая следит за исполнением его воли среди разрозненных кланов. Эта система уникальна: могущества вождя достаточно, чтобы созвать на войну всадников со всей конфедерации, но при этом власть рассредоточена настолько, что позволяет контролировать бескрайние земли пустыни без гарнизонов в каждом оазисе. Мы утвердили это устройство как наш государственный строй. Дипломатия и армия отныне переходят под начало аменокаля, а внутреннее управление каждого клана регулируется лишь его собственными обычаями."
 amir_al_muslimin: "Амир аль-муслимин"
 amir_al_muslimin_desc: "Титул #italic «амир аль-муслимин»#! — повелитель мусульман — принадлежал султанам из династии Альморавидов, которые пересекли Сахару, чтобы спасти Аль-Андалус от натиска христиан, а также нашим предкам Маринидам, которые раз за разом пересекали пролив с той же целью. Мы выгнали из пролива флоты Кастилии и Арагона, поэтому тоже переняли это наследие, став защитниками обширного рубежа на западе исламского мира. Наш статус подчёркивается в хутбах, которые звучат в мечетях от Феса до Гвадалквивира. Этот титул привязывает андалузские общины к нашему трону, привлекает воинов веры под наши знамёна и разносит наше имя по всем мусульманским дворам, которые следят за событиями на Иберийском полуострове."
 anr_coprincipality_reform: "Соправительство"
 anr_coprincipality_reform_desc: "На землях Андорры действует уникальная конституционная система совместного суверенитета двух князей-соправителей, епископа Урхельского и графа Фуа, чьи многовековые взаимные притязания парадоксальным образом привели к устойчивому равновесию. Ни один из монархов не может действовать без согласия другого, и этот взаимный контроль уберёг Андорру от поглощения сильными соседями. Мы утвердили систему соправительства в качестве конституционной основы нашего государства, сознательно ограничив себя в односторонних действиях ради дипломатической безопасности."
 ara_diputacion_general_reform: "Генеральная депутация Арагона"
 ara_diputacion_general_reform_desc: "#italic Генеральная депутация Арагона#! изначально создавалась как постоянный комитет кортесов Арагона для контроля за сбором выделяемых короне субсидий, но со временем превратилась в постоянный орган государственной власти. Под руководством избираемых тремя сословиями депутатов (#italic Diputados#!) она обеспечивает финансовую отчётность и защищает конституционные свободы (#italic fueros#!) от посягательств со стороны монарха. Депутация заседает круглый год; таким образом, созываемое прежде лишь от случая к случаю собрание превратилось в постоянно действующий орган арагонского самоуправления."
 basque_juntas_generales_reform: "Генеральные хунты"
 basque_juntas_generales_reform_desc: "#italic Генеральные хунты#! — это традиционные представительные собрания в баскских провинциях, которые проводятся возле древнего дуба Герники. Там обсуждаются вопросы законодательства, налогообложения и защиты прав местного населения. При этом в каждой провинции есть свои #italic фуэрос#! — правовые обычаи, которые сюзерены обязаны уважать и соблюдать, чтобы заслужить признание басков. Таким образом, хунты представляют собой децентрализованные органы самоуправления, уникальные для #TOOLTIP:REGION,iberia_region,X $tt_op_L$Иберии$tt_cl_2$. До сих пор ни одному монарху так и не удалось упразднить эти собрания, не встретив при этом жёсткого сопротивления со стороны местных."
 cas_santa_hermandad_reform: "Святая эрмандада"
 cas_santa_hermandad_reform_desc: "#italic Святая эрмандада#! — постоянное полицейское ополчение, призванное искоренить разбой и обеспечить безопасность на дорогах королевства. Эта централизованная организация, учреждённая совместно Фердинандом и Изабеллой, пришла на смену разрозненным городским братствам и находится в прямом подчинении короне. Сфера влияния королевского правосудия отныне не ограничивается городами: #italic эрмандада#! взяла под защиту сельские дороги, сделав путешествия и торговлю безопасными."
 cas_santa_hermandad_unlocks_hermandad_infantry_tt: "Позволяет набирать [ShowUnitDefinitionName('a_hermandad_infantry')]"
 cas_santa_hermandad_unlocks_summon_santa_hermandad_tt: "Открывает [ShowCabinetActionName('summon_santa_hermandad')] [cabinet_action|e]"
 cat_corts_catalanes_reform: "Каталонские кортесы"
 cat_corts_catalanes_reform_desc: "#italic Каталонские кортесы#! — одно из старейших сословно-представительных собраний в Европе, состоящее из трёх палат: духовенства, знати и королевских городов (#italic braç reial#!). Корона не имеет права вводить чрезвычайные налоги без согласия всех трёх палат, и монарх обязан удовлетворить жалобы собрания ещё до выделения субсидий. Подобное устройство закрепляет общественный договор между правителем и подданными: суверенитет принадлежит не одному королю, а всей державе как единому целому."
 cat_generalitat_reform: "Generalitat de Catalunya"
 cat_generalitat_reform_desc: "Женералитат Каталонии (#italic Generalitat de Catalunya#!) изначально создавался как постоянный исполнительный орган каталонских кортесов для распределения субсидий и управления делами государства между сессиями основного собрания. Со временем он превратился в главный оплот конституционных свобод Каталонии — постоянно действующий совет избранных представителей, которые следят за строгим исполнением обязательств, данных короной. Непрерывная работа Женералитата изменила каталонские парламентские традиции: созываемое прежде от случая к случаю собрание уступило место регулярному и планомерному управлению государством."
 diwan_of_the_azzaba_reform: "Диван аль-Аззаба"
 diwan_of_the_azzaba_reform_desc: "#italic Диван аль-Аззаба#! — совет ибадитских богословов, исполняющих одновременно роли правоведов, судей и наместников — представляет собой уникальную форму правления в Мзабском пятиградье. Эта система ближе всего подошла к исконному ибадитскому идеалу общины, где власть принадлежит не самым сильным, а самым просвещённым. Религия здесь неотделима от государства: советники #italic аззаба#! заседают прямо в мечети, разрешают торговые споры на основе тех же догматов, что и богословские вопросы, а любое решение властей требует их обязательного одобрения. Мы провозгласили эту аскезу конституционным принципом: наше государство будет управляться не по законам мирских королевств, а как истинная община верующих, ответственных перед Богом и друг перед другом."
 glc_xunta_xeral_reform: "Генеральная хунта Королевства Галисия"
 glc_xunta_xeral_reform_desc: "#italic Генеральная хунта#! является представительным собранием нашего королевства, где делегаты из семи провинций Галисии обсуждают налогообложение, законодательство и защиту своих региональных прав. Выступая в роли постоянного парламента, генеральная хунта даёт галисийской знати, духовенству и городам возможность высказывать короне своё мнение по разным вопросам и отстаивать свои особые права и привилегии, присущие лишь этой части #TOOLTIP:REGION,iberia_region,X $tt_op_L$Иберии$tt_cl_2$. Благодаря ответственной работе #italic хунты#! Галисия управляется лучше большинства других территорий полуострова."
 gra_hajib_reform: "Хаджиб ад-Даула"
 gra_hajib_reform_desc: "Должность #italic хаджиба#!, совмещающего обязанности камергера и главного министра, можно назвать стержнем, на котором держится всё управление нашим эмиратом. Хаджиб руководит делами правителя, контролирует финансовую деятельность #italic дивана#! и выступает главным посредником между султаном и государственной канцелярией. Официально закрепив и расширив полномочия этой должности, мы передадим текущие дела управления в руки одного способного наместника. Это освободит султана для решения военных и дипломатических вопросов и обеспечит слаженную работу всего государства."
 jamaa_parliament: "Джамаа"
 jamaa_parliament_desc: "Постоянно действующий совещательный орган нашего эмирата, объединяющий под одной крышей #italic кади аль-джамаа#!, #italic визиря#!, #italic шейха аль-гузат#! и вождей крупнейших приграничных кланов. При такой системе ни одна из внутриполитических сил не может навязать свою волю остальным."
 lon_cortes_de_leon_reform: "Леонские кортесы"
 lon_cortes_de_leon_reform_desc: "#italic Леонские кортесы#!, впервые созванные Альфонсо IX в 1188 году, считаются одним из старейших сословно-представительных органов в европейской истории — они почти на столетие опередили появление английского парламента. Объединив духовенство, знать и представителей городов, они закрепили важнейший правовой принцип: прежде чем накладывать новые повинности, монарх обязан заручиться согласием всех сословий. Эта многовековая конституционная традиция наделяет нашу власть легитимностью, основанной не только на праве завоевания, но и на официальном согласии всей державы."
 mll_universitat_de_mallorca_reform: "Университет Мальорки"
 mll_universitat_de_mallorca_reform_desc: "#italic Университет города и королевства Мальорка#! — высший орган управления нашего островного государства, находящийся под руководством выборных присяжных (#italic юратов#!). В их обязанности входит контроль за сбором налогов, проведение общественных работ и защита интересов купечества и горожан. Благодаря многовековым традициям городского самоуправления купеческое сословие стало ведущей силой в делах Мальорки. Теперь торговая политика и управление портами всегда отвечают нуждам тех, чей доход зависит от моря. Эффективная гражданская администрация Университета служит залогом процветания всего острова."
 mor_marinid_zenata_confederation_reform: "Конфедерация маринидов-зената"
 mor_marinid_zenata_confederation_reform_desc: "#italic Бану Марин #! выехали из [ShowLocationName('figuig')] как конные владыки [ShowCultureName('zenati')] и отняли [ShowLocationName('fez')] у слабеющей династии [ShowDynastyName('almohad_dynasty')], опираясь на племенное единство и знамя [ShowReligiousSchoolName('maliki_school')] правоверия. Наша династия [ShowDynastyName('marinid_dynasty')] по-прежнему держится на двух опорах: племена [ShowCultureNameWithNoTooltip('zenati')] садятся на коней, когда их призывает наш [GetCountry('MOR').GetGovernment.GetRulerTitle|l], #italic факихи #! благословляют [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] правление, а #italic джихад #! в аль-Андалусе отвечает перед каждой из них. [GetCountry('MOR').GetGovernment.GetRulerTitle|l] из рода [ShowDynastyNameWithNoTooltip('marinid_dynasty')] властвует лишь потому, что [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] племена идут за ним, а [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] улемы признают его власть, и обязан вновь и вновь доказывать и то, и другое мечом."
 mor_sharifian_sultanate_reform: "Шарифский султанат"
 mor_sharifian_sultanate_reform_desc: "Шарифские султаны превратили Марокко из конфедерации, зависимой от племенного ополчения, в централизованную монархию, чья власть в равной мере опирается на священное происхождение правителей и на воинскую дисциплину. На государственных землях расселены военно-служилые племена #italic джиш#!, на полигонах Феса обучаются искусству артиллерии андалусские стрелки, а разветвлённая система #italic махзена#! ведает сбором налогов и судебными указами по всей стране с невиданной для Маринидов регулярностью. Эта форма правления превращает нашу #italic бараку#! — священную благодать потомков Пророка — из простого притязания на легитимность в полноценную государственную систему. Султанат становится одновременно и правящей династией, и бюрократическим механизмом, и высшим духовным судом."
 nav_cortes_navarra_reform: "Наваррские кортесы"
 nav_cortes_navarra_reform_desc: "Наваррские кортесы объединяют три сословия королевства — духовенство, знать и города — в единый орган, без согласия которого нельзя вводить чрезвычайные налоги или принимать важные законы. Будучи старше большинства иберийских парламентов, они ревностно оберегают традиционные свободы королевства и отстаивают особое законодательство, отличающее Наварру от её более крупных соседей. Официально закрепив статус этого собрания, мы признаем зависимость власти короны от воли сословий."
 por_estado_da_india_reform: "Эстадо да Индия"
 por_estado_da_india_reform_desc: "#italic Эстадо да Индия#! — особое политическое образование, созданное #ONCLICK:COUNTRY,[GetCountry('POR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('POR').Custom('CL_tt')],X [GetCountry('POR').Custom('CL_INST')|L]#!#! для того, чтобы облегчить управление своими удалёнными факториями, крепостями и колониями в Азии. Заседая в своей резиденции в Гоа, вице-король Индии организует работу флотов и гарнизонов, а также распоряжается доходами огромной морской империи, простирающейся от Персидского залива до Южно-Китайского моря. Сосредотачивая управление этими землями в руках королевского наместника, #L [GetCountry('POR').GetNameWithNoTooltip|l]ая#! корона может извлекать из них прибыль и укреплять своё влияние гораздо более эффективно, чем любая частная торговая компания."
 ribat_state_tradition_reform: "Традиции государства-рибата"
 ribat_state_tradition_reform_desc: "#italic Рибат#! — укреплённый монастырь, откуда движение Альморавидов начало своё завоевание Сахары и Магриба, — представляет собой не просто сооружение, а целую модель управления: военно-религиозное братство, под началом которого находится сеть крепостей и мечетей, управляет окрестными землями с помощью благочестивых воинов из своих гарнизонов, не тратясь на содержание гражданских чиновников. Мы переняли этот уклад. У нашего государства нет единого центрального дворца — власть рассредоточена по нескольким крупным цитаделям. Наши управленцы — одновременно и воины, и богословы, а легитимность зиждется не на знатности рода, а на суровой дисциплине пограничья. Такая аскетичная модель управления обеспечивает нам хорошо укреплённые позиции, духовенство, которое идёт в бой, и воинство, которое не забывает о молитве."
 tun_husaynid_beylik_reform: "Бейлик Хусейнидов"
 tun_husaynid_beylik_reform_desc: "Несмотря на то что османская система управления предполагала частую смену подотчётных Порте наместников, хусейнидским #italic беям#! удалось превратить #italic бейлик#! Тунис в фактически наследственное владение. Они сумели создать политическую фикцию — признавая себя вассалами Османской империи, основали правящую династию, которая просуществовала почти до наших дней. Хусейниды сформировали эффективный совет министров, сохранили культурную преемственность Ифрикии и сумели выдержать баланс между всё более формальной зависимостью от Османской империи и практическими требованиями европейской дипломатии гораздо искуснее многих похожих государств. Мы утвердили этот гибридный строй: отныне наша держава управляется династией, обладает современным административным аппаратом, а также достаточным престижем для ведения дел на правах признанного суверена, сохраняя при этом религиозное покровительство исламского сюзерена."
