l_russian:
 flavor_cas.142.title: "Чёрная легенда"
 flavor_cas.142.entry: "$flavor_cas.142.title$"
 flavor_cas.142.desc: "До нас дошли сведения, что наши колониальные соперники не жалеют сил, чтобы очернить имя [ROOT.GetCountry.GetName]. Памфлеты и байки изображают наших конкистадоров кровожадными тиранами, а наши колонии — землями, держащимися лишь на жестокости. Поскольку эти обвинения быстро распространяются по [ShowContinentName('europe')], нам следует ответить на эту клевету и завистливые выдумки."
 flavor_cas.142.a: "Их зависть — доказательство нашего величия."
 flavor_cas.142.b: "Собрать доказательства и представить их публично."
 flavor_cas.142.b_tt: "Хотя нам, возможно, удастся спасти свою репутацию, многие могут истолковать наш ответ как признание того, что мы были обмануты их ложью и измышлениями"
 flavor_cas.142.historical_info: "Начиная с XVI века испанские колониальные соперники — по большей части протестанты — развернули клеветническую кампанию, которую позднее назовут Чёрной легендой. Хотя сами они занимались схожими делами, они стремились очернить Испанию, подчёркивая её жестокость в Америке и переиздавая испанские сочинения, например труды Бартоломе де лас Касаса, с множеством преувеличений и вырванных из контекста фактов, дабы подорвать репутацию испанской короны."
 flavor_cas.143.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] дорога"
 flavor_cas.143.entry: "Испанская дорога"
 flavor_cas.143.desc: "Поскольку наши владения простираются от [ShowRegionName('italy_region')] до [target_province2.GetName], перевозка товаров и солдат из одного места в другое становится всё более насущной проблемой, ведь наши корабли подвергаются серьёзной опасности, особенно при плавании вокруг [ShowRegionName('great_britain_region')]. Было предложено вложить средства в систему дорог, которая со временем соединит все наши владения в [ShowContinentName('europe')] по суше."
 flavor_cas.143.a: "Начнём её строительство."
 flavor_cas.143.a_tt: "[ShowRoadTypeName('paved_road')] будет построена в каждом [location|e] в пределах [target_province1.GetName] и [target_province2.GetName] [province|e], стоимостью в [gold|e], зависящей от местности и уже проложенных дорог"
 flavor_cas.143.b: "Ничто не угрожает нашему флоту."
 flavor_cas.143.historical_info: "Испанская дорога представляла собой военный и логистический коридор, созданный в середине XVI века, который связывал испанские владения в Италии с Испанскими Нидерландами через союзные территории, большей частью в пределах Священной Римской империи. Она была проложена, чтобы избежать опасных вод Ла-Манша, где враждебные флоты могли легко перехватывать испанские корабли."
 flavor_cas.148.title: "Empresa de China"
 flavor_cas.148.entry: "$flavor_cas.148.title$"
 flavor_cas.148.desc: "С тех самых пор, как мы прибыли в [ShowRegionName('indonesia_region')], многие утверждают, что завоевание Китая не только возможно, но и предначертано судьбой. Купцы и послы сообщают, что государства, погрязшие в коррупции, не смогут противостоять мощи [ROOT.GetCountry.GetName]. Наши шпионы усердно трудятся, внедряясь в [target_country.GetName], и полагают, что [target_location.GetName] станет идеальным плацдармом для нашего грядущего покорения всего Китая."
 flavor_cas.148.a: "Начать подготовку к вторжению."
 flavor_cas.148.b: "Мы не можем действовать, основываясь на этих слухах."
 flavor_cas.148.historical_info: "После испанского завоевания Филиппин многие чиновники и миссионеры-иезуиты предложили амбициозный план, получивший название #italic Empresa de China#!, в котором Испания должна была вторгнуться в империю Мин и обратить её население в христианство. Иезуиты, работавшие в Китае, сообщали, что империя внутренне слаба и может быть легко покорена. В 1588 году Филипп II санкционировал подготовку к вторжению, однако оно так и не было предпринято, оставшись одним из самых амбициозных неосуществлённых экспансионистских замыслов Испанской империи."
 flavor_cas.152.title: "Единый налог для всей державы"
 flavor_cas.152.entry: "$flavor_cas.152.title$"
 flavor_cas.152.desc: "Война с маврами легла на казну тяжким бременем, поэтому [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] принялись искать новые источники дохода. Города державы позволили нам собирать налог с продаж в пользу королевской казны, однако многие наши советники считают, что эта мера не должна оставаться временной, и предлагают превратить её в постоянный узаконенный источник дохода."
 flavor_cas.152.a: "Нельзя полагаться лишь на временную помощь."
 flavor_cas.152.b: "Нам не следует злоупотреблять их щедростью."
 flavor_cas.152.historical_info: "Во времена правления Альфонсо XI Кастилия столкнулась с финансовыми трудностями из-за войн с Гранадой. Для финансирования осады и завоевания Альхесираса кастильские города предоставили королю право взимать #italic алькабалу#! — налог на торговые сделки. Хотя изначально этот сбор задумывался как чрезвычайная мера и был одобрен городами на кортесах, вскоре он стал одним из важнейших постоянных источников дохода для кастильской короны. Последующие монархи расширили сферу применения алькабалы и закрепили её в государственной системе, превратив в постоянный налог, который на протяжении нескольких столетий составлял значительную часть поступлений в королевскую казну."
