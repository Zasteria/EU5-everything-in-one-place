l_russian:
 gold_fleet_shared_events.1.title: "Пираты на горизонте"
 gold_fleet_shared_events.1.desc: "С наветренной стороны виднеются паруса: к флоту приближаются корабли без опознавательных знаков. Это небольшие быстроходные суда островных пиратов, способные идти против ветра и уходить на мелководье, куда за ними не последует ни один галеон.\n\nНезнакомых кораблей три или четыре, и момент они выбрали удачно: после ночи со слабым ветром наши суда рассредоточились, а последний корабль, гружённый сокровищами, отстал от остальных на пол-лиги."
 gold_fleet_shared_events.1.a: "Объявим сбор и отгоним их."
 gold_fleet_shared_events.1.b: "Откупимся от них, пока они не подошли вплотную."
 gold_fleet_shared_events.1.c: "Ускоримся и попробуем от них уйти."
 gold_fleet_shared_events.1.d: "Подадим сигнал другому флоту. Вместе мы с ними справимся!"
 gold_fleet_shared_events.1.historical_info: "На протяжении XVI и XVII веков испанским флотам, перевозящим сокровища, досаждали каперы и пираты. Действуя с разрешения властей или по собственной инициативе, корсары научились использовать особенности географии Карибского моря: небольшие суда с малой осадкой могли ходить по проливам между островами и перехватывать корабли, отставшие от конвоя из-за шторма или встречного ветра. Грузы серебра были настолько ценной добычей, что даже их часть могла окупить целую захватническую экспедицию."
 gold_fleet_shared_events.pirate_fight_fail_tt: "Разбойники неприятно удивляют нас численностью и быстротой: мы теряем половину груза прежде, чем нам удаётся их отогнать"
 gold_fleet_shared_events.pirate_flee_fail_tt: "Флот не успевает уйти от погони, и его настигают разбойники: четверть груза потеряна"
 gold_fleet_shared_events.2.title: "Вражеская эскадра перехватывает флот"
 gold_fleet_shared_events.2.desc: "Предупреждение дозорного поступает слишком поздно. С наветренной стороны на всех парусах к нам идут военные корабли, осевшие под тяжестью орудий и экипажей и несущие флаги страны, с которой враждует [ROOT.GetCountry.GetName]. Это линейные корабли — они достаточно быстрые, чтобы до наступления ночи настичь самый медленный корабль флота.\n\nВетер не позволяет уйти от погони, а в трюмах находятся запасы #TOOLTIP:GOODS,silver,X #L серебра#!#!, которым владеют [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], за целый год. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить: дать бой, рассредоточить флот или смириться с потерей всего груза."
 gold_fleet_shared_events.2.a: "Сформируем строй и будем прорываться с боем."
 gold_fleet_shared_events.2.b: "Рассредоточим флот, чтобы попытаться спасти хотя бы часть кораблей."
 gold_fleet_shared_events.2.c: "Развернёмся и пойдём по ветру: всё или ничего."
 gold_fleet_shared_events.2.historical_info: "Наибольшую угрозу для флотов, перевозивших сокровища, представляли не отдельные каперы, а морские экспедиции, организованные враждебными державами. В 1628 году голландский адмирал Пит Хейн захватил у бухты Матансас на Кубе весь возвращавшийся в Испанию флот — это был единственный в истории случай полного захвата испанского флота с серебром. Когда в воды Карибского моря входили крупные флоты, охраняемые конвои, способные противостоять небольшим пиратским отрядам, могли оказаться бессильны против скоординированных действий флота."
 gold_fleet_shared_events.warship_fight_fail_tt: "Вражеская эскадра берёт верх в бою, и мы теряем три четверти груза"
 gold_fleet_shared_events.warship_flee_fail_tt: "Флот не успевает уйти от погони, и его настигает вражеская эскадра: половина груза потеряна"
 gold_fleet_shared_events.3.title: "Наш флот перехватывает конвой с сокровищами"
 gold_fleet_shared_events.3.desc: "Нам сообщили, что наша эскадра встретила в Карибском море вражеский флот, перевозивший сокровища, и вступила с ним с бой. В этом сражении сразу несколько наших капитанов показали себя с лучшей стороны. Скоро об этом узнает [ROOT.GetCapital.GetName], хотя счётные дома противника наверняка получат эту весть даже раньше.\n\nПеревозимое через эти воды #TOOLTIP:GOODS,silver,X #L серебро#!#! помогает финансировать вражеские армии и союзы, так что каждый захваченный нами груз — это средства, которые противник не сможет использовать против нас."
 gold_fleet_shared_events.3.a: "Наши капитаны достойно себя проявили. Вознаградим их."
 gold_fleet_shared_events.3.historical_info: "Новости о столкновении с флотом, перевозившим сокровища, нередко опережали сами участвовавшие в стычке корабли, поскольку их могли передать быстроходные посыльные суда. Перехват такого флота имел серьёзные дипломатические и финансовые последствия: захват даже части доставлявшегося серебра мог обеспечить эскадру средствами на долгие годы, тогда как потеря флота сказывалась на финансовой обеспеченности и авторитете пострадавшего от этого государства, а также его способности вести войны в Европе."
 gold_fleet_shared_events.4.title: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] поручает флоту забрать у нас груз"
 gold_fleet_shared_events.4.desc: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] обеспечивает прибытие своего флота в нашу гавань. Его представители уже хозяйничают на наших складах, подсчитывая то, что им причитается. Слитки #TOOLTIP:GOODS,silver,X #L серебра#!#!, монеты, шкуры и колониальные товары — всё это вывозится под охраной и грузится на корабли для отправки в Испанию.\n\nНаши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] также внимательно ведут подсчёты и с точностью до унции знают, сколько богатств сегодня покинет гавань. На их сбор ушли долгие месяцы, и [ROOT.GetCountry.GetName] будет ощущать эту потерю до урожая следующего сезона."
 gold_fleet_shared_events.4.a: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] получит то, что просит, но не более того."
 gold_fleet_shared_events.4.historical_info: "Колониальные порты находились в условиях навязанной торговой зависимости от метрополии. Вся торговля колоний должна была идти по путям, одобренным короной, а торговцы и креольская знать, добывавшие серебро, поставлявшие кожи и производившие красители, получали лишь малую долю прибыли. Основная же часть доходов доставалась короне и торговым домам Севильи — и это противоречие лишь нарастало по мере развития колониальной системы."
 gold_fleet_shared_events.5.title: "Море против нас"
 gold_fleet_shared_events.5.desc: "Небо к востоку от нас наливается багрово-синей тьмой, а волны становятся всё выше. На флот надвигается мощная буря, и теперь от неё уже не уйти. Ветер завывает в снастях; [target_leader.GetName] готовится отдать приказ, от которого зависит, сколько кораблей переживут бурю.\n\nМы можем сомкнуть строй и переждать бурю всем флотом, полагаясь на искусство моряков и немного — на удачу, либо же рассредоточить корабли и сбросить часть груза за борт, чтобы удержаться на плаву."
 gold_fleet_shared_events.5.a: "Сомкнём строй и вместе выйдем из бури."
 gold_fleet_shared_events.5.b: "Рассредоточим корабли и облегчим нагрузку."
 gold_fleet_shared_events.5.c: "Попытаемся бросить якорь в ближайшем дружественном порту и отремонтировать корабли."
 gold_fleet_shared_events.5.unscathed_tt: "Корабли выходят из бури, нисколько не пострадав"
 gold_fleet_shared_events.5.lose_fleet_tt: "Часть кораблей тонет; вместе с ними гибнет половина груза"
 gold_fleet_shared_events.5.lose_all_tt: "Все корабли со своими командами гибнут; путешествие заканчивается"
 gold_fleet_shared_events.5.lose_cargo_tt: "Груз выброшен за борт, чтобы облегчить корабли; часть содержимого трюмов потеряна"
 gold_fleet_shared_events.5.historical_info: "Атлантические ураганы были для флотов с сокровищами самым смертоносным врагом, подчас более страшным, чем самый отчаянный капер. В 1622 году флот Тьерра-Фирме потерял у архипелага Флорида-Кис восемь кораблей, в том числе #italic «Нуэстра Сеньора де Аточа»#!. Гружёный серебром корабль затонул, и обломки пролежали под водой три с половиной века, прежде чем их удалось поднять на поверхность. В 1715 году целый флот, возвращавшийся в Испанию, оказался выброшен ураганом на побережье Флориды; погибло около тысячи человек. Со временем капитаны начали опасаться сезона ураганов едва ли не больше, чем пиратов."
 gold_fleet_shared_events.6.title: "Лихорадка на нижних палубах"
 gold_fleet_shared_events.6.desc: "Жара под палубами становится почти невыносимой; вместе с ней на флот приходит болезнь. Ещё неделю назад эти люди стойко несли вахту, а сегодня лежат без сил в темноте, обливаясь потом. Корабельный врач почти бессилен: ему остаётся лишь считать слёгших и надеяться, что недуг минует остальных. Грязная вода, теснота и тяжёлый тропический воздух оказались для команды хуже любого капера.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как лучше бороться с лихорадкой, пока она не погубила людей окончательно."
 gold_fleet_shared_events.6.a: "Ляжем в дрейф и вынесем заболевших на берег, чтобы дождаться, пока болезнь пройдёт."
 gold_fleet_shared_events.6.b: "Нельзя упускать благоприятный сезон! Пусть команда трудится дальше."
 gold_fleet_shared_events.6.c: "Запасёмся свежей водой и пополним команду здоровыми людьми на берегу."
 gold_fleet_shared_events.6.historical_info: "На кораблях #italic Carrera de Indias#! (флотов Индий) болезни уносили куда больше жизней, чем бури или нападения морских разбойников. Долгие переходы, отсутствие свежей воды, питание засоленными припасами и теснота в трюмах становились причинами цинги, дизентерии и тифа, а тропические порты Карибского моря были настоящими рассадниками малярии и других смертельных лихорадок, которые за считанные недели могли почти полностью погубить команду. Флот, слишком долго задержавшийся в Индиях, рисковал вернуться домой с такой нехваткой людей, что некому было бы вести корабли, и капитанам приходилось выбирать между возможной гибелью в море и более медленной, но почти гарантированной смертью от болезни."
 gold_fleet_shared_events.7.title: "Болтовня в таверне"
 gold_fleet_shared_events.7.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'узнала', 'узнал' )], что один из офицеров флота, изрядно перебравший в портовой таверне, разболтал дату отплытия и маршрут домой, а заодно упомянул, какие сокровища лежат в наших трюмах. Колониальный порт — место, где не укрыться от чужих ушей: торговых агентов, контрабандистов и просто желающих продать подслушанные тайны любому каперу, у которого в кошельке водится звонкая монета.\n\nВылетевшие слова уже не поймать, однако от того, как мы поступим теперь, зависит, пойдут ли слухи дальше."
 gold_fleet_shared_events.7.a: "Показательно накажем его на палубе — [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] беспощадны к болтунам."
 gold_fleet_shared_events.7.b: "Перенесём день отплытия и изменим курс."
 gold_fleet_shared_events.7.c: "Распустим противоречащие слухи, чтобы сбить других с толку."
 gold_fleet_shared_events.7.rumours_worse_tt: "Ложные слухи лишь подогревают интерес, и разговоры о настоящем маршруте разносятся ещё дальше — опасность плавания возрастает (#G +1#! к уровню опасности)"
 gold_fleet_shared_events.7.rumours_better_tt: "Вражеские капитаны нападают на ложный след и гоняются за призраками — опасность плавания снижается (#R -1#! к уровню опасности)"
 gold_fleet_shared_events.7.historical_info: "Во всей Атлантике едва ли можно было найти более ценные сведения, чем план рейсов Серебряного флота. Каперы и адмиралтейства соперничающих держав держали сети осведомителей в карибских портах и в Севилье, а утечка даты отплытия или предполагаемого маршрута могла почти гарантировать успешный налёт. Испанская корона тщательно скрывала сведения о #italic flota#!, но флот, собирающийся в переполненном колониальном порту, не мог полностью сохранить свои секреты. Капитаны хорошо знали, какую опасность представляли неосторожные разговоры на берегу."
 gold_fleet_shared_events.cargo_loaded_tt: "Происходит погрузка добычи этого сезона в трюмы"
 gold_fleet_shared_events.cargo_gain_tt: "Ценность перевозимого флотом груза увеличивается"
 gold_fleet_shared_events.cargo_loss_tt: "Часть перевозимого флотом груза утеряна"
 gold_fleet_shared_events.danger_up_1_tt: "Опасность плавания возрастает (#G +1#! к уровню опасности)"
 gold_fleet_shared_events.danger_up_2_tt: "Опасность плавания возрастает (#G +2#! к уровню опасности)"
 gold_fleet_shared_events.danger_down_1_tt: "Опасность плавания снижается (#R -1#! к уровню опасности)"
 gold_fleet_shared_events.cargo_damaged_on_return_tt: "Доставленный груз отражает потери, понесённые ранее в пути"
