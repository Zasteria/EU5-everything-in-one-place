l_russian:
 court_favorite: "Придворный фаворит"
 desc_court_favorite: "Всецело обязанный нам своим положением и богатством, этот человек трудится не покладая рук, чтобы ещё больше укрепить нашу власть. Если [Concept('cabinet_member', 'член совета')|e] с этим [Concept('trait', 'свойством')|e] станет [Concept('head_of_the_cabinet', 'главой совета')|e], наша держава получит модификатор «[GetAutoModifier('court_favorite_head_of_cabinet').GetName]»."
 court_favorite_die_desc: "За своё положение и богатство [Select_CString(CHARACTER.IsFemale, 'эта женщина', 'этот человек' )] сполна [Select_CString(CHARACTER.IsFemale, 'отплатила', 'отплатил' )] абсолютной верностью. О [Select_CString(CHARACTER.IsFemale, 'ней', 'нём' )] будут скорбеть все сословия."
