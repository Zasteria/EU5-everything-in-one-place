l_russian:
 flavor_gra.7.entry: "$flavor_gra.7.title$"
 flavor_gra.7.title: "Освобождение [ShowLocationNameWithNoTooltip('cordoba')]"
 flavor_gra.7.desc: "[target_location.GetRank.GetName] [target_location.GetName] освобождён(а) во имя [ROOT.GetCountry.GetReligion.GetGodName]. Некогда важное место для $ADU$, теперь это земля, [ROOT.GetCountry.GetReligion.GetAdjective] влияние которой [target_character.GetName] и [ROOT.GetCountry.GetGovernment.GetCourtTitle] желают восстановить."
 flavor_gra.7.a: "Нам следует поддерживать его [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] прошлое."
 gra_convert_cordoba_to_root_religion: "Часть [pops|e] в [target_location.GetName] обращается в [ROOT.GetCountry.GetReligion.GetName]"
 gra_cordoba_province_gains_core: "Каждый [location|e] в [target_location.GetProvinceDefinition.GetName] ([province|e]) становится [core|e] [ROOT.GetCountry.GetName]"
 flavor_gra.7.b: "Вместо того чтобы насильно обращать кого-либо в иную веру, лучше принять и включить их в наше общество."
 flavor_gra.8.entry: "$flavor_gra.8.title$"
 flavor_gra.8.title: "Жемчужина региона [ShowRegionNameWithNoTooltip('iberia_region')]"
 flavor_gra.8.desc: "В центре [ShowRegionName('iberia_region')] находится [target_location.GetRank.GetName], издавна служивший средоточием [ShowReligionGroupAdjective('christian')], [ShowReligionGroupAdjective('muslim')] и [ShowReligionAdjective('judaism')] культур. Теперь он под нашей властью, и [ROOT.GetCountry.GetRank.GetName] сможет решить его судьбу.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle], как и [target_character.GetName], желает, чтобы этот [target_location.GetRank.GetNameWithNoTooltip] достиг ещё больших высот. Усилия всех сословий были вложены в то, чтобы превратить [target_location.GetName] в жемчужину [ShowRegionNameWithNoTooltip('iberia_region')]."
 flavor_gra.8.a: "Пусть [ShowLocationNameWithNoTooltip('toledo')] процветает!"
 flavor_gra.17.entry: "$flavor_gra.17.title$"
 flavor_gra.17.title: "Столица старого халифата"
 flavor_gra.17.desc: "Престол [ShowLocationName('cordoba')] издавна играл важную роль для [ROOT.GetCountry.GetName]. Некогда это был процветающий [ShowLocationRankName('city')] и столица региона [ShowRegionName('iberia_region')]; но теперь его улицы полны преступности, его жители проклинают упадок, постигший это место, а многие древние памятники так и остались в руинах после наших столкновений с [ShowReligionGroupAdjective('christian')] правителями.\n\n[target_character.GetName] не из тех, кто позволит этому запустению продолжаться. Когда-то это было славное место, где правили самые могущественные фигуры [ShowContinentName('europe')], так почему бы [target_character.GetSheHe] не превратить его вновь в величайшую столицу, какую только видел мир?"
 flavor_gra.17.a: "[ShowLocationNameWithNoTooltip('cordoba')] вновь будет процветать!"
 flavor_gra.17.b: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] должен остаться там, где он есть."
 flavor_gra.21.entry: "$flavor_gra.21.title$"
 flavor_gra.21.title: "Дворец-[ShowLocationRankNameWithNoTooltip('city')] города [ShowLocationNameWithNoTooltip('cordoba')]"
 flavor_gra.21.desc: "Фитна XI века ввергла [ShowReligionGroupAdjective('muslim')] часть региона [ShowRegionName('iberia_region')] в хаос, а вместе с ней пришли в упадок и многие значимые места. Одним из них был [ShowBuildingTypeName('madinat_al_zahra')] — великий дворец, раскинувшийся на западных окраинах [ShowLocationName('cordoba')]. Заполненный роскошными мечетями, пышными садами и хорошо укреплёнными казармами, он служил символом превосходства $rank_empire_muslim_ruler_male$ над остальным [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] миром.\n\n[target_character.GetName] желает восстановить этот [ShowLocationRankName('city')], вознеся [target_character.GetHerselfHimself] над прочими правителями и претендентами, что могли бы бросить вызов [target_character.GetHerHim]."
 flavor_gra.21.a: "Они увидят наше величие!"
 flavor_gra.21.b: "Нет нужды восстанавливать старые руины."
 flavor_gra.22.entry: "$flavor_gra.22.title$"
 flavor_gra.22.title: "[ShowBuildingTypeNameWithNoTooltip('library_cordoba')]"
 flavor_gra.22.desc: "Благодаря восстановлению [ShowBuildingTypeName('library_cordoba')] жители [ShowLocationName('cordoba')] переживают новую эпоху литературного процветания.\n\nКак и в былые времена, учёные со всего [ShowReligionGroupAdjective('muslim')] мира посещают [ShowLocationNameWithNoTooltip('cordoba')] ради богатейшего собрания книг по литературе, науке и богословию. Это, в свою очередь, принесло процветание горожанам, которые узнают о далёких культурах и перенимают многие их обычаи в повседневной жизни."
 flavor_gra.22.a: "Жителей [ShowLocationNameWithNoTooltip('cordoba')] ждёт подлинное процветание!"
 add_pop_satisfaction_based_on_literacy: "Каждая [pop|e] в [location|e] получит [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] к [pop_satisfaction|e], зависящее от уровня [pop] [literacy|e]"
 flavor_gra.23.entry: "$flavor_gra.23.title$"
 flavor_gra.23.title: "Пристанище знаний для всех"
 flavor_gra.23.desc: "Наша либеральная и новаторская политика позволила [ROOT.GetCountry.GetName] стать пристанищем знаний и мудрости. Высоко оценённые чужеземными правителями, наши успехи в науках теперь ясно видны: всё больше гостей стекаются учиться в наших прославленных университетах.\n\nСам [ROOT.GetCountry.GetGovernment.GetCourtTitle] теперь пополняется всё более образованными людьми, желающими расширить эту учёность, устранив излишние ограничения внутри самой системы образования."
 flavor_gra.23.a: "Вот он, наш прогресс!"
 flavor_gra.24.title: "Оплот [ShowReligionGroupNameWithNoTooltip('muslim')]"
 flavor_gra.24.desc: "Весть о нашей победе в битве за [ShowRegionName('iberia_region')] разнеслась по всему [ShowReligionGroupAdjective('muslim')] миру — это огромное достижение для нашего дальнейшего выживания перед лицом любой надвигающейся бури. [target_character.GetName] теперь прославляют в [ROOT.GetCountry.GetName] как героя, защитника и щит против врагов, желающих погасить наше пламя."
 flavor_gra.24.a: "Возрадуемся же."
 conquest_of_andalusi_integration_tt: "Завоевание [locations|e] с [ShowCultureName('andalusi')] [pops|e] даёт прогресс [integration|e] в зависимости от присутствия этой [culture|e]"
