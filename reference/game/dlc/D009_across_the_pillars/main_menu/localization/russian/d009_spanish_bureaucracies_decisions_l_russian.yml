l_russian:
 spa_seize_control_of_the_orders.title: "Присвоение владений орденов"
 spa_seize_control_of_the_orders.desc: "Религиозные ордены #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! сыграли важную роль в борьбе с мусульманской угрозой и возвращении полуострова под наш контроль. Однако поскольку цели #italic Реконкисты#! уже достигнуты, нам следует подчинить эти ордены государству и реформировать их, позволив вчерашним рыцарям взять на себя роль чиновников и управленцев, которые так нужны растущей державе."
 spa_seize_control_of_the_orders.a: "Их земли принадлежат государству!"
 spa_seize_control_of_the_orders.a.entry: "Передать магистерства под власть $crown_estate$."
 establish_council_of_military_orders_tt: "Открывает бюрократический механизм «[ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')]»"
 established_council_of_military_orders_tt: "Мы основали [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')|l] с помощью решения «$spa_seize_control_of_the_orders.title$»."
 spa_council_of_crusade_decision.title: "Основать $spa_council_of_crusade_bureaucracy$"
 spa_council_of_crusade_decision.desc: "Защита нашей веры требует благословения со стороны высших церковных властей, даже когда речь идёт о борьбе на чужой земле. Получив одобрение [Concept('pope', 'папы')], мы превратим нашу державу в главный оплот #L [ShowReligionAdjective('catholic')|l]ой#! веры!"
 spa_council_of_crusade_decision.a: "Запросить одобрение у папы."
 establish_council_of_crusade_tt: "Открывает бюрократический механизм «[ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')]»"
 established_council_of_crusade_tt: "Мы основали [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')|l] с помощью решения «$spa_council_of_crusade_decision.title$»."
