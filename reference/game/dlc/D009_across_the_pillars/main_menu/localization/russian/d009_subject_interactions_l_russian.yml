l_russian:
 taifa: "Тайфа"
 taifa_desc: "После падения Кордовского халифата Аль-Андалус распался на множество небольших эмиратов — #italic тайф#!, каждый со своим двором и правителем. Тайфы славились своей учёностью и культурой, но при этом постоянно враждовали друг с другом и потому не могли поодиночке противостоять христианским державам севера. Сегодня, оказавшись под властью одной из возродившихся иберийских держав, тайфы сохраняют самобытность, оставаясь при этом подчинёнными государю."
 LEAD_taifa: "$LIST$ — [SUBJECT_TYPE.GetName|l]"
 AM_taifa: "[SUBJECT_TYPE.GetName] державы $LIST$."
 OFFER_taifa_TOOLTIP_HEADER: "Просьба к #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_DAT')|L]$tt_cl_2$ стать тайфой"
 OFFER_taifa_TOOLTIP_HEADER_NO_TARGET: "Просьба к [Concept('country', 'державе')|e] стать тайфой"
 REQUEST_taifa_TOOLTIP_HEADER: "Предложение к #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_DAT')|L]$tt_cl_2$ сделать нас тайфой"
 REQUEST_taifa_TOOLTIP_HEADER_NO_TARGET: "Предложение к [Concept('country', 'державе')|e] сделать нас тайфой"
 CANCEL_taifa_TOOLTIP_HEADER: "Отмена статуса тайфы #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_GEN')|L]$tt_cl_2$"
 CANCEL_taifa_TOOLTIP_HEADER_NO_TARGET: "Отмена статуса тайфы [Concept('country', 'державы')|e]"
 BREAK_taifa_TOOLTIP_HEADER: "Отказ быть тайфой #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_GEN')|L]#!#!"
 BREAK_taifa_TOOLTIP_HEADER_NO_TARGET: "Отказ быть тайфой [Concept('country', 'державы')|e]"
 OFFER_taifaTITLE: "Просьба к державе стать нашей тайфой"
 OFFER_taifa_FLAVOR: "Выберите, какой [Concept('country', 'державе')|e] предложить статус #TOOLTIP:SUBJECT_TYPE,taifa,X #L тайфы#!#!"
 REQUEST_taifaTITLE: "Предложение стать тайфой державы"
 REQUEST_taifa_FLAVOR: "Выберите, #TOOLTIP:SUBJECT_TYPE,taifa,X #L тайфой#!#! какой [Concept('country', 'державы')|e] хотите стать"
 CANCEL_taifaTITLE: "Отмена статуса тайфы"
 CANCEL_taifa_FLAVOR: "Выберите, какую [Concept('country', 'державу')|e] лишить статуса #TOOLTIP:SUBJECT_TYPE,taifa,X #L тайфы#!#!"
 BREAK_taifaTITLE: "Отмена статуса тайфы"
 OFFER_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 REQUEST_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 CANCEL_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 BREAK_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 OFFER_taifa_NEWDESC: "Попросить, чтобы [COUNTRY.GetName] стал[COUNTRY.Custom('end_fem')] нашей тайфой?"
 REQUEST_taifa_NEWDESC: "Предложить #ONCLICK:COUNTRY,[COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[COUNTRY.Custom('CL_tt')],X [COUNTRY.Custom('CL_DAT')|L]$tt_cl_2$ сделать нас своей тайфой?"
 CANCEL_taifa_NEWDESC: "Отменить статус тайфы #ONCLICK:COUNTRY,[COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[COUNTRY.Custom('CL_tt')],X [COUNTRY.Custom('CL_GEN')|L]#!#!?"
 BREAK_taifa_NEWDESC: "Прекратить быть тайфой #ONCLICK:COUNTRY,[COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[COUNTRY.Custom('CL_tt')],X [COUNTRY.Custom('CL_GEN')|L]#!#!?\nТакой шаг испортит отношения и даст этой державе [Concept('casus_belli', 'повод для войны')|e] с нами!"
 OFFER_taifa_DESC: "Мы попросим державу стать нашей тайфой в обмен на защиту."
