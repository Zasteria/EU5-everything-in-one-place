l_russian:
 gold_fleet_tierra_firme_events.1.title: "Курс на Тьерра-Фирме"
 gold_fleet_tierra_firme_events.1.desc_prefix: "Флот снаряжён и готов к отплытию. Отправной точкой станет [departure_port.GetName]. Суда снабжены запасами воды и провизии, а также железом и ртутью, которыми колонии не могут обеспечить себя собственными силами. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] дают наставления. Следить за выполнением приказов будет [target_leader.GetName].\n\nСезон благоприятен, а ветер обещает быть попутным. Где-то за много морских миль отсюда #TOOLTIP:GOODS,silver,X #L серебро#!#!"
 gold_fleet_tierra_firme_events.1.desc_suffix: "непрерывным потоком спускается с гор на побережье, откуда флот повезёт его на родину. Нельзя терять ни минуты: чтобы вернуться домой, в порт [departure_port.GetName], поднимать паруса на галеонах надо уже сейчас."
 gold_fleet_tierra_firme_events.1.desc: "$gold_fleet_tierra_firme_events.1.desc_prefix$ Индий $gold_fleet_tierra_firme_events.1.desc_suffix$"
 gold_fleet_tierra_firme_events.1.desc.rich: "$gold_fleet_tierra_firme_events.1.desc_prefix$ из местности, что зовётся [silver_source.GetName], $gold_fleet_tierra_firme_events.1.desc_suffix$"
 gold_fleet_tierra_firme_events.1.a: "Отчаливаем. Галеоны должны отплыть с утренним отливом."
 gold_fleet_tierra_firme_events.1.historical_info: "#italic Галеоны Тьерра-Фирме#! являлись одним из двух конвоев испанского #italic Серебряного флота#!. На флот Тьерра-Фирме была возложена задача обеспечивать торговлю с вице-королевствами Южной Америки. Его корабли вывозили серебро, добытое в рудниках Потоси в Верхнем Перу, а также другие колониальные товары через порты Портобело и Картахены. Серебро доставляли через Панамский перешеек по суше с тихоокеанского побережья и лишь затем грузили на галеоны. Филипп II закрепил систему конвоев в 1566 году, велев перевозить все грузы в составе вооружённых эскадр. Колониальные товары ввозились через Севилью, при этом #italic Каса-де-Контратасьон#! взимала в пользу государства #italic quinto real#! — пятую часть всех драгоценных металлов, добытых в Новом Свете."
 gold_fleet_tierra_firme_events.2.title: "Серебро Новой Гранады"
 gold_fleet_tierra_firme_events.2.desc_prefix: "Мы бросили якорь. [loot_port.GetName|U] — надёжное убежище: мы укрылись в бухте, и за местными стенами нам ничего не грозит. На складах вдоль набережной — плоды целого года труда в рудниках: слитки #TOOLTIP:GOODS,silver,X #L серебра#!#!"
 gold_fleet_tierra_firme_events.2.desc_middle: "сундуки с монетами, тюки кож, бочки с индиго и кое-где — тщательно охраняемые ящики с #TOOLTIP:GOODS,gems,X #L драгоценными камнями#!#!"
 gold_fleet_tierra_firme_events.2.desc_suffix: "В трюмах ещё есть свободное место, а из глубин материка продолжает поступать серебро. Можно дождаться всего каравана и загрузить корабли до отказа либо же забрать уже имеющееся и отплыть до наступления сезона ураганов."
 gold_fleet_tierra_firme_events.2.desc: "$gold_fleet_tierra_firme_events.2.desc_prefix$, $gold_fleet_tierra_firme_events.2.desc_middle$.\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
 gold_fleet_tierra_firme_events.2.desc.rich: "$gold_fleet_tierra_firme_events.2.desc_prefix$ из шахт в местности [silver_source.GetName], $gold_fleet_tierra_firme_events.2.desc_middle$, которыми славится [gem_source.GetName].\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
 gold_fleet_tierra_firme_events.2.a: "Дождёмся всего каравана и заполним каждый трюм."
 gold_fleet_tierra_firme_events.2.b: "Возьмём только то, что уже собрано."
 gold_fleet_tierra_firme_events.2.c: "Риск слишком велик. Вернёмся домой с тем, что уже есть."
 gold_fleet_tierra_firme_events.2.historical_info: "Основанная в 1533 году Картахена-де-Индиас стала главным карибским портом, куда свозили серебро из Южной Америки. Серебро с рудников Потоси в Верхнем Перу — крупнейшего в мире месторождения серебра в период его расцвета — доставляли к тихоокеанскому порту Кальяо. Оттуда его морем везли на север, в Панаму, а затем на мулах переправляли через перешеек к Портобело. Там, во время грандиозной ярмарки, серебро грузили на галеоны Тьерра-Фирме. Благодаря такому потоку богатств Картахена стала одним из самых укреплённых городов Америки, но одновременно с этим — желанной добычей для каперов, в том числе для знаменитого сэра Фрэнсиса Дрейка: в 1586 году он разграбил город."
 gold_fleet_tierra_firme_events.3.title: "$gold_fleet_nueva_espana_events.3.title$"
 gold_fleet_tierra_firme_events.3.desc.together: "Флот прибыл в порт [rendezvous_port.GetName], где на якоре под защитой крепостных орудий уже стоит #italic flota#! из Новой Испании. Его трюмы столь же полны #TOOLTIP:GOODS,silver,X #L серебра#!#!, как и наши. Отсюда все корабли вместе пойдут через Атлантику: сначала — на север по Гольфстриму, а затем повернут на восток, вдоль побережья Флориды.\n\nНам сообщили, что на пути в Испанию уже поджидают вражеские корабли, однако такой огромный караван — непростая добыча. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как именно объединённому флоту лучше будет встретить угрозу."
 gold_fleet_tierra_firme_events.3.desc.alone: "Флот прибыл в порт [rendezvous_port.GetName] и встал на стоянку под защитой крепостных орудий. #italic Flota#! из Новой Испании не будет нас сопровождать — пересекать Атлантику придётся в одиночестве. Сначала мы пойдём на север по Гольфстриму, а затем повернём на восток, вдоль побережья Флориды.\n\nНам сообщили, что на пути в Испанию уже поджидают вражеские корабли, и одинокий караван — лакомая добыча. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как именно лучше будет встретить угрозу."
 gold_fleet_tierra_firme_events.3.a: "$gold_fleet_nueva_espana_events.3.a$"
 gold_fleet_tierra_firme_events.3.b: "$gold_fleet_nueva_espana_events.3.b$"
 gold_fleet_tierra_firme_events.3.c: "$gold_fleet_nueva_espana_events.3.c$"
 gold_fleet_tierra_firme_events.3.historical_info: "После того как Филипп II в 1566 году официально закрепил систему конвоев, Гавана стала обязательным пунктом сбора флотов, возвращавшихся с сокровищами. Глубокая естественная гавань и выгодное положение у Флоридского пролива сделали город удобным местом встречи для галеонов Тьерра-Фирме и Флота Новой Испании. В 1589 году в Гаване началось строительство крепости Кастильо-де-лос-Трес-Рейес-дель-Морро — бастиона для защиты от каперов. Серебряный флот выходил из порта с учётом погоды: слишком поздний выход грозил попаданием в сезон ураганов, слишком ранний — столкновением с неблагоприятными ветрами."
 gold_fleet_tierra_firme_events.8.title: "Ожидание флота из Новой Испании"
 gold_fleet_tierra_firme_events.8.desc: "Корабли прибыли в порт [rendezvous_port.GetName], однако #italic flota#! из Новой Испании ещё в пути. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] отдали предельно ясный приказ: флоты с сокровищами должны пересечь Атлантику единым строем, чтобы бортовым залпом охладить пыл любого капера, ищущего лёгкой добычи во Флоридском проливе.\n\nПоэтому мы останемся на якоре под защитой крепости и будем ждать товарищей, надеясь, что долго ожидать не придётся."
 gold_fleet_tierra_firme_events.8.a: "$gold_fleet_nueva_espana_events.8.a$"
 gold_fleet_tierra_firme_events.8.historical_info: "$gold_fleet_nueva_espana_events.8.historical_info$"
 gold_fleet_tierra_firme_events.awaiting_fleet_tt: "Флот будет оставаться на якоре до прибытия Флота Новой Испании, сколько бы времени это ни заняло"
 gold_fleet_tierra_firme_events.9.title: "$gold_fleet_nueva_espana_events.9.title$"
 gold_fleet_tierra_firme_events.9.desc: "С тех пор, как мы бросили якорь в порту [rendezvous_port.GetName], прошло несколько недель, а #italic flota#! из Новой Испании всё ещё задерживается. Провизия подходит к концу, команды начинают роптать, а каждый день, проведённый на якоре, — это день, приближающий сезон капризной погоды.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить: продолжать ли ждать флот из Новой Испании или же рискнуть выйти в Атлантику без него."
 gold_fleet_tierra_firme_events.9.a: "$gold_fleet_nueva_espana_events.9.a$"
 gold_fleet_tierra_firme_events.9.b: "$gold_fleet_nueva_espana_events.9.b$"
 gold_fleet_tierra_firme_events.9.historical_info: "$gold_fleet_nueva_espana_events.9.historical_info$"
 gold_fleet_tierra_firme_events.10.title: "$gold_fleet_nueva_espana_events.10.title$"
 gold_fleet_tierra_firme_events.10.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'узнала', 'узнал' )], что определённую долю сокровищ можно забрать и в порту [secondary_port.GetName]: через его склады проходит #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, доставляемое впоследствии через перешеек. Можно отправить туда эскадру, однако разделять флот в этих водах — немалый риск.\n\nМы можем задержаться в порту [loot_port.GetNameWithNoTooltip], пока эскадра не вернётся, или же продолжить путь; тогда местом нашей встречи станет [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_tierra_firme_events.10.a: "$gold_fleet_nueva_espana_events.10.a$"
 gold_fleet_tierra_firme_events.10.b: "$gold_fleet_nueva_espana_events.10.b$"
 gold_fleet_tierra_firme_events.10.c: "$gold_fleet_nueva_espana_events.10.c$"
 gold_fleet_tierra_firme_events.10.historical_info: "$gold_fleet_nueva_espana_events.10.historical_info$"
 gold_fleet_tierra_firme_events.10.danger_tt: "$gold_fleet_nueva_espana_events.10.danger_tt$"
 gold_fleet_tierra_firme_events.havana_together_danger_tt: "Объединение с флотом Новой Испании $gold_fleet_nueva_espana_events.together_danger_suffix$"
 gold_fleet_tierra_firme_events.11.title: "Возвращение эскадры"
 gold_fleet_tierra_firme_events.11.desc: "[loot_port.GetName] встречает эскадру, отправленную в порт [secondary_port.GetName]. Трюмы кораблей забиты сокровищами: #TOOLTIP:GOODS,goods_gold,X #L золотом#!#!, #TOOLTIP:GOODS,gems,X #L драгоценными камнями#!#! и шкурами. Разрозненные корабли воссоединились, и теперь плавание будет менее опасным."
 gold_fleet_tierra_firme_events.11.a: "$gold_fleet_nueva_espana_events.11.a$"
 gold_fleet_tierra_firme_events.11.historical_info: "$gold_fleet_nueva_espana_events.11.historical_info$"
 gold_fleet_tierra_firme_events.12.title: "Воссоединение около Кубы"
 gold_fleet_tierra_firme_events.12.desc: "[rendezvous_port.GetNameWithNoTooltip] готовится встречать объединённый флот: эскадра, вышедшая из порта [secondary_port.GetName], нагнала остальные корабли. В её трюмах — добыча этого сезона: #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, #TOOLTIP:GOODS,gems,X #L драгоценные камни#!#! и шкуры."
 gold_fleet_tierra_firme_events.12.a: "$gold_fleet_nueva_espana_events.12.a$"
 gold_fleet_tierra_firme_events.12.historical_info: "$gold_fleet_nueva_espana_events.12.historical_info$"
 gold_fleet_tierra_firme_events.14.title: "Партия изумрудов"
 gold_fleet_tierra_firme_events.14.desc: "У причала бросил якорь охраняемый караван, прибывший сюда из порта [gem_source.GetName]. Под защитой десятков пушек он доставил сюда настоящее состояние — #TOOLTIP:GOODS,gems,X #L драгоценные камни#!#!, необработанные изумруды высочайшего качества, которые стоят больше, чем какой-либо другой груз в наших трюмах. Торговые агенты предлагают нам взять их с собой на родину: прибыль обещает быть огромной.\n\nОднако именно такой груз особенно привлекает каперов, а скорости, с которой распространяются вести о нём, позавидует самый быстроходный корабль. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, стоят ли эти богатства той опасности, которую они могут навлечь."
 gold_fleet_tierra_firme_events.14.a: "Загрузим изумруды в трюм. Такое богатство выпадает редко."
 gold_fleet_tierra_firme_events.14.b: "Оставим их здесь. Наши трюмы и так забиты доверху."
 gold_fleet_tierra_firme_events.14.decline_tt: "Изумруды остаются на берегу до прибытия следующего флота, а наш не привлекает к себе лишнего внимания"
 gold_fleet_tierra_firme_events.14.historical_info: "Изумрудные рудники Мусо и Сомондоко в Новой Гранаде считались богатейшими в мире, а колумбийские изумруды — одним из самых желанных предметов роскоши своего времени: их одинаково ценили европейские монархи, индийские Моголы и персидские Сефевиды. Небольшие, но поразительно красивые камни стоили целое состояние: охрана одной партии груза могла обойтись в цену нескольких тонн серебра. Столь высокая ценность делала их лакомой добычей для воров и каперов, поэтому корона следила за перевозкой изумрудов не менее тщательно, чем за перевозками золота и серебра."
 gold_fleet_tierra_firme_events.15.title: "Мулы на перешейке"
 gold_fleet_tierra_firme_events.15.desc: "Последний в этом сезоне #italic рекуа#! — длинный караван мулов, везущих #TOOLTIP:GOODS,silver,X #L серебро#!#! с Тихоокеанского побережья, — пока ещё в пути. Вьючные животные смирно несут ценный груз через Панамский перешеек, где свирепствует лихорадка, к берегу. До нас дошли вести, что следом за караваном движутся #italic симарроны#! — беглые рабы, скрывающиеся в джунглях и намеревающиеся разграбить серебро прежде, чем оно дойдёт до нас.\n\nГруз ещё может дойти в целости и сохранности — если мы позаботимся о том, чтобы караван благополучно добрался до воды."
 gold_fleet_tierra_firme_events.15.a: "Пошлём вооружённую охрану, чтобы она защитила груз."
 gold_fleet_tierra_firme_events.15.b: "Нам некогда ждать. Заберём то, что нам сумеют привезти."
 gold_fleet_tierra_firme_events.15.historical_info: "Серебро из Перу попадало на Карибы долгим и трудным путём: его перевозили по суше, через Панамский перешеек. Серебряные слитки везли на #italic рекуас#! — караванах мулов, которые доставляли груз из Панамы, что на Тихоокеанском побережье, в Номбре-де-Диос, а впоследствии — в Портобело на берегу Атлантики. На тропах и в джунглях промышляли #italic симарроны#! — беглые рабы, скрывавшиеся в укромных местах перешейка и жившие общинами. В 1573 году Фрэнсис Дрейк заключил с ними союз, устроил засаду на перевозящий серебро караван и захватил огромную добычу. Охрана пути через перешеек была для испанской короны постоянной и дорогостоящей проблемой."
 gold_fleet_tierra_firme_events.16.title: "Жемчужный берег"
 gold_fleet_tierra_firme_events.16.desc: "К борту корабля пристаёт лодка. [pearl_source.GetName] везёт нам новости: сезонный улов #TOOLTIP:GOODS,pearls,X #L жемчуга#!#! уже готов. Жемчужины — желанная добыча: они почти не занимают места в трюме, но стоят целое состояние. Стоит лишь ненадолго свернуть к востоку и пройти вдоль побережья, чтобы забрать их.\n\nОднако путь будет опасен: прибрежные воды нешироки, мелки, и в них промышляют каперы. Стоит флоту отклониться от курса — и неприятности не заставят себя ждать. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, стоит ли добыча такого риска."
 gold_fleet_tierra_firme_events.16.a: "Возьмём курс на поселение [pearl_source.GetNameWithNoTooltip] и примем жемчуг на борт."
 gold_fleet_tierra_firme_events.16.b: "Пойдём прежним курсом. Пусть жемчуг заберёт другой флот."
 gold_fleet_tierra_firme_events.16.decline_tt: "Флот не отклоняется от курса и проходит мимо Жемчужного берега, не привлекая к себе лишнего внимания"
 gold_fleet_tierra_firme_events.16.historical_info: "Жемчужные промыслы в южной части Карибского моря — у островов Кубагуа и Маргарита, а также в районе Рио-де-ла-Ача — стали одними из первых источников богатства, освоенных Испанией в Новом Свете. Жемчуг добывали рабы-ныряльщики, работавшие в невыносимых условиях до тех пор, пока месторождения не истощались. Небольшие и лёгкие жемчужины приносили испанской короне огромный доход: всего несколько сундуков стоили целое состояние. Партии жемчуга регулярно отправляли домой на кораблях, перевозивших золото и серебро."
 gold_fleet_tierra_firme_events.17.title: "Переправа для слуг короны"
 gold_fleet_tierra_firme_events.17.desc: "На флот передали письмо из колонии [colony_source.GetName]: королевские чиновники и их семьи не могут уехать и ждут любой возможности вернуться в Испанию. Несомненно, [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] оценят наши заслуги по достоинству, если мы доставим этих людей домой в целости и сохранности, однако ради этого флоту придётся какое-то время простоять на якоре, пока сами чиновники не взойдут на борт, а их пожитки не будут погружены в трюмы.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, можем ли мы позволить себе такую задержку."
 gold_fleet_tierra_firme_events.17.a: "Мы подождём чиновников. Благосклонность короны того стоит."
 gold_fleet_tierra_firme_events.17.b: "Каждый день дорог. Пусть ждут другого корабля."
 gold_fleet_tierra_firme_events.17.decline_tt: "Чиновникам приходится ждать другого корабля, и флот выходит точно по графику"
 gold_fleet_tierra_firme_events.17.historical_info: "Колониальные чиновники, духовенство и члены их семей, желавшие вернуться из Нового Света в Испанию, могли попросить о месте на любом корабле Серебряного флота — Каса-де-Контратасьон считала, что капитаны обязаны не только перевозить серебро, но и способствовать возвращению слуг короны на родину. Капитан, отказавший таким пассажирам, сильно рисковал: на него могли подать жалобу в Совет по делам Индий. Но каждый день, потраченный на погрузку пассажиров и багажа, отнимал драгоценное время: флоты спешили покинуть Карибское море до наступления сезона ураганов."
