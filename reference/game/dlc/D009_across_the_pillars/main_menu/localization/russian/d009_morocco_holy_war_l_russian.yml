l_russian:
 summon_volunteers_of_the_faith: "Призвать благочестивых добровольцев"
 summon_volunteers_of_the_faith_desc: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Исламские#!#! племена получают призыв отправить святых воинов в [Concept('jihad', 'джихад')|e]. Одно из берберских племён выставит полк наёмников, действующий по собственной воинской традиции: это могут быть быстрые всадники, пехотинцы либо же сбалансированное войско. При этом будет увеличено религиозное рвение [Concept('jihad', 'джихада')]. Держава, обеспечившая себе регулярный корпус святых воинов либо же получившая воинов-добровольцев от своих сословий, выставит более сильное войско. За один раз каждое племя может ответить только единожды. После роспуска полка призыв можно будет издать повторно."
 summon_volunteers_of_the_faith_effect_tt: "Будет созван племенной полк наёмников, действующий по собственной воинской традиции. #Y Религиозное рвение#! [Concept('jihad', 'джихада')|e] увеличится на #G 5#!. Полк будет крупнее и вооружён лучше, если действует [Concept('bureaucracy', 'бюрократический механизм')|e] «[ShowBureaucracyTypeName('ghuzat_mujahidin_bureaucracy')]»."
 summon_volunteers_cavalry_tier2_tt: "Собирается 10 полков лёгкой кавалерии, 4 полка лёгкой пехоты и 2 полка тяжёлой кавалерии"
 summon_volunteers_cavalry_tier1_tt: "Собирается 8 полков лёгкой кавалерии и 4 полка лёгкой пехоты"
 summon_volunteers_cavalry_tier0_tt: "Собирается 6 полков лёгкой кавалерии и 3 полка лёгкой пехоты"
 summon_volunteers_infantry_tier2_tt: "Собирается 8 полков тяжёлой пехоты, 4 полка лёгкой пехоты и 1 полк тяжёлой кавалерии"
 summon_volunteers_infantry_tier1_tt: "Собирается 6 полков тяжёлой пехоты и 4 полка лёгкой пехоты"
 summon_volunteers_infantry_tier0_tt: "Собирается 4 полка тяжёлой пехоты и 4 полка лёгкой пехоты"
 summon_volunteers_mixed_tier2_tt: "Собирается 7 полков лёгкой кавалерии, 5 полков лёгкой пехоты и 2 полка тяжёлой пехоты"
 summon_volunteers_mixed_tier1_tt: "Собирается 6 полков лёгкой кавалерии и 5 полков лёгкой пехоты"
 summon_volunteers_mixed_tier0_tt: "Собирается 4 полка лёгкой кавалерии и 4 полка лёгкой пехоты"
 choose_tribe_for_volunteers: "Выбрать племя"
 summon_volunteers_no_tribes: "@trigger_no! Ни одно из племён не может откликнуться на призыв."
 ghuzat_regiment_name: "Благочестивые добровольцы"
 summon_volunteers_bureaucracy_bonus_tt: "Наши отряды отважных и умелых воинов, добровольцев-гази, пополняют войска."
 proclaim_the_ghazw: "Объявить газават"
 proclaim_the_ghazw_desc: "Провозгласить налёт через пролив на одну из пограничных провинций врага-#TOOLTIP:RELIGIONGROUP,christian,X #L христианина#!#!. Каждый незащищённый район, где нет ни форта, ни армии, будет разграблен и потеряет в богатстве. Его владыка будет вынужден собрать против нас войско."
 proclaim_the_ghazw_tt: "Религиозное рвение [Concept('jihad', 'джихада')|e] уменьшается на #R 10#!. Подготовка сдвигается назад на #R 10#!"
 proclaim_the_ghazw_loot_tt: "Каждый незащищённый район в провинции, в котором нет крепости и армии, подвергается грабежу; добыча составит около [actor.MakeScope.ScriptValue('ghazw_estimated_total')|0+=][gold_i]. Снижается уровень развития районов"
 choose_province_for_ghazw: "Выбрать провинцию для набега"
 proclaim_the_ghazw_no_provinces: "@trigger_no! У врага нет незащищённых приграничных провинций, на которые можно было бы устроить набег."
 cross_the_strait: "Покорение морей"
 cross_the_strait_desc: "Нанять флот транспортных кораблей в одном из наших портов, чтобы армии Магриба смогли переправиться через #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гибралтарский пролив#!#! в Аль-Андалус. Нанятые корабли смогут перевезти около четверти наших войск. Переправу можно будет повторить в любой момент, пока идёт священная война."
 cross_the_strait_effect_tt: "Будут наняты транспортные корабли, способные за [Concept('gold', 'дукаты')|e] перевезти около четверти наших войск (стоимость растёт в зависимости от размера флота). Будет потрачено #R 10#! ед. религиозного рвения [Concept('jihad', 'джихада')|e]"
 cross_the_strait_fleet_name: "Флот пролива"
 cross_the_strait_hire_tt: "Нанимает флот для переброски наших войск через пролив"
 choose_port_for_crossing: "Выбрать порт"
 cross_the_strait_no_ports: "@trigger_no! У нас нет ни одного порта, подходящего для переброски войск."
 raid_the_shores: "Набег на побережье"
 raid_the_shores_desc: "Устроить налёт корсаров на побережье какой-либо провинции нашего врага-#TOOLTIP:RELIGIONGROUP,christian,X #L христианина#!#!, где уже действует капер. Каждый незащищённый прибрежный район, где нет ни форта, ни армии, будет разграблен, а один из 100 крестьян-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиков#!#! будет угнан в рабство в нашу столицу."
 raid_the_shores_tt: "Религиозное рвение [Concept('jihad', 'джихада')|e] уменьшается на #R 10#!. Подготовка сдвигается назад на #R 10#!"
 raid_the_shores_loot_tt: "Каждый незащищённый прибрежный район в выбранной провинции подвергается разграблению. Один из 100 крестьян-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиков#!#! будет угнан в рабство"
 choose_province_for_shore_raid: "Выбрать побережье для набега"
 raid_the_shores_no_provinces: "@trigger_no! У врага нет побережья, примыкающего к морской зоне, где действуют наши [Concept('privateers', 'каперы')|e]."
