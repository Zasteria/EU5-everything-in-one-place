l_russian:
 alg_taifa_rais: "Государство алжирских пиратов"
 alg_taifa_rais_desc: "Корсарские капитаны Алжира объединились в корпорацию, которая полностью контролирует военную и торговую инфраструктуру порта: они ведут переговоры о выкупе пленных, распределяют доли добычи и поддерживают флот в полной боевой готовности, обеспечивая процветание всего города. Мы признаём их корпорацию руководящим органом морской экономики Алжира и наделяем её престижем и законным правом заключения контрактов с иностранными купцами и набора команд по всему Магрибу. Это партнёрство между короной и корсарской элитой даёт нашему государству боеспособные военно-морские силы без затрат на содержание королевского флота."
 anr_consell_de_la_terra: "Совет земли"
 anr_consell_de_la_terra_desc: "Совет земли — это сословно-представительное собрание шести общин Андорры. Он учреждён для управления делами нашего государства и защиты древних прав его населения от посягательств со стороны любого из двух князей-соправителей."
 anr_quartos: "Квартоны"
 anr_quartos_desc: "Шесть общин Андорры управляются через выборные советы — квартоны. Они ведают местными делами и направляют делегатов в Совет земли. Эта древняя система общинного самоуправления ограничивает прямое вмешательство князей-соправителей в повседневную жизнь нашего населения."
 anr_sindic_general: "Старший синдик"
 anr_sindic_general_desc: "Старший синдик — это выборный представитель андоррского общества. Ему поручено защищать коллективные интересы общин перед обоими князьями-соправителями и возглавлять всю нашу общинную администрацию."
 basque_cofradias_marineras: "Морские братства"
 basque_cofradias_marineras_desc: "Морские братства баскского побережья — это древние союзы моряков и рыбаков, созданные для объединения ресурсов, взаимовыручки и сохранения традиций нашего мореходного народа. Их слаженная совместная работа ускоряет постройку судов и обеспечивает постоянную доступность опытных матросов."
 basque_pase_foral: "Пасе форал"
 basque_pase_foral_desc: "Пасе форал (Pase Foral) — это право баскских институтов изучать и приостанавливать действие любых королевских указов, противоречащих местным законам-фуэрос, до их официального вступления в силу на наших землях. Мы повинуемся королю, но лишь в той мере, в какой это позволяют древние обычаи нашего края."
 basque_universidad_mercaderes_bilbao: "Универсидад-де-Меркадерес-де-Бильбао"
 basque_universidad_mercaderes_bilbao_desc: "Купеческая гильдия Бильбао — официально учреждённая под наименованием Универсидад-де-Меркадерес — наделена правом разрешать торговые споры, устанавливать коммерческие стандарты и регулировать торговлю шерстью и железными изделиями, идущую через порт. Её коммерческие суды снижают административную нагрузку на корону и одновременно обеспечивают стабильные налоговые поступления."
 bula_de_la_santa_cruzada: "Крестоносная булла"
 bula_de_la_santa_cruzada_desc: "Папа Римский даровал нашей державе бессрочную крестоносную буллу. Это позволяет нам собирать средства с верующих на войну с иноверцами, а также дарует особые индульгенции нашим воинам, поднявшим оружие на защиту веры."
 cas_letrados: "Летрадос"
 cas_letrados_desc: "Летрадос — это судебные юристы и администраторы с университетским образованием, которых корона назначает в государственные советы. Их привлечение избавляет королевское управление от засилья потомственной знати, заменяя её профессиональным сословием бюрократов, верных исключительно монаршей власти. Летрадос привносят в правовую сферу глубокие юридические знания и культуру административной эффективности, преображая весь аппарат правительства."
 cas_patronato_real: "Королевское покровительство"
 cas_patronato_real_desc: "Королевский патронат — это исключительное право короны выдвигать кандидатов на должности епископов и аббатов на всех наших заморских территориях, подчиняющее церковь в колониях королевской власти. Этот патронат превращает духовенство в инструмент колониального управления и важный источник престижа для короны."
 cat_capitols_de_cort: "Капитулы кортесов"
 cat_capitols_de_cort_desc: "Капитулы кортесов — это законодательные соглашения, заключённые между Короной и каталонскими кортесами. Они обязывают всех последующих правителей свято чтить права и вольности сословий. Ни один королевский указ не может отменить их положения без явного согласия всего королевства."
 eastern_amazigh_oasis_charter: "Оазисная хартия"
 eastern_amazigh_oasis_charter_desc: "Жизнь групп оазисов в предсахарских землях восточного Марокко и Алжира регулируется системой общинных прав на воду и традиционного землепользования, на которых веками держалось оседлое сельское хозяйство в этом бесплодном краю. Официально признавая хартии этих оазисных общин, а также их наследственные права на оросительные каналы и пальмовые рощи, мы гарантируем процветание этих поселений и прочно привязываем их жителей к нашей державе через право на землю. Эта хартия превратит суровые пустынные рубежи в процветающие сельскохозяйственные угодья и расширит наше влияние на всю сеть торговых путей через Сахару."
 glc_archbishopric_compostela: "Архиепархия Компостелы"
 glc_archbishopric_compostela_desc: "В качестве покровителей архиепархии Сантьяго-де-Компостела мы получаем престиж и доход от бесконечного потока паломников, которые путешествуют по пути святого Иакова, дабы поклониться мощам апостола. Это закрепляет за нашей державой статус оплота христианской веры."
 glc_foros_de_galicia: "Галисийские форо"
 glc_foros_de_galicia_desc: "#italic Форо#! — это наследственные договоры долгосрочной аренды, на основании которых крестьянство Галисии владеет обрабатываемой землёй на вечные времена. За это они платят фиксированные взносы и не подвергаются произвольным поборам со стороны землевладельцев. Такое стабильное землепользование поощряет крестьянские семьи вкладываться в землю и прочно привязывает их к своим общинам из поколения в поколение."
 gra_ulema_council: "Совет улемов"
 gra_ulema_council_desc: "Учёные исламского права составляют высший совещательный орган нашей державы: они толкуют религиозные доктрины и наделяют власть султана священной легитимностью. Их неоспоримый авторитет в правовых вопросах гарантирует, что всё отправление правосудия остаётся прочно укоренённым в божественном законе"
 gra_visirate: "Визириат"
 gra_visirate_desc: "Визириат — это высший государственный совет, посредством которого знатные чиновники управляют страной от имени султана, наводя порядок в делах государства и гарантируя, что бразды правления державой находятся в надёжных руках."
 gra_volunteers_of_faith: "Благочестивые добровольцы"
 gra_volunteers_of_faith_desc: "#italic Мутатавви#! — это благочестивые добровольцы, которые вступают в войско султана в времена войны с неверными, движимые религиозным убеждением, а не феодальными обязательствами. Они усиливают собой наши войска, а их ярость в бою более чем восполняет недостаток формальной военной выучки."
 gra_volunteers_of_faith_unlocks_mutatawwia_tt: "Можно нанимать #TOOLTIP:UNITTYPE,a_mutatawwia,X #L мутаттави#!#!"
 kabyle_tajmaat_pact: "Договор с таджмаатом"
 kabyle_tajmaat_pact_desc: "Сельский сход #italic таджмаат#! — это действующий в Кабильском нагорье общинный совет, в котором взрослые мужчины собираются для обсуждения вопросов местного правосудия, распределения общих ресурсов и ответа общины на внешние вызовы. Официально признавая #italic таджмаат#! легитимным представительным органом кабильского крестьянства в сословной системе, мы соглашаемся общаться с горными общинами на их условиях, вместо того чтобы навязывать чуждые им административные структуры, которые вызовут лишь яростное сопротивление. Данный договор обеспечивает нам стабильное управление нагорьем без затрат на содержание постоянных гарнизонов и прочно привязывает кабильские общины к нашей державе через взаимное признание."
 lon_concejos_asturianos: "Астурианские консехо"
 lon_concejos_asturianos_desc: "Городские советы Астурии — это древний институт, уходящий корнями в традиции вольностей-#italic фуэрос#! горных перевалов, где свободные люди организовывали общинную оборону и вершили правосудие задолго до того, как здесь возобладал какой-либо королевский двор. Неугасающая сила этих традиций привязывает крестьянство к нашей державе узами местной преданности, а не принуждением."
 lon_san_isidoro_patronage: "Покровительство над Св. Исидором"
 lon_san_isidoro_patronage_desc: "Наша корона жалует земли и средства Королевской соборной церкви Св. Исидора в Леоне, служащей духовным сердцем державы. Этот королевский мавзолей и центр науки, чьё романское книгохранилище-скрипторий веками оберегало учёное наследие Исидора Севильского, олицетворяет величие нашего престола."
 maghrebi_zawiya_endowment: "Поддержка завий"
 maghrebi_zawiya_endowment_desc: "Суфийская обитель #italic завия#! служит одновременно местом поклонения, школой исламского права, приютом для путешественников и центром местного третейского суда во всех сельских областях Магриба. Наделив эти обители законным статусом и пожертвованиями от верующих, мы распространим влияние нашей религиозной власти на территории, где не имеют силы никакие указы наместников и где шейх #italic завии#! пользуется большим уважением, чем далёкий султан. Эти инвестиции в далёкие духовные районы нашей державы обеспечивают нам преданность народа за малую долю от стоимости прямого управления."
 masmuda_atlas_pact: "Договор с масмуда"
 masmuda_atlas_pact_desc: "Кланы масмуда населяют высокогорья Высокого и Антиатласа. Они организуют совместную оборону и местное управление на основе наследственных племенных пактов со времён Альмохадского халифата, у истоков которого они когда-то стали. Мы признаём авторитет этих горных советов и их право управлять перевалами, а они за это будут яростно сопротивляться любой вражеской армии, которая попытается прорваться через горные маршруты. Этот договор свяжет общины масмуда с центральной властью гибкими союзническими узами, при этом они сохранят свою широкую автономию и вековую традицию общинного ношения оружия."
 mellah_charter: "Хартия для мелл"
 mellah_charter_desc: "#italic Меллы#! — это самоуправляемые еврейские кварталы в городах Магриба. Эти обособленные общины были созданы султаном как гарант внутренней автономии еврейского населения. Кроме того, они платили богатые налоги от ремесленного и торгового дела, в которых иудейские общины традиционно преуспевают. Издав официальную хартию для таких общин, мы упорядочиваем правовой статус наших еврейских подданных и привлекаем искусных мастеров, финансистов и купцов, чьи торговые связи охватывают всё Средиземноморье и Сахару. Интеграция #italic мелл#! в нашу городскую экономику обеспечивает приток ремесленной продукции, кредитов и редких товаров, что идёт на пользу всему городу."
 mll_consolat_de_mar: "Консолат-де-Мар"
 mll_consolat_de_mar_desc: "#italic Консолат-де-Мар#! — это наш морской трибунал, наделённый полномочиями разрешать споры о фрахте, страховании и торговых товариществах на основе кодифицированного морского права, обязательного как для купцов, так и для капитанов судов. Его консулы, избираемые из числа представителей самого торгового сословия, укрепляют положение наших #Y горожан#!, привлекают переселенцев в наши #Y портовые города#! и увеличивают наши #Y доходы от торговли#!."
 mor_abid_al_bukhari: "Гвардия абид аль-Бухари"
 mor_abid_al_bukhari_desc: "Гвардейцы-#italic абид#! — это корпус воинов-рабов, созданный и султаном и названный в честь имама аль-Бухари. Такая псевдоюридическая. Данная псевдоюридическая связь делает их ответственными перед короной, а не перед конкретными хозяевами. Мы превратили этот корпус в постоянную профессиональную армию, подчиняющуюся исключительно престолу, что снижает нашу зависимость в вопросах мобилизации от вечно враждующих племенных конфедераций союзов племён. Подобная централизация военной силы в руках монарха знаменует собой решающий шаг к созданию суверенного войска, независимого от ополчений великих кланов."
 mor_andalusian_refugees: "Андалусские беженцы"
 mor_andalusian_refugees_desc: "Андалусские и морискские беженцы, осевшие в наших городах — прежде всего в Фесе, Рабате и Тетуане, — принесли с собой богатые ремесленные традиции Аль-Андалуса: изразцы-#italic зилидж#!, изысканную керамику, шёлковое ткачество и архитектурные орнаменты, которые отличают городскую культуру северо-западного Марокко. Официально признавая диаспоры этих беженцев и предоставляя им привилегии городского сословия, мы направим их созидательную энергию на развитие экономики марокканских городов и прочно привяжем их к престолу узами благодарности и законной защиты. Их ремесленные традиции и купеческие связи обеспечат нашим городам такой уровень производства, какого одни лишь местные мастера не смогли бы достичь за столь короткий срок."
 mor_gharb_war_tribes: "Воинственные племена Гарба"
 mor_gharb_war_tribes_desc: "Племенные конфедерации хлут, суфийян, тлик и рийя продолжают жить на равнинах Гарб, Азгар и Хабт на тех же условиях, на которых их предки там поселились: земля для возделывания и свобода от налогов в обмен на готовность идти на войну по призыву султана. Мы покупаем их службу, но не покорность, и об этом помнят обе стороны. Мы не правим этими племенами, а договариваемся с ними. Но эта сделка чрезвычайно выгодна: шатры четырёх конфедераций способны дать нам больше всадников, чем любые города "
 mor_guich_tribes: "Племена гиш"
 mor_guich_tribes_desc: "Племенные кланы #italic гиш#! получают от государства земли в обмен на несение постоянной конной службы в пользу султана. Они полностью освобождены от налоговых обязательств, бремя которых ложится на оседлое население. Их наследственный долг военной службы обеспечивает марокканскому султанату постоянный кавалерийский резерв, набираемый на пригодных для коневодства плато Гарба и Дуккалы. Мы официально закрепим такой обмен земель на службу и превратим эти воинские династии в вооружённое продолжение королевской власти на всех равнинах государства."
 mor_guich_tribes_makhzan_requirement_tt: "Мы учредили бюрократический механизм «[ShowBureaucracyTypeName('makhzan_bureaucracy')]»"
 mor_guich_tribes_unlocks_guich_cavalry_tt: "Можно нанимать #TOOLTIP:UNITTYPE,a_guich_cavalry,X #L гишскую кавалерию#!#!"
 mor_makhzen_caids: "Каиды махзена"
 mor_makhzen_caids_desc: "#italic Каиды#! — это назначаемые короной наместники, которых султан направляет для укрепления центральной власти в подконтрольных государству землях — #italic биляд аль-махзен#!. От имени престола они собирают налоги, вершат правосудие и поддерживают порядок. Официальное назначение этих каидов и надзор за ними позволит нам расширять влияние аппарата махзена по всей нашей державе и ограничивать автономию великих племенных союзов, которые в противном случае правили бы исключительно по собственным обычаям. Интеграция назначаемых короной чиновников, обладающих местным влиянием, составляет административную основу марокканского государства."
 mor_marabout_patronage: "Покровительство мурабитов"
 mor_marabout_patronage_desc: "Мурабиты — это святые праведники, чьё духовное преемство признано народом. Их святилища разбросаны по всей территории Марокко, а простые люди ищут их заступничества ради исцеления, третейского суда и защиты от бед. Покровительствуя этим заступникам и их обителям-#italic завиям#!, мы связываем децентрализованную сеть сакральной власти с аппаратом махзена и превращаем султана в признанного защитника народного марокканского ислама. Этот союз открывает нам доступ к религиозным посредникам, способным усмирять общины, до которых не могут легко добраться ни наместники, ни регулярная армия."
 mozabite_communal_pact: "Мзабский общинный договор"
 mozabite_communal_pact_desc: "Пять городов Мзабского пятиградья поддерживают своё экономическое процветание благодаря строгой общинной дисциплине. За её соблюдением следит совет #italic аззаба#! — ибадитский духовный институт, сочетающий религиозную власть, коммерческий арбитраж и регулирование торговли на путях через Сахару. Официально признав это общинное самоуправление законным проявлением власти городского сословия в Мзабе, мы включим торговую сеть пятигрядья в экономику нашей державы. При этом нам не приходится навязывать чуждые им административные структуры, которые вызвали бы лишь яростное сопротивление. Известные своей строгой честностью мзабские купцы пользуются доверием у торговцев по всей Сахаре."
 mudejar_aljamas: "Альхамы мудехаров"
 mudejar_aljamas_desc: "Мы признаём право мусульманских общин сохранять свои самоуправляемые #italic альхамы#! и разрешаем им исповедовать свою веру, разрешать внутренние споры по собственным законам и продолжать заниматься своими ремёслами и торговлей. Их экономический вклад незаменим для нашей державы, а их преданность лучше всего завоёвывать уступками, а не принуждением."
 nav_buenas_villas: "Буэнас-вильяс"
 nav_buenas_villas_desc: "Привилегированным городам нашей державы — #italic буэнас-вильяс#! — пожалованы королевские вольности, дарующие им свободу торговли и самоуправления в обмен на прямую верность короне. Местные советы горожан служат противовесом власти знати и надёжным источником доходов для королевской казны."
 nav_mesnadero: "Меснадерос"
 nav_mesnadero_desc: "#italic Меснадерос#! — это королевская конная гвардия, знатные воины, связанные с короной узами личной службы и знаменитые своими сокрушительными натисками. Их привилегированное положение в качестве личной свиты монарха гарантирует непоколебимую верность и высочайшую боеспособность."
 nav_mesnadero_unlocks_mesnaderos_tt: "Можно нанимать #TOOLTIP:UNITTYPE,a_mesnaderos,X #L меснадерос#!#!"
 nav_palacio_cabo_armeria: "Усадьбы кабо-де-армерия"
 nav_palacio_cabo_armeria_desc: "#italic Усадьбы кабо-де-армерия#! — это передающиеся по наследству имения в Наварре. Родовые гербы их лордов внесены в королевские книги, что позволяет им занимать высокое положение при дворе и участвовать в королевских советах."
 spa_grandes_de_espana: "Гранды Испании"
 spa_grandes_de_espana_desc: "Гранды Испании — высшая знать королевства, представители которой имеют право находиться в присутствии монарха с покрытой головой, а также занимать высокие позиции в государственных собраниях. Их авторитет и преданность — фундамент королевской власти."
 tle_mashwar_court: "Двор Машвар"
 tle_mashwar_court_desc: "#italic Машвар#! — внутренний двор султаната Тлемсен, в котором султан в торжественной обстановке советуется со знатью и правоведами, признавая тем самым их высокое положение в государстве Зайянидов. Правитель в такой системе не выглядит деспотом, а его решения, поддержанные коллективной знатью, обладают большим весом и легитимностью. Мы легализуем полномочия этого совета. Пусть он станет местом политических дебатов, в котором благородное сословие сможет участвовать в жизни государства и поддерживать правовой строй."
 tuareg_caravan_guild: "Туарегская гильдия караванов"
 tuareg_caravan_guild_desc: "Конфедерация туарегов контролирует торговые пути через Сахару, по которым от Сахеля до портов Магриба они переправляют золото, соль и рабов. Их проводники, погонщики верблюдов и воины поддерживают местную экономику. Официальное признание туарегских караванов и внедрение их хозяев в городское сословие даст нам доступ к бесценной информации о торговых путях, а также обеспечит гарантиями безопасности, без которых торговать в Сахаре невозможно. Соглашение с пустынными торговцами наводнит султанат сахарскими товарами и укрепит нашу экономику."
 tuareg_imghad_vassalage: "Имгады-вассалы"
 tuareg_imghad_vassalage_desc: "#italic Имгады#! — кланы вассалов конфедерации туарегов, обязанные, согласно традиции, служить знатным #italic имаджегенам#! в обмен на защиту и доступ к пастбищам Сахары. Придав вассальным отношениям между кланами официальный статус, султан возьмёт под непрямой контроль эту дикую пустыню. #italic Вассальный#! договор позволит нам набирать дисциплинированных всадников с наименьшими для казны затратами."
 tun_hafsid_caliphal_claim: "Притязания хафсидского халифата"
 tun_hafsid_caliphal_claim_desc: "В мусульманском мире султаны из династии Хафсидов считают себя преемниками альмохадского халифата и законными наследниками всеобщей власти «Командира правоверных». Мы взращиваем величие халифата: проводим церемонии, поддерживаем связь с правителями отдалённых мусульманских государств и покровительствуем теологически преданным богословам. Подобный духовный авторитет выделяет нас среди других султанатов и гарантирует преданность наших мусульманских союзников."
 tun_taifa_of_rais: "Тайфа реисов"
 tun_taifa_of_rais_desc: "Тунисская #italic тайфа#! реисов — это объединение капитанов-корсаров. В его уставе прописаны правила каперских налётов, дележа добычи и выкупа пленных на невольничьих рынках. Мы официально признаём эту тайфу и привлекаем к нашему делу наиболее способных её морских предпринимателей, а взамен передаём им формальные права на гавань. Благодаря этому соглашению у Туниса теперь есть одно из лучших корсарских сообществ в западном Средиземноморье, которое в случае войны отправит своих моряков на королевскую службу."
 unlocks_proclaim_pase_foral_tt: "Становится доступно [Concept('cabinet_action', 'действие совета')|e] «[ShowCabinetActionName('proclaim_pase_foral')]»"
 val_tribunal_de_les_aigues: "Водный трибунал"
 val_tribunal_de_les_aigues_desc: "Водный трибунал Валенсии — это старейший действующий трибунал в Европе. Он собирается каждый четверг перед воротами собора, чтобы справедливо распределить воду между фермерами. Неписаные полномочия трибунала признаются всеми, ведь от его решений зависит общественный порядок и благосостояние сельского хозяйства Валенсии."
 zenati_mounted_levy: "Зенетское конное ополчение"
 zenati_mounted_levy_desc: "Конфедерация зената — это берберские племена, хорошо известные своей лёгкой кавалерией. В бою они используют короткое стремя и копьё в традициях #italic зенетской фурусии#!, повлиявшей на конников на всём побережье Средиземноморья. Эти проворные всадники могут прикрывать наши войска, атаковать вражеские пути снабжения и практически без поддержки преодолевать большие расстояния по высокогорью. Они чтут традиции и потому преданы султану, а воинская иерархия для них не так важна, как выполнение обязательств перед ним."
