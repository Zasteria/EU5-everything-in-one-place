l_russian:
 flavor_ara.31.entry: "$flavor_ara.31.title$"
 flavor_ara.31.title: "Слабость в [ShowLocationNameWithNoTooltip('athens')]"
 flavor_ara.31.desc: "Несмотря на наше былое влияние в [ShowProvinceDefinitionName('attica_province')], некогда великая компания, защищавшая [ShowRegionName('balkan_region')], ныне лишь тень своего прежнего величия и ускользает от нас всё дальше и дальше. Вместо того чтобы позволить ей слабеть и становиться всё менее покорной, не пора ли нам вмешаться и отстранить её от власти в [ShowLocationName('athens')], восстановив в этих землях [ROOT.GetCountry.GetAdjective] порядок?"
 flavor_ara.31.a: "Напомним им об их долге."
 flavor_ara.31.b: "Политика [ShowRegionNameWithNoTooltip('balkan_region')] нас не касается."
 flavor_ara.32.entry: "$flavor_ara.32.title$"
 flavor_ara.32.title: "Трон [ShowLocationNameWithNoTooltip('naples')]"
 flavor_ara.32.desc: "Мы стремимся расширить своё влияние в [ShowRegionName('italy_region')] и укрепить торговлю по всему Средиземноморью, однако [GetCountry('NAP').GetLongName] стоит у нас на пути, удерживая множество ценных портов, жизненно важных для наших замыслов. Уже заявив права на [ShowAreaName('sicily_area')], мы получаем дополнительное основание объединить их с северными землями в [ShowLocationName('naples')]. Быть может, это даже станет началом возвышения нового [ROOT.GetCountry.GetGovernment.GetCourtTitle] в [ShowRegionNameWithNoTooltip('italy_region')]..."
 flavor_ara.32.a: "Короны должны быть объединены."
 flavor_ara.32.b: "Не стоит обострять обстановку в [ShowRegionNameWithNoTooltip('italy_region')]."
 ara_allows_naples_fiefdom_regardless_of_warscore_cost: "Мы сможем сделать [GetCountry('NAP').GetName] нашим [ShowSubjectTypeName('fiefdom')] с помощью [ShowCasusBelliName('cb_claim_throne_of_naples')] [casus_belli|e]"
 flavor_ara.33.title: "Победа в [ShowLocationNameWithNoTooltip('naples')]"
 flavor_ara.33.desc: "Наши войска одержали триумфальную победу в недавнем конфликте с правителями [ShowLocationName('naples')]!\n\nЕго некогда величественные стены обращены в руины, а прежний центр власти теперь служит нам для укрепления легитимности нашего владычества над этими землями. Хотя на юге [ShowRegionName('italy_region')] ещё остаются очаги сопротивления, никто не осмеливается оспаривать наше недавнее завоевание.\n\nПожалуй, теперь стоит обратить внимание на внутренние дела, касающиеся [ShowCultureGroupName('italian_group')], приобщая их к нашим обычаям, законам и культуре."
 flavor_ara.33.a: "Этот триумф надлежит отпраздновать!"
 flavor_ara.35.entry: "$flavor_ara.35.title$"
 flavor_ara.35.title: "Наши родичи в [ShowAreaNameWithNoTooltip('sicily_area')]"
 flavor_ara.35.desc: "После того как [ShowCultureName('sicilian')] вечерня закрепила престол за домом [target_character.GetDynasty.GetName], наше влияние в [ShowRegionName('italy_region')] возросло. Несмотря на это, [ShowAreaName('sicily_area')] по-прежнему сохраняет суверенитет, держась в стороне от нашей династической политики. Вместо того чтобы упускать такую возможность, не стоит ли нам связаться с нашими родственниками там, заключив более прочный династический союз и, возможно, положив начало нашим притязаниям в [ShowRegionNameWithNoTooltip('italy_region')]?"
 flavor_ara.35.a: "Мы объединим обе ветви рода."
 flavor_ara.35.b: "Пожалуй, мы можем воспользоваться этой возможностью, чтобы сохранить лицо нашего [ROOT.GetCountry.GetFlavorRank]."
 ara_unlock_decision_to_unite_sicily_and_aragon_crowns_tt: "Мы откроем [decision|e] «[ShowDecisionName('ara_unite_barcelona_dynasty')]», что позволит нам установить [union|e] над [GetCountry('SIC').GetName], если наше [opinion|e] с ними будет достаточно высоким"
 flavor_ara.36.entry: "Второй двор"
 flavor_ara.36.title: "Второй [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 flavor_ara.36.desc: "Престиж и слава [ShowRegionName('italy_region')] — это то, что не может игнорировать ни один правитель [ShowContinentName('europe')]. Благодаря нашему владычеству над [ShowAreaName('sicily_area')] и [ShowLocationName('naples')], [target_character.GetName] начинает подумывать о создании второй столицы для [ROOT.GetCountry.GetName], основанной на богатых городах [ShowRegionNameWithNoTooltip('italy_region')]. Это позволит нам также держать под контролем местную знать, а заодно даст младшим представителям рода [target_character.GetDynasty.GetName] возможность набраться опыта."
 flavor_ara.36.a: "Этот новый [ROOT.GetCountry.GetGovernment.GetCourtTitle], несомненно, принесёт волну процветания."
 flavor_ara.36.b: "Нет нужды уделять особое внимание [ShowRegionNameWithNoTooltip('italy_region')]."
 ara_all_italian_pops_become_satisfied_tt: "Каждая [ShowCultureGroupName('italian_group')] [pop|e] получит [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] к [pop_satisfaction|e]"
 flavor_ara.37.entry: "$flavor_ara.37.title$"
 flavor_ara.37.title: "Укрепление региона [ShowRegionNameWithNoTooltip('italy_region')]"
 flavor_ara.37.desc: "Чтобы сохранить военный контроль над [ShowRegionName('italy_region')], предстоит проделать ещё немало работы.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] в [italian_court.GetName] заметил слабое место на границе, а именно [target_location.GetRank.GetName] [target_location.GetName], которому [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] не уделял должного внимания. По этой причине многие считают, что нам следует укрепить его оборону и обеспечить безопасность [ShowRegionNameWithNoTooltip('italy_region')], открыв новую эпоху спокойствия."
 flavor_ara.37.a: "Укрепим нашу границу."
 flavor_ara.37.b: "Все усилия следует направить на нашу столицу."
 flavor_ara.38.entry: "Дворец для двора [ShowCultureGroupNameWithNoTooltip('italian_group')]"
 flavor_ara.38.title: "Дворец для [ShowCultureGroupNameWithNoTooltip('italian_group')] [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 flavor_ara.38.desc: "Наше присутствие в [ShowRegionName('italy_region')] позволило нам установить куда более прямой контроль над этим регионом. Однако пока жители [ROOT.GetCountry.GetCapital.GetName] наслаждаются роскошью, второй по значимости [ROOT.GetCountry.GetGovernment.GetCourtTitle] считает, что заслуживает такого же внимания. Не желая обмануть доверие [ShowCultureGroupName('italian_group')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], [target_character.GetName] решил заказать возведение великолепного дворца, который будет частично профинансирован богатыми купеческими семьями, а частично — [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], чтобы укрепить нашу власть над богатыми городами полуострова."
 flavor_ara.38.a: "Великий дворец для великого [italian_court.GetRank.GetNameWithNoTooltip]."
 flavor_ara.38.a.entry: "Великий дворец для великого города."
 flavor_ara.38.b: "Нам следует отложить этот проект."
 flavor_ara.39.entry: "$flavor_ara.39.title$"
 flavor_ara.39.title: "Вмешательство в [ShowRegionNameWithNoTooltip('maghreb_region')]"
 flavor_ara.39.desc: "Для защиты нашей торговли порой требуется нечто большее, чем перо.\n\nСо временем наши торговые партнёры в [GetCountry('TUN').GetName] становятся всё более отдалёнными, и мы не забыли их поддержку восстания в [ShowLocationName('ajim')]. Вместо того чтобы сидеть сложа руки и позволить нашим притязаниям угаснуть со временем, нам следует отправить военную экспедицию, чтобы вернуть этот некогда важный порт для нашего [ROOT.GetCountry.GetFlavorRank]."
 flavor_ara.39.a: "Отправимся в [ShowLocationNameWithNoTooltip('ajim')]."
 flavor_ara.42.common_desc: "Наши связи с [from_country.GetName] переплели наши владения, позволив им влиять на нашу политику. Используя своё положение как нации рода [target_character.GetDynasty.GetName], а также как крупной державы в пределах [ShowContinentName('europe')],"
 flavor_ara.42.title: "Наша родня"
 flavor_ara.42.desc: "$flavor_ara.42.common_desc$ теперь они желают претендовать на наш трон, требуя, чтобы [target_character2.GetName] стал не более чем наместником [ROOT.GetCountry.GetName]."
 flavor_ara.42.a: "Мы подчинимся их воле."
 flavor_ara.42.b: "Зачем нам отдавать трон тем, кто ничем не заслужил его?"
 flavor_ara.43.title: "$flavor_ara.42.title$"
 flavor_ara.43.desc: "$flavor_ara.42.common_desc$ теперь они желают превратить нас в вассалов, лишая [target_character2.GetName] всякой власти над [ROOT.GetCountry.GetName]."
 flavor_ara.43.a: "$flavor_ara.42.a$"
 flavor_ara.43.b: "$flavor_ara.42.b$"
 flavor_ara.1100.entry: "$flavor_ara.1100.title$"
 flavor_ara.1100.title: "Слова от [GetCountry('BOS').GetNameWithNoTooltip]"
 flavor_ara.1100.desc: "Великий [target_character.GetName] [GetCountry('BOS').GetName] уже давно борется за сохранение своей независимости от алчных соседей. Не имея сил защититься в одиночку, несколько представителей сословия [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] обратились к [target_character2.GetName] и [ROOT.GetCountry.GetGovernment.GetCourtTitle], прося защитить их от любого вторжения. Они предпочли бы стать нашими подданными, чем попасть в руки иноверцев, и этим мы можем воспользоваться в своих интересах."
 flavor_ara.1100.a: "Посмотрим, что мы можем сделать."
 ara_unlock_decision_to_demand_vassalization_of_bosnia_tt: "Мы откроем [decision|e] «[ShowDecisionName('ara_vassalize_bosnia')]»"
 flavor_ara.1101.title: "Дипломаты из [from_country.GetNameWithNoTooltip]"
 flavor_ara.1101.desc: "Желая защитить нас от внешних угроз, наше [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] обратилось за помощью к [from_country.GetName], и в ответ они прислали делегацию для обсуждения этого вопроса. Зная, что мы предпочтём бесчестие смерти, они потребовали, чтобы мы стали их подданными. В таком случае их войска и их [from_country.GetGovernment.GetEstateName('nobles_estate')] смогут защищать нас более непосредственно, вместо того чтобы полагаться на непрочный союз между нашими странами."
 flavor_ara.1101.a: "Мы подчинимся им."
 flavor_ara.1101.b: "Пусть тогда нас настигнет смерть, но пусть знают: мы умрём свободными!"
