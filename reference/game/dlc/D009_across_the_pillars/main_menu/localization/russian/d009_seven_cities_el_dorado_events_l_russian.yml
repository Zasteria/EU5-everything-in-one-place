 seven_cities_el_dorado.1.title: "Лодка, озеро, пустота"
 seven_cities_el_dorado.1.desc: "Спустя полгода странствий по высокогорью отряд вышел к озеру, которое жрецы муисков называли священным. Протянувшаяся перед нами ритуальная тропа ведёт к круглому кратеру, наполненному тёмной водой и окружённому террасами склонов. Жрецов здесь давно нет: ещё за несколько десятилетий до нашего прибытия эти земли обезлюдели из-за оспы. Местные ныряльщики согласились в обмен на товары обследовать дно озера в трёх разных местах. На поверхность они подняли несколько золотых изделий, немало различных горшков и прочей утвари, а также рыбные и собачьи кости — то есть что угодно, кроме царя. [target_leader.GetName] с неохотой признаёт, что обряд действительно существовал, но проводившее его царство исчезло с лица земли."
 seven_cities_el_dorado.1.a: "Снимаем знамя. Здесь больше не с кем договариваться."
 seven_cities_el_dorado.1.historical_info: "Гуатавита — это священное озеро, расположенное в кратере потухшего вулкана в высокогорном районе современной Колумбии. Оно было культовым центром конфедерации муиска, правившей саванной Боготы до прихода испанцев в 30-х годах XVI века. С ним связана реальная традиция, лежащая в основе легенды об Эльдорадо и существовавшая вплоть до раннего колониального периода: нового вождя обтирали золотой пылью и вывозили к озеру. Там вождь прыгал в воду и плыл обратно, смывая тем самым «золотую кожу». Однако королевство муисков, истощённое оспой и политическим кризисом, который почти неизменно сопровождались вспышки европейских болезней, к моменту прибытия первой европейской экспедиции уже находилось в упадке."
 seven_cities_el_dorado.2.title: "Золотые изделия и воспоминания"
 seven_cities_el_dorado.2.desc: "Раскинувшиеся перед нами края уже совсем не те, какими они были в легендах об Эль Дорадо. Горные племена раздроблены и пришли в упадок, центрального двора больше нет, а у озера уже не проводятся священные обряды. Но в мастерских по-прежнему трудятся ремесленники: золотых дел мастера ещё чтят традиции предков. Один из них в обмен на железный топор отдаёт нам пектораль из кованого золота с изображением человека на плоту, и летописец дважды зарисовывает её, стараясь передать каждую деталь. Торговлю искусно обработанным золотом ещё можно наладить. А вот легендарный двор уже не вернуть."
 seven_cities_el_dorado.2.a: "Построим здесь факторию для торговли золотыми изделиями."
 seven_cities_el_dorado.2.historical_info: "Муисков можно без преувеличения назвать одними из самых искусных металлургов доколумбовой Америки: они работали не только с золотом, но и с тумбагой — сплавом золота и меди, из которого по восковым моделям отливали сложные изделия при относительно низкой температуре. Часть традиций муисков сохранилась и после прихода испанцев — в горных мастерских вплоть до XVII века продолжали изготавливать золотые изделия в старой, доколумбовой манере. Одни предназначались для местных заказчиков, другие — уже для испанского рынка. Знаменитая фигурка в виде плота, изображающая обряд Эль Дорадо, относится именно к этому периоду. Сегодня она хранится в Музее золота в Боготе."
 seven_cities_el_dorado.3.title: "Позолоченный царь"
 seven_cities_el_dorado.3.desc: "Легендарная страна существует на самом деле — и наш отряд её нашёл. Здесь есть всё, что мы рассчитывали увидеть: прежде всего — союз горных племён с центральным двором и священным озером, но также и ежегодный обряд, во время которого верховного вождя осыпают золотым песком. [target_leader.GetName] — желанный гость при дворе: [Select_CString(target_leader.IsFemale, 'ей', 'ему' )] оказывают приём со всеми подобающими почестями. Нам предлагают заключить торговый договор: верховный вождь не желает становиться нашим вассалом, но готов быть нашим партнёром. Одни только золотые изделия уже способны окупить затраты на энтраду, но выгодный для обеих сторон торговый договор дороже любого золота."
 seven_cities_el_dorado.3.a: "Мы подпишем договор — не как завоеватель, но как партнёр."
 seven_cities_el_dorado.3.historical_info: "Складывавшийся годами миф об Эльдорадо приобрёл окончательную форму в виде рассказа о богатом царстве где-то на просторах Южной Америки, где царя каждый год осыпали золотым порошком. Эта легенда ещё два с половиной столетия побуждала европейцев посылать экспедиции всё дальше в глубь материка — уже после того, как описанное летописцами священное поселение у озера Гуатавито обезлюдело и постепенно оказалось всеми забыто. Миф продолжал жить, несмотря на всё новые свидетельства того, что царства больше не существовало. Это классический пример «ловушки невозвратных затрат»: из поколения в поколение европейские державы продолжали снаряжать экспедиции лишь потому, что уже слишком много вложили в поиски."
