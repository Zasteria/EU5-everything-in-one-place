 #### TRACK NAMES AND FLAVOUR TEXT ####
 #MOROCCO
 musicplayer_sol_moroccan_berma_lalla: "Марокко — Berma Lalla"
 musicplayer_sol_moroccan_berma_lalla_flavour: "Песня-призывание Лалы, одной из женских млюков — духов из пантеона гнауа. Композицию исполняет Асмаа Хамзауи и её группа Bnat Timbouktou — первый женский коллектив исполнителей музыки гнауа в Марокко."
 musicplayer_sol_moroccan_boulila: "Марокко — Boulila"
 musicplayer_sol_moroccan_boulila_flavour: "Одна из ключевых композиций репертуара гнауа. Её исполняют во время лилы — ночного исцеляющего ритуала, в котором песни призывают духов-млюков, неразрывно связанных с определёнными цветами, благовониями и церемониями."
 musicplayer_sol_moroccan_soyo_soyo: "Марокко — Soyo Soyo"
 musicplayer_sol_moroccan_soyo_soyo_flavour: "Эта композиция передаётся из поколения в поколение среди мастеров гнауа — от Махмуда Гинии до коллектива Bnat Timbouktou. Её корни уходят в культуру западноафриканской диаспоры, которая формировала музыкальное наследие Марокко начиная с XVI века."
 #CASTILE
 musicplayer_sol_castilian_ay_triste_que_vengo: "Кастилия — Ay triste que vengo"
 musicplayer_sol_castilian_ay_triste_que_vengo_flavour: "Эта композиция на стихи из «Cancionero» (1496 г.), собрания песен Хуана дель Энсины, представляет собой вильянсико. Произведение наглядно демонстрирует призрачность границ между поэзией и песней при ренессансном дворе герцога Альбы."
 musicplayer_sol_castilian_con_amores_la_mi_madre: "Кастилия — Con amores la mi madre"
 musicplayer_sol_castilian_con_amores_la_mi_madre_flavour: "Это вильянсико было написано при дворе Католических королей Испании. Оно балансирует на грани между любовной песней дочери и мистическим диалогом души с девой Марией."
 musicplayer_sol_castilian_conde_claros: "Кастилия — Conde Claros"
 musicplayer_sol_castilian_conde_claros_flavour: "История о графе Кларосе и принцессе Кларанинье — одна из самых популярных баллад в Испании XVI века. До наших дней это произведение дошло в виде диференсиас (вариаций) для виуэлы, созданных Луисом де Нарваэсом. Когда-то именно их пели бродячие певцы сегос."
 musicplayer_sol_castilian_falai_minha_amor: "Кастилия — Falai minha amor"
 musicplayer_sol_castilian_falai_minha_amor_flavour: "Эта песня из первого в истории печатного сборника для виуэлы El Maestro (1536) написана на португальском языке. Её текст отражает династические связи между Валенсией и Лиссабоном и воздаёт должное королю Португалии Жуану III, который был покровителем композитора."
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani: "Кастилия — Recercada I sopra i tenori italiani"
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani_flavour: "Взятая из первого в истории учебного пособия по искусству орнаментации для альта, эта ресеркада демонстрирует, технику глосирования при исполнении пассамеццо антико — одной из канонических итальянских гармонических последовательностей той эпохи."
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna: "Кастилия — Recercada II sobre l'Espagna"
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna_flavour: "Эта ресеркада Ортиса из его трактата «Trattato de Glosas» (Рим, 1553 г.) основана на теме «Ла Спанья» — одной из самых популярных мелодий эпохи Возрождения. Произведение наглядно демонстрирует искусство глосирования, то есть импровизированных вариаций на канонические мелодии."
