l_russian:
 seven_cities_norumbega.1.title: "Река, но не город"
 seven_cities_norumbega.1.desc: "Три долгих месяца отряд шёл вверх по реке от побережья Новой Англии, пока не упёрся в непреодолимую границу. Здесь нет города-крепости. Если верить разведчикам, на всём Пенобскоте вообще нет ни одного города. Берега густо поросли лесами, и единственный признак цивилизации здесь — деревни абенаков в поймах у изгибов реки. Местные охотно торгуют с нами мехом, но через переводчика интересуются, что именно мы рассчитывали здесь найти. Летописцу нечего им ответить. [target_leader.GetName] пишет донесение на родину, сидя в небольшом бревенчатом форте у устья реки, и ждёт начала оттепели, чтобы отправиться обратно."
 seven_cities_norumbega.1.a: "Снимем знамя. Мы поверили рыбацким россказням."
 seven_cities_norumbega.1.historical_info: "Поселение Норумбега впервые появилось на европейских картах в 30-х годах XVI века. Картографы той эпохи помещали его на побережье Атлантики, в районе нынешнего штата Мэн. Столетие спустя, когда европейцы добрались до долины Пенобскота, легенда уже успела заметно измениться: Норумбегу стали представлять как каменный город-крепость, стоящий в верховье реки. Вероятно, что начало этим представлениям положили преувеличенные рассказы французской экспедиции, которая в 1525 году ненадолго установила торговые связи с абенаками в низовье Пенобскота. Их длинные дома, крытые корой, путешественники описывали так, будто перед ними почти настоящий европейский город с каменными стенами, — богатым жителям Сен-Мало было нетрудно представить себе подобное поселение."
 seven_cities_norumbega.2.title: "Обжитый край"
 seven_cities_norumbega.2.desc: "Миф не подтвердился: перед нами не легендарный город, но обжитый край. От устья Пенобскота до его порогов тянутся многочисленные деревни с домами из коры, огороженными садами, ритуальными курганами и добротными каноэ из бересты. [target_leader.GetName] встречается с сахемом абенаков из самой большой деревни; нас приняли со всем почтением и заявили о готовности уступить участок на берегу под французскую или английскую факторию. Торговля мехом здесь вполне существует — в отличие от города. Впрочем, и без него эти земли достаточно ценны."
 seven_cities_norumbega.2.a: "Построим факторию. Торговля мехом — веский повод для этого."
 seven_cities_norumbega.2.historical_info: "Общественное устройство абенаков в годы первых контактов с европейцами было простым: они жили родственными общинами в деревнях, которыми правили наследственные вожди — сагаморы, они же сахемы. В зависимости от сезона абенаки перебирались с речных долин, где выращивали различные культуры, к побережью, где занимались рыболовством. Для европейских купцов такой уклад оказался удобным: у них были предсказуемые торговые партнёры и постоянные поставки мехов и кукурузы, а раздробленность абенакских общин не позволяла одному правителю диктовать условия всей торговли. Город-крепость Норумбега оказался выдумкой, но торговля мехами на Пенобскоте, и породившая эту легенду, процветала более двух столетий."
 seven_cities_norumbega.3.title: "Город-крепость на реке"
 seven_cities_norumbega.3.desc: "Представшие перед нами просторы полностью соответствуют тому, что изображено на карте. Река здесь глубокая и чистая и уходит на сорок лиг вглубь материка. На западном берегу, где заканчивается судоходный путь, отряд обнаруживает город, обнесённый каменными стенами. Стены сложены по-европейски, в центре города расположена большая площадь, рядом стоит просторный каменный дом под сланцевой крышей, а неподалёку — рыночная площадь. Население здесь смешанное: большинство составляют абенаки, но местный вождь говорит на сильно изменившемся древнескандинавском, едва понятном для единственного знатока латыни в нашем отряде. В каменном святилище на центральной площади хранится один-единственный железный меч — явно скандинавской работы. По словам вождя, его народ живёт здесь ещё со времён прадеда его деда. [target_leader.GetName] строчит заметки даже быстрее летописца."
 seven_cities_norumbega.3.a: "Подпишем договор. Мы нашли и страну, и золото."
 seven_cities_norumbega.3.historical_info: "В Европе веками ходили рассказы о затерянной скандинавской колонии, которая якобы уцелела где-то на просторах Северной Америки. Отдельные археологические находки — Ньюпортская башня, Кенсингтонский рунический камень, «пенни из штата Мэн», карта Винланда — на время придавали этой легенде определённую долю достоверности, но все они неизменно оказывались сомнительными либо были признаны подделками. Подлинные археологические свидетельства присутствия скандинавов в Северной Америке немногочисленны: это поселение Л’Анс-о-Медоус на Ньюфаундленде и некоторые отдельные находки, которые могут указывать, что скандинавы иногда заплывали дальше на юг. Каменного города на Пенобскоте, основанного потомками скандинавских переселенцев, никогда не существовало."
 seven_cities_norumbega.10.title: "Пеший странник"
 seven_cities_norumbega.10.desc: "Он терпеливо ждёт на пристани, пока на борт грузят последние бочки с водой: босой, обгоревший на солнце, одетый в тряпьё, которое не пожалели моряки из трёх разных портов. [target_character.GetName] рассказывает свою историю так, будто уже делал это неоднократно. Несколько лет назад его выбросило на далёкий берег у западного океана. Больше года он шёл вдоль побережья, пока рыбаки не подобрали его у северного мыса. Где-то по дороге он побывал в Норумбеге и теперь рассказывает о хрустальных и серебряных колоннах и о знатных господах, которых носят в паланкинах, увешанных жемчугом. Лоцманы просят его указать это место на карте, и он отвечает, что нет ещё такой карты, которая говорила бы правду."
 seven_cities_norumbega.10.a: "Возьмём его на борт и поплывём там, где он ходил."
 seven_cities_norumbega.10.b: "Запишем его показания и оставим его на пристани."
 norumbega_walker_signs_aboard_tt: "[target_character.GetName] записывается в команду в качестве проводника"
 seven_cities_norumbega.10.historical_info: "В 1568 году после сражения у Сан-Хуана-де-Улуа английский моряк Джон Хокинс высадил на берег у Тампико сотню членов своей команды, включая матроса Дэвида Ингрэма. На такой отчаянный шаг его толкнула нехватка провизии. Через одиннадцать месяцев французский корабль подобрал Ингрэма у берегов Новой Шотландии. Если верить его рассказу, за это время матрос прошёл около трёх тысяч километров по местным торговым дорогам. К 1582 году, когда Ингрэма расспрашивали люди из окружения сэра Фрэнсиса Уолсингема, его история уже успела обрасти подробностями о Норумбеге: там якобы стояли серебряные и хрустальные колонны, а царей носили в креслах, украшенных рубинами. В 1589 году рассказ матроса издал автор Ричард Хаклит; впрочем, уже в следующем издании его пришлось исключить как слишком неправдоподобный. Само путешествие вполне могло быть правдой, но Норумбега, похоже, появилась уже в пересказах: знатные люди задавали бедному моряку вопросы и понемногу подводили его к ответам, которые хотели услышать."
 seven_cities_norumbega.11.title: "Космография штурмана"
 seven_cities_norumbega.11.desc: "Вот уже целый месяц штурман после вечерней вахты всё чаще задерживается у себя в каюте: он перечитывает старую космографию, переписанную столько раз, что очертания берегов на картах давно расплылись; и всё же он твёрдо уверен, что в книге написана правда. Если верить ей, за одним из мысов на побережье, куда мы держим курс, находится огромная река, а за рекой — обнесённый стенами город, где живут учёные люди и звучит речь, так напоминающая церковную #TOOLTIP:LANGUAGE,latin_language,X #L латынь#!#!. Корабельный священник завёл рассказ о затерянной #TOOLTIP:RELIGIONGROUP,christian,X #L христианской#!#! стране, что лежит к западу отсюда; переводчик же лишь замечает, что автор, должно быть, не знает латыни сам — он лишь услышал несколько перевранных слов от кого-то, кто сам не говорит на этом языке. Так и появилась эта книга."
 seven_cities_norumbega.11.a: "Отметим реку там, где она находится по утверждению автора."
 seven_cities_norumbega.11.b: "Уберём книгу куда подальше. Лаг и лот — наши проводники."
 seven_cities_norumbega.11.b.tt: "#italic Космография отправляется обратно в сундук. Корабль идёт по расчётам штурмана#!"
 seven_cities_norumbega.11.historical_info: "Жан Альфонс, штурман экспедиции Роберваля в Канаду в 1542 году, писал в своей #italic Cosmographie#!, что поднялся по большой реке до Норумбеги. Там, по его словам, стоял город, где жили образованные люди, говорившие на похожем на латынь языке. В его рассказ попало и название, которое Верраццано дал этому побережью в 1524 году, а дальше за дело взялись картографы. На карте Меркатора 1569 года Норумбега уже изображена как город с башнями на берегу широкой реки. Почти сто лет картографы просто переносили её с одной карты на другую. Однако на самом деле Норумбеги не существовало — она всегда была исключительно плодом воображения."
 seven_cities_norumbega.12.title: "Дым над рекой"
 seven_cities_norumbega.12.desc: "Стоянка осталась позади, и впереди раскинулась широкая тёмная река, зажатая между лесистыми берегами. Мы ещё не успели убрать паруса, а навстречу уже вышли каноэ: местные жители прибыли торговаться. Переводчику велят спросить, где находится город-крепость. Местные показывают вверх по реке, на своё поселение, где у рыбной запруды теснятся крытые корой дома, а в холодный воздух медленно тянется печной дым. Вопрос задают снова, на этот раз сопровождая его подарками. Потом повторяют ещё раз — и предлагают дары получше. Ответ не меняется. [target_leader.GetName] приказывает убрать товары и долго молчит."
 seven_cities_norumbega.12.desc_walker: "Пеший странник почти не отходит от борта с тех пор, как мы начали путь по реке. Теперь команда следит за ним внимательнее, чем за берегами. Наконец его приводят к офицерам. Он долго всматривается в берег, а потом говорит, что город находится дальше. Город всегда оказывается дальше — за этим поселением, за этими краями, где ещё не ступала нога человека… Страннику верят. Доверие ничего не стоит, а признать, что города нет, — значит признать, что весь поход оказался напрасным."
 seven_cities_norumbega.12.a: "Нет, карты не перевёрнуты. Вверх по реке!"
 seven_cities_norumbega.12.b: "Нанесём реку на карту так, как она течёт на самом деле."
 seven_cities_norumbega.12.c: "Мы переживали переделки и пострашнее. Вперёд."
 seven_cities_norumbega.12.historical_info: "Когда европейцы всерьёз занялись исследованием Пенобскота, легенда о Норумбеге рассыпалась в прах. В 1604 году Самюэль де Шамплен специально поднялся по реке, чтобы проверить достоверность мифа. Он увидел лишь деревни абенаков и не нашёл никаких следов города — ни обнесённого стенами, ни вообще какого-либо. Шамплен сухо заметил, что ничего из описанных ему чудес так и не обнаружил. Однако ещё два поколения название «Норумбега» оставалось на картах. Положение легендарного города постоянно менялось, пока в конце концов он не исчез с карт окончательно. Мало какие легенды исчезали так быстро после одной-единственной экспедиции."
 seven_cities_norumbega.13.title: "Остров Демонов"
 seven_cities_norumbega.13.desc: "Остров выступает из тумана ровно там, где на картах стоит предупреждение. Гуляющий по нему ветер издаёт такой звук, что матросы боятся даже проронить лишнее слово. С носа раздаётся крик — вперёдсмотрящий снова что-то обнаружил. Подзорная труба молча переходит из рук в руки. У подножия скал на берегу, там, куда не достаёт ветер, горит костёр — кто-то время от времени подбрасывает в него выброшенное прибоем дерево. Присмотревшись, мы замечаем, что рядом стоит человек в лохмотьях (когда-то его одежда была вполне добротной) и изо всех сил машет нам горящей головнёй. Боцман замечает, что демонам дрова обычно не нужны."
 seven_cities_norumbega.13.a: "Спустим шлюпку. Этого человека нужно спасти."
 seven_cities_norumbega.13.b: "Не станем менять курс: это может быть приманка для пиратов."
 seven_cities_norumbega.13.b.tt: "#italic Остров остаётся за кормой. Костёр окончательно скрывается в тумане#!"
 norumbega_survivor_joins_tt: "[target_character.GetName] покидает остров и присоединяется к нашему двору"
 seven_cities_norumbega.13.historical_info: "В 1542 году дворянин и колонизатор Роберваль возглавил экспедицию в Канаду; в то время его штурманом служил Жан Альфонс. Во время плавания выяснилось, что юная родственница Роберваля — Маргарита де ля Рок завела роман с одним из мужчин на корабле. В наказание Роберваль высадил её на Острове Демонов у берегов Ньюфаундленда вместе с её возлюбленным и служанкой. Все трое оказались в тяжёлом положении: любовник Маргариты, служанка и родившийся на острове ребёнок вскоре умерли. Маргарита же провела там в одиночестве больше двух лет, охотясь на медведей из оставшихся у неё аркебуз. В конце концов её спасли баскские рыбаки. Вернувшись во Францию, Маргарита рассказала о пережитом королеве Наварры. Та описала эту историю в своей книге, благодаря чему мы сегодня знаем о случившемся. Сам остров с тех пор затерялся, и сегодня никто не знает наверняка, какой именно остров у берегов Ньюфаундленда называли Островом Демонов."
