l_russian:
 seven_cities_saguenay.1.title: "Доннакона рассказывал небылицы"
 seven_cities_saguenay.1.desc: "После трёх месяцев подъёма по Сагенею отряд наконец добрался до земель, о которых Доннакона шестьдесят лет назад рассказывал Картье. Стадаконский вождь уверял, что здесь живут светлокожие люди в меховых одеждах, горы полны золота, а в реках течёт серебро. На деле край оказался совсем другим: каменистым, лесистым и холодным. Никаких светлокожих людей здесь нет, как нет и золота в ручьях. Охотники-инну, которых встречает отряд, охотно торгуют мехами, но никто из них не слышал ни о каких богатых царствах. [target_leader.GetName] приходит к единственному выводу: Доннакона рассказал Картье лишь то, что последний желал услышать, в надежде, что его возьмут во Францию и позволят вернуться домой живым."
 seven_cities_saguenay.1.a: "Отряд двинется дальше. Здесь нет никакого царства — есть только меха."
 seven_cities_saguenay.1.historical_info: "Стадаконский вождь Доннакона, живший у верховьев реки Святого Лаврентия, на протяжении зимы 1535 — 1536 годов рассказывал Картье о богатом царстве Сагеней, якобы расположенном где-то в глубине Новой Франции. Весной Картье увёз Доннакону во Францию, представив его как гостя короны. Домой ему уже не суждено было вернуться: во Франции вождя постигла кончина. Легенда о Сагенее ещё долго побуждала французскую корону снаряжать новые экспедиции вглубь материка вплоть до конца XVII века — к тому времени её постепенно вытеснили реальные знания о стране: были хорошо изучены и нанесены на карту озёра и реки, а торговля мехами показала, чем на самом деле богаты эти земли."
 seven_cities_saguenay.2.title: "Индейская конфедерация и меха"
 seven_cities_saguenay.2.desc: "Открывшиеся нам земли — вовсе не легендарный Сагеней, но они, тем не менее, также заслуживают внимания. Вдоль верхнего течения реки и на берегах дальних озёр, в разрозненных поселениях живут инну. Для охотников здесь настоящее раздолье: весь лес — их угодья. Инну торгуют мехами, вяленой рыбой, берестяными каноэ и немного — самородной медью, которую добывают к северу отсюда. Они готовы принять французское посольство. Ни золота, ни серебра, ни светлокожего короля здесь нет, зато есть настоящая и вполне здоровая торговля мехом. [target_leader.GetName] приказывает построить у слияния рек факторию."
 seven_cities_saguenay.2.a: "Построим факторию. Торговля мехами покроет все затраты."
 seven_cities_saguenay.2.historical_info: "Бассейны рек Святого Лаврентия и Сагенея стали воротами для французской торговли мехами. На протяжении XVII — начала XVIII веков именно по этим рекам торговцы, миссионеры и поселенцы продвигались в глубь Северной Америки. Торговля держалась прежде всего на местных посредниках (в первую очередь гуронах-виандотах и алгонкинах) и на сети факторий, постепенно расширявшейся на запад в сторону бассейна Миссисипи через Великие озёра. В этом смысле легенда о Сагенее оказалась самоисполняющимся пророчеством: богатства, которые искали на материке, оказались не золотом, а мехами, и в конце концов именно торговля ими принесла Франции настоящее богатство."
 seven_cities_saguenay.3.title: "Найдено северное царство"
 seven_cities_saguenay.3.desc: "Легендарные земли действительно существуют: сюда только что ступил наш отряд. За вторым большим озером, в краю, который инну называют Холодной землёй, стоит поселение примерно на три тысячи человек — светлокожих, одетых в длинные меховые одежды. Они говорят на языке, который никто из нас прежде не слышал, но знающий латынь языковед утверждает, что это — древнескандинавский. Из достопримечательностей здесь — дом совета с медной крышей и небольшое ритуальное святилище, где выставлены золотые изделия явно североевропейской работы. О нашем появлении на побережье здесь знают не первое десятилетие; всё это время люди терпеливо ждали, пока мы найдём их. Летописец всю ночь не выпускает из рук пера. На рассвете [target_leader.GetName] посылает за подкреплением."
 seven_cities_saguenay.3.a: "Подпишем договор. Мы нашли затерянную христианскую державу."
 seven_cities_saguenay.3.historical_info: "Легенда о скандинавском поселении в глубине Канады не получила подтверждения, несмотря на периодические заявления об обратном. Селившиеся в Гренландии скандинавы забросили остров в XV веке, а археологических свидетельств их постоянного проживания в материковой части Северной Америки, за исключением недолгих контактов с местным населением несколькими веками ранее, так и не было найдено. Вероятнее всего, легенда, манившая французских исследователей в глубь страны, — не более чем переосмысление историй о Норумбеге и Винланде, которые, в свою очередь, восходят к средневековым исландским сагам. К тому времени, как миф дошёл до французского двора, описываемая в сагах география была уже позабыта."
 seven_cities_saguenay.10.title: "Царь за порогами"
 seven_cities_saguenay.10.desc: "Этот юноша живёт при нашем дворе с тех пор, как вернувшаяся из-за океана экспедиция привезла его с собой. За это время он успел достаточно хорошо выучить наш язык — пожалуй, даже слишком хорошо. На расспросы о том, что находится за великими порогами, [target_character.GetName] отвечает: там лежит царство Сагеней. Его горы полны золота и красных камней, а живут там люди в шерстяной одежде; кожа же их светла, как у нас. Юноша с радостью добавляет новые детали, чтобы потешить слушателей: в Сагенее также якобы живут одноногие и даже летающие люди. Писари замечают, что, стоит кому-то засомневаться в его рассказах, Сагеней словно прирастает очередной провинцией. Рассказчик аккуратно добавляет: чудесное царство находится очень далеко, идти к нему надо вверх по реке, и без него туда не добраться."
 seven_cities_saguenay.10.a: "Отвезём его домой; пусть по пути заговаривает зубы главному."
 seven_cities_saguenay.10.b: "Оставим его при дворе — у него весьма забавные рассказы."
 saguenay_chiefs_son_sails_tt: "[target_character.GetName] возвращается домой в качестве нашего проводника и переводчика"
 seven_cities_saguenay.10.historical_info: "В 1534 году Жак Картье увёз во Францию сыновей стадаконского вождя Доннаконы, но уже через год вернул их домой. В 1536 году он забрал с собой самого Доннакону. Оставшиеся годы тот провёл при французском дворе, теша слушателей рассказами о царстве Сагеней — стране, богатой золотом и населённой светлокожими людьми в меховых одеждах. Чем знатнее были слушатели, тем диковиннее становились подробности: Доннакона начинал рассказывать об одноногих людях и людях, умеющих летать, подобно летучим мышам. Он был последователен в своих рассказах: царство дивило именно теми чудесами, о которых хотели слышать собравшиеся, и каждый раз оно оказывалось всё дальше — непременно за той рекой, до которой ещё не добрались исследователи. Около 1539 года Доннакона умер на чужбине, так и не увидев свой народ. Его рассказы, однако, пережили самого вождя ещё на полтора столетия."
 seven_cities_saguenay.11.title: "Белая болезнь"
 seven_cities_saguenay.11.desc: "Болезнь — хирург называет её береговой — начинается с дёсен. От неё нет лекарств. У людей чернеют и распухают ноги, открываются старые шрамы, зубы начинают шататься в лунках. Первыми слегают самые крепкие, и никто не может объяснить, почему так. Смерть унесла жизни уже восьмерых, а ещё четверть команды не в силах заступить на вахту. Холодная земля уже близко, где-то с подветренной стороны. Вахтенные на шканцах всё чаще задаются вопросом: не окажется ли то, что ждёт нас на берегу, ещё страшнее уже постигшего нас бедствия?"
 seven_cities_saguenay.11.a: "Пристанем к берегу и попросим местных о помощи."
 seven_cities_saguenay.11.b: "Отворим кровь заболевшим и продолжим идти прежним курсом."
 saguenay_annedda_cure: "#Y Сородичи нашего проводника показывают нам дерево; отвар из его коры и хвои за несколько дней ставит на ноги даже умирающих#!"
 saguenay_strangers_mercy: "#Y Чужаки не сразу, но всё-таки проявляют милосердие#!"
 seven_cities_saguenay.11.historical_info: "Зимой 1535 — 1536 годов четверть участников экспедиции Картье погибла от цинги. Спасти остальных помог Домагайя, сын местного вождя, бывавший прежде во Франции: он показал французам, как приготовить отвар из коры и хвои дерева, которое ирокезы называли аннеддой. Уже через неделю больные вновь встали на ноги. Впоследствии Картье писал, что все врачи Лёвена и Монпелье со всеми их лекарствами не смогли бы за восемь дней добиться того же, чего добился Домагайя. Позднее и свойства, и даже название аннедды оказались забыты. В Европе на два столетия утратили знания об этом чудодейственном средстве. Цинга же продолжала свирепствовать и в последующие века погубила больше моряков, чем все морские сражения эпохи парусного флота вместе взятые."
 seven_cities_saguenay.12.title: "Алмазы у мыса"
 seven_cities_saguenay.12.desc: "За серым мысом, там, где река делает поворот, сверкает берег. Утёсы здесь покрыты белыми прожилками, сверкающими, словно огранённые камни. Между ними тянутся полоски жёлтого металла — его можно легко отполировать, просто плюнув на палец и потерев. К полудню половина вахтовых уже сошла на берег с бочками. Перед остальными стоит непростая задача: составить донесение на родину, в понятных словах описав, что же именно в бочках находится. Старший канонир, сын горняка, долго вертит в руках один из жёлтых самородков, а затем просит позволения сказать всё как есть, прежде чем будут составлены донесения."
 seven_cities_saguenay.12.a: "Заполним все бочки до отказа и утрём нос всем сомневающимся."
 seven_cities_saguenay.12.b: "Не будем радоваться преждевременно — пусть сын горняка сначала проверит породу."
 saguenay_barrels_ring_true: "#Y Нам неожиданно улыбается удача: здесь есть настоящий драгоценный металл#!"
 saguenay_glitter_and_air: "#Y Наши трюмы полны кварца и пирита — «золота дураков». Вести об этом домчатся до дома быстрее нашего корабля#!"
 seven_cities_saguenay.12.historical_info: "Во время последней экспедиции Картье в 1542 году у мыса Руж на корабли погрузили одиннадцать бочек золотосодержащей руды и большое количество «алмазов». С этим грузом Картье триумфально отплыл во Францию, оставив Роберваля и колонию на произвол судьбы. Во Франции находки тщательно изучили. Золото оказалось железным колчеданом, а алмазы — обычным кварцем. Разочарование было столь велико, что выражение #italic faux comme un diamant du Canada#! — «фальшивый, как канадский алмаз» — уже через поколение прочно закрепилось в языке. Мыс, однако, так и сохранил своё название — Диаман, то есть «алмазный». Сегодня на этом месте, сыгравшем с членами экспедиции такую злую шутку, стоит город Квебек."
 seven_cities_saguenay.13.title: "Ярмарка в Тадусаке"
 seven_cities_saguenay.13.desc: "На следующее утро после того, как мы бросили якорь, начинают прибывать каноэ — одни спускаются по реке, другие подходят с дальнего берега. Лодки глубоко просели под весом тюков со шкурами. Переводчик объясняет: это нечто вроде ярмарки. Народы холодного края каждый год собираются у устья реки, пока та не успела замёрзнуть, чтобы обменяться товаром. Наш парусник они попросту приняли за невероятно большое каноэ. Писарь берёт в руки бобровую шкурку, потом другую, затем откладывает перо и берётся за расчёты другого рода. Золотое царство, говорит он, — это наверняка просто слухи. А бобры — настоящие."
 seven_cities_saguenay.13.a: "Откроем трюмы и поторгуем с местными. Легенда легендой, а прибыль прибылью."
 seven_cities_saguenay.13.b: "Мы не для того пересекли океан, чтобы гоняться за бобрами. Идём вверх по реке!"
 seven_cities_saguenay.13.historical_info: "Тадусак, расположенный у устья Сагенея, служил коренным обитателям местом сезонной торговли задолго до появления здесь европейцев. Каждый год инну и алгонкины встречались у устья реки, где обменивались мехами и медью. Французские первопроходцы не столько открыли здесь торговлю, сколько встроились в уже существующий рынок. В 1600 году Пьер де Шовен построил здесь первую постоянную французскую факторию — за несколько лет до основания Квебека. Царство Сагеней, согласно легенде располагавшееся дальше по течению реки, так и не нашли. Зато сплавляемые по Сагенею меха на протяжении двух столетий были одной из главных опор экономики Новой Франции. Для большинства невыдуманных королевств и это было немалым достижением."
