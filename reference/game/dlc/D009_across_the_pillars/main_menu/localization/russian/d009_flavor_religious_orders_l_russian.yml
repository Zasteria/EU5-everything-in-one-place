l_russian:
 d009_flavor_religious_orders.1.title: "Смена руководства"
 d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
 d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], верой и правдой [Select_CString(old_head_of_order.IsFemale, 'служившая', 'служивший' )] нашей державе в качестве главы #ONCLICK:COUNTRY,[target_order.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_order.Custom('CL_tt')],X [target_order.Custom('CL_GEN')|L]#!#!, внезапно [Select_CString(old_head_of_order.IsFemale, 'заболела и была вынуждена', 'заболел и был вынужден' )] уйти в отставку.\n\nХотя на [Select_CString(old_head_of_order.IsFemale, 'её', 'его' )] место претендуют многие достойные рыцари и аристократы, [target_ruler.target_ruler.GetShortName] уже [Select_CString(target_ruler.IsFemale, 'нашла', 'нашёл' )] для этой работы подходящего человека из числа своих фаворитов. Великим магистром [target_order.Custom('CL_GEN')] станет [target_character.GetShortName] — если, конечно, мы не позволим братьям выбирать его самим."
 d009_flavor_religious_orders.1.a: "Новым Великим магистром станет [target_character.GetShortName]."
 d009_flavor_religious_orders.1.a.entry: "Новым Великим магистром станет наш фаворит."
 d009_flavor_religious_orders.1.b: "[target_order.GetNameWithNoTooltip] сам выберет своего Великого магистра."
 d009_flavor_religious_orders.1.b.entry: "Братья сами выберут своего Великого магистра."
 d009_flavor_religious_orders.2.title: "[target_character.GetNameWithNoTooltip] рвётся к власти"
 d009_flavor_religious_orders.2.entry: "Великий магистр рвётся к власти"
 d009_flavor_religious_orders.2.desc: "За последние годы [target_character.GetName] заметно [Select_CString(target_character.IsFemale, 'приумножила', 'приумножил' )] своё влияние и богатство. Для главы #ONCLICK:COUNTRY,[target_order.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_order.Custom('CL_tt')],X [target_order.Custom('CL_GEN')|L]#!#! такое обогащение ничуть не удивительно, однако тревогу вызывает то, что [Select_CString(target_character.IsFemale, 'она также начала', 'он также начал' )] проявлять интерес к столичной политике. Хотя [target_character.GetNameWithNoTooltip] ещё совсем недавно [Select_CString(target_character.IsFemale, 'была фавориткой', 'был фаворитом' )], теперь [Select_CString(target_character.IsFemale, 'она', 'он' )] то и дело критикует правительство, и даже [Select_CString(target_ruler.IsFemale, 'сама', 'сам' )] [target_ruler.GetNameWithNoTooltip] не избегает [Select_CString(target_character.IsFemale, 'её', 'его' )] острых замечаний. В связи с этим многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] призывают лишить [Select_CString(target_character.IsFemale, 'её', 'его' )] титула великого магистра."
 d009_flavor_religious_orders.2.a: "[Select_CString(target_character.IsFemale, 'Она', 'Он' )] просто радеет [ROOT.GetCountry.Custom('end_predlog_obo')] [ROOT.GetCountry.Custom('CL_PREP')]."
 d009_flavor_religious_orders.2.a.entry: "Он просто радеет о нашей державе."
 d009_flavor_religious_orders.2.b: "[Select_CString(target_character.IsFemale, 'Она', 'Он' )] явно [Select_CString(target_character.IsFemale, 'переступила', 'переступил' )] черту."
 d009_flavor_religious_orders.2.b.entry: "Он явно переступил черту."
 d009_flavor_religious_orders.3.title: "Опальный магистр"
 d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
 d009_flavor_religious_orders.3.desc: "Из-за своих политических амбиций [target_character.GetName] [Select_CString(target_character.IsFemale, 'навлекла', 'навлёк' )] на себя гнев всего #L [ROOT.GetCountry.GetAdjective|l]ого#! двора. Последней каплей стала [Select_CString(target_character.IsFemale, 'её', 'его' )] открытая критика [Select_CString(target_ruler.IsFemale, 'нашей правительницы', 'нашего правителя' )], из-за которой [Select_CString(target_character.IsFemale, 'она не только утратила статус фаворитки', 'он не только утратил статус фаворита' )], но и [Select_CString(target_character.IsFemale, 'лишилась', 'лишился' )] поддержки своих сторонников. Теперь и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], и [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и даже [Select_CString(target_ruler.IsFemale, 'сама', 'сам' )] [ROOT.GetCountry.GetGovernment.GetRulerTitle] [target_ruler.GetName] считают [Select_CString(target_character.IsFemale, 'её', 'его' )] своим личным врагом. В таких условиях [Select_CString(target_character.IsFemale, 'она', 'он' )] больше не может занимать должность великого магистра #ONCLICK:COUNTRY,[target_order.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_order.Custom('CL_tt')],X [target_order.Custom('CL_GEN')|L]#!#!."
 d009_flavor_religious_orders.3.a: "Казнить [Select_CString(target_character.IsFemale, 'её', 'его')] за измену!"
 d009_flavor_religious_orders.3.a.entry: "Казнить его за измену!"
 d009_flavor_religious_orders.3.b: "Изгнать [Select_CString(target_character.IsFemale, 'её', 'его')] и назначить нового главу ордена."
 d009_flavor_religious_orders.3.b.entry: "Изгнать его и назначить нового главу ордена."
