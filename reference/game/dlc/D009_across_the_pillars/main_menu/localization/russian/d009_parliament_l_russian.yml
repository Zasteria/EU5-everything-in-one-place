l_russian:
 ahl_al_hall_wal_aqd_parliament: "Ахль аль-халль ва-ль-акд"
 ahl_al_hall_wal_aqd_parliament_desc: "#italic Ахль аль-халль ва-ль-акд#! («люди вяжущие и разрешающие») — это авторитетный круг правоведов, учёных и старейшин, чьё коллективное согласие традиционно легитимирует власть исламских правителей, выступая свидетельством того, что передачу власти одобряет вся община. Мы учреждаем этот совет как официальный совещательный институт нашего государства, обеспечивая #italic улемам#! и старшим домам постоянное участие в делах правления. Обеспечив ему должное влияние и ресурсы, мы сможем укрепить легитимность нашей власти, опираясь на авторитет учёных. Если же у нас не найдётся ресурсов на содержание совета, его решения утратят былую силу, а добиться согласия, на котором держится наша власть, станет гораздо труднее."
 tribal_jamaa_parliament: "Джамаа"
 tribal_jamaa_parliament_desc: "#italic Джамаа#! — это древний институт коллективного управления у амазигов, при котором свободные члены племени и представляющие их вожди обсуждают на открытых собраниях вопросы войны, правосудия и распределения ресурсов. Признавая #italic джамаа#! официальным парламентским органом нашего государства, мы тем самым связываем нашу власть с согласием племенных общин, составляющих основу державы. Работа этого собрания вовлечёт общины в политическую жизнь государства и позволит разрешать их жалобы мирным путём. Если же у государства не найдётся ресурсов на содержание джамаа, совет утратит свой авторитет, а племена вновь вернутся к обособленному существованию."
