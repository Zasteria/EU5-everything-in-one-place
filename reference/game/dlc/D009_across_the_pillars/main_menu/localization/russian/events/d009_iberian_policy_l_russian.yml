l_russian:
 d009_iberian_policy.1.title: "Статут [ShowLocationNameWithNoTooltip('toledo')]"
 d009_iberian_policy.1.entry: "Статут Толедо"
 d009_iberian_policy.1.desc: "Обсуждение в #TOOLTIP:LOCATION,toledo,X #L Толедо#!#! столь насущного вопроса, как [ShowLawName('limpieza_de_sangre_law')|l], достигло апогея. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] в большинстве своём требуют, чтобы высшие церковные должности и бенефиции предоставлялись только старым христианам, а потомки тех, чьи предки когда-то исповедовали [ShowReligionName('judaism')|l] или #TOOLTIP:RELIGIONGROUP,muslim,X #L ислам#!#!, были отстранены от них. Предложение вызвало глубокий раскол: представители университетов и городских советов объявляют его несправедливым. Дошло до того, что в разрешение конфликта вынуждены вмешаться [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l]."
 d009_iberian_policy.1.a: "[ROOT.GetCountry.GetReligion.GetGodName|U] и [ROOT.GetCountry.GetFlavorRank|l] желают, чтобы им служили только носители чистой крови!"
 d009_iberian_policy.1.b: "Внедрим его со всей рассудительностью и осторожностью."
 d009_iberian_policy.1.c: "Попробуем добиться компромисса между обеими фракциями."
 d009_iberian_policy.1.historical_info: "В 1546 году новоизбранный архиепископ Толедо Хуан Мартинес Силисео инициировал принятие нового статута о чистоте крови в ответ на назначение новообращённого на должность каноника собора. Силисео смог убедить самого Папу отменить это назначение. Несмотря на протесты многих архидиаконов, городских советов и представителей университетов, его статут о чистоте крови был утверждён королём Филиппом и стал впоследствии образцом для аналогичных законодательных актов, принятых по всей Испании."
