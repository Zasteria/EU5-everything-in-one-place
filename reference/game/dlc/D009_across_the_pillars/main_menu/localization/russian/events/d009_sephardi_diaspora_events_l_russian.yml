l_russian:
 d009_crypto_jewish_exodus_tt: "Обратившиеся в #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#! выходцы из криптоиудейских общин втайне обращаются в прежнюю веру и покидают державу; их место назначения — [d009_exodus_destination.GetName]"
 d009_sephardi_diaspora.1.title: "Прибытие изгнанников"
 d009_sephardi_diaspora.1.entry: "$d009_sephardi_diaspora.1.title$"
 d009_sephardi_diaspora.1.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашей державы узнаёт, что [origin_country.GetNameWithNoTooltip] изгнал[origin_country.Custom('end_fem')] своих #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейских#!#! подданных, и теперь многие из них ждут в наших портах, имея при себе лишь скромные пожитки. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] считают подобный поворот событий весьма удачным: среди изгнанников есть умелые мастера и люди с капиталом. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] же видят лишь толпу чужеземцев, чью верность и набожность ещё предстоит проверить. Важно помнить: изгнанники никогда не забудут, как мы решим поступить по отношению к ним."
 d009_sephardi_diaspora.1.a: "Официально их примем."
 d009_sephardi_diaspora.1.b: "Позволим им поселиться только в определённых городах."
 d009_sephardi_diaspora.1.historical_info: "Говорят, султан Баязид II отметил, что, изгнав евреев, Фердинанд Арагонский обеднил собственную страну и обогатил Османскую империю. Он распорядился, чтобы наместники в провинциях принимали изгнанников и не отказывали им в убежище. В последующие десятилетия на Османских Балканах и в Анатолии поселились десятки тысяч беженцев. Они привезли с собой печатные станки и технологии текстильного производства и установили новые торговые связи, что заметно поспособствовало процветанию османских городов, в особенности Фессалоник и Константинополя."
 d009_sephardi_diaspora.2.title: "Иудаизм в Фессалониках"
 d009_sephardi_diaspora.2.entry: "$d009_sephardi_diaspora.2.title$"
 d009_sephardi_diaspora.2.desc: "За годы, прошедшие с прибытия первых изгнанников, #TOOLTIP:LOCATION,thessaloniki,X #L Фессалоники#!#! сильно изменились. Жизнь городских портов, мастерских и рынков подстроилась под еврейский календарь: здесь нет ничего важнее Шаббата, а #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейская#!#! община по численности превзошла совокупное население города. Даже наши чиновники начали подстраиваться под новый порядок — от него зависит слишком многое в городской торговле."
 d009_sephardi_diaspora.2.a: "Пусть город сохраняет свой уклад."
 d009_sephardi_diaspora.2.historical_info: "К середине XVI столетия евреи-сефарды составили большую часть населения Фессалоник. Среди еврейских общин Европы и Средиземноморья город стал известен как центр сефардской учёности, книгопечатания и текстильного производства, в особенности шерстяных тканей для османской военной формы. Еврейско-испанский язык (ладино) оставался одним из основных языков на улицах и рынках города вплоть до XX века."
 d009_thessaloniki_has_sephardi_pops_tt: "[ShowLocationNameWithNoTooltip('thessaloniki')] — место проживания сефардского [Concept('pops', 'населения')|e]"
 d009_sephardi_diaspora.3.title: "Гетто в [ROOT.GetCountry.Custom('CL_PREP')]"
 d009_sephardi_diaspora.3.entry: "Гетто"
 d009_sephardi_diaspora.3.desc: "Наш сенат предлагает переселить #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейскую#!#! общину города [ROOT.GetCapital.GetName] на обнесённый стенами остров. Ночью его ворота будут запираться, днём — охраняться, а жителям позволят покидать пределы острова лишь при соблюдении строгих условий. Сторонники такого подхода считают его разумным компромиссом между изгнанием и разрешением для иудеев расселяться так, как им заблагорассудится. Еврейские же купцы и ростовщики, на чьи кредиты издавна полагается [ROOT.GetCapital.GetNameWithNoTooltip], отзываются об этой мере в совсем иных выражениях."
 d009_sephardi_diaspora.3.a: "Учредим гетто."
 d009_sephardi_diaspora.3.b: "Не будем поддаваться давлению и ограничивать общину."
 d009_sephardi_diaspora.3.historical_info: "Венеция учредила еврейское гетто в 1516 году, ограничив место проживания общины кварталом Ghetto Nuovo в районе Каннареджо, который закрывали и охраняли по ночам. Само слово #italic гетто#! происходит от названия этого квартала, предположительно восходящего к венецианскому слову #italic geto#!, обозначавшему располагавшийся здесь ранее меднолитейный завод. В течение следующего столетия практика создания огороженных по распоряжению властей еврейских кварталов распространилась и на другие города Италии."
 d009_venice_has_jewish_pops_tt: "[ShowLocationNameWithNoTooltip('venice')] — место проживания иудейского [Concept('pops', 'населения')|e]"
 d009_sephardi_diaspora.4.title: "[target_character.GetNameWithNoTooltip] и Библия Феррары"
 d009_sephardi_diaspora.4.entry: "Донья Грасия Мендес и Библия Феррары"
 d009_sephardi_diaspora.4.desc: "В Ферраре поселилась богатая #L [GetCountry('POR').GetAdjective|l]ая#! вдова [target_character.GetName], известная не только своим состоянием, но и немалой храбростью. Здесь она впервые смогла открыто жить так, как жила раньше втайне, — как небедная еврейка, преданная своей вере. Она из собственных накоплений оплачивает переводы Священного Писания на ладино для конверсо, не знающих иврита, и тайно поддерживает сеть связных и убежищ, которая охватывает даже [GetCountry('POR').Custom('CL_ACC')]. Она готова помочь бежать каждому, кто захочет последовать её примеру."
 d009_sephardi_diaspora.4.a: "Поддержим её работу."
 d009_sephardi_diaspora.4.b: "Ограничим её деятельность."
 d009_sephardi_diaspora.4.historical_info: "Донья Грасия Мендес Наси (урождённая Беатрис де Луна, родилась в Лиссабоне около 1510 года) считается обладательницей одного из крупнейших состояний среди купцов-конверсо XVI века. Переехав в Антверпен, а затем в Феррару, Грасия стала открыто исповедовать иудаизм. Благодаря своему богатству и связям она профинансировала издание Библии Феррары 1553 года — перевода Библии на ладино для крещёных евреев, утративших свободное владение ивритом. Кроме того, Грасия финансово поддерживала организацию путей бегства для португальских новых христиан, спасавшихся от инквизиции."
 d009_sephardi_diaspora.5.title: "[target_character.GetNameWithNoTooltip] и переселение Цфата"
 d009_sephardi_diaspora.5.entry: "Дон Иосиф Наси и переселение Цфата"
 d009_sephardi_diaspora.5.desc: "Финансист #L [GetCountry('POR').GetAdjective|l]ого#! происхождения [target_character.GetName], к [Select_CString(target_character.IsFemale, 'которой', 'которому' )] с большой благосклонностью относится [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашей державы, просит передать [Select_CString(target_character.IsFemale, 'ей', 'ему' )] [ShowLocationName('safed')] и окрестные земли. [Select_CString(target_character.IsFemale, 'Она намерена', 'Он намерен' )] заселить их своими соотечественниками-изгнанниками и учредить там не только учебное заведение для постижения #TOOLTIP:RELIGION,$judaism_tt$,X #L иудаизма#!#!, но и шёлковое производство, подчинённое лишь нашей короне. Устремления у [Select_CString(target_character.IsFemale, 'неё', 'него' )] явно велики, а состояние, как отмечает казначей, под стать желаниям."
 d009_sephardi_diaspora.5.a: "Дадим [Select_CString(target_character.IsFemale, 'ей', 'ему' )] разрешение."
 d009_sephardi_diaspora.5.a.entry: "Позволим дону Иосифу Наси организовать переселение."
 d009_sephardi_diaspora.5.b: "Откажемся."
 d009_sephardi_diaspora.5.historical_info: "Дон Иосиф Наси, племянник и зять доньи Грасии, стал одним из самых доверенных советников султана Сулеймана Великолепного. В 1560-х годах ему были переданы во владение Тивериада и окрестные деревни с целью возродить город как центр поселения евреев и производства шёлка. И хотя при жизни дон Иосиф Наси достиг довольно скромных успехов на этом поприще, его проект часто рассматривают как одну из самых ранних попыток переселить евреев в этот регион."
 d009_sephardi_diaspora.6.title: "«Ливорнина»"
 d009_sephardi_diaspora.6.entry: "$d009_sephardi_diaspora.6.title$"
 d009_sephardi_diaspora.6.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашей державы составляет грамоту — так называемую «Ливорнину», которая откроет Ливорно для купцов из числа #TOOLTIP:RELIGION,$judaism_tt$,X #L иудеев#!#! и конверсо. Им обещают едва ли не самые щедрые условия во всех христианских державах: свободу вероисповедания, освобождение от обязанности носить отличительный знак, а также право торговать наравне с нашими подданными. Старые купеческие семьи Ливорно не слишком рады такой щедрости: им придётся считаться с конкуренцией."
 d009_sephardi_diaspora.6.a: "Издадим «Ливорнину»."
 d009_sephardi_diaspora.6.b: "Ограничим права иудеев на расселение."
 d009_sephardi_diaspora.6.historical_info: "В 1593 году Фердинандо I Медичи издал «Ливорнину», предложив еврейским и обращённым в христианство купцам крайне выгодные условия: освобождение от обязанности носить отличительный знак, свободу вероисповедания и равные с христианскими купцами права — всё это для того, чтобы превратить Ливорно в крупный торговый порт. Хартия оказалась на удивление эффективной, и впоследствии еврейская община Ливорно стала одной из самых процветающих и наименее притесняемых общин Италии раннего Нового времени."
 variable_d009_sephardi_diaspora_6_fired_tt: "Издана «Ливорнина»"
 d009_country_has_sephardi_pops_tt: "Наши земли — место проживания сефардского [Concept('pops', 'населения')|e]"
 d009_sephardi_diaspora.7.title: "[GetCountry('POR').GetAdjectiveWithNoTooltip]ая держава Амстердам"
 d009_sephardi_diaspora.7.entry: "$d009_sephardi_diaspora.7.title$"
 d009_sephardi_diaspora.7.desc: "Уже несколько лет подряд купцы из [GetCountry('POR').Custom('CL_GEN')], называющие себя просто португальской нацией, селятся в #TOOLTIP:LOCATION,amsterdam,X #L Амстердаме#!#!. Здесь они держатся особняком и свои обряды справляют за закрытыми дверями. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] прекрасно понимают то, о чём не принято говорить вслух: многие из этих купцов — евреи, и, похоже, никогда не переставали исповедовать свою веру. А состояния, которые они привозят с собой, весьма велики."
 d009_sephardi_diaspora.7.a: "Предоставим им свободу вероисповедания."
 d009_sephardi_diaspora.7.b: "Продолжим придерживаться старых ограничений."
 d009_sephardi_diaspora.7.historical_info: "Португальские крещёные евреи, называвшие себя португальской нацией, начали селиться в Амстердаме в 1590-х годах. Они открыто возвращались к исповеданию иудаизма после того, как власти Нидерландов стали терпимее относиться к их вере, хотя полное юридическое признание последовало лишь со временем. К середине XVII века сефардская община Амстердама стала одной из самых богатых и влиятельных еврейских общин Европы. Здесь действовала Португальская синагога и развивалась печатная промышленность, благодаря чему город превратился в крупный центр издания книг на иврите и ладино."
 variable_d009_amsterdam_jewish_nation_tt: "Еврейская португальская нация добилась признания в #TOOLTIP:LOCATION,amsterdam,X #L Амстердаме#!#!"
 d009_sephardi_diaspora.8.title: "Бразильцы-сефарды бегут в Новый Амстердам"
 d009_sephardi_diaspora.8.entry: "$d009_sephardi_diaspora.8.title$"
 d009_sephardi_diaspora.8.desc: "Завоевание #L [GetCountry('POR').GetAdjective|l]ими#! войсками наших заокеанских колоний вот-вот завершится, и #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардским#!#! купеческим семьям, которые долгие годы жили там под нашим флагом, останется одно: искать лучшей доли в других наших колониях. Некоторые уже отбыли и собираются селиться вокруг устья Северной реки в надежде, что свободы, которыми они пользовались в #TOOLTIP:LOCATION,amsterdam,X #L Амстердаме#!#!, сохранятся и в новых краях."
 d009_sephardi_diaspora.8.a: "Примем их в колонию."
 d009_sephardi_diaspora.8.b: "Позволим им селиться только в Европе."
 d009_sephardi_diaspora.8.historical_info: "После того как в 1654 году Португалия силой вернула себе голландскую Бразилию, группа из 23 евреев-сефардов бежала морем на север и поселилась в Новом Амстердаме. Они стали первыми еврейскими поселенцами в городе, который впоследствии был назван Нью-Йорком. Генерал-губернатор Питер Стёйвесант поначалу распорядился их изгнать, но его решение было отменено Голландской Вест-Индской компанией, в совете директоров которой состояли еврейские акционеры. Благодаря их решению эта крохотная община со временем выросла в одно из крупнейших еврейских сообществ в мире."
