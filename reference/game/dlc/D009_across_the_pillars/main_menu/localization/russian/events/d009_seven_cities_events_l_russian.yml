l_russian:
 seven_cities.10.title: "Сияющий град вдалеке"
 seven_cities.10.desc: "Когда на столе появляется вино и товары, местные проводники становятся разговорчивее. Да, о стране, о которой спрашивает [target_leader.GetName], они что-то слышали. Да, за следующим хребтом есть город — до него, говорят, ещё около двух недель пути. Один клянётся, что издали видел, как солнце встаёт над его стенами, отливающими золотом. Другой уверяет, что его дядя торговал там целый сезон и вернулся с немалым богатством. Третий фыркает: это всё сказки, а первые двое готовы наговорить чего угодно за кружку бренди. Хронист записывает каждое слово."
 seven_cities.10.a: "Нальём бренди тем, чьи рассказы будут интереснее всего."
 seven_cities.10.b: "Попрощаемся и пойдём дальше."
 seven_cities.10.b.tt: "#italic Мы прощаемся с рассказчиками и отправляемся в путь. Ногам мы доверяем больше, чем россказням#!"
 seven_cities.10.historical_info: "Первые испанские, французские и английские #italic энтрадас#! (экспедиции) в Америке почти полностью полагались на географические сведения, полученные от местных жителей. Но те нередко говорили лишь то, что, по их мнению, хотели услышать чужаки, а нередко и вовсе старались заставить незваных гостей уйти. При этом сами европейцы прибывали в Новый Свет в надежде найти здесь несметные богатства. Так возникал замкнутый круг: члены экспедиций искали подтверждение легендам о золотых городах, а местные жители, подстраиваясь под их ожидания, поддерживали эти мифы."
 natives_provide_crudely_drawn_map_tt: "#Y Местные жители дают нам примитивную карту окрестных земель#!"
 expedition_learns_of_potential_dangers: "#Y Члены [Concept('expedition', 'путешествия')|e] узнают о возможных опасностях#!"
 bonding_over_alcohol_locals_migrate_tt: "#Y Благодаря общей страсти к алкоголю и хорошей беседе возникли братские узы#!"
 improve_root_culture_view_of_location_dominant_culture_tt: "Наше [Concept('cultural_opinion', 'мнение')|e] о #L [target_location.GetDominantCulture.GetName|l]ой#! культуре улучшится"
 expedition_observes_local_innovations: "#Y Мы наблюдаем и описываем местные новшества#!"
 expedition_receives_artifacts_as_gifts: "#Y По возвращении в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! мы преподнесём дары — культурные артефакты#!"
 should_calamity_occur_chance_to_avoid_tt: "Местные разбойники и дикие звери будут менее опасными"
 may_bring_us_closer_to_uncovering_goal_tt: "Мы можем оказаться на шаг ближе к искомому"
 expedition_brought_back_riches_tt: "Участники [Concept('expedition', 'путешествия')|e] вернулись с богатствами:"
 expedition_brought_back_exotic_goods_tt: "Носильщики [Concept('expedition', 'путешествия')|e] вернулись с диковинными товарами:"
 expedition_brought_back_artifacts_tt: "Участники [Concept('expedition', 'путешествия')|e] вернулись с подарками и артефактами:"
 expedition_healer_joins_court_tt: "После возвращения участников [Concept('expedition', 'путешествия')|e] к нашему двору присоединяется целитель-туземец"
 porters_guides_prevent_stalling: "Сопровождающие участников [Concept('expedition', 'путешествия')|e] носильщики и проводники не дают ему задержаться"
 warned_expedition_avoids_calamity_tt: "Узнавшие о местных опасностях участники [Concept('expedition', 'путешествия')|e] избегают беды"
 seven_cities.11.title: "Приветственный пир"
 seven_cities.11.desc: "[target_location.GetRank.GetName|U] оказался готов встречать нас ещё до того, как мы успели разбить лагерь: звучит барабанный бой, площадь выметена дочиста, а на расстеленной рогоже — столько еды, сколько мы не видели за целый месяц похода. Вождь приветствует нас торжественно и учтиво, словно [target_leader.GetName] — ровня ему; прежде чем кто-то успевает задать хоть один вопрос, пир уже идёт вовсю. Наши переводчики вполголоса предупреждают: такой тёплый приём вряд ли будет бескорыстным. Щедрое угощение сегодня могут припомнить уже завтра и потребовать какую-либо услугу взамен. Однако гостеприимство и ломящийся от угощений стол нередко развязывают языки лучше любых угроз."
 seven_cities.11.a: "Наши объятия — и кошельки — всегда раскрыты для щедрых хозяев."
 seven_cities.11.b: "Мы не для того пересекли океан, чтобы набивать здесь брюхо."
 seven_cities.11.b.tt: "#italic Мы принимаем угощение, но держим кошельки закрытыми и отправляемся в путь, пока гостеприимство не обернулось долгом#!"
 seven_cities.11.historical_info: "Отношения коренных жителей Америки с европейцами во многом строились на церемониальном гостеприимстве: прибывших нередко встречали пиршествами, подарками и торжественным приёмом ещё до начала каких-либо переговоров. Пуэбло предоставляли людям Коронадо кров и стол в своих поселениях вдоль Рио-Гранде, а отряд де Сото останавливался у вождей миссисипских народов на юго-востоке. В обоих случаях такое гостеприимство вовсе не означало покорность, а помогало держать опасных чужаков в узде. Европейцы брали с собой стеклянные бусы, соколиные колокольчики, ткани и ножи, чтобы обмениваться ими с туземцами в подобных встречах. Подарки помогали расположить к себе собеседников и получить нужные сведения, но смысл происходящего каждая сторона понимала по-своему."
 expedition_receives_guides_and_porters: "#Y В путешествии будут участвовать проводники и носильщики#!"
 expedition_less_likely_to_stall_tt: "Вероятность задержки [Concept('expedition', 'путешествия')|e] снижается"
 expedition_receives_exotic_goods: "#Y Участники [Concept('expedition', 'путешествия')|e] выменивают у местных экзотические товары, которые привезут домой#!"
 seven_cities.12.title: "Рьяный проводник"
 seven_cities.12.desc: "Он находит нас первым — худощавый улыбчивый мужчина, немного говорящий, кажется, на каждом языке, что распространены в этих краях. Прижав руку к сердцу, он клянётся, что своими глазами видел ворота золотого города. Он готов проводить нас туда и просит лишь плату за услуги проводника и чуточку почёта. [target_leader.GetName] слушает его настороженно: мы уже слышали подобные заявления — пусть в других местах и от других людей, но слова были те же самые. Однако отряд, похоже, уже всё решил, и глаза у людей горят ничуть не слабее, чем у самого проводника."
 seven_cities.12.a: "Вперёд, к богатству и славе!"
 seven_cities.12.b: "Прочь отсюда, попрошайка!"
 seven_cities.12.b.tt: "#italic Мы прогоняем улыбчивого проводника и продолжаем идти по тропе, которую пока разбираем сами#!"
 seven_cities.12.historical_info: "Самый печально известный проводник из всех, которых нанимали #italic энтрады#! в Северную Америку, — индейский пленник, которого испанцы прозвали Эль Турко. Он рассказал экспедиции Коронадо о Кивире — лежащем далеко на северо-востоке царстве, где якобы всё сделано из золота. Несколько недель он вёл отряд всё дальше в глубь Великих равнин, а позже на допросе признался, что намеренно заводил испанцев в степь, надеясь, что там погибнут и люди, и лошади. Когда экспедиция наконец достигла Кивиры, вместо золотого царства она обнаружила лишь несколько поселений уичита с земляными хижинами — и ни следа золота. Эль Турко казнили. Этот случай был далеко не единственным: у местных проводников были свои причины заводить вооружённых чужаков подальше, и эти причины далеко не всегда совпадали с целями экспедиции."
 expedition_uncovers_riches_in_new_waypoint: "#Y Указанная проводником тропа приводит к настоящим богатствам#!"
 expedition_led_to_deathly_trap: "#Y Проводник заводит нас в засаду, и члены [Concept('expedition', 'путешествия')|e] гибнут#!"
 guide_lied_waste_of_time: "#Y Проводник водит нас кругами; золотой город — это миф#!"
 target_character_flogged_tt: "Солгавший проводник высечен за обман"
 seven_cities.13.title: "Знакомый язык"
 seven_cities.13.desc: "В этом походе [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'изменилась', 'изменился' )] почти до неузнаваемости. Если раньше [Select_CString(target_leader.IsFemale, 'её', 'его' )] мысли были заняты только городом, что ждёт впереди, то теперь в них нашлось место и местным жителям: их языку, уже частично выученному; их гостеприимству; их оседлому укладу, столь притязательному — лишь бы закончились странствия… Этим утром [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'заявила', 'заявил' )]: пусть остальные идут вперёд, если желают; [Select_CString(target_leader.IsFemale, 'она', 'он' )] же остаётся здесь. Иных дикая природа губит по-своему: она становится невероятно притягательной."
 seven_cities.13.a: "Тогда пусть остаётся, а вместе с [Select_CString(target_leader.IsFemale, 'ней', 'ним' )] умрёт мечта."
 seven_cities.13.historical_info: "Европейцы, пережившие кораблекрушение или плен и прожившие долгие годы среди местных народов, особенно ценились последующими экспедициями как переводчики и проводники. Такая судьба, например, постигла Хуана Ортиса — одного из немногих выживших участников экспедиции Нарваэса: он прожил в плену флоридского племени узита около 11 лет, а затем служил переводчиком при де Сото и оставался с ним до самой его смерти. Другая участь ждала Гонсало Герреро: в 1511 году он потерпел кораблекрушение у берегов Юкатана, женился на женщине из народа майя, отказался возвращаться на родину и, согласно свидетельствам, погиб в бою с испанцами. Такие люди становились живыми звеньями между двумя мирами — Старым и Новым, но не всегда они хранили верность своему родному миру."
 seven_cities.14.title: "Источник вечной молодости?"
 seven_cities.14.desc: "Из третьих уст до нас доходит весть, с каждым пересказом становящаяся всё удивительнее. Говорят, где-то в холмах дальше по пути есть родник, вода из которого затягивает старые раны, распрямляет сгорбленные спины и даже возвращает человеку годы, отнятые походом. Местные рассказывают об этой чудодейственной воде с такой почтительностью, с какой у нас обычно рассказывают о святых местах. То ли это и правда признак чуда, то ли они просто пытаются нас обдурить. Лекарь закатывает глаза и бормочет что-то про болотную лихорадку, а половина лагеря уже наполняет бурдюки."
 seven_cities.14.a: "Осмотрим источник."
 seven_cities.14.b: "Нам некогда плескаться!"
 seven_cities.14.b.tt: "#italic Мы проходим мимо «чудодейственного» источника; пусть его воды исцеляют доверчивых#!"
 seven_cities.14.historical_info: "Легенда об источнике вечной молодости — один из многочисленных мифов, которые европейцы привезли с собой в Америку. Со временем его распространение начали связывать с экспедицией Хуана Понсе де Леона во Флориду в 1513 году. Однако рассказы о том, будто он специально отправился туда на поиски чудодейственной воды, вероятно, распространяли политические противники де Леона. Сама легенда восходит к древним европейским мифам о целебных источниках, способных возвращать силы и продлевать жизнь, — и многие верили в их существование. Коренные жители Карибского бассейна и юго-востока Америки действительно показывали европейцам священные и целебные источники, важные для их обрядов и верований, но их рассказы совсем не отвечали ожиданиям пришельцев."
 spend_some_time_recovering: "#Y Люди отдыхают и ненадолго погружаются в воду#!"
 retrieve_some_rejuvenating_water: "#Y Отряд наполняет бурдюки чудесной водой#!"
 just_water_hole: "#Y Чудесный родник оказался вполне обычным…#!"
 seven_cities.15.title: "Блеск в реке"
 seven_cities.15.desc: "На закате кто-то из отряда, присев на берегу ручья, промывает грунт через лоток, как учили бывалые старатели. Несколько минут труда — и он разражается смехом вперемешку с ругательствами: в иле блестит [target_material.GetName|l]! Пусть всего одна крупица, но всё-таки это означает, что выше по течению ценной добычи может оказаться больше. Однако действительно ли это то самое сокровище, ради которого мы пересекли континент, или же блеск песка просто затмил глаза жадному дураку, сегодня никто сказать не может, да и не хочет."
 seven_cities.15.a: "Каждому в руки по лотку — и к реке!"
 seven_cities.15.b: "Всего-то золотая обманка!"
 seven_cities.15.historical_info: "С 20-х годов XVI века легенда о #italic Сьерра-де-ла-Плата#! — Серебряной горе — всё чаще манила испанские и португальские экспедиции вглубь бассейна Рио-де-ла-Плата. Именно от названия мифической горы получила своё имя река, а впоследствии — и государство. Легенда не была совсем беспочвенной: в Андах, прежде всего в Потоси, действительно таились огромные залежи серебра. Открытие здесь в 1545 году серебряного рудника перевернуло всю мировую экономику. Впрочем, участники первых экспедиций, продвигавшихся вверх по реке, находили что угодно, только не серебро: трудности, беды, болезни и даже смерть. Легендарная гора, казалось, была недостижима, и зачастую единственным подтверждением её существования становилась лишь горстка металла, намытого из речного русла."
 expedition_brings_back_valuable_materials: "#Y Ценная руда извлекается и отправляется на рынок #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_GEN')|L]#!#!#!"
 study_their_technique: "#Y Мы осваиваем новые методы добычи; расширение шахт становится дешевле, а наши лучшие залежи обогащаются#!"
 men_are_met_by_hunger_and_false_legends: "#Y Реки питают нас лишь ложными надеждами#!"
 expedition_outcome_severely_hindered_tt: "Мы упускаем одну из зацепок, за которую так боролись"
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "#italic Мы прекращаем искать металл и идём дальше#!"
 seven_cities.16.title: "Гостеприимный вождь"
 seven_cities.16.desc: "[target_location.GetRank.GetName|U] удивляет нас своими размерами и ухоженностью. Местный вождь принимает нас настороженно, но вежливо, причём эта вежливость явно даётся ему нелегко. Его амбары ломятся от припасов, а местная молодёжь знает тропы, ведущие вглубь материка, как свои пять пальцев. Но главное: вождь наверняка попытается спровадить нас к утру. Наши офицеры окидывают взглядом амбары и крепких юношей — возможных будущих проводников и носильщиков. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, стоит ли попробовать договориться или же лучше будет взять всё нужное силой, а с последствиями пусть разбирается тот, кто придёт сюда после нас."
 seven_cities.16.a: "Схватим вождя и погоним его людей перед собой, угрожая им копьями."
 seven_cities.16.b: "Договоримся, чтобы к нам присоединились носильщики-добровольцы, и расстанемся по-дружески."
 seven_cities.16.c: "Не будем им досаждать. Свернём лагерь и отправимся дальше."
 seven_cities.16.c.tt: "#italic Мы оставляем вождя в покое и идём дальше, не взяв с собой ни заложников, ни носильщиков#!"
 the_captive_chief_yields_guides: "#Y Пленный вождь даёт нам проводников, которые знают ведущие вглубь материка тропы#!"
 the_chiefs_hall_is_plundered: "#Y Перед тем как отправиться дальше, мы выносим все предметы роскоши из покоев вождя#!"
 the_village_empties_before_us: "#Y За ночь [target_location.GetRank.GetName] словно растворяется в лесу — вместе с проводниками и другими жителями#!"
 coerced_locals_resent_us_tt: "Наше [Concept('cultural_opinion', 'мнение')|e] о #L [target_location.GetDominantCulture.GetName|l]ой#! культуре ухудшится"
 seven_cities.16.historical_info: "Передвигаться по юго-востоку континента Эрнандо де Сото предпочитал так: войдя в новое владение, его отряд брал местного #italic касика#! — верховного вождя — в заложники, чтобы на предстоящем этапе похода обеспечить себя продовольствием, носильщиками и проводниками. На границе его владений пленника отпускали или обменивали на соседнего вождя, после чего всё повторялось. На какое-то время такой способ приносил результат, однако вскоре туземцы возненавидели де Сото: его люди разоряли общины и разрушали союзы. К тому же эта тактика быстро теряла эффективность там, где власть была не сосредоточена в руках отдельных миссисипских вождей, а распределена более равномерно."
 seven_cities.17.title: "Послание с побережья"
 seven_cities.17.desc: "Местные жители, обитатели побережья, подплывают к нам на лодке ещё до того, как якорь нашего корабля успевает коснуться дна. К полудню уже вовсю идёт обмен: они охотно выменивают наши товары на рыбу и свежие фрукты. Судя по тому, как у них развязались языки, такие встречи для них не в новинку. За нож или отрез ткани они готовы рассказать, что находится за опушкой, и даже показать жестом: вам — туда, вглубь. Но прямо сейчас невозможно понять, сколько правды в их словах, и не хотят ли они просто сдать нас соседям."
 seven_cities.17.a: "Устроим обмен, чтобы выяснить, что находится в глубине материка."
 seven_cities.17.b: "Занесём эту стоянку в журнал и продолжим поход."
 seven_cities.17.b.tt: "#italic Мы отмечаем стоянку на картах и продолжаем поход, избегая слухов#!"
 the_shore_folk_point_the_way: "#Y Береговой народ помогает нам найти путь к искомому#!"
 the_shore_market_yields_goods: "#Y После торговли на берегу наши трюмы пополняются местными товарами#!"
 the_shore_folk_send_us_at_their_rivals: "#Y Послушав их, мы ходим кругами и наконец выходим к деревне их соперников#!"
 may_bring_us_closer_and_fill_our_holds_tt: "Мы можем оказаться на шаг ближе к искомому, а заодно пополнить трюмы местными товарами"
 seven_cities.17.historical_info: "Береговые народы обычно первыми встречали европейские экспедиции и становились их главным источником сведений о землях в глубине материка. Контакты Верраццано и Картье с обитателями побережья Северной Атлантики, первые высадки испанцев в Карибском море и встречи португальцев с жителями Бразилии проходили примерно одинаково: осторожный обмен, тщательное изучение друг друга, расспросы о том, что находится дальше от берега. Нередко местные жители советовали пришельцам двигаться вглубь материка — так они могли избавиться от незваных гостей, а заодно учинить неприятности своим соперникам, к которым и направляли участников экспедиций. Рассказам береговых народов редко можно было верить: мало кто искренне желал помогать европейцам."
 seven_cities.18.title: "Укрытие в гавани"
 seven_cities.18.desc: "Эта гавань — подлинный рай для усталого и измученного моряка: глубокая, надёжно укрытая от непогоды, располагающая запасами пресной воды — та скапливается у берега, достаточно широкого, чтобы можно было вытащить корабли на сушу и очистить корпуса от гнили. Команде нужен отдых не меньше, чем кораблям — ремонт. Впрочем, не стоит слишком долго задерживаться на берегу: в этих краях мы — чужаки, а потому рискуем навлечь на себя неприятности. [target_leader.GetName] взвешивает все «за» и «против»: остаться на несколько дней, чтобы как следует заняться кораблями, — или понадеяться, что корпуса выдержат, и отправиться дальше, пока заскучавшая команда не устроила что-нибудь неразумное?"
 seven_cities.18.a: "Вытащим корабли на берег и пополним запасы провизии."
 seven_cities.18.b: "Отдохнём одну ночь и пойдём дальше."
 seven_cities.18.b.tt: "#italic Мы даём команде одну ночь отдыха и выходим в море, пока корабли не увязли в песке#!"
 the_refit_goes_smoothly: "#Y Ремонт проходит гладко, и корабли становятся послушнее#!"
 a_wreck_yields_salvage: "#Y Команды разбирают гниющий на мелководье корабль, забирая всё, что может пригодиться#!"
 the_crew_falls_to_brawling: "#Y Заскучавшая на берегу команда устраивает драки, и на восстановление порядка уходит несколько дней#!"
 seven_cities.18.historical_info: "Для любой экспедиции, которая хотя бы частично шла морем, мало что представляло такую же ценность, как хорошая защищённая гавань: здесь можно было вытащить корабли на берег, осмотреть и починить корпуса, пополнить запасы пресной воды и дров и дать командам отдохнуть после тяжёлого перехода. Так, флот Магеллана провёл пять месяцев на зимовке в Пуэрто-Сан-Хулиане у берегов Патагонии. Вынужденная стоянка привела к мятежу, который Магеллан подавил с большой жестокостью. В таких местах мореплаватели нередко проводили на ремонте и подготовке к дальнейшему походу больше времени, чем в море. Удачно выбранная гавань и отношения с местными жителями могли определить судьбу всей экспедиции — продолжит ли она путь или закончится катастрофой. Поэтому выбрать, где остановиться, порой было не менее важно, чем решить, куда двигаться дальше."
 seven_cities.20.title: "Здесь нам не прокормиться"
 seven_cities.20.desc: "Сведения оказались ложными: эти края гораздо более засушливые и бесплодные, чем нам обещали. Вьючные животные уже не выдерживают перехода, а люди одиннадцатый день сидят на урезанном пайке. Местные жители прячут либо сжигают запасы пищи, лишь бы не делиться с нами. Даже пресная вода здесь — большая редкость: она есть только в трети пересекаемых нами долин. [target_leader.GetName] собирает офицеров у колючего кустарника, кое-как защищающего от ветра, и спрашивает, сколько ещё отряд сможет продержаться без пополнения провизии."
 seven_cities.20.a: "Купим припасы, сколько бы они ни стоили."
 seven_cities.20.b: "Остановимся и дадим людям отдохнуть."
 seven_cities.20.historical_info: "Главной заботой экспедиций вглубь Америки всегда было снабжение. Армия Кортеса во многом держалась благодаря распаду ацтекской державы: тлашкальтеки и другие союзники взяли на себя содержание конкистадора. У отряда Коронадо на юго-западе таких союзников не было, и по мере продвижения на север голодная смерть становилась всё более частым явлением. Такая картина наблюдалась повсюду, от Флориды до Патагонии: любая #italic энтрада#!, неспособная добывать или покупать продовольствие по пути, рано или поздно начинала терять людей прямо на марше, сколько бы золота ни ждало впереди."
 seven_cities.21.title: "Засада в каньоне"
 seven_cities.21.desc: "Отряд оказался в узком ущелье между двумя известняковыми склонами. Ведущая вперёд дорога перекрыта, сверху сыплется град стрел, впереди нас ждут воины с каменными дубинками, и вьючные животные в панике разбегаются. Наши воины тут же прижимаются к склону и смыкают строй, ощетинившись пиками. [target_leader.GetName] совещается с сержантами. Нужно решить, пробиваться ли через врагов, рискуя понести потери, или же попытаться отступить по той же дороге, что привела нас сюда, и найти обход."
 seven_cities.21.a: "Будем пробиваться с помощью стали и пороха."
 seven_cities.21.b: "Отступим и найдём другой путь."
 seven_cities.21.historical_info: "Самым действенным для коренных народов способом противостоять первым колониальным #italic энтрадам#! оказались засады в удобной для обороны местности: узких ущельях, горных проходах, лесных тропах. Наличие доспехов, огнестрельного оружия и лошадей делало испанцев непобедимыми на открытой местности, но вблизи их преимущества быстро сходили на нет. Европейцы были вынуждены искать обходные пути — так, около половины походов Коронадо на юго-запад материка проходило в обход земель, где его отряд был бы в опасности. По той же причине до XVIII века одна за другой проваливались попытки французов и англичан проникнуть в глубь Северной Америки."
 seven_cities.22.title: "Древние развалины"
 seven_cities.22.desc: "Тропа выходит на вершину хребта, и перед нами открывается вид на заброшенный город. Каменные стены ещё стоят, но крыши почти везде обрушились, а улицы заросли столетними деревьями. Здесь никого нет — судя по всему, уже много лет. Разведчики осторожно обходят город вокруг, не рискуя подходить ближе. Хронист принимается за зарисовку, а священник погружается в размышления, стоит ли ступать на улицы мёртвого города: говорят, осквернившие подобное место могут навлечь на себя болезнь. [target_leader.GetName] даёт рисовальщику час на работу."
 seven_cities.22.a: "Опишем руины перед тем, как двинуться в путь."
 seven_cities.22.historical_info: "Доколумбова Америка была усеяна заброшенными поселениями: на юго-востоке — миссисипские курганы, на юго-западе — большие дома пуэбло, Чако, бассейн Тиуанако в Андах, на юге — города майя. Европейские первопроходцы XVI века, изучавшие континент, нередко обнаруживали каменные сооружения, земледельческие террасы и места для проведения церемоний, покинутые за много лет (иногда — более чем за век) до их прибытия. Уже к сороковым годам XVI столетия в Европе получила распространение теория, что подобные руины могли быть наследием исчезнувшего народа европейского или средиземноморского происхождения — валлийцев, финикийцев или потерянных колен Израиля. В некоторых кругах эти представления сохранялись до XX века."
 seven_cities.30.title: "Тропа ведёт в никуда"
 seven_cities.30.desc: "Отряд добрался до места, где, если верить проводникам, нам должна открыться долгожданная страна… Однако здесь ничего нет. Проводники либо солгали, либо сами поверили своим россказням: осмотр окрестных холмов не выявил никаких признаков жизни — ни городов, ни дыма из труб, ни дорог, ни малейших следов людей. [target_leader.GetName] пишет короне письмо с просьбой прислать дальнейшие распоряжения, но через какое-то время сминает и выбрасывает письмо: когда оно достигнет ближайшего порта, отряд уже сам решит, как поступать. Выбор невелик: либо идти дальше, надеясь, что город уже близко, либо развернуться и возвращаться домой с тем немногим, что удалось найти."
 seven_cities.30.a: "Мы упрямо пойдём вперёд."
 seven_cities.30.b: "Мы развернёмся и представим честный доклад."
 seven_cities.30.historical_info: "Неудачные #italic энтрады#! редко заканчивались гибелью отряда в бою. Причины провалов были менее романтичными: запасы истощались, разведчики заболевали или дезертировали, ориентиры оказывались либо неверно понятыми, либо просто выдуманными. В конце концов уцелевшим офицерам не оставалось ничего другого, как развернуться и повести людей обратно по безлюдным, как они теперь уже знали, территориям. Именно так (в той или иной степени) закончились экспедиции Коронадо, Кабрильо, де Сото и сплавлявшегося вниз по течению Амазонки Агирре. Успешные #italic энтрады#!, руководители которых имели столь же грандиозные замыслы, были настолько редки, что о них помнили ещё многие столетия."
