l_russian:
 d009_sephardi_morocco.1.title: "Прибытие #italic мегорашим#!"
 d009_sephardi_morocco.1.entry: "$d009_sephardi_morocco.1.title$"
 d009_sephardi_morocco.1.desc: "Вот уже несколько месяцев в наши атлантические порты прибывают беженцы из [origin_country.Custom('CL_GEN')], называющие себя #italic мегорашим#!, изгнанными. Они просят выделить им квартал и предоставить синагогу для молитв. В #TOOLTIP:LOCATION,fez,X #L Фесе#!#! уже есть старая, устоявшаяся #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейская#!#! община, тошавим, представители которой не вполне уверены, хотят ли они делить город, суды и обычаи с вновь прибывшими, которые говорят на другом языке и следуют иным обычаям."
 d009_sephardi_morocco.1.a: "Поприветствуем их в Фесе."
 d009_sephardi_morocco.1.b: "Пусть не покидают пределов Тетуана."
 d009_sephardi_morocco.1.historical_info: "Альгамбрский эдикт и его португальский аналог привели к изгнанию десятков тысяч евреев в Магриб. Те из них, кто осел в Марокко, назвали себя #italic мегорашим#!, изгнанными, чтобы отделить себя от #italic тошавим#!, коренных марокканских еврейских общин, живших здесь задолго до 1492 года. Эти две группы в основном проживали в Фесе и Тетуане и в течение многих поколений сохраняли раздельные идентичности, а подчас и разные законы."
 d009_sephardi_morocco.2.title: "#italic Мегорашим#! против #italic тошавим#!"
 d009_sephardi_morocco.2.entry: "$d009_sephardi_morocco.2.title$"
 d009_sephardi_morocco.2.desc: "Два #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейских#!#! суда в #TOOLTIP:LOCATION,fez,X #L Фесе#!#! наконец-то столкнулись между собой. Раввин #italic мегорашим#! настаивает, что их [GetCountry('CAS').GetAdjectiveWithNoTooltip|l]ие обычаи, проверенных столетиями жизни в [GetCountry('CAS').Custom('CL_PREP')], куда лучше подходят для торговли и договоров, чем старые обряды #italic тошавим#!. Естественно, #italic тошавим#! не согласны, и обе общины обратились к нам, чтобы разрешить спор, ну или хотя бы перестать делать вид, что он разрешится сам собой."
 d009_sephardi_morocco.2.a: "Навязать #italic такканот#! Феса."
 d009_sephardi_morocco.2.b: "Придерживаться обрядов #italic тошавим#!."
 d009_sephardi_morocco.2.c: "Настаивать на сосуществовании."
 d009_sephardi_morocco.2.historical_info: "Настоящие #italic такканот де Фес#! представляли собой сборник общинных указов, издававшихся раввинами #italic мегорашим#! с 1494 года. Постепенно на их основе сформировалась господствующая версия законов Феса, вдохновлённых кастильскими. #italic Тошавим#! при этом никуда не делись, и две общины на протяжении поколений имели разные синагоги, суды и кладбища. Потребовалось больше столетия, чтобы различия между ними размылись, уступив место единой фесской еврейской общине."
 d009_sephardi_morocco.3.title: "Город изгнанников"
 d009_sephardi_morocco.3.entry: "$d009_sephardi_morocco.3.title$"
 d009_sephardi_morocco.3.desc: "Город [ShowLocationName('tetouan')] десятилетиями лежал в руинах, пока #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусские#!#! и #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардские#!#! изгнанники из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! не восстановили его совместными усилиями. Оставленное ими наследие ничуть не померкло. Улицы, ремёсла и речь, звучащая в городе, несут в себе узнаваемый оттенок Иберии, который редко встретишь в других городах этого побережья. Мы можем направить силы на укрепление этой идентичности или рассматривать Тетуан просто как ещё один порт."
 d009_sephardi_morocco.3.a: "Поддержим сефардский стиль Тетуана."
 d009_sephardi_morocco.3.b: "Это просто ещё один город."
 d009_sephardi_morocco.3.historical_info: "В XV веке кастильские войска разрушили Тетуан. Восстановление города началось значительно позже, одновременно с заселением его изгнанными в 1492 году андалузскими мусульманами и евреями-сефардами. Тетуан, в котором зародился новый иудейско-испанский диалект — #italic хакетия#!, на протяжении многих веков оставался одним из тех марокканских городов, которые сохранили на себе видимый отпечаток иберийской культуры. Еврейское население Тетуана и сегодня тщательно оберегает этот дух."
 d009_sephardi_morocco.4.title: "Придворные евреи-Саадиты"
 d009_sephardi_morocco.4.entry: "$d009_sephardi_morocco.4.title$"
 d009_sephardi_morocco.4.desc: "Сегодня [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] в #TOOLTIP:LOCATION,marrakesh,X #L Марракеше#!#! принимает у себя гостя по имени [target_character.GetName]; [Select_CString(target_character.IsFemale, 'она', 'он' )] — лекарь и учёный #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейского#!#! толка. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашей династии происходит из семейства, на протяжении поколений пользующегося услугами иудейских дельцов и посредников для заключения сделок с #TOOLTIP:RELIGIONGROUP,christian,X #L христианскими#!#! державами Атлантики, и нет никакой причины рушить этот порядок; впрочем, с этим согласится далеко не каждый придворный чиновник."
 d009_sephardi_morocco.4.a: "Назначим [Select_CString(target_character.IsFemale, 'её', 'его' )] на придворную должность."
 d009_sephardi_morocco.4.a.entry: "Назначим его на придворную должность."
 d009_sephardi_morocco.4.b: "Будем полагаться только на исламских купцов."
 d009_sephardi_morocco.4.historical_info: "Султаны династии Саадитов, в том числе и знаменитый Ахмад аль-Мансур, нередко обращались к иудеям за помощью в придворных, финансовых и дипломатических вопросах, например для налаживания торговли и ведения переговоров с Англией, Голландией и другими державами, чьи интересы касались Атлантики. Двигателем этих отношений частично выступали ресурсы — сахар и селитра, торговля которыми в немалой степени пополняла саадитскую казну. Это событие отображает скорее общие тенденции двора, чем карьеру какой-либо исторической личности."
 d009_sephardi_morocco.5.title: "Выкуп пленников"
 d009_sephardi_morocco.5.entry: "$d009_sephardi_morocco.5.title$"
 d009_sephardi_morocco.5.desc: "После подписания мира с [GetCountry('POR').Custom('CL_INST')] в темницах #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! осталось целое множество [GetCountry('POR').GetAdjectiveWithNoTooltip|l]их пленных. Наши #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейские#!#! купцы — обширности их торговых связей, охватывающих пролив, позавидует любой чиновник — предложили своё посредничество при выкупе. Такое дело сулит значительную выгоду, так стоит ли поручать его людям, которым [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] и поныне доверяет не в полной степени?"
 d009_sephardi_morocco.5.a: "Обеспечить выкуп с помощью иудейских посредников."
 d009_sephardi_morocco.5.b: "Выкупить пленников только через исламских посредников."
 d009_sephardi_morocco.5.historical_info: "В 1578 году Саадиты одержали победу над португальскими войсками при Эль-Ксар-эль-Кебире (Алькасарквивире). Хорошо задокументирована роль проживавших в Марокко иудейских купцов, поспособствовавших выкупу пленных португальских дворян и воинов. Для посредников эта сделка оказалась крайне прибыльной, пусть и дипломатически щекотливой: их торговые связи охватывали обе стороны пролива. Это событие в общем виде отображает их роль в марокканско-португальских конфликтах в целом, а не только после битвы 1578 года."
 d009_morocco_has_jewish_pops_tt: "Наши земли — место проживания иудейского [Concept('pops', 'населения')|e]"
 d009_sephardi_morocco.6.title: "Мелла в Мекнесе"
 d009_sephardi_morocco.6.entry: "$d009_sephardi_morocco.6.title$"
 d009_sephardi_morocco.6.desc: "[Select_CString(target_character.IsFemale, 'Известная', 'Известный' )] в определённых кругах финансист [target_character.GetName] выступает с предложением: пусть [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] своим указом учредит #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейский#!#! квартал в пределах непосредственно #TOOLTIP:LOCATION,meknes,X #L Мекнеса#!#! — с собственной хартией, рыночными правами и судами. По [Select_CString(target_character.IsFemale, 'её', 'его' )] словам, такое решение окупится сторицей, ведь тогда в новой столице начнут селиться иудейские купцы, которые будут платить налоги и пошлины."
 d009_sephardi_morocco.6.a: "Выпустим указ."
 d009_sephardi_morocco.6.b: "Столица — не для евреев."
 d009_sephardi_morocco.6.historical_info: "При султане Мулае Исмаиле город Мекнес был объявлен столицей империи. Сам султан — выходец из династии Алауитов — в вопросах пополнения казны и ведения торговли в Атлантике полагался на услуги финансистов-иудеев, самый знаменитый из которых, Иосиф Маймаран, среди марокканских евреев считается одним из важнейших людей, когда-либо имевших доступ к финансам Мекнеса. В ходе превращения города в столицу империи в нём был основан еврейский квартал — мелла."
 d009_sephardi_morocco.7.title: "Корсар-дипломат Шмуэль Палаче"
 d009_sephardi_morocco.7.entry: "$d009_sephardi_morocco.7.title$"
 d009_sephardi_morocco.7.desc: "[target_character.GetName] ведёт двойную жизнь: сегодня этот человек по нашему поручению обсуждает с [GetCountry('HOL').Custom('CL_INST')] торговые привилегии, а завтра во главе эскадры корсаров устраивает налёт на испанские и [GetCountry('POR').GetAdjectiveWithNoTooltip|l]ие суда, не имея на то нашего указания. [Select_CString(target_character.IsFemale, 'Она', 'Он' )] утверждает, что оба этих занятия служат одной и той же цели, и с этим сложно поспорить, ведь наша казна стремительно пополняется."
 d009_sephardi_morocco.7.a: "Наймём его официально."
 d009_sephardi_morocco.7.b: "Пусть и дальше действует с молчаливого согласия."
 d009_sephardi_morocco.7.historical_info: "Шмуэль Палаче — марокканский еврей, дипломат, в начале XVII века служивший послом в Голландии при дворе Саадитов. При его посредничестве было заключено одно из первых в истории Марокко соглашений с европейской державой, имеющей выход к Атлантике. При этом Палаче имел каперские грамоты, дававшие ему разрешение грабить испанские суда. Пират-дипломат неизменно вызывал при европейских дворах скандалы одним своим появлением."
 d009_sephardi_morocco.8.title: "[ShowLocationNameWithNoTooltip('tangier')] под [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой властью"
 d009_sephardi_morocco.8.entry: "Танжер под новой властью"
 d009_sephardi_morocco.8.desc: "Нашей короне сегодня принадлежит не только #TOOLTIP:LOCATION,tangier,X #L Танжер#!#!: одновременно с ним мы обрели, неожиданно для самих себя, власть над #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейской#!#! общиной — единственной во всех наших владениях. Мы оказались в неудобном положении, поскольку наше королевство уже много десятилетий не пускает к себе иудейских переселенцев. Мнения нашего совета по вопросу, как теперь поступать, разделились."
 d009_sephardi_morocco.8.a: "Будем терпеть эту общину."
 d009_sephardi_morocco.8.b: "Изгнать их!"
 d009_sephardi_morocco.8.b.tt: "Иудейская община выгнана из Танжера"
 d009_sephardi_morocco.8.historical_info: "В 1661 году Екатерина Брагансская вышла замуж за английского короля Карла II. В качестве приданого английская корона получила Танжер — город с небольшой еврейской общиной, на то время единственной из всех, что когда-либо находились под властью англичан: в 1290 году евреи были изгнаны из Англии, и вернуться в страну они смогли только в 1656 году."
 d009_sephardi_morocco.9.title: "[ShowLocationNameWithNoTooltip('mogador')]: купцы султана"
 d009_sephardi_morocco.9.entry: "$d009_sephardi_morocco.9.title$"
 d009_sephardi_morocco.9.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашей державы собирается построить новый порт в месте, что называется [ShowLocationName('mogador')]. Указ уже подписан, и вскоре на пустом берегу вырастет грандиозное сооружение, уже, впрочем, вызвавшее скандал: [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] хочет сделать торговлю в Атлантике исключительным правом горстки влиятельных #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейских#!#! семейств; в обмен на эту привилегию те поклянутся в верности и обеспечат доступ к своему капиталу. Торговцы, оставшиеся за бортом, выразили своё отношение к подобной затее громко и однозначно."
 d009_sephardi_morocco.9.a: "Предоставить [Select_CString(CHARACTER.IsFemale, 'ей', 'ему' )] монополию!"
 d009_sephardi_morocco.9.b: "Предоставить всем купцам равные права на торговлю."
 d009_sephardi_morocco.9.historical_info: "В 60-х годах XVIII века султан Мохаммед III основал портовый город Могадор, служивший одной цели — торговле с Европой и другими державами, имеющими выход к Атлантике. По его указу некоторые иудейские купеческие семьи, так называемые #italic туджар ас-султан#! — «купцы султана», получили исключительное право на ведение такой торговли и были освобождены от налогов. Благодаря такому соглашению община могадорских купцов-иудеев стала одной из самых процветающих в Марокко."
 d009_sephardi_morocco.10.title: "Мелла в Фесе"
 d009_sephardi_morocco.10.entry: "$d009_sephardi_morocco.10.title$"
 d009_sephardi_morocco.10.desc: "#TOOLTIP:RELIGION,$judaism_tt$,X #L Иудейская#!#! община #TOOLTIP:LOCATION,fez,X #L Феса#!#! уже много десятилетий подряд, как и любая другая община, живёт вразброс, не зная единства. Наши чиновники предлагают следующее: пусть [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] подпишет указ о выделении этим людям отдельного обнесённого стеной квартала, с собственной хартией, рынком и воротами. Сторонники такого подхода утверждают, что действуют ради защиты иудеев, противники же выбирают куда более жёсткие выражения."
 d009_sephardi_morocco.10.a: "Создать меллу."
 d009_sephardi_morocco.10.a.tt: "Иудейская община Феса собрана в одном обнесённом стенами квартале"
 d009_sephardi_morocco.10.b: "Пусть живут свободно."
 d009_sephardi_morocco.10.historical_info: "В 1438 году в городе Фес была построена мелла — первый еврейский квартал в Марокко, послуживший образцом для строительства других, более мелких еврейских кварталов по всей стране в последующие столетия. Сведения о создании меллы расходятся: по некоторым данным, она строилась из соображения защиты еврейского населения от излишне ретивого крепостного гарнизона, по другим — это был первый шаг к сегрегации. На самом деле весьма вероятно, что имели место оба подхода сразу."
