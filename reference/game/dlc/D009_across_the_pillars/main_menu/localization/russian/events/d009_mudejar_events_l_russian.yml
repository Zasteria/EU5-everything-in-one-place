l_russian:
 d009_mudejar.1.title: "Хартия альхамы"
 d009_mudejar.1.entry: "$d009_mudejar.1.title$"
 d009_mudejar.1.desc: "В наших городах #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманские#!#! общины по-прежнему живут по старым порядкам, сложившимся до Реконкисты: обращаются за правосудием к кади, соблюдают родовые обычаи, а когда [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] требуют ответа, — дают его сообща вместо того, чтобы по отдельности отвечать перед синьором, который считает их своими подданными. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] требуют закрепить подобное самоуправление особой грамотой, которая превратит терпимый сегодня обычай в неотъемлемое право. Их довод прост: альхама, уверенная в завтрашнем дне, платит налоги охотнее, чем та, что нас ненавидит. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] же видят в таком порядке досадное исключение и ждут, что [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] устранят его, а не станут закреплять законодательно. Нам предстоит принять важное решение — от него будет зависеть, сохранится ли мусульманское самоуправление на правовой основе, или же оно будет существовать, лишь покуда его терпят [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_mudejar.1.a: "Выпустим указ."
 d009_mudejar.1.b: "Откажем в праве на самоуправление."
 d009_mudejar.1.b.tt: "Наши мусульманские подданные страдают от того, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] пристально надзирают за ними"
 d009_mudejar.1.historical_info: "Мудехарские общины по всей христианской Иберии, как правило, жили в соответствии с хартиями, иногда называемыми #italic привилегиями альхам#!. В обмен на уплату налогов и верность короне они гарантировали общинам возможность более-менее независимо вести свои внутренние дела, в том числе религиозные и судебные. В разных королевствах эти хартии значительно различались по степени щедрости. В течение XV и XVI веков, когда терпимость короны к исламу на христианской земле стала ослабевать, хартии постепенно теряли свою силу."
 d009_mudejar.2.title: "Расширение мудехарского квартала"
 d009_mudejar.2.entry: "$d009_mudejar.2.title$"
 d009_mudejar.2.desc: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Мусульманский#!#! квартал [target_location.Custom('LR_GEN')|l] [target_location.GetName] давно перерос границы, отведённые ему несколько поколений назад. Старые переулки полнятся новыми мастерскими, и всё больше семей обращается к властям с просьбой позволить им селиться и работать за установленными границами квартала. Они утверждают, что ремесло, которому не дают развиваться, обречено угаснуть. Наши чиновники разделились во мнениях: одни считают, что с расширением квартала увеличится и налоговая база; другие же предупреждают, что если один раз пойти на уступки, впоследствии будет сложнее отменить это решение."
 d009_mudejar.2.a: "Поддержим расширение квартала."
 d009_mudejar.2.b: "Сохраним существующие границы."
 d009_mudejar.3.title: "Капитуляция Гранады"
 d009_mudejar.3.entry: "$d009_mudejar.3.title$"
 d009_mudejar.3.desc: "#TOOLTIP:LOCATION,granada,X #L Гранада#!#! пала. Условия, которые [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашей державы предлагает её #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманскому#!#! населению, необычайно щедры по меркам любого завоевателя: свобода вероисповедания, собственные суды, право жить по своим обычаям — и всё это закреплено письменно. Теперь десятки тысяч мусульман, сложивших перед нами оружие, волнует только один вопрос: останемся ли мы верны своему слову и сохраним ли гарантии, не пойдя на поводу у воинственного двора?"
 d009_mudejar.3.a: "Соблюдём условия капитуляции."
 d009_mudejar.3.b: "Немедленно начнём насаждение религии."
 d009_mudejar.3.b.tt: "Исламское население Гранады потрясено несоблюдением обещания"
 d009_mudejar.3.historical_info: "Документ о капитуляции Гранады, подписанный в ноябре 1491 года в рамках сдачи эмирата, гарантировал гранадским мусульманам свободу вероисповедания, право пользоваться родным языком и соблюдать сложившиеся обычаи, а также сохранение действия мусульманского права под юрисдикцией их собственных судей. На практике эти гарантии стали постепенно утрачивать силу практически сразу после завоевания Гранады в 1492 году. В течение последующего десятилетия они почти полностью перестали действовать, что в конечном итоге привело к принудительным обращениям мусульман в христианство в 1499–1502 годы."
 variable_d009_gra_capitulations_honored_tt: "Соблюдение условий капитуляции Гранады"
 d009_mudejar.4.title: "Сиснерос в Гранаде"
 d009_mudejar.4.entry: "$d009_mudejar.4.title$"
 d009_mudejar.4.desc: "В Гранаду [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл' )] кардинал [target_character.GetName] — человек, с крайним пренебрежением относящийся к условиям капитуляции, которые поклялась соблюдать наша корона. Прежний архиепископ призывал обращать мусульман постепенно, убеждением и проповедью. [target_character.GetName] же предпочитает другое средство — поголовное крещение. К купели ведут целые кварталы, не считаясь с мнением их жителей. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] встречают подобное рвение с большим одобрением. [Select_CString(target_character.IsFemale, 'Сама', 'Сам' )] кардинал утверждает, что условия капитуляции были не более чем временной уступкой, продиктованной военными обстоятельствами."
 d009_mudejar.4.a: "Одобрим действия Сиснероса."
 d009_mudejar.4.b: "Сдержим Сиснероса."
 d009_mudejar.4.historical_info: "Кардинал Франсиско Хименес де Сиснерос, архиепископ Толедо и духовник королевы Изабеллы, прибыл в Гранаду в 1499 году. Оставшись недовольным медленными темпами добровольного обращения в христианство при его предшественнике Эрнандо де Талавере, он начал массовые принудительные крещения. Эти действия напрямую спровоцировали первое Альпухарское восстание. Историки обычно рассматривают его действия как решительный разрыв с обещаниями, данными при капитуляции Гранады."
 d009_mudejar.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие мудехары"
 d009_mudejar.5.entry: "Мудехары"
 d009_mudejar.5.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] нашей державы заслушивает вести о том, как соседние #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! государства завершают принудительное обращение своих #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманских#!#! подданных. Всё сильнее раздаются голоса тех, кто требует того же и от нас — обратить в христианство мудехаров [ROOT.GetCountry.Custom('CL_GEN')], по-прежнему открыто исповедующих свою веру в #TOOLTIP:AREA,aragon_area,X #L Арагоне#!#! и #TOOLTIP:AREA,valencia_area,X #L Валенсии#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] призывают провести здесь те же поголовные крещения, что уже состоялись в других странах. Мусульмане в ответ ссылаются на грамоты, дарованные им ещё несколько веков назад и гарантирующие сохранение их веры и обычаев. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] не может больше оставаться в стороне — нужно что-то решать."
 d009_mudejar.5.a: "Проведём массовое крещение."
 d009_mudejar.5.a.tt: "Наши исламские общины в #TOOLTIP:AREA,aragon_area,X #L Арагоне#!#! и #TOOLTIP:AREA,valencia_area,X #L Валенсии#!#! принудительно обращаются в другую веру"
 d009_mudejar.5.b: "Освободим их от действия указа."
 d009_mudejar.5.historical_info: "В 1526 году, спустя несколько десятилетий после принудительных крещений в Кастилии, проходивших в 1500–1502 годах, Карл V отдал приказ о принудительном обращении оставшихся в Арагоне мудехаров в христианство. К тому времени восстание херманий в Валенсии уже привело к массовым насильственным крещениям мусульман по инициативе восставших. Арагонская знать, в значительной степени зависевшая от труда мусульманских земледельцев, в течение многих лет сопротивлялась указу, прежде чем все его положения начали исполняться."
 d009_mudejar.6.title: "Мориски и [GetCountry('TUR').GetAdjectiveWithNoTooltip|l]ие происки"
 d009_mudejar.6.entry: "$d009_mudejar.6.title$"
 d009_mudejar.6.desc: "До нашего двора дошли вести о тайной переписке морисков с людьми [GetCountry('TUR').GetAdjectiveWithNoTooltip|l]ого султана, который совершенно не скрывает своей симпатии к #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманам#!#! #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, вынужденным исповедовать свою веру втайне. Что стоит за этой перепиской — заговор против короны или же лишь осторожные сношения людей, пытающихся сохранить веру, которую им не дозволено соблюдать открыто, — доподлинно неизвестно. Но и одних подозрений достаточно, чтобы наш совет разделился во мнениях."
 d009_mudejar.6.a: "Прервём их общение."
 d009_mudejar.6.a.tt: "Слежка за тайными сообществами мусульман возобновляется с новой силой"
 d009_mudejar.6.b: "Не будем ничего делать."
 d009_mudejar.6.historical_info: "На протяжении XVI века испанские власти всерьёз опасались связей морисков с османами и берберскими пиратами, и не без оснований: перехваченные письма и несколько документально подтверждённых заговоров, особенно в 1560-х годах, свидетельствуют о том, что по крайней мере часть общин морисков надеялась на выступление Османской империи против Испании. Эти подозрения привели к ужесточению мер и, как следствие, Альпухарскому восстанию 1568 года, а после и к принятию указа об изгнании морисков в 1609 году."
 d009_mudejar.7.title: "Тайная жизнь мусульман при инквизиции"
 d009_mudejar.7.entry: "$d009_mudejar.7.title$"
 d009_mudejar.7.desc: "[ShowPolicyName('local_courts')|U] вновь начинают разбирательства против семей новых #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Соседи, стремящиеся превзойти друг друга в доказательствах своей правоверности, обвиняют их в отправлении тайных обрядов. Действительно ли этот процесс можно назвать искоренением ереси, или же это лишь попытка посеять страх среди людей, чьи предки целое поколение назад оставили #TOOLTIP:RELIGIONGROUP,muslim,X #L ислам#!#!, — вопрос, который, похоже, не занимает никого из судей."
 d009_mudejar.7.a: "Не будем мешать работе трибунала."
 d009_mudejar.7.a.tt: "Население [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] утомлено постоянными преследованиями со стороны трибунала"
 d009_mudejar.7.b: "Осторожно предупредим сообщество."
 d009_mudejar.7.b.tt: "Население [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] радо предупреждению"
 d009_mudejar.7.historical_info: "Общины морисков, формально принявшие христианство, зачастую продолжали тайно исповедовать ислам на протяжении нескольких поколений. Это явление хорошо задокументировано в материалах инквизиционных процессов, где описываются самые разные нарушения: от тайных молитв и соблюдения религиозных пищевых запретов до сохранения и передачи навыков чтения и письма на арабском языке. Преследование этих общин со стороны инквизиции постепенно усиливалось на протяжении XVI столетия и стало одним из официально заявленных обоснований для принятия указа об изгнании морисков в 1609 году."
 d009_mudejar.8.title: "Решающий вопрос: изгнание или ассимиляция?"
 d009_mudejar.8.entry: "$d009_mudejar.8.title$"
 d009_mudejar.8.desc: "Наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] настаивают, что #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманские#!#! общины #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! спустя несколько десятилетий принудительного обращения в другую веру приняли #TOOLTIP:RELIGIONGROUP,christian,X #L христианство#!#! лишь для виду, а в остальном по-прежнему исповедуют ислам. Соседние христианские державы уже определились с судьбой этих людей в своих краях, и [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашей страны больше не может откладывать решение, как поступить. Необходимо определиться, будут ли общины новых христиан изгнаны под предлогом того, что они — постоянная угроза, или же со временем поглощены. Вполне возможно, что есть и промежуточный путь."
 d009_mudejar.8.a: "Издадим указ об изгнании."
 d009_mudejar.8.a.tt: "Общины наших тайных мусульман изгоняются; место их изгнания — [escape_target.GetName]"
 d009_mudejar.8.b: "Запустим программу интеграции."
 d009_mudejar.8.c: "Проведём выборочное изгнание."
 d009_mudejar.8.historical_info: "Указ Филиппа III об изгнании, изданный в 1609 году и поэтапно исполнявшийся вплоть до 1614 года, в конечном итоге вынудил около 300 000 морисков покинуть Испанию и переселиться в Марокко, Тунис, Алжир и другие части османского мира. Это событие стало одним из крупнейших случаев принудительного перемещения населения в истории Европы раннего Нового времени, а его экономические последствия, особенно потеря квалифицированных работников сельского хозяйства в Валенсии и Арагоне, ощущались в некоторых регионах Испании ещё на протяжении нескольких поколений."
 d009_mudejar.9.title: "Последние мориски"
 d009_mudejar.9.entry: "$d009_mudejar.9.title$"
 d009_mudejar.9.desc: "Ушло поколение, когда-то ещё нашёптывавшее молитвы на #TOOLTIP:LANGUAGE,arabic_language,X #L арабском#!#! языке за наглухо закрытыми ставнями. Вместе с ними канула в небытие и община, полтора столетия остававшаяся для своих соседей ни полностью #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманской#!#!, ни полностью #TOOLTIP:RELIGIONGROUP,christian,X #L христианской#!#!. От неё сохранились лишь горстка фамилий и несколько старых рецептов. Так закрылась одна из страниц истории #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Мало кто станет о ней скорбеть, и ещё меньше найдётся тех, кто сумеет вспомнить всё так, как оно действительно было."
 d009_mudejar.9.a: "Признаем конец эпохи."
 d009_mudejar.9.historical_info: "Историки до сих пор спорят о степени утраты морискской идентичности после обращения в христианство или изгнания. Происхождение семей, оставшихся и ассимилировавшихся в Испании, веками прослеживалось в фамилиях, названиях мест и традициях, тогда как изгнанники, обосновавшиеся в Северной Африке, на протяжении многих поколений сохраняли андалусскую самобытность, черты которой и сегодня прослеживаются в архитектуре, кухне и музыке таких городов, как Тетуан, Рабат и Тунис."
