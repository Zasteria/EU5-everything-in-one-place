l_russian:
 d009_morisco_diaspora.1.title: "К нам прибыли мориски"
 d009_morisco_diaspora.1.entry: "$d009_morisco_diaspora.1.title$"
 d009_morisco_diaspora.1.desc: "В [target_location.Custom('LR_PREP')|l] [target_location.GetName] начали селиться беженцы, именующие себя морисками, — #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманские#!#! семьи, изгнанные из земель, которые их предки веками считали своим домом. С собой они приносят обычаи, ремёсла и речь, свойственные той #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, о которой большинство из нас знает лишь понаслышке. Некоторые из наших чиновников рады притоку искусных мастеров и капитала, способных послужить державе; иные же видят в морисках чужаков и сомневаются в их верности: не так уж давно те покинули родные края, где правят христиане."
 d009_morisco_diaspora.1.a: "Примем их без ограничений."
 d009_morisco_diaspora.1.b: "Ограничим их одним лишь этим кварталом."
 d009_morisco_diaspora.1.historical_info: "После издания декрета об изгнании 1609–1614 годов около 300 000 морисков покинули Испанию, отправились в Магриб и нашли приют в Тетуане, Сале, Тунисе и Алжире. Многие поколениями сохраняли андалусский язык, традиционную кухню и одежду, в то время как другие стали частью более широких мусульманских сообществ, принявших их."
 variable_d009_morisco_community_ever_tt: "Община морисков существовала в стране"
 d009_morisco_diaspora.2.title: "Республика Рабат-Сале"
 d009_morisco_diaspora.2.entry: "$d009_morisco_diaspora.2.title$"
 d009_morisco_diaspora.2.desc: "Община морисков в [ShowLocationName('sale')] фактически взяла власть в свои руки — капитаны корсаров отчитываются исключительно перед собственным советом, который сами же и избирают, а не перед назначаемым нами губернатором. Закрывать глаза на происходящее уже нельзя: пора решить, узаконить ли сложившийся порядок или вернуть [ShowLocationNameWithNoTooltip('sale')] под более пристальный надзор."
 d009_morisco_diaspora.2.a: "Дадим им самоуправление."
 d009_morisco_diaspora.2.b: "Включим их в состав королевского флота."
 d009_morisco_diaspora.2.historical_info: "Республика Сале (она же республика Бу-Регрег) возникла около 1627 года как полунезависимое пиратское государство. Ей управляли беженцы-мориски и их потомки, власть местных султанов до неё почти не дотягивалась. Пираты совершали набеги в районе Иберии, но не оставляли без внимания и торговые пути в Атлантике. Позже в XVII веке она в конечном итоге подчинилась марокканской династии Алавитов, однако пиратский дух региона сохранялся на протяжении ещё нескольких поколений."
 d009_morisco_diaspora.3.title: "Андалусский квартал в Тунисе"
 d009_morisco_diaspora.3.entry: "$d009_morisco_diaspora.3.title$"
 d009_morisco_diaspora.3.desc: "Поселившиеся в #TOOLTIP:LOCATION,tunis,X #L Тунисе#!#! мориски построили себе собственный квартал, где во всём — в архитектуре, садах, даже ремёслах — сохранились узнаваемые черты Иберии, хотя самих морисков от родины отделяют десятилетия изгнания. Нам предстоит решить, стоит ли поощрять такую самобытность, чтобы подчеркнуть многообразие нашего города, или же позволить морискам со временем раствориться в культуре Туниса."
 d009_morisco_diaspora.3.a: "Поддержим сохранение культуры."
 d009_morisco_diaspora.3.b: "Поддержим ассимиляцию."
 d009_morisco_diaspora.3.historical_info: "Изгнанные из Испании мориски, осевшие в Тунисе, обосновались в квартале, известном сегодня как #italic Андалусский переулок#! и под другими аналогичными названиями. Они веками сохраняли андалусскую архитектуру, кухню и музыкальную традицию #italic малуф#!."
 d009_morisco_diaspora.4.title: "Сохранившаяся андалусская музыка"
 d009_morisco_diaspora.4.entry: "$d009_morisco_diaspora.4.title$"
 d009_morisco_diaspora.4.desc: "Музыканты-мориски и поныне исполняют сложную придворную музыку, которую их предки когда-то играли во дворцах #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, и передают эти знания своим ученикам. Из поколения в поколение один музыкант перенимает её азы у другого, и эта традиция непрерывно существует ещё со времён, предшествующих изгнаниям. Придворные поэты и путешественники всё чаще подмечают, что музыка морисков — одно из величайших культурных достояний наших земель."
 d009_morisco_diaspora.4.a: "Признаем традицию."
 d009_morisco_diaspora.4.historical_info: "Музыкальная традиция #italic нуба#!, оформившаяся при дворах Аль-Андалуса и занесённая в Северную Африку поколениями изгнанников, сохранилась и развилась в самобытные региональные репертуары. И по сей день они звучат по всему Магрибу, в том числе в Тетуане, Тунисе и Алжире. Каждый из этих городов сохранил собственную и самобытную музыкальную школу этой традиции."
 d009_morisco_diaspora.5.title: "Мориски — алжирские корсары"
 d009_morisco_diaspora.5.entry: "$d009_morisco_diaspora.5.title$"
 d009_morisco_diaspora.5.desc: "Беженцы-мориски, некогда промышлявшие рыболовством и земледелием на берегах #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, сегодня могут послужить нашей державе совсем иным, более полезным образом: они знают местные гавани, течения и береговые укрепления как свои пять пальцев; наши корсары не могут похвастать тем же самым. Предстоит решить, воспользуемся ли мы этими знаниями на море или же предоставим семьям мориском заниматься более спокойными ремёслами."
 d009_morisco_diaspora.5.a: "Наймём их лоцманами."
 d009_morisco_diaspora.5.b: "Оставим их заниматься ремёслами."
 d009_morisco_diaspora.5.historical_info: "Мориски, прекрасно знавшие географию побережья Иберии, на протяжении всего XVII века высоко ценились алжирскими пиратами. Они служили лоцманами и налётчиками, а их знание испанских гаваней и морских течений давало местным корсарским флотам значительное оперативное преимущество перед своими христианскими противниками."
 d009_morisco_diaspora.6.title: "Спустя два поколения после изгнания"
 d009_morisco_diaspora.6.entry: "$d009_morisco_diaspora.6.title$"
 d009_morisco_diaspora.6.desc: "Дети и внуки первых изгнанных из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! морисков выросли здесь и уже не знают другой родины. Для одних Иберия живёт лишь в рассказах предков, превратившихся со временем скорее в легенды, чем в воспоминания. Другие же по-прежнему вспоминают годовщину изгнания своих дедов и прадедов так, словно оно произошло лишь вчера. Наша задача — решить, помочь ли этому поколению окончательно обрести себя в качестве наших подданных, или же сохранить его особую самобытность. От этого зависит, какой след община морисков оставит в нашей истории."
 d009_morisco_diaspora.6.a: "Поощрим полную интеграцию."
 d009_morisco_diaspora.6.b: "Поможем им хранить память."
 d009_morisco_diaspora.6.historical_info: "К середине–концу XVII века дети и внуки изгнанных морисков всё больше интегрировались в население Магриба. Впрочем, в таких городах, как Тетуан и Тунис, самобытные обычаи, фамилии и не исчезавшая андалусская идентичность сохранялись до XVIII века и даже после."
 d009_morisco_diaspora.7.title: "Ключи к Гранаде"
 d009_morisco_diaspora.7.entry: "$d009_morisco_diaspora.7.title$"
 d009_morisco_diaspora.7.desc: "Некоторые семьи морисков до сих пор хранят ключи и бумаги на дома, когда-то принадлежавшие их предкам в #TOOLTIP:LOCATION,granada,X #L Гранаде#!#! и других краях #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!. Теперь они не имеют никакой практической ценности, но переходят из поколения в поколение по наследству как символ надежды (пусть, возможно, несбыточной) на возвращение; впрочем, с каждым годом оно кажется всё менее возможным."
 d009_morisco_diaspora.7.a: "Подумаем о том, что было потеряно."
 d009_morisco_diaspora.7.historical_info: "Семьи морисков и сефардов хранят ключи от своих родовых домов, оставшихся на Иберийском полуострове. Эта хорошо задокументированная традиция общин диаспор Магриба и Османской империи символизирует непреходящее, хотя и преимущественно символическое право на родину, которая с каждым поколением становилась всё более далёкой."
 d009_morisco_diaspora.8.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий Алжир и андалусское наследие"
 d009_morisco_diaspora.8.entry: "Алжир и андалусское наследие"
 d009_morisco_diaspora.8.desc: "Наши инженеры и чиновники всё чаще интересуются #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусскими#!#! кварталами и сооружениями, на которые столь богат [ShowLocationName('algiers')], — наследием нескольких поколений морисков. Одни считают, что его следует бережно хранить, другие же предлагают расчистить место для более современного и по-#L [ROOT.GetCountry.GetAdjective|l]и#! устроенного города."
 d009_morisco_diaspora.8.a: "Сохраним наследие."
 d009_morisco_diaspora.8.b: "Заменим его современной планировкой."
 d009_morisco_diaspora.8.historical_info: "Французские колониальные чиновники, пришедшие к власти в Алжире после 1830 года, по-разному относились к наследию города эпохи морисков и Османской империи. Одни чиновники и учёные занимались документированием и сохранением зданий в андалусском стиле. Другие курировали их снос в интересах французского градостроительства, особенно в Касбе, старом районе османской цитадели."
 d009_morisco_diaspora.9.title: "Две общины, один путь к [ROOT.GetCountry.Custom('CL_DAT')]"
 d009_morisco_diaspora.9.entry: "Две общины, один путь"
 d009_morisco_diaspora.9.desc: "Всего за одно поколение наши земли стали прибежищем для двух народов, изгнанных с одних и тех же берегов одной и той же бедой: #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардов#!#!, бежавших из страны после принятия Альгамбрского эдикта, и морисков, спасавшихся от принудительного обращения в христианство или даже ещё более страшной участи. Некоторые придворные предлагают поселить каждую общину в собственном квартале, даровать каждому кварталу собственную грамоту и позволить его жителям сохранять свои обычаи. Другие же считают, что изгнанников следует приютить под одной крышей и не разделять несчастных."
 d009_morisco_diaspora.9.a: "Создадим отдельные кварталы."
 d009_morisco_diaspora.9.b: "Разрешим смешанное поселение."
 d009_morisco_diaspora.9.historical_info: "На протяжении XV–XVII веков в Марокко бежали изгнанные с Пиренейского полуострова евреи и мусульмане. В таких городах, как Тетуан и Фес, их общины зачастую проживали в непосредственной близости друг от друга, разделяя общее пиренейское наследие. При этом они сохраняли собственные религиозные и правовые институты."
 d009_morisco_diaspora_9_sephardi_population_tt: "В державе есть сефардское население"
 d009_morisco_diaspora_9_morisco_community_tt: "В державе есть укоренившаяся община морисков"
 d009_morisco_diaspora.10.title: "Город, который помнит"
 d009_morisco_diaspora.10.entry: "$d009_morisco_diaspora.10.title$"
 d009_morisco_diaspora.10.desc: "Тетуан носит на себе отпечаток культуры сразу двух проживающих здесь народов-изгнанников: #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардских#!#! семей и беженцев-морисков. И те, и другие по сей день говорят на диалектах испанского, привезённого сюда их предками. И те, и другие называют детей в честь городов той #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, которую им уже не суждено увидеть вновь. Мало найдётся городов, где память об утраченной родине столь прочно вплетена в повседневную жизнь: её следы хранят улицы, суды, семейные очаги."
 d009_morisco_diaspora.10.a: "Будем гордиться живой памятью города."
 d009_morisco_diaspora.10.historical_info: "Тетуан был восстановлен и заново заселён в основном сефардами и андалусскими мусульманами, изгнанными с Пиренейского полуострова. Поэтому город сохранил свой уникальный иберийский характер, в том числе диалекты #italic хакетия#! и дарижа, в которых до самого XX века сохранялись следы испанского языка."
