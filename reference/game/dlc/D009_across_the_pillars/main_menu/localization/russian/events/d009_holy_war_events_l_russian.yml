l_russian:
 holy_war.11.title: "Налётчики в приграничье"
 holy_war.11.desc: "[cabalgada_raider.GetName] — вот какое название будут вспоминать со страхом! Отсюда разбойничья конница устроила #italic кабальгаду#! на наше приграничье. Всадники сожгли деревни, увезли всё, что смогли захватить, и, прежде чем мы успели ответить, ушли обратно за границу. Наши беззащитные земли разграблены, и теперь нужно решить, что делать: собрать ополчение, чтобы укрепить оборону, или же оставить этот позор без ответа?"
 holy_war.11.a: "Соберём ополчение на границе!"
 holy_war.11.b: "Нам остаётся только терпеть."
 holy_war.12.title: "Требование дани"
 holy_war.12.desc: "К нашему двору прибывают послы из #ONCLICK:COUNTRY,[parias_demander.Custom('CL_tt')] #TOOLTIP:COUNTRY,[parias_demander.Custom('CL_tt')],X [parias_demander.Custom('CL_GEN')|L]#!#!. Они везут недвусмысленное известие: против нас собирается [threatening_crusade.GetName], и, если мы не заплатим дань, на наших землях окажется вражеское войско. Советники предупреждают: золото лишь отсрочит неизбежное. Оно может ненадолго охладить их пыл, но не утолит жажду войны. Заплатить и оттянуть расплату или бросить им вызов и готовиться к удару?"
 holy_war.12.a: "Выплатим дань и выиграем немного времени."
 holy_war.12.a.tt: "Подготовка [Concept('crusade', 'крестового похода')|e] сдвигается назад на #G 30#!, а его религиозное рвение уменьшается на #G 10#!"
 holy_war.12.b: "Нас не запугать. Пусть приходят."
 holy_war.12.b.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 10#!"
 holy_war.13.title: "Неверные платят"
 holy_war.13.desc: "Наше требование принесло плоды. [parias_payer.GetName] выплатили дань, лишь бы не встретить [threatening_crusade.GetName] неподготовленными. Их золото пополняет нашу казну, но их отсрочка — лишь отсрочка, не более. Священная война всего лишь отложена."
 holy_war.13.a: "Их золото послужит святому делу."
 holy_war.13.a.tt: "Они выплатили дань"
 holy_war.14.title: "Неверные бросают нам вызов"
 holy_war.14.desc: "[parias_payer.GetName] отвергли наше требование о дани и выбрали неповиновение. Их дерзость лишь укрепила решимость верных, и рвение [threatening_crusade.GetName] разгорается от этого ещё жарче."
 holy_war.14.a: "Тогда ответит меч."
 holy_war.14.a.tt: "Они отказались платить дань"
 holy_war.15.title: "Южные налётчики"
 holy_war.15.desc: "[ghazw_raider.GetName] — вот какое название будут вспоминать со страхом! Отсюда разбойничья конница устроила #italic газават#! на наше приграничье. Всадники сожгли деревни, увезли всё, что смогли захватить, и, прежде чем мы успели ответить, ушли обратно за границу. Наши беззащитные земли разграблены, и теперь нужно решить, что делать: собрать ополчение, чтобы укрепить оборону, или же оставить этот позор без ответа?"
 holy_war.15.a: "Соберём ополчение на границе!"
 holy_war.15.b: "Нам остаётся только терпеть."
 holy_war.16.title: "Морские налётчики"
 holy_war.16.desc: "Корсары из #ONCLICK:COUNTRY,[shore_raider.Custom('CL_tt')] #TOOLTIP:COUNTRY,[shore_raider.Custom('CL_tt')],X [shore_raider.Custom('CL_GEN')|L]#!#! устроили налёт на наше побережье. Они разграбили гавани, заковали местных жителей в цепи и стремительно скрылись за горизонтом, увозя невольников с собой. Наши беззащитные берега разорены, и теперь нужно решить, что делать: собрать ополчение, чтобы укрепить оборону, или же оставить этот позор без ответа?"
 holy_war.16.a: "Соберём ополчение на побережье!"
 holy_war.16.b: "Нам остаётся только терпеть."
 d009_holy_war.1.title: "Ответ орденов"
 d009_holy_war.1.desc: "Призыв разослан военным орденам, и братья собирают войско."
 d009_holy_war.1.desc_santiago: "[summoned_order.GetName] ответил, и ответил в полную силу. Его братья шли по дороге колонной — восемьсот копий под знаменем с раковиной — и разбили лагерь, не дожидаясь указаний, где именно. [summoned_order.GetNameWithNoTooltip] ведёт эту войну уже двести лет, и магистру не нужно объяснять ход похода.\n\nУ него лишь один вопрос, заданный учтиво и лишь однажды: где орден встанет в строю?"
 d009_holy_war.1.desc_calatrava: "[summoned_order.GetName] ответил. Его братья прибыли в полном порядке и в молчании, в белых плащах с красным крестом — цистерцианская дисциплина, перенесённая на поле боя. Они разбили лагерь немного в стороне от [ROOT.GetCountry.GetGovernment.GetAdjective] войска, как велит их обычай.\n\nМагистр присутствует на наших советах, говорит мало и неизменно оказывается прав в вопросах местности. Он спрашивает, где орден встанет в строю."
 d009_holy_war.1.desc_alcantara: "[summoned_order.GetName] ответил, и вместе с ним пришла сама граница. Это не турнирные рыцари: это люди, которые в обычный год удерживают переправы через Тахо, и они прибыли со своими разведчиками, своими проводниками и своим собственным мнением о противнике.\n\nМагистр спрашивает, где орден встанет в строю, тоном человека, который уже всё решил."
 d009_holy_war.1.desc_montesa: "[summoned_order.GetName] ответил, хотя это увело его дальше от дома, чем обычно. Его братья оставили свои прибрежные башни под охраной малого гарнизона и прискакали, чтобы присоединиться к нам, и они понимают, какую честь нам оказывают.\n\nМагистр спрашивает, где орден встанет в строю и как долго, по нашим расчётам, он нам понадобится."
 d009_holy_war.1.desc_avis: "[summoned_order.GetName] ответил. Его братья — в той же мере политическая сила, что и военная, и их прибытие — заявление о том, чья это война.\n\nМагистр спрашивает, где орден встанет в строю. Он внимательно следит, окажут ли им должную честь в ответе."
 d009_holy_war.1.desc_christ: "[summoned_order.GetName] ответил, и в этом есть что-то несообразное. Это те самые братья, что финансируют каравеллы и спорят о широтах, а теперь они явились вглубь материка в доспехах, чтобы вести осадную войну.\n\nМагистр спрашивает, где орден встанет в строю, с видом человека, напоминающего нам, что его орден был основан именно для этого."
 d009_holy_war.1.a: "Дать им авангард."
 d009_holy_war.1.b: "Пусть удержат фланг."
 d009_holy_war.2.title: "Булла дарована"
 d009_holy_war.2.desc: "Булла прибыла — скреплённая печатью и не оставляющая сомнений. #italic Bula de Cruzada#! дарует отпущение грехов тем, кто жертвует на войну против неверных, и называет нашего [ROOT.GetCountry.GetFlavorRank] орудием этой войны.\n\nНа деле это разрешение собирать деньги со всех наших верующих, приход за приходом, с полной властью [GetUniqueInternationalOrganization('catholic_church').GetName] за спиной сборщиков. Наше [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] уже деликатно интересуется, кто будет собирать, а кто — считать."
 d009_holy_war.2.a: "Проповедовать её в каждом приходе, а казну держать нашим людям."
 d009_holy_war.2.b: "Брать лишь то, что дано добровольно, и пусть считает [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]."
 d009_holy_war.3.title: "Добровольцы веры"
 d009_holy_war.3.desc: "Они прибывают уже несколько недель: газии с гор, студенты #italic медресе#!, братства из городов, которые мы никогда не имели повода облагать налогом. Одни привели лошадей. Многие не принесли ничего, кроме убеждённости.\n\nОни не солдаты, и командовать ими как солдатами не выйдет. Но если направить их против врага достаточно скоро, они стоят куда больше, чем можно судить по их снаряжению."
 d009_holy_war.3.a: "Немедленно отправить их на север."
 d009_holy_war.3.b: "Придержать их и сперва сделать из них солдат."
 d009_holy_war.4.title: "Переправа"
 d009_holy_war.4.desc: "Флот переправил войско, и знамёна уже на северном берегу.\n\nКаждый полководец, прошедший через это, знает простую арифметику: [ShowLocationName('strait_of_gibraltar')] у нас за спиной, флот не может оставаться здесь долго, и то, что мы удержим через месяц, и будет нашим. Первые дни решают исход похода."
 d009_holy_war.4.a: "Ударить вглубь земель, пока они ещё собирают силы."
 d009_holy_war.4.b: "Сперва закрепиться на побережье и в портах."
 d009_holy_war.5.title: "После ḡазва"
 d009_holy_war.5.desc: "Налётчики вернулись за границу, гоня перед собой скот и пленников, и вся округа высыпала поглядеть на их возвращение.\n\nТо, что было взято, теперь предстоит разделить, и за дележом следят куда внимательнее, чем за самим набегом. Ḡази шли ради [ROOT.GetCountry.GetReligion.GetGodName] и ради добычи — в том порядке, который они предпочли бы не уточнять."
 d009_holy_war.5.a: "Добыча принадлежит тем, кто её взял."
 d009_holy_war.5.b: "Казна берёт причитающуюся ей пятую часть."
 d009_holy_war.6.title: "Добыча корсаров"
 d009_holy_war.6.desc: "Эскадра вернулась домой с богатым грузом. [ShowGoodsName('cloth')], монеты, церковная утварь и две сотни пленников с побережья, которое считало себя слишком далёким на севере, чтобы к нему стоило плыть.\n\nКапитаны сошли на берег и уже тратят добытое. #italic Кади #! интересуется судьбой пленников, а казна — всем остальным."
 d009_holy_war.6.a: "Взять за пленников выкуп и получить прибыль."
 d009_holy_war.6.b: "Поселить их здесь и дать побережью узнать, куда мы можем дотянуться."
