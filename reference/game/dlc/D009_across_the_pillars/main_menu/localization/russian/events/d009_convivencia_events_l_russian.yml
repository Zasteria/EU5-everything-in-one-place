l_russian:
 d009_convivencia.1.title: "Три общины"
 d009_convivencia.1.entry: "$d009_convivencia.1.title$"
 d009_convivencia.1.desc: "В наших городах церковные колокола, песни муэдзинов и субботние свечи веками на одних и тех же улицах служат одному и тому же делу: отмечают одни и те же часы. Мудехарские ремесленники, #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейские#!#! ростовщики и лекари, #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! горожане делят между собой рынки, мастерские и дворы и нередко вступают в споры; от столкновений их удерживает лишь хрупкая #italic конвивенсия#!, сложившаяся ещё много поколений назад и пережившая войны, мор и нескольких королей. Советники день за днём требуют от нас держать общины в железном кулаке; альхамы столь же жёстко требуют обратного. Насколько пристально стоит короне следить за тем, на каких условиях этим трём общинам дозволено существовать бок о бок?"
 d009_convivencia.1.a: "Пусть альхамы сами собой управляют."
 d009_convivencia.1.a.tt: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Исламские#!#! и иудейские общины [target_location.Custom('LR_GEN')|l] [target_location.GetName] успешнее обживаются под нашей властью"
 d009_convivencia.1.b: "Отдадим предпочтение христианским подданным."
 d009_convivencia.1.b.tt: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Исламские#!#! и иудейские общины [target_location.Custom('LR_GEN')|l] [target_location.GetName] обеспокоены нашей властью"
 d009_convivencia.1.historical_info: "Термином #italic конвивенция#!, означающим «сосуществование», историки обозначают те века, когда христиане, мусульмане и иудеи жили на территории средневековой Иберии бок о бок в условиях терпимости различной степени, особенно в таких городах, как Толедо, Севилья и Сарагоса. О полном равенстве речь не заходила: нехристиане платили особые налоги и сталкивались с реальными ограничениями, но это позволяло осуществлять культурный и интеллектуальный обмен, который, в частности, привел к появлению великих толедских школ переводчиков."
 d009_convivencia.2.title: "Синагога дель Трансито"
 d009_convivencia.2.entry: "$d009_convivencia.2.title$"
 d009_convivencia.2.desc: "[target_character.GetName] — наш казначей и доверенная фигура в местной альхаме — желает возвести новую синагогу в #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейском#!#! квартале в самом центре #TOOLTIP:LOCATION,toledo,X #L Толедо#!#!. Её стены будут украшены резьбой с изображением псалмов Давида и гербов [ROOT.GetCountry.Custom('CL_GEN')], а потолки — покрыты позолотой, да так, что, по [Select_CString(target_character.IsFemale, 'её', 'его' )] словам, синагога превзойдёт лучшие творения из всех, что капитул собора заказывал за последние десятилетия. На нашей земле появится один из величайших молельных домов, когда-либо построенных руками иудеев, — памятник [Select_CString(target_character.IsFemale, 'её', 'его' )] набожности и возвышению над простыми смертными. Для тех же, кто умеет читать между строк, синагога станет одновременно и недвусмысленным свидетельством влияния, с которым не смеет спорить [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
 d009_convivencia.2.a: "Разрешим строительство. Кроме того, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] с радостью примет у себя этого человека."
 d009_convivencia.2.a.entry: "Разрешим Самуэлю Ха-Леви Абулафия строительство и пригласим его к нашему двору."
 d009_convivencia.2.b: "Откажем, ибо такая роскошь вызовет зависть и подозрения."
 d009_convivencia.2.b.tt: "Иудейская община Толедо чувствует немилость короны"
 d009_convivencia.2.historical_info: "Синагога дель Трансито в Толедо была возведена около 1356 года Самуилом Ха-Леви Абулафия, казначеем короля Кастилии Педро I. По сей день она остается одной из лучших сохранившихся синагог, выстроенных в стиле мудехар. На её стенах высечены псалмы на иврите и королевский герб Кастилии. Впечатляющий карьерный взлёт Ха-Леви при дворе закончился печально: его обвинили в растрате, арестовали и запытали насмерть. Эта история не даёт забыть о том, насколько шатким могло быть положение даже самых доверенных евреев-придворных."
 d009_convivencia_2_judaism_population_tt: "В Толедо есть иудейское население"
 d009_convivencia.3.title: "Хасдай Крескас и вопрос веры"
 d009_convivencia.3.entry: "$d009_convivencia.3.title$"
 d009_convivencia.3.desc: "[target_character.GetName], раввин и #TOOLTIP:ARTIST,philosopher,X #L философ#!#!, весьма [Select_CString(target_character.IsFemale, 'почитаемая', 'почитаемый' )] в своей общине и [Select_CString(target_character.IsFemale, 'пользующаяся', 'пользующийся' )] признанием и среди нашего народа, просит об аудиенции, на что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] отвечает согласием. [Select_CString(target_character.IsFemale, 'Она намерена', 'Он намерен' )] доказать нам, что разум и откровение не суть противники друг другу; что философы, которыми так восхищаются наши учёные, никогда не относились к #TOOLTIP:RELIGIONGROUP,christian,X #L христианскому#!#! учению столь благосклонно, как нам пытаются это преподнести; и что разногласия, которые столь часто навязывают [Select_CString(target_character.IsFemale, 'её', 'его' )] народу, опираются на придуманную Аристотелем логику, мало пригодную для решения вопросов веры. Что бы ни думали об этом наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] — а думают они весьма многое — учёность, которую демонстрирует нам [target_character.GetShortNameWithNoTooltip], несомненна, а доводы, как говорят, до крайности трудно опровергнуть."
 d009_convivencia.3.a: "Примем [Select_CString(target_character.IsFemale, 'её', 'его' )] и выслушаем [Select_CString(target_character.IsFemale, 'её', 'его' )] аргументы."
 d009_convivencia.3.a.entry: "Примем Хасдая Крескаса и выслушаем его аргументы."
 d009_convivencia.3.a.tt: "#TOOLTIP:RELIGION,$judaism_tt$,X #L Иудейские#!#! общины нашей державы воодушевлены этим жестом"
 d009_convivencia.3.b: "Отправим [Select_CString(target_character.IsFemale, 'её', 'его' )] прочь."
 d009_convivencia.3.b.entry: "Отправим Хасдая Крескаса прочь."
 d009_convivencia.3.historical_info: "Хасдай Крескас был выдающимся раввином и философом арагонского еврейства, проживавшим преимущественно в Барселоне и Сарагосе. В своём главном труде #italic Ор Адонай#! («Свет Господа») он последовательно критиковал превосходство философии Аристотеля над еврейской теологией. Крескас утверждал, что вера и божественная воля не могут быть полностью подчинены аристотелевской логике. Он пережил опустошительные погромы 1391 года, в ходе которых погиб его собственный сын. Большая часть поздних сочинений Крескаса является непосредственной реакцией философа на эту катастрофу."
 d009_convivencia_3_judaism_population_tt: "В державе есть иудейское население"
 d009_convivencia.4.title: "Мастера-мудехары"
 d009_convivencia.4.entry: "$d009_convivencia.4.title$"
 d009_convivencia.4.desc: "С тех пор как наши подданные-мудехары получили право управлять своей альхамой — общиной, которой королевская грамота и привилегии позволяют самостоятельно ведать своими рынками, судами и торговлей, — их зодчие, изразцовых дел мастера и штукатуры стали смелее демонстрировать свою искусность. В их работах подковообразные арки и искусная лепнина сочетаются с формами, привычными нашим собственным каменщикам. Поручить им возвести крыло дворца или садовый павильон — значит воплотить в камне и штукатурке подтверждение тому, что дарованная нами грамота не была пустым обещанием. Однако не всякий епископ или барон отнесётся к этому благосклонно, а наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] не упускают случая поворчать о происходящем."
 d009_convivencia.4.a: "Разрешим строительство крыла дворца в мудехарском стиле."
 d009_convivencia.4.b: "Будем обращаться с заказами только к христианским ремесленникам."
 d009_convivencia.4.historical_info: "Мусульманские мастера, работавшие при христианском правлении, сформировали стиль мухедар, нашедший своё применение в искусстве и архитектуре. Он отличается подковообразными арками, геометрическими узорами плитки и резным лепным декором, сочетающимися с готическими и романскими формами. Христианские монархи активно заказывали работы в стиле мухедар, и тот процветал по всей Кастилии и Арагоне. Алькасар в Севилье, построенный для короля Педро I в 1360-х годах преимущественно мастерами стиля мудехар из Гранады и Толедо, до сих пор остаётся самым знаменитым примером этого королевского покровительства."
 d009_convivencia.5.title: "Иудейские финансисты и корона"
 d009_convivencia.5.entry: "$d009_convivencia.5.title$"
 d009_convivencia.5.desc: "Казна #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! истощается быстрее, чем хотелось бы признавать. Войны, строительство, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] — всё это требует немалых расходов, которые не успевают покрывать налоги. Ростовщики и сборщики налогов из альхам готовы предоставить нам кредит — тот самый, в котором наши собственные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], связанные по рукам и ногам каноническим правом и собственной гордостью, почти неизменно нам отказывают. И как бы ни порицали с церковных кафедр их условия, более выгодных предложений во всех владениях [ROOT.GetCountry.Custom('CL_GEN')] просто не найти. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] без конца ворчат о ростовщичестве и чрезмерном влиянии, которому подвергается [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], — и, следует заметить, небезосновательно. Но деньги, взятые у альхамы, пахнут точно так же, как деньги, доставшиеся нам от #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#!."
 d009_convivencia.5.a: "Положиться на иудейских финансистов в вопросе пополнения казны."
 d009_convivencia.5.b: "Ограничить ростовщичество, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] оказались умиротворены."
 d009_convivencia.5.b.entry: "Ограничим их ростовщиков, порадуем священников."
 d009_convivencia.5.historical_info: "Еврейские финансисты, сборщики налогов и придворные врачи были неотъемлемой частью христианских дворов Иберии в эпоху Средневековья. Церковный канон запрещал ростовщичество для христиан, оставляя тем самым большую часть кредитного дела в руках еврейских займодавцев. Такие деятели, как Йехуда де ла Кавальерия, управлявший казной Арагона в XIII веке, обретали реальное влияние на самом высоком уровне. Впрочем, видное положение также делало их мишенью для недовольства всякий раз, когда повышались налоги или войны складывались неудачно."
 d009_convivencia.6.title: "Дело в судах альхамов"
 d009_convivencia.6.entry: "$d009_convivencia.6.title$"
 d009_convivencia.6.desc: "Прошло несколько лет с тех пор, как мы решили, насколько тщательно короне следует надзирать за судами альхамы, и наконец перед нами оказалось дело, которое покажет, действует ли этот порядок. #TOOLTIP:RELIGIONGROUP,christian,X #L Христианский#!#! торговец шерстью спорит с кожевенником-#TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманином#!#! из-за сделки, обернувшейся убытками. Судья альхамы уже вынес решение, руководствуясь правом, которому здесь следуют уже много поколений. Теперь торговец обращается непосредственно к нам и требует, чтобы королевский суд отменил вынесенный вердикт. Ведь, по его словам, он не соглашался подчиняться этому постановлению."
 d009_convivencia.6.a: "Примем решение суда общины."
 d009_convivencia.6.a.tt: "Исламские и #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейские#!#! общины воспринимают это решение как доказательство, что короне можно верить"
 d009_convivencia.6.b: "Отменим решение и рассмотрим дело в королевском суде."
 d009_convivencia.6.b.tt: "Исламские и #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейские#!#! общины видят, как суды альхамы постепенно лишают полномочий"
 d009_convivencia.6.historical_info: "Альхамы, самоуправляющиеся мусульманские и еврейские общины христианской Иберии, обычно обладали ещё и судебной автономией. Выданные короной хартии разрешали их судам использовать мусульманское или еврейское право при рассмотрении внутренних споров. Конкретно это дело вымышленное, но лежащая в его основе напряженность, столь драматично проиллюстрированная, была постоянной. Решения судов короны и общин зачастую различались, а  степень, в которой корона была готова отдать общинным судам право последнего слова, значительно варьировалась в зависимости от королевства и века."
 d009_convivencia.7.title: "Еврей-визирь для [ROOT.GetCountry.Custom('CL_GEN')]"
 d009_convivencia.7.entry: "Еврей-визирь"
 d009_convivencia.7.desc: "[target_character.GetName], выходец из #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейского#!#! семейства, одного из многих, обосновавшихся за стенами #TOOLTIP:LOCATION,granada,X #L Гранады#!#!, [Select_CString(target_character.IsFemale, 'снискала', 'снискал' )] славу искусного управителя: [Select_CString(target_character.IsFemale, 'она сведуща', 'он сведущ' )] в сборе дани и налогов, умеет заключать договоры и с одинаковой лёгкостью ведёт дела и с #TOOLTIP:RELIGIONGROUP,christian,X #L христианскими#!#!, и с #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманскими#!#! посланниками. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] уже неоднократно обращает на [Select_CString(target_character.IsFemale, 'неё', 'него' )] свой взор.\n\nВозвести этого человека на высокий пост — значит обеспечить иудейскому чиновнику значительное влияние, при том, что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] нашей державы состоит преимущественно из мусульман. Для Аль-Андалуса, впрочем, в этом нет ничего невиданного: подобная практика известна уже давно и восходит ещё к омейядским халифам. Но наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], да и простой народ, едва ли встретят такое назначение безропотно, как бы ни полезна была [Select_CString(target_character.IsFemale, 'её', 'его' )] служба для нашей казны."
 d009_convivencia.7.a: "Назначим [Select_CString(target_character.IsFemale, 'её', 'его' )] визирем."
 d009_convivencia.7.a.entry: "Назначим его визирём."
 d009_convivencia.7.b: "Назначить вместо [Select_CString(target_character.IsFemale, 'неё', 'него' )] мусульманина."
 d009_convivencia.7.b.entry: "Назначим вместо него мусульманина."
 d009_convivencia.7.historical_info: "Евреи-визири в мусульманской Иберии, действительно, были, и самым известным из них является Шмуэль ха-Нагид. В XI веке он занял пост визиря тайфского королевства Гранады. Иехосеф, сын Шмуэля, унаследовал должность и занимал её, пока в 1066 году его не убили во время погрома еврейской общины Гранады. Эмират Насридов, правивший в Гранаде с XIII века, унаследовал придворную культуру, в которой такие назначения, хоть и не обходившиеся без споров, имели исторические корни."
 d009_convivencia_7_judaism_population_tt: "В державе есть иудейское население"
