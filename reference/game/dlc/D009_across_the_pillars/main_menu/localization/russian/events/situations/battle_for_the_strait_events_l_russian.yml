l_russian:
 battle_for_the_strait_events.1.title: "Битва за пролив"
 battle_for_the_strait_events.1.desc_cas: "Выплачиваемая #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_INST')|L]#!#! дань исправно поступает на север. За ней следуют послы, вооружённые столь длинным списком жалоб, что [target_cas_country.GetGovernment.GetCourtTitle|l], а точнее, камердинер непременно сойдёт с ума, если решит рассмотреть каждую из них. Но к югу от Сьерра-Морены до сих пор сидят наши противники, а начавшаяся при Ковадонге Реконкиста ещё далека от завершения: она закончится лишь тогда, когда падёт [ShowBuildingTypeName('alhambra')] и [Select_CString(target_gra_ruler.IsFemale, 'правящая', 'правящий' )] там [target_gra_ruler.GetName].\n\nЧтобы совершить этот последний рывок, понадобится не один поход. Епископы на протяжении уже нескольких поколений призывают к крестовому походу. Великие дома смотрят на дело практичнее: им важнее возможность получить новые земли. Наша задача — поддерживать эти усилия так, чтобы престол [target_gra_country.Custom('CL_GEN')] наконец пошатнулся."
 bfts_intro_tt: "В этой ситуации становятся доступны механики, связанные с #L [target_cas_country.GetAdjective|l]им#! и #L [target_mor_country.GetAdjective|l]им#! влиянием на #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_ACC')|L]#!#!. На этой шкале есть #Y 4#! пороговых значения, каждое из которых даёт соответствующий бонус"
 battle_for_the_strait_events.1.desc_mor: "По ту сторону пролива [target_cas_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_cas_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_cas_country.Custom('CL_tt')],X [target_cas_country.Custom('CL_GEN')|L]#!#! постепенно усиливает давление на #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_ACC')|L]#!#! — месяц за месяцем, выплата за выплатой. [target_gra_country.GetGovernment.GetCourtTitle|U] присылает письма ежемесячно, иногда — еженедельно. Они просят золота, но на самом деле ждут, что [target_mor_country.GetGovernment.GetRulerTitle|l] нашей державы нанесёт удар в самое сердце, питающее эту войну.\n\nЭто дело не закончить за один срок. [target_mor_country.GetGovernment.GetEstateName('clergy_estate')|U] наших городов ещё со времён падения последнего альмохадского халифа призывают к #italic джихаду#!. Если мы оставим эту войну наследникам, заканчивать её придётся их правнукам."
 battle_for_the_strait_events.1.desc_gra: "Мы оказались между двумя молотами, и каждый из них сжимает улыбчивый колосс. На севере правит [target_cas_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_cas_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_cas_country.Custom('CL_tt')],X [target_cas_country.Custom('CL_GEN')|L]#!#! — этот человек год за годом взимает дань и терпеливо ждёт, пока надломится религиозный фундамент #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_GEN')|L]#!#!. Через пролив нам посылает предложения и дары [target_mor_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_mor_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_mor_country.Custom('CL_tt')],X [target_mor_country.Custom('CL_GEN')|L]#!#!, по-настоящему хорошо знающий только один язык — язык #italic джихада#!, и цену этим подаркам мы знаем хорошо: полное подчинение нашего престола.\n\nВот так и умирает #italic тайфа#!. Не мгновенно, не под натиском отдельно взятого войска, а медленно, по мере того, как [target_gra_country.GetGovernment.GetCourtTitle|l] забывает, как давать отказ. Мы продержались дольше многих; теперь наша задача на грядущие годы — пережить одного терпеливого и одного честолюбивого соседа, а заодно позаботиться о том, чтобы хроники [target_gra_country.Custom('CL_GEN')] были длиннее, чем хроники других #italic тайф#!, не сумевших выдержать натиск."
 bfts_explain_granadan_sovereignty_tt: "Открывает доступ к [granadan_sovereignty|e] через панель [situation|e]"
 battle_for_the_strait_events.1.desc_christian: "До нас доходят вести: [target_cas_country.GetName] готов[target_cas_country.Custom('end_ityat')]ся обрушить всю мощь [target_cas_country.Custom('rank_ru_GEN')|l] на #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_ACC')|L]#!#! — последнюю #TOOLTIP:RELIGIONGROUP,muslim,X #L исламскую#!#! державу полуострова. Юг Иберии не знал подобных перипетий со времён походов Фернандо III.\n\nПоследствия этого противостояния выйдут далеко за пределы наших границ. Победа [target_cas_country.GetAdjectiveWithNoTooltip|l]их войск завершит Реконкисту на условиях, обговорённых в #TOOLTIP:LOCATION,toledo,X #L Толедо#!#!: южные провинции перейдут под власть одной короны. Если [target_mor_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_mor_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_mor_country.Custom('CL_tt')],X [target_mor_country.Custom('CL_GEN')|L]#!#! с той стороны пролива решит вмешаться всерьёз, на наших морских путях впервые за сто лет могут вновь появиться мусульманские галеры. Как бы ни закончилась эта борьба, карта #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! уже никогда не будет прежней."
 battle_for_the_strait_events.1.desc_muslim: "[target_mor_country.GetGovernment.GetRulerTitle|U] #ONCLICK:COUNTRY,[target_mor_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_mor_country.Custom('CL_tt')],X [target_mor_country.Custom('CL_GEN')|L]#!#! [Select_CString(target_mor_ruler.IsFemale, 'устремила', 'устремил' )] взор на север. [target_gra_country.GetName] — последняя #TOOLTIP:RELIGIONGROUP,muslim,X #L исламская#!#! держава земли [ShowFormableCountryName('ADU_f')] — подвергается беспощадному давлению: [target_cas_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_cas_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_cas_country.Custom('CL_tt')],X [target_cas_country.Custom('CL_GEN')|L]#!#! выжимает из неё все соки, выплата за выплатой, и каждую пятницу в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#! простому народу напоминают, ради чего это происходит.\n\nНам остаётся следить за борьбой, как бы далеко от наших границ она ни решалась. Если [target_mor_country.GetNameWithNoTooltip] выступ[target_mor_country.Custom('end_ityat')] в защиту престола [target_gra_country.Custom('CL_GEN')], [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'наша', 'наш' )] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] будет воспеваться в #italic хутбах#! до самой Кордовы, — и это произойдёт ещё на нашем веку. Если же [target_cas_country.GetGovernment.GetRulerTitle|l] [target_cas_country.Custom('CL_GEN')] сумеет насильно крестить [target_gra_country.Custom('rank_ru_ACC')|l], тогда [ShowFormableCountryNameWithNoTooltip('ADU_f')] лишится последнего оплота, а вместе с этим завершится и история, берущая своё начало от Тарика ибн Зияда."
 battle_for_the_strait_events.1.option_cas: "Иберия будет отвечать христианской короне."
 battle_for_the_strait_events.1.option_mor: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] вернётся в состав халифата."
 battle_for_the_strait_events.1.option_gra: "Мы переживём устремления обоих."
 battle_for_the_strait_events.1.option_christian: "От исхода этой борьбы зависит судьба Иберии."
 battle_for_the_strait_events.1.option_muslim: "От исхода этой борьбы зависит, как будет выглядеть [ShowFormableCountryNameWithNoTooltip('ADU_f')]."
 battle_for_the_strait_events.2.title: "Победа в Реконкисте"
 battle_for_the_strait_events.2.desc: "В #TOOLTIP:LOCATION,granada,X #L Гранаде#!#! звучит последняя пятничная молитва, но ответного звона колоколов уже не слыхать. Не проходит и часа, как восточную стену здания начинают обмерять: здесь будет апсида. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'довела', 'довёл' )] до конца дело, начатое когда-то королями Астурии. Реконкиста завершена.\n\nИберийские летописцы теперь будут отсчитывать время по новой границе, между эпохами #italic «до Гранады#!» и #italic «после Гранады»#!. Границу эту прочертила именно наша корона — и этой великой чести не нужны никакие объяснения."
 battle_for_the_strait_events.2.a: "Над проливом воссиял крест."
 battle_for_the_strait_events.3.title: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] возвращается в руки верующих"
 battle_for_the_strait_events.3.desc: "[ShowFormableCountryName('ADU_f')] может вздохнуть спокойно: мы ответили на призыв. Мы сломили #ONCLICK:COUNTRY,[target_cas_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_cas_country.Custom('CL_tt')],X [target_cas_country.Custom('CL_ACC')|L]#!#!, освободив [GetCountry('GRA').Custom('rank_ru_ACC')|l] от гнёта и положив конец многолетней выплате дани. [target_ruler.GetName] теперь общепризнанно считается покровителем последней #TOOLTIP:RELIGIONGROUP,muslim,X #L исламской#!#! державы полуострова, а [Select_CString(target_ruler.IsFemale, 'её', 'его' )] имя отныне звучит в пятничных молитвах по всему #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! вплоть до самой #TOOLTIP:LOCATION,granada,X #L Гранады#!#!.\n\nМы вновь провозгласили Маринидский халифат. #italic Баят#!, который принесли наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], — полноценное признание того, что [ShowFormableCountryNameWithNoTooltip('ADU_f')] находится под нашей опекой. Мы возложили на себя обязанность заботиться о каждом жителе нашей державы, даже о тех, кто не исповедует ислам. О нашем правлении будут судить по тому, как мы обойдёмся с этими людьми. Мы продолжаем дело, начатое когда-то великими Альмохадами."
 battle_for_the_strait_events.3.a: "Наши знамёна развеваются по обе стороны пролива."
 bfts_andalus_formation_eased_tt: "Теперь для создания державы [ShowFormableCountryNameWithNoTooltip('ADU_f')] нам понадобится контролировать #G меньше#! иберийских территорий"
 battle_for_the_strait_events.4.title: "Вечный престол [GetCountry('GRA').Custom('CL_GEN')]"
 battle_for_the_strait_events.4.desc: "#L [target_cas_country.GetAdjective]ая#! корона больше не выдвигает новых требований. После того как прошлым летом флот так и не вышел из #L [target_mor_country.GetAdjective|l]их#! портов, новой попытки собрать силы уже не последовало. [target_gra_country.GetCapital.GetName] остаётся собой; трон всё так же принадлежит его законному обладателю. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'совершила', 'совершил' )] то, о чём при дворе мечтали почти полстолетия: [Select_CString(target_ruler.IsFemale, 'пережила', 'пережил' )] борьбу и [Select_CString(target_ruler.IsFemale, 'дождалась', 'дождался' )], пока противостояние сойдёт на нет.\n\nВпереди ждёт ещё много трудностей. Завоевание поставило точку в этой истории, но закрывать книгу ещё рано: покуда мы сохраняем стойкость, в ней будут появляться новые страницы. Нашим преемникам мы оставляем пример не того, как надо побеждать, а того, как надо уметь ждать. Летописцы напишут про нас: «[target_gra_country.GetName] — эмират, отказавшийся пасть в отведённый ему срок»."
 battle_for_the_strait_events.4.a: "Гранада свободна."
 bfts_reconquest_cb_unlocked_tt: "Теперь мы можем сфабриковать повод для войны «[ShowCasusBelliName('cb_reconquer_iberia')]», который сокращает затраты военного счёта на отвоевание #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!"
 bfts_iberia_fully_integrated_tt: "Каждый удерживаемый нами [Concept('location', 'район')|e] #TOOLTIP:AREA,granada_area,X #L Гранады#!#!, #TOOLTIP:AREA,andalusia_area,X #L Андалусии#!#! и #TOOLTIP:AREA,murcia_area,X #L Мурсии#!#! получает новый статус [Concept('integration', 'интеграции')|e] и считается [Concept('core', 'национальным')|e]"
 bfts_taifa_annexation_boosted_tt: "Каждая присоединяемая нами сейчас [ShowSubjectTypeName('taifa')|l] получает #G 25%#! к прогрессу [Concept('annexation', 'присоединения')|e]"
 battle_for_the_strait_events.5.title: "$battle_for_the_strait$ завершается"
 battle_for_the_strait_events.5.desc_cas: "Прошли годы. [target_cas_country.GetGovernment.GetCourtTitle|U] нашей державы больше не ведёт счёт прибывающим и уходящим послам — настолько они многочисленны. Уже дважды обозы с данью пришли с опозданием и не в полном объёме; последовавшие за этим извинения почти дословно повторяют те, что мы слышали двадцать лет назад. [target_ruler.GetName] не дождётся воздвижения креста над #TOOLTIP:LOCATION,granada,X #L Гранадой#!#!.\n\nМы долго и тщательно готовились к войне, которую так и не смогли довести до конца. Пограничные крепости пустуют и ветшают. Многие #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусцы#!#!, которых мы когда-то пригласили на службу в канцелярию, обзавелись семьями, и теперь за канцелярскими столами сидят их правнуки. Ни епископы, ни великие дома за эти годы не отказались от своих притязаний. Одни по-прежнему требуют крестового похода, другие мечтают о новых земельных наделах. А большинство — будем честны — хотят и того, и другого. Время сделать решительный шаг ушло безвозвратно. Нашим наследникам мы оставим незаконченный спор — и по-прежнему разделённый полуостров."
 battle_for_the_strait_events.5.desc_mor: "Наступает новый век, но по ту сторону пролива всё так же звучит призыв, который когда-то слышали наши деды. Флоты нашей державы уже не раз возвращались домой, так и не дав сражение. [target_mor_country.GetGovernment.GetEstateName('clergy_estate')|U], каждую пятницу призывавшие к #italic джихаду#! на протяжении двух поколений, сегодня слишком дряхлы, чтобы продолжать свою борьбу. [target_ruler.GetName] уже не водрузит наше знамя на том берегу.\n\nНо одолела нас вовсе не #L [target_cas_country.GetAdjective|l]ая#! корона. Реконкиста не стала ближе к завершению — как, впрочем, и возрождение державы Альмохадов. Мы испробовали всё, что когда-то приносило нам успех, — и порой нам действительно сопутствовала удача. Менялась расстановка сил, менялось положение, но перелома так и не произошло. Дело, которое наше предки начали при великих Альмохадах, продолжит новое поколение. И конца этой истории по-прежнему не видно."
 battle_for_the_strait_events.5.desc_gra: "Прошло два века. На престоле #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_GEN')|L]#!#! по-прежнему восседает [target_gra_country.GetGovernment.GetRulerTitle|l]. Хронисты разделились во мнениях: для кого-то такой порядок — лишь небольшая победа, для иных же почти чудо. Опасения правителей #ONCLICK:COUNTRY,[target_cas_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_cas_country.Custom('CL_tt')],X [target_cas_country.Custom('CL_GEN')|L]#!#! и надежды владык #ONCLICK:COUNTRY,[target_mor_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_mor_country.Custom('CL_tt')],X [target_mor_country.Custom('CL_GEN')|L]#!#! не подтвердились: [target_ruler.GetName] не [Select_CString(target_ruler.IsFemale, 'совершила', 'совершил' )] ничего, кроме самого необходимого.\n\nВсё построенное нашими руками служило одной цели: выживанию. Мы должны были дождаться, пока ветер истории рассеет прах наших врагов. [ShowBuildingTypeName('alhambra')|U] по-прежнему растёт ввысь и вширь, а #italic хинеты#! всё так же держатся в седле. Два покровителя, тянувшие нас каждый в свою сторону, выдохлись прежде, чем смогли сломить нас. Мы не победили в этой борьбе и не положили ей конец — мы переждали её. Теперь новый век покажет, чего стоило наше терпение."
 battle_for_the_strait_events.5.option_cas: "Этот труд возьмут на себя наши потомки."
 battle_for_the_strait_events.5.option_mor: "Когда придёт час, призыв раздастся вновь."
 battle_for_the_strait_events.5.option_gra: "Мы стойко терпим превратности судьбы."
 battle_for_the_strait_concludes_tt: "[ShowSituationName('battle_for_the_strait')] завершается"
 enable_extra_modifier_crown_castile_reform_tt: "Наш [Concept('government_reform', 'государственный принцип')|e] «[ShowGovernmentReformName('crown_castile_reform')]» станет эффективнее"
 bfts_dominate_iberia_golden_century_tt: "Становится доступно [Concept('decision', 'решение')|e] «$gc_decision.title$», вызывающее [Concept('situation', 'ситуацию')|e] «[ShowSituationName('golden_century')]»"
 # ===== Battle for the Strait (migrated from battle_for_the_strait_l_english.yml) =====
 battle_for_the_strait_events.21.title: "Андалусцы возвращаются домой"
 battle_for_the_strait_events.21.desc: "По торговым путям и через родных до мудехаров #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! доходит весть: мы готовы принять в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] тех, кто согласен жить по нашим законам, и обеспечить им защиту. Из провинции [target_province_origin.GetName], где уже двадцать лет #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусские#!#! семьи терпят власть #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#!, к границе начинают стекаться многочисленные обозы.\n\nС собой эти люди везут молитвенники, ключи от домов, которые, возможно, больше никогда не увидят, и рекомендательные письма к нашим купцам. Через несколько месяцев [target_province_destination.GetName] станет им домом, и они начнут заново устраивать разрушенную Реконкистой жизнь."
 battle_for_the_strait_events.21.a: "Мы примем учёных."
 battle_for_the_strait_events.21.historical_info: "От арабского слова #italic «мудаджан»#! («те, кому дозволено остаться») произошло арагонское и кастильское «мудехар» — так называли мусульман, которым позволили остаться на своих землях после великих завоеваний XIII века. Земледельцы, ремесленники и учёные — обитатели городов, протянувшихся от Тахо до Эбро, — продолжали жить, трудиться и молиться там, где жили, трудились и молились их предки, пусть даже над городскими соборами уже возвышались кресты.\n\nНо положение мудехаров было непрочным: их регулярно изгоняли, облагали неподъёмными налогами и принуждали к обращению в христианство, вынуждая покидать родные края. Волны переселенцев двигались на юг, к последнему мусульманскому государству бывшего Аль-Андалуса. Насридские эмиры вели себя щедро: они раздавали беженцам землю и обещали возможность жить по исламскому закону. Каждая новая подобная волна не только напоминала жителям Гранады о погибших #italic тайфах#!, но и подпитывала притязания эмирата на наследие Аль-Андалуса."
 battle_for_the_strait_events.22.title: "Прибытие шазилийского ордена"
 battle_for_the_strait_events.22.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] встречает шазилийских шейхов, прибывших сюда из великих #italic завий#!, что именуются [ShowLocationName('sale')] и [ShowLocationName('tetouan')]. С собой они привезли рекомендательные письма; судя по ним, за этими людьми стоит [GetCountry('MOR').GetGovernment.GetRulerTitle|l] из династии [GetCountry('MOR').GetGovernment.GetRulerOrRegent.GetDynasty.GetName]. Наши гости — образованные люди, привыкшие к городской жизни, а вовсе не мистики из пустыни. Они сведущи в законе и знают #italic «Книгу мудростей»#! Ибн Ата Аллаха, свободно чувствуют себя как за столом у купцов, так и при дворе.\n\nОни пришли к нам с предложением. При нашей поддержке шейхи готовы основать новую #italic завию#! непосредственно в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] и использовать свои связи по обе стороны пролива в интересах нашей державы. Их присутствие при дворе усилит влияние сторонников #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L правовой#!#! школы [ROOT.GetCountry.GetReligiousSchool.GetName]. Вместе с этим мы заручимся авторитетом святых; этот ценный ресурс — один из тех немногих, которым ничего не могут противопоставить #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! державы. Нам предстоит решить, выделить ли им деньги, и если да, то когда и в каком объёме."
 battle_for_the_strait_events.22.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] с радостью их примет."
 battle_for_the_strait_events.22.a.entry: "Двор с радостью их примет."
 battle_for_the_strait_events.22.entry: "$battle_for_the_strait_events.22.title$"
 dmc_arrival_intro: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] нашей державы встречает человека по имени [converted_character.GetName] — [Select_CString(converted_character.IsFemale, 'её', 'его' )] по нашему требованию выдал[GetCountry('GRA').Custom('end_fem')] нам [GetCountry('GRA').GetName]. Перед капитулом собора над [Select_CString(converted_character.IsFemale, 'ней', 'ним' )] совершают обряд крещения, после чего новое #TOOLTIP:RELIGIONGROUP,christian,X #L христианское#!#! имя заносят в церковные книги."
 battle_for_the_strait_events.30.title: "Новообращённый при дворе"
 battle_for_the_strait_events.30.desc_centralization: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] оказывается весьма способным работником канцелярии. От [Select_CString(converted_character.IsFemale, 'неё', 'него' )] мы узнаём, как [GetCountry('GRA').GetAdjectiveWithNoTooltip|l]ие власти собирают налоги и дань, и эти знания помогают короне усиливать давление на великие дома, которые сами никогда не согласились бы на подобные меры."
 battle_for_the_strait_events.30.desc_innovative: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] возит в седельных сумках письма, трактаты и расчётные таблицы — достояние #TOOLTIP:LOCATION,cordoba,X #L кордовских#!#! библиотек. Благодаря этому прежде недоступному языку перед нашими учёными открываются новые знания."
 battle_for_the_strait_events.30.desc_estate_nobles: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] благодаря своему знатному происхождению занимает в нашей державе высокое место: [actor.GetGovernment.GetEstateName('nobles_estate')] считают [Select_CString(converted_character.IsFemale, 'её своей', 'его своим' )]. Старейшины довольны: новый дом после обращения в другую веру оказывается связан с ними общими интересами."
 battle_for_the_strait_events.30.desc_estate_clergy: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] — учёный человек, чему весьма рады наши [actor.GetGovernment.GetEstateName('clergy_estate')], в ряды которых [Select_CString(converted_character.IsFemale, 'она вступила', 'он вступил' )]. [Select_CString(converted_character.IsFemale, 'Её', 'Его' )] познания в #italic шариате#! оказываются крайне ценны каждый раз, как в стенах собора разгораются диспуты."
 battle_for_the_strait_events.30.desc_estate_burghers: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] предпочитает жизнь в торговых городах, среди сословия, гордо называющего себя «[actor.GetGovernment.GetEstateName('burghers_estate')]». Знание торговых путей, ведущих на юг, в #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#!, открывает перед [Select_CString(converted_character.IsFemale, 'ней', 'ним' )] что угодно: любую купеческую книгу, любой склад."
 battle_for_the_strait_events.30.desc_estate_peasants: "$dmc_arrival_intro$\n\nПри нашем дворе [Select_CString(converted_character.IsFemale, 'ей', 'ему' )] уже не обрести того же положения, какое [Select_CString(converted_character.IsFemale, 'она занимала', 'он занимал' )] по ту сторону границы, поэтому теперь [converted_character.GetNameWithNoTooltip] живёт в самом сердце нашей державы, там же, где трудятся простые [actor.GetGovernment.GetEstateName('peasants_estate')]."
 battle_for_the_strait_events.30.desc_child_tutor: "$dmc_arrival_intro$\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] назначает [Select_CString(converted_character.IsFemale, 'её', 'его' )] преподавателем для [Select_CString(actor.GetGovernment.GetHeir.IsFemale, 'нашей наследницы', 'нашего наследника' )] по имени [actor.GetGovernment.GetHeir.GetName]. Знания, почерпнутые когда-то в [GetCountry('GRA').Custom('CL_PREP')], [converted_character.GetNameWithNoTooltip] передаёт ребёнку-#TOOLTIP:RELIGIONGROUP,christian,X #L христианину#!#!. Тот оказывается способным учеником: астрономия, счетоводство, искусство управления — всё это усваивается без труда."
 battle_for_the_strait_events.30.desc_administrators: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] получает должность при нашей канцелярии, и [Select_CString(converted_character.IsFemale, 'её', 'его' )] знания #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабских#!#! торговых книг и торговых путей #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! оказываются полезными для наших купцов. Благородные дома наших городов обретают по ту сторону пролива новых торговых партнёров — и новых должников."
 battle_for_the_strait_events.30.a: "Эта душа принесёт немало пользы нашей вере."
 battle_for_the_strait_events.31.title: "[actor.GetNameWithNoTooltip] навязывает [GetCountry('GRA').Custom('CL_DAT')] вассалитет"
 battle_for_the_strait_events.31.desc: "Всё решено. Отныне [GetCountry('GRA').GetName] — наш вассал, и никакие протесты ничего не изменят: договор надёжно скреплён печатью.\n\nПо ту сторону пролива всё понимают без лишних слов: [GetCountry('GRA').GetFlavorRank|l] больше не в силах самостоятельно распоряжаться своей судьбой, а номинальным правителям [GetCountry('GRA').Custom('CL_GEN')] теперь приходится преклонять голову там, где недавно они сами отдавали приказы. Одни проглотят оскорбление и будут верно нам служить, другие же будут вынашивать надежду когда-нибудь сбросить ярмо. Но как бы то ни было, борьба за пролив сейчас складывается в нашу пользу, и мы намерены воспользоваться этим преимуществом."
 battle_for_the_strait_events.31.a: "Против печати не пойти."
 battle_for_the_strait_events.32.title: "[GetCountry('MOR').GetNameWithNoTooltip] навязыва[GetCountry('MOR').Custom('end_etyut')] [GetCountry('GRA').Custom('CL_DAT')] дань"
 battle_for_the_strait_events.32.desc: "Мы добились своего: [GetCountry('GRA').GetName] отныне буд[GetCountry('GRA').Custom('end_etut')] выплачивать нам дань. Условия были согласованы ещё до того, как дипломаты другой стороны успели выразить протест. Казна [GetCountry('GRA').Custom('rank_ru_GEN')|l] теперь открыта для наших проверяющих, и по ту сторону пролива уже успели ощутить всю тяжесть нового положения.\n\n[GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')|U] [GetCountry('GRA').Custom('CL_GEN')] молча подсчитывают, сколько золота будет каждый сезон уходить на юг. Сегодня уже не столь важно, останется ли [GetCountry('GRA').GetFlavorRank|l] под нашим влиянием или однажды попробует сбросить ярмо, — главное, что долгая борьба за пролив приближается к развязке."
 battle_for_the_strait_events.32.a: "Подсчитаем содержимое казны."
 battle_for_the_strait_events.61.title: "[GetCountry('CAS').GetNameWithNoTooltip] возобновляет парии [GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.61.desc: "Дань восстановлена без единого удара меча. Наши послы настаивали на своём в [GetCountry('GRA').GetName], пока условия не были подписаны, и старые парии вновь занесены в свитки [GetCountry('GRA').GetFlavorRank].\n\nКаждый сезон золото будет идти на север, в нашу казну, а вместе с ним — молчаливое понимание того, что [GetCountry('GRA').GetFlavorRank] удерживает трон лишь по нашей милости. [GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] [GetCountry('GRA').GetNameWithNoTooltip] пересчитывает сумму и молчит. Понесут ли они это бремя или сбросят его — борьба за пролив приближается к своему концу."
 battle_for_the_strait_events.61.a: "Пусть свитки будут составлены."
 # ===== STUBS - generic recurring events =====
 battle_for_the_strait_events.40.title: "Словно в кандалах"
 battle_for_the_strait_events.40.desc_cas: "Такова наша горькая участь: мы живём под знаменем #ONCLICK:COUNTRY,[target_cas_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_cas_country.Custom('CL_tt')],X [target_cas_country.Custom('CL_GEN')|L]#!#!, и судьбу нашу определяет [target_cas_ruler_regent.GetName]. Последние события и пограничные столкновения побудили [target_cas_country.Custom('rank_ru_ACC')|l] потребовать от нас новых заверений в покорности — таких, чтобы они были очевидны всем. Их послы говорят о дружбе, но разве можно назвать дружбой требование денег и уступок? Поддаться — значит ещё немного поступиться своим положением. Отказаться — значит вновь навлечь на себя гнев их всадников."
 battle_for_the_strait_events.40.desc_mor: "Такова наша горькая участь: в глазах [target_mor_country.Custom('rank_ru_GEN')|l] мы — не более чем младший партнёр. В письмах [target_mor_ruler_regent.GetName] из #ONCLICK:COUNTRY,[target_mor_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_mor_country.Custom('CL_tt')],X [target_mor_country.Custom('CL_GEN')|L]#!#! называет нас братьями по вере, но на деле требует того же, что и другой наш сосед: подтверждения нашей покорности. Это выдаётся за естественный порядок, в котором слабый уступает сильному. Их флот и золото уже не раз выручали нас, и нам не дадут забыть об этом. Принять их условия — значит ещё сильнее попасть под их влияние. Отказать — значит гадать, придёт ли следующий флот на помощь."
 battle_for_the_strait_events.40.a: "Поступимся суверенитетом и дадим заверения."
 battle_for_the_strait_events.40.b: "Выплатим деньги их дипломатам."
 battle_for_the_strait_events.40.c: "Мы не станем слушать их пустые угрозы!"
 battle_for_the_strait_events.41.title: "[Select_CString(target_character_1.IsFemale, 'Честолюбивая', 'Честолюбивый' )] [target_character_1.GetNameWithNoTooltip]"
 battle_for_the_strait_events.41.desc: "[target_character_1.GetName] уже достаточно долго пользуется неслыханным авторитетом при нашем дворе. Последние события лишь укрепили [Select_CString(target_character_1.IsFemale, 'её', 'его' )] положение: в руках этого человека сегодня сосредоточено столько власти, что даже [target_character_2.GetName] начинает опасаться за своё влияние. Подобные честолюбивые устремления могут зародиться даже в светлейшем и достойнейшем из умов, а слугу, успевшего обрести такую власть, уже не так просто отстранить от дел. Если ничего не предпринять, [target_character_1.GetShortNameWithNoTooltip] вскоре подчинит себе всю державу. Но если слишком стеснить [Select_CString(target_character_1.IsFemale, 'её', 'его' )] в правах, способный советник превратится в злейшего врага."
 battle_for_the_strait_events.41.a: "[target_character_1.GetSheHe|U] отлично справляется!"
 battle_for_the_strait_events.41.b: "[target_character_1.GetShortNameWithNoTooltip], ты [Select_CString(target_character_1.IsFemale, 'уволена', 'уволен' )]!"
 battle_for_the_strait_events.42.title: "Грузовые потоки"
 battle_for_the_strait_events.42.desc: "За последние несколько столетий [target_country.GetName] стал[target_country.Custom('end_fem')] одной из излюбленных остановок для купцов, прибывающих с побережья #TOOLTIP:REGION,italy_region,X #L Италии#!#! и далёкого #TOOLTIP:REGION,sahel_region,X #L Сахеля#!#!. В последнее время торговля особенно процветает, о чём свидетельствуют и наши книги: приток денег заметно увеличился. #TOOLTIP:GOODS,silk,X #L Шёлк#!#!, #TOOLTIP:GOODS,sugar,X сахар#! и #TOOLTIP:GOODS,fruit,X #L фрукты#!#! уходят со складов быстрее, чем писцы успевают вести учёт, а [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не имеет единого мнения о том, куда лучше направить дополнительную прибыль. Решение остаётся за нами."
 battle_for_the_strait_events.42.a: "Вложим деньги в инфраструктуру."
 battle_for_the_strait_events.42.b: "Будем помогать творцам и учёным."
 battle_for_the_strait_events.42.c: "Раздадим деньги народу."
 battle_for_the_strait_events.42.d: "Положим средства в казну."
 battle_for_the_strait_events.42.e: "Покажем всем, насколько мы великолепны и независимы!"
 battle_for_the_strait_events.43.title: "Наше влияние на [target_gra_country.Custom('CL_ACC')]"
 battle_for_the_strait_events.43.desc: "Борьба за пролив не прекращается, и [target_gra_country.GetName] — в самой гуще жестоких и кровопролитных сражений. Богатство державы и образованность её жителей здесь скорее обуза, чем утешение: [target_gra_country.GetFlavorRank|l] — желанная добыча именно по этим причинам. Пока армии ведут войну, [target_gra_country.GetGovernment.GetRulerTitle|l] принимает дары и послов от обеих сторон — каждый пытается задобрить этого человека, чтобы заручиться его расположением. Если кому-то из них это удастся, пролив может закрыться для нас на целое поколение. Наше собственное влияние необходимо укреплять уже сейчас, пусть даже ценой добрых отношений, иначе мы окажемся в руках врагов."
 battle_for_the_strait_events.43.a: "Нужно проявить силу."
 battle_for_the_strait_events.43.b: "Не будем спешить."
 battle_for_the_strait_events.44.title: "Появление эрудита"
 battle_for_the_strait_events.44.desc: "Ни для кого не секрет, что [target_gra_country.GetLongName] — держава, славящаяся своими великими учёными и мыслителями. Яркий пример тому — [target_polymath.GetName], невероятный ум, выходец из духовенства. [Select_CString(target_polymath.IsFemale, 'Её', 'Его' )] имя известно повсюду; об этом человеке слышали даже в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Знает про [Select_CString(target_polymath.IsFemale, 'неё', 'него' )], разумеется, и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Такой человек дороже любой, даже самой надёжной крепости. Но [Select_CString(target_polymath.IsFemale, 'она согласна', 'он согласен' )] служить [target_root_country.Custom('rank_ru_DAT')|l] только при одном условии: мы должны признать [target_gra_country.Custom('CL_ACC')] равной нам суверенной державой…"
 battle_for_the_strait_events.44.a: "[target_polymath.GetSheHe|U] стоит таких дипломатических усилий!"
 battle_for_the_strait_events.44.b: "Будем полагаться на просветлённые [target_root_country.GetAdjectiveWithNoTooltip|l]ие умы!"
 battle_for_the_strait_events.44.c: "Мы положимся на превосходство [target_root_country.GetAdjectiveWithNoTooltip] умов!"
 target_polymath_resides_in_target_gra_country: "[target_polymath.GetName] останется проживать в [target_location.Custom('LR_PREP')|l] [target_location.GetName]"
 battle_for_the_strait_events.45.title: "Интерес к религии"
 battle_for_the_strait_events.45.desc: "До чего прекрасны #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! обряды, иконы и яркие облачения священников! Но что значат их песнопения, их священные писания? Как именно они понимают божественное?\n\n[target_root_ruler.GetName] в последнее время всё чаще задаётся этими вопросами. [Select_CString(target_root_ruler.IsFemale, 'Она начала', 'Он начал' )] принимать иностранных священнослужителей наедине и допоздна зачитываться их книгами. В [target_root_country.Custom('rank_ru_PREP')|l] к такому относятся с неодобрением, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] уже полушёпотом ведут разговоры о том, куда может завести подобное любопытство."
 battle_for_the_strait_events.45.a: "Человеку свойственно любопытство!"
 battle_for_the_strait_events.45.b: "Лучше заставим его вспомнить о других заботах!"
 battle_for_the_strait_events.46.title: "Научные стремления"
 battle_for_the_strait_events.46.desc: "С самого детства [target_character.GetName] проявляет глубокий интерес к естественным наукам. [Select_CString(target_character.IsFemale, 'Её', 'Его' )] занимает всё на свете: строение цветов, поведение пчёл, природа цвета, различные явления — нет такого вопроса, который не вызывал бы у [Select_CString(target_character.IsFemale, 'неё', 'него' )] любопытства. Разумеется, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] оказывает всяческое покровительство #italic медресе#! и библиотекам — вместилищам знаний. Звездочёты и лекари едва ли могли мечтать о более увлечённом покровителе. Однако каждый час, посвящённый их трудам, — это час, который можно было бы посвятить государственным заботам."
 battle_for_the_strait_events.46.a: "[target_university_location.GetNameWithNoTooltip] важнее всего!"
 battle_for_the_strait_events.46.b: "Священные тексты!"
 battle_for_the_strait_events.46.c: "[target_character.GetShortNameWithNoTooltip] уже не ребёнок!"
 ruler_will_study_tt: "[target_character.GetShortName] будет изучать науку…"
 target_character_studies_admin: "…управления"
 target_character_studies_diplomacy: "…дипломатии"
 target_character_studies_war: "…войны"
 battle_for_the_strait_events.47.title: "[Select_CString(target_character_1.IsFemale, 'Влиятельная', 'Влиятельный' )] [target_character_1.GetNameWithNoTooltip]"
 battle_for_the_strait_events.47.desc_a: "Несмотря на шаткое и неспокойное положение [ROOT.GetCountry.Custom('rank_ru_GEN')|l], [target_character_1.GetName] руководит разумно и умело; благодаря [Select_CString(target_character_1.IsFemale, 'её', 'его' )] стараниям мы по-прежнему сохраняем суверенитет. Руководить державой, зажатой с двух сторон алчными врагами, нелегко, но [target_character_1.GetShortNameWithNoTooltip] сохраняет твёрдость духа на зависть одновременно и друзьям, и недругам. Мы не станем подчиняться чужой воле, и наша государственность — главное тому свидетельство."
 battle_for_the_strait_events.47.desc_b: "Разумно предполагать, что государственная служба — удел людей честных и добросовестных, а служение народу должно быть главным призванием человека, занимающего столь высокую должность, как [target_character_1.GetName].\nНо на деле всё обстоит совсем иначе. Для таких людей, как [target_character_2.GetName], [target_character_1.GetShortNameWithNoTooltip] — хуже занозы: [Select_CString(target_character_1.IsFemale, 'она', 'он' )] никогда не упускает случая набить себе карман за наш счёт, охотно продавая должности и оказывая услуги за деньги. Просители, которым нечем заплатить, вынуждены уходить ни с чем. Мы не можем позволить себе чиновника, который в первую очередь заботится о собственном кошельке."
 battle_for_the_strait_events.47.a: "Блестящий пример!"
 battle_for_the_strait_events.47.b: "Как червь в компостной яме…"
 # ===== STUBS - unique / DHE one-shots =====
 battle_for_the_strait_events.50.entry: "Поучительная история Абу Абдаллы ибн аль-Хакима аль-Рунди"
 battle_for_the_strait_events.50.title: "[target_dead_guy.GetShortNameWithNoTooltip]: поучительная история"
 battle_for_the_strait_events.50.desc: "[ROOT.GetCountry.Custom('GetHeadOfCabinetName')|U] [target_dead_guy.GetName] уже давно [Select_CString(target_dead_guy.IsFemale, 'скончалась', 'скончался' )], но летописцы и поныне не упускают случая привести в пример историю этого человека. Некогда [Select_CString(target_dead_guy.IsFemale, 'она владела', 'он владел' )] обеими государственными печатями и [Select_CString(target_dead_guy.IsFemale, 'правила', 'правил' )] страной вместо наших предков. Всё закончилось, когда город восстал против [Select_CString(target_dead_guy.IsFemale, 'неё', 'него' )]: разъярённая толпа ворвалась во дворец, убила [Select_CString(target_dead_guy.IsFemale, 'её', 'его' )] и надругалась над телом, чтобы уже нечего было хоронить. По всей видимости, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] вскоре увидит повторение этой истории: [target_character.GetName] [Select_CString(target_character.IsFemale, 'сосредоточила', 'сосредоточил' )] в своих руках всю государственную власть, и [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] начинают перешёптываться: нельзя, чтобы слуги оказывались так близко к престолу. Мы можем либо ничего не предпринимать, и тогда [target_character.GetShortNameWithNoTooltip] продолжит поддерживать установившийся порядок, либо распустить совет, пока тот не вошёл во вкус и не начал управлять державой без нас."
 battle_for_the_strait_events.50.a: "Нам нужно больше таких людей, как [target_character.GetShortNameWithNoTooltip]."
 battle_for_the_strait_events.50.a.entry: "Нам нужно больше таких людей, как он."
 battle_for_the_strait_events.50.b: "Разъярённая толпа? Лучше не надо."
 battle_for_the_strait_events.50.c: "Не станем вмешиваться в события."
 status_quo_preserved_tt: "#italic Всё останется как есть#!"
 battle_for_the_strait_events.50.historical_info: "Абу Абдалла ибн аль-Хаким аль-Рунди, родившийся в Ронде в 1261 году, сделал карьеру при насридской канцелярии и со временем стал самым влиятельным визирём султана Мухаммада III. С 1303 года он носил редко присуждавшийся титул #italic «дху аль-визаратайн»#! — «владыка двух визириатов». Он вёл переговоры при заключении Кордовского договора, руководил захватом Сеуты в 1306 году, а к концу правления многие уже считали его фактическим властителем эмирата.\n\nНо такое могущество оказалось недолговечным. Во время дворцового переворота в марте 1309 года военачальник Атик ибн аль-Мауль убил его и приказал выбросить тело, которое впоследствии так и не нашли. История стремительного взлёта и падения аль-Рунди стала предостережением для других: чиновник, ставший более влиятельным, чем государь, рано или поздно превращается в угрозу."
 battle_for_the_strait_events.51.entry: "$battle_for_the_strait_events.51.title$"
 battle_for_the_strait_events.51.title: "Дом наук"
 battle_for_the_strait_events.51.desc: "Наши учёные давно добиваются основания в [target_location.Custom('LR_PREP')|l] [target_location.GetName] #TOOLTIP:BUILDING_TYPE,great_madrasa,X #L большого медресе#!#! — заведения, где, подобно великим городам Востока, сотни учащихся будут прилежно изучать право. [target_character.GetName] располагает средствами, достаточными, чтобы возвести медресе рядом с главной мечетью, куда стекаются толпы верующих. Такое учебное заведение поможет привлечь в державу новых учеников и правоведов, живущих по ту сторону пролива, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] будет пожинать плоды их труда."
 battle_for_the_strait_events.51.a: "Построим большое медресе рядом с главной мечетью."
 battle_for_the_strait_events.51.b: "Для нашей казны это слишком большое бремя."
 battle_for_the_strait_events.51.historical_info: "В 1349 году рядом с главной мечетью Гранады, там, где сейчас стоит собор, по приказу султана Юсуфа I было построено гранадское медресе — #italic «мадраса юсуфийя»#!. Здесь преподавали #italic маликитское#! право, а само медресе стало главным учебным заведением эмирата, не уступавшим знаменитым школам Феса и Каира.\n\nЕго многочисленные выпускники пополняли ряды правоведов и секретарей насридской канцелярии. До наших дней от медресе — некогда интеллектуального центра эмирата — сохранилась только молитвенная комната."
 wont_have_another_chance_to_build_tt: "#italic Нам больше не представится возможности получить такие преимущества#!"
 battle_for_the_strait_events.52.entry: "$battle_for_the_strait_events.52.title$"
 battle_for_the_strait_events.52.title: "Зал послов"
 battle_for_the_strait_events.52.desc: "[target_character.GetName] собирается возвести в великой #italic калахурре#! нашего дворца тронный зал для оказания достойного приёма заграничным послам. Кедровый потолок зала будет украшен невероятно подробной резьбой с изображением семи небес, расположенной прямо над троном: так каждый посол сможет воочию увидеть, какому порядку он подчиняется. Однако это начинание обойдётся казне очень дорого, пусть даже подобная красота и сможет рассказать о [target_location.Custom('LR_PREP')|l] [target_location.GetName] нагляднее любого письма."
 battle_for_the_strait_events.52.a: "Построим этот зал и разместим в нём наш престол."
 battle_for_the_strait_events.52.b: "Наши послы и без этого смогут вести переговоры."
 battle_for_the_strait_events.52.historical_info: "В середине XIV века по приказу Юсуфа I в замке Комарес была возведена тронная зала — Зал послов, и поныне остающийся самым большим помещением Альгамбры. Именно в этих великолепных стенах насридские султаны принимали иностранных послов.\n\nНа купольном кедровом потолке, составленном из тысяч соединённых между собой деталей, изображены семь небес — так в исламе традиционно представляли устройство мира. Трон расположен прямо под божественной вершиной. В дереве и лепнине воплотились невысказанные слова: эмир правит на земле по воле самих небес."
 battle_for_the_strait_events.53.entry: "$battle_for_the_strait_events.53.title$"
 battle_for_the_strait_events.53.title: "Новый караван-сарай"
 battle_for_the_strait_events.53.desc: "Прибывающие на наши рынки купцы давно нуждаются в полноценном #TOOLTIP:BUILDING_TYPE,funduq,X #L фундуке#!#! — укреплённом постоялом дворе, где торговцы могут остановиться на ночь и не беспокоиться о сохранности своих товаров, поскольку те будут храниться под замком. [target_character.GetName] уже [Select_CString(target_character.IsFemale, 'отвела', 'отвёл' )] под него место рядом с #TOOLTIP:GOODS,silk,X #L шёлковым#!#! рынком [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Особенно настойчивы в этом вопросе #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянские#!#! купцы: на их долю приходится значительная часть нашей торговли, поэтому, обеспечив им сохранность товаров, мы обеспечим заодно и приток таможенных сборов."
 battle_for_the_strait_events.53.a: "Построим фундук — пусть торговля идёт через него."
 battle_for_the_strait_events.53.historical_info: "#italic Аль-фундук аль-Джадида#! (по-кастильски «Корраль-дель-Карбон») — единственный сохранившийся в Иберии насридский караван-сарай; первые письменные упоминания о нём относятся к XIV веку. Это сооружение, принадлежавшее жёнам насридских султанов, было расположено рядом с #italic алькайсерией#! — закрытым шёлковым рынком Гранады. Здесь хранили зерно и давали купцам остановиться на ночлег.\n\nЗначительная доля торговли находилась в руках иностранцев, преимущественно — генуэзских купцов и банкиров: их манили сюда шёлк и золото, поступавшие из Сахары. Один из городских рынков в народе назывался просто: «генуэзская альондига»."
 battle_for_the_strait_events.54.entry: "$battle_for_the_strait_events.54.title$"
 battle_for_the_strait_events.54.title: "Трактат о заразной болезни"
 battle_for_the_strait_events.54.desc: "Один из самых светлых умов на службе нашей державы — [target_character.GetName] — представляет нам трактат, вызвавший искреннее недоумение у врачей. Вопреки принятым в нашу эпоху взглядам [target_character.GetShortNameWithNoTooltip] утверждает, что мор передаётся от больных к здоровым через одежду и посуду, а также в стеснённых условиях, например на борту корабля. При этом город якобы можно защитить от заразы, если изолировать больных и принять меры предосторожности. Духовенство называет такие рассуждения дерзким вызовом божественной воле, но, возможно, этот совет поможет нам не допустить ещё одной вспышки."
 battle_for_the_strait_events.54.a: "Применим этот совет в деле и выделим средства на работу."
 battle_for_the_strait_events.54.b: "Ничего страшного, это просто обычный кашель!"
 hospitals_benefit_tt: "В случае наличия у нас [Concept('buildings', 'сооружений')|e] типа «[ShowBuildingTypeName('hospital')]» [Concept('locations', 'районы')|e], в которых они расположены, получат бонус от [Concept('modifier', 'модификатора')|e] «[ShowModifier('contagion_practices_modifier')]»"
 battle_for_the_strait_events.54.historical_info: "Около 1362 года гранадский визирь и учёный Ибн аль-Хатиб написал #italic «Мукни’ат аль-Са’иль»#! — трактат о великой чуме, опустошившей Средиземноморье десятью годами ранее. Он утверждал, что болезнь передаётся от человека к человеку через одежду, посуду и очаги заражения, такие как порты, а изоляция помогает сдерживать её.\n\nЭти взгляды противоречили господствовавшему тогда учению, утверждавшему, что любой недуг приходит по воле Бога. Рукопись аль-Хатиба — редкое свидетельство средневековых представлений о том, что позже назовут карантином, — сохранилась в библиотеке Эскориала."
 battle_for_the_strait_events.55.entry: "Посольство в Каир"
 battle_for_the_strait_events.55.title: "Посольство в [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]"
 battle_for_the_strait_events.55.desc: "Не в силах больше мириться с давлением на границе, [target_gra_ruler.GetName] обращает взор на восток, к единственному владыке, ещё способному собрать целое войско во имя веры. В [target_location.Custom('LR_PREP')|l] [target_location.GetName] правит [target_mam_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_mam_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_mam_country.Custom('CL_tt')],X [target_mam_country.Custom('CL_GEN')|L]#!#!. Этот человек — хранитель священных городов, покровитель халифа, величайший властелин #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитского#!#! мира. Отправка посольства по морю — шаг рискованный и дорогостоящий, и неизвестно, что мы получим в ответ: войско, золото или только слова утешения. Но лучше попросить о помощи и не получить её, чем ничего не делать."
 battle_for_the_strait_events.55.a: "Отправим заморское посольство в [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]."
 battle_for_the_strait_events.55.a.entry: "Отправим заморское посольство в Каир."
 battle_for_the_strait_events.55.b: "Мы сами соберём верующих и одни дадим отпор."
 battle_for_the_strait_events.55.historical_info: "После того как в середине XIV века Кастилия усилила давление на Гранаду, насридский двор снарядил посольство в Каир — столицу Мамлюкского султаната, хранителей Мекки и Медины и покровителей номинальных аббасидских халифов. В лице мамлюков гранадские послы рассчитывали обрести союзников по суннитской вере.\n\nОднако те, занятые защитой собственных рубежей и отделённые от Гранады морем, так и не прислали войска, ограничившись лишь молитвой о победе и заверениями в поддержке единоверцев. Переписка между Гранадой и Каиром сохранилась в сборнике писем Ибн аль-Хаттиба — #italic «Райханат аль-Куттаб»#!."
 battle_for_the_strait_events.56.title: "Мольба с запада"
 battle_for_the_strait_events.56.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] нашей державы принимает у себя измученных долгой дорогой послов из #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_GEN')|L]#!#! — последней #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманской#!#! державы Запада, сегодня беспощадно теснимой христианскими королями. Они спрашивают, какую помощь им может оказать хранитель священных городов. Но от несчастных собратьев по вере нас отделяет море, и на наших собственных границах сейчас тоже неспокойно. И всё же нашего ответа ждут все без исключения правоверные. Ответ, который от нас получит [target_gra_ruler.GetName], надолго останется в памяти у потомков."
 battle_for_the_strait_events.56.a: "Мы — единоверцы. Присоединимся к их делу."
 battle_for_the_strait_events.56.b: "Отправим им столько воинов и золота, сколько можем позволить, но не более."
 battle_for_the_strait_events.56.c: "Мы не станем давать им воинов, но можем помолиться за них."
 gra_gets_nothing_tt: "Дипломаты #ONCLICK:COUNTRY,[target_gra_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_gra_country.Custom('CL_tt')],X [target_gra_country.Custom('CL_GEN')|L]#!#! возвращаются домой, получив наилучшие пожелания"
 may_give_alliance_military_eco_or_no_help: "Власти [target_mam_country.Custom('longname_ru_GEN')] могут послать или не послать нам помощь"
 alliance_better_chance_at_good_results_tt: "Поскольку мы заключили [Concept('alliance', 'союз')|e], вероятность, что нас выслушают, выше"
 battle_for_the_strait_events.60.title: "Меч и крест"
 battle_for_the_strait_events.60.entry: "$battle_for_the_strait_events.60.title$"
 battle_for_the_strait_events.60.desc: "Война за пролив чрезмерно затянулась. [target_ruler.GetName] собирается обратиться за помощью к братьям духовно-рыцарских орденов — их командорства протянулись вдоль границы именно на такой случай. Можно призвать их в полном составе, но тогда мы рискуем навлечь на себя недовольство братьев: они будут вынуждены тратить силы и личные средства на войну, которую развязали [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], хотя, несомненно, сражаться будут с пылом и задором. Можно запросить ограниченную помощь, чтобы частично сохранить их расположение, или же вовсе продолжить воевать своими силами."
 battle_for_the_strait_events.60.a: "Полностью призовём ордены."
 battle_for_the_strait_events.60.b: "Достаточно будет минимального их участия."
 battle_for_the_strait_events.60.c: "Не станем обращаться к орденам — у них и так хватает забот."
 battle_for_the_strait_events.6.title: "Границы больше нет"
 battle_for_the_strait_events.6.entry: "$battle_for_the_strait_events.6.title$"
 battle_for_the_strait_events.6.desc: "Война окончена, и в [ShowRegionName('iberia_region')] не осталось ни одного мавра, с которым можно было бы сражаться.\n\nЭто затруднение, которого никто не предвидел. Наши военные ордены удерживают замки вдоль границы, которой больше не существует, охраняют перевалы в землях, что ныне принадлежат нам, и собирают подати с провинций, которые мы отдали им для защиты. Это лучшие воины, какие у нас есть, и в этом году они впервые остались без войны.\n\nМагистры понимают это раньше нас. Они уже пишут, спрашивая, каковы наши намерения."
 battle_for_the_strait_events.6.a: "Обратить их на службу [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 battle_for_the_strait_events.6.b: "Отправить их за море."
 battle_for_the_strait_events.6.c: "Предоставить им самим найти своё предназначение."
 bfts_orders_sent_overseas_tt: "В дальнейших событиях будет учтено, что мы отправили наши [religious_orders|e] за море"
 bfts_orders_given_new_purpose_tt: "Каждый $iberian_military_order_type$ в нашей стране навсегда становится $zeal_imperial_purpose$, повышая целевое значение [zeal|e]"
 battle_for_the_strait_events.8.title: "Братья, что не вернулись"
 battle_for_the_strait_events.8.entry: "$battle_for_the_strait_events.8.title$"
 battle_for_the_strait_events.8.desc: "Колонна [target_order.GetName] попала в засаду на пересечённой местности — враг имел перевес и в позиции, и в числе бойцов, и отряд держался до тех пор, пока держать оборону стало уже некому.\n\nУцелевшие оказались в руках врага, и за них назначен выкуп. Сумма немалая: противник прекрасно знает, кого захватил — не ополченцев, а полноправных братьев ордена, который никогда ещё не бросал своих людей гнить в плену.\n\nМагистр не просил у нас денег. Он старательно избегал этой просьбы. В этом и состоит просьба."
 battle_for_the_strait_events.8.a: "Заплатить выкуп. Их не бросят."
 battle_for_the_strait_events.8.b: "Они приняли обеты, зная о риске."
 battle_for_the_strait_events.8.c: "Выкупа не будет, но они могут набирать людей из нашего ополчения."
 bfts_orders_left_to_decline_tt: "Каждый $iberian_military_order_type$ в нашей стране удерживает целевое значение [zeal|e] сниженным на $zeal_no_heathen_threat$"
 cas_retaliate_with_raids_tt: "[target_cas_country.GetName] мо[target_cas_country.Custom('end_gegu')] проводить ответные налёты на принадлежащие нам [target_cas_country.GetAdjectiveWithNoTooltip|l]ие [Concept('locations', 'районы')|e], тем самым уменьшая наше [Concept('prosperity', 'процветание')|e]"
 mor_retaliate_with_raids_tt: "[target_mor_country.GetName] мо[target_mor_country.Custom('end_gegu')] проводить ответные налёты на принадлежащие нам [target_mor_country.GetAdjectiveWithNoTooltip|l]ие [Concept('locations', 'районы')|e], тем самым уменьшая наше [Concept('prosperity', 'процветание')|e]"
