l_russian:
 d009_late_minorities.1.title: "Мессианское движение саббатианцев"
 d009_late_minorities.1.entry: "$d009_late_minorities.1.title$"
 d009_late_minorities.1.desc: "В городе [ShowLocationName('smyrna')] мистик по имени [target_character.GetName] [Select_CString(target_character.IsFemale, 'объявила', 'объявил' )] себя долгожданным мессией, и эта новость разожгла в сердцах наших #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейских#!#! подданных надежду, погасить которую не способны никакие предупреждения раввинов. Целые #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардские#!#! общины бросают свои занятия и готовятся вернуться на Сион, а наши чиновники не знают, как поступить: опровергнуть эти слухи или же не препятствовать им. Пока неясно, будет ли эта вспышка религиозного пыла мимолётной, или она навсегда изменит жизнь общины. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] задаётся вопросом: вправе ли мы вообще вмешиваться в происходящее?"
 d009_late_minorities.1.a: "Не будем ограничивать движение."
 d009_late_minorities.1.b: "Умерим их пыл."
 d009_late_minorities.1.b.tt: "Наши иудейские подданные негодуют из-за начавшихся гонений"
 d009_late_minorities.1.historical_info: "Родившийся в Смирне в 1626 году Шабтай Цви провозгласил себя еврейским Мессией в 1665 году. После этого волна мессианского воодушевления охватила еврейские общины от Амстердама до Йемена, в том числе немалую часть сефардской диаспоры. В 1666 году османские власти арестовали Шабтая и поставили перед выбором: принять ислам или умереть."
 variable_d009_sabbatean_movement_allowed_tt: "Движение саббатианцев не запретили, и Шабтай Цви по-прежнему жив"
 d009_late_minorities.2.title: "Вознесение Шабтая"
 d009_late_minorities.2.entry: "$d009_late_minorities.2.title$"
 d009_late_minorities.2.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] обсуждает свежую весть: [target_character.GetName], которого [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] держит под стражей, [Select_CString(target_character.IsFemale, 'приняла', 'принял' )] #TOOLTIP:RELIGIONGROUP,muslim,X #L ислам#!#!, предпочтя обращение казни. Для самых ревностных [Select_CString(target_character.IsFemale, 'её', 'его' )] последователей такой поступок стал предательством, однако некоторые из них уверяют, что за кажущимся отречением скрывается истина, постичь которую способны только истинно верующие. Теперь остатки движения распадаются: одни впадают в отчаяние, другие втайне отрекаются от прежней веры, а третьи упрямо твердят, что путь мессии оказался куда сложнее, чем можно было предположить."
 d009_late_minorities.2.a: "Призовём верных последовать [Select_CString(target_character.IsFemale, 'её', 'его' )] примеру."
 d009_late_minorities.2.a.entry: "Призовём верных последовать примеру Шабтая Цви."
 d009_late_minorities.2.a.tt: "Наши набожные иудейские подданные обеспокоены принудительными обращениями"
 d009_late_minorities.2.b: "Позволим движению тихо исчезнуть."
 d009_late_minorities.2.historical_info: "Османские власти арестовали Шабтая Цви и предложили ему выбор: казнь или принятие ислама. Так в 1666 году Шабтай Цви стал мусульманином по имени Мехмед Эфенди. Небольшой круг последователей в Салониках и не только для виду последовал его примеру, продолжая при этом тайно соблюдать синкретическую версию еврейских обрядов, известную как дёнме. Большинство же последователей Цви просто вернулись к обычной еврейской жизни. Они разочаровались, но принимать ислам не стали."
 d009_late_minorities.3.title: "#italic Хаскала#! — иудейское Просвещение"
 d009_late_minorities.3.entry: "$d009_late_minorities.3.title$"
 d009_late_minorities.3.desc: "До #TOOLTIP:LOCATION,amsterdam,X #L Амстердама#!#! доходят вести о новом движении, зародившемся среди #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейских#!#! общин германских земель. Его сторонники призывают евреев покидать замкнутые гетто и вливаться в окружающее их общество — перенимать его язык и манеру одеваться, приобщаться к его знаниям и учениям. Среди наших еврейских купцов и учёных уже идут жаркие споры: пойдёт ли такая открытость на пользу общине или же лишь ускорит её растворение в #TOOLTIP:RELIGIONGROUP,christian,X #L христианском#!#! мире."
 d009_late_minorities.3.a: "Внедрим светское образование и городскую интеграцию."
 d009_late_minorities.3.b: "Будем придерживаться традиционных общинных ограничений."
 d009_late_minorities.3.historical_info: "Движение #italic Хаскала#!, оно же еврейское Просвещение, началось с философских трудов Моисея Мендельсона, написанных в Берлине. Начиная с 1770-х годов они подталкивали еврейские общины по всей Европе к изучению религии, а также к занятиям светской философией, литературой и общественной жизнью. Общины сефардов и ашкеназов Амстердама были одними из первых за пределами Германии, кто всерьёз обсуждал идеи Мендельсона. Это объяснялось уже сложившейся в городе необычайно открытой еврейской интеллектуальной культурой."
 d009_late_minorities.4.title: "#italic Синедрион#! Наполеона"
 d009_late_minorities.4.entry: "$d009_late_minorities.4.title$"
 d009_late_minorities.4.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'созвала', 'созвал' )] раввинов и наиболее влиятельных светских лиц с просторов #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! на Великий #italic Синедрион#!, где раз и навсегда предстоит решить, совместим ли #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейский#!#! закон с обязанностями гражданина республики. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] видят в этом возможность наконец приобщить еврейские общины к полноценной гражданской жизни; [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] же, напротив, считают происходящее опасным вмешательством государства в дела, которые его не касаются."
 d009_late_minorities.4.a: "Предоставим полную гражданскую эмансипацию."
 d009_late_minorities.4.b: "Продолжим придерживаться старых ограничений."
 d009_late_minorities.4.historical_info: "Чтобы выяснить, совместимо ли еврейское право с французским гражданством, в 1806 году Наполеон созвал Ассамблею Выдающихся Евреев, а в 1807 году — #italic Великий Синедрион#!. В итоге делегаты сделали вывод о совместимости, но при условии, что еврейские общины признают власть государства в гражданских вопросах, таких как брак и ростовщичество. Это решение стало важным шагом на пути к правовой эмансипации евреев в Европе эпохи Наполеона. Но вопрос о полном равенстве оставался на деле спорным и не разрешённым ещё несколько десятилетий после."
 variable_our_napoleon_tt: "Явился генерал-завоеватель, подобный самому Наполеону"
 variable_d009_jewish_emancipation_tt: "#L [GetCountry('FRA').GetCulture.GetName|U]ие#! евреи эмансипированы по закону"
 d009_late_minorities.5.title: "[GetCountry('MOR').Custom('GetRulerOrRegentTitle')|U] [GetCountry('MOR').GetAdjectiveWithNoTooltip]ой державы и эмансипированные евреи"
 d009_late_minorities.5.entry: "$d009_late_minorities.5.title$"
 d009_late_minorities.5.desc: "Возвращающиеся из #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! #L [ROOT.GetCountry.GetAdjective|l]ие#! купцы рассказывают о постепенно утверждающемся там новом порядке: #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейским#!#! подданным разрешено представать перед законом наравне со всеми прочими гражданами. Весть об этом обсуждает даже [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], и многие чиновники вслух задаются вопросом: сделает ли [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] так, чтобы и меллы [ROOT.GetCountry.Custom('rank_ru_GEN')|l] могли пользоваться подобными привилегиями, или же подобные идеи уместны лишь в Европе и нигде более."
 d009_late_minorities.5.a: "Признаем их равный статус."
 d009_late_minorities.5.b: "Сохраним прежние ограничения зимми."
 d009_late_minorities.5.historical_info: "Вести об эмансипации французских евреев дошли до Марокко по европейским дипломатическим и торговым каналам уже после 1807 года и вызвали при марокканском дворе безрезультатные дискуссии о правовом статусе подданных-евреев. Никаких официальных изменений тогда не последовало, и традиционная система зимми, управлявшая жизнью еврейских общин Марокко, сохранялась в практически неизменном виде вплоть до установления французского протектората в XX веке."
 d009_late_minorities.6.title: "Память Аль-Андалуса"
 d009_late_minorities.6.entry: "$d009_late_minorities.6.title$"
 d009_late_minorities.6.desc: "Среди обосновавшихся в наших землях изгнанников из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! по-прежнему живёт память об Аль-Андалусе — рае, который некогда обрели, а затем потеряли их предки. Стихи и песни об этом месте цитирует [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], их исполняют в компаниях — поэзия сохранила дух Аль-Андалуса лучше, чем память. Некоторые считают, что это наследие следует сохранить в знак гостеприимства нашего края. Другие же предпочтут старым обидам на Иберию кануть в прошлое, прежде чем те обернутся чем-то более опасным."
 d009_late_minorities.6.a: "Поручим создать произведение искусства в память об этом."
 d009_late_minorities.6.b: "Отнесёмся к этому как к безвредному приступу ностальгии."
 d009_late_minorities.6.historical_info: "Представление об Аль-Андалусе как о потерянном рае глубоко укоренилось в памяти сефардских и андалусских мусульман по всему Магрибу. Задолго до того, как исчезла любая реальная надежда на возвращение, этот образ получил весьма романтическое отражение в поэзии, музыке, а позднее и в архитектуре. К XVIII и XIX векам эта ностальгия стала подлинной политической памятью, а также сформировалась как самостоятельная литературная и художественная традиция. Впоследствии к ней в самых разных целях обращались самые разные движения."
