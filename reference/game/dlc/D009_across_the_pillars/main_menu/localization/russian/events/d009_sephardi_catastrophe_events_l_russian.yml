l_russian:
 d009_sephardi_catastrophe.1.title: "Проповедь Фернандо Мартинеса"
 d009_sephardi_catastrophe.1.entry: "$d009_sephardi_catastrophe.1.title$"
 d009_sephardi_catastrophe.1.desc: "Архидьякон [target_character.GetName] уже не первый год объезжает города #TOOLTIP:AREA,andalusia_area,X #L Андалусии#!#! с проповедями, и с каждым разом [Select_CString(target_character.IsFemale, 'её', 'его' )] речи звучат всё более подстрекательски. В этом году собранная [Select_CString(target_character.IsFemale, 'ей', 'им' )] толпа уже не желает просто слушать: у #TOOLTIP:RELIGION,$judaism_tt$,X #L еврейских#!#! кварталов наших городов собираются вооружённые люди, а [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] открыто встают на их сторону. Происходящие на улицах беспорядки вряд ли ограничатся одними только городскими улицами."
 d009_sephardi_catastrophe.1.a: "Отправим стражу подавить волнения."
 d009_sephardi_catastrophe.1.b: "Позволим людям изъявлять свою волю, но только в пределах разумного."
 d009_sephardi_catastrophe.1.c: "Окажем людям поддержку от имени короны."
 d009_sephardi_catastrophe.1.historical_info: "Фернандо Мартинес, архидьякон Эсихи, долгие годы выступал с проповедями против еврейской общины Севильи, несмотря на неоднократные распоряжения властей прекратить их. Когда в июне 1391 года ему наконец удалось спровоцировать толпу на насилие, беспорядки, унёсшие тысячи жизней, в течение нескольких недель распространились на Кордову, Толедо, Валенсию, Барселону и другие города. Это была самая разрушительная волна насилия в отношении евреев в средневековой Иберии: она положила начало массовым обращениям в христианство, в результате которых сформировалась община новых христиан, столетие спустя подвергшаяся преследованию со стороны инквизиции."
 d009_sephardi_catastrophe.2.title: "Распространение беспорядков"
 d009_sephardi_catastrophe.2.entry: "$d009_sephardi_catastrophe.2.title$"
 d009_sephardi_catastrophe.2.desc: "Весть о вспыхнувшем в #TOOLTIP:AREA,andalusia_area,X #L Андалусии#!#! насилии быстро разнеслась по всей державе. От города к городу распространяются одни и те же слухи и призывы, и у #TOOLTIP:RELIGION,$judaism_tt$,X #L еврейских#!#! кварталов собираются толпы людей, которые ещё год назад не могли и помыслить о подобном. Старый порядок рушится на глазах. Наши гонцы просто не успеют разнести приказы двора во все охваченные безумием земли."
 d009_sephardi_catastrophe.2.a: "Нам ничего не остаётся, кроме как наблюдать за происходящим."
 d009_sephardi_catastrophe.2.historical_info: "Начавшиеся летом 1391 года в Севилье погромы с поразительной быстротой перекинулись на Кордову, Толедо, Валенсию, Пальму и Барселону всего за несколько недель. Во многом это произошло потому, что местные проповедники и толпы горожан восприняли беспорядки в Севилье не как предупреждение, а как разрешение действовать. Согласно оценкам современников, только за тот год были убиты или насильственно обращены в христианство десятки тысяч евреев. Это событие навсегда изменило демографическую и религиозную карту Иберии."
 d009_sephardi_catastrophe.3.title: "Религиозный диспут в Тортосе"
 d009_sephardi_catastrophe.3.entry: "$d009_sephardi_catastrophe.3.title$"
 d009_sephardi_catastrophe.3.desc: "Раввины #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! уже несколько месяцев вынуждены, следуя призыву самого папы, участвовать в публичных диспутах в городе [ShowLocationName('tortosa')]. Им приходится по каждому спорному вопросу защищать свою веру перед #TOOLTIP:RELIGIONGROUP,christian,X #L христианскими#!#! богословами и бывшими единоверцами, отринувшими #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейство#!#!. Многие не выдерживают этого испытания, и раввины уже нескольких альхам также отказались от своей веры."
 d009_sephardi_catastrophe.3.a: "Не станем препятствовать диспуту."
 d009_sephardi_catastrophe.3.b: "Защитим наших раввинов от чрезмерного давления."
 d009_sephardi_catastrophe.3.b.tt: "#TOOLTIP:RELIGION,$judaism_tt$,X #L Иудейская#!#! община Тортосы несколько утешена этим жестом"
 d009_sephardi_catastrophe.3.historical_info: "В рамках диспута в Тортосе (1413–1414 годы), созванного антипапой Бенедиктом XIII, было проведено более 60 заседаний. Раввинов со всего Арагона вынуждали участвовать в богословских спорах с Херонимо де Санта Фе — бывшим еврейским врачом, принявшим христианство и утверждавшим, что сам Талмуд доказывает мессианство Иисуса. После диспута последовала волна обращений в христианство и антиеврейских законов на территории Арагонской короны."
 d009_sephardi_catastrophe.4.title: "Новая цель инквизиции"
 d009_sephardi_catastrophe.4.entry: "$d009_sephardi_catastrophe.4.title$"
 d009_sephardi_catastrophe.4.desc: "Созданный для искоренения ереси трибунал до сих пор не вмешивался в дела альхам, но теперь всё изменилось. Каждый день [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] вместе с советом слышат слухи о семьях новых #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#!, которые открыто крестятся, а за закрытыми ставнями зажигают свечи. Инквизиторы трибунала уже ждут разрешения проверить, чем занимаются эти семьи, когда на улицах стихает дневной гомон."
 d009_sephardi_catastrophe.4.a: "Привлечём внимание трибунала к крещёным евреям."
 d009_sephardi_catastrophe.4.b: "Пусть трибунал занимается только борьбой с ересью."
 d009_sephardi_catastrophe.4.historical_info: "Испанская инквизиция была учреждена папской буллой в 1478 году специально для расследования деятельности крещёных евреев, подозреваемых в тайном исповедании иудаизма. В отличие от более ранних средневековых инквизиций её первоначальной задачей был скорее контроль за новообращёнными, нежели борьба с ересью среди христиан по рождению. Томас де Торквемада, самый печально известный из первых великих инквизиторов, значительно расширил масштабы подобных расследований в 1480-х годах."
 variable_iberian_union_active_tt: "Учреждена Иберийская уния"
 d009_sephardi_catastrophe.5.title: "Изгнание из [ROOT.GetCountry.Custom('CL_GEN')]"
 d009_sephardi_catastrophe.5.entry: "Изгнание"
 d009_sephardi_catastrophe.5.desc: "Все соседние державы, ещё недавно терпевшие у себя #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейские#!#! общины, за последние годы решили покончить с этой терпимостью. Теперь на нас давят с требованиями поступить так же, и закрывать глаза на происходящее больше невозможно. Как бы ни был полезен для нас старый порядок, нельзя и впредь оставаться единственной державой Иберии, про которую иудеи с гордостью говорят: «[ROOT.GetCountry.GetName] — наш дом»."
 d009_sephardi_catastrophe.5.a: "Издадим указ об изгнании."
 d009_sephardi_catastrophe.5.historical_info: "Наваррские власти изгнали евреев из страны в 1498 году, последовав примеру Кастилии и Арагона (1492 год) всего год спустя после Португалии (1497 год). Во многом это произошло под давлением Фердинанда и Изабеллы после того, как Наварра попала под их влияние. Это было одно из последних самостоятельных изгнаний в Иберии. Оно практически лишило изгнанные из Испании и Португалии еврейские общины возможности просто переселиться в другие части Пиренейского полуострова вместо того, чтобы покидать его."
 d009_sephardi_catastrophe.6.title: "Лиссабонский погром"
 d009_sephardi_catastrophe.6.entry: "$d009_sephardi_catastrophe.6.title$"
 d009_sephardi_catastrophe.6.desc: "Собравшуюся в столице толпу довели до исступления странствующие монахи — проповедники представления, что обрушившаяся на #TOOLTIP:LOCATION,lisbon,X #L Лиссабон#!#! чума есть Божья кара в отношении новых христиан. Народное бешенство обернулось кровопролитием. Сотни конверсо — мужчин, женщин и детей, перешедших в христианство, — оказались убиты. Городские площади и дворы завалены мёртвыми телами, а [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] спорят, осудить ли эту бойню или же благословить её."
 d009_sephardi_catastrophe.6.a: "Прикажем страже подавить волнения."
 d009_sephardi_catastrophe.6.b: "Не будем мешать народному гневу."
 d009_sephardi_catastrophe.6.historical_info: "В апреле 1506 года, после того, как доминиканские монахи возложили вину за мучившие город засуху и эпидемию на новых христиан, произошёл Лиссабонский погром. Он продлился три дня, пока наконец не вмешались королевские войска. По разным оценкам, погибло от менее чем двух до более чем трёх тысяч человек. Эта резня настолько встревожила короля Мануэла I, что впоследствии он издал указы, формально защищавшие новых христиан от последующих актов насилия со стороны толпы, хотя недоверие к этой группе населения так и не исчезло полностью."
 d009_sephardi_catastrophe.7.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ая инквизиция начинает преследовать конверсо"
 d009_sephardi_catastrophe.7.entry: "Инквизиция начинает преследовать крещёных евреев"
 d009_sephardi_catastrophe.7.desc: "[ShowPolicyName('local_courts')|U] нашей державы и трибунал первые несколько лет своего существования занимались обычными вопросами веры. Но инквизиторы всё больше недовольны тем, что семьи новых #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#! в таких городах, как [ShowLocationName('lisbon')], [ShowLocationName('porto')] и [ShowLocationName('evora')], остаются вне их внимания. От нас в весьма недвусмысленных выражениях требуют предоставить разрешение проверять, какие именно обряды эти семьи справляют у себя дома."
 d009_sephardi_catastrophe.7.a: "Поручим трибуналу контроль за крещёными евреями."
 d009_sephardi_catastrophe.7.b: "Ограничим компетенцию трибунала вопросами явной ереси."
 d009_sephardi_catastrophe.7.historical_info: "Португальская инквизиция была официально учреждена в 1536 году спустя несколько десятилетий после испанской. Поначалу она действовала осторожно в отношении крещёных евреев, опасаясь экономического ущерба, который могли нанести преследования. Однако продлилось это недолго: уже к середине XVI века трибуналы в Лиссабоне, Коимбре и Эворе вели масштабные процессы против новых христиан, подозреваемых в тайном исповедании иудаизма, что повлекло за собой новую волну эмиграции в Амстердам, Италию и Османскую империю."
 d009_sephardi_catastrophe.8.title: "Аутодафе"
 d009_sephardi_catastrophe.8.entry: "$d009_sephardi_catastrophe.8.title$"
 d009_sephardi_catastrophe.8.desc: "На городской площади вновь прошло аутодафе: кающихся грешников в жёлтых санбенито провели перед толпой, которая ждала этого зрелища не меньше любого другого праздника. Действительно ли этот ритуал искореняет ересь или лишь держит в страхе семьи, оставившие прежнюю веру несколько поколений назад, — мало кто из собравшихся задавался таким вопросом."
 d009_sephardi_catastrophe.8.a: "Не будем мешать работе трибунала."
 d009_sephardi_catastrophe.8.historical_info: "Аутодафе (порт. и исп. auto-da-fé — «акт веры») было публичной церемонией вынесения приговоров инквизиции. Осуждённых, часто одетых в специальные жёлтые одежды (санбенито), проводили перед собравшейся толпой, после чего они подвергались наказанию: от покаяния до сожжения на костре. Эти церемонии собирали огромные толпы зрителей и веками оставались неотъемлемой частью общественной жизни Иберии, сочетая религиозный ритуал с публичным зрелищем."
 d009_sephardi_catastrophe.9.title: "Эмиграционные сети марранов"
 d009_sephardi_catastrophe.9.entry: "$d009_sephardi_catastrophe.9.title$"
 d009_sephardi_catastrophe.9.desc: "Трибуналу стало известно о существовании целой сети купцов и моряков из числа новых #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#! — эти люди тайно помогают семьям, уставшим от жизни под постоянным подозрением, бежать за границу. Их корабли выходят из портов под видом обычных торговых судов. Места хватает не всем, однако некоторым всё-таки удаётся бежать. И [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не всегда успевает послать приказ о задержании выходящего из гавани корабля."
 d009_sephardi_catastrophe.9.a: "Невозможно останавливать каждое судно, покидающее гавань."
 d009_sephardi_catastrophe.9.historical_info: "После принудительных обращений в христианство на протяжении нескольких поколений действовали эмиграционные сети. Обычно они переправляли семейства крещёных евреев через Бордо, Антверпен или Феррару в более безопасные места, такие как Османская империя и, позднее, Амстердам. Эти сети в значительной степени строились на семейных и деловых связях ранее эмигрировавших купцов. Португальская корона неоднократно пыталась пресечь их деятельность, но безуспешно, поскольку те же купеческие сети зачастую были необходимы стране для внешней торговли."
