l_russian:
 goods_camels.1.title: "Великий пустынный караван"
 goods_camels.1.desc: "Действующее в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#! купеческое сообщество предложило снарядить большой караван, который соединил бы наши рынки с другими, находящимися по ту сторону засушливых земель.\n\nЭто предприятие сулит немалую прибыль, если удастся наладить торговлю #TOOLTIP:GOODS,camels,X #L верблюдами#!#! и сопутствующими товарами, но для охраны путей и сопровождения понадобится значительная #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ая#! поддержка деньгами. Купцы настроены решительно — они лишь ждут нашего ответа."
 goods_camels.1.a: "Поддержим предприятие."
 goods_camels.1.b: "Пусть снаряжают — но не бесплатно."
 goods_camels.2.title: "Выдающиеся породы"
 goods_camels.2.desc: "Разводчики верблюдов в [target_location.Custom('LR_PREP')|l] [target_location.GetName] сообщают, что спустя несколько лет тщательного отбора сумели вывести породу, отличающуюся силой, выносливостью и способностью нести более тяжёлые грузы, при этом оставаясь неприхотливой в воде.\n\nВ обмен на #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ое#! покровительство они обещают удвоить усилия и создать специальные пастбища. Однако командующие кавалерией предлагают другой подход: передать лучших животных в их распоряжение."
 goods_camels.2.a: "Вложим деньги в разведение верблюдов."
 goods_camels.2.b: "Передадим лучших верблюдов нашим всадникам."
 goods_camels.3.title: "Когда пересыхают колодцы"
 goods_camels.3.desc: "Нашу пустыню охватила сильнейшая засуха. Колодцы пересыхают, посевы гибнут, а народ тяжело страдает.\n\nВ таких суровых условиях верблюды — единственное надёжное средство перевозки через пустоши грузов, воды и людей. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] задаётся вопросом, как лучше поступить: оставить стада себе, чтобы помочь населению, или же воспользоваться удачной возможностью и продать их отчаявшимся иностранным покупателям по завышенным ценам."
 goods_camels.3.a: "Наш народ прежде всего."
 goods_camels.3.b: "Продадим стада по завышенным ценам, пока есть спрос."
 goods_camels.4.title: "Путь паломников"
 goods_camels.4.desc: "Через #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! проходит множество паломников, направляющихся к далёким святыням. В пустыне им остро нужны верблюды, без которых невозможно перевозить припасы.\n\nПаломники говорят, что тем, кто помогает им в пути, будет сопутствовать божественное благословение. Наши купцы же видят в этом возможность хорошо заработать на перевозках."
 goods_camels.4.a: "Будем бесплатно помогать паломникам."
 goods_camels.4.b: "Будем взимать с них плату."
 goods_camels.5.title: "Налётчики на караваны"
 goods_camels.5.desc: "На проходящие через наши земли верблюжьи караваны начали нападать кочевые разбойники. Они убивают купцов, угоняют животных и срывают торговлю.\n\nПогонщики караванов требуют навести порядок — иначе они пустят свои обозы в обход, и их деньги достанутся другим. Нам предстоит решить, что делать: взять на себя серьёзные траты и задействовать войска или же попытаться достичь соглашения с налётчиками."
 goods_camels.5.a: "Выставим вдоль путей вооружённую охрану."
 goods_camels.5.b: "Договоримся с налётчиками, чтобы те пропускали караванщиков."
 goods_camels.6.title: "Предложение полководца"
 goods_camels.6.desc: "Самый опытный полководец из всех, какими только располагает [ROOT.GetCountry.GetGovernment.GetRuler.GetName], предлагает внедрить в ряды наших вооружённых сил верблюжью кавалерию.\n\nОн утверждает, что в пустынях верблюды удобнее лошадей: они лучше приспособлены к песку, могут перевозить больше грузов и с лёгкостью выносят условия, где гибнут боевые кони. В этом предложении есть смысл, но не каждый офицер готов отказаться от кавалерии — она чрезвычайно престижна."
 goods_camels.6.a: "Учредим верблюжью кавалерию."
 goods_camels.6.b: "Лошади нас ещё не подводили. Не станем от них отказываться."
 goods_camels.7.title: "Заграничный спрос"
 goods_camels.7.desc: "На наши рынки прибыли иностранные купцы, привёзшие с собой крупные суммы серебра. Они хотят закупить большую партию верблюдов, чтобы снаряжать военные походы и торговые экспедиции, и готовы хорошо заплатить.\n\nОднако массовый вывоз верблюдов неизбежно скажется на наших собственных заводчиках. Кроме того, некоторые советники опасаются, что когда-нибудь чужеземцы могут бросить верблюжью кавалерию против нас."
 goods_camels.7.a: "Будем торговать с ними — нам нужно серебро."
 goods_camels.7.b: "Ограничим вывоз верблюдов."
 goods_camels.8.title: "Избыток стад"
 goods_camels.8.desc: "Годы наращивания численности верблюдов привели к неожиданным трудностям: животных стало слишком много.\n\nРынок перенасыщен, цены обвалились, а стада съедают подножный корм быстрее, чем пустыня успевает его восполнять. Пора принимать меры. Можно сократить избыточное поголовье и восстановить равновесие либо попытаться найти покупателей за границей и сбыть им излишки. Но второй путь потребует немалых расходов и дипломатических усилий."
 goods_camels.8.a: "Сократим поголовье. Лучше пусть скота будет мало."
 goods_camels.8.b: "Отправим послов на поиски покупателей за границей."
 goods_camels.9.title: "Дипломатический инцидент"
 goods_camels.9.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] находится в крайне неудобном положении: во время торжественного приёма при дворе [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'её', 'его' )] любимый верблюд, выведенный в зал ради того, чтобы впечатлить гостей, оказался крайне разборчив в людях и посчитал, что [target_character.GetTitledName|l] из [offended_country.Custom('longname_ru_GEN')] — его личный враг. Без всякого предупреждения животное извергло содержимое своего желудка прямо на [Select_CString(target_character.IsFemale, 'её', 'его' )] церемониальное облачение.\n\n[Select_CString(target_character.IsFemale, 'Пострадавшая', 'Пострадавший' )] кипит от ярости, а [Select_CString(target_character.IsFemale, 'её', 'его' )] свита уже составляет письмо, в котором намеревается заявить протест."
 goods_camels.9.a: "Мы приносим глубочайшие сожаления и подкрепляем их подарком из казны."
 goods_camels.9.b: "Верблюд и правда хорошо разбирается в людях."
 goods_camels.10.title: "Верблюды состязаются в красоте"
 goods_camels.10.desc: "Знать из #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_GEN')|L]#!#! устроила необычное, но, по её словам, совершенно законное, а главное — подчёркивающее красоту нашей культуры состязание: между собой в красоте соревнуются… верблюды. На победу того или иного животного уже поставлены немалые суммы.\n\nТеперь две влиятельные семьи готовы поссориться всерьёз: одни считают, что для породистого верблюда важнее длинная шея, другие отдают предпочтение красивому правильному горбу. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] рассудить спорящих и вынести окончательное решение. Участники и их верблюды уже собрались и ждут вердикта."
 goods_camels.10.a: "Правитель обязан во всём служить своему народу."
 goods_camels.10.b: "У меня есть более важные дела."
