l_russian:
 proclaim_pase_foral: "Провозглашение pase foral"
 proclaim_pase_foral_desc: "Мы воспользуемся баскским правом #italic pase foral#! — древней привилегией, которая позволяет баскским феодам изучать и приостанавливать действие королевских указов, если они противоречат местным законам (фуэрос). Эта прокламация удовлетворяет ожидания аристократов и укрепляет стабильность, но временно ограничивает возможности правителей."
 summon_santa_hermandad: "Созыв святой эрманды"
 summon_santa_hermandad_desc: "Мы созовём Святую эрмандаду — поддерживаемое властями братство сельских констеблей и ополченцев. При помощи таких братств Кастилия боролась с бандитами и укрепляла королевские порядки в державе. Призвав их на службу, мы увеличим #Y рекрутский резерв#! и повысим #Y боевой дух#! наших бойцов."
 proclaim_pase_foral_action: "$proclaim_pase_foral$"
 proclaim_pase_foral_active: "Провозглашение pase foral"
 proclaim_pase_foral_action_progress: "Действует провозглашение pase foral"
 proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
 proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"
 summon_santa_hermandad_action: "$summon_santa_hermandad$"
 summon_santa_hermandad_active: "Созыв святой эрманды"
 summon_santa_hermandad_action_progress: "Число рекрутов и боевой дух армии"
 summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_long_wordier: "@manpower! $summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_tooltip: "Увеличьте ежемесячное восстановление числа рекрутов и повысьте боевой дух армии."
