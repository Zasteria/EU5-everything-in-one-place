 seven_cities_sierra.1.title: "Гора Белого царя"
 seven_cities_sierra.1.desc: "После восьми месяцев странствия по просторам Чако отряд добрался до предгорий, о которых рассказывали проводники-гуарани, — до земли Серебряной горы. Этот край суров и бесплоден: кругом солончаки и пересохшие русла рек, а сами предгорья — голые красные скалы. Стекающие с них ручьи не несут ни крупицы серебра. Под давлением проводники признались, что совет гуарани послал их увести отряд как можно дальше от своих земель в надежде, что испанцы уже не вернутся. [target_leader.GetName] приказывает повесить двоих, а остальных — отпустить. Путь назад придётся проделывать на голодный желудок."
 seven_cities_sierra.1.a: "Поворачиваем обратно. Серебряная гора — это просто россказни."
 seven_cities_sierra.1.historical_info: "Легенда о Сьерра-де-ла-Плата — Серебряной горе, якобы скрытой где-то в глубине Южной Америки, — большую часть XVI века считалась испанской короной вполне правдоподобной. Именно в надежде добраться до этих богатств основали Асунсьон: город должен был стать опорным пунктом для завоевания Серебряной горы. Настоящие серебряные богатства Южных Анд обнаружились гораздо западнее, в Потоси, и путь к ним был совсем иным. А земли между Асунсьоном и Андами — реки и травянистые равнины — вопреки ожиданиям первопроходцев оказались невероятно бедны."
 seven_cities_sierra.2.title: "Серебро в предгорьях"
 seven_cities_sierra.2.desc: "Эти земли действительно богаты серебром, хотя богатство, конечно, оказалось преувеличенным. В двух обследованных нами долинах у подножия гор работают серебряные рудники. Их разрабатывают местные общины, подвластные вождю, готовому принять испанское посольство. По меркам Анд здешняя добыча невелика. Но серебро здесь есть, рудники существуют, а торговлю можно наладить без полного насильственного подчинения жителей. [target_leader.GetName] заключает с ними торговое соглашение и устанавливает символическую дань."
 seven_cities_sierra.2.a: "Подпишем соглашение. Скромные, но постоянные потоки серебра весьма ценны для нас."
 seven_cities_sierra.2.historical_info: "На восточных склонах Центральных Анд действительно есть пригодные для промышленной добычи серебряные месторождения, хотя до богатств хребта Потоси им далеко. В конце XVI века испанцы построили небольшие рудники на территории нынешней Северной Аргентины и юга Боливии. Обычно это происходило в рамках энкомьенды и при участии местных народов — диагита и чича. Но легендарную Сьерра-де-ла-Плату — серебряную гору — так и не нашли: её просто не существовало. На деле серебро в Андах было рассеяно по множеству отдельных месторождений. Лишь Потоси оказалось настолько богатым, что со временем и само стало легендой."
 seven_cities_sierra.3.title: "Серебряная гора"
 seven_cities_sierra.3.desc: "Описываемая в легендах земля действительно существует: отряд нашёл её. Перед нами возвышается гора, рассечённая тремя рудниками. Серебряная руда выходит почти к самой поверхности, жилы достигают толщины в ладонь, а оценщик утверждает, что содержание серебра здесь — самое большое во всех Индиях. Вожди чича, которым принадлежат здешние предгорья, готовы принять посольство: они заинтересованы в железных инструментах и испанских лошадях, а не в войне. Мы готовы пойти им навстречу. Гора словно сама открылась нам. [target_leader.GetName] отправляет к побережью трёх всадников с образцами руды в свинцовых коробах. Корону вряд ли придётся долго убеждать в их ценности."
 seven_cities_sierra.3.a: "Подпишем договор и построим дорогу. Мы нашли гору."
 seven_cities_sierra.3.historical_info: "Гора Потоси — то самое месторождение, с которым позже стали связывать легенду о Сьерра-де-ла-Плата, — была открыта вовсе не отправленной на её поиски испанской экспедиций. В 1545 году властям в Куско о ней сообщил местный рудокоп, чьё имя в разных источниках передаётся по-разному. Почти два столетия Потоси давала больше серебра, чем любое другое месторождение в мире, и стала одним из главных источников драгоценного металла для мировой экономики раннего Нового времени. В каком-то смысле легенда оказалась правдивой. Рассказчики ошибались только в одном: в том, где именно искать эту гору."
 seven_cities_sierra.10.title: "Серебро с запада"
 seven_cities_sierra.10.desc: "Много лет его считали погибшим. Он исчез вместе с экспедицией, разбившейся о южные скалы, а ныне утром вдруг явился к воротам и потребовал отвести его к нашему командиру, назвав этого человека по имени. В руке у него — завязанный узелком платок. Внутри — серебряная застёжка и две расплющенные бусины искусной работы, также из серебра. [target_character.GetName] утверждает, что всё это попало к нему из далёкой страны в глубине материка, где на горе серебра сидит Белый царь. Он не может даже написать собственного имени, но берега описывает с невероятной точностью. Оценщик пробует бусины на зуб, взвешивает их и молча возвращает владельцу."
 seven_cities_sierra.10.a: "Последуем за ним — пусть будет нашим проводником."
 seven_cities_sierra.10.b: "Купим у него все его ценности — вместе с его молчанием."
 plata_castaway_road_tt: "[target_character.GetName] присоединяется к путешествию и отмечает на наших картах пройденную им дорогу в глубь материка"
 plata_silver_in_hand_tt: "Добытые экспедицией ценности пополняются серебром спасшегося"
 seven_cities_sierra.10.historical_info: "В 1516 году португальский моряк Алейшу Гарсия, участник экспедиции Солиса, потерпел кораблекрушение у острова Санта-Катарина. Его подобрали индейцы гуарани, которые и рассказали Гарсии легенду о Белом царе, который правит западными горами, невероятно богатыми серебром. Около 1524 года Гарсия, желая проверить достоверность этой легенды, отправился в глубь материка. Он стал первым европейцем, добравшимся до богатств Анд, и вернулся с украденным у инков серебром за несколько лет до того, как Писарро посетил Перу. По дороге обратно Гарсия погиб, но часть его добычи достигла побережья, где попала в руки к команде Себастьяна Кабота. Эта находка убедила Кабота отказаться от плавания к Молуккским островам и повернуть вверх по реке, которую позже назовут Рио-де-ла-Плата — «Серебряная», хотя в самой реке никогда не было серебра."
 seven_cities_sierra.11.title: "Воинство без знамён"
 seven_cities_sierra.11.desc: "Совет у костров затягивается далеко за полночь, а утром через переводчиков нам передают предложение: речные народы готовы выступить вместе с нами против Белого царя. Не как проводники или носильщики — нет, они готовы собрать многотысячное войско, и у них есть на это достойные причины. Их деды совершали набеги на местные взгорья ещё до того, как сюда ступили мы, и поэтому они превосходно знают дороги и переправы в этих безводных краях. Мнения наших офицеров разделились: один утверждает, что такому крупному войску в походе не грозит голодная смерть. Второй отвечает, что такое крупное войско не станет договариваться — оно идёт убивать."
 seven_cities_sierra.11.a: "Согласимся на предложение. Наш отряд не станет идти в одиночку."
 seven_cities_sierra.11.b: "Откажем, но сгладим отказ подарками. Там, где завязнет армия, пройдёт небольшой отряд."
 seven_cities_sierra.11.historical_info: "Путешествие Алейшу Гарсии на запад в 1524 году было кровопролитным: он шёл туда не как исследователь, а как участник большого похода гуарани против пограничных владений инков, в котором участвовали тысячи воинов. Объединённое войско пересекло Чако — засушливый край, который впоследствии будет вселять в испанцев истинный ужас — и нанесло удары по окраинным владениям империи инков. Гуарани продвинулись достаточно далеко в глубь их империи, чтобы инки после этой войны всерьёз озаботились укреплением обороны на приграничье. В европейских хрониках этот поход описывается как экспедиция, но сами гуарани считали иначе: они просто взяли с собой на войну бородатого иностранного матроса."
 seven_cities_sierra.12.title: "Граница Белого царя"
 seven_cities_sierra.12.desc: "Впереди наконец вырастают предгорья, синие и необъятные. В деревнях у их подножия — первые признаки богатства этих краёв: местные жители носят на шее и запястьях серебряные украшения столь искусной работы, каковой нам ещё не приходилось здесь видеть. Выше начинаются перевалы, ведущие в те края, откуда и происходит это серебро. Но стоит нам заговорить о них, как сразу же повисает молчание. Наконец кто-то осмеливается подать голос: горные владыки, говорят нам, зорко следят за перевалами и считают каждого, кто поднимается в горы. А тех, кто спускается обратно, они почему-то не считают."
 seven_cities_sierra.12.desc_castaway: "Знаки, которыми спасшийся отмечал свой путь, закончились. Он признаётся: дальше этой долины он никогда не заходил, а остановился там, где тропа заворачивает вверх, к горным перевалам. Серебро, которое он принёс с собой, досталось ему именно здесь: его выменяли у людей, спустившихся с гор. Что находится дальше, наверняка сказать невозможно и остаётся только полагаться на чужие пересказы. Но отряду почему-то проще простить ложь, чем чистосердечное признание. Значит, путь только один: наверх."
 seven_cities_sierra.12.a: "Идём через перевалы. Гора совсем близко — до неё рукой подать."
 seven_cities_sierra.12.b: "Поторгуем с местными у подножья горы. Терпение вознаграждается серебром."
 plata_silver_seized: "#Y Налётчики на долину приносят добычу — серебряные изделия#!"
 plata_host_shields_the_raid: "#Y Войско наших союзников прикрывает налёт и возвращается с добычей — серебряными изделиями#!"
 plata_frontier_rises: "#Y Перевалы пустеют перед нами, а затем горы наносят ответный удар#!"
 seven_cities_sierra.12.historical_info: "В отличие от границ многих других государств, граница империи инков представляла собой цепочку укреплённых гарнизонов, и каждый новый набег встречал здесь отпор. В 1525 году войско Алейшу Гарсии было разгромлено на обратном пути; сам Гарсия и почти все его соратники погибли. В 1537 году такая же участь постигла Хуана де Айоласа: он пересёк Чако и достиг богатых серебром земель, но вывезти добычу уже не успел. На обратном пути его отряд попал в засаду у Канделарии и погиб в полном составе. Серебро было настоящим; существовала и серебряная гора, но целых тридцать лет путь к ней находился под защитой укреплений хозяев этих краёв. Чтобы в 1545 году овладеть Потоси, испанские войска были вынуждены зайти с другой стороны."
 seven_cities_sierra.13.title: "Сладкое море"
 seven_cities_sierra.13.desc: "За день до высадки вода неожиданно меняется. Лотовой пробует её на вкус, сплёвывает и пробует снова. Его примеру по очереди следуют главный над водными запасами, штурман и лоцманы. Не проходит и часа, как по кораблю разносится весть: море стало пресным. Ни одна из известных нам рек не протекает так далеко от берега. Лоцманы спорят, откуда берёт начало такая диковинка. Столпившиеся у борта матросы сначала вглядываются вдаль, надеясь увидеть там хоть что-нибудь, а затем начинают черпать удивительную морскую воду пригоршнями."
 seven_cities_sierra.13.desc_castaway: "Сегодня утром вода под килем стала пресной. Спор лоцманов о том, что послужило тому причиной, прервало появление на палубе выжившего в кораблекрушении. Он зачерпнул воду ладонью, попробовал на вкус и кивнул так, словно отведал доброго вина. «Это — вода из той самой реки, по которой я когда-то вёз серебро». Где-то на западе подёрнутая дымкой река сужается. Там начинается дорога, ведущая к владениям Белого царя."
 seven_cities_sierra.13.a: "Назовём её в донесении Серебряной рекой."
 seven_cities_sierra.13.b: "Промерим устье и нанесём его на карту, а потом уже дадим реке название."
 seven_cities_sierra.13.historical_info: "В 1516 году Хуан Диас де Солис обнаружил огромный эстуарий, который назвал Mar Dulce — «сладкое», то есть пресное, море: даже далеко от берега вода ещё не становилась солёной. При первой же попытке высадиться на северном берегу Солис погиб от рук местных жителей. Уцелевшие участники экспедиции на обратном пути потерпели кораблекрушение у Санта-Катарины. Среди выброшенных на берег оказался Алейшу Гарсия; добытое им серебро впоследствии ещё неоднократно заставляло европейские державы снаряжать одну экспедицию за другой. В конце 20-х годов XVI века Себастьян Кабот, поверив рассказам о существовании на западе богатых серебром краёв, назвал этот водоём Рио-де-ла-Плата — Серебряной рекой. При жизни Кабота она так и не стала серебряной, но название сохранилось и со временем перешло на страну у её устья — Аргентину, Землю серебра."
