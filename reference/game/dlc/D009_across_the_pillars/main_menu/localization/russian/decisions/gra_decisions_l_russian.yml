l_russian:
 expand_the_alhambra.title: "Расширить Альгамбру"
 expand_the_alhambra.desc: "Над холмом Сабика возвышается очередное крыло дворца. Там, где прежние правители возводили первые дворы и башни, мы достраиваем собственные залы, украшаем их своды #italic мукарнасами#! и покрываем стены стихами. Каждый прибывающий ко дворцу посол должен видеть в этом камне свидетельство вечности и нерушимости нашего дома.\n\nЛюбые затраты мрамора — ничто по сравнению с посланием, которое мы шлём миру: держава, возводящая постройки на века, намерена и существовать веками. Каждый завершённый ярус — это новые сады, это расширение гарнизона крепости, это демонстрация #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_DAT')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_DAT')|L]#!#! нашей решительности самостоятельно распоряжаться своей землёй."
 expand_the_alhambra.a: "Заложить фундамент."
 expand_the_alhambra_construct_tt: "[ShowBuildingTypeName('alhambra')] будет расширена"
