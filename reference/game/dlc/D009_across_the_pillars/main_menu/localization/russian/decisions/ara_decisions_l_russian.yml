l_russian:
 ara_unite_barcelona_dynasty.title: "Объединение династии"
 ara_unite_barcelona_dynasty.desc: "После того как [ShowCultureName('sicilian')] Вечерня закрепила трон за нашей династией, наше влияние в [ShowRegionName('italy_region')] возросло. Несмотря на это, [ShowAreaName('sicily_area')] по-прежнему сохраняет независимость, держась в стороне от нашей династической политики. Вместо того чтобы упускать эту возможность, нам, пожалуй, стоит обратиться к нашим родственникам там, укрепив династический союз и, возможно, положив начало нашим притязаниям в [ShowRegionNameWithNoTooltip('italy_region')]."
 ara_unite_barcelona_dynasty.a: "Попробуем объединить обе короны."
 ara_unite_barcelona_dynasty.b: "Они станут нашими подданными."
 ara_effects_only_take_place_if_sic_accepts_tt: "Эффекты вступят в силу, только если [GetCountry('SIC').GetName] согласится"
 ara_vassalize_bosnia.title: "Потребовать вассалитета от [GetCountry('BOS').GetNameWithNoTooltip]"
 ara_vassalize_bosnia.desc: "Великий правитель [GetCountry('BOS').GetName] долгое время боролся за сохранение суверенитета страны перед лицом алчных соседей. Не имея возможности защититься в одиночку, многие из [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] обратились к нашему правителю и двору с просьбой о защите от любого вторжения. Они предпочли бы стать нашими подданными, нежели попасть в руки иноверцев, и этим мы можем воспользоваться в своих интересах."
 ara_vassalize_bosnia.a: "Настало время потребовать их подчинения."
 ara_ask_bosnia_for_vassalization: "Мы потребуем подчинения от [GetCountry('BOS').GetName]"
