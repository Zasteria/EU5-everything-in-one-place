l_russian:
 gold_fleet_nueva_espana_events.1.title: "Курс на Новую Испанию"
 gold_fleet_nueva_espana_events.1.desc_prefix: "Флот снаряжён и готов к отплытию. Отправной точкой станет [departure_port.GetName]. Суда снабжены запасами воды и провизии, а также металлическими инструментами и ртутью, которыми колонии не могут обеспечить себя собственными силами. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] дают наставления. Следить за выполнением приказов будет [target_leader.GetName].\n\nПуть предстоит долгий: мы проплывём мимо Канарских островов через Карибское море к берегам Новой Испании"
 gold_fleet_nueva_espana_events.1.desc_suffix: "уже ждут погрузки в наши трюмы. Если мы хотим благополучно доставить богатства домой, флот должен выйти в море немедленно."
 gold_fleet_nueva_espana_events.1.desc: "$gold_fleet_nueva_espana_events.1.desc_prefix$, где #TOOLTIP:GOODS,silver,X #L серебро#!#! и #TOOLTIP:GOODS,dyes,X #L красители#!#! $gold_fleet_nueva_espana_events.1.desc_suffix$"
 gold_fleet_nueva_espana_events.1.desc.rich: "$gold_fleet_nueva_espana_events.1.desc_prefix$. #TOOLTIP:GOODS,silver,X #L Серебро#!#! из шахт в местности [silver_source.GetName] и #TOOLTIP:GOODS,dyes,X #L красители#!#! из местности [dye_source.GetName] $gold_fleet_nueva_espana_events.1.desc_suffix$"
 gold_fleet_nueva_espana_events.1.a: "Отчаливаем. Флот должен отплыть с утренним отливом."
 gold_fleet_nueva_espana_events.1.historical_info: "#italic Флот Новой Испании#! был одним из двух конвоев испанского #italic Серебряного флота#!. Его корабли обеспечивали торговлю с вице-королевством Новой Испании, перевозя серебро из рудников Сакатекаса, Гуанахуато и других мексиканских месторождений, а также кошенильный краситель из Оахаки, индиго, ваниль и какао. Погрузка проводилась в порту Сан-Хуан-де-Улуа близ Веракруса. Как правило, конвой покидал Испанию весной и возвращался осенью, соединяясь в Гаване с галеонами Тьерра-Фирме для совместного перехода через Атлантику. Его путь пролегал через пролив Мона между Эспаньолой и Пуэрто-Рико —по стандартному маршруту в восточную часть Карибского моря."
 gold_fleet_nueva_espana_events.2.title: "Богатство Новой Испании"
 gold_fleet_nueva_espana_events.2.desc_prefix: "Нас встречает [loot_port.GetName]. Работники местных счётных домов уже несколько недель работают не покладая рук. Караван мулов везёт #TOOLTIP:GOODS,silver,X #L серебро#!#! из"
 gold_fleet_nueva_espana_events.2.desc_middle: ", а также тюки с #TOOLTIP:GOODS,dyes,X #L красителями#!#!"
 gold_fleet_nueva_espana_events.2.desc_suffix: ", за которые [departure_port.GetName] платит как за серебро.\n\nПоследние партии драгоценного металла всё ещё находятся в пути. Мы можем дождаться всего каравана и заполнить каждый трюм до отказа либо забрать уже имеющееся и отплыть, пока сезон штормов не отрезал побережье от моря."
 gold_fleet_nueva_espana_events.2.desc: "$gold_fleet_nueva_espana_events.2.desc_prefix$ шахт, расположенных в глубинах материка$gold_fleet_nueva_espana_events.2.desc_middle$ $gold_fleet_nueva_espana_events.2.desc_suffix$"
 gold_fleet_nueva_espana_events.2.desc.rich: "$gold_fleet_nueva_espana_events.2.desc_prefix$ местности под названием [silver_source.GetName]$gold_fleet_nueva_espana_events.2.desc_middle$ из региона [dye_source.GetName]$gold_fleet_nueva_espana_events.2.desc_suffix$"
 gold_fleet_nueva_espana_events.2.a: "Дождёмся всего каравана и заполним трюмы серебром и красителями."
 gold_fleet_nueva_espana_events.2.b: "Ограничимся тем, что успели доставить."
 gold_fleet_nueva_espana_events.2.c: "Промедление может нам дорого обойтись. Отплываем с тем, что уже успели получить."
 gold_fleet_nueva_espana_events.2.historical_info: "Веракрус, чью гавань защищала островная крепость Сан-Хуан-де-Улуа, был единственным законным портом прибытия и отправления судов, позволявших Новой Испании участвовать в атлантической торговле. Город располагался на малярийной песчаной косе и был уязвим перед #italic нортес#! — свирепыми северными штормами, из-за чего сезон погрузки представлял особую опасность. Мексиканское серебро добывалось главным образом в крупных горнодобывающих комплексах Сакатекаса (здесь месторождения были открыты в 1546 году) и Гуанахуато. Затем его доставляли к побережью караванами мулов и грузили на корабли под вооружённой охраной. Кошениль — ярко-алый краситель, который получали из насекомых, разводимых на кактусах в Оахаке, — была одним из самых ценных товаров Нового Света после серебра. Испания ревностно охраняла монополию на её производство, а сам краситель произвёл настоящую революцию в текстильной промышленности Европы."
 gold_fleet_nueva_espana_events.3.title: "Встреча в порту [rendezvous_port.GetNameWithNoTooltip]"
 gold_fleet_nueva_espana_events.3.desc.together: "Флот прибыл в порт [rendezvous_port.GetName], где под защитой крепостных орудий стоят на якоре галеоны Тьерра-Фирме. Их трюмы столь же полны #TOOLTIP:GOODS,silver,X #L серебра#!#!, как и наши. Отсюда оба флота вместе пойдут через Атлантику: сначала двинутся на север по Гольфстриму, затем повернут на восток и минуют берега Флориды.\n\nНам сообщили, что на пути в Испанию уже поджидают вражеские корабли. Впрочем, конвой таких размеров — нелёгкая добыча даже для самого дерзкого противника. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как объединённый флот ответит на угрозу."
 gold_fleet_nueva_espana_events.3.desc.alone: "Флот прибыл в порт [rendezvous_port.GetName] и встал на стоянку под защитой крепостных орудий. Галеонов Тьерра-Фирме, которые могли бы к нам присоединиться, здесь нет, поэтому Атлантику придётся пересекать в одиночку: сначала пойдём на север по Гольфстриму, а затем на восток, вдоль берегов Флориды.\n\nНам сообщили, что на пути в Испанию уже поджидают вражеские корабли, а одинокий караван — лакомая добыча. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как ответить на угрозу."
 gold_fleet_nueva_espana_events.3.a: "Наймём дополнительные военные корабли из гарнизона порта [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_nueva_espana_events.3.b: "Сделаем ставку не на пушки, а на скорость. Отплываем на рассвете."
 gold_fleet_nueva_espana_events.3.c: "Не будем рисковать. Перезимуем здесь, а в путь отправимся в следующем сезоне."
 gold_fleet_nueva_espana_events.3.historical_info: "После того как Филипп II в 1566 году официально закрепил систему конвоев, Гавана стала обязательным пунктом сбора флотов, возвращавшихся с сокровищами. Глубокая естественная гавань и выгодное положение у Флоридского пролива сделали город удобным местом встречи для галеонов Тьерра-Фирме и флота Новой Испании. В 1589 году в Гаване началось строительство крепости Эль-Морро — бастиона для защиты от каперов. Несмотря на это, в 1628 году голландскому адмиралу Питу Хейну удалось захватить весь возвращавшийся флот у бухты Матансас — это событие считается самым большим успехом противников испанской системы конвоев."
 gold_fleet_nueva_espana_events.8.title: "Ожидание флота Тьерра-Фирме"
 gold_fleet_nueva_espana_events.8.desc: "Корабли прибыли в порт [rendezvous_port.GetName], однако галеоны Тьерра-Фирме ещё не пришли с юга. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] отдали предельно ясный приказ: флоты с сокровищами должны пересечь Атлантику единым строем, чтобы бортовым залпом охладить пыл любого капера, ищущего лёгкой добычи во Флоридском проливе.\n\nПоэтому мы останемся на якоре под защитой крепости и будем ждать товарищей, надеясь, что они не сильно задержатся."
 gold_fleet_nueva_espana_events.8.a: "Дождёмся прибытия другого флота."
 gold_fleet_nueva_espana_events.8.historical_info: "Два конвоя #italic Серебряного флота#! — #italic флот Новой Испании#! и #italic галеоны Тьерра-Фирме#! — должны были объединяться в Гаване и вместе пересекать Атлантику, поскольку так они могли защититься от каперов и случайно встреченных вражеских флотилий. На деле флоты нередко задерживались, поэтому конвой, не дождавшийся своего спутника, оказывался перед выбором: остаться на зимовку в Гаване или рискнуть и отправиться через Атлантику в одиночку."
 gold_fleet_nueva_espana_events.9.title: "Затянувшееся ожидание другого флота"
 gold_fleet_nueva_espana_events.9.desc: "С тех пор, как мы бросили якорь в порту [rendezvous_port.GetName], прошло несколько недель, а галеонов Тьерра-Фирме всё нет. Провизия подходит к концу, экипажи начинают роптать, а каждый день, проведённый на якоре, — это день, приближающий сезон капризной погоды.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить: продолжать ли ждать спутников или же рискнуть выйти в Атлантику без них."
 gold_fleet_nueva_espana_events.9.a: "Подождём ещё. Идти в одиночку слишком опасно."
 gold_fleet_nueva_espana_events.9.b: "Мы и так слишком долго ждали. Отправимся в Испанию одни."
 gold_fleet_nueva_espana_events.9.historical_info: "Судьбу флотов с сокровищами во многом определяло время выхода в море. Задержавшийся в Гаване конвой рисковал столкнуться с сезоном ураганов в Карибском регионе или зимними атлантическими штормами, в то время как флот, отправившийся раньше времени, лишался дополнительной защиты. Командирам приходилось взвешивать риски, и далеко не каждый флот дожидался своего спутника."
 gold_fleet_nueva_espana_events.10.title: "Разделение флота"
 gold_fleet_nueva_espana_events.10.desc: "[Select_CString(target_leader.IsFemale, 'узнала', 'узнал' )], что нас может принять [secondary_port.GetName], чьи склады ломятся от #TOOLTIP:GOODS,goods_gold,X #L золота#!#! и шкур. Можно выделить эскадру, чтобы забрать и эти богатства, хотя разделяться в этих водах рискованно.\n\nМы можем задержаться в порту [loot_port.GetNameWithNoTooltip], пока эскадра не вернётся, или же продолжить путь — тогда местом нашей встречи станет [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_nueva_espana_events.10.a: "Не будем разделять флот. Продолжим путь с имеющимся грузом."
 gold_fleet_nueva_espana_events.10.b: "Отправим эскадру в порт [secondary_port.GetNameWithNoTooltip] и дождёмся её возвращения."
 gold_fleet_nueva_espana_events.10.c: "Отправим эскадру в порт [secondary_port.GetNameWithNoTooltip] и воссоединимся в порту [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_nueva_espana_events.10.historical_info: "Флоты с сокровищами редко забирали груз только из одного порта. От конвоев регулярно отделялись эскадры, чтобы забрать серебро, шкуры и красители из второстепенных гаваней, после чего флот воссоединялся перед переходом через Атлантику. Разделение флота позволяло увеличить объём добычи, но подвергало небольшие эскадры опасности нападения со стороны каперов, промышлявших на маршрутах между островами."
 gold_fleet_nueva_espana_events.10.danger_tt: "Разделение флота ослабляет обе эскадры, делая путешествие более рискованным (#G +1#! к уровню опасности)"
 gold_fleet_nueva_espana_events.10.a.tt: "Флот остаётся целым, однако от груза из порта [secondary_port.GetName] приходится отказаться."
 gold_fleet_nueva_espana_events.together_danger_suffix: "делает путешествие менее рискованным."
 gold_fleet_nueva_espana_events.havana_together_danger_tt: "Объединение с флотом Тьерра-Фирме $gold_fleet_nueva_espana_events.together_danger_suffix$"
 gold_fleet_nueva_espana_events.awaiting_fleet_tt: "Флот будет оставаться на якоре до прибытия кораблей Тьерра-Фирме, сколько бы времени это ни заняло"
 gold_fleet_nueva_espana_events.hold_longer_tt: "Конвой продолжает ждать другой флот с сокровищами"
 gold_fleet_nueva_espana_events.11.title: "Возвращение эскадры"
 gold_fleet_nueva_espana_events.11.desc: "[loot_port.GetName] встречает эскадру, отправленную в порт [secondary_port.GetName]. Трюмы кораблей забиты сокровищами: #TOOLTIP:GOODS,goods_gold,X #L золотом#!#! и шкурами. Разрозненные корабли воссоединились, и теперь плавание будет менее опасным."
 gold_fleet_nueva_espana_events.11.a: "Забираем груз и продолжаем путь в полном составе."
 gold_fleet_nueva_espana_events.11.historical_info: "Флоты с сокровищами редко забирали груз только из одного порта. Отделившиеся эскадры отправлялись за серебром, шкурами и красителями во второстепенные гавани, после чего их ждало воссоединение с основной частью конвоя. Восстановление численности флота повышало шансы на безопасный переход через Атлантику."
 gold_fleet_nueva_espana_events.12.title: "Воссоединение около Кубы"
 gold_fleet_nueva_espana_events.12.desc: "[rendezvous_port.GetNameWithNoTooltip] готовится встречать объединённый флот: эскадра, вышедшая из порта [secondary_port.GetName], нагнала остальные корабли. В её трюмах — добыча этого сезона: #TOOLTIP:GOODS,goods_gold,X #L золото#!#! и шкуры."
 gold_fleet_nueva_espana_events.12.a: "Забираем груз и продолжаем путь в полном составе."
 gold_fleet_nueva_espana_events.12.historical_info: "Основной части флота не всегда приходилось ждать возвращения отделившейся эскадры. При благоприятной погоде и попутном ветре эскадра могла нагнать конвой до его прибытия в Гавану."
 gold_fleet_nueva_espana_events.15.title: "Эль норте"
 gold_fleet_nueva_espana_events.15.desc: "Небо на севере становится свинцово-серым, а показания давления в барометре стремительно падают. На нас надвигается #italic норте#! — яростный северный шторм, который приходит практически без предупреждения и гонит перед собой короткую, но крайне опасную волну. Здесь, на мелководье, недалеко от побережий, он способен погубить целый флот.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как флот будет встречать надвигающуюся бурю."
 gold_fleet_nueva_espana_events.15.a: "Отойдём от берегов и переждём шторм на глубине в открытом море."
 gold_fleet_nueva_espana_events.15.b: "Укроемся от шторма у побережья."
 gold_fleet_nueva_espana_events.15.deep_safe_tt: "Флот не без труда, но всё же выходит в открытое море и благополучно пережидает там шторм"
 gold_fleet_nueva_espana_events.15.deep_loss_tt: "Сильный ветер рассеивает флот и бросает несколько кораблей на отмель, из-за чего мы теряем часть груза"
 gold_fleet_nueva_espana_events.15.historical_info: "#italic Норте#! — холодные северные штормы, проносившиеся по Мексиканскому заливу с осени до весны. Они отличались от летних ураганов, однако внушали не меньший страх морякам и купцам Веракруса. Якорная стоянка в порту Сан-Хуан-де-Улуа не укрывала от таких штормов, поэтому ветра могли прижать флот к берегу или выбросить его на берега залива Кампече. Сроки погрузки в Веракрусе зависели не только от прибытия серебра, но и от сезона норте, ведь флот, застигнутый сильным штормом вблизи подветренного берега, мог быть в одночасье уничтожен."
 gold_fleet_nueva_espana_events.16.title: "Задержка каравана с серебром"
 gold_fleet_nueva_espana_events.16.desc: "До нас дошли известия, что один из крупнейших караванов этого сезона покинул местность под названием [silver_source.GetName], но к нам так и не прибыл. Где-то по дороге из глубин материка на него напали: вдоль горной тропы разбросаны слитки #TOOLTIP:GOODS,silver,X #L серебра#!#!, погонщики мулов разбежались, и богатства короны застряли в сотне лиг от берега.\n\nНаши трюмы заполнены лишь наполовину, и [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, может ли флот позволить себе отправиться за остальным грузом."
 gold_fleet_nueva_espana_events.16.a: "Отправим морских пехотинцев вглубь страны, чтобы они помогли доставить серебро к берегу."
 gold_fleet_nueva_espana_events.16.b: "У нас нет времени. Отправимся в путь с тем, что есть."
 gold_fleet_nueva_espana_events.16.historical_info: "Серебро из мексиканских рудников — Сакатекаса, Гуанахуато и менее значимых месторождений на севере — доставлялось по дороге #italic Камино-Реаль-де-Тьерра-Адентро#!, которая на протяжении нескольких сотен миль пролегала через засушливые, малозаселённые земли до Мехико, а оттуда драгоценный металл везли на восток до Веракруса. Многие поколения этот путь оставался опасным из-за нападений чичимеков с северной границы, а позднее — разбойников, поэтому серебро перевозили охраняемыми караванами, сроки прибытия которых непосредственно влияли на сезон погрузки на побережье. Если караван задерживался или подвергался нападению по пути, флоту приходилось его ждать или отправляться в плавание с полупустыми трюмами."
 gold_fleet_nueva_espana_events.17.title: "Черви в корпусе"
 gold_fleet_nueva_espana_events.17.desc: "[target_leader.GetName] получает от плотников дурные вести: тёплые воды Индий медленно, но верно делают своё дело, и корабельные черви прогрызли обшивку ниже ватерлинии. Если ничего не предпринять, корпуса начнут разрушаться, корабли — терять ход, и флот, неспособный уйти от противника, рано или поздно станет его жертвой.\n\nНеподалёку есть укромная бухта, где мы могли бы провести килевание, то есть очистить, обжечь и просмолить днища, однако в таком случае кораблям придётся несколько недель беззащитными пролежать на песке."
 gold_fleet_nueva_espana_events.17.a: "Зайдём в бухту и вытащим корабли на берег. "
 gold_fleet_nueva_espana_events.17.b: "У нас нет на это времени. Продолжим путь с повреждёнными днищами, надеясь на попутный ветер."
 gold_fleet_nueva_espana_events.17.historical_info: "Обитающий в тропических водах корабельный червь #italic Teredo navalis#!, который на самом деле моллюск, а не червь, за считанные месяцы разъедал незащищённые корпуса кораблей. С этой проблемой сталкивался практически каждый флот, оказавшийся в Карибском море. Боролись с вредителями при помощи килевания: корабль сажали на мель или подтягивали к берегу в защищённой бухте, чтобы обнажить его корпус, после чего соскребали наросты, обугливали древесину и покрывали её жиром и смолой. Работы проводились долго и оставляли эскадры без защиты, поэтому командиры часто шли на риск и откладывали обработку: в итоге корабли слушались не лучше барж и протекали по всем швам."
 gold_fleet_nueva_espana_events.18.title: "Контрабандисты на побережье"
 gold_fleet_nueva_espana_events.18.desc: "Разведчики докладывают, что [logwood_source.GetName] переживает вторжение чужеземных лесорубов: они валят деревья, заготавливают древесину и вывозят наш лес под непризнанным нами флагом. Они разбили примитивные лагеря на берегу и осмелели настолько, что сбывают контрабандный товар проходящим судам, обосновавшись на территории, которую [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] считают своей.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, что делать с непрошенными гостями, например отправить к ним отряд."
 gold_fleet_nueva_espana_events.18.a: "Высадимся на берег, сожжём лагеря и заберём древесину."
 gold_fleet_nueva_espana_events.18.b: "Оставим чужаков в покое, но будем покупать у них карты и сведения о вражеских судах."
 gold_fleet_nueva_espana_events.18.historical_info: "Слабо защищённые побережья Мексиканского залива и залива Кампече привлекали иностранных контрабандистов на протяжении всего колониального периода. Особенно много здесь было лесорубов — англичан, голландцев и французов, — они заготавливали красильную древесину, в которой нуждалась текстильная промышленность Европы. Действуя вдали от испанских гарнизонов, #italic лесозаготовители#! часто пренебрегали правилами законной вырубки леса и занимались контрабандой и откровенным пиратством, а попытки испанцев прогнать их были нерегулярными и чаще всего помогали ненадолго. Проходивший мимо флот мог разогнать лагерь, но стоило кораблям скрыться за горизонтом, как лесорубы тут же возвращались."
