l_russian:
 petition_for_the_bula_de_cruzada: "Просьба издать буллу о крестовом походе"
 petition_for_the_bula_de_cruzada_desc: "В качестве светского лидера [Concept('crusade', 'крестового похода')|e] попросить папу издать [Concept('crusade', 'крестоносную')] б уллу. На протяжении трёх лет [Concept('catholic', 'католическая')|e] [Concept('tithe', 'десятина')|e], выплачиваемая нашими сословиями, будет поступать короне, а не папе или в казну [Concept('crusade', 'крестового похода')]."
 petition_for_the_bula_de_cruzada_tt: "На протяжении #G 3#! лет [Concept('catholic', 'католическая')|e] [Concept('tithe', 'десятина')|e], выплачиваемая нашими сословиями, будет поступать короне, а не папе или [Concept('crusade', 'крестоносцам')|e]"
 summon_iberian_military_orders_crusade: "Созвать иберийские военные ордена"
 summon_iberian_military_orders_crusade_desc: "Призвать военный орден на [Concept('crusade', 'крестовый поход')|e] и нанять крупное войско (зависит от силы ордена). Расходуется меньше верности ордена и увеличивается религиозное рвение [Concept('crusade', 'крестового похода')]."
 summon_iberian_military_orders_effect_tt: "Нанимается крупное войско крестоносцев, зависящее от силы ордена. #Y Религиозное рвение#! [Concept('crusade', 'крестового похода')|e] увеличивается на #G 5#!"
 summon_iberian_military_orders_no_target_tt: "Нанимается крупное войско крестоносцев, состоящее из участников выбранного ордена (зависит от его силы). Религиозное рвение [Concept('crusade', 'крестового похода')|e] увеличивается"
 summon_iberian_military_orders_order_tt: "Выбранный военный орден получает #G 10#! [zeal|e]"
 summon_iberian_military_orders_event_tt: "С нами происходит [event|e] «$d009_holy_war.1.title$»"
 choose_military_order_to_summon: "Выбрать военный орден"
 summon_iberian_military_orders_no_orders: "@trigger_no! Нет ни одного достаточно укоренённого и верного военного ордена, который можно было бы призвать."
 launch_a_cabalgada: "Организовать кавалерийский набег"
 launch_a_cabalgada_desc: "Устройте набег на одну из пограничных провинций противника. Все локации, не защищенные крепостями и армиями, будут разграблены и потеряют очки развития. Их владелец сможет собрать войска в ответ."
 launch_a_cabalgada_tt: "Требуется [Concept('manpower', 'число рекрутов')|e], собираемое за один год. Религиозное рвение [Concept('crusade', 'крестового похода')|e] уменьшается на #R 10#!. Подготовка сдвигается назад на #R 10#!"
 launch_a_cabalgada_loot_tt: "Каждый незащищённый район в провинции, где нет крепости и армии, подвергается грабежу; добыча составит около [actor.MakeScope.ScriptValue('cabalgada_estimated_total')|0+=][gold_i]. Снижается уровень развития районов"
 choose_province_for_cabalgada: "Выбрать провинцию для набега"
 launch_a_cabalgada_no_provinces: "@trigger_no! У врага нет незащищённых приграничных провинций, на которые можно было бы устроить набег."
 demand_parias: "Требование дани"
 demand_parias_desc: "В качестве светского лидера [Concept('crusade', 'крестового похода')|e] потребовать дань у вражеской державы во время подготовки. Враг может заплатить, тем самым отложив сбор [Concept('crusade', 'крестового похода')], или отказаться, тем самым увеличив его религиозное рвение."
