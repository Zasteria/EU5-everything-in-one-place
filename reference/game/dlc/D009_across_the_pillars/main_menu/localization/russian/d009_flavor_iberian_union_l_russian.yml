 d009_flavor_iberian_union.1.title: "Провозглашение испанской монархии"
 d009_flavor_iberian_union.1.desc: "Короны нашей унии сплелись настолько тесно, что мы теперь единое государство во всём, кроме названия. Наша администрация управляет общими землями, законы и монета действуют от одного края полуострова до другого, а некогда малые королевства превратились в провинции великой державы.\n\nПришёл час отбросить старые титулы и перед лицом всего мира провозгласить единую суверенную монархию — Испанию."
 d009_flavor_iberian_union.1.a: "Провозгласить испанскую монархию!"
