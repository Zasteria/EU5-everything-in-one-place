 saharan_trade_house_desc: "Склады этого великого торгового дома всегда полны золота, соли и тканей, доставляемых караванами через Сахару. Будучи создан в одном из рыночных центров, он позволяет полностью контролировать караванные пути и получать постоянный доход от торговли в пустыне."
 can_only_be_built_via_saharan_trade_house_action_tt: "Можно основать только с помощью [Concept('action', 'действия')|e] «[ShowGenericActionName('adu_charter_saharan_trade_house')]» в ходе [Concept('situation', 'ситуации')|e] «[GetSituationByKey('golden_century').GetName]»"
 RECONQUER_IBERIA_WAR_NAME: "Возвращение Иберии"
 golden_century_events.30.title: "Потерянное столетие"
 golden_century_events.30.desc: "Золотой век, к которому мы так стремились, скоропостижно закончился. В итоге четверть земель, которые мы удерживали в начале эпохи, перешли к тем силам, которые бросили вызов нашей гегемонии. [target_ruler.GetName] не [Select_CString(target_ruler.IsFemale, 'справился', 'справилась' )] со своей задачей, а потому наша держава больше не может претендовать на мировое господство.\n\nЛегенду нашего великого расцвета затмит лишь история нашего громкого падения. Всё, что нам остаётся, — это собраться с силами и постараться пережить грядущие годы."
 golden_century_events.30.a: "Вот и завершился наш золотой век."
 golden_century_events.31.title: "Падение колосса"
 golden_century_events.31.desc: "Гегемон нашей эпохи в лице #ONCLICK:COUNTRY,[gc_hegemon.Custom('CL_tt')] #TOOLTIP:COUNTRY,[gc_hegemon.Custom('CL_tt')],X [gc_hegemon.Custom('CL_GEN')|L]#!#! оказался унижен и потерял четверть своих земель. Колосс, некогда подчинивший себе всю #TOOLTIP:CONTINENT,europe,X #L Европу#!#! и дальние моря, наконец повержен, и теперь маятник власти неизбежно качнётся в другую сторону…"
 golden_century_events.31.desc.destroyed: "Колосс, некогда возвышавшийся над эпохой, полностью стёрт с карты. Держава, затмевавшая [ShowContinentName('europe')] и моря за её пределами, разрушена, а её земли разделены между теми, кого она некогда подчиняла. Равновесие эпохи вновь меняется."
 golden_century_events.31.a: "Коалиция выполнила свой долг."
 golden_century_events.31.b: "Наступает новая эпоха."
 gc_ending_defeat_member_tt: "Поскольку мы выступили в коалиции против #ONCLICK:COUNTRY,[gc_hegemon.Custom('CL_tt')] #TOOLTIP:COUNTRY,[gc_hegemon.Custom('CL_tt')],X [gc_hegemon.Custom('CL_GEN')|L]#!#!, теперь нам доступен повод для войны «[ShowCasusBelliName('cb_reconquer_iberia')]», который снижает затраты военного счёта на захват #TOOLTIP:REGION,iberia_region,X $tt_op_L$Иберии$tt_cl_2$. Сильнейший из нас заслужит титул разрушителя Иберии"
 golden_century_events.33.title: "Золотой век"
 golden_century_events.33.desc: "С начала нашего расцвета прошла сотня лет, но наше величие всё так же неоспоримо. Все, кто объединялся в коалиции и бросал нам вызов, так или иначе потерпели поражение и рассеялись. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'привёл', 'привела' )] нашу державу в золотой век, о котором будут вспоминать ещё многие поколения наших потомков.\n\nВсе наши приобретения в #TOOLTIP:CONTINENT,europe,X #L Европе#!#! и за пределами океана уже стали неотъемлемой частью [ROOT.GetCountry.Custom('rank_ru_GEN')|l], и никакая сила не сможет этого изменить."
 golden_century_events.33.a: "Этот век остался за нами."
 golden_century_events.34.title: "Триумф колосса"
 golden_century_events.34.desc: "[gc_hegemon.GetName] пережил[gc_hegemon.Custom('endrank_fem')] все испытания минувшей эпохи, сохранив при этом свою гегемонию. Золотой век этой державы несомненно войдёт в историю, а её влияние в #TOOLTIP:CONTINENT,europe,X $tt_op_L$Европе$tt_cl_2$ и других частях света оставит свой след на многие поколения."
 golden_century_events.34.a: "Нам не удалось их сломить."
 golden_century_events.34.b: "История запомнит их триумф."
 golden_century_events.54.title: "Великий союз посрамлён"
 golden_century_events.54.desc: "Коалиция, созданная против нам, разгромлена в открытой войне, а её члены дорого заплатили за свою самонадеянность. Наши бывшие соперники расторгают свои великие союзы, предпочитая выживание поодиночке совместному поражению.\n\nМы доказали свою состоятельность перед всеми судами #TOOLTIP:CONTINENT,europe,X #L Европы#!#!. Принцы, шептавшиеся, что нашему возвышению пора положить конец, теперь говорят о нас совсем в другом тоне."
 golden_century_events.54.a: "Пусть разбегаются."
 gc_ga_humbled_tt: "Военная победа над Великим союзом повышает наше [Concept('gc_european_dominance', 'европейское доминирование')|e] на #Y 10#!, а его побеждённые члены покидают [Concept('international_organization', 'международное объединение')|e]"
 gc_salamanca_embrace_tt: "Многие [Concept('pops', 'группы населения')|e] наших центров просвещения, не разделяющие нашу [Concept('religion', 'религию')|e] или [Concept('culture', 'культуру')|e], примут их"
