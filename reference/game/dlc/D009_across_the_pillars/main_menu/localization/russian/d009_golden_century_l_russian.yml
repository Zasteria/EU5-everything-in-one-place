 enables_build_qadi_office_action_tt: "Открывает [Concept('action', 'действие')|e] «[ShowGenericActionName('adu_build_qadi_office')]», которое позволяет назначить шариатского судью в столице нашего [Concept('subject', 'ленника')|e]"
 golden_century_events.28.title: "Владычество за краем света"
 golden_century_events.28.desc.desc_spa: "Наше влияние простирается на весь белый свет. Дальние моря усеяны нашими торговыми судами, иностранные колонии существуют лишь с нашего позволения, а когда [target_ruler.GetName] желает занять какую-либо гавань, пролив или остров, [Select_CString(target_ruler.IsFemale, 'её', 'его' )] оппоненту остаётся лишь назвать цену, ибо он попросту не вправе отказаться.\n\nКогда-то наши предки вымаливали карты у иностранных мореходов. Теперь же наши внуки будут изучать наши собственные карты и находить наше наследие всюду, куда бы они ни прибыли. Между этими двумя поколениями затесались мы — те самые трудолюбивые люди, которые сделали это будущее возможным."
 golden_century_events.28.desc.desc_adu: "Вся торговля от дальних уголков пустыни до западного моря лежит в руках одной державы. Ни один караван или торговое судно не сдвинутся с места, пока мы не получим свою долю, и все наши заморские подданные, бывшие нам прежде чужими, теперь молятся, торгуют и общаются в соответствии с нашей культурой и порядками.\n\nДаже #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! короли правят лишь с нашего позволения и прекрасно об этом знают. [target_ruler.GetName] навсегда войдёт в историю, поскольку именно при [Select_CString(target_ruler.IsFemale, 'ней', 'нём' )] дальние земли перестали быть для нас чем-то недосягаемым и фактически стали частью нашей могучей державы."
 golden_century_events.28.desc.historical_info_spa: "Во второй половине XVI века Испанская империя обрела статус мировой сверхдержавы. Серебряные рудники в Потоси, открытые в 1545 году, обеспечивали драгоценным металлом монетные дворы по всему миру, а с 1565 года манильские галеоны стали перевозить добытое там серебро через Тихий океан для закупки азиатского шёлка. Многие говорили, и не без оснований, что над владениями испанского короля никогда не заходит солнце."
 golden_century_events.28.desc.historical_info_adu: "В эпоху своего расцвета империя Альмохадов удерживала под своим контролем оба берега Западного Средиземноморья. Их флот не знал себе равных. Неслучайно в 1189 году Саладин, стремясь найти союзников в борьбе с крестоносцами, обратился за помощью именно к альмохадскому халифу — он просил выслать корабли мусульманского Запада, дабы те отрезали франкам пути снабжения по морю."
 golden_century_events.28.a: "Отныне нам принадлежит весь мир."
 as_long_as_we_remain_at_100_colonial_dominance_global_colonial_dominance_modifier_tt: "Пока наше [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 100#!, наша держава будет получать бонусы от модификатора «[ShowModifier('global_colonial_dominance_modifier')]»"
