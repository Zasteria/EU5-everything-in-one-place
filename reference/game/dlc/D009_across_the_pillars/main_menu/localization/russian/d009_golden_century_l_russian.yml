 as_long_as_we_remain_at_75_european_dominance_sword_of_the_west_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] на протяжении #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! не опускается ниже #Y 75#!, наша держава будет получать бонусы от модификатора «[ShowModifier('sword_of_the_west_modifier')]»"
 enables_proclaim_fatwa_action_tt: "Доступно [Concept('action', 'действие')|e] «[ShowGenericActionName('adu_proclaim_a_fatwa')]», в результате которого [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] наделяют избранную сторону нашей власти авторитетом веры"
 spa_enforce_conformity: "Привести к покорности"
 spa_enforce_conformity_select_area: "Привести область к покорности"
