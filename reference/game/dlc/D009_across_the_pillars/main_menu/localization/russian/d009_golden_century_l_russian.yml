 gc_flashpoint_meter: "Прогресс переломного момента"
 gc_flashpoint_meter_desc: "Золотой век не будет длиться бесконечно: крепость нашей власти, наше положение за рубежом, долговое бремя, обесценивание валюты — всё это способствует росту напряжения. Когда оно достигнет предела, начнётся [Concept('flashpoint', 'переломный момент')|e]. Он может либо вывести нашу державу в зенит, либо повергнуть её в хаос."
 GC_FLASHPOINT_METER_DISPLAY: "$VAL$"
 gc_flashpoint_meter_at_max_tt: "При значении #Y 100#! в доминирующей [Concept('country', 'державе')|e] наступает [Concept('flashpoint', 'переломный момент')|e] ситуации «[ShowSituationName('golden_century')]», после чего значение возвращается к #Y 0#!"
