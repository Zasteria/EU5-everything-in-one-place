 crown_of_al_andalus_desc: "Одна корона, чтобы править всеми: тайфы #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, веками остававшиеся разделёнными после падения #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#!, вновь собраны под властью одного престола, и отныне и правоверные, и зимми признают власть нашего дома."
 adu_restored_f: "Аль-Андалус"
 adu_restored_f_desc: "Битва за #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гибралтарский пролив#!#! завершилась победой, и теперь можно приступать к восстановлению Аль-Андалуса. #TOOLTIP:RELIGIONGROUP,muslim,X #L Ислам#!#! восторжествовал; чтобы возродить прежний порядок, потребуется вернуть под нашу власть лишь немногие земли #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!."
