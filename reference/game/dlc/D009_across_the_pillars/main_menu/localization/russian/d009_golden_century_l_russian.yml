 gc_decision_iberian_union_leader_tt: "Мы являемся старшим партнёром в глубоко интегрированной Иберийской унии"
 gc_decision_muslim_branch_tt: "Мы правим как [ShowFormableCountryName('MOR_f')], или восстановили [ShowFormableCountryName('ADU_f')]"
 gc_colonial_dominance: "Доминирование в колониях"
 gc_colonial_dominance_desc: "Наше влияние в Новом Свете увеличивается каждый месяц, и всё благодаря колониям, кораблям с сокровищами, морским традициями и вере, которую мы принесли с собой. Здесь начинается наш золотой век, в котором каждое новое достижение оборачивается долгосрочной выгодой."
 GC_COLONIAL_DOMINANCE_DISPLAY: "$VAL$"
 gc_european_dominance: "Доминирование в Европе"
 gc_european_dominance_desc: "Каждый месяц наша власть над Европой становится всё больше. И причины тому: размеры государства, его стабильность, наши армейские традиции и непоколебимая легитимность в родном регионе. Наш успех высоко ценят на родине, а каждое новое достижение оборачивается долгосрочной выгодой."
 GC_EUROPEAN_DOMINANCE_DISPLAY: "$VAL$"
