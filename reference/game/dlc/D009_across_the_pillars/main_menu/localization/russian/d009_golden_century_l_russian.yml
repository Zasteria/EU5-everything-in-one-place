 golden_century_colossus_endures: "Колосс выстоял"
 golden_century_colossus_endures_desc: "Колосс сохраняет свой век. Он получает [ShowModifier('gc_european_triumph_modifier')] и [ShowModifier('gc_colonial_triumph_modifier')], каждый из которых масштабируется в зависимости от того, насколько далеко в действительности простиралось его влияние. Там, где это влияние не встретило никакого сопротивления, он увенчивается титулом [ShowModifier('hegemon_of_europe_modifier')] или [ShowModifier('hegemon_of_new_world_modifier')]."
 golden_century_colossus_destroyed: "Падение Колосса"
 golden_century_colossus_destroyed_desc: "С исчезновением самого Колосса ни триумф, ни наказание никому не передаются: эпоха просто теряет силу, которая её определяла."
 golden_century_colossus_diminished: "Колосс умален"
 golden_century_colossus_diminished_desc: "Колосс выживает, но получает серьёзный удар по своей [stability|e] за то, что был урезан до меньших размеров."
 golden_century_lost_quarter_starting_locations_tt: "Главная [Concept('country', 'держава')|e] этой [Concept('situation', 'ситуации')|e] потеряла четверть своих начальных [Concept('locations', 'районов')|e]"
