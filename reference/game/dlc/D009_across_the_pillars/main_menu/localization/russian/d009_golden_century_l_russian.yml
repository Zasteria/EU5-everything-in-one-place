 gc_flashpoint_estate_rebels_country: "Бунтующие $ADJ$ие сословия"
 gc_flashpoint_estate_rebels_country_adjective: "Бунтующие $ADJ$ие сословия"
 gc_regional_rebels: "[COUNTRY.GetAdjectiveWithNoTooltip]ие приграничные мятежники"
 gc_regional_rebels_country: "$ADJ$ие приграничные мятежники"
 gc_regional_rebels_country_adjective: "$ADJ$ие приграничные мятежники"
 golden_century_events.41.title: "Столкновение старого и нового"
 golden_century_events.41.desc: "Сословия требуют ограничения нашей власти. Они считают, что, лишив их привилегий, мы ослабили их влияние, а потому требуют вернуть всё как было.\n\nСтарый порядок сопротивляется новому. Древние роды, особые права которых передаются по наследству, выступают против выстроенной нами централизованной власти. И каждый новый указ воспринимается ими как посягательство на то, что принадлежит им по праву. Если мы уступим, то перевес будет на их стороне, и иерархия прошлого вернётся."
 golden_century_events.41.desc.historical_info_spa: "Католическая монархия, владения которой раскинулись от Кастилии до Арагона, постоянно подвергалась нападкам привилегированных сословий. Кортесы отстаивали своё право на сбор налогов, арагонские и каталонские #italic фуэрос#! связывали королевские руки, а гранды и независимые города цеплялись за свои особые права, которые не могла ограничить ни одна реформа."
 golden_century_events.41.desc.historical_info_adu: "Провинции постоянно сопротивлялись централизованной власти в Аль-Андалусе. Власть Омейядов Кордовы держалась за счёт оплачиваемой бюрократии, однако влиятельные семьи, приграничные правители и города выступали против них. После 1031 года государство распалось на королевства (#italic тайфы#!), в которых каждый правил так, как он хотел."
 golden_century_events.41.a: "Мы уступаем их требованиям."
 golden_century_events.41.b: "Кризис — это всегда время возможностей."
 estates_protest_our_rejection_tt: "Сословия возмущены нашим отказом"
 golden_century_events.42.title: "Сосредоточение власти"
 golden_century_events.42.desc: "Настало время взять бразды правления в свои руки. Пора приструнить старые сословия и местных свободолюбцев, которые уже давно сковывают центральную власть, дабы вся государственная машина начала служить единой цели.\n\nТакой шанс выпадает лишь раз. Если мы сейчас проявим решимость, то подчиним себе все советы, суды и источники доходов. Наше государство станет единым."
 golden_century_events.42.desc.historical_info_spa: "Союз Кастилии и Арагона под началом Изабеллы и Фердинанда стал одним из первых современных государств Европы. В XVI веке корона правила при помощи королевских советов, отправляла #italic коррехидоров#! руководить городами, смогла усмирить Кортесов и духовно-рыцарские ордена; и тем самым постепенно сосредоточила всю власть в своих руках."
 golden_century_events.42.desc.historical_info_adu: "В период своего расцвета кордовский халифат, созданный после 929 года Абд аль-Рахманом III, был одним из самых централизованных государств своего времени. Халиф содержал  #italic диван#! и регулярную армию, а также назначал в городах наместников, что позволяло ему править объединённым Аль-Андалусом прямо из столицы на зависть раздроблённым государствам-соседям."
 golden_century_events.42.a: "Вся власть центру."
 golden_century_events.42.b: "Усиление правящего совета."
 golden_century_events.42.c: "Сбор большого войска."
 golden_century_events.43.title: "Золотой век искусств"
 golden_century_events.43.desc.desc_spa: "Богатство и уверенность в завтрашнем дне подчас способны породить чудо: [ROOT.GetCountry.GetCapital.GetName] переживает настоящий всплеск таланта. Театры переполнены, издательства едва успевают отпечатывать новые стихи и поэмы, а художники, равных которым, возможно, в истории нашей державы никогда уже не будет, пишут шедевры для короны и церкви.\n\nНаш двор привлекает взоры лучших умов #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, и каждый ждёт, что [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] станет главным покровителем искусства нашего времени. Серебро принесло нам земли — теперь оно может принести и славу. Ведь любую эпоху помнят не только за то, что она подарила человечеству, но и за ту цену, которую она за это запросила. Так откроем же казну [ROOT.GetCountry.Custom('rank_ru_GEN')|l], и пусть творцы черпают из неё вдоволь."
 golden_century_events.43.desc.desc_adu: "В стенах города [ROOT.GetCapital.GetName] вновь пробуждается древняя тяга к знаниям. Поэты обмениваются стихами до глубокой ночи, при дворе собираются врачи и астрономы, а песни Аль-Андалуса вновь звучат в двориках, где до сих пор царствовала тишина.\n\nНа протяжении многих веков наши города были маяком для западных держав, освещавшим им путь к знаниям, и теперь нам вновь предстоит разжечь этот огонь. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] получает множество советов о том, что нужно собрать при дворе самых одарённых людей со всех концов света, пополнить библиотеки, поддержать школы и вновь доказать всему миру: [ROOT.GetCountry.GetName] по-прежнему оста[ROOT.GetCountry.Custom('end_etyut')]ся центром мудрости и просвещения. Пришло время нашей державе стать покровительницей талантов."
 golden_century_events.43.desc.historical_info_spa: "Золотой век Испанской империи (#italic Siglo de Oro#!) сопровождался небывалым расцветом культуры, подпитываемым серебром из Нового Света. Это время подарило миру #italic Дон Кихота#! Сервантеса, театр Лопе де Веги и Кальдерона, а также работы Эль Греко, Веласкеса и Мурильо."
 golden_century_events.43.desc.historical_info_adu: "Кордова X века была самым просвещённым городом в Западной Европе, а её библиотека — крупнейшая на континенте. Познания в медицине, философии и астрономии учёных Кордовы (среди них философ Ибн Рушд и хирург Аз-Захрави) распространились далеко за пределы мусульманского мира. Великолепие этого города отразилось в насридской Альгамбре в Гранаде."
 golden_century_events.43.a: "Пусть этот век станет золотым."
 golden_century_events.44.title: "[target_character.GetNameWithNoTooltip] поступает к нам на службу"
 golden_century_events.44.desc.desc_spa: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'получила', 'получил' )] вести о человеке по имени [target_character.GetName], и те, кому довелось видеть [Select_CString(target_character.IsFemale, 'её', 'его' )] в деле, только о [Select_CString(target_character.IsFemale, 'ней', 'нём' )] и говорят. Будь то командование войсками или выступление перед советом, [Select_CString(target_character.IsFemale, 'она', 'он' )] неизменно демонстрирует удивительный талант. Завербовать такого человека — редкая удача для короны, порой выпадающая лишь раз в жизни.\n\nПодобный талант не будет долго оставаться незамеченным. Если мы хотим, чтобы [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'служила', 'служил' )] нашей державе, а не кому-то другому, [Select_CString(target_character.IsFemale, 'её', 'его' )] необходимо привлечь на нашу сторону уже сейчас — даровать [Select_CString(target_character.IsFemale, 'ей', 'ему' )] достаточно почестей и полномочий, чтобы [Select_CString(target_character.IsFemale, 'она осталась', 'он остался' )] с нами."
 golden_century_events.44.desc.desc_adu: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'предстала', 'предстал' )] перед [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'правительницей', 'правителем' )], и [ROOT.GetCountry.GetGovernment.GetRuler.GetName] сразу [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'поняла', 'понял' )], что похвалы, которые все придворные воспевают этому человеку — отнюдь не пустые слова. И в зале совета, и в военном походе [Select_CString(target_character.IsFemale, 'она', 'он' )] проявляет удивительные способности, от которых не раз зависела судьба целых династий.\n\nТакой ум — большая ценность для любого двора. Если [target_character.GetNameWithNoTooltip] получит от нас подобающую должность и почести уже сейчас, то мы можем удержать [Select_CString(target_character.IsFemale, 'её', 'его' )] на службе нашей державе. Но если промедлим — кто-нибудь другой непременно воспользуется этой возможностью."
 golden_century_events.44.desc.historical_info_spa: "Гонсало Фернандес де Кордова, прозванный #italic «Великим капитаном»#!, был лучшим солдатом своего времени. Во времена Итальянских войн он разбил превосходящие по численности французские армии при Чериньоле и Гарильяно, захватил для испанской короны Неаполь и стал его первым вице-королём. Его вооружённая пиками, мечами и огнестрельным оружием пехота стала основой испанских #italic терций#!, которые больше века оставались доминирующей военной силой на полях европейских сражений."
 golden_century_events.44.desc.historical_info_adu: "Судьба Аль-Андалуса часто зависела от одного великого министра. Таким был #italic хаджиб#! аль-Мансур. Прозванный христианами Альмансором, он вёл успешные походы против северных королевств и фактически стал правителем всего халифата."
 golden_century_events.44.a: "Пусть [target_character.GetNameWithNoTooltip] заступит к нам на службу."
 golden_century_events.45.title: "Перепись в государстве"
 golden_century_events.45.desc.desc_spa: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'получила', 'получил' )] от наших писцов предложение провести всеобщую перепись: пересчитать каждый очаг, оценить каждое поле и занести истинное богатство [ROOT.GetCountry.Custom('rank_ru_GEN')|l] в реестры, которым корона сможет доверять. Труд этот медленный и неблагодарный, а уклоняющиеся от налогов будут проклинать землемеров на чём свет стоит.\n\nНо государством, которое знает себя, куда легче управлять. Справедливо собирать налоги, набирать армии сообразно нашим возможностям и расходовать средства, опираясь на точный учёт, а не на одни лишь домыслы — вот та сила, на которой зиждется власть, способная устоять под натиском времени. Кто владеет знанием, тот владеет ситуацией. Пора начать перепись."
 golden_century_events.45.desc.desc_adu: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'получила', 'получил' )] от наши секретарей настоятельный совет вновь привести реестры в порядок: пересчитать население и кто чем владеет, как некогда делал #italic диван#! — от Кордовы до Багдада. Они напоминают: честно и тщательно ведущаяся учётная книга — это фундамент, на котором зиждется всякая сильная власть.\n\nИменно благодаря такому кропотливому учёту наши предки могли платить чиновникам и армии, и при этом обладать такой казной, какой северяне могли лишь завидовать. Возрождение этой практики позволит заменить догадки правителя на точные записи, и тогда вся наша держава будет подчиняться единому знанию. Пора начать перепись."
 golden_century_events.45.desc.historical_info_spa: "Кастильская корона периодически проводила масштабные переписи (#italic averiguaciones#!) и пересчитывала очаги и материальные богатства, чтобы определить размеры налогов. Габсбурги распространили эту практику на все свои обширные владения."
 golden_century_events.45.desc.historical_info_adu: "Омейядская Кордова управлялась с помощью сложноустроенного #italic дивана#! — наследия системы государственного управления Дамаска и Багдада. Его чиновники и налоговые регистры обеспечивали государство такими доходами, что завидовала вся христианская Европа."
 golden_century_events.45.a: "Проведём перепись."
 golden_century_events.46.title: "Ярмарки переполнены"
 golden_century_events.46.desc.desc_spa: "Ярмарки в этом году разрослись до невиданных прежде размеров. Купцы стекаются со всех королевств #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, векселя переходят из рук в руки, да на такие суммы, за которые некогда можно было оплатить целую войну, а в меняльных конторах державы от самого рассвета до заката не смолкает звон монет.\n\nНо это не будет длиться вечно. Пока генуэзцы и великие банкирские дома охотно дают нам займы, а серебро течёт рекой, мы можем связать их кредиты с нашей короной, направить их торговлю через наши города и получать десятину с каждой заключённой сделки. Фортуна преподнесла нам золотую возможность. Воспользуемся же ей сполна."
 golden_century_events.46.desc.desc_adu: "Никогда ещё рынки города [ROOT.GetCapital.GetName] не видели такого столпотворения. Караваны из #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! и корабли из-за моря нескончаемым потоком везут шёлк, бумагу, кожу и глазурованные изделия, которые наши собственные мастера отправляют за границу. Менялы едва успевают обслуживать народ у прилавков.\n\nТорговля в западном море всегда была источником силы Аль-Андалуса — в удачные годы она приносила больше богатств, чем любая дань, собранная с поверженных врагов. Если мы обезопасим дороги, облегчим путь купцам и сохраним наши порты предметом зависти для всего побережья, этот расцвет торговли будет наполнять нашу казну её многие годы. Нельзя упускать такую возможность."
 golden_century_events.46.desc.historical_info_spa: "Ярмарки в Медина-дель-Кампо были финансовым центром Кастилии. Именно там большинство европейцев рассчитывалось по векселям, а генуэзские и немецкие банки заключали сделки с короной."
 golden_century_events.46.desc.historical_info_adu: "Андалусия вела торговлю по всей территории от Магриба до Леванта. Кордова и Гранада поставляли шёлк, бумагу, кожу и люстрованные изделия. Рынки этих городов были одними из самых оживлённых во всём средневековом Средиземноморье."
 golden_century_events.46.a: "Пусть торговля процветает"
 golden_century_events.47.title: "Новое «Искусство войны»"
 golden_century_events.47.desc.desc_spa: "Наши капитаны обучают пехоту по-новому, выстраивая пикинёров и стрелков в каре, которые не дрогнут ни перед конницей, ни перед сомкнутыми рядами врага. Старые бойцы, повидавшие многие сражения в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!, клянутся, что никогда ещё им не доводилось видеть столь крепкого строя.\n\nЕсли дать нашим армиям деньги и время, чтобы отточить это искусство, они могут стать грозной силой на любом поле боя, а названия наших полков будут произносить со страхом от #TOOLTIP:REGION,italy_region,X #L Италии#!#! до северных земель. Войны выигрывают те, кто осваивает новое военное искусство прежде, чем противник научится ему противостоять. Нужно выделить средства на реформы."
 golden_century_events.47.desc.desc_adu: "Наши командиры настаивают на том, что [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] возродить старое воинское искусство: стремительную лёгкую конницу, что изматывает врага и обходит его с флангов. Кроме того, новое пороховое оружие будет ей отличной поддержкой. В пограничных землях всегда были важны стремительность и внезапность, и немногие владели этими качествами столь искусно, как наши предки.\n\nСоединим эту древнюю хитрость с артиллерией новой эпохи — и знамён наших армий будут страшиться и за морем, и среди песков, как на христианской границе, так и на берегах #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#!. [ROOT.GetCountry.GetFlavorRank] не удержит своих границ, если не будет осваивать новые способы ведения войны. Нужно выделить средства на реформы."
 golden_century_events.47.desc.historical_info_spa: "Испанский генерал Гонсало де Кордова впервые применил #italic терцию#! — особое боевое построение из пикинёров и аркебузиров, которое больше века доминировало на полях европейских сражений и превратило Испанию в ведущую военную державу своего времени."
 golden_century_events.47.desc.historical_info_adu: "#italic Хинеты#! высоко ценились в андалусских и берберских войнах. Эти всадники были легко вооружены и проворны, а в бою использовали дротики и мечи. А гранадские Насриды были одними из первых на полуострове, кто применил пороховую артиллерию против своих врагов."
 golden_century_events.47.a: "Проспонсируем реформы."
 golden_century_events.48.title: "Оплот знаний"
 golden_century_events.48.desc.desc_spa: "Даже старожилы уже не помнят, когда в последний раз университетские аудитории [ROOT.GetCountry.Custom('rank_ru_GEN')|l] гудели так громко. Правоведы спорят, вправе ли князь по закону делать то, что он всё равно намеревается сделать, богословы рассуждают о правах заморских народов, а половина #TOOLTIP:CONTINENT,europe,X #L европейских#!#! дворов пишет нам, умоляя прислать копию вердикта.\n\nПусть никто не скажет, что мы пожалели денег для учёных. Мы учредим стипендии для великих школ, а Саламанку вознесём выше всех прочих — тогда произведения из нашей державы будут цитировать даже там, куда никогда не ступала наша армия. Страхом можно внушить покорность кому угодно, но когда к тебе прислушиваются добровольно — вот настоящая победа. Нужно учредить стипендии для учёных."
 golden_century_events.48.desc.desc_adu: "Медресе нашей державы вновь переполнены, а врачеватели, астрономы и переводчики принялись за работу с двойным усердием, словно после слишком долгого перерыва. Старые книги снова снимают с полок, а споры, которые они порождают, уходят корнями в ещё более далёкие времена.\n\nНам должно поддержать эти обители знаний и позволить им расцвести. Пусть память о великой библиотеке Кордовы, которая некогда заставляла все дворы Запада стыдиться собственного невежества, побуждает нас не просто предаваться воспоминаниям. Рассеянные знания ещё можно собрать воедино. Нужно учредить стипендии для учёных."
 golden_century_events.48.desc.historical_info_spa: "Основанный в 1218 году Университет Саламанки был одним из старейших и наиболее прославленных университетов Европы. В XVI веке при университете сформировалась так называемая «Саламанкская школа», у истоков которой стоял доминиканец Франсиско де Витория. Её представители возродили схоластическую мысль и обсуждали права народов Америки и правовые пределы ведения войны — вопросы, заложившие основы международного права."
 golden_century_events.48.desc.historical_info_adu: "По преданию, Кордовская библиотека, собранная во времена царствования халифа аль-Хакама II, насчитывала сотни тысяч томов и считалась крупнейшим собранием книг на Западе. Её переводчики познакомили христианскую Европу с #italic фалсафой#! (исламской философией) Ибн Рушда, которого латиняне знали под именем Аверроэс. В то же время в стенах гранадского #italic бимаристана#! (больницы) преподавали медицину — в эпоху, когда большая часть континента всё ещё полагалась лишь на молитвы."
 golden_century_events.48.a: "Предоставить учёным средства."
 golden_century_events.49.title: "Расчёт по долгам"
 golden_century_events.49.desc.desc_spa: "Несмотря на всё то серебро, что прибывает к нам из-за океана, мы всё равно оказались в долгу перед кредиторами. Банкиры трясут нашими долговыми расписками, проценты пожирают доходы от серебряного флота ещё до того, как он войдёт в порт, а от нас требуют выплат, которые казна просто не в состоянии предоставить.\n\nДостойного выхода больше нет — пора принять трудное решение. Мы можем приостановить выплаты по долгам и нарушить слово, данное домам, что финансируют наши войны, или ещё сильнее обложить налогами державу, выжимая из неё всё до последней монеты."
 golden_century_events.49.desc.desc_adu: "[ROOT.GetCapital.GetName] больше не в состоянии выполнять свои финансовые обязательства. Бесконечные расходы на удержание границ, жалование воинам #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! и дань, которую требуют более могущественные соседи, истощили наши запасы.\n\nРостовщики становятся всё настойчивее, хотя даже они не столь напористы, как военные казначеи: армия, оставшаяся без жалованья, быстро разбредётся или обратит оружие против нас самих. Больше тянуть нельзя. Мы должны найти деньги, отказаться от выплаты долгов или лишиться тех, кто хранит безопасность наших границ."
 golden_century_events.49.desc.historical_info_spa: "Несмотря на приток серебра из Америки, испанская корона неоднократно объявляла о банкротстве, не имея возможности обслуживать свои колоссальные долги перед банковскими домами Фуггеров и Генуи. Так, в частности, было в 1557, 1575 и 1596 годах."
 golden_century_events.49.desc.historical_info_adu: "Государства Аль-Андалуса и Магриба постоянно испытывали нехватку средств из-за расходов на пограничные стычки и необходимости платить жалованье берберским наёмникам и дань, которую требовали от них более могущественные соседи, — такое бремя могло опустошить казну быстрее, чем налоги успевали её пополнять."
 golden_century_events.49.a: "Обесценить монету и попытаться преодолеть трудности."
 golden_century_events.49.b: "Затянуть пояса!"
 golden_century_events.50.title: "Чума в самом сердце страны"
 golden_century_events.50.desc: "#TOOLTIP:DISEASE,bubonic_plague,X #L Бубонная чума#!#! проникла в самое сердце [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. Она опустошает деревни и рыщет по городским переулкам, не щадя ни богатых, ни бедных. Кладбища за городскими стенами едва успевают принимать всё новые и новые телеги с мертвецами. Врачи пока бессильны и не могут остановить эту напасть.\n\nПротив врага, которого не остановить ни осадой, ни договором, короне остаётся лишь сохранять самообладание и делать всё необходимое: хоронить мёртвых, кормить и укрывать живых и поддерживать порядок там, где паника может унести больше жизней, чем сама болезнь. Сейчас мы можем лишь заботиться о народе, терпеть и молиться, чтобы этот кошмар поскорее закончился."
 golden_century_events.50.desc.historical_info: "После Чёрной смерти XIV века Пиренейский полуостров неоднократно переживал новые вспышки чумы, опустошавшие города и сельскую местность, сокращавшие численность трудоспособного населения и подрывавшие доходы казны, от которых зависело каждое государство. Одна лишь кастильская эпидемия чумы, продлившаяся с 1596 по 1602 год, по некоторым оценкам, унесла около шестисот тысяч жизней, что стало демографическим потрясением, от которого Кастилия так и не смогла полностью оправиться и которое историки относят к числу причин её затяжного упадка."
 golden_century_events.50.a: "Хватит кашлять друг на друга!"
 golden_century_events.51.title: "Мятеж в пограничье"
 golden_century_events.51.desc: "Область [target_area.GetName] открыто восстала, причём мятеж разгорелся чуть ли не под самыми стенами нашей столицы. Местные жители взялись за оружие, изгнали наших чиновников и заявили, что отныне больше нам не подчиняются.\n\nМы не можем оставить безнаказанным восстание, вспыхнувшее у самого сердца нашей державы. Каждый край, который увидит подобное неповиновение и решит, что за это ничего не будет, задумается и о собственных шансах. Одна искра мятежа способна спалить целое государство. Мы должны подавить восстание, пока этому примеру не последовали другие."
 golden_century_events.51.desc.historical_info: "Правителей Иберии всегда преследовал призрак мятежей и восстаний в собственных землях. В 1031 году Кордовский халифат распался на множество #italic тайф#!, во главе которых встали мелкие эмиры. Много столетий спустя мориски — мусульмане, вынужденные некогда принять католичество, — подняли восстание против кастильского владычества и в период с 1568 по 1571 год вели жестокую войну в горном районе Альпухарры. Кроме того, #italic фуэрос#! Арагона и Каталонии накладывали жёсткие ограничения на власть короны. На этом полуострове доведённая до крайности провинция всегда была готова поднять собственное знамя."
 golden_century_events.51.a: "Мы не оставим их неповиновение без ответа."
 golden_century_events.52.title: "Голод и бунт"
 golden_century_events.52.desc: "Урожай погиб, и хлеб стал слишком дорогим для простого народа. В городах [ROOT.GetCountry.Custom('rank_ru_GEN')|l] голодные толпы собираются у зернохранилищ и поднимают бунты, а деревни пустеют: отчаявшиеся люди уходят в поисках лучшей жизни.\n\nВ голодные годы правителя судят куда строже, чем во времена изобилия. Голодным людям нет дела до серебра, добытого за морем, если дома нет и куска хлеба. От пустого желудка до камня, брошенного в нашего чиновника, путь недолог. Мы должны найти зерно, наполнить рынки и сохранить порядок на улицах — иначе наш собственный изголодавшийся народ станет страшнее любой вражеской армии."
 golden_century_events.52.desc.historical_info: "Крупнейшие города Пиренейского полуострова всегда были беззащитны перед нехваткой продовольствия: один неурожай или нарушение торговых путей могли за считаные месяцы обернуться голодом и бунтом на городских улицах. Голод и обезлюдение деревень в начале XVII века, ставшие частью упадка Кастилии, гнали местных жителей с земли и превратили хлебные бунты в привычное явление испанской городской жизни."
 golden_century_events.52.a: "Нас окружают голодные толпы."
 gc_decision.title: "Начало Золотого века"
 gc_decision.desc: "[GetSituationByKey('battle_for_the_strait').GetName] завершена, и именно наше знамя развевается над #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гибралтарским проливом#!#!. Вся южная часть #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! отныне подчиняется нашей державе, и не осталось соперников, способных оспорить эту власть.\n\nНо одной памяти о победе будет мало — грядущая эпоха должна наполниться новыми свершениями. В #TOOLTIP:CONTINENT,europe,X #L Европе#!#! теперь прислушиваются к нашим словам — даже там, куда ещё никогда не ступали наши армии, а за океаном нас ждут неизведанные берега. Пусть имя #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! гремит на протяжении всего наступающего века."
 gc_decision.desc.entry: "Тот, кто удерживает [ShowLocationName('strait_of_gibraltar')], держит врата между Средиземным морем и океаном, и теперь эти врата наши. Мир на юге освобождает нашу казну и наш флот для больших устремлений — как в [ShowContinentName('europe')], так и на дальних берегах. Войны выигрываются за один сезон, но золотой век нужно строить."
 gc_decision.a: "Многие карты придётся переписать!"
 restore_cordoba.title: "Восстановление Кордовы"
 restore_cordoba.desc: "Когда-то #TOOLTIP:LOCATION,cordoba,X #L Кордова#!#! была жемчужиной Запада, но с тех пор она утратила былое великолепие, которым блистала при халифах. Её библиотеки и великая мечеть вызывали зависть у всего континента. Нужно использовать богатства нашей державы и вновь превратить Кордову в величайший город #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
 restore_cordoba.a: "Восстановить жемчужину Аль-Андалуса."
 enable_decision_to_restore_learning_center_in_cordoba_tt: "Доступно [decision|el] #Y $restore_cordoba.title$#!"
 library_cordoba: "Кордовская библиотека"
 library_cordoba_desc: "В дни своего расцвета $library_cordoba$ хранила сотни тысяч томов — это было крупнейшее собрание книг на Западе, которому завидовали от #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! до земель #TOOLTIP:REGION,crescent_region,X #L Плодородного полумесяца#!#!. После восстановления она вновь привлекает учёных, переводчиков и переписчиков со всего мира, а #TOOLTIP:LOCATION,cordoba,X #L Кордова#!#! вернула себе статус центра просвещения."
 library_cordoba_maintenance: "$library_cordoba$"
 gc_change_colonial_dominance: "[gc_colonial_dominance|e]: $VALUE|+$"
 neg_gc_change_colonial_dominance: "[gc_colonial_dominance|e]: $VALUE|+$"
 gc_change_european_dominance: "[gc_european_dominance|e]: $VALUE|+$"
 neg_gc_change_european_dominance: "[gc_european_dominance|e]: $VALUE|+$"
 golden_century_events.1.title: "Золотой век [ROOT.GetCountry.Custom('CL_GEN')]"
 golden_century_events.1.desc.desc_spa: "Долгая [GetSituationByKey('battle_for_the_strait').GetName|l] завершилась нашей победой, и теперь наша держава стала главной силой #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!. Старые соперники повержены, южная граница наконец в безопасности, и [target_ruler.GetName], покончив с этой священной войной, [Select_CString(target_ruler.IsFemale, 'готова', 'готов' )] взяться за куда более трудное дело — объединению разрозненных земель в единую державу.\n\nПеред нами открываются сразу два пути. Один из них — [ShowContinentName('europe')], что некогда игнорировала нас, а теперь прислушивается к каждому нашему слову. Второй же — заморские земли и души, ещё не познавшие света #TOOLTIP:RELIGIONGROUP,christian,X #L христианской#!#! веры. Грядущий век покажет, сколь значимой частью этих двух миров мы сможем завладеть."
 golden_century_events.1.desc.desc_adu: "#TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гибралтарский пролив#!#! в наших руках, соперник отброшен, и впервые за многие столетия над #TOOLTIP:REGION,iberia_region,X #L Иберией#!#!, собранной под одним знаменем, вновь раздаётся призыв к молитве. Эпоха мелких царств окончена, а [target_ruler.GetName] вновь собрал воедино то, что было потеряно после падения #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#!.\n\n#TOOLTIP:RELIGIONGROUP,christian,X #L Христианские#!#! королевства за горным перевалом, долго считавшие нас угасшей и уже ни на что не способной державой, теперь вынуждены считаться с нашим возвращением. Караванные пути и открытое море на юге сулят нам богатства, знания и власть, а имя нашей державы впервые за долгие годы вновь обрело вес в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Пусть грядущие годы покажут, насколько ярко будет гореть светоч #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
 golden_century_events.1.desc.historical_info_spa: "Золотой век Испании, или #italic Siglo de Oro#!, стал долгим периодом имперского могущества и культурного расцвета, последовавшим за объединением Кастилии и Арагона во время царствования Изабеллы и Фердинанда в 1469 году. В 1492 году Католические короли отвоевали Гранаду, завершив тем самым почти восьмивековую Реконкисту, и в том же году отправили Колумба через Атлантику.\n\nСеребро обеих Индий, превосходство #italic терций#! на полях сражений Европы и приобретение Габсбургского наследства превратили Испанию в первую по-настоящему мировую империю — державу, над которой, как говорили, никогда не заходило солнце. Это богатство обеспечило расцвет искусства и литературы — от Сервантеса и Лопе де Веги до Веласкеса и Эль Греко, — благодаря которому эпоха и получила своё название."
 golden_century_events.1.desc.historical_info_adu: "Аль-Андалус некогда был средоточием мусульманской цивилизации на всём Пиренейском полуострове. Возникнув после завоевания 711 года, он достиг вершины своего развития при Кордовском халифате, провозглашённом Абд ар-Рахманом III в 929 году. Некоторое время Кордова была крупнейшим и наиболее просвещённым городом Западной Европы, а её библиотеки, мечети и рынки не знали себе равных к северу от Средиземного моря.\n\nАндалусские учёные несли знания об алгебре, медицине, астрономии и философии далеко за пределы латинского мира, а труды античных авторов сохранялись и передавались следующим поколениям благодаря переводам с арабского языка. Несмотря на распад халифата на мелкие #italic тайфы#! в 1031 году и постепенное сокращение мусульманских владений перед натиском христианских государей, память о его просвещенности и великолепии сохранилась как свидетельство об одном из высших достижений средневековой цивилизации."
 golden_century_events.1.a: "Нас ждёт век процветания и укрепления державы."
 explain_golden_century_dominance_tt: "Наращивайте [Concept('gc_european_dominance', 'доминирование в Европе')|e] и [Concept('gc_colonial_dominance', 'колониях')|e] с помощью завоеваний, колонизации и государственной политики. Каждый пройденный порог приносит постоянную награду, а чем выше оба показателя, тем более золотым становится наш век"
 explain_golden_century_antagonists_tt: "В рамках этой [Concept('situation', 'ситуации')|e] возникает уникальная [Concept('international_organization', 'международная организация')|e] — [GetInternationalOrganizationType('grand_alliance').GetName]. Наши [Concept('rival_enemies', 'враги')|e], [Concept('rivals', 'соперники')|e] и державы, которые нас боятся, поддерживают эту организацию, и её [Concept('members', 'участники')|e] становятся тем сильнее, чем выше наше доминирование. Если им удастся одолеть нас в войне, они смогут ослабить наше влияние, воспользовавшись особым [Concept('casus_belli', 'поводом для войны')|e] и навязав соответствующие [Concept('peace_treaties', 'мирные договоры')|e]."
 explain_golden_century_flashpoints_tt: "В ходе этой [Concept('situation', 'ситуации')|e] у нас могут произойти [Concept('events', 'события')|e] [Concept('flashpoint', 'переломных моментов')|e]"
 golden_century_events.2.title: "Доминирование в Европе"
 golden_century_events.2.desc.desc_spa: "Несмотря на все старания соперников и врагов, мы достигли самой вершины нашего #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! на #TOOLTIP:CONTINENT,europe,X #L европейском#!#! континенте. Ни одна коалиция не способна противостоять нам, ни один двор не осмеливается пренебречь нашими желаниями, а [target_ruler.GetName] — пусть и не по титулу, но по праву — [Select_CString(target_ruler.IsFemale, 'признана величайшей правительницей', 'признан величайшим правителем')] христианского мира.\n\n[ShowUnitDefinitionName('a_tercio')] властвуют на полях сражений, имперские титулы в пределах нашей досягаемости, и судьба всей Европы, #TOOLTIP:REGION,italy_region,X #L Италии#!#! до Нидерландов, зависит от нашей воли. Пусть враги строят козни — эта эпоха принадлежит нам."
 golden_century_events.2.desc.desc_adu: "На пике нашего #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! мы вновь стали главной державой #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!. Силу, что давно считалась угасающим пережитком минувшей эпохи, более никто не может игнорировать. #TOOLTIP:RELIGIONGROUP,christian,X #L Христианские#!#! королевства за горами вынуждены либо вести с нами переговоры, либо молча отступить в сторону.\n\nНаши флотилии господствуют в западных морях, наши гарнизоны удерживают каждый перевал, а имя «[target_ruler.GetName]» произносят с тем же благоговением, какое некогда вызывали халифы #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#!. От Пиренеев до самых дальних берегов #TOOLTIP:CONTINENT,europe,X #L Европы#!#! — никто не посмеет поднять руку на последователей нашей веры, не ответив сперва перед нами. Величие #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! восстановлено, и никому из ныне живущих не суждено увидеть, как оно угаснет."
 golden_century_events.2.desc.historical_info_spa: "В середине XVI века Габсбургская Испания считалась самым могущественным государством Европы. При Карле V и его сыне Филиппе II она стала ещё и богатейшей державой мира, а её армия, #italic терции#!, чьи построения из пикинёров и стрелков более века господствовали на полях сражений Европы, считалась самой грозной в своё время.\n\nПобеда при Павии в 1525 году привела к пленению короля Франции, а в 1571 году при Лепанто флот под предводительством испанского адмирала положил конец османскому господству в Средиземном море. Из Мадрида испанская корона вершила судьбы Италии, Нидерландов и Священной Римской империи — такова была эпоха испанской гегемонии, позднее получившая название #italic Pax Hispanica#!."
 golden_century_events.2.desc.historical_info_adu: "На пике своего могущества во времена Кордовского халифата Аль-Андалус считался господствующей державой западного Средиземноморья. Абд ар-Рахман III, принявший титул халифа в 929 году, и его сын аль-Хакам II правили государством, чьи войска, флот и богатства превосходили силы любого христианского королевства Пиренейского полуострова.\n\nПосле смерти аль-Хакама II власть перешла к его хаджибу и регенту Абу Амиру Мухаммаду ибн Аби Амиру аль-Маафири, прозванному впоследствии аль-Мансур — «Победоносный». Под его командованием кордовские армии совершали разорительные набеги, почти невозбранно опустошая Северную Иберию и наводя ужас на её жителей. Он разграбил такие важные города, как Барселона, Леон и даже Сантьяго-де-Компостела, который его армия захватила в 997 году. Золотые динары Кордовы ходили по всему Средиземноморью, послы халифа гостили при дворах императоров Византии и Священной Римской империи, и некоторое время ни одна западная держава не могла соперничать с Аль-Андалусом ни богатством, ни влиянием."
 golden_century_events.2.a: "Вечный Золотой век!"
 as_long_as_we_remain_at_100_european_dominance_universal_monarchy_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] на протяжении [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! не опускается ниже #Y 100#!, наша держава будет получать бонусы от модификатора «[ShowModifier('universal_monarchy_modifier')]»"
 as_long_as_we_remain_at_100_european_dominance_renewed_faith_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] на протяжении [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! не опускается ниже #Y 100#!, наша держава будет получать бонусы от модификатора «[ShowModifier('renewed_faith_modifier')]»"
 enables_partition_cb_tt: "Доступен [Concept('casus_belli', 'повод для войны')|e] «[ShowCasusBelliName('cb_partition')]» и [Concept('peace_treaty', 'мирный договор')|e] «[ShowPeaceTreatyTypeName('peace_partition')]»"
 unlock_saqaliba_advances_units_building_tt: "Доступно [Concept('advances', 'улучшение')|e] «[ShowAdvanceName('saqaliba_barracks_advance')]» и три эпохи развития пехоты #italic ас-сакалиба аль-джудуд#! — нашего постоянного корпуса воинов-рабов, который мы можем использовать, пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] не опускается ниже #Y 100#!"
 golden_century_events.3.title: "Превосходство в Европе"
 golden_century_events.3.desc.desc_spa: "Наши знамёна вошли в число величайших в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Если раньше наши послы смиренно ожидали аудиенций, то теперь [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'сама', 'сам')] диктует условия, а дворы #TOOLTIP:REGION,italy_region,X #L Италии#!#! и #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,hre,X #L Священной Римской Империи#!#! вынуждены строить свои планы с оглядкой на нас.\n\nПодлинного господства над континентом ещё предстоит достичь, однако теперь никто из наших соперников не в силах отрицать, что на Западе родилась новая великая держава. Нужно реализовать это преимущество, пока оно на нашей стороне."
 golden_century_events.3.desc.desc_adu: "Бурное течение времени когда-то едва не поглотило нас без остатка, но теперь всё изменилось. Сегодня силу #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! признают по всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#! — от #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гибралтарского пролива#!#! до северных перевалов, а [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'добилась', 'добился')] того, чтобы #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! князья взвешивали каждый свой шаг, соизмеряя его с нашим могуществом.\n\nНам ещё только предстоит добраться до вершины, но уже сейчас последователи нашей веры как никогда гордо держатся на Западе. Мы должны продолжать двигаться вперёд, ведь судьба благоволит смелым."
 golden_century_events.3.desc.historical_info_spa: "В первой четверти XVI века Испания с поразительной быстротой превратилась из недавно объединившегося королевства в одну из ведущих держав Европы. Военные кампании Гонсало Фернандеса де Кордовы, по прозвищу #italic «Великий Капитан»#!, позволили отвоевать Неаполь у Франции в 1503–1504 годах, а его дисциплинированная пехота совершила переворот в военном деле.\n\nДипломатия Фердинанда Арагонского и брак Католических королей связали Испанию династическими узами с половиной Европы. К моменту восшествия на престол короля Карла V в 1516 году Испания уже заложила основы своего господства на континенте."
 golden_century_events.3.desc.historical_info_adu: "После падения Кордовского халифата Аль-Андалус дважды избежал завоевания теснившими мусульман христианскими королевствами благодаря помощи берберских держав с юга. Так, Альморавиды разгромили войска Альфонса VI в битве при Саграхасе в 1086 году и на целое поколение остановили Реконкисту. В 1195 году пришедшие им на смену Альмохады нанесли поражение кастильцам при Аларкосе.\n\nЭти династии смогли объединить Аль-Андалус и сохранить его границы, а такие города, как Кордова и Севилья, вновь расцвели как центры просвещенности и торговли, прежде чем христианское наступление возобновилось."
 golden_century_events.3.a: "До величия и процветания рукой подать."
