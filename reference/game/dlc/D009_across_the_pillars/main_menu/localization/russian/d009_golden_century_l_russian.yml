 adu_proclaim_a_fatwa: "Провозгласить фетву"
 golden_century_events.4.title: "Единая вера и культура"
 golden_century_events.4.desc: "Пора нашим наместникам в области [target.GetName] взять инициативу в свои руки и издать указ об унификации. Как уверяют наши советники, движение к единообразию жизненно необходимо, если мы хотим, чтобы в наших землях царили одна вера и одна культура. Молитвенные дома иноверцев будут закрыты, а их дети в грядущие годы их будут воспитываться по нашим обычаям.\n\nРабота предстоит тяжёлая, и последствия её будут ощущаться ещё долго, но народ, объединённый одной верой и одной традицией, гораздо легче держать в узде."
 golden_century_events.4.a: "Это всё во благо веры."
 enforce_conformity_result_tt: "Каждый [Concept('location', 'район')|e] в провинции [target.GetName] получает модификатор «[ShowModifier('agricultural_revolution')]» на #Y 10#! лет"
 explain_enforce_conformity_tt: "Все [Concept('locations', 'районы')|e] в выбранной [Concept('area', 'области')|e] получат [Concept('modifier', 'модификатор')|e] «[ShowModifier('enforce_conformity_modifier')]» на #Y 10#! лет"
 golden_century_events.5.title: "Провозглашение фетвы"
 golden_century_events.5.desc: "[target_ruler.GetName] созывает духовенство, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] готовы наделить правительство авторитетом веры. Какой же вопрос будет вынесен на первый план?\n\nКаков бы ни был указ, верующие не станут ему перечить: решение, подкреплённое именем веры, гораздо весомее любого другого государственного указа."
 golden_century_events.5.desc.historical_info: "#italic Фетва#! — это официальное правовое заключение, вынесенное квалифицированным мусульманским правоведом, #italic муфтием#!, в ответ на вопрос о религиозном праве. В отличие от судебного приговора она не обладала обязательной силой, однако мнение уважаемого учёного имело большой моральный вес, и правители зачастую обращались за фетвой, чтобы придать законность своим действиям. В XV веке османские султаны превратили должность #italic шейх-уль-ислама#!, главного правоведа империи, во влиятельный и постоянно действующий институт, а такие учёные, как Молла Хюсрев и Молла Гюрани, с точки зрения религиозного права одобряли завоевания Мехмета II. На мусульманском Западе магрибский правовед Ахмад аль-Ваншариси вынес знаменитую фетву о том, что мусульмане павшего Аль-Андалуса обязаны покинуть Пиренейский полуостров, а не жить под властью христиан."
 golden_century_events.5.a: "Пусть они освятят наше правление."
 golden_century_events.5.b: "Пусть они благословят наши дела с другими державами."
 golden_century_events.5.c: "Пусть они провозгласят борьбу с неверными."
 golden_century_events.6.title: "Влияние в Европе"
 golden_century_events.6.desc.desc_spa: "Наше государство больше не прозябает на задворках #TOOLTIP:CONTINENT,europe,X #L Европы#!#! — мы вошли в число держав, чьё слово способно изменить судьбу всего континента. [target_ruler.GetName] ведёт наши войска в #TOOLTIP:REGION,italy_region,X #L Италию#!#! на равных с самыми гордыми её династиями, а наши ополчения при [Select_CString(target_ruler.IsFemale, 'ней', 'нём' )] собираются быстрее, чем соперники успевают выставить свои.\n\nНам ещё есть куда расти, но времена, когда соседи могли не обращать на нас внимания, миновали. Пусть узнают, каково это — иметь дело с нами."
 golden_century_events.6.desc.desc_adu: "Верующие собираются под нашими знамёнами с таким рвением, с каким не собирались уже многие поколения. По всей Европе наше имя произносят с настороженным уважением, а [target_ruler.GetName] созывает со всех уголков державы всадников, движимых верой.\n\nДо вершины ещё далеко, но #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! князья более не считают нас пережитком прошлого, с которым можно не считаться. Священная борьба вновь набирает обороты."
 golden_century_events.6.desc.historical_info_spa: "Долгая война за Гранаду, завершившаяся в 1492 году, превратила Кастилию и Арагон в единую военную державу. Католические короли создали постоянные военные формирования и финансируемое короной ополчение при #italic Святой эрмандаде#!, заменив ненадёжное феодальное ополчение войсками, которые корона могла использовать по своему усмотрению в любой момент времени.\n\nЭта закалённая армия, оставшаяся без дела после падения Гранады, вскоре была отправлена на войну на Средиземноморье. Менее чем через десять лет испанская пехота вступила в пределы Италии, заложив основу военных построений, которые на протяжении целого столетия будут господствовать на полях сражений Европы."
 golden_century_events.6.desc.historical_info_adu: "#italic Гузаты#! были добровольцами родом из Северной Африки, которые переправлялись на Пиренейский полуостров ради ведения священной войны в христианском пограничье Аль-Андалуса. Эти отряды воинов веры под предводительством #italic шейха аль-гузат#! были одной из главных сил обороны династии Насридов, правивших Гранадой. Они привлекали бойцов со всего Магриба, стремившихся заслужить духовную награду в борьбе за веру.\n\nНесмотря на свой мятежный нрав и своеволие, гузаты воплощали идеал #italic джихада#! на иберийской границе, а султан, способный сплотить их, получал в своё распоряжение силу религиозного рвения, с которой не мог сравниться ни один наёмник."
 golden_century_events.6.a: "Наше возвышение только начинается."
 as_long_as_we_remain_at_50_european_dominance_european_aspirations_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] на протяжении #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! не опускается ниже #Y 50#!, наша держава будет получать бонусы от модификатора «[ShowModifier('european_aspirations_modifier')]»"
 enables_emergency_conscription_tt: "Доступно действие [Concept('parliament', 'парламента')|e] #Y «Экстренная мобилизация»#!, которое позволяет значительно повысить [Concept('manpower', 'число рекрутов')|e] во время войны"
 as_long_as_we_remain_at_50_european_dominance_holy_struggle_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] на протяжении #TOOLTIP:SITUATION,golden_century,X #L золотого века#!#! не опускается ниже #Y 50#!, наша держава будет получать бонусы от модификатора «[ShowModifier('holy_struggle_modifier')]»"
 enables_muster_the_ghuzat_tt: "Доступно [Concept('action', 'действие')|e] «[ShowGenericActionName('adu_muster_the_ghuzat')]», которое позволяет пополнить наши армии добровольцами из числа верующих со всего #TOOLTIP:RELIGIONGROUP,muslim,X #L исламского#!#! мира"
 adu_muster_the_ghuzat: "Собрать гузатов"
 adu_proclaim_a_fatwa_desc: "Призовём наших богословов вынести фетву и тем самым благословить одну из сторон нашего правления: государственное управление, дипломатию или ведение войн."
 adu_muster_the_ghuzat_desc: "Призовите гузатов — верующие добровольцы прибудут из ближайших #TOOLTIP:RELIGIONGROUP,muslim,X #L исламских#!#! земель, чтобы взяться за оружие на нашей стороне."
 spa_enforce_conformity_desc: "Выберите одну из наших областей в #TOOLTIP:CONTINENT,europe,X #L Европе#!#! и распространите среди её народа нашу веру и культуру: всё подходящее население будет обращено и ассимилировано."
 golden_century_events.7.title: "Гузаты откликаются на призыв"
 golden_century_events.7.desc: "Весть о нашей священной борьбе разносится по землям верующих, и #italic гузаты#! откликаются на зов. [target_ruler.GetName] призывает ревностных добровольцев из ближайших #TOOLTIP:RELIGIONGROUP,muslim,X #L исламских#!#! земель, и те тайно переходят границу, чтобы встать под [Select_CString(target_ruler.IsFemale, 'её', 'его' )] знамёна. Наши ряды пополняют воины, которые не требуют оплаты — они сражаются, чтобы попасть в рай.\n\nПусть неверные трепещут. Наши границы вновь полнятся славными воинами."
 golden_century_events.7.a: "Пусть через служение нам они обретут рай."
 missed_reward_ghuzat_mujahidin_tt: "Если бы у нас действовал [Concept('bureaucracy', 'бюрократический механизм')|e] «[ShowBureaucracyTypeName('diwan_al_jund_bureaucracy')]», [target_ghazi_general.GetName] бы тоже [Select_CString(target_ghazi_general.IsFemale, 'присоединилась', 'присоединился' )] к нам"
 plan_partition_campaign: "Планирование кампании по разделу"
 plan_partition_campaign_desc: "Наши враги слишком усилились, и это нам не по душе. Их попытки укрепить свою власть неизбежно приведут к тому, что они объединятся против нашего народа, поставив под угрозу наше дальнейшее процветание. Мы не можем оставить без ответа столь откровенную демонстрацию силы!"
 selected_country_target_cb_tt: "Мы получим [Concept('casus_belli', 'повод для войны')|e] «[ShowCasusBelliName('cb_partition')]» против указанной [Concept('country', 'державы')|e]. Этот [Concept('casus_belli', 'повод для войны')|e] даёт доступ к [Concept('peace_treaty', 'мирному договору')|e] «[ShowPeaceTreatyTypeName('peace_partition')]»"
 plan_partition_campaign_select_rival_or_enemy: "Выберите [Concept('rival', 'соперника')|e] или [Concept('enemy', 'врага')|e] для разделения"
 no_neighbor_enemies_rivals_available: "@trigger_no!У нас по соседству нет [Concept('rival', 'соперников')|e] или [Concept('enemy', 'врагов')|e], которых можно разделить"
 invoke_ummayad_legacy: "Воззвать к наследию Омейядов"
 invoke_ummayad_legacy_desc: "Наследие Омейядов, некогда правивших из #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#!, по праву принадлежит нам. Выберите соседа, владеющего землями их бывшего халифата, — и мы прибегнем к древнему праву силой вернуть эти земли под наш контроль."
 selected_country_ummayad_cb_tt: "Мы получим [Concept('casus_belli', 'повод для войны')|e] «[ShowCasusBelliName('cb_restore_ummayad_caliphate')]» против указанной [Concept('country', 'державы')|e]"
 invoke_ummayad_legacy_select_country: "Выбор [Concept('country', 'державы')|e], владеющей землями Омейядов"
 invoke_ummayad_legacy_no_country_available: "@trigger_no!Ни одна из соседних [Concept('country', 'держав')|e] не владеет землями Омейядского халифата"
 spa_patronize_golden_century: "Оказать покровительство Золотому веку"
 spa_patronize_golden_century_desc: "Мы оказываем покровительство искусствам и не жалеем средств на создание прекрасного, поддерживая художников, поэтов и архитекторов нашей эпохи. Эти вложения способствуют расцвету культуры наших народов и золотыми буквами вписывают наше имя в анналы истории."
 golden_century_events.8.title: "Покровители Золотого века"
 golden_century_events.8.desc: "Богатство нашего века манит в наши земли лучших мастеров со всей Европы. [target_location.GetName] сегодня — настоящий центр культуры, куда стекаются живописцы и скульпторы, архитекторы и поэты — каждый надеется, что именно ему [target_ruler.GetName] окажет своё благоволение, и что именно он прославится в эту блистательную эпоху.\n\nСтоит нам повелеть — и мастерские заполнятся художниками, готовыми запечатлеть наше величие на века. Произведения искусств, которым мы даруем покровительство сегодня, переживут и договоры, и войны. Когда от наших армий не останется и следа, потомки будут помнить наш век по его богатству и блеску."
 golden_century_events.8.a: "Да восторжествует искусство!"
 target_character_serves_in_court_tt: "[target_character.GetName] становится нашим придворным мастером своего дела"
 artist_appears_in_court_tt: "При нашем дворе появляется искусный [Concept('artist', 'творец')|e]"
 artist_expands_royal_quarters: "Великолепное новое крыло дворца возвышается над королевской резиденцией, а молва о его роскоши разносит нашу славу по дворам Европы"
 artist_drafts_traditional_art: "Наши мастера увековечивают мотивы и формы нашей традиции, передавая их будущим поколениям и обогащая культурное наследие, которое мы оставим после себя."
 artist_furthers_our_technological_understanding_tt: "[target_character.GetShortNameWithNoTooltip] превращает покровительство в открытия, способствуя просвещению [ROOT.GetCountry.Custom('rank_ru_GEN')|l]"
 golden_century_events.9.title: "Изгнание андалусцев из области [target.GetNameWithNoTooltip]"
 golden_century_events.9.desc: "#TOOLTIP:CULTURE,andalusi,X #L Андалусское#!#! население в области [target.GetName] всегда держалось особняком, сохраняя чуждые нам веру и культуру. Они уже давно живут среди нас, и мы вряд ли когда-нибудь сможем склонить их к нашим обычаям.\n\nНаше терпение иссякло. Мы соберём их всех, отвезём в гавани и посадим на корабли, что идут в провинцию [target_province_destination.GetName], где их примут последователи той же веры.\n\nИх дома и поля не будут долго пустовать. Наши люди заселят земли, которые когда-то обрабатывали их отцы, и то, что прежде принадлежало им, перейдёт в более надёжные руки."
 golden_century_events.9.desc.historical_info: "В 1609–1614 годах король Испании Филипп III постановил изгнать морисков — потомков иберийских мусульман, которых столетием ранее принудили принять христианство. Около трёхсот тысяч человек, которых давно подозревали в тайном отступничестве и сношениях с османами и пиратами с Варварийского берега, были изгнаны из своих домов.\n\nБольшинство переселилось в Магриб, однако многие отправились ещё дальше на восток, в земли Османской империи и поселились в Анатолии, Леванте и на Балканах, где были приняты правительством султана. Их исход лишил восток Испании опытных земледельцев и ремесленников, и ряд областей так и не смог полностью восстановиться."
 golden_century_events.9.a: "Их исход — к лучшему."
 spa_edict_expulsion: "Издать указ об изгнании"
 spa_edict_expulsion_desc: "Выберите одну из провинций, которые мы удерживаем, и отправьте местное #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусское#!#! население в изгнание в заморские земли. Оставленными ими дома смогут занять наши поселенцы."
 select_expulsion_no_province: "@trigger_no!У нас нет [Concept('province', 'провинций')|e] со значительной долей андалусского населения"
 select_province_removes_andalusi_tt: "В выбранной [Concept('province', 'провинции')|e] начнётся принудительная [Concept('migration', 'миграция')|e] #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусских#!#! [Concept('pops', 'групп населения')|e]"
 select_province_to_evict_pops_from: "Выберите [Concept('province', 'провинцию')|e], откуда будет изгнано [Concept('pops', 'население')|e]"
 spa_seize_colony: "Захватить колонию"
 spa_seize_colony_desc: "Богатства Нового Света можно обрести не только тяжёлым трудом. Мы выберем нелояльную колонию соперничающей державы, находящуюся в пределах нашей досягаемости, и склоним её отвернуться от далёкой метрополии и перейти под власть нашей короны. Так, одновременно мы обретём богатое владение и наживём себе вечную вражду его прежнего сюзерена."
 select_colonial_subject_to_seize: "Выберите нелояльную [Concept('colony', 'колонию')|e] для захвата"
 no_available_colonial_subjects_to_seize: "@trigger_no!У соперников нет нелояльных колониальных [Concept('subject', 'ленников')|e] в пределах нашей досягаемости"
 selected_subject_receives_offer_to_defect_tt: "Выбранная #TOOLTIP:SUBJECT_TYPE,colonial_nation,X #L колониальная держава#!#! получит предложение стать нашим [Concept('subject', 'ленником')|e]. Если она согласится, это значительно ухудшит наши отношения с её текущим [Concept('overlord', 'сюзереном')|e] и даст ему [Concept('casus_belli', 'повод для войны')|e] за возвращение"
 golden_century_events.10.title: "Предложение верности"
 golden_century_events.10.desc: "Посланцы из #ONCLICK:COUNTRY,[seizing_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[seizing_country.Custom('CL_tt')],X [seizing_country.Custom('CL_GEN')|L]#!#! тайно пробрались в наши гавани с тайным предложением, о котором не следует провозглашать во всеуслышание. Наши далёкие господа [target_overlord.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[target_overlord.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_overlord.Custom('CL_tt')],X [target_overlord.Custom('CL_PREP')|L]#!#! перестали заботиться о нас и больше не желают слышать наших жалоб. [seizing_country.GetNameWithNoTooltip] же готов[seizing_country.Custom('end_fem')] принять нас как своих и подобающе отплатить за верность.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен' )] сделать нелёгкий выбор. Согласиться — значит сменить одного сюзерена на другого и навлечь на себя гнев [target_overlord.Custom('CL_GEN')]; отказаться — значит доказать свою преданность и ещё крепче привязать себя к короне, которой мы и так служим."
 golden_century_events.10.a: "Попытаем счастья под покровительством [seizing_country.Custom('CL_GEN')]."
 golden_century_events.10.a.alt: "Попытаем счастья с ними."
 golden_century_events.10.b: "Нашу преданность не купить."
 adu_integrate_natives: "Интегрировать колониальное поселение"
 adu_integrate_natives_desc: "Вместо того чтобы истреблять местных жителей, мы вступим с ними в переговоры, с их помощью изучим их земли и включим их в состав наших заморских владений."
 adu_integrate_natives_tt: "Мы создадим [Concept('colonial_charter', 'колониальное поселение')|e] в выбранной [Concept('province', 'провинции')|e] и заселим её незанятые [Concept('locations', 'районы')|e], а затем решим, как поступить с местными"
 golden_century_events.11.title: "[target.GetNameWithNoTooltip] и дальше"
 golden_century_events.11.desc: "Нам удалось заключить мир с местными жителями провинции [target.GetName], и благодаря их помощи мы не только нанесли на карту все окрестные земли, но и основали множество колоний в их владениях. Теперь наши советники спорят о том, что делать дальше.\n\nОдни предлагают заселять новые колонии переселенцами с наших основных территорий. Другие считают, что единственная ценность этих колоний — туземцы, которых надо заковать в цепи и отправить работать в наших владениях. Но некоторые осторожные советники предпочли бы оставить местных в покое и позволить нашему новому поселению расти своим чередом."
 golden_century_events.11.a: "Объявить новые волны переселения."
 golden_century_events.11.b: "Переселить их обратно на родину в качестве рабочих."
 golden_century_events.11.c: "Не вмешиваться в развитие провинции."
 all_those_slaves_go_back_home: "#TOOLTIP:POPTYPE,slaves,X #L Рабы#!#!, которые появляются в результате этого [Concept('action', 'действия')|e], будут расселены вокруг нашей [Concept('capital', 'столицы')|e] в провинции [ROOT.GetCountry.GetCapital.GetProvince.GetName]"
 spa_demand_tribute_fleets: "Потребовать отправки флотов с данью"
 spa_demand_tribute_fleets_desc: "Выберем одну из наших верных заморских колоний и велим ей отправить домой свои сокровища. Гружённый серебром и богатствами её рудников и полей, флот с данью отправится в наши порты и пополнит нашу казну по прибытии."
 select_colonial_subject: "Выберите лояльную [Concept('colony', 'колонию')|e]"
 no_loyal_colonial_subject: "@trigger_no!У нас нет лояльных колониальных [Concept('subject', 'ленников')|e]"
 spa_demand_tribute_fleets_tt: "Выбранная лояльная #TOOLTIP:SUBJECT_TYPE,colonial_nation,X #L колониальная держава#!#! получит запрос на отправку кораблей с данью в виде [Concept('gold', 'золота')|e], драгоценных металлов или [Concept('pops', 'людей')|e]"
 adu_build_qadi_office: "Построить палату кади"
 adu_build_qadi_office_desc: "Для подвластных нам держав будет великой честью принять у себя #TOOLTIP:BUILDING_TYPE,qadi_office,X #L палату кади#!#!. Её судья будет вершить священный закон от нашего имени, разрешая споры между подданными и ещё теснее связывая их правителя с нами."
 no_available_colonial_subject: "@trigger_no!У нас нет [Concept('subject', 'ленника')|e], в столице которого ещё нет палаты кади"
 adu_build_qadi_office_tt: "Мы построим #TOOLTIP:BUILDING_TYPE,qadi_office,X #L палату кади#!#! в [Concept('capital', 'столице')|e] выбранного [Concept('subject', 'ленника')|e], где судья будет вершить священный закон и укреплять нашу власть над державой"
 if_we_had_qadi_al_jamaa_bureaucracy_tt: "Если бы у нас действовал [Concept('bureaucracy', 'бюрократический механизм')|e] «[ShowBureaucracyTypeName('qadi_al_jamaa_bureaucracy')]», мы бы также получили [Concept('modifier', 'модификатор')|e] «[ShowModifier('empowered_qadi_al_jamaa_modifier')]»"
 adu_dispatch_gold_caravan: "Отправить караван с золотом"
 adu_dispatch_gold_caravan_desc: "Выберите одного из наших людей и поручите ему возглавить караван, который отправится на юг, через Сахару. Гружённый #TOOLTIP:GOODS,salt,X солью#! и #TOOLTIP:GOODS,cloth,X #L текстилем#!#!, караван обменяет их на #TOOLTIP:GOODS,goods_gold,X #L золото#!#! #TOOLTIP:REGION,sahel_region,X #L Сахеля#!#!, а затем доставит эти богатства домой, чтобы обогатить наши рынки."
 adu_dispatch_gold_caravan_select_leader: "Выбрать главу каравана"
 adu_dispatch_gold_caravan_no_leader: "@trigger_no!У нас нет [Concept('character', 'персонажа')|e], который мог бы возглавить [Concept('expedition', 'путешествие')|e]"
 adu_dispatch_gold_caravan_tt: "Выбранный [Concept('character', 'персонаж')|e] возглавит [Concept('expedition', 'экспедицию')|e] черех Сахару на юг, чтобы продать наши товары и привезти вырученное #TOOLTIP:GOODS,goods_gold,X #L золото#!#! #TOOLTIP:REGION,sahel_region,X #L Сахеля#!#! на наши рынки."
 nick_the_golden: "Золотая Гора"
 golden_century_events.12.title: "Дань [target_country.Custom('CL_GEN')]"
 golden_century_events.12.desc: "Наша верная колония [target_country.GetName] процветает под нашей защитой, и теперь настало время получить причитающуюся нам дань. Корабли в её гаванях уже готовятся к отплытию, и [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'должна', 'должен' )] решить, что они доставят на родину. Мы можем потребовать регулярных денежных выплат, чтобы пополнить казну, либо запросить серебро и золото из местных рудников, которое обогатит рынки. Или можно запросить главное богатство колонии — людей, что отправятся через океан и увеличат население наших провинций."
 golden_century_events.12.a: "Потребовать ежегодную дань золотом."
 golden_century_events.12.b: "Присвоить богатства их серебряных и золотых рудников."
 golden_century_events.12.c: "Переправим их людей для заселения наших земель."
 spa_issue_royal_decree: "Издание Cédula de Población"
 spa_issue_royal_decree_desc: "Выберите область в наших заморских владениях и откройте её гавани для колонистов. Согласно королевскому указу, семьи из государств нашей веры пересекут океан, чтобы начать новую жизнь на наших землях, и на пустующих территориях закипит работа."
 select_colonial_area_to_direct_migrants: "Выберите [Concept('area', 'область')|e], в которую отправятся наши поселенцы"
 no_available_colonial_area: "@trigger_no!У нас нет подходящей [Concept('area', 'области')|e] для отправки поселенцев"
 spa_issue_royal_decree_tt: "Мы откроем выбранную [Concept('area', 'область')|e] для миграции. В результате её [Concept('locations', 'районы')|e] получат длительный модификатор, благодаря которому туда будут охотно прибывать поселенцы из держав общей с нами веры"
 golden_century_events.13.title: "[target_area.GetNameWithNoTooltip] приветствует поселенцев"
 golden_century_events.13.desc: "Усилия по развитию наших колониальных владений принесли свои плоды. Изданный нами указ о поощрении поселенцев в области [target_area.GetName] нашёл отклик далеко за пределами наших гаваней, привлекая семьи даже из такой далёкой провинции, как [target_origin_province_1.GetName].\n\nСтоит отметить, что они прибывают вовсе не с пустыми руками: кто-то привозит с собой необходимые инструменты из домашних мастерских, кто-то — свои знания и опыт в ведении совместного быта, но все они так или иначе готовы усердно трудиться, чтобы начать новую жизнь в нашем подданстве. Кого бы ни привела к нам жажда перемен, [target_ruler.GetName] обеспечит их всем необходимым, ибо именно от этих людей зависит будущее наших колоний."
 golden_century_events.13.a: "Добро пожаловать!"
 migrants_bring_cultural_understanding_tt: "Поселенцы разных культур дают нашим колониальным районам модификатор «[ShowModifier('harmonious_understanding_modifier')]» на #Y 5#! лет"
 migrants_bring_tool_expertise_tt: "Опытные поселенцы-ремесленники дают нашим колониальным районам модификатор «[ShowModifier('new_tooling_techniques_modifier')]» на #Y 5#! лет"
 shared_prosperity_event_13_tt: "Новые хозяйства дают нашим колониальным районам модификатор «[ShowModifier('shared_prosperity_modifier')]» на #Y 5#! лет"
 golden_century_events.13.desc.historical_info: "#italic Cédula de población#! (дословно — «указ о заселении») представлял собой королевскую хартию, с помощью которой испанская корона стремилась заселить малонаселённые земли своей империи. Колонистам, готовым пересечь океан, обещали земельные наделы, освобождение от налогов и пошлин, а также статус верных подданных — всё ради того, чтобы далёкие территории на карте превратились в фермы, города и порты, приносящие доход и способные постоять за себя.\n\nНаиболее известным стал #italic Real Cédula de Población#!, дарованный Карлом III в 1783 году острову Тринидад — объекту давних, но тщетных притязаний Испании, прежде остававшемуся почти безлюдным. Он открывал двери для католических переселенцев из-за рубежа и наделял их землёй пропорционально размеру каждой семьи и числу привезённых ими невольников. Благодаря этому почти пустующая застава всего за одно поколение превратилась в многолюдную колонию с плантациями. Этот указ остаётся самым смелым проявлением стремления Бурбонов заставить забытые окраины империи наконец-то приносить доход."
 golden_century_events.14.title: "В тени [gc_hegemon.Custom('CL_GEN')]"
 golden_century_events.14.desc: "[GetSituationByKey('battle_for_the_strait').GetName] окончена, и [gc_hegemon.GetName] выбрал[gc_hegemon.Custom('end_assya')] из неё неоспоримым победителем. Их армии закалены в боях, казна полна золота, а амбиции велики как никогда, ибо теперь они обращают взор за пределы своих границ и открыто претендуют на мировое господство. Эти планы угрожают целому ряду держав, и мы в их числе.\n\nВпрочем, появление нового гегемона едва ли останется без ответа. Встревоженные правители уже начинают формировать коалицию, и чем настойчивее [gc_hegemon.GetNameWithNoTooltip] буд[SCOPE.sCountry('actor').Custom('end_etut')] расширять своё влияние, тем более жёсткое сопротивление они будут оказывать. Грядущее столетие покажет, удастся ли нам сдержать столь могущественную державу, или же она окончательно изменит баланс сил в мире."
 golden_century_events.14.a: "Мы не станем противостоять им в одиночку."
 golden_century_events.15.title: "Восхождение [gc_hegemon.Custom('CL_GEN')]"
 golden_century_events.15.desc: "Нам стало известно, что [GetSituationByKey('battle_for_the_strait').GetName|l] завершилась, и [gc_hegemon.GetName] одержал[gc_hegemon.Custom('end_fem')] в ней решительную победу, став одной из самых могущественных держав нашей эпохи. Поскольку нас связывают различные клятвы и обязательства, этот триумф в некоторой степени и наша заслуга, а значит, у нас тоже есть шанс подняться на волне [gc_hegemon.GetAdjectiveWithNoTooltip|l]ого величия.\n\nОднако мы разделяем не только славу, но и сопряжённые с ней риски: по мере того, как новый гегемон наращивает своё влияние, завистливые державы объединяют силы и пытаются ему сопротивляться. Будучи союзником [gc_hegemon.Custom('CL_GEN')], мы также должны быть готовы испытать на себе гнев несогласных. Лишь время покажет, возвысит ли нас эта связь или же станет нашей погибелью."
 golden_century_events.15.a: "Мы будем пристально наблюдать за их возвышением."
 golden_century_events.16.title: "Возвышение новой державы"
 golden_century_events.16.desc: "[GetSituationByKey('battle_for_the_strait').GetName] завершилась, и [gc_hegemon.GetName] одержал[gc_hegemon.Custom('end_fem')] в ней решительную победу. Очевидно, они не станут останавливаются на достигнутом и непременно попытаются расширить своё влияние. И хотя в данный момент мы им не враги, стоит учитывать, что столь могущественные державы неизбежно подчиняют соседние страны своей воле.\n\nЕсли мы хотим избежать такой участи, то нам нужно сделать выбор. Мы можем присоединиться к коалиции, чтобы дать отпор гегемону, или же попытаться заслужить его благосклонность. Каким ни было наше решение, одно ясно наверняка: грядущее столетие оставит свой след в нашей истории."
 golden_century_events.16.a: "Мы будем тщательно продумывать наш курс."
 gc_grand_alliance_leader_tt: "Мы возглавляем [GetInternationalOrganizationType('grand_alliance').GetName|l] против [gc_hegemon.Custom('CL_GEN')]. Чем более явно гегемон [Concept('gc_european_dominance', 'доминирует в Европе')|e] и в [Concept('gc_colonial_dominance', 'колониях')|e], тем больше бонусов [Concept('members', 'участники')|e] получают от [Concept('modifier', 'модификаторов')|e] своего [Concept('international_organization', 'международного объединения')|e]"
 gc_grand_alliance_member_tt: "Любой, кто опасается растущего влияния [gc_hegemon.Custom('CL_GEN')], может вступить в [GetInternationalOrganizationType('grand_alliance').GetName|l] против этой державы. Чем более явно гегемон [Concept('gc_european_dominance', 'доминирует в Европе')|e] и в [Concept('gc_colonial_dominance', 'колониях')|e], тем больше бонусов [Concept('members', 'участники')|e] получают от [Concept('modifier', 'модификаторов')|e] своего [Concept('international_organization', 'международного объединения')|e]"
 gc_grand_alliance_prospect_tt: "Если [gc_hegemon.GetName] начн[gc_hegemon.Custom('end_youtut')] угрожать нашим интересам, мы можем вступить в [GetInternationalOrganizationType('grand_alliance').GetName|l] против этой державы. Чем более явно гегемон [Concept('gc_european_dominance', 'доминирует в Европе')|e] и в [Concept('gc_colonial_dominance', 'колониях')|e], тем больше бонусов [Concept('members', 'участники')|e] получают от [Concept('modifier', 'модификаторов')|e] своего [Concept('international_organization', 'международного объединения')|e]"
 gc_curb_dominance_peace_tt: "Одержав победу над [gc_hegemon.Custom('CL_INST')], мы сможем заключить [Concept('peace_treaty', 'мирный договор')|e], который ослабит их [Concept('gc_european_dominance', 'доминирование в Европе')|e] и в [Concept('gc_colonial_dominance', 'колониях')|e] на #Y 25#!"
 gc_dominance_growth_observer_tt: "[gc_hegemon.GetName] стремительно усилива[gc_hegemon.Custom('end_etyut')] своё [Concept('gc_european_dominance', 'доминирование в Европе')|e] и в [Concept('gc_colonial_dominance', 'колониях')|e] за счёт завоеваний, освоения новых земель и грамотного управления. С каждым достижением эта держава лишь укрепляет своё господство в этой эпохе"
 gc_flashpoints_observer_tt: "В ходе этой [Concept('situation', 'ситуации')|e] [gc_hegemon.Custom('end_predlog_vvo')] [ROOT.GetCountry.Custom('CL_PREP')] могут случится [Concept('flashpoint', 'переломные моменты')|e] "
 gc_hegemon_backer_tt: "Мы тесно связаны [gc_hegemon.Custom('end_predlog_sso')] [ROOT.GetCountry.Custom('CL_INST')], и потому пользуемся благами их триумфа. Однако против этой державы собирается [GetInternationalOrganizationType('grand_alliance').GetName|l], а значит, вскоре мы можем быть втянуты в их войну"
 io_opinion_grand_alliance: "Состоят в великом союзе"
 grand_alliance: "Великий союз"
 grand_alliance_desc: "Коалиция держав, которых объединяет страх перед набирающим силу колоссом. Чем больше у него влияния в Европе и в Новом Свете, тем больше он закрепляет своё господство в текущей эпохе и тем крепче и решительнее становится союз. Главой союза становится его самый сильный участник, а присоединиться к нему может любая держава, которая опасается колосса и желает дать ему отпор."
 gc_legend_colossus: "Колосс"
 gc_legend_colossus_desc: "Великая держава, чьё растущее [gc_european_dominance|e] или [gc_colonial_dominance|e] сплотило $grand_alliance$ против неё."
 gc_legend_grand_alliance: "Великий союз"
 gc_grand_alliance_european_scaling: "[Concept('gc_european_dominance', 'Доминирование')|e] нашего противника в Европе в ситуации «[GetSituationByKey('golden_century').GetName]»"
 gc_grand_alliance_colonial_scaling: "[Concept('gc_colonial_dominance', 'Доминирование')|e] нашего противника в колониях в ситуации «[GetSituationByKey('golden_century').GetName]»"
 grand_alliance_hostility: "Ведёт войну, является врагом или соперником колосса"
 grand_alliance_no_recent_leave_tt: "Мы не покидали это [Concept('international_organization', 'международное объединение')|e] в течение последних #Y 5#! лет"
 grand_alliance_leader_cannot_leave_tt: "Мы не являемся [Concept('international_organization_leader_short', 'лидером')|e] международного объединения «[GetInternationalOrganizationType('grand_alliance').GetName]»"
 grand_alliance_reputable_leader: "Положение нашего лидера в противостоянии с колоссом"
 ga_fear_of_dominance: "$ga_dominance_pressure$"
 ga_dominance_tipping_point: "[Concept('gc_colonial_dominance', 'Колониальное доминирование')|e] или [Concept('gc_european_dominance', 'европейское доминирование')|e] выше #Y 50#!"
 ga_colossus_on_our_border: "Колосс граничит с нашими землями"
 ga_eu_25_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +10%#! к обороне и #Y +1#! к дипломатической репутации"
 ga_eu_50_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза теряет #Y 0,05#! ед. усталости от войны и получает #Y +0,1#! дипломатов ежемесячно"
 ga_eu_75_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +10%#! к эффективности военного счёта и #Y +20%#! к размеру гарнизона"
 ga_eu_100_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +10%#! к числу рекрутов и #Y +5%#! к дисциплине"
 ga_col_25_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +33%#! к развитию шпионской сети и #Y +20%#! к скорости строительства кораблей"
 ga_col_50_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +50%#! эффективности блокады и #Y +10%#! к мощи лёгких кораблей"
 ga_col_75_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +10%#! к боевому духу флота и #Y +10%#! к мореходной дистанции"
 ga_col_100_bonus_tt: "Каждый [Concept('member', 'участник')|e] великого союза получает #Y +5%#! к наносимому и #Y -5%#! к получаемому морскому урону"
 ga_declare_war_on_hegemon: "Призыв союза к войне"
 ga_declare_war_on_hegemon_desc: "Колосса невозможно укротить мирным путём, а потому его нужно силой заставить уступить своё огромное влияние. Будучи лидером великого союза, мы можем призвать всех участников на войну против колосса, чтобы раз и навсегда решить вопрос о его мировом господстве."
 ga_only_leader_may_declare_tt: "Только та держава, которая [Concept('leader', 'возглавляет')|e] [GetInternationalOrganizationType('grand_alliance').GetName|l], может призвать его на войну"
 ga_dominance_threshold_tt: "Доминирование колосса в [Concept('gc_european_dominance', 'Европе')|e] или в [Concept('gc_colonial_dominance', 'колониях')|e] превышает #Y 25#!"
 ga_dominance_bar_current_european_tt: "Текущее [gc_european_dominance|e] Колосса: #Y [FixedPointToInt(Country.GetVariable('gc_european_dominance'))]%#!"
 ga_dominance_bar_current_colonial_tt: "Текущее значение [gc_colonial_dominance|e] Колосса: #Y [FixedPointToInt(Country.GetVariable('gc_colonial_dominance'))]%#!"
 ga_alliance_war_cooldown_tt: "В последние #Y 20#! лет [GetInternationalOrganizationType('grand_alliance').GetName] не призывал к войне"
 ga_will_declare_war_on_target_tt: "[GetInternationalOrganizationType('grand_alliance').GetName] объявит войну своему противнику"
 ga_alliance_strength_advantage: "Соотношение сил армий союза и колосса"
 ga_alliance_economic_advantage: "Соотношение богатства союза и колосса"
 ga_dominance_pressure: "Уровень могущества колосса"
 diplomatic_status_grand_alliance_name: "Великий союз"
 diplomatic_status_grand_alliance_tooltip: "#T Великий союз#!\nЭта держава вступила в [GetInternationalOrganizationType('grand_alliance').GetName|l] против следующих [Concept('countries', 'держав')|e]"
 grand_alliance_list_who_tt: "$WHO$ и $LIST$ вместе состоят в объединении «[GetInternationalOrganizationType('grand_alliance').GetName]»"
 grand_alliance_leader: "$grand_alliance$ лидер"
 grand_alliance_leader_desc: "Сильнейший член $grand_alliance$, определяемый заново каждый год. Лидерство может перейти к другому члену, если удача переменится."
 spa_increase_capital_market_demands: "Увеличение спроса на столичном рынке"
 spa_increase_capital_market_demands_desc: "Благодаря накопленным богатствам наша столица стала объектом зависти для всего мира. Выберите любой ходовой товар на её рынке и объявите его обязательным элементом придворного обихода. Рост спроса принесёт огромную прибыль купцам, поставляющим этот товар к нашим берегам."
 gc_increase_market_demand_select_good: "Выберите любимый товар"
 gc_increase_market_demand_no_good: "@trigger_no!На нашем [Concept('capital', 'столичном')|e] рынке нет подходящего товара"
 gc_increase_market_demand_tt: "Мы выберем один из товаров на нашем [Concept('capital', 'столичном')|e] рынке и начнём целенаправленно подогревать спрос на него, тем самым повышая его стоимость и принося значительную прибыль каждому, кто доставляет его в нашу державу"
 golden_century_events.22.title: "Придворная мода"
 golden_century_events.22.desc: "Золотой век принёс с собой огромные богатства, а вместе с ними выросли и запросы столичных элит. Теперь аристократы, священники и состоятельные купцы города [ROOT.GetCapital.GetName] неустанно соревнуются в роскоши, а их прислуги прочёсывают рынки в поисках такого товара, как [target_good.GetName|l].\n\n[target_ruler.GetName] может последовать этой моде и привить двору страсть к этому популярному товару, дабы спрос на него в нашей столице вырос до неприлично высокого уровня. Тогда торговцы, которые доставляют его в нашу державу, смогут заметно разбогатеть, а за счёт пошлин и внутренней торговли также пополнится и наша казна."
 golden_century_events.22.a: "Позволим двору диктовать моду."
 gc_increase_market_demand_result_tt: "Спрос на товар «[target_good.GetName]» на рынке города [ROOT.GetCapital.GetName] увеличится на следующие #Y 10#! лет, что повысит его стоимость и принесёт значительную прибыль каждому, кто его продаёт"
 adu_charter_saharan_trade_house: "Учреждение торгового дома в Сахаре"
 adu_charter_saharan_trade_house_desc: "Золотые пути Сахары — основа нашего процветания. Выберите один из рыночных центров королевства и учредите там великий Сахарский торговый дом. Новое предприятие объединит под своим началом караванную торговлю и обеспечит приток богатств пустыни в нашу казну."
 adu_charter_saharan_trade_house_select_market: "Выберите рыночный центр"
 adu_charter_saharan_trade_house_no_market: "@trigger_no!У нас нет подходящего [Concept('market_center', 'рыночного центра')|e] для учреждения Сахарского торгового дома"
 adu_charter_saharan_trade_house_tt: "Мы создадим в выбранном [Concept('market_center', 'рыночном центре')|e] [ShowBuildingTypeName('saharan_trade_house')], который представляет собой крупный узел караванной торговли"
 golden_century_events.23.title: "[ShowBuildingTypeNameWithNoTooltip('saharan_trade_house')]"
 golden_century_events.23.desc: "В местах пересечения караванных путей можно заработать несметные богатства, торгуя #TOOLTIP:GOODS,salt,X #L солью#!#!, #TOOLTIP:GOODS,goods_gold,X $tt_op_L$золотом$tt_cl_2$ и #TOOLTIP:GOODS,cloth,X #L текстилем#!#!. Чтобы взять эту торговлю под свой контроль, мы учредим в [target.Custom('LR_PREP')|l] [target.GetName] торговый дом, чьи крупные склады и счётные палаты будут перенаправлять богатства пустынных караванов прямиком в #L [actor.GetAdjective|l]ую#! казну.\n\nКупцы со всего #TOOLTIP:REGION,sahel_region,X #L Сахеля#!#! и #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! будут собираться под его крышей, принося нам прибыль и наполняя наши рынки товарами из обоих регионов."
 golden_century_events.23.a: "Мы примем караваны."
 golden_century_events.17.title: "Ордена в [ShowSituationNameWithNoTooltip('golden_century')]"
 golden_century_events.17.desc: "Наш век настал, и он мало похож на тот, для которого создавались военные ордена.\n\nРабота века вершится в [ShowAreaName('flanders_area')], в [ShowLocationName('milano')] и за океаном: флоты, банки и #italic терсио#!, оплаченные серебром. Ордена держат замки, обращённые к границе, которой не существует уже на памяти живущих, а их братья, всё ещё лучшая тяжёлая конница [ShowReligionAdjective('catholic')] мира, проводят свои дни, собирая ренту и споря о старшинстве.\n\nОни — достояние, которым [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] перестала пользоваться."
 golden_century_events.17.a: "Дать им работу по плечу нашему [ROOT.GetCountry.GetFlavorRank]."
 golden_century_events.17.b: "Отправить их на почётный покой с пенсией."
 golden_century_events.17.c: "Оставить их при своей ренте."
 gc_orders_given_new_purpose_tt: "$bfts_orders_given_new_purpose_tt$"
 golden_century_events.18.title: "Праздные копья"
 golden_century_events.18.desc: "Две комтурии сцепились из-за межи, мельницы и двухсотлетнего оскорбления, и дело зашло дальше, чем кто-либо предполагал. С обеих сторон есть убитые, и оба магистра написали нам первыми, каждый уверенный в своей правоте.\n\nВот чем занимается военный орден, когда нет войны. Братья по-прежнему вооружены, по-прежнему не подсудны обычным судам и по-прежнему не отвечают ни перед кем в нашем [ROOT.GetCountry.GetFlavorRank], кроме нас самих."
 golden_century_events.18.a: "Наказать обоих, публично."
 golden_century_events.18.b: "Пусть разбираются сами."
 golden_century_events.19.title: "Заморские ордена"
 golden_century_events.19.desc: "От магистров пришло прошение, и весьма дерзкое. Они желают основать комтурии в Индиях, продолжить там тот же труд, что некогда вели на мавританской границе, и удерживать новые рубежи так же, как удерживали старые.\n\nЭто либо спасение учреждения, исчерпавшего свою границу, либо вывоз за море проблемы, которую мы не решили дома."
 golden_century_events.19.desc_expected: "Мы велели им обратить взор на океан, и они обратили. Магистры восприняли это наставление с большим усердием, чем мы, пожалуй, рассчитывали.\n\nУ них есть капелланы на флотах, братья в портах, а теперь и официальное прошение об учреждении комтурий в Индиях, составленное законниками, которые явно трудились над ним не один день. Ордена нашли свою новую границу в тот же миг, как мы на неё указали."
 golden_century_events.19.a: "Даровать им право на Индии."
 golden_century_events.19.b: "Индии принадлежат [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], а не [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]."
 golden_century_events.24.title: "Признание в Европе"
 golden_century_events.24.desc.desc_spa: "Правители по ту сторону Пиренеев долгое время решали судьбу #TOOLTIP:CONTINENT,europe,X $tt_op_L$Европы$tt_cl_2$, никак не считаясь с державами к югу от хребта, однако времена меняются. Там, где прежде наших послов заставляли часами ждать приёма, теперь учтиво открывают перед ними двери и усаживают их на уютных креслах. Своим грамотным руководством [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'добилась', 'добился' )] того, что ныне о браках и дипломатических делах [ROOT.GetCountry.Custom('rank_ru_GEN')|l] знают в каждой уважающей себя канцелярии.\n\nНас ещё не боятся, но уже замечают и признают, а это первый шаг на пути к становлению великой державой. Пусть старые монархии наслаждаются последними мгновениями своего величия, ибо господствовать им осталось совсем недолго."
 golden_century_events.24.desc.desc_adu: "Когда-то #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! князья самоуверенно списали нас со счетов, а теперь их послы обивают пороги нашего двора, принося дары, осыпая нас комплиментами и внимательно прислушиваясь к тому, что говорит [target_ruler.GetName]. Держава, которую они однажды похоронили, ныне живёт и здравствует.\n\nМы ещё не достигли господства, но уже вернули себе место за столом, который раньше возглавляли. Правоверные вновь пришли в #TOOLTIP:CONTINENT,europe,X #L Европу#!#!, но на этот раз мы намерены остаться здесь навсегда."
 golden_century_events.24.desc.historical_info_spa: "Уния Кастилии и Арагона заявила о себе в Европе не столько звоном оружия, сколько чередой брачных союзов. Чуть более чем за десять лет Фердинанд и Изабелла породнились с правящими домами Португалии, габсбургской Бургундии и тюдоровской Англии. Заключённые в 1496 и 1497 годах двойные браки вплели Испанию в династическую сеть половины континента. Задолго до того, как европейцы начали трепетать перед знаменитыми испанскими терциями (#italic tercios#!), канцелярии всех держав уже привыкли учитывать интересы испанской короны в любых своих расчётах."
 golden_century_events.24.desc.historical_info_adu: "В IX веке, при правлении Абд аль-Рахмана II, Кордовский эмират вошёл в число великих держав того времени. В 840 году византийский император Феофил направил туда посольство, стремясь заключить союз против Аббасидов, и кордовский двор ответил тем же. Эмират начал обмениваться посланниками и дарами с империями, которые прежде считали Аль-Андалус не более чем далёкой мятежной провинцией."
 golden_century_events.24.a: "Мы прибыли."
 as_long_as_we_remain_at_25_european_dominance_rising_iberian_power_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 25#!, наша держава будет получать бонусы от модификатора «[ShowModifier('rising_iberian_power_modifier')]»"
 as_long_as_we_remain_at_25_european_dominance_restoration_of_al_andalus_modifier_tt: "Пока наше [Concept('gc_european_dominance', 'доминирование в Европе')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 25#!, наша держава будет получать бонусы от модификатора «[ShowModifier('restoration_of_al_andalus_modifier')]»"
 enables_edict_of_expulsion_action_tt: "Открывает [Concept('action', 'действие')|e] «[ShowGenericActionName('spa_edict_expulsion')]», которое позволяет изгнать из державы верующих неприемлемой религии"
 enables_restore_caliphate_cb_taifa_tt: "Открывает [Concept('casus_belli', 'повод для войны')|e] «[ShowCasusBelliName('cb_restore_ummayad_caliphate')]» и тип [Concept('subject', 'ленника')|e] «Тайфа»"
 golden_century_events.25.title: "Присутствие за краем света"
 golden_century_events.25.desc.desc_spa: "Первые корабли наконец-то вернулись домой, доверху гружёные сахаром, красителями и разными экзотическими товарами, которые вызывают большой интерес среди жителей города [ROOT.GetCapital.GetName]. Каждое судно на причале встречает дюжина купцов, охочих поскорее заключить выгодные торговые договоры. Своими мудрыми решениями [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'привлекла', 'привлёк' )] [ROOT.GetCountry.Custom('endrank_predlog_vvo')] [ROOT.GetCountry.Custom('rank_ru_ACC')|l] огромные богатства из далёких земель, которые наши подданные едва ли смогут найти на карте.\n\nВпрочем, это лишь малая доля по сравнению с тем, что мы можем заработать в будущем. Торговцы, знающие толк в перспективных предприятиях лучше любого адмирала, уже предусмотрительно начинают строить новые склады."
 golden_century_events.25.desc.desc_adu: "Караваны возвращаются на север. Старые дороги через пустыни вновь оживают, за счёт чего соль отправляется на юг в обмен на #TOOLTIP:REGION,sahel_region,X #L сахельское#!#! золото, а рынки нашей державы растут и процветают, принимая у себя всё больше купцов и караванщиков.\n\nКогда-то наши предки тоже обладали этими богатствами, но они их упустили. [target_ruler.GetName] же [Select_CString(target_ruler.IsFemale, 'намерена', 'намерен' )] сохранить и приумножить их: теперь оазисы и дороги тщательно охраняются, а каждый груз золота, перевозимый через пустыню, обязательно проходит через наши рынки и тем самым пополняет нашу казну."
 golden_century_events.25.desc.historical_info_spa: "Уже через десять лет после высадки Колумба испанская корона взяла судоходство в океане под свой надзор. Основанная в 1503 году в Севилье Каса-де-Контратасьон выдавала разрешение каждому кораблю, регистрировала все грузы и облагала пошлиной товары, прибывавшие из Нового Света. Таким образом разрозненные экспедиции превратились в слаженное государственное предприятие ещё до того, как сами колонии обрели сколь-нибудь значимый вес."
 golden_century_events.25.desc.historical_info_adu: "Богатства Западного Судана шли к Средиземноморью через такие пустынные порты, как Сиджильмаса — именно там снаряжались и облагались пошлиной караваны, пересекавшие Сахару. Захватив в середине XI века Сиджильмасу и Аудагост, Альморавиды подчинили себе оба конца западного золотого пути, и золото Сахеля оказалось сосредоточено под властью одной династии."
 golden_century_events.25.a: "Богатства ждут за горизонтом."
 as_long_as_we_remain_at_25_colonial_dominance_market_dominance_modifier_tt: "Пока наше [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 25#!, наша держава будет получать бонусы от модификатора «[ShowModifier('market_dominance_modifier')]»"
 as_long_as_we_remain_at_25_colonial_dominance_wealth_sahel_modifier_tt: "Пока наше [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 25#!, наша держава будет получать бонусы от модификатора «[ShowModifier('wealth_sahel_modifier')]»"
 enables_increase_capital_market_demands_action_tt: "Открывает [Concept('action', 'действие')|e] «[ShowGenericActionName('spa_increase_capital_market_demands')]», которое позволяет привлекать выбранные [Concept('goods', 'товары')|e] на наш столичный [Concept('market', 'рынок')|e]"
 enables_charter_saharan_trade_house_action_tt: "Открывает [Concept('action', 'действие')|e] «[ShowGenericActionName('adu_charter_saharan_trade_house')]», которое позволяет создать в одном из наших [Concept('market_center', 'рыночных центров')|e] крупный узел караванной торговли"
 golden_century_events.26.title: "Влияние за краем света"
 golden_century_events.26.desc.desc_spa: "Тот морской путь, которым некогда ходили лишь авантюристы, ныне также используют и обычные поселенцы, которые отбывают на дальние берега вместе с нашими солдатами. Там они обустраивают свои хозяйства, возводят церкви и рожают детей, которые, вероятно, останутся в своём новом доме и уже никогда не увидят прекрасный город [ROOT.GetCapital.GetName] своими глазами. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'довольна', 'доволен' )] своей работой, ведь теперь заморские территории принадлежат нам не только на бумаге, но и на деле.\n\nЛюбой может оспорить наши границы, когда они представляют собой лишь рисунки на карте. Если же на этих землях живут тысячи семей, то эти границы внезапно обретают реальную силу. Посему мы должны всячески содействовать поселенцам, поскольку именно они придают легитимность нашим колониальным притязаниям."
 golden_century_events.26.desc.desc_adu: "Золотой путь в корне преобразил наше общество: караваны отбывают и возвращаются строго по расписанию, а судьи в городах-оазисах незамедлительно решают любые споры между купцами, благодаря чему столичные счётные дома могут с уверенностью строить планы, не переживая о перебоях и задержках.\n\nКогда богатство приходит однажды — это удача. Если же оно приходит каждый год — это показатель грамотного руководства. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'сделала', 'сделал' )] невозможное, превратив пустыню в наше второе море, в котором ходят только наши корабли."
 golden_century_events.26.desc.historical_info_spa: "Переселение испанцев в Новый Свет требовало обязательного разрешения властей. Потоки колонистов шли через Севилью; те, кто желал пересечь океан, получали от короны земельные наделы и налоговые льготы. С помощью особых указов, #italic cédulas de población#!, корона превратила завоевание в планомерное заселение, и к середине XVI века океан пересекли десятки тысяч кастильцев."
 golden_century_events.26.desc.historical_info_adu: "Из золота Сахеля чеканились монеты на всём мусульманском Западе. Динар Альморавидов из сахарского золота пользовался таким доверием, что христианские королевства Иберии начали открыто копировать его. Их #italic мараведи#! получил и весовой стандарт, и своё название от #italic мурабитунов#!, чеканивших оригинал."
 golden_century_events.26.a: "Приумножим наши богатства."
 as_long_as_we_remain_at_50_colonial_dominance_migratory_waves_modifier_tt: "Пока наше [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 50#!, наша держава будет получать бонусы от модификатора «[ShowModifier('migratory_waves_modifier')]»"
 as_long_as_we_remain_at_50_colonial_dominance_golden_road_modifier_tt: "Пока наше [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 50#!, наша держава будет получать бонусы от модификатора «[ShowModifier('golden_road_modifier')]»"
 enables_issue_royal_decree_action_tt: "Открывает [Concept('action', 'действие')|e] «[ShowGenericActionName('spa_issue_royal_decree')]», которое позволяет заселять наши удалённые земли посредством королевского указа"
 enables_gold_caravan_expedition_action_tt: "Открывает [Concept('action', 'действие')|e] «[ShowGenericActionName('adu_dispatch_gold_caravan')]», которое позволяет отправить караван на юг за #TOOLTIP:REGION,sahel_region,X #L сахельским#!#! золотом"
 golden_century_events.27.title: "Господство за краем света"
 golden_century_events.27.desc.desc_spa: "Наши удалённые владения наконец заговорили на нашем языке. Тамошние города выстроены по нашим лекалам, дворы придерживаются наших законов, а порты по первому слову нагружают корабли товарами и данью, которые отправляются прямиком на родину. Те земли, что ещё недавно были совсем не освоены, теперь всё больше начинают походить на #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!, и [target_ruler.GetName] вполне справедливо видит в этом свою заслугу.\n\nБольшие расстояния — давний враг любой империи — уже не являются для нас таким препятствием, как раньше. Когда далёкие колонии начинают исповедовать нашу веру, судить по нашим законам и вносить свою долю в казну, они перестают быть чужими землями и превращаются в новый дом вдали от дома."
 golden_century_events.27.desc.desc_adu: "Караваны несут с собой веру, а за верой следуют и законы. В городах, о которых наши предки знали лишь заочно, молитвы теперь произносятся на нашем языке, а судьи заседают с нашего одобрения. При этом правители из далёких земель прибывают к нам в поисках признания, лишний раз доказывая, что нам удалось верой завоевать то, что мы веками не могли покорить мечом.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'добилась', 'добился' )] того, что #italic дават#! стал одним из главных инструментов государства наряду с армией — правда, гораздо более дешёвым, поскольку верующие готовы задаром отстаивать свои священные убеждения."
 golden_century_events.27.desc.historical_info_spa: "К середине XVI века Новый Свет перестал быть просто захваченной территорией и перешёл под власть короны. Вице-королевства Новая Испания и Перу, созданные в 1535 и 1542 годах, позволили Кастилии учредить суды, советы и епископские кафедры за океаном, а гружёные серебром торговые суда, прибывавшие в Севилью каждый год, превратили эти далёкие земли в надёжный источник богатства для короны."
 golden_century_events.27.desc.historical_info_adu: "Ислам пересёк Сахару вместе с купеческими расчётными книгами задолго до появления там первых армий. Новая вера быстро укоренилась в торговых городах вдоль караванных путей Сахеля. Местные правители, например в государстве Такрур, приняли её ещё в XI веке. Вслед за новой религией в Сахеле появились мусульманские богословы и судьи, что приобщило эти богатые золотом земли к правовой и культурной системе мусульманского Запада."
 golden_century_events.27.a: "Подчиним их нашему закону и духу."
 as_long_as_we_remain_at_75_colonial_dominance_elevated_cultural_identity_modifier_tt: "Пока наше [Concept('gc_colonial_dominance', 'доминирование в колониях')|e] в ситуации «[GetSituationByKey('golden_century').GetName]» находится на уровне #Y 75#!, наша держава будет получать бонусы от модификатора «[ShowModifier('elevated_cultural_identity_modifier')]»"
