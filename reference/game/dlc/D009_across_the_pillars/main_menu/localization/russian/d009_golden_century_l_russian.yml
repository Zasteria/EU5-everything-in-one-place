 golden_century_events.40.title: "Мятеж сословий"
 golden_century_events.40.desc.desc_spa: "Привилегированные сословия [ROOT.GetCountry.Custom('rank_ru_GEN')|l] выступили против нас единым фронтом в ответ на наши недавние попытки укрепить власть за их же счёт. Теперь гранды, прелаты и купцы из привилегированных городов в один голос заявляют, что мы превращаемся в тиранов. Они разворачивают знамёна и собирают отряды с целью заставить нас поступиться своими притязаниями."
 golden_century_events.40.desc.desc_adu: "Великие дома [ROOT.GetCountry.Custom('rank_ru_GEN')|l] объединились и выступили против нас. Столь возмутительного неповиновения тех, кто обязан нам своими привилегиями, мы не видели уже много веков! Подобную дерзость и непомерное самомнение следует наказать. Каждый мелкий сеньор, купец и церковник возжелал власти, которая по праву принадлежит нам, и мы этого не потерпим!"
 golden_century_events.40.desc.historical_info_spa: "Попытки испанской короны сконцентрировать власть привели к ожесточённому сопротивлению со стороны привилегированных сословий. Во время восстания комунерос в 1520-1521 гг. города Кастилии восстали против Карла V. А Гранды и кортесы ещё долго отстаивали свою свободу от посягательств короны."
 golden_century_events.40.desc.historical_info_adu: "Влиятельные и знатные семьи постоянно бросали вызов центральной власти в Аль-Андалусе. После 1009 года Гражданские войны ( #italic фитны#!) привели к распаду кордовского халифата, а так как честолюбивые наместники хотели править как им заблагорассудится, они раз за разом восставали против центра."
 golden_century_events.40.a: "Они забыли, кому служат!"
 X_provinces_may_rise_in_revolt_tt: "[Concept('provinces', 'Провинции')|e] (#Y [ROOT.GetVariable('golden_century_events_40_display_prov_rebel_variable').GetValue|V0]#!) примкнут к мятежникам ([target_rebel.GetName]). Всё проживающее там население высших классов взбунтует против нас"
