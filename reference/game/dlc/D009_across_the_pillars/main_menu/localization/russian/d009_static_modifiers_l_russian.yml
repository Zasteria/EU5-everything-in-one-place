 STATIC_MODIFIER_NAME_searching_for_cibola: "Поиски Сиболы"
 STATIC_MODIFIER_DESC_searching_for_cibola: "Экспедиция, снаряжённая на поиски семи городов Сиболы, находится где-то между побережьем Соноры и территорией пуэбло. Престиж нашей власти в их руках."
 STATIC_MODIFIER_NAME_searching_for_quivira: "Поиски Кивира"
 STATIC_MODIFIER_DESC_searching_for_quivira: "Экспедиция, снаряжённая на поиски королевства Кивира, находится где-то в травяном море Нью-Мексико."
 STATIC_MODIFIER_NAME_searching_for_sierra_de_la_plata: "Поиски Сьерра-де-ла-Плата"
 STATIC_MODIFIER_DESC_searching_for_sierra_de_la_plata: "Экспедиция, снаряжённая на поиски описанной народом гуарани серебряной горы, находится в предгорьях Анд к западу от Плата."
 STATIC_MODIFIER_NAME_searching_for_norumbega: "Поиски Норумбеги"
 STATIC_MODIFIER_DESC_searching_for_norumbega: "Экспедиция, снаряжённая на поиски окружённого стеной города, о котором сообщили французские рыбаки и лоцманы мореплавателя Верраццано, народится в Новой Англии у реки Пенобскот."
 STATIC_MODIFIER_NAME_searching_for_saguenay: "Поиски Сагенея"
 STATIC_MODIFIER_DESC_searching_for_saguenay: "Экспедиция, снаряжённая на поиски королевства, о котором Доннакона рассказал Жаку Картье в Стадаконе, сейчас находится в северных лесах к северу от реки Святого Лаврентия."
 STATIC_MODIFIER_NAME_searching_for_city_of_caesars: "Поиски Города Цезарей"
 STATIC_MODIFIER_DESC_searching_for_city_of_caesars: "Снаряжённая в Патагонию экспедиция ищет затерянный город, по преданиям расположенный где-то среди тамошних гор."
 STATIC_MODIFIER_NAME_cibola_discovered: "Сибола найдена"
 STATIC_MODIFIER_DESC_cibola_discovered: "Мы нашли семь городов Сиболы и начали с ними торговать. Оттуда к нам поступают бирюза, хлопчатобумажная ткань, изготовленный в мастерских пуэбло гагат. Кроме того, эта страна окружена кукурузными полями. Она включена в нашу имперскую торговую систему на более-менее партнёрских условиях."
 STATIC_MODIFIER_NAME_quivira_discovered: "Кивира найдена"
 STATIC_MODIFIER_DESC_quivira_discovered: "Королевство Кивира было найдено на травяном море к востоку от земли пуэбло. Это плодородная страна, где пасутся большие стада бизонов. Фермеры и торговцы из племени Уичита ведут здесь активную торговлю, в которую теперь включилась и наша власть."
 STATIC_MODIFIER_NAME_sierra_plata_discovered: "Сьерра-де-ла-Плата найдена"
 STATIC_MODIFIER_DESC_sierra_plata_discovered: "Легендарная серебряная гора найдена и открыта миру. Запасы местной руды поражают воображение. Чичские лорды, которые владеют предгорьями, готовы торговать с нами, а количество получаемых оттуда слитков сопоставимо с богатствами старых кордильерских шахт."
 STATIC_MODIFIER_NAME_norumbega_discovered: "Норумбега найдена"
 STATIC_MODIFIER_DESC_norumbega_discovered: "В верховьях реки Пенобскот обнаружена Норумбега — окружённый стеной каменный город, где жили абенаки и (как настаивает наш латинист) древние скандинавы. Выше по течению находится работающий золотой рудник. В результате этого открытия передвижение поселенцев и направления торговых путей изменились."
 STATIC_MODIFIER_NAME_saguenay_discovered: "Сагеней найден"
 STATIC_MODIFIER_DESC_saguenay_discovered: "Северное королевство, о котором Доннакона рассказывал Картье, было найдено на холодных просторах за пределами второго великого озера в бассейне реки Святого Лаврентия. Поселение там процветает, у его жителей светлая кожа, а говорят они на скандинавском языке. Торговля мехом и золотом приносит оттуда столько прибыли, сколько французская корона не видела ещё ни в одной стране Нового Света."
 STATIC_MODIFIER_NAME_city_of_caesars_discovered: "Город Цезарей открыт"
 STATIC_MODIFIER_DESC_city_of_caesars_discovered: "Заетрянный Город Цезарей был обнаружен в потаённой долине в Патагонских Андах; его жители — потомки переселенцев, потерпевших кораблекрушение ещё в XVI веке. Подданные нашей державы вернулись под власть короны, а с ними и огромные запасы серебра, которые они успели добыть за несколько поколений жизни в изоляции от остального мира."
 STATIC_MODIFIER_NAME_searching_for_el_dorado: "Поиски Эльдорадо"
 STATIC_MODIFIER_DESC_searching_for_el_dorado: "Экспедиция, отправленная в бассейн реки Ориноко, пытается отыскать легендарного «золотого короля» муисков."
 STATIC_MODIFIER_NAME_searching_for_fountain_of_youth: "Поиски источника вечной молодости"
 STATIC_MODIFIER_DESC_searching_for_fountain_of_youth: "На Флориду в район обитания народа тимукуа была снаряжена экспедиция, перед которой поставлена задача отыскать «Фонтан Бимини» — источник, по преданиям дарующий вечную молодость."
 STATIC_MODIFIER_NAME_el_dorado_discovered: "Эльдорадо открыто"
 STATIC_MODIFIER_DESC_el_dorado_discovered: "Золотое царство муисков теперь открыто для испанской торговли. Из величественных и поистине огромных горных мастерских, с которыми не сравнится ни одна в Европе, золото буквально течёт рекой в нашу новую факторию у священного озера инков."
 STATIC_MODIFIER_NAME_fountain_of_youth_discovered: "Источник вечной молодости найден"
 STATIC_MODIFIER_DESC_fountain_of_youth_discovered: "Мы нашли источник в самом сердце земли народа тимукуа и подтвердили его целительные свойства, точь-в-точь, как говорилось в легендах. У источника мы построили часовню, и к нему уже началось паломничество."
 STATIC_MODIFIER_NAME_camelry_doctrine_modifier: "Доктрина верблюжьей кавалерии"
 STATIC_MODIFIER_DESC_camelry_doctrine_modifier: "Предложение генерала было принято. Наряду с конницей формируются верблюжьи эскадроны, вдоль караванных путей закладываются перевалочные пункты для смены вьючных животных, а строевые уставы переписываются с учётом особенностей пустынных походов. Армия теперь проходит больший путь, расходуя меньше воды, чем прежде, а офицерский корпус постепенно смиряется с запахом."
 STATIC_MODIFIER_NAME_gra_old_capital_of_the_caliphate: "Столица старого халифата"
