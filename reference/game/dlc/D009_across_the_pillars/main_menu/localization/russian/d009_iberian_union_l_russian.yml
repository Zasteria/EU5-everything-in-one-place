 iberian_union_succession_desc: "Этот тип [Concept('heir_selection', 'престолонаследия')|e] характерен для христианских монархий #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, заключивших [ShowRelationTypeName('iberian_wedding_pact')]. Если один из правителей умрёт, не оставив наследников, то другой унаследует оба престола и тем самым образует [Concept('union', 'унию')|e] двух держав."
