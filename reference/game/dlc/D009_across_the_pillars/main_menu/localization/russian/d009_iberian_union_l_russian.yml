l_russian:
 catholic_monarchs_law: "Католические монархи"
 catholic_monarchs_law_desc: "Брак, связывающий наши державы, является фундаментом нашего общего будущего. От того, как наши обручённые правители будут царствовать — на равных ли или с явным верховенством одного из домов, — зависит дальнейшая судьба всей унии."
 iu_establish_iberian_wedding_succession_tt: "Страны заключают [ShowRelationTypeName('iberian_wedding_pact')] и меняют своё [Concept('heir_selection', 'правило престолонаследия')|e] на «[ShowHeirSelectionName('iberian_union_succession')]», согласно которому один из правителей может унаследовать оба престола и создать унию двух держав"
 composite_monarchy_law: "Составная монархия"
 composite_monarchy_law_desc: "Наши державы объединены под властью одного суверена, но при этом каждая из них сохраняет свои законы и привилегии, именуемые #italic фуэрос#!. Нам необходимо решить, стоит ли и дальше уважать эти #italic фуэрос#!, или лучше создать единые правила для всех."
 asientos_law: "Асьенто"
 asientos_law_desc: "Правительство предоставляет купцам #italic асьенто#! — монопольное право снабжать наши заморские владения всеми необходимыми товарами. Обладатель этого права получает прибыль с каждого груза и обеспечивает работой мастерские своей страны. В связи с этим уния должна решить, будут ли власти даровать асьенто лишь своим подданным, или всё же позволят купцам из других держав пользоваться этим престижным правом."
 religious_authority_law: "Религиозная власть"
 religious_authority_law_desc: "Наши объединённые державы должны решить, как лучше воспользоваться религиозной властью. Корона может оказать церкви #italic королевское покровительство#! и взять её под свой контроль, тем самым сосредоточив её усилия внутри унии; с другой стороны, можно обратить взор церкви наружу, чтобы она распространяла христианскую веру и защищала верующих в других странах."
 legislative_authority_law: "Законодательная власть"
 legislative_authority_law_desc: "Чьей воле будут подчиняться страны унии? Корона может навязывать свои порядки посредством принятия #italic прагматических санкций#!, либо же полагаться на решения местных #italic кортесов#! в каждом королевстве."
 crown_settlement_law: "Соглашение корон"
 crown_settlement_law_desc: "Нам необходимо решить, какую форму в итоге примет наша уния. Наши державы могут и дальше существовать как равные партнёры, но при желании мы также можем объединиться в одно большое нераздельное государство с едиными законами и порядками."
 union_of_arms_law: "Союз армий"
 union_of_arms_law_desc: "Оборона унии — это долг каждой входящей в неё державы. Все королевства должны вносить свой вклад в нашу общую защиту либо добровольно, либо в соответствии с обязательными квотами."
 iu_tanto_monta_policy: "Tanto Monta"
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! означает «всё равно». Этот девиз указывает на равенство двух суверенов, которые совместно правят государством. Именно принципы взаимного уважения и признания лежат в основе унии, скрепляющей наши державы."
 iu_tanto_monta_no_seniority_tt: "Для этой [Concept('union', 'унии')|e] не назначен #TOOLTIP:SPECIAL_STATUS,senior_partner,X #L старший партнёр#!#! и не действуют политики «[ShowPolicyName('union_establish_seniority_policy')]» и «[ShowPolicyName('union_senior_succession_law')]»"
 iu_dynastic_primacy_policy: "Династическое главенство"
 iu_dynastic_primacy_policy_desc: "Одна из корон признаётся старшей в унии, а её династия — главной среди других. При этом старший дом пользуется особым престижем, тогда как остальные державы довольствуются правом быть в одной унии с сильным и влиятельным монархом."
 iu_dynastic_primacy_senior_only_tt: "Если мы — [Concept('senior_partner', 'старший партнёр')|e]:"
 iu_dynastic_primacy_seniority_tt: "Когда эта [Concept('union', 'уния')|e] формировалась, её участник с наибольшей [Concept('economical_base', 'экономической базой')|e] был назначен #TOOLTIP:SPECIAL_STATUS,senior_partner,X #L старшим партнёром#!#!, вследствие чего для всей унии стали действовать политики «[ShowPolicyName('union_establish_seniority_policy')]» и «[ShowPolicyName('union_senior_succession_law')]»"
 iu_respect_fueros_policy: "Признание фуэрос"
 iu_respect_fueros_policy_desc: "Уния признаёт и защищает древние привилегии каждого королевства. Так, младшие державы сохраняют значительную автономию, а старший партнёр пользуется их уважением за счёт того, что держит слово и чтит чужие традиции."
 iu_centralized_administration_policy: "Централизованное управление"
 iu_centralized_administration_policy_desc: "Все участники унии подчиняются единому правительству. За счёт этого старший партнёр обретает большую власть, а младшие державы укрепляют свою легитимность благодаря стабильности и порядку в унии."
 iu_crown_asientos_policy: "Асьенто короны"
 iu_crown_asientos_policy_desc: "Корона самостоятельно занимается снабжением колоний, сосредотачивая прибыль от торговли в своих руках. При этом младшие партнёры тоже извлекают из этого выгоду, производя необходимые для поставок товары."
 iu_shared_asientos_policy: "Общие асьенто"
 iu_shared_asientos_policy_desc: "Асьенто делятся между купцами всех держав в унии. Благодаря этому младшие партнёры свободно зарабатывают на снабжении колоний, а старшая держава получает доступ к дешёвым товарам, которые проходят через общую торговую сеть унии."
 iu_patronato_real_policy: "Королевское покровительство"
 iu_patronato_real_policy_desc: "За счёт #italic королевского покровительства#! корона контролирует деятельность церкви на территории унии, назначая прелатов и распоряжаясь её доходами. Таким образом, религиозная власть в унии всецело находится в руках короны."
 iu_catholic_champion_policy: "Ревнители веры"
 iu_catholic_champion_policy_desc: "Наши объединённые державы самоотверженно несут свой крест, защищая христианскую веру при всех дворах Европы. Пусть весь мир знает, что мы — неистовые ревнители церкви, готовые служить ей мечом и щитом."
 iu_pragmaticas_policy: "Королевские санкции"
 iu_pragmaticas_policy_desc: "Закон — это прежде всего проявление воли монарха. Принимая #italic прагматические санкции#!, суверен единолично устанавливает порядки для всех держав в унии, не дожидаясь одобрения со стороны каких-либо советов или собраний."
 iu_regional_cortes_policy: "Региональные кортесы"
 iu_regional_cortes_policy_desc: "Каждый участник унии правит лишь с согласия своих #italic кортесов#!. Полагаясь на эти традиционные сословные собрания, правители упрочняют свою легитимность и укрепляют унию за счёт её признания со стороны народа."
 iu_una_ley_una_moneda_policy: "Один закон, одна валюта"
 iu_una_ley_una_moneda_policy_desc: "Законы и валюта должны быть общими для всех участников унии. Это поспособствует укреплению связи между державами и ускорит их слияние в единое государство, а также позволит более слабым странам трудиться и торговать так же свободно, как дома."
 iu_perpetual_crown_policy: "Постоянная федеративная монархия"
 iu_perpetual_crown_policy_desc: "Нашу унию скрепляет нерушимый договор между странами. Долгосрочный характер этого союза обеспечивает правителям легитимность, а их державам — стабильность и порядок. Благодаря этому связь между участниками унии становится крепка как никогда."
 iu_proportional_levy_policy: "Пропорциональный набор ополчения"
 iu_proportional_levy_policy_desc: "Все державы обязаны предоставлять свою долю рекрутов для общего войска. Это позволяет унии иметь более крупную и сильную армию, командование которой берёт на себя старший партнёр."
 iu_negotiated_contribution_policy: "Согласованный вклад"
 iu_negotiated_contribution_policy_desc: "Державы участвуют в обороне унии на основании добровольного соглашения, а не по принуждению. За счёт этого им становится легче исполнять свои союзные обязательства, а чувство общего долга лишь объединяет солдат и повышает их дисциплину."
 proclaim_spanish_monarchy: "Провозглашение испанской монархии"
 proclaim_spanish_monarchy_desc: "Объявить о слиянии множества держав нашей унии в единую монархию и принять славный титул Испании."
 proclaim_spanish_monarchy_integration_tt: "Наша уния должна достичь как минимум 5 уровня интеграции"
