l_russian:
 gra_frontier_warriors: "Воины приграничья"
 gra_frontier_warriors_desc: "Приграничные деревни вдоль #italic сугуров#! обязаны снаряжать своих сыновей по сигналу дозорной цепи сигнальных костров. Такие военнообязанные #italic сагрийцы#! знают проходы, колодцы и сезонные набеги христианских королей так же хорошо, как пастух знает свои родные холмы. Такие воины вооружаются дешёвым оружием, кормятся из запасов своей же деревни и обучаются в условиях пограничья единственной войне, которая имеет значение. Эта лёгкая пехота обходится нашей казне в сущие гроши, но достойно удерживает горные дороги по сравнению с куда более дорогими в содержании войсками, которые не сравнились бы с ними в знании местности."
 gra_jamaa: "Джамаат"
 gra_jamaa_desc: "Джамаат (букв. «община») — это постоянно действующий совещательный орган нашего эмирата, объединяющий верховного судью #italic кади аль-джамаа#!, #italic визиря#!, #italic хаджиба#! и #italic шейха гази#!, который командует прибывшими к нашему двору маринидскими добровольцами-джихадистами. Этот совет представляет волю общины верных, и благодаря ему решения по вопросам войны, сбора дани становятся не личной прерогативой эмира, но результатом волеизъявления всего общества. Этот совет исключает саму возможность навязывания нам односторонних уступок в случае раскола в эмирате и гарантирует, что ни одна внешняя сила — будь то христианский король, магрибский султан или пограничный вождь — не сможет договориться с кем-то одним из нас в обход воли всего народа."
 gra_jinetes: "Хинеты"
 gra_jinetes_desc: "Лёгкая кавалерия, называемая #italic хинетами#!, получила своё название от берберов-зената, в XIII веке переправившихся через пролив, чтобы встать под андалусские знамёна. Эти воины ходили в атаку верхом на небольших иберо-арабских конях и полагались на тактику стремительного налёта, забрасывания врага дротиками и ложного отступления. Со временем зената стали постоянной частью нашего войска. Сегодня гранадские хинеты прикрывают манёвры наших отрядов по всей державе, от #italic сугуров#! до прибрежных равнин. Содержание лёгкой конницы обходится нам гораздо дешевле рыцарей в кольчугах, а сами хинеты весьма успешно обеспечивают подвижное прикрытие, которое христианские войска не способны прорвать, не нарушив строй."
 unlocked_jinetes_via_decision_tt: "В [Concept('decision', 'решении')|e] «$demand_conversion_of_granada$» во время [Concept('situation', 'ситуации')|e] «[ShowSituationName('battle_for_the_strait')]» мы выбрали вариант #italic «$demand_conversion_of_granada.b$»#!"
 gra_mailed_jinetes: "Хинеты в кольчугах"
 gra_mailed_jinetes_desc: "Два столетия пограничных войн закалили наших #italic хинетов#! и превратили их в умелых и стойких всадников. Теперь они выходят в бой в кольчугах, способных выдержать попадание из арбалета христианина, а их копья стали длиннее и могут пробить кольчугу противника. Тактика хинетов остаётся прежней: стремительный удар, бросок дротиков и ложное отступление, но теперь, если не удалось разбить врага первой же атакой, всадники могут вступить в ближний бой. Защищённые доспехом хинеты сегодня — более опасная сила, способная сражаться там, где раньше ей пришлось бы отступать."
 gra_renegade_warriors: "Воины-ренегаты"
 gra_renegade_warriors_desc: "На рубежах между Аль-Андалусом и христианскими королевствами появился особый тип солдат — #italic эльче#!, сменившие одну веру на другую и теперь служащие под нашими знамёнами с мастерством, приобретённым у своих прежних повелителей. Мы законодательно закрепим набор этих ренегатов, превратим их в сословие постоянных тяжёлых всадников, даруем им земли, придворные должности и право сражаться под нашими цветами. Такие латные всадники, обученные христианской тактике бронированного боя, обеспечивает нашей армии тяжёлую конницу, какую наши собственные традиции никогда не знали."
 gra_taifa_subjects: "$taifa$"
 gra_taifa_subjects_desc: "$taifa_desc$"
 gra_tali_a_coastal_watch: "Береговые башни талаи"
 gra_tali_a_coastal_watch_desc: "Мы возводим каменные сторожевые башни, #italic талаи#!, на каждом мысу и выступе нашего побережья. На каждой башне ночью зажигают сигнальный костёр, а днём вывешивают знамя. Башни находятся в прямой видимости друг от друга; внутри дежурит отряд арбалетчиков и #italic факих#!, который громкой молитвой подаёт сигнал опасности. Ни одна галера не сможет обогнуть мыс незамеченной, а жители каждой прибрежной долины-#italic веги#! успевают собрать ополчение за несколько часов до того, как вражеский киль врежется в прибрежный песок. Эта сеть дозоров лишает неприятельские флотилии эффекта внезапности и защищает береговую линию без затрат на постоянные прибрежные гарнизоны."
 gra_thughur: "Сугуры"
 gra_thughur_desc: "#italic Сугуры#! — это пограничные провинции Аль-Андалуса, дикие территории между оседлой христианской Иберией и нашим эмиратом. Наша власть и военное присутствие в этих землях обеспечиваются раздачей земель и привилегий воинским кланам. Мы возводим у каждого перевала и брода крепости-#italic сагры#! и создаём из них непрерывную оборонительную цепь, которая сдерживает любое продвижение христиан и даёт нашим всадникам место для сбора и пополнения припасов. Эта организованная система рубежей превращает пограничные кланы из автономных отрядов налётчиков в защитников, кровно заинтересованных в выживании эмирата."
 gra_veteran_thagri: "Сагрийцы-ветераны"
 gra_veteran_thagri_desc: "Четыре поколения пограничной службы закалили #italic сагрийцев#! и превратили их в особый класс нашего общества. Их семьи издавна живут у тех же горных перевалов, что когда-то удерживали их прадеды, а высокие звания здесь передаются от отца к сыну. Сагрийцы получают не больше, чем простые крестьяне, — и всё равно встают под наши знамёна, довольствуясь скудными пайками, от которых отвернули бы нос любые христианские войска. Эти закалённые в боях воины помогают нам удерживать пограничные территории, не прибегая к услугам дорогостоящих наёмников."
 gra_veteran_tornadizos: "Торнадисос-ветераны"
 gra_veteran_tornadizos_desc: "Христианские #italic эльче#!, в спешке набранные около столетия назад, со временем превратились в оседлый воинский класс, считающий приграничье нашей державы своим домом. Семьи перебежчиков роднятся между собой, передают от отца к сыну искусство владения копьём и боя в латах и сами снабжают себя достойным снаряжением, даже помыслить о котором не так давно ещё было невозможно. В свою очередь мы признаём новый слой нашего общества и дарим этим людям земельные наделы и офицерские должности. Нет никаких сомнений в том, что некогда христианская тяжёлая конница всецело предана нашей державе. Ветераны-торнадисос, всегда занимающие место в центре строя, — самая мощная ударная кавалерия, что есть в нашем распоряжении."
 saqaliba_barracks_advance: "Дар ас-сакалиба"
 saqaliba_barracks_advance_desc: "Прежние кордовские халифы держали стражу из #italic сакалибов#! — воинов-рабов, приученных повиноваться исключительно правителю. Мы возрождаем этот институт, учреждая #italic Дар ас-сакалиба#! («Дом рабов»), организацию, которая выкупает, вооружает и усердно обучает таких людей ратному делу. Её арсеналы ничуть не уступают любой другой оружейной палате государства, но комплектуются из совершенно иных источников, а из выходящих из её стен бойцов формируется постоянный корпус придворной стражи, верный лично нам, а не какому-либо клану или городу."
 a_saqaliba_mutaqaddimun_advance: "Ас-сакалиба аль-мутакаддимун"
 a_saqaliba_mutaqaddimun_advance_desc: "Мы набираем первое поколение возрождённого корпуса #italic мутакаддимун#!, гвардейцев былых времён. Мы нарекаем их #italic ас-сакалиба аль-джудуд#!, Новыми сакалибами, чтобы отделить их от #italic аль-кудама#! — ветеранов ушедшего золотого века Кордовы. Намертво связанные обязательствами перед #italic Дар ас-сакалиба#! и королевским домом, эти воины ничем не обязаны ни пограничным кланам, ни старой арабской знати."
 a_saqaliba_mutaakhkhirun_advance: "Ас-сакалиба аль-мутааххирун"
 a_saqaliba_mutaakhkhirun_advance_desc: "В преддверии наступления новой эпохи корпус проходит через преобразования: муштру приводят к единому порядку, на смену старым ружьям приходят мушкеты, а ряды воинов ширятся настолько, что подобного ещё не знали ни #italic Дар ас-сакалиба#!, ни $a_saqaliba_mutaqaddimun$. Новая разновидность сакалиба — #italic мутааххирун#! — теперь ещё одна опора нашего войска, уже доказавшая свою верность."
 a_saqaliba_nizam_jadid_advance: "Ан-низам аль-джедид"
 a_saqaliba_nizam_jadid_advance_desc: "В ходе масштабной реорганизации наш корпус превратится в #italic низам джедид#! — Новый орден, устроенный по образцу современных, вооружённых пороховым оружием армий. Теперь у нас будет современная пехота с однотипными ротами, учениями со снабжением из складов и офицерами-рабами, выросшими из самых низов. Такое войско подчиняется исключительно трону и никому более. Само их имя провозглашает полный разрыв со всем, что было прежде."
