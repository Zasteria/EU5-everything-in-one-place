 mor_central_makhzen: "Махзен"
 mor_central_makhzen_desc: "На смену вольнице времён раннего султаната должен прийти #italic махзен#! — полноценный государственный аппарат со сборщиками налогов, секретарями и назначаемыми наместниками. Он будет распространять волю престола из покорных центральных областей в земли мятежников. Благодаря этому центральная власть перестанет зависеть от личности конкретного правителя и превратится в прочный государственный институт."
