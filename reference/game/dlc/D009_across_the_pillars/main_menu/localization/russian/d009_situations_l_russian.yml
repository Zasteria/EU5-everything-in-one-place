 mor_force_tribute: "Потребовать дань"
 mor_force_tribute_desc: "Мы сделаем #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]$tt_cl_1$ своим данником. Местные монеты потекут на юг через пролив, а двор станет подчиняться нам в вопросах войны и пошлин."
 cas_force_tribute: "Потребовать парии"
 cas_force_tribute_desc: "Возродить старую дань парий и вновь возложить её на плечи [GetCountry('GRA').GetName]. Золото [GetCountry('GRA').GetFlavorRank] потечёт на север, в нашу казну, а их двор будет отвечать перед нашим как в делах войны, так и в вопросах пошлин."
 mor_invite_granadan_scholars: "Пригласить гранадских богословов"
 mor_invite_granadan_scholars_desc: "Мы позовём #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L мулл#!#! и #italic факихов#! из #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусских#!#!  #italic медресе#! на наш берег пролива. Учёные #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#!, несравненные знатоки и толкователи #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L правовой#!#! школы «[GetCountry('GRA').GetReligiousSchool.GetName]», помогут распространить закон и грамотность и в нашей державе."
 mor_invite_granadan_advisor: "Пригласить гранадского советника"
 mor_invite_granadan_advisor_desc: "Мы пригласили ко двору #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусского#!#! богослова с другой стороны пролива. Его трактаты объединяют строгий догматизм #L [GetCountry('GRA').GetAdjective|l]их#! #italic медресе#! с духовным авторитетом мистицизма западных суфиев, да и сам по себе этот жест приведёт к потеплению отношений между нашими дворами."
 mor_invite_granadan_advisor_traits_tt: "[Concept('character', 'персонаж')|e] получает два случайно выбранных положительных [Concept('traits', 'свойства')|e], полезных для службы в нашем [Concept('cabinet', 'совете')|e]"
