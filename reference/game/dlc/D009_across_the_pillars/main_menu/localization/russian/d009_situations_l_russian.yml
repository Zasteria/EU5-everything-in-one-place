 gra_promote_sovereignty_desc: "Наши чиновники и [GetCountry('GRA').GetGovernment.GetEstateName('clergy_estate')] трудятся над тем, чтобы каждый аристократ, купец и крестьянин знал, что  [GetCountry('GRA').GetFlavorRank|l] не признаёт чужих господ. Система покровительства, общественные работы и даже церемонии, которые тщательно организует [GetCountry('GRA').GetGovernment.GetCourtTitle], подчёркивают и укрепляют независимость нашей власти."
