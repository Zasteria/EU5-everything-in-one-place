 BFTS_THRESHOLD_MOR_25_TITLE: "Марокканское влияние в Гранаде"
 BFTS_THRESHOLD_MOR_25_DESC: "[GetCountry('MOR').GetName] мо[GetCountry('MOR').Custom('end_gegu')] совершать действие «[ShowGenericActionName('mor_force_tribute')]» в отношении #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#!, если между этими державами нет вассальных отношений и ни одна из них не ведёт войну."
 BFTS_THRESHOLD_CAS_50_TITLE: "Кастильское господство в Гранаде"
 BFTS_THRESHOLD_CAS_50_DESC: "[GetCountry('CAS').GetName] мо[GetCountry('CAS').Custom('end_gegu')] совершать действие «[ShowCountryInteractionName('cas_demand_war_entry')]», призывая #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! участвовать в своих войнах с #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_INST')|L]#!#!. Пока влияние находится на этом уровне, [GetCountry('GRA').GetNameWithNoTooltip] не мо[GetCountry('GRA').Custom('end_gegu')] завершить [Concept('situation', 'ситуацию')|e] в статусе независимой державы."
 BFTS_THRESHOLD_MOR_50_TITLE: "Марокканское господство в Гранаде"
 BFTS_THRESHOLD_MOR_50_DESC: "[GetCountry('MOR').GetName] мо[GetCountry('MOR').Custom('end_gegu')] совершать действие «[ShowCountryInteractionName('cas_demand_war_entry')]», призывая #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! участвовать в своих войнах с #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_INST')|L]#!#!. Пока влияние находится на этом уровне, [GetCountry('GRA').GetNameWithNoTooltip] не мо[GetCountry('GRA').Custom('end_gegu')] завершить [Concept('situation', 'ситуацию')|e] в статусе независимой державы."
 BFTS_THRESHOLD_CAS_75_TITLE: "Кастильские права на Гранаду"
 BFTS_THRESHOLD_CAS_75_DESC: "[GetCountry('CAS').GetName] мо[GetCountry('CAS').Custom('end_gegu')] совершать действие «[ShowGenericActionName('cas_reduce_granadan_sovereignty')]», подрывающее суверенитет Гранады."
 BFTS_THRESHOLD_MOR_75_TITLE: "Марокканские права на Гранаду"
 BFTS_THRESHOLD_MOR_75_DESC: "[GetCountry('MOR').GetName] мо[GetCountry('MOR').Custom('end_gegu')] совершать действие «[ShowGenericActionName('cas_reduce_granadan_sovereignty')]», подрывающее суверенитет Гранады."
 BFTS_THRESHOLD_CAS_100_TITLE: "Кастильская власть над Гранадой"
 BFTS_THRESHOLD_CAS_100_DESC: "[GetCountry('CAS').GetName] открыто господству[GetCountry('CAS').Custom('end_etyut')] над проливом и мо[GetCountry('CAS').Custom('end_gegu')] совершить действие «[ShowGenericActionName('vassalize_granada')]» или «[ShowDecisionName('demand_conversion_of_granada')]». Как только Иберия признает христианскую или кастильскую власть, [Concept('situation', 'ситуация')|e] разрешится в пользу Кастилии."
 BFTS_THRESHOLD_MOR_100_TITLE: "Марокканская власть над Гранадой"
 BFTS_THRESHOLD_MOR_100_DESC: "[GetCountry('CAS').GetName] открыто господству[GetCountry('CAS').Custom('end_etyut')] над проливом и мо[GetCountry('CAS').Custom('end_gegu')] совершить действие «[ShowGenericActionName('vassalize_granada')]». Если как минимум одна пятая Иберии окажется под властью Марокко, [Concept('situation', 'ситуация')|e] разрешится в пользу этой державы."
