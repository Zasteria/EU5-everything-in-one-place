 mor_vassalize_granada_desc: "$vassalize_granada_desc$"
 claim_andalusi_inheritance: "Заявить права на андалусское наследие"
 claim_andalusi_inheritance_desc: "[ShowFormableCountryName('ADU_f')] — это земля, где когда-то правили халифы, а правоверные шли на молитву в великие мечети #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#!. С тех пор, как эти берега захватили #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! монархи, мы не знаем покоя.\n\nМы заявляем о своих правах на избранные иберийские территории, а наши армии готовы подкрепить это заявление силой. Если мы ударим сейчас, #TOOLTIP:REGION,iberia_region,X #L Иберия#!#! сочтёт нас законными претендентами на утраченное наследие, а наша слава прогремит на весь [ShowReligionGroupAdjectiveWithNoTooltip('muslim')|l]ий мир."
 claim_andalusi_inheritance_no_target_tt: "Мы получим [Concept('casus_belli', 'повод для войны')|e] с целью отнять землю [ShowFormableCountryName('ADU_f')] у выбранного нами #TOOLTIP:RELIGIONGROUP,christian,X #L христианского#!#! монарха Иберии сроком на 5 лет"
 has_won_bfts_situation_tt: "Мы должны победить в [Concept('situation', 'ситуации')|e] «[ShowSituationName('battle_for_the_strait')]»"
 as_long_as_the_situation_is_active_desc: "пока [Concept('situation', 'ситуация')|e] «$battle_for_the_strait$» остаётся активной"
 demand_conversion_of_granada.title: "Вера Гранады"
 demand_conversion_of_granada.desc: "Народ #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! преклонил перед нами колени, но местные мечети по-прежнему сзывают правоверных на молитву. Перед короной открыты два пути. Мы можем закончить то, что начала реконкиста, и силой обратить [GetCountry('GRA').Custom('rank_ru_ACC')|l] в нашу веру, или позволить #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусскому#!#! народу сохранить свои обычаи, получив взамен его мастерство, учёность и навыки верховой езды."
 demand_conversion_of_granada.a: "Обратить их в нашу веру. Монарх и его подданные должны служить одному господину."
 demand_conversion_of_granada.b: "Позволить им сохранить веру."
 cas_found_the_santa_hermandad_decision.title: "Учредить [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]"
 cas_found_the_santa_hermandad_decision.desc: "Братства наших городов издавна охраняют дороги, но каждое из них подчиняется лишь собственному совету и собственным алькальдам. Единое [ShowGovernmentReformName('cas_santa_hermandad_reform')], набираемое городами, но подчинённое Короне, принесёт королевский мир в каждую деревню и положит конец разбою, с которым знать никогда не желала бороться."
 cas_found_the_santa_hermandad_decision.a: "Учредим [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]."
 gra_pops_becomes_root_religion_tt: "Многие [Concept('pops', 'группы населения')|e], не относящиеся к [Concept('religion_group', 'религиозной группе')|e] «[ROOT.GetCountry.GetReligion.GetGroup.GetName]», примут следующую религию: [ROOT.GetCountry.GetReligion.GetName]"
