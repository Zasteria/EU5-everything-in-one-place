 mor_garrison_granadan_strongholds: "Разместить гарнизоны в гранадских крепостях"
 mor_garrison_granadan_strongholds_desc: "Мы разместим полк своих солдат в выбранной провинции #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#!, увеличив гарнизоны её крепостей. В результате любая вражеская армия, вторгшаяся в эту провинцию, будет страдать от истощения, а максимальная численность войск, которые могут контролировать местные офицеры, повысится."
