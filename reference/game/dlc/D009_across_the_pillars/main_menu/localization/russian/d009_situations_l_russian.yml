 vassalize_granada: "Сделать Гранаду вассалом"
 vassalize_granada_desc: "[GetCountry('GRA').GetGovernment.GetCourtTitle] полностью подчиняется нам. Речь уже не о выплате дани: [GetCountry('GRA').GetFlavorRank] — преданный #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассал#!#! нашего трона. [GetCountry('GRA').GetGovernment.GetRulerTitle] правит только номинально, а законы, налоги и денежная система находятся в наших руках."
