 influence_over_granada: "Влияние на Гранаду"
 influence_over_granada_desc: "На #L [GetCountry('GRA').GetAdjective|l]ий#! двор влияют [GetCountry('CAS').GetName] и [GetCountry('MOR').GetName]. Это влияние представлено в виде оси от $bfts_axis_min$ (тесные связи с Кастилией) до $bfts_axis_max$ (тесные связи с Марокко) и меняется каждый месяц в зависимости от войн, браков, дани, религии и покровительства двора."
