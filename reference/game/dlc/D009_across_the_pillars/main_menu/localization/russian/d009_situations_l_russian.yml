 cas_pressure_andalusi_court: "Оказывать давление на андалусский двор"
 cas_pressure_andalusi_court_desc: "[GetCountry('GRA').GetGovernment.GetCourtTitle|U] #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! постепенно уступает нашему давлению, которое мы ведём по всем каналам — от договоров о плате за защиту до угрозы набегов кабальгады на границе. С каждым месяцем наше влияние на [GetCountry('GRA').Custom('rank_ru_ACC')|l] усиливается, а #L [GetCountry('MOR').GetAdjective]ое#! — слабеет."
