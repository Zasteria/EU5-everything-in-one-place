 mor_cultivate_andalusi_influence: "Укреплять андалусское влияние"
 mor_cultivate_andalusi_influence_desc: "Наши посланники и учёные вновь и вновь пересекают пролив, заботясь о том, чтобы [GetCountry('GRA').GetGovernment.GetRulerTitle|l] и [GetCountry('GRA').GetGovernment.GetCourtTitle|l] продолжали ценить нашу дружбу. С каждым месяцем покровительство, брачные предложения и пограничные гарнизоны всё теснее связывают с нами элиту [GetCountry('GRA').Custom('rank_ru_GEN')|l]."
