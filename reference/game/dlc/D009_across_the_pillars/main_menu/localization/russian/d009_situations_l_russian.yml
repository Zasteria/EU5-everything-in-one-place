 mor_attract_andalusi_craftsmen: "Пригласить андалусских ремесленников"
 mor_attract_andalusi_craftsmen_desc: "Мы отправим через пролив вербовщиков, которые станут предлагать ремесленникам из выбранной #L [GetCountry('GRA').GetAdjective|l]ой#! провинции переселиться в наши земли. Ткачи, кожевники и металлурги [GetCountry('GRA').Custom('CL_GEN')] привезут в наши города свои мастерские и свой опыт, ускорив развитие указанной провинции и укрепив её сословие #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L горожан#!#! сроком на три года."
 mor_attract_andalusi_craftsmen_choose_source: "Выберите исходную гранадскую провинцию"
 mor_attract_andalusi_craftsmen_no_source: "@trigger_no! Ни в одной гранадской провинции нет достаточного андалусского населения"
