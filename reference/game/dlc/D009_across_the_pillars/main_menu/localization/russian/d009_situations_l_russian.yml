l_russian:
 # The Battle for the Strait
 battle_for_the_strait: "Битва за пролив"
 battle_for_the_strait_info: "Борьба за #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гибралтарский пролив#!#! между #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_INST')|L]#!#!, #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_INST')|L]#!#!. Тот, кто владеет проливом, владеет воротами, соединяющими Атлантический океан и Средиземное море."
 owner_christian_or_castile_tt: "Владелец либо #TOOLTIP:RELIGIONGROUP,christian,X #L христианская#!#! держава, либо [GetCountry('CAS').GetName]"
 cas_integrated_granada_lands_tt: "[GetCountry('CAS').GetName] напрямую владе[GetCountry('CAS').Custom('end_etyut')] и счита[GetCountry('CAS').Custom('end_etyut')] национальными все районы, которыми изначально владел[GetCountry('GRA').Custom('end_fem')] [GetCountry('GRA').GetName]"
 battle_for_the_strait_desc: "Узкая полоска воды между #TOOLTIP:REGION,iberia_region,X $tt_op_L$Иберией$tt_cl_2$ и #TOOLTIP:CONTINENT,africa,X #L Африкой#!#! образуем одну из важнейших стратегических точек в мире. [GetCountry('CAS').GetLongName] стрем[GetCountry('CAS').Custom('endlong_ityat')]ся на юг, чтобы завершить объединение Иберии под #TOOLTIP:RELIGIONGROUP,christian,X #L христианскимим#!#! знамёнами. [GetCountry('MOR').GetLongName] смотр[GetCountry('MOR').Custom('endlong_ityat')] на север, стремясь защитить землю [ShowFormableCountryName('ADU_f')] и не допустить блокады переправы для правоверных. [GetCountry('GRA').GetLongName], в окружении со всех сторон, сража[GetCountry('GRA').Custom('endlong_etyut')]ся за сохранение контроля над собственным побережьем. Победителю достанутся ключи от двух морей."
 battle_for_the_strait_castilian_supremacy: "[GetCountry('CAS').GetAdjectiveWithNoTooltip] превосходство"
 battle_for_the_strait_castilian_supremacy_desc: "$BULLET$Столетний #Y 100#! [ShowModifier('crown_of_the_reconquista_modifier')] [modifier|e]\n$BULLET$Дополнительный модификатор на [ShowGovernmentReformName('crown_castile_reform')] [government_reform|e]\n$BULLET$Доступ к [ShowDecisionName('gc_decision')] [decision|e], с которого начинается [ShowSituationName('golden_century')] [situation|e]"
 battle_for_the_strait_moroccan_supremacy: "[GetCountry('MOR').GetAdjectiveWithNoTooltip] превосходство"
 battle_for_the_strait_moroccan_supremacy_desc: "$BULLET$#Y 100#!-летний [ShowModifier('protector_of_andalus_modifier')] [modifier|e]\n$BULLET$Повышение до ранга [ShowCountryRankName('rank_empire')], если ещё не достигнут\n$BULLET$Полная [core|e] [integration|e] каждого [location|e], удерживаемого в [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] и [ShowAreaName('murcia_area')]\n$BULLET$#G 25%#! прогресса [annexation|e] к присоединению каждого [ShowSubjectTypeName('taifa')]\n$BULLET$Упрощённое формирование [ShowFormableCountryName('ADU_f')]\n$BULLET$Доступ к [ShowDecisionName('gc_decision')] [decision|e], с которого начинается [ShowSituationName('golden_century')] [situation|e]"
 battle_for_the_strait_granadan_sovereignty_preserved: "Суверенитет Гранады сохранён"
 battle_for_the_strait_granadan_sovereignty_preserved_desc: "$BULLET$Сто #Y 100#! -летний [ShowModifier('gra_consolidated_governance_modifier')] [modifier|e]\n$BULLET$Право [ShowCasusBelliName('cb_reconquer_iberia')] на отвоевание [ShowRegionName('iberia_region')] с пониженной стоимостью\n$BULLET$Полная [core|e] [integration|e] каждого [location|e], удерживаемого в [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] и [ShowAreaName('murcia_area')]\n$BULLET$#G 25%#! [annexation|e] к прогрессу каждой [ShowSubjectTypeName('taifa')] под присоединением\n$BULLET$Более лёгкое формирование [ShowFormableCountryName('ADU_f')]\n$BULLET$Доступ к [ShowDecisionName('gc_decision')] [decision|e], которое начинает [ShowSituationName('golden_century')] [situation|e]"
 battle_for_the_strait_neutral_outcome: "Нейтральный исход"
 BFTS_NEUTRAL_OUTCOMES_HEADER: "Нейтральные исходы"
 BFTS_OUTCOME_CONDITIONS_TITLE: "Условия победы"
 BFTS_OUTCOME_REWARD_TITLE: "Награда"
 this_is_castile_tt: "Это [GetCountry('CAS').GetLongName]"
 this_is_morocco_tt: "Это [GetCountry('MOR').GetLongName]"
 this_is_granada_tt: "Это [GetCountry('GRA').GetLongName]"
 this_is_a_subject_of_castile_tt: "Это [subject|e] государства [GetCountry('CAS').GetName]"
 this_is_a_subject_of_morocco_tt: "Это [subject|e] государства [GetCountry('MOR').GetName]"
 this_is_a_subject_of_granada_tt: "Это [subject|e] государства [GetCountry('GRA').GetName]"
 #Battle for the Strait — Granadan Sovereignty tracker + Influence over Granada signed axis
 BFTS_CASTILIAN_INFLUENCE_LABEL: "Иберийское влияние"
 BFTS_MOROCCAN_INFLUENCE_LABEL: "Магрибское влияние"
 BFTS_GRA_SOVEREIGNTY_LABEL: "Гранадский суверенитет"
 BFTS_GRA_SOVEREIGNTY_TITLE: "$game_concept_granadan_sovereignty$ в [Country.Custom('CL_PREP')]"
 BFTS_INFLUENCE_BAR_TITLE: "$influence_over_granada$"
 BFTS_INFLUENCE_BAR_TOOLTIP_TT: "#L [GetCountry('GRA').GetAdjective]ий#! двор колеблется по оси между $bfts_axis_min$ ([GetCountry('CAS').GetNameWithNoTooltip]) и $bfts_axis_max$ ([GetCountry('MOR').GetNameWithNoTooltip])"
 BFTS_INFLUENCE_MONTHLY_DRIFT_LABEL: "Ежемесячное смещение по оси «$influence_over_granada$»"
 # ===== Battle for the Strait (migrated from battle_for_the_strait_l_english.yml) =====
 cas_appoint_adelantado_mayor: "Назначить старшего аделантадо Флоренты"
 cas_appoint_adelantado_mayor_desc: "Впервые назначенный в 1253 г. для управления пограничными землями, отвоёванными у мавров, старший аделантадо пограничия совмещает сразу три должности: апелляционного судьи южных земель, исполнителя указов, которые издаёт [GetCountry('CAS').GetGovernment.GetRulerTitle], и командира всех отрядов кабальгады, вошедших в #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#!. От того, к какому сословию он принадлежит, зависит, какой из силовых блоков, из которых состоит [GetCountry('CAS').GetGovernment.GetCourtTitle|l], получает преимущество. Кроме того, при наличии старшего аделантадо все #L [GetCountry('CAS').GetAdjective|l]ие#! провинции, граничащие с [GetCountry('GRA').Custom('CL_INST')] или [GetCountry('GRA').Custom('CL_INST')], получают усиление постоянных гарнизонов."
 cas_appoint_adelantado_mayor_act: "$cas_appoint_adelantado_mayor$"
 cas_appoint_adelantado_mayor_concept: "[Concept('character_interaction', 'Взаимодействие c персонажем')|e]"
 cas_appoint_adelantado_mayor_past: "[SCOPE.sCharacter('recipient').GetName] — новый старший аделантадо!"
 cas_appoint_adelantado_mayor_act_past: "[SCOPE.sCountry('actor').GetName] [Select_CString(SCOPE.sCountry('actor').IsFemale, 'назначила', 'назначил' )] персонажа [SCOPE.sCharacter('recipient').GetName] на должность старшего аделантадо пограничья."
 cas_appoint_adelantado_mayor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] станет новым старшим аделантадо пограничья."
 cas_appoint_adelantado_mayor_price: "Цена назначения старшего аделантадо"
 every_province_murcia_granada_andalusia_adelantado_mayor_tt: "Все принадлежащие нам [Concept('province', 'провинции')|e] #TOOLTIP:AREA,granada_area,X #L Мурсии#!#!, #TOOLTIP:AREA,granada_area,X #L Гранады#!#! и #TOOLTIP:AREA,andalusia_area,X #L Андалусии#!#! получат преимущество от [Concept('modifier', 'модификатора')|e] «[ShowModifier('guarded_by_adelantado_mayor')]», масштабируемое с учётом [Concept('abilities', 'навыков')|e] персонажа [recipient.GetName], сроком на #G 10#! лет"
 choose_adelantado_candidate: "Выберите кандидата"
 scales_with_character_tt: "[Concept('abilities', 'Навыки')|e] персонажа [GetCountry('CAS').MakeScope.GetVariable('cas_adelantado_mayor_character').GetCharacter.GetName]"
 gra_reduce_castilian_influence: "Уменьшить кастильское влияние"
 gra_reduce_castilian_influence_desc: "Мы призовём кади, мудрецов и аристократов пограничья бороться с #L [GetCountry('CAS').GetAdjective|l]им#! влиянием при дворе и на рынках. Их постоянное давление ослабит хватку #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! на горле [GetCountry('GRA').Custom('rank_ru_GEN')|l]."
 gra_reduce_moroccan_influence: "Уменьшить марокканское влияние"
 gra_reduce_moroccan_influence_desc: "Мы отправим через пролив посланников со щедрыми дарами и тихими предупреждениями, чтобы отвратить от #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#! племена и порты, поддерживающие двор этой державы. Без них #L [GetCountry('MOR').GetAdjective|l]ий#! ошейник на горле [GetCountry('GRA').Custom('rank_ru_GEN')|l] постепенно ослабнет."
 gra_construct_alhambra: "Инициировать расширение Альгамбры"
 gra_construct_alhambra_desc: "[GetCountry('GRA').GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] и [Select_CString(GetCountry('GRA').GetGovernment.GetRulerOrRegent.IsFemale, 'её', 'его' )] [GetCountry('GRA').GetGovernment.GetCourtTitle] созывают насридских каменщиков, каллиграфов и резчиков #italic мукарнасов#!, чтобы заложить фундамент нового крыла королевской цитадели. Каждое такое расширение теснее связывает династию с её столицей, а также увеличивает роскошь дворца на холме Сабика и численность его гарнизона."
 gra_construct_alhambra_max_tt: "[ShowBuildingTypeName('alhambra')] ещё не достигла четвёртого уровня"
 gra_construct_alhambra_increment_tt: "Добавляет #G +1#! к максимальному уровню постройки «[ShowBuildingTypeName('alhambra')]»"
 gra_alhambra_extension_desc: "В ситуации «[ShowSituationName('battle_for_the_strait')]» отданы распоряжения о расширении постройки «[ShowBuildingTypeName('alhambra')]»"
 unlock_upgrade_alhambra_decision_tt: "Разблокирует [Concept('decision', 'решение')|e] «[ShowDecisionName('expand_the_alhambra')]»"
 until_we_cease_our_projection_efforts_tt: "Пока мы поддерживаем действие этого [Concept('modifier', 'модификатора')|e]"
 adu_proclaim_crown_al_andalus: "Провозгласить Корону Аль-Андалуса"
 adu_proclaim_crown_al_andalus_desc: "Утвердив свою власть над #TOOLTIP:CONTINENT,europe,X #L Европой#!#!, мы провозглашаем Корону Аль-Андалуса, которая объединит все тайфы #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, возродив величие #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#! и на словах, и на деле."
 gra_enforce_sovereignty: "Объявление суверенитета"
 gra_enforce_sovereignty_desc: "[GetCountry('GRA').GetFlavorRank], чьими землями мы правим, отказывается подчиняться как #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#!, так и #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#!. Это укрепляет нашу власть внутри страны, но осложняет переговоры с другими державами. По мере необходимости мы можем поднимать знамя своего суверенитета или, напротив, приспускать его."
 attract_andalusi_refugees: "Пригласить мудехаров"
 attract_andalusi_refugees_desc: "Арабское слово #italic мудаххан#! означает «те, кому разрешено остаться». Христиане переиначили его в «мудехар», называя так мусульманских жителей своих завоёванных земель. Мы отправим в эти земли посланников с обещанием приютить тех, кто предпочтёт наш закон власти иноверцев. Каждый такой акт гостеприимства вызовет волну переселенцев из выбранного христианского королевства в одну из наших провинций."
 bfts_attract_andalusi_refugees_tt: "Мы предложим беженцам-мудехарам из #TOOLTIP:REGION,iberia_region,X #L иберийской#!#! [Concept('province', 'провинции')|e] переселиться в наши земли"
 attract_refugees_choose_source: "Выберите исходную провинцию"
 attract_refugees_choose_destination: "Выберите провинцию назначения"
 gra_invite_shadhili_order_effect_tt: "Открывает доступ к действию «[ShowGenericActionName('gra_patronize_shadhili_order')]», которое ускоряет движение к #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L правовой системе#!#!, увеличивает ежемесячный прирост [Concept('legitimacy', 'легитимности')|e] и повышает [Concept('cabinet_efficiency', 'эффективность совета')|e] в ущерб [Concept('tax_efficiency', 'налоговой эффективности')|e]"
 gra_patronize_shadhili_order: "Покровительство шазилийского ордена"
 gra_patronize_shadhili_order_desc: "Шазилийский #italic тарикат#!, основанный при нашем дворе, зависит от милости короны. Впрочем, поддержка его #italic завий#! и мудрецов подобна обоюдоострому мечу: позволяя голосам святых звучать на наших советах, она в то же время отнимает средства, которые могли бы пополнить нашу казну. Мы можем прекращать и возобновлять эту поддержку по своему усмотрению."
 start_patronizing_shadhili_order_tt: "Мы продолжим поддерживать Шазилийский тарикат, что даст нам следующие эффекты:\n [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
 stop_patronizing_shadhili_order_tt: "Мы перестанем поддерживать Шазилийский тарикат, что приведёт к прекращению следующих эффектов: [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
 until_we_cease_our_patronship_tt: "$until_we_cease_our_projection_efforts_tt$"
 action_active: "[Concept('action', 'Действие')|e] выполняется"
 unlock_patronize_shadhili_order_tt: "Открывает доступ к [Concept('action', 'действию')|e] «[ShowGenericActionName('gra_patronize_shadhili_order')]» в [Concept('situation', 'ситуации')|e] «[ShowSituationName('battle_for_the_strait')]»"
 hire_granadan_jinetes: "Нанять гранадских хинетов"
 hire_granadan_jinetes_desc: "#TOOLTIP:CULTURE,$andalusi_tt$,X #L Андалусские#!#! аристократы, обитатели приграничных #italic кампо#!, чьи короткие мечи и острые дротики сформировали облик кавалерии всех соседних стран, тревожатся, видя, что приближается [ShowSituationName('battle_for_the_strait')]. Приготовив кошели с серебром, мы сможем привлечь в столицу этих всадников, знающих каждый ров и каждую сторожевую башню от #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#! до #TOOLTIP:LOCATION,almeria,X #L Альмерии#!#!."
 hire_granadan_jinetes_traditional_tt: "Мы соберём в [Concept('capital', 'столице')|e] 2 отряда следующих воинов: [ShowUnitDefinitionName('a_granadan_jinetes')]"
 hire_granadan_jinetes_modern_tt: "Мы соберём в [Concept('capital', 'столице')|e] 2 отряда следующих воинов: [ShowUnitDefinitionName('a_granadan_jinetes_2')]"
 cas_demand_muslim_converts: "Потребовать обращения мусульман"
 cas_demand_muslim_converts_desc: "Требование к властям [GetCountry('GRA').Custom('CL_GEN')] выдать ленника #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманской#!#! веры, который после прибытия к нашему двору будет крещён и получит новое #L [GetCountry('CAS').GetReligion.GetGroup.GetAdjective|l]ое#! имя. Разумеется, у него будут свои таланты и недостатки, так что мы не сможем заранее сказать, для какой должности он подойдёт."
 cas_demand_muslim_converts_select_title: "Выберите мусульманского ленника"
 cas_demand_muslim_converts_no_characters: "@trigger_no! При гранадском дворе нет подходящих мусульманских ленников"
 cas_demand_muslim_converts_price_abilities: "Способности персонажа"
 cas_demand_muslim_converts_effect_tt: "Выбранный [Concept('character', 'персонаж')|e] прибудет к нашему двору, перейдёт в христианство и поступит на нашу службу в ходе [Concept('event', 'событие')|e], исход которого масштабируется в зависимости от [Concept('abilities', 'навыков')|e] этого персонажа"
 cas_dismantle_fortifications: "Разбор укреплений"
 cas_dismantle_fortifications_desc: "Приказ нашему #L [GetCountry('GRA').GetAdjective|l]ому#! #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассалу#!#! разобрать укрепления в указанном районе. Полученный камень, лесоматериалы и обработанная каменная кладка будут вывезены на север и поступят на иберийские рынки, а [GetCountry('GRA').GetFlavorRank|l] станет ещё немного больше зависеть от наших гарнизонов."
 cas_dismantle_fortifications_select_title: "Выберите район Гранады для разбора укреплений"
 cas_dismantle_fortifications_no_locations: "@trigger_no! В Гранаде нет укреплённых районов"
 cas_dismantle_fortifications_effect_tt: "Все [Concept('building', 'сооружения')|e] класса «форт» в выбранном [Concept('location', 'районе')|e] будут разрушены. Полученные при этом товары поступят на наши [Concept('markets', 'рынки')|e], но [Concept('liberty_desire', 'желание свободы')|e] нашего ленника усилится, а его мнение о нас надолго ухудшится."
 cas_dismantle_fortifications_salvage_tt: "[Concept('goods_demand', 'Спрос')|e] на [Concept('goods', 'товары')|e] для строительства на всех наших [Concept('markets', 'рынках')|e] снижается на #G 2#! года из-за действия «[ShowGoodsDemandName('cas_dismantled_forts_salvage')]», что приводит к удешевлению наших [Concept('buildings', 'сооружений')|e]"
 cas_dismantled_forts_salvage: "Разобраны гранадские укрепления"
 opinion_dismantled_our_forts: "Разобраны наши укрепления"
 cas_reduce_granadan_sovereignty: "Ограничить гранадский суверенитет"
 cas_reduce_granadan_sovereignty_desc: "Оказав давление на нашего #L [GetCountry('GRA').GetAdjective|l]ого#! #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассала#!#!, мы лишим его части независимых институтов и интегрируем чиновников его [GetCountry('GRA').Custom('rank_ru_GEN')|l] в нашу собственную иерархию. Однако в результате этого [GetCountry('GRA').GetGovernment.GetCourtTitle] [GetCountry('GRA').Custom('CL_GEN')] станет относиться к нам существенно хуже, а узы верности станут хрупкими."
 BFTS_REDUCE_SOVEREIGNTY_REQUIRES_HOLD: "[GetCountry('GRA').GetName] должна быть нашим ленником, либо наше влияние в проливе должно достичь #Y господства#!"
 opinion_pressured_our_sovereignty: "Оказано давление на наш суверенитет"
