l_russian:
 seven_cities_quivira.1.title: "Травы и саман"
 seven_cities_quivira.1.desc: "После двух месяцев странствия по равнинам отряд наконец добрался до земель, о которых рассказывал Эль Турко. Здесь действительно есть поселение — по меркам этих бескрайних степей довольно крупное. Но это не каменная столица, а деревня с круглыми домами под крышами из травы. Вождь — высокий мужчина, закутанный в плащ из шкуры бизона. Его люди выращивают маис и бобы в речных поймах, а в открытой степи охотятся на бизонов. Никакого золота здесь нет. Под давлением Эль Турко признаётся, что пуэбло сказали ему увести наш отряд как можно дальше от своих земель. [target_leader.GetName] приказывает повесить его."
 seven_cities_quivira.1.a: "Уводим отряд. Здесь только степь — и ложь."
 seven_cities_quivira.1.historical_info: "К лету 1541 года Коронадо добрался до Кивиры (сегодня это — территория штата Канзас). Здесь он обнаружил только поселения земледельцев-уичита, протянувшиеся вдоль реки Арканзас. Никакого золота в Кивире не было, а были только круглые дома, крытые травой. Проводник отряда — пауни по прозвищу Эль Турко вёл людей Коронадо на восток c территории современного штата Нью-Мексико, обещая несметные богатства. В конце концов он признался, что пуэбло послали его увести отряд как можно дальше от своих земель, надеясь, что испанцы уже не вернутся. По приказу Коронадо солдаты задушили его. Зимой отряд отправился обратно, и по возвращении конкистадор сообщил Мендосе, что в этих землях нет ничего настолько ценного, для чего понадобилась бы целая армия."
 seven_cities_quivira.2.title: "Плодородная земля, но ни грамма золота"
 seven_cities_quivira.2.desc: "Раскинувшиеся перед нами земли по-своему богаты: плодородные речные долины обильно засеяны маисом, на опушках пасутся стада бизонов, а местные жители настроены миролюбиво и готовы торговать с нами. [target_leader.GetName] получает в подарок от вождя связку зелёных речных камней, которые летописец сперва принимает за нефрит. Испанский золотых дел мастер тут же его поправляет: это не нефрит, а какой-то мягкий зелёный камень, которого он прежде не видел. Красивый, но почти ничего не стоящий у нас на родине. Нет, мы искали совсем другие земли, но и здесь есть чем поживиться. Придётся перерисовать карты."
 seven_cities_quivira.2.a: "Возьмём диковинные камни домой. Нанесём эти земли на карты."
 seven_cities_quivira.2.historical_info: "Офицеры Коронадо писали, что Великие равнины хорошо подходят для разведения скота и выращивания зерна, но бедны товарами, ради которых здесь стоило бы основывать колонию. Это мнение сохранялось более двух столетий: Испания так и не стала колонизировать Великие равнины, а последовавшие за ней французские и британские экспедиции строили здесь фактории, но никак не полноценные поселения. Освоение региона всерьёз началось лишь в конце XIX века. До сих пор доподлинно неизвестно, какие именно камни уичита подарили Коронадо. Вероятнее всего, это был мягкий серпентинит, поступавший сюда с месторождений на юго-западе."
 seven_cities_quivira.3.title: "Подтверждение легенды"
 seven_cities_quivira.3.desc: "Эль Турко говорил правду. Всё здесь именно так, как он описывал: перед нами — богатое царство с обнесёнными каменными стенами городами, что раскинулись среди рек и бескрайних травянистых равнин. Во главе его стоит совет вождей, который собирается в большом доме из дерева, украшенном бирюзой. Здесь добывают золото — его крупицы приносят ручьи, стекающие с западных гор. В предметах убранства вождей есть и серебро. Мы выставляем перед местными жителями товары и добиваемся того, чтобы священнику разрешили беспрепятственно пройти через деревню. Они готовы принять наше посольство. [target_leader.GetName] посылает за подкреплением ещё до того, как запечатать первое донесение."
 seven_cities_quivira.3.a: "Водрузим здесь знамя. Мы нашли искомое."
 seven_cities_quivira.3.historical_info: "Кивира так и осталась несбыточной мечтой испанских аделантадо, действовавших к северу от Новой Испании. Легенда гласила, что это — богатое царство, укрытое где-то в глубине материка, и, если бы оно действительно существовало, испанская корона получила бы вескую причину закрепиться на Великих равнинах, а история Северной Америки пошла совсем иначе. Миф оказался живучим: европейские картографы наносили Кивиру на карты примерно там, где её когда-то искали, вплоть до XVIII века. К тому времени французские торговцы мехами, обосновавшиеся в бассейне Миссисипи, уже составили подлинные карты местности."
 seven_cities_quivira.10.title: "Два проводника"
 seven_cities_quivira.10.desc: "Перед экспедицией стоят двое жителей Великих равнин. Их привезли через океан ещё во время одного из прежних плаваний и с тех пор содержали за счёт портового управления. На вопрос о Кивире старший — его зовут [target_character.GetName] — отвечает рассказом о царе, который спит под деревом, украшенном золотыми колокольчиками, о каноэ с позолоченными носами и о серебряной посуде на столах. Младший, [second_guide.GetName], на тот же вопрос отвечает совсем иначе: по его словам, Кивира — это край бесконечных травянистых просторов, открытого неба и полноводных рек. Его народ живёт в соломенных хижинах и охотится на горбатых животных. Они явно рассказывают о разных местах. Взять с собой мы можем только одного."
 seven_cities_quivira.10.a: "Возьмём с собой старшего. Нам нужно больше золота."
 seven_cities_quivira.10.b: "Возьмём с собой младшего. Он обещает мало, а значит, вряд ли врёт."
 quivira_gold_guide_tt: "[target_character.GetName] присоединяется к нам в качестве проводника"
 quivira_grass_guide_tt: "[second_guide.GetName] присоединяется к нам в качестве проводника"
 seven_cities_quivira.10.historical_info: "Проводниками для экспедиции Коронадо служили два пленных индейца — жители Великих равнин. Первого испанцы прозвали Эль Турко; он описывал Кивиру как богатое царство, где правитель спит под деревом, увешанным золотыми колокольчиками, и ест из серебряной посуды. Другим был уичита Исопете, который твердил, что в Кивире нет никакого золота и что Эль Турко лжёт. Отряд решил поверить Эль Турко — и этот выбор обошёлся куда дороже. Как позже выразился один из ветеранов экспедиции, после тысячи лиг пути особенно хочется, чтобы правдой оказалась самая красивая история."
 seven_cities_quivira.11.title: "Тридцать копий"
 seven_cities_quivira.11.desc: "Впереди раскинулся целый материк. Едва ли весь отряд сможет пересечь его — на просторах между стоянкой и Кивирой попросту не будет столько пищи. В лучшем случае запасов хватит на тридцать человек. [target_leader.GetName] раскладывает на рундуке список присутствующих и поимённо решает, кому предстоит отправиться на север, а кому — остаться охранять корабли и припасы. У каждого в лагере есть своё мнение насчёт этого списка, но все заботы так или иначе сводятся к одному: в какой части листа окажется его собственное имя."
 seven_cities_quivira.11.a: "Возьмём тридцать всадников и компас. Остальные останутся на берегу."
 seven_cities_quivira.11.b: "Пойдём всем отрядом — с обозами и стадами. Нужно обязательно проявить силу."
 quivira_train_left_behind_tt: "Наши проводники и носильщики остаются вместе с обозами"
 seven_cities_quivira.11.historical_info: "Добравшись до Рио-Гранде после тяжёлой зимы, омрачённой враждой с пуэбло, и нелёгкой весны, грозившей отряду голодной смертью, Коронадо отослал большую часть своих людей обратно. Сам же он отправился к Кивире всего с тридцатью всадниками. По безжизненной равнине они передвигались с помощью компаса, каждый день отсчитывая пройденное расстояние. Привычные способы ориентирования были почти бесполезны на равнинах: скрывшийся из виду отряд мог бесследно исчезнуть на однообразной местности, а стада бизонов за несколько часов затаптывали любую тропу. И всё же тридцать всадников добрались до Кивиры, совершив подвиг, который оказался бы не под силу отряду из трёхсот человек."
 seven_cities_quivira.12.title: "Море трав"
 seven_cities_quivira.12.desc: "У этой равнины нет конца и края. Уже двенадцать дней отряд идёт по траве, которая смыкается за ним, словно вода. Стада горбатых быков, обступившие людей со всех сторон, протянулись до самого горизонта. На четвёртый день пути один из охотничьих отрядов скрылся из виду — и с тех пор уже не появился. Путь приходится отмечать кучами бизоньего помёта: здесь нет ни камней, ни деревьев. Всё, что у нас есть для навигации, — это компас и пометки о пройденном расстоянии."
 seven_cities_quivira.12.desc_false_guide: "Чем шире становится равнина, тем молчаливее делается проводник. Он больше не считает, сколько дней осталось до конца пути, и старается не смотреть в глаза тем, кого ведёт. У костров его рассказы пересказывают совсем с другой интонацией — в голоса вкрадывается досада, и [target_leader.GetName] без лишних слов удваивает охрану при проводнике. В этих краях ему некуда бежать — и это, пожалуй, единственное, что ещё успокаивает."
 seven_cities_quivira.12.desc_true_guide: "Проводник, пообещавший нам вместо золота бесконечные травяные просторы, оказался человеком слова — и не только: он знает равнину так, как опытный штурман знает море. Он помнит, какие реки поворачивают на север, где проходят стада и какие звёзды — путеводные. Каждый вечер он чертит для летописца на золе положение отряда, и на следующий день эти отметки неизменно оказываются верными. Золота в его стране нет, уверяет он. Но это не страшно — бывают вещи и похуже отсутствия золота."
 seven_cities_quivira.12.a: "Последуем за ним."
 seven_cities_quivira.12.b: "Доверимся человеку, который ещё ни разу не солгал."
 seven_cities_quivira.12.c: "Идём на север, куда указывает стрелка. Будем считать каждый шаг."
 seven_cities_quivira.12.historical_info: "Путь экспедиции Коронадо по Великим равнинам был, если верить летописцам, подобен вызванному белой горячкой кошмару: земля была настолько ровной и однообразной, что человек, отъехавший от отряда на расстояние полёта стрелы, сразу терялся из виду. Трава быстро распрямлялась за копытами и не оставляла следа, а ориентироваться приходилось только по компасу и редким кучам костей и навоза; кроме того, обязательно приходилось считать шаги. Когда Коронадо добрался до Кивира, Эль Турко признался: пуэбло велели ему увести испанцев с расчётом, что они заблудятся и погибнут. Этот замысел им почти удался: ещё немного — и природа взяла бы своё."
 seven_cities_quivira.13.title: "Горбатые звери"
 seven_cities_quivira.13.desc: "Сначала разведчики сообщают, что видят на горизонте бурое облако, затем — что движущийся холм. К полудню всё становится ясно: перед отрядом — бесчисленное стадо лохматых горбатых животных, настолько огромное, что его нельзя описать словами. Стадо расступается перед идущими подобному тому, как разделяются обтекающие камень речные воды, затем вновь смыкается и тянется до самого горизонта. Интендант ведёт своего коня нарочито неторопливо; он не считает шаги, не говорит ни слова и лишь смотрит вокруг взглядом оголодавшего человека, вдруг оказавшегося в амбаре размером с целую провинцию."
 seven_cities_quivira.13.a: "Сделаем остановку и будем охотиться, пока не заполним вьюки мясом."
 seven_cities_quivira.13.b: "Пойдём насквозь. Мы охотимся за золотом; животные нас не интересуют."
 seven_cities_quivira.13.b.tt: "#italic Колонна идёт вперёд без остановки. Отряд вынужден есть солонину, хотя вокруг много дичи#!"
 quivira_hides_and_meat_tt: "#Y Вьюки заполнены шкурами и вяленым мясом. Носильщики отнесут их обратно#!"
 seven_cities_quivira.13.historical_info: "Летописцам экспедиции Коронадо трудно было подобрать слова для описания бизонов. Этих животных описывали как горбатых коров с бородами, словно у коз; стада их были настолько многочисленны, что могли задержать экспедицию на несколько дней, а там, где проходили бизоны, оставалась только вытоптанная земля. В пути отряд Коронадо питался в основном именно мясом бизонов — животных настолько удивительных для испанцев, что, по воспоминаниям ветеранов, они вызывали даже больше удивления, чем Кивира. Некоторые даже утверждали, что единственное богатство этих земель — именно бизоны. Однако у Испании и без того хватало собственного скота."
