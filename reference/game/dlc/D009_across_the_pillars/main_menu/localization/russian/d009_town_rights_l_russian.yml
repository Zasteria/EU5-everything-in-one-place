l_russian:
 andalusi_refugee_town_rights: "Хартия андалусских беженцев"
 andalusi_refugee_town_rights_desc: "Этому поселению были дарованы особые хартии для привлечения ремесленников, учёных и торговцев, которых вытесняют из Аль-Андалуса внешние силы и волнения предшествующей эпохи. Беженцы обогащают наши города своей культурой и привозят товары, тем самым укрепляя местное производство. Мы приветствуем их и надеемся, что они обретут дом в наших землях."
 andalusi_resettlement_town_rights: "Андалусийское переселение"
 andalusi_resettlement_town_rights_desc: "Это поселение открыто для ремесленников и земледельцев аль-Андалуса, переселённых сюда по грамотам, гарантирующим их дома, мастерские и права на воду для их садов. Они приходят не как беженцы, гонимые войском, а как поселенцы, приглашённые остаться, принося с собой шёлковые станки, оросительные каналы и рыночные ремёсла юга. Слух о таких условиях быстро разносится, и там, где первые семьи преуспели, за ними следуют другие."
 andalusi_resettlement_golden_age_town_rights: "Переселение Золотого века"
 andalusi_resettlement_golden_age_town_rights_desc: "Наше господство над проливом сделало это поселение желанным пристанищем для изгнанных талантов аль-Андалуса. Шелкоткачи и лекари, математики и зодчие прибывают целыми кораблями, а грамоты, что мы им дарим, самые щедрые на всём полуострове. То, что начиналось как редкий ручеёк поселенцев, обернулось рождением целой эпохи, и здешние мастерские трудятся в таком темпе, какого не сыскать ни в одной соперничающей гавани."
 iberian_aljama_charter: "Хартия альхамы"
 iberian_aljama_charter_desc: "Хартия #italic альхамы#! придаёт автономной мусульманской общине в этом районе официальный статус, тем самым признавая её право на самоуправление, свободное исповедание ислама и сбор налогов среди местного населения. Принимая эту хартию, мы разрешаем общине содержать свои мечети, рынки и социальные учреждения в обмен на её продуктивное участие в нашей экономике. Подобные общественные договоры нередко встречаются в городах Иберийского полуострова, поскольку управление территориями, где одновременно проживают христиане и мусульмане, требует особого подхода."
 mozarab_charter_town_rights: "Мосарабская грамота"
 mozarab_charter_town_rights_desc: "Мы подтвердили древний договор с #italic мустарибун#! этого поселения — арабизированными христианами, что хранили свою литургию и латинские книги на протяжении многих поколений нашего правления. Их духовенство подчиняется собственному епископу, а их споры решают собственные судьи, и взамен они безропотно платят #italic джизью#! и не поднимают на нас руки. Поселение от этого стало спокойнее, и разговоры о свержении нашей власти не находят отклика на улицах, где и так дарован тот покой, за который в иных местах восстают. Впрочем, община, столь уверенная в собственных обрядах, вряд ли станет от них отказываться."
 medina_charter_town_rights: "Хартия Медины"
 medina_charter_town_rights_desc: "Свод законов #italic Медины#! теперь распространяется и на это поселение — городской квартал ограждается стеной, управляется #italic каидом#! и контролируется #italic мухтасибом#!, а власть здесь отвечает за рынки, улицы и общественную мораль. Благодаря этим законам мы извлечём больше выгоды из плотной городской застройки. Древний городской план улиц не позволяет быстро возводить новые здания, но зато обеспечивает порядок, благодаря чему это поселение становится краеугольным камнем магрибской администрации."
 mzab_pentapolis_town_rights: "Мзабское пятиградье"
 mzab_pentapolis_town_rights_desc: "Этому поселению были дарованы хартии долины Мзаб, согласно которым ибадитские города управляются аскетичным советом #italic аззаба#! — общественно-религиозным органом, который отвечает как за торговлю, так и за соблюдение законов. Закон разрешает контролируемую торговлю, объединяет жителей и превращает поселение в стабильный и самостоятельный анклав. Горожане могут вести здесь спокойную и процветающую жизнь."
 tribal_souk_town_rights: "Хартия племени Соук"
 tribal_souk_town_rights_desc: "Это поселение стало племенным городом для периодической торговли — #italic суком#!. Здесь племена могут встретиться, чтобы поторговаться, разрешить споры и возобновить соглашения друг с другом. Всё это крайне выгодно для племён, поэтому они практически автономно управляют городом, наше влияние там ограничено. Объёмы товаров, проходящих через это поселение, привлекают сюда караваны из ближайших земель."
 taifa_al_rais_town_rights: "Тайфа реисов"
 taifa_al_rais_town_rights_desc: "Этот порт принадлежит #italic тайфе реисов#! — постоянному объединению пиратских капитанов, ходящих вдоль всего берберского побережья от Сале до Триполи. Их совет управляет гаванью, привлекая в неё опытных моряков. Там, куда заходят корабли реисов, не бывает недостатка в матросах."
 sale_arsenal_town_rights: "Арсенал Сале"
 sale_arsenal_town_rights_desc: "Королевский арсенал Сале, также известный как #italic дар аль-синаа#!, расположен в устье реки Бу-Регрег. Именно здесь маринидские корабелы строят и оснащают суда, которые несут наш флаг в Атлантку. При арсенале есть постоянный штат опытных мастеров и лоцманов, так что найти команду для спущенного на воду корабля не составляет труда. Больше ни одна гавань на этои побережье не может оснастить целый флот с такой лёгкостью."
 guich_charter_town_rights: "Договор с гишами"
 guich_charter_town_rights_desc: "Мы поселили в этих землях одно из племён гишей, также известных как #italic джайш#!, дав ему поля, пастбища и освобождение от налогов в обмен на обязательство защищать трон. Их всадники готовы явиться на войну по первому зову, а женщины с детства готовят сыновей к седлу, а не плугу. Эти гиши не платят золота в казну, зато обеспечивают армию превосходно обученными воинами."
