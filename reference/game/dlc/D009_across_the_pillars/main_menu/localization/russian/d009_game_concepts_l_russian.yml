l_russian:
 game_concept_granadan_sovereignty: "Гранадский суверенитет"
 game_concept_granadan_sovereignty_desc: "Мера свободы самоуправления #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! в ситуации «[ShowSituationName('battle_for_the_strait')]» — конфликте с участием #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#!. Может принимать значения от #Y 0#! до #Y 100#!.\n\nЧем выше суверенитет, тем сильнее центральная власть. Вместе с суверенитетом укрепляются [Concept('stability', 'стабильность')|e], ежемесячная [Concept('legitimacy', 'легитимность')|e] и [Concept('political_influence', 'политическое влияние')|e], а также [Concept('max_control', 'максимальный контроль')|e] над землями [GetCountry('GRA').Custom('CL_GEN')]. Показатель гранадского суверенитета также влияет на верность [Concept('estates', 'сословий')|e] и ленников. Суверенитет повышается, пока сохраняются независимость и мир, и падает, если державу превращают в ленника, втягивают в войну или же если трон подвергается влиянию со стороны [GetCountry('CAS').Custom('CL_GEN')] либо [GetCountry('MOR').Custom('CL_GEN')]. Чем выше суверенитет, тем выше вероятность, что [GetCountry('GRA').Custom('CL_DAT')] удастся пережить конфликт, не потеряв независимость."
 game_concept_gc_colonial_dominance: "Колониальное доминирование"
 game_concept_gc_colonial_dominance_desc: "Мера влияния, которое главная [Concept('country', 'держава')|e] в ситуации «[ShowSituationName('golden_century')]» располагает в Новом Свете. Постепенно растёт благодаря колонизации, движению флотов с сокровищами и обращению заморского населения в христианство. Пока действует ситуация, по мере увеличения доминирования будут открываться уникальные события и бонусы к репутации."
 game_concept_gc_european_dominance: "Европейское доминирование"
 game_concept_gc_european_dominance_desc: "Мера влияния, которым главная [Concept('country', 'держава')|e] в ситуации «[ShowSituationName('golden_century')]» располагает в Европе. Постепенно растёт благодаря победам в континентальных войнах, удержанию ключевых владений, а также династическому и религиозному превосходству. Пока действует ситуация, по мере увеличения доминирования будут открываться уникальные события и бонусы к репутации."
 game_concept_flashpoint: "Переломный момент"
 game_concept_flashpoint_desc: "Момент, который наступает, когда ситуация «[ShowSituationName('golden_century')]» достигает критической стадии. Переломный момент запускает событие, способное изменить всю державу, — к лучшему или к худшему: принести мощный бонус, развязать гражданскую войну или вызвать другие потрясения, которые изменят облик государства."
