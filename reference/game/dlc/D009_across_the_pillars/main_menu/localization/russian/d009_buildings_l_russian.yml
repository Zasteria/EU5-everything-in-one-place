l_russian:
 tali_a_watchtower: "Дозорная башня талаи"
 tali_a_watchtower_desc: "Каменная башня андалусской береговой охраны, служащая одновременно наблюдательным пунктом и небольшим укреплённым форпостом. Такие башни стоят цепями вдоль южного побережья; их гарнизоны замечают налётчиков задолго до высадки и удерживают берег, пока сигнальные огни созывают ополчение из внутренних областей."
 thagr_fort: "Крепость сагр"
 thagr_fort_desc: "Пограничная крепость #italic сагр#! — стоит на рубежах, где наш эмират соприкасается с землями христианских королей. Возведённое на вершине холма или у дороги, это укрепление и его сторожевые посты облагают пошлиной все караваны, пересекающие нашу границу. Оно сдерживает наступление христиан, лишает их армии фуража и воды, а также даёт нашим всадникам место для сбора и пополнения припасов во время рейдов против врага."
 saqaliba_barracks: "Казармы сакалибов"
 saqaliba_barracks_desc: "Арсенал и плац для #italic сакалибов#!, воинов-рабов королевского дома. Здесь они получают оружие, хранят порох и клинки, а также собираются для военных учений. От этих ворот войско выступает к границе, и сюда же возвращаются вербовщики со свежим пополнением."
 saqaliba_barracks_maintenance: "Содержание казарм сакалибов"
 EFFECTIVE_SAQALIBA_BARRACKS: "Казармы сакалибов"
 EFFECTIVE_ROYAL_COURT_BUILDINGS: "Действующие здания «[ShowBuildingTypeName('royal_court')]»"
 qadi_office: "Палата кади"
 qadi_office_desc: "#italic Кади#! — это судья шариатского права, чья обитель служит оплотом правосудия в любом городе правоверных. Назначаемый из столиц наших вассальных государств, #italic кади#! разрешает споры, регистрирует договоры и соизмеряет каждую жалобу с нормами #italic шариата#!. Его власть поддерживает порядок нашего дома, усмиряет строптивцев и укрепляет преданность подданных своему сюзерену."
 qadi_office_maintenance: "Содержание кади"
 can_only_be_built_via_qadi_gc_action_tt: "Это [Concept('building', 'сооружение')|e] нельзя построить привычным способом. Его можно только основать в [Concept('capital', 'столице')|e] [Concept('subject', 'ленника')|e] с помощью [Concept('action', 'действия')|e] «[ShowGenericActionName('adu_build_qadi_office')]», доступного в [Concept('situation', 'ситуации')|e] «[GetSituationByKey('golden_century').GetName]» при достижении нами #Y 75#! ед. [Concept('gc_colonial_dominance', 'колониального доминирования')|e]"
 madinat_al_zahra: "Мадина аз-Захра"
 madinat_al_zahra_desc: "Известная как «Сияющий город», $madinat_al_zahra$ позволит нам укрепить наш престиж в регионе [ShowRegionName('iberia_region')]."
 palazzo_ajutamicristo: "Палаццо Аюта-Мичкристо"
 palazzo_ajutamicristo_desc: "Чтобы украсить второстепенный двор в регионе [ShowRegionName('italy_region')], строительство $palazzo_ajutamicristo$ было заказано как государством, так и купеческими семьями, став демонстрацией престижа и богатства."
 italian_court_building: "[ShowCultureGroupNameWithNoTooltip('italian_group')] двор"
 italian_court_building_desc: "Поддерживая дворы как в нашем основном государстве, так и в регионе [ShowRegionName('italy_region')], мы сможем эффективнее управлять обоими дворянствами."
