l_russian:
 cb_partition: "Разделение"
 cb_partition_desc: "Наше превосходство над #TOOLTIP:CONTINENT,europe,X #L Европой#!#! не вызывает никаких сомнений, а разжиревшие на своих землях державы, осмеливающиеся нам противостоять, не имеют никакого права на свои владения. Мы сокрушим врагов и вернём каждой угнетённой стране право самостоятельно управлять своей территорией."
 cb_restore_ummayad_caliphate: "Восстановить границы Омейядского халифата"
 cb_restore_ummayad_caliphate_desc: "Когда-то из Куртубы династия Омейядов правила всем Аль-Андалусом, а великолепию и учёности её двора завидовал весь мир. Сегодня от этой славы остались лишь осколки, а земли Омейядов раздроблены и поделены между мелкими эмирами, недостойными столь великого наследия. Мы вновь объединим правоверных под властью одного халифа и поднимем знамя Омейядов над Куртубой."
 war_goal_restore_ummayad_caliphate: "$cb_restore_ummayad_caliphate$"
 war_goal_restore_ummayad_caliphate_desc: "$cb_restore_ummayad_caliphate_desc$"
 RESTORE_UMMAYAD_CALIPHATE_WAR_NAME: "$NUM$-я война за восстановление Омейядского халифата против державы $SECONDNAME$"
 cb_reconquer_iberia: "Отвоевание Иберии"
 cb_reconquer_iberia_desc: "Держава, некогда господствовавшая над всей #TOOLTIP:REGION,iberia_region,X #L Иберией#!#!, пала. Её хватка разжалась, земли стали лёгкой добычей. Те, кто выступал против неё в коалиции, теперь могут поделить полуостров между собой и захватить территории, которые павший колосс больше не способен удержать, потратив на это меньше средств."
 war_goal_reconquer_iberia: "$generic_war_goal_superiority$"
 war_goal_reconquer_iberia_desc: "$generic_war_goal_superiority_desc$"
 PARTITION_WAR_NAME: "$NUM$-й раздел державы $SECONDNAME$"
 war_goal_partition_superiority: "$generic_war_goal_superiority$"
 war_goal_partition_superiority_desc: "$generic_war_goal_superiority_desc$"
 peace_partition: "Разделение"
 peace_partition_desc: "Мы подвергнем нашего побеждённого врага разделу и восстановим независимость всех держав, которые претендуют на земли внутри его границ."
 peace_partition_entry: "Разделить @[TARGET_COUNTRY.GetFlag]! #ONCLICK:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.Custom('CL_tt')],X [TARGET_COUNTRY.Custom('CL_ACC')|L]#!#!"
 peace_partition_entry_short: "Разделить @[TARGET_COUNTRY.GetFlag]! [TARGET_COUNTRY.Custom('CL_ACC')]"
 peace_partition_tt: "Освободить все державы, чьи национальные районы находятся на территории побеждённой державы."
 cb_grand_alliance: "Великий союз"
 cb_grand_alliance_desc: "Опасаясь бесконтрольного возвышения одного государства, державы мира заключают союз с целью осадить выскочку и восстановить равновесие сил."
 war_goal_grand_alliance_superiority: "$generic_war_goal_superiority$"
 war_goal_grand_alliance_superiority_desc: "$generic_war_goal_superiority_desc$"
 GRAND_ALLIANCE_WAR_NAME: "Великий союз против державы $SECONDNAME$"
 AI_CURB_DOMINANCE: "Могущество колосса нужно ограничить"
 pt_curb_european_dominance: "Ограничить европейское доминирование"
 pt_curb_european_dominance_desc: "С господством нашего врага в #TOOLTIP:CONTINENT,europe,X #L Европе#!#! будет покончено. По условиям этого мира он лишится всего накопленного влияния, и на континенте вновь воцарится равновесие."
 pt_curb_european_dominance_entry: "Ограничить европейское доминирование"
 pt_curb_european_dominance_entry_short: "Ограничить европейское доминирование"
 pt_curb_european_dominance_tt: "[Concept('gc_european_dominance', 'Европейское доминирование')|e] побеждённого колосса уменьшается на #Y 25#! ед."
 pt_curb_colonial_dominance: "Ограничить колониальное доминирование"
 pt_curb_colonial_dominance_desc: "Богатства, что наш враг награбил за океаном, а также его колоссальная сфера влияния будут ограничены. По условиям этого мира он будет лишён колониального владычества, а его власть в Новом Свете будет ослаблена."
 pt_curb_colonial_dominance_entry: "Ограничить колониальное доминирование"
 pt_curb_colonial_dominance_entry_short: "Ограничить колониальное доминирование"
 pt_curb_colonial_dominance_tt: "[Concept('gc_colonial_dominance', 'Колониальное доминирование')|e] побеждённого колосса уменьшается на #Y 25#! ед."
 cb_free_the_mudejar: "Освободить мудехаров"
 cb_free_the_mudejar_desc: "Наши [ShowReligionAdjective('sunni')] братья в [ShowRegionName('iberia_region')] вынуждены соблюдать #italic такию #!. Мы не можем больше позволять [ShowReligionGroupAdjective('christian')] дьяволу издеваться над нашим народом."
 cb_claim_throne_of_naples: "Притязание на трон $naples$"
 cb_claim_throne_of_naples_desc: "Мы не допустим, чтобы королевство $naples$ оставалось разделённым."
 claim_throne_of_naples: "Объединение с [GetCountry('NAP').Custom('CL_INST')]"
 claim_throne_of_naples_entry: "Притязать на трон [GetCountry('NAP').GetNameWithNoTooltip]"
 claim_throne_of_naples_entry_short: "$claim_throne_of_naples_entry$"
 claim_throne_of_naples_desc: "Наш контроль над частью [GetCountry('NAP').GetLongName] даёт нам достаточное основание для войны и притязаний на остальные земли."
 war_goal_take_province_free_the_mudejar: "$generic_war_goal_take_province$"
 war_goal_take_province_free_the_mudejar_desc: "$generic_war_goal_take_province_desc$"
 cb_demand_andalusi_submission: "Требовать подчинения [GetCountry('GRA').GetNameWithNoTooltip]"
 cb_demand_andalusi_submission_desc: "Правители [GetCountry('GRA').GetName] купили себе независимость, натравив нас на нашего соперника, и привыкли к этому удобству. Их войска уже не ровня нашим. Пусть признают, кто правит [ShowLocationName('strait_of_gibraltar')], и заплатят за мир, которым они наслаждаются."
 war_goal_demand_andalusi_submission: "$generic_war_goal_superiority$"
 war_goal_demand_andalusi_submission_desc: "$generic_war_goal_superiority_desc$\n\nПри заключении мира захват [locations|e] обходится в #R вдвое #! дороже обычного по [war_score|e], тогда как принуждение [GetCountry('GRA').GetName] к подчинению стоит лишь #G четверть #! этой суммы. Эта война ведётся ради того, чтобы подчинить их правителей нашей власти, а не ради раздела их земель."
 DEMAND_ANDALUSI_SUBMISSION_WAR_NAME: "$NUM$$ORDER$ война за подчинение $SECONDNAME$"
 peace_andalusi_submission: "Принудить к подчинению [GetCountry('GRA').GetNameWithNoTooltip]"
 peace_andalusi_submission_desc: "Правители [GetCountry('GRA').GetName] откажутся от независимости и встанут под наше знамя, став нашим [ShowSubjectTypeName('taifa')], если мы разделяем их веру, или [ShowSubjectTypeName('tributary')], если нет."
 peace_andalusi_submission_entry: "$peace_andalusi_submission$"
 peace_andalusi_submission_entry_short: "$peace_andalusi_submission$"
