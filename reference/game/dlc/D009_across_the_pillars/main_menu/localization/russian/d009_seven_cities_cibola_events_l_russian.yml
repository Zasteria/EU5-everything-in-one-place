 seven_cities_cibola.1.title: "Пуэбло — это просто деревня"
 seven_cities_cibola.1.desc: "После нескольких месяцев в походе отряд достиг места, которое монахи и проводники называют Сиболой. Здесь, как и было описано, находятся семь поселений — древних пуэбло из самана и камня, прочных и надёжных, но населённых простыми земледельцами и ткачами. Стены здесь не облицованы золотом, двери не инкрустированы бирюзой, а в кладовых хранятся разве что маис и сушёные бобы. [target_leader.GetName], укрывшись за пологом капитанского шатра, пишет донесение на родину. Все, кто остался снаружи, молча сидят на своей поклаже."
 seven_cities_cibola.1.a: "Зато какое увлекательное путешествие получилось…"
 seven_cities_cibola.1.historical_info: "В июле 1540 года отряд Коронадо достиг селения Хавикуха, первого из пуэбло Сиболы. Его встретила община земледельцев-зуни, засевшая в укреплённом глинобитном поселении. Сражение было непродолжительным: Коронадо ранили, пуэбло взяли, золота не нашли. Фрай Маркос де Низа, годом ранее вернувшийся в Мехико с  рассказами об увиденном издали городе, чьи улицы вымощены драгоценными камнями, был с позором отправлен домой. Испанские экспедиции на юго-запад не нашли драгоценных металлов и не построили колонии-энкомьенды. Постоянное присутствие европейцев в регионе началось лишь через пятьдесят лет."
 seven_cities_cibola.2.title: "Из бирюзы и глины"
 seven_cities_cibola.2.desc: "Пуэбло, до которого мы добрались, действительно находится там, где и обещали монахи, — только выглядит оно совсем не так, как они его описывали. Стены здесь не золотые, а высокие, покрытые белой штукатуркой; вокруг входов в кивы выложены мозаики из бирюзы. В кладовых хранятся маис, бобы, сушёный перец, ткани из хлопка, а также немалые запасы обработанной бирюзы и бус из раковин. Старейшины охотно идут на разговор: некоторые из них действительно бывали в землях к северу отсюда и могут рассказать, что находится вдоль верхнего течения реки. Легенды здесь нет, но есть что-то существенное. [target_leader.GetName] выходит на переговоры со старейшинами."
 seven_cities_cibola.2.a: "Не хорошо, но и не ужасно."
 seven_cities_cibola.2.historical_info: "Народы пуэбло, проживавшие на территории современных штатов Нью-Мексико и Аризона, отличались обширной торговой сферой влияния. Бирюза из холмов Серрильос отправлялась на юг, в Мезоамерику, и на север, на Великие Равнины. Перья попугаев ара поступали из лесов Юкатана, а обсидианом обменивались торговцы пуэбло и племён с Равнин. Хавику, Акома, Рио-Гранде и другие города региона были по местным меркам процветающими. Но для испанцев, видевших падение Теночтитлана, они были захолустьем. Столкновение испанских амбиций с реальностью пуэбло стало провалом для первых и почти что катастрофой для вторых. Впрочем, большинство вовлечённых в этот процесс культур сумели сохраниться."
 seven_cities_cibola.3.title: "Легенда о семи городах"
 seven_cities_cibola.3.desc: "Всё, о чём рассказывали монахи, оказалось правдой, — и даже больше. Здесь находятся семь великих пуэбло, и у каждого — свой говор и свой вождь. За ними простирается целая сеть торговых путей, ведущих к заливу и великой реке на востоке. Двери украшены бирюзой, вожди облачены в пернатые плащи и всюду ходят в сопровождении свиты, а в кладовых хранятся золотые изделия столь искусной работы, какой не видывали уже многие поколения. Скрепить договор удалось до первого снега. [target_leader.GetName] отправляет к побережью двух всадников с образцами золота и бирюзы, а также с письмом, в котором просит прислать подкрепления."
 seven_cities_cibola.3.a: "Отсюда мы будем править севером. Основан второй Мехико."
 seven_cities_cibola.3.historical_info: "Испанцы питали тщетную надежду, что где-то в пустынях к северу от Мексиканского нагорья находится вторая Мезоамерика — регион со множеством городов, запасами легко извлекаемых драгоценных металлов и централизованной политической властью, которую можно было бы подчинить себе так же, как сделал это с ацтеками Кортес. На самом же деле там находилось множество поселений земледельцев с богатой материальной культурой, но ограниченными запасами золота и без какой-либо центральной власти, с которой можно было бы вести переговоры. Эта надежда сохранялась дольше, чем следовало бы, так как испанская система поощряла сообщения о золотых городах гораздо больше, чем сообщения об их отсутствии."
 seven_cities_cibola.10.title: "Рассказ монаха"
 seven_cities_cibola.10.desc: "На пристани стоит вернувшийся с далёких берегов монах. В руках у него — донесение, засвидетельствованное клятвой перед Богом и нотарием. «Он видел город, — произносит [target_character.GetName]. — С холма, на закате, с расстояния — близкого ли, далёкого ли — этого он не знает сам. Город больше и прекраснее любого из тех, что есть в Индии, с дверными проёмами, украшенными бирюзой. Внутрь он не входил: по его словам, неразумно было бы поступать так в одиночку». Людей этот рассказ приводит в восторг; офицеры же между собой задаются другим вопросом: сколько правды в этих словах, если всё свидетельство зиждется на одном холме и одном закате?"
 seven_cities_cibola.10.a: "Выделить место монаху. Его городу понадобится свидетель."
 seven_cities_cibola.10.b: "Немного солдат и проводников должно хватить."
 cibola_friar_sails_tt: "[target_character.GetName] отплывает в путешествие"
 seven_cities_cibola.10.historical_info: "В 1539 году фрай Маркос де Низа отправился на север из Кульякана на разведку. По возвращении он клялся, что видел издалека город под названием Сибола, превосходивший по размерам Мехико-Теночтитлан. Фрай мудро не стал приближаться к нему. Этот доклад взбудоражил Новую Испанию. Его одного хватило, чтобы вице-король собрал самую крупную сухопутную экспедицию, которую когда-либо видели в Америке. Год спустя солдаты Коронадо добрались до глинобитных стен Хавику, и генерал написал, что монах ни в чем не сказал правды. С тех пор кипят споры о том, лгал ли Маркос осознанно, просто ли ошибся, приняв отблески заходящего солнца на оштукатуренных глиняных стенах за блеск золота, или просто сообщил то, что от него требовала обеспокоенная колония."
 seven_cities_cibola.11.title: "Кресты на пути"
 seven_cities_cibola.11.desc: "Наш передовой разведчик снова далеко оторвался от отряда. Он уже пересекал однажды эти земли — босой, чудом выживший в кораблекрушении. В деревнях его помнят: он идёт с двумя проводниками и тыквенной погремушкой, и каждый раз, когда дорога оказывается проходимой, он посылает назад деревянный крест. Первый крест был размером с ладонь. Сегодня утром в лагерь принесли крест высотой с человека. Офицеры спорят, означают ли эти кресты предстоящий путь или человека, отправленного в путь."
 seven_cities_cibola.11.a: "Пусть продолжает путь. Кресты говорят сами за себя."
 seven_cities_cibola.11.b: "Отозвать разведчика. Отряд идёт сообща или не идёт вовсе."
 seven_cities_cibola.11.historical_info: "Раб-марокканец Эстеванико пережил катастрофу экспедиции Нарваэса и восемь лет путешествовал по континенту пешком вместе с Кабеса де Вака. В 1539 году он шёл впереди экспедиции фрая Маркоса в качестве разведчика. Договор был такой: Эстеванико присылает обратно крест в качестве отчёта. Маленький крест означает, что место хорошее, большой крест означает, что место богатое. Кресты Эстеванико становились всё больше, и однажды гонцы едва смогли их донести. Тогда монах поспешил вслед за разведчиком, который опережал его на множество дней пути и наслаждался каждым шагом. О том, что на самом деле означал размер крестов, споры ведутся до сих пор."
 seven_cities_cibola.12.title: "Дикие места"
 seven_cities_cibola.12.desc: "Между последними гостеприимными деревнями и городом из легенды лежит местность, которую проводники называют «деспобладо»: поросшая колючими кустарниками и расчерченная пересохшими руслами рек пустыня, где нет ничего, чем мог бы прокормиться отряд. В лучшем случае мы пройдём её за пятнадцать дней. Каждую партию кукурузы придётся везти на спине или на конях, а их тоже нужно кормить. Интендант трижды пересчитал припасы и ничего не говорит. Город, как и голод, уже близко."
 seven_cities_cibola.12.desc_friar: "Вечером у костра монах неизменно проповедует одно и то же: город лежит сразу за пустошью, он видел его своими глазами, а если Бог позволил человеку увидеть нечто, значит, не для того, чтобы тот умер от голода в двух шагах от искомого. Интендант, подсчитавший и пересчитавший необходимое для перехода через деспобладо количество припасов, замечает, что отряд питается не манной небесной, а только тем, что несёт с собой. [target_leader.GetName] теперь [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, что важнее: проповеди или подсчёты."
 seven_cities_cibola.12.a: "Авангард идёт впереди и налегке."
 seven_cities_cibola.12.b: "Весь отряд и его стада с припасами. Тише едешь, дальше будешь."
 seven_cities_cibola.12.historical_info: "Коронадо прошёл деспобладо, безлюдную местность между долиной Соноры и поселениями зуни, разделив экспедицию на части. Вместе с авангардом всадников он отправился вперёд. Основные силы экспедиции шли вслед за ними вместе со стадами. Авангард, достигший Хавикуха в июле 1540 года, был настолько измучен голодом, что, как признал один летописец, пуэбло взяли главным образом из-за запасов кукурузы. Деспобладо повлияло на настроение экспедиции больше, чем любая легенда. Люди, которые наконец-то увидели Сиболу, уже неделю питались кормом своих же лошадей, и это не могло не сказаться на их дальнейших действиях."
 seven_cities_cibola.13.title: "Крест в человеческий рост"
 seven_cities_cibola.13.desc: "Гонцы уже не несут кресты, они тащат их. Последний крест, вырезанный из зеленого дерева, высотой с человека и очень тяжелый. Проводники, которые доставили его в лагерь, говорят, что разведчик совсем перестал передавать сообщения с помощью этого способа. Кажется, что ему уже просто нечего добавить к своим посланиям. Он уже близко: идёт на день впереди своей охраны, потряхивая тыквенной погремушкой. Жители городов выходят на улицы, чтобы взглянуть на него. С крестом наш разведчик передал последнюю просьбу: разрешить ему войти в город и поприветствовать его правителей до прибытия колонны."
 seven_cities_cibola.13.a: "Разрешить ему поприветствовать город. Он заслужил увидеть его первым."
 seven_cities_cibola.13.a.tt: "#italic Просьбу разведчика удовлетворили. Где-то впереди он подходит к воротам#!"
 seven_cities_cibola.13.b: "Отозвать разведчика обратно со всеми заметками."
 seven_cities_cibola.13.historical_info: "В северных долинах Эстеванико воспринимали как нечто среднее между разведчиком и святым. Он шел впереди монахов в сопровождении толпы поклонников с украшенной колокольчиками и перьями церемониальной тыквенной погремушкой в руках. В каждой деревне его осыпали подарками из бирюзы. Такая репутация сложилась за много лет, проведённых им среди народов внутренних районов, и она приносила свои плоды… до поры. По одному из свидетельств, тыквенная погремушка, которую Эстеванико отослал вперёд, чтобы объявить о своём прибытии в Сиболу, была опознана в пуэбло как принадлежащая вражескому народу. Эстеванико было отказано во входе в город ещё до того, как он увидел его стены."
 seven_cities_cibola.14.title: "Убийство у ворот"
 seven_cities_cibola.14.desc: "В течение недели люди из его свиты возвращались по двое-трое, похудевшие и молчаливые. Их рассказы расходились в деталях, но сходились в главном. Разведчик добрался до города. Говорят, он возвышается над равниной точно там, куда указывали кресты. Его правители не впустили Эстеванико в город, продержали его ночь у ворот и утром убили, когда тот отказался возвращаться. Отряд получил своё подтверждение, и тот, кто всю дорогу шёл впереди нас, потрясая тыквенной погремушкой, заплатил за это дорогую цену."
 seven_cities_cibola.14.a: "Он его нашёл. Помянем же и отправимся в путь."
 seven_cities_cibola.14.historical_info: "В мае 1539 года Эстеванико убили в Хавикухе. Он стал первым человеком из Старого Света, достигшим «Семи городов», и первым же, кто погиб ради них. Выжившие из его свиты бежали на юг и встретили фрая Маркоса, шедшего по тропе. По собственным словам, монах продвинулся вперёд ровно настолько, чтобы увидеть город издалека, после чего отправился обратно в Мексику с этой новостью. Убийство Эстеванико расценили скорее как доказательство, чем как предупреждение: город, где убивают послов, это город, где точно есть что-то, что стоит охранять. Армия, выступившая следующей весной, стала в определённом смысле памятником Эстеванико."
