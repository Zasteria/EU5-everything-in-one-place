l_english:
 game_concept_granadan_sovereignty: "Granadan Sovereignty"
 game_concept_granadan_sovereignty_desc: "A measure of how freely [GetCountry('GRA').GetName] governs itself during the [ShowSituationName('battle_for_the_strait')], pressed between [GetCountry('CAS').GetName] and [GetCountry('MOR').GetName]."

 game_concept_gc_colonial_dominance: "Colonial Dominance"
 game_concept_gc_colonial_dominance_desc: "A measure of the power the protagonist [country|e] of the [ShowSituationName('golden_century')] holds across the New World, raised in discrete amounts by colonization, treasure fleets, and overseas conversion. As it climbs, it unlocks unique flavor and standing bonuses while the situation remains active."

 game_concept_gc_european_dominance: "European Dominance"
 game_concept_gc_european_dominance_desc: "A measure of the power the protagonist [country|e] of the [ShowSituationName('golden_century')] holds over Europe, raised in discrete amounts by victory in continental wars, key holdings, and dynastic and religious primacy. As it climbs, it unlocks unique flavor and standing bonuses while the situation remains active."

 game_concept_flashpoint: "Flashpoint"
 game_concept_flashpoint_desc: "A make-or-break moment that fires once the [ShowSituationName('golden_century')] reaches a critical stage. A Flashpoint triggers an event that shakes the entire country, for good or ill: a powerful bonus, a civil war, or another upheaval that reshapes the realm."
