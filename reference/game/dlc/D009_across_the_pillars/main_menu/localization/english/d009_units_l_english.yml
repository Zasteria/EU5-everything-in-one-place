l_english:
 a_ahl_tinmal_spearmen: "Ahl Tīnmal Spearmen"
 a_ahl_tinmal_spearmen_desc: "The $a_ahl_tinmal_spearmen$ are the Atlas-mountain spearmen of Tīnmal: Ibn Tūmart's refuge in the High Atlas, and the shrine his movement tended at his tomb until the Marinids razed it. They were drawn first from the Harga, his own people, and afterwards from the wider Masmuda confederations. They carry the heavy spear and round shield and fight in close order. What their movement overthrew was not a lesser sort of soldier but a state: by the 1120s the Almoravid administration was issuing contradictory orders, and its armies were largely no longer composed of Almoravids at all. This is the corps the caliphate was built upon, and our Masmuda state raises it still, charged with the institutional pride of an empire that once unified the entire western Muslim world."
 a_caballeria_de_cuantia: "Caballería de Cuantía"
 a_caballeria_de_cuantia_desc: "The $a_caballeria_de_cuantia$ are the property-qualified horsemen of Castile — men of sufficient wealth to maintain horse and arms, but below the rank of the high nobility. Riding in the light #italic jinete#! style, these mid-rank cavalrymen fill the space between the great lords' retinues and the foot levies of the towns, providing the Castilian crown with a broad base of mounted manpower in exchange for exemption from the common tribute — a narrower privilege than an hidalgo's, but privilege enough to keep a horse."
 a_coronelias: "Coronelías"
 a_coronelias_desc: "The $a_coronelias$ are the infantry Gonzalo Fernández de Córdoba shaped in the Italian wars: several companies held together as one body under a colonel where a captain had commanded before, with pike, sword and arquebus each given their own place in the line rather than thrown in together. The #italic tercio#! is not yet named; that waits on an ordinance out of Genoa. But this is the formation it will be named for, and the men who learn their trade here are the ones who will fill it."
 a_granadan_crossbowmen: "Granadan Crossbowmen"
 a_granadan_crossbowmen_desc: "The $a_granadan_crossbowmen$ carry a weapon Granada borrowed rather than inherited: Ibn Huḏayl, writing for Muḥammad V himself, calls it the #italic qaḍīb afranjī#! — the Frankish bow. We took it up from the frontier we fight on, and our workshops now turn out its nuts and tillers to a standard pattern in quantity. Deployed before the main line, a crossbowman needs a season's training where a bowman needs a lifetime, and his bolt punches through armor that would stop an arrow."
 a_granadan_jinetes: "Granadan Jinetes"
 a_granadan_jinetes_2: "Late Granadan Jinetes"
 a_granadan_jinetes_2_desc: "Centuries of $a_granadan_jinetes$ refinement now yield a more disciplined, better-equipped horseman. Mail shirts and longer lances complement the traditional javelin, yet the core doctrine of speed, harassment, and feigned retreat remains the trademark of the Granadan light horse."
 a_granadan_jinetes_desc: "Born of the Andalusi frontier wars, the jinetes ride light, unarmored horses and fight with javelins, short swords, and the heart-shaped leather #italic adarga#!. Their hit-and-run skirmishes, drawn from Berber tactics carried across the Strait, dictate the pace of warfare on the Iberian peninsula, and neighboring realms swiftly imitate them in turn."
 a_guich_cavalry: "Guich Cavalry"
 a_guich_cavalry_desc: "The $a_guich_cavalry$ are the standing cavalry of the Moroccan Maḵzan — #italic jīš#! tribesmen, of usually Arab origin, settled on #italic arḍ al-jayš#! and holding their plots free of tax for as long as they ride. They are soldier-cultivators and not nobles, with no lineage of their own to fall back on, and that is precisely why the sultan trusts them: a corps whose standing depends entirely upon the crown. Mounted and paid in land, they carry the sultan's writ into country where a tax collector alone would not be heeded, and they cost the treasury less than any force that must be paid in coin."
 a_hermandad_infantry: "Hermandad Infantry"
 a_hermandad_infantry_desc: "The $a_hermandad_infantry$ are the organized militia companies of the Santa Hermandad — the Holy Brotherhood established to provide Castile with a standing internal force capable of maintaining order across the vast meseta. Unlike the old feudal levies, these men are raised and paid by the towns but answer to royal magistrates rather than to local lords, and their discipline makes them a far more reliable instrument of the new centralized state than any baronial host."
 a_hilali_bedouin_cavalry: "Hilālī Bedouin Cavalry"
 a_hilali_bedouin_cavalry_desc: "The $a_hilali_bedouin_cavalry$ are the Arab-tribal light horsemen of the Banū Hilāl and Banū Sulaym — pastoralists who came west out of Upper Egypt across generations rather than in one wave, and whose slow settlement of the steppe has remade its speech and its rural order for good. By our own day the Riyāḥ and the Dawāwida make kings and unmake them, and the sultans between Tunis and Tlemcen court them with marriages, with tax-farms, and with grants of land and revenue to their chiefs. They ride to us under their own captains and on their own mounts, and they will not be told where to camp. This Arab-Bedouin tradition gives our armies a striking arm whose mobility and tribal numbers complement the Berber confederations without competing for the same kinship-recruitment pool."
 a_infanteria_de_marina: "Infantería de Marina"
 a_infanteria_de_marina_desc: "The $a_infanteria_de_marina$ are the marines of the Castilian navy — the soldiers who ride aboard our warships to storm enemy decks, hold coastal positions, and spearhead amphibious landings. Organized as standing companies in the grand tradition of the #italic tercio#!, these fighting sailors are equally at home on the crowded gangway of a galley and in the breach of a coastal fortress, making them the sharp edge of our overseas power projection."
 a_kabyle_skirmishers: "Kabyle Skirmishers"
 a_kabyle_skirmishers_desc: "The $a_kabyle_skirmishers$ are the highland fighters of the Djurdjura and the Babor east of Algiers — the Zwāwa of the Arabic geographers, counted subjects of the Hafsid sultan at Béjaïa and paying him nothing. Their kinsmen have made empires before now: the Kutāma of the eastern hills were the army that carried the Fatimids into Ifrīqiya, and Ṣanhāja of the same stock founded the Zirid and Hammadid dynasties after them. They harass a marching column with thrown spears and are gone into ground no formation can follow. This mountain-warfare tradition gives the Maghrebi armies a flanking arm for the hilly, wooded country where pitched-battle infantry cannot maneuver."
 a_masmuda_atlas_infantry: "Masmuda Atlas Infantry"
 a_masmuda_atlas_infantry_desc: "The $a_masmuda_atlas_infantry$ are the heavy spearmen of the Masmuda Berber confederations of the Atlas mountains — farmers of the high valleys who muster for a season and return to their terraces, as they did long before the Almohad caliphate and long after it fell. Their forebears marched in the armies that swept the Maghreb and the Iberian peninsula in the twelfth century, and they carry that memory in the close formations the mountains taught them, suited to broken ground and to receiving heavy Christian cavalry. This Masmuda tradition gives every Maghrebi state a heavy infantry corps that no purely cavalry rival can easily break in close-quarter combat."
 a_mesnaderos: "Mesnaderos"
 a_mesnaderos_desc: "The $a_mesnaderos$ are the royal retinue cavalry of the Pyrenean crowns — the armored household knights who ride at the direct service of the king of Navarre or Aragon. Organized under the ancient obligation of the #italic mesnada#!, these warriors are bound by personal loyalty and contract to their sovereign, forming a reliable core of experienced heavy cavalry that can be dispatched where the feudal levy would be too slow or unreliable."
 a_milicia_concejil: "Milicia Concejil"
 a_milicia_concejil_desc: "The $a_milicia_concejil$ are the town levies of the Castilian and Leonese municipalities — the #italic concejos#! of the Meseta obligated by royal charter to furnish men for local defense and frontier service. Drawn from the burghers and tradesmen of the walled towns, they are a cheap and accessible force whose greatest strength is their familiarity with the terrain they are sworn to protect."
 a_milicia_irmandinha: "Milicia Irmandinha"
 a_milicia_irmandinha_desc: "The $a_milicia_irmandinha$ are the militia forces raised by the Galician brotherhoods — the #italic Irmandades#! of the mid-fifteenth century that united the towns of Galicia against the tyranny of the great noble houses. Lightly armed but fiercely motivated, these citizen soldiers reflect the communal solidarity of the Galician urban guilds and small landholders who chose collective action over submission to the señorial yoke."
 a_miquelets: "Miquelets"
 a_miquelets_desc: "The $a_miquelets$ are the irregular light infantry of the Catalan mountains — bands of tough highland fighters who have served Catalan lords and Castilian kings alike in the passes of the Pyrenees and the ravines of the eastern coast. Moving faster than regular troops and vanishing before pursuit can be organized, these guerrilla soldiers excel in the ambush and the raid, turning the rugged terrain of their homeland into their greatest weapon."
 a_mulaththamun_spearmen: "Mulaṯṯamūn Spearmen"
 a_mulaththamun_spearmen_desc: "The $a_mulaththamun_spearmen$ are the Ṣanhāja warriors of the western Sahara, named for the #italic liṯām#! they never set aside — the Lamtūna clansmen whose ranked spear formations carried the strict Mālikī reform doctrine of Ibn Yāsīn, and afterwards the arms of Yūsuf ibn Tāšfīn, from the Saharan erg to the Ebro valley. Their front rank sets the long pike and the ranks behind loose the javelin, every man of them behind an oryx-hide #italic lamt#! shield, veiled so that only the sockets of the eyes are seen. Their high morale derives from a religious commitment that no purely secular military tradition can match. The empire those spearmen built is long fallen, but the Maghreb has never forgotten how they fought, and our Ṣanhāja polity fields their heavy-foot corps still."
 a_mutatawwia: "Mutaṭawwi'a"
 a_mutatawwia_desc: "The #italic mutaṭawwi'a#! are the volunteers of the Granadan frontier — devout men who ride the raiding season for the promise of paradise and a share of the plunder rather than for a wage, many of them gathered around some local #italic morabito#! whose reputation for holiness draws them in. Light and fast, they strike at the Christian marches with javelin and sword before melting back into the sierra. They are not the sultan's salaried frontier horsemen and do not pretend to be: what they bring is numbers and fervor, and they disperse when the season ends."
 a_sanhaja_camel_cavalry: "Ṣanhāja Camel Cavalry"
 a_sanhaja_camel_cavalry_desc: "The $a_sanhaja_camel_cavalry$ are the camel and light-horse riders of the Saharan Ṣanhāja — the Lamtūna and the Masūfa, veiled men whose fathers built an empire reaching from the Senegal to the Ebro. That day is past. The century turns against them, and the dynasties rising now are Zanata and Masmuda. What has not changed is the desert, which they still cross as no one else can: their camels carry them over distances no horse cavalry can attempt, and their light-spear charge is a Maghrebi answer to the heavy lance of the Iberian and Sahelian powers. This Ṣanhāja desert-cavalry tradition gives our armies an unmatched logistical and maneuver reach across the southern frontier."
 a_sometent: "Sometent"
 a_sometent_desc: "The $a_sometent$ are the levied urban and rural militias of the Catalan lands — the #italic sometent#! called out by bell and horn whenever the frontier is threatened. Armed with spear and shield, they are not professional soldiers but defenders of hearth and village, and their stubborn resilience in the face of raid and incursion makes them harder to break than their numbers would suggest."
 a_alabarderos: "Alabarderos"
 a_alabarderos_desc: "The $a_alabarderos$ are the halberd-bearing guard of the royal person — a single company of a few score men, raised to stand at the door of the chamber rather than in the line of battle. Their polearms guard the monarch as much as they grace the court, and a king who finds himself relying on them in the field has already lost the field."
 a_guardias_de_ornato: "Guardias de Ornato"
 a_guardias_de_ornato_desc: "The $a_guardias_de_ornato$ are the ceremonial halberdier guard of the Castilian court, richly attired successors of the $a_alabarderos$ who escort the sovereign with lance and halberd."
 a_thagri: "Ṯaḡrī"
 a_thagri_2: "Late Ṯaḡrī"
 a_thagri_2_desc: "Generations of $a_thagri$ service have settled the corps into a hereditary class of frontier wardens. The march is in their bones, the passes mapped in their grandfathers' songs, the drill inherited from their fathers' company. They still draw a peasant's wage and a peasant's bread, yet a column of them can hold the sierra through a full season of campaign while a knightly retinue would starve in a fortnight."
 a_thagri_desc: "Drawn from the marcher villages of the #italic ṯuḡūr#!, the #italic ṯaḡrī#! fight as foot spearmen who know every pass and watercourse of the Andalusi frontier. They train cheaply on village rations, march for weeks on what a Castilian column eats in days, and answer the call at the first beacon. Their weapons are plain and their pay is meager, yet no force in Iberia matches their endurance along the mountain marches."
 a_tornadizos: "Tornadizos"
 a_tornadizos_2: "Late Tornadizos"
 a_tornadizos_2_desc: "Generations of $a_tornadizos$ settlement have built a standing class of armored cavalry whose training and equipment now match the best Christian knights of Iberia. Their lances are longer, their plate heavier, and their numbers no longer depend on the frontier's whim. The Andalusi heavy horse has come of age, fielded under our own banners against the kingdoms whose technique once defined them."
 a_tornadizos_desc: "Drawn out of the Christian kingdoms into Nasrid pay, these men keep their own faith and their own priests while they serve us — the frontier calls them #italic tornadizos#! regardless, a word it throws at anyone who changes sides in either direction. They bring lance-and-plate technique into our armies, and their armored charge mirrors the #italic gendarmes#! of Castile and Aragon, yet they ride beside the $a_granadan_jinetes$ under the green banners of our emirate. Recruitment is slow, for such men are few, and each one trained in the Christian art of war makes our cavalry an enemy unlike any other Andalusi force the frontier has seen."
 a_tuareg_camelry: "Tuareg Camelry"
 a_tuareg_camelry_desc: "The $a_tuareg_camelry$ are the #italic mahrī#! riders of the deep Sahara — men the Arabic geographers count among the Ṣanhāja and know by their veils, mounted on racing dromedaries bred for speed across the great erg and hamada, carrying the long lance and the #italic takouba#! for the close work after a camel charge has scattered a column. They raid the caravan roads and they also guard them, taking payment to escort and to guide, and taxing the traffic wherever they hold the wells. Three days of march where horse cavalry must halt for water makes them masters of corridors no settled army can police. This camelry tradition gives our confederations a raiding and long-range patrol arm that no rival within a thousand leagues of the desert can match."
 a_zenata_cavalry: "Zenata Cavalry"
 a_zenata_cavalry_desc: "The $a_zenata_cavalry$ are light horsemen of the Zenata Berber confederations — the Banū Marīn, Banū 'Abd al-Wād, and Maghrāwa — whose pastoral upbringing makes them masters of swift desert and steppe warfare. Each warrior brings his own mount, his own kit, and his own retinue of kinsmen, requiring no royal armory or extended training to field. This pool of tribal light cavalry gives every Maghrebi sultan a fast-moving striking arm that the heavier Christian and eastern-Muslim cavalry cannot easily catch in open country."
 n_carraca_portuguesa: "Nau Portuguesa"
 n_carraca_portuguesa_desc: "The $n_carraca_portuguesa$ is the heavy carrack that powers our eastern empire — a towering, multi-decked vessel built to survive the brutal storms of the Cape route and return with the spices and silks of the Indian Ocean trade. Bristling with cannon and capable of carrying hundreds of soldiers, these ships are floating fortresses that have opened the sea-lanes of the world to Portuguese commerce and power."
 n_galeota_andalusi: "Galeota Andalusí"
 n_galeota_andalusi_desc: "The $n_galeota_andalusi$ is the fast raiding galley of the Andalusi corsairs — a lean, oar-driven vessel built for speed and surprise rather than the pitched battle of line fleets. Crewed by experienced seamen from the ports of Granada and the southern coast, these galiots dart between Christian fishing villages and merchant lanes, striking before a defense can be organized and retreating into the wind before pursuit can close."
 n_ghurab_maghribi: "Ghurāb Maghribī"
 n_ghurab_maghribi_desc: "The $n_ghurab_maghribi$ is the war galley of the Maghrebi ports — the #italic ghurāb#!, the raven, a long oared hull that carries a full fighting crew rather than a heavy battery. Built in the yards of Salé, Bādis, and Hunayn and rowed by crews drawn from the coastal tribes, these galleys work in squadrons to run down merchantmen and put boarding parties over the rail before a defense can form. This tradition of the oared corsair gives every Maghrebi sultan a fleet able to contest the strait and the coastal lanes without the expense of a gunnery navy."
 n_nao_castellana: "Nao Castellana"
 n_nao_castellana_desc: "The $n_nao_castellana$ is the great trading warship of Castile — a broad-beamed, high-castled #italic nao#! capable of crossing open ocean while carrying enough guns and soldiers to fight off any rival fleet. It was aboard ships of this design that our greatest voyages of discovery were made, and in their holds that the wealth of new continents begins its journey back to Castile."
 n_sale_rover: "Salé Rover"
 n_sale_rover_desc: "The $n_sale_rover$ is the light corsair sailing vessel of the Bou Regreg republic — the shallow-draft raider built in the shipyards of Salé and Rabat by the Hornachero and Morisco refugees who established their independent corsair city-state at the mouth of the river. Our captains sail these swift ships into the Atlantic lanes to intercept the coastal traffic of Iberia, the Canaries, and the western Mediterranean approaches, outrunning any heavy war-galleon sent in pursuit. This Salé Rover tradition gives our state a fleet of fast Atlantic raiders that no galley-based corsair navy can replicate in open-sea conditions."
