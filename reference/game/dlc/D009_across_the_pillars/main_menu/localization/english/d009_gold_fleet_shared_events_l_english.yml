l_english:
 gold_fleet_shared_events.1.title: "Sea Rovers on the Horizon"
 gold_fleet_shared_events.1.desc: "Sails have been sighted to windward, running down on the fleet under no colors. They are the small, fast crafts of the island rovers, built to work up into the wind and slip away through shallows where no galleon can follow them.\n\nThere are three or four of them, and they have chosen their moment well. A night of light winds has strung the fleet out, and our rearmost vessel, heavy with treasure, has fallen half a league behind the rest."
 gold_fleet_shared_events.1.a: "Beat to quarters and drive them off."
 gold_fleet_shared_events.1.b: "Buy them off before they close."
 gold_fleet_shared_events.1.c: "Crowd on sail and try to outrun them."
 gold_fleet_shared_events.1.d: "Signal the other fleet. Together we run them down!"
 gold_fleet_shared_events.1.historical_info: "Privateers and pirates plagued the Spanish treasure fleets throughout the 16th and 17th centuries. Operating under royal letters of marque or on their own account, they learned to exploit the geography of the Caribbean, using shallow-draft craft to work the channels between the islands and cut out ships separated from a convoy by storms or contrary winds. The silver cargoes were valuable enough that even a partial capture could fund an entire raiding expedition."
 gold_fleet_shared_events.pirate_fight_fail_tt: "The rovers prove too fast and too many — half the cargo is lost before they are beaten off"
 gold_fleet_shared_events.pirate_flee_fail_tt: "The rovers run the fleet down before it can pull away — a quarter of the cargo is lost"

 gold_fleet_shared_events.2.title: "Enemy Squadron Intercepts the Fleet"
 gold_fleet_shared_events.2.desc: "The lookout's warning comes too late for comfort. Warships are bearing down to windward under full sail, riding deep with guns and men and flying colors hostile to [ROOT.GetCountry.GetName]. These are ships of the line, fast enough to run down the slowest vessel in the fleet before nightfall.\n\nThe wind stands against any attempt to run, and the holds carry a full year of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s [ShowGoodsName('silver')]. [target_leader.GetName] must choose whether to fight, to scatter, or to come to terms with losing everything."
 gold_fleet_shared_events.2.a: "Form the battle-line and fight through."
 gold_fleet_shared_events.2.b: "Scatter the fleet. Some ships may escape, others may not."
 gold_fleet_shared_events.2.c: "Turn and run before the wind; outsail them or lose all."
 gold_fleet_shared_events.2.historical_info: "The gravest threat to the silver fleets came not from lone privateers but from state-sponsored naval expeditions by rival powers. The Dutch admiral Piet Hein captured an entire homeward-bound fleet off Matanzas Bay, Cuba, in 1628 — the only complete capture of a Spanish silver fleet in history. When major navies entered Caribbean waters in strength, the escorted convoys that sufficed against small raiders could be overwhelmed by organized fleet actions."
 gold_fleet_shared_events.warship_fight_fail_tt: "The enemy squadron gets the better of the engagement — three-quarters of the cargo is lost"
 gold_fleet_shared_events.warship_flee_fail_tt: "The enemy squadron catches the fleet before it can pull away — half the cargo is lost"

 gold_fleet_shared_events.3.title: "Our Navy Intercepts a Treasure Fleet"
 gold_fleet_shared_events.3.desc: "Dispatches come up from the Caribbean. Our squadron has fallen in with an enemy treasure fleet and brought it to action, scattering its formation; more than one of our captains bore himself well in the fight. Word of it will reach [ROOT.GetCountry.GetCapital.GetName] soon, and the enemy's counting houses sooner still.\n\nThe [ShowGoodsName('silver')] that runs through these waters pays for the enemy's armies and their alliances. Every cargo we take is one they cannot spend against us."
 gold_fleet_shared_events.3.a: "Our captains have served us well. See them rewarded."
 gold_fleet_shared_events.3.historical_info: "News of an engagement with a treasure fleet could travel ahead of the ships themselves, carried by fast dispatch vessels. A successful interception was a significant diplomatic and financial event: the capture of even part of a silver convoy could fund a squadron's operations for years, while the failure of the convoy to arrive reverberated through royal finances, credit, and the ability to wage war in Europe."

 gold_fleet_shared_events.4.title: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip]'s Fleet Loads Our Cargo"
 gold_fleet_shared_events.4.desc: "The [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName]'s fleet has arrived in our harbor, and its factors are already in our warehouses, tallying what is owed. Bar [ShowGoodsName('silver')], coin, hides, and colonial goods — all of it is carried out under armed guard and loaded aboard for the crossing to Spain.\n\nOur own [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] keep careful accounts, and they know to the ounce what leaves the quay today. It was months in the gathering, and [ROOT.GetCountry.GetName] will feel its loss until the next season's harvest."
 gold_fleet_shared_events.4.a: "We supply what [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] demands, nothing more."
 gold_fleet_shared_events.4.historical_info: "The colonial ports existed in a state of enforced commercial dependency on the metropole. All colonial trade was required to move through licensed channels, and the merchants and creole elites who produced the silver, hides, and dyestuffs saw the bulk of the profit flow to the crown and to the merchant houses of Seville rather than to themselves — a structural tension that deepened across the colonial centuries."

 gold_fleet_shared_events.5.title: "The Sea Turns Against Us"
 gold_fleet_shared_events.5.desc: "The sky to the east has gone the color of a bruise, and the swell is building fast. A great storm is bearing down on the fleet, and there is no outrunning it now. The wind rises to a scream in the rigging as [target_leader.GetName] gives the order that will decide how many ships live to see calm water again.\n\nWe can close up the formation and ride out the tempest together, trusting to seamanship and luck, or scatter the ships and throw cargo overboard to keep them afloat."
 gold_fleet_shared_events.5.a: "Close the formation and ride out the storm together."
 gold_fleet_shared_events.5.b: "Scatter the ships and lighten the load."
 gold_fleet_shared_events.5.c: "Run for the shelter of a friendly port and make repairs."
 gold_fleet_shared_events.5.unscathed_tt: "The fleet holds together and comes through the storm unscathed"
 gold_fleet_shared_events.5.lose_fleet_tt: "The storm claims part of the fleet, and half the cargo goes down with the ships"
 gold_fleet_shared_events.5.lose_all_tt: "The fleet is overwhelmed and lost with all hands, and the expedition ends here"
 gold_fleet_shared_events.5.lose_cargo_tt: "Cargo is thrown overboard to keep the ships afloat, and part of the haul is lost"
 gold_fleet_shared_events.5.historical_info: "Atlantic hurricanes were the deadliest enemy of the treasure fleets, more ruinous than any privateer. The 1622 Tierra Firme fleet lost eight ships to a hurricane off the Florida Keys, among them the #italic Nuestra Señora de Atocha#!, whose silver-laden wreck was not recovered for three and a half centuries. In 1715 an entire homebound fleet was driven onto the Florida coast by a July hurricane, drowning around a thousand men. Commanders came to fear the season far more than any enemy sail."

 gold_fleet_shared_events.6.title: "Fever Below Decks"
 gold_fleet_shared_events.6.desc: "The heat below decks is a living thing, and the sickness has come with it. Men who stood their watch a week ago now lie sweating in the dark, and the surgeon can do little but count the fallen and hope the rest are spared. Foul water, close quarters, and the airs of the tropics have done what no privateer could.\n\n[target_leader.GetName] must decide how the fleet answers the fever before it hollows out the crews entirely."
 gold_fleet_shared_events.6.a: "Lie to and put the sick ashore until the fever passes."
 gold_fleet_shared_events.6.b: "We cannot lose the season to sickness. Drive the crew on."
 gold_fleet_shared_events.6.c: "Put in for fresh water and take on healthy hands ashore."
 gold_fleet_shared_events.6.historical_info: "Disease killed far more men aboard the #italic Carrera de Indias#! than storms or enemy action combined. The long crossings, brackish water, salt provisions, and crowded holds bred scurvy, dysentery, and typhus, while the tropical ports of the Caribbean were reservoirs of malaria and other deadly fevers that could gut a crew within weeks of arrival. A fleet that lingered too long in the Indies risked returning home with too few hands to work the ships, and captains balanced the danger of the sea against the slower, surer danger of the fever."

 gold_fleet_shared_events.7.title: "Loose Talk in the Tavern"
 gold_fleet_shared_events.7.desc: "Word comes to [target_leader.GetName] that one of the fleet's officers, deep in his cups in a waterfront tavern, has been holding forth on our sailing date, our route home, and the wealth in our holds. A colonial port is a nest of foreign ears — factors, smugglers, and men who will sell a secret to any privateer captain with coin to spend.\n\nThe damage may already be done, but how we answer it will decide whether it spreads further."
 gold_fleet_shared_events.7.a: "Haul him before the mast to feel the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s wrath."
 gold_fleet_shared_events.7.b: "Alter our sailing date and the course we mean to steer."
 gold_fleet_shared_events.7.c: "Put out conflicting rumors and muddy the waters."
 gold_fleet_shared_events.7.rumours_worse_tt: "The false rumors only thicken the talk on the waterfront, and word of the true route carries further than ever — the danger of the voyage increases (#G +1#! Danger Level)"
 gold_fleet_shared_events.7.rumours_better_tt: "The false trails take hold, and any captain lying in wait is sent chasing shadows — the danger of the voyage decreases (#R -1#! Danger Level)"
 gold_fleet_shared_events.7.historical_info: "The sailing schedules of the treasure fleets were among the most valuable intelligence in the Atlantic world. Privateers and rival admiralties maintained networks of informants in the Caribbean ports and at Seville, and a leaked departure date or planned route could turn a hopeful cruise into a certain interception. The Spanish crown guarded the details of the #italic flota#! closely, but a fleet assembling in a crowded colonial harbor could never truly keep its secrets, and loose talk ashore was a hazard commanders knew well."

 gold_fleet_shared_events.cargo_loaded_tt: "The season's treasure is loaded into the fleet's holds"
 gold_fleet_shared_events.cargo_gain_tt: "The value of the fleet's cargo increases"
 gold_fleet_shared_events.cargo_loss_tt: "Part of the fleet's cargo is lost"
 gold_fleet_shared_events.danger_up_1_tt: "The danger of the voyage increases (#G +1#! Danger Level)"
 gold_fleet_shared_events.danger_up_2_tt: "The danger of the voyage increases (#G +2#! Danger Level)"
 gold_fleet_shared_events.danger_down_1_tt: "The danger of the voyage decreases (#R -1#! Danger Level)"
 gold_fleet_shared_events.cargo_damaged_on_return_tt: "The delivered cargo reflects losses suffered earlier in the voyage"
