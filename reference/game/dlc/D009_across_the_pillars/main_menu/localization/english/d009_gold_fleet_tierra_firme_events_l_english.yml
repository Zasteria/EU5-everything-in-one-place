l_english:
 gold_fleet_tierra_firme_events.1.title: "Outward Bound for Tierra Firme"
 gold_fleet_tierra_firme_events.1.desc_prefix: "The fleet is fitted out and ready at [departure_port.GetName]. Water and provisions are aboard, along with the iron and mercury the colonies cannot supply for themselves, and [target_leader.GetName] holds the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s orders in hand.\n\nThe season is right and the wind stands fair for the crossing. Beyond it, the [ShowGoodsName('silver')] of"
 gold_fleet_tierra_firme_events.1.desc_suffix: "is already coming down from the mountains to the coast, waiting for a fleet to carry it home. If we are to bring it safely home to [departure_port.GetName], the galleons must sail now."
 gold_fleet_tierra_firme_events.1.desc: "$gold_fleet_tierra_firme_events.1.desc_prefix$ the Indies $gold_fleet_tierra_firme_events.1.desc_suffix$"
 gold_fleet_tierra_firme_events.1.desc.rich: "$gold_fleet_tierra_firme_events.1.desc_prefix$ [silver_source.GetName] $gold_fleet_tierra_firme_events.1.desc_suffix$"
 gold_fleet_tierra_firme_events.1.a: "Cast off. The galleons sail on the morning tide."
 gold_fleet_tierra_firme_events.1.historical_info: "The #italic Galeones de Tierra Firme#! was one of two convoys that made up the Spanish #italic Carrera de Indias#!. The Tierra Firme fleet served the South American viceroyalties, collecting silver from the mines of Potosí in Upper Peru and other colonial revenues via the ports of Portobelo and Cartagena. The silver was transported overland from the Pacific coast across the Panamá isthmus before loading. Philip II formalized the convoy system in 1566, requiring all trade to move in armed fleets and pass through the #italic Casa de Contratación#! in Seville, which collected the crown's #italic quinto real#!, a fifth of all precious metals extracted from the New World."

 gold_fleet_tierra_firme_events.2.title: "The Silver of New Granada"
 gold_fleet_tierra_firme_events.2.desc_prefix: "We have made [loot_port.GetName], secure behind its walls and its harbor mouth. In the warehouses along the waterfront lies a year of the mines' labor: bar [ShowGoodsName('silver')]"
 gold_fleet_tierra_firme_events.2.desc_middle: "chests of coin, bundled hides, casks of indigo, and here and there a guarded crate of [ShowGoodsName('gems')]"
 gold_fleet_tierra_firme_events.2.desc_suffix: "The holds are not yet full, and more [ShowGoodsNameWithNoTooltip('silver')] is still coming down from the interior. We may wait for the full convoy and load every hold, or take what is already gathered and press on before the hurricane season closes in."
 gold_fleet_tierra_firme_events.2.desc: "$gold_fleet_tierra_firme_events.2.desc_prefix$, $gold_fleet_tierra_firme_events.2.desc_middle$.\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
 gold_fleet_tierra_firme_events.2.desc.rich: "$gold_fleet_tierra_firme_events.2.desc_prefix$ from [silver_source.GetName], $gold_fleet_tierra_firme_events.2.desc_middle$ from [gem_source.GetName].\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
 gold_fleet_tierra_firme_events.2.a: "Wait for the full convoy and fill every hold."
 gold_fleet_tierra_firme_events.2.b: "Take only what is already gathered."
 gold_fleet_tierra_firme_events.2.c: "The risk is too great. Return home with what we have."
 gold_fleet_tierra_firme_events.2.historical_info: "Cartagena de Indias, founded in 1533, was the principal Caribbean collection point for silver from South America. Silver from the Potosí mines in Upper Peru, the richest silver deposit in the world at its peak, was transported to the Pacific port of Callao, shipped north to Panamá, and carried by mule train across the isthmus to Portobelo, where it was taken aboard the Tierra Firme galleons at the great trade fair. The wealth flowing through Cartagena made it one of the most fortified cities in the Americas and a perennial target for privateers, most notably Sir Francis Drake, who sacked the city in 1586."

 gold_fleet_tierra_firme_events.3.title: "$gold_fleet_nueva_espana_events.3.title$"
 gold_fleet_tierra_firme_events.3.desc.together: "The fleet has reached [rendezvous_port.GetName], where the #italic flota#! from New Spain already lies at anchor beneath the guns of the fortress, her holds as heavy with [ShowGoodsName('silver')] as our own. From here the two fleets will make the Atlantic crossing together, north on the Gulf Stream and then east past the Florida shore.\n\nWord has come in of enemy sail waiting along that route, but a convoy of this size is a hard prize to take. [target_leader.GetName] must decide how the combined fleet will answer the threat before it sails for Spain."
 gold_fleet_tierra_firme_events.3.desc.alone: "The fleet has reached [rendezvous_port.GetName] and lies at anchor beneath the guns of the fortress. The #italic flota#! from New Spain is not here to join us; we will make the Atlantic crossing on our own, north on the Gulf Stream and then east past the Florida shore.\n\nWord has come in of enemy sail waiting along that route, and a lone fleet makes the tempting target. [target_leader.GetName] must decide how we answer the threat before we sail for Spain."
 gold_fleet_tierra_firme_events.3.a: "$gold_fleet_nueva_espana_events.3.a$"
 gold_fleet_tierra_firme_events.3.b: "$gold_fleet_nueva_espana_events.3.b$"
 gold_fleet_tierra_firme_events.3.c: "$gold_fleet_nueva_espana_events.3.c$"
 gold_fleet_tierra_firme_events.3.historical_info: "Havana became the mandatory assembly point for the returning silver fleet after Philip II formalized the convoy system in 1566. The city's deep natural harbor and position overlooking the Florida Channel made it the logical rendezvous for both the Tierra Firme galleons and the Flota de Nueva España before their combined Atlantic crossing. The construction of the Castillo de los Tres Reyes del Morro from 1589 was a direct response to the threat from foreign privateers. Timing the crossing was critical: too late risked the Caribbean hurricane season; too early meant unfavorable winds on the Atlantic."

 gold_fleet_tierra_firme_events.8.title: "Awaiting the Flota from New Spain"
 gold_fleet_tierra_firme_events.8.desc: "The fleet has reached [rendezvous_port.GetName], but the #italic flota#! from New Spain has not yet arrived. The [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s orders are plain: the treasure fleets are to cross the Atlantic as one, their guns massed against the privateers who prowl the Florida Channel.\n\nSo we will lie at anchor beneath the fortress and wait for her, and trust she is not long in coming."
 gold_fleet_tierra_firme_events.8.a: "$gold_fleet_nueva_espana_events.8.a$"
 gold_fleet_tierra_firme_events.8.historical_info: "$gold_fleet_nueva_espana_events.8.historical_info$"
 gold_fleet_tierra_firme_events.awaiting_fleet_tt: "The fleet will wait at anchor here for the Flota de Nueva España to arrive, however long that takes"

 gold_fleet_tierra_firme_events.9.title: "$gold_fleet_nueva_espana_events.9.title$"
 gold_fleet_tierra_firme_events.9.desc: "Weeks have passed at anchor at [rendezvous_port.GetName], and still the #italic flota#! from New Spain has not arrived. Provisions dwindle, the men grow restless, and each day at anchor is a day the season turns further against a safe crossing.\n\n[target_leader.GetName] must decide whether to hold on for the rendezvous or to chance the Atlantic without her."
 gold_fleet_tierra_firme_events.9.a: "$gold_fleet_nueva_espana_events.9.a$"
 gold_fleet_tierra_firme_events.9.b: "$gold_fleet_nueva_espana_events.9.b$"
 gold_fleet_tierra_firme_events.9.historical_info: "$gold_fleet_nueva_espana_events.9.historical_info$"

 gold_fleet_tierra_firme_events.10.title: "$gold_fleet_nueva_espana_events.10.title$"
 gold_fleet_tierra_firme_events.10.desc: "Word reaches [target_leader.GetName] that [secondary_port.GetName] can be made to yield its share as well, the [ShowGoodsName('goods_gold')] carried across the isthmus passing through its warehouses. A squadron could be detached to gather it, though splitting the fleet in these waters is no small risk.\n\nWe may hold the fleet here at [loot_port.GetNameWithNoTooltip] until the detachment returns, or press on for [rendezvous_port.GetNameWithNoTooltip] and let them catch us there."
 gold_fleet_tierra_firme_events.10.a: "$gold_fleet_nueva_espana_events.10.a$"
 gold_fleet_tierra_firme_events.10.b: "$gold_fleet_nueva_espana_events.10.b$"
 gold_fleet_tierra_firme_events.10.c: "$gold_fleet_nueva_espana_events.10.c$"
 gold_fleet_tierra_firme_events.10.historical_info: "$gold_fleet_nueva_espana_events.10.historical_info$"
 gold_fleet_tierra_firme_events.10.danger_tt: "$gold_fleet_nueva_espana_events.10.danger_tt$"
 gold_fleet_tierra_firme_events.havana_together_danger_tt: "Sailing together with the Nueva España fleet $gold_fleet_nueva_espana_events.together_danger_suffix$"

 gold_fleet_tierra_firme_events.11.title: "The Detachment Returns"
 gold_fleet_tierra_firme_events.11.desc: "The squadron sent to [secondary_port.GetName] has come back to [loot_port.GetName], its holds filled with [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')], and hides. The fleet is whole again, and safer for it."
 gold_fleet_tierra_firme_events.11.a: "$gold_fleet_nueva_espana_events.11.a$"
 gold_fleet_tierra_firme_events.11.historical_info: "$gold_fleet_nueva_espana_events.11.historical_info$"

 gold_fleet_tierra_firme_events.12.title: "The Detachment Rejoins Near Cuba"
 gold_fleet_tierra_firme_events.12.desc: "The squadron detached to [secondary_port.GetName] has caught up with the fleet as it nears [rendezvous_port.GetNameWithNoTooltip], its holds laden with the last of the season's [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')], and hides."
 gold_fleet_tierra_firme_events.12.a: "$gold_fleet_nueva_espana_events.12.a$"
 gold_fleet_tierra_firme_events.12.historical_info: "$gold_fleet_nueva_espana_events.12.historical_info$"

 gold_fleet_tierra_firme_events.14.title: "A Consignment of Emeralds"
 gold_fleet_tierra_firme_events.14.desc: "A guarded train has come down to the quay from [gem_source.GetName], and under its escort lies a fortune in [ShowGoodsName('gems')] — rough emeralds of the finest water, worth more by weight than anything else in our holds. The factors would have us carry them home, and the profit would be immense.\n\nYet a prize like this is precisely what draws the privateers, and word of such a cargo travels faster than any ship. [target_leader.GetName] must weigh the wealth against the danger it invites."
 gold_fleet_tierra_firme_events.14.a: "Take the emeralds aboard. A fortune like this will not wait."
 gold_fleet_tierra_firme_events.14.b: "Leave them. Our holds are laden enough."
 gold_fleet_tierra_firme_events.14.decline_tt: "The emeralds are left behind for a later fleet, and our lighter holds ease the dangers of the voyage"
 gold_fleet_tierra_firme_events.14.historical_info: "The emerald mines of Muzo and Somondoco in New Granada were the richest in the world, and Colombian emeralds became one of the most coveted luxury goods of the age, prized from the courts of Europe to those of Mughal India and Safavid Persia. The stones were small in bulk but staggering in value, and a single guarded consignment could rival a shipload of silver. Their concentration of wealth made them a magnet for theft and interception, and the crown watched their movement as closely as it watched the bullion."

 gold_fleet_tierra_firme_events.15.title: "The Mule Trains of the Isthmus"
 gold_fleet_tierra_firme_events.15.desc: "The season's last #italic recua#! is still on the trail — a long train of mules laden with [ShowGoodsName('silver')] from the Pacific side, winding its way across the fever-ridden isthmus of Panamá toward the coast. Word comes that #italic cimarrón#! raiders, escaped from the plantations and living wild in the jungle, are shadowing the trail and mean to fall on it before it reaches us.\n\nThe silver can still be brought in, but only if we act to see it safely down to the water."
 gold_fleet_tierra_firme_events.15.a: "Send an armed escort to bring the mule train safely across."
 gold_fleet_tierra_firme_events.15.b: "We cannot wait. Take whatever reaches the coast."
 gold_fleet_tierra_firme_events.15.historical_info: "The silver of Peru reached the Caribbean only after an arduous overland crossing of the Panamá isthmus by #italic recuas#!, mule trains that carried the bullion from Panamá City on the Pacific to Nombre de Dios and later Portobelo on the Atlantic. The jungle trail was preyed upon by #italic cimarrones#! — communities of escaped slaves who had taken to the interior — and in 1573 Francis Drake famously allied with them to ambush a silver train and carry off a fortune. Guarding the isthmus crossing was a perennial and costly concern for the Spanish crown."

 gold_fleet_tierra_firme_events.16.title: "The Pearl Coast"
 gold_fleet_tierra_firme_events.16.desc: "A fast boat pulls alongside with word from [pearl_source.GetName]: the season's harvest of [ShowGoodsName('pearls')] is ready, a small fortune that would take up little room in our holds. A short detour east along the coast would gather it in.\n\nBut those waters are shallow, close, and much frequented by privateers, and a fleet that strays from its course invites trouble. [target_leader.GetName] must weigh the prize against the risk."
 gold_fleet_tierra_firme_events.16.a: "Divert to [pearl_source.GetNameWithNoTooltip] and take the pearls aboard."
 gold_fleet_tierra_firme_events.16.b: "Hold our course. The pearls can wait for another fleet."
 gold_fleet_tierra_firme_events.16.decline_tt: "The fleet keeps to its course and passes the pearl coast by, and our lighter holds ease the dangers of the voyage"
 gold_fleet_tierra_firme_events.16.historical_info: "The pearl fisheries of the southern Caribbean — off Cubagua, Margarita, and the Río de la Hacha — were among the first sources of wealth the Spanish exploited in the New World, worked by enslaved divers under brutal conditions until the beds were largely exhausted. Pearls were small, portable, and immensely valuable, an ideal cargo that packed a fortune into a few chests, and consignments of them were routinely gathered up by the fleets alongside the silver and gold."

 gold_fleet_tierra_firme_events.17.title: "Passage for the Crown's Men"
 gold_fleet_tierra_firme_events.17.desc: "A petition reaches the fleet from [colony_source.GetName]: royal officials and their households, stranded in the colony and awaiting passage home to Spain. Carrying them safely across is a service the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] is certain to note — but the fleet must put in and lie at anchor while they and their baggage are brought aboard.\n\n[target_leader.GetName] must decide whether the fleet's schedule can bear the delay."
 gold_fleet_tierra_firme_events.17.a: "Put in for the officials. Their favor is worth the delay."
 gold_fleet_tierra_firme_events.17.b: "We cannot lose the days. They must wait for a later ship."
 gold_fleet_tierra_firme_events.17.decline_tt: "The officials are left to await another passage, and the fleet keeps to its schedule"
 gold_fleet_tierra_firme_events.17.historical_info: "The Casa de Contratación expected treasure fleets to carry colonial officials, clergy, and their households home to Spain whenever passage was requested, treating it as a duty owed the Crown as much as the silver itself. A captain who turned such passengers away risked complaints reaching the Council of the Indies — though every day spent loading them and their baggage was a day stolen from a voyage already racing the hurricane season."
