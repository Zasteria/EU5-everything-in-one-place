l_english:
 alg_taifa_rais: "Taifa of the Reïs"
 alg_taifa_rais_desc: "The corsair captains of Algiers have organized themselves into a corporation that controls the port's commercial and military waterfront, negotiating ransom payments, distributing prize shares, and maintaining the fleet infrastructure on which the city's prosperity depends. We recognize their corporation as the governing authority of the Algerian maritime economy, granting them the prestige and legal standing to enforce contracts with foreign merchants and to recruit their crews from across the Maghreb. This partnership between crown and corsair elite gives us a capable naval force without the cost of maintaining a royal fleet."
 anr_consell_de_la_terra: "Consell de la Terra"
 anr_consell_de_la_terra_desc: "The Consell de la Terra is the assembly representing the six parishes of Andorra, established to oversee the affairs of the land and protect the ancient rights of its communities against the encroachments of either co-prince."
 anr_quartos: "Quartons"
 anr_quartos_desc: "The six parishes of Andorra govern themselves through elected councils called quartons, which administer local affairs and send representatives to the Consell de la Terra. This ancient system of communal self-rule limits the direct reach of the co-princes into the daily life of our communities."
 anr_sindic_general: "Síndic General"
 anr_sindic_general_desc: "The Síndic General is the elected representative of the Andorran community, charged with defending the collective interests of the parishes before both co-princes and serving as the head of our communal administration."
 basque_cofradias_marineras: "Cofradías Marineras"
 basque_cofradias_marineras_desc: "The mariner brotherhoods of the Basque coast are ancient associations of sailors and fishermen that pool resources, share risk, and maintain the traditions of our seafaring people. Their organized networks of expertise accelerate the building of vessels and ensure a steady supply of experienced sailors."
 basque_pase_foral: "Pase Foral"
 basque_pase_foral_desc: "The Pase Foral is the right of Basque institutions to review and suspend any royal order that conflicts with local fueros before it takes effect in our lands. We obey the king, but only insofar as the ancient laws of our land permit."
 basque_universidad_mercaderes_bilbao: "Universidad de Mercaderes de Bilbao"
 basque_universidad_mercaderes_bilbao_desc: "The merchant guild of Bilbao, formally chartered as the Universidad de Mercaderes, is granted the right to adjudicate commercial disputes, set trading standards, and regulate the ironware and wool trade that flows through the port. Their commercial courts reduce the administrative burden on the crown while generating reliable tax revenues."
 bula_de_la_santa_cruzada: "Bula de la Santa Cruzada"
 bula_de_la_santa_cruzada_desc: "The Pope has granted our realm a permanent crusade bull, allowing us to raise funds from the faithful for the war against the infidel and bestowing special indulgences upon our soldiers who take up arms in defense of the faith."
 cas_letrados: "Letrados"
 cas_letrados_desc: "The crown appoints university-trained jurists and administrators to the councils of state, replacing the hereditary nobility's grip on royal governance with a professional bureaucratic class loyal to royal authority. The letrados bring legal expertise and a culture of administrative efficiency to the machinery of government."
 cas_patronato_real: "Patronato Real"
 cas_patronato_real_desc: "The crown holds the right to nominate bishops and abbots throughout our overseas territories, subordinating the Church in our colonies to royal authority. This Patronato Real transforms the clergy into an instrument of colonial governance and a source of royal prestige."
 cat_capitols_de_cort: "Capítols de Cort"
 cat_capitols_de_cort_desc: "The Capítols de Cort are legislative agreements negotiated between the Crown and the Catalan Corts, binding successive rulers to honor the rights and liberties of the estates. No royal decree may override their provisions without the consent of the realm."
 eastern_amazigh_oasis_charter: "Oasis Charter"
 eastern_amazigh_oasis_charter_desc: "The oasis clusters of the eastern Moroccan and Algerian pre-Sahara are governed by a system of communal water rights and customary land tenures that have sustained settled agriculture in an otherwise arid landscape for centuries. By formally recognizing the charter of these oasis communities and their inherited claim to the water channels and palm groves, we guarantee the productivity of these settlements and bind their inhabitants to the realm through legal security of tenure. This charter turns the harsh desert frontier into a functioning agricultural hinterland and extends our commercial reach into the Saharan trade network."
 glc_archbishopric_compostela: "Archbishopric of Compostela"
 glc_archbishopric_compostela_desc: "As patrons of the Archbishopric of Santiago de Compostela, we draw prestige and income from the endless stream of pilgrims who travel the Camino to venerate the relics of the Apostle, cementing our realm as a center of Christian devotion."
 glc_foros_de_galicia: "Foros de Galicia"
 glc_foros_de_galicia_desc: "The #italic foros#! are hereditary long-lease agreements through which the peasantry of Galicia holds the land they farm in perpetuity, paying fixed dues rather than subject to arbitrary landlord exactions. This stable tenure encourages investment in the land and ties the peasantry to their communities through generations."
 gra_ulema_council: "Council of the 'Ulamā'"
 gra_ulema_council_desc: "The scholars of Islamic law serve as the supreme advisory council of our realm, interpreting religious doctrine and lending religious legitimacy to the sultan's governance. Their authority over legal matters ensures that the administration of justice remains rooted in the divine law."
 gra_visirate: "Vizierate"
 gra_visirate_desc: "The vizierate is an office of high counsel through which noble administrators govern in the sultan's name, bringing order to the affairs of state and ensuring that capable hands guide the realm."
 gra_volunteers_of_faith: "Volunteers of the Faith"
 gra_volunteers_of_faith_desc: "The #italic mutaṭawwi'a#! are pious volunteers who join the sultan's forces in times of war against the infidel, driven by religious conviction rather than feudal obligation. Their numbers swell the ranks of our armies, and their fervor in battle more than compensates for their lack of formal military training."
 gra_volunteers_of_faith_unlocks_mutatawwia_tt: "Allows us to raise [ShowUnitDefinitionName('a_mutatawwia')]"
 kabyle_tajmaat_pact: "Tajmaat Pact"
 kabyle_tajmaat_pact_desc: "The #italic tajmaat#! is the village assembly of the Kabyle highlands, a communal institution in which adult men of the village gather to deliberate on local justice, the allocation of collective resources, and the community's response to external demands. By recognizing the #italic tajmaat#! as the legitimate representative body of the Kabyle peasantry within the estate system, we engage with highland communities on their own terms rather than attempting to impose administrative structures they will resist. This pact gives us stable governance of the highlands without the cost of permanent garrisons, and anchors Kabyle communal loyalty to the realm through mutual recognition."
 lon_concejos_asturianos: "Concejos Asturianos"
 lon_concejos_asturianos_desc: "The self-governing councils of the Asturian towns are an ancient institution rooted in the #italic fuero#! traditions of the mountain passes, where free men organized communal defense and administered justice long before any royal court held sway. Their continued vitality binds our peasantry to the realm through local loyalty rather than coercion."
 lon_san_isidoro_patronage: "Patronage of San Isidoro"
 lon_san_isidoro_patronage_desc: "Our crown endows the Royal Collegiate Church of San Isidoro in León as the spiritual heart of the realm, a royal mausoleum and center of scholarship whose Romanesque scriptorium has preserved the learned tradition of Isidore of Seville through the centuries."
 maghrebi_zawiya_endowment: "Endowment of the Zāwiya"
 maghrebi_zawiya_endowment_desc: "The #italic zāwiya#! is the Sufi lodge that serves simultaneously as a place of worship, a school of Islamic law, a hostel for travelers, and a center of local arbitration across the Maghrebi countryside. By endowing these lodges with legal standing and pious foundations, we extend the reach of religious authority into territories where no governor's writ runs and where the #italic zāwiya#! šayḵ commands more respect than the distant sultan. This investment in the sacred geography of our realm purchases popular loyalty at a fraction of the cost of direct administration."
 masmuda_atlas_pact: "Pact of the Masmuda"
 masmuda_atlas_pact_desc: "The Masmuda clans of the High Atlas and Anti-Atlas highlands have organized their collective defense and local governance around hereditary tribal pacts since the Almohad caliphate, whose founding movement they provided. We recognize the authority of these mountain councils and their right to govern the passes, securing their fierce resistance to any hostile army that attempts to force the highland routes. In exchange, these communities remain loosely bound to the central power while preserving their autonomy and their tradition of communal arms."
 mellah_charter: "Mallāḥ Charter"
 mellah_charter_desc: "The #italic mallāḥ#! is the self-governing Jewish quarter of a Maghrebi city, an institution sanctioned by the sultan as both a guarantor of Jewish communal autonomy and a reliable source of fiscal revenue from the artisan and merchant trades at which Jewish communities excel. By issuing a formal charter, we regularize the legal status of our Jewish subjects, attracting skilled craftsmen, financiers, and long-distance traders whose networks extend across the Mediterranean and the Sahara. This integration of the #italic mallāḥ#! into our urban economy brings artisanal production, commercial credit, and specialized goods that enrich the whole city."
 mll_consolat_de_mar: "Consolat de Mar"
 mll_consolat_de_mar_desc: "The #italic Consolat de Mar#! is our maritime tribunal, empowered to adjudicate disputes of freight, insurance, and partnership according to a codified law of the sea that binds merchant and shipmaster alike. Its consuls, elected from among the trading community itself, strengthen the standing of our burghers, draw settlers to our port towns, and swell our trade income."
 mor_abid_al_bukhari: "'Abīd al-Buḵārī"
 mor_abid_al_bukhari_desc: "The #italic 'abīd#! are an enslaved soldiery conscripted by the sultan and registered under the name of al-Buḵārī as a legal fiction that binds them to the crown rather than to any individual master. We have organized this corps into a standing professional force that answers directly to the throne, reducing our reliance on the fractious tribal confederations for military manpower. This centralization of arms in royal hands marks a decisive step toward a sovereign army independent of the great clan-levies."
 mor_andalusian_refugees: "Andalusian Refugees"
 mor_andalusian_refugees_desc: "The Andalusi and Morisco refugees who have settled in our cities bring with them the artisanal traditions of al-'Andalus: the #italic zillij#! tilework, the fine ceramics, the silk weaving, and the architectural ornament that once distinguished the great cities of the peninsula. By formally recognizing the communal institutions of these refugee communities and granting them the privileges of the burgher estate, we channel their productive energy into our own urban economy and bind them to the throne through gratitude and legal protection. Their workshop traditions and mercantile connections give our cities a productive character that native craft traditions alone could not achieve so quickly."
 mor_gharb_war_tribes: "War Tribes of the Ḡarb"
 mor_gharb_war_tribes_desc: "The Ḵlūṭ, the Sufyān, the Ṭlīq and the Riyāḥ hold the plains of the Ḡarb, the Azġar and the Habṭ on the same terms their forebears took them: land to cultivate and freedom from the tax collector, in return for riding when the sultan calls. It is service we buy and not obedience, and the distinction is lost on neither party — these are tribes we treat with rather than tribes we govern. What the bargain gives us is numbers, for a summons carried to every tent of four confederations puts more men in the saddle than any muster of the towns."
 mor_guich_tribes: "Guich Tribes"
 mor_guich_tribes_desc: "With the Maḵzan built and its authority pressed outward, the exchange of land for service can be made a standing institution rather than a bargain renewed each season. The #italic jīš#! tribes — of usually Arab origin, farming in #italic arḍ al-jayš#! plots handled to each warrior and held free of tax for as long as they ride — are soldiers of the crown first and cultivators second. A corps that feeds itself from its own allotments costs the treasury a fraction of what wages would, and answers to no lineage but ours. Withdraw the centralizing hand and the arrangement lapses: these tribes serve a Maḵzan that reaches them."
 mor_guich_tribes_makhzan_requirement_tt: "We have established the [ShowBureaucracyTypeName('makhzan_bureaucracy')] Bureaucracy"
 mor_guich_tribes_unlocks_guich_cavalry_tt: "Allows us to raise [ShowUnitDefinitionName('a_guich_cavalry')]"
 mor_makhzen_caids: "Maḵzan Quwwād"
 mor_makhzen_caids_desc: "The #italic quwwād#! are crown-appointed regional governors whom the sultan dispatches to assert central authority over the territories the throne administers directly, collecting taxes, administering justice, and maintaining order on behalf of the throne. By formalizing the appointment and oversight of these quwwād, we extend the reach of the Maḵzan apparatus across our realm and reduce the autonomy of the great tribal confederations that might otherwise govern by custom alone. This integration of crown-appointed officers with local influence is the administrative heart of the Moroccan state."
 mor_marabout_patronage: "Marabout Patronage"
 mor_marabout_patronage_desc: "The marabouts are holy men of recognized spiritual descent whose shrines dot the Moroccan landscape and whose intercession the common people seek for healing, arbitration, and protection against misfortune. By patronizing these figures and their attached #italic zāwiya#!, we bind a decentralized network of sacred authority to the Maḵzan, making the sultan the recognized protector of popular Moroccan Islam. This relationship provides us access to religious intermediaries capable of pacifying communities that neither governor nor army can easily reach."
 mozabite_communal_pact: "Mozabite Communal Pact"
 mozabite_communal_pact_desc: "The five cities of the Mzab pentapolis maintain their commercial prosperity through a strict communal discipline enforced by the council of the #italic 'azzāba#!, the Ibadi clerical institution that combines religious authority, commercial arbitration, and the regulation of trade on the Saharan routes. By recognizing this communal self-governance as the formal expression of burghers' estate authority in the Mzab, we embed the pentapolis trading network within our realm without attempting to impose administrative structures that would only generate resistance. The Mozabite reputation for austere honesty in commercial dealings makes their word a currency of trust across the Sahara."
 mudejar_aljamas: "Mudéjar Aljamas"
 mudejar_aljamas_desc: "We recognize the right of Muslim communities to maintain their self-governing #italic aljamas#!, permitting them to practice their faith, adjudicate internal disputes by their own law, and continue their trades and crafts. Their economic contribution is indispensable to our realm, and their loyalty is best secured through accommodation rather than compulsion."
 nav_buenas_villas: "Buenas Villas"
 nav_buenas_villas_desc: "The privileged towns of the realm — the #italic buenas villas#! — are granted royal charters conferring freedom of trade and self-governance in exchange for direct loyalty to the crown. Their burgher councils serve as a counterweight to noble power and a reliable source of revenue for the royal treasury."
 nav_mesnadero: "Mesnaderos"
 nav_mesnadero_desc: "The #italic mesnaderos#! are the royal household cavalry, noble warriors bound by personal service to the crown and renowned for their devastating charges. Their privileged standing as the king's own retinue ensures steadfast loyalty and elite military capability."
 nav_mesnadero_unlocks_mesnaderos_tt: "Allows us to recruit [ShowUnitDefinitionName('a_mesnaderos')]"
 nav_palacio_cabo_armeria: "Palacios Cabo de Armería"
 nav_palacio_cabo_armeria_desc: "The #italic palacios cabo de armería#! are the hereditary noble houses of Navarre whose armiger lineages are inscribed in the royal registers, granting their lords a recognized standing at court and a voice in the counsel of the crown."
 spa_grandes_de_espana: "Grandees of Spain"
 spa_grandes_de_espana_desc: "The Grandees of Spain are the highest-ranking nobility of the realm, granted the extraordinary privilege of standing covered before the monarch and elevated to the councils of state. Their prestige and loyalty are the foundation upon which the crown's authority rests."
 tle_mashwar_court: "Mashwar Court"
 tle_mashwar_court_desc: "The #italic mashwar#! is the inner audience court of the Tlemcen sultanate, where the sultan receives counsel from the great nobles and jurists of the realm in a ceremonial setting that binds them to the throne through formal recognition. Its deliberative character gives the Zayyanid state a consultative legitimacy that distinguishes it from purely coercive rule, lending the sultan's decisions the weight of collective noble endorsement. We formalize the proceedings of this court, making it the recognized channel through which policy is debated and the noble estate exercises its influence within the constitutional order."
 tuareg_caravan_guild: "Tuareg Caravan Guild"
 tuareg_caravan_guild_desc: "The Tuareg confederation controls the trans-Saharan caravan routes by which gold, salt, and enslaved persons move between the Sahel and the Maghrebi ports, and their guides, camel herders, and armed escorts are an irreplaceable feature of the desert economy. By recognizing the guild structure of Tuareg caravan masters and giving it a formal place within the burgher estate, we gain reliable access to the commercial intelligence, the route knowledge, and the safe-conduct guarantees without which no Saharan trade is possible. This partnership between the sultanate and the desert merchants binds the great Saharan commodity flows into our fiscal and commercial system."
 tuareg_imghad_vassalage: "Imghad Vassalage"
 tuareg_imghad_vassalage_desc: "The #italic imghad#! are the vassal-caste clans of the Tuareg confederation, bound by hereditary obligation to serve the noble #italic imajeghen#! lineages in exchange for protection and access to the trans-Saharan pasture routes. By formalizing the authority of these clan hierarchies under the sultan's recognition, we bind the Saharan tribal structure to our rule without imposing direct administration on an ungovernable desert. This #italic imghad#! pact gives us a levy of disciplined desert riders at minimal cost to the central treasury."
 tun_hafsid_caliphal_claim: "Hafsid Caliphal Claim"
 tun_hafsid_caliphal_claim_desc: "The Hafsid sultans derive their claim to governance from descent and recognition as successors to the Almohad caliphate, presenting themselves to the Muslim world as the legitimate heirs to the universal authority of the Commander of the Faithful. We cultivate this caliphal dignity through ceremony, correspondence with distant Muslim rulers, and the patronage of scholars who articulate the theological basis of our claim. This spiritual authority elevates our prestige beyond that of a mere regional sultanate and secures the devotion of our Muslim subjects and allies."
 tun_taifa_of_rais: "Taifa of the Reïs"
 tun_taifa_of_rais_desc: "The Tunisian #italic tā'ifa#! of the reïs is a formally constituted corporation of corsair captains whose statutes govern the conduct of privateering operations, the distribution of prize shares, and the ransom of captives from the city's slave markets. We grant the taifa legal recognition as a chartered corporation of the burgher estate, binding the most capable maritime entrepreneurs of the realm to our cause in exchange for formal rights over the harbor. This arrangement gives Tunis one of the most organized corsair institutions in the western Mediterranean and a reliable source of sailors available for royal service in wartime."
 unlocks_proclaim_pase_foral_tt: "Unlocks the [ShowCabinetActionName('proclaim_pase_foral')] [cabinet_action|e]"
 val_tribunal_de_les_aigues: "Tribunal de les Aigües"
 val_tribunal_de_les_aigues_desc: "The Water Court of Valencia is the oldest functioning tribunal in Europe, convening each Thursday at the cathedral door to adjudicate disputes over irrigation rights among the farmers of the plain. Its unwritten customary rulings, enforced by communal consensus, keep the agricultural heartland of the realm productive and its peasantry orderly."
 zenati_mounted_levy: "Zenati Mounted Levy"
 zenati_mounted_levy_desc: "The Zenata confederation are Berber tribes renowned for their mastery of light cavalry, fighting with the short stirrup and the javelin in the tradition of #italic furūsiyya zanātiyya#! that influenced equestrian practice across both shores of the Mediterranean. We levy these mounted warriors as a fast-striking force capable of screening our armies, raiding hostile supply lines, and covering long distances across the high plateaux with minimal logistical support. Their loyalty to the sultan is secured through the traditional structure of tribute and patronage rather than formal military hierarchy."
