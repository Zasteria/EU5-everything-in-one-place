l_english:

 seven_cities_norumbega.1.title: "A River, but no City"
 seven_cities_norumbega.1.desc: "Three months upriver from the New England coast and the column has reached the head of navigation. There is no walled city here. There is no city anywhere on the Penobscot, as far as the surveying parties have been able to determine. The riverbanks are heavily wooded; there are Abenaki villages in the meadowlands where the river bends; the people are willing to trade furs and ask through the interpreter what we were expecting to find. The chronicler has no good answer. [target_leader.GetName] writes the dispatch in a small log fort by the river-mouth and waits for the spring thaw to start back."
 seven_cities_norumbega.1.a: "Strike the standard. The legend was a fisherman's tale."
 seven_cities_norumbega.1.historical_info: "Norumbega first appears on European maps in the 1530s, attached to a region somewhere on the Atlantic coast of present-day Maine. By the time of the actual European exploration of the Penobscot valley a century later, the legend had grown to include a walled city of fair stone on the upper river. The fact-base on which any of this rested seems to have been the inflated reports of a single French expedition that briefly traded with the Abenaki of the lower Penobscot in 1525 and described their bark-covered longhouses, in language at home of the wealthier inhabitants of Saint-Malo, as something approaching a stone-walled European town."

 seven_cities_norumbega.2.title: "A Settled Country"
 seven_cities_norumbega.2.desc: "The country we have entered is not a city in the legend's sense, but it is a settled country. The Penobscot bank between the river-mouth and the falls is dotted with bark-walled villages, fenced gardens, ceremonial mounds, and well-built bark-canoes. The Abenaki sachem at the largest of the villages receives the [target_leader.GetName] with formal courtesy and is willing to grant the use of a riverside plot for a French or English trading post. The fur trade is real. The walled city is not. The country may be worth holding all the same."
 seven_cities_norumbega.2.a: "Establish the post. The fur trade justifies a presence."
 seven_cities_norumbega.2.historical_info: "The Abenaki sociopolitical structure in the early contact period was based on extended-family villages organised under hereditary sagamores, with seasonal movement between river-bottom planting sites and coastal fisheries. European traders found the system congenial: it produced predictable trading partners, a steady supply of furs and corn, and political fragmentation that prevented any single Abenaki polity from imposing terms on the trade. Norumbega-as-walled-city was a fantasy, but the Penobscot fur trade that the legend pointed toward proved durable for more than two centuries."

 seven_cities_norumbega.3.title: "A Walled City on the River"
 seven_cities_norumbega.3.desc: "The country we have entered is the country the maps described. The river runs deep and clear for forty leagues into the interior. At the head of navigation, on the western bank, the column has found a walled city: stone curtain-walls in the European style, a central plaza, a great-house of stone roofed in slate, a market square. The population is mixed: the bulk are Abenaki, but the headman speaks a corrupted Old Norse that the Latinist on the staff can partly follow, and there is, in a stone shrine in the central square, a single iron sword of clear Scandinavian work. They have been here, the headman says, since his great-grandfather's grandfather. [target_leader.GetName] is taking notes faster than the chronicler."
 seven_cities_norumbega.3.a: "Sign the treaty. We have found the country, and the gold."
 seven_cities_norumbega.3.historical_info: "European fantasies of a vanished Norse colony surviving in the interior of North America circulated for centuries and were occasionally given credence by isolated archaeological finds, the Newport Tower, the Kensington Runestone, the Maine Penny, the Vinland Map, that have without exception turned out to be of dubious provenance or outright forgery. The actual archaeological evidence of Norse presence in North America is confined to L'Anse aux Meadows in Newfoundland and a small handful of stray finds compatible with brief Norse forays further south. A walled stone city of Scandinavian descent on the Penobscot has never existed."

 seven_cities_norumbega.10.title: "The Man Who Walked"
 seven_cities_norumbega.10.desc: "He is waiting on the quay before the last water casks are stowed: barefoot, burned brown, dressed in whatever three different ports would part with. [target_character.GetName] tells his story with the air a man who has told it often. Cast away on the far shore of the western ocean years ago, he walked the length of its coast for a year or more until a fishing crew took him off a northern headland. Somewhere in the middle of that journey he passed through Norumbega, and he speaks of the pillars of crystal and silver there, of lords carried in litters hung with pearls. The pilots ask him to show them place on a chart, but he only responds that no chart has ever been right about anything."
 seven_cities_norumbega.10.a: "Sign him aboard. He has walked the road we mean to sail."
 seven_cities_norumbega.10.b: "Take down his testimony and leave him on the quay."
 norumbega_walker_signs_aboard_tt: "[target_character.GetName] signs aboard as a guide"
 seven_cities_norumbega.10.historical_info: "In 1568 the English sailor David Ingram and a hundred shipmates were put ashore near Tampico after the fight at San Juan de Ulua left John Hawkins without provisions to carry them home. Eleven months later a French ship took Ingram off the coast of Nova Scotia, which if true means he had walked some three thousand miles of native trade paths. By the time Sir Francis Walsingham's circle examined him in 1582, the walk had acquired a city called Norumbega, with pillars of silver and crystal and kings borne on ruby-studded chairs. Richard Hakluyt printed the account in 1589 and dropped it from his next edition as past believing. The walk itself may well have happened. The city grew in the telling, drawn out of a poor man by great men who asked exactly the questions they wished answered."

 seven_cities_norumbega.11.title: "The Pilot's Cosmography"
 seven_cities_norumbega.11.desc: "A month out, and the pilot has taken to reading at the chart table after the evening watch. His book is an old cosmography, copied and recopied until the coastlines have blurred, yet its words retain an absolute assurance. Behind a certain headland on the coast we are steering for, the book promises a great river, and up that river a walled town of clever people who use words that ring like church [ShowLanguageName('latin_language')]. The priest has begun to speak of a lost [ShowReligionGroupAdjective('christian')] country in the west. Our interpreter observes that the author heard the [ShowLanguageNameWithNoTooltip('latin_language')] from a man who heard it from another man, and that this is how books are made."
 seven_cities_norumbega.11.a: "Mark the river exactly as the book gives it."
 seven_cities_norumbega.11.b: "Stow the book. We sail by log and lead-line."
 seven_cities_norumbega.11.b.tt: "#italic The cosmography goes back into its chest, and the voyage keeps to the pilot's dead reckoning#!"
 seven_cities_norumbega.11.historical_info: "Jean Alfonse, the pilot who brought Roberval's colonists to Canada in 1542, wrote in his #italic Cosmographie#! of entering a great river at Norumbega and finding a town of intelligent people who spoke a language similar to Latin. His account folded into a name Verrazzano had set down on that coast in 1524, and the mapmakers did the rest. Mercator's world map of 1569 shows Norumbega as a turreted city on a broad river, and cartographers copied it faithfully from one another for the better part of a century. However, the city never existed anywhere except in the copying."

 seven_cities_norumbega.12.title: "Smoke on the River"
 seven_cities_norumbega.12.desc: "The staging anchorage is behind us and the great river opens ahead, wide and dark between wooded banks. Canoes come out to trade before we have shortened sail, and our interpreter is pressed to ask: Where is the walled city? They point upriver at their own town, bark lodges above a fish-weir with smoke trailing into the cold air. The question is asked again, with gifts, and a third time with better gifts, but the answer never changes. [target_leader.GetName] orders the trade goods repacked, and falls silent."
 seven_cities_norumbega.12.desc_walker: "The man who walked has kept to the rail since we entered the river, and by now the men watch him more closely than they watch the banks. Brought before the officers at last, he studies the shore for a long while and says that the city lies farther on. It is always farther on, past this town, past where any of these people have ever gone. The men choose to believe him, because belief costs nothing tonight, and the alternative would cost the whole voyage."
 seven_cities_norumbega.12.a: "The maps are not upside down. Upriver!"
 seven_cities_norumbega.12.b: "Chart the river as it is, not as it was wished."
 seven_cities_norumbega.12.c: "Our leader has hunted through worse than smoke. Onward."
 seven_cities_norumbega.12.historical_info: "When serious exploration finally reached the Penobscot, the legend did not survive the meeting. Samuel de Champlain ascended the river in 1604 expressly to settle the question of Norumbega and found Abenaki villages and no trace of any city, walled or otherwise; he noted dryly that he had seen nothing of the marvels that had been reported. The name lingered on maps for another two generations, drifting along the coast and shrinking as it went, before it fell off the charts altogether. Few legends have been killed so cleanly by a single voyage."

 seven_cities_norumbega.13.title: "The Isle of Demons"
 seven_cities_norumbega.13.desc: "The island rises out of the fog exactly where the charts print its warning, and the wind across it makes a sound the men decline to describe to one another. Then the lookout calls again, and the spyglass passes from hand to hand in silence. On the shore below the rocks there is a driftwood fire, tended and banked against the wind, and beside it a figure in the rags of what was once good clothing, waving a burning brand at us with both arms. Demons, the boatswain observes, do not usually need firewood."
 seven_cities_norumbega.13.a: "Put a boat ashore. Whoever keeps that fire has earned it."
 seven_cities_norumbega.13.b: "Hold course. Some fires are lit as bait."
 seven_cities_norumbega.13.b.tt: "#italic The island falls astern, and the fire burns on the shore until the fog takes it#!"
 norumbega_survivor_joins_tt: "[target_character.GetName] is taken off the island and joins our court"
 seven_cities_norumbega.13.historical_info: "In 1542 the nobleman Roberval, sailing to colonize Canada with Jean Alfonse as his pilot, discovered that his young kinswoman Marguerite de La Rocque had taken a lover aboard ship, and marooned her on the Isle of Demons off the Newfoundland coast with the lover and a maidservant. The lover, the servant, and a child born on the island all died there. Marguerite survived alone for more than two years, shooting bears with the party's arquebuses, until Basque fishermen took her off. Back in France she told her story to the Queen of Navarre, who put it in a book, which is the only reason we know it. The island itself has since been forgotten; no one is certain today which one it was."

