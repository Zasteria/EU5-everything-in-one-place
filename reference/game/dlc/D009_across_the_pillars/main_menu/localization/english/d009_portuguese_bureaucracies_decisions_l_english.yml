l_english:
 por_assumed_grandmastership_of_military_orders_tt: "Unlocks the [ShowDecisionName('por_mesa_da_consciencia_e_ordens_decision')] [decision|e]"
 por_assumed_grandmastership_of_military_orders_requirement_tt: "The country must have assumed the grandmastership of the military orders"
 por_mesa_da_consciencia_e_ordens_decision.title: "Establish the $por_mesa_da_consciencia_e_ordens_bureaucracy$"
 por_mesa_da_consciencia_e_ordens_decision.desc: "Our military orders hold vast commanderies and revenues beyond the reach of ordinary administration, their affairs settled piecemeal by whichever cleric or captain presses hardest for royal favor. Let us erect a standing tribunal — the Mesa da Consciência e Ordens — to examine their petitions, allocate their commanderies, and bind their spiritual authority ever more tightly to the Crown's purpose."
 por_mesa_da_consciencia_e_ordens_decision.a: "Establish the tribunal."
 establish_mesa_da_consciencia_e_ordens_tt: "Unlocks the [ShowBureaucracyTypeName('por_mesa_da_consciencia_e_ordens_bureaucracy')]"
 established_mesa_da_consciencia_e_ordens_tt: "Established the [ShowBureaucracyTypeName('por_mesa_da_consciencia_e_ordens_bureaucracy')] with the $por_mesa_da_consciencia_e_ordens_decision.title$ decision."
 por_estado_da_india_decision.title: "Estado da Índia"
 por_estado_da_india_decision.desc: "The #italic Casa da Índia#! answers for our trade, but our fortresses and factories from $india$ to the South China Sea still answer to no single hand. It has been suggested that Goa be raised into the seat of a formal viceroyalty — an #italic Estado#! — under which every garrison, fleet, and counting-house east of the Cape reports to one royal authority."
 por_estado_da_india_decision.desc.entry: "Casa da Índia keeps our ledgers, but our garrisons, fleets, and factories east of the Cape still answer to no single authority. A viceroy seated at Goa would bind them all under one Estado."
 por_estado_da_india_decision.a: "Let Goa govern the East."
 por_estado_da_india_decision.a.tt: "Unlocks the [ShowGovernmentReformName('por_estado_da_india_reform')] [government_reform|e]"
