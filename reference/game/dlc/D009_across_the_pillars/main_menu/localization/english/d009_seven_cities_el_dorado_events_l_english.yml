l_english:

 seven_cities_el_dorado.1.title: "A Lake, a Boat, and Nothing"
 seven_cities_el_dorado.1.desc: "After six months in the highlands the column has reached the lake the Muisca priests describe as the heart of the ceremony: a circular crater filled with dark water, ringed by terraced hills, with a single ceremonial path leading down to the shore. The priests are no longer here; the country was depopulated by smallpox a generation before our arrival. The lake has been dragged in three places by a team of native divers willing to be paid in trade goods. They have brought up some gold-work, a quantity of pottery, the bones of fish and a dog, and nothing that resembles a king. [target_leader.GetName] is forced to conclude the ceremony was real, and the kingdom that supported it is gone."
 seven_cities_el_dorado.1.a: "Strike the standard. There is no country left to treat with."
 seven_cities_el_dorado.1.historical_info: "Guatavita is a sacred crater-lake in the highlands of present-day Colombia, the cult centre of the Muisca confederation that ruled the savannah of Bogota until the Spanish arrival in the 1530s. The ceremony at the heart of the El Dorado legend, the periodic anointing of a new chief with gold dust before he was rowed onto the lake and the dust washed off into the water, was real and was conducted at Guatavita well into the early colonial period. The kingdom that conducted it, however, was already in collapse by the time the first European expedition reached the savannah, having been ravaged by smallpox and by the political crisis that the arrival of European disease almost everywhere produced."

 seven_cities_el_dorado.2.title: "Gold-Work and Memory"
 seven_cities_el_dorado.2.desc: "The country we have reached is no longer the country El Dorado lived in. The chiefdoms of the highlands are fragmented and reduced; the central court is gone; the lake is no longer a place of ceremony. But the workshops are still there. The goldsmiths still work in the old style. A pectoral of beaten gold representing a man on a raft is purchased from one of the village smiths for the price of an iron axe. The chronicler sketches it twice over. The trade in worked gold can be sustained. The court of legend cannot be reconvened."
 seven_cities_el_dorado.2.a: "Establish a trading post for the gold-work."
 seven_cities_el_dorado.2.historical_info: "Muisca metallurgy was among the most sophisticated in the pre-Columbian Americas, working not only gold but a copper-gold alloy called tumbaga that allowed for sophisticated lost-wax casting at low temperatures. The fragmentary survival of the Muisca tradition into the colonial period meant that authentic pre-Conquest goldwork continued to be produced in highland workshops well into the seventeenth century, sometimes for traditional clients, sometimes for the Spanish market. The famous Muisca raft figure, which depicts the El Dorado ceremony, was made in this period and is now in the Museo del Oro in Bogota."

 seven_cities_el_dorado.3.title: "The Gilded King"
 seven_cities_el_dorado.3.desc: "The country we have reached is the country the legend described, found before its fall: a confederation of highland chiefdoms with a central court, a sacred lake, an annual ceremony in which the paramount chief is annointed with gold dust at the heart of his territory. The court receives the [target_leader.GetName] with formal grace. The treaty offered is a treaty of trade, not of conquest; the chief is not willing to be a vassal, but he is willing to be a partner. The gold-work alone is worth what the entrada cost. The treaty, properly held, is worth more than that."
 seven_cities_el_dorado.3.a: "Sign. A partner in the new world, not a conquered province."
 seven_cities_el_dorado.3.historical_info: "The El Dorado myth in its mature form, the wealthy interior kingdom whose ruler is annointed annually with gold dust, kept expeditions moving into the South American interior for two and a half centuries after the actual cult centre at Guatavita had been documented, depopulated, and quietly forgotten. The persistence of the myth in the European imagination, despite the steady accumulation of evidence that whatever had once existed was no longer there, is a textbook example of what economists call sunk-cost reasoning operating across generations of state-funded exploration."

