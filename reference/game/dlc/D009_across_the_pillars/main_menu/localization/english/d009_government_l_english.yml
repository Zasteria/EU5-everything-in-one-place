l_english:
 agraw_federation_reform: "Agraw Federation"
 agraw_federation_reform_desc: "The #italic agraw#! — the village-and-clan deliberative assembly of the Kabyle highlands — governs without a central executive: decisions taken in council bind all participating clans, and no single office can override the combined voice of the assembled elders. This federal structure makes us nearly impervious to the standard method of conquest — there is no throne to capture, no palace to burn, and no single treaty to repudiate — and it brings the villages into one administrative unit without imposing on them the apparatus of a distant sultan. We accept slower deliberation as the price of genuine self-governance, and find that our people, left to their own assemblies, have little reason to revolt against them."
 alg_dey_regency_reform: "Regency of Algiers"
 alg_dey_regency_reform_desc: "The Regency of Algiers has evolved a distinctive governmental form: a #italic dey#! elected by the military's janissary corps, an aga commanding the land forces, and a #italic divan#! of senior officers who together constitute both the cabinet and the parliament of the state. This is not a dynasty — the #italic dey#! answers to the corps that made him, and a #italic dey#! who loses the confidence of the #italic odjak#! rarely lasts out the season — but it is a stable system of its kind, producing an administratively capable corsair-military state that punches well above its population in naval and commercial projection. We have codified this arrangement as the constitutional form of the Regency, accepting the instability of military succession in exchange for an army that governs itself and a treasury fed by the sea."
 amenokal_paramountcy_reform: "Amenokal Paramountcy"
 amenokal_paramountcy_reform_desc: "The #italic amenokal#! — paramount chief of the Tuareg confederation — rules not through a bureaucracy but through the personal authority of his title, the drum-of-office regalia, and the loyalty of the noble #italic imashaghen#! caste who enforce his will across the dispersed clans. His power is simultaneously personal and confederal: real enough to mobilize the mounts and spears of every confederation member, diffuse enough to project across hundreds of leagues of desert without a garrison to hold each oasis. We have codified this paramount structure as our governmental form, concentrating diplomatic and military coordination in the amenokal's person while leaving the daily governance of each clan to its own customs."
 amir_al_muslimin: "Amīr al-Muslimīn"
 amir_al_muslimin_desc: "The title #italic Amīr al-Muslimīn#! — Commander of the Muslims — was carried by the Almoravid sultans who crossed the Sahara to rescue al-'Andalus from Christian encroachment and by our Marinid forebears who returned across the Strait again and again in the same cause. Winning the Strait from the fleets of Castile and Aragon has placed us in that lineage: protectors of the last western frontier of Islam, recognized in the khuṭba of every mosque from Fez to the Guadalquivir. This title binds the Andalusi communities to our throne, fills our banners with willing warriors of the faith, and carries our name to every Muslim court that watches the Iberian peninsula."
 anr_coprincipality_reform: "Co-Principality Structure"
 anr_coprincipality_reform_desc: "The land of Andorra is governed under a unique constitutional arrangement: the joint sovereignty of two co-princes, the Bishop of Urgell and the Count of Foix, whose competing claims have paradoxically produced a stable equilibrium. Neither sovereign can act without the consent of the other, and this mutual check has preserved Andorra from absorption by either neighbor. We have formalized this co-principality structure as the constitutional foundation of our realm, accepting the limitations it places on unilateral action in exchange for the diplomatic shelter it provides."
 ara_diputacion_general_reform: "Diputación General de Aragón"
 ara_diputacion_general_reform_desc: "The #italic Diputació General d'Aragó#! began as a standing committee of the Cortes of Aragon tasked with overseeing the collection of subsidies granted to the Crown, and has since grown into a permanent institution of government. Administered by elected #italic Diputados#! drawn from the three Estates, it ensures fiscal accountability and guards the constitutional #italic fueros#! against royal encroachment. The Diputación meets year-round, transforming what was once an occasional assembly into a continuous organ of Aragonese self-governance."
 basque_juntas_generales_reform: "Juntas Generales"
 basque_juntas_generales_reform_desc: "The #italic Juntas Generales#! are the traditional representative assemblies of the Basque provinces, meeting beneath the ancient oak of Gernika to deliberate on law, taxation, and the defense of local rights. Each province maintains its own #italic fuero#!, a body of customary law that any overlord must swear to uphold before their authority is recognized. The Juntas represent a form of decentralized self-governance unique in [ShowRegionName('iberia_region')], one that no centralizing Crown has managed to abolish without provoking fierce resistance."
 cas_santa_hermandad_reform: "Santa Hermandad"
 cas_santa_hermandad_reform_desc: "The #italic Santa Hermandad#! is a permanent royal constabulary charged with policing the roads and suppressing brigandry across our realm. Founded by the joint authority of Fernando and Isabel, it replaces the old municipal brotherhoods with a centralized force answerable to the Crown. The #italic Hermandad#! ensures that the safety of travel and commerce extends into the countryside, bringing the reach of royal justice far beyond the city walls."
 cas_santa_hermandad_unlocks_hermandad_infantry_tt: "Allows us to raise [ShowUnitDefinitionName('a_hermandad_infantry')]"
 cas_santa_hermandad_unlocks_summon_santa_hermandad_tt: "Unlocks the [ShowCabinetActionName('summon_santa_hermandad')] [cabinet_action|e]"
 cat_corts_catalanes_reform: "Corts Catalanes"
 cat_corts_catalanes_reform_desc: "The #italic Corts Catalanes#! are one of the oldest representative assemblies in Europe, organized in three arms — the clergy, the nobility, and the #italic braç reial#! representing the royal towns. No extraordinary taxation may be levied without the consent of all three arms, and the Crown must address the assembly's grievances before any subsidy is granted. This three-arm constitution defines the Catalan polity as a pact between ruler and ruled, where sovereignty rests not in the monarch alone but in the organic whole of the realm."
 cat_generalitat_reform: "Generalitat de Catalunya"
 cat_generalitat_reform_desc: "The #italic Generalitat de Catalunya#! was established as the permanent standing committee of the Catalan Corts, entrusted with administering subsidies and governing between sessions of the full assembly. Over time it has become the institutional embodiment of Catalan constitutional liberties, a continuous body of elected representatives who hold the Crown to its sworn obligations. The Generalitat's permanence transforms Catalan parliamentary tradition from an occasional assembly into the daily reality of governance."
 diwan_of_the_azzaba_reform: "Dīwān al-'Azzāba"
 diwan_of_the_azzaba_reform_desc: "The #italic Dīwān al-'Azzāba#! — the council of Ibadi religious scholars who serve simultaneously as jurists, arbiters, and governors — is the unique political form of the Mzab pentapolis, and the closest approximation to the original Ibadi ideal of a community governed by the most learned rather than the most powerful. State and faith are not separated here: the #italic 'Azzāba#! hold court in the mosque, pronounce on commercial disputes under the same doctrinal framework as theological questions, and legitimate authority requires the consent of this clerical council before it can act. We embrace this austerity as a constitutional principle: our realm will be governed not as kingdoms are governed, but as a community of believers accountable to God and to one another."
 glc_xunta_xeral_reform: "Xunta Xeral do Reino de Galicia"
 glc_xunta_xeral_reform_desc: "The #italic Xunta Xeral do Reino de Galicia#! is the representative assembly of our kingdom, convening delegates from the seven provinces of Galicia to deliberate on taxation, justice, and the defense of regional rights. As a permanent institution, it gives the Galician nobility, clergy, and towns a formal channel through which to negotiate with the Crown and safeguard the particular customs of this corner of [ShowRegionName('iberia_region')]. The #italic Xunta#!'s enduring authority has made Galicia one of the better-governed peripheries of the peninsula."
 gra_hajib_reform: "Ḥājib ad-Dawla"
 gra_hajib_reform_desc: "The office of #italic Ḥājib#! — chamberlain and chief minister — is the pivot around which the administration of our Emirate turns. The Ḥājib coordinates the royal household, oversees the financial administration of the #italic dīwān#!, and acts as the principal intermediary between the sultan and the bureaucratic machinery of the state. By formalizing and empowering this office, we concentrate the day-to-day work of governance in the hands of a single capable administrator, freeing the sultan for the demands of war and diplomacy while ensuring the smooth functioning of the realm."
 jamaa_parliament: "Jamā'a"
 jamaa_parliament_desc: "The standing consultative body of our emirate, gathering the #italic qāḍī al-jamā'a#!, the #italic wazīr#!, the #italic šayḵ al-ḡuzāt#!, and the leading clans of the frontier under a single roof, so that no faction speaks louder than the whole."
 lon_cortes_de_leon_reform: "Cortes de León"
 lon_cortes_de_leon_reform_desc: "The #italic Cortes de León#! — first convened in 1188 under Alfonso IX — are among the oldest representative assemblies in European history, predating the English Parliament by nearly a century. Drawing together the clergy, the nobility, and representatives of the towns, they established the principle that the monarch must seek the counsel of all estates before imposing new obligations. This founding constitutional tradition gives our governance a legitimacy rooted not in conquest alone but in the formal consent of the realm."
 mll_universitat_de_mallorca_reform: "Universitat de Mallorca"
 mll_universitat_de_mallorca_reform_desc: "The #italic Universitat de la Ciutat i Regne de Mallorca#! is the governing body of our island realm, administered by elected #italic Jurats#! who oversee taxation, public works, and the interests of the burgher and merchant communities. Its long tradition of municipal self-governance has made the mercantile class the dominant force in Mallorcan affairs, ensuring that trade policy and port administration reflect the needs of those who profit from the sea. The Universitat's competent civic administration is the backbone of Mallorcan prosperity."
 mor_marinid_zenata_confederation_reform: "Marinid Zenata Confederation"
 mor_marinid_zenata_confederation_reform_desc: "The #italic Banū Marīn#! rode out of [ShowLocationName('figuig')] as [ShowCultureName('zenati')] horse-lords and took [ShowLocationName('fez')] from the failing [ShowDynastyName('almohad_dynasty')] dynasty by tribal cohesion and a banner of [ShowReligiousSchoolName('maliki_school')] orthodoxy. Our [ShowDynastyName('marinid_dynasty')] dynasty still stands on both pillars: the [ShowCultureNameWithNoTooltip('zenati')] clans ride when our [GetCountry('MOR').GetGovernment.GetRulerTitle|l] summons them, the #italic fuqahā'#! bless [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] rule, and the #italic jihād#! in al-'Andalus answers to each. A [ShowDynastyNameWithNoTooltip('marinid_dynasty')] [GetCountry('MOR').GetGovernment.GetRulerTitle|l] commands because [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] tribesmen follow and [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] scholars sanction, and must keep proving both with the sword."
 mor_sharifian_sultanate_reform: "Sharifian Sultanate"
 mor_sharifian_sultanate_reform_desc: "The Sharifian sultans have transformed Morocco from a confederation beholden to its tribal levies into a centralized monarchy whose authority flows from both genealogical sanctity and military discipline. The #italic jīš#! service-tribes settle on crown land, Andalusi gunners drill on Fez's artillery range, and the great #italic maḵzan#! apparatus moves tax rolls and judicial writs across the realm with a regularity the Marinids never achieved. This is the state-form that turns our #italic baraka#! — the sacred charisma of descent from the Prophet — from a legitimacy claim into a governing system: a sultanate that is simultaneously a dynasty, a bureaucracy, and a religious court."
 nav_cortes_navarra_reform: "Cortes de Navarra"
 nav_cortes_navarra_reform_desc: "The Cortes of Navarre convene the three estates of the kingdom — clergy, nobility, and the towns — in a body whose consent is required for any extraordinary taxation or major legislation. Older than most Iberian parliaments, the Navarrese Cortes have jealously guarded the traditional liberties of the realm and maintained the particular law codes that distinguish Navarre from its larger neighbors. By institutionalizing this assembly, we formally acknowledge that the authority of the Crown flows through and with the consent of the estates."
 por_estado_da_india_reform: "Estado da Índia"
 por_estado_da_india_reform_desc: "The #italic Estado da Índia#! is the formal administrative framework through which [GetCountry('POR').GetName] governs its far-flung network of trading posts, fortresses, and colonies across Asia. Administered from the viceregal seat of Goa, it coordinates the fleets, garrisons, and revenue of a maritime empire spanning from the Persian Gulf to the South China Sea. By centralizing colonial governance under a single viceregal authority, the #italic Estado#! allows the Crown to extract revenue and project power far beyond what any private trading venture alone could sustain."
 ribat_state_tradition_reform: "Ribaṭ-State Tradition"
 ribat_state_tradition_reform_desc: "The #italic ribaṭ#! — the fortified-monastery from which the Almoravid movement organized its sweep across the Sahara and up through the Maghreb — is more than a building: it is a model of governance, where the religious-military brotherhood occupies a network of fortresses and mosques from which it administers the surrounding territory through the piety of its garrison rather than the payroll of a civilian bureaucracy. We have inherited this tradition: our polity is governed from fortress nodes rather than from a single palace, our administrators are at the same time warriors and men of religion, and our legitimacy rests on the sustained discipline of the frontier rather than the genealogy of a dynasty. This austerity of governance gives us hard-defended positions, a clergy that fights, and a fighting force that prays."
 tun_husaynid_beylik_reform: "Husaynid Beylik"
 tun_husaynid_beylik_reform_desc: "Where the Ottoman framework installed rotating governors answerable to the Porte, the Husaynid #italic bey#! transformed the #italic beylik#! of Tunis into a hereditary dynasty in all but name, negotiating a constitutional fiction — nominal Ottoman sovereignty, effective dynastic rule — that lasted into the modern era. The Husaynids built a capable cabinet-based administration, preserved Ifrīqyan cultural continuity, and managed the balance between the increasingly nominal Ottoman connection and the practical demands of European diplomacy with more sophistication than most comparable polities. We have institutionalized this hybrid: a state that is dynastically governed, administratively modern in its cabinet apparatus, and prestigious enough to deal as a recognized sovereign while retaining the theological cover of Islamic suzerainty."
