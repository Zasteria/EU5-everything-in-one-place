l_english:
 #
 # The Battle for the Strait
 #
 battle_for_the_strait: "Battle for the Strait"
 battle_for_the_strait_info: "A struggle over the [ShowLocationName('strait_of_gibraltar')] between [GetCountry('CAS').GetName], [GetCountry('MOR').GetName], and [GetCountry('GRA').GetName]. Whoever holds the strait controls the gateway between the Atlantic and the Mediterranean."
 owner_christian_or_castile_tt: "Owner is either [ShowReligionGroupAdjective('christian')] or [GetCountry('CAS').GetName]"
 cas_integrated_granada_lands_tt: "[GetCountry('CAS').GetName] directly owns and holds a core on every location [GetCountry('GRA').GetName] held at the start"
 battle_for_the_strait_desc: "The narrow waters between [ShowRegionName('iberia_region')] and [ShowContinentName('africa')] form one of the most strategic chokepoints in the world. The [GetCountry('CAS').GetLongName] looks south to secure [ShowRegionNameWithNoTooltip('iberia_region')] under [ShowReligionGroupAdjective('christian')] banners. The [GetCountry('MOR').GetLongName] looks north to defend [ShowFormableCountryName('ADU_f')] and to keep the crossings of the faithful open. The [GetCountry('GRA').GetLongName], pressed on every side, fights to remain master of its own shore. Whoever prevails will hold the keys to two seas."

 battle_for_the_strait_castilian_supremacy: "[GetCountry('CAS').GetAdjectiveWithNoTooltip] Supremacy"
 battle_for_the_strait_castilian_supremacy_desc: "$BULLET$The #Y 100-year#! [ShowModifier('crown_of_the_reconquista_modifier')] [modifier|e]\n$BULLET$An additional modifier on the [ShowGovernmentReformName('crown_castile_reform')] [government_reform|e]\n$BULLET$Access to the [ShowDecisionName('gc_decision')] [decision|e], which begins the [ShowSituationName('golden_century')] [situation|e]"
 battle_for_the_strait_moroccan_supremacy: "[GetCountry('MOR').GetAdjectiveWithNoTooltip] Supremacy"
 battle_for_the_strait_moroccan_supremacy_desc: "$BULLET$The #Y 100-year#! [ShowModifier('protector_of_andalus_modifier')] [modifier|e]\n$BULLET$Promotion to [ShowCountryRankName('rank_empire')], if not there already\n$BULLET$Full [core|e] [integration|e] of every [location|e] held in [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')], and [ShowAreaName('murcia_area')]\n$BULLET$#G 25%#! [annexation|e] progress toward every [ShowSubjectTypeName('taifa')] under annexation\n$BULLET$Easier formation of [ShowFormableCountryName('ADU_f')]\n$BULLET$Access to the [ShowDecisionName('gc_decision')] [decision|e], which begins the [ShowSituationName('golden_century')] [situation|e]"
 battle_for_the_strait_granadan_sovereignty_preserved: "Granadan Sovereignty Preserved"
 battle_for_the_strait_granadan_sovereignty_preserved_desc: "$BULLET$The #Y 100-year#! [ShowModifier('gra_consolidated_governance_modifier')] [modifier|e]\n$BULLET$The [ShowCasusBelliName('cb_reconquer_iberia')] to reclaim [ShowRegionName('iberia_region')] at reduced cost\n$BULLET$Full [core|e] [integration|e] of every [location|e] held in [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')], and [ShowAreaName('murcia_area')]\n$BULLET$#G 25%#! [annexation|e] progress toward every [ShowSubjectTypeName('taifa')] under annexation\n$BULLET$Easier formation of [ShowFormableCountryName('ADU_f')]\n$BULLET$Access to the [ShowDecisionName('gc_decision')] [decision|e], which begins the [ShowSituationName('golden_century')] [situation|e]"
 battle_for_the_strait_neutral_outcome: "Neutral Outcome"

 BFTS_NEUTRAL_OUTCOMES_HEADER: "Neutral Outcomes"
 BFTS_OUTCOME_CONDITIONS_TITLE: "Winning Conditions"
 BFTS_OUTCOME_REWARD_TITLE: "Reward"

 this_is_castile_tt: "This is the [GetCountry('CAS').GetLongName]"
 this_is_morocco_tt: "This is the [GetCountry('MOR').GetLongName]"
 this_is_granada_tt: "This is the [GetCountry('GRA').GetLongName]"
 this_is_a_subject_of_castile_tt: "This is a [subject|e] of [GetCountry('CAS').GetName]"
 this_is_a_subject_of_morocco_tt: "This is a [subject|e] of [GetCountry('MOR').GetName]"
 this_is_a_subject_of_granada_tt: "This is a [subject|e] of [GetCountry('GRA').GetName]"

 #Battle for the Strait — Granadan Sovereignty tracker + Influence over Granada signed axis
 BFTS_CASTILIAN_INFLUENCE_LABEL: "Iberian Influence"
 BFTS_MOROCCAN_INFLUENCE_LABEL:  "Maghrebi Influence"
 BFTS_GRA_SOVEREIGNTY_LABEL:     "Granadan Sovereignty"
 BFTS_GRA_SOVEREIGNTY_TITLE:     "$game_concept_granadan_sovereignty$ of [Country.GetNameWithNoTooltip]"
 BFTS_INFLUENCE_BAR_TITLE:       "$influence_over_granada$"
 BFTS_INFLUENCE_BAR_TOOLTIP_TT:  "The [GetCountry('GRA').GetName] court swings on a signed axis from $bfts_axis_min$ ([GetCountry('CAS').GetNameWithNoTooltip]) to $bfts_axis_max$ ([GetCountry('MOR').GetNameWithNoTooltip])"
 BFTS_INFLUENCE_MONTHLY_DRIFT_LABEL: "Monthly drift on the $influence_over_granada$ axis"



 # ===== Battle for the Strait (migrated from battle_for_the_strait_l_english.yml) =====
 cas_appoint_adelantado_mayor: "Appoint the Adelantado Mayor de la Frontera"
 cas_appoint_adelantado_mayor_desc: "First named in 1253 to govern the marches won from the Moors, the Adelantado Mayor de la Frontera carries three offices on one set of shoulders: appellate judge over the southern lands, royal executor of the ordinances issued by the [GetCountry('CAS').GetGovernment.GetRulerTitle], and standing commander of every cabalgada that crosses the border into [GetCountry('GRA').GetName]. The appointee's estate decides which power bloc thrives at [GetCountry('CAS').GetGovernment.GetCourtTitle], and every [GetCountry('CAS').GetAdjective] province bordering [GetCountry('GRA').GetNameWithNoTooltip] or [GetCountry('MOR').GetName] gains a permanent garrison empowerment while the Office stands."
 cas_appoint_adelantado_mayor_act: "$cas_appoint_adelantado_mayor$"
 cas_appoint_adelantado_mayor_concept: "[character_interaction|e]"
 cas_appoint_adelantado_mayor_past: "[SCOPE.sCharacter('recipient').GetName] is the new Adelantado Mayor!"
 cas_appoint_adelantado_mayor_act_past: "[SCOPE.sCountry('actor').GetName] appointed [SCOPE.sCharacter('recipient').GetName] as the new Adelantado Mayor de la Frontera."
 cas_appoint_adelantado_mayor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will become the new Adelantado Mayor de la Frontera."
 cas_appoint_adelantado_mayor_price: "Appoint Adelantado Mayor Price"
 every_province_murcia_granada_andalusia_adelantado_mayor_tt: "Every [province|e] we own in [ShowAreaName('murcia_area')], [ShowAreaName('granada_area')] and [ShowAreaName('andalusia_area')] will benefit from the [ShowModifier('guarded_by_adelantado_mayor')] [modifier|e], ultimately scaling with the [abilities|e] of [recipient.GetName] for #G 10#! Years"
 choose_adelantado_candidate: "Choose a candidate"
 scales_with_character_tt: "[GetCountry('CAS').MakeScope.GetVariable('cas_adelantado_mayor_character').GetCharacter.GetName] [abilities|e]"
 gra_reduce_castilian_influence: "Reduce $CAS_ADJ$ Influence"
 gra_reduce_castilian_influence_desc: "We mobilize our qadis, our scholars, and the families of the marches against the reach of [GetCountry('CAS').GetName] in our court and our markets. Sustained pressure rolls back the hold the [GetCountry('CAS').GetAdjectiveWithNoTooltip] have built over the affairs of our [GetCountry('GRA').GetFlavorRank]."
 gra_reduce_moroccan_influence: "Reduce $MOR_ADJ$ Influence"
 gra_reduce_moroccan_influence_desc: "We send envoys, gifts of gold, and quiet warnings across the Strait, dimming the call of [GetCountry('MOR').GetName] among the tribes and ports that look to its court. Without those volunteers and that patronage, the [GetCountry('MOR').GetAdjectiveWithNoTooltip] grip on our [GetCountry('GRA').GetFlavorRank] slackens."
 gra_construct_alhambra: "Commence Expansion of the $alhambra$"
 gra_construct_alhambra_desc: "We summon the Nasrid masons, calligraphers, and #italic muqarnaṣ#! carvers to break ground on a new wing of the royal citadel above the [GetCountry('GRA').GetGovernment.GetCourtTitle] of [GetCountry('GRA').GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]. Each extension binds the dynasty to its capital and adds a tier of palace splendor, courtyard, and garrison space to the Sabīka hill."
 gra_construct_alhambra_max_tt: "[ShowBuildingTypeName('alhambra')] has not yet reached its fourth tier"
 gra_construct_alhambra_increment_tt: "Adds #G +1#! to the maximum level of [ShowBuildingTypeName('alhambra')]"
 gra_alhambra_extension_desc: "[ShowBuildingTypeName('alhambra')] extensions decreed under the [ShowSituationName('battle_for_the_strait')]"
 unlock_upgrade_alhambra_decision_tt: "Unlocks the [ShowDecisionName('expand_the_alhambra')] [decision|e] "
 until_we_cease_our_projection_efforts_tt: "As long as we maintain this [modifier|e] active"
 adu_proclaim_crown_al_andalus: "Proclaim $crown_of_al_andalus$"
 adu_proclaim_crown_al_andalus_desc: "With our dominance over [ShowContinentName('europe')] complete, we proclaim $crown_of_al_andalus$ and gather the ṭā'ifa of [ShowRegionName('iberia_region')] under a single rule, restoring the glory of [ShowLocationName('cordoba')] in name as well as in fact."
 gra_enforce_sovereignty: "Enforcement of Sovereignty"
 gra_enforce_sovereignty_desc: "Our [GetCountry('GRA').GetFlavorRank] may carry itself as a sovereign power before [GetCountry('CAS').GetName] and [GetCountry('MOR').GetName], refusing the claims of suzerainty that would bind our crown to either court. Such defiance strengthens our standing at home yet hardens every negotiation abroad. We may raise that banner or lower it as our position allows."
 attract_andalusi_refugees: "Invite Mudéjar"
 attract_andalusi_refugees_desc: "The word #italic mudajjan#! means 'permitted to remain', and from it the Christian kingdoms have made 'Mudéjar' for the Muslim families they conquered but left in place under their rule. We dispatch envoys with safe-conduct and the promise of a home, drawing those who would rather live under our law than under a Christian king. Each act of welcome brings a wave of these settlers from a chosen Christian kingdom into one of our provinces."
 bfts_attract_andalusi_refugees_tt: "We will invite Mudéjar refugees from a [province|e] in [ShowRegionName('iberia_region')] to settle our lands"
 attract_refugees_choose_source: "Choose the Source Province"
 attract_refugees_choose_destination: "Choose the Destination Province"
 gra_invite_shadhili_order_effect_tt: "Enables the action [ShowGenericActionName('gra_patronize_shadhili_order')], a toggle that increases our progress toward [ShowSocietyDirectionName('jurisprudence')], our monthly [legitimacy|e], and our [cabinet_efficiency|e] at the expense of our [tax_efficiency|e]"
 gra_patronize_shadhili_order: "Patronization of the Shadhili Order"
 gra_patronize_shadhili_order_desc: "The Shadhili #italic ṭarīqa#! established in our court depends upon the favor of the crown. Royal endowment of their #italic zāwiya#! and their scholars cuts both ways, raising the saintly voice in our councils and diverting wealth that might otherwise reach our treasury. We may open or close that purse as the times demand."
 start_patronizing_shadhili_order_tt: "We will extend our patronage to the Shadhili Order, applying the following effects:\n [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
 stop_patronizing_shadhili_order_tt: "We will end our patronage of the Shadhili Order, removing the following effects: [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
 until_we_cease_our_patronship_tt: "$until_we_cease_our_projection_efforts_tt$"
 action_active: "[action|e] is active"
 unlock_patronize_shadhili_order_tt: "Unlocks the [ShowGenericActionName('gra_patronize_shadhili_order')] [action|e] in the [ShowSituationName('battle_for_the_strait')] [situation|e]"
 hire_granadan_jinetes: "Hire $GRA_ADJ$ Jinetes"
 hire_granadan_jinetes_desc: "[ShowCultureName('andalusi')] nobles, men of the frontier #italic campo#! whose javelins and short swords have shaped the cavalry of every neighboring realm, are restless under the strain of the [ShowSituationName('battle_for_the_strait')]. With purses of silver and the promise of pay, we draw a company to our capital, riders who know every gully and watchtower from [ShowLocationName('cordoba')] to [ShowLocationName('almeria')]."
 hire_granadan_jinetes_traditional_tt: "We will raise 2 [ShowUnitDefinitionName('a_granadan_jinetes')] in our [capital|e]"
 hire_granadan_jinetes_modern_tt: "We will raise 2 [ShowUnitDefinitionName('a_granadan_jinetes_2')] in our [capital|e]"
 cas_demand_muslim_converts: "Demand Muslim Converts"
 cas_demand_muslim_converts_desc: "Press [GetCountry('GRA').GetName] to surrender a [ShowReligionGroupAdjective('muslim')] subject of standing, who upon arrival at our court will be baptized and given a new [GetCountry('CAS').GetReligion.GetGroup.GetAdjective] name. Their gifts and limitations pass to us together, and we cannot know in advance which the chancery will find useful."
 cas_demand_muslim_converts_select_title: "Choose a Muslim Subject"
 cas_demand_muslim_converts_no_characters: "@trigger_no! No eligible Muslim subjects available at the Granadan court"
 cas_demand_muslim_converts_price_abilities: "Character abilities"
 cas_demand_muslim_converts_effect_tt: "The chosen [character|e] will be moved to our court, baptized, and entered into our service through an [event|e] whose outcome scales with their [abilities|e]"
 cas_dismantle_fortifications: "Dismantle Fortifications"
 cas_dismantle_fortifications_desc: "Order our [GetCountry('GRA').GetAdjective] [ShowSubjectTypeName('vassal')] to pull down the fortifications of a chosen location. The salvaged stone, lumber, and worked masonry flow north into our Iberian markets, and the [GetCountry('GRA').GetFlavorRank] is bared a little further to our garrisons."
 cas_dismantle_fortifications_select_title: "Choose a Granadan Location to Strip"
 cas_dismantle_fortifications_no_locations: "@trigger_no! No fortified Granadan locations available"
 cas_dismantle_fortifications_effect_tt: "Every fort-class [building|e] in the chosen [location|e] will be destroyed. The salvaged goods will flow into our [markets|e] at the expense of [liberty_desire|e] and a lasting opinion penalty for our subject"
 cas_dismantle_fortifications_salvage_tt: "Across our [markets|e], [goods_demand|e] for construction [goods|e] drops for #G 2#! years via the [ShowGoodsDemandName('cas_dismantled_forts_salvage')], lowering our [buildings|e] cost"
 cas_dismantled_forts_salvage: "Salvaged $GRA_ADJ$ Fortifications"
 opinion_dismantled_our_forts: "Dismantled Our Fortifications"
 cas_reduce_granadan_sovereignty: "Reduce $GRA_ADJ$ Sovereignty"
 cas_reduce_granadan_sovereignty_desc: "Lean on [GetCountry('GRA').GetName] with the full weight of our standing and strip a tier of their independent institutions, binding the officers of the [GetCountry('GRA').GetFlavorRank] more tightly into our chain of command. The bond between us grows brittle in the bargain, and the [GetCountry('GRA').GetGovernment.GetCourtTitle] at [GetCountry('GRA').GetNameWithNoTooltip] loses a measure of standing it will not soon recover.\n\nOnce our hold over the strait is beyond dispute, the same demands cut deeper and can be renewed far sooner. The [GetCountry('GRA').GetGovernment.GetCourtTitle] has no other patron left to turn to by then, and protests only half so loudly."
 BFTS_REDUCE_SOVEREIGNTY_REQUIRES_HOLD: "[GetCountry('GRA').GetName] must be our subject, or our sway over the strait must have reached #Y Ascendancy#!"
 opinion_pressured_our_sovereignty: "Pressured Our Sovereignty"
 battle_for_the_strait_sovereignty_consolidated: "Sovereignty over [GetCountry('GRA').GetName] has been consolidated."
 mor_force_tribute: "Force Tribute"
 mor_force_tribute_desc: "Press [GetCountry('GRA').GetName] into the rolls of our tributaries. The coin of the [GetCountry('GRA').GetFlavorRank] will flow south across the strait, and their banner will bend to ours in matters of war and tariff alike."
 cas_force_tribute: "Demand Parias"
 cas_force_tribute_desc: "Revive the old tribute of the parias and set [GetCountry('GRA').GetName] once more upon our rolls. The gold of the [GetCountry('GRA').GetFlavorRank] will travel north to our treasury, and their court will answer to ours in matters of war and tariff alike."
 mor_invite_granadan_scholars: "Invite $GRA_ADJ$ Scholars"
 mor_invite_granadan_scholars_desc: "Draw the [ShowEstateTypeName('clergy_estate')] and #italic fuqahā'#! of the [ShowCultureName('andalusi')] #italic madrasas#! across the strait to lecture in our own. The schools of [GetCountry('GRA').GetName] are unmatched in [GetCountry('GRA').GetReligiousSchool.GetName] [ShowSocietyDirectionName('jurisprudence')], and the doctrine they carry will steer the law and the literacy of our realm alike."
 mor_invite_granadan_advisor: "Invite $GRA_ADJ$ Advisor"
 mor_invite_granadan_advisor_desc: "We invite a learned [ShowCultureName('andalusi')] cleric across the strait to take a seat in our court. His writings carry both the rigor of the #italic madrasas#! of [GetCountry('GRA').GetName] and the saintly authority of the western Sufi mystics, and the gesture itself will warm relations between our two courts."
 mor_invite_granadan_advisor_traits_tt: "The [character|e] gains two random positive [traits|e] suited to serve in our [cabinet|e]"
 opinion_andalusi_scholarly_exchange: "$andalusi$ Scholarly Exchange"
 forced_influence: "Forced Influence"
 soft_diplomacy: "Soft Diplomacy"
 defected_colony_opinion: "Defected Colony"
 stole_colonial_subject: "Stole Colony"
 trust_d009_diplomatic_support: "Diplomatic Support"
 mor_garrison_granadan_strongholds: "Garrison $GRA_ADJ$ Strongholds"
 mor_garrison_granadan_strongholds_desc: "We billet a regiment of our soldiers in a chosen [GetCountry('GRA').GetName] province, swelling its garrison, slowing any invading host with attrition, and lifting the ceiling on what its officers can keep under control."
 mor_garrison_granadan_strongholds_select_title: "Choose a Granadan Province to Garrison"
 mor_garrison_granadan_strongholds_no_provinces: "@trigger_no! No eligible Granadan provinces"
 mor_garrison_granadan_strongholds_effect_tt: "The chosen [province|e] gains [ShowModifier('mor_garrisoned_stronghold_modifier')] for #Y 10 years#!"
 mor_attract_andalusi_craftsmen: "Attract $andalusi$ Craftsmen"
 mor_attract_andalusi_craftsmen_desc: "We send recruiters across the strait to entice the artisans of a chosen [GetCountry('GRA').GetAdjective] province to settle in one of ours. The silk-weavers, leather workers, and metallurgists of [GetCountry('GRA').GetNameWithNoTooltip] carry their workshops and their craft into our cities, and the destination province enjoys a quickened pace of development and a strengthening of the [ShowEstateTypeName('burghers_estate')] for three years."
 mor_attract_andalusi_craftsmen_choose_source: "Choose the Source Granadan Province"
 mor_attract_andalusi_craftsmen_no_source: "@trigger_no! No Granadan province has enough $andalusi$ residents"
 mor_attract_andalusi_craftsmen_choose_destination: "Choose the Destination Province"
 mor_attract_andalusi_craftsmen_no_destination: "@trigger_no! No destination province available"
 mor_attract_andalusi_craftsmen_effect_tt: "A wave of $andalusi$ [pops|e] migrates from the source [province|e] to our destination province, which gains [ShowModifier('mor_andalusi_craftsmen_modifier')] for #Y 3 years#!"
 influence_over_granada: "Influence over Granada"
 influence_over_granada_desc: "The pull of the [GetCountry('GRA').GetName] court between [GetCountry('CAS').GetName] and [GetCountry('MOR').GetName]. The axis ranges from $bfts_axis_min$ (deep Castilian alignment) to $bfts_axis_max$ (deep Moroccan alignment), and shifts each month under the weight of war, marriage, parias, religion, and court patronage."
 castilian_influence_over_granada: "Castilian Influence over Granada"
 moroccan_influence_over_granada: "Moroccan Influence over Granada"
 BATTLE_FOR_THE_STRAIT_CASTILIAN_INFLUENCE_OVER_99: "$castilian_influence_over_granada$ in the $battle_for_the_strait$ is greater than 99"
 NOT_BATTLE_FOR_THE_STRAIT_CASTILIAN_INFLUENCE_OVER_99: "$castilian_influence_over_granada$ in the $battle_for_the_strait$ is NOT greater than 99"
 BATTLE_FOR_THE_STRAIT_MOROCCAN_INFLUENCE_OVER_99: "$moroccan_influence_over_granada$ in the $battle_for_the_strait$ is greater than 99"
 NOT_BATTLE_FOR_THE_STRAIT_MOROCCAN_INFLUENCE_OVER_99: "$moroccan_influence_over_granada$ in the $battle_for_the_strait$ is NOT greater than 99"
 BATTLE_FOR_THE_STRAIT_CASTILIAN_INFLUENCE_BELOW_50: "$castilian_influence_over_granada$ in the $battle_for_the_strait$ is less than 50"
 NOT_BATTLE_FOR_THE_STRAIT_CASTILIAN_INFLUENCE_BELOW_50: "$castilian_influence_over_granada$ in the $battle_for_the_strait$ is NOT less than 50"
 BATTLE_FOR_THE_STRAIT_MOROCCAN_INFLUENCE_BELOW_50: "$moroccan_influence_over_granada$ in the $battle_for_the_strait$ is less than 50"
 NOT_BATTLE_FOR_THE_STRAIT_MOROCCAN_INFLUENCE_BELOW_50: "$moroccan_influence_over_granada$ in the $battle_for_the_strait$ is NOT less than 50"
 BATTLE_FOR_THE_STRAIT_IS_WINNER: "Is the country that won the $battle_for_the_strait$ [situation|e]"
 NOT_BATTLE_FOR_THE_STRAIT_IS_WINNER: "Is NOT the country that won the $battle_for_the_strait$ [situation|e]"
 bfts_axis_min: "#R -100#!"
 bfts_axis_max: "#G +100#!"
 INFLUENCE_OVER_GRANADA_DISPLAY: "$VAL$"
 BFTS_INFLUENCE_MONTHLY_CHANGE_TITLE: "Monthly change towards [MonthlySavedVariable.GetMonthlyChangeDirectionalName(SituationView.GetActiveSituation.GetBaseClass)] of [MonthlySavedVariable.GetMonthlyChangeValue(SituationView.GetActiveSituation.GetBaseClass)|+=2] due to:"
 BFTS_MONTHLY_CHANGE_TITLE: "Monthly change of [MonthlySavedVariable.GetMonthlyChangeValue(SituationView.GetActiveSituation.GetBaseClass)|+=2] due to:"
 BFTS_INFLUENCE_TOWARD_CAS_TITLE: "To pull [GetCountry('GRA').GetName] toward [GetCountry('CAS').GetName]:"
 BFTS_INFLUENCE_TOWARD_CAS_HINTS: "$BFTS_INFLUENCE_TOWARD_CAS_TITLE$\n$cas_pressure_andalusi_court$ ([GetCountry('CAS').GetName] [cabinet|e]): #R -0.25#! monthly\n$gra_reduce_moroccan_influence$ ([GetCountry('GRA').GetName] [situation|e] action): #R -10#! at once, every 3 years\n$BFTS_INFLUENCE_GRA_SUBJECT_OF_CAS$: #R -0.30#!\n$BFTS_INFLUENCE_GRA_ALLIED_WITH_CAS$: #R -0.15#!\n$BFTS_INFLUENCE_MOR_LOSING_WAR$: #R -0.15#!\n$BFTS_INFLUENCE_GRA_PARIAS_TO_CAS$: #R -0.05#!\n$BFTS_INFLUENCE_GRA_GUARANTEED_BY_CAS$: #R -0.05#!\n$BFTS_INFLUENCE_GRA_SHARED_RELIGION_WITH_CAS$: #R -0.05#!\n$BFTS_INFLUENCE_GRA_ECONOMIC_WEAKNESS_VS_CAS$: #R -0.05#!\n$BFTS_INFLUENCE_GRA_AT_WAR_WITH_MOR$: #R -0.05#!\n$BFTS_INFLUENCE_CAS_AREA_ANDALUSIA$: #R -0.05#!\n$BFTS_INFLUENCE_CAS_AREA_GRANADA$: #R -0.05#!\n$BFTS_INFLUENCE_CAS_AREA_MURCIA$: #R -0.05#!\n$BFTS_INFLUENCE_CAS_PROV_MALAGA$: #R -0.02#!\n$BFTS_INFLUENCE_CAS_PROV_CADIZ$: #R -0.02#!\n$BFTS_INFLUENCE_CAS_PROV_GRANADA$: #R -0.02#!\n$BFTS_INFLUENCE_CAS_PROV_ALMERIA$: #R -0.02#!\n$BFTS_INFLUENCE_CAS_PROV_HABAT$: #R -0.02#!\n$BFTS_INFLUENCE_CAS_PROV_ERRIF$: #R -0.02#!\n$BFTS_INFLUENCE_CAS_PROV_AZGHAR$: #R -0.02#!\n$BFTS_INFLUENCE_GRA_MILITARY_WEAKNESS_VS_CAS$: up to #R -0.20#!\n$BFTS_INFLUENCE_STRENGTH_CAS_VS_MOR$: scaled\n$BFTS_INFLUENCE_CAS_MARITIME_STRAIT$: scaled\n$BFTS_INFLUENCE_GRA_OPINION_OF_CAS$: scaled"
