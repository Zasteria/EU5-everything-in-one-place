 vassalize_granada: "Vassalize $GRA$"
 vassalize_granada_desc: "The [GetCountry('GRA').GetGovernment.GetCourtTitle] sits wholly in our orbit. We move past tribute and parias and bind the [GetCountry('GRA').GetFlavorRank] to our throne as a sworn [ShowSubjectTypeName('vassal')]. The [GetCountry('GRA').GetGovernment.GetRulerTitle] keeps the throne in name only. Laws, levies, and coinage now answer to us."
 mor_vassalize_granada: "$vassalize_granada$"
 mor_vassalize_granada_desc: "$vassalize_granada_desc$"
 claim_andalusi_inheritance: "Claim the $andalusi$ Inheritance"
 claim_andalusi_inheritance_desc: "The lands of [ShowFormableCountryName('ADU_f')] once obeyed the call of the caliphs and prayed in the great mosques of [ShowLocationName('cordoba')]. While [ShowReligionGroupAdjective('christian')] crowns hold those shores, we cannot rest.\n\nWe press our claim upon the chosen Iberian heir, and our armies stand ready to answer should they refuse to yield. If we strike now, the faithful of [ShowRegionName('iberia_region')] will look to us as the rightful claimants of the lost inheritance, and our standing within the [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] world will rise with the deed."
 claim_andalusi_inheritance_no_target_tt: "We will gain a [casus_belli|e] to reclaim [ShowFormableCountryName('ADU_f')] from the chosen Iberian [ShowReligionGroupAdjective('christian')] crown, lasting 5 years"
 has_won_bfts_situation_tt: "We must have won the [ShowSituationName('battle_for_the_strait')] [situation|e]"
 as_long_as_the_situation_is_active_desc: "as long as the $battle_for_the_strait$ [situation|e] remains active"
 demand_conversion_of_granada.title: "Confront the Faith of $GRA$"
 demand_conversion_of_granada.desc: "[GetCountry('GRA').GetName] kneels before our throne, yet its mosques still call the faithful to prayer. The Crown stands at a fork. We may finish what the reconquista began and bind the [GetCountry('GRA').GetFlavorRank] to our faith by force, or we may spare the [ShowCultureName('andalusi')] their rites and instead make the most of what their craft, learning, and horsemen offer."
 demand_conversion_of_granada.a: "Convert them. Faith and crown must answer to one master."
 demand_conversion_of_granada.b: "Spare their faith."
 cas_found_the_santa_hermandad_decision.title: "Found the [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]"
 cas_found_the_santa_hermandad_decision.desc: "The brotherhoods of our towns have long kept the roads, each answering to its own council and its own mayors. A single [ShowGovernmentReformName('cas_santa_hermandad_reform')], raised by the towns but commanded by the Crown, would carry the king's peace into every village and end the banditry that the nobles have never been willing to stop."
 cas_found_the_santa_hermandad_decision.a: "Establish the [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]."
 gra_pops_becomes_root_religion_tt: "Many [pops|e] that do not follow the [ROOT.GetCountry.GetReligion.GetGroup.GetName] [religion_group|e] will embrace [ROOT.GetCountry.GetReligion.GetName]"
 unlock_jinetes_variable_tt: "Unlocks access to the [ShowAdvanceName('gra_jinetes')] and [ShowAdvanceName('gra_mailed_jinetes')] [advances|e]"
 mor_cultivate_andalusi_influence: "Cultivate $andalusi$ Influence"
 mor_cultivate_andalusi_influence_desc: "Our envoys and our scholars cross the Strait week after week, pressing our case at the [GetCountry('GRA').GetGovernment.GetCourtTitle] of the [GetCountry('GRA').GetGovernment.GetRulerTitle]. The slow weight of patronage, marriage offers, and frontier garrisons binds the elites of the [GetCountry('GRA').GetFlavorRank] tighter to our side with every passing month."
 mor_cultivate_andalusi_influence_action: "Cultivate $andalusi$ Influence"
 mor_cultivate_andalusi_influence_active: "Cultivating $andalusi$ Influence"
 mor_cultivate_andalusi_influence_action_progress: "[Abs_CFixedPoint(GetSituationByKey('battle_for_the_strait').MakeScope.GetVariable('influence_over_granada').GetValue)|2]"
 mor_cultivate_andalusi_influence_action_progress_wordier: "#explanation_link $MODIFIER_TYPE_NAME_monthly_influence_over_granada$#!: $mor_cultivate_andalusi_influence_action_progress$"
 mor_cultivate_andalusi_influence_action_progress_long_wordier: "@diplomacy! $mor_cultivate_andalusi_influence_action_progress$"
 mor_cultivate_andalusi_influence_action_progress_tooltip: "$MODIFIER_TYPE_DESC_monthly_influence_over_granada$"
 cas_pressure_andalusi_court: "Pressure the $andalusi$ Court"
 cas_pressure_andalusi_court_desc: "We bring our weight to bear on the [GetCountry('GRA').GetAdjective] [GetCountry('GRA').GetGovernment.GetCourtTitle] through every channel available, from the parias agreement to the threat of cabalgada raids on the frontier. Each month our hold on the [GetCountry('GRA').GetFlavorRank] grows tighter and the [GetCountry('MOR').GetAdjective] influence dims a little further."
 cas_pressure_andalusi_court_action: "Pressure the $andalusi$ Court"
 cas_pressure_andalusi_court_active: "Pressuring the $andalusi$ Court"
 cas_pressure_andalusi_court_action_progress: "[Abs_CFixedPoint(GetSituationByKey('battle_for_the_strait').MakeScope.GetVariable('influence_over_granada').GetValue)|2]"
 cas_pressure_andalusi_court_action_progress_wordier: "#explanation_link $MODIFIER_TYPE_NAME_monthly_influence_over_granada$#!: $cas_pressure_andalusi_court_action_progress$"
 cas_pressure_andalusi_court_action_progress_long_wordier: "@diplomacy! $cas_pressure_andalusi_court_action_progress$"
 cas_pressure_andalusi_court_action_progress_tooltip: "$MODIFIER_TYPE_DESC_monthly_influence_over_granada$"
 gra_promote_sovereignty: "Promote Our Sovereignty"
 gra_promote_sovereignty_desc: "Our chancery and our [GetCountry('GRA').GetGovernment.GetEstateName('clergy_estate')] labor to remind every prince, every merchant, and every village that the [GetCountry('GRA').GetFlavorRank] stands as its own master. Patronage, public works, and the careful staging of [GetCountry('GRA').GetGovernment.GetCourtTitle] ceremony all reinforce the dignity of our independent rule."
 gra_promote_sovereignty_action: "Promote Our Sovereignty"
 gra_promote_sovereignty_active: "Promoting Our Sovereignty"
