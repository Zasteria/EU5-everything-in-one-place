 BFTS_THRESHOLD_CAS_25_TITLE: "Castilian Foothold over $GRA$"
 BFTS_THRESHOLD_CAS_25_DESC: "[GetCountry('CAS').GetName] may [ShowCharacterInteractionName('cas_appoint_adelantado_mayor')], empowering the garrisons of their provinces bordering [GetCountry('GRA').GetName]. The office lapses should their grip on the court slacken."
 BFTS_THRESHOLD_MOR_25_TITLE: "Moroccan Foothold over $GRA$"
 BFTS_THRESHOLD_MOR_25_DESC: "[GetCountry('MOR').GetName] may [ShowGenericActionName('mor_force_tribute')] from [GetCountry('GRA').GetName], so long as it is not already a subject and both are at peace."
 BFTS_THRESHOLD_CAS_50_TITLE: "Castilian Sway over $GRA$"
 BFTS_THRESHOLD_CAS_50_DESC: "[GetCountry('CAS').GetName] may [ShowCountryInteractionName('cas_demand_war_entry')], calling [GetCountry('GRA').GetName] into their wars against [GetCountry('MOR').GetName]. While their hold remains this strong, [GetCountry('GRA').GetNameWithNoTooltip] can no longer end the [situation|e] as an independent power."
 BFTS_THRESHOLD_MOR_50_TITLE: "Moroccan Sway over $GRA$"
 BFTS_THRESHOLD_MOR_50_DESC: "[GetCountry('MOR').GetName] may [ShowCountryInteractionName('cas_demand_war_entry')], calling [GetCountry('GRA').GetName] into their wars against [GetCountry('CAS').GetName]. While their hold remains this strong, [GetCountry('GRA').GetNameWithNoTooltip] can no longer end the [situation|e] as an independent power."
 BFTS_THRESHOLD_CAS_75_TITLE: "Castilian Ascendancy over $GRA$"
 BFTS_THRESHOLD_CAS_75_DESC: "[GetCountry('CAS').GetName] may [ShowGenericActionName('cas_reduce_granadan_sovereignty')] even while [GetCountry('GRA').GetName] remains independent. At this height the demand bites deeper into $game_concept_granadan_sovereignty$ and may be pressed again after five years rather than ten, and the resentment it leaves behind is halved."
 BFTS_THRESHOLD_MOR_75_TITLE: "Moroccan Ascendancy over $GRA$"
 BFTS_THRESHOLD_MOR_75_DESC: "[GetCountry('MOR').GetName] may [ShowGenericActionName('cas_reduce_granadan_sovereignty')] even while [GetCountry('GRA').GetName] remains independent. At this height the demand bites deeper into $game_concept_granadan_sovereignty$ and may be pressed again after five years rather than ten, and the resentment it leaves behind is halved."
 BFTS_THRESHOLD_CAS_100_TITLE: "Castilian Supremacy over $GRA$"
 BFTS_THRESHOLD_CAS_100_DESC: "[GetCountry('CAS').GetName] dominates the strait outright. They may [ShowGenericActionName('vassalize_granada')] or [ShowDecisionName('demand_conversion_of_granada')], and once Iberia answers to Christian or Castilian rule, win the [situation|e] in their favor."
 BFTS_THRESHOLD_MOR_100_TITLE: "Moroccan Supremacy over $GRA$"
 BFTS_THRESHOLD_MOR_100_DESC: "[GetCountry('MOR').GetName] dominates the strait outright. They may [ShowGenericActionName('mor_vassalize_granada')], and while holding at least a fifth of Iberia, win the [situation|e] in their favor."
