l_english:
 anr_manual_digest_policy: "Manual Digest"
 anr_manual_digest_policy_desc: "A systematic manual compiled by the co-principality's jurists codifies Andorran customary law, providing clear precedent for the valleys' courts and reinforcing the realm's enduring legal traditions."
 anr_pareatges: "Pareatges"
 anr_pareatges_desc: "The co-principality's founding charter divides sovereignty between two lords, defining the legal basis of Andorran governance and the obligations each suzerain holds to the land and its people."
 anr_pareatges_honored_policy: "Charter Upheld"
 anr_pareatges_honored_policy_desc: "The Pareatges are honored in full, with both suzerains recognized and their respective rights respected — a careful balance that preserves Andorran autonomy and keeps the realm's external relationships stable."
 anr_pareatges_reinforced_policy: "Charter Entrenched"
 anr_pareatges_reinforced_policy_desc: "The co-principality's constitutional framework is further entrenched, with legal structures deepened and local governance given firmer roots — the suzerains' reach is limited, but the realm's internal order grows stronger for it."
 bayaa_shura_council_policy: "Shūrā Council"
 bayaa_shura_council_policy_desc: "The #italic bay'a#! is administered through a formal consultative council of jurists and nobles whose deliberative process lends the succession the weight of Islamic scholarly consensus. Their collective endorsement anchors the ruler's legitimacy in the religious and aristocratic traditions of the realm."
 bayaa_succession_law: "Bay'a Succession"
 bayaa_succession_law_desc: "The #italic bay'a#! is the oath of allegiance by which the leading men of the realm — the nobles, scholars, and tribal chiefs who constitute the #italic ahl al-ḥall wa'l-'aqd#! — affirm a new ruler's right to govern. This law frames the manner in which that affirmation is organized and whose voice carries the greatest weight in the succession council."
 bayaa_tribal_assembly_policy: "Tribal Assembly"
 bayaa_tribal_assembly_policy_desc: "The #italic bay'a#! is confirmed by a great assembly of tribal chiefs whose collective oath binds the leading clans to the new ruler's authority and ensures their cooperation across the distant reaches of the realm. This tribal affirmation distributes political legitimacy widely, though it also reinforces the power of the confederation over the central state."
 bled_makhzen_siba_law: "Bled el-Maḵzan and Bled es-Siba"
 bled_makhzen_siba_law_desc: "The Moroccan sultanate has never governed the full extent of its territory through direct administration. The #italic bled el-maḵzan#! — the land of government — is the settled zone where royal officials collect taxes and enforce order, while the #italic bled es-siba#! — the land of dissidence — is the tribal hinterland that accepts the sultan's spiritual authority but resists his fiscal reach. This law determines where the balance falls."
 cas_alcabala_policy: "Alcabala"
 cas_alcabala_policy_desc: "The royal sales tax on all commercial transactions fills the treasury at the cost of merchant resentment — a broad levy that touches every deal struck in the market and every cargo sold at the dock."
 unlocks_cas_alcabala_tax: "Unlocks the [ShowGovernmentReformName('cas_alcabala_tax')] [government_reform|e]"
 cas_encabezamiento_policy: "Encabezamiento"
 cas_encabezamiento_policy_desc: "Towns and cities negotiate fixed annual sums in lieu of the full #italic alcabala#!, granting merchants greater predictability and allowing local assemblies to manage their own fiscal affairs within the agreed ceiling."
 cas_fiscal_law: "Castilian Fiscal System"
 cas_fiscal_law_desc: "The Crown's framework for extracting revenue from its subjects shapes the balance between royal coffers and the prosperity of merchants and estate holders."
 cat_constitucions_de_catalunya_policy: "Constitucions de Catalunya"
 cat_constitucions_de_catalunya_policy_desc: "The constitutional framework of Catalonia binds the crown to respect the laws and liberties of its subjects — no new law may be enacted without the consent of the #italic Corts#!, and the parliament's voice carries the weight of centuries of precedent."
 centralized_makhzen_policy: "Centralized Maḵzan"
 centralized_makhzen_policy_desc: "The sultan extends direct royal administration, deploying quwwād and tax collectors deep into the tribal hinterland and subordinating local custom to the authority of the throne. The treasury grows richer, but the tribal confederations chafe under impositions they regard as a violation of traditional autonomy."
 dhimmi_persecution_policy: "Restrict the Dhimmi"
 dhimmi_persecution_policy_desc: "Pressure is placed on non-Muslim communities to convert or depart, clearing the realm of heterodox subjects and strengthening the faith's hold over the land."
 dhimmi_regulations_law: "Dhimmi Status"
 dhimmi_regulations_law_desc: "The legal standing of non-Muslim subjects under Islamic governance shapes how communities coexist and how the realm's diverse peoples contribute to its prosperity."
 dhimmi_status_policy: "Protected Dhimmi Communities"
 dhimmi_status_policy_desc: "Non-Muslim subjects are granted formal protection under Islamic law, paying the #italic jizya#! in exchange for freedom of worship. Their commerce enriches the realm's markets while slowing the pace of religious conversion."
 fuero_juzgo_policy: "Fuero Juzgo"
 fuero_juzgo_policy_desc: "The ancient Visigothic law code, preserved and adapted through centuries of Reconquista, remains the bedrock of justice in our realm — binding nobles to its precedents and legitimizing our rule in the eyes of the church and the people."
 limpieza_de_sangre_law: "Limpieza de Sangre"
 limpieza_de_sangre_law_desc: "Statutes of blood purity determine who may hold office, enter religious orders, or claim noble status, drawing a legal line between Old Christians and those of Jewish, Moorish, or other heritage."
 limpieza_mainstream_enforcement_policy: "Mainstream Enforcement"
 limpieza_mainstream_enforcement_policy_desc: "#italic Limpieza#! requirements are enforced through established institutions, with genealogical investigations required for advancement — effective enough to maintain the framework without the full weight of strict interpretation."
 limpieza_relaxed_enforcement_policy: "Relaxed Enforcement"
 limpieza_relaxed_enforcement_policy_desc: "Growing pressure from reformers and the practical needs of commerce lead to a loosening of blood-purity enforcement, allowing talent and wealth to speak louder than genealogical scrutiny."
 limpieza_strict_enforcement_policy: "Strict Enforcement"
 limpieza_strict_enforcement_policy_desc: "Blood-purity investigations are conducted rigorously, barring conversos and moriscos from public office, the church, and the military orders. The statutes bind the realm's institutions tightly to these claims of ancestral faith."
 mll_dret_civil_policy: "Dret Civil de Mallorca"
 mll_dret_civil_policy_desc: "The Mallorcan civil law tradition, rooted in Roman practice and Catalan charter, governs property, contracts, and inheritance with a precision that fosters commerce and preserves the distinct identity of our subjects."
 nav_fueros_policy: "Navarrese Fueros"
 nav_fueros_policy_desc: "The ancient charters of Navarre guarantee the rights and customs of its people against royal encroachment, with each new monarch swearing to uphold the #italic fueros#! before the kingdom's laws apply to them."
 negotiated_authority_policy: "Negotiated Authority"
 negotiated_authority_policy_desc: "The sultan governs through bargain and recognition rather than direct coercionm, acknowledging the autonomy of tribal confederations in exchange for nominal submission and informal military cooperation. Revenue flows more slowly to the throne, but the realm holds together without the constant friction of forced compliance."
 gra_learning_haven: "Learning Haven for All"
 gra_learning_haven_desc: "Rather than restricting education to religious affiliations, cultural opinions, or anything of the sort, we shall encourage a truly academic state to facilitate new scientific breakthroughs."
 ara_italian_dual_court: "Dual Court in [ShowRegionNameWithNoTooltip('italy_region')]"
 ara_italian_dual_court_desc: "By establishing two courts within our realm, we can manage both sides without needing to rely on the local nobility."
 unlock_italian_court_tt: "Unlocks the [ShowBuildingTypeName('italian_court_building')] [building|e]"
