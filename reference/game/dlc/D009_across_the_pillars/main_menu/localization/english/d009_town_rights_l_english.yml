l_english:
 andalusi_refugee_town_rights: "Andalusi Refugee Charter"
 andalusi_refugee_town_rights_desc: "This settlement has been granted special charters to attract and settle the artisans, scholars, and merchants driven from al-'Andalus by external pressures and the upheavals of an earlier age. These refugees bring their trades and their culture, enriching our cities and improving the efficiency of local production. We welcome them and their skills in the hope that they will take firm root in our lands."
 andalusi_resettlement_town_rights: "Andalusi Resettlement"
 andalusi_resettlement_town_rights_desc: "This settlement has been opened to the artisans and husbandmen of al-'Andalus, resettled here under charters that guarantee their houses, their workshops, and the water rights of their orchards. They come not as refugees driven before an army but as settlers invited to remain, bringing the silk-looms, the irrigation channels, and the market crafts of the south with them. Word of such terms travels quickly, and where the first families have prospered others follow."
 andalusi_resettlement_golden_age_town_rights: "Golden Age Resettlement"
 andalusi_resettlement_golden_age_town_rights_desc: "Our mastery of the strait has made this settlement the destination of choice for the displaced talent of al-'Andalus. Silk-weavers and physicians, mathematicians and master masons arrive by the shipload, and the charters we extend to them are the most generous in the peninsula. What began as a trickle of settlers has become the making of an age, and the workshops here run at a pace no rival harbour can match."
 iberian_aljama_charter: "Aljama Charter"
 iberian_aljama_charter_desc: "The #italic aljama#! charter formalizes the legal status of the self-governing $muslim_ADJ$ community in this location, recognizing its right to administer its own affairs, collect internal taxes, and practice its faith. We permit the community to maintain its mosques, markets, and social institutions in exchange for their productive integration into our economy. This arrangement has deep roots across the cities of $iberia_region$ and reflects the practical reality of governing lands where $muslim_ADJ$ and $christian_ADJ$ populations have long shared space."
 mozarab_charter_town_rights: "Mozarab Charter"
 mozarab_charter_town_rights_desc: "We have confirmed the ancient compact with the #italic musta'ribun#! of this settlement, the Arabised Christians who have kept their liturgy and their Latin books through generations of our rule. Their clergy answer to their own bishop and their disputes to their own judges, and in return they render the #italic jizya#! without complaint and raise no hand against us. The settlement is the quieter for it, and talk of throwing off our authority finds little purchase in streets that have already been granted what they would rebel to win. A community so secure in its own rites, however, has small reason to abandon them."
 medina_charter_town_rights: "Medina Charter"
 medina_charter_town_rights_desc: "We have extended to this settlement the statutes of the #italic medina#!, the walled urban quarter governed by a #italic qāyid#! and regulated by a #italic muḥtasib#! whose authority spans markets, streets, and public morals. Under these charters, we draw greater revenue from the tightly organized urban fabric. The ancient street-plan slows the construction of new buildings, but the order it imposes makes this settlement a cornerstone of Maghrebi administration."
 mzab_pentapolis_town_rights: "Mzab Pentapolis"
 mzab_pentapolis_town_rights_desc: "This settlement has been granted the communal charters of the Mzab valley, where Ibadi cities govern themselves under the austere council of the #italic 'azzāba#! — the juridical-religious scholars who hold law and commerce alike in their hands. The communal pact opens the market to regulated trade and binds the community in place, making the settlement a stable and self-sustaining enclave. Burghers here are steadier and more contented in their regulated prosperity."
 tribal_souk_town_rights: "Tribal Souk Charter"
 tribal_souk_town_rights_desc: "This settlement has been designated as a periodic tribal market-town — a #italic sūq#! where the tribes of the interior meet to trade, settle disputes, and renew their pacts with one another. The tribes benefit greatly from this recognition and hold the market ground with considerable autonomy, reducing our direct control over the settlement. The volume of goods passing through here draws caravans from the surrounding countryside."
 taifa_al_rais_town_rights: "Taifa of the Reïs"
 taifa_al_rais_town_rights_desc: "This port answers to the #italic ṭāʾifat al-ruyūs#!, the standing corporation of corsair captains whose fitted-out cruisers work the length of the Barbary coast from Salé to Tripoli. The captains hold their own council over the harbor, and their reputation draws seasoned mariners to the quays. Sailors are never in short supply where the reïs make berth."
 sale_arsenal_town_rights: "Salé Arsenal"
 sale_arsenal_town_rights_desc: "The royal #italic dār al-ṣināʿa#! of Salé stands at the mouth of the Bou Regreg, where Marinid shipwrights lay keels and fit out the vessels that carry our flag onto the Atlantic. The yards keep a standing body of caulkers and seasoned pilots close at hand, so a crew is found quickly whenever a hull is ready for the water. No other harbor on this coast arms a fleet with such ease."
 guich_charter_town_rights: "Guich Charter"
 guich_charter_town_rights_desc: "We have settled one of the #italic jayš#! tribes upon these lands, granting them fields and pasture free of the sultan's taxes in return for the swords they owe the throne. Their horsemen muster at the first summons to war, and their households raise sons to the saddle rather than the plow. What the treasury forgoes in revenue, the army gains in ready men."
