l_english:
 gold_fleet_nueva_espana_events.1.title: "Outward Bound for New Spain"
 gold_fleet_nueva_espana_events.1.desc_prefix: "The fleet is fitted out and ready at [departure_port.GetName]. Water and provisions are aboard, along with the iron tools and mercury the colonies cannot supply for themselves, and [target_leader.GetName] holds the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s orders in hand.\n\nThe voyage is a long one, past the Canaries and through the Caribbean to the shores of New Spain"
 gold_fleet_nueva_espana_events.1.desc_suffix: "await our holds. If we are to bring the season's wealth safely home, the fleet must sail now."
 gold_fleet_nueva_espana_events.1.desc: "$gold_fleet_nueva_espana_events.1.desc_prefix$, where [ShowGoodsName('silver')] and [ShowGoodsName('dyes')] $gold_fleet_nueva_espana_events.1.desc_suffix$"
 gold_fleet_nueva_espana_events.1.desc.rich: "$gold_fleet_nueva_espana_events.1.desc_prefix$. The [ShowGoodsName('silver')] of [silver_source.GetName] and the [ShowGoodsName('dyes')] of [dye_source.GetName] $gold_fleet_nueva_espana_events.1.desc_suffix$"
 gold_fleet_nueva_espana_events.1.a: "Cast off. The fleet sails on the morning tide."
 gold_fleet_nueva_espana_events.1.historical_info: "The #italic Flota de Nueva España#! was one of two convoys making up the Spanish #italic Carrera de Indias#!. It served the Viceroyalty of New Spain, collecting silver from the mines of Zacatecas, Guanajuato, and other Mexican deposits via the port of San Juan de Ulúa near Veracruz, along with high-value goods including cochineal dye from Oaxaca, indigo, vanilla, and cacao. The #italic flota#! typically departed Spain in spring and returned in autumn, joining the Tierra Firme galleons at Havana for the combined Atlantic crossing. The route through the Mona Passage between Hispaniola and Puerto Rico was the standard eastern Caribbean entry point."

 gold_fleet_nueva_espana_events.2.title: "The Wealth of New Spain"
 gold_fleet_nueva_espana_events.2.desc_prefix: "We have made [loot_port.GetName], and the counting houses have been at work for weeks. [ShowGoodsName('silver')] has come down by mule train from"
 gold_fleet_nueva_espana_events.2.desc_middle: ", and beside it lie bales of [ShowGoodsName('dyes')]"
 gold_fleet_nueva_espana_events.2.desc_suffix: "that trades against its own weight in [ShowGoodsNameWithNoTooltip('silver')] at [departure_port.GetName].\n\nThe last of the season's [ShowGoodsNameWithNoTooltip('silver')] is still on the road from the interior. We may wait for the full convoy and fill every hold, or take what is already gathered and press on before the storm season closes the coast."
 gold_fleet_nueva_espana_events.2.desc: "$gold_fleet_nueva_espana_events.2.desc_prefix$ the mines of the interior$gold_fleet_nueva_espana_events.2.desc_middle$ $gold_fleet_nueva_espana_events.2.desc_suffix$"
 gold_fleet_nueva_espana_events.2.desc.rich: "$gold_fleet_nueva_espana_events.2.desc_prefix$ [silver_source.GetName]$gold_fleet_nueva_espana_events.2.desc_middle$ of [dye_source.GetName] $gold_fleet_nueva_espana_events.2.desc_suffix$"
 gold_fleet_nueva_espana_events.2.a: "Wait for the convoy and fill holds with [ShowGoodsNameFlat('silver')] and [ShowGoodsNameFlat('dyes')]."
 gold_fleet_nueva_espana_events.2.b: "Take only what is already gathered."
 gold_fleet_nueva_espana_events.2.c: "The season grows too dangerous. Sail home with what we have."
 gold_fleet_nueva_espana_events.2.historical_info: "Veracruz, its anchorage guarded by the island fortress of San Juan de Ulúa, was the sole legal port of entry and departure for New Spain's Atlantic trade. The city sat on a malarial sandbar exposed to #italic nortes#!, violent northerly storms, making the loading season perilous. Mexican silver was primarily extracted from the great mining complexes at Zacatecas (discovered 1546) and Guanajuato, transported by mule train to the coast, and loaded under armed guard. Cochineal, a vivid scarlet dye produced from insects cultivated on Oaxacan nopal cactus, was among the most valuable commodities in the New World after silver; it was jealously monopolized by Spain and transformed the textile industries of Europe."

 gold_fleet_nueva_espana_events.3.title: "The Rendezvous at [rendezvous_port.GetNameWithNoTooltip]"
 gold_fleet_nueva_espana_events.3.desc.together: "The fleet has reached [rendezvous_port.GetName], where the galleons of Tierra Firme already lie at anchor beneath the guns of the fortress, their holds as heavy with [ShowGoodsName('silver')] as our own. From here the two fleets will make the Atlantic crossing together, north on the Gulf Stream and then east past the Florida shore.\n\nWord has come in of enemy sails waiting along that route, but a convoy of this size is a hard prize to take. [target_leader.GetName] must decide how the combined fleet will answer the threat before it sails for Spain."
 gold_fleet_nueva_espana_events.3.desc.alone: "The fleet has reached [rendezvous_port.GetName] and lies at anchor beneath the guns of the fortress. No galleons of Tierra Firme are here to join us; we will make the Atlantic crossing on our own, north on the Gulf Stream and then east past the Florida shore.\n\nWord has come in of enemy sails waiting along that route, and a lone fleet makes the tempting target. [target_leader.GetName] must decide how we answer the threat before we sail for Spain."
 gold_fleet_nueva_espana_events.3.a: "Hire additional warships from the [rendezvous_port.GetNameWithNoTooltip] garrison."
 gold_fleet_nueva_espana_events.3.b: "Speed will serve us better than guns. We sail at dawn."
 gold_fleet_nueva_espana_events.3.c: "The danger is too great. Winter here and sail next season."
 gold_fleet_nueva_espana_events.3.historical_info: "Havana became the mandatory assembly point for the returning silver fleet after Philip II formalized the convoy system in 1566. The city's deep natural harbor and position overlooking the Florida Channel made it the logical rendezvous point for both the Tierra Firme galleons and the Flota de Nueva España before their combined Atlantic crossing. The construction of the Castillo de los Tres Reyes del Morro from 1589 was a direct response to the threat from foreign privateers. The 1628 raid by the Dutch admiral Piet Hein, who captured the entire returning fleet off Matanzas Bay, remains the most spectacular success ever achieved by an enemy of the Spanish convoy system."

 gold_fleet_nueva_espana_events.8.title: "Awaiting the Tierra Firme Fleet"
 gold_fleet_nueva_espana_events.8.desc: "The fleet has reached [rendezvous_port.GetName], but the galleons of Tierra Firme have not yet come up from the south. The [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s orders are plain: the treasure fleets are to cross the Atlantic as one, their guns massed against the privateers who prowl the Florida Channel.\n\nSo we will lie at anchor beneath the fortress and wait for them, and trust they are not long in coming."
 gold_fleet_nueva_espana_events.8.a: "We wait for the other fleet."
 gold_fleet_nueva_espana_events.8.historical_info: "The two treasure convoys of the #italic Carrera de Indias#! — the #italic Flota de Nueva España#! and the #italic Galeones de Tierra Firme#! — were intended to unite at Havana and cross the Atlantic together, so that their combined escort could see off privateers and the occasional enemy squadron. In practice the fleets often ran late, and a convoy that missed its consort faced the choice of wintering at Havana or braving the crossing alone."

 gold_fleet_nueva_espana_events.9.title: "The Fleet Waits Still"
 gold_fleet_nueva_espana_events.9.desc: "Weeks have passed at anchor at [rendezvous_port.GetName], and still the galleons of Tierra Firme have not arrived. Provisions dwindle, the men grow restless, and each day at anchor is a day the season turns further against a safe crossing.\n\n[target_leader.GetName] must decide whether to hold on for the rendezvous or to chance the Atlantic without them."
 gold_fleet_nueva_espana_events.9.a: "Hold a while longer. The crossing is far safer together."
 gold_fleet_nueva_espana_events.9.b: "We have waited long enough. Sail for Spain without them."
 gold_fleet_nueva_espana_events.9.historical_info: "Timing governed the fate of the treasure fleets. A convoy that lingered too long at Havana risked being caught by the Caribbean hurricane season or by winter gales on the Atlantic, while one that sailed too early lost the protection of numbers. Commanders weighed the danger of the crossing against the cost of delay, and not every fleet chose to wait for its consort."

 gold_fleet_nueva_espana_events.10.title: "Dividing the Fleet"
 gold_fleet_nueva_espana_events.10.desc: "Word reaches [target_leader.GetName] that [secondary_port.GetName] lies open to us as well, its warehouses heavy with [ShowGoodsName('goods_gold')] and hides. A squadron could be detached to gather that wealth too, though it would mean splitting our strength in dangerous waters.\n\nWe may hold the fleet here at [loot_port.GetNameWithNoTooltip] until the detachment returns, or press on for [rendezvous_port.GetNameWithNoTooltip] and let them catch us there."
 gold_fleet_nueva_espana_events.10.a: "Keep the fleet together. We take what we have and sail on."
 gold_fleet_nueva_espana_events.10.b: "Detach a squadron to [secondary_port.GetNameWithNoTooltip] and wait for its return."
 gold_fleet_nueva_espana_events.10.c: "Detach a squadron to [secondary_port.GetNameWithNoTooltip]; sail on to [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_nueva_espana_events.10.historical_info: "The treasure fleets rarely drew their whole cargo from a single port. Squadrons were routinely detached to collect silver, hides, and dyestuffs from secondary harbors before the convoy reassembled for the Atlantic crossing. Dividing the fleet increased the haul, but exposed smaller squadrons to the privateers who haunted the inter-island passages."
 gold_fleet_nueva_espana_events.10.danger_tt: "Splitting the fleet leaves both squadrons weaker, increasing the danger of this voyage (#G +1#! Danger Level)"
 gold_fleet_nueva_espana_events.10.a.tt: "The fleet stays whole and presses on without the cargo of [secondary_port.GetName]."
 gold_fleet_nueva_espana_events.together_danger_suffix: "decreases the danger of this voyage."
 gold_fleet_nueva_espana_events.havana_together_danger_tt: "Sailing together with the Tierra Firme fleet $gold_fleet_nueva_espana_events.together_danger_suffix$"
 gold_fleet_nueva_espana_events.awaiting_fleet_tt: "The fleet will wait at anchor here for the Tierra Firme fleet to arrive, however long that takes"
 gold_fleet_nueva_espana_events.hold_longer_tt: "The fleet continues to wait at anchor for the other treasure fleet"

 gold_fleet_nueva_espana_events.11.title: "The Detachment Returns"
 gold_fleet_nueva_espana_events.11.desc: "The squadron sent to [secondary_port.GetName] has come back to [loot_port.GetName], its holds filled with [ShowGoodsName('goods_gold')] and hides. The fleet is whole again, and safer for it."
 gold_fleet_nueva_espana_events.11.a: "Take the cargo aboard. The fleet sails on together."
 gold_fleet_nueva_espana_events.11.historical_info: "The treasure fleets rarely drew their whole cargo from a single port. Squadrons detached to gather silver, hides, and dyestuffs from secondary harbors were expected to rejoin the main convoy before it pressed on, restoring the fleet's numbers and its safety in the crossing ahead."

 gold_fleet_nueva_espana_events.12.title: "The Detachment Rejoins Near Cuba"
 gold_fleet_nueva_espana_events.12.desc: "The squadron detached to [secondary_port.GetName] has caught up with the fleet as it nears [rendezvous_port.GetNameWithNoTooltip], its holds laden with the last of the season's [ShowGoodsName('goods_gold')] and hides."
 gold_fleet_nueva_espana_events.12.a: "Take the cargo aboard. The fleet sails on together."
 gold_fleet_nueva_espana_events.12.historical_info: "A detachment that did not wait at its harbor could still overtake the main convoy before it reached Havana, provided the weather and the winds favored a fast passage back to the fleet."

 gold_fleet_nueva_espana_events.15.title: "El Norte"
 gold_fleet_nueva_espana_events.15.desc: "The sky to the north has gone hard and gray, and the glass is falling fast. A #italic norte#! is bearing down on the Gulf — the violent northerly gale that comes without much warning and drives a short, vicious sea before it. In these shallow waters, with the shifting banks of the coast close under our lee, it is a killer of ships.\n\n[target_leader.GetName] must choose how the fleet meets the gale before it is upon us."
 gold_fleet_nueva_espana_events.15.a: "Stand out into deep water and ride the norther out."
 gold_fleet_nueva_espana_events.15.b: "Run for the shelter of the coast and wait the gale out."
 gold_fleet_nueva_espana_events.15.deep_safe_tt: "The fleet claws its way into open water and rides out the norther unscathed"
 gold_fleet_nueva_espana_events.15.deep_loss_tt: "The norther scatters the fleet and drives vessels onto the banks; part of the cargo goes down with them"
 gold_fleet_nueva_espana_events.15.historical_info: "The #italic nortes#! were cold northerly gales that swept down across the Gulf of Mexico between autumn and spring, distinct from the summer hurricanes and no less feared by the men who worked the Veracruz trade. The anchorage at San Juan de Ulúa lay open to them, and a norther could pin a fleet against the coast or drive it onto the shoals of the Campeche Bank. Loading at Veracruz was timed as much around the norther season as around the arrival of the silver, and a fleet caught on that lee shore in a strong blow could be lost within sight of land."

 gold_fleet_nueva_espana_events.16.title: "The Silver Train Is Late"
 gold_fleet_nueva_espana_events.16.desc: "Word comes down to the quay that the season's great mule train from [silver_source.GetName] has not arrived. Somewhere on the long road from the interior it has been set upon — the bars of [ShowGoodsName('silver')] lie scattered along the highland trail, the muleteers driven off, and the crown's wealth is stranded a hundred leagues from the sea.\n\nThe holds are only half full, and [target_leader.GetName] must decide whether the fleet can afford to recover the rest."
 gold_fleet_nueva_espana_events.16.a: "Send marines inland to escort the silver to the coast."
 gold_fleet_nueva_espana_events.16.b: "We cannot wait. Sail with what is already in the holds."
 gold_fleet_nueva_espana_events.16.historical_info: "The silver of the great Mexican mines — Zacatecas, Guanajuato, and the lesser camps of the north — was hauled down the #italic Camino Real de Tierra Adentro#!, the royal road that ran for hundreds of miles through arid, thinly held country to Mexico City, and from there carried east to Veracruz. The route was harried for generations by the Chichimeca peoples of the northern frontier, and later by bandits, so that the bullion moved in guarded convoys whose timing governed the whole loading season at the coast. A train delayed or plundered on the road could leave a fleet waiting at anchor or sailing half-laden."

 gold_fleet_nueva_espana_events.17.title: "The Worm in the Hull"
 gold_fleet_nueva_espana_events.17.desc: "The carpenters have brought [target_leader.GetName] grim news: the warm waters of the Indies have done their slow work, and shipworms have bored deep into the planking below the waterline. Left unchecked, the hulls will grow soft and the boats sluggish, and a fleet that cannot outrun an enemy is a fleet that will one day be caught.\n\nA sheltered cay lies within reach where the ships might be careened — hove down on their sides, the fouled bottoms scraped, burned, and tarred — but the work leaves them helpless on the sand for weeks."
 gold_fleet_nueva_espana_events.17.a: "Put in at the cay and careen the fleet properly."
 gold_fleet_nueva_espana_events.17.b: "No time. Sail on with foul bottoms and hope for fair winds."
 gold_fleet_nueva_espana_events.17.historical_info: "In tropical waters, the shipworm #italic Teredo navalis#! — in truth a mollusk, not a worm — riddled unprotected hulls within months. They were among the most persistent threats to any fleet operating in the Caribbean. The remedy was careening: running the ship aground or hauling it down at a sheltered beach to expose the hull, then scraping off the growth, charring the timber, and paying it with tallow and pitch. The work was slow and left a squadron defenseless, so commanders often gambled on postponing it, at the cost of ships that steered like barges and leaked in every seam."

 gold_fleet_nueva_espana_events.18.title: "Interlopers on the Coast"
 gold_fleet_nueva_espana_events.18.desc: "Scouts report foreign cutters at work in the forests of [logwood_source.GetName], felling and hauling away our timber under no flag we recognize. They have built rough camps along the shore and grown bold, trading their contraband to any ship that calls, and they sit squarely on ground the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] claims as its own.\n\n[target_leader.GetName] can spare a landing party, and must decide what to do with these unwelcome guests."
 gold_fleet_nueva_espana_events.18.a: "Land men, burn the camps, and take the timber for our holds."
 gold_fleet_nueva_espana_events.18.b: "Leave them be, and buy their charts and news of enemy sails."
 gold_fleet_nueva_espana_events.18.historical_info: "The lightly held coasts of the Gulf and the Bay of Campeche drew foreign interlopers throughout the colonial period, above all the logwood cutters — English, Dutch, and French — who felled the dyewood that Europe's textile industry craved. Operating far from any Spanish garrison, these #italic baymen#! shaded easily between honest cutting, smuggling, and outright piracy, and Spanish efforts to drive them off were sporadic and rarely lasting. A passing fleet might scatter a camp, but the cutters returned as soon as the sails were over the horizon."
