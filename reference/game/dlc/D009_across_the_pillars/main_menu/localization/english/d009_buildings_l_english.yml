l_english:
 tali_a_watchtower: "Ṭalī'a Watchtower"
 tali_a_watchtower_desc: "A masonry tower of the Andalusi coastal watch, doubling as a lookout post and a small garrisoned outwork. Such towers stand along the southern coast in chains, sighting raiders well before landfall and holding the shore while alarm beacons summon the inland levies."
thagr_fort: "Ṯaḡr Fort"
 thagr_fort_desc: "The #italic ṯaḡr#! is the frontier where our emirate touches the lands of the Christian kings. Built atop a hill or astride a road, the fort and its watchposts impose a toll on every column that would cross our border, slowing the Christian advance, denying their armies forage and water, and giving our own riders a place to muster and resupply as they range against the enemy."
 saqaliba_barracks: "Ṣaqāliba Barracks"
 saqaliba_barracks_desc: "The arsenal and muster-yard of the #italic Ṣaqāliba#!, where the slave-soldiers of the household draw their arms, store their powder and steel, and gather to drill. From its gates the corps marches to the frontier, and to them the recruiting parties return with fresh hands for the ranks."
 saqaliba_barracks_maintenance: "Ṣaqāliba Barracks Maintenance"
 EFFECTIVE_SAQALIBA_BARRACKS: "Ṣaqāliba Barracks"
 EFFECTIVE_ROYAL_COURT_BUILDINGS: "Effective [ShowBuildingTypeName('royal_court')] Buildings"
 qadi_office: "Qāḍī Office"
 qadi_office_desc: "The #italic qāḍī#! is the judge of the holy law, his court the seat of justice in any city of the faithful. Established in the capitals of our subject realms, the #italic qāḍī#! settles disputes, registers contracts, and weighs every grievance against the #italic sharī'ah#!. Where he sits, the order of our house is upheld, the unruly are brought to heel, and a subject's loyalty is bound ever closer to their overlord."
 qadi_office_maintenance: "Qāḍī Office Maintenance"
 can_only_be_built_via_qadi_gc_action_tt: "This [building|e] cannot be raised through ordinary construction. It is founded in the [capital|e] of a [subject|e] only through the [ShowGenericActionName('adu_build_qadi_office')] [action|e], available during the [GetSituationByKey('golden_century').GetName] [situation|e] when we reach #Y 75#! [gc_colonial_dominance|e]"
 madinat_al_zahra: "Madīna az-Zahrā'"
 madinat_al_zahra_desc: "Known as 'The Radiant City', $madinat_al_zahra$ will allow us to further expand our prestige within [ShowRegionName('iberia_region')]."
 palazzo_ajutamicristo: "Palazzo Ajutamicristo"
 palazzo_ajutamicristo_desc: "To adorn the secondary court in [ShowRegionName('italy_region')], $palazzo_ajutamicristo$ was commissioned by both the state and merchant families, serving as a display of prestige and wealth."
 italian_court_building: "[ShowCultureGroupNameWithNoTooltip('italian_group')] Court"
 italian_court_building_desc: "By maintaining courts in both our main realm and [ShowRegionName('italy_region')], we can manage both nobilities more effectively."
