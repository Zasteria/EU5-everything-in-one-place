l_english:

 d009_flavor_religious_orders.1.title: "A Change of Leadership"
 d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
 d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], who has been serving our [ROOT.GetCountry.GetGovernment.GetCourtTitle] loyally as head of [target_order.GetName], has suddenly fallen ill and resigned [old_head_of_order.GetHisHer] position.\n\nWhile many renowned knights and noblemen desire to ascend to such position, it is clear that [target_ruler.GetShortName] already has someone in mind for the task. [target_character.GetShortName], a favorite of [target_ruler.GetHimHerFormal], would make for a most obedient Grandmaster of the [target_order.GetNameWithNoTooltip], should we deny the brothers their own choice."
 d009_flavor_religious_orders.1.a: "[target_character.GetShortName] shall be the new Grandmaster."
 d009_flavor_religious_orders.1.a.entry: "Our favorite shall be the new Grandmaster."
 d009_flavor_religious_orders.1.b: "The brothers of the [target_order.GetNameWithNoTooltip] shall choose their own Grandmaster."
 d009_flavor_religious_orders.1.b.entry: "The brothers shall choose their own Grandmaster."

 d009_flavor_religious_orders.2.title: "The Growing Influence of [target_character.GetNameWithNoTooltip]"
 d009_flavor_religious_orders.2.entry: "The Growing Influence of the Grandmaster"
 d009_flavor_religious_orders.2.desc: "During the last years, the wealth and power of [target_character.GetName] has grown significantly. While such increase in personal possessions is not uncommon for a Grandmaster of the [target_order.GetName], [target_character.GetSheHe] seemingly has also developed a taste for the politics of the capital. While previously a favorite of [target_ruler.GetNameWithNoTooltip], it is now a common sight for [target_character.GetNameWithNoTooltip] to criticize our government and leadership, leading to many of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] calling for [target_character.GetHerHis] dismissal as Grandmaster."
 d009_flavor_religious_orders.2.a: "[target_character.GetSheHe|U] is doing what is best for [ROOT.GetCountry.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.2.a.entry: "He is doing what is best for our country."
 d009_flavor_religious_orders.2.b: "[target_character.GetSheHe|U] is overstepping [target_character.GetHisHer] bounds."
 d009_flavor_religious_orders.2.b.entry: "He is overstepping his bounds."

 d009_flavor_religious_orders.3.title: "The Disgraced Favorite"
 d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
 d009_flavor_religious_orders.3.desc: "The political posturing of [target_character.GetName] has continued to create animosity between [target_character.GetHerHim] and the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Especially [target_character.GetHerHis] very public criticism of [target_ruler.GetName] and [target_ruler.GetHerHis] affair has severed the once [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s favorite from [target_character.GetHerHis] supporters. Having made enemies among our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] due to [target_character.GetHerHis] rapid rise in standing, it is no longer feasible for [ROOT.GetCountry.GetName] to rely on such a character as Grandmaster of the [target_order.GetName]."
 d009_flavor_religious_orders.3.a: "[target_character.GetSheHe|U] shall be executed for treason!"
 d009_flavor_religious_orders.3.a.entry: "He shall be executed for treason!"
 d009_flavor_religious_orders.3.b: "Exile [target_character.GetHerHim] and appoint a new head for the [target_order.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.3.b.entry: "Exile him and appoint a new head for the Order."
