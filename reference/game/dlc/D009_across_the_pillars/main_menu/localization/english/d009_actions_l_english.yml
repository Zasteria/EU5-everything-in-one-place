l_english:
 proclaim_pase_foral: "Proclaim the Pase Foral"
 proclaim_pase_foral_desc: "We invoke the Basque right of #italic pase foral#! — the ancient prerogative by which Basque lordships may review and suspend royal decrees deemed contrary to their fueros. The proclamation satisfies noble expectations and bolsters stability, though it temporarily restrains the reach of the crown."

 summon_santa_hermandad: "Summon the Santa Hermandad"
 summon_santa_hermandad_desc: "We activate the Santa Hermandad — the crown-sponsored brotherhood of rural constables and militiamen that Castile deployed to suppress banditry and enforce royal order across the realm. Their mobilization boosts #Y manpower reserves#! and steels the #Y morale#! of our armies."

 proclaim_pase_foral_action: "$proclaim_pase_foral$"
 proclaim_pase_foral_active: "Proclaiming the Pase Foral"
 proclaim_pase_foral_action_progress: "$proclaim_pase_foral$ active"
 proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
 proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"

 summon_santa_hermandad_action: "$summon_santa_hermandad$"
 summon_santa_hermandad_active: "Summoning the Santa Hermandad"
 summon_santa_hermandad_action_progress: "Manpower / Army Morale"
 summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_long_wordier: "@manpower! $summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_tooltip: "Boosts monthly manpower recovery and army morale."
