l_english:

 seven_cities_caesars.1.title: "Pyrite and Quartz"
 seven_cities_caesars.1.desc: "Five months into Patagonia, the column has reached the valley the survivors of the lost galleon described to the magistrate at Buenos Aires. There is no city here. There are some abandoned huts, the work of shepherds or hunters, perhaps a generation old. The streambed glitters convincingly, but the assayer takes one look at the samples and identifies fool's gold and white quartz. The valley produces a fair quantity of guanaco and not much else. [target_leader.GetName] writes the dispatch in the lee of a basalt cliff in a wind that has been blowing for three days."
 seven_cities_caesars.1.a: "Lied to, or lying. Strike the standard, turn back."
 seven_cities_caesars.1.historical_info: "The legend of the City of the Caesars, a Spanish-speaking settlement founded by survivors of a sixteenth-century shipwreck on the Patagonian coast and supposedly hidden in the interior of the country, was credited by the Spanish crown well into the eighteenth century. At least seven expeditions were sent in search of it between 1530 and 1750. None found anything. The legend persisted partly because Patagonia was genuinely difficult to survey at the time, partly because the survivors of shipwrecks did periodically reappear with elaborate stories to explain their long absence, and partly because the institutional bias of colonial bureaucracies was always to act on a credible rumour rather than to ignore it."

 seven_cities_caesars.2.title: "Silver Trickle in a Cold Country"
 seven_cities_caesars.2.desc: "The country we have entered is harder than the survivors described and poorer than they promised, but it is not nothing. There are silver-bearing streams in two of the valleys we have crossed. The Mapuche traders the column made contact with last week were carrying small finished pieces of silver that they say come from the foothills further west. The country, if not the city, is real. The trade can be opened. There will be no second Potosi here, but there will be something. [target_leader.GetName] orders a fortified trading-post built where the column has reached."
 seven_cities_caesars.2.a: "Build the post. Modest Patagonian silver will pay for it."
 seven_cities_caesars.2.historical_info: "Patagonia produced silver in modest commercial quantities from a number of small workings opened in the late colonial period, primarily in what is now the Argentine province of Rio Negro and along the eastern flank of the Andes. The economic significance of these workings was always limited compared to the great Andean silver economy further north, but they were sufficient to anchor a network of Spanish and later Argentine trading posts that gradually superseded the Mapuche commercial network the post-discovery period operated through."

 seven_cities_caesars.3.title: "The Caesars Found"
 seven_cities_caesars.3.desc: "The country the survivors described is real, and the city they described is in it. Between two mountains, on the floor of a hidden valley, there is a settlement of perhaps two thousand souls: Spanish in dress, Spanish in language though with strange vowel-shifts of two generations, Spanish in religion though their priest is an old man with no successor. They have lived here for sixty years on the maize their women plant in the valley floor and the silver they pan from the streams. They were not expecting to be found. The chronicler stays awake all night writing. [target_leader.GetName] sends for reinforcements at dawn."
 seven_cities_caesars.3.a: "The crown's lost subjects are found. The valley is ours."
 seven_cities_caesars.3.historical_info: "Hidden Spanish-speaking populations descended from shipwreck survivors do occasionally turn up in the historical record, the most famous being the case of Gonzalo Guerrero among the Maya, but their numbers are always small and their settlements are not the lost cities of legend. The Patagonian version of the legend, the City of the Caesars itself, has never been substantiated. The valley in which it was supposedly hidden has been mapped many times over since the late nineteenth century and contains, by general consensus of the cartographers and prospectors involved, nothing."

