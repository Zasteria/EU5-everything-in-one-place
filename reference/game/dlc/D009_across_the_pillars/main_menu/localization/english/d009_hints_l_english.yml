l_english:
 hint_battle_for_the_strait: "[GetSituationByKey('battle_for_the_strait').GetNameWithNoTooltip] Hints"
 hint_battle_for_the_strait_hint_text: "$hint_battle_for_the_strait_hint_text_1$\n\n$hint_battle_for_the_strait_hint_text_2$\n\n$hint_battle_for_the_strait_hint_text_3$\n\n$hint_battle_for_the_strait_hint_text_4$\n\n$hint_battle_for_the_strait_hint_text_5$"
 hint_battle_for_the_strait_hint_text_1: "The [GetSituationByKey('battle_for_the_strait').GetName] is a [situation_with_icon|e] in which [GetCountry('CAS').GetName] and [GetCountry('MOR').GetName] fight for the narrow waters between [ShowRegionName('iberia_region')] and the [ShowRegionName('maghreb_region')], while [GetCountry('GRA').GetName] struggles to survive between them. Two trackers measure the contest. Influence over [GetCountry('GRA').GetNameWithNoTooltip] swings between the two great powers and slowly drifts back toward the center, while [granadan_sovereignty|e] shows how freely [GetCountry('GRA').GetNameWithNoTooltip] governs itself. If no one has prevailed by the [ShowAgeName('age_3_discovery')], the struggle ends in a stalemate."
 hint_battle_for_the_strait_hint_text_2: "#T How Each Power Wins:#!\n@arrow_bonus_tier_2! [GetCountry('CAS').GetNameWithNoTooltip] must drive [GetCountry('MOR').GetNameWithNoTooltip] out of [ShowRegionNameWithNoTooltip('iberia_region')] and hold the area of [ShowAreaName('granada_area')] directly or through [subjects_with_icon|e]. It must then make [GetCountry('GRA').GetNameWithNoTooltip] its [ShowSubjectTypeName('vassal')] with influence fully on its side, or conquer it entirely. Holding it as a [ShowSubjectTypeName('tributary')] is not enough.\n@arrow_bonus_tier_2! [GetCountry('MOR').GetNameWithNoTooltip] must hold the areas of [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')], and [ShowAreaName('murcia_area')] directly or through [subjects]. It must then bind [GetCountry('GRA').GetNameWithNoTooltip] as its [ShowSubjectTypeName('vassal')] or [ShowSubjectTypeName('taifa')] with influence fully on its side, or conquer it entirely.\n@arrow_bonus_tier_2! [GetCountry('GRA').GetNameWithNoTooltip] must stay free of any overlord and hold the same three areas. It must also keep influence within #Y 50#! of the center and its [granadan_sovereignty] above #Y 50#!.\n@arrow_bonus_tier_1! Should [GetCountry('CAS').GetNameWithNoTooltip] or [GetCountry('MOR').GetNameWithNoTooltip] fall, the struggle ends at once and the power holding these lands claims victory."
 hint_battle_for_the_strait_hint_text_3: "#T Recommended Actions as [GetCountry('CAS').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Instruct our [cabinet_with_icon|e] to [ShowCabinetActionName('cas_pressure_andalusi_court')], which pulls influence toward us every month.\n@arrow_bonus_tier_2! Once influence leans #Y 25#! our way, [ShowGenericActionName('cas_force_tribute')] can bind a weakened [GetCountry('GRA').GetNameWithNoTooltip] to us. At #Y 100#!, [ShowGenericActionName('vassalize_granada')] completes the work.\n@arrow_bonus_tier_1! [ShowGenericActionName('cas_reduce_granadan_sovereignty')] and [ShowGenericActionName('cas_dismantle_fortifications')] keep a subject [GetCountry('GRA').GetNameWithNoTooltip] from ever standing on its own again."
 hint_battle_for_the_strait_hint_text_4: "#T Recommended Actions as [GetCountry('MOR').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Instruct our [cabinet] to [ShowCabinetActionName('mor_cultivate_andalusi_influence')], and keep a strong [navy_with_icon|e] in the strait. Fleets in its waters pull influence toward their owner.\n@arrow_bonus_tier_2! [ShowGenericActionName('claim_andalusi_inheritance')] gives us a [casus_belli_with_icon|e] against a country in [ShowRegionNameWithNoTooltip('iberia_region')], our road to the three areas we need.\n@arrow_bonus_tier_1! Once influence leans #Y 25#! our way, [ShowGenericActionName('mor_force_tribute')] can bind a weakened [GetCountry('GRA').GetNameWithNoTooltip] to us, but only a [ShowSubjectTypeName('vassal')] or [ShowSubjectTypeName('taifa')] counts toward victory."
 hint_battle_for_the_strait_hint_text_5: "#T Recommended Actions as [GetCountry('GRA').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Use [ShowGenericActionName('gra_reduce_castilian_influence')] and [ShowGenericActionName('gra_reduce_moroccan_influence')] to keep influence near the center, and instruct our [cabinet] to [ShowCabinetActionName('gra_promote_sovereignty')].\n@arrow_bonus_tier_2! Our [granadan_sovereignty] grows while we stay independent and at peace, and our [prestige_with_icon|e] and [crown_power_with_icon|e] lift it further. [ShowGenericActionName('gra_enforce_sovereignty')] and each expansion of the [ShowBuildingTypeName('alhambra')] add to it as well.\n@arrow_bonus_tier_1! Every year spent as a [subject_with_icon|e] costs us more [granadan_sovereignty] than the last, and war drains it too. The higher it climbs above #Y 50#!, the faster it slips back, so it must be tended.\n@hint! A [disaster_with_icon|e] in [GetCountry('CAS').GetNameWithNoTooltip] or [GetCountry('MOR').GetNameWithNoTooltip] raises our [granadan_sovereignty] while it lasts."
 hint_battle_for_the_strait_diplomatic: "\"[GetCountry('GRA').GetName] leans toward its friends. Whoever offers it alliance or a guarantee draws it closer, and a shared faith draws it closer still.\""
 hint_battle_for_the_strait_administrative: "\"Influence over [GetCountry('GRA').GetName] drifts back toward the center with every passing month. Any lead must be tended, or it will fade.\""
 hint_battle_for_the_strait_military: "\"Whoever commands the strait commands the struggle. Fleets in its waters and garrisons in its ports weigh on [GetCountry('GRA').GetName] as heavily as any army.\""
 hint_golden_century: "[GetSituationByKey('golden_century').GetNameWithNoTooltip] Hints"
 hint_golden_century_hint_text: "$hint_golden_century_hint_text_1$\n\n$hint_golden_century_hint_text_2$"
 hint_golden_century_hint_text_1: "The [GetSituationByKey('golden_century').GetName] is a [situation_with_icon|e] that follows the [GetSituationByKey('battle_for_the_strait').GetName], granting its victor a century of dominance over Europe and the New World. That victor becomes the Colossus of the age, while rivals and neighbors watch its rise with growing unease."
 hint_golden_century_hint_text_2: "#T How the Age Is Won:#!\n@arrow_bonus_tier_2! Two trackers measure the reach of the Colossus. [gc_european_dominance|e] rises through victory in continental wars and dynastic and religious primacy at home, while [gc_colonial_dominance|e] rises through colonization, treasure fleets, and conversion overseas. Both climb in discrete strides, and each threshold from #Y 25#! to #Y 100#! grants the Colossus a lasting reward.\n@arrow_bonus_tier_1! Dominance breeds danger. A [flashpoint|e] meter rises with the burden of debt and inflation, fed further by overreaching authority and the envy that great standing draws. When it fills, a make-or-break event strikes the Colossus for good or ill, and a [GetInternationalOrganizationType('grand_alliance').GetName] gathers to bring it low. Defeat in war can strip #Y 25#! from either tracker, and should the Colossus lose a quarter of the realm it began with, its golden century ends before its time."
 hint_golden_century_diplomatic: "\"Whether we stand as the Colossus or among those who fear it, alliances shape this age. The dominant power leans on its friends to keep the coalition at bay, while those who would humble it join the [GetInternationalOrganizationType('grand_alliance').GetName] to share the cost of the reckoning.\""
 hint_golden_century_administrative: "\"A golden century is built at home as much as abroad. Tend to our [control_with_icon|e] and to the loyalty of our [subjects_with_icon|e], and do not let debt and unrest fester, for they swell the next [flashpoint|e].\""
 hint_golden_century_military: "\"Dominance is claimed by the sword and lost by it. The Colossus must defend the realm it holds to see the century through, while its foes must break a quarter of that realm to end the golden age before its time.\""
