l_english:

 seven_cities_sierra.1.title: "The White King's Mountain"
 seven_cities_sierra.1.desc: "After eight months in the Chaco, the column has reached the foothills the Guarani guides described as the country of the silver mountain. The country is harsh, broken by salt flats and dry rivers; the foothills, when reached, are bare red rock; the streams that come down from them carry no silver. The guides, when pressed, say they were sent by the Guarani council to lead the column as far from their own country as possible, in the hope that the column would not come back. [target_leader.GetName] hangs two of them and dismisses the rest. The march back will be hungry."
 seven_cities_sierra.1.a: "Turn the column. The silver mountain is a Guarani tale."
 seven_cities_sierra.1.historical_info: "The legend of the Sierra de la Plata, the silver mountain at the heart of the South American interior, was credited by the Spanish crown for most of the sixteenth century and was the principal motivation for the founding of Asuncion, which was intended as the staging post for the expedition that would conquer the silver country. The actual silver of the southern Andes turned out to lie further west, at Potosi, and was reached by a different route entirely; the river-and-grassland country between Asuncion and the Andes proved as poor as the early explorers had hoped it would be rich."

 seven_cities_sierra.2.title: "Silver in the Foothills"
 seven_cities_sierra.2.desc: "The country we have reached is silver country, though not in the cataclysmic sense the legend promised. There are working silver mines in two of the foothill valleys we have surveyed, operated by local communities under a chief who is willing to receive a Spanish embassy. The output is modest by Andean standards. But the country is real, the mines exist, and the trade can be opened on terms that do not require a full military occupation. [target_leader.GetName] negotiates a trade agreement and a token tribute payment."
 seven_cities_sierra.2.a: "Sign the agreement. Modest, steady silver is worth much."
 seven_cities_sierra.2.historical_info: "The eastern slopes of the central Andes do contain commercial silver deposits, though far less than the Potosi cordillera further west. Small Spanish mining operations were established in what is now northern Argentina and southern Bolivia in the late sixteenth century, generally under encomienda arrangements with the local Diaguita and Chicha populations. The Sierra de la Plata of legend, the entire mountain of silver, was never found because it was never there; the actual geological structure of the Andean silver economy was a distributed network of smaller deposits, of which Potosi was the only one of sufficient size to become a legend in its own right."

 seven_cities_sierra.3.title: "The Mountain of Silver"
 seven_cities_sierra.3.desc: "The country the legend described is real, and the column has found it. There is a mountain here, broken open in three places, the silver ore at the surface in seams a hand thick, the assayer reporting an ore grade above anything previously documented in the Indies. The Chicha lords who control the foothills are willing to receive an embassy; their interest is in iron tools and Spanish horses, not in being conquered. The treaty can be negotiated. The mountain is open. [target_leader.GetName] sends three riders to the coast with samples sealed in lead boxes. The crown will not need much convincing."
 seven_cities_sierra.3.a: "Sign the treaty. Build the road. The mountain is found."
 seven_cities_sierra.3.historical_info: "The Potosi silver mountain, the actual mountain that the Sierra de la Plata legend was conflated with in retrospect, was not discovered by a Spanish expedition acting on the legend; it was discovered in 1545 by an indigenous miner whose name varies in the sources, who reported its existence to the Spanish authorities in Cuzco. The mountain produced more silver than any other site in the world for nearly two centuries and became the bullion engine of the early modern global economy. The legend, in this sense, was true; the legend just had the geography slightly wrong."

 seven_cities_sierra.10.title: "Silver Out of the West"
 seven_cities_sierra.10.desc: "He was given up for dead years ago, lost with a voyage that ended on rocks far to the south, and this morning he stands at the gate asking for the expedition by name. In his fist is a knotted kerchief, and in the kerchief is silver: a clasp and two flattened beads of worked metal, traded hand to hand, [target_character.GetName] says, out of a country in the deep interior where a White King rules a mountain of it. The man cannot write his own name and has never yet been caught wrong about a coastline. The assayer bites the beads, weighs them, and hands them back without a word."
 seven_cities_sierra.10.a: "Follow his road. Sign him as our guide."
 seven_cities_sierra.10.b: "Buy every piece he carries, and his silence with it."
 plata_castaway_road_tt: "[target_character.GetName] joins the voyage and marks his road into the interior on our charts"
 plata_silver_in_hand_tt: "The castaway's silver joins the expedition's haul"
 seven_cities_sierra.10.historical_info: "Aleixo Garcia, a Portuguese sailor wrecked on the island of Santa Catarina with survivors of the Solis expedition in 1516, heard from his Guarani hosts of a White King in the western mountains who ruled a country of silver. Around 1524 he followed the story inland and became the first European to touch the wealth of the Andes, returning with silver looted from the Inca frontier years before Pizarro had seen Peru. Garcia was killed on the road home, but his silver kept traveling: pieces of it reached the coast, passed into the hands of Sebastian Cabot's crews, and persuaded Cabot to abandon his voyage to the Moluccas and turn up the river he would rename the Rio de la Plata, the river of silver, after metal it never carried."

 seven_cities_sierra.11.title: "A Host Without Banners"
 seven_cities_sierra.11.desc: "The council fires burn late, and in the morning the offer comes through the interpreters: the river peoples will march with us against the country of the White King. Not as guides and not as porters, but as an army, thousands strong, with their own reasons. Their grandfathers raided the mountain country before any of us had crossed the ocean, and they remember the roads and the fords of the thirstland between. The officers are of two minds. A host that size cannot starve on the road, says one. A host that size, says another, cannot arrive as anything but a war."
 seven_cities_sierra.11.a: "Accept the host. No column crosses the thirstland alone."
 seven_cities_sierra.11.b: "Decline with gifts. Small parties pass where armies storm."
 seven_cities_sierra.11.historical_info: "When Aleixo Garcia went west in about 1524 he did not travel as an explorer with bearers: he marched with a Guarani war-host reckoned in the thousands, joining an expedition the Guarani were mounting for their own purposes against the Inca frontier. The combined force crossed the Chaco, the thirstland the Spanish would learn to dread, and struck the outposts of the empire deeply enough that the Inca fortified the frontier afterward. European history files the raid under exploration. From the Guarani side of the ledger, a foreign sailor with a beard had been permitted to come along on a war they were having anyway."

 seven_cities_sierra.12.title: "The Frontier of the White King"
 seven_cities_sierra.12.desc: "The foothills are ahead at last, blue and enormous, and the villages at their feet wear the proof: worked silver at throat and wrist, finer than anything the coast has shown us. Above the villages the passes climb toward the country the silver comes from, and about that country the talk goes quiet. The mountain lords keep the passes counted, the villagers say. They count who goes up. They are not known to count who comes down."
 seven_cities_sierra.12.desc_castaway: "The castaway's road-marks have run out. This valley is as far as he ever came, he admits, standing where the trail bends up into the passes; the silver he carried was traded down to him here, on this ground, out of the mountains above. Past this point his geography is the same hearsay as everyone else's, and he is honest enough to say so out loud, which the men find harder to forgive than lying. What is left of his road is the direction it points: up."
 seven_cities_sierra.12.a: "Into the passes. The mountain is close enough to touch."
 seven_cities_sierra.12.b: "Trade at the mountain's foot. Patience buys silver too."
 plata_silver_seized: "#Y The raid on the frontier valleys comes back heavy with worked silver#!"
 plata_host_shields_the_raid: "#Y The host of our allies screens the raid, and it comes back heavy with worked silver#!"
 plata_frontier_rises: "#Y The passes empty before us, and then the mountains answer in force#!"
 seven_cities_sierra.12.historical_info: "The Inca frontier was not a line on a map but a garrisoned zone, and it answered. Aleixo Garcia's host was broken up on the road home around 1525 and Garcia killed with most of his men. Juan de Ayolas repeated the pattern in 1537: he crossed the Chaco, reached the silver country, loaded his column with loot, and was ambushed and annihilated with his entire party at Candelaria on the return, having missed his rendezvous with the ships. The silver was real and the mountain was real, but for thirty years every road to it ran through somebody who had been fortifying it since the first raid. Potosi, when the Spanish finally held it in 1545, was reached from the other side."

 seven_cities_sierra.13.title: "The Sweet Sea"
 seven_cities_sierra.13.desc: "A day short of the landfall, the water changes. The leadsman tastes it, spits, and tastes it again. The cask-master is summoned, then the pilots, and within the hour the word has gone through the whole ship: the sea has turned fresh. No river in the known world pushes its water this far out from the land. The pilots argue about what country could feed such a mouth, and the men lean along the rail looking west at nothing, drinking the ocean from cupped hands because it is free."
 seven_cities_sierra.13.desc_castaway: "The water under the keel turned fresh this morning, and while the pilots were still arguing about what it meant, the castaway came up on deck, tasted a cupped handful, and nodded the way a man nods at his own front gate. This is the river's water, he says. He came down it once with silver in his shirt. Somewhere behind the western haze the river narrows, and the road to the White King begins."
 seven_cities_sierra.13.a: "Name it in the dispatches: the River of Silver."
 seven_cities_sierra.13.b: "Sound the mouth and chart it before we christen anything."
 seven_cities_sierra.13.historical_info: "Juan Diaz de Solis entered the great estuary in 1516 and named it the Mar Dulce, the sweet sea, for the fresh water that met his ships far offshore. He was killed by the people of its northern bank while attempting the first landing. The survivors of his expedition, wrecked on the homeward voyage at Santa Catarina, included Aleixo Garcia, whose silver would later set every expedition in this part of the world marching inland. Sebastian Cabot renamed the water the Rio de la Plata, the river of silver, in the late 1520s on the strength of those stories. The silver of the Andes never came down that river in his lifetime, but the name stuck, and in time the whole country at the river's mouth took it: Argentina, the land of silver."

