l_english:
 spa_seize_control_of_the_orders.title: "Seize the Estates of the Orders"
 spa_seize_control_of_the_orders.desc: "The Religious Orders of [ShowRegionName('iberia_region')] have played a vital part in driving back the muslim threat and re-establishing our reign over the peninsula. However, now that our #italic Reconquista#! has been achieved, these orders, we must bring them under direct control of our government and guide them toward their future purpose of statesman and administrators, instead of warriors and knights."
 spa_seize_control_of_the_orders.a: "Bring the masterships under the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 spa_seize_control_of_the_orders.a.entry: "Bring the masterships under the $crown_estate$."
 establish_council_of_military_orders_tt: "Unlocks the [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')]"
 established_council_of_military_orders_tt: "Established the [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] with the $spa_seize_control_of_the_orders.title$ decision."

 spa_council_of_crusade_decision.title: "Establish the $spa_council_of_crusade_bureaucracy$"
 spa_council_of_crusade_decision.desc: "The defense of our faith, even on foreign shores, must be blessed by the highest authority. With approval of the [pope], we will become the first bastion of the [ShowReligionAdjective('catholic')] faith!"
 spa_council_of_crusade_decision.a: "Request papal approval."
 establish_council_of_crusade_tt: "Unlocks the [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')]"
 established_council_of_crusade_tt: "Established the [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')] with the $spa_council_of_crusade_decision.title$ decision."
