l_english:
 taifa: "Ṭā'ifa"
 taifa_desc: "When the Caliphate of Córdoba fell, al-'Andalus broke apart into a mosaic of petty emirates, called the #italic ṭawā'if#!, each a court unto itself. Brilliant in learning yet jealous of one another, they could never stand alone against the Christian north. Bound now to a restored power in $iberia_region$, a $taifa$ keeps its own character while bending to the authority of a single sovereign."
 LEAD_taifa: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_taifa: "[SUBJECT_TYPE.GetName] of $LIST$."
 OFFER_taifa_TOOLTIP_HEADER: "Request that [TARGET_COUNTRY.GetName] becomes a $taifa$"
 OFFER_taifa_TOOLTIP_HEADER_NO_TARGET: "Request that a [country|e] becomes a $taifa$"
 REQUEST_taifa_TOOLTIP_HEADER: "Offer to become a $taifa$ of [TARGET_COUNTRY.GetName]"
 REQUEST_taifa_TOOLTIP_HEADER_NO_TARGET: "Offer to become a $taifa$ of a [country|e]"
 CANCEL_taifa_TOOLTIP_HEADER: "Cancel the $taifa$ status of [TARGET_COUNTRY.GetName]"
 CANCEL_taifa_TOOLTIP_HEADER_NO_TARGET: "Cancel the $taifa$ status of a [country|e]"
 BREAK_taifa_TOOLTIP_HEADER: "Refuse to be a $taifa$ of [TARGET_COUNTRY.GetName]"
 BREAK_taifa_TOOLTIP_HEADER_NO_TARGET: "Refuse to be a $taifa$ of a [country|e]"
 OFFER_taifaTITLE: "Request they become our $taifa$"
