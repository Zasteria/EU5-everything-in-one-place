l_english:
 ahl_al_hall_wal_aqd_parliament: "Ahl al-Ḥall wa-l-'Aqd"
 ahl_al_hall_wal_aqd_parliament_desc: "The #italic Ahl al-Ḥall wa-l-'Aqd#! — those who loosen and bind — are the body of jurists, scholars, and senior notables whose collective consensus has traditionally conferred legitimacy upon Islamic rulers, their opinion standing as the community's endorsement of sovereignty. We convene this council as the formal deliberative institution of our realm, giving the #italic 'ulamā'#! and the leading houses a structured voice in the affairs of state. A well-supported council translates scholarly authority into durable legitimacy; without the resources to maintain it, its rulings carry less weight, and the consensus that sustains our authority becomes harder to summon."

 tribal_jamaa_parliament: "Jamā'a"
 tribal_jamaa_parliament_desc: "The #italic Jamā'a#! is the ancient institution of Amazigh collective governance, in which the free men of the tribe — and the chiefs who speak for them — deliberate on matters of war, justice, and resource use in open assembly. We recognize the #italic Jamā'a#! as the formal parliamentary body of our realm, anchoring our authority in the consent of the tribal communities that form its backbone. A functioning assembly draws those communities into the political life of the state and gives their grievances a peaceful channel; without the resources to support it, the assembly loses its convening authority and the tribes withdraw into autonomous action."
