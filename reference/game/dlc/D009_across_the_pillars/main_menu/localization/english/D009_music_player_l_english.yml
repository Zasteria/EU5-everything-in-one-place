#### TRACK NAMES AND FLAVOUR TEXT ####

#MOROCCO
 musicplayer_sol_moroccan_berma_lalla: "Moroccan - Berma Lalla"
 musicplayer_sol_moroccan_berma_lalla_flavour: "An invocation song for Lalla, one of the female mlouk in the Gnawa spirit pantheon. Performed by Asmaa Hamzaoui and her group Bnat Timbouktou, Morocco's first female gnawa performer."
 musicplayer_sol_moroccan_boulila: "Moroccan - Boulila"
 musicplayer_sol_moroccan_boulila_flavour: "A staple of the Gnawa repertoire, performed during the lila, an all-night healing ritual in which songs invoke the mlouk, spirits associated with colors, incense, and ceremony."
 musicplayer_sol_moroccan_soyo_soyo: "Moroccan - Soyo Soyo"
 musicplayer_sol_moroccan_soyo_soyo_flavour: "A piece shared across generations of gnawa masters, from Mahmoud Guinia to Bnat Timbouktou, rooted in the West African diaspora that shaped Morocco's musical heritage from the 16th century."

 #CASTILE
 musicplayer_sol_castilian_ay_triste_que_vengo: "Castilian - Ay triste que vengo"
 musicplayer_sol_castilian_ay_triste_que_vengo_flavour: "Set to music from a poem in Encina's own Cancionero (1496), this villancico reveals the fluid boundary between poetry and song in the Renaissance court of the Duke of Alba."
 musicplayer_sol_castilian_con_amores_la_mi_madre: "Castilian - Con amores la mi madre"
 musicplayer_sol_castilian_con_amores_la_mi_madre_flavour: "Written at the court of the Catholic Monarchs, this villancico walks the line between a daughter's love song and a mystical dialogue between the soul and the Virgin Mary."
 musicplayer_sol_castilian_conde_claros: "Castilian - Conde Claros"
 musicplayer_sol_castilian_conde_claros_flavour: "The tale of Count Claros and princess Claraniña, one of the most beloved ballads of 16th-century Spain, preserved here as vihuela diferencias by Narváez from which ciegos (street singers) once sang."
 musicplayer_sol_castilian_falai_minha_amor: "Castilian - Falai minha amor"
 musicplayer_sol_castilian_falai_minha_amor_flavour: "From El Maestro (1536), the first printed vihuela collection in history, this song's Portuguese text reflects the dynastic ties between Valencia and Lisbon, honoring Milán's patron King John III."
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani: "Castilian - Recercada I sopra i tenori italiani"
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani_flavour: "From the first method book dedicated to teaching viol ornamentation, this Recercada models how to glosar over the passamezzo antico, one of the standard Italian harmonic progressions of the era."
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna: "Castilian - Recercada II sobre l'Espagna"
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna_flavour: "Based on La Spagna, one of the most widely set melodies of the Renaissance, Ortiz's Recercada showcases glosar, the art of improvising divisions on a famous ground, in his Trattado de Glosas (Rome, 1553)."


