l_english:

 seven_cities_cibola.1.title: "The Pueblo is Just a Village"
 seven_cities_cibola.1.desc: "After months in the field, the column has reached the place the friars and the guides called Cibola. There are seven settlements here, as described. They are pueblos of adobe and stone, well-built and ancient, but they are villages of farmers and weavers, not gilded cities. The walls are not faced with gold, the doors are not studded with turquoise, the storerooms hold maize and dried beans and not much else. [target_leader.GetName] writes the dispatch home with the door of the captain's tent shut. Outside, the men are sitting on their packs in silence."
 seven_cities_cibola.1.a: "Well, at least it was a memorable trip..."
 seven_cities_cibola.1.historical_info: "In July 1540, Coronado's column reached Hawikuh, the first of the Cibola pueblos, and was met by a community of Zuni farmers in a fortified adobe town. The fight that followed was brief: Coronado was wounded, the pueblo was taken, and there was no gold. Fray Marcos de Niza, who had returned to Mexico City the year before with reports of seeing the city from a distance and of streets paved with jewels, was sent home in disgrace. The Spanish entradas into the southwest produced no bullion, no encomienda economy, and no permanent presence for another fifty years."

 seven_cities_cibola.2.title: "Of Turquoise and Adobe"
 seven_cities_cibola.2.desc: "The pueblo we have reached is the location the friars spoke of, though it is not as they described. The walls are not golden, but tall and plastered white, set with turquoise mosaics around the kiva doorways. The storerooms hold maize, beans, dried peppers, woven cotton, and a fair quantity of worked turquoise and shell beads. The headmen are willing to talk, and indeed some of them have seen the lands further north and can describe what lies along the upper river. There is no legend here, but there is a place. [target_leader.GetName] negotiates terms with the elders."
 seven_cities_cibola.2.a: "Not great, not terrible."
 seven_cities_cibola.2.historical_info: "The Pueblo cultures of what is now New Mexico and Arizona were trading partners with substantial reach. Turquoise from the Cerrillos hills moved south into Mesoamerica and north onto the Plains, macaw feathers came up from the Yucatan, and obsidian moved between Pueblo and Plains traders. Hawikuh, Acoma, and the Rio Grande towns were prosperous by the standards of the region, though not post-Tenochtitlan Spanish standards. The clash between Spanish ambitions and Pueblo realities resulted in what the Spanish saw as a failure and was for the Pueblo near-disaster. Nonetheless, most of the cultures involved were preserved."

 seven_cities_cibola.3.title: "Legend of the Seven Cities"
 seven_cities_cibola.3.desc: "This country is all the friars described and more. There are seven major pueblos here, each with its own dialect and its own headman, and beyond them a network of trading paths that runs all the way to the gulf and the great river to the east. The doors are studded with turquoise, the chiefs wear feathered cloaks and walk attended, and the storerooms hold gold-work of a quality not seen in generations. The treaty is signed before the next snow, [target_leader.GetName] sends two riders back to the coast with samples and a request for reinforcements."
 seven_cities_cibola.3.a: "Make this our seat in the north. A second Mexico is found."
 seven_cities_cibola.3.historical_info: "The Spanish hope, never realized, was that a second Mesoamerica lay somewhere in the deserts north of the Mexican plateau, a region of dense urban populations with extractable bullion and a centralised political authority that could be co-opted as Cortes co-opted the Mexica. The reality was a constellation of agricultural towns with rich material culture but limited gold and no central authority to negotiate with. The fantasy persisted longer than it should have because Spanish institutional incentives rewarded the report of golden cities far more than the report of their absence."

 seven_cities_cibola.10.title: "The Friar's Sworn Report"
 seven_cities_cibola.10.desc: "A friar returned from the far coasts stands on the quay with a report sworn before God and notary. He has seen the city, [target_character.GetName] says: from a hill at dusk, at a distance he refuses to specify; a city larger and fairer than any in the Indies, its doorways worked with turquoise. He did not enter, explaining that to do so would have been imprudent for a man alone. The men find the report thrilling. The officers, however, privately consider how much of it rests on one hilltop and one sunset."
 seven_cities_cibola.10.a: "Berth the friar. His city will want a witness."
 seven_cities_cibola.10.b: "Some soldiers and guides will suffice."
 cibola_friar_sails_tt: "[target_character.GetName] sails with the expedition"
 seven_cities_cibola.10.historical_info: "Fray Marcos de Niza went north from Culiacan in 1539 with instructions to observe and report, and returned swearing that he had seen from a distance a city called Cibola larger than Mexico-Tenochtitlan. He had wisely not approached it. The report electrified New Spain, and the viceroy assembled the largest land expedition yet mounted in the Americas on the strength of this one report. When Coronado's soldiers finally stood before the adobe walls of Hawikuh a year later, the general wrote that the friar had not told the truth about a single thing he reported. Whether Marcos lied outright, misjudged the gleam of the setting sun on plastered adobe, or simply reported what an anxious colony demanded of him has been debated ever since."

 seven_cities_cibola.11.title: "Crosses on the Trail"
 seven_cities_cibola.11.desc: "Our advance scout has outrun the column again. He is a man who crossed these countries once before, shipwrecked and barefoot, and the villages remember him: he walks ahead with two guides and a gourd rattle, and he sends back a wooden cross whenever the road proves out. The first cross was the span of a hand. The one carried into camp this morning stands the height of a man. The officers debate whether the crosses measure the country ahead or the man sent into it."
 seven_cities_cibola.11.a: "Let him range. The crosses speak plainly enough."
 seven_cities_cibola.11.b: "Recall him. The column moves as one body or not at all."
 seven_cities_cibola.11.historical_info: "Estevanico, a Moroccan slave who had survived the Narvaez disaster and walked eight years across the continent with Cabeza de Vaca, went ahead of Fray Marcos in 1539 as the expedition's pathfinder. The arrangement was that he would send back a cross the size of his news: a small one for a fair country, a larger one for a rich one. The crosses grew until runners could barely carry them, and the friar hurried after a man who was, by then, several countries ahead of him and enjoying every step of it. What the crosses were actually measuring has been debated ever since."

 seven_cities_cibola.12.title: "The Despoblado"
 seven_cities_cibola.12.desc: "Between the last friendly villages and the city of the legend lies the country the guides call the despoblado: a wilderness of thorn and dry riverbeds, fifteen days across at best, with nothing in it a column can eat. Every load of maize carried in must be carried on a back or a hoof that also needs feeding. The quartermaster has counted the loads three times and says nothing at all. The city is close now. So is the hunger."
 seven_cities_cibola.12.desc_friar: "The friar has taken to preaching at the evening fires, and his text does not vary: the city lies just beyond the wilderness, he has seen it with his own eyes, and God does not show a man a thing in order to starve him short of it. The quartermaster, who has done the arithmetic on the despoblado twice, observes that heaven has never once fed this column except out of its own packs. [target_leader.GetName] must now choose between the sermon and the sums."
 seven_cities_cibola.12.a: "A vanguard rides ahead, and rides light."
 seven_cities_cibola.12.b: "The whole column and the supply herds. Slow is alive."
 seven_cities_cibola.12.historical_info: "Coronado solved the despoblado, the unpeopled country between the Sonora valley and the Zuni towns, by dividing his expedition: a vanguard of horsemen rode ahead with him while the main body followed by stages with the herds. The vanguard that reached Hawikuh in July 1540 was hungry enough that the battle for the pueblo was fought, as one chronicler admitted, principally for the maize inside it. The despoblado did more to shape the expedition's temper than any legend did; the men who finally saw Cibola had been eating their horses' feed for a week, and it showed in what they did next."

 seven_cities_cibola.13.title: "A Cross the Height of a Man"
 seven_cities_cibola.13.desc: "The runners no longer carry the crosses; they drag them. The latest stands the height of a man, cut green and heavy, and the guides who hauled it into camp say the scout has stopped sending words with the wood entirely, as if nothing he could say would add to it. He is close now. He walks a day ahead of his escort, shaking the gourd rattle, and the towns empty out to watch him pass. His last request, relayed with the cross, is leave to enter the city itself and greet its lords before the column arrives."
 seven_cities_cibola.13.a: "Let him greet the city. He has earned the first look."
 seven_cities_cibola.13.a.tt: "#italic The scout's leave is granted, and somewhere far ahead he walks on toward the gates#!"
 seven_cities_cibola.13.b: "Recall him now, and his notes with him."
 seven_cities_cibola.13.historical_info: "Estevanico traveled through the northern valleys as something between a scout and a holy figure: he went ahead of the friars with an escort of admirers, carried a ceremonial gourd rattle hung with bells and feathers, and was showered with gifts of turquoise at every town. The performance was the product of his years among the peoples of the interior, and it worked until it did not. The gourd rattle he sent ahead to announce himself at Cibola was, by one account, recognized at the pueblo as belonging to an enemy people, and his embassy was refused before he ever reached the walls."

 seven_cities_cibola.14.title: "Killed at the Gates"
 seven_cities_cibola.14.desc: "The men of his escort come back thin and quiet, in twos and threes, over the space of a week. Their accounts differ in the details and agree in the substance. The scout reached the city. It stands, they say, stone on stone above a plain, exactly where the crosses pointed. Its lords refused him at the gates, held him a night outside the walls, and killed him in the morning when he would not turn back. The column has its confirmation, and the price of it walked ahead of us the whole way, shaking a gourd rattle."
 seven_cities_cibola.14.a: "He found it. Set the muster in his name and march."
 seven_cities_cibola.14.historical_info: "Estevanico was killed at Hawikuh in May 1539, the first man of the Old World to reach the Seven Cities and the first to die for them. The survivors of his escort fled south and met Fray Marcos coming up the trail; the friar, by his own account, pressed on just far enough to view the city from a distance before turning back to Mexico with the news. The death was read as proof rather than warning, since a city that killed ambassadors was evidently a city with something to guard. The army that marched the following spring was, in that sense, Estevanico's monument."

