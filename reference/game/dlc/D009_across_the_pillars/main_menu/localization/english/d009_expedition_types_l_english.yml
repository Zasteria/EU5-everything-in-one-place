l_english:
 gold_caravan_expedition: "The Gold Caravan"
 gold_caravan_expedition_desc: "Send a caravan south across the Sahara to the golden markets of the #italic Bilād as-Sūdān#!, trading salt and cloth for the wealth of the Sahel. The road is long and the desert perilous, but a caravan that returns home will pour the gold of the Sahel into your capital's market."
 gold_caravan_expedition_haul_tt: "#G [ROOT.GetVariable('gold_caravan_last_haul').GetValue|V0]#! [ShowGoodsName('goods_gold')] added to the supply of our market in [ROOT.GetCountry.GetCapital.GetName]"
 gold_caravan_outcome_windfall: "Merchants flock to the caravan's success"
 gold_caravan_outcome_nickname: "The caravan leader earns a golden reputation"
 gold_caravan_outcome_midas: "The ruler is touched by the caravan's riches"
 gold_caravan_outcome_leader_skills: "The caravan leader gains hard-won experience"
 cibola_expedition: "Search for the Seven Cities of Cibola"
 cibola_expedition_desc: "Outfit a column to push north from the Sonoran coast into the country that the friars and the runaway slaves describe as the land of seven golden pueblos. The route is hard and the natives say it is unwelcoming, but the same friars say what waits at the end of it is greater than anything ever seen."
 quivira_expedition: "Search for the Kingdom of Quivira"
 quivira_expedition_desc: "Push beyond the country of the Pueblos into the open grass that runs east without end, on the word of a captive guide who says a wealthy kingdom lies a month's march into the plains. The grass-sea is empty and the rivers run sluggish, but the prize, if the prize is real, would equal the conquest of Peru."
 sierra_de_la_plata_expedition: "Search for the Sierra de la Plata"
 sierra_de_la_plata_expedition_desc: "Push west and north from the Plate into the Andean foothills in pursuit of the Sierra de la Plata, the silver mountain the Guarani guides describe and the survivors of the Solis expedition swore was real. If the mountain is found, it will not be a discovery of one mine but of an entire bullion economy waiting to be opened."
 norumbega_expedition: "Search for Norumbega"
 norumbega_expedition_desc: "Push up the Penobscot from the New England coast in search of Norumbega, the walled city of the great river that Verrazano's pilots and the Bristol fishermen alike have reported. The country is heavily wooded, the river is long, and the natives are reserved, but the city, if the city exists, would be the first European-style settlement in the New World and the second one not built by us."
 saguenay_expedition: "Search for the Kingdom of Saguenay"
 saguenay_expedition_desc: "Push up the Saguenay from the Saint Lawrence into the interior of New France in search of the kingdom Donnacona described to Cartier at Stadacona: a country, the chief said, of fair-skinned men in fur cloaks, of mountains of gold and rivers of silver, lying somewhere north of the great Canadian river. Cartier never reached it. We may."
 city_of_caesars_expedition: "Search for the City of the Caesars"
 city_of_caesars_expedition_desc: "Dispatch an overland party from [ShowRegionName('la_plata_region')] south into the Patagonian interior, on the report of survivors from a lost galleon who claim to have seen a city built between two mountains, its inhabitants speaking a Castilian Spanish no living court would recognize. The Patagonian winter is bitter and the survivors are unreliable witnesses, but no inquiry has ever been made."
 city_of_caesars_expedition_historical_info: "The legend of the City of the Caesars, a Spanish-speaking settlement founded by survivors of a sixteenth-century shipwreck on the Patagonian coast and supposedly hidden in the interior of the country, was credited by the Spanish crown well into the eighteenth century. At least seven expeditions were sent in search of it between 1530 and 1750. None found anything. The legend persisted partly because Patagonia was genuinely difficult to survey at the time, partly because the survivors of shipwrecks did periodically reappear with elaborate stories to explain their long absence, and partly because the institutional bias of colonial bureaucracies was always to act on a credible rumor rather than to ignore it."
 city_of_caesars_expedition_outcome_overview: "$BULLET$The search itself grants a steady trickle of [prestige|e] while it lasts.\n$BULLET$The outcome then depends on how many leads are found:\n$BULLET_WITH_TAB$None: #R -5#! [prestige].\n$BULLET_WITH_TAB$One or more: #G +10#! [prestige], [gold|e], and the permanent [ShowModifier('city_of_caesars_discovered')] [location_modifier|e] on the city's site.\n$BULLET_WITH_TAB$Four or more: #G +20#! [prestige] and far more [gold].\n$BULLET$Any riches gathered along the way are delivered to our [market|e], with the finest artifacts becoming a [work_of_art|e]."
 el_dorado_expedition: "Search for El Dorado"
 el_dorado_expedition_desc: "Strike inland from the Orinoco delta in pursuit of the gilded king the Muisca remember: a chief anointed every year with gold dust at the heart of a kingdom no Spanish boot has yet reached. The jungle is heavy, the rivers are crooked, the natives are cautious, and the gold, if the gold is real, lies somewhere on the far side of all three."
 el_dorado_expedition_historical_info: "Guatavita is a sacred crater-lake in the highlands of present-day Colombia, the cult center of the Muisca confederation that ruled the savannah of Bogota until the Spanish arrival in the 1530s. The ceremony at the heart of the El Dorado legend, the periodic anointing of a new chief with gold dust before he was rowed onto the lake and the dust washed off into the water, was real and was conducted at Guatavita well into the early colonial period. The kingdom that conducted it, however, was already in collapse by the time the first European expedition reached the savannah, having been ravaged by smallpox and by the political crisis that the arrival of European disease almost everywhere produced."
 el_dorado_expedition_outcome_overview: "$BULLET$The search itself grants a steady trickle of [prestige|e] while it lasts.\n$BULLET$The outcome then depends on how many leads are found:\n$BULLET_WITH_TAB$None: #R -10#! [prestige].\n$BULLET_WITH_TAB$One or more: #G +10#! [prestige], [gold|e], and the permanent [ShowModifier('el_dorado_discovered')] [location_modifier|e] on the city's site.\n$BULLET_WITH_TAB$Five or more: #G +20#! [prestige] and far more [gold].\n$BULLET$Any riches, exotic goods, and artifacts gathered along the way are delivered to our [market|e], with the finest becoming a [work_of_art|e]."
 fountain_of_youth_expedition: "Search for the Fountain of Youth"
 fountain_of_youth_expedition_desc: "Outfit a small expedition to the Florida peninsula in search of the spring that the Taino call the Fountain of Bimini: a water, the elders say, that restores a man's vigor and a woman's beauty to what they were at twenty. The Spanish soldiers laugh at the idea. The old men of the islands do not."
 fountain_of_youth_expedition_historical_info: "Ponce de Leon's 1513 voyage to Florida is conventionally associated with the search for the Fountain of Youth, but the association postdates Ponce de Leon himself; it first appears in Spanish chronicles after his death and was solidified by later historians for whom the picturesque framing was useful. The actual voyage was a routine reconnaissance mission funded by a private investor who wanted to establish a slaving post on what was then assumed to be an island. The Fountain became attached to Ponce de Leon's name because he had died young, in his fifties, of an arrow wound taken in Florida, an irony the Spanish narrators of the next generation could not resist."
 fountain_of_youth_expedition_outcome_overview: "$BULLET$The search itself grants a steady trickle of [prestige|e] while it lasts.\n$BULLET$The outcome then depends on how many leads are found:\n$BULLET_WITH_TAB$None: #R -5#! [prestige].\n$BULLET_WITH_TAB$One or more: #G +10#! [prestige] and the permanent [ShowModifier('fountain_of_youth_discovered')] [location_modifier|e].\n$BULLET_WITH_TAB$Five or more: #G +20#! [prestige].\n$BULLET$Any water recovered extends the lives of both our [ruler|e] and [heir|e] through [ShowModifier('rejuvenating_waters_modifier')], and a native healer may join our court as a new [character|e]."
 gold_fleet_tierra_firme_expedition: "Galeones de Tierra Firme"
 gold_fleet_tierra_firme_expedition_desc: "Dispatch a convoy of galleons from our best home port to our holdings in New Granada and the Isthmus, collecting silver, gems, and hides. The Tierra Firme fleet is the artery of the Spanish colonial empire, carrying the wealth of the Indies to the markets of Seville."
 gold_fleet_tierra_firme_expedition_historical_info: "The #italic Galeones de Tierra Firme#! was one of two convoys that made up the Spanish #italic Carrera de Indias#!. The Tierra Firme fleet served the South American viceroyalties, collecting silver from the mines of Potosí in Upper Peru and other colonial revenues via the ports of Portobelo and Cartagena. The silver was transported overland from the Pacific coast across the Panamá isthmus before loading. Philip II formalized the convoy system in 1566, requiring all trade to move in armed fleets and pass through the #italic Casa de Contratación#! in Seville, which collected the crown's #italic quinto real#!, a fifth of all precious metals extracted from the New World."
 gold_fleet_tierra_firme_expedition_outcome_overview: "The convoy loads our colonial [ShowGoodsName('silver')] and [ShowGoodsName('goods_gold')] and delivers it home as [gold|e], with #G +10#! [prestige|e] on arrival. Taking on [ShowGoodsName('gems')], [ShowGoodsName('pearls')], or a mule train swells the cargo further but draws more attention, while meeting the $gold_fleet_nueva_espana_expedition$ in [ShowScriptedGeographyName('island_of_cuba_geography')] grants #G +10#! [prestige] and makes the crossing safer. Storms and raiders can take a share of the cargo, or in the worst case all of it."
 gold_fleet_nueva_espana_expedition: "Flota de Nueva España"
 gold_fleet_nueva_espana_expedition_desc: "Dispatch the New Spain convoy from our best home port to our Mesoamerican holdings, collecting silver and precious dyes. The fleet routes through the Mona Passage into the Caribbean before assembling at Havana for the Atlantic crossing."
 gold_fleet_nueva_espana_expedition_historical_info: "The #italic Flota de Nueva España#! was one of two convoys making up the Spanish #italic Carrera de Indias#!. It served the Viceroyalty of New Spain, collecting silver from the mines of Zacatecas, Guanajuato, and other Mexican deposits via the port of San Juan de Ulúa near Veracruz, along with high-value goods including cochineal dye from Oaxaca, indigo, vanilla, and cacao. The #italic flota#! typically departed Spain in spring and returned in autumn, joining the Tierra Firme galleons at Havana for the combined Atlantic crossing. The route through the Mona Passage between Hispaniola and Puerto Rico was the standard eastern Caribbean entry point."
 gold_fleet_nueva_espana_expedition_outcome_overview: "The convoy loads our colonial [ShowGoodsName('silver')] and [ShowGoodsName('goods_gold')] and delivers it home as [gold|e], with #G +10#! [prestige|e] on arrival. Escorting a silver train or taking on [ShowGoodsName('lumber')] swells the cargo further but draws more attention, while meeting the $gold_fleet_tierra_firme_expedition$ in [ShowScriptedGeographyName('island_of_cuba_geography')] grants #G +10#! [prestige] and makes the crossing safer. Storms and raiders can take a share of the cargo, or in the worst case all of it."
 gold_fleet_tierra_firme_expedition_expedition_special: "Cargo on board: [EXPEDITION.GetVariable('gold_fleet_cargo')|0] gold"
 gold_fleet_nueva_espana_expedition_expedition_special: "Cargo on board: [EXPEDITION.GetVariable('gold_fleet_cargo')|0] gold"
 gold_fleet_cargo: "Treasure Cargo"
 gold_fleet_cargo_desc: "Silver and gold loaded aboard during the voyage, delivered to the treasury on the fleet's safe return."
 gold_fleet_danger: "Danger Level"
 gold_fleet_danger_desc: "The risk of pirate attack and other misfortune along the route. Rises and falls with the choices made during the voyage."
