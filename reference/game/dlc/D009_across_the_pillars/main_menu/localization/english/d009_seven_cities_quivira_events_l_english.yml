l_english:

 seven_cities_quivira.1.title: "An Adobe Village in the Grass"
 seven_cities_quivira.1.desc: "After two months on the plains, the column has reached the country El Turco described. There is a settlement here, a substantial one by the standards of the grass-sea, but it is a town of round grass-thatched houses, not a stone capital. The chief is a tall man in a buffalo cloak. His people grow maize and beans in the river bottoms and hunt buffalo on the plain. There is no gold. El Turco, when pressed, admits he was sent by the Pueblos to lead the column as far from their country as possible. [target_leader.GetName] orders him hanged."
 seven_cities_quivira.1.a: "Strike the column. Nothing here but grass and lies."
 seven_cities_quivira.1.historical_info: "Coronado reached Quivira, somewhere in present-day Kansas, in summer 1541. The country was inhabited by Wichita farmers in grass-house villages along the Arkansas. There was no gold. The Pawnee man called El Turco, who had led the column east from New Mexico on the promise of a wealthy kingdom, was strangled by Spanish soldiers on Coronado's order; he had confessed that the Pueblos had instructed him to lead the Spanish onto the plain in the hope they would never come back. Coronado walked the column home that winter and reported to Mendoza that nothing in the country was worth the army it would take to hold it."

 seven_cities_quivira.2.title: "Fertile Country, but no Gold"
 seven_cities_quivira.2.desc: "The country we have reached is rich after its own fashion: well-watered river bottoms heavy with maize, herds of buffalo at the edges of the woods, the people peaceful and willing to trade. The chief gives the [target_leader.GetName] a string of green river-stones the chronicler initially mistakes for jade. The Spanish goldsmith corrects him: it is not jade. It is a soft green stone unknown to him, beautiful but of no commercial value at home. The country is not what we were sent to find, but the country is something. The maps will be redrawn."
 seven_cities_quivira.2.a: "Take the stones home as curiosities. The land is mapped."
 seven_cities_quivira.2.historical_info: "Coronado's officers reported the Plains country as good for cattle and grain but poor for the kind of commerce that could justify a Spanish colonial presence. The judgment held for more than two centuries; the Spanish never colonised the Great Plains, and the French and British incursions that followed were trading-post operations, not settled colonies, until the late nineteenth century. The green stones the Wichita gave Coronado have never been positively identified; the best guess is a soft serpentine traded up the river systems from sources in the southwest."

 seven_cities_quivira.3.title: "The Legend Confirmed"
 seven_cities_quivira.3.desc: "El Turco was telling the truth. The country here is the country he described: a wealthy kingdom of stone-walled towns set among rivers and grasslands, ruled by a council of chiefs in a great-house of timbers and turquoise. There is gold here, panned from the streams that come down from the western mountains. There is silver in the chiefs' regalia. The people, when the trade goods are produced and the priest is allowed to walk through the village unmolested, are willing to receive an embassy. [target_leader.GetName] writes for reinforcements before the first dispatch is sealed."
 seven_cities_quivira.3.a: "Plant the standard. Reinforce. The country is found."
 seven_cities_quivira.3.historical_info: "Quivira was the great unrealised hope of Spanish exploration north of New Spain: a wealthy interior kingdom that, had it actually existed, would have changed the course of North American history by giving the Spanish crown a reason to occupy the Plains. The myth proved durable enough that Quivira appears on European maps in approximately the right location as late as the eighteenth century, by which point the actual country was being mapped by French fur-traders working out of the Mississippi system."

 seven_cities_quivira.10.title: "Two Guides"
 seven_cities_quivira.10.desc: "Two men of the plains stand before the expedition, carried across the ocean by an earlier voyage and kept since at the harbor's charge. Asked about the country called Quivira, the elder, [target_character.GetName], describes a king who sleeps beneath a tree hung with golden bells, canoes with prows of beaten gold, dishes of worked silver on every table. The younger, [second_guide.GetName], asked the same question, says the country is grass and sky and good rivers, and that his people build in thatch and hunt the humpbacked cattle. They cannot both be describing home. One of them is to have a berth."
 seven_cities_quivira.10.a: "Berth the elder. Gold does not invent itself."
 seven_cities_quivira.10.b: "Berth the younger. The smaller promise is easier to keep."
 quivira_gold_guide_tt: "[target_character.GetName] joins the voyage as our guide"
 quivira_grass_guide_tt: "[second_guide.GetName] joins the voyage as our guide"
 seven_cities_quivira.10.historical_info: "Coronado's expedition carried two Plains captives out of the Pueblo country as guides: the man the Spanish called El Turco, who spoke of Quivira as a kingdom where the lord slept under a tree of golden bells and ate from dishes of silver, and a Wichita called Ysopete, who kept saying, to anyone who would listen, that there was no gold in Quivira and that El Turco was lying. The column chose to believe El Turco. It was the more expensive of the two decisions, and it was made, as one veteran later put it, because an army that has marched a thousand leagues needs the better story to be true."

 seven_cities_quivira.11.title: "The Thirty Lances"
 seven_cities_quivira.11.desc: "The continent is ahead, and the likelihood of all of us crossing it faint. The country between this anchorage and Quivira cannot feed a column of our size; at best, it may feed thirty. [target_leader.GetName] spread the muster rolls out on a sea-chest and, name by name, chooses who rides north and who waits with the ships and the stores. Every man in camp has an opinion about the list, most of which concern which side of it their own names should fall on."
 seven_cities_quivira.11.a: "Thirty riders and the compass. The rest hold the coast."
 seven_cities_quivira.11.b: "The full train and herds. We arrive as a power, or not."
 quivira_train_left_behind_tt: "Our guides and porters remain behind with the train"
 seven_cities_quivira.11.historical_info: "At the Rio Grande, after a winter of bad blood with the Pueblos and a spring of dwindling stores, Coronado sent the bulk of his army back and rode for Quivira with thirty selected horsemen, navigating the featureless plain by compass and by counting each day's paces. The plains defeated ordinary methods: parties that rode out of sight of the column vanished, landmarks did not exist, and the buffalo herds erased every trail within hours. The thirty reached Quivira, a feat three hundred could have not accomplished."

 seven_cities_quivira.12.title: "The Sea of Grass"
 seven_cities_quivira.12.desc: "The plain has no edges. For twelve days the column has marched into grass that closes behind it like water, past herds of the humpbacked cattle that darken the ground to the horizon. A hunting party rode out of sight on the fourth day and has not been seen since. The men mark the backtrail with piles of buffalo dung, there being neither stone nor tree. The compass and the counted pace are all the geography we have."
 seven_cities_quivira.12.desc_false_guide: "The guide has gone quiet as the plain has gone wide. He no longer names the days remaining, and he no longer meets the eye of the man he is guiding. At the fires the men repeat his old stories to each other with a new edge in their voices, and [target_leader.GetName] has doubled the watch on him without being asked to. Out here there is nowhere to desert to. That is the only reassuring thing about him."
 seven_cities_quivira.12.desc_true_guide: "The guide who promised only grass has been as good as his word, which the men are beginning to notice covers a great deal. He reads the landscape the way a pilot reads water: which rivers bend north, where the herds will cross, which stars can guide us when the land proves harder to navigate. Each night he scratches the column's position in the ashes for the chronicler, and each day the scratches prove correct. There is no gold in his country, he says, but there are worse things for a country to lack."
 seven_cities_quivira.12.a: "Follow his lead."
 seven_cities_quivira.12.b: "Trust the man who has not lied to us."
 seven_cities_quivira.12.c: "North by the needle, counting every step."
 seven_cities_quivira.12.historical_info: "The chroniclers of the Coronado expedition wrote about the plains with something close to delirium: a country so flat and featureless that men who rode a bowshot from the column were lost, where the grass stood back up behind the horses and left no trail, and where the only navigation was the compass, counted paces, and piles of bones and dung raised as landmarks. El Turco's confession, when it finally came at Quivira, was that the Pueblos had asked him to lead the army out onto that plain and lose them there. He had very nearly managed it, and the environment itself had done most of the work."

 seven_cities_quivira.13.title: "The Hunchbacked Cattle"
 seven_cities_quivira.13.desc: "The scouts report it first as a brown fog on the horizon, then as a hill that moves, and by noon there is no denying it: cattle, humpbacked and shaggy, in numbers no man of the column has words for. The herd parts around the line of march the way a river parts around a rock, closes again behind it, and continues to the edge of the world in every direction. The quartermaster rides through it slowly, counting nothing, saying nothing, wearing the look of a man who has walked into a storehouse the size of a province."
 seven_cities_quivira.13.a: "Halt the column and hunt until the racks are full."
 seven_cities_quivira.13.b: "Push through the herds. We hunt legends, not cattle."
 seven_cities_quivira.13.b.tt: "#italic The column threads the herds for days without a halt, and the men eat salt beef surrounded by fresh#!"
 quivira_hides_and_meat_tt: "#Y Hides and dried meat fill the packs, and the porters will carry them home#!"
 seven_cities_quivira.13.historical_info: "The Coronado expedition's chroniclers struggled to describe the buffalo: humpbacked cows bearded like goats, they wrote, in herds that took days to ride through and left the plain trampled bare behind them. The column and its allies lived on the herds entirely during the plains march, and the veterans' accounts speak with more wonder about the cattle than Quivira itself. Several concluded that the herds were the only wealth the country offered, and that Spain already had cattle."

