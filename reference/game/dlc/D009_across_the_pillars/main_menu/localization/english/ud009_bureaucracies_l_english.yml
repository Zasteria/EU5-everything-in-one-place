l_english:
 dar_al_tiraz_bureaucracy: "Dār al-Ṭirāz"
 dar_al_tiraz_bureaucracy_desc: "The ostentous embroided clothes originating from Persia have long been used in the Islamic world as robes of honor the sovereign bestows upon those he favors. A well-funded royal #italic $dar_al_tiraz_bureaucracy$#! workshop that weaves silk, brocade, and embroidery will clothe the court in splendor and send prized fabrics to every market."

 diwan_al_mustakhlas_bureaucracy: "Dīwān al-Mustaḵlaṣ"
 diwan_al_mustakhlas_bureaucracy_desc: "The #italic $diwan_al_mustakhlas_bureaucracy$#! administers the sultan's private domain of estates, mills, and revenues set apart from the public treasury to fund the court and the $alhambra$. A diligent stewardship keeps the crown wealthy and independent of its estates, but lax oversight invites the very officials who manage it to divert its riches into their own coffers."

 diwan_al_qawafil_bureaucracy: "Dīwān al-Qawāfil"
 diwan_al_qawafil_bureaucracy_desc: "The #italic $diwan_al_qawafil_bureaucracy$#! oversees the great caravans of the trans-Saharan trade, the routes through Sijilmāsa that carry gold and slaves north and salt and cloth south. A well-run office protects the merchants and their beasts and swells the wealth that crosses the desert, lest the caravans get prey to raiders, and the tribes of the sand grow hostile to a power that no longer secures the road."

 ghuzat_mujahidin_bureaucracy: "Al-Ḡuzāt al-Mujāhidīn"
 ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! are the volunteers of the faith, the North African cavalry who cross the strait to wage holy war on the frontier under their own $rank_county_arabic_ruler_male$. These ardent warriors fight with a zeal born of devotion, and their piety inspires our people to follow in their fervor."

 makhzan_bureaucracy: "Al-Maḵzan"
 makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! is the central apparatus of the sultan's authority, its tax-gatherers and governors extending the writ of the throne. A strong #italic maḵzan#! tightens the crown's grip over distant tribes and towns, but when its administration falters the country truly becomes a #italic bilād as-sība#!, the land of dissidence, and outlying provinces slip toward rebellion and autonomy."

 marinid_madaris_bureaucracy: "Ri'āyat al-Madāris"
 marinid_madaris_bureaucracy_desc: "The #italic $marinid_madaris_bureaucracy$#! is the crown's patronage of the madrasas, the colleges that train the jurists, scribes, and officials on whom the state depends. Endowed generously, they fill the cabinet with learned and loyal servants and entrench the formal law of the schools."

 qadi_al_jamaa_bureaucracy: "Qāḍī al-Jamā'a"
 qadi_al_jamaa_bureaucracy_desc: "The #italic $qadi_al_jamaa_bureaucracy$#! is the chief judge of the community, who presides over the $maliki_school$ courts and appoints the many local qāḍī of the realm. A respected judiciary system settles disputes by law recognized by all and lends the throne the legitimacy of justice, deepening the people's attachment to formal jurisprudence."

 wulat_al_thughur_bureaucracy: "Wulāt al-Ṯuḡūr"
 wulat_al_thughur_bureaucracy_desc: "The #italic $wulat_al_thughur_bureaucracy$#! are the wardens of the frontier marches. They garrison the border castles, watch the passes, and manage the truces and tribute that keep the larger Christian kingdoms at bay. A proper march bristles with defenders and buys the realm time through careful diplomacy, because if we neglect the frontier that emboldens our neighbors, who may smell weakness and press their claims harder."

 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "Dīwān al-Ḡarb"
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#! — the Bureau of the West — is the administrative organ we plant in our Andalusi provinces to govern a population that speaks Arabized Romance as readily as Arabic and whose parish churches still outnumber our mosques. Its scribes collect the sultan's revenues, appoint qāḍīs over the mixed courts, and press the assimilation that turns conquest into province. A well-run bureau binds these western lands to our law; a neglected one hands the frontier to whatever clan can enforce its own."

 dawa_bureaucracy: "Dīwān al-Daʿwa"
 dawa_bureaucracy_desc: "The #italic $dawa_bureaucracy$#! is the office through which the sovereign governs the faith across the ocean, sending qāḍīs and preachers to the far provinces where dominion has outrun the mosque. Its #italic duʿāt#! carry the call of Islam to the peoples of those shores while its scribes bind the new colonies to the law of the ummah. Sustained well, it turns distant conquest into settled province and swells the faithful under the crown. Neglected, the far flock drifts beyond the sovereign's reach, and the call falls silent where none is paid to raise it."

 # Mozabite Bureaucracy

 mozabite_azzaba_bureaucracy: "'Azzāba Council"
 mozabite_azzaba_bureaucracy_desc: "The #italic ʿAzzāba#! is the secret council of Ibadi scholars that forms the true governing backbone of the Mozabite communities of the Mzāb valley, deliberating on religious law, arbitrating disputes, and enforcing the strict moral code that has preserved Ibadi identity through centuries of external pressure. We maintain this council as the supreme arbiter of our communal life, funding its scholars and honoring its rulings as expressions of divine law. A well-supported 'Azzāba commands the devotion of the faithful and extends the reach of Ibadi jurisprudence into every household; left without resources, its authority fragments, and heterodox currents fill the space its silence leaves."

 # Pre-Formation Iberian Bureaucracies

 nav_diputacion_navarra_bureaucracy: "Diputación de Navarra"
 nav_diputacion_navarra_bureaucracy_desc: "The $nav_diputacion_navarra_bureaucracy$ administers the constitutional life of Navarre between sessions of the Cortes, overseeing the collection of the #italic donativo#! and ensuring the scrupulous observance of the #italic fueros#! that define Navarrese autonomy. Its membership draws from the three estates of the kingdom, giving nobles, clergy, and towns a permanent institutional presence in the administration of their realm. A well-funded Diputación is the guarantor of foral compliance; without adequate resources, it lacks the capacity to resist the centralizing pressure that great monarchies inevitably bring to bear on their smaller territories."
 por_desembargo_do_paco_bureaucracy: "Desembargo do Paço"
 por_desembargo_do_paco_bureaucracy_desc: "The $por_desembargo_do_paco_bureaucracy$ is the supreme royal council of Portugal, entrusted with reviewing legislation, issuing pardons, and overseeing the judicial appointments that give the Crown its reach into every corner of the realm. Unlike the university-trained lawyers who staff the ordinary courts, the Desembargo draws on men of both legal expertise and royal confidence, combining professional jurisprudence with direct service to the monarch. A well-maintained Desembargo accelerates the administrative cycle and ensures that royal decisions are implemented with legal precision."
 por_mesa_da_consciencia_e_ordens_bureaucracy: "Mesa da Consciência e Ordens"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "The $por_mesa_da_consciencia_e_ordens_bureaucracy$ was established to regulate the military orders of Portugal — the Order of Christ, the Order of Santiago, and the Order of Aviz — whose lands, revenues, and spiritual authority the Crown administers as Grand Master. The tribunal examines petitions for religious dispensations, manages the allocation of commanderies to royal clients, and arbitrates the interface between canonical law and royal patronage. Its establishment transformed the military orders from autonomous ecclesiastical corporations into instruments of Crown policy, tightly bound to the royal religious agenda."

 # Spanish Councils - Regional

 spa_council_of_aragon_bureaucracy: "Consejo de Aragón"
 spa_council_of_aragon_bureaucracy_desc: "The eastern territories of [ShowRegionName('iberia_region')] of the [ShowScriptedGeographyName('aragon_geography')] shall be governed by the #italic $spa_council_of_aragon_bureaucracy$#!. The office is mainly tasked with maintaining our ties to the mediterranean trade and the needs of the local fueros."

 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "The #italic $spa_council_of_castile_bureaucracy$#! is responsible for the lands of the [ShowScriptedGeographyName('castile_geography')], governing these vast territories and its people in our stead."

 spa_council_of_flanders_bureaucracy: "Consejo de Flandes"
 spa_council_of_flanders_bureaucracy_desc: "Governing lands far away from our traditional domains, the #italic $spa_council_of_flanders_bureaucracy$#! will have to maintain a strong grip on the [ShowScriptedGeographyName('spanish_netherlands_geography')] to maintain the order and productivty of the region."

 spa_council_of_italy_bureaucracy: "Consejo de Italia"
 spa_council_of_italy_bureaucracy_desc: "With our ever increasing presence within [ShowRegionName('italy_region')] a council with the express purpose of administrating our new conquests should be established. Governing these lands will be a different kind of challenge for us from our territories within [ShowRegionName('iberia_region')]"

 spa_council_of_portugal_bureaucracy: "Conselho de Portugal"
 spa_council_of_portugal_bureaucracy_desc: "With our acquisitions of more territory, we should establish a dedicated council for our possessions within [ShowScriptedGeographyName('portugal_geography')]. The office will mainly adminstrate our atlantic trade and naval matters."

 spa_viceroy_bureaucracy: "Bureau of the Viceroy"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"

 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "Consejo de Cruzada"
 spa_council_of_crusade_bureaucracy_desc: "Established in accordance with the [GetUniqueInternationalOrganization('catholic_church').GetName] and the [pope], the #italic $spa_council_of_crusade_bureaucracy$#! will guide our expansion and our efforts to bring the light of the [ShowReligionAdjective('catholic')] faith into all corners of the world."

 spa_council_of_finance_bureaucracy: "Consejo de Hacienda"
 spa_council_of_finance_bureaucracy_desc: "Replacing the two previous offices of Accounts and Major Accounts, the #italic $spa_council_of_finance_bureaucracy$#! shall eliminate the friction between the two offices and create a unified bureau to handle the finances of the state."

 spa_council_of_indies_bureaucracy: "Consejo de las Indias"
 spa_council_of_indies_bureaucracy_desc: "All which lies beyond the sea will fall under the jurisdiction of the #italic $spa_council_of_indies_bureaucracy$#!. They will administrate all trade flowing from the colonies and into our main land and our subjects on foreign shores, ensuring a steady flow of wealth into our coffers. The livelyhoods and regulations of our newly acquired subjects and the distribution of land for colonial exploitation will also be governed by this Council."

 spa_council_of_inquisition_bureaucracy: "Consejo de la Suprema Inquisición"
 spa_council_of_inquisition_bureaucracy_desc: "The #italic $spa_council_of_inquisition_bureaucracy$#!, composed of several apostolic inquisitors and led by the inquisitor general, oversees the religious orthodoxy and court processes of our country. They will be serving as the highest court of appeal in both ecclesetical and worldy matters."

 spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes"
 spa_council_of_military_orders_bureaucracy_desc: "Tasked with the administration of their former lands, the #italic $spa_council_of_military_orders_bureaucracy$#! will play a vital role in granting lands for our military purposes, increasing our armies recruitment pool and ensuring capable officers are educated and recruited into our forces."

 spa_council_of_state_bureaucracy: "Consejo de Estado"
 spa_council_of_state_bureaucracy_desc: "The #italic $spa_council_of_state_bureaucracy$#! is led by our ruler directly, and is assisting our ruler in foreign affairs without the meddling of outside influence. The Council is staffed with capable members of our nobility and clergy, educated in diplomacy and foreign relations, and will manage both our embassies abroad and advice us on the navigation of difficult international affairs."
