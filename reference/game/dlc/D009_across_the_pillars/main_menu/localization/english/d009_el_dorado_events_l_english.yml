l_english:

 d009_el_dorado_events.1.title: "A Map of Dubious Provenance"
 d009_el_dorado_events.1.desc: "Two men present themselves at our fire with the easy confidence of practiced liars: deserters, or gamblers, or escaped convicts, for their story shifts with every retelling. What does not shift is the map they carry, a greasy square of hide crowded with golden lakes, mountains of solid silver, and cities drawn grander than any that could truly stand. They swear to every landmark upon their lives, which our sergeant observes are not worth wagering much upon. Still, it is the only map we have, and a false trail walked boldly has carried many an expedition further than an honest one refused in fear."
 d009_el_dorado_events.el_dorado_desc: "El Dorado, the Gilded One, began as a real ceremony among the Muisca of the Colombian highlands, in which a new ruler was coated in gold dust and rowed out onto Lake Guatavita to cast offerings of gold and emeralds into its waters. In the retelling of Spanish and later English adventurers, the gilded man swelled into a golden city, then a hidden kingdom, and at last a whole lost empire, its supposed location retreating ever deeper into the interior, from the Andes to the Orinoco to the forests of Guiana. The search consumed a generation of entradas: Jimenez de Quesada, Belalcazar, and the ruinous venture of Gonzalo Pizarro and Francisco de Orellana, which found no gold but produced the first European navigation of the Amazon. Later expeditions collapsed into mutiny, most infamously under Lope de Aguirre, while others labored to drain Lake Guatavita itself, recovering a little treasure at enormous cost. No kingdom was ever found, for none had ever existed, yet the legend outlived every man who died chasing it."
 d009_el_dorado_events.1.a: "It is the best map we have. Follow it."
 d009_el_dorado_events.1.b: "Send the rogues on their way."
 d009_el_dorado_events.1.b.tt: "#italic We send the rogues packing and press on without their greasy map#!"
 new_location_grants_clue_for_el_dorado: "#Y [target_new_waypoint.GetName] provides a clue for El Dorado#!"
 cartographer_cannot_read: "#Y The Cartographer's reading skills stall the [expedition|e]#!"
 gasp_its_a_trap: "#Y The [expedition|e] perishes from an ambush, it was a trap!#!"
 will_reduce_our_chances_to_uncovering_goal_tt: "This will reduce our chances of uncovering what we seek"

 d009_el_dorado_events.2.title: "The Landmarks Do Not Agree"
 d009_el_dorado_events.2.desc: "For once the map and the country almost agree. The carved idol stands on the ridge exactly where the parchment promised, down to the jut of its stone jaw. But the great fall of water that should thunder to its east instead spills to the west, and the twin peaks beyond rise in the wrong order altogether. Either the mapmaker was careless, or he drew a place he had only been told of, or the land itself has been described to us by people who would be glad to see us lost in it. [target_leader.GetName] turns the parchment over and over, as though the truth of it might be written on the back."
 d009_el_dorado_events.2.a: "The map is close enough. March on."
 d009_el_dorado_events.2.b: "We will not march blind on a liar's map."
 d009_el_dorado_events.2.b.tt: "#italic We cast the false map aside and trust our own eyes to the country ahead#!"
 the_expedition_doublebacks: "#Y The [expedition|e] doubles back over lost ground, and precious days slip away#!"
 press_on_regardless: "#Y We press on regardless, trusting the parchment over our own eyes#!"
 extort_locals: "#Y We wring supplies and directions from the locals by force#!"
 d009_el_dorado_events.3.title: "Exactly What We Wanted to Hear"
 d009_el_dorado_events.3.desc: "The captive is brought before [target_leader.GetName] trembling, and he tells us everything we hoped to hear: yes, the golden lord is real; yes, his court lies only a few days upriver; yes, the very rooftops are sheathed in gold that is stripped and remelted with each new spring. It is a magnificent account, delivered with the wide, eager eyes of a man who has understood exactly what his questioners crossed a continent to find. Our interpreter draws [target_leader.GetName] aside and murmurs a warning: a frightened man will swear the sky is green if he believes it will send armed strangers marching away from his own village. The difficulty is that every word of it is also precisely what we wished to be told."
 d009_el_dorado_events.3.a: "Press him for every detail."
 d009_el_dorado_events.3.b: "Reward honesty, not flattery."
 d009_el_dorado_events.3.c: "Wring the truth from him."
 guide_told_us_what_we_wished: "#Y The guide told us only what we wished to hear, and the trail leads nowhere#!"
 fear_loosens_the_guides_tongue: "#Y Fear loosens the guide's tongue, and his account rings true#!"
 forced_confession_breeds_hatred_tt: "Our [cultural_opinion|e] of [target_location.GetDominantCulture.GetName] will worsen"

 d009_el_dorado_events.4.title: "A Prize Worth the Delay"
 d009_el_dorado_events.4.desc: "The scouts return breathless: a day's march off our line, in a valley we were never meant to enter, sits a town wealthier than anything we have seen since the coast. Terraced fields, full storehouses, worked gold glinting at the throats of its people. It is not the city we were sent to find, and turning aside for it will cost us weeks the season can ill spare. Yet the men have already seen the glint, and a column that marches past gold it can see, chasing gold it has only heard of, is a column that starts to ask hard questions of the man who leads it."
 d009_el_dorado_events.4.a: "Divert to the rich settlement."
 d009_el_dorado_events.4.b: "Take only what they freely offer."
 d009_el_dorado_events.4.c: "Stay the course."
 d009_el_dorado_events.4.c.tt: "#italic We march past the gold we can see, keeping faith with the gold we were promised#!"
 a_modest_haul: "#Y The settlement yields a modest haul for our coffers#!"
 a_peaceful_exchange: "A peaceful exchange adds to what we will carry home"

 d009_el_dorado_events.5.title: "A Hoard Well Guarded"
 d009_el_dorado_events.5.desc: "Beyond the tree line stands a place the guides will not go near: a walled sanctuary, its gateway heavy with worked gold, its parapets lined with silent, watchful men. Whatever is kept within is plainly worth killing to defend, which in the reckoning of our officers makes it plainly worth taking. [target_leader.GetName] weighs the ranks of spearmen against the weight of those doors and finds the arithmetic grim. There is gold here for the taking, if we are willing to pay for it in a coin other than silver."
 d009_el_dorado_events.5.a: "Seize the hoard by force."
 d009_el_dorado_events.5.b: "Bargain warily for a share."
 d009_el_dorado_events.5.c: "It is too well guarded. Leave it."
 d009_el_dorado_events.5.c.tt: "#italic We weigh the walls against the plunder and leave the hoard to its keepers#!"
 the_hoard_is_seized: "#Y The hoard is seized, and its gold swells what we will carry home#!"
 a_wary_bargain: "A wary bargain wins us a share of the hoard"