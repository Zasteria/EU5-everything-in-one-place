 ga_col_50_bonus_tt: "Every [member|e] of $grand_alliance$ gains #Y +50%#! [ShowModifierTypeName('blockade_efficiency')] and #Y +10%#! [ShowModifierTypeName('navy_light_ship_power')]"
 ga_col_75_bonus_tt: "Every [member|e] of $grand_alliance$ gains #Y +10%#! [ShowModifierTypeName('naval_morale')] and #Y +10%#! [ShowModifierTypeName('naval_range_modifier')]"
