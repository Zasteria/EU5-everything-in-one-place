 golden_century_events.1.title: "The Golden Century of [ROOT.GetCountry.GetNameWithNoTooltip]"
 golden_century_events.1.desc.desc_spa: "The long [GetSituationByKey('battle_for_the_strait').GetName] is decided in our favor, and from it our [ROOT.GetCountry.GetFlavorRank] emerges as the foremost power of [ShowRegionName('iberia_region')]. Old rivals are humbled, the southern frontier is quiet at last, and under [target_ruler.GetName] our [ROOT.GetCountry.GetFlavorRank] turns from holy war to the harder labor of binding many territories into one.\n\nTwo horizons open before us at once. Across [ShowContinentName('europe')] our word now carries into councils and onto fields where once it went unheard, while beyond the ocean wait lands and souls no [ShowReligionGroupAdjective('christian')] power has yet claimed. The century before us will be measured by how much of both we make our own."
 golden_century_events.1.desc.desc_adu: "The [ShowLocationName('strait_of_gibraltar')] is held, the rival driven back, and for the first time in centuries the call to prayer rises over an [ShowRegionName('iberia_region')] gathered under one banner. The age of the petty kings is ended, and what the fall of [ShowLocationName('cordoba')] once scattered, [target_ruler.GetName] has made whole again.\n\nThe [ShowReligionGroupAdjective('christian')] kingdoms beyond the mountains, who long counted us a spent and fading power, must now reckon with our return. To the south the caravan roads and the open sea promise gold, learning, and dominion alike, while across [ShowContinentName('europe')] our name carries a weight it has not held in living memory. Let the years to come measure how far the light of [ROOT.GetCountry.GetName] can reach."
 golden_century_events.1.desc.historical_info_spa: "The Spanish Golden Age, the #italic Siglo de Oro#!, was the long season of imperial and cultural ascendancy that followed the union of Castile and Aragon under Isabella and Ferdinand in 1469. In 1492 the Catholic Monarchs took Granada, ending nearly eight centuries of Reconquista, and in that same year sent Columbus across the Atlantic.\n\nThe silver of the Indies, the dominance of the #italic tercios#! on the battlefields of Europe, and the inheritance of the Habsburg crowns made Spain the first truly global empire, one on which the sun was said never to set. That wealth funded a flowering of arts and letters, from Cervantes and Lope de Vega to Velázquez and El Greco, that gave the age its name."
 golden_century_events.1.desc.historical_info_adu: "Al-'Andalus was once the beating heart of the Muslim civilization across the Iberian Peninsula, founded after the conquest of 711 and raised to its height under the Caliphate of Córdoba, proclaimed by 'Abd al-Raḥmān III in 929. For a time Córdoba was the largest and most learned city in Western Europe, its libraries, mosques, and markets without rival north of the Mediterranean.\n\nIts scholars carried algebra, medicine, astronomy, and philosophy far beyond the Latin world, and the works of antiquity were preserved and passed on through Arabic translation. Though the caliphate fractured into the #italic ṭā'ifa#! kingdoms after 1031 and slowly gave way before the Christian advance, the memory of its learning and splendor endured as one of the high points of medieval civilization."
 golden_century_events.1.a: "A century of wealth and consolidation lies ahead."
 explain_golden_century_dominance_tt: "Enables [gc_european_dominance|e] and [gc_colonial_dominance|e]"
 explain_golden_century_antagonists_tt: "Enables [GetInternationalOrganizationType('grand_alliance').GetName] [international_organization|e]. It forms once either #Y Dominance#! value reaches #Y 25#!, propped by our [rival_enemies|e], [rivals|e], or countries with a fearful stance towards us, and its [members|e] grow stronger the higher our dominance climbs. It remains a defensive league until either measure passes #Y 75#!, when its members gain a unique [casus_belli|e] to make war upon us and, in victory, curb that dominance through its [peace_treaties|e]"
 explain_golden_century_flashpoints_tt: "[flashpoint|E] [events|e] may occur to us during this [situation|e]"

 golden_century_events.2.title: "Dominance in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.2.desc.desc_spa: "Despite the efforts of every rival and foe, we have reached the very pinnacle of our [GetSituationByKey('golden_century').GetName] upon the continent of [ShowContinentName('europe')]. No coalition can stand against us, no court dares ignore our wishes, and [target_ruler.GetName] is acknowledged, in deed if not in title, as the foremost sovereign in Christendom.\n\nThe [ShowUnitDefinitionName('a_tercio')] regiments are masters of the field, the imperial dignity lies within our grasp, and from [ShowRegionName('italy_region')] to the Low Countries the fate of [ShowContinentNameWithNoTooltip('europe')] turns upon our will. Let our enemies plot as they please; this age is ours."
 golden_century_events.2.desc.desc_adu: "At the height of our [GetSituationByKey('golden_century').GetName], we stand once more as the first power of [ShowRegionName('iberia_region')]. The power long written off as the last ember of a vanished age cannot now be ignored, and the [ShowReligionGroupAdjective('christian')] kingdoms beyond the mountains must treat with us or turn away in silence.\n\nOur fleets command the western sea, our garrisons hold every pass, and the name of [target_ruler.GetName] is spoken with the awe once granted to the caliphs of [ShowLocationName('cordoba')]. From the Pyrenees to the farthest shore of [ShowContinentName('europe')], none may raise a hand against the faithful without first answering to us. The glory of [ROOT.GetCountry.GetName] is restored, and none now living shall see it fade."
 golden_century_events.2.desc.historical_info_spa: "At the height of the sixteenth century, Habsburg Spain was the foremost power of Europe. Under Charles V and his son Philip II it commanded the wealthiest empire on earth and the most feared army of the age, the #italic tercios#!, whose pike-and-shot formations ruled the battlefields of the continent for over a century.\n\nVictory at Pavia in 1525 made the King of France a prisoner, and at Lepanto in 1571 a Spanish-led fleet broke Ottoman sea power in the Mediterranean. From Madrid the Spanish crown directed the affairs of Italy, the Low Countries, and the Holy Roman Empire, an age of supremacy later remembered as the #italic Pax Hispanica#!."
 golden_century_events.2.desc.historical_info_adu: "At its zenith under the Caliphate of Córdoba, al-'Andalus was the dominant power of the western Mediterranean. 'Abd ar-Raḥmān III, who assumed the title of caliph in 929, and his son al-Ḥakam II presided over a state whose armies, fleets, and riches outmatched every Christian kingdom of the peninsula.\n\nAfter the death of al-Ḥakam II, the chamberlain and regent Abū 'Āmir Muḥammad ibn Abī 'Āmir al-Ma'āfirī, nicknamed and widely known as al-Manṣūr, 'the Victorious', led the armies of Córdoba to campaigns, 'razzias', that terrorized almost at will Northern Iberia, sacking important cities such as Barcelona, León, and even Santiago de Compostela, in the year 997. Its gold dinars circulated across the Mediterranean, its envoys reached Byzantium and the Holy Roman emperors, and for a time no power in the West could match its wealth or its reach."
 golden_century_events.2.a: "Forever golden!"
 as_long_as_we_remain_at_100_european_dominance_universal_monarchy_modifier_tt: "As long as we remain at #Y 100#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName] [situation|e], we will enjoy the benefits of [ShowModifier('universal_monarchy_modifier')]"
 as_long_as_we_remain_at_100_european_dominance_renewed_faith_modifier_tt: "As long as we remain at #Y 100#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName] [situation|e], we will enjoy the benefits of [ShowModifier('renewed_faith_modifier')]"
 enables_partition_cb_tt: "Enables the [ShowCasusBelliName('cb_partition')] [casus_belli|e] as well as the [ShowPeaceTreatyTypeName('peace_partition')] [peace_treaty|e]"
 unlock_saqaliba_advances_units_building_tt: "Unlocks the [ShowAdvanceName('saqaliba_barracks_advance')] and the three ages of #italic aṣ-Ṣaqāliba al-Judud#! infantry [advances|e], our standing corps of slave-soldiers, fieldable while we hold #Y 100#! [gc_european_dominance|e]"

 golden_century_events.3.title: "Ascendancy in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.3.desc.desc_spa: "Our banners are now counted among the first of [ShowContinentName('europe')]. Where once our envoys waited in antechambers, [target_ruler.GetName] now sets the terms, and the courts of [ShowRegionName('italy_region')] and the [GetInternationalOrganizationType('hre').GetName] bend their designs around our own.\n\nTrue mastery of the continent still lies ahead, yet no rival doubts any longer that a new great power has risen in the West. Let us press the advantage while it is ours."
 golden_century_events.3.desc.desc_adu: "The tide that for centuries ran against us has turned. From the [ShowLocationName('strait_of_gibraltar')] to the northern passes, the strength of [ROOT.GetCountry.GetName] is felt across [ShowContinentName('europe')], and under [target_ruler.GetName] the [ShowReligionGroupAdjective('christian')] princes weigh their every move against our power.\n\nThe summit is not yet won, yet the faithful have not stood so tall in the West for generations. Let us carry the advance onward while fortune favors the bold."
 golden_century_events.3.desc.historical_info_spa: "In the opening decades of the sixteenth century, Spain rose with startling speed from a newly united kingdom into a first-rank European power. The campaigns of Gonzalo Fernández de Córdoba, #italic El Gran Capitán#!, wrested Naples from France between 1503 and 1504 and remade the art of war with disciplined infantry.\n\nFerdinand of Aragon's diplomacy and the marriage of the Catholic Monarchs wove Spain into the dynastic web of half of Europe. By the time Charles of Habsburg inherited the crowns in 1516, the foundations of a continental hegemony were already laid."
 golden_century_events.3.desc.historical_info_adu: "After the fall of the Caliphate of Córdoba, al-'Andalus was twice rescued from the advancing Christian kingdoms by Berber empires from the south. The Almoravids crushed Alfonso VI at Sagrajas in 1086, halting the Reconquista for a generation, and the Almohads who followed broke the Castilians again at Alarcos in 1195.\n\nUnder these dynasties al-'Andalus was reunified and its frontiers held firm, and cities such as Córdoba and Seville flourished anew as centers of learning and trade before the long Christian advance resumed."
 golden_century_events.3.a: "The summit is within our reach."
 as_long_as_we_remain_at_75_european_dominance_expanded_cabinet_jurisdiction_modifier_tt: "As long as we remain at #Y 75#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('expanded_cabinet_jurisdiction_modifier')]"
 enables_enforce_conformity_action_tt: "Unlocks the [ShowGenericActionName('spa_enforce_conformity')] [action|e], bringing [assimilation|e] and [conversion|e] to the population of a chosen [area|e] in [ShowContinentName('europe')]"
 as_long_as_we_remain_at_75_european_dominance_sword_of_the_west_modifier_tt: "As long as we remain at #Y 75#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('sword_of_the_west_modifier')]"
 enables_proclaim_fatwa_action_tt: "Unlocks the [ShowGenericActionName('adu_proclaim_a_fatwa')] [action|e], by which our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] lend the authority of the faith to a chosen aspect of our rule"

