 grand_alliance_leader: "$grand_alliance$ Leader"
 grand_alliance_leader_desc: "The mightiest member of the $grand_alliance$, reassessed each year. Leadership may pass to another member as fortunes shift."

 spa_increase_capital_market_demands: "Increase Capital Market Demands"
 spa_increase_capital_market_demands_desc: "The wealth of our age has made our capital the envy of the world. Choose a good traded in its market and proclaim it the fashion of the court, stoking a surge of demand that will enrich every merchant who carries it to our shores."
 gc_increase_market_demand_select_good: "Choose a Good to Favor"
 gc_increase_market_demand_no_good: "@trigger_no!No suitable good is traded in the market of our [capital|e]"
 gc_increase_market_demand_tt: "We will choose a good traded in the market of our [capital|e] and stoke a lasting surge of demand for it there. The added demand scales with the population of our [capital] and lasts #Y 10#! years, and no other market is touched, so the good's price rises to the profit of all who bring it to our shores"

 golden_century_events.22.title: "The Fashion of the Court"
 golden_century_events.22.desc: "The riches of a golden age have swollen the appetites of [ROOT.GetCountry.GetCapital.GetName]. Its nobles, its prelates, and its wealthy burghers vie with one another in display, and their agents scour the markets for [target_good.GetName] to grace their halls and their tables.\n\nUnder [target_ruler.GetName] we may lean into this hunger and proclaim [target_good.GetNameWithNoTooltip] the fashion of the court, so that demand for it in our capital swells far beyond what our own people would ever require. Every merchant who carries it to our shores will profit, and through our tariffs and our own trade, so shall we."
 golden_century_events.22.a: "Let the court set the fashion."
 gc_increase_market_demand_result_tt: "Demand for [target_good.GetName] in the market of [ROOT.GetCountry.GetCapital.GetName] surges for the next #Y 10#! years, lifting its price to the profit of all who sell it"

 adu_charter_saharan_trade_house: "Charter a Saharan Trade House"
 adu_charter_saharan_trade_house_desc: "The gold roads of the Sahara are the lifeblood of our prosperity. Choose an [urban_location|e] of our realm and charter a great Saharan Trade House there, a hub of caravans and coin that will draw the wealth of the desert trade into our hands."
 adu_charter_saharan_trade_house_select_market: "Choose an [urban_location|e]"
 adu_charter_saharan_trade_house_no_market: "@trigger_no!We hold no [urban_location|e] fit to host a Saharan Trade House"
 adu_charter_saharan_trade_house_tt: "We will charter a [ShowBuildingTypeName('saharan_trade_house')] in the chosen [urban_location|e], a powerful hub of the caravan trade"

 golden_century_events.23.title: "The [ShowBuildingTypeNameWithNoTooltip('saharan_trade_house')]"
 golden_century_events.23.desc: "Where the caravan roads meet, coin changes hands and fortunes are made in [ShowGoodsName('salt')], [ShowGoodsName('goods_gold')], and [ShowGoodsName('cloth')]. At [target.GetName] we will raise a great trade house to command that commerce, its warehouses and counting rooms drawing the wealth of the desert routes into the coffers of [actor.GetName].\n\nMerchants from across the [ShowRegionName('sahel_region')] and the [ShowRegionName('maghreb_region')] will gather beneath its roof, and through it the riches of two shores will flow to our benefit."
 golden_century_events.23.a: "Let the caravans come."

 golden_century_events.17.title: "The Orders in the [ShowSituationNameWithNoTooltip('golden_century')]"
 golden_century_events.17.desc: "Our century has arrived, and it does not look much like the one the military orders were built for.\n\nThe work of the age is in [ShowAreaName('flanders_area')], in [ShowLocationName('milano')], and across the ocean: fleets, banks, and #italic tercios#! paid in silver. The orders hold castles facing a frontier that has not existed within living memory, and their brothers, who are still the finest heavy horse in the [ShowReligionAdjective('catholic')] world, spend their seasons collecting rents and disputing precedence.\n\nThey are an asset the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has stopped using."
 golden_century_events.17.a: "Give them the work of our [ROOT.GetCountry.GetFlavorRank]."
 golden_century_events.17.b: "Pension them into a comfortable retirement."
 golden_century_events.17.c: "Leave them to their rents."
 gc_orders_given_new_purpose_tt: "$bfts_orders_given_new_purpose_tt$"

 golden_century_events.18.title: "Idle Lances"
 golden_century_events.18.desc: "Two commanderies have come to blows over a boundary, a mill, and a two-hundred-year-old insult, and the affair has escalated further than anyone intended. There are dead men on both sides and both Masters have written to us first, each confident of being in the right.\n\nThis is what a military order does when there is no war. The brothers are still armed, still exempt from the ordinary courts, and still answerable to nobody in our [ROOT.GetCountry.GetFlavorRank] but ourselves."
 golden_century_events.18.a: "Discipline them both, publicly."
 golden_century_events.18.b: "Let them settle it among themselves."

 golden_century_events.19.title: "The Orders Overseas"
 golden_century_events.19.desc: "A petition has come from the Masters, and it is an ambitious one. They wish to plant commanderies in the Indies, to take up the same work there that they once did on the Moorish frontier, and to hold the new marches as they held the old.\n\nIt is either the salvation of an institution that has run out of frontier, or the export of a problem we have not solved at home."
 golden_century_events.19.desc_expected: "We told them to look to the ocean, and they have. The Masters have taken the instruction with more enthusiasm than we perhaps intended.\n\nThey have chaplains aboard the fleets, brothers in the ports, and now a formal petition for commanderies in the Indies, drafted by lawyers who have clearly been at it for some time. The orders found their new frontier the moment we pointed at one."
 golden_century_events.19.a: "Charter them for the Indies."
 golden_century_events.19.b: "The Indies belong to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], not the [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]."

 golden_century_events.24.title: "Presence in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.24.desc.desc_spa: "For too long the courts beyond the Pyrenees settled the affairs of [ShowContinentName('europe')] as though nothing of consequence lay south of them. They are learning better. Our envoys, once left waiting in antechambers, now find the doors opened and the seats cushioned, and under [target_ruler.GetName] the marriages and treaties of our [ROOT.GetCountry.GetFlavorRank] are studied in every chancellery that knows its business.\n\nWe are not yet feared, and only barely courted, but we are no longer ignored, and that is how every great power begins. Let the old thrones enjoy their precedence while it lasts."
 golden_century_events.24.desc.desc_adu: "The [ShowReligionGroupAdjective('christian')] princes had long since written us into their chronicles as a chapter concluded. Yet here are their envoys at the gates of [ROOT.GetCountry.GetCapital.GetName], bearing gifts and careful compliments, suddenly curious what [target_ruler.GetName] intends. A power they buried keeps interrupting the funeral.\n\nWe hold no mastery yet, only a seat regained at a table we once headed. But the faithful have returned to the reckoning of [ShowContinentName('europe')], and this time we do not mean to leave it."
 golden_century_events.24.desc.historical_info_spa: "The union of Castile and Aragon announced itself to Europe less by arms than by weddings. Ferdinand and Isabella married their children into Portugal, Habsburg Burgundy, and Tudor England within little more than a decade, and the double marriages of 1496 and 1497 bound Spain into the dynastic web of half the continent. Long before the #italic tercios#! were feared, the chancelleries of Europe had learned to count the Spanish crowns in every calculation."
 golden_century_events.24.desc.historical_info_adu: "Under 'Abd al-Raḥmān II in the ninth century, the Emirate of Córdoba entered the reckoning of the great powers. The Byzantine emperor Theophilos sent an embassy seeking its friendship against the Abbasids in 840, and the court of Córdoba answered in kind, trading envoys and gifts with empires that had once dismissed al-'Andalus as a distant rebel province."
 golden_century_events.24.a: "We have arrived."
 as_long_as_we_remain_at_25_european_dominance_rising_iberian_power_modifier_tt: "As long as we remain at #Y 25#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('rising_iberian_power_modifier')]"
 as_long_as_we_remain_at_25_european_dominance_restoration_of_al_andalus_modifier_tt: "As long as we remain at #Y 25#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('restoration_of_al_andalus_modifier')]"
 enables_edict_of_expulsion_action_tt: "Unlocks the [ShowGenericActionName('spa_edict_expulsion')] [action|e], by which a faith we will not suffer is driven from our lands"
 enables_restore_caliphate_cb_taifa_tt: "Unlocks the [ShowCasusBelliName('cb_restore_ummayad_caliphate')] [casus_belli|e] and the Ṭā'ifa [subject|e] type"

 golden_century_events.25.title: "Presence Beyond the Horizon"
 golden_century_events.25.desc.desc_spa: "The first ships have come home riding low in the water, and [ROOT.GetCountry.GetCapital.GetName] has discovered a new appetite. Sugar, dyes, and stranger things pass across the counting tables, every returning sail is met at the quay by men with contracts, and under [target_ruler.GetName] our [ROOT.GetCountry.GetFlavorRank] draws real wealth from shores most of our subjects cannot point to on a map.\n\nIt is a trickle beside what it may become. But merchants can smell a turning tide before any admiral, and they are already building bigger warehouses."
 golden_century_events.25.desc.desc_adu: "The caravans come north again. Across the sands the old roads have reopened, and with them comes the gold of the [ShowRegionName('sahel_region')], salt passing south in exchange, and the markets of our [ROOT.GetCountry.GetFlavorRank] growing loud with the business of the desert trade.\n\nOur fathers knew this wealth and let it slip through their fingers. Under [target_ruler.GetName], we mean to hold it: the wells garrisoned, the routes watched, and every ounce of gold that crosses the desert paying its due in our markets before it goes anywhere else."
 golden_century_events.25.desc.historical_info_spa: "Within a decade of Columbus's landfall, the Spanish crown moved to make the ocean a matter of administration. The Casa de Contratación, founded at Seville in 1503, licensed every ship, registered every cargo, and taxed every return from the Indies, turning scattered ventures into a royal enterprise almost before the colonies themselves amounted to anything."
 golden_century_events.25.desc.historical_info_adu: "The wealth of the western Sudan reached the Mediterranean through desert ports such as Sijilmasa, where the caravans of the trans-Saharan trade were fitted out and taxed. When the Almoravids took Sijilmasa and Awdaghust in the mid-eleventh century, they held both ends of the western gold road, and the bullion of the Sahel flowed north under a single power."
 golden_century_events.25.a: "Fortune lies beyond the horizon."
 as_long_as_we_remain_at_25_colonial_dominance_market_dominance_modifier_tt: "As long as we remain at #Y 25#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('market_dominance_modifier')]"
 as_long_as_we_remain_at_25_colonial_dominance_wealth_sahel_modifier_tt: "As long as we remain at #Y 25#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('wealth_sahel_modifier')]"
 enables_increase_capital_market_demands_action_tt: "Unlocks the [ShowGenericActionName('spa_increase_capital_market_demands')] [action|e], drawing chosen [goods|e] toward the [market|e] of our capital"
 enables_charter_saharan_trade_house_action_tt: "Unlocks the [ShowGenericActionName('adu_charter_saharan_trade_house')] [action|e], chartering a great hub of the desert trade in one of our [urban_locations|e]"

 golden_century_events.26.title: "Influence Beyond the Horizon"
 golden_century_events.26.desc.desc_spa: "What began as a road for adventurers has become a road for families. Every fleet now carries settlers alongside soldiers, and the far shore fills with farms, parishes, and children who will never lay eyes on [ROOT.GetCountry.GetCapital.GetName]. Under [target_ruler.GetName] the crown no longer merely claims the distant lands; it peoples them.\n\nA claim on a map can be argued with. A thousand households cannot. Let the decrees be drafted and the passages granted, for every family we send across the water is a root sunk too deep for any rival to pull."
 golden_century_events.26.desc.desc_adu: "The gold road has become an institution. The caravans leave on schedule and return on schedule, the judges of the oasis towns settle the merchants' disputes, and the counting houses of [ROOT.GetCountry.GetCapital.GetName] plan around the desert convoys as confidently as farmers plan around harvests.\n\nWealth that arrives once is luck; wealth that arrives every season is power. Under [target_ruler.GetName] the desert has become our second sea, and we are its only fleet."
 golden_century_events.26.desc.historical_info_spa: "Spanish emigration to the Indies was a licensed and registered affair, channeled through Seville and encouraged by royal grants of land and exemptions to those willing to cross. Through instruments such as the #italic cédulas de población#! the Crown turned conquest into settlement, and by the middle of the sixteenth century tens of thousands of Castilians had made the crossing."
 golden_century_events.26.desc.historical_info_adu: "The gold of the Sahel underwrote the coinage of the Muslim West. The Almoravid dinar, struck from Saharan gold, was so trusted that the Christian kingdoms of Iberia imitated it outright; their #italic maravedí#! took both its standard and its name from the #italic murābiṭūn#! who minted the original."
 golden_century_events.26.a: "Let the golden tide run."
 as_long_as_we_remain_at_50_colonial_dominance_migratory_waves_modifier_tt: "As long as we remain at #Y 50#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('migratory_waves_modifier')]"
 as_long_as_we_remain_at_50_colonial_dominance_golden_road_modifier_tt: "As long as we remain at #Y 50#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('golden_road_modifier')]"
 enables_issue_royal_decree_action_tt: "Unlocks the [ShowGenericActionName('spa_issue_royal_decree')] [action|e], peopling our distant holdings by royal charter"
 enables_gold_caravan_expedition_action_tt: "Unlocks the [ShowGenericActionName('adu_dispatch_gold_caravan')] [action|e], sending a caravan south for the gold of the [ShowRegionName('sahel_region')]"

 golden_century_events.27.title: "Ascendancy Beyond the Horizon"
 golden_century_events.27.desc.desc_spa: "The far dominions have begun to answer in our own tongue. Their cities are laid out on our pattern, their courts keep our law, and their harbors fill on command with fleets bearing tribute home. What was once a frontier is becoming a mirror, and under [target_ruler.GetName] it reflects [ROOT.GetCountry.GetName].\n\nDistance, the old enemy of every empire, is losing its argument with us. When the far shore worships, judges, and pays as we do, it has ceased to be foreign; it has merely become far away."
 golden_century_events.27.desc.desc_adu: "The faith travels with the caravans, and the law follows the faith. In towns our grandfathers knew only as names, prayers are now said as we say them, judges sit under our appointment, and the rulers of the far lands come to us for their legitimacy. What the sword never conquered, the creed is quietly annexing.\n\nUnder [target_ruler.GetName] the #italic da'wa#! has become an arm of the state as surely as any army, and a cheaper one besides, for the converted garrison themselves."
 golden_century_events.27.desc.historical_info_spa: "By the middle of the sixteenth century, the Indies were governed, not merely held. The viceroyalties of New Spain and Peru, established in 1535 and 1542, gave the Spanish crown courts, councils, and bishops an ocean away from Castile, and the yearly treasure fleets bound the whole edifice to Seville with a chain of silver."
 golden_century_events.27.desc.historical_info_adu: "Islam crossed the Sahara in the ledgers of merchants long before any army followed. The faith took root in the trading towns along the caravan routes of the Sahel. Rulers, such as those of Takrur, accepted it as early as the eleventh century, and with the creed came its scholars and judges, binding the lands of the gold trade to the Muslim West by law and learning."
 golden_century_events.27.a: "Ours, in law and in spirit."
 as_long_as_we_remain_at_75_colonial_dominance_elevated_cultural_identity_modifier_tt: "As long as we remain at #Y 75#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('elevated_cultural_identity_modifier')]"
 as_long_as_we_remain_at_75_colonial_dominance_dawa_colonial_administration_modifier_tt: "As long as we remain at #Y 75#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will unlock the [ShowBureaucracyTypeName('dawa_bureaucracy')] [bureaucracy|e] and enjoy the benefits of [ShowModifier('dawa_colonial_administration_modifier')]"
 enables_demand_tribute_fleets_action_tt: "Unlocks the [ShowGenericActionName('spa_demand_tribute_fleets')] [action|e], commanding our subjects to send their wealth home under sail"
 enables_build_qadi_office_action_tt: "Unlocks the [ShowGenericActionName('adu_build_qadi_office')] [action|e], seating a judge of the holy law in the capital of a [subject|e]"

 golden_century_events.28.title: "Dominance Beyond the Horizon"
 golden_century_events.28.desc.desc_spa: "There is no longer a horizon we do not own part of. The distant seas are highways of our commerce, the colonies of other crowns exist only through our benevolence, and when [target_ruler.GetName] wishes to possess a harbor, a strait, or an island, the only remaining question is the price of its transfer.\n\nOur grandfathers begged maps from foreign pilots. Our grandchildren will find our name already written on whatever shore they reach. Between those two generations stands this one, which did the work."
 golden_century_events.28.desc.desc_adu: "From the far side of the desert to the western sea, the distant trade answers to one master. No caravan moves and no sail crosses but that our share is counted first, and the peoples of the far lands, once strangers, now pray, trade, and muster as our own.\n\nThe [ShowReligionGroupAdjective('christian')] kings hold their coasts by our leave and know it. Under [target_ruler.GetName], the world beyond the horizon has stopped being a frontier at all; it is simply the rest of our [ROOT.GetCountry.GetFlavorRank]."
 golden_century_events.28.desc.historical_info_spa: "By the second half of the sixteenth century, the Spanish empire was a global machine. The silver mountain of Potosí, opened in 1545, poured out the coin of the world, and from 1565 the Manila galleons carried it across the Pacific to trade for the silks of Asia. It was said, and not as flattery, that the sun never set on the dominions of the King of Spain."
 golden_century_events.28.desc.historical_info_adu: "At its height, the Almohad empire commanded the western Mediterranean from both shores. Its fleet was reckoned the strongest of its day; when Saladin sought help against the Crusaders in 1189, it was to the Almohad caliph that he wrote, asking the ships of the Muslim West to close the sea against the Franks."
 golden_century_events.28.a: "The horizon is ours."
 as_long_as_we_remain_at_100_colonial_dominance_global_colonial_dominance_modifier_tt: "As long as we remain at #Y 100#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('global_colonial_dominance_modifier')]"
 as_long_as_we_remain_at_100_colonial_dominance_mastery_of_the_sudan_modifier_tt: "As long as we remain at #Y 100#! [gc_colonial_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('mastery_of_the_sudan_modifier')]"
 enables_seize_colony_action_tt: "Unlocks the [ShowGenericActionName('spa_seize_colony')] [action|e], by which the colony of another power may be claimed for our own"
 enables_integrate_natives_action_tt: "Unlocks the [ShowGenericActionName('adu_integrate_natives')] [action|e], binding the peoples of the far lands into our own"

