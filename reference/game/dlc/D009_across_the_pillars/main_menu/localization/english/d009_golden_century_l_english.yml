 golden_century_events.4.title: "One Faith & Culture"
 golden_century_events.4.desc: "It is time for our administrators in [target.GetName] to seize the reins and promote a decree of conformity. Indeed, according to our advisors, a push towards uniformity is vital if we wish to be a land of one faith and one culture. The houses of worship of those who do not share the faith of our [ROOT.GetCountry.GetFlavorRank] are closed, and in the years to come, their children will be raised as our own.\n\nThe work is harsh, and its sting will linger, but a people of one creed and one tradition is a people more easily ruled."
 golden_century_events.4.a: "It is for the good of the faith."
 enforce_conformity_result_tt: "Every [location|e] in [target.GetName] will benefit from [ShowModifier('enforce_conformity_modifier')] for #Y 10#! years"
 explain_enforce_conformity_tt: "The [locations|e] of the selected [area|e] will benefit from the [ShowModifier('enforce_conformity_modifier')] [modifier|e] for #Y 10#! years"

 golden_century_events.5.title: "Proclaiming a Fatwā"
 golden_century_events.5.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] gather at the summons of [target_ruler.GetName], ready to lend the authority of the faith to the work of our government. On which matter shall they pronounce?\n\nWhatever they decree, the faithful will heed, for a ruling handed down in the name of the faith carries a weight no mere edict can match."
 golden_century_events.5.desc.historical_info: "A #italic fatwā#! is a formal legal opinion issued by a qualified Muslim jurist, a #italic muftī#!, in answer to a question of religious law. It does not bind like a court verdict, yet a ruling from a respected scholar carried great moral weight, and rulers often sought one to legitimize their decisions. In the fifteenth century the Ottoman sultans raised the office of #italic şeyhülislam#!, the chief jurist of the empire, to lasting prominence, and scholars such as Molla Hüsrev and Molla Gürani lent religious sanction to the conquests of Mehmed II. In the Muslim West, the Maghrebi jurist Ahmad al-Wansharīsī issued his celebrated ruling that the Muslims of a fallen al-'Andalus were bound to emigrate rather than live under Christian rule."
 golden_century_events.5.a: "Let them sanctify the work of our administration."
 golden_century_events.5.b: "Let them bless our dealings with other powers."
 golden_century_events.5.c: "Let them proclaim the struggle against the unbeliever."

 golden_century_events.6.title: "Influence in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.6.desc.desc_spa: "No longer confined to the margins, our [ROOT.GetCountry.GetFlavorRank] now sits among the powers whose word shapes [ShowContinentName('europe')]. Our companies march into [ShowRegionName('italy_region')] as equals to its proudest houses, and under [target_ruler.GetName] our levies answer the muster faster than our rivals can field their own.\n\nThere is further still to climb, but the day is past when our neighbors could overlook us. Let them learn what it is to reckon with us."
 golden_century_events.6.desc.desc_adu: "The banners of the faithful gather as they have not in generations. Across [ShowContinentName('europe')] our name is spoken with wary respect, and from every frontier the volunteers of the faith ride to answer the summons of [target_ruler.GetName].\n\nThe summit is still distant, yet the [ShowReligionGroupAdjective('christian')] princes no longer speak of us as a relic to be swept aside. The holy struggle has found its second wind."
 golden_century_events.6.desc.historical_info_spa: "The long war for Granada, completed in 1492, forged Castile and Aragon into a single military power. The Catholic Monarchs raised standing companies and a crown-funded militia under the #italic Santa Hermandad#!, replacing the unreliable feudal levy with troops the crown could march at will.\n\nThis hardened army, idle once Granada had fallen, was soon turned outward across the Mediterranean. Within a decade Spanish infantry had crossed into Italy, laying the groundwork for the formations that would dominate Europe's battlefields for a century."
 golden_century_events.6.desc.historical_info_adu: "The #italic ḡuzāt#! were volunteers who crossed from North Africa to wage holy war on the Christian frontier of al-'Andalus. Organized under a #italic shaykh al-ḡuzāt#!, these warbands of the faith were a mainstay of Nasrid Granada's defense, drawing fighters from across the Maghreb who sought merit in the struggle.\n\nThough turbulent and hard for any ruler to bridle, the ḡuzāt embodied the ideal of #italic jihād#! on the Iberian frontier, and a sultan able to rally them commanded a zeal no paid soldier could match."
 golden_century_events.6.a: "Our ascent has only begun."
 as_long_as_we_remain_at_50_european_dominance_european_aspirations_modifier_tt: "As long as we remain at #Y 50#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('european_aspirations_modifier')]"
 enables_emergency_conscription_tt: "Unlocks the #Y Emergency Conscription#! [parliament|e] action, calling up a surge of [manpower|e] in time of war"
 as_long_as_we_remain_at_50_european_dominance_holy_struggle_modifier_tt: "As long as we remain at #Y 50#! [gc_european_dominance|e] for the rest of the [GetSituationByKey('golden_century').GetName], we will enjoy the benefits of [ShowModifier('holy_struggle_modifier')]"
 enables_muster_the_ghuzat_tt: "Unlocks the [ShowGenericActionName('adu_muster_the_ghuzat')] [action|e], summoning volunteers of the faith from across the [ShowReligionGroupAdjective('muslim')] world to swell our armies"

 adu_muster_the_ghuzat: "Muster the Ḡuzāt"
 adu_proclaim_a_fatwa_desc: "Summon our religious scholars to hand down a fatwā, lending the sanction of the faith to one aspect of our governance: its administration, its diplomacy, or its wars."
 adu_muster_the_ghuzat_desc: "Send out the call for the ḡuzāt, and the volunteers of the faith will cross from the nearest [ShowReligionGroupAdjective('muslim')] lands to take up arms in our service."
 spa_enforce_conformity_desc: "Choose an area we hold in [ShowContinentName('europe')] and bend its people to one faith and one culture, converting and assimilating those who do not yet share our own."
 golden_century_events.7.title: "The Ḡuzāt Answer the Call"
 golden_century_events.7.desc: "Word of our holy struggle carries across the lands of the faithful, and the #italic ḡuzāt#! answer. From the nearest [ShowReligionGroupAdjective('muslim')] lands within our reach, zealous volunteers slip across the frontier to take up arms under [target_ruler.GetName], swelling our soldiery with men who fight not for pay but for paradise.\n\nLet the unbelievers tremble. The frontier has found its warriors once more."
 golden_century_events.7.a: "Let them find paradise in our service."
 missed_reward_ghuzat_mujahidin_tt: "If we had the [ShowBureaucracyTypeName('diwan_al_jund_bureaucracy')] [bureaucracy|e] enabled, [target_ghazi_general.GetName] would have joined our ranks as well"

 plan_partition_campaign: "Plan Partition Campaign"
 plan_partition_campaign_desc: "Our foes have consolidated their land too well to our liking. It is evident that their attempts at securing power will inevitably lead to a united front against our people, a sure threat to our continued prosperity. We cannot let such blatant exhibitions of strength go unanswered!"
 selected_country_target_cb_tt: "We will gain the [ShowCasusBelliName('cb_partition')] [casus_belli|e] against the target [country|e]. This [casus_belli|e] grants access to the [ShowPeaceTreatyTypeName('peace_partition')] [peace_treaty|e]"
 plan_partition_campaign_select_rival_or_enemy: "Choose a [rival|e] or [enemy|e] to Partition"
 no_neighbor_enemies_rivals_available: "@trigger_no!We have no neighboring [rival|e] or [enemy|e] to partition"

 invoke_ummayad_legacy: "Invoke the Umayyad Legacy"
 invoke_ummayad_legacy_desc: "The Umayyads who once ruled from [ShowLocationName('cordoba')] left a legacy that is ours to claim. We should focus on any of the countries seated within the lands of the [ShowScriptedGeographyName('umayyad_caliphate_geography')], and we shall press the ancient right to restore them to our rule by the sword."
 selected_country_ummayad_cb_tt: "We will gain the [ShowCasusBelliName('cb_restore_ummayad_caliphate')] [casus_belli|e] against the target [country|e]"
 invoke_ummayad_legacy_select_country: "Choose a [country|e] Holding Umayyad Lands"
 invoke_ummayad_legacy_no_country_available: "@trigger_no!No [country|e] is seated within the lands of the [ShowScriptedGeographyName('umayyad_caliphate_geography')]"

 spa_patronize_golden_century: "Patronize the Golden Century"
 spa_patronize_golden_century_desc: "We patronize our artists and spend freely on splendor, funding the painters, poets, and architects of our age. This investment develops our peoples' culture, and writes our name in golden script upon the annals of history."

 golden_century_events.8.title: "Patrons of a Golden Age"
 golden_century_events.8.desc: "The wealth of our age draws masters from every corner of [ShowContinentName('europe')]. [target_location.GetName] has come to be a cultural hub for painters and sculptors, architects and poets, each seeking the favor of [target_ruler.GetName] and a place in the brilliance of our century.\n\nA word from us and the workshops fill with eager artists ready to immortalize our splendor. What we choose to fund now will outlast every treaty and every war, for long after our armies are forgotten, this is the affluence by which the age will remember us."
 golden_century_events.8.a: "Let there be art!"
 target_character_serves_in_court_tt: "[target_character.GetName] takes a place at our court as a master of [target_character.GetHerHis] craft"
 artist_appears_in_court_tt: "A master [artist|e] takes a place at our court"
 artist_expands_royal_quarters: "A magnificent new wing rises upon the royal residence, and word of its splendor carries our renown across the courts of [ShowContinentNameWithNoTooltip('europe')]"
 artist_drafts_traditional_art: "Our masters set down the motifs and forms of our tradition for the generations to come, enriching the inheritance we leave behind"
 artist_furthers_our_technological_understanding_tt: "[target_character.GetShortNameWithNoTooltip] turns patronage into discovery, advancing the learning of our [ROOT.GetCountry.GetFlavorRank]"

 golden_century_events.9.title: "Expulsion of the [ShowCultureNameWithNoTooltip('andalusi')] of [target.GetNameWithNoTooltip]"
 golden_century_events.9.desc: "The [ShowCultureName('andalusi')] of [target.GetName] have always stood apart from us, holding to a faith and a culture that are not our own. However long they dwell among us, we doubt that their hearts will ever be ours.\n\nOur patience is spent. We will gather them from their homes and see them carried to the harbors, then put aboard ships bound for [target_province_destination.GetName], where those who share their creed may receive them.\n\nThe houses and fields they leave behind will not stand empty for long. Our own people will settle the lands their fathers once worked, and what was theirs will pass into surer hands."
 golden_century_events.9.desc.historical_info: "Between 1609 and 1614, King Philip III of Spain ordered the expulsion of the Moriscos, the descendants of Iberia's Muslims who had been compelled a century earlier to accept Christianity. Long suspected of secret apostasy and of intriguing with the Ottomans and the corsairs of Barbary, some three hundred thousand were driven from their homes.\n\nMost crossed into the Maghreb, yet many traveled farther east to Ottoman lands, settling in Anatolia, the Levant, and the cities of the Balkans, where the Sultan's government took them in. Their departure robbed eastern Spain of skilled farmers and artisans, and several of its regions never fully recovered."
 golden_century_events.9.a: "Their exodus is for the best."
 spa_edict_expulsion: "Issue an Edict of Expulsion"
 spa_edict_expulsion_desc: "Choose a province we hold and drive its [ShowCultureName('andalusi')] population into exile overseas, opening the estates they leave behind to settlers of our own."
 select_expulsion_no_province: "@trigger_no!No available [province|e] with substantial $andalusi$ population"
 select_province_removes_andalusi_tt: "A [migration|e] expulsion of [ShowCultureName('andalusi')] [pops|e] will commence in the selected [province|e]"
 select_province_to_evict_pops_from: "Select a [province|e] to evict [pops|e] from"

 spa_seize_colony: "Seize a Colony"
 spa_seize_colony_desc: "The riches of the New World need not be gained by the spade alone. We shall choose a disloyal colony of a rival power within our reach and tempt it to forsake its distant masters for our crown, gaining a wealthy dominion at a stroke — and earning the lasting enmity of the overlord we rob."
 select_colonial_subject_to_seize: "Choose a Disloyal [colony|e] to Seize"
 no_available_colonial_subjects_to_seize: "@trigger_no!No disloyal colonial [subject|e] of a rival power lies within our reach"
 selected_subject_receives_offer_to_defect_tt: "The selected [ShowSubjectTypeName('colonial_nation')] will be asked to become our [subject|e]. Should they accept, this will greatly reduce our relations with their current [overlord|e] and grant that [overlord] a [casus_belli|e] to reclaim them"

 golden_century_events.10.title: "An Offer of Allegiance"
 golden_century_events.10.desc: "Envoys of [seizing_country.GetName] have slipped into our harbors with a proposal whispered rather than proclaimed. Our distant masters in [target_overlord.GetName] have grown careless of our needs and deaf to our grievances, while [seizing_country.GetNameWithNoTooltip] would welcome us as their own and reward our loyalty in kind.\n\nThe choice before [target_ruler.GetName] is no small one. To accept is to cast off one overlord for another and bring the wrath of [target_overlord.GetNameWithNoTooltip] down upon us; to refuse is to prove our fidelity and bind ourselves the closer to the crown we already serve."
 golden_century_events.10.a: "Let us cast our lot with [seizing_country.GetNameWithNoTooltip]."
 golden_century_events.10.a.alt: "Let us cast our lot with them."
 golden_century_events.10.b: "Our loyalty is not for sale."

 adu_integrate_natives: "Integrate Colonial Charter"
 adu_integrate_natives_desc: "Rather than put the natives to the sword, we will treat with them, learn their land through their guidance, and weave them into the fabric of our dominion overseas."
 adu_integrate_natives_tt: "We will plant a [colonial_charter|e] in the chosen [province|e] and settle its unclaimed [locations|e], then choose how to treat the natives who dwell there"

 golden_century_events.11.title: "The Horizon Beyond [target.GetNameWithNoTooltip]"
 golden_century_events.11.desc: "We have managed to make peace with the natives in [target.GetName], and through their help we have not only mapped the entire province but also established many colonies across its domain. Now our advisors are divided over what should follow.\n\nSome support expanding the colonies with fresh migrants from the homeland. Others see only profit in the natives themselves, and would put them in chains to labor in our markets back home. A cautious few would leave the locals in peace and let our new outpost grow in its own time."
 golden_century_events.11.a: "Decree the new migratory waves."
 golden_century_events.11.b: "Resettle them as laborers back home."
 golden_century_events.11.c: "Let the province develop naturally."
 all_those_slaves_go_back_home: "[ShowPopTypeName('slaves')] created from this [action|e] will be resettled around our [capital|e] in [ROOT.GetCountry.GetCapital.GetProvince.GetName]"

 spa_demand_tribute_fleets: "Demand Tribute Fleets"
 spa_demand_tribute_fleets_desc: "Choose one of our loyal colonies across the ocean and call its wealth home. Laden with silver and the bounty of its mines and fields, a tribute fleet will sail for our harbors and fill our coffers when it makes port."
 select_colonial_subject: "Choose a Loyal [colony|e]"
 no_loyal_colonial_subject: "@trigger_no!We hold no loyal colonial [subject|e]"
 spa_demand_tribute_fleets_tt: "The selected loyal [ShowSubjectTypeName('colonial_nation')] will be called upon to send a tribute fleet home to our harbors of either [gold|e], precious metals or [pops|e]"

 adu_build_qadi_office: "Construct a Qāḍī Office"
 adu_build_qadi_office_desc: "It is the utmost honor for our subject realms to become the host of a [ShowBuildingTypeName('qadi_office')]. Its judge will administer the holy law in our name, settling the disputes of the people and binding their ruler closer to our affairs."
 no_available_colonial_subject: "@trigger_no!We hold no [subject|e] whose capital does NOT have a [ShowBuildingTypeNameWithNoTooltip('qadi_office')]"
 adu_build_qadi_office_tt: "We will construct a [ShowBuildingTypeName('qadi_office')] in the [capital|e] of the chosen [subject|e], setting its judge over the holy law and binding the realm closer to our rule"
 if_we_had_qadi_al_jamaa_bureaucracy_tt: "If we had the [ShowBureaucracyTypeName('qadi_al_jamaa_bureaucracy')] [bureaucracy|e] we would also benefit from the [ShowModifier('empowered_qadi_al_jamaa_modifier')] [modifier|e]"

 adu_dispatch_gold_caravan: "Dispatch a Gold Caravan"
 adu_dispatch_gold_caravan_desc: "Choose one of our own to lead a caravan south across the Sahara. Laden with [ShowGoodsName('salt')] and [ShowGoodsName('cloth')], it will trade for the [ShowGoodsName('goods_gold')] of the [ShowRegionName('sahel_region')] and carry that wealth home to enrich our markets."
 adu_dispatch_gold_caravan_select_leader: "Choose a Caravan Leader"
 adu_dispatch_gold_caravan_no_leader: "@trigger_no!We have no [character|e] fit to lead the [expedition|e]"
 adu_dispatch_gold_caravan_tt: "The chosen [character|e] will lead an [expedition|e] south across the Sahara, trading for the [ShowGoodsName('goods_gold')] of the [ShowRegionName('sahel_region')] and carrying that wealth home to our markets"

 nick_the_golden: "the Golden"

 golden_century_events.12.title: "The Tribute of [target_country.GetNameWithNoTooltip]"
 golden_century_events.12.desc: "Our loyal colony of [target_country.GetName] has prospered under our protection, and the time has come for it to render unto us its due. A tribute fleet lies ready in its harbors, and word awaits [target_ruler.GetName] on what it shall carry home. We may demand a steady stream of coin to fill our treasury, or the silver and gold of its mines to enrich our markets. Or, looking past its riches to its people, we may drive settlers across the ocean to swell the provinces of our own realm."
 golden_century_events.12.a: "Demand a yearly tribute in gold."
 golden_century_events.12.b: "Claim the silver and gold of their mines."
 golden_century_events.12.c: "Ship their people to settle our lands."

 spa_issue_royal_decree: "Issue a Cédula de Población"
 spa_issue_royal_decree_desc: "Choose an area across our overseas dominion and throw open its harbors to settlers. By royal decree, families from realms that share our faith will cross the ocean to build new lives upon our frontier, and the empty reaches of that land will fill with willing hands."
 select_colonial_area_to_direct_migrants: "Choose an [area|e] to Receive Our Settlers"
 no_available_colonial_area: "@trigger_no!We hold no [area|e] fit to receive new settlers"
 spa_issue_royal_decree_tt: "We will open the chosen [area|e] to migration, drawing settlers from realms that share our faith into its [locations|e] and granting them a lasting boon"

 golden_century_events.13.title: "[target_area.GetNameWithNoTooltip] Welcomes Migration Waves"
 golden_century_events.13.desc: "Our efforts to push the colonial frontier have borne fruit. The decree we issued to welcome settlers across [target_area.GetName] has spread far beyond our own harbors, drawing families from as far away as [target_origin_province_1.GetName] to seek a new life under our banner.\n\nThey arrive with more than empty hands. Some bring the habits of neighbors long accustomed to living beside strangers, some the tools and trades of their old workshops, and others simply their numbers and their hunger to build. Whatever they carry, [target_ruler.GetName] would see them settled well, for a frontier peopled is a frontier held."
 golden_century_events.13.a: "Welcome!"
 migrants_bring_cultural_understanding_tt: "The new settlers bring with them [ShowModifier('harmonious_understanding_modifier')] for #Y 5#! Years"
 migrants_bring_tool_expertise_tt: "Toolmakers and expert craftsmen bless our colonies with [ShowModifier('new_tooling_techniques_modifier')] for #Y 5#! Years"
 shared_prosperity_event_13_tt: "[ShowModifier('shared_prosperity_modifier')] is felt across the new homes for #Y 5#! Years"
 golden_century_events.13.desc.historical_info: "A #italic cédula de población#! was a royal charter by which the Spanish Crown sought to settle the thinly held reaches of its empire. Colonists willing to cross the ocean were promised grants of land, relief from taxes and duties, and the standing of loyal subjects, so that distant claims upon the map might become farms, towns, and ports able to pay their way and stand in their own defense.\n\nThe most celebrated was the #italic Real Cédula de Población#! granted by Charles III in 1783 for the island of Trinidad, long claimed by Spain yet scarcely inhabited. It welcomed Roman Catholic settlers from abroad and awarded land in proportion to each family and the number of enslaved laborers they brought, so that within a single generation a near-empty outpost became a crowded plantation colony. It remains the boldest expression of the Bourbon ambition to make the neglected edges of empire yield their worth at last."

 golden_century_events.14.title: "The Shadow of [gc_hegemon.GetNameWithNoTooltip]"
 golden_century_events.14.desc: "The [GetSituationByKey('battle_for_the_strait').GetName] is settled, and from it [gc_hegemon.GetName] has risen as a power that overshadows us all. Their armies are proven, their coffers deep, and their ambition plain, for they now reach beyond their own borders toward mastery of the age itself. We are numbered among those who have cause to fear them.\n\nYet a rising hegemon calls forth its own answer. Across the courts of the fearful a coalition begins to gather, and the further [gc_hegemon.GetNameWithNoTooltip] extends their reach, the harder that league will labor to contain them. The century to come will turn on whether that ascendancy can be checked, or whether it swallows the balance of the world entire."
 golden_century_events.14.a: "We will not stand alone against them."

 golden_century_events.15.title: "The Ascendancy of [gc_hegemon.GetNameWithNoTooltip]"
 golden_century_events.15.desc: "Word reaches our court that [gc_hegemon.GetName] has emerged victorious from the [GetSituationByKey('battle_for_the_strait').GetName] and now stands foremost among the powers of the age. We are bound to them, by oath or by obligation, and so their triumph is in some measure our own, their rise a tide that may carry us with it.\n\nYet fortune shared is fortune risked. As [gc_hegemon.GetNameWithNoTooltip] climbs higher, the fearful and the envious will draw together against them, and those tied to the hegemon may find the enmity meant for their patron falling upon them as well. The years ahead will prove whether our attachment becomes our making or our undoing."
 golden_century_events.15.a: "We shall watch their rise closely."

 golden_century_events.16.title: "A New Power Rises"
 golden_century_events.16.desc: "Beyond our borders [gc_hegemon.GetName] has risen above their rivals, and from the [GetSituationByKey('battle_for_the_strait').GetName] they emerge reaching for a mastery that will not halt at their own frontiers. We are neither sworn to them nor set against them, yet a power of such ambition casts a long shadow over all who dwell beside it.\n\nThe choice before us will not wait forever. Should we come to fear their reach, a coalition of the wary stands ready to receive us; should we read the wind otherwise, there is safety yet to be found in their favor. Whether we bend, resist, or merely watch, the century to come will not leave us untouched."
 golden_century_events.16.a: "We will weigh our course carefully."

 gc_grand_alliance_leader_tt: "We lead [GetInternationalOrganizationType('grand_alliance').GetName] arrayed against [gc_hegemon.GetName]. As their [gc_european_dominance|e] and [gc_colonial_dominance|e] cross each threshold, the [modifier|e] bonuses the [international_organization|e] grants its [members|e] grow stronger"
 gc_grand_alliance_member_tt: "Any realm that fears [gc_hegemon.GetName] may join [GetInternationalOrganizationType('grand_alliance').GetName] arrayed against them. As their [gc_european_dominance|e] and [gc_colonial_dominance|e] cross each threshold, the [modifier|e] bonuses the [international_organization|e] grants its [members|e] grow stronger"
 gc_grand_alliance_prospect_tt: "Should we come to fear [gc_hegemon.GetName], we may join [GetInternationalOrganizationType('grand_alliance').GetName] against them. The further their [gc_european_dominance|e] and [gc_colonial_dominance|e] climb, the stronger the [modifier|e] bonuses the [international_organization|e] grants its [members|e]"
 gc_curb_dominance_peace_tt: "By defeating [gc_hegemon.GetName] in war we may impose a [peace_treaty|e] that curbs their [gc_european_dominance|e] or [gc_colonial_dominance|e] by #Y 25#!"
 gc_dominance_growth_observer_tt: "[gc_hegemon.GetName] raises their [gc_european_dominance|e] and [gc_colonial_dominance|e] in strides through conquest, colonization, and statecraft. Each threshold they cross hardens their grip on the age"
 gc_flashpoints_observer_tt: "[flashpoint|E] [events|e] may occur to [gc_hegemon.GetName] during this [situation|e]"
 gc_hegemon_backer_tt: "We are bound to [gc_hegemon.GetName]. Their triumphs may lift us, yet [GetInternationalOrganizationType('grand_alliance').GetName] gathers against them, and their wars may become our own"

 io_opinion_grand_alliance: "Fellow member of the $grand_alliance$"
 grand_alliance: "The Grand Alliance"
 grand_alliance_desc: "A league of powers drawn together by their fear of a rising Colossus. The further that power extends its dominance across [ShowContinentNameWithNoTooltip('europe')] and the New World, the stronger this coalition grows in answer, until the balance of the age turns upon whether it can be contained. Its leadership falls to its mightiest member, and any realm that fears or opposes the Colossus may join."
 gc_legend_colossus: "The Colossus"
 gc_legend_colossus_desc: "The great power whose rising [gc_european_dominance|e] or [gc_colonial_dominance|e] drew the $grand_alliance$ together against them."
 gc_legend_grand_alliance: "The $grand_alliance$"
 gc_grand_alliance_european_scaling: "The [gc_european_dominance|e] of our foe in the [GetSituationByKey('golden_century').GetName]"
