 gc_colonial_dominance: "Colonial Dominance"
 gc_colonial_dominance_desc: "How far our reach extends across the New World, growing month by month through our colonies, treasure fleets, naval traditions, and the faith we carry overseas. It measures how golden our century becomes beyond the ocean, and each threshold we cross grants a lasting reward. Once either this or our [gc_european_dominance|e] first reaches 25, the [GetInternationalOrganizationType('grand_alliance').GetName] forms against us."
 GC_COLONIAL_DOMINANCE_DISPLAY: "$VAL$"

 gc_european_dominance: "European Dominance"
 gc_european_dominance_desc: "How heavily our dominion weighs upon Europe, growing month by month through the extent of our realm, its stability, and army traditions, as well as our legitimacy and grip on our home region. It measures our prominence at home, and each threshold we cross grants a lasting reward. Once either this or our [gc_colonial_dominance|e] first reaches 25, the [GetInternationalOrganizationType('grand_alliance').GetName] forms against us."
 GC_EUROPEAN_DOMINANCE_DISPLAY: "$VAL$"

