 crown_of_al_andalus_desc: "One crown now binds them all. The ṭā'ifa of [ShowRegionName('iberia_region')], long sundered since the fall of [ShowLocationName('cordoba')], are gathered beneath a single throne, and faithful and dhimmi alike answer to the authority of our house."
 adu_restored_f: "Al-'Andalus"
 adu_restored_f_desc: "The struggle for the [ShowLocationName('strait_of_gibraltar')] has been won, and the road to restoring $adu_restored_f$ lies open. With the [ShowReligionGroupAdjective('muslim')] cause triumphant, fewer lands across [ShowRegionName('iberia_region')] must answer to our throne for the old order to rise again."
