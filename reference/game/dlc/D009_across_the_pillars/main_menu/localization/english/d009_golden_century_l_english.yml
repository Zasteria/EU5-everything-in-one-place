 golden_century: "Golden Century"
 golden_century_info: "The victor of the [GetSituationByKey('battle_for_the_strait').GetName] has risen to overshadow the age. For a hundred years it presses its dominance over [ShowContinentName('europe')] and the New World, while the realms it dwarfs look for any way to cut it back down."
 golden_century_desc: "The [GetSituationByKey('battle_for_the_strait').GetName] is settled, and from it a single Colossus has risen, mightier than any rival left standing. The century now opening will be defined by the reach of that power, over the courts and battlefields of [ShowContinentName('europe')] and over the trade and colonies of the wider world.\n\nSuch supremacy is never suffered gladly. The taller the Colossus grows, the greater the fear it stirs, until the frightened and the ambitious make common cause in a Grand Alliance sworn to contain it. Whether this golden century closes on a universal monarchy or on the Colossus brought low will turn on how far that dominance can be pressed before the balance of the age gives way."

 golden_century_colossus_endures: "The Colossus Endures"
 golden_century_colossus_endures_desc: "The Colossus keeps its century. It takes [ShowModifier('gc_european_triumph_modifier')] and [ShowModifier('gc_colonial_triumph_modifier')], each scaled to how far its reach actually extended. Where that reach went wholly unopposed, it is crowned [ShowModifier('hegemon_of_europe_modifier')] or [ShowModifier('hegemon_of_new_world_modifier')]."
 golden_century_colossus_destroyed: "The Colossus Falls"
 golden_century_colossus_destroyed_desc: "With the Colossus itself gone, no triumph or penalty passes to anyone: the age simply loses the power that defined it."
 golden_century_colossus_diminished: "The Colossus Diminished"
 golden_century_colossus_diminished_desc: "The Colossus survives, but takes a severe blow to its [stability|e] for having been cut down to size."

