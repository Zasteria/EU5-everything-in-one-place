 RECONQUER_IBERIA_WAR_NAME: "Reconquest of Iberia"

 golden_century_events.30.title: "The Century Undone"
 golden_century_events.30.desc: "The golden century we set out to build lies in ruin. A quarter of the lands we held at its dawn have slipped from our grasp, torn away by the very powers our ascendancy called forth, and under [target_ruler.GetName] our [ROOT.GetCountry.GetFlavorRank] can no longer claim the mastery it once held.\n\nThe age will remember our rise, and it will remember our fall. What remains is to gather what strength we still hold and endure the years that follow."
 golden_century_events.30.a: "So ends our golden age."

 golden_century_events.31.title: "The Colossus Broken"
 golden_century_events.31.desc: "[gc_hegemon.GetName], who once loomed over the age, has been humbled and stripped of a quarter of their realm. The Colossus that overshadowed [ShowContinentName('europe')] and the seas beyond is broken at last, and the balance of the age tilts anew."
 golden_century_events.31.desc.destroyed: "The Colossus that once loomed over the age has been struck from the map entirely. The power that overshadowed [ShowContinentName('europe')] and the seas beyond is torn down, and its lands are parceled out among those it once cowed. The balance of the age tilts anew."
 golden_century_events.31.a: "The coalition's work is done."
 golden_century_events.31.b: "The age turns."
 gc_ending_defeat_member_tt: "Having stood in the coalition against [gc_hegemon.GetName], we may now fabricate the [ShowCasusBelliName('cb_reconquer_iberia')] to seize the lands of [ShowRegionName('iberia_region')] at reduced cost, and the mightiest among us takes up the mantle of the Breaker of $iberia_region$"

 golden_century_events.33.title: "A Century of Gold"
 golden_century_events.33.desc: "A hundred years have passed since our ascendancy began, and we stand unbroken at their close. Every rival that rose against us has been outlasted, every coalition weathered, and under [target_ruler.GetName] our [ROOT.GetCountry.GetFlavorRank] has enjoyed a golden age that will be spoken of for centuries.\n\nWhat we won across [ShowContinentName('europe')] and beyond the ocean is ours now, woven so deeply into the fabric of our realm that no reversal can wholly undo it."
 golden_century_events.33.a: "Our century is won."

 golden_century_events.34.title: "The Colossus Endures"
 golden_century_events.34.desc: "[gc_hegemon.GetName] has weathered the full century unbroken, and their golden age passes into history with their dominance intact. The mark they leave upon [ShowContinentName('europe')] and the wider world will outlast us all."
 golden_century_events.34.a: "We could not break them."
 golden_century_events.34.b: "So the age is remembered."

 golden_century_events.54.title: "The Grand Alliance Humbled"
 golden_century_events.54.desc: "The coalition raised to contain us has been beaten in open war, and its members now count the cost of their presumption. Those who marched against us have quit their grand league, preferring separate survival to shared defeat.\n\nOur arms stand vindicated before every court of [ShowContinentName('europe')]. The princes who whispered that our ascent could be halted must now speak of it in another tone."
 golden_century_events.54.a: "Let them scatter."
 gc_ga_humbled_tt: "Defeating the Grand Alliance in war increases our [gc_european_dominance|e] by #Y 10#! and its defeated members abandon the [international_organization|e]"
 gc_salamanca_embrace_tt: "Many [pops|e] in our centers of learning that do not follow our [religion|e] or [culture|e] will embrace them"
