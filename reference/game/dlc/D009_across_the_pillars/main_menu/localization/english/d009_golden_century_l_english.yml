 ga_declare_war_on_hegemon: "Call the Alliance to War"
 ga_declare_war_on_hegemon_desc: "The Colossus will not be argued back into modesty; it will be fought back into it. As leader of the $grand_alliance$, we may call every member to arms and put the matter of dominance to the only court whose verdict is final."
