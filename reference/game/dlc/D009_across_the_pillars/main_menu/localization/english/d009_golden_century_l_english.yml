 golden_century_events.40.title: "Revolt of the Estates"
 golden_century_events.40.desc.desc_spa: "The privileged estates of our [ROOT.GetCountry.GetFlavorRank] have risen against us as one. Our recent attempts to accumulate more authority at their expense has not gone unnoticed. The grandees, the prelates, and the merchants of the chartered towns alike protest that we have gathered too much power into our hands, and they raise their banners and their retainers to force us to relent."
 golden_century_events.40.desc.desc_adu: "The great households of our [ROOT.GetCountry.GetFlavorRank] have made common cause against us. Not since the days of old have we seen so brazen a refusal to obey from those we ourselves raised to privilege. It is insolence and hubris, nothing more. Every petty lord, merchant, and cleric now covets the authority that is ours by right, and it will not stand!"
 golden_century_events.40.desc.historical_info_spa: "The centralizing ambitions of the Spanish crown met fierce resistance from the privileged. The Revolt of the Comuneros of 1520 to 1521 saw the cities of Castile rise against Charles V, and the grandees and the Cortes long guarded their liberties against the reach of the throne."
 golden_century_events.40.desc.historical_info_adu: "Central authority in al-'Andalus was forever contested by its great families and provincial lords. The civil wars of the #italic fitna#! shattered the Caliphate of Córdoba after 1009, and ambitious governors broke again and again with the center to rule as they pleased."
 golden_century_events.40.a: "They forget who they serve!"
 X_provinces_may_rise_in_revolt_tt: "#Y [ROOT.GetVariable('golden_century_events_40_display_prov_rebel_variable').GetValue|V0]#! [provinces|e] will join the [target_rebel.GetName], and every upper-class pop within them turns against us"
 rebellion_gains_traction_tt: "The revolt gathers pace"
 destabilization_spreads_tt: "Unrest spreads"
 central_authority_takes_hit: "Our authority is shaken"
 central_authority_tested: "Our authority is tested"
 gc_flashpoint_estate_rebels: "[COUNTRY.GetAdjectiveWithNoTooltip] Estates in Revolt"
 gc_flashpoint_estate_rebels_country: "$ADJ$ Estates in Revolt"
 gc_flashpoint_estate_rebels_country_adjective: "$ADJ$ Estates in Revolt"
 gc_regional_rebels: "[COUNTRY.GetAdjectiveWithNoTooltip] Frontier Rebels"
 gc_regional_rebels_country: "$ADJ$ Frontier Rebels"
 gc_regional_rebels_country_adjective: "$ADJ$ Frontier Rebels"

 golden_century_events.41.title: "Clash Between the Old & New"
 golden_century_events.41.desc: "The estates press us to surrender a measure of our central authority. They state their case that our recent attempts to seize their privileges have hindered their influence, and they demand a significant reversal.\n\nThis is the old order pushing back against the new: the ancient families and their inherited rights set against the centralized rule we have labored to build, and every fresh decree from the center felt by them to be a theft of what is rightfully theirs. To yield would tilt the balance firmly in their favor, and herald a return to the old ways of a bygone hierarchy."
 golden_century_events.41.desc.historical_info_spa: "The centralizing monarchy the Catholic Monarchs built from Castile and Aragon met the resistance of the old privileged orders at every turn. The Cortes guarded their right to grant taxes, the Aragonese and Catalan #italic fueros#! bound the crown's hand, and the grandees and chartered towns clung to liberties no reforming minister could easily undo."
 golden_century_events.41.desc.historical_info_adu: "Central authority in al-'Andalus was perpetually resisted by the provinces. The Umayyad state of Córdoba governed through a salaried bureaucracy, yet the great families, the frontier lords, and the cities strained against it, and after 1031 the realm dissolved into the #italic ṭā'ifa#! kingdoms, each ruler a law unto himself."
 golden_century_events.41.a: "We yield to their demands."
 golden_century_events.41.b: "Every crisis is an opportunity."
 estates_protest_our_rejection_tt: "The estates seethe at our refusal"
 golden_century_events.42.title: "Concentration of Power"
 golden_century_events.42.desc: "The moment favors gathering the reins of power into our own hands. The old privileges and local liberties that have so long fettered the center are ripe to be swept aside, and the whole machinery of the state bent to a single purpose.\n\nSuch a tide does not come twice. If we press our advantage now, the councils, the courts, and the gathering of our revenues may all be drawn tighter under our command, and our dominion made to answer as one."
 golden_century_events.42.desc.historical_info_spa: "The union of Castile and Aragon under Isabella and Ferdinand forged one of Europe's first modern states. Through the royal councils, the #italic corregidores#! sent to govern the cities, and the taming of the Cortes and the military orders, the crown drew authority steadily into its own hands across the sixteenth century."
 golden_century_events.42.desc.historical_info_adu: "At its height the Caliphate of Córdoba, consolidated by 'Abd al-Raḥmān III after 929, was among the most centralized states of its age. A salaried #italic dīwān#!, a standing army, and a network of appointed governors let the caliph rule a unified al-'Andalus from a single capital, the envy of the fractured realms around it."
 golden_century_events.42.a: "Draw power to the center."
 golden_century_events.42.b: "Empower a governing council."
 golden_century_events.42.c: "Raise a larger army."

 golden_century_events.43.title: "A Golden Century of the Arts"
 golden_century_events.43.desc.desc_spa: "Wealth and confidence have loosed a flood of genius upon [ROOT.GetCountry.GetCapital.GetName]. The playhouses overflow each afternoon, the presses cannot keep pace with the poets, and painters whose like we shall not see again take up their brushes in the service of crown and altar.\n\nThe finest minds of [ShowContinentName('europe')] look now to our court, and [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is pressed to become the great patron of the age. What silver has won us in land it may yet win in glory, for a century is remembered as much for what it makes as for what it takes. Let us open the purse of our [ROOT.GetCountry.GetFlavorRank] to this bounty."
 golden_century_events.43.desc.desc_adu: "In the halls of [ROOT.GetCountry.GetCapital.GetName], the old learning stirs to life once more. Poets trade verses through the night, physicians and astronomers gather at court, and the songs of al-'Andalus are heard again in courtyards that had long ago fallen silent.\n\nFor centuries, our cities were the lamp by which the West read, and that light is ours to rekindle. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is urged to gather the most gifted people from every land, to fill our libraries and endow our schools, and to let it be said once more that wisdom keeps its house in [ROOT.GetCountry.GetName]. This is the season for our [ROOT.GetCountry.GetFlavorRank] to become a patron of the gifted."
 golden_century_events.43.desc.historical_info_spa: "The Spanish Golden Age, the #italic Siglo de Oro#!, was the cultural flowering that accompanied the empire, funded in no small part by the silver of the Indies. It gave the world Cervantes' #italic Don Quixote#!, the theater of Lope de Vega and Calderón, and the painting of El Greco, Velázquez, and Murillo."
 golden_century_events.43.desc.historical_info_adu: "Tenth-century Córdoba was the most learned city in Western Europe, its library the largest on the continent. Its scholars, among them the philosopher Ibn Rushd and the surgeon al-Zahrāwī, carried medicine, philosophy, and astronomy far beyond the Muslim world, and its splendor endured into the Nasrid Alhambra of Granada."
 golden_century_events.43.a: "Let this be a golden age."

 golden_century_events.44.title: "[target_character.GetNameWithNoTooltip] Enters Our Service"
 golden_century_events.44.desc.desc_spa: "Word has reached [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] of [target_character.GetName], and those who have watched [target_character.GetHerHim] work speak of little else. Marshaling troops in the field or holding the floor before the council, [target_character.GetSheHe] carries the unmistakable mark of the gifted, the sort of servant a crown is granted perhaps once in a reign.\n\nSuch talent neither sits idle nor wants for other masters. If [target_character.GetNameWithNoTooltip] is to serve our [ROOT.GetCountry.GetFlavorRank] and no rival throne, we must bind [target_character.GetHerHim] to us now, with honor and office enough to keep [target_character.GetHerHim] ours."
 golden_century_events.44.desc.desc_adu: "[target_character.GetName] has been brought before [ROOT.GetCountry.GetGovernment.GetRuler.GetName], and the praise that runs ahead of [target_character.GetHerHim] is no idle flattery of courtiers. In the council chamber and on the march alike, [target_character.GetSheHe] shows the rare gifts on which the fortunes of a dynasty have so often turned.\n\nA mind like [target_character.GetHerHis] is a prize any court would seize without a moment's pause. Raise [target_character.GetNameWithNoTooltip] to office and honor now, and [target_character.GetHerHim] may serve our [ROOT.GetCountry.GetFlavorRank] for a generation; hesitate, and another surely will."
 golden_century_events.44.desc.historical_info_spa: "Gonzalo Fernández de Córdoba, remembered as #italic El Gran Capitán#!, was the finest soldier of his age. In the Italian Wars, he shattered far larger French armies at Cerignola and the Garigliano, victories that won Naples for the Spanish crown and made him its first viceroy. His remaking of the infantry, welding pike, sword, and shot forces into one disciplined body, laid the foundation of the #italic tercios#! that would rule the battlefields of Europe for over a century."
 golden_century_events.44.desc.historical_info_adu: "The fortunes of al-'Andalus often turned on a single great minister, none more so than the #italic hajib#! al-Manṣūr, called Almanzor by the Christians, whose campaigns humbled the northern kingdoms and made him master of the caliphate in all but name."
 golden_century_events.44.a: "Take [target_character.GetNameWithNoTooltip] into our service."

 golden_century_events.45.title: "A Reckoning of the Realm"
 golden_century_events.45.desc.desc_spa: "Our clerks come to [ROOT.GetCountry.GetGovernment.GetRuler.GetName] with a proposal for a great reckoning: to count every hearth, weigh every field, and set down the true wealth of our [ROOT.GetCountry.GetFlavorRank] in ledgers the crown can trust. It is slow and thankless labor, and the tax-shy will curse the surveyors at every door.\n\nYet a realm that knows itself is a realm that can be governed. To tax justly, to raise armies in proportion to our means, and to spend against a true accounting rather than a hopeful guess is the quiet power on which lasting reigns are built. Knowledge is its own kind of dominion. Let us order the survey."
 golden_century_events.45.desc.desc_adu: "Our secretaries urge [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to set the registers in order once more, to number the people and their holdings as the #italic dīwān#! of old once did from Córdoba to Baghdad. A ledger honestly kept, they remind us, is the foundation on which every strong reign has stood.\n\nIt was by such careful accounting that our forebears kept salaried officials, standing armies, and a treasury the north could only envy. To revive that discipline is to trade the ruler's guesswork for the clerk's certainty, and to bind the whole of our [ROOT.GetCountry.GetFlavorRank] to a single, knowing hand. Let the survey be ordered."
 golden_century_events.45.desc.historical_info_spa: "The Castilian crown periodically ordered great surveys, the #italic averiguaciones#!, counting hearths and wealth to assess its taxes, a practice the Habsburgs extended across their sprawling dominions."
 golden_century_events.45.desc.historical_info_adu: "The Umayyad state of Córdoba was administered through a sophisticated #italic dīwān#! whose tax registers and salaried officials made its revenues the envy of Christian Europe, an inheritance of statecraft from Damascus and Baghdad."
 golden_century_events.45.a: "Order the survey."

 golden_century_events.46.title: "The Fairs Overflow"
 golden_century_events.46.desc.desc_spa: "The season's fairs have swelled beyond all memory. Merchants throng from every kingdom of [ShowContinentName('europe')], bills of exchange pass in sums that would once have bought a war, and in the counting-houses of our [ROOT.GetCountry.GetFlavorRank] the clink of coin never ceases from dawn to dark.\n\nSuch tides do not run forever. While the Genoese and the great banking houses are eager and the silver flows, we might bind their credit to our crown, draw their trade through our own towns, and take our tithe of every bargain struck. Fortune has laid a golden season at our feet. Let us make the most of it."
 golden_century_events.46.desc.desc_adu: "The souks of [ROOT.GetCountry.GetCapital.GetName] have not been so crowded in living memory. Caravans out of the [ShowRegionName('maghreb_region')] and ships from across the sea crowd our quays with silk, paper, leather, and the glazed wares our own craftsmen send abroad, and the money-changers can scarcely keep their tables.\n\nThe trade of the western sea has ever been the lifeblood of al-'Andalus, richer in a good year than any tribute wrung from a beaten foe. If we guard the roads, ease the passage of the merchants, and keep our ports the envy of the coast, this swell of commerce may fill our treasury for a generation. Let us ride the tide."
 golden_century_events.46.desc.historical_info_spa: "The fairs of Medina del Campo were the financial heart of Castile, where the bills of exchange of much of Europe were settled and the Genoese and German banking houses did their business with the crown."
 golden_century_events.46.desc.historical_info_adu: "Andalusi commerce reached from the Maghreb to the Levant, carrying the silk, paper, leather, and lusterware of Córdoba and Granada abroad, and the markets of its cities were among the busiest in the medieval Mediterranean."
 golden_century_events.46.a: "Let commerce flourish."

 golden_century_events.47.title: "A New Art of War"
 golden_century_events.47.desc.desc_spa: "Our captains have been drilling the infantry in a new manner, mingling pike and shot into squares that stand unbroken against horse and column alike. Old soldiers who have seen every field of [ShowContinentName('europe')] swear they have never watched a formation hold as these do.\n\nBacked with coin and given time to harden, the armies of our [ROOT.GetCountry.GetFlavorRank] might become the terror of every field they take, and the name of our regiments a thing spoken with dread from [ShowRegionName('italy_region')] to the north. Wars are won by those who master the new art before their rivals learn to answer it. Let us fund the reforms."
 golden_century_events.47.desc.desc_adu: "Our commanders press [ROOT.GetCountry.GetGovernment.GetRuler.GetName] for a renewal of the old martial arts: the swift light horse that harries and encircles, and the new powder-weapons ranged in support beside them. The frontier has always favored speed and surprise, and few have wielded them as our forebears did.\n\nMarry that inherited cunning to the artillery of the age, and the banners of our [ROOT.GetCountry.GetFlavorRank] will be feared across sea and sand alike, both on the Christian frontier and the shores of the [ShowRegionName('maghreb_region')]. A power that will not learn the new ways of war does not hold its borders for long. Let us fund the reforms."
 golden_century_events.47.desc.historical_info_spa: "Under Gonzalo de Córdoba, Spanish armies pioneered the #italic tercio#!, a formation blending pikemen and arquebusiers that dominated European battlefields for over a century and made Spain the foremost military power of the age."
 golden_century_events.47.desc.historical_info_adu: "Andalusi and Berber warfare prized the #italic jinete#!, the swift light horseman armed with javelin and sword, and the Nasrids of Granada were among the first in the peninsula to turn gunpowder artillery upon their enemies."
 golden_century_events.47.a: "Fund the reforms."

 golden_century_events.48.title: "A Beacon of Learning"
 golden_century_events.48.desc.desc_spa: "The lecture halls of our [ROOT.GetCountry.GetFlavorRank] have not been this loud in living memory. Jurists argue whether a prince may lawfully do the very things he fully means to do regardless, theologians weigh the rights of peoples an ocean away, and half the courts of [ShowContinentName('europe')] write to beg a copy of the verdict.\n\nLet it never be said we begrudged a scholar his stipend. Endow the great schools now, and raise [ShowLocationNameWithNoTooltip('salamanca')] above them all, and our [ROOT.GetCountry.GetFlavorRank] will be quoted in halls where our armies have never once marched. To be feared is common enough; to be heeded is the rarer glory. Let us endow the scholars."
 golden_century_events.48.desc.desc_adu: "The madrasas of our [ROOT.GetCountry.GetFlavorRank] are crowded once more, and our physicians, astronomers, and translators fall to their work like men who have been idle far too long. The old books come down from the shelves; the arguments they start are older still.\n\nEndow these houses of learning and watch them flourish. And let the memory of the great library of [ShowLocationNameWithNoTooltip('cordoba')], the wonder that once put every court in the West to shame, stir us to more than fond remembrance, for what was scattered may yet be gathered again. Let us endow the scholars."
 golden_century_events.48.desc.historical_info_spa: "The University of Salamanca, founded in 1218, was among the oldest and most renowned in Europe. In the sixteenth century its School of Salamanca, led by the Dominican Francisco de Vitoria, revived scholastic thought and debated the rights of the peoples of the Americas and the lawful limits of war, questions counted among the foundations of international law."
 golden_century_events.48.desc.historical_info_adu: "The caliphal library of Córdoba, assembled under al-Ḥakam II, was said to hold hundreds of thousands of volumes, the largest collection in the West. Its translators carried the #italic falsafa#! of Ibn Rushd, whom the Latins called Averroes, into Christian Europe, while the #italic bīmāristān#! of Granada taught medicine in an age when much of the continent still trusted to prayer alone."
 golden_century_events.48.a: "Endow the scholars."

 golden_century_events.49.title: "The Reckoning of Debts"
 golden_century_events.49.desc.desc_spa: "For all the precious metal that crosses the ocean to us, our creditors have caught us short. The bankers hold our notes, the interest devours the next fleet before it has docked, and they press now for a payment the treasury of our [ROOT.GetCountry.GetFlavorRank] cannot make in full.\n\nThere is no honorable way left to answer them, only hard ones. We may suspend our debts and break faith with the houses that fund our wars, or squeeze the realm harder for coin it does not have."
 golden_century_events.49.desc.desc_adu: "[ROOT.GetCountry.GetCapital.GetName] can no longer meet its financial obligations. The endless costs associated with the frontier, the pay owed to the soldiers of the [ShowRegionName('maghreb_region')], and the tribute demanded by stronger neighbors have drained our revenues all at once.\n\nThe moneylenders grow insistent and the paymasters more so, for an army unpaid is an army that melts away or turns its swords inward. The reckoning can be put off no longer: We must find the coin, forgo the debt, or lose the very men who hold our borders."
 golden_century_events.49.desc.historical_info_spa: "Despite the flood of American silver, the Spanish crown declared bankruptcy repeatedly — in 1557, 1575, and 1596, to name only a few — unable to service the vast loans it owed to the Fugger and Genoese banking houses."
 golden_century_events.49.desc.historical_info_adu: "The states of al-'Andalus and the Maghreb were perennially strained by the cost of frontier war, the pay of Berber mercenaries, and the tribute demanded by stronger neighbors, burdens that could empty a treasury faster than any tax could fill it."
 golden_century_events.49.a: "Debase the coin and weather the storm."
 golden_century_events.49.b: "Tighten every belt!"

 golden_century_events.50.title: "Disease in the Heartland"
 golden_century_events.50.desc: "The [ShowDiseaseName('bubonic_plague')] has taken hold in the heart of our [ROOT.GetCountry.GetFlavorRank]. It empties the villages and stalks the alleys of the cities, sparing neither the quarters of the rich nor the poorest hovel, and the graveyards beyond the walls will soon not be able to keep pace with the carts. No physician's art has yet found a way to check it.\n\nAgainst an enemy that answers to no siege and no treaty, a crown can do little but the humble work of survival: to bury the dead with what dignity remains, to feed and shelter the living, and to hold some order where panic would breed more death than the sickness itself. We can only tend our people, endure, and pray the worst will soon pass."
 golden_century_events.50.desc.historical_info: "From the Black Death of the fourteenth century onward, recurring waves of plague swept the Iberian Peninsula, emptying its cities and fields and shattering the labor and revenue on which every state depended. The Castilian plague of 1596 to 1602 alone killed perhaps six hundred thousand people, a demographic blow from which Castile never fully recovered and which historians count among the causes of its long decline."
 golden_century_events.50.a: "Stop coughing on each other!"

 golden_century_events.51.title: "The Frontier Rises"
 golden_century_events.51.desc: "[target_area.GetName] has risen in open revolt, and it lies within the very region that cradles our capital. Its people have taken up arms, driven out our officials, and declared that they will answer to us no longer.\n\nA rising so close to the heart of our [ROOT.GetCountry.GetFlavorRank] cannot be indulged. Every district that watches [target_area.GetNameWithNoTooltip] defy us and go unpunished will weigh its own chances, and what starts as one rebellious corner can swallow a realm. We must put it down before the example spreads."
 golden_century_events.51.desc.historical_info: "Iberia's rulers were forever haunted by the revolt of their own regions. The Caliphate of Córdoba shattered after 1031 into the #italic ṭā'ifa#! kingdoms, each governor a petty king; centuries later the Moriscos of the Alpujarras rose against Castile from 1568 to 1571 in a brutal mountain war, and the #italic fueros#! of Aragon and Catalonia set hard limits on the reach of the crown. On this peninsula, a province pushed too far has always been ready to raise its own banner."
 golden_century_events.51.a: "We answer their defiance."

 golden_century_events.52.title: "Dearth and Riot"
 golden_century_events.52.desc: "The harvests have failed, and bread is dear beyond the reach of common folk. The cities of our [ROOT.GetCountry.GetFlavorRank] see hungry crowds gather at the granaries and turn to riot, while the countryside empties as the desperate take to the roads in search of a fuller table.\n\nA ruler is judged in lean years far more harshly than in fat ones, for a starving people care nothing for silver won abroad if there is no loaf at home, and it is a short road from an empty belly to a stone thrown at our officials. We must find grain to fill the markets and keep order in the streets, or watch hunger do to our people what no rival army could."
 golden_century_events.52.desc.historical_info: "The dense cities of the Iberian Peninsula were always vulnerable to dearth, and a single failed harvest or a severed trade route could bring famine and rioting to their streets within a season. The famines and rural depopulation of the early seventeenth century, remembered as part of the decline of Castile, drove the hungry from the land and made bread riots a recurring feature of Spanish city life."
 golden_century_events.52.a: "We face the hungry crowds."

 gc_decision.title: "Usher in the Golden Century"
 gc_decision.desc: "The [GetSituationByKey('battle_for_the_strait').GetName] is over, and ours is the banner left standing above the [ShowLocationName('strait_of_gibraltar')]. The south obeys our [ROOT.GetCountry.GetFlavorRank] from coast to coast, and no rival in [ShowRegionName('iberia_region')] remains to contest what we have won.\n\nWhat follows must be more than a victory remembered. Across [ShowContinentName('europe')] our voice now reaches further than our armies ever marched, and beyond the ocean lie shores that have never seen our sails. Let the age now opening bear the name of [ROOT.GetCountry.GetName]."
 gc_decision.desc.entry: "Whoever holds the [ShowLocationName('strait_of_gibraltar')] holds the gate between the Mediterranean and the ocean, and that gate is now ours. Peace in the south frees our treasury and our ships for greater ambitions, in [ShowContinentName('europe')] and on distant shores alike. Wars are won in a season, but a golden century must be built."
 gc_decision.a: "Many maps will be rendered obsolete!"

 restore_cordoba.title: "Restore [ShowLocationNameWithNoTooltip('cordoba')]"
 restore_cordoba.desc: "Once the wonder of the West, [ShowLocationName('cordoba')] has never regained the splendor it knew under the caliphs, when its libraries and its great mosque were the envy of a continent. Let us pour the wealth of our [ROOT.GetCountry.GetFlavorRank] into its stones, and make it the jewel of [ROOT.GetCountry.GetName] once more."
 restore_cordoba.a: "Rebuild the shining gem of al-'Andalus."
 enable_decision_to_restore_learning_center_in_cordoba_tt: "Unlocks the #Y $restore_cordoba.title$#! [decision|e]"

 library_cordoba: "The Library of $cordoba$"
 library_cordoba_desc: "In its prime, the $library_cordoba$ held hundreds of thousands of volumes, the largest collection in the West and the envy of every court from the [ShowRegionName('maghreb_region')] to the [ShowRegionName('crescent_region')]. Restored, it draws scholars, translators, and copyists from across the world, and makes [ShowLocationName('cordoba')] a beacon of learning once more."
 library_cordoba_maintenance: "$library_cordoba$"

