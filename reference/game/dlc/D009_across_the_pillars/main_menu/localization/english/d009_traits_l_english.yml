l_english:
 court_favorite: "Court Favorite"
 desc_court_favorite: "This individual owes rank and fortune to our authority alone, and labors to place ever more power in our hands. If the [cabinet_member|e] with this [trait|e] becomes our [head_of_the_cabinet|e], our country benefits from [GetAutoModifier('court_favorite_head_of_cabinet').GetName]."
 court_favorite_die_desc: "[CHARACTER.GetSheHe|U] owed rank and fortune to our favor alone, and repaid it with unwavering loyalty. The estates will shed few tears at the news."
