l_english:

 flavor_cas.142.title: "The Black Legend"
 flavor_cas.142.entry: "$flavor_cas.142.title$"
 flavor_cas.142.desc: "It has been brought to our attention that our colonial rivals spare no effort blackening the name of [ROOT.GetCountry.GetName]. Pamphlets and tales portray our conquistadors as bloodthirsty tyrants and our colonies as realms sustained only by cruelty. As the accusations spread quickly throughout [ShowContinentName('europe')], we are prompted to react to these slanders and jealous inventions."
 flavor_cas.142.a: "Their envy is proof of our greatness."
 flavor_cas.142.b: "Gather evidence and present it publicly."
 flavor_cas.142.b_tt: "Though we might be able to save our reputation, many may interpret our response as an admission that we have been deceived by their lies and inventions"
 flavor_cas.142.historical_info: "From the 16th century onwards, Spanish colonial rivals — mostly Protestants — started engaging in a defamation campaign that would later be called the Black Legend. Although they themselves participated in comparable practices, they sought to demonize Spain by emphasizing its brutality in the Americas and re-publishing Spanish works, such as those written by Bartolomé de las Casas, with many exaggerations and things taken out of context in order to damage the reputation of the Spanish crown."
 
 flavor_cas.143.title: "The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Road"
 flavor_cas.143.entry: "The Spanish Road"
 flavor_cas.143.desc: "With our dominions stretching from [ShowRegionName('italy_region')] to [target_province2.GetName], transporting goods and soldiers from one place to another has been a growing concern, as our ships are in grave danger especially when sailing around [ShowRegionName('great_britain_region')]. It has been suggested that we invest in a road system that will over time connect all of our possessions in [ShowContinentName('europe')] by land."
 flavor_cas.143.a: "We shall start building it."
 flavor_cas.143.a_tt: "[ShowRoadTypeName('paved_road')] will be built in every [location|e] within the [target_province1.GetName] and [target_province2.GetName] [province|e], at a [gold|e] cost that depends on the terrain and the roads already built"
 flavor_cas.143.b: "Nothing can threaten our navy."
 flavor_cas.143.historical_info: "The Spanish Road was a military and logistical corridor established in the mid-sixteenth century that linked Spanish possessions in Italy to the Spanish Netherlands through allied territories, mostly within the Holy Roman Empire. It was built to avoid the dangerous waters of the English Channel, where hostile navies could easily intercept Spanish ships."

 flavor_cas.148.title: "Empresa de China"
 flavor_cas.148.entry: "$flavor_cas.148.title$"
 flavor_cas.148.desc: "Ever since our arrival to [ShowRegionName('indonesia_region')], many have been arguing that the conquest of China is not only possible, but destined. Reports from merchants and envoys describe nations burdened by corruption that would stand no chance against the might of [ROOT.GetCountry.GetName]. Our spies have been hard at work infiltrating [target_country.GetName], and they believe that [target_location.GetName] would be a perfect stepping stone for our eventual subjugation of the entirey of China."
 flavor_cas.148.a: "Begin preparations for the invasion."
 flavor_cas.148.b: "We cannot act based on these rumours."
 flavor_cas.148.historical_info: "Following the Spanish conquest of the Philippines, numerous officials and Jesuit missionaries proposed an ambitious plan called the #italic Empresa de China#!, in which Spain was supposed to invade and convert Ming China. Jesuit missionaries who worked in China reported that the Empire was internally weak and could be easily conquered. In 1588, Philip II authorized preparations for the invasion, but it was ultimately never attempted and remains one of the most ambitious unrealized expansionist projects of the Spanish Empire."

 flavor_cas.152.title: "One Tax for the Whole Realm"
 flavor_cas.152.entry: "$flavor_cas.152.title$"
 flavor_cas.152.desc: "Our war against the Moors has placed a heavy burden upon the treasury, and the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] is forced to seek new sources of income to fund this war. The towns of the realm have agreed to grant us a levy on sales, but this offer has many of our advisors suggesting that perhaps this should not only be a temporary measure, but an institutionalized permanent source of income."
 flavor_cas.152.a: "We cannot rely on temporary gifts."
 flavor_cas.152.b: "We shall not abuse their generosity."
 flavor_cas.152.historical_info: "During the reign of Alfonso XI, Castile faced financial issues due to its campaigns against Granada. To fund the siege and conquest of Algeciras, the Castilian cities granted the king the #italic Alcabala#!, a sales tax levied on commercial transactions. Originally intended to be an extraordinary wartime contribution approved by the towns through the Cortes, the tax soon became one of the most important sources of royal revenue in Castile. Later monarchs expanded and institutionalized the tax and transformed it into a permanent levy that would provide a significant portion of the Crown's income for centuries."
