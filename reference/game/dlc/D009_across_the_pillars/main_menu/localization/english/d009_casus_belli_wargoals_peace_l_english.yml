l_english:
 cb_partition: "Partition"
 cb_partition_desc: "Our supremacy over [ShowContinentName('europe')] is beyond dispute, and the bloated realms that defy us have no right to the lands they hold. We shall break our foes apart, restoring every downtrodden nation's claim to their own soil."

 cb_restore_ummayad_caliphate: "Restore the Umayyad Caliphate Borders"
 cb_restore_ummayad_caliphate_desc: "Once the Umayyads ruled all of al-'Andalus from $cordoba.arabic_language$, a court whose splendor and learning were the envy of the world. That glory now lies shattered, its lands carved up among petty emirs unworthy of so great an inheritance. We shall reunite the faithful beneath a single Caliph and raise the banner of the Umayyads over $cordoba.arabic_language$ once more."
 war_goal_restore_ummayad_caliphate: "$cb_restore_ummayad_caliphate$"
 war_goal_restore_ummayad_caliphate_desc: "[war_goal|e] is to reclaim the lands of the old Caliphate. Participants will get more [war_score|e] from winning battles. Accumulating more than $THRESHOLD|Y%$ [war_score|e] from won battles will grant us a ticking [war_score|e]. In the peace, we may claim only [locations|e] that lie within the historic borders of the Umayyad Caliphate."
 RESTORE_UMMAYAD_CALIPHATE_WAR_NAME: "The $NUM$$ORDER$ War to Restore the Umayyad Caliphate against $SECONDNAME$"

 cb_reconquer_iberia: "Reconquest of $iberia_region$"
 cb_reconquer_iberia_desc: "The realm that once towered over [ShowRegionName('iberia_region')] has fallen, its grip broken and its lands ripe for the taking. Those who stood in the coalition against it may now carve the peninsula up between them, seizing at reduced cost what the fallen Colossus can no longer hold."
 war_goal_reconquer_iberia: "$generic_war_goal_superiority$"
 war_goal_reconquer_iberia_desc: "$generic_war_goal_superiority_desc$"

 PARTITION_WAR_NAME: "The $NUM$$ORDER$ Partition of $SECONDNAME$"
 war_goal_partition_superiority: "$generic_war_goal_superiority$"
 war_goal_partition_superiority_desc: "$generic_war_goal_superiority_desc$"

 peace_partition: "Partition"
 peace_partition_desc: "We will dismember our defeated foe, restoring to independence every nation that still holds a claim within its borders."
 peace_partition_entry: "Partition [TARGET_COUNTRY.GetNameWithFlag]"
 peace_partition_entry_short: "Partition [TARGET_COUNTRY.GetNameWithFlagWithNoTooltip]"
 peace_partition_tt: "Release every nation that holds cores within the lands of the defeated country"

 cb_grand_alliance: "Grand Alliance"
 cb_grand_alliance_desc: "In dread of a single realm's unchecked rise, the powers of the world bind themselves together to humble it and restore the balance."
 war_goal_grand_alliance_superiority: "$generic_war_goal_superiority$"
 war_goal_grand_alliance_superiority_desc: "$generic_war_goal_superiority_desc$"
 GRAND_ALLIANCE_WAR_NAME: "The Grand Alliance against $SECONDNAME$"
 AI_CURB_DOMINANCE: "The dominance of the Colossus must be curbed"

 pt_curb_european_dominance: "Curb European Dominance"
 pt_curb_european_dominance_desc: "The ascendancy our foe has won across [ShowContinentName('europe')] will be broken. By the terms of this peace, the dominance they have gathered is stripped away and the balance of the continent restored."
 pt_curb_european_dominance_entry: "Curb European Dominance"
 pt_curb_european_dominance_entry_short: "Curb European Dominance"
 pt_curb_european_dominance_tt: "Reduces the [gc_european_dominance|e] of the defeated Colossus by #Y 25#!"

 pt_curb_colonial_dominance: "Curb Colonial Dominance"
 pt_curb_colonial_dominance_desc: "The riches our foe has seized from beyond the ocean, to say nothing of their immense reach, shall be curtailed. By the terms of this peace, their colonial dominance is stripped away and their grip upon the New World loosened."
 pt_curb_colonial_dominance_entry: "Curb Colonial Dominance"
 pt_curb_colonial_dominance_entry_short: "Curb Colonial Dominance"
 pt_curb_colonial_dominance_tt: "Reduces the [gc_colonial_dominance|e] of the defeated Colossus by #Y 25#!"
 cb_free_the_mudejar: "Free the Mudéjar"
 cb_free_the_mudejar_desc: "Our [ShowReligionAdjective('sunni')] brethren in [ShowRegionName('iberia_region')] are forced to practice #italic Taqiyya#!. We must not let the [ShowReligionGroupAdjective('christian')] devil mistreat our people any longer."
 cb_claim_throne_of_naples: "Claim Throne of $naples$"
 cb_claim_throne_of_naples_desc: "We will not allow the realm of $naples$ to remain divided."
 claim_throne_of_naples: "Union with [GetCountry('NAP').GetNameWithNoTooltip]"
 claim_throne_of_naples_entry: "Claim the Throne of [GetCountry('NAP').GetNameWithNoTooltip]"
 claim_throne_of_naples_entry_short: "$claim_throne_of_naples_entry$"
 claim_throne_of_naples_desc: "Our control over parts of the [GetCountry('NAP').GetLongName] gives us sufficient justification to wage war and claim the rest for ourselves."
 war_goal_take_province_free_the_mudejar: "$generic_war_goal_take_province$"
 war_goal_take_province_free_the_mudejar_desc: "$generic_war_goal_take_province_desc$"

 cb_demand_andalusi_submission: "Demand the Submission of [GetCountry('GRA').GetNameWithNoTooltip]"
 cb_demand_andalusi_submission_desc: "The rulers of [GetCountry('GRA').GetName] have bought their independence by setting us against our rival, and they have grown comfortable in the bargain. Their armies no longer match ours. Let them acknowledge who commands [ShowLocationName('strait_of_gibraltar')] and pay for the peace they enjoy."
 war_goal_demand_andalusi_submission: "$generic_war_goal_superiority$"
 war_goal_demand_andalusi_submission_desc: "$generic_war_goal_superiority_desc$\n\nIn the peace, seizing [locations|e] costs #R twice#! the usual [war_score|e], while forcing [GetCountry('GRA').GetName] into submission costs only #G a quarter#! of it. This war is fought to bring their rulers under our authority rather than to carve up their lands."
 DEMAND_ANDALUSI_SUBMISSION_WAR_NAME: "The $NUM$$ORDER$ War for the Submission of $SECONDNAME$"

 peace_andalusi_submission: "Force the Submission of [GetCountry('GRA').GetNameWithNoTooltip]"
 peace_andalusi_submission_desc: "The rulers of [GetCountry('GRA').GetName] will set aside their independence and take their place beneath our banner, bound to us as a [ShowSubjectTypeName('taifa')] where we share their faith and as a [ShowSubjectTypeName('tributary')] where we do not."
 peace_andalusi_submission_entry: "$peace_andalusi_submission$"
 peace_andalusi_submission_entry_short: "$peace_andalusi_submission$"
