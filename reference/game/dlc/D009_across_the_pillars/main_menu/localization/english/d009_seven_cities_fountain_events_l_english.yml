l_english:

 seven_cities_fountain.1.title: "The Spring is Just a Spring"
 seven_cities_fountain.1.desc: "After two weeks of marching the column has reached the place the Taino guides describe as the Fountain of Bimini. There is a spring here, set in a clearing, the water cold and clear and faintly sulphurous. The men drink from it. The men remain exactly as old as they were yesterday. The Taino guide is questioned again, more carefully. He admits that he has never himself drunk from the spring, and that he was a child when he heard the story of it from his grandmother, who was a child when she heard it from hers. [target_leader.GetName] writes the dispatch and orders the column home."
 seven_cities_fountain.1.a: "Strike the column. There is no fountain, only a story."
 seven_cities_fountain.1.historical_info: "Ponce de Leon's 1513 voyage to Florida is conventionally associated with the search for the Fountain of Youth, but the association postdates Ponce de Leon himself; it first appears in Spanish chronicles after his death and was solidified by later historians for whom the picturesque framing was useful. The actual voyage was a routine reconnaissance mission funded by a private investor who wanted to establish a slaving post on what was then assumed to be an island. The Fountain became attached to Ponce de Leon's name because he had died young, in his fifties, of an arrow wound taken in Florida, an irony the Spanish narrators of the next generation could not resist."

 seven_cities_fountain.2.title: "A Refreshing Spring"
 seven_cities_fountain.2.desc: "The spring at the heart of the legend is real, in the modest sense that there is a spring here, set in a grove, with water of an unusual clarity and a temperature that does not vary with the season. The men report feeling refreshed when they drink from it; the physician reports the same. None of them reports any rejuvenation. The local Timucua chief speaks of the spring as a place of healing, useful for fevers and joint pain. The chronicler records this; the physicians at court will be interested. The fountain is not what the legend made it. But the spring is a thing. [target_leader.GetName] orders a shrine built on the site."
 seven_cities_fountain.2.a: "Claim the spring for [ROOT.GetCountry.GetNameWithNoTooltip]. The healing-water trade may pay."
 seven_cities_fountain.2.historical_info: "Florida is unusually rich in artesian springs, many of which were used as ceremonial and healing centres by the Timucua and other indigenous peoples of the peninsula. The European appropriation of these sites as healing or spa locations began in the eighteenth century and continues to the present in the form of the resort towns clustered around the larger springs. The medical claims made for the waters have varied over time but have rarely included rejuvenation as such; that part of the legend was always strictly European."

 seven_cities_fountain.3.title: "The True Fountain"
 seven_cities_fountain.3.desc: "The spring at the heart of the Timucua country is what the legend described, or at least it is close enough that the chronicler is unwilling to write the dispatch without rereading what he has written three times. The water is clear, cold, and faintly mineral. The men who bathe in it for a week report what the legend says they will report: their hair is not so grey, their backs are not so sore, their joints are not so stiff. Their wounds heal cleanly. The physician, who is sixty-one, tells [target_leader.GetName] that he has not felt this well since he was twenty-five. The dispatch is signed and sealed before sundown."
 seven_cities_fountain.3.a: "Our court will be told. The spring of legend is ours."
 seven_cities_fountain.3.historical_info: "The legend of waters that restore youth has a long European pedigree, going back at least to Herodotus' account of a fountain in the country of the Ethiopians whose waters carried the scent of violets and conferred unusual longevity on those who bathed in it. The Spanish transposition of the legend to Florida in the early sixteenth century was unusual not in its existence but in the institutional weight that was briefly placed on it; for most of European history the fountain has been a literary motif rather than a target of state expenditure."

