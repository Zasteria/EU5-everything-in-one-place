l_english:

 flavor_gra.7.entry: "$flavor_gra.7.title$"
 flavor_gra.7.title: "Reclamation of [ShowLocationNameWithNoTooltip('cordoba')]"
 flavor_gra.7.desc: "The [target_location.GetRank.GetName] of [target_location.GetName] has been reclaimed in the name of [ROOT.GetCountry.GetReligion.GetGodName]. Once a vital location for $ADU$, it is a place where [target_character.GetName] and the [ROOT.GetCountry.GetGovernment.GetCourtTitle] wish to restore the [ROOT.GetCountry.GetReligion.GetAdjective] influence it once had."
 flavor_gra.7.a: "We need to uphold its [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] past."
 gra_convert_cordoba_to_root_religion: "Some of the [pops|e] in [target_location.GetName] convert to [ROOT.GetCountry.GetReligion.GetName]"
 gra_cordoba_province_gains_core: "Every [location|e] in [target_location.GetProvinceDefinition.GetName]'s [province|e] becomes a [core|e] of [ROOT.GetCountry.GetName]"
 flavor_gra.7.b: "Rather than forcibly converting anyone, it is better to accept and integrate them."
 
 flavor_gra.8.entry: "$flavor_gra.8.title$"
 flavor_gra.8.title: "The Gem of [ShowRegionNameWithNoTooltip('iberia_region')]"
 flavor_gra.8.desc: "At the center of [ShowRegionName('iberia_region')] lies a [target_location.GetRank.GetName] that has long been a hub of [ShowReligionGroupAdjective('christian')], [ShowReligionGroupAdjective('muslim')], and [ShowReligionAdjective('judaism')] cultures. Now it is under our control, and the [ROOT.GetCountry.GetRank.GetName] will be able to decide its fate.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle], as well as [target_character.GetName], wish to see this [target_location.GetRank.GetNameWithNoTooltip] reach even greater heights. Efforts from all the estates have been invested in turning [target_location.GetName] into the gem of [ShowRegionNameWithNoTooltip('iberia_region')]."
 flavor_gra.8.a: "Let [ShowLocationNameWithNoTooltip('toledo')] prosper!"

 flavor_gra.17.entry: "$flavor_gra.17.title$"
 flavor_gra.17.title: "Capital of the old Caliphate"
 flavor_gra.17.desc: "The seat of [ShowLocationName('cordoba')] has long held a significant role for [ROOT.GetCountry.GetName]. Once, it was a prospering [ShowLocationRankName('city')] and the capital of [ShowRegionName('iberia_region')]; yet now its streets are filled with crime, its inhabitants curse the decay that has befallen the place, and many old sites remains in ruins after our conflicts with [ShowReligionGroupAdjective('christian')] rulers.\n\n[target_character.GetName] is not one to allow such moldering to continue. This once was a prestigious place, where the most powerful figures in [ShowContinentName('europe')] ruled, so why should [target_character.GetSheHe] not also turn this into the greatest capital the world has ever seen?"
 flavor_gra.17.a: "[ShowLocationNameWithNoTooltip('cordoba')] shall prosper once more!"
 flavor_gra.17.b: "We should keep our [ROOT.GetCountry.GetGovernment.GetCourtTitle] where it is."

 flavor_gra.21.entry: "$flavor_gra.21.title$"
 flavor_gra.21.title: "The Palace-[ShowLocationRankNameWithNoTooltip('city')] of [ShowLocationNameWithNoTooltip('cordoba')]"
 flavor_gra.21.desc: "The Fitna of the 11th century plunged the [ShowReligionGroupAdjective('muslim')] part of [ShowRegionName('iberia_region')] into chaos, and with it went many significant sites. One of them was the [ShowBuildingTypeName('madinat_al_zahra')], a great palace that covered the western outskirts of [ShowLocationName('cordoba')]. Filled with extravagant mosques, rich gardens, and well-armed barracks, it served as a beacon of superiority for the $rank_empire_muslim_ruler_male$ over the rest of the [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] world.\n\n[target_character.GetName] wishes to restore that [ShowLocationRankName('city')], placing [target_character.GetHerselfHimself] above other rulers and pretenders who may wish to challenge [target_character.GetHerHim]."
 flavor_gra.21.a: "They will see our prestige!"
 flavor_gra.21.b: "No need to restore old ruins."

 flavor_gra.22.entry: "$flavor_gra.22.title$"
 flavor_gra.22.title: "[ShowBuildingTypeNameWithNoTooltip('library_cordoba')]"
 flavor_gra.22.desc: "With the restoration of the [ShowBuildingTypeName('library_cordoba')], the people of [ShowLocationName('cordoba')] have enjoyed a new era of literary prosperity.\n\nAs in days of old, scholars from across the [ShowReligionGroupAdjective('muslim')] world visit [ShowLocationNameWithNoTooltip('cordoba')] for its rich collection of books on subjects ranging from literature, science, and theology. This in turn has brought prosperity for the citizens, who learn about distant cultures and have incorporated many of their customs into their everyday lives."
 flavor_gra.22.a: "The people of [ShowLocationNameWithNoTooltip('cordoba')] shall experience true prosperity!"
 add_pop_satisfaction_based_on_literacy: "Every [pop|e] in the [location|e] will gain [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [pop_satisfaction|e], which will scale with [pop] [literacy|e]"

 flavor_gra.23.entry: "$flavor_gra.23.title$"
 flavor_gra.23.title: "A Learning Haven for All"
 flavor_gra.23.desc: "Our liberal and innovative policies have allowed [ROOT.GetCountry.GetName] to become a haven of knowledge and wisdom. Praised by outside rulers, our progress in scholarly matters can now clearly be seen as more and more guests flock to study in our prestigious universities.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] itself is now populated with more educated members, who wish to expand this academia by removing redundant restrictions within the education system itself."
 flavor_gra.23.a: "This is progress for us!"

 flavor_gra.24.title: "Bulwark of [ShowReligionGroupNameWithNoTooltip('muslim')]"
 flavor_gra.24.desc: "News of our victory in the battle for [ShowRegionName('iberia_region')] has spread throughout the [ShowReligionGroupAdjective('muslim')] world, an achievement monumental in our continued survival against any oncoming storm. [target_character.GetName] is now praised within [ROOT.GetCountry.GetName] as a hero, a protector, and a shield against the enemies who wish to extinguish our flame."
 flavor_gra.24.a: "Let us celebrate."
 conquest_of_andalusi_integration_tt: "Conquering [locations|e] with [ShowCultureName('andalusi')] [pops|e] yields [integration|e] progress according to the presence of that [culture|e]"
