l_english:

 seven_cities_saguenay.1.title: "Donnacona Was Telling Stories"
 seven_cities_saguenay.1.desc: "After three months up the Saguenay the column has reached the country Donnacona described to Cartier sixty years ago: a country, the Stadaconan chief said, of fair-skinned men in fur cloaks, of mountains heavy with gold and rivers running silver. The actual country is rocky, wooded, and cold. There are no fair-skinned men. There is no gold in the streams. The Innu hunters the column meets are willing to trade furs and offer no theory about kingdoms further on. [target_leader.GetName] is forced to conclude that Donnacona told Cartier a story that Cartier wanted to hear, in the hope that Cartier would take Donnacona to France and let him come home alive."
 seven_cities_saguenay.1.a: "Strike the column. The kingdom was a fiction. Furs remain."
 seven_cities_saguenay.1.historical_info: "Donnacona, the chief of Stadacona at the head of the Saint Lawrence, fed Cartier a steady diet of stories about a wealthy kingdom called Saguenay in the interior of New France during the winter Cartier spent at Stadacona in 1535-36. Cartier carried Donnacona back to France as a guest of the crown; Donnacona died in France without ever seeing his home again. The Saguenay legend persisted in French exploration of the interior until the late seventeenth century, by which point the actual geography of the country, lakes, rivers, and the fur trade that came out of it, had been mapped sufficiently to retire the legend."

 seven_cities_saguenay.2.title: "A Native Confederation, Some Furs"
 seven_cities_saguenay.2.desc: "The country we have reached is not the Saguenay of legend, but it is a country worth knowing. The Innu have a loose confederation of villages along the upper river and the lakes beyond, with hunting rights extending into the boreal forest as far as the column can see. They trade in fur, dried fish, birch-bark canoes, and a small quantity of native copper from sources further north. They are willing to receive a French embassy. There is no gold, no silver, and no fair-skinned king. There is a working fur economy. [target_leader.GetName] orders a trading post built at the confluence."
 seven_cities_saguenay.2.a: "Build the post. The fur trade will pay for the voyage."
 seven_cities_saguenay.2.historical_info: "The Saint Lawrence and Saguenay watersheds were the entry points for the French fur trade that, over the course of the seventeenth and early eighteenth centuries, drew traders, missionaries, and colonists deep into the interior of North America. The trade ran on indigenous middlemen, primarily the Huron-Wendat and the Algonquin, and on a network of trading posts that gradually extended west across the Great Lakes and into the Mississippi watershed. The legend of Saguenay was, in this sense, a self-fulfilling prophecy: the country of legend was not gold but fur, and the French eventually got rich from the trade."

 seven_cities_saguenay.3.title: "The Northern Kingdom Found"
 seven_cities_saguenay.3.desc: "The country the legend described is real, and the column has reached it. Beyond the second great lake, in the country the Innu call only the cold land, there is a settlement of perhaps three thousand fair-skinned people in long fur cloaks, speaking a language no member of the column has heard before but with words the Latinist on the staff identifies as Old Norse. They have a council-house roofed in copper and a small ceremonial chamber in which gold-work of obvious northern European workmanship is displayed. They have known of our arrival on the coast for two generations and have been waiting for us to find them. The chronicler writes through the night. [target_leader.GetName] sends for reinforcements at dawn."
 seven_cities_saguenay.3.a: "Sign the treaty. A lost Christian kingdom is found at last."
 seven_cities_saguenay.3.historical_info: "The legend of a surviving Norse population in the Canadian interior has never been substantiated, despite occasional claims to the contrary. The Norse settlements in Greenland were abandoned in the fifteenth century; no archaeological evidence supports any Norse continuity into mainland North America beyond brief contacts a century or two earlier. The persistence of the legend in French exploration of the country is best explained as a transplanted version of the Norumbega and Vinland stories, which themselves descended from a single set of medieval Icelandic sagas whose actual geography had been forgotten by the time the legend reached the French court."

 seven_cities_saguenay.10.title: "The King Beyond the Rapids"
 seven_cities_saguenay.10.desc: "The young man has wintered at our court since a returning voyage carried him across the ocean, and he has learned enough of our tongue to be dangerous with it. Asked about the country above the great rapids, [target_character.GetName] describes the kingdom of the Saguenay: gold and red stones in the rock, men with skin as pale as ours who dress in cloth of wool, and, when his audience seems to want them, men with one leg and men who fly. The clerks note that the kingdom grows a new province for every doubt raised against it. It lies, he is careful to add, very far upriver, and no one will find it without him."
 seven_cities_saguenay.10.a: "Give him his passage home, and the leader's ear with it."
 seven_cities_saguenay.10.b: "Keep him at court. The tale is worth more than the teller."
 saguenay_chiefs_son_sails_tt: "[target_character.GetName] returns across the ocean as our guide and interpreter"
 seven_cities_saguenay.10.historical_info: "Jacques Cartier took the sons of the Stadaconan chief Donnacona to France in 1534 and brought them home the following year; in 1536 he took Donnacona himself, who spent his remaining years telling the French court about the kingdom of the Saguenay, its gold, its white men in woolen cloth, and, as the audiences grew grander, its one-legged men and men who flew like bats. The pattern was consistent: the kingdom acquired whatever its listeners most wanted it to have, and it always lay one river further than anyone had gone. Donnacona died in France around 1539 without seeing Stadacona again. The stories outlived him by a century and a half."

 seven_cities_saguenay.11.title: "The White Sickness"
 seven_cities_saguenay.11.desc: "It begins in the gums. The surgeon calls it the land sickness and has no remedy. The men's legs blacken and swell, old scars open as if new, teeth loosen in their sockets, and the strongest hands go down first, which no one can explain. Eight are dead and a quarter of the muster cannot stand a watch. The cold country is somewhere under our lee, and the question on the quarterdeck is whether whatever waits ashore can be crueler than what is already aboard."
 seven_cities_saguenay.11.a: "Stand in for the coast, and ask its people for help."
 seven_cities_saguenay.11.b: "Bleed the sick and hold the course."
 saguenay_annedda_cure: "#Y Our guide's kinsmen show us the tree whose bark and needles, boiled, raise dying men in days#!"
 saguenay_strangers_mercy: "#Y The mercy of strangers comes slowly, but it comes#!"
 seven_cities_saguenay.11.historical_info: "Scurvy killed a quarter of Cartier's men in the winter of 1535-36 at Stadacona before Domagaya, one of the chief's sons who had been to France, showed them how to boil the bark and needles of a tree the Iroquoians called annedda into a drink. Men who could not stand were walking within a week, and Cartier wrote that all the doctors of Louvain and Montpellier together could not have done with all their drugs what the tree did in eight days. The identity of the annedda was subsequently lost, the cure forgotten by Europe for two hundred years, and scurvy went on to kill more sailors than every naval battle in the age of sail combined."

 seven_cities_saguenay.12.title: "Diamonds at the Cape"
 seven_cities_saguenay.12.desc: "Below the grey cape at the river's turning, the shore itself glitters. The rock face is seamed with white stones that flash like cut gems, and threaded among them runs a yellow metal that takes a fine polish from a wetted thumb. By noon half the watches are ashore with barrels, and the words for what the barrels hold are already being chosen for the dispatch home. The master gunner, a miner's son, turns one yellow lump in his fingers for a long while and asks leave to speak plainly before anything is written down."
 seven_cities_saguenay.12.a: "Fill every barrel. Proof at last for the doubters at home."
 seven_cities_saguenay.12.b: "Let the miner's son strike the rock before anyone boasts."
 saguenay_barrels_ring_true: "#Y Against every precedent, the assay holds: there is true metal in the cape#!"
 saguenay_glitter_and_air: "#Y Quartz and fool's gold, a hold full of it, and the story will reach home before we do#!"
 seven_cities_saguenay.12.historical_info: "Cartier's last expedition loaded eleven barrels of gold ore and a great store of diamonds at Cap Rouge in 1542 and carried them triumphantly home, abandoning Roberval and the colony to do it. Assayed in France, the gold proved iron pyrite and the diamonds quartz, and the disappointment entered the language: #italic faux comme un diamant du Canada#!, false as a Canadian diamond, was proverbial within a generation. The cape kept the name Cap Diamant all the same, and the city of Quebec now stands on top of the joke."

 seven_cities_saguenay.13.title: "The Rendezvous at Tadoussac"
 seven_cities_saguenay.13.desc: "The canoes begin arriving the morning after we anchor, from upriver and from the far shore, riding low under bales of winter fur. It is a rendezvous, the interpreter explains: the peoples of the cold country meet at this river mouth every year to trade before the ice comes, and they have taken our sails for the biggest trading canoe ever built. The clerk turns over a beaver pelt, then another, then puts down his pen for arithmetic of a different kind. The kingdom of gold may be a rumor, he says. The beaver are not."
 seven_cities_saguenay.13.a: "Open the holds and trade. Legends keep; furs sell."
 seven_cities_saguenay.13.b: "We did not cross an ocean to chase beaver. Upriver!"
 seven_cities_saguenay.13.historical_info: "Tadoussac, at the mouth of the Saguenay, was a trading rendezvous long before any European post stood there: Innu and Algonquin bands met at the river mouth each season to exchange furs and copper, and the first French ships simply moored themselves into an existing market. Pierre de Chauvin built France's first permanent trading post there in 1600, years before Quebec was founded. The kingdom of the Saguenay was never found up the river, but the furs that came down it funded New France for two centuries, which is more than most real kingdoms have managed."

