l_english:
 goods_camels.1.title: "The Great Desert Caravan"
 goods_camels.1.desc: "A consortium of merchants operating out of [ROOT.GetCountry.GetCapital.GetName] has proposed organizing a grand desert caravan to link our markets to distant trading partners across the arid hinterlands.\n\nThe venture promises considerable profits in [ShowGoodsName('camels')] and related goods, but securing the route and providing guards will require significant [ROOT.GetCountry.GetGovernment.GetAdjective] backing. The merchants are eager, and waiting for our answer."
 goods_camels.1.a: "We will back this venture."
 goods_camels.1.b: "They may proceed, at a price."

 goods_camels.2.title: "Breeds of Distinction"
 goods_camels.2.desc: "Our desert breeders in [target_location.GetName] report that years of careful selection have produced a strain of camel notable for its strength, endurance, and ability to carry heavier loads without requiring more water.\n\nThey request [ROOT.GetCountry.GetGovernment.GetAdjective] patronage to expand the program and establish dedicated herding grounds. Our cavalry commanders, meanwhile, have a competing proposal: that the finest animals be distributed among the desert cavalry instead."
 goods_camels.2.a: "Fund the breeding program."
 goods_camels.2.b: "Distribute the finest animals to our cavalry."

 goods_camels.3.title: "When the Wells Run Dry"
 goods_camels.3.desc: "A severe drought has gripped our desert territories. Wells are failing, crops are withering, and the people suffer.\n\nIn these dire conditions, camels have become the only reliable means of moving goods, water, and people across the wasteland. The question before [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is whether to reserve the herds for internal relief, or to seize the moment and sell to desperate foreign buyers at elevated prices."
 goods_camels.3.a: "Prioritize our own people first."
 goods_camels.3.b: "Export at elevated prices while demand is high."

 goods_camels.4.title: "The Pilgrim Road"
 goods_camels.4.desc: "Large numbers of religious pilgrims are passing through [ROOT.GetCountry.GetName] on their way to distant holy sites, and they are hungry for camels to carry their provisions through the desert.\n\nThe pilgrims speak of divine blessing for those who aid their passage. Our traders, however, see an opportunity to charge handsomely for the service."
 goods_camels.4.a: "Assist the pilgrims freely."
 goods_camels.4.b: "Charge them for the privilege."

 goods_camels.5.title: "Raiders on the Caravan Road"
 goods_camels.5.desc: "Nomadic raiders have begun preying upon camel caravans crossing our territory, killing merchants, stealing animals, and disrupting trade.\n\nThe caravan masters demand action, or they will reroute their trains through safer lands, taking their coin elsewhere. We must decide between a costly military solution and a more pragmatic arrangement with the raiders themselves."
 goods_camels.5.a: "Send military escorts along the caravan roads."
 goods_camels.5.b: "Negotiate safe passage with the raiders."

 goods_camels.6.title: "The General's Proposal"
 goods_camels.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s most experienced desert commander has submitted a formal proposal to incorporate camelry units throughout the military.\n\nCamels, he argues, can outmaneuver horses in arid terrain, carry greater supply loads, and endure conditions that leave warhorses spent. The proposal is sound, but not everyone in the officer corps is ready to abandon the prestige of cavalry."
 goods_camels.6.a: "Adopt camelry doctrine across the military."
 goods_camels.6.b: "Our cavalry has served us well. Keep the horses."

 goods_camels.7.title: "The Foreign Demand"
 goods_camels.7.desc: "Foreign merchants have arrived at our markets with considerable silver, seeking to purchase large numbers of camels for use in distant armies and trading expeditions. Their offers are generous.\n\nHowever, exporting so many animals would inevitably weaken our own production and supply, and some advisors warn that well-mounted foreign armies may one day be used against us."
 goods_camels.7.a: "Open the trade. Let the silver flow."
 goods_camels.7.b: "Restrict the export of camels."

 goods_camels.8.title: "The Glut of the Herds"
 goods_camels.8.desc: "Years of expanding camel breeding have at last yielded an unexpected problem: there are simply too many camels.\n\nThe markets are saturated, prices have collapsed, and the animals are consuming fodder faster than the desert can replenish it. Something must be done. We can cull the surplus herds to restore balance, or seek out new markets abroad to absorb the excess, at some cost and considerable diplomatic effort."
 goods_camels.8.a: "Cull the surplus. Better a smaller herd than ruin."
 goods_camels.8.b: "Send envoys to find new buyers abroad."

 goods_camels.9.title: "A Diplomatic Incident"
 goods_camels.9.desc: "During a formal reception at court, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s prized show camel, brought out to impress the assembled guests, has taken a profound and apparently personal dislike to [target_character.GetName] of the [offended_country.GetLongName]. Without warning, it deposited the full contents of its stomach directly onto [target_character.GetHerHis] ceremonial robes.\n\n[target_character.GetSheHe|U] is incandescent with fury, and [target_character.GetHerHis] retinue has already begun drafting a letter of formal protest."
 goods_camels.9.a: "Our deepest apologies. And our treasury, apparently."
 goods_camels.9.b: "The beast is simply an astute judge of character."

 goods_camels.10.title: "The Grand Camel Beauty Contest"
 goods_camels.10.desc: "The nobility of [ROOT.GetCountry.GetCapital.GetName] has organized what they insist is a perfectly legitimate and culturally significant camel beauty contest. Substantial sums have been wagered.\n\nTwo powerful noble families are now on the brink of a feud over whether a long neck or a well-shaped hump is the superior attribute in a prize camel. [ROOT.GetCountry.GetGovernment.GetRuler.GetName]'s personal judgment has been requested as the decisive tie-breaker. The contestants, and their camels, are assembled and waiting."
 goods_camels.10.a: "A ruler must serve their people in all things."
 goods_camels.10.b: "I have rather more pressing matters to attend to."
