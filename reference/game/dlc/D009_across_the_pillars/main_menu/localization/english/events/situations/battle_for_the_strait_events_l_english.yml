l_english:
 battle_for_the_strait_events.1.title: "The Battle for the Strait"

 battle_for_the_strait_events.1.desc_cas: "The parias of [target_gra_country.GetName] come north on schedule. So do the envoys, with grievances long enough to wear out the chamberlain of our [target_cas_country.GetGovernment.GetCourtTitle]. Yet south of the Sierra Morena the throne still stands, and the Reconquista that began at Covadonga remains unfinished while [target_gra_ruler.GetName] holds court in the [ShowBuildingTypeName('alhambra')].\n\nThis last stretch will not be the work of one campaign. The bishops have wanted a crusade for two generations. The great houses, more practically, want a chance at the conquered grants that will follow one. Our task is to keep both pushing in the same direction long enough for the throne in [target_gra_country.GetNameWithNoTooltip] to crack."

 bfts_intro_tt: "Enables the #Y $influence_over_granada$#! mechanic with #Y 4#! thresholds that grant bonuses to either side"

 battle_for_the_strait_events.1.desc_mor: "Across the strait, the [target_cas_country.GetGovernment.GetRulerTitle] of [target_cas_country.GetName] turns the screw on [target_gra_country.GetName] one parias payment at a time. The letters from the [target_gra_country.GetGovernment.GetCourtTitle] arrive by the month now, sometimes by the week. They ask for gold, but what they need is for our [target_mor_country.GetGovernment.GetRulerTitle] to take the war to its source.\n\nThis is the work of more than one reign. The [target_mor_country.GetGovernment.GetEstateName('clergy_estate')] of our cities have been arguing the case for #italic jihād#! since the loss of the last Almohad caliph. Leave the war to our heirs and we leave it to graves long after our own."

 battle_for_the_strait_events.1.desc_gra: "We sit between two hammers, and both of them are smiling. From the north, the [target_cas_country.GetGovernment.GetRulerTitle] of [target_cas_country.GetName] takes parias year by year and waits for the faith of [target_gra_country.GetName] to crack on its own. The [target_mor_country.GetGovernment.GetRulerTitle] of [target_mor_country.GetName] sends offers across the strait wrapped in the language of #italic jihād#!, and the price written underneath each gift is the same: the eventual surrender of our throne to his.\n\nThis is how a #italic ṭā'ifa#! falls. Not at once, not under one army, but gradually, as the [target_gra_country.GetGovernment.GetCourtTitle] loses the habit of refusal. We have held longer than most. Our task in the years ahead is to outlast the patience of one neighbor and the ambition of the other, and to make sure the records of [target_gra_country.GetNameWithNoTooltip] read longer than those of every #italic ṭā'ifa#! that gave way."

 bfts_explain_granadan_sovereignty_tt: "Enables [granadan_sovereignty|e] via the panel of the [situation|e]"

 battle_for_the_strait_events.1.desc_christian: "Word reaches us that [target_cas_country.GetName] is turning the full machinery of its [target_cas_country.GetFlavorRank] against [target_gra_country.GetName], the last [ShowReligionGroupAdjective('muslim')] throne on the peninsula. We have not seen pressure of this weight aimed south since the campaigns of Fernando III.\n\nThe outcome will reach past our borders. A [target_cas_country.GetAdjectiveWithNoTooltip] victory closes the Reconquista on terms set in [ShowLocationName('toledo')], with the southern provinces passing under one crown. If the [target_mor_country.GetGovernment.GetRulerTitle] of [target_mor_country.GetName] answers from across the strait in earnest, we could find [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] galleys back in our shipping lanes for the first time in a century. Either way, the map of [ShowRegionName('iberia_region')] that comes out of this will not be the one we know."

 battle_for_the_strait_events.1.desc_muslim: "The [target_mor_country.GetGovernment.GetRulerTitle] of [target_mor_country.GetName] has turned [target_mor_ruler.GetHisHer] gaze north. [target_gra_country.GetName], the last [ShowReligionGroupAdjective('muslim')] throne in [ShowFormableCountryName('ADU_f')], is being squeezed parias by parias by the [target_cas_country.GetGovernment.GetRulerTitle] of [target_cas_country.GetName], and every Friday sermon in [ShowRegionName('maghreb_region')] names the cause.\n\nThe contest is ours to follow, whatever our borders. If [target_mor_country.GetNameWithNoTooltip] lifts the throne in [target_gra_country.GetNameWithNoTooltip], the #italic khuṭba#! may be read in the name of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] as far north as [ShowLocationNameWithNoTooltip('cordoba')] within our lifetimes. If the [target_cas_country.GetAdjectiveWithNoTooltip] [target_cas_country.GetGovernment.GetRulerTitle] succeeds in pressing the [target_gra_country.GetFlavorRank] under [target_cas_ruler.GetHisHer] cross, then the last foothold of [ShowFormableCountryNameWithNoTooltip('ADU_f')] closes, and a chapter that ran from the days of Ṭāriq ibn Ziyād ends in our generation."

 battle_for_the_strait_events.1.option_cas: "[ShowRegionNameWithNoTooltip('iberia_region')] shall answer to a [ShowReligionGroupAdjectiveWithNoTooltip('christian')] crown."
 battle_for_the_strait_events.1.option_mor: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] shall return to the Caliphate."
 battle_for_the_strait_events.1.option_gra: "We will outlast both ambitions."
 battle_for_the_strait_events.1.option_christian: "The fate of [ShowRegionNameWithNoTooltip('iberia_region')] is bound up in this contest."
 battle_for_the_strait_events.1.option_muslim: "The fate of [ShowFormableCountryNameWithNoTooltip('ADU_f')] hangs upon this contest."

 battle_for_the_strait_events.2.title: "The Reconquista is Won"
 battle_for_the_strait_events.2.desc: "The last Friday prayer is said in [ShowLocationName('granada')] without an answering bell. Within the hour, the building's eastern wall is being measured for an apse. Our [target_ruler.GetName] has lived to see the work that the kings of Asturias began. The Reconquista is complete.\n\nThis is the kind of ending that splits the chronicles. From this year forward, Iberian time will be measured as #italic before Granada#! and #italic after#!. Our crown holds the date that ends the reckoning, and that is the only honor that does not need explanation."
 battle_for_the_strait_events.2.a: "The cross stands over the strait."

 battle_for_the_strait_events.3.title: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] Returns to the Faithful"
 battle_for_the_strait_events.3.desc: "The cause of [ShowFormableCountryName('ADU_f')] has been answered. [target_cas_country.GetName]'s pressure on the [GetCountry('GRA').GetFlavorRank] has broken, and the parias gathered for generations are being repaid in full. Our [target_ruler.GetName] stands as the recognized protector of the last [ShowReligionGroupAdjective('muslim')] throne on the peninsula, and [target_ruler.GetHisHer] name is carried in the Friday prayers across [ShowRegionName('maghreb_region')] and into [ShowLocationName('granada')] itself.\n\nThe Marinid Caliphate is proclaimed anew under our crown. The #italic bay'ah#! of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] has named our house the patron of [ShowFormableCountryNameWithNoTooltip('ADU_f')], which carries an expectation as much as a title: the non-Muslim communities now sheltering under our protection are wards of our throne, and our reign will be judged by how they fare. The work the great Almohads left half-finished resumes at our hand."
 battle_for_the_strait_events.3.a: "Our banner flies on both shores of the strait."
 bfts_andalus_formation_eased_tt: "We may now form [ShowFormableCountryNameWithNoTooltip('ADU_f')] while controlling #G fewer#! [ShowRegionNameWithNoTooltip('iberia_region')] territories"

 battle_for_the_strait_events.4.title: "The Throne of [GetCountry('GRA').GetNameWithNoTooltip] Endures"
 battle_for_the_strait_events.4.desc: "The [target_cas_country.GetAdjective] crown has stopped sending demands. After last summer's fleet failed to cross from the [target_mor_country.GetAdjective] ports, no second muster was attempted. The throne in [target_gra_country.GetCapital.GetName] still has the same occupant it began with. Our [target_ruler.GetName] has done what no one at our [target_gra_country.GetGovernment.GetCourtTitle] thought possible in two generations: outlasted the contest entirely.\n\nThis is the harder ending. Conquest closes a chapter cleanly, but endurance only keeps the book open. The lesson for our successors is not victory but stamina, and the records will show that [target_gra_country.GetName] was the emirate that refused to fall on schedule."
 battle_for_the_strait_events.4.a: "Granada stands free."
 bfts_reconquest_cb_unlocked_tt: "We may now fabricate the [ShowCasusBelliName('cb_reconquer_iberia')] to reclaim the lands of [ShowRegionName('iberia_region')] at reduced cost"
 bfts_iberia_fully_integrated_tt: "Every [location|e] we hold in [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')], and [ShowAreaName('murcia_area')] is elevated to [core|e] [integration|e] status"
 bfts_taifa_annexation_boosted_tt: "Every [ShowSubjectTypeName('taifa')] we are currently annexing gains #G 25%#! [annexation|e] progress"

 battle_for_the_strait_events.5.title: "The $battle_for_the_strait$ Concludes"

 battle_for_the_strait_events.5.desc_cas: "The years have passed. Generations of envoys have come and gone from our [target_cas_country.GetGovernment.GetCourtTitle], and twice now the carts of parias have arrived late and short, with apologies that wear the same phrases as a generation ago. Our [target_ruler.GetName] will not see [ShowLocationName('granada')] under our cross.\n\nWe built the great machine for a war we did not finish. The frontier forts came down. Many of the [ShowCultureName('andalusi')] we brought into our chancellery now have grandsons at desks of their own. Neither the bishops nor the great houses have given up. They want a crusade or new grants of land. Most of them, frankly, want both. The years for closing it have run out, and what we leave for our heirs is a half-finished argument and a peninsula still divided."

 battle_for_the_strait_events.5.desc_mor: "Another age dawns, and the call across the strait is the same one our grandfathers found: a call. Our fleets have sailed home unbloodied a dozen times. The [target_mor_country.GetGovernment.GetEstateName('clergy_estate')] who have argued for #italic jihād#! every Friday for two generations are now too old to argue. Our [target_ruler.GetName] will not be the one who carries the banner across.\n\nIt is not the [target_cas_country.GetAdjective] crown that beat us. The Reconquista is no closer to its end than the Almohad restoration is to its rebirth. We worked the strait every way that worked once, and most of those ways did work. The pieces moved. The board did not break. What our ancestors began under the great Almohads passes to our successors no closer to its conclusion."

 battle_for_the_strait_events.5.desc_gra: "Two ages have come, and the [target_gra_country.GetGovernment.GetRulerTitle] of [target_gra_country.GetName] still sits a throne. That is the smallest possible victory and the largest possible miracle, depending on whose chronicles one reads. Our [target_ruler.GetName] has done neither what [target_cas_country.GetName] feared nor what [target_mor_country.GetName] hoped, but only what was needed.\n\nWhat we built to survive was always meant to outlast either hammer. The [ShowBuildingTypeName('alhambra')] has grown through every season of the contest, and the #italic jinetes#! are still in the saddle. The play of two patrons against one another wore them both out before it wore us out. We did not close the contest. We waited it out. The next age will test what we were waiting for."

 battle_for_the_strait_events.5.option_cas: "The work is left to those who follow us."
 battle_for_the_strait_events.5.option_mor: "The call shall be raised again in time."
 battle_for_the_strait_events.5.option_gra: "We endure."

 battle_for_the_strait_concludes_tt: "Concludes the [ShowSituationName('battle_for_the_strait')]"
 enable_extra_modifier_crown_castile_reform_tt: "This will empower our [ShowGovernmentReformName('crown_castile_reform')] [government_reform|e]"

 bfts_dominate_iberia_golden_century_tt: "Enables the $gc_decision.title$ [decision|e] that activates the [ShowSituationName('golden_century')] [situation|e]"


 # ===== Battle for the Strait (migrated from battle_for_the_strait_l_english.yml) =====
 battle_for_the_strait_events.21.title: "The [ShowCultureNameWithNoTooltip('andalusi')] Come Home"
 battle_for_the_strait_events.21.desc: "News reaches the Mudéjar families of [ShowRegionName('iberia_region')] along the trade roads and the bonds of kinship. Our [ROOT.GetCountry.GetFlavorRank] offers shelter to those who would live under our law. From [target_province_origin.GetName], where [ShowCultureName('andalusi')] families have endured a generation under [ShowReligionGroupAdjective('christian')] rule, caravans gather at the frontier.\n\nThey cross carrying prayer books, the keys to houses they may never see again, and letters of introduction to the merchants of our markets. Within months they will be settled in [target_province_destination.GetName], rebuilding the lives that the Reconquista has interrupted."
 battle_for_the_strait_events.21.a: "Welcome them."
 battle_for_the_strait_events.21.historical_info: "The term #italic mudajjan#! ('permitted to remain') gave Castilian and Aragonese chanceries the word 'Mudéjar' for the Muslim communities left in place after the great conquests of the thirteenth century. From the Tagus to the Ebro, entire towns of farmers, artisans, and scholars continued to till old fields and pray in their old mosques even after the cross had been hoisted above the cathedral doors.\n\nTheir position was always precarious. Periodic expulsions, ruinous taxes, and the steady pressure of forced conversion drove successive waves southward toward the last Andalusi realm, where the Nasrid emirs welcomed them with grants of land and the promise of life under Islamic law. Each arrival deepened Granada's cultural memory of the lost #italic taifas#! and renewed the kingdom's claim to be the heir of al-'Andalus."
 battle_for_the_strait_events.22.title: "The Shadhili Order Arrives"
 battle_for_the_strait_events.22.desc: "A delegation of Shadhili shayḵs arrives at our [ROOT.GetCountry.GetGovernment.GetCourtTitle], sent from the great #italic zawiyas#! of [ShowLocationName('sale')] and [ShowLocationName('tetouan')] with letters of introduction from the chamber of the [GetCountry('MOR').GetGovernment.GetRulerOrRegent.GetDynasty.GetName] [GetCountry('MOR').GetGovernment.GetRulerTitle]. They are urbane scholars, not desert mystics, men trained in the law and the #italic Hikam#! of Ibn Ata Allah, comfortable at the tables of merchants and at the doors of palaces alike.\n\nThey carry a proposal. With our patronage, they will establish a #italic zawiya#! in our [ROOT.GetCountry.GetFlavorRank] and lend their network across the Strait to our affairs. Their presence at our [ROOT.GetCountry.GetGovernment.GetCourtTitle] will shift the balance of voices toward the [ROOT.GetCountry.GetReligiousSchool.GetName] school of [ShowSocietyDirectionName('jurisprudence')], and the saintly authority they bring is one of the few currencies we may yet spend that the [ShowReligionGroupAdjective('christian')] kingdoms cannot match. The decision to fund them, when and how, will remain ours to make."
 battle_for_the_strait_events.22.a: "Welcome them to our [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 battle_for_the_strait_events.22.a.entry: "Welcome them to our court."
 battle_for_the_strait_events.22.entry: "$battle_for_the_strait_events.22.title$"
 dmc_arrival_intro: "[converted_character.GetName] arrives at our [ROOT.GetCountry.GetGovernment.GetCourtTitle], surrendered to us by [GetCountry('GRA').GetName] under the weight of our demand. The waters of baptism are administered before our cathedral chapter, and [converted_character.GetHerHis] new [ShowReligionGroupAdjective('christian')] name is entered in the rolls of our service."
 battle_for_the_strait_events.30.title: "A Convert at Our [actor.GetGovernment.GetCourtTitle]"
 battle_for_the_strait_events.30.desc_centralization: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] proves a useful servant in the chancery. The convert's account of how [GetCountry('GRA').GetAdjectiveWithNoTooltip] offices manage tax and tribute reaches our ministers, and the crown's hand presses heavier on the great houses who would not have yielded to such measures themselves."
 battle_for_the_strait_events.30.desc_innovative: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] carries letters, treatises, and reckoning tables in [converted_character.GetHerHis] saddlebags, the inheritance of the libraries of [ShowLocationName('cordoba')]. Our scholars find new lines of inquiry opened to them through what was once a closed tongue."
 battle_for_the_strait_events.30.desc_estate_nobles: "$dmc_arrival_intro$\n\nThe lineage of [converted_character.GetNameWithNoTooltip] wins [converted_character.GetHerHis] a place among the [actor.GetGovernment.GetEstateName('nobles_estate')], whose elders welcome a new house bound to their interests by ties of conversion."
 battle_for_the_strait_events.30.desc_estate_clergy: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] joins the ranks of the [actor.GetGovernment.GetEstateName('clergy_estate')] as a learned voice, [converted_character.GetHerHis] knowledge of #italic Sharī'ah#! lending unexpected weight to debates in the cathedral chapter."
 battle_for_the_strait_events.30.desc_estate_burghers: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] enters the [actor.GetGovernment.GetEstateName('burghers_estate')] of our trading cities, where ledgers and warehouses open to a new convert who knows the routes south to [ShowRegionName('maghreb_region')]."
 battle_for_the_strait_events.30.desc_estate_peasants: "$dmc_arrival_intro$\n\nOur [ROOT.GetCountry.GetGovernment.GetCourtTitle] has no place for the standing [converted_character.GetSheHe] once held south of the frontier, and [converted_character.GetNameWithNoTooltip] is settled among the [actor.GetGovernment.GetEstateName('peasants_estate')] of our heartland."
 battle_for_the_strait_events.30.desc_child_tutor: "$dmc_arrival_intro$\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] appoints [converted_character.GetNameWithNoTooltip] tutor to our heir, [actor.GetGovernment.GetHeir.GetName]. The lessons of [converted_character.GetHerHis] former masters in [GetCountry('GRA').GetNameWithNoTooltip] pass to a [ShowReligionGroupAdjective('christian')] child, who absorbs astronomy, accountancy, and the art of governance from a teacher who knows all three."
 battle_for_the_strait_events.30.desc_administrators: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] takes a place in our chancery, and [converted_character.GetHerHis] command of [ShowCultureGroupName('arabic_group')] ledgers and the trade routes of [ShowRegionName('maghreb_region')] passes to our merchants. The houses of our cities find new partners, and new debtors, across the strait."
 battle_for_the_strait_events.30.a: "A useful soul gained for the faith."
 battle_for_the_strait_events.31.title: "[actor.GetNameWithNoTooltip] Imposes Vassalage on [GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.31.desc: "The matter is done. We have bound [GetCountry('GRA').GetName] to our sphere as a vassal, and now that the seals have dried no protest from their end will unmake the parchment.\n\nAcross the strait the meaning is plain enough. The [GetCountry('GRA').GetFlavorRank] no longer charts its own course, and the figureheads of [GetCountry('GRA').GetNameWithNoTooltip] must learn to kneel where once they ruled. Some will swallow the bond and serve us faithfully; others will nurse the quiet hope of one day breaking free. Either way the struggle for the strait has tilted greatly in our favor, and we mean to press the advantage."
 battle_for_the_strait_events.31.a: "So it is sealed."
 battle_for_the_strait_events.32.title: "[GetCountry('MOR').GetNameWithNoTooltip] Enforces Tribute on [GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.32.desc: "We have successfully pressed [GetCountry('GRA').GetName] into tribute, and the terms are settled before their diplomats can muster a protest. The coffers of the [GetCountry('GRA').GetFlavorRank] are opened to our inspectors, and the weight of the levy ripples across the strait.\n\nThe [GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] of [GetCountry('GRA').GetNameWithNoTooltip] reckons the gold that will sail south to us each season and counts the cost in silence. Whether the [GetCountry('GRA').GetFlavorRank] stays bound to our sphere or breaks the yoke, the long contest for the strait now bends toward its reckoning."
 battle_for_the_strait_events.32.a: "Let the coffers be counted."

 battle_for_the_strait_events.61.title: "[GetCountry('CAS').GetNameWithNoTooltip] Renews the Parias of [GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.61.desc: "The tribute is restored without a blade drawn. Our envoys have pressed the case in [GetCountry('GRA').GetName] until the terms were signed, and the old parias are entered again in the rolls of the [GetCountry('GRA').GetFlavorRank].\n\nEach season the gold will travel north to our treasury, and with it the quiet understanding that the [GetCountry('GRA').GetFlavorRank] holds its throne at our sufferance. The [GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] of [GetCountry('GRA').GetNameWithNoTooltip] count the sum and say nothing. Whether they bear the weight or throw it off, the contest for the strait draws nearer its end."
 battle_for_the_strait_events.61.a: "Let the rolls be drawn up."

 # ===== STUBS - generic recurring events =====
 battle_for_the_strait_events.40.title: "Imposed Shackles"
 battle_for_the_strait_events.40.desc_cas: "It is an unfortunate fate that we exist under the banner of [target_cas_country.GetName] and the graces of [target_cas_ruler_regent.GetName]. Recent developments and border conflicts have led the [target_cas_country.GetFlavorRank] to demand fresh reassurances of our status, set down for all to see. Their envoys speak of friendship, but the coin and concessions they expect tell another story. To bend is to surrender a little more of our standing, and to refuse is to invite their riders across our fields once more."
 battle_for_the_strait_events.40.desc_mor: "It is an unfortunate fate that the [target_mor_country.GetFlavorRank] looks upon us as a junior partner. The letters from [target_mor_ruler_regent.GetName] of [target_mor_country.GetName] speak of brotherhood in the faith, yet they ask the same as our other neighbor: reassurances of our deference, dressed up as the natural order between the strong and the weak. Their fleets and their gold have shielded us before, and they will not let us forget it. To accept their terms is to drift further into their shadow, and to deny them is to wonder whether the next fleet arrives as a friend at all."
 battle_for_the_strait_events.40.a: "Give assurances at the expense of our sovereignty..."
 battle_for_the_strait_events.40.b: "Pay off their diplomats."
 battle_for_the_strait_events.40.c: "Their empty threats fall on deaf ears!"

 battle_for_the_strait_events.41.title: "The Ambitions of [target_character_1.GetNameWithNoTooltip]"
 battle_for_the_strait_events.41.desc: "For quite some time [target_character_1.GetName] has exercised unprecedented influence in our [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Recent developments have placed still more authority in [target_character_1.GetHerHis] hands, and even [target_character_2.GetName] fears a loss of power. Such ambitions fester even in the brightest and kindest of minds, and a servant grown this powerful is not easily set aside. Left unchecked, [target_character_1.GetShortNameWithNoTooltip] may come to rule in all but name, yet reined in too harshly, we risk turning a capable minister into a bitter enemy."
 battle_for_the_strait_events.41.a: "[target_character_1.GetSheHe|U] is doing a good job!"
 battle_for_the_strait_events.41.b: "[target_character_1.GetShortNameWithNoTooltip], you are fired!"

 battle_for_the_strait_events.42.title: "Mercantile Traffic"
 battle_for_the_strait_events.42.desc: "For centuries [target_country.GetName] has been a vital stop for merchants traveling from the coasts of [ShowRegionName('italy_region')] and as far as the markets of the [ShowRegionName('sahel_region')]. Of late the business has been good, and a healthy influx of coin is marked down in our ledgers! [ShowGoodsName('silk')], [ShowGoodsName('sugar')], and [ShowGoodsName('fruit')] move through our warehouses faster than the clerks can tally them, and every faction at our [ROOT.GetCountry.GetGovernment.GetCourtTitle] has its own notion of where the surplus ought to go. Now we must decide where it is best spent."
 battle_for_the_strait_events.42.a: "Invest the excess coin in our infrastructure."
 battle_for_the_strait_events.42.b: "Patronize artists and science."
 battle_for_the_strait_events.42.c: "Give the money to the people."
 battle_for_the_strait_events.42.d: "Enrich the treasury."
 battle_for_the_strait_events.42.e: "Use the coin to project our splendor and sovereignty!"
 
 battle_for_the_strait_events.43.title: "Our Influence Over [target_gra_country.GetNameWithNoTooltip]"
 battle_for_the_strait_events.43.desc: "The ongoing struggle across the strait has placed [target_gra_country.GetName] in the middle of fierce and brutal fighting. It is of little comfort that the [target_gra_country.GetFlavorRank] is wealthy and full of educated folk, for that only makes it a greater prize. Our rivals court its [target_gra_country.GetGovernment.GetRulerTitle] with gold and fair words even as their armies march, and a throne that leans the wrong way could close the crossing to us for a generation. We must enforce our influence now, even at the expense of good relations, lest we risk it falling deeper into the hands of our enemies."
 battle_for_the_strait_events.43.a: "We must project strength."
 battle_for_the_strait_events.43.b: "Let us not rock the boat."

 battle_for_the_strait_events.44.title: "Emergence of a Polymath"
 battle_for_the_strait_events.44.desc: "It is widely known that the [target_gra_country.GetLongName] is home to great works of learning and enlightened minds. Its latest example is none other than [target_polymath.GetName], a scholar of the clergy whose name is spoken from [target_location.GetName] to our own [ROOT.GetCountry.GetGovernment.GetCourtTitle]. A mind such as this is worth more than any fortress. Yet [target_polymath.GetHerHis] talents are offered to our [target_root_country.GetFlavorRank] on one condition, that we acknowledge [target_gra_country.GetNameWithNoTooltip] as a sovereign peer of ours..."
 battle_for_the_strait_events.44.a: "[target_polymath.GetSheHe|U] is worth the diplomacy!"
 battle_for_the_strait_events.44.b: "Leverage our political influence!"
 battle_for_the_strait_events.44.c: "We will rely on superior [target_root_country.GetAdjectiveWithNoTooltip] minds!"
 target_polymath_resides_in_target_gra_country: "[target_polymath.GetName] will maintain [target_polymath.GetHerHis] residence in [target_location.GetName]"

 battle_for_the_strait_events.45.title: "Religious Curiosities"
 battle_for_the_strait_events.45.desc: "How lovely the [ShowReligionGroupAdjective('christian')] ceremonies are, their iconography and their vibrant priestly attire. What might be the meaning behind their verses, their texts, and the deeper understanding of their version of the divine?\n\nSuch questions occupy the mind of [target_root_ruler.GetName]. [target_root_ruler.GetSheHe|U] has taken to receiving foreign clerics in private and lingering over their books long into the night. This is frowned upon across the [target_root_country.GetFlavorRank], and the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have begun to whisper of where such curiosity might lead."
 battle_for_the_strait_events.45.a: "Curiosity is but an expression of humanity!"
 battle_for_the_strait_events.45.b: "Avert his gaze towards matters elsewhere!"

 battle_for_the_strait_events.46.title: "Scientific Endeavors"
 battle_for_the_strait_events.46.desc: "Since childhood [target_character.GetName] has exhibited an aptitude for the sciences. The shape of flowers, the bees, colors, and the various phenomena of nature are but some of the topics [target_character.GetSheHe] has pursued with intent to decipher. Such inclination makes the [ROOT.GetCountry.GetGovernment.GetRulerTitle] a natural patron of #italic madrasas#! and libraries, forever chasing knowledge across the shelves. Astronomers and physicians have rarely found so willing a patron, though every hour given to their work is an hour taken from the business of rule."
 battle_for_the_strait_events.46.a: "Patronize the institution of [target_university_location.GetNameWithNoTooltip]!"
 battle_for_the_strait_events.46.b: "The sacred texts!"
 battle_for_the_strait_events.46.c: "[target_character.GetShortNameWithNoTooltip] is no longer a child!"
 ruler_will_study_tt: "[target_character.GetShortName] will study matters of..."
 target_character_studies_admin: "...administration"
 target_character_studies_diplomacy: "...diplomacy"
 target_character_studies_war: "...war"

 battle_for_the_strait_events.47.title: "The Influence of [target_character_1.GetNameWithNoTooltip]"
 battle_for_the_strait_events.47.desc_a: "Despite the turbulent and shaky position of our [ROOT.GetCountry.GetFlavorRank], the recent rulings and conduct of [target_character_1.GetName] are a shining example of our prudent policies and a promise that our sovereignty is respected. Where others see a throne hemmed in and waiting to fall, [target_character_1.GetShortNameWithNoTooltip] has shown a steady hand, and word of it carries to friend and rival alike. A cabinet led so well is itself an argument that we are no one's to command."
 battle_for_the_strait_events.47.desc_b: "One would assume that serving in one's government is a post associated with righteousness and honor, to serve the people should be the highest calling of an office as prestigious as that of [target_character_1.GetName].\nThe reality, however, is quite the opposite! [target_character_1.GetShortNameWithNoTooltip] is a thorn in the side of [target_character_2.GetName], often going out of [target_character_1.GetHerHis] way to enrich [target_character_1.GetHerselfHimself] at our expense. Offices are sold, favors are traded, and the petitioners who cannot pay are left waiting at the door. We can ill afford a minister who fills [target_character_1.GetHerHis] own purse before the treasury."
 battle_for_the_strait_events.47.a: "A shining example!"
 battle_for_the_strait_events.47.b: "Just a maggot crawling on the pile..."

 # ===== STUBS - unique / DHE one-shots =====
 battle_for_the_strait_events.50.entry: "The Cautionary Tale of Abu Abdallah ibn al-Hakim al-Rundi"
 battle_for_the_strait_events.50.title: "The Cautionary Tale of [target_dead_guy.GetShortNameWithNoTooltip]"
 battle_for_the_strait_events.50.desc: "The chroniclers still tell of [target_dead_guy.GetName], the [ROOT.GetCountry.Custom('GetHeadOfCabinetName')] who once held the two seals of state and ruled our forebears in all but name, until the city rose against him. A frenzied mob stormed his palace, struck him down, and defiled his body so that no grave ever held him. That same shadow now falls across our own [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetName] has gathered the offices of government into a single grip, and the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] mutter that no servant should stand so near the throne. We may lean on [target_character.GetShortNameWithNoTooltip] and the order such a hand brings, or break the council before it learns to rule without us."
 battle_for_the_strait_events.50.a: "We need more men like [target_character.GetShortNameWithNoTooltip]."
 battle_for_the_strait_events.50.a.entry: "We need more men like him."
 battle_for_the_strait_events.50.b: "A mob? Psycho? Better not."
 battle_for_the_strait_events.50.c: "Let matters rest as they are."
 status_quo_preserved_tt: "#italic The status quo will be preserved#!"
 battle_for_the_strait_events.50.historical_info: "Abu Abdallah ibn al-Hakim al-Rundi, born in Ronda in 1261, rose through the Nasrid chancery to become the dominant vizier of Sultan Muhammad III, holding from 1303 the rare title of #italic dhū al-wizāratayn#!, master of the two vizierates. He negotiated the Treaty of Córdoba, directed the seizure of Ceuta in 1306, and by the close of the reign was widely held to be the true ruler of the emirate.\n\nIt did not last. In the palace coup of March 1309 the commander Atiq ibn al-Mawl struck him down, and his body was cast aside and lost. His rise and fall became a byword for the danger of a minister who grows greater than his king."

 battle_for_the_strait_events.51.entry: "$battle_for_the_strait_events.51.title$"
 battle_for_the_strait_events.51.title: "A House of Learning"
 battle_for_the_strait_events.51.desc: "Our scholars have long pressed for a college worthy of [target_location.GetName], a [ShowBuildingTypeName('great_madrasa')] where the law might be taught under one roof as it is in the great cities of the east. [target_character.GetName] has the means to raise it beside the great mosque, where the faithful already gather. Such a foundation would draw students and jurists from across the strait, and bind the learning of our cities to the service of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 battle_for_the_strait_events.51.a: "Found the [ShowBuildingTypeNameWithNoTooltip('great_madrasa')] beside the great mosque."
 battle_for_the_strait_events.51.b: "The treasury cannot bear it now."
 battle_for_the_strait_events.51.historical_info: "In 1349 Sultan Yusuf I founded the Madrasa of Granada, the #italic Madrasa Yusufiyya#!, beside the great mosque on the site where the cathedral now stands. It taught the #italic Maliki#! school of law and stood as the foremost college of the emirate, a peer to the older schools of Fez and Cairo.\n\nFrom its halls came many of the jurists and secretaries who staffed the Nasrid chancery. Only its prayer room survives, a single fragment of what was once the intellectual heart of the kingdom."
 wont_have_another_chance_to_build_tt: "#italic We will not have another chance to gain these benefits#!"

 battle_for_the_strait_events.52.entry: "$battle_for_the_strait_events.52.title$"
 battle_for_the_strait_events.52.title: "The Hall of the Ambassadors"
 battle_for_the_strait_events.52.desc: "Within the great #italic qalahurra#! of our palace, [target_character.GetName] would raise a throne hall fit to receive the envoys of kings. Its cedar ceiling is to be carved with the seven heavens, thousands of pieces set above the throne so that any embassy might grasp the order beneath which it stands. A hall such as this speaks for [target_location.GetName] more plainly than any letter, and at no small cost."
 battle_for_the_strait_events.52.a: "Raise the hall and seat our throne beneath it."
 battle_for_the_strait_events.52.b: "Our envoys can speak well enough without it."
 battle_for_the_strait_events.52.historical_info: "The Hall of the Ambassadors, the throne room of the Comares Palace, was raised under Yusuf I in the mid-fourteenth century and remains the largest chamber of the Alhambra. From its throne the Nasrid sultans received foreign embassies in deliberate splendor.\n\nIts domed ceiling of cedar, assembled from thousands of interlocking pieces, represents the seven heavens of Islamic cosmology, with the throne set directly beneath the divine apex. It was a statement in wood and stucco that the emir ruled by the order of heaven itself."

 battle_for_the_strait_events.53.entry: "$battle_for_the_strait_events.53.title$"
 battle_for_the_strait_events.53.title: "The New Caravanserai"
 battle_for_the_strait_events.53.desc: "The merchants who throng our markets want for a proper [ShowBuildingTypeName('funduq')], a walled inn where wares may be stored under lock and traders lodged under guard. [target_character.GetName] has set aside the ground for it beside the [ShowGoodsName('silk')] market of [target_location.GetName]. The [ShowCultureGroupName('italian_group')] merchants have pressed for it most of all, for they handle the better part of our trade, and a sound house for their goods is a sound house for our customs."
 battle_for_the_strait_events.53.a: "Build it, and let the trade flow through our gates."
 battle_for_the_strait_events.53.historical_info: "The #italic al-Funduq al-Jadida#!, known to the Castilians as the Corral del Carbón, is the only Nasrid caravanserai still standing in Iberia. Documented by the early fourteenth century and held by the wives of the Nasrid sultans, it served as a grain warehouse and a lodging for merchants beside the #italic alcaicería#!, the gated silk market of Granada.\n\nMuch of that commerce lay in foreign hands. Genoese merchants and bankers dominated Granadan trade, drawn by silk and by the gold of the trans-Saharan routes, and one market of the city was known simply as the Alhóndiga of the Genoese."

 battle_for_the_strait_events.54.entry: "$battle_for_the_strait_events.54.title$"
 battle_for_the_strait_events.54.title: "A Treatise on Contagion"
 battle_for_the_strait_events.54.desc: "[target_character.GetName], the most learned head in our service, brings us a treatise unlike any our physicians have seen. Against the settled opinion of the age, [target_character.GetShortNameWithNoTooltip] argues that the great mortality passes from the sick to the well, carried in garments and vessels and aboard crowded ships, and that a city may shield itself by isolation and care. The clerics will call it impudence against the will of heaven, yet the counsel may spare us the next visitation."
 battle_for_the_strait_events.54.a: "Sponsor the work, and put its counsel to use."
 battle_for_the_strait_events.54.b: "Nothing to worry about, it is but a mere cough!"
 hospitals_benefit_tt: "If we had any [ShowBuildingTypeName('hospital')] [buildings|e] their home [locations|e] would benefit from the [ShowModifier('contagion_practices_modifier')] [modifier|e]"
 battle_for_the_strait_events.54.historical_info: "Around 1362 the Granadan vizier and polymath Ibn al-Khatib wrote #italic Muqni'at al-Sa'il#!, a treatise on the great plague that had swept the Mediterranean a decade before. In it he argued that the disease spread by contagion, established by experience through clothing, vessels, and infected ports, and that isolation could check it.\n\nThis cut against the prevailing doctrine, which held that to admit contagion was to deny that sickness came by the will of God. His manuscript survives in the library of the Escorial, a rare medieval voice for what later ages would call quarantine."

 battle_for_the_strait_events.55.entry: "An Embassy to Cairo"
 battle_for_the_strait_events.55.title: "An Embassy to [target_location.GetNameWithNoTooltip]"
 battle_for_the_strait_events.55.desc: "Pressed hard upon our own frontier, [target_gra_ruler.GetName] looks east, to the one throne that might still raise armies in the name of the faith. In [target_location.GetName] sits the [target_mam_country.GetGovernment.GetRulerTitle] of [target_mam_country.GetName], keeper of the holy cities and host of the caliph, the foremost power of [ShowReligionName('sunni')]. An embassy across the length of the sea is a costly gamble, and the answer may be soldiers, or gold, or nothing more than prayers. Yet a plea unmade is help never sought."
 battle_for_the_strait_events.55.a: "Send an envoy across the sea to [target_location.GetNameWithNoTooltip]."
 battle_for_the_strait_events.55.a.entry: "Send an envoy across the sea to Cairo."
 battle_for_the_strait_events.55.b: "We will rally the faithful and stand on our own."
 battle_for_the_strait_events.55.historical_info: "As Castile pressed Granada in the mid-fourteenth century, the Nasrid court sent embassies across the Mediterranean to Cairo, seat of the Mamluk sultanate, custodians of Mecca and Medina and hosts of the shadow Abbasid caliph. They were the natural address for any appeal made in the name of Sunni Islam.\n\nThe Mamluks, hemmed by their own frontiers and an ocean away, sent no armies. They answered with prayers for victory and warm words of brotherhood. Ibn al-Khatib preserved this correspondence between Granada and Cairo in his collection of letters, the #italic Rayḥānat al-Kuttāb#!."
 battle_for_the_strait_events.56.title: "A Plea from the West"
 battle_for_the_strait_events.56.desc: "An embassy from [target_gra_country.GetName] has reached our [ROOT.GetCountry.GetGovernment.GetCourtTitle], worn from the long crossing. They speak for the last [ShowReligionGroupAdjective('muslim')] throne of the far west, hard pressed by the [ShowReligionGroupAdjectiveWithNoTooltip('christian')] crowns, and they ask what aid the keeper of the holy cities will send. An ocean lies between us and their war, and our own borders are never quiet for long. Still, the eyes of the faithful are upon us, and how we answer [target_gra_ruler.GetName] will not soon be forgotten."
 battle_for_the_strait_events.56.a: "Bind ourselves to their cause as brothers in faith."
 battle_for_the_strait_events.56.b: "Send what men and coin we can spare, and no more."
 battle_for_the_strait_events.56.c: "Offer our prayers, and keep our armies at home."
 gra_gets_nothing_tt: "The diplomats of [target_gra_country.GetName] return home with thoughts, prayers, and wishes"
 may_give_alliance_military_eco_or_no_help: "The [target_mam_country.GetLongName] may or may not send us aid"
 alliance_better_chance_at_good_results_tt: "Our pre-existing [alliance|e] indicates there is a better chance at them hearing our plea"
 battle_for_the_strait_events.60.title: "The Sword and the Cross"
 battle_for_the_strait_events.60.entry: "$battle_for_the_strait_events.60.title$"
 battle_for_the_strait_events.60.desc: "The war for the strait grinds on, and [target_ruler.GetName] looks to the brother-knights of the military orders, whose commanderies dot the frontier for this very purpose. To summon them fully is to spend their patience and their coin on the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s war, though it fires their zeal for the fight. A smaller requests spends less of their goodwill. Or the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] may leave them be, and fight this war with its own arms alone."
 battle_for_the_strait_events.60.a: "Summon the orders to the field in full."
 battle_for_the_strait_events.60.b: "Ask only for a token contribution."
 battle_for_the_strait_events.60.c: "Leave the orders to their own lands and lordships."

 battle_for_the_strait_events.6.title: "The Frontier Is Gone"
 battle_for_the_strait_events.6.entry: "$battle_for_the_strait_events.6.title$"
 battle_for_the_strait_events.6.desc: "The war is over, and there is no Moor left in [ShowRegionName('iberia_region')] to fight.\n\nThis is a difficulty nobody planned for. Our military orders hold castles along a frontier that has ceased to exist, garrison passes into lands that are now ours, and draw the rents of provinces we gave them to defend. They are the best soldiers we have and they are, as of this year, soldiers without a war.\n\nThe Masters know it before we do. They are already writing to ask what we intend."
 battle_for_the_strait_events.6.a: "Turn them to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s service."
 battle_for_the_strait_events.6.b: "Send them across the sea."
 battle_for_the_strait_events.6.c: "Leave them to find their own purpose."
 bfts_orders_sent_overseas_tt: "Later events will remember that we sent our [religious_orders|e] overseas"
 bfts_orders_given_new_purpose_tt: "Every $iberian_military_order_type$ in our country is permanently $zeal_imperial_purpose$, raising its target [zeal|e]"

 battle_for_the_strait_events.8.title: "The Brothers Who Did Not Come Back"
 battle_for_the_strait_events.8.entry: "$battle_for_the_strait_events.8.title$"
 battle_for_the_strait_events.8.desc: "A column of the [target_order.GetName] was caught in broken country by a force that had every advantage of ground and numbers, and it did not break until there was very little left to break.\n\nThe survivors are in enemy hands and a ransom has been named. It is a large one, because the enemy knows exactly who they have taken: not levies, but professed brothers of an order that has never yet left its men to rot.\n\nThe Master has not asked us for the money. He has been careful not to ask. That is itself the request."
 battle_for_the_strait_events.8.a: "Pay the ransom. They will not be abandoned."
 battle_for_the_strait_events.8.b: "They took the vows knowing the risk."
 battle_for_the_strait_events.8.c: "No ransom, but they may recruit from our levies."
 bfts_orders_left_to_decline_tt: "Every $iberian_military_order_type$ in our country keeps its target [zeal|e] lowered by $zeal_no_heathen_threat$"

 cas_retaliate_with_raids_tt: "Retaliatory raids may be conducted by [target_cas_country.GetName] across [locations|e] we own within [target_cas_country.GetAdjectiveWithNoTooltip] reach, thus damaging our [prosperity|e]"
 mor_retaliate_with_raids_tt: "Retaliatory raids may be conducted by [target_mor_country.GetName] across [locations|e] we own within [target_mor_country.GetAdjectiveWithNoTooltip] reach, thus damaging our [prosperity|e]"
