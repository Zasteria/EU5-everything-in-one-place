l_english:
 d009_late_minorities.1.title: "The Sabbatean Messianic Movement"
 d009_late_minorities.1.entry: "$d009_late_minorities.1.title$"
 d009_late_minorities.1.desc: "A mystic named [target_character.GetName] has declared [target_character.GetHerselfHimself] the long-awaited Messiah in [ShowLocationName('smyrna')], and the news has set our [ShowReligionAdjective('judaism')] subjects alight with an excitement no rabbi's caution seems able to dampen. Whole [ShowCultureName('sephardi')] congregations abandon their trades and prepare for a return to Zion that our own officials are at a loss to either confirm or deny. Whether this passes as a fever of the season or reshapes the community for good is not yet clear, and our [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided on whether it is even our place to intervene."
 d009_late_minorities.1.a: "Allow the movement to run its course."
 d009_late_minorities.1.b: "Suppress the fervor."
 d009_late_minorities.1.b.tt: "Our [ShowReligionAdjectiveWithNoTooltip('judaism')] subjects grow resentful at the crackdown"
 d009_late_minorities.1.historical_info: "Sabbatai Zevi, born in Smyrna in 1626, declared himself the Jewish Messiah in 1665, igniting a wave of messianic fervor that swept Jewish communities from Amsterdam to Yemen, including large parts of the Sephardi diaspora. Ottoman authorities eventually arrested him in 1666, presenting him with a choice between conversion to Islam and execution."
 variable_d009_sabbatean_movement_allowed_tt: "The Sabbatean Movement was Permitted to Spread, and Sabbatai Zevi is Still Alive"

 d009_late_minorities.2.title: "Sabbatai's Apostasy"
 d009_late_minorities.2.entry: "$d009_late_minorities.2.title$"
 d009_late_minorities.2.desc: "Word has reached our [ROOT.GetCountry.GetGovernment.GetCourtTitle] that [target_character.GetName], held in the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s custody, has converted to [ShowReligionGroupName('muslim')] rather than face execution, a betrayal in the eyes of [target_character.GetHerHis] most fervent believers, though a small number insist [target_character.GetHerHis] outward conversion masks a truth only the faithful can perceive. What remains of the movement now splinters between despair, quiet apostasy, and the stubborn belief that the Messiah's path was simply more complicated than anyone first assumed."
 d009_late_minorities.2.a: "Compel the faithful to follow [target_character.GetHerHis] example."
 d009_late_minorities.2.a.entry: "Compel the faithful to follow Sabbatai Zevi's example."
 d009_late_minorities.2.a.tt: "Our devout [ShowReligionAdjective('judaism')] subjects are troubled by the coerced conversions"
 d009_late_minorities.2.b: "Let the movement quietly disperse."
 d009_late_minorities.2.historical_info: "The Ottoman authorities who arrested Sabbatai Zevi offered him a choice between execution and conversion to Islam, and he chose the latter in 1666, taking the name Mehmed Efendi. A small circle of followers in Thessaloníki and elsewhere followed his example outwardly while continuing to practice a syncretic version of Jewish ritual in secret, becoming known as the Dönme. Most of the wider movement's believers, however, simply returned to ordinary Jewish life, disillusioned but unconverted."

 d009_late_minorities.3.title: "The #italic Haskalah#!, [ShowReligionAdjectiveWithNoTooltip('judaism')] Enlightenment"
 d009_late_minorities.3.entry: "$d009_late_minorities.3.title$"
 d009_late_minorities.3.desc: "Word reaches [ShowLocationName('amsterdam')] of a new movement stirring among the [ShowReligionAdjective('judaism')] communities of German lands, one that urges Jews to set aside the isolation of the ghetto and take up the language, dress, and learning of the wider world around them. Our own [ShowReligionAdjectiveWithNoTooltip('judaism')] merchants and scholars debate whether such openness would enrich this community or simply dissolve it into the surrounding [ShowReligionGroupAdjective('christian')] population entirely."
 d009_late_minorities.3.a: "Embrace secular education and civic integration."
 d009_late_minorities.3.b: "Uphold traditional communal boundaries."
 d009_late_minorities.3.historical_info: "Moses Mendelssohn's philosophical writings in Berlin sparked the #italic Haskalah#!, or Jewish Enlightenment, from the 1770s onward, encouraging Jewish communities across Europe to engage with secular philosophy, literature, and civic life alongside religious study. Amsterdam's own Sephardi and Ashkenazi communities were among the first outside German lands to debate its ideas seriously, given the city's already unusually open Jewish intellectual culture."

 d009_late_minorities.4.title: "Napoleon's #italic Sanhedrin#!"
 d009_late_minorities.4.entry: "$d009_late_minorities.4.title$"
 d009_late_minorities.4.desc: "[target_character.GetName] has summoned rabbis and prominent laymen from across [ROOT.GetCountry.GetName] and beyond to a Grand #italic Sanhedrin#!, convened to settle once and for all whether [ShowReligionAdjective('judaism')] law can be reconciled with the duties of a citizen of this republic. Our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] see an opportunity to finally draw these communities fully into civic life; our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] see a state overstepping into matters that are none of its business."
 d009_late_minorities.4.a: "Grant full civic emancipation."
 d009_late_minorities.4.b: "Maintain the old restrictions."
 d009_late_minorities.4.historical_info: "Napoleon convened the Assembly of Jewish Notables in 1806 and the Grand #italic Sanhedrin#! in 1807 to determine whether Jewish law was compatible with French citizenship, ultimately concluding that it was, provided Jewish communities accepted state authority over civil matters such as marriage and moneylending. The decision marked a major step toward the legal emancipation of Jews across Napoleonic Europe, though full equality remained contested and incomplete in practice for decades afterward."
 variable_our_napoleon_tt: "A Napoleon-like Conqueror General Has Emerged"
 variable_d009_jewish_emancipation_tt: "[GetCountry('FRA').GetCulture.GetAdjective] Jews were Legally Emancipated"

 d009_late_minorities.5.title: "The [GetCountry('MOR').GetAdjectiveWithNoTooltip] [GetCountry('MOR').Custom('GetRulerOrRegentTitle')] and the Emancipated Jews"
 d009_late_minorities.5.entry: "$d009_late_minorities.5.title$"
 d009_late_minorities.5.desc: "Reports from [ROOT.GetCountry.GetAdjective] merchants returning from [GetCountry('FRA').GetName] describe a new order taking hold there, one where [ShowReligionAdjective('judaism')] subjects stand before the law exactly as any other citizen does. Word of it has reached the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s own [ROOT.GetCountry.GetGovernment.GetCourtTitle], and more than a few of our ministers wonder aloud whether the mallāḥ of [ROOT.GetCountry.GetFlavorRank] ought to expect anything similar, or whether such notions belong to Europe and nowhere else."
 d009_late_minorities.5.a: "Acknowledge their equal status."
 d009_late_minorities.5.b: "Maintain the old dhimmi restrictions."
 d009_late_minorities.5.historical_info: "News of French Jewish emancipation reached Morocco through European diplomatic and merchant channels in the years after 1807, prompting inconclusive discussion at the Moroccan court about the legal status of its own Jewish subjects. No formal change followed within this period, the traditional dhimmi framework governing Morocco's Jewish communities persisted largely intact until the French protectorate era of the 20th century."

 d009_late_minorities.6.title: "Memory of al-'Andalus"
 d009_late_minorities.6.entry: "$d009_late_minorities.6.title$"
 d009_late_minorities.6.desc: "Among the exiled communities from [ShowRegionName('iberia_region')] settled within our realm, verses and songs recalling al-'Andalus, a paradise their ancestors once called home and lost, still circulate at [ROOT.GetCountry.GetGovernment.GetCourtTitle] and in private gatherings alike, kept alive more in poetry now than in any living memory. Some among us would see that memory encouraged as a mark of this realm's own hospitality; others would rather let old grievances toward [ShowRegionNameWithNoTooltip('iberia_region')] fade quietly into legend before they harden into something sharper."
 d009_late_minorities.6.a: "Commission a work celebrating that heritage."
 d009_late_minorities.6.b: "Treat it as harmless nostalgia."
 d009_late_minorities.6.historical_info: "The idea of al-'Andalus as a lost paradise took deep root in both Sephardi and Andalusi Muslim memory across the Maghreb, romanticized in poetry, music, and later architecture long after any realistic hope of return had faded. By the 18th and 19th centuries this nostalgia had become as much a literary and artistic tradition in its own right as a genuine political memory, one that would later be invoked by very different movements for very different purposes."
