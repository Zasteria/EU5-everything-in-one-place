l_english:
 d009_sephardi_morocco.1.title: "The #italic Megorashim#! Arrive"
 d009_sephardi_morocco.1.entry: "$d009_sephardi_morocco.1.title$"
 d009_sephardi_morocco.1.desc: "Refugees from [origin_country.GetNameWithNoTooltip] have been arriving at our Atlantic ports for months now, calling themselves #italic Megorashim#!, the expelled ones, and asking for nothing more than a quarter to settle in and a synagogue to pray in. [ShowLocationName('fez')] already has an old and settled [ShowReligionAdjective('judaism')] community of its own, the Toshavim, who are not entirely certain they want to share their city, their courts, or their customs with newcomers who speak a different tongue and follow different rites."
 d009_sephardi_morocco.1.a: "Welcome them to [ShowLocationNameWithNoTooltip('fez')]."
 d009_sephardi_morocco.1.b: "Restrict them to [ShowLocationNameWithNoTooltip('tetouan')] only."
 d009_sephardi_morocco.1.historical_info: "The Alhambra Decree and its Portuguese counterpart sent tens of thousands of Sephardi Jews into the Maghreb. Those who reached Morocco called themselves #italic Megorashim#!, Hebrew for the expelled, to distinguish themselves from the #italic Toshavim#!, the native Moroccan Jewish communities who had lived there since long before 1492. The two groups settled largely in Fez and Tetouan and would maintain separate identities, and often separate legal customs for generations."

 d009_sephardi_morocco.2.title: "#italic Megorashim#! Against #italic Toshavim#!"
 d009_sephardi_morocco.2.entry: "$d009_sephardi_morocco.2.title$"
 d009_sephardi_morocco.2.desc: "The two [ShowReligionAdjective('judaism')] courts of [ShowLocationName('fez')] have finally clashed openly. The #italic Megorashim#!'s rabbis insist their [GetCountry('CAS').GetAdjectiveWithNoTooltip] legal customs, refined over centuries in [GetCountry('CAS').GetNameWithNoTooltip], are simply better suited to commerce and contract than the older #italic Toshavim#! rite. The #italic Toshavim#!, understandably, do not agree, and both communities have appealed to us to settle the matter, or at least to stop pretending the dispute will settle itself."
 d009_sephardi_morocco.2.a: "Impose the #italic Takkanot#! of [ShowLocationNameWithNoTooltip('fez')]."
 d009_sephardi_morocco.2.b: "Uphold the #italic Toshavim#! rite."
 d009_sephardi_morocco.2.c: "Insist on coexistence."
 d009_sephardi_morocco.2.historical_info: "The real #italic Takkanot de Fes#! were a body of communal ordinances issued by #italic Megorashim#! rabbis beginning in 1494, gradually establishing Castilian-influenced legal custom as the dominant rite in Fez. The #italic Toshavim#! did not simply disappear, the two communities kept largely separate synagogues, courts, and cemeteries for generations, and it took well over a century for the distinction between them to fade into a single Fez Jewish community."

 d009_sephardi_morocco.3.title: "City of the Exiles"
 d009_sephardi_morocco.3.entry: "$d009_sephardi_morocco.3.title$"
 d009_sephardi_morocco.3.desc: "[ShowLocationName('tetouan')] lay in ruins for decades before [ShowCultureName('andalusi')] and [ShowCultureName('sephardi')] exiles from [ShowRegionName('iberia_region')] rebuilt it together, and the mark they left has not faded. Its streets, its trades, and its speech all carry an unmistakable flavor of [ShowRegionNameWithNoTooltip('iberia_region')], rare anywhere else on this coast. Whether we invest further in that identity or simply treat [ShowLocationNameWithNoTooltip('tetouan')] as any other port under our rule is entirely our choice to make."
 d009_sephardi_morocco.3.a: "Invest in [ShowLocationNameWithNoTooltip('tetouan')]'s [ShowCultureNameWithNoTooltip('sephardi')] character."
 d009_sephardi_morocco.3.b: "Treat it as any other town."
 d009_sephardi_morocco.3.historical_info: "Tetouan had been destroyed by Castilian forces in the 1400s and lay largely abandoned until Andalusi Muslim and Sephardi Jewish refugees resettled it around the time of the 1492 expulsions. The city developed #italic Haketia#!, a distinct Judeo-Spanish dialect, and remained one of the cities most visibly influenced by Iberia in Morocco for centuries afterward, a character its Jewish community in particular preserved well into the modern era."

 d009_sephardi_morocco.4.title: "The Sa'dī Court Jews"
 d009_sephardi_morocco.4.entry: "$d009_sephardi_morocco.4.title$"
 d009_sephardi_morocco.4.desc: "[target_character.GetName], a [ShowReligionAdjective('judaism')] physician and scholar of considerable learning, has come to [ShowLocationName('marrakesh')] seeking a place at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Our [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s predecessors have long relied on [ShowReligionAdjectiveWithNoTooltip('judaism')] financiers and go-betweens for dealings with the [ShowReligionGroupAdjective('christian')] powers of the Atlantic, and there is no obvious reason to break with that practice now, though not every minister at [ROOT.GetCountry.GetGovernment.GetCourtTitle] agrees."
 d009_sephardi_morocco.4.a: "Appoint [target_character.GetHimHer] to [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 d009_sephardi_morocco.4.a.entry: "Appoint him to court."
 d009_sephardi_morocco.4.b: "Rely on [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] merchants only."
 d009_sephardi_morocco.4.historical_info: "The Sa'dī sultans, most famously Aḥmad al-Manṣūr, leaned heavily on Jewish courtiers, financiers, and diplomatic go-betweens to manage trade and negotiations with England, Holland, and other Atlantic powers, relationships built partly on the sugar and saltpeter trades that funded the Sa'dī state."

 d009_sephardi_morocco.5.title: "Ransoming the Captives"
 d009_sephardi_morocco.5.entry: "$d009_sephardi_morocco.5.title$"
 d009_sephardi_morocco.5.desc: "Peace with [GetCountry('POR').GetNameWithNoTooltip] has been signed, but peace has left [ROOT.GetCountry.GetName] holding a great many [GetCountry('POR').GetAdjectiveWithNoTooltip] captives, and our [ShowReligionAdjective('judaism')] merchants, who maintain trading contacts across the strait that few of our own officials can match, have offered to broker their ransom. It is, by any measure, a lucrative piece of business to hand to men whose loyalty some at [ROOT.GetCountry.GetGovernment.GetCourtTitle] still quietly question."
 d009_sephardi_morocco.5.a: "Authorize the ransom through [ShowReligionAdjectiveWithNoTooltip('judaism')] intermediaries."
 d009_sephardi_morocco.5.b: "Handle it through [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] intermediaries only."
 d009_sephardi_morocco.5.historical_info: "After the Sa'dī victory over a Portuguese invasion force at the Battle of El-Qaṣr al-Kabir (Alcácer-Quibir) in 1578, Jewish merchants in Morocco played a documented role brokering the ransom of captured Portuguese nobles and soldiers back to Iberia, a lucrative and diplomatically delicate business given their existing trade networks on both sides of the strait."
 d009_morocco_has_jewish_pops_tt: "Our lands are home to [ShowReligionAdjectiveWithNoTooltip('judaism')] [pops|e]"

 d009_sephardi_morocco.6.title: "The [ShowLocationNameWithNoTooltip('meknes')] Mallāḥ"
 d009_sephardi_morocco.6.entry: "$d009_sephardi_morocco.6.title$"
 d009_sephardi_morocco.6.desc: "[target_character.GetName], a financier of some renown, proposes that our [ROOT.GetCountry.GetGovernment.GetRulerTitle] formalize a proper [ShowReligionAdjective('judaism')] quarter within [ShowLocationName('meknes')] itself, complete with its own charter, market rights, and courts. Making [ShowLocationNameWithNoTooltip('meknes')] a place [ShowReligionAdjectiveWithNoTooltip('judaism')] merchants want to settle in, [target_character.GetSheHe] argues, will pay for itself many times over in taxes and trade alone."
 d009_sephardi_morocco.6.a: "Grant the charter."
 d009_sephardi_morocco.6.b: "Exclude Jews from [ShowLocationNameWithNoTooltip('meknes')]."
 d009_sephardi_morocco.6.historical_info: "Sultan Moulay Ismail made Meknes his imperial capital and, like other Alaouite rulers, relied on Jewish financiers to manage the treasury and Atlantic trade, the most famous being Joseph Maimaran, remembered in Moroccan Jewish tradition as a key figure in Meknes's court finances. A formal Jewish quarter, or mallāḥ, was established in the city as part of its development into an imperial capital."

 d009_sephardi_morocco.7.title: "Samuel Pallache, The Diplomatic Corsair"
 d009_sephardi_morocco.7.entry: "$d009_sephardi_morocco.7.title$"
 d009_sephardi_morocco.7.desc: "[target_character.GetName] leads a curious double life, one day negotiating trade privileges on our behalf with [GetCountry('HOL').GetNameWithNoTooltip], the next commanding corsair ships that raid Spanish and [GetCountry('POR').GetAdjectiveWithNoTooltip] shipping without any commission we ever signed. [target_character.GetSheHe] insists both activities serve the same end, and it is difficult to argue [target_character.GetHerHis] results have been anything but excellent for our treasury."
 d009_sephardi_morocco.7.a: "Commission him formally."
 d009_sephardi_morocco.7.b: "Keep the arrangement unofficial."
 d009_sephardi_morocco.7.historical_info: "Samuel Pallache was a real Moroccan Jewish diplomat who served the Sa'dī court as an envoy to Holland in the early 1600s, helping negotiate one of Morocco's first treaties with a European Atlantic power, while also holding letters of marque that let him raid Spanish shipping as a corsair. This combination of statecraft and piracy scandalized more than one European court he visited."

 d009_sephardi_morocco.8.title: "[ShowLocationNameWithNoTooltip('tangier')] Under [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Rule"
 d009_sephardi_morocco.8.entry: "Tangier Under New Rule"
 d009_sephardi_morocco.8.desc: "However [ShowLocationName('tangier')] came into our crown's hands, we now find ourselves the unlikely rulers over a settled [ShowReligionAdjective('judaism')] community, the only one anywhere under our flag. It is an awkward position for a kingdom that has kept its own shores closed to [ShowReligionAdjectiveWithNoTooltip('judaism')] settlement for generations, and our council is not of one mind about what, if anything, ought to change because of it."
 d009_sephardi_morocco.8.a: "Tolerate the community."
 d009_sephardi_morocco.8.b: "Impose harsh restrictions."
 d009_sephardi_morocco.8.b.tt: "The [ShowReligionAdjectiveWithNoTooltip('judaism')] community of [ShowLocationNameWithNoTooltip('tangier')] grows deeply dissatisfied with our rule"
 d009_sephardi_morocco.8.historical_info: "Tangier passed to the English Crown in 1661 as part of Catherine of Braganza's marriage dowry to Charles II, bringing with it a small settled Jewish community, notably, the only Jewish community living under English rule anywhere in the world at the time, since Jews had been formally expelled from England itself in 1290 and were not readmitted until 1656."

 d009_sephardi_morocco.9.title: "[ShowLocationNameWithNoTooltip('mogador')], The Sultan's Merchants"
 d009_sephardi_morocco.9.entry: "$d009_sephardi_morocco.9.title$"
 d009_sephardi_morocco.9.desc: "Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] has commissioned a wholly new port at [ShowLocationName('mogador')], planned from nothing on an empty stretch of coast, and proposes to grant a select handful of [ShowReligionAdjective('judaism')] merchant houses an effective monopoly over its Atlantic trade in exchange for their loyalty and their capital. Every merchant left outside that arrangement has already made known exactly how they feel about it."
 d009_sephardi_morocco.9.a: "Grant the monopoly."
 d009_sephardi_morocco.9.b: "Divide the trade among all merchants."
 d009_sephardi_morocco.9.historical_info: "Sultan Mohammed III founded Mogador in the 1760s as a deliberately planned port, and granted a select group of Jewish merchant families, remembered as the #italic Tujjar as-Sultān#! (the Sultan's Merchants), privileged status and tax exemptions to manage its Atlantic and European trade. The arrangement made Mogador one of the most prosperous Jewish mercantile communities in Morocco's modern history."

 d009_sephardi_morocco.10.title: "The Mallāḥ of [ShowLocationNameWithNoTooltip('fez')]"
 d009_sephardi_morocco.10.entry: "$d009_sephardi_morocco.10.title$"
 d009_sephardi_morocco.10.desc: "For generations our [ShowReligionAdjective('judaism')] subjects in [ShowLocationName('fez')] have lived scattered through [ShowLocationNameWithNoTooltip('fez')] like any other community. Our [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s ministers now propose formalizing a single walled quarter for them, with its own charter, its own market, and its own gates, a measure its proponents call protection and its critics call something considerably less generous."
 d009_sephardi_morocco.10.a: "Establish the Mallāḥ."
 d009_sephardi_morocco.10.a.tt: "The [ShowReligionAdjectiveWithNoTooltip('judaism')] community of [ShowLocationNameWithNoTooltip('fez')] is confined to a single walled quarter"
 d009_sephardi_morocco.10.b: "Allow them to live freely."
 d009_sephardi_morocco.10.historical_info: "The Mallāḥ of Fez, established in 1438, was the first purpose-built Jewish quarter in Morocco and became the model for similar mallāḥ across the country in the centuries that followed. Accounts of its founding differ on whether it was primarily a protective measure, moving the Jewish community away from a restive citadel garrison, or a segregating one, in practice, it was likely some of both."
