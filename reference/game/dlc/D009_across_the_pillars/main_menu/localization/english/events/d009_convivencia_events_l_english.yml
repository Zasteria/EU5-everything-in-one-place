l_english:
 d009_convivencia.1.title: "The Three Communities"
 d009_convivencia.1.entry: "$d009_convivencia.1.title$"
 d009_convivencia.1.desc: "In our towns, church bells, the mu'aḏḏin's call, and the Sabbath candle all mark the same hours on the same streets, and have done so for generations. Mudéjar artisans, [ShowReligionAdjective('judaism')] moneylenders and physicians, and [ShowReligionGroupAdjective('christian')] burghers share markets, workshops, courtyards, and often bitter disputes, all held together under a fragile #italic convivencia#! that predates our grandfathers and has outlasted wars, plagues, and the shifting moods of the kings before us. Councilors press us daily for a firmer hand; the aljamas press just as hard for the opposite. How closely should the crown watch over the terms on which the three communities are permitted to live side by side?"
 d009_convivencia.1.a: "Let the aljamas govern themselves."
 d009_convivencia.1.a.tt: "The [ShowReligionGroupAdjective('muslim')] and [ShowReligionAdjectiveWithNoTooltip('judaism')] communities of [target_location.GetName] grow more settled under our rule"
 d009_convivencia.1.b: "Favor our [ShowReligionGroupAdjectiveWithNoTooltip('christian')] subjects."
 d009_convivencia.1.b.tt: "The [ShowReligionGroupAdjective('muslim')] and [ShowReligionAdjectiveWithNoTooltip('judaism')] communities of [target_location.GetName] grow uneasy under our rule"
 d009_convivencia.1.historical_info: "#italic Convivencia#!, meaning coexistence, is the term historians use for the centuries in which Christians, Muslims, and Jews lived side by side across medieval Iberia under varying degrees of tolerance, particularly in cities like Toledo, Sevilla, and Zaragoza. It was never full equality, non-Christians paid special taxes and lived under real restrictions, but it allowed a level of cultural and intellectual exchange that produced, among other things, the great translation schools of Toledo."

 d009_convivencia.2.title: "The Tránsito Synagogue"
 d009_convivencia.2.entry: "$d009_convivencia.2.title$"
 d009_convivencia.2.desc: "[target_character.GetName], our treasurer and closest confidant among the aljama, wishes to raise a new synagogue in the [ShowReligionAdjective('judaism')] quarter at the heart of [ShowLocationName('toledo')], its walls to be carved with the psalms of David beside the heraldic arms of [ROOT.GetCountry.GetNameWithNoTooltip], its ceilings gilded in a style [target_character.GetSheHe] swears will rival anything the cathedral chapter has commissioned in a generation. It would stand as one of the finest houses of worship ever built by [ShowReligionAdjectiveWithNoTooltip('judaism')] hands on our soil, a monument to [target_character.GetHerHis] own rise as much as to [target_character.GetHerHis] faith, and a very public sign, for those who care to read it, of just how far [target_character.GetHerHis] counsel has carried [target_character.GetHimHer] at our [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 d009_convivencia.2.a: "Grant [target_character.GetHimHer] leave to build, and welcome [target_character.GetHimHer] to our [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 d009_convivencia.2.a.entry: "Grant Samuel ha-Levi Abulafia leave to build, and welcome him to our court."
 d009_convivencia.2.b: "Decline; such splendor invites envy and suspicion."
 d009_convivencia.2.b.tt: "The [ShowReligionAdjectiveWithNoTooltip('judaism')] community of [ShowLocationNameWithNoTooltip('toledo')] feels the crown's coldness"
 d009_convivencia.2.historical_info: "The Synagogue of El Tránsito in Toledo was built around 1356 by Samuel ha-Levi Abulafia, treasurer to King Pedro I of Castile, and remains one of the finest surviving examples of Mudéjar synagogue architecture, its walls carved with Hebrew psalms alongside the royal arms of Castile. Ha-Levi's spectacular rise at court ended badly, he was later arrested and died under torture on the king's orders, accused of embezzlement, a reminder of how precarious even the most trusted Jewish courtiers' positions could be."
 d009_convivencia_2_judaism_population_tt: "Toledo has a Jewish population"

 d009_convivencia.3.title: "Hasdai Crescas and the Question of Faith"
 d009_convivencia.3.entry: "$d009_convivencia.3.title$"
 d009_convivencia.3.desc: "[target_character.GetName], a rabbi and [ShowArtistTypeName('philosopher')] of considerable renown among [target_character.GetHerHis] own people and no small notoriety among ours, seeks an audience at our [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetSheHe|U] hopes to argue before us that reason and revelation need not stand at odds, that the philosophers our own scholars so admire were never as friendly to [ShowReligionGroupAdjective('christian')] doctrine as they pretend, and that the disputations regularly pressed upon [target_character.GetHerHis] people rest on borrowed Aristotelian logic ill-suited to questions of faith in the first place. Whatever our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] make of the errand, and they make a great deal of it, the learning of [target_character.GetShortNameWithNoTooltip] is real, and [target_character.GetHerHis] arguments are said to be uncomfortably difficult to answer."
 d009_convivencia.3.a: "Receive [target_character.GetHimHer] and hear [target_character.GetHerHis] arguments."
 d009_convivencia.3.a.entry: "Receive Hasdai Crescas and hear his arguments."
 d009_convivencia.3.a.tt: "The [ShowReligionAdjective('judaism')] communities of the realm take heart at the gesture"
 d009_convivencia.3.b: "Turn [target_character.GetHimHer] away."
 d009_convivencia.3.b.entry: "Turn Hasdai Crescas away."
 d009_convivencia.3.historical_info: "Hasdai Crescas was a leading rabbi and philosopher of Aragonese Jewry, based mostly in Barcelona and Zaragoza. His major work, #italic Or Adonai#! (Light of the Lord), was a sustained critique of Aristotelian philosophy's dominance over Jewish theology, arguing that faith and divine will could not be fully subordinated to Aristotelian logic. He lived through the devastating 1391 pogroms, in which his own son was among those killed, and much of his later writing responds directly to that catastrophe."
 d009_convivencia_3_judaism_population_tt: "Realm has a Jewish population"

 d009_convivencia.4.title: "The Mudéjar Craftsmen"
 d009_convivencia.4.entry: "$d009_convivencia.4.title$"
 d009_convivencia.4.desc: "Since our Mudéjar subjects secured the right to govern their own aljama, the self-ruled community that keeps its own markets, courts, and trades, under charter and privilege, their master builders, tilers, and plasterers have grown bolder in showing what their hands can do, blending horseshoe arches and carved stucco with the forms our own masons favor. Commissioning them for a palace wing or a garden pavilion would announce, in stone and plaster, that the charter we granted was no empty gesture. Not every bishop or baron will see it that way, and our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] rarely miss a chance to grumble about it."
 d009_convivencia.4.a: "Commission a Mudéjar-style palace wing."
 d009_convivencia.4.b: "Restrict our commissions to [ShowReligionGroupAdjectiveWithNoTooltip('christian')] craftsmen only."
 d009_convivencia.4.historical_info: "Mudéjar art and architecture, the style produced by Muslim craftsmen working under Christian rule, blending horseshoe arches, geometric tilework, and carved stucco with Gothic and Romanesque forms, flourished across Castile and Aragon precisely because Christian monarchs actively commissioned it. The Alcázar of Sevilla, built for King Pedro I in the 1360s largely by Mudéjar craftsmen from Granada and Toledo, remains the most celebrated example of this royal patronage."

 d009_convivencia.5.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')] Financiers and the Crown"
 d009_convivencia.5.entry: "$d009_convivencia.5.title$"
 d009_convivencia.5.desc: "The treasury of [ROOT.GetCountry.GetName] runs thin more often than we would like to admit, wars and building projects and the upkeep of a proper [ROOT.GetCountry.GetGovernment.GetCourtTitle] all demanding more than the ordinary tax rolls can supply in time.\n\nThe aljamas' moneylenders and tax farmers stand ready with credit that our own [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], bound by canon law and simple pride, rarely extends, and their terms, whatever the pulpit says of them, are usually the fairest on offer in [ROOT.GetCountry.GetNameWithNoTooltip].\n\nOur [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] mutter endlessly about usury and undue influence at our [ROOT.GetCountry.GetGovernment.GetCourtTitle], and not entirely without reason, but coin drawn from the aljama spends exactly the same as coin drawn from any [ShowReligionGroupAdjective('christian')] purse."
 d009_convivencia.5.a: "Lean on [ShowReligionAdjectiveWithNoTooltip('judaism')] financiers to fill the treasury."
 d009_convivencia.5.b: "Restrict their moneylending and satisfy the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]."
 d009_convivencia.5.b.entry: "Restrict their moneylending and satisfy the clergy."
 d009_convivencia.5.historical_info: "Jewish financiers, tax farmers, and court physicians were a fixture of Christian Iberian courts throughout the medieval period, since canon law's prohibition on Christian usury left much of the credit market to Jewish lenders. Figures like Yehuda de la Cavalleria, who managed royal finances for the kings of Aragon in the 13th century, rose to real influence at the highest level of the court, though their prominence also made them lightning rods for resentment whenever taxes rose or wars went badly."

 d009_convivencia.6.title: "A Case Before the Aljama Courts"
 d009_convivencia.6.entry: "$d009_convivencia.6.title$"
 d009_convivencia.6.desc: "Years after we set our course on how closely the crown should watch over the aljama courts, a case has finally reached us that will show whether that policy holds in practice. A [ShowReligionGroupAdjective('christian')] wool merchant and a [ShowReligionGroupAdjective('muslim')] tanner dispute a contract gone sour, and the aljama's own judge has already ruled between them, invoking law that predates our grandfathers. The merchant now appeals to us directly, asking that royal justice overturn a verdict he never agreed to submit to in the first place."
 d009_convivencia.6.a: "Uphold the aljama court's ruling."
 d009_convivencia.6.a.tt: "The [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] and [ShowReligionAdjective('judaism')] communities take the ruling as proof the crown's word can be trusted"
 d009_convivencia.6.b: "Overturn the ruling and bring the case under crown law."
 d009_convivencia.6.b.tt: "The [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] and [ShowReligionAdjective('judaism')] communities see the aljama courts' authority quietly stripped away"
 d009_convivencia.6.historical_info: "Aljamas, the self-governing Muslim and Jewish communities of Christian Iberia, typically held judicial autonomy, including their own courts applying Muslim or Jewish law to internal disputes, under charters granted by the crown. This case is invented, but the underlying tension it dramatizes was constant: royal justice and aljama justice overlapped uneasily, and how far a crown was willing to let communal courts have the final word varied enormously by kingdom and by century."

 d009_convivencia.7.title: "A [ShowReligionAdjectiveWithNoTooltip('judaism')] Vizier for [ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_convivencia.7.entry: "A Jewish Vizier"
 d009_convivencia.7.desc: "Among the [ShowReligionAdjective('judaism')] families settled within the walls of [ShowLocationName('granada')], [target_character.GetName] has built a command of tribute, tax, and treaty, and an evident ease in the company of [ShowReligionGroupAdjective('christian')] and [ShowReligionGroupAdjective('muslim')] envoys alike, that has drawn the eye of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] more than once this year.\n\nAppointing [target_character.GetHimHer] to high office would place a [ShowReligionAdjectiveWithNoTooltip('judaism')] hand firmly on the machinery of a [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] [ROOT.GetCountry.GetGovernment.GetCourtTitle], an arrangement with true precedent across the long history of al-'Andalus, from the Umayyad caliphs onward, but one that the pious among our own [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], and the wider populace besides, will not welcome quietly, whatever service [target_character.GetSheHe] might render the treasury."
 d009_convivencia.7.a: "Appoint [target_character.GetHimHer] vizier."
 d009_convivencia.7.a.entry: "Appoint him vizier."
 d009_convivencia.7.b: "Pass [target_character.GetHimHer] over for a [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] candidate."
 d009_convivencia.7.b.entry: "Pass him over for a Muslim candidate."
 d009_convivencia.7.historical_info: "The most famous real precedent for a Jewish vizier in Muslim Iberia is Samuel ibn Naghrilla, who rose to become vizier of the Taifa kingdom of Granada in the 11th century, followed by his son Joseph, who held the same office until he was killed in a massacre of Granada's Jewish community in 1066. The Nasrid emirate that ruled Granada from the 13th century onward inherited a court culture where such appointments, while never uncontroversial, had historical footing."
 d009_convivencia_7_judaism_population_tt: "Realm has a Jewish population"
