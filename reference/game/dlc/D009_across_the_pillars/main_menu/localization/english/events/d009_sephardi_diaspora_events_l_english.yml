l_english:
 d009_crypto_jewish_exodus_tt: "[ShowReligionAdjective('catholic')] converts descended from the crypto-Jewish community quietly revert to their old faith and slip away to [d009_exodus_destination.GetName]"
 d009_sephardi_diaspora.1.title: "The Exiles Arrive"
 d009_sephardi_diaspora.1.entry: "$d009_sephardi_diaspora.1.title$"
 d009_sephardi_diaspora.1.desc: "Word reaches our [ROOT.GetCountry.GetGovernment.GetRulerTitle] that [origin_country.GetNameWithNoTooltip] has driven its [ShowReligionAdjective('judaism')] subjects from its shores, and that a great many of them now wait at our ports with nothing but what they could carry. Our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] see in their arrival a windfall of skilled hands and ready capital, while our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] see a mass of strangers whose loyalty and faith we cannot yet vouch for. Whatever we decide will be remembered by every exile who hears of it."
 d009_sephardi_diaspora.1.a: "Welcome them officially."
 d009_sephardi_diaspora.1.b: "Restrict them to specific cities."
 d009_sephardi_diaspora.1.historical_info: "Sultan Bayezid II is said to have remarked that Ferdinand of Aragon impoverished his own country and enriched the Ottomans by expelling the Jews, and he ordered his provincial governors to welcome the exiles and not to turn them away. Tens of thousands settled across the Ottoman Balkans and Anatolia over the following decades, bringing printing presses, textile techniques, and trade networks that measurably enriched Ottoman cities, especially Thessaloníki and Constantinople."

 d009_sephardi_diaspora.2.title: "[ShowLocationNameWithNoTooltip('thessaloniki')] Becomes [ShowReligionAdjectiveWithNoTooltip('judaism')]"
 d009_sephardi_diaspora.2.entry: "$d009_sephardi_diaspora.2.title$"
 d009_sephardi_diaspora.2.desc: "In the years since the exiles first landed, [ShowLocationName('thessaloniki')] has been transformed. Its docks, its workshops, and its markets now run to the rhythm of the Sabbath more than any other calendar, and its [ShowReligionAdjective('judaism')] population has grown to outnumber every other community in the city combined. Our own officials have started keeping their accounts to the same rhythm, if only because so much of the city's trade now depends on it."
 d009_sephardi_diaspora.2.a: "Let the city's character speak for itself."
 d009_sephardi_diaspora.2.historical_info: "By the mid-16th century, Sephardi Jews made up a majority of Thessaloníki's population, and the city became known among Jewish communities across Europe and the Mediterranean as a center of Sephardi learning, printing, and textile production, particularly wool cloth woven for Ottoman military uniforms. Judeo-Spanish (Ladino) remained a major language of the city's streets and markets well into the 20th century."
 d009_thessaloniki_has_sephardi_pops_tt: "[ShowLocationNameWithNoTooltip('thessaloniki')] is home to [ShowCultureNameWithNoTooltip('sephardi')] [pops|e]"

 d009_sephardi_diaspora.3.title: "The [ROOT.GetCountry.GetNameWithNoTooltip] Ghetto"
 d009_sephardi_diaspora.3.entry: "The Ghetto"
 d009_sephardi_diaspora.3.desc: "Our Senate proposes to confine the [ShowReligionAdjective('judaism')] community of [ROOT.GetCountry.GetCapital.GetName] to a single walled island, its gates locked at night and guarded by day, its residents permitted out only under strict conditions. Supporters call it a sensible middle path between expulsion and unrestricted settlement; the [ShowReligionAdjectiveWithNoTooltip('judaism')] merchants and moneylenders whose credit [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] has long depended on call it something considerably less flattering."
 d009_sephardi_diaspora.3.a: "Establish the Ghetto."
 d009_sephardi_diaspora.3.b: "Resist the pressure to confine them."
 d009_sephardi_diaspora.3.historical_info: "Venice established its Jewish ghetto in 1516, confining the community to the Cannaregio district's Ghetto Nuovo, gated and guarded at night. The word #italic ghetto#! itself originates from this Venetian quarter, likely from the Venetian word for the copper foundry (#italic geto#!) previously located there, and the model of enclosed, state-mandated Jewish quarters spread to other cities in Italy over the following century."
 d009_venice_has_jewish_pops_tt: "[ShowLocationNameWithNoTooltip('venice')] is home to [ShowReligionAdjectiveWithNoTooltip('judaism')] [pops|e]"

 d009_sephardi_diaspora.4.title: "[target_character.GetNameWithNoTooltip] and the Ferrara Bible"
 d009_sephardi_diaspora.4.entry: "Doña Gracia Mendes and the Ferrara Bible"
 d009_sephardi_diaspora.4.desc: "[target_character.GetName], a [GetCountry('POR').GetAdjective] widow of considerable fortune and no small daring, has settled in [ShowLocationNameWithNoTooltip('ferrara')] and begun openly living as what she always secretly was, a Jewess of substantial means and stronger conviction. [target_character.GetSheHe] finances a Ladino translation of scripture for conversos who never learned Hebrew, and quietly maintains a network of agents and safe houses stretching back into [GetCountry('POR').GetNameWithNoTooltip] itself, ready to carry out anyone who wishes to follow her example."
 d009_sephardi_diaspora.4.a: "Support her work."
 d009_sephardi_diaspora.4.b: "Restrict her activities."
 d009_sephardi_diaspora.4.historical_info: "Doña Gracia Mendes Nasi (born Beatriz de Luna in Lisbon, c.1510) built one of the great converso trading fortunes of the 16th century, and after settling openly as a Jew, first in Antwerp and then Ferrara, used both her wealth and her connections to fund the 1553 Ferrara Bible, a Ladino translation aimed at conversos who had lost fluency in Hebrew, and to help finance escape routes for Portuguese New Christians fleeing the Inquisition."

 d009_sephardi_diaspora.5.title: "[target_character.GetNameWithNoTooltip] and the Resettlement of [ShowLocationNameWithNoTooltip('safed')]"
 d009_sephardi_diaspora.5.entry: "Don Joseph Nasi and the Resettlement of Safed"
 d009_sephardi_diaspora.5.desc: "[target_character.GetName], a [GetCountry('POR').GetAdjective]-born financier who has done our [ROOT.GetCountry.GetGovernment.GetRulerTitle] considerable service in the courts of Europe, now asks for a grant over [ShowLocationName('safed')] and its surrounding country, hoping to settle it thickly with fellow exiles and build there a center of [ShowReligionAdjective('judaism')] learning and silk-weaving that answers to no crown but ours. [target_character.GetHerHis] ambitions are unmistakably grand, and so, our treasury notes, is [target_character.GetHerHis] fortune."
 d009_sephardi_diaspora.5.a: "Grant [target_character.GetHimHer] the resettlement."
 d009_sephardi_diaspora.5.a.entry: "Grant Don Joseph Nasi the resettlement."
 d009_sephardi_diaspora.5.b: "Refuse."
 d009_sephardi_diaspora.5.historical_info: "Don Joseph Nasi, Doña Gracia's nephew and son-in-law, rose to become one of Sultan Suleiman the Magnificent's most trusted advisors and was granted lordship over Tiberias and its surrounding villages around 1560s, with the aim of rebuilding it as a center of Jewish settlement and silk production. The project achieved only modest success in his lifetime, but it is often remembered as an early precursor to later Jewish resettlement efforts in the region."

 d009_sephardi_diaspora.6.title: "La Livornina"
 d009_sephardi_diaspora.6.entry: "$d009_sephardi_diaspora.6.title$"
 d009_sephardi_diaspora.6.desc: "Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] is drafting a charter, La Livornina, that would throw open [ShowLocationName('livorno')] to [ShowReligionAdjective('judaism')] and converso merchants on terms as generous as any state in Christendom has yet offered, freedom of worship, exemption from the badge, and the right to trade on equal footing with our own subjects. The port's older merchant families are not entirely pleased at the thought of the competition such generosity will invite."
 d009_sephardi_diaspora.6.a: "Issue La Livornina."
 d009_sephardi_diaspora.6.b: "Restrict [ShowReligionAdjectiveWithNoTooltip('judaism')] settlement."
 d009_sephardi_diaspora.6.historical_info: "Ferdinando I de' Medici issued La Livornina in 1593, offering Jewish and converso merchants exceptionally generous terms, exemption from wearing a distinguishing badge, freedom of worship, and equal legal standing with Christian merchants, specifically to build up Livorno as a trading port. The charter succeeded remarkably well, and Livorno's Jewish community grew into one of the most prosperous and least restricted in early modern Italy."
 variable_d009_sephardi_diaspora_6_fired_tt: "La Livornina Has Been Issued"
 d009_country_has_sephardi_pops_tt: "Our lands are home to [ShowCultureNameWithNoTooltip('sephardi')] [pops|e]"

 d009_sephardi_diaspora.7.title: "The [GetCountry('POR').GetAdjectiveWithNoTooltip] Nation of [ShowLocationNameWithNoTooltip('amsterdam')]"
 d009_sephardi_diaspora.7.entry: "$d009_sephardi_diaspora.7.title$"
 d009_sephardi_diaspora.7.desc: "For years now, merchants arriving from [GetCountry('POR').GetNameWithNoTooltip] and calling themselves simply the Portuguese Nation have settled quietly in [ShowLocationName('amsterdam')], keeping their own counsel and their own customs behind closed doors. It has become an open secret among our own [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] that a great many of these merchants are, and have always been, practicing Jews, and that the fortune they bring with them is considerable."
 d009_sephardi_diaspora.7.a: "Grant them freedom of worship."
 d009_sephardi_diaspora.7.b: "Maintain the old restrictions."
 d009_sephardi_diaspora.7.historical_info: "Portuguese conversos, calling themselves the Portuguese Nation, began settling in Amsterdam around the 1590s, openly returning to Judaism once Hollandish authorities extended de facto tolerance, though full legal recognition came gradually. By the mid-17th century Amsterdam's Sephardi community had become one of the wealthiest and most influential in Europe, home to the Portuguese Synagogue and a printing industry that made the city a major center of Hebrew and Ladino publishing."
 variable_d009_amsterdam_jewish_nation_tt: "The Portuguese Jewish Nation Gained Recognition in [ShowLocationName('amsterdam')]"

 d009_sephardi_diaspora.8.title: "[ShowCultureNameWithNoTooltip('sephardi')] Brazilians Flee to New Amsterdam"
 d009_sephardi_diaspora.8.entry: "$d009_sephardi_diaspora.8.title$"
 d009_sephardi_diaspora.8.desc: "Word has reached us that [GetCountry('POR').GetAdjective] forces are pressing hard against our colonies across the ocean, and the [ShowCultureName('sephardi')] merchant families who built their lives under our flag there have nowhere left to turn but towards other colonies of ours. A number of them have already sailed for our settlement at the mouth of the North River, hoping the freedoms granted here in [ShowLocationName('amsterdam')] will follow them across the water."
 d009_sephardi_diaspora.8.a: "Welcome them to the colony."
 d009_sephardi_diaspora.8.b: "Restrict immigration to Europe only."
 d009_sephardi_diaspora.8.historical_info: "After Portugal reconquered Hollandish Brazil in 1654, a group of twenty-three Sephardi Jewish refugees sailed north and landed in New Amsterdam, becoming the first known Jewish settlers in what would later become New York. Governor Peter Stuyvesant initially tried to expel them, but was overruled by the Hollandish West India Company, whose own board included Jewish shareholders, a decision that let this small community become the seed of what is today one of the largest Jewish populations in the world."
