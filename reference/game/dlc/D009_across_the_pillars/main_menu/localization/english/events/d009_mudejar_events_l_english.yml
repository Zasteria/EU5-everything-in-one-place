l_english:
 d009_mudejar.1.title: "The Aljama Charter"
 d009_mudejar.1.entry: "$d009_mudejar.1.title$"
 d009_mudejar.1.desc: "Across our towns, [ShowReligionGroupAdjective('muslim')] communities remain organized much as they were before the reconquest: under their own qāḍī, bound by their own customs, and collectively answering to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] rather than individually to any lord who might claim them. Our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] press for a formal charter that would recognize this self-governance as a permanent right rather than a tolerated custom, arguing plainly that a secure aljama pays its taxes more reliably than a resentful one ever will. Our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] see the same arrangement rather differently, as an anomaly the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] ought to be correcting rather than enshrining in law. We now face the significant decision of whether [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] autonomy in this realm rests on a charter or merely on the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s own patience."
 d009_mudejar.1.a: "Grant the charter."
 d009_mudejar.1.b: "Deny self-governance."
 d009_mudejar.1.b.tt: "Our [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] subjects chafe under the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s closer supervision"
 d009_mudejar.1.historical_info: "Mudéjar communities across Christian Iberia typically lived under charters, sometimes called #italic cartas de población#! or aljama privileges, that guaranteed a measure of self-governance over their own courts, mosques, and internal affairs in exchange for taxes and loyalty to the crown. These charters varied enormously in generosity from kingdom to kingdom and shrank steadily over the 15th and 16th centuries as royal tolerance for Islam within Christian territory eroded."

 d009_mudejar.2.title: "The Mudéjar Quarter Expands"
 d009_mudejar.2.entry: "$d009_mudejar.2.title$"
 d009_mudejar.2.desc: "The [ShowReligionGroupAdjective('muslim')] quarter of [target_location.GetName] has outgrown the bounds it was allotted generations ago. New workshops crowd the old lanes, and families petition for land beyond the quarter's traditional edge, arguing that a craft too cramped to grow is a craft slowly dying. Our officials on the ground are of two minds, some see a thriving tax base worth encouraging, others a precedent that will be harder to reverse the longer it is allowed to stand."
 d009_mudejar.2.a: "Encourage the quarter's expansion."
 d009_mudejar.2.b: "Constrain it to its existing bounds."

 d009_mudejar.3.title: "The Capitulations of [ShowLocationNameWithNoTooltip('granada')]"
 d009_mudejar.3.entry: "$d009_mudejar.3.title$"
 d009_mudejar.3.desc: "[ShowLocationName('granada')] has fallen, and the terms our [ROOT.GetCountry.GetGovernment.GetRulerTitle] swore to its [ShowReligionGroupAdjective('muslim')] population were generous by the standards of any conquest, freedom of worship, their own courts, and their own customs, all guaranteed in writing. Whether those guarantees survive contact with a court eager to finish what the conquest began is now the only question that matters to the tens of thousands of Muslims who surrendered on the strength of our word."
 d009_mudejar.3.a: "Honor the capitulations."
 d009_mudejar.3.b: "Issue conversion pressure immediately."
 d009_mudejar.3.b.tt: "The [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] population of [ShowLocationNameWithNoTooltip('granada')] reels at the broken promise"
 d009_mudejar.3.historical_info: "The Capitulations of Granada, signed in November 1491 as part of the emirate's surrender, guaranteed Granada's Muslims freedom of worship, use of their own language and customs, and continued application of Muslim law under their own judges. In practice, the terms began eroding almost immediately after the 1492 conquest and were largely abandoned within a decade, culminating in the forced conversions of 1499–1502."
 variable_d009_gra_capitulations_honored_tt: "The Capitulations of Granada were Honored"

 d009_mudejar.4.title: "Cisneros in [ShowLocationNameWithNoTooltip('granada')]"
 d009_mudejar.4.entry: "$d009_mudejar.4.title$"
 d009_mudejar.4.desc: "Cardinal [target_character.GetName] has arrived in [ShowLocationNameWithNoTooltip('granada')] with little patience for the capitulations our crown once swore to honor. Where the previous archbishop preached slow conversion through persuasion, [target_character.GetHerHis] preferred instrument is the mass baptism: entire quarters brought to the font in a single afternoon, willingly or not. Our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] regard [target_character.GetHerHis] zeal as long overdue; the terms of surrender, [target_character.GetSheHe] argues, were a wartime expedient, not a permanent obligation."
 d009_mudejar.4.a: "Permit Cisneros to proceed."
 d009_mudejar.4.b: "Restrain Cisneros."
 d009_mudejar.4.historical_info: "Cardinal Francisco Jiménez de Cisneros, Archbishop of Toledo and confessor to Queen Isabella, arrived in Granada in 1499 and, frustrated with the slow pace of voluntary conversion under his predecessor Hernando de Talavera, began mass forced baptisms that directly provoked the First Revolt of the Alpujarras. His actions are generally seen by historians as the decisive break with the Capitulations of Granada's promises."

 d009_mudejar.5.title: "The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Mudéjars"
 d009_mudejar.5.entry: "The Mudéjars"
 d009_mudejar.5.desc: "Word has reached our [ROOT.GetCountry.GetGovernment.GetCourtTitle] of neighboring [ShowReligionGroupAdjective('christian')] realms completing their own campaigns of forced conversion against their [ShowReligionGroupAdjective('muslim')] subjects, and the pressure to do the same to [ROOT.GetCountry.GetNameWithNoTooltip]'s own Mudéjar communities, still openly practicing their faith in the towns of [ShowAreaName('aragon_area')] and [ShowAreaName('valencia_area')], has only grown since. Our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] press for the same mass baptism already imposed elsewhere, while our [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] subjects point to charters centuries old that promised otherwise. This [ROOT.GetCountry.GetGovernment.GetRulerTitle] has very little room left to simply do nothing."
 d009_mudejar.5.a: "Order mass baptism."
 d009_mudejar.5.a.tt: "Our [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] communities in [ShowAreaName('aragon_area')] and [ShowAreaName('valencia_area')] are forcibly converted"
 d009_mudejar.5.b: "Exempt them from the edict."
 d009_mudejar.5.historical_info: "Charles V ordered the forced conversion of Aragon's remaining Mudéjar population in 1526, decades after Castile's own forced conversions of 1500–1502, following a revolt by the Germanies of Valencia that had already forcibly baptized many Muslims on its own initiative. The Aragonese nobility, who depended heavily on Muslim agricultural labor, resisted the edict for years before it was fully enforced."

 d009_mudejar.6.title: "Moriscos and the [GetCountry('TUR').GetAdjectiveWithNoTooltip] Agents"
 d009_mudejar.6.entry: "$d009_mudejar.6.title$"
 d009_mudejar.6.desc: "Reports reach our court of Morisco communities exchanging letters with agents of the sultan of [GetCountry('TUR').GetNameWithNoTooltip], who has made no secret of his sympathy for the crypto-[ShowReligionGroupAdjective('muslim')] people of [ShowRegionName('iberia_region')]. Whether these contacts amount to conspiracy or merely to the quiet correspondence of people clinging to a faith they can no longer practice openly is impossible to say with certainty, but the mere suspicion is enough to divide our council."
 d009_mudejar.6.a: "Crack down on the contacts."
 d009_mudejar.6.a.tt: "Scrutiny of our crypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] communities intensifies and is renewed"
 d009_mudejar.6.b: "Ignore it."
 d009_mudejar.6.historical_info: "Spanish authorities genuinely feared Morisco contact with the Ottomans and Barbary corsairs throughout the 16th century, and with good cause: intercepted letters and a handful of documented conspiracies, particularly around the 1560s, suggested at least some Morisco communities hoped for Ottoman intervention against Spain. This suspicion fed directly into the harsher policies that culminated in the 1568 Alpujarras rebellion and, eventually, the 1609 expulsion decree."

 d009_mudejar.7.title: "Crypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] Life Under the Inquisition"
 d009_mudejar.7.entry: "$d009_mudejar.7.title$"
 d009_mudejar.7.desc: "Another round of proceedings has opened under our [ShowPolicyName('local_courts')] against the New [ShowReligionGroupAdjective('christian')] households of [target_location.GetName], their private devotions reported by neighbors eager to prove their own orthodoxy beyond doubt. Whether this purges a genuine heresy or merely terrorizes families who have not practiced [ShowReligionGroupName('muslim')] in a generation is a question the tribunal shows little interest in asking."
 d009_mudejar.7.a: "Let the tribunal's work continue."
 d009_mudejar.7.a.tt: "The population of [target_location.GetNameWithNoTooltip] grows weary under the tribunal's constant scrutiny"
 d009_mudejar.7.b: "Quietly warn the community."
 d009_mudejar.7.b.tt: "The population of [target_location.GetNameWithNoTooltip] takes quiet relief from the warning"
 d009_mudejar.7.historical_info: "Morisco communities that outwardly converted often continued practicing Islam privately for generations, a phenomenon well documented in Inquisition trial records, which detail every offense from concealed prayer to dietary practices to secretly maintaining Arabic literacy. The Inquisition's pursuit of these communities intensified steadily through the 16th century and was one of the stated justifications for the eventual expulsion decree of 1609."

 d009_mudejar.8.title: "The Final Question: Expulsion or Assimilation?"
 d009_mudejar.8.entry: "$d009_mudejar.8.title$"
 d009_mudejar.8.desc: "Generations of forced conversion have left [ROOT.GetCountry.GetName] with communities that are [ShowReligionGroupAdjective('christian')] in name but, our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] insist, [ShowReligionGroupAdjective('muslim')] in every way that matters. Every neighboring throne has already settled the question one way or another, and our [ROOT.GetCountry.GetGovernment.GetRulerTitle] can no longer put off deciding whether these New [ShowReligionGroupAdjectiveWithNoTooltip('christian')] communities are a permanent danger to be expelled, a population to be patiently absorbed, or something that calls for a answer somewhere between the two."
 d009_mudejar.8.a: "Issue the edict of expulsion."
 d009_mudejar.8.a.tt: "Our crypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] communities are expelled to the ports of the Maghreb"
 d009_mudejar.8.b: "Pursue an integration program."
 d009_mudejar.8.c: "Order a selective expulsion."
 d009_mudejar.8.historical_info: "Philip III's expulsion decree, issued in 1609 and enforced in stages through 1614, ultimately drove an estimated 300,000 Moriscos out of Spain to Morocco, Tunis, Algiers, and elsewhere in the Ottoman world. It remains one of the largest forced population movements in early modern European history, and its economic consequences, especially the loss of skilled agricultural labor in Valencia and Aragon, were felt in parts of Spain for generations afterward."

 d009_mudejar.9.title: "The Last Morisco"
 d009_mudejar.9.entry: "$d009_mudejar.9.title$"
 d009_mudejar.9.desc: "The generation that still remembered [ShowLanguageName('arabic_language')] prayers spoken behind shuttered windows has passed, and with it the last distinguishable trace of a community that spent a century and a half neither fully [ShowReligionGroupAdjective('muslim')] nor fully [ShowReligionGroupAdjective('christian')] in the eyes of its neighbors. What remains is scattered surnames, a few stubborn recipes, and the quiet closing of a chapter few in [ROOT.GetCountry.GetName] will mourn and fewer still will remember accurately."
 d009_mudejar.9.a: "Acknowledge the end of an era."
 d009_mudejar.9.historical_info: "Historians still debate how thoroughly Morisco identity actually disappeared after conversion or expulsion, many families that stayed and assimilated left traces in surnames, place names, and folk customs that persisted for centuries, while those expelled to North Africa maintained a distinct Andalusi identity abroad for generations, visible today in the architecture, cuisine, and music of cities like Tetouan, Rabat, and Tunis."
