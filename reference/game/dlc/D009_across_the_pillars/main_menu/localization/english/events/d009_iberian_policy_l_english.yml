l_english:
 d009_iberian_policy.1.title: "The Statute of [ShowLocationNameWithNoTooltip('toledo')]"
 d009_iberian_policy.1.entry: "The Statute of Toledo"
 d009_iberian_policy.1.desc: "The debate over [ShowLawName('limpieza_de_sangre_law')] has reached a boiling point in [ShowLocationName('toledo')]. Many representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are demanding that the highest dignities and benefices should only be reserved for Old Christians, and that all descendants of those who converted from [ShowReligionName('judaism')] and [ShowReligionGroupName('muslim')] be excluded. The matter is highly divisive, as many representatives of universities and councils denounce the proposal as unjust, and so the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has been called to step in and resolve the issue."
 d009_iberian_policy.1.a: "Only the purest bloodlines may serve [ROOT.GetCountry.GetReligion.GetGodName] and [ROOT.GetCountry.GetFlavorRank]!"
 d009_iberian_policy.1.b: "Implement it with prudence and restraint."
 d009_iberian_policy.1.c: "Try to strike a balance between both factions."
 d009_iberian_policy.1.historical_info: "In 1546, the newly elected Archbishop of Toledo, Juan Martínez Silíceo, initiated the adoption of a new blood purity statute in response to the appointment of a convert. Silíceo managed to make the Pope revoke the appointment, and despite the protests of many archdeacons, city councils, and university representatives, his purity statute was approved by King Philip and later became the standard model for similar legislation adopted throughout Spain."
