l_english:

 seven_cities.10.title: "A Shining City in the Distance"
 seven_cities.10.desc: "The local guides, when the wine is poured and the trade goods are laid out for inspection, are willing to talk. Yes, they have heard of the country [target_leader.GetName] is asking after. Yes, there is a city there, beyond the next sierra, perhaps two weeks further. One man swears he saw the sun rising over its walls from a distance, gold-colored. Another says his uncle traded there for a season and came back rich. A third says it is a fairy-tale and the first two will say anything for a measure of brandy. The chronicler writes it all down."
 seven_cities.10.a: "Brandy for the men with the best stories."
 seven_cities.10.b: "Bid them farewell and march."
 seven_cities.10.b.tt: "#italic We bid the storytellers farewell and set off, trusting the trail over another round of tall tales#!"
 seven_cities.10.historical_info: "Early Spanish, French, and English #italic entradas#! in the Americas relied almost entirely on native informants for geographic intelligence. The information was often shaped by what the natives believed their interrogators wanted to hear, by what the natives wanted the interrogators to do (frequently, to leave), and by the conjectural picture the interrogators arrived with. The result was a chronic feedback loop in which European legends of golden cities were validated by native testimony that had itself been calibrated to European expectations."
 natives_provide_crudely_drawn_map_tt: "#Y The locals provide a crudely drawn map of the surrounding territories#!"
 expedition_learns_of_potential_dangers: "#Y The [expedition|e] learns of potential local dangers#!"
 bonding_over_alcohol_locals_migrate_tt: "#Y A common love of alcohol and good conversation creates brotherly bonds#!"
 improve_root_culture_view_of_location_dominant_culture_tt: "Our [cultural_opinion|e] of [target_location.GetDominantCulture.GetName] will improve"
 expedition_observes_local_innovations: "#Y Local innovations are observed and cataloged#!"
 expedition_receives_artifacts_as_gifts: "#Y Cultural artifacts will be presented as gifts upon our return to [ROOT.GetCountry.GetCapital.GetName]#!"
 should_calamity_occur_chance_to_avoid_tt: "Local hostile bands and wildlife will prove less of a threat"
 may_bring_us_closer_to_uncovering_goal_tt: "This may bring us closer to uncovering what we seek"
 expedition_brought_back_riches_tt: "The [expedition|e] brought back riches:"
 expedition_brought_back_exotic_goods_tt: "The porters and cargo of the [expedition|e] brought back exotic goods:"
 expedition_brought_back_artifacts_tt: "The [expedition|e] brought back gifts and artifacts:"
 expedition_healer_joins_court_tt: "A native healer joins our court when the [expedition|e] returns"
 porters_guides_prevent_stalling: "The porters and guides that accompany the [expedition|e] prevent it from stalling"
 warned_expedition_avoids_calamity_tt: "Forewarned of the local dangers, the [expedition|e] avoids calamity"

 seven_cities.11.title: "A Feast of Welcome"
 seven_cities.11.desc: "The [target_location.GetRank.GetName] turns out to meet us before we have even pitched camp: drums, a swept plaza, and mats laid with more food than the men have seen in a month of marching. Their headman greets [target_leader.GetName] with the grave courtesy of an equal, and the feasting is well under way before anyone thinks to ask a question. Our interpreters murmur that a welcome this warm is never truly free, and that what is pressed upon a guest in one breath tends to be counted against him in the next. Still, an open host and a laden table have loosened more tongues than any threat we might have made."
 seven_cities.11.a: "Answer their welcome with open hands and open purses."
 seven_cities.11.b: "We did not cross an ocean to sit and eat."
 seven_cities.11.b.tt: "#italic We take the meal but spare our purse, and march on before the welcome becomes an obligation#!"
 seven_cities.11.historical_info: "Ceremonial hospitality was central to diplomacy across much of the Americas, and arriving Europeans were frequently received with feasting, gifts, and formal welcome before any business was discussed. Coronado's column was lodged and fed by Pueblo towns along the Rio Grande, and de Soto's was hosted by Mississippian chiefdoms across the southeast, in each case as a way of managing dangerous strangers rather than submitting to them. The Europeans carried glass beads, hawk's bells, cloth, and knives expressly to open such exchanges. The gifts bought goodwill and information, but the underlying transaction was almost always understood very differently on each side."
 expedition_receives_guides_and_porters: "#Y Guides and porters are added to the journey#!"
 expedition_less_likely_to_stall_tt: "The [expedition|e] will be less likely to stall"
 expedition_receives_exotic_goods: "#Y The [expedition|e] trades for exotic local goods to carry home#!"

 seven_cities.12.title: "The Eager Guide"
 seven_cities.12.desc: "He finds us rather than we him: a lean, easy-smiling man who seems to carry a little of every tongue along the trail and swears, hand pressed to his heart, that he has stood before the gates of the golden city with his own eyes. He asks only a guide's wage and a modest share of the glory to lead us there. [target_leader.GetName] listens with the practiced wariness of one who has heard this very promise before, in other valleys, from other mouths. The men, though, have already made up their minds, and their eyes shine every bit as bright as his."
 seven_cities.12.a: "Fortune and glory!"
 seven_cities.12.b: "Away with you, vile beggar!"
 seven_cities.12.b.tt: "#italic We drive the smiling guide off and keep to the trail we can read for ourselves#!"
 seven_cities.12.historical_info: "The most notorious guide of the North American #italic entradas#! was the Plains captive the Spanish called El Turco, who told Coronado's expedition of Quivira, a kingdom to the northeast supposedly rich in gold. He led the column for weeks out onto the Great Plains and later admitted, under interrogation, that he had been steering it into the grass in the hope that the men and their horses would die there. Quivira, when finally reached, proved to be a cluster of Wichita grass-lodge villages with no gold at all, and El Turco was executed. The episode was typical: guides had their own reasons for where they led armed strangers, and those reasons rarely matched the expedition's."
 expedition_uncovers_riches_in_new_waypoint: "#Y The guide's road proves true, and it uncovers real riches#!"
 expedition_led_to_deathly_trap: "#Y The guide leads us into ambush, and the [expedition|e] is lost#!"
 guide_lied_waste_of_time: "#Y The guide has led us in circles, and his golden city was a lie#!"
 target_character_flogged_tt: "The lying guide is flogged for his deceit"

 seven_cities.13.title: "A Familiar Tongue"
 seven_cities.13.desc: "Somewhere along the march, [target_leader.GetName] changed. Where once [target_leader.GetSheHe] spoke only of the city ahead, now [target_leader.GetSheHe] speaks of the people here: their tongue [target_leader.GetSheHe] has half-learned, the roof they have offered, the settled life that waits if [target_leader.GetSheHe] would only stop wandering. This morning [target_leader.GetSheHe|U] told us plainly that the expedition may march on, but that [target_leader.GetSheHe] will not. Some men are lost to the wilderness, and some, it seems, are claimed by it."
 seven_cities.13.a: "Then let [target_leader.GetHerHim] stay, and let the dream end here."
 seven_cities.13.historical_info: "Shipwrecked or captured Europeans who had lived for years among native peoples were prized by later expeditions as interpreters. Hernando de Soto found Juan Ortiz, a survivor of the earlier Narvaez expedition, living among the Uzita of Florida after some eleven years, and Ortiz served as his interpreter until his death on the march. Gonzalo Guerrero, wrecked on the Yucatan coast in 1511, went the other way entirely, marrying into a Maya community, refusing rescue, and reportedly dying in battle against the Spanish. Such men were living bridges between worlds, and their loyalties could fall on either side of the line."

 seven_cities.14.title: "The Fountain of Youth?"
 seven_cities.14.desc: "The tale reaches us third-hand and swells with every retelling: somewhere in the hills beyond lies a spring whose waters close old wounds, straighten bent backs, and hand a man back the years the march has stolen from him. The natives speak of it with the guarded reverence they keep for holy places, which is either proof of something or proof of nothing at all. Our surgeon rolls his eyes and mutters about swamp fever. Half the camp is already filling waterskins."
 seven_cities.14.a: "Explore the spring."
 seven_cities.14.b: "There is no time to splash around!"
 seven_cities.14.b.tt: "#italic We march past the rumored spring and leave its waters to the credulous#!"
 seven_cities.14.historical_info: "The fountain of youth was a real strand of the geographic lore Europeans carried into the Americas, and it became attached to Juan Ponce de Leon's exploration of Florida in 1513. The claim that he sailed specifically in search of rejuvenating waters is largely a later embellishment, first pressed by his political enemies, but it drew on older Old World legends of curative and life-extending springs that were widely credited. Native informants across the Caribbean and the southeast did direct Europeans toward sacred and medicinal waters, which were genuine features of their own ritual landscapes. The distance between what was described and what was sought was, once again, very wide."
 spend_some_time_recovering: "#Y The men rest and take the waters for a time#!"
 retrieve_some_rejuvenating_water: "#Y Flasks of the fabled restoring water are carried off#!"
 just_water_hole: "#Y It proves a common waterhole...#!"

 seven_cities.15.title: "A Glint in the Riverbed"
 seven_cities.15.desc: "One of the men crouches at the streambed at dusk, washing gravel through his pan the way the old hands taught him, and comes up cursing and laughing at once: a single bright grain of [target_material.GetName] caught in the silt. Upstream, then, there is more of it. Whether it is the treasure the whole march has chased across a continent or a seam of worthless glitter fit only to gull greedy men, none can say tonight, and none much wishes to ask."
 seven_cities.15.a: "Every man to the river with a pan."
 seven_cities.15.b: "Bah! Surely the pyrite king!"
 seven_cities.15.historical_info: "The #italic Sierra de la Plata#!, the mountain of silver, was a rumor that drew Spanish and Portuguese expeditions deep into the basin of the Rio de la Plata from the 1520s, and it gave both the river and eventually the country their names. The rumor was not baseless: it pointed, however dimly, toward the real silver wealth of the Andes, above all the mountain of Potosi, whose discovery in 1545 would reshape the world economy. But the men who followed the early reports upriver mostly found hardship and hostile country rather than silver, and the fabled sierra receded ahead of them for a generation. A little metal panned from a streambed was often the only tangible sign that the story was not pure invention."
 expedition_brings_back_valuable_materials: "#Y Valuable ore is dug and carried back to the market of [ROOT.GetCountry.GetCapital.GetName]#!"
 study_their_technique: "#Y We master new mining methods, easing the cost of mine expansion and enriching our best deposits#!"
 men_are_met_by_hunger_and_false_legends: "#Y The riverbed yields nothing but hunger and false hope#!"
 expedition_outcome_severely_hindered_tt: "We lose one of our hard-won leads"
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "#italic We abandon the search for metal and march on#!"

 seven_cities.16.title: "A Chieftain's Hospitality"
 seven_cities.16.desc: "The [target_location.GetRank.GetName] is large and well kept, and its chief receives us with a wary courtesy that plainly costs him something. His storehouses are full and his young men know every trail inland. He also has every reason to want us gone by morning. Our officers look at those storehouses and those idle strong backs and see porters and guides for the taking. [target_leader.GetName] must decide whether this is a place to strike a bargain or a place to seize what we need and leave the reckoning to whoever follows us."
 seven_cities.16.a: "Seize the chief and march his people at spearpoint."
 seven_cities.16.b: "Bargain for willing porters and part on good terms."
 seven_cities.16.c: "Trouble no one. Strike camp and move on."
 seven_cities.16.c.tt: "#italic We leave the chief in peace and march on, taking neither hostages nor porters#!"
 the_captive_chief_yields_guides: "#Y The captive chief yields guides who know the trails inland#!"
 the_chiefs_hall_is_plundered: "#Y The chief's hall is stripped of its finery before we march#!"
 the_village_empties_before_us: "#Y The [target_location.GetRank.GetName] melts into the forest overnight, guides and all#!"
 coerced_locals_resent_us_tt: "Our [cultural_opinion|e] of [target_location.GetDominantCulture.GetName] will worsen"
 seven_cities.16.historical_info: "Hernando de Soto's usual method for crossing the southeast was to seize the local #italic cacique#!, or paramount chief, on arrival and hold him hostage to guarantee food, porters, and guides for the next stage of the march. The captive lord would be released or exchanged at the edge of his territory for the neighboring chief, and the process repeated. The tactic worked in the short term and left a trail of broken chiefdoms, shattered alliances, and lasting hatred behind the column. It also depended on the Mississippian structure of powerful individual chiefs, and it failed badly wherever authority was more diffuse."

 seven_cities.17.title: "Word from the Shore"
 seven_cities.17.desc: "The shore people paddle out to meet us before the anchor has even touched bottom, and by afternoon they are trading us fish and fresh fruit, and trading talk faster than either. They have clearly done this before. For a knife or a length of cloth they will tell us what lies beyond the treeline, and they tell it eagerly, gesturing always inland and onward. Whether they point us toward the truth or merely toward their neighbors is impossible to know from the beach."
 seven_cities.17.a: "Trade for word of what lies inland."
 seven_cities.17.b: "Note the anchorage and rejoin the march."
 seven_cities.17.b.tt: "#italic We mark the anchorage on our charts and rejoin the march without haggling for rumors#!"
 the_shore_folk_point_the_way: "#Y The shore folk set us on a clear path toward what we seek#!"
 the_shore_market_yields_goods: "#Y A brisk trade on the sand fills our holds with local goods#!"
 the_shore_folk_send_us_at_their_rivals: "#Y Their directions run us in circles toward some rival village#!"
 may_bring_us_closer_and_fill_our_holds_tt: "This may bring us closer to uncovering what we seek and fill our holds with local goods"
 seven_cities.17.historical_info: "Coastal peoples were usually the first Americans any expedition met, and they became its initial source of information about everything inland. Verrazzano's and Cartier's contacts along the North Atlantic coast, the Caribbean landfalls of the first Spanish voyages, and the Brazilian shore encounters of the Portuguese all followed the same pattern: wary trade, mutual inspection, and a flow of geographic rumor from the coast toward the interior. Shore communities often encouraged the strangers to press on toward whatever lay further inland, both to be rid of them and to aim their demands at rivals. What the coast reported about the interior was therefore filtered through the coast's own interests long before it reached a European ear."

 seven_cities.18.title: "A Harbor of Refuge"
 seven_cities.18.desc: "The harbor is everything a worn expedition could pray for. It is deep and well sheltered, with fresh water running down to a beach broad enough to careen the ships and scrape the rot from their hulls. The crews need the rest as badly as the timbers need the work. But a fleet hauled up on a beach is a fleet going nowhere, and idle men in a strange country have a talent for finding trouble. [target_leader.GetName] weighs the days a proper refit will cost against the state of the ships and the temper of the crews."
 seven_cities.18.a: "Careen the hulls and reprovision properly."
 seven_cities.18.b: "Rest a single night and sail on."
 seven_cities.18.b.tt: "#italic We grant the crews a single night ashore and put back to sea before the ships take root#!"
 the_refit_goes_smoothly: "#Y The refit goes cleanly, and the ships answer the better for it#!"
 a_wreck_yields_salvage: "#Y The crews strip a wreck rotting in the shallows for whatever it is worth#!"
 the_crew_falls_to_brawling: "#Y Idle ashore, the crews fall to brawling, and days are lost restoring order#!"
 seven_cities.18.historical_info: "A sheltered harbor was indispensable to any expedition that traveled partly by sea, giving it a place to careen and repair hulls, take on fresh water and firewood, and rest crews worn down by the passage. Magellan's fleet wintered for five months at Puerto San Julian on the Patagonian coast, where the enforced halt also produced a mutiny that he put down with great violence. Explorers frequently spent longer refitting in such anchorages than they did under sail, and a good harbor with a friendly or indifferent local population could decide whether an expedition continued or fell apart. The choice of where to stop was often as consequential as the choice of where to go."

 seven_cities.20.title: "The Country Will Not Feed Us"
 seven_cities.20.desc: "The country we are crossing is drier and emptier than the briefings led us to believe. The pack animals are starting to fail. The men have been on half rations for ten days. The local villages have hidden their stores or burned them. There is fresh water in only two of every six valleys we cross. [target_leader.GetName] gathers the officers in the lee of a thorn-tree and asks how much further they can keep going without resupply."
 seven_cities.20.a: "Buy supplies at any price."
 seven_cities.20.b: "Halt and let the men rest."
 seven_cities.20.historical_info: "Supply was the chronic constraint on inland exploration in the Americas. Cortes's army was fed largely by the political collapse of Aztec authority that allowed the Tlaxcalans and other allies to provision him. Coronado's column into the southwest had no equivalent support and starved by degrees as it pushed north. The pattern recurred from Florida to Patagonia: an #italic entrada#! that could not buy or seize food from the country it was crossing would melt away on the trail, regardless of what gold lay beyond."

 seven_cities.21.title: "Ambushed at the Canyon"
 seven_cities.21.desc: "The party has marched into a narrow defile between two limestone walls and the natives have closed the road behind them. Arrows from above; warriors with stone clubs on the canyon floor; the pack train scattering. The men do what men in this position have always done, they form a hedgehog and put their backs to the rock. [target_leader.GetName] is conferring with the sergeants. The choice is to fight through the canyon at cost, or to fall back the way we came and find another road around."
 seven_cities.21.a: "Force the canyon with steel and shot."
 seven_cities.21.b: "Withdraw and find another road."
 seven_cities.21.historical_info: "Native ambush warfare in defensible terrain, narrow canyons, mountain passes, forest trails, was the most effective form of resistance to early colonial #italic entradas#!. Spanish armor, firearms, and horses gave decisive advantage on open ground but were systematically negated in close country. Roughly half of Coronado's marches in the southwest were forced detours around territory his column could not safely cross, and the same pattern produced the long string of failed French and English forays into the interior of North America before the eighteenth century."

 seven_cities.22.title: "An Ancient Ruin"
 seven_cities.22.desc: "The trail crests a ridge and looks down on what was once a city. The walls are stone, the roofs are mostly fallen in, the streets are choked with the trees of a century. There are no people. There has not been anyone here for some time. The scouts circle the perimeter at a respectful distance, the chronicler is at work on a sketch, and the priest is debating with himself whether to enter, since dead cities have been known to sicken those who profane them. [target_leader.GetName] gives the sketcher an hour."
 seven_cities.22.a: "Catalog the ruin before we march on."
 seven_cities.22.historical_info: "Pre-Columbian America was crowded with abandoned settlements: Mississippian mound centers in the southeast, Pueblo great-houses in the southwest, Chaco itself, the Tiwanaku basin in the Andes, the Maya cities of the southern Yucatan. Sixteenth-century European explorers walking these landscapes routinely came on stonework, agricultural terraces, and ceremonial centers that had been abandoned a century or more earlier. The persistent European theory that these ruins must be the work of a vanished European or Mediterranean population, Welsh, Phoenician, Lost Tribes of Israel, was already in circulation by the 1540s and would survive in some quarters into the twentieth century."

 seven_cities.30.title: "The Trail Goes Cold"
 seven_cities.30.desc: "The column has reached the rendezvous the guides described as the gateway to the country we were sent to find. There is no gateway. The guides have either lied or been lying to themselves; the survey of the surrounding hills shows no city, no smoke, no road, no sign that anyone has been here in living memory. [target_leader.GetName] writes to the crown asking for instructions, then crumples the letter, since by the time it reaches a port the column will have made its own decision. There are two options: press on into the country regardless, on the off chance the city lies one valley further; or turn the column around and march home with what we have."
 seven_cities.30.a: "Press on toward the city regardless."
 seven_cities.30.b: "Turn back and report honestly."
 seven_cities.30.historical_info: "The standard pattern for failed #italic entradas#! was not the dramatic massacre but the slow petering-out: a column running short of supplies, losing scouts to disease and desertion, finding that each promised landmark was either a misunderstanding or a lie, until the surviving officers turned the men around and walked home through territory they now knew was empty. The Coronado expedition, the Cabrillo expedition, the De Soto expedition, the Aguirre expedition down the Amazon, all followed this curve to one degree or another. Successful #italic entradas#! of equivalent ambition were rare enough to be remembered for centuries."
