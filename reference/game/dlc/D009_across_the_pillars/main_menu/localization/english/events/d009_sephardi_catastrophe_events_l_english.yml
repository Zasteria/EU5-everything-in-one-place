l_english:
 d009_sephardi_catastrophe.1.title: "The Preaching of Fernando Martínez"
 d009_sephardi_catastrophe.1.entry: "$d009_sephardi_catastrophe.1.title$"
 d009_sephardi_catastrophe.1.desc: "An archdeacon named [target_character.GetName] has been preaching across the towns of [ShowAreaName('andalusia_area')] for years now, each sermon more inflammatory than the last, and this year the crowds [target_character.GetSheHe] stirs up have stopped merely listening. Mobs gather outside the [ShowReligionAdjective('judaism')] quarters of our own towns, armed with more than words, and our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] make no secret of which side they favor. What happens in the streets over these next weeks will not stay confined to them."
 d009_sephardi_catastrophe.1.a: "Send in the guard to suppress the mobs."
 d009_sephardi_catastrophe.1.b: "Let the crowds have their way, within reason."
 d009_sephardi_catastrophe.1.c: "Turn the crown's blessing toward the mobs' cause."
 d009_sephardi_catastrophe.1.historical_info: "Fernando Martínez, archdeacon of Écija, spent years preaching against Sevilla's Jewish community despite repeated royal orders to stop. When he finally incited a mob in June 1391, the violence killed thousands and spread within weeks to Córdoba, Toledo, Valencia, Barcelona, and beyond. It was the single most destructive wave of anti-Jewish violence in medieval Iberia, and the beginning of the mass conversions that would eventually produce the converso population targeted by the Inquisition a century later."

 d009_sephardi_catastrophe.2.title: "The Pogroms Spread"
 d009_sephardi_catastrophe.2.entry: "$d009_sephardi_catastrophe.2.title$"
 d009_sephardi_catastrophe.2.desc: "News of the fury that first broke loose in [ShowAreaName('andalusia_area')] has not stayed there. In town after town across the realm, the same rumors spread, the same sermons are delivered, and the same crowds gather outside [ShowReligionAdjective('judaism')] quarters that had known nothing of this violence a season ago. Whatever calm existed here is already breaking, and no order from our court will reach every street in time."
 d009_sephardi_catastrophe.2.a: "There is little to be done now but watch it happen."
 d009_sephardi_catastrophe.2.historical_info: "The 1391 pogroms spread with startling speed from Sevilla across the summer, reaching Córdoba, Toledo, Valencia, Palma, and Barcelona within weeks, largely because local preachers and mobs in each city took the Sevilla riots as license rather than warning. Contemporary estimates suggest tens of thousands of Jews were killed or forcibly converted that year alone, permanently reshaping the demographic and religious map of Iberia."

 d009_sephardi_catastrophe.3.title: "The Disputation of [ShowLocationNameWithNoTooltip('tortosa')]"
 d009_sephardi_catastrophe.3.entry: "$d009_sephardi_catastrophe.3.title$"
 d009_sephardi_catastrophe.3.desc: "At the Pope's own summons, the rabbis of [ROOT.GetCountry.GetName] have been made to sit through month after month of public disputation in [ShowLocationName('tortosa')], answering for their faith point by point before a hall of [ShowReligionGroupAdjective('christian')] scholars and a [ShowReligionAdjective('judaism')] convert eager to prove his former community wrong. Many have not endured the ordeal with their convictions intact, and more than one aljama now finds its own rabbi gone over to the other side."
 d009_sephardi_catastrophe.3.a: "Let the disputation run its course."
 d009_sephardi_catastrophe.3.b: "Shield our rabbis from the worst of it."
 d009_sephardi_catastrophe.3.b.tt: "The [ShowReligionAdjective('judaism')] community of [ShowLocationNameWithNoTooltip('tortosa')] takes some comfort in the gesture"
 d009_sephardi_catastrophe.3.historical_info: "The Disputation of Tortosa (1413–1414) was convened by the antipope Benedict XIII and ran for over sixty sessions, forcing rabbis from across Aragon to debate scripture against Jerónimo de Santa Fe, a former Jewish physician who had converted to Christianity and argued that the Talmud itself proved Jesus was the messiah. The disputation was followed by a wave of conversions and anti-Jewish legislation across the crown of Aragon."

 d009_sephardi_catastrophe.4.title: "The Inquisition's New Target"
 d009_sephardi_catastrophe.4.entry: "$d009_sephardi_catastrophe.4.title$"
 d009_sephardi_catastrophe.4.desc: "The tribunal raised to root out heresy has, until now, occupied itself with matters far from the aljamas. That is changing. Whispers reach our [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s council daily of New [ShowReligionGroupAdjective('christian')] households in our towns who cross themselves in public and light candles behind shuttered windows, and the tribunal's inquisitors are eager for a mandate to look closer at what those households do once the street outside has gone quiet."
 d009_sephardi_catastrophe.4.a: "Direct the tribunal toward the conversos."
 d009_sephardi_catastrophe.4.b: "Keep the tribunal fixed on heresy alone."
 d009_sephardi_catastrophe.4.historical_info: "The Spanish Inquisition was established by papal bull in 1478 specifically to investigate conversos suspected of secretly continuing Jewish practice. Its founding purpose, unlike the earlier medieval inquisitions, was almost entirely about policing the converted population rather than combating heresy among lifelong Christians. Tomás de Torquemada, its most notorious early Inquisitor General, oversaw a dramatic expansion of exactly this kind of investigation in the 1480s."
 variable_iberian_union_active_tt: "The Iberian Union is Established"

 d009_sephardi_catastrophe.5.title: "The Expulsion from [ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_sephardi_catastrophe.5.entry: "The Expulsion"
 d009_sephardi_catastrophe.5.desc: "Every throne around us that still tolerated a [ShowReligionAdjective('judaism')] community has, in these last years, chosen to end that tolerance, and the pressure to do the same here has become impossible to ignore any longer. Whatever the merits of the old arrangement, we can no longer afford to be the one Iberian crown left standing that still lets [ShowReligionAdjective('judaism')] people call [ROOT.GetCountry.GetName] home."
 d009_sephardi_catastrophe.5.a: "Issue the edict of expulsion."
 d009_sephardi_catastrophe.5.historical_info: "Navarre expelled its Jewish population in 1498, several years after Castile and Aragon (1492) and around the same time as Portugal (1497), largely under pressure from Ferdinand and Isabella once Navarre fell under their influence. It was one of the last independent expulsions in Iberia, closing off nearly every route within the peninsula that Jewish communities driven from Spain and Portugal might otherwise have used to simply relocate rather than leave entirely."

 d009_sephardi_catastrophe.6.title: "The Massacre of [ShowLocationNameWithNoTooltip('lisbon')]"
 d009_sephardi_catastrophe.6.entry: "$d009_sephardi_catastrophe.6.title$"
 d009_sephardi_catastrophe.6.desc: "A mob in our own capital, whipped into a frenzy by wandering friars preaching that the plague besetting [ShowLocationName('lisbon')] is God's judgment on the New Christians in its midst, has turned [ShowLocationNameWithNoTooltip('lisbon')]'s streets into a slaughterhouse. Hundreds of converso men, women, and children lie dead in the squares and doorways, and our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are quietly divided on whether to condemn the killing or bless it."
 d009_sephardi_catastrophe.6.a: "Send in the guard to put down the rioters."
 d009_sephardi_catastrophe.6.b: "Let the city's fury burn itself out."
 d009_sephardi_catastrophe.6.historical_info: "The Lisbon massacre of April 1506 began when Dominican friars blamed New Christians for a drought and plague then afflicting the city, and lasted three days before royal troops finally intervened. Estimates of the dead range from under two thousand to well over three thousand, and the massacre so alarmed King Manuel I that he issued edicts afterward formally protecting New Christians from further mob violence, though the underlying suspicion of them never fully subsided."

 d009_sephardi_catastrophe.7.title: "The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Inquisition Turns on Conversos"
 d009_sephardi_catastrophe.7.entry: "The Inquisition Turns on Conversos"
 d009_sephardi_catastrophe.7.desc: "The tribunal established under our [ShowPolicyName('local_courts')] has spent its first years on ordinary matters of doctrine, but its inquisitors have grown restless watching the New [ShowReligionGroupAdjective('christian')] households of [ShowLocationName('lisbon')], [ShowLocationName('porto')], and [ShowLocationName('evora')] go unexamined generation after generation. A mandate to look into their private devotions is theirs for the asking, and they have made clear they are asking."
 d009_sephardi_catastrophe.7.a: "Grant the tribunal its mandate over the conversos."
 d009_sephardi_catastrophe.7.b: "Confine the tribunal to matters of open heresy."
 d009_sephardi_catastrophe.7.historical_info: "The Portuguese Inquisition was formally established in 1536, decades after Spain's, and initially moved cautiously against the converso population out of concern for the economic damage further persecution might cause. That caution did not last, by the mid-16th century, Portuguese tribunals in Lisbon, Coimbra, and Évora were conducting large-scale prosecutions of New Christians suspected of crypto-Judaism, driving further waves of emigration to Amsterdam, Italy, and the Ottoman Empire."

 d009_sephardi_catastrophe.8.title: "Auto-da-fé"
 d009_sephardi_catastrophe.8.entry: "$d009_sephardi_catastrophe.8.title$"
 d009_sephardi_catastrophe.8.desc: "Another auto-da-fe has been staged in the public square, penitents in yellow sanbenitos paraded before a crowd that has come to expect the spectacle as much as any feast day. Whether this ritual purges a genuine heresy or merely terrorizes households that gave up their old faith generations ago is a question few in the crowd think to ask."
 d009_sephardi_catastrophe.8.a: "Let the tribunal's work continue."
 d009_sephardi_catastrophe.8.historical_info: "The auto-da-fé, Portuguese and Spanish for act of faith, was the Inquisition's public ceremony of sentencing, in which condemned penitents, often dressed in the yellow sanbenito garment marking their guilt, were paraded before a crowd before receiving their punishment, ranging from penance to execution by burning. These events drew enormous public audiences and became a fixture of Iberian civic life for centuries, blending religious ritual with public spectacle."

 d009_sephardi_catastrophe.9.title: "The Marrano Escape Network"
 d009_sephardi_catastrophe.9.entry: "$d009_sephardi_catastrophe.9.title$"
 d009_sephardi_catastrophe.9.desc: "Word has reached the tribunal of a network of New [ShowReligionGroupAdjective('christian')] merchants and sailors quietly arranging passage abroad for families who can no longer bear living under suspicion, their ships slipping out of harbor under cover of ordinary trade. Not every family that wishes to leave will find a place aboard, but some will, and no order from our [ROOT.GetCountry.GetGovernment.GetCourtTitle] reaches every ship before it clears the bar."
 d009_sephardi_catastrophe.9.a: "There is no stopping every ship that leaves harbor."
 d009_sephardi_catastrophe.9.historical_info: "Converso emigration networks operated for generations after the forced conversions, typically routing families through Bordeaux, Antwerp, or Ferrara before onward passage to safer havens such as the Ottoman Empire or, later, Amsterdam. These networks relied heavily on family and business ties among merchants who had themselves already emigrated, and the Portuguese crown periodically tried and failed to shut them down entirely, since the same merchant networks were often essential to its own overseas trade."
