l_english:
 d009_morisco_diaspora.1.title: "The Moriscos Arrive"
 d009_morisco_diaspora.1.entry: "$d009_morisco_diaspora.1.title$"
 d009_morisco_diaspora.1.desc: "Refugees who call themselves Moriscos — [ShowReligionGroupAdjective('muslim')] families expelled from lands their ancestors called home for centuries — have begun settling in [target_location.GetName], carrying with them the customs, trades, and speech of an [ShowRegionName('iberia_region')] few of us have ever seen. Some among our own officials welcome the addition of skilled hands and ready capital; others see strangers whose loyalty to a [ShowReligionGroupAdjectiveWithNoTooltip('christian')]-ruled homeland they only recently escaped is impossible to fully trust."
 d009_morisco_diaspora.1.a: "Welcome them fully."
 d009_morisco_diaspora.1.b: "Restrict them to this quarter alone."
 d009_morisco_diaspora.1.historical_info: "Following the 1609–1614 expulsion decree, an estimated 300,000 Moriscos left Spain for the Maghreb, settling most heavily in Tetouan, Salé, Tunis, and Algiers. Many retained Andalusi speech, dress, and cuisine for generations, while others assimilated into the broader Muslim societies that received them."
 variable_d009_morisco_community_ever_tt: "A Morisco Community Has Existed in Algiers"

 d009_morisco_diaspora.2.title: "The Rabat-Sale Republic"
 d009_morisco_diaspora.2.entry: "$d009_morisco_diaspora.2.title$"
 d009_morisco_diaspora.2.desc: "The Morisco community of [ShowLocationName('sale')] has grown bold enough to govern itself in all but name, its corsair captains answering to a council of their own choosing rather than to any governor we might appoint. Whether we formalize what has already happened in practice or bring [ShowLocationNameWithNoTooltip('sale')] back under closer supervision is a question our court can no longer put off."
 d009_morisco_diaspora.2.a: "Grant them autonomy."
 d009_morisco_diaspora.2.b: "Integrate them into the royal navy."
 d009_morisco_diaspora.2.historical_info: "The Republic of Sale (also called the Republic of Bou Regreg) emerged around 1627 as a semi-independent corsair polity governed by Morisco refugees and their descendants, raiding around Iberia and the Atlantic trade largely outside any sultan's direct control. It eventually submitted to Moroccan authority under the Alaouite dynasty later in the 17th century, though its piratical characteristics persisted for generations."

 d009_morisco_diaspora.3.title: "The Andalus Quarter of [ShowLocationNameWithNoTooltip('tunis')]"
 d009_morisco_diaspora.3.entry: "$d009_morisco_diaspora.3.title$"
 d009_morisco_diaspora.3.desc: "The Moriscos who settled in [ShowLocationName('tunis')] have built for themselves a distinct quarter, its architecture, gardens, and crafts recognizably from [ShowRegionNameWithNoTooltip('iberia_region')], despite being generations removed from [ShowRegionNameWithNoTooltip('iberia_region')] itself. Whether we encourage that distinctiveness as a mark of this city's cosmopolitan character or quietly absorb it into the wider population is entirely our choice."
 d009_morisco_diaspora.3.a: "Encourage cultural preservation."
 d009_morisco_diaspora.3.b: "Encourage assimilation."
 d009_morisco_diaspora.3.historical_info: "Moriscos who settled in Tunis after the Spanish expulsions established a distinct quarter, still known today by variants of the name #italic Zuqāq al-'Andalus#!, preserving Andalusi architecture, cuisine, and the Andalusi musical tradition known as the #italic ma'luf#! for centuries afterward."

 d009_morisco_diaspora.4.title: "[ShowCultureNameWithNoTooltip('andalusi')] Music Survives"
 d009_morisco_diaspora.4.entry: "$d009_morisco_diaspora.4.title$"
 d009_morisco_diaspora.4.desc: "Musicians among the Morisco community continue to play and teach the intricate courtly music their ancestors once performed in the palaces of [ShowRegionName('iberia_region')], passing it from teacher to pupil in a chain unbroken since before the expulsions. Court poets and travelers alike have begun to remark on it as one of this realm's more distinctive cultural treasures."
 d009_morisco_diaspora.4.a: "Acknowledge the tradition."
 d009_morisco_diaspora.4.historical_info: "The Andalusi #italic nuba#! musical tradition, developed in the courts of al-'Andalus and carried into North Africa by generations of exiles, survived and evolved into the distinct regional repertoires still performed across the Maghreb today, particularly in Tetouan, Tunis, and Algiers, each city preserving its own distinct school of the tradition."

 d009_morisco_diaspora.5.title: "The Morisco Corsairs of [ShowLocationNameWithNoTooltip('algiers')]"
 d009_morisco_diaspora.5.entry: "$d009_morisco_diaspora.5.title$"
 d009_morisco_diaspora.5.desc: "Morisco refugees who once fished and farmed the coasts of [ShowRegionName('iberia_region')] now offer this realm something considerably more useful than their old trades: an intimate knowledge of the regional harbors, currents, and coastal defenses that our own corsair captains lack entirely. Whether we put that knowledge to use at sea or keep these families in the safer trades they already know is worth careful deliberation."
 d009_morisco_diaspora.5.a: "Recruit them as pilots."
 d009_morisco_diaspora.5.b: "Keep them in artisan trades."
 d009_morisco_diaspora.5.historical_info: "Moriscos with intimate knowledge of Iberia's' coastal geography were highly valued by the corsairs of Algiers throughout the 17th century, serving as pilots and raiders whose familiarity with Spanish harbors and currents gave local corsair fleets a significant operational advantage over their Christian targets."

 d009_morisco_diaspora.6.title: "Two Generations After the Expulsion"
 d009_morisco_diaspora.6.entry: "$d009_morisco_diaspora.6.title$"
 d009_morisco_diaspora.6.desc: "The children and grandchildren of the first Morisco exiles have grown up knowing this land, and only this land, as home. Some among them speak of [ShowRegionName('iberia_region')] only through inherited stories now more legend than memory; others still mark the anniversary of their grandparents' exile as though it happened yesterday. Whether we encourage this generation to consider themselves fully our subjects, or continue to honor what makes them distinct, it is a choice that will shape how this community is remembered."
 d009_morisco_diaspora.6.a: "Encourage full integration."
 d009_morisco_diaspora.6.b: "Support their continued memory."
 d009_morisco_diaspora.6.historical_info: "By the mid-to-late 17th century, the children and grandchildren of the Morisco exiles were increasingly integrated into the Maghreb's broader population, though distinct customs, surnames, and a lingering Andalusi identity persisted in cities like Tetouan and Tunis well into the 18th century and beyond."

 d009_morisco_diaspora.7.title: "The Keys of [ShowLocationNameWithNoTooltip('granada')]"
 d009_morisco_diaspora.7.entry: "$d009_morisco_diaspora.7.title$"
 d009_morisco_diaspora.7.desc: "Some families in the Morisco community still keep the keys and deeds to houses their ancestors once owned in [ShowLocationName('granada')] and elsewhere in [ShowRegionName('iberia_region')]. These objects have no practical use whatsoever, but have been passed down through many generations as a promise, however unlikely, of a return that grows less plausible with every year that passes."
 d009_morisco_diaspora.7.a: "Reflect on what has been lost."
 d009_morisco_diaspora.7.historical_info: "The keeping of keys to ancestral homes in Iberia by Morisco and, separately, Sephardi families is a well-documented tradition in Maghreb and Ottoman diaspora communities, symbolizing an enduring, largely symbolic claim to a homeland that grew increasingly distant with each passing generation."

 d009_morisco_diaspora.8.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] Algiers and the [ShowCultureNameWithNoTooltip('andalusi')] Heritage"
 d009_morisco_diaspora.8.entry: "Algiers and the Andalusi Heritage"
 d009_morisco_diaspora.8.desc: "Our engineers and administrators in [ShowLocationName('algiers')] have taken a growing interest in the [ShowCultureName('andalusi')] quarters and architecture left behind by generations of Morisco settlement, debating whether such heritage deserves careful preservation or should give way to more modern, more thoroughly [ROOT.GetCountry.GetAdjective] planning."
 d009_morisco_diaspora.8.a: "Preserve the heritage."
 d009_morisco_diaspora.8.b: "Replace it with modern planning."
 d009_morisco_diaspora.8.historical_info: "French colonial administrators who took control of Algiers after 1830 held mixed attitudes toward the city's Morisco and Ottoman-era heritage, with some officials and scholars working to document and preserve Andalusi-influenced architecture while others oversaw its demolition in favor of French urban planning, particularly in the old Ottoman citadel district known as the Casbah."

 d009_morisco_diaspora.9.title: "Two Communities, One Road to [ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_morisco_diaspora.9.entry: "Two Communities, One Road"
 d009_morisco_diaspora.9.desc: "Within the span of a single generation, this realm has become home to two peoples driven from the same shores by the same catastrophe: [ShowCultureName('sephardi')] exiles fleeing the Alhambra Decree, and Morisco refugees fleeing forced conversion or worse. Some in our court would see each community settled in its own quarter, with its own charter and its own customs; others argue that a shared exile ought to be met with a shared welcome, under one roof rather than two."
 d009_morisco_diaspora.9.a: "Establish separate quarters."
 d009_morisco_diaspora.9.b: "Allow mixed settlement."
 d009_morisco_diaspora.9.historical_info: "Morocco received both expelled Jewish and expelled Muslim populations from Iberia across the fifteenth and seventeenth centuries, and in cities like Tetouan and Fez the two communities often lived in close proximity, sharing a common heritage as peoples of Iberia even as they maintained separate religious and legal institutions of their own."
 d009_morisco_diaspora_9_sephardi_population_tt: "Realm has a Sephardi population"
 d009_morisco_diaspora_9_morisco_community_tt: "Realm has an established Morisco community"

 d009_morisco_diaspora.10.title: "The City That Remembers"
 d009_morisco_diaspora.10.entry: "$d009_morisco_diaspora.10.title$"
 d009_morisco_diaspora.10.desc: "[ShowLocationName('tetouan')] carries the imprint of two exiled peoples at once: [ShowCultureName('sephardi')] families and Morisco refugees alike, both still speaking dialects of the Spanish their grandparents brought with them, both still naming their children after towns in an [ShowRegionName('iberia_region')] neither community will ever see again. Few cities anywhere carry so much memory in their streets, courts, and kitchens all at once."
 d009_morisco_diaspora.10.a: "Take pride in the city's living memory."
 d009_morisco_diaspora.10.historical_info: "Tetouan was rebuilt and resettled largely by Sephardi and Andalusi Muslim exiles after they were expelled from Iberia, and the city therefore retained its uniquely Iberian-influenced character, including the #italic Haketia#! and Moroccan-Arabic dialects that still carry traces of Spanish, well into the twentieth century."
