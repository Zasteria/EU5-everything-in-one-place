l_english:
 holy_war.11.title: "Raiders on the Frontier"
 holy_war.11.desc: "A #italic cabalgada#! out of [cabalgada_raider.GetName] has swept across our borderlands, burning villages and carrying off all they could before slipping back over the frontier. Our undefended lands lie plundered. Do we call up the levies to guard the marches, or let the outrage pass?"
 holy_war.11.a: "Rally the levies to the frontier!"
 holy_war.11.b: "We can do nothing but endure it."

 holy_war.12.title: "A Demand for Tribute"
 holy_war.12.desc: "Envoys from [parias_demander.GetName] arrive at our court with a stark message: the [threatening_crusade.GetName] is being raised against us, and unless we pay tribute, its armies will march on our lands. Our advisors warn that our gold will only buy time, dampening their bloodlust but never quenching it. Do we pay to postpone the reckoning, or defy them and prepare for the storm?"
 holy_war.12.a: "Pay the tribute and buy us time."
 holy_war.12.a.tt: "Delays the [crusade|e], setting its preparation back by #G 30#! and lowering its religious zeal by #G 10#!"
 holy_war.12.b: "We will not be cowed. Let them come."
 holy_war.12.b.tt: "Raises the [crusade|e]'s religious zeal by #R 10#!"

 holy_war.13.title: "The Infidel Pays"
 holy_war.13.desc: "Our demand has borne fruit. [parias_payer.GetName] have paid the tribute rather than face the [threatening_crusade.GetName] unready. Their coin swells our coffers, and their reprieve is only that, a reprieve. The holy war is merely postponed."
 holy_war.13.a: "Their gold serves the holy cause."
 holy_war.13.a.tt: "They paid the tribute"

 holy_war.14.title: "The Infidel Defies Us"
 holy_war.14.desc: "[parias_payer.GetName] have spurned our demand for tribute and chosen defiance. Their insolence has only hardened the resolve of the faithful, and the [threatening_crusade.GetName]'s fervor burns the brighter for it."
 holy_war.14.a: "Then the sword shall answer."
 holy_war.14.a.tt: "They refused to pay the tribute"

 holy_war.15.title: "Raiders from the South"
 holy_war.15.desc: "A #italic ḡazw#! out of [ghazw_raider.GetName] has swept across our borderlands, burning villages and carrying off all they could before slipping back over the frontier. Our undefended lands lie plundered. Do we call up the levies to guard the marches, or let the outrage pass?"
 holy_war.15.a: "Rally the levies to the frontier!"
 holy_war.15.b: "We can do nothing but endure it."

 holy_war.16.title: "Raiders from the Sea"
 holy_war.16.desc: "Corsairs out of [shore_raider.GetName] have fallen upon our coast, sacking the harbors and dragging our people off in chains before their sails slipped over the horizon. Our undefended shores lie plundered. Do we call up the levies to guard the coast, or let the outrage pass?"
 holy_war.16.a: "Rally the levies to the coast!"
 holy_war.16.b: "We can do nothing but endure it."

 d009_holy_war.1.title: "The Orders Answer"
 d009_holy_war.1.desc: "The summons has gone out to the military orders, and the brothers are mustering."
 d009_holy_war.1.desc_santiago: "The [summoned_order.GetName] has answered, and it has answered at strength. Its brothers came down the road in column, eight hundred lances under the scallop banner, and made camp without being told where. The [summoned_order.GetNameWithNoTooltip] has fought this war for two hundred years, and its Master does not need the campaign explained to him.\n\nHe has one question, asked politely and only once: where does the order stand in the line?"
 d009_holy_war.1.desc_calatrava: "The [summoned_order.GetName] has answered. Its brothers arrived in good order and in silence, in white mantles with the red cross, Cistercian discipline carried onto a battlefield. They pitched camp a little apart from the [ROOT.GetCountry.GetGovernment.GetAdjective] host, as is their custom.\n\nThe Master attends our councils, says little, and is invariably right about ground. He asks where the order stands in the line."
 d009_holy_war.1.desc_alcantara: "The [summoned_order.GetName] has answered, and has brought the frontier with it. These are not tournament knights: they are the men who hold the Tagus crossings in an ordinary year, and they have arrived with their own scouts, their own guides, and their own opinions about the enemy.\n\nThe Master asks where the order stands in the line, in the tone of a man who has already chosen."
 d009_holy_war.1.desc_montesa: "The [summoned_order.GetName] has answered, which takes it farther from home than it usually goes. Its brothers have left their coastal towers to a skeleton watch and ridden to join us, and they are conscious of the compliment they are paying us.\n\nThe Master asks where the order stands in the line, and how long we expect to need them."
 d009_holy_war.1.desc_avis: "The [summoned_order.GetName] has answered. Its brothers are as much a political body as a military one, and their arrival is a statement about whose war this is.\n\nThe Master asks where the order stands in the line. He is watching to see whether the answer honors them."
 d009_holy_war.1.desc_christ: "The [summoned_order.GetName] has answered, and there is something incongruous about it. These are the brothers who fund caravels and argue about latitudes, and they have come inland in harness to fight a war of sieges.\n\nThe Master asks where the order stands in the line, with the air of a man reminding us that his order was founded for exactly this."
 d009_holy_war.1.a: "Give them the vanguard."
 d009_holy_war.1.b: "They will hold the flank."

 d009_holy_war.2.title: "The Bull Is Granted"
 d009_holy_war.2.desc: "The bull has come, sealed and unambiguous. The #italic Bula de Cruzada#! grants indulgence to those who contribute to the war against the infidel, and it names our [ROOT.GetCountry.GetFlavorRank] as the instrument of that war.\n\nIn practice it is a license to raise money from all of our faithful, parish by parish, with the full authority of the [GetUniqueInternationalOrganization('catholic_church').GetName] behind the collectors. Our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are already asking, delicately, who will be doing the collecting and who will be counting."
 d009_holy_war.2.a: "Preach it in every parish, and let our men hold the chest."
 d009_holy_war.2.b: "Take only what is given freely, and let the [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip] count it."

 d009_holy_war.3.title: "The Volunteers of the Faith"
 d009_holy_war.3.desc: "They have been arriving for weeks: ḡāzī from the mountains, students from the #italic madrasas#!, brotherhoods from towns we have never had occasion to tax. Some have brought horses. Many have brought nothing but conviction.\n\nThey are not soldiers and they will not be commanded like soldiers. They are also, if they are pointed at the enemy soon enough, worth a great deal more than their equipment suggests."
 d009_holy_war.3.a: "March them north at once."
 d009_holy_war.3.b: "Hold them, and make soldiers of them first."

 d009_holy_war.4.title: "The Crossing"
 d009_holy_war.4.desc: "The fleet has put the army across, and the banners are on the northern shore.\n\nEvery commander who has done this knows the arithmetic: the [ShowLocationName('strait_of_gibraltar')] is behind us, the fleet cannot stay, and what we hold in a month is what we will have. The first days decide the campaign."
 d009_holy_war.4.a: "Strike inland while they are still gathering."
 d009_holy_war.4.b: "Secure the landing and the ports first."

 d009_holy_war.5.title: "After the Ḡazw"
 d009_holy_war.5.desc: "The raiders are back across the frontier, driving cattle and captives ahead of them, and the whole countryside has turned out to watch them come in.\n\nWhat was taken is now to be divided, and the division is watched more closely than the raid was. The ḡāzī went for [ROOT.GetCountry.GetReligion.GetGodName] and for plunder, in an order they would prefer not to specify."
 d009_holy_war.5.a: "The spoils belong to the men who took them."
 d009_holy_war.5.b: "The treasury takes the fifth that is owed."

 d009_holy_war.6.title: "The Corsairs' Prize"
 d009_holy_war.6.desc: "The squadron has come home heavy. [ShowGoodsName('cloth')], coin, church plate, and two hundred captives from a coast that thought itself too far north to be worth the voyage.\n\nThe captains are ashore and spending. The #italic qāḍī#! has questions about the disposition of the captives, and the treasury has questions about everything else."
 d009_holy_war.6.a: "Ransom the captives and take the profit."
 d009_holy_war.6.b: "Settle them, and let the coast learn what we can reach."
