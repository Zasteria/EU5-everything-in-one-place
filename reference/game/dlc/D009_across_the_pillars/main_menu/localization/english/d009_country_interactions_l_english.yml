 assert_patronato_real_desc: "We invoke the Castilian right of #italic Patronato Real#! — the royal prerogative to present candidates for ecclesiastical offices in the Indies and beyond — over one of our colonial subjects, bringing its church and its clergy's appointments under our direct administration."
