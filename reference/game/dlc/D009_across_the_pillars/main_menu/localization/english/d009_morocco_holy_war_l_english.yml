l_english:
 summon_volunteers_of_the_faith: "Summon the Volunteers of the Faith"
 summon_volunteers_of_the_faith_desc: "Calls on the [ShowReligionGroupAdjective('muslim')] tribes to send holy warriors to the [jihad|e]. One of the Berber tribes raises a mercenary regiment in its own fighting style, whether swift horsemen, veiled foot, or a balanced host, and stirs the [jihad]'s religious zeal. A realm that has organized its holy warriors into a standing corps, or whose estates have pledged their volunteers to the cause, fields a mightier host. Each tribe can answer only once at a time, and heeds the call again once its regiment is disbanded."
 summon_volunteers_of_the_faith_effect_tt: "Raises the [jihad|e]'s #Y religious zeal#! by #G 5#!"
 summon_volunteers_cavalry_tier2_tt: "Raises 10 Light Cavalry, 4 Light Infantry and 2 Heavy Cavalry"
 summon_volunteers_cavalry_tier1_tt: "Raises 8 Light Cavalry and 4 Light Infantry"
 summon_volunteers_cavalry_tier0_tt: "Raises 6 Light Cavalry and 3 Light Infantry"
 summon_volunteers_infantry_tier2_tt: "Raises 8 Heavy Infantry, 4 Light Infantry and 1 Heavy Cavalry"
 summon_volunteers_infantry_tier1_tt: "Raises 6 Heavy Infantry and 4 Light Infantry"
 summon_volunteers_infantry_tier0_tt: "Raises 4 Heavy Infantry and 4 Light Infantry"
 summon_volunteers_mixed_tier2_tt: "Raises 7 Light Cavalry, 5 Light Infantry and 2 Heavy Infantry"
 summon_volunteers_mixed_tier1_tt: "Raises 6 Light Cavalry and 5 Light Infantry"
 summon_volunteers_mixed_tier0_tt: "Raises 4 Light Cavalry and 4 Light Infantry"
 choose_tribe_for_volunteers: "Choose a Tribe"
 summon_volunteers_no_tribes: "@trigger_no! No tribe is free to answer the call."
 ghuzat_regiment_name: "Volunteers of the Faith"
 summon_volunteers_bureaucracy_bonus_tt: "Our standing corps of ghazi volunteers swells the regiment with more and finer warriors."
 proclaim_the_ghazw: "Proclaim the Ḡazw"
 proclaim_the_ghazw_desc: "Proclaim a frontier raid across the Strait into one of the [ShowReligionGroupAdjective('christian')] enemy's border provinces. Every undefended location there, holding neither a fort nor an army, is plundered for its wealth and left poorer, rousing its lord to muster against us."
 proclaim_the_ghazw_tt: "Reduces the [jihad|e]'s religious zeal by #R 10#! and sets its preparation back by #R 10#!"
 proclaim_the_ghazw_loot_tt: "Loots every undefended location in the province holding no fort and no army for an estimated [actor.MakeScope.ScriptValue('ghazw_estimated_total')|0+=][gold_i], and reduces their development"
 choose_province_for_ghazw: "Choose a Province to Raid"
 proclaim_the_ghazw_no_provinces: "@trigger_no! The enemy holds no undefended border province open to a raid."
 cross_the_strait: "Ride the Seas"
 cross_the_strait_desc: "Hire a mercenary fleet of transports at one of our ports so the armies of the Maghreb can cross the [ShowLocationName('strait_of_gibraltar')] into al-'Andalus. Enough transports are raised to ferry roughly a quarter of our army, and the crossing can be repeated at any point during the holy war."
 cross_the_strait_effect_tt: "Raises transports to ferry roughly a quarter of our army at a [gold|e] cost that grows with the fleet, and spends #R 10#! of the [jihad|e]'s religious zeal"
 cross_the_strait_fleet_name: "Fleet of the Crossing"
 cross_the_strait_hire_tt: "Hires the fleet to ferry our troops across the Strait"
 choose_port_for_crossing: "Choose a Port"
 cross_the_strait_no_ports: "@trigger_no! We hold no port from which to launch the crossing."
 raid_the_shores: "Raid the Shores"
 raid_the_shores_desc: "Loose a corsair raid on the coast of one of the [ShowReligionGroupAdjective('christian')] enemy's provinces that we already privateer. Every undefended coastal location there, holding neither a fort nor an army, is plundered, and one in a hundred of its [ShowReligionAdjective('catholic')] peasants is carried off into slavery to our capital."
 raid_the_shores_tt: "Reduces the [jihad|e]'s religious zeal by #R 10#! and sets its preparation back by #R 10#!"
 raid_the_shores_loot_tt: "Plunders every undefended coastal location in the selected province, and carries off one in a hundred of its [ShowReligionAdjective('catholic')] peasants into slavery"
 choose_province_for_shore_raid: "Choose a Coast to Raid"
 raid_the_shores_no_provinces: "@trigger_no! The enemy holds no coast bordering a sea zone where our [privateers|e] are active."
