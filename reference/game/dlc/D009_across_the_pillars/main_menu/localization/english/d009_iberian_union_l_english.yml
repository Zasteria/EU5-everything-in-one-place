l_english:

 catholic_monarchs_law: "Catholic Monarchs"
 catholic_monarchs_law_desc: "The marriage that binds our crowns is the foundation of all that follows. How the royal pair chooses to reign, as equals or with one house preeminent, will shape the union for generations to come."
 iu_establish_iberian_wedding_succession_tt: "Establishes an [ShowRelationTypeName('iberian_wedding_pact')] between the two crowns and sets their [heir_selection|e] to [ShowHeirSelectionName('iberian_union_succession')], binding their succession so a shared heir may unite the realms"

 composite_monarchy_law: "Composite Monarchy"
 composite_monarchy_law_desc: "Our realms are joined under one sovereign, yet each keeps its own laws and is allowed liberties, called #italic fueros#!. We must decide whether to honor these #italic fueros#! or to gather their governance into a single hand."

 asientos_law: "Asientos"
 asientos_law_desc: "The crown grants #italic asientos#!, exclusive contracts to supply and provision our overseas dominions, and whoever holds them profits on every cargo, while the realms that fill them keep their workshops busy. The union must decide whether the crown awards these contracts to itself, or shares them among the merchants of all its realms."

 religious_authority_law: "Religious Authority"
 religious_authority_law_desc: "Our united crowns must decide how to wield the authority of the faith. The crown may direct the Church within our realms through the #italic Patronato Real#!, or turn that zeal outward as the sword and shield of Christendom."

 legislative_authority_law: "Legislative Authority"
 legislative_authority_law_desc: "By whose will shall the realms be governed? Law may flow from the royal hand through binding #italic pragmáticas#!, or rest upon the consent of each kingdom's own #italic Cortes#!."

 crown_settlement_law: "Settlement of the Crowns"
 crown_settlement_law_desc: "The final form of the union must be settled. One law and one coin may forge the many kingdoms into a single, unified monarchy, or the crowns may endure as a lasting partnership of equals."

 union_of_arms_law: "Union de Armas"
 union_of_arms_law_desc: "The defense of the union is the duty of every realm within it. Whether by mandatory quota or by willing contribution, the kingdoms shall bear the burden of arms together."

 iu_tanto_monta_policy: "Tanto Monta"
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! — the two sovereigns reign as equals, neither above the other. A union of equal dignity binds the realms in mutual respect and a common dynastic front."
 iu_tanto_monta_no_seniority_tt: "No [ShowSpecialStatusName('senior_partner')] is designated this way, and [ShowPolicyName('union_establish_seniority_policy')] and [ShowPolicyName('union_senior_succession_law')] are not enacted for the [union|e]"

 iu_dynastic_primacy_policy: "Dynastic Primacy"
 iu_dynastic_primacy_policy_desc: "One crown is acknowledged as the senior of the union, its dynasty preeminent among the realms. The leading house reaps the greatest prestige, while all members share in the standing of a confident monarchy."
 iu_dynastic_primacy_senior_only_tt: "If we are a [senior_partner|e]:"
 iu_dynastic_primacy_seniority_tt: "When this [union|e] is formed, the member with the highest [economical_base|e] is designated the [ShowSpecialStatusName('senior_partner')], enacting [ShowPolicyName('union_establish_seniority_policy')] and [ShowPolicyName('union_senior_succession_law')] for the whole union"

 iu_respect_fueros_policy: "Respect the Fueros"
 iu_respect_fueros_policy_desc: "The ancient liberties of each kingdom are confirmed and protected. The lesser realms govern themselves in peace, while the senior crown earns the respect due to a sovereign who keeps faith with the realms' traditions."

 iu_centralized_administration_policy: "Centralized Administration"
 iu_centralized_administration_policy_desc: "The governance of the realms is gathered under a single administration. The senior crown extends its reach, while the lesser realms draw legitimacy from the order of a unified state."

 iu_crown_asientos_policy: "Crown Asientos"
 iu_crown_asientos_policy_desc: "The crown awards the supply contracts itself, concentrating the trade and its bullion upon the senior realm. The lesser kingdoms profit from provisioning the dominions, their industry stirred by the demand."

 iu_shared_asientos_policy: "Shared Asientos"
 iu_shared_asientos_policy_desc: "The contracts are spread among the merchants of every realm. The lesser kingdoms gain direct access to the lucrative supply trade, while the senior crown enjoys the cheaper goods that flow through the shared network."

 iu_patronato_real_policy: "Patronato Real"
 iu_patronato_real_policy_desc: "By the #italic Patronato Real#!, the crown directs the Church across our realms, naming its prelates and drawing upon its revenues. A faith administered by the throne is a faith bound to the throne."

 iu_catholic_champion_policy: "Champion of the Faith"
 iu_catholic_champion_policy_desc: "Our united crowns take up the banner of Christendom, championing the faith before every court in Europe. Let our realms be known as the sword and shield of the Church, and our own devout be honored for it."

 iu_pragmaticas_policy: "Pragmáticas Reales"
 iu_pragmaticas_policy_desc: "Law shall flow from the royal will. By binding decree, the #italic pragmáticas#!, the sovereign legislates for every realm at once, without waiting for the approval of any assembly."

 iu_regional_cortes_policy: "Regional Cortes"
 iu_regional_cortes_policy_desc: "Each realm rules by the consent of its own #italic Cortes#!. Government by the old assemblies lends legitimacy to every crown and binds the union in willing loyalty."

 iu_una_ley_una_moneda_policy: "Una Ley, Una Moneda"
 iu_una_ley_una_moneda_policy_desc: "One law and one coin for all our realms. Unifying the crowns this way dilutes the old borders, strengthening the ties of the many kingdoms into a single, unified monarchy, and letting the lesser realms work and trade throughout as freely as at home."

 iu_perpetual_crown_policy: "Perpetual Federal Crown"
 iu_perpetual_crown_policy_desc: "The union is sealed as a permanent compact of crowns. A settled and lasting partnership lends every realm legitimacy and stability, and the bond between the members is the strongest in the union."

 iu_proportional_levy_policy: "Proportional Levy"
 iu_proportional_levy_policy_desc: "Every realm fields its share of a combined host. The union raises a larger and better army, and the senior crown commands the levies that concentrate beneath it."

 iu_negotiated_contribution_policy: "Negotiated Contribution"
 iu_negotiated_contribution_policy_desc: "The realms contribute to the common defense by mutual agreement rather than mandate. The burden feels lighter for being willingly borne, and carrying it fosters discipline in the field and harmony among the members."

 proclaim_spanish_monarchy: "Proclaim the Spanish Monarchy"
 proclaim_spanish_monarchy_desc: "Declare the many crowns of our union to be a single, unified monarchy, and take up the name and dignity of Spain."
 proclaim_spanish_monarchy_integration_tt: "Our union must have reached an integration level of at least 5"

 diplomatic_status_iberian_wedding_pact_name: "Iberian Wedding Pact"
 iberian_wedding_pact_relation: "$diplomatic_status_iberian_wedding_pact_name$"
 iberian_wedding_pact_effect_text: "[SCOPE.sCountry('actor').GetName] form an Iberian Wedding Pact with [SCOPE.sCountry('recipient').GetName], binding the succession of their crowns."
 iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] formed an Iberian Wedding Pact with [SCOPE.sCountry('recipient').GetName], binding the succession of their crowns."
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nThese crowns share an Iberian Wedding Pact. If either ruler dies without an heir of their own, the other inherits the throne of the former, forming a [union|e] between the two countries."
 iberian_wedding_pact_list_who_tt: "$LIST$ is in a [ShowRelationTypeName('iberian_wedding_pact')] with $WHO$"
 iberian_wedding_pact_relation_desc: "The two [countries|e] are bound by an $diplomatic_status_iberian_wedding_pact_name$, sharing a succession that may one day draw their crowns into a [union|e]."
 offer_iberian_wedding_pact: "Agree to the $diplomatic_status_iberian_wedding_pact_name$"
 offer_iberian_wedding_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 offer_iberian_wedding_pact_cta: "Offer the $diplomatic_status_iberian_wedding_pact_name$ to [SCOPE.sCountry('recipient').GetName]"
 offer_iberian_wedding_pact_desc: "This will bind the succession of our two crowns."
 offer_iberian_wedding_pact_cta_to_unknown: "Offer the $diplomatic_status_iberian_wedding_pact_name$ to a [country|e]"
 offer_iberian_wedding_pact_desc_to_unknown: "$offer_iberian_wedding_pact_desc$"
 offer_iberian_wedding_pact_happened_title: "$diplomatic_status_iberian_wedding_pact_name$ Established"
 offer_iberian_wedding_pact_happened_desc: "[SCOPE.sCountry('recipient').GetName] is now bound to us by the $diplomatic_status_iberian_wedding_pact_name$. Should one of our rulers die without an heir of their own, the other shall inherit both thrones, forming a [union|e] between our crowns."
 offer_iberian_wedding_pact_proposal_question: "Propose the $diplomatic_status_iberian_wedding_pact_name$ with [COUNTRY.GetName]?\n$INFO$"
 cancel_iberian_wedding_pact: "Break the $diplomatic_status_iberian_wedding_pact_name$"
 cancel_iberian_wedding_pact_CATEGORY: "CATEGORY_HOSTILE_ACTIONS"
 cancel_iberian_wedding_pact_cta: "End the $diplomatic_status_iberian_wedding_pact_name$ with [SCOPE.sCountry('recipient').GetName]"
 cancel_iberian_wedding_pact_desc: "Our crowns will no longer share a succession, and we might not form a [union|e]."
 cancel_iberian_wedding_pact_cta_to_unknown: "End the $diplomatic_status_iberian_wedding_pact_name$ with a [country|e]"
 cancel_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc$"
 cancel_iberian_wedding_pact_happened_title: "Break the $diplomatic_status_iberian_wedding_pact_name$"
 cancel_iberian_wedding_pact_happened_desc: "Broke the $diplomatic_status_iberian_wedding_pact_name$ with [SCOPE.sCountry('recipient').GetName]. Our crowns will no longer share a succession."
 cancel_iberian_wedding_pact_proposal_question: "Break the $diplomatic_status_iberian_wedding_pact_name$ with [COUNTRY.GetName]?\n$INFO$"
 break_iberian_wedding_pact: "$cancel_iberian_wedding_pact$"
 break_iberian_wedding_pact_CATEGORY: "CATEGORY_HOSTILE_ACTIONS"
 break_iberian_wedding_pact_cta: "$cancel_iberian_wedding_pact_cta$"
 break_iberian_wedding_pact_desc: "$cancel_iberian_wedding_pact_desc$"
 break_iberian_wedding_pact_cta_to_unknown: "$cancel_iberian_wedding_pact_cta_to_unknown$"
 break_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc_to_unknown$"
 break_iberian_wedding_pact_happened_title: "Break the $diplomatic_status_iberian_wedding_pact_name$"
 break_iberian_wedding_pact_happened_desc: "The $diplomatic_status_iberian_wedding_pact_name$ with [SCOPE.sCountry('recipient').GetName] has been broken. Our crowns will no longer share a succession."
 break_iberian_wedding_pact_proposal_question: "We will break the $diplomatic_status_iberian_wedding_pact_name$ with [TARGET_COUNTRY.GetName]."
 giving_iberian_wedding_pact_trigger: "Has an Iberian Wedding Pact with this country"
 diplomatic_status_giving_iberian_wedding_pact_name: "Pact Partner"
 diplomatic_status_giving_iberian_wedding_pact_tooltip: "This country has an $diplomatic_status_iberian_wedding_pact_name$ with the following countries."
 diplomatic_status_receiving_iberian_wedding_pact_name: "Pact Partner"
 diplomatic_status_receiving_iberian_wedding_pact_tooltip: "$diplomatic_status_giving_iberian_wedding_pact_tooltip$"
 giving_iberian_wedding_pact_list_who_tt: "$LIST$ is in a [ShowRelationTypeName('iberian_wedding_pact')] with $WHO$"
 receiving_iberian_wedding_pact_list_who_tt: "$LIST$ is in a [ShowRelationTypeName('iberian_wedding_pact')] with $WHO$"

 iberian_union_succession: "Iberian Union Succession"
 iberian_union_succession_desc: "A type of [heir_selection|e] used by the Christian monarchies of [ShowRegionName('iberia_region')] bound by an [ShowRelationTypeName('iberian_wedding_pact')]. Should one of the rulers die without a legitimate heir of their own, the other ruler will inherit the throne of the former, drawing the crowns together into a [union|e]."
 iberian_union_succession_tt: "Form a [union|e] in case our successor is not the heir of our previous ruler"
