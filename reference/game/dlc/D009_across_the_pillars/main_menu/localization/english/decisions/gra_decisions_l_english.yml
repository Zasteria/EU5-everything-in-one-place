l_english:
 expand_the_alhambra.title: "Expand the $alhambra$"
 expand_the_alhambra.desc: "Another wing rises above the Sabīka hill. Where earlier reigns raised the first courts and towers, we add halls of our own, their vaults worked in #italic muqarnaṣ#! and their walls cut with verse, so that every envoy who climbs to the palace reads the permanence of our house in stone.\n\nThe cost lies not in the marble alone but in the message it carries: a throne that builds for centuries does not expect to fall. Each tier we complete deepens the citadel's garrison and widens its gardens, and tells [GetCountry('CAS').GetName] and [GetCountry('MOR').GetName] alike that we mean to remain masters of our own shore."
 expand_the_alhambra.a: "Lay the foundations."
 expand_the_alhambra_construct_tt: "Begins the expansion of [ShowBuildingTypeName('alhambra')]"
