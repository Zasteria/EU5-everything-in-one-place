l_english:
 muqni_at_al_sa_il: "Muqni'at as-Sā'il 'an al-Maraḍ al-Hā'il"
 muqni_at_al_sa_il_desc: "As the Black Death emptied the streets of Granada, the vizier and physician Lisan al-Din ibn al-Khatib refused the comfortable doctrine that the plague spread by divine decree alone. He watched the sickness pass from the afflicted to the healthy through breath, garments, and shared rooms, and he set down what he saw.\n\nHis insistence that the disease moved by contact set him against jurists who held such a claim to verge on impiety. The argument endured all the same, copied by physicians from Fez to Cairo long after the worst of the plague had passed."
