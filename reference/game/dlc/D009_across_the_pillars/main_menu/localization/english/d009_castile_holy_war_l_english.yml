l_english:
 petition_for_the_bula_de_cruzada: "Petition for the Bula de Cruzada"
 petition_for_the_bula_de_cruzada_desc: "As Temporal Leader of the [crusade|e], petition the Pope for the [crusade] bull. For three years the [tithe|e] of every [ShowReligionAdjective('catholic')] country flows to our crown instead of to the Pope or the [crusade] war-chest."
 petition_for_the_bula_de_cruzada_tt: "For #G 3#! years, the [tithe|e] of every [ShowReligionAdjective('catholic')] country is paid to the crown instead of the Pope or the [crusade|e]"
 summon_iberian_military_orders_crusade: "Summon the Iberian Military Orders"
 summon_iberian_military_orders_crusade_desc: "Call one of the military orders of Iberia to the [crusade|e], as its founders intended, and let its brothers take the field against the enemies of the faith."
 summon_iberian_military_orders_effect_tt: "Hires 7 to 15 Heavy Infantry and Heavy Cavalry regiments from the order, scaled by its religious zeal, and raises the [crusade|e]'s #Y religious zeal#! by #G 5#!"
 summon_iberian_military_orders_no_target_tt: "Hires 7 to 15 Heavy Infantry and Heavy Cavalry regiments from the selected military order, scaled by its religious zeal, and raises the [crusade|e]'s #Y religious zeal#! by #G 5#!"
 summon_iberian_military_orders_order_tt: "The selected military order gains #G 10#! [zeal|e]"
 summon_iberian_military_orders_event_tt: "The [event|e] '$d009_holy_war.1.title$' happens to us"
 choose_military_order_to_summon: "Choose Military Order"
 summon_iberian_military_orders_no_orders: "@trigger_no! No military order is available to summon."
 launch_a_cabalgada: "Launch a Cabalgada"
 launch_a_cabalgada_desc: "Raid one of the enemy's bordering provinces. Every undefended location there, holding no fort and no army, is looted and loses development, and its owner is prompted to muster in response."
 launch_a_cabalgada_tt: "Costs a year's worth of our [manpower|e], reduces the [crusade|e]'s religious zeal by #R 10#!, and sets its preparation back by #R 10#!"
 launch_a_cabalgada_loot_tt: "Loots every undefended location in the province holding no fort and no army for an estimated [actor.MakeScope.ScriptValue('cabalgada_estimated_total')|0+=][gold_i], and reduces their development"
 choose_province_for_cabalgada: "Choose a Province to Raid"
 launch_a_cabalgada_no_provinces: "@trigger_no! The enemy holds no undefended border province open to a raid."
 demand_parias: "Demand Tribute"
 demand_parias_desc: "As Temporal Leader of the [crusade|e], demand tribute from the enemy realm during its preparation. They may pay, delaying the [crusade]'s muster, or refuse and raise its religious zeal."
