 mor_central_makhzen: "The Maḵzan"
 mor_central_makhzen_desc: "The loose authority of the early sultanate must give way to a true #italic maḵzan#!, a standing apparatus of tax-gatherers, secretaries, and appointed governors that carries the will of the throne from the obedient heartland into the lands of dissidence. With it, the central state ceases to be a matter of the ruler as an individual and becomes an institution that endures."
