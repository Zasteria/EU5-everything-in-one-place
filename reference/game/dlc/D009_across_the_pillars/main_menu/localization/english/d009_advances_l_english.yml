l_english:
 gra_frontier_warriors: "Frontier Warriors"
 gra_frontier_warriors_desc: "Along the #italic ṯuḡūr#!, every marcher village owes its sons to the beacon line, and the #italic ṯaḡrī#! who answers that call knows the passes, the wells, and the seasonal raids of the Christian kings as well as any shepherd knows his hills. We arm him cheaply, feed him from his own village stores, and let the frontier itself school him in the only war that matters. This light infantry costs our treasury little but holds the sierra roads against forces that would need a season's supplies to match their knowledge of the ground."
 gra_jamaa: "The Jamā'a"
 gra_jamaa_desc: "The Jamā'a, literally 'the Community', is the standing consultative body of our emirate, convening the #italic qāḍī al-jamā'a#!, the #italic wazīr#!, the #italic ḥājib#!, and the #italic šayḵ al-ḡuzāt#! who commands the Marinid jihad-volunteers alongside our own court. We convene this body in its extraordinary capacity as the embodiment of the Community of believers, transforming our decisions of war, tribute, and succession from emiral fiat into the consent of the whole polity. This council closes the door to unilateral concessions wrested from a divided emirate and ensures that no faction — Christian king, Maghrebi sultan, or frontier chieftain — can deal with any single voice of ours as if it spoke for all."
 gra_jinetes: "$a_granadan_jinetes$"
 gra_jinetes_desc: "The light cavalryman we call #italic jinete#! takes his name from the Zanāta Berbers who crossed the strait to fight under Andalusi banners in the thirteenth century, mounting a small Iberian-Arab horse and living by the doctrine of charge, throw, and feigned retreat. We codify this Zanātī school into a standing arm of our host, and from the #italic ṯuḡūr#! to the coastal plain the $a_granadan_jinetes$ become the screen behind which every other formation of ours maneuvers. This light cavalry arm costs a fraction of mailed knights and gives us a screen no Christian column can easily break without itself breaking formation."
 unlocked_jinetes_via_decision_tt: "We opted for #italic $demand_conversion_of_granada.b$#! in the [ShowDecisionName('demand_conversion_of_granada')] [decision|e] during the [ShowSituationName('battle_for_the_strait')] [situation|e]"
 gra_mailed_jinetes: "Mailed Jinetes"
 gra_mailed_jinetes_desc: "Two centuries of frontier warfare have seasoned our #italic jinetes#! into a more disciplined arm, and we now fit them with mail shirts against Christian crossbows and lengthen their lances to reach across a mailed opponent's guard. The doctrine of charge, throw, and feigned retreat remains, but it now serves a horseman who can hold his ground in a melee if the first pass fails. This armored light cavalry extends the reach of the $a_granadan_jinetes_2$ into engagements our riders previously had to break off and evade."
 gra_renegade_warriors: "Renegade Warriors"
 gra_renegade_warriors_desc: "The frontier between al-'Andalus and the Christian kingdoms breeds a particular kind of soldier, the #italic elche#! who has abandoned one faith for another and now serves under our banners with the technique of his former masters. We codify the recruitment of these renegades into a standing class of heavy cavalry, granting them lands, court positions, and the right to ride under our colors. This body of lance-and-plate horsemen, trained in Christian armored doctrine, gives our army a heavy cavalry arm that our own tradition never produced."
 gra_taifa_subjects: "$taifa$"
 gra_taifa_subjects_desc: "$taifa_desc$"
 gra_tali_a_coastal_watch: "Coastal Ṭalā'i'"
 gra_tali_a_coastal_watch_desc: "We raise stone #italic ṭalā'i'#! at every cape and headland along our coast, each tower mounting a beacon by night and a banner by day, linked to its neighbors by line of sight and sheltering a file of crossbowmen and a #italic faqīh#! to lead the alarm prayer. No galley rounds a promontory unannounced, and every coastal #italic vega#! can muster its levy hours before a hostile keel grinds onto the beach. This watch network denies any raiding fleet the element of surprise and keeps our shoreline defended without the cost of permanent coastal garrisons."
 gra_thughur: "The Ṯuḡūr"
 gra_thughur_desc: "The #italic ṯuḡūr#! are the frontier marches of al-'Andalus, the wild zones between settled Christian Iberia and our emirate that we name, garrison, and bind to our court through grants of land and warrior-family privileges. We build the #italic ṯaḡr#! forts astride every pass and ford, linking them into a continuous spine of resistance that slows any Christian advance and gives our own riders a place to muster and resupply. This organized frontier transforms the border clans from autonomous raiding parties into defenders with a formal stake in the emirate's survival."
 gra_veteran_thagri: "Veteran Ṯaḡrī"
 gra_veteran_thagri_desc: "Four generations of frontier service have hardened the #italic ṯaḡrī#! in our marches into a permanent warrior class, their families rooted in the same passes their grandfathers held and passing their captaincies from father to son. We pay the $a_thagri_2$ no more than a village wage, and still they march for our banners on rations that would halt any Christian column we send against them. This veteran infantry gives us the most cost-efficient defense our frontier can produce, holding territory that would otherwise demand expensive mercenaries to garrison."
 gra_veteran_tornadizos: "Veteran Tornadizos"
 gra_veteran_tornadizos_desc: "What began as ad hoc recruitment of Christian #italic elches#! has hardened, over four generations, into a settled warrior caste that our frontier has made its own — renegade families now marrying within their ranks, passing the lance-and-plate technique from father to son, and equipping themselves to a standard the original adventurers never reached. We recognize this settled class with land grants and officer commissions, binding a heavy cavalry arm to our cause whose loyalty is no longer suspect. This veteran formation gives us the heaviest mounted strike force our tradition can produce, riding as the $a_tornadizos_2$ at the center of our battle line."
 saqaliba_barracks_advance: "Dār aṣ-Ṣaqāliba"
 saqaliba_barracks_advance_desc: "The old Cordoban caliphs kept a guard of #italic Ṣaqāliba#!, slave-soldiers conditioned to answer to the throne alone. We revive that institution by founding the #italic Dār aṣ-Ṣaqāliba#!, the House of Slaves, where such men are bought, armed, and drilled. Its arsenals match any armory of the realm, yet draw upon a wholly different resource, and from its musters the royal household gains a standing corps loyal to us before any clan or city."
 a_saqaliba_mutaqaddimun_advance: "Aṣ-Ṣaqāliba al-Mutaqaddimūn"
 a_saqaliba_mutaqaddimun_advance_desc: "We raise the first generation of the revived corps, the #italic mutaqaddimūn#! who came before. We name them the #italic aṣ-Ṣaqāliba al-Judud#!, the New Ṣaqāliba, to set them apart from the #italic al-Qudamā'#! of Cordoba's lost golden age. Bound to the #italic dār#! and to the household, they owe nothing to the frontier clans or the old Arab families."
 a_saqaliba_mutaakhkhirun_advance: "Aṣ-Ṣaqāliba al-Muta'aḵḵirūn"
 a_saqaliba_mutaakhkhirun_advance_desc: "A reforming hand reorganizes the corps for its second age. Drill is standardized, the musket replaces older arms, and the rolls of the #italic dār#! swell beyond anything the $a_saqaliba_mutaqaddimun$ knew. The later Ṣaqāliba, the #italic muta'aḵḵirūn#!, become a permanent pillar of the host rather than a revival still proving itself."
 a_saqaliba_nizam_jadid_advance: "An-Niẓām al-Jadīd"
 a_saqaliba_nizam_jadid_advance_desc: "A sweeping reorganization remakes the corps into a #italic niẓām jadīd#!, a New Order in the manner of the great gunpowder armies of the age. Uniform companies, magazine drills, and a chain of slave-officers risen from the ranks give the household a modern infantry who answer to the throne and no one else. Their very name proclaims the break with all that came before."
