l_english:

 d009_fountain_of_youth_events.1.title: "The Curative Spring"
 d009_fountain_of_youth_events.1.desc: "The guides lead us off the trail to a pool welling up cold and clear beneath a stand of palms, and they will not let us pass without drinking. An old woman among them mimes a bent back straightening and a gray head turning dark again. One of our own, a pikeman gone lame with fever since the coast, kneels and drinks his fill, and by evening he swears the ache has left his legs. The surgeon mutters that a man who wants badly enough to be well will feel well for a day or two regardless of what he drinks. Still, the water is sweet and the story older than any of us. We have crossed oceans on thinner promises than this."
 d009_fountain_of_youth_events.1.a: "Bottle the waters and reward the guides who led us here."
 d009_fountain_of_youth_events.1.b: "A puddle is a puddle. March on."
 d009_fountain_of_youth_events.1.b.tt: "#italic We leave the pool untested and march on with our waterskins still empty#!"
 the_spring_runs_potent: "#Y The spring proves potent, and the men fill every skin they carry#!"
 the_spring_is_ordinary: "#Y The water is sweet but plainly ordinary#!"
 the_waters_may_restore_vigor_tt: "The waters we carry home may yet restore the vigor of age"

 d009_fountain_of_youth_events.2.title: "The Healer's Price"
 d009_fountain_of_youth_events.2.desc: "A healer comes down from the village, an elder hung with shell and bone whom the people plainly hold in awe. Through the interpreter we understand that this one knows the country we are asking after: the springs where the sick are carried, and the places the people hold sacred. Such knowledge is not simply handed to armed strangers. There is a price, and it is not gold. It is respect, or a convincing show of it, with the right gifts offered in the right manner and the old courtesies observed to the letter. Our chaplain bristles at the heathen ceremony. Our quartermaster observes that a guide who knows where the water rises is worth a great deal more than the chaplain's comfort."
 d009_fountain_of_youth_events.2.a: "Honor their customs and earn the healer's trust."
 d009_fountain_of_youth_events.2.b: "Pay them handsomely for a guide."
 d009_fountain_of_youth_events.2.c: "Seize a guide and be done with it."
 the_healer_will_accompany_us_tt: "The healer will accompany the [expedition|e] and join our court upon its return"
 coerced_guide_breeds_resentment_tt: "Our [cultural_opinion|e] of [target_location.GetDominantCulture.GetName] will worsen"

 d009_fountain_of_youth_events.3.title: "A Fever in the Ranks"
 d009_fountain_of_youth_events.3.desc: "It begins with two men shivering at the fire in the heat of the afternoon, and by the third morning a dozen are down, yellow-eyed and raving. The swamps we have been wading in breed something that European bodies were never made to endure. The surgeon has his cupping bowls and his lancets, and a dwindling stock of physic besides. The locals have their own remedies, bitter teas and leaf poultices no apothecary in Seville would recognize. Neither party trusts the other's medicine, and the fever does not much care which it is offered."
 d009_fountain_of_youth_events.3.a: "Summon the ship's physicians, whatever it costs."
 d009_fountain_of_youth_events.3.b: "Trust the local healers and their remedies."
 d009_fountain_of_youth_events.3.c: "March on and let the fever burn itself out."
 the_fever_passes: "#Y The fever passes, and the ranks recover their strength#!"
 the_fever_claims_our_progress: "#Y The fever lingers, and days of hard-won progress are lost to it#!"
 the_remedies_take_hold: "#Y The bitter teas do their work, and the healers earn the men's trust#!"
 the_remedies_fail: "#Y The remedies do nothing, and the fever runs its full course#!"

 d009_fountain_of_youth_events.4.title: "The Old Man's Hope"
 d009_fountain_of_youth_events.4.desc: "[target_leader.GetName] is not a young man, and lately the years sit heavily. There is a new hunger in how the maps are studied late into the night, a sharpness when the pace slackens. The men have begun to murmur that the commander seeks these waters less for crown and country than for the face in the shaving glass. It is an old story, older than any of us: the conqueror who has taken everything except more time, marching into a swamp after the one prize no sword has ever won. Whether that hunger drives us to glory or into an early grave, it drives us hard."
 d009_fountain_of_youth_events.4.a: "Let the old man's hope carry us onward."
 d009_fountain_of_youth_events.4.b: "Counsel patience before his zeal breaks the men."

 d009_fountain_of_youth_events.5.title: "The Isle of Bimini"
 d009_fountain_of_youth_events.5.desc: "The sailors have a name in their mouths now, and they will not stop whispering it: Bimini, an island near this coast where a spring rises that gives back the years the sea has taken from the old. Every pilot claims to have heard it from a man who heard it from another man. The chart shows a scatter of low green islands within a few days' sail, any one of which might be the place... or none of them. To turn off the mainland is to gamble weeks of provisions on a fisherman's tale — which is, when one stops to think on it, precisely the tale that carried this whole expedition across the ocean."
 d009_fountain_of_youth_events.5.a: "Sail for the island the sailors will not stop naming."
 d009_fountain_of_youth_events.5.b: "Keep to the mainland. Islands are for the drowned."
 d009_fountain_of_youth_events.5.b.tt: "#italic We hold to the mainland and let the island of Bimini keep its secret#!"
 the_island_rewards_the_crossing: "#Y The island rewards the crossing with fresh water and better bearings#!"
 the_island_is_barren: "#Y The island is a barren spit of sand, and the crossing wastes precious days#!"

 d009_fountain_of_youth_events.fountain_desc: "Juan Ponce de Leon, conquistador and first governor of Puerto Rico, sailed north in 1513 and made landfall on a coast he named La Florida for the Easter season of its discovery. He charted the peninsula and the powerful current of the Gulf Stream; he skirmished with the Calusa and traded with the Timucua, but he did not find, and by his own reports did not seek, any miraculous spring. The tale that he had crossed the sea in search of waters that restored youth was fastened to his memory only after his death, by chroniclers such as Gonzalo Fernandez de Oviedo and Antonio de Herrera y Tordesillas, and by the captive Hernando de Escalante Fontaneda, who scoffed that many had drowned putting such waters to the test. Rumors of a restorative spring on the island of Bimini were real enough among sailors and natives alike; their attachment to one aging governor was largely a later embroidery, part mockery and part myth. Ponce de Leon returned in 1521 to plant a colony, took a Calusa arrow in the thigh, and died of the wound in Havana, having found neither youth nor rest."
