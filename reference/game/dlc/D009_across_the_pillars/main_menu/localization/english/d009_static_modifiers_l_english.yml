 STATIC_MODIFIER_NAME_searching_for_cibola: "Searching for Cibola"
 STATIC_MODIFIER_DESC_searching_for_cibola: "An expedition is in the field, somewhere between the Sonoran coast and the country of the Pueblos, in search of the Seven Cities of Cibola. The crown's prestige is in the field with them."
 STATIC_MODIFIER_NAME_searching_for_quivira: "Searching for Quivira"
 STATIC_MODIFIER_DESC_searching_for_quivira: "An expedition is in the field, somewhere on the grass-sea north of New Mexico, in search of the Kingdom of Quivira."
 STATIC_MODIFIER_NAME_searching_for_sierra_de_la_plata: "Searching for the Sierra de la Plata"
 STATIC_MODIFIER_DESC_searching_for_sierra_de_la_plata: "An expedition is in the field, in the Andean foothills west of the Plate, in search of the silver mountain the Guarani describe."
 STATIC_MODIFIER_NAME_searching_for_norumbega: "Searching for Norumbega"
 STATIC_MODIFIER_DESC_searching_for_norumbega: "An expedition is in the field, on the Penobscot River in New England, in search of the walled city the French fishermen and Verrazano's pilots reported."
 STATIC_MODIFIER_NAME_searching_for_saguenay: "Searching for Saguenay"
 STATIC_MODIFIER_DESC_searching_for_saguenay: "An expedition is in the field, in the boreal forests north of the Saint Lawrence, in search of the kingdom Donnacona described to Cartier at Stadacona."
 STATIC_MODIFIER_NAME_searching_for_city_of_caesars: "Searching for the City of the Caesars"
 STATIC_MODIFIER_DESC_searching_for_city_of_caesars: "An expedition is in the field, somewhere in Patagonia, in search of the lost city built between two mountains."
 STATIC_MODIFIER_NAME_cibola_discovered: "Cibola Discovered"
 STATIC_MODIFIER_DESC_cibola_discovered: "The Seven Cities of Cibola have been found and their trade opened: the turquoise, the cotton cloth, the worked jet of the Pueblo workshops, and the maize country surrounding them. The country is incorporated into the empire's commercial system on terms more or less of partnership."
 STATIC_MODIFIER_NAME_quivira_discovered: "Quivira Discovered"
 STATIC_MODIFIER_DESC_quivira_discovered: "The Kingdom of Quivira has been found, on the grass-sea east of the Pueblos. The country is fertile, the buffalo herds are vast, and the Wichita farmers and traders run a substantial regional commerce that the crown is now connected into."
 STATIC_MODIFIER_NAME_sierra_plata_discovered: "Sierra de la Plata Discovered"
 STATIC_MODIFIER_DESC_sierra_plata_discovered: "The silver mountain at the heart of the legend has been found and opened. The ore grade is exceptional, the Chicha lords who control the foothills are willing trading partners, and the bullion that flows out of the workings rivals what the older mines of the cordillera produce in their best seasons."
 STATIC_MODIFIER_NAME_norumbega_discovered: "Norumbega Discovered"
 STATIC_MODIFIER_DESC_norumbega_discovered: "Norumbega has been found on the upper Penobscot: a walled stone city of mixed Abenaki and (the Latinist on the staff insists) Old Norse population, with a working gold mine in the hills upstream. The settler traffic and the colonial trade out of New England both shift in response."
 STATIC_MODIFIER_NAME_saguenay_discovered: "Saguenay Discovered"
 STATIC_MODIFIER_DESC_saguenay_discovered: "The northern kingdom Donnacona described to Cartier has been found, in the cold country beyond the second great lake of the Saint Lawrence basin. The settlement is wealthy, the people fair-skinned and Norse-speaking, and the fur and gold trade that the country supports is the richest the French crown has yet opened in the New World."
 STATIC_MODIFIER_NAME_city_of_caesars_discovered: "City of the Caesars Discovered"
 STATIC_MODIFIER_DESC_city_of_caesars_discovered: "The lost city of the Caesars has been found in a hidden valley of the Patagonian Andes, its population descended from the survivors of a sixteenth-century shipwreck. The crown's authority is re-extended over the long-lost subjects and over the silver country they have quietly opened in the generations of their isolation."
 STATIC_MODIFIER_NAME_searching_for_el_dorado: "Searching for El Dorado"
 STATIC_MODIFIER_DESC_searching_for_el_dorado: "An expedition is in the field, somewhere in the Orinoco basin, in search of the gilded king the Muisca remember."
 STATIC_MODIFIER_NAME_searching_for_fountain_of_youth: "Searching for the Fountain of Youth"
 STATIC_MODIFIER_DESC_searching_for_fountain_of_youth: "An expedition is in Florida, somewhere in the Timucua country, in search of the spring the Taino call the Fountain of Bimini."
 STATIC_MODIFIER_NAME_el_dorado_discovered: "El Dorado Discovered"
 STATIC_MODIFIER_DESC_el_dorado_discovered: "The gilded country of the Muisca has been opened to Spanish trade. The gold-work of the highland workshops, executed in a style and on a scale no European silversmith can match, flows out through the new trading-post at the foot of the sacred lake."
 STATIC_MODIFIER_NAME_fountain_of_youth_discovered: "Fountain of Youth Discovered"
 STATIC_MODIFIER_DESC_fountain_of_youth_discovered: "The spring at the heart of the Timucua country has been found and its restorative properties verified. The waters do what the legend said they would do. A chapel has been built on the site, and the pilgrim traffic is already beginning to develop."
 STATIC_MODIFIER_NAME_camelry_doctrine_modifier: "Camelry Doctrine"
 STATIC_MODIFIER_DESC_camelry_doctrine_modifier: "The general's proposal has been adopted. Camel squadrons are being raised alongside the horse, remount depots established along the caravan roads, and the drill manuals rewritten for desert campaigning. The army goes further on less water than it used to, and the officer corps is slowly making its peace with the smell."
 STATIC_MODIFIER_NAME_gra_old_capital_of_the_caliphate: "Capital of the Old Caliphate"
