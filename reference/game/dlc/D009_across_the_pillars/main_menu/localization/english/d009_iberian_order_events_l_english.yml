l_english:

 d009_iberian_order_events.1.title: "The Mastership of the [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.1.entry: "The Mastership of Santiago"
 d009_iberian_order_events.1.desc: "The Master of the [target_order.GetName] is dead, and the brothers have gathered in chapter to name his successor.\n\nNo other order in [ROOT.GetCountry.GetName] is so rich, or so dangerous. Its commanderies run from the Tagus to the frontier of [ShowAreaName('andalusia_area')], its lances answer a Master who owes obedience to no one but the Pope, and whoever the chapter chooses will hold more of our southern border than the whole of our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')].\n\n[target_ruler.GetName] has not waited to be asked. [target_ruler.GetSheHe|U] has already ridden for the chapter house, with an escort at [target_ruler.GetHerHis] back and a candidate in mind."
 d009_iberian_order_events.1.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will name the Master."
 d009_iberian_order_events.1.a.entry: "The $crown_estate$ will name the Master."
 d009_iberian_order_events.1.b: "Let the brothers of the [target_order.GetNameWithNoTooltip] elect their own."
 d009_iberian_order_events.1.b.entry: "Let the brothers elect their own."
 d009_iberian_order_events.1.c: "Let the Pope settle the matter."

 d009_iberian_order_events.2.title: "The Treasure of [ShowLocationNameWithNoTooltip('ucles')]"
 d009_iberian_order_events.2.entry: "$d009_iberian_order_events.2.title$"
 d009_iberian_order_events.2.desc: "[ShowLocationName('ucles')] is the head and the strongbox of the [target_order.GetName]. Two centuries of tribute from the frontier, of bequests from dying knights, and of rents from a hundred commanderies sit behind its walls as plate, coin, and reliquaries.\n\nOur own treasury is not so comfortable. No law lets us open that door, since the order's wealth belongs to the [GetUniqueInternationalOrganization('catholic_church').GetName] and the brothers will say so loudly. But there is no army between our writ and the strongbox either."
 d009_iberian_order_events.2.a: "The order will pay for our wars."
 d009_iberian_order_events.2.b: "Leave it untouched, and endow the house at [ShowLocationNameWithNoTooltip('ucles')]."
 d009_iberian_order_events.2.c: "Send auditors, and take the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s share."
 d009_iberian_order_events.2.c.entry: "Send auditors, and take the $crown_estate$'s share."

 d009_iberian_order_events.3.title: "The Road to [ShowLocationNameWithNoTooltip('santiago_compostela')]"
 d009_iberian_order_events.3.entry: "$d009_iberian_order_events.3.title$"
 d009_iberian_order_events.3.desc: "Every year more of them come from [ShowAreaName('flanders_area')] and from far beyond the Pyrenees, walking west through our [ROOT.GetCountry.GetFlavorRank] toward the shrine of the Apostle. They carry silver for the road, and they are robbed for it.\n\nThe [target_order.GetName] was founded to guard exactly this. Its brothers keep the hospitals and the bridges, and its Master reminds us, whenever we will listen, that guarding a road costs more than the road returns."
 d009_iberian_order_events.3.a: "Pay the brothers to hold the road."
 d009_iberian_order_events.3.b: "Let them take a toll from the pilgrims instead."
 d009_iberian_order_events.3.c: "Grant them the hospital at [ShowLocationNameWithNoTooltip('leon')]."

 d009_iberian_order_events.11.title: "The Question of Cîteaux"
 d009_iberian_order_events.11.entry: "$d009_iberian_order_events.11.title$"
 d009_iberian_order_events.11.desc: "The [target_order.GetName] is a Cistercian house that happens to carry lances. Its rule comes from Cîteaux in [ShowAreaName('burgundy_area')], its abbots come south to inspect, and its brothers take their discipline from monks who have never seen a Moor.\n\nThe visitation is due again, and this time the Master has asked whether he must receive it. Foreign abbots correcting the men who garrison our frontier is either the source of the order's famous discipline or an insult to our [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], depending on who is asked."
 d009_iberian_order_events.11.a: "The abbots of Cîteaux may keep their visitation."
 d009_iberian_order_events.11.b: "The order answers to us, not to [ShowAreaNameWithNoTooltip('burgundy_area')]."
 d009_iberian_order_events.11.c: "Let the lawyers argue it for a few more years."

 d009_iberian_order_events.12.title: "The Mastership of the [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.12.entry: "The Mastership of Calatrava"
 d009_iberian_order_events.12.desc: "The mastership of the [target_order.GetName] has fallen vacant, and the chapter is already divided. One faction has a candidate, another has a rival, and both have armed retainers within a day's ride of the castle.\n\n[target_ruler.GetName] remembers what the last contested election cost our [ROOT.GetCountry.GetFlavorRank]. A Master of the [target_order.GetNameWithNoTooltip] commands the castles of the whole central march; a Master who owes us nothing commands them against us as easily as for us."
 d009_iberian_order_events.12.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will name the Master."
 d009_iberian_order_events.12.a.entry: "The $crown_estate$ will name the Master."
 d009_iberian_order_events.12.b: "Let the brothers of the [target_order.GetNameWithNoTooltip] elect their own."
 d009_iberian_order_events.12.b.entry: "Let the brothers elect their own."
 d009_iberian_order_events.12.c: "Let Cîteaux arbitrate between the factions."

 d009_iberian_order_events.13.title: "The Field of Almagro"
 d009_iberian_order_events.13.entry: "$d009_iberian_order_events.13.title$"
 d009_iberian_order_events.13.desc: "Almagro is the richest commandery of the [target_order.GetName] and it sits squarely across the roads of La Mancha. While our [ROOT.GetCountry.GetFlavorRank] is at war, whoever holds Almagro holds the grain, the remounts, and the crossing.\n\nThe commander there has sent no declaration to anyone. He is waiting to be asked, and he is being asked by more than one party."
 d009_iberian_order_events.13.a: "Almagro will declare for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.13.a.entry: "Almagro will declare for the $crown_estate$."
 d009_iberian_order_events.13.b: "Let the commandery follow its own conscience."
 d009_iberian_order_events.13.c: "Neither side will be allowed to use Almagro."

 d009_iberian_order_events.21.title: "The Frontier at [ShowLocationNameWithNoTooltip('alcantara')]"
 d009_iberian_order_events.21.entry: "$d009_iberian_order_events.21.title$"
 d009_iberian_order_events.21.desc: "The bridge at [ShowLocationName('alcantara')] is Roman, and it is the reason the [target_order.GetName] exists where it does. With [GetCountry('POR').GetName] in arms against us, that bridge is the shortest road into our [ROOT.GetCountry.GetFlavorRank] and the shortest road into theirs.\n\nThe Master writes that he can hold the crossing, burn the far bank, or broker a local peace with the [GetCountry('POR').GetAdjectiveWithNoTooltip] commanders he has known for twenty years. He is waiting to be told which."
 d009_iberian_order_events.21.a: "Hold the bridge, whatever it costs."
 d009_iberian_order_events.21.b: "Let them raid across the Tagus and keep what they take."
 d009_iberian_order_events.21.c: "Let him buy a truce on the frontier."

 d009_iberian_order_events.22.title: "The Last Master of the [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.22.entry: "The Last Master of Alcántara"
 d009_iberian_order_events.22.desc: "The Master of the [target_order.GetName] is an old man, a scholar more than a soldier, and the last of his line to hold the office by the free election of the brothers.\n\n[target_ruler.GetName] has made no secret of what happens when he dies. The question is only whether the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] waits for that, or whether the old man is asked to stand aside now, while he still has the grace to do it well."
 d009_iberian_order_events.22.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will name his successor now."
 d009_iberian_order_events.22.a.entry: "The $crown_estate$ will name his successor now."
 d009_iberian_order_events.22.b: "He keeps the mastership until he dies."
 d009_iberian_order_events.22.c: "Let him retire to his library with honor."

 d009_iberian_order_events.23.title: "The Strongroom at [ShowLocationNameWithNoTooltip('brozas')]"
 d009_iberian_order_events.23.entry: "$d009_iberian_order_events.23.title$"
 d009_iberian_order_events.23.desc: "The strongroom at [ShowLocationName('brozas')] has been opened, and the year's rents of half the [target_order.GetName] are gone with it. There was no siege and no forced door, which tells the brothers what they least want to hear about their own household.\n\nThe Master has asked for our help, which is itself an admission. He would not ask if he could find the thieves himself."
 d009_iberian_order_events.23.a: "Send the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s men after the thieves."
 d009_iberian_order_events.23.a.entry: "Send the $crown_estate$'s men after the thieves."
 d009_iberian_order_events.23.b: "The order must bear its own losses."

 d009_iberian_order_events.31.title: "The Caravels of [order_administrator.GetNameWithNoTooltip]"
 d009_iberian_order_events.31.entry: "The Administrator's Caravels"
 d009_iberian_order_events.31.desc: "[order_administrator.GetName] holds the administration of the [target_order.GetName], and [order_administrator.GetSheHe] has discovered what that means: the rents of every commandery in our [ROOT.GetCountry.GetFlavorRank], and no one with standing to ask [order_administrator.GetHerHim] what they are spent on.\n\n[order_administrator.GetSheHe|U] spends them on ships. Year after year the caravels go south past [ShowLocationName('cape_bojador')] and come back with sand, slaves, and stories, and year after year the order's income goes into the next hull. The brothers have begun to write to us about it."
 d009_iberian_order_events.31.a: "Fund the voyages from the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s purse as well."
 d009_iberian_order_events.31.a.entry: "Fund the voyages from the $crown_estate$'s purse as well."
 d009_iberian_order_events.31.b: "Let [order_administrator.GetNameWithNoTooltip] have what the order can spare."
 d009_iberian_order_events.31.b.entry: "Let the administrator have what the order can spare."
 d009_iberian_order_events.31.c: "The order's rents are for the frontier, not the ocean."

 d009_iberian_order_events.32.title: "The Templar Inheritance"
 d009_iberian_order_events.32.entry: "$d009_iberian_order_events.32.title$"
 d009_iberian_order_events.32.desc: "The [target_order.GetName] exists because we once refused to let the Temple's lands leave [ROOT.GetCountry.GetName], and simply renamed the men who held them. It was always a legal fiction, and [GetCountry('ARA').GetName] have found a lawyer willing to say so out loud.\n\nThe claim is on the old Templar commanderies. If it is allowed, the order loses the estates it was founded on; if it is fought, we will be arguing before the Curia for a decade."
 d009_iberian_order_events.32.a: "Defend the inheritance before the Curia."
 d009_iberian_order_events.32.b: "Buy the [GetCountry('ARA').GetAdjectiveWithNoTooltip] claim out."
 d009_iberian_order_events.32.b.entry: "Buy the $ARA_ADJ$ claim out."

 d009_iberian_order_events.33.title: "The Cross on the Sails"
 d009_iberian_order_events.33.entry: "$d009_iberian_order_events.33.title$"
 d009_iberian_order_events.33.desc: "Every caravel that leaves for the south carries the cross of the [target_order.GetName] on its mainsail. The order paid for a good many of them, and it has begun to ask what it owns at the other end of the voyage.\n\nA commandery on the ocean is a strange idea. So was a commandery on the Moorish frontier, once."
 d009_iberian_order_events.33.a: "Grant them [ShowLocationNameWithNoTooltip('lagos')] and a share of the voyages."
 d009_iberian_order_events.33.b: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] takes its share of what they finance."
 d009_iberian_order_events.33.b.entry: "The $crown_estate$ takes its share of what they finance."
 d009_iberian_order_events.33.c: "The order stays out of the ocean venture."

 d009_iberian_order_events.41.title: "The Master of the [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.41.entry: "The Master of Avis"
 d009_iberian_order_events.41.desc: "The throne is empty, the [ShowCultureName('castilian')] claim is strong, and our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] are looking for a candidate of our own they can live with.\n\nThey keep looking at the Master of the [target_order.GetName]. He is of the [ROOT.GetCountry.GetGovernment.GetAdjective] blood on the wrong side of the sheets, he is sworn to celibacy, and he commands the only body of disciplined horse in our [ROOT.GetCountry.GetFlavorRank] that is not already promised to somebody. The brothers of the order would follow him anywhere, including onto a throne."
 d009_iberian_order_events.41.a: "Let the [target_order.GetNameWithNoTooltip] ride for its Master."
 d009_iberian_order_events.41.pretender_tt: "The Master of Avis is pressing his claim to the throne"
 d009_iberian_order_events.41.a.entry: "Set the Master of the Order on the throne."
 d009_iberian_order_events.41.b: "The [ShowCultureNameWithNoTooltip('castilian')] claim is the lawful one."
 d009_iberian_order_events.41.c: "We will not permit the order to choose our rulers."

 d009_iberian_order_events.42.title: "An Administrator for the [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.42.entry: "An Administrator for Avis"
 d009_iberian_order_events.42.desc: "The mastership of the [target_order.GetName] has come open again, and the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has noticed something the brothers would rather it had not: there is no law requiring the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to wait for their election.\n\n[target_ruler.GetName] has a younger relative with no inheritance and no occupation, and the order has estates enough to keep such a man in the style he expects. It would not be the first time a prince has worn a habit he never intended to honor."
 d009_iberian_order_events.42.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will name the administrator."
 d009_iberian_order_events.42.a.entry: "The $crown_estate$ will name the administrator."
 d009_iberian_order_events.42.b: "Leave the brothers their election."

 d009_iberian_order_events.43.title: "The College at [ShowLocationNameWithNoTooltip('evora')]"
 d009_iberian_order_events.43.entry: "$d009_iberian_order_events.43.title$"
 d009_iberian_order_events.43.desc: "There is a proposal before us to found a college at [ShowLocationName('evora')], and the [target_order.GetName] holds the rents that would pay for it.\n\nThe order was founded to hold a frontier that no longer exists. Its commanderies are farms now, and its brothers are landlords. A college would give the order something to be, which is either a generous thought or an admission that it has run out of purpose."
 d009_iberian_order_events.43.a: "Endow the college from the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] and the order together."
 d009_iberian_order_events.43.a.entry: "Endow the college from the $crown_estate$ and the order together."
 d009_iberian_order_events.43.b: "Let the order give what it can spare."
 d009_iberian_order_events.43.c: "[ShowLocationNameWithNoTooltip('evora')] can wait."

 d009_iberian_order_events.51.title: "The Templar Lands"
 d009_iberian_order_events.51.entry: "$d009_iberian_order_events.51.title$"
 d009_iberian_order_events.51.desc: "The Temple is suppressed, its brothers scattered, and its castles in the Maestrat are sitting empty with nobody lawful to hold them. The [target_order.GetName] was called into existence precisely so that those castles would not leave our [ROOT.GetCountry.GetFlavorRank].\n\n[GetCountry('KNI').GetName|U] have written to remind us that the Council awarded the Temple's property to their order, everywhere in the [ShowReligionAdjective('catholic')] world. [GetCountry('KNI').GetNameWithNoTooltip|U] sit in [GetCountry('KNI').GetCapital.GetNameWithNoTooltip]. The castles are in [ShowAreaName('valencia_area')]."
 d009_iberian_order_events.51.a: "The [target_order.GetNameWithNoTooltip] takes the whole inheritance."
 d009_iberian_order_events.51.a.entry: "Montesa takes the whole inheritance."
 d009_iberian_order_events.51.b: "Divide it with [GetCountry('KNI').GetNameWithNoTooltip]."
 d009_iberian_order_events.51.b.entry: "Divide it with the $KNI$."

 d009_iberian_order_events.52.title: "The Mastership of the [target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.52.entry: "The Mastership of Montesa"
 d009_iberian_order_events.52.desc: "The [target_order.GetName] is the last military order in our [ROOT.GetCountry.GetFlavorRank] that still elects its own Master. The [ShowCultureName('castilian')] masterships came under the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] generations ago, and the [target_order.GetNameWithNoTooltip] has gone on as though nobody had noticed.\n\n[target_ruler.GetName] has noticed. We have petitioned for a bull, and it will come; the only question left is whether we take the mastership now or let the brothers hold one more election first."
 d009_iberian_order_events.52.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will name the Master."
 d009_iberian_order_events.52.a.entry: "The $crown_estate$ will name the Master."
 d009_iberian_order_events.52.b: "Leave the brothers one more election."

 d009_iberian_order_events.53.title: "The Barbary Coast"
 d009_iberian_order_events.53.entry: "$d009_iberian_order_events.53.title$"
 d009_iberian_order_events.53.desc: "The galleys come in the summer, take fishermen off the beaches between [ShowLocationName('peniscola')] and [ShowLocationName('valencia')], and are gone before anything can be launched after them. The [target_order.GetName] holds this coast, and the villages have begun addressing their petitions to the order rather than to us, which is its own kind of warning.\n\nThe Master wants towers: a chain of them, manned all summer, paid for by somebody else."
 d009_iberian_order_events.53.a: "Build the towers and pay for the watch."
 d009_iberian_order_events.53.b: "Let them do what they can with what they have."
 d009_iberian_order_events.53.c: "The coast must look to itself."

 d009_iberian_order_events.61.title: "The Orders and the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]"
 d009_iberian_order_events.61.entry: "The Orders and the $crown_estate$"
 d009_iberian_order_events.61.desc: "The military orders of [ROOT.GetCountry.GetName] have never been asked, in any formal way, what they are for.\n\nThey hold castles, they draw rents, they answer to Masters who answer to the Pope, and for two hundred years nobody has examined where they stand in relation to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. [target_ruler.GetName] is not [target_ruler.GetHerHis] predecessors' kind of ruler, and has had the accounts laid out on the table."
 d009_iberian_order_events.61.desc_council: "The [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] has been sitting for some time now, and its clerks have produced what no previous reign ever had: a full accounting of what the orders hold.\n\nIt makes uncomfortable reading. The Masters are our appointees and the castles are administered in our name, but the rents still go where they have always gone, and the brothers still regard the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] as a patron rather than a master. Administration, it turns out, is not the same thing as obedience."
 d009_iberian_order_events.61.a: "Confirm them in everything they hold."
 d009_iberian_order_events.61.b: "Their rents will serve our [ROOT.GetCountry.GetFlavorRank] first."
 d009_iberian_order_events.61.b.entry: "Their rents will serve the realm first."

 d009_iberian_order_events.63.title: "The Administratorship"
 d009_iberian_order_events.63.entry: "$d009_iberian_order_events.63.title$"
 d009_iberian_order_events.63.desc: "It has been done quietly, one mastership at a time, each with its own bull and its own reasons, and it is only now that the chancery has set them side by side and seen what was actually built.\n\nThe great orders of our [ROOT.GetCountry.GetFlavorRank] hold the castles of the march, the rents of a hundred commanderies, and the best heavy horse in the [ShowReligionAdjective('catholic')] world, and they answer to men [target_ruler.GetName] appointed. Never before has [ROOT.GetCountry.GetName] held so much of the sword of the [GetUniqueInternationalOrganization('catholic_church').GetName] in one hand.\n\nWhat remains is to decide whether this is an institution or merely a habit."
 d009_iberian_order_events.63.a: "Govern them through one council."
 d009_iberian_order_events.63.b: "Keep each mastership in the family."

 d009_order_recent_service_tt: "Remembers this as $zeal_recent_service$ for 5 years, raising its target [zeal|e]"
 d009_order_recent_pilgrimage_tt: "Remembers this as $zeal_recent_pilgrimage$ for 5 years, raising its target [zeal|e]"
 d009_orders_recent_service_all_tt: "Every $iberian_military_order_type$ in our country remembers this as $zeal_recent_service$ for 5 years, raising its target [zeal|e]"
