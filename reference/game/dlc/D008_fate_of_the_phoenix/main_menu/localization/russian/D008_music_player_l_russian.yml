 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Византия — мелодии гимнов"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Этот гимн основан мелодической традиции византийского григорианского хорала, сформированный модальной системой из восьми ладов, которая на протяжении веков определяла православную церковную музыку."
 musicplayer_sol_byzantine_hymn_no_136: "Византия — гимн 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Аранжировка византийского псалма 136, начинающегося с молитвы «Отче наш» и припева «Экзомологисте то Кирио, оти агатос» (Славь Господа, ибо Он благ), в традиционном стиле православного песнопения."
 musicplayer_sol_byzantine_o_virgin_pure: "Византия — «Агни Парфене»"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Греческий гимн Богородице «Агни Парфене» (Чистая Дева Владычице), сочинённый святителем Нектарием Эгинским в конце XIX века, впервые был опубикован в его «Феотокарионе» в 1905 г."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Византия — Overture II Odyssey"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Увертюра к основной теме игры, переосмысленнная в музыкальной традиции Восточной Римской империи. Эта аранжировка вдохновлена византийским григорианским хоралом, когда-то звучавшим в церквях Константинополя."
