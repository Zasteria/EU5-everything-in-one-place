 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Bizantyjski – Hymn Melodie"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Hymn oparty na melodycznej tradycji chorału bizantyjskiego, kształtowanego przez modalny system ośmiu echoi, które przez stulecia kierował muzyką kościoła prawosławnego."
 musicplayer_sol_byzantine_hymn_no_136: "Bizantyjski – Hymn 136."
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Osnowa bizantyjskiego Hymnu 136., rozpoczynającego się modlitwą „Ojcze nasz” i z refrenem „Exomologiste to Kyrio, oti agathos” („Chwalmy Pana, gdyż jest dobry”) śpiewany w tradycyjnym stylu zawołania i odpowiedzi chóru prawosławnego."
 musicplayer_sol_byzantine_o_virgin_pure: "Bizantyjski – Czysta dziewico"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Agni Parthene (Czysta dziewico) to grecki hymn maryjny skomponowany przez św. Nektariusza z Eginy pod koniec XIX wieku, wydany po raz pierwszy w „Theotokarionie” w 1905 roku."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Bizantyjski – Uwertura II Odyseja"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Interpretacja uwertury z głównej ścieżki dźwiękowej inspirowana dźwiękiem chorału bizantyjskiego, jaki niegdyś rozbrzmiewał w kościołach Konstantynopola. Aranżacja przywołuje na myśl muzyczne tradycje Cesarstwa Wschodniorzymskiego."
