 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Byzantin - Mélodies d'hymnes"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Une hymne s'inspirant de la tradition mélodique du plain-chant byzantin, façonnée par le système modal de l'octoechos qui a guidé la musique sacrée orthodoxe pendant des siècles."
 musicplayer_sol_byzantine_hymn_no_136: "Byzantin - Hymne n° 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Une adaptation du psaume byzantin 136, qui commence par la prière « Notre Père » et le refrain « Exomologiste to Kyrio, oti agathos » (Louez le Seigneur, car Il est bon), chantée selon le style traditionnel de dialogue entre l'appel et la réponse propre au chant orthodoxe."
 musicplayer_sol_byzantine_o_virgin_pure: "Byzantin - Ô Vierge pure"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "« Agni Parthene » (Ô Vierge pure) est une hymne mariale grecque composée par saint Nectaire d'Égine à la fin du XIXe siècle, publiée pour la première fois dans son livre liturgique « Theotokarion » en 1905."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Byzantin - Ouverture II Odyssée"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Une interprétation de l'ouverture de la bande originale, inspirée par les sonorités du plain-chant byzantin qui résonnaient autrefois dans les églises de Constantinople. Cet arrangement évoque la tradition musicale de l'Empire romain d'Orient."
