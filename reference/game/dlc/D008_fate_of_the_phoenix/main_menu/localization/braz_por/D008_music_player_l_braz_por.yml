 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Bizantino - Melodias de Hinos"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Um hino baseado na tradição melódica do cantochão bizantino, formado pelo sistema dos oito tons que guiou a música sacra ortodoxa durante séculos."
 musicplayer_sol_byzantine_hymn_no_136: "Bizantino - Hino Nº 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Uma adaptação do salmo bizantino 136, que começa com a oração \"Pai Nosso\" e o refrão \"Exomologiste to Kyrio, oti agathos\" (Louvai ao Senhor, porque Ele é bom), cantada no estilo tradicional de chamada e resposta do canto ortodoxo."
 musicplayer_sol_byzantine_o_virgin_pure: "Bizantino - Ó Virgem Pura"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Agni Parthene (Ó Virgem Pura) é um hino mariano grego composto por São Nectário de Egina no final do século XIX, publicado pela primeira vez em sua obra Theotokarion, em 1905."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Bizantino - Abertura II: Odisseia"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Uma interpretação da abertura da trilha sonora principal, inspirada no som do cantochão bizantino que outrora ecoava pelas igrejas de Constantinopla. Um arranjo que evoca a tradição musical do Império Romano do Oriente."
