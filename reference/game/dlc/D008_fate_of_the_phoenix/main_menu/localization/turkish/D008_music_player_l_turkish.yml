 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Bizans - İlahi Melodiler"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Yüzyıllar boyunca Ortodoks kilise müziğine rehberlik eden sekiz makam sistemiyle şekillenmiş, Bizans yalın ezgi geleneğine dayanan bir ilahi."
 musicplayer_sol_byzantine_hymn_no_136: "Bizans - 136. İlahi"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "\"Göklerdeki Babamız\" duası ve geleneksel Ortodoks ilahi üslubunda karşılıklı söylenen \"Exomologiste to Kyrio, oti agathos\" (Rabbe şükredin, zira O iyidir) nakaratıyla başlayan, Bizans 136. Mezmuru'nun bir uyarlaması."
 musicplayer_sol_byzantine_o_virgin_pure: "Bizans - Ey Saf Bakire"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Agni Parthene (Ey Saf Bakire), 19. yüzyılın sonlarında Eginalı Aziz Nektarios tarafından bestelenen ve ilk kez 1905 yılında Theotokarion adlı derlemesinde yayımlanan Yunanca bir Meryem Ana ilahisidir."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Bizans - Uvertür II: Odesa"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Bir zamanlar Konstantinopolis kiliselerinde yankılanan Bizans ilahilerinin tınısından esinlenen ana tema uvertürünün yorumu. Doğu Roma İmparatorluğu'nun müzik geleneğini çağrıştıran bir düzenleme."
