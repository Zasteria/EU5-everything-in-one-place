 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "ビザンツ - Hymn Melodies"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "ビザンティン聖歌の伝統的な旋律に基づく一曲。その調べは、何世紀にもわたって正教会音楽を導いてきた8つのエコス（旋法）の体系に根ざしている。"
 musicplayer_sol_byzantine_hymn_no_136: "ビザンツ - Hymn No. 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "ビザンティンの詩編第136篇に基づく聖歌。「主の祈り」で始まり、「主をたたえよ、主はいつくしみ深い」の句を、正教会聖歌に伝わる応唱形式で繰り返す。"
 musicplayer_sol_byzantine_o_virgin_pure: "ビザンツ - O Virgin Pure"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "『アグニ・パルテネ（おお、清らかな乙女よ）』は、19世紀末にアイギナの聖ネクタリオスが作曲したギリシャ語の聖母讃歌。1905年刊行の讃歌集『テオトカリオン』に初めて収録された。"
 musicplayer_sol_byzantine_overture_ii_odyssey: "ビザンツ - Overture II Odyssey"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "かつてコンスタンティノープルの聖堂に響いたビザンティン聖歌に着想を得て、本作のメインテーマを新たに編み上げた一曲。東ローマ帝国に息づいた音楽の伝統を呼び起こす。"
