 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Bizancio - Himno melódico"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Un himno basado en la tradición melódica del canto llano bizantino, moldeado por el sistema modal de los ocho echoi que dictó durante siglos la música de la Iglesia ortodoxa."
 musicplayer_sol_byzantine_hymn_no_136: "Bizancio - Himno n.º 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Una adaptación del Salmo bizantino n.º 136, que comienza con la oración «Padre nuestro» y el estribillo «Exomologiste to Kyrio, oti agathos» («Alabad al Señor, pues Él es bueno»), cantada al estilo tradicional de llamada y respuesta del canto ortodoxo."
 musicplayer_sol_byzantine_o_virgin_pure: "Bizancio - Oh Virgen Pura"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "El «Agni Parthene» (Oh Virgen Pura) es un himno mariano griego compuesto por san Nectario de Egina a finales del siglo XIX, publicado en su #italic Theotokarion#! de 1905."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Bizancio - Obertura II Odisea"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Una interpretación de la obertura de la banda sonora principal, inspirada en el canto llano bizantino que resonaba en las iglesias de Constantinopla. El arreglo evoca la tradición musical del Imperio romano de Oriente."
