 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "Byzantinisch - Hymn Melodies"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Ein traditioneller einstimmiger Kirchenhymnus, geprägt vom System der acht Echoi, dass die orthodoxe Kirchenmusik über Jahrhunderte bestimmte."
 musicplayer_sol_byzantine_hymn_no_136: "Byzantinisch - Hymn No. 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Eine Vertonung des byzantinischen Psalms 136, die mit dem Vaterunser beginnt. Der Kehrvers „Exomologiste to Kyrio, oti agathos“ (Preiset den Herrn, denn er ist gütig) wird im traditionellen Wechselgesang der orthodoxen Kirchenmusik gesungen."
 musicplayer_sol_byzantine_o_virgin_pure: "Byzantinisch - O Virgin Pure"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "„Agni Parthene“ (O reine Jungfrau) ist ein griechischer Marienhymnus, den der heilige Nektarios von Ägina im späten 19. Jahrhundert komponierte. Er wurde 1905 erstmals in seinem „Theotokarion“ veröffentlicht."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Byzantinisch - Overture II Odyssey"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Eine Interpretation der zentralen Ouvertüre der Titelmusik, inspiriert vom Klang des traditionell einstimmigen byzantinischen Kirchengesangs, der einst durch die Kirchen Konstantinopels hallte. Das Arrangement greift die musikalische Tradition des Oströmischen Reichs auf."
