 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "비잔티움 - Hymn Melodies"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "수 세기 동안 정교회 성음학의 지침이 된 8선법 체계를 바탕으로, 비잔티움 단선율 성가의 선율적 전통을 계승하여 지어진 성가입니다."
 musicplayer_sol_byzantine_hymn_no_136: "비잔티움 - Hymn No. 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "비잔티움 시편 136편을 바탕으로 한 이 곡은 주기도문으로 시작해, 정교회 성가의 전통적인 선창 및 응창 방식으로 '주님께 감사하라 그분은 인자하시니'라는 후렴구를 가창합니다."
 musicplayer_sol_byzantine_o_virgin_pure: "비잔티움 - O Virgin Pure"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "아그니 파르테네(O Virgin Pure, 거룩하신 동정녀여)는 19세기 말 아이기나의 성 넥타리오스가 작곡한 그리스의 성모 찬가로, 1905년 그의 저서 '테오토카리온'에 처음 수록되었습니다."
 musicplayer_sol_byzantine_overture_ii_odyssey: "비잔티움 - Overture II Odyssey"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "한때 콘스탄티노플의 성당들에 울려 퍼졌던 비잔티움 단선율 성가에서 영감을 받아 메인 사운드트랙 서곡을 재해석한 곡입니다. 이 편곡은 동로마 제국의 음악적 전통을 떠올리게끔 합니다."
