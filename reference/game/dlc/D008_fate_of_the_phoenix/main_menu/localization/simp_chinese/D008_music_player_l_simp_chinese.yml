 #### TRACK NAMES AND FLAVOUR TEXT ####
 musicplayer_sol_byzantine_hymn_melodies: "拜占庭——圣歌旋律"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "一首以拜占庭单声圣歌的旋律传统为基础，并由八调式体系塑造的赞美诗；这套体系数百年来一直引领着东正教教会音乐的发展。"
 musicplayer_sol_byzantine_hymn_no_136: "拜占庭——第136号圣歌"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "这是拜占庭《诗篇》第136篇的编曲，以“我们的天父”祷文与副歌“你众应当荣光主、因为他是良善”开头，并以东正教圣歌传统的轮唱形式演唱。"
 musicplayer_sol_byzantine_o_virgin_pure: "拜占庭——童贞圣母"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "《洁贞颂》（《童贞圣母》）是一首希腊圣母颂歌，由埃伊纳的内克塔里奥于19世纪末创作，最早于1905年刊载在他的《圣母颂集》中。"
 musicplayer_sol_byzantine_overture_ii_odyssey: "拜占庭——第二号序曲：奥德赛"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "这是主题音乐序曲的诠释，灵感来自曾在君士坦丁堡教堂中回荡的拜占庭单声圣歌。编曲唤起了东罗马帝国的音乐传统。"
