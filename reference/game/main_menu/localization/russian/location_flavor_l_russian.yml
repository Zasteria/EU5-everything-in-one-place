l_russian:
 stockholm_desc: "Стокгольм был основан в 1252 году Биргером Магнуссоном в том месте, где озеро Меларен впадает в Балтийское море. Благодаря своему стратегическому расположению город не только контролировал доступ к озеру, но и служил важным торговым узлом, связывающим Швецию с купеческими сетями Ганзы в Балтике."
 paris_desc: "Париж, стоящий на реке Сене, постепенно превратился из скромного поселения в настоящую жемчужину Франции. Благодаря своему знаменитому собору, крупным рынкам и учебным заведениям он стал одним из важнейших политических и культурных центров Европы."
 london_desc: "Лондон, построенный в устье реки Темзы, прошёл длинный путь от небольшого римского поселения до крупнейшего города Англии. Теперь здесь сосредоточена вся политическая и экономическая мощь королевства."
 rome_desc: "Когда-то Рим был центром могучей империи, чья территория простиралась на несколько континентов. Впрочем, даже после её падения Вечный город смог сохранить своё политическое и религиозное значение, став столицей Папского государства."
 jerusalem_desc: "Иерусалим является местом пересечения авраамических религий, а потому имеет особое значение для иудеев, христиан и мусульман. История и облик этого священного города сформировались под влиянием множества завоеваний и паломников, прибывающих сюда со всех краёв света."
 alexandria_desc: "Александрия, некогда известная своим грандиозным маяком и библиотекой, находится на стыке разных цивилизаций и культур. За счёт этого она и сегодня остаётся важным торговым и образовательным центром Средиземноморья."
 constantinople_desc: "Окружённый могучими стенами, Константинополь был сердцем Восточной Римской империи и местом расположения собора Святой Софии — одного из крупнейших в мире храмов. В течение тысячи лет величие и богатство этого города были предметом зависти для всего мира."
 sitges_desc: "В Средние века на холме, где сегодня располагается здание муниципалитета, был построен замок. Первоначально он принадлежал архиепархии Барселоны, однако в XII веке перешёл к семье, в чью честь и получил своё название."
 valladolid_desc: "Вальядолид был основан в конце XI века графом Педро Ансуресом и его женой Эйло Альфонсо в самом центре Северной Месеты, вблизи реки Писуэрга. Благодаря торговле Вальядолид быстро стал одним из важнейших городов в регионе наряду с Бургосом. К XIV веку он обрёл столь значительное влияние, что служил административным центром державы при регенте Марии де Молине и её внуке Альфонсо XI."
 penafiel_desc: "Город Пеньяфьель, чьё название происходит от латинского #italic Pinna Fidelis#! («Верная скала»), был основан в X веке. Изначально он представлял собой небольшой аванпост на вершине холма, предназначенный для отражения набегов со стороны Кордовского халифата. Граф Санчо Гарсия значительно укрепил его и в 1013 году предоставил ему фуэрос — особые городские права и привилегии. Впоследствии Пеньяфьель перешёл во владение влиятельного дона Хуана Мануэля и стал весьма богатым городом с процветающей винодельческой промышленностью."
 toro_desc: "Торо был основан в X веке в долине реки Дуэро для защиты владений Королевства Леон от войск Кордовского халифата. Благодаря своему выгодному расположению город служил важным оборонительным узлом, а тёплый климат и плодородные земли позволили ему также стать крупным центром виноделия."
 thessaloniki_desc: "Долгое время Фессалоники считались вторым по значимости городом Византии после Константинополя. Своим богатством они обязаны выгодному расположению вблизи Эгейского моря, что способствует развитию торговли. При этом местные порты служат своего рода мостом между Западом и Востоком, позволяя перевозить товары между имперскими владениями и Италией."
 malmo_desc: "Мальмё контролирует проход судов через пролив Эресунн, соединяющий Балтийское и Северное море. В связи с этим город является важнейшим стратегическим пунктом, защиту которого обеспечивают его крепкие стены и бдительный гарнизон."
 bilbao_desc: "Бильбао был основан в 1300 году Диего Лопесом де Аро, сеньором Бискайи. Этот город, расположенный в устье реки Нервьон, вскоре стал важным торговым узлом и центром кораблестроительной промышленности в Северной Испании. Кроме того, благодаря своей развитой портовой инфраструктуре Бильбао служил местом, откуда купцы перевозили местную железную руду и кастильскую мериносовую шерсть в английские и фламандские порты."
 radom_desc: "После своего расширения и обновления королём Казимиром III город Радом стал важным политическим центром Польши и оставался им вплоть до конца эпохи Возрождения. Именно здесь в 1401 году была заключена Виленско-Радомская уния, и тут же на сейме 1505 года был принят закон #italic Nihil novi#!."
 krakow_desc: "О поселениях на Вавельском холме было известно ещё в древности, однако впервые Краков упоминается в документе от 965 года, где описывается как крупный торговый город. В 1038 году Краков стал резиденцией польских монархов из династии Пястов, и с тех пор служил одним из главных административных, экономических и культурных центров Польского Королевства."
 megara_desc: "В древности Мегарой правил легендарный герой Нис, а некоторые её уроженцы основали в Средиземноморье такие великие города, как Византион, Херсонес и Селинунт. В дальнейшем Мегара стала важным торговым центром и обрела огромное влияние на территории Греции — во многом благодаря своему мощному флоту. Однако с тех пор она утратила большую часть своего могущества, и ныне от её былого величия осталась лишь тень."
 grojec_desc: "До XII века в Груеце располагалась Познаньская архиепархия и резиденция местного каштеляна, однако в связи с ростом влияния соседнего города Черска он постепенно утратил своё значение."
 gdansk_desc: "Первое письменное упоминание о Гданьске относится к 997 году, однако поселение там существовало задолго до этого. В эпоху позднего Средневековья Гданьск превратился в крупный торговый порт и центр судостроения, благодаря чему он стал одним из наиболее богатых и влиятельных городов Восточной Европы."
 athens_desc: "Афины считались культурным центром Древней Греции и были одним из самых могущественных городов-государств своего времени. Соперничая со Спартой, Фивами и другими античными державами, Афины постепенно добились господства в Эгейском море. Позднее город был завоёван сначала Македонской, а затем Римской и Византийской империями, из-за чего пришёл в упадок. Тем не менее после 1204 года Афины вновь воспрянули, став столицей новообразованного государства крестоносцев."
 wieliczka_desc: "Величка была основана в 1290 году Пшемыслом II в районе соляных рудников. Добыча этого ценного продукта приносила Польше огромную прибыль, в связи с чем город получил множество привилегий и стал крупным промышленным центром. Так, шахты в Величке и соседней Бохне стали частью соледобывающей компании #italic «Краковские жупы»#!, которая обеспечивала их работу до конца XX века. В официальных документах за городом долгое время сохранялось его старое название #italic Wielka Sól#!, что означает #italic «великая соль»#!."
 leksand_desc: "Этот городок на южном берегу озера Сильян существует уже более тысячи лет. В XII веке здесь была построена церковь, первым протестантским главой которой был дальний предок Юхана Андерссона — ведущего гейм-дизайнера Europa Universalis V."
 leipzig_desc: "Лейпциг, основанный в 1165 году на пересечении #italic Имперской#! и #italic Царской#! дорог, довольно быстро разбогател и расширился благодаря торговле пушниной. Получив ряд значительных привилегий, он стал важным торговым узлом Европы и одним из центров книгопечатания в регионе."
 augsburg_desc: "Вольный имперский город Аугсбург, известный под названием #italic Августа Винделиков#! в годы правления императора Траяна, считается одним из старейших городов Священной Римской Империи. В 955 году местному гарнизону удалось отразить нападение венгерских войск, в результате чего значение города заметно возросло. В 1276 году король Рудольф I даровал Аугсбургу статус имперского города, что ознаменовало новый этап в его развитии и поспособствовало его дальнейшему процветанию."
 warsaw_desc: "На заре своей истории Варшава представляла собой небольшое мозавецкое рыбацкое поселение. В 1596 году Сигизмунд III перенёс столицу из Кракова в Варшаву, после чего она начала стремительно расти и уже к XVIII веку стала крупнейшим городом Польши. В это же время здесь перестроили и возвели множество зданий, что значительно поспособствовало развитию польской архитектуры и различных ремёсел."
 tunis_desc: "Основанный легендарной царицей Дидоной в 814 году до нашей эры, изначально этот город носил название Карфаген и являлся столицей одноимённого пунического государства. В результате трёх крупных войн он был разрушен, а затем заново отстроен римлянами. Современный город Тунис был заложен арабами в 698 году неподалёку от древних карфагенских руин. После завоевания Альмохадов в XII веке город фактически стал региональной столицей, и во время правления династии Хафсидов этот статус лишь упрочился."
 heidelberg_desc: "В конце XII века Гейдельберг стал резиденцией пфальцграфа Рейнского, в связи с чем здесь был возведён внушительный замок. Позднее в этом городе был основан первый университет Германии, благодаря чему он стал важным научным и образовательным центром. В ходе Реформации Гейдельберг присоединился к протестантскому движению, что повлияло на создание Евангелической унии во главе с Пфальцем. В эпоху романтизма образ Гейдельбергского замка привлёк в город великое множество поэтов, за счёт чего он даже получил прозвище #italic «город романтики»#!."
 aviles_desc: "Авилес был основан в X веке на территории устья одноимённой реки, благодаря чему он обрёл важное стратегическое значение как порт. В расположенном поблизости замке Гаусон король Астурии Альфонсо III приказал изготовить Крест победы — украшенную золотом и драгоценными камнями реликвию, которая впоследствии стала символом королевства. В XI веке Авилес получил статус королевского города и стал одним из центров морской торговли, в котором также хранились значительные запасы соли, добытой в других регионах державы."
 pingjin_desc: "Тайюань, где расположен священный храм Цзинь, ещё с V века до нашей эры является одним из важнейших городов Шаньси и всего Северного Китая. В 979 году, в ходе завоевания Северной Хань, император Тай-цзун приказал затопить и уничтожить город. В знак триумфа и унижения своих врагов, он переименовал захваченный регион в Пинцзинь, что означает «усмирение Шаньси». В результате затопления от города остались лишь руины, и на его восстановление ушло много десятков лет."
 dunstable_desc: "Данстейбл возник на месте древнего римского поселения. Уже в Средние века англичане основали здесь монастырь. За свою длинную историю город пережил ряд исторических событий. В частности, здесь развёлся со своей женой Генрих VIII, а великий полководец Оливер Кромвель набирал в окрестных землях добровольцев для участия в гражданской войне. Кроме того, здесь располагается старая резиденция Генриха I и один из двенадцати памятных крестов Элеоноры."
 paderborn_desc: "С момента своего основания около 800 года Падерборн служил центром местного епископства. Именно здесь впервые встретились Карл Великий и папа римский Лев III. За время Тридцатилетней войны город понёс большой ущерб: он пережил 16 осад, последнюю из которых устроила шведская армия в 1646 году."
 porto_desc: "Именно от #italic «непобеждённого города»#! Порту произошло название Португалии и знаменитого на весь мир портвейна, изготавливаемого в долине реки Дору."
 jiaxing_desc: "Цзясин расположен на границе между регионами У и Юэ. Слово «цзя» в его названии означает «красота», а «син» — «процветание»."
 torgau_desc: "В 1452 году курфюрст Фридрих II приказал создать возле замка в Торгау ров с медведем. Ров постепенно расширялся вплоть до 1624 года, и в какой-то момент мог вмещать несколько медведей одновременно."
 changsha_desc: "Со времён постройки город Чанша в течение двух тысяч лет оставался главным экономическим и административным центром региона."
 ningxiang_desc: "В Нинсяне был найден крупнейший бронзовый #italic цзунь#! (ритуальный сосуд для вина), изготовленный более 3000 лет назад во времена правления династии Шан."
 wurzburg_desc: "Вюрцбург был образован на месте франконской крепости в 741 году, когда находившееся там поселение получило статус епископства. В раннем Средневековье город процветал главным образом за счёт своего выгодного расположения на реке Майн, по которой проходили многие торговые маршруты."
 hanover_desc: "Из скромного поселения Ганновер постепенно превратился в один из ключевых городов Священной Римской Империи. Под управлением династии Вельфов город стал развитым торговым и культурным центром, который к тому же имел большое политическое влияние."
 osnabruck_desc: "В Средние века Оснабрюк служил центром местного епископства и важным торговым узлом Священной Римской Империи. Среди прочего город известен тем, что в нём было подписано одно из двух соглашений, приведших к заключению Вестфальского мира."
 glasgow_desc: "Глазго возник вокруг средневекового собора, который служил резиденцией местного архиепископства. В XV веке здесь был основан университет, который поспособствовал становлению Глазго как образовательного центра Шотландии."
 neva_desc: "Санкт-Петербург был заложен в дельте реки Невы, которая когда-то была частью варяго-греческого торгового пути. Основанный в 1703 году, этот город служил столицей России более 200 лет."
 dubno_desc: "Город Дубно, впервые упомянутый в 1100 году, был крупным торговым центром Волыни, известным своими большими ярмарками. В 1492 году здесь был возведён замок, вокруг которого разворачиваются события повести Николая Гоголя #italic «Тарас Бульба»#!."
 baden_desc: "Изначальное поселение на этом месте было основано римлянами и носило название #italic Civitas Aurelia Aquensis#!. В эпоху раннего Средневековья город стал известен как Баден, и позднее это название также перешло к Баденскому дому династии Церингенов, который начал править этими землями."
 erbach_desc: "В конце XVIII века граф Франциск I, питавший большой интерес к реликвиям древности, выделил средства на создание в Эрбахе гильдии резчиков, которая занималась созданием изделий из поделочной кости. Благодаря этому город привлёк множество творцов и стал одним из главных центров этого ремесла."
 manhattan_desc: "Некогда населённый народом ленапе, остров Манна-хата был приобретён голландскими поселенцами в обмен на товары общей стоимостью всего 60 гульденов. Здесь они построили крепость, которая стала центром власти Нового Амстердама."
 doncaster_desc: "Через Донкастер, известный прежде под римским названием Данум, проходила Великая северная дорога, по которой путники и торговцы перевозили товары между Лондоном и северными землями. Благодаря такому выгодному расположению Донкастер к 1337 году стал одним из богатейших городов Йоркшира."
 kitchissippi_desc: "Этот город был назван в честь реки Кичисипи, ныне известной как Оттава. В этих землях народ анишинабе занимался охотой и торговлей, пока британские поселенцы не расширили вырубку лесов и не основали здесь город, ставший резиденцией их колониальной администрации."
 saint_marceilin_desc: "Основанный в XI веке, Сен-Марселлен служил резиденцией совета дофина в период с 1337 по 1340 год. Этот город также славится своим мягким сыром с морщинистой корочкой, который подавали при королевском дворе как минимум с 1461 года."
 caerphilly_desc: "В валлийских долинах добывался самый качественный уголь в Европе, благодаря чему во второй половине XVIII этот регион стал важным центром производства железа."
 grenoble_desc: "Гренобль — небольшой, но стратегически важный город в Альпах, который является столицей провинции Дофине. Он окружён реками и горами, поэтому прекрасно подходит для обороны местных земель, в связи с чем здесь была возведена крепость Бастилия. Вокруг местного собора простираются узкие извилистые улицы, где живут и трудятся купцы, ремесленники и крестьяне, привозящие сюда товары из соседних долин."
 kinsale_desc: "Кинсейл — небольшой, но весьма оживлённый портовый городок, расположенный в природной гавани на южном побережье Ирландии. Основными занятиями горожан являются рыбная ловля и торговля. Так, местные купцы обменивают рыбу, шкуры и шерсть на вино, соль и предметы роскоши из Иберии и Франции. На узких улицах вокруг причалов порой встречаются иностранные торговцы, с которыми ирландские моряки обмениваются историями и заключают сделки. Несмотря на скромные размеры гавани, именно она позволила Кинсейлу стать стратегически важным портовым городом, который соединил Ирландию с континентальной Европой."
 stockton_desc: "Стоктон — англосаксонское поселение на северном берегу реки Тис. Оно оставалось весьма малонаселённым до тех пор, пока епископ не освободил местных крепостных, что привлекло сюда множество купцов и ремесленников. За счёт этого Стоктон стал важным торговым городом, который занимался продажей местной шерсти и ввозом иностранных вин. Однако по-настоящему крупным городом Стоктон стал лишь после промышленной революции."
 kunow_desc: "Кунув с раннего Средневековья находился в ведении Краковской архиепархии, однако приход здесь появился лишь в 1281 году. Своим названием город, скорее всего, обязан куницам, которые в изобилии водились в окрестных лесах."
 lublin_desc: "Люблин был основан на рубеже XII–XIII веков, а статус города получил от Владислава Локетека в 1317 году. В последующие столетия Люблин превратился в крупный торговый центр, чей расцвет пришёлся на XVI век. Именно в это время была заключена Люблинская уния, которая и позволила городу обогатиться за счёт развития торговли с Востоком."
 kendal_desc: "Кендал был основан на месте римского военного городка, который возник на берегу реки Кент ещё в I веке нашей эры. Поселение активно развивалось при норманнах: получив в 1189 году от короля Ричарда I право на торговлю в обмен на финансовую поддержку его крестового похода, Кендал начал процветать и со временем стал важным центром средневековой торговли шерстью. Главный замок города принадлежал семье Парр, самой известной представительницей которой была Екатерина — супруга короля Генриха VIII."
 cairo_desc: "Город Эль-Кахира («Победоносный») был заложен в 969 году фатимидским полководцем Джаухаром ас-Сакали неподалёку от древней римской крепости Вавилон. Вскоре он отобрал у Александрии звание центрального города Египта. При Айюбидах и мамлюках он превратился в самый многолюдный город исламского мира, чьи рынки и мечети привлекали купцов, учёных и паломников с трёх континентов. В 1258 году монголы разрушили Багдад, и Каир остался неоспоримой столицей исламской цивилизации — городом необычайного величия, чьи минареты возносились над долиной реки, которая кормила людей с незапамятных времён."
 dadu_desc: "В 1267 году на равнинах к югу от хребта Тайханшань Хубилай-хан воздвиг Даду — «Великую столицу», престольный град своей династии Юань на руинах чжурчжэньского Чжунду. Марко Поло был поражён величием этого города, описывая его широкие улицы, необъятные дворцы и склады, ломящиеся от богатств со всего Китая. Даже когда могущество монголов пошло на спад, город прочно закрепился в роли северных врат между степью и срединными землями Китая, оставаясь важным центром империи."
 venice_desc: "Венеция, выросшая на илистых отмелях Адриатической лагуны, родилась из необходимости и развивалась благодаря большим амбициям. Беглецы, спасавшиеся от вторжения лангобардов, нашли укрытие на этих островах, а к IX веку город превратился в морскую республику под управлением избираемого дожа. Построив Арсенал и бесчисленные торговые конторы, венецианские купцы получили власть над маршрутами, тянувшимися от Чёрного моря до самого Леванта. Они сделали Венецию богатейшим городом христианского мира и бесспорной владычицей средиземноморской торговли."
 moscow_desc: "Москва была основана в 1147 году Юрием Долгоруким как маленькая деревянная крепость на берегах Москвы-реки и долго пребывала в тени более древних городов Руси. Однако под гнётом монгольского ига московские князья проявили удивительную способность к выживанию и расширению владений: они исправно собирали дань для Золотой Орды, постепенно присоединяя соседние княжества. Удачное расположение на перекрёстке северных речных путей позволило городу расти за счёт торговли, и к началу XIV века его великий князь обладал большей властью, чем любой другой правитель на Руси."
 tenochtitlan_desc: "Согласно преданиям народа мешика, их бог Уицилопочтли пообещал привести их туда, где орёл восседает на кактусе, и примерно в 1325 году на болотистом островке посреди озера Тескоко они основали Теночтитлан. Молодое поселение росло с поразительной скоростью — сама природа даровала ему защиту, а окрестные озёрные берега щедро делились богатствами. Однажды дамбы, плавучие сады и сильные воинские традиции превратят его в величайший город обеих Америк — и сердце грозной империи."
 delhi_desc: "На западном берегу Ямуны с древнейших времён сменяли друг друга престолы и династии — и город Дели служил средоточием власти для всех, кто правил этой землёй. В 1206 году династия мамлюков основала здесь Делийский султанат, а при таких правителях, как Илтутмиш и Ала ад-Дин аль-Хильджи, город стал главной исламской столицей Южной Азии. Сюда, к великим мечетям, рынкам и крепостям стекались учёные и купцы со всего исламского мира, и благодаря этому Дели укрепился в роли центра, который управлял огромной частью субконтинента."
 prague_desc: "Прага, заложенная над излучиной реки Влтавы, превратилась из славянского поселения на мелководье в один из величайших городов средневековой Европы. Династия Пржемысловичей возвела свой замок и собор на скалистом мысе Градчан, и под их сенью расцвёл многолюдный купеческий город. Прага служила резиденцией богемских королей и находилась на перепутье между востоком и западом Европы, привлекая немецких и еврейских купцов, ремесленников и учёных. К началу XIV века она стала одним из самых многолюдных и богатых городов к северу от Альп."
 vienna_desc: "Римляне называли Вену #italic Виндобоной#! — это была крепость легионеров на Дунае, стоявшая на страже северных рубежей империи. Когда Великое переселение народов смело римские порядки, город воспрял уже как резиденция маркграфов Бабенбергов, которые на том же самом стратегическом рубеже выстроили город под стать своим амбициям. А когда в 1278 году Габсбурги сменили Бабенбергов, Вена стала оплотом династической империи. Благодаря своему расположению в сердце дунайской долины город стал одной из важнейших стратегических опор Священной Римской империи."
 baghdad_desc: "В 762 году аббасидский халиф Аль-Мансур основал на западном берегу реки Тигр город, который с самого начала задумывался как центр всего мира. В его центральной крепости — легендарном Круглом городе — разместились дворец халифа и великая мечеть, а рынки и жилые кварталы расходились от него лучами. На пике аббасидского могущества в Багдаде проживало больше миллиона человек, а в его Дом мудрости стекались учёные со всего известного мира — переводить книги, участвовать в спорах и совершать открытия. Нашествие монголов в 1258 году положило конец этому золотому веку, но город выстоял, оставшись величайшей метрополией между Тигром и Евфратом."
 florence_desc: "Флоренция раскинулась по обоим берегам Арно в самом сердце Тосканы и прошла путь от римской колонии до города купцов и банкиров, перекроивших европейскую торговлю. Великие банковские дома — Барди, Перуцци, Строцци — выдавали кредиты многим королевствам, а золотой флорин их чеканки стал общепризнанной валютой для международных сделок. Флоренция, которую раздирала вражда #italic гвельфов#! и #italic гибеллинов#! и которой управляли могущественные гильдии, была городом кипучей гражданской гордости и неслыханных богатств. Всё это закладывало почву для расцвета искусств и мысли, который вскоре заставит весь мир ей завидовать."
 samarkand_desc: "Самарканд, один из древнейших городов Центральной Азии, раскинулся в самом сердце Шёлкового пути — там, где караваны с шёлком, пряностями и идеями шли от Китая до Средиземноморья. При Саманидах и Караханидах он стал крупным исламским центром учёности и ремесла, а его мастера славились во всём известном мире своей тонкой работой по металлу и выделкой бумаги. Армии Чингисхана опустошили город в 1220 году, но выгодное расположение на великих торговых путях не дало ему зачахнуть — и базары с мастерскими вновь притягивают к себе половину всей мировой торговли."
 novgorod_desc: "Господин Великий Новгород, как с гордостью величали его сами горожане, превратился из варяжского торгового стана на Волхове в самую могущественную купеческую республику северной Европы. Его выборное собрание, #italic вече#!, руководило городом на демократических принципах, что было редкостью в феодальном мире, а ганзейские торговые партнёры везли новгородские меха, воск и янтарь на рынки от Лондона до Любека. Когда прочие русские города пали под монгольскими набегами 30-х годов XIII века, северное расположение уберегло Новгород, позволив ему сохранить статус богатейшего и самого независимого города Руси."
 lisbon_desc: "Лиссабон расположился в естественной гавани, где Тахо встречается с Атлантикой, и служил приютом для мореходов и купцов ещё со времён финикийцев. Римляне укрепили его и нарекли именем #italic Олисипо#!, а в VIII веке мавританские правители превратили город в цветущий калейдоскоп мечетей и дворцов. Когда в 1147 году Афонсу I при поддержке рыцарей-крестоносцев отвоевал его, Лиссабон стал столицей зарождающегося Португальского королевства и жизненно важным атлантическим портом. Его глубокая гавань и обращённость на запад уже тогда побуждали исследовать неведомый океан, который уходил далеко за горизонт."
 sevilla_desc: "Севилья раскинулась по берегам Гвадалквивира на плодородных равнинах Андалусии, став одной из жемчужин мавританской Испании. При Омейядах, а позже при Альмохадах она развивалась как центр культуры, науки и торговли, а её великая мечеть возносилась над рекой как настоящее свидетельство размаха исламской цивилизации на иберийской земле. В 1248 году Фердинанд III Кастильский отвоевал Севилью, но она сохранила свой многонациональный колорит и стала богатейшим городом христианской Испании, чей речной порт отправлял щедрые дары Андалусии в большой мир."
 hangzhou_desc: "Известный в пору своего расцвета как #italic Кинсай#! — «временная столица», — город Ханчжоу стал обителью южной династии Сун когда в 1127 году север пал под натиском чжурчжэньского государства Цзинь. Марко Поло, посетивший город в конце XIII века, назвал его величайшим городом в мире, особенно отметив каналы, рынки шёлка и просторные площади, где люди то и дело обменивались самыми разными товарами. Даже после монгольского завоевания в 1279 году, благодаря расположению у истоков Великого канала и владычеству над торговлей шёлком и фарфором, город выстоял и остался одним из важнейших во всём Китае."
 bruges_desc: "Во времена расцвета средневековой торговли Брюгге был величайшим рынком Северной Европы — к его причалам стекались венецианские галеры, ганзейские когги и иберийские каравеллы, чтобы освободить свои трюмы от груза. Брюгге был основан у приливной бухты, связывающей город с Северным морем, и обзавёлся суконными рядами и собственной биржей — как полагают, первой в мире, — что сделало его финансовой столицей севера. От английской шерсти до левантийских пряностей — богатства всего известного мира текли сквозь его каналы и купеческие конторы."
 cologne_desc: "Кёльн был основан римлянами в 50 году нашей эры как #italic Колония Агриппина#!, а впоследствии вырос в крупнейший город средневековой Германии и одно из самых могущественных архиепископств Священной Римской империи. Его великолепный готический собор, заложенный в 1248 году для хранения мощей Трёх королей, стал символом веры и амбиций. Кёльн был вольным имперским городом и одним из основателей Ганзейского союза. Он властвовал над важным рейнским торговым путём и служил вратами между Северным морем и сердцем империи."
 bursa_desc: "Бурса, укрытая под склонами Вифинского Олимпа, была процветающим византийским городом, пока в 1326 году османский вождь Орхан не покорил её после десятилетней осады. Орхан сделал Бурсу первой настоящей столицей османского государства: возвёл там мечети, караван-сараи и крытый базар, на века определившие облик города. Бурса служила западным пределом для караванов Шёлкового пути с Востока, но и сама производила тончайшие в мире шёлка, что сделало её городом несметных богатств — и тем самым семенем, которое вскоре даст жизнь Османской империи."
 kyoto_desc: "Когда в 794 году император Камму перенёс сюда двор и нарёк новую столицу #italic Хэйан-кё#! — Столицей мира и покоя, — город Киото на сотни лет стал сердцем японской цивилизации. Сеть широких улиц, усыпанная аристократическими усадьбами и буддийскими храмами, стала домом для самой утончённой придворной культуры тех времён, подарив миру поэзию, живопись и литературу эпохи Хэйан. Междоусобные войны, пожары и возвышение самураев не раз сотрясали стены города, однако он выстоял, став императорской столицей и культурным средоточием Японии."
 timbuktu_desc: "Тимбукту расположился у самой кромки Сахары, в излучине Нигера, и вырос из сезонного туарегского лагеря в один из величайших средневековых городов Африки. Во времена империи Мали он стал центром транссахарской торговли: здесь северные караваны с солью пересекались с золотом и слоновой костью, шедшими с юга. Мечети и #italic медресе#! города привлекали исламских учёных со всего континента, превратив Тимбукту в обитель знаний, чьи библиотеки хранили десятки тысяч рукописей по богословию, математике и астрономии."
 barcelona_desc: "Барселона была основана в I веке до нашей эры как римская колония #italic Барцинон#! и со временем стала столицей графства Каталония, а к XII веку — морским центром Арагонской короны. Барселонское влияние купеческих флотилий и консульств простиралось от Балеарских островов до Сицилии и от Сардинии до портов крестоносцев в Греции, что сделало этот город главенствующей морской силой Западного Средиземноморья. На холмах под великим собором и древними римскими стенами кипела городская торговля — и люди всё чаще обращали взор к морю в поисках богатства и предназначения."
 cordoba_desc: "В свой золотой век Кордова была величайшим городом Западной Европы с мощёными улицами и общественными банями, став домом для полумиллиона человек. Её сеть библиотек превосходила любые аналогичные достижения христианского мира. При Абд ар-Рахмане III, провозгласившем себя халифом в 929 году, она стала столицей халифата, бросившего вызов и Аббасидам в Багдаде, и Каролингам на севере. Здесь жили такие мыслители, как Ибн Рушд и Маймонид, а Великая мечеть — #italic Мескита#! — стала памятником той необычайной цивилизации, которая пустила корни на иберийской земле. Взятие города Фердинандом III Кастильским в 1236 году положило конец этой эпохе, но её наследие уцелело — в тех знаниях, которые Кордова сберегла и передала остальному миру."
 damascus_desc: "Дамаск — один из древнейших городов, в котором на протяжении всей его истории всегда жило много людей. Он господствует над плодородным оазисом у подножия хребта Антиливан, а его рынки питаются водами реки Барада. В VII и VIII веках Дамаск был столицей Омейядского халифата — сердцем крупнейшей на тот момент империи, и его Великая мечеть олицетворяла одно из величайших достижений исламской архитектуры. Даже после того, как Аббасиды сделали столицей Багдад, Дамаск оставался одним из главных торговых и культурных центров Леванта, на базарах которого торговали шёлком, тонкими клинками и благоуханными розами, которыми он особенно славился."
 angkor_desc: "В глубине лесов материковой Юго-Восточной Азии кхмерские цари Ангкора воздвигли столицу, равной которой мир ещё не знал. Грандиозный храмовый комплекс Ангкор-Ват был заложен при Сурьявармане II в начале XII века, был посвящён Вишну и задумывался как земной прообраз мироздания: его рвы изображали космический океан, а башни — вершины священной горы Меру. В пору расцвета в Ангкоре и окрестностях была создана сложная сеть водохранилищ и оросительных каналов, благодаря чему он стал одним из самых обширных городских образований доиндустриального мира."
 vijayanagar_desc: "В 1336 году на южном берегу реки Тунгабхадра братья Харихара и Букка Рая основали Виджаянагар — «Город победы», призванный стать оплотом индуистской цивилизации против растущей мощи Делийского султаната. Под защитой Тунгабхадры и неприступного ландшафта из гранитных валунов и скалистых ущелий город уже на заре своего становления властвовал над плодородными равнинами Центрального Декана. Впоследствии из этой каменной твердыни вырастет империя, которая простоит больше двух столетий, а купцы на её рынках будут торговать товарами со всего Индийского океана."
 naples_desc: "Неаполь был основан около 600 года до нашей эры как греческая колония на берегу живописной бухты. Он успел побывать в руках римлян, византийцев, норманнов и Гогенштауфенов, прежде чем Анжуйская династия в 1266 году сделала его столицей Неаполитанского королевства. При Анжуйцах Неаполь превратился в один из величайших королевских дворов средневековой Европы и самый многолюдный город Италии, а через его порт богатство Меццоджорно отправлялось в большой мир. Неаполитанский двор привлекал учёных, художников и богословов, в частности — Фому Аквинского, который здесь преподавал и здесь же окончил свои дни. Всё это сделало город средоточием не только династической власти, но и культуры."
 milano_desc: "Милан зародился в сердце Паданской равнины как поселение кельтов, но память об этом стёрлась, когда римляне превратили его в #italic Медиолан#!, который одно время фактически служил столицей западной империи. Нашествия варваров ударили по его величию, но позже город расцвёл уже в качестве вольной коммуны, отразив нападение Фридриха Барбароссы и его имперских армий в битве при Леньяно в 1176 году. Под властью рода Висконти, который захватил синьорию в конце XIII века, Милан начал подчинять себе окрестные города Ломбардии, пока не превратился в господствующую державу Северной Италии."
 genoa_desc: "Под надёжной защитой дуги Лигурийских Апеннин Генуя выстроила своё величие, связав его со стихией моря. Местные купцы и адмиралы выстроили морскую державу — сеть факторий и колоний от Чёрного моря до Атлантики — а её флотилии её вновь и вновь сталкивались с венецианскими, оспаривая господство над средиземноморской торговлей. Неукротимое честолюбие великих семейств Дориа, Гримальди и Спинола принесло республике гордое прозвание #italic La Superba#! — «Великолепная» — и доказало, что даже город, у которого почти нет своей земли, может стать одним из самых богатых и влиятельных в христианском мире."
 bologna_desc: "Болонья располагается у подножия Апеннин, там, где Эмилиева дорога встречается с путями, ведущими на север, к Паданской равнине. Она выросла из этрусской #italic Фельсины#!, а позже — римской колонии #italic Бононии#!. Но прежде всего этот город знаменит своим университетом, основанным в 1088 году, — старейшим в мире. В его лекционные залы под двумя средневековыми башнями-близнецами со всех концов Европы стекались студенты, чтобы изучать право, медицину и философию. Богатство купцов, власть епископов и независимость городской коммуны делали Болонью одним из самых желанных городов в политической борьбе средневековой Италии."
 palermo_desc: "На северном побережье Сицилии, между двумя мысами, финикийские торговцы основали Палермо. При карфагенянах и затем при византийцах он вырос в большой город, а после завоевания арабами в IX веке превратился в цветущую исламскую метрополию с мечетями, садами и базарами. Нормандские короли, отвоевавшие город у арабов в 1072 году, возвели на этом многонациональном фундаменте нечто поразительное: сплавив воедино арабские, византийские и латинские традиции, они явили миру сверкающие королевские капеллы и дворцы — этой цивилизации не было равных в христианском мире. Став столицей нормандского королевства Сицилия, а затем и империи Гогенштауфенов, Палермо превратился в один из самых утончённых и могущественных королевских дворов средневековья."
 verona_desc: "Верона, раскинувшаяся по обоим берегам реки Адидже у южных отрогов Альп, с Античности была тем городом, куда ведут все дороги. Её громадный римский амфитеатр — один из крупнейших и лучше всего сохранившихся — по-прежнему возвышается над улицами, которые некогда делили легионеры и купцы. Под властью семейства делла Скала, или Скалигеров, захвативших город в конце XIII века, Верона стала одной из сильнейших синьорий Северной Италии: её правители властвовали над Венето и простёрли свою длань до самой Адриатики. Среди тех, кто нашёл приют при дворе Скалигеров, был и Данте Алигьери — свою #italic «Комедию»#! он завершил под покровительством Кана Гранде делла Скала за долгие годы флорентийского изгнания."
 siena_desc: "Сиена выросла на трёх холмах в самом сердце Тосканы и стала одной из великих держав средневековой Италии. Её богатство строилось на банковском деле и торговле шерстью: купеческие семьи города служили кредиторами и королям, и папам. Яростное соперничество с Флоренцией — до неё было едва ли пятьдесят километров к северу — годами влияло на историю обоих городов. А главная площадь Сиены, Кампо, служила подмостками для гражданской жизни и политических драм одной из самых гордых итальянских коммун. Творения Дуччо ди Буонинсеньи и братьев Лоренцетти превратили Сиену в один из ведущих центров готического искусства в Европе."
 pisa_desc: "В устье реки Арно пизанцы построили одну из величайших морских держав средневекового Средиземноморья. Флотилии Пизы грабили Палермо в 1063 году, громили сарацинских корсаров по всему Тирренскому морю и создавали торговые колонии от Сардинии до Антиохии. На богатства, хлынувшие от этой торговли, пизанцы возвели на #italic Пьяцца-деи-Мираколи#! — Площади чудес — поразительный ансамбль: собор, баптистерий и колокольню — памятники городу, чьё богатство и могущество в XII веке, на вершине своей славы, казались поистине безграничными. Катастрофическое поражение от Генуи при Мелории в 1284 году положило конец морским амбициям Пизы, но город и его несравненные памятники сохранились до наших дней."
 padova_desc: "По преданию, Падую основал троянский герой Антенор, и ещё в римскую эпоху она считалась одним из богатейших городов Италии. К Средним векам она стала процветающей коммуной в самом сердце области Венето. В 1222 году группа учёных покинула Болонью и основала здесь собственный университет, который быстро занял первые места среди европейских школ права и медицины, привлекая сюда студентов со всего континента. В начале XIV века прославленный художник Джотто преобразил интерьер Капеллы дель Арена и создал памятник, который стал вехой западного искусства, а сама Падуя под властью рода Каррара расцвела как двор, где учёность шла рука об руку с честолюбивыми замыслами."
 ferrara_desc: "Феррара, выросшая у берегов болотистой дельты По, прошла путь от скромной речной переправы до города, чей облик определили амбиции дома Эсте — они утвердились здесь как синьоры в XIII веке. Под их долгим покровительством город стал средоточием рыцарской культуры и утончённой придворной жизни: синьоры принимали здесь поэтов, устраивали турниры и учёные диспуты, проводя осторожную политику в условиях соперничества Милана, Венеции и папских владений. Широкие прямые улицы и внушительный замок Эсте, ставшие отличительной чертой Феррары, подчёркивали облик города, где порядок и изящество значили не меньше, чем стены и войска."
 parma_desc: "Римляне основали Парму на Эмилиевой дороге в 183 году до нашей эры, и со временем она стала одним из величайших городов Ломбардской равнины. Расположение на большой дороге между Миланом и Болоньей, а также тучные окрестные поля сделали её неизменно процветающим и желанным городом. В качестве вольной коммуны она вошла в число самых деятельных членов Ломбардской лиги, выступившей против Фридриха Барбароссы. Долгие годы город раздирала ожесточённая вражда гвельфов и гибеллинов, и он не раз переходил из рук в руки сменявших друг друга синьоров. Кафедральный собор и баптистерий, возведённые в романском стиле XII века, олицетворяли гражданское благочестие и богатство, которым суждено было пережить все политические потрясения коммунальной эпохи."
 mantova_desc: "С трёх сторон Мантую окружают озёра, рождённые неторопливым течением Минчо, — на севере Италии найдётся немного мест, столь же надёжно защищённых самой природой; люди селились здесь ещё с бронзового века. Римляне чтили её как родину Вергилия, величайшего из их поэтов, и судьба города с давних пор была неразрывно связана с художественными и литературными устремлениями его правителей. К началу XIV века здесь возвысился род Гонзага, и под их долгим покровительством Мантуе предстояло вырасти в один из самых утончённых и просвещённых дворов Италии."
 lucca_desc: "Лукка, опутанная древнеримской сетью улиц и окружённая богатыми шёлковыми угодьями в области Гарфаньяна, была одним из богатейших городов средневековой Италии. Её купцы рассеялись по всей Европе: их банкирские дома и торговля шёлком сделали слово #italic «лукканский»#! синонимом самого изысканного сукна на рынках Парижа, Лондона и Брюгге. А в самом городе между тем копились богатства, которых хватило на возведение самых величественных романских церквей во всей Тоскане. Хотя Пиза и Флоренция не раз угрожали Лукке, она отстаивала свою независимость с поразительным упорством — крепкие стены и яростная гражданская гордость обеспечивали ей свободу ещё долго после того, как города-соперники угодили под власть синьоров."
 messina_desc: "Греческие колонисты, основавшие город на берегу узкого пролива между Сицилией и итальянским материком, назвали его #italic Занкла#! — в честь изогнутой серпом гавани. Уже тогда расположение сделало Мессину одним из важнейших стратегических портов Средиземноморья. Именно через Мессину в 1061 году нормандцы начали завоевание Сицилии, и впоследствии через её гавань шли армии всех последующих эпох — анжуйские и гогенштауфенские; даже армии крестоносцев на пути в Святую землю пересекали здесь границу между востоком и западом. Землетрясения и политические склоки не раз опустошали город, но благодаря исключительной природной гавани он неизменно возвращался к жизни, в равной мере притягивая к этим берегам и торговцев, и захватчиков."
 brescia_desc: "Брешиа расположилась там, где альпийские предгорья спускаются к Ломбардской равнине. В средневековой Италии этот город входил в число главных производственных городов: его кузницы на всю Европу славились оружием и доспехами превосходного качества. Как вольная коммуна Брешиа была одной из самых деятельных участниц Ломбардской лиги, а мужество, с которым её жители давали отпор имперским армиям, легло в основу традиций Северной Италии. Брешиа была зажата между амбициозными Миланом и Венецией, но оставалась желанным городом для обеих сторон благодаря расположению возле альпийских перевалов и мастерству своих ремесленников."
 cremona_desc: "Римляне основали Кремону как приграничную колонию в 218 году до нашей эры на южном берегу реки По, и со временем она превратилась в один из величайших городов Ломбардской равнины. Расположение на реке сделало город естественным перекрёстком сухопутных и водных торговых путей, связывавших восток с западом. Во время ожесточённых войн между императорами и папами Кремона стала олицетворением непоколебимой верности гибеллинам; город дорого платил за свою преданность, но взамен получал необычайную императорскую милость и немалые богатства. Над его улицами возвышается величественный #italic Торраццо#! — самая высокая средневековая колокольня во всей Италии — и многочисленные башни соперничавших друг с другом семейств. Этот ансамбль воплощает собой бурную гражданскую гордость: власть здесь демонстрировали с тем же неукротимым пылом, с каким и проявляли."
 pavia_desc: "В течение двух веков после падения Рима Павия оставалась столицей Лангобардского королевства в Италии — обителью воинственных королей и хранительницей их железной короны. Для каролингских императоров этот город служил итальянской резиденцией, но город сохранил статус королевского и коронационного центра даже после того, как лангобардские земли поглотила Франкская империя. Университет Павии, один из старейших в Италии, процветал уже к IX веку. А положение на реке Тичино, которая запирает подступ с запада к Паданской равнине, превращало город в желанный трофей для всякой державы, стремившейся к господству на севере."
 perugia_desc: "Перуджа высится на холме над долиной верхнего Тибра. В древности она была одним из двенадцати городов Этрурии, позже стала процветающим римским муниципием, а в Средние века превратилась в одну из самых грозных и беспокойных независимых коммун Центральной Италии. Величественный дворец Палаццо-дей-Приори и фонтан Маджоре, увенчанные в 1278 году скульптурами Никколо и Джованни Пизано, воплотили гражданскую гордость и художественные амбиции, которым не было равных во всей Тоскане. А основанный здесь в 1308 году университет подтвердил желание Перуджи увенчать свою военную и политическую мощь не менее громкой учёной славой."
 ancona_desc: "Изгнанники из Сиракуз, высадившись на Адриатическом побережье, основали Анкону как греческую колонию. Своим именем город обязан греческому слову «локоть» — оно напоминает о круто изогнутом мысе, который с севера прикрывает гавань от ветров. В Средние века Анкона стала важнейшим портом Центральной Адриатики, а её купцы вели оживлённую торговлю с византийским Константинополем и портами Леванта. Сколько ни пытались папы и императоры подчинить город своей воле, Анкона яростно отстаивала независимость, а её гавань и флот служили гарантами свободы, которую здесь рьяно оберегали на протяжении веков."
 aquila_desc: "Л’Акуила — один из самых молодых великих городов средневековой Италии. Его основали примерно в 1254 году, объединив почти сотню деревень Абруццкого нагорья. Говорят, что каждое селение пожертвовало новому городу церковь, фонтан, район и колокол. Город расположился высоко в Апеннинах, в самом сердце горного королевства, и удивительно быстро стал столицей Абруццо. Выгодное расположение и мощные стены надёжно оберегали его от притязаний враждующих синьоров и козней далёкого неаполитанского двора. Обстоятельства появления наделили Л’Акуилу необычайно сложным укладом. Почти сотня общин-основательниц сохранила за собой частицу городского самосознания — отсюда та причудливая многоликость и неукротимая местная гордость, какой не мог похвастаться ни один город на юге Италии."
 ravenna_desc: "Всего один краткий, но поразительный век Равенна побвала последней столицей Западной Римской империи. Когда в 476 году Рим пал, именно здесь, при дворах Одоакра, а затем короля остготов Теодориха, старательно поддерживались формы и традиции римской власти. Когда Византия в VI веке отвоевала город, он стал западным форпостом Константинополя и резиденцией Равеннского экзархата. Именно в эту эпоху греческого владычества местные мастера создали изумительные мозаичные узоры, которыми наполнены церкви и мавзолеи города. Позднее Равенну затмили Болонья и набиравшие силу города Паданской равнины, но в своих необыкновенных произведениях искусства она сберегла память об имперском величии, равного которому не сыскать больше нигде на латинском Западе."
 salerno_desc: "Город Салерно расположился между морем и горами Амальфитанского побережья, в укромной бухте. Когда в 1076 году нормандский завоеватель Роберт Гвискар захватил город, Салерно стал первой крепостью нормандской власти на юге Италии и служил столицей, пока королевский двор не перебрался в Палермо. Основную славу городу принесла #italic Салернская врачебная школа#! — старейшая в Европе. Начиная с IX века она достигла расцвета и вобрала в себя греческую, арабскую и латинскую врачебную традицию, которые сходились на этом многонациональном южном побережье. Врачи, обученные в Салерно, разъезжались по всему континенту, а труды школы по анатомии, хирургии и лечению травами определили облик медицинской практики на всём средневековом Западе."
 syracuse_desc: "Коринфские поселенцы в 734 году до нашей эры основали город на маленьком островке у входа в обширную гавань. Так возникли Сиракузы — со временем им суждено было стать самой могущественной греческой державой на западе Средиземноморья. О военной мощи города красноречиво свидетельствовал сокрушительный разгром афинской экспедиции в 415–413 годах до нашей эры. Именно здесь Архимед изобрёл свои легендарные боевые машины, с помощью которых город долго сопротивлялся римским армиям. Сменявшие друг друга завоеватели — карфагеняне, римляне, византийцы, арабы и норманны — неизменно приходили к одному и тому же выводу: такая гавань слишком ценна, чтобы не попытаться её занять. Палермо давно оттеснил Сиракузы на второй план, и всё же город до сих пор является величайшим центром Юго-Восточной Сицилии. Его древняя гавань и высеченные в камне улицы по сей день хранят память о цивилизации, чей ослепительный блеск когда-то задавал тон всему античному Средиземноморью."
 trebizond_desc: "Трапезунд ютится на узкой береговой полосе, зажатой между Понтийскими горами и Чёрным морем, — в средневековом мире трудно было сыскать город с более впечатляющим расположением. Когда в 1204 году Константинополь пал под натиском Четвёртого крестового похода, отпрыски династии Комнинов бежали сюда и основали Трапезундскую империю. Она ещё долго сохраняла независимость как греческое христианское государство после того, как рухнула сама Латинская империя. Во власти города находилась восточная оконечность черноморского торгового пути и горные перевалы, ведущие в Армению и Персию. Сюда хлынули генуэзские купцы, и Трапезунд стал процветающим западным пределом Шёлкового пути, а на его рынках можно было найти товары из Центральной Азии и даже ещё более далёких краёв."
 smyrna_desc: "Смирна — один из древних городов Эгейского побережья. Она боролась за честь называться родиной Гомера, а позднее вошла в число семи церквей Малой Азии, к которым обращено Откровение Иоанна Богослова. Под властью Византии город служил крупным портом: он связывал богатые анатолийские земли с торговыми путями Эгеиды. В его гавани часто бывали венецианские и генуэзские купцы, основавшие вдоль берегов собственные торговые колонии. В конце XIII — начале XIV века Смирна часто переходила из рук в руки — византийцев, генуэзцев, айдынских тюрков. Исключительно выгодное положение делало город желанным трофеем, мимо которого не могла пройти ни одна держава Эгейского моря."
 konya_desc: "Конья раскинулась на высоком плато Центральной Анатолии. В XII–XIII веках она служила столицей Румского султаната — тюркского государства, господствовавшего в Анатолии. При сельджукских султанах город расцвёл как центр исламского искусства, архитектуры и учёности. Его украшенные изразцами мавзолеи и медресе превратили древний город на плато в один из величайших культурных очагов средневекового исламского мира. Именно здесь поселился и умер поэт-суфий Джалаладдин Руми. Здесь же его последователи основали суфийский орден Мевлеви — дом кружащихся дервишей, чьи музыка и обряды прославили город далеко за пределами Анатолийского плато."
 sivas_desc: "Сивас расположился на высоком плато, где сходятся главные пути между Анатолией и Персией. В средневековом мире Ближнего Востока это был один из величайших городов-перекрёстков. При Румском султанате он вырос в крупный провинциальный центр, чьи правители не скупились на архитектурные замыслы. Великие медресе XIII века — в первую очередь знаменитые Гёк медресе и Медресе с двумя минаретами — по сей день считаются вершиной сельджукского каменного зодчества в Анатолии. После монгольского завоевания город превратился в ключевой административный центр анатолийских провинций Ильханата. Через его рынки и караван-сараи шёл нескончаемый поток товаров, связывавший Центральную Азию со Средиземноморьем."
 kayseri_desc: "Кайсери, в древности известный римлянам как #italic Цезарея Мазака#!, был главным городом древней Каппадокии. Веками он служил вратами, откуда пути с Анатолийского плато расходились на восток, к Армении и Месопотамии. Город стал одним из древнейших очагов христианства в Малой Азии. Здесь родился святитель Василий Великий, чьи богословские труды и монашеский устав определили облик Восточной церкви и по сей день во многом определяют христианскую жизнь. При Сельджуках и их преемниках город заполнили мечети, медресе и караван-сараи. Положение на перекрёстке анатолийских торговых путей повлекло за собой не одну смену властителей: Кайсери успел побыть во власти византийцев, Данышмендидов, Сельджуков и монголов, и каждый новый хозяин осознавал, каким сокровищем он завладел."
 izmit_desc: "Этот город заложил в III веке до нашей эры вифинский царь Никомед I, и римлянам он был известен под именем #italic Никомедия#!. При Диоклетиане она служила восточной столицей империи: император избрал Никомедию своей резиденцией и превратил в административный центр восточных провинций. Именно отсюда в 303 году он начал Великое гонение на христиан — главную церковь города, которую было видно из императорского дворца, снесли, и на веру обрушился последний, самый жестокий удар римской власти. Позже, когда по другую сторону пролива возник Константинополь, этот новый сосед постепенно затмил Никомедию. Однако этот город на протяжении столетий византийского правления оставался важным крупным портом и епископальным центром."
 ankara_desc: "Анкара высится на скалистом холме в центре Анатолийского плоскогорья. Задолго до римлян это был древний галатский город, и лишь позже римляне сделали его главным центром провинции Галатия. Стратегическое положение Анкары на пересечении путей из Константинополя, с берегов Чёрного моря, а также из Леванта и Персии, поддерживало военное и торговое значение этого города. В Анкаре воздвигли величественный храм в честь императора Августа, и сохранившиеся там письмена входят в число важнейших дошедших до нас памятников римской истории. Под властью Данышмендидов, румских сельджуков, а затем и монголов Анкара оставалась важнейшим поселением Анатолийского плоскогорья. Владение этим городом означало контроль над всеми пролегавшими через него путями."
 amasya_desc: "В Понтийских горах река Ешильырмак пробила глубокое ущелье, и в нём укрылась Амасья — царская столица древнего Понтийского царства и родина географа Страбона. В своём знаменитом труде «География» он с любовью и старанием описал родной город. Эффектное расположение Амасьи подчёркивали вырубленные прямо в скальных обрывах над рекой царские гробницы. Они стали воплощением величия эллинистического царства, которое в период своего расцвета властвовало над большей частью Малой Азии. Под властью византийцев, Данышмендидов, сельджуков и монголов город не переставал быть главным центром Понтийских предгорий. Глубокое ущелье и окружающие горы превратили его в одну из самых неприступных крепостей Северной Анатолии."
 rodos_desc: "На протяжении большей части Античности Родос оставался богатейшим и самым многонациональным портом Восточного Средиземноморья. У входа в гавань некогда высился легендарный Колосс — одно из семи чудес древнего мира. Торговля во всех известных тогда морях подчинялась #italic Lex Rhodia#! — Родосскому морскому закону. После столетий римского, византийского и арабского владычества остров в 1309 году перешёл к рыцарям-госпитальерам, и те превратили его в одну из самых мощных христианских крепостей Восточного Средиземноморья. При госпитальерах Родос с его массивными стенами стал оплотом могущества крестоносцев, а их галерные флотилии охраняли морские пути между христианским миром и исламским Востоком."
 corinth_desc: "Коринф контролирует как узкий сухопутный проход между материковой Грецией и Пелопоннесом, так и древний маршрут через перешеек. Благодаря этому он стал одним из самых богатых и стратегически важных городов древнегреческого мира. В эпоху своего расцвета Коринф безраздельно господствовал над торговлей между Эгейским и Адриатическим морем, взимая пошлины с товаров, которые по земле перевозились из одной гавани в другую. Бронзовые изделия и расписная керамика из коринфских мастерских расходились по всему Средиземноморью. В 146 году до нашей эры римский полководец Луций Муммий стёр город с лица земли, однако позже Юлий Цезарь возродил Коринф уже в качестве римской колонии. Он оставался крупным центром, перейдя из рук византийцев к латинянам, а затем к франкам, и всякий новый властитель быстро осознавал, в какой выгодной точке находится этот город."
 candia_desc: "В 1204 году Четвёртый крестовый поход сокрушил Византийскую империю, и Венеция завладела Критом, сделав Кандию его столицей. За следующее столетие город превратился в один из самых стратегически важных венецианских форпостов Восточного Средиземноморья. Плодородные равнины острова кормили и венецианский флот, и различные колонии, а гавань Кандии служила важнейшим пунктом для пополнения припасов на морских путях между Венецией и Левантом. Хотя критское население не раз поднимало восстания против венецианских господ, сам город неуклонно укреплялся и богател. Его стены и склады рисовали облик колониальной державы, которая намеревается удерживать Крит вечно."
 edirne_desc: "Римский император Адриан основал город на берегу реки Марицы и нарёк его в свою честь #italic Адрианополем#!. Этот город охранял главный путь, который связывал Константинополь с дунайской границей, и служил ключевым военным и административным центром обороны Фракии. Именно здесь в 378 году вестготская конница сокрушила легионы императора Валента в одном из самых судьбоносных сражений древности. Из-за этого поражения германские народы начали расселяться в пределах империи, что приблизило окончательный крах Западного Рима. При византийцах Адрианополь оставался главенствующим городом Фракии и по традиции служил передовым рубежом обороны Константинополя от угроз с запада."
 ioannina_desc: "Янина раскинулась на скалистом полуострове, вдающемся в одноимённое горное озеро. Это был главный город Эпирского деспотата — греческого государства-преемника, возникшего на северо-западе Греции после того, как Четвёртый крестовый поход в 1204 году сокрушил византийскую державу. При эпирских деспотах Янина из скромного провинциального городка превратилась в важный очаг греческой культуры и сопротивления. Её природную защиту дополняли мощные стены, а озеро давало и пропитание, и надёжное укрытие. Горный ландшафт Эпира в равной мере дарил городу безопасность и обособленность. Янина служила жизненно важным бастионом и опорой для греческой христианской цивилизации на беспокойных северо-западных землях бывшей империи."
 tarnovo_desc: "Тырново расположился на трёх холмах в излучине реки Янтры. В 1185 году братья Асень и Пётр подняли великое восстание против византийской власти, и город стал столицей Второго Болгарского царства. При династии Асеней он стал одной из самых грозных крепостей на Балканах. На холме Царевец высились царский дворец и Патриарший собор — символы державы, которая в пору своего расцвета в XIII веке простиралась от Дуная до Эгейского моря. Позже, когда царство ослабело под натиском монголов, Тырново остался столицей маленькой, но гордой Болгарии. Его стены и память о царском прошлом даже сотню лет спустя определяли облик и дух города."
 dubrovnik_desc: "Дубровник приютился под известняковыми утёсами далматского берега. Византийцы основали его как убежище, а со временем этот город превратился в одно из самых процветающих и преуспевших в дипломатии малых государств средневекового Средиземноморья. Став республикой Рагуза, он ловко лавировал между давлением Венеции, Венгрии, Сербии и других набиравших силу держав. Где требовалось, Рагуза платила дань, но при этом выстроила сеть купеческих консульств, протянувшуюся от Фландрии до Леванта. Рагузские купцы развозили товары и деньги по всем рынкам известного мира, а за массивными стенами рос изящный каменный город. Сам его облик возвещал о то, что местные жители делают ставку на торговлю и осмотрительную дипломатию, а не на дорогостоящую войну."
 sredets_desc: "Римляне называли этот город #italic Сердикой#! — он был главным в провинции Средиземная Дакия. На момент, когда болгары превратили будущую Софию в один из областных центров своей державы, у неё уже была богатая история. Именно в Сердике император Константин созвал собор 343 года — один из важнейших синодов раннего христианства. Поговаривали, что здесь он впервые задумался о том, чтобы основать новую столицу империи, прежде чем остановил выбор на берегах Босфора. Под властью Византии, а затем и Болгарского царства город оставался ключевым перекрёстком главных дорог на Балканах. Он примостился у самого подножия горы Витоша — такое расположение сделало его заветным трофеем в череде завоеваний, но и позволило пережить каждую смену хозяев."
 ohrid_desc: "Охрид раскинулся на берегу древнего озера, подарившего городу имя. Его возвышение началось в конце IX века, когда святой Климент — ученик просветителей Кирилла и Мефодия — основал здесь знаменитую школу славянской письменности. Её закончили тысячи священников и книжников, овладевших новой славянской грамотой. После крещения Болгарии Охрид стал резиденцией Болгарского патриархата, а позднее — автокефальной Охридской архиепископии, одного из важнейших религиозных центров православного мира. Его холмистые склоны усеяны церквями и монастырями, и город заслуженно прозвали балканским Иерусалимом. Его духовная власть веками направляла христианство южнославянских народов."
 nis_desc: "Римляне знали Ниш как #italic Наиссус#!. Город стоял на главной дороге между дунайской границей и Константинополем — в том самом месте, где сходятся долины рек Моравы и Нишавы. Это делало его одним из самых стратегически важных городов древних Балкан. Именно здесь примерно в 272 году нашей эры родился император Константин Великий — сын западных Балкан, которому предстояло преобразить Римскую империю и будущее западной цивилизации. Город не раз опустошали гунны Аттилы и другие завоеватели, но расположение на перекрёстке путей позволяло ему возрождаться снова и снова. Под властью Византии, Болгарии и Сербии Ниш оставался ключевым узлом центральных Балкан."
 durres_desc: "Дуррес — один из древнейших городов Европы. Его основали примерно в 627 году до нашей эры как греческую колонию Эпидамн выходцы из Коринфа и Корфу, а превосходная естественная гавань на восточном берегу Адриатики сразу придала ему важное торговое значение. Римляне называли город #italic Диррахием#! и превратили его в западное окончание Эгнатиевой дороги — великой военной магистрали, которая пересекала Балканы до самого Византия. С тех пор веками каждое войско, выступавшее из Рима на восток, проходило через его ворота. В роли связующего звена между Италией и Балканами, Дуррес стал одним из самых лакомых кусочков во всём регионе. На протяжении Средних веков его гавань и стены без конца переходили из рук в руки — византийцев, норманнов, венецианцев и анжуйских правителей."
 prizren_desc: "Призрен укрылся в плодородной долине у подножия Шар-Планины. Город был основан в незапамятные времена, но настоящий его расцвет начался в XIII веке, когда средневековое сербское государство сделало его одним из своих главных оплотов. При династии Неманичей он превратился в крупный административный и торговый центр. Православные церкви и монастыри города стали выражением благочестия и честолюбия сербских правителей — те видели себя прямыми наследниками византийской цивилизации. К началу XIV века Призрен уже входил в число важнейших городов Сербского королевства. На его рынки съезжались купцы из Дубровника, Венеции и со всего Леванта, чтобы торговать драгоценными металлами, добытыми в окрестных горах."
 belgrad_desc: "Белград стоит у слияния Савы и Дуная, там, где великий путь из Центральной Европы доходит до Балкан. С древнейших времён этот город служил укреплёнными вратами: римляне называли его #italic Сингидунумом#! и держали здесь легион для охраны дунайской границы. В Средневековье город переходил из рук в руки — от болгар к византийцам, затем к венграм. Крепость, венчавшая холм над слиянием рек, превратила Белград в одну из самых желанных твердынь на Балканах. К началу XIV века он стал главным трофеем в борьбе между Венгерским королевством и набиравшим силу сербским государством, а с его стен открывается вид на реки, которые разделяют миры латинского и православного христианства."
 mecca_desc: "Задолго до пророка в сердце Аравии возвышалась Кааба — каменное святилище, к которому племена полуострова ежегодно совершали паломничество. Когда Мухаммад родился в окрестностях Мекки в 570 году и получил там свои откровения, город стал духовным центром религии, которая распространила своё влияние на три континента. После возвышения и падения халифата Мекка оставалась под властью шерифов, потомков пророка, в свою очередь подчинявшихся самому могущественному исламскому правителю эпохи. С 1269 года египетские мамлюки стали защитниками Мекки, и каждый год их караваны везут через пустыню новую #italic кисву#!, чтобы покрыть Каабу чёрным шёлком."
 aleppo_desc: "Алеппо, один из древнейших городов мира, называли перекрёстком Северного Леванта ещё во времена хеттов и аккадцев. В X веке под властью хамданидского эмира Сайф ад-Даулы город стал культурной жемчужиной арабского мира, двором поэтов и воинов, бросающих вызов византийскому фронтиру своей блистательной поэзией и сталью. Зангид Нур ад-Дин и аюйбидский принц аз-Захир Гази, сын Саладина, перестроили великую цитадель, превратив её в одну из величайших крепостей исламского мира. После разорения монголами Хулагу-хана в 1260 году город отбили мамлюки, сделавшие его вторым городом в своей сирийской державе и перевалочным пунктом в торговле шёлком и пряностями между Ираком и Средиземноморьем."
 adan_desc: "Аден, укрытый в кратере потухшего вулкана, с Античности служил перевалочным пунктом между Красным морем и Индийском океаном. За богатство местных рынков, греческие моряки называли город #italic Eudaemon Arabia#!, «Аравия Плодородная». Сулайхидская правительница Арва в XI веке правила Аденом из Джиблы, а после усиления Айюбидов город отошёл расулидским султанам Йемена и с 1229 года стал главным портом их державы. В его гавани стекаются египетские купцы на пути в Индию и индийские флоты, везущие перец, хлопок и фарфор на запад. Расулидская таможня и её причалы считаются богатейшими в исламском мире."
 hormuz_desc: "Веками государство Ормуз располагалось на побережье Персидского залива, пока угроза монгольских набегов не вынудила его правителя бросить старый город и переселиться на небольшой остров Дшерун в 1300 году. Там купцы нового Ормуза возвели город с каменными домами и большими складами, который обеспечивал себя водой из резервуаров и процветал благодаря торговле жемчугом, конями и индийскими пряностями. Под властью местных правителей, формально подчинённых Керману, остров стал крупным рынком Персидского залива, куда каждый сезон стекаются арабские доу, персидские каракки и индийские джонки, чтобы обмениваться товарами из двух океанов."
 tabriz_desc: "Тебриз, расположившийся в плодородной долине к северу от массива Сехенд, был богатым городом ещё со времён Сасанидов, но слава к нему пришла после того, как персидские Ильханы выбрали его своей столицей. При Газан-хане, принявшем ислам, и его преемнике Олджейту город стал сердцем империи, протянувшейся от Окса до Евфрата, а его базары ломились от китайского шёлка, который доставлялся сюда по имперским #italic ямским#! дорогам. Министр Рашид аль-Дин, эрудит и историк, возвёл квартал #italic Руб-и Рашиди#!, сделав его обширным комплексом медресе, библиотек и скрипториев, куда стекались учёные со всей Евразии. К моменту смерти ильхана Абу Саида Тебриз стал одним из наиболее густонаселённых и пёстрых городов мира."
 isfahan_desc: "Исфахан, омываемый водами реки Зайендеруд и лежащий в центре Иранского нагорья, был одним из величайших городов Персии со времён Сасанидов, когда на его месте располагались поселение Гай и еврейская колония Яхудия. В правление сельджукского султана Мелик-шаха и его визиря Низама аль-Мулька в XI веке это город стал столицей империи, раскинувшейся от Анатолии до Центральной Азии, а его Пятничная мечеть стала одним из выдающихся памятников исламской архитектуры. Монголы без жалости разорили город в 1241 году, но его сады, мосты и ремёсла постепенно возродились под властью Ильханидов, а местные ткачи и кузнецы до сих пор снабжают своими товарами рынки иранского мира."
 mosul_desc: "На противоположном берегу Тигра от руин древней Ниневии стоит город Мосул, который охраняет переправу через реку на пути между Сирией и Багдадом ещё с эпохи раннего ислама. При Хамданидах и позже при атабеках Зангидах Мосул стал мощной пограничной столицей, из которой Имадеддин Занги вёл борьбу с крестоносцами, захватив Эдессу в 1144 году и положив начало долгому исламскому освобождению Леванта. Город известен своими ткачами, в честь которых названа тонкая хлопчатая ткань, известная в Европе как #italic муслин#!, а также кузнецами и серебряниками, снабжающими рынки верхней Джазиры. Избежав худших последствий монгольского вторжения благодаря своевременному подчинению, город остаётся важным опорным пунктом Ильханидов в верхнем течении Тигра."
 samarra_desc: "В 836 году на берегу Тигра к северу от Багдада аббасидский халиф аль-Мутасим основал Самарру, задумав этот город как новую просторную столицу, где его взбалмошные тюркские солдаты не тревожили бы население старого города. Почти шестьдесят лет крупнейшая империя мира управлялась из этого города с просторным улицами, монументальными дворцами и уникальным спиральным минаретом Большой мечети, крупнейшей из когда-либо построенных в исламском мире. После возвращения халифов в Багдад в 892 году придворные и солдаты покинули великий город, но расположенные здесь святилища десятого и одиннадцатого имамов сделали Самарру центром паломничества шиитов, а величественные развалины города до сих пор возвышаются над речной равниной."
 bukhara_desc: "Более тысячи лет Бухара была одним из величайших городов Центральной Азии, согдийским торговым центром, который саманидские эмиры IX и X веков превратили в блистательную столицу исламского Ирана. Мавзолей Исмаила Самани из обожжённого кирпича до сих пор является живым чудом ранней исламской архитектуры, а минарет Калян, возведённый караханидами в 1127 году, всё ещё определяет облик горда. Говорят, когда Чингисхан взял город штурмом в 1220 году, он верхом на коне въехал в пятничную мечеть и потребовал бросить Коран ему под ноги, а затем почти до основания разрушил город. Однако при Чагатаях город постепенно возродился, и в его мечети вновь стали прибывать богословы, вернув ему прежнее звание #italic «Бухорои Шариф»#!, что означает «Величайшая Бухара»."
 herat_desc: "Город Герат, древняя Арейя Ахеменидов, высится на плодородной равнине Герируд, где пересекаются дороги из Персии, Хорасана и Индии. При Газнавидах это был выдающийся пограничный город поэтов и купцов, а Гуриды, возвысившиеся в XII столетии, украсили его мечетями и медресе, прежде чем их империя устремилась на юг в Индостан. Монгольские всадники Толуя с ужасающим рвением разграбили город в 1221 году, но после прихода к власти маликов из династии Куртов в 1245 году город постепенно был восстановлен как столица вассалов ильханов, а расположение на великом пути, связывающем восток с западом, стало залогом его процветания."
 kashgar_desc: "Кашгар, расположенный на западном конце Таримской впадины на стыке Мавераннахра, Ферганы и Тибета, был оазисом на Великом шёлковом пути со времён античности. Под властью караханидских ханов X и XI веков этот город стал крупным центром тюркской исламской цивилизации и домом выдающегося исследователя Махмуда аль-Кашгари, который в своём труде #italic «Диван лугат ат-турк»#! собрал языки тюркских народов для Аббасидов. После монгольского завоевания город отошёл чагатайским ханам, чьи кочующие дворы перемещались по степи между Тянь-Шанем и Памиром. Через базары Кашгара продолжают течь нефрит, лошади и шёлк, обеспечивая богатство таримских оазисов."
 lahore_desc: "Лахор, древняя столица индуистской династии Шахи, Лахор в 1021 году был захвачен Махмудом Газневи, став восточной столицей его обширной империи, а также вратами, через которые исламская цивилизация проникла на равнину Инда. При Газневидах Лахор стал блистательным приграничным городом с мечетями и медресе. Там жили персидский поэт Масуд Сад Салман и богослов Али аль-Худжвири, чьё суфийское святилище #italic Дата Дарбар#! по сей день привлекает паломников. После возвышения мамлюкского султаната Дели город стал главной крепостью мусульман на пути монгольских всадников, которые раз за разом пересекали реку Инд. При султанах, включая Балбана, укрепления города были перестроены для защиты от степняков."
 varanasi_desc: "Варанаси, один из древнейших непрерывно населяемых городов мира, известный верующим как #italic Каши#!, или «Сияющий», стоит на западном берегу Ганга в наиболее священном месте для индуистов. Паломники стекались сюда задолго до возникновения письменности, чтобы искупаться в реке и освободиться от цикла перерождений. На спускающихся к Гангу гхатах можно было увидеть множество храмов, а также аскетов и погребальных костров, куда приносили тех, кто хочет умереть в этом святом месте. Гуридские армии под началом Кутб ад-дин Айбака разорили город в 1194 году, уничтожив множество местных храмов, но Варанаси не раз возрождался. Его ткачи шёлка и санскритские учёные сохраняют цивилизацию, которую не удалось уничтожить ни одному завоевателю."
 madurai_desc: "Более тысячи лет Мадурай был столицей царей Пандьев из тамильского юга. Здешний великий храм богини Минакши стал вершиной развития цивилизации поэтов, учёных и воинской аристократии. Говорят, в Античности здесь процветали тамильские академии #italic сангам#!, привлекая к южным дворам бардов, а также поддерживая дебаты и развитие языка. Малик Кафур, прославленный военачальник делийского султана Ала ад-Дина Хильджи, взял город штурмом в 1311 году и вывез накопленные им богатства. В 1335 году туглакидский наместник Джалал ад-дин Ахсан-шах провозгласил независимость Мадурайского султаната, хрупкой исламской державы в древнем сердце тамильской земли."
 patna_desc: "На южном берегу Ганга некогда располагалась древняя #italic Паталипутра#!, столица Ашоки — императора Маурьев. Отсюда власть первой индийской империи простиралась от Афганистана до Бенгальского залива. Греческий посол Мегасфен восхищался местными деревянными палисадами и роскошью дворов города, а китайский паломник Фасянь застал город процветающим в V веке под властью Гуптов. Но во времена Делийского султаната великая столица уменьшилась до скромного городка по названием Патна, который стал провинциальным оплотом туглукидского региона Бихар, где наследие одного из величайших городов античности сохранилось лишь в памяти учёных и в развалинах по берегам реки."
 chittagong_desc: "Читтагонг, расположившийся в широком эстуарии, где реки Восточной Бенгалии впадают в Бенгальский залив, с древних времён играл роль порта между Индией и Юго-Восточной Азией. Для арабских географов это был #italic Самандар#!, город купцов, чьи корабли достигали Китая, а тибетский паломник Дхаммапала в X веке описал здешние монастыри. Владение этим городом оспаривали правители Бенгалии и Аракана, а также вожди холмов Трипуры. Он неоднократно переходил из рук в руки, а после завоевания Бенгалии Делийским султанатом оказался под властью мусульман. Его гавань остаётся главным восточным портом для экспорта риса и хлопка дельты Ганга."
 jinjiang_desc: "Цюаньчжоу, известный арабам как #italic Зайтун#! и описанный Марко Поло как один из двух величайших портов мира, достиг небывалого благополучия при династиях Сун и Юань, став главным китайским портом, который принимал корабли из Индийского океана. Его гавань забита джонками, которые направляются к Островам пряностей, в Индию и Персидский залив, а в самом городе целыми кварталами селятся арабские, персидские, тамильские и армянские купцы, чьи мечети, индуистские храмы и христианские церкви соседствуют с буддистскими монастырями и манихейским святилищем. Марко Поло, побывавший в городе в 1290 году, писал, что на каждый гружёный пряностями корабль, достигший Александрии, приходится сотня прибывших в Зайтун, а пошлины с местной колоссальной торговли превратили этот город в одну из опор императорской казны Юаня."
 shangyuan_desc: "На южном берегу Янцзы, где река изгибается на север в сторону моря, располагается город, который сегодня известен как Цзицин, а в прошлом на протяжении более тысячи лет являлся столицей и крепостью. Древние царства У, Восточная Цзинь и южные династии в эпоху после империи Хань, правили из-за стен города, носившего имена #italic Цзянье#! и #italic Цзянькан#!, что на века сделало его культурным сердцем южного Китая. Когда чжурчжэни завоевали север в XII веке, сунский двор ненадолго располагался в этом городе и сделал его своей новой столицей, а после покорения монголами город был перестроен, став столицей округа Цзицин. Его стратегическое положение в нижнем течении реки Янцзы обеспечило ему важную роль среди городов юга."
 wuxian_desc: "В центре дельты Янцзы расположен город Сучжоу, в древности известный как #italic Гусу#!, а в эпоху Сун как #italic Пинцзян#!. Город был основан в VI веке до нашей эры как столица царства У. Он был выстроен в сложной паутине каналов, и сроднился с городом Ханчжоу для его жителей, которые говорили: «Небеса наверху, Сучжоу и Ханчжоу внизу». Этот город издавна славился ткачами шёлка, садовыми поместьями учёных, оперой и изысканной кухней. В правление Южной Сун он стал одним из богатейших городов юга. Монгольское завоевание 1276 года не прошло бесследно, однако к началу XIV века сады, пагоды и рынки по берегам каналов Сучжоу вновь привлекают купцов и учёных со всего Китая."
 guangzhou_desc: "В устье реки Чжуцзян расположен город Гуанчжоу, куда ещё со времён династии Хань прибывали иностранные корабли, а купцы торговали с землями южных морей. Ко времени правления династии Тан арабские и персидские доу каждый сезон прибывали к местным причалам в таком количестве, что в городе возник иностранный квартал, которым управляли старейшины, избранные мусульманскими купцами. В 879 году мятежник Хуан Чао, по слухам, перебил более ста тысяч иноземных жителей города в ходе своей кровавой кампании. Монгольское завоевание положило начало новой эпохе процветания Гуанчжоу, и этот город повлиял на расцвет морской торговли в эпоху Юань, через его гавани шли в другие страны товары из Линнаня, а индийские и арабские купцы вновь стали частыми гостями постоялых дворов и складов города."
 lhasa_desc: "Город Лхаса был основан в VII веке тибетским императором Сонгцэном Гампо, который построил храм Джоканг и хранил там священный образ Будды, привезённый его непальской и китайской царицами. В течение двух веков Лхаса была центром Тибетской империи, которая соперничала с Танским Китаем и владела землями от Памира до Бенгальского залива. После падения империи в IX веке город пришёл в упадок, но храмы Джоканг и Рамоче остались духовными центрами тибетского буддизма. После похода по плато в 1240 году монголы они назначили настоятелей монастыря Сакья своими наместниками. Хотя Сакья остаётся административным центром, Лхаса сохраняет свой статус священного города, привлекая паломников, которые проходят Баркхор по кругу, чтобы поклониться статуе Джово Шакьямуни."
 kamakura_desc: "В 1185 году полководец Минамото-но Ёритомо отобрал власть у императорского двора в Киото и сделал прибрежный город Камакура столицей нового военного правительства, #italic бакуфу#!, которое с тех пор правило Японией от имени императора. При регентах Ходзё город превратился к укреплённую столицу строгой самурайской культуры, окружённую горами и морем, а большая бронзовая статуя Будды, отлитая в 1252 году, с той поры медитирует над районами города как символ нового дзен-буддизма военной аристократии. Именно из Камакуры принималось решение об отражении монгольских вторжений 1274 и 1281 годов, которым дали отпор воины кланов Кюсю и своевременно подоспевшие шторма, получившие имя #italic «камикадзе»#!, или «божественный ветер»."
 hakata_desc: "Хаката — важнейшее окно, на протяжении многих веков соединяющее Японию с континентом. Порт Хакаты за свою историю принял у себя немало важных гостей: послов Кореи и династий Тан и Сун, многочисленных купцов из южных государств… В эпоху Сун в Хакате возник китайский квартал с каменными складами и буддистскими храмами, возведёнными руками китайских монахов. Со временем город благодаря торговле разбогател настолько, что стал богатейшим портовым поселением Кюсю. Именно на песчаные берега Хакаты в 1274 и 1281 году сошли вторгнувшиеся в Японию монгольские захватчики, и именно здесь бакуфу Камакура воздвигло великую каменную стену — #italic «гэнко боруй»#!, останки которой и сегодня напоминают потомкам о самой отчаянной оборонительной войне в истории державы."
 hanyang_desc: "У бассейна, где река Хан изгибается в сторону Жёлтого моря, под защитой гор располагается область Ханян, заселённая ещё с доисторических времён. В древности за обладание ей соперничали два царства — Пэкче и Когурё. Под властью Когурё эта местность обрела особое значение: здесь была учреждена так называемая Южная столица — #italic Намгён#!, одна из трёх столиц в дополнение к основной в городе Гэгён. Последующие правители Кореи неоднократно задумывались о переносе сюда царского двора — так им советовали гадатели, утверждавшие, что город расположен исключительно удачно. К началу XIV века Ханян — важный город в составе Корё, формально находящийся под властью монгольского государства Юань. Благодаря стратегическому расположению на реке Хан он служит вратами, соединяющими Корею с остальным миром."
 pagan_desc: "На сухих равнинах Верхней Бирмы, там, где Иравади огибает безжизненные холмы, в XI веке появилось Паганское царство. Его первый владыка, царь Аноратха, объединил бирманские народы и принял тхераваду — разновидность буддизма, перенятую им у монаха Шина Арахана. За последующие два столетия преемники Аноратхи воздвигли на окружающей столицу равнине тысячи ступ, пагод и храмов, построив больше святынь, чем какая-либо другая буддистская держава. Рисовые поля же были настолько обильны, что питали учёных и ремесленников от Индии до Шри-Ланки. В 1287 году царство разорила монгольская армия под командованием хана Хубилая. К началу XIV века власть оказалась в руках бирманских шанов из Мьинсайна и Пиньи. От древней столицы остались только руины, и сегодня влекущие к себе паломников, ищущих просветления среди десяти тысяч разрушенных храмов."
 sukhothai_desc: "В начале XIII века тайские вожди — выходцы из верховий Чаупхраи свергли власть ангкорских кхмеров и основали царство Сукхотаи — #italic «рассвет счастья»#!. Под властью царя Рамакхамхаенга, правившего с 1279 по 1298 годы, в королевстве начался золотой век. Он стал возможным во многом благодаря стараниям монахов и ремесленников из Шри-Ланки, перебиравшихся в новое буддистское государство: в Сукхотаи исповедовали тхераваду. Высеченная в 1292 году надпись, увековечивавшая королевские реформы, — старейшая из всех сохранившихся надписей, сделанных тайским письмом; считается, что к его созданию приложил руку сам Рамакхамхаенг. К началу XIV века за влияние в регионе с Сукхотаи соперничают сразу несколько тайских княжеств, образовавшихся в низовьях Чаупхраи, вся тайская цивилизация по-прежнему берёт пример с сукхотайских культурных достижений — позолоченных ступ и статуй Будды."
 thang_long_desc: "В 1010 году вьетнамский император Ли Тхай-то (Конг Уан) перенёс столицу из тесной крепости Хоалы в новый город на реке Хонгха — #italic Тханглонг#!, «взлетающий дракон». К такому поступку его подтолкнуло снизошедшее видение. При династиях Ли и Чан город стал сердцем Дайвьета — городом пагод, школ и королевских дворцов, городом, где сложилась вьетнамская цивилизация, не похожая на соседей — китайцев, тямов и кхмеров. Трижды монгольские армии под командованием хана Хубилая прорывали северную границу в попытке покорить Дайвьет, и трижды великий полководец Чан Хынг Дао со своими верными чанскими солдатами давал врагу достойный отпор. Народная память до сих пор хранит воспоминания об этих сражениях, особенно о самом славном из них — битве у реки Батьданг в 1288 году."
 trowulan_desc: "В 1293 году, сразу после того, как вторгшиеся на Яву монгольские войска оказались стравлены с узурпатором престола Сингасари, яванский царевич Раден Виджая провозгласил новую державу — Маджапахит со столицей в Тровулане, в низине реки Брантас. Плодородные рисовые поля Восточной Явы обеспечивают жителей пищей, возведённые вокруг домов каменные стены — защитой, а объёмные водохранилища — водой. Великолепные городские ворота же украшены терракотовыми панелями с изображением свершений новой династии. В 20-х годах XIV века к власти пришёл мапатих Гаджа Мада. Под его руководством Маджапахит начинает завоевательные походы, имеющие целью покорение всего архипелага. Тровулан вот-вот вступит в золотой век и станет сердцем величайшей империи Южной Азии."
 palembang_desc: "С VII века до конца XIII века Палембанг служил столицей морской империи Шривиджая. Её флоты держали Малаккский пролив в железном кулаке, а стараниями монахов столица стала одним из важнейших буддистских городов Южной Азии. В городских монастырях тысячи монахов, в том числе пришедших сюда в 70-е годы VII века по наущению китайского паломника И Цзиня, занимались переводом и написанием комментариев к различным трудам. В 1025 году безраздельная власть Шривиджаи над проливом закончилась — её оборвал набег войска государства Чола, и на протяжении последующих столетий Палембанг медленно превращался в данника других яванских царств, хотя и поныне он остаётся важным владением в руках владык южных окраин Суматры: этому способствует выгодное расположение на реке Муси."
 pegu_desc: "На расположенной в низменности дельте, там, где реки Ситуан и Баго впадают в море, стоит город Пегу. Его возвышение началось в 1287 году, когда монголы уничтожили Паган; после этого монский царь Вареру основал в Нижней Бирме новую державу, живущую по законам тхеравады. Стараниями его наследников город, известный среди монов как #italic Хантавади#!, превратился в важнейший порт верхней части Бенгальского залива. Купцы из Бенгалии, Шри-Ланки и с Коромандельского берега торгуют здесь тиком, рубинами и знаменитыми лаковыми изделиями от монских ремесленников. Здесь же находится пагода Швемадау, в которой, по преданиям, покоятся мощи Будды, — главная духовная достопримечательность монской цивилизации, возникшей на руинах Пагана."
 chiang_mai_desc: "В 1296 году тайский царь Менграй, уроженец долины реки Маэпинг, основал новую столицу #italic Чиангмай#! — «новый город». На этом в гористых долинах Северного Сиама и завершилось объединение Ланнатая — «земли миллиона рисовых полей». Выбрать именно это место посоветовали цари Сукхотаи и Пхаяу. Городские стены и окружающий поселение ров возвели у центральной площади, следуя священному замыслу по объединению воедино монских, тайских и кхмерских традиций. При Менграе и его наследниках в Чиангмае начали процветать буддизм тхеравадского толка и различные ремёсла, не в последнюю очередь — бронзовое дело. Местные бронзовщики при поддержке монастырей отливают великолепные статуи, пользующиеся спросом во всём буддистском мире."
 vijaya_desc: "Вот уже четыре столетия цари Тямпы правят прибрежной полосой Центрального Вьетнама из крепости в Виджае, расположенной за песчаными дюнами у Южно-Китайского моря. Кирпичные башни, охраняющие этот клочок земли, оберегают индусскую цивилизацию и её купцов, торгующих шёлком и ароматическим деревом с южными державами, от врагов, однако они оказались недостаточно крепки, чтобы достойно сносить удары двух могущественных соседей — кхмерского Ангкора и вьетнамского Дайвьета. В 1145 году столицу Тямпы захватили кхмеры, а в 1283 и 1326 годах — вьетнамцы. Каждый раз ей удавалось восстановить независимость, но каждый раз этой независимостью приходилось поступаться всё больше. Под молчаливым взором старых кирпичных башен цивилизация начинает постепенно отступать по побережью."
 lubeck_desc: "В 1143 году граф Гольштейна Адольф II основал город Любек, уничтоженный пожаром 1159 года и впоследствии отстроенный Генрихом Львом. Любек стал связующим звеном между Северным морем и Балтикой; в гавани на реке Траве начали бросать якоря саксонские, славянские и скандинавские купцы. В 1226 году Фридрих II пожаловал Любеку статус вольного имперского города, что привело к образованию в нём первых самоуправляемых купеческих гильдий. Паутина торговых связей, окутавшая город башен из красного кирпича, потянулась к другим купеческим городам Балтики, связывая их воедино. К XIV веку любекское право легло в основу права более чем сотни поселений на Балтийском и Северном морях, став тем самым законодательной опорой для устроения быта купеческих общин севера."
 visby_desc: "За прочными каменными стенами на западном побережье Готланда вырос город Висбю, превратившийся в XII — XIII веках в один из богатейших городов Балтики. В его порту новгородские купцы торгуют шерстью, фламандские — тканью, а ганзейские — железом и сельдью. Островом уже несколько столетий правит «республика земледельцев», сосуществующая с привилегированными немецкими купцами, занимающими в городе отдельный квартал. Благодаря такому совместному управлению и сложному устройству казна Висбю всегда полна. Свидетельством тому служат известняковые церкви, которых к началу XIV века в городе насчитывается уже около двух десятков. На целое поколение Висбю превратился в важнейшее торжище Балтики."
 tallinn_desc: "На крутой известняковой скале Тоомпеа, нависающей над Ревельской бухтой, стоит крепость, возведённая здесь в 1219 году датским королём Вальдемаром II. По легенде, именно на этом месте перед дрогнувшим королевским войском с небес опустился Данеброг — флаг Дании, предсказавший победу. Разросшийся вокруг замка город вскоре заселили немецкие купцы и ремесленники, установившие здесь со временем любекское право. Так в поселении появился ганзейский порт, соединивший балтийские торговые маршруты с речными путями, ведущими в Новгород. Под мягким управлением датской короны жители нижнего города богатеют на торговле сельдью и янтарём, а епископ и вассалы Тевтонского ордена ведут борьбу за влияние в залах и комнатах крепости. Двойственный характер города как немецкой купеческой республики и одновременно — владения датской короны придаёт его жителям невиданную в других поселениях Восточной Балтики силу."
 riga_desc: "В 1201 году епископ Альберт фон Буксгевден основал крепость Ригу — резиденцию, из которой было удобно вести крестовый поход против языческих племён ливов и латгалов, обитавших в лесах за Даугавой. С благословения папы Альберт учредил духовно-рыцарский орден братьев меча, покоривший язычников за полвека кровопролитных походов. Новое поселение стремительно разрослось и превратилось из резиденции епископа в один из важнейших портов Ганзы в восточной части Балтики. Отходящие от её пристаней немецкие когги везут русские меха, воск и янтарь в Любек и другие города. Рижские же купцы — участники немецких гильдий основали торговые поселения выше по реке, поближе к русским княжествам. Ещё не скоро Ригу покинет её характерный дух, складывающийся в борьбе между горожанами, архиепископом и Ливонским орденом."
 bergen_desc: "Между фьордами и горами на западном побережье Норвегии располагается Берген — город, основанный в 1070 году королём Олавом Тихим, важнейший город средневековой Норвегии и резиденция её королей. Из Брюггена выходят многочисленные корабли, гружёные вяленой рыбой с северных промыслов, а к концу XIII века у пристаней Бергена начали массово селиться ганзейские купцы. Здесь они основали #italic контору#!, благодаря которой обретают всё большее влияние над норвежскими поставками в другие державы. Берген — сердце политической и культурной жизни Норвегии, к началу столетия распростёршейся от Фарер до Гренландии: здесь коронуются её владыки, пишутся саги и сходятся между собой в горячих спорах корона, церковь и заграничные купцы."
 hamburg_desc: "В IX столетии Карл Великий и его преемники воздвигли на Эльбе крепость, чтобы облегчить борьбу с язычниками-саксами и обращение их в христианскую веру. Со временем Гамбург стал резиденцией архиепископа, стремящегося распространить христианство на север, в Скандинавию. Город неоднократно разоряли викинги и славяне, в том числе войска польского короля Болеслава I, однако каждый раз его восстанавливали. В 1189 году Фридрих Барбаросса пожаловал ему имперские торговые привилегии, в том числе освободил купцов от торговых пошлин. Так началась новая — торговая — страница в истории Гамбурга. К XIII веку союз Гамбурга и Любека, объединившихся для борьбы с балтийскими пиратами, окреп достаточно, чтобы стать основой для создания Ганзы, а благодаря труду местных пивоваров, канатчиков и купцов город стал важнейшим торговым пунктом Северной Германии."
 kyiv_desc: "Под властью призванных на Русь варягов Киев к IX веку стал столицей славянско-скандинавского союза, сложившегося в Среднеднепровье. При князьях Владимире Святославиче и Ярославе Мудром в XI веке Киев стал одним из богатейших и великолепнейших городов Восточной Европы, неизменно поражавшим путников видом собора Святой Софии и Золотых ворот; городом, чьи купцы одинаково охотно торговали как с Царьградом, так и с Балтикой. Раздробленность на Руси привела к постепенному ослаблению Киева, а в 1240 году войска хана Батыя разорили город, едва не стерев его с лица земли; улицы его поросли травой, а земля была усеяна черепами. После разорения, в ордынский период, началось постепенное восстановление Киева, а к 20-м годам XIV века он перешёл в сферу влияния Великого княжества Литовского. Старые традиции Рюриковичей оказались бессильны перед лицом нового политического уклада."
 pskov_desc: "Псков, расположенный на скалистом берегу у слияния рек Великой и Псковы, с древнейших времён связан с Новгородом, приходясь ему городом-собратом. Как и Новгород, он сохранил традицию #italic вече#! — собрания, на котором вольный люд обсуждает и решает государственные дела. В 1136 году Псков начал постепенно отстаивать независимость от Новгорода, а с XIII века его ополчение под предводительством таких князей, как литовский изгнанник Довмонт, стойко обороняет западные рубежи русских земель от непрестанного натиска Тевтонского ордена. Благодаря своему удалённому расположению Псков сумел избежать разорения и сожжения монголами и со временем превратился в процветающую республику купцов и воителей. Его величественный каменный кремль и многочисленные храмы, построенные на средства купцов, свидетельствуют о необычайно сильном для своего времени духе гражданской самостоятельности, не имеющем себе равных среди других русских городов."
 avignon_desc: "На огромной скале над Роной, у естественной переправы между Провансом и Лангедоком, расположен Авиньон — некогда римская колония, а впоследствии графская резиденция. В 1309 году судьба города изменилась навсегда: папа Климент V, не имея возможности безопасно вернуться в Рим и стремясь заручиться поддержкой французской короны, перенёс в Авиньон свой двор. Его преемники заложили в городе огромный папский дворец (строительство его идёт до сих пор), превратив Авиньон в латинскую столицу христианского мира. Вокруг дворца появились кардинальские дворцы, посольства европейских держав, скриптории и меняльные лавки. Население Авиньона стремительно растёт: за прошедшие годы оно удвоилось, а затем удвоилось вновь, как и подобает городу — столице вселенской церкви."
 toledo_desc: "Толедо, расположенный на подковообразном выступе над рекой Тахо, служил столицей вестготским королям, пока в 711 году его не завоевали мусульмане. При маврах он сохранил статус одного из главных городов Аль-Андалуса. На узких улочках Толедо ютятся друг рядом с другом синагоги, церкви и мечети — все религии здесь мирно сосуществуют друг с другом. В 1085 году город отвоевал король Леона и Кастилии Альфонсо VI. Ставший столицей Кастильского королевства Толедо сохранил богатую интеллектуальную традицию: здесь сливались воедино латинская, арабская и иудейская мудрость. В XIII веке Альфонсо X по прозвищу Мудрый учредил в городе школу переводчиков, действующую под покровительством архиепископа Раймунда. Благодаря ей Толедо стал вратами, через которые на латинский Запад проникала греческая и арабская философская, научная и медицинская мысль, оказавшая значительное влияние на мысль европейскую."
 granada_desc: "В 1230 году, когда христиане огнём и мечом отвоёвывали земли Аль-Андалуса, а могущество Альмохадов переживало последние дни, Мухаммад ибн аль-Ахмар основал в Сьерра-Неваде новый эмират — последний оплот мусульман в Иберии. При основанной им династии Насридов Гранадский эмират стал данником Кастилии, сумев при этом сохранить великое наследие Аль-Андалуса. Гранада — трудная добыча: её защищают горы и плодородная #italic вега#! — зеленеющий оазис. На холме Сабика, возвышающемся над городом, насридские султаны начали возводить дворец-крепость Альгамбру, чьи дворы и покои уже сегодня можно считать выдающимся архитектурным достижением андалузской цивилизации."
 dublin_desc: "Там, где река Лиффи впадает в море, в IX веке викинги основали поселение #italic Дублин#!; ирландцы же называли его Дув-Линнь — «чёрная заводь». Здесь захватчики построили укреплённый лагерь-порт — лонгфорт. Со временем Дублин превратился в главный гэльско-скандинавский город Ирландии. Его купцы торговали рабами, шкурами и серебром по обе стороны Ирландского моря, а короли не раз вступали в борьбу с верховными королями Ирландии, пока в 1014 году не потерпели окончательное поражение от войск Бриана Бору при Клонтарфе. В 1170 году англонормандский граф Стронгбоу вторгнулся в Ирландию, намереваясь установить здесь английское господство, а Генрих II впоследствии закрепил английскую власть над городом. Дублин стал столицей манора Ирландия. Стены города были расширены, внутри — возведены новые соборы, а система управления на основе английского права постепенно начала распространяться на весь Пейл — английскую часть державы."
 antwerp_desc: "Маркграфство Антверпен, расположенное у огромного приливного эстуария реки Шельды, с X века служит Священной Римской Империи укреплённой заставой: замок Стен надёжно стережёт речную переправу от набегов викингов. В XII — XIII веках, под властью герцогов Брабантских, город резко вырос и превратился в достойного соперника фламандских городов Брюгге и Гента. В 1296 году здесь была учреждена ганзейская #italic контора#! — свидетельство превращения Антверпена в важный порт на североевропейских торговых путях. К началу XIV века Антверпен всё ещё находится в тени Брюгге, однако капитаны итальянских галер и иберийских каракк уже по достоинству оценили его более глубокую гавань и удобный выход в море. Сегодня порт на Шельде вступает в эпоху расцвета."
 lyon_desc: "Расположенный у слияния Роны и Соны город Лион, в прошлом — римская колония #italic Лугдунум#!, некогда был столицей трёх Галлий. Здесь же находился императорский монетный двор, чеканивший серебряную монету для всей империи. После падения Рима в Лионе была учреждена кафедра архиепископа, претендовавшего на первенство среди всех галльских епархий, а в Средние века город, раскинувшийся на двух реках, стал одним из важнейших перекрёстков Западной Европы. До 1312 года Лион входил в состав Священной Римской Империи, а впоследствии перешёл под непосредственную власть французской короны. К тому времени он уже обзавёлся славой города ярмарок, где купцы из Италии, Нидерландов и Средиземноморья торговали шёлком, пряностями и серебром."
 york_desc: "Йорк, в прошлом — крепость легионеров #italic Эборакум#!, возведённая в 71 году н. э., со временем стал столицей римской провинции Британия. В 306 году император Константин I был провозглашён здесь августом. После падения Рима город несколько столетий служил столицей англосаксонской Нортумбрии; здесь же жил и трудился великий христианский учёный Алкуин. В 866 году Йорк захватила Великая языческая армия, переименовавшая его в #italic Йорвик#! — столицу королевства викингов, чьи купцы торговали даже с Самаркандом. После норманнского завоевания здесь были воздвигнуты величественный собор и два замка. В Средние века Йорк остаётся резиденцией архиепископа, состязающегося за первенство с Кентербери, и вторым по величине, богатству и древности городом Англии."
 canterbury_desc: "В 597 году римский монах Августин прибыл в Кент, чтобы обратить англосаксов в христианство. Он учредил в Кентербери свою резиденцию; здесь же появилась первая архиепископская кафедра Церкви Англии, сохраняющая свой статус и поныне. Основанный Августином собор неоднократно перестраивался. Наиболее трагическая страница в его истории — убийство архиепископа Томаса Бекета в 1170 году, совершённое людьми короля на ступенях собора. Это святотатственное преступление превратило Кентербери в один из важнейших центров паломничества средневекового христианского мира. По дороге из Лондона в Кентербери днём и ночью идут паломники, желающие припасть к мощам Бекета, поэтому благосостояние города во многом обеспечивают постоялые дворы, где путники могут найти кров и пищу, а также — торговцы безделушками, которые паломники увозят с собой на память."
 edinburgh_desc: "На вздымающемся над окрестностями вулканическом утёсе, прозванном Замковой скалой, с древних времён стоит крепость Эдинбург; древние бритты называли её #italic Дин-Эйдин#!. В начале XII века при короле Давиде I выросший вокруг крепости город Эдинбург стал главным королевским городом Шотландии. У подножья скалы король основал Холирудское аббатство, а городу даровал привилегии, привлёкшие на его рынки фламандских и английских купцов. В годы Войн за независимость на рубеже XIII — XIV веков замок неоднократно переходил из рук в руки: здесь стояли то шотландские, то английские гарнизоны. В 1314 году Томас Рэндольф совершил дерзкий налёт, отбив крепость и вернув её в руки Роберта Брюса. Этим подвигом он навсегда вписал себя в страницы шотландской истории."
 kilwa_kisiwani_desc: "На коралловом острове у побережья Восточной Африки в XI веке возникло суахильское поселение Килва-Кисивани, основанное переселенцами-ширази. В XIII — начале XIV столетия оно превратилось в богатейший город-государство Суахильского побережья. При установившейся в 1277 году династии Махдали султаны Килвы взяли под контроль торговые пути, по которым золото из Великого Зимбабве поступало в южный порт Софала. На эти богатства они воздвигли величественный коралловый дворец #italic Хусуни Кубва#! с восьмиугольным бассейном и уступчатым двором — крупнейшее из всех сооружений Чёрной Африки, построенных до современной эпохи. Посетивший город в 1331 году путешественник Ибн Баттута назвал Килву-Кисивани одним из красивейших и самых благоустроенных городов, которые ему доводилось видеть за годы странствий."
 mogadishu_desc: "В X веке на северной оконечности Суахильского побережья арабские и персидские переселенцы, породнившиеся с сомалийскими народами берега Банадира, основали Могадишо — город, к XII столетию превратившийся в процветающее исламское поселение с каменными домами, мечетями и прибрежными складами. Его ткачи производят знаменитую ткань #italic макдишави#!, которую затем вывозят через Индийский океан в Египет и Индию, а местные купцы уже ведут торговлю по всему западному Индийскому океану. Побывавший здесь в 1331 году Ибн Баттута увидел город в эпоху расцвета: при султане Абу Бакре ибн Сайиде Умаре, правителе берберского происхождения, в мечети на пятничную молитву собираются многочисленные купцы, правоведы и суфийские мистики со всех уголков исламского мира."
 mombasa_desc: "Момбаса, расположенная на коралловом острове у побережья Восточной Африки, ещё с XII века — один из важнейших суахильских портов. Географ аль-Идриси описывал поселение как крупный мусульманский город, в котором нередко бросают якорь торговые суда, прибывающие из западной части Индийского океана. Под властью султанов-ширази город стал одним из важнейших торговых центров Суахильского побережья, уступая лишь Килве — самому могущественному из всех городов-государств, протянувшихся на юге длинной цепочкой. В гавань Момбасы заходят арабские дау, прибывающие с севера, и индийские флотилии, направляющиеся затем дальше, к Островам пряностей. Окаймлённая мангровыми зарослями гавань и коралловые мечети — яркий символ суахильской цивилизации, в которой слились африканские, арабские и персидские традиции, создавшие самобытную культуру края муссонов."
 sofala_desc: "На южной оконечности Суахильского побережья, там, где Замбези выходит к Индийскому океану, стоит Софала — великие врата, через которые с X века вывозится золото из глубин Африки. Из Великого Зимбабве золото длинными караванными путями везут в Софалу — там драгоценный металл меняют на китайские шелка, персидскую керамику и индийский хлопок; их ежегодно привозят идущие под муссонами дау из Килвы и других городов. В X веке Софалу посетил арабский географ аль-Масуди, а под властью султанов из династии Махдали — правителей Килвы, город превратился в заставу могущественной северосуахильской державы. Процветание его целиком зависит от торговли золотом и наступления сезона муссонов."
 gao_desc: "На северо-восточной излучине великой реки Нигер стоит Гао — столица королевства Сонгай как минимум с VIII века. Его правители, принявшие ислам, начали торговать с Северной Африкой ещё задолго до возвышения Мали. В начале XIV века победоносные войска мансы Мусы покорили Гао и включили его в состав Малийской империи, превратив город в один из важнейших данников великого правителя. Однако Гао не утратил своего значения: по Нигеру по-прежнему скользят дау, поставляющие на рынки Тимбукту соль из Сахары и золото из южных лесов. Под властью Мали сонгайский царский дом сохраняет своё положение, а мечети и торговые кварталы города предвещают грядущее возрождение сонгайской державы."
 djenne_desc: "На просторах внутренней дельты Нигера расположено крупное поселение Дженне, заложенное ещё до Христа и соседствующее с Дженне-Дженно — одной из древнейших городских цивилизаций Чёрной Африки. К концу XIII века при короле Конборо город обратился в ислам, и сегодня в центре процветающего поселения на дельте, собрата Тимбукту по торговле через Сахару, возвышается величественная пятничная мечеть из самана. Купцы Дженне обменивают золото с месторождений Бамбука и Буре и собранный на дельте хлопок на привозимую из пустыни соль. Архитектура города с постройками из #italic банко#!, выступающими деревянными балками и земляными башнями, стала главным символом сахельского Судана."
 great_zimbabwe_desc: "К югу от Замбези, на высоком гранитном плато над рекой Саби, народы шона в XI — XII веках возвели удивительный город, сложенный из камня без единой капли раствора. Его изогнутые стены и конусообразная башня дали название всему царству: #italic дзимба дзембабве#! — «каменные дома». К XIV веку Великий Зимбабве переживает свой расцвет: город раскинулся на сотнях гектаров и насчитывает до 18 тысяч жителей, а его правители контролируют торговлю золотом, которое по речным и сухопутным путям поступает в Софалу на Суахильском побережье, а оттуда — в Килву и дальше в страны Индийского океана. На местных рынках продаются резные фигурки птиц из мыльного камня, китайский фарфор и бусы из Персии и Индии — свидетельства обширных торговых связей цивилизации, о существовании которой в Европе даже не подозревают."
 kano_desc: "Согласно преданию хауса, город Кано, раскинувшийся на саванне к югу от великих дюн Сахары, основали потомки легендарного героя Баяджидды — победителя змея, охранявшего колодец, и прародителя царей семи городов-государств хауса, самым могущественным из которых к XIV веку стал именно Кано. Город раскинулся у скалистого холма Дала, который считается местом зарождения государства, а его красильные ямы, расположенные за глинобитными стенами, привлекают караваны, приходящие из Сахары с солью и медью. В обмен они увозят ткани, окрашенные индиго, и кожаные изделия, которыми славятся местные мастера. Цари Кано по-прежнему правят, следуя обрядам древней религии хауса, однако по торговым путям через Сахару в государство уже начинают проникать первые исламские проповедники и купцы."
 axum_desc: "Аксум — один из древнейших городов Африки, с I века — процветающая столица Аксумского царства. Через порт Адулис на Красном море его купцы торговали с Римом и Индией, а в IV веке при царе Эзане христианство стало государственной религией — Аксум оказался первым государством Чёрной Африки, принявшим новую веру. Огромные гранитные стелы, возведённые зодчими Аксума над царскими гробницами, и сегодня возвышаются над руинами города. Самая высокая из них весит около пятисот тонн; на её гранях высечено подобие многоэтажного дворца. К XIV веку центр политической власти переместился на юг: в 1270 году Йэкуно Амлак возродил Соломонову династию, положив начало новой эпохе в истории Эфиопии. Но Аксум сохранил значение духовной столицы эфиопского христианства. Здесь по-прежнему коронуют эфиопских императоров, а в церкви Марии Сионской, согласно преданию, хранится величайшая святыня — Ковчег Завета."
 mayapan_desc: "Майяпан, возведённый в конце XIII века за мощной оборонительной стеной на сухих равнинах северного Юкатана, стал преемником древней столицы майя — Чичен-Ицы. Согласно хроникам майя, город основал род Коком, считавший себя потомками правителей прежней столицы. Здесь Кокомы возглавили союз местных владык со всего Юкатана. Чтобы сохранить верность союзников, главам подвластных родов предписывается жить в столице под неусыпным надзором правителя. Многочисленные, хотя и более скромные копии храмов Чичен-Ицы свидетельствуют о том, что жители Майяпана искренне считают себя наследниками более древней и величественной цивилизации. Впрочем, главное достижение Майяпана — политическое: его правителям удалось объединить разрозненных владык Юкатана в единую конфедерацию."
 chan_chan_desc: "На пустынном побережье северного Перу, у крутого обрыва Анд, спускающихся к Тихому океану, в месте, где годами не выпадает ни капли дождя, в XII — XIV веках цари чиму возвели огромный город Чан-Чан — крупнейший город доколумбовой Южной Америки. За его стенами зодчие одну за другой возводили величественные царские #italic сьюдаделы#! — обособленные дворцовые комплексы, каждый из которых строился для одного правителя и после его смерти навсегда оказывался закрыт. Выложенные из самана стены дворцов украшают повторяющиеся рельефы с изображениями волн и морских птиц, отсылающие к морскому происхождению народа чиму. Из этой столицы правители Чимора управляют крупнейшей прибрежной державой, когда-либо существовавшей в Андах: на тысячу километров вдоль побережья простираются общины земледельцев, рыболовов и металлургов — данников величественного пустынного города."
 cholollan_desc: "У подножия вулкана Попокатепетль, на великом Мексиканском нагорье, стоит город Чолольян. Здесь возвышается удивительная пирамида #italic Тлачиуальтепетль#! — «рукотворная гора», крупнейшее архитектурное сооружение доколумбовой Америки. Её строительство началось ещё за несколько столетий до нашей эры, а впоследствии тольтеки и другие народы неоднократно расширяли и перестраивали пирамиду. На её огромном основании до сих пор стоит храм пернатого змея Кецалькоатля — великого божества, которому посвящён Чолольян. Город не раз менял своих владык: от тольтеков он перешёл к ольмекам-шикаланкам, а затем к тольтекам-чичимекам, но и при новых правителях сохранил значение главной святыни центрального нагорья. Сюда по-прежнему приходят правители окрестных земель, желающие, чтобы жрецы Кетцалькоатля утвердили их право на власть."
 qusqu_desc: "В высокогорной долине Анд, в самом сердце края, который местные народы называют четырьмя сторонами света, стоит небольшой город Куско, в древности — #italic Куску#!, «пуп земли». Согласно преданию, его основал Манко Капак, вышедший вместе с сестрой, которая одновременно была его женой, из вод озера Титикака и водрузивший золотой жезл на месте будущего города. В XIII — начале XIV века Куско — скромная столица небольшого владения, соперничающего с соседями — чанками, кечуа и айярмаками — за господство в южных Андах. Его правители, которым ещё только предстоит принять титул #italic Сапа Инки#!, собирают вокруг себя союзников и воинов, чтобы следующее поколение их династии смогло осуществить куда более грандиозные замыслы и подчинить своей власти весь юг Анд."
 roskilde_desc: "В глубине фьорда на северном побережье Зеландии расположен Роскилле — город, который в X столетии стал резиденцией королей династии Кнютлингов, объединивших Данию. Первую каменную церковь здесь, согласно преданию, возвёл сам Харальд Синезубый, здесь же он и был похоронен. В XII — XIII столетиях Роскилле, где расположились королевская усыпальница и кафедра влиятельного епископа, превратился в важнейший город Датского королевства. Над городом возвысился величественный собор из красного кирпича — один из ранних памятников кирпичной готики в Северной Европе. К началу XIV столетия торговля постепенно начала перемещаться к порту Копенгагена на Зунде, однако Роскилле по-прежнему остаётся духовным сердцем Дании — местом, где уже более трёх столетий коронуют и хоронят её королей."
 kobenhavn_desc: "На восточном побережье Зеландии, напротив Сконе, у узкого пролива Зунд когда-то стояла небольшая рыбацкая деревушка #italic Хавн#!. Король Вальдемар I пожаловал её своему сводному брату епископу Абсалону, который около 1167 года возвёл на острове Слотсхольмен укреплённый замок для защиты от венедских пиратов, промышлявших на Балтике. При преемниках Абсалона крепость постепенно разрослась в купеческий город #italic Кёбманнсхавн#! — «купеческую гавань», контролирующий богатые сельдяные промыслы Зунда; каждое лето сюда сходятся огромные косяки рыбы. За обладание городом ожесточённо борются датские короли и архиепископы Роскилле, однако наибольшую выгоду он приносит купцам: благодаря удачному расположению на Зунде сюда всё чаще приходят торговые суда с Балтики."
 lund_desc: "В конце X столетия Свен Вилобородый основал в самом сердце своих владений в Сконе город Лунд. В 1103 году значение города резко возросло: папа Пасхалий II объявил его кафедрой архиепископа всей Скандинавии, тем самым отделив северные церкви от престола Гамбурга-Бремена. При архиепископе Ассере началось строительство величественного романского собора, освящённого в 1145 году и возвышающегося над городом и поныне. В его крипте находятся знаменитые астрономические часы и скульптура великана Финтролля. В 1152 году статус архиепархии получил Нидарос, а в 1164 году — Уппсала, однако даже несмотря на это, Лунд сохранил первенство над Датской церковью и Сконе, а его архиепископ и сегодня считается одним из самых влиятельных сановников державы."
 oslo_desc: "Согласно преданию, Осло около 1049 года основал король Харальд Суровый. Местом заложения города стал великий фьорд, давший поселению его название. В 1070 году здесь была учреждена епископская кафедра, и в последующие столетия Осло превратился в один из главных городов Норвежского королевства. В 1299 году король Хакон V Магнуссон сделал его своей столицей. Королевский двор переместился из Бергена ближе к политическому центру Скандинавии. Около 1300 года началось строительство могучей крепости Акерсхус — символа королевской власти, грозно возвышающегося над гаванью. Между скалой, где стоит Акерсхус, и епископским кварталом ютятся деревянные улицы города. Местные купцы торгуют древесиной и шкурами из внутренних областей Норвегии, обменивая их на зерно и ткани с Балтики."
 nidaros_desc: "На берегу Нидэльвы, там, где река впадает в огромный фьорд Трёнделаг (он же Тронхеймс-фьорд), около 997 года король Олаф Трюггвасон основал Нидарос. Город стал местом погребения его преемника — короля Олафа Харальдссона, христианина, погибшего в битве при Стикластадире в 1030 году и вскоре после смерти причисленного к лику мучеников. Над его гробницей возвели величественный собор, ставший главной святыней северного мира. Сюда стекаются паломники из Исландии, Гренландии и с Британских островов, а в 1152 году Нидарос получил статус архиепископской кафедры церковной провинции, простирающейся от сердца Норвегии до её колоний в западных морях. Даже после того, как королевская столица переместилась сначала на юг, в Берген, а затем в Осло, Нидарос остаётся духовным сердцем державы. Здесь коронуют её королей, а святой Олаф по-прежнему считается покровителем королевства."
 abo_desc: "В 40-х годах XIII века, после того, как шведские крестоносцы покорили язычников-финнов, в устье реки Аура был заложен Або (по-фински #italic Турку#!). Со временем город стал главным опорным пунктом Швеции на юго-западном побережье Финляндии. В 1300 году здесь была учреждена епископская кафедра, а недавно освящённый собор стал духовным сердцем Финской церкви. Благодаря балтийским купцам, облюбовавшим городские причалы, внутренние районы Финляндии оказались связаны ниточками торговых путей со Стокгольмом и ганзейскими городами. Хотя Або всё ещё уступает по значению великим ганзейским портам южной Балтики, он уже играет немаловажную роль административной и церковной столицы шведских владений в Финляндии, а его епископ входит в число наиболее влиятельных прелатов Шведской церкви."
 kalmar_desc: "На юго-восточном побережье Швеции, там, где сужается пролив между материком и длинным островом Эланд, в XII веке вырос Кальмар — могучий каменный замок, одна из древнейших и самых неприступных королевских крепостей Швеции, давшая название появившемуся под её стенами городу. Его гавань стала главным южным торговым портом королевства: отсюда железо, медь и масло отправляются в ганзейские города, такие как Любек, и даже за их пределы. В 1276 году король Магнус Ладулос пожаловал Кальмару привилегии, подтвердив его положение среди важнейших городов королевства. К началу XIV века стратегическое расположение Кальмара на шведско-датской границе и мощные городские укрепления сделали его одновременно важнейшим торговым портом и ключевым бастионом на южной границе шведского королевства, призванным сдерживать притязания Дании."
 falun_desc: "На склонах огромной красной горы Тискашёбергет в Даларне расположены медные рудники #italic Стура-Коппарберг#! — крупнейшее и наиболее разрабатываемое месторождение меди в средневековой Европе, известное шведам по меньшей мере с IX века. В 1288 году король Магнус III официально пожаловал привилегии горнодобывающему обществу #italic Stora Kopparbergs Bergslag#!, в ведении которого находятся рудники, — одному из древнейших совместных коммерческих предприятий в мире. У озера под рудниками, вокруг огромного карьера раскинулся посёлок горняков Фалун. Дым от плавилен и красная пыль от окислов окрасили почву и дома на многие километры вокруг, а выплавляемая здесь медь поступает не только в закрома Шведского королевства, но и на рынки Северной Европы."
 uppsala_desc: "В нескольких километрах от скромного города, в отдалении от соборной площади, стоит Старая Уппсала — некогда сердце шведского язычества. Здесь, по описанию Адама Бременского, находился великий убранный золотом храм, где каждые девять лет людей и животных приносили в жертву Тору, Одину и Фрейру. Над равниной и сегодня возвышаются королевские курганы, в которых захоронены конунги из рода Инглингов. После обращения Швеции в христианство языческое святилище оказалось заброшено. В 1164 году папа Александр III учредил в Уппсале кафедру архиепископа всей Швеции, после чего Шведская церковь стала независимой от господствовавшего над Данией Лунда. В 1287 году кафедру перенесли на несколько километров южнее, в новый город Эстра-Арос, где началось строительство огромного собора в стиле кирпичной готики. Предполагается, что он станет крупнейшим собором Скандинавии, а у его алтаря главные прелаты державы будут короновать правителей Швеции."
 skara_desc: "На равнинах Вестергётланда, между великими озёрами Венерн и Веттерн, в 1014 году король Олаф Шётконунг основал первую в Швеции кафедру епископа. Первым же прелатом, занявшим эту должность, стал немецкий миссионер Тургот. Из этого скромного города христианская вера распространилась на остальную часть Швеции, тогда во многом ещё исповедовавшей язычество, а освящённый в 1150 году при епископе Бенгте Добром величественный романский собор на долгие века утвердил Скару как духовное сердце Вестергётланда. Хотя со временем по своему влиянию Скара уступила Уппсале и Линчёпингу, её епископ и поныне считается одним из влиятельнейших прелатов шведской державы. Его кафедральный капитул и #italic «Хроники Скары»#! (Skarakroniken) до сих пор хранят память о первых веках после крещения страны."
 linkoping_desc: "На равнине Эстергётланда, там, где дорогу, ведущую из Стокгольма к южным королевствам, пересекает река Стонг, стоит Линчёпинг. В начале XII века здесь была учреждена кафедра епископа, и с тех пор город остаётся одним из важнейших церковных владений шведской державы. В XII веке в Линчёпинге началось строительство величественного собора из светло-серого известняка, продолжающееся и поныне. Со временем он расширился и превратился в одно из самых грандиозных готических сооружений в Швеции. Епископ Линчёпинга же по своему влиянию среди всех прелатов королевства уступает только архиепископу Уппсалы. В расположенном неподалёку Шеннинге в 1248 году состоялся великий собор, созванный папским легатом Вильгельмом Моденским (Сабинским). На нём шведскому духовенству было предписано соблюдать безбрачие; это решение окончательно переместило церковь Швеции в сферу влияния латинских христианских традиций."
 soderkoping_desc: "На месте, где река Сторо впадает в Балтийское море, у закрытого рукава реки расположен город Сёдерчёпинг. В XII — XIII столетиях он стал одним из важнейших портов Шведского королевства. К его причалам пристают многочисленные коги из Любека и Висбю, перевозящие железо и медь из внутренних областей Швеции на южные рынки. Королевский торговый город Сёдерчёпинг со временем обзавёлся значительной немецкой общиной, установившей здесь порядки, восходящие к любекскому праву. В городе проходят коронации, подписываются договоры и проводятся грандиозные ярмарки, куда каждое лето съезжаются купцы со всей Балтики. Хотя состояние его гавани внушает опасения — водные пути постепенно заносит илом — к началу XIV века Сёдерчёпинг всё ещё остаётся одним из важнейших торговых городов на восточном побережье Швеции."
 lodose_desc: "Там, где выходящая из озера Венерн река Гёта-Эльв изгибается по направлению к морю, расположен Лёдёсе — единственный выход Швеции к Атлантике и торговым путям Северного моря. Деревянный речной порт теснится на узкой полосе земли между водой и крутыми западными склонами. От его причалов шведские суда отправляются в Норвегию, Англию и города Нидерландов — там купцы обменивают железо и шкуры на западные ткани и вина. Здесь же по меньшей мере с XII века работает королевский монетный двор, чеканящий монету для шведских владык. Вопрос о принадлежности Лёдёсё уже много столетий остаётся предметом дипломатических споров: за власть над ним соперничают Дания, Норвегия и шведские земли, расположенные по нижнему течению реки. Стратегическая ценность города огромна: нигде больше в Швеции нет столь удобного выхода к Атлантике."
 jonkoping_desc: "На южной оконечности огромного озера Веттерн, там, где пролегает естественный путь между нагорьями Смоланда и равнинами Эстергётланда, расположен Йёнчёпинг. В 1284 году король Магнус Ладулос даровал ему городские привилегии и хартию, лишь закрепившую за городом его уже давно сложившееся положение важного перекрёстка путей между северными и южными королевствами — места для встреч и торговли. Выгодное расположение на главной дороге между центральными провинциями Швеции и границей с принадлежащей Дании Сконе сделало Йёнчёпинг одновременно оживлённым торговым городом и пограничной крепостью. Королевские архитекторы без устали укрепляют возвышающийся над гаванью королевский замок — главный оплот против постоянных поползновений Дании сдвинуть границу к северу. На начало XIV века Йёнчёпинг — важнейший опорный пункт, политический и географический ключ к пути, ведущему из Смоланда в сердце шведской державы."
 ribe_desc: "Рибе, основанный викингами около 700 года как торговое поселение на болотистом западном берегу Ютландии, где приливы позволяли вытаскивать корабли на берег, — древнейший город Скандинавии. Его купцы торговали с побережьем Фризии и Англии ещё более чем за столетие до того, как викинги достигли Британских островов. Адам Бременский называл Рибе главным рынком Дании, а в начале IX века здесь миссионер Ансгар основал церковь. Город стал одним из первых оплотов христианства на севере Скандинавии. В XII веке здесь началось строительство величественного романского собора. Материалом для него стал туф, привозимый из Рейнской области. Он и сегодня возвышается над городом, купцы которого продолжают торговать с фризскими и фламандскими портами через Северное море: соль и зерно с западного берега Дании они обменивают на южные ткани и вина."
 viborg_desc: "На центральном плато Ютландии, среди обширных вересковых пустошей и озёр, расположен Виборг — город, где с языческих времён проводится #italic ландстинг#!, то есть собрание, на котором вожди с полуострова обсуждают законы и провозглашают королей. Эта традиция не прервалась даже в Средневековье: новые короли Дании сначала принимают провозглашение в Виборге, а затем отправляются на юг, в Лунд, где архиепископ проводит церемонию коронации. В городе сосредоточена необычайная политическая и церковная власть, и свидетельством этому — два величественных собора: епископский собор и старая королевская церковь. Хотя значение Виборга для державы уменьшилось с возвышением Копенгагена и смещением центра датской власти на восток, символическое верховенство его #italic ландстинга#! по-прежнему играет немаловажную роль в возведении на престол новых королей."
 odense_desc: "В самом сердце острова Фюн расположен Оденсе — город, чьё название восходит к имени скандинавского бога Одина, которому местные язычники поклонялись задолго до крещения державы. В 1086 году взбунтовавшиеся дворяне убили короля Кнуда Святого у алтаря церкви Святого Альбана, отказавшись выплачивать десятину и сборы на крестовый поход. С тех пор город преобразился: вокруг короля стремительно образовался культ, а в 1101 году папа римский канонизировал убитого. Оденсе превратился в одну из главных святынь для скандинавских паломников. Монастырь бенедиктинцев, основанный английскими монахами из Ившема для захоронения мощей святого, превратил город в оплот учёности, и к началу XIV века Оденсе стал важнейшим датским поселением на островах к западу от Зеландии."
 aarhus_desc: "Орхус — поселение эпохи викингов, основанное на восточном берегу Ютландии, там, где река Орхус впадает в Каттегат. Первое упоминание о нём относится к 948 году: Орхус упомянут в числе четырёх датских епископств, учреждённых под влиянием немецких миссионеров вскоре после крещения Харальда Синезубого. Благодаря расположению в укрытой бухте Орхус — город купцов и рыбаков, над которым возвышается величественный кирпичный собор XIII века, — в Средневековье стал важнейшим портом восточной Ютландии: отсюда скот и зерно с ютландских равнин отправляются на рынки Любека и Гамбурга. По политическому значению он давно уступает Виборгу, а по торговому — Рибе, однако на начало XIV века Орхус всё так же остаётся главным портом Ютландии на побережье Каттегата."
 aalborg_desc: "На южном берегу Лим-фьорда, там, где этот величественный пролив пересекает Северную Ютландию, соединяя Северное море с Каттегатом, стоит Ольборг. Здесь по меньшей мере с XI века главную переправу через фьорд и торговые пути между двумя морями охраняет королевская крепость Ольборгхус — первоначально простое деревянное укрепление. Богатые сельдяные промыслы Лим-фьорда принесли городу достаток, а его купцам — возможность вести оживлённую торговлю с ганзейским городом Любеком и венедскими портами. На начало XIV века Ольборг — один из главных городов Северной Дании: здесь действуют королевские привилегии, растёт сословие горожан, а над улицами поднимаются строгие кирпичные церкви. Но главное богатство города — его стратегически выгодное положение: кто владеет Ольборгом, тот владеет важнейшим проливом Ютландии."
 tonsberg_desc: "Согласно сагам Снорри Стурлусона, Тёнсберг был основан ещё до великой битвы при Хафрс-фьорде, после которой в 872 году Харальд Прекрасноволосый объединил Норвегию. Город, претендующий на звание древнейшего в стране, вырос вокруг укромной бухты на берегу Осло-фьорда, куда в IX — X столетиях заходили как драккары викингов, так и королевские корабли. На возвышенности над гаванью стоит крепость Тунсбергхус — один из важнейших королевских замков средневековой Норвегии, а благодаря основанному здесь в конце XII столетия аббатству премонстрантов Олавсклостер город стал подлинным средоточием знаний. Мало какой город столь же важен для норвежского народа, как Тёнсберг: здесь заключались договора между норвежскими королями и претендентами на престол, чеканилась королевская монета, а во времена междоусобных войн и крестовых походов собирались войска. По значимости город уступает лишь Бергену, Нидаросу и Осло."
 stavanger_desc: "В укромной бухте на юго-западном побережье Норвегии, там, где великие фьорды Рюфюльке выходят к Северному морю, расположен город Ставангер. В 1125 году король Сигурд Крестоносец учредил здесь епископскую кафедру. Для этого он пригласил английского епископа Рейнальда Винчестерского, принесшего с собой традиции англо-нормандской церковной архитектуры. Заложенный им романский собор — один из самых ярких памятников английского влияния на церковное зодчество Скандинавии — и поныне возвышается над гаванью. После того как здесь была основана кафедра, Ставангер стал одним из важнейших церковных владений Норвежского королевства. Под властью его епископства находятся обширные земли, от Ругаланна до Агдера, хотя сама гавань так и осталась скромным рыбацким портом на западной окраине норвежской державы."
 hamar_desc: "На западном берегу озера Мьёса, в самом сердце Норвегии, расположен город Хамар. В 1152 году кардинал Николас Брейкспир — реформатор Норвежской церкви и будущий папа Адриан IV — учредил здесь епископскую кафедру, одновременно подготовив почву для создания архиепископства Нидароса. Вскоре на берегу озера началось строительство собора, который в XII — XIII веках превратился в один из самых величественных романских храмов Норвегии. Епископ Хамара, которому подчиняется обширная епархия, протянувшаяся от горных долин до поселений на берегах Мьёсы, входит в число влиятельнейших прелатов королевства. К началу XIV века этот скромный городок стал духовным сердцем всех норвежских провинций, средоточием церковной жизни обитателей приозёрных земель и восточных гор."
 vyborg_desc: "В 1293 году во время Третьего шведского крестового похода в Карелию маршал Торгильс Кнутссон приказал построить на острове у Карельского перешейка мощный каменный замок — самую восточную из всех шведских твердынь, главный рубеж обороны против новгородцев. На протяжении тридцати лет шведские наместники устраивали отсюда походы против карелов и русских, пока наконец в 1323 году по условиям Ореховского мира не была установлена официальная граница между Швецией и Новгородом. Теперь Выборг безраздельно принадлежал шведской короне. Со временем вокруг замка разрослось торговое поселение — здесь торгуют карельскими мехами, русским воском и финскими товарами. У Выборга нередко бросают якоря суда, ходящие по Балтике: с годами город превратился в важный порт."
 burgos_desc: "В 884 году граф Диего Родригес Порселос основал у слияния рек Арлансон и Вена город Бургос. На протяжение IX–X веков он служил основным оплотом, защищавшим Кастильское графство от набегов, а в 1037 году, при короле Фердинанде Великом, стал главным городом объединённого королевства Кастилия и Леон. Здесь родился испанский национальный герой Родриго Диас де Вивар по прозвищу Эль Сид — его останки покоятся в монастыре Сан-Педро-де-Карденья. Через Бургос также проходит #italic Camino Francés#! — Дорога французских королей, часть пути Святого Иакова — паломнической дороги к городу Сантьяго-де-Компостела. В 1187 году Альфонсо VIII построил в Бургосе усыпальницу кастильских королей — Лас-Уэльгас, а в 1221 году при короле Фердинанде III началось строительство величественного готического собора — одного из наиболее выдающихся архитектурных сооружений средневековой Испании."
 leon_desc: "Город Леон возник на месте римского лагеря, основанного легионерами из #italic Legio VII Gemina#!, откуда и произошло его название. В X столетии Леон стал столицей объединённого королевства Леон и Астурия. Отсюда волна Реконкисты двинулась на юг, через Кантабрию на плоскогорье Месета. Со временем город обрёл статус духовного и политического центра государства, соперничавшего с Кастилией за престиж и землю и порой даже превосходившего своего соперника. Величие Леона подчёркивал не только королевский дворец, но и Королевский пантеон — построенная в XI веке в базилике Сан-Исидоро усыпальница для монарших особ. После того как в 1230 году король Фердинанд III заключил унию с Кастилией, город утратил статус политического тяжеловеса (отныне таковыми считались Толедо и Вальядолид), но сохранил древнее королевское достоинство. Эту гордость и сегодня воплощает в себе величественный католический собор, построенный в 1205 году по примеру соборов на севере Франции."
 salamanca_desc: "Древний город Саламанка, расположенный в западной Месете, на каменистом утёсе над рекой Тормес, — изначально кельтиберское, а затем римское поселение. Христиане появились здесь лишь в 1085 году при короле Альфонсо VI, в ходе волны повторного освоения земель между Дуэро и Тахо. В 1218 году король Леона Альфонсо IX основал в городе #italic Studium Generale#! — «дом общего обучения», одно из важнейших учебных заведений христианского мира наряду с университетами в Болонье, Париже и Оксфорде. В 1255 году папа Александр IV присудил университету степень #italic licentia ubique docendi#!. К началу XIV века Саламанка стала подлинным средоточием интеллектуальной жизни Кастилии, чему немало поспособствовали усилия её уроженцев — выдающихся богословов и толкователей канонического права."
 segovia_desc: "Сеговия, расположившаяся у подножья хребта Сьерра-де-Гвадаррама, неизменно поражает путников видом гранитных арок древнеримского акведука, на протяжении более чем 1200 лет снабжающего жителей города водой из реки Фрио. Этот акведук — один из наиболее впечатляющих памятников античного зодчества: в его кладке нет ни капли скрепляющего раствора. В Средние века Сеговия, вновь наполнившаяся жизнью после завоевания королём Альфонсо VI Толедо в 1085 году, стала излюбленной резиденцией монархов. Здесь же расположился королевский монетный двор, а в местной крепости над рекой — Алькасаре — кастильские короли вершили правосудие и издавали указы. На рынках Фландрии нарасхват идёт шерсть из Сеговии — её дают мериносовые овцы, перегоняемые с эстремадурских зимних пастбищ на кастильские нагорья летом и обратно — с наступлением зимы."
 avila_desc: "На гранитном выступе у западной окраины Центральных Кордильер, открытая всем ветрам, расположилась Авила. Граф Раймунд Бургундский, по воле которого в 1090 году здесь вновь появились жители, немедленно приказал обнести город самыми крепкими и неприступными стенами во всей Иберии. Каменщики из Леона и Бургоса справились с этой задачей менее чем за 10 лет. Целых 88 полукруглых башен и девять ворот, воздвигнутых на каменистом основании, надёжно защищают город от набегов врагов с границ Кастилии, а местные церкви (в том числе и собор Святого Спасителя, чья абсида встроена в восточную часть стены) в полной мере удовлетворяют духовные стремления жителей. К началу XIV века стены Авилы нисколько не потеряли в прочности — это всё такой же символ заселения былых кастильских земель, надёжный и невозмутимый защитник Месеты."
 madrid_desc: "В конце IX века арабские завоеватели основали на северной границе своих владений заставу под названием #italic Майрит#! — «источник»; такое название отражало обилие источников воды, орошавших вересковые пустоши. В 1083 году застава без сопротивления перешла в руки короля Леона и Кастилии Альфонсо VI, завоевателя Толедо. В 1202 году Альфонсо VIII пожаловал Мадриду #italic фуэро#!; кроме того, сюда нередко наведывался королевский двор, полюбивший охоту в местных краях. В 1309 году король Фердинанд IV впервые созвал в Мадриде кастильские кортесы — это решение ознаменовало возросшую роль города в управлении государственными делами, пусть даже он и сегодня остаётся в тени величественного имперского Толедо."
 santiago_compostela_desc: "В начале IX века отшельник Пелайо, следуя за путеводной звездой над дубовой рощей в холмах Галисии, обнаружил древнеримскую гробницу, в которой, по словам епископа Теодемира из Ирии-Флавии, покоился апостол Иаков — брат Иоанна, принявший мученичество в Иерусалиме и перенесённый сюда верными последователями. Король Астурии Альфонсо II воздвиг над гробницей церковь, и в XI–XII веках Сантьяго-де-Компостела стал одним из важнейших для христианских паломников городом, уступая лишь Риму и Иерусалиму. Кающиеся путники, стекающиеся сюда из всех уголков Европы, неизменно носят на головных уборах символ святого — #italic большой гребешок#!. В этом городе завершается #italic Camino Francés#!, Дорога французских королей, — самый исхоженный тракт средневековой Европы. Усталых путников привечает величественный романский собор, который заложил в 1075 году епископ Диего Пелаэсом, а завершил строительство выдающийся епископ Диего Жельмирес. Сегодня архиепархия Компостелы — одна из влиятельнейших епархий латинского мира, за которую ведётся постоянная борьба."
 zaragoza_desc: "В древности Сарагоса носила название #italic Цезараугуста#! в честь императора Августа — основателя колонии в верховьях реки Эбро. Этот римский город когда-то был простым приграничным поселением, со временем перешёл в руки вестготов, а затем, в 714 году, его заняли арабы. В XI веке при династии Худидов будущая Сарагоса стала столицей одного из наиболее цивилизованных государств — преемников Аль-Андалуса. Воздвигнутый в те годы дворец Альхаферия и сегодня считается одним из лучших памятников исламской придворной архитектуры позднего образца. В 1118 году город покорился арагонскому королю Альфонсу Воителю, одержавшему тогда одну из величайших побед Реконкисты. Сарагоса получила статус новой столицы Арагона. Благодаря тому, что здесь были расположены величественные церкви в стиле «мудехар», королевский монетный двор и место собраний арагонских кортесов, Сарагоса стала величественной жемчужиной арагонской короны, её церемониальным и политическим центром."
 valencia_desc: "Город Валенсия, некогда римская колония #italic Валентия Эдетанорум#!, воздвигнутая на прибрежной равнине Турии, после римлян принадлежал сперва вестготам, затем — маврам, а через какое-то время ненадолго перешёл в личное владение Родриго Диаса де Вивара, известного как Эль Сид. Де Вивар владел городом с 1094 года и до самой своей кончины в 1099 году. После того как христианское воинство Эль Сида оставило город, он вновь перешёл к мусульманам. Под властью Альморавидов и Альмохадов Валенсия стала одним из величайших городов Аль-Андалуса. Её #italic уэрты#! — орошаемые поля и цитрусовые рощи — прославились на всё Средиземноморье. 9 октября 1238 года в Валенсию с триумфом вошёл арагонский король Хайме Завоеватель, одержавший долгожданную победу в самой долгой осаде на восточном направлении Реконкисты. По его воле в составе арагонской короны появилось новое королевство Валенсия. Город почти не потерял в благосостоянии; сохранились даже его знаменитые #italic уэрты#!."
 palma_desc: "Город Пальма на Балеарских островах некогда был римской колонией #italic Пальмарией#!, после падения империи перешёл сперва к вандалам, затем — к Византии, а в 902 году был завоёван Кордовским халифатом и получил арабское название #italic Мадина Майурка#!. В 1229 году арагонский король Хайме Завоеватель, возглавивший крестовый поход, захватил остров, и в 1276 году его сын Хайме II получил от отца новое владение — королевство Мальорка, небольшое, но богатое: в него входили Балеарские острова, Руссильон и Монпелье. В начале XIV века Королевство Мальорка под властью Хайме III — это по-прежнему независимый вассал арагонской короны. Столица королевства — один из крупнейших торговых портов Западного Средиземноморья. Здесь взорам капитанов предстаёт величественный собор Ла Сеу, построенный из золотого песчаника."
 girona_desc: "Жирона, некогда римская колония #italic Герунда#! на Августовой дороге в восточных Пиренеях, — укреплённый город, построенный в месте слияния четырёх рек. С IX века здесь правят Каролинги, возглавляющие испанскую борьбу против мусульманского Аль-Андалуса. К XIII веку город стал одним из главных владений княжества Каталония. Его епископство имеет значительное влияние в составе арагонской короны, а местный еврейский квартал #italic Эль-Каль#! населён выдающимися богословами и лекарями. В 1285 году, в ходе Арагонского крестового похода — продолжения Войны Сицилийской вечери, французский король Филипп III осадил Жирону, однако отважные защитники города сумели отбиться от наступающей армии, а арагонцы — разгромить французский флот у островов Формигес, навсегда вписав себя в страницы истории."
 pamplona_desc: "Памплона, в античности — римская колония #italic Помпаэло#!, основанная в 75 году до н. э. римским полководцем Помпеем в ходе Серторианской войны, с 824 года служит столицей баскско-романского королевства Наварра. Этот статус она получила при первом короле Наварры — Иньиго Аристе. Город разделён на три враждующих между собой квартала, обнесённых стенами: Наваррерия, где проживают коренные обитатели — баски, Сан-Сернин, населённый франкскими купцами, и Сан-Николас, где поселились французские переселенцы. Их распри, приводящие время от времени к дракам под стенами, отражаются в том числе и на политике города. С 1328 года наваррская корона принадлежит дому д’Эврё — младшей ветви Капетингов. Сегодня Памплона — столица единственного пиренейского королевства, сумевшего сохранить свою независимость от набирающих могущество Кастилии и Арагона. Облик города, одновременного и баскского, и романского, и франкского, определяют не сторонние силы, а его епископ и купечество."
 malaga_desc: "Город Малага в античности был финикийской колонией, основанной переселенцами из Сура в VIII веке до н. э., которые дали ей название #italic Малака#! по методу заготовки рыбы. На протяжении почти трёх тысяч лет Малага остаётся одним из важнейших портов на юге Пиренейского полуострова. Под властью Кордовского халифата и гренадских Насридов город стал главными морскими воротами Аль-Андалуса: в его гавань заходят десятки кораблей, везущих шелка, рабов и пряности из Магриба, — а сладкое вино и миндаль из плодородной #italic Ахаркии#! прославились на всё Средиземноморье. От налётчиков город надёжно защищает воздвигнутая Хаммадидами в XI веке алькасаба. За её стенами расположились генуэзское торговое поселение, кварталы кожевенников и многочисленные огороды — столпы экономического могущества Насридов."
 almeria_desc: "Город Альмерия, основанный в начале X века Абд ар-Рахманом III в качестве главного порта для флота Кордовского халифата, в XI веке стал одним из богатейших поселений Аль-Андалуса: под властью местной тайфы альмерийские ткачи шёлка и бронзовщики начали поставлять свои товары в Левант и Магриб, а корабелы — спускать со стапелей галеры, способные на равных побороться с пизанскими и генуэзскими судами за контроль над Западным Средиземноморьем. Закат золотого века Альмерии наступил в эпоху Второго крестового похода: в 1147 году объединённый флот Кастилии, Арагона, Генуи и Пизы захватил и разрушил город. Через десять лет Альмохады повторно завоевали Альмерию, однако вернуть ей прежний блеск уже не удалось. К началу XIV века Альмерия — второй по важности город насридского королевства Гренада. В её мастерских и сегодня, словно в память о былых временах, прядут шёлк."
 coimbra_desc: "Коимбра, в античности — римский #italic Эминий#!, расположена на крутом холме у изгиба реки Мондегу в сторону Атлантического океана. Своё название город получил по наименованию расположенных поблизости руин поселения #italic Конимбрига#!. В 1064 году король Леона Фердинанд Великий отвоевал Коимбру у мавров и основал на этом месте графство. С 1139 по 1255 годы, в эпоху правления короля Афонсу Великого и его преемников, Коимбра служила столицей независимого королевства Португалия. Здесь были составлены первые хроники страны и написаны первые рыцарские романы. Даже после того, как король Афонсу III переместил двор в Лиссабон, Коимбра сохранила культурное и религиозное влияние. Сегодня в городе располагается одно из важнейших в Иберии учебных заведений — #italic Studium Generale#!, основанное королём Динишем в 1290 году."
 braga_desc: "Брага получила своё название от основанной императором Августом римской колонии #italic Бракара Августа#! — столицы провинции Галлеция. Это один из старейших христианских городов Иберии: уже в III веке здесь появилось епископство. Брага — город неукоснительно соблюдаемых священных традиций, её претензия на главный престол всего полуострова имеет значительный вес. Религиозное влияние Браги неизменно росло, в чьих бы руках она ни находилась, — будь то вестготы, свевы или мавры. Восстановленная в 1070 году после Реконкисты архиепархия Браги на протяжении нескольких столетий состязалась с Толедо за первенство над Иберийской церковью. Архиепископ города заседает в величественном романском соборе, строительство которого началось в 1070 году, а различные пристройки добавляются и поныне. В ведении архиепископа — духовная жизнь в Северной Португалии, а также утверждение религиозной власти над церквями Галисии и Астурии."
 evora_desc: "На невысоком холме в величественной долине юга Алентежу раскинулся город Эвора — некогда поселение древних кельтов-лузитанов, а впоследствии римский город #italic Эбора Либералитас Юлия#!; о величии империи и сегодня напоминает возвышающийся в центре города храм Дианы. В 1166 году прославленный рыцарь Жералду Бесстрашный отбил город у мавров, взяв его штурмом под покровом ночи. В XII — XIII веках Эвора стала важнейшим христианским городом Алентежу: здесь заседает епископ и расположены главные помещения двух рыцарских орденов Португалии — Ависского и ордена Калатравы. К началу XIV века Эвора обрела славу одного из важнейших городов Португалии, а её величественный романский собор, строительство которого началось в конце XII века, — излюбленная резиденция королей Ависской династии."
 merida_desc: "В 25 году до н. э. император Август основал Мериду — колонию для ветеранов Кантабрийских войн, а заодно — и столицу римской провинции #italic Лузитания#!. С годами поселение превратилось в одну из величайших жемчужин Западной Римской империи, а его театр, амфитеатр, цирк, акведуки и даже великолепный мост через Гвадиану сохранились и поныне, пережив одиннадцать неспокойных столетий. В эпоху власти вестготов кафедра Мериды не только сохранила, но и приумножила своё влияние, а после завоевания арабами город стал одним из важнейших населённых пунктов на западной границе халифата. В 1230 году король Леона Альфонсо IX отбил Мериду и передал её рыцарям ордена Сантьяго, которые основали здесь свою штаб-квартиру. Скромный пограничный городок, расположившийся среди древнеримских развалин, на самом деле важный опорный пункт для наступления христианского воинства на Эстремадуру, а заодно — главное владение могущественного кастильского рыцарского ордена."
 tarragona_desc: "Древнеримский город #italic Тарракон#!, основанный на побережье современной Каталонии после Второй пунической войны, когда-то считался одним из важнейших городов Западной Римской империи: здесь, в столице провинции Ближняя Испания, заседали управлявшие ей проконсулы. Здесь же сложилась одна из первых христианских общин Иберии. В 714 году Таррагону разорили арабские завоеватели, и город пустовал на протяжении почти четырёх столетий. Заселение его началось только в 1118 году. Одновременно с этим в Таррагоне восстановили архиепископство — митрополию каталонской церкви и главную прелатуру арагонской короны, борющуюся за церковную власть с Арагоном, Каталонией и Валенсией. К началу XIV века город частично восстановил своё былое величие; одно из свидетельств этому — величественный романско-готический собор, возвышающийся над древнеримскими стенами."
 murcia_desc: "В 825 году эмир Омейядского халифата Абд ар-Рахман II основал в излучине Сегуры, вблизи выходящей на прибрежную равнину #italic уэрты#!, поселение #italic Мурсийя#!. Под властью эмиров тайфы Мурсия в XI веке стала важнейшим городом юго-восточного Аль-Андалуса: здесь процветает производство шёлка и керамики, а местные математики и звездочёты достойно продолжают дело Ибн аль-Банны. В 1243 году королевство Мурсия подписало Алькарасский договор, по которому стала протекторатом Кастилии. В 1266 году местные жители подняли восстание, подавленное арагонским королём Хайме I, а впоследствии Альфонсо X Мудрый включил город в состав кастильской короны. К началу XIV века Мурсия, заселённая каталонскими и арагонскими переселенцами, считается важнейшим пограничным городом Кастилии — оплотом против расположившегося на южной границе насридского королевства Гранада."
 cadiz_desc: "Около 1100 года до н. э. финикийские переселенцы из Сура высадились на юге Пиренейского полуострова и основали на вдающейся в Атлантический океан песчаной косе город #italic Гадир#! — «крепкий». Впоследствии он станет известен как Кадис — один из старейших постоянно населённых городов Западной Европы. В его гавани на протяжении трёх тысячелетий бросали якоря финикийские, карфагенские, римские, вестготские и маврские корабли. В составе Западной Римской империи #italic Гадес#! — один из богатейших городов — стал родиной выдающихся поэтов, сенаторов и танцовщиц, однако упадок римской государственности привёл к тому, что к моменту захвата города маврами тот превратился в скромный рыбацкий посёлок. В 1262 году король Альфонсо X Мудрый отвоевал Кадис и превратил его в приграничный порт для кастильской короны. На начало XIV века этот город — одно из самых южных поселений Кастилии. Его гавань, смотрящая в сторону Атлантики, терпеливо ждёт отважных исследователей, готовых выйти в открытый океан."
 jaca_desc: "Город Хака расположен в Пиренеях, в верховьях реки Арагон, где перевал Сомпор пересекает идущая из Франции паломническая тропа. Этому поселению, основанному в начале XI века, король Рамиро I изначально уготовил роль первой столицы новообразованного королевства Арагон. В 1063 году городской совет утвердил местное епископство, а в 1077 году принял от короля Санчо Рамиреса #italic фуэро#! — один из первых и самых влиятельных сводов городских законов во всей Иберии. Со временем вдоль дороги, ведущей в Сантьяго, начали селиться франкские купцы и ремесленники, а Хака стала настолько образцовым городом, что ей начали подражать города Арагона и Наварры. Расположенный здесь величественный романский собор Сан-Педро — один из старейших в Испании. К началу XIV века арагонский двор уже покинул Хаку, перебравшись сперва в Уэску, а затем в Сарагосу, однако город и поныне играет роль северных врат, ведущих из Арагона во Францию, а заодно — важной стоянки для паломников."
 san_sebastian_desc: "Под лесистой горой Ургуль, на берегу Бискайского залива, располагается Сан-Себастьян — город, выросший вокруг монастыря имени мученика Себастьяна. Около 1180 года город получил от наваррского короля Санчо VI Мудрого хартию, благодаря чему Наварра обрела заветный выход к морю. В 1200 году король Кастилии Альфонсо VIII присоединил Гипускоа, и город перешёл под власть кастильской короны. Сан-Себастьян сохранил привилегии, а гасконоязычные горожане — рыбаки и торговцы стали пользоваться расположением властей. Здесь царит относительное благополучие: китобои Сан-Себастьяна бесстрашно уходят на промысел далеко от родных берегов, а корабли, перевозящие железо и шерсть в Бордо и другие города, возвращаются в порт с трюмами, полными вина. К началу XIV века приморский город-крепость Сан-Себастьян — один из важнейших портов Баскских земель."
 perpignan_desc: "Первое упоминание о Перпиньяне — поселении в долине реки Тет между Пиренеями и Средиземноморьем — относится к X веку. В 1172 году Перпиньян — важнейший город графства Руссильон — вошёл вместе с графством в состав арагонской короны. В 1276 году, после того, как король Хайме I поделил свои владения между наследниками, Перпиньян стал континентальной столицей нового королевства Мальорка. Его владыка Хайме II построил на возвышенности над городом величественный королевский дворец. Город знаменитых руссильонских ткачей и кожевенников, расположенный на идущем из Каталонии во Францию торговом пути, почти не знает, что такое бедность. К началу XIV века Перпиньян — главная резиденция королей Мальорки на материке, но также и процветающий рыночный город, чьи станки обеспечивают одеждой почти всё Западное Средиземноморье."
 alicante_desc: "Под крутым уклоном горы Бенакантиль располагается город, который греки называли #italic Акра-Левке#! — «Белый мыс», а римляне — #italic Луцентум#!. Под властью арабов Аликанте — скромный порт на Средиземноморском побережье, защищаемый крепостью на холме, — стал известен как #italic Мадинат Лакант#!. В 1248 году его захватил будущий король Кастилии Альфонсо X. В 1296 году во время Войны за кастильское наследство Аликанте перешёл в руки арагонского короля Хайме II, а в 1308 году, по итогам Агредского договора, вошёл в состав королевства Валенсия. К началу XIV века Аликанте служит арагонской короне в качестве южного порта, откуда в море отправляются корабли, нагруженные дарами жарких плодородных земель державы: вином, миндалём и эспарто."
 cartagena_desc: "Город #italic Карт-Хадашт#! (у римлян — #italic Картаго-Нова#!), основанный около 227 года до н. э. карфагенским полководцем Гасдрубалом в естественной (и невероятно удачной) природной гавани Средиземноморья, разбогател благодаря обильным серебряным рудникам. Здесь же располагался могущественный карфагенский флот, оказавшийся, впрочем, неспособным помешать Сципиону Африканскому взять город штурмом в 209 году до н. э. Местное епископство — одно из старейших в Римской Испании, однако столетия постоянного упадка и арабские завоевания оставили на городе свой отпечаток: некогда великий порт сегодня — лишь бледная тень самого себя. В 1245 году кастильский инфант Альфонсо завоевал город и восстановил местный престол. К началу XIV века Картахена — скромная, но при этом стратегически важная гавань на кастильском приграничье. Из её порта и поныне выходят флотилии, ходящие вдоль южного побережья."
 algeciras_desc: "В 711 году берберский полководец Тарик ибн Зияк основал на месте первой высадки арабских завоевателей в Иберии поселение #italic Аль-Джазира-аль-Хадра#! — «зелёный остров»: выбранное им место действительно располагается в заливе у островка в западной части пролива. На протяжении шести столетий город — связующее звено между Аль-Андалусом и Северной Африкой — служил главным портом для воинов и купцов, прибывающих из Магриба. Он поочерёдно переходил к Умайядам, тайфе Альхесирас, Альморавидам и Альмохадам. К началу XIV века Альхесирас — важный опорный пункт Маринидов в Иберии: двойная гавань, укреплённая мощными стенами, — важнейший путь, по которому из Африки сюда, в эти неспокойные края, поступает не только золото, но и войска."
 gibraltar_desc: "Огромная известняковая скала #italic Джабаль Тарик#! («гора Тарика») знаменита в первую очередь как место, где в 711 году высадилось войско Тарика ибн Зияка — арабского завоевателя Иберии. В 1160 году скалу, прежде бывшую лишь неприметным местечком для наблюдения за проливом, укрепил альмохадский халиф Абд аль-Мумин: он воздвиг здесь город-крепость и цитадель, которую назвал #italic Мадинат аль-Фатх#! — «город победы». По замыслу аль-Мумина, эта цитадель должна была обеспечить ему власть над проливами. В 1309 году её ненадолго захватили кастильские войска, однако арабы вскоре отбили крепость. К началу XIV века Гибралтар — оплот Маринидов, на который точат зуб их враги, ведь кто владеет Гибралтаром, тот владеет проходом между двумя морями и двумя континентами."
 marbella_desc: "Марбелья, расположившаяся в плодородной прибрежной долине у подножья гор Сьерра-Бланка, изначально принадлежала римлянам, а затем, в период арабского владычества, стала известна как #italic Марбалла#!. Её алькасаба надёжно оберегает берег, где обильно произрастают виноград, финики и прочие дары местной природы. Главный залог благополучия города — его порт, скромный, но немаловажный: отсюда в море выходят корабли, гружёные фруктами и шёлком. Местным жителям не грозит голодная смерть: тёплые воды Средиземного моря щедры на рыбу. К началу XIV века Марбелья — один из городов в составе насридского королевства Гранада. Её стены оберегают морские подступы к последней исламской державе Иберии."
 fez_desc: "Город Фес, основанный около 800 года династией Идрисидов и расположенный на обоих берегах одноимённой реки, стремительно разросся после того, как принял у себя андалузских беженцев из Кордовы и арабские семьи из Кайруана. Два основанных переселенцами квартала и придали городу его современный облик. Фес — один из самых учёных городов исламского мира: здесь расположены великая мечеть и университет #italic Аль-Карауин#!, основанный Фатимой аль-Фихри в 859 году. Сюда съезжаются законоведы, богословы и учёные со всего Средиземноморья. Сместившие Альмохадов Мариниды сделали Фес своей столицей и в 1276 году возвели рядом со старым городом королевский квартал #italic Фас аль-Джадид#! — с дворцами, садами и соборной мечетью. К началу XIV века Фес, политическая и интеллектуальная опора Маринидского султаната, находится в зените славы."
 marrakesh_desc: "Марракеш, основанный в 1070 году альморавидским полководцем Абу Бакром ибн Умаром на окраине великой долины Хауз, что лежит под заснеженными горами Высокого Атласа, — город-чудо: из скромной заставы в пустыне он за считанные десятилетия превратился в столицу империи, простирающейся от Сенегала до Эбро. Под властью сначала Альморавидов, а затем захвативших город в 1147 году Альмохадов Марракеш перевоплотился: его владыки соорудили в городе дворцы, сады, мечеть Аль-Кутубия с величественным минаретом и даже удивительные подземные каналы — #italic кхеттары#!, по которым жителям поступает вода с гор. Само слово «Марракеш» в устах европейских путников стало означать всё королевство Марокко. К началу XIV века резиденция Маринидов переместилась на север, в Фес, однако Марракеш и поныне сохраняет свой статус великой южной столицы — ворот, соединяющих между собой Атлас, Сус и пустыню, где пролегают тропы караванщиков."
 sijilmasa_desc: "Сиджильмаса, основанная в 757 году в пальмовом оазисе Тафилальт, что на северной окраине Сахары, — один из пунктов остановки караванов, идущих через великую пустыню. Здесь золото из Ганы и Мали, перевозимое на берберских верблюдах, обменивают на соль, ткани и готовые товары средиземноморских держав. На протяжении долгих столетий здесь чеканились золотые динары, без которых была немыслима торговля в западной части исламского мира, а местные купцы — посредники между двумя континентами — богатели день ото дня. К началу XIV века прежде независимая и самоуправляемая Сиджильмаса находится под властью Альморавидов и всё так же сохраняет за собой роль главных ворот, ведущих во владения Маринидов, хотя рано или поздно её процветанию придёт конец: караваны сегодня всё чаще предпочитают ходить другими маршрутами."
 rabat_desc: "В середине XII века альмохадский халиф Абд аль-Мумин воздвиг в устье реки Бу-Регрег укреплённый #italic рибат#! — заставу, которой, впрочем, недолго было оставаться таковой: внук халифа Якуб аль-Мансур, одержав в 1195 году победу при Аларкосе, переименовал заставу в #italic Рибат-аль-Фатх#! — «лагерь победы». С твёрдым намерением основать здесь столицу новой империи он взялся за строительство огромной соборной мечети. Её величественный минарет — башня Хасана — так, однако, и остался недостроенным: халиф умер, и никто не продолжил его грандиозную стройку. Его мечты нашли воплощение лишь в форме незавершённой башни, молча взирающей свысока. Упадок династии Альмохадов привёл к постепенному опустению некогда великолепного города, и к началу XIV века Рабат являет собой невзрачное зрелище: городок, прикрытый пусть и мощными, но недостроенными стенами. Дни и ночи здесь проходят в наблюдении за Атлантикой и городом-соседом по ту сторону реки — Сале."
 sale_desc: "На северном берегу реки Бу-Регрег, у места, где она впадает в Атлантику, расположен один из важнейших портов средневекового Марокко — Сале. Здесь зерно, шерсть, кожа и воск из внутренних районов державы отправляются в христианские города Иберии и Италии, а также на рынки Средиземноморья. В 1260 году кастильский флот разорил город, однако султаны из династии Маринидов не только восстановили разрушенное поселение, но и укрепили его и возвели в стенах города прекрасную соборную мечеть и медресе. К началу XIV века Сале, место, где сходятся два моря, — богатый и интеллектуальный торговый город, а проживающие и трудящиеся здесь учёные и правоведы в глубине познаний не уступают своим соперникам из великих материковых городов."
 ceuta_desc: "Расположенная на африканском берегу Сеута (по-арабски — #italic Сабта#!), город, где сливаются два моря и почти смыкаются два континента, — одна из важнейших и спокойнейших гаваней в Средиземном море, естественным образом соединяющая между собой Магриб и Аль-Андалус. Местные мастерские славятся своими латунными изделиями, а переписчики — невероятного качества рукописями; через город проходят торговые потоки, соединяющие Африку и Европу, а значит — золото и товары, и жизнь здесь не затихает ни на секунду. Усилиями местной купеческой аристократии — Азафидов — Сеута на зависть многим и поныне сохраняет независимость. К началу XIV века за город состязаются Мариниды и гранадские Насриды: никто из них не в силах добровольно отказаться от ключа к проливу."
 tangier_desc: "Танжер, расположенный в западной части пролива, где Средиземное море впадает в Атлантику, — один из старейших городов Марокко. Когда-то здесь находилось финикийское торговое поселение, впоследствии — римская колония #italic Тингис#!, столица провинции Мавретания Тингитанская. Эта гавань, имеющая без преувеличения стратегическое значение, за прошедшие столетия переходила сначала к вандалам, затем к Византии, Умайядам, Альморавидам и, наконец, Альмохадам: город, стоящий на пересечении Африки и Европы, — желанная добыча. К началу XIV века Танжер — скромный порт, принадлежащий династии Маринидов, однако значение его велико: расположение в углу континента само по себе привлекает внимание любой державы, желающей установить контроль над проливом."
 taza_desc: "Город-крепость Таза имеет стратегическое значение: он расположен по обеим сторонам узкого прохода между хребтом Эр-Риф и Средним Атласом — единственным доступным перевалом между Восточным и Западным Марокко. Именно здесь в 30-е годы XII века обосновался альмохадский халиф Абд аль-Мумин, и отсюда же он двинулся в поход на Марракеш. Примерно в те же годы в Тазе была построена знаменитая мечеть. Впоследствии город завоевали Мариниды, хорошо осознававшие ценность крепости, обороняющей дорогу в Фез. К началу XIV века город-крепость Таза — важнейшие врата на восточной границе владений Маринидов, ключ к контролю над всем Марокко."
 meknes_desc: "На плодородных равнинах к северу от Среднего Атласа, среди фруктовых садов, оливковых рощ и нив вырос процветающий торговый город Мекнес, основанный в X веке берберами-мекнасами и впоследствии превращённый в крепость Альморавидами. И хотя соседний Фес затмевает его своим великолепием, Мариниды всё же не оставили город — хлебородную, полноводную житницу — без внимания: здесь воздвигли мечети и прекрасное медресе. К началу XIV века Мекнес — благополучный провинциальный город, изобилующий садами и рынками. Стратегически выгодное расположение и богатые угодья — залог славного будущего."
 taroudant_desc: "Расположенный в плодородной долине реки Сус между Высоким Атласом и Антиатласом город Тарудант издавна считается важнейшим населённым пунктом на южных земельных угодьях: обильный приток речных вод обеспечивает прекрасные урожаи зерна, оливок, сахарного тростника, фруктов и овощей. В 1056 году город захватили Альморавиды; эта победа стала одной из первых в череде завоеваний, в конце концов обеспечивших им долгую славу и власть. Город-крепость долго служил столицей и главным рынком всему региону; сюда привозили и дары долины, и товары из далёких пустынных оазисов. К началу XIV века Тарудант — город, расположившийся между горами, долинами и пустыней, укрывающий за прочными стенами сады и рынки, — по-прежнему процветает."
 aghmat_desc: "Расположенный у подножья Высокого Атласа город Агмат ещё до основания Марракеша снискал славу главного города Хауза благодаря процветающему рынку, где торговали дарами гор и долин, а также товарами, что привозили сюда переходящие через Сахару караваны. Недолгое время, ещё до того, как основать поблизости новую столицу, здесь проживали Альморавиды, и в этом же городе доживал свои последние лета скончавшийся в 1095 году сосланный эмир Севильи, поэт аль-Мутамид. Его гробница и поныне влечёт к себе паломников — ценителей его печальной лирики. К началу XIV века Агмат, оказавшийся в тени Марракеша, превратился в скромный городок, чья слава сохранилась даже не столько в памяти народа, сколько в строках пленённого и умершего здесь эмира."
 tinmel_desc: "В укромной долине Высокого Атласа расположилась горная крепость Тинмель — некогда колыбель движения Альмохадов. Именно здесь махди ибн Тумарт, проповедник идеи о единстве Бога, в начале XII века заручился поддержкой многочисленных последователей-берберов, сбросил с престола Альморавидов и завоевал Магриб и Аль-Андалус. Гробница ибн Тумарта, а также возведённая рядом с ней укреплённая мечеть манили паломников в горный Тинмель — духовную столицу и святую святых Альмохадов. На начало XIV века династия Альмохадов давно потерпела крах, и сегодня Тинмель — всё ещё почитаемое, но уже редко посещаемое из-за свой отдалённости святилище. Его мечеть — безмолвный памятник империи, сошедшей с горных вершин."
 volubilis_desc: "На плодородном плато у холмов рядом с городом Мекнес раскинулся город Волюбилис — некогда римская колония, по-арабски называемая #italic Валили#!, западная столица провинции Мавретания Тингитанская. Этот богатый провинциальный город, расположенный на самой окраине римской ойкумены, поражал своими триумфальными арками и базиликами, прессами для выжимания масла и превосходными мозаиками. Ближе к падению Рима легионы покинули город, однако тот продолжил существовать уже при берберах. В 788 году беглый Идрис ибн Абдалла основал здесь при поддержке местных племён первую мусульманскую династию Марокко. К началу XIV века от некогда великого римского города остались в основном лишь величественные руины да скромное селение. Рухнувшие от старости колонны — печальное напоминание: империи зарождаются и погибают, и ничто не вечно."
 anfa_desc: "Берберский портовый город Анфа, расположенный на небольшой возвышенности у Атлантического побережья, самодостаточен: пищу его обитателям обеспечивают океан и плодородная долина Шауйя, а средства к существованию — торговля по морю. Город свободен от влияния великих материковых держав, а потому издавна притягивает к себе взгляды завистников и пользуется славой пристанища бесстрашных мореходов и пиратов, грабящих проходящие у побережья суда. На начало XIV века Анфе принадлежит небольшая, но оживлённая гавань на окраине владений Маринидов. Выходящие отсюда корабли охотятся не только на рыбу, но и на других, беззащитных моряков."
 azemmour_desc: "Древний портовый город Аземмур, расположенный на утёсе над устьем великой реки Умм-эр-Рбия, что впадает в Атлантический океан, живёт дарами реки и моря. Превыше всего здесь ценится сельдь — каждую весну обильные косяки этой рыбы идут вверх по течению. Из гавани отправляются корабли, гружёные зерном и шерстью с плодородной долины Дуккала, — эти товары неизменно пользуются спросом у купцом Иберии и Средиземноморья. К началу XIV века Аземмур — процветающий портовый город-крепость на Атлантическом побережье Марокко, населённый рыбаками и торговцами. Его богатство, однако, непостоянно: оно приходит и уходит, подобно речным приливам и отливам."
 asfi_desc: "Старый город Асфи, располагающийся под невысокими скалами в бухте на побережье Атлантики, живёт не только рыболовством, но и торговлей: из порта Асфи на запад ходят корабли с зерном, шерстью и свежими фруктами и овощами из долины Абда. В его гавань заходят генуэзские, каталонские и португальские купцы, охочие до товаров из южного Марокко, а местные рыбаки привозят обильные уловы из прибрежных вод Атлантического океана. На начало XIV века Асфи — один из важнейших городов юга владений Маринидов, соединяющий державу с христианскими торговыми поселениями. В его скромной гавани ни на миг не утихает жизнь."
 asilah_desc: "Асила — один из старейших портов Марокко. Ценность расположения на берегу Атлантического океана к югу от залива осознавали ещё финикийские и карфагенские купцы, в древности основавшие здесь поселение #italic Зилис#!. Во времена римского владычества город с его многочисленными пристанями входил в состав провинции Мавретания Тингитанская, а впоследствии не раз переходил из рук в руки ввиду своего ценного преимущества — близости ко входу в залив. К началу XIV века Асила — скромный, но неплохо укреплённый порт, принадлежащий Маринидам. Его гавань принимает купеческие корабли, ходящие вдоль побережья Атлантики, а стены надёжно защищают жителей от морских разбойников и флотилий других держав."
 larache_desc: "На побережье Атлантики, где река Лукос впадает в океан, когда-то располагалась финикийская колония #italic Ликсус#! — одно из старейших торговых селений в этих краях. Древние считали, что именно здесь находятся сады Гесперид. Спустя века на развалинах Ликсуса вырос город Лараш. Его жители неприхотливы: они ловят рыбу в реке и океане, добывают соль на солончаках и торгуют зерном и готовыми товарами. К началу XIV века Лараш — небольшой, но умеренно важный порт в составе державы Маринидов. Благодаря удачному расположению у устья реки здесь можно бросить якорь, не опасаясь, что сильное течение унесёт корабль в открытое море."
 tetouan_desc: "В плодородной долине у подножья хребта Эр-Риф, недалеко от Средиземного моря, маринидский султан Абу Табит около 1286 года восстановил и укрепил разрушенное поселение Тетуан, превратив его в опорный пункт для осады близлежащей Сеуты. Благодаря расположению за устьем реки, между горами и морем, Тетуан оказался естественной крепостью, а заодно — и местом, где шла бурная торговля между Эр-Рифом и побережьем. К началу XIV века Тетуан — укреплённый маринидский город, играющий для державы далеко не последнюю роль: отсюда удобно оборонять подходы к Средиземноморью и горные дороги Северного Марокко."
