 INCOMING_OFFER_TITLE_request_circle_privilege: "Запрос привилегий для округа"
 request_circle_privilege_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] отклоня[SCOPE.sCountry('recipient').Custom('end_etyut')] запрос привилегий для округа #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
 request_circle_privilege_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] отклонил[SCOPE.sCountry('recipient').Custom('end_fem')] запрос привилегий для округа #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
 request_circle_privilege_members_tt: "Каждый участник [Concept('imperial_circle', 'имперского округа')|e] получит модификатор «[ShowModifier('granted_circle_privilege')]» на 5 лет."
 distribute_imperial_grant: "Распределить имперский грант"
 distribute_imperial_grant_desc: "Распределить золото из казны между участниками округа. Это улучшит отношения и поднимет уровень довольства."
 distribute_imperial_grant_act: "Распределить золото между участниками округа."
 distribute_imperial_grant_tt: "Мы потратим [SCOPE.GetValue('total_grant')|2V]@gold! (20% от нашей [Concept('economical_base', 'экономической базы')|e]). Золото будет равномерно распределено между участниками [Concept('imperial_circle', 'имперского округа')|e], не являющимися лидерами. Каждый из них получит модификатор «[ShowModifier('received_imperial_circle_grant')]» на 2 года и [ShowBiasValue('opinion_received_imperial_grant')|+=2] к [Concept('opinion', 'мнению')|e] о нас."
 distribute_imperial_grant_effect_text: "[SCOPE.sCountry('actor').GetName] распределил[SCOPE.sCountry('actor').Custom('end_fem')] имперский грант между участниками своего округа."
 distribute_imperial_grant_effect_text_past: "[SCOPE.sCountry('actor').GetName] распределил[SCOPE.sCountry('actor').Custom('end_fem')] имперский грант между участниками своего округа."
 demand_circle_loyalty: "Потребовать верности от округа"
 demand_circle_loyalty_desc: "Мы утвердим власть над участниками округа. На 3 года мы получим престиж и дипломатический авторитет, однако участникам не понравится навязывание власти, и их довольство упадёт."
 demand_circle_loyalty_act: "Утвердить власть над участниками округа."
 demand_circle_loyalty_tt: "На мы 3 года получим модификатор «[ShowModifier('imposed_circle_authority')]». Каждый участник нашего [Concept('imperial_circle', 'имперского округа')|e], не являющийся лидером, на 3 года получит модификатор «[ShowModifier('pressured_circle_loyalty')]» и [ShowBiasValue('opinion_demanded_loyalty')|+=2] к [Concept('opinion', 'мнению')|e] о нас. Довольство округа упадёт на 5 ед."
 demand_circle_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName] требу[SCOPE.sCountry('actor').Custom('end_etyut')] верности от участников округа."
 demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName] потребовал[SCOPE.sCountry('actor').Custom('end_fem')] верности от участников округа."
 reform_coinage_in_circle: "Денежная реформа в округе"
 reform_coinage_in_circle_desc: "Империя даровала нам право региональной чеканки монет. Реформа монет и их хождения поспособствует экономическому развитию всех участников нашего округа, а также упрочит наше положение в округе. К сожалению, это приведёт к снижению наших возможностей чеканить монету."
 reform_coinage_in_circle_act: "Денежная реформа в нашем округе"
 reform_coinage_in_circle_tt: "Мы получим модификатор «[ShowModifier('reformed_circle_coinage_leader')]», а каждый участник нашего округа получит модификатор «[ShowModifier('reformed_circle_coinage_member')]» на 5 лет. [Concept('opinion', 'Мнение')|e] каждого участника округа о нас увеличится на [ShowBiasValue('opinion_reformed_circle_coinage')|+=2], а довольство округа увеличится на 5 ед."
 reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName] провод[SCOPE.sCountry('actor').Custom('end_ityat')] в своём округе денежную реформу."
 reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName] провел[SCOPE.sCountry('actor').Custom('end_fem')] в своём округе денежную реформу."
 reduction_of_circle_titles: "Сокращение титулов округа"
 reduction_of_circle_titles_desc: "Наш округ стан неэффективным и погряз в титулах и административных должностях, способных блокировать решения друг друга. Сокращение титулов не только позволит повысить эффективность нашего округа, но и укрепит наше положение. Другие участники округа будут не в восторге от подобной централизации, что снизит их довольство."
 reduction_of_circle_titles_act: "Сокращение титулов округа"
 reduction_of_circle_titles_tt: "Мы получим модификатор «[ShowModifier('reduction_of_circle_titles')]», и [Concept('opinion', 'мнение')|e] каждого участника округа о нас уменьшится на [ShowBiasValue('opinion_reduction_of_circle_titles')|+=2]. Довольство округа уменьшится на 5 ед."
 reduction_of_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName] сокраща[SCOPE.sCountry('actor').Custom('end_etyut')] титулы округа"
 reduction_of_circle_titles_text_past: "[SCOPE.sCountry('actor').GetName] сократил[SCOPE.sCountry('actor').Custom('end_fem')] титулы округа"
 challenge_circle_leadership: "Вызов лидеру округа"
 challenge_circle_leadership_desc: "Нынешние лидеры нашего округа оказались недостойными своего положения и обязанностей. У нас есть возможность оспорить их полномочия и подорвать авторитет, что может как ослабить их хватку, так и дать нам возможность бросить им вызов."
 challenge_circle_leadership_act: "Бросить лидеру округа вызов на борьбу за власть."
 challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName] броса[SCOPE.sCountry('actor').Custom('end_etyut')] вызов лидеру округа."
