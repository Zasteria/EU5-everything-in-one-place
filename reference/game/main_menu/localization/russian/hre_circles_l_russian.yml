 challenge_circle_leadership_tt: "Мы победим, если будет выполнено любое из условий:\n  • Довольство нашего округа ниже 15 ед. — открытое восстание\n  • Довольство нашего округа ниже 30 ед., а наш престиж как минимум не ниже престижа лидера\n  • Наш престиж превышает престиж лидера не менее чем на 25 ед.\n\nПотеря или отстранение от вызова приведёт к потере престижа. Новому лидеру нельзя будет бросить вызов в течение 2 лет."
