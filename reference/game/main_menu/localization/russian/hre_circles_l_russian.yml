 join_an_imperial_circle_desc: "Вступить в имперский округ во время периода создания."
 join_an_imperial_circle_act: "Вступить в округ [SCOPE.sImperialCircle('target').GetName]."
 join_an_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName] вступа[SCOPE.sCountry('actor').Custom('end_etyut')] в округ [SCOPE.sImperialCircle('target').GetName]."
 join_an_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName] вступил[SCOPE.sCountry('actor').Custom('end_fem')] в округ [SCOPE.sImperialCircle('target').GetName]."
 bribe_imperial_circle: "Подкупить имперский округ"
 bribe_imperial_circle_desc: "Дать лидеру имперского округа и каждому его участнику взятку, чтобы те проголосовали за наше предложение в Рейхстаге. Лидер округа получит взятку в полном базовом размере, а все последующие участники — по 25% от этого значения. Голос каждого участника будет зафиксирован так, как выберет император."
 bribe_imperial_circle_act: "Подкупить #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_ACC')|L]#!#!, чтобы наше предложение в рейхстаге поддержали."
 bribe_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName] подкупа[SCOPE.sCountry('actor').Custom('end_etyut')] округ #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_GEN')|L]#!#! ради поддержки своего предложения."
 bribe_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName] подкупил[SCOPE.sCountry('actor').Custom('end_fem')] округ #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_GEN')|L]#!#! ради поддержки своего предложения."
 bribe_imperial_circle_members_tt: "Каждый последующий участник округа #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_GEN')|L]#!#! получает [SCOPE.GetValue('bribe_member_share')|0V]@gold!, а их [Concept('vote', 'голоса')|e] за предложение в рейхстаге будут зафиксированы так, как выберет император."
 BRIBE_IMPERIAL_CIRCLE_CTRL_HINT: "Подкуп всего [Concept('imperial_circle', 'имперского округа')|e]"
 approve_imperial_circle_proposal: "Одобрить предложение"
 approve_imperial_circle_proposal_desc: "Как лидер имперского округа мы заставим каждого участника отдать голос (и проголосуем сами) за текущее предложение до того, как проголосует рейхстаг. Это бесплатно, однако голоса будут зафиксированы до завершения резолюции."
 approve_imperial_circle_proposal_act: "Принудить округ [SCOPE.sImperialCircle('target').GetName] проголосовать за предложение."
 approve_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] принужда[SCOPE.sCountry('actor').Custom('end_etyut')] округ [SCOPE.sImperialCircle('target').GetName] проголосовать за имперское предложение."
 approve_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] принудил[SCOPE.sCountry('actor').Custom('end_fem')] округ [SCOPE.sImperialCircle('target').GetName] проголосовать за имперское предложение."
 approve_imperial_circle_proposal_members_tt: "[Concept('vote', 'Голос')|e] каждого участника округа [SCOPE.sImperialCircle('target').GetName] в голосовании по текущему предложению в рейхстаге отдан за предложенную политику и зафиксирован."
 oppose_imperial_circle_proposal: "Выступить против предложения"
 oppose_imperial_circle_proposal_desc: "Как лидер имперского округа мы заставим каждого участника отдать голос (и проголосуем сами) против текущего предложения до того, как проголосует рейхстаг. Голоса будут отданы за текущую политику и зафиксированы, но только если таковая существует; в противном случае округ воздержится."
 oppose_imperial_circle_proposal_act: "Принудить округ [SCOPE.sImperialCircle('target').GetName] проголосовать против предложения."
 oppose_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] принужда[SCOPE.sCountry('actor').Custom('end_etyut')] округ [SCOPE.sImperialCircle('target').GetName] проголосовать против имперского предложения."
 oppose_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] принудил[SCOPE.sCountry('actor').Custom('end_fem')] округ [SCOPE.sImperialCircle('target').GetName] проголосовать против имперского предложения."
 oppose_imperial_circle_proposal_members_tt: "[Concept('vote', 'Голос')|e] каждого участника округа [SCOPE.sImperialCircle('target').GetName] в голосовании по текущему предложению в рейхстаге отдан за текущую политику и зафиксирован. Если текущей политики не существует, округ воздержится от голосования."
 call_imperial_circle_to_war: "Призыв округа на войну"
 call_imperial_circle_to_war_desc: "Призвать лидера округа поддержать идущую войну силами участников округа."
