 IMPERIAL_CIRCLES_EVENTS_FLAVOR: "Имперские округа"
 imperial_circles.1.title: "Установлены имперские округа"
 imperial_circles.1.desc: "Период создания имперских округов завершён. Очерчены их границы, и лидеры округов теперь будут заведовать делами государства. В истории Священной Римской Империи начинается новая страница."
 imperial_circles.1.a: "Во славу Империи!"
 imperial_circles.2.title: "Отсутствующие средства"
 imperial_circles.2.desc: "В ходе недавнего рейхстага наш округ поддержал предложенную реформу имперской конституции. Эта поддержка стала возможной благодаря тому, что участники нашего округа ожидали, что мы, как лидер округа, распределим средства между ними. Независимо от того, насколько оправданными были эти ожидания, наша неспособность исполнить эти их привела к нескольким жалобам на злоупотребление властью и удержание нами средств, предназначенных для участников округа. Если мы проигнорируем эти жалобы, в будущем это может подорвать наши позиции."
 imperial_circles.2.a: "Они правы, мы распределим средства."
 imperial_circles.2.b: "Они ошибаются, мы никого не подкупали."
 imperial_circles.2.c: "Обратиться к нашим друзьям в [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_PREP')]."
 imperial_circles.11.title: "Недовольство в округах"
 imperial_circles.11.desc: "Среди участников нашего округа зреет недовольство. Если мы ничего не предпримем, скоро кто-нибудь открыто бросит вызов нашей власти."
 imperial_circles.11.a: "Срочно распределить средства среди недовольных, чтобы те успокоились."
 imperial_circles.11.b: "Пусть жалуются — у нас есть более важные заботы."
 imperial_circles.12.title: "Князья требуют перемен"
 imperial_circles.12.desc: "Недовольство в округе достигло предела. Участники открыто ставят под сомнение нашу власть. Выборы, похоже, неизбежны."
 imperial_circles.12.a: "Нужно действовать, пока ещё не поздно."
 imperial_circles.20.title: "Наш голос был куплен"
 imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName] заплатил[SCOPE.sCountry('actor').Custom('end_fem')] лидеру нашего имперского округа, #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_DAT')|L]#!#!, за поддержку предложения, рассматриваемого рейхстагом. Наша доля составила [SCOPE.GetValue('received_bribe')|0V]@gold!, и наш [Concept('vote', 'голос')|e] будет поддерживать императора до окончания рассмотрения ткущей резолюции."
 imperial_circles.20.a: "Мы не откажемся от золота."
 imperial_circles.50.title: "Вызов лидеру округа"
 imperial_circles.50.desc: "Мы решили оспорить лидерство #ONCLICK:COUNTRY,[recipient.Custom('CL_tt')] #TOOLTIP:COUNTRY,[recipient.Custom('CL_tt')],X [recipient.Custom('CL_GEN')|L]#!#! в нашем имперском округе.\n\nМы больше не готовы мириться с их слабостью и безразличием, и наверняка многие будут готовы поддержать нас. Если мы сумеем представить себя как лучшего и более сильного лидера, наши требования будут выполнены, но в случае провала пострадает наша репутация в глазах других держав и нашего народа."
 imperial_circles.50.a: "Настоять на своём."
 imperial_circles.50.b: "Отстраниться от вызова."
 imperial_circles.53.title: "Вызов не удался"
 imperial_circles.53.desc: "Мы проиграли в борьбе против #ONCLICK:COUNTRY,[recipient.Custom('CL_tt')] #TOOLTIP:COUNTRY,[recipient.Custom('CL_tt')],X [recipient.Custom('CL_GEN')|L]#!#! за лидерство над округом. Наш престиж оказался недостаточно высок, в результате чего пострадала наша репутация. Перед тем как бросить вызов повторно, придётся подождать."
 imperial_circles.53.a: "Дождёмся удобного момента."
 imperial_circles.51.title: "Смещены с места лидера"
 imperial_circles.51.desc: "Соперник успешно бросил нам вызов за лидерство. Нас лишили титула лидера округа, и теперь нам придётся восстанавливать репутацию в глазах других участников."
 imperial_circles.51.a: "Такие унижения не забываются."
 imperial_circles.52.title: "Место лидера удержано"
 imperial_circles.52.desc: "Нас попытались сместить с места лидера округа, однако престиж соперника оказался недостаточен. Мы сохранили лидерство."
 imperial_circles.52.a: "Нашу власть не так-то просто сломить."
 imperial_circles.70.title: "Избраны лидером округа"
 imperial_circles.70.desc: "Поскольку предыдущий лидер покинул наши ряды, округ предпочёл, чтобы его место заняли мы. Теперь мы считаемся лидером округа."
 imperial_circles.70.a: "Они не зря доверились нам."
 imperial_circles.71.title: "У округа нет лидера"
 imperial_circles.71.desc: "В одном из имперских округов нет подходящего кандидата, способного стать лидером. Подобные округа подрывают власть императора."
 imperial_circles.71.a: "Значит, мы назначим кого-нибудь сами."
 imperial_circles.80.title: "Корона императора меняет всё"
 imperial_circles.80.desc: "На наше чело возложена императорская корона. Будучи императором, нельзя одновременно быть и лидером округа: обе эти должности требуют беззаветной преданности. Мы отказались от звания лидера округа, и теперь наше место может занять кто-то ещё."
 imperial_circles.80.a: "Империя превыше всего."
