l_russian:
 REGENCY_NO_REGENT: "@trigger_no! Сейчас нет действующего регента!"
 REGENT_IMPACT: "$TITLE$ $NAME$"
 cabinet_head_regency: "Регентство главы совета"
 consort_regency: "Регентство консорта"
 overlord_regency: "Регентство сюзерена"
 lordship_of_ireland_regency: "Регентство манора"
 subject_regency: "Регентство ленника"
 nobles_estate_regency: "Регентство аристократов"
 cardinal_regency: "Регентство кардинала"
 religious_order_regency: "Регентство религиозного ордена"
 clergy_estate_regency: "Регентство священников"
 burghers_estate_regency: "Регентство горожан"
 peasants_estate_regency: "Регентство крестьян"
 interregnum: "Междуцарствие"
 republican_election_regency: "Выборное управление"
 papal_election_regency: "Папский конклав"
 papal_election_regency_desc: "$papal_election_desc$"
 judicial_election_regency: "Юдикатный конклав"
 judicial_election_regency_desc: "Нового [Concept('ruler', 'правителя')|e] выбирает совет. Этот процесс представляет собой бюрократический хаос и может занять несколько месяцев или даже лет."
 mamluk_succesion_regency: "Наследование мамлюков"
 mamluk_succesion_regency_desc: "Новый [Concept('ruler', 'правитель')|e] и [Concept('regents', 'регенты')|e] должны быть выходцами из дисциплинированных и престижных рядов элитных мамлюков под нашим командованием."
 fratricide_succesion_regency: "Братская междоусобица"
 fratricide_succesion_regency_desc: "Нового [Concept('ruler', 'правителя')|e] выбирает лично Бог: он отдаёт предпочтение одному из сыновей прежнего [Concept('ruler', 'правителя')|e]."
 fratricide_succesion_regency_tt1: "Ни один из сыновей прежнего правителя не может унаследовать престол. Вместо них появляется другой член династии."
 fratricide_succesion_regency_tt2: "Ни один из членов династии не может унаследовать престол. Вместо них появляется новая династия."
 fratricide_succesion_regency_tt3: "Престол мгновенно унаследует единственный способный сын прежнего правителя."
 fratricide_succesion_regency_tt4: "Вопрос престолонаследия будет решаться, когда сыновья вырастут."
 republican_election_regency_desc: "Если у республики нет [Concept('ruler', 'правителя')|e], до проведения официальных [Concept('election', 'выборов')|e] ей будет временно править [Concept('regent', 'регент')|e]."
 cabinet_head_regency_desc: "Когда в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], [Concept('head_of_the_cabinet', 'глава совета')|e] занимает место [Concept('regent', 'регента')|e]."
 consort_regency_desc: "Если во время смерти [Concept('ruler', 'правителя')|e] монархической [Concept('country', 'державы')|e] его [Concept('heir', 'наследник')|e] ещё [Concept('child', 'ребёнок')|e], страной в должности [Concept('regent', 'регента')|e] может править [Concept('consort', 'консорт')|e]."
 nobles_estate_regency_desc: "Если в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может представитель аристократии."
 cardinal_regency_desc: "Когда в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], состоящий в [Concept('cabinet', 'совете')|e] кардинал встаёт во главе державы в качестве [Concept('regent', 'регента')|e]."
 religious_order_regency_desc: "Если в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], и в ней укрепился влиятельный [Concept('religious_order', 'религиозный орден')|e], в качестве [Concept('regent', 'регента')|e] может быть назначен представитель этого ордена."
 clergy_estate_regency_desc: "Если в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может представитель духовенства."
 burghers_estate_regency_desc: "Если в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может править представитель горожан."
 peasants_estate_regency_desc: "Если в [Concept('country', 'державе')|e] нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может править представитель крестьян."
 overlord_regency_desc: "Если у [Concept('country', 'державы')|e]-[Concept('subject', 'ленника')|e] нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может руководить [Concept('ruler', 'правитель')] державы-[Concept('overlord', 'сюзерена')|e]."
 lordship_of_ireland_regency_desc: "Если у [Concept('country', 'державы')|e]-[Concept('member', 'участника')|e] [Concept('international_organization', 'международного объединения')|e] «[GetUniqueInternationalOrganization('lordship_of_ireland').GetName]» нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может руководить [Concept('ruler', 'правитель')] державы-[Concept('international_organization_leader_short', 'лидера')|e]."
 subject_regency_desc: "Если у [Concept('country', 'державы')|e]-[Concept('overlord', 'сюзерена')|e] нет [Concept('ruler', 'правителя')|e], страной в должности [Concept('regent', 'регента')|e] может руководить [Concept('ruler', 'правитель')] сильной державы-[Concept('subject', 'ленника')|e]."
 interregnum_desc: "Если у [Concept('country', 'державы')|e] нет [Concept('ruler', 'правителя')|e], до назначения официального [Concept('ruler', 'правителя')] руководить ей может временная администрация. Назначение может как пройти быстро, так и занять длительное время."
 expedition_regency: "Регентство на время экспедиции"
 expedition_regency_desc: "Пока [Concept('ruler', 'правитель')|e] [Concept('country', 'державы')|e] возглавляет [Concept('expedition', 'экспедицию')|e], в его отсутствие [Concept('country', 'державой')|e] управляет [Concept('regent', 'регент')|e]."
 expedition_regency_duration: "Это будет длиться до завершения [Concept('expedition', 'экспедиции')|e]."
