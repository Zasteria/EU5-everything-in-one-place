 #Societal Values
 centralization_vs_decentralization: "Централизация — децентрализация"
 centralization_vs_decentralization_desc: "Централизованная держава может быть более эффективной, а децентрализованная более устойчива."
 centralization_focus: "Централизация"
 decentralization_focus: "Децентрализация"
 traditionalist_vs_innovative: "Традиции — инновации"
 traditionalist_vs_innovative_desc: "Традиционалистская держава ставит на первое место стабильность и традиции, а инновационная держава хочет повышать образование населения и быстрее внедрять новые [Concept('institution', 'институты')|e]."
 traditionalist_focus: "Традиции"
 innovative_focus: "Инновации"
 spiritualist_vs_humanist: "Духовность — гуманизм"
 spiritualist_vs_humanist_desc: "Держава с идеями духовности выстраивает существование вокруг ценностей, которые проповедуют [ShowPopTypeName('clergy')|l], а гуманистическая держава гораздо более терпима к [Concept('heretic', 'еретикам')|e] и [Concept('heathen', 'язычникам')|e]."
 spiritualist_focus: "Духовность"
 humanist_focus: "Гуманизм"
 aristocracy_vs_plutocracy: "Аристократия — плутократия"
 aristocracy_vs_plutocracy_desc: "В аристократической державе власть принадлежит представителям «голубых кровей», а в плутократической — самым богатым и влиятельным."
 aristocracy_focus: "Аристократия"
 plutocracy_focus: "Плутократия"
 serfdom_vs_free_subjects: "Крепостничество — личная свобода"
 serfdom_vs_free_subjects_desc: "Держава с высоким уровнем крепостничества стремится эксплуатировать крестьян как можно больше, а держава с развитыми личными свободами относится к крестьянам по-человечески."
 serfdom_focus: "Крепостничество"
 free_subjects_focus: "Личная свобода"
 mercantilism_vs_free_trade: "Меркантилизм — свободная торговля"
 mercantilism_vs_free_trade_desc: "Держава с идеями меркантилизма стремится защищать [Concept('market_price', 'рыночную цену')|e] [Concept('produced_goods', 'производимых в ней товаров')|e], а держава с идеями свободной торговли хочет получать больше выгоды от торговли по всему миру."
 mercantilism_focus: "Меркантилизм"
 free_trade_focus: "Свободная торговля"
 belligerent_vs_conciliatory: "Воинственность — миролюбие"
 belligerent_vs_conciliatory_desc: "Воинственную державу не заботит [Concept('opinion', 'мнение')|e] других [Concept('countries', 'стран')|e]. Миролюбивая держава проводит политику умиротворения других стран, потому что она либо слабее, либо хорошо понимает свою выгоду такой политики."
 belligerent_focus: "Воинственность"
 conciliatory_focus: "Миролюбие"
 quality_vs_quantity: "Качество — количество"
 quality_vs_quantity_desc: "[Concept('army', 'Армия')|e], которая делает ставку на качество, работает над повышением эффективности каждого солдата, а [Concept('army', 'армия')|e], которая делает ставку на количество, старается просто увеличить свою численность."
 quality_focus: "Качество"
 quantity_focus: "Количество"
 offensive_vs_defensive: "Наступление — оборона"
 offensive_vs_defensive_desc: "Держава, которая делает ставку на наступление, предпочитает нападать, используя военные силы в виде [Concept('armies', 'армий')|e] и [Concept('navies', 'флотов')|e] на территории [Concept('enemy', 'вражеских')|e] [Concept('locations', 'районов')|e], а держава, которая делает ставку на оборону, в большей степени полагается на мощь своих [Concept('forts', 'крепостей')|e] для разгрома врага."
 offensive_focus: "Наступление"
 defensive_focus: "Оборона"
 land_vs_naval: "Армия — флот"
 land_vs_naval_desc: "Держава, которая делает ставку на армию, обычно не может похвастаться протяжённой береговой линией, а держава, которая делает ставку на флот, больше значения придаёт своему побережью."
 land_focus: "Армия"
 naval_focus: "Флот"
 capital_economy_focus: "Капитализм"
 traditional_economy_focus: "Традиционализм"
 capital_economy_vs_traditional_economy: "Капитализм — традиционализм"
 capital_economy_vs_traditional_economy_desc: "[Concept('country', 'Держава')|e] с капиталистической экономикой основное внимание уделяет зарабатыванию денег, в частности с помощью [Concept('trade', 'торговли')|e] и развития [Concept('towns_and_cities', 'городов')|e], а держава с традиционной экономикой в большей степени ориентирована на использование природных ресурсов."
 individualism_focus: "Индивидуализм"
 communalism_focus: "Общинность"
 individualism_vs_communalism: "Индивидуализм — общинность"
 individualism_vs_communalism_desc: "Держава с идеями индивидуализма может получить больше персонажей с исключительными способностями, а держава с идеями общинности ставит во главу угла благо всего общества."
 outward_focus: "Открытость"
 inward_focus: "Закрытость"
 outward_vs_inward: "Открытость — закрытость"
 outward_vs_inward_desc: "Открытая [Concept('country', 'держава')|e] больше уделяет внимание взаимодействию с другими [Concept('countries', 'державами')|e], а закрытая сосредоточена на внутренних делах."
 absolutism_focus: "Абсолютизм"
 liberalism_focus: "Либерализм"
 absolutism_vs_liberalism: "Абсолютизм — либерализм"
 absolutism_vs_liberalism_desc: "В абсолютистской державе вся власть сосредоточена в руках правителя, что ограничивает влияние различных сословий, а в либеральной первоочередное внимание уделяется гражданским свободам и законодательным институтам."
 sinicized_focus: "Китаизация"
 unsinicized_focus: "Самобытность"
 sinicized_vs_unsinicized: "Китаизация — самобытность"
 sinicized_vs_unsinicized_desc: "Китаизированная держава находится под влиянием #Y Поднебесной#!, превращаясь фактически в часть её территории, а самобытная самостоятельно определяет свою политику на принадлежащих ей землях."
 mysticism_focus: "Мистицизм"
 jurisprudence_focus: "Правовая система"
 mysticism_vs_jurisprudence: "Мистицизм — легализм"
 mysticism_vs_jurisprudence_desc: "[Concept('country', 'Держава')|e], склоняющаяся к мистицизму в батинистском трактовании, ищет глубинные и скрытые смыслы. Сторонники легализма склоняются к захиритскому трактованию и толкуют Коран и хадисы буквально."
 latinization_focus: "Латинство"
 hellenization_focus: "Романизм"
 latinization_vs_hellenization: "Латинство — Ромейство"
 latinization_vs_hellenization_desc: "[Concept('country', 'Держава')|e], избравшая $latinization_focus$, обращается к латинскому западу — итальянским республикам, франкским дворам и идеям Ренессанса — в поисках поддержки, сотрудничества и обновления посредством дипломатии и частичного принятия. Держава, избравшая $hellenization_focus$, крепко держится за непрерывное римское наследие, поддерживаемое православной верой, институтами имперской администрации и неизменными традициями Константинополя."
