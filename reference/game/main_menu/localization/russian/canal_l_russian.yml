l_russian:
 # Decision category
 DECISION_CATEGORY_INFRASTRUCTURE: "Инфраструктура"
 # CConstruction name/tooltip strings used by CConstruction::GetNameWithNoTooltip
 # and CConstruction::GetTooltip when _IsCanal is set.
 CANAL_CONSTRUCTING: "Строительство канала в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetNameWithNoTooltip]"
 CANAL_CONST_DETAILS_TIP: "Новый судоходный канал, связывающий два моря, будет построен в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetNameWithNoTooltip]."
 # Advances
 suez_canal_advance: "Проект Суэцкого канала"
 suez_canal_advance_desc: "Провести изыскания и приступить к строительству канала через Суэцкий перешеек, чтобы открыть прямой путь между Средиземным и Красным морями."
 panama_canal_advance: "Проект Панамского канала"
 panama_canal_advance_desc: "Провести изыскания и приступить к строительству канала через Панамский перешеек, чтобы связать Атлантический и Тихий океаны."
 # Owncountry actions for restricting / opening canal passage
 close_canal_to_enemies: "Закрыть канал для всех, кроме союзников"
 close_canal_to_enemies_desc: "Разрешить на время войны проход по нашим каналам исключительно союзникам и подданным. Проход врагов блокируется автоматически; нейтральные государства и соперники также блокируются."
 open_canal_to_all: "Открыть канал для всех"
 open_canal_to_all_desc: "Снять ограничения и вновь открыть проход по каналу для всех стран, с которыми мы сейчас не воюем."
 CANAL_LOCATION_DESC: "Судоходный канал пересекает эту местность, открывая проход между морями, которые он соединяет."
 CANAL_LOCATION_RESTRICTED: "Проход в настоящее время ограничен только для союзников и подданных владельца канала."
