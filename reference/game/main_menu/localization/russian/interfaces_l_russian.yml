 MOVE_CAPITAL_DESC: "[Concept('capital', 'Столицу')|e] можно перенести в другой [Concept('location', 'район')|e]. Вот когда это может нам пригодиться.\n$BULLET$Мы обеспечим её безопасность, если перенесём в более защищённое место.\n$BULLET$Мы улучшим распределение [Concept('control', 'контроля')|e], расположив столицу ближе к центру державы.\n$BULLET$Мы повысим контроль над своими берегами, перенеся столицу в прибрежный район.\n$BULLET$Мы можем переместить столицу в [Concept('province', 'провинцию')|e], которая лучше обеспечена [Concept('food', 'пищей')|e] и обладает более высоким пределом [Concept('population', 'населения')|e].\n$BULLET$Если перенести столицу из определённой державы, то мы сможем выделить эту [Concept('country', 'державу')|e].\n$BULLET$Мы сможем улучшить [Concept('market_access', 'доступ к рынку')|e], переместив столицу в [Concept('market_center', 'рыночный центр')|e]."
