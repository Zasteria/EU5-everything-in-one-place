 #GOVERNMENT PANEL
 GOVERNMENT_TAB_TEXT: "Правительство"
 GOVERNMENT_TAB_TT_TEXT: "Это сердце вашего государства — здесь сосредоточена информация о вашем [Concept('ruler', 'правителе')|e] и политическом состоянии вашей [Concept('country', 'державы')|e]. Вкладки этого окна позволят вам просматривать и управлять [Concept('government', 'государственными')|e] делами."
 MISSIONS_TAB_TEXT: "Задания"
 MISSIONS_TAB_TT_TEXT: "На этой вкладке можно просмотреть доступные [Concept('missions', 'задания')|e] и решить, какие стоит выполнить."
 AMBITIONS_TAB_TEXT: "Амбиции"
 AMBITIONS_TAB_TT_TEXT: "На этой вкладке можно просмотреть доступные [Concept('ambitions', 'амбиции')|e] и решить, к каким из них стоит стремиться."
 FORMABLES_TAB_TT_TEXT: "На этой вкладке можно просмотреть, какие страны может [Concept('formable_country', 'создавать')|e] ваша держава."
 BUREAUCRACIES_TAB_TEXT: "Бюрократические механизмы"
 BUREAUCRACIES_TAB_TT_TEXT: "На этой вкладке можно просмотреть доступные [Concept('bureaucracies', 'бюрократические механизмы')|e] и решить, какие из них стоит внедрить."
 MISSIONS_SUBTAB_MISSION_FOCUS: "Направленность задания"
 MISSIONS_SUBTAB_MISSION_FOCUS_TT_TEXT: "Это деревья заданий, соответствующие различным стилям игры."
 MISSIONS_SUBTAB_MISSION_FOCUS_TT_FLAVOR_TEXT: "«Желающего судьба ведёт, нежелающего — тащит»."
 MISSIONS_SUBTAB_CURRENT_TASKS: "Текущие этапы"
 MISSIONS_SUBTAB_CURRENT_TASKS_TT_TEXT: "Это возможные этапы из текущего дерева заданий."
 MISSIONS_SUBTAB_CURRENT_TASKS_TT_FLAVOR_TEXT: "«Делом, а не словом»."
 MODIFIERS_TAB_TEXT: "Модификаторы"
 MODIFIERS_TAB_TT_TITLE: "Модификаторы"
 LIMITED_LEDGER_TABS_TT_TITLE: "Ограниченный журнал"
 MODIFIERS_TAB_TT_TEXT: "На этой вкладке перечислены все [Concept('modifiers', 'модификаторы')|e], влияющие на [Concept('country', 'державу')|e]."
 MODIFIERS_TAB_TT_FLAVOR_TEXT: "TO DO"
 MODIFIERS_SCROLL_LIST_EMPTY: "Нет модификаторов, отвечающих этому критерию"
 #ECONOMY PANEL
 SUBTAB_BALANCE_TT_TEXT: "На этой вкладке можно следить за ежемесячным [Concept('balance', 'балансом')|e] вашей [Concept('country', 'державы')|e], управляя [Concept('income', 'доходом')|e] и [Concept('expenses', 'расходами')|e]."
 SUBTAB_CREDIT_TT_TEXT: "На этой вкладке можно увидеть [Concept('debt', 'долги')|e] и [Concept('loans', 'займы')|e], управлять займами от других [Concept('countries', 'держав')|e] и отслеживать выплаты для вашей [Concept('country', 'державы')|e]."
 SUBTAB_MARKETS_TT_TEXT: "На этой вкладке перечислены [Concept('markets', 'рынки')|e], значимые для вашей экономики."
 SUBTAB_TRADING_TT_TEXT: "На этой вкладке можно управлять [Concept('trades', 'торговыми сделками')|e] и [Concept('trade_orders', 'торговыми приказами')|e], если у вас есть [Concept('merchant_capacity', 'торговый потенциал')|e] на каком-либо [Concept('market', 'рынке')|e]."
 SUBTAB_TARIFFS_TT_TEXT: "На этой вкладке можно настраивать [Concept('tariffs', 'пошлины')|e] и [Concept('subventions', 'субвенции')|e] на [Concept('markets', 'рынках')|e], которыми вы владеете."
 #PRODUCTION PANEL
 BUILDINGS_TAB_TEXT: "Сооружения"
 BUILDINGS_TAB_TT_TEXT: "На этой вкладке можно строить [Concept('buildings', 'сооружения')|e] и управлять их [Concept('production_methods', 'методами производства')|e]."
 GOODS_TAB_TEXT: "Товары"
 GOODS_TAB_TT_TEXT: "На этой вкладке можно отслеживать [Concept('market_balance', 'баланс')|e] [Concept('goods', 'товаров')|e], производимых и потребляемых вашей [Concept('country', 'державой')|e] на различных [Concept('markets', 'рынках')|e].\n\nЗдесь же можно расширять [Concept('resource_gathering_operations', 'добычу ресурсов')|e], доступных вашей [Concept('country', 'державе')]."
 FOOD_TAB_TEXT: "Пища"
 FOOD_TAB_TT_TEXT: "На этой вкладке перечислены сведения о [Concept('food', 'пище')|e] в ваших [Concept('provinces', 'провинциях')|e] и на ваших [Concept('markets', 'рынках')|e]. Здесь же можно попытаться решить проблему с нехваткой [Concept('food', 'пищи')], [Concept('construction', 'возводя')|e] [Concept('food', 'продовольственные')] [Concept('buildings', 'сооружения')|e] или расширяя добычу [Concept('food_raw_materials', 'ресурсов для производства пищи')|e]."
 TOWN_RIGHTS_TT_TEXT: "Здесь можно управлять развитием городов [Concept('country', 'державы')|e]:\nдаровать [Concept('town_rights', 'права')|e] [Concept('towns_or_cities', 'городским районам')|e] и поддерживать промышленность, а также просматривать или сортировать [Concept('locations', 'районы')|e] и провинции на карте."
 #MILITARY PANEL
 UNITS_TAB: "Отряды"
 UNITS_TAB_TT_TEXT: "Здесь можно управлять [Concept('units', 'отрядами')|e], поднимать [Concept('levies', 'ополчение')|e], набирать новые [Concept('armies', 'армии')|e] и [Concept('navies', 'флоты')|e] и вербовать [Concept('mercenaries', 'наёмников')|e]."
 OBJECTIVES_TAB: "Цели"
 OBJECTIVES_TAB_TT_TEXT: "Здесь можно задавать [Concept('military_objectives', 'военные цели')|e] для своих [Concept('units', 'отрядов')|e]."
 CURRENT_ARMIES_TAB: "Армии"
 CURRENT_ARMIES_TAB_TT_TEXT: "На этой вкладке представлены все [Concept('armies', 'армии')|e] под началом этой [Concept('countries', 'державы')|e]. Здесь также можно [Concept('recruit', 'набирать')|e] новые армии."
 CURRENT_NAVIES_TAB: "Флоты"
 CURRENT_NAVIES_TAB_TT_TEXT: "На этой вкладке представлены все [Concept('navies', 'флоты')|e] под началом этой [Concept('countries', 'державы')|e]. Здесь также можно [Concept('recruit', 'набирать')|e] новые флоты."
 #SOCIETY PANEL
 PROMOTION_TOOLTIP_T: "Скорость повышения и понижения групп населения [Player.Custom('CL_GEN')]"
 PROMOTION_TT_TEXT: "Скорость повышения групп населения #ONCLICK:COUNTRY,[Player.Custom('CL_tt')] #TOOLTIP:COUNTRY,[Player.Custom('CL_tt')],X [Player.Custom('CL_GEN')|L]#!#! составляет [Player.GetModifierValueNoFormat('global_pop_promotion_speed_modifier')]"
 LIST_TITLE_PROMOTION: "Скорость повышения групп населения составляет [Player.GetModifierValueWithNoTooltipNoSign('global_pop_promotion_speed_modifier')|V]. Причины:"
 LIST_TITLE_DEMOTION: "Скорость понижения населения составляет [Player.GetModifierValueWithNoTooltipNoSign('global_pop_demotion_speed_modifier')|V]. Причины:"
 #DIPLOMACY PANEL TAB
 DIPLOMACY_RELATIONS_TAB: "Отношения"
 DIPLOMACY_RELATIONS_TAB_TEXT: "Здесь можно управлять [Concept('diplomacy', 'дипломатией')|e] с другими [Concept('countries', 'державами')|e]."
 DIPLOMACY_RELATIONS_TAB_FLAVOR_TEXT: "«В делах людей прилив есть и отлив; с приливом достигаем мы успеха»."
 DIPLOMACY_CURRENT_RELATIONS_TAB: "Текущие отношения"
 DIPLOMACY_CURRENT_RELATIONS_TAB_TEXT: "На этой вкладке приведены все [Concept('treaties', 'договоры')|e], которые вы заключили с другими [Concept('countries', 'державами')|e], а также [Concept('country_interactions', 'взаимодействия с державами')|e]. Здесь же можно выбрать себе [Concept('rivals', 'соперника')|e] и заняться [Concept('diplomacy', 'дипломатией')|e]."
 DIPLOMACY_CURRENT_RELATIONS_TAB_FLAVOR_TEXT: "«Лучшее из лучшего — заставить неприятельское войско покориться без сражения»."
 DIPLOMACY_KNOWN_COUNTRIES_TAB: "Известные державы"
 DIPLOMACY_KNOWN_COUNTRIES_TAB_TEXT: "Здесь перечислены [Concept('discovered', 'открытые')|e] вами [Concept('countries', 'державы')|e]."
 DIPLOMACY_KNOWN_COUNTRIES_TAB_FLAVOR_TEXT: "«Если ты слабый — стань сильным. Если ты сильный — притворись слабым»."
 DIPLOMACY_ACTIONS_TAB: "Действия"
 DIPLOMACY_ACTIONS_TAB_TEXT: "Здесь можно совершать дипломатические действия с другими [Concept('countries', 'державами')|e]."
 DIPLOMACY_ACTIONS_TAB_FLAVOR_TEXT: "«Я делаю для того, чтобы ты сделал»."
 DIPLOMACY_ORGANIZATIONS_TAB: "Объединения"
 DIPLOMACY_ORGANIZATIONS_TAB_TEXT: "Здесь можно просмотреть известные вашей [Concept('country', 'державе')|e] [Concept('international_organizations', 'международные объединения')|e], а также ознакомиться со списком из восьми [Concept('great_powers', 'великих держав')|e] — сильнейших в мире."
 DIPLOMACY_ORGANIZATIONS_TAB_FLAVOR_TEXT: "«Союзы, договоры, доверие людей — всё это может привязать слабого к сильному, но не сильного к слабому»."
 ORGANIZATIONS_KNOWN_TAB: "Известные объединения"
 ORGANIZATIONS_KNOWN_TAB_TEXT: "Здесь перечислены известные вашей [Concept('country', 'державе')|e] [Concept('international_organizations', 'международные объединения')|e]."
 ORGANIZATIONS_KNOWN_TAB_FLAVOR_TEXT: "«Защита влечёт за собой подчинение, а подчинение — защиту»."
 ORGANIZATIONS_GREAT_POWERS_TAB: "Великие державы"
 ORGANIZATIONS_GREAT_POWERS_TAB_TEXT: "Здесь перечислены [Concept('great_powers', 'великие державы')|e] текущей эпохи."
 ORGANIZATIONS_GREAT_POWERS_TAB_FLAVOR_TEXT: "«Я вижу несчастные народы, дрожащие от страха в оковах, человечество, раздавленное стопой угнетателей… И везде сильный вооружён устрашающей силой законов против слабого»."
 #GEOPOLITICS PANEL
 URBANIZATION_TAB: "Урбанизация"
 URBAN_RIGHTS_TAB: "Городские права"
 URBANIZATION_BUILD_CAPITAL_ROADS: "Конструктор дорог державы"
 URBANIZATION_BUILD_CAPITAL_ROADS_DESC: "Позволяет открыть конструктор [Concept('road', 'дорог')|e], чтобы начать планировать и прокладывать дороги из вашей [Concept('capital', 'столицы')|e]."
 PROVINCES_TAB: "Провинции"
 PROVINCES_TAB_TT_TEXT: "Здесь можно увидеть все принадлежащие вам [Concept('provinces', 'провинции')|e]."
 PROVINCES_TAB_TT_FLAVOR_TEXT: "«Кому принадлежит земля, тому она принадлежит до неба и до глубин вод»."
 EXPANSION_TAB: "Открытия"
 EXPANSION_TAB_TT_TEXT: "Здесь можно начать [Concept('exploration', 'экспедицию')|e] в неизученные края и основать [Concept('colonial_charters', 'колониальные поселения')|e]."
 EXPANSION_TAB_TT_FLAVOR_TEXT: "«И дам тебе и потомкам твоим после тебя землю, по которой ты странствуешь»."
 EXPLORATION_TAB: "Экспедиции"
 EXPLORATION_TAB_TT_TEXT: "На этой вкладке можно снаряжать [Concept('exploration', 'экспедиции')|e], чтобы раскрывать тайны [Concept('terra_incognita', 'терра инкогнита')|e]."
 EXPLORATION_TAB_TT_FLAVOR_TEXT: "«Тут обитают драконы!»"
 COLONIAL_TAB: "Колонии"
 COLONIAL_TAB_TT_TEXT: "Здесь можно основывать [Concept('colonial_charters', 'поселения')|e] для [Concept('colonize', 'колонизации')|e] свободных [Concept('provinces', 'провинций')|e] и включать новые земли в состав [Concept('country', 'державы')|e]."
 COLONIAL_TAB_TT_FLAVOR_TEXT: "«Вы же плодитесь и размножайтесь, и распространяйтесь по земле, и умножайтесь на ней»."
 COLONIAL_TAB_TT_TEXT_NOT_THIS_TYPE: "@trigger_no! У вас [Player.GetCountryTypeName|l], вы не можете основывать [Concept('colonial_charters', 'колониальные поселения')|e]."
 MARITIME_TAB: "Морское присутствие"
 MARITIME_TAB_TT_TEXT: "Здесь представлены [Concept('seazones', 'акватории')|e], которые имеют значение для [Concept('country', 'державы')|e] и её [Concept('markets', 'рынков')|e], а также методы борьбы с [Concept('pirates', 'пиратами')|e] и [Concept('privateers', 'каперами')|e] — или использования их услуг себе на пользу."
 MARITIME_TAB_TT_FLAVOR_TEXT: "«Вода же усиливалась и весьма умножалась на земле, и ковчег плавал по поверхности вод»."
 DISEASES_TAB: "Эпидемии"
 DISEASES_TAB_TT_TEXT: "Здесь можно увидеть, какие [Concept('diseases', 'эпидемии')|e] бушуют в вашей [Concept('country', 'державе')|e]."
 DISEASES_TAB_TT_FLAVOR_TEXT: "«И я взглянул, и вот, конь бледный, и на нём всадник, которому имя „смерть“; и ад следовал за ним»."
 CURRENT_OUTBREAKS_TAB: "Текущие вспышки"
 CURRENT_OUTBREAKS_TAB_TT_TEXT: "На этой вкладке можно узнать обо всех [Concept('disease_outbreaks', 'вспышках эпидемии')|e] в мире."
 CURRENT_OUTBREAKS_TAB_TT_FLAVOR_TEXT: "«Пусть пища будет вашим лекарством, а не лекарство — вашей пищей»."
 MARITIME_SUBTAB_COASTS: "Берега"
 MARITIME_SUBTAB_COASTS_TT_TEXT: "Здесь показаны прибрежные [Concept('seazones', 'акватории')|e], имеющие значение для вашей [Concept('country', 'державы')|e]."
 MARITIME_SUBTAB_COASTS_TT_FLAVOR_TEXT: "«Это море великое и пространное: там гады, коим нет числа, животные малые с великими»."
 MARITIME_SUBTAB_PRIVATEERS: "Каперы"
 MARITIME_SUBTAB_PRIVATEERS_TT_TEXT: "На этой вкладке некоторые [Concept('countries', 'державы')|e] могут насылать на врагов [Concept('privateers', 'каперов')|e]."
 MARITIME_SUBTAB_PRIVATEERS_TT_FLAVOR_TEXT: "«Там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём»."
 #LOCATION RIGHT PANEL
 LOCATION_INFRASTRUCTURE_TAB_TT_TITLE: "Инфраструктура"
 LOCATION_INFRASTRUCTURE_TAB_TT_TEXT: "На этой вкладке можно управлять [Concept('buildings', 'сооружениями')|e] [Concept('location', 'района')|e], возводя новые или расширяя в них [Concept('rgo', 'добычу ресурсов')|e]. Кроме того, здесь показывается [Concept('tax_base', 'налоговая база')|e], взаимодействия с [Concept('market', 'рынком')|e] и доступность [Concept('food', 'пищи')|e]."
 LOCATION_INFRASTRUCTURE_TAB_TT_FLAVOR_TEXT: "«Возведение здания позволяет оставить свой след в истории, отражающий амбиции и идеалы. Пусть основание ваших построек будет крепким, чтобы ваше наследие простояло много веков»."
 LOCATION_MILITARY_TAB_TT_TITLE: "Военное дело"
 LOCATION_MILITARY_TAB_TT_TEXT: "На этой вкладке можно просматривать и улучшать [Concept('fortifications', 'укрепления')|e] [Concept('location', 'района')|e], набирать армейское или флотское [Concept('levies', 'ополчение')|e] [Concept('province', 'провинции')|e], а также [Concept('regulars', 'регулярные войска')|e] и [Concept('mercenaries', 'наёмников')|e]."
 LOCATION_MILITARY_TAB_TT_FLAVOR_TEXT: "«Сила не в мечах или пушках, а в крепких стенах и воинах, сжимающих оружие. Пусть ваши крепости и войска станут стальной стеной, оберегающей вашу державу»."
 LOCATION_GOODS_TAB_TT_TITLE: "Товары"
 LOCATION_GOODS_TAB_TT_TEXT: "На этой вкладке отображаются [Concept('goods', 'товары')|e], производство которых вносит вклад в [Concept('wealth', 'богатство')|e] [Concept('location', 'района')|e].\n\nЗдесь же приводятся сведения о [Concept('goods', 'товарах')], чья [Concept('production_efficiency', 'производственная эффективность')|e] в том или ином [Concept('location', 'районе')] повышена благодаря таким [Concept('location_modifier', 'модификаторам')|e], как [Concept('town_rights', 'городские права')|e]."
 LOCATION_GOODS_TAB_TT_FLAVOR_TEXT: "«Не нужно золота ему, когда простой продукт имеет»."
 LOCATION_DEMOGRAPHICS_TAB_TT_TITLE: "Демография"
 LOCATION_DEMOGRAPHICS_TAB_TT_TEXT: "На этой вкладке приведены сведения о #e демографии#! района, в частности, его #e классы#!, [Concept('cultures', 'культуры')|e] и [Concept('religions', 'религии')|e]. Здесь также указаны ежегодный #e прирост [Concept('population', 'населения')|e]#!, [Concept('promotion', 'повышение')|e], [Concept('assimilation', 'ассимиляция')|e] и [Concept('conversion', 'обращение')|e] жителей района."
 LOCATION_DEMOGRAPHICS_TAB_TT_FLAVOR_TEXT: "«Держава — это не только земля, это души всех, кто возделывает землю, торгует, молится и мечтает на ней. Поддерживайте их узы и веру, ибо в них живёт ваше наследие»."
 PROMOTION_TT_LIST_TITLE: "[Concept('promotion', 'Повышение')] в месяц составляет [Location.GetPromote]. Причины:"
 #FOREIGN COUNTRY RIGHT PANEL
 FOREIGN_DIPLOMACY_SUBTAB_TT_TEXT: "На этой вкладке можно просматривать текущие [Concept('treaties', 'договоры')|e] [Concept('country', 'державы')|e] и совершать с ними [Concept('diplomatic_actions', 'дипломатические действия')|e]."
 FOREIGN_COUNTRY_SUBTAB_TT_TEXT: "На этой вкладке приведены сведения о другой [Concept('country', 'державе')|e]."
 FOREIGN_COUNTRY_SUBTAB_TT_FLAVOR: "Если ты не знаешь ни себя, ни врага, ты будешь проигрывать всегда."
 FOREIGN_CHARACTERS_SUBTAB_TT_TEXT: "На этой вкладке можно взаимодействовать с [Concept('characters', 'персонажами')|e] другой [Concept('country', 'державы')|e]."
 FOREIGN_CHARACTERS_SUBTAB_TT_FLAVOR: "Весь мир — театр. В нём женщины, мужчины — все актёры."
