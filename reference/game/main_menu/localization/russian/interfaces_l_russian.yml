 MAPMODE_DIALECT: "#T $mapmode_dialect_name$#!\n$mapmode_common_start$ [Concept('dialect', 'диалекта')|e] их [Concept('dominant_language', 'доминирующего языка')|e]."
 mapmode_language_power_name: "Сила языка"
 MAPMODE_LANGUAGE_POWER: "#T $mapmode_language_power_name$#!\n$mapmode_common_start$ [Concept('language_power', 'силы')|e] [Concept('dominant_language', 'доминирующего языка')|e]."
 mapmode_language_family_name: "Языковые семьи"
