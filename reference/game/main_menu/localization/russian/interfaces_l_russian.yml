 mapmode_selected_goods_name: "Избранные товары"
 MAPMODE_SELECTED_GOODS: "#T $mapmode_selected_goods_name$#!\n[Concept('locations', 'Районы')|e] внутри вашей [Concept('country', 'державы')|e] окрашиваются зелёным, если они [Concept('rgo', 'добывают')|e] избранные [Concept('goods', 'товары')|e], и фиолетовым, если они производят их с помощью [Concept('buildings', 'сооружений')|e]. За пределами вашей державы районы окрашиваются жёлтым, если у них есть излишки избранных товаров, которые вы можете [Concept('trade', 'купить')|e], и красным, если у них нет излишков."
 mapmode_food_name: "Запас пищи в провинции"
 MAPMODE_FOOD: "#T $mapmode_food_name$#!\n$mapmode_common_start$ их [Concept('monthly_food', 'ежемесячного остатка пищи')|e]. Оттенки зелёного показывают, [Concept('selling_food', 'продаёт')|e] провинция пищу, [Concept('buying_food', 'покупает')|e] её или [Concept('starving', 'голодает')|e]."
 mapmode_food_productivity_name: "Эффективность производства пищи"
 MAPMODE_FOOD_PRODUCTIVITY: "#T $mapmode_food_name$#!\n$mapmode_common_start$ их [Concept('food_productivity', 'эффективности производства пищи')|e]. Оттенки зелёного означают положительную эффективность производства, а оттенки красного — отрицательную."
 mapmode_proximity_name: "Досягаемость столицы"
 MAPMODE_PROXIMITY: "#T $mapmode_proximity_name$#!\n$mapmode_common_start$ [Concept('proximity', 'досягаемости')|e] по отношению к [Concept('capital', 'столице')|e] выбранной [Concept('country', 'державы')|e]."
 mapmode_supply_name: "Снабжение"
 MAPMODE_SUPPLY: "#T $mapmode_supply_name$#!\n$mapmode_common_start$ [Concept('supply_limit', 'предела снабжения')|e].\nЕсли не выбрана [Concept('army', 'армия')|e], красный означает низкий, жёлтый — средний, а зелёный — высокий предел снабжения.\nЕсли [Concept('army', 'армия')|e] выбрана, то неспособные поддерживать её [Concept('locations', 'районы')|e] окрашиваются красным, а способные — зелёным. [Concept('location', 'Район')|e], едва способный поддерживать выбранную [Concept('army', 'армию')|e], окрашивается жёлтым."
 mapmode_institution_name: "Институты"
 MAPMODE_INSTITUTION: "#T $mapmode_institution_name$#!\n$mapmode_common_start$ количества присутствующих [Concept('institutions', 'институтов')|e]."
 mapmode_societal_value_name: "Общественная ценность"
 MAPMODE_SOCIETAL_VALUE: "#T $mapmode_societal_value_name$#!\nКаждая [Concept('country', 'держава')|e] окрашивается в зависимости от её отношения к общественной ценности, на которую наведён курсор. Оттенки бирюзового соответствуют сдвигу влево, оттенки фиолетового — сдвигу вправо, а серым отмечены идеально сбалансированные державы и те, для которых нет значения."
 SOCIETAL_VALUE_MAPMODE_NEUTRAL: "Нейтралитет"
 mapmode_tax_base_name: "Налоговая база"
 MAPMODE_TAX_BASE: "#T $mapmode_tax_base_name$#!\n$mapmode_common_start$ [Concept('tax_base', 'налоговой базы')|e]."
 mapmode_net_building_profit_name: "Доход районов"
 MAPMODE_NET_BUILDING_PROFIT: "#T $mapmode_net_building_profit_name$#!\n$mapmode_common_start$ того, насколько они пополняют или опустошают казну владельца."
 mapmode_peasant_enfranchisement_name: "Освобождение простолюдинов"
 MAPMODE_PEASANT_ENFRANCHISEMENT: "#T $mapmode_peasant_enfranchisement_name$#!\n$mapmode_common_start$ степени #TOOLTIP:MODIFIER_TYPE,local_peasant_enfranchisment,X #L освобождения#!#! #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L простолюдинов#!#!."
 mapmode_town_rights_name: "Городские права"
 MAPMODE_TOWN_RIGHTS: "#T $mapmode_town_rights_name$#!\nЭтот цвет окрашивает [Concept('locations', 'районы')|e] в зависимости от того, обладают они какими-либо [Concept('town_rights', 'городскими правами')|e] или нет."
 mapmode_potential_tax_base_name: "Богатство районов"
 MAPMODE_POTENTIAL_TAX_BASE: "#T $mapmode_potential_tax_base_name$#!\n$mapmode_common_start$ [Concept('wealth', 'богатства')|e]."
 mapmode_uncontrolled_wealth_name: "Неконтролируемое богатство"
 MAPMODE_UNCONTROLLED_WEALTH: "#T $mapmode_uncontrolled_wealth_name$#!\n$mapmode_common_start$ [Concept('wealth', 'богатства')|e], потерянного из-за недостатка [Concept('control', 'контроля')|e]. При этом выделяются территории, которые принесут наибольший доход при увеличении [Concept('control', 'контроля')] до 100%.\n\nИными словами, показывает расхождение между [Concept('wealth', 'богатством')|e] и [Concept('tax_base', 'налоговой базой')|e] [Concept('locations', 'районов')]."
 MAPMODE_UNCONTROLLED_WEALTH_TT_HEADER: "[Concept('wealth_with_icon', 'Богатство')|e] ([Multiply_CFixedPoint(Location.GetTotalPossibleTaxBase, Subtract_CFixedPoint('(CFixedPoint)1.0', Location.GetControl))|-2]) в этом [Concept('location', 'районе')] не влияет на [Concept('tax_base_with_icon', 'налоговую базу')|e] из-за низкого [Concept('control', 'контроля')|e]."
 mapmode_missing_control_name: "Недостаток контроля"
 MAPMODE_MISSING_CONTROL: "#T $mapmode_missing_control_name$#!\n$mapmode_common_start$ того, насколько их показатель [Concept('control', 'контроля')|e] далёк от максимального. Таким образом выделяются районы, которые могут выиграть от улучшения [Concept('control', 'контроля')|e]."
 mapmode_economical_base_name: "Экономическая база"
 MAPMODE_ECONOMICAL_BASE: "#T $mapmode_economical_base_name$#!\nОкрашивает $mapmode_common_start$ [Concept('economical_base', 'экономической базы')|e] [Concept('owner', 'владельца')|e]."
 mapmode_integration_name: "Интеграция"
 MAPMODE_INTEGRATION: "#T $mapmode_integration_name$#!\n$mapmode_common_start$ уровня их [Concept('integration', 'интеграции')|e] [Concept('owner', 'владельцем')|e]."
 mapmode_diplomacy_name: "Дипломатия"
 MAPMODE_DIPLOMACY: "#T $mapmode_diplomacy_name$#!\n$mapmode_common_start$ [Concept('diplomatic_capacity_used', 'использованного дипломатического потенциала')|e] [Concept('owner_s', 'владельца')|e] в отношении выбранной [Concept('country', 'державы')|e]. Тёмно-серый цвет показывает, что держава находится за пределами [Concept('diplomatic_range', 'дипломатической дистанции')|e]. Штриховка показывает, является ли [Concept('core', 'район национальным')|e] для выбранной державы."
 mapmode_opinion_name: "Мнение"
 MAPMODE_OPINION: "#T $mapmode_opinion_name$#!\n$mapmode_common_start$ [Concept('opinion', 'мнения')|e] их [Concept('owner_s', 'владельца')|e] в отношении выбранной [Concept('country', 'державы')|e]."
 mapmode_antagonism_name: "Неприязнь"
 MAPMODE_ANTAGONISM: "#T $mapmode_antagonism_name$#!\n$mapmode_common_start$ [Concept('antagonism', 'неприязни')|e] [Concept('owner_s', 'владельца')|e] к выбранной [Concept('country', 'державе')|e]."
 mapmode_threat_name: "Угроза"
 MAPMODE_THREAT: "#T $mapmode_opinion_name$#!\n$mapmode_common_start$ от уровня [Concept('threat', 'угрозы')|e], которую представляет их [Concept('owner_s', 'владелец')|e] для выбранной [Concept('country', 'державы')|e]."
 mapmode_naval_range_name: "Мореходная дистанция"
 MAPMODE_NAVAL_RANGE: "#T $mapmode_naval_range_name$#!\nОкрашивает пути по расстоянию от нашей [Concept('country', 'державы')|e]. Бирюзовым отмечены [Concept('ports', 'порты')|e] и [Concept('seazones', 'акватории')|e], граничащие с нашими [Concept('locations', 'районами')|e]; зелёные и жёлтые территории находятся в пределах [Concept('naval_range', 'мореходной дистанции')|e] (от нуля до 100% максимальной дистанции); красные лежат вне [Concept('naval_range', 'мореходной дистанции')|e]. Подсказки показывают расстояние и долю дистанции."
 mapmode_prosperity_name: "Процветание"
 MAPMODE_PROSPERITY: "#T $mapmode_prosperity_name$#!\n$mapmode_common_start$ их [Concept('prosperity', 'процветания')|e]. Положительное процветание обозначается оттенками зелёного, а отрицательное — оттенками красного."
 mapmode_location_modifiers_name: "Модификаторы района"
 MAPMODE_LOCATION_MODIFIERS: "#T $mapmode_location_modifiers_name$#!\nОкрашивает все [Concept('location', 'районы')|e] с долговременными модификаторами, будь то особый для района модификатор или постоянный модификатор, наложенный на него. Районы, где нет таких модификаторов, остаются неокрашенными."
 MAPMODE_LOCATION_MODIFIERS_NONE: "Здесь нет ничего особенного"
 LEGEND_KEY_LOCATION_MODIFIERS_PRESENT: "Есть долговременный модификатор"
 LEGEND_KEY_LOCATION_MODIFIERS_NONE: "Нет"
 mapmode_migration_name: "Миграция"
 migration_attraction: "Миграционная привлекательность"
 MAPMODE_MIGRATION: "#T $mapmode_migration_name$#!\n$mapmode_common_start$ их [Concept('migration_attraction', 'миграционной привлекательности')|e]. Зелёным окрашиваются те районы, куда [Concept('pops', 'группы населения')|e] хотят переселиться, а красным те районы, которые они хотят покинуть."
 mapmode_development_name: "Развитие"
 MAPMODE_DEVELOPMENT: "#T $mapmode_development_name$#!\n$mapmode_common_start$ их [Concept('development', 'развития')|e], где степень развития соответствует яркости зелёного цвета."
 mapmode_satisfaction_name: "Довольство населения"
 MAPMODE_SATISFACTION: "#T $mapmode_satisfaction_name$#!\n$mapmode_common_start$ среднего [Concept('pop_satisfaction', 'довольства группы населения')|e], по возрастанию от красного до зелёного."
 mapmode_assimilation_name: "Ассимиляция"
 MAPMODE_ASSIMILATION: "#T $mapmode_assimilation_name$#!\n$mapmode_common_start$ местной скорости [Concept('assimilation', 'ассимиляции')|e] и [Concept('culture', 'культуры')|e], в которую ассимилируется население."
 mapmode_area_name: "Области"
 MAPMODE_AREA: "#T $mapmode_area_name$#!\n$mapmode_common_start$ [Concept('area', 'области')|e], к которой они относятся."
 mapmode_language_name: "Доминирующие языки"
 MAPMODE_LANGUAGE: "#T $mapmode_language_name$#!\n$mapmode_common_start$ [Concept('dominant_language', 'доминирующего языка')|e]."
