 #MARKET RIGHT PANEL
 MARKET_GOODS_SUBTAB_TT_TEXT: "На этой вкладке можно увидеть [Concept('supply', 'предложение')|e] и [Concept('demand', 'спрос')|e] на все [Concept('goods', 'товары')|e], представленные на [Concept('market', 'рынке')|e]."
 MARKET_FOOD_SUBTAB_TT_TEXT: "На этой вкладке можно увидеть все [Concept('provinces', 'провинции')|e], [Concept('buying_food', 'покупающие')|e] или [Concept('selling_food', 'продающие пищу')|e] на этом [Concept('market', 'рынке')|e]."
 MARKET_REGION_TT_TITLE: "Региональная экономика"
 MARKET_REGION_TT_TEXT: "На этой вкладке приведена сводная информация о товарной экономике различных рынков.\nПо умолчанию здесь отображаются рынки, видимые из #L #TOOLTIP:LOCATIONRANK,[SelectedMarketLateralView.GetMarket.GetCenterLocation.Custom('LR_tt')],X [SelectedMarketLateralView.GetMarket.GetCenterLocation.Custom('LR_GEN')|l]#!#! [SelectedMarketLateralView.GetMarket.GetShortName]."
 MARKET_TRADES_SUBTAB_TT_TEXT: "На этой вкладке перечислены все [Concept('trades', 'торговые сделки')|e] по [Concept('exporting', 'экспорту')|e] или [Concept('importing', 'импорту')|e] [Concept('goods', 'товаров')|e] на этот [Concept('market', 'рынок')|e] или из него."
 MARKET_COUNTRIES_SUBTAB_TT_TEXT: "На этой вкладке перечислены все [Concept('countries', 'державы')|e], [Concept('trading', 'торгующие')|e] на этом [Concept('market', 'рынке')|e]. Их [Concept('merchant_power', 'торговое преимущество')|e] определяет, какую долю [Concept('goods', 'товаров')|e] они способны заполучить для своих [Concept('trades', 'торговых сделок')|e] в случае, если этих товаров не хватает на все [Concept('countries', 'державы')|e]."
 MARKET_TRADE_ORDERS_SUBTAB_TT_TEXT: "Здесь можно управлять [Concept('trade_orders', 'торговыми приказами')|e] для этого [Concept('market', 'рынка')|e], автоматически направляя товары на импорт или экспорт без указания конечной цели."
 SEAZONE_TAB_TT_TEXT: "На этой вкладке перечислены [Concept('countries', 'державы')|e] с [Concept('maritime_presence', 'морским присутствием')|e] в этой [Concept('seazone', 'акватории')|e], а также действующие в этой области [Concept('pirates', 'пираты')|e]."
 GOOD_OVERVIEW_SUBTAB_TT_TEXT: "На этой вкладке перечислены возможные источники и способы применения этого [Concept('good', 'товара')|e]."
 GOOD_SOURCES_SUBTAB_TT_TEXT: "На этой вкладке перечислены все [Concept('locations', 'районы')|e], где производится этот [Concept('good', 'товар')|e]."
 GOOD_MARKETS_SUBTAB_TT_TEXT: "На этой вкладке указано положение этого [Concept('good', 'товара')|e] на всех известных [Concept('markets', 'рынках')|e]."
 REBEL_POPS_TAB_NAME: "Поддерживающие группы населения"
 REBEL_POPS_TAB_TT_TEXT: "На этой вкладке перечислены все [Concept('pops', 'группы населения')|e], поддерживающие эту фракцию [Concept('rebel', 'мятежников')|e]."
 REBEL_LOCATIONS_TAB_TT_TEXT: "На этой вкладке перечислены все [Concept('locations', 'районы')|e] вашей [Concept('country', 'державы')|e], где есть [Concept('pops', 'группы населения')|e], присоединившиеся к этой фракции [Concept('rebel', 'мятежников')|e]."
