 #Bulgaria
 STATIC_MODIFIER_NAME_bul_patron_of_bulgarias_revival: "Покровитель возрождения Болгарии"
 STATIC_MODIFIER_DESC_bul_patron_of_bulgarias_revival: "Наш правитель беспрестанно потворствует возрождению народного искусства, культуры и науки, стремясь к тому, чтобы сам Симеон Великий мог гордиться этой державой."
 STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople: "Завоеватель Константинополя"
 STATIC_MODIFIER_DESC_bul_conqueror_of_constantinople: "Под стенами Константинополя стояло много великих завоевателей прошлого — и Крум, и Симеон, — однако ни один из них не сумел водрузить там болгарское знамя. Но там, где они потерпели поражение, мы победили; наш правитель навеки покрыл себя славой, и этот триумфальный титул будет служить потомкам напоминанием о подвиге."
 STATIC_MODIFIER_NAME_bul_unrecognized_imperial_title: "Непризнанная империя"
 STATIC_MODIFIER_DESC_bul_unrecognized_imperial_title: "Наш имперский титул признают на родине, однако другие державы сомневаются в его легитимности и считают, что мы незаслуженно купаемся в лучах славы."
 STATIC_MODIFIER_NAME_bul_powerful_local_elites: "Влиятельные местные элиты"
 STATIC_MODIFIER_DESC_bul_powerful_local_elites: "Этим районом правят могущественные и во многом независимые элиты, что подрывает наш контроль над областью, а вместе с ним — и легитимность короны."
 STATIC_MODIFIER_NAME_bul_diplomatic_reintegration: "Дипломатическая реинтеграция"
 STATIC_MODIFIER_DESC_bul_diplomatic_reintegration_desc: "Некогда отделённые от Болгарии земли необходимо вернуть под нашу власть. Мы положим конец раздробленности дипломатическим путём — нет необходимости вновь проливать кровь."
 STATIC_MODIFIER_NAME_bul_mutineers_in_the_army: "Беспорядок в армии"
 STATIC_MODIFIER_DESC_bul_mutineers_in_the_army: "Солдаты, не получающие жалование и потому бунтующие и сеющие повсюду беспорядок, — источник угрозы, возможно, для всей державы."
 STATIC_MODIFIER_NAME_bul_unpaid_garrison: "Гарнизон без жалования"
 STATIC_MODIFIER_DESC_bul_unpaid_garrison: "Защитники крепости не получают причитающиеся им деньги, а потому отлынивают от обязанностей и тем самым ослабляют нашу оборону."
 STATIC_MODIFIER_NAME_bul_unhappy_marriage: "Несчастный брак"
 STATIC_MODIFIER_DESC_bul_unhappy_marriage: "Не сумев выстроить по-настоящему тёплые и близкие отношения с супругой, царь Иван Александр стал крайне огорчённым и даже озлобленным, что мешает ему заниматься государственными делами и, как следствие, ослабляет его власть. Более того, многие в окружении царя опасаются, что подобные душевные муки вредят не только его разуму, но и телу."
 #Bosnia
 STATIC_MODIFIER_NAME_bos_devils_student: "Ученик дьявола"
 STATIC_MODIFIER_DESC_bos_devils_student: "Нам выпала исключительная возможность вернуть себе независимость. Такая благородная цель оправдывает любые возможные средства."
 STATIC_MODIFIER_NAME_affirmation_of_biljno_polje: "Приверженность Билинопольским соглашениям"
 STATIC_MODIFIER_DESC_affirmation_of_biljno_polje: "Мы прилюдно подтвердили свою приверженность соглашениям, подписанным в Билино Поле. Такой шаг успокоит врагов церкви, а также позволит нам и дальше втайне жить по прежним обычаям."
 STATIC_MODIFIER_NAME_roman_culture_movement_momentum_waning: "Угасающий миг"
 STATIC_MODIFIER_DESC_desc_roman_culture_movement_momentum_waning: "Народ, который поначалу был готов встречать новую [Concept('culture', 'культуру')|e] с распростёртыми объятиями, постепенно начинает от неё уставать."
 STATIC_MODIFIER_NAME_roman_culture_movement_momentum_waning_locally: "Угасающий миг на местности"
 STATIC_MODIFIER_DESC_desc_roman_culture_movement_momentum_waning_locally: "Народ, который поначалу был готов встречать новую [Concept('culture', 'культуру')|e] с распростёртыми объятиями, постепенно начинает от неё уставать."
 STATIC_MODIFIER_NAME_hellenism_religion_movement_momentum_waning: "Угасающий интерес"
 STATIC_MODIFIER_DESC_desc_hellenism_religion_movement_momentum_waning: "Восторг населения по поводу платонического возрождения начинает угасать."
 STATIC_MODIFIER_NAME_hellenism_religion_movement_momentum_waning_locally: "Угасающий интерес в этом районе"
 STATIC_MODIFIER_DESC_desc_hellenism_religion_movement_momentum_waning_locally: "Интерес местных жителей к платоническому возрождению начинает остывать."
 STATIC_MODIFIER_NAME_hellenism_religion_movement_suppressed: "Подавление платонического возрождения"
 STATIC_MODIFIER_DESC_hellenism_religion_movement_suppressed: "Власти начали подавлять платоническое возрождение, усилив сопротивление его распространению."
