 STATIC_MODIFIER_DESC_bavaria_internal_division: "Нам пришлось пойти на значительные уступки нашим противникам в Баварии, чтобы предотвратить полномасштабный конфликт."
 STATIC_MODIFIER_NAME_bav_reinheitsgebot: "Баварский закон о чистоте пива"
 STATIC_MODIFIER_DESC_bav_reinheitsgebot: "Согласно баварскому закону о чистоте пива при производстве напитка разрешено использовать только ячмень, хмель и воду. Эти строгие правила гарантируют качество пива, стабилизируют цены, а также снижают спрос на пшеницу, которая необходима для выпечки хлеба. Таким образом, закон способствует росту популярности баварского пива, развитию торговли и повышению довольства населения, одновременно принося государству доход от процветающей пивоваренной промышленности."
