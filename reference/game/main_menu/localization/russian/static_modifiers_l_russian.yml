 STATIC_MODIFIER_NAME_efficient_mining_expansion_plans_modifier: "Планы эффективного развития горной промышленности"
 STATIC_MODIFIER_NAME_benefits_from_mining_discoveries_modifier: "Преимущества открытий ценных месторождений"
 STATIC_MODIFIER_DESC_cas_catalan_crackdown: "Введение Унии оружия позволяет испанским войскам на время снизить недовольство среди каталонцев."
 STATIC_MODIFIER_DESC_cas_naples_crackdown: "Усиленное присутствие испанских войск позволяет на время снизить недовольство."
 STATIC_MODIFIER_DESC_pilgrim_ruler: "Этот правитель совершил Великое паломничество по святым местам католического христианского мира, завершившееся у Гроба Господня в Иерусалиме, и почитается среди верующих до конца своих дней. Престиж и легитимность, обретённые благодаря этому подвигу, сохраняются ещё долго после завершения самого странствия."
