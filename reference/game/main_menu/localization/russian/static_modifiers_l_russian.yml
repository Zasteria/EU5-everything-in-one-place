 STATIC_MODIFIER_NAME_cossacks_estate_head_of_cabinet_influence: "Глава совета из казаков"
 STATIC_MODIFIER_DESC_crown_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета легитимность правителей в державе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_nobles_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние аристократов при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_burghers_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние горожан при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_clergy_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние священников при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_peasants_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние крестьян при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_dhimmi_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние зимми при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_tribes_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние племён при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_DESC_cossacks_estate_head_of_cabinet_influence: "Благодаря происхождению нашего главы совета влияние казаков при дворе укрепляется.\n\n#Y Этот [Concept('modifier', 'модификатор')|e] исчезнет, как только [Concept('head_of_the_cabinet', 'глава совета')|e] покинет [Concept('cabinet', 'совет')|e].#!"
 STATIC_MODIFIER_NAME_assume_fort_command_modifier: "Командование местной обороной"
 STATIC_MODIFIER_DESC_assume_fort_command_modifier: "Местные силы самообороны возглавляет опытный генерал, что значительно усложняет оккупацию района."
 STATIC_MODIFIER_NAME_neglected_peasantry: "Позабытые крестьяне"
 STATIC_MODIFIER_DESC_neglected_peasantry: "Никому нет дела до крестьян, стонущих под тяжестью налогов."
 STATIC_MODIFIER_NAME_abuses_by_estates: "Сословные злоупотребления"
 STATIC_MODIFIER_DESC_abuses_by_estates: "Сословия бесстыдно грабят страну, прикрываясь своими свободами."
