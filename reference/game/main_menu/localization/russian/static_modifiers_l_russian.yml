 STATIC_MODIFIER_DESC_development_of_the_artillery: "#italic  Мы получим дополнительные [Concept('events', 'события')|e], связанные с #Y  артиллерией#!.#!\n\nНаше государство решило принять активное участие в развитии артиллерии и методов её производства. По этой причине наши расходы на выплавку и обслуживание пушек увеличатся, но знания, которые мы получим в этой области, будут быстрее распространяться в нашей державе.\n\n#Y  Мы потеряем этот модификатор после внедрения [Concept('institution', 'института')|e] #TOOLTIP:INSTITUTION,artillery_institution,X #L «Артиллерия»#!#!.#!"
