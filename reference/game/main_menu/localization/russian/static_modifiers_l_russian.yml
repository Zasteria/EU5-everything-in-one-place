 #Orthodoxy
 STATIC_MODIFIER_NAME_orthodox_clerical_proceedings_modifier: "Вопросы церкви"
 STATIC_MODIFIER_DESC_orthodox_clerical_proceedings_modifier: "Внимательно изучив дела нашего духовенства, мы сможем повысить его эффективность."
 STATIC_MODIFIER_NAME_orthodox_clerical_taxation_modifier: "Налогообложение духовных лиц"
 STATIC_MODIFIER_DESC_orthodox_clerical_taxation_modifier: "Наши #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L священники#!#! должны платить справедливые налоги в соответствии с законами нашей страны."
 STATIC_MODIFIER_NAME_orthodox_conversion_efforts_modifier: "Обращение иноверцев"
 STATIC_MODIFIER_DESC_orthodox_conversion_efforts_modifier: "Борьба за построение благочестивого общества — наш приоритет в религиозных вопросах."
 STATIC_MODIFIER_NAME_orthodox_spiritual_literature_and_understanding_modifier: "Обмен богословскими знаниями"
 STATIC_MODIFIER_DESC_orthodox_spiritual_literature_and_understanding_modifier: "Нам следует изучать труды иноземных авторов Запада и Востока, чтобы лучше понимать окружающий мир."
 STATIC_MODIFIER_NAME_orthodox_cabinet_eff_modifier: "Православные обряды в совете"
 STATIC_MODIFIER_DESC_orthodox_cabinet_eff_modifier: "Высокие духовные стандарты для советников гарантируют, что люди на государственных должностях будут принимать благочестивые законы."
 STATIC_MODIFIER_NAME_orthodox_cabinet_examinations_modifier: "Экзамены для чиновников"
 STATIC_MODIFIER_DESC_orthodox_cabinet_examinations_modifier: "Расширение администрации позволит нам существенно повысить эффективность государственного управления, придерживаясь канонов веры."
 STATIC_MODIFIER_NAME_orthodox_protect_the_faith_modifier: "Защита веры"
 STATIC_MODIFIER_DESC_orthodox_protect_the_faith_modifier: "Призыв на борьбу с язычниками и еретиками звучит подобно музыке для нашего народа, всегда готового встать на защиту веры и отечества."
 STATIC_MODIFIER_NAME_patriarch_increase_baptism_modifier: "Массовые крещения"
 STATIC_MODIFIER_DESC_patriarch_increase_baptism_modifier: "Наша сострадательная церковь готова приобщать к славе Господней даже язычников. Для этого она устраивает обширные крещения, чтобы свет Божий коснулся каждого."
 STATIC_MODIFIER_NAME_patriarch_sponsors_monasteries_modifier: "Монастыри на средства патриарха"
 STATIC_MODIFIER_DESC_patriarch_sponsors_monasteries_modifier: "Если Христос — душа церкви, то священники — её плоть и кровь. Патриарх разрешает и помогает строить новые монастыри, чтобы ничто не препятствовало развитию церкви."
 STATIC_MODIFIER_NAME_patriarch_improved_relations_modifier: "Обрадованная делегация патриарха"
 STATIC_MODIFIER_DESC_patriarch_improved_relations_modifier: "Делегация от патриарха оказалась глубоко впечатлена нашей державой. Молва о великолепии и гостеприимстве нашей страны доходит даже до самых далёких уголков мира."
 STATIC_MODIFIER_NAME_patriarch_rally_population_modifier: "Религиозный пыл"
 STATIC_MODIFIER_DESC_patriarch_rally_population_modifier: "Мы — рабы Христовы и слуги Его церкви. Наш народ готов встать грудью на защиту родной веры — настолько вдохновляющими оказались слова делегации патриарха."
 STATIC_MODIFIER_NAME_patriarch_peace_modifier: "Мирные размышления"
 STATIC_MODIFIER_DESC_patriarch_peace_modifier: "Делегация патриарха напомнила людям о слове Христовом и призвала как следует задуматься над его толкованием."
 #Generic Greek
 STATIC_MODIFIER_NAME_influential_strategos: "Влиятельный стратиг"
 STATIC_MODIFIER_DESC_influential_strategos: "Одержанные этим персонажем победы стали легендами, которые вдохновляют всех, вне зависимости от положения в обществе."
 STATIC_MODIFIER_NAME_increased_italian_privileges: "Расширенные привилегии для иностранцев"
 STATIC_MODIFIER_DESC_increased_italian_privileges: "Купцы в этом районе получили более широкую автономию, а иностранные торговцы стекаются к нам, чтобы создать здесь новые рынки."
 STATIC_MODIFIER_NAME_strengthened_crown_control: "Усиление прямого управления"
 STATIC_MODIFIER_DESC_strengthened_crown_control: "Вместо того чтобы позволять каждому купцу заявлять права на участки в этом районе, мы приняли хрисовул, защищающий интересы государства."
 STATIC_MODIFIER_NAME_lesser_italian_privileges: "Сокращённые привилегии для иностранцев"
 STATIC_MODIFIER_DESC_lesser_italian_privileges: "Мы пересмотрели привилегии, которые предоставляются иностранным купцам. Теперь они приносят пользу в первую очередь государству."
 STATIC_MODIFIER_NAME_favored_hellenic_ways: "Предпочтение ромейства"
 STATIC_MODIFIER_DESC_favored_hellenic_ways: "Мы не допустим, чтобы в нашем обществе укоренились западные традиции. Вместо этого мы будем потворствовать традициям, которые соответствуют эллинскому духу."
 STATIC_MODIFIER_NAME_favored_latin_ways: "Предпочтение латинизма"
 STATIC_MODIFIER_DESC_favored_latin_ways: "Интерес нашей державы к западному укладу столь велик, что мы решили отдать предпочтение именно ему."
 STATIC_MODIFIER_NAME_greek_culture_new_generation: "Новое поколение — новый порядок"
 STATIC_MODIFIER_DESC_greek_culture_new_generation: "Старая гвардия цепляется за безнадёжно устаревшие порядки. Вместо неё мы отдадим предпочтение свежей крови — возможно, свежий взгляд принесёт больше пользы."
 STATIC_MODIFIER_NAME_greek_culture_allowed_corrupt_cabinet: "Не наказаны продажные чиновники"
 STATIC_MODIFIER_DESC_greek_culture_allowed_corrupt_cabinet: "Мы решили не изгонять способных государственных мужей, замаравших себе руки взяточничеством. Они останутся на своих постах — пусть даже их недобросовестность угрожает державе."
 STATIC_MODIFIER_NAME_greek_culture_polis_influence_in_court: "Влияние полисов"
 STATIC_MODIFIER_DESC_greek_culture_polis_influence_in_court: "Многочисленные полисы нашей державы обрели заметное влияние, затрудняя тем самым успешное проведение дискуссий в парламенте."
 STATIC_MODIFIER_NAME_greek_culture_allowed_translations_of_old_latin_works: "Разрешён перевод латинских трудов"
 STATIC_MODIFIER_DESC_greek_culture_allowed_translations_of_old_latin_works: "Мы медленно, но верно трудимся над переводом старых латинских текстов, чтобы к ним мог приобщиться простой народ."
 STATIC_MODIFIER_NAME_greek_culture_promotion_of_trade: "Содействие торговле"
 STATIC_MODIFIER_DESC_greek_culture_promotion_of_trade: "Благодаря денежной поддержке от государства этот район лучше других подходит купцам, которые ищут выгодные возможности."
 STATIC_MODIFIER_NAME_greek_culture_recent_aid_during_wartime: "Помощь пограничным войскам"
 STATIC_MODIFIER_DESC_greek_culture_recent_aid_during_wartime: "$a_akritai$, несущие службу в этом районе, получили помощь и теперь с более высокой вероятностью смогут отразить нападение врага."
 STATIC_MODIFIER_NAME_greek_culture_reinforced_akritai: "Подкрепление для акритов"
 STATIC_MODIFIER_DESC_greek_culture_reinforced_akritai: "$a_akritai$, несущие службу в этом районе, получили ещё больше помощи и теперь по-настоящему готовы к бою."
 STATIC_MODIFIER_NAME_greek_culture_slow_collapse_of_defences: "Медленный распад обороны"
 STATIC_MODIFIER_DESC_greek_culture_slow_collapse_of_defences: "$a_akritai$ в этом районе пренебрегают своими обязанностями пограничной стражи — им не хватает помощи со стороны государства."
 STATIC_MODIFIER_NAME_greek_culture_decline_of_meditteranean_trade: "Упадок средиземноморской торговли"
 STATIC_MODIFIER_DESC_greek_culture_decline_of_meditteranean_trade: "Благодаря открытию Нового Света стали известны новые торговые пути, из-за чего важность этого района снизилась."
 STATIC_MODIFIER_NAME_greek_culture_influential_polis: "Влиятельный полис"
 STATIC_MODIFIER_DESC_greek_culture_influential_polis: "Значимость этого района для государства выросла благодаря появлению здесь новых людей."
 STATIC_MODIFIER_NAME_greek_culture_mystras_scholarship_teachings_spread: "Распространение учения школы Мистраса"
 STATIC_MODIFIER_DESC_greek_culture_mystras_scholarship_teachings_spread: "До этого района дошли учения школы Мистраса, благодаря чему взгляды местного населения на окружающий мир стали шире."
