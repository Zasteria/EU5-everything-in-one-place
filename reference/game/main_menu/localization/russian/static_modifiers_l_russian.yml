 #Cape Route to India modifiers
 STATIC_MODIFIER_NAME_cape_route_pioneer: "Пионеры мыса Доброй Надежды"
 STATIC_MODIFIER_DESC_cape_route_pioneer: "Наш флот впервые в истории обогнул мыс Доброй Надежды и доплыл до Индии, открыв прямой путь к рынкам восточных пряностей в обход всех посредников между нашей территорией и Малабарским побережьем."
 STATIC_MODIFIER_NAME_cape_route_established: "Установлен маршрут в обход мыса Доброй Надежды"
 STATIC_MODIFIER_DESC_cape_route_established: "Наши фейтории на африканском побережье — это плацдарм нашей торговой сети в Индийском океане, снабжающий её припасами и разведывательными данными."
 STATIC_MODIFIER_NAME_portuguese_african_network: "Португало-африканская торговая сеть"
 STATIC_MODIFIER_DESC_portuguese_african_network: "Цепочка фейторий и торговых постов вдоль африканского побережья обеспечивают нам главенство в торговле через Южную Атлантику и Индийский Океан."
 STATIC_MODIFIER_NAME_east_africa_trade_dominance: "Главенство в торговле в Восточной Африке"
 STATIC_MODIFIER_DESC_east_africa_trade_dominance: "Наша широкая сеть укреплённых фейторий, простирающаяся от мыса Доброй Надежды до Малинди, обеспечивает Португалии эффективный контроль над всей тоговлей у побережья Восточной Африки. Мы наконец-то потеснили арабские торговые дома, господствовавшие здесь на протяжении столетий."
 STATIC_MODIFIER_NAME_calicut_trade_rights: "Торговые права Каликута"
 STATIC_MODIFIER_DESC_calicut_trade_rights: "Официальное торговое соглашение с заморином Каликута предоставляет нашим торговцам привилегированный доступ к самому обширному рынку пряностей в Индоокеанском регионе."
 STATIC_MODIFIER_NAME_east_india_intelligence: "Информация об Индийском океане"
 STATIC_MODIFIER_DESC_east_india_intelligence: "Знания, полученные нами от опытного индоокеанского мореплавателя, обеспечивают нашим лоцманам и торговцам значительное преимущество над конкурентами в водах к востоку от мыса Доброй Надежды."
 STATIC_MODIFIER_NAME_kongo_diplomatic_contact: "Дипломатические связи с королевством Конго"
 STATIC_MODIFIER_DESC_kongo_diplomatic_contact: "Дипломатическиие связи с могущественным маниконго открывают перед нами широкие возможности для торговли, миссионерской деятельности и политического влияния в Центральной Африке."
 STATIC_MODIFIER_NAME_mozambique_trading_rights: "Торговые права Мозамбика"
 STATIC_MODIFIER_DESC_mozambique_trading_rights: "Заключённое соглашение с султаном острова Мозамбик обеспечивает нашим торговцам доступ к одному из наиболее выгодно расположенных портов в Индийском океане."
 STATIC_MODIFIER_NAME_malindi_alliance: "Союз с Малинди"
 STATIC_MODIFIER_DESC_malindi_alliance: "Султан Малинди — надёжный друг Португалии, предоставляющий нам лоцманов, информацию и безопасные гавани для наших флотов в Индийском океане."
 STATIC_MODIFIER_NAME_gold_coast_feitoria: "Фактория Золотого Берега"
 STATIC_MODIFIER_DESC_gold_coast_feitoria: "Укреплённая фактория на Золотом Берегу открывает нашим купцам прямой доступ к торговле золотом с аканскими государствами, минуя арабских и вангарских посредниках, долгое время контролировавших эти рынки."
 #Relic expedition: per-relic rewards
 STATIC_MODIFIER_NAME_relic_true_cross: "Реликвия «Животворящий крест»"
 STATIC_MODIFIER_DESC_relic_true_cross: "Часть Животворящего креста, утерянного для христиан со времён катастрофы при Хаттине полтораста лет назад, наконец-то вернулась домой. Её присутствие во главе марширующей колонны или в соборе над главным алтарём придаёт душевных сил каждому воину истинной веры и служит напоминанием о потерях врагов нашей державы."
 STATIC_MODIFIER_NAME_relic_crown_of_thorns: "Реликвия «Терновый венец»"
 STATIC_MODIFIER_DESC_relic_crown_of_thorns: "Терновый венец, возложенный римскими солдатами на голову Христа, на протяжении столетий хранился в часовне византийских императоров, теперь у нас. О диинастия, обладающей столь бесценной реликвией, не раз будет упомянуто в хрониках, и сам Святой престол будет вынужден считаться с нею."
 STATIC_MODIFIER_NAME_relic_holy_lance: "Реликвия «Копьё Лонгина»"
 STATIC_MODIFIER_DESC_relic_holy_lance: "Копьё римского центуриона Лонгина, которым он по преданию поразил в бок Иисуса Христа, распятого на кресте. Оно было найдено в ходе осады Антиохии во времена Первого крестового похода, и теперь оно у нас. Наши солдаты, глядя на него, вспоминают о подвигах своих воодушевленных этой реликвией пра-прадедов."
 #Arctic Passage modifiers
 STATIC_MODIFIER_NAME_northwest_passage_found: "Северо-Западный проход проложен"
 STATIC_MODIFIER_DESC_northwest_passage_found: "Наша экспедиция прошла морем к северу от американского континента, тем самым подтвердив существование Северо-Западного прохода. Благодаря полученным знаниям снаряжение последующих экспедиций на север будет обходиться дешевле; кроме того, перед нами открываются новые возможности для торговли на дальнем севере."
 STATIC_MODIFIER_NAME_arctic_expedition_returned: "Опыт исследования Арктики"
 STATIC_MODIFIER_DESC_arctic_expedition_returned: "Хотя проход не был пройден полностью. экспедиция вернулась с подробными картами северных морей и новыми знаниями о мореходстве во льдах, которые будут крайне ценны для последующих экспедиций."
 #Pacific Crossing modifiers
 STATIC_MODIFIER_NAME_manila_galleon_route: "Маршрут манильского галеона"
 STATIC_MODIFIER_DESC_manila_galleon_route: "Наш флот впервые пересёк Тихий океан, проложив западный морской маршрут на Острова пряностей и Филиппины. Полученные в ходе этой экспедиции знания открывают Тихий океан для стабильной торговли и снижают стоимость содержания экспедиционных флотов."
 STATIC_MODIFIER_NAME_southern_return_route: "Южный обратный маршрут"
 STATIC_MODIFIER_DESC_southern_return_route: "$STATIC_MODIFIER_DESC_manila_galleon_route$"
 #Grand Tour modifiers
 STATIC_MODIFIER_NAME_returned_from_grand_tour: "Возвращение из большого путешествия"
 STATIC_MODIFIER_DESC_returned_from_grand_tour: "Этот персонаж завершил тур по великим городам Италии, посетил их библиотеки, побывал при дворах и воочию увидел шедевры искусства и достижения науки эпохи Ренессанса. Этот опыт значительно расширил его кругозор, что в дальнейшем позволит ему принимать более взвешенные решения."
 STATIC_MODIFIER_NAME_hajji_pilgrim: "Хаджи"
 STATIC_MODIFIER_DESC_hajji_pilgrim: "Этот персонаж совершил хадж — паломничество в Мекку — и теперь до конца своих дней будет почитаться среди правоверных как «хаджи». Значимость и престиж этого духовгого подвига надолго останутся в памяти."
 STATIC_MODIFIER_NAME_leading_hajj_caravan: "Возглавляет хадж"
 STATIC_MODIFIER_DESC_leading_hajj_caravan: "Этот персонаж ведёт в Мекку караван паломников."
 STATIC_MODIFIER_NAME_hajj_pious_return: "Благословения хаджа"
 STATIC_MODIFIER_DESC_hajj_pious_return: "Возвращение правителя из Мекки укрепило духовные силы истинно верующих и улучшило положение священства при дворе."
 #Steppe Embassy modifiers
 STATIC_MODIFIER_NAME_steppe_recognised_military: "Признание среди степных дворов"
 STATIC_MODIFIER_DESC_steppe_recognised_military: "До великих ханств дошла молва, что такую силу не стоит сбрасывать со счетов. Степной двор отдал нам дань уважения, что должно будет перерасти в практические выгоды для нас на приграничных территориях."
 STATIC_MODIFIER_NAME_steppe_contact_established: "Дипломатические связи со степными дворами"
 STATIC_MODIFIER_DESC_steppe_contact_established: "Наши послы были приняты с большими почестями по всем правилам делового этикета. Теперь у нас налажены связи с одной из великих держав-преемниц Монгольской империи, и наша репутация на Востоке значительно улучшилась."
 STATIC_MODIFIER_NAME_steppe_trade_agreement: "Торговое соглашение со степными дворами"
 STATIC_MODIFIER_DESC_steppe_trade_agreement: "Заключённое со степным двором торговое соглашение открывает перед нами наземные торговые маршруты в глубь Азии и обеспечивает нашим купцам присутствие на рынках, прежде закрытых для них."
 STATIC_MODIFIER_NAME_steppe_embassy_cooldown: "Недавнее посольство в степи"
 STATIC_MODIFIER_DESC_steppe_embassy_cooldown: "Наша дипломатическая миссия к степным дворам вернулась домой совсем недавно. Если практически сразу за ней последует повторная миссия, это будет расценено как назойливость."
 STATIC_MODIFIER_NAME_led_steppe_embassy: "Возглавлял посольство в степи"
 STATIC_MODIFIER_DESC_led_steppe_embassy: "Этот правитель провёл долгие месяцы в путешествии к одному из великих дворов Азии, вёл переговоры на чужеземном наречии и столкнулся с совершенно иными обычаями, чем у себя на родине. Каким бы ни был исход его миссии, этот опыт значительно расширил горизонты его мировоззрения."
 STATIC_MODIFIER_NAME_eastern_alliance_persia: "Союз персов против османов"
 STATIC_MODIFIER_DESC_eastern_alliance_persia: "Мы достигли взаимопонимания с двором шаха в том, что суннитская держава, расположенная между нами, является враждебной для нас обоих. Хотя этот союз не является официальным и нас разделяет огромное расстояние, перспектива войны на два фронта должна умерить амбиции османов при том, что нам это вообще ничего не будет стоить."
 STATIC_MODIFIER_NAME_eastern_alliance_ethiopia: "Связи с королём-христианином"
 STATIC_MODIFIER_DESC_eastern_alliance_ethiopia: "Мы восстановили контакт с древним христианским царством Хэбэша, тем самым подтвердив распространённые на Западе легенды о пресвитере Иоанне. Негус — наш брат во Христе, пускай и далёкий, и духовная значимость этой вновь установленной связи, несомненно, укрепит положение нашей собственной церкви и найдёт отражение в летописях."
 STATIC_MODIFIER_NAME_eastern_route_open: "Открыт Восточный торговый путь"
 STATIC_MODIFIER_DESC_eastern_route_open: "Торговая концессия между нами и одним из восточных дворов дала нашим торговцам возможность присутствия на прежде недоступных рынках и обеспечила стабильные поставки предметов роскоши по новым каналам в обход посредников."
 STATIC_MODIFIER_NAME_led_eastern_alliance_embassy: "Возглавлял посольство к восточным дворам"
 STATIC_MODIFIER_DESC_led_eastern_alliance_embassy: "Этот правитель пересёк пустыни и моря, чтобы вести переговоры с шахом или негусом на равных условиях. Опыт дипломатических отношений с правителями стран совершенно иного уклада, чем в Европе, значительно углубил его понимание тонкостей государственного управления."
 #Survey expeditions
 STATIC_MODIFIER_NAME_accurate_charts: "Точные карты"
 STATIC_MODIFIER_DESC_accurate_charts: "Наши побережья были тщательно исследованы, и мы составили их детальные карты с указанием всех тихих гаваней и возможных источников опасностей. Эти карты сохранят актуальность на протяжении как минимум целого поколения, что снизит стоиость снаряжения экспедиций и позволит отправлять их быстрее."
 STATIC_MODIFIER_NAME_thorough_survey: "Возвратилась экспедиция горноразведчиков"
 STATIC_MODIFIER_DESC_thorough_survey: "Группа рудоискателей вернулась с записями и образцами обнаруженных горных пород. Составленные ими карты уже переданы всем начальникам шахт в государстве, а организаторы работ ознакомились с новыми техниками добычи, опробованными исследователями. Теперь все каменоломни, карьеры и шахты державы станут еще эффективнее снабжать её ценным сырьем."
 #Seven Cities of Gold: in-search country modifiers
 STATIC_MODIFIER_NAME_searching_for_el_dorado: "Поиски Эльдорадо"
 STATIC_MODIFIER_DESC_searching_for_el_dorado: "Экспедиция, отправленная в бассейн реки Ориноко, пытается отыскать легендарного «золотого короля» муисков."
 STATIC_MODIFIER_NAME_searching_for_fountain_of_youth: "Поиски источника вечной молодости"
 STATIC_MODIFIER_DESC_searching_for_fountain_of_youth: "На Флориду в район обитания народа тимукуа была снаряжена экспедиция, перед которой поставлена задача отыскать «Фонтан Бимини» — источник, по преданиям дарующий вечную молодость."
 STATIC_MODIFIER_NAME_searching_for_city_of_caesars: "Поиски Города Цезарей"
 STATIC_MODIFIER_DESC_searching_for_city_of_caesars: "Снаряжённая в Патагонию экспедиция ищет затерянный город, по преданиям расположенный где-то среди тамошних гор."
 #Seven Cities of Gold: per-city location modifiers (applied to the city's tile on discovery)
 STATIC_MODIFIER_NAME_el_dorado_discovered: "Эльдорадо открыто"
 STATIC_MODIFIER_DESC_el_dorado_discovered: "Золотое царство муисков теперь открыто для испанской торговли. Из величественных и поистине огромных горных мастерских, с которыми не сравнится ни одна в Европе, золото буквально течёт рекой в нашу новую факторию у священного озера инков."
 STATIC_MODIFIER_NAME_fountain_of_youth_discovered: "Источник вечной молодости найден"
 STATIC_MODIFIER_DESC_fountain_of_youth_discovered: "Мы нашли источник в самом сердце земли народа тимукуа и подтвердили его целительные свойства, точь-в-точь, как говорилось в легендах. У источника мы построили часовню, и к нему уже началось паломничество."
 STATIC_MODIFIER_NAME_city_of_caesars_discovered: "Город Цезарей открыт"
 STATIC_MODIFIER_DESC_city_of_caesars_discovered: "Заетрянный Город Цезарей был обнаружен в потаённой долине в Патагонских Андах; его жители — потомки переселенцев, потерпевших кораблекрушение ещё в XVI веке. Подданные нашей державы вернулись под власть короны, а с ними и огромные запасы серебра, которые они успели добыть за несколько поколений жизни в изоляции от остального мира."
 #Mining survey: per-raw-material discoveries
 STATIC_MODIFIER_NAME_rich_iron_seam: "Пласт богатой железной руды"
 STATIC_MODIFIER_DESC_rich_iron_seam: "Рудоискатели обнаружили пласт богатой железной руды, уходчщий далеко в глубь горы. Окрестные кузни и плавильни будут обеспечены работой на поколение вперёд."
 STATIC_MODIFIER_NAME_rich_copper_lode: "Богатая медная жила"
 STATIC_MODIFIER_DESC_rich_copper_lode: "В холмах была обнаружена богатая медная жила; характерный зелёный налёт на горных камнях хорошо виден даже с дороги, пролегающей в долине. Плавильни уже приступили к работе."
 STATIC_MODIFIER_NAME_rich_tin_lode: "Богатая оловянная жила"
 STATIC_MODIFIER_DESC_rich_tin_lode: "Рудоискатели прошли вдоль оловянной жилы, начинающейся от дна ручья, и дошли до холмов, где пласт руды оказался значительно толще и чище. Бронзоделы хорошо заплатят за эту находку."
 STATIC_MODIFIER_NAME_rich_lead_seam: "Пласт богатой свинцовой руды"
 STATIC_MODIFIER_DESC_rich_lead_seam: "В холмах был обнаружен вышедший на поверхность пласт галенита — тёмные кристаллы с характерным серебристым блеском ни с чем не спутать. Трубы, кровельные листы и литеры для книгопечатания теперь обойдутся дешевле как минимум целому поколению."
 STATIC_MODIFIER_NAME_rich_silver_vein: "Богатая серебряная жила"
 STATIC_MODIFIER_DESC_rich_silver_vein: "Рудоискатели нашли крупную жилу самородного серебра, добывать которое проще простого — только маши киркой. Монетный двор еще долго не будет испытывать недостатка в серебряных слитках."
 STATIC_MODIFIER_NAME_rich_gold_strike: "Богатое месторождение золота"
 STATIC_MODIFIER_DESC_rich_gold_strike: "Рудоискатели обнаружили богатое месторождение золота в кварцевой жиле — вкрапления драгоценного металла в кристаллах кварца ярко блестят на свету. Чеканщикам золотой монеты не придётся сидеть без работы."
 STATIC_MODIFIER_NAME_productive_coal_seam: "Рабочий угольный пласт"
 STATIC_MODIFIER_DESC_productive_coal_seam: "В здешних холмах залегает толстый угольный пласт, выходящий на поверхность в двух местах, что облегчит его разработку. Кузни, солеварни и стекольные мастерские теперь надолго обеспечены ценным горючим, и нам не придётся наращивать вырубку леса."
 STATIC_MODIFIER_NAME_productive_stone_quarry: "Производительная каменоломня"
 STATIC_MODIFIER_DESC_productive_stone_quarry: "В холмах открылась новая каменоломня; добываемый в ней камень легко обтёсывается и крепко держится в кладке. Все соборы и куртины в окрестности сотни миль будут обеспечены камнем на поколение вперёд."
 STATIC_MODIFIER_NAME_productive_marble_quarry: "Производительный мраморный карьер"
 STATIC_MODIFIER_DESC_productive_marble_quarry: "В уединённоё лощине были обнаружены залежи прожилкованного мрамора наивысшего качества. Каменотёсы уже режут его на блоки для отправки в столицу. На целое поколение вперёд у архитекторов и ваятелей не будет недостатка в материале."
 STATIC_MODIFIER_NAME_productive_gem_pit: "Богатые залежи самоцветов"
 STATIC_MODIFIER_DESC_productive_gem_pit: "На дне ручья рудоискатели нашли гальку с вкраплениями драгоценных камней; выше по течению на холмистом склоне обнаружился и их источник — минеральный карман. Гранильщики камней теперь обеспечены работой на поколение вперёд."
 STATIC_MODIFIER_NAME_productive_mercury_mine: "Богатый ртутный рудник"
 STATIC_MODIFIER_DESC_productive_mercury_mine: "В нагорьях были обнаружены залежи киновари — эту ярко-красную ртутную руду ни с чем не спутать. Алхимики, пробирщики и золотых дел мастера теперь на поколение вперёд обеспечены бесценным для своего ремесла жидким металлом."
 STATIC_MODIFIER_NAME_productive_salt_mine: "Богатая соляная шахта"
 STATIC_MODIFIER_DESC_productive_salt_mine: "В нагорьях обнаружили крупные залежи каменной соли — их нашли по солоноватой воде ручейков, на дне которых соляные пласты выходили на поверхность. Это отличная новость для кулинаров и торговцев солониной."
 STATIC_MODIFIER_NAME_productive_alum_workings: "Богатые квасцовые прииски"
 STATIC_MODIFIER_DESC_productive_alum_workings: "В холмистой местности рудоискатели обнаружили пласты квасцовых сланцев. Камень давно выветрился, и осталась чистая соль, за которую красильщики готовы будут отдать любые деньги. Это отличная новость для производителей тканей."
 STATIC_MODIFIER_NAME_productive_saltpeter_workings: "Богатые залежи селитры"
 STATIC_MODIFIER_DESC_productive_saltpeter_workings: "В неприметной лощине после весеннего половодья рудоискатели обнаружили на камнях характерные белые кристаллы селитры, целый пласт которой залегал неглубоко под землёй. Теперь держава ещё долго не будет испытывать недостатка в порохе."
 #Cartographic survey: per-raw-material coastal discoveries
 STATIC_MODIFIER_NAME_surveyed_fishing_grounds: "Карты рыбных промыслов"
 STATIC_MODIFIER_DESC_surveyed_fishing_grounds: "Разведывательное судно составило подробные карты местных рыбных промыслов с указанием направлений сезонных миграций рыбы, глубин обитания рыбных косяков и береговых течений. Теперь местные рыбаки, ранее полагавшиеся только на привычку и чутьё, вооружены самыми современными знаниями."
 STATIC_MODIFIER_NAME_surveyed_lumber_coast: "Карты лесистых берегов"
 STATIC_MODIFIER_DESC_surveyed_lumber_coast: "Наши топографы исходили вдоль и поперёк все прибрежные леса и отметили наилучшие места для вырубки мачтовых сосен и корабельного дуба, а также нанесли на карту речки, по которым брёвна удобнее всего сплавлять на побережье. Корабельные верфи теперь на целое поколение вперёд будут обеспечены древесиной наилучшего качества."
 STATIC_MODIFIER_NAME_surveyed_salt_pans: "Карты солончаков"
 STATIC_MODIFIER_DESC_surveyed_salt_pans: "Разведывательное судно составило подробную карту всех солончаков, солёных источников и соляных отмелей вдоль побережья. Теперь у солеваров и торговцев солью дела пойдут в гору."
 STATIC_MODIFIER_NAME_surveyed_pearl_beds: "Карты жемчужных банок"
 STATIC_MODIFIER_DESC_surveyed_pearl_beds: "Исследователи обнаружили у побережья жемчужные банки и нанесли на карты их местоположение и глубину, а также отметили наилучшие места и сезоны добычи жемчуга. У придворных ювелиров теперь ещё долго не будет недостатка в жемчуге чистой воды."
 STATIC_MODIFIER_NAME_surveyed_vineyard_coast: "Карты прибрежных виноградников"
 STATIC_MODIFIER_DESC_surveyed_vineyard_coast: "Топографы вместе с виноделами объехали все прибрежные холмы, отметили наилучшие склоны для возделывания винограда и наиболее удобные места для погрузки бочек с вином на корабли. Виноторговля в державе на поколение вперёд станет активнее и прибыльнее."
 STATIC_MODIFIER_NAME_surveyed_dye_coast: "Карты мест добычи красителей на побережье"
 STATIC_MODIFIER_DESC_surveyed_dye_coast: "Топографы обнаружили колонии мурексов-багрянок, рощи кермесового дуба, места произрастания индиго и другие источники природных красителей и нанесли их на точные карты. Для торговцев тканями эта информация будет на вес золота."
 STATIC_MODIFIER_NAME_surveyed_amber_coast: "Карты залежей янтаря на побережье"
 STATIC_MODIFIER_DESC_surveyed_amber_coast: "Топографы нанесли на карты места, где после штормов море выносит на берег янтарь, отдельно обозначив наиболее перспективные из них в плане добычи. У городских янтарщиков теперь долго не будет недостатка в материале для работы."
 #Cartographic survey: generic harbor improvements
 STATIC_MODIFIER_NAME_surveyed_safe_harbour: "Карта тихой гавани"
 STATIC_MODIFIER_DESC_surveyed_safe_harbour: "Наши картографы обнаружили укромную бухту, о которой давно знали местные моряки, но не обозначенную на картах. Теперь, когда у нас есть информация о подводных течениях в бухте, ее глубине и местах, где кораблям удобнее всего будет встать на якорь, её можно будет эффективно использовать для крупных морских грузоперевозок."
 STATIC_MODIFIER_NAME_surveyed_reef_passage: "Карты прохода через рифы"
 STATIC_MODIFIER_DESC_surveyed_reef_passage: "Наши картографы обнаружили проход через прибрежные рифы и нанесли его на карты с обозначениями точек захода с моря и выхода к берегу. Теперь путь к гавани для прибывающих в неё кораблей значительно сократится, что, в свою очередь, поможет капитанам судов сэкономить время и провизию."
 STATIC_MODIFIER_NAME_surveyed_smugglers_cove: "Карта бухты контрабандистов"
 STATIC_MODIFIER_DESC_surveyed_smugglers_cove: "Наши исследователи обнаружили бухту, которой до сих пор не было на картах. Выяснилось, что её давно и активно используют контрабандисты, о чём были уведомлены местные власти. Торговцы согласились «выйти из тени» и продолжить свою деятельность уже под эгидой короны при условии, что им позволят сохранить свои склады; кроме того, в торговле теперь прибавится рабочих рук, что тоже пойдёт на пользу державе."
 STATIC_MODIFIER_NAME_culture_tradition_power: "Сила [Concept('cultural_tradition', 'культурных традиций')|e]"
 STATIC_MODIFIER_NAME_culture_influence_power: "Сила [Concept('cultural_influence', 'культурного влияния')|e]"
 STATIC_MODIFIER_NAME_center_of_authority_ruins_modifier: "Развалины администрации"
 STATIC_MODIFIER_NAME_gag_winner_timer: "Победа в борьбе #TOOLTIP:SITUATION,guelphs_and_ghibellines,X #L гвельфов и гибеллинов#!#!"
 STATIC_MODIFIER_NAME_giving_inheritance_contract: "Заключён договор о наследовании"
 STATIC_MODIFIER_NAME_receiving_inheritance_contract: "Договор о наследовании"
 STATIC_MODIFIER_NAME_recently_defaulted: "Недавний отказ от обязательств перед заимодавцем"
 STATIC_MODIFIER_DESC_recently_defaulted: "Мы отказались признать свои долги перед одним из наших заимодавцев. Торговые партнёры и ссудодатели, разумеется, возьмут это на заметку."
 #Iberian Cultural Events
 STATIC_MODIFIER_NAME_iberian_culture_songs_of_the_reconquista_battle: "Песни о Реконкисте"
 STATIC_MODIFIER_DESC_iberian_culture_songs_of_the_reconquista_battle: "О наших военных подвигах в народе стали слагать песни, прославляющие храбрость наших солдат — это ещё больше поднимет их боевой дух на полях сражений."
 STATIC_MODIFIER_NAME_iberian_culture_songs_of_the_reconquista_recruitment: "Песни о Реконкисте"
 STATIC_MODIFIER_DESC_iberian_culture_songs_of_the_reconquista_recruitment: "О наших военных подвигах в народе стали слагать песни, прославляющие храбрость наших солдат — это привлечёт к нам ещё больше людей, готовых сражаться за наше дело."
 STATIC_MODIFIER_NAME_iberian_culture_mudejar_physicians: "Мудехарские врачи"
 STATIC_MODIFIER_DESC_iberian_culture_mudejar_physicians: "Невзирая на протесты духовенства, мы решили официально назначить опытнейших мудехарских врачей на должность придворных лекарей."
 STATIC_MODIFIER_NAME_iberian_culture_christian_physicians: "Врачи-христиане"
 STATIC_MODIFIER_DESC_iberian_culture_christian_physicians: "Врачи-христиане значительно уступают своим мудехарским коллегам в лекарском искусстве, но священство уверено, что для придворного лекаря преданность христианской вере важнее врачебных талантов."
 STATIC_MODIFIER_NAME_iberian_culture_whitewashed_houses: "Побелённые дома"
 STATIC_MODIFIER_DESC_iberian_culture_whitewashed_houses: "Местные дома были побелены известью — это спасает от жары и якобы защищает от болезней."
 STATIC_MODIFIER_NAME_iberian_culture_fishing_brotherhood: "Рыбацкое братство"
 STATIC_MODIFIER_DESC_iberian_culture_fishing_brotherhood: "Рыбацкое братство — фундамент местной общины; оно способствует её росту и развитию за счёт повышения эффективности вылова рыбы."
 STATIC_MODIFIER_NAME_POR_into_the_beyond: "За горизонт"
 STATIC_MODIFIER_DESC_POR_into_the_beyond: "Посулы богатств Востока и надежда встретить в далёких землях братьев во Христе побудили наших сограждан отправиться на поиски неизведанных земель."
 STATIC_MODIFIER_NAME_POR_restorer: "[Select_CString(Character.IsFemale, 'Восстановительница', 'Восстановитель' )]"
 STATIC_MODIFIER_DESC_POR_restorer: "Показав себя достойным правителем в ходе войны за независимость, он заслужил от подданных неофициальный титул 'O Restaurador' — «Восстановитель Португалии»."
 STATIC_MODIFIER_NAME_POR_brazilian_gold_rush: "Бразильская золотая лихорадка"
 STATIC_MODIFIER_DESC_POR_brazilian_gold_rush: "Открытие в Бразилии крупных залежей драгоценных металлов побудило переселенцев со всей страны перебраться в Новый Свет в поисках богатства."
 STATIC_MODIFIER_NAME_POR_encourage_brazilian_slavery: "Одобрение рабства в Бразилии"
 STATIC_MODIFIER_DESC_POR_encourage_brazilian_slavery: "Поскольку наши рудники в Бразилии сильно зависят от принудительного труда, мы не должны мешать бандейрантам использовать местное население в качестве рабочей силы."
 STATIC_MODIFIER_NAME_POR_discourage_brazilian_slavery: "Неодобрение рабства в Бразилии"
 STATIC_MODIFIER_DESC_POR_discourage_brazilian_slavery: "Несмотря на то что наши рудники в Бразилии сильно зависят от принудительного труда, мы не должны поощрять использование рабского труда местного населения."
 STATIC_MODIFIER_NAME_POR_emerald_hunter: "Охотник за изумрудами"
 STATIC_MODIFIER_DESC_POR_emerald_hunter: "После громкого успеха своей экспедиции Диаш получил историческое прозвище «Охотник за изумрудами»."
 STATIC_MODIFIER_NAME_enforcing_sovereignty_modifier: "Установление суверенитета"
 STATIC_MODIFIER_NAME_flo_societas_alum_mine: "Societas Aluminum"
 STATIC_MODIFIER_DESC_flo_societas_alum_mine: "Флорентийская компания обеспечивает повышенный объём добычи квасцов из этих месторождений."
 #Generic Decisions
 STATIC_MODIFIER_NAME_thalassocracy_striving_modifier: "Установление талассократии"
 STATIC_MODIFIER_DESC_thalassocracy_striving_modifier: "Мы твёрдо решили установить своё владычество над морями."
 STATIC_MODIFIER_NAME_thalassocracy_achieved_modifier: "Владычество над морями"
 STATIC_MODIFIER_DESC_thalassocracy_achieved_modifier: "Мы владычествуем над морями."
 STATIC_MODIFIER_NAME_asian_trade_boom_modifier: "Индийская торговая компания"
 STATIC_MODIFIER_DESC_asian_trade_boom_modifier: "Наши усилия подкрепляются притоком товаров с зарубежных рынков."
