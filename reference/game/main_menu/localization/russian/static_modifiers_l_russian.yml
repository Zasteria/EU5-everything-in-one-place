 STATIC_MODIFIER_NAME_good_omen_modifier: "Добрые знамения"
 STATIC_MODIFIER_DESC_good_omen_modifier: "Время обновления, благоприятная погода и обилие пищи — всё это добрые знаки, ниспосланные богами."
