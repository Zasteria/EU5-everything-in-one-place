 STATIC_MODIFIER_DESC_heavy_rain_in_location: "Над этим районом прошёл атмосферный фронт, вызвав проливные дожди."
 STATIC_MODIFIER_NAME_storm_surge_in_location: "Внезапная буря"
 STATIC_MODIFIER_DESC_storm_surge_in_location: "Этот район сильно пострадал от внезапной бури."
 STATIC_MODIFIER_NAME_high_winds_in_location: "Урон от ветров"
 STATIC_MODIFIER_DESC_high_winds_in_location: "Ветра в этом районе особенно сильны."
 STATIC_MODIFIER_NAME_sandstorm_in_location: "Песчаная буря"
 STATIC_MODIFIER_DESC_sandstorm_in_location: "Этот район пострадал от песчаной бури."
