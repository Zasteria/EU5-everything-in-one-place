l_russian:
 ####################################################
 # M1 Forecast Row
 ####################################################
 COLONY_FORECAST_ETA_LINE: "#T Ожидание#! Около $MONTHS|v0$ мес. до следующего поселения.\nОценка зависит от текущего [Concept('migration', 'миграционного')|e] потока в эту колонию и изменится, если приток пересенецев ускорится или замедлится."
 COLONY_FORECAST_ETA_LINE_SHORT: "~$MONTHS|v0$ мес."
 COLONY_FORECAST_ETA_UNKNOWN: "#T Ожидание#!\nДля этой колонии пока не существует источника [Concept('migration', 'миграции')|e]. Оценка появится, когда начнут прибывать поселенцы."
 COLONY_FORECAST_ETA_UNKNOWN_SHORT: "Ожидание"
 BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants!"
 BOTTLENECK_SOURCE_DEPLETED_TT: "#T Замедление: исчерпан источник#!\nМы исчерпали источник переселенцев. В районах, откуда в эту колонию прибывали #TOOLTIP:POPTYPE,peasants,X #L крестьяне#!#!, закончились лишние люди, поэтому [Concept('migration', 'миграция')|e] замедлится, пока не будет найден новый источник."
 BOTTLENECK_GOODS: "@warning_icon! @goods!"
 BOTTLENECK_GOODS_TT: "#T Замедление: дефицит товаров#!\nЭтой колонии не хватает припасов. Она получает менее 75% необходимых [Concept('goods', 'товаров')|e], из-за чего может поддерживать меньше новых поселенцев."
 BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence!"
 BOTTLENECK_MARITIME_TT: "#T Замедление: ограниченное морское присутствие#!\nПереселенцы должны преодолеть море, чтобы достичь это колонии, а наше [Concept('maritime_presence', 'морское присутствие')|e] в регионе слишком мало, чтобы перевозить их в полной мере."
 BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration!"
 BOTTLENECK_LOW_MIGRATION_TT: "#T Замедление: низкая миграция#!\nНемногие среди нас готовы переселяться в колонии. Наша [Concept('migration', 'миграция')|e] слишком низка, чтобы обеспечить стабильный приток переселенцев."
 ####################################################
 # M2 Milestone Messages
 ####################################################
 COLONIAL_CHARTER_FIRST_FLIP_SETUP: "Когда первый район колониальной провинции заселяется нашими колонистами."
 COLONIAL_CHARTER_FIRST_FLIP_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_TITLE: "Первое поселение в районе $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_DESC: "Наши колонисты в провинции $PROVINCE$ создали аванпост в районе $LOCATION$, и первый участок [Concept('colonial_charter', 'колониального поселения')|e] $CHARTER$ перешёл под власть нашей короны."
 COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "За этим первым шагом последуют другие."
 COLONIAL_CHARTER_FIRST_FLIP_LOG: "Первое поселение на земле $CHARTER$: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_BTN1: "Вперёд!"
 COLONIAL_CHARTER_FIRST_FLIP_BTN2: "OK"
 COLONIAL_CHARTER_FIRST_FLIP_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_MAP: ""
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "Когда заселяется первый район колониальной провинции другой державы."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "Первое поселение в районе $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "Держава $COUNTRY$ создала аванпост в районе $LOCATION$ провинции $PROVINCE$, и первый участок [Concept('colonial_charter', 'колониального поселения')|e] $CHARTER$ перешёл под власть её короны."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "За этим первым шагом могут последовать другие."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "Первое поселение державы $COUNTRY$ на земле $CHARTER$: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN1: "Ясно."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN2: "OK"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_MAP: ""
 COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "Когда в источнике миграции колониального поселения заканчиваются крестьяне, и он выбирается заново."
 COLONIAL_CHARTER_SOURCE_DEPLETED_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "Источник поселения $CHARTER$ исчерпан"
 COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "В источнике миграции в [Concept('colonial_charter', 'колониальное поселение')|e] $CHARTER$ провинции $PROVINCE$ закончились #TOOLTIP:POPTYPE,peasants,X #L крестьяне#!#!. Новый источник найден, но может потребоваться время, чтобы восстановить прогресс."
 COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "Даже самый глубокий колодец может пересохнуть."
 COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "Источник миграции в поселение $CHARTER$ исчерпан"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN1: "Печально."
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN2: "OK"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_MAP: ""
 COLONIAL_CHARTER_HALFWAY_SETUP: "Когда прогресс колониального поселения превышает 50%."
 COLONIAL_CHARTER_HALFWAY_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_TITLE: "Провинция $PROVINCE$ наполовину колонизирована"
 COLONIAL_CHARTER_HALFWAY_DESC: "Наша колонизация провинции $PROVINCE$ через [Concept('colonial_charter', 'колониальное поселение')|e] $CHARTER$ наполовину завершена."
 COLONIAL_CHARTER_HALFWAY_FLAVOR: "Половина пути пройдена, начинается самое сложное, но дорога назад уже длиннее дороги вперёд."
 COLONIAL_CHARTER_HALFWAY_LOG: "$CHARTER$ на полпути"
 COLONIAL_CHARTER_HALFWAY_BTN1: "Продолжайте."
 COLONIAL_CHARTER_HALFWAY_BTN2: "OK"
 COLONIAL_CHARTER_HALFWAY_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_MAP: ""
 COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "Когда прогресс колониального поселения другой державы превышает 50%."
 COLONIAL_CHARTER_HALFWAY_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "Провинция $PROVINCE$ наполовину колонизирована"
 COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "Колонизация провинции $PROVINCE$ державой $COUNTRY$ через [Concept('colonial_charter', 'колониальное поселение')|e] $CHARTER$ наполовину завершена."
 COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "Половина пути пройдена, но самое сложное только начинается."
 COLONIAL_CHARTER_HALFWAY_OTHER_LOG: "$CHARTER$ на полпути ($COUNTRY$)"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN1: "Ясно."
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN2: "OK"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_OTHER_MAP: ""
 ####################################################
 # M3 Self-Sustaining Pill
 ####################################################
 COLONY_PILL_SELF_SUSTAINING: "#G Самообеспечение#!"
 COLONY_PILL_OPERATING_AT_LOSS: "#R В убыток#!"
 COLONY_SELF_SUSTAINING_HEADER: "Самообеспечение"
 COLONY_OPERATING_AT_LOSS_HEADER: "Работает в убыток"
 COLONY_SELF_SUSTAINING_INCOME: "Ежемесячный доход: $VAL|+=$@gold!"
 COLONY_SELF_SUSTAINING_EXPENSE: "Ежемесячные расходы: #R -$VAL|2$@gold!#!"
 COLONY_SELF_SUSTAINING_RESULT: "#italic Колония вышла на самообеспечение, поскольку ежемесячный баланс в размере $BALANCE|+=2$@gold! не ниже порогового значения в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
 COLONY_OPERATING_AT_LOSS_RESULT: "#italic Колония приносит убытки, поскольку ежемесячный баланс в размере $BALANCE|+=2$@gold! ниже порогового значения в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
 COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "Ежемесячные расходы × резерв: $EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"
 ####################################################
 # M4/M5/M6 Helpful Actions Hints
 ####################################################
 COLONY_HELPFUL_ACTIONS_TITLE: "Полезные [Concept('cabinet_actions', 'действия совета')|e]"
 COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "Три [Concept('cabinet_actions', 'действия совета')|e] ускоряют рост колониального поселения:\n - Поддержка миграции\n - Отправка людей в колонии\n - Заселение приграничья\n\n#weak Нажмите, чтобы перейти к этим действиям.#!"
 COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "Три [Concept('cabinet_actions', 'действия совета')|e] способствуют развитию недавно колонизированного района:\n - Усиление контроля\n - Развитие провинции\n - Поддержка миграции\n\n#weak Нажмите, чтобы перейти к этим действиям.#!"
 COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "Два [Concept('cabinet_actions', 'действия совета')|e] способствуют росту колониальной нации:\n - Отправка людей в колонии\n - Развитие провинции\n\n#weak Нажмите, чтобы перейти к этим действия.#!"
