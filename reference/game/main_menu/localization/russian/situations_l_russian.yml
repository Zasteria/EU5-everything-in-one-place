 IW_TENSION_LABEL: "Напряжённость"
 iw_tension_25_tt: "#T При 25 ед. [Concept('situation_tension', 'напряжённости')|e]#! \n$BULLET$Открывается действие «[ShowGenericActionName('fortify_key_location')]». Участники лиги могут укреплять важные города и горные тропы, получая прибавку к защите.\n$BULLET$Открывается действие «[ShowCountryInteractionName('italian_wars_bribe_country')]». Лидер лиги может потратить [Concept('gold_with_icon', 'дукаты')|e], чтобы завербовать #TOOLTIP:REGION,italy_region,X #L итальянскую#!#! [Concept('countries_with_icon', 'державу')|e] в свою лигу."
 iw_tension_50_tt: "#T При 50 ед. [Concept('situation_tension', 'напряжённости')|e]#! \n$BULLET$Открывается действие [ShowGenericActionName('iw_militarize_country')]. Лидер лиги с действующим парламентом может настоять на незамедлительном приведении всех в готовность к войне, получая армейские традиции и опыт отрядов.\n$BULLET$[ShowGoodsDemandName('italian_wars_militarization')] растёт по всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!, повышая прибыль от производства огнестрельного оружия и артиллерии."
 iw_tension_75_tt: "#T При 75 ед. [Concept('situation_tension', 'напряжённости')|e]#! \n$BULLET$Все три #italic итальянских лиги#! начинают автоматически призывать участников в оборонительные войны в случае нападения лидеров #TOOLTIP:REGION,france_region,X #L французской#!#!, #TOOLTIP:REGION,iberia_region,X #L иберийской#!#! или #italic имперской#! лиги.\n$BULLET$Открывается действие «[ShowGenericActionName('iw_intervene_in_war')]». Лидеры лиг, а также великие и региональные державы могут вмешиваться в любую войну между лигами.\n$BULLET$Открывается действие «[ShowCountryInteractionName('violate_italian_sovereignty')]». Лидер лиги может принудительно получать право на проход войск у держав #TOOLTIP:REGION,italy_region,X #L Италии#!#!."
 iw_tension_100_tt: "#T При 100 ед. [Concept('situation_tension', 'напряжённости')|e]#! \n$BULLET$Перемирия между лидерами лиг больше не действуют. Начинается всеобщий открытый конфликт.\n$BULLET$В течение следующих десяти лет лидеры лиг могут призывать участников на любые наступательные войны в #TOOLTIP:REGION,italy_region,X #L Италии#!#!.\n$BULLET$После этого [Concept('situation_tension', 'напряжённость')|e] начнёт медленно падать и опустится до нуля за #Y 5-10 лет#! в зависимости от интенсивности конфликта."
 iw_tension_explain_tt: "Текущая напряжённость: [GetSituationByKey('italian_wars').MakeScope.GetVariable('iw_tension').GetValue|2]%\nОтражает, насколько жарко разгорелось пламя #TOOLTIP:SITUATION,italian_wars,X #L Итальянских войн#!#!.\n\n#T Ежемесячный рост#!\n$BULLET$#R +0,4#! пассивно каждый месяц\n$BULLET$#R +0,4#!, когда воюет лидер иностранной лиги\n$BULLET$#R +0,4#!, когда воюет лидер итальянской лиги\n$BULLET$#R +0,025#! за каждую победу участников лиги в крупных сражениях (когда [Concept('battles', 'битва')|e] приносит больше 1% [Concept('war_score', 'военного счёта')|e])\n\n#T Рост из-за [Concept('action', 'действий')|e]#!\n$BULLET$#R +0,5#! при #TOOLTIP:GENERIC_ACTION,create_italian_league,X #L создании итальянской лиги#!#!\n$BULLET$#R +1#! при #TOOLTIP:GENERIC_ACTION,expel_league_member,X #L исключении участника лиги#!#!\n$BULLET$#R +2#! при #TOOLTIP:GENERIC_ACTION,challenge_league_leadership,X #L перехвате лидерства в лиге#!#!\n\n#T Снижение#!\n$BULLET$#G −1#! при #TOOLTIP:GENERIC_ACTION,dissolve_italian_league,X #L роспуске итальянской лиги#!#!\n$BULLET$#G −2#!, когда лига распускается в рамках [Concept('peace_treaty', 'мирного договора')|e] о #TOOLTIP:SCRIPTED_PEACE_TREATY,dissolve_league_peace_deal,X #L роспуске лиги#!#!\n\nВысокая [Concept('situation_tension', 'напряжённость')|e] повышает агрессивность лидеров лиг и сокращает перерывы между их войнами."
