 guelphs_and_ghibellines_guelphs_stalemate_trigger_tt: "Текущей является [Concept('age', 'эпоха')|e] #TOOLTIP:AGE,age_3_discovery,X #L Открытий#!#! или более поздняя"
 gag_ghibellines_winner_may_request_kingdom_of_italy_title_tt: "Мы одержали верх в ситуации «$guelphs_and_ghibellines$» как лидер гибеллинов"
 gag_guelphs_winner_may_form_italy_without_location_requirements_tt: "Мы одержали верх в ситуации «$guelphs_and_ghibellines$» как лидер гвельфов"
 #The Revolution
 the_revolution: "Народное восстание" #Temp until we figure out a better name
 the_revolution_desc: "Неравенство в распределении богатства, падение уровня жизни и распространение грамотности пробудили в местных жителях самосознание. Бюргеры и крестьяне требуют перемен, протестуя против эксплуатации низшего общества аристократами, а также против неограниченной власти правящего класса. Это новое движение угрожает установленному общественному порядку, который с незапамятных времён поощрял угнетение низших классов высшими."
 institute_governmental_purges: "Чистки в правительстве"
 institute_governmental_purges_desc: "Мы не можем доверять никому! Шпионы и головорезы таятся за каждым углом, а те, кого мы считали надёжными друзьями, угрожают разрушить нас изнутри. Чтобы защитить народ в эти смутные времена, придётся рубить головы!"
 suppress_foreign_revolutionaries: "Борьба с зарубежными революционерами"
 suppress_foreign_revolutionaries_desc: "Позволяя вольнодумству и антимонархическим идеям завладевать умами чужеземных крестьян, мы рискуем получить бунты и в своих владениях."
 no_country_available: "@trigger_no! Нет доступных [Concept('country', 'держав')|e], отвечающих критерию."
 assist_foreign_revolutionaries: "Помощь зарубежным революционерам"
 assist_foreign_revolutionaries_desc: "Каждый, кто борется с тиранами и угнетателями, является нашим братом и соратником в борьбе. Надо их поддержать!"
 elevate_local_aristocracy: "Увеличение привилегий аристократам"
 elevate_local_aristocracy_desc: "Необразованные массы не способны рассуждать здраво. Очевидно, что их мнение нельзя воспринимать всерьёз, иначе они приведут нашу державу к краху. Чтобы утвердить наше превосходство на этой чернью, мы подавим их робкие попытки поднять голову и не позволим расколоть наше общество."
 demote_local_aristocracy: "Уменьшение привилегий аристократам"
 demote_local_aristocracy_desc: "Пусть возрадуются все [SCOPE.sCountry('actor').GetGovernment.GetEstateName('nobles_estate')|l], которые с кнутом в руках эксплуатировали простой народ и наживались на нём — теперь они сами [SCOPE.sCountry('actor').GetGovernment.GetEstateName('peasants_estate')|l]!"
 every_noble_in_target_province_suffers_severe_penalty_tt: "Наши #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократические#!#! [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName] получат [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 every_noble_in_target_province_gains_mild_satisfaction_tt: "Наши #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократические#!#! [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName] получат [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 reestablish_the_parliament: "Восстановление парламента"
 reestablish_the_parliament_desc: "Наш народ требует представительства."
 any_country_in_spread_of_revolution_disaster_tt: "Ни одна [Concept('country', 'держава')|e] не вовлечена в [Concept('disaster', 'бедствие')|e] #TOOLTIP:DISASTER_TYPE,revolution_disaster,X #L «Революция»#!#!"
 institute_governmental_purges_tt: "Выбранный нами [Concept('character', 'персонаж')|e] будет казнён"
 suppress_foreign_revolutionaries_tt: "Мы получим [Concept('casus_belli', 'повод')|e] #TOOLTIP:CASUS_BELLI,crush_the_revolution_cb,X #L «Подавление революции»#!#! для войны с выбранной нами революционной державой"
 assist_foreign_revolutionaries_tt: "Мы поможем выбранной нами революционной державе путём прямой интервенции или отправки военного подкрепления"
 elevate_local_aristocracy_tt: "Верные нам [ShowEstateTypeName('nobles_estate')|l] в выбранной [Concept('province', 'провинции')|e] получат привилегии — они помогут нам сохранить статус-кво"
 demote_local_aristocracy_tt: "Если [ShowEstateTypeName('nobles_estate')|l] лишатся привилегий, мы укрепим позиции простого народа и поддержим революционные идеалы"
 according_to_our_crown_power_we_suffer_tt: "В зависимости от [Concept('crown_power', 'власти правителей')|e] мы получим следующие негативные эффекты:"
 estate_satisfaction_gain_scales_with_estate_power_tt: "Эти эффекты масштабируются в зависимости от [Concept('estate_power', 'власти')|e] каждого [Concept('estate', 'сословия')|e]:"
 spread_revolutionary_sentiment: "Распространение революционных настроений"
 spread_revolutionary_sentiment_desc: "Борьба простого народа, которому нечего терять, кроме своих цепей, является делом долгим и трудным. Часто мы вынуждены искать поддержки за рубежом, убеждая чужеземные державы принять наши идеалы. Путь этот нелёгок, но мы трудимся во имя высшей цели!"
 revolution_in_selected_country_tt: "[target_country.Custom('predlog_vvo')|U] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#! возникнет [Concept('rebel', 'мятежное')|e] революционное движение. Если же такое уже существует, мы укрепим его и ускорим его прогресс"
 revolution_in_country_tt: "В выбранной [Concept('country', 'державе')|e] возникнет [Concept('rebel', 'мятежное')|e] революционное движение. Если же такое уже существует, мы укрепим его и ускорим его прогресс"
 LEADER_OF_THE_REVOLUTION_TOOLTIP: "Это [Concept('revolutionary_target', 'цель-революционер')|e]"
