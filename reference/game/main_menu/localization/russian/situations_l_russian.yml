 #The Black Death
 black_death: "Чёрная смерть"
 black_death_desc: "«Отец бросал ребёнка, жена — мужа, брат отворачивался от брата, поскольку болезнь эта, как казалось, могла поразить через дыхание и даже через взгляд. Так они и умирали. Огромные ямы доверху были заполнены мёртвыми. А когда одна яма заполнялась, рядом тут же выкапывали другую. Столь многие погибли, что всем стало ясно — миру пришёл конец»."
 black_death_info: "Место происхождения: [ROOT.GetVariable('original_outbreak').GetDiseaseOutbreak.GetOrigin.GetName]"
 black_death_monthly: "• Эта чума распространится в близлежащих [Concept('locations', 'районах')|e] и по торговым путям\n• Там, куда она придёт, погибнет множество [Concept('characters', 'персонажей')|e], а также [Concept('pops', 'групп населения')|e] и [Concept('armies', 'армий')|e]."
 black_death_spreads: "• Эта чума распространится в близлежащих [Concept('locations', 'районах')|e]"
 black_death_kills: "• Там, куда она придёт, погибнет множество [Concept('characters', 'персонажей')|e] и [Concept('pops', 'групп населения')|e]."
