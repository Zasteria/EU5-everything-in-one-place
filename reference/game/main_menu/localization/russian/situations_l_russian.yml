 #American Revolution
 colonial_revolution: "Колониальная революция"
 colonial_revolution_desc: "Идеи #TOOLTIP:INSTITUTION,enlightenment,X #L Просвещения#!#! нашли отклик в колониальных державах по всему миру. Правящая элита колоний, лишённая влияния на политику, вдохновилась идеями свободы, равенства и представительства. Разумеется, эти идеи противоречат их текущему статусу ленников, ведь они могут лишь выполнять требования своих колониальных сюзеренов.\n\nПолитическое давление или открытый мятеж затруднят дальнейшее поддержание порядка в колониях."
