 #The Great Pestilence
 great_pestilence: "Чёрная смерть"
 great_pestilence_desc: "Из-за границы приходят ужасные новости. Мор и погибель, привезённые загадочными бородатыми чужеземцами, поглощают эти земли. Наши старейшины никогда не слышали о подобной чуме, и среди воспоминаний предков не говорится, что делать, если это бедствие достигнет наших поселений. Грозит ли нашему народу гибель, или же нам каким-то чудом удастся выстоять, когда смерть придёт к нашему порогу?"
