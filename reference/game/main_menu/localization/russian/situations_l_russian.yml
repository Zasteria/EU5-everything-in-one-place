 #Rise of Timur
 rise_of_timur: "Восхождение Тимура"
 rise_of_timur_desc: "[GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.GetName], следуя примеру $genghis_khan_name$а и великих халифов, [Select_CString(GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.IsFemale,'созвала', 'созвал')] своих верных воинов и всех, кто был [Select_CString(GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.IsFemale,'ей', 'ему')] предан. На крови тех, кто пал под натиском этих орд, ведомых поистине исключительным стратегом, возникло молодое государство, которому суждено было стать империей. [ShowSubContinentName('central_asia')], [ShowSubContinentName('middle_east')] и Индия — это первая жатва [Select_CString(GetCountry('TIM').MakeScope.GetVariable('tim_founding_father').GetCharacter.IsFemale,'завоевательницы, которая', 'завоевателя, который')] оставит неизгладимый след в истории этих земель на многие столетия вперёд…"
