 hundred_years_war: "Столетняя война"
 hundred_years_war_info: "В результате этого конфликта [GetCountry('ENG').GetName] и [GetCountry('FRA').GetName] начнут между собой [Concept('wars', 'войну')|e]. Она закончится, когда одна из сторон достигнет поставленных целей."
 hundred_years_war_desc: "После смерти последнего прямого наследника #L [GetCountry('FRA').GetAdjective|l]ого#! престола в державе наступило безвластие, и #TOOLTIP:REGION,france_region,X #L Франция#!#! погрузилась в смуту. Хрупкий мир между [GetCountry('FRA').Custom('CL_INST')] и [GetCountry('ENG').Custom('CL_INST')] быстро обернулся конфликтом притязаний, который подогревается старыми разногласиями по поводу территорий и прав феодалов. Обе державы владеют землями во Франции, и возникшее на этой почве противостояние грозит подорвать единство всего #TOOLTIP:RELIGIONGROUP,christian,X #L христианского#!#! мира. Споры о престолонаследии переросли в долгую борьбу за превосходство, и нет сомнений, что шрамы от неё зарастут ещё не скоро."
