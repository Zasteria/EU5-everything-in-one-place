 #Golden Age of Piracy
 request_antipiracy_policy_tt: "Мы свяжемся с ними и попытаемся убедить их изменить закон"
 choose_an_uncolonized_location: "Выберите неколонизированный [Concept('location', 'район')|e], чтобы разместить там штаб."
 antipiracy_request_cooldown_tt: "Эта держава НЕ отвечала на подобные запросы за последние полгода"
 create_allied_pirate_nation: "Создание пиратской державы — ленника"
 create_allied_pirate_nation_desc: "Предоставив каперские свидетельства, подходящую гавань и одну из своих флотилий, а также предложив немного дукатов для найма матросов, мы создадим логово пиратов и головорезов, которые будут мешать вражеским кораблям и при этом беспрепятственно пропускать наши собственные."
 create_allied_pirate_nation_tt: "В выбранном [Concept('location', 'районе')|e] возникнет [Concept('navy_based', 'флотский')|e] [Concept('subject', 'ленник')|e]. У нас будет возможность начать игру за него"
 request_antipiracy_policy: "Требование борьбы с пиратством"
 request_antipiracy_policy_desc: "Пиратство невозможно искоренить, потому что некоторые проклятые державы смеют открыто поощрять и финансировать этих разбойников. Мы должны прибегнуть к силе нашей дипломатии и убедить такие державы в том, что они совершают ужасную ошибку."
 abandon_piracy_action: "Отказ от пиратства"
 abandon_piracy_action_desc: "Мы нашли более выгодные и безопасные способы заработка. Благодарные простолюдины и торговцы станут добровольно делиться с нами урожаем и доходами, если мы будем защищать их от пиратов и грабителей. Если вкладывать эти средства в инфраструктуру и армию, то мы значительно приумножим их и обретём баснословные богатства!"
 attract_sailors: "Привлечение моряков"
 attract_sailors_desc: "Хвастаясь богатством в портовых тавернах и обещая хорошие деньги за работу, мы легко привлечём в свои ряды многих недовольных моряков. Да, у них наверняка проблемы с опытом и дисциплиной, но в данном случае количество важнее качества."
 choose_a_region: "Выбор региона"
 no_regions_available: "$NO_POSSIBLE_REGIONS$"
 migrate_to_new_waters: "Переход в новые воды"
 migrate_to_new_waters_desc: "В мире есть куда более богатые берега, сулящие большую выгоду, и нам давно пора отыскать их. Чтобы точно преуспеть в поисках этих далёких сокровищ, мы можем перенести нашу штаб-квартиру в любое место в пределах досягаемости нашего флота."
 migrate_to_new_waters_tt: "Мы попытаем удачи, перебравшись в далёкий [Concept('coastal', 'прибрежный')|e] [Concept('location', 'район')|e]"
 send_diplomat: "Отправка дипломата"
 golden_age_of_piracy: "Золотой век пиратства"
 golden_age_of_piracy_desc: "Богатства Нового Света привлекают в его моря не только флоты великих империй. Бесчисленные головорезы и недовольные моряки мечтают бросить вызов крупным державам и отправиться на поиски приключений, сокровищ и свободы, даже рискуя оказаться повешенными на рее."
