 EXTENDED_WINTER_STARVING_PROVINCES_TOOLTIP: "Нам принадлежат несколько [Concept('provinces', 'провинций')|e] ($TOTAL_AMOUNT|0$), из которых [Concept('starving', 'голодают')|e] $AMOUNT|0$:"
 little_ice_age_desc: "Пробирающий до костей холод Малого ледникового периода испытывает нас, вынуждая нашего правителя либо приспосабливаться, либо наблюдать, как его владения погружаются в ледяной ад. История запомнит тех, кто пережил это испытание за счёт умелого управления — или просто благодаря инстинкту выживания."
 locations_with_extended_winter_will_be_affected_by_the_following_modifiers_tt: "[Concept('locations', 'Районы')|e], затронутые продолжительной [Concept('winter', 'зимой')|e], будут страдать от этих [Concept('location_modifiers', 'модификаторов')|e] до конца текущей [Concept('situation', 'ситуации')|e]:"
 locations_in_designated_market_get_enforced_rationing_policy_tt: "Каждая [Concept('province_capital', 'столица провинции')|e] на указанном [Concept('market', 'рынке')|e], которой мы владеем, получит модификатор «[ShowModifier('enforced_rationing_policy')]» на #Y 10#! лет"
 province_gains_expanded_food_production_modifier_and_potential_tt: "Выбранная [Concept('province', 'провинция')|e] получит модификатор «[ShowModifier('expanded_food_production_modifier')]» на #Y 10#! лет.\n\nПо возможности [Concept('location', 'район')|e] с наибольшим количеством [Concept('food_raw_material', 'ресурса для производства пищи')|e] в той же провинции получит модификатор «[ShowModifier('expanded_production_of_raw_goods_modifier')]» на #Y 10#! лет"
 enforce_rationing_policies: "Введение политики пайков"
 enforce_rationing_policies_desc: "Дефицит пищи грозит неминуемым голодом, и мы должны ввести строгое нормирование продуктов, чтобы припасов хватало на время суровых зим. Взяв под контроль распределение зерна и ограничив накопление тайных запасов, мы сможем предотвратить голод ценой общественных беспорядков и потенциальной нестабильности."
 expand_provincial_food_production: "Увеличение производства пищи в провинции"
 expand_provincial_food_production_desc: "Изменения климата вынуждают внедрять инновации в сельское хозяйство. Поощряя местное производство, мы сможем ослабить последствия похолодания и обеспечить население стабильным источником пищи."
 send_food_aid: "Отправка продовольственной помощи"
 send_food_aid_desc: "Неурожай привёл к голоду во множестве провинций. Если отправлять продовольствие в пострадавшие провинции или союзные державы, мы сможем улучшить ситуацию и предотвратить беспорядки, но при этом придётся пожертвовать нашими запасами в других провинциях."
 choose_province_to_receive_food: "Выберите [Concept('province', 'провинцию')|e], которая получит [Concept('food', 'пищу')|e]"
 choose_province_to_send_food_to_target_province_taker: "Выберите [Concept('province', 'провинцию')|e], которая отправит [Concept('food', 'пищу')|e] в провинцию [target_province_taker.GetName]"
 due_to_no_road_network_tt: "Поскольку [Concept('province_capital', 'столица провинции')|e] [target_province_giver.GetName] не соединена с новейшей [Concept('road', 'дорогой')|e] до [Concept('province_capital', 'столицы провинции')|e] [target_province_taker.GetName], часть [Concept('food', 'пищи')|e] будет потеряна по пути"
 has_not_recently_given_food_tt: "Провинцию не выбирали как отправителя [Concept('food', 'пищи')|e] за последние 2 года"
 every_pop_in_target_province_taker_gains_10_satisfaction_tt: "[Concept('pop_satisfaction', 'Довольство ')|e] наших [Concept('pops', 'групп населения')|e] в провинции [target_province_taker.GetNameWithNoTooltip] повысится на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
