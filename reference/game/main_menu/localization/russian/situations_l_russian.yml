 #Tooltips
 has_never_had_situation_before_tt: "Впервые сталкивается с этой [Concept('situation', 'ситуацией')|e]"
 delhi_situation_info_tt: "Вскоре может начаться [Concept('situation', 'ситуация')|e] «#TOOLTIP:SITUATION,fall_of_delhi,X #L Падение Дели#!#!». В эти нелёгкие времена в наших землях поднимутся многочисленные восстания. Соседи и ленники обнажат против нас мечи, если увидят, что наша власть неспособна своевременно оправиться от удара. Тем временем нарастает угроза и изнутри: коварные [ShowEstateTypeName('nobles_estate')|l] собираются свергнуть неустойчивое правительство…\n"
 has_decided_to_cede_territories_tt: "#ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_DAT')|L]#!#! пришлось отдать земли в событии #Y «$delhi_situation.16.title$»#!"
 gain_2_progress_for_delhi_tt: "Мы получим [Concept('share_of_power_gc', 'долю власти')|e] #G 2%#! во время [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
 gain_5_progress_for_claimants_tt: "Наши противники получат [Concept('share_of_power_gc', 'долю власти')|e] #R 5%#! во время [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
 gain_3_progress_for_claimants_tt: "Наши противники получат [Concept('share_of_power_gc', 'долю власти')|e] #R 3%#! во время [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
 get_opinion_with_other_jackals_tt: "Отношения между нами и странами-противницами державы [GetCountry('DLH').GetName] улучшатся на #G 20#! ед., а мы получим #G 5#! ед. [Concept('favors', 'благосклонности')|e] этих стран"
 delhi_claimant_country_tt: "Мы активно противостоим державе [GetCountry('DLH').GetName] в [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
 cd_3_years: "Мы не пользовались этим взаимодействием за последние #Y 3#! года"
 dlh_reduce_frequency_of_revolt_events_tt: "Частота катастрофических событий в [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]» будет несколько снижена на время действия [Concept('modifier', 'модификатора')|e] «[ShowModifier('delhi_loyal_governors_modifier')]»"
 appease_nobility_effect_tt: "Пока действует [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,delhi_appeased_the_nobles_modifier,X #V #L «Благосклонность знати»#!#!, [SCOPE.sCountry('actor').GetGovernment.GetEstateName('nobles_estate')|l] не будут бунтовать против нашей власти во время особых [Concept('events', 'событий')|e]"
 delhi_win_lose_conditions_tt: "Если [Concept('share_of_power_gc', 'доля власти')|e] наших врагов превысит #R 50%#!, может наступить [Concept('disaster', 'бедствие')|e] #TOOLTIP:DISASTER_TYPE,dissolution_of_delhi,X #L «Распад Делийского Султаната»#!#!"
 has_not_sided_with_opposers_already_tt: "Мы ещё не противостоим державе [GetCountry('DLH').GetNameWithNoTooltip] в текущей ситуации"
 will_oppose_delhi_tt: "Мы будем #Y противостоять#! державе [GetCountry('DLH').GetName] в [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
