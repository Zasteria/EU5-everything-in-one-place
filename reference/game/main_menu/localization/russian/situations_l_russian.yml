 IW_FOREIGN_LEAGUE_BALKAN_VICTORY_TT: "#T Победа#!\n$BULLET$Все [Concept('members', 'участники')|e] навсегда получают [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_victory_in_the_italian_wars_modifier,X #V #L «Победа в итальянских войнах»#!#!#!\n$BULLET$Лидер лиги вводит [Concept('law', 'правило')|e] #TOOLTIP:LAW,administration_of_italian_lands_law,X #L «Управление итальянскими землями»#!#!\n$BULLET$Играя за Рим или Византию с дополнением #bold Fate of the Phoenix#!, вы получите модификатор #TOOLTIP:STATIC_MODIFIER,iw_rom_byz_latin_victory_dlc_modifier,X #V #L «Возрождение Рима»#!#!#! или #TOOLTIP:STATIC_MODIFIER,iw_byz_hellenic_victory_dlc_modifier,X #V #L «Эллинизация Запада»#!#!#! в зависимости от [Concept('societal_values', 'общественных ценностей')|e] #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#! и #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L ромейства#!#!\n$BULLET$Без этого дополнения $ROM$ и $BYZ$ навсегда получают модификатор #TOOLTIP:STATIC_MODIFIER,iw_balkan_victory_no_dlc_modifier,X #V #L «Владыки Италии»#!#!#!\n$BULLET$В противном случае [Concept('country_rank', 'ранг державы')|e] будет повышен до империи, а если вы уже империя, то навсегда получите модификатор #TOOLTIP:STATIC_MODIFIER,iw_balkan_victory_cabinet_modifier,X #V #L «Имперское освоение Италии»#!#!#!"
 IW_FOREIGN_LEAGUE_BALKAN_VICTORY_DLC_TT: "#T Победа#!\n$BULLET$Все [Concept('members', 'участники')|e] навсегда получают [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_victory_in_the_italian_wars_modifier,X #V #L «Победа в итальянских войнах»#!#!#!\n$BULLET$Лидер лиги вводит [Concept('law', 'правило')|e] #TOOLTIP:LAW,administration_of_italian_lands_law,X #L «Управление итальянскими землями»#!#!\n$BULLET$Играя за Рим или Византию, вы навсегда получите модификатор #TOOLTIP:STATIC_MODIFIER,iw_rom_byz_latin_victory_dlc_modifier,X #V #L «Возрождение Рима»#!#!#! или #TOOLTIP:STATIC_MODIFIER,iw_byz_hellenic_victory_dlc_modifier,X #V #L «Эллинизация Запада»#!#!#! в зависимости от [Concept('societal_values', 'общественных ценностей')|e] #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#! и #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L ромейства#!#!\n$BULLET$В противном случае [Concept('country_rank', 'ранг державы')|e] будет повышен до империи, а если вы уже империя, то вы навсегда получите модификатор #TOOLTIP:STATIC_MODIFIER,iw_balkan_victory_cabinet_modifier,X #V #L «Имперское освоение Италии»#!#!#!"
 IW_FOREIGN_LEAGUE_FRANCE_VICTORY_TT: "#T Победа#!\n$BULLET$Все [Concept('members', 'участники')|e] навсегда получают [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_victory_in_the_italian_wars_modifier,X #V #L «Победа в итальянских войнах»#!#!#!\n$BULLET$Лидер лиги получает [Concept('prestige', 'престиж')|e] и модификатор #TOOLTIP:STATIC_MODIFIER,iw_france_victory_modifier,X #V #L «Французское превосходство»#!#!#! на несколько лет ([ShowNamedValue('modifier_duration_years_long')|0]), значение которого зависит от числа [Concept('locations', 'районов')|e], которыми владеет [Concept('international_organization', 'международное объединение')|e] в #TOOLTIP:REGION,italy_region,X #L Италии#!#!\n$BULLET$Лидер лиги вводит [Concept('law', 'правило')|e] #TOOLTIP:LAW,administration_of_italian_lands_law,X #L «Управление итальянскими землями»#!#!"
 IW_FOREIGN_LEAGUE_IBERIA_VICTORY_TT: "#T Победа#!\n$BULLET$Все [Concept('members', 'участники')|e] навсегда получают [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_victory_in_the_italian_wars_modifier,X #V #L «Победа в итальянских войнах»#!#!#!\n$BULLET$Лидер лиги получает [Concept('prestige', 'престиж')|e] и модификатор #TOOLTIP:STATIC_MODIFIER,iw_iberia_victory_modifier,X #V #L «Иберийское превосходство»#!#!#! на несколько лет ([ShowNamedValue('modifier_duration_years_long')|0]), значение которого зависит от числа [Concept('locations', 'районов')|e], которыми владеет [Concept('international_organization', 'международное объединение')|e] в #TOOLTIP:REGION,italy_region,X #L Италии#!#!\n$BULLET$Лидер лиги вводит [Concept('law', 'правило')|e] #TOOLTIP:LAW,administration_of_italian_lands_law,X #L «Управление итальянскими землями»#!#!"
 IW_FOREIGN_LEAGUE_HRE_VICTORY_TT: "#T Победа#!\n$BULLET$Все [Concept('members', 'участники')|e] навсегда получают [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_victory_in_the_italian_wars_modifier,X #V #L «Победа в итальянских войнах»#!#!#!\n$BULLET$Лидер лиги получает [Concept('prestige', 'престиж')|e] и [ShowNamedValue('imperial_authority_unique_bonus')|+=2] к имперской власти в [Concept('holy_roman_empire', 'Священной Римской Империи')|e]\n$BULLET$[Concept('members', 'Участники')|e] лиги становятся князьями [Concept('holy_roman_empire', 'Священной Римской Империи')|e], если ещё ими не были\n$BULLET$Лидер лиги вводит [Concept('law', 'правило')|e] #TOOLTIP:LAW,administration_of_italian_lands_law,X #L «Управление итальянскими землями»#!#!"
 IW_ITALIAN_LEAGUE_VICTORY_TT: "#T Победа#!\n$BULLET$Все [Concept('members', 'участники')|e] получают [Concept('prestige', 'престиж')|e] и [Concept('stability', 'стабильность')|e]\n$BULLET$Лидер лиги навсегда получает [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_victory_in_the_italian_wars_modifier,X #V #L «Победа в итальянских войнах»#!#!#!\n$BULLET$[Concept('abilities', 'Навыки')|e] [Concept('ruler', 'правителя')|e] державы, возглавляющей лигу, улучшаются\n$BULLET$Лидер лиги вводит [Concept('law', 'правило')|e] #TOOLTIP:LAW,administration_of_italian_lands_law,X #L «Управление итальянскими землями»#!#!\n$BULLET$Независимые [Concept('members', 'участники')|e] лиги могут стать #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассалами#!#! лидера в зависимости от [Concept('opinion', 'мнения')|e]"
