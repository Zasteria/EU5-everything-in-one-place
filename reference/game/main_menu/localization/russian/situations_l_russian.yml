 #Core
 fall_of_delhi: "Падение Дели"
 fall_of_delhi_desc: "Сто лет чрезмерного напряжения и распад центральной власти подорвали репутацию #ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_GEN')|L]#!#! — некогда могучей державы. Стервятники и враги собираются на границах [GetCountry('DLH').Custom('rank_ru_GEN')|l], выжидая момента для удара. Если правители не смогут защитить свой народ от внутренней и внешней угрозы, то великая империя, созданная их предшественниками, очень скоро окажется на коленях."
 fall_of_delhi_info: "В эпоху падения [GetCountry('DLH').Custom('CL_GEN')] страны Индии будут пытаться отобрать у [GetCountry('DLH').Custom('longname_ru_GEN')] власть над своими регионами. Если им это удастся, [GetCountry('DLH').GetFlavorRank|l] раскол[GetCountry('DLH').Custom('endrank_etyut')]ся на части и на обломках вскоре возникнет новая великая держава…"
 LOYAL_SUBJECT_OF_DELHI: "Верный [Concept('subject', 'ленник')|e] державы [GetCountry('DLH').GetName] в [Concept('situation', 'ситуации')|e] «[ShowSituationName('fall_of_delhi')]»."
 DISLOYAL_SUBJECT_OF_DELHI: "[Concept('disloyal_subject', 'Нелояльный ленник')|e] #ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_GEN')|L]#!#! в [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,fall_of_delhi,X #L «Падение Дели»#!#!."
 ALLY_OF_DELHI: "[Concept('ally', 'Союзник')|e] или #Y сторонник#! державы [GetCountry('DLH').GetName] в [Concept('situation', 'ситуации')|e] «[ShowSituationName('fall_of_delhi')]»."
 RIVAL_ENEMY_OF_DELHI: "[Concept('rival', 'Соперник')|e] или [Concept('enemy', 'враг')|e] державы [GetCountry('DLH').GetName] в [Concept('situation', 'ситуации')|e] «[ShowSituationName('fall_of_delhi')]»."
