 hundred_years_war_ACTION_TT: "Открыть окно войны"
 request_papal_delegates: "Запросить [GetCountry('PAP').GetAdjectiveWithNoTooltip|l]их делегатов"
 request_papal_delegates_desc: "Война затянулась и превратилась в бессмысленную бойню. Чтобы добиться мира, нам стоит обратиться к посреднику."
 pap_will_be_asked_to_enforce_wp_tt: "Державу [GetCountry('PAP').GetLongName] попросят навязать [Concept('white_peace', 'мир на условиях «статус-кво»')|e] между #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_INST')|L]#!#!"
 fra_diplomacy_with_subjects: "Присвоение титулов ленникам"
 fra_diplomacy_with_subjects_desc: "Даровав титулы сильнейшим из наших ленников, мы повысим шансы сохранить их поддержку и уберечь от [GetCountry('ENG').GetAdjectiveWithNoTooltip|l]ого влияния. В противном случае есть риск, что они обратятся против нас!"
 demand_autonomy: "Потребовать автономии от [GetCountry('FRA').Custom('longname_ru_wntt_GEN')]"
 demand_autonomy_desc: "Мы должны усилить своё влияние, чтобы надавить на сюзерена и получить особые привилегии, ведущие к нашему процветанию."
 influence_french_subject: "Повлиять на [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ого ленника"
 influence_french_subject_desc: "Посеяв семена сомнений в отношениях между [GetCountry('FRA').Custom('longname_ru_INST')] и её ленниками, мы значительно улучшим своё положение в войне против них!"
 influence_french_subject_tt: "Выбранного #L [GetCountry('FRA').GetAdjective|l]ого#! ленника можно убедить не вступать в оборонительные войны в течение следующих #Y 5#! лет в обмен на [Concept('gold', 'дукаты')|e] [gold_i]"
 demand_appanage_promotion: "Потребовать повышение до апанажа"
 demand_appanage_promotion_desc: "Мы обладаем престижем и славой, какие не снились ни одному #TOOLTIP:SUBJECT_TYPE,vassal,X #L вассалу#!#!. Наше влияние растёт, и наш титул должен отражать наши силу и значимость под #L [GetCountry('FRA').GetAdjective|l]им#! знаменем."
 fra_has_eligible_child_tt: "В династии [GetCountry('FRA').GetGovernment.GetRulerOrRegent.GetDynasty.GetName] из #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! есть [Concept('character', 'персонаж')|e], который может стать нашим [Concept('heir', 'наследником')|e]"
 has_not_been_exempted_tt: "Не получено временное исключение из наступательных войн через [Concept('situation', 'ситуативное')|e] [Concept('action', 'действие')|e] #TOOLTIP:GENERIC_ACTION,demand_autonomy,X #L «Требование автономии от [GetCountry('FRA').Custom('longname_ru_wntt_GEN')]»#!#! в ситуации «[ShowSituationName('hundred_years_war')]»"
 french_subject_prevented_from_call_to_war_join_war_tt: "НЕТ [Concept('modifier', 'модификатора')|e] «[ShowModifier('french_subject_prevented_from_call_to_war')]»"
 another_appanage_capital_area_stronger_tt: "Ни один другой #TOOLTIP:SUBJECT_TYPE,appanage,X #L апанаж#!#! со [Concept('capital', 'столицей')|e] в той же [Concept('area', 'области')|e], что и наша, не обладает большей [Concept('country_strength', 'мощью')|e], чем мы"
 has_demanded_autonomy_tt: "Мы #TOOLTIP:SUBJECT_TYPE,appanage,X #L апанаж#!#! и либо получаем [Concept('modifier', 'модификатор')|e] «[ShowModifier('granted_autonomy_to_expand_modifier')]» при выполнении [Concept('action', 'действия')|e] #TOOLTIP:GENERIC_ACTION,demand_autonomy,X #L «Требование автономии от [GetCountry('FRA').Custom('longname_ru_wntt_GEN')]»#!#! в [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,hundred_years_war,X #L «Столетняя война»#!#!, либо объявляем войну #ONCLICK:COUNTRY,[overlord.Custom('CL_tt')] #TOOLTIP:COUNTRY,[overlord.Custom('CL_tt')],X [overlord.Custom('CL_DAT')|L]#!#!"
 has_relevant_event_to_the_disaster_tt: "Сейчас делает выбор в [Concept('event', 'событии')|e], связанном с этим [Concept('disaster', 'бедствием')|e]"
 selected_character_will_be_executed_tt: "Выбранный [Concept('character', 'персонаж')|e] умрёт от рук наших палачей"
 demand_territory_return: "Требование пересмотра границ"
 demand_territory_return_desc: "Мы заметили, что наши соседи — такие же ленники [GetCountry('FRA').Custom('longname_ru_GEN')] — контролируют земли, которые мы считаем своими. Мы должны немедленно заняться этой проблемой!"
 demand_territory_return_tt: "Мы потребуем вернуть нам выбранный [Concept('core', 'национальный район')|e]."
 wont_join_vs_other_appanages_with_granted_autonomy_to_expand_modifier_during_hyw_tt: "[Concept('wars', 'Война')|e] не ведётся против #TOOLTIP:SUBJECT_TYPE,appanage,X #L апанажа#!#!, получившего [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,granted_autonomy_to_expand_modifier,X #L «Предоставлено право на расширение»#!#! от [Concept('action', 'действия')|e] #TOOLTIP:GENERIC_ACTION,demand_autonomy,X #L «Требование автономии от [GetCountry('FRA').Custom('longname_ru_wntt_GEN')]»#!#! во время #TOOLTIP:SITUATION,hundred_years_war,X $tt_op_L$Столетней войны$tt_cl_2$."
 hyw_will_soon_fire_tt: "Скоро может начаться [Concept('situation', 'ситуация')|e] «[ShowSituationName('hundred_years_war')]»"
 betray_our_allegiance: "Отказ от верности"
 betray_our_allegiance_desc: "В войне назревает перелом. Когда-то мы пообещали свой меч и свою поддержку нашим союзникам в текущем конфликте, но пора принять реальность и пересмотреть дипломатические отношения, чтобы уберечь наш народ от ужасов войны и избежать подчинения."
 eng_leads_one_side_france_another_tt: "Одну сторону [Concept('war', 'войны')|e] возглавля[GetCountry('ENG').Custom('end_etyut')] [GetCountry('ENG').GetName], а вторую — [GetCountry('FRA').GetName]"
 choose_war_tt: "Выбор [Concept('war', 'войны')|e]"
 war_goal_owned_by_us_tt: "[Concept('war_goal', 'Цель войны')|e] — НЕ принадлежащий нам [Concept('location', 'район')|e] или [Concept('province', 'провинция')|e]"
 war_going_on_longer_than_year_tt: "Продолжается как минимум #Y 1#! год"
 procure_core_claim: "Получение претензий на национальные земли"
 procure_core_claim_desc: "Мы больше не можем молчать о своих законных притязаниях на эти земли. Провозгласив право на то, что по справедливости принадлежит нам, мы создадим основу для войны за утраченные территории."
 request_war_entry: "Просьба о вступлении в войну"
 request_war_entry_desc: "Мы не сможем выйти победителями из этой долгой кровопролитной войны в одиночку. Нужно обратиться к соседней державе и побудить её взяться за оружие и присоединиться к нашей борьбе."
 hyw_sign_truce: "Подписание перемирия"
 hyw_sign_truce_desc: "Гордость требует идти до победного конца, но благоразумие подсказывает, что лучше проявить сдержанность и пойти на перемирие с врагом — хотя бы ради того, чтобы сделать передышку и подготовиться к следующему шагу."
 choose_neighbor_country: "Выбрать соседнюю [Concept('country', 'державу')|e]"
 no_neighbor_country_available: "@trigger_no! Нет доступных соседних [Concept('country', 'держав')|e]."
 target_country_will_be_asked_for_truce_tt: "#ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! попросят подписать #Y 5#!-летнее [Concept('truce', 'перемирие')|e] с нами в ходе [Concept('event', 'события')|e]"
 selected_country_will_be_asked_for_truce_tt: "Выбранную [Concept('country', 'державу')|e] попросят подписать #Y 5#!-летнее [Concept('truce', 'перемирие')|e] с нами в ходе [Concept('event', 'события')|e]"
 this_will_not_affect_our_textile_industry_tt: "#italic Это не затронет нашу текстильную промышленность#!"
 they_will_be_notified_of_our_rejection_tt: "[actor.GetLongName] узна[actor.Custom('endlong_etyut')], что мы отвергли [Concept('truce', 'перемирие')|e]"
 not_recently_asked_to_join_tt: "Не получали просьбы присоединиться к нашей [Concept('war', 'войне')|e] посредством этого [Concept('action', 'действия')|e] за последние #Y 10#! лет"
 hyw_defect_action: "Стремление к разрыву"
 hyw_defect_action_desc: "Наше терпение скоро лопнет. Некомпетентность нынешнего сюзерена в государственных делах давно стала притчей во языцех, и раздражение вассалов растёт с каждым днём. Пора подумать о смене лагеря, не дожидаясь начала военных действий!"
 crown_new_ruler: "Коронация нового правителя"
 crown_new_ruler_desc: "К сожалению, мы состоим в унии с заклятыми врагами. Это обстоятельство не даёт нам реализовать военные амбиции и ставит нас в незавидное положение. Мы должны избрать нового правителя и возглавить союз!"
 selected_character_takes_actor_crown_tt: "Выбранный [Concept('character', 'персонаж')|e] станет нашим новым [Concept('ruler', 'правителем')|e], что в текущей [Concept('situation', 'ситуации')|e] вызовет у противников большое недовольство и может привести к [Concept('war', 'войне')|e]."
 #Standard Situation
 MAIN_INFORMATION: "Основные сведения"
 MAIN_ACTIONS: "Основные действия"
 CURRENT_DEBATES: "Текущие споры"
 #Nanbokuchou
 nanbokuchou: "Период Намбокутё"
 nanbokuchou_desc: "После того как [GetCharacter('jap_go_daigo_tenno').GetName] и [Select_CString(GetCharacter('jap_ashikaga_takauji').IsFemale,'поддержавшая', 'поддержавший')] [Select_CString(GetCharacter('jap_go_daigo_tenno').IsFemale,'её', 'его')] [GetCharacter('jap_ashikaga_takauji').GetName] уничтожили Камакурский сёгунат и восстановили императорскую власть в ходе реставрации Кэмму, двое бывших союзников быстро стали соперниками. [GetCharacter('jap_go_daigo_tenno').GetNameWithNoTooltip] [Select_CString(GetCharacter('jap_go_daigo_tenno').IsFemale,'хотела', 'хотел')] восстановить верховенство императорской власти, как в период Хэйан, но [GetCharacter('jap_ashikaga_takauji').GetNameWithNoTooltip] и многие другие представители воинского сословия были этим недовольны. [GetCharacter('jap_ashikaga_takauji').GetNameWithNoTooltip] [Select_CString(GetCharacter('jap_ashikaga_takauji').IsFemale,'была изгнана', 'был изгнан')] из столицы, бежав на Кюсю, но в 1336 году [Select_CString(GetCharacter('jap_ashikaga_takauji').IsFemale,'сумела', 'сумел')] вернуться в #TOOLTIP:LOCATION,kyoto,X #L Киото#!#!, захватив город, создав новый #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L Японский Сёгунат#!#! и посадив на престол нового императора. В январе 1337 года [GetCharacter('jap_go_daigo_tenno').GetNameWithNoTooltip] [Select_CString(GetCharacter('jap_go_daigo_tenno').IsFemale,'бежала', 'бежал')] из столицы, расположив свой двор в #TOOLTIP:LOCATION,yoshino,X #L Йосино#!#!. Так начался период Намбокутё — период южного и северного дворов."
 there_is_no_japanese_emperor_tt: "В #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,japanese_shogunate,X #L Японском Сёгунате#!#! не больше #Y 1#! [Concept('members', 'участника')|e] с [Concept('special_status', 'особым статусом')|e] #TOOLTIP:SPECIAL_STATUS,japanese_emperor,X #L тэнно#!#!"
 NORTHERN_COURT_SUPPORTER: "Сторонники северного двора"
