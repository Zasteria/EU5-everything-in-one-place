 GHIBELLINES_PROGRESS_TOOLTIP_CONTEXT: "#TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,ghibellines_io,X #L Гибеллины#!#! получают #Y прогресс#! в виде доли от общей [Concept('tax_base', 'налоговой базы')|e] всех участников своего объединения.\n\nТекущий ежемесячный прогресс: [GetUniqueInternationalOrganization('ghibellines_io').GetVariable('ghibellines_progress_monthly')|V2%]"
