 RTR_SITUATION_TOOLTIP: "У каждой державы, освобождённой во время этой ситуации, есть заранее заданный показатель #Y преданности Юаню#!, отражающий верность #ONCLICK:COUNTRY,[GetCountry('CHI').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CHI').Custom('CL_tt')],X [GetCountry('CHI').Custom('CL_DAT')|L]#!#!. Когда показатель опускается ниже #R 0#!, держава присоединяется к #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,red_turban_rebels,X #L «Красным повязкам»#!#!. Державы с преданностью Юаню выше #Y 0#! будут нейтральными, а те, у кого показатель выше #G 50%#!, считаются лояльными"
