 RTR_GRAPH_FLAVOR_REBEL_TT: "#italic Сильнейшая держава #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,red_turban_rebels,X #L «Красных повязок»#!#! ежемесячно определяется на основе [Concept('great_power_score', 'счёта великой державы')|e] участников. Держава с наибольшим счётом автоматически становится военачальником.#!"
 #Situation Actions
 rtr_grant_titles: "Назначение титулов"
 rtr_grant_titles_desc: "#flavor Возможность обрести могущество и влияние при императорском дворе привлекает многих. Раздав мятежникам особые титулы и привилегии, мы, возможно, убедим их занять нашу сторону… или хотя бы согласиться на временное перемирие.#!\n\n[actor.GetName] потрат[actor.Custom('end_ityat')] #R 5#! ед. легитимности и перевед[actor.Custom('end_etut')] часть своего [Concept('income', 'дохода')|e]. Выбранная держава получит #G 15#! ед. преданности Юаню."
 rtr_grant_titles_select_country: "Выбор воюющей державы"
 rtr_negotiate_with_rebels: "Переговоры с мятежниками"
 rtr_negotiate_with_rebels_desc: "#flavor Далеко не каждый мятежник жаждет занять престол. Многим просто хочется спокойной жизни — таких среди бунтующего населения большинство. Этих повстанцев можно попытаться усмирить, пойдя с ними на переговоры и попытавшись решить вопросы, которые их беспокоят.#!\n\n[actor.GetName] уменьша[actor.Custom('end_etyut')] показатель продвижения одной из [Concept('rebel', 'мятежных')|e] фракций к цели на #G 30%#!"
 rtr_negotiate_with_rebels_select_rebels: "Выбор мятежной фракции"
 rtr_negotiate_with_rebels_tt: "Выбранные [Concept('rebels', 'мятежники')|e] потеряют [ShowNamedValue('rebel_progress_severe_bonus')|+=2%] прогресса"
 rtr_call_loyalists_to_arms: "Призыв лоялистов взять оружие"
 rtr_call_loyalists_to_arms_desc: "#flavor Земли #ONCLICK:COUNTRY,[GetCountry('CHI').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CHI').Custom('CL_tt')],X [GetCountry('CHI').Custom('CL_GEN')|L]#!#! в огне. Под ногами разбойников стонет земля, вскормившая тех, кто её топчет. Нужно срочно призвать к оружию тех, кто ещё верен небесному престолу!#!\n\nВыбранная #TOOLTIP:GOVERNMENT_REFORM,warring_state,X #L воюющая держава#!#!, #G верная#! #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_DAT')|L]#!#! (преданность Юаню должна быть не менее [ShowNamedValue('RTR_IS_LOYAL_VALUE')|+=2]), присоединится к нашим войнам при помощи повода #TOOLTIP:CASUS_BELLI,cb_red_turban_rebellions,X #L «Восстание „Красных повязок“»#!#!."
 rtr_call_loyalists_to_arms_tt: "Каждый участник объединения «[GetInternationalOrganizationType('red_turban_rebels').GetName]» сейчас воюет против #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_GEN')|L]#!#!"
 rtr_call_loyalists_to_arms_select_country: "Выбор верного сторонника [GetCountry('CHI').Custom('CL_GEN')]"
 rtr_call_loyalists_to_arms_ct: "Приверженцы вступают во все [Concept('war', 'войны')|e] при помощи повода #TOOLTIP:CASUS_BELLI,cb_red_turban_rebellions,X #L «Восстание „Красных повязок“»#!#! на стороне #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_GEN')|L]#!#!, выступая против участников #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,red_turban_rebels,X #L «Красных повязок»#!#!."
 rtr_call_loyalists_to_arms_at: "Приверженцы теряют #R  5#! ед. преданности Юаню."
 rtr_appease_the_court: "Умиротворение двора"
 rtr_appease_the_court_desc: "#flavor На фоне открытого восстания в сельской местности некоторые придворные стараются заручиться поддержкой мятежных полководцев. Если задобрить этих придворных, они, возможно, останутся на нашей стороне — сейчас это очень важно.#!\n"
 rtr_rekindle_revolt: "Разжигание мятежа"
 rtr_rekindle_revolt_desc: "#flavor Мы заключили перемирие с угнетавшими нас покровителями, однако не собираемся отказываться от намерения освободить Китай окончательно!#!\n"
 rtr_rein_in_area: "Усмирение области"
 rtr_rein_in_area_desc: "#flavor Территория Китая обширна, а его население многочисленно. Усмиряя захваченные области, мы обеспечим себе верность и поддержку местного населения в это трудное время.#!\n\n[actor.GetName] добавля[actor.Custom('end_etyut')] захваченной [Concept('area', 'области')|e] модификатор #TOOLTIP:STATIC_MODIFIER,rtr_rein_in_area_modifier,X #V #L «Региональное правление»#!#!, а её районы становятся [Concept('integrated', 'интегрированными')|e]."
 rtr_rein_in_area_select_area_title: "Выбор усмиряемой области"
 rtr_rein_in_area_no_areas: "@trigger_no! Нет доступных подходящих [Concept('areas', 'областей')|e], у которых нет [Concept('core', 'национальных')|e] [Concept('locations', 'районов')|e] и есть [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,rtr_rein_in_area_modifier,X #V #L «Региональное правление»#!#!."
 rtr_rein_in_area_tt: "Каждый [Concept('location', 'район')|e] [Concept('integrated', 'интегрируется')|e] и получает [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,rtr_rein_in_area_modifier,X #V #L «Региональное правление»#!#! на #Y 10#! лет"
 rtr_rein_in_area_at: "Каждый [Concept('location', 'район')|e] в выбранной [Concept('area', 'области')|e] [Concept('integrated', 'интегрируется')|e] и получает [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,rtr_rein_in_area_modifier,X #V #L «Региональное правление»#!#! на #Y 10#! лет"
 rtr_declare_war_for_regional_supremacy: "Объявление войны за региональное превосходство"
 rtr_declare_war_for_regional_supremacy_desc: "#flavor $red_turban_rebellions$ — это не просто мятеж против произвола правящей династии, а ещё и борьба за место на престоле. Нельзя допустить, чтобы небесный мандат достался хоть кому-нибудь из тех, кто рвётся к власти!#!\n\n[actor.GetName] объявля[actor.Custom('end_etyut')] повод «[ShowCasusBelliName('cb_red_turban_rebellions_against_other_rebels')|l]» для войны против выбранной [Concept('country', 'державы')|e]."
 rtr_declare_war_for_regional_supremacy_select_title: "Выбор воюющей державы"
 rtr_declare_war_for_regional_supremacy_no_countries: "@trigger_no! Нет подходящей воюющей державы, которая не является ни [Concept('ally', 'союзником')|e], ни [Concept('subject', 'ленником')|e] нашего государства и у которой нет [Concept('truce', 'перемирия')|e] с нами."
 rtr_support_faction: "Поддержка фракции"
 rtr_support_faction_desc: "#flavor Земли #ONCLICK:COUNTRY,[GetCountry('CHI').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CHI').Custom('CL_tt')],X [GetCountry('CHI').Custom('CL_GEN')|L]#!#! пылают под натиском мятежников, восставших против #L [GetCountry('CHI').GetCulture.GetName|l]ого#! сюзерена. Наше вмешательство может склонить чашу весов в одну из сторон.#!\n\nПередать #Y годичный#! запас [Concept('gold', 'дукатов')|e] выбранному участнику #TOOLTIP:SITUATION,red_turban_rebellions,X #L восстания «Красных повязок»#!#! в обмен [ShowBiasValue('opinion_rtr_supported_side')|+=0] к [Concept('opinion', 'мнению')|e]"
 rtr_declare_independence: "Объявление независимости"
 rtr_declare_independence_desc: "#flavor [GetCountry('CHI').GetLongName] сто[GetCountry('CHI').Custom('endlong_ityat')] на пороге величайшего кризиса. [GetCountry('CHI').GetGovernment.GetRulerOrRegent.GetName] видит в этом трагедию, но для нас это отличная возможность сбросить оковы нашего #L [GetCountry('CHI').GetCulture.GetName|l]ого#! сюзерена.#!"
 rtr_join_chinese_defense: "Помощь в защите [GetCountry('CHI').Custom('CL_GEN')]"
 rtr_join_chinese_defense_desc: "#flavor Хотя восстание «Красных повязок»#! может дать нам возможность освободиться от [GetCountry('CHI').Custom('longname_ru_GEN')], сила этой державы и наши дипломатические узы защищают нас от иностранных угроз. А потому мы должны поддержать [GetCountry('CHI').Custom('rank_ru_ACC')|l] и помочь подавить мятеж."
 #Italian Wars
 italian_wars: "Итальянские войны"
 italian_wars_desc: "Уже более ста лет #TOOLTIP:REGION,italy_region,X #L Италия#!#! процветает благодаря своему выгодному положению в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Бурная заморская торговля, несметные богатства и расцвет культуры #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#! привели к наступлению золотого века во многих частях полуострова.\n\nОднако такое благополучие привлекло внимание чужеземцев, которые жаждут обрести богатства Италии и подчинить её малые государства. В ответ на это сильнейшие итальянские державы сплотились в лиги, чтобы вместе дать отпор захватчикам…"
 italian_wars_militarization: "Милитаризация экономики из-за Итальянских войн"
 iw_the_purge_is_in_effect_tt: "[Concept('situation_tension', 'Напряжённость')|e] поднималась до #Y 100#! в последние 10 лет"
 FOREIGN_LEAGUE_VICTORY: "Победа иностранной лиги"
 ITALIAN_LEAGUE_VICTORY: "Победа итальянской лиги"
 ITALIAN_WARS_LEAGUES: "Лиги"
 ITALIAN_WARS_LEAGUES_TOOLTIP: "Лиги в этой [Concept('situation', 'ситуации')|e] состоят из нескольких участников, возглавляемых лидером. Уничтоженные итальянские лиги можно воссоздать; уничтоженные иностранные — нельзя."
 #League Loc
 french_league_leader_rank: "Лидер французской лиги"
 hre_league_leader_rank: "Лидер имперской лиги"
 iberian_league_leader_rank: "Лидер иберийской лиги"
 italian_league_1_leader_rank: "Лидер первой итальянской лиги"
 italian_league_2_leader_rank: "Лидер второй итальянской лиги"
 italian_league_3_leader_rank: "Лидер третьей итальянской лиги"
 #Action Loc
 join_league_choose_text: "Выберите лигу, в которую хотите вступить."
 join_a_league: "Вступление в лигу"
 join_a_league_desc: "В #TOOLTIP:REGION,italy_region,X #L Италию#!#! пришла война. Мы должны защитить нашу независимость от захватчиков из чужеземных лиг. Для этого нам нужно присоединиться к одной из итальянских лиг!"
 create_italian_league: "Создание итальянской лиги"
 create_italian_league_desc: "Защита родины лежит на наших плечах. Если мы не сможем объединиться против иноземных завоевателей, то станем для них лёгкой добычей…"
 choose_province_to_plan_campaign_text: "Выберите провинцию, которую хотите сделать целью."
 creates_italian_league_with_actor_leader_tt: "Создаёт [Concept('international_organization', 'международное объединение')|e] #italic «Итальянская лига»#!, которое возглавит [actor.GetName]"
 member_of_a_league_already: "Уже [Concept('member', 'входит')|e] в Итальянскую лигу"
 dissolve_italian_league: "Роспуск нашей итальянской лиги"
 dissolve_italian_league_desc: "Наша лига слишком слаба, чтобы противостоять захватчикам. Следует распустить её и вступить в другую, иначе мы падём жертвой иностранных держав…"
 plan_campaign_in_italy: "Кампания в Италии"
 plan_campaign_in_italy_desc: "В процветающих и богатых городах #TOOLTIP:REGION,italy_region,X #L Италии#!#! живут самые обеспеченные люди #TOOLTIP:CONTINENT,europe,X #L Европы#!#!. Нужно как можно скорее спланировать военную кампанию в этом регионе, отправить туда наши могучие армии и прибрать к рукам часть этих богатств!"
 iw_intervene_in_war: "Вмешательство в войну"
 iw_intervene_in_war_desc: "Хаос нескончаемых войн между фракциями, бушующих по всему полуострову, вот-вот выплеснется через край и опустошит всю #TOOLTIP:REGION,italy_region,X #L Италию#!#!. Мы обязаны положить конец этому конфликту, и прямое вмешательство подойдёт как нельзя лучше."
 fortify_key_location: "Укрепление ключевого района"
 fortify_key_location_desc: "Если мы укрепим стратегические позиции и выставим там гарнизоны, врагу будет труднее захватить наши ключевые владения."
 fortify_key_location_no_target_tt: "Выбранный [Concept('location', 'район')|e] получит [Concept('modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,iw_fortify_key_location_modifier,X #V #L «Укреплённая позиция»#!#!#! на #Y 5#! лет"
