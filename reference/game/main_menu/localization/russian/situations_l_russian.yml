 will_support_delhi_tt: "Мы будем #Y поддерживать#! #ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_ACC')|L]#!#! в [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
 gain_leadership_during_situation_tt: "Мы возглавим #Y  сопротивление#! против [GetCountry('DLH').Custom('CL_GEN')] в [Concept('situation', 'ситуации')|e] «[GetSituationByKey('fall_of_delhi').GetName]»"
 opposition_share_of_power_1_tt: "[Concept('share_of_power_gc', 'Доля власти')|e] противников #ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_GEN')|L]#!#! составляет хотя бы 100%"
 delhi_share_of_power_1_tt: "[Concept('share_of_power_gc', 'Доля власти')|e] державы [GetCountry('DLH').GetName] составляет хотя бы 100%"
