 fall_of_delhi_delhi_progress: "#T [GetSituationByKey('fall_of_delhi').GetNameWithNoTooltip]#!\nЭто [Concept('share_of_power_gc', 'доля власти')|e] государства [GetCountry('DLH').GetName]. Оно одержит победу, если его доля власти составит #Y 100%#!, прежде чем произойдёт [Concept('disaster', 'бедствие')|e] «[ShowDisasterName('dissolution_of_delhi')]»."
 fall_of_delhi_opposers_progress: "#T Падение Дели#!\nЭто [Concept('share_of_power_gc', 'доля власти')|e] противников #ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_GEN')|L]#!#!. Если их доля власти составит #R 80%#!, [GetCountry('DLH').Custom('CL_ACC')] может постигнуть [Concept('disaster', 'бедствие')|e] #TOOLTIP:DISASTER_TYPE,dissolution_of_delhi,X #L «Распад Делийского Султаната»#!#!."
