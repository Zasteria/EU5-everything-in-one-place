 #Rise of the Ottomans
 rise_of_the_ottomans: "Восхождение турок"
 rise_of_the_ottomans_desc: "Раздробленная #TOOLTIP:REGION,anatolia_region,X #L Анатолия#!#! приняла на себя всю мощь удара #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турецких#!#! бейликов, которыми движут дерзкие замыслы, неудержимая сила и грандиозные планы. Кочевой народ, постигший цивилизационные тонкости оседлого общества, оказался способен воспитывать не только грозных воинов, но и умелых руководителей.\n\nРазделённые и уязвимые местные княжества не способны противостоять своим более сильным соперникам, которые воспользовались моментом и объединили раздробленные земли под своим знаменем. [GetCountry('TUR').GetName], детище великого деятеля по имени [GetCharacter('tur_osman').GetName], действу[GetCountry('TUR').Custom('end_etyut')] в едином порыве, который не утихнет ещё много веков.\n\nКаждая победа — это шаг вперёд для бейликов, постепенно набирающих силу, с которой придётся считаться любому. Покорение знаменитых городов ознаменует наступление новой эпохи — эпохи османского торжества."
