 #Guelphs and Ghibellines
 guelphs_and_ghibellines: "Гвельфы и гибеллины"
 guelphs_and_ghibellines_desc: "#TOOLTIP:INTERNATIONAL_ORGANIZATION,$guelphs_io_tt$,X #L Гвельфы#!#! и #TOOLTIP:INTERNATIONAL_ORGANIZATION,$ghibellines_io_tt$,X #L гибеллины#!#! несколько веков сражались за власть над #TOOLTIP:REGION,italy_region,X #L Италией#!#! с тех пор, как [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|l] и [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] схлестнулись в борьбе за инвеституру. Гвельфы поддерживают #L [GetCountry('PAP').GetAdjective|l]ую#! власть над полуостровом, тогда как гибеллины считаются имперскими лоялистами, преданными #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,hre,X #L Священной Римской Империи#!#!. Обе стороны давно вышли за пределы своих начальных позиций, их интересы стали куда шире, и различные державы нередко меняют поддерживаемую сторону в погоне за выгодой."
 GAG_GUELPH_LEADER: "Лидер гвельфов"
 GAG_GUELPH_LEADER_TT: "Держава, которая возглавляет #TOOLTIP:INTERNATIONAL_ORGANIZATION,$guelphs_io_tt$,X #L гвельфов#!#!, определяется её долей от общей [Concept('tax_base', 'налоговой базы')|e] фракции.\n\nЛидер может приглашать во фракцию другие державы и, если гвельфы достигнут #Y 100%-го#! прогресса, может сформировать #TOOLTIP:REGION,italy_region,X $tt_op_L$Италию$tt_cl_2$ со смягчёнными условиями."
 GAG_GHIBELLINES_LEADER: "Лидер гибеллинов"
 GAG_GHIBELLINES_LEADER_TT: "Держава, которая возглавляет #TOOLTIP:INTERNATIONAL_ORGANIZATION,$ghibellines_io_tt$,X #L гибеллинов#!#!, определяется её долей от общей [Concept('tax_base', 'налоговой базы')|e] фракции.\n\nЛидер может приглашать во фракцию другие державы и, если гибеллины достигнут #Y 100%-го#! прогресса, может попросить у императора #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! титул Королевства #TOOLTIP:REGION,italy_region,X $tt_op_L$Италия$tt_cl_2$ со смягчёнными условиями."
