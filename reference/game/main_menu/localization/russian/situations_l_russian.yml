 treaty_of_tordesillas.tt.location_is_in_conflict: "[THIS.GetLocation.GetRank.GetNameWithNoTooltip] [THIS.GetLocation.GetName] не может отойти какой-либо державе, пока идёт обсуждение договора, поскольку и [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetName], и [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetName] частично контролируют [Concept('area', 'область')|e] [THIS.GetLocation.GetArea.GetName]."
