 GAG_GUELPHS_VICTORY_TT: "[GetUniqueInternationalOrganization('guelphs_io').GetName] побеждают, когда их прогресс достигает #Y 100%#!.\n\nЛидер гвельфов может сформировать #TOOLTIP:REGION,italy_region,X #L Италию#!#!, игнорируя требования по районам.\n\nВсем итальянским державам на #Y 50 лет#! запрещено вступать в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священную Римскую Империю#!#!."
