 #Treaty of Tordesillas
 treaty_of_tordesillas: "Договор [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]"
 treaty_of_tordesillas_desc: "[GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetLongName] и [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetLongName] подписали этот договор в [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_PREP')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetName]. $treaty_of_tordesillas_desc_second_section$"
 treaty_of_tordesillas_desc_single_signatory: "Некогда в [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_PREP')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetName] две сильнейшие колониальные державы заключили договор, однако одна из империй канула в небытие, и теперь его соблюда[GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.Custom('endlong_etyut')] лишь [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetLongName]. $treaty_of_tordesillas_desc_second_section$"
 treaty_of_tordesillas_desc_second_section: "В договоре прописаны правила и условия, по которым две державы получают эксклюзивные права на колонизацию и эксплуатацию недавно открытых земель на #TOOLTIP:CONTINENT,america,X #L Американском континенте#!#!."
 claim_reason_treaty_of_tordesillas: "Получено по Договору [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]"
 claim_reason_cape_route_exploration: "Захвачено во время португальской экспедиции по поиску пути в Индию через Мыс Доброй Надежды"
 treaty_of_tordesillas.tt.location_is_east_of_line: "[THIS.GetLocation.GetRank.GetNameWithNoTooltip] [THIS.GetLocation.GetName] находится к востоку от воображаемой линии, в центре которой — [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_line_location').GetLocation.GetName]. По этой линии и пройдёт разграничение мира по условиям Договора [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip].\n\nПосле ратификации договора этот [Concept('location', 'район')|e] получ[GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.Custom('endlong_itat')] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetLongName]."
 treaty_of_tordesillas.tt.location_is_west_of_line: "[THIS.GetLocation.GetRank.GetNameWithNoTooltip] [THIS.GetLocation.GetName] находится к западу от воображаемой линии, в центре которой — [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_line_location').GetLocation.GetName]. По этой линии и пройдёт разграничение мира по условиям Договора [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip].\n\nПосле ратификации договора этот [Concept('location', 'район')|e] получ[GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.Custom('endlong_itat')] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetLongName]."
 treaty_of_tordesillas.tt.location_is_line_origin: "[THIS.GetLocation.GetName] — [Concept('location', 'район')|e], определяющий расположение воображаемой линии, которая разграничивает мир согласно Договору [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]."
 treaty_of_tordesillas.tt.location_is_first_country: "Верховный [Concept('overlord', 'сюзерен')|e] [THIS.GetLocation.Custom('LR_GEN')|l] [THIS.GetLocation.GetName] — [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetName]"
