 #Situation Actions
 fall_of_delhi_plea_neighbors: "Отправка послов"
 fall_of_delhi_plea_neighbors_desc: "Держава [GetCountry('DLH').GetFlavorRank] крайне аккуратно распоряжается своими печатями. Послы с документами, скреплёнными такой печатью, в сопровождении лучшей охраны — это уже само по себе подтверждение нашей мощи, способное охладить горячие головы всех, кто покушается на наши территории."
 fall_of_delhi_appoint_governors: "Назначение наместников"
 fall_of_delhi_appoint_governors_desc: "[GetCountry('DLH').GetFlavorRank], где мы живём, простирается далеко и широко. Нам отчаянно нужны умелые и преданные руководители благородного происхождения, способные обеспечить провинциям процветание и подавить инакомыслие."
 fall_of_delhi_reaffirm_vassal_relations: "Требование дани"
 fall_of_delhi_reaffirm_vassal_relations_desc: "Наше положение зыбко, а казна грозит вот-вот опустеть, однако наш долг — напомнить ленникам, перед кем они преклоняют колено. Потребовав дань и приняв у себя их правителей, мы поспособствуем укреплению отношений между ленниками и сюзереном."
 fall_of_delhi_appease_the_nobility: "Умиротворение аристократов"
 fall_of_delhi_appease_the_nobility_desc: "Нельзя недооценивать влияние, которым располагают [SCOPE.sCountry('actor').GetGovernment.GetEstateName('nobles_estate')|l] в вопросах успеха и процветания нашей державы. Они возводят царей на трон и следят за соблюдением законов короны, а потому обладают великой силой [GetCountry('DLH').Custom('endrank_predlog_vvo')] [GetCountry('DLH').Custom('rank_ru_PREP')|l]. Ради нашего же блага мы должны немедленно заручиться их верностью, иначе их властолюбие погубит нас всех…"
 fall_of_delhi_join_opposers: "Выступление против [GetCountry('DLH').Custom('CL_GEN')]"
 fall_of_delhi_join_opposers_desc: "#ONCLICK:COUNTRY,[GetCountry('DLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('DLH').Custom('CL_tt')],X [GetCountry('DLH').Custom('CL_DAT')|L]#!#! грозит неминуемое поражение под давлением покорённых этим государством народов, решивших покончить с угнетением. Надо оседлать ветер перемен и воспользоваться ситуацией. [GetCountry('DLH').GetFlavorRank] покорителей вскоре распадётся на части, и на этих обломках мы построим собственную державу, которая навсегда войдёт в историю…"
 fall_of_delhi_join_delhi: "Поддержка [GetCountry('DLH').Custom('CL_GEN')]"
 fall_of_delhi_join_delhi_desc: "Мы заинтересованы в том, чтобы сложившийся порядок оставался неизменным. И [GetCountry('DLH').GetFlavorRank|l], и весь [GetCountry('DLH').GetAdjectiveWithNoTooltip|l]ий народ в трудном положении, однако мы будем и дальше придерживаться принципов верховенства права… пока это нам выгодно."
 strengthen_neighbor_relations: "Укрепление отношений с соседями"
 strengthen_neighbor_relations_desc: "Нам следует утихомирить многочисленные соседние государства, окружающие [GetCountry('DLH').Custom('rank_ru_ACC')|l], чтобы они не пытались расширяться за наш счёт!"
