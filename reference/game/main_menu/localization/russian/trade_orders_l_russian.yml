 TRADE_ORDER_MIN_PROFIT_TT: "Приказ не сможет заключать [Concept('trades', 'сделки')] ниже этого порогового значения, что обеспечивает заданную прибыльность.\n\nЕсли значение отрицательное или не установлено, [Concept('trade_order', 'торговый приказ')] сможет заключать убыточные [Concept('trades', 'сделки')], фактически субсидируя [Concept('trade', 'торговлю')].\n\nЧем ближе прибыль от лучшей [Concept('trade', 'сделки')] находится к этому значению, тем медленнее и меньше будет расходоваться торговый потенциал на этот товар — приказ предпочтёт оставить избыток потенциала, чтобы не обрушивать выгодну цену. Чем выше значение в сравнении с пороговым, тем быстрее и больше расходуется потенциал."
