 TRADE_ORDER_TRADES_TOOLTIP_SUMMARY: "Действующие [Concept('trade', 'торговые')|e] маршруты: [TradeOrderItem.GetTradeCount]. Прибыль: [TradeOrderItem.GetProfitPerCapacity|+=2]@gold! на [Concept('merchant_capacity', 'торговый потенциал')|e]."
 TRADE_ORDER_TRADES_TOOLTIP_SUMMARY_MIN: "[TradeOrderItem.GetTradeCount] шт. активных [Concept('trade', 'торговых')|e] путей имеют [Concept('trade_profit', 'прибыльность')|e] сверх минимума в [TradeOrderItem.GetMinProfit|+=2]@profit_trade! на единицу [Concept('merchant_capacity', 'торгового потенциала')|e], принося нам [TradeOrderItem.GetProfitPerCapacity|+=2]@profit_trade! за единицу [Concept('merchant_capacity', 'торгового потенциала')|e], что в сумме приносит нам [TradeOrderItem.GetTotalProfit|+=2]@gold!."
 TRADE_ORDER_TRADES_TOOLTIP_NONE_MIN: "Нет [Concept('trade', 'торговых')|e] путей с [Concept('trade_profit', 'прибыльностью')|e] сверх минимума в [TradeOrderItem.GetMinProfit|+=2]@profit_trade! на единицу [Concept('merchant_capacity', 'торгового потенциала')|e]. Держава под управлением компьютера будет ежедневно повторять попытки."
 TRADE_ORDER_TRADES_TOOLTIP_NONE: "Пока нет активных [Concept('trade', 'торговых')|e] путей. Держава под управлением компьютера будет пытаться организовать сделку каждый день."
 TRADE_ORDER_SKIPPED_NO_CAPACITY: "Этот [Concept('trade_order', 'торговый приказ')|e] не оценивается, поскольку [Concept('trade_orders', 'торговые приказы')|e] с более высоким приоритетом или ручная торговля уже задействуют весь доступный [Concept('merchant_capacity', 'торговый потенциал')|e] на этом [Concept('market', 'рынке')|e]."
 TRADE_ORDER_GOOD_TRADES_TOOLTIP_SUMMARY: "[TradeOrderGoodsEntryItem.GetTradeCount] шт. активных [Concept('trade', 'торговых')|e] путей для этого товара приносят нам [TradeOrderGoodsEntryItem.GetProfitPerTC|+=2]@profit_trade! за единицу [Concept('merchant_capacity', 'торгового потенциала')|e]."
 TRADE_ORDERS_SCROLL_LIST_EMPTY: "На этом рынке нет [Concept('trade_order', 'торговых приказов')|e]."
 TRADE_ORDER_TRADES_SCROLL_LIST_EMPTY: "На этом рынке нет [Concept('trade', 'торговли')|e] этим товаром. Начните её вручную или же отдайте [Concept('trade_order', 'торговый приказ')|e]."
 TRADE_ORDER_MODE_PROFIT: "Упор на прибыль"
 TRADE_ORDER_MODE_FOOD: "Упор на пищу"
 TRADE_ORDER_MODE_NEEDS: "Упор на дефициты"
 TRADE_ORDER_MODE_PROFIT_WITH_ICON: "@gold! $TRADE_ORDER_MODE_PROFIT$"
 TRADE_ORDER_MODE_FOOD_WITH_ICON: "@food! $TRADE_ORDER_MODE_FOOD$"
 TRADE_ORDER_MODE_NEEDS_WITH_ICON: "@shortage! $TRADE_ORDER_MODE_NEEDS$"
 TRADE_ORDER_MODE_PROFIT_TT: "Приказ будет расходовать свой [Concept('merchant_capacity', 'торговый потенциал')|e] на самые прибыльные [Concept('trades', 'сделки')|e], связанные с выбранными товарами и рынками."
 TRADE_ORDER_MODE_FOOD_TT: "Приказ будет расходовать свой [Concept('merchant_capacity', 'торговый потенциал')|e] на [Concept('trades', 'сделки')|e], перемещающие наибольшее количество [Concept('food', 'пищи')|e] на рынки, теряющие пищу и обладающие [Concept('food_stockpile', 'запасами')|e] меньше [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]."
 TRADE_ORDER_MODE_NEEDS_TT: "Приказ будет расходовать свой [Concept('merchant_capacity', 'торговый потенциал')|e] на покрытие дефицита [Concept('goods', 'товаров')|e] на целевых рынках, пункт за пунктом, по очереди. Снабжаются только товары, [Concept('stockpile', 'запасы')|e] которых ниже [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]."
 TRADE_ORDER_MODE_PROFIT_INFO: "Этот приказ делает упор на #italic прибыль#!: он расходует свой [Concept('merchant_capacity', 'торговый потенциал')|e] на самые прибыльные [Concept('trades', 'сделки')|e], связанные с выбранными товарами и рынками."
 TRADE_ORDER_MODE_FOOD_INFO: "Этот приказ делает упор на #italic пищу#!: он расходует свой [Concept('merchant_capacity', 'торговый потенциал')|e] на [Concept('trades', 'сделки')|e], перемещающие наибольшее количество [Concept('food', 'пищи')|e] на нуждающиеся рынки.\n\nРынок получает помощь только в случае, если он будет терять пищу без этого приказа, и его [Concept('food_stockpile', 'запас пищи')|e] ниже [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]. Ниже [GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%] приказ также восполняет запасы на [GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%] от максимума в месяц. Выше [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] рынок считается обеспеченным и не получает ничего.\n\nЭкспорт приостанавливается, если [Concept('food_stockpile', 'запас пищи')] на рынке владельца ниже [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%], и отменяется, если ниже [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]."
 TRADE_ORDER_MODE_NEEDS_INFO: "Этот приказ делает упор на #italic потребности#!: он расходует свой [Concept('merchant_capacity', 'торговый потенциал')|e] на покрытие потребления каждого товара в списке в нисходящем порядке.\n\nТовар поставляется только в случае, если целевой рынок потребляет больше, чем производит на месте, а его [Concept('stockpile', 'запасы')|e] ниже [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]. Приказ перевозит ровно столько, сколько нужно для сведения баланса к нулю, учитывает уже прибывающую помощь из других мест и игнорирует дефицит, вызванный одним лишь экспортом.\n\nПока [Concept('stockpile', 'запасы')|e] товара ниже [GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%], приказ также восполняет его до [GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%] от максимума в месяц. Между этим значением и [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%] он покрывает только баланс."
 TRADE_ORDER_NEW_TOOLTIP_SUMMARY: "Новый [Concept('trade_order', 'торговый приказ')|e] задействует [TradeOrderLateralView.GetEffectiveTC|2]@trade_capacity!. Компьютер создаст [Concept('trades', 'торговые сделки')|e] после того, как вы подтвердите приказ."
