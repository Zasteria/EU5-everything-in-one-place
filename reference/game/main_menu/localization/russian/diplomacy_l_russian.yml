 generic_war_goal_naval_superiority_desc: "[Concept('war_goal', 'Цель войны')|e] — показать превосходство на море. Вы получаете прибавку к [Concept('war_score', 'военному счёту')|e] за победу в морских битвах. При [Concept('blockade', 'блокаде')|e] порта (если противник не сделал того же) ваш [Concept('war_score', 'военный счёт')|e] будет постепенно увеличиваться."
 generic_war_goal_superiority: "Демонстрация превосходства"
 generic_war_goal_superiority_desc: "[Concept('war_goal', 'Цель войны')|e] — продемонстрировать превосходство. Участники получат прибавку к [Concept('war_score', 'военному счёту')|e] за победу в битвах.\nПри накоплении свыше $THRESHOLD|Y%$ [Concept('war_score', 'военного счёта')|e] за победы в битвах наш [Concept('war_score', 'военный счёт')|e] будет постепенно увеличиваться."
