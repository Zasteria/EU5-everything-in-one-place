 generic_war_goal_defend_capital_desc: "[Concept('war_goal', 'Цель войны')|E] — защитить нашу столичную [Concept('province', 'провинцию')|E]. За оборону [Concept('capital', 'столицы')] и любых [Concept('location', 'районов')|E] в этой провинции наш [Concept('war_score', 'военный счёт')|E] будет постепенно увеличиваться."
