 generic_war_goal_enforce_military_access_desc: "$generic_war_goal_superiority_desc$"
 generic_war_goal_independence: "Освобождение [PROVINCE.GetCountry.Custom('CL_GEN')]"
 generic_war_goal_independence_desc: "[Concept('war_goal', 'Цель войны')|e] — контроль над всей [Concept('country', 'территорией')|e] #ONCLICK:COUNTRY,[PROVINCE.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[PROVINCE.GetCountry.Custom('CL_tt')],X [PROVINCE.GetCountry.Custom('CL_GEN')|L]#!#!.\n[Concept('war_score_with_icon', 'Военный счёт')|e] борцов за независимость будет постепенно увеличиваться, если они не дадут бывшему [Concept('overlord', 'сюзерену')|e] [Concept('occupying', 'оккупировать')|e] свою территорию.\n\nБывший [Concept('subject', 'ленник')|e] должен будет утвердить свою независимость с помощью [Concept('peace_treaty', 'мирного договора')|e]. [Concept('white_peace_with_icon', 'Мир на условиях «статус-кво»')|e] восстановит положение, которое сложилось до [Concept('war', 'войны')|e]."
 generic_war_goal_destroy_army: "Уничтожение армии"
 generic_war_goal_destroy_army_desc: "[Concept('war_goal', 'Цель войны')|e] — уничтожить вражеские [Concept('armies', 'армии')|e]. Если у одной из сторон есть [Concept('army', 'армия')|e], а у другой нет, [Concept('war_score', 'военный счёт')|e] первой стороны будет постепенно увеличиваться."
