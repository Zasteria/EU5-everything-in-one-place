 war_goal_superiority_restore_roman_borders: "Восстановление римских границ"
 war_goal_superiority_restore_roman_borders_desc: "Воссияй вновь, славный Рим! Эпоха упадка подходит к концу. На смену ей спешит новая эра — эра торжества возрождённой империи, великолепной и грандиозной. [ShowScriptedGeographyName('roman_borders_geography')] ждут нашего возвращения!\n\nВы получаете прибавку к [Concept('war_score', 'военному счёту')|e] за успешные осады и [Concept('occupying', 'оккупацию')|e] регионов противника, которые распространяются не дальше, чем [ShowScriptedGeographyName('roman_borders_geography')|l]. Противник регулярно получает [Concept('war_score', 'военный счёт')|e] за каждый [Concept('locations', 'район')|e] на этих территориях, который не [Concept('occupied', 'оккупирован')|e] нами."
