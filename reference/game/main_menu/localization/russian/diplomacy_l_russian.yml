 war_goal_secure_italy_wargoal_desc: "[Concept('war_goal', 'Цель войны')|e] — захватить Итальянскую провинцию. Мы получим прибавку к [Concept('war_score', 'военному счёту')|e] за оккупацию выбранной [Concept('province', 'провинции')|e]. При оккупации и удержании каждого [Concept('location', 'района')|e] [Concept('province', 'провинции')] наш [Concept('war_score', 'военный счёт')|e] будет постепенно увеличиваться.\n\n#Y Завоевание ограничено пределами #TOOLTIP:REGION,italy_region,X #L Италии#!#!#!"
