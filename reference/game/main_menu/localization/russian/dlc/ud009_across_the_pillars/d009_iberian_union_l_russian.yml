l_russian:
 catholic_monarchs_law: "Католические монархи"
 catholic_monarchs_law_desc: "Брак, скрепивший наши короны, — основа всего, что последует за ним. От того, как королевская чета изберёт править — как равные или с преимуществом одного дома, — будет зависеть облик унии на многие поколения вперёд."
 iu_establish_iberian_wedding_succession_tt: "Устанавливает [ShowRelationTypeName('iberian_wedding_pact')] между двумя коронами и определяет их [heir_selection|e] как [ShowHeirSelectionName('iberian_union_succession')], связывая их наследование, чтобы общий наследник мог объединить королевства"
 composite_monarchy_law: "Composite Monarchy"
 composite_monarchy_law_desc: "Our realms are joined under one sovereign, yet each keeps its own laws and liberties. We must decide whether to honor the #italic fueros#! of every kingdom or to gather their governance into a single hand."
 asientos_law: "Асьентос"
 asientos_law_desc: "The crown grants #italic asientos#!, exclusive contracts to supply and provision our overseas dominions, and whoever holds them reaps the wealth of empire. The union must decide whether the crown awards these contracts to itself, or shares them among the merchants of all its realms."
 religious_authority_law: "Religious Authority"
 religious_authority_law_desc: "Нашим объединённым коронам предстоит решить, как употребить власть веры. Корона может направлять Церковь в наших землях через #italic Patronato Real#!, либо обратить это рвение вовне, став мечом и щитом христианского мира."
 legislative_authority_law: "Законодательная власть"
 legislative_authority_law_desc: "По чьей воле должны управляться королевства? Закон может исходить из королевской руки через обязательные #italic pragmáticas#!, либо опираться на согласие собственных #italic Cortes#! каждого королевства."
 crown_settlement_law: "Устройство корон"
 crown_settlement_law_desc: "Окончательный облик унии предстоит определить. Единый закон и единая монета могут выковать из множества королевств единую, объединённую монархию, либо короны продолжат существовать как прочное содружество равных."
 union_of_arms_law: "Union de Armas"
 union_of_arms_law_desc: "Оборона унии — долг каждого королевства в её составе. Будь то через обязательную квоту или добровольный вклад, королевства будут нести бремя оружия сообща."
 iu_tanto_monta_policy: "Tanto Monta"
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! — оба государя правят как равные, ни один не выше другого. Уния равного достоинства связывает королевства во взаимном уважении и общем династическом единстве."
 iu_dynastic_primacy_policy: "Династическое первенство"
 iu_dynastic_primacy_policy_desc: "Одна корона признаётся старшей в унии, а её династия — главенствующей среди прочих владений. Ведущий дом пожинает наибольший престиж, в то время как все члены унии разделяют положение уверенной в себе монархии."
 iu_dynastic_primacy_senior_only_tt: "Если мы являемся [senior_partner|e]:"
 iu_respect_fueros_policy: "Уважение к фуэросам"
 iu_respect_fueros_policy_desc: "Древние вольности каждого королевства подтверждаются и охраняются. Меньшие владения правят собой в мире, а старшая корона заслуживает уважения, подобающего государю, хранящему верность традициям своих земель."
 iu_centralized_administration_policy: "Централизованное управление"
 iu_centralized_administration_policy_desc: "Управление владениями сосредотачивается в руках единой администрации. Старшая корона расширяет своё влияние, а меньшие владения черпают законность из порядка единого государства."
 iu_crown_asientos_policy: "Королевские асьентос"
 iu_crown_asientos_policy_desc: "Корона сама распределяет поставочные контракты, сосредотачивая торговлю и драгоценные металлы в старшем владении. Меньшие королевства получают выгоду от снабжения владений, а их промышленность оживляется спросом."
 iu_shared_asientos_policy: "Совместные асьентос"
 iu_shared_asientos_policy_desc: "Контракты распределяются между купцами всех владений. Меньшие королевства получают прямой доступ к прибыльной торговле поставками, а старшая корона пользуется более дешёвыми товарами, идущими через общую сеть."
 iu_patronato_real_policy: "Patronato Real"
 iu_patronato_real_policy_desc: "Согласно #italic Patronato Real#!, корона управляет Церковью во всех наших владениях, назначая её прелатов и распоряжаясь её доходами. Вера, управляемая престолом, есть вера, связанная с престолом."
 iu_catholic_champion_policy: "Поборник веры"
 iu_catholic_champion_policy_desc: "Our united crowns take up the banner of Christendom, championing the faith against unbeliever and heretic alike. Let our realms be known as the sword and shield of the Church."
 iu_pragmaticas_policy: "Прагматические санкции"
 iu_pragmaticas_policy_desc: "Закон должен исходить от королевской воли. Своим обязательным указом, #italic прагматиками #!, государь издаёт законы сразу для всех владений, не дожидаясь одобрения какого-либо собрания."
 iu_regional_cortes_policy: "Региональные кортесы"
 iu_regional_cortes_policy_desc: "Каждое владение управляется с согласия собственных #italic кортесов#!. Правление через старые собрания придаёт законность каждой короне и скрепляет союз добровольной верностью."
 iu_una_ley_una_moneda_policy: "Una Ley, Una Moneda"
 iu_una_ley_una_moneda_policy_desc: "One law and one coin for all our realms. Unifying the crowns this way dilutes the old borders, strengthening the ties of the many kingdoms into a single, unified monarchy."
 iu_perpetual_crown_policy: "Вечная федеративная корона"
 iu_perpetual_crown_policy_desc: "Союз скрепляется как постоянный договор корон. Устойчивое и долговечное партнёрство придаёт каждому владению законность и стабильность, а связь между членами союза становится самой прочной."
 iu_proportional_levy_policy: "Пропорциональный набор"
 iu_proportional_levy_policy_desc: "Каждое владение выставляет свою долю в общем войске. Союз собирает большую и лучшую армию, а старшая корона командует ополчениями, сосредоточенными под её началом."
 iu_negotiated_contribution_policy: "Договорной взнос"
 iu_negotiated_contribution_policy_desc: "Владения вносят вклад в общую оборону по взаимному согласию, а не по принуждению. Бремя кажется легче, когда несётся добровольно, а несение его воспитывает дисциплину в войске и согласие между членами союза."
 proclaim_spanish_monarchy: "Провозгласить Испанскую монархию"
 proclaim_spanish_monarchy_desc: "Провозгласить многие короны нашего союза единой и неделимой монархией и принять имя и достоинство Испании."
 proclaim_spanish_monarchy_integration_tt: "Наш союз должен достичь уровня интеграции не менее 5"
