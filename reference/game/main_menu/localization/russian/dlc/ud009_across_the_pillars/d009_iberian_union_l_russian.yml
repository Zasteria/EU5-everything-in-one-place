 iberian_union_succession: "Иберийское династическое наследование"
 iberian_union_succession_desc: "Разновидность [heir_selection|e], используемая христианскими монархиями [ShowRegionName('iberia_region')], связанными [ShowRelationTypeName('iberian_wedding_pact')]. Если один из правителей умрёт, не оставив законного наследника, другой правитель унаследует его престол, объединив короны в [union|e]."
 iberian_union_succession_tt: "Образовать [union|e] на случай, если наш преемник не окажется наследником предыдущего правителя"
 iu_dynastic_primacy_seniority_tt: "Когда образуется эта [union|e], член унии с наивысшей [economical_base|e] назначается [ShowSpecialStatusName('senior_partner')], вводя в действие [ShowPolicyName('union_establish_seniority_policy')] и [ShowPolicyName('union_senior_succession_law')] для всей унии"
 iu_tanto_monta_no_seniority_tt: "Статус [ShowSpecialStatusName('senior_partner')] таким образом не назначается, а [ShowPolicyName('union_establish_seniority_policy')] и [ShowPolicyName('union_senior_succession_law')] не вводятся для [union|e]"
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nThese crowns share an Iberian Wedding Pact. If either ruler dies without an heir of their own, the other inherits the throne of the former, forming a [union|e] between the two countries."
 offer_iberian_wedding_pact_proposal_question: "Propose the $diplomatic_status_iberian_wedding_pact_name$ with [COUNTRY.GetName]?\n$INFO$"
