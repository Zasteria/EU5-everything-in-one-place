l_russian:
 seven_cities.10.title: "Сияющий город вдали"
 seven_cities.10.desc: "The local guides, when the wine is poured and the trade goods are laid out for inspection, are willing to talk. Yes, they have heard of the country the [target_leader.GetName] is asking after. Yes, there is a city there, beyond the next sierra, perhaps two weeks further. One man swears he saw the sun rising over its walls from a distance, gold-coloured. Another says his uncle traded there for a season and came back rich. A third says it is a fairy-tale and the first two will say anything for a measure of brandy. The chronicler writes it all down."
 seven_cities.10.a: "Бренди для тех, чьи байки лучше всех."
 seven_cities.10.b: "Попрощаться с ними и выступить в путь."
 seven_cities.10.b.tt: "#italic Мы прощаемся с рассказчиками и отправляемся в путь, доверяя дороге больше, чем очередной байке#!"
 seven_cities.10.historical_info: "Early Spanish, French, and English entradas in the Americas relied almost entirely on native informants for geographic intelligence. The information was often shaped by what the natives believed their interrogators wanted to hear, by what the natives wanted the interrogators to do (frequently, to leave), and by the conjectural picture the interrogators arrived with. The result was a chronic feedback loop in which European legends of golden cities were validated by native testimony that had itself been calibrated to European expectations."
 natives_provide_crudely_drawn_map_tt: "#Y Местные жители предоставляют грубо начерченную карту окрестных земель#!"
 expedition_learns_of_potential_dangers: "#Y [expedition|e] узнаёт о возможных местных опасностях#!"
 bonding_over_alcohol_locals_migrate_tt: "#Y Общая любовь к выпивке и добрым беседам порождает братские узы#!"
 improve_root_culture_view_of_location_dominant_culture_tt: "Наше [cultural_opinion|e] о культуре [target_location.GetDominantCulture.GetName] улучшится"
 expedition_observes_local_innovations: "#Y Local innovations are observed and catalogued#!"
 expedition_receives_artifacts_as_gifts: "#Y По возвращении в [ROOT.GetCountry.GetCapital.Custom('CL_INST')] в дар будут преподнесены культурные артефакты #!"
 should_calamity_occur_chance_to_avoid_tt: "Местные враждебные банды и дикая природа станут менее опасны"
 may_bring_us_closer_to_uncovering_goal_tt: "Это может приблизить нас к раскрытию того, что мы ищем"
 expedition_brought_back_riches_tt: "[expedition|e] привезла назад богатства:"
 expedition_brought_back_exotic_goods_tt: "Носильщики и груз [expedition|e] привезли назад экзотические товары:"
 expedition_brought_back_artifacts_tt: "[expedition|e] привезла подарки и артефакты:"
 expedition_healer_joins_court_tt: "К нашему двору присоединяется местный лекарь, когда [expedition|e] возвращается"
 porters_guides_prevent_stalling: "Носильщики и проводники, сопровождающие [expedition|e], не дают ей застопориться"
 warned_expedition_avoids_calamity_tt: "Предупреждённая о местных опасностях, [expedition|e] избегает беды"
 seven_cities.11.title: "Пир гостеприимства"
 seven_cities.11.desc: "The town turns out to meet us before we have even pitched camp: drums, a swept plaza, and mats laid with more food than the men have seen in a month of marching. Their headman greets [target_leader.GetName] with the grave courtesy of an equal, and the feasting is well under way before anyone thinks to ask a question. Our interpreters murmur that a welcome this warm is never truly free, and that what is pressed upon a guest in one breath tends to be counted against him in the next. Still, an open host and a laden table have loosened more tongues than any threat we might have made."
 seven_cities.11.a: "Ответить на их радушие открытыми руками и открытым кошельком."
 seven_cities.11.b: "Мы пересекли океан не для того, чтобы сидеть и есть."
 seven_cities.11.b.tt: "#italic Мы принимаем угощение, но бережём кошелёк, и выступаем в путь прежде, чем гостеприимство обернётся обязательством#!"
 seven_cities.11.historical_info: "Обрядовое гостеприимство занимало центральное место в дипломатии на большей части Америки, и прибывающих европейцев нередко встречали пирами, дарами и торжественным приёмом ещё до начала каких-либо переговоров. Отряд Коронадо принимали и кормили города пуэбло вдоль Рио-Гранде, а отряд де Сото — вожди миссисипских племён на юго-востоке; в обоих случаях это было способом обезопасить себя от опасных чужаков, а вовсе не покориться им. Европейцы же намеренно везли с собой стеклянные бусы, соколиные бубенцы, ткани и ножи, чтобы открыть такие обмены. Дары покупали расположение и сведения, но саму сделку каждая сторона почти всегда понимала совершенно по-своему."
 expedition_receives_guides_and_porters: "#Y В путь добавляются проводники и носильщики#!"
 expedition_less_likely_to_stall_tt: "[expedition|e] будет с меньшей вероятностью застопориваться"
 expedition_receives_exotic_goods: "#Y [expedition|e] выменивает диковинные местные товары, чтобы привезти домой#!"
 seven_cities.12.title: "Ретивый проводник"
 seven_cities.12.desc: "Он находит нас, а не мы его: худощавый, легко улыбающийся человек, который, кажется, немного знает язык каждого встречного народа по пути, и клянётся, прижав руку к сердцу, что своими глазами видел врата золотого города. Он просит лишь плату проводника да скромную долю славы за то, чтобы привести нас туда. [target_leader.GetName] слушает его с настороженностью бывалого человека, которому уже доводилось слышать это самое обещание — в других долинах, из других уст. Люди же уже всё для себя решили, и глаза их горят не менее ярко, чем у него самого."
 seven_cities.12.a: "Богатство и слава!"
 seven_cities.12.b: "Прочь отсюда, попрошайка!"
 seven_cities.12.b.tt: "#italic Мы прогоняем улыбчивого проводника и держимся пути, который можем разобрать сами#!"
 seven_cities.12.historical_info: "The most notorious guide of the North American entradas was the Plains captive the Spanish called El Turco, who told Coronado's expedition of Quivira, a kingdom to the northeast supposedly rich in gold. He led the column for weeks out onto the Great Plains and later admitted, under interrogation, that he had been steering it into the grass in the hope that the men and their horses would die there. Quivira, when finally reached, proved to be a cluster of Wichita grass-lodge villages with no gold at all, and El Turco was executed. The episode was typical: guides had their own reasons for where they led armed strangers, and those reasons rarely matched the expedition's."
 expedition_uncovers_riches_in_new_waypoint: "#Y Путь проводника оказался верным — он привёл к настоящим богатствам#!"
 expedition_led_to_deathly_trap: "#Y Проводник заводит нас в засаду, и [expedition|e] потеряна#!"
 guide_lied_waste_of_time: "#Y Проводник водил нас кругами, а его золотой город оказался ложью#!"
 target_character_flogged_tt: "Лживого проводника подвергают порке за его обман"
 seven_cities.13.title: "Знакомая речь"
 seven_cities.13.desc: "Где-то по пути [target_leader.GetName] переменился. Раньше [target_leader.GetSheHe] говорил лишь о городе впереди, а теперь [target_leader.GetSheHe] говорит о здешних людях: об их наречии, которое [target_leader.GetSheHe] уже наполовину выучил, о крове, что ему предложили, о спокойной жизни, которая ждёт, если [target_leader.GetSheHe] перестанет наконец скитаться. Сегодня утром [target_leader.GetSheHe|U] прямо сказал нам, что экспедиция может идти дальше, но что сам [target_leader.GetSheHe] не пойдёт. Одни люди пропадают в глуши, а других, похоже, глушь забирает себе."
 seven_cities.13.a: "Пусть же [target_leader.GetHerHim] останется, и пусть мечта закончится здесь."
 seven_cities.13.historical_info: "Потерпевшие крушение или попавшие в плен европейцы, годами жившие среди туземных народов, ценились последующими экспедициями как переводчики. Эрнандо де Сото нашёл Хуана Ортиса, выжившего из более ранней экспедиции Нарваэса, который прожил среди племени юсита во Флориде около одиннадцати лет; Ортис служил ему переводчиком до самой своей смерти в пути. Гонсало Герреро, потерпевший крушение у берегов Юкатана в 1511 году, пошёл совершенно иным путём: женился в майянской общине, отказался от спасения и, по преданию, погиб в бою против испанцев. Такие люди были живыми мостами между мирами, и их верность могла склониться на любую сторону."
 seven_cities.14.title: "Источник юности?"
 seven_cities.14.desc: "Рассказ доходит до нас из третьих уст и разрастается с каждым пересказом: где-то в холмах впереди лежит источник, чьи воды исцеляют старые раны, выпрямляют согнутые спины и возвращают человеку годы, украденные походом. Туземцы говорят о нём с той настороженной почтительностью, какую хранят для святых мест — а это либо доказательство чего-то, либо вовсе ничего не доказывает. Наш лекарь лишь закатывает глаза и бормочет про болотную лихорадку. Половина лагеря уже наполняет бурдюки."
 seven_cities.14.a: "Осмотреть источник."
 seven_cities.14.b: "Нет времени плескаться в воде!"
 seven_cities.14.b.tt: "#italic Мы проходим мимо легендарного источника, оставляя его воды доверчивым#!"
 seven_cities.14.historical_info: "Источник юности был подлинной частью географических легенд, которые европейцы принесли в Америку, и её связали с экспедицией Хуана Понсе де Леона во Флориду в 1513 году. Утверждение, будто он отправился в плавание именно в поисках живой воды, — во многом позднейшее преувеличение, впервые распущенное его политическими врагами, но оно опиралось на более древние старосветские легенды о целебных и продлевающих жизнь источниках, в которые многие искренне верили. Местные жители на Карибах и на юго-востоке действительно направляли европейцев к священным и целебным водам — подлинным элементам их собственного ритуального ландшафта. Расстояние между тем, что рассказывали, и тем, что искали, оказалось, как и прежде, очень велико."
 spend_some_time_recovering: "#Y Люди отдыхают и в течение некоторого времени принимают целебные воды#!"
 retrieve_some_rejuvenating_water: "#Y Фляги легендарной живой воды унесены прочь#!"
 just_water_hole: "#Y Оказывается, это обычная водопойня...#!"
 seven_cities.15.title: "Блеск в русле реки"
 seven_cities.15.desc: "Один из наших людей на закате присел у ручья, промывая гравий в лотке так, как учили его старые рудокопы, и вдруг вскрикивает — то ли от ругани, то ли от смеха: в иле блестит одна-единственная яркая крупица [target_material.GetName]. Значит, выше по течению её больше. Сокровище ли это, за которым весь поход гонится через целый континент, или лишь пустая мишура, годная только на то, чтобы обмануть жадных людей — сегодня никто сказать не может, да и спрашивать особо не хочется."
 seven_cities.15.a: "Всем к реке с лотками."
 seven_cities.15.b: "Ба! Ну конечно, король пирита!"
 seven_cities.15.historical_info: "The Sierra de la Plata, the mountain of silver, was a rumor that drew Spanish and Portuguese expeditions deep into the basin of the Rio de la Plata from the 1520s, and it gave both the river and eventually the country their names. The rumor was not baseless: it pointed, however dimly, toward the real silver wealth of the Andes, above all the mountain of Potosi, whose discovery in 1545 would reshape the world economy. But the men who followed the early reports upriver mostly found hardship and hostile country rather than silver, and the fabled sierra receded ahead of them for a generation. A little metal panned from a streambed was often the only tangible sign that the story was not pure invention."
 expedition_brings_back_valuable_materials: "#Y Ценная руда добыта и доставлена на рынок города [ROOT.GetCountry.GetCapital.GetName]#!"
 study_their_technique: "#Y Мы осваиваем новые способы горного дела, что снижает затраты на расширение рудников и обогащает наши лучшие месторождения#!"
 men_are_met_by_hunger_and_false_legends: "#Y Русло реки не приносит ничего, кроме голода и пустых надежд#!"
 expedition_outcome_severely_hindered_tt: "Мы теряем один из наших добытых с трудом следов"
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "We abandon the search for metal and march on"
 seven_cities.16.title: "Гостеприимство вождя"
 seven_cities.16.desc: "The village is large and well kept, and its chief receives us with a wary courtesy that plainly costs him something. His storehouses are full and his young men know every trail inland. He also has every reason to want us gone by morning. Our officers look at those storehouses and those idle strong backs and see porters and guides for the taking. [target_leader.GetName] must decide whether this is a place to strike a bargain or a place to seize what we need and leave the reckoning to whoever follows us."
 seven_cities.16.a: "Схватить вождя и погнать его людей под остриём копий."
 seven_cities.16.b: "Договориться о добровольных носильщиках и разойтись в мире."
 seven_cities.16.c: "Никого не тревожить. Свернуть лагерь и двинуться дальше."
 the_captive_chief_yields_guides: "#Y Пленный вождь предоставляет проводников, знающих тропы вглубь материка#!"
 the_chiefs_hall_is_plundered: "#Y Чертоги вождя лишаются своего убранства перед тем, как мы выступим в поход#!"
 the_village_empties_before_us: "#Y The village melts into the forest overnight, guides and all#!"
 coerced_locals_resent_us_tt: "Наше [cultural_opinion|e] о [target_location.GetDominantCulture.GetName] ухудшится"
 seven_cities.16.historical_info: "Hernando de Soto's usual method for crossing the southeast was to seize the local cacique, or paramount chief, on arrival and hold him hostage to guarantee food, porters, and guides for the next stage of the march. The captive lord would be released or exchanged at the edge of his territory for the neighboring chief, and the process repeated. The tactic worked in the short term and left a trail of broken chiefdoms, shattered alliances, and lasting hatred behind the column. It also depended on the Mississippian structure of powerful individual chiefs, and it failed badly wherever authority was more diffuse."
 seven_cities.17.title: "Весть с берега"
 seven_cities.17.desc: "Прибрежные жители выплывают нам навстречу ещё до того, как якорь коснулся дна, а к вечеру уже торгуют с нами рыбой и свежими плодами — и разговорами того быстрее. Видно, что дело для них привычное. За нож или отрез ткани они с готовностью расскажут, что лежит за полосой деревьев, и рассказывают охотно, то и дело указывая вглубь земли и дальше. Указывают ли они нам путь к истине или лишь к своим соседям — с берега не разобрать."
 seven_cities.17.a: "Выменять сведения о том, что лежит вглубь материка."
 seven_cities.17.b: "Отметить якорную стоянку и продолжить поход."
 seven_cities.17.b.tt: "#italic Мы отмечаем якорную стоянку на картах и продолжаем поход, не тратя время на торг за слухи#!"
 the_shore_folk_point_the_way: "#Y Прибрежные жители указывают нам ясный путь к тому, что мы ищем#!"
 the_shore_market_yields_goods: "#Y Бойкая торговля на песке наполняет наши трюмы местными товарами#!"
 the_shore_folk_send_us_at_their_rivals: "#Y Их указания водят нас по кругам в сторону какого-то соперничающего селения#!"
 seven_cities.17.historical_info: "Прибрежные народы обычно первыми из американцев встречались с любой экспедицией, и именно они становились первым источником сведений обо всём, что лежало вглубь материка. Контакты Верраццано и Картье вдоль побережья Северной Атлантики, карибские высадки первых испанских плаваний и встречи португальцев на бразильском берегу — всё это следовало одному и тому же образцу: настороженная торговля, взаимное изучение и поток географических слухов, текущий с побережья в глубь страны. Береговые общины нередко подстрекали чужаков идти дальше, туда, что лежало ещё глубже вглубь материка, — и чтобы отделаться от них, и чтобы направить их притязания на соперников. Поэтому всё, что побережье сообщало о внутренних землях, уже было пропущено через собственные интересы прибрежных жителей задолго до того, как достигало европейского уха."
 seven_cities.18.title: "Гавань спасения"
 seven_cities.18.desc: "Эта гавань — всё, о чём может молить измученная экспедиция. Она глубока и хорошо укрыта, пресная вода стекает к берегу, достаточно широкому, чтобы вытащить корабли на карену и очистить их днища от гнили. Экипажам отдых нужен не меньше, чем корпусам — ремонт. Но флот, вытащенный на берег, никуда не плывёт, а бездельничающие люди в чужой стране обладают редким даром находить неприятности. [target_leader.GetName] взвешивает, сколько дней потребует надлежащий ремонт, против состояния кораблей и настроения экипажей."
 seven_cities.18.a: "Вытащить корабли на карену и как следует пополнить запасы."
 seven_cities.18.b: "Отдохнуть одну ночь и отплыть дальше."
 seven_cities.18.b.tt: "#italic Мы даём экипажам одну ночь на берегу и снова выходим в море, прежде чем корабли пустят здесь корни#!"
 the_refit_goes_smoothly: "#Y Ремонт проходит гладко, и корабли после него слушаются рулей лучше прежнего#!"
 a_wreck_yields_salvage: "#Y Экипажи разбирают гниющий на отмели остов затонувшего корабля, забирая всё, что может пригодиться#!"
 the_crew_falls_to_brawling: "#Y От безделья на берегу экипажи затевают драки, и несколько дней уходит на восстановление порядка#!"
 seven_cities.18.historical_info: "Укрытая гавань была необходима любой экспедиции, часть пути проходившей морем: там можно было накренить и починить корпуса судов, пополнить запасы пресной воды и дров, дать отдых людям, измотанным переходом. Флот Магеллана простоял на зимовке пять месяцев в бухте Сан-Хулиан на побережье Патагонии, где вынужденная остановка обернулась ещё и мятежом, который он подавил с большой жестокостью. Часто исследователи проводили в таких стоянках на ремонте больше времени, чем под парусами, и хорошая гавань с дружелюбным или безразличным местным населением могла решить, продолжит ли экспедиция путь или развалится. Выбор места стоянки нередко значил не меньше, чем выбор направления пути."
 seven_cities.20.title: "Страна нас не прокормит"
 seven_cities.20.desc: "Земля, через которую мы идём, суше и пустыннее, чем говорилось в донесениях. Вьючные животные начинают выбиваться из сил. Люди уже десять дней на половинном пайке. Местные селения попрятали или сожгли свои запасы. Пресная вода есть лишь в двух долинах из шести. [target_leader.GetName] собирает офицеров в тени колючего дерева и спрашивает, сколько ещё они смогут продержаться без подвоза продовольствия."
 seven_cities.20.a: "Купить припасы любой ценой."
 seven_cities.20.b: "Остановиться и дать людям отдохнуть."
 seven_cities.20.historical_info: "Supply was the chronic constraint on inland exploration in the Americas. Cortes's army was fed largely by the political collapse of Aztec authority that allowed the Tlaxcalans and other allies to provision him. Coronado's column into the southwest had no equivalent support and starved by degrees as it pushed north. The pattern recurred from Florida to Patagonia: an entrada that could not buy or seize food from the country it was crossing would melt away on the trail, regardless of what gold lay beyond."
 seven_cities.21.title: "Засада в каньоне"
 seven_cities.21.desc: "Отряд вошёл в узкое ущелье между двумя известняковыми стенами, и туземцы перекрыли дорогу позади. Стрелы сверху; воины с каменными палицами на дне каньона; вьючный обоз рассыпается. Люди делают то, что люди в таком положении делали всегда — сбиваются в круг, прижавшись спинами к скале. [target_leader.GetName] совещается с сержантами. Выбор таков: прорываться через каньон ценой потерь или отступить назад и искать другую дорогу в обход."
 seven_cities.21.a: "Прорваться через каньон сталью и выстрелами."
 seven_cities.21.b: "Отступить и найти другую дорогу."
 seven_cities.21.historical_info: "Native ambush warfare in defensible terrain, narrow canyons, mountain passes, forest trails, was the most effective form of resistance to early colonial entradas. Spanish armour, firearms, and horses gave decisive advantage on open ground but were systematically negated in close country. Roughly half of Coronado's marches in the southwest were forced detours around territory his column could not safely cross, and the same pattern produced the long string of failed French and English forays into the interior of North America before the eighteenth century."
 seven_cities.22.title: "Древние руины"
 seven_cities.22.desc: "Тропа поднимается на гребень и открывает вид на то, что некогда было городом. Стены каменные, крыши по большей части обрушились, улицы заросли деревьями, которым уже век. Людей нет. Здесь давно уже никого не было. Разведчики обходят периметр на почтительном расстоянии, летописец делает набросок, а священник спорит сам с собой, входить ли внутрь, ведь известно, что мёртвые города насылают хворь на осквернивших их. [target_leader.GetName] даёт рисовальщику час времени."
 seven_cities.22.a: "Catalogue the ruin before we march on."
 seven_cities.22.historical_info: "Pre-Columbian America was crowded with abandoned settlements: Mississippian mound centres in the southeast, Pueblo great-houses in the southwest, Chaco itself, the Tiwanaku basin in the Andes, the Maya cities of the southern Yucatan. Sixteenth-century European explorers walking these landscapes routinely came on stonework, agricultural terraces, and ceremonial centres that had been abandoned a century or more earlier. The persistent European theory that these ruins must be the work of a vanished European or Mediterranean population, Welsh, Phoenician, Lost Tribes of Israel, was already in circulation by the 1540s and would survive in some quarters into the twentieth century."
 seven_cities.30.title: "След обрывается"
 seven_cities.30.desc: "Колонна достигла места встречи, которое проводники описывали как врата в страну, куда нас послали. Никаких врат нет. Проводники либо лгали, либо обманывали сами себя; осмотр окрестных холмов не выявил ни города, ни дыма, ни дороги, ни единого признака того, что здесь кто-то бывал на памяти живущих. [target_leader.GetName] пишет короне, прося указаний, а затем комкает письмо — к тому времени, как оно достигнет порта, колонна уже примет собственное решение. Есть два пути: продолжить продвижение вглубь страны, на случай если город лежит всего в одной долине дальше; или повернуть колонну назад и идти домой с тем, что уже добыто."
 seven_cities.30.a: "Продолжить путь к городу, несмотря ни на что."
 seven_cities.30.b: "Повернуть назад и честно доложить о случившемся."
 seven_cities.30.historical_info: "The standard pattern for failed entradas was not the dramatic massacre but the slow petering-out: a column running short of supplies, losing scouts to disease and desertion, finding that each promised landmark was either a misunderstanding or a lie, until the surviving officers turned the men around and walked home through territory they now knew was empty. The Coronado expedition, the Cabrillo expedition, the De Soto expedition, the Aguirre expedition down the Amazon, all followed this curve to one degree or another. Successful entradas of equivalent ambition were rare enough to be remembered for centuries."
 may_bring_us_closer_and_fill_our_holds_tt: "Это может приблизить нас к разгадке того, что мы ищем, и наполнить наши трюмы местными товарами"
 seven_cities.16.c.tt: "#italic Мы оставляем вождя в покое и продолжаем поход, не беря ни заложников, ни носильщиков#!"
