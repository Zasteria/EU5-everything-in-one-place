l_russian:
 flavor_cas.152.title: "Единый налог для всего королевства"
 flavor_cas.152.entry: "$flavor_cas.152.title$"
 flavor_cas.152.desc: "Наша война против мавров тяжким бременем легла на казну, и [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] вынужден искать новые источники дохода для финансирования этой войны. Города королевства согласились предоставить нам сбор с продаж, но многие из наших советников полагают, что это должна быть не временная мера, а узаконенный постоянный источник дохода."
 flavor_cas.152.a: "Мы не можем полагаться на временные подношения."
 flavor_cas.152.b: "Мы не станем злоупотреблять их щедростью."
 flavor_cas.152.historical_info: "В правление Альфонсо XI Кастилия испытывала финансовые трудности из-за войн против Гранады. Чтобы профинансировать осаду и взятие Альхесираса, кастильские города даровали королю #italic алькабалу #! — налог с продаж, взимаемый с торговых сделок. Первоначально задуманный как чрезвычайный военный сбор, утверждённый городами через кортесы, этот налог вскоре стал одним из важнейших источников королевских доходов Кастилии. Позднейшие монархи расширили и закрепили этот налог, превратив его в постоянный сбор, который на протяжении веков обеспечивал значительную часть доходов короны."
