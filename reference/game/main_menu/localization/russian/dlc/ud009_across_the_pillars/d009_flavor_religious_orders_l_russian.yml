l_russian:
 d009_flavor_religious_orders.1.title: "Смена главы"
 d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
 d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], who has been serving our [ROOT.GetCountry.GetGovernment.GetCourtTitle] loyally as head of [target_order.GetName], has suddenly fallen ill and resigned [old_head_of_order.GetHisHer] position. While many renowned knights and noblemen desire to ascend to such position, it is clear that [target_ruler.GetName] already has someone in mind for the task. [target_character.GetName], a favorite of [target_ruler.GetNameWithNoTooltip], shall become the new Grandmaster of the [target_order.GetNameWithNoTooltip]!"
 d009_flavor_religious_orders.1.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 d009_flavor_religious_orders.1.a.entry: "$common_string_ok$"
 d009_flavor_religious_orders.2.title: "[target_character.GetNameWithNoTooltip] рвётся к власти"
 d009_flavor_religious_orders.2.entry: "Растущее влияние великого магистра"
 d009_flavor_religious_orders.2.desc: "За последние годы богатство и власть [target_character.GetName] значительно возросли. Хотя подобный рост личного состояния не редкость для великого магистра [target_order.GetName], [target_character.GetSheHe], судя по всему, также пристрастился к политике столицы. Некогда любимец [target_ruler.GetNameWithNoTooltip], теперь [target_character.GetNameWithNoTooltip] нередко критикует наше правительство и руководство, из-за чего многие из [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] требуют снять [target_character.GetHerHis] с должности великого магистра."
 d009_flavor_religious_orders.2.a: "[target_character.GetSheHe|U] поступает так, как лучше для [ROOT.GetCountry.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.2.a.entry: "Он поступает так, как лучше для нашей страны."
 d009_flavor_religious_orders.2.b: "[target_character.GetSheHe|U] превышает [target_character.GetHisHer] полномочия."
 d009_flavor_religious_orders.2.b.entry: "Он превышает свои полномочия."
 d009_flavor_religious_orders.3.title: "Опальный любимец"
 d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
 d009_flavor_religious_orders.3.desc: "The political posturing of [target_character.GetName] has continued to create animosity between [target_character.GetHerHim] and the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Especially [target_character.GetHerHis] very public criticism of [target_ruler.GetName] and [target_ruler.GetHerHis] affair has severed the once favorite of [target_ruler.GetName] from [target_character.GetHerHis] supporters. Having made enemies among our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] due to [target_character.GetHerHis] rapid rise in standing, it is no longer feasible for [ROOT.GetCountry.GetName] to rely on such a character as Grandmaster of the [target_order.GetName]."
 d009_flavor_religious_orders.3.a: "[target_character.GetSheHe|U] должен быть казнён за измену!"
 d009_flavor_religious_orders.3.a.entry: "Он будет казнён за измену!"
 d009_flavor_religious_orders.3.b: "Изгнать [target_character.GetHerHim] и назначить нового главу для [target_order.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.3.b.entry: "Изгнать его и назначить нового главу для Ордена."
 d009_flavor_religious_orders.1.b: "Братья [target_order.GetNameWithNoTooltip] сами выберут себе великого магистра."
 d009_flavor_religious_orders.1.b.entry: "Братья сами выберут себе великого магистра."
