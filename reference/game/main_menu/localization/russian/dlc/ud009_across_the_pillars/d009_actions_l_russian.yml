l_russian:
 proclaim_pase_foral: "Провозглашение pase foral"
 proclaim_pase_foral_desc: "Мы воспользуемся баскским правом #italic pase foral#! — древней привилегией, позволяющей баскским феодам изучать и приостанавливать действие королевских указов, противоречащих их местным законам (фуэрос). Эта прокламация удовлетворяет #Y ожидания аристократов#! и укрепляет #Y стабильность#!, но временно #Y ограничивает возможности правителей#!."
 summon_santa_hermandad: "Созыв святой эрманды"
 summon_santa_hermandad_desc: "Мы созовём святую эрманду — поддерживаемое властями братство сельских констеблей и ополченцев. При помощи таких братств Кастилия боролась с бандитами и укрепляла королевские порядки в державе. Мобилизация увеличивает #Y рекрутский резерв#!, подрывает #Y инициативу мятежников#! и #Y удешевляет#! укрепление стабильности."
 proclaim_pase_foral_action: "$proclaim_pase_foral$"
 proclaim_pase_foral_active: "Провозглашение pase foral"
 proclaim_pase_foral_action_progress: "Действует провозглашение pase foral"
 proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
 proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"
 summon_santa_hermandad_action: "$summon_santa_hermandad$"
 summon_santa_hermandad_active: "Созыв святой эрманды"
 summon_santa_hermandad_action_progress: "Действует созыв святой эрманды"
 summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_tooltip: "$summon_santa_hermandad_action_progress$"
