l_russian:
 spa_seize_control_of_the_orders.title: "Изъять владения орденов"
 spa_seize_control_of_the_orders.desc: "Религиозные ордены [ShowRegionName('iberia_region')] сыграли важнейшую роль в отражении мусульманской угрозы и восстановлении нашего владычества на полуострове. Однако теперь, когда наша #italic Реконкиста#! свершилась, мы должны подчинить эти ордены прямому контролю нашего правительства и направить их к новому предназначению — быть государственными мужами и управленцами, а не воинами и рыцарями."
 spa_seize_control_of_the_orders.a: "Изъять все их владения!"
 spa_seize_control_of_the_orders.b: "Позволить им сохранить большую часть своих земель."
 establish_council_of_military_orders_tt: "Основать [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')]"
 established_council_of_military_orders_tt: "Мы учредили [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] решением $spa_seize_control_of_the_orders.title$."
 spa_council_of_crusade_decision.title: "Основать $spa_council_of_crusade_bureaucracy$"
 spa_council_of_crusade_decision.desc: "Защита нашей веры, даже на чужих берегах, должна быть благословлена высшей властью. Заручившись одобрением [Concept('pope','Папы')|e], мы станем первым оплотом [ShowReligionAdjective('catholic')] веры!"
 spa_council_of_crusade_decision.a: "Запросить одобрение папы."
 establish_council_of_crusade_tt: "Основать [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')]"
 established_council_of_crusade_tt: "Мы учредили [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')] решением $spa_council_of_crusade_decision.title$."
 spa_seize_control_of_the_orders_tt: "Каждый [location|e], которым мы владеем в регионе [ShowRegionName('iberia_region')], перестанет быть владением испанского военного [religious_order|e]"
