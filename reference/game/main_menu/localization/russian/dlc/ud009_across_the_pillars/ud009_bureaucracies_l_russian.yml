l_russian:
 dar_al_tiraz_bureaucracy: "Дар аль-Тираз"
 dar_al_tiraz_bureaucracy_desc: "Пышные вышитые одежды, происходящие из Персии, издавна использовались в исламском мире как почётные халаты, которыми государь одаряет тех, кого желает возвысить. Хорошо финансируемая придворная мастерская #italic $dar_al_tiraz_bureaucracy$#!, ткущая шёлк, парчу и вышивку, облачит двор в роскошь и разошлёт драгоценные ткани по всем рынкам."
 diwan_al_mustakhlas_bureaucracy: "Диван аль-Мустахляс"
 diwan_al_mustakhlas_bureaucracy_desc: "#italic $diwan_al_mustakhlas_bureaucracy$#! управляет личным доменом султана — поместьями, мельницами и доходами, отделёнными от казны государства, дабы содержать двор и $alhambra$. Прилежное управление сохраняет казну короны богатой и независимой от её владений, но при слабом надзоре сами чиновники, ведающие им, обращают его богатства в свою пользу."
 diwan_al_qawafil_bureaucracy: "Диван аль-Кавафиль"
 diwan_al_qawafil_bureaucracy_desc: "#italic $diwan_al_qawafil_bureaucracy$#! надзирает за великими караванами трансахарской торговли, путями через Сиджильмасу, что несут золото и рабов на север, а соль и ткани — на юг. Хорошо налаженная служба защищает купцов и их вьючных животных и умножает богатство, проходящее через пустыню, дабы караваны не становились добычей разбойников, а племена песков не враждовали с державой, что более не охраняет дорогу."
 ghuzat_mujahidin_bureaucracy: "Аль-Гузат аль-Муджахидин"
 ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! — это добровольцы веры, североафриканская конница, что пересекает пролив, дабы вести священную войну на границе под началом собственного $rank_county_arabic_ruler_male$. Эти пылкие воины сражаются с рвением, рождённым набожностью, и их благочестие вдохновляет наш народ следовать их примеру."
 makhzan_bureaucracy: "Аль-Махзан"
 makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! — это центральный аппарат власти султана, чьи сборщики податей и наместники распространяют волю престола. Сильный #italic махзан#! крепче держит в узде отдалённые племена и города, но когда его управление слабеет, страна и впрямь становится #italic билад ас-сиба#!, землёй непокорства, и окраинные провинции скатываются к мятежу и своеволию."
 marinid_madaris_bureaucracy: "Риайят аль-Мадарис"
 marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! — это покровительство короны медресе, коллегиям, что готовят законоведов, писцов и чиновников, на которых опирается государство. Щедро наделённые, они наполняют чиновничий аппарат учёными и преданными слугами и укореняют формальное право школ."
 qadi_al_jamaa_bureaucracy: "Кади аль-Джамаа"
 qadi_al_jamaa_bureaucracy_desc: "#italic $qadi_al_jamaa_bureaucracy$#! — верховный судья общины, что председательствует в судах $maliki_school$ и назначает многочисленных местных кади по всему государству. Уважаемая судебная система разрешает споры по закону, признанному всеми, и придаёт престолу законность правосудия, углубляя привязанность народа к установленному правоведению."
 wulat_al_thughur_bureaucracy: "Вулят ас-Сугур"
 wulat_al_thughur_bureaucracy_desc: "#italic $wulat_al_thughur_bureaucracy$#! — стражи пограничных марок. Они держат гарнизоны в приграничных замках, следят за перевалами и ведают перемириями и данью, что удерживают крупные христианские королевства на расстоянии. Ухоженная марка ощетинивается защитниками и покупает державе время искусной дипломатией, ибо небрежение к границе лишь ободряет соседей, что могут почуять слабость и настойчивее заявить свои притязания."
 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "Диван аль-Гарб"
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#! — Диван Запада — административный орган, который мы учреждаем в наших андалусийских провинциях для управления населением, говорящим на арабизированном романском языке столь же свободно, как и на арабском, и чьи приходские церкви до сих пор превосходят числом наши мечети. Его писцы собирают доходы султана, назначают кади в смешанные суды и проводят ассимиляцию, превращающую завоевание в провинцию. Хорошо налаженный диван привязывает эти западные земли к нашему закону; заброшенный же отдаёт пограничье во власть любого клана, способного навязать свои порядки."
 # Mozabite Bureaucracy
 mozabite_azzaba_bureaucracy: "Совет 'аззаба"
 mozabite_azzaba_bureaucracy_desc: "#italic ʿАззāба#! — тайный совет ибадитских учёных, составляющий подлинную основу управления мозабитскими общинами долины Мзаб: он выносит решения по вопросам религиозного права, разрешает споры и следит за соблюдением строгого нравственного устава, сохранившего ибадитскую самобытность через века внешнего давления. Мы поддерживаем этот совет как высшего судью нашей общинной жизни, финансируя его учёных и почитая его постановления как выражение божественного закона. Хорошо обеспеченная 'Аззаба пользуется преданностью верующих и распространяет ибадитское право на каждый дом; лишённая же средств, она теряет власть, и на освободившееся место приходят иноверные течения."
 # Pre-Formation Iberian Bureaucracies
 nav_diputacion_navarra_bureaucracy: "Дипутасьон Наварры"
 nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ ведает конституционной жизнью Наварры в перерывах между заседаниями кортесов, следит за сбором #italic donativo#! и за неукоснительным соблюдением #italic fueros#!, определяющих наваррскую автономию. Его состав набирается из трёх сословий королевства, обеспечивая знати, духовенству и городам постоянное присутствие в управлении своим краем. Хорошо финансируемый Дипутасьон служит гарантом соблюдения фуэрос; без должных средств он не в силах противостоять централизаторскому давлению, которое великие державы неизбежно оказывают на свои меньшие владения."
 por_desembargo_do_paco_bureaucracy: "Дезембарго ду Пасу"
 por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ — верховный королевский совет Португалии, которому поручены рассмотрение законов, дарование помилований и надзор за судебными назначениями, благодаря чему власть короны достигает каждого уголка королевства. В отличие от обученных в университетах правоведов, служащих в обычных судах, Дезембарго составляют люди, обладающие как юридическими знаниями, так и доверием короля, что сочетает в себе профессиональное правоведение с непосредственным служением монарху. Хорошо налаженное Дезембарго ускоряет ход управления и обеспечивает точное исполнение королевских решений в соответствии с законом."
 por_mesa_da_consciencia_e_ordens_bureaucracy: "Меза да Консьенсия и Ордес"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ была учреждена для управления военными орденами Португалии — Орденом Христа, Орденом Сантьяго и Орденом Авиш, — чьими землями, доходами и духовной властью корона распоряжается в качестве великого магистра. Трибунал рассматривает прошения о церковных разрешениях, распределяет командорства среди королевских клиентов и разрешает противоречия между каноническим правом и королевским покровительством. Его учреждение превратило военные ордена из самостоятельных церковных корпораций в орудия политики короны, тесно связанные с королевским religiozным замыслом."
 # Spanish Councils - Regional
 spa_council_of_aragon_bureaucracy: "Совет Арагона"
 spa_council_of_aragon_bureaucracy_desc: "Восточные земли [ShowRegionName('iberia_region')] в составе [ShowScriptedGeographyName('aragon_geography')] будут управляться #italic $spa_council_of_aragon_bureaucracy$#!. Эта служба занимается прежде всего поддержанием наших связей со средиземноморской торговлей и нуждами местных фуэрос."
 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "#italic $spa_council_of_castile_bureaucracy$#! отвечает за земли [ShowScriptedGeographyName('castile_geography')], управляя этими обширными владениями и их населением от нашего имени."
 spa_council_of_flanders_bureaucracy: "Совет Фландрии"
 spa_council_of_flanders_bureaucracy_desc: "Управляя землями, столь удалёнными от наших исконных владений, #italic $spa_council_of_flanders_bureaucracy$ #! будет вынужден крепко держать в руках [ShowScriptedGeographyName('spanish_netherlands_geography')], дабы поддерживать порядок и процветание в этом регионе."
 spa_council_of_italy_bureaucracy: "Consejo de Italia"
 spa_council_of_italy_bureaucracy_desc: "С нашим всё возрастающим присутствием в [ShowRegionName('italy_region')] следует учредить совет, чья прямая обязанность — управление нашими новыми завоеваниями. Управление этими землями станет для нас совсем иным испытанием, нежели наши владения в [ShowRegionName('iberia_region')]."
 spa_council_of_portugal_bureaucracy: "Conselho de Portugal"
 spa_council_of_portugal_bureaucracy_desc: "С приобретением новых территориальных владений нам следует учредить особый совет для наших земель в [ShowScriptedGeographyName('portugal_geography')]. Эта служба будет главным образом заниматься нашей атлантической торговлей и морскими делами."
 spa_viceroy_bureaucracy: "Канцелярия вице-короля"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "Consejo de Cruzada"
 spa_council_of_crusade_bureaucracy_desc: "Учреждённый в согласии с [GetUniqueInternationalOrganization('catholic_church').GetName] и [pope], #italic $spa_council_of_crusade_bureaucracy$#! будет направлять нашу экспансию и наши усилия по несению света [ShowReligionAdjective('catholic')] веры во все уголки мира."
 spa_council_of_finance_bureaucracy: "Consejo de Hacienda"
 spa_council_of_finance_bureaucracy_desc: "Заменяя собой две прежние службы — Счётную палату и Главную счётную палату, — #italic $spa_council_of_finance_bureaucracy$ #! устранит трения между этими двумя ведомствами и создаст единый орган для управления государственными финансами."
 spa_council_of_indies_bureaucracy: "Consejo de las Indias"
 spa_council_of_indies_bureaucracy_desc: "Всё, что лежит за морем, подпадёт под юрисдикцию #italic $spa_council_of_indies_bureaucracy$ #!. Он будет ведать всей торговлей, идущей из колоний на нашу метрополию и к нашим подданным на чужих берегах, обеспечивая непрерывный приток богатств в нашу казну. Быт и порядки наших новоприобретённых подданных, а также распределение земель для колониальной эксплуатации также будут находиться в ведении этого совета."
 spa_council_of_inquisition_bureaucracy: "Consejo de la Suprema Inquisición"
 spa_council_of_inquisition_bureaucracy_desc: "#italic $spa_council_of_inquisition_bureaucracy$#!, состоящий из нескольких апостольских инквизиторов и возглавляемый генеральным инквизитором, надзирает за религиозной чистотой и судебными разбирательствами в нашей стране. Он будет служить высшей апелляционной инстанцией как в церковных, так и в мирских делах."
 spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes"
 spa_council_of_military_orders_bureaucracy_desc: "Отвечая за управление их бывшими землями, #italic«$spa_council_of_military_orders_bureaucracy$»#! будет играть важную роль в предоставлении земель для наших военных нужд, увеличивая резерв для набора наших армий и обеспечивая обучение и вербовку способных офицеров в наши войска."
 spa_council_of_state_bureaucracy: "Consejo de Estado"
 spa_council_of_state_bureaucracy_desc: "#italic«$spa_council_of_state_bureaucracy$»#! возглавляется непосредственно нашим правителем и помогает ему в вопросах внешней политики без вмешательства посторонних влияний. Совет состоит из способных представителей нашего дворянства и духовенства, обученных дипломатии и международным отношениям, и будет управлять как нашими посольствами за границей, так и давать советы по ведению сложных международных дел."
 dawa_bureaucracy: "Диван аль-Даʿва"
 dawa_bureaucracy_desc: "#italic $dawa_bureaucracy$#! — учреждение, посредством которого государь управляет делами веры за морем, направляя кади и проповедников в дальние провинции, где владычество опередило мечеть. Его #italic duʿāt#! несут призыв ислама народам тех берегов, а его писцы привязывают новые колонии к закону уммы. При должном попечении оно превращает далёкое завоевание в обжитую провинцию и приумножает число верных под властью короны. При небрежении же далёкая паства ускользает из-под руки государя, и призыв умолкает там, где некому его вознести."
