l_russian:
 d009_flavor_iberian_union.1.title: "Провозгласить Испанскую монархию"
 d009_flavor_iberian_union.1.a: "Да будет провозглашена Испанская монархия!"
 d009_flavor_iberian_union.1.desc: "The crowns of our union have become so closely bound that they are a single realm in all but name. Our administration governs the whole, our laws and coin run from one end of the peninsula to the other, and the lesser kingdoms have become provinces of a greater whole.\n\nThe hour has come to set aside the old titles and proclaim before all the world a single, sovereign monarchy: Spain."
