l_russian:
 d008_flavor_byz.1.title: "Обещания алхимика"
 d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
 d008_flavor_byz.1.desc: "Когда-то греческий огонь был известен не только по всему Средиземноморью, но и за его пределами. Эта легендарная смесь, внушавшая ужас вражеским флотоводцам, даже на воде горела жарче любого пламени. Потушить греческий огонь было почти невозможно, подожжённые им суда сгорали дотла в мгновение ока. Секрет изготовления смеси всегда хранился в строжайшей тайне, но со временем эти знания были утрачены, и мы больше не можем производить это оружие.\n\n[target_artist.GetName], [Select_CString(target_artist.IsFemale, 'одна', 'один' )] из наших виднейших алхимиков, утверждает, что может восстановить и воспроизвести утраченную формулу. Если это правда, то мы сможем вновь поставить губительный огонь на службу нашему флоту. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] нашей страны уже ликуют, однако [target_artist.GetNameWithNoTooltip] [Select_CString(target_artist.IsFemale, 'должна', 'должен' )] провести ещё немало дорогостоящих опытов, прежде чем формула будет получена."
 d008_flavor_byz.1.a: "[target_artist.GetSheHe|U] получит всё, в чём будет нуждаться!"
 d008_flavor_byz.1.b: "Нам ни к чему эти древние сказки, флот и без того достаточно силён."
 d008_flavor_byz.1.a.tt: "[target_artist.GetName] начнёт опыты, чтобы найти формулу греческого огня"
 d008_flavor_byz.2.title: "В поисках огня"
 d008_flavor_byz.2.desc: "Прошло уже немало времени с тех пор, как [target_artist.GetName] [Select_CString(target_artist.IsFemale, 'уединилась', 'уединился' )] в лаборатории, чтобы найти формулу греческого огня, но до сих пор [target_artist.GetHerHis] достижения ограничивались лишь обгоревшими бровями да периодическими взрывами по ночам. Многие уже сомневаются в том, что [Select_CString(target_artist.IsFemale, 'она способна', 'он способен' )] добиться успеха в своём начинании. Впрочем, [target_artist.GetSheHe] уверяет, что уже [Select_CString(target_artist.IsFemale, 'близка', 'близок' )] к прорыву — нужно лишь ещё немного времени и средств."
 d008_flavor_byz.2.a: "Хорошо, мы выделим [Select_CString(target_artist.IsFemale, 'ей', 'ему' )] дополнительные средства."
 d008_flavor_byz.2.b: "Хватит с нас этих фантазий."
 d008_flavor_byz.2.a.tt: "[target_artist.GetName] продолжит искать формулу греческого огня"
 d008_flavor_byz.3.title: "Греческий огонь"
 d008_flavor_byz.3.desc: "Много ночей подряд жители [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] просыпались от громких взрывов, вызванных опытами, которые [Select_CString(target_artist.IsFemale, 'проводила', 'проводил' )] [target_artist.GetName]. За время работы [target_artist.GetHerHis] руки покрылись множеством ожогов, [target_artist.GetSheHe] не раз [Select_CString(target_artist.IsFemale, 'оказывалась', 'оказывался' )] на краю гибели, но в итоге [target_artist.GetHerHis] мучения принесли нужный результат. Путём проб и ошибок [Select_CString(target_artist.IsFemale, 'ей', 'ему' )] удалось воссоздать греческий огонь в точном соответствии с историческими источниками. Теперь мы можем наладить производство этой смеси и поставить её на вооружение своего флота. Разумеется, мы будем и впредь держать формулу и технологию изготовления греческого огня в секрете — но на сей раз предпримем все необходимые меры, чтобы никогда больше не утратить эти знания."
 d008_flavor_byz.3.a: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий флот вновь заставит море пылать!"
 unlocked_greek_fire_tt: "Мы получим доступ к [Concept('unit_types', 'типам войск')|e] «[ShowUnitDefinitionName('n_greek_fire_galley_renaissance')]», «[ShowUnitDefinitionName('n_greek_fire_galley_discovery')]», «[ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')]» и «[ShowUnitDefinitionName('a_greek_fire_discovery_infantry')]»"
 d008_flavor_byz.5.title: "Реформа тагм"
 d008_flavor_byz.5.entry: "$d008_flavor_byz.5.title$"
 d008_flavor_byz.5.desc: "Испытание, которое поставило #L [ROOT.GetCountry.GetAdjective|l]ое#! государство под угрозу распада, наконец-то позади, и во многом благодаря усилиям тагм — это исторические военные формирования, которыми управляет непосредственно [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]. Хотя времена их славы остались далеко позади, эти отряды, существующие отдельно от феодального ополчения, обеспечили нам выживание.\n\nТеперь стабильность восстановлена, и [target_character.GetName] обращает свой взор в будущее. Чтобы [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие тагмы отличались от обычного ополчения не только названием, но и по своей сути, требуются серьёзные реформы: нужно возобновить государственное финансирование, ужесточить дисциплину и подобрать вдохновляющую цель. Ростки, проклюнувшиеся в период невзгод, мирное время превратит в пышные цветы, которыми [ROOT.GetCountry.GetLongNameWithNoTooltip] буд[ROOT.GetCountry.Custom('endlong_etut')] гордиться."
 d008_flavor_byz.5.a: "Мы превратим тагмы в передовые силы [ROOT.GetCountry.Custom('CL_GEN')]."
 d008_flavor_byz.5.a.entry: "Мы превратим тагмы в передовые силы Рима."
 d008_flavor_byz.5.b: "Эти полки уже показали, на что способны в войне."
 variable_won_fate_of_the_phoenix_disaster_variable_tt: "Мы преодолели бедствие #TOOLTIP:DISASTER_TYPE,fate_of_the_phoenix,X #L «Судьба феникса»#!#!"
 variable_not_won_fate_of_the_phoenix_disaster_variable_tt: "Бедствие «[ShowDisasterName('fate_of_the_phoenix')]» ещё не преодолено"
 d008_flavor_byz.4.title: "[target.GetNameWithNoTooltip] не добивается успеха"
 d008_flavor_byz.4.desc: "Увы, [target.GetName] безвременно [Select_CString(target_artist.IsFemale, 'скончалась', 'скончался' )], так и не завершив поиски греческого огня. [target.GetHerHis|U] ученики и другие видные алхимики изучили [target_artist.GetHerHis] записи, чтобы понять, можно ли продолжить [target_artist.GetHerHis] исследования, но скоро стало ясно, что всё это время [Select_CString(target_artist.IsFemale, 'она топталась', 'он топтался' )] на месте и ни на шаг не [Select_CString(target_artist.IsFemale, 'приблизилась', 'приблизился' )] к искомой цели. Судя по всему, нам никогда не удастся разгадать тайну греческого огня…"
 d008_flavor_byz.4.a: "Ничего не поделать…"
 d008_flavor_byz.6.title: "Возрождение Феникса"
 d008_flavor_byz.6.entry: "$d008_flavor_byz.6.title$"
 d008_flavor_byz.6.desc: "[ROOT.GetCountry.GetName], некогда слабая держава-преемница у берегов Чёрного моря, достигла небывалых высот. #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! теперь принадлежит нам, #TOOLTIP:CULTUREGROUP,turkic_group,X #L тюркские#!#! захватчики изгнаны из #TOOLTIP:REGION,anatolia_region,X #L Анатолии#!#!, и [ROOT.GetCountry.GetLongNameWithNoTooltip] восстановил[ROOT.GetCountry.Custom('endlong_fem')] своё былое величие. Придворные учёные шепчутся о том, что [ROOT.GetCountry.GetFlavorRank] восста[ROOT.GetCountry.Custom('endrank_youtyut')] из праха, словно феникс.\n\n[target_character.GetName] — отныне [Select_CString(target_character.IsFemale, 'истинная наследница', 'истинный наследник' )] Римской империи. Мы, как и наши предки, с честью выдержали испытания судьбы, и потому их институты, привилегии и цели теперь по праву принадлежат нам."
 d008_flavor_byz.6.a: "Империя возрождается из пепла."
 tre_restored_empire_unlocks_tt: "Теперь нам доступны новые [Concept('bureaucracies', 'бюрократические механизмы')|e] — [ShowBureaucracyTypeName('allelengyon_bureaucracy')] и [ShowBureaucracyTypeName('kephalai_bureaucracy')]), — [Concept('building', 'сооружение')|e] «[ShowBuildingTypeName('hippodrome')]», а также постоянные бонусы к [Concept('government_reforms', 'государственным принципам')|e] «[ShowGovernmentReformName('katepanata')]» и #TOOLTIP:GOVERNMENT_REFORM,kritai_katholikoi_reformed,X #L «Обновлённый Критай катхоликой»#!#!."
 tre_unlock_phoenix_cabinet_actions_tt: "Мы получаем постоянный доступ к [Concept('cabinet_actions', 'действиям совета')|e] «[ShowCabinetActionName('spread_philhellenism')]» и «[ShowCabinetActionName('encourage_latin_militarism')]»"
