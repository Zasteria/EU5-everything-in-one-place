 union_royal_assembly: "Королевское собрание"
 union_royal_assembly_desc: "Королевское собрание — зачаточная форма совещательного органа для всей #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#!. [Concept('estates', 'Сословия')|e] участников унии собираются для переговоров по введению централизованного [Concept('laws', 'свода правил')|e]."
 hre_court_assembly: "Придворное собрание"
 hre_court_assembly_desc: "$hre_court_assembly$ существует со времён, когда [Select_CString(GetCharacter('ogk_otto_liudolfinger').IsFemale,'правила', 'правил')] [GetCharacter('ogk_otto_liudolfinger').GetName]. Это древнее и довольно примитивное собрание в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!. Из-за отсутствия единообразных процедур [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] не может достаточно эффективно устанавливать новые правила.\n\n$BULLET_WITH_TAB$ Сила голоса #TOOLTIP:SPECIAL_STATUS,emperor,X #L императора#!#!, #TOOLTIP:SPECIAL_STATUS,elector,X #L князей-выборщиков#!#! и #TOOLTIP:SPECIAL_STATUS,archbishop_elector,X #L архиепископов-выборщиков#!#! значительно увеличивается\n$BULLET_WITH_TAB$ Влияние #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольных имперских городов#!#!, #TOOLTIP:SPECIAL_STATUS,imperial_prelate,X #L имперских прелатов#!#!, #TOOLTIP:SPECIAL_STATUS,primas_germaniae,X #L примасов Германии#!#! и #TOOLTIP:SPECIAL_STATUS,legatus_natus,X #L урождённых легатов#!#! значительно уменьшается\n$BULLET_WITH_TAB$ Власть #TOOLTIP:SPECIAL_STATUS,imperial_peasant_republic,X #L имперских крестьянских республик#!#! стандартна"
 hre_early_imperial_diet: "Ранний рейхстаг"
 hre_early_imperial_diet_desc: "Самая ранняя разновидность #TOOLTIP:LAW,imperial_diet_law,X #L рейхстага#!#! воплощает собой традиционный порядок #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,hre,X #L Священной Римской Империи#!#!. Участвовать могут только #TOOLTIP:SPECIAL_STATUS,elector,X #L князья-выборщики#!#!, #TOOLTIP:SPECIAL_STATUS,archbishop_elector,X #L архиепископы-выборщики#!#! и #TOOLTIP:SPECIAL_STATUS,imperial_prince,X #L имперские князья#!#!. #TOOLTIP:SPECIAL_STATUS,free_city,X #L Вольные имперские города#!#! и нижестоящие церковные субъекты исключаются из законодательного процесса.\n\n$BULLET_WITH_TAB$ Большая сила голоса у #TOOLTIP:SPECIAL_STATUS,emperor,X #L императоров#!#!, #TOOLTIP:SPECIAL_STATUS,elector,X #L князей-выборщиков#!#!, #TOOLTIP:SPECIAL_STATUS,archbishop_elector,X #L архиепископов-выборщиков#!#! и #TOOLTIP:SPECIAL_STATUS,imperial_prince,X #L имперских князей#!#!\n$BULLET_WITH_TAB$ #TOOLTIP:SPECIAL_STATUS,free_city,X #L Вольные имперские города#!#! и #TOOLTIP:SPECIAL_STATUS,imperial_peasant_republic,X #L имперские крестьянские республики#!#! не обладают правом голоса\n$BULLET_WITH_TAB$ Обладатели менее значительных церковных должностей, например #TOOLTIP:SPECIAL_STATUS,imperial_prelate,X #L имперские прелаты#!#!, #TOOLTIP:SPECIAL_STATUS,primas_germaniae,X #L примасы Германии#!#! и #TOOLTIP:SPECIAL_STATUS,legatus_natus,X #L урождённые легаты#!#!, обладают ограниченной властью"
 hre_bi_camerial_imperial_diet: "Двухпалатный рейхстаг"
 hre_bi_camerial_imperial_diet_desc: "При #TOOLTIP:PARLIAMENT_TYPE,hre_bi_camerial_imperial_diet,X #L двухпалатном рейхстаге#!#! правом голоса наделены как церковные сановники, так и правящие князья — они составляют две палаты рейхстага.\n\n$BULLET_WITH_TAB$ #TOOLTIP:SPECIAL_STATUS,emperor,X #L Императоры#!#!, #TOOLTIP:SPECIAL_STATUS,elector,X #L князья-выборщики#!#!, #TOOLTIP:SPECIAL_STATUS,archbishop_elector,X #L архиепископы-выборщики#!#! и #TOOLTIP:SPECIAL_STATUS,imperial_prince,X #L имперские принцы#!#! имеют обычные полномочия\n$BULLET_WITH_TAB$ #TOOLTIP:SPECIAL_STATUS,imperial_prelate,X #L Имперские прелаты#!#! пользуются ощутимым влиянием\n$BULLET_WITH_TAB$ #TOOLTIP:SPECIAL_STATUS,free_city,X #L Вольные имперские города#!#! и #TOOLTIP:SPECIAL_STATUS,imperial_peasant_republic,X #L имперские крестьянские республики#!#! всё так же не представлены"
 hre_tri_camerial_imperial_diet: "Трёхпалатный рейхстаг"
 hre_tri_camerial_imperial_diet_desc: "При #TOOLTIP:PARLIAMENT_TYPE,hre_tri_camerial_imperial_diet,X #L трёхпалатном рейхстаге#!#! решающий голос наконец получают #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольные имперские города#!#!. Теперь рейхстаг состоит из трёх палат, что позволяет поддерживать равновесие трёх типов власти: духовной, княжеской и гражданской.\n\n$BULLET_WITH_TAB$ Баланс сил между #TOOLTIP:SPECIAL_STATUS,emperor,X #L императором#!#!, #TOOLTIP:SPECIAL_STATUS,elector,X #L князьями-выборщиками#!#!, #TOOLTIP:SPECIAL_STATUS,archbishop_elector,X #L архиепископами-выборщиками#!#!, #TOOLTIP:SPECIAL_STATUS,imperial_prince,X #L имперскими принцами#!#!, #TOOLTIP:SPECIAL_STATUS,free_city,X #L вольными имперскими городами#!#! и обладателями малых теократических должностей\n$BULLET_WITH_TAB$ #TOOLTIP:SPECIAL_STATUS,imperial_peasant_republic,X #L Имперские крестьянские республики#!#! пользуются здесь наибольшим влиянием\n$BULLET_WITH_TAB$ Самая демократичная разновидность рейхстага"
