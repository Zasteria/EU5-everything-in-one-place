 lordship_of_ireland: "Манор Ирландия"
 lordship_of_ireland_desc: "Власть Англии над Ирландией грозит рухнуть. После завоеваний 1170 года прямое владычество короны постепенно ослабло. Сегодня ей принадлежит лишь небольшая территория, сосредоточенная вокруг Дублина. Правит этой территорией верный лейтенант, а её вассалы постепенно отдаляются от своего сюзерена. Потомки завоевателей, щедро наделённые в своё время эрлствами и баронствами, теперь скорее напоминают гэльских вождей, перенимая их язык и культуру. Иные же и вовсе перестали подчиняться Англии."
 lordship_of_ireland_lord_title: "Привилегии и обязанности лорда"
 lordship_of_ireland_lord_desc: "#TOOLTIP:SPECIAL_STATUS,lord_of_ireland,X #L Лорд Ирландии#!#! обязан усиливать влияние короны в #TOOLTIP:REGION,ireland_region,X #L Ирландии#!#!.\n\n#TOOLTIP:SPECIAL_STATUS,lord_of_ireland,X #L Лорд Ирландии#!#! может быть только один, и его власть хрупка. С одной стороны, он пользуется королевским расположением, а с другой — вынужден постоянно доказывать своё право занимать столь высокую должность."
 lordship_of_ireland_hint_1: "Участники манора Ирландия принесли клятву верности #ONCLICK:COUNTRY,[GetCountry('PLE').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PLE').Custom('CL_tt')],X [GetCountry('PLE').Custom('CL_DAT')|L]#!#!. Нарушить её может только #TOOLTIP:SPECIAL_STATUS,absentee,X #L абсентеист#!#!."
 lord_of_ireland_join_tt: "@trigger_no!Требуется приглашение от #TOOLTIP:SPECIAL_STATUS,lord_of_ireland,X #L лорда Ирландии#!#!"
 bestow_lieutenant_tt: "@trigger_no! В #TOOLTIP:INTERNATIONAL_ORGANIZATION,$lordship_of_ireland_tt$,X #L маноре Ирландия#!#! больше не может быть [Concept('countries', 'держав')|e] с [Concept('special_status', 'особым статусом')|e] #TOOLTIP:SPECIAL_STATUS,lieutenant,X #L лейтенанта#!#!"
 rescind_lieutenant_tt: "@trigger_no! В #TOOLTIP:INTERNATIONAL_ORGANIZATION,$lordship_of_ireland_tt$,X #L маноре Ирландия#!#! нет [Concept('countries', 'держав')|e] с [Concept('special_status', 'особым статусом')|e] #TOOLTIP:SPECIAL_STATUS,lieutenant,X #L лейтенанта#!#!, который можно отозвать"
