 bid_for_unification_desc: "Настало время объединить разрозненные племена! Создав более современную социальную структуру, мы сможем образовать племенную конфедерацию."
 will_ask_members_to_submit_tt: "Все участники нашей #Y конфедерации#! будут вынуждены стать нашими вассалами, или же мы заставим их силой."
 delegated_authority: "Делегирование полномочий"
 delegated_authority_desc: "Все местные племена, входящие в конфедерацию, имеют свои органы власти, могут принимать решения и действовать независимо."
 tatar_yoke: "Татарское иго"
 tatar_yoke_desc: "#TOOLTIP:SUB_CONTINENT,eastern_europe,X #L Восточная Европа#!#! в XIII веке пострадала от нашествия татар, установивших своё иго над различными княжествами. Самые выдающиеся правители именуются великими князьями. $rank_kingdom_horde_ruler_suffix_male$ Золотой Орды поручает им сбор дани с других князей от своего имени."
 TATAR_YOKE_LEADER_MALE: "Татарский сюзерен"
 TATAR_YOKE_LEADER_FEMALE: "Татарский сюзерен"
 tatar_yoke_contribution: "Татарская дань"
 tatar_yoke_contribution_desc: "Дань золотом и людьми, которую получает [ShowSpecialStatusName('tatar_tax_collector')]."
 tatar_yoke_leader_payments: "Выплаты татарам"
 tatar_yoke_leader_payments_desc: "Выплаты золотом и людьми, которые получает [GetInternationalOrganization('tatar_yoke').GetLeaderTitle] (доставляет их [ShowSpecialStatusName('tatar_tax_collector')])."
 TATAR_YOKE_TAX_COLLECTOR_TITLE: "Привилегии и обязанности сборщика татарских налогов"
 TATAR_YOKE_TAX_COLLECTOR_DESC: "Обязанность #TOOLTIP:SPECIAL_STATUS,tatar_tax_collector,X #L великого князя владимирского#!#! — собирать налоги от имени #TOOLTIP:SPECIAL_STATUS,tatar_overlord,X #L татарского сюзерена#!#!.\n\nВзамен в земли великого князя владимирского начинает #Y мигрировать#! значительная часть других находящихся под игом народов, спасающихся от #TOOLTIP:CULTUREGROUP,mongolian_group,X #L монгольских#!#! набегов."
 TATAR_YOKE_HINT_1: "Татарское иго — средневековое образование из княжеств Восточной Европы, захваченных монголами.\n\nК нему нельзя присоединиться.\n\n#T Рекомендуемые роли и возможности монгольских вассалов#!\n@arrow_bonus_tier_3!#TOOLTIP:SPECIAL_STATUS,tatar_overlord,X #L Татарский сюзерен#!#! должен следить за тем, чтобы другие вассалы не стали слишком могущественными.\n@arrow_bonus_tier_3!#TOOLTIP:SPECIAL_STATUS,tatar_tax_collector,X #L Великий князь владимирский#!#! может использовать своё положение для обогащения и укрепления власти и в конечном итоге свергнуть татарского сюзерена.\n@arrow_bonus_tier_3!Обычный участник может претендовать на титул великого князя владимирского или самостоятельно освободиться от ига."
 red_turban_rebels: "«Красные повязки»"
 red_turban_rebels_desc: "#T «Красные повязки»#!\n$red_turban_rebels$ — это отчаянные, но разобщённые мятежники, стремящиеся свергнуть #L [GetCountry('CHI').GetCulture.GetName|l]ого#! правителя и захватить#TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,middle_kingdom,X #L Срединное государство#!#!. Несмотря на наличие общего врага в лице #ONCLICK:COUNTRY,[GetCountry('CHI').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CHI').Custom('CL_tt')],X [GetCountry('CHI').Custom('CL_GEN')|L]#!#!, «Красные повязки» верны лишь собственным амбициям."
 guelphs_io: "Гвельфы"
 guelphs_io_desc: "$guelphs_io$ — это группа #L [ShowCultureGroupName('italian_group')|l]их #! государств, поддерживающих в #TOOLTIP:REGION,italy_region,X #L Италии#!#! цели, которые преследует [GetCountry('PAP').GetLongName]."
 ghibellines_io: "Гибеллины"
 ghibellines_io_desc: "$ghibellines_io$ — это группа #L [ShowCultureGroupName('italian_group')|l]их #! государств, поддерживающих в #TOOLTIP:REGION,italy_region,X #L Италии#!#! цели, которые преследует #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,hre,X #L Священная Римская Империя#!#!."
 senior_partner: "$game_concept_senior_partner$"
 senior_partner_plural: "Старшие партнёры"
 senior_partner_desc: "$game_concept_senior_partner$ фактически является лидером #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#! и, как правило, оплотом власти правящего монарха. Обычно весь процесс централизации сфокусирован на старшем партнёре и его от отношениях с другими участниками унии."
 junior_partner: "$game_concept_junior_partner$"
 junior_partner_plural: "$game_concept_junior_partners$"
 junior_partner_desc: "$game_concept_junior_partner$ — исходный статус любого участника #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#!, на престоле которого не сидит правящий монарх."
