 high_kingship_members_desc: "Членство в верховном королевстве не только приносит почёт, но и открывает перед державой возможности, недоступные остальным.\n\n#TOOLTIP:GENERIC_ACTION,subjugate_high_kingship_member,X #L Право вассалов на покорение#!#! даёт державам уникальный [Concept('casus_belli', 'повод для войны')|e], который позволяет им подчинять других участников в качестве [Concept('subject', 'ленников')|e].\n\nДействие «[ShowGenericActionName('overthrow_high_king')]» позволяет наиболее амбициозным участникам побороться за верховенство, [Concept('casus_belli', 'бросив вызов')|e] #TOOLTIP:SPECIAL_STATUS,high_king,X #L верховному королю#!#!."
 high_kingship_voting_title: "Борьба за титул верховного короля"
 high_kingship_voting_desc: "Титул верховного короля является выборным и не передаётся по наследству. Как только престол освобождается, члены королевства голосуют за следующего [Concept('international_organization_leader_short', 'лидера')|e]. Побеждает кандидат, набравший не менее #W 50%#! голосов.\n\nЧем могущественнее [Concept('member', 'участник')|e], тем больший вес имеет его голос. При этом учитывается его богатство, размер владений, а также количество крепостей и [Concept('subjects', 'ленников')|e]. Если же участник свергает #TOOLTIP:SPECIAL_STATUS,high_king,X #L верховного короля#!#!, то вес его голоса удваивается.\n\nДержава верховного короля получает штраф во время голосования. [Concept('loyal_subject', 'Верный ленник')|e] обязан голосовать за своего [Concept('overlord', 'сюзерена')|e], а [Concept('disloyal_subject', 'нелояльный')|e] — за кого угодно, кроме своего сюзерена. При этом запрещено голосовать за ленников, своих соперников и оппонентов в [Concept('war', 'войне')|e].\n\nПовод для войны «[ShowCasusBelliName('cb_high_kingship_overthrow')]» также даёт возможность захватить престол силой. В случае успеха начнётся новое голосование, в котором у победителя будет значительное преимущество."
 HIGH_KINGSHIP_NOT_INCUMBENT_TT: "Не может быть текущий [ShowSpecialStatusName('high_king')|l]"
 HIGH_KINGSHIP_HIGHEST_TAX_BASE_IN_CAPITAL_AREA: "Наибольшая [Concept('tax_base', 'налоговая база')|e] в их столичной [Concept('area', 'области')|e]"
