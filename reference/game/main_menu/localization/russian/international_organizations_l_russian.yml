 vote_in_organization_parliament_header: "$vote_in_organization_parliament$"
 vote_in_organization_parliament_desc: "В [Concept('parliament', 'парламенте')|e] [Concept('international_organization', 'международного объединения')|e] сейчас идут дебаты. Путём голосования державы-участницы могут определить исход обсуждения [Concept('parliament_issue', 'парламентского вопроса')|e]."
