 marriage_union: "Брачная уния"
 marriage_union_desc: "Эта особая [Concept('union', 'уния')|e] заключается с помощью [Concept('royal_marriage', 'династического брака')|e]. В отличие от обычной #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#!, брачную нельзя централизовать — она больше похожа на #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,defensive_league,X #L оборонительную лигу#!#!."
 marriage_union_disband_tt: "[Concept('royal_marriage', 'Династический брак')|e] расторгнут"
 union_recent_policy_change_cd: "Недавнее изменение политики унии"
 union_annexation_rule_tt: "Создан #TOOLTIP:SPECIAL_STATUS,senior_partner,X #L старший партнёр#!#!, не являющийся [Concept('subject', 'ленником')|e]. Для правила #TOOLTIP:LAW,union_unification_of_crowns_law,X #L «Перспектива объединения»#!#! установлена соответствующая [Concept('policy', 'политика')|e]"
 marriage_union_tooltip_title: "[GetInternationalOrganizationType('marriage_union').GetNameWithNoTooltip]"
 union_integration_level_tooltip: "[Concept('union_integration_level', 'Уровень интеграции унии')|e]: [InternationalOrganizationsView.GetInternationalOrganization.GetModifierValueString('union_integration_level')]"
 marriage_union_mechanic_tooltip: "#TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,marriage_union,X #L Брачная уния#!#! — децентрализованная разновидность #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,union,X #L унии#!#!, схожая с #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,defensive_league,X #L оборонительной лигой#!#!: каждый её [Concept('member', 'участник')|e] будет защищать другого, если тот подвергнется нападению. Чтобы заключить унию, как минимум у двух держав должен быть один и тот же [Concept('heir', 'наследник')|e], который скоро взойдёт на престол."
 union_mechanic_tooltip: "Участники покидают [Concept('union', 'унию')|e], если над ними больше не властвует один и тот же [Concept('ruler', 'правитель')|e] (или [Concept('heir', 'наследник')|e] в случае [Concept('regency', 'регентства')|e]). Для объединения унии у всех [Concept('member', 'участников')|e] должен быть тот же [Concept('union_integration_level_short', 'уровень интеграции')|e], что и у #TOOLTIP:SPECIAL_STATUS,senior_partner,X #L старшего партнёра#!#!. Участникам более низкого уровня нужно навязать интеграцию через [Concept('parliament', 'парламент')|e].\n\nЕсли у #TOOLTIP:SPECIAL_STATUS,junior_partner,X #L младших партнёров#!#! [Concept('great_power_score', 'счёт великой державы')|e] не ниже #Y 125%#! по сравнению с текущим старшим партнёром, им доступно [Concept('country_interaction', 'взаимодействие')|e] #TOOLTIP:COUNTRY_INTERACTION,take_over_seniority,X #L «Захват старшинства»#!#!.\n\nТекущий центр унии — [InternationalOrganizationsView.GetInternationalOrganization.GetLeaderScopeObjectAtIndex('(int32)0').GetCharacter.GetCourtCountry.GetCapital.GetName], [InternationalOrganizationsView.GetInternationalOrganization.GetLeaderScopeObjectAtIndex('(int32)0').GetCharacter.GetCourtCountry.GetName]."
 union_current_seat: "Текущий центр унии находится в городе [InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').GetCapital.GetName] [InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('CL_tt')] #TOOLTIP:COUNTRY,[InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('CL_tt')],X [InternationalOrganizationsView.GetSpecialStatusCountry('senior_partner').Custom('CL_PREP')|L]#!#!"
