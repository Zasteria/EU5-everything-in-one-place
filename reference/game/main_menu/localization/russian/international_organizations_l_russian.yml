 HRE_EMPROR_TITLE: "Привилегии и обязанности императора"
 HRE_EMPROR_DESC: "Объединение «[InternationalOrganizationsView.GetInternationalOrganization.GetNameWithNoTooltip]» возглавляет #TOOLTIP:SPECIAL_STATUS,emperor,X #L император#!#!. Его долг — защищать входящие в империю державы от внешних угроз, поддерживать внутри своих владений мир и стабильность, а также бороться за религиозное единство среди подданных.\n\nВ обмен император получает #Y имперскую власть#!, которую можно тратить на предложения [Concept('laws', 'правил')|e] и [Concept('parliament_issues', 'парламентских вопросов')|e], а также другие полезные бонусы."
