 autocephalous_patriarchate_desc: "Автокефальный (то есть #italic самовозглавляемый#!) патриархат — это поместная православная церковь, возглавляемая митрополитом. Она действует самостоятельно и не отвечает ни перед какими-либо другими церковными властями. Все решения, касающиеся управления каждым патриархатом, принимаются его синодом — собранием епископов."
