l_russian:
 STATIC_MODIFIER_NAME_freiberg_base: "Серебряные рудники Фрайберга"
 STATIC_MODIFIER_DESC_freiberg_base: "Добывать здесь руду начали ещё в XII веке. Со временем эти шахты стали одним из главных источников серебра в Центральной Европе."
 STATIC_MODIFIER_NAME_falun_base: "Стура-Коппарберг"
 STATIC_MODIFIER_DESC_falun_base: "Большая часть европейской меди добывается в этой шахте."
 STATIC_MODIFIER_NAME_golconda_base: "Алмазные рудники Голконды"
 STATIC_MODIFIER_DESC_golconda_base: "Здесь добывают безупречные и самые драгоценные алмазы во всём мире."
 STATIC_MODIFIER_NAME_skane_herring_market: "Рынок сельди в Сконе"
 STATIC_MODIFIER_DESC_skane_herring_market: "С начала XIII века здесь находится крупнейший рынок сельди во всей Скандинавии."
 STATIC_MODIFIER_NAME_almaden_base: "Ртутные рудники Альмадена"
 STATIC_MODIFIER_DESC_almaden_base: "В этих рудниках добывается треть всего потребляемого в мире объёма ртути."
 STATIC_MODIFIER_NAME_huancavelica_base: "Ртутные рудники Уанкавелики"
 STATIC_MODIFIER_DESC_huancavelica_base: "Это один из важнейших рудников Южной Америки: здесь находятся огромные залежи ртути."
 STATIC_MODIFIER_NAME_idrija_base: "Ртутные рудники Идрии"
 STATIC_MODIFIER_DESC_idrija_base: "В этих шахтах расположены крупные залежи ртути — как в жидком виде, так и в виде твёрдой киновари."
 STATIC_MODIFIER_NAME_lanmuchang_base: "Ртутные рудники Ланьмучана"
 STATIC_MODIFIER_DESC_lanmuchang_base: "Это важнейший ртутный рудник в Китае со времён античности."
 STATIC_MODIFIER_NAME_potosi_base: "Серро-Рико-дель-Потоси"
 STATIC_MODIFIER_DESC_potosi_base: "В этой шахте у подножия горы Потоси располагаются самые богатые в мире серебряные жилы."
 STATIC_MODIFIER_NAME_zacatecas_base: "Серебряные рудники Сакатекаса"
 STATIC_MODIFIER_DESC_zacatecas_base: "Это богатейшие серебряные рудники Мезоамерики."
 STATIC_MODIFIER_NAME_guanajuato_base: "Серебряные рудники Гуанахуато"
 STATIC_MODIFIER_DESC_guanajuato_base: "Богатейшие серебряные рудники Центральной Мексики."
 STATIC_MODIFIER_NAME_spice_islands_base: "Гвоздика с Островов пряностей"
 STATIC_MODIFIER_DESC_spice_islands_base: "На этом острове в больших количествах выращивается драгоценная пряность — гвоздика."
 STATIC_MODIFIER_NAME_nile_delta_rice_base: "Плодородная дельта Нила"
 STATIC_MODIFIER_DESC_nile_delta_rice_base: "Пойменные земли Нила идеально подходят для выращивания любых культур."
 STATIC_MODIFIER_NAME_nile_delta_wheat_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
 STATIC_MODIFIER_DESC_nile_delta_wheat_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
