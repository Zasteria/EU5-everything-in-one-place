 STATIC_MODIFIER_NAME_nile_delta_legumes_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
 STATIC_MODIFIER_DESC_nile_delta_legumes_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
 STATIC_MODIFIER_NAME_nile_delta_fiber_crops_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
 STATIC_MODIFIER_DESC_nile_delta_fiber_crops_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
 STATIC_MODIFIER_NAME_nile_delta_fruit_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
 STATIC_MODIFIER_DESC_nile_delta_fruit_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
 STATIC_MODIFIER_NAME_coffee_yemen_base: "Аравийский кофе"
 STATIC_MODIFIER_DESC_coffee_yemen_base: "В благодатной почве Йемена обильно произрастают кофейные бобы."
 STATIC_MODIFIER_NAME_sahara_salt_mines_base: "Соляные шахты Сахары"
 STATIC_MODIFIER_DESC_sahara_salt_mines_base: "Здесь добывается большая часть соли, которую купцы перевозят через Сахару."
 STATIC_MODIFIER_NAME_sikar_copper_mines_base: "Медный рудник Кхетри"
 STATIC_MODIFIER_DESC_sikar_copper_mines_base: "Благодаря богатым медным залежам Кхетри шахтёры никогда не останутся без работы."
 STATIC_MODIFIER_NAME_nishapur_gems_mines_base: "Бирюзовый рудник Нишапура"
 STATIC_MODIFIER_DESC_nishapur_gems_mines_base: "Шахты Нишапура богаты запасами драгоценной бирюзы."
 STATIC_MODIFIER_NAME_panjshir_valley_silver_mines_base: "Серебро из Панджшерского ущелья"
 STATIC_MODIFIER_DESC_panjshir_valley_silver_mines_base: "Богатство серебряных рудников в Панджшерском ущелье будет принадлежать любому, кто ими владеет."
 STATIC_MODIFIER_NAME_turda_salt_mines_base: "Соляная шахта Турды"
 STATIC_MODIFIER_DESC_turda_salt_mines_base: "В шахте около Турды расположены самые богатые запасы соли в Прикарпатье."
 STATIC_MODIFIER_NAME_kutna_hora_silver_mines_base: "Серебряный рудник Кутна-Горы"
 STATIC_MODIFIER_DESC_kutna_hora_silver_mines_base: "Серебряный рудник Кутна-Горы — самый богатый во всей Богемии."
 STATIC_MODIFIER_NAME_rammelsberg_silver_mines_base: "Серебряный рудник Раммельсберга"
 STATIC_MODIFIER_DESC_rammelsberg_silver_mines_base: "Шахта под Раммельсбергом весьма богата залежами серебра."
 STATIC_MODIFIER_NAME_mali_gold_mines_base: "Золотые рудники Мали"
 STATIC_MODIFIER_DESC_mali_gold_mines_base: "Золотые шахты Буре — главный источник легендарного богатства мансы Мусы."
 STATIC_MODIFIER_NAME_kremnica_gold_mines: "Золотой рудник Кремницы"
 STATIC_MODIFIER_DESC_kremnica_gold_mines: "В шахте Кремницы располагаются самые богатые запасы золота в Прикарпатье."
 STATIC_MODIFIER_NAME_srebrenica_silver_mines_base: "Серебряный рудник Сребреницы"
 STATIC_MODIFIER_DESC_srebrenica_silver_mines_base: "В шахте Сребреницы располагаются самые богатые запасы серебра на Балканах."
 STATIC_MODIFIER_NAME_newfoundland_fishing_grounds_base: "Рыбные промыслы Ньюфаундленда"
 STATIC_MODIFIER_DESC_newfoundland_fishing_grounds_base: "Вокруг острова Ньюфаундленд бурлят воды, самые богатые рыбой во всём мире."
 STATIC_MODIFIER_NAME_amber_coast_base: "Янтарный берег"
 STATIC_MODIFIER_DESC_amber_coast_base: "На местном побережье много залежей янтаря."
 STATIC_MODIFIER_NAME_sicily_sulfur_mines: "Серный рудник Сицилии"
 STATIC_MODIFIER_DESC_sicily_sulfur_mines: "Серные шахты Сицилии полны веществом, необходимым для производства пороха."
 STATIC_MODIFIER_NAME_damascus_base: "Традиции дамасских оружейников"
 STATIC_MODIFIER_DESC_damascus_base: "Дамаск с давних пор славится своими великолепными мечами. Местные кузнецы чтят традиции и производят оружие непревзойдённого качества."
 STATIC_MODIFIER_NAME_flanders_fine_cloth_base: "Традиции фламандских текстильщиков"
 STATIC_MODIFIER_DESC_flanders_fine_cloth_base: "Великолепный текстиль, производимый фламандскими ткачами — мастерами своего дела и носителями многолетних традиций, — отличается невероятным качеством, а потому пользуется большим спросом в Европе, несмотря на высокую цену."
 STATIC_MODIFIER_NAME_tuscany_fine_cloth_base: "Традиции тосканских текстильщиков"
 STATIC_MODIFIER_DESC_tuscany_fine_cloth_base: "Флоренция и Лукка издавна славятся как лучшие города — производители текстиля во всей Италии. Мастерство местных гильдий — предмет зависти всего континента."
 STATIC_MODIFIER_NAME_venice_glass_base: "Традиции муранских стеклодувов"
 STATIC_MODIFIER_DESC_venice_glass_base: "Стеклодувы с Мурано — настоящие мастера традиций, передающихся из поколения в поколение. Их стекло отличается непревзойдённым качеством."
 STATIC_MODIFIER_NAME_toledo_weaponry_base: "Традиции толедских оружейников"
 STATIC_MODIFIER_DESC_toledo_weaponry_base: "Ещё с древних времён Толедо пользуется славой города, где делают клинки невероятного качества. Из местной руды, богатой железом, толедские кузнецы способны выковать острейший меч."
 STATIC_MODIFIER_NAME_bilbao_iron_base: "Баскские залежи железа"
 STATIC_MODIFIER_DESC_bilbao_iron_base: "В Бискайе расположены одни из богатейших залежей качественнейшей железной руды в Иберии. Руда из Бильбао пользуется огромным спросом у кузнецов со всего полуострова."
 STATIC_MODIFIER_NAME_malaga_sweet_wine_base: "Виноградники и сахарные плантации Малаги"
 STATIC_MODIFIER_DESC_malaga_sweet_wine_base: "Сахарные плантации и виноградники на #italic заливных лугах#! в окрестностях Малаги возделывались андалузскими специалистами ещё с десятого столетия. Урожай поступал на местные рынки, а также поставлялся генуэзским торговым домам, откуда отправлялся в Брюгге и Александрию."
 STATIC_MODIFIER_NAME_almeria_silk_base: "Альмерийский шёлк"
 STATIC_MODIFIER_DESC_almeria_silk_base: "В горах Альпухарра в окрестностях Альмерии расположены самые крупные в Европе плантации шелковичных червей. Произведённый шёлк-сырец проходит строгий контроль по стандартам #italic хисба#!, после чего поступает в порт, где его скупают генуэзские и флорентийские торговые агенты."
 STATIC_MODIFIER_NAME_granada_pottery_base: "Гранадская керамика"
 STATIC_MODIFIER_DESC_granada_pottery_base: "Залежи глины в долинах рек Дарро и Хениль обеспечивают работой мастеровых Альбайсина, славящихся своей люстровой керамикой и особой техникой росписи #italic cuerda seca#! («сухая верёвка»). Они производят плитку, всевозможные сосуды и столовую посуду; лучшие мастера от Каира до Брюгге могут позавидовать их искусности работы с эмалью — неспроста их лучшие творения украшают залы самой Альгамбры."
 STATIC_MODIFIER_NAME_milan_weaponry_base: "Традиции миланских оружейников"
 STATIC_MODIFIER_DESC_milan_weaponry_base: "Милан и Брешия — оружейные столицы Европы: здесь делают латы и оружие несравненного качества."
 STATIC_MODIFIER_NAME_yorkshire_cloth_base: "Йоркширское шерстяное производство"
 STATIC_MODIFIER_DESC_yorkshire_cloth_base: "Йоркшир и Ист-Мидлендс — города с развитой текстильной промышленностью. Местные ткачи поставляют на рынки высококачественные шерстяные ткани."
 STATIC_MODIFIER_NAME_england_wool_base: "Край английской шерсти"
 STATIC_MODIFIER_DESC_england_wool_base: "В этом регионе производится едва ли не лучшая в мире шерсть, пользующаяся большим спросом у торговцев тканями со всей Европы."
 STATIC_MODIFIER_NAME_bengal_cotton_base: "Возделывание хлопка в Бенгалии"
 STATIC_MODIFIER_DESC_bengal_cotton_base: "Жаркий и влажный климат Бенгалии отлично подходит для выращивания высококачественного хлопка. Благодаря природным условиям Бенгалия — один из главных производителей хлопка в мире."
 STATIC_MODIFIER_NAME_gujarat_cotton_base: "Возделывание хлопка в Гуджарате"
 STATIC_MODIFIER_DESC_gujarat_cotton_base: "В плодородных долинах Гуджарата обильно растёт хлопок — основа основ, без которой невозможна была бы торговля тканями."
