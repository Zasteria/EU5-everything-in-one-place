 WAR_LATERALVIEW_GRANT_INDEPENDENCE_THIRD_OUTCOME_HINT: "#S Совет: у вас есть и другие возможности. Если вы договоритесь о мире без предоставления независимости или просто завершите эту войну, [COUNTRY.GetName] снова стан[COUNTRY.Custom('end_etyut')] вашим [Concept('subject', 'ленником')|e].#!"
