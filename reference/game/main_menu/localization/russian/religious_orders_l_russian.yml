 NO_POSSIBLE_CALLINGS: "@trigger_no! Нет [Concept('callings', 'призваний')|e], подходящих для выбора."
 # Subheader stat-block + per-card tooltips (religious_orders_list.gui)
 RELIGIOUS_ORDERS_OVERVIEW_TOOLTIP_TITLE: "Религиозные ордена"
 RELIGIOUS_ORDER_LOCATIONS_TOOLTIP_TITLE: "[ReligiousOrder.GetNameWithNoTooltip]: владения"
