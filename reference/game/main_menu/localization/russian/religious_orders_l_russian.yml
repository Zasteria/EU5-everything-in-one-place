l_russian:
 religious_orders_label: "Религиозные ордена"
 TAB_TOOLTIP_SOCIETY_RELIGIOUS_ORDERS_TITLE: "Религиозные ордена"
 TAB_TOOLTIP_SOCIETY_RELIGIOUS_ORDERS_TEXT: "Принадлежащие религиям объединения людей, которые действуют на территории многих стран сразу. У каждого ордена есть глобальный показатель #high рвения#!, от которого зависит его существование, а также два локальных показателя: #high влияние#! (насколько орден закрепился в той или иной державе) и #high верность#! (насколько далеко он готов зайти ради этой державы)."
 RELIGIOUS_ORDERS_LIST_EMPTY: "В этой религии ещё нет орденов."
