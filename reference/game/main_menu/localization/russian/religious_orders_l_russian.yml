 RELIGIOUS_ORDER_ZEAL_TOOLTIP_TITLE: "Рвение"
 RELIGIOUS_ORDER_ZEAL_TOOLTIP_BODY: "[Concept('zeal', 'Рвение')|e] определяет общую жизнеспособность [Concept('religious_order', 'религиозного ордена')|e]. Сейчас оно составляет #high [ReligiousOrder.GetZeal|0]%#! и изменяется на [ReligiousOrder.GetMonthlyZealChange|+=1]% в месяц."
 RELIGIOUS_ORDER_ZEAL_DEPLETION_WARNING: "Такими темпами орден «[ReligiousOrder.GetName]» будет распущен через #R [ReligiousOrder.GetZealDepletionText]#!!"
 RELIGIOUS_ORDER_POWER_TOOLTIP_TITLE: "Пауэр"
 RELIGIOUS_ORDER_POWER_TOOLTIP_BODY: "[Concept('religious_order_power_short', 'Влияние')|e] [Concept('religious_orders', 'религиозного ордена')|e] показывает, насколько он закрепился в нашей [Concept('country', 'державе')|e]. Оно отражает не нашу власть над орденом, а его собственное могущество в наших землях. Сейчас оно составляет #high [ReligiousOrder.GetPlayerPresencePower|0]#! из 100 ед. и может вырасти до #high [ReligiousOrder.GetPlayerMaxPower|0]#!."
 RELIGIOUS_ORDER_POWER_TOOLTIP_FOOTER: "Влияние ордена усиливает любые его [Concept('calling', 'призвания')|e], которые могут быть как полезными, так и вредными для нас. Вдобавок, если оно превысит 50 ед., [Concept('religious_order_loyalty_short', 'верность')|e] ордена начнёт снижаться.\nЧем меньше в [Concept('country', 'державе')|e] [Concept('locations', 'районов')|e], тем больше [Concept('religious_order_power_short', 'влияния')|e] даёт ордену каждое [Concept('holding', 'владение')|e]."
 RELIGIOUS_ORDER_LOYALTY_TOOLTIP_TITLE: "Верность"
 RELIGIOUS_ORDER_LOYALTY_TOOLTIP_BODY: "Это [Concept('religious_order_loyalty_short', 'верность')|e] [Concept('religious_order', 'религиозного ордена')|e] нашей [Concept('country', 'державе')|e]. Сейчас она составляет #high [ReligiousOrder.GetPlayerPresenceLoyalty|0]#! из 100. При верности выше 50 ед. орден предоставляет нам свои ресурсы."
 RELIGIOUS_ORDER_POWER_BREAKDOWN_HOLDINGS: "[Concept('holdings', 'Владения')|E] в наших землях ($COUNT$ × $PER$ за каждое): #high $VALUE$#!"
 RELIGIOUS_ORDER_POWER_BREAKDOWN_LEADER_PRESENT: "Глава находится в наших землях: #G +5#!"
