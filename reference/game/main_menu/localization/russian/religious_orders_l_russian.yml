 RELIGIOUS_ORDER_LOYALTY_DIRECTION_NEUTRAL: "Орден #high безразличен#! к нашей державе (верность 50 или ниже)."
 RELIGIOUS_ORDER_LOYALTY_POWER_DRAG: "Из-за растущего [Concept('religious_order_power_short', 'влияния')|e] верность снижается, стремясь к #high $TARGET$#!."
 RELIGIOUS_ORDER_CALLING_HIGH_LOYALTY_HEADER: "Если верный (верность выше 50):"
