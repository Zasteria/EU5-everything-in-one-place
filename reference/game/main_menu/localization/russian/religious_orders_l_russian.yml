 cabalgada_raids_desc: "Позволение членам ордена с призванием «#high $wardens_calling$#!», живущим в пограничье, совершать набеги на враждебных язычников, вторгшихся в наши земли. В течение 12 месяцев враги будут сильнее страдать от истощения в наших владениях. Чем выше влияние и [Concept('zeal', 'рвение')|E] ордена, тем суровее набеги. Верность ордена при этом уменьшается, а [Concept('zeal', 'рвение')|E] растёт."
