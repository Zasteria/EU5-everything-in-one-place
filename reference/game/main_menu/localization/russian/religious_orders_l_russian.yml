 # Types
 iberian_military_order_type: "Иберийский военный орден"
 iberian_military_order_type_desc: "Такие братства, рождённые Реконкистой, объединяют рыцарские мечи с монашескими обетами. Их [Concept('holdings', 'владения')|E], расположенные у границ с маврами, собирают местное ополчение и служат постоянными гарнизонами там, куда не дотягивается рука короны."
 RELIGIOUS_ORDER_TYPE_ACTIVE_ORDERS_TITLE: "Действующие ордена"
 RELIGIOUS_ORDER_TYPE_CALLINGS_TITLE: "Доступные [Concept('callings', 'призвания')|E]"
 monastic_order_type: "Монашеский орден"
 monastic_order_type_desc: "Католическое духовное братство, во [Concept('holdings', 'владениях')|E] которого монахи занимаются молитвой, поиском знаний и возделыванием земли."
 mendicant_order_type: "Нищенствующий орден"
 mendicant_order_type_desc: "Католические монахи, принявшие обет бедности и живущие подаянием. Они проповедуют, учатся и заботятся об обездоленных в наших селениях и городах."
 # Type-specific loc-keys referenced from location overlay text
 ORDER_HOLDING: "Владение"
 ORDER_OF_LOCATION_NAME_PATTERN: "Орден района $LOCATION$"
 ORDER_HOLDING_TITLE: "[Concept('holding', 'Владение')|E] религиозного ордена"
 ORDER_HOLDING_ORDER: "[Concept('religious_order', 'Религиозный орден')|e]: [ReligiousOrder.GetName]"
 ORDER_HOLDING_MODIFIER_TITLE: "Эффект района"
 ORDER_HOLDING_DEMAND_TITLE: "Месячное содержание"
 ORDER_HOLDING_DEMAND_ENTRY: "[GOODS.GetIcon][GOODS.GetName]: $VAL|2$"
 crusaders_calling: "Крестоносцы"
 crusaders_calling_desc: "Воинствующий орден, посвятивший себя борьбе с язычниками в крестовом походе."
 wardens_calling: "Стражи"
 wardens_calling_desc: "Пограничный орден, посвятивший себя службе в окраинных гарнизонах."
 confidants_calling: "Секретари"
 confidants_calling_desc: "Придворное братство, посвятившее себя службе правящей династии и государственному управлению."
 mariners_calling: "Мореходы"
 mariners_calling_desc: "Орден крестоносцев, посвятивший себя морским сражениям и исследованию земель за пределами христианского мира."
 contemplatives_calling: "Мистики"
 contemplatives_calling_desc: "Закрытый орден, посвятивший себя молитве, литургии и аскезе."
 scholars_calling: "Богословы"
 scholars_calling_desc: "Орден, занятый переписыванием книг, обучением священников, а также общим развитием наук и искусств."
 cultivators_calling: "Земледельцы"
 cultivators_calling_desc: "Реформированный орден, монахи которого расчищают пустоши и возделывают на них поля."
 preachers_calling: "Миссионеры"
 preachers_calling_desc: "Монашеский орден, посвятивший себя проповедям, обращению неверных и защите догматов веры."
 almoners_calling: "Опекуны"
 almoners_calling_desc: "Эти монахи принесли обет бедности и живут подаянием, но готовы отдать последнюю корку хлеба, заботясь о страждущих и обездоленных."
 confessors_calling: "Исповедники"
 confessors_calling_desc: "Эти монахи, живущие в миру, принимают исповеди и мягко направляют души людей к свету."
 CALLING_PREFERRED_SOCIETAL_VALUES_TITLE: "Предпочтительные [Concept('societal_values', 'общественные ценности')|E]"
 CALLING_LOCATION_MODIFIER_TITLE: "За [Concept('holding', 'владение')|E]"
 CALLING_COUNTRY_MODIFIER_TITLE: "За державу присутствия (с учётом влияния, рвения и верности)"
 # Iberian military orders
 order_of_calatrava_religious_order: "Орден Калатравы"
 order_of_calatrava_religious_order_desc: "Основан в 1158 г. цистерцианским аббатом Раймондом из Фитеро для обороны крепости Калатрава после того, как её покинули тамплиеры. Первый собственный военный орден Кастилии."
 order_of_santiago_religious_order: "Орден Сантьяго"
 order_of_santiago_religious_order_desc: "Основан около 1170 г. для охраны паломников, идущих в Сантьяго-де-Компостелу, и священной войны с маврами."
 order_of_alcantara_religious_order: "Орден Алькантары"
 order_of_alcantara_religious_order_desc: "Основанный около 1166 г. как орден Сан-Хулиан де Перейро, в 1218 г. он получил во владение город Алькантара и принял его название."
 order_of_christ_religious_order: "Орден Христа"
 order_of_christ_religious_order_desc: "Основанный в 1319 г. королем Динишем в качестве преемника преследуемых тамплиеров, этот орден унаследовал все их португальские владения, включая замок-конвент в Томаре."
 order_of_avis_religious_order: "Ависский орден"
 order_of_avis_religious_order_desc: "Этот португальский орден, относящийся к бенедиктинцам, получил свое название в честь Ависского замка, который в 1211 г. стал его резиденцией."
 order_of_montesa_religious_order: "Орден Монтесы"
 order_of_montesa_religious_order_desc: "Основан в 1317 г. королем Яковом II Арагонским для контроля над бывшими владениями тамплиеров и госпитальеров в Арагоне. Его резиденцией стал замок Монтеса в Валенсии."
 benedictine_order_religious_order: "Бенедиктинцы"
 benedictine_order_religious_order_desc: "Устав этого ордена, написанный Бенедиктом Нурсийским в VI веке, стал основой всего европейского монашества. Его аббаты входят в число высших иерархов церкви."
 cistercian_order_religious_order: "Цистерцианцы"
 cistercian_order_religious_order_desc: "Этот орден появился в 1098 г. в результате реформы монастыря Сито, вернувшей строгое толкование бенедиктинского устава. Он известен тем, что его монахи и послушники обязаны трудиться, в том числе расчищать и возделывать землю."
 augustine_order_religious_order: "Августинцы"
 augustine_order_religious_order_desc: "Эти священники, живущих в миру по уставу блаженного Августина, не являются ни полноценными монахами, ни белым духовенством. Их общины служат в соборах, содержат школы и больницы, а также занимаются пастырской опёкой приходов."
 dominican_order_religious_order: "Доминиканцы"
 dominican_order_religious_order_desc: "Орден проповедников, основанный Домиником де Гусманом для борьбы с ересью посредством учёности и устного слова. Его монахи занимают кафедры университетов и ведут богословские диспуты на крупнейших соборах христианского мира."
 franciscan_order_religious_order: "Францисканцы"
 franciscan_order_religious_order_desc: "Меньшие братья Франциска Ассизского, в подражание Христу давшие обеты абсолютной бедности. Они ходят среди городских нищих, собирая подаяние и проповедуя веру личным примером."
