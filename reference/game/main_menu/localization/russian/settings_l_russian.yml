 # Audio Profiles Settings
 #SETTING_AUDIO_DEBUG_LOG_LEVEL: "Debug Log Level"
 SETTING_AUDIO_DEVICE_PROFILE: "Профиль звука"
 SETTING_AUDIO_DEVICE_PROFILE_TOOLTIP: "#T $SETTING_AUDIO_DEVICE_PROFILE$\n#!Выберите профиль звука, соответствующий вашей конфигурации или предпочтениям с точки зрения динамики звука и микширования. Эта настройка не влияет на маршрутизацию каналов."
 SETTING_AUDIO_OPTION_OFF: "Выкл."
 SETTING_AUDIO_OPTION_OFF_TOOLTIP: "#T $SETTING_AUDIO_OPTION_OFF$\n#!Стандартный микшер с полным динамическим диапазоном. Рекомендуется для большинства пользователей и конфигураций."
 SETTING_AUDIO_OPTION_HOMECINEMA: "Домашний кинотеатр"
 SETTING_AUDIO_OPTION_HOMECINEMA_TOOLTIP: "#T $SETTING_AUDIO_OPTION_HOMECINEMA$\n#!Профиль звука: $SETTING_AUDIO_OPTION_HOMECINEMA$. Выравнивает динамику и уплотняет басы. Подходит для акустических систем, использующих сабвуфер."
 SETTING_AUDIO_OPTION_HEADPHONES: "Наушники"
 SETTING_AUDIO_OPTION_HEADPHONES_TOOLTIP: "#T $SETTING_AUDIO_OPTION_HEADPHONES$\n#!Профиль звука: $SETTING_AUDIO_OPTION_HEADPHONES$. Слегка выравнивает динамику и может помочь смягчить выраженные частоты во многих наушниках типичных конструкций."
 SETTING_AUDIO_OPTION_SPEAKERS: "Динамики"
 SETTING_AUDIO_OPTION_SPEAKERS_TOOLTIP: "#T $SETTING_AUDIO_OPTION_SPEAKERS$\n#!Профиль звука: $SETTING_AUDIO_OPTION_SPEAKERS$. Усиливает определённые частоты и может обеспечить более насыщенное звучание на акустических системах без сабвуфера."
 SETTING_AUDIO_OPTION_TV: "Телевизор"
 SETTING_AUDIO_OPTION_TV_TOOLTIP: "#T $SETTING_AUDIO_OPTION_TV$\n#!Профиль звука: $SETTING_AUDIO_OPTION_TV$ и маленькие динамики. Помогает контролировать низкие частоты, которые могут подавляться встроенными динамиками, а также повышает чёткость звучания на высоких частотах."
 SETTING_AUDIO_OPTION_NIGHTMODE: "Ночной режим"
 SETTING_AUDIO_OPTION_NIGHTMODE_TOOLTIP: "#T $SETTING_AUDIO_OPTION_NIGHTMODE$\n#!Профиль, смягчающий звук для воспроизведения в ночное время. Сужает динамический диапазон на всех частотах для улучшения чёткости звучания на небольшой громкости и слегка приглушает низкие частоты для минимизации помех."
 # Audio Music Settings
 SETTING_Music_Density: "Насыщенность музыки"
 SETTING_Music_Density_TOOLTIP: "#T Регулировка насыщенности музыки\n#!Задает длительность пауз между музыкальными композициями: от длинных до практически непрерывного воспроизведения. Значение по умолчанию — 20."
 SETTING_Music_Intensity: "Интенсивность музыки"
 SETTING_Music_Intensity_TOOLTIP: "#T Интенсивность музыки\n#!Задаёт общую интенсивность статического музыкального микса. Действует только в режиме статических кинематографических или культурных подборок."
 SETTING_MUSIC_SYSTEM_TYPE: "Подбор музыки"
 SETTING_MUSIC_SYSTEM_TYPE_TOOLTIP: "#T $SETTING_MUSIC_SYSTEM_TYPE$\n#!Позволяет выбрать поведение системы подбора музыки — полностью динамические плейлисты, кинематографические или культурные подборки, статические плейлисты или вообще без музыки."
 SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_ALL: "Динамическая — все"
 SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_ALL_TOOLTIP: "#T $SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_ALL$\n#!Позволяет использовать полностью динамическую систему подбора музыки с доступом ко всем композициям."
 SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_CINEMATIC: "Динамическая — кинематографические"
 SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_CINEMATIC_TOOLTIP: "#T $SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_CINEMATIC$\n#!Позволяет использовать динамическую систему подбора музыки с уклоном в более кинематографические композиции."
 SETTING_MUSIC_SYSTEM_TYPE_DYNAMIC_CULTURAL: "Динамическая — культурные"
