 SETTING_MUSIC_SYSTEM_TYPE_STATIC_CINEMATIC_TOOLTIP: "#T $SETTING_MUSIC_SYSTEM_TYPE_STATIC_CINEMATIC$\n#!Позволяет использовать более статическую систему подбора музыки с уклоном в кинематографические композиции."
