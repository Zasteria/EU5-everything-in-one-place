 SETTING_ICON_SCALING_QUALITY: "Качество масштабирования значков"
 SETTING_ICON_SCALING_QUALITY_TOOLTIP: "#T $SETTING_ICON_SCALING_QUALITY$#!\nОпределяет метод обработки значков интерфейса при их масштабировании.\n\n#H Низкое#! — попиксельное масштабирование. Самый быстрый способ. Обеспечивает самое чёткое изображение, но значки могут выглядеть пиксельными.\n#H Сглаженное#! — аппаратное билинейное масштабирование. На экранах с разрешением 1920×1080 значки могут выглядеть размытыми. Лучше всего подходит для разрешения 4K. Является устаревшим методом.\n#H Улучшенное#! — бикубический алгоритм Митчелла. Выглядит чётче сглаженного, при этом не видны пиксели. Рекомендуется для любых дисплеев; преимущества особенно заметны при разрешении 1920×1080. Этот метод применяется по умолчанию."
