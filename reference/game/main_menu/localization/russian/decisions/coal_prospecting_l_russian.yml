l_russian:
 prospect_for_coal.title: "Начать поиски угля"
 prospect_for_coal.desc: "Эпоха пара и железа строится на угле, и в нашей земле ещё могут скрываться залежи, которых так отчаянно жаждет промышленность. Пора использовать наш политический капитал: отправим геологов и горных инженеров обследовать угольные районы, изучить перспективные пласты, заложить разведочные шахты и открыть новую выработку там, где недра обещают богатейшую добычу. Начать поиски можно с наименее плодородных сельских земель, где передача полей под угольные разработки причинит меньше всего ущерба. Поначалу новая шахта будет небольшой, но со временем объёмы добычи в ней будут расти."
 prospect_for_coal.a: "Выделить средства на разведку."
 prospect_for_coal_effect_tt: "В #L #TOOLTIP:LOCATIONRANK,[coal_prospect_location.Custom('LR_tt')],X [coal_prospect_location.Custom('LR_PREP')|l]#!#! [coal_prospect_location.GetName] теперь производится [ShowGoodsName('coal')|l], а не [coal_prospect_location.GetRawMaterial.GetName|l]"
 prospect_for_coal.historical_info: "Крупнейшие угольные бассейны Рура, Верхней Силезии и Южного Уэльса стали основой промышленной революции. Систематические поиски угля превратили тихие сельские края в одни из самых густонаселённых промышленных регионов мира. В конце XVIII — начале XIX века геологическая разведка постепенно превратилась в самостоятельную профессиональную область: государства и предприниматели наперегонки искали топливо, от которого зависела новая эпоха машин."
