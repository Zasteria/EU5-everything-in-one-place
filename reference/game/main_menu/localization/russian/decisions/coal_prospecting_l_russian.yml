l_russian:
 prospect_for_coal.title: "Разведка угля"
 prospect_for_coal.desc: "Век пара и железа держится на угле, и наша собственная земля, быть может, ещё таит в себе то, чего так отчаянно жаждет наша промышленность. Потратим политический капитал на то, чтобы направить в наши угленосные земли отряды геологов и горных инженеров — обследовать почву, заложить пробные шахты вдоль перспективных пластов и открыть новую выработку там, где земля отдаст самый богатый урожай. Изыскатели начнут с наименее продуктивных из наших сельских угодий, где потеря невелика, если отдать поля под угольные копи, а новая разработка начнётся скромно, прежде чем разрастись и питать наши домны."
 prospect_for_coal.a: "Заказать изыскания."
 prospect_for_coal_effect_tt: "[coal_prospect_location.GetName] теперь будет производить [ShowGoodsName('coal')] вместо [coal_prospect_location.GetRawMaterial.GetName]"
 prospect_for_coal.historical_info: "Великие угольные бассейны Рура, Верхней Силезии и Южного Уэльса дали энергию промышленной революции, а систематический поиск угля превратил тихие сельские округа в одни из самых плотных промышленных регионов на земле. Геологическая разведка сложилась в самостоятельную профессиональную дисциплину в конце восемнадцатого — начале девятнадцатого века, когда государства и предприниматели наперегонки искали топливо, от которого зависел новый век машин."
