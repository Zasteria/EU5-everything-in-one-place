l_russian:
 ach_greek_populace_decision.title: "Умиротворение греческой элиты"
 ach_greek_populace_decision.desc: "[ShowScriptedGeographyName('greece_geography')] под властью #ONCLICK:COUNTRY,[GetCountry('LAT').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LAT').Custom('CL_tt')],X [GetCountry('LAT').Custom('CL_GEN')|L]#!#! переживает неспокойные времена: бывшая #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческая#!#! элита начала приходить в упадок, а кое-где в державе, наоборот, выходцы из старых греческих семейств сумели сохранить влияние, пусть даже латинские [GetEstateName('nobles_estate')|l] вынудили их пойти на определённые уступки. Однако после падения [GetCountry('LAT').Custom('longname_ru_wntt_GEN')] греческое население постепенно начало сопротивляться латинской власти.\n\nЧтобы не допустить беспорядков и прийти к согласию, монарх пригласил представителей оставшихся в державе греческих семейств на переговоры. С этим не согласны некоторые латинские [GetEstateNameWithNoTooltip('nobles_estate')|l]. Они требуют расширения своей власти над греками и заявляют, что сильная латинская элита сможет приструнить смутьянов."
 ach_greek_populace_decision.desc.entry: "Две элиты вынуждены уживаться на этих землях, и ни одна из них не пойдёт на уступки без выгоды для себя. Заручившись поддержкой #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческих#!#! родов, мы обеспечим спокойствие среди простого народа. Задобрив же латинских аристократов, мы купим преданность тех, кто уже держит мечи наготове."
 ach_greek_populace_decision.a: "Оставим всё как есть."
 ach_greek_populace_decision.b: "Встанем на сторону, которую занимают латинские [GetEstateNameWithNoTooltip('nobles_estate')|l]."
 ach_greek_populace_decision.b.entry: "Встанем на сторону, которую занимают латинские аристократы."
 ach_greek_populace_decision.c: "Постараемся договориться с греческими семействами."
 ach_pope_proposes_latin_restoration.title: "Заручиться папской поддержкой в восстановлении Латинской империи"
 ach_pope_proposes_latin_restoration.desc: "Слово «[ShowScriptedGeographyName('greece_geography')]» сегодня у многих на устах. Узнав про наши походы, Папский престол обеспокоился растущей мощью нашего государства.\n\nПоскольку мы — [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')|l] по праву, папа предложил нам денежную и политическую поддержку от имени [GetCountry('PAP').Custom('CL_GEN')] — при условии, что мы согласимся помочь в ответ: дело в том, что папа сейчас пытается примирить #TOOLTIP:RELIGION,$catholic_tt$,X #L католическую#!#! и #TOOLTIP:RELIGION,$orthodox_tt$,X #L православную#!#! церкви.\n\nПапа также призывает нас — на случай, если [ShowLocationName('constantinople')] вернётся на своё прежнее место, — помнить, какая трагедия постигла его в ходе Четвёртого крестового похода, и не допустить её повторения."
 ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')] просуществовала недолго, но наши притязания на её престол всё ещё в силе. В обмен на поддержку со стороны папы мы обязуемся создать на Востоке истинно #TOOLTIP:RELIGION,$catholic_tt$,X #L католическую#!#! империю — со столицей в #TOOLTIP:LOCATION,constantinople,X #L Константинополе#!#! и гораздо более прочную, чем прежняя."
 ach_pope_proposes_latin_restoration.a: "Согласимся на требования римского посла в обмен на поддержку."
 ach_pope_proposes_latin_restoration.b: "Папская поддержка нам ни к чему: мы возьмём Константинополь самостоятельно."
 lat_aggressive_conversion_policies_tt: "В обмен на поддержку папа может попросить нас принять строгую политику обращения в религию, если мы провозгласим [GetCountry('LAT').Custom('longname_ru_ACC')]"
 lat_frankokratia_pope_proposes_latin_restoration.title: "Запросить у папы поддержку в восстановлении Латинской империи"
 lat_frankokratia_pope_proposes_latin_restoration.desc: "Наращивая своё влияние в #TOOLTIP:SCRIPTED_GEOGRAPHY,greece_geography,X #L Греции#!#!, мы стали ключевой силой региона, и папа не мог не обратить на это внимание. Видя, как угаса[GetCountry('BYZ').Custom('end_etyut')] [GetCountry('BYZ').GetName], папа заявил, что именно нас он считает главным претендентом на возрождение [GetCountry('LAT').Custom('longname_ru_GEN')] со столицей в #TOOLTIP:LOCATION,constantinople,X #L Константинополе#!#!.\n\nЕсли мы выполним некоторые [GetCountry('PAP').GetAdjectiveWithNoTooltip|l]ие условия, то после взятия Константинополя папа дарует нам полную поддержку [GetCountry('PAP').Custom('longname_ru_wntt_GEN')] и официально признает нашего монарха законным правителем [GetCountry('LAT').Custom('longname_ru_wntt_GEN')]."
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "Агонию угасающей империи и расцвет новой Рим наблюдает с равным вниманием, но папа уже сделал свой выбор. Лишь он вправе подкрепить законность власти над возрождённым #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#! — и он подкрепит её. Нужно лишь выполнить достаточно его условий, чтобы этот дар выглядел заслуженным."
 lat_frankokratia_pope_proposes_latin_restoration.a: "Примем предложение папы и попытаемся восстановить [GetCountry('LAT').Custom('longname_ru_wntt_ACC')]."
 lat_frankokratia_pope_proposes_latin_restoration.b: "Мы не станем идти на поводу у папских устремлений."
 lat_greater_claims_of_the_latin_empire.title: "Дальнейшие притязания Латинской империи"
 lat_greater_claims_of_the_latin_empire.desc: "После падения #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! в 1204 году представители старой латинской элиты не стали терять времени даром: помимо попыток укрепить свою власть над #L [GetCountry('BYZ').GetAdjective|l]ими#! владениями — [ShowScriptedGeographyName('greece_geography')] оказалась для них лакомым куском — они также постарались утвердить господство над #TOOLTIP:REGION,balkan_region,X #L Балканами#!#!, однако [GetCountry('SER').GetName] и [GetCountry('BUL').GetName] сумели дать отпор латинянам. Желание завоевать эти державы в конце концов привело к краху первой империи, так как она оказалась неспособна противостоять постоянным набегам [GetCountry('BUL').Custom('CL_GEN')] на латинские земли.\n\nСегодня, когда Латинская империя восстановлена, мы можем наконец завоевать эти непокорные земли, отомстив за распад старой империи."
 lat_greater_claims_of_the_latin_empire.desc.entry: "Первая Латинская империя пала не из-за византийской мести, а под ударами соседей, которых так и не смогла подчинить. [ShowRegionName('balkan_region')] хорошо помнят, кто заявил права на господство в 1204 году и кто затем растоптал эти притязания. Если возрождённая империя проигнорирует давних соперников, её ждёт точно такой же финал."
 lat_greater_claims_of_the_latin_empire.a: "Постараемся расширить границы державы за счёт старых соперников."
 lat_greater_claims_of_the_latin_empire.b: "Лучше не будем повторять ошибки прошлого."
 lat_restore_the_holy_patriarchate.title: "Восстановить Священный Константинопольский патриархат"
 lat_restore_the_holy_patriarchate.desc: "Разорение #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! в 1204 году вызвало резкое осуждение у многих (в их числе и папа), однако невозможно отрицать, что без участия крестоносцев-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиков#!#! было бы невозможно восстановить патриархат, а следовательно, и укрепить #L [GetCountry('PAP').GetAdjective|l]ую#! власть. Этот титул, впрочем, опять утратил своё значение после того, как в 1261 году [GetCharacter('byz_michael_viii_palaiologos').GetName] вновь [Select_CString(GetCharacter('byz_michael_viii_palaiologos').IsFemale, 'завоевала', 'завоевал')] Константинополь.\n\nСегодня же, когда здесь вновь утвердилась латинская власть, многие [GetEstateNameWithNoTooltip('clergy_estate')|l] призывают нас восстановить патриархат."
 lat_restore_the_holy_patriarchate.desc.entry: "Благодаря патриарху, находящемуся в #TOOLTIP:LOCATION,constantinople,X #L Константинополе#!#! под нашей защитой, духовная жизнь города будет подчиняться нам, а не востоку. Наши священники помнят, что этот сан существовал и прежде, и намерены добиться его восстановления."
 lat_restore_the_holy_patriarchate.a: "Разрешим восстановить патриархат."
 lat_restore_the_holy_patriarchate.b: "Поклянёмся всеми силами защищать восстановленный патриархат."
 lat_restore_the_holy_patriarchate.c: "Постараемся усилить влияние с помощью восстановленного патриархата."
 lat_restore_the_holy_patriarchate.d: "Откажемся восстанавливать патриархат."
 latin_patriarchate_of_constantinople: "Константинопольский патриархат"
