l_russian:
 ach_greek_populace_decision.title: "Умиротворение греческой элиты"
 ach_greek_populace_decision.desc.entry: "Две элиты теперь делят эти земли в напряжённом равновесии, и ни одна не примет условий другой без чего-то взамен. Заискивание перед [ShowCultureName('greek_culture')] семьями покупает спокойствие среди населения, тогда как потакание латинской $nobles_estate$ покупает верность тех, в чьих руках уже находятся мечи."
 ach_greek_populace_decision.a: "Оставим всё как есть."
 ach_greek_populace_decision.b: "Встать на сторону латинской [GetEstateNameWithNoTooltip('nobles_estate')]."
 ach_greek_populace_decision.b.entry: "Встать на сторону латинской $nobles_estate$."
 ach_greek_populace_decision.c: "Постараемся договориться с греческими семействами."
 ach_pope_proposes_latin_restoration.title: "Заручиться поддержкой папы для восстановления Латинской империи"
 ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')] просуществовала недолго, но наши права на неё остаются в силе. В обмен на $PAP_ADJ$ поддержку мы ответим учреждением подлинной [ShowReligionAdjective('catholic')] империи на Востоке со столицей в [ShowLocationName('constantinople')], более прочной, чем прежняя."
 ach_pope_proposes_latin_restoration.a: "Согласимся на требования римского посла в обмен на поддержку."
 ach_pope_proposes_latin_restoration.b: "Нам не нужна поддержка папы, чтобы вернуть [ShowLocationNameWithNoTooltip('constantinople')]."
 lat_aggressive_conversion_policies_tt: "Папа может потребовать от нас проведения жёсткой политики обращения в веру, если мы учредим [GetCountry('LAT').GetLongName], в обмен на его поддержку"
 lat_frankokratia_pope_proposes_latin_restoration.title: "Заручиться поддержкой папы для восстановления Латинской империи"
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "Умирающая империя и восходящая держава наблюдаются одним и тем же Римом, и папа уже решил, кому из нас он отдаёт предпочтение. Легитимность на восстановленный [ShowLocationName('constantinople')] — в его власти даровать, и он дарует её, если мы примем достаточно его условий, чтобы этот дар выглядел заслуженным."
 lat_frankokratia_pope_proposes_latin_restoration.a: "Принять предложение папы о восстановлении [GetCountry('LAT').GetLongNameWithNoTooltip]."
 lat_frankokratia_pope_proposes_latin_restoration.b: "Мы не станем идти на поводу у папских устремлений."
 lat_greater_claims_of_the_latin_empire.title: "Расширенные притязания Латинской империи"
 lat_greater_claims_of_the_latin_empire.desc.entry: "Первая Латинская империя пала не от $BYZ_ADJ$ мести, а от соседей, которых так и не удалось до конца покорить. [ShowRegionName('balkan_region')] помнит, кто заявил о верховной власти в 1204 году и кто впоследствии нарушил это притязание, а восстановленная империя, игнорирующая тех же соперников, рискует прийти к тому же концу."
 lat_greater_claims_of_the_latin_empire.a: "Постараемся расширить границы державы за счёт старых соперников."
 lat_greater_claims_of_the_latin_empire.b: "Лучше не будем повторять ошибки прошлого."
 lat_restore_the_holy_patriarchate.title: "Восстановить Святейший патриархат [ShowLocationNameWithNoTooltip('constantinople')]"
 lat_restore_the_holy_patriarchate.desc.entry: "Патриарх, восседающий в [ShowLocationName('constantinople')] под нашей защитой, сделал бы веру этого города подотчётной нам, а не востоку. Наше $clergy_estate$ не забыли, что этот титул некогда существовал, и намерено вновь его учредить."
 lat_restore_the_holy_patriarchate.a: "Разрешим восстановить патриархат."
 lat_restore_the_holy_patriarchate.b: "Поклянёмся всеми силами защищать восстановленный патриархат."
 lat_restore_the_holy_patriarchate.c: "Постараемся усилить влияние с помощью восстановленного патриархата."
 lat_restore_the_holy_patriarchate.d: "Откажемся восстанавливать патриархат."
 latin_patriarchate_of_constantinople: "Константинопольский патриархат"
 ach_greek_populace_decision.desc: "Although [GetCountry('LAT').GetAdjective] rule over [ShowScriptedGeographyName('greece_geography')] has seen a decline of the former [ShowCultureName('greek_culture')] elite, in some areas of the country, members of older [ShowCultureNameWithNoTooltip('greek_culture')] families have maintained a grip on power by compromising with the Latin [GetEstateName('nobles_estate')]. However, since the fall of the [GetCountry('LAT').GetLongNameWithNoTooltip], members of the [ShowCultureNameWithNoTooltip('greek_culture')] populace have grown more resistant to Latin rule.\n\nSeeking a more stable reign, the monarch has invited members of remaining [ShowCultureNameWithNoTooltip('greek_culture')] families in the country to the court to work out a compromise. However, some Latin [GetEstateNameWithNoTooltip('nobles_estate')] have instead pushed for further expansion of their rights over the [ShowCultureNameWithNoTooltip('greek_culture')] populace, arguing that a stronger Latin elite would clamp down on [ShowCultureNameWithNoTooltip('greek_culture')] unrest."
 ach_pope_proposes_latin_restoration.desc: "Having taken notice of our campaigns in [ShowScriptedGeographyName('greece_geography')], our growing strength has attracted the attention of the Papacy.\n\nRecognizing our claim of [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')], the Pope has offered the financial and political backing of [GetCountry('PAP').GetNameWithNoTooltip] should we agree to aid the Pope's efforts to mend relations between the [ShowReligionAdjective('catholic')] and [ShowReligionAdjective('orthodox')] Churches.\n\nThe Pope has also urged that should [ShowLocationName('constantinople')] be reclaimed, the tragedy the Fourth Crusade brought upon the [ShowLocationNameWithNoTooltip('constantinople')] must not be repeated."
 lat_frankokratia_pope_proposes_latin_restoration.desc: "The growing influence of our country in [ShowScriptedGeographyName('greece_geography')] has led to us becoming a prominent power in the region, to which the Pope has taken notice of the rising power. With the decaying influence of [GetCountry('BYZ').GetName], the Pope now sees us as the foremost contender to which the [GetCountry('LAT').GetLongName] can be restored in [ShowLocationName('constantinople')].\n\nShould we agree to some of the [GetCountry('PAP').GetAdjectiveWithNoTooltip] requests and should [ShowLocationNameWithNoTooltip('constantinople')] be reclaimed, the Pope will offer the full backing of the [GetCountry('PAP').GetLongNameWithNoTooltip] and recognize our monarch as the legitimate ruler of the [GetCountry('LAT').GetLongNameWithNoTooltip]."
 lat_greater_claims_of_the_latin_empire.desc: "After the fall of [ShowLocationName('constantinople')] in 1204, the old Latin elite moved quickly to consolidate control over [GetCountry('BYZ').GetAdjective] holdings throughout [ShowScriptedGeographyName('greece_geography')], as well as to claim overlordship of the [ShowRegionName('balkan_region')]. However, at the time, [GetCountry('SER').GetName] and [GetCountry('BUL').GetName] proved to be major rivals to the Latins, with [GetCountry('BUL').GetNameWithNoTooltip] ultimately playing a major role in the collapse of the original empire with their constant military campaigns into Latin lands.\n\nNow with the Latin empire restored, we may be able to claim dominion of these lands, and accomplish what the old empire could not."
 lat_restore_the_holy_patriarchate.desc: "While the initial sack of [ShowLocationName('constantinople')] in 1204 saw opposition from the Pope, the opportunity of [ShowLocationNameWithNoTooltip('constantinople')] being seized by [ShowReligionAdjective('catholic')] crusaders allowed for the opportunity for the Patriarchate to be restored, elevating [GetCountry('PAP').GetAdjective] authority. However, the retaking of [ShowLocationNameWithNoTooltip('constantinople')] in 1261 by [GetCharacter('byz_michael_viii_palaiologos').GetName] saw the title become defunct once again.\n\nNow with Latin rule once again restored over [ShowLocationNameWithNoTooltip('constantinople')], many within the [GetEstateNameWithNoTooltip('clergy_estate')] have urged us to restore the Patriarchate."
