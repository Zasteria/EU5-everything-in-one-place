l_russian:
 ach_greek_populace_decision.title: "Умиротворение греческой элиты"
 ach_greek_populace_decision.desc: "Хотя владычество [GetCountry('LAT').GetAdjective] над [ShowScriptedGeographyName('greece_geography')] привело к упадку прежней [ShowCultureName('greek_culture')] элиты, в некоторых областях страны представители старых [ShowCultureNameWithNoTooltip('greek_culture')] родов сохранили власть, идя на уступки латинскому [GetEstateName('nobles_estate')]. Однако после падения [GetCountry('LAT').GetLongNameWithNoTooltip] представители [ShowCultureNameWithNoTooltip('greek_culture')] населения стали более непокорны латинскому правлению.\n\nСтремясь к более устойчивому правлению, монарх пригласил при дворе представителей оставшихся [ShowCultureNameWithNoTooltip('greek_culture')] родов страны для выработки компромисса. Однако некоторые латинские [GetEstateNameWithNoTooltip('nobles_estate')] вместо этого настаивают на дальнейшем расширении своих прав над [ShowCultureNameWithNoTooltip('greek_culture')] населением, утверждая, что более сильная латинская элита сумеет подавить [ShowCultureNameWithNoTooltip('greek_culture')] беспорядки."
 ach_greek_populace_decision.desc.entry: "Две элиты теперь делят эти земли в напряжённом равновесии, и ни одна не примет условий другой без чего-то взамен. Заискивание перед [ShowCultureName('greek_culture')] семьями покупает спокойствие среди населения, тогда как потакание латинской $nobles_estate$ покупает верность тех, в чьих руках уже находятся мечи."
 ach_greek_populace_decision.a: "Оставим всё как есть."
 ach_greek_populace_decision.b: "Встать на сторону латинской [GetEstateNameWithNoTooltip('nobles_estate')]."
 ach_greek_populace_decision.b.entry: "Встать на сторону латинской $nobles_estate$."
 ach_greek_populace_decision.c: "Постараемся договориться с греческими семействами."
 ach_pope_proposes_latin_restoration.title: "Заручиться поддержкой папы для восстановления Латинской империи"
 ach_pope_proposes_latin_restoration.desc: "Заметив наши походы в [ShowScriptedGeographyName('greece_geography')], папство обратило внимание на нашу растущую мощь.\n\nПризнавая наши претензии на [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')], папа предложил финансовую и политическую поддержку [GetCountry('PAP').GetNameWithNoTooltip], если мы согласимся помочь ему в его стремлении примирить [ShowReligionAdjective('catholic')] и [ShowReligionAdjective('orthodox')] церкви.\n\nПапа также настаивает на том, что если [ShowLocationName('constantinople')] будет возвращён, трагедия, которую Четвёртый крестовый поход обрушил на [ShowLocationNameWithNoTooltip('constantinople')], не должна повториться."
 ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')] просуществовала недолго, но наши права на неё остаются в силе. В обмен на $PAP_ADJ$ поддержку мы ответим учреждением подлинной [ShowReligionAdjective('catholic')] империи на Востоке со столицей в [ShowLocationName('constantinople')], более прочной, чем прежняя."
 ach_pope_proposes_latin_restoration.a: "Согласимся на требования римского посла в обмен на поддержку."
 ach_pope_proposes_latin_restoration.b: "Нам не нужна поддержка папы, чтобы вернуть [ShowLocationNameWithNoTooltip('constantinople')]."
 lat_aggressive_conversion_policies_tt: "Папа может потребовать от нас проведения жёсткой политики обращения в веру, если мы учредим [GetCountry('LAT').GetLongName], в обмен на его поддержку"
 lat_frankokratia_pope_proposes_latin_restoration.title: "Заручиться поддержкой папы для восстановления Латинской империи"
 lat_frankokratia_pope_proposes_latin_restoration.desc: "Растущее влияние нашей страны в [ShowScriptedGeographyName('greece_geography')] сделало нас заметной силой в регионе, и Папа обратил внимание на этот рост могущества. Ввиду угасающего влияния [GetCountry('BYZ').GetName] Папа теперь видит в нас главного претендента на восстановление [GetCountry('LAT').GetLongName] в [ShowLocationName('constantinople')].\n\nЕсли мы согласимся на некоторые из [GetCountry('PAP').GetAdjectiveWithNoTooltip] требований и если [ShowLocationNameWithNoTooltip('constantinople')] будет отвоёван, Папа предложит полную поддержку [GetCountry('PAP').GetLongNameWithNoTooltip] и признает нашего монарха законным правителем [GetCountry('LAT').GetLongNameWithNoTooltip]."
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "Умирающая империя и восходящая держава наблюдаются одним и тем же Римом, и папа уже решил, кому из нас он отдаёт предпочтение. Легитимность на восстановленный [ShowLocationName('constantinople')] — в его власти даровать, и он дарует её, если мы примем достаточно его условий, чтобы этот дар выглядел заслуженным."
 lat_frankokratia_pope_proposes_latin_restoration.a: "Принять предложение папы о восстановлении [GetCountry('LAT').GetLongNameWithNoTooltip]."
 lat_frankokratia_pope_proposes_latin_restoration.b: "Мы не станем идти на поводу у папских устремлений."
 lat_greater_claims_of_the_latin_empire.title: "Расширенные притязания Латинской империи"
 lat_greater_claims_of_the_latin_empire.desc: "После падения [ShowLocationName('constantinople')] в 1204 году старая латинская знать поспешила закрепить контроль над [GetCountry('BYZ').GetAdjective] владениями по всей [ShowScriptedGeographyName('greece_geography')], а также заявить о верховной власти над [ShowRegionName('balkan_region')]. Однако в те времена [GetCountry('SER').GetName] и [GetCountry('BUL').GetName] оказались серьёзными соперниками латинян, причём [GetCountry('BUL').GetNameWithNoTooltip] в конечном счёте сыграл главную роль в крушении первоначальной империи своими непрестанными военными походами в латинские земли.\n\nТеперь, когда Латинская империя восстановлена, мы, возможно, сумеем заявить права на эти земли и добиться того, чего не смогла добиться прежняя империя."
 lat_greater_claims_of_the_latin_empire.desc.entry: "Первая Латинская империя пала не от $BYZ_ADJ$ мести, а от соседей, которых так и не удалось до конца покорить. [ShowRegionName('balkan_region')] помнит, кто заявил о верховной власти в 1204 году и кто впоследствии нарушил это притязание, а восстановленная империя, игнорирующая тех же соперников, рискует прийти к тому же концу."
 lat_greater_claims_of_the_latin_empire.a: "Постараемся расширить границы державы за счёт старых соперников."
 lat_greater_claims_of_the_latin_empire.b: "Лучше не будем повторять ошибки прошлого."
 lat_restore_the_holy_patriarchate.title: "Восстановить Святейший патриархат [ShowLocationNameWithNoTooltip('constantinople')]"
 lat_restore_the_holy_patriarchate.desc: "В то время как первое разграбление [ShowLocationName('constantinople')] в 1204 году встретило противодействие Папы, захват [ShowLocationNameWithNoTooltip('constantinople')] [ShowReligionAdjective('catholic')] крестоносцами дал возможность восстановить патриархат, что возвысило [GetCountry('PAP').GetAdjective] власть. Однако возвращение [ShowLocationNameWithNoTooltip('constantinople')] в 1261 году под предводительством [GetCharacter('byz_michael_viii_palaiologos').GetName] вновь привело к упразднению этого титула.\n\nТеперь, когда латинское правление снова установлено над [ShowLocationNameWithNoTooltip('constantinople')], многие в [GetEstateNameWithNoTooltip('clergy_estate')] призывают нас восстановить патриархат."
 lat_restore_the_holy_patriarchate.desc.entry: "Патриарх, восседающий в [ShowLocationName('constantinople')] под нашей защитой, сделал бы веру этого города подотчётной нам, а не востоку. Наше $clergy_estate$ не забыли, что этот титул некогда существовал, и намерено вновь его учредить."
 lat_restore_the_holy_patriarchate.a: "Разрешим восстановить патриархат."
 lat_restore_the_holy_patriarchate.b: "Поклянёмся всеми силами защищать восстановленный патриархат."
 lat_restore_the_holy_patriarchate.c: "Постараемся усилить влияние с помощью восстановленного патриархата."
 lat_restore_the_holy_patriarchate.d: "Откажемся восстанавливать патриархат."
 latin_patriarchate_of_constantinople: "Константинопольский патриархат"
