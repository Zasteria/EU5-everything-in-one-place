l_russian:
 tur_enderun_academy_decision.title: "Школа Эндерун"
 tur_enderun_academy_decision.desc: "Наша держава постоянно растёт и развивается, и ей необходимы умелые руководители и генералы. Чтобы обеспечить их подготовку, мы можем учредить специальную школу, которая будет действовать при нашем дворе. Это не только позволит нам полностью контролировать образовательный процесс, но и обеспечит связь будущих специалистов с правящей династией [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName], а значит — укрепит её влияние во всех сферах государственного управления.\n\nПри этом возможность обучаться в этой школе должна быть не только у знати, но и у всех одарённых молодых людей вне зависимости от происхождения."
 tur_enderun_academy_decision.desc.entry: "Слуга, воспитанный во дворце, обязан своим положением династии, а не имени своего отца. Школа, находящаяся под управлением внутреннего двора, дала бы нам чиновников и военачальников, чья карьера начинается и заканчивается по нашей воле, и нет причин оставлять её скамьи только для благородных."
 tur_enderun_academy_decision.a: "За этим будущее!"
 tur_enderun_academy_decision.historical_info: "Во дворе дворца Топкапы султан Мехмед II учредил школу, где проходили подготовку самые способные юноши из числа христианских невольников, отобранных по системе девширме. Здесь они изучали исламскую веру, науки, военное дело и иностранные языки. В XV–XVI вв. система наследственного правления в Османской империи держалась преимущественно на чиновниках из числа прошедших учёбу в Эндеруне, а потому верно преданных султану."
 tur_expanded_timariot_decision.title: "Расширение тимариотской системы"
 tur_expanded_timariot_decision.desc: "Для расширения тимарной системы нам необходимы средства, и советники предлагают использовать для этих целей доходы от вакфов — благотворительных учреждений, которые помогают больным и неимущим. Это позволит нам значительно укрепить нашу армию и одновременно уменьшить влияние, которым обладают [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Однако стоит учитывать, что наиболее набожные жители нашей державы могут быть недовольны такой политикой."
 tur_expanded_timariot_decision.desc.entry: "Земля, дарованная за кавалерийскую службу, окупает себя; благотворительные вакфы не окупают ровным счётом ничего, что можно вывести в поход. Перенаправление вакуфных средств дало бы нам больше всадников и одновременно урезало бы влияние $clergy_estate$, хотя благочестивые люди наверняка заметят, куда пошли деньги."
 tur_expanded_timariot_decision.a: "Государству пригодятся эти деньги."
 tur_expanded_timariot_decision.b: "Вакф неприкосновенен!"
 tur_expanded_timariot_decision.historical_info: "Мехмед II стремился любыми способами укрепить личную власть над Османской империей. Ближе к последним годам своего правления он попытался лишить улемов влияния, перенаправив доход от поддерживавших их #italic вакфов#! в пользу тимарной системы, укрепив тем самым османскую армию. Такое решение не все приняли с одинаковым восторгом…"
 tur_enderun_service_decision.title: "Внутренняя служба"
 tur_enderun_service_decision.desc: "Талантливые рабы-евнухи уже давно играют определённую роль в нашем правительстве. Эти кастраты, потерявшие амбиции к продолжению рода и мирской власти, способны принести нам большую пользу. При дворе сейчас живут несколько одарённых мальчиков-невольников. Мы могли бы упрочить их связи с династией [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName], раздав им должности в нашем доме, за которые прежде соперничали лизоблюды-[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]."
 tur_enderun_service_decision.desc.entry: "Человек, не способный основать собственную династию, имеет мало причин создавать её за наш счёт. Официальные придворные должности для дворцовых евнухов позволили бы возвысить самых способных из них над $nobles_estate$, которые уже давно считают такие посты своим наследственным правом."
 tur_enderun_service_decision.a: "Двор давно пора реформировать."
 tur_enderun_service_decision.b: "Нет, надо и дальше полагаться на аристократов."
 tur_enderun_service_decision.b.entry: "No, we must continue to rely on the $nobles_estate$."
 tur_enderun_service_decision.historical_info: "#italic Эндерун#! (от персидского слова, означающего #italic «внутри»#!) — это группа придворных, входивших в ближний круг султана. Также в Османской империи существовала «внешняя служба», или #italic Бирун#!, которая отвечала за работу государственного механизма. В основном в Эндерун входили евнухи и юные рабы-христиане. Преимущественно они занимались обслуживанием и обучением императорской семьи, но со временем некоторые из них приобрели значительный политический вес."
 tur_imperial_harem_decision.title: "Устройство гарема"
 tur_imperial_harem_decision.desc: "С давних времен двор династии [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] разделён между разными дворцами и должностями. Если мы действительно стремимся к величию, надо сосредоточить нашу власть и присутствие в городе [capital_location.GetName]. Для этого потребуется перевезти туда всех наложниц султана и поселить их в роскошном жилище.\n\nРазумеется, знати такой шаг покажется откровенной агрессией, ведь мы лишим аристократов их давней личной привилегии — прямого доступа к султану."
 tur_imperial_harem_decision.desc.entry: "Власть следует за тем, кто стоит ближе всего к правителю, а сейчас это тот, кому случайно принадлежит самый близкий дворец. Собрав двор в одной охраняемой резиденции в столице, мы решили бы этот вопрос навсегда, и именно поэтому $nobles_estate$ будет этим недовольна."
 tur_imperial_harem_decision.a: "Создадим султанский гарем."
 tur_imperial_harem_decision.b: "Мы вполне довольны нашим двором."
 tur_imperial_harem_decision.historical_info: "В XVI веке правящая османская семья обосновалась в константинопольском дворце Топкапы, и многие её члены, особенно женщины, проводили там всю свою жизнь. Это привело к превращению гарема в эффективный иерархический институт. Так как османские монархи теперь жили в уединении, доступ к ним стал большой привилегией, что только укрепляло их власть."
 tur_eunuch_viziers_decision.title: "Учреждение должности кызляр-агасы"
 tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName] — талантливый евнух и один из стражей [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого гарема. Несколько группировок при дворе хотят, чтобы для него создали новую должность #italic кызляра-аги#!, стража девушек. На этой должности он будет надзирать за личными покоями правителя и служить посредником между гаремом и верховным советом. Также он возвысится над старым белым евнухом, #italic капы-агой#!, отвечающим за мальчиков-прислужников при дворе. Этот человек никогда не отличался особой надёжностью."
 tur_eunuch_viziers_decision.desc.entry: "Тот, кто контролирует доступ в личные покои правителя, контролирует куда больше, чем просто дверь. $name_muhammad.turkish_language$ достаточно проницателен для такой должности, и его возвышение до #italic кызляр-агасы#! также решило бы давний вопрос о верности главного белого евнуха."
 tur_eunuch_viziers_decision.a: "Мы повысим Кызляра-агасы."
 tur_eunuch_viziers_decision.b: "Капы-агасы больше достоин повышения."
 tur_eunuch_viziers_decision.c: "У этих евнухов и так достаточно власти."
 valide_sultan_objects.tt: "Валиде-султан это не понравится."
 mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip] покидает двор."
 tur_eunuch_viziers_decision.historical_info: "Количество евнухов при османском дворе постоянно росло. В 1574 году для Мехмеда-аги был создан пост кызляра-аги, дававший евнухам беспрецедентную власть. Африканские евнухи считались более надежными, поскольку их родина была далеко, и со временем они стали влиятельнее белых евнухов. Отчасти благодаря прочным связям кызляра-аги с могущественными валиде-султан (матерями правящих султанов) этот пост стал равнозначен визирю первого ранга — выше были только великий визирь и $common_string_shaikh_al_islam$."
 tur_sekban_system_decision.title: "Упразднить [ShowAdvanceNameWithNoTooltip('timariots')]"
 tur_sekban_system_decision.desc: "Система тимариотов, исправно служившая нам, столкнулась с критическими проблемами. Земли, раздаваемые нами всадникам, становятся всё более разделенными и бедными, а самим всадникам всё тяжелее биться с врагами, вооружившимися мушкетами. Перестав раздавать наделы, мы могли бы, по мере того, как стареют и умирают их владельцы, сдавать их в аренду, что поможет пополнить казну государства. Также не помешало бы модернизировать армию, сделав упор на пехоту с огнестрельным оружием."
 tur_sekban_system_decision.a: "Всё течёт, всё меняется."
 tur_sekban_system_decision.b: "Кавалерия — наша главная опора."
 timars_unavailable.tt: "[Concept('reforms', 'Принципы')|e] «Тимар» навсегда станут недоступными."
 tur_sekban_system_decision.historical_info: "Система предоставления сипахам — воинам тяжёлой кавалерии, — земельных наделов, или тимаров, со временем утратила актуальность. Великие османские завоевания остались в прошлом, и участков стало попросту не хватать. Кроме того, представители других родов войск — в особенности янычары — тоже начали претендовать на эту привилегию. Осознав, что дальше так продолжаться не может, османские власти упразднили устаревшую систему и стали больше опираться на набор секбанов — солдат крестьянского происхождения."
 tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
 tur_kanum_i_osmani_decision.desc: "С ростом [ROOT.GetCountry.Custom('rank_ru_GEN')|l] в наших владениях оказалось множество самых разных народов. Многие из них уже приняли старые #L [ROOT.GetCountry.GetAdjective|l]ие#! законы и стали частью нашей нашей нации, но [target_character.GetName] полагает, что этого недостаточно. [Select_CString(target_character.IsFemale, 'Она', 'Он' )] хочет полностью переписать законодательство [ROOT.GetCountry.Custom('CL_GEN')], отдавая предпочтение не внешней экспансии, а укреплению внутренней стабильности."
 tur_kanum_i_osmani_decision.desc.entry: "Законы, написанные для пограничного княжества, не годятся для управления империей множества народов. Единый свод законов, изданный от нашего имени и обязательный для всех, обеспечил бы тот внутренний порядок, которого не даст дальнейшее завоевание, а завоевали мы уже достаточно для одной эпохи."
 tur_kanum_i_osmani_decision.a: "Эти законы приведут нас в новую эпоху."
 tur_kanum_i_osmani_decision.b: "Мы примем эти реформы к сведению."
 tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "[Concept('modifiers', 'Модификаторы')|e] [Concept('policy', 'политики')|e] [ShowPolicyName('tur_kanum_i_osmani')] станут эффективнее на #Y 50%#!, но будут масштабироваться в зависимости от [Concept('estate_power', 'сословной власти')|e] сословия «[GetEstateName('crown_estate')]»"
 tur_autonomous_kadiluks_decision.title: "Расширить полномочия кади"
 tur_autonomous_kadiluks_decision.desc: "#italic Кади#!, #TOOLTIP:RELIGIONGROUP,muslim,X #L исламские#!#! судьи по всем вопросам, давно являются одним из столпов, на котором держится государство, и многие учёные мечтают о такой должности. Развитие системы управления и налогового откупа привело к тому, что кади желают добиться большей автономии в своих земельных наделах — #italic кадылуках#!. Они утверждают, что такая автономия укрепит наше право властвовать над всеми мусульманами и повысит их взаимное доверие с Блистательной Портой."
 tur_autonomous_kadiluks_decision.a: "Они заслужили наше доверие."
 tur_autonomous_kadiluks_decision.b: "У них и так достаточно власти."
 has_enabled_kadiluks_privilege: "Включил эту [estate_privilege|e] с помощью [decision|e] «$tur_autonomous_kadiluks_decision.title$»"
 tur_autonomous_kadiluks_decision.historical_info: "На протяжении XVII века власть султана в Османской империи постепенно ослабевала, в то время как янычары и кади, напротив, становились всё могущественнее. Кади получали в своё распоряжение так называемые кадылыки, на территории которых они самостоятельно контролировали воинскую повинность и налогообложение. Благодаря этому они обладали значительным влиянием — особенно в отдалённых провинциях, где центральная власть была не так сильна. Авторитет кади возрос ещё больше после Эдирнского инцидента 1703 года, во время которого был свергнут султан Мустафа II."
 tur_malikane_decision.title: "The $ottoman_tax_farming$ Reform"
 tur_malikane_decision.desc: "Желая поправить денежные дела государства, [grand_vizier.GetName] подготовил новую систему налогового откупа под названием #italic маликяне#!. Деревня или район будут отданы тому, кто больше заплатит, после чего победитель аукциона получит пожизненное право взимать налог с этих земель. Великий визирь утверждает, что новая система улучшит финансовую ситуацию — пожизненный откупщик будет заинтересован в том, чтобы развивать благосостояние своих земель, а не выжимать их досуха до окончания контракта. Также сократятся расходы на бюрократическое оформление однолетних контрактов, обычных для прежних времён. С другой стороны, эти краткосрочные контракты были довольно прибыльными."
 tur_malikane_decision.desc.entry: "Сборщик налогов, держащий деревню один год, обирает её до нитки; сборщик налогов, держащий её всю жизнь, заботится о ней. #italic Маликяне#! продаёт это пожизненное право тому, кто больше заплатит, обменивая щедрые ежегодные аукционы прошлого на округа, которые останутся выгодными для налогообложения и десять лет спустя."
 tur_malikane_decision.a: "Мы проведём реформу."
 tur_malikane_decision.b: "Мы оставим старую систему налогообложения."
 malikane_available.tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('ottoman_malikane_tax_reform')]»."
 tur_malikane_decision.historical_info: "Систему маликане ввёл в 1695 году незадачливый великий визирь Эльмас Мехмед-паша. Вероятно, он искренне стремился увеличить доходы государства в долгосрочной перспективе, но результат получился неоднозначным. Система маликане встретила яростное противодействие со стороны откупщиков, которых устраивали старые порядки, а власти оказались не в состоянии уследить за пожизненными наделами. Вскоре страна понесла большие военные потери, и реформа никак не помогла в выплате жалованья солдатам. Эльмас Мехмед-паша был убит собственными приближёнными в 1697 году, а в 1703 году янычары, недовольные задержками в выплатах, свергли Мустафу II."
 tur_coffee_house_espionage_decision.title: "Внедрение в кофейни"
 tur_coffee_house_espionage_decision.desc: "В кофейнях, где собираются [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], нередко звучат крамольные речи, а порой даже обсуждаются мятежи, особенно с участием янычар. Разумеется, оживленные беседы за чашечкой кофе со сладостями полезны для торговли и общественной жизни, но нам не помешает расширить шпионскую сеть, чтобы ни один тайный разговор не укрылся от наших ушей."
 tur_coffee_house_espionage_decision.desc.entry: "За чашкой кофе люди говорят куда откровеннее, чем на допросе, а в кофейнях, где собираются $burghers_estate$, полно разговоров, которые $janissaries_advance$ предпочли бы, чтобы мы никогда не услышали. Закрыв их, мы потеряли бы и торговлю, и сплетни, тогда как, заполнив их нашими собственными слушателями, мы не потеряем ни того, ни другого."
 tur_coffee_house_espionage_decision.a: "Информация — это власть."
 tur_coffee_house_espionage_decision.b: "Надо прижать кофейни к ногтю."
 tur_coffee_house_espionage_decision.c: "Кофе должен литься свободно."
 coffee_house_espionage_available.tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('ottoman_coffee_house_espionage')]»."
 tur_coffee_house_espionage_decision.historical_info: "Кофейни в Османской империи служили местом встречи для людей самых разных профессий, народностей и вероисповеданий. Турецкие ремесленники могли сидеть за одним столом с русскими бродягами и венецианскими купцами. Там велись беседы, обсуждалось искусство, новые идеи — и восстания. Янычарские кофейни поддерживали работу тайных сетей убийц и сборщиков информации. Правительство активно внедряло в кофейни и другие подобные общественные заведения своих шпионов, чтобы быть в курсе народных настроений и знать, если где-то затевается преступление или бунт."
 tur_new_order_army_decision.title: "Армия нового порядка"
 tur_new_order_army_decision.desc: "Размышляя о силе наших врагов, опасностях меняющегося мира и угрозе мятежа со стороны непокорных и дерзких янычар, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'придумала', 'придумал' )] новый план. [Select_CString(target_ruler.IsFemale, 'Она решила', 'Он решил' )] привлечь инструкторов из #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, чтобы реформировать армию, превратив её в грозную и современную силу с новой формой, подготовкой и традициями. Но этот шаг может вызвать гнев янычар, башибузуков, секбанов и всех остальных, кому выгодно текущее положение дел."
 tur_new_order_army_decision.desc.entry: "Препятствие для создания современной армии — не деньги и не иностранные наставники, а та армия, что у нас уже есть. Создать дисциплинированное войско рядом с $janissaries_advance$ означает вооружить тех самых людей, которым однажды прикажут распустить их же, а $bashi_bazouks$ и $sekban_system$ способны разгадать это намерение не хуже нас."
 tur_new_order_army_decision.a: "Нам нужны эти перемены."
 tur_new_order_army_decision.b: "Старые обычаи вполне эффективны."
 new_order_army_available.tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('ottoman_new_order_army')]»."
 tur_new_order_army: "Доступен государственный принцип «[ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]»"
 tur_new_order_army_decision.historical_info: "Низам-и Джедид, #italic Армия нового порядка#!, была основана в 1797 году и стала ключевым элементом программы реформ Селима III. Султан надеялся обратить вспять процесс децентрализации империи и ослабить прочное влияние янычар, постепенно заменяя их современной пехотой по европейской модели."
 mehmed_agha_tt: "Способный [character|e] присоединится к нашему двору и получит [ShowModifier('kizlar_agha_modifier')] [modifier|e]"
