l_russian:
 build_suez_canal.title: "Построить Суэцкий канал"
 build_suez_canal.desc: "Наши инженеры докладывают, что при нынешнем уровне технологий мы уже можем вырыть канал через Суэцкий перешеек. Проект будет грандиозным и потребует огромных затрат, однако в награду мы получим контроль над всей торговлей Востока."
 build_suez_canal.a: "Приступить к строительству канала."
 build_suez_canal.b: "Пока не время."
 build_panama_canal.title: "Построить Панамский канал"
 build_panama_canal.desc: "Наши инженеры обследовали узкий перешеек в Новом Свете и пришли к выводу, что два великих океана возможно соединить каналом. Расходы будут колоссальными, но выгода от этого будет просто неисчислимой."
 build_panama_canal.a: "Приступить к строительству канала."
 build_panama_canal.b: "Пока не время."
