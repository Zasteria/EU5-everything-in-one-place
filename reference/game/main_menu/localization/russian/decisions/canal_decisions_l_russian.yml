l_russian:
 build_suez_canal.title: "Construct the Suez Canal"
 build_suez_canal.desc: "Наши инженеры докладывают, что прокладка канала через Суэцкий перешеек нам вполне по силам. Проект будет колоссальным, но и награда — господство над всей восточной торговлей — не менее велика."
 build_suez_canal.a: "Начать строительство канала."
 build_suez_canal.b: "Not at this time."
 build_panama_canal.title: "Construct the Panama Canal"
 build_panama_canal.desc: "Наши инженеры обследовали узкий перешеек Нового Света. Канал, соединяющий два великих океана, вполне осуществим. Затраты будут огромны, а выгода — неисчислима."
 build_panama_canal.a: "Начать строительство канала."
 build_panama_canal.b: "Not at this time."
