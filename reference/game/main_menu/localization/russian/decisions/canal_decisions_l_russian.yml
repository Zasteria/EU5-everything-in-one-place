l_russian:
 build_suez_canal.title: "Построить Суэцкий канал"
 build_suez_canal.desc: "Наши инженеры докладывают, что при нынешнем уровне технологий мы уже можем вырыть канал через Суэцкий перешеек. Проект будет грандиозным и потребует огромных затрат, однако в награду мы получим контроль над всей торговлей Востока."
 build_suez_canal.a: "Приступить к строительству канала."
 build_suez_canal.b: "Пока не время."
 build_panama_canal.title: "Построить Панамский канал"
 build_panama_canal.desc: "Наши инженеры обследовали узкий перешеек в Новом Свете и пришли к выводу, что два великих океана возможно соединить каналом. Расходы будут колоссальными, но выгода от этого будет просто неисчислимой."
 build_panama_canal.a: "Приступить к строительству канала."
 build_panama_canal.b: "Пока не время."
 close_suez_canal_to_enemies.title: "Закрыть Суэцкий канал для несоюзников"
 close_suez_canal_to_enemies.desc: "Ограничить проход через Суэцкий канал только для наших союзников и подданных на время войны. Враги исключаются автоматически; это также исключает нейтралов и соперников."
 close_suez_canal_to_enemies.a: "Закрыть проход для всех, кроме наших союзников."
 close_suez_canal_to_enemies.b: "Пока не время."
 open_suez_canal_to_all.title: "Открыть Суэцкий канал для всех"
 open_suez_canal_to_all.desc: "Снять ограничения на Суэцкий канал и вновь открыть проход для всех стран, с которыми мы не находимся в состоянии войны."
 open_suez_canal_to_all.a: "Снять ограничения."
 open_suez_canal_to_all.b: "Пока не время."
 close_panama_canal_to_enemies.title: "Закрыть Панамский канал для несоюзников"
 close_panama_canal_to_enemies.desc: "Ограничить проход через Панамский канал только для наших союзников и подданных на время войны. Враги исключаются автоматически; это также исключает нейтралов и соперников."
 close_panama_canal_to_enemies.a: "Закрыть проход для всех, кроме наших союзников."
 close_panama_canal_to_enemies.b: "Пока не время."
 open_panama_canal_to_all.title: "Открыть Панамский канал для всех"
 open_panama_canal_to_all.desc: "Снять ограничения на Панамский канал и вновь открыть проход для всех стран, с которыми мы не находимся в состоянии войны."
 open_panama_canal_to_all.a: "Снять ограничения."
 open_panama_canal_to_all.b: "Пока не время."
