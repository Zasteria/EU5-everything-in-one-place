l_russian:
 sponsor_a_cathedral_decision.title: "Профинансировать собор"
 sponsor_a_cathedral_decision.desc: "В нашей державе по-прежнему не хватает достойных мест для служения Богу. Чтобы удовлетворить потребности верующих, нам следует профинансировать строительство #TOOLTIP:BUILDING_TYPE,cathedral,X #L кафедрального собора#!#!."
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_cooldown_tt: "Это [Concept('decision', 'решение')|e] не выбиралось при нынешнем правителе"
 sponsor_a_cathedral_cost_estimate_tt: "[ShowBuildingTypeName('cathedral')] будет иметь базовую цену 400@gold!. Эта сумма будет снижена за счёт $royal_sponsorship$ и зависит от [location|e], в котором ведётся строительство."
 sponsor_a_great_madrasa_decision.title: "Профинансировать большое медресе"
 sponsor_a_great_madrasa_decision.desc: "Хотя в нашей стране немало сооружений, посвящённых Богу, нашим великим богословам уже недостаточно обычных #TOOLTIP:BUILDING_TYPE,madrasa,X #L медресе#!#! и #TOOLTIP:BUILDING_TYPE,temple,X #L храмов#!#!. Чтобы обеспечить этих мудрецов достойным местом для распространения знаний, нам следует профинансировать строительство #TOOLTIP:BUILDING_TYPE,great_madrasa,X #L большого медресе#!#!."
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 sponsor_a_great_madrasa_cost_estimate_tt: "[ShowBuildingTypeName('great_madrasa')] будет иметь базовую цену [ShowNamedValue('expensive_build_price_age_of_tradition')|0]@gold!. Эта сумма будет снижена за счёт $royal_sponsorship$ и зависит от [location|e], в котором ведётся строительство."
 construct_a_grand_palace_decision.title: "Заказать новый дворец"
 construct_a_grand_palace_decision.desc: "Нашей королевской семье и двору не хватает дома, подобающего их величию. Пора нанять #TOOLTIP:ARTIST,architect,X #L архитектора#!#! для строительства нового #TOOLTIP:BUILDING_TYPE,grand_palace,X #L большого дворца#!#!."
 construct_a_grand_palace_decision.a: "Это будет достойная резиденция."
 construct_a_grand_palace_decision.a_tt: "Нанятый #TOOLTIP:ARTIST,architect,X #L архитектор#!#! присоединится к вашему [Concept('court', 'двору')|e]"
 strive_towards_thalassocracy_decision.title: "Установить талассократию"
 strive_towards_thalassocracy_decision.desc: "Бескрайние морские просторы могут сыграть ключевую роль в расширении нашей страны и развитии её экономики, если мы обеспечим контроль над водами вдоль своего побережья. Вложив существенные ресурсы в строительство флота, мы получим инфраструктуру для господства на море."
 strive_towards_thalassocracy_decision.a: "Будем править морями."
 strive_towards_thalassocracy_decision.a.tt: "У нас будет 20 лет на то, чтобы построить мощный флот"
 strive_thalassocracy_coastal_markets_tt: "Владеет хотя бы одним прибрежным [Concept('market_center', 'рыночным центром')|e]"
 abandon_thalassocracy_decision.title: "Отказаться от талассократии"
 abandon_thalassocracy_decision.desc: "Укрепление власти через господство на море больше не соответствует нашим планам. Мы должны направить усилия на землю, на которой живем."
 abandon_thalassocracy_decision.a: "Вернёмся на твёрдую землю."
 found_trade_company_india_decision.title: "Поддержать торговлю с азией"
 found_trade_company_india_decision.desc: "Богатства берегов #TOOLTIP:SUB_CONTINENT,south_asia,X #L Южной#!#! и #TOOLTIP:SUB_CONTINENT,south_east_asia,X #L Юго-Восточной Азии#!#! сулят огромные прибыли. Пока что с этими землями торгуют преимущественно купцы-одиночки, но такое положение дел недостойно столь великой державы, как наша. Прибегнув к государственным рычагам влияния, мы должны учредить крупномасштабные торговые миссии для этих рынков."
 found_trade_company_india_decision.a: "Вложить средства в индийскую торговую компанию."
 invite_foreign_advisor_decision.title: "Купить зарубежные новшества"
 invite_foreign_advisor_decision.desc: "Наша страна существенно отстаёт от остальных великих держав мира в плане развития технологий и модернизации в целом. Мы не можем сидеть сложа руки, пока конкуренты нас обгоняют. Предложив щедрое жалование иностранному учёному, мы сможем попытаться сократить своё отставание."
 invite_foreign_advisor_decision.a: "Пригласим чужеземного учёного."
 invite_foreign_advisor_decision.a.tt: "Учёный из другой [Concept('country', 'державы')|e] присоединится к нашему [Concept('court', 'двору')|e]"
 invite_foreign_advisor_decision.b: "Нам хватает своих советников."
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 disempower_the_parliament_decision.title: "Посягнуть на права парламента"
 disempower_the_parliament_decision.desc: "За последние века наш парламент приобрёл определённые права, ограничивающие свободу нашего правления. Пора как следует присмотреться к этим вольнодумцам и ограничить их полномочия!"
 disempower_the_parliament_decision.a: "Нам нужно ограничить власть парламента."
 disempower_the_parliament_decision.a_building_tt: "Мы ликвидируем #TOOLTIP:BUILDING_TYPE,urban_parliament_seat,X #L место в городском парламенте#!#! в одном из своих [Concept('locations', 'районов')|e]"
 disempower_the_parliament_decision.a_tt: "Каждая [Concept('pop', 'группа населения')|e] в [Concept('location', 'районе')|e] получит [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 disempower_the_parliament_decision.b: "Сейчас не время ссориться с парламентом."
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 abolish_serfdom_decision.title: "Отменить крепостничество"
 abolish_serfdom_decision.desc: "Практика крепостничества, много веков существующая в нашей державе, стала мешать развитию экономики. Учитывая нестабильный политический климат нынешнего времени, возможно, нам стоит отменить эту практику своим декретом, чтобы угодить растущему среднему классу и уменьшить страдания угнетённых крестьян."
 abolish_serfdom_decision.a: "Подписать декрет."
 abolish_serfdom_decision.b: "Это может вызвать смуту."
 abandon_absolutism_decision.title: "Отказаться от абсолютизма"
 abandon_absolutism_decision.desc: "Абсолютная власть нашего правителя всё больше угрожает внутренней стабильности державы. Слухи о мятежах разносятся всё чаще, а подавление недовольных обходится режиму всё дороже. Может быть, нам пора отвергнуть устаревшие абсолютистские идеалы и принять более либеральную форму правления?"
 abandon_absolutism_decision.a: "Абсолютизм нам больше не подходит."
 abandon_absolutism_decision.b: "Наша власть превыше всего!"
 jewish_expulsion_threat.title: "Угроза изгнания"
 jewish_expulsion_threat.desc: "Власти выдвигают официальный ультиматум еврейским общинам: либо заплатить огромный налог, либо отправиться в изгнание. Испуганные общины тут же собирают требуемую сумму, однако общая атмосфера неуверенности нарушает работу торговых сетей, которая долгое время поддерживалась посредниками-евреями."
 jewish_expulsion_threat.a: "Выпустим ультиматум."
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Угроза изгнания"
 jews_may_choose_to_leave_tt: "Большая часть наших [Concept('pops', 'групп населения')|e], исповедующих #TOOLTIP:RELIGION,$judaism_tt$,X #L иудаизм#!#!, переселится в соседние [Concept('countries', 'державы')|e]\n\nКаждый покинутый ими [Concept('location', 'район')|e] получит модификатор «[ShowModifier('jewish_expulsion_threat')]», масштабируемый в зависимости от доли иудейских [Concept('pops', 'групп населения')]"
