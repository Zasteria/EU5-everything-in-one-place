l_russian:
 sponsor_a_cathedral_decision.title: "Строительство собора"
 sponsor_a_cathedral_decision.desc: "В нашей стране всё ещё не хватает мест для богослужений и отправления веры. Следует профинансировать строительство нового здания [ShowBuildingTypeName('cathedral')], чтобы удовлетворить нужды нашего народа."
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_decision.b: "This is not the right time."
 sponsor_a_cathedral_cooldown_tt: "Это [decision|e] ещё не использовалось за время правления текущего правителя"
 sponsor_a_great_madrasa_decision.title: "Строительство великого медресе"
 sponsor_a_great_madrasa_decision.desc: "Хотя в нашей стране уже немало мест поклонения, обычные [ShowBuildingTypeName('temple')] и [ShowBuildingTypeName('madrasa')] не могут удовлетворить пытливые умы наших учёных. Следует вложить средства в новое здание [ShowBuildingTypeName('great_madrasa')], чтобы предоставить им достойные условия для учёбы и распространения знаний."
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_decision.b: "This is not the right time."
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 construct_a_grand_palace_decision.title: "Заказать строительство нового дворца"
 construct_a_grand_palace_decision.desc: "Ни нашему двору, ни семье правителя не хватает дома, достойного их положения. Следует нанять [ShowArtistTypeName('architect')], чтобы он спланировал строительство нового здания [ShowBuildingTypeName('grand_palace')]."
 construct_a_grand_palace_decision.a: "Это будет достойная резиденция."
 strive_towards_thalassocracy_decision.title: "Установление талассократии"
 strive_towards_thalassocracy_decision.desc: "Необъятные моря могут стать жизненно важной частью нашей страны и её экономического роста, если только мы сумеем должным образом утвердить своё господство в водах у наших берегов. Вложив значительные средства в развитие флота, мы сможем привести нашу инфраструктуру в соответствие с новым курсом на заморские амбиции."
 strive_towards_thalassocracy_decision.a: "Обратим наш взор к морю."
 strive_towards_thalassocracy_decision.a.tt: "У нас будет 20 лет на создание сильного флота"
 strive_thalassocracy_coastal_markets_tt: "Владеет хотя бы одним прибрежным [market_center|e]"
 abandon_thalassocracy_decision.title: "Отказ от талассократии"
 abandon_thalassocracy_decision.desc: "Правление через господство на морях больше не отвечает нашим устремлениям. Нам следует направить усилия на землю, на которой мы живём."
 abandon_thalassocracy_decision.a: "Вернёмся на твёрдую почву."
 found_trade_company_india_decision.title: "Поддержать наши азиатские торговые пути"
 found_trade_company_india_decision.desc: "Богатые берега [ShowSubContinentName('south_asia')] и [ShowSubContinentName('south_east_asia')] сулят нам великую прибыль. Хотя наша нынешняя торговля ведётся в основном отдельными купцами, это явно не соответствует положению нашей державы. Нам следует использовать возможности государства, чтобы наладить более крупные торговые предприятия между этими чужеземными рынками и нашим собственным."
 found_trade_company_india_decision.a: "Вложить средства в Индийскую торговую компанию."
 invite_foreign_advisor_decision.title: "Приобрести иноземные новшества"
 invite_foreign_advisor_decision.desc: "Наша держава серьёзно отстаёт от прочих великих держав мира. Мы не можем сидеть сложа руки, пока другие страны превосходят нас в области техники и новшеств. Предложив щедрое жалованье человеку из одной из этих стран, мы сможем попытаться наверстать упущенное и не отстать ещё сильнее на пути к преобразованиям."
 invite_foreign_advisor_decision.a: "Принять чужеземного учёного."
 invite_foreign_advisor_decision.a.tt: "Учёный из чужеземной [country|e] присоединится к нашему [court|e]"
 invite_foreign_advisor_decision.b: "Нам достаточно и своих советников."
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 disempower_the_parliament_decision: "Challenge the Rights of the Parliament"
 disempower_the_parliament_decision_desc: "Over the last centuries our parliament has acquired certain rights that limit our government in its own freedom. We should look towards those with entrenched seats in the parliament and revoke their rights!"
 disempower_the_parliament_decision.a: "Нужно обуздать власть парламента."
 disempower_the_parliament_decision.b: "Сейчас не время бросать вызов парламенту."
 abolish_serfdom_decision.title: "Отменить крепостное право"
 abolish_serfdom_decision.desc: "Крепостное право, издавна практикуемое в нашей стране, превратилось в препятствие для нашего экономического развития. Учитывая нестабильную политическую обстановку нашего времени, было бы разумно отменить эту практику указом, чтобы умиротворить растущий средний класс и облегчить страдания тех, кто живёт под кнутом."
 abolish_serfdom_decision.a: "Подписать указ."
 abolish_serfdom_decision.b: "Это было бы слишком опасно для стабильности."
 abandon_absolutism_decision.title: "Отказаться от абсолютизма"
 abandon_absolutism_decision.desc: "Абсолютистское правление нашего государя всё сильнее угрожает внутренней стабильности страны. Слухи о восстании звучат всё чаще, а подавление противников нашего режима становится непростой задачей. Быть может, пришло время отвернуться от старых абсолютистских идеалов и принять более либеральную форму правления для нашей страны?"
 abandon_absolutism_decision.a: "Абсолютизм нам больше не подходит."
 abandon_absolutism_decision.b: "Наша власть непререкаема!"
 construct_a_grand_palace_decision.a_tt: "Нанятый [ShowArtistTypeName('architect')] присоединится к нашему [Concept('court','дative')|e]"
 disempower_the_parliament_decision.a_building_tt: "Мы уберём [ShowBuildingTypeName('urban_parliament_seat')] в одном из наших [locations|e]"
 disempower_the_parliament_decision.a_tt: "Каждая [pop|e] в [location|e] потеряет [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] в [pop_satisfaction|e]"
 disempower_the_parliament_decision.desc: "За последние века наш парламент приобрёл определённые права, ограничивающие свободу действий нашего правительства. Нам следует обратить внимание на тех, кто прочно закрепился в парламенте, и лишить их этих прав!"
 disempower_the_parliament_decision.title: "Оспорить права парламента"
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 jewish_expulsion_threat.a: "Выдвинуть ультиматум."
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 jews_may_choose_to_leave_tt: "Most of our [ShowReligionAdjective('judaism')] [pops|e] will migrate to neighboring [countries|e]\n\nEach [location|e] they leave will suffer the [ShowModifier('jewish_expulsion_threat')], scaled by its share of [ShowReligionAdjectiveWithNoTooltip('judaism')] [pops]"
