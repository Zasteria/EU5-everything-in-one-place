l_russian:
 ara_coronate_ruler.title: "$flavor_ara.22.title$"
 ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
 ara_coronate_ruler.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] на престол; [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] собрались в величественной Сарагосе, чтобы посмотреть на [Select_CString(target_character.IsFemale, 'её', 'его' )] коронацию. Здесь [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] принесёт клятву хранить правила [ROOT.GetCountry.Custom('rank_ru_GEN')|l], свободы народа и привилегии сословий."
 ara_coronate_ruler.desc.entry: "Новый правитель не сможет по-настоящему заручиться верностью #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократов#!#! и #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L простолюдинов#!#! без подобающей церемонии коронации. Некоронованного монарха никто не признает законным правителем."
 ara_coronate_ruler.a: "$flavor_ara.23.a$"
 ara_coronate_ruler.b: "Пора избавиться от этой традиции."
