l_russian:
 ara_coronate_ruler.title: "$flavor_ara.22.entry$"
 ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
 ara_coronate_ruler.desc: "[target_character.GetName] взошёл на престол, и [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], и [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] собрались, дабы засвидетельствовать коронацию в прославленном месте — [ShowLocationName('zaragoza')], где [ROOT.GetCountry.GetGovernment.GetRulerTitle] принесёт клятву блюсти законы [ROOT.GetCountry.GetFlavorRank], вольности народа и привилегии сословий."
 ara_coronate_ruler.desc.entry: "Новый правитель, восходящий на престол, не сможет должным образом заручиться верностью [ShowEstateTypeName('nobles_estate')] и [ShowEstateTypeName('peasants_estate')], если не будет проведена подобающая церемония коронации. Некоронованный монарх — это непризнанный монарх."
 ara_coronate_ruler.a: "$flavor_ara.23.a$"
 ara_coronate_ruler.b: "Пора избавиться от этой традиции."
 ara_unite_barcelona_dynasty.title: "Объединить династию"
 ara_unite_barcelona_dynasty.desc: "#TOOLTIP:CULTURE,$sicilian_tt$,X #L Сицилийская#!#! вечерня укрепила нашу династию на престоле и заметно усилила наше влияние в #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Однако [ShowAreaName('sicily_area')] по-прежнему сохраняет независимость, предпочитая держаться в стороне от династической политики. Не стоит упускать такую возможность. Быть может, нам удастся связаться с нашими тамошними родственниками, укрепить династические узы и тем самым положить начало нашим реализации наших планов на Италию."
 ara_unite_barcelona_dynasty.a: "Попробуем объединить две короны."
 ara_unite_barcelona_dynasty.b: "Они станут нашими подданными."
 ara_effects_only_take_place_if_sic_accepts_tt: "Эффекты будут иметь место только если [GetCountry('SIC').GetName] соглас[GetCountry('SIC').Custom('end_ityat')]ся"
 ara_vassalize_bosnia.title: "Потребовать вассализации [GetCountry('BOS').Custom('CL_GEN')]"
 ara_vassalize_bosnia.desc: "Великий правитель #ONCLICK:COUNTRY,[GetCountry('BOS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOS').Custom('CL_tt')],X [GetCountry('BOS').Custom('CL_GEN')|L]#!#! уже давно пытается сохранить суверенитет державы перед лицом алчных до чужих земель соседей. Понимая, что в одиночку им не выстоять, #L [GetCountry('BOS').GetAdjective|l]ие#! [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')|l] обратились к нашему правителю и его двору с просьбой защитить их от возможного вторжения. Они гораздо охотнее станут нашими подданными, чем попадут по власть неверных — и мы можем этим воспользоваться."
 ara_vassalize_bosnia.a: "Пора им подчиниться."
 ara_ask_bosnia_for_vassalization: "Мы потребуем от #ONCLICK:COUNTRY,[GetCountry('BOS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOS').Custom('CL_tt')],X [GetCountry('BOS').Custom('CL_GEN')|L]#!#! подчинения"
