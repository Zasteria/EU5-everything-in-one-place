l_russian:
 mos_prikazi_decision.title: "Учреждение приказов $prikazi_reform$"
 mos_prikazi_decision.desc: "Неэффективное управление уже давно мешает #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! занять подобающее стране место в ряду великих держав. Чтобы повысить эффективность администрации, стоит распределить контроль над государственными делами между несколькими органами управления. Это поспособствует скорейшему исполнению указов, которые издаёт [ROOT.GetCountry.GetGovernment.GetRuler.GetName], и усилит централизацию власти."
 mos_prikazi_decision.desc.entry: "Правитель, подписавший указ, не может быть уверен, что его прочтут ниже по реке, не говоря уже о том, чтобы ему подчинились. Постоянные учреждения, каждое из которых отвечает за свою часть государственных дел, донесут слово государя дальше, чем когда-либо смогла бы одна лишь его репутация."
 mos_prikazi_decision.a: "Разве можно управлять страной иначе?"
 mos_prikazi_decision.b: "Залог успеха — в свободе действий."
 mos_prikazi_decision.tt1: "В государстве появятся несколько управ; члены [Concept('cabinet', 'совета')|e] смогут надзирать за ними при помощи [Concept('cabinet_action', 'действий совета')|e]"
 enable_prikazi_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L «Приказы»#!#!"
 mos_prikazi_decision.historical_info: "Приказами назывались органы государственного управления в Русском царстве и в первые годы существования Российской империи. Они выполняли царские решения, а также повседневные функции, необходимые для работы государственного аппарата. Самые крупные приказы занимались внешней политикой, они сыграли ключевую роль в период, когда Русь была окружена врагами и ещё боролась за независимость от Золотой Орды."
 mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]"
 mos_razriadnyi_decision.desc: "В стране практически не ведётся учёт населения, его имущества и налогов, и это затрудняет контроль над расходами казны и финансирование государственного аппарата. Проводя регулярные переписи населения силами недавно созданного #TOOLTIP:GOVERNMENT_REFORM,razriadnyi_reform,X #L Разрядного приказа#!#!, мы получим подробные сведения обо всех #L [ROOT.GetCountry.GetAdjective|l]их#! подданных и их домохозяйствах — какими ресурсами они обладают и какие обязательства должны исполнять."
 mos_razriadnyi_decision.desc.entry: "Казна, не способная сосчитать своих подданных, не может честно облагать их налогом, а наша уже который год лишь гадает. Постоянное учреждение для переписи даст точное число того, сколько людей и денег мы способны собрать, и знать это стоит еще до первого похода, который это оплатит."
 mos_razriadnyi_decision.a: "Если понадобится, мы заглянем под каждый камень."
 mos_razriadnyi_decision.b: "Это будет проникновением в их частную жизнь."
 enable_razriadnyi_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,razriadnyi_reform,X #L «Разрядный приказ»#!#!"
 mos_razriadnyi_decision.historical_info: "Военная канцелярия, #italic Разрядный приказ#!, ввела перепись населения, что позволило властям определять налоговые обязательства подданных в зависимости от их богатства, имущества и социального положения. Кроме того, благодаря разрядным книгам государство всегда знало, сколько солдат и военного имущества способно поставить каждое сословие сообразно своим обязательствам. Такие реестры населения оказались незаменимыми для управления обширной и неоднородной территорией."
 mos_build_kremlin_decision.title: "Строительство Кремля"
 mos_build_kremlin_decision.desc: "Земли Руси постоянно подвергаются набегам, а нынешние укрепления вокруг [target_location.Custom('LR_GEN')|l] [target_location.GetName] явно недостаточно надёжны, чтобы остановить неприятеля. Эти разорительные нападения мешают стране развиваться, и мы должны сделать всё, чтобы защитить наш народ в эти неспокойные времена.\n\nПора окружить [target_location.Custom('LR_ACC')|l] мощными укреплениями, стены которых выдержат любую атаку."
 mos_build_kremlin_decision.desc.entry: "Налетчики не станут ждать, пока стены достроят, прежде чем испытать их на прочность, а наши такого испытания не выдержат. Восстановление обороны [ShowLocationName('moscow')] обойдется в целое состояние, которое нам не хотелось бы тратить, но потеря города обойдется куда дороже."
 mos_build_kremlin_decision.a: "Пусть купцы везут нам лучшую древесину."
 mos_build_kremlin_decision.b: "Мы не станем провоцировать соседей."
 mos_build_kremlin_decision.c: "Разберём замок ленника на стройматериалы."
 threatened_by_military_expansion: "Угроза военной экспансии"
 safe_haven_during_raids: "Надёжное укрытие на случай набегов"
 mos_build_kremlin_decision.tt1: "Недружелюбные соседи сочтут строительство мощного Кремля враждебным актом"
 mos_build_kremlin_decision.tt2: "Соседние ленники увидят в мощном Кремле надёжное укрытие на случай набегов"
 mos_build_kremlin_decision.a.custom1: "Каждая соседняя держава получает [ShowBiasValue('threatened_by_military_expansion')|+=0] к [Concept('opinion', 'мнению')|e] о властях #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_GEN')|L]#!#!"
 mos_build_kremlin_decision.a.custom2: "Каждый соседний [Concept('subject', 'ленник')|e] получает [ShowBiasValue('safe_haven_during_raids')|+=0] ед. к [Concept('opinion', 'мнению')|e] о #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_PREP')|L]#!#!"
 mos_build_kremlin_decision.b.custom1: "Каждая соседняя держава получит #G 3 ед.#! [Concept('trust', 'доверие')|я] к #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_DAT')|L]#!#!"
 mos_build_kremlin_decision.b.custom2: "Каждый соседний [Concept('subject', 'ленник')|e] получает [ShowBiasValue('lack_of_protection')|+=0] к [Concept('opinion', 'мнению')|e] [target_root_country.Custom('predlog_obo')] #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_PREP')|L]#!#!"
 lack_of_protection: "Недостаточная защита"
 mos_kremlin_construction: "Строительство Кремля"
 mos_build_kremlin_decision.tt3: "Почти всю необходимую #TOOLTIP:GOODS,clay,X #L глину#!#! и #TOOLTIP:GOODS,lumber,X #L древесину#!#! можно получить, разобрав замок в [castle_location.Custom('LR_PREP')|l] [castle_location.GetName]"
 mos_build_kremlin_decision.historical_info: "Первый московский Кремль был деревянным и состоял не только из стен и башен, но также из множества административных зданий. Строительство Московского Кремля было весьма дорогостоящим проектом, однако оно было необходимым — простые деревянные заграждения, защищавшие Москву прежде, оказались неэффективными против осад и регулярных татарских набегов за рабами."
 mos_vestiarium_decision.title: "Вестиарий"
 mos_vestiarium_decision.desc: "Никто давно не занимался описью государственной сокровищницы, мы даже не можем толком оценить стоимость хранящихся там ценностей. Нужно придумать, как эффективнее распоряжаться нашими богатствами — это не только облегчит достижение наших дипломатических целей, но и позволит улучшить управление страной."
 mos_vestiarium_decision.a: "Качественное управление — ключ к успеху."
 mos_vestiarium_decision.b: "Для нас важнее всего тайные пружины дипломатии."
 mos_vestiarium_decision.custom: "Открывает [Concept('law', 'правило')|e] #TOOLTIP:LAW,vestiarium,X #L «Вестиарий»#!#!"
 mos_vestiarium_decision.historical_info: "#italic  «Вестиарий»#! Василия I — это опись ценностей, хранящихся в царской казне. Его использовали для учёта всех царских сокровищ — от украшений и драгоценных металлов до одежды и тканей. В вестиарии также вёлся учёт дипломатических подарков и предметов, которые использовались в государственных церемониях."
 mos_byzantine_court_ceremonies_decision.title: "Связи со старой $BYZ_ADJ$ династией"
 mos_byzantine_court_ceremonies_decision.desc: "#TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! пал, но благодаря этой трагедии у нас появилась возможность соединиться семейными узами с бывшей правящей элитой #ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_GEN')|L]#!#!. Если [sophia_palaiologina.GetName] выйдет замуж за государя, это поспособствует усилению византийского влияния при дворе и укрепит наши притязания на роль ведущей #TOOLTIP:RELIGION,$orthodox_tt$,X #L православной#!#! державы и законных преемников Римской империи. Более того, их дети станут наследниками императоров погибшей империи."
 mos_byzantine_court_ceremonies_decision.desc.entry: "Корона, взятая силой, остается короной, взятой силой; а корона, полученная через брак, больше похожа на наследство. Соединив кровь [ShowLocationName('constantinople')] с нашим родом, мы добьемся того, что дитя от этого союза однажды сможет заявить о происхождении от императоров, а не просто от завоевателей."
 mos_byzantine_court_ceremonies_decision.a: "Предсказанный союз!"
 mos_byzantine_court_ceremonies_decision.b: "Этот брак не даёт никаких преимуществ."
 mos_byzantine_court_ceremonies_decision.tt1: "Появится [Concept('character', 'персонаж')|e] София"
 enable_byzantine_court_ceremonies_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,byzantine_court_ceremonies_reform,X #L «Византийские придворные церемонии»#!#!"
 mos_byzantine_court_ceremonies_decision.tt2: "Её неприязнь по отношению к некоторым дипломатам испортит дипломатические отношения между #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_INST')|L]#!#! и соседями-[Concept('heathen', 'язычниками')|e]"
 STATIC_MODIFIER_NAME_mongol_intolerance: "Нетерпимость к монголам"
 mos_byzantine_court_ceremonies_decision.historical_info: "После бракосочетания Ивана III с Софьей Палеолог при великокняжеском дворе вошёл в обиход сложный византийский придворный церемониал. Это помогло укрепить претензии Москвы на символический статус Третьего Рима. Софья родила одиннадцать детей и была бабушкой печально известного Ивана Грозного. Её нетерпимость к монгольскому влиянию вызвала несколько дипломатических инцидентов и поспособствовала окончательному разрыву Москвы с Золотой Ордой в 1480 году."
 mos_monastic_reformation_decision.title: "Узаконивание учения Нила Сорского"
 mos_monastic_reformation_decision.desc: "Возмущённый роскошью и богатством многих #L [ROOT.GetCountry.GetAdjective|l]их#! монастырей, духовный лидер Нил Сорский призывает к церковной реформе. Его сторонники, называющие себя «нестяжателями», предлагают отказ от всякого имущества, их идеал — простая и смиренная жизнь, полностью посвящённая учению Христа. Несомненно, это движение столкнётся с ожесточённым сопротивлением существующей церковной иерархии, представители которой утверждают, что выполнение духовных функций невозможно без определённого уровня материального достатка."
 mos_monastic_reformation_decision.desc.entry: "Нил Сорский проповедует, что монах, владеющий землей, уже проиграл спор о владении чем бы то ни было еще, и с ним согласны достаточно многие из духовенства, чтобы это тревожило Церковь. Поддержка нестяжателей будет стоить нам благосклонности каждого богатого монастыря, но купит верность каждого монаха, который никогда ее и не желал."
 mos_monastic_reformation_decision.a: "Поддержим нестяжателей."
 mos_monastic_reformation_decision.b: "Поддержим любостяжателей."
 mos_monastic_reformation_decision.custom1: "Открывает [Concept('law', 'правило')|e] #TOOLTIP:LAW,monastic_reformation_movement,X #L «Монашеское реформаторское движение»#!#!"
 mos_monastic_reformation_decision.custom2: "[Concept('policy', 'Политику')|e] в рамках [Concept('law', 'правила')|e] #TOOLTIP:LAW,monastic_reformation_movement,X #L «Монашеское реформаторское движение»#!#! можно менять не чаще чем раз в десять лет"
 mos_monastic_reformation_decision.historical_info: "Нил Сорский — русский православный монах, стоявший у истоков движения нестяжателей. Строго придерживаясь обета бедности, монахи-нестяжатели критиковали церковную роскошь и владевшие вотчинами монастыри. Учение Нила столкнулось с яростным противодействием со стороны Церкви, многие представители которой отвергали его воззрения. Несмотря на это, идея нестяжательства оставила глубокий след в русской духовности, и впоследствии Нил Сорский был причислен Русской православной церковью к лику святых."
 mos_stroganov_school_decision.title: "Основание Строгановской школы"
 mos_stroganov_school_decision.desc: "Богатая купеческая семья #TOOLTIP:DYNASTY,$stroganov_dynasty_tt$,X #L Строгановых#!#! — большие ценители искусства. Они готовы профинансировать создание целой школы иконописи для украшения своих многочисленных дворцов, разбросанных по всей стране. Произведения, созданные строгановскими мастерами, предназначены для частных собраний, они вряд ли принесут нашей державе ощутимую пользу. Тем не менее эта инициатива поспособствует духовному благополучию #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и позволит нам заручиться поддержкой могущественной семьи."
 mos_stroganov_school_decision.desc.entry: "[ShowDynastyName('stroganov_dynasty')] хотят икон для своих собственных часовен, а не святых для всей державы, и готовы платить за эту привилегию. Школа, построенная на их деньги, не принесет казне ничего, кроме семьи, которая будет должна нам меньше, а ожидать станет больше."
 mos_stroganov_school_decision.a: "Почему бы не помочь друг другу?"
 mos_stroganov_school_decision.b: "Лучше поддержим их деловые предприятия."
 mos_stroganov_school_decision.c: "Они вправе рассчитывать на определённое влияние при дворе."
 enable_stroganov_influences_cabinet_action: "Для представителей династии Строгановых открывается [Concept('cabinet_action', 'действие совета')|e] #TOOLTIP:CABINET_ACTION,stroganov_influences,X #L «Влияние Строгановых»#!#!"
 mos_stroganov_school_decision.historical_info: "Строгановская школа иконописи сложилась в период расцвета русской средневековой живописи, до того как искусство Восточной Европы попало под влияние западных мастеров. Произведения строгановских иконописцев во многом отражали предпочтения высокородных покровителей школы, включая и самого царя. Их работы оставались востребованными вплоть до основания Санкт-Петербурга, которое сопровождалось резким усилением западного влияния."
 mos_novodevichy_convent_decision.title: "Новодевичий монастырь"
 mos_novodevichy_convent_decision.desc: "Триумфальное завоевание #TOOLTIP:AREA,smolensk_area,X #L Смоленска#!#! необходимо отметить. К счастью, #TOOLTIP:LOCATION,moscow,X #L Москва#!#! как раз нуждается в защите южного рубежа, и строительство укреплённого монастыря позволит решить эту задачу. Помимо защиты #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, он также станет пристанищем для #TOOLTIP:POPTYPE,nobles,X #L знатных#!#! женщин, которые были вынуждены принять постриг. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] наверняка высоко оценят этот жест."
 mos_novodevichy_convent_decision.desc.entry: "Победа значит больше, если о ней помнит нечто из камня и на века. Укрепленный монастырь к югу от [ShowLocationName('moscow')] будет охранять подступы, отвоеванные под [ShowAreaName('smolensk_area')], попутно тихо принимая дочерей [ShowPopTypeName('nobles')], на которых никто больше не желает жениться, — удобство, в котором $nobles_estate$ открыто признаваться не станет."
 mos_novodevichy_convent_decision.a: "Это определённо выгодное вложение."
 mos_novodevichy_convent_decision.b: "Москва и так отлично защищена."
 mos_novodevichy_convent_decision.c: "Предложим пострадавшим женщинам стипендию."
 mos_novodevichy_convent_decision.historical_info: "Новодевичий монастырь был основан великим князем Василием III в честь завоевания Смоленска. Он представлял собой религиозное учреждение, которое также могло служить крепостью для обороны западных подступов к городу. В монастыре проживали женщины из знатных русских семей, которых вынуждали принять монашеский образ жизни."
 mos_limit_namestnik_decision.title: "Влияние наместников"
 mos_limit_namestnik_decision.desc: "Наместники обладают огромной властью и управляют наиболее отдалёнными регионами #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! от имени царя. Такая система создаёт трудности при сборе доходов и надзоре за работой самих чиновников. Мы должны установить прямой контроль над регионами и ускорить централизацию страны, даже если ради этого придётся пренебречь интересами местных элит."
 mos_limit_namestnik_decision.desc.entry: "Наместник, управляющий областью без надзора, вскоре начинает править ею как своей собственной. Прямое правление из центра вернет доходы, которые ныне присваивают себе наместники, ценой всякой местной верности, на которой держались эти должности."
 mos_limit_namestnik_decision.a: "Эта система уже давно устарела."
 mos_limit_namestnik_decision.b: "Пусть всё остаётся, как есть."
 disable_namestnik_policy: "[Concept('policy', 'Политика')|e] #TOOLTIP:POLICY,namestnik_policy,X #L «Канцелярия наместника»#!#! станет недоступна"
 mos_limit_namestnik_decision.historical_info: "Наместники имели значительное влияние и осуществляли волю монарха в самых дальних уголках страны. Во время правления Ивана IV их полномочия были сокращены, однако институт наместничества сохранялся до проведения Петром Великим ряда реформ, которые затронули административное устройство России."
 mos_posolsky_prikaz_decision.title: "Посольский приказ"
 mos_posolsky_prikaz_decision.desc: "Благодаря усердной работе [ivan_viskovatiy.GetName] смог привести нашу бюрократическую систему в порядок и повысить её эффективность. Теперь же он предлагает создать специальный отдел для решения дипломатических вопросов, чтобы наша внешнеполитическая деятельность соответствовала высоким стандартам, установленным в других органах власти."
 mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$ $Viskovatiy$ уже давно и весьма умело ведет иностранные дела, не имея для этого настоящего учреждения. Сделав это положение постоянным, мы ничего не потеряем сверх того, что его дарование и так тихо нам приносило."
 mos_posolsky_prikaz_decision.a: "Разумное предложение."
 mos_posolsky_prikaz_decision.b: "Это лишь инструмент для плетения политических интриг."
 enable_posolsky_cabinet_action: "Открывает [Concept('cabinet_action', 'действие совета')|e] #TOOLTIP:CABINET_ACTION,posolsky,X #L «Посольский приказ»#!#!"
 mos_posolsky_prikaz_decision.historical_info: "#italic  Посольский приказ#! был правительственным учреждением, которое занималось вопросами дипломатии. Его сотрудники участвовали в переговорах с другими государствами, назначали послов и работали с важными документами, касавшимися внешней политики страны."
 mos_moscow_artillery_yard_decision.title: "Московский пушечный двор"
 mos_moscow_artillery_yard_decision.desc: "Артиллерия начинает играть всё более важную роль на поле боя, поэтому мы должны обеспечить армию достаточным количеством пушек. Стоит поручить нашим инженерам создать специальное предприятие для производства артиллерии, чтобы #TOOLTIP:LOCATION,moscow,X #L Москва#!#! стала центром военных инноваций и надёжным поставщиком орудий."
 mos_moscow_artillery_yard_decision.a: "Это обеспечит поистине взрывной рост нашей военной мощи."
 mos_moscow_artillery_yard_decision.b: "Лучше направим усилия на подготовку воинов."
 mos_moscow_artillery_yard_decision.historical_info: "Московский пушечный двор был создан во времена правления Ивана IV и сыграл важную роль в повышении военного потенциала страны. Производство пушек позволило России расширить своё влияние и одержать победу во множестве конфликтов."
 mos_ban_oprichniki_decision.title: "Опричный террор"
 mos_ban_oprichniki_decision.desc: "Опричники продолжают уничтожать тех, кто был заподозрен в измене. Недавно чистке подверглись несколько поместий #TOOLTIP:POPTYPE,nobles,X #L аристократов#!#! в сельском районе, из-за чего местные #TOOLTIP:POPTYPE,peasants,X #L крестьяне#!#! остались без хозяйства. Если мы не исправим ситуацию в ближайшее время, то страна может столкнуться с острой нехваткой продовольствия."
 mos_ban_oprichniki_decision.a: "Опричнине пора положить конец."
 mos_ban_oprichniki_decision.b: "Нас это не касается."
 STATIC_MODIFIER_NAME_displaced_farmers: "Обездоленные крестьяне"
 disable_oprichnik_policy: "[Concept('policy', 'Политика')|e] #TOOLTIP:POLICY,oprichnik_policy,X #L «Опричники»#!#! станет недоступна"
 mos_ban_oprichniki_decision.historical_info: "Опричники занимались конфискацией имущества у тех, кто считался врагом государства. Эта практика ещё больше укрепляла власть царя и его сторонников, но также имела негативные последствия. Многим крестьянам пришлось покинуть владения своих убитых или арестованных хозяев. В результате на полях стало некому работать, что привело сначала к уменьшению собранного урожая, а затем и к голоду."
 mos_aptekarsky_prikaz_decision.title: "Аптекарский приказ"
 mos_aptekarsky_prikaz_decision.desc: "Каждый #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L приказ#!#! выполняет свою особую роль в управлении страной, однако недавняя эпидемия чумы показала, что мы уделяем недостаточно внимания вопросам здоровья и благополучия народа. Мы должны создать специальный орган, который будет принимать необходимые меры в случае очередной эпидемии или другого бедствия. Иначе мы можем столкнуться с резким ростом смертности, что приведёт к нехватке рабочих и воинов для защиты нашей [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 mos_aptekarsky_prikaz_decision.desc.entry: "The prikazi handle war, trade, and law well enough, and handle plague not at all. A separate office for public health would matter little in a healthy year and matter a great deal in the next bad one, and we have had enough bad years to know which is coming."
 mos_aptekarsky_prikaz_decision.a: "Пиявки и кровопускание — вот и всё лечение."
 mos_aptekarsky_prikaz_decision.b: "Молитва избавит нас от любых напастей."
 mos_aptekarsky_prikaz_decision.tt1: "Дворяне будут рады учреждению Аптекарского приказа, который будет оказывать им медицинскую помощь в особом порядке"
 enable_aptekarsky_cabinet_action: "Открывает [Concept('cabinet_action', 'действие совета')|e] #TOOLTIP:CABINET_ACTION,aptekarsky,X #L «Аптекарский приказ»#!#!"
 mos_aptekarsky_prikaz_decision.historical_info: "Аптекарский приказ был одним из органов государственного управления, который осуществлял контроль за производством и распределением лекарств, руководил аптеками и решал прочие вопросы здравоохранения. Кроме того, приказ отвечал за лечение дворян и членов царской семьи. В том или ином виде это учреждение оставалось важной частью административной системы Российской империи до своего упразднения после революции 1917 года."
 mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$"
 mos_bolshogo_dvortsa_prikaz_decision.desc: "Воевода #TOOLTIP:LOCATION,nizhny_novgorod,X #L Нижнего Новгорода#!#! [alexander_lvov.GetName] недавно вернулся ко двору, чтобы занять должность окольничего, которая предоставит ему дополнительные полномочия. Мы также можем назначить его главой Дворцового #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L приказа#!#! и доверить ему управление монастырями. Это позволит нам более эффективно расходовать средства и контролировать исполнение мер, предлагаемых #TOOLTIP:POLICY,non_possessors,X #L нестяжателями#!#!."
 mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$ уже пользуется тем доверием, что подобает чину окольничего; недостаёт лишь должности, достойной этого доверия. Передав дворцовые вотчины и монастыри в одни верные руки, мы наведём порядок в управлении, которое долгое время велось плохо и раздельно."
 mos_bolshogo_dvortsa_prikaz_decision.a: "Неплохая идея."
 mos_bolshogo_dvortsa_prikaz_decision.b: "Такой строгий надзор ни к чему."
 enable_bolshogo_dvortsa_cabinet_action: "Открывает [Concept('cabinet_action', 'действие совета')|e] #TOOLTIP:CABINET_ACTION,bolshogo_dvortsa,X #L «Дворцовый приказ»#!#!"
 enable_bolshogo_dvortsa_cabinet_action.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] крайне довольны доверием правительства"
 mos_bolshogo_dvortsa_prikaz_decision.historical_info: "Алексей Михайлович Львов был государственным деятелем, который стремительно продвигался по службе, став сначала воеводой, затем послом, а в итоге главой Дворцового приказа. На последней должности он трудился до самой старости, пока добровольно не вышел в отставку."
 mos_greek_latin_academy_decision.title: "Establish the $greek_latin_academy$"
 mos_greek_latin_academy_decision.desc: "[simon_sitnianowicz.GetName], видный богослов родом из #TOOLTIP:LOCATION,polotsk,X #L Полоцка#!#! предлагает создать языковую школу, где государственные служащие смогут обучаться на общепринятом языке дипломатии — #L [latin.GetName|l]ом#!. Кроме того, он изъявил желание преподавать простому народу грамматику, поэтику и риторику. Такая дерзкая инициатива достойна похвалы, поэтому нам стоит выделить средства на её поддержку."
 mos_greek_latin_academy_decision.desc.entry: "Diplomacy is conducted in [ShowLanguageName('latin_language')], and our officials mostly are not. $name_simeon.east_slavic_language$ $Sitnianowicz$ proposes to teach it properly, and has further offered to teach the common people rhetoric as well, an ambition well past what the funding was meant to cover."
 mos_greek_latin_academy_decision.a: "Искусное владение языками открывает многие возможности."
 mos_greek_latin_academy_decision.b: "Пусть лучше занимается проповедями."
 mos_greek_latin_academy_decision.c: "Наймём его в качестве личного наставника."
 mos_greek_latin_academy_decision.d: "Народу не нужно образование."
 mos_greek_latin_academy_decision.tt1: "Появится [Concept('character', 'персонаж')|e] Симеон Полоцкий"
 mos_greek_latin_academy_decision.tt2: "Он посвятит себя написанию стихов и просвещению народа"
 mos_greek_latin_academy_decision.tt3: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] довольны изгнанием неординарного богослова."
 mos_greek_latin_academy_decision.historical_info: "Симеон Полоцкий был белорусским монахом, поэтом и переводчиком, который внёс большой вклад в развитие русской литературы и православной традиции. Он ввёл преподавание греческого и латинского языков в России, а также помог перевести несколько трудов западных богословов, что поспособствовало распространению иностранных идей среди русских священников."
 mos_collegium_decision.title: "Коллегии"
 mos_collegium_decision.desc: "Новая реформа государственного управления требует более чёткого разделения ведомств, чтобы избежать выполнения ими одних и тех же обязанностей. Для этого нам следует окончательно отказаться от системы #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L приказов#!#! и заменить их коллегиями, каждая из которых будет обладать своими функциями и полномочиями, а также предоставлять консультации по спорным вопросам."
 mos_collegium_decision.a: "Страна давно нуждается в этих изменениях."
 mos_collegium_decision.b: "Не стоит менять систему управления без веского повода."
 variable_prikazi_tt: "В стране действует система приказов"
 enable_collegium_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,collegium_reform,X #L «Коллегии»#!#!"
 mos_collegium_decision.tt1: "[Concept('government_reform', 'Государственный принцип')|e] «Приказы» и все связанные с ним [Concept('cabinet_action', 'действия совета')|e] станут недоступны"
 mos_collegium_decision.tt2: "Управление #TOOLTIP:LOCATION,neva,X #L Санкт-Петербургом#!#! будет приведено в соответствие с [Concept('policy', 'политикой')|e] #TOOLTIP:POLICY,dop_law_governing_senate,X #L «Правительствующий сенат»#!#!"
 mos_collegium_decision.historical_info: "После учреждения Правительствующего сената Пётр Великий сформировал ряд коллегий, которые отвечали за разные отрасли управления государством. Идея для их создания была позаимствована у соседней Швеции, где тогда также проводились похожие реформы. Эти изменения были обусловлены постоянно растущей территорией Российской империи, которая нуждалась в более эффективном управлении."
 mos_sukharev_tower_decision.title: "Сухарева башня"
 mos_sukharev_tower_decision.desc: "Военно-морскому флоту необходим постоянный приток умелых моряков, которые смогут передавать свои знания следующим поколениям. Для этого мы можем создать школу, где молодые люди будут обучаться техническим наукам, тем самым закладывая основу для дальнейшего развития наших вооружённых сил. Недавно один из наших архитекторов представил грандиозный проект башни, которая как раз подойдёт для наших целей и одновременно украсит облик #TOOLTIP:LOCATION,moscow,X #L Москвы#!#!."
 mos_sukharev_tower_decision.a: "Это выгодное предложение."
 mos_sukharev_tower_decision.b: "Такая роскошь ни к чему."
 mos_sukharev_tower_decision.c: "Это сооружение должно приносить пользу городу."
 mos_sukharev_tower_decision.c.entry: "It must meet the needs of the city."
 mos_sukharev_tower_decision.tt1: "Яков Брюс создаст на верхнем этаже башни астрономическую обсерваторию"
 mos_sukharev_tower_decision.tt2: "На втором этаже башни размещается современный резервуар для водопроводной системы #TOOLTIP:LOCATION,moscow,X #L Москвы#!#!"
 mos_sukharev_tower_decision.historical_info: "Сухарева башня была построена в конце XVII века по указу Петра Великого и названа в честь Лаврентия Сухарева, командира стрелецкого полка, который примкнул к царю во время его противостояния с сестрой Софьей. За время своего существования башня использовалась для разных целей, включая размещение казарм, учебного заведения, водного резервуара и даже торгового склада. В 1934 году советское руководство решило снести башню в рамках реконструкции Москвы."
 mos_chosen_rada_decision.title: "Избранная рада"
 mos_chosen_rada_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] слишком властны; их влияние препятствует сосредоточению власти в руках одного государя, а значит — быстрому принятию решений. Впрочем, выход есть: можно учредить особый избранный совет, который будет неподвластен влиянию бояр. Мы сможем быстрее решать державные вопросы и даже проводить различные преобразования. Вероятно, в раду [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], среди всех прочих, посадит своих близких друзей — это [alexi_adashev.GetName] и [sylvestr_the_priest.GetName]."
 mos_chosen_rada_decision.desc.entry: "Совет любимцев подчиняется государю; $nobles_estate$ же не подчиняется никому, и в этом вся беда. Поставив $name_alexander.east_slavic_language$ $adashev$ и $name_silvester.east_slavic_language$ в центре управления, мы перенесём решения из собрания в комнату, которую действительно контролируем."
 mos_chosen_rada_decision.a: "Грозная и действенная сила."
 mos_chosen_rada_decision.b: "Такой совет будет бессилен."
 mos_chosen_rada_decision.tt3: "Александр Адашев и Сильвестр будут арестованы и казнены; этому рады [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]"
 enable_chosen_rada_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,chosen_rada_reform,X #L «Избранная рада»#!#!"
 mos_chosen_rada_decision.historical_info: "Избранная рада — группа приближённых Ивана Грозного, сыгравшая значительную роль в истории Русского государства в первые годы правления царя. В неё входили, помимо прочих, такие деятели, как Алексей Адашев и духовник Сильвестр — доверенные советники великого князя, без которых невозможна была бы централизация царской власти, проведение правовых реформ и решение части стоявших перед государством вопросов."
 rus_russian_absolutism_decision.title: "Полный пересмотр управления государством"
 rus_russian_absolutism_decision.desc: "Стало совершенно очевидно, что управление #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! требует иного, современного подхода. Пора избавиться от устаревших обычаев и бесполезных методов. Если [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] будет обладать мощной законодательной властью, а [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'её', 'его')] указы будут незамедлительно исполняться единым учреждением, то никакое мздоимство и никакие жалобы не смогут помешать преобразованиям в державе."
 rus_russian_absolutism_decision.desc.entry: "Указ, которому нужно пережить совет прежде, чем встретиться с действительностью, уже наполовину обречён на неудачу. Сосредоточив власть в руках государя и единого согласованного министерства, мы позволим реформам обойти те жалобы и отсрочки, что похоронили все прежние попытки."
 rus_russian_absolutism_decision.a: "Это станет новой вехой в истории страны."
 rus_russian_absolutism_decision.b: "Старые порядки были лучше!"
 enable_russian_absolutism_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,russian_absolutism,X #L «Абсолютизм»#!#!"
 rus_russian_absolutism_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] в ярости от пренебрежения их правилами и привилегиями"
 rus_russian_absolutism_decision.historical_info: "Устаревшие средневековые методы государственного управления Пётр I заменил действенной автократией: так, в 1711 году он отменил Боярскую думу и учредил вместо неё Сенат — высший орган государственной власти, отвечавший за управление страной, поступление средств в казну и составление законов. В Сенате была установлена строгая армейская дисциплина: за заседаниями надзирали штаб-офицеры гвардии."
 rus_state_controlled_church_decision.title: "Правительственный надзор"
 rus_state_controlled_church_decision.desc: "Влияние патриаршества на нашу державу крайне велико — оно мешает вводить необходимые новшества, поскольку цепко держится за старые обычаи и свою власть, а потому его следует распустить и провести такие преобразования, которые укрепят власть государства над церковью и даже подчинят её."
 rus_state_controlled_church_decision.a: "Распустим патриаршество."
 rus_state_controlled_church_decision.b: "$common_string_leave_them_be$"
 rus_state_controlled_church_decision.c: "Это дело можно решить деньгами."
 rus_state_controlled_church_decision.tt1: "Святейший синод введёт строгую цензуру на все издания"
 rus_state_controlled_church_decision.historical_info: "В 1721 году Пётр I, стремившийся подчинить православную церковь государству, упразднил московское патриаршество. Вместо него был учреждён Святейший синод — орган церковного управления, одобренный верховной властью. Члены его занимались, помимо прочего, преследованием инакомыслящих и цензурой различных произведений. Самого царя в Синоде представлял обер-прокурор."
 rus_academy_of_sciences_decision.title: "Академия наук"
 rus_academy_of_sciences_decision.desc: "Жителям #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! необходимо прививать знания и воспитывать в них любовь к наукам, чтобы наша держава достойно смотрелась среди равных. Для этого предлагается основать в столице академию наук, где учащиеся будут штудировать математику, астрономию, физику, химию и многое другое, а заодно совершать новые открытия."
 rus_academy_of_sciences_decision.desc.entry: "Великая держава, что заимствует свою математику и физику у других, всегда будет отставать от тех держав, что создают их сами. Академия наук в нашем новом городе объявит, лучше всякой победы, что $RUS$ намерена встать в ряды последних."
 rus_academy_of_sciences_decision.a: "Сила наших умов должна быть сопоставима с силой нашей армии."
 rus_academy_of_sciences_decision.b: "Переговоры — залог успеха."
 rus_academy_of_sciences_decision.tt1: "Василий Татищев способствует учреждению академии и развитию #TOOLTIP:LOCATION,neva,X $tt_op_L$Санкт-Петербурга$tt_cl_2$"
 rus_academy_of_sciences_decision.tt2: "В коллекции академии появятся работы Якова Брюса; благодаря этому учёные получат новые источники"
 rus_academy_of_sciences_decision.tt3: "Лучшие умы #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_GEN')|L]#!#! будут вести обстоятельную переписку с другими европейскими образовательными учреждениями, обмениваться идеями и предпочтут разговоры вражде"
 rus_academy_of_sciences_decision.historical_info: "Вернувшись из Великого посольства (дипломатической миссии в Европу), Пётр I основал в Санкт-Петербурге академию наук. За образец он взял Парижскую академию наук, а также Королевское общество в Лондоне — заведения, также посвящённые научным исследованиям. Императорская академия наук сыграла важную роль в развитии российской научной и культурной мысли."
 rus_manifesto_of_freedom_decision.title: "Манифест о вольности"
 rus_manifesto_of_freedom_decision.desc: "Стабильность и сильный правитель — необходимые условия процветания державы. Сейчас [ROOT.GetCountry.GetGovernment.GetRuler.GetName] не пользуется популярностью среди подданных, в стране зреет недовольство. Пока положение не исправится, мы обязаны делать всё, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] сплотились вокруг монарха. Правительство могло бы пойти на уступки #TOOLTIP:POPTYPE,nobles,X #L дворянам#!#!, дать им освобождение от государственной службы и другие свободы. Это даст нам время укрепить пока ещё хрупкие основы абсолютной монархии."
 rus_manifesto_of_freedom_decision.desc.entry: "Самодержец с недовольным $nobles_estate$ на деле не так уж и самодержавен. Освободив $nobles_estate$ от обязательной службы, государство лишается их долга, но получает $nobles_estate$, у которого гораздо меньше причин для заговоров, пока трон обретает устойчивость."
 rus_manifesto_of_freedom_decision.a: "Это необходимое зло."
 rus_manifesto_of_freedom_decision.b: "Нужно попробовать найти компромисс."
 rus_manifesto_of_freedom_decision.c: "Возмутительное предложение!"
 rus_manifesto_of_freedom_decision.tt1: "Пока страной правит [target_root_country.GetGovernment.GetRuler.GetName], [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] сохранят все свои обширные привилегии"
 revoke_manifesto_of_freedom: "Обширные привилегии, которыми пользуются [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], останутся в силе, пока не умрёт даровавший их монарх."
 rus_manifesto_of_freedom_decision.tt2: "[target_root_country.GetGovernment.GetRuler.GetName] столкнётся с сопротивлением знати — [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] будут мешать [Select_CString(target_root_country.GetGovernment.GetRuler.IsFemale,'её', 'его')] власти на каждом шагу"
 rus_manifesto_of_freedom_decision.historical_info: "Публикация #italic  Манифеста о вольности дворянства#! — одно из ключевых событий непродолжительного царствования Петра III. Резкая смена геополитической ориентации, лишившая Россию крупной военной победы над Пруссией, оттолкнула от молодого императора большую часть дворянства. Чтобы заручиться их поддержкой и укрепить своё положение, Пётр сократил дворянские повинности, а для оплаты возросших расходов изъял церковные земли — что, в свою очередь, вызвало недовольство духовенства. Его упорное стремление ввести в армии муштру по прусскому образцу едва не спровоцировало военный мятеж. Всё это подтолкнуло Екатерину, жену Петра, организовать переворот с целью свержения мужа."
 rus_speransky_liberalization_decision.title: "Близятся перемены"
 rus_speransky_liberalization_decision.desc: "[mikhail_speransky.GetName] — человек современных взглядов. [Select_CString(mikhail_speransky.IsFemale, 'Она', 'Он' )] всеми силами стремится внедрить в державе новый конституционный строй, ради чего днями и ночами заседает в совете. Так пусть ветер перемен наполнит наши паруса, а компас либерализма укажет нам путь!"
 rus_speransky_liberalization_decision.desc.entry: "$name_michael.east_slavic_language$ $Speransky$ годами составлял конституцию, дать которую до сих пор никто не решился. Поддержав его сейчас, мы обязываем себя к реформам, чей облик нам не под силу предугадать вполне, — именно поэтому все государи до нас предпочли подождать."
 rus_speransky_liberalization_decision.a: "Держать по ветру!"
 rus_speransky_liberalization_decision.b: "Это провокационно и опасно."
 enable_speransky_liberalization_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,speransky_liberalization_reform,X #L «Либеральные реформы Сперанского»#!#!"
 rus_speransky_liberalization_decision.tt1: "На территории #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_GEN')|L]#!#! внедряются современные методы управления, чему противостоят [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]"
 rus_speransky_liberalization_decision.historical_info: "В эпоху реформатора Александра I произошли значительные изменения: так, в 1802 году было учреждено восемь министерств, пришедших на смену устаревшим и неповоротливым коллегиям. Немалое влияние на деятельность императора оказывал Михаил Сперанский — главный советник Александра и сторонник модернизации."
 rus_free_economic_society_decision.title: "Вольное экономическое общество"
 rus_free_economic_society_decision.desc: "Agriculture remains a staple in our society, yet the cultivation methods and farming techniques used by the [ShowPopTypeName('peasants')] are static and low-yielding in comparison to competing powers. For a modest cost, power architect [grigory_orlov.GetName] has proposed the creation of an economic organization to advance the knowledge in agriculture and commerce, and has also offered to take on a leading role in its administration.\n\nShould the organization succeed, it must also aim to improve the education of farmers and promote the training of skilled workers by providing practical advice and publishing journals and research papers on the topic."
 rus_free_economic_society_decision.desc.entry: "Крестьянин, что пашет так же, как пахал его дед, накормит не больше ртов, чем дед его накормил. $name_gregory.east_slavic_language$ $Orlov$ предлагает, по собственному почину и за скромную цену, основать общество, обучающее лучшим приёмам хозяйствования, хотя обещания журналов и школ для землепашцев выходят далеко за пределы первоначальной просьбы."
 rus_free_economic_society_decision.a: "Без пропитания жизнь невозможна."
 rus_free_economic_society_decision.b: "Наш путь будет другим."
 STATIC_MODIFIER_NAME_potato_varieties_introduced: "Внедрены новые виды картофеля"
 rus_free_economic_society_decision.tt1: "Общество внедрит новые виды #TOOLTIP:GOODS,potato,X #L картофеля#!#! и прорывные способы земледелия, чем поможет увеличить урожаи"
 rus_free_economic_society_decision.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] будут рады всему, что поможет им сохранить власть над #TOOLTIP:POPTYPE,peasants,X #L крестьянами#!#!"
 rus_free_economic_society_decision.historical_info: "Вольное экономическое общество — научное общество, основанное Григорием Орловым при поддержке императрицы Екатерины II, которая хорошо понимала, что методы земледелия в России значительно устарели, а страна отстала от других великих держав, в особенности Великобритании. Общество выпускало пособия по новым методам ведения сельского хозяйства, помогало выращивать в России новые культуры и занималось образованием земледельцев, чтобы те производили больше урожая."
 rus_imperial_academy_arts_decision.title: "Императорская академия художеств"
 rus_imperial_academy_arts_decision.desc: "Смелый деятель [ivan_shuvalov.GetName] твёрдо намерен довести начатую им реформу образования до конца. Немалую важность для него имеет поддержка культуры — Шувалов собирается учредить академию, где лучшие преподаватели помогут студентам постигать искусство и архитектуру. Самым одарённым учащимся он будет выделять средства на поездки в ведущие города Европы. Это начинание следует всячески приветствовать: #L [ROOT.GetCountry.GetAdjective|l]ий#! народ должен впитать лучшие культурные веяния, а #TOOLTIP:LOCATION,neva,X #L Санкт-Петербург#!#! — стать светочем классицизма."
 rus_imperial_academy_arts_decision.desc.entry: "$name_john.east_slavic_language$ $Shuvalov$ уже провёл реформу училищ; теперь он желает основать академию, что отправляла бы наших самых способных живописцев и зодчих учиться за границу и возвращала бы художников, достойных того, чтобы [ShowLocationName('neva')] более не заимствовала вкус у Европы."
 rus_imperial_academy_arts_decision.a: "Великодушное предложение."
 rus_imperial_academy_arts_decision.b: "Обязанности перед советом важнее."
 rus_imperial_academy_arts_decision.c: "Лучшее — враг хорошего."
 rus_imperial_academy_arts_decision.tt1: "Благородный Григорий Орлов пожертвует академии значительную долю своей художественной коллекции"
 rus_imperial_academy_arts_decision.tt2: "Иван Шувалов уделяет всё время службе в [Concept('cabinet', 'совете')|e] и достигает значительных высот"
 rus_imperial_academy_arts_decision.tt3: "Архитектура переживёт очередное возрождение"
 rus_imperial_academy_arts_decision.historical_info: "Императорская академия художеств — санкт-петербургская академия, основанная в 1757 году чиновником и подвижником искусства Иваном Шуваловым по подобию европейских академий. Здесь изучали неоклассицизм, нередко — с помощью приглашённых из Европы преподавателей."
 mos_moscow_orphanage_decision.title: "Воспитательный дом"
 mos_moscow_orphanage_decision.desc: "Член кабинета [ivan_betskoy.GetName] выдвигает достойную внимания мысль о том, как справиться с одним из величайших, по общему мнению, зол нашего времени — оставлением новорождённых детей на произвол судьбы. Предлагается устроить надёжный приют для несчастных, обеспечивая их пропитанием и обучением грамоте, дабы они выросли достойными членами общества. Вопрос о том, кто будет оплачивать это предприятие, остаётся открытым, но рассматривается несколько возможных решений для его содержания."
 mos_moscow_orphanage_decision.desc.entry: "Ребёнок, оставленный при рождении, ничего не стоит государству сегодня, но обходится ему весьма дорого спустя двадцать лет, так или иначе. $name_john.east_slavic_language$ $Betskoy$ предлагает устроить приют, который вместо этого воспитает их полезными подданными, — было бы лишь кому оплатить это дело."
 mos_moscow_orphanage_decision.a: "Выгодное вложение."
 mos_moscow_orphanage_decision.b: "Достойное дело."
 mos_moscow_orphanage_decision.c: "Каждому своё."
 mos_moscow_orphanage_decision.tt1: "Воспитательный дом откроет несколько филиалов банка, заведующих займами и сбережениями для поддержания работы"
 mos_moscow_orphanage_decision.tt2: "Казна обеспечит щедрое финансирование"
 mos_moscow_orphanage_decision.historical_info: "В 1763 году по инициативе министра и сторонника образовательных реформ Ивана Бецкого и по указу императрицы Екатерины II был открыт Московский императорский воспитательный дом. Толчком к открытию этого учреждения послужили распространявшиеся тогда в Европе и в России идеи Просвещения. Смертность в воспитательном доме была высокой, а помощь брошенным детям — недостаточной, однако некоторые из них впоследствии всё-таки смогли благодаря предоставленному там образованию поступить на службу."
 rus_institute_of_noble_maidens_decision.title: "Институт благородных девиц"
 rus_institute_of_noble_maidens_decision.desc: "Женское образование для многих всё ещё остаётся предметом горячих споров. Среди его сторонников [ivan_betskoy.GetName], созвавший заседание совета с намерением учредить заведение, которое даст государству образованных женщин, одинаково полезных и семье, и обществу. Нам остаётся лишь определиться, где именно будет располагаться это передовое училище, после чего можно будет приступить к воспитанию нового поколения, чей разум не будет замутнён дурным влиянием невежественных родителей."
 rus_institute_of_noble_maidens_decision.desc.entry: "Дочь, воспитанная лишь для домашних забот, не сумеет управлять ничем сверх того. $name_john.east_slavic_language$ $Betskoy$ хочет создать учреждение, которое научит молодых женщин большему, полагая, что образованная мать вырастит более способное поколение, чем невежественная."
 rus_institute_of_noble_maidens_decision.a: "Построить его."
 rus_institute_of_noble_maidens_decision.b: "Сделаем из него Новодевичий монастырь."
 rus_institute_of_noble_maidens_decision.c: "Это угроза устоявшемуся порядку."
 rus_institute_of_noble_maidens_decision.tt1: "Все девицы, чьи родители — [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], получат копии устава"
 rus_printed_charters: "Копии устава"
 rus_institute_of_noble_maidens_decision.historical_info: "Институт благородных девиц, основанный Иваном Бецким при содействии Екатерины II, — первое в России учебное заведение для женщин. Его воспитанницы получали благородное образование, в частности изучали Вольтера и Локка. Поступить в заведение можно было только в очень юном возрасте. Девочек на шесть лет отлучали от родителей. Финансировался он ежегодными поступлениями из казны, а обучаться в институте поначалу могли только дворянские дочери."
 mos_nakaz_decision.title: "Наказ"
 mos_nakaz_decision.desc: "Необходимость скорейшего вступления #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! в эпоху развития и просвещения всё более очевидна. Важным аспектом этого процесса станет радикальный пересмотр свода законов в соответствии с европейскими принципами разума, справедливости и гуманизма. Приняв эти ценности, мы наконец-то избавимся от устаревших правовых практик, которые лишь тормозят общественное развитие. Стране пора встать на путь реформ и гарантировать равенство всех её жителей перед законом."
 mos_nakaz_decision.desc.entry: "A legal code inherited rather than written reflects the century that wrote it, not the one we live in. Rebuilding it around reason and equality before the law would put $RUS$ in step with the ideas now sweeping Europe, at the cost of every custom that code currently protects."
 mos_nakaz_decision.a: "Прогресс бывает болезненным."
 mos_nakaz_decision.b: "Лучше ограничимся реформой уголовных наказаний."
 mos_nakaz_decision.c: "Это слишком рискованно."
 enable_nakaz_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,nakaz_reform,X #L «Наказ»#!#!"
 mos_nakaz_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] будут возмущены покушением на свои привилегии"
 mos_nakaz_decision.tt2: "В отсутствие полноценных социальных реформ более гуманное отношение к преступникам приведёт к росту преступности в крупных городах"
 mos_nakaz_decision.tt3: "Уступки консерваторам приведут к усилению их позиций"
 mos_nakaz_decision.historical_info: "#italic  Наказ «Комиссии о составлении проекта нового Уложения»#! — свод законов, составленный Екатериной II с целью реформирования и модернизации правовой системы. Написанный под влиянием идей Просвещения, «Наказ» требовал привести законодательство в соответствие с господствовавшей в то время прогрессивной философией, а также упростить и уточнить действующие законы. Он вводил более гуманные наказания, ограничивал применение пыток и подчёркивал равенство всех подданных перед законом. «Наказ» не был реализован в полной мере из-за сопротивления мощных консервативных сил, и в конце концов вниманием Екатерины завладели иные идеи."
 rus_intellectual_movements_decision.title: "Пробуждение национализма"
 rus_intellectual_movements_decision.desc: "В последнее время учёные активно спорят о роли #TOOLTIP:CULTUREGROUP,slavic_group,X #L славянской#!#! культуры и пытаются дать ей определение. Спорящие разделились на два лагеря — одни считают, что мы должны ориентироваться на Запад, иначе #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! не удастся освободиться от груза прошлого, другие же превозносят важность традиций, лежащих в основе [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой самобытности. Из этого противостояния родились два отчётливо выраженных интеллектуальных движения, каждое из которых обладает собственным видением будущего страны. Пора решить, кто из них в большей степени выражает наши собственные интересы."
 rus_intellectual_movements_decision.desc.entry: "Учёные разошлись во мнениях: стоит ли сохранять [ShowCultureGroupName('slavic_group')] самобытность в неприкосновенности или пожертвовать ею ради западного прогресса, и спор превратился в противостояние двух лагерей, которые не могут оба определять будущее $RUS$. Выбор между ними не разрешит спор — другая сторона молча не смирится."
 rus_intellectual_movements_decision.a: "Мы поддержим славянофилов."
 rus_intellectual_movements_decision.b: "Мы поддержим западников."
 rus_intellectual_movements_decision.custom1: "Открывает [Concept('law', 'правило')|e] #TOOLTIP:LAW,intellectual_movements,X #L «Движения интеллектуалов»#!#!"
 rus_intellectual_movements_decision.custom2: "[Concept('policy', 'Политику')|e] в рамках [Concept('law', 'правила')|e] #TOOLTIP:LAW,intellectual_movements,X #L «Движения интеллектуалов»#!#! можно менять не чаще чем раз в десять лет"
 rus_intellectual_movements_decision.historical_info: "Западники и славянофилы — противоборствующие интеллектуальные и идеологические течения в России XIX века. Будущее развитие России, её отношения с Западной Европой, сохранение русской культурной самобытности — всё это было предметом жарких споров между сторонниками двух лагерей. Западники были сторонниками модернизации, они стремились перенять европейские идеи, институты и технологии, в то время как славянофилы выступали за сохранение традиционных русских ценностей, духовности и общинного быта."
 rus_secretnoye_byuro_decision.title: "Канцелярия тайных розыскных дел"
 rus_secretnoye_byuro_decision.desc: "Мятежные элиты #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! выказывают открытое неповиновение властям, и есть опасения, что [current_policy.GetName] уже не в силах удерживать их в узде. Министры-иностранцы в #TOOLTIP:CABINET_ACTION,bironovshchina,X #L правительстве Бирона#!#! предлагают создать особое ведомство для борьбы с бунтовщиками и вольнодумцами. Реорганизованная тайная полиция получит широкий мандат и сможет подавлять любые антиправительственные настроения грубой силой."
 rus_secretnoye_byuro_decision.desc.entry: "Политика, которая лишь сдерживает крамолу, — это не то же самое, что политика, которая её пресекает, и иностранные агенты в бюрократии уже заметили эту разницу. Возрождение кнута и создание особой тайной полиции отвечает на эту жалобу — ценой всякой видимости того, что $RUS$ правит чем-то более мягким, нежели страх."
 rus_secretnoye_byuro_decision.a: "Послушание требует жертв."
 rus_secretnoye_byuro_decision.b: "Мы не опустимся до таких мер."
 enable_secretnoye_byuro_policy: "Открывает [Concept('policy', 'политику')|e] #TOOLTIP:POLICY,secretnoye_byuro_policy,X #L «Тайная канцелярия»#!#!"
 rus_secretnoye_byuro_decision.tt1: "Доступно при условии, что член [Concept('cabinet', 'совета')|e] выполняет [Concept('cabinet_action', 'действие совета')|e] #TOOLTIP:CABINET_ACTION,bironovshchina,X #L «Бироновщина»#!#!"
 rus_secretnoye_byuro_decision.historical_info: "Канцелярия тайных розыскных дел играла важную роль в эпоху правления Анны Иоанновны. Силами этого ведомства императрица подавила своих политических противников, значительно укрепив самодержавную власть. Подследственные часто подвергались жесточайшим пыткам, им отрезали носы или забивали насмерть кнутами из сыромятной кожи. В общей сложности жертвами политических чисток стали около двадцати тысяч дворян."
 rus_proclaim_tsardom_decision.title: "Провозгласить $tsardom$"
 rus_proclaim_tsardom_decision.desc.entry: "Земли Русские собраны, [GetInternationalOrganizationType('tatar_yoke').GetName] разрушено, и правителю, уже совершившему труд, достойный империи, недостаёт лишь имперского титула. Принять его не будет стоить ничего, кроме дерзости, и покажет всем дворам Европы, как именно нас надлежит впредь величать."
 rus_proclaim_tsardom_decision.a: "Пусть наш государь венчается на царство как [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')] всея Руси."
 mos_byzantine_court_ceremonies_decision.a_tt: "Наш правитель вступит в брак с отпрыском византийской правящей династии, при необходимости расторгнув нынешний брак."
 mos_chosen_rada_decision.a_tt: "$name_alexander.east_slavic_language$ $adashev$ и $name_silvester.east_slavic_language$ войдут в наш [court|e]"
 rus_institute_of_noble_maidens_decision.b.tt: "Если он уже существует, мы перестроим [ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')]. В противном случае мы возведём [ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')] в [ShowLocationNameWithNoTooltip('moscow')]"
 rus_nakaz_decision.desc.entry: "Необходимость введения нового свода законов становится всё очевиднее, и многие просвещённые учёные обращаются к нашему правителю с призывом реформировать право. Однако насильственное внедрение реформы может вызвать серьёзное противодействие со стороны некоторых слоёв нашего правительства."
 rus_proclaim_tsardom_decision.desc: "The gathering of the Rus' lands is complete, and the [GetInternationalOrganizationType('tatar_yoke').GetName] is broken. Our [GetCountry('RUS').GetFlavorRank] now stands supreme among the principalities, and our [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] urge us to claim a dignity to match: our sovereign should be crowned [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], heir to the emperors of old and guardian of the [ShowReligionAdjective('orthodox')] faith.\n\nSuch a coronation would proclaim to every court in Europe and every khanate of the steppe that [GetCountry('RUS').GetName] bow to no foreign crown."
 rus_proclaim_tsardom_decision.historical_info: "On 16 January 1547, Ivan IV of Moscow was crowned in the Cathedral of the Dormition within the Kremlin, the first Muscovite ruler to be formally invested with the title of Tsar. Metropolitan Macarius, who had championed the new dignity, placed upon him the Cap of Monomakh, a jeweled fur-trimmed crown that court tradition held to be a gift from the Byzantine emperor Constantine IX to Grand Prince Vladimir Monomakh centuries earlier.\n\nThe new title marked a deliberate break from the older style of Grand Prince, asserting a rank equal to that of an emperor and heir to the fallen Christian empires of the East. Foreign courts were slow to recognize it: it took decades of diplomacy before the Holy Roman Empire and the Papacy accepted Tsar as the equivalent of King, rather than a mere translation of Grand Prince."
