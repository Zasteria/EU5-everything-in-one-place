l_russian:
 eng_yorkist_tradition_decision.title: "Набор бюрократов из среднего класса"
 eng_yorkist_tradition_decision.desc: "С каждым годом искать талантливых людей, способных занимать государственные должности, становится всё сложнее. Уже звучат призывы искать достойных чиновников среди представителей растущего среднего класса — в первую очередь это адвокаты и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Обе стороны с нетерпением ждут нашего решения: осмелимся ли мы пойти на такие перемены?"
 eng_yorkist_tradition_decision.desc.entry: "Средний класс растёт, и потому всё чаще звучат предложения допустить его представителей до государственных должностей. Если мы хотим иметь возможность выбирать достойных и способных людей, стоит расширить круг потенциальных кандидатов и включить в него средний класс."
 eng_yorkist_tradition_decision.a: "Окажем им поддержку."
 eng_yorkist_tradition_decision.b: "Им не место в правительстве."
 enable_yorkist_tradition_policy: "Открывает [Concept('policy', 'политику')|e] #TOOLTIP:POLICY,yorkist_tradition_policy,X #L «Йоркистская традиция»#!#!"
 eng_yorkist_tradition_decision.historical_info: "Назначение представителей среднего класса (преимущественно адвокатов и священников) на правительственные должности — старая традиция английского дома Йорков. Однако не всем нравился такой обычай: аристократы и даже некоторые священнослужители считали, что такой привилегии достойны только люди высокого происхождения или что она должна исходить от Господа."
 eng_court_of_the_star_chamber_decision.title: "Суд Звёздной палаты"
 eng_court_of_the_star_chamber_decision.desc: "Сейчас правосудие вершится в соответствии с положениями, которые закреплены #TOOLTIP:POLICY,common_law_policy,X #L общим правом#!#!. Однако судопроизводство движется невероятно медленно, поскольку в основе его лежат прецеденты и решения судей. Вынесение приговоров по отдельным делам может занимать недели, а иногда и месяцы. Некоторые считают, что пора учредить отдельную инстанцию с более широкими возможностями, которая могла бы рассматривать дела, слишком сложные для обычных судов. Однако в таком случае есть вероятность, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] укрепят свою власть и смогут подавлять несогласных и наказывать инакомыслящих."
 eng_court_of_the_star_chamber_decision.desc.entry: "Мы традиционно вершим правосудие на основе прецедента, однако из-за этого рассмотрение дел неизбежно затягивается, а вынесения решений приходится ждать слишком долго. Второй суд, который будет свободен устанавливать собственный порядок, мог бы быстро разрешать подобные дела. Со временем такая практика вошла бы в привычку, и правители бы только выиграли от неё."
 eng_court_of_the_star_chamber_decision.a: "Без такого инструмента не обойтись."
 eng_court_of_the_star_chamber_decision.b: "У нас есть общее право — этого пока достаточно."
 enable_court_of_the_star_chamber_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,court_of_the_star_chamber_reform,X #L «Суд Звёздной палаты»#!#!"
 eng_court_of_the_star_chamber_decision.historical_info: "Звёздная палата, набравшая влияние в эпоху правления Генриха VII, возникла как отделение королевского тайного совета. Своё название она получила от украшенного звёздами потолка в зале Вестминстерского дворца, где проходили заседания. В 1487 году палата получила статус отдельного судебного органа, который был независим от совета и занимался рассмотрением ходатайств о возмещении ущерба."
 eng_benevolence_tax_decision.title: "Учредить добровольный налог"
 eng_benevolence_tax_decision.desc: "Благодаря искусному управлению державой, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'восстановила', 'восстановил')] могущество и стабильность #L [ROOT.GetCountry.GetAdjective|l]ой#! монархии, пошатнувшиеся в годы #TOOLTIP:DISASTER_TYPE,war_of_the_roses,X #L Войны роз#!#!. Вместо трат на роскошь — только разумные затраты и внимание к каждой мелочи. Казна же пополняется с помощью нового, достаточно строгого принципа налогообложения."
 eng_benevolence_tax_decision.desc.entry: "Правитель, привыкший тратить мало и считать каждую монету, поневоле начинает замечать, сколько тратят окружающие. Наступивший после #TOOLTIP:DISASTER_TYPE,war_of_the_roses,X #L Войны роз#!#! мир укрепил положение казны, и вместе с тем позволил правителю обратить взор на кошельки богачей."
 eng_benevolence_tax_decision.a: "Да здравствуют мир и процветание."
 eng_benevolence_tax_decision.b: "Погреемся в лучах стабильности."
 eng_benevolence_tax_decision.a.custom: "Открывает [Concept('government_reform', 'государственный принцип')|e] «#TOOLTIP:GOVERNMENT_REFORM,benevolence_tax_reform,X #L «Добровольный налог»#!#!»"
 eng_benevolence_tax_decision.historical_info: "Генрих VII укрепил не только собственную власть, но и государственный бюджет. По рекомендации своего советника Джона Мортона он установил так называемые «добровольные» налоги, считая, что если кто-то живёт скромно, значит, он экономит деньги, а потому может позволить себе передавать накопления в казну; если же кто-то живёт богато, значит, он не стеснён в средствах, а значит, налог его не обременит."
 eng_council_of_the_north_decision.title: "Совет Севера"
 eng_council_of_the_north_decision.desc: "Нам сообщают, что королевское правосудие в северных графствах находится в удручающем состоянии. Этому способствует, помимо прочего, тот факт, что [ROOT.GetCountry.GetCapital.GetName] слишком далеко. Если основать на севере независимый совет (для этого отлично подойдёт [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetName]), пользующийся определённой властью, вершить там правосудие будет проще."
 eng_council_of_the_north_decision.desc.entry: "Какой толк в правосудии, ради которого приходится три недели скакать на лошадях? Если наделить совет в #TOOLTIP:LOCATION,york,X #L Йорке#!#! собственными полномочиями, он мог бы разбирать дела северных графств на месте и не ждать, пока его петиции пересекут всю страну. Ценой этого будет лишь передача части власти, которой мы всё равно уже не успеваем пользоваться сами."
 eng_council_of_the_north_decision.a: "Отличный план."
 eng_council_of_the_north_decision.b: "Бюрократия — плохой выбор."
 eng_council_of_the_north_decision.b_tt: "Все районы #TOOLTIP:AREA,northumbria_area,X #L Нортумбрии#!#! получат [Concept('modifier', 'модификатор')|e] «[ShowModifier('lack_of_conciliar_justice')]»"
 STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "Слабость правосудия"
 eng_council_of_the_north_decision.historical_info: "Совет Севера — административный орган, основанный ради установления прямой власти над северными графствами. Члены совета не только поддерживали порядок, но и следили за тем, чтобы подданные сохраняли верность короне. В 1641 году, когда в Англии началась гражданская война, совет был распущен."
 eng_austere_monastic_life_decision.title: "Реформирование монастырей"
 eng_austere_monastic_life_decision.desc: "[ROOT.GetCountry.GetName] — страна чересчур богатых религиозных орденов. Реформисты больше не в силах с этим мириться. Недовольство церковью всё чаще проявляют и простые [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] — они считают, что та располагает слишком большой властью.\n\nВозможно, ещё не поздно попытаться разрушить сложившийся порядок и напомнить священнослужителям, что аскеза и затворничество превыше всего.\n\nОбщее количество подсчитанных нами монастырей: #Y  [ROOT.GetVariable('num_of_monasteries').GetValue]#!."
 eng_austere_monastic_life_decision.desc.entry: "Для бедняков нет ничего обиднее, чем видеть богатого отшельника. Реформисты твердят об этом не первый год, и простолюдины уже начинают с ними соглашаться. Все будут рады, если монашеские ордены вернутся к своим первоначальным обетам — кроме самих орденов."
 eng_austere_monastic_life_decision.a: "Проведём реформу."
 eng_austere_monastic_life_decision.a.custom: "Монахи покидают свои ордена; теперь они вновь [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l]"
 eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$"
 eng_austere_monastic_life_decision.b.custom: "#TOOLTIP:POPTYPE,clergy,X #L Священники#!#! в монашеских орденах получают [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 eng_austere_monastic_life_decision.tt: "Распустить монастыри будет нельзя без отмены этой [Concept('privilege', 'привилегии')|e]"
 eng_austere_monastic_life_decision.historical_info: "Роспуск монастырей — масштабный процесс, сопровождавший движение Реформации в Англии XVI века. Начало ему положил первый советник короля Томас Кромвель, который стремился искоренить сложившуюся монастырскую систему, он воспринимал её как продолжение Римской католической церкви. Роспуск привёл к закрытию монастырей, аббатств и конвентов по всей стране."
 eng_navy_board_decision.title: "Флотская коллегия"
 eng_navy_board_decision.desc: "Нельзя не признавать, что наши границы уязвимы; враг может в любой момент начать вторжение, и тогда держава падёт. Чтобы обеспечить надлежащую оборону #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, необходимо взять под контроль моря, омывающие наш остров, — тогда любая попытка захватить наши земли будет безрезультатной.\n\nЕсли расширить логистические возможности и упростить управление флотом, мы сможем заодно укрепить кораблестроительную отрасль, а также содержать более крупный флот с меньшими затратами."
 eng_navy_board_decision.desc.entry: "Остров безопасен лишь настолько, насколько безопасны окружающие его воды, и в наших водах сейчас господствуют чужие корабли. Если объединить верфи, склады и снабжение под началом единого ведомства, мы сможем содержать больше кораблей за те же деньги. Пожалуй, сейчас это единственный разумный способ расширить флот."
 eng_navy_board_decision.a: "Поступим так, как того требуют обстоятельства."
 eng_navy_board_decision.b: "Нет ничего важнее армии."
 enable_navy_board_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,navy_board_reform,X #L «Флотская коллегия»#!#!"
 eng_navy_board_decision.historical_info: "В эпоху правления короля Генриха VIII (XVI век) была основана Флотская коллегия — военно-морское ведомство, занимавшееся в том числе кораблестроением и логистикой. Под руководством короля коллегия увеличивала численность и мощь английского флота, стремясь сделать его грозной силой, способной защитить державу от любого вторжения."
 eng_grand_remonstrance_decision.title: "Великая ремонстрация"
 eng_grand_remonstrance_decision.desc: "Представитель парламента вручил нам список злоупотреблений короны, направленный, как считают депутаты, на исправление нашего подхода к коррупции и влияния духовенства на государственные дела. Они подчёркивают, что [ROOT.GetCountry.GetGovernment.GetRuler.GetName] уже слишком долго правит, не созывая парламент, а потому опасаются за сохранность своих прав и привилегий при неограниченной власти монарха.\n\nСоставителей списка беспокоит также и то, что среди советников короля числятся [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Их присутствие воспринимается как вмешательство церкви в политику державы. Депутаты выдвинули предложение запретить священникам занимать должности в совете. В ответ парламент будет более благосклонно относиться ко всем последующим предлагаемым законам."
 eng_grand_remonstrance_decision.desc.entry: "Парламент изложил свои претензии письменно — так поступают, когда хотят не просто быть услышанными, но и получить ответ. Депутаты требуют ограничить власть монархии и удалить священников из правительства. Взамен они намекают на готовность к сотрудничеству, которой мы не видели уже много лет."
 eng_grand_remonstrance_decision.a: "Составим тщательно сформулированный отказ."
 eng_grand_remonstrance_decision.b: "Согласиться с условиями."
 eng_grand_remonstrance_decision.c: "Попытаемся договориться о компромиссе."
 eng_grand_remonstrance_decision.tt1: "Парламент может ответить враждебно и попытаться любыми средствами ограничить королевскую власть"
 STATIC_MODIFIER_NAME_grand_remonstrance_refused: "Великой ремонстрации отказано"
 eng_grand_remonstrance_decision.b.custom: "Вводится [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,grand_remonstrance_reform,X #L «Великая ремонстрация»#!#!"
 eng_grand_remonstrance_decision.c.custom1: "[target_root_country.GetGovernment.GetRuler.GetName] не обладает большим дипломатическим опытом, поэтому вероятность успеха низка"
 eng_grand_remonstrance_decision.c.custom2: "[target_root_country.GetGovernment.GetRuler.GetName] обладает относительно большим дипломатическим опытом, поэтому есть шанс убедить достаточно депутатов"
 eng_grand_remonstrance_decision.tt2: "Итог компромисса может оказаться неблагоприятным"
 eng_grand_remonstrance_decision.historical_info: "Великая ремонстрация — политический документ, предъявленный в 1641 году депутатами парламента английскому королю Карлу I. В этом документе депутаты выразили недовольство властью короля и выдвинули предложения, призванные коренным образом ограничить возможность монарха вмешиваться в парламентское делопроизводство. Помимо этого они выразили опасения перед распространением в стране католицизма и отметили, что советники короля пользуются слишком большим влиянием. Вручение королю Великой ремонстрации привело к резкому всплеску напряжения между монархом и парламентом. Закономерным итогом этого всплеска стала гражданская война."
 eng_overhauled_admiralty_decision.title: "Реформа Совета адмиралтейства"
 eng_overhauled_admiralty_decision.desc: "Чиновник морского ведомства [samuel_pepys.GetName] — многообещающий работник, несмотря на отсутствие опыта жизни на море: он влиятелен, прилежен и талантлив. Такой человек поможет нам провести реформу Совета адмиралтейства и сделать королевских моряков достойнейшими представителями своей профессии."
 eng_overhauled_admiralty_decision.desc.entry: "Во флоте никогда не было недостатка в храбрых капитанах — в отличие от тех, кто мог бы с толком вести учёт корабельных запасов. $name_samuel$ $Pepys$ ни разу не командовал кораблём и, весьма вероятно, именно поэтому лучше всего подходит для этой работы."
 eng_overhauled_admiralty_decision.a: "Пусть [samuel_pepys.GetName] будет секретарём совета."
 eng_overhauled_admiralty_decision.b: "Плоды его труда должны принадлежать нам."
 enable_overhauled_admiralty_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] #TOOLTIP:GOVERNMENT_REFORM,overhauled_admiralty_reform,X #L «Реформированное адмиралтейство»#!#!"
 STATIC_MODIFIER_NAME_samuel_pepys_diligence: "Усердие Сэмюэла Пипса"
 eng_overhauled_admiralty_decision.tt3: "в составе коллегии Пипс упростит организацию действий флота"
 eng_overhauled_admiralty_decision.historical_info: "Благодаря реформам Сэмюэла Пипса королевский военно-морской флот стал отвечать требованиям своего непростого и опасного времени. Пипс внёс изменения в систему снабжения флота (в том числе провизией), а также ввёл регулярные выплаты жалованья матросам и офицерам. Впрочем, запомнился он преимущественно как автор дневника, в котором на протяжении десяти лет тщательнейшим образом описывал каждый день своей жизни — в частности, задокументировал Большой пожар и Великую эпидемию чумы."
 eng_taxation_law_decision.title: "Подоходный налог"
 eng_taxation_law_decision.desc: "Финансовое положение нашей державы оставляет желать лучшего. Очевидна необходимость в реформах. Бытует мнение, что действующая система налогообложения идёт на пользу лишь богачам, в то время как казна почти не получает средств. Член совета [william_pitt_the_younger.GetName] предлагает ввести временный подоходный налог, чтобы обеспечить дополнительный приток средств и распределить их. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], впрочем, не в восторге от этого предложения."
 eng_taxation_law_decision.desc.entry: "От налога, который щадит богачей, мало и денег, и пользы. $name_william$ $Pitt$ предлагает в течение какого-то времени напрямую облагать налогом доходы. И поскольку в рамках этого предложения не остаётся никаких сколько-нибудь существенных льгот, аристократы и священники будут сопротивляться ему до последнего."
 eng_taxation_law_decision.a: "Это честно и вполне в духе времени."
 eng_taxation_law_decision.b: "Нам хватит таможенных пошлин и акцизов."
 eng_taxation_law_decision.c: "Это очень щекотливый вопрос."
 eng_taxation_law_decision.custom: "Открывает [Concept('law', 'правило')|e] #TOOLTIP:LAW,eng_taxation_law,X #L «Налогообложение»#!#!"
 eng_taxation_law_decision.tt: "Парламент будет недоволен пренебрежением столь хрупким финансовым положением #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_GEN')|L]#!#!"
 STATIC_MODIFIER_NAME_temporary_income_tax: "Временный подоходный налог"
 eng_taxation_law_decision.historical_info: "Подоходный налог в Англии был введён в годы Наполеоновских войн, когда стало ясно, что казна плохо справляется с финансовой нагрузкой. Первым идею о таком сборе выдвинул премьер-министр Уильям Питт-младший, разработавший прогрессивный подоходный налог: те, у кого больше доходы, отчисляли в казну больший процент. Недовольство со стороны состоятельных граждан привело к тому, что по окончании войны налог был отменён."
 eng_factory_working_conditions_decision.title: "Закон о фабриках"
 eng_factory_working_conditions_decision.desc: "Заводские рабочие подвергаются безжалостной эксплуатации, труд их опасен для жизни, а жалование слишком низко. В разработке сейчас находятся реформы, которые могли бы их защитить, однако следует учесть, что любая попытка изменить сложившуюся обстановку будет встречена враждебно и, вероятно, даже вызовет спад экономического роста и производства. Тем не менее действовать надо, иначе рабочие просто сбегут."
 eng_factory_working_conditions_decision.a: "Несчастным надо помочь."
 eng_factory_working_conditions_decision.b: "Рабочие — залог роста нашей экономики."
 eng_factory_working_conditions_decision.c: "Пусть проявят немного благодарности."
 eng_factory_working_conditions_decision.custom: "Открывает [Concept('law', 'правило')|e] #TOOLTIP:LAW,factory_working_conditions_law,X #L «Условия труда на фабриках»#!#!"
 eng_factory_working_conditions_decision.historical_info: "Закон о фабриках — важный закон в истории британского рабочего движения, заложивший основу для улучшения условий труда и защиты прав рабочих, в особенности детей, вынужденных работать почти целый день за небольшие деньги. Закон ввёл возрастные ограничения, требования к уровню образования и сделал инспекцию рабочих мест обязательной, а также вынудил владельцев фабрик заняться охраной труда и начать вести трудовые книжки."
 eng_coke_smelting_decision.title: "Инвестировать в работу Дарби"
 eng_coke_smelting_decision.desc: "Металлург [abraham_darby.GetName] разработал новое топливо для доменных печей, получившее название «кокс». От обычного древесного угля он выгодно отличается меньшим содержанием летучих веществ и большей горючестью. Сейчас [abraham_darby.GetNameWithNoTooltip], семье которого принадлежит целый #TOOLTIP:BUILDING_TYPE,iron_foundry,X #L чугунолитейный цех#!#!, испытывает своё изобретение, и результаты получаются многообещающими."
 eng_coke_smelting_decision.desc.entry: "Древесный уголь может дать достаточно жара кузнецу, но для плавильной печи его всё же не хватает. $name_abraham$ $Darby$ научился перерабатывать уголь в более надёжное топливо. Первые опыты в его #TOOLTIP:BUILDING_TYPE,iron_foundry,X #L чугунолитейном цеху#!#! показывают, что вскоре железо можно будет выплавлять в таких количествах, о каких с древесным углём можно было только мечтать."
 eng_coke_smelting_decision.a: "Сделаем применение кокса промышленным стандартом."
 eng_coke_smelting_decision.tt2: "Для нового топлива потребуется ещё больше #TOOLTIP:GOODS,coal,X #L угля#!#!#!"
 enable_coke_smelting_advance: "Открывает [Concept('advance', 'улучшение')|e] «#L #TOOLTIP:ADVANCE_DEFINITION,coke_smelting,X #L Плавка кокса#!#!»"
 unlocked_advance_coke_smelting_tt: "Было принято [Concept('decision', 'решение')|e] «$eng_coke_smelting_decision.title$»"
 eng_coke_smelting_decision.historical_info: "Изобретение плавки кокса Абрахамом Дарби I значительно подстегнуло ход промышленной революции, поскольку перевернуло все сложившиеся подходы к производству железа и тем самым послужило широкому внедрению железа и стали в различные производства. Кроме того, кокс стал применяться в массовом производстве чугуна — немаловажного для промышленной революции материала."
 eng_royal_society_decision.title: "Королевское общество"
 eng_royal_society_decision.desc: "Немало великих изобретений выдающиеся умы нашей державы создали совместно. Сейчас разумно будет учредить независимый орган под управлением собственного совета с центром в городе [ROOT.GetCountry.GetCapital.GetName]. Его члены будут не только заниматься развитием науки, но и открывать обществу глаза на пользу подобных изысканий, а заодно подходить к вопросам политики и образования с научной точки зрения, способствуя разнообразным исследованиям."
 eng_royal_society_decision.desc.entry: "Учёные и без нашей помощи встречаются, переписываются и спорят друг с другом. Им не хватает лишь крыши над головой и официального статуса. Если мы дадим им и то и другое, естествоиспытателям будет проще искать ответы на собственные вопросы, и они всегда будут рядом, если вопросы возникнут у нас."
 eng_royal_society_decision.a: "Превосходная идея."
 eng_royal_society_decision.b: "Лучше вложим средства в университеты."
 eng_royal_society_decision.historical_info: "Королевское общество было создано в 1660 году, в эпоху правления английского короля Карла II. Организаторами стали ведущие учёные того времени, стремившиеся расширять границы научного познания и всеми силами развивать науку. Королевское общество предоставило учёным в области как точных, так и гуманитарных наук, а также различным интеллектуалам возможность встречаться и обмениваться результатами своих исследований, чтобы от гипотез переходить к практике."
 eng_royal_society_decision.tt1: "[target_root_country.GetGovernment.GetRuler.GetName] станет покровителем нового общества"
 eng_royal_academy_of_arts_decision.title: "Королевская академия художеств"
 eng_royal_academy_of_arts_decision.desc: "Нам поступило предложение учредить общество, способствующее разностороннему развитию творчества. Предполагается, что средства предоставит [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. Здесь начинающие художники смогут постигать тонкости своего дела. Каждый год общество будет проводить выставку современного искусства, и принять в ней участие сможет любой желающий."
 eng_royal_academy_of_arts_decision.desc.entry: "Художники, получившие образование за границей, возвращаются не только с новыми навыками, но и с чуждыми идеями. Мы могли бы выделить средства на собственную академию с художественной школой и открытой для всех мастеров ежегодной выставкой. Она позволила бы следующему поколению осваивать это ремесло на родине."
 eng_royal_academy_of_arts_decision.a: "Как искусно! Мы всецело одобряем."
 eng_royal_academy_of_arts_decision.b: "Лучше потратим эти деньги на образование бедняков."
 STATIC_MODIFIER_NAME_increased_educational_spending: "Увеличенные расходы на образование"
 eng_royal_academy_of_arts_decision.historical_info: "Королевская академия художеств — это частное учреждение, способствующее развитию изобразительного искусства и архитектуры. Оно основано в 1768 году группой таких художников, как сэр Джошуа Рейнолдс и сэр Уильям Чемберс. Первым покровителем этого общества среди монархов стал король Георг III. Членство в академии считается крайне престижным и присуждается художникам и архитекторам, внёсшим значительный вклад в соответствующую область деятельности."
 eng_enclosure_act_decision.title: "Закон об огораживании"
 eng_enclosure_act_decision.desc: "Владельцы фабрик и земель обратились к парламенту с прошением. Они просят разрешения взять в частную собственность ещё больше земель общего пользования, чтобы ускорить переселение рабочей силы из сельских районов в города. Перемещение населения получится весьма значительным, однако такой шаг гарантирует обилие рабочей силы и даже сможет увеличить объёмы сельскохозяйственного производства."
 eng_enclosure_act_decision.a: "Переселённый рабочий — трудолюбивый рабочий."
 eng_enclosure_act_decision.a.custom: "Возмущённые [ShowPopTypeName('peasants')|l] поднимают бунт. [Concept('prosperity', 'Процветание')|e] 10 сельских [Concept('locations', 'районов')|e] падает на [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%]"
 eng_enclosure_act_decision.tt: "Закон ускорит урбанизацию и поспособствует индустриализации, однако #L #TOOLTIP:ESTATE_TYPE,peasants_estate,X крестьяне#!#! пострадают"
 enable_enclosure_act_policy: "Открывает [Concept('policy', 'политику')|e] #TOOLTIP:POLICY,enclosure_act,X #L «Закон об огораживании»#!#!"
 enclosure_riots: "Бунты из-за огораживания"
 eng_enclosure_act_decision.historical_info: "Законы об огораживании — череда принятых в Англии законов, направленных на поддержание политики огораживания, то есть на перевод в частную собственность земель и полей общего пользования. Такая политика была сочтена необходимой в свете перехода сельского хозяйства на коммерческую основу и постепенной индустриализации страны. Законы об огораживании усилили социальное неравенство и вызвали массовый отток тысяч лишившихся работы сельских тружеников в города. Такое положение в итоге привело к бунтам обездоленных фермеров и рабочих, которые отстаивали свои традиционные права."
 sco_witchcraft_act_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий закон о колдовстве"
 sco_witchcraft_act_decision.title.entry: "Закон о колдовстве"
 sco_witchcraft_act_decision.desc: "В народе растёт неприязнь к разного рода колдовским практикам, и [target_ruler.GetName] всё чаще получает доносы на ведьм. Среди них есть и обвинения в адрес безобидных лекарей, якобы варивших зелья, и даже рассказы о случаях одержимости бесами. Один крестьянин и вовсе сообщил, что его однажды превратили в ящерицу, но ему чудом удалось вернуть себе человеческий облик.\n\nПравда это или вымысел — одному богу известно, но мы в любом случае должны как-то отреагировать на эту ситуацию. Члены двора предлагают принять новый закон против ведьм, а также просят, чтобы [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'высказала', 'высказал')] своё мнение по этому вопросу."
 sco_witchcraft_act_decision.desc.entry: "Сегодня в суд поступает больше обвинений в колдовстве, чем в кражах. Кому-то придётся решать, какие из них действительно заслуживают судебного разбирательства. Чёткий свод правил мог бы установить для этого ясные правовые основания, хотя у правила против ведьм есть любопытное свойство: обычно после его принятия ведьм становится только больше."
 sco_witchcraft_act_decision.a: "Сохранить закон о колдовстве."
 sco_witchcraft_act_decision.b: "Отменить его."
 sco_witchcraft_act_decision.historical_info: "Шотландский закон о колдовстве 1563 года объявил уголовными преступлениями как собственно магические практики, так и пользование услугами колдуний. Король Яков VI лично принял участие в первых судах над ведьмами по новому закону, которые прошли в Норт-Берике. В 1597 году он написал трактат «Демонология», изобличающий чернокнижников, но впоследствии стал более скептически относиться к этому вопросу и принял меры по ограничению гонений. Всего в Шотландии судили за колдовство около 6000 человек, причем 75% обвиняемых были женщинами. Более 1500 из них были казнены."
 sco_preserve_clan_autonomy_decision.title: "Статут Айоны"
 sco_preserve_clan_autonomy_decision.desc: "Хотя многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] равнинной #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! уже давно отправляют своих наследников в местные школы, #TOOLTIP:CULTURE,$highland_tt$,X #L хайлендские#!#! кланы по-прежнему придерживаются своего традиционного образования.\n\nВ последние годы эти различия стали серьёзной проблемой для нашей державы, поэтому [ROOT.GetCountry.GetGovernment.GetCourtTitle] предлагает обязать наследников этих кланов обучаться в школах низинных регионов.\n\nПодобная мера заметно повысит грамотность будущих аристократов, однако некоторые опасаются, что это также может привести к утрате уникальной культуры и обычаев горцев."
 sco_preserve_clan_autonomy_decision.desc.entry: "Наследники клана, воспитанные у себя дома, верны лишь своему роду. Наследники же, обучавшиеся на юге, верны будут прежде всего своим учителям. Заставив #TOOLTIP:CULTURE,$highland_tt$,X #L хайлендских#!#! вождей поступать именно так, мы вырастим новое поколение лэрдов, которое будет гораздо полезнее нам — и куда менее хайлендским по духу."
 sco_preserve_clan_autonomy_decision.a: "Утвердим этот статут."
 sco_preserve_clan_autonomy_decision.b: "Позволим кланам сохранить независимое образование."
 eng_east_india_company_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ая Ост-Индская компания"
 eng_east_india_company_decision.title.entry: "Ост-Индская компания"
 eng_east_india_company_decision.desc: "Следуя примеру других морских держав, [ROOT.GetCountry.GetName] также стремится к колониальной экспансии. Так, наши исследователи сумели проложить путь к Ост-Индии, и теперь мы можем извлечь выгоду из её несметных богатств, учредив собственную торговую компанию."
 eng_east_india_company_decision.desc.entry: "Путь на восток уже не настолько таинственен, чтобы хранить его в секрете: все наши соперники с выходом к морю уже отправляют по нему свои корабли. Риск далёких плаваний можно переложить на частную компанию с королевской хартией, а корона будет получать свою долю прибыли с возвращающихся грузов."
 eng_east_india_company_decision.a: "Мы воспользуемся этим!"
 eng_east_india_company_decision.b: "Лучше займёмся родной землёй."
 sco_company_of_scotland_decision.title: "Основать Шотландскую компанию"
 sco_company_of_scotland_decision.desc: "Чем больше мы вовлекаемся в заморскую торговлю, тем острее ощущается отсутствие государственного надзора за торговыми путями между континентами. Стоит предоставить достойным людям исключительное право на торговлю и поручить им заниматься организацией морских перевозок и защитой наших вложений."
 sco_company_of_scotland_decision.a: "Это компания принесёт процветание нашей державе!"
 sco_company_of_scotland_decision.b: "Звучит довольно рискованно."
