l_russian:
 spa_establish_the_council_of_castile_decision.title: "Основать $royal_council_of_castile$"
 spa_establish_the_council_of_castile_decision.desc: "Правительство не может эффективно работать, пока в наших владениях применяются разные нормы и законы, а [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] постоянно требуют исполнения их прихотей. Чтобы решить эти проблемы и централизовать управление [ROOT.GetCountry.Custom('rank_ru_INST')|l], [target_character.GetName] предлагает создать #TOOLTIP:GOVERNMENT_REFORM,royal_council_of_castile,X #L Кастильский совет#!#! — руководящий орган, который будет отвечать за сбор налогов, решение судебных вопросов и назначение чиновников. Эту идею горячо поддерживают и реформаторы, и роялисты. По их мнению, это позволит нам использовать ресурсы на благо всей державы, а не только в интересах местной знати."
 spa_establish_the_council_of_castile_decision.desc.entry: "Правление в условиях разрозненности местных норм и законов делает наших правителей зависимыми от того, кто в данный момент обладает властью в каждой из этих юрисдикций. Постоянный орган, состоящий из обученных чиновников, подотчётных исключительно нам, #TOOLTIP:GOVERNMENT_REFORM,royal_council_of_castile,X #L Кастильскому совету#!#!, позволил бы вывести налогообложение, правосудие и назначения на должности за пределы влияния местных интересов."
 spa_establish_the_council_of_castile_decision.a: "Пусть [ROOT.GetCountry.Custom('rank_ru_INST')|l] руководит совет."
 spa_establish_the_council_of_castile_decision.a.entry: "Страной будет руководить совет."
 establish_the_council_of_castile_tt: "Учредим [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]"
 established_the_council_of_castile_tt: "Мы учредили [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')] решением $spa_establish_the_council_of_castile_decision.title$."
 spa_establish_the_council_of_castile_decision.historical_info: "Кастильский совет был создан в конце XV века католическими монархами Фердинандом II и Изабеллой I. Изначально он выполнял роль совещательного органа, но впоследствии был преобразован в главный инструмент управления королевством. Создание совета позволило не только ослабить влияние аристократов и местных правителей, но и передать управление державой в руки профессиональных юристов и чиновников, готовых служить в интересах страны."
