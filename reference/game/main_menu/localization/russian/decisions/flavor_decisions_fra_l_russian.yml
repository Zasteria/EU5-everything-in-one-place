l_russian:
 fra_taille_tax_decision.title: "Введение постоянного налога"
 fra_taille_tax_decision.desc: "В результате кропотливой работы [ruler_fra.GetName|l] всё же [Select_CString(ruler_fra.IsFemale,'завершила', 'завершил')] преобразование финансовой системы #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. В течение многих лет королевская власть лишь иногда, в самых крайних случаях собирала #TOOLTIP:POLICY,exceptional_only,X #L чрезвычайный налог#!#!. Теперь же [ruler_fra.GetShortNameWithNoTooltip|l] планирует ввести постоянный налог. Чтобы избежать возмущения среди влиятельных слоёв населения, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] будут освобождены от уплаты налога, однако [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] вряд ли обрадуются таким переменам."
 fra_taille_tax_decision.desc.entry: "Налог, который вводится лишь на время войны, приходится заново выпрашивать перед каждым новым походом. Если сделать его постоянным, нужда в этих просьбах отпадёт, а аристократы и священники вряд ли станут возражать, если основное бремя ляжет на горожан и простолюдинов."
 fra_taille_tax_decision.a: "Издадим законы."
 fra_taille_tax_decision.b: "Старая система была надёжнее…"
 enables_taille_laws: "У #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! появится доступ к правилу #TOOLTIP:LAW,fra_taille,X #L «Талья»#!#!."
 fra_taille_tax_decision.historical_info: "Во время правления Карла VII финансовая система Франции претерпела некоторые изменения, в числе которых было придание талье статуса постоянного налога. Несмотря на то, что дворяне и священники были освобождены от уплаты тальи, поступления в казну значительно выросли и обеспечили развитие страны после окончания Столетней войны."
 fra_5_percent_tax_decision.title: "[target_character.GetLastNameWithNoTooltip] предлагает пятипроцентный налог"
 fra_5_percent_tax_decision.title.entry: "Пятипроцентный налог $de_machault$"
 fra_5_percent_tax_decision.desc: "[ROOT.GetCountry.GetLongName] — введение здесь #TOOLTIP:LAW,fra_taille,X #L тальи#!#! заменило устаревшую феодальную налоговую систему. Однако со временем привилегии, которыми в рамках тальи пользовались [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], стали слишком негативно влиять на размер собираемых налогов.\n\nДля решения этой проблемы советник по имени [target_character.GetName] предложил взымать #italic 5% от общего дохода#! со всех сословий без исключения. Несмотря на очевидную выгоду такой системы для государственной казны, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] выступили резко против этой инициативы."
 fra_5_percent_tax_decision.desc.entry: "Льготы, дарованные за заслуги столетней давности, и поныне ежегодно обходятся казне в кругленькую сумму. $name_john.french_language$ $name_baptiste$ $de_machault$ предлагает ввести единый налог на доход с земли для всех её владельцев. Сумма невелика, но сама идея для многих совершенно неприемлема — священники и аристократы уже выразили своё решительное недовольство."
 fra_5_percent_tax_decision.a: "Проведём реформу несмотря на протесты."
 fra_5_percent_tax_decision_tt: "$name_john.french_language$ $name_baptiste$ $de_machault$ присоединится к нашему [Concept('court', 'двору')|e]"
 fra_5_percent_tax_decision.b: "Лучше не будем их злить."
 unlocks_machault_tax_reforms: "У #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! появится доступ к правилу #TOOLTIP:LAW,fra_5_percent_tax,X #L «Пятипроцентный налог Машо»#!#!, расширяющему действие #TOOLTIP:LAW,fra_taille,X #L тальи#!#!"
 fra_5_percent_tax_decision.historical_info: "Став в 1745 году генеральным контролёром финансов Франции, Жан-Батист де Машо с ужасом обнаружил, что страна находится на грани банкротства. Ситуация усугублялась тем, что дворяне и священники были полностью освобождены от выплаты тальи. В 1749 году Машо попытался провести реформу налоговой системы, предполагавшую замену 10%-го налога, которым не облагались дворяне и духовенство, единым для всех сословий налогом в размере 5% от общего дохода. Впрочем, эта инициатива столкнулась с ожесточённым сопротивлением, поэтому Машо так и не смог воплотить её в жизнь в полной мере."
 fra_fouage_tax_decision.title: "Подымная подать"
 fra_fouage_tax_decision.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [scope_ruler.GetName] живёт в роскоши и тратит огромные средства на путешествия по #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_DAT')|L]#!#! и содержание [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого дворца в городе [ROOT.GetCountry.GetCapital.GetName], что привело к опустошению казны. Чтобы хоть как-то восполнить бюджет, члены совета предложили ввести #italic подымную подать#! — новый налог, который взымается с [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]их хозяйств за пользование печами. Конечно, [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] будут не в восторге, однако эта подать поможет восполнить [ROOT.GetCountry.GetGovernment.GetAdjective|l]ую казну, не ущемляя [Select_CString(scope_ruler.IsFemale, 'нашу королеву', 'нашего короля' )]. [scope_ruler.GetShortNameWithNoTooltip] продолжит вести привычный образ жизни."
 fra_fouage_tax_decision.desc.entry: "Дворцы, пышные процессии и постоянные разъезды королевского двора не оплачиваются из кармана самого монарха. Подымный налог коснулся бы каждого дома во Франции и быстро пополнил казну. Именно поэтому кабинет министров выказывает ему такое почтение — в отличие от самих жителей этих домов."
 fra_fouage_tax_decision.a: "Введём налог. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] — наше главное достояние."
 fra_fouage_tax_decision.a.entry: "Введём налог. Правители — наше главное достояние."
 fra_fouage_tax_decision.b: "Пока отложим введение налога."
 fra_fouage_tax_decision.c: "[scope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'должна', 'должен' )] знать меру. Казна — не [Select_CString(scope_ruler.IsFemale, 'её', 'его' )] кошелёк."
 fra_fouage_tax_decision.c.entry: "Правитель должен знать меру. Казна — не его кошелёк."
 variable_tt_enabled_fouage_tax: "Введена подымная подать"
 fra_fouage_tax_decision.historical_info: "Изначально подымная подать была введена лишь в некоторых регионах для покрытия расходов [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ого двора, а также для устранения последствий Столетней войны и эпидемии чёрной смерти. Впоследствии её стали собирать и в других областях, а к концу XIV века она была введена почти на всей территории Франции. Этот налог стал одним из основных способов пополнения государственной казны во время правления ряда королей."
 fra_edict_of_toleration_decision.title: "Эдикт Фонтенбло"
 fra_edict_of_toleration_decision.desc: "Распространение идей Реформации буквально потрясло всю #TOOLTIP:CONTINENT,europe,X #L Европу#!#!, из-за чего многие отвернулись от учения #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! церкви и стали исповедовать #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#!. Хотя большая часть населения #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! по-прежнему придерживается католической веры, количество лютеран неумолимо растёт.\n\nОбеспокоенные таким развитием событий, члены правительства просят, чтобы [ruler_fra.GetName|l] [Select_CString(ruler_fra.IsFemale,'издала', 'издал')] #TOOLTIP:POLICY,edict_of_fontainebleau,X #L эдикт Фонтенбло#!#!, который будет направлен на ограничение прав лютеран и других протестантов. Это позволит пресечь пропаганду ложных учений и избежать дестабилизации общества."
 fra_edict_of_toleration_decision.desc.entry: "Веру, что нашла отклик среди купцов и печатников, искоренить куда труднее, нежели простую крестьянскую ересь. #TOOLTIP:RELIGION,$lutheran_tt$,X #L Лютеранских#!#! общин пока немного, и нашему двору предстоит решить: сокрушить их прямо сейчас, издав [ShowPolicyName('edict_of_fontainebleau')], или же научиться жить с ними бок о бок."
 fra_edict_of_toleration_decision.a: "Мы обязаны принять меры для борьбы с ересью."
 fra_edict_of_toleration_decision.b: "К ним стоит относиться более терпимо."
 fra_colonial_ambitions_decision.title: "Возвращение колониальных идей"
 fra_colonial_ambitions_decision.desc: "После десятков лет внутренней нестабильности [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] предлагает вновь попытать удачу в Новом Свете. В прошлом экспедиции помогли нам многое узнать о тех манящих землях, однако с началом Реформации и религиозных конфликтов власти #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! были вынуждены забыть о своих колониальных амбициях. Стоит также учитывать, что если мы снова попробуем закрепиться на американском континенте, это может вызвать недовольство других #TOOLTIP:CONTINENT,europe,X #L европейских#!#! держав, которые уже давным-давно основали там свои поселения.\n\nНекоторые члены правительства и вовсе предлагают отбросить идеи о Новом Свете, а вместо этого основать торговую компанию в #TOOLTIP:CONTINENT,asia,X #L Азии#!#!, что позволит взять под контроль индийские торговые пути."
 fra_colonial_ambitions_decision.desc.entry: "Путь на запад нам давно известен, не хватало лишь спокойного периода дома, чтобы наконец воспользоваться этими знаниями. Пока мы медлили, соперники основательно закрепились на новых землях. Любая наша колония теперь неизбежно окажется на чужой территории — если только мы не обратим взор на богатства #TOOLTIP:CONTINENT,asia,X #L Азии#!#!."
 fra_colonial_ambitions_decision.a: "Пора направить усилия на освоение Нового Света."
 fra_colonial_ambitions_decision.b: "Мы должны установить свою монополию на торговлю в Индии."
 fra_centralize_monarchy_decision.title: "Консолидация апанажей"
 fra_centralize_monarchy_decision.desc: "Спустя сотни лет политической раздробленности корона наконец интегрировала различные апанажи обратно в свои владения. Хотя младшие ветви династии Капетингов проявили себя как надёжные союзники, они также препятствовали централизации государства. Вернув их земли под свой контроль, [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] и его правительство смогут преобразовать #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_ACC')|L]#!#! в более современную державу."
 fra_centralize_monarchy_decision.desc.entry: "Веками апанажами правили королевские родичи, что было удобно, но делало любые реформы невозможными. Теперь же эти земли подчиняются напрямую короне, и владениями, что подвластны единой воле, наконец-то можно управлять как единым государством."
 fra_centralize_monarchy_decision.a: "Это важный шаг к модернизации страны."
 fra_code_louis_decision.title: "Составить проект Кодекса Людовика"
 fra_code_louis_decision.desc: "Уже многие столетия в нашей стране параллельно существуют две системы: в северных провинциях действует правовой обычай, тогда как на юге применяется римское право. Стремясь создать единую для всей державы правовую систему, [fra_ruler.GetName|l] и [Select_CString(fra_ruler.IsFemale,'её', 'его')] ближайшие советники составили #italic «Кодекс Людовика»#! — первый сборник законов, который будет действовать на всей территории #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!.\n\nНесмотря на очевидные преимущества единого свода законов, советники просят не спешить с его внедрением. Они предупреждают, что некоторым южным провинциям может потребоваться время, чтобы привыкнуть к новой системе."
 fra_code_louis_decision.desc.entry: "Перемещаясь из провинции в провинцию, купец меняет не только лошадей, но и правовые нормы. Единый свод правил для всей Франции положил бы этому конец, однако южные провинции держатся за римское право ещё с тех времён, когда и самого нашего королевства ещё не существовало, и вряд ли охотно с ним расстанутся."
 fra_code_louis_decision.a: "Вся страна должна подчиняться одним законам, без исключения."
 fra_code_louis_decision.a.entry: "Все мы должны подчиняться единым правилам, без исключения."
 fra_code_louis_decision.b: "Пока лучше ограничим действие кодекса северными провинциями."
 fra_code_louis_decision.b.entry: "Пока лучше ограничим действие кодекса северными провинциями."
 fra_versailles_residence_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] и Версаль"
 fra_versailles_residence_decision.title.entry: "$nobles_estate$ и Версаль"
 fra_versailles_residence_decision.desc: "Версальский дворец служит не только резиденцией [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой семьи, но и местом для приёма самых важных и почтенных гостей. Изначально дворец был построен как символ могущества и божественного права [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их королей, но с тех пор он также стал своего рода политическим инструментом, поскольку в этом дворце разрешено пребывать лишь тем, кто пользуется благосклонностью монарха.\n\nВ связи с этим советники просят, чтобы [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [fra_ruler.GetName|l] [Select_CString(fra_ruler.IsFemale,'пригласила', 'пригласил')] во дворец членов наиболее влиятельных знатных семей. Это позволит нам заручиться их поддержкой и сосредоточить власть вокруг короны."
 fra_versailles_residence_decision.desc.entry: "Великолепный дворец, полный гостей, в то же время полон заложников. Знатные семьи, что до сих пор цепляются за старые феодальные традиции, можно со всеми почестями пригласить Версаль и уговорить их остаться. И с каждым годом, что они проводят при дворе, они будут представлять всё меньшую угрозу для правителей."
 fra_versailles_residence_decision.a: "Пригласим знатные семьи в Версальский дворец."
 fra_versailles_residence_decision.b: "Дворец принадлежит [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой семье, посторонним в нём не место."
 fra_versailles_residence_decision.b.entry: "Этот дворец строился ради королевской семьи — пусть и остаётся королевским."
 this_may_lead_to_permanent_weakening_of_the_nobility: "Если разрешить им жить в Версале, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] могут навсегда утратить часть своего влияния."
 fra_versailles_permanent_decision.title: "Постоянная резиденция для сословия «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]»"
 fra_versailles_permanent_decision.title.entry: "Постоянная резиденция для аристократов"
 fra_versailles_permanent_decision.desc: "Получив наше приглашение, многие влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] охотно переехали из своих имений в Версаль. Участвуя в пышных [ROOT.GetCountry.GetGovernment.GetAdjective|l]их балах и церемониях, они пребывают словно в экстазе от красоты и богатого убранства дворца, и поэтому готовы выполнить любое поручение, лишь бы [fra_ruler.GetName|l] [Select_CString(fra_ruler.IsFemale,'была к ним благосклонна', 'был к ним благосклонен')]. Можно считать, что наш план полностью удался!\n\nИз некогда бесполезных чертогов Версаль превратился в крайне эффективный рычаг влияния, который буквально вынуждает аристократов расставаться со своей властью. Теперь ни у кого не может быть сомнений: [fra_ruler.GetShortNameWithNoTooltip|l] — [Select_CString(fra_ruler.IsFemale,'неоспоримая и полновластная', 'неоспоримый и полновластный')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашей державы."
 fra_versailles_permanent_decision.desc.entry: "Ловушка захлопнулась куда мягче, чем кто-либо ожидал. $nobles_estate$ теперь соревнуются за комнаты и первенство в нашем дворце, а не за власть в собственных землях. Правитель же, избавившись от соперников, обретает поистине непререкаемый авторитет."
 fra_versailles_permanent_decision.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] проглотили нашу роскошную наживку!"
 fra_versailles_permanent_decision.a.entry: "Великолепие Версаля навсегда затмило блеск аристократии."
 fra_versailles_permanent_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] по-прежнему заслуживают уважения."
 fra_versailles_permanent_decision.b_tt: "Мы сможем выбрать постоянную резиденцию в Версале в другой раз"
 fra_versailles_permanent_decision.b.entry: "Влияние, которым традиционно пользуется знать, по-прежнему заслуживает уважения."
 fra_marcel_great_ordinance_decision.title: "Великий ордонанс"
 fra_marcel_great_ordinance_decision.desc: "Военный конфликт против #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! требует значительных расходов, в связи с чем [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'обратилась', 'обратился')] к Генеральным штатам с просьбой о выделении денежных средств и новобранцев. Однако представители третьего сословия с самого начала не одобряли ни саму идею войны против [GetCountry('ENG').Custom('CL_GEN')], ни финансовые меры, направленные на обеспечение армии. Одним из предводителей этого протеста стал влиятельный прево [SCOPE.sCharacter('etienne_marcel').GetName], который пользовался уважением горожан. Он согласен предоставить государству поддержку, но взамен требует, чтобы [ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'приняла', 'принял')] Великий ордонанс, который предполагает ограничение королевской власти и расширение полномочий Генеральных штатов."
 fra_marcel_great_ordinance_decision.desc.entry: "Дебаты Генеральных штатов о финансировании текущих войн зашли в тупик. Третье сословие во главе с влиятельными купцами предложило принять «Великий ордонанс»: в обмен на их поддержку они требуют расширения собственных прав и привилегий. Мы можем согласиться на их условия либо найти другие способы получить средства от Штатов."
 fra_marcel_great_ordinance_decision.a: "Тяжёлые времена требуют отчаянных мер."
 fra_marcel_great_ordinance_decision.b: "Это недопустимо!"
 fra_marcel_great_ordinance_decision.c: "Попытаемся договориться с Марселем."
 fra_marcel_great_ordinance_decision_cooldown: "Недавний отказ от сотрудничества с Марселем"
 fra_marcel_great_ordinance_decision.historical_info: "После поражения французов в битве при Пуатье и пленения короля Иоанна II бразды правления временно перешли к дофину Карлу, принявшему титул регента. На фоне финансовых трудностей он был вынужден созвать Генеральные штаты, чтобы попросить у них поддержки. Представитель третьего сословия Этьен Марсель выступил резко против, а также выдвинул Карлу ряд требований, среди которых было подписание Великого ордонанса и освобождение Карла Злого, союзника Марселя. Регент неохотно принял разработанный Марселем документ, однако в 1357 году Иоанн II, всё ещё находясь в плену, заблокировал его исполнение. Это привело к восстанию, в результате которого оппозиция была разгромлена, Этьен Марсель убит, а Великий ордонанс окончательно отменён."
 fra_marcel_compromise_decision.title: "Великий ордонанс"
 fra_marcel_compromise_decision.desc: "Военный конфликт против #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! требует значительных расходов, в связи с чем [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'обратилась', 'обратился')] к Генеральным штатам с просьбой о выделении денежных средств и новобранцев. Однако представители третьего сословия с самого начала не одобряли ни саму идею войны против [GetCountry('ENG').Custom('CL_GEN')], ни финансовые меры, направленные на обеспечение армии. Одним из предводителей этого протеста стал влиятельный прево [SCOPE.sCharacter('etienne_marcel').GetName], который пользовался уважением горожан. Он согласен предоставить государству поддержку, но взамен требует, чтобы [ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'приняла', 'принял')] Великий ордонанс, который предполагает ограничение королевской власти и расширение полномочий Генеральных штатов."
 fra_marcel_compromise_decision.desc.entry: "Мы отказались выполнять требования Великого ордонанса, однако войны продолжаются, а Генеральные штаты всё так же готовы воспользоваться ситуацией. Если мы пойдём с ними на переговоры, возможно, нам удастся найти компромисс."
 fra_marcel_compromise_decision.a: "Попытаемся договориться с Марселем."
 fra_marcel_compromise_decision.a.tt: "Марсель больше не будет противостоять нам"
 fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$"
 fra_formalized_relations_decision.title: "Политика в отношении Италии"
 fra_formalized_relations_decision.desc: "Война против #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! окончена, и теперь пришло время уделить внимание нашим южным границам вдоль Альпийских гор. В прошлом мы поддерживали отношения с несколькими #TOOLTIP:REGION,italy_region,X #L итальянскими#!#! династиями и державами, однако из-за войны наши возможности для сотрудничества были ограничены. Теперь же советники предлагают расширить наше влияние в этом регионе, чтобы приобрести ценных союзников в лице местных правителей. Впрочем, некоторые считают, что мы должны вести себя более агрессивно и заставить своих итальянских соседей присоединиться к [GetCountry('FRA').Custom('CL_DAT')], хотят они того или нет."
 fra_formalized_relations_decision.desc.entry: "В последние годы альпийские перевалы всё меньше похожи на неприступную границу и всё больше — на хорошую возможность. #TOOLTIP:CULTUREGROUP,italian_group,X #L Итальянские#!#! государства богаты, разобщены и готовы стать либо нашими союзниками, либо подданными — смотря чьему совету мы решим последовать."
 fra_formalized_relations_decision.a: "Постараемся наладить отношения с наиболее влиятельными соседями."
 fra_formalized_relations_decision.b: "Пока лучше будем сохранять нейтралитет."
 fra_formalized_relations_decision.c: "Под нашей властью им будет лучше."
