l_russian:
 hab_monastery_reform_melk_decision.title: "Реформистское движение в Мельке"
 hab_monastery_reform_melk_decision.desc: "Некоторые наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] собрались в #TOOLTIP:LOCATION,melk,X #L Мельке#!#!, чтобы обсудить упадок монашеских традиций в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. В ходе дискуссии стало ясно, что накопившиеся за многие годы проблемы монастырей можно решить лишь с помощью масштабной реформы. Если мы будем действовать быстро и уверенно, наша держава сможет стать ярким примером успешных #L [ROOT.GetCountry.GetReligion.GetAdjective|l]их#! реформ."
 hab_monastery_reform_melk_decision.desc.entry: "Монастырь, забывший свой устав, стоит для нас меньше пустого поля, а наши обители уже давно приходят в упадок. Собрание в [ShowLocationName('melk')] даёт нам повод действовать, пока весь [ShowReligionAdjective('catholic')] мир смотрит на нас, — и повод показать, что мы ведём, а не следуем за другими."
 hab_monastery_reform_melk_decision.a: "Проведём реформу."
 hab_monastery_reform_melk_decision.b: "Лучше оставим всё как есть."
 hab_vienna_concordat_decision.title: "Венский конкордат"
 hab_vienna_concordat_decision.desc: "После долгих переговоров с папскими послами мы наконец достигли соглашения, которое учитывает интересы как #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, так и #ONCLICK:COUNTRY,[GetCountry('PAP').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PAP').Custom('CL_tt')],X [GetCountry('PAP').Custom('CL_GEN')|L]#!#!. #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священная Римская Империя#!#! и [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|l] на протяжении сотен лет испытывали друг к другу недоверие и вражду, но теперь у нас появилась историческая возможность забыть о распрях и наладить отношения."
 hab_vienna_concordat_decision.desc.entry: "Императоры и папы веками спорят о том, кто кого назначает, и эта тяжба никогда не приносила пользы ни одной из сторон. Заключённое соглашение с Папой обменяло бы часть нашей свободы назначений на то, чего у нас никогда не было: папство, не видящее в $hre$ соперника."
 hab_vienna_concordat_decision.a: "Мы подпишем этот договор."
 hab_vienna_concordat_decision.b: "[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] нам не союзник."
 hab_monastery_reform_accepted_decision.title: "Монастырский совет [ROOT.GetCountry.Custom('CL_GEN')]"
 hab_monastery_reform_accepted_decision.title.entry: "The [ShowBuildingTypeNameWithNoTooltip('monastery')] Council of $HAB$"
 hab_monastery_reform_accepted_decision.desc: "Распространение идей Реформации в нашей державе привело к тяжёлым последствиям для #TOOLTIP:BUILDING_TYPE,monastery,X #L монастырей#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] жалуются на отчаянное финансовое положение и отсутствие желающих принять монашеский постриг. Для решения этой проблемы мы можем учредить специальный совет и передать ему руководство всеми монастырями."
 hab_monastery_reform_accepted_decision.desc.entry: "Пустые кельи для послушников и пустая казна — это прежде всего проблемы управления, а уже потом духовные. Совет, держащий в руках кошельки каждого [ShowBuildingTypeName('monastery')] в наших землях, способен привести их в порядок куда быстрее, чем справится один $clergy_estate$."
 hab_monastery_reform_accepted_decision.a: "Реформируем структуру монастырей."
 hab_monastery_reform_accepted_decision.a.tt: "Откроем доступ к #TOOLTIP:PRODUCTION_METHOD,hab_reformed_monastery_maintenance,X #L монастырскому совету#!#! для всех монастырей нашей державы."
 hab_monastery_reform_accepted_decision.b: "Пусть приспосабливаются сами."
 hab_tractatus_incorporalibus_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] и их тяготы"
 hab_tractatus_incorporalibus_decision.title.entry: "Тяготы $peasants_estate$"
 hab_tractatus_incorporalibus_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] отправили к правительству своих представителей. Они жалуются, что из-за войны их положение заметно ухудшилось, поэтому просят, чтобы [target_ruler.GetName|l] хоть как-то [Select_CString(target_ruler.IsFemale,'облегчила', 'облегчил')] их бремя. Хотя обычно нас мало интересует мнение каких-то фермеров, без их поддержки нам будет трудно финансировать военные действия и набирать новых солдат. Мы можем снизить социальное напряжение, приняв ряд законов, чётко описывающих обязанности крестьян перед землевладельцами. Это позволит избежать их угнетения и упростить разрешение будущих споров."
 hab_tractatus_incorporalibus_decision.desc.entry: "Обязательства, существующие лишь по обычаю, становятся предметом споров при каждом неурожае, а война сделала неурожайным едва ли не каждый год. Закрепление повинностей $peasants_estate$ на бумаге связывает их не менее крепко, чем их землевладельцев, а крестьянин, точно знающий, что он должен, — это крестьянин, который платит исправно."
 hab_tractatus_incorporalibus_decision.a: "Мы выполним их просьбу."
 hab_tractatus_incorporalibus_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] не имеют права что-либо требовать."
 hab_tractatus_incorporalibus_decision.b.entry: "The $peasants_estate$ dare to demand things from us?"
 hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]"
 hab_geheime_kabinettskanzlei_decision.desc: "Шпионаж — не самый надёжный способ добычи информации, поскольку мы в любой момент можем потерять контакт со своими агентами. Другие державы уже начали создавать специальные организации для сбора данных и контрразведки, и мы не должны от них отставать. Мы можем учредить #TOOLTIP:GOVERNMENT_REFORM,geheime_kabinettskanzlei,X #L Австрийскую секретную службу#!#!, которая будет тайно действовать под видом почтового отделения и позволит нашим агентам быстро и безопасно просматривать всю корреспонденцию, проходящую через страну."
 hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$"
 hab_geheime_kabinettskanzlei_decision.b: "Разведка — это бесполезная трата средств."
 hab_geheimer_rat_decision.title: "Тайный совет"
 hab_geheimer_rat_decision.desc: "Недавно мы учредили #L #TOOLTIP:ADVANCE_DEFINITION,geheimrat,X #L Тайный совет#!#!, но некоторые придворные считают, что этот институт должен стать официальным. Они утверждают, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] должны полагаться в политических делах на тайных советников. Только тогда мы будем уверены, что [ROOT.GetCountry.GetFlavorRank|l] находится в руках самых надёжных и способных людей."
 hab_geheimer_rat_decision.desc.entry: "Неофициальный круг советников существует ровно столько, сколько правит собравший его государь. Закреплённый в ведомствах $crown_estate$, [ShowAdvanceName('geheimrat')] переживёт нас и удержит дела державы в руках немногих людей, достойных быть посвящёнными в них."
 hab_geheimer_rat_decision.a: "Сделаем праздник официальным!"
 hab_geheimer_rat_decision.a.tt: "Открывает события, связанные с видными деятелями, которые входили в #TOOLTIP:GOVERNMENT_REFORM,hab_geheimer_rat,X #L Тайный совет#!#!."
 hab_geheimer_rat_decision.b: "Нас и так всё устраивает."
 hab_privilegium_maius_decision.title: "Мы получили Privilegium Maius"
 hab_privilegium_maius_decision.desc: "Вместе с императорским титулом мы получили возможность исправить ошибки наших предшественников. Возглавляя #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священную Римскую Империю#!#!, мы можем даровать династии [target_ruler.GetDynasty.GetName] все привилегии, которых она заслуживает."
 hab_privilegium_maius_decision.desc.entry: "The privileges our house has always claimed were never granted by anyone with the authority to grant them. Now that the imperial title is ours, that inconvenience can be settled from the other side of the table, and the $hre$ can confirm what our predecessors merely asserted."
 hab_privilegium_maius_decision.a: "Пришло время исправить ошибки."
 hab_privilegium_maius_decision.privilegium_not_granted_tt: "Privilegium Maius ещё не был предоставлен полностью"
 hab_privilegium_maius_decision.privilegium_not_decided_tt: "Уже наступил год позднее 1370, а Privilegium Maius так и не был предложен"
