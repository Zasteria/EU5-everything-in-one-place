l_russian:
 test_decision_simple.title: "Тестовое решение (несколько вариантов)"
 test_decision_simple.desc: "Тестовое решение с тремя вариантами. Используется для проверки того, что модель данных решений корректно разбирается и что эффект каждого варианта отрабатывает от начала до конца."
 test_decision_simple.a: "Взять золото (+10)"
 test_decision_simple.b: "Отдать золото (-10)"
 test_decision_simple.c: "Ничего не будем делать."
 test_decision_only_once.title: "Тестовое решение (раз за игру)"
 test_decision_only_once.desc: "Тестовое решение, которое можно принять лишь однажды за всю кампанию. Используется для проверки того, что флаг «однократности» сохраняется при сохранении/загрузке и не позволяет принять решение повторно."
 test_decision_only_once.a: "Забрать неожиданную прибыль (+50 золота)"
 test_decision_only_once.b: "Отказ"
