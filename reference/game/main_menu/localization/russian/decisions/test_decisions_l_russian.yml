l_russian:
 test_decision_simple.title: "Тестовое решение (несколько вариантов)"
 test_decision_simple.desc: "Тестовое решение с тремя вариантами ответа. Используется для проверки того, что модель данных решения работает корректно, а эффект каждого варианта выполняется от начала до конца."
 test_decision_simple.a: "Взять денег (+10)"
 test_decision_simple.b: "Дать денег (-10)"
 test_decision_simple.c: "Ничего не будем делать."
 test_decision_only_once.title: "Тестовое решение (один раз за игру)"
 test_decision_only_once.desc: "Тестовое решение, которое можно принять только один раз за игру. Используется для проверки того, флаг only_once сохраняется при перезагрузке сохранения и не даёт принять решение повторно."
 test_decision_only_once.a: "Получить неожиданную прибыль (+50 ед. золота)"
 test_decision_only_once.b: "Отказ"
