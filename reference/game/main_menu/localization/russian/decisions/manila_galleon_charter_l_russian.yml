 charter_manila_galleon.title: "Фрахтовка манильского галеона"
 charter_manila_galleon.desc: "Теперь, когда обратный маршрут через Тихий океан проложен и проверен, океан перестал быть преградой и стал дорогой. Давайте оснастим великий галеон на нашем западном побережье, загрузим его трюмы и отправим по северному пути в Азию и обратно, обменяв серебро на шёлк и пряности. Затраты велики, а плавание предстоит долгое, но один благополучно вернувшийся галеон окупит себя многократно. Он не вернётся в течение года, и море ещё может поглотить его, но в случае успеха нас ждёт богатство."
 charter_manila_galleon.a: "Оснастите галеон и погрузите на него серебро этого сезона."
