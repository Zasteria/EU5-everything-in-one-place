l_russian:
 jap_adopt_japan_identity_decision.title: "Принять имя $JAP$"
 jap_adopt_japan_identity_decision.desc: "Кланы истощили друг друга в бесконечных войнах, и один из домов возвысился над остальными. Однако мир по-прежнему знает нас по имени того дома, а не по земле, которой мы теперь правим.\n\nПримем имя $JAP$, чтобы каждый двор и каждая провинция знали: держава едина, и она наша."
 jap_adopt_japan_identity_decision.a: "Мы — $JAP$."
 jap_adopt_japan_identity_decision.color_tt: "Мы принимаем #Y красный#! цвет в качестве цвета нашей страны"
 jap_adopt_japan_identity_decision.historical_info: "К 1603 году Токугава Иэясу положил конец более чем вековой гражданской войне и принял титул сёгуна, правя объединённой Японией из Эдо. До него Ода Нобунага и Тоётоми Хидэёси сломили власть враждующих военачальников. Европейские торговцы и посланники того времени, как правило, считали сёгуна правителем всей Японии."
