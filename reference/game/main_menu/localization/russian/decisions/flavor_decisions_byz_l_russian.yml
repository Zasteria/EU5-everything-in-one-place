l_russian:
 byz_army_reform_decision.title: "Реформация [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой армии"
 byz_army_reform_decision.title.entry: "Реформа византийской армии"
 byz_army_reform_decision.desc: "Фемная система, на которой прежде была построена наша армия, позволяла в короткое время набрать значительное число ополченцев. Но времена изменились, и солдатское ремесло с ростом благосостояния централизованных держав превратилось в полноценную профессию. Теперь [target_character.GetName] и [Select_CString(target_character.IsFemale,'её', 'его')] советники разрабатывают новые принципы организации армии. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] не желает, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] диктовали [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'ей', 'ему')] свои условия — комплектация войска должна быть в ведении центральной власти."
 byz_army_reform_decision.desc.entry: "Фемная система, на которой прежде была построена наша армия, позволяла в короткое время набрать значительное число ополченцев. Но времена изменились, и солдатское ремесло с ростом благосостояния централизованных держав превратилось в полноценную профессию. Наш совет мог бы разработать план реформы армии, чтобы мы не так сильно зависели от дворянской поддержки."
 byz_army_reform_decision.a: "[target_character.GetNameWithNoTooltip] будет единолично командовать армией."
 byz_army_reform_decision.a.entry: "Король будет лично командовать армией"
 byz_army_reform_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] служат общему делу. Нам не стоит ими пренебрегать."
 byz_army_reform_decision.b.entry: "Аристократы служат общему делу. Не стоит ими пренебрегать."
 BYZ_ALL_THEMATA_PROVINCES_GAIN_NOBLE_LOYALTY: "Все [Concept('pops', 'группы населения')|e] из сословия #TOOLTIP:POPTYPE,nobles,X #L аристократов#!#! в [Concept('locations', 'районах')|e] со #TOOLTIP:BUILDING_TYPE,thema_headquarters,X #L столицами фем#!#! получают [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]."
