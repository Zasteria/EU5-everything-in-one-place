 byz_army_reform_decision.desc.entry: "Если раньше наша армия одерживала победы благодаря фемам и многочисленным ополчениям, которые они предоставляли, то рост благосостояния и централизация государства привели к тому, что военная служба стала постоянной профессией. Наш кабинет мог бы разработать план реформы армии, чтобы сделать нас менее зависимыми от поддержки знати."
