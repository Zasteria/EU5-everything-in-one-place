l_russian:
 pol_shooting_societies_decision.title: "Стрелецкие общества"
 pol_shooting_societies_decision.desc: "Жизнь опасна и непредсказуема — предугадать, когда на нашу процветающую державу нападут вновь, просто невозможно. Чтобы иметь возможность защитить свой дом, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] основали в #TOOLTIP:LOCATION,krakow,X #L Кракове#!#! стрелецкое общество, где будущих ополченцев учат обращаться с огнестрельным оружием.\n\nПо мере расширения границ и роста населения нашей державы в других городах постепенно возникают собственные стрелецкие общества. Они стали настолько многочисленны, что представители этих обществ обратились к нам с просьбой официально поспособствовать учреждению подобных школ в каждом городе страны."
 pol_shooting_societies_decision.desc.entry: "Горожане, что упражняются со своим порохом и свинцом, не стоят казне ни гроша, но всё же являются по призыву на службу. То, что началось как одно общество в [ShowLocationName('krakow')], могло бы стать грамотой, дарованной каждому городу, готовому его содержать, если только $burghers_estate$ будут удостоены доверия к оружию."
 pol_shooting_societies_decision.a: "Стрелять по петухам — это не яйца высиживать: тут нужны точность и умение!"
 pol_shooting_societies_decision.b: "Хватит и того, что уже есть в Кракове."
 pol_shooting_societies_decision.c: "Лучше нацелимся на более важные расходы…"
 pol_shooting_societies_decision.historical_info: "Название Краковского стрелецкого общества — «Петушиное» — восходит к первым состязаниям стрелков, где в качестве мишеней использовались живые петухи и куры. Со временем на смену им пришли деревянные фигурки в виде петухов (#italic  kur#!). Так возникло наименование #italic  «Курковое братство»#!, поскольку в разговорном польском языке слово «кур» (#italic  kur#!) означает #italic  «петух»#!.\n\nВ эпоху массового распространения огнестрельного оружия заметным стало сходство ружейного замка с петушиной головой. Отсюда пошло слово «курок», так удачно совпадающее с названием «Курковое братство»."
 pol_privilege_of_koszyce_decision.title: "Кошицкий привилей"
 pol_privilege_of_koszyce_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] получили неожиданную просьбу: [ruler_scope.GetName] хочет, чтобы престол державы, если после смерти монарха не останется наследников мужского пола, могла занять [Select_CString(ruler_scope.IsFemale,'её', 'его')] дочь. Сами [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] видят в этом превосходную возможность выторговать себе новые привилегии — вряд ли [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] сможет им отказать. Условия их таковы: налог, который сейчас платят [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l], будет снижен, а устанавливать новые налоги без их согласия будет запрещено. Кроме того, в дальнейшем все расходы за визиты будет брать на себя непосредственно [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], конечно, сочтут унизительным."
 pol_privilege_of_koszyce_decision.desc.entry: "Трон, переходящий к дочери, требует согласия, а согласие в этом королевстве имеет свою цену. $nobles_estate$ назначит её монетой и льготами, и каждая уступка, дарованная ныне, станет прецедентом, который никакой будущий $crown_estate$ не сможет отменить."
 pol_privilege_of_koszyce_decision.a: "Мы доведём это дело до конца."
 POL_may_form_union_with_lit_at_later_date: "Благодаря принятию #TOOLTIP:ESTATE_PRIVILEGE,privilege_of_koszyce,X #L Кошицкого привилея#!#! власти #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! смогут образовать унию с #ONCLICK:COUNTRY,[GetCountry('LIT').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LIT').Custom('CL_tt')],X [GetCountry('LIT').Custom('CL_INST')|L]#!#!, если состоится событие «$flavor_pol.55.title$»."
 pol_privilege_of_koszyce_decision.historical_info: "Кошицкий привилей — это грамота, пожалованная шляхте королём Венгрии и Польши Людовиком Великим. Ценой многочисленных уступок дворянству Людовик обеспечил своей дочери место на престоле, однако расширение привилегий шляхтичей стало первым шагом к установлению в Польше шляхетской демократии. Впоследствии дочь короля, ради которой и был составлен привилей, — Ядвига — вышла замуж за великого князя литовского Ягайло, что привело к объединению Польши и Литвы в личную унию — Речь Посполитую."
 pol_nihil_novi_decision.title: "Nihil novi"
 pol_nihil_novi_decision.desc: "На недавнем заседании [ROOT.GetCountry.Custom('parliament_ru_GEN')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] выдвинули совершенно невообразимое предложение. Поддавшись заблуждениям [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого характера, они начали считать, что у власти не должно быть права принимать законы, касающиеся шляхтичей, без их на то согласия. Это возмутительно! Однако без поддержки этого сословия мы лишимся средств на какие-либо дальнейшие действия, поэтому выдвинутое предложение придётся рассмотреть, каким бы нелепым оно ни казалось. Кроме того, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] собираются ограничить права городских жителей и прикрепить своих крестьян к земле. Нам не оставляют выбора — вероятнее всего, придётся согласиться."
 pol_nihil_novi_decision.desc.entry: "На рассмотрении нашего сейма находится прошение, по которому $nobles_estate$ не будет отвечать ни перед каким законом, если сама его не одобрит, а горожане и крепостные тем временем будут связаны ещё туже. Это оскорбление, облачённое в форму просьбы, и отказ означает, что придётся искать иной способ платить за наши войны."
 pol_nihil_novi_decision.a: "Дадим им эти несчастные права."
 pol_nihil_novi_decision.b: "Обойдутся без новых прав."
 pol_nihil_novi_decision.historical_info: "#italic  Nihil novi nisi commune consensu#! («ничего нового без всеобщего согласия») — это конституция, то есть закон, принятый в 1505 году польским сеймом. Nihil novi запрещал принимать новые законы без согласия шляхты. Считается, что именно с него в стране началось установление шляхетской демократии, а позже — #italic  Золотой вольности#!."
 pol_rule_of_the_sejm_decision.title: "Выборная монархия в Польше"
 pol_rule_of_the_sejm_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], обладатели широчайших привилегий, постепенно начинают вспоминать о старых притязаниях. Всё чаще они стремятся отстаивать своё неотчуждаемое право выбирать, кому именно будет принадлежать [ROOT.GetCountry.GetFlavorRank|l], утверждая, что в истории державы уже есть такой прецедент. И хотя эти заявления абсурдны, мы не можем возразить всерьёз, поскольку [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] обретают всё большее влияние, в то время как [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] его теряют. К сожалению, избрание престолонаследников придётся передать в руки этих людей — нравится нам это или нет."
 pol_rule_of_the_sejm_decision.desc.entry: "Кто выбирает монарха, тот держит монархию. $nobles_estate$ уже достаточно окрепли, чтобы заявить об этом вслух, а $crown_estate$ более не в силах ей возразить."
 pol_rule_of_the_sejm_decision.a: "Мы доверимся сейму!"
 pol_rule_of_the_sejm_decision.historical_info: "Помимо множества других привилегий в XIV–XV веках польское дворянство получило право выбирать правителя страны. Первоначально престол без каких-либо возражений переходил от одного Ягеллона к другому, а потому выборы считались чистой формальностью. Однако после смерти последнего представителя династии Ягеллонов состоялись первые выборы, в которых шляхтичам пришлось выбирать между несколькими иностранными претендентами благородного происхождения. По итогам выборов 1573 года королём Польши стал Генрих Валуа. С того момента и до раздела Речи Посполитой в XVIII веке все монархи выбирались из числа иностранцев."
 pol_nihil_novi_decision.b_tt: "Позднее мы сможем выбрать $nihil_novi$"
