l_russian:
 ser_novo_brdo_mine_decision.title: "Ново-Брдоский законник"
 ser_novo_brdo_mine_decision.desc: "В шахтёрском городке #TOOLTIP:LOCATION,novo_brdo,X #L Ново-Брдо#!#! сложился уникальный свод правил и законов, регламентирующих работу горнодобывающей отрасли и её правовые аспекты. Горняки других областей требуют, чтобы этот кодекс лёг в основу общенационального законодательства в области рудного дела. Предлагаемый ими #TOOLTIP:POLICY,novo_brdo_mining_law,X #L Ново-Брдоский законник#!#! должен регламентировать обустройство шахтёрских городков, определить права и обязанности горняков и обеспечить меры безопасности и справедливое ведение дел на всей территории [ROOT.GetCountry.Custom('CL_GEN')]."
 ser_novo_brdo_mine_decision.desc.entry: "Один горняцкий город путём проб и споров выработал правила, которые сохраняют его шахты прибыльными, а рудокопов — не убивающими друг друга из-за них. Если сделать обычаи [ShowLocationName('novo_brdo')] законом для всех рудников $SER$, другие города лишатся своих местных порядков, зато избавятся от необходимости плохо изобретать те же самые правила заново."
 ser_novo_brdo_mine_decision.a: "Примем общенациональный законник."
 ser_novo_brdo_mine_decision.b: "Нас устраивают и текущие правила."
 has_unlocked_novo_brdo_tt: "Закон открыт благодаря #Y «[ShowLocationNameWithNoTooltip('novo_brdo')]: Кодексу»#! [decision|e]"
 STATIC_MODIFIER_NAME_ser_novo_brdo_code: "Ново-Брдоский законник"
 ser_novo_brdo_mine_decision.historical_info: "Ново-Брдоский законник, принятый Стефаном Лазаревичем в 1412 году, представлял собой всеобъемлющий свод правил, регламентирующих все аспекты горнорудного дела — от организации горной добычи до обустройства шахтёрских городов. Законник регулировал права собственности, меры безопасности и экономическую деятельность, содействуя развитию и процветанию шахтёрских сообществ."
 chi_grand_pronouncements_decision.title: "Великие рескрипты"
 chi_grand_pronouncements_decision.desc: "[target_character.GetName|U] утверждает, что падение предыдущей династии было вызвано повальной коррупцией и самоуправством государственных сановников. [Select_CString(target_character.IsFemale, 'Она', 'Он' )] настаивает на введении более строгого законодательства, которое позволит уберечь #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! от той же участи."
 chi_grand_pronouncements_decision.desc.entry: "Династии гибнут от вторжений куда реже, чем от министров, призванных им служить. Двор намерен составить свод законов, достаточно строгий, чтобы ни один министр не принял дворец за свою собственность, чего бы это ни стоило той свободе действий, которой такие люди обычно пользуются."
 chi_grand_pronouncements_decision.a: "Мы искореним коррупцию!"
 chi_grand_pronouncements_decision.b: "Коррупция в нашем правительстве? Да быть того не может!"
 chi_ming_dynasty_code_will_be_changed: "К #TOOLTIP:POLICY,chi_ming_dynasty_code_policy,X #L Полному своду законов#!#! будут добавлены эффекты от модификатора «[ShowModifier('chi_grand_pronouncements')]»."
 integrated_grand_prounouncements: "«[ShowModifier('chi_grand_pronouncements')]» стали частью #TOOLTIP:POLICY,chi_ming_dynasty_code_policy,X #L Полного свода законов#!#!."
 cas_right_of_possession_decision.title: "Право владения"
 cas_right_of_possession_decision.desc: "Наша #TOOLTIP:GOODS,wool,X #L шерстяная#!#! промышленность процветает под умелым руководством #TOOLTIP:LAW,mesta_council_law,X #L Совета Месты#!#!, и овцеводство играет всё большую роль в #L [ROOT.GetCountry.GetAdjective|l]ой#! экономике. Чтобы обеспечить дальнейшее благополучие ассоциации, было бы разумно ввести закон о #TOOLTIP:POLICY,right_of_possesion,X #L праве владения#!#!, регулирующий правила использования пастбищ и стоимость их аренды."
 cas_right_of_possession_decision.desc.entry: "Гильдия, предоставленная сама себе, со временем начинает блюсти лишь собственные интересы. [ShowLawName('mesta_council_law')] превратил [ShowGoodsName('wool')] в целое состояние, и установление предельной платы за аренду пастбищ не позволит извлечь это состояние целиком из карманов крестьян, арендующих землю под ним."
 cas_right_of_possession_decision.a: "Введём закон о праве владения."
 cas_right_of_possession_decision.b: "Лучше оставим всё как есть."
 cas_right_of_possession_decision.c: "Пора распустить Совет Месты!"
 cas_right_of_possession_decision.c.tt: "Все принадлежащие нам районы #TOOLTIP:REGION,iberia_region,X #L Пиренейского полуострова#!#!, где добывают шерсть, навсегда потеряют модификатор «[ShowModifier('merino_wool')]»"
 cas_altered_nueva_recopilacion_decision.title: "Новейший свод"
 cas_altered_nueva_recopilacion_decision.desc: "#ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! постепенно захватывают идеи #L #TOOLTIP:ADVANCE_DEFINITION,enlightenment_advance,X #L Просвещения#!#!, при этом многие наши законы безнадёжно устарели — и в частности, «[ShowPolicyName('nueva_recopilacion_policy')]». [target_character.GetName] [Select_CString(target_character.IsFemale, 'намерена', 'намерен' )] переписать законодательство и избавить нашу правовую систему от традиций римско-канонического права. Эта реформа послужит интересам просвещения, дав людям возможность изучать не только догматы #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ой#! веры, прежде составлявшие основу народного образования."
 cas_altered_nueva_recopilacion_decision.desc.entry: "Свод законов, составленный ещё до [ShowAdvanceName('enlightenment_advance')], продолжает управлять нами так, будто ничего не изменилось. Переписать [ShowPolicyName('nueva_recopilacion_policy')], отойдя от римского канонического права, значило бы научить народ чему-то, помимо той веры, на которую суды опирались целый век."
 cas_altered_nueva_recopilacion_decision.a: "Мы дадим шанс прогрессивным идеям."
 cas_altered_nueva_recopilacion_decision.b: "Не стоит отворачиваться от традиций."
 cas_altered_nueva_recopilacion_decision.historical_info: "В «Новейшем своде» испанское законодательство перестало ориентироваться на римско-каноническое право, как это делал «Новый свод». Обновлённый сборник законов, вступивший в силу в 1805 году, стал шагом к окончательному объединению Кастилии и Арагона в одну испанскую державу. Пусть и не столь совершенный, как Кодекс Наполеона, «Новейший свод» стал основой для рассмотрения судебных дел по всей Испании."
 spa_alter_nueva_recopilacion_policy_tt: "Бонусы от [Concept('policy', 'политики')|e] «[ShowPolicyName('nueva_recopilacion_policy')]» перейдут на [Concept('research', 'исследования')|e], их уровень будет зависеть от [Concept('estate_power', 'власти')|e] сословия «[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]»."
 cas_spanish_cloth_industry_decision.title: "Добротная мериносовая [ShowGoodsNameWithNoTooltip('wool')]"
 cas_spanish_cloth_industry_decision.desc: "Благодаря своему превосходному качеству #L [ROOT.GetCountry.GetAdjective|l]ая#! #TOOLTIP:GOODS,wool,X #L шерсть#!#! обладает неизменно высокой репутацией на европейских рынках, спрос на неё с каждым годом растёт. Если поддержать шерстяное производство, то под началом #TOOLTIP:LAW,mesta_council_law,X #L Совета Месты#!#! эта отрасль превратится в крайне доходную статью экспорта. В свою очередь, ряд членов Совета Месты предлагают использовать их сырьё для создания нашего собственного производства #TOOLTIP:GOODS,fine_cloth,X #L тонкого сукна#!#!. Они убеждены, что будущее за #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! суконной промышленностью."
 cas_spanish_cloth_industry_decision.desc.entry: "Сырая [ShowGoodsName('wool')], продаваемая за границу, обогащает иноземных ткачей больше, чем нас самих. Развитие торговли [ShowGoodsName('fine_cloth')] на основе [ShowLawName('mesta_council_law')] позволило бы нам продавать уже готовый товар, если удастся убедить совет, что эта дополнительная ступень стоит вложений."
 cas_spanish_cloth_industry_decision.a: "Сосредоточимся на экспорте."
 cas_spanish_cloth_industry_decision.a.tt: "Все принадлежащие нам районы #TOOLTIP:REGION,iberia_region,X #L Пиренейского полуострова#!#!, где добывают шерсть, получат модификатор «[ShowModifier('quality_merino_wool')]» на 50 лет"
 cas_spanish_cloth_industry_decision.b: "Лучше поддержим своё производство."
 cas_spanish_cloth_industry_decision.b.tt: "Открывает доступ к методам производства испанских тканей для гильдии портных."
 has_unlocked_spanish_cloth_industry: "Поддержали испанскую суконную промышленность в ходе события"
 STATIC_MODIFIER_NAME_quality_merino_wool: "Высококачественная мериносовая шерсть"
 por_casa_de_india_decision.title: "Каза да Индия"
 por_casa_de_india_decision.desc: "Нам необходимо организовать эффективное управление #L [ROOT.GetCountry.GetAdjective|l]ими#! владениями в #TOOLTIP:SUB_CONTINENT,india,X #L Индии#!#! и #TOOLTIP:CONTINENT,africa,X #L Африке#!#!. Советники предлагают создать для этого специальное учреждение, которое будет обеспечивать наш контроль над торговлей в этих регионах, подчиняясь при этом непосредственно [ROOT.GetCountry.GetGovernment.GetAdjective|l]ому казначейству."
 por_casa_de_india_decision.desc.entry: "Торговля, разбросанная по $india$ и [ShowContinentName('africa')], — это торговля, за которой никто толком не следит. Единое учреждение под началом казначея, обладающее монополией на самые важные товары, отвечало бы за всё это в одной-единственной книге счетов."
 por_casa_de_india_decision.a: "Интересный план."
 por_casa_de_india_decision.a.tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('por_casa_de_india')]»"
 hol_ned_shipbuilding_decision.title: "Флейт"
 hol_ned_shipbuilding_decision.desc: "Экспансивная #L [ROOT.GetCountry.GetCulture.GetName|l]ая#! экономика предъявляет серьёзные требования к торговому флоту. Вдобавок из-за небольшой глубины прибрежных вод каравеллы и другие крупные торговые суда не могут заходить во многие [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие порты. До сих пор эта проблема решалась с помощью небольших буеров, но недавно [target_character.GetName] из #TOOLTIP:LOCATION,hoorn,X #L Хорна#!#! [Select_CString(target_character.IsFemale,'профинансировала', 'профинансировал')] строительство судна нового типа.\nОно называется «флейт» и отличается удлинённым корпусом с характерной грушевидной кормой, а для его обслуживания достаточно небольшой команды. Способный как перевозить грузы по голландскому мелководью, так и выходить в открытый океан, флейт станет бесценным подарком для наших купцов."
 hol_ned_shipbuilding_decision.desc.entry: "Бойер способен подойти к отмелям, которых требуют наши порты, но берёт на борт слишком мало, чтобы плавание того стоило. $name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ профинансировал более длинную конструкцию с грушевидной кормой, сочетающую оба качества и способную нести настоящий груз по воде, едва достаточно глубокой для гребной лодки."
 hol_ned_shipbuilding_decision.a: "И правда замечательное судно!"
 hol_ned_shipbuilding_decision.b: "Занятная идея, но сейчас неподходящее время. Давайте, позже?"
 hol_ned_shipbuilding_decision.c: "Сомневаюсь, что наши верфи к такому готовы."
 nov_ivan_hundred_strong_decision.title: "Купеческое объединение «Ивановское сто»"
 nov_ivan_hundred_strong_decision.desc: "[ROOT.GetCountry.GetName] — один из крупнейших торговых центров и дом для многих влиятельных купеческих объединений. Среди них, однако, особо выделяется #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Ивановское сто»#!#!, удерживая крепкую хватку над торговлей #TOOLTIP:GOODS,beeswax,X #L пчелиным воском#!#!. Стремясь и дальше наращивать своё влияние, многие высокопоставленные члены объединения хотят, чтобы [our_ruler.GetName] и вече оказали им дополнительную поддержку. Некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] однако предостерегают, что в результате подобной поддержки объединение может получить слишком большое влияние на [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ую торговлю."
 nov_ivan_hundred_strong_decision.desc.entry: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')] и без того держит торговлю [ShowGoodsName('beeswax')] под более жёстким контролем, чем подобает любой отдельной гильдии, а его старшины хотят ещё большей поддержки. $nobles_estate$ тихо просят нас отказать им, опасаясь торгового объединения, слишком могущественного, чтобы вообще отвечать перед вечем."
 nov_ivan_hundred_strong_decision.a: "Они получат полную поддержку веча."
 nov_ivan_hundred_strong_decision.b: "Лучше наоборот изолировать «Ивановское сто»."
 empower_ivan_hundred_privilege: "В течение следующих 25 лет привилегия #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Ивановское сто»#!#! будет давать следующие эффекты:\n#R −5%#! к #TOOLTIP:MODIFIER_TYPE,global_crown_estate_power,X #P #V силе короны#!#! и #G +20%#! к #TOOLTIP:MODIFIER_TYPE,global_merchant_capacity_modifier,X #P #V торговому потенциалу#!#!"
 ivan_hundred_strengthened_requirement: "Следующий бонус можно получить благодаря [decision|e] «$nov_ivan_hundred_strong_decision.title$»:"
 variable_ivan_hundred_strengthened_tt: "#TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L Ивановское сто#!#! усилилось"
 ivan_hundred_strengthened: "«Ивановское сто» усилено"
 nov_ivan_hundred_beeswax_decision.title: "«Ивановское сто» запрашивает монополию на пчелиный воск"
 nov_ivan_hundred_beeswax_decision.desc: "Получив дополнительную поддержку от веча, #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Ивановское сто»#!#! наслаждается своим возросшим статусом. Стремясь получить ещё большую поддержку своих начинаний, объединение запросило исключительную монополию на производство #TOOLTIP:GOODS,beeswax,X #L пчелиного воска#!#! в Новгороде. Хотя объединение всегда имело большое влияние на торговлю этим товаром, монополия окончательно закрепит их контроль над ним."
 nov_ivan_hundred_beeswax_decision.a: "Удовлетворим их просьбу большего влияния на торговлю пчелиным воском."
 nov_ivan_hundred_beeswax_decision.b: "Мы не позволим, чтобы «Ивановское сто» стало ещё сильнее."
 ivan_hundred_beeswax_increase: "В течение следующих 25 лет привилегия #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Ивановское сто»#!#! будет давать следующие эффекты:\n#G +10%#! к #TOOLTIP:MODIFIER_TYPE,selling_efficiency,X $tt_op_P$$tt_op_V$эффективности продажи$tt_cl_3$ и #G +25%#! к #TOOLTIP:MODIFIER_TYPE,global_beeswax_output_modifier,X #P #V объёму выпуска пчелиного воска#!#!"
 ivan_hundred_beeswax_increase_requirement: "Следующий бонус можно получить благодаря [decision|e] «$nov_ivan_hundred_beeswax_decision.title$»:"
 ivan_hundred_beeswax: "Значительное влияние на торговлю пчелиным воском"
 kbo_serfdom_reform_decision.title: "Продолжение работорговых набегов"
 kbo_serfdom_reform_decision.desc: "Экономика континента во многом зависит от притока рабской силы и эффективности принудительного труда, и наша страна — не исключение. Регулярные набеги, в которых участвует наша армия и местные полевые командиры, обеспечивают наши рынки новыми рабами, которые служат во благо всему нашему обществу. Однако мы уже достаточно вложились в такие нападения и накопили немалый запас рабов, поэтому теперь должны решить, стоит ли и дальше финансировать армию и поставлять на невольничьи рынки всё больше жителей покорённых территорий, или же лучше даровать этим людям положение в обществе и позволить им стать его полноправными членами."
 kbo_serfdom_reform_decision.a: "Работорговля — важная составляющая нашей экономики."
 kbo_serfdom_reform_decision.b: "Мы интегрируем всех этих людей в наше общество."
 kbo_pop_promotion_more_potent_tt: "Мы получим доступ к уникальному действию [Concept('cabinet', 'совета')|e] — #TOOLTIP:CABINET_ACTION,kbo_pop_promote_action,X #L равноправной интеграции#!#!"
 kbo_amenokal_salt_traders_decision.title: "Азалай и Тагламт"
 kbo_amenokal_salt_traders_decision.desc: "После приручения верблюдов в Западной и Центральной Африке торговцы на протяжении столетий использовали пути Азалай и Тагламт: несмотря на враждебную человеку среду, их неизменно привлекала возможность неплохо заработать. Эти смельчаки, прозванные аменокалями, могут курировать такие маршруты и путешествовать от оазиса к оазису через пустыню, соединяющую отдалённые области, перевозя #TOOLTIP:GOODS,salt,X #L соль#!#! — один из ценнейших товаров нашего времени. На рынках соль в цельных кусках или брикетах можно будет обменять на еду, скот и другие полезные товары. Стоит ли делегировать этим влиятельным купцам контроль над торговлей солью? Чтобы решить этот деликатный вопрос, нам понадобится помощь доверенных советников."
 kbo_amenokal_salt_traders_decision.a: "Позволим аменокалям караванов контролировать торговлю."
 kbo_amenokal_salt_traders_decision.b: "Такими полномочиями обладает только [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]!"
 kbo_amenokal_salt_traders_decision.b.entry: "This authority is reserved for the ruler!"
 kbo_sharia_courts_decision.title: "$sharia$ в $KBO$"
 kbo_sharia_courts_decision.desc: "Наша великая держава рано и стремительно приняла #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитский#!#! ислам. Вооружившись неуёмной энергией и новообретённым пылом истинно верующих, мы сделали всё возможное для консолидации наших религиозных ценностей и защиты нашего народа от вездесущих язычников. Однако сложилось так, что мы до сих пор не вполне следуем предписаниям шариата. Если мы будем придерживаться религиозных правил, описанных в этом сборнике, это может отразиться на эффективности нашей власти, а также на том, как эта власть будет восприниматься в народе. Многие наши советники выступают за внедрение принципов шариата, однако некоторые считают, что не стоит смешивать политику и религию."
 kbo_sharia_courts_decision.a: "Принятие законов шариата станет для нас шагом вперёд!"
 kbo_sharia_courts_decision.b: "Лучше оставить всё как есть."
 kbo_enable_sharia_courts_cabinet_action_tt: "Мы получим доступ к уникальному действию [Concept('cabinet', 'совета')|e] — учреждению #TOOLTIP:CABINET_ACTION,kbo_sharia_courts,X #L шариатских судов#!#!"
 teu_kulm_law_revised_decision.title: "Пересмотр $kulm_law$"
 teu_kulm_law_revised_decision.desc: "#TOOLTIP:SITUATION,black_death,X #L Чёрная смерть#!#! пронеслась по всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!, опустошив её города и селения. Для территории под названием [ROOT.GetCountry.GetLongName] это обернулось ещё и тем, что обезлюдевшая Германия перестала предоставлять достаточно колонистов для заселения #TOOLTIP:AREA,prussia_area,X #L Пруссии#!#!. Если мы не найдём новые способы привлечь людей на [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие земли, весь наш план христианизации этого региона окажется под угрозой."
 teu_kulm_law_revised_decision.desc.entry: "[ShowSituationName('black_death')] настолько проредила Германию, что для отправки на восток осталось мало переселенцев, а наш порядок в [ShowAreaName('prussia_area')] зависит от их непрерывного потока. Смягчение условий поселения обходится нам в уступки, которые мы предпочли бы сохранить, но пустое пограничье не обратит никого."
 teu_kulm_law_revised_decision.a: "Дадим больше привилегий колонистам."
 teu_kulm_law_revised_decision.b: "Придётся с этим смириться."
 bra_kreditwerk_reformed_decision.title: "Реформировать $bra_kreditwerk$"
 bra_kreditwerk_reformed_decision.desc: "Несмотря на новообретённые полномочия, Кредитверк не сумел достойно распорядиться нашими финансами, и его задолженность уже поражает воображение. Поскольку банкротство Кредитверка неизбежно, нам необходимо решить, какое будущее его ждёт. Мнения советников разделились: некоторые советуют преобразовать Кредитверк и отдать его под непосредственное управление короны, другие же советуют и вовсе упразднить это учреждение."
 bra_kreditwerk_reformed_decision.a: "Реформируем Кредитверк и отдадим его короне."
 bra_kreditwerk_reformed_decision.b: "Кредитверк — зло. Избавимся от него."
 bra_kreditwerk_reformed_decision.c: "Выкупим его и разрешим продолжать деятельность."
 boh_unity_brethren_decision.title: "Поддержать Общину чешских братьев"
 boh_unity_brethren_decision.desc: "За последние годы #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситских#!#! богослужений наша вера разрослась, словно молодые побеги, и теперь плоды её обильно произрастают в каждом уголке нашей державы. Прихожане приходят помолиться, принять участие в церковных обрядах и очистить душу, запятнанную учением заблудших еретиков.\n\nОднако подобная набожность обернулась тревожным образом: всё чаще наши #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L священники#!#! начинают толковать гуситское учение самым максималистским образом: они проповедуют о недопустимости становления знати и купцов священнослужителями, а также утверждают, что обряды богослужения должны быть простыми и скромными, отвергая при этом апостольское преемство."
 boh_unity_brethren_decision.desc.entry: "Вера, которая продолжает расти, рано или поздно перерастает замысел своих основателей, и наша не исключение. Некоторые из $clergy_estate$ ныне проповедуют, что дворянам и купцам вовсе нет места в Церкви — учение более чистое, чем то, с которого мы начинали, но и куда более разрушительное."
 boh_unity_brethren_decision.a: "Пусть проповедуют — в их словах есть истина."
 boh_unity_brethren_decision.b: "Нельзя, чтобы наш народ прислушивался к ним."
 unity_brethren_privilege: "Братское единение"
 unity_brethren_privilege_desc: "Радикальное #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситское#!#! движение. Его последователи призывают к скромности и простоте во время церковных обрядов, например причащения, поддерживают использование родного языка в качестве литургического и считают, что [ShowEstateTypeName('burghers_estate')|l] и [ShowEstateTypeName('nobles_estate')|l] не должны принимать участие в религиозной деятельности."
 ara_sindicat_remenca_decision.title: "Гильдия крестьян"
 ara_sindicat_remenca_decision.desc.entry: "У крестьянина, безраздельно привязанного к земле, нет законного способа противиться своему сеньору — только незаконный, и именно к незаконному сопротивлению теперь склоняются беднейшие из них. Учреждённая грамотой гильдия даёт более зажиточным крестьянам законный выход, а нам покупает их верность против дворянства при весьма малых затратах для короны."
 ara_sindicat_remenca_decision.a: "Разрешим крестьянам основать свою гильдию."
 ara_sindicat_remenca_decision.b: "Не будем обращать внимания на невежд."
 ara_sindicat_remenca: "Гильдия крестьян"
 ara_sindicat_remenca_desc: "Гильдия крестьян — объединение сельских жителей, напоминающее трудовой союз. Впервые появилось в 1448 году в Каталонии."
 nov_tysiatskii_influential_decision.title: "Старые тысяцкие"
 nov_tysiatskii_influential_decision.desc: "Хотя должность #TOOLTIP:ESTATE_PRIVILEGE,tysiatskii_privilege,X #L тысяцкого#!#! при дворе #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! формально остаётся выборной, фактически её узурпировали [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Более того, в последнее время бывшие тысяцкие стали влиять на выборы, стремясь передать эту должность своим сыновьям. Эти люди, известные как #italic старые тысяцкие#!, обладают значительной властью на нашем вече."
 nov_tysiatskii_influential_decision.desc.entry: "Выборная должность мало что сдерживает власть, если одни и те же семьи раз за разом побеждают на выборах. #italic Старые тысяцкие#! ныне направляют голосование в пользу своих сыновей даже после ухода с поста, и $nobles_estate$ тихо превратило эту должность в свою — по сути, если не по названию."
 nov_tysiatskii_influential_decision.a: "Нам нужно как-то ограничить их влияние."
 nov_tysiatskii_influential_decision.b: "Попробуем добиться, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] утратили часть своего влияния."
 nov_tysiatskii_influential_decision.b.entry: "Strive to weaken $nobles_estate$ influence over the office."
 nov_tysiatskii_influence_weakened: "Влияние тысяцких ослаблено"
 nov_influential_tysiatskii: "Влиятельные тысяцкие"
 nov_tysiatskii_influence_weakened_benefits: "В течение следующих 30 лет привилегия #TOOLTIP:ESTATE_PRIVILEGE,tysiatskii_privilege,X #L «Тысяцкий»#!#! будет давать следующие эффекты:\n#R −25%#! к #TOOLTIP:MODIFIER_TYPE,global_nobles_estate_power,X #P #V силе аристократов#!#! и #G +0,1#! к #TOOLTIP:MODIFIER_TYPE,stability_investment,X #P #V вложениям в стабильность#!#!"
 nov_tysiatskii_influence_event_happened: "Влияние тысяцких усилилось!"
 nov_tysiatskii_influence_event_happened_possible_event: "В будущем тысяцкие могут попытаться подчинить себе такое сословие, как [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]!"
 nov_influential_tysiatskii_benefits: "В течение следующих 30 лет привилегия #TOOLTIP:ESTATE_PRIVILEGE,tysiatskii_privilege,X #L «Тысяцкий»#!#! будет давать следующие эффекты:\n#G +25%#! к #TOOLTIP:MODIFIER_TYPE,global_nobles_estate_power,X #P #V силе аристократов#!#! и #G +15%#! к #TOOLTIP:MODIFIER_TYPE,army_infantry_power,X #P #V мощи пехоты#!#!"
 nov_influential_tysiatskii_requirement: "Следующий бонус можно получить благодаря [decision|e] «$nov_tysiatskii_influential_decision.title$»:"
 nov_tysiatskii_influence_weakened_requirement: "Следующий бонус можно получить благодаря [decision|e] «$nov_tysiatskii_influential_decision.title$»:"
 boh_district_paving_decision.title: "Права налогообложения районов [ShowLocationNameWithNoTooltip('prague')]"
 boh_district_paving_decision.desc: "#TOOLTIP:LOCATION,prague,X #L Прага#!#! постоянно разрастается, и многие выдающиеся деятели, возглавляющие сегодня те или иные районы города, такие как Мала-Страна, начинают требовать у нас право взыскивать налоги с граждан, которые проживают на их территориях.\n\nЕсли пойти им навстречу, наше казначейство утратит немалую долю влияния, а #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократы#!#!, наоборот, его обретут, поэтому изучить этот вопрос следует крайне внимательно."
 boh_district_paving_decision.a: "Хорошо, мы исполним их просьбу."
 boh_district_paving_decision.b: "Об этом не может быть и речи!"
 boh_joint_assembly_decrees_decision.title: "Совместное генеральное собрание"
 boh_joint_assembly_decrees_decision.desc: "С тех пор как мы возглавили #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священную Римскую Империю#!#!, разница между имперскими и нашими собственными традициями делопроизводства стала отчётлива как никогда. Положение усугубляется различиями в наших культурах и укладах — они мешают нам отстаивать законность власти над империей.\n\nЧтобы [target_character.GetName] [Select_CString(target_character.IsFemale, 'смогла', 'смог' )] укрепить своё положение на престоле, а народ стал ближе к имперским порядкам, советники предложили учредить совместное генеральное собрание. В него войдут некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и символические представители всех других курфюрстов; кроме того, лишний раз будут подтверждены имперские законы, обеспечивающие их привилегии."
 boh_joint_assembly_decrees_decision.desc.entry: "Управление $hre$ и управление собственными землями — на практике две разные задачи с двумя разными сводами законов, и разрыв между ними становится всё неудобнее с каждым годом, что мы носим обе короны. Совместное собрание, в котором наше $nobles_estate$ заседало бы наравне с имперскими князьями, подтвердило бы римские законы, которые они ценят, — ценой того, что к ним пришлось бы относиться почти как к равным."
 boh_joint_assembly_decrees_decision.a: "Только так мы обеспечим себе легитимность."
 boh_joint_assembly_decrees_decision.b: "Не будем смешивать внешнюю и внутреннюю политику."
 every_elector_25_opinion_tt: "Каждый выборщик получит [ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0] ко мнению о нас"
 ven_doges_palace_decision.title: "Расширение дворца дожей"
 ven_doges_palace_decision.desc: "Строительство венецианского #TOOLTIP:BUILDING_TYPE,doges_palace,X #L дворца дожей#!#! началось в IX веке и продолжалось ещё несколько столетий. Изначально это сооружение напоминало крепость, однако со временем стало воплощать собой всю красоту готической архитектуры. Предназначение дворца — двойное: помимо того, что здесь проживает [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] — человек, которому подчиняется [GetCountry('VEN').GetLongNameWithNoTooltip], в здании также расположены правительственные конторы и суды.\n\nС годами, впрочем, становится только очевидно, что дворец обветшал и нуждается в обстоятельном ремонте. Возможно, пора превратить его в произведение искусства, способное затмить даже величественные резиденции западных королей."
 ven_doges_palace_decision.desc.entry: "Дворец, заложенный как крепость в IX веке, стал величественным скорее по случайности, чем по замыслу, и это заметно. Перестройка [ShowBuildingTypeName('doges_palace')] во что-то, превосходящее резиденции западных королей, обойдётся в целое состояние, которое мы иначе потратили бы на корабли."
 ven_doges_palace_decision.a: "Разумное предложение!"
 ven_doges_palace_decision.b: "Дворец и так хорош."
 ven_doges_palace_decision.historical_info: "К 16 веку дворец Дожей подвергся значительным изменениям и расширениям, что значительно повысило его величие. Одним из самых видных достижений в процессе перестройки стало завершение его знаменитого фасада, выходившего на Гранд-канал. Архитектурное величие фасада было заметно всем, кто приближался к дворцу по воде. Этот период обновления и расширения закрепил статус дворца, как надежного символа мощи и власти Венеции. Его пышно украшенные комнаты и залы не только стали свидетелями столетий политической активности, но также и служили прочным показателем богатой истории города, его значимости на мировой арене."
 ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]"
 ven_piazza_san_marco_decision.desc: "[ROOT.GetCountry.GetFlavorRank|U] под нашей властью день ото дня становится лишь влиятельнее и богаче, а потому возникла необходимость вложить средства в развитие столицы: [ShowLocationName('venice')] должна стать зеркалом нашего величия. Начать можно с перестройки #TOOLTIP:BUILDING_TYPE,piazza_san_marco',X #L площади Святого Марка#!#!. Наши архитекторы готовы украсить её величественными арками и мрамором, подчеркнув тем самым великолепие морской державы. Город станет только красивее, а народ вновь убедится, что вокруг нет равных нашему влиянию и культуре."
 ven_piazza_san_marco_decision.desc.entry: "Морская держава, что выглядит бедной у себя дома, за рубежом богатой не покажется. Перестройка площади перед дворцом [ShowLocationName('venice')] в мраморе и арках тратит деньги на то, что нельзя съесть, но покупает репутацию, которая открывает двери, недоступные одним лишь деньгам."
 ven_piazza_san_marco_decision.a: "Мы профинансируем ремонт."
 ven_piazza_san_marco_decision.b: "Ремонт обойдется слишком дорого."
 unlocked_piazza_san_marco_tt: "Мы открыли [building|e] «$piazza_san_marco$» благодаря флавор-[decision|e]"
 ven_piazza_san_marco_decision.historical_info: "#italic Пьяцца Сан-Марко#!, известная также, как площадь Святого Марка — главная общественная площадь Венеции, одна из главных ее достопримечательностей. Площадь, основанная примерно в 9 веке и расширенная до текущего размера в 12 веке, постоянно улучшалась, ремонтировалась, обзаводилась новыми достопримечательностями. Она окружена такими знаменитыми строениями, как базилика Святого Марка, Дворец дожей и часовая башня Святого Марка. Площадь веками служила центральным местом собрания в Венеции, там проводились политические, религиозные и общественные мероприятия."
 ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]"
 ven_teatro_san_cassiano_decision.desc: "[ShowLocationName('venice')] — подлинная краса и гордость #TOOLTIP:REGION,italy_region,X #L итальянской#!#! культуры: здесь издавна проживает целое множество творцов и актёров. Сторонники превосходства венецианского искусства и свободы самовыражения для её одарённых сынов и дочерей начали призывать нас возвести достойные нашего города театр и оперу. [ShowBuildingTypeName('teatro_san_cassiano')] станет настоящим воплощением роскоши, богатства и гениальности Венеции, и посещать его будут даже иностранцы из далёких краёв."
 ven_teatro_san_cassiano_decision.desc.entry: "Городу, уже прославленному своим искусством, негде показать лучшее из него. Предлагаемый [ShowBuildingTypeName('teatro_san_cassiano')] дал бы [ShowLocationName('venice')] сцену, достойную его репутации, и дал бы каждому портовому сопернику ещё один повод завидовать нам."
 ven_teatro_san_cassiano_decision.a: "Начнём строительство!"
 ven_teatro_san_cassiano_decision.b: "Нам это не по карману."
 unlocked_teatro_san_cassiano_tt: "Мы открыли [building|e] «$teatro_san_cassiano$» благодаря флавор-[decision|e]"
 ven_teatro_san_cassiano_decision.historical_info: "Театр Сан-Кассиано, построенный в Венеции в 1637 году — первый в мире публичный оперный театр. Его постройка стала важной вехой в истории исполнительского искусства и укрепила роль Венеции как главного культурного центра."
 ven_walls_of_ston_decision.title: "Укрепление Дубровника"
 ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')] — крупный торговый [target_location.GetRank.GetName|l], а заодно — одно из важнейших владений нашей морской державы. Именно поэтому нас удручает его слабая оборона: [ShowLocationNameWithNoTooltip('dubrovnik')] крайне уязвим для нападения как с моря, так и с суши. Разумно будет выделить золото на возведение надлежащих укреплений."
 ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')] приносит нам за один удачный торговый сезон больше, чем большинство наших провинций зарабатывают за год, а взять его может отряд грабителей, даже не потрудившись устроить настоящую осаду. Хорошие стены стоят золота, которое мы предпочли бы потратить на что-то иное — вплоть до того дня, когда город падёт без них."
 ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')] следует надёжно защитить."
 ven_walls_of_ston_decision.b: "Текущие укрепления и так достаточно прочны."
 ven_walls_of_ston_decision.historical_info: "Крепостные стены Стона, возведенные в 14 веке — серия оборонительных каменных стен на полуострове Пелешац в Хорватии. Эти стены служили для защиты важных соляных промыслов и города Стон. Они тянулись примерно на 7 километров и были в числе самых длинных фортификаций в Европе, выделяясь как своей впечатляющей длиной, так и стратегической значимостью."
 zan_husuni_kubwa_decision.title: "[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]"
 zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName] — вот благодаря кому в самом сердце [target_location.Custom('LR_GEN')|l] [target_location.GetName] началось строительство [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой резиденции. Однако воплотить замысел по возведению самого величественного в державе дворца так и не удалось: череда разных бедствий, перенаправление уже выделенных денег на другие нужды, а затем и болезнь заказчика привели к тому, что сначала строительство затянулось, а потом и вовсе остановилось. Однако наши архитекторы не унывают — они уже представили нам новые планы дворца, к которому собираются пристроить разные склады и покои для удобства купцов. Разумеется, нельзя обойтись без великолепного тронного зала. Остаётся лишь самое несущественное: деньги."
 zan_husuni_kubwa_decision.desc.entry: "Каждый правитель до нас хотел достроить этот дворец, и каждый правитель до нас находил причину, почему это невозможно. Новый план для [ShowLocationName('kilwa_kisiwani')], с достаточным числом складов под стать нашей торговле и тронным залом, достойным приёма гостей, ждёт лишь денег, которых не хватало и прежним попыткам."
 zan_husuni_kubwa_decision.a: "Начнём строительство."
 zan_husuni_kubwa_decision.b: "Сейчас это нам не по карману…"
 zan_husuni_kubwa_decision.historical_info: "Хусуни Кубва служит символом архитектурного мастерства и политического влияния султаната Килва времён расцвета его могущества в XIV веке. Построенный при султане Аль-Хасане ибн Сулеймане в Килва-Кисивани, этот обширный дворцовый комплекс простирается на 1,6 гектар и возведён преимущественно из кораллового камня. Его архитектура представляет смесь суахильских, исламских и персидских элементов. Во дворце были роскошные личные покои, обширные дворы, сложные банные дома и склады, что подчёркивало многогранную роль дворца как монаршей резиденции, торгового центра и укрепления."
 construct_the_building_at_another_time_tt: "Возможно, лучше будет достроить [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')] позже…"
 unlocked_husuni_kubwa_tt: "Мы разблокировали [Concept('building', 'сооружение')|e] «Хусуни Кубва» в особом [Concept('event', 'событии')|e]"
 pap_quirinal_palace_decision.title: "Летняя папская резиденция"
 pap_quirinal_palace_decision.desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle] желает основать новую летнюю резиденцию вдали от грязных и шумных улиц #TOOLTIP:LOCATION,rome,X #L Рима#!#!. Идеальным местом для строительства мог бы стать Квиринал — самый высокий из семи холмов Рима, с которого открывается прекрасный вид на окрестности. Если мы одобрим этот проект, то за проектирование и строительство резиденции будет отвечать наш опытный архитектор [fontana.GetName]."
 pap_quirinal_palace_decision.desc.entry: "Суета центрального [ShowLocationName('rome')] — это именно то, чего папе следует избегать, а Квиринальский холм предлагает свежий воздух и вид без толчеи. $name_dominic$ $Fontana$ — зодчий, способный это построить, если Святой Престол согласится платить за вторую резиденцию, без которой можно было бы обойтись."
 pap_quirinal_palace_decision.a: "Построим летнюю резиденцию на Квиринальском холме."
 pap_quirinal_palace_decision.b: "Сейчас не время для постройки роскошных зданий."
 pap_quirinal_palace_decision.historical_info: "Квиринальский дворец был возведён в 1583 году по заказу папы Григория XIII и стал летней папской резиденцией, позволявшей отдохнуть от жары и суеты центрального района Рима. Над проектом дворца работали Доменико Фонтана и другие видные архитекторы. Когда новое королевство Италия присоединило оставшиеся земли Папской Области, Квиринальский дворец стал резиденцией итальянских королей."
 nav_camara_comptos_decision.title: "Камара-де-комптос"
 nav_camara_comptos_decision.desc: "Управление государственными средствами — дело серьёзное, и [ROOT.GetCountry.GetGovernment.GetRuler.GetName] считает, что [ROOT.GetCountry.GetLongName] только выиграет, если мы создадим институт, который будет заниматься такими вопросами.\n\n[GetCountry('FRA').GetLongName] уже имеет аналогичный опыт, и мы можем использовать его для того, чтобы повысить свою экономическую стабильность и лучше справляться с финансовыми трудностями, которые в нашей деликатной ситуации попросту неизбежны."
 nav_camara_comptos_decision.desc.entry: "Казна, ведущаяся на глазок, неплохо справляется в хорошие годы и жестоко подводит в плохие, а пример $FRA$ показывает, что постоянное учреждение справляется лучше в обоих случаях. Создание своего собственного означало бы отказ от части личного усмотрения правителя над казной ради ведомства, которое переживёт внимание к нему любого отдельного правителя."
 nav_camara_comptos_decision.a: "Мы создадим новый институт."
 nav_camara_comptos_decision.historical_info: "До учреждения Камара-де-комптос, то есть Счётной палаты, королевскими финансами занимались так называемые #italic ойдоры#! (от глагола #italic oir#!, «слышать»). Первая счётная книга появилась в 1258 году, следовательно, тогда эта должность уже существовала. Позднее, вдохновившись французскими финансовыми институтами, в том числе парижской #italic Шамбр-де-компт#!, Карл II объединил ойдоров в отдельный орган, который осуществлял контроль за расходами королевства и консультировал правителей в финансовых вопросах.\n\nЭта счётная палата считается старейшей в Испании. Она до сих пор работает при парламенте автономного сообщества Наварра."
 hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]"
 hun_bibliotheca_corviniana_decision.desc: "Пока идеи #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#! распространяются по континенту подобно лесному пожару, зажигая пламя научного и культурного возрождения, наши придворные вовсю обсуждают новые перспективы, а учёные, творцы и мыслители, вдохновлённые свежими идеями, уже собираются в наших городах. Есть предложение построить для них грандиозную библиотеку в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName], благодаря которой #ONCLICK:COUNTRY,[GetCountry('HUN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('HUN').Custom('CL_tt')],X [GetCountry('HUN').Custom('CL_ACC')|L]#!#! станут считать подлинным оплотом Возрождения. Впрочем, финансирование такого проекта обойдётся весьма дорого. Следует ли нам вкладывать средства в строительство #TOOLTIP:BUILDING_TYPE,bibliotheca_corviniana,X #L Библиотеки Корвина#!#!?"
 hun_bibliotheca_corviniana_decision.desc.entry: "Каждый город, притязающий на лидерство в [ShowInstitutionName('renaissance')], уже построил что-то в подтверждение этого, а $HUN$ — ещё нет. Великая библиотека в столице привлекла бы учёных, которые сейчас проходят мимо нас, — ценой, которую задним числом будет легче оправдать, чем сегодня."
 hun_bibliotheca_corviniana_decision.a: "Великолепно!"
 hun_bibliotheca_corviniana_decision.b: "Нам это не по карману."
 unlocked_bibliotheca_corviniana_tt: "Мы открыли [building|e] «$bibliotheca_corviniana$» благодаря флавор-[decision|e]"
 hun_bibliotheca_corviniana_decision.historical_info: "Матьяш Корвин, прозванный Королём Возрождения, покровительствовал искусству и науке: в его правление именно Венгрия стала первой страной за пределами Италии, принявшей идеи Ренессанса. Ключевую роль в культурном возрождении Венгрии сыграла Библиотека Корвина — важнейший центр обмена знаниями и их распространения по всей державе. Она привлекала учёных со всей Европы, вносивших свой вклад в интеллектуальную палитру страны. Став подлинным символом венгерской страсти к познанию мира, эта библиотека наглядно показала важность покровительства власти в развитии науки и инноваций."
 mam_ablaq_palace_decision.title: "Город-цитадель [ShowLocationNameWithNoTooltip('cairo')]"
 mam_ablaq_palace_decision.desc: "[target_location.GetName] — центр знаний, просвещения и торговли между #TOOLTIP:CONTINENT,africa,X #L Африкой#!#! и Средиземноморьем, — не зря называют сердцем [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. Эта цитадель долгое время была надёжным оплотом наших величайших правителей. Теперь [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')|l] собирается реализовать амбициозный план по улучшению цитадели, включающий строительство новой мечети-медресе, просторного зала для торжественных приёмов, а также центра по производству кисвы."
 mam_ablaq_palace_decision.desc.entry: "Цитадель, что принимала поколения правителей, всё ещё можно представить так, будто она принимала лишь величайших из них. Расширение её новой мечетью-медресе, более величественным залом для приёмов и мастерской кисвы сказало бы о нашем правлении не меньше, чем любой поход, — при этом гораздо меньшей кровью."
 mam_ablaq_palace_decision.a: "Прекрасно."
 mam_ablaq_palace_decision.b: "Нам стоит поберечь свои средства."
 unlocked_ablaq_palace_tt: "Мы открыли это [building|e] благодаря [decision|e] «$mam_ablaq_palace_decision.title$»"
 son_trans_saharan_decision.title: "Расцвет торговли через Сахару"
 son_trans_saharan_decision.desc: "Благодаря тому, что мы установили контроль над ключевыми маршрутами, торговля через Сахару начала процветать. Но нельзя останавливаться на достигнутом — нам следует развивать наши торговые аванпосты в таких городах, как [ShowLocationName('alexandria')], [ShowLocationName('tunis')] и [ShowLocationName('fez')], поскольку они служат основными стоянками для наших караванов."
 son_trans_saharan_decision.a: "Пусть эти города процветают."
 son_trans_saharan_decision.b: "Вместо отдельных мест лучше развивать торговлю в целом."
 son_trans_saharan_decision.c: "Нет смысла тратить на это деньги."
 son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "Позволяет строить #TOOLTIP:BUILDING_TYPE,trans_saharan_trade_outposts,X #L торговые аванпосты#!#! в #TOOLTIP:LOCATION,fez,X #L Фесе#!#!, #TOOLTIP:LOCATION,tunis,X #L Тунисе#!#! и #TOOLTIP:LOCATION,alexandria,X #L Александрии#!#!"
 son_conversion_west_africa_decision.title: "Обращение африканских держав"
 son_conversion_west_africa_decision.desc: "Хотя мы и являемся сильнейшей державой #TOOLTIP:REGION,guinea_region,X #L Гвинеи#!#!, в регионе ещё остались народы, которые до сих пор не приняли #TOOLTIP:RELIGIONGROUP,muslim,X #L ислам#!#!. Конечно, мы могли бы обратить их силой, но [target_character.GetName] считает, что лучше использовать дипломатию, чтобы не вызвать гнев местного населения."
 son_conversion_west_africa_decision.desc.entry: "Меч не обращает никого, кто пережил обращение, — он лишь заставляет замолчать тех, кто мог бы возразить. Правитель предпочёл бы отправить в [ShowRegionName('guinea_region')] миссионеров, а не солдат, обменяв более медленное распространение веры на такое, после которого не остаётся дымящихся деревень."
 son_conversion_west_africa_decision.a: "Это звучит разумно."
 son_conversion_west_africa_decision.b: "Лучше применить силу."
 son_unlock_diplo_action_to_demand_conversion_tt: "Мы получим доступ к [Concept('country_interaction', 'взаимодействию с державой')|e] «[ShowCountryInteractionName('demand_conversion_to_islam')]» против языческих стран #TOOLTIP:REGION,guinea_region,X #L Гвинеи#!#!"
 ori_elephant_hunting_grounds_decision.title: "Охота на слонов"
 ori_elephant_hunting_grounds_decision.desc: "В связи с избытком #TOOLTIP:GOODS,elephants,X #L слонов#!#!! в [ROOT.GetCountry.Custom('CL_PREP')] многие стали задумываться об увеличении числа полков, укомплектованных этими могучими животными. Однако в наших #TOOLTIP:BUILDING_TYPE,elephant_hunting_grounds,X #L местах охоты на слонов#!#! не хватает ресурсов для отлова большего числа зверей и производства необходимого снаряжения. Возможно, пришло время привести эти угодья в порядок. [target_character.GetName] и [ROOT.GetCountry.GetGovernment.GetCourtTitle] даже готовы вложить в такие улучшения свои личные средства."
 ori_elephant_hunting_grounds_decision.desc.entry: "Слон не приносит войску большой пользы, пока его не поймают, не обучат и не снарядят, а наши [ShowBuildingTypeName('elephant_hunting_grounds')] сейчас едва справляются хоть с чем-то из этого. Двор готов потратить на расширение собственные деньги, так что выбор упирается не столько в деньги, сколько в то, отвечают ли дополнительные боевые слоны нашим нынешним замыслам."
 ori_elephant_hunting_grounds_decision.a: "Мы профинансируем этот проект."
 ori_elephant_hunting_grounds_decision.b: "Только зря деньги потратим."
 ori_double_elephant_hunting_ground_level_tt: "Максимальный уровень [Concept('building', 'сооружений)|e] типа #TOOLTIP:BUILDING_TYPE,elephant_hunting_grounds,X #L «места охоты на слонов»#!#! повысится на #G 2#!."
 INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "Повышение максимального уровня в ходе [Concept('events', 'события')|e]"
 jap_rangaku_decision.title: "Рангаку"
 jap_rangaku_decision.desc: "С некоторых пор #L [target_country.GetAdjective|l]ие#! купцы облюбовали остров Дэдзима в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Контакты нашего населения с этим анклавом строго контролируются, однако культурный обмен всё равно идёт. Похоже, [target_country.GetAdjectiveWithNoTooltip|l]ие торговцы обладают более обширными знаниями в науке, производстве, машиностроении и особенно в медицине. Некоторые зажиточные граждане нашей державы не пожелали довериться местным врачам и обратились к услугам [target_country.GetAdjectiveWithNoTooltip|l]ого хирурга из анклава.\n\nОчевидно, нам есть чему поучиться у гостей с Запада, но для этого придётся рискнуть и приоткрыть этим чужакам доступ к нашим провинциям."
 jap_rangaku_decision.desc.entry: "Даже за тщательно охраняемой торговой факторией не удержать все знания за возведёнными для этого стенами, и анклав $NED_ADJ$ годами просачивается к нам медициной, механикой и наукой. Ослабив надзор, мы впустим больше этого, поплатившись той самой изоляцией, которую он призван был сохранить."
 jap_rangaku_decision.a: "Пусть [target_country.GetAdjectiveWithNoTooltip|l]ие люди несут просвещение в наши земли."
 jap_rangaku_decision.a.entry: "Открыть наши провинции для знаний $NED_ADJ$."
 jap_rangaku_decision.a.tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] #TOOLTIP:GOVERNMENT_REFORM,jap_rangaku,X #L Рангаку#!#!"
 jap_rangaku_decision.b: "Мы не пустим чужеземцев в наши провинции."
 mch_mandarin_language_reforms_decision.title: "По заветам прежнего режима"
 mch_mandarin_language_reforms_decision.desc: "Мы лишь одна из ветвей в семейном древе божественных императоров #TOOLTIP:SUB_CONTINENT,china,X #L Китая#!#!. Различные династии до нас уже учредили эффективные органы управления, чтобы сохранить единство огромного #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#!. Почему бы не перенять эту политику? Так мы станем более #TOOLTIP:SOCIETAL_VALUE,sinicized_vs_unsinicized,X #L китаизированными#!#!, зато сохраним преемственность и укрепим свою власть в глазах простого люда."
 mch_mandarin_language_reforms_decision.a: "Нужно перенять эти учреждения."
 mch_mandarin_language_reforms_decision.b: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|l] видят, что мы им благоволим."
 mch_mandarin_language_reforms_decision.b.entry: "Favor the $tribes_estate$."
 unlock_chinese_language_reforms: "Это действие откроет [Concept('government_reforms', 'государственный принцип')|e] «[ShowGovernmentReformName('three_departments_system')]»."
 MCH_conditional_benefit: "Если мы не установим [Concept('government_reforms', 'государственный принцип')|e] «[ShowGovernmentReformName('three_departments_system')]», [ShowEstatePrivilegeName('mch_tribal_favor')|l] даст дополнительные преимущества."
 pru_unified_legal_system_decision.title: "Правовая реформа"
 pru_unified_legal_system_decision.desc: "Залог выживания нашей державы — в умении приспосабливаться к изменениям. Сейчас на её благо трудится, не покладая рук, [target_character.GetName] — председатель #italic камерального суда#!, человек, способный возглавить проведение столь необходимых реформ в правовой системе. Планы его затрагивают #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! целиком, и если поддержать его в этом начинании, реформы будут быстрыми и существенными."
 pru_unified_legal_system_decision.desc.entry: "Правовая система, унаследованная от доброго десятка разных эпох, не служит по-настоящему хорошо никому, и обычно уже одного этого достаточно, чтобы она пережила ещё одно поколение без реформ. Президент #italic Кёнигсбергской судебной палаты#! составил план, способный это изменить, и, поддержав его, мы возьмём на себя обязательство провести реформу, полного облика которой пока не видим."
 pru_unified_legal_system_decision.a: "Поддержать реформы!"
 pru_unified_legal_system_decision.a.tt: "Прогресс реформы значительно ускорится"
 pru_unified_legal_system_decision.b: "Приструним его."
 pru_unified_legal_system_decision.b.tt: "Прогресс реформы значительно замедлится"
 boh_bohemian_commonwealth_decision.title: "Учреждение Речи Посполитой"
 boh_bohemian_commonwealth_decision.desc: "На глазах нашего рода #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! удалось пройти путь от малозначимой страны до крупной державы имперского разряда, которая занимает далеко не последнее место в мировой политике, а также правит обширными землями и многочисленными народами. Однако задача это непростая — для её выполнения требуется твёрдая рука. Власти [ROOT.GetCountry.Custom('rank_ru_GEN')|l] опасаются роста сепаратизма и напряжения среди жителей, а потому некоторые предлагают принять новую конституцию, призывая оставить [ROOT.GetCountry.Custom('CL_ACC')] в прошлом и вместо этого установить полноценное содружество. Наша держава, расположившаяся на просторах #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, непременно займёт полагающееся ей место среди сильных мира сего."
 boh_bohemian_commonwealth_decision.desc.entry: "Империя, выросшая из небольшого королевства, не достигла этого, обращаясь со множеством своих народов как с единым целым, и удержать их вместе теперь можно, лишь признав наконец, что это не так. Новое содружество, более широкое, чем то, что традиционно было нашим, ставит под угрозу саму самобытность, создавшую империю, ради того, чтобы не дать империи разорваться по швам."
 boh_bohemian_commonwealth_decision.a: "Примем новую конституцию."
 boh_bohemian_commonwealth_decision.b: "Оставим ту, которая есть."
 ned_unified_dutch_admiralties_decision.title: "Учреждение пяти адмиралтейств"
 ned_unified_dutch_admiralties_decision.desc: "Официально нашими землями правит [target_character.GetName], однако между провинциями накопилась масса противоречий, и представители #TOOLTIP:BUILDING_TYPE,admiralty,X #L адмиралтейств#!#! не могут найти общий язык. Пока [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] и [ShowLocationName('amsterdam')] продолжают враждовать, наш флот так и останется разрозненным. Однако, позволив военным действовать независимо, мы можем добиться от них большей лояльности центральной власти."
 ned_unified_dutch_admiralties_decision.desc.entry: "Пять адмиралтейств, подчинённых пяти портам, — это пять флотов, соперничающих за одни и те же корабли. Объединение [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] и [ShowLocationName('amsterdam')] под единым командованием положило бы конец соперничеству, хотя, позволив каждому ещё некоторое время преследовать собственные интересы, мы, возможно, выручим от всех пяти больше, чем принудительным слиянием."
 ned_unified_dutch_admiralties_decision.a: "Пусть всё остаётся как есть."
 ned_unified_dutch_admiralties_decision.b: "Мы объединим адмиралтейства."
 NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "Открывает [Concept('government_reform', 'государственный принцип')|e] «[ShowGovernmentReformName('unified_admiralty_reform')]»."
 ned_unified_dutch_admiralties_decision.historical_info: "В годы Нидерландской буржуазной революции, направленной на борьбу с династией Габсбургов, голландцы создали конфедерацию, где каждая провинция сохраняла известную степень независимости. Однако патриоты и оранжисты продолжали воевать за контроль над провинциями, и государство оставалось сильно разобщённым. Эта система была упразднена только во времена Батавской республики и правления Наполеона. Ей на смену пришло хорошо известное нам Королевство Нидерландов."
 hol_ned_seven_provinces_decision.title: "Семь провинций"
 hol_ned_seven_provinces_decision.desc: "Пусть Нидерланды и объединяет общая цель, эти земли остаются разрозненными в силу различий в правовом и культурном планах. Однако мы можем использовать эту разобщённость себе во благо. Если мы создадим конфедерацию, где каждая провинция будет иметь отдельное законодательство, при этом подчиняясь единому центру, мы сможем обеспечить нашим территориям защиту и процветание и переключить внимание на внешние дела."
 hol_ned_seven_provinces_decision.a: "Мы создадим конфедерацию."
 hol_ned_seven_provinces_decision.b: "Децентрализация — не лучшее решение."
 swe_age_of_freedom_decision.title: "Пересмотр абсолютизма"
 swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U] на грани катастрофы. [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle|U] имеет столько же противников, сколько и сторонников, и новые клики, поддерживающие очередного претендента, вырастают из ниоткуда каждый день. На [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ое правительство оказывается такое влияние из-за рубежа, что мы превращаемся из великой державы в марионеточное государство, а подданные всех сословий открыто выражают недовольство жизнью в удушающих тисках абсолютизма.\n\nЕсли [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle|l] попытается сохранить полный контроль, это может стать фатальной ошибкой. Но какое бы решение мы ни приняли, нам предстоит столкнуться с жёсткой оппозицией."
 swe_age_of_freedom_decision.desc.entry: "Регент, у которого соперники в каждом углу королевства, на деле не правит, а лишь разнимает спорящих, и иностранные дворы заметили эту разницу так же ясно, как и наши подданные. Держаться абсолютной власти теперь означает рисковать борьбой, в исходе которой никто из нас не может быть уверен, каким бы путём мы ни решили ответить на этот вызов."
 swe_age_of_freedom_decision.a: "Откажемся от абсолютизма."
 swe_age_of_freedom_decision.b: "Удержим бразды правления."
 swe_age_of_freedom_always: "Это обязательная реформа. От неё нельзя избавиться целенаправленно."
 swe_age_of_freedom_decision.historical_info: "Карл XII не оставил после себя наследников, поэтому королевой стала его младшая сестра Ульрика Элеонора. Этим немедленно воспользовался член риксдага Арвид Горн — ярый сторонник свержения абсолютизма и укрепления власти парламента, добившийся в итоге и того, и другого. И хотя подобный демократический уклон можно назвать похвальным, действия Горна привели к наступлению в стране смуты. На следующие полвека Швеция стала безвольной марионеткой в руках других держав. В эпоху свободы дворянство также сумело вернуть себе часть утраченных привилегий. Юная королева, впрочем, не видела другого выхода, а потому поступила так, чтобы не возмущать и без того уставших от войны подданных."
 iro_iroquois_interactions_decision.title: "Наследие Великого Миротворца"
 iro_iroquois_interactions_decision.desc: "Усилиями Великого Миротворца Деганавиды, некогда разрозненные племена #TOOLTIP:CULTUREGROUP,haudenosaunee_group,X #L хауденосауни#!#! объединились в конфедерацию. Положив конец междоусобной вражде, они стали единой семьёй народов, живущей в мире и согласии. Однако теперь всё чаще звучит мнение, что одно из племён должно стать гегемоном и повести за собой остальных. Подобное решение может поколебать сами основы, на которых Деганавида создал Конфедерацию хауденосауни."
 iro_iroquois_interactions_decision.a: "Времена меняются."
 may_unify_haudenosaunee_confederation: "Открывает #TOOLTIP:COUNTRY_INTERACTION,form_closer_bond_iroquois,X #L установление тесных связей#!#! и #TOOLTIP:COUNTRY_INTERACTION,merge_tribe_iroquois,X #L слияние племён#!#! с другими народами #TOOLTIP:CULTUREGROUP,haudenosaunee_group,X #L хауденосауни#!#!. Объединив территории родственных племён, мы сможем образовать единую Конфедерацию хауденосауни."
 hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ войдёт в наш [court|e]"
 kulm_law_not_revised_tooltip: "Решило не пересматривать [ShowEstatePrivilegeName('kulm_law')] посредством [decision|e] «$teu_kulm_law_revised_decision.title$»."
 kulm_law_revised_tooltip: "Пересмотрело [ShowEstatePrivilegeName('kulm_law')] посредством [decision|e] «$teu_kulm_law_revised_decision.title$»."
 pru_unified_legal_system_decision.a_tt: "[character|e], предлагающий реформу, появится при нашем [court|e]"
 ara_sindicat_remenca_decision.desc: "The nobility in the [ROOT.GetCountry.GetLongName] has begun to strictly enforce the rules that tie peasants to the land, and this combined with a stricter enforcement of seignorial rights in general has led to unrest among the peasants. The poorest peasants strongly support open rebellion while the better off favor appealing to us for reforms and the end of seignorial abuses.\n\nIt would be an excellent opportunity to gain the support of the peasants, as we are in a constant power struggle with the nobility. Suggestions have been made regarding allowing the peasants to form a [ShowEstatePrivilegeName('ara_sindicat_remenca')], a peasants' guild or primitive trade union, which will grant them more liberty."
