l_russian:
 textiles: "Текстиль"
 textiles_desc: "Всё, что относится к ткани и одежде — от простой шерсти до изысканного роскошного платья. Поддержка этой отрасли повышает спрос на текстиль по всей державе и ускоряет рост числа ткацких и портняжных мастерских в выбранной области."
 crafts: "Ремесла"
 crafts_desc: "Индивидуальное и гильдейское производство инструментов, стальных и кожаных изделий, а также каменное строительство. Основа городской промышленности."
 arms: "Оружие"
 arms_desc: "Производство холодного, а позднее и огнестрельного оружия. Развитая оружейная промышленность позволяет достичь независимости в вопросах снабжения армий."
 luxury: "Предметы роскоши"
 luxury_desc: "Производство стеклянных, ювелирных, фарфоровых и лаковых изделий. Эта престижная промышленность обогащает занятых в ней горожан."
 paper_goods: "Бумажные изделия"
 paper_goods_desc: "Бумажные фабрики и книжные мастерские способствуют не только обогащению, но и распространению грамотности."
 furnishings: "Домашняя утварь"
 furnishings_desc: "Мебель и посуда нужны в каждом доме."
 naval: "Судостроительные материалы"
 naval_desc: "Доски, парусина, дёготь и другие материалы, необходимые для строительства и содержания флотов."
 beverages: "Спиртные напитки"
 beverages_desc: "Вино, пиво, и крепкий алкоголь. Жаждущий рынок щедро вознаграждает регионы, которые производят эти товары."
 game_industry_type_struct: "$KEY_LOC$"
 game_industry_promotion_struct: "$KEY_LOC$"
 game_concept_industry_promotion: "Поддержка отрасли"
 game_concept_industry_promotions: "Поддержка отрасли"
 game_concept_promote_industry: "Поддержать отрасль"
 game_concept_industry_promotion_desc: "Поддержка отрасли посвящает одну [area|e] отдельной отрасли промышленности. Каждая отрасль охватывает определённый набор [goods|e]: её поддержка повышает [output|e] каждого [building|e] в этой [area|e], производящего эти [goods], а также увеличивает спрос на них со стороны ваших [pops|e] по всей вашей [country|e].\n\nДля поддержки отрасли требуется [advance_icon][ShowAdvanceName('industry_promotion_advance')] [advance|e]. Количество отраслей, которые можно поддерживать одновременно, определяется параметром $MODIFIER_TYPE_NAME_possible_industry_promotions$, который растёт вместе с рангом вашей [country], вашими [government_reforms|e], а позднее и [advances|e]. Поддержку можно в любой момент отменить, чтобы освободить место."
