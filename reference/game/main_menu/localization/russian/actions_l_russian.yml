 #Government Transitions
 #Generic Keys
 transition_to_monarchy: "Переход к монархии"
 transition_to_republic: "Переход к республике"
 transition_to_theocracy: "Переход к теократии"
 warn_about_loss_of_content_tt: "Мы можем #R потерять#! доступ к определённым элементам текущей [Concept('government_type', 'формы правления')|e], таким как [Concept('policies', 'политики')|e], [Concept('laws', 'правила')|e], [Concept('buildings', 'сооружения')|e] и прочее"
 not_in_union_tt: "Мы сейчас НЕ состоим в [Concept('union', 'унии')|e]"
 #Titles and Descriptions
 monarchy_to_republic: "$transition_to_republic$"
 monarchy_to_republic_desc: "Пора установить у нас идеалы #TOOLTIP:GOVTYPE,republic,X #L республики#!#!. Прежние возглавляемые знатью институты безнадёжно устарели!"
 monarchy_to_theocracy: "$transition_to_theocracy$"
 monarchy_to_theocracy_desc: "Божественная воля требует от нас отказаться от сложившегося в правительстве статус-кво и наделить властью священников, установив в державе #TOOLTIP:GOVTYPE,theocracy,X #L теократию#!#!."
 theocracy_to_monarchy: "$transition_to_monarchy$"
 theocracy_to_monarchy_desc: "Нашему народу нужна сильная власть. Руководить державой будут богатые знатные семьи, а не священники в рясах. Будущее — только за монархией."
 ruler_regent_relatives_crown_estate_tt: "[actor.GetGovernment.GetRulerOrRegent.GetName] и [actor.GetGovernment.GetRulerOrRegent.GetHerHis] близкие родственники присоединятся к [Concept('estate', 'сословию')|e] «$crown_estate$»"
 republic_to_monarchy: "$transition_to_monarchy$"
 republic_to_monarchy_desc: "Республиканские ценности в нашей державе постепенно отмирают — власть прибирает к рукам богатая знать. Вполне логично, что следующим шагом должен стать переход к #TOOLTIP:GOVTYPE,monarchy,X #L монархической#!#! форме правления."
 tribal_to_monarchy: "$transition_to_monarchy$"
 tribal_to_monarchy_desc: "Традиции наших предков безнадёжно устарели. Чтобы пережить испытания, которые приготовила нам история, нужно преобразовать державу в #TOOLTIP:GOVTYPE,monarchy,X #L монархию#!#!."
 kicks_us_from_jurchen_confederation_tt: "После установления #TOOLTIP:GOVTYPE,monarchy,X #L монархии#!#! нас исключат из [Concept('international_organization', 'международного объединения')|e] #Y «Конфедерация чжурчжэней»#! (если мы не #Y лидер#! этого объединения)."
 gov_action_republic_to_theocracy: "$transition_to_theocracy$"
 gov_action_republic_to_theocracy_desc: "Священники постановили, что мы обязаны внедрить в державе теократические ценности, поскольку они постепенно приходят на смену нынешним. Под руководством свыше наша правоверность взлетит на небывалые высоты, невозможные в безбожном республиканском обществе."
 theocracy_to_republic: "$transition_to_republic$"
 theocracy_to_republic_desc: "Влияние священников увядает, и это не самым лучшим образом сказывается на стабильности нашей державы. Проведя череду тщательно взвешенных реформ, мы передадим остатки их власти горожанам."
 nahuatl_religious_actions_price: "Стоимость религиозных действий науа"
 set_province_capital: "Назначение столицей провинции"
