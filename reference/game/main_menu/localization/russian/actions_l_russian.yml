 ## Iberian Cabinet Actions
 por_carreira_da_india_action: "Организация рейса в Индию"
 por_carreira_da_india_action_desc: "Мы организуем рейс в Индию — это государственный конвой, который везёт пряности, ткани и фарфор из Гоа вокруг Мыса Доброй Надежды в Лиссабон. Такое путешествие увеличивает #Y доходы от торговли#!, восполняет численность #Y моряков#!, набранных в наших портах, и демонстрирует наш #Y престиж#! остальным дворам Европы."
 mediate_co_princes: "Посредничество между соправителями"
 mediate_co_princes_desc: "Мы ведём деликатную дипломатическую переписку с двумя соправителями Андорры — епископом Урхеля и графом Фуа — и вынуждены постоянно балансировать между их противоречащими друг другу притязаниями. Умелое посредничество укрепляет наше #Y дипломатическое положение#!, приносит #Y престиж#! и сохраняет стабильность хрупкого правительства княжества."
