 start_a_treasure_voyage: "Подготовка золотого флота"
 start_a_treasure_voyage_desc: "Весь мир должен узнать о величии #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#!. С этой целью мы снарядим огромный флот и отправим его исследовать неизведанные моря, повсюду прославляя #ONCLICK:COUNTRY,[GetInternationalOrganization('middle_kingdom').GetLeaderCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetInternationalOrganization('middle_kingdom').GetLeaderCountry.Custom('CL_tt')],X [GetInternationalOrganization('middle_kingdom').GetLeaderCountry.Custom('CL_ACC')|L]#!#!."
 start_treasure_voyage_tt: "Мы отправим флот в область [target_area.GetName], и его возглавит [target_character.GetName]"
 start_treasure_voyage_no_scope_tt: "Мы отправим флот в выбранную область"
 add_bureaucracy_action: "Добавление бюрократического механизма"
 add_bureaucracy_action_desc: "Широта нашего управления должна охватывать всю державу целиком. Для этого необходимо создать новый бюрократический механизм — возможно, с направлениями, которые способствовали бы его расширению. Наша эффективность не должна пострадать — при условии, что мы будем регулярно выделять необходимые средства."
 remove_bureaucracy_action: "Отказ от бюрократического механизма"
 remove_bureaucracy_action_desc: "На нашей казне лежит тяжкое бремя. Механизм, некогда разработанный для правого дела — слаженного управления державой, — теперь неисправимо испорчен. Страна погрязла в бюрократии, подобной разрастающейся язве: число чиновников только увеличивается. Пора покончить с этим, иначе народ надорвётся тянуть эту ношу."
 gag_join_faction: "Вступление во фракцию"
