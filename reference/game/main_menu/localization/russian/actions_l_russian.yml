 rot_declare_conquest_ambition_at: "[ShowGenericActionName('rot_plan_invasion')] на державы этого региона приведёт к мгновенному объявлению [Concept('war', 'войны')|e] без необходимости создавать для неё [Concept('casus_belli', 'повод')|e]"
 rot_declare_conquest_ambition_bt: "При объявлении войны каждый вражеский [Concept('location', 'район')|e] в этом регионе получит [Concept('location_modifier', 'модификатор')|e] «[ShowModifier('rot_timur_scare')]», который будет постепенно ослабевать #Y 10 лет#! до полного исчезновения эффекта. Действует, только если [GetCharacter('chg_timur_lame_borjigin').GetName] управляет державой"
