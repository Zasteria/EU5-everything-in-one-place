 provoke_rebels_tt: "Выбранные [Concept('rebellion', 'мятежники')|e] будут спровоцированы на открытое восстание, и мы сможем сокрушить их на поле боя раз и навсегда!"
 negotiate_rebels_buy_off: "Откуп от мятежников"
 negotiate_rebels_buy_off_desc: "Потратьте дукаты, чтобы подкупить лидеров [Concept('rebels', 'мятежников')|e] и замедлить их движение к восстанию."
