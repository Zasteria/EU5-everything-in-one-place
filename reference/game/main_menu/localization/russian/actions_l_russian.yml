 join_religious_league: "Вступление в Религиозную лигу"
 join_religious_league_desc: "Вступите в #Y Религиозную лигу#! для [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,war_of_religions,X #L «Религиозная война»#!#!."
