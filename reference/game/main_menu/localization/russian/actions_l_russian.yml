 sengoku_attempt_imperial_restoration: "Попытка возрождения империи"
 sengoku_attempt_imperial_restoration_desc: "Мы должны воспользоваться слабостью #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L сёгуната#!#! и попытаться восстановить власть императорской династии."
 sengoku_attempt_imperial_restoration.tt: "Мы объявим о независимости наших земель от власти #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L сёгуната#!#!#TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L Японского Сёгуната#!#!"
 sengoku_force_end_war: "Принудительное завершение войны"
 sengoku_force_end_war_desc: "Опустошительные войны разрушают нашу державу. Мы можем воспользоваться императорской властью и отправить официальных послов к воинственному клану, принудив его к прекращению войны."
 sengoku_force_end_war_choose_war: "Выберите, какую [Concept('war', 'войну')|e] завершить"
 sengoku_revoke_clans_land: "Отъём земель"
 sengoku_revoke_clans_land_desc: "Отнять часть выделенных земель и вернуть их под контроль #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L Японского сёгуната#!#!."
 sengoku_limit_clans_autonomy: "Ограничение автономии кланов"
 sengoku_limit_clans_autonomy_desc: "Кланы выходят из-под контроля и действуют без оглядки на нашу власть. Мы должны заставить их подчиниться и следовать указам #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L сёгуната#!#!."
 sengoku_summon_to_court: "Призвание ко двору"
 sengoku_summon_to_court_desc: "Лидеры кланов игнорируют нашу власть. Мы должны призвать их ко двору, где сможем держать их под контролем, тогда как отказ подчиниться позволит обвинить клан в измене."
 sengoku_proclaim_clan_independence: "Провозглашение независимости клана"
 sengoku_proclaim_clan_independence_desc: "[GetUniqueInternationalOrganization('japanese_shogunate').GetName] ослаб и больше не может эффективно контролировать кланы. Мы должны воспользоваться сложившейся ситуацией и добиться независимости от власти сёгуна."
 clan_has_valid_landable_location.tt: "У нас есть присутствие в принадлежащих сёгуну [Concept('locations', 'районах')|e], где мы владеем большинством [Concept('foreign_buildings', 'заграничных сооружений')|e]"
 sengoku_increment_recruitment: "Дополнительный набор"
