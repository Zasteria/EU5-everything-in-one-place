l_russian:
 choose_holy_war: "Выберите священную войну"
 choose_holy_war_for_recruitment: "Выберите священную войну"
 offer_cardinal_seat_for_crusade: "Предложение кафедры кардинала"
 offer_cardinal_seat_for_crusade_desc: "Мы предложим папское покровительство католической державе, не участвующей в [Concept('crusade', 'крестовом походе')|e], и пообещаем одному из её прелатов кафедру кардинала в том случае, если держава присоединится к священной войне."
 offer_cardinal_seat_for_crusade_invite_tt: "Выбранная держава получит предложение присоединиться к [Concept('crusade', 'крестовому походу')|e] с обещанием построить в столице кафедру кардинала"
 preach_the_crusade: "Проповеди о крестовом походе"
 preach_the_crusade_desc: "Мы отправим проповедников объявить о [Concept('crusade', 'крестовом походе')|e], чтобы разжечь религиозное рвение и призвать католические державы присоединиться к войне."
 preach_the_crusade_zeal_tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#! (максимум 100)"
 preach_the_crusade_invite_tt: "Выбранная держава получит предложение присоединиться к войне"
 hasten_holy_war_preparations_tt: "Ускоряет подготовку к священной войне на #G 10#!, расходуя #R 5#! ед. религиозного рвения"
 grant_indulgence: "Дарованная индульгенция"
 grant_indulgence_desc: "Даруйте участнику [Concept('crusade', 'крестового похода')|e] папскую индульгенцию, пообещав отпущение грехов тем, кто поддержит его. Добровольцы стекаются под знамёна похода, временно ускоряя восстановление [Concept('manpower', 'числа рекрутов')|e]."
 levy_the_saladin_tithe: "Сбор десятины Саладина"
 levy_the_saladin_tithe_desc: "Призовите всех остающихся в стороне католиков поддержать крестовый поход деньгами. Каждый из них должен заплатить, присоединиться к крестовому походу или отказаться и заслужить презрение верующих."
 levy_the_saladin_tithe_tt: "Все католические державы, не участвующие в [Concept('crusade', 'крестовом походе')|e], получат уведомление о сборе десятины, с просьбой внести вклад в военную казну, присоединиться к [Concept('crusade', 'крестовому походу')] или же отказаться"
 offer_recognition_for_jihad: "Предложение признания"
 offer_recognition_for_jihad_desc: "Признайте положение мусульманской державы, не участвующей в [Concept('jihad', 'джихаде')|e], даровав ей [Concept('religious_influence', 'религиозное влияние')|e] и [Concept('legitimacy', 'легитимность')|e] милостью халифа, чтобы привлечь её в священную войну."
 offer_recognition_for_jihad_invite_tt: "Выбранная держава получит предложение халифатского признания, а также определённое количество [Concept('religious_influence', 'религиозного влияния')|e] и [Concept('legitimacy', 'легитимности')|e], чтобы присоединиться к [Concept('jihad', 'джихаду')|e]"
 issue_a_fatwa: "Издание фетвы"
 issue_a_fatwa_desc: "Прикажите улему выпустить фетву с одобрением [Concept('jihad', 'джихада')|e], чтобы значительно увеличить его религиозное рвение и призвать остающуюся в стороне мусульманскую державу присоединиться к священной войне."
 issue_a_fatwa_zeal_tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 8#! (максимум 100)"
 issue_a_fatwa_invite_tt: "$preach_the_crusade_invite_tt$"
 promise_of_martyrdom: "Обещание мученичества"
 promise_of_martyrdom_desc: "Пообещайте участнику [Concept('jihad', 'джихада')|e] мученичество, гарантировав, что все, кто погибнет за святое дело, попадут в рай. Верующие стекаются под знамёна джихада, временно ускоряя восстановление [Concept('manpower', 'числа рекрутов')|e]."
 levy_the_war_zakat: "Введение военного закята"
 levy_the_war_zakat_desc: "Призовите всех остающихся в стороне мусульман поддержать джихад деньгами. Каждый из них должен заплатить, присоединиться к джихаду или отказаться и заслужить презрение верующих."
 levy_the_war_zakat_tt: "Все мусульманские державы, не участвующие в [Concept('jihad', 'джихаде')|e], получат уведомление о сборе десятины с просьбой внести вклад в военную казну, присоединиться к [Concept('jihad', 'джихаду')] или отказаться"
 recover_holy_relics: "Возвращение священных реликвий"
 recover_holy_relics_desc: "Верните священную реликвию из отвоёванной святыни. Её возвращение принесёт нашей державе [Concept('prestige', 'престиж')|e], признание со стороны верующих и рост рвения."
 recover_holy_relics_enabled_tt: "Мы должны оккупировать завоёванную католическую святыню и контролировать её, но не владеть ей"
 plunder_the_conquered: "Разорение покорённых"
 plunder_the_conquered_desc: "Решительно разграбьте оккупированные земли врага, пополнив добычей нашу казну."
 convert_occupied_territory: "Обращение покорённых"
 convert_occupied_territory_desc: "Отправить миссионеров в оккупированные нами вражеские земли и обратить местных жителей в истинную веру."
 discipline_the_faithless: "Осуждение маловерных"
 discipline_the_faithless_desc: "Пригрозить участнику, который вносит слишком малый вклад в священную войну. Если тот не исправится, его ждёт отлучение от церкви или осуждение."
 distribute_holy_war_spoils: "Распределение добычи"
 distribute_holy_war_spoils_desc: "Распределить нашу часть военной казны между участниками, вносящими вклад в войну, и вознаградить каждого сообразно вкладу, увеличив их рвение."
 offer_cardinal_seat_for_crusade_price: "Стоимость кафедры кардинала"
 offer_recognition_for_jihad_price: "Стоимость признания"
 preach_the_crusade_price: "Стоимость проповеди"
 issue_a_fatwa_price: "Стоимость фетвы"
 grant_indulgence_price: "Стоимость индульгенции"
 promise_of_martyrdom_price: "Стоимость обещания мученичества"
 convert_occupied_territory_price: "Стоимость обращения"
 hasten_holy_war_preparations_price: "Стоимость ускоренной подготовки"
 petition_for_the_bula_de_cruzada_price: "Стоимость Bula de Cruzada"
 summon_iberian_military_orders_price: "Стоимость призыва духовно-рыцарских орденов"
 summon_volunteers_of_the_faith_price: "Стоимость призыва добровольцев"
 proclaim_jihad_privileges: "Объявление о преимуществах джихада"
 proclaim_jihad_privileges_desc: "Объявить о преимуществах и наградах, которые ждут всякого, кто с оружием в руках присоединится к священной войне. Каждый участник [Concept('jihad', 'джихада')|e] получит долговременный рост [Concept('prestige', 'престижа')|e] и [Concept('religious_influence', 'религиозного влияния')|e]."
 proclaim_jihad_privileges_price: "Стоимость объявления"
 ACTION_COST: "Потратьте $PRICE$ и получите следующие эффекты:"
 estate_emergency_action: "Чрезвычайное действие сословия"
 estate_emergency_war_defender_discount: "Во время оборонительной войны"
 call_jihad: "Объявление джихада"
 call_jihad_desc: "Выберите державу безбожников и обрушьте на неё гнев Аллаха."
 call_jihad_select_country: "Выберите державу, которой хотите объявить джихад:"
 call_jihad.tt: "Объявлен новый #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,jihad,X #L джихад#!#! против выбранной [Concept('country', 'державы')|e]"
 leader_of_jihad_tt: "Мы становимся лидером #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,jihad,X #L джихада#!#!"
 study_islamic_texts: "Изучение исламских текстов"
 study_islamic_texts_desc: "Чтобы лучше привязать свод правил и управление к учениям нашей веры, советники поручат богословам изучить основные #TOOLTIP:RELIGIONGROUP,muslim,X #L исламские#!#! тексты. Эти труды — источник вечной мудрости, и их интерпретация в текущем контексте укрепит моральные устои нашего общества."
 call_upon_the_faithful: "Призыв верующих"
 call_upon_the_faithful_desc: "Боевой клич эхом разносится по нашим владениям, знамёна предков гордо веют на ветру, привлекая воинов ислама, готовых пожертвовать собой ради высшей цели."
 mobilize_the_shurat_action: "Мобилизация аш-Шурат"
 mobilize_the_shurat_action_desc: "#TOOLTIP:RELIGION,$ibadi_tt$,X #L Ибадитская#!#! община не выживет, если будет только обороняться. Мы должны занять более агрессивную позицию, заручившись поддержкой верных аш-Шурат, героев, готовых пожертвовать собой ради веры."
 elect_weak_imam: "Избрание слабого имама"
 elect_weak_imam_desc: "Для державы [actor.GetLongName] настали тяжёлые времена. #TOOLTIP:RELIGION,$ibadi_tt$,X #L Ибадитская#!#! община окажется в опасности, если мы не поставим во главе опытного командира, способного вести нас за собой."
 return_to_zuhur_imamate: "Возвращение сильного имама"
 return_to_zuhur_imamate_desc: "Времена войны прошли, и #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитская#!#! община снова процветает. [ShowPolicyName('ibadi_daif_imam_policy')] больше не требуется, уммой вновь будет праведно управлять [ShowPolicyName('ibadi_zuhur_imam_policy')|l]."
 legacy_of_rustamids: "Претензия на рустамидское наследие"
 legacy_of_rustamids_desc: "Когда-то #TOOLTIP:REGION,maghreb_region,X #L Магрибом#!#! правила могущественная #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитская#!#! династия персидского происхождения, Рустамиды. Она создала второй центр ибадитской веры. И хотя с падения династии в 909 году прошло много времени, верующие #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_GEN')|L]#!#! продолжают вспоминать те времена, пока над ним господствует [ShowPolicyName('ibadi_kitman_imam_policy')|l]."
 mobilize_shurat_cb_tt: "Мы получим [Concept('casus_belli', 'повод для войны')|e] «[ShowCasusBelliName('cb_deus_vult')]» против выбранной [Concept('country', 'державы')|e]"
 imam_al_shari_weak_reasoning: "Поскольку у нас действует [ShowPolicyName('ibadi_maintain_the_status_of_imam_policy')|l], [ShowPolicyName('ibadi_shari_imam_policy')|l] предоставит нам только половину эффектов, зато нам не придётся отказываться от [Concept('policy', 'политики')|e] «[ShowLawName('ibadi_imamate_law')]»."
 ibadi_daif_imam_policy_should_be_removed_by: "Когда угроза минует, мы вернём власть сильного имама, и в этом нам поможет [ShowGenericActionName('return_to_zuhur_imamate')|l]"
 cleansing_ritual_purity: "Обряд очищения"
 cleansing_ritual_purity_desc: "Получите [Concept('purity', 'чистоту')|e], но это снизит наш [Concept('prestige', 'престиж')|e]."
 cleansing_ritual_yanantin: "Проведение обряда"
 cleansing_ritual_yanantin_desc: "Измените наш [Concept('yanantin', 'янантин')|e], пожертвовав [Concept('prestige', 'престиж')|e] и ресурсы одному из наших богов."
 pilgrimage_action: "Паломничество"
 pilgrimage_action_desc: "Посетите [Concept('holy_site', 'святыню')|e], чтобы укрепить связь с нашей верой."
 pilgrimage_select_holy_site_title: "Выберите [Concept('holy_site', 'святыню')|e], которую хотите посетить"
 PILGRIMAGE_HOLY_SITE_TRAVEL_MONTHS: "$MONTHS|0$ мес."
 PILGRIMAGE_HOLY_SITE_GOLD_COST: "$GOLD|0$@gold!"
 PILGRIMAGE_HOLY_SITE_INFLUENCE_GAIN: "+$INFLUENCE|0$@religious_influence!"
 HOLY_SITE_SORT_BY_TRAVEL_MONTHS: "Щёлкните для отбора по времени в пути"
 HOLY_SITE_SORT_BY_GOLD_COST: "Щёлкните для отбора по стоимости в дукатах"
 HOLY_SITE_SORT_BY_INFLUENCE_GAIN: "Щёлкните для отбора по приросту влияния"
 prepare_for_katun: "Подготовка к следующему катуну"
 prepare_for_katun_nothing: "Прекращение подготовки к следующему Катуну"
 prepare_for_katun_nothing_desc: "Прекратите дорогостоящую подготовку к [Concept('katun', 'катуну')|e]."
 prepare_for_katun_half: "Медленная подготовка к следующему Катуну"
 prepare_for_katun_half_desc: "Увеличьте наше [Concept('religious_influence', 'религиозное влияние')|e], подготовившись к [Concept('katun', 'катуну')|e] с минимумом усилий."
 prepare_for_katun_normal: "Подготовка к следующему катуну"
 prepare_for_katun_normal_desc: "Увеличьте наше [Concept('religious_influence', 'религиозное влияние')|e], подготовившись к следующему [Concept('katun', 'катуну')|e]."
 prepare_for_katun_double: "Усиленная подготовка к следующему Катуну"
 prepare_for_katun_double_desc: "Увеличьте наше [Concept('religious_influence', 'религиозное влияние')|e], подготовившись к [Concept('katun', 'катуну')|e] с удвоенной силой."
 change_main_school: "Изменение основной школы"
 change_main_school_desc: "Измените основную [Concept('religious_school', 'религиозную школу')|e] [Concept('country', 'державы')|e]."
 choose_religious_school: "Выбор [Concept('religious_school', 'религиозной школы')|e]"
 religious_offering: "Ритуальное подношение"
 religious_offering_desc: "Преподнесите в дар богам [Concept('work_of_art', 'творение')|e] и увеличьте [Concept('purity', 'чистоту')|e]."
 religious_offering_tt: "Выбранное [Concept('work_of_art', 'творение')|e] будет уничтожено."
 join_sect: "Выбор направления"
 join_sect_desc: "Присоединитесь к [Concept('sect', 'направлению')|e]."
 join_sect_choose_sect: "Выберите, к какому [Concept('sect', 'направлению')|e] присоединиться"
 join_sect_max_sects_tt: "Мы следуем меньшему числу [Concept('sect', 'направлений')|e], чем позволяет наша религия."
 disfavor_sect: "Порицание направления"
 disfavor_sect_desc: "Осудите [Concept('sect', 'направление')|e]. Мы помешаем ему распространяться по нашей территории, но получим больше штрафов, если принадлежим к нему."
 disfavor_sect_choose_sect: "Выберите, какое [Concept('sect', 'направление')|e] осудить"
 stop_disfavoring_sect: "Реабилитация направления"
 stop_disfavoring_sect_desc: "Прекратите осуждение [Concept('sect', 'направления')|e]. Мы прекратим мешать его распространению по нашей территории и больше не будем получать штрафы, если принадлежим к нему."
 stop_disfavoring_sect_choose_sect: "Выберите, какое [Concept('sect', 'направление')|e] реабилитировать"
 promote_sect: "Поддержка направления"
 promote_sect_desc: "Поддержите [Concept('sect', 'направление')|e]. Поддержав направление, мы поспособствуем его распространению по своей территории и получим больше бонусов, если принадлежим к нему. Впрочем, если мы принадлежим к нескольким направлениям, остальные могут не одобрить нашего решения."
 promote_sect_choose_sect: "Выберите, какое [Concept('sect', 'направление')|e] поддержать"
 stop_promoting_sect: "Прекращение поддержки направления"
 stop_promoting_sect_desc: "Прекратите поддержку [Concept('sect', 'направления')|e]. Мы прекратим поддерживать направление на своей территории и больше не будем получать бонусы, если принадлежим к нему."
 stop_promoting_sect_choose_sect: "Выберите, какое [Concept('sect', 'направление')|e] лишить поддержки"
 leave_sect: "Выход из направления"
 leave_sect_desc: "Покиньте [Concept('sect', 'направление')|e]."
 leave_sect_choose_sect: "Выберите, какое [Concept('sect', 'направление')|e] покинуть"
 perform_tantric_ritual: "Тантрический обряд"
 perform_tantric_ritual_desc: "Проведите религиозный тантрический обряд."
 organize_spiritual_retreat: "Духовное уединение"
 organize_spiritual_retreat_desc: "Отвлекитесь от мирских забот и ощутите гармонию со вселенной."
 commission_religious_images: "Религиозные символы"
 commission_religious_images_desc: "Прикажите создать религиозные творения и проявите благочестие."
 join_branch: "Новое ответвление"
 join_branch_desc: "Оставьте текущее [Concept('hindu_branch', 'ответвление индуизма')|e] и выберите новое."
 join_branch_choose_branch: "Выберите, к какому [Concept('hindu_branch', 'ответвлению индуизма')|e] присоединиться"
 activate_avatar: "Использование аватара"
 activate_avatar_desc: "Используйте [Concept('avatar', 'аватар')|e]. У нас должен быть доступ к одной из [Concept('holy_sites', 'святынь')|e] аватара: мы должны либо владеть ей самостоятельно, либо быть в союзе с [Concept('owner', 'владельцем')|e]."
 activate_avatar_choose_avatar: "Выберите, какой [Concept('avatar', 'аватар')|e] использовать"
 deactivate_avatar: "Прекращение использования аватара"
 deactivate_avatar_desc: "Прекратите использовать [Concept('avatar', 'аватар')|e]."
 deactivate_avatar_choose_avatar: "Выберите, какой [Concept('avatar', 'аватар')|e] больше не использовать"
 deactivate_avatar_no_avatars: "@trigger_no! Нет доступных [Concept('avatar', 'аватаров')|e]."
 reroll_avatar: "Смена аватара"
 reroll_avatar_desc: "Получите новый [Concept('avatar', 'аватар')|e]."
 perform_yoga: "Занятия йогой"
 perform_yoga_desc: "Погрузитесь в медитацию."
 indulge_in_feasts: "Пир на весь мир"
 indulge_in_feasts_desc: "Закатите пиры."
 discard_worldly_possessions: "Отказ от земных благ"
 discard_worldly_possessions_desc: "Откажитесь от земных благ."
 indulge_in_bloodbath: "Страшное кровопролитие"
 indulge_in_bloodbath_desc: "Насладитесь убийством врагов."
 favor_god: "Любимое божество"
 favor_god_desc: "Поклонение одному божеству может разгневать других [Concept('gods', 'богов')|e]."
 favor_god_why: "Не всем [Concept('gods', 'божествам')|e] поклоняется одинаково"
 favor_god_choose_god: "Выберите любимое [Concept('god', 'божество')|e]"
