 #Aspiration for Liberty
 this_will_end_the_disaster_tt: "Это завершит [Concept('disaster', 'бедствие')|e] «[ShowDisasterName('aspiration_for_liberty')]»\n"
 #Columbian Exchange
 move_nw_good_to_new_location: "Распространение товара из Нового Света"
 move_nw_good_to_new_location_desc: "Мы можем распространить один товар, происходящий из #TOOLTIP:CONTINENT,america,X #L Америки#!#!, в любом из своих [Concept('locations', 'районов')|e] к неудовольствию местных жителей. Нам также придётся заново развивать [Concept('rgo', 'добычу ресурсов')|e] в районе."
 move_nw_good_to_new_location_no_available_good: "@trigger_no! У вас нет ни одного [Concept('location', 'района')|e], тяготеющего к рынку, где продаётся или производится этот [Concept('good', 'товар')]"
 move_nw_good_to_new_location_no_available_location: "@trigger_no! У вас нет ни одного [Concept('location', 'района')|e], где можно наладить [Concept('rgo', 'добычу')|e] [Concept('good', 'ресурса')] из Нового Света"
 move_ow_good_to_new_location_no_available_location: "@trigger_no! У вас нет ни одного [Concept('location', 'района')|e], где можно наладить [Concept('rgo', 'добычу')|e] [Concept('good', 'ресурсов')] из Старого Света."
 move_ow_good_to_new_location_no_available_good: "$move_nw_good_to_new_location_no_available_good$"
 move_ow_good_to_new_location: "Распространение товара из Старого Света"
 move_ow_good_to_new_location_desc: "Мы можем распространить один из наших традиционных товаров в своих [Concept('locations', 'районах')|e] #TOOLTIP:CONTINENT,america,X #L Америки#!#! к неудовольствию местного населения. Нам также придётся заново развивать [Concept('rgo', 'добычу ресурсов')|e] в районе."
 learn_from_foreigners: "Уроки иноземцев"
 learn_from_foreigners_desc: "Мы можем многому научиться у этих странных чужеземцев. Торговля и добрые отношения пойдут на пользу нашему народу."
 absorb_institutions: "Перенимание институтов"
 absorb_institutions_desc: "Странный образ жизни этих чужеземцев сбивает с толку и пугает нас, но мы можем многому у них научиться и адаптировать эти знания под наше общество."
 choose_institution: "Выберите [Concept('institution', 'институт')|e]"
 no_valid_institution: "@trigger_no! Нет подходящих [Concept('institution', 'институтов')|e]."
 #Lordship of ireland
 lordship_of_ireland_casus_belli: "Получение повода для войны"
 lordship_of_ireland_casus_belli_desc: "Получите [Concept('casus_belli', 'повод для войны')|e] «[ShowCasusBelliName('cb_subjugation')]» с державами, не входящими в состав #TOOLTIP:INTERNATIONAL_ORGANIZATION,$lordship_of_ireland_tt$,X #L манора Ирландия#!#!."
 lordship_of_ireland_casus_belli_none_tt: "Выберите, на какую [Concept('country', 'державу')|e] напасть!"
 lordship_of_ireland_invite_planters: "Просьба о фермерах"
 lordship_of_ireland_invite_planters_desc: "Отправьте поселенцев из родной державы для прироста верующего населения."
 lordship_of_ireland_invite_planters_effect_none_tt: "В течение следующих 10 лет примерно 2400 [Concept('pops', 'групп населения')|e], исповедующих нашу [Concept('religion', 'религию')|e], переместятся из [Concept('area', 'области')|e] в #TOOLTIP:REGION,great_britain_region,X #L Британии#!#! в #TOOLTIP:REGION,ireland_region,X #L ирландскую#!#! [Concept('province_definition', 'провинцию')|e]"
 lordship_of_ireland_invite_planters_effect_tt: "В течение следующих 10 лет примерно 2400 [Concept('pops', 'групп населения')|e] переместятся из области [origin_area.GetName] в провинцию [target_province.GetName]."
 lordship_of_ireland_form_kingdom: "Основание королевства"
 lordship_of_ireland_form_kingdom_desc: "Наконец мы получили титул короля Ирландии, который укрепит нашу власть и придаст нам легитимность в глазах народа."
 lordship_of_ireland_form_kingdom_region_tt: "Каждым [Concept('location', 'районом')|e] в #TOOLTIP:REGION,ireland_region,X #L ирландском#!#! [Concept('region', 'регионе')|e] должен [Concept('owned', 'владеть')|e] [Concept('member', 'участник')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$lordship_of_ireland_tt$,X #L манора Ирландия#!#!."
 IRE_f_lordship_tt: "Только [Concept('international_organization_leader_short', 'лидер')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$lordship_of_ireland_tt$,X #L манора Ирландия#!#! может выполнить действие «[ShowGenericActionName('lordship_of_ireland_form_kingdom')]». Обычным [Concept('member', 'участникам')|e] оно недоступно."
 neither_highkingship_nor_lordship_exist_tt: "[GetUniqueInternationalOrganization('lordship_of_ireland').GetName] и [GetUniqueInternationalOrganization('high_kingship').GetName] не существуют."
 IRE_f_sole_high_kingship_tt: "Мы — последний оставшийся участник Верховного Королевства Ирландия."
 IRE_high_kingship_f_leader_tt: "Мы должны стоять [Concept('international_organization_leader_short', 'во главе')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,high_kingship,X #L Верховного королевства#!#! #TOOLTIP:REGION,ireland_region,X #L Ирландии#!#!"
 IRE_lordship_of_ireland_f_leader_tt: "Мы должны обладать статусом #TOOLTIP:SPECIAL_STATUS,lord_of_ireland,X #L лорда#!#! #TOOLTIP:INTERNATIONAL_ORGANIZATION,$lordship_of_ireland_tt$,X #L манора Ирландия#!#!"
 #Treaty of Tordesillas
 violate_treaty_of_tordesillas: "Нарушить $treaty_of_tordesillas$"
 violate_treaty_of_tordesillas_desc: "$treaty_of_tordesillas$ — не более чем бессмысленная бумажка для тех, кто рискует жизнями в попытках создать для себя лучшее будущее на негостеприимных и опасных новых землях.\n\nМы проигнорируем эти правила и позволим своего народу взять то, что по праву ему принадлежит."
 stop_violate_treaty_of_tordesillas: "Прекратить нарушать договор [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]"
 stop_violate_treaty_of_tordesillas_desc: "В интересах дипломатических отношений нашей державы мы подчинимся и перестанем нарушать условия Договора [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]."
 tordesillas_claim_conflicting_area_price: "Претензия на спорную область"
 tordesillas_claim_area_price: "Претензия на область"
 tordesillas_claim_area: "Претензия на область"
 tordesillas_claim_area_desc: "Расширьте наши колониальные притязания на соседнюю [Concept('area', 'область')|e]."
 tordesillas_free_claim_area: "Претензия на незанятую область"
 tordesillas_free_claim_area_desc: "Создайте колониальные претензии на любую [Concept('area', 'область')|e] в пределах нашей колонизационной дистанции."
 tordesillas_claim_conflicting_area: "Претензия на спорную область"
 tordesillas_claim_conflicting_area_desc: "Мы воспользуемся своим влиянием на [GetCountry('PAP').Custom('longname_ru_GEN')], чтобы создать колониальную претензию на [Concept('area', 'область')|e], в которой и мы, и наш соперник владеем землями."
 tordesillas_push_to_settle_treaty: "Требование заключить договор"
 tordesillas_push_to_settle_treaty_desc: "Воспользуйтесь нашим влиянием на [GetCountry('PAP').Custom('longname_ru_ACC')], чтобы ускорить принятие Договора [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip] в его нынешнем виде."
 tordesillas_push_to_settle_treaty.tt: "Прогресс принятия увеличится на #G 10#!"
 tordesillas_upheld_treaty_relevance: "Сохранение значимости договора"
 tordesillas_upheld_treaty_relevance_desc: "Защитите важность и справедливость Договора [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip]."
 tordesillas_upheld_treaty_relevance.tt: "Значимость договора увеличится на #G 10#!"
 tordesillas_demand_transfer_colony: "Требование передать оспариваемую провинцию"
 tordesillas_demand_transfer_colony_desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle] дарует нам и только нам право колонизировать эти земли и править ими, ибо так хочет [GetCountry('PAP').GetReligion.GetGodName]. Те, кто нарушает этот божественный мандат, должны смиренно уступить свои земли нам или столкнуться с последствиями."
 tordesillas_demand_transfer_colony.tt: "В случае отказа мы получим [Concept('casus_belli', 'повод для войны')|e], что позволит нам захватить земли силой"
 tordesillas_revoke_claim: "Отказ от претензии"
 tordesillas_revoke_claim_desc: "Переговоры — это всегда обоюдный процесс, складывающийся из успехов и уступок. Мы порой вынуждены позволять своим соперникам получать желаемое, а затем благодаря искусству дипломатии выцарапывать эти уступки обратно.\n\nВоспользовавшись своим влиянием, мы сможем добиться того, что [GetCountry('PAP').GetLongName] отзов[GetCountry('PAP').Custom('endlong_etut')] одну из претензий наших визави, и переговоры вернутся к моменту, когда мы занимали ведущую роль."
 tordesillas_move_the_line: "Пересмотр границы"
 tordesillas_move_the_line_desc: "Границы, определённые действующим Договором [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip], не так выгодны, как нам бы хотелось. Мы должны сместить разделяющую мир границу с выгодой для нас и показать миру, что с нами шутки плохи."
 tordesillas_move_the_line.tt: "Воображаемая линия, разделяющая мир между подписавшими договор, переместится в другой [Concept('location', 'район')|e]"
 tordesillas_move_the_line.tt2: "Прогресс принятия сократится на #R 5#!"
 tordesillas_swap_sides: "Обмен сторонами"
 tordesillas_swap_sides_desc: "Во время переговоров мы осознали, что нашим соперникам досталась куда лучшая часть мира, чем нам. Мы задействуем свою репутацию и престиж в попытке убедить их, что обмен претензиями им же и выгоден."
 tordesillas_swap_claim: "Обмен претензиями"
 tordesillas_swap_claim_desc: "С подписанием Договора [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.Custom('LR_GEN')|l] [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('treaty_location').GetLocation.GetNameWithNoTooltip] мир оказался разделён между двумя главными колониальными державами, но мы всё равно недовольны результатом. Можно внести туда правки, которые позволят нам улучшить своё положение. Мы могли бы убедить одну из этих держав обменять одну из наших претензий в области на их претензии на соседнюю область."
 #Catholic Church
 POLICY_BIAS_REFORM_DESIRE: "Стремление к реформации"
 #Coup Attempt
 conduct_investigation: "Проведение расследования"
 conduct_investigation_desc: "Внимательное наблюдение за чиновниками и придворными поможет выявить предателей, плетущих интриги против короны!"
 rally_the_citizenry: "Объединение граждан"
 rally_the_citizenry_desc: "Соберите народ на площадях, чтобы подтвердить республиканский порядок и ослабить контроль фракции над властью."
 purge_the_oligarchs: "Зачистка олигархов"
 purge_the_oligarchs_desc: "Атакуйте непосредственно лидеров фракции и уничтожьте их власть над институтами ценой дополнительных беспорядков."
 oligarchic_faction_active_tt: "Олигархическая фракция активна"
 identify_the_ringleader: "Поиски главаря"
 identify_the_ringleader_desc: "Отправьте наших агентов изучить требования фракции и вычислите того, кто дёргает за ниточки."
 confront_the_ringleader: "Противостояние с главарём"
 confront_the_ringleader_desc: "Теперь мы знаем, кто возглавляет фракцию, и можем действовать. Успех зависит от того, насколько успешно мы восстановили авторитет короны. Поспешные действия могут привести к укреплению фракции."
 negotiate_estate_concessions: "Переговоры с сословием об уступках"
 negotiate_estate_concessions_desc: "Купите расположение сословия во фракции с помощью золота и мелких уступок, смягчая отношения без борьбы."
 oligarchic_ringleader_active_tt: "Мы ещё не разобрались с главарём олигархической фракции"
 oligarchic_ringleader_not_yet_identified_tt: "Мы ещё не вычислили главаря"
 oligarchic_ringleader_identified_tt: "Главарь вычислен"
 preach_renewal: "Проповедь обновления"
 preach_renewal_desc: "Отправьте верных священников по всей державе, чтобы возродить веру и отвадить верующих от раскольников."
 convene_a_synod: "Проведение синода"
 convene_a_synod_desc: "Соберите священников, чтобы определить доктрины, изолировать раскольников и укрепить церковь."
 schismatic_clergy_active_tt: "Фракция священников-раскольников активна"
 any_conspirators_are_active_tt: "Хотя бы 1 [Concept('character', 'персонаж')|e] участвует в заговоре"
 is_a_conspirator: "@trigger_no! В заговоре по свержению власти не осталось участников."
 execute_court_member: "Казнь придворного"
 execute_court_member_desc: "Пришло время действовать! Скоро полетят головы возможных заговорщиков! Мы должны казнить тех, кто желает нашей смерти, чтобы не стать жертвами их амбиций."
 call_private_council: "Созыв тайного совета"
 call_private_council_desc: "Влиятельные люди, знающие двор как свои пять пальцев и всегда готовые разоблачить своих коллег-заговорщиков ради золота или привилегий."
 #Western Schism
 schism_show_support_for_one_pope: "Выражение преданности"
 schism_show_support_for_one_pope_desc: "Объявить, что [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] может рассчитывать на нашу поддержку."
 schism_show_unity_of_faith: "Демонстрация единства веры"
 schism_show_unity_of_faith_desc: "Покажем, что наши люди исповедуют одну религию."
 schism_demand_support_from_one_pope: "Требование поддержки от кандидата"
 schism_demand_support_from_one_pope_desc: "Верующие получат свою награду. Нужно лишь попросить о ней."
 #Tatar Yoke
 choose_the_tatar_country: "Выбрать татарского сюзерена"
 choose_the_tatar_country_no_countries: "Нет подходящих держав"
 break_the_yoke: "Освобождение от татарского ига"
 break_the_yoke_desc: "[ShowSpecialStatusName('tatar_overlord')] больше не будет нас угнетать! Пришло время сбросить оковы с #TOOLTIP:CULTUREGROUP,russian_group,X #L русского#!#! народа."
 break_tatar_yoke_tt: "Мы объявим #ONCLICK:COUNTRY,[GetInternationalOrganization('tatar_yoke').GetLeaderCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetInternationalOrganization('tatar_yoke').GetLeaderCountry.Custom('CL_tt')],X [GetInternationalOrganization('tatar_yoke').GetLeaderCountry.Custom('CL_DAT')|L]#!#! [Concept('war', 'войну')|e], поводом для которой будет [ShowCasusBelliName('cb_break_free_tatar_yoke')|l]. Как только мы навяжем врагу свои условия — [ShowPeaceTreatyTypeName('break_from_tatar_yoke')|l], — наша держава станет свободной от #TOOLTIP:INTERNATIONAL_ORGANIZATION,$tatar_yoke_tt$,X #L татарского ига#!#!."
 ask_to_become_tax_collector: "Запрос возвышения"
 ask_to_become_tax_collector_desc: "Текущий #TOOLTIP:SPECIAL_STATUS,tatar_tax_collector,X #L великий князь владимирский#!#! больше не годится для сбора дани с нашего народа. Мы куда лучше подходим на эту роль, что позволит нам стать лидером #TOOLTIP:CULTUREGROUP,russian_group,X #L русского#!#! народа."
 ask_to_become_tax_collector_tt: "Мы попросим #ONCLICK:COUNTRY,[GetCountry('GLH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GLH').Custom('CL_tt')],X [GetCountry('GLH').Custom('CL_ACC')|L]#!#! передать нам титул #TOOLTIP:SPECIAL_STATUS,tatar_tax_collector,X #L великого князя владимирского#!#!."
 reclaim_high_kingship_land: "$cb_high_kingship_reclamation$"
