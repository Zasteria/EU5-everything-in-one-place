 rot_reform_into_monarchy_desc: "Ваш выбор — [ShowGovernmentTypeName('monarchy')|l]. Перейдите к новой форме правления и начните свой путь к могуществу!"
 rot_promote_regional_culture: "Продвижение региональной культуры"
