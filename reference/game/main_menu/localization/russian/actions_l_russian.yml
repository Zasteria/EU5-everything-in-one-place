 #Reformation
 spread_reformation_through_trade: "Распространение реформации через торговлю"
 spread_reformation_through_trade_desc: "Наши купцы путешествуют по торговым путям Северной Европы и всё чаще сталкиваются с новыми идеями протестантизма. Мы можем подтолкнуть наши торговые посты к принятию реформистской веры."
 spread_reformation_through_trade_tt: "[Concept('pops', 'Группы населения')|e], которые связаны с нашими [Concept('hanseatic_kontor', 'ганзейскими конторами')|e] и продолжают исповедовать [Concept('catholic', 'католичество')|e], обратятся в выбранную [Concept('religion', 'религию')|e]."
 embrace_the_reformation: "На стороне реформации"
 embrace_the_reformation_desc: "В нашей державе распространилась реформация! Мы могли бы принять перемены и стать оплотом новой веры."
 embrace_the_reformation_tt: "Наша [Concept('country', 'держава')|e] обратится в выбранную [Concept('religion', 'религию')|e], в том числе наши [Concept('ruler', 'правитель')|e], [Concept('consort', 'консорт')|e], [Concept('heir', 'наследник')|e] и [Concept('children', 'дети')|e] нашего [Concept('ruler', 'правителя')|e]."
 sponsor_the_reformation: "Поддержка Реформации"
 sponsor_the_reformation_desc: "Идеи Реформации довольно заманчивы и могут пойти на пользу нашей державе! Если мы наладим контакт с проповедниками этих идей, то сможем ускорить их распространение в наших землях."
 sponsor_the_reformation_tt: "Мы пригласим выбранное [Concept('movement', 'движение')|e] в нашу [Concept('country', 'державу')|e], один из членов совета станет популяризатором этого [Concept('movement', 'движения')]."
 sponsor_the_reformation_no_movements: "@trigger_no! Нет доступных [Concept('movement', 'движений')|e]."
 dissolve_monasteries: "Роспуск монастырей"
 dissolve_monasteries_desc: "Католицизм — это устаревшее и еретическое направление христианства. Мы должны распустить как можно больше нонконформистких монастырей и лишить богоотступников всех земель и ценностей."
 militarise_religious_icons: "Божественная защита"
 militarise_religious_icons_desc: "Религия важна для всех: и для мирных граждан, и для солдат. Вы можете повысить боевой дух армии, если разрешите нашим воинам использовать церковные иконы во время военных кампаний."
 reformation_diplomacy: "Братство реформаторов"
 reformation_diplomacy_desc: "Англиканство — особое направление реформаторской церкви, однако другие реформаторы остаются нашими братьями и сёстрами во Христе. Мы должны наладить связи с народами, исповедующими нашу религию."
 reformation_diplomacy_tt: "Наши отношения со всеми [Concept('countries', 'державами')|e], поддержавшими Реформацию, улучшатся."
 deport_heretics: "Выдворение еретиков"
 deport_heretics_desc: "Еретики представляют большую опасность для нашей религии и культуры. Мы должны выдворить их из страны и сослать в Новый Свет."
 deport_heretics_tt: "Мы депортируем часть нашего еретического населения в одно из колониальных поселений."
 encourage_innovativeness: "Поощрение новшеств"
 encourage_innovativeness_desc: "Старые церковные догмы — не что иное, как религиозные предрассудки. Мы должны поощрять новаторство среди священников и прихожан."
 progress_of_the_supreme_governor: "Успехи верховного губернатора"
 progress_of_the_supreme_governor_desc: "Шествие верховного губернатора и одновременно главы государства по всей стране увеличивает его популярность среди населения и укрепляет патриотизм граждан."
 NO_POLICY: "Никакой политики"
 divorce_ruler: "Разрешение на развод"
 divorce_ruler_desc: "Роль нашей канцелярии определяется её полномочиями. Например, она могла бы рассматривать прошения о законном расторжении брака, что создало бы благоприятные условия для дипломатических манёвров и позволило бы нам устанавливать выгодные династические связи."
 choose_consort_to_divorce_from: "Выберите, с каким [Concept('consort', 'консортом')|e] развестись"
 summon_mystic: "Помощь мистика"
 summon_mystic_desc: "Среди наших монахов есть люди, которые изо всех сил стараются стать ближе к Богу. Этих мужчин и женщин называют мистиками. Они обладают великой мудростью и могут помочь нам в государственных делах. В случае необходимости не стесняйтесь обратиться к ним за советом."
 bosnian_church_diplomacy: "Отправка посольства в Рим"
 bosnian_church_diplomacy_desc: "Из-за нашей религиозной изоляции многие соседи не считают нас подлинными католиками и даже обвиняют в ереси. Посланникам нашей церкви следует отправиться в Рим и принести клятву верности папе, чтобы положить конец этим опасным слухам."
 bosnian_church_diplomacy_tt: "Наши отношения со всеми державами, поддержавшими #TOOLTIP:LOCATION,rome,X #L Рим#!#!, улучшатся."
 improve_opinion_with_all_catholics_tt: "Мы улучшим [Concept('opinion', 'мнение')|e] всех #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! [Concept('country', 'держав')|e] о нас на #G 50#!"
 expose_the_enemies_of_the_faith: "Изобличение врагов веры"
 expose_the_enemies_of_the_faith_desc: "Соседи считают нашу державу рассадником ереси, а крестоносцы — врагом. Наша церковь вынужденно отказалась от традиционных обрядов, но не потеряла бдительность: выведя на чистую воду посланников враждебных нам церквей и дворов, мы сбережём свою веру и лишим недоброжелателей возможности угрожать нам."
 expose_the_enemies_of_the_faith_tt: "Размер каждой враждебной [Concept('spy_network', 'шпионской сети')|e] в [Concept('country', 'державе')|e] уменьшается на #G 10#!"
 affirm_the_confession_of_biljno_polje: "Подтверждение приверженности Билинопольскому отречению"
 affirm_the_confession_of_biljno_polje_desc: "В 1203 году представители нашей церкви, собравшиеся в Билино Поле, письменно поклялись отречься от ереси и раскольничества, признав верховенство Рима. Настало время вновь подтвердить это отречение — пусть даже народ и дальше будет придерживаться своих обрядов и обычаев."
 support_the_krstjani_monasteries: "Поддержание крстянских монастырей"
 support_the_krstjani_monasteries_desc: "Крстянские монастыри — оплот нашей веры и фундамент, без которого невообразимо существование нашего народа. Поддержка монастырей — это гарантия религиозной стабильности и преданности местного населения."
 support_the_krstjani_monasteries_tt: "Провинция [target_province.GetName] получает [ShowNamedValue('prosperity_mild_bonus')|+=2%] к [Concept('prosperity', 'процветанию')|e], а все [Concept('pops', 'группы населения')|e] в провинции [target_province.GetName], исповедующие #TOOLTIP:RELIGION,$bosnian_church_tt$,X #L крстянскую#!#! веру, получают [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 reaffirm_ecclesiastical_decentralization: "Подтверждение приверженности децентрализации церкви"
 reaffirm_ecclesiastical_decentralization_desc: "Наша церковь до сих пор существует благодаря отсутствию жёсткого чиноначалия, деления на епархии или централизованной бюрократии. Мы продолжим и дальше придерживаться этого принципа: церковь должна быть не руководителем, но нравственным наставником."
 summon_the_strojnici_council: "Созыв совета стройников"
 summon_the_strojnici_council_desc: "Настало время созвать старших представителей церкви, чтобы разрешить все внутренние споры и достичь единства в вопросах веры посредством общего согласия, а не принуждения."
