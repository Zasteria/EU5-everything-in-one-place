 rot_select_core_region_tt_generic: "Каждый [Concept('location', 'район')|e] в этом регионе станет [Concept('core', 'национальным')|e] и получит модификатор #TOOLTIP:STATIC_MODIFIER,rot_timurs_core_region,X #V #L «Национальный регион»#!#! на всё время действия модификатора #TOOLTIP:STATIC_MODIFIER,timmy_wants_to_play,X #V #L «Погибель из Центральной Азии»#!#!. Завоёванные районы этого региона автоматически станут национальными, если ещё ими не являются."
 rot_has_selected_core_region_tt: "Мы выбрали #Y национальный регион#!, использовав «[ShowGenericActionName('rot_select_core_region')]»"
