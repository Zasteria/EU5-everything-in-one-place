 rot_plan_invasion_tt: "Мы получаем [Concept('casus_belli', 'повод')|e] #TOOLTIP:CASUS_BELLI,cb_timurs_conquests,X #L «Завоевание Тимура»#!#! для войны с выбранной [Concept('country', 'державой')|e]"
 rot_plan_invasion_at: "Если выбранная держава находится в одном регионе с нашей [Concept('capital', 'столицей')|e], то вместо этого мы объявим ей [Concept('war', 'войну')|e] с поводом #TOOLTIP:CASUS_BELLI,cb_timurs_conquests,X #L «Завоевание Тимура»#!#!"
 rot_plan_invasion_bt: "Если выбранная держава находится в регионе, который является нашей #Y целью завоевания#! или местом расположения нашей [Concept('capital', 'столицы')|e] ([recipient.MakeScope.GetVariable('rot_conquest_ambition').GetRegion.GetName]), то вместо этого мы объявим ей [Concept('war', 'войну')|e] с поводом #TOOLTIP:CASUS_BELLI,cb_timurs_conquests,X #L «Завоевание Тимура»#!#!"
 rot_select_core_region: "Выбор национального региона"
