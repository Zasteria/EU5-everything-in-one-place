 steppe_horde_to_monarchy: "Переход к монархии"
 steppe_horde_to_monarchy_desc: "Держава не может решать стоящие перед ней проблемы, когда само её существование под угрозой. На наших землях то и дело вспыхивают гражданские войны: вместо того чтобы подчиняться единому твёрдому авторитету, воители дерутся за власть.\n\nКочевые времена подходят к концу. Наступает эра новой монархии!"
 steppe_horde_to_monarchy_tt: "Мы перейдём к #TOOLTIP:GOVTYPE,monarchy,X #L монархии#!#! и станем [Concept('settled', 'оседлой')|e] державой\n#Y  Этот процесс займёт 15 лет#!"
