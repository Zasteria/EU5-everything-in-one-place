 rot_promote_regional_culture_tt_generic: "Кроме того, [Concept('language', 'язык')|e] этой культуры станет новым [Concept('court_language', 'придворным языком')|e], и мы сможем выбрать #Y 2#! дополнительные культуры, которые бесплатно можно повысить до статуса [Concept('accepted_cultures', 'признанных')|e]."
 rot_promote_regional_culture_tt: "Выбранная [Concept('culture', 'культура')|e] станет новой [Concept('primary_culture', 'основной культурой')|e] нашей державы. $rot_promote_regional_culture_tt_generic$"
