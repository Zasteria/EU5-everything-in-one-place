 guelphs_support_imperial_rivals_bt: "Каждый участник #TOOLTIP:INTERNATIONAL_ORGANIZATION,$guelphs_io_tt$,X #L гвельфов#!#! и выбранный [Concept('rival', 'соперник')|e], с которым будет враждовать [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l], повысят своё [Concept('opinion', 'мнение')|e] друг о друге на [ShowBiasValue('opinion_guelphs_support_imperial_rivals')|+=0]"
 guelphs_support_imperial_rivals_tt: "Выбранная держава, с которой будет враждовать [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l], получит модификатор «[ShowModifier('guelphs_support_imperial_rivals_modifier')]»"
