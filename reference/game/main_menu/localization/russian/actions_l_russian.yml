 sengoku_offer_hostage: "Предложение заложника"
 sengoku_offer_hostage_desc: "Мы сможем укрепить узы с другими кланами, если отправим к ним членов семьи в качестве заложников."
 sengoku_ask_for_hostage: "Просьба о заложнике"
 sengoku_ask_for_hostage_desc: "Мы можем попросить клан отправить к нам одного из членов семьи в качестве заложника, чтобы укрепить узы с ним."
 sengoku_prove_heritage: "Доказательство наследия"
 sengoku_prove_heritage_desc: "Корни нашей семьи, как и любой другой, уходят в глубокое прошлое. Мы можем попытаться «отыскать» в наших архивах определённые документы, которые продемонстрируют древность нашего рода и его тесную связь с ключевыми семьями и кланами."
 grant_shugo_office: "Предоставление должности сюго"
 grant_shugo_office_desc: "Японскими провинциями порой сложно управлять, поэтому сёгун назначает провинциальных губернаторов, чтобы распространить свою власть на все земли."
 grant_shugo_office_effect_tt: "Мы сделаем персонажа губернатором провинции, даровав ему #TOOLTIP:BUILDING_TYPE,kokufu,X #L кокуфу#!#! в [Concept('location', 'районе')|e] и титул #TOOLTIP:SPECIAL_STATUS,shugo_daimyo,X #L даймё-сюго#!#!, если он ещё им не обладает"
 already_shugo_daimyo_tt: "Персонаж уже #TOOLTIP:SPECIAL_STATUS,shugo_daimyo,X #L даймё-сюго#!#!"
 shugo_province_default: "[ROOT.GetLocation.GetProvince.GetName]"
 shugo_province_location: "[ROOT.GetLocation.GetName]:"
 shugo_province_mutsu: "#BOLD Муцу#!"
 shugo_province_dewa: "#BOLD Дева#!"
 shugo_province_wakasa: "#BOLD Вакаса#!"
 shugo_province_iki: "#BOLD Ики#!"
 revoke_shugo_office: "Отзыв должности сюго"
 revoke_shugo_office_desc: "Титул сюго позволяет семье обрести немалую власть и влияние в пределах провинции, но его всегда можно отнять, если сюго слишком зазнается."
 revoke_shugo_office_effect_tt: "Мы отнимем должность губернатора провинции, закрыв #TOOLTIP:BUILDING_TYPE,kokufu,X #L кокуфу#!#!, что даст [ShowBiasValue('opinion_revoked_shugo_office')|+=0] к [Concept('opinion', 'мнению')|e] о нас и [Concept('casus_belli', 'повод для войны')|e] #TOOLTIP:CASUS_BELLI,cb_japanese_clan_rebel_against_shogunate_authority,X #L «Мятеж против власти сёгуна»#!#!, после чего персонаж перестанет быть #TOOLTIP:SPECIAL_STATUS,shugo_daimyo,X #L даймё-сюго#!#!, если это его единственная должность сюго"
 still_shugo_daimyo_tt: "Персонаж останется #TOOLTIP:SPECIAL_STATUS,shugo_daimyo,X #L даймё-сюго#!#! других провинций"
 claim_shugo_office: "Претензия на должность сюго"
 claim_shugo_office_desc: "Должность сюго обладает властью и престижем. Любой клан, обладающий достаточным влиянием в провинции, может счесть, что он заслуживает этого титула, даже если это противоречит воле сёгуна."
 claim_shugo_office_effect_tt: "Мы станем губернаторами провинции, учредив #TOOLTIP:BUILDING_TYPE,kokufu,X #L кокуфу#!#!"
 seek_alliance_with_overlord_rival: "Поиск поддержки соперника сюзерена"
 seek_alliance_with_overlord_rival_desc: "Для борьбы с тиранией наших сюзеренов нам потребуется вся доступная поддержка. К счастью, есть те, кто постоянно размышляет, как бы покончить с нашим невыносимым сюзереном. Нужно наладить с ними хорошие отношения и договориться о совместных действиях."
 overlord_rival_is_available.tt: "Соперники нашего сюзерена ещё не поддерживают колониального [Concept('subject', 'ленника')|e]"
 declare_independence_war: "Объявление войны за независимость"
 declare_independence_war_desc: "Пришло время сбросить оковы угнетения и объявить о независимости от нашего сюзерена!"
 create_colonial_federation: "Создание колониальной федерации"
 create_colonial_federation_desc: "Создание местной администрации, которая будет управлять землями в колониях, поможет нам добиться большей автономии."
 cf_create_colonial_federation_tt: "Мы создадим и возглавим новую колониальную федерацию."
 join_colonial_federation: "Вступление в колониальную федерацию"
 join_colonial_federation_desc: "Если мы присоединимся к нашим угнетённым братьям, у нас будет больше шансов освободиться от власти ненавистного сюзерена."
 join_colonial_federation_choose_cf: "Выбрать колониальную федерацию"
 join_colonial_federation_no_ios: "$no_valid_international_organizations$"
 give_colony_representation: "Представительство для колониального ленника"
 give_colony_representation_desc: "Пришло время даровать нашим колониальным ленникам представительство в их собственной администрации."
 give_colony_rebellion_support: "Поддержка колониального мятежа"
 give_colony_rebellion_support_desc: "Окажите поддержку одному из колониальных ленников другой державы, чтобы подтолкнуть его к мятежу."
 establish_goods_act: "Введение закона о товарах"
 establish_goods_act_desc: "Благодаря введению нового закона на товары или торговлю мы сможем получать больше денег от наших колоний."
 establish_goods_act_tt: "Мы реквизируем у одной из наших колониальных держав её доход за 6 месяцев, повысив её [Concept('liberty_desire', 'желание свободы')|e]"
 recently_established_goods_act: "Введён закон о товарах"
 aid_colonial_war: "Помощь в колониальной войне"
 aid_colonial_war_desc: "Помощь в колониальной войне поможет колониальной державе объединить земли и подчеркнёт наше хорошее отношение к ней."
 aid_colonial_war_tt: "Мы поможем колониальному [Concept('subject', 'леннику')|e], отправив четверть нашего годового прироста [Concept('manpower', 'числа рекрутов')|e], и снизим её [Concept('liberty_desire', 'желание свободы')|e]"
 recently_aid_colonial_war: "Оказана помощь в колониальной войне"
 claim_ilkhanate: "Притязания на $ilkhanate$"
 claim_ilkhanate_desc: "Поскольку $genghis_khan_name$ был нашим прямым предком, власть в Государстве Хулагуидов должна принадлежать нам."
 we_were_not_forced_to_renounce_ilkhan_claim_tt: "Нас не вынуждали отказаться от притязаний на государство Хулагуидов"
 prepare_military_escalation: "Подготовка к военной эскалации"
 prepare_military_escalation_desc: "Соберите солдат, чтобы [SCOPE.sCountry('actor').Custom('GetReligiousLeagueName')] могла начать войну, противником в которой выступает другая [SCOPE.sCountry('actor').Custom('GetEnemyReligiousLeagueName')]."
 prepare_military_escalation_tt: "У #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#! появляется [Concept('casus_belli', 'повод')|e] «[ShowCasusBelliName('cb_religious_superiority')]» для войны против лидера объединения «[SCOPE.sCountry('actor').Custom('GetEnemyReligiousLeagueName')]»"
 demand_member_removal: "Переговоры об исключении участника"
 demand_member_removal_desc: "Мы проведём переговоры о выходе проблемного участника объединения «[SCOPE.sCountry('actor').Custom('GetEnemyReligiousLeagueName')]»."
 choose_religious_league: "Выбрать #Y Религиозную лигу#!"
