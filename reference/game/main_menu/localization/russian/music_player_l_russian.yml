 Dan_Cecil_Hill: "Дэн Сесил Хилл (флейты)"
 Dan_Cecil_Hill_facts: "Дэн Сесил Хилл (народ кайюга, клан цапли) — художник и музыкант хауденосауни (ирокезов), специализирующийся на традиционном индейском серебряном деле и изготовлении флейт. Будучи большую часть жизни художником, исполнителем и деятелем культуры, он посвятил себя сохранению и передаче всех аспектов истории своего народа, начиная с доколониальных времён США и ранее."
 Dietrich_Buxtehude: "Дитрих Букстехуде (1637-1707)"
 Dietrich_Buxtehude_facts: "Родился как Дитрих Хансен Букстехуде в Хельсингборге, в провинции Сконе, в 1637 году. Букстехуде считается одним из важнейших композиторов XVII века и оказал большое влияние на позднейших композиторов, таких как Бах и Гендель."
