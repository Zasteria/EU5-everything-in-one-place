 MusicPlayer_sol_chinese_Ambush_Act_6_and_7_The_Minor_Battle_at_Jiming_Mountain_and_Jiuli_Mountain: "Китай — «Засада с десяти сторон» — Действие 6 и 7 — «Малая битва у горы Цзимин»/«Гора Цзюли»"
 MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu: "Китай — «Засада с десяти сторон» — Действие 7 и 8 — «Гора Цзюли»/«Разгром Сян Юя»"
 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "Китай — «Засада со всех сторон» — полная версия"
 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Шедевр китайской классической музыки, исполняемый обычно виртуозами. Написан в воинственном стиле и изображает битву при Гайся в 202 году до н. э., в которой полководец Сян Юй потерпел поражение от Лю Бана."
