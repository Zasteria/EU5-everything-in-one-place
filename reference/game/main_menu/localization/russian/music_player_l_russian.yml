 #### CONTRIBUTING COMPOSERS, PERFORMERS AND SOLOISTS ####
 Mattias_Henndlund: "Маттиас Хенндлунд"
 Hakan_Glante: "Хокан Гленте (Håkan Glänte)"
 Hakan_Glante_and_Bach: "Хокан Гленте, И. С. Бах"
 Norrkoping_Symphony_Orchestra: "Симфонический оркестр Норрчёпинга"
 Yingying_Herrdahl: "Инъин Хейердал (Yingying Herrdahl) — пипа"
 Yingying_Herrdahl_facts: "Инъин Хейердал — виртуоз пипы, в настоящее время проживает в Швеции."
 Pipa_facts: "Китайская пипа — струнный инструмент грушевидной формы. Струны защипывают ногтями, но в прошлом также использовались плектры. История инструмента насчитывает почти две тысячи лет, и он до сих пор пользуется огромной популярностью."
 Martin_Ostergren: "Мартин Эстергрен (Martin Östergren) — орган"
 Feras_Charestan: "Ферас Харестан (Feras Charestan) — канун"
 Feras_Charestan_facts: "Ферас Харестан родом из города Эль-Хасаки на северо-востоке Сирии, изучал канун в Арабском музыкальном институте."
 Qanun_facts: "Канун — музыкальный инструмент, родственный цитре, вероятно, родом из древней Месопотамии, хотя точное происхождение неизвестно."
 Ilona_Danho: "Илона Данхо (Ilona Danho) — вокал"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$; $Ilona_Danho$"
 Dan_Cecil_Hill: "Дэн Сесил Хилл (Dan Cecil Hill) — флейта"
 Dan_Cecil_Hill_facts: "Дэн Сесил Хилл (народ кайюга, клан цапли) — исполнитель и музыкант хауденосауни (ирокез), специализирующийся на традиционном серебряном деле и изготовлении флейт. Творец, исполнитель и культурный деятель, посвятивший этому большую часть своей жизни, он предпринимает попытки сохранить и распространить знание об истории своего народа с доколониальных времён."
 Pierre_Harmon: "Пьер Хармон (Pierre Harmon)"
 Pierre_Harmon_facts: "Пьер Хармон — известный флейтист и специалист по доколумбовой музыке. Он обрёл мировую известность благодаря своим музыковедческим исследованиями, в частности, ацтекской музыки. Он также известен как обладатель одной из крупнейших коллекций древних инструментов, изготовлению которых он посвятил свою карьеру."
 Laurent_Sauron: "Лоран Саурон (Laurent Sauron)"
 Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$ — флейты; $Laurent_Sauron$ — ударные"
 Nana_Osei_Twum_Barima_seperewa: "Нана Осей Твум Барима (Nana Osei Twum Barima) — вокал, сеперева"
 Nana_Osei_Twum_Barima_aho: "Нана Осей Твум Барима (Nana Osei Twum Barima) — вокал, атумпан, нтахера, давуро, фирикйивуа, нтваму)"
