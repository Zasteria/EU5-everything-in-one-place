 Martin_Ostergren: "Мартин Эстергрен (орган)"
 Martin_Rinckart: "Мартин Ринкарт (1586-1649)"
 Martin_Rinckart_facts: "Мартин Ринкарт был лютеранским священником и автором гимнов, служившим архидиаконом в Айленбурге в Нордзаксене, где он родился и умер."
 MusicPlayer_01_Overture_I_Genesis: "01 - Увертюра I. Бытие"
 MusicPlayer_01_Overture_I_Genesis_flavour: "«Мир пробуждается, солнечный свет открывает его облик по частям»."
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - Увертюра II. Одиссея"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "«Увертюра нашей истории, в которой мы знакомимся с её героями и темами»."
 MusicPlayer_03_Royal_Court_Invitation: "03 - Приглашение к королевскому двору"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "Клавесин, звучащий в этой композиции, — клавишный инструмент, широко распространённый в музыке эпохи Возрождения и барокко. Звук извлекается механическим способом: при нажатии клавиши приводится в движение перо-плектр, защипывающее одну из струн, натянутых на резонансной деке."
 MusicPlayer_04_In_Your_Honor: "04 - В вашу честь"
 MusicPlayer_04_In_Your_Honor_flavour: "Величественная композиция, напоминающая о зелёных пастбищах и благоговении перед Богом и природой."
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - Рождение империи"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Открываясь главным мотивом Europa Universalis V, эта композиция ярко воплощает основную эмоцию всей игры."
 MusicPlayer_06_Pain_is_Salvation: "06 - Боль есть спасение"
 MusicPlayer_06_Pain_is_Salvation_flavour: "Текст песни сочетает английский, старонемецкий и латынь и повествует о страданиях на пути к спасению."
 MusicPlayer_07_For_the_Lost_Ones: "07 - Памяти павших"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "Скорбная, вздымающаяся композиция, перекликающаяся с темами и мотивами других произведений из Europa Universalis V."
 MusicPlayer_08_No_Fear_No_Mercy: "08 - Ни страха, ни пощады"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "Торжественная композиция, напоминающая затишье перед битвой и биение сердец воинов в их грудях в предчувствии."
 MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine"
 MusicPlayer_09_Libera_me_Domine_flavour: "Это произведение объединяет тексты «Pie Jesu» и «Libera me», которые традиционно кладутся на музыку как часть заупокойной мессы (реквиема) в католической церкви. В них возносится мольба о том, чтобы милосердие Иисуса даровало усопшим покой и избавление в день Страшного суда."
 MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri"
 MusicPlayer_10_Gloria_Patri_flavour: "Вокальная вариация на тему Сюиты для виолончели № 1 соль мажор Баха, BWV 1007: I. Прелюдия."
 MusicPlayer_11_Maiden_Voyage: "11 - Первое плавание"
 MusicPlayer_11_Maiden_Voyage_flavour: "Композиция в танцевальном ритме, подобная перекату волн, когда корабль отправляется в неизведанные моря."
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Шут глаголет истину"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Композиция, вдохновлённая музыкой раннего Возрождения, построенная на вариациях главного мелодического мотива музыки Europa Universalis V."
 MusicPlayer_13_Battle_of_Lutzen: "13 - Битва при Лютцене"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "Битва при Лютцене произошла 16 ноября 1632 года между шведской армией, которую поддерживали войска Саксонии и Гессен-Касселя, и имперской армией Священной Римской империи. Это одно из важнейших сражений Тридцатилетней войны. После гибели в этой битве короля Швеции Густава Адольфа была образована Хайльброннская лига."
 MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna"
 MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna — текст, часто положенный на музыку как часть заупокойной мессы (реквиема) в католической церкви. В нём говорится о благодати Божьей и Его вечном свете, озаряющем усопших."
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - Сделка с Вельзевулом"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Религия и война, и войны за религию. Благочестие и жажда крови переплетаются между собой. Изображённые здесь века — века резких контрастов, пронизанных оттенками серого."
 MusicPlayer_16_The_Path_to_Potsdam: "16 - Путь в Потсдам"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "Город Потсдам потерял почти половину своего населения во время Тридцатилетней войны."
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - Коронация голого императора"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Произведение в светском барочном стиле для струнных инструментов и клавесина."
 MusicPlayer_18_Falalalan: "18 - Фалалалан"
 MusicPlayer_18_Falalalan_flavour: "История всегда присутствует в музыке, порой не единственным образом."
 MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum"
 MusicPlayer_19_O_quam_gloriosum_flavour: "Это произведение основано на тексте, написанном Томасом Луисом де Виктория (1548–1611) для его «Missa O quam gloriosum»."
 MusicPlayer_20_Thirty_Years: "20 - Тридцать лет"
 MusicPlayer_20_Thirty_Years_flavour: "Тридцатилетняя война (1618–1648) — один из самых разрушительных конфликтов в европейской истории, унёсший жизни от 4,5 до 8 миллионов человек. Она была вызвана Реформацией XVI века и подпитывалась внешними столкновениями интересов и давними распрями."
 MusicPlayer_21_Conquer_or_Fall: "21 - Покорить или пасть"
 MusicPlayer_21_Conquer_or_Fall_flavour: "Эпическая композиция с участием валторн, струнных и хора. Представляет вдохновляющую вариацию на одну из главных мелодических тем музыки Europa Universalis V."
 MusicPlayer_22_A_Message_to_The_King: "22 - Послание королю"
 MusicPlayer_22_A_Message_to_The_King_flavour: "Композиция, полная тревоги и пыла, передающая ощущение, что промедление недопустимо."
 MusicPlayer_23_The_Flagellant: "23 - Флагеллант"
 MusicPlayer_23_The_Flagellant_flavour: "Флагеллантство — самобичевание как покаяние за грехи и приобщение к страстям Христовым, распространённое во многих христианских традициях. Движение флагеллантов возникло в XIV веке в Западной Европе как отклик на войны, голод и чуму."
 MusicPlayer_24_The_Black_Death: "24 - Чёрная смерть"
 MusicPlayer_24_The_Black_Death_flavour: "Сократив население Европы XIV века вдвое, Чёрная смерть стала одной из самых смертоносных пандемий в истории человечества."
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - Благородное искусство дипломатии"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Семейство лютневых инструментов имеет долгую историю во многих регионах мира и эпохах, а европейская лютня была главным инструментом светской музыки эпохи Возрождения в Европе."
 MusicPlayer_26_Peace_of_Westphalia: "26 - Вестфальский мир"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "Вестфальский мир — общее название двух отдельных мирных договоров, подписанных в Оснабрюке и Мюнстере в 1648 году, положивших конец Тридцатилетней войне и принёсших мир Священной Римской империи."
