 MusicPlayer_language_Old_Castilian: "Старокастильский язык"
 MusicPlayer_sol_ashanti_Aho: "Ашанти - Ахо"
 MusicPlayer_sol_ashanti_Aho_flavour: "Нана Осей Твум Барима — мастер игры на всех инструментах, используемых в музыке и церемониях ашанти, включая сеперева, традиционные рога и ударные инструменты. Он также является преемником императора и основателя королевства Ашанти. Название песни переводится как «Боевой клич»."
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ашанти - Асантеман Йеним Ко"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Начало текста песни примерно переводится как «Ашанти умеют сражаться, но не умеют отступать», и далее в песне провозглашается превосходство воинов ашанти."
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ашанти - Сеперева Акаса"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Название песни переводится как «Сеперева заговорила». Сеперева — инструмент из семейства арфа-лютня с резонатором в форме коробки и 10-14 струнами, прикреплёнными к грифу инструмента путём наматывания их непосредственно на гриф. Он берёт своё начало в Западной Африке, и говорят, что король Осей Туту, основатель империи Асante/Ашанти, так любил этот инструмент, что для его королевских регалий была изготовлена его копия из золота."
 MusicPlayer_sol_aztec_Iyac: "Ацтеки — Ияк"
 MusicPlayer_sol_aztec_Iyac_flavour: "$Pierre_Harmon_facts$. Название песни переводится как «Традиционный воин»."
 MusicPlayer_sol_aztec_Mictlan: "Ацтеки — Миктлан"
 MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$. Название песни переводится как «Подземный мир»."
 MusicPlayer_sol_aztec_Teotl: "Ацтеки — Теотль"
 MusicPlayer_sol_aztec_Teotl_flavour: "$Pierre_Harmon_facts$. Название песни переводится как «Бог природы»."
