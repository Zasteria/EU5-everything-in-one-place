 Pierre_Harmon: "Пьер Армон"
 Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$ (флейты), $Laurent_Sauron$ (перкуссия)"
 Pierre_Harmon_facts: "Пьер Армон — известный флейтист и признанный знаток доколумбовой музыки. Прославившийся во всём мире своими ценными музыковедческими исследованиями, особенно в области ацтекской музыки, он также владеет одной из крупнейших коллекций древних инструментов, изучению которых посвятил всю свою карьеру."
 Pipa_facts: "Китайская пипа — струнный инструмент грушевидной формы, на котором играют, защипывая струны ногтями, а исторически также при помощи плектра. Её история насчитывает почти две тысячи лет, и она является одним из самых популярных китайских инструментов."
 Qanun_facts: "Канун — струнный инструмент из семейства цитр, вероятно, происходящий из древней Месопотамии, хотя его происхождение остаётся неясным."
 Rohan_Pillai: "Рохан Пиллаи (вина)"
 Rohan_Pillai_and_Pancham_Upadhay: "$Rohan_Pillai$, $Pancham_Upadhyay$"
 Rohi_al_Khammash: "Рухи аль-Хаммаш (1923-1998)"
