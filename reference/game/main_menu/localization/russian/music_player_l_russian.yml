 #### TRACK NAMES AND FLAVOUR TEXT ####
 MusicPlayer_01_Overture_I_Genesis: "01 — Overture I Genesis"
 MusicPlayer_01_Overture_I_Genesis_flavour: "«Мир пробуждается, и солнечный свет постепенно озаряет его черты»."
 MusicPlayer_02_Overture_II_The_Odyssey: "02 — Overture II Odyssey"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "«Увертюра нашей истории, в которой раскрылись её характер и темы»."
 MusicPlayer_03_Royal_Court_Invitation: "03 — Royal Court Invitation"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "В этой композиции звучит клавесин — клавишный инструмент, преобладающий в музыке Возрождения и барокко. Он производит звуки за счёт механического пощипывания ряда струн на деке — нажатие клавиши приводит в движение перьевой плектр, который дёргает одну струну."
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 — The Noble Art of Diplomacy"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Лютня и похожие инструменты встречаются во множестве уголков мира на протяжении многих эпохи, и европейская лютня стала главным инструментом светской музыки Европы эпохи Возрождения."
 MusicPlayer_21_Conquer_or_Fall: "21 — Conquer or Fall"
 MusicPlayer_21_Conquer_or_Fall_flavour: "Эпическая композиция, использующая духовые, струнные и хор. Это вдохновляющая интерпретация одной из основных музыкальных тем Europa Universalis V."
 MusicPlayer_07_For_the_Lost_Ones: "07 — For the Lost Ones"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "Оплакивающая и тревожная композиция, отражающая темы и мотивы других композиций Europa Universalis V."
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 — Jester Speaks the Truth"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Композиция, вдохновлённая музыкой раннего Возрождения, основана на интерпретациях основного музыкального мотива Europa Universalis V."
 MusicPlayer_05_The_Rise_of_an_Empire: "05 — The Rise of an Empire"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Эта композиция начинается с главного мотива Europa Universalis V и отражает основные эмоции от игры."
 MusicPlayer_20_Thirty_Years: "20 — Thirty Years"
 MusicPlayer_20_Thirty_Years_flavour: "Тридцатилетняя война (1618-1648 гг.) стала одним из самых разрушительных конфликтов в европейской истории и привела к смерти от 4,5 до 8 миллионов человек. Искрой послужила Реформация XVI века, но масла в огонь также подлили внешние конфликты интересов и старые соперничества."
 MusicPlayer_24_The_Black_Death: "24 — The Black Death"
 MusicPlayer_24_The_Black_Death_flavour: "Чёрная смерть унесла жизни половины обитателей Европы XIV века, став одной из самых разрушительных пандемий в человеческой истории."
 MusicPlayer_10_Gloria_Patri: "10 — Gloria Patri"
 MusicPlayer_10_Gloria_Patri_flavour: "Вокальная интерпретация Баха, сюиты № 1 соль мажор, BWV 1007: 1.Прелюдия."
 MusicPlayer_14_Lux_aeterna: "14 — Lux Aeterna"
 MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna обычно относят к музыке в рамках заупокойной мессы в католической церкви. В тексте говорится о милости бога и его вечном сиянии, озаряющем ушедших."
 MusicPlayer_18_Falalalan: "18 — Falalalan"
 MusicPlayer_18_Falalalan_flavour: "В музыке всегда присутствует история, порой в нескольких формах."
 MusicPlayer_22_A_Message_to_The_King: "22 — A Message to the King"
 MusicPlayer_22_A_Message_to_The_King_flavour: "Композиция, наполненная чувством срочности и рвения, показывающая, что спешка жизненно необходима."
 MusicPlayer_08_No_Fear_No_Mercy: "08 — No Fear, No Mercy"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "Триумфальная композиция, напоминающая затишье перед боем, когда сердца солдат трепещут от предвкушения."
 MusicPlayer_06_Pain_is_Salvation: "06 — Pain is Salvation"
 MusicPlayer_06_Pain_is_Salvation_flavour: "В лирике смешиваются английский, старогерманский и латынь, повествуя о страданиях на пути к спасению."
 MusicPlayer_04_In_Your_Honor: "04 — In Your Honor"
 MusicPlayer_04_In_Your_Honor_flavour: "Величавая композиция, напоминающая о зелёных пастбищах и о благоговении перед Богом и природой."
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 — A Bargain with Beelzebub"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Религия и война, войны из-за религии. Смешали правоверность и кровожадность. Звучащие здесь века — это века резких контрастов, перемежающиеся оттенками серого."
 MusicPlayer_16_The_Path_to_Potsdam: "16 — The Path to Potsdam"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "Город Потсдам потерял почти половину населения во время Тридцатилетней войны."
 MusicPlayer_11_Maiden_Voyage: "11 — Maiden Voyage"
 MusicPlayer_11_Maiden_Voyage_flavour: "Композиция в танцующем ритме, напоминающем перекатывающиеся волны на пути в неизведанные моря."
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 — The Coronation of a Naked Emperor"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Образец светского барокко с использованием струнных инструментов и клавесина."
 MusicPlayer_13_Battle_of_Lutzen: "13 — Battle of Lützen"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "Сражение при Лютцене произошло 16 ноября 1632 года между шведской армией, поддержанной войсками Саксонии и Гессен-Касселя, и императорской армией Священной Римской Империи и является одним из важнейших сражений Тридцатилетней войны. После гибели в бою шведского короля Густава Адольфа Хейльброннская лига."
 MusicPlayer_26_Peace_of_Westphalia: "26 — Peace of Westphalia"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "Вестфальский мир — обобщённое название двух отдельных мирных соглашений, подписанных в Оснабрюке и Мюнстере в 1648 году, положивших конец Тридцатилетней войне и возвративших мир в Священную Римскую Империю."
 MusicPlayer_23_The_Flagellant: "23 — The Flagellant"
 MusicPlayer_23_The_Flagellant_flavour: "Самобичевание с целью очищения от греха и приобщения к Страстям Христовым присутствует во многих христианских традициях. Флагеллантство как движение возникло в западном христианстве в XIV веке в ответ на войны, голод и чуму."
 MusicPlayer_19_O_quam_gloriosum: "19 — O quam gloriosum"
 MusicPlayer_19_O_quam_gloriosum_flavour: "Эта композиция основана на тексте Томаса Луиса де Виктория (1548-1611), написанном для «Missa O quam gloriosum»."
 MusicPlayer_09_Libera_me_Domine: "09 — Libera me Domine"
 MusicPlayer_09_Libera_me_Domine_flavour: "Эта композиция сочетает тексты «Pie Jesu» и «Libera me», которые часто исполняются под музыку в рамках заупокойной мессы в католической церкви. Они просят покойного ниспослать им милость Иисуса и искупление в судный день."
 MusicPlayer_sol_ashanti_Aho: "Ashanti — Aho"
 MusicPlayer_sol_ashanti_Aho_flavour: "Нана Осей Твум Барима — мастер всех инструментов, используемых в музыке и церемониях анашти, включая сепереву, традиционные рога и ударные инструменты. Он также преемник императора и основателя Королевства Ашанти. Название песни переводится как «Боевая речёвка»."
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ashanti — Asanteman Yenim Ko"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Начальные слова песни примерно переводятся как «Ашанти умеют сражаться, но не умеют убегать», и дальше текст рассказывает о превосходстве воинов ашанти."
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ashanti — Seperewa Akasa"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Название переводится как «Сеперева изрекла». Сеперева — это инструмент, родственный арфе или лютне, с квадратным резонатором и 10-14 струнами, привязанными прямо к грифу. Инструмент ведёт начало из Западной Африки, и по легендам король Осей-Туту, основатель Королевства Ашанти, настолько любил его, что для него изготовили копию инструмента из золота."
 MusicPlayer_sol_aztec_Mictlan: "Aztec — Mictlan"
 MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$. Название композиции переводится как «Нижний мир»."
