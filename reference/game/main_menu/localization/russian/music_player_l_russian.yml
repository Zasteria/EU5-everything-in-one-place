 Hakan_Glante: "Хокан Глэнте"
 Hakan_Glante_and_Bach: "Хокан Глэнте, И. С. Бах"
 Ilona_Danho: "Илона Данхо (вокал)"
 Jacob_Regnart: "Якоб Регнарт (1540-е — 1599)"
 Jacob_Regnart_facts: "Регнарт — фламандский композитор эпохи Возрождения, родившийся в Дуэ и писавший как духовную, так и светскую музыку. На протяжении жизни он был активен в Австрии и Богемии, в частности занимая должность капельмейстера при эрцгерцоге Фердинанде в Инсбруке в 1580-х годах."
 Joachim_Neander: "Иоахим Неандер (1650-1680)"
 Joachim_Neander_facts: "Родившийся в Бремене Иоахим Неандер был автором гимнов реформатской (кальвинистской) церкви, богословом и учителем. Его считают крупнейшим автором гимнов реформатской церкви, написавшим около 60 гимнов."
