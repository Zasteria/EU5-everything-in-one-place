 Emelie_Roos_and_Daniel_Burstedt: "Эмели Роос (блокфлейта), Даниэль Бурстедт (английский рожок)"
 Emelie_Roos_and_Dohyo_Sol_and_Samuel_Runsteen: "Эмели Роос (блокфлейта), Дохё Соль (лютня), Самуэль Рунстен (виола да гамба)"
 Emelie_Roos_and_Samuel_Runsteen: "Эмели Роос (блокфлейта), Самуэль Рунстен (виола да гамба)"
 Feras_Charestan: "Ферас Чарестан (канун)"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$, $Ilona_Danho$"
 Feras_Charestan_facts: "Ферас Чарестан родом из города Аль-Хасака на северо-востоке Сирии; изучал канун в Высшем институте музыки в Дамаске."
