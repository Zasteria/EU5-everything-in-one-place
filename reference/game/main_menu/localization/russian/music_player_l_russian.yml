 traditional: "Традиционная"
 improvisational: "Импровизация"
 Jacob_Regnart: "Якоб Регнарт (1540е-1599)"
 Jacob_Regnart_facts: "Регнарт — композитор фламандского Возрождения родом из Дуэ, автор церковной и светской музыки. На протяжении жизни он работал в Австрии и Богемии, в том числе занимая должность капельмейстера эрцгерцога Фердинанда в Инсбруку в 1580е годы."
 Martin_Rinckart: "Мартин Ринкарт (1586-1649)"
 Martin_Rinckart_facts: "Мартин Ринкарт был лютеранским священником и сочинителем псалмов, архидиаконом в Айленбурге, Северная Саксония, где он родился и умер."
 Joachim_Neander: "Иоахим Неандер (1650-1680)"
 Joachim_Neander_facts: "Иоахим Неандер родился в Бремене и был реформистским (кальвинистским) сочинителем псалмов, теологом и учителем. Он считается величайшим сочинителем псалмов в реформистской церкви — ему приписывается авторство 60 псалмов."
 Dietrich_Buxtehude: "Дитрих Букстехуде (1637-1707)"
 Dietrich_Buxtehude_facts: "Дитрих Хансен Букстехуде родился в Хельсингборге в провинции Скания в 1637 году. Букстехуде считается одним из важнейших композиторов XVII века, оказавшим значительное влияние на более поздних композиторов, включая Баха и Генделя."
 Gabriel_Asaad: "Габриель Асаад (1907-1997)"
 Rohi_al_Khammash: "Рохи аль-Хаммаш (1923-1998)"
