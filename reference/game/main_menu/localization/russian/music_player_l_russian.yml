 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Шедевр классической китайской музыки, часто обычно исполняемый виртуозами. Составлен в военном стиле и изображает Битву под Гайся в 202 году до н. э., в ходе которой генерал Сян Юй был разбит Лю Баном."
