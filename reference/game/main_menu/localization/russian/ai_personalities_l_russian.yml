l_russian:
 # AI Personality names (used as PdxDataLocalize(GetKey()) in CAiPersonality::GetName)
 ai_balanced: "Разносторонность"
 ai_aggressive: "Агрессия"
 ai_expansionist: "Экспансионизм"
 ai_defensive: "Оборона"
 ai_cautious: "Осторожность"
 ai_opportunistic: "Оппортунизм"
 ai_isolationist: "Изоляционизм"
 ai_friendly: "Дружелюбие"
 # AI Personality descriptions (key + "_desc")
 ai_balanced_desc: "У этой державы нет ярко выраженных предпочтений. Её действия зависят от темперамента правителей, общественных ценностей и текущих обстоятельств."
 ai_aggressive_desc: "Эта держава стремится к власти, используя силовые методы. Она охотно начинает войны, выдвигает жёсткие условия мира и считает соседние державы препятствиями на пути к цели, а не партнёрами для выгодного сотрудничества."
 ai_expansionist_desc: "Эта держава стремится расширять свои границы и влияние. Она предпочитает территориальную экспансию, активно выдвигает претензии на те или иные земли и по возможности старается подчинять, а не присоединять соседей."
 ai_defensive_desc: "Эта держава в первую очередь стремится сохранить то, что уже имеет. Она предпочитает избегать ненужных конфликтов, укреплять свои земли и скорее отвечать на угрозы, чем создавать новые."
 ai_cautious_desc: "Эта держава отличается терпением и избегает рисков. Она в первую очередь стремится к дипломатическим решениям, избегает затяжных войн и предпочитает стабильность авантюрам."
 ai_opportunistic_desc: "Эта держава отличается расчётливостью и прагматизмом. Она стремится найти слабое место у своего оппонента и не упускает момент воспользоваться случаем, но избегает участия в конфликтах с неопределённым исходом."
 ai_isolationist_desc: "Эта держава сосредоточена на себе, предпочитает внутреннее развитие и избегает участия в делах соседей. Она придерживается нейтралитета и с подозрением относится к дипломатическим обязательствам."
 ai_friendly_desc: "Эта держава ценит союзников, доброжелательность и честные сделки. Она много тратит на дипломатию, принимает разумные условия мира и обычно со временем обзаводится надёжными партнёрами."
 # Diplomacy filter category header
 CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "Менталитет державы"
 # Tooltip section header
 AI_PERSONALITY_MODIFIERS: "Модификаторы поведения"
 # AI disposition labels (how this country sees the player)
 AI_DISPOSITION_ALARMED: "Тревога"
 AI_DISPOSITION_WARY: "Беспокойство"
 AI_DISPOSITION_PLANNING_WAR: "Планирование войны"
 AI_DISPOSITION_COVETS: "Желание получить ваши земли"
 AI_DISPOSITION_DOMINEERING: "Господство"
 AI_DISPOSITION_RIVALS: "Соперничество"
 AI_DISPOSITION_INDIFFERENT: "Безразличие"
 AI_DISPOSITION_FRIENDLY: "Дружелюбие"
 AI_DISPOSITION_SELF: "Ваша держава"
 # AI disposition descriptions (tooltip body for each disposition)
 AI_DISPOSITION_ALARMED_DESC: "Этот [Concept('country_disposition', 'настрой')|e] означает, что держава считает вас экзистенциальной угрозой и постарается обзавестись оборонительными союзами или нанести по вам превентивный удар."
 AI_DISPOSITION_WARY_DESC: "Этот [Concept('country_disposition', 'настрой')|e] означает, что держава относится к вам настороженно, неохотно пойдёт на уступки и вряд ли ослабит бдительность."
 AI_DISPOSITION_PLANNING_WAR_DESC: "Этот [Concept('country_disposition', 'настрой')|e] означает, что у державы есть претензии или обиды, и она готовится силой защитить свои интересы."
 AI_DISPOSITION_COVETS_DESC: "Этот [Concept('country_disposition', 'настрой')|e] означает, что держава считает ваши земли привлекательной целью и может попытаться завоевать или подчинить вас, если подвернётся такая возможность."
 AI_DISPOSITION_DOMINEERING_DESC: "[Concept('country_disposition', 'Настрой державы')|e] означает, что она могущественней вашей, и её власти стремятся подчинить вас или сделать вассалами, даже если они не претендуют на конкретную провинцию."
 AI_DISPOSITION_RIVALS_DESC: "Этот [Concept('country_disposition', 'настрой')|e] означает, что держава считает вас соперником и будет по возможности противодействовать вашим интересам, в том числе поддерживая ваших врагов."
 AI_DISPOSITION_INDIFFERENT_DESC: "Этот [Concept('country_disposition', 'настрой')|e] означает, что держава сейчас безразлична к вам."
 AI_DISPOSITION_FRIENDLY_DESC: "[Concept('country_disposition', 'Настрой державы')|e] означает, что её власти относятся к вам по-дружески и склонны к сотрудничеству. Возможно, между вами сложились хорошие отношения, или вы вместе состоите в оборонительном союзе."
