l_russian:
 rule_player_difficulty: "Уровень сложности для игроков"
 setting_player_very_easy_difficulty: "Очень низкий"
 setting_player_very_easy_difficulty_desc: "Самый простой режим. Державы под управлением игроков получат серьёзные преимущества."
 setting_player_easy_difficulty: "Низкий"
 setting_player_easy_difficulty_desc: "Подойдёт для тех, кому по душе расслабленная игра. Державы под управлением игроков получат ряд преимуществ."
 setting_player_normal_difficulty: "Средний"
 setting_player_normal_difficulty_desc: "Сбалансированный режим. Державы под управлением игроков не обладают преимуществами."
 setting_player_hard_difficulty: "Высокий"
 setting_player_hard_difficulty_desc: "Режим для тех, у кого достаточно опыта. Державы под управлением игроков будут обладать рядом недостатков."
 setting_player_very_hard_difficulty: "Очень высокий"
 setting_player_very_hard_difficulty_desc: "Самый сложный режим. Державы под управлением игроков будут обладать серьёзными недостатками."
 rule_ai_difficulty: "Уровень сложности для компьютера"
 setting_ai_very_easy_difficulty: "Очень низкий"
 setting_ai_very_easy_difficulty_desc: "Самый простой режим. На державы под управлением компьютера будут наложены ограничения. Они будут проявлять меньше агрессии к игрокам."
 setting_ai_easy_difficulty: "Низкий"
 setting_ai_easy_difficulty_desc: "Подойдёт для тех, кому по душе расслабленная игра. Державы под управлением компьютера будут проявлять меньше агрессии к игрокам, чем в более сложных режимах."
 setting_ai_normal_difficulty: "Средний"
 setting_ai_normal_difficulty_desc: "Сбалансированный режим. Державы под управлением компьютера будут одинаково относиться ко всем прочим, вне зависимости от того, кто ими управляет."
 setting_ai_hard_difficulty: "Высокий"
 setting_ai_hard_difficulty_desc: "Режим для тех, у кого достаточно опыта. Державы под управлением компьютера получат ряд преимуществ и будут действовать более агрессивно."
 setting_ai_very_hard_difficulty: "Очень высокий"
 setting_ai_very_hard_difficulty_desc: "Самый сложный режим. Державы под управлением компьютера получат серьёзные преимущества и будут действовать более агрессивно."
 rule_ai_aggression: "Агрессивность ИИ"
 setting_ai_low_aggression: "Низкая агрессивность"
 setting_ai_low_aggression_desc: "Подходит для расслабленной игры. Державы под управлением компьютера начинают [Concept('war', 'войны')|e] только при наличии [Concept('casus_belli', 'повода')|e]."
 setting_ai_normal_aggression: "Обычная агрессивность"
 setting_ai_normal_aggression_desc: "Обычный игровой режим. Державы под управлением компьютера начинают [Concept('war', 'войны')|e] по собственному желанию, порой даже без [Concept('casus_belli', 'повода')|e]."
 setting_ai_high_aggression: "Высокая агрессивность"
 setting_ai_high_aggression_desc: "Режим повышенной сложности. Державы под управлением компьютера начинают [Concept('war', 'войны')|e] с куда большей вероятностью."
 rule_ahistorical_formable_countries: "Создаваемые державы"
 setting_no_ahistorical_formable_countries: "Только исторические"
 setting_no_ahistorical_formable_countries_desc: "Можно будет создавать только те [Concept('formable_country_formed', 'державы')|e], которые существовали в реальности."
 setting_allow_plausible_ahistorical_formable_countries: "Разрешить возможные"
 setting_allow_plausible_ahistorical_formable_countries_desc: "Разрешает создание неправдоподобных [Concept('formable_country_formation', 'держав')|e], которые теоретически могли бы возникнуть."
 setting_allow_ahistorical_formable_countries: "Разрешить неправдоподобные"
 setting_allow_ahistorical_formable_countries_desc: "Можно создавать все [Concept('formable_country_formed', 'державы')|e], в том числе неисторические, ломающие атмосферу игры."
 rule_historical_ai: "Выбор под управлением компьютера"
 setting_historical_ai_choices: "Исторически достоверный"
 setting_historical_ai_choices_desc: "Державы под управлением компьютера всегда будут выбирать исторически достоверные варианты во время [Concept('dynamic_historical_events', 'динамических исторических событий')|e]."
 setting_weighted_ai_choices: "Ситуативный"
 setting_weighted_ai_choices_desc: "Выбор вариантов будет зависеть от ситуации."
 setting_random_ai_choices: "Случайный"
 setting_random_ai_choices_desc: "Державы под управлением компьютера будут делать совершенно случайный выбор."
 rule_mission_packs_enabled_rule: "Задания"
 setting_mission_packs_enabled: "Задания доступны"
 setting_mission_packs_enabled_desc: "Если выбрать этот параметр, у нас будет доступ ко всем [Concept('missions', 'заданиям')|e]."
 setting_mission_packs_disabled: "Задания недоступны"
 setting_mission_packs_disabled_desc: "Если выбрать этот параметр, все [Concept('missions', 'задания')|e] будут недоступны, и вы не сможете их выполнять."
 rule_mission_rewards: "Награды за задание"
 setting_every_task_reward: "За каждый этап"
 setting_every_task_reward_desc: "Каждый [Concept('mission_task', 'этап задания')|e] даст награду."
 setting_only_end_mission_rewards: "Только за завершение задания"
 setting_only_end_mission_rewards_desc: "Награды за [Concept('missions', 'задания')|e] даются только после их завершения. За завершение [Concept('mission_tasks', 'этапов заданий')|e] награды не даются."
 setting_mission_no_rewards: "Без наград"
 setting_mission_no_rewards_desc: "За завершение [Concept('missions', 'заданий')|e] никогда не даются награды, влияющие на игровой процесс."
 rule_ai_colonisation_rule: "Колонизация под управлением компьютера"
 setting_western_colonisation_only: "Только западные державы"
 setting_western_colonisation_only_desc: "[Concept('colonize', 'Колонизировать')|e] смогут только [Concept('countries', 'державы')|e] со [Concept('capital', 'столицами')|e] в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!."
 setting_all_countries_colonize: "Все державы"
 setting_all_countries_colonize_desc: "Пытаться [Concept('colonize', 'колонизировать')|e] будут все [Concept('countries', 'державы')|e], способные себе это позволить."
 rule_ai_exploration_rule: "Экспедиции под управлением компьютера"
 setting_western_exploration_only: "Только западные державы"
 setting_western_exploration_only_desc: "[Concept('explore', 'Отправлять экспедиции')|e] смогут только [Concept('countries', 'державы')|e] со [Concept('capital', 'столицами')|e] в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!."
 setting_all_countries_explore: "Все державы"
 setting_all_countries_explore_desc: "[Concept('explore', 'Отправлять экспедиции')|e] будут все [Concept('countries', 'державы')|e], способные себе это позволить."
 rule_ai_religious_conversion_rule: "Обращение ИИ в религию"
 setting_only_within_religion_group: "Только в пределах религиозной группы"
 setting_only_within_religion_group_desc: "[Concept('religion', 'Религиозное')|e] обращение [Concept('countries', 'держав')|e] возможно только в рамках той же [Concept('religion_group', 'религиозной группы')|e]."
 setting_free_conversion: "Любая религия"
 setting_free_conversion_desc: "[Concept('countries', 'Державы')|e] смогут обращаться в любую религию и даже покидать свою религиозную группу, если это поможет стабилизировать власть."
 rule_culture_conversions_rule: "Обращения в другую культуру"
 setting_dynamic_culture: "Динамические правила"
 setting_dynamic_culture_desc: "[Concept('culture', 'Культурное')|e] обращение возможно только при соответствии видимым критериям."
 setting_culture_group_only: "Только в пределах культурной группы"
 setting_culture_group_only_desc: "[Concept('culture', 'Культурное')|e] обращение возможно только в рамках той же [Concept('culture_group', 'культурной группы')|e]."
 setting_culture_present_in_country: "Присутствующие в державе"
 setting_culture_present_in_country_desc: "[Concept('culture', 'Культурное')|e] обращение возможно в отношении всех имеющихся в державе культур."
 setting_any_culture: "Любая культура"
 setting_any_culture_desc: "[Concept('culture', 'Культурное')|e] обращение ничем не ограничено."
 rule_religion_conversions_rule: "Обращения в другую религию"
 setting_dynamic_religion: "Динамические правила"
 setting_dynamic_religion_desc: "[Concept('religion', 'Религиозное')|e] обращение возможно только при соответствии видимым критериям."
 setting_religion_group_only: "Только в пределах религиозной группы"
 setting_religion_group_only_desc: "[Concept('religion', 'Религиозное')|e] обращение возможно только в рамках той же [Concept('religion_group', 'религиозной группы')|e]."
 setting_religion_present_in_country: "Присутствующие в державе"
 setting_religion_present_in_country_desc: "[Concept('religion', 'Религиозное')|e] обращение возможно в отношении всех имеющихся в державе религий."
 setting_any_religion: "Любая религия"
 setting_any_religion_desc: "[Concept('religion', 'Религиозное')|e] обращение ничем не ограничено."
 rule_country_change: "Смена державы"
 setting_country_change_allowed: "Смена державы разрешена"
 setting_country_change_allowed_desc: "Позволяет сменить [Concept('country', 'державу')|e] после начала игры."
 setting_country_change_prohibited: "Смена державы запрещена"
 setting_country_change_prohibited_desc: "Если выбрать этот параметр, вы не сможете сменить [Concept('country', 'державу')|e] после начала игры."
 rule_rename_locations: "Переименование районов"
