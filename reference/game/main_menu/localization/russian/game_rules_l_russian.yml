 setting_rename_locations_allowed_desc: "Разрешает игроку переименовывать [Concept('locations', 'районы')|e]."
 setting_rename_locations_prohibited: "Переименование районов запрещено"
 setting_rename_locations_prohibited_desc: "Запрещает игроку переименовывать [Concept('locations', 'районы')|e]."
