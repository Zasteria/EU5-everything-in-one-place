 rule_black_death_date_rule: "Вспышка Чёрной смерти"
 setting_black_death_date_historical: "1346 год"
 setting_black_death_date_historical_desc: "#TOOLTIP:DISEASE,bubonic_plague,X #L Бубонная чума#!#! разразится в 1346 году. Эта страшная [Concept('disease', 'эпидемия')|e] вызовет [Concept('situation', 'ситуацию')|e] #TOOLTIP:SITUATION,black_death,X #L «Чёрная смерть»#!#!."
 setting_black_death_date_random: "Случайный год"
 setting_black_death_date_random_desc: "#TOOLTIP:DISEASE,bubonic_plague,X #L Бубонная чума#!#! разразится в эпоху #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! и эпоху #TOOLTIP:AGE,age_3_discovery,X #L Открытий#!#!. Эта страшная [Concept('disease', 'эпидемия')|e] вызовет [Concept('situation', 'ситуацию')|e] #TOOLTIP:SITUATION,black_death,X #L «Чёрная смерть»#!#!."
 setting_black_death_date_off: "Выключена"
 setting_black_death_date_off_desc: "[Concept('disease', 'Болезнь')|e] #TOOLTIP:DISEASE,bubonic_plague,X #L «Бубонная чума»#!#! и [Concept('situation', 'ситуация')|e] #TOOLTIP:SITUATION,black_death,X #L «Чёрная смерть»#!#! выключены."
 rule_black_death_origin_rule: "Источник Чёрной смерти"
 setting_black_death_origin_historical: "Центральная Азия"
 setting_black_death_origin_historical_desc: "#TOOLTIP:DISEASE,bubonic_plague,X #L Бубонная чума#!#! начнётся в любом [Concept('location', 'районе')|e] [Concept('areas', 'областей')|e] #TOOLTIP:AREA,desht_kipchak_area,X #L Дешт-и-Кипчак#!#!, #TOOLTIP:AREA,astrakhan_area,X #L Астрахань#!#! или #TOOLTIP:AREA,lower_yik_area,X #L Нижний Йик#!#!. Эта страшная [Concept('disease', 'эпидемия')|e] вызовет [Concept('situation', 'ситуацию')|e] #TOOLTIP:SITUATION,black_death,X #L «Чёрная смерть»#!#!."
 setting_black_death_origin_random: "Случайный район"
 setting_black_death_origin_random_desc: "#TOOLTIP:DISEASE,bubonic_plague,X #L Бубонная чума#!#! начнётся в случайном [Concept('location', 'районе')|e] #TOOLTIP:CONTINENT,asia,X #L Азии#!#!, #TOOLTIP:CONTINENT,europe,X #L Европы#!#! или #TOOLTIP:SUB_CONTINENT,north_africa,X #L Северной Африки#!#!. Эта страшная [Concept('disease', 'эпидемия')|e] вызовет [Concept('situation', 'ситуацию')|e] #TOOLTIP:SITUATION,black_death,X #L «Чёрная смерть»#!#!."
 rule_institution_spawn_rule: "Возникновение институтов"
 setting_institution_spawn_plausible: "Динамическое"
 setting_institution_spawn_plausible_desc: "[Concept('institutions', 'Институты')|e] будут возникать в тех [Concept('locations', 'районах')|e], где они могли бы возникнуть при сложившихся обстоятельствах."
 setting_institution_spawn_fixed_historical: "Историческое"
 setting_institution_spawn_fixed_historical_desc: "[Concept('institutions', 'Институты')|e] будут возникать в тех [Concept('locations', 'районах')|e], где они появились исторически."
 setting_institution_spawn_random_city: "Случайное"
 setting_institution_spawn_random_city_desc: "[Concept('institutions', 'Институты')|e] будут возникать в случайных #TOOLTIP:LOCATIONRANK,city,X #L городах#!#!."
 rule_institution_could_have_spawned_spread_rule: "Возникновение и распространение"
 setting_institution_could_have_spawned_spread_enabled: "Включено"
 setting_institution_could_have_spawned_spread_enabled_desc: "У [Concept('locations', 'районов')|e], в которых может возникнуть [Concept('institution', 'институт')|e], отсутствует бонус к его распространению."
 setting_institution_could_have_spawned_spread_disabled: "Выключено"
 setting_institution_could_have_spawned_spread_disabled_desc: "[Concept('locations', 'районы')|e], в которых может возникнуть [Concept('institution', 'институт')|e], не имеют дополнительных способов его распространения. Доступные способы: границы, торговля, рынки и столицы."
 rule_byz_name: "Название Византии"
 setting_byz_name_default: "Классическое"
 setting_byz_name_default_desc: "[Concept('country', 'Держава')|e] с центром в #TOOLTIP:PROVINCE_DEFINITION,constantinople_province,X #L Византионе#!#!, основанная представителями #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческой#!#! культуры, будет носить название «$BYZ_ADJ$ая Империя»."
 setting_byz_name_ere: "$BYZ_eastern_rome_ADJ$ая империя"
