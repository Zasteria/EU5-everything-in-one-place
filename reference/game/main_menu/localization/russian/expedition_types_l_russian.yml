 expedition_category_exploration: "Экспедиции"
 expedition_category_commercial: "Торговая"
 expedition_category_military: "Military"
 expedition_category_religious: "Религиозная"
 expedition_category_diplomatic: "Дипломатия"
 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "Каждый месяц изменяется на [MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2]. Причины:"
 EXPEDITION_VARIABLES_TT_TITLE: "Параметры путешествия"
 pilgrimage_expedition: "Великое паломничество"
 pilgrimage_expedition_desc: "Наш правитель отправится в паломничество к святым местам #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! веры."
 pilgrimage_expedition_historical_info: "Паломники-христиане начали отправляться в Иерусалим с IV века, когда император Константин поручил построить церковь Гроба Господня на месте погребения и воскресения Христа. Во время крестовых походов город неоднократно переходил из рук в руки. В 1099 году его захватили участники Первого крестового похода. В 1187 году он стал добычей Саладина. В 1229 году, при Фридрихе II, Иерусалим ненадолго вернулся под контроль христиан, после чего окончательно перешёл под власть мамлюков. Несмотря на утрату христианского господства, святые места остаются доступными для паломников благодаря дипломатическим договоренностям. Так Иерусалим стал главным центром католического паломничества во всём средневековом мире."
 pilgrimage_expedition_outcome_overview: "$BULLET$Каждый [holy_site|e], которого достигает наш [ruler|e], по прибытии предлагает собственную награду — будь то дополнительная [legitimacy|e], [prestige|e] или благодарность [ShowEstateTypeName('clergy_estate')].\n$BULLET$Завершение паломничества затем приносит награду, соразмерную тому, насколько благочестиво оно было совершено:\n$BULLET_WITH_TAB$До #G +20#! [legitimacy].\n$BULLET_WITH_TAB$Улучшение [ShowEstateTypeName('clergy_estate')] [estate_satisfaction|e].\n$BULLET_WITH_TAB$Улучшение [opinion|e] со стороны [GetCountry('PAP').GetName]."
 piety: "Правоверность"
 piety_desc: "Показывает, насколько усердно совершается паломничество. В пути этот показатель постепенно снижается, а мирские решения лишь ускоряют его расход. Если правоверность иссякнет полностью, паломничество обернётся позором. Высокий же уровень правоверности ощутимо увеличит итоговую награду."
 retinue: "Свита"
 retinue_desc: "Сопровождение правителя в паломничестве. Численность свиты не уменьшается сама по себе — только из-за неприятностей в пути. Если потерять всю свиту, правитель останется беззащитным перед опасностями, а паломничество завершится неудачей."
 pilgrimage_expedition_cooldown: "Великое паломничество"
 holy_site_pilgrimage_expedition: "Паломничество к святому месту"
 holy_site_pilgrimage_expedition_desc: "Наш правитель отправляется в паломничество к выбранной святыне, чтобы там помолиться при свидетелях, а затем вернуться из путешествия с более высоким престижем и репутацией набожного человека. Исходной точкой служит само паломничество, а не план путешествия."
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Прибытие к выбранному [holy_site|e] даёт награду в зависимости от нашей [religion|e]:\n$BULLET_WITH_TAB$#G +10#! [religious_influence|e], [purity|e] или [karma|e], растущие в зависимости от расстояния от нашей столицы, вплоть до #G +100#!.\n$BULLET_WITH_TAB$Последователи веры [ShowReligionGroupAdjective('folk_peruvian_group')] вместо этого сдвигают [yanantin|e] на #Y 20#! в сторону природы [holy_site] [god|e].\n$BULLET_WITH_TAB$Подходящие школы [ShowReligionGroupAdjective('muslim')] сдвигают её ещё на #Y 10#! в сторону [ShowSocietyDirectionName('mysticism')] или [ShowSocietyDirectionName('jurisprudence')]."
 holy_site_pilgrimage_expedition_order_zeal_tt: "Многие годы вперёд благочестие паломников, посещающих это владение, будет питать рвение хранящего его ордена"
 holy_site_pilgrimage_cooldown: "Паломничество к святому месту"
 treasure_fleet_expedition: "Золотой флот"
 treasure_fleet_expedition_desc: "Отправить императорский золотой флот в выбранный регион по государственным делам. Этот флот следует по прибрежным морским путям к месту назначения и обратно, заходя по пути в порты чужих земель. Это плавание расширяет дипломатическое влияние двора, позволяет раздать подарки и [ShowGoodsName('silk')|l] правителям южных морей, собрать дань и вернуться с редкими товарами, послами и именами королей, которые услышали звук китайского паруса."
 treasure_fleet_expedition_outcome_overview: "$BULLET$Флот отправляется в путь с грузом даров, оплаченных из нашей казны.\n$BULLET$При благополучном возвращении всё неистраченное обращается в [gold|e], плюс #G +10#! [prestige|e].\n$BULLET$Каждый иноземный двор реагирует по-своему:\n$BULLET_WITH_TAB$Двор, что примет нас радушно, дополнительно даёт #G +5#! [prestige], может войти в [GetUniqueInternationalOrganization('middle_kingdom').GetName] как наш данник и присылает дань и редкие дары, обогащающие наш [market|e].\n$BULLET_WITH_TAB$Двор же, отказавшийся от положения данника, напротив, обходится нам в #R -50#! [opinion|e] между нами и получает [ShowModifier('chi_resisting_subjugation')]."
 treasure_fleet_cooldown: "Золотой флот"
 western_ocean_voyage_expedition: "Вояж в западный океан"
 western_ocean_voyage_expedition_desc: "Отправьте флот на запад через открытые воды Атлантического океана в поисках морского пути в Индию. Когда [ShowAreaName('canary_islands_area')] останутся позади, наши карты станут бесполезны. С нами останутся только ветер, вода и надежда на то, что океан всё же не так широк, как полагают учёные."
 western_ocean_voyage_expedition_historical_info: "Идея достичь Азии, отправившись морем на запад, обсуждалась европейскими учёными на протяжении десятилетий до первой попытки такого путешествия. Главным препятствием была даже не форма Земли, которую образованные люди уже считали шарообразной, а её размер. Большинство учёных верно полагали, что океан слишком широк, и делали из этого вывод о том, что пересечь его невозможно. Доказать их неправоту удалось лишь благодаря неожиданным открытиям, сделанным экспедициями на своём пути."
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$Путешествие наносит на карту открытый океан по мере плавания, раскрывая достигнутые берега.\n$BULLET$Высадка на землю затем даёт:\n$BULLET_WITH_TAB$#G +10#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$А также дополнительно #G +20#! [prestige] за открытие Америки, открывающее Новый Свет для будущей колонизации."
 western_ocean_voyage_cooldown: "Вояж в западный океан"
 hajj_caravan_expedition: "Королевский Хадж"
 hajj_caravan_expedition_desc: "Отправьте нашего правителя в хадж, который является пятым и обязательным столпом ислама. Это очень долгое и дорогое путешествие, но правитель, вернувшийся из паломничества в #TOOLTIP:LOCATION,mecca,X #L Мекку#!#!, обладает таким авторитетом, который не обеспечит ни одна армия."
 hajj_caravan_expedition_historical_info: "За время своего правления (786–809 гг.) аббасидский халиф Харун ар-Рашид девять раз совершал паломничество из Багдада, причём часть пути он проходил пешком в знак благоговения. Его набожность стала образцом, которому на протяжении многих веков стремились подражать благочестивые правители."
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$до #G +20#! к [Concept('religious_influence', 'религиозному влиянию')|e].\n"
 hajj_caravan_expedition_outcome_overview: "$BULLET$Достижение [ShowLocationNameWithNoTooltip('mecca')] вознаграждает караван за проявленное там великолепие, вплоть до:\n$BULLET_WITH_TAB$#G +20#! [prestige|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Возвращение домой затем даёт:\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$Пятилетний [ShowModifier('hajj_pious_return')] [modifier|e].\n$BULLET_WITH_TAB$Постоянную почётную награду [ShowModifier('hajji_pilgrim')] — за первый Хадж [ruler|e].\n$BULLET$Караван должен достичь [ShowLocationNameWithNoTooltip('mecca')] в том же году, в котором он выступил в путь, иначе паломничество будет утрачено полностью."
 guards: "Вооружённый конвой"
 guards_desc: "Охрана каравана. Растёт за счёт найма воинов или при использовании #italic махмала#!, и снижается из-за набегов и трудностей. Чем лучше защищён караван, тем выше его шансы пережить нападение."
 splendor: "Роскошь"
 splendor_desc: "Показывает, насколько щедро снаряжён и украшен караван. Этот показатель растёт от щедрых трат и демонстрации богатства, а снижается из-за бурь и трудностей в пути. Именно роскошь определяет размер награды по прибытии в Мекку."
 hajj_caravan_cooldown: "Королевский Хадж"
 circumnavigation_expedition: "Кругосветное плавание"
 circumnavigation_expedition_desc: "Отправить флот на запад в попытке обогнуть весь земной шар — пройти на юг от #TOOLTIP:REGION,la_plata_region,X #L Рио-де-ла-Платы#!#!, миновать пролив на краю земли, пересечь безымянный океан и добраться до Островов Пряностей — а затем вернуться домой, обогнув #TOOLTIP:LOCATION,good_hope_cape,X #L мыс Доброй Надежды#!#!. Ни одному мореплавателю ещё не удавалось совершить подобное. Никто не знает, возможно ли это вообще."
 circumnavigation_expedition_historical_info: "В сентябре 1519 года Фернан Магеллан покинул Санлукар-де-Баррамеду, чтобы отыскать западный путь к Островам Пряностей для испанской короны. В состав экспедиции входили пять кораблей: #italic Тринидад#!, #italic Сан-Антонио#!, #italic Консепсьон#!, #italic Виктория#! и #italic Сантьяго#!. Магеллан был португальским мореплавателем, он плавал в Индию и на Молуккские острова, но перешёл на службу к испанской короне после того, как король Мануэл I отказался увеличить ему жалование. Эта экспедиция вошла в историю как первое кругосветное путешествие, хотя самому Магеллану не суждено было вернуться домой."
 circumnavigation_expedition_outcome_overview: "$BULLET$Быть первой страной в мире, обогнувшей земной шар, даёт:\n$BULLET_WITH_TAB$#G +100#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$Постоянный [ShowModifier('first_circumnavigation')] [modifier|e].\n$BULLET$Любое завершение также даёт:\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET_WITH_TAB$Ещё #G +10#! за возвращение домой не менее трёх кораблей.\n$BULLET_WITH_TAB$#G +5#! за хороший боевой дух команды.\n$BULLET_WITH_TAB$Товар «[ShowGoodsName('cloves')]», собранный в области [ShowAreaName('moluccas_area')], продаётся по рыночной цене за [gold|e]."
 circumnavigation_expedition_low_morale_prestige_tt: "Низкий боевой дух команды снижает полученный престиж"
 circumnavigation_expedition_high_morale_prestige_tt: "Высокий боевой дух команды повышает полученный престиж"
 morale: "Боевой дух команды"
 morale_desc: "Настрой моряков. Низкий боевой дух может привести к бунту."
 provisions: "Припасы"
 provisions_desc: "Еда и вода, запасённые для путешествия. Постепенно убывают в пути, и если закончатся, под угрозой окажется всё предприятие."
 num_ships: "Корабли"
 num_ships_desc: "Корабли в составе флотилии. Если не останется ни одного, экспедиция пропадёт без вести."
 cargo: "Груз"
 cargo_desc: "Ценности, добытые за время путешествия, которые будут проданы на рынке по возвращении флотилии."
 cape_route_to_india_expedition: "Путь в Индию через Мыс Доброй Надежды"
 cape_route_to_india_expedition_desc: "Отправьте флот на юг вдоль берега Африки, обогните великий Южный мыс и проложите морской путь к Островам Пряностей в обход османских поборов и венецианских посредников. Плавание предстоит суровое — два года в открытом океане, неизведанные берега и жестокие штормы. Но зато держава, которая первой откроет этот маршрут, получит власть над мировой торговлей пряностями."
 cape_route_to_india_expedition_historical_info: "Португальская экспедиция по поиску морского пути в Индию стала результатом почти ста лет постепенного продвижения на юг вдоль африканского побережья. В 1488 году Бартоломеу Диаш обогнул мыс Доброй Надежды, доказав, что путь в Индию возможен. Плавание Васко да Гамы в 1497–1499 годах завершило начатое — его корабли вернулись домой с грузом перца и пряностей, стоимость экспедиции окупилась в шестьдесят раз. Это путешествие коренным образом изменило мировую торговлю пряностями, положив конец венецианско-османской монополии на сухопутные торговые пути."
 cape_route_to_india_expedition_outcome_overview: "$BULLET$На каждой остановке вдоль африканского побережья можно основать [ShowBuildingTypeName('por_feitoria')], а на незанятой гавани — [ShowBuildingTypeName('por_trading_post')] и получить полное владение [location|e], причём каждая приносит собственный длительный торговый [modifier|e].\n$BULLET$Достижение города [ShowLocationName('kozhikode')] даёт [ShowModifier('calicut_trade_rights')] и партию товара «[ShowGoodsName('pepper')]», который продаётся по рыночной цене за [gold|e].\n$BULLET$Завершение маршрута затем даёт:\n$BULLET_WITH_TAB$#G +20#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$Постоянный [ShowModifier('cape_route_pioneer')] [modifier], либо вместо него [ShowModifier('portuguese_african_network')] или [ShowModifier('east_africa_trade_dominance')], если основано три или пять фейторий."
 cape_route_to_india_expedition_low_morale_prestige_tt: "Низкий боевой дух команды снижает полученный престиж"
 cape_route_to_india_expedition_high_morale_prestige_tt: "Высокий боевой дух команды повышает полученный престиж"
 grand_tour_expedition: "Марморина"
 grand_tour_expedition_desc: "Наследника престола ждёт продолжительное путешествие по великим городам #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Он посетит #TOOLTIP:LOCATION,florence,X #L Флоренцию#!#!, #TOOLTIP:LOCATION,rome,X #L Рим#!#!, #TOOLTIP:LOCATION,venice,X #L Венецию#!#! и #TOOLTIP:LOCATION,naples,X #L Неаполь#!#!, чтобы постигать науки у самых истоков #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#!. Домой он вернётся переменившимся человеком — характер будущего правителя будет формироваться под влиянием итальянских наставников и обретённых знаний."
 grand_tour_expedition_historical_info: "Большое путешествие — возникшая в XV–XVI веках традиция в образовательных целях отправлять знатную европейскую молодёжь в продолжительную поездку по Италии. К XVII столетию этот обычай стал обязательной частью воспитания в аристократических кругах Северной Европы. Классический маршрут пролегал через Флоренцию, Рим, Венецию и Неаполь. Эти города мог дать молодым людям то, чего так не хватало на севере: гуманистические науки, наследие античности, искусство Ренессанса и придворный церемониал старейших королевских дворов Европы. Считалось, что будущий правитель вернётся из Италии изменившимся человеком, обученным искусству дипломатии и науке управлять государством."
 grand_tour_expedition_outcome_overview: "$BULLET$Каждый посещённый город приносит знания, связи или опыт — в зависимости от выбора — и даёт [research_progress|e] за время, проведённое за учёбой, либо [legitimacy|e] за время, проведённое при дворе.\n$BULLET$Если удаётся посетить не менее трёх из великих городов [ShowRegionNameWithNoTooltip('italy_region')], путешествие дополнительно приносит:\n$BULLET_WITH_TAB$Либо [ShowTraitName('free_thinker')], либо [ShowTraitName('well_connected')], либо [ShowTraitName('worldly')] — в зависимости от того, что оказалось наивысшим.\n$BULLET_WITH_TAB$Постоянный [ShowModifier('returned_from_grand_tour')] [modifier|e].\n$BULLET_WITH_TAB$#G +10#! [prestige|e].\n$BULLET$Более короткое путешествие приносит лишь #G +5#! [prestige] и не даёт [trait|e]."
 gt_diligence: "Усердие"
 gt_diligence_desc: "Склонность наследника к обучению во время поездки, определяемая его [Concept('ability', 'навыками')|e] на момент отбытия. Чем усерднее наследник, тем больше пользы он извлечёт из уроков этого путешествия."
 knowledge: "Познания"
 knowledge_desc: "Теоретические знания, полученные в пути: в библиотеках, на лекциях и в беседах с учёными. Если к концу поездки познания наследника превзойдут все остальные параметры, он обретёт [ShowTraitName('free_thinker')|l]."
 connections: "Связи"
 connections_desc: "Знакомства, заведённые при дворах, которые посетил наследник. Если к концу поездки связи станут его главным приобретением, он получит [ShowTraitName('well_connected')|l]."
 experience: "Опыт"
 experience_desc: "Практические навыки, приобретённые в пути: в мастерских, портах и купеческих конторах. Если к концу поездки практический опыт превысит все прочие параметры, наследник вернётся домой #TOOLTIP:TRAIT,$DESC_KEY$,X #L опытным#!#!."
 grand_tour_cooldown: "Марморина"
 grand_embassy_expedition: "Великое посольство"
 grand_embassy_expedition_desc: "Правитель отправляется в путешествие по дворам Западной Европы под чужим именем, чтобы изучить государственные институты, армию и флот уже прошедших через модернизацию стран. Делегацию, прибывшую с королевским размахом, ждут лишь пиры да пустая вежливость. А вот те, кто ведёт себя скромно, смогут проникнуть прямо на верфи и в чертёжные мастерские. Впрочем, слухи распространяются быстро, и если правителя разоблачат слишком рано, многие двери перед ним закроются."
 grand_embassy_expedition_outcome_overview: "$BULLET$Насколько скрытно путешествует посольство, решает, как долго его истинная цель останется тайной для очередного двора, и как этот двор отреагирует, когда всё раскроется.\n$BULLET$Каждый посещённый двор даёт определённое число Возможностей для обучения, а случайные встречи в пути могут развить способности правителя, углубить Модернизацию или подорвать Скрытность.\n$BULLET$По завершении посольства накопленная Модернизация ускоряет развитие [institutions|e] во всех наших владениях, причём в столице — сильнее всего, повышает [army_tradition|e], а если когда-либо был посещён порт — ещё и [navy_tradition|e].\n$BULLET$Двор, отказавший посольству, обходится нам в [prestige|e]; тот же, что даёт доступ или сам просит расширить его, вознаграждает нас [prestige|e] и новыми Возможностями."
 grand_embassy_expedition_institution_spread_tt: "Увеличивает прогресс выбранного института на [GetVariable('grand_embassy_institution_progress_amount')|V0] ед. во всех наших районах, где он ещё не принят, и на [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] — в столице"
 grand_embassy_expedition_stalled_status: "Изучение"
 discretion: "Скрытность"
 discretion_desc: "Показывает, насколько хорошо правителю удаётся скрывать истинную цель поездки и свою личность. Пока показатель выше 90, при дворе делегацию принимают за обычных послов и ни о чём не подозревают. Когда он опускается до 90 или ниже, принимающая сторона понимает, кто на самом деле к ним прибыл — из простого подозрения или благодаря своей шпионской сети."
 modernization: "Модернизация"
 modernization_desc: "Усвоенные делегацией западные порядки и технологии. Каждая усвоенный урок увеличивает этот показатель, и чем больше знаний правитель привезёт домой, тем щедрее будет награда по завершении посольства."
 opportunities: "Возможности"
 opportunities_desc: "Показывает, насколько широкий доступ к знаниям делегация получила при конкретном дворе. Показатель рассчитывается заново на каждой остановке и зависит от того, насколько открыто решил держаться правитель."
 pacific_crossing_expedition: "Поиски «торнавьяхе»"
 pacific_crossing_expedition_desc: "Отправьте флот с тихоокеанского побережья Америки на поиски #italic торнавьяхе#! — надёжного обратного маршрута через крупнейший океан на планете. Пассаты охотно несут наши корабли на запад, к берегам Азии, однако все попытки вернуться тем же путём до сих пор заканчивались неудачей. Наши колонии и все богатства Островов Пряностей останутся вне досягаемости, пока мы не найдём дорогу обратно. Держава, которая первой нанесёт на карты дорогу назад, сможет связать Америку с Азией маршрутами галеонов и начать полноценную тихоокеанскую торговлю."
 pacific_crossing_expedition_historical_info: "#italic Торнавьяхе#!, обратное плавание на восток, долгое время оставалось главной проблемой первых тихоокеанских экспедиций. Альваро де Сааведра, отплыв из Новой Испании, в 1528 и 1529 годах дважды был вынужден отступить перед пассатами и в итоге погиб в попытках найти путь обратно. В 1542 году Руи Лопес де Вильялобос, добравшись до Азии, также не сумел найти дорогу домой. Пригодный маршрут был найден лишь в 1565 году. До тех пор флоты могли доплыть до Азии, но не имели возможности доставить свой груз назад."
 pacific_crossing_expedition_outcome_overview: "$BULLET$Прокладка обратного пути через [ShowContinentName('pacific_ocean_continent')] даёт:\n$BULLET_WITH_TAB$#G +100#! [prestige|e].\n$BULLET_WITH_TAB$#G +15#! [legitimacy|e].\n$BULLET_WITH_TAB$Постоянный торговый путь [modifier|e].\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], собранные в [ShowAreaName('moluccas_area')], проданные по рыночной цене за [gold|e].\n$BULLET_WITH_TAB$Постоянный доступ к [ShowDecisionName('charter_manila_galleon')] [decision|e], которое можно принимать заново каждые пять лет ради значительного возврата в [gold].\n$BULLET$Флот, так и не нашедший дорогу домой, не получает ничего."
 pacific_crossing_expedition_low_morale_prestige_tt: "Низкий боевой дух команды снижает полученный престиж"
 pacific_crossing_expedition_high_morale_prestige_tt: "Высокий боевой дух команды повышает полученный престиж"
 cartographic_survey_expedition: "Исследование побережья"
 cartographic_survey_expedition_desc: "Отправьте корабль для подробного изучения наших собственных берегов. Исследователи нанесут на карту удобные гавани, измерят глубину отмелей и отметят опасные места. Работа не самая престижная, но созданные ими карты прослужат целому поколению мореплавателей, ускорив и удешевив снаряжение всех последующих экспедиций."
 cartographic_survey_expedition_historical_info: "Систематическое исследование побережий получило широкое развитие в XVI веке — объёмы морской торговли стремительно росли, и точность карт превратилась в вопрос государственной важности. #italic Каса-де-Контратасьон#! в Севилье и португальский #italic Арсенал Гвинеи и Индии#! содержали целый штат официальных картографов, в обязанности которых входило составление и постоянное обновление морских карт. В XVII веке их примеру последовали нидерландские адмиралтейства."
 cartographic_survey_expedition_outcome_overview: "$BULLET$Каждый обследованный [port|e] может оставить долговременный [location_modifier|e] сроком на 10–20 лет, повышающий добычу одного из нескольких товаров, таких как [ShowGoodsName('fish')], [ShowGoodsName('pearls')] или [ShowGoodsName('amber')], либо улучшающий сам порт, а вдобавок приносит [prestige|e].\n$BULLET$Обследование трёх или более портов также даёт:\n$BULLET_WITH_TAB$15-летний [ShowModifier('accurate_charts')] [modifier|e].\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET$При меньшем числе обследований — лишь #G +5#! [prestige]."
 cartographic_survey_cooldown: "Исследование побережья"
 mining_survey_expedition: "Исследование высокогорья"
 mining_survey_expedition_desc: "Отправить группу рудоискателей и пробирщиков в наши высокогорные районы, чтобы исследовать русла рек, найти обнажённую породу и проверить её на наличие драгоценных металлов. В холмах нередко залегают большие богатства, и чтобы их извлечь, нам стоит полагаться на знания и наработки опытных шахтёров, а не на домыслы придворных вельмож."
 mining_survey_expedition_historical_info: "В Средние века и в раннее Новое время в Европе активно проводилась разведка рудных залежей. Наиболее широко эта деятельность велась в Рудных горах Саксонии и Богемии, где открытие залежей серебра в XII веке привело к бурному росту таких городов, как Фрайберг, Яхимов и Шнеберг. В 1556 году было издано сочинение Георга Агриколы #italic «О горном деле и металлургии»#!, где были подробно описаны методы лозоходства и опробования руды, а также приведены правовые обычаи касательно притязаний на рудоносные участки. Этот труд почти 200 лет служил одним из основных руководств по добыче и обработке металлов."
 mining_survey_expedition_outcome_overview: "$BULLET$После каждой разведки остаётся 20-летний [ShowModifier('thorough_survey')] [modifier|e], повышающий выпуск сырья по всей стране.\n$BULLET$Каждая находка также оставляет после себя богатую залежь, такую как [ShowModifier('rich_silver_vein')] или [ShowModifier('rich_gold_strike')], и может разрабатываться открыто ради [prestige|e] или тайно ради [gold|e].\n$BULLET$Это также даёт:\n$BULLET_WITH_TAB$#G +10#! [prestige] за две или более находки.\n$BULLET_WITH_TAB$#G +5#! за разведку любого нагорья."
 mining_survey_cooldown: "Исследование высокогорья"
 relic_expedition: "Охота за реликвией"
 relic_expedition_desc: "Отправиться в путешествие в [ShowLocationName('jerusalem')], а оттуда — далее по Святой земле и всему #TOOLTIP:REGION,crescent_region,X #L Плодородному полумесяцу#!#!, где ходят слухи о древней святыне. Заполучить её сможет лишь тот, кому хватит терпения и удачи."
 relic_expedition_historical_info: "Торговля реликвиями в Средневековье и Раннее Новое время была крайне прибыльным делом. Католические и православные общины соперничали за самые почитаемые святыни. Реликвии веками перемещались по всему христианскому миру в результате торговли, обмена или краж. Особенно уязвимы были святыни государств крестоносцев: Животворящий Крест, захваченный при Хаттине в 1187 году, так и не удалось вернуть, а Копьё Лонгина, найденное в Антиохии в 1098 году, исчезло из хроник вскоре после первого крестового похода. Обе эти утраты вылились в вековые слухи о том, где их можно найти."
 relic_expedition_outcome_overview: "$BULLET$Какая именно реликвия будет найдена, зависит от случая и от того, как сложатся поиски: это может оказаться сам давно утраченный Истинный Крест или Святое Копьё, либо же более скромная реликвия — гвоздь, кость или фрагмент.\n$BULLET$Что бы ни было найдено, оно становится осязаемым [work_of_art|e], доставленным домой, в нашу столицу."
 clues: "Зацепки"
 clues_desc: "Показывает, насколько экспедиция близка к тому, чтобы напасть на верный след реликвии. Поиски начинаются с единичного слуха, а показатель растёт или падает с каждой проверенной наводкой. Если зацепки иссякнут полностью, экспедиции, скорее всего, придётся вернуться с пустыми руками."
 hunt_retinue: "Свита"
 hunt_retinue_desc: "Охрана, переводчик и учёный атташе экспедиции. Численность свиты не уменьшается сама по себе, но если в отряде никого не останется, путешествие и поиски закончатся ничем."
