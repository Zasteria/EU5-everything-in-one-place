 cartographic_survey_cooldown: "Съёмка побережья"
 cartographic_survey_expedition: "Съёмка побережья"
 cartographic_survey_expedition_desc: "Отправить судно для съёмки вдоль собственного побережья, чтобы нанести на карту гавани, промерить отмели и отметить опасные места. Работа неблагодарная, но составленные карты прослужат целое поколение, а каждая будущая экспедиция благодаря им станет дешевле и быстрее в снаряжении."
 cartographic_survey_expedition_historical_info: "Систематическая съёмка побережья по-настоящему началась в шестнадцатом веке, когда рост морской торговли сделал точные карты делом государственной важности. И #italic Каса-де-Контратасьон #! в Севилье, и португальский #italic Армазен-да-Гине-и-Индия #! содержали официальных картографов, чьей задачей было составление и обновление морских карт, а в семнадцатом веке их примеру последовали голландские адмиралтейства."
 circumnavigation_expedition_high_morale_prestige_tt: "Высокий боевой дух экипажа повышает получаемый престиж"
 circumnavigation_expedition_low_morale_prestige_tt: "Низкий боевой дух экипажа снижает получаемый престиж"
 clues: "Улики"
 clues_desc: "Насколько близко экспедиция подошла к тому, чтобы наверняка напасть на след реликвии. Начинается с одного-единственного слуха и растёт или убывает с каждой проверенной зацепкой. Если улики иссякнут полностью, поиски могут быть прекращены."
 completed_expedition_name_text_filter_desc: "Отфильтровать завершённые [expeditions|e] по названию."
 completed_expedition_name_text_filter_name: "Поиск по названию экспедиции"
 connections: "Связи"
 connections_desc: "Отношения, установленные при дворах, посещённых во время путешествия. Наследник, который завершает путешествие с бóльшим количеством связей, чем чего-либо ещё, возвращается [ShowTraitName('well_connected')]."
 custom_search_filter_expedition_category_name: "Тип экспедиции"
 discretion: "Скрытность"
 discretion_desc: "Насколько хорошо истинная цель делегации и личность правителя скрыты от посторонних глаз. Выше 90 двор принимает делегацию за обычных посланников, и никто ничего не подозревает. При 90 или ниже хозяин уже выяснил, кто на самом деле путешествует среди них — будь то из простого подозрения или благодаря собственной сети шпионов."
 expedition_name_text_filter_desc: "Отфильтровать [expeditions|e] по названию."
 expedition_name_text_filter_name: "Поиск по названию экспедиции"
 experience_desc: "Практический, непосредственный опыт, полученный во время путешествия — мастерские, гавани и конторы. Наследник, который завершает путешествие с бóльшим количеством опыта, чем чего-либо ещё, возвращается [ShowTraitName('worldly')]."
 grand_embassy_expedition: "Великое посольство"
 grand_embassy_expedition_desc: "Отправить правителя по дворам Западной Европы под чужим именем, чтобы изучить учреждения, армию и флот государств, уже прошедших модернизацию. Делегация, представленная как царственная особа, получает пиры и пустые почести; та же, что держится в тени, попадает в настоящие верфи и чертёжные мастерские. Однако слухи расходятся быстро, и правитель, узнанный слишком рано, застаёт двери уже закрытыми."
 grand_embassy_expedition_institution_spread_tt: "Продвигает выбранный институт на [GetVariable('grand_embassy_institution_progress_amount')|V0] во всех владениях, где его нет, и на [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] в столице"
 grand_embassy_expedition_stalled_status: "Изучение"
 grand_tour_expedition_desc: "Наш наследник отправится в долгое путешествие по великим городам региона [ShowRegionName('italy_region')] — [ShowLocationName('florence')], [ShowLocationName('rome')], [ShowLocationName('venice')] и [ShowLocationName('naples')] — чтобы учиться у истоков [ShowInstitutionName('renaissance')]. Вернувшийся наследник — уже не тот человек, что покинул нас. Всё, что он узнает, и от кого, сформирует характер, с которым он взойдёт на трон."
 grand_tour_expedition_historical_info: "Гран-тур — обычай отправлять молодых европейских аристократов в долгое образовательное путешествие по Италии — постепенно сложился в пятнадцатом-шестнадцатом веках и к семнадцатому веку стал устоявшимся институтом среди северноевропейской знати. Флоренция, Рим, Венеция и Неаполь составляли классический маршрут, каждый город предлагал то, чего недоставало северным дворам: гуманистическую учёность, классическую древность, искусство ренессансного покровительства и церемониал древнейших королевских дворов Европы. От участников ожидали, что они вернутся преображёнными, готовыми к государственным делам и дипломатии так, как этого не могли дать домашние наставники."
 gt_diligence: "Усердие"
 gt_diligence_desc: "Способность наследника извлекать пользу из путешествия, определяемая его показателями [ability|e] на момент отбытия. Более усердный наследник получает больше от того, чему учит странствие."
 guards: "Охранный конвой"
 guards_desc: "Вооружённая охрана каравана. Растёт при найме стражи или ношении #italic махмаля #! по дороге, но убывает от набегов и тягот пути. Хорошо охраняемый караван с большей вероятностью переживёт нападение."
 hajj_caravan_cooldown: "Королевский хадж"
 hajj_caravan_expedition: "Королевский хадж"
 hajj_caravan_expedition_desc: "Отправить нашего правителя в паломничество в [ShowLocationName('mecca')], исполняя один из пяти столпов ислама. Путь долог, а поездка дорога, но правитель, вернувшийся из священного города, обретает авторитет, которого не даст никакая армия."
 hajj_caravan_expedition_historical_info: "Аббасидский халиф Харун ар-Рашид совершал паломничество из Багдада девять раз за время своего правления (786–809), даже проходя часть пути пешком в знак благочестия, и его преданность стала образцом, которому набожные правители стремились подражать многие века после него."
 holy_site_pilgrimage_cooldown: "Паломничество к святыне"
 holy_site_pilgrimage_expedition: "Паломничество к святыне"
 holy_site_pilgrimage_expedition_desc: "Наш правитель отправляется к одной избранной святыне — чтобы помолиться, чтобы его видели молящимся, и чтобы вернуться с престижем и религиозной валютой, которые приносит это путешествие. Запускается через действие паломничества, а не через список экспедиций."
 holy_site_pilgrimage_expedition_order_zeal_tt: "На долгие годы вперёд благочестие паломников в этом владении будет разжигать рвение ордена, который его удерживает"
 hunt_retinue: "Свита"
 hunt_retinue_desc: "Охрана экспедиции, переводчик и учёный сопровождающий. Сама по себе не убывает, но если истощится полностью, экспедиция распадётся, и поиски окончатся неудачей."
 knowledge: "Знания"
 knowledge_desc: "Знания, полученные благодаря теоретическим занятиям во время путешествия — библиотекам, лекциям и обществу учёных. Наследник, завершивший путешествие с преобладанием знаний над прочим, возвращается [ShowTraitName('free_thinker')]."
 mining_survey_cooldown: "Разведка нагорья"
 mining_survey_expedition: "Разведка нагорья"
 mining_survey_expedition_desc: "Отправить группу рудознатцев и пробирщиков в наши нагорные земли, чтобы они прошли по руслам ручьёв, обстучали молотком выходы пород и проверили камни на наличие драгоценных металлов. Эти горы уже не раз отдавали свои богатства, и добытое ценой немалых трудов знание старого рудокопа стоит года придворных пересудов."
 mining_survey_expedition_historical_info: "Систематическая разведка недр практиковалась по всей средневековой и ранней Новой Европе, наиболее известно — в Рудных горах Саксонии и Богемии, где открытие серебряных жил в двенадцатом веке породило такие города-однодневки, как Фрайберг, Яхимов и Шнееберг. #italic О горном деле#! Георгия Агриколы (1556) стало основным учебником этого ремесла, подробно описывая использование лозоискательных прутьев, пробирный анализ образцов руды в небольших тиглях и правовые обычаи, регулирующие заявку прав на месторождения."
 modernization_desc: "Накопленный делегацией прогресс в освоении западных методов. Каждый усвоенный урок добавляется к нему, и чем больше его правитель привозит домой, тем больше награда по завершении посольства."
 morale: "Боевой дух экипажа"
 morale_desc: "Настрой экипажа. Низкий боевой дух грозит мятежом."
 num_ships_desc: "Корабли, ещё остающиеся во флоте. Если не останется ни одного, экспедиция погибнет."
 opportunities: "Возможности"
 opportunities_desc: "Сколько доступа делегации было предоставлено для обучения при данном конкретном дворе. Устанавливается заново на каждой остановке, в зависимости от того, насколько открыто правитель решил там представиться."
 pacific_crossing_expedition: "Поиск торнавиахе"
 pacific_crossing_expedition_desc: "Отправить флот с нашего тихоокеанского побережья в Америке на поиски #italic торнавиахе#! — надёжного обратного пути через величайший океан на земле. Пассаты легко несут корабль на запад, в Азию; плыть домой против них не удавалось никому, и пока обратный путь не проложен, наши колонии и богатства Островов Специй остаются недостижимы. Первая нация, что найдёт путь домой, свяжет Америку с Азией и откроет галеонную торговлю через Тихий океан."
 pacific_crossing_expedition_high_morale_prestige_tt: "Высокий боевой дух команды увеличивает получаемый престиж"
 pacific_crossing_expedition_historical_info: "Возвращение на восток — #italic торнавиахе#! — было великой неразрешённой задачей раннего периода освоения Тихого океана. Альваро де Сааведра, отплывший из Новой Испании, был дважды отброшен пассатами в 1528 и 1529 годах и погиб при этой попытке; экспедиция Руя Лопеса де Вильялобоса в 1542 году также достигла Азии, но не смогла найти путь домой. Лишь в 1565 году был открыт надёжный обратный маршрут, а до этого флот мог добраться до Азии, но никогда не мог привезти обратно свой груз."
 pacific_crossing_expedition_low_morale_prestige_tt: "Низкий боевой дух команды уменьшает получаемый престиж"
 piety_desc: "Насколько благочестиво проходит паломничество. Постепенно убывает во время пути и расходуется на мирские решения по дороге. Если оно иссякнет полностью, паломничество обернётся позором; если же оставаться в высоком благочестии, это усилит итоговые награды паломничества."
 provisions: "Провизия"
 provisions_desc: "Еда и вода на время пути. Постепенно расходуется в дороге, а её нехватка ставит под угрозу всю команду."
 relic_expedition_cooldown: "Поиски реликвии"
 retinue: "свита"
 retinue_desc: "Сопровождение правителя-паломника. Само по себе не убывает — лишь из-за несчастий в пути. Если она будет утрачена полностью, правитель окажется в смертельной опасности, и паломничество провалится."
 splendor_desc: "Насколько щедро снаряжён и украшен караван. Растёт от расточительных трат и демонстрации богатства, но снижается от бурь и тягот пути. Определяет награду каравана по прибытии в [ShowLocationNameWithNoTooltip('mecca')]."
 treasure_fleet_cooldown: "Флот с сокровищами"
 treasure_fleet_expedition: "Сокровищный флот"
 treasure_fleet_expedition_desc: "Отправить императорский сокровищный флот в государственное плавание к избранному региону. Флот следует вдоль прибрежных морских путей к месту назначения и обратно, заходя по пути в иностранные порты. Плавание расширяет дипломатическое влияние двора, раздаёт дары и [ShowGoodsName('silk')] правителям южных морей, собирает дань и возвращается с редкими товарами, послами и именами царей, узнавших звук китайского паруса."
 western_ocean_voyage_cooldown: "Плавание в Западный океан"
 western_ocean_voyage_expedition: "Плавание в Западный океан"
 western_ocean_voyage_expedition_desc: "Отправить флот на запад через открытую Атлантику в поисках морского пути в Индию. Ни одна карта не подскажет, что лежит за [ShowAreaName('canary_islands_area')] — лишь ветер, вода и надежда, что океан уже, чем полагают учёные."
 western_ocean_voyage_expedition_historical_info: "Идея достичь Азии, плывя на запад, обсуждалась европейскими учёными десятилетиями, прежде чем было предпринято первое такое плавание. Главным препятствием была не форма земли, которую образованные люди считали шарообразной, а её размер. Большинство учёных верно полагали, что океан слишком широк, чтобы его пересечь. Экспедиции, доказавшие их неправоту, сделали это не опровергнув расчёты, а обнаружив на пути нечто неожиданное."
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Arriving at the chosen [holy_site|e] grants a reward depending on our [religion|e]:\n$BULLET_WITH_TAB$#G +10#! [religious_influence|e], [purity|e], or [karma|e], scaling with the distance from our capital to as much as #G +100#!.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')] religions instead shift [yanantin|e] by #Y 20#! toward the nature of the [holy_site]'s [god|e].\n$BULLET_WITH_TAB$Eligible [ShowReligionGroupAdjective('muslim')] schools shift #Y 10#! further toward [ShowSocietyDirectionName('mysticism')] or [ShowSocietyDirectionName('jurisprudence')]."
 treasure_fleet_expedition_outcome_overview: "$BULLET$The fleet sails with a cargo of gifts paid from our treasury.\n$BULLET$On a safe return, whatever is left unspent becomes [gold|e], plus #G +10#! [prestige|e].\n$BULLET$Each foreign court also responds differently:\n$BULLET_WITH_TAB$A court that receives us well grants a further #G +5#! [prestige], may join the [GetUniqueInternationalOrganization('middle_kingdom').GetName] as our tributary, and sends tribute and rare gifts that enrich our [market|e].\n$BULLET_WITH_TAB$A court that refuses tributary status instead costs #R -50#! [opinion|e] between us and gets [ShowModifier('chi_resisting_subjugation')]."
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$The voyage charts the open ocean as it sails, revealing the coasts it reaches.\n$BULLET$Making landfall then grants:\n$BULLET_WITH_TAB$#G +10#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$A further #G +20#! [prestige] for discovering the Americas, opening the New World to future colonization."
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$#G +20#! [religious_influence|e].\n"
 hajj_caravan_expedition_outcome_overview: "$BULLET$Reaching [ShowLocationNameWithNoTooltip('mecca')] rewards the caravan's splendor there, up to:\n$BULLET_WITH_TAB$#G +20#! [prestige|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Returning home then grants:\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$The 5-year [ShowModifier('hajj_pious_return')] [modifier|e].\n$BULLET_WITH_TAB$The permanent [ShowModifier('hajji_pilgrim')] honor, for a [ruler|e]'s first Ḥajj.\n$BULLET$The caravan must reach [ShowLocationNameWithNoTooltip('mecca')] within the same year it departed, or the pilgrimage is lost entirely."
 cape_route_to_india_expedition_outcome_overview: "$BULLET$Each stop along the African coast can found a [ShowBuildingTypeName('por_feitoria')] or, on an unclaimed harbor, a [ShowBuildingTypeName('por_trading_post')] and outright possession of the [location|e], each with its own lasting trade [modifier|e].\n$BULLET$Reaching [ShowLocationName('kozhikode')] grants [ShowModifier('calicut_trade_rights')] and a hold of [ShowGoodsName('pepper')] sold at market price for [gold|e].\n$BULLET$Completing the route then grants:\n$BULLET_WITH_TAB$#G +20#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$The permanent [ShowModifier('cape_route_pioneer')] [modifier], or [ShowModifier('portuguese_african_network')] or [ShowModifier('east_africa_trade_dominance')] instead, with three or five feitorias established."
 grand_tour_expedition_outcome_overview: "$BULLET$Every city visited builds up knowledge, connections, or experience depending on the choice made, and grants [research_progress|e] for time spent studying or [legitimacy|e] for time spent at court.\n$BULLET$Reaching at least three of the great cities of [ShowRegionNameWithNoTooltip('italy_region')] then grants:\n$BULLET_WITH_TAB$Either [ShowTraitName('free_thinker')], [ShowTraitName('well_connected')], or [ShowTraitName('worldly')], depending on whichever ended up highest.\n$BULLET_WITH_TAB$The permanent [ShowModifier('returned_from_grand_tour')] [modifier|e].\n$BULLET_WITH_TAB$#G +10#! [prestige|e].\n$BULLET$A shorter tour earns only #G +5#! [prestige] and no [trait|e]."
 grand_embassy_expedition_outcome_overview: "$BULLET$How discreetly the delegation travels decides how long its true purpose stays hidden from each host, and how the court reacts once it is found out.\n$BULLET$Every court visited grants a number of Opportunities to learn from it, and chance encounters along the way can grow the ruler's own abilities, deepen Modernization, or wear away at Discretion.\n$BULLET$Once the embassy concludes, its accumulated Modernization boosts [institutions|e] progress across every location we own, our capital more than the rest, [army_tradition|e], and, if a port was ever visited, [navy_tradition|e].\n$BULLET$A court that turns the delegation away costs [prestige|e]; one that grants access, or is begged for more of it, rewards [prestige|e] and further Opportunities."
 pacific_crossing_expedition_outcome_overview: "$BULLET$Charting the return route across the [ShowContinentName('pacific_ocean_continent')] grants:\n$BULLET_WITH_TAB$#G +100#! [prestige|e].\n$BULLET_WITH_TAB$#G +15#! [legitimacy|e].\n$BULLET_WITH_TAB$A lasting trade route [modifier|e].\n$BULLET_WITH_TAB$The [ShowGoodsName('cloves')] gathered in the [ShowAreaName('moluccas_area')], sold at market price for [gold|e].\n$BULLET_WITH_TAB$Permanent access to the [ShowDecisionName('charter_manila_galleon')] [decision|e], which can be taken again every five years for a substantial [gold] return.\n$BULLET$A fleet that never finds the way home earns nothing at all."
 cartographic_survey_expedition_outcome_overview: "$BULLET$Each [port|e] surveyed can leave behind a lasting [location_modifier|e] for 10 to 20 years, raising its output of one of several goods, such as [ShowGoodsName('fish')], [ShowGoodsName('pearls')], or [ShowGoodsName('amber')], or improving the harbor itself, and earns [prestige|e] besides.\n$BULLET$Surveying three or more ports then also grants:\n$BULLET_WITH_TAB$The 15-year [ShowModifier('accurate_charts')] [modifier|e].\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET$Surveying fewer earns only #G +5#! [prestige]."
 mining_survey_expedition_outcome_overview: "$BULLET$Every survey leaves behind the 20-year [ShowModifier('thorough_survey')] [modifier|e], raising raw material output across the country.\n$BULLET$Each strike made also leaves a rich deposit behind, such as the [ShowModifier('rich_silver_vein')] or [ShowModifier('rich_gold_strike')], and can be worked openly for [prestige|e] or quietly for [gold|e].\n$BULLET$This also grants:\n$BULLET_WITH_TAB$#G +10#! [prestige] for two or more strikes.\n$BULLET_WITH_TAB$#G +5#! for any highland surveyed."
