 expedition_category_commercial: "Торговая"
 expedition_category_military: "Military"
 expedition_category_religious: "Религиозная"
 expedition_category_diplomatic: "Дипломатия"
 bermuda_test_expedition: "Экспедиция на Бермудские острова"
 bermuda_test_expedition_desc: "Отравить атлантическую экспедицию на поиск Бермудских островов."
 pilgrimage_expedition: "Великое паломничество"
 pilgrimage_expedition_desc: "Наш правитель отправится в паломничество к святым местам #TOOLTIP:RELIGION,$catholic_tt$,X $tt_op_L$католической$tt_cl_2$ веры, отплыв с берегов #TOOLTIP:REGION,great_britain_region,X $tt_op_L$Британии$tt_cl_2$ к Гробу Господню в #TOOLTIP:LOCATION,jerusalem,X $tt_op_L$Иерусалиме$tt_cl_2$."
 pilgrimage_expedition_historical_info: "Паломники-христиане начали отправляться в Иерусалим с IV века, когда император Константин поручил построить церковь Гроба Господня на месте погребения и воскресения Христа. Во время крестовых походов город неоднократно переходил из рук в руки. В 1099 году его захватили участники Первого крестового похода. В 1187 году он стал добычей Саладина. В 1229 году, при Фридрихе II, Иерусалим ненадолго вернулся под контроль христиан, после чего окончательно перешёл под власть мамлюков. Несмотря на утрату христианского господства, святые места остаются доступными для паломников благодаря дипломатическим договоренностям. Так Иерусалим стал главным центром католического паломничества во всём средневековом мире."
 pilgrimage_expedition_outcome_overview: "$BULLET$Каждая [Concept('holy_site', 'святыня')|e], которую посещает наш [Concept('ruler', 'правитель')|e], предлагает по прибытию собственную награду: [Concept('legitimacy', 'легитимность')|e], [Concept('prestige', 'престиж')|e] или признательность сословия священников.\n$BULLET$Завершение паломничества предоставляет за каждое посещенное святое место:\n$BULLET_WITH_TAB$#G +5#! [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$[Concept('estate_satisfaction', 'Довольство сословия')|e] #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L священников#!#!.\n$BULLET_WITH_TAB$Улучшенное [Concept('opinion', 'мнение')|e] о державе [GetCountry('PAP').GetName]."
 holy_site_pilgrimage: "Паломничество к святому месту"
 holy_site_pilgrimage_desc: "Наш [Concept('ruler', 'правитель')|e] отправляется в паломничество к выбранной [Concept('holy_site', 'святыне')|e], чтобы помолиться, в том числе при свидетелях, и вернуться из путешествия с престижем и репутацией набожного человека. Исходной точкой служит само паломничество, а не план экспедиции."
 holy_site_pilgrimage_outcome_overview: "$BULLET$Прибытие к выбранной [Concept('holy_site', 'святыне')|e] дарует награду, зависящую от нашей [Concept('religion', 'религии')|e]:\n$BULLET_WITH_TAB$#G От +10 единиц#! [Concept('religious_influence', 'религиозного влияния')|e], [Concept('purity', 'чистоты')|e] или [Concept('karma', 'кармы')|e]. Их количество может достигать #G +100#! в зависимости от расстояния до нашей столицы.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]ие регилигии вместо этого меняют свой янантин на #Y 20#! в сторону природы [Concept('god', 'бога')|e], покровительствующего [Concept('holy_site', 'святыне')|e].\n$BULLET_WITH_TAB$Соответствующие #TOOLTIP:RELIGIONGROUP,muslim,X #L Исламские#!#! школы сдвигаются на #Y 10#! единиц к #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L мистицизму#!#! или #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L правовой системе#!#!."
 pining_expedition: "Вояж Пининга"
 pining_expedition_desc: "Отправьте небольшую флотилию из #TOOLTIP:CULTURE,$danish_tt$,X #L датского#!#! порта на север и запад в неизведанные воды Атлантики, заходя в #TOOLTIP:AREA,shetland,X #L Шетландию#!#!, #TOOLTIP:AREA,iceland_area,X #L Исландию#!#!, заброшенные норвежские поселения на побережье #TOOLTIP:AREA,greenland_area,X #L Гренландии#!#! и к лесистому берегу, о котором рассказывают саги. Если капитаны вернутся с доказательством того, что видели этот западный берег, корона получит маршрут через северную Атлантику, которым не обладает ни одна другая страна."
 pining_expedition_historical_info: "Около 1473 года Дидрик Пининг, служивший датской короне капер-немец, получил от Кристиана I приказ возглавить экспедицию на запад через северную часть Атлантического океана. В то время экспедиция официально не документировалась, и то немногое, что о ней известно, взято из более поздних упоминаний в ганзейской переписке и заметках португальского космографа Мартина Бехайма о том, что Пининг и его коллега Ханс Поторст достигли побережья, расположенного далеко к западу от Гренландии. Дания так и не предприняла дальнейших исследований в связи с этой экспедицией. Отсутствие каких-либо упоминаний о ней в официальных источниках многие века подпитывало споры о том, что же на самом деле обнаружили капитаны, если вообще они что-то обнаружили."
 pining_expedition_outcome_overview: "$BULLET$Каждый новый рубеж маршрута обеспечивает дополнительный [Concept('prestige', 'престиж')|e].\n$BULLET$Финальная награда зависит от того, насколько далеко зашла экспедиция:\n$BULLET_WITH_TAB$#G +5#! за достижение одной только #TOOLTIP:AREA,iceland_area,X #L Исландии#!#!.\n$BULLET_WITH_TAB$#G +10#! за достижение #TOOLTIP:AREA,greenland_area,X #L Гренландии#!#!.\n$BULLET_WITH_TAB$#G +20#! за выход к #TOOLTIP:AREA,gaspe,X #L Гаспе#!#!, что также навсегда открывает экспедицию $western_ocean_voyage$ для державы [GetCountry('DAN').GetName]."
 treasure_fleet: "Золотой флот"
 treasure_fleet_desc: "Отправьте императорский золотой флот в плавание в выбранный регион по делам государственным. Флот следует по прибрежным морским путям к месту назначения и обратно, заходя по пути в порты чужих земель. Это плавание расширяет дипломатическое влияние двора, позволяет раздать подарки и шелк правителям южных морей, собрать дань и вернуться с редкими товарами, послами и именами королей, которые познакомились со звуком китайского паруса."
 treasure_fleet_outcome_overview: "$BULLET$Флот отправляется с грузом оплаченных нашей казной даров.\n$BULLET$Если экспедиция вернётся в целости, все оставшиеся дары станут [Concept('gold', 'дукатами')|e], также вы получите #G +10#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET$Каждый иноземный двор также реагирует по-своему:\n$BULLET_WITH_TAB$Двор, где нас встречали по достоинству, даст дополнительные #G +5#! единиц [Concept('prestige', 'престижа')|e]. Такая держава может даже согласиться стать данником #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного государства#!#! и начнёт отправлять дань и редкости, которые обогатят наш [Concept('market', 'рынок')|e].\n$BULLET_WITH_TAB$Если держава откажется от нашего предложения стать данником, она получит статус [ShowModifier('chi_resisting_subjugation')], и наше [Concept('opinion', 'мнение')|e] о ней снизится на #R -50#! единиц."
 danish_india_expedition: "Индийский чартерный флот"
 danish_india_expedition_desc: "Отправьте флот, зафрахтованный Датской Ост-Индской компанией, на юг вдоль побережья Африки, мимо мыса Доброй Надежды и через #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Индийский океан#!#! к богатым землям Индии, чтобы добиться торговой концессии. Путешествие будет долгим, а флот — небольшим, но выгода от всего одной укреплённой торговой фактории в Индии будет соизмеримой с затратами."
 danish_india_expedition_historical_info: "Датская Ост-Индская компания (#italic Dansk Ostindisk Kompagni#!) была основана Кристианом IV в 1616 году. Уже в 1618 году её первая экспедиция под командованием адмирала Ове Гедде вышла из порта Копенгагена. После тяжёлого двухлетнего плавания, в котором большая часть экипажа погибла от цинги и других болезней, экспедиция достигла побережья Коромандела и договорилась с правителем Танджора о торговой концессии в деревне Тарангамбади (позже англицизированной как Транкебар). Укреплённая торговая фактория Дансборг была построена в 1620 году и оставалась датской до 1845 года, когда колонию продали британцам. Таким образом, Транкебар стал одним из самых долгосрочных европейских поселений в Индии."
 danish_india_expedition_outcome_overview: "Возвращение в целости обеспечит #G +10#! единиц [Concept('prestige', 'престижа')|e]. Весь груз #TOOLTIP:GOODS,livestock,X #L скота#!#!, #TOOLTIP:GOODS,salt,X #L соли#!#!, #TOOLTIP:GOODS,goods_gold,X #L золота#!#!, #TOOLTIP:GOODS,ivory,X #L поделочной кости#!#!, #TOOLTIP:GOODS,coffee,X кофе#! и #TOOLTIP:GOODS,pepper,X #L перца#!#!, собранный в ходе экспедиции, будет продан за [Concept('gold', 'дукаты')|e] и доставлен на [Concept('market', 'рынок')|e] нашей столицы. Если двор [ShowLocationName('karaikal')]а даст нам разрешение, у нашей державы появится там #TOOLTIP:BUILDING_TYPE,trade_office,X #L Торговая контора#!#!."
 el_dorado_expedition_outcome_overview: "$BULLET$Процесс поиска Эльдорадо обеспечивает стабильный приток [Concept('prestige', 'престижа')|e].\n$BULLET$Результат зависит от количества найденных следов:\n$BULLET_WITH_TAB$Ничего не найдено: #R -10#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Найден один след или более: #G +10#! единиц [Concept('prestige', 'престижа')|e], [Concept('gold', 'дукаты')|e] и постоянный [Concept('location_modifier', 'модификатор района')|e] «[ShowModifier('el_dorado_discovered')]» на месте города.\n$BULLET_WITH_TAB$Найдено пять следов или более: #G +20#! единиц [Concept('prestige', 'престижа')|e] и ещё больше [Concept('gold', 'дукатов')|e].\n$BULLET$Все богатства, экзотические товары и собранные в ходе поиска артефакты доставляются на наш [Concept('market', 'рынок')|e], и лучшие из них становятся [Concept('work_of_art', 'творениями')|e]."
 fountain_of_youth_expedition_outcome_overview: "$BULLET$Процесс поиска источника обеспечивает стабильный приток [Concept('prestige', 'престижа')|e].\n$BULLET$Результат зависит от количества найденных следов:\n$BULLET_WITH_TAB$Ничего не найдено: #R -5#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Найден один след или более: #G +10#! единиц [Concept('prestige', 'престижа')|e] и постоянный [Concept('location_modifier', 'модификатор района')|e] «[ShowModifier('fountain_of_youth_discovered')]».\n$BULLET_WITH_TAB$Найдено пять следов или более: #G +20#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET$Все воды, найденные в ходе экспедиции, дают модификатор «[ShowModifier('rejuvenating_waters_modifier')]» и продлевают срок жизни наших [Concept('ruler', 'правителя')|e] и [Concept('heir', 'наследника')|e]. Также к нашему двору в качестве нового [Concept('character', 'персонажа')|e] может присоединиться туземец-лекарь."
 city_of_caesars_expedition_outcome_overview: "$BULLET$Процесс поиска обеспечивает стабильный приток [Concept('prestige', 'престижа')|e].\n$BULLET$Результат зависит от количества найденных следов:\n$BULLET_WITH_TAB$Ничего не найдено: #R -5#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Найден один след или более: #G +10#! единиц [Concept('prestige', 'престижа')|e], [Concept('gold', 'дукаты')|e] и постоянный [Concept('location_modifier', 'модификатор района')|e] «[ShowModifier('city_of_caesars_discovered')]» на месте города.\n$BULLET_WITH_TAB$Найдено четыре следа или более: #G +20#! единиц [Concept('prestige', 'престижа')|e] и ещё больше [Concept('gold', 'дукатов')|e].\n$BULLET$Все богатства, собранные в ходе поиска, доставляются на наш [Concept('market', 'рынок')|e], и лучшие артефакты становятся [Concept('work_of_art', 'творениями')|e]."
 western_ocean_voyage: "Вояж в западный океан"
 western_ocean_voyage_desc: "Отправьте флот на запад через открытые воды Атлантического океана в поисках морского пути в Индию. Когда [ShowAreaName(„canary_islands_area“)] останутся позади, наши карты станут бесполезны. С нами останутся только ветер, вода и надежда на то, что океан всё же не так широк, как полагают учёные."
 western_ocean_voyage_historical_info: "Идея достичь Азии, отправившись морем на запад, обсуждалась европейскими учёными на протяжении десятилетий до первой попытки такого путешествия. Главным препятствием была даже не форма Земли, которую образованные люди уже считали шарообразной, а её размер. Большинство учёных верно полагали, что океан слишком широк, и делали из этого вывод о том, что пересечь его невозможно. Доказать их неправоту удалось лишь благодаря неожиданным открытиям, сделанным экспедициями на своём пути."
 western_ocean_voyage_outcome_overview: "$BULLET$В ходе экспедиции составляются карты открытого моря и новых берегов.\n$BULLET$Прибытие даёт:\n$BULLET_WITH_TAB$#G +10#! единиц [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! единиц [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Ещё #G +20#! единиц [Concept('prestige', 'престижа')|e] можно получить за открытие Америки, которое станет первым шагом на пути к колонизации Нового Света."
 hajj_caravan: "Королевский Хадж"
 hajj_caravan_desc: "Отправьте нашего [Concept('ruler', 'правителя')|e] в хадж— это пятый и обязательный столп ислама. Это очень долгое и дорогое путешествие, но правитель, вернувшийся из паломничества в Мекку, обладает таким авторитетом, который не обеспечит ни одна армия."
 hajj_caravan_historical_info: "За время своего правления (786–809 гг.) аббасидский халиф Харун ар-Рашид девять раз совершал паломничество из Багдада, причём часть пути он проходил пешком в знак благоговения. Его набожность стала образцом, которому на протяжении многих веков стремились подражать благочестивые правители."
 hajj_caravan_outcome_overview: "$BULLET$Посещение #TOOLTIP:LOCATION,mecca,X #L Мекки#!#! повышает авторитет правителя:\n$BULLET_WITH_TAB$до #G +20#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$до #G +20#! ед. [Concept('religious_influence', 'религиозного влияния')|e].\n$BULLET$По возвращении каравана домой:\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('hajj_pious_return')]» сроком на 5 лет.\n$BULLET_WITH_TAB$Постоянно действующий модификатор «[ShowModifier('hajji_pilgrim')]» в честь первого хаджа [Concept('ruler', 'правителя')|e].\n$BULLET$Караван должен добраться до Мекки в тот же год, когда отправился в путь, иначе паломничество не состоится."
 circumnavigation_expedition: "Кругосветное плавание"
 circumnavigation_expedition_desc: "Отправьте флот на запад в попытке обогнуть весь земной шар — пройти на юг от Рио-де-ла-Платы, миновать пролив на краю земли, пересечь безымянный океан и добраться до Островов Пряностей — а затем вернуться домой, обогнув мыс Доброй Надежды. Ни одному мореплавателю ещё не удавалось совершить подобное. Никто не знает, возможно ли это вообще."
 circumnavigation_expedition_historical_info: "В сентябре 1519 года Фернан Магеллан покинул Санлукар-де-Баррамеду, чтобы отыскать западный путь к Островам Пряностей для испанской короны. В состав экспедиции входили пять кораблей: #italic Тринидад#!, #italic Сан-Антонио#!, #italic Консепсьон#!, #italic Виктория#! и #italic Сантьяго#!. Магеллан был португальским мореплавателем, он плавал в Индию и на Молуккские острова, но перешёл на службу к испанской короне после того, как король Мануэл I отказался увеличить ему жалование. Эта экспедиция вошла в историю как первое кругосветное путешествие, хотя самому Магеллану не суждено было вернуться домой."
 circumnavigation_expedition_outcome_overview: "$BULLET$Первая страна, совершившая плавание вокруг света, получает:\n$BULLET_WITH_TAB$#G +100#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('first_circumnavigation')]».\n$BULLET$Дальнейшие плавания приносят:\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$Дополнительно #G +10#! ед., если как минимум 3 корабля безопасно вернулись в родную гавань.\n$BULLET_WITH_TAB$#G +5#! ед., если команда остаётся в хорошем расположении духа.\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], собранная на #TOOLTIP:AREA,moluccas_area,X #L Молуккских островах#!#!, будет продана за [Concept('gold', 'дукаты')|e] по рыночной цене."
 cape_route_to_india: "Путь в Индию через Мыс Доброй Надежды"
 cape_route_to_india_desc: "Отправьте флот на юг вдоль берега Африки, обогните великий Южный мыс и проложите морской путь к Островам Пряностей в обход османских поборов и венецианских посредников. Плавание предстоит суровое — два года в открытом океане, неизведанные берега и жестокие штормы. Но зато держава, которая первой откроет этот маршрут, получит власть над мировой торговлей пряностями."
 cape_route_to_india_historical_info: "Португальская экспедиция по поиску морского пути в Индию стала результатом почти ста лет постепенного продвижения на юг вдоль африканского побережья. В 1488 году Бартоломеу Диаш обогнул мыс Доброй Надежды, доказав, что путь в Индию возможен. Плавание Васко да Гамы в 1497–1499 годах завершило начатое — его корабли вернулись домой с грузом перца и пряностей, стоимость экспедиции окупилась в шестьдесят раз. Это путешествие коренным образом изменило мировую торговлю пряностями, положив конец венецианско-османской монополии на сухопутные торговые пути."
 cape_route_to_india_outcome_overview: "$BULLET$При каждой остановке вдоль побережья Африки может быть основана #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейтория#!#!. Если остановка будет в ничейной гавани, [Concept('location', 'район')|e] будет захвачен и будет основана #TOOLTIP:BUILDING_TYPE,por_trading_post,X #L португальская фактория#!#!. В обоих случаях даётся длительный [Concept('modifier', 'модификатор')|e] торговли.\n$BULLET$Прибытие в #TOOLTIP:LOCATION,kozhikode,X #L Кожикоде#!#! даёт модификатор «[ShowModifier('calicut_trade_rights')]», а также груз #TOOLTIP:GOODS,pepper,X #L перца#!#!, который будет продан за [Concept('gold', 'дукаты')|e] по рыночной цене.\n$BULLET$Завершение плавания даёт:\n$BULLET_WITH_TAB$#G +20#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Постоянно действующий [Concept('modifier', 'модификатор')] «[ShowModifier('cape_route_pioneer')]», либо модификаторы «[ShowModifier('portuguese_african_network')]» или «[ShowModifier('east_africa_trade_dominance')]», если основаны три или пять фейторий."
 grand_tour: "Марморина"
 grand_tour_desc: "Наследника престола ждёт продолжительное путешествие по великим городам #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Он посетит #TOOLTIP:LOCATION,florence,X #L Флоренцию#!#!, #TOOLTIP:LOCATION,rome,X #L Рим#!#!, #TOOLTIP:LOCATION,venice,X #L Венецию#!#! и #TOOLTIP:LOCATION,naples,X #L Неаполь#!#!, чтобы постигать науки у самых истоков #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#!. Домой он вернётся переменившимся человеком — характер будущего правителя будет формироваться под влиянием итальянских наставников и обретённых знаний."
 grand_tour_historical_info: "Большое путешествие — возникшая в XV–XVI веках традиция в образовательных целях отправлять знатную европейскую молодёжь в продолжительную поездку по Италии. К XVII столетию этот обычай стал обязательной частью воспитания в аристократических кругах Северной Европы. Классический маршрут пролегал через Флоренцию, Рим, Венецию и Неаполь. Эти города мог дать молодым людям то, чего так не хватало на севере: гуманистические науки, наследие античности, искусство Ренессанса и придворный церемониал старейших королевских дворов Европы. Считалось, что будущий правитель вернётся из Италии изменившимся человеком, обученным искусству дипломатии и науке управлять государством."
 grand_tour_outcome_overview: "$BULLET$Каждый посещённый нашим [Concept('heir', 'наследником')|e] город повышает его [Concept('ability', 'навыки')|e] и даёт [Concept('research_progress', 'прогресс исследования')|e] в зависимости от времени, потраченного на учёбу, либо [Concept('legitimacy', 'легитимность')|e] за время, проведённое при дворе.\n$BULLET$Если посетить хотя бы три великих города #TOOLTIP:REGION,italy_region,X #L Италии#!#!, путешествие даёт:\n$BULLET_WITH_TAB$Свойство «[ShowTraitName('free_thinker')]» или «[ShowTraitName('well_connected')]» в зависимости от принятых решений.\n$BULLET_WITH_TAB$Постоянно действующий [Concept('modifier', 'модификатор')|e] «[ShowModifier('returned_from_grand_tour')]».\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET$Сокращённое путешествие приносит только #G +5#! ед. [Concept('prestige', 'престижа')|e] и не даёт [Concept('trait', 'свойств')|e]."
 steppe_embassy: "Посольство в Великую степь"
 steppe_embassy_desc: "Отправьте правителя с дипломатической миссией ко дворам великих держав, образовавшихся после распада #TOOLTIP:CULTUREGROUP,mongolian_group,X #L Монгольской#!#! империи. Впереди ждёт долгая дорога через чуждые земли, а ханы сурово обходятся с теми, кто не умеет произвести хорошее впечатление. Принесите им богатые дары, покажите силу оружия или продемонстрируйте свои знания и ум. А коли явитесь с пустыми руками, то и домой вернётесь ни с чем."
 steppe_embassy_historical_info: "На протяжении XIV века европейские и ближневосточные правители неоднократно стремились установить прямые дипломатические контакты с государствами-преемниками Монгольской империи. Западные посольства в Ильханат, Золотую Орду и к другим дворам степняков могли принимать самые разные формы — от пышных официальных делегаций до сугубо практичных деловых поездок. Всё зависело от того, что именно рассчитывала получить отправившая посольство держава."
 steppe_embassy_outcome_overview: "$BULLET$Прибыв ко двору, мы получим модификатор «[ShowModifier('led_steppe_embassy')]».\n$BULLET$Награда зависит от выбранного подхода, каждый вариант также приносит #G +10#! ед. [Concept('prestige', 'престижа')|e]:\n$BULLET_WITH_TAB$Демонстрация оружия даёт модификатор «[ShowModifier('steppe_recognised_military')]».\n$BULLET_WITH_TAB$Богатые дары дают модификатор «[ShowModifier('steppe_contact_established')]».\n$BULLET_WITH_TAB$Торговое предложение даёт модификатор «[ShowModifier('steppe_trade_agreement')]» и долгосрочное торговое соглашение, освобождающее наших купцов от пошлин и поборов за защиту.\n$BULLET$Собрав в дороге нужные сведения, можно получить сразу две награды.\n$BULLET$Двор в #TOOLTIP:LOCATION,samarkand,X #L Самарканде#!#! даёт [Concept('research_progress', 'прогресс исследования')|e], причём для [Concept('ruler', 'правителя')|e] со свойством «[ShowTraitName('scholar')]» награда удваивается."
 eastern_alliance_embassy: "Посольство Восточного союза"
 eastern_alliance_embassy_desc: "Отправьте посольство в далёкие земли, лежащие по ту сторону #TOOLTIP:RELIGIONGROUP,muslim,X #L исламского#!#! мира, — к #TOOLTIP:REGION,persia_region,X #L персидскому#!#! шаху или к негусу #TOOLTIP:REGION,ethiopia_region,X #L Эфиопского#!#! нагорья. Путь ваших посланников пройдёт через #TOOLTIP:LOCATION,hormuz,X #L Ормузский пролив#!#! или через #TOOLTIP:LOCATION,alexandria,X #L Александрию#!#!, им придётся пересечь пустыни, где бесследно исчезают целые караваны. Однако путешествие того стоит, ведь даже номинальный союз с далёким двором вынудит наших врагов считаться с угрозой войны на два фронта."
 eastern_alliance_embassy_historical_info: "Христианские державы Европы постоянно стремились наладить прямые дипломатические контакты с дворами Персии и Эфиопии. В 1460-х годах правитель Ак-Коюнлу Узун Хасан направил послов в Венецию, чтобы договориться о совместных действиях против османов, а в начале XVI века португальские дипломаты прибыли ко двору эфиопского негуса Либнэ Дынгыля. Посланникам приходилось преодолевать огромные расстояния, дипломатический протокол чужеземных дворов кардинально отличался от европейского, а исход посольства почти никогда не оправдывал ожиданий ни той, ни другой стороны."
 eastern_alliance_embassy_outcome_overview: "$BULLET$Прибыв ко двору, мы получим модификатор «[ShowModifier('led_eastern_alliance_embassy')]». [Concept('opinion', 'Мнение')|e] наших держав друг о друге улучшится на #G +30#!.\n$BULLET$Награда зависит от выбранного подхода, каждый вариант также приносит #G +10#! ед. [Concept('prestige', 'престижа')|e]:\n$BULLET_WITH_TAB$Просьба о военной помощи даёт модификатор «[ShowModifier('eastern_alliance_persia')]» (для #TOOLTIP:REGION,ethiopia_region,X #L Эфиопии#!#! — «[ShowModifier('eastern_alliance_ethiopia')]») и заключение [Concept('alliance', 'союза')|e].\n$BULLET_WITH_TAB$Предложение торговли даёт модификатор «[ShowModifier('eastern_route_open')]».\n$BULLET$Собрав заранее нужные сведения, можно получить обе награды."
 grand_embassy: "Великое посольство"
 grand_embassy_desc: "Отправьте правителя с дипломатическим турне по столицам Западной Европы, чтобы укрепить отношения с великими державами и перенять государственные институты и принципы организации армии и флота у тех стран, которые лишь недавно встали на путь модернизации. Такое посольство способно дать куда больше, чем просто стопку новоиспечённых соглашений."
 grand_embassy_outcome_overview: "$BULLET$Если посольство примут, мы получаем одну из следующих наград по выбору хозяев. Посольство может перемещаться от одного двора к другому ради новых уроков:\n$BULLET_WITH_TAB$#G +5#!, #G +15#! или #G +25#! к развитию [Concept('institutions', 'институтов')|e] в наших самых густонаселённых городах.\n$BULLET_WITH_TAB$#G +1#!, #G +3#! или #G +5#! к [Concept('army_tradition', 'армейским')|e] или [Concept('navy_tradition', 'морским традициям')|e].\n$BULLET$Двор, отказавшийся принять посольство, потеряет лицо. Если посольство встретят оскорбительно, мы получим [Concept('casus_belli', 'повод для войны')|e] против этой державы."
 arctic_passage_nw: "Поиски Северо-Западного прохода"
 arctic_passage_nw_desc: "Отправьте флот на северо-запад, через скованные льдами воды к северу от Америки на поиски морского пути в Азию. Если проход существует, он ведёт сквозь замёрзший архипелаг к северу от континента, через паковые льды, бесконечную зимнюю ночь и моря, которых нет ни на одной карте. Ещё ни одной экспедиции не удалось найти этот проход, но это не значит, что его не существует."
 arctic_passage_nw_historical_info: "В течение всего XVI века английские, нидерландские и скандинавские мореплаватели не оставляли надежд найти северный морской путь в Азию. В итоге преодолеть Северо-Западный проход удалось лишь экспедиции Руаля Амундсена в 1903–1906 годах, тогда как Северный морской путь первым прошёл Адольф Норденшёльд в 1878–1879 годах. Оба пути оказались непригодны для коммерческого использования в сравнении с южными маршрутами, однако эти плавания позволили создать первые подробные карты Арктики и открыли торговлю пушниной и китобойный промысел на Крайнем Севере."
 arctic_passage_nw_outcome_overview: "$BULLET$По мере изучения замёрзшего архипелага экспедиция приносит [Concept('prestige', 'престиж')|e] за каждую достигнутую достопримечательность.\n$BULLET$Переход в #TOOLTIP:LOCATION,hudson_bay1,X #L Гудзонов залив#!#! через Северо-западный проход приносит:\n$BULLET_WITH_TAB$#G +20#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('northwest_passage_found')]» сроком на 30 лет.\n$BULLET$Если экспедиция развернётся обратно, не достигнув цели, это приносит #G +5#! ед. [Concept('prestige', 'престижа')] и [Concept('modifier', 'модификатор')] «[ShowModifier('arctic_expedition_returned')]» сроком на 5 лет."
 pacific_crossing: "Поиски «торнавьяхе»"
 pacific_crossing_desc: "Отправьте флот с тихоокеанского побережья Америки на поиски #italic торнавьяхе#! — надёжного обратного маршрута через крупнейший океан на планете. Пассаты охотно несут наши корабли на запад, к берегам Азии, однако все попытки вернуться тем же путём до сих пор заканчивались неудачей. Наши колонии и все богатства Островов Пряностей останутся вне досягаемости, пока мы не найдём дорогу обратно. Держава, которая первой нанесёт на карты дорогу назад, сможет связать Америку с Азией маршрутами галеонов и начать полноценную тихоокеанскую торговлю."
 pacific_crossing_historical_info: "#italic Торнавьяхе#!, обратное плавание на восток, долгое время оставалось главной проблемой первых тихоокеанских экспедиций. Альваро де Сааведра, отплыв из Новой Испании, в 1528 и 1529 годах дважды был вынужден отступить перед пассатами и в итоге погиб в попытках найти путь обратно. В 1542 году Руи Лопес де Вильялобос, добравшись до Азии, также не сумел найти дорогу домой. Пригодный маршрут был найден лишь в 1565 году. До тех пор флоты могли доплыть до Азии, но не имели возможности доставить свой груз назад."
 pacific_crossing_outcome_overview: "$BULLET$Нанесение на карту обратного маршрута через #TOOLTIP:CONTINENT,pacific_ocean_continent,X #L Тихий океан#!#! приносит:\n$BULLET_WITH_TAB$#G +100#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET_WITH_TAB$#G +15#! ед. [Concept('legitimacy', 'легитимности')|e].\n$BULLET_WITH_TAB$Постоянно действующий [Concept('modifier', 'модификатор')|e] «[ShowModifier('manila_galleon_route')]».\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], собранная на #TOOLTIP:AREA,moluccas_area,X #L Молуккских островах#!#!, будет продана за [Concept('gold', 'дукаты')|e] по рыночной цене.\n$BULLET_WITH_TAB$Постоянный доступ к [Concept('decision', 'решению')|e] «[ShowDecisionName('charter_manila_galleon')]», которое можно принимать каждые пять лет, чтобы получить значительную сумму [Concept('gold', 'дукатов')|e].\n$BULLET$Флот, который не сумеет найти путь назад, не принесёт ничего."
 gold_fleet_tierra_firme: "Галеоны Тьерра-Фирме"
 gold_fleet_tierra_firme_desc: "Отправьте конвой галеонов из главного порта метрополии, чтобы забрать груз серебра, драгоценных камней и шкур из наших владений в Новой Гранаде и на Перешейке. Флот Тьерра-Фирме — важнейшая артерия испанской колониальной империи, несущая богатства Нового Света на рынки Севильи."
 gold_fleet_tierra_firme_historical_info: "#italic Галеоны Тьерра-Фирме#! являлись одним из двух конвоев испанского #italic Серебряного флота#!. На флот Тьерра-Фирме была возложена задача обеспечивать торговлю с вице-королевствами Южной Америки. Его корабли вывозили серебро, добытое в рудниках Потоси в Верхнем Перу, а также другие колониальные товары через порты Портобело и Картахены. Серебро доставляли через Панамский перешеек по суше с тихоокеанского побережья и лишь затем грузили на галеоны. Филипп II закрепил систему конвоев в 1566 году, велев перевозить все грузы в составе вооружённых эскадр. Колониальные товары ввозились через Севилью, при этом #italic Каса-де-Контратасьон#! взимала в пользу короны #italic quinto real#! — пятую часть всех драгоценных металлов, добытых в Новом Свете."
 gold_fleet_tierra_firme_outcome_overview: "Погрузив в наших колониях #TOOLTIP:GOODS,silver,X #L серебро#!#! и #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, конвой доставляет их на родину в виде [Concept('gold', 'дукатов')|e] и по прибытии приносит #G +10#! ед. [Concept('prestige', 'престижа')|e]. Если взять на борт #TOOLTIP:GOODS,gems,X #L драгоценные камни#!#!, #TOOLTIP:GOODS,pearls,X #L жемчуг#!#! или караван мулов, ценность груза увеличится, однако конвой будет привлекать больше внимания. Встреча с флотом Новой Испании на острове [ShowScriptedGeographyName('island_of_cuba_geography')] дополнительно принесёт #G +10#! ед. [Concept('prestige', 'престижа')|e] и сделает безопаснее переход через Атлантику. Часть конвоя может быть потеряна вследствие штормов и нападений пиратов, а если не повезёт, погибнет весь конвой."
 gold_fleet_nueva_espana: "Флот Новой Испании"
 gold_fleet_nueva_espana_desc: "Отправьте конвой Новой Испании из главного порта метрополии, чтобы забрать груз серебра и ценных красок из наших владений в Мезоамерике. Флот проходит через пролив Мона в Карибское море и собирается в Гаване перед переходом через Атлантику."
 gold_fleet_nueva_espana_historical_info: "#italic Флот Новой Испании#! был одним из двух конвоев испанского #italic Серебряного флота#!. Его корабли обеспечивали торговлю с вице-королевством Новой Испании, перевозя серебро из рудников Сакатекаса, Гуанахуато и других мексиканских месторождений, а также кошенильный краситель из Оахаки, индиго, ваниль и какао. Погрузка велась в порту Сан-Хуан-де-Улуа близ Веракруса. Как правило, конвой покидал Испанию весной и возвращался осенью, соединяясь в Гаване с галеонами Тьерра-Фирме для совместного перехода через Атлантику. Его путь пролегал через пролив Мона между Эспаньолой и Пуэрто-Рико —по стандартному маршруту в восточную часть Карибского моря."
 gold_fleet_nueva_espana_outcome_overview: "Погрузив в наших колониях #TOOLTIP:GOODS,silver,X #L серебро#!#! и #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, конвой доставляет их на родину в виде [Concept('gold', 'дукатов')|e] и по прибытии приносит #G +10#! ед. [Concept('prestige', 'престижа')|e]. Если сопровождать караван с серебром или взять на борт #TOOLTIP:GOODS,lumber,X #L лесоматериалы#!#!, ценность груза увеличится, однако конвой будет привлекать больше внимания. Встреча с галеонами Тьерра-Фирме на острове [ShowScriptedGeographyName('island_of_cuba_geography')] дополнительно принесёт #G +10#! ед. [Concept('prestige', 'престижа')|e] и сделает безопаснее переход через Атлантику. Часть конвоя может быть потеряна вследствие штормов и нападений пиратов, а если не повезёт, погибнет весь конвой."
 cartographic_survey: "Исследование побережья"
 cartographic_survey_desc: "Отправьте корабль для подробного изучения наших собственных берегов. Исследователи нанесут на карту удобные гавани, измерят глубину отмелей и отметят опасные места. Работа не самая престижная, но созданные ими карты прослужат целому поколению мореплавателей, ускорив и удешевив снаряжение всех последующих экспедиций."
 cartographic_survey_historical_info: "Систематическое исследование побережий получило широкое развитие в XVI веке — объёмы морской торговли стремительно росли, и точность карт превратилась в вопрос государственной важности. #italic Каса-де-Контратасьон#! в Севилье и португальский #italic Арсенал Гвинеи и Индии#! содержали целый штат официальных картографов, в обязанности которых входило составление и постоянное обновление морских карт. В XVII веке их примеру последовали нидерландские адмиралтейства."
 cartographic_survey_outcome_overview: "$BULLET$Каждый исследованный [Concept('port', 'порт')|e] может предоставить [Concept('location_modifier', 'модификатор района')|e] на срок от 10 до 20 лет. Этот модификатор повышает объём выпуска таких товаров, как #TOOLTIP:GOODS,fish,X #L рыба#!#!, #TOOLTIP:GOODS,pearls,X #L жемчуг#!#! или #TOOLTIP:GOODS,amber,X #L янтарь#!#!, а также может улучшить саму гавань и принести державе [Concept('prestige', 'престиж')|e].\n$BULLET$Исследование трёх и более портов также даёт следующие преимущества:\n$BULLET_WITH_TAB$[Concept('modifier', 'Модификатор')|e] «[ShowModifier('accurate_charts')]» на 15 лет\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('prestige', 'престижа')].\n$BULLET$При исследовании менее трёх портов вы получите лишь #G 5#! ед. [Concept('prestige', 'престижа')]."
 mining_survey: "Исследование высокогорья"
 mining_survey_desc: "Отправить группу рудоискателей и пробирщиков в наши высокогорные районы, чтобы исследовать русла рек, найти обнажённую породу и проверить её на наличие драгоценных металлов. В холмах нередко залегают большие богатства, и чтобы их извлечь, нам стоит полагаться на знания и наработки опытных шахтёров, а не на домыслы придворных вельмож."
 mining_survey_historical_info: "В Средние века и в раннее Новое время в Европе активно проводилась разведка рудных залежей. Наиболее широко эта деятельность велась в Рудных горах Саксонии и Богемии, где открытие залежей серебра в XII веке привело к бурному росту таких городов, как Фрайберг, Яхимов и Шнеберг. В 1556 году было издано сочинение Георга Агриколы #italic «О горном деле и металлургии»#!, где были подробно описаны методы лозоходства и опробования руды, а также приведены правовые обычаи касательно притязаний на рудоносные участки. Этот труд почти 200 лет служил одним из основных руководств по добыче и обработке металлов."
 mining_survey_outcome_overview: "$BULLET$Каждое исследование даёт [Concept('modifier', 'модификатор')|e] «[ShowModifier('thorough_survey')]», который на 20 лет увеличивает объём выпуска ресурсов во всей державе.\n$BULLET$Каждое найденное месторождение также открывает доступ к крупным залежам, таким как [ShowModifier('rich_silver_vein')|l] или [ShowModifier('rich_gold_strike')|l]. Их можно разрабатывать открыто для получения [Concept('prestige', 'престижа')|e] или же тайно для извлечения [Concept('gold', 'прибыли')|e].\n$BULLET$Открытие месторождений также даёт следующие преимущества:\n$BULLET_WITH_TAB$#G +10#! ед. [Concept('prestige', 'престижа')] за два и более открытых месторождения.\n$BULLET_WITH_TAB$#G +5#! ед. престижа за каждое исследованное высокогорье."
 relic_expedition: "Поездка за реликвией"
 relic_expedition_desc: "Отправить посольство в #TOOLTIP:RELIGIONGROUP,christian,X #L христианскую#!#! державу, в которой хранится одна из великих реликвий христианства, чтобы получить её в дар, купить или договориться о её передаче. На сегодняшний день три важнейших реликвии христианства — это Животворящий крест в #TOOLTIP:LOCATION,jerusalem,X #L Иерусалиме#!#!, Терновый венец в #TOOLTIP:LOCATION,paris,X #L Париже#!#! и Копьё Лонгина в #TOOLTIP:LOCATION,antioch,X #L Антиохии#!#!. Первая держава, которая сможет заполучить одну из них, несомненно обретёт значительное влияние."
 relic_expedition_historical_info: "В Средневековье была широко распространена торговля реликвиями. Католические и православные общины постоянно боролись за право владеть наиболее важными и ценными артефактами. В течение нескольких веков эти реликвии неоднократно покупали, обменивали и даже похищали, за счёт чего они успели побывать в большинстве христианских держав того времени. Так, в 1238 году Людовик IX приобрёл у латинского императора Балдуина II Терновый венец и поместил его на хранение в церковь Сент-Шапель, которую специально возвели в Париже для этой цели. Не стоит и говорить, что для французского государства это было столь же важное приобретение, сколь и для местных христиан."
 relic_expedition_outcome_overview: "$BULLET$Первая держава, заполучившая великую реликвию, получит соответствующий [Concept('modifier', 'модификатор')|e] в зависимости от своего выбора («[ShowModifier('relic_true_cross')]», «[ShowModifier('relic_crown_of_thorns')]» или «[ShowModifier('relic_holy_lance')]»).\n$BULLET$Реликвию можно официально купить за [Concept('gold', 'дукаты')|e], что дополнительно даст державе #G 10#! ед. [Concept('prestige', 'престижа')|e].\n$BULLET$Тайное приобретение реликвии также даёт [Concept('modifier', 'модификатор')], но не приносит [Concept('prestige', 'престижа')]."
