 EXPEDITIONS_SUBTAB_ACTIVE_TT_FLAVOR_TEXT: "Корабли подготовлены, карты нарисованы, а капитаны назначены. Остаётся лишь надеяться на благосклонность моря."
 EXPEDITIONS_SUBTAB_COMPLETED_TT_TEXT: "Все наши законченные [Concept('expedition', 'путешествия')|e], в том числе завершившиеся неудачей, и их итоги."
 EXPEDITIONS_SUBTAB_COMPLETED_TT_FLAVOR_TEXT: "Одни экспедиции возвращаются с грузом и картами. Другие возвращаются с полупустыми трюмами, потеряв в пути и людей, и всё остальное."
