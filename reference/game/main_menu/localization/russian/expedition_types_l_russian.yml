 cape_route_to_india_expedition: "Морской путь в Индию вокруг Африки"
 cape_route_to_india_expedition_desc: "Отправьте флот на юг вдоль африканского побережья и вокруг великого южного мыса, проложив морской путь к Островам пряностей в обход всех османских пошлин и венецианских посредников. Путь этот жесток — два года открытого океана, неведомых берегов и штормов, разбрасывающих корабли, — но первая держава, что откроет его, будет владеть мировой торговлей пряностями."
 cape_route_to_india_expedition_high_morale_prestige_tt: "Высокий боевой дух команды увеличивает получаемый престиж"
 cape_route_to_india_expedition_historical_info: "Португальская экспедиция в поисках морского пути в $india$ стала итогом почти столетия постепенных исследований африканского побережья, продвигавшихся всё дальше на юг. Бартоломеу Диаш обогнул мыс Доброй Надежды в 1488 году, доказав, что такой путь возможен. Плавание Васко да Гамы в 1497–99 годах завершило эту миссию: экспедиция вернулась с грузом перца и специй, окупившим себя в шестьдесят раз. Это плавание коренным образом изменило мировую торговлю пряностями, разрушив венецианскую и османскую монополию на сухопутные маршруты."
 cape_route_to_india_expedition_low_morale_prestige_tt: "Низкий боевой дух команды уменьшает получаемый престиж"
