l_russian:
 cartographic_survey_events.1.title: "Разведывательная миссия"
 cartographic_survey_events.1.desc: "Приказ отдан. Небольшой флот из пары-тройки кораблей, в экипаж которых входят картографы и навигаторы, будет исследовать наше побережье для создания его подробных карт. Почти все наши знания о собственных берегах исходят от местных лоцманов и слухов, которые распускают купцы. Благодаря этой экспедиции мы будем точно знать, где расположены удобные гавани, бухты контрабандистов, а также опасные для судоходства места. Вопрос лишь в том, как лучше снарядить наши корабли для грядущего путешествия."
 cartographic_survey_events.1.a: "Закупить лучшие инструменты и нанять самых опытных картографов."
 cartographic_survey_events.1.b: "Излишества тут ни к чему. С этой задачей справится даже неискушённый экипаж."
 cartographic_survey_events.1.historical_info: "Систематическое исследование побережий получило широкое развитие в XVI веке — объёмы морской торговли стремительно росли, и точность карт превратилась в вопрос государственной важности. #italic Каса-де-Контратасьон#! в Севилье, а также португальский #italic Арсенал Гвинеи и Индии#! содержали целый штат официальных картографов, в обязанности которых входило составление и постоянное обновление морских карт. В XVII веке их примеру последовали нидерландские адмиралтейства."
 # GOOD events: material-specific
 cartographic_survey_events.10.title: "Картирование рыбных промыслов"
 cartographic_survey_events.10.desc: "Разведывательное судно провело три недели с рыбаками в окрестностях [target_location.Custom('LR_GEN')|l] [target_location.GetName], измеряя глубину в районе рыбных промыслов, отмечая сезонный ход рыбы и фиксируя течения, которые могут донести судна до берега до смены погоды. Благодаря этому наши картографы составили детальную карту, где указана глубина и рельеф дна, а также наиболее благоприятные для ловли рыбы периоды. Местный лоцман отметил, что никогда прежде не видел столь подробной характеристики здешних вод."
 cartographic_survey_events.10.a: "Передадим этим карты рыбацким деревням."
 cartographic_survey_events.10.historical_info: "В прошлом рыболовы полагались лишь на знания, которые передавались рыбаками из поколения в поколение. Переход к картированию рыболовных угодий с указанием глубин и сезонных факторов происходил очень медленно и ускорился лишь в XVII–XVIII веках, когда государства начали активно финансировать гидрографические исследования."
 cartographic_survey_events.11.title: "Прибрежные леса"
 cartographic_survey_events.11.desc: "Наши исследователи, при содействии местных лесничих и корабелов, изучили прибрежные леса в окрестностях [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Они отметили наилучшие места для вырубки мачтовых сосен и корабельного дуба, нанесли на карту реки, по которым брёвна удобнее всего сплавлять на побережье, а также определили оптимальные сезоны для заготовки древесины. Приглашённый с ближайшей верфи кораблестроитель подтвердил, что эти лесные насаждения подходят для изготовления килей и каркасов наивысшего качества."
 cartographic_survey_events.11.a: "Оставим лучший лес для нужд #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого#! флота"
 cartographic_survey_events.11.historical_info: "Корабельная древесина — а особенно дуб и сосна, необходимые для строительства каркасов и мачт линейных кораблей, — была стратегически важным ресурсом в эпоху мореплавания. Английская, французская и голландская короны регулярно проводили осмотр своих прибрежных лесов и присваивали наилучшие насаждения, где устанавливались строгие правила касательно рубки, сушки и перевозки."
 cartographic_survey_events.12.title: "Опись солончаков"
 cartographic_survey_events.12.desc: "Разведчики составили подробную карту всех солончаков, солёных источников и отмелей вдоль побережья близ [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Кроме того, исследователи провели учёт солеваров, уточнили рабочие сезоны, а также опросили местных торговцев насчёт цен, спроса и маршрутов, по которым [ShowGoodsNameWithNoTooltip('salt')|l] поступает в страну. Полученные ими сведения проливают свет на прибрежную экономику, о которой [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] до сих пор почти ничего не знали и которая могла бы принести в казну огромную прибыль, если бы её участники вместе со всеми платили соляной налог."
 cartographic_survey_events.12.a: "Эти карты помогут нам взять под контроль торговлю солью."
 cartographic_survey_events.12.historical_info: "Прибрежный соляной промысел на основе выпаривания под солнцем был распространён в странах Средиземноморья и на атлантическом побережье Франции и Иберийского полуострова со времён Античности. Залив Бурнёф, остров Ре и солончаки Сетубальского полуострова служили крупными центрами производства соли в средневековой Европе, откуда этот ценный товар поступал на тресковые промыслы Северной Атлантики и в цеха засольщиков по всему континенту."
 cartographic_survey_events.13.title: "Обнаружение жемчужных банок"
 cartographic_survey_events.13.desc: "Заручившись помощью местных потомственных ныряльщиков, наши исследователи составили карту скопления #TOOLTIP:GOODS,pearls,X #L жемчужниц#!#! вблизи [target_location.Custom('LR_GEN')|l] [target_location.Custom('LR_GEN')|l]. Помимо самих мест, на карте также указаны глубины, наилучшие сезоны для добычи, устоявшиеся границы между промысловыми районами разных общин, а также маршруты, по которым их улов поступает к городским ремесленникам. По нашей просьбе один из ювелиров уже проверил местный жемчуг и высоко оценил его внешние качества."
 cartographic_survey_events.13.a: "Сбыт столь качественного жемчуга должен быть под контролем государства."
 cartographic_survey_events.13.historical_info: "Европейская ловля жемчуга была относительно слабо развита по сравнению с промыслами Персидского залива и Шри-Ланки. Тем не менее в реке Висле, а также в прибрежных водах Гебридских островов, Бретани и Уэльса всё же велась коммерческая добыча пресноводного и морского жемчуга. При этом в Средние века шотландская корона обладала монополией на ловлю жемчуга в некоторых реках, а венецианский сенат строго регулировал его добычу в Адриатическом море."
 cartographic_survey_events.14.title: "Картирование прибрежных виноградников"
 cartographic_survey_events.14.desc: "Наши исследователи вместе с местными виноделами тщательно осмотрели прибрежные холмы вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Они отметили наилучшие склоны для выращивания винограда с учётом ветров, а также нашли удобные места для погрузки винных бочек на корабли. К нашему удивлению, торговцы #TOOLTIP:GOODS,wine,X #L вином#!#!, которые обычно не распространяются о своём ремесле, охотно помогали исследователям, понимая, что новые карты положительно скажутся на сроках поставок."
 cartographic_survey_events.14.a: "Торговцам вином определённо пригодятся эти карты."
 cartographic_survey_events.14.historical_info: "Морская торговля вином составляла основу экономики регионов, расположенных в долине рек Гаронна и Дуэро, на Эгейских островах и вдоль далматского побережья. Своевременный сбор урожая, условия хранения и скорость доставки во многом определяли, сохранит ли вино свои качества или испортится ещё до того, как попадёт на прилавок. В связи с этим картирование прибрежных виноградных плантаций имело огромное коммерческое значение. Так, крупные торговцы вином из Бордо и Порту в течение сотен лет хранили и пополняли свои частные коллекции карт."
 cartographic_survey_events.15.title: "Изучение прибрежных мест добычи красителей"
 cartographic_survey_events.15.desc: "Наши исследователи составили подробные карты побережья вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName], где добывают #TOOLTIP:GOODS,dyes,X #L красители#!#!. Здесь они обнаружили колонии мурексов, скальные рощи кермесового дуба, места произрастания индиго и другие источники природных красителей, за которые торговцы #TOOLTIP:GOODS,cloth,X #L текстилем#!#! готовы заплатить высокую цену. Среди прочего, картографы указали сезоны и традиционные места добычи красителей, а также маршруты, которыми их привозят в центры текстильной промышленности."
 cartographic_survey_events.15.a: "Отправим эти карты в деревни и текстильные мастерские."
 cartographic_survey_events.15.historical_info: "Природные красители были крайне ценным товаром в Средние века и раннее Новое время. При этом они имели весьма широкую географию производства и создавались по самым разным технологиям. Так, пурпурный краситель изготавливали из моллюсков, красный — из кошенилей, индиго — из индигоферы, а синий — из листьев вайды. Торговля тканями сильно зависела от красителей, поэтому их своевременная доставка из районов добычи в текстильные центры имела огромное значение."
 cartographic_survey_events.16.title: "Картирование янтарного берега"
 cartographic_survey_events.16.desc: "Наши исследователи изучили окрестности [target_location.Custom('LR_GEN')|l] [target_location.GetName], где во время сильных бурь море выносит на берег большое количество #TOOLTIP:GOODS,amber,X #L янтаря#!#!. Это позволило им составить подробные карты, где указаны места и сезоны его сбора, а также обычаи, согласно которым местные распределяют добычу. Городские янтарщики, охочие до качественных окаменелостей, наверняка заплатят хорошие деньги за эти сведения."
 cartographic_survey_events.16.a: "Самые плодовитые берега должны быть под государственным контролем."
 cartographic_survey_events.16.historical_info: "Янтарный берег, раскинувшийся от Восточной Померании до Самбийского полуострова, ещё со времён Античности служил основным источником янтаря для европейских ремесленников. В какой-то момент Тевтонский орден даже установил монополию на добычу этого материала и ввёл суровые наказания за его незаконный сбор. Янтарные торговые пути более тысячи лет соединяли Балтику с мастерскими Богемии, Италии и Константинополя."
 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "Укрытая бухта"
 cartographic_survey_events.20.desc: "Наше разведывательное судно обогнуло небольшой мыс вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName] и встало на якорь в тихой, укрытой от ветра бухте, которую местные рыбаки используют уже многие поколения, но которая не отмечена ни на одной карте. От песчаного дна до поверхности здесь целых четыре морских саженей, и местный лоцман уверяет, что тут могут в любую погоду стоять даже крупные суда. После более точных замеров и установки ориентиров наш флот сможет спокойно пользоваться этой гаванью."
 cartographic_survey_events.20.a: "Нанесём бухту на карту и подготовим её к использованию."
 cartographic_survey_events.20.historical_info: "Рыбаки зачастую знали об укрытых стоянках, которых не было на морских картах. При этом они никак не сохраняли и не записывали свои знания, а лишь устно передавали их из поколения в поколение. Впоследствии государства начали организовывать гидрографические исследования, в ходе которых обязательно опрашивались местные лоцманы. В результате подобных работ многие гавани, прежде неизвестные морякам, наконец наносились на официальные карты флота."
 cartographic_survey_events.21.title: "Проход через рифы"
 cartographic_survey_events.21.desc: "Наши картографы в течение двух недель изучали прибрежные воды вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName] и замеряли глубину над местными рифами, которые прежде считались непроходимыми. В ходе работ они обнаружили канал шириной не меньше тридцати футов и глубиной четыре морских саженей, где с грамотно расставленными ориентирами легко сможет пройти любое судно. Об этом исследователям рассказал местный лоцман, который знал о существовании канала вот уже тридцать лет, но до сих пор не удосужился никому сообщить. Он попросил у них небольшую плату за то, чтобы отметить этот путь на их картах."
 cartographic_survey_events.21.a: "Нанесём канал на карту и отметим ориентиры."
 cartographic_survey_events.21.historical_info: "В каботажном судоходстве Нового времени нередки были случаи, когда среди прибрежных рифов внезапно обнаруживались проходимые каналы. Они обычно отмечались с помощью створ — навигационных ориентиров, определённым образом размещённых на берегу относительно друг друга. Местные лоцманы зачастую знали о подобных путях, но хранили эти знания в тайне из корыстных соображений."
 cartographic_survey_events.22.title: "Обжитая бухта"
 cartographic_survey_events.22.desc: "В ходе изучения берега наши разведчики нашли укрытую бухту недалеко от [target_location.Custom('LR_GEN')|l] [target_location.GetName]. На здешнем дне остались отметины от недавней стоянки, а на камнях у берега видны следы бочек, которые кто-то скатывал в бухту. При этом на вопросы картографов дети местных рыбаков отвечают уклончиво и явно чего-то недоговаривают. Очевидно, в этом месте многие годы орудовали контрабандисты. Теперь оно будет нанесено на наши официальные карты, благодаря чему его можно будет использовать как для нужд флота, так и для легальной торговли."
 cartographic_survey_events.22.a: "Отметим бухту и построим здесь небольшой таможенный пост."
 cartographic_survey_events.22.historical_info: "Со времён Античности вплоть до ранней индустриальной эпохи европейское побережье было усеяно бухтами контрабандистов. Внедрение во флот береговой охраны и таможенных катеров, а также нанесение на карту наиболее подозрительных стоянок в конечном итоге загнали контрабандистов в более мелкие и удалённые бухты. Однако лишь с появлением железной дороги, телеграфа и паровых патрульных кораблей незаконная торговля стала по-настоящему опасным и рискованным занятием."
 # BAD events
 cartographic_survey_events.30.title: "Ураган срывает экспедицию"
 cartographic_survey_events.30.desc: "На третий день работы с юго-запада пришёл ураган. Разведывательное судно налетело на подветренный берег, где об него две холодные ночи бились мощные волны. Спасательные корабли, отправленные на помощь картографам, также не совладали с ветром и рассеялись, даже не достигнув цели. Когда буря наконец стихла и судно сняли с мели, масштаб катастрофы стал очевиден: все инструменты были испорчены, а двое помощников боцмана погибли и были похоронены на песчаном берегу. Все усилия команды пропали даром, а побережье вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName] так и осталось неизученным."
 cartographic_survey_events.30.a: "Время уже упущено. Придётся пока оставить эту затею."
 cartographic_survey_events.30.historical_info: "Внезапные бури представляли постоянную угрозу для небольших судов, которые занимались изучением побережья. Регулярные прогнозы погоды и шкала Бофорта, разработанная для предупреждения ураганов, появились лишь в XIX веке. До тех пор разведывательные суда, оказавшиеся на подветренном берегу в преддверии шторма, в своём спасении могли рассчитывать лишь на тяжесть якоря и опыт штурмана."
 cartographic_survey_events.31.title: "Удар о неотмеченную отмель"
 cartographic_survey_events.31.desc: "Неподалёку от [target_location.Custom('LR_GEN')|l] [target_location.GetName] наше разведывательное судно наткнулось на отмель, которая не была отмечена на наших картах. Рельеф изменился очень резко: лотлинь только что показывал глубину в четыре морских саженей, а уже мгновение спустя в носовой части судна появилась пробоина. Пока плотник в течение нескольких дней латал кренгованный на берегу корабль, картографы успели произвести все необходимые замеры и составить карту побережья. Работа завершена, пусть и не без потерь."
 cartographic_survey_events.31.a: "Корабль вернётся в строй. Главное, что теперь эта отмель есть на наших картах."
 cartographic_survey_events.31.historical_info: "В прошлом у разведывательных судов был весьма ограниченный набор инструментов, поэтому они часто садились на мель. При этом подобные крушения порой приносили гораздо больше полезных сведений об окрестных водах, нежели осторожные исследователи, которые без ущерба проходили вдоль тех же берегов. Так, многие отмели и рифы появились на картах именно благодаря крушениям и были названы в честь кораблей, которые на них наскочили."
 cartographic_survey_events.32.title: "Враждебное судно"
 cartographic_survey_events.32.desc: "Пока наш разведывательный корабль стоял на якоре вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName], к нему из тумана внезапно направилось вооружённое судно с латинским парусом и без флага. Исследователям пришлось бросить инструменты на берегу и немедленно вернуться на корабль, так и не закончив работу. Неопознанное судно преследовало их ещё полдня, а затем развернулось и, по-видимому, направилось в порт наших неприятелей. В итоге эта часть побережья так и осталась неизученной, и наши картографы вряд ли захотят туда возвращаться."
 cartographic_survey_events.32.a: "Если эти берега стережёт враг, нам там делать нечего."
 cartographic_survey_events.32.historical_info: "Изучение иностранных берегов всегда носило политические риски, поскольку страны могли использовать подробные карты побережья для морского вторжения. В связи с этим за разведывательными судами часто следовали местные вооружённые корабли, которые либо арестовывали их, либо вынуждали их покинуть оспариваемые воды. Гидрографические исследования, которые английское адмиралтейство проводило у испанского и эгейского побережий в XVII–XVIII веках, многократно прерывались именно из-за таких враждебных акций. Картографы настолько к этому привыкли, что при первых же признаках опасности просто выбрасывали свои заметки за борт, дабы избежать подозрений."
 cartographic_survey_events.33.title: "Туман срывает экспедицию"
 cartographic_survey_events.33.desc: "Утром второго дня поднялся туман, простоявший в итоге целых три недели. Не имея возможности разглядеть прибрежные воды за этой густой пеленой, картографы провели всё это время за игрой в кости и нытьём о плохой погоде. Провизия была на исходе, и [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'решила', 'решил' )] досрочно прекратить экспедицию, чтобы не тратить наши ресурсы понапрасну. В результате карты так и не были закончены, а замеры глубин остались без проверки. Конечно же, по закону подлости спустя всего день после отплытия туман рассеялся."
 cartographic_survey_events.33.a: "Нам придётся смириться с этой неудачей."
 cartographic_survey_events.33.historical_info: "До появления современных инструментов прибрежные туманы постоянно мешали работе разведывательных судов. Гидрографические методы того времени требовали ясной погоды, чтобы исследователи могли чётко видеть береговые ориентиры с борта корабля. В связи с этим экспедиции в туманных регионах вроде Ньюфаундленда, Северного моря и Северо-Западной части Тихого океана зачастую проводили большую часть времени в ожидании хорошей погоды, нежели чем за самими исследованиями."
