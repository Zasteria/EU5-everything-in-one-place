l_russian:
 cartographic_survey_events.1.title: "Картографическая комиссия"
 cartographic_survey_events.1.desc: "Приказ отдан. Небольшая флотилия из двух-трёх судов, с картографами, хранителями инструментов и назначенным капитаном, пройдёт вдоль всего нашего побережья и вернётся с картами, годными на будущее столетие. Большая часть того, что нам известно о собственных берегах, происходит от местных лоцманов и купеческих слухов. После этой экспедиции появятся карты, где чернилами будут нанесены все гавани [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')], опасности для мореходов и бухты контрабандистов. Вопрос лишь в том, каким снаряжением оснастить это плавание."
 cartographic_survey_events.1.a: "Закупить лучшие инструменты и нанять самых опытных картографов."
 cartographic_survey_events.1.b: "Излишества тут ни к чему. С этой задачей справится даже неискушённый экипаж."
 cartographic_survey_events.1.historical_info: "Систематическое исследование побережий получило широкое развитие в XVI веке — объёмы морской торговли стремительно росли, и точность карт превратилась в вопрос государственной важности. #italic Каса-де-Контратасьон#! в Севилье и португальский #italic Арсенал Гвинеи и Индии#! содержали целый штат официальных картографов, в обязанности которых входило составление и постоянное обновление морских карт. В XVII веке их примеру последовали нидерландские адмиралтейства."
 # GOOD events: material-specific
 cartographic_survey_events.10.title: "Рыбные банки нанесены на карту"
 cartographic_survey_events.10.desc: "Съёмочное судно провело три недели, работая с местными рыбаками в окрестностях [target_location.GetName], промеряя глубины над крупными рыбными банками, отмечая пути сезонных ходов рыбы и записывая течения, которые приводят лодки домой до перемены погоды. Картографы составили рабочий лист, где указаны глубины, состав дна и привычные рыболовные сезоны. Один из местных лоцманов замечает, что провёл на этих промыслах всю жизнь, но никогда не видел их изображёнными так ясно."
 cartographic_survey_events.10.a: "Передадим этим карты рыбацким деревням."
 cartographic_survey_events.10.historical_info: "Доиндустриальное рыболовство опиралось на устные знания, передаваемые внутри рыбацких семей и гильдий. Переход к нанесённым на карты промысловым угодьям — с отмеченными банками, изобатами и записанными сезонными закономерностями — был медленным процессом, ускорившимся в семнадцатом и восемнадцатом веках с развитием государственной гидрографии."
 cartographic_survey_events.11.title: "Лесные угодья на побережье"
 cartographic_survey_events.11.desc: "Землемеры объехали прибрежные леса [target_location.GetName] вместе с лесничими и старшими корабельными мастерами, отмечая лучшие рощи мачтовой сосны и корабельного дуба, нанося на карту ручьи, по которым можно сплавлять брёвна к погрузочным берегам, и записывая сезоны, когда древесина лучше всего поддаётся пиле. Корабельный инженер, вызванный с верфи для осмотра наиболее перспективного участка, объявляет его пригодным для килевого леса и шпангоутов высшего класса."
 cartographic_survey_events.11.a: "Оставим лучший лес для нужд #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого#! флота"
 cartographic_survey_events.11.historical_info: "Корабельный лес — особенно дуб, необходимый для шпангоутов линейных кораблей, и высокая сосна для мачт — был стратегическим товаром в эпоху парусного флота. Английская, французская и голландская короны вели учёт прибрежных лесов и объявляли лучшие участки коронной собственностью, устанавливая строгие правила рубки, сушки и перевозки."
 cartographic_survey_events.12.title: "Опись солончаков"
 cartographic_survey_events.12.desc: "Разведчики составили подробную карту всех солончаков, солёных источников и отмелей вдоль побережья близ [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Кроме того, исследователи провели учёт солеваров, уточнили рабочие сезоны, а также опросили местных торговцев насчёт цен, спроса и маршрутов, по которым [ShowGoodsNameWithNoTooltip('salt')|l] поступает в страну. Полученные ими сведения проливают свет на прибрежную экономику, о которой [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] до сих пор почти ничего не знали и которая могла бы принести в казну огромную прибыль, если бы её участники вместе со всеми платили соляной налог."
 cartographic_survey_events.12.a: "Эти карты помогут нам взять под контроль торговлю солью."
 cartographic_survey_events.12.historical_info: "Прибрежная добыча соли путём солнечного выпаривания практиковалась с античных времён по всему Средиземноморью, а также на атлантическом побережье Франции, Португалии и Иберии. Бухта Бургнёф, остров Ре и солончаки полуострова Сетубал были крупнейшими промышленными соляными районами доиндустриальной Европы, снабжавшими солью треску Северной Атлантики и мясозаготовительную торговлю всего континента."
 cartographic_survey_events.13.title: "Обнаружены жемчужные месторождения"
 cartographic_survey_events.13.desc: "Съёмка обнаружила и нанесла на карту местные отмели [ShowGoodsName('pearls')] в [target_location.GetName], при содействии семей ныряльщиков, добывающих жемчуг в этих водах уже много поколений. На карте отмечены глубины, сезоны сбора, обычные границы между соперничающими общинами ныряльщиков, а также пути, которыми добыча попадает к городским огранщикам. Ювелир, приглашённый осмотреть образец улова этого сезона, признал жемчужины необычайно чистого блеска."
 cartographic_survey_events.13.a: "[ShowGoodsNameWithNoTooltip('pearls')] такого качества должны находиться под [ROOT.GetCountry.GetGovernment.GetAdjective] надзором."
 cartographic_survey_events.13.historical_info: "Европейские жемчужные промыслы были скромны по сравнению с великими отмелями Персидского залива и Шри-Ланки, однако воды Гебридских островов, Вислы, а также побережья Бретани и Уэльса давали пресноводный и морской жемчуг товарного качества. Шотландская корона удерживала королевскую монополию на добычу жемчуга из некоторых речных систем начиная со средневековья, а венецианский Сенат регулировал сбор в Адриатике."
 cartographic_survey_events.14.title: "Составлена карта виноградного побережья"
 cartographic_survey_events.14.desc: "Съёмщики объездили прибрежные холмы в [target_location.GetName] вместе с виноделами, отмечая лучшие склоны для лозы, преобладающие ветра, от которых плод зреет или гниёт, а также погрузочные пляжи, откуда бочки отправляют на экспорт. Торговцы [ShowGoodsName('wine')], обычно народ скрытный, оказались неожиданно полезны, поняв, что более точные карты означают лучшее время для отправки товара."
 cartographic_survey_events.14.a: "Торговцам вином определённо пригодятся эти карты."
 cartographic_survey_events.14.historical_info: "Морская торговля вином была экономической основой таких областей, как долина Гаронны, долина Дору, Эгейские острова и далматинское побережье. Сроки сбора урожая, время отправки судов и качество гаваней определяли, дойдёт ли годовой урожай до рынка в надлежащем состоянии. Картография винодельческих побережий поэтому представляла значительный коммерческий интерес, и крупные виноторговцы Бордо и Порту веками хранили собственные частные собрания карт."
 cartographic_survey_events.15.title: "Обследовано побережье красителей"
 cartographic_survey_events.15.desc: "Наши исследователи составили подробные карты побережья вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName], где добывают #TOOLTIP:GOODS,dyes,X #L красители#!#!. Здесь они обнаружили колонии мурексов, скальные рощи кермесового дуба, места произрастания индиго и другие источники природных красителей, за которые торговцы #TOOLTIP:GOODS,cloth,X #L текстилем#!#! готовы заплатить высокую цену. Среди прочего, картографы указали сезоны и традиционные места добычи красителей, а также маршруты, которыми их привозят в центры текстильной промышленности."
 cartographic_survey_events.15.a: "Отправим эти карты в деревни и текстильные мастерские."
 cartographic_survey_events.15.historical_info: "Красители до эпохи синтетики были стратегическим товаром на протяжении Средневековья и раннего Нового времени. Тирский пурпур из раковин багрянок, кермесовый красный из щитовок, обитающих на дубах, индиго из индигоферы и вайда из листьев вайды красильной — у каждого была своя география производства, а торговля тканями зависела от надёжности цепочек поставок от мест сбора до текстильных городов."
 cartographic_survey_events.16.title: "Нанесено на карту побережье [ShowGoodsNameWithNoTooltip('amber')]"
 cartographic_survey_events.16.desc: "Съёмка нанесла на карту пляжи в [target_location.GetName], куда после штормов прибивает [ShowGoodsName('amber')], определив прибрежные полосы, стоящие разработки, сезоны, когда прибой выносит смолу на берег, а также местные обычаи раздела добычи. Городские резчики по [ShowGoodsNameWithNoTooltip('amber')], издавна платившие премию за камни наилучшей чистоты, заплатят ещё больше, зная, какие пляжи дают какой сорт."
 cartographic_survey_events.16.a: "Взять лучшие прибрежные полосы под [ROOT.GetCountry.GetGovernment.Custom('CL_INST')] управление."
 cartographic_survey_events.16.historical_info: "Балтийское побережье янтаря, от Самбийского полуострова до восточного побережья Померании, было главным источником янтаря для европейских ремёсел с античных времён. Тевтонский орден, как известно, жёстко удерживал монополию на добычу янтаря, назначая суровые кары за несанкционированный сбор. Янтарные пути связывали балтийское побережье с мастерскими Богемии, Италии и Константинополя на протяжении более тысячи лет."
 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "Укрытая гавань"
 cartographic_survey_events.20.desc: "Судно съёмочной партии обогнуло низкий мыс в [target_location.GetName] и встало на якорь в защищённых водах, которыми местные рыбаки пользуются уже много поколений, но которые не значатся ни на одной существующей карте. Глубина здесь держится ровной — четыре сажени над песчаным дном, — господствующие ветра безобидно разбиваются о внешний риф, а местный лоцман сообщает, что суда любой разумной осадки могут стоять здесь в любую погоду. При надлежащих промерах и створных знаках эта гавань станет пригодной и для более крупных судов."
 cartographic_survey_events.20.a: "Нанесём бухту на карту и подготовим её к использованию."
 cartographic_survey_events.20.historical_info: "Местные рыбаки нередко знали об укрытых якорных стоянках, не значившихся ни на одной официальной карте: эти знания передавались из поколения в поколение как практическое лоцманское искусство, а не как письменные записи. Государственные гидрографические съёмки нарочно опрашивали таких лоцманов, и внесение ранее неотмеченной гавани в официальные лоции было обычным итогом доиндустриальных прибрежных изысканий."
 cartographic_survey_events.21.title: "Проход через риф"
 cartographic_survey_events.21.desc: "Картографы провели две недели, промеряя лотлинём прибрежный риф в [target_location.GetName], который всегда считался непроходимым. Они нашли проход: тридцать футов в самом узком месте, четыре сажени глубины при малой воде, проходимый в любую погоду при верно выставленных створных вехах на мысе позади. Местный лоцман, как выяснилось знавший об этом проходе уже тридцать лет и никому о нём не сказавший, берёт небольшую плату за его разметку."
 cartographic_survey_events.21.a: "Нанесём канал на карту и отметим ориентиры."
 cartographic_survey_events.21.historical_info: "Прибрежные рифы, скрывающие судоходные проходы, были обычным явлением в доиндустриальном мореплавании. Метод створных вех, при котором судно подходит к проходу по пеленгу двух приметных береговых ориентиров, выстроенных один за другим, был стандартным способом разметки такого прохода, а знание подобных створов зачастую составляло тщательно хранимую тайну местного лоцманского промысла."
 cartographic_survey_events.22.title: "Давно обжитая бухта"
 cartographic_survey_events.22.desc: "Съёмочная партия обнаружила укрытую бухту в [target_location.GetName] в нескольких лигах от ближайшего официального порта. На дне видны свежие следы от якоря, на скалах над берегом — старые отметины от того, как по ним катали бочки, а местные рыбацкие дети при расспросах едва сдерживают улыбку. Эта бухта годами использовалась для неофициальной торговли. Теперь, когда её существование внесено в официальные записи, бухту можно обратить к законному делу — или хотя бы поставить под таможенный надзор, приносящий доход."
 cartographic_survey_events.22.a: "Занести бухту в записи и разместить там небольшой таможенный пост."
 cartographic_survey_events.22.historical_info: "Контрабандистские бухты были неотъемлемой чертой европейского побережья с античности до раннего индустриального периода. Появление береговой охраны, таможенных катеров и систематического картографирования подозрительных мест высадки постепенно вытесняло неофициальную торговлю во всё более мелкие и отдалённые заливы, но по-настоящему затруднить контрабанду в сколько-нибудь заметных объёмах смогли лишь железная дорога, телеграф и паровые патрульные суда."
 # BAD events
 cartographic_survey_events.30.title: "Буря рассеивает съёмочную партию"
 cartographic_survey_events.30.desc: "A storm came up out of the southwest on the third day of the work, drove the survey vessel onto a lee shore for two cold nights of pounding surf, and scattered the boats sent to fetch the chart-makers off the working stations. By the time the wind dropped and the vessel was refloated, the season's working had been lost, the instruments soaked, and two of the boatswain's mates buried in the dunes above the beach. The chart for [target_location.GetName]'s stretch of coast remains as blank as it was before."
 cartographic_survey_events.30.a: "Время уже упущено. Придётся пока оставить эту затею."
 cartographic_survey_events.30.historical_info: "Внезапные шторма были постоянной профессиональной опасностью для мелких прибрежных судов, ведущих съёмку берега. Шкала Бофорта, стандартизированное штормовое предупреждение и систематическое прогнозирование погоды появились лишь в девятнадцатом веке, а до того съёмочное судно, оказавшееся у подветренного берега при усиливающемся ветре, могло полагаться лишь на лотлинь, якорь и выдержку капитана — больше между ним и катастрофой не стояло ничего."
 cartographic_survey_events.31.title: "Посадка на мель, не отмеченную на карте"
 cartographic_survey_events.31.desc: "Съёмочное судно село на мель в районе [target_location.GetName], которую ни одна существующая карта не отмечала — дно резко поднялось прямо под килем почти в тот же миг, когда лотлинь показал четыре сажени. Корпус пробит впереди переборки, и плотник трудится над свинцовыми заплатами и кессоном, пока судно лежит на боку на берегу. Картографы установили свои приборы на песке и трудились день за днём, но съёмка этого участка побережья на этом окончена."
 cartographic_survey_events.31.a: "Корабль вернётся в строй. Главное, что теперь эта отмель есть на наших картах."
 cartographic_survey_events.31.historical_info: "Посадка на неотмеченную мель была обычной бедой доиндустриальной съёмочной работы, и потерпевшие крушение суда нередко давали более точные гидрографические сведения, чем осторожные промерщики, благополучно проходившие вдоль того же берега. Многие лоции отмечали мели по названиям кораблей, их обнаруживших, а положение прежде неизвестного рифа часто наносилось на карту с лаконичной пометкой, что такое-то судно село на него в такой-то год."
 cartographic_survey_events.32.title: "Враждебное судно"
 cartographic_survey_events.32.desc: "Пока наш разведывательный корабль стоял на якоре вблизи [target_location.Custom('LR_GEN')|l] [target_location.GetName], к нему из тумана внезапно направилось вооружённое судно с латинским парусом и без флага. Исследователям пришлось бросить инструменты на берегу и немедленно вернуться на корабль, так и не закончив работу. Неопознанное судно преследовало их ещё полдня, а затем развернулось и, по-видимому, направилось в порт наших неприятелей. В итоге эта часть побережья так и осталась неизученной, и наши картографы вряд ли захотят туда возвращаться."
 cartographic_survey_events.32.a: "Если эти берега стережёт враг, нам там делать нечего."
 cartographic_survey_events.32.historical_info: "Прибрежная съёмка была делом политически щекотливым, поскольку точные карты чужого побережья являлись необходимым условием для военных действий против него. Съёмочные суда, работавшие в спорных водах, регулярно сопровождались вооружёнными кораблями местной державы — иногда их задерживали, иногда просто отпугивали. Гидрографические съёмки английского Адмиралтейства испанского и эгейского побережий в семнадцатом и восемнадцатом веках неоднократно прерывались подобным давлением, и съёмочные команды были обучены при первых признаках досмотра выбрасывать за борт самые важные записи."
 cartographic_survey_events.33.title: "Туман останавливает работу"
 cartographic_survey_events.33.desc: "Туман опустился на второе утро и не рассеивался три недели. Картографы, не имея возможности брать перекрёстные пеленги на береговые ориентиры, скрытые за стеной облаков, коротали время за игрой в кости и жалобами на холод. Запасы подходили к концу; [target_leader.GetName] решил, что дальнейшее ожидание — лишь напрасная трата провизии, и съёмка побережья [target_location.GetName] была прекращена, а карта осталась недочерченной, промеры — непроверенными. Туман, разумеется, рассеялся на следующий день после того, как судно снялось с якоря."
 cartographic_survey_events.33.a: "Смириться с потерей сезона и двигаться дальше."
 cartographic_survey_events.33.historical_info: "Прибрежный туман был постоянным врагом доиндустриальной съёмочной работы. Стандартный гидрографический метод требовал чёткой видимости на неподвижные береговые ориентиры с морских рабочих станций, и продолжительный туман делал всю процедуру невозможной. Съёмочные экспедиции в туманных районах, таких как Ньюфаундленд, Северное море и северо-запад Тихоокеанского побережья, нередко проводили больше времени в ожидании ясной погоды, чем за самой съёмочной работой."
