 pacific_crossing_cargo_loaded_effect: "В трюмы погружены #TOOLTIP:GOODS,silk,X #L шёлк#!#!, #TOOLTIP:GOODS,porcelain,X фарфор#! и пряности — их продадут, когда флот вернётся в родные порты."
 pacific_crossing_events.1.title: "Путь домой"
 pacific_crossing_events.1.desc: "Задача не в том, чтобы просто достичь #TOOLTIP:CONTINENT,asia,X #L Азии#!#!. Корабли уже делали это, увлекаемые на запад пассатами, словно листок — течением ручья. Задача в том, чтобы вернуться. Колония на дальнем берегу этого океана бесполезна, если флот не может из неё вернуться; вся затея зависит от того, найдётся ли надёжный путь домой — такой, по которому корабли могли бы ходить из года в год, увозя #TOOLTIP:GOODS,silver,X #L серебро#!#!, и возвращаясь с #TOOLTIP:GOODS,silk,X #L шёлком#!#!.\n\nПопутный ветер известен и устойчив. Что лежит дальше и даст ли море флоту дорогу назад, не скажет ни одна карта в этой гавани. Лоцманы уверены лишь в одном: путь туда не станет путём домой."
 pacific_crossing_events.1.a: "Снарядим флот побольше, с ещё одним кораблём для предстоящих поисков."
 pacific_crossing_events.1.a.tt: "Ещё один корабль снаряжён и присоединён к флоту (#G +1#! корабль) "
 pacific_crossing_events.1.b: "Запасёмся провизией на переход, а остальное доверим удаче."
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] нанесёт на карту каждый ветер и течение на нашем пути."
 pacific_crossing_events.1.historical_info: "#italic Торнавьяхе#!, обратное плавание на восток, долгое время оставалось главной проблемой первых тихоокеанских экспедиций. Альваро де Сааведра, отплыв из Новой Испании, в 1528 и 1529 годах дважды был вынужден отступить перед пассатами и в итоге погиб в попытках найти путь обратно. В 1542 году Руи Лопес де Вильялобос, добравшись до Азии, также не сумел найти дорогу домой. Пригодный маршрут был найден лишь в 1565 году. До тех пор флоты могли доплыть до Азии, но не имели возможности доставить свой груз назад."
 pacific_crossing_events.2.title: "Острова воров"
 pacific_crossing_events.2.desc: "Недели, когда вокруг не было ничего, кроме воды и неба, заканчиваются, когда дозорный кричит: «Земля!» Это низкий зелёный остров, окружённый белой пеной прибоя. Не успевает флот бросить якорь, как навстречу несутся лодки — стройные аутригеры под треугольными парусами, скользящие с волны на волну так быстро, что лоцманы просто не могут отвести глаз. Островитяне облепляют борта, смеясь и ничего не боясь, и уносят всё, что не привязано. По их понятиям, взять то, что лежит без хозяина, — не воровство; для людей, голодных после месяца в море, это вызов.\n\nНо здесь есть пресная вода, и плоды, и рыба — всё только и ждёт, чтобы его взяли."
 pacific_crossing_events.2.a: "Обменяем бусы, ткань и железо на воду и плоды."
 pacific_crossing_events.2.b: "Возьмём необходимое для кораблей силой. Времени в обрез."
 pacific_crossing_events.2.fight_win_tt: "Островитяне бегут от оружия кораблей, а экипаж без стеснения набирает воду и фрукты."
 pacific_crossing_events.2.fight_lose_tt: "Островитяне оказывают более отчаянное сопротивление, чем ожидалось, и экипаж оказывает отброшен к шлюпкам с пустыми руками."
 pacific_crossing_events.2.c: "Забудем о воде — присмотримся к их быстроходным корпусам и парусам."
 pacific_crossing_events.2.historical_info: "6 марта 1521 года, после более чем трёх месяцев без земли на горизонте, уцелевшие из флота Фернана Магеллана достигли Гуама. Чаморро вышли навстречу на быстрых проа с аутригерами, которые, по словам летописца Антонио Пигафетты, были быстрее всего, на чём когда-либо плавали испанцы. После того как островитяне увели одну из шлюпок, Магеллан назвал архипелаг #italic «островами воров»#! и высадился с вооружённым отрядом за провизией, прежде чем плыть дальше к Филиппинам."
 pacific_crossing_events.3.title: "Сорок дней пустоты"
 pacific_crossing_events.3.desc: "Ни земли, ни птиц, ни даже клочка водорослей на воде. Экипаж уже много недель в море, и с каждой неделей уверенность лоцмана тает. У людей кровоточат дёсны и шатаются зубы; один клянётся, что старая рана, много лет как зажившая, снова открылась. Бочки с водой почти пусты, а в сухарях больше долгоносиков, чем хлеба. Ветер ровный и прохладный, но он несёт их всё глубже в океан, которому не видно конца.\n\nКапитан сохраняет невозмутимый вид и ровный голос, отсчитывает дни на карте и не говорит ничего, во что сам не верит."
 pacific_crossing_events.3.a: "Урежем пайки. Мы вытерпим всё, что должны."
 pacific_crossing_events.3.b: "Курс верен. Земля впереди — держим курс."
 pacific_crossing_events.3.c: "Призовём людей к порядку: слово капитана — закон!"
 pacific_crossing_events.4.title: "Земля за Западным морем"
 pacific_crossing_events.4.desc: "Спустя долгое время после того, как Острова воров остались позади, дозорный видит сквозь утреннюю дымку зелёные холмы. Когда флот входит в большую бухту, становится ясно, что берег этот не пуст. На холме над водой раскинулось поселение с побелёнными стенами и крышами, покрытыми пальмовыми листьями. К кораблям отчаливают аутригеры с людьми в цветных тканях, не проявляющими никакого беспокойства.\n\nСамый крупный из них, с золотом на шее, обращается к нам, используя [location.GetDominantCulture.GetLanguage.GetName] язык, которого не знает ни один из лоцманов; он жестом указывает на берег с непринуждённостью человека, часто торгующего с чужеземцами. У этих островов есть свой собственный мир — и через них уже проходит торговый путь, по которому доставляются #TOOLTIP:GOODS,silk,X #L шёлк#!#! и #TOOLTIP:GOODS,porcelain,X фарфор#! из далекого Катая."
 pacific_crossing_events.4.desc.owned: "Спустя долгое время после того, как Острова воров остались позади, дозорный видит сквозь утреннюю дымку зелёные холмы — а затем над поселением на холме различает цвета наших собственных флагов. Флот наткнулся не на неведомый берег, а вошёл в собственную гавань: [pacific_colony.GetName], владение нашей короны, чьи причалы и склады уже работают.\n\nНавстречу кораблям выходят лодки с соотечественниками на борту, изумлённо глядящими на флот, возникший из пустого океана на востоке. Здесь экипаж может спокойно пополнить запасы воды и провианта и погрузить #TOOLTIP:GOODS,silk,X #L шёлк#!#! и #TOOLTIP:GOODS,porcelain,X фарфор#!, которые китайские купцы привозят к нашим причалам."
 pacific_crossing_events.4.desc.hostile: "Спустя долгое время после того, как Острова воров остались позади, дозорный видит сквозь утреннюю дымку зелёные холмы — а затем чужой флаг над укреплением у самой воды. Другая держава добралась до этих островов раньше. Когда флот входит в бухту, [pacific_rival_shore.GetName] выставляет вдоль стен пушки, а вооружённые лодки направляются к кораблям, чтобы выяснить, зачем мы здесь.\n\nТеперь этой землёй владеет [pacific_rival.GetName], и встреча будет в лучшем случае настороженной. Шёлк и фарфор из Катая по-прежнему поступают на архипелаг, но через руки наших соперников, а не напрямую к нам."
 pacific_crossing_events.4.a: "Откроем торговлю проходящими через эти воды шёлком и фарфором."
 pacific_crossing_events.4.b: "Совершим набег на поселение и возьмём воду и провиант силой."
 pacific_crossing_events.4.b.raid_win_tt: "Жители бегут вглубь острова, а команды опустошают поселение, забирая еду и воду."
 pacific_crossing_events.4.b.raid_lose_tt: "Жители бьются за свои дома и отгоняют налётчиков к шлюпкам — с пустыми руками и в крови."
 pacific_crossing_events.4.d: "Погрузим сезонные товары с наших собственных складов."
 pacific_crossing_events.4.e: "Дадим экипажам отдых и снаряжение в нашем собственном порту."
 pacific_crossing_events.4.f: "Будем осторожно вести дела с посредниками соперника под прицелом их пушек."
 pacific_crossing_events.4.g: "Прорвёмся на якорную стоянку и возьмём необходимое силой."
 pacific_crossing_events.4.h: "Обойдём их орудия стороной и сохраним курс."
 pacific_crossing_events.4.raid_win_tt: "Аванпост взят штурмом, его запасы разграблены; экипажи торжествуют."
 pacific_crossing_events.4.raid_lose_tt: "Штурм отбит с потерями, и повреждённый корабль приходится бросить."
 pacific_crossing_events.4.historical_info: "Руи Лопес де Вильялобос, прибывший из Новой Испании в 1542 году, назвал архипелаг #italic Las Islas Filipinas#! в честь наследника испанского престола, будущего Филиппа II. Прочное испанское присутствие началось лишь в 1565 году, когда Мигель Лопес де Легаспи основал первое поселение на Себу; в 1571 году он отвоевал Манилу у раджи Сулеймана и сделал её столицей Испанской Ост-Индии и западной конечной точкой галеонной торговли."
 pacific_crossing_events.5.title: "Остров гвоздики"
 pacific_crossing_events.5.desc: "Запах достигает флота раньше, чем остров: ветру чувствуется сладость тяжёлая, резкая и пряная. Единственный вулканический пик, увенчанный облаком, зелёный до самой воды. Гавань полна малайских и яванских проа, а с якорной стоянки отчётливо виден дворец, где живёт [target_owner.Custom('GetRulerOrRegentTitle')] [target_owner.Custom('CL_GEN')|l].\n\nКаждый торговец в #TOOLTIP:LOCATION,lisbon,X #L Лиссабоне#!#! и #TOOLTIP:LOCATION,sevilla,X #L Севилье#!#! платит целое состояние за этот аромат, даже не зная, откуда он родом. Никто на этих кораблях ещё не стоял так близко к источнику — деревьям над бухтой, на ветвях которых тяжело висит ещё не созревшая #TOOLTIP:GOODS,cloves,X гвоздика#!. Одна партия этого груза стоит больше, чем обошлось всё плавание. Трюмы можно заполнить прямо здесь. Остаётся лишь довезти товар домой."
 pacific_crossing_events.5.desc_known: "Запах достигает флота раньше, чем остров: ветру чувствуется сладость тяжёлая, резкая и пряная. Единственный вулканический пик, увенчанный облаком, зелёный до самой воды. Гавань полна малайских и яванских проа, а с якорной стоянки отчётливо виден дворец, где живёт [target_owner.Custom('GetRulerOrRegentTitle')] [target_owner.Custom('CL_GEN')|l].\n\nКаждый торговец в #TOOLTIP:LOCATION,lisbon,X #L Лиссабоне#!#! и #TOOLTIP:LOCATION,sevilla,X #L Севилье#!#! знает этот аромат и платит за него целое состояние. Никто на этих кораблях ещё не стоял так близко к источнику — деревьям над бухтой, на ветвях которых тяжело висит ещё не созревшая #TOOLTIP:GOODS,cloves,X гвоздика#!. Одна партия этого груза стоит больше, чем обошлось всё плавание. Трюмы можно заполнить прямо здесь. Остаётся лишь довезти товар домой."
 pacific_crossing_events.5.desc.driven_back: "Острова пряностей вновь возвышаются перед кораблём — тот же зелёный пик, та же людная якорная стоянка — и вместе с ними приходит горькое осознание того, что флот был вынужден вернуться обратно к месту отправления, а путь домой по-прежнему не найден. Пассаты не оставили кораблям иного выбора, кроме как вернуться к этим берегам.\n\nСейчас жизнь на стоянке превратилась в мрачную рутину. Острова снова дадут воду и пищу; больных можно высадить на берег, командам дать отдых, трюмы пополнить всем, что корабли ещё способны увезти. Но каждый на борту знает, что их ждёт: флоту придётся собраться с силами и снова выйти в море, чтобы попытаться найти путь домой, и таких попыток у него остаётся немного."
 pacific_crossing_events.5.a: "Заполним трюмы гвоздикой. Погрузим все бочки до последней."
 pacific_crossing_events.5.b: "Снабдим корабли провиантом для долгого плавания домой."
 pacific_crossing_events.5.c: "Дадим экипажу отдохнуть и набраться сил на берегу."
 pacific_crossing_events.5.d: "Оставим поиски и пойдём домой долгим путём вокруг мыса."
 pacific_crossing_events.5.historical_info: "Португальские мореплаватели достигли Молуккских островов в 1512 году, где Франсишку Серран стал советником султана Тернате. Уцелевшие корабли Магеллана погрузили гвоздику в соперничающем султанате Тидоре в 1521 году. Испано-португальское соперничество за острова было разрешено Сарагосским договором 1529 года, по которому император Карл V, стеснённый в деньгах, продал Португалии притязания Испании на Молуккские острова за 350 000 дукатов."
 pacific_crossing_events.6.title: "Путь домой"
 pacific_crossing_events.6.desc: "Трюмы заполнены, и лёгкая половина плавания осталась позади. Теперь флоту предстоит сделать то единственное, чему не научит ни одна карта: найти дорогу обратно через только что пересечённый океан. Ветер, так мягко несший корабли на запад, теперь дует прямо в лоб, и каждый лоцман за столом знает, что это значит.\n\nОфицеры флота засиживаются над картами допоздна, и на этот раз лоцманы не могут прийти к согласию. У каждого есть свой курс, который он отстаивает, и своя причина опасаться остальных, и за пределами известного моря никто из них не может обещать, куда всё это приведёт, — есть лишь догадки и смелость поставить на них. Решение принадлежит одному лишь капитану, и судьба каждой живой души на борту зависит от курса, который он выберет."
 pacific_crossing_events.6.desc.driven_back: "Офицеры флота вновь собрались, и атмосфера за столом резко ухудшилась. Был выбран курс, но океан отверг его; флот пробивался сюда всю дорогу, чтобы в итоге получить лишь этот урок. Оставшиеся варианты пока что остаются лишь гипотезами — не более проверенными, чем раньше, — а кораблей и людей осталось слишком мало, чтобы ими рисковать.\n\nЛоцманы перестали повышать голос. Каждый склонившийся над картой знает, что нельзя раз за разом бросать вызов этому морю без потерь. Нужно вновь проложить курс из этих вод, и шансов на выбор останется не так уж много."
 pacific_crossing_events.6.a: "Северный путь: держаться берега Азии, а затем идти на восток."
 pacific_crossing_events.6.a.tt: "Пойдём на север вдоль берегов #TOOLTIP:REGION,japan_region,X $tt_op_L$Японии$tt_cl_2$ и дальше, а затем пусть западные ветры высоких широт пронесут флот через весь океан и приведут домой, в #TOOLTIP:CONTINENT,america,X $tt_op_L$Америку$tt_cl_2$."
 pacific_crossing_events.6.b: "Срединный путь — плыть на восток против пассатов."
 pacific_crossing_events.6.b.tt: "Пойдём строго на восток, прямо навстречу пассатам, через уже знакомые острова. Этот ветер отбрасывал каждый флот, пытавшийся здесь пройти, так что стоит ожидать, что нас отбросит обратно до самых Островов пряностей."
 pacific_crossing_events.6.c: "Дальний южный путь: огромная дуга, долгая, но открытая."
 pacific_crossing_events.6.c.tt: "Пойдём далеко на юго-восток по усеянному островами южному океану. Проход там вполне может найтись, но путь невероятно долог, и провианта флота может не хватить до конца."
 pacific_crossing_events.6.historical_info: "Все попытки плыть на восток от Азии вдоль тропиков терпели неудачу. #italic «Тринидад»#! Гонсало Гомеса де Эспиносы, пытавшийся вернуться в Новую Испанию в 1522 году, был отброшен назад и захвачен португальцами; Альваро де Сааведра потерпел неудачу дважды — в 1528 и 1529 годах. В 1565 году августинский монах Андрес де Урданета преуспел, уйдя далеко на север — примерно до сорока градусов широты, — чтобы поймать течение Куросио и западные ветры, а затем пересёк с их помощью северную часть Тихого океана до Калифорнии и спустился к Акапулько. Его маршрут служил манильским галеонам следующие два с половиной столетия."
 pacific_crossing_events.7.title: "Тихий океан"
 pacific_crossing_events.7.desc: "Ветер стихает. Паруса безжизненно обвисли, море гладкое, словно стекло, до самого горизонта, а корабли недвижимо стоят под белым, раскалённым небом. Именно за такое затишье океан и получил название «тихого» — за ту самую безмятежность, которая не раз приводила экипажи к голодной смерти.\n\nВода в бочках становится тёплой и затхлой. Каждый безветренный день — это потраченный впустую паёк, и люди это понимают. Они смотрят на пустые снасти и горизонт, и уже дважды кричали «земля!» при виде гряды облаков, растаявшей без следа. Праздные руки на застрявшем в штиле судне редко остаются без дела надолго."
 pacific_crossing_events.7.a: "Подождём, экономя каждую каплю и крошку. Ветер вернётся."
 pacific_crossing_events.7.b: "Спустим шлюпки и будем буксировать корабли, пока не вернётся ветер."
 pacific_crossing_events.7.c: "Зыбь движется на юго-восток — дрейфуем вместе с ней навстречу ветру."
 pacific_crossing_events.8.title: "Возвращение галеона"
 pacific_crossing_events.8.desc: "Зафрахтованный галеон вернулся домой. После нескольких месяцев плавания по длинной северной дуге он входит на рейд, тяжело нагруженный сокровищами #TOOLTIP:CONTINENT,asia,X #L Азии#!#!, которые проделали путь через весь океан и благополучно прибыли на берег. Ещё до того, как он бросил якорь, причалы наполнились агентами и покупателями. Маршрут оправдал себя, и дело принесло прибыль; в следующем году и через год по нему отправятся новые галеоны."
 pacific_crossing_events.8.a: "Целое состояние благополучно доставлено на берег."
 pacific_crossing_events.8.historical_info: "Манильский галеон ходил по маршруту Акапулько — Манила почти ежегодно с 1565 по 1815 год, став одной из самых долговечных судоходных линий в истории. Он вёз американское серебро на запад, а китайские шёлк, фарфор и пряности — на восток; груз одного галеона мог принести инвесторам целое состояние. Эта торговля связала серебро Америки с рынками Китая и превратила Тихий океан в магистраль мировой торговли."
 pacific_crossing_events.9.title: "Знакомый берег"
 pacific_crossing_events.9.desc: "Долгий путь на север, в холодные серые воды, а затем бесконечная дуга на восток через пустой океан заканчивается, когда дозорный наконец замечает высокий, покрытый лесом берег и мысы, уходящие на юг под слоем тумана. Это не #TOOLTIP:CONTINENT,asia,X #L Азия#!#! и не какой-нибудь остров — это западный берег самой #TOOLTIP:CONTINENT,america,X #L Америки#!#!. Флот пересёк [ShowContinentName('pacific_ocean_continent')] и вышел к ближней стороне мира, и теперь ему остаётся лишь идти на юг вдоль побережья, уже знакомого по картам, чтобы достичь дружественной гавани.\n\nДорога домой найдена. Остаётся лишь пройти её до конца."
 pacific_crossing_events.9.a: "Пойдём на юг к дому вдоль знакомого берега."
 pacific_crossing_events.9.b: "Сначала зайдём пополнить запасы воды и отдохнуть — люди это заслужили."
 pacific_crossing_events.9.historical_info: "Во время обратного плавания 1565 года экспедиция Андреса де Урданеты вышла на американский берег у побережья Калифорнии, недалеко от мыса Мендосино, после примерно четырёх месяцев плавания в открытом северном Тихом океане. Оттуда #italic «Сан-Педро»#! направился на юг и 8 октября 1565 года достиг Акапулько, подтвердив возможность прохождения этого маршрута. Северная дуга стала стандартным маршрутом возвращения манильских галеонов."
 pacific_crossing_events.10.title: "Море поднимается"
 pacific_crossing_events.10.desc: "Небо приобретает цвет синяка, а ветер обрушивается, словно стена. Уже через час флот сражается за свою жизнь — волны вздымаются выше главной реи, зелёная вода хлещет через борт, паруса разрываются с треском, похожим на выстрелы. Корабли с трудом пробиваются сквозь волны и качаются из стороны в сторону, и в мраке они один за другим теряются из виду. Лоцманы ничего не могут поделать, кроме как держаться и считать часы.\n\nВыбор есть, но времени на раздумья нет: убрать паруса и переждать шторм там, где корабли находятся сейчас, или бежать от него в темноту в надежде, что корабли выдержат."
 pacific_crossing_events.10.a: "Ляжем в дрейф и переждём бурю с убранными парусами."
 pacific_crossing_events.10.b: "Пойдём по ветру и будем молиться, чтобы корпуса выдержали."
 pacific_crossing_events.10.weathered_tt: "Флот выходит из шторма потрёпанным, но целым."
 pacific_crossing_events.10.foundered_tt: "Один корабль уходит под воду и гибнет со всеми на борту."
 pacific_crossing_events.11.title: "Сырой лес"
 pacific_crossing_events.11.desc: "Корабли спешно построили на новых верфях американского тихоокеанского побережья из дерева, которое не успело просохнуть, силами корабелов, никогда не строивших для такого океана. Теперь море взыскивает долг. Доска расходится по шву в средней части корпуса; конопатка выбивается; под палубой люди стоят в прибывающей воде, а помпы стучат день и ночь, не справляясь с работой. Лицо плотника говорит само за себя.\n\nТак продолжаться не может, а ближайшая суша — на другой половине океана."
 pacific_crossing_events.11.a: "Займёмся кренгованием и всё починим."
 pacific_crossing_events.11.b: "Посменно встанем к помпам и пойдём дальше, несмотря ни на что."
 pacific_crossing_events.11.c: "Бросим разваливающееся судно, а его экипаж разместим на остальных кораблях."
 pacific_crossing_events.12.title: "Дар моря"
 pacific_crossing_events.12.desc: "Всё начинается с дельфинов — огромной стаи, гонящей что-то перед собой к кораблям. Затем само море словно вспыхивает: на поверхность поднимается гигантский косяк рыбы — акры серебра, сверкающие и бурлящие вокруг корпусов, зажатые кружащими дельфинами так тесно, что под ними почти не видно воды.\n\nЭкипажу не нужен приказ. За борт идут шлюпки, следом — лини и сети, а люди, свесившись с перил, вытаскивают рыбу охапками на палубы, которые быстро оказываются заваленными и скользкими от улова. После недель сухарей и солёного мяса это одновременно пир, нежданная удача и милость."
 pacific_crossing_events.12.a: "Спустим все шлюпки и снасти — возьмём всё, что сможем вытащить."
 pacific_crossing_events.12.b: "Быстро наловим рыбы — и снова в путь."
 pacific_crossing_events.13.title: "Гнилые припасы"
 pacific_crossing_events.13.desc: "Стюард приходит к капитану, комкая шляпу в руках. В трюме целые ярусы бочек вскрыты и признаны негодными: солёное мясо плохо просолено, сухари упакованы сырыми, и вода протухла в бочках, которые никто не удосужился как следует подготовить. Провиант, погруженный в спешке и закупоренный влажным в портах отправления, сгнил в тропической жаре, и то, что должно было кормить команду неделями, обернулось вонючей, кишащей червями потерей.\n\nЗдесь нет рынка и вторых шансов — только испорченные запасы и голодные люди."
 pacific_crossing_events.13.a: "Выбросим испорченные припасы за борт и смиримся с потерей."
 pacific_crossing_events.13.b: "Всё равно раздадим пайки — будут есть то, что найдётся."
 pacific_crossing_events.17.title: "Потерянные в море"
 pacific_crossing_events.17.desc: "Сообщения, когда они наконец поступают, представляют собой лишь обрывки информации — имя, дату, последний известный курс. Флот, отплывший на поиски пути домой, так и не нашёл его. Поглотил ли корабли шторм, вынесло ли их на какой-нибудь безымянный риф, или они просто дрейфовали, пока не кончилась вода, а вместе с ней и люди, — никто не скажет наверняка. Океан оставил их себе.\n\nДорога домой остаётся ненайденной. Где-то там ветер всё ещё дует не в ту сторону."
 pacific_crossing_events.17.a: "Они не будут последними, кого мы потеряем в этом океане."
 pacific_crossing_events.17.end_tt: "Экспедиция погибла, и её плавание заканчивается здесь."
 pacific_crossing_events.17.historical_info: "Восточный океан унёс жизни многих, кто пытался его преодолеть. Командир экспедиции Гарсия Хофре де Лоайса и кругосветный мореплаватель Хуан Себастьян Элькано погибли во время пересечения Тихого океана в 1526 году; Альваро де Сааведра погиб в открытом океане в 1529 году, пытаясь вернуться; а Фердинанд Магеллан был убит на Мактане в 1521 году. Из примерно 270 человек, покинувших Испанию вместе с Магелланом, только восемнадцать вернулись на борту #italic «Виктории»#!."
 pacific_crossing_events.18.title: "Экипаж бунтует"
 pacific_crossing_events.18.desc: "Люди так больше не могут. Урезанные пайки, бескрайний океан и курс, за который, кроме лоцманов, никто не поручится, — всё это довело экипаж до состояния, когда он уже не способен подчиняться. На корме собирается горстка угрюмых вооружённых матросов, которые ясно излагают своё требование: развернуть флот, иначе они сделают это сами. Офицеров мало, а их много, и мушкеты теперь не только у одной стороны.\n\nЧто бы мы ни решили сейчас, это дорого обойдётся флоту."
 pacific_crossing_events.18.desc.last_ship: "Люди так больше не могут. От флота остался один корабль, и на его тесной, зловонной палубе офицеру негде спрятаться. Зачинщики идут на корму всей толпой и на этот раз не просят — они с ужасающей простотой говорят капитану правду об их положении: бежать на другой корабль некуда, морских пехотинцев не позвать, а за бортом — бескрайний океан. Поворачивайте домой сейчас, говорят они, иначе вас выбросят за борт.\n\nЛоцманы замолчали. Капитан стоит один у борта, за его спиной — море, и он должен ответить."
 pacific_crossing_events.18.a: "Уступим: пусть зачинщики возьмут корабль и повернут назад."
 pacific_crossing_events.18.b: "Подавим бунт силой. Повесим зачинщиков и поплывём дальше."
 pacific_crossing_events.18.c: "Напомним им, что ждёт дома, и кто ведёт их туда."
 pacific_crossing_events.18.fight_win_tt: "Мятеж подавлен, порядок восстановлен (боевой дух экипажа #G +5#!)"
 pacific_crossing_events.18.fight_lose_tt: "Схватка становится кровавой, и в хаосе гибнет один из кораблей."
 pacific_crossing_events.18.overboard_tt: "Мятежники одолевают офицеров, и [target_leader.GetName] летит в море. Плавание заканчивается здесь."
 pacific_crossing_events.19.title: "Острова воров (снова)"
 pacific_crossing_events.19.desc: "Идя на восток против ветра, флот не может удержать курс, и наконец перед его носом вновь оказываются низкие зелёные острова [ShowLocationName('guahan')], те самые берега, которые мы оставили позади после форсирования. Проа выскальзывают навстречу, как и прежде, настороженные и любопытные, а их команды разглядывают чужаков, вернувшихся из пустого океана ни с чем. Что бы здесь ни случилось в первый раз, островитяне это помнят."
 pacific_crossing_events.19.desc.friendly: "Идя на восток против ветра, флот не может удержать курс, и наконец перед его носом вновь оказываются низкие зелёные острова [ShowLocationName('guahan')]. На этот раз проа выходят без страха: островитяне помнят честный торг, и среди них есть лица, которые кажутся экипажу знакомыми. Люди поднимают товары, обмениваются жестами и вполне ясно обещают воду и свежую пищу.\n\nФлоту нужно и то и другое, причём отчаянно. Хорошие отношения, как оказывается, ценятся здесь больше любой карты."
 pacific_crossing_events.19.desc.hostile: "Идя на восток против ветра, флот не может удержать курс, и наконец перед его носом вновь оказываются низкие зелёные острова [ShowLocationName('guahan')]. Но проа теперь собираются большими группами, и в них не слышно смеха: островитяне не забыли набег и ждали нас. Вдоль берега щетинятся копья, а якорная стоянка, которая прежде щедро давала воду, теперь не выглядит дружелюбной.\n\nФлоту всё равно нужны вода и пища, и люди знают, что брать их придётся у народа, который готов к встрече."
 pacific_crossing_events.19.a: "Снова поторгуем с людьми, у которых о нас хорошие воспоминания."
 pacific_crossing_events.19.b: "Возьмём необходимое силой, пока они не собрались большой толпой."
 pacific_crossing_events.19.b.win_tt: "Высадившаяся группа захватывает пищу и воду раньше, чем островитяне успевают собраться."
 pacific_crossing_events.19.b.lose_tt: "На этот раз островитяне готовы; налётчики отброшены с потерями."
 pacific_crossing_events.19.c: "Наберём воды без боя, сколько получится, и пойдём дальше."
 pacific_crossing_events.19.historical_info: "Марианские острова стали постоянной остановкой для судов, пересекавших Тихий океан, где можно было пополнить запасы воды, а отношения с чаморро на протяжении веков существования галеонного маршрута колебались между настороженной торговлей и открытым насилием. Флот, хорошо обращавшийся с островитянами, мог рассчитывать на провиант; тот, кто обошёлся с ними иначе, нередко находил те же берега закрытыми или вынужден был сражаться за каждую бочку воды."
 pacific_crossing_events.20.title: "Грозный берег"
 pacific_crossing_events.20.desc: "Ещё один остров поднимается из бескрайнего южного моря — крутой, зелёный, окружённый рифом. Этот обитаем: над деревьями вьётся дым, а от берега уже отчаливают каноэ, набитые людьми с раскрашенными телами и копьями, и они издают звуки, которые кажутся то ли приветствием, то ли предупреждением. Никто на борту не может сказать, чем именно.\n\nЛоцманы никогда не наносили это место на карту и не могут назвать народ, который им владеет. Но запасы воды на исходе, люди голодны, а обитаемый остров — это еда, если её удастся добыть. Накормит ли этот берег флот или обернётся против него, будет зависеть от того, как сложится ближайший час."
 pacific_crossing_events.20.a: "Обойдём остров стороной — драться здесь незачем."
 pacific_crossing_events.20.b: "Подойдём и поторгуем — покажем железо и ткань и понадеемся на лучшее."
 pacific_crossing_events.20.trade_ok_tt: "Островитяне опускают копья и охотно меняются; шлюпки возвращаются, гружённые пищей и водой."
 pacific_crossing_events.20.trade_ambush_tt: "Переговоры оказываются ловушкой: каноэ окружают корабли, и флот пробивается ценой большой крови."
 pacific_crossing_events.20.c: "Вторгнемся на остров и возьмём силой всё, что сможет."
 pacific_crossing_events.20.raid_win_tt: "Высадившаяся группа загоняет островитян обратно в лес и уносит их запасы."
 pacific_crossing_events.20.raid_lose_tt: "Островитяне яростно бьются за свои дома, и налётчиков громят и отгоняют к шлюпкам."
 pacific_crossing_events.21.title: "Поражение"
 pacific_crossing_events.21.desc: "Неделя за неделей флот с трудом продвигается на восток, и неделя за неделей море забирает обратно все наши успехи. Пассат не слабеет и не меняется; он стоит стеной прямо у носа, а течение под ним идёт в ту же сторону, унося корабли на запад ночью быстрее, чем они продвигаются на восток днём. Лоцманы делают замеры, сверяют их и умолкают — линия на карте перестала двигаться вперёд и поползла назад.\n\nС этим не поспоришь — это беличье колесо, а не путь, и каждый день на нём стоит воды и жизней впустую. Остаётся лишь горький выбор: развернуться, пойти по победившему ветру и увести флот обратно к Островам Пряностей, чтобы всё обдумать заново."
 pacific_crossing_events.21.a: "Это море не покорить силой."
 pacific_crossing_events.22.title: "Прошение экипажа"
 pacific_crossing_events.22.desc: "С каждым днём припасы убывают быстрее, чем растёт число пройденных миль. Воды мало, и она протухла, сухари обратились в труху, а список больных удлиняется каждое утро. На корму приходит делегация старых матросов — пока не с целью поднять мятеж, но с твёрдой убеждённостью людей, умеющих считать бочки. Они всё просчитали и пришли к выводу, что расчёты не в их пользу. Поворачивайте, говорят они, пока в трюме достаточно запасов, чтобы добраться до известного берега. Пойдём дальше — похороним флот в этом океане.\n\nВ их словах есть логика, как бы неприятно ни было её слышать."
 pacific_crossing_events.22.a: "Послушаем их и возьмём курс обратно на Острова Пряностей."
 pacific_crossing_events.22.b: "Откажем. Мы зашли слишком далеко, чтобы поворачивать."
 pacific_crossing_events.23.title: "Кровь на палубе"
 pacific_crossing_events.23.desc: "Спор, начавшийся в день отказа на прошение, так и не утих и сегодня дошёл до драки. Боцман, верный экспедиции, обменивается оскорблениями с горсткой людей, всё ещё не смирившихся с отказом повернуть назад; оскорбления перерастают в толчки, а толчки — в потасовку, быстро распространяющуюся по палубе, и уже видны обнажённые клинки.\n\n[target_leader.GetName] прибегает на шум и застаёт вахту уже дерущейся из-за ссоры, которая на самом деле вовсе не касалась боцмана."
 pacific_crossing_events.23.a: "Вмешаемся и разнимем драку."
 pacific_crossing_events.23.b: "Выбросим зачинщика за борт — и дело с концом."
 pacific_crossing_events.23.c: "Послушаем их и возьмём курс обратно на Острова Пряностей."
 pacific_crossing_events.23.break_up_win_tt: "Драку удаётся разнять, пока не пролилась настоящая кровь."
 pacific_crossing_events.23.break_up_lose_tt: "Потасовка становится кровавой, прежде чем удаётся восстановить порядок."
 pacific_crossing_events.23.overboard_tt: "Зачинщика хватают и без церемоний швыряют в море. Экипаж наблюдает за этим в холодной тишине."
 pacific_crossing_events.24.title: "Пожар в море"
 pacific_crossing_events.24.desc: "С кормы раздаётся крик: один из кораблей флота охвачен огнём. То, что началось как очередная драка из-за курса домой, в суматохе привело к тому, что опрокинулся фонарь, и пламя уже бежит по такелажу быстрее, чем успевают наполнять вёдра. Ветер уносит искры к остальным кораблям.\n\n[target_leader.GetName] должен быстро решить: сократить расстояние и помочь бороться с огнём или держаться в стороне и оставить горящий корабль на произвол судьбы."
 pacific_crossing_events.24.a: "Встанем вплотную к их борту и поможем потушить пожар."
 pacific_crossing_events.24.b: "Встанем на расстоянии, пусть тушат себя сами."
 pacific_crossing_events.24.saved_tt: "Вместе мы быстро тушим пожар, пока он не успел охватить весь корабль"
 pacific_crossing_events.24.caught_fire_tt: "Из-за летящих искр пламя перекидывается на наш корабль"
 pacific_crossing_events.24.distance_tt: "Объятый пламенем корабль догорает до ватерлинии, пока остальной флот наблюдает за пожаром с безопасного расстояния"
 pacific_crossing_events.25.title: "Бунт на корабле"
 pacific_crossing_events.25.desc: "[target_leader.GetName] получает весть с одного из других кораблей: его экипаж восстал против офицеров. уже знакомые споры о необходимости повернуть назад переросли в открытый мятеж. Верные капитану члены команды забаррикадировались в трюме, пока мятежники спорят о том, что делать дальше. Времени на размышления о том, стоит ли вмешиваться, почти не осталось.\n\nСпущенная на воду шлюпка ещё может переломить ход событий на борту бунтующего судна — или же станет для мятежников новой лёгкой добычей."
 pacific_crossing_events.25.a: "Поднимемся на борт и поддержим верную команду."
 pacific_crossing_events.25.b: "Встанем поодаль, пусть разбираются сами."
 pacific_crossing_events.25.c: "Послушаем бунтовщиков и развернёмся обратно к Островам Пряностей."
 pacific_crossing_events.25.loyal_win_tt: "Лоялисты одерживают верх, порядок восстановлен"
 pacific_crossing_events.25.loyal_lose_tt: "Бунтовщики побеждают абордажную команду и захватывают корабль"
 pacific_crossing_events.25.distance_tt: "Бунтовщики уводят корабль прочь, пока мы не успели ничего предпринять"
 pacific_crossing_events.26.title: "Очередное прошение"
 pacific_crossing_events.26.desc: "Делегация возвращается. На этот раз её участники ведут себя более покорно, но всё ещё твёрдо стоят на своём. Они не сыплют угрозами и не повышают голосов, лишь снова излагают свои подсчёты, которые стали мрачнее с тех пор, как мы в прошлый раз отвергли предложение. Если [target_leader.GetName] пожелает пойти на небольшие уступки, это несколько успокоит настроения в трюме.\n\nИли же мы можем ответить так же, как и в прошлый раз, чтобы просители вернулись в трюм ни с чем."
 pacific_crossing_events.26.a: "Выслушаем просителей и пойдём на небольшие уступки."
 pacific_crossing_events.26.b: "Снова отмахнёмся от них и продолжим, как раньше."
 pacific_crossing_events.27.title: "Ночной саботаж"
 pacific_crossing_events.27.desc: "Ночью кто-то пробрался к припасам: бочка с водой разбита, бухта такелажного каната перерублена наполовину. Это мелкие пакости, но они явно сделаны с умыслом. Тот, кто жаждет повернуть экспедицию назад, решил, что одних слов уже недостаточно. [target_leader.GetName] может отдать приказ обыскать все корабли в поисках виновника или же просто удвоить число часовых и продолжить путь без лишних разбирательств.\n\nТак или иначе, послание мятежников заметили."
 pacific_crossing_events.27.a: "Проведём расследование и найдём ответственного."
 pacific_crossing_events.27.b: "Удвоим часовых и продолжим без разбирательств."
 pacific_crossing_events.27.culprit_found_tt: "Виновный найден и показательно наказан перед всем экипажем"
 pacific_crossing_events.27.culprit_free_tt: "Поиски ни к чему не привели, они прекращены после того, как вредитель снова испортил припасы"
 pacific_crossing_events.27.no_investigation_tt: "Охрана удвоена, но припасы уже испорчены"
