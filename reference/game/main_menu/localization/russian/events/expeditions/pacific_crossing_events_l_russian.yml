 pacific_crossing_cargo_loaded_effect: "The cargo of [ShowGoodsName('silk')], [ShowGoodsName('porcelain')], and spices is loaded, to be sold when the fleet reaches home."
 pacific_crossing_events.1.title: "Путь домой"
 pacific_crossing_events.1.desc: "Задача состоит не просто в том, чтобы достичь [ShowContinentName('asia')] — корабли уже делали это, влекомые пассатами на запад, точно лист по течению ручья. Задача — вернуться назад. Колония на дальнем берегу этого океана не стоит ничего, если флот может доплыть до неё, но никогда не вернуться; всё предприятие зависит от того, найдётся ли надёжный путь домой — такой, каким корабль сможет ходить год за годом, везя [ShowGoodsName('silver')] туда и [ShowGoodsName('silk')] обратно.\n\nПопутный ветер известен и постоянен. Что лежит за ним и подарит ли море флоту дорогу назад — ни одна карта в этой гавани сказать не может. Лоцманы уверены лишь в одном: путь домой не будет повторением пути туда."
 pacific_crossing_events.1.a: "Fit out a larger fleet, an extra ship for the search ahead."
 pacific_crossing_events.1.a.tt: "An additional ship is outfitted and added to the fleet (#G +1#! Ships)"
 pacific_crossing_events.1.b: "Provision for the passage; trust fortune for the rest."
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] will chart every wind and current we cross."
 pacific_crossing_events.1.historical_info: "#italic Торнавьяхе#!, обратное плавание на восток, долгое время оставалось главной проблемой первых тихоокеанских экспедиций. Альваро де Сааведра, отплыв из Новой Испании, в 1528 и 1529 годах дважды был вынужден отступить перед пассатами и в итоге погиб в попытках найти путь обратно. В 1542 году Руи Лопес де Вильялобос, добравшись до Азии, также не сумел найти дорогу домой. Пригодный маршрут был найден лишь в 1565 году. До тех пор флоты могли доплыть до Азии, но не имели возможности доставить свой груз назад."
 pacific_crossing_events.2.title: "Острова воров"
 pacific_crossing_events.2.desc: "Недели, полные лишь воды и неба, заканчиваются, когда впередсмотрящий кричит о земле: низкий зелёный остров, окружённый белым прибоем. Не успевает флот бросить якорь, как навстречу уже мчатся каноэ — стройные аутригеры под треугольными парусами, скользящие с волны на волну так быстро, что лоцманы застывают, глядя на них. Островитяне взбираются на борта, смеясь и не выказывая страха, и уносят всё, что не привязано. Для них в этом нет воровства — они лишь берут то, что не принадлежит никому; для голодных людей, месяц проведших в море, это — вызов.\n\nНо здесь есть пресная вода, и фрукты, и рыба, готовые быть взятыми — так или иначе."
 pacific_crossing_events.2.a: "Trade beads, [ShowGoodsNameWithNoTooltip('cloth')], and [ShowGoodsNameWithNoTooltip('iron')] for water and fruit."
 pacific_crossing_events.2.b: "Взять силой то, что нужно кораблям. Времени на промедление нет."
 pacific_crossing_events.2.fight_win_tt: "Островитяне разбегаются перед оружием кораблей, и команда без помех запасается водой и фруктами"
 pacific_crossing_events.2.fight_lose_tt: "Островитяне сопротивляются куда яростнее, чем ожидалось, и команда возвращается к лодкам ни с чем"
 pacific_crossing_events.2.c: "Забыть про воду — приметить лучше их быстрые корпуса и паруса."
 pacific_crossing_events.2.historical_info: "6 марта 1521 года, спустя более трёх месяцев без вида земли, уцелевшие из флота Фернана Магеллана достигли Гуама. Чаморро вышли навстречу на быстрых аутригерных проа, которыми восхищался летописец Антонио Пигафетта, называя их быстрее всего, на чём когда-либо ходили испанцы. После того как островитяне забрали одну из корабельных шлюпок, Магеллан назвал архипелаг #italic Islas de los Ladrones#! — Острова воров — и высадился с отрядом за провизией, прежде чем отправиться дальше на Филиппины."
 pacific_crossing_events.3.title: "Сорок дней пустоты"
 pacific_crossing_events.3.desc: "Ни земли, ни птиц, ни даже клочка водорослей на воде. Команда уже неделями в море, и уверенность лоцмана тает с каждым днём. У людей кровоточат дёсны и шатаются зубы; один клянётся, что старая рана, зажившая годы назад, снова раскрылась. Бочки с водой на исходе, а сухари больше похожи на долгоносиков, чем на хлеб. Ветер милостив, ровен и прохладен, но уносит корабли всё глубже в океан, которому не видно конца.\n\nКапитан сохраняет спокойное лицо и ровный голос, считает дни по карте и не говорит ничего, во что сам не верит."
 pacific_crossing_events.3.a: "Урезать пайки. Мы стерпим то, что должны стерпеть."
 pacific_crossing_events.3.b: "Курс верен. Земля впереди — держите курс."
 pacific_crossing_events.3.c: "Дисциплинировать команду — слово капитана есть закон!"
 pacific_crossing_events.4.title: "Земля за Западным морем"
 pacific_crossing_events.4.desc: "Спустя долгое время после ухода от Островов Воров впередсмотрящий видит сквозь утреннюю дымку зелёные холмы. Когда флот входит в большой залив, становится ясно, что это не пустынный берег. Поселение из беленых стен и крыш, крытых пальмовыми листьями, поднимается по склону холма над водой. Навстречу кораблям выходят каноэ с балансирами, на них — люди в цветных тканях, не выказывающие тревоги.\n\nСамый крупный из них, с золотом на шее, говорит на [location.GetDominantCulture.GetLanguage.GetName], наречии, незнакомом ни одному из лоцманов, и указывает в сторону берега с непринуждённостью человека, часто торгующего с чужестранцами. У этих островов свой собственный мир — и через них уже текут [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')] далёкого Китая."
 pacific_crossing_events.4.desc.owned: "Спустя долгое время после ухода от Островов Воров впередсмотрящий видит сквозь утреннюю дымку зелёные холмы — а затем, безошибочно узнаваемые над поселением, поднимающимся по склону, наши собственные цвета. Флот наткнулся не на неведомый берег, а вошёл в собственную гавань: [pacific_colony.GetName], владение нашей короны, чьи причалы и склады уже полны работы.\n\nК кораблям выходят лодки с соотечественниками на борту, поражёнными появлением флота из пустынного океана на востоке. Здесь экипажи могут безопасно пополнить запасы воды и провизии и погрузить [ShowGoodsName('silk')] и [ShowGoodsName('porcelain')], которые китайские купцы привозят к нашим же причалам."
 pacific_crossing_events.4.desc.hostile: "Спустя долгое время после ухода от Островов Воров впередсмотрящий видит сквозь утреннюю дымку зелёные холмы — а затем флаг, что не наш, развевающийся над частоколом у самой воды. Другая держава добралась до этих островов первой. Когда флот входит в залив, [pacific_rival_shore.GetName] показывает выставленные вдоль стен пушки, и вооружённые лодки идут навстречу кораблям, требуя объяснить цель прихода.\n\nЭта земля теперь принадлежит [pacific_rival.GetName], и приём будет в лучшем случае настороженным. Шёлк и фарфор Китая по-прежнему текут через архипелаг — но через руки соперника, и не для нас свободно."
 pacific_crossing_events.4.a: "Open trade for the [ShowGoodsNameFlat('silk')] and [ShowGoodsNameFlat('porcelain')] passing through."
 pacific_crossing_events.4.b: "Разграбить поселение — силой захватить воду и припасы."
 pacific_crossing_events.4.b.raid_win_tt: "Жители бегут вглубь острова, и команды вывозят из поселения всю еду и воду"
 pacific_crossing_events.4.b.raid_lose_tt: "Жители сражаются за свои дома и отбрасывают налётчиков обратно к лодкам, с пустыми руками и в крови"
 pacific_crossing_events.4.d: "Загрузить сезонные товары с наших собственных складов."
 pacific_crossing_events.4.e: "Дать командам отдых и починить суда в нашем порту."
 pacific_crossing_events.4.f: "Осторожно вести дела с факторами соперника, под прицелом их орудий."
 pacific_crossing_events.4.g: "Силой овладеть якорной стоянкой и взять всё необходимое."
 pacific_crossing_events.4.h: "Держаться подальше от их орудий и продолжить свой путь."
 pacific_crossing_events.4.raid_win_tt: "Форпост взят штурмом, его запасы вывезены; команды торжествуют"
 pacific_crossing_events.4.raid_lose_tt: "Штурм отбит с потерями, и повреждённый корабль приходится бросить"
 pacific_crossing_events.4.historical_info: "Руй Лопес де Вильялобос, пересекая океан из Новой Испании в 1542 году, назвал архипелаг #italic Лас-Ислас-Филипинас #! в честь наследника испанского престола, будущего Филиппа II. Постоянное испанское присутствие началось лишь в 1565 году, когда Мигель Лопес де Легаспи основал первое поселение на Себу; в 1571 году он захватил Манилу у раджи Сулеймана и сделал её столицей испанской Ост-Индии и западной оконечностью галеонной торговли."
 pacific_crossing_events.5.title: "Остров гвоздики"
 pacific_crossing_events.5.desc: "Запах доходит до флота раньше, чем остров, — сладость на ветру, тяжёлая, резкая и пряная. Одинокая вулканическая вершина, окутанная облаком, зелёная до самой кромки воды. Гавань полна малайских и яванских проа, а у [target_owner.Custom('GetRulerOrRegentTitle')] [target_owner.GetName] есть дворец, отчётливо видный с якорной стоянки.\n\nКаждый купец в [ShowLocationName('lisbon')] и [ShowLocationName('sevilla')] платит целое состояние за этот аромат, даже не зная, откуда он берётся. Никто в этом флоте ещё не стоял так близко к его источнику — деревья, отягощённые незрелыми [ShowGoodsName('cloves')], на склонах над заливом, где груз одного корабля стоит дороже, чем всё плавание. Трюмы можно наполнить здесь. Остаётся лишь довезти их домой."
 pacific_crossing_events.5.desc_known: "Запах доходит до флота раньше, чем остров, — сладость на ветру, тяжёлая, резкая и пряная. Одинокая вулканическая вершина, окутанная облаком, зелёная до самой кромки воды. Гавань полна малайских и яванских проа, а у [target_owner.Custom('GetRulerOrRegentTitle')] [target_owner.GetName] есть дворец, отчётливо видный с якорной стоянки.\n\nКаждый купец в [ShowLocationName('lisbon')] и [ShowLocationName('sevilla')] знает этот аромат понаслышке и платит за него целое состояние. Никто в этом флоте ещё не стоял так близко к его источнику — деревья, отягощённые незрелыми [ShowGoodsName('cloves')], на склонах над заливом, где груз одного корабля стоит дороже, чем всё плавание. Трюмы можно наполнить здесь. Остаётся лишь довезти их домой."
 pacific_crossing_events.5.desc.driven_back: "Пряные острова вновь поднимаются над форштевнем — та же зелёная вершина, та же тесная якорная стоянка — а вместе с ними и горькое осознание, что флот отброшен назад до самого начала пути, а дорога домой всё ещё не найдена. Пассаты не оставили кораблям иного выбора, кроме как вернуться к этим берегам.\n\nТеперь на якорной стоянке царит мрачная рутина. Острова снова дадут воду и пищу; больных можно высадить на берег, экипажи — отдохнуть, трюмы — пополнить всем, что корабли ещё способны везти. Но каждый человек на борту знает, какая расплата ждёт впереди: флоту предстоит вновь собраться с силами и выйти в открытое море, чтобы снова попытать переход домой, — а попыток таких осталось не много."
 pacific_crossing_events.5.a: "Fill the hold with [ShowGoodsNameWithNoTooltip('cloves')] — load every last barrel."
 pacific_crossing_events.5.b: "Снарядить корабли провизией для долгого пути домой."
 pacific_crossing_events.5.c: "Дать командам отдохнуть и восстановиться на берегу."
 pacific_crossing_events.5.d: "Отказаться от поисков — плыть домой длинным путём, вокруг мыса."
 pacific_crossing_events.5.historical_info: "Португальские мореплаватели достигли Молуккских островов в 1512 году, где Франсишку Серран стал советником султана Тернате. Уцелевшие корабли Магеллана загрузились гвоздикой в соперничавшем султанате Тидоре в 1521 году. Испано-португальский спор за острова был улажен Сарагосским договором 1529 года, по которому император Карл V, нуждаясь в деньгах, продал испанские притязания на Молуккские острова Португалии за 350 000 дукатов."
 pacific_crossing_events.6.title: "Дорога домой"
 pacific_crossing_events.6.desc: "Трюмы полны, и лёгкая половина плавания уже позади. Теперь флоту предстоит сделать то единственное, чему не научит ни одна карта на борту: найти путь назад через океан, который он только что пересёк. Ветер, так ласково нёсший корабли на запад, теперь встаёт прямо против их возвращения, и каждый лоцман за столом понимает, что это значит.\n\nОфицеры флота засиживаются допоздна над картами, и на сей раз лоцманы не могут прийти к согласию. У каждого свой курс, который он отстаивает, и своя причина опасаться курсов остальных, а за краем известного моря никто из них не может поручиться, куда что-либо из этого приведёт, — есть лишь догадки да смелость на них ставить. Решение принадлежит одному капитану, и от выбранного им курса будет зависеть жизнь или смерть каждой души на борту."
 pacific_crossing_events.6.desc.driven_back: "Офицеры флота снова собираются, и настроение за столом скисло. Курс был выбран, и океан отверг его; флот с трудом добрался обратно лишь затем, чтобы усвоить этот урок. Оставшиеся курсы — всё те же догадки, ничуть не более доказанные, чем прежде, а рисковать ими теперь предстоит меньшим числом кораблей и поредевшими командами.\n\nЛоцманы перестали повышать голос. Каждый склонившийся над картой знает, что это море нельзя испытывать снова и снова безнаказанно. Курс из этих вод нужно проложить ещё раз, и таких попыток впредь останется немного."
 pacific_crossing_events.6.a: "The northern route: hug the Asian coast, then ride east."
 pacific_crossing_events.6.a.tt: "Stand north along the coast of [ShowRegionName('japan_region')] and beyond, then let the westerlies of the high latitudes carry the fleet clear across to [ShowContinentName('america')] and home"
 pacific_crossing_events.6.b: "Средний путь — идти на восток против пассатов."
 pacific_crossing_events.6.b.tt: "Drive due east into the teeth of the trades, by way of the old islands. The wind has thrown back every fleet that tried it — expect to be beaten all the way back to the Spice Islands"
 pacific_crossing_events.6.c: "Далёкий южный путь — огромная дуга, долгая, но свободная."
 pacific_crossing_events.6.c.tt: "Strike far south and east through the island-strewn southern ocean. A passage may well lie that way — but it is immensely long, and the fleet's provisions may not last to the end of it"
 pacific_crossing_events.6.historical_info: "Все попытки пройти на восток от Азии вдоль тропиков заканчивались неудачей. #italic Тринидад #! Гонсало Гомеса де Эспиносы, пытавшийся вернуться в Новую Испанию в 1522 году, был отброшен назад и захвачен португальцами; Альваро де Сааведра терпел неудачу дважды, в 1528 и 1529 годах. В 1565 году монах-августинец Андрес де Урданета преуспел, направившись далеко на север — примерно до сорокового градуса широты, — чтобы поймать течение Куросио и западные ветра, а затем пройти на них через северную часть Тихого океана к Калифорнии и далее вниз до Акапулько. Его маршрут служил манильским галеонам следующие два с половиной века."
 pacific_crossing_events.7.title: "Тихий океан"
 pacific_crossing_events.7.desc: "Ветер стихает. Паруса безвольно повисают, море лежит плоским и стеклянным до самого горизонта, и корабли застывают неподвижно под белым, палящим небом. Именно за такое затишье этот океан и назвали «тихим морем» — кротость, что не раз уже морила экипажи голодом.\n\nВода в бочках становится тёплой и зловонной. Каждый безветренный день — это истраченный паёк без единой пройденной мили, и люди это знают. Они смотрят на пустой такелаж и горизонт, и уже дважды кричали «земля!», приняв за неё облачную гряду, растаявшую в никуда. Праздные руки на застывшем без ветра корабле редко остаются праздными надолго."
 pacific_crossing_events.7.a: "Ждать и беречь каждую каплю и крошку. Ветер вернётся."
 pacific_crossing_events.7.b: "Спустить шлюпки — буксировать корабли, пока не вернётся ветер."
 pacific_crossing_events.7.c: "Волнение идёт на юго-восток — дрейфовать вместе с ним навстречу ветру."
 pacific_crossing_events.8.title: "Возвращение галеона"
 pacific_crossing_events.8.desc: "Зафрахтованный галеон вернулся домой. Месяцы в море, пройденные по долгой северной дуге, глубоко осадили его в воду, когда он входит на рейд, отягощённый грузом — богатствами [ShowContinentName('asia')], перевезёнными через весь океан и благополучно доставленными на берег. Причалы наполняются агентами и покупателями ещё до того, как корабль бросил якорь. Маршрут держится, а предприятие приносит прибыль; в следующем году придёт ещё один галеон, а затем и следующий."
 pacific_crossing_events.8.a: "Богатство, благополучно доставленное на берег."
 pacific_crossing_events.8.historical_info: "Манильский галеон ходил по маршруту Акапулько — Манила почти каждый год с 1565 по 1815 год, что делает эту линию одной из самых долговечных судоходных линий в истории. Он вёз американское серебро на запад, а китайский шёлк, фарфор и пряности — на восток; груз одного галеона мог принести его вкладчикам целое состояние. Эта торговля связала серебро Америк с рынками Китая и превратила Тихий океан в магистраль мировой торговли."
 pacific_crossing_events.9.title: "Знакомый берег"
 pacific_crossing_events.9.desc: "Долгий подъём на север сквозь холодные серые воды, а затем бесконечная дуга на восток через пустой океан заканчиваются, когда впередсмотрящий наконец видит её: высокий лесистый берег, мысы, уходящие на юг под пеленой тумана. Это не часть [ShowContinentName('asia')] и не какой-либо остров — это западный берег самой [ShowContinentName('america')]. Флот вышел из [ShowContinentName('pacific_ocean_continent')] на ближней к дому стороне света, и остаётся лишь пройти на юг вдоль побережья, уже знакомого по картам, чтобы достичь дружественного порта.\n\nПуть домой найден. Осталось лишь пройти его до конца."
 pacific_crossing_events.9.a: "Идти на юг, домой, вдоль знакомого берега."
 pacific_crossing_events.9.b: "Сначала пополним запасы воды и дадим людям отдых — они это заслужили."
 pacific_crossing_events.9.historical_info: "Обратное плавание Андреса де Урданеты в 1565 году достигло американского берега у мыса Мендосино в Калифорнии после примерно четырёх месяцев в открытом северной части Тихого океана. Оттуда #italic Сан-Педро#! направился на юг и достиг Акапулько 8 октября 1565 года, доказав пригодность маршрута. Северная дуга стала стандартным путём возвращения манильских галеонов."
 pacific_crossing_events.10.title: "Море вздымается"
 pacific_crossing_events.10.desc: "Небо приобретает цвет кровоподтёка, и ветер налетает подобно стене. Уже через час флот сражается за свою жизнь — волны вздымаются выше грота-рея, зелёная вода захлёстывает шкафут, паруса лопаются с треском, похожим на пушечные залпы. Корабли трудятся и кренятся, и в мгле один за другим теряют друг друга из виду. Лоцманам остаётся лишь держаться и считать часы.\n\nВыбор нужно сделать без времени на раздумья: убрать паруса и переждать бурю там, где корабли сейчас находятся, или бежать перед ветром в темноту, положившись на прочность корпусов."
 pacific_crossing_events.10.a: "Лечь в дрейф и переждать под голыми мачтами."
 pacific_crossing_events.10.b: "Идти по ветру и молиться, чтобы обшивка выдержала."
 pacific_crossing_events.10.weathered_tt: "Флот выходит из бури потрёпанным, но невредимым"
 pacific_crossing_events.10.foundered_tt: "Один из кораблей идёт ко дну вместе со всей командой"
 pacific_crossing_events.11.title: "Сырое дерево"
 pacific_crossing_events.11.desc: "Корабли строились наспех в новых верфях американского тихоокеанского побережья, из леса, которому не дали как следует высохнуть, руками корабелов, никогда прежде не строивших суда для такого океана. Теперь море взимает долг. Доска расходится по шву в средней части корпуса; конопатка ослабевает; в трюме люди стоят в прибывающей воде, а помпы стучат день и ночь, не поспевая за течью. Лицо плотника говорит само за себя.\n\nТак продолжаться не может, а до ближайшей суши — половина океана."
 pacific_crossing_events.11.a: "Кренговать судно и произвести настоящий ремонт."
 pacific_crossing_events.11.b: "Откачивать воду посменно и идти дальше, несмотря ни на что."
 pacific_crossing_events.11.c: "Abandon the failing hull; crowd her crew aboard the rest."
 pacific_crossing_events.12.title: "Дар моря"
 pacific_crossing_events.12.desc: "Начинается всё с дельфинов — огромного их косяка, гонящего что-то перед собой прямо к кораблям. Затем само море словно вспыхивает огнём: на поверхность выбрасывается исполинский косяк рыбы, акры серебра вспыхивают и бурлят вокруг корпусов, стиснутые кольцом дельфинов так, что воды почти не видно за их множеством.\n\nКоманде не нужен приказ. Шлюпки спускаются за борт, следом идут лини и сети, люди свешиваются с бортов, вытягивая рыбу целыми охапками на палубы, что вскоре покрываются скользкой горой улова. После недель сухарей и солонины это и пир, и нежданная удача, и милость судьбы разом."
 pacific_crossing_events.12.a: "Спустить все шлюпки и сети — взять всё, что удастся выловить."
 pacific_crossing_events.12.b: "Взять быстрый улов и снова лечь на курс."
 pacific_crossing_events.13.title: "Гнилые припасы"
 pacific_crossing_events.13.desc: "Кладовщик приходит к капитану, теребя в руках шляпу. В трюме вскрыты целые ярусы бочек — и найдены испорченными: солонина засолена неправильно, сухари уложены сырыми, вода протухла в бочках, которые никогда толком не просмолили. Провизия, погруженная в спешке и запечатанная влажной ещё в портах отправления, сгнила в тропической жаре, и то, что должно было кормить команду неделями, обратилось в зловонную, кишащую червями потерю.\n\nЗдесь нет рынка и нет второго шанса — лишь испорченные запасы и голодные люди."
 pacific_crossing_events.13.a: "Выбросить испорченные припасы за борт и смириться с потерей."
 pacific_crossing_events.13.b: "Всё равно выдать паёк — люди едят, что есть."
 pacific_crossing_events.17.title: "Поглощены морем"
 pacific_crossing_events.17.desc: "Донесения, когда наконец приходят, обрывочны — имя, дата, последний известный курс. Флот, отправившийся искать путь домой, так его и не нашёл. Поглотила ли корабли буря, выбросило ли их на безымянный риф или же они просто дрейфовали, пока не иссякла вода, а с ней и люди, — никто теперь не скажет наверняка. Океан оставил их себе.\n\nПуть домой по-прежнему не найден. Где-то там ветер всё ещё дует не в ту сторону."
 pacific_crossing_events.17.a: "Они будут не последними, кого мы потеряем в этом океане."
 pacific_crossing_events.17.end_tt: "Экспедиция потеряна, и на этом её путь окончен"
 pacific_crossing_events.17.historical_info: "Восточный океан забрал многих, кто пытался его пересечь. Командующий экспедицией Гарсиа Хофре де Лоайса и мореплаватель Хуан Себастьян Элькано оба погибли в море во время Тихоокеанского перехода 1526 года; Альваро де Сааведра умер посреди океана в 1529 году, пытаясь вернуться назад; а Фернан Магеллан был убит на Мактане в 1521 году. Из примерно 270 человек, покинувших Испанию вместе с Магелланом, на родину вернулись лишь восемнадцать — на борту #italic«Виктории»#!."
 pacific_crossing_events.18.title: "Бунт команды"
 pacific_crossing_events.18.desc: "Люди дошли до предела. Скудный паёк, бескрайний океан и курс, за который ручаются одни лишь лоцманы, — всё это стёрло в команде последние остатки послушания. У кормы собирается кучка угрюмых, вооружённых матросов и без обиняков излагает требование: развернуть флот назад, или они сделают это сами. Офицеры стоят — немногие против многих, и мушкеты не все на одной стороне.\n\nЧто бы теперь ни решили, это обойдётся флоту дорогой ценой, которую нелегко возместить."
 pacific_crossing_events.18.desc.last_ship: "Люди дошли до предела. От флота остался единственный корабль, и на его тесной, зловонной палубе офицеру негде укрыться. Зачинщики выходят к корме все разом, и на этот раз они не просят — они с ужасающей прямотой говорят капитану правду об их положении: бежать не на что, звать морскую пехоту некого, а за бортом — бескрайний океан. Поворачивай домой сейчас же, говорят они, или отправишься туда сам.\n\nЛоцманы притихли. Капитан стоит один у борта, за спиной у него море, и ответ дать придётся ему."
 pacific_crossing_events.18.a: "Уступить — пусть зачинщики берут корабль и поворачивают назад."
 pacific_crossing_events.18.b: "Подавить силой. Повесить зачинщиков и плыть дальше."
 pacific_crossing_events.18.c: "Напомнить им, что ждёт дома, и кто ведёт их туда."
 pacific_crossing_events.18.fight_win_tt: "The mutiny is broken and order restored (#G +5#! Crew Morale)"
 pacific_crossing_events.18.fight_lose_tt: "Схватка оборачивается кровопролитием, и в этой сумятице теряется один корабль"
 pacific_crossing_events.18.overboard_tt: "Мятежники одолевают офицеров и бросают [target_leader.GetName] в море. На этом путешествие заканчивается"
 pacific_crossing_events.19.title: "Острова воров, снова"
 pacific_crossing_events.19.desc: "Пробиваясь на восток против ветра, флот не может закрепить пройденное расстояние, и наконец над носом снова поднимаются низкие зелёные острова [ShowLocationName('guahan')] — те же берега, что были оставлены позади после перехода. Как и прежде, навстречу скользят проа, настороженные и любопытные, их команды разглядывают чужаков, вернувшихся из пустого океана ни с чем. Что бы здесь ни произошло в первый раз, островитяне это помнят."
 pacific_crossing_events.19.desc.friendly: "Пробиваясь на восток против ветра, флот не удерживает пройденного пути, и наконец над носом снова поднимаются низкие зелёные острова [ShowLocationName('guahan')]. На этот раз проа выходят без страха — островитяне помнят честную торговлю, и в лицах некоторых из них команды почти узнают знакомых. Товары для обмена поднимают повыше, обмениваются жестами, и обещание воды и свежей еды становится очевидным.\n\nФлот отчаянно нуждается и в том, и в другом. Старое доброе расположение, похоже, стоит здесь дороже любой карты."
 pacific_crossing_events.19.desc.hostile: "Пробиваясь на восток против ветра, флот не удерживает пройденного пути, и наконец над носом снова поднимаются низкие зелёные острова [ShowLocationName('guahan')]. Но проа, что выходят теперь навстречу, идут во множестве, и смеха в них нет — островитяне не забыли набег и давно поджидали. Копья ощетинились вдоль берега, и якорная стоянка, что прежде щедро давала воду, теперь просто так её не отдаст.\n\nФлоту всё равно нужны вода и еда, и люди понимают: добывать их придётся у народа, готового к встрече."
 pacific_crossing_events.19.a: "Снова торговать с людьми, что помнят нас по-доброму."
 pacific_crossing_events.19.b: "Взять силой то, что нужно, пока они не собрались с силами."
 pacific_crossing_events.19.b.win_tt: "Десант захватывает еду и воду прежде, чем островитяне успевают собраться"
 pacific_crossing_events.19.b.lose_tt: "На этот раз островитяне готовы; налётчики отброшены с потерями"
 pacific_crossing_events.19.c: "Взять на борт воду, сколько удастся без боя, и идти дальше."
 pacific_crossing_events.19.historical_info: "Марианские острова стали постоянной стоянкой для пополнения запасов воды для кораблей, пересекающих Тихий океан, а отношения с чаморро на протяжении веков галеонного пути колебались между настороженной торговлей и открытым насилием. Флот, что хорошо обходился с островитянами, мог рассчитывать на провизию; тот же, что поступал иначе, часто находил те же берега закрытыми для себя или был вынужден сражаться за каждую бочку воды."
 pacific_crossing_events.20.title: "Свирепый берег"
 pacific_crossing_events.20.desc: "Ещё один остров поднимается из бескрайнего южного моря — крутой, зелёный, обрамлённый рифом. Этот обитаем: над деревьями поднимается дым, и от берега уже отходят каноэ, полные фигур, разукрашенных красками, с копьями в руках, поднимающих над водой стену звуков, которая может означать как приветствие, так и предупреждение. Никто на борту не может сказать наверняка, что именно.\n\nЛоцманы никогда не наносили это место на карту и не могут назвать народ, что им владеет. Но бочки с водой почти пусты, а люди голодны, и обитаемый остров означает еду — если её удастся получить. Накормит ли этот берег флот или обратится против него, будет зависеть от того, как сложится следующий час."
 pacific_crossing_events.20.a: "Обойти остров стороной — здесь не место для драк."
 pacific_crossing_events.20.b: "Stand in and trade — hold up [ShowGoodsNameWithNoTooltip('iron')] and [ShowGoodsNameWithNoTooltip('cloth')], and hope."
 pacific_crossing_events.20.trade_ok_tt: "Островитяне опускают копья и охотно вступают в обмен; лодки возвращаются гружёные едой и водой"
 pacific_crossing_events.20.trade_ambush_tt: "Переговоры оказываются ловушкой — каноэ обступают лодки со всех сторон, и флоту приходится с боем и кровью прорываться прочь"
 pacific_crossing_events.20.c: "Высадиться в силе и взять то, что есть на острове, оружием."
 pacific_crossing_events.20.raid_win_tt: "Высадка загоняет островитян обратно в лес, а их припасы достаются нападавшим"
 pacific_crossing_events.20.raid_lose_tt: "Островитяне яростно защищают свои дома, и налётчики, понеся потери, отступают обратно к лодкам"
 pacific_crossing_events.21.title: "Отброшены назад"
 pacific_crossing_events.21.desc: "Неделя за неделей флот с трудом пробивается на восток, и неделя за неделей море сводит на нет всё достигнутое. Пассат не ослабевает и не меняет направления; он стоит стеной прямо перед носом, а течение под ним идёт тем же путём, унося корабли на запад ночью быстрее, чем они успевают продвинуться на восток днём. Лоцманы делают замеры, сверяют их и умолкают — линия на карте перестала двигаться вперёд и начала сползать назад.\n\nС этим не поспоришь — это беличье колесо, а не путь, и каждый день, проведённый в нём, обходится в воду и жизни впустую. Остаётся лишь горький выход: развернуться, бежать перед ветром, что одержал над флотом победу, и увести флот назад к Островам Пряностей, чтобы всё обдумать заново."
 pacific_crossing_events.21.a: "Это море не подчинить силой."
 pacific_crossing_events.22.title: "Петиция команды"
 pacific_crossing_events.22.desc: "С каждым днём запасы иссякают быстрее, чем растёт число пройденных миль. Воды мало, и она протухла, сухари превратились в труху, а список больных удлиняется с каждым утром. К корме подходит делегация старших матросов — не бунт, во всяком случае пока, но с непреклонной убеждённостью людей, умеющих считать бочки. Они произвели расчёт всего плавания, и он не в их пользу. Поворачивайте назад, говорят они, пока в трюме ещё достаточно, чтобы добраться до известного берега. Идите дальше — и вы похороните флот в этом океане.\n\nВ их словах есть логика, как бы неприятно её ни было слышать."
 pacific_crossing_events.22.a: "Прислушаться к ним и повернуть флот назад, к Островам Пряностей."
 pacific_crossing_events.22.b: "Отказать. Мы зашли слишком далеко, чтобы поворачивать назад."
 pacific_crossing_events.23.title: "Blood on the Deck"
 pacific_crossing_events.23.desc: "Спор, начавшийся в тот день, когда отклонили прошение, так и не утих по-настоящему, и сегодня он переходит в драку. Боцман, преданный делу похода, обменивается оскорблениями с кучкой людей, всё ещё не простивших отказ повернуть назад; оскорбления переходят в толчки, а толчки — в потасовку, что быстро расползается по палубе, и не один клинок уже обнажён.\n\n[target_leader.GetName] прибывает на место и застаёт вахту уже в разгаре драки из-за ссоры, которая на деле никогда не была по-настоящему о боцмане."
 pacific_crossing_events.23.a: "Step in and break up the fight."
 pacific_crossing_events.23.b: "Throw the ringleader overboard and be done with it."
 pacific_crossing_events.23.c: "Heed them and turn the fleet back for the Spice Islands."
 pacific_crossing_events.23.break_up_win_tt: "The fight is broken up before real blood is spilled"
 pacific_crossing_events.23.break_up_lose_tt: "The brawl turns bloody before order is restored"
 pacific_crossing_events.23.overboard_tt: "The ringleader is seized and pitched into the sea without ceremony. The crew watches in cold silence"
 pacific_crossing_events.24.title: "Fire at Sea"
 pacific_crossing_events.24.desc: "С кормы доносится крик: один из кораблей флота охвачен пламенем. То, что началось как очередная драка из-за курса домой, в суматохе опрокинуло фонарь, и огонь уже бежит по такелажу быстрее, чем успевают наполнять вёдра. Искры несёт ветром к остальному флоту.\n\n[target_leader.GetName] должен быстро решить: сблизиться и помочь тушить пожар или держаться в стороне, предоставив горящему кораблю самому справляться со своей судьбой."
 pacific_crossing_events.24.a: "Встанем вплотную к их борту и поможем потушить пожар."
 pacific_crossing_events.24.b: "Встанем на расстоянии, пусть тушат себя сами."
 pacific_crossing_events.24.saved_tt: "Вместе мы быстро тушим пожар, пока он не успел охватить весь корабль"
 pacific_crossing_events.24.caught_fire_tt: "Из-за летящих искр пламя перекидывается на наш корабль"
 pacific_crossing_events.24.distance_tt: "Объятый пламенем корабль догорает до ватерлинии, пока остальной флот наблюдает за пожаром с безопасного расстояния"
 pacific_crossing_events.25.title: "Бунт на корабле"
 pacific_crossing_events.25.desc: "До [target_leader.GetName] доходит весть, поданная сигналом с одного из других кораблей: команда там восстала против своих офицеров, — тот же самый спор о возвращении назад скис в открытый мятеж. Верные долгу матросы забаррикадированы внизу, пока мятежники спорят, что делать дальше. Времени решить, вмешиваться ли, почти нет.\n\nСпущенная сейчас шлюпка ещё может переломить чашу весов на борту того корабля — а может просто отдать мятежникам второй трофей."
 pacific_crossing_events.25.a: "Поднимемся на борт и поддержим верную команду."
 pacific_crossing_events.25.b: "Встанем поодаль, пусть разбираются сами."
 pacific_crossing_events.25.c: "Послушаем бунтовщиков и развернёмся обратно к Островам Пряностей."
 pacific_crossing_events.25.loyal_win_tt: "Лоялисты одерживают верх, порядок восстановлен"
 pacific_crossing_events.25.loyal_lose_tt: "Бунтовщики побеждают абордажную команду и захватывают корабль"
 pacific_crossing_events.25.distance_tt: "Бунтовщики уводят корабль прочь, пока мы не успели ничего предпринять"
 pacific_crossing_events.26.title: "Очередное прошение"
 pacific_crossing_events.26.desc: "Делегация вернулась — на этот раз сдержаннее, но не менее решительно. Они не угрожают и не повышают голос; они просто излагают ту же арифметику, что и прежде, только ещё мрачнее после дней, прошедших с последнего отказа. Несколько небольших уступок могли бы купить некоторое спокойствие в трюмах, если [target_leader.GetName] готов их сделать.\n\nИли ответ может быть таким же, как в прошлый раз, — и прошение отправится обратно вниз, ни с чем."
 pacific_crossing_events.26.a: "Выслушаем просителей и пойдём на небольшие уступки."
 pacific_crossing_events.26.b: "Снова отмахнёмся от них и продолжим, как раньше."
 pacific_crossing_events.27.title: "Ночной саботаж"
 pacific_crossing_events.27.desc: "Ночью кто-то побывал у запасов: бочонок с водой продырявлен, бухта такелажа наполовину перерезана. Мелочи, но сделанные с явным умыслом. Тот, кто хочет повернуть это плавание вспять, решил, что слов уже недостаточно. [target_leader.GetName] может приказать провести настоящий розыск виновного, а может просто удвоить вахты и продолжать путь без разбирательств.\n\nВ любом случае послание уже получено."
 pacific_crossing_events.27.a: "Проведём расследование и найдём ответственного."
 pacific_crossing_events.27.b: "Удвоим часовых и продолжим без разбирательств."
 pacific_crossing_events.27.culprit_found_tt: "Виновный найден и показательно наказан перед всем экипажем"
 pacific_crossing_events.27.culprit_free_tt: "Поиски ни к чему не привели, они прекращены после того, как вредитель снова испортил припасы"
 pacific_crossing_events.27.no_investigation_tt: "Охрана удвоена, но припасы уже испорчены"
