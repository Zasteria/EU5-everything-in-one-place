l_russian:
 relic_expedition_events.1.title: "Охота за реликвией"
 relic_expedition_events.1.desc: "Епископы вознесли прошение, и [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')|l] отвечает согласием на их просьбу. Воротившийся из Леванта купец толкует об этом деле так: дамасский торговец пересказывал слова своего отца, будто в пору, когда гибли государства крестоносцев, добрую долю церковного добра франки успели унести и припрятать в земле, чтобы спасти от огня. А что зарыто, то можно и выкопать. Да и выкупить тоже не грех — если выйти на нужных людей в урочный час и не торговаться там, где у стен есть уши.\n\nКакая то была святыня и где запрятана — о том неведомо. Схожие байки ходят в любой гавани того побережья. Однако эта весть дошла до ушей тех, кто понимает её истинный смысл."
 relic_expedition_events.1.a: "Снарядим целую процессию: дадим дары, толмача, монаха и золота вволю."
 relic_expedition_events.1.b: "Нужен верный человек и немного золота. Лучше не привлекать лишнего внимания."
 relic_expedition_events.1.historical_info: "Животворящий Крест был вынесен на поле битвы при Хаттине в июле 1187 года и захвачен армией Саладина. Ричард Львиное Сердце, византийский император и царица Грузии пытались выкупить его, но потерпели неудачу. Последнее достоверное свидетельство указывает на то, что крест находился в Дамаске, после чего след реликвии окончательно теряется. Святое Копьё, обретённое в Антиохии в 1098 году, исчезло так же незаметно, едва Первый крестовый поход двинулся дальше. Судьба этих реликвий до сих пор неизвестна, и именно поэтому их поиски всё ещё продолжаются."
 relic_expedition_events.2.title: "Прибытие"
 relic_expedition_events.2.desc_jerusalem_first: "Путь привёл экспедицию в [ShowLocationName('jerusalem')] — прямо к вратам храма Гроба Господня. #L [location_scope.GetOwner.GetAdjective]ая#! стража мельком оглядывает прибывших и тут же отворачивается. Чужеземцы прибывают сюда каждый сезон ради одной и той же гробницы и одних и тех же историй. Где-то за этими историями кроется след, по которому стоит пойти, но его поиски будут долгими и дорогими, и во многом всё сведётся к тому, чтобы решить, кому именно верить."
 relic_expedition_events.2.desc_jerusalem_repeat: "[target_leader.GetName] снова в городе [ShowLocationNameWithNoTooltip('jerusalem')]. Местные каноники уже за версту нас eзнают, а стражники гарнизона и вовсе перестали поднимать головы при виде нашего отряда."
 relic_expedition_events.2.desc_acre_first: "Экспедиция прибывает в город [ShowLocationName('acre')], столицу Иерусалимского королевства, которая пала под натиском мамлюков в 1291 году. Собор всё ещё стоит — если так можно выразиться, ведь вместо крыши над ним теперь зияет небо, а целые кварталы так и не отстроены заново после разграбления. Ни у кого до сих пор просто не было причин копаться в этих руинах."
 relic_expedition_events.2.desc_acre_repeat: "И снова [ShowLocationNameWithNoTooltip('acre')]. [target_leader.GetName] уже знает, по каким улочкам стоит прогуляться ещё раз."
 relic_expedition_events.2.desc_antioch_first: "Экспедиция прибывает в город [ShowLocationName('antioch')], столицу княжества крестоносцев, канувшего в прошлое. Именно здесь отчаянным летом 1098 года из-под пола церкви извлекли $relic_holy_lance_found$. На Западе так и не пришли к единому мнению о том, куда исчезло копьё после того, как войско двинулось на юг, к городу [ShowLocationNameWithNoTooltip('jerusalem')]. И это далеко не единственное, что бесследно пропало в этих краях."
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] снова в городе [ShowLocationNameWithNoTooltip('antioch')] в поисках копья и всё так же на каждый вопрос получает три разных ответа."
 relic_expedition_events.2.desc_damascus_first: "Экспедиция прибывает в город [ShowLocationName('damascus')] — великую #L [location_scope.GetOwner.GetAdjective|l]ую#! столицу региона [ShowProvinceDefinitionName('shaam_province')] и последнее место, где, по достоверным сведениям, видели $relic_true_cross_found$ после разгрома под Хаттином. Находится ли эта конкретная реликвия здесь до сих пор — совсем другой вопрос. За долгие столетия такой великий город вобрал в себя бездну сокровищ, но неохотно делился своим добром с чужаками."
 relic_expedition_events.2.desc_damascus_repeat: "Нас снова встречает [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] теперь знает, кто задаёт тон [location_scope.GetRank.Custom('end_predlog_vvo')] [location_scope.GetRank.Custom('LR_PREP')|l], и какой ценой это обходится."
 relic_expedition_events.2.desc_tripoli_first: "Экспедиция прибывает в #TOOLTIP:LOCATION,tripoli_syria,X #L Триполи#!#! — столицу графства крестоносцев, павшего в 1289 году. В порту идёт оживлённая торговля, а вот часовня в глубине старинной цитадели уже несколько поколений покрывается пылью. Её давно не освящали, однако убранство по-прежнему находится на месте."
 relic_expedition_events.2.desc_tripoli_repeat: "Мы снова в Триполи. [target_leader.GetName] привычно здоровается со знакомыми купцами в порту."
 relic_expedition_events.2.desc_tyre_first: "Экспедиция достигла #TOOLTIP:LOCATION,sur,X #L Тира#!#! — города столь древнего, что о его посещении Христом упоминается в Евангелиях. Местная твердыня до 1291 года оставалась одним из последних оплотов крестоносцев, а летописцы архиепископства на протяжении двух столетий вели подробные хроники #L #TOOLTIP:LOCATIONRANK,[location_scope.GetRank.Custom('LR_tt')],X [location_scope.GetRank.Custom('LR_GEN')|l]#!#!. Уцелевшие фрагменты их записей всё ещё хранятся в частных руках, однако никто из примерно дюжины владельцев не знает полного содержания летописей."
 relic_expedition_events.2.desc_tyre_repeat: "Мы возвращаемся в Тир. [target_leader.GetName] уже [Select_CString(target_ruler.IsFemale, 'изучила', 'изучил' )] большую часть записей, оставшихся от старинного архиепископства."
 relic_expedition_events.2.desc_jaffa_first: "Экспедиция прибыла в #TOOLTIP:LOCATION,jaffa,X #L Яффу#!#! — гавань, где в старину приставали бесчисленные корабли паломников. Считается, что именно там апостол Пётр воскресил из мёртвых вдову по имени Тавифа. В течении двух столетий через Яффу шёл непрерывный поток пилигримов, и некоторые из них так и остались в Святой Земле."
 relic_expedition_events.2.desc_jaffa_repeat: "Мы вернулись в Яффу. Обитатели портового района уже знают, какие вопросы будет задавать [target_leader.GetName]."
 relic_expedition_events.2.desc_hebron_first: "Экспедиция достигла #TOOLTIP:LOCATION,hebron,X #L Хеврона#!#! с его Пещерой Патриархов — местом упокоения Авраама, Исаака и Иакова, в равной степени святым для #TOOLTIP:RELIGIONGROUP,israelite_group,X #L иудеев#!#!, #TOOLTIP:RELIGIONGROUP,christian,X #L христиан#!#! и #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#!. Последователи трёх религий веками несли к этому святилищу свои подношения. Какой-нибудь небольшой предмет, оставленный здесь на сохранение в лихие годы, легко может затеряться бесследно…"
 relic_expedition_events.2.desc_hebron_repeat: "Мы вернулись в Хеврон. [target_leader.GetName] уже [Select_CString(target_ruler.IsFemale, 'бывала', 'бывал' )] на территории святилища и знает, как обойти его [Select_CString(target_ruler.IsFemale, 'незамеченной', 'незамеченным' )]."
 relic_expedition_events.2.desc_sidon_first: "Экспедиция достигла #TOOLTIP:LOCATION,sidon,X #L Сидона#!#!, ещё одного города, который посещал Христос. До падения королевств крестоносцев город был центром крупного феодального владения. С тех пор старый франкский квартал дважды заселялся новыми жителями, и нынешнее население понятия не имеет, что может храниться в их собственных подвалах…"
 relic_expedition_events.2.desc_sidon_repeat: "Мы снова в Сидоне. [target_leader.GetName] [Select_CString(target_ruler.IsFemale, 'составила', 'составил' )] список франкских домов, куда стоит заглянуть повторно."
 relic_expedition_events.2.desc_karak_first: "Экспедиция прибыла в #TOOLTIP:LOCATION,karak,X #L Карак#!#!, могучую крепость посреди пустыни, которой владел Рено де Шатильон в бытностью свою сеньором Заиорданья. Рено годами грабил караваны паломников, а добычу, по слухам, хранил именно здесь, готовясь к неизбежному возмездию со стороны Саладина. Однако в каждом доме эту историю рассказывают по-своему…"
 relic_expedition_events.2.desc_karak_repeat: "Мы возвращаемся в Карак. [target_leader.GetName] уже [Select_CString(target_ruler.IsFemale, 'слышала', 'слышал' )] легенды о замке, а некоторые и не по одному разу."
 relic_expedition_events.2.desc_gaza_first: "Экспедиция достигла #TOOLTIP:LOCATION,gaza,X #L Газы#!#!, древнего города на дороге в #TOOLTIP:REGION,egypt_region,X #L Египет#!#!. Когда-то его защищал гарнизон тамплиеров, но после разгрома ордена уцелевшие братья разбрелись по всему христианскому миру. Покидая Газу, они могли забрать с собой не всё…"
 relic_expedition_events.2.desc_gaza_repeat: "Мы снова в Газе. [target_leader.GetName] уже [Select_CString(target_ruler.IsFemale, 'поговорила', 'поговорил' )] с большинством жителей прежней обители тамплиеров."
 relic_expedition_events.2.desc_famagusta_first: "Экспедиция достигла #TOOLTIP:LOCATION,famagusta,X #L Фамагусты#!#!, крупного #L [location_scope.GetOwner.GetAdjective|l]ого#! порта в [location_scope.GetOwner.Custom('rank_ru_PREP')|l] #TOOLTIP:PROVINCE_DEFINITION,cyprus_province,X #L Кипр#!#!. После падения Акры в 1291 году сюда бежало множество семей латинян, и многие из них привезли с собой не только лишь титулы…"
 relic_expedition_events.2.desc_famagusta_repeat: "Мы вновь в Фамагусте. [target_leader.GetName] решает посетить собор Святого Николая."
 relic_expedition_events.2.desc_nicosia_first: "Экспедиция прибыла в #TOOLTIP:LOCATION,nicosia_cyp,X #L Никосию#!#!, крупнейший город #TOOLTIP:PROVINCE_DEFINITION,cyprus_province,X #L Кипра#!#!. При #L [location_scope.GetOwner.GetAdjective|l]ом#! дворе хранятся обширные переписи имущества, которое привезли с собой изгнанники из Святой Земли — и ещё более длинные списки того, что они впоследствии заложили…"
 relic_expedition_events.2.desc_nicosia_repeat: "Мы возвращаемся в Никосию. #L [location_scope.GetOwner.GetAdjective]ие#! архивариусы продолжают гадать, когда же [target_leader.GetName] оставит их в покое."
 relic_expedition_events.2.desc_rhodes_first: "Экспедиция прибыла в #L [location_scope.GetOwner.GetAdjective|l]ое#! владение #TOOLTIP:LOCATION,rodos,X #L Родос#!#!. Орден всё ещё помнит падение Акры, ведь это часть его собственной истории. Рыцари до сих пор берегут список командорств в Святой Земле, которые им пришлось уступить врагу. Никакой другой город в этой части света не допустит исследователей-католиков к таким архивам."
 relic_expedition_events.2.desc_rhodes_repeat: "Мы возвращаемся в Родос. #L [location_scope.GetOwner.GetAdjective]ие#! архивариусы вздыхают, понимая, что [target_leader.GetName] от них так просто не отстанет."
 relic_expedition_events.2.desc_fallback: "Очередная остановка на пути, очередные формальные представления. [target_leader.GetName] продолжает искать любые зацепки."
 relic_expedition_events.2.a: "Нужно расспросить местных. Вино легко развязывает языки солдатам и паломникам."
 relic_expedition_events.2.b: "Мы наконец-то напали на след священной реликвии."
 relic_expedition_events.2.c: "Надо нанять больше людей в свиту. Надёжные телохранители стоят недёшево."
 relic_expedition_events.2.d: "За взятку придворные чиновники допустят нас до местных архивов."
 relic_expedition_events.2.e: "Поищем учёных людей. Мыслящий ум быстрее отличает правду от вымысла."
 relic_expedition_events.2.f: "Мы нашли многообещающие сведения. [relic_hunt_new_lead.GetNameWithNoTooltip] — вот куда ведёт наш путь."
 relic_expedition_events.2.g: "Поиски отменяются. Пора возвращаться домой."
 relic_expedition_events.3.title: "Поиски продолжаются"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] возвращается к Храму Гроба Господня до рассвета, спеша опередить толпы паломников. [Select_CString(target_leader.IsFemale, 'Её', 'Его' )] ждёт ещё один склеп, который нужно осмотреть при свете свечей, ещё одна полустёршаяся надпись, которую следует переписать, ещё один священнослужитель, готовый поделиться секретами за вознаграждение."
 relic_expedition_events.3.desc_acre: "[target_leader.GetName] простукивает стены в поисках пустот, раскапывает обрушившуюся кладку, которую не тревожили на протяжении поколений. Акра — город крупный, а жителей там осталось совсем немного. Одной поисковой партии не хватит всей жизни, чтобы обыскать #L #TOOLTIP:COUNTRY_RANK,[relic_hunt_loc.GetRank.Custom('CF_tt')],X [relic_hunt_loc.GetRank.Custom('rank_ru_ACC')|l]#!#! целиком."
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] осматривает следы, оставшиеся от снесённых стен, сопоставляя линии на земле с рассказами паломников. Истории о том, где нашли копьё, расходятся друг с другом — и ни одна из них не совпадает с окружающей местностью."
 relic_expedition_events.3.desc_damascus: "[target_leader.GetName] обходит базар за базаром, налаживая контакты с купцами и менялами. В таком большом городе слухи расходятся медленно, но всё же расходятся — и у них всегда есть цена."
 relic_expedition_events.3.desc_tripoli: "Церковь при цитадели разбирают камень за камнем. Если стена отзывается подозрительным звуком, с неё немедленно снимают штукатурку. На разборку одной только часовни уйдут месяцы труда."
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] разбирает уцелевшие документы архиепископства Тира, разложив перед собой испорченные водой учётные книги и едва читаемые расписки в поисках записей, которые выделяются из общей массы."
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] целыми днями пропадает в гавани Яффы, угощая выпивкой грузчиков и моряков. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] надеется разузнать, на каких складах хранились грузы паломников до исхода франков."
 relic_expedition_events.3.desc_hebron: "[target_leader.GetName] медленно и с величайшей осторожностью осматривает святилище, стараясь не навлечь на себя гнев ни одной из трёх вер, которые его почитают. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] отмечает все запечатанные проходы, но старается не говорить о них лишний раз."
 relic_expedition_events.3.desc_sidon: "[target_leader.GetName] обходит старый франкский квартал дом за домом. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] стучится в каждую дверь и расспрашивает новых жильцов о подвалах и чердаках, стоящих закрытыми со времён исхода из города последних христиан."
 relic_expedition_events.3.desc_karak: "С фонарём в руке [target_leader.GetName] обходит подземные своды и резервуары Карака, мысленно сопоставляя описания сокровищницы Рено де Шатильона с реальным расположением стен крепости."
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] продолжает искать собственность разгромленного ордена по всей Газе. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] расспрашивает соседей, какие кладовые тамплиеры стерегли особенно строго и к кому могли попасть ключи от них."
 relic_expedition_events.3.desc_famagusta: "[target_leader.GetName] изучает имущество изгнанных из Святой Земли семейств сундук за сундуком, составляя тщательную опись всего, что оказалось вывезено из Акры в Фамагусту — и с тех пор пылилось в ларях."
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] читает архивы #L [relic_hunt_loc.GetOwner.GetAdjective]ого#! двора в Никосии, сравнивая описи имущества с наследственными реестрами в поисках реликвии, о местонахождении которой никто так и не догадался поинтересоваться."
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] не отстаёт от #L [relic_hunt_loc.GetOwner.GetAdjective|l]их#! архивариусов в Родосе, требуя выдать книги, которые они решили приберечь. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] хочет сопоставить их списки с тем, что, со слов старых братьев ордена, было вывезено из Акры."
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] не прекращает поисков, хватаясь даже за самую незначительную зацепку и рассматривая её со всех сторон."
 relic_expedition_events.3.a: "Надо спрашивать дальше. Кто-нибудь здесь наверняка знает больше, чем говорит."
 relic_expedition_events.3.b: "Наконец-то мы вышли на след!"
 relic_expedition_events.3.c: "Наймём больше людей в свиту, пока мы здесь."
 relic_expedition_events.3.d: "Подкупим другого чиновника. В этом городе есть ещё немало архивов."
 relic_expedition_events.3.e: "Надо посоветоваться с местным учёным."
 relic_expedition_events.3.f: "Полученные сведения указывают на новое место поисков. Это [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.3.g: "Поиски отменяются. Пора возвращаться домой."
 relic_expedition_events.4.title: "След остыл"
 relic_expedition_events.4.desc: "Все следы, которые [Select_CString(target_leader.IsFemale, 'искала', 'искал' )] [target_leader.GetName], так никуда не привели. Переводчики разбежались из таверн, подкупленным чиновникам больше нечего продавать, а меж тем кошель пустеет с каждым днём, попусту проведённым на чужбине. В столицу летит послание — нужно больше денег на поиски, либо придётся прекратить их вовсе."
 relic_expedition_events.4.a: "Отправим средства на развитие."
 relic_expedition_events.4.b: "Всё, хватит. Поиски завершаются."
 relic_expedition_events.5.title: "Эскорт потерян"
 relic_expedition_events.5.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'лишилась', 'лишился' )] всех сопровождающих. Кто-то пал в схватке с разбойниками, других свалила лихорадка, иные просто разбежались, устав от бесконечных поисков за слишком скромное вознаграждение.\n\nБез поддержки вооружённых спутников никто не сможет убедить лорда или настоятеля расстаться с бесценной реликвией. Поиски придётся свернуть."
 relic_expedition_events.5.a: "Без достойной свиты задание станет невыполнимым."
 relic_expedition_events.6.title: "Реликвия на продажу"
 relic_expedition_events.6.desc_true_cross: "Убедившись, что никто не подслушивает, один городской купец заявляет, что к нему в руки попала часть Истинного креста, утраченная после разгрома при Хаттине. Он отказывается разглашать, откуда у него реликвия, но готов назвать цену."
 relic_expedition_events.6.desc_holy_lance: "Потомки давно умершего солдата утверждают, что наконечник копья, хранившийся в их семье со времён прадедушки, — то самое Священное копьё, найденное в 1098 году. Деньги их прельщают больше реликвии."
 relic_expedition_events.6.desc_holy_shroud: "Купец разворачивает льняное полотно, на котором едва проступает образ распятого человека. Он не знает, откуда оно взялось и где пребывало всё это время, но желает получить за него немалую сумму."
 relic_expedition_events.6.desc_holy_nail: "Вдова кузнеца выкладывает почерневший от времени железный гвоздь. Родня её покойного мужа всегда утверждала, что это один из гвоздей, которыми был распят Спаситель. И она готова его продать."
 relic_expedition_events.6.desc_true_cross_fragment: "В бедном, позабытом всеми монастыре хранится деревянная щепка, заключённая в простой реликварий. На крышке указано, что это часть Истинного креста. Настоятель готов расстаться с реликвией, если вырученные деньги позволят ему сохранить крышу над головой."
 relic_expedition_events.6.desc_saint_bones: "Приходский священник выносит маленький ларец с костями. Выцветшая надпись на латыни гласит, что это мощи святого. Священник называет сумму, объявив её «пожертвованием церкви»."
 relic_expedition_events.6.desc_baptist_head: "В одной из местных церквей почитают древний череп, который, как считается, принадлежал Иоанну Крестителю. За пределами прихода об этом почти никто не знает, и священники готовы обсудить передачу реликвии."
 relic_expedition_events.6.desc_virgin_milk: "В небольшой часовне хранится запечатанный флакон с белым, похожим на мел осадком, который вот уже много поколений почитают как молоко Девы Марии. Хранитель готов продать его вместе с серебряным реликварием."
 relic_expedition_events.6.desc_holy_thorn: "В одном мелком дворянском роду хранится скромный реликварий, внутри которого лежит шип терновника. С их слов, шип принадлежал их предку и был частью Тернового венца. Они надеются, что о продаже никто не узнает."
 relic_expedition_events.6.desc_holy_chalice: "Сразу оговорившись, что ему едва ли поверят, купец демонстрирует простой каменный кубок и заявляет, что именно он является истинной чашей с Тайной вечери, что бы там ни говорили другие. Цену он заломил немалую."
 relic_expedition_events.6.desc_titulus_crucis: "Если верить местным преданиям, когда Крест уносили на запад, прибитую над ним доску с надписью оставили здесь и надёжно спрятали. Одна из здешних семей утверждает, что доска досталась им по наследству — и они готовы её продать."
 relic_expedition_events.6.a: "Надо поторговаться. Запрошенная цена высока, но её можно сбить."
 relic_expedition_events.6.b: "Мы заплатим, сколько требуют. Некоторые вещи стоят любых денег."
 relic_expedition_events.6.c: "Численность нашей свиты станет лучшим аргументом в споре."
 relic_expedition_events.7.title: "Завершение сделки"
 relic_expedition_events.7.desc: "Условия согласованы, реликварий уже завернули в ткань. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] лишь решить, можно ли доверять словам продавца."
 relic_expedition_events.7.a: "Мы заплатим и отвезём реликвию домой."
 relic_expedition_events.7.b: "Что-то здесь нечисто. Сделки не будет."
 relic_expedition_events.8.title: "Сговорчивый помощник"
 relic_expedition_events.8.desc_true_cross: "Слуга в доме местного вельможи, затаивший злобу на своего господина, упоминает, что среди сокровищ его хозяина хранится завёрнутый в тряпицу кусок тёмного дерева. Вельможа утверждал, что это фрагмент Истинного креста. За деньги слуга поможет нам забрать реликвию."
 relic_expedition_events.8.desc_holy_lance: "Один солдат из местного гарнизона, не получавший жалованья уже год, проговорился, что в оружейной хранится старый наконечник копья, на который давно не обращают внимания. Старики утверждают, что это то самое Священное копьё. Солдат готов провести нас внутрь."
 relic_expedition_events.8.desc_holy_shroud: "Монастырский привратник, недавно вдрызг разругавшийся с настоятелем, признаётся, что в его монастыре хранится сложенное полотно с отпечатком образа. Его держат под замком, и только старшие из братьев имеют доступ к святыне. Привратник готов оставить вход незапертым."
 relic_expedition_events.8.desc_holy_nail: "Погрязший в долгах писец казначейства признаётся, что в одном из боковых хранилищ лежит старый железный гвоздь, почитаемый как один из гвоздей Распятия. Реликвия не внесена ни в одну опись, а единственный ключ хранится у него."
 relic_expedition_events.8.desc_true_cross_fragment: "Разочаровавшийся в своём призвании послушник готов оставить незапертой ставню в часовне, где хранится щепка Истинного креста."
 relic_expedition_events.8.desc_saint_bones: "Могильщик, которому всю жизнь недоплачивали за его труд, знает, где священники его прихода хранят ларец с костями святого, и в какой час ризничий ложится отдохнуть после полудня."
 relic_expedition_events.8.desc_baptist_head: "Младший каноник, которому надоело ждать повышения, вызвался проводить нас к реликварию, где, по преданию, хранится голова Иоанна Крестителя."
 relic_expedition_events.8.desc_virgin_milk: "Сам смотритель святыни, годами копивший обиду из-за нищенского жалованья, в одну из выбранных им ночей готов оставить корпус реликвария незапертым."
 relic_expedition_events.8.desc_holy_thorn: "Управляющий поместья, сначала уволенный, а потом из жалости возвращённый на службу, знает точно, где семья хранит реликварий с шипом из Тернового венца."
 relic_expedition_events.8.desc_holy_chalice: "Ризничий собора не питает симпатий к капитулу, которому служил столько лет. Он готов помочь нам похитить простой каменный кубок, который монахи между собой называют истинной чашей с Тайной вечери."
 relic_expedition_events.8.desc_titulus_crucis: "Семья, в которой из поколения в поколение передаётся старое предание, предлагает необычную сделку: помочь им вернуть доску с надписью, которая была прибита к Кресту. Реликвия находится в руках их родственника, и тот отказывается её продавать."
 relic_expedition_events.8.a: "Скрытность стоит денег."
 relic_expedition_events.8.d: "Зачем тратить деньги, ведь [target_leader.GetName] может уговорить любого!"
 relic_expedition_events.8.b: "Обойдёмся без их помощи. Всякий сообщник — потенциальный свидетель."
 relic_expedition_events.8.c: "Помощники нам не нужны. Наша свита просто отберёт реликвию."
 relic_expedition_events.9.title: "Кража"
 relic_expedition_events.9.desc: "Пока всё идёт по плану. Те, кто должны были стоять на страже, либо спят, либо отлучились, либо получили свои деньги и притворились, что ничего не видели. Дверь, как и обещал сообщник, осталась незапертой. [target_leader.GetName] прячется в темноте, ожидая условленного сигнала от соглядатая."
 relic_expedition_events.9.a: "Дело сделано. Реликвия у нас, а они так ничего и не знают."
 relic_expedition_events.9.b: "Кто-то проснулся! Отовсюду доносятся крики и топот ног. Уходим!"
 relic_expedition_events.10.title: "Наставления мудреца"
 relic_expedition_events.10.desc_true_cross: "A traveling scholar who has read every chronicle of Hattin has narrowed down, from three accounts that agree almost by accident, the stretch of ground where retreating knights are said to have buried a fragment of $relic_true_cross_found$ rather than lose it to Saladin. He offers his notes, his weathered maps, and himself."
 relic_expedition_events.10.desc_holy_lance: "A scholar of the First Crusade believes he has located, from [GetCharacter('koj_petrus_bartholomaeus').GetName]'s own account, the cellar where $relic_holy_lance_found$ came up in 1098. He argues that whatever lay beside it was never fully recovered. Rival clerics called the notion fanciful at the time, but none of them disproved it."
 relic_expedition_events.10.desc_holy_shroud: "An elderly antiquarian is half-convinced by a rumor he cannot properly source: an image-bearing shroud walled into a crypt by monks fleeing a raid that appears in no chronicle. He is nearly blind and wants one last discovery, and he will lead us to the place himself."
 relic_expedition_events.10.desc_holy_nail: "A scholar of relics points to a half-collapsed chapel where local tradition has a fleeing priest burying a Crucifixion nail ahead of soldiers passing through."
 relic_expedition_events.10.desc_true_cross_fragment: "Three generations of monastery ledgers, read end to end, have brought a scholar to a hermitage abandoned in haste, where the last hermit is said to have put a fragment of $relic_true_cross_found$ under the chapel floor before running for his life."
 relic_expedition_events.10.desc_saint_bones: "A local hagiographer working from crumbling parish registers has settled on an unmarked grave at the edge of an old cemetery: a minor saint whose bones were hidden rather than left to a hostile army."
 relic_expedition_events.10.desc_baptist_head: "From a fragmentary chronicle found in a monastery archive, a scholar argues that a reliquary venerated as the head of John the Baptist went under the floor of a chapel during an old siege, and that the chapel came down on top of it."
 relic_expedition_events.10.desc_virgin_milk: "A scholar citing a pilgrim's diary nobody else has bothered to read points to a walled-up niche in an abandoned shrine, where the custodians are said to have hidden a vial of the Virgin's milk instead of handing it over to looters."
 relic_expedition_events.10.desc_holy_thorn: "A scholar has read his way through a dead family's private correspondence and traced a thorn from the Crown itself to their crypt, sealed since the plague that emptied the household."
 relic_expedition_events.10.desc_holy_chalice: "There is a strand of Grail legend here with nothing to do with the famous claims at [ShowLocationName('genoa')] and [ShowLocationName('valencia')]. The scholar who follows it believes a plain stone cup lies under a chapel destroyed in an old siege, its congregation scattered long before anyone thought to dig."
 relic_expedition_events.10.desc_titulus_crucis: "Local tradition holds that the inscription board of the Cross never went west at all. A scholar who takes that tradition seriously thinks it was walled up in a chapel here during the final Crusader retreat, and offers to help find the wall."
 relic_expedition_events.10.a: "Hire local laborers. More hands, better odds of success."
 relic_expedition_events.10.b: "Dig with the expedition's own men. Fewer questions asked."
 relic_expedition_events.10.c: "No need to pay outsiders. Our own retinue can dig instead."
 relic_expedition_events.11.title: "The Excavation"
 relic_expedition_events.11.desc: "The ground is stubborn and the digging slow. [target_leader.GetName] can do nothing now but wait and learn whether the scholar can read a map."
 relic_expedition_events.11.a: "The spades strike something. Just where the scholar said."
 relic_expedition_events.11.b: "Nothing but earth and rubble. The site was emptied."
 relic_expedition_events.clues_up_1_tt: "The trail grows warmer (#G +1#! Clues)"
 relic_expedition_events.clues_down_1_tt: "The trail grows colder (#R -1#! Clues)"
 relic_expedition_events.retinue_up_10_tt: "The expedition's retinue grows (#G +10#! Retinue)"
 relic_expedition_events.retinue_down_5_tt: "The expedition's retinue is diminished (#R -5#! Retinue)"
 relic_expedition_events.retinue_down_8_tt: "The expedition's retinue is diminished (#R -8#! Retinue)"
 relic_expedition_events.retinue_down_10_tt: "The expedition's retinue is diminished (#R -10#! Retinue)"
 relic_expedition_events.retinue_down_15_tt: "The expedition's retinue is diminished (#R -15#! Retinue)"
 relic_expedition_events.retinue_down_25_tt: "The expedition's retinue is diminished (#R -25#! Retinue)"
 relic_expedition_events.relic_recovered_tt: "Recovers the relic and starts the journey home"
 relic_expedition_announce_true_cross_tt: "Every Catholic ruler will learn that $relic_true_cross_found$ has been found"
 relic_expedition_announce_holy_lance_tt: "Every Catholic ruler will learn that $relic_holy_lance_found$ has been found"
 relic_expedition_announce_holy_shroud_tt: "Every Catholic ruler will learn that $relic_holy_shroud_found$ has been found"
 relic_expedition_events.12.title: "Rival Treasure Hunters"
 relic_expedition_events.12.desc: "A tavern keeper glad to be paid twice brings word to [target_leader.GetName]: agents of a rival power have been sitting in the same rooms, buying drink for the same dockhands, and asking after the very rumor that brought us out here. They came ashore a week ahead of us and have not been careful with their money since. Silence and cooperation both have a price in this town, and whoever meets it first keeps the trail."
 relic_expedition_events.12.a: "Offer more than they can. The crown will better any sum."
 relic_expedition_events.12.b: "Let them chase this one. Others will come by spring."
 relic_expedition_events.12.c: "Wait for them at the narrows, and end the matter there."
 relic_expedition_events.13.title: "A Forger's Workshop"
 relic_expedition_events.13.desc: "An artisan is caught selling a saint's fingerbone to a credulous pilgrim, carved out of mutton that same morning and stained with tea. Pressed on who else he has cheated, he swears instead that he knows of something genuine, come across while he was gathering old wood and older iron for the workshop. He will name the district but not the street until he sees coin. A forger's word is worth precisely what a forger's word is worth."
 relic_expedition_events.13.a: "Pay him for what he claims, but only the once."
 relic_expedition_events.13.b: "Have the retinue press him. Fear is cheaper than silver."
 relic_expedition_events.13.forger_honest_tt: "For once, the coin buys something true, and the forger's story holds"
 relic_expedition_events.13.forger_cheated_tt: "The district he named holds nothing but gossip; the forger has been paid twice for the same lie"
 relic_expedition_events.13.threats_work_tt: "Fear loosens what silver could not, and the forger gives up something real"
 relic_expedition_events.13.threats_fail_tt: "He squeals only louder excuses; the retinue's threats bought nothing but bruised knuckles"
 relic_expedition_events.14.title: "Sandstorm on the Road"
 relic_expedition_events.14.desc: "A wall of ochre dust stands up on the horizon around midday and has swallowed the road within the hour. The camels fold their legs and refuse to rise, grit works into every fold of cloth and every water skin, and the guide admits he can no longer make out the cairns that mark the way. [target_leader.GetName] can press on blind or lose days waiting the storm out."
 relic_expedition_events.14.a: "Push on through it. The road cannot have gone far."
 relic_expedition_events.14.b: "Weight the tents, make camp, and let it blow itself out."
 relic_expedition_events.15.title: "Fever Strikes"
 relic_expedition_events.15.desc_land: "The fever came in with the water carriers and takes men in twos and threes with almost no warning: an aching head at dawn, shaking by noon, a shallow grave by the second morning. The company's two physicians are already past helping everyone who asks for them, and the healthy have begun sleeping well apart from the sick. [target_leader.GetName] must decide what the crown will spend on containing it."
 relic_expedition_events.15.desc_sea: "The fever came aboard with the last water taken on at port, and takes men in twos and threes with almost no warning: an aching head at dawn, shaking by noon, a body slipped over the rail by the second morning. The company's two physicians are already past helping everyone who asks for them in the cramped hold, and the healthy have begun sleeping as far from the sick as the deck allows. [target_leader.GetName] must decide what the crown will spend on containing it."
 relic_expedition_events.15.a: "Spare no expense treating the sick and keeping them apart."
 relic_expedition_events.15.b: "Let it run its course. Fevers burn out soon enough."
 relic_expedition_events.16.title: "Desert Bandits Demand Tribute"
 relic_expedition_events.16.desc: "Armed men are drawn up across the road where it drops between two ridges, too many of them and too well ordered to be common opportunists. Their leader walks his horse out ahead of the line, names a sum for safe passage, and makes it plain that he has already weighed what the alternative would cost him."
 relic_expedition_events.16.a: "Pay the toll, and go before he reconsiders his price."
 relic_expedition_events.16.b: "Fight through them. We did not come this far to be robbed."
 relic_expedition_events.16.c: "Let our numbers do the talking. Few argue with this many."
 relic_expedition_events.17.title: "A Pilgrim's Rumor"
 relic_expedition_events.17.desc: "A caravan of pilgrims shares the waystation for the night, and the talk at the fire turns to relics, as it always does. One of them, a wool merchant's son from far inland, repeats a story he half remembers from an uncle twenty years dead: monks carrying a bundle out of a burning house, a night on the coast road, and a burial nobody was meant to see. He cannot name the house. He is oddly certain about the road."
 relic_expedition_events.17.a: "Buy the man another cup, and press him for every detail."
 relic_expedition_events.17.b: "One more tale among a thousand. We move on at first light."
 relic_expedition_events.17.tale_confirmed_tt: "A coin loosens his tongue, and a detail slips free that he probably should not have shared"
 relic_expedition_events.17.tale_fades_tt: "Another cup does not help; the details only blur further with every retelling"
 relic_expedition_events.18.title: "The Money Runs Short"
 relic_expedition_events.18.desc: "A poor month of exchange, and moneylenders who have grown suddenly careful about lending to foreigners, leave the expedition's coffers a good deal thinner than reckoned. The retinue's wages are already a fortnight behind, the muleteers want paying in coin they trust rather than ours, and word of an unpaid company travels through these towns faster than any of our questions do."
 relic_expedition_events.18.a: "Cover the shortfall from the crown's own purse, quickly."
 relic_expedition_events.18.b: "Let their pay lapse a little longer. They have nowhere else."
 relic_expedition_events.19.title: "The Local Authorities Take Notice"
 relic_expedition_events.19.desc_muslim: "The local #italic qāḍī#! has heard that foreigners are asking pointed questions about Frankish treasure, and about which households kept what for themselves when the kingdoms fell. His secretary calls on [target_leader.GetName] with tea, compliments, and a message plain enough beneath the courtesy: such inquiries proceed far more smoothly with his master's knowledge, and with a suitable contribution toward the upkeep of the mosque."
 relic_expedition_events.19.desc_christian: "The local [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] have noticed a foreign company inquiring rather too closely after relics they hold to be the business of the Church and of nobody else. The archdeacon receives [target_leader.GetName] with every courtesy, speaks at some length on the sin of avarice, and leaves no doubt at all that his continued goodwill will want a gift laid on the altar."
 relic_expedition_events.19.desc_fallback: "Talk of the expedition's questions has reached ears better left undisturbed. A man nobody troubles to introduce arrives at the lodging house after dark, sits down without being invited, and explains at length how much trouble a foreign party can find for itself in a town like this one. The warning is unhurried, entirely polite, and perfectly clear."
 relic_expedition_events.19.a: "Pay the necessary respects, seen by the right people."
 relic_expedition_events.19.b: "Ignore the warning and keep working. Time is short enough."
 relic_expedition_events.20.title: "The True Cross Recovered"
 relic_expedition_events.20.desc: "Word reaches the courts of Christendom that [relic_finder.GetName] has recovered $relic_true_cross_found$, unaccounted for since the disaster at Hattin, and now keeps it in their own treasury. Every cathedral chapter will want its own account of how it was found, and few of them will agree on its legitimacy."
 relic_expedition_events.20.a: "Word travels fast in Christendom."
 relic_expedition_events.21.title: "The Holy Lance Resurfaces"
 relic_expedition_events.21.desc: "News spreads among the faithful that [relic_finder.GetName] has recovered $relic_holy_lance_found$, unaccounted for since the First Crusade moved on from [ShowLocationName('antioch')]. More than one pilgrim itinerary will be redrawn on the strength of it."
 relic_expedition_events.21.a: "Another relic finds its way home."
 relic_expedition_events.22.title: "The Holy Shroud Found"
 relic_expedition_events.22.desc: "Reports circulate through Catholic Europe that [relic_finder.GetName] has come into possession of $relic_holy_shroud_found$, a cloth long spoken of and never yet accounted for. Skeptics will doubt it, as they always have. The faithful will make the journey regardless."
 relic_expedition_events.22.a: "Let the pilgrims judge for themselves."
