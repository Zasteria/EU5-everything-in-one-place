 relic_expedition_events.retinue_down_15_tt: "Свита экспедиции редеет (#R -15#! к свите)"
 relic_expedition_events.retinue_down_25_tt: "Свита экспедиции редеет (#R -25#! Свита)"
 relic_expedition_events.retinue_down_5_tt: "Свита экспедиции редеет (#R -5#! Свита)"
 relic_expedition_events.retinue_down_8_tt: "Свита экспедиции редеет (#R -8#! Свита)"
 relic_expedition_events.retinue_up_10_tt: "Свита экспедиции пополняется (#G +10#! свита)"
 relic_expedition_events.5.desc: "[target_leader.GetName]'s escort is gone, lost in twos and threes to bandits, to fever, and to the quiet desertion of men paid too little for a search with no end in sight. Nobody presses a lord or an abbot for a relic they have no wish to surrender without armed men standing behind the request.\n\nThe hunt ends here."
