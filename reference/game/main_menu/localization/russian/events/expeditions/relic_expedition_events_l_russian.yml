 relic_expedition_announce_holy_lance_tt: "Все католические правители узнают, что найдено Святое Копьё"
 relic_expedition_announce_holy_shroud_tt: "Все католические правители узнают, что найдена Святая Плащаница"
 relic_expedition_events.12.title: "Соперники в поисках"
 relic_expedition_events.12.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'получила', 'получил' )] тревожные вести от владельца таверны, почуявшего шанс лишний раз поживиться. Мы не одни заняты поисками реликвии — неделей раньше в городе появились посланники другой державы, и им нужно то же, что и нам. Они посещают те же питейные заведения, угощают тех же грузчиков и расспрашивают о тех же слухах, не скупясь на деньги. За золото здесь можно купить и молчание, и сотрудничество, и на след сможет выйти тот, кто первым заплатит нужную цену."
 relic_expedition_events.12.a: "Мы можем заплатить больше, чем они. Корона не скупится на расходы."
 relic_expedition_events.12.b: "Пусть себе ищут. К весне появятся и другие."
 relic_expedition_events.12.c: "Дождёмся их в узком ущелье и покончим с этим делом."
 relic_expedition_events.13.title: "Мастерская мошенника"
 relic_expedition_events.13.desc: "Одного ремесленника поймали за попыткой продать доверчивому паломнику поддельную «костяшку пальца святого», которую он этим же утром вырезал из бараньей кости и подкрасил чаем. Когда его принялись расспрашивать, кого ещё он успел обмануть, мошенник начал божиться, что знает, где найти настоящую реликвию — он натолкнулся на неё, пока собирал старые доски и железо для своей мастерской. Он готов показать примерный район, но улицу назовёт только после оплаты. Можно ли верить его словам? Ровно настолько, насколько верят мошеннику."
 relic_expedition_events.13.a: "Заплатим ему, сколько просит — но только на первый раз."
 relic_expedition_events.13.b: "Пусть свита хорошенько его припугнёт. Страх обходится дешевле, чем серебро."
 relic_expedition_events.13.forger_honest_tt: "В кои-то веки деньги обеспечили результат — мошенник, как ни странно, не соврал"
 relic_expedition_events.13.forger_cheated_tt: "Там, где он указал, ничего не нашлось — одни лишь слухи. Негодяю дважды заплатили за его враньё"
 relic_expedition_events.13.threats_work_tt: "Страхом можно разговорить даже тех, кого не купишь за серебро. Мошенник не соврал"
 relic_expedition_events.13.threats_fail_tt: "Негодяй изворачивается как может. Охранники зря разбили об него кулаки"
 relic_expedition_events.14.title: "Песчаная буря"
 relic_expedition_events.14.desc: "Около полудня на горизонте вырастает стена рыжей пыли, уже через час она полностью скрывает дорогу. Верблюды ложатся и отказываются вставать, в бурдюки и под одежду проникает песок, а проводник признаёт, что больше не различает отмечающие путь каменные пирамидки. [target_leader.GetName] может либо продолжать двигаться вслепую, либо переждать бурю и потерять несколько дней."
 relic_expedition_events.14.a: "Движемся дальше. Вряд ли мы отошли далеко от дороги."
 relic_expedition_events.14.b: "Закрепить шатры и разбить лагерь. Буря скоро пройдёт."
 relic_expedition_events.15.title: "Лихоманка"
 relic_expedition_events.15.desc_land: "Болезнь пришла в лагерь вместе с водоносами. Она поражает людей почти без предупреждения, одного за другим: с утра начинает болеть голова, к полудню больных трясёт от озноба, а на следующее утро их тела уже приходится хоронить. Два лекаря, сопровождающие отряд, не в силах помочь всем нуждающимся, а здоровые даже спать стараются подальше от заражённых. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, сколько средств корона готова потратить на сдерживание эпидемии."
 relic_expedition_events.15.desc_sea: "Болезнь попала на борт вместе с водой, набранной в последнем порту. Она поражает людей почти без предупреждения, одного за другим: с утра начинает болеть голова, к полудню больных трясёт от озноба, а на следующее утро их тела уже приходится выбрасывать за борт. Два лекаря, сопровождающие отряд, не в силах помочь всем нуждающимся, а здоровые стараются даже спать подальше от заражённых — насколько позволяет корабельная теснота. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, сколько средств корона готова потратить на сдерживание эпидемии."
 relic_expedition_events.15.a: "Не жалеть средств на изоляцию и уход за заболевшими."
 relic_expedition_events.15.b: "Пусть всё идёт своим чередом. Вспышки лихорадки быстро проходят."
 relic_expedition_events.16.title: "Разбойники пустыни требуют дани"
 relic_expedition_events.16.desc: "Там, где дорога уходит в ущелье между двумя грядами, на пути отряда стоит группа вооружённых людей. Для обычных дорожных грабителей их слишком много, и они слишком хорошо дисциплинированны. Предводитель выезжает вперёд и требует плату за проезд. Очевидно, он уже взвесил все за и против, и вероятный отказ его не пугает."
 relic_expedition_events.16.a: "Надо заплатить и ехать дальше, пока он не передумал."
 relic_expedition_events.16.b: "Будем пробиваться силой. Мы зашли так далеко не для того, чтобы нас ограбили!"
 relic_expedition_events.16.c: "Численность нашего отряда сама по себе является достаточным аргументом."
 relic_expedition_events.17.title: "Рассказ паломника"
 relic_expedition_events.17.desc: "Вместе с нами на постоялом дворе остановился на ночь караван паломников. Беседа за костром, как водится, заходит о реликвиях, и очередь доходит до сына торговца шерстью из далёкой глубинки. Он с усилием припоминает историю, которую некогда слышал от своего дяди, уже лет двадцать как умершего. Монахи, выносящие загадочный свёрток из охваченного пламенем дома, дорога вдоль побережья, освещённая лишь светом звёзд… и погребение, о котором не должны были узнать непосвящённые. Парень не знает, что это был за дом, а вот дорогу описывает на удивление уверенно."
 relic_expedition_events.17.a: "Надо купить ему ещё кружку и расспросить во всех подробностях."
 relic_expedition_events.17.b: "Всего лишь ещё одна байка из тысяч подобных. Мы выезжаем на рассвете."
 relic_expedition_events.17.tale_confirmed_tt: "Серебро развязывает ему язык, и вскоре он выдаёт то, о чём следовало бы молчать"
 relic_expedition_events.17.tale_fades_tt: "Вино не помогает, с каждым пересказом подробности становятся всё более неразборчивыми"
 relic_expedition_events.18.title: "Деньги на исходе"
 relic_expedition_events.18.desc: "Последний месяц выдался неудачным для обмена денег, и здешним менялам быстро расхотелось давать взаймы чужеземцам. Казна отряда быстро пустеет, свита уже две недели не получает жалованье, а погонщики мулов отказываются брать наши монеты и требуют выплаты в местных деньгах. Слухи об экспедиции, оказавшейся на мели, путешествуют куда быстрее нашего отряда."
 relic_expedition_events.18.a: "Мы покроем недостачу из казны короны — и как можно скорее."
 relic_expedition_events.18.b: "Пусть потерпят ещё немного. Всё равно другого выхода у них нет."
 relic_expedition_events.19.title: "Местные власти что-то пронюхали"
 relic_expedition_events.19.desc_muslim: "До местного #italic кади#! дошли слухи, что чужеземцы задают слишком много вопросов о сокровищах франков и настойчиво пытаются разузнать, к кому они могли попасть после падения государств крестоносцев. Вскоре [target_leader.GetName] получает приглашение на чай от его секретаря. Хозяин рассыпается в льстивых комплиментах, но за вежливыми речами кроется чёткое и недвусмысленное послание: поиски пойдут куда быстрее, если чужеземцы перестанут хранить секреты от его господина и сделают достойное подношение на содержание здешней мечети."
 relic_expedition_events.19.desc_christian: "Здешние [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')|l] обратили внимание на чужеземцев, которые слишком настойчиво интересуются местными реликвиями — вопросом, который касается лишь Церкви и никого более. Тогда [target_leader.GetName] договаривается об аудиенции с местным архидиаконом. Тот принимает [Select_CString(target_leader.IsFemale, 'гостью', 'гостя' )] со всей учтивостью, долго рассуждает о грехе алчности и ясно даёт понять, что его дальнейшая благосклонность будет зависеть от размера пожертвования."
 relic_expedition_events.19.desc_fallback: "Наши расспросы привлекли нежелательное внимание. После наступления темноты на постоялый двор явился некий мужчина, которого никто из местных не решился представить. Не спрашивая разрешения, он уселся за наш стол и в подробностях изложил, сколько неприятностей могут нажить себе в этом городе чужеземцы. Он рассуждал неторопливо, вежливо и вполне недвусмысленно."
 relic_expedition_events.19.a: "Придётся выказать должное почтение — причём так, чтобы это заметили."
 relic_expedition_events.19.b: "Проигнорировать предупреждение, времени и так нету."
 relic_expedition_events.20.title: "Животворящий Крест возвращён"
 relic_expedition_events.20.desc: "До христианских дворов дошли вести, что [relic_finder.GetName] [Select_CString(relic_finder.IsFemale, 'отыскала', 'отыскал' )] Животворящий Крест, утраченный после катастрофы под Хаттином, и теперь реликвия хранится в [Select_CString(relic_finder.IsFemale, 'её', 'его' )] сокровищнице. Церковные иерархи требуют сообщить им все подробности о чудесном обретении Креста, причём большинство из них заранее сомневается в его подлинности."
 relic_expedition_events.20.a: "Новости быстро расходятся по христианскому миру."
 relic_expedition_events.21.title: "Святое Копьё найдено"
 relic_expedition_events.21.desc: "Среди верующих прошёл слух, что [relic_finder.GetName] [Select_CString(relic_finder.IsFemale, 'нашла', 'нашёл' )] Святое Копьё, считавшееся потерянным после ухода воинства Первого крестового похода из #TOOLTIP:LOCATION,antioch,X #L Антиохии#!#!. Эти новости заставят пересмотреть многие традиционные маршруты паломничества…"
 relic_expedition_events.21.a: "Ещё одна реликвия возвращается домой."
 relic_expedition_events.22.title: "Святая Плащаница найдена"
 relic_expedition_events.22.desc: "По всей католической Европе говорят, что [relic_finder.GetName] [Select_CString(relic_finder.IsFemale, 'завладела', 'завладел' )] Святой плащаницей — покровом, который прежде существовал лишь в легендах. Скептики, конечно, сомневаются в подлинности реликвии, зато истинно верующие уже готовы отправляться в паломничество."
 relic_expedition_events.22.a: "Паломники сами разберутся, что к чему."
