l_russian:
 relic_expedition_events.1.title: "The Relic Embassy"
 relic_expedition_events.1.desc: "The bishops have asked, and the [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] has agreed. An embassy will set out for the keepers of one of Christendom's great relics, to obtain by gift, by purchase, or by careful negotiation what no army could simply take. The men we send will need to travel as both diplomats and pilgrims, well-supplied, well-spoken, and well-watched. The question is only how much state to put behind their setting out."
 relic_expedition_events.1.a: "Outfit them properly. Gifts, an interpreter, a senior friar, and an ample purse."
 relic_expedition_events.1.b: "A single agent and a discreet purse will do. The fewer who know, the better."
 relic_expedition_events.1.historical_info: "The medieval and early modern relic trade was a substantial commerce. Catholic and Orthodox communities competed for the most prestigious objects; sales, exchanges, and outright thefts moved relics across Christendom for centuries. Louis IX of France famously purchased the Crown of Thorns from the Latin Emperor Baldwin II in 1238 and built the Sainte-Chapelle in Paris to house it, an undertaking that was as much an act of state as of piety."
 relic_expedition_events.20.title: "A Pilgrim with a Map"
 relic_expedition_events.20.desc: "An old man overtakes the embassy on the road, a battered scrip on his shoulder and a staff worn smooth at the grip. He has been to the holy site we are bound for; he has seen the relic; he can describe the chapel, the guards, the bishop, and the lay of the land for half a league around. He asks only for a place by the fire, a cup of wine, and the chance to talk. [target_leader.GetName] sits him down and listens for two hours."
 relic_expedition_events.20.a: "Bid him farewell with a coin and his blessing. The road has just become shorter."
 relic_expedition_events.20.historical_info: "Pilgrim networks across medieval Christendom carried a vast informal store of practical knowledge: roads, prices, dangerous passes, hospitable monasteries, the personalities of bishops and counts encountered along the way. A returning pilgrim was often a more useful informant than any official agent the crown could have sent, and embassies regularly recruited their guides from this pool."
 relic_expedition_events.21.title: "A [target_country.GetAdjectiveWithNoTooltip] Commandery"
 relic_expedition_events.21.desc: "The embassy reaches the [ShowBuildingTypeName('order_commandery')] of the [target_country.GetLongName] on the inland road in [target_location.GetName], fortified by a low stone curtain wall and flying the cross. The preceptor receives the leader with proper ceremony, sees the embassy housed in the guest hall, has the horses watered and the men fed, and provides a written letter of safe passage for the next leg through territory disputed between three lords. The brothers ask nothing in return but a mass said in the commandery's chapel."
 relic_expedition_events.21.a: "Hear the mass, leave a generous gift on the altar, and resume the road well-rested."
 relic_expedition_events.21.historical_info: "The military orders, principally the Knights Hospitaller and the Templars before their suppression in 1312, maintained a chain of fortified hostels and commanderies along the major pilgrim routes from Western Europe to the Holy Land. Traveling parties of any pious purpose could expect food, shelter, and protected passage from one commandery to the next, and the orders' letters of introduction carried considerable weight at every Catholic court."
 relic_expedition_events.22.title: "The Abbot's Blessing"
 relic_expedition_events.22.desc: "The road in [target_location.GetName] winds past a nearby [ShowBuildingTypeName('orthodox_monastery')] built into the side of a gorge, its bells ringing for vespers as the embassy comes by. The abbot, hearing of the party's mission, comes down to bless the leader and to insist that the embassy stay the night in the guest house. He speaks long into the evening about the relic we seek, about the dignity of its keepers, about the proper manner in which to approach them. The leader writes everything down."
 relic_expedition_events.22.a: "Accept the blessing, leave alms for the monastery's poor, and continue."
 relic_expedition_events.22.historical_info: "Orthodox monasticism preserved a continuous tradition of relic veneration and inter-Christian diplomacy through the medieval period. Catholic embassies on relic business were often dependent on Orthodox monastic hospitality for the inland legs of their journey, and an abbot's letter of introduction to the local patriarch or imperial court could materially smooth the negotiations that followed."
 relic_expedition_events.23.title: "A Forgotten Reliquary"
 relic_expedition_events.23.desc: "In a hill chapel that has not been properly visited in living memory, the embassy's friar finds a small reliquary on a side altar, dusty, unguarded, and apparently forgotten by the parish. Inside, wrapped in faded silk, is a fragment of bone with a Latin label: #italic SS. THEODORI MARTYRIS#!. The local priest, when consulted, professes a vague awareness that something of the sort was supposed to be there, and is happy to part with the reliquary in exchange for a respectable gift to the parish."
 relic_expedition_events.23.a: "Take the reliquary back to the saddlebags. A lesser relic is still a relic."
 relic_expedition_events.23.historical_info: "Medieval Christendom was thick with minor relics: bones of obscure saints, fragments of holy garments, vials of supposed sacred earth or water, set into wooden, ivory, or precious-metal reliquaries and distributed to chapels and shrines across the countryside. Many such reliquaries fell out of veneration when the parish that had received them dwindled or the saint's cult faded; recovering one was a routine side benefit of any extended ecclesiastical journey."
 relic_expedition_events.30.title: "Bandits on the Pass"
 relic_expedition_events.30.desc: "A band of robbers, knowing the embassy carries a heavy purse, has set an ambush in the rocks above a mountain pass. The escort, alerted in time by a goatherd who came running down the road, forms square and stands off the attack, but two of our men are wounded and one of the pack mules carrying gifts is driven over the edge of the cliff with its load. The bandits melt back into the high country. The embassy continues, lighter than it set out."
 relic_expedition_events.30.a: "Continue. There is nothing to be done but go on."
 relic_expedition_events.30.historical_info: "Mountain passes in the medieval and early modern periods were the chronic haunts of brigands, who supplemented poor highland farming with toll-extortion and outright robbery of any party not strong enough to fight them off. The great roads of the Balkans, the Anatolian plateau, and the Levantine interior all had passes that no traveler approached without an escort, and the loss of pack animals over a cliff or down a ravine was a recurring entry in pilgrim chronicles."
 relic_expedition_events.31.title: "A Plague-Stricken Town"
 relic_expedition_events.31.desc: "The embassy has reached [target_location.GetName] only to find it sealed off by its own desperate [target_country.GetAdjective] magistracy. Plague has struck; the gates are barred to all comers; the smoke of burning houses rises behind the walls. [target_leader.GetName] orders the embassy to detour through the surrounding fields, but two of our men, who had gone ahead to negotiate lodging, are caught inside the town when the gates are closed. Whether they live or die, we will not know for some weeks."
 relic_expedition_events.31.a: "Detour and continue. Pray for the men we left behind."
 relic_expedition_events.31.historical_info: "Plague, including but not limited to the bubonic catastrophes of the fourteenth century, was a constant feature of medieval and early modern travel. Towns and cities routinely sealed their gates against incoming traffic when an outbreak began, and pilgrim and embassy parties unlucky enough to find themselves at the gate at the wrong moment had to detour at considerable cost. The fate of forerunners trapped inside was a routine source of grief in surviving travel accounts."
 relic_expedition_events.32.title: "A Storm at Sea"
 relic_expedition_events.32.desc: "The embassy's chartered galley, sailing along an unfamiliar coast, is caught by a sudden squall out of the north and driven onto a lee shore. The hull holds, but the masts go and the cargo of gifts is washed about in the bilges until half of it is ruined. The captain has the ship beached for two weeks of repairs. [target_leader.GetName], fuming, writes letters home that will not be answered for months and walks the beach trying to remember the last time anything had gone right."
 relic_expedition_events.32.a: "Wait for the repairs. The relic, presumably, will still be there."
 relic_expedition_events.32.historical_info: "Mediterranean and Aegean shipping in the pre-modern period was profoundly weather-dependent. Sudden squalls out of the Adriatic, the meltemi winds of the high Aegean, and the freak storms of the Levantine coast routinely drove vessels onto unfamiliar shores and forced costly delays for repairs. Pilgrim and diplomatic accounts of the period treat such groundings as a routine misfortune of travel, not as cause for serious panic."
 relic_expedition_events.33.title: "The Interpreter Falls Ill"
 relic_expedition_events.33.desc: "The multilingual interpreter, our principal asset for the negotiations to come, has fallen ill with a sudden fever in a roadside inn. [target_leader.GetName], unwilling to leave him to die among strangers, halts the embassy for three days; the camp physician does what he can; the local priest is sent for; nothing avails. On the fourth morning the interpreter is buried in the village churchyard. The embassy continues but now with limited linguistic resource."
 relic_expedition_events.33.a: "Continue. The mission is too important to abandon for one death."
 relic_expedition_events.33.historical_info: "Skilled interpreters were among the most valuable members of any pre-modern embassy. Cross-Christian negotiations, despite a shared faith, required Latin-Greek mediation that not every cleric could provide; the loss of a competent interpreter mid-journey was the kind of blow that could derail an embassy's entire purpose. Survivors of such losses tended to fall back on shared written Latin and ecclesiastical sign-language to muddle through."
 relic_expedition_events.10.title: "The True Cross"
 relic_expedition_events.10.desc: "The embassy has reached [target_location.GetName] and been received with full ceremony by the city's [ShowReligionGroupAdjective('christian')] custodians. The relic they guard, a fragment of the True Cross set into a gold reliquary, is offered to us at a price that befits its sanctity. The patriarch speaks softly and at length about the catastrophe at Hattin, about the wood lost to Saladin, about the smaller fragment that survived because a Frankish priest hid it under his cloak. He is not, in the end, unwilling to part with it. The terms remain to be agreed."
 relic_expedition_events.10.a: "Pay the asking price in full. Let every [ShowReligionAdjectiveWithNoTooltip('catholic')] court hear of this acquisition."
 relic_expedition_events.10.b: "Acquire it quietly. The asking price is high; the bishop's secretary is open to other arrangements."
 relic_expedition_events.10.c: "Withdraw. The price is sacrilege; we will not bargain for the Cross."
 relic_expedition_events.10.historical_info: "The True Cross relic, said to be a portion of the cross of the Crucifixion recovered by Saint Helena in the fourth century, was the holiest object in the medieval Catholic world. The principal fragment was carried into battle at the Horns of Hattin in 1187 and captured by Saladin's forces. It was never recovered. Smaller fragments, some of doubtful authenticity, circulated through Catholic and Orthodox treasuries for centuries afterwards, and the great Catholic cathedrals competed openly to acquire them."
 relic_expedition_events.11.title: "The Crown of Thorns"
 relic_expedition_events.11.desc: "The embassy has been received at the [target_country.GetGovernment.GetAdjective] palace in [target_location.GetName] and brought into the great relic chapel. There, behind iron grills and under perpetual lamplight, rests the crown that the Roman soldiers pressed onto Christ's brow at the praetorium. The [target_country.GetAdjective] treasurer is willing to discuss its transfer to us, though the negotiations will require both gold and ceremony. There is precedent for such an arrangement: the [GetCountry('BYZ').GetLongName], when their treasury was empty, had sold that same relic before."
 relic_expedition_events.11.a: "Pay openly, with all the gravity of a transaction between sovereigns. A chapel shall be built for it."
 relic_expedition_events.11.b: "Negotiate quietly with the treasury. A relic obtained in silence costs less."
 relic_expedition_events.11.c: "Withdraw. The price is impertinent; we shall not haggle for Christ's crown."
 relic_expedition_events.11.historical_info: "The Crown of Thorns was kept in the imperial relic chapel of the Pharos in Constantinople from the seventh century onwards. After the Latin Empire was established by the Fourth Crusade in 1204, the new Latin emperors mortgaged the crown to a Venetian banker and were unable to redeem it. Louis IX of France paid off the loan in 1238 and brought the relic to Paris, where he built the Sainte-Chapelle, completed in 1248, specifically to house it. The transfer was treated as one of the principal events of the reign."
 relic_expedition_events.12.title: "The Holy Lance"
 relic_expedition_events.12.desc: "The embassy has reached [target_location.GetName] and been brought before the relic kept in the [target_location.GetRank.GetName]'s cathedral. The lance, said to be that of the centurion Longinus and to have pierced Christ's side at the crucifixion, was found by the First Crusaders during the siege of 1098. The chapter is willing to transfer it; the bishop is willing; the [target_country.Custom('GetRulerOrRegentTitle')] is willing, if the price is right. They explain at length how the lance served in the past to bolster the morale of the [ShowReligionGroupAdjective('christian')] defenders of the [target_location.GetRank.GetNameWithNoTooltip]."
 relic_expedition_events.12.a: "Pay handsomely. The lance shall march with our armies."
 relic_expedition_events.12.b: "Acquire the lance through quiet payments to the chapter and the bishop's clerks."
 relic_expedition_events.12.c: "Withdraw. [target_location.GetNameWithNoTooltip] needs the lance more than we do."
 relic_expedition_events.12.historical_info: "The Holy Lance, discovered in Antioch during the First Crusade by the Provencal priest Peter Bartholomew on 14 June 1098, was credited by the Crusaders with the victory over Kerbogha's relieving army the same month. The find was already controversial in its own time; rival lance-relics existed in Constantinople, Vienna, Krakow, and Rome, and the Antioch lance's authenticity was disputed. The Vienna lance, the so-called Spear of Destiny, became part of the imperial regalia of the Holy Roman Empire and remains in the Hofburg today."
 relic_expedition_announce_holy_lance_tt: "Каждый католический правитель узнает, что $relic_holy_lance_found$ найдено"
 relic_expedition_announce_holy_shroud_tt: "Каждый католический правитель узнает, что $relic_holy_shroud_found$ найдена"
 relic_expedition_announce_true_cross_tt: "Каждый католический правитель узнает, что $relic_true_cross_found$ найден"
 relic_expedition_events.10.desc_baptist_head: "Опираясь на обрывок хроники, найденный в монастырском архиве, учёный утверждает, что реликварий, почитаемый как глава Иоанна Крестителя, был спрятан под полом часовни во время давней осады, а сама часовня впоследствии обрушилась прямо на него."
 relic_expedition_events.10.desc_holy_chalice: "Здесь бытует своя ветвь легенды о Граале, никак не связанная со знаменитыми притязаниями в [ShowLocationName('genoa')] и [ShowLocationName('valencia')]. Учёный, идущий по её следу, полагает, что простая каменная чаша покоится под часовней, разрушенной во время давней осады, чья паства рассеялась задолго до того, как кто-либо задумался о раскопках."
 relic_expedition_events.10.desc_holy_lance: "Один из хронистов Первого крестового похода полагает, что нашёл, опираясь на собственный рассказ [GetCharacter('koj_petrus_bartholomaeus').GetName], тот самый погреб, откуда в 1098 году был поднят $relic_holy_lance_found$. Он утверждает, что лежавшее рядом так и не было найдено полностью. Соперничающие священники в своё время называли эту мысль вздорной, но опровергнуть её так и не смогли."
 relic_expedition_events.10.desc_holy_nail: "Знаток реликвий указывает на полуразрушенную часовню, где, по местному преданию, бежавший священник закопал гвоздь с Распятия, спасаясь от проходивших мимо солдат."
 relic_expedition_events.10.desc_holy_shroud: "Пожилой антиквар почти уверовал в слух, источник которого он толком не может назвать: плащаница с изображением, замурованная в склепе монахами, бежавшими от набега, о котором не упоминает ни одна хроника. Он почти слеп и хочет напоследок совершить ещё одно открытие — и сам приведёт нас на это место."
 relic_expedition_events.10.desc_holy_thorn: "Учёный проштудировал частную переписку угасшего рода и проследил путь шипа из самого тернового венца до их фамильного склепа, запечатанного ещё со времён чумы, опустошившей этот дом."
 relic_expedition_events.10.desc_saint_bones: "Местный агиограф, изучив ветхие приходские книги, остановился на безымянной могиле на краю старого кладбища: там покоится малоизвестный святой, чьи мощи некогда спрятали, лишь бы они не достались вражескому войску."
 relic_expedition_events.10.desc_titulus_crucis: "Местное предание гласит, что табличка с надписью с Креста вовсе не была увезена на запад. Учёный, всерьёз относящийся к этому преданию, считает, что она была замурована в здешней часовне во время последнего отступления крестоносцев, и предлагает помочь отыскать эту стену."
 relic_expedition_events.10.desc_true_cross: "Странствующий учёный, прочитавший все хроники о битве при Хаттине, сузил, сопоставив три свидетельства, случайно почти совпавших между собой, участок земли, где, как говорят, отступавшие рыцари закопали частицу $relic_true_cross_found$, лишь бы она не досталась Саладину. Он предлагает свои записи, потрёпанные карты и самого себя."
 relic_expedition_events.10.desc_true_cross_fragment: "Три поколения монастырских записей, прочитанные от начала до конца, привели учёного к спешно покинутому скиту, где, как гласит предание, последний отшельник спрятал под полом часовни частицу $relic_true_cross_found$, прежде чем бежать, спасая свою жизнь."
 relic_expedition_events.10.desc_virgin_milk: "Учёный, ссылаясь на дневник паломника, который до него никто не удосужился прочитать, указывает на замурованную нишу в заброшенной святыне, где хранители, по преданию, спрятали сосуд с молоком Богородицы, лишь бы не отдавать его грабителям."
 relic_expedition_events.13.a: "Заплатить ему за его слова, но лишь однажды."
 relic_expedition_events.13.b: "Пусть свита на него надавит. Страх дешевле серебра."
 relic_expedition_events.13.desc: "Ремесленника ловят на продаже доверчивому паломнику пальца святого, вырезанного тем же утром из баранины и подкрашенного чаем. Когда его прижимают вопросом, кого ещё он обманул, он вместо ответа клянётся, что знает о чём-то подлинном — наткнулся на это, собирая старое дерево и ещё более старое железо для мастерской. Он назовёт квартал, но не улицу, пока не увидит монету. Слово фальшивомонетчика стоит ровно столько, сколько стоит слово фальшивомонетчика."
 relic_expedition_events.13.forger_cheated_tt: "В названном им квартале нет ничего, кроме сплетен; фальшивомонетчику дважды заплатили за одну и ту же ложь"
 relic_expedition_events.13.forger_honest_tt: "На этот раз монета покупает нечто истинное, и слова фальшивомонетчика оказываются правдой"
 relic_expedition_events.13.threats_fail_tt: "Он лишь громче скулит с отговорками; угрозы свиты не принесли ничего, кроме разбитых костяшек"
 relic_expedition_events.13.threats_work_tt: "Страх развязывает то, что не смогло серебро, и фальшивомонетчик выдаёт нечто настоящее"
 relic_expedition_events.13.title: "Мастерская фальшивомонетчика"
 relic_expedition_events.14.a: "Идти напролом. Дорога не может быть далеко."
 relic_expedition_events.14.b: "Прижать палатки грузом, разбить лагерь и переждать, пока буря не выдохнется."
 relic_expedition_events.14.desc: "Около полудня на горизонте встаёт стена охристой пыли, и за час она поглощает дорогу. Верблюды подгибают ноги и отказываются вставать, песок забивается в каждую складку ткани и в каждый бурдюк с водой, а проводник признаётся, что больше не может различить каменные пирамиды, отмечающие путь. [target_leader.GetName] может двигаться дальше вслепую или потерять дни, пережидая бурю."
 relic_expedition_events.14.title: "Песчаная буря на дороге"
 relic_expedition_events.15.a: "Не жалеть средств на лечение больных и их изоляцию."
 relic_expedition_events.15.b: "Пусть болезнь пройдёт своим чередом. Лихорадки быстро выгорают сами."
 relic_expedition_events.15.desc_land: "Лихорадка пришла вместе с водоносами и забирает людей по двое-трое почти без предупреждения: на рассвете ломит голову, к полудню начинается озноб, а к следующему утру — свежая могила. Оба лекаря отряда уже не успевают помочь всем, кто к ним обращается, а здоровые стараются держаться подальше от больных. [target_leader.GetName] предстоит решить, сколько казна потратит на то, чтобы остановить эту напасть."
 relic_expedition_events.15.desc_sea: "Лихорадка проникла на борт вместе с последней партией воды, взятой в порту, и забирает людей по двое-трое почти без предупреждения: на рассвете ломит голову, к полудню начинается озноб, а к следующему утру тело уже спускают за борт. Оба лекаря отряда в тесном трюме уже не успевают помочь всем, кто к ним обращается, а здоровые стараются держаться от больных так далеко, насколько позволяет палуба. [target_leader.GetName] предстоит решить, сколько казна потратит на то, чтобы остановить эту напасть."
 relic_expedition_events.15.title: "Вспышка лихорадки"
 relic_expedition_events.16.a: "Заплатить пошлину и уйти, пока он не передумал насчёт цены."
 relic_expedition_events.16.b: "Прорваться силой. Мы не для того прошли такой путь, чтобы нас грабили."
 relic_expedition_events.16.c: "Пусть говорит наша численность. Мало кто станет спорить с таким отрядом."
 relic_expedition_events.16.desc: "Вооружённые люди перегородили дорогу там, где она спускается между двумя грядами — их слишком много и держатся они слишком слаженно, чтобы быть обычными грабителями с большой дороги. Их вожак выезжает верхом перед строем, называет цену за безопасный проход и ясно даёт понять, что уже прикинул, во что обойдётся иной исход."
 relic_expedition_events.16.title: "Пустынные разбойники требуют дань"
 relic_expedition_events.17.a: "Поднести ему ещё кружку и вытянуть каждую подробность."
 relic_expedition_events.17.b: "Ещё одна байка из тысячи. Отправляемся с первыми лучами света."
 relic_expedition_events.17.desc: "Караван паломников делит с отрядом постоялый двор на ночь, и разговор у костра, как водится, сворачивает к реликвиям. Один из них, сын шерстяного торговца родом издалека, пересказывает историю, которую смутно помнит со слов дядюшки, умершего двадцать лет назад: монахи выносят свёрток из горящего дома, ночь на прибрежной дороге и погребение, которого никто не должен был видеть. Название дома он назвать не может. Но странно уверен насчёт дороги."
 relic_expedition_events.17.tale_confirmed_tt: "Монета развязывает ему язык, и вырывается подробность, которой ему, пожалуй, не стоило делиться"
 relic_expedition_events.17.tale_fades_tt: "Ещё одна чаша не помогает — подробности лишь всё больше смазываются с каждым новым пересказом"
 relic_expedition_events.17.title: "Слух паломника"
 relic_expedition_events.18.a: "Покрыть недостачу из королевской казны, и поскорее."
 relic_expedition_events.18.b: "Пусть подождут с оплатой ещё немного. Идти им всё равно некуда."
 relic_expedition_events.18.desc: "Неудачный месяц с обменом денег и ростовщики, вдруг ставшие осторожными в делах с иноземцами, оставляют казну экспедиции куда более скудной, чем ожидалось. Жалованье свите уже задерживают на две недели, погонщики мулов требуют платы монетой, которой доверяют, а не нашей, а слухи о неплатёжеспособной компании расходятся по этим городам быстрее, чем любые наши расспросы."
 relic_expedition_events.18.title: "Деньги на исходе"
 relic_expedition_events.19.a: "Оказать должное почтение на виду у нужных людей."
 relic_expedition_events.19.b: "Не обращать внимания на предупреждение и продолжать работу. Времени и так мало."
 relic_expedition_events.19.desc_christian: "Местные [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] заметили, что чужеземная компания слишком уж пристально расспрашивает о реликвиях, которые они считают делом одной лишь Церкви и никого более. Архидиакон принимает [target_leader.GetName] со всей учтивостью, довольно пространно рассуждает о грехе алчности и не оставляет никаких сомнений в том, что его дальнейшее благорасположение потребует дара на алтарь."
 relic_expedition_events.19.desc_fallback: "Слухи о расспросах экспедиции достигли ушей, которые лучше было бы не тревожить. Человек, которого никто не потрудился представить, является в постоялый дом после наступления темноты, садится без приглашения и обстоятельно объясняет, сколько неприятностей может найти себе чужеземный отряд в таком городе, как этот. Предупреждение звучит неторопливо, вполне учтиво и совершенно ясно."
 relic_expedition_events.19.desc_muslim: "Местный #italic кади#! прослышал, что чужестранцы задают неудобные вопросы о франкских сокровищах и о том, какие семьи что оставили себе, когда пали королевства. Его секретарь наносит визит [target_leader.GetName] с чаем, комплиментами и посланием, чья суть достаточно ясна за вежливыми словами: подобные расспросы идут куда глаже, если о них известно его господину, и если найдётся подобающее пожертвование на нужды мечети."
 relic_expedition_events.19.title: "Местные власти проявляют интерес"
 relic_expedition_events.2.a: "Расспросить местных. Паломники и солдаты разговорчивы, если заплатить [ShowGoodsNameWithNoTooltip('wine')]."
 relic_expedition_events.2.b: "Наконец-то мы напали на след реликвии."
 relic_expedition_events.2.c: "Нанять здесь ещё людей в свиту. Хорошая охрана дёшево не обходится."
 relic_expedition_events.2.d: "Подкупить придворного чиновника, чтобы получить доступ к местному архиву."
 relic_expedition_events.2.desc_acre_first: "Экспедиция достигает [ShowLocationName('acre')], столицы крестоносного королевства до тех пор, пока мамлюки не взяли его в 1291 году. Собор кое-как ещё стоит, там, где была крыша, теперь небо, и целые кварталы так и не были отстроены после разграбления. Пока ни у кого не было причины перерыть эти развалины."
 relic_expedition_events.2.desc_acre_repeat: "Снова [ShowLocationNameWithNoTooltip('acre')]. [target_leader.GetName] уже знает, какие переулки стоит пройти во второй раз."
 relic_expedition_events.2.desc_antioch_first: "Экспедиция достигает [ShowLocationName('antioch')], престола сгинувшего крестоносного княжества и города, где $relic_holy_lance_found$ было выкопано из церковного пола отчаянным летом 1098 года. Куда копьё делось после того, как войско двинулось на юг к [ShowLocationNameWithNoTooltip('jerusalem')], на Западе так никто и не выяснил. И это не единственное, что этот город потерял из виду."
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] снова в [ShowLocationNameWithNoTooltip('antioch')], всё так же расспрашивает о пропавшем копье и всё так же получает по три ответа на каждый вопрос."
 relic_expedition_events.2.desc_damascus_first: "Экспедиция достигает [ShowLocationName('damascus')], великой [location_scope.GetOwner.GetAdjective] столицы [ShowProvinceDefinitionName('shaam_province')] и последнего места, где, по достоверным сведениям, находился $relic_true_cross_found$ после Хаттина. Осталась ли эта реликвия здесь и поныне — вопрос иной. Город такого размера за века принял великое множество сокровищ и очень немногие вернул обратно."
 relic_expedition_events.2.desc_damascus_repeat: "Снова в [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] уже узнал, кто говорит в этом [location_scope.GetRank.GetNameWithNoTooltip], и чего это стоит."
 relic_expedition_events.2.desc_fallback: "Ещё одна остановка, ещё один круг представлений. [target_leader.GetName] начинает заново и ждёт того, за чем стоит погнаться."
 relic_expedition_events.2.desc_famagusta_first: "Экспедиция достигает города [ShowLocationName('famagusta')] — великого порта [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetFlavorRank] в [ShowProvinceDefinitionName('cyprus_province')]. Латинские семьи бежали сюда во множестве после падения [ShowLocationNameWithNoTooltip('acre')] в 1291 году, и немалая часть из них вывезла с материка куда больше, чем свои титулы."
 relic_expedition_events.2.desc_famagusta_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('famagusta')]. При соборе Святого Николая теперь знают [target_leader.GetName]."
 relic_expedition_events.2.desc_gaza_first: "Экспедиция достигает города [ShowLocationName('gaza')] — древнего города, где некогда стоял гарнизон тамплиеров, на пустынной дороге, ведущей на юг к [ShowRegionName('egypt_region')]. Орден был упразднён, а его братья рассеяны по христианскому миру много поколений назад. Не всё, что они здесь хранили, ушло вместе с ними."
 relic_expedition_events.2.desc_gaza_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('gaza')]. [target_leader.GetName] поговорил с большинством семей, живущих там, где прежде обитали тамплиеры."
 relic_expedition_events.2.desc_hebron_first: "Экспедиция достигает города [ShowLocationName('hebron')] и Пещеры Патриархов, где, по преданию, покоятся Авраам, Исаак и Иаков — святыня, чтимая и [ShowReligionGroupAdjective('israelite_group')], и [ShowReligionGroupAdjective('christian')], и [ShowReligionGroupAdjective('muslim')] верующими. Три веры на протяжении столетий пополняли эту святыню и брали из неё. Что-то небольшое, спрятанное не в том веке, могло пролежать здесь незамеченным навсегда."
 relic_expedition_events.2.desc_hebron_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('hebron')]. [target_leader.GetName] уже бродил по пределам святыни и знает, где не стоит показываться."
 relic_expedition_events.2.desc_jaffa_first: "Экспедиция достигает города [ShowLocationName('jaffa')], куда некогда паломники прибывали целыми кораблями и где, по преданию, апостол Пётр воскресил вдову Тавифу. Два века паломнического потока проходили через эту гавань в обе стороны. Не всё из этого потока ушло обратно."
 relic_expedition_events.2.desc_jaffa_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('jaffa')]. Портовый квартал уже привык к расспросам [target_leader.GetName]."
 relic_expedition_events.2.desc_jerusalem_first: "Экспедиция прибыла в [ShowLocationName('jerusalem')] и стоит перед храмом Гроба Господня. [location_scope.GetOwner.GetAdjective] гарнизон окидывает отряд взглядом и теряет к нему интерес. Чужеземцы приезжают сюда каждый сезон ради всё той же гробницы и тех же самых историй. Где-то за этими историями скрывается след, достойный того, чтобы по нему пройти, и найти его будет долго, дорого и по большей части сведётся к тому, кому верить."
 relic_expedition_events.2.desc_jerusalem_repeat: "Снова в [ShowLocationNameWithNoTooltip('jerusalem')]. Каноники храма Гроба Господня уже знают [target_leader.GetName], и гарнизон больше не утруждает себя взглядом."
 relic_expedition_events.2.desc_karak_first: "Экспедиция достигает города [ShowLocationName('karak')] — пустынного замка, которым Рено де Шатийон владел как сеньор Заиорданья. Рено годами грабил паломничьи караваны и, по преданию, хранил здесь добычу на случай осады, которую, как он знал, устроит Саладин. Каждая семья в городе под замком рассказывает эту историю по-своему."
 relic_expedition_events.2.desc_karak_repeat: "Снова у стен [ShowLocationNameWithNoTooltip('karak')]. [target_leader.GetName] уже слышал легенды замка один раз, а от словоохотливых жителей — дважды."
 relic_expedition_events.2.desc_nicosia_first: "Экспедиция достигает города [ShowLocationName('nicosia_cyp')] — средоточия власти на [ShowProvinceDefinitionName('cyprus_province')]. [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetGovernment.GetCourtTitle] хранит обширный архив того, что изгнанная материковая знать привезла с собой, и ещё более обширный — того, что она впоследствии заложила."
 relic_expedition_events.2.desc_nicosia_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('nicosia_cyp')]. [location_scope.GetOwner.GetAdjective] архивариусы перестали спрашивать, почему [target_leader.GetName] возвращается снова и снова."
 relic_expedition_events.2.desc_rhodes_first: "Экспедиция прибывает на [ShowLocationName('rodos')], во владения [location_scope.GetOwner.GetAdjective]. Здесь, в ордене, падение [ShowLocationNameWithNoTooltip('acre')] помнят как часть собственной истории и хранят списки всех комменд, оставленных на материке. Ни один другой город в этих водах не откроет подобные архивы католическому отряду."
 relic_expedition_events.2.desc_rhodes_repeat: "Снова на [ShowLocationNameWithNoTooltip('rodos')]. Архивисты [location_scope.GetOwner.GetAdjective] встречают [target_leader.GetName] как старую знакомую помеху."
 relic_expedition_events.2.desc_sidon_first: "Экспедиция достигает города [ShowLocationName('sidon')], ещё одного города, который, согласно Евангелиям, посещал Христос, и владения крестоносцев вплоть до падения королевства. Старый франкский квартал с тех пор заселяли заново дважды. Нынешние жильцы понятия не имеют, что хранится в их собственных подвалах."
 relic_expedition_events.2.desc_sidon_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('sidon')]. У [target_leader.GetName] есть список франкских домов, которые стоит посетить ещё раз."
 relic_expedition_events.2.desc_tripoli_first: "Экспедиция достигает [ShowLocationName('tripoli_syria')], крестоносного графства вплоть до его падения в 1289 году. Торговля в гавани идёт так же бойко, как и прежде, но часовня старой цитадели уже дольше, чем кто-либо здесь помнит, стоит неосвящённой, и никто её так и не опустошил."
 relic_expedition_events.2.desc_tripoli_repeat: "Снова в [ShowLocationNameWithNoTooltip('tripoli_syria')]. Портовые торговцы уже знают [target_leader.GetName] в лицо."
 relic_expedition_events.2.desc_tyre_first: "Экспедиция достигает города [ShowLocationName('sur')] — [location_scope.GetRank.GetName], настолько древнего, что Евангелия упоминают, как через его земли проходил Христос, — одного из последних оплотов крестоносцев на материке, удержанного до 1291 года. Его архиепископство вело записи два столетия. То, что от них уцелело, разбросано по десятку частных домов, и ни одна пара владельцев не согласна в том, чем именно они владеют."
 relic_expedition_events.2.desc_tyre_repeat: "Снова в городе [ShowLocationNameWithNoTooltip('sur')]. [target_leader.GetName] уже прочёл большую часть того, что оставило после себя старое архиепископство."
 relic_expedition_events.2.e: "Найти учёного. Опытный ум лучше разбирает слухи."
 relic_expedition_events.2.f: "Последовать многообещающему следу в сторону [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.2.g: "Прекратить поиски и повернуть назад."
 relic_expedition_events.2.title: "Прибытие"
 relic_expedition_events.3.a: "Продолжать расспросы. Кто-то здесь знает больше, чем говорит."
 relic_expedition_events.3.b: "Наконец-то сам след. Мы нашли его."
 relic_expedition_events.3.c: "Нанять больше свиты, пока мы здесь."
 relic_expedition_events.3.d: "Подкупить ещё одного чиновника. В этом городе записи ведутся лучше."
 relic_expedition_events.3.desc_acre: "Простукивались пустые стены, переворачивалась рухнувшая кладка там, где никто не тревожил её поколениями. [ShowLocationNameWithNoTooltip('acre')] — крупный [relic_hunt_loc.GetRank.GetName], где почти не осталось жителей, а один отряд способен обследовать лишь малую его часть."
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] прослеживает линию исчезнувших стен, сверяя то, что ещё стоит, с рассказами паломников о месте, где было найдено Копьё. Рассказы противоречат друг другу, и ни один из них не совпадает с тем, что видно на месте."
 relic_expedition_events.3.desc_damascus: "Квартал за кварталом, базар за базаром, [target_leader.GetName] заводит связи среди купцов и ростовщиков. Слухи расходятся по такому большому городу медленно, но всё же расходятся — и приходят уже с назначенной ценой."
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] продолжает поиски, перебирая каждую мелкую зацепку по очереди, прежде чем оставить её."
 relic_expedition_events.3.desc_famagusta: "Сундук за сундуком через домашние сокровища изгнанных материковых семей в [ShowLocationNameWithNoTooltip('famagusta')], каталогизируя то, что было вывезено из [ShowLocationNameWithNoTooltip('acre')], и то, что с тех пор тихо забыто."
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] не отступает от владений упразднённого ордена в [ShowLocationNameWithNoTooltip('gaza')], допытываясь у соседей, какие кладовые тамплиеры держали на замке и кто забрал ключи после них."
 relic_expedition_events.3.desc_hebron: "Святыня осматривается неспешно, придел за приделом, с величайшей осторожностью, чтобы не оскорбить ни одну из трёх вер, что её хранят. [target_leader.GetName] отмечает каждый запертый проход, но вслух не спрашивает ни об одном из них."
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] проводит дни в гавани [ShowLocationNameWithNoTooltip('jaffa')], покупая выпивку для грузчиков и лодочников и расспрашивая, какие склады принимали грузы паломников до того, как франки ушли."
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] возвращается к Гробу Господню ещё до рассвета, опережая толпы паломников. Здесь ещё одна крипта, которую нужно осмотреть при свече, ещё одна стёртая надпись, которую нужно переписать, ещё один каноник, готовый поговорить за должное вознаграждение."
 relic_expedition_events.3.desc_karak: "С фонарём в руке [target_leader.GetName] обходит подвалы и цистерны [ShowLocationNameWithNoTooltip('karak')], сверяя сокровищницу Рено де Шатийона, как её описывают рассказчики, с тем, что на самом деле подтверждают стены."
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] изучает архив [relic_hunt_loc.GetOwner.GetAdjective] [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle] в [ShowLocationNameWithNoTooltip('nicosia_cyp')], сверяя описи с наследственными реестрами в поисках реликвии, о которой никто и не подумал спросить."
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] допытывается у [relic_hunt_loc.GetOwner.GetAdjective] архивариусов на [ShowLocationNameWithNoTooltip('rodos')] насчёт томов, которые те так и не предъявили, и сверяет их списки с тем, что, по словам старших братьев, было вывезено из [ShowLocationNameWithNoTooltip('acre')]."
 relic_expedition_events.3.desc_sidon: "Дом за домом по заново заселённому франкскому кварталу [target_leader.GetName] стучится в двери, расспрашивая о погребах и чердаках, которые никто не открывал с тех пор, как ушли последние христианские жильцы."
 relic_expedition_events.3.desc_tripoli: "Часовня цитадели разбирается плита за плитой, штукатурка сбивается везде, где стена звучит подозрительно. Одна только часовня — работа на несколько недель."
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] перебирает то, что сохранилось от архиепископских записей [ShowLocationNameWithNoTooltip('sur')], раскладывая закапанные водой книги рядом с полустёртыми грамотами и разыскивая запись, которая не сходится с прочими."
 relic_expedition_events.3.e: "Обратиться к местному учёному, прежде чем двигаться дальше."
 relic_expedition_events.3.f: "Свежая зацепка указывает в другую сторону. Отправиться по ней к [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.3.g: "Прекратить поиски и повернуть назад."
 relic_expedition_events.3.title: "Поиски продолжаются"
 relic_expedition_events.4.b: "Довольно. Отозвать экспедицию."
 relic_expedition_events.4.desc: "Все нити, за которые хватался [target_leader.GetName], привели в никуда. Толмачи обошли уже все таверны, подкупленным чиновникам больше нечего продать, а кошель с каждой неделей, пока отряд бездействует на чужбине, становится всё легче. В столицу уходит весть: платить за дальнейшие поиски или прекратить их вовсе."
 relic_expedition_events.4.title: "След остыл"
 relic_expedition_events.5.a: "Без них миссия не может продолжаться."
 relic_expedition_events.5.title: "Охрана потеряна"
 relic_expedition_events.6.a: "Поторговаться. Цена высока, но сговориться можно."
 relic_expedition_events.6.b: "Заплатить, сколько просят. Иные вещи стоят своей цены."
 relic_expedition_events.6.c: "Пусть за нас говорит многочисленность нашей свиты."
 relic_expedition_events.6.desc_baptist_head: "Церковь в этом краю почитает то, что называет главой Иоанна Крестителя. Слух об этом никогда не выходил далеко за пределы прихода, и духовенство готово обсудить передачу реликвии."
 relic_expedition_events.6.desc_holy_chalice: "Купец сразу говорит, что не ждёт доверия к своим словам, но всё же предлагает простую каменную чашу, которую называет истинной чашей Тайной вечери, что бы ни утверждали более именитые владельцы подобных реликвий в других местах. Цену он просит немалую."
 relic_expedition_events.6.desc_holy_lance: "Семья погибшего солдата хранит наконечник копья со времён службы прадеда и уверяет, что это $relic_holy_lance_found$, тот самый, что был обретён в 1098 году. Деньги им нужнее."
 relic_expedition_events.6.desc_holy_nail: "Вдова кузнеца достаёт почерневший от времени железный гвоздь. Семья её мужа всегда клялась, что это один из гвоздей распятия. Она готова его продать."
 relic_expedition_events.6.desc_holy_shroud: "Купец разворачивает льняное полотно с едва различимым изображением распятого человека. Он не может объяснить, где оно находилось все эти века, но в любом случае просит за него огромную сумму."
 relic_expedition_events.6.desc_holy_thorn: "Один незнатный дворянский род владеет единственным шипом в скромном реликварии, доставшимся, по их словам, предку из самого тернового венца. Они предпочли бы, чтобы продажа осталась незамеченной."
 relic_expedition_events.6.desc_saint_bones: "Приходской священник предлагает небольшой ларец с костями, на котором выцветшей латынью написано имя святого. Плату он назовёт пожертвованием церкви."
 relic_expedition_events.6.desc_titulus_crucis: "Местное предание гласит, что когда древо Креста отправилось на запад, табличка с надписью, что была прибита над ним, осталась здесь и была спрятана. Одна здешняя семья утверждает, будто именно такая табличка досталась им по наследству, и готова её продать."
 relic_expedition_events.6.desc_true_cross: "Купец в городе, осторожно оглядываясь, не подслушивает ли кто, говорит, что владеет фрагментом самого $relic_true_cross_found$ — той древесины, что была утрачена при Хаттине, — доставшимся ему через руки, которые он называть отказывается. Цену, впрочем, он назовёт."
 relic_expedition_events.6.desc_true_cross_fragment: "Бедный, полузабытый монастырь хранит щепку дерева в простом ковчеге, помеченную лишь как частица $relic_true_cross_found$. Аббат тихо расстанется с ней, если вырученные деньги помогут удержать крышу над головой."
 relic_expedition_events.6.desc_virgin_milk: "В небольшой часовне хранится запечатанный сосуд с белым меловым остатком, который поколениями почитают как молоко Пресвятой Девы Марии. Хранитель готов продать его вместе с серебряным ковчегом."
 relic_expedition_events.6.title: "Готовый продавец"
 relic_expedition_events.7.a: "Заплатить и увезти реликвию домой."
 relic_expedition_events.7.b: "Что-то здесь не так. Уйти прочь."
 relic_expedition_events.7.desc: "Условия оговорены, реликварий завёрнут в ткань. Осталось лишь решить, насколько [target_leader.GetName] верит рассказу продавца."
 relic_expedition_events.7.title: "Скрепляя сделку"
 relic_expedition_events.8.a: "Осторожность стоит денег."
 relic_expedition_events.8.b: "Обойдёмся без него. Чем меньше платим, тем меньше болтают."
 relic_expedition_events.8.c: "Сообщники ни к чему. Наша свита просто возьмёт это сама."
 relic_expedition_events.8.d: "Золото ни к чему. [target_leader.GetHerHis|U] собственное обаяние обеспечит их помощь."
 relic_expedition_events.8.desc_baptist_head: "Младший каноник, которого слишком часто обходили повышением, предлагает провести нас к раке, которую старшее духовенство почитает как главу Иоанна Крестителя."
 relic_expedition_events.8.desc_holy_chalice: "Ризничий кафедрального собора не питает добрых чувств к капитулу, которому служил долгие годы, и предлагает помочь нам вынести простую каменную чашу, которую втайне называют истинной чашей Тайной вечери."
 relic_expedition_events.8.desc_holy_lance: "Гарнизонный солдат, которому задолжали жалованье за целый год, проговаривается, что в оружейной хранится старый наконечник копья, который никто не описывал в описи на памяти живущих. Старики всё ещё зовут его $relic_holy_lance_found$. Он может провести нас внутрь."
 relic_expedition_events.8.desc_holy_nail: "Погрязший в долгах казначейский писарь признаётся, что старый железный гвоздь, почитаемый как один из гвоздей Распятия, лежит без описи в боковом хранилище. Ключ от него есть только у него самого."
 relic_expedition_events.8.desc_holy_shroud: "Привратник монастыря, недавно поссорившийся с настоятелем, говорит, что братия хранит сложенное полотно с отпечатавшимся на нём образом, доступное лишь старшим братьям. Он оставит одну из дверей незапертой."
 relic_expedition_events.8.desc_holy_thorn: "Управляющий, однажды уволенный и восстановленный из милости, точно знает, где семья хранит реликварий с единственным шипом из Тернового венца."
 relic_expedition_events.8.desc_saint_bones: "Могильщик, которому недоплачивали всю жизнь, знает, где приход хранит ковчег с костями святого, и в какой час ризничий ложится вздремнуть после полудня."
 relic_expedition_events.8.desc_titulus_crucis: "Семья, что бережно хранит старую, наполовину забытую легенду, предлагает нечто иное: помочь им вернуть то, что они считают подлинной табличкой с Креста, у родича, который отказывается им её продать."
 relic_expedition_events.8.desc_true_cross: "Слуга в доме одного местного знатного человека, чем-то раздосадованный, о чём предпочитает не рассказывать, упоминает, что его господин хранит завёрнутый обломок тёмного дерева, который называет $relic_true_cross_found$, никак не выделяя его среди прочих своих сокровищ. За плату слуга поможет нам его забрать."
 relic_expedition_events.8.desc_true_cross_fragment: "Недовольный своим призванием послушник предлагает оставить открытым ставень часовни, где его обитель хранит свою частицу $relic_true_cross_found$."
 relic_expedition_events.8.desc_virgin_milk: "Смотритель святыни, годами тайно кипящий от возмущения из-за скудного жалованья, оставит ковчег с реликвией незапертым в выбранную им ночь."
 relic_expedition_events.8.title: "Услужливый сообщник"
 relic_expedition_events.9.a: "Дело сделано. Реликвия теперь наша, и никто ничего не заметил."
 relic_expedition_events.9.b: "Кто-то проснулся. Крики, топот ног. Отступаем!"
 relic_expedition_events.9.desc: "Пока всё идёт по плану. Тот, кто должен был стоять на страже, спит, или его нет на месте, или ему заплатили, чтобы он смотрел в другую сторону, а дверь, которую обещал открыть сообщник, стоит без засова. [target_leader.GetName] ждёт в темноте крика, который означал бы обратное."
 relic_expedition_events.9.title: "Кража"
