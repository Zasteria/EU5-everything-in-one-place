l_russian:
 circumnavigation_expedition_events.1.title: "Великое предприятие"
 circumnavigation_expedition_events.1.desc: "Пять кораблей. Двести семьдесят человек. Провизия на год и маршрут, которым ещё не проходил ни один лоцман. [target_leader.GetName] спокойно говорит об островах, полных гвоздики, и о западном пути к Островам Пряностей. Начальник порта не верит [target_leader.GetHimHer]. Лоцманы полны сомнений. Но корабли снаряжены, ветер попутный, а поручение скреплено королевской печатью.\n\nВпереди лежит всё то, чего ещё нет ни на одной карте."
 circumnavigation_expedition_events.1.magellan: "Курс на Канарские острова. С Божьей помощью мы найдём Западное море."
 circumnavigation_expedition_events.1.a: "Вперёд, к Канарам. Что бы ни ждало нас впереди, мы будем там первыми."
 circumnavigation_expedition_events.1.historical_info: "В сентябре 1519 года Фернан Магеллан покинул Санлукар-де-Баррамеду, чтобы отыскать западный путь к Островам Пряностей для испанской короны. В состав экспедиции входили пять кораблей: #italic Тринидад#!, #italic Сан-Антонио#!, #italic Консепсьон#!, #italic Виктория#! и #italic Сантьяго#!. Магеллан был португальским мореплавателем, он плавал в Индию и на Молуккские острова, но перешёл на службу к испанской короне после того, как король Мануэл I отказался увеличить ему жалование. Эта экспедиция вошла в историю как первое кругосветное путешествие, хотя самому Магеллану не суждено было вернуться домой."
 circumnavigation_expedition_events.2.title: "Последний знакомый берег"
 circumnavigation_expedition_events.2.desc: "[current_location.GetProvince.GetName] поднимается из моря плоскими бурыми ярусами — крепости из камня под небом, что всё ещё то же самое небо, что и над [departure_port.GetName]. Лоцманы делают последние промеры глубины. Люди пьют пресную воду из железных бочек и чинят такелаж, истрёпанный атлантической зыбью. За последним мысом карты обрываются.\n\nНекоторые из людей молятся. Кто-то пишет письма, которые некому будет отправить. [target_leader.GetName] расхаживает по палубе, будто вымеряя нечто, что нельзя измерить. То, что грузится сейчас, должно хватить и на океан, и на всё, что за ним."
 circumnavigation_expedition_events.2.a: "Запасёмся пищей под завязку. Второго такого шанса может и не быть."
 circumnavigation_expedition_events.2.b: "Отчаливаем немедленно, пока экипаж не утратил храбрость."
 circumnavigation_expedition_events.2.c: "Маршрут слишком ненадёжен. Вернуться в порт."
 circumnavigation_expedition_events.2.historical_info: "В эпоху Великих географических открытий Канарские острова, тогда принадлежавшие Кастилии, служили главной базой снабжения и отправной точкой для иберийских экспедиций через Атлантический океан. Так, на пути к Южной Америке флот Магеллана совершил остановку на Тенерифе, чтобы пополнить запасы провизии перед долгим путешествием через Атлантику. От провизии, закупленной на этих островах, во многом зависело то, переживёт ли экипаж грядущие месяцы вдали от суши."
 circumnavigation_expedition_events.3.title: "Край Нового Света"
 circumnavigation_expedition_events.3.desc: "После недель открытого [ShowContinentName('atlantic_ocean_continent')] на западном горизонте твердеет низкая зелёная полоса — берег Нового Света. В лесу кричат попугаи, а вода из доброй сотни рек течёт сладкая. От берега отчаливают каноэ, их гребцы любопытны и бесстрашны, предлагая дерево, воду и диковинные плоды. Здесь есть всё, чего только может желать усталая флотилия — но сезон меняется, а проход на юг всё ещё не найден.\n\n[target_leader.GetName] взвешивает удобство берега против миль, что ещё предстоит пройти."
 circumnavigation_expedition_events.3.a: "Остановимся, чтобы поторговать с местными и пополнить припасы."
 circumnavigation_expedition_events.3.b: "Берег подождёт. Идти на юг, пока держится погода."
 circumnavigation_expedition_events.3.historical_info: "Флот Магеллана достиг побережья Бразилии в конце 1519 года. Подойдя к суше в районе Кабу-ди-Санту-Агостинью, экспедиция незамедлительно продолжила путь на юг: согласно Тордесильясскому договору, Бразилия попадала в сферу влияния Португалии, поэтому испанский флот не мог долго задерживаться у её берегов. Тем не менее живущие здесь индейцы тупи охотно торговали со своими новыми гостями, и даже само наличие рядом суши уже позволяло испанцам вздохнуть с облегчением после длительного путешествия через Атлантику."
 circumnavigation_expedition_events.4.title: "Великий залив"
 circumnavigation_expedition_events.4.desc: "Флот входит в залив, столь обширный и защищённый, что кажется настоящим даром — окружённый зелёными горами, с водами, серебрящимися от рыбы. Жители побережья толпами выходят навстречу, обменивая птицу, плоды и рыбу на рыболовные крючки и ножи, предлагая больше, чем могут вместить трюмы. После долгого перехода через Атлантику это настоящий рай, и люди с радостью остались бы здесь навсегда.\n\nНо рай — плохой хозяин для похода. [target_leader.GetName] должен решить, сколько флот может здесь оставаться.'"
 circumnavigation_expedition_events.4.a: "Людям нужно как следует отдохнуть и набрать провизии, иначе им не пережить дорогу."
 circumnavigation_expedition_events.4.b: "Выторгуем у местных побольше еды и отчалим через неделю."
 circumnavigation_expedition_events.4.c: "Мы здесь не для того, чтобы пировать. Плыть дальше без торговли."
 circumnavigation_expedition_events.4.historical_info: "Огромная бухта Гуанабара, у которой позднее был основан Рио-де-Жанейро, позволила флоту Магеллана запастись провизией в дотоле небывалых объёмах. Её тихие воды были полны рыбы, а живущие на её берегах индейцы тупи в избытке отдавали испанцам пищу в обмен на инструменты и разные безделушки. Пополнение запасов в этой бухте позволило экипажу основательно подготовиться к грядущему поиску пролива в холодных широтах Патагонии, который в противном случае неминуемо обернулся бы провалом."
 circumnavigation_expedition_events.5.title: "Серебряное устье"
 circumnavigation_expedition_events.5.desc: "Лоцманы знали, что проход должен существовать. Никакой континент не может тянуться вечно. Но устье реки столь широко, что с мачты не видно противоположного берега, а вода, хоть и солоноватая, остаётся бурой от ила на сорок лиг в море. Лодки посылают вверх по устью на две недели.\n\nОни возвращаются с вестью о сомах, отмелях и отсутствии прохода к какому-либо океану. Где-то южнее, возможно, ждёт настоящий проход — если он вообще существует."
 circumnavigation_expedition_events.5.a: "Исследуем эстуарий как следует. Возможно, от него всё же будет польза."
 circumnavigation_expedition_events.5.b: "У нас нет времени на реки, что ведут в никуда. Плывите на юг."
 circumnavigation_expedition_events.5.press_tt: "Флот без задержки идёт на юг, ища проход, что должен лежать где-то дальше"
 circumnavigation_expedition_events.5.c: "Эти широты превосходят разумные пределы. Возвращайтесь домой."
 circumnavigation_expedition_events.5.historical_info: "Рио-де-ла-Плата — «серебряная река» — была открыта в 1516 году испанским мореплавателем Хуаном Диасом де Солисом, который был убит аборигенами незадолго после этого события. Экспедиция Магеллана обследовала эстуарий реки в январе 1520 года, ошибочно полагая, что это может быть пролив на запад. Этот просчёт стоил им нескольких недель, однако именно он позволил испанцам собрать первые подробные сведения о данном регионе. Река была названа в честь серебра, которым активно торговали местные индейцы чарруа и гуарани. Однако легендарные серебряные горы, о которых испанцы узнали от туземцев, были обнаружены лишь много десятилетий спустя."
 circumnavigation_expedition_events.6.title: "Пролив на краю света"
 circumnavigation_expedition_events.6.desc: "Проход холоден, узок и смертоносен. С обеих сторон отвесно поднимаются стены чёрного камня, а канал так извивается, что лоцманы уже не могут сказать, где запад. Истинный враг — ветер: он срывается со снежных полей и меняет направление без предупреждения, с воем проносясь по снастям внезапными белыми шквалами, что отбрасывают корабли назад и держат их днями прижатыми к скале.\n\n[target_leader.GetName] молча стоит на носу флагмана, пока стены смыкаются вокруг. Лоцманы говорят, что проход пригоден для плавания. Люди не уверены, что лоцманы в своём уме. Где-то впереди, если верить картам вообще, лежит океан столь огромный, что у него пока нет имени."
 circumnavigation_expedition_events.6.a: "Нужно идти дальше. Ветер нас не остановит."
 circumnavigation_expedition_events.6.b: "Перезимуем здесь. Набравшись сил, пройти пролив будет легче."
 circumnavigation_expedition_events.6.c: "Ни один путь не стоит этого. Разворачивайте флот."
 circumnavigation_expedition_events.6.historical_info: "Магелланов пролив — пройденный в ноябре 1520 года — представляет собой 570-километровый проход через южную оконечность Южной Америки, вдоль острова Огненная Земля, названного так за сторожевые костры его обитателей. Переход занял 38 дней. Во время подхода к проливу Магеллан подавил мятеж в Пуэрто-Сан-Хулиан, казнив одного капитана и высадив другого на необитаемый берег. Третий корабль, #italic«Сан-Антонио»#!, дезертировал и вернулся в Испанию. Оставшиеся три — #italic«Тринидад»#!, #italic«Консепсьон»#! и #italic«Виктория»#! — вышли в воды, которые Магеллан назвал #italic«Mar Pacífico»#!, 28 ноября 1520 года — так он назвал их за кажущееся спокойствие после ужасов пролива."
 circumnavigation_expedition_events.7.title: "Море, названное Тихим"
 circumnavigation_expedition_events.7.desc: "Последний чёрный мыс пролива остаётся за кормой, и перед флотом открывается океан без предела. [target_leader.GetName] называет его #italic Mar Pacífico#! за его спокойствие — спокойствие, что обратится в проклятие. Неделя сменяет неделю, и ни один остров не показывается. Вода в бочках становится жёлтой и зловонной; галеты превращаются в труху и долгоносиков; люди грызут размягчённую в воде воловью кожу и платят по полдуката за крысу.\n\nЛоцманы не могут сказать, сколь широко это море, ибо никто ещё не пересекал его. Но как бы [target_leader.GetName] ни решил встретить его, некоторые из отправившихся не увидят другого берега."
 circumnavigation_expedition_events.7.a: "Экономить припасы и держать ровный, осторожный курс."
 circumnavigation_expedition_events.7.endured_tt: "Команда выдерживает переход; флот достигает дальнего берега, всё ещё готовый к бою"
 circumnavigation_expedition_events.7.scurvy_tt: "Цинга и голод берут своё; флот еле ползёт вперёд с обескровленными командами"
 circumnavigation_expedition_events.7.b: "Поднять все паруса! Чем быстрее мы достигнем суши, тем меньше людей погибнет."
 circumnavigation_expedition_events.7.fast_tt: "Стремительный переход избавляет от худших потерь, и земля показывается вовремя"
 circumnavigation_expedition_events.7.lost_tt: "Море оказывается шире, чем кто-либо мог представить. Последние припасы иссякают, и экспедиция гибнет в полном составе"
 circumnavigation_expedition_events.7.c: "Держать курс на север, к слухам об островах, и молиться о пресной воде."
 circumnavigation_expedition_events.7.islands_tt: "Разбросанные острова дают воду и свежую пищу; переход переживают почти все"
 circumnavigation_expedition_events.7.empty_sea_tt: "Северные воды оказываются столь же пустынными, как и всё остальное; поиски стоят драгоценного времени и новых жизней"
 circumnavigation_expedition_events.7.historical_info: "Переход Магеллана через Тихий океан длился около девяноста девяти дней без единого пополнения запасов — флот блуждал через самую пустынную часть величайшего океана Земли, почти не встречая земли. Около девятнадцати человек умерли от цинги; выжившие ели опилки, кожаные снасти, размоченные в морской воде, а крысы продавались среди команды по завышенной цене. Первой землёй стал остров Гуам на Марианских островах в марте 1521 года, который испанцы назвали #italic Islas de los Ladrones#! — «Островами воров» — после того как жители-чаморро угнали одну из корабельных шлюпок, что вызвало карательный набег. Плавание через Тихий океан на восток, домой, долго оставалось непреодолимым для мореходов, пока Андрес де Урданета не нашёл в 1565 году северный обратный путь, #italic tornaviaje#!, положивший начало многовековой торговле манильских галеонов."
 circumnavigation_expedition_events.8.title: "Первая земля за два месяца"
 circumnavigation_expedition_events.8.desc: "Шестьдесят дней и более флот не видит ничего, кроме воды. Затем крик с мачты: земля! Надежда, словно пламя, охватывает корабли — пока лодки не подходят ближе. «Земля» оказывается низким кольцом коралла и пальм, бьёт по нему прибой, дна для якоря нет, и никаких признаков свежей воды. Птицы кружат над головой; деревья не дают ничего, что мог бы съесть голодающий.\n\nОстров дарит лишь жестокость надежды. [target_leader.GetName] должен решить, задержаться и искать далее, или идти дальше."
 circumnavigation_expedition_events.8.a: "Lower the boats; search the reef for water or food."
 circumnavigation_expedition_events.8.barren_tt: "Риф не даёт ничего, кроме насмешки в виде сухой земли, и дни потрачены впустую"
 circumnavigation_expedition_events.8.relief_tt: "Собрано немного дождевой воды и несколько морских птиц — малая милость против голода"
 circumnavigation_expedition_events.8.b: "Здесь нет ничего, и глубины недостаточно, чтобы удержать нас. Идём дальше."
 circumnavigation_expedition_events.8.historical_info: "24 января 1521 года флот увидел свою первую землю в Тихом океане: небольшой необитаемый атолл, названный Сан-Пабло — по всей вероятности, Пука-Пука в архипелаге Туамоту. Пигафетта записал, что оба острова, обнаруженные во время перехода, «не имели места для якоря, ибо не было дна», и содержали «только птиц и деревья». Не сумев высадиться, голодающие команды не смогли взять с них ничего, и Магеллан назвал эту пару #italic Islas Infortunadas#! — Несчастливые острова."
 circumnavigation_expedition_events.9.title: "Остров акул"
 circumnavigation_expedition_events.9.desc: "Из моря поднимается второй остров, и он столь же бесплоден, как первый — коралл и кустарник, окружённый прибоем, без якорной стоянки. Единственная жизнь в его водах — акулы, серыми тенями скользящие под корпусами в таком множестве, что моряки крестятся. Здесь нет ни высадки, ни воды, ни пищи — только тот же пустой океан, и надежда людей истончается день за днём.\n\n[target_leader.GetName] должен решить, как флоту снести это отчаяние."
 circumnavigation_expedition_events.9.a: "Lower the boats once more and try the surf for the shore."
 circumnavigation_expedition_events.9.a.tt: "The boats come back empty, but the crews saw the attempt made, and morale falls only a little (#R -3#! Crew Morale)"
 circumnavigation_expedition_events.9.b: "Назвать его Островом акул и молча идти дальше."
 circumnavigation_expedition_events.9.historical_info: "Второй из Несчастливых островов, увиденный 21 февраля 1521 года, был назван #italic Tiburones#! — «Акулы» — по множеству акул, которых Пигафетта отметил в его водах. Вероятно, это остров Каролайн или Флинт; он также не давал ни дна для якоря, ни облегчения. Недели между двумя островами были самыми тяжёлыми за весь переход: цинга неустанно косила людей, а команды ели кожу, опилки и крыс, чтобы выжить. Акул они не ловили — они даже не могли добраться до берега."
 circumnavigation_expedition_events.10.title: "Острова воров"
 circumnavigation_expedition_events.10.desc: "На самом краю человеческих сил впередсмотрящие замечают зелёные горы — наконец-то настоящая земля, с водой, фруктами и рыбой. К флотилии со всех сторон устремляются каноэ с балансирами, их гребцы проворны и бесстрашны — они поднимаются на борт и уносят всё, что плохо привязано. Для них вещь без присмотра — вещь, взятая по праву; для изголодавшихся же команд это грабёж.\n\nЭти острова могут спасти экспедицию, если [target_leader.GetName] удастся выбить у них провизию."
 circumnavigation_expedition_events.10.a: "Честно торговать за всю еду и воду, которую сможем унести."
 circumnavigation_expedition_events.10.b: "Land armed men to recover the boat and take what we need."
 circumnavigation_expedition_events.10.c: "Seize what we can from the canoes and stand out to sea now."
 circumnavigation_expedition_events.10.historical_info: "6 марта 1521 года флот достиг Гуама на Марианских островах — первой земли после пролива. Магеллан назвал острова #italic Islas de los Ladrones#! — Островами Воров — после того, как чаморро, не имевшие понятия о частной собственности, увели корабельную шлюпку. В отместку он высадил около сорока вооружённых людей, сжёг дома и убил нескольких островитян, чтобы вернуть лодку. Как бы то ни было, эта стоянка дала умирающим командам первую за три с лишним месяца свежую пищу и воду — и стала их спасением."
 circumnavigation_expedition_events.11.title: "Blood and Faith at Cebu"
 circumnavigation_expedition_events.11.desc: "Острова спасли экспедицию. После испытания переходом команды [target_leader.GetName] запасаются водой, фруктами и свежим мясом, а на Себу раджа встречает их пиршеством. Клятва скреплена кровью: его люди примут [ROOT.GetCountry.GetReligion.GetName], а взамен оружие чужаков послужит его короне. За один день под тропическим солнцем крестятся сотни людей.\n\nНо есть и цена союза. По ту сторону узкого пролива, на острове Мактан, непокорный вождь отвергает и [ROOT.GetCountry.GetReligion.GetGodName], и нового владыку — и наш союзник ждёт от нас, что мы его усмирим. Обрести друга среди этих островов — значит унаследовать его врагов."
 circumnavigation_expedition_events.11.a: "Take up our ally's quarrel. Let Mactan know our strength."
 circumnavigation_expedition_events.11.mactan_triumph_tt: "Показ силы устрашает острова, и враги нашего союзника оказываются усмирены"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "Штурм срывается на отмелях; гибнут добрые люди, и флот от этого слабеет"
 circumnavigation_expedition_events.11.b: "Take what the islands give, and sail on; not our fight."
 circumnavigation_expedition_events.11.c: "Plant the royal standard. Let the crown record this find."
 circumnavigation_expedition_events.11.historical_info: "Магеллан достиг Филиппинского архипелага в марте 1521 года, назвав его архипелагом Сан-Лазаро. Филиппины стали местом первого продолжительного контакта с народами западной части Тихого океана и дали провизию, спасшую голодающий флот. Магеллан заключил кровный союз с раджой Хумабоном из Себу, обратив его и несколько тысяч подданных в христианство. Этот союз оказался роковым: 27 апреля 1521 года Магеллан погиб в битве при Мактане, возглавив неудачный штурм через рифы против вождя Лапу-Лапу ради своего нового союзника. Командование в итоге перешло к Хуану Себастьяну Элькано, а уцелевшие — их было слишком мало, чтобы управлять тремя кораблями, — сожгли #italic«Консепсьон»#! у острова Бохоль."
 circumnavigation_expedition_events.12.title: "Острова пряностей"
 circumnavigation_expedition_events.12.desc: "Молуккские острова. Точка на любой карте, которой ни один иберийский корабль ещё не достигал с запада. Запах доносится до кораблей раньше, чем показываются сами острова — гвоздика, густая и тёмная, её аромат несёт тот же ветер, что провёл их через два океана.\n\n[target_leader.GetName] стоит на палубе, пока лоцманы выкрикивают глубину, и долго молчит. Трюмы почти пусты. От команды осталась лишь тень прежней. Но они здесь, и лодки султана уже отчаливают им навстречу."
 circumnavigation_expedition_events.12.a: "Fill the holds with [ShowGoodsNameWithNoTooltip('cloves')]; we crossed the world for this."
 circumnavigation_expedition_events.12.cloves_loaded_tt: "Уцелевшие трюмы забиты [ShowGoodsName('cloves')], которые будут проданы в [ROOT.GetCountry.GetCapital.GetMarket.GetName] по возвращении флота. Команда, прошедшая Тихий океан невредимой, привозит домой куда более богатый груз"
 circumnavigation_expedition_events.12.b: "Swear a treaty with the Sultan. Alliance outweighs cargo."
 circumnavigation_expedition_events.12.treaty_cargo_tt: "С султаном заключён договор, и на борт загружена часть [ShowGoodsName('cloves')] — груз скромнее, зато дружба с Островами Пряностей переживёт его"
 circumnavigation_expedition_events.12.historical_info: "Молуккские острова — изначальные «острова пряностей» — были источником гвоздики, мускатного ореха и мускатного цвета, которые делали восточную торговлю столь ценной. Корабли Элькано достигли Тидоре в ноябре 1521 года; его султан был соперником Тернате, находившегося тогда в сфере влияния Португалии. #italic «Виктория» #! и #italic «Тринидад» #! загрузили гвоздику; впоследствии #italic «Тринидад» #! попытался вернуться на восток через Тихий океан, но не смог одолеть ветра и был захвачен португальцами. Только #italic «Виктория» #! под командованием Элькано продолжила путь на запад. Когда она наконец достигла Санлукар-де-Баррамеда в сентябре 1522 года с восемнадцатью выжившими и трюмом, полным гвоздики, один этот груз пряностей окупил всю трёхлетнюю экспедицию и принёс прибыль."
 circumnavigation_expedition_events.13.title: "Огибая мыс"
 circumnavigation_expedition_events.13.desc: "Мыс оказывается именно таким, каким его описывали старые морские байки — стена серой воды и ветра, что треплет корабли, точно листья. Команда, то, что от неё осталось, не жалуется. Они уже прошли переход, который должен был быть невозможным, океан без названия и архипелаг, чуть было не поглотивший флотилию. Мыс Доброй Надежды — всего лишь очередное препятствие.\n\nКогда флагман минует мыс и ветер стихает, [target_leader.GetName] смотрит на восток, затем на запад. Теперь они побывали во всех океанах мира."
 circumnavigation_expedition_events.13.a: "Возблагодарим судьбу. Что бы ни случилось дальше, нас будут помнить."
 circumnavigation_expedition_events.13.b: "Никаких церемоний. Идём на север. Мы ещё не дома."
 circumnavigation_expedition_events.13.historical_info: "#italic «Виктория» #! обогнула мыс Доброй Надежды в мае 1522 года под командованием Элькано, преодолев последнее крупное географическое препятствие на пути домой в Испанию. Португальцы контролировали маршрут вокруг мыса и его порты снабжения; Элькано избегал их из-за юридической неопределённости статуса экспедиции, ведь Испания и Португалия спорили о суверенитете над Молуккскими островами согласно Тордесильясскому договору. Корабль был в плачевном состоянии, давал течь, а команда из 18 человек — от первоначальных 270 — была на грани истощения. Они достигли Санлукар-де-Баррамеда 6 сентября 1522 года, завершив первое кругосветное плавание менее чем за три года."
 circumnavigation_expedition_events.14.title: "Дружественные берега"
 circumnavigation_expedition_events.14.desc: "Над островами впереди реют собственные цвета [ROOT.GetCountry.GetName]. После долгих лет за пределами всех карт флотилия наконец причаливает к дружественному берегу — в гавань, где можно проконопатить корабль, наполнить бочки и накормить измождённую команду без страха и лжи. Люди губернатора спускаются к причалу поглазеть на исхудалых, оборванных людей, утверждающих, будто они обошли вокруг света.\n\nРодные воды теперь близко. [target_leader.GetName] остаётся лишь решить, сколько времени отвести на отдых."
 circumnavigation_expedition_events.14.a: "Put her to rights: caulk seams, fill casks, feed the men."
 circumnavigation_expedition_events.14.b: "A brief stop only. The men rest properly once home."
 circumnavigation_expedition_events.14.historical_info: "Во времена Магеллана острова Кабо-Верде принадлежали Португалии, и испанская флотилия не смела открыто пополнять там запасы. Однако корона, владеющая этими атлантическими островами сама, нашла бы в них бесценную последнюю стоянку перед возвращением домой — укрытие, где можно кренговать судно, набрать воды и провизии для корабля, измотанного самым долгим из когда-либо предпринятых плаваний."
 circumnavigation_expedition_events.15.title: "Час расплаты"
 circumnavigation_expedition_events.15.desc: "Последний корабль течёт по всем швам, а команда голодает, но единственная гавань в пределах досягаемости несёт цвета соперничающей короны. [target_leader.GetName] приказывает войти в порт под ложной легендой — будто идут домой из Америк, а не с запретного востока. Но когда матросы на берегу спрашивают, какое сегодня число, ответ расходится на день: где-то в кругосветном пути флотилия потеряла день счёта, и это расхождение может выдать всё.\n\nПровизия совсем рядом — если обман удержится."
 circumnavigation_expedition_events.15.a: "Hold to the story. Buy quickly, before the questions start."
 circumnavigation_expedition_events.15.ruse_ok_tt: "Легенда выдерживает проверку; провизия закуплена, и корабль ускользает прежде, чем вопросы становятся настойчивее"
 circumnavigation_expedition_events.15.ruse_failed_tt: "Ложь раскрывается из-за пропавшего дня, и часть береговой партии схвачена прежде, чем корабль успевает уйти"
 circumnavigation_expedition_events.15.b: "Do not chance a rival's harbor. Press home hungry as we are."
 circumnavigation_expedition_events.15.historical_info: "В июле 1522 года #italic«Виктория»#! зашла в португальское Сантьяго на островах Кабо-Верде, объявив, что возвращается из Америки, дабы скрыть свой путь через восточные земли, на которые претендовала Португалия. Уловка удавалась, пока расхождение в один день в судовом журнале — первое практическое доказательство того, как кругосветное плавание сбивает счёт дням, — не вызвало подозрений, и португальцы захватили тринадцать членов экипажа. Остальные обрубили якорный канат и бежали, добравшись до Испании всего с восемнадцатью людьми на борту."
 circumnavigation_expedition_events.16.title: "Пустынная стоянка"
 circumnavigation_expedition_events.16.desc: "Острова необитаемы — сухие, продутые ветром груды камня и колючего кустарника — но это земля, с укрытой от волн водой и родниками среди скал. И что ещё лучше — по склонам бродят одичавшие козы, оставленные каким-то прежним кораблём, и у моряков уже текут слюнки при мысли о свежем мясе после стольких дней гнили и долгоносиков.\n\nСтоянка не стоит ничего, кроме времени, а время — единственное, чем возвращающийся домой корабль может поступиться. [target_leader.GetName] отдаёт приказ."
 circumnavigation_expedition_events.16.a: "Send hunters ashore for goats and fill casks at the springs."
 circumnavigation_expedition_events.16.b: "Наполнить бочки водой и идти дальше. Дом уже достаточно близко."
 circumnavigation_expedition_events.16.historical_info: "Проходящие корабли часто завозили на необитаемые атлантические острова коз и свиней, которые размножались в диких стадах и превращали голые скалы в невольные кладовые для будущих мореходов. Неколонизированный, но снабжённый водой остров на обратном пути давал измотанной экспедиции свежее мясо и чистую воду без всякой платы, кроме нескольких дней задержки — малая милость, но настоящая, да ещё и на подступах к дому."
 circumnavigation_expedition_events.17.title: "Ни один корабль не вернулся"
 circumnavigation_expedition_events.17.desc: "В [capital_location.GetName] сезон сменяет сезон без единой вести от флотилии, пока не иссякает сама надежда. Экспедиция не вернётся домой. Где-то за краем известного мира — поглощённая слишком широким для пересечения морем, или измождённая до горстки кораблей и рук, способных ими управлять, — суда и их команды исчезли. От флотилии, отправившейся обогнуть мир, не возвращается ничего, кроме молчания и имён погибших.\n\nМечта переживает людей, что за ней гнались. Иное царствование, иная команда — быть может, довершат то, что начали эти."
 circumnavigation_expedition_events.17.a: "Они не будут забыты."
 circumnavigation_expedition_events.17.end_tt: "Экспедиция потеряна, и на этом её путь окончен"
 circumnavigation_expedition_events.17.historical_info: "Из семи кораблей, вышедших под началом Гарсиа Хофре де Лоайсы в 1525 году, чтобы повторить путь Магеллана, лишь одно потрёпанное судно и горстка выживших добрались до Молуккских островов, и никто не завершил обратный путь через восточный проход. Полная потеря экспедиции была настоящей опасностью той эпохи: кругосветное плавание требовало долгих лет в море без всякой надежды на пополнение запасов, и флот, поглощённый Тихим океаном, порой пропадал бесследно."
 circumnavigation_expedition_events.18.title: "Мятеж"
 circumnavigation_expedition_events.18.desc: "Начинается это так же, как начинается всегда: невнятное слово в ночную вахту, кучка людей, замолкающих при приближении офицера, капитан, что больше не смотрит [target_leader.GetName] в глаза. Провизии не хватает, люди мёрзнут и боятся, а нанимались они в плавание в Индии, а не на край света. Теперь недовольство обрело форму — один из капитанов открыто отказался подчиниться приказу, и его команда стоит за его спиной, требуя повернуть флотилию домой.\n\nУ [target_leader.GetNameWithNoTooltip], возможно, есть лишь день до того, как гниль перекинется на прочие корабли. То, что должно быть решено, нужно решить сейчас."
 circumnavigation_expedition_events.18.a: "Пусть недовольные поворачивают назад. Мы идём дальше без них."
 circumnavigation_expedition_events.18.b: "Put the mutiny down by force. Ringleaders will answer."
 circumnavigation_expedition_events.18.fight_win_tt: "Мятеж подавлен, а его зачинщики примерно наказаны. Порядок восстановлен, хотя расправа стоила флоту времени"
 circumnavigation_expedition_events.18.fight_lose_tt: "Подавление мятежа оборачивается открытой схваткой и заканчивается плохо: в этой сумятице флот потерял корабль, прежде чем порядок был восстановлен, да и время тоже потеряно"
 circumnavigation_expedition_events.18.c: "Напомнить им о том, что ждёт за горизонтом."
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] обходит палубы и говорит с командой так, как не смог бы никакой обычный командир. Мятеж угасает сам собой, а боевой дух матросов взлетает выше прежнего"
 circumnavigation_expedition_events.19.title: "Собственный берег"
 circumnavigation_expedition_events.19.desc: "После недель открытого [ShowContinentName('atlantic_ocean_continent')] на западном горизонте твердеет низкая зелёная полоса — а над маленьким портовым городком реют наши собственные знамёна. Колония [ROOT.GetCountry.GetName], основанная на этом далёком берегу, распахивает свои склады перед кораблями короны. Здесь есть пресная вода, фрукты, солонина и лес для ремонта — и всё это свободно, среди соотечественников.\n\n[target_leader.GetName] может взять на борт всё, что флотилия способна унести, прежде чем повернуть на юг, в неизвестность."
 circumnavigation_expedition_events.19.a: "Rest and revictual fully. Friendly soil like this is rare."
 circumnavigation_expedition_events.19.b: "A brief, grateful stop, then south. The season won't wait."
 circumnavigation_expedition_events.19.historical_info: "The northeastern shoulder of Brazil — Pernambuco, Paraíba, Rio Grande — was among the earliest and richest zones of Iberian settlement in the New World, its coast fringed with brazilwood and, before long, sugar. A crown that held these harbors could water and revictual a fleet on its own soil before the long haul into the southern latitudes — a luxury Magellan, threading waters claimed by a rival, never enjoyed."
 circumnavigation_expedition_events.20.title: "Берег соперника"
 circumnavigation_expedition_events.20.desc: "После недель открытого [ShowContinentName('atlantic_ocean_continent')] на западном горизонте твердеет низкая зелёная полоса — но знамёна над гаванью принадлежат [rival_crown.GetName]. Их колония владеет этим берегом, и флотилия, состоящая у нас на службе, не имеет законного права на её причалы. И всё же склады полны, а факторы достаточно охотно торгуют за добрую монету, и людям хочется хоть чего-то, что не было бы изъеденным долгоносиком сухарём.\n\n[target_leader.GetName] предстоит решить: войти под пушками соперника или держать курс на юг."
 circumnavigation_expedition_events.20.a: "Trade cautiously with [rival_crown.GetNameWithNoTooltip]'s colony for provisions."
 circumnavigation_expedition_events.20.b: "Обойти гавань соперника стороной. Идти дальше на юг."
 circumnavigation_expedition_events.20.historical_info: "По Тордесильясскому договору бразильское побережье оказалось в португальской половине мира, и флот на кастильской службе не мог претендовать на права в его гаванях. На практике голодная команда и сговорчивый колониальный фактор всё же могли тихо договориться о поставках, но заход в порт соперничающей короны всегда грозил захватом, поборами или конфискацией любого корабля, не способного доказать своё право находиться там."
 circumnavigation_expedition_events.21.title: "Цинга на борту"
 circumnavigation_expedition_events.21.desc: "Болезнь, преследующая всякое долгое плавание, настигла наконец и эту команду. Дёсны чернеют и кровоточат, старые шрамы раскрываются сами собой, зубы шатаются в челюстях, а люди, ещё месяц назад крепкие, уже не могут подняться с палубы. У корабельного лекаря нет иного средства, кроме отдыха и свежей пищи, а и того, и другого катастрофически мало.\n\n[target_leader.GetName] предстоит решить, сколь сильно можно понукать умирающую команду."
 circumnavigation_expedition_events.21.a: "Ration fresh stores and lie easy until the worst passes."
 circumnavigation_expedition_events.21.b: "No time to spare. Press on; the strong will endure."
 circumnavigation_expedition_events.21.b.tt: "The crossing grinds on with the sick left to their fate. Many will not see the far shore, and the survivors will be too few to bring home all the fleet"
 circumnavigation_expedition_events.22.title: "Буря"
 circumnavigation_expedition_events.22.desc: "Небо приобретает цвет кровоподтёка, а море вздымается серыми горами. Ветер рвёт такелаж, и корабли с трудом преодолевают впадины между волнами, достаточно глубокие, чтобы поглотить колокольню. Зелёная вода перехлёстывает через палубы, и лоцманы уже не видят один корабль с другого.\n\n[target_leader.GetName] должен решить, встретить ли бурю лицом к лицу или бежать перед ней, уповая на то, что флот удержится вместе."
 circumnavigation_expedition_events.22.a: "Лечь в дрейф, убрать паруса и переждать бурю."
 circumnavigation_expedition_events.22.b: "Идти по ветру и развить всю возможную скорость."
 circumnavigation_expedition_events.22.b.win_tt: "Флот проходит через самое страшное и выходит рассеянным, потрёпанным, но целым"
 circumnavigation_expedition_events.22.b.lose_tt: "The gamble fails, the fleet is flung apart in the dark, and a ship may not answer the next dawn"
 circumnavigation_expedition_events.23.title: "Червь в корпусе"
 circumnavigation_expedition_events.23.desc: "В этих тёплых водах корабельный червь-древоточец прогрызает обшивку быстрее, чем любой плотник успевает её заделать, пока доски не становятся пористыми, как соты. Помпы работают круглые сутки, а трюмы всё равно наполняются водой. Судну в таком состоянии нельзя доверять океанский переход без надлежащей кренгования — вытащить корабль на берег, выжечь наросты с днища и заново проконопатить швы.\n\n[target_leader.GetName] должен решить, как удержать флот на плаву."
 circumnavigation_expedition_events.23.a: "Кренговать и чинить корабли на каком-нибудь пустынном берегу, как получится."
 circumnavigation_expedition_events.23.a.tt: "The fleet careens on an empty shore and does what it can; the work is slow and costly, but the hulls will hold a while longer"
 circumnavigation_expedition_events.23.b: "Бросить худший корпус, а его команду разместить на остальных кораблях."
 circumnavigation_expedition_events.23.c: "Make for the friendly harbor close at hand and refit her."
 circumnavigation_expedition_events.23.c.tt: "The fleet puts in at a friendly harbor within reach and refits in safety — a far surer repair than any lonely beach could offer, and a welcome rest for the crews"
 circumnavigation_expedition_events.24.title: "Штиль"
 circumnavigation_expedition_events.24.desc: "Ветер стихает до полного безветрия. Паруса безвольно повисают на мачтах, море лежит плоским и стеклянным под белым и безжалостным небом, а корабли день за днём стоят неподвижно, пока вода в бочках протухает, а припасы истощаются. Люди становятся мрачны, а затем пугливы, шепчась, что флот заплыл за край ветров этого мира и никогда больше их не почувствует.\n\n[target_leader.GetName] может лишь ждать — или посадить людей на вёсла."
 circumnavigation_expedition_events.24.a: "Ждать возвращения ветра, сколько бы это ни заняло."
 circumnavigation_expedition_events.24.b: "Спустить шлюпки и тащить корабли на буксире силой рук."
 circumnavigation_expedition_events.25.title: "Слишком мало рук"
 circumnavigation_expedition_events.25.desc: "Столько людей погибло или лежит беспомощными внизу, что годных рук больше не хватает, чтобы управлять всеми кораблями. Ничего не поделаешь: один корабль лишают всего полезного, горстку уцелевших годных моряков перегружают на остальные суда, а его пустой корпус бросают на волю моря. Флот плывёт дальше меньшим числом судов — но, по крайней мере, оставшиеся теперь укомплектованы как следует."
 circumnavigation_expedition_events.25.a: "Другого выбора не было. Разделить его команду между остальными кораблями."
 circumnavigation_expedition_events.26.title: "Гибель корабля"
 circumnavigation_expedition_events.26.desc: "Когда буря наконец стихает и флот вновь собирается вместе, одного корабля недостаёт. Был ли он выброшен на подветренный берег, разошёлся ли по швам и пошёл ко дну во тьме, или просто был унесён за горизонт и потерян — никто сказать не может. Он не возвращается. Море забрало его — и все души на борту."
 circumnavigation_expedition_events.26.a: "Прочесть молитвы за усопших и плыть дальше."
 circumnavigation_expedition_events.27.title: "Пустынный берег"
 circumnavigation_expedition_events.27.desc: "Запасы в трюмах на исходе, но у борта тянется низкий зелёный берег — необитаемый, насколько могут судить дозорные: ни дымка от костров, ни выходящих в море каноэ. Свежая вода низвергается со скал десятком ручьёв, дикая птица теснится в отмелях, а леса обещают плоды, древесину и дичь всякому, кто решится сойти на берег и взять своё.\n\nСобрать столько, чтобы это имело значение, обойдётся флоту днями, которых у него едва хватает, но пустые желудки стоят ещё дороже. [target_leader.GetName] отдаёт приказ."
 circumnavigation_expedition_events.27.a: "Высадиться на берег. Наполнить бочки водой и собрать дрова, плоды и дичь."
 circumnavigation_expedition_events.27.b: "Нет времени на добычу пропитания. Идти дальше, как бы голодны мы ни были."
 circumnavigation_expedition_events.28.title: "Торговля с берегом"
 circumnavigation_expedition_events.28.desc.christian: "Запасы в трюмах на исходе, но неподалёку на берегу есть христианский [trade_shore.GetRank.GetName] — колокольный звон еле слышно доносится над водой, а над гаванью поднят крест. Их люди выходят в лодках, чтобы разглядеть чужаков — с опаской, но доброй волей, а там, где есть общая вера, находится и общий язык для торга. Зерно, солёное мясо, фрукты и свежая вода — всё это можно добыть за монету и товары.\n\nНесколько дней на якоре здесь снова наполнили бы трюмы. [target_leader.GetName] взвешивает задержку против убывающих запасов."
 circumnavigation_expedition_events.28.desc.muslim: "Запасы в трюмах на исходе, но неподалёку на берегу есть мусульманский [trade_shore.GetRank.GetName] — призыв к молитве доносится над водой, а на берегу вытянуты доу. Их торговцы выходят навстречу флоту, проницательные и бесстрашные, ибо это люди, которые торговали во всех морях мира. Рис, финики, солёная рыба и сладкая вода — всё это можно добыть за добрую монету и нужный товар.\n\nНесколько дней на якоре здесь снова наполнили бы трюмы. [target_leader.GetName] взвешивает задержку против убывающих запасов."
 circumnavigation_expedition_events.28.desc.pagan: "Трюмы почти опустели, но неподалёку на берегу расположен [trade_shore.GetRank.GetName], чьи жители чтут богов, о которых судовые капелланы даже не слышали. Они осторожно выходят навстречу на каноэ, предлагая коренья, фрукты, рыбу и тыквы с пресной водой, с любопытством разглядывая железо, ткани и безделушки, что чужаки протягивают в обмен. У сторон нет общего языка, но голоду и торгу он не нужен.\n\nНесколько дней торговли здесь вновь наполнили бы трюмы. [target_leader.GetName] взвешивает задержку против тающих запасов."
 circumnavigation_expedition_events.28.a: "Пристать к берегу и обменять всё, что можно, на провизию, которую способен вместить флот."
 circumnavigation_expedition_events.28.b: "Нет времени на торговлю. Идём дальше, как бы голодно нам ни было."
