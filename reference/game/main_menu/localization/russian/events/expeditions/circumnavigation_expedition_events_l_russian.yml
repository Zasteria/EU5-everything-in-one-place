l_russian:
 circumnavigation_expedition_events.1.title: "Великое путешествие"
 circumnavigation_expedition_events.1.desc: "Пять кораблей, двести семьдесят человек и годовой запас провизии против маршрута, которым ещё не ходил ни один капитан. [target_leader.GetName] спокойно рассказывает о землях, усеянных гвоздиками, и о западном пути к Островам пряностей, однако начальник порта не верит [Select_CString(target_leader.IsFemale, 'её', 'его' )] словам. Лоцманы тоже испытывают неуверенность, но сейчас это уже неважно: корабли снаряжены, ветер дует по курсу, а экспедиция получила королевскую печать.\n\nВпереди нас ждут бескрайние дали, которые ещё не отмечены ни на одной карте."
 circumnavigation_expedition_events.1.magellan: "Взять курс на Канары. Если на то есть воля Божья, мы найдём Западное море."
 circumnavigation_expedition_events.1.a: "Вперёд, к Канарам. Что бы ни ждало нас впереди, мы будем там первыми."
 circumnavigation_expedition_events.1.historical_info: "В сентябре 1519 года Фернан Магеллан покинул Санлукар-де-Баррамеду, чтобы отыскать западный путь к Островам Пряностей для испанской короны. В состав экспедиции входили пять кораблей: #italic Тринидад#!, #italic Сан-Антонио#!, #italic Консепсьон#!, #italic Виктория#! и #italic Сантьяго#!. Магеллан был португальским мореплавателем, он плавал в Индию и на Молуккские острова, но перешёл на службу к испанской короне после того, как король Мануэл I отказался увеличить ему жалование. Эта экспедиция вошла в историю как первое кругосветное путешествие, хотя самому Магеллану не суждено было вернуться домой."
 circumnavigation_expedition_events.2.title: "Последний знакомый берег"
 circumnavigation_expedition_events.2.desc: "[current_location.GetProvince.GetName] поднимается из-за горизонта бурыми скальными ярусами. Над головами моряков пока ещё то же знакомое небо, что они видели перед отплытием. Лоцманы делают последние замеры глубины, а остальные члены экипажа набирают пресную воду и чинят такелаж, потрёпанный суровыми водами и ветрами Атлантики. Впереди последний мыс, за которым начинаются неизведанные воды.\n\nНекоторые молятся, другие — пишут письма, которые уже не смогут отправить, а [target_leader.GetName] суетливо ходит по палубе туда-обратно, словно что-то высчитывая. Что бы мы ни взяли с собой, этих припасов должно быть достаточно для путешествия через океан и тех неожиданностей, которые могут приключиться с нами за его пределами."
 circumnavigation_expedition_events.2.a: "Запасёмся пищей под завязку. Второго такого шанса может и не быть."
 circumnavigation_expedition_events.2.b: "Отчаливаем немедленно, пока экипаж не утратил храбрость."
 circumnavigation_expedition_events.2.c: "Маршрут слишком непредсказуем. Лучше вернуться домой."
 circumnavigation_expedition_events.2.historical_info: "В эпоху Великих географических открытий Канарские острова, тогда принадлежавшие Кастилии, служили главной базой снабжения и отправной точкой для иберийских экспедиций через Атлантический океан. Так, на пути к Южной Америке флот Магеллана совершил остановку на Тенерифе, чтобы пополнить запасы провизии перед долгим путешествием через Атлантику. От провизии, закупленной на этих островах, во многом зависело то, переживёт ли экипаж грядущие месяцы вдали от суши."
 circumnavigation_expedition_events.3.title: "Новый край света"
 circumnavigation_expedition_events.3.desc: "После нескольких недель в бескрайних водах #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантики#!#! на горизонте наконец появилась зелёная полоса — заветное побережье Нового Света. Из далёких лесов уже раздаются крики попугаев, а многочисленные реки разливаются пресной водой у побережья. Вскоре мы подходим к берегу, где нас встречают туземцы на каноэ, которые предлагают нам древесину, питьё и необычные фрукты. Здесь есть всё, что нужно усталым морякам, однако сезон вот-вот переменится, а путь на юг по-прежнему не найден.\n\n[target_leader.GetName], [Select_CString(target_leader.IsFemale, 'истосковавшаяся', 'истосковавшийся' )] по суше и комфорту, размышляет, стоит ли задержаться здесь или лучше плыть дальше."
 circumnavigation_expedition_events.3.a: "Остановимся, чтобы поторговать с местными и пополнить припасы."
 circumnavigation_expedition_events.3.b: "Отдых подождёт. Нужно спешить на юг, пока погода нам благоволит."
 circumnavigation_expedition_events.3.historical_info: "Флот Магеллана достиг побережья Бразилии в конце 1519 года. Подойдя к суше в районе Кабу-ди-Санту-Агостинью, экспедиция незамедлительно продолжила путь на юг: согласно Тордесильясскому договору, Бразилия попадала в сферу влияния Португалии, поэтому испанский флот не мог долго задерживаться у её берегов. Тем не менее живущие здесь индейцы тупи охотно торговали со своими новыми гостями, и даже само наличие рядом суши уже позволяло испанцам вздохнуть с облегчением после длительного путешествия через Атлантику."
 circumnavigation_expedition_events.4.title: "Огромная бухта"
 circumnavigation_expedition_events.4.desc: "Наш флот заходит в широкую и хорошо защищённую бухту, окружённую зелёными горами и кишащую разной рыбой. Нам навстречу выходят толпы аборигенов, которые предлагают мясо и фрукты в обмен на наши ножи и рыболовные крючки. После долгого пути через Атлантику это место кажется настоящим раем, и моряки с радостью бы остались здесь навсегда.\n\nОднако мы пустились в путешествие не за тем, чтобы отдыхать. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, сколько флот здесь простоит, прежде чем отправится дальше."
 circumnavigation_expedition_events.4.a: "Людям нужно как следует отдохнуть и набрать провизии, иначе им не пережить дорогу."
 circumnavigation_expedition_events.4.b: "Выторгуем у местных побольше еды и отчалим через неделю."
 circumnavigation_expedition_events.4.c: "Некогда набивать брюхо. Забудем о торговле и поплывём дальше."
 circumnavigation_expedition_events.4.historical_info: "Огромная бухта Гуанабара, у которой позднее был основан Рио-де-Жанейро, позволила флоту Магеллана запастись провизией в дотоле небывалых объёмах. Её тихие воды были полны рыбы, а живущие на её берегах индейцы тупи в избытке отдавали испанцам пищу в обмен на инструменты и разные безделушки. Пополнение запасов в этой бухте позволило экипажу основательно подготовиться к грядущему поиску пролива в холодных широтах Патагонии, который в противном случае неминуемо обернулся бы провалом."
 circumnavigation_expedition_events.5.title: "Серебряный эстуарий"
 circumnavigation_expedition_events.5.desc: "Наши лоцманы были уверены, что мы найдём пролив: в конце концов, ни один континент не может тянутся вечно. Однако здешний эстуарий столь широк, что его дальний берег не видно даже с мачты, а его солоноватые и илистые воды уходят в море на сорок лиг. Мы отправляем суда на разведку вверх по реке, чтобы убедиться наверняка.\n\nЧерез пару недель они возвращаются и сообщают, что нашли лишь сомов и мелководья, и никакого прохода к океану впереди нет. Это значит лишь одно: нужно плыть дальше на юг. Если пролив всё-таки существует, то мы его найдём."
 circumnavigation_expedition_events.5.a: "Исследуем эстуарий как следует. Возможно, от него всё же будет польза."
 circumnavigation_expedition_events.5.b: "Не будем тратить время на тупики. Идём на юг."
 circumnavigation_expedition_events.5.press_tt: "Флот незамедлительно продолжает путь на юг в поисках заветного пролива"
 circumnavigation_expedition_events.5.c: "Это гнилая затея. Пора возвращаться домой."
 circumnavigation_expedition_events.5.historical_info: "Рио-де-ла-Плата — «серебряная река» — была открыта в 1516 году испанским мореплавателем Хуаном Диасом де Солисом, который был убит аборигенами незадолго после этого события. Экспедиция Магеллана обследовала эстуарий реки в январе 1520 года, ошибочно полагая, что это может быть пролив на запад. Этот просчёт стоил им нескольких недель, однако именно он позволил испанцам собрать первые подробные сведения о данном регионе. Река была названа в честь серебра, которым активно торговали местные индейцы чарруа и гуарани. Однако легендарные серебряные горы, о которых испанцы узнали от туземцев, были обнаружены лишь много десятилетий спустя."
 circumnavigation_expedition_events.6.title: "Пролив на краю света"
 circumnavigation_expedition_events.6.desc: "Пролив оказался холодным, узким и крайне опасным. По обе стороны от него возвышаются огромные чёрные скалы, а сам канал полон развилок и резких изгибов, от которых лоцманы едва не сбиваются с курса. Но наш самый коварный враг — это шквалистый ветер. Он приходит с ледников и постоянно меняет направление, со скрежетом отталкивая наши суда назад и прижимая их к скалам на многие часы и даже дни.\n\n[target_leader.GetName] стоит на носу флагмана, молча наблюдая за сужающимися стенами пролива. Лоцманы уверяют, что здесь можно пройти, однако остальные члены экипажа видят в них безумцев. Если карты не врут, то где-то впереди нас ждёт огромный океан, которому лишь предстоит получить своё название."
 circumnavigation_expedition_events.6.a: "Нужно идти дальше. Ветер нас не остановит."
 circumnavigation_expedition_events.6.b: "Перезимуем здесь. Набравшись сил, пройти пролив будет легче."
 circumnavigation_expedition_events.6.c: "Этот маршрут не стоит того. Развернуть корабли!"
 circumnavigation_expedition_events.6.historical_info: "Магелланов пролив, открытый в 1520 году, представляет собой 570-километровый коридор, который проходит через южную оконечность Южной Америки. Он отделяет континент от архипелага Огненная Земля, получившего своё название от многочисленных костров, которые туземцы разводили на побережье. Проход Магеллана через пролив занял 38 дней. На пути к нему экспедиция из пяти судов остановилась в бухте Сан-Хуан, где часть команды устроила мятеж. В результате один из восставших капитанов был казнён, а другой — брошен умирать в бухте. После этого один из кораблей, #italic «Сантьяго»#!, потерпел крушение в ходе разведки, а #italic «Сан-Антонио»#! самовольно покинул экспедицию и вернулся в Испанию. Оставшиеся три судна — #italic «Консепсьон»#!, #italic «Тринидад»#! и #italic «Виктория»#! — успешно преодолели пролив и достигли Тихого океана 28 ноября 1520 года."
 circumnavigation_expedition_events.7.title: "Океан, наречённый тихим"
 circumnavigation_expedition_events.7.desc: "Последний чёрный мыс пролива остаётся позади, и перед нашим флотом открывается бескрайний океан. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'назвала', 'назвал' )] его #italic mar pacifico#! — «тихое море», поскольку за время пребывания здесь мы не встретили ни единой бури. Однако нас настигла другая, куда более страшная беда. Недели сменяли друг друга, а на горизонте так и не появилось ни клочка земли. За это время вода в бочках протухла, а от сухарей остались лишь крошки, смешанные с червями. От такого дефицита моряки стали снимать со снастей воловью кожу и замачивать её в морской воде, чтобы размягчить и съесть, а трюмные крысы и вовсе стали для них на вес золота.\n\nЛоцманы не знают, как долго нам ещё плыть, ибо никто до нас ещё не совершал такого путешествия. Какое бы решение ни [Select_CString(target_leader.IsFemale, 'приняла', 'принял' )] [target_leader.GetName] для выхода из этого кризиса, часть экипажа, вероятно, уже никогда не увидит суши."
 circumnavigation_expedition_events.7.a: "Будем беречь последние запасы и держаться курса."
 circumnavigation_expedition_events.7.endured_tt: "Экипаж переживает путешествие, и флот добирается до дальних берегов в относительной целости"
 circumnavigation_expedition_events.7.scurvy_tt: "Цинга и голод берут своё, и флот теряет значительную часть экипажа"
 circumnavigation_expedition_events.7.b: "Поднять все паруса! Чем быстрее мы достигнем суши, тем меньше людей погибнет."
 circumnavigation_expedition_events.7.fast_tt: "Скорый ход позволяет вовремя добраться до суши и спасти изнемогающих моряков"
 circumnavigation_expedition_events.7.lost_tt: "Океан оказался куда больше, чем мы полагали. Флот истощает последние запасы и погибает"
 circumnavigation_expedition_events.7.c: "К северу должны быть острова. Будем надеяться, там есть пресная вода."
 circumnavigation_expedition_events.7.islands_tt: "Команда находит на архипелаге пищу и пресную воду. Путешествие обошлось малыми жертвами"
 circumnavigation_expedition_events.7.empty_sea_tt: "Острова оказались пустыми, а их поиски отняли драгоценное время и унесли ещё больше жизней"
 circumnavigation_expedition_events.7.historical_info: "Путешествие Магеллана через Тихий океан продлилось 99 дней, и за это время экспедиция ни разу не пополнила свои запасы. Флот неделями слепо блуждал по крупнейшему в мире океану, не встречая ни пяди суши. 19 моряков умерли от цинги, а выжившие питались опилками, вымоченной в морской воде воловьей кожей и крысами, которые продавались по баснословной цене в полдуката за штуку. Наконец, в марте 1521 года корабли достигли Марианских островов, которые испанцы прозвали #italic «островами воров»#! из-за туземцев, укравших у них одну из шлюпок. В то время обратный путь из Тихого океана на родину через Южную Америку был для моряков непреодолимым, однако уже в 1565 году мореход Андрес де Урданета открыл северный путь из Филиппин в Мексику, который на многие столетия стал основным маршрутом для манильских торговых галеонов."
 circumnavigation_expedition_events.8.title: "Первая суша за два месяца"
 circumnavigation_expedition_events.8.desc: "Вот уже больше шестидесяти дней экипаж не видит за бортом ничего, кроме воды, как вдруг с верхушки мачты раздаётся крик: «Земля!». Надежда охватывает корабли, словно дикое пламя, но когда мы подходим ближе, радость сменяется разочарованием. Суша — это небольшой атолл, заросший пальмами и омываемый высокими волнами. Тут не за что зацепить якорь, негде набрать воды. На здешних деревьях нет ничего съестного для голодающих моряков, а из живности вокруг только птицы, кружащие над головой.\n\nНа первый взгляд этот остров совершенно бесполезен, но измождённые члены экипажа надеются, что здесь всё-таки есть чем поживиться. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, стоит ли задержаться и поискать припасы или лучше сразу отправиться дальше."
 circumnavigation_expedition_events.8.a: "Спустим шлюпки и поищем воду и что-нибудь съедобное."
 circumnavigation_expedition_events.8.barren_tt: "Напрасная трата времени: на острове не найдётся ничего полезного"
 circumnavigation_expedition_events.8.relief_tt: "Экипаж добудет немного дождевой воды и морских птиц. Голодная смерть ненадолго отступит"
 circumnavigation_expedition_events.8.b: "Здесь нам делать нечего. Надо плыть дальше."
 circumnavigation_expedition_events.8.historical_info: "24 января 1521 года флот Магеллана наткнулся на свой первый тихоокеанский остров — небольшой атолл, который испанцы назвали Сан-Пабло (считается, что это был атолл Пука-Пука архипелага Туамоту). В своих дневниках Антонио Пигафетта писал, что на двух попавшихся им островах «негде было бросить якорь, ибо там не было дна». Не имея возможности высадиться, голодающий экипаж так и не смог собрать на этих островах какие-либо припасы, из-за чего Магеллан в итоге прозвал их #italic Islas Infortunadas#! — «островами невезения»."
 circumnavigation_expedition_events.9.title: "Остров акул"
 circumnavigation_expedition_events.9.desc: "Из-за горизонта всплывает второй остров, настолько же пустой, как и первый: кругом лишь кораллы и кусты, а кораблям негде встать на якорь. Из рыб в окрестных водах только бесчисленное множество акул, чьи серые плавники периодически мелькают возле наших судов. Здесь нет ни места для стоянки, ни пищи, ни пресной воды — только океан, от вида которого экипаж постепенно теряет надежду.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как флоту лучше поступить в столь тяжёлой ситуации."
 circumnavigation_expedition_events.9.a: "Попробуем добраться до берега на шлюпках."
 circumnavigation_expedition_events.9.a.tt: "Шлюпки вернутся ни с чем, но моряки рады хотя бы попытаться, так что неудача не сильно их огорчит (#R -3#! к боевому духу)"
 circumnavigation_expedition_events.9.b: "Назовём остров Акульим и отправимся дальше."
 circumnavigation_expedition_events.9.historical_info: "Второй из «островов невезения» был открыт 21 февраля 1521 года и получил название #italic Тибуронес#! (исп. tiburones — «акулы») из-за обилия акул в окружавших его водах. Принято считать, что это был атолл Каролайн или Флинт. Как и первый попавшийся Магеллану тихоокеанский остров, он был абсолютно пуст и не имел подходящего места для стоянки. Те недели, что флот провёл между этими двумя островами, стали наиболее тяжёлыми для экипажа за всё время путешествия: страдающие от голода и цинги моряки были вынуждены есть опилки, крыс и воловью кожу, служившую обмоткой для снастей. И хотя они сумели выловить несколько акул, мясо оказалось жёстким и зловонным, так что моряков выворачивало наизнанку."
 circumnavigation_expedition_events.10.title: "Острова воров"
 circumnavigation_expedition_events.10.desc: "Когда силы наши были уже на исходе, смотрящие заметили вдалеке зелёные горы. Наконец-то суша, где будет пресная вода, рыба и фрукты. Когда мы подходим к берегу, нам навстречу выдвигаются катамараны. Вскоре отчаянные туземцы ловко поднимаются на борта наших судов и принимаются тащить всё, что не прибито к палубе. Для них любая бесхозная вещь — честная добыча, однако для голодных моряков это грабёж.\n\nНайденные острова способны обеспечить экспедицию столь необходимой провизией, но лишь [target_leader.GetName] может решить, как мы её раздобудем."
 circumnavigation_expedition_events.10.a: "Честно выменяем у местных побольше пищи и воды в дорогу."
 circumnavigation_expedition_events.10.b: "Отправим вооружённый отряд вернуть награбленное и набрать провизии."
 circumnavigation_expedition_events.10.c: "Возьмём с катамаранов всё, что можно, и поплывём дальше."
 circumnavigation_expedition_events.10.historical_info: "Флот Магеллана достиг Гуама 6 марта 1521 года. Это был первый остров, на который экспедиция наткнулась в Тихом океане после выхода из пролива. Мореплаватель назвал Марианские острова, к которым относится Гуам, «островами воров» — #italic Islas de los Ladrones#!. Причиной стали чаморро — местные жители, у которых не было представления о частной собственности, а потому они забрали одну из шлюпок с корабля экспедиции. В ответ Магеллан отправил за лодкой около сорока вооружённых моряков, которые убили нескольких островитян и сожгли их хижины. Заодно голодающий экипаж впервые за три месяца пополнил запасы пищи и пресной воды, так что остановка, несмотря на конфликт, стала для экспедиции настоящим спасением."
 circumnavigation_expedition_events.11.title: "Кровь и вера на Себу"
 circumnavigation_expedition_events.11.desc: "Острова спасли нашу экспедицию. После тяжелейшего путешествия через океан моряки наконец смогли набрать пресной воды, фруктов и мяса в дорогу, а раджа острова Себу и вовсе встретил нас богатым пиром. В ходе переговоров [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'заключила', 'заключил' )] с местным правителем кровный договор: он и его народ примут #L [ROOT.GetCountry.GetReligion.GetAdjectuve|l]ую#! веру, а взамен наши пушки послужат его короне. В результате за один день под лучами тропического солнца обратились сразу сотни аборигенов.\n\nСовсем скоро наш новый союзник напомнил о долге. За узким проливом находится остров Мактан, и его гордый вождь отказался покоряться и заявил, что ни раджа, ни [ROOT.GetCountry.GetReligion.GetGodName] не имеют над ним власти. Теперь раджа просит, чтобы мы поставили наглеца на место. Похоже, чтобы обрести друзей на этих островах, нужно выступить против их врагов…"
 circumnavigation_expedition_events.11.a: "Мы поможем союзнику. Пусть Мактан узрит нашу мощь."
 circumnavigation_expedition_events.11.mactan_triumph_tt: "Напуганные демонстрацией силы, враги нашего союзника признают поражение"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "Атака захлебнётся ещё на мелководье. Погибнут люди, что ослабит флотилию"
 circumnavigation_expedition_events.11.b: "Возьмём на островах всё, что нужно, и отчалим. Это не наша борьба."
 circumnavigation_expedition_events.11.c: "Установим здесь королевское знамя. Пусть все знают, что эти острова — наша находка."
 circumnavigation_expedition_events.11.historical_info: "Фернан Магеллан достиг Филиппин в марте 1521 года и дал архипелагу название Сан-Ласаро. Здесь экспедиция не только смогла пополнить запасы провизии, но и впервые установила прочный контакт с населением западной части Тихого океана. Так, Магеллан заключил кровный договор с раджой Хумабоном, правителем острова Себу. По условиям соглашения, раджа и несколько тысяч его подданных приняли христианство в обмен на военную помощь. Этот союз оказался для Магеллана роковым: 27 апреля 1521 года мореплаватель был убит в битве при Мактане, где он во главе отряда выступил на стороне своего нового союзника и возглавил опрометчивую атаку против вождя Лапу-Лапу. После гибели Магеллана командование флотом перешло к Хуану Себастьяну Элькано, а из-за нехватки людей экспедиции пришлось сжечь у острова Бохоль один из оставшихся трёх кораблей — #italic «Консепсьон»#!."
 circumnavigation_expedition_events.12.title: "Острова пряностей"
 circumnavigation_expedition_events.12.desc: "Молуккские острова. Доселе ни одно иберийское судно не доходило до этих мест западным маршрутом. Теперь же те самые ветра, что двигали набитые пряностями корабли через океаны, доносят до нас их аромат прямиком с островов, которые едва показались на горизонте.\n\n[target_leader.GetName] молча стоит на палубе, пока матросы замеряют глубину. Трюмы почти опустели, от экспедиции осталась лишь бледная тень. И тем не менее мы здесь, в пункте своего назначения, и корабли местного султана уже движутся нам навстречу."
 circumnavigation_expedition_events.12.a: "Заполним трюмы гвоздикой. Ради этого момента мы пересекли весь мир."
 circumnavigation_expedition_events.12.cloves_loaded_tt: "Уцелевшие корабли будут загружены #TOOLTIP:GOODS,cloves,X гвоздикой#!, которая по возвращении флота будет продана на рынке [ROOT.GetCountry.GetCapital.GetMarket.GetName]. Успешное преодоление Тихого океана позволит команде вернуться домой с богатым грузом"
 circumnavigation_expedition_events.12.b: "Нужно заключить с султаном союз. Это куда важнее любого товара."
 circumnavigation_expedition_events.12.treaty_cargo_tt: "Мы заключим договор с султаном и разделим богатство. В трюмах будет меньше #TOOLTIP:GOODS,cloves,X гвоздики#!, зато у нас появится надёжный союзник на Островах пряностей"
 circumnavigation_expedition_events.12.historical_info: "Молуккские острова, первыми наречённые Островами пряностей, были основным источником гвоздики, мускатного ореха и мациса для восточных торговых маршрутов. В ноябре 1521 года флот Хуана Себастьяна Элькано достиг острова Тидоре, чей правитель тогда враждовал с соседним султанатом Тернате, находившимся в португальской сфере влияния. Корабли #italic «Виктория»#! и #italic «Тринидад»#! приняли здесь груз гвоздики, после чего второй попытался вернуться в Европу через Тихий океан, но потерпел неудачу и был захвачен португальцами. #italic «Виктория»#! же под командованием самого Элькано продолжила путь на запад и прибыла в Санлукар-де-Баррамеду в сентябре 1522 года. К тому моменту на борту остались лишь 18 выживших. Однако доход от привезённой гвоздики покрыл все расходы на трёхгодичную экспедицию и даже принёс значительную прибыль."
 circumnavigation_expedition_events.13.title: "Вокруг мыса"
 circumnavigation_expedition_events.13.desc: "Моряцкие байки не врали: на мысе бушуют огромные серые волны, а ураганный ветер гоняет корабли, как щепки. Впрочем, экипаж — а точнее то, что от него осталось — не смеет жаловаться. Моряки уже преодолели сложнейший пролив, пересекли безымянный океан и оставили позади архипелаг, где чудом не погибли. Мыс Доброй Надежды для них не более, чем очередное препятствие.\n\nКогда флагман огибает мыс, ветра наконец стихают. [target_leader.GetName] смотрит на восток, затем на запад. Теперь флотилия за одно путешествие побывала во всех океанах мира."
 circumnavigation_expedition_events.13.a: "Поблагодарить экипаж. Что бы ни случилось дальше, мы уже вписали свои имена в историю."
 circumnavigation_expedition_events.13.b: "Праздновать пока рано. До дома ещё тысячи миль"
 circumnavigation_expedition_events.13.historical_info: "В мае 1522 года #italic «Виктория»#! под командованием Хуана Себастьяна Элькано обогнула мыс Доброй Надежды, который был последним серьёзным препятствием на обратном пути в Испанию. Португальцы контролировали этот маршрут и расположенные на нём порты снабжения, поэтому Элькано намеренно шёл вдали от берегов: по Тордесильясскому договору статус Молуккских островов оставался спорным, и если бы идущее оттуда испанское судно попалось на глаза соперникам, оно бы непременно было захвачено. К этому моменту корабль уже дал течь и был в плачевном состоянии, а от изначальных 270 человек экипажа осталось лишь 18 истощённых моряков. Тем не менее 6 сентября 1522 года они добрались до Санлукар-де-Баррамеды, тем самым завершив чуть меньше чем за три года первое в истории кругосветное путешествие."
 circumnavigation_expedition_events.14.title: "Дружественные берега"
 circumnavigation_expedition_events.14.desc: "Над возникающими перед нами островами реют #L [ROOT.GetCountry.GetAdjective|l]ие#! флаги. Проведя годы в неизведанных водах, мы наконец подошли к дружественным берегам, где наш корабль подлатают, бочки наполнят свежей водой, а измождённый экипаж как следует накормят. Люди губернатора спускаются к причалу и с ужасом смотрят на исхудалых и уставших моряков, которые рассказывают о своём кругосветном путешествии.\n\nРодные воды уже близко. [target_leader.GetName] лишь [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, как долго мы будем здесь отдыхать перед последним рывком домой."
 circumnavigation_expedition_events.14.a: "Приведём судно в порядок, накормим экипаж и запасёмся водой."
 circumnavigation_expedition_events.14.b: "Мы здесь ненадолго. Экипаж сможет вдоволь отдохнуть дома."
 circumnavigation_expedition_events.14.historical_info: "При жизни Магеллана острова Кабо-Верде принадлежали Португалии, поэтому испанский флот не мог открыто там останавливаться. Если бы на тот момент испанская корона владела этими островами, они бы стали для экспедиции Магеллана важнейшим пунктом снабжения на пути домой, где экипаж мог бы произвести ремонт, запастись провизией и отдохнуть после тяжелейшего путешествия, которого до них не совершал никто."
 circumnavigation_expedition_events.15.title: "Просчёт"
 circumnavigation_expedition_events.15.desc: "Наш последний корабль буквально трещит по швам, а экипаж страдает от голода. По иронии судьбы ближайший порт принадлежит нашим недругам, но [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'решила', 'решил' )] пойти на риск и всё же [Select_CString(target_leader.IsFemale, 'завела', 'завёл' )] судно в гавань, солгав местным, что мы прибыли со стороны Америки, а не с закрытых для нас восточных островов. Однако когда наши моряки решили уточнить текущую дату, ответ их неприятно удивил: в нашем бортовом журнале недоставало целого дня. Вероятно, в ходе путешествия мы допустили просчёт, и теперь это мелкое несоответствие грозит нам разоблачением.\n\nОстаётся надеяться, что мы успеем запастись провизией прежде, чем наши неприятели что-то заподозрят."
 circumnavigation_expedition_events.15.a: "Будем придерживаться выдуманной истории, но поторопимся."
 circumnavigation_expedition_events.15.ruse_ok_tt: "Ложь сработала. Моряки закупают припасы и отчаливают раньше, чем враг успевает их разоблачить"
 circumnavigation_expedition_events.15.ruse_failed_tt: "Недостающий день вызывает у врагов подозрения, и часть экипажа попадает в плен"
 circumnavigation_expedition_events.15.b: "Если мы задержимся, нас раскроют. Лучше поплывём домой голодными."
 circumnavigation_expedition_events.15.historical_info: "В июле 1522 года испанский корабль #italic «Виктория»#! остановился у португальского острова Сантьягу, относящегося к архипелагу Кабо-Верде. Экипаж солгал местным, что пришёл из Америки, чтобы скрыть своё путешествие через подконтрольные Португалии тихоокеанские острова. Поначалу хитрость сработала, но вскоре португальцы заметили, что в бортовом журнале «Виктории» не хватает одного дня: в ходе своего кругосветного путешествия испанцы не учли линию перемены даты, проходящую через воды Тихого океана. Это тут же вызвало подозрения, в результате чего португальцы арестовали 13 членов экипажа, вышедших на сушу. Оставшиеся 18 моряков незамедлительно отчалили и продолжили путь обратно в Испанию."
 circumnavigation_expedition_events.16.title: "Стоянка на необитаемом острове"
 circumnavigation_expedition_events.16.desc: "Мы нашли необитаемые острова, которые представляют собой лишь заветренные скалы с редкими кустами. И всё же это суша, а среди здешних камней даже попадаются небольшие пресные водоёмы и ручьи. Более того, на скалистых склонах можно встретить одичалых коз, которых, вероятно, оставили моряки, побывавшие здесь до нас. Не стоит и говорить, что при одной мысли о свежем мясе у изголодавших членов экипажа текут слюнки.\n\nКонечно, на пополнение припасов уйдёт время, но в отличие от провизии, этот ресурс у нас в избытке. Понимая это, [target_leader.GetName] приказывает бросить якорь."
 circumnavigation_expedition_events.16.a: "Отправим охотников за дичью и наполним бочки свежей водой."
 circumnavigation_expedition_events.16.b: "Наберём воды и отправимся дальше. Дом уже недалеко."
 circumnavigation_expedition_events.16.historical_info: "Проходящие мимо корабли часто оставляли на необитаемых островах Атлантики свиней и коз, которые постепенно плодились и сбивались в крупные дикие стаи. Благодаря этому такие безжизненные клочки земли превращались в своеобразные пункты снабжения для последующих экспедиций, которые могли даром набрать здесь мяса и воды на пути домой."
 circumnavigation_expedition_events.17.title: "Ни один корабль не вернулся"
 circumnavigation_expedition_events.17.desc: "Времена года стремительно сменяют друг друга, а [capital_location.GetName] так и не получает от флота никаких вестей. Очевидно, надежды на возвращение экспедиции уже нет. Где-то за краем известного мира сгинули наши корабли и экипажи, либо поддавшиеся непреодолимой силе океана, либо истощённые до такой степени, что попросту не смогли найти в себе сил вернуться домой. От флота, отправившегося в кругосветное путешествие, остались лишь имена погибших.\n\nОднако одна неудача — ещё не повод отказываться от мечты. Возможно, следующей экспедиции всё же удастся закончить начатое."
 circumnavigation_expedition_events.17.a: "Их жертва не будет забыта."
 circumnavigation_expedition_events.17.end_tt: "Флот пропал, так и не закончив своё путешествие"
 circumnavigation_expedition_events.17.historical_info: "В 1525 году мореплаватель Гарсия Хофре де Лоайса возглавил новую экспедицию, которая должна была пройти путём Магеллана и закрепить за Испанией право на владение Молуккскими островами. Из 7 кораблей до островов добралось лишь одно потрёпанное судно и горстка выживших, которые так и не смогли закончить путешествие. В то время полная потеря флота ни для кого не была неожиданностью: кругосветные путешествия занимали не один год, и у моряков зачастую даже не было возможности пополнить припасы на пути к цели, поэтому многие из них в итоге погибали в безвестности на дне Тихого океана."
 circumnavigation_expedition_events.18.title: "Мятеж"
 circumnavigation_expedition_events.18.desc: "Всё началось с недовольного перешёптывания на ночном дежурстве. Затем беседующие моряки стали подозрительно замолкать в присутствии офицеров, а некоторые капитаны начали сторониться командира и избегать [Select_CString(target_leader.IsFemale, 'её', 'его' )] взгляда. Провизии осталось немного, а экипаж утомлён и напуган: эти люди согласились на путешествие до Индий, а не до края света. Теперь их недовольство переросло в полноценный бунт. Один из капитанов наотрез отказался выполнять приказ, и часть экипажа поддержала его, потребовав развернуть флот и отправиться домой.\n\nЕсли их не успокоить, скоро эта смута охватит и другие корабли, поэтому [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] как можно скорее решить эту проблему."
 circumnavigation_expedition_events.18.a: "Отпустить мятежников домой. Мы закончим путешествие без них."
 circumnavigation_expedition_events.18.b: "Силой подавить мятеж и наказать его зачинщиков."
 circumnavigation_expedition_events.18.fight_win_tt: "Мятеж подавлен, а его зачинщики наказаны в назидание другим. Порядок восстановлен, но флот теряет драгоценное время"
 circumnavigation_expedition_events.18.fight_lose_tt: "Подавление мятежа оборачивается бойней. Порядок восстановлен, но флот теряет время и один из кораблей"
 circumnavigation_expedition_events.18.c: "Напомнить мятежникам о славе и богатствах, что ждут нас за горизонтом."
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] обходит все корабли и обращается к экипажам с воодушевляющей речью. Моряки успокаиваются и приходят в отличное расположение духа"
 circumnavigation_expedition_events.19.title: "Наши берега"
 circumnavigation_expedition_events.19.desc: "Проведя недели в бескрайних водах #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантики#!#!, мы наконец замечаем впереди зелёные берега, над которыми развеваются флаги нашей державы. Основанная здесь #L [ROOT.GetCountry.GetAdjective|l]ая#! колония незамедлительно открывает закрома для королевских кораблей, даром предоставляя соотечественникам свежую воду, солонину, фрукты и древесину для ремонта.\n\n[target_leader.GetName] решает, насколько флот задержится здесь, прежде чем идти дальше на юг навстречу неизвестному."
 circumnavigation_expedition_events.19.a: "Нужно как следует отдохнуть и запастись провизией, пока есть возможность."
 circumnavigation_expedition_events.19.b: "Погода не станет нас ждать. Побудем здесь немного и отправимся на юг."
 circumnavigation_expedition_events.19.historical_info: "Северо-восточные регионы Бразилии — Пернамбуку, Параиба и Риу-Гранди — были в числе первых иберийских колоний в Новом Свете. Здешние берега были богаты фернамбуковыми деревьями и сахарным тростником, который сюда завезли европейцы. Держава, завладевшая этими гаванями, могла прямо здесь снабжать свои корабли всем необходимым, прежде чем они отправятся дальше к южным широтам. У экспедиции Магеллана не было такой возможности, поскольку на момент его кругосветного путешествия бразильское побережье уже принадлежало неприятельской Португалии."
 circumnavigation_expedition_events.20.title: "Враждебный берег"
 circumnavigation_expedition_events.20.desc: "Проведя недели в бескрайних водах #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантики#!#!, мы наконец замечаем впереди зелёные берега, над которыми развеваются #L [rival_crown.GetAdjective|l]ие#! флаги. Эти земли уже заняты неприятелями, а потому наш флот не имеет права здесь останавливаться. Тем не менее хранилища местной фактории доверху заполнены провизией, и её работники наверняка поделятся с нами своими запасами, если мы раскошелимся. В условиях, когда наши моряки уже много недель питаются червивыми сухарями, было бы неразумно упускать такую возможность…\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, стоит ли нам заходить во вражескую гавань, или лучше без остановки продолжать путь на юг."
 circumnavigation_expedition_events.20.a: "Закупим у [rival_crown.GetAdjectiveWithNoTooltip|l]их колонистов всё необходимое, соблюдая осторожность."
 circumnavigation_expedition_events.20.b: "Обойдём вражескую колонию стороной и поплывём дальше на юг."
 circumnavigation_expedition_events.20.historical_info: "Согласно Тордесильясскому договору, побережье Бразилии попадало в португальскую сферу влияния, поэтому формально флот под кастильским флагом не мог останавливаться в здешних гаванях. На практике же колониальные фактории часто тайно торговали с проходящими мимо испанскими судами, хотя подобные остановки были для них крайне рискованны: в случае поимки португальцы легко могли конфисковать любой корабль, у которого не было веских оснований находиться в Бразилии."
 circumnavigation_expedition_events.21.title: "Эпидемия цинги"
 circumnavigation_expedition_events.21.desc: "Болезнь, от которой обычно страдают моряки в долгих путешествиях, не обошла нас стороной. У многих членов экипажа чернеют и кровоточат дёсны, их старые шрамы расползаются, а зубы начинают шататься. Те, кто ещё месяц назад был здоров и полон сил, сегодня уже не могут встать с постели. Судовой хирург говорит, что лучшее средство от этого недуга — это отдых и свежая пища, однако в текущей ситуации моряки не могут позволить себе ни того, ни другого.\n\n[target_leader.GetName] оглядывает измождённый экипаж и размышляет, как лучше поступить."
 circumnavigation_expedition_events.21.a: "Выдадим больным остатки свежей еды и будем надеяться на лучшее."
 circumnavigation_expedition_events.21.b: "Отдыхать некогда. Сейчас каждый должен работать на пределе."
 circumnavigation_expedition_events.21.b.tt: "Экспедиция продолжает путь, не считаясь с больными. Многие не доживут до конца путешествия, и экипажу не хватит рук, чтобы привести домой все корабли"
 circumnavigation_expedition_events.22.title: "Буря"
 circumnavigation_expedition_events.22.desc: "Небо заволакивают грозовые тучи, и морские волны превращаются в огромные серые горы, под гребнями которых поместилась бы целая колокольня. Ветер нещадно рвёт снасти, а корабли с силой качаются из стороны в сторону, едва удерживаясь на плаву. Палубы неустанно заливает водой, и лоцманы уже не видят за стеной дождя соседние суда.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен' )] решить, переждать ли ураган или попытаться выплыть из него на попутном ветре."
 circumnavigation_expedition_events.22.a: "Уберём паруса и переждём бурю."
 circumnavigation_expedition_events.22.b: "Пойдём по ветру и будем надеяться, что корабли выдержат."
 circumnavigation_expedition_events.22.b.win_tt: "Флот рассеивается, но всё же выходит из урагана и отделывается лёгким испугом"
 circumnavigation_expedition_events.22.b.lose_tt: "Риск не оправдался. Буря разгоняет корабли в разные стороны, и один из них уже может не увидеть рассвет"
 circumnavigation_expedition_events.23.title: "Червь в корпусе"
 circumnavigation_expedition_events.23.desc: "В этих тёплых водах шашни прогрызают обшивку быстрее, чем плотники успевают её чинить, отчего корпус нашего корабля превращается в решето. Помпы работают денно и нощно, но трюм всё равно заполняется водой. Без должного ремонта такой потрёпанный корпус попросту не выдержит путешествия через океан. По-хорошему, судно нужно кренговать, чтобы очистить его дно от паразитов и как следует подлатать.\n\n[target_leader.GetName] раздумывает, как лучше поступить с повреждённым кораблём."
 circumnavigation_expedition_events.23.a: "Остановимся на каком-нибудь пляже и починим судно, как сможем."
 circumnavigation_expedition_events.23.a.tt: "Экипаж кренгует судно на пустом берегу и ремонтирует его теми средствами, что есть под рукой. Работа потребует много времени и сил, но в итоге корабль сможет продержаться на плаву чуть дольше"
 circumnavigation_expedition_events.23.b: "Бросим разваливающееся судно, а его экипаж разместим на остальных кораблях."
 circumnavigation_expedition_events.23.c: "Отправимся в дружественную гавань. Там и отремонтируем судно."
 circumnavigation_expedition_events.23.c.tt: "Флот заходит в ближайшую дружественную гавань, где экипаж может отдохнуть и провести полноценный ремонт судна"
 circumnavigation_expedition_events.24.title: "Штиль"
 circumnavigation_expedition_events.24.desc: "Ветер сходит на нет. Паруса вяло свисают с мачт, и наши корабли день за днём лишь неподвижно стоят на ровном как зеркало море, над которым нависает безжалостное белое небо. Тем временем вода в бочках протухает, а запасы еды понемногу заканчиваются. Моряков сначала охватывает уныние, а затем и страх: вдруг мы заплыли на самый край света, где мы больше никогда не поймаем ветер?\n\nВ такой ситуации [target_leader.GetName] может либо ждать благоприятной погоды, либо вести корабли вперёд с помощью вёсельных шлюпок."
 circumnavigation_expedition_events.24.a: "Мы будем стоять и ждать ветра столько, сколько потребуется."
 circumnavigation_expedition_events.24.b: "Спустим шлюпки и будем буксировать корабли на вёслах."
 circumnavigation_expedition_events.25.title: "Нехватка экипажа"
 circumnavigation_expedition_events.25.desc: "Многие наши матросы погибли или слегли с болезнями, и теперь нам попросту не хватает рук, чтобы управлять всеми кораблями. Выход лишь один: снять с одного из кораблей всё нужное и бросить его, а экипаж пересадить на другие суда. Для флота это будет ощутимая потеря, но зато мы сможем в достаточной мере укомплектовать оставшиеся корабли."
 circumnavigation_expedition_events.25.a: "У нас нет другого выбора. Бросим корабль и разделим экипаж."
 circumnavigation_expedition_events.26.title: "Корабль потерпел бедствие"
 circumnavigation_expedition_events.26.desc: "Когда буря наконец затихает, флот вновь собирается вместе и замечает, что одного корабля не хватает. Налетел ли он на берег, затонул ли в морских пучинах или просто заблудился во время урагана — одному лишь богу известно. Как бы то ни было, он не вернулся, а значит, его экипажа уже почти наверняка нет в живых."
 circumnavigation_expedition_events.26.a: "Помолимся об умерших и поплывём дальше."
 circumnavigation_expedition_events.27.title: "Пустынный берег"
 circumnavigation_expedition_events.27.desc: "Наши трюмы уже практически опустели, как вдруг смотрящие увидели сбоку зелёные берега. Не заметив каких-либо лодок или дыма от костров, мы пришли к выводу, что эти острова никем не заселены. К счастью для нас, со здешних скал стекают пресные ручьи, над отмелью кружат морские птицы, а в лесу полно фруктов, зверей и хорошей древесины для наших кораблей.\n\nНа сбор провизии и материалов уйдёт несколько дней, но голодный экипаж убеждён, что эта остановка стоит того. Взвесив все за и против, [target_leader.GetName] отдаёт приказ…"
 circumnavigation_expedition_events.27.a: "Высадиться на берег. Наполнить бочки водой и собрать дрова, плоды и дичь."
 circumnavigation_expedition_events.27.b: "Нет времени на добычу пропитания. Идти дальше, как бы голодны мы ни были."
 circumnavigation_expedition_events.28.title: "Торговля с берегом"
 circumnavigation_expedition_events.28.desc.christian: "Запасы в трюмах на исходе, но неподалёку на берегу есть христианский [trade_shore.GetRank.GetName] — колокольный звон еле слышно доносится над водой, а над гаванью поднят крест. Их люди выходят в лодках, чтобы разглядеть чужаков — с опаской, но доброй волей, а там, где есть общая вера, находится и общий язык для торга. Зерно, солёное мясо, фрукты и свежая вода — всё это можно добыть за монету и товары.\n\nНесколько дней на якоре здесь снова наполнили бы трюмы. [target_leader.GetName] взвешивает задержку против убывающих запасов."
 circumnavigation_expedition_events.28.desc.muslim: "Запасы в трюмах на исходе, но неподалёку на берегу есть мусульманский [trade_shore.GetRank.GetName] — призыв к молитве доносится над водой, а на берегу вытянуты доу. Их торговцы выходят навстречу флоту, проницательные и бесстрашные, ибо это люди, которые торговали во всех морях мира. Рис, финики, солёная рыба и сладкая вода — всё это можно добыть за добрую монету и нужный товар.\n\nНесколько дней на якоре здесь снова наполнили бы трюмы. [target_leader.GetName] взвешивает задержку против убывающих запасов."
 circumnavigation_expedition_events.28.desc.pagan: "Трюмы почти опустели, но неподалёку на берегу расположен [trade_shore.GetRank.GetName], чьи жители чтут богов, о которых судовые капелланы даже не слышали. Они осторожно выходят навстречу на каноэ, предлагая коренья, фрукты, рыбу и тыквы с пресной водой, с любопытством разглядывая железо, ткани и безделушки, что чужаки протягивают в обмен. У сторон нет общего языка, но голоду и торгу он не нужен.\n\nНесколько дней торговли здесь вновь наполнили бы трюмы. [target_leader.GetName] взвешивает задержку против тающих запасов."
 circumnavigation_expedition_events.28.a: "Пристать к берегу и обменять всё, что можно, на провизию, которую способен вместить флот."
 circumnavigation_expedition_events.28.b: "Нет времени на торговлю. Идём дальше, как бы голодно нам ни было."
