l_russian:
 circumnavigation_expedition_events.1.title: "Великое предприятие"
 circumnavigation_expedition_events.1.magellan: "Курс на Канарские острова. С Божьей помощью мы найдём Западное море."
 circumnavigation_expedition_events.1.a: "Set course for the Canaries. What lies beyond, we shall discover."
 circumnavigation_expedition_events.1.historical_info: "В сентябре 1519 года Фернан Магеллан покинул Санлукар-де-Баррамеду, чтобы отыскать западный путь к Островам Пряностей для испанской короны. В состав экспедиции входили пять кораблей: #italic Тринидад#!, #italic Сан-Антонио#!, #italic Консепсьон#!, #italic Виктория#! и #italic Сантьяго#!. Магеллан был португальским мореплавателем, он плавал в Индию и на Молуккские острова, но перешёл на службу к испанской короне после того, как король Мануэл I отказался увеличить ему жалование. Эта экспедиция вошла в историю как первое кругосветное путешествие, хотя самому Магеллану не суждено было увидеть его завершение."
 circumnavigation_expedition_events.2.title: "Последний знакомый берег"
 circumnavigation_expedition_events.2.desc: "[location.GetProvince.GetName] rises from the sea in flat brown tiers — fortresses of rock against a sky that is still the same sky as in [departure_port.GetName]. The pilots take final soundings. The men drink fresh water from iron casks and repair rigging frayed by the Atlantic swell. Beyond the last headland, the charts end.\n\nSome of the men pray. A few write letters they have no way of sending. [target_leader.GetName] walks the deck as if measuring something that cannot be measured. What is loaded now must last across an ocean and beyond."
 circumnavigation_expedition_events.2.a: "Take on full provisions. We will need everything the islands can give us."
 circumnavigation_expedition_events.2.b: "Leave now. The men's courage is highest while land is still in sight."
 circumnavigation_expedition_events.2.c: "Маршрут слишком ненадёжен. Вернуться в порт."
 circumnavigation_expedition_events.2.historical_info: "The Canary Islands — then under Castilian rule — served as the standard provisioning stop for Iberian Atlantic expeditions throughout the Age of Exploration. Magellan's fleet stopped at Tenerife to take on fresh provisions before beginning the long Atlantic crossing to the coast of South America. The islands had been colonized by Castile in the early 15th century and served as both a supply depot and a jumping-off point for voyages into unknown waters. How thoroughly a fleet victualled here could decide whether its crews survived the empty leagues to come."
 circumnavigation_expedition_events.3.title: "Край Нового Света"
 circumnavigation_expedition_events.3.a: "Put ashore for wood, water, and fruit, and trade with the coastal folk."
 circumnavigation_expedition_events.3.b: "Берег подождёт. Идти на юг, пока держится погода."
 circumnavigation_expedition_events.3.historical_info: "Magellan's fleet reached the Brazilian coast late in 1519, making landfall in the vicinity of Cabo de Santo Agostinho before working south. Brazil fell within the Portuguese half of the world under the Treaty of Tordesillas, so a fleet in Spanish service could not linger openly on that shore; nonetheless the coastal Tupí traded eagerly, and the abundance of the land was a welcome relief after the Atlantic crossing."
 circumnavigation_expedition_events.4.title: "Великий залив"
 circumnavigation_expedition_events.4.a: "Rest the crews and revictual fully. We will not see such plenty again."
 circumnavigation_expedition_events.4.b: "Trade for what provisions we can and be gone within the week."
 circumnavigation_expedition_events.4.c: "Мы здесь не для того, чтобы пировать. Плыть дальше без торговли."
 circumnavigation_expedition_events.4.historical_info: "The great bay that would later cradle Rio de Janeiro gave Magellan's fleet its richest resupply of the whole voyage. Its sheltered waters teemed with fish, and the coastal Tupí traded provisions in astonishing quantity for trinkets and iron tools. A thorough revictualling here steeled the crews for the cold latitudes and the search for the strait; a fleet that hurried on paid for its haste in the south."
 circumnavigation_expedition_events.5.title: "Серебряное устье"
 circumnavigation_expedition_events.5.a: "Survey the estuary properly. Whatever is here is worth knowing."
 circumnavigation_expedition_events.5.b: "У нас нет времени на реки, что ведут в никуда. Плывите на юг."
 circumnavigation_expedition_events.5.press_tt: "Флот без задержки идёт на юг, ища проход, что должен лежать где-то дальше"
 circumnavigation_expedition_events.5.c: "Эти широты превосходят разумные пределы. Возвращайтесь домой."
 circumnavigation_expedition_events.5.historical_info: "The Río de la Plata — the 'River of Silver' — was explored by the Spanish navigator Juan Díaz de Solís in 1516, who was killed by indigenous people shortly after making landfall. Magellan's expedition investigated the estuary in January 1520, incorrectly believing it might be the westward passage. The error cost them several weeks but produced the first detailed Spanish survey of the Río de la Plata region. The river was named for the silver traded there by the #italic Charrúa#! and #italic Guaraní#! peoples, though the rumored mountains of silver further inland proved elusive."
 circumnavigation_expedition_events.6.title: "Пролив на краю света"
 circumnavigation_expedition_events.6.a: "Drive the ships through. We did not come this far to be stopped by wind."
 circumnavigation_expedition_events.6.b: "Winter here. The passage will be kinder in season, the crews rested."
 circumnavigation_expedition_events.6.c: "Ни один путь не стоит этого. Разворачивайте флот."
 circumnavigation_expedition_events.6.historical_info: "Магелланов пролив — пройденный в ноябре 1520 года — представляет собой 570-километровый проход через южную оконечность Южной Америки, вдоль острова Огненная Земля, названного так за сторожевые костры его обитателей. Переход занял 38 дней. Во время подхода к проливу Магеллан подавил мятеж в Пуэрто-Сан-Хулиан, казнив одного капитана и высадив другого на необитаемый берег. Третий корабль, #italic«Сан-Антонио»#!, дезертировал и вернулся в Испанию. Оставшиеся три — #italic«Тринидад»#!, #italic«Консепсьон»#! и #italic«Виктория»#! — вышли в воды, которые Магеллан назвал #italic«Mar Pacífico»#!, 28 ноября 1520 года — так он назвал их за кажущееся спокойствие после ужасов пролива."
 circumnavigation_expedition_events.7.title: "Море, названное Тихим"
 circumnavigation_expedition_events.7.a: "Экономить припасы и держать ровный, осторожный курс."
 circumnavigation_expedition_events.7.endured_tt: "Команда выдерживает переход; флот достигает дальнего берега, всё ещё готовый к бою"
 circumnavigation_expedition_events.7.scurvy_tt: "Цинга и голод берут своё; флот еле ползёт вперёд с обескровленными командами"
 circumnavigation_expedition_events.7.b: "Crowd on all sail. The sooner we raise land, the fewer we bury at sea."
 circumnavigation_expedition_events.7.fast_tt: "Стремительный переход избавляет от худших потерь, и земля показывается вовремя"
 circumnavigation_expedition_events.7.lost_tt: "Море оказывается шире, чем кто-либо мог представить. Последние припасы иссякают, и экспедиция гибнет в полном составе"
 circumnavigation_expedition_events.7.c: "Держать курс на север, к слухам об островах, и молиться о пресной воде."
 circumnavigation_expedition_events.7.islands_tt: "Разбросанные острова дают воду и свежую пищу; переход переживают почти все"
 circumnavigation_expedition_events.7.empty_sea_tt: "Северные воды оказываются столь же пустынными, как и всё остальное; поиски стоят драгоценного времени и новых жизней"
 circumnavigation_expedition_events.7.historical_info: "Переход Магеллана через Тихий океан длился около девяноста девяти дней без единого пополнения запасов — флот блуждал через самую пустынную часть величайшего океана Земли, почти не встречая земли. Около девятнадцати человек умерли от цинги; выжившие ели опилки, кожаные снасти, размоченные в морской воде, а крысы продавались среди команды по завышенной цене. Первой землёй стал остров Гуам на Марианских островах в марте 1521 года, который испанцы назвали #italic Islas de los Ladrones#! — «Островами воров» — после того как жители-чаморро угнали одну из корабельных шлюпок, что вызвало карательный набег. Плавание через Тихий океан на восток, домой, долго оставалось непреодолимым для мореходов, пока Андрес де Урданета не нашёл в 1565 году северный обратный путь, #italic tornaviaje#!, положивший начало многовековой торговле манильских галеонов."
 circumnavigation_expedition_events.8.title: "Первая земля за два месяца"
 circumnavigation_expedition_events.8.a: "Lower the boats and search the reef — there may yet be water or food."
 circumnavigation_expedition_events.8.barren_tt: "Риф не даёт ничего, кроме насмешки в виде сухой земли, и дни потрачены впустую"
 circumnavigation_expedition_events.8.relief_tt: "Собрано немного дождевой воды и несколько морских птиц — малая милость против голода"
 circumnavigation_expedition_events.8.b: "Здесь нет ничего, и глубины недостаточно, чтобы удержать нас. Идём дальше."
 circumnavigation_expedition_events.8.historical_info: "24 января 1521 года флот увидел свою первую землю в Тихом океане: небольшой необитаемый атолл, названный Сан-Пабло — по всей вероятности, Пука-Пука в архипелаге Туамоту. Пигафетта записал, что оба острова, обнаруженные во время перехода, «не имели места для якоря, ибо не было дна», и содержали «только птиц и деревья». Не сумев высадиться, голодающие команды не смогли взять с них ничего, и Магеллан назвал эту пару #italic Islas Infortunadas#! — Несчастливые острова."
 circumnavigation_expedition_events.9.title: "Остров акул"
 circumnavigation_expedition_events.9.desc: "A second island rises from the sea, and it is as barren as the first — coral and scrub, ringed with surf, offering no anchorage. The only life in its waters is sharks, gliding grey beneath the hulls in numbers that make the sailors cross themselves. There is no landing here, no water, no food — only the same empty ocean, and the men's hope wearing thinner by the day.\n\n[target_leader.GetName] must decide how the fleet bears its despair."
 circumnavigation_expedition_events.9.a: "Lower the boats one last time and try for the shore through the surf."
 circumnavigation_expedition_events.9.b: "Назвать его Островом акул и молча идти дальше."
 circumnavigation_expedition_events.9.historical_info: "Второй из Несчастливых островов, увиденный 21 февраля 1521 года, был назван #italic Tiburones#! — «Акулы» — по множеству акул, которых Пигафетта отметил в его водах. Вероятно, это остров Каролайн или Флинт; он также не давал ни дна для якоря, ни облегчения. Недели между двумя островами были самыми тяжёлыми за весь переход: цинга неустанно косила людей, а команды ели кожу, опилки и крыс, чтобы выжить. Акул они не ловили — они даже не могли добраться до берега."
 circumnavigation_expedition_events.10.title: "Острова воров"
 circumnavigation_expedition_events.10.a: "Честно торговать за всю еду и воду, которую сможем унести."
 circumnavigation_expedition_events.10.b: "Land an armed party, recover the boat, and take what we need by force."
 circumnavigation_expedition_events.10.c: "Seize what we can from the canoes and stand out to sea at once."
 circumnavigation_expedition_events.10.historical_info: "6 марта 1521 года флот достиг Гуама на Марианских островах — первой земли после пролива. Магеллан назвал острова #italic Islas de los Ladrones#! — Островами Воров — после того, как чаморро, не имевшие понятия о частной собственности, увели корабельную шлюпку. В отместку он высадил около сорока вооружённых людей, сжёг дома и убил нескольких островитян, чтобы вернуть лодку. Как бы то ни было, эта стоянка дала умирающим командам первую за три с лишним месяца свежую пищу и воду — и стала их спасением."
 circumnavigation_expedition_events.11.title: "Blood and Baptism at Cebu"
 circumnavigation_expedition_events.11.desc: "The islands have saved the expedition. After the ordeal of the crossing, [target_leader.GetName]'s crews take on water, fruit, and fresh meat, and at Cebu the rajah receives them with feasting. A compact is sworn in blood: his people will take the cross, and in return the strangers' guns will serve his crown. Hundreds are baptized in a single day beneath the tropical sun.\n\nThen comes the price of alliance. Across a narrow channel, on the island of Mactan, a defiant chief refuses both the new god and the new overlord — and our ally looks to us to humble him. To make a friend among these islands is to inherit his enemies."
 circumnavigation_expedition_events.11.a: "Take up our ally's quarrel. Let Mactan see what our arms can do."
 circumnavigation_expedition_events.11.mactan_triumph_tt: "Показ силы устрашает острова, и враги нашего союзника оказываются усмирены"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "Штурм срывается на отмелях; гибнут добрые люди, и флот от этого слабеет"
 circumnavigation_expedition_events.11.b: "Take what the islands give and sail on. Their wars are not ours."
 circumnavigation_expedition_events.11.c: "Plant the royal standard. Let the crown record what we have found here."
 circumnavigation_expedition_events.11.historical_info: "Магеллан достиг Филиппинского архипелага в марте 1521 года, назвав его архипелагом Сан-Лазаро. Филиппины стали местом первого продолжительного контакта с народами западной части Тихого океана и дали провизию, спасшую голодающий флот. Магеллан заключил кровный союз с раджой Хумабоном из Себу, обратив его и несколько тысяч подданных в христианство. Этот союз оказался роковым: 27 апреля 1521 года Магеллан погиб в битве при Мактане, возглавив неудачный штурм через рифы против вождя Лапу-Лапу ради своего нового союзника. Командование в итоге перешло к Хуану Себастьяну Элькано, а уцелевшие — их было слишком мало, чтобы управлять тремя кораблями, — сожгли #italic«Консепсьон»#! у острова Бохоль."
 circumnavigation_expedition_events.12.title: "Острова пряностей"
 circumnavigation_expedition_events.12.a: "Fill the holds with [ShowGoodsName('cloves')]. We crossed the world for spices to carry home."
 circumnavigation_expedition_events.12.cloves_loaded_tt: "Уцелевшие трюмы забиты [ShowGoodsName('cloves')], которые будут проданы в [ROOT.GetCountry.GetCapital.GetMarket.GetName] по возвращении флота. Команда, прошедшая Тихий океан невредимой, привозит домой куда более богатый груз"
 circumnavigation_expedition_events.12.b: "Swear a treaty with the Sultan. An alliance is worth more than cargo."
 circumnavigation_expedition_events.12.treaty_cargo_tt: "С султаном заключён договор, и на борт загружена часть [ShowGoodsName('cloves')] — груз скромнее, зато дружба с Островами Пряностей переживёт его"
 circumnavigation_expedition_events.12.historical_info: "Молуккские острова — изначальные «острова пряностей» — были источником гвоздики, мускатного ореха и мускатного цвета, которые делали восточную торговлю столь ценной. Корабли Элькано достигли Тидоре в ноябре 1521 года; его султан был соперником Тернате, находившегося тогда в сфере влияния Португалии. #italic «Виктория» #! и #italic «Тринидад» #! загрузили гвоздику; впоследствии #italic «Тринидад» #! попытался вернуться на восток через Тихий океан, но не смог одолеть ветра и был захвачен португальцами. Только #italic «Виктория» #! под командованием Элькано продолжила путь на запад. Когда она наконец достигла Санлукар-де-Баррамеда в сентябре 1522 года с восемнадцатью выжившими и трюмом, полным гвоздики, один этот груз пряностей окупил всю трёхлетнюю экспедицию и принёс прибыль."
 circumnavigation_expedition_events.13.title: "Огибая мыс"
 circumnavigation_expedition_events.13.desc: "The cape is everything the Portuguese warned it would be — a wall of grey water and wind that treats the ships as if they are leaves. The crew, what remains of it, does not complain. They have already crossed a passage that should have been impossible, an ocean that had no name, and an archipelago where their captain died. The Cape of Good Hope is just another obstacle.\n\nWhen the flagship clears the headland and the winds ease, [target_leader.GetName] looks east, then west. They have now been in every ocean the world possesses."
 circumnavigation_expedition_events.13.a: "Возблагодарим судьбу. Что бы ни случилось дальше, нас будут помнить."
 circumnavigation_expedition_events.13.b: "Никаких церемоний. Идём на север. Мы ещё не дома."
 circumnavigation_expedition_events.13.historical_info: "#italic «Виктория» #! обогнула мыс Доброй Надежды в мае 1522 года под командованием Элькано, преодолев последнее крупное географическое препятствие на пути домой в Испанию. Португальцы контролировали маршрут вокруг мыса и его порты снабжения; Элькано избегал их из-за юридической неопределённости статуса экспедиции, ведь Испания и Португалия спорили о суверенитете над Молуккскими островами согласно Тордесильясскому договору. Корабль был в плачевном состоянии, давал течь, а команда из 18 человек — от первоначальных 270 — была на грани истощения. Они достигли Санлукар-де-Баррамеда 6 сентября 1522 года, завершив первое кругосветное плавание менее чем за три года."
 circumnavigation_expedition_events.14.title: "Дружественные берега"
 circumnavigation_expedition_events.14.a: "Put her to rights — caulk the seams, fill the casks, feed the men."
 circumnavigation_expedition_events.14.b: "A brief stop only. The men can rest properly once they are home."
 circumnavigation_expedition_events.14.historical_info: "Во времена Магеллана острова Кабо-Верде принадлежали Португалии, и испанская флотилия не смела открыто пополнять там запасы. Однако корона, владеющая этими атлантическими островами сама, нашла бы в них бесценную последнюю стоянку перед возвращением домой — укрытие, где можно кренговать судно, набрать воды и провизии для корабля, измотанного самым долгим из когда-либо предпринятых плаваний."
 circumnavigation_expedition_events.15.title: "Час расплаты"
 circumnavigation_expedition_events.15.a: "Hold to the story. Buy what we can before they question the date."
 circumnavigation_expedition_events.15.ruse_ok_tt: "Легенда выдерживает проверку; провизия закуплена, и корабль ускользает прежде, чем вопросы становятся настойчивее"
 circumnavigation_expedition_events.15.ruse_failed_tt: "Ложь раскрывается из-за пропавшего дня, и часть береговой партии схвачена прежде, чем корабль успевает уйти"
 circumnavigation_expedition_events.15.b: "Do not chance a rival's harbor. Press on for home, hungry as we are."
 circumnavigation_expedition_events.15.historical_info: "В июле 1522 года #italic«Виктория»#! зашла в португальское Сантьяго на островах Кабо-Верде, объявив, что возвращается из Америки, дабы скрыть свой путь через восточные земли, на которые претендовала Португалия. Уловка удавалась, пока расхождение в один день в судовом журнале — первое практическое доказательство того, как кругосветное плавание сбивает счёт дням, — не вызвало подозрений, и португальцы захватили тринадцать членов экипажа. Остальные обрубили якорный канат и бежали, добравшись до Испании всего с восемнадцатью людьми на борту."
 circumnavigation_expedition_events.16.title: "Пустынная стоянка"
 circumnavigation_expedition_events.16.a: "Send hunting parties ashore for goats, and fill the casks at the springs."
 circumnavigation_expedition_events.16.b: "Наполнить бочки водой и идти дальше. Дом уже достаточно близко."
 circumnavigation_expedition_events.16.historical_info: "Проходящие корабли часто завозили на необитаемые атлантические острова коз и свиней, которые размножались в диких стадах и превращали голые скалы в невольные кладовые для будущих мореходов. Неколонизированный, но снабжённый водой остров на обратном пути давал измотанной экспедиции свежее мясо и чистую воду без всякой платы, кроме нескольких дней задержки — малая милость, но настоящая, да ещё и на подступах к дому."
 circumnavigation_expedition_events.17.title: "Ни один корабль не вернулся"
 circumnavigation_expedition_events.17.desc: "Season follows season at [ROOT.GetCapital.GetName] with no word from the fleet, until hope itself is spent. The expedition will not come home. Somewhere past the edge of the known world — swallowed by a sea too wide to cross, or ground down to too few ships and too few hands to sail on — the vessels and their crews are gone. Of the fleet that set out to circle the world, nothing returns but silence and the names of the dead.\n\nThe dream outlives the men who chased it. Another reign, another crew, may yet finish what this one began."
 circumnavigation_expedition_events.17.a: "Они не будут забыты."
 circumnavigation_expedition_events.17.end_tt: "Экспедиция потеряна, и на этом её путь окончен"
 circumnavigation_expedition_events.17.historical_info: "Из семи кораблей, вышедших под началом Гарсиа Хофре де Лоайсы в 1525 году, чтобы повторить путь Магеллана, лишь одно потрёпанное судно и горстка выживших добрались до Молуккских островов, и никто не завершил обратный путь через восточный проход. Полная потеря экспедиции была настоящей опасностью той эпохи: кругосветное плавание требовало долгих лет в море без всякой надежды на пополнение запасов, и флот, поглощённый Тихим океаном, порой пропадал бесследно."
 circumnavigation_expedition_events.18.title: "Мятеж"
 circumnavigation_expedition_events.18.desc: "It begins the way these things always begin: a muttered word on the night watch, a knot of men who fall silent when an officer passes, a captain who will no longer meet [target_leader.GetName]'s eye. The provisions are short, the men are cold and afraid, and they signed on for a voyage to the Indies, not for the end of the world. Now the discontent has hardened into something with a shape — one of the captains has refused an order outright, and his crew stands at his back, demanding the fleet turn about for home.\n\n[target_leader.GetName] has perhaps a day before the rot spreads to the other ships. What is decided must be decided now."
 circumnavigation_expedition_events.18.a: "Пусть недовольные поворачивают назад. Мы идём дальше без них."
 circumnavigation_expedition_events.18.b: "Put the mutiny down by force. The ringleaders will answer for it."
 circumnavigation_expedition_events.18.fight_win_tt: "Мятеж подавлен, а его зачинщики примерно наказаны. Порядок восстановлен, хотя расправа стоила флоту времени"
 circumnavigation_expedition_events.18.fight_lose_tt: "Подавление мятежа оборачивается открытой схваткой и заканчивается плохо: в этой сумятице флот потерял корабль, прежде чем порядок был восстановлен, да и время тоже потеряно"
 circumnavigation_expedition_events.18.c: "Напомнить им о том, что ждёт за горизонтом."
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] обходит палубы и говорит с командой так, как не смог бы никакой обычный командир. Мятеж угасает сам собой, а боевой дух матросов взлетает выше прежнего"
 circumnavigation_expedition_events.19.title: "Собственный берег"
 circumnavigation_expedition_events.19.a: "Rest and revictual fully here. We will not see friendly soil for long."
 circumnavigation_expedition_events.19.b: "A brief and grateful stop, then south. The season will not wait."
 circumnavigation_expedition_events.19.historical_info: "The northeastern shoulder of Brazil — Pernambuco, Paraíba, Rio Grande — was among the earliest and richest zones of Iberian settlement in the New World, its coast fringed with brazilwood and, before long, sugar. A crown that held these harbours could water and revictual a fleet on its own soil before the long haul into the southern latitudes — a luxury Magellan, threading waters claimed by a rival, never enjoyed."
 circumnavigation_expedition_events.20.title: "Берег соперника"
 circumnavigation_expedition_events.20.a: "Put in and trade cautiously with [rival_crown.GetName]'s colony for what provisions we can."
 circumnavigation_expedition_events.20.b: "Обойти гавань соперника стороной. Идти дальше на юг."
 circumnavigation_expedition_events.20.historical_info: "По Тордесильясскому договору бразильское побережье оказалось в португальской половине мира, и флот на кастильской службе не мог претендовать на права в его гаванях. На практике голодная команда и сговорчивый колониальный фактор всё же могли тихо договориться о поставках, но заход в порт соперничающей короны всегда грозил захватом, поборами или конфискацией любого корабля, не способного доказать своё право находиться там."
 circumnavigation_expedition_events.21.title: "Цинга на борту"
 circumnavigation_expedition_events.21.desc: "The sickness that haunts every long voyage has come at last. Gums blacken and bleed, old scars split open of their own accord, teeth loosen in the jaw, and men who were hale a month ago can no longer rise from the deck. The surgeon has no remedy but rest and fresh food, and of both there is precious little of either.\n\n[target_leader.GetName] must weigh how hard a dying crew can be driven."
 circumnavigation_expedition_events.21.a: "Ration what fresh stores remain and lie easy until the worst has passed."
 circumnavigation_expedition_events.21.b: "No time to spare. Press on; the strong will outlast the sickness."
 circumnavigation_expedition_events.21.b.tt: "The crossing grinds on with the sick left to their fate. Many will not see the far shore, and the survivors will be too few to bring home all the fleet."
 circumnavigation_expedition_events.22.title: "Буря"
 circumnavigation_expedition_events.22.desc: "The sky turns the color of a bruise and the sea rises into grey mountains. The wind claws at the rigging, and the ships labor in troughs deep enough to swallow a steeple. Green water breaks clean over the decks, and the pilots can no longer see one ship from another.\n\n[target_leader.GetName] must choose whether to fight the storm head-on or run before it and pray the fleet holds together."
 circumnavigation_expedition_events.22.a: "Лечь в дрейф, убрать паруса и переждать бурю."
 circumnavigation_expedition_events.22.b: "Идти по ветру и развить всю возможную скорость."
 circumnavigation_expedition_events.22.b.win_tt: "Флот проходит через самое страшное и выходит рассеянным, потрёпанным, но целым"
 circumnavigation_expedition_events.22.b.lose_tt: "The gamble fails: the fleet is flung apart in the dark, and a ship may not answer the next dawn"
 circumnavigation_expedition_events.23.title: "Червь в корпусе"
 circumnavigation_expedition_events.23.a: "Кренговать и чинить корабли на каком-нибудь пустынном берегу, как получится."
 circumnavigation_expedition_events.23.a.tt: "The fleet careens on an empty shore and does what it can; the work is slow and costly, but the hulls will hold a while longer."
 circumnavigation_expedition_events.23.b: "Бросить худший корпус, а его команду разместить на остальных кораблях."
 circumnavigation_expedition_events.23.c: "Make for the friendly harbor close at hand and refit her properly."
 circumnavigation_expedition_events.23.c.tt: "The fleet puts in at a friendly harbor within reach and refits in safety — a far surer repair than any lonely beach could offer, and a welcome rest for the crews."
 circumnavigation_expedition_events.24.title: "Штиль"
 circumnavigation_expedition_events.24.a: "Ждать возвращения ветра, сколько бы это ни заняло."
 circumnavigation_expedition_events.24.b: "Спустить шлюпки и тащить корабли на буксире силой рук."
 circumnavigation_expedition_events.25.title: "Слишком мало рук"
 circumnavigation_expedition_events.25.desc: "Столько людей погибло или лежит беспомощными внизу, что годных рук больше не хватает, чтобы управлять всеми кораблями. Ничего не поделаешь: один корабль лишают всего полезного, горстку уцелевших годных моряков перегружают на остальные суда, а его пустой корпус бросают на волю моря. Флот плывёт дальше меньшим числом судов — но, по крайней мере, оставшиеся теперь укомплектованы как следует."
 circumnavigation_expedition_events.25.a: "Другого выбора не было. Разделить его команду между остальными кораблями."
 circumnavigation_expedition_events.26.title: "Гибель корабля"
 circumnavigation_expedition_events.26.desc: "Когда буря наконец стихает и флот вновь собирается вместе, одного корабля недостаёт. Был ли он выброшен на подветренный берег, разошёлся ли по швам и пошёл ко дну во тьме, или просто был унесён за горизонт и потерян — никто сказать не может. Он не возвращается. Море забрало его — и все души на борту."
 circumnavigation_expedition_events.26.a: "Прочесть молитвы за усопших и плыть дальше."
 circumnavigation_expedition_events.27.title: "Пустынный берег"
 circumnavigation_expedition_events.27.a: "Высадиться на берег. Наполнить бочки водой и собрать дрова, плоды и дичь."
 circumnavigation_expedition_events.27.b: "Нет времени на добычу пропитания. Идти дальше, как бы голодны мы ни были."
 circumnavigation_expedition_events.28.title: "Торговля с берегом"
 circumnavigation_expedition_events.28.desc.christian: "The holds are running low, but there is a Christian settlement on the coast nearby — church bells carrying faintly across the water, a cross raised above the harbor. Their people put out in boats to look the strangers over, wary but willing, and where there is a common faith there is a common tongue for bargaining. Grain, salt meat, fruit, and fresh water are all to be had for coin and trade goods.\n\nA few days spent at anchor here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
 circumnavigation_expedition_events.28.desc.muslim: "The holds are running low, but there is a Muslim town on the coast nearby — the call to prayer drifting out over the water, dhows drawn up along the strand. Their traders come out to meet the fleet, shrewd and unafraid, for these are people who have bought and sold across every sea in the world. Rice, dates, salt fish, and sweet water are all to be had for good coin and the right goods.\n\nA few days spent at anchor here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
 circumnavigation_expedition_events.28.desc.pagan: "The holds are running low, but there is a village on the coast nearby, its people following gods the fleet's chaplains have never heard named. They come out cautiously in canoes, offering roots, fruit, fish, and gourds of fresh water, curious about the iron and cloth and trinkets the strangers hold up in return. Neither side has the other's language, but hunger and barter need none.\n\nA few days spent trading here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
 circumnavigation_expedition_events.28.a: "Пристать к берегу и обменять всё, что можно, на провизию, которую способен вместить флот."
 circumnavigation_expedition_events.28.b: "Нет времени на торговлю. Идём дальше, как бы голодно нам ни было."
 circumnavigation_expedition_events.provisioned_tt: "The fleet is fully provisioned, and its crews will better withstand the great crossing ahead"
 circumnavigation_expedition_events.supplies_up_tt: "The fleet's provisions are replenished"
 circumnavigation_expedition_events.supplies_down_tt: "The fleet's provisions run lower"
 circumnavigation_expedition_events.morale_up_tt: "Morale among the crews rises"
 circumnavigation_expedition_events.morale_down_tt: "Morale among the crews falls"
 circumnavigation_expedition_events.morale_crash_tt: "Morale collapses — the crews are pushed to the edge of mutiny"
 circumnavigation_expedition_events.ship_lost_tt: "A vessel is lost, and the expedition is reduced"
 circumnavigation_expedition_events.wintered_tt: "Wintering restores the ships and crew, who will face the great crossing in far better condition"
 circumnavigation_expedition_events.9.a.tt: "Шлюпки возвращаются пустыми, но команды видели, что попытка была сделана, и боевой дух падает лишь немного (#R -3#! к боевому духу экипажа)"
 circumnavigation_expedition_events.morale_crash_15_tt: "Боевой дух рушится — команда на грани бунта (#R -15#! к боевому духу экипажа)"
 circumnavigation_expedition_events.morale_crash_20_tt: "Боевой дух рушится — команда на грани бунта (#R -20#! к боевому духу экипажа)"
 circumnavigation_expedition_events.morale_crash_30_tt: "Боевой дух рушится — команда на грани бунта (#R -30#! к боевому духу экипажа)"
 circumnavigation_expedition_events.morale_down_10_tt: "Боевой дух команды падает (#R -10#! боевой дух экипажа)"
 circumnavigation_expedition_events.morale_down_15_tt: "Боевой дух команды падает (#R -15#! боевой дух экипажа)"
 circumnavigation_expedition_events.morale_down_20_tt: "Боевой дух команды падает (#R -20#! к боевому духу экипажа)"
