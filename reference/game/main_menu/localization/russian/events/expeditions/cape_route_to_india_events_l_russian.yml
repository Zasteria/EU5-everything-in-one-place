 cape_route_to_india_events.morale_crash_15_tt: "Боевой дух подорван: экипажи на грани мятежа (#G −15#! к боевому духу)"
 cape_route_to_india_events.morale_crash_20_tt: "Боевой дух подорван: экипажи на грани мятежа (#G −20#! к боевому духу)"
 cape_route_to_india_events.ship_lost_tt: "Корабль потерян, и флот стал меньше (#R −1#! к числу судов)"
 cape_route_to_india_events.cargo_loaded_tt: "Трюмы заполнены #TOOLTIP:GOODS,pepper,X #L перцем#!#!: чем богаче выжившие путешественники, тем больше груза они привезут домой."
 cape_route_to_india_events.cargo_spent_tt: "В трюмах стало посвободнее: груз, потраченный на покупку этой благосклонности, не будет продан до конца путешествия (#R −20#! к количеству груза)"
 cape_route_to_india_events.pilot_gained_tt: "К флоту примкнул опытный лоцман. Мудрый совет этого человека пригодится нам в переговорах с Каликутом."
 cape_route_to_india_events.19.title: "Вспышка цинги"
 cape_route_to_india_events.19.desc: "Первыми она всегда поражает дёсны. Они становятся мягче, начинают кровоточить и истончаться. Старые, давно зажившие раны открываются вновь. Человек слабеет, у него появляется одышка, и вскоре он уже не может встать с койки. Корабельный врач разводит руками. Он не знает, что делать, — да и никто не знает. Чем лечить несчастных моряков? Ну не солёной же рыбой и сухарями, объеденными долгоносиком! Каждое утро во время переклички кого-то не оказывается на месте. Тела, завёрнутые в парусину, сбрасывают за борт. Путь до ближайшей земли кажется бесконечным."
 cape_route_to_india_events.19.a: "Раздадим последние фрукты и помчимся к берегу на всех парусах."
 cape_route_to_india_events.19.b: "Выбора у нас нет. Похороним мёртвых и будем молиться за живых."
 cape_route_to_india_events.19.b.tt: "Многие члены экипажа погибнут, а вы получите меньше прибыли от экспедиции"
 cape_route_to_india_events.19.historical_info: "Цинга — болезнь, вызываемая дефицитом витамина C, — была главной причиной смерти моряков в эпоху дальних плаваний. По имеющимся оценкам, в ходе первой экспедиции Васко да Гамы в Индию из 148 членов экипажа погибло 93 человека. Большинство скончались от цинги во время длительных переходов по открытому морю, вдали от источников свежей пищи. Истинная причина появления хвори оставалась неизвестной ещё два с половиной столетия. Некоторые врачи и моряки замечали, что свежие фрукты, особенно цитрусовые, замедляют развитие недуга, но то были лишь их личные наблюдения."
 cape_route_to_india_events.20.title: "Буря с юга"
 cape_route_to_india_events.20.desc: "Стрелка барометра устремляется влево, но никто не обращает на неё внимания. С юго-запада по морю идёт тяжёлая рябь, и вскоре ясное небо затягивается тучами. Ветер срезает гребни волн, разбрасывая клочки пены. Выше бортов поднимаются исполинские серо-зелёные валы, все в белой кипени. Они несут суда кормой вперёд к бегущим облакам, а затем бросают их в глубокие провалы, где завывания ветра сменяются жуткой тишиной. Где-то во мраке матросы палят из пушек, но звуки выстрелов почти мгновенно заглушает рёв моря. Делать нечего — придётся отдаться на волю стихии."
 cape_route_to_india_events.20.a: "Уберём паруса и ляжем в дрейф. Наши корабли всё выдержат."
 cape_route_to_india_events.20.b: "Продолжим путь под штормовыми парусами и будем молиться, чтобы нас не накрыло волной."
 cape_route_to_india_events.20.b.win_tt: "Риск оправдался: флот вышел из эпицентра бури"
 cape_route_to_india_events.20.b.lose_tt: "Флот оказался во власти моря"
 cape_route_to_india_events.20.historical_info: "Воды у побережья Южной Африки, где тёплое Агульясово течение сталкивается с холодными волнами Южного океана, считаются одними из самых опасных в мире. Здесь и по сей день возникают гигантские волны-убийцы, способные уничтожать крупные суда. Для небольших кораблей эпохи Великих географических открытий, таких как каракка и каравелла весом в несколько сотен тонн, шторм в Южной Атлантике представлял смертельную угрозу. Поэтому Агульяс раньше называли мысом Бурь."
 cape_route_to_india_events.21.title: "Безветренное море"
 cape_route_to_india_events.21.desc: "В полдень ветер утихает и наступает мёртвый штиль. Паруса безвольно свисают вдоль мачт, хлопая, пока корабль лениво перекатывается с волны на волну. К исходу второго дня море напоминает зеркало: огромное, со слепящей от солнца поверхностью, раскинувшееся до самого горизонта и затянутое вуалью знойной дымки. В палубных швах плавится смола. Вода в бочках нагревается, зеленеет и становится мерзкой на вкус. Остаётся лишь наблюдать за палящим светилом, слушать скрип корабельных балок и стараться не думать о том, сколько провизии съедают люди, угодившие в морскую ловушку. Моряки шепчутся о судах, блуждающих по океану, экипажи которых погибли от жажды, так и не дождавшись спасительного ветра."
 cape_route_to_india_events.21.a: "Будем ждать ветра. Других вариантов у нас нет."
 cape_route_to_india_events.21.b: "Спускаем лодки на воду и берём корабль на буксир. Всё лучше, чем слушать зловещую тишину."
 cape_route_to_india_events.21.historical_info: "Штили в экваториальной зоне затишья, или внутритропической зоне конвергенции, представляли большую опасность для кораблей, пересекавших Атлантический океан в Южном полушарии. Парусные суда могли стоять без движения несколько дней и даже недель, что приводило к увеличению расхода воды и провизии. Чтобы избежать штиля и встречных ветров, португальские моряки придумали метод навигации, получивший название #italic вольта-ду-мар#!. Капитаны делали большой крюк на запад, почти доплывали до Бразилии, чтобы поймать попутные ветры, а затем поворачивали на восток, к мысу."
 cape_route_to_india_events.22.title: "Черви в корпусе"
 cape_route_to_india_events.22.desc: "Во время ревизии трюмного колодца плотник замечает неладное. Бур выходит из стены, весь покрытый рыхлой щепой, а при проверке обшивки ниже ватерлинии инструмент слишком легко погружается в древесину, обычно твёрдую как железо. Корабельные черви. Тёплые тропические воды кишат этими тварями. Видимо, они завелись на судах, когда те пересекли экватор. Тысячи ходов в корпусе остаются незамеченными, пока доски не развалятся или помпы не выйдут из строя. Если ничего не предпринять, корабль разойдётся по швам и пойдёт ко дну. Плотник ещё не произнёс ни слова, а [target_leader.GetName] уже всё понимает."
 cape_route_to_india_events.22.a: "Нужно положить суда на бок и выжечь червей."
 cape_route_to_india_events.22.a.tt: "Кренгование требует времени и денег, но это единственный способ спасти флот."
 cape_route_to_india_events.22.b: "Вынесем с самого повреждённого корабля все припасы и древесину, после чего оставим его в море."
 cape_route_to_india_events.22.c: "Отправимся в дружественную гавань. Там и отремонтируем судно."
 cape_route_to_india_events.22.c.tt: "Отдых в спокойной гавани поднимет дух моряков"
 cape_route_to_india_events.22.historical_info: "Шашень, или #italic Teredo navalis#!, — паразит, который мог уничтожить судно в тёплых водах всего за один сезон, — на самом деле никакой не червь, а морской двустворчатый моллюск. Люди веками искали способы защититься от него: обшивали корпуса кораблей свинцовыми листами, покрывали их смесью смолы и животного жира или оснащали двойной обшивкой, буквально жертвуя верхний слой на корм червям. Особенно сильно страдали корабли, державшие путь в Индию. В конце концов португальцы стали возводить на своих базах в Индийском океане сооружения для кренгования, чтобы очищать и ремонтировать суда между плаваниями."
 cape_route_to_india_events.24.title: "Мятеж"
 cape_route_to_india_events.24.desc: "Мятеж случился не вдруг: недовольство среди моряков зрело неделями. Они шептались, поглядывая по сторонам, и замолкали при приближении офицеров. Не спешили исполнять приказы. Смотрели дерзко и с вызовом. Теперь же всё вышло наружу. Бунтовщики собрались в носовом кубрике: кто-то сжимал в кулаке свайку, а самые нерешительные держались позади. Они не разбойники: их действия продиктованы страхом. Эти люди уверены, что их ведут на верную смерть, и потому требуют, чтобы капитан повернул назад, к #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ому#! порту. Они готовы на всё, лишь бы не углубляться в открытый океан, который погубил их товарищей. [target_leader.GetName] стоит у края кормовой палубы. Сейчас в руках этого человека судьба всего экипажа."
 cape_route_to_india_events.24.a: "Высадим зачинщиков на берег, а малодушных отпустим."
 cape_route_to_india_events.24.b: "Поговорим с ними на языке оружия. Нечего разводить демократию."
 cape_route_to_india_events.24.fight_win_tt: "Офицеры одерживают верх, порядок восстановлен"
 cape_route_to_india_events.24.fight_lose_tt: "Люди гибнут в схватке, ничего хорошего это не сулит"
 cape_route_to_india_events.24.c: "Расскажем им об Индии. Кто не мечтает о богатстве и славе?"
 cape_route_to_india_events.24.rouse_tt: "[target_leader.GetNameWithNoTooltip] произносит вдохновляющую речь"
 cape_route_to_india_events.25.title: "Пустынный берег"
 cape_route_to_india_events.25.desc: "С подветренной стороны из тумана выступает низкий зелёный берег. Похоже, он совершенно безлюден: мы не видим ни дыма, ни кораблей, ни других следов человеческого присутствия. Густой лес спускается к кромке прибоя. Возможно, тут мы найдём пресную воду и какую-нибудь живность. Этой земли нет на карте — она ничья, неизведанная. Здесь нас может ждать что угодно: чистые родники и разнообразная дичь или же лихорадка и враждебные туземцы, которые уже наблюдают за нами из-за деревьев. Но делать нечего: запасы воды на исходе, а голодные и уставшие моряки едва стоят на ногах."
 cape_route_to_india_events.25.a: "Отправим лодки с моряками за водой и припасами."
 cape_route_to_india_events.25.b: "Риск слишком велик. Отметим землю на карте и продолжим путь."
 cape_route_to_india_events.26.title: "Торговля на берегу"
 cape_route_to_india_events.26.desc: "На побережье мы видим туземцев, которые, кажется, настроены дружелюбно. Когда корабли подходят ближе, от берега отчаливают каноэ. Люди показывают нам рыбу и фрукты — поначалу нерешительно, затем уже смелее. У воды возникает стихийный рынок. Очевидно, что местные не желают враждовать с нами, ведь их интересуют наши #TOOLTIP:GOODS,iron,X #L железо#!#! и #TOOLTIP:GOODS,cloth,X #L текстиль#!#!. Теперь мы можем наполнить бочки, запастись провизией и дать морякам отдохнуть на твёрдой земле, где им ничто не угрожает. Когда ещё нам выпадет такой шанс?"
 cape_route_to_india_events.26.a: "Обменяем железо и текстиль на свежую провизию."
 cape_route_to_india_events.26.b: "У нас нет времени. Наполним бочки водой — и в путь."
 cape_route_to_india_events.27.title: "Пропавшие в море"
 cape_route_to_india_events.27.desc: "Последний корабль сгинул в пути. Никто не знает, что стало его погибелью: стихия, болезнь, отчаяние или вражеский клинок. Известно лишь одно: флотилия, что так торжественно отходила от берега, уже не вернётся. Не будет ни трюмов, забитых #TOOLTIP:GOODS,pepper,X $tt_op_L$перцем$tt_cl_2$, ни триумфального приёма, ни карт с новым маршрутом в Индию. Где-то между Африкой и Азией море сомкнулось над судами экспедиции. Они исчезли в пучине, будто их никогда и не было. В Лиссабоне родные моряков будут ждать своих сыновей и мужей, пока не осознают горькую правду."
 cape_route_to_india_events.27.a: "Да упокоит [ROOT.GetCountry.GetReligion.GetGodName] их души. Мы ещё не скоро решимся на новую экспедицию."
 cape_route_to_india_events.27.historical_info: "Открытие морского пути в Индию было сопряжено с большими потерями. Даже во время успешных плаваний капитаны нередко лишались половины состава и части флотских судов. Участники неудачных экспедиций исчезали бесследно. За следующее столетие многие корабли, шедшие по маршруту #italic Carreira da Índia#!, разбились у берегов Африки, потонули во время штормов в Южном океане или просто пропали без вести. Эти путешествия принесли Лиссабону несметные богатства, но унесли жизни множества людей: кто-то сгинул в пучине, кто-то сгорел от болезни. Об этих жертвах нельзя забывать."
 cape_route_to_india_events.28.title: "Благословенные острова Зелёного Мыса"
 cape_route_to_india_events.28.desc.empty: "Над равнодушным морем возвышаются десять конусов из чёрной вулканической породы. Ни флаг, ни корабль, ни дым из труб не разбавляют этот унылый пейзаж. Тут нет ничего, кроме птиц, ветра, пепла и пары источников с солоноватой водой. Никто даже не пытался здесь поселиться. Тем не менее, [target_leader.GetName] отлично понимает, как важны эти острова. [ShowProvinceDefinitionName('cape_verde_province')] — ключ к #TOOLTIP:CONTINENT,atlantic_ocean_continent,X $tt_op_L$Атлантике$tt_cl_2$, и сейчас у этого ключа нет владельца."
 cape_route_to_india_events.28.desc.foreign: "Над якорной стоянкой [ShowLocationName('santiago')] развеваются #L [rival_owner.GetAdjective|l]ие$tt_cl_1$ знамёна. Судя по гарнизону и батарее, [rival_owner.GetName] уже здесь. Мы опоздали. Портовый смотритель плывёт к нам на лодке, чтобы узнать о цели нашего визита. Он разговаривает вежливо, но в его словах чувствуется неприязнь. Наш маршрут пролегает прямо вдоль островов. В руках неприятеля они подобны ножу, который приставляют к горлу капитана каждого судна, следующего на юг. [target_leader.GetName] стоит у леера и молча осматривает укрепления."
 cape_route_to_india_events.28.a: "Завоюем острова и построим фейторию с нашим флагом."
 cape_route_to_india_events.28.b: "Высадимся на берег, чтобы набрать воды и пополнить припасы."
 cape_route_to_india_events.28.c: "Эти острова принадлежат не нам. Отправимся дальше на юг."
 cape_route_to_india_events.28.d: "Вернёмся домой."
 cape_route_to_india_events.28.historical_info: "Острова Зелёного Мыса были открыты португальцами примерно в 1456 году, а заселять их начали только в 1462. Они расположены посреди Атлантического океана, где дуют северо-восточные пассаты. Это делает их отличным перевалочным пунктом для тех, кто плывёт в Америку и вдоль побережья Африки. Держава, захватившая острова, получала контроль над важным стратегическим узлом всех южных маршрутов. По этой причине португальцы, претендовавшие на господство в море, стали укреплять их и колонизировать."
 cape_route_to_india_events.29.title: "Каменный столп"
 cape_route_to_india_events.29.desc.rafael: "Флот остановился в [ShowLocationNameWithNoTooltip('quelimane')], у устья широкой и грязной реки, которую лоцманы уже прозвали «рекой добрых знамений». Именно здесь путешественники нашли то, ради чего переплыли полмира: снаряжённое на #TOOLTIP:CULTUREGROUP,arabian_group,X #L арабский#!#! лад судно и купцов, которые, услышав слово «Индия», уверенно указывают на восток. Наша цель уже близко: осталось лишь пересечь Аравийское море. В трюме лежат привезённые с родины известняковые колонны, увенчанные крестами и королевскими гербами. Плотник спрашивает, стоит ли вынести одну из них на берег. Воздвигнув её здесь, мы заявим о своих притязаниях на эту землю, а заодно успеем набрать пресной воды и древесины для ремонта кораблей, пока работают каменщики. Однако на всё это нужно время, которого у флота и так не много."
 cape_route_to_india_events.29.desc.maria: "Неподалёку от берега раскинулось множество островков, полных зелени и пресной воды, а также удачно укрытых от крупных волн, что для потрёпанного в пути флота является настоящим даром с небес. Индия уже рядом: малабарский берег всего в нескольких днях пути к югу. В трюме лежит очередная известняковая колонна, заготовленная ещё до начала путешествия и украшенная символами нашей державы. Воздвигнув её здесь, мы заявим о своём первенстве в этих водах и оставим на местных берегах неизгладимый отпечаток, который переживёт каждого из нас. Однако эта церемония, вкупе с ремонтом и сбором пресной воды для дальнейшего путешествия, несомненно отнимет у флота драгоценное время."
 cape_route_to_india_events.29.desc: "Эти берега достойны быть частью нашей короны. К счастью, в трюме лежит привезённая с родины известняковая колонна, увенчанная крестом и королевским гербом. Такие столбы устанавливают на мысах, чтобы каждый проходящий мимо корабль знал, что наш флот побывал здесь первым. Возведение колонны — это всегда торжественное событие, которое требует немало времени, а значит, флоту придётся стоять в гавани до тех пор, пока каменщики не закончат работу."
 cape_route_to_india_events.29.a: "Установим здесь #italic падран#!. Пусть он отметит наш проход."
 cape_route_to_india_events.29.b: "У нас нет время на церемонии. Собираем припасы и отчаливаем."
 cape_route_to_india_events.29.historical_info: "#italic Падраны#! — это каменные столбы, увенчанные крестами и королевскими гербами Португалии. Они изготавливались заранее и погружались на корабли, а затем устанавливались моряками на дальних берегах в знак того, что их держава первой открыла и присвоила эту землю. Согласно хроникам гуманиста Дамиана де Гойши, флот Васко да Гамы воздвиг пять таких столбов по пути в Индию: #italic Сан-Рафаэль#! на реке Добрых Знамений, #italic Сан-Хорхе#! в Мозамбике, #italic Эспириту-Санту#! в Малинди, #italic Санта-Мария#! на одноимённых островах и #italic Сан-Габриэль#! в Каликуте. Эти столбы пришли на смену недолговечным деревянным крестам, которые использовались в более ранних экспедициях. Некоторые из таких падранов простояли не одну сотню лет."
 cape_route_to_india_events.30.title: "Прерванная экспедиция"
 cape_route_to_india_events.30.desc: "Приказ был дан, и хотя никто его не оспаривает, некоторые моряки вздыхают с облегчением, тогда как на лицах других видно разочарование. Судно разворачивается. Неизведанные берега позади постепенно удаляются, а долгий и хорошо знакомый путь домой только начинается. Мы не привезём с собой ни карту Индии, ни грузы #TOOLTIP:GOODS,pepper,X $tt_op_L$перца$tt_cl_2$, а летописцы так и не напишут о том, как мы открыли морской путь на восток. Тем не менее наши суда целы, а экипаж жив и здоров, а значит, их возвращение в родную гавань — лишь вопрос времени.\n\n[target_leader.GetName] долго и задумчиво оглядывает горизонт позади, прежде чем вернуться к своим обязанностям на корабле."
 cape_route_to_india_events.30.a: "Что ж, вернёмся с теми скромными знаниями, что успели добыть."
 cape_route_to_india_events.30.historical_info: "Не каждая португальская экспедиция вдоль африканского побережья достигла своей цели. Капитаны тщательно взвешивали риски и в случае сомнений нередко разворачивали флот обратно, лишь частично исследовав новые берега. Хотя им и не удавалось добраться до Индии, такие путешествия всё же приносили свою пользу, понемногу дополняя карты новыми землями и маршрутами. Именно накопленные в ходе подобных экспедиций опыт и знания в конечном итоге позволили Васко да Гаме открыть морской путь из Португалии в Индию."
 cape_route_to_india_events.31.title: "Португальцы основывают свою фейторию"
 cape_route_to_india_events.31.desc: "Их капитан сошёл на берег с дарами, а не с пушками. В течение трёх дней все условия были обговорены: мы должны предоставить им участок прибрежной земли для #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейтории#!#!, а они — заплатить за него аренду; при этом любые споры между нами будут решать наши суды, а их флот должен будет охранять гавань от наших врагов. Они выгрузили из трюма заранее отмеренную древесину и за считанные дни построили свой торговый пост.\n\nТеперь наряду с нашим флагом над берегом реет и #L [por_feitoria_builder.GetAdjective|l]ий#!, а кораблей к нему прибывает в неделю больше, чем прибыло за прошлое столетие. Возможно, в будущем наши внуки со злостью будут вспоминать эту сделку, однако сегодня выгода очевидна: мы обзавелись порохом, тканями и сильным союзником, а они получили взамен лишь клочок земли для склада и верфи."
 cape_route_to_india_events.31.a: "Двор будет возмущаться, но мы выполним свою часть уговора."
 cape_route_to_india_events.31.b: "Закрепим условия аренды на бумаге во избежание недоразумений."
 cape_route_to_india_events.31.historical_info: "Не каждая фейтория была основана под угрозой обстрела из корабельных пушек. Например, султан Малинди, многие годы враждовавший с правителями Момбасы, заручился помощью флота Васко да Гамы и взамен предоставил ему своего лоцмана, который помог мореплавателю добраться до Каликута. В результате город Малинди несколько десятилетий оставался основным союзником Португалии на суахильском побережье, где сначала был возведён торговый пост, а затем и крепость. Таким образом, правители, которые добровольно договаривались с португальцами, получали доступ к их товарам и могли рассчитывать на их военную помощь, чем некоторые пользовались для сведения старых счётов. Подобные сделки редко были справедливыми для туземцев, и тем не менее они действовали гораздо дольше тех, что были навязаны силой."
