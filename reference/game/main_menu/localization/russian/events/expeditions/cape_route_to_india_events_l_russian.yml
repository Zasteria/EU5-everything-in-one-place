l_russian:
 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "Флот выходит в море"
 cape_route_to_india_events.1.desc: "Наши воды не видели такого флота уже целое поколение. Четыре корабля, сто семьдесят человек, запас [ShowGoodsName('salt')], [ShowGoodsName('fish')] и твёрдого сухаря на годы вперёд — и приказ от [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] найти морской путь в $india$. Священники благословляют корпуса. Толпа теснится у самой воды. Кто-то плачет.\n\n[target_leader.GetName] стоит на носу, когда корабли проходят бар и выходят в открытый [ShowContinentName('atlantic_ocean_continent')]. За спиной [target_leader.GetHerHim] гавань превращается в белое пятнышко на зелёном холме. Перед [target_leader.GetHerHim] океан простирается без границ во все стороны. [target_leader.GetSheHe|U] проделал все расчёты. [target_leader.GetSheHe|U] знает, что требует это плавание. Хватит ли этого — как всегда, в руках [ROOT.GetCountry.GetReligion.GetGodName]."
 cape_route_to_india_events.1.a: "Если будет угодно [ROOT.GetCountry.GetReligion.GetGodName|U], мы вернёмся с трюмами, полными пряностей."
 cape_route_to_india_events.1.b: "Помолимся — а затем отправимся в путь со всей поспешностью."
 cape_route_to_india_events.1.historical_info: "Португальская экспедиция по поиску морского пути в Индию стала результатом почти ста лет постепенного продвижения на юг вдоль африканского побережья. В 1488 году Бартоломеу Диаш обогнул мыс Доброй Надежды, доказав, что путь в Индию возможен. Плавание Васко да Гамы в 1497–1499 годах завершило начатое — его корабли вернулись домой с грузом перца и пряностей, стоимость экспедиции окупилась в шестьдесят раз. Это путешествие коренным образом изменило мировую торговлю пряностями, положив конец венецианско-османской монополии на сухопутные торговые пути."
 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "Острова [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.2.desc: "Десять вулканических островов, поднимающихся из плоского и безликого моря: таков архипелаг [ShowProvinceDefinitionName('cape_verde_province')]. Флот знал, чего ожидать, и всё же эти острова приходят как облегчение — твёрдая земля после недель открытого океана. Резиденция губернатора в [ShowLocationName('santiago')] — скромное строение из побелённого камня. В гавани пахнет солью, вяленой рыбой и, едва заметно, лишайником орсейль, соскобленным со скал для краски.\n\n[target_leader.GetName] обдумывает выбор. [ROOT.GetCountry.GetName] держит эти острова уже десятилетиями, но «держит» — слово щедрое: небольшой гарнизон, несколько поселенцев, ежегодный корабль с припасами. Если этому пути суждено что-то значить для будущего [ROOT.GetCountry.GetNameWithNoTooltip], острова должны стать чем-то бόльшим, чем просто перевалочный пункт."
 cape_route_to_india_events.2.a: "Invest here, expand the outpost guarding our southern route."
 cape_route_to_india_events.2.b: "Пополнить запасы, взять свежую воду и отправиться дальше."
 cape_route_to_india_events.2.c: "Идти дальше — мы не можем позволить себе задерживаться так рано."
 cape_route_to_india_events.2.d: "Вернуться домой."
 cape_route_to_india_events.2.historical_info: "Острова Кабо-Верде были открыты португальскими мореплавателями около 1456 года и постоянно заселены с 1462 года. Благодаря их положению в Атлантике — на пути северо-восточных пассатов — они стали важнейшим перевалочным пунктом для плаваний в Южную Америку и вокруг Африки. Их стратегическое значение значительно возросло после того, как плавание Васко да Гамы доказало возможность пути через Индийский океан. К шестнадцатому веку они превратились в важный узел атлантической работорговли."
 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "Остров [ShowLocationNameWithNoTooltip('sao_tome')]"
 cape_route_to_india_events.3.desc_common: "Жара возвещает о себе прежде, чем покажется берег: влажная, удушающая стена опускается на палубу в тот самый миг, когда флот пересекает экватор, заставляя людей задыхаться в воздухе, который никогда не становится прохладнее. [ShowLocationName('sao_tome')] поднимается из утреннего тумана, точно тёмно-зелёная корона: две вершины, окутанные облаками, и водопады, пробивающиеся сквозь лес, столь густой, что свет не достигает земли."
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nНебольшое поселение прилепилось к западному берегу. Здешняя почва, по словам поселенцев, необычайно плодородна. Всё, что посадишь, растёт. На этом острове можно сделать состояние на сахаре — если найдётся, кем работать эту землю."
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nНи с одного берега не поднимается дым. Ни в одной бухте не ждёт лодка. Остров совершенно пуст от людей — шлюпки флота первыми касаются этого пляжа. И всё же почва там, где можно вырубить джунгли, чёрная, глубокая и бесконечно плодородная. На таком острове можно сделать состояние на сахаре — если найдётся, кем работать эту землю, и если экваториальная лихорадка не унесёт работника прежде срока."
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nПоселение уже прилепилось к западному берегу под флагом, который не наш, — верфи, часовня, первые сырые тростниковые поля [rival_owner.GetAdjective] поселенцев, добравшихся до этого плодородного острова раньше [ROOT.GetCountry.GetName]. Почва здесь так же богата, как и обещали рассказы, но она уже занята. Всё, что нам нужно от [ShowLocationNameWithNoTooltip('sao_tome')], теперь придётся брать — или выторговывать — из рук [rival_owner.GetNameWithNoTooltip]."
 cape_route_to_india_events.3.a: "Establish a trading post; this island's promise is worth it."
 cape_route_to_india_events.3.a.owned: "Invest further in the island — [ShowLocationNameWithNoTooltip('sao_tome')] already answers to our flag."
 cape_route_to_india_events.3.b: "Plant a #italic padrão#! and claim the island for the Crown."
 cape_route_to_india_events.3.c: "Взять пресной воды и идти на юг."
 cape_route_to_india_events.3.d: "Вернуться домой."
 cape_route_to_india_events.3.historical_info: "Сан-Томе был необитаем, когда около 1470 года туда прибыли португальские мореплаватели. Его экваториальный климат оказался губительным для европейских поселенцев — смертность от болезней была высокой, — но чрезвычайно благоприятным для выращивания сахарного тростника. К 1520-м годам Сан-Томе стал крупнейшим в мире производителем сахарного тростника, который возделывали почти исключительно порабощённые африканцы. Позднее остров превратился в крупный перевалочный пункт атлантической работорговли — роль, которую он сохранял более двух столетий."
 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "Устье великой реки"
 cape_route_to_india_events.4.desc: "Океан здесь становится бурым. Флот наблюдает за этим уже сутки — цвет перетекает в море с юга, чайного оттенка и густой от ила. Затем они видят причину: река шире любой в [ROOT.GetCountry.GetName], шире любой реки, какую видел хоть один из этих людей, впадает в [ShowContinentName('atlantic_ocean_continent')] бурым потоком, окрашивающим море на километры во все стороны.\n\nИз мангровой кромки появляются пироги-однодревки. Они огромны — выдолблены из единого ствола, тридцать футов в длину, и ими гребёт дюжина людей в идеальном согласии. Мужчины, стоящие на носах, безоружны. Они наблюдают за флотом со спокойным любопытством людей, никогда не боявшихся чужаков."
 cape_route_to_india_events.4.a: "Seek an audience with the [target_owner.Custom('GetRulerOrRegentTitle')] of this land."
 cape_route_to_india_events.4.b: "Trade for [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')], and whatever they offer."
 cape_route_to_india_events.4.c: "Chart the river mouth and press south; we cannot delay."
 cape_route_to_india_events.4.d: "Вернуться домой."
 cape_route_to_india_events.4.historical_info: "Королевство Конго было одним из наиболее развитых политических образований Африки южнее Сахары, контролировавшим территории на землях современных Конго, Анголы и Габона. Маниконго (король) правил через иерархическую бюрократию и поддерживал развитую систему провинциального управления. В 1480-х годах португальские миссионеры установили контакт с королевством, положив начало отношениям, которые окажутся судьбоносными — а в конечном счёте катастрофическими — для обеих сторон. В 1490-х годах королевство приняло христианство, и маниконго принял имя Жуан I."
 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
 cape_route_to_india_events.5.desc: "Каждый офицер экспедиции узнаёт это в тот же миг, как видит. Никто из моряков не встречал такой гавани нигде на африканском побережье: длинный изогнутый залив, укрытый с юго-запада естественной песчаной косой, глубокая вода у самого берега, а за ним — низкий мыс с видом во все стороны. Местные рыбаки называют его Луанда — плоское место.\n\n[target_leader.GetName] проходит вдоль всей песчаной косы в вечернем свете, залив с одной стороны и открытый [ShowContinentName('atlantic_ocean_continent')] с другой. [target_leader.GetSheHe|U] уже думает о стенах. О свежей воде. О числе кораблей, что гарнизон здесь мог бы защитить — или перехватить. Город, построенный здесь, мог бы держать под контролем всю торговлю южной Атлантики."
 cape_route_to_india_events.5.desc.owned: "Флот подходит к бухте, чья ценность им хорошо известна: над [ShowLocationName('luanda')] уже реют цвета [ROOT.GetCountry.GetName], а его длинная песчаная коса укрывает корабли, подчинённые нашей короне.\n\n[target_leader.GetName] идёт вдоль косы в свете полуденного солнца — с одной стороны бухта, с другой открытый [ShowContinentName('atlantic_ocean_continent')], — думая не о том, стоит ли занять эти земли, а о том, сколько ещё они могут дать. Укреплённый как следует, город здесь мог бы держать под контролем всю торговлю южной Атлантики."
 cape_route_to_india_events.5.a: "Возвести здесь крупную [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — ей не будет равных."
 cape_route_to_india_events.5.a.owned: "Expand our great post at [ShowLocationNameWithNoTooltip('luanda')] — none on this coast compares."
 cape_route_to_india_events.5.b: "Основать здесь небольшую торговую факторию и склад."
 cape_route_to_india_events.5.b.owned: "Enlarge the trading post and supply depot we already hold here."
 cape_route_to_india_events.5.c: "Note its position on the charts and continue south."
 cape_route_to_india_events.5.d: "Вернуться домой."
 cape_route_to_india_events.5.historical_info: "Луанда была официально основана как португальская колония в 1575 году Паулу Диашем де Новайшем, что делает её одним из старейших европейских поселений в Африке южнее Сахары. Её естественная гавань на протяжении более четырёх веков служила главным портом португальской Анголы. Начиная с XVI века Луанда стала основным пунктом отправки трансатлантической торговли рабами в южной Африке, откуда миллионы порабощённых людей отправлялись в Бразилию и на Карибы."
 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "Пустынное побережье"
 cape_route_to_india_events.6.desc: "Здесь пустыня подходит к самому морю: красные дюны поднимаются прямо от линии прибоя, и с их гребней в воздух срывается песок. Деревьев нет. Пресной воды не видно. Побережье к северу — люди уже называют его [ShowLocationName('skeleton_coast')], из-за костей китов, белеющих на берегу, — не выказывает следов человеческого жилья на сотни миль в любую сторону.\n\nИ всё же бухта спокойна. Укрытая от самых сильных волн, она даёт флоту возможность починить повреждённую мачту и наполнить бочки солоноватой водой из родника среди дюн. На мысу над бухтой штурман корабля измеряет угол солнца своими приборами и делает записи. Мыс, по его словам, лежит не более чем в неделе плавания к югу. Некоторые из матросов осеняют себя крестным знамением."
 cape_route_to_india_events.6.a: "Rally the men: the Cape lies within reach at last. Forward!"
 cape_route_to_india_events.6.b: "These currents and winds speak; let me read them."
 cape_route_to_india_events.6.c: "Let the men rest; they'll need strength for storms ahead."
 cape_route_to_india_events.6.d: "Вернуться домой — это побережье слишком безлюдно, чтобы идти дальше."
 cape_route_to_india_events.6.historical_info: "Побережье Намибии было известно португальским морякам как #italic Costa dos Esqueletos#! (Берег Скелетов) из-за обилия костей китов и тюленей, а также обломков кораблей, выброшенных на подветренный берег мощными юго-западными ветрами. Уолфиш-Бей, названный голландцами #italic Walvischbaai#! (Китовая бухта), был одной из немногих укрытых якорных стоянок на этом враждебном отрезке побережья. Бартоломеу Диаш останавливался здесь в 1488 году во время своего плавания на юг."
 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "Мыс Бурь"
 cape_route_to_india_events.7.desc: "Ничто за три месяца плавания не подготовило их к этому. Шторм налетает без предупреждения, с юго-запада, гоня перед собой волны высотой в сорок футов. Головной корабль исчезает во впадине между волнами и не появляется добрых тридцать секунд. Снасти срываются. Людей сбивает с такелажа. [target_leader.GetName] обеими руками цепляется за кормовой борт и смотрит на хаос вокруг [target_leader.GetHerHim], и где-то в этом реве ветра и разбивающейся воды [target_leader.GetSheHe] понимает: они прошли. Мыс — великая южная оконечность африканского континента, край известного мира — остался за кормой.\n\nПуть к $india$ открыт."
 cape_route_to_india_events.7.a: "Назвать его мысом Доброй Надежды и без промедления идти на восток!"
 cape_route_to_india_events.7.b: "Укрыться под защитой мыса, пока не пройдёт шторм."
 cape_route_to_india_events.7.d: "We have done enough; the Cape is rounded. Turn for home."
 cape_route_to_india_events.7.historical_info: "Bartolomeu Dias first rounded the Cape in 1488, naming it #italic Cabo das Tormentas#! (Cape of Storms). According to Portuguese sources, King João II renamed it #italic Cabo da Boa Esperança#! (Cape of Good Hope) to encourage future expeditions, though this account may be apocryphal. The Cape is not the southernmost point of Africa — that distinction belongs to Cape Agulhas, some two hundred kilometers to the east — but it marks the meeting point of the Atlantic and Indian Oceans and the door to the east."
 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "Бухта Пастухов"
 cape_route_to_india_events.8.desc: "Бухта спокойна и прекрасна, укрыта от юго-запада низким мысом. Молочные деревья дают желанную тень вдоль берега. А на склоне холма над пляжем — скот. Тучный, здоровый скот пасётся огромными стадами, за которыми следят высокие люди в охре и стеклянных бусах, наблюдающие за флотом с безопасного расстояния с тех пор, как он встал на якорь.\n\nНекоторые из матросов едва не плачут при виде свежего мяса. Они питались солёной рыбой и сухими лепёшками уже несколько недель. Наконец один из пастухов спускается к воде и стоит там, наблюдая, пока капитан флота не садится в шлюпку и не подплывает к нему. Происходит обмен, в котором участвуют кольца из [ShowGoodsName('copper')], сушёная рыба и немало терпеливых жестов. К закату три головы скота уже в трюме. Мычание для каждого человека на флоте звучит прекраснейшей музыкой, какую они когда-либо слышали."
 cape_route_to_india_events.8.a: "Trade [ShowGoodsNameWithNoTooltip('copper')], [ShowGoodsNameWithNoTooltip('cloth')] for cattle; plant a #italic padrão#!."
 cape_route_to_india_events.8.a.morale_tt: "Morale among the crews rises greatly (#G +15#! Crew Morale)"
 cape_route_to_india_events.8.b: "Raise a #italic padrão#! and claim this land for [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.b.morale_tt: "Morale among the crews rises slightly (#G +8#! Crew Morale)"
 cape_route_to_india_events.8.c: "Дать людям отдохнуть и восстановить силы здесь, прежде чем двинуться на север."
 cape_route_to_india_events.8.c.morale_tt: "Morale among the crews rises noticeably (#G +10#! Crew Morale)"
 cape_route_to_india_events.8.d: "Вернуться домой."
 cape_route_to_india_events.8.historical_info: "Мосселбай был известен португальским морякам как #italic Bahia dos Vaqueiros#! (бухта Пастухов), а позднее — как #italic Aguada de São Brás#! (Водопой Святого Власия). Бартоломеу Диаш установил здесь каменный #italic padrão#! в 1488 году, а традицию эту продолжил Васко да Гама в 1497-м. Местные койкои поначалу охотно торговали с обеими экспедициями, но позже стали враждебны — людей Васко да Гамы забросали камнями, когда те попытались набрать пресной воды без должной платы."
 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "Золотой порт [ShowLocationNameWithNoTooltip('sofala')]"
 cape_route_to_india_events.9.desc: "Гавань [ShowLocationName('sofala')] полна дау. Это не те маленькие рыбацкие лодки, к которым флот привык вдоль южного побережья; это океанские суда из [ShowRegionName('arabia_region')] и [ShowRegionName('persia_region')], глубоко осевшие в воде под грузом [ShowGoodsName('ivory')], чёрного дерева и [ShowGoodsName('cloth')]. На набережной купцы ведут дела на [ShowLanguageName('arabic_language')] и на [location.GetDominantCulture.GetLanguage.GetName] — наречии, которое никто из толмачей флота распознать не может. Мелкие щепотки золотого песка переходят из рук в руки за штуки индийского хлопка.\n\nАрабские торговцы, веками властвовавшие в этом порту, наблюдают за прибытием [ROOT.GetCountry.GetAdjective] флота из-под навесов своих складов. Их лица непроницаемы, но язык тела не оставляет сомнений: появление этих чужаков с их железными пушками и крестами, намалёванными на парусах, не назовёшь отрадной новостью. Капитан флота отмечает про себя самые большие склады, расположение стоянок дау, глубину воды при входе в бухту."
 cape_route_to_india_events.9.a: "Build a major [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]; this gold will enrich [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.9.a.owned: "Pour investment into our post at [ShowLocationNameWithNoTooltip('sofala')] — this gold will make [ROOT.GetCountry.GetNameWithNoTooltip] rich."
 cape_route_to_india_events.9.b: "Выменять золотой песок и разузнать, что скрывается во внутренних землях."
 cape_route_to_india_events.9.c: "Собрать сведения и двигаться дальше — время дорого."
 cape_route_to_india_events.9.d: "Вернуться домой."
 cape_route_to_india_events.9.historical_info: "Софала была самым южным значимым портом суахилийской торговой сети, контролировавшим доступ к золотоносному царству #italic Мутапа #! (Великому Зимбабве) на плато к западу. Арабские купцы вели здесь торговлю по меньшей мере с десятого века. Португальцы захватили Софалу в 1505 году, разрушив арабскую торговую сеть и попытавшись направить золотую торговлю по собственным каналам — с переменным успехом, поскольку значительная часть торговли просто переместилась глубже во внутренние земли, вне их досягаемости."
 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "Остров [ShowLocationNameWithNoTooltip('mozambique')]"
 cape_route_to_india_events.10.desc: "Небольшой остров, не более трёх километров от края до края, отделённый от материка узким проливом, глубоким ровно настолько, чтобы пропускать морские суда. На острове возвышается каменная торговая застава под зелёным флагом, а гавань забита доу со всех концов [ShowContinentName('indian_ocean_continent')]. [ShowGoodsName('ivory')] и чёрное дерево текут из глубины материка, порабощённых мужчин и женщин ведут с материка, [ShowGoodsName('copper')] идёт с юга, а [ShowGoodsName('cloth')] и [ShowGoodsName('porcelain')] прибывают из $india$ и $china$ — и всё это переходит из рук в руки в торговой сети, действующей уже шесть столетий.\n\n[target_ruler_country.Custom('GetRulerOrRegentTitle')] богат и подозрителен. [ShowCultureGroupName('arabian_group')] купцы, прибывшие раньше флота, предупредили [target_ruler.GetHimHer], что чужаки — это [ROOT.GetCountry.GetReligion.GetAdjective] пираты, которые уничтожают всё, что не могут украсть. [target_ruler.GetHeShe|U] принимает посланника флота с настороженной учтивостью, в окружении вооружённой стражи, и задаёт множество вопросов о вооружении. [target_ruler.GetHerHis|U] собственное положение, в самом сердце гавани, окружённой пушечными позициями, не назовёшь удобным с точки зрения [ROOT.GetCountry.GetAdjective]."
 cape_route_to_india_events.10.a: "Bribe the [target_ruler_country.Custom('GetRulerOrRegentTitle')] with goods and buy the right to build."
 cape_route_to_india_events.10.b: "Договориться о торговых правах через дипломатию и подарки."
 cape_route_to_india_events.10.c: "Outbid the [ShowCultureGroupNameWithNoTooltip('arabian_group')] merchants and sway the [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.10.d: "Acknowledge the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s claim for now and press north."
 cape_route_to_india_events.10.f: "Установить #italic Сан-Жоржи падрáн#!."
 cape_route_to_india_events.10.e: "Вернуться домой."
 cape_route_to_india_events.10.historical_info: "Остров Мозамбик стал важнейшей базой Португалии в Восточной Африке, официально основанной в 1507 году. Форт Сан-Себастьян, построенный в XVI веке, остаётся одним из старейших сохранившихся европейских фортификационных сооружений в Африке южнее Сахары. Остров служил административной столицей Португальской Восточной Африки и перевалочным пунктом на пути в $india$ более двух столетий. Его захват фактически уничтожил арабский контроль над северной частью торговой сети суахилийского побережья."
 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "Ловушка у [ShowLocationNameWithNoTooltip('mombasa')]"
 cape_route_to_india_events.11.desc: "Входной канал [ShowLocationName('mombasa')] узок, не более двух кабельтовых в ширину, а по обоим берегам тянется возвышенность. Пока флот проходит через него, люди начинают чувствовать неладное — на набережной толкутся мужчины с чрезмерной беззаботностью тяжело вооружённых людей, которым велели выглядеть безоружными, доу стоит на якоре в странном месте, перекрывающем выход из канала, а посланник [target_ruler_country.Custom('GetRulerOrRegentTitle')] поднимается на флагман с пышной церемонией, подарками и слишком многими вопросами о числе вооружённых людей на борту.\n\nВ ту же ночь переводчик, состоящий на службе у флота, проскальзывает в капитанскую каюту. Перед тем как вернуться на берег, посланник [target_ruler_country.Custom('GetRulerOrRegentTitle')] говорил со своими спутниками на [location.GetDominantCulture.GetLanguage.GetName] — наречии, которое этот человек понимает. Слова были однозначны: флоту не дадут выйти из [ShowLocationNameWithNoTooltip('mombasa')]."
 cape_route_to_india_events.11.a: "Leave before dawn; this welcome is not worth the risk."
 cape_route_to_india_events.11.b: "Остаться и попытаться торговать, несмотря на явное напряжение."
 cape_route_to_india_events.11.c: "If they plan treachery, we shall act first; prepare the men."
 cape_route_to_india_events.11.d: "Вернуться домой — мы не станем рисковать флотом здесь."
 cape_route_to_india_events.11.historical_info: "Васко да Гама едва не попал в засаду в Момбасе в апреле 1498 года. Согласно португальским хроникам, местные лоцманы, приставленные султаном, пытались посадить флот на мель. Да Гама отступил прежде, чем ловушка захлопнулась. В последующие десятилетия португальцы неоднократно возвращались, чтобы бомбардировать и разграблять Момбасу. Форт Иисус, построенный в 1593 году, окончательно закрепил португальский контроль над гаванью — хотя город был захвачен оманцами в 1698 году после долгой осады."
 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "Дружелюбный [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
 cape_route_to_india_events.12.desc: "Всё в [ShowLocationName('malindi')] не похоже на то, что было раньше. [target_ruler.GetName], [target_ruler_country.Custom('GetRulerOrRegentTitle')], спускается к гавани [target_ruler.GetHerselfHimself], облачённый в белый и зелёный шёлк, в сопровождении музыкантов, играющих на инструменте, чью музыку никто из [ROOT.GetCountry.GetAdjective] прежде не слышал. [target_ruler.GetSheHe|U] уже знает о флоте от [target_ruler.GetHerHis] связных на юге и ждал их прибытия.\n\nУ [target_ruler.GetSheHe|U] есть дар, что стоит дороже слоновой кости: на службе у [target_ruler.GetHerHis] состоит человек — [target_ruler.GetSheHe] ходил в Каликут двенадцать раз. Человек, который знает каждое течение, каждый риф, каждую перемену ветра между этими берегами и Малабарским побережьем. Который знает, когда юго-западный муссон донесёт корабль через [ShowContinentName('indian_ocean_continent')] за три недели, а когда погубит тот же корабль за двадцать четыре часа. Имя лоцмана, поясняет [target_ruler.GetNameWithNoTooltip], трудно передать на европейском языке. Но [target_ruler.GetHerHis] знание передать легко, а цена этому знанию — дружба."
 cape_route_to_india_events.12.a: "Мы с радостью примем и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] лоцмана, и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] дружбу."
 cape_route_to_india_events.12.b: "[target_ruler_country.Custom('GetRulerOrRegentTitle')] получит от нас подарки, помощь и защиту."
 cape_route_to_india_events.12.c: "[ROOT.GetCountry.GetReligion.GetGodName|U] ждёт от нас свершений. Помолимся же перед отплытием!"
 cape_route_to_india_events.12.e: "Установить #italic падран Эшпириту Санту#! перед великим переходом."
 cape_route_to_india_events.12.d: "Вернёмся домой: до Каликута далеко, и путешествие обещает быть опасным."
 cape_route_to_india_events.12.historical_info: "Из-за давней вражды с Момбасой султан Малинди благоволил португальцам, надеясь, что они помогут ему получить перевес в затяжной борьбе. Личность знатока Индийского океана, предоставленного Васко да Гаме — в португальских источниках он известен как Малемо Канака, — долгие столетия оставалась предметом научных споров. Некоторые историки полагают, что это Ахмад ибн Маджид — величайший арабский лоцман XV века, автор целого ряда трудов о пересечении Индийского океана. Другие решительно отвергают эту теорию и считают, что речь идёт о гуджаратском купце. Кем этот человек был на самом деле, неизвестно до сих пор."
 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "Каликут — врата пряностей"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] больше [ROOT.GetCountry.GetCapital.GetName]. В гавани больше кораблей, чем офицеры флота могут сосчитать — суда из [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')] и [ShowAreaName('java_area')]. Целый связанный мир стянут сюда притяжением [ShowGoodsName('pepper')], корицы, кардамона и [ShowGoodsName('cloves')], и всё это течёт через этот порт. Флот бросает якорь на рейде, уже полном доу, а [ShowCultureGroupName('arabian_group')] купцы на набережной глядят во все глаза.\n\nЦелых два месяца они внушали [target_ruler_country.Custom('GetRulerOrRegentTitle')] — правителю Каликута, который правит из-за пышных церемониальных стен, — что эти чужаки не купцы, а пираты с холодного севера. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] согласился принять капитана флота, но [target_ruler.GetHerHis] [target_ruler_country.GetGovernment.GetCourtTitle|l] насторожен, а [target_ruler.GetHerHis] купцы нервничают. Воздух пахнет чёрным [ShowGoodsNameWithNoTooltip('pepper')] и солью моря, видевшего тысячу лет торговли. Всё, ради чего затевалось это плавание, решится в ближайший час."
 cape_route_to_india_events.13.a: "Пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] оценит наши товары, а после запросим факторию."
 cape_route_to_india_events.13.b: "Озвучим требования: фиксированные пошлины, защита и безопасная стоянка."
 cape_route_to_india_events.13.c: "Обвиним аравийских купцов во лжи. Пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] выбирает."
 cape_route_to_india_events.13.d: "Прислушаемся к совету лоцмана. Он и [target_ruler_country.GetGovernment.GetCourtTitle|l] — старые знакомые."
 cape_route_to_india_events.13.e: "Выставим #italic падран Сан-Габриела#! на всеобщее обозрение."
 cape_route_to_india_events.13.historical_info: "Кожикоде (известный европейцам как Каликут) был важнейшим портом торговли пряностями в Индийском океане. Правил им #italic самутири#! (заморин, или Владыка моря), тщательно поддерживавший равновесие между арабскими купцами, господствовавшими в торговле, соперничающими индийскими государствами и позднее прибывшими европейцами. Первый приём Васко да Гамы в 1498 году был неоднозначным: его дары сочли скудными, а арабские купцы успешно испортили отношения при дворе. Он отбыл с небольшим и малоценным грузом. Лишь в последующих плаваниях, подкреплённых угрозой португальских пушек, удалось добиться настоящих торговых соглашений."
 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "Золотой Берег"
 cape_route_to_india_events.14.desc: "Лес начинается день пути от побережья, а тропа между берегом и лесом хорошо утоптана. Караваны прибывают на пляж два, а то и три раза в неделю: носильщики несут кожаные мешочки с золотым песком, промытым из речной гальки в глубине страны, где короли [ShowCultureName('akan')] держат под контролем места промывки и торгуют излишками через сеть купцов-ванкара, существующую уже четыре столетия.\n\n[ROOT.GetCountry.GetAdjective] слышали об этом месте. Каждый капитан из [ShowCultureGroupName('arabian_group')], торговавший у этих берегов, говорил о рынках Золотого Берега как о самом прибыльном участке Гвинейского побережья. Здешние люди уже видели чужие корабли. Они не боятся. Они прикидывают, чего стоят новоприбывшие."
 cape_route_to_india_events.14.a: "Воздвигнем форт Сан-Жоржи-да-Мина, и аканы будут торговать с его комендантом."
 cape_route_to_india_events.14.a.owned: "Укрепим форт Сан-Жоржи-да-Мина: аканы уже торгуют с нашим государством."
 cape_route_to_india_events.14.b: "Договоримся о пленных, которых аканы берут в качестве военной дани."
 cape_route_to_india_events.14.c: "Нападём на поселение, пока вангарские купцы не отбыли."
 cape_route_to_india_events.14.d: "Подумаем потом, а пока двинемся на юг. Медлить нельзя."
 cape_route_to_india_events.14.e: "Вернуться домой. Одного золота довольно, чтобы оправдать плавание."
 cape_route_to_india_events.14.historical_info: "В 1482 году португальцы возвели Сан-Жоржи-да-Мину (форт Эльмина) на Золотом Берегу, используя камень, добытый на соседнем мысе, и брёвна, заранее заготовленные в Португалии и погруженные на корабли специально для этой цели. Форт был построен за считанные недели — отчасти благодаря переговорам с местным вождём по имени Караманса, отчасти внезапностью действий. Изначально он предназначался для контроля над золотой торговлей с лесными царствами акан. Спустя десятилетия крепость стала главным узлом атлантической работорговли, принимая пленников из внутренних войн и отправляя их на запад — на сахарные плантации Сан-Томе, а позднее в Бразилию. Историк Уолтер Родни оценивал, что торговля на Золотом Берегу приносила Португалии несколько сотен тысяч золотых крузаду в год, пока работорговля не вытеснила золото как главный товар."
 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "Остров Фернан-ду-По"
 cape_route_to_india_events.15.desc: "Из Гвинейского залива поднимается остров: вулканический пик, с вершины которого стелется облако, весь покрытый джунглями до самой воды. Народ [ShowCultureName('bubi_culture')], живущий здесь, никогда прежде не видел европейцев. Они наблюдают из-за кромки леса, как флот бросает якорь в естественной бухте и спускает шлюпку.\n\nИсследователь, давший этому острову своё имя, проходил здесь поколение назад и грубо начертил его на картах. У лоцмана флота есть эта карта. Чего на ней нет — так это ответа на вопрос, стоит ли останавливаться на этом острове."
 cape_route_to_india_events.15.desc.owned: "Остров поднимается из моря всё так же — вулканический пик, стелющееся облако, джунгли, теснящиеся до самой воды, — но над якорной стоянкой внизу уже реет наш флаг, а шлюпки, вышедшие навстречу флоту, — наши собственные.\n\n[target_leader.GetName] не нужно гадать, стоит ли останавливаться на этом острове. Вопрос теперь лишь в том, сколько ещё можно извлечь из плацдарма, который [ROOT.GetCountry.GetNameWithNoTooltip] уже удерживает здесь, на пути торговли через [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
 cape_route_to_india_events.15.a: "Учредим на острове форпост и будем управлять торговлей в Гвинейском заливе."
 cape_route_to_india_events.15.a.owned: "Укрепим форпост на острове: мы уже установили контроль над торговлей в Гвинейском заливе."
 cape_route_to_india_events.15.b: "Воздвигнем #italic падран#!, нанесём остров на карту и присвоим его себе."
 cape_route_to_india_events.15.c: "Починим донья, наполним бочки и запасёмся провизией."
 cape_route_to_india_events.15.c.tt: "Корпуса чистят и смолят, так что в этом путешествии корабельные черви флоту не страшны"
 cape_route_to_india_events.15.d: "Вернуться домой. [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] — довод достаточный."
 cape_route_to_india_events.15.historical_info: "Остров Фернандо-По (современный Биоко) был открыт португальским мореплавателем Фернаном ду По около 1472 года — он стал первым европейцем, увидевшим этот остров. Коренной народ буби жил здесь в изоляции на протяжении веков, переселившись с материка задолго до этого. Португальцы использовали остров как перевалочный пункт, но не сумели закрепиться там надолго — отчасти из-за тропических болезней, отчасти из-за сопротивления буби всяким контактам. В последующие века остров неоднократно переходил из рук в руки; по договору в Эль-Пардо 1778 года Португалия уступила его Испании в обмен на территориальные уступки в Южной Америке, и в итоге он вошёл в состав современной Экваториальной Гвинеи."
 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "Город султана морей"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] крупнее, чем мы ожидали. Городская гавань заполнена индийскими и #TOOLTIP:REGION,arabia_region,X #L аравийскими#!#! дау: их трюмы ломятся от #TOOLTIP:GOODS,cloth,X #L текстиля#!#!, #TOOLTIP:GOODS,copper,X #L меди#!#! и #TOOLTIP:GOODS,porcelain,X фарфора#!. [ShowLocationNameWithNoTooltip('mogadishu')] правит [target_owner.Custom('GetRulerOrRegentTitle')|l]: этот человек, которого назначает [target_owner.GetName], руководит торговлей между #TOOLTIP:CULTURE,$somali_culture_tt$,X #L сомалийцами#!#! и внешним миром. Купцы, собравшиеся на пристани, оценивающе разглядывают наши суда. Мы не первые чужаки, прибывшие сюда под незнакомыми флагами и с диковинными товарами, но, возможно, из столь далёких западных земель сюда ещё никто не добирался."
 cape_route_to_india_events.16.a: "Будем торговать с сомалийскими купцами. Для нас важны любые связи."
 cape_route_to_india_events.16.b: "Понаблюдаем и двинемся на север. В конце концов, наша цель — $india$."
 cape_route_to_india_events.16.c: "Повернём назад. Путь нам неизвестен, а провизия на исходе."
 cape_route_to_india_events.16.historical_info: "Могадишо был одним из старейших и богатейших городов восточноафриканского побережья, с непрерывной историей торговли, уходящей корнями за много веков до прихода португальцев. Арабские географы упоминали его как крупный порт уже в девятом веке. Ко времени похода да Гамы городом правил султанат, входивший в торговую сеть Суахилийского побережья, связывавшую внутренние области Африки с Аравией, Персией и Индийским субконтинентом. Решение португальцев обходить или принуждать эти суахилийские города-государства ради установления собственной торговой монополии привело их к прямому столкновению с уже существующей и весьма эффективной торговой системой."
 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "Ибадитский порт"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] поднимается из красных скал, а запах моря здесь иной — суше, острее, с привкусом пыли и [ShowGoodsName('salt')] одновременно. Гавань — одна из лучших на [ShowProvinceDefinitionName('arabian_sea_province')], довольно глубокая для крупных судов и укрытая от юго-западного муссона. Купцы [ShowCultureName('omani_culture')] плавают в $india$ уже тысячу лет. Люди на набережной знают маршруты, ветра и сроки. Они знают, когда выходить в море, а когда ждать. Они смотрят на нас и гадают, чего мы хотим."
 cape_route_to_india_events.17.a: "Разыщем оманские власти и представимся им."
 cape_route_to_india_events.17.b: "Приобретём карты в Индию у аравийских лоцманов."
 cape_route_to_india_events.17.c: "Пополним запасы и отчалим. Оманские моряки нам не друзья."
 cape_route_to_india_events.17.d: "Повернуть назад. Переход в $india$ нам не по силам."
 cape_route_to_india_events.17.historical_info: "Маскат был ключевым портом ибадитского имамата Оман — одной из крупнейших морских держав в западной части Индийского океана. Оманские моряки превосходно знали судоходные маршруты и расписание муссонных ветров, ведь от этого зависела продолжительность путешествий между Аравией и Индийским макрорегионом. Прибытие португальцев подставило под удар посредническую роль оманцев в торговле пряностями: отношения этих двух народов оставались напряжёнными в течение почти всего XVI столетия, и в итоге конфликт вылился в череду войн за контроль над Персидским заливом и восточно-африканскими портами. В XVII веке оманцы вытеснили португальцев из большинства своих оплотов в Восточной Африке."
 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "Португальцы построили фейторию"
 cape_route_to_india_events.18.desc: "Португальцы застали нас врасплох. Они бросили якоря на внешнем рейде и направили артиллерию на гавань. Их просьба, вежливая по форме, по сути была безапелляционной. Они хотят построить факторию. Они согласны платить небольшой налог. Они будут уважать местные законы. Они не упомянули, что произойдёт, если мы им откажем, но этого и не потребовалось. Древесину португальцы заготовили заранее и привезли в трюмах. Факторию возвели за считаные дни. Теперь там, где прежде развевалось наше знамя, красуется #L [por_feitoria_builder.GetAdjective|l]ий#! крест."
 cape_route_to_india_events.18.a: "У нас нет выбора: против пушек не попрёшь."
 cape_route_to_india_events.18.b: "Мы протестуем: наш суверенитет надо уважать."
 cape_route_to_india_events.18.historical_info: "Португальская система фейторий стала одним из первых примеров европейского торгового империализма в Азии и Африке. Основывая укреплённые торговые фактории в уже существующих гаванях, Португалия получала доступ к сложившимся торговым сетям, не неся издержек полного территориального завоевания. Местные правители, соглашавшиеся на такие условия, получали доступ к португальским товарам и морскую защиту от соперников; те же, кто отказывался, подвергались обстрелу. Эта система превратила Индийский океан из сравнительно открытого торгового пространства в пространство, выстроенное вокруг португальского морского господства и торговой монополии Casa da Índia."
 cape_route_to_india_events.provisioned_25_tt: "Флот полностью обеспечен припасами, и экипажи будут легче переносить дальнейшее путешествие (#G +25#! к провизии)"
 cape_route_to_india_events.provisioned_30_tt: "Флот полностью обеспечен припасами, и экипажи будут легче переносить дальнейшее путешествие (#G +30#! к провизии)"
 cape_route_to_india_events.provisioned_40_tt: "Флот полностью обеспечен припасами, и экипажи будут легче переносить дальнейшее путешествие (#G +40#! к провизии)"
