l_russian:
 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "Флот выходит в море"
 cape_route_to_india_events.1.a: "Если будет угодно [ROOT.GetCountry.GetReligion.GetGodName|U], мы вернёмся с трюмами, полными пряностей."
 cape_route_to_india_events.1.b: "Помолимся — а затем отправимся в путь со всей поспешностью."
 cape_route_to_india_events.1.historical_info: "Португальская экспедиция в поисках морского пути в $india$ стала итогом почти столетия постепенных исследований африканского побережья, продвигавшихся всё дальше на юг. Бартоломеу Диаш обогнул мыс Доброй Надежды в 1488 году, доказав, что такой путь возможен. Плавание Васко да Гамы в 1497–99 годах завершило эту миссию: экспедиция вернулась с грузом перца и специй, окупившим себя в шестьдесят раз. Это плавание коренным образом изменило мировую торговлю пряностями, разрушив венецианскую и османскую монополию на сухопутные маршруты."
 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "Острова [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.2.a: "Invest here — expand the settlement that anchors our southern route."
 cape_route_to_india_events.2.b: "Пополнить запасы, взять свежую воду и отправиться дальше."
 cape_route_to_india_events.2.c: "Идти дальше — мы не можем позволить себе задерживаться так рано."
 cape_route_to_india_events.2.d: "Вернуться домой."
 cape_route_to_india_events.2.historical_info: "Острова Кабо-Верде были открыты португальскими мореплавателями около 1456 года и постоянно заселены с 1462 года. Благодаря их положению в Атлантике — на пути северо-восточных пассатов — они стали важнейшим перевалочным пунктом для плаваний в Южную Америку и вокруг Африки. Их стратегическое значение значительно возросло после того, как плавание Васко да Гамы доказало возможность пути через Индийский океан. К шестнадцатому веку они превратились в важный узел атлантической работорговли."
 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "Остров [ShowLocationNameWithNoTooltip('sao_tome')]"
 cape_route_to_india_events.3.desc_common: "Жара возвещает о себе прежде, чем покажется берег: влажная, удушающая стена опускается на палубу в тот самый миг, когда флот пересекает экватор, заставляя людей задыхаться в воздухе, который никогда не становится прохладнее. [ShowLocationName('sao_tome')] поднимается из утреннего тумана, точно тёмно-зелёная корона: две вершины, окутанные облаками, и водопады, пробивающиеся сквозь лес, столь густой, что свет не достигает земли."
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nA settlement already clings to the western shore, beneath a flag that is not ours — wharves, a chapel, the first raw cane-fields of a rival crown that reached this fertile island ahead of [ROOT.GetCountry.GetName]. The soil is every bit as rich as the stories promised, but it is already spoken for. Whatever we want of [ShowLocationNameWithNoTooltip('sao_tome')] must now be taken, or bargained, from another's hand."
 cape_route_to_india_events.3.a: "Establish a trading post — this island's potential is worth the investment."
 cape_route_to_india_events.3.b: "Plant a #italic padrão#! on the high point and claim the island formally."
 cape_route_to_india_events.3.c: "Взять пресной воды и идти на юг."
 cape_route_to_india_events.3.d: "Вернуться домой."
 cape_route_to_india_events.3.historical_info: "Сан-Томе был необитаем, когда около 1470 года туда прибыли португальские мореплаватели. Его экваториальный климат оказался губительным для европейских поселенцев — смертность от болезней была высокой, — но чрезвычайно благоприятным для выращивания сахарного тростника. К 1520-м годам Сан-Томе стал крупнейшим в мире производителем сахарного тростника, который возделывали почти исключительно порабощённые африканцы. Позднее остров превратился в крупный перевалочный пункт атлантической работорговли — роль, которую он сохранял более двух столетий."
 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "Устье великой реки"
 cape_route_to_india_events.4.a: "Seek an audience with the great king of this land."
 cape_route_to_india_events.4.b: "Trade for [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')], and whatever else they will offer."
 cape_route_to_india_events.4.c: "Chart the river mouth and press south — we must not be delayed."
 cape_route_to_india_events.4.d: "Вернуться домой."
 cape_route_to_india_events.4.historical_info: "Королевство Конго было одним из наиболее развитых политических образований Африки южнее Сахары, контролировавшим территории на землях современных Конго, Анголы и Габона. Маниконго (король) правил через иерархическую бюрократию и поддерживал развитую систему провинциального управления. В 1480-х годах португальские миссионеры установили контакт с королевством, положив начало отношениям, которые окажутся судьбоносными — а в конечном счёте катастрофическими — для обеих сторон. В 1490-х годах королевство приняло христианство, и маниконго принял имя Жуан I."
 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
 cape_route_to_india_events.5.a: "Возвести здесь крупную [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — ей не будет равных."
 cape_route_to_india_events.5.b: "Основать здесь небольшую торговую факторию и склад."
 cape_route_to_india_events.5.c: "Note its position carefully on the charts and continue south."
 cape_route_to_india_events.5.d: "Вернуться домой."
 cape_route_to_india_events.5.historical_info: "Луанда была официально основана как португальская колония в 1575 году Паулу Диашем де Новайшем, что делает её одним из старейших европейских поселений в Африке южнее Сахары. Её естественная гавань на протяжении более четырёх веков служила главным портом португальской Анголы. Начиная с XVI века Луанда стала основным пунктом отправки трансатлантической торговли рабами в южной Африке, откуда миллионы порабощённых людей отправлялись в Бразилию и на Карибы."
 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "Пустынное побережье"
 cape_route_to_india_events.6.desc: "The desert comes to the sea here, red dunes rising directly from the surf-line, their crests streaming sand into the air. There are no trees. There is no fresh water visible. The coast to the north — the men are already calling it the [ShowProvinceDefinitionName('skeleton_coast_province')], for the whale bones bleaching on the beach — shows no sign of human habitation for hundreds of miles in any direction.\n\nAnd yet the bay is calm. Sheltered from the worst of the swells, it offers the fleet a chance to repair a damaged mast and refill the water from a brackish spring in the dunes. On the headland above, the ship's navigator is measuring the angle of the sun with his instruments and making notes. The Cape, he says, is no more than a week's sailing to the south. Some of the men cross themselves."
 cape_route_to_india_events.6.a: "Rally the men — the Cape of Good Hope lies within reach. Forward!"
 cape_route_to_india_events.6.b: "These currents and winds tell a navigator much — let me read them."
 cape_route_to_india_events.6.c: "Let the men rest here. They will need strength for the storms ahead."
 cape_route_to_india_events.6.d: "Вернуться домой — это побережье слишком безлюдно, чтобы идти дальше."
 cape_route_to_india_events.6.historical_info: "Побережье Намибии было известно португальским морякам как #italic Costa dos Esqueletos#! (Берег Скелетов) из-за обилия костей китов и тюленей, а также обломков кораблей, выброшенных на подветренный берег мощными юго-западными ветрами. Уолфиш-Бей, названный голландцами #italic Walvischbaai#! (Китовая бухта), был одной из немногих укрытых якорных стоянок на этом враждебном отрезке побережья. Бартоломеу Диаш останавливался здесь в 1488 году во время своего плавания на юг."
 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "Мыс Бурь"
 cape_route_to_india_events.7.a: "Назвать его мысом Доброй Надежды и без промедления идти на восток!"
 cape_route_to_india_events.7.b: "Укрыться под защитой мыса, пока не пройдёт шторм."
 cape_route_to_india_events.7.d: "We have done enough — the Cape has been rounded. Turn for home."
 cape_route_to_india_events.7.historical_info: "#italic Bartolomeu Dias#! first rounded the Cape in 1488, naming it #italic Cabo das Tormentas#! (Cape of Storms). According to Portuguese sources, King João II renamed it #italic Cabo da Boa Esperança#! (Cape of Good Hope) to encourage future expeditions, though this account may be apocryphal. The Cape is not the southernmost point of Africa — that distinction belongs to Cape Agulhas, some two hundred kilometers to the east — but it marks the meeting point of the Atlantic and Indian Oceans and the door to the east."
 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "Бухта Пастухов"
 cape_route_to_india_events.8.desc: "The bay is calm and beautiful, sheltered from the south-west by a low headland. Milkwood trees provide welcome shade along the shore. And on the hillside above the beach — cattle. Fat, healthy cattle grazing in enormous herds, tended by tall people wearing ochre and glass beads who have been watching the fleet from a safe distance since it anchored.\n\nSome of the men are near tears at the sight of fresh meat. They have been living on salt fish and hard biscuit for weeks. Eventually one of the herders walks down to the waterline and stands there, watching, until the fleet's captain climbs into a longboat and rows to meet him. An exchange takes place that involves copper rings, dried fish, and a great deal of patient gesture. By nightfall, three cattle are in the hold. The sound of lowing is, to every man on the fleet, the most beautiful noise they have ever heard."
 cape_route_to_india_events.8.a: "Trade [ShowGoodsNameWithNoTooltip('copper')] and [ShowGoodsNameWithNoTooltip('cloth')] for cattle and plant a #italic padrão#! to mark our claim."
 cape_route_to_india_events.8.b: "Erect a stone #italic padrão#! and formally claim this land for [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.c: "Дать людям отдохнуть и восстановить силы здесь, прежде чем двинуться на север."
 cape_route_to_india_events.8.d: "Вернуться домой."
 cape_route_to_india_events.8.historical_info: "Мосселбай был известен португальским морякам как #italic Bahia dos Vaqueiros#! (бухта Пастухов), а позднее — как #italic Aguada de São Brás#! (Водопой Святого Власия). Бартоломеу Диаш установил здесь каменный #italic padrão#! в 1488 году, а традицию эту продолжил Васко да Гама в 1497-м. Местные койкои поначалу охотно торговали с обеими экспедициями, но позже стали враждебны — людей Васко да Гамы забросали камнями, когда те попытались набрать пресной воды без должной платы."
 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "Золотой порт [ShowLocationNameWithNoTooltip('sofala')]"
 cape_route_to_india_events.9.a: "Establish a major [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — this gold will make [ROOT.GetCountry.GetNameWithNoTooltip] rich."
 cape_route_to_india_events.9.b: "Выменять золотой песок и разузнать, что скрывается во внутренних землях."
 cape_route_to_india_events.9.c: "Собрать сведения и двигаться дальше — время дорого."
 cape_route_to_india_events.9.d: "Вернуться домой."
 cape_route_to_india_events.9.historical_info: "Софала была самым южным значимым портом суахилийской торговой сети, контролировавшим доступ к золотоносному царству #italic Мутапа #! (Великому Зимбабве) на плато к западу. Арабские купцы вели здесь торговлю по меньшей мере с десятого века. Португальцы захватили Софалу в 1505 году, разрушив арабскую торговую сеть и попытавшись направить золотую торговлю по собственным каналам — с переменным успехом, поскольку значительная часть торговли просто переместилась глубже во внутренние земли, вне их досягаемости."
 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "Остров [ShowLocationNameWithNoTooltip('mozambique')]"
 cape_route_to_india_events.10.desc: "A small island, no more than three kilometers from end to end, separated from the mainland by a narrow channel just deep enough for ocean-going ships. The island is dominated by a stone trading post flying a green flag, and the harbor is packed with dhows from all corners of the [ShowContinentName('indian_ocean_continent')]. [ShowGoodsName('ivory')] and ebony flow down from the interior, enslaved men and women are marched in from the mainland, [ShowGoodsName('copper')] comes up from the south, and [ShowGoodsName('cloth')] and [ShowGoodsName('porcelain')] arrive from $india$ and $china$ — all of it changing hands in a trading network that has functioned for six centuries.\n\nThe [target_ruler_country.Custom('GetRulerOrRegentTitle')] is wealthy and suspicious. Arab merchants who arrived ahead of the fleet have warned [target_ruler.GetHimHer] that the strangers are [ROOT.GetCountry.GetReligion.GetAdjective] pirates who destroy what they cannot steal. [target_ruler.GetHeShe|U] receives the fleet's envoy with careful courtesy, surrounded by armed guards, and asks many questions about armaments. [target_ruler.GetHerHis|U] own position, in the heart of a harbor ringed by cannon-points, is not what the [ROOT.GetCountry.GetAdjective] would call comfortable."
 cape_route_to_india_events.10.a: "Bribe the [target_ruler_country.Custom('GetRulerOrRegentTitle')] with goods from our hold and buy the right to build here."
 cape_route_to_india_events.10.b: "Договориться о торговых правах через дипломатию и подарки."
 cape_route_to_india_events.10.c: "Outmaneuver the Arab merchants — offer the [target_ruler_country.Custom('GetRulerOrRegentTitle')] terms they cannot match."
 cape_route_to_india_events.10.d: "Acknowledge the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s position for now and continue north."
 cape_route_to_india_events.10.f: "Установить #italic Сан-Жоржи падрáн#!."
 cape_route_to_india_events.10.e: "Вернуться домой."
 cape_route_to_india_events.10.historical_info: "Остров Мозамбик стал важнейшей базой Португалии в Восточной Африке, официально основанной в 1507 году. Форт Сан-Себастьян, построенный в XVI веке, остаётся одним из старейших сохранившихся европейских фортификационных сооружений в Африке южнее Сахары. Остров служил административной столицей Португальской Восточной Африки и перевалочным пунктом на пути в $india$ более двух столетий. Его захват фактически уничтожил арабский контроль над северной частью торговой сети суахилийского побережья."
 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "Ловушка у [ShowLocationNameWithNoTooltip('mombasa')]"
 cape_route_to_india_events.11.desc: "[ShowLocationName('mombasa')]'s entrance channel is narrow, no more than two cables wide, with high ground on either shore. As the fleet passes through, the men begin to sense something is wrong — men loitering along the waterfront with the excessive casualness of heavily armed men who have been told to appear unarmed, a dhow anchored in an odd position that would block the channel exit, and the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy who boards the flagship with elaborate ceremony, gifts, and too many questions about the number of fighting men aboard.\n\nThat night, an interpreter employed by the fleet slips into the captain's cabin. Before returning ashore, the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy spoke to his companions in a dialect the man understands. The words were unambiguous: the fleet is not to leave [ShowLocationNameWithNoTooltip('mombasa')]."
 cape_route_to_india_events.11.a: "Leave quietly before dawn — this man's hospitality is not worth the risk."
 cape_route_to_india_events.11.b: "Остаться и попытаться торговать, несмотря на явное напряжение."
 cape_route_to_india_events.11.c: "If they plan treachery, we shall act first — prepare the men."
 cape_route_to_india_events.11.d: "Вернуться домой — мы не станем рисковать флотом здесь."
 cape_route_to_india_events.11.historical_info: "Васко да Гама едва не попал в засаду в Момбасе в апреле 1498 года. Согласно португальским хроникам, местные лоцманы, приставленные султаном, пытались посадить флот на мель. Да Гама отступил прежде, чем ловушка захлопнулась. В последующие десятилетия португальцы неоднократно возвращались, чтобы бомбардировать и разграблять Момбасу. Форт Иисус, построенный в 1593 году, окончательно закрепил португальский контроль над гаванью — хотя город был захвачен оманцами в 1698 году после долгой осады."
 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "Дружелюбный [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
 cape_route_to_india_events.12.desc: "Everything about [ShowLocationName('malindi')] is different from what came before. [target_ruler.GetName], the [target_ruler_country.Custom('GetRulerOrRegentTitle')], comes down to the harbor [target_ruler.GetHerselfHimself], dressed in white and green silk, attended by musicians playing an instrument that produces music none of the [ROOT.GetCountry.GetAdjective] have ever heard. [target_ruler.GetSheHe|U] has word of the fleet from [target_ruler.GetHerHis] contacts to the south and has been expecting their arrival.\n\n[target_ruler.GetSheHe|U] has a gift that is worth more than ivory: in [target_ruler.GetHerHis] employ [target_ruler.GetSheHe] has a man who has sailed to Calicut twelve times. A man who knows every current, every reef, every wind shift between here and the Malabar coast. Who knows when the south-west monsoon will carry a ship across the [ShowContinentName('indian_ocean_continent')] in three weeks and when it will kill the same ship in twenty-four hours. The pilot's name, [target_ruler.GetName] explains, is hard to render in a European tongue. But [target_ruler.GetHerHis] knowledge is not, and the price of that knowledge is friendship."
 cape_route_to_india_events.12.a: "Accept [target_ruler.GetNameWithNoTooltip]'s friendship and [target_ruler.GetHerHis] gift of a pilot — we will honor it."
 cape_route_to_india_events.12.b: "Formalize this friendship: gifts, a presence here, and protection for the [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.12.c: "Let us pray together before the final crossing — [ROOT.GetCountry.GetReligion.GetGodName|U] brought us to this moment."
 cape_route_to_india_events.12.e: "Установить #italic падран Эшпириту Санту#! перед великим переходом."
 cape_route_to_india_events.12.d: "Return home — Calicut is too far, and the crossing too dangerous."
 cape_route_to_india_events.12.historical_info: "The Sultan of Malindi maintained a long rivalry with Mombasa and was therefore well-disposed toward the Portuguese, who arrived as potential counterweights to his enemies. The Indian Ocean pilot he provided to Vasco da Gama — referred to in Portuguese sources as #italic Malemo Canaca#! — has been the subject of scholarly debate for centuries. Some historians identify him with #italic Ahmad ibn Majid#!, the greatest Arab navigator of the fifteenth century and author of several works on Indian Ocean navigation. Others argue the identification is incorrect and the pilot was a Gujarati merchant. His identity remains uncertain."
 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "Каликут — врата пряностей"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] is larger than [ROOT.GetCountry.GetCapital.GetName]. The harbor contains more ships than the fleet's officers can count — vessels from [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')], and [ShowAreaName('java_area')]. A whole connected world has been drawn together by the magnetic pull of [ShowGoodsName('pepper')], cinnamon, cardamom, and [ShowGoodsName('cloves')], and all of it flows through this port. The fleet drops anchor in a roadstead already crowded with dhows as Arab merchants on the waterfront stare.\n\nFor two months they have been telling the [target_ruler_country.Custom('GetRulerOrRegentTitle')] — Calicut's ruler, who governs from behind elaborate ceremonial walls — that these newcomers are pirates from the cold north, not merchants. The [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] has agreed to receive the fleet's captain, but [target_ruler.GetHerHis] court is wary and [target_ruler.GetHerHis] merchants nervous. The air smells of black [ShowGoodsNameWithNoTooltip('pepper')] and the salt of a sea that has seen a thousand years of trade. Everything the voyage was for comes down to what is said in the next hour."
 cape_route_to_india_events.13.a: "Lay our finest goods before the [target_ruler_country.Custom('GetRulerOrRegentTitle')] and negotiate a trading post."
 cape_route_to_india_events.13.b: "Propose a treaty: fixed duties, guaranteed anchorage, mutual protection."
 cape_route_to_india_events.13.c: "Call the Arab merchants liars, and demand the [target_ruler_country.Custom('GetRulerOrRegentTitle')] choose."
 cape_route_to_india_events.13.d: "Our pilot knows this court. His counsel guides our opening words."
 cape_route_to_india_events.13.e: "Plant the #italic São Gabriel padrão#!, and let all see who reached this shore."
 cape_route_to_india_events.13.historical_info: "Кожикоде (известный европейцам как Каликут) был важнейшим портом торговли пряностями в Индийском океане. Правил им #italic самутири#! (заморин, или Владыка моря), тщательно поддерживавший равновесие между арабскими купцами, господствовавшими в торговле, соперничающими индийскими государствами и позднее прибывшими европейцами. Первый приём Васко да Гамы в 1498 году был неоднозначным: его дары сочли скудными, а арабские купцы успешно испортили отношения при дворе. Он отбыл с небольшим и малоценным грузом. Лишь в последующих плаваниях, подкреплённых угрозой португальских пушек, удалось добиться настоящих торговых соглашений."
 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "Золотой Берег"
 cape_route_to_india_events.14.desc: "The forest begins a day's walk from the shoreline, and the path between coast and forest is well worn. Caravans arrive at the beach two, three times a week: porters carrying leather pouches of gold dust, ground from river gravels in the interior where the [ShowCultureName('akan')] kings control the washing sites and trade their surplus through a network of Wangara merchants that stretches back four centuries.\n\nThe [ROOT.GetCountry.GetAdjective] have heard of this place. Every Arab captain who traded along these shores spoke of the Gold Coast's markets as the most productive stretch of the Guinea littoral. The people here have seen foreign ships before. They are not afraid. They are calculating what the newcomers are worth."
 cape_route_to_india_events.14.a: "Build the São Jorge da Mina fort. The [ShowCultureNameWithNoTooltip('akan')] will sell to whoever holds it."
 cape_route_to_india_events.14.b: "Negotiate for captives the [ShowCultureNameWithNoTooltip('akan')] take as tribute in their wars."
 cape_route_to_india_events.14.c: "Storm the settlement before the Wangara merchants can depart."
 cape_route_to_india_events.14.d: "Note the trade volume and press south. There is no time to linger."
 cape_route_to_india_events.14.e: "Вернуться домой. Одного золота довольно, чтобы оправдать плавание."
 cape_route_to_india_events.14.historical_info: "В 1482 году португальцы возвели Сан-Жоржи-да-Мину (форт Эльмина) на Золотом Берегу, используя камень, добытый на соседнем мысе, и брёвна, заранее заготовленные в Португалии и погруженные на корабли специально для этой цели. Форт был построен за считанные недели — отчасти благодаря переговорам с местным вождём по имени Караманса, отчасти внезапностью действий. Изначально он предназначался для контроля над золотой торговлей с лесными царствами акан. Спустя десятилетия крепость стала главным узлом атлантической работорговли, принимая пленников из внутренних войн и отправляя их на запад — на сахарные плантации Сан-Томе, а позднее в Бразилию. Историк Уолтер Родни оценивал, что торговля на Золотом Берегу приносила Португалии несколько сотен тысяч золотых крузаду в год, пока работорговля не вытеснила золото как главный товар."
 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "Остров Фернан-ду-По"
 cape_route_to_india_events.15.desc: "An island rises from the Gulf of Guinea: a volcanic peak trailing cloud from its summit, dense with jungle to the water's edge. The Bubi people who live here have seen no Europeans before. They watch from the tree line as the fleet drops anchor in a natural bay, and a boat is lowered.\n\nThe explorer who gave this island his name passed this way a generation ago and drew it roughly in the charts. The fleet's pilot has that chart. What it does not show is whether the island is worth stopping for."
 cape_route_to_india_events.15.a: "Establish a post here. The island sits astride the [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
 cape_route_to_india_events.15.b: "Plant a #italic padrão#!, record the island on our charts, and claim it for the Crown."
 cape_route_to_india_events.15.c: "Take on fresh water and continue south. The island offers nothing we need."
 cape_route_to_india_events.15.d: "Вернуться домой. [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] — довод достаточный."
 cape_route_to_india_events.15.historical_info: "Остров Фернандо-По (современный Биоко) был открыт португальским мореплавателем Фернаном ду По около 1472 года — он стал первым европейцем, увидевшим этот остров. Коренной народ буби жил здесь в изоляции на протяжении веков, переселившись с материка задолго до этого. Португальцы использовали остров как перевалочный пункт, но не сумели закрепиться там надолго — отчасти из-за тропических болезней, отчасти из-за сопротивления буби всяким контактам. В последующие века остров неоднократно переходил из рук в руки; по договору в Эль-Пардо 1778 года Португалия уступила его Испании в обмен на территориальные уступки в Южной Америке, и в итоге он вошёл в состав современной Экваториальной Гвинеи."
 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "Город султана морей"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] is larger than we expected. The harbor is busy with dhows from [ShowRegionName('arabia_region')] and $india$, their holds full of [ShowGoodsName('cloth')], [ShowGoodsName('copper')], and [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] is ruled by a sultan who governs the trade between the [ShowCultureName('somali_culture')] interior and the wider ocean world. Merchants on the waterfront regard our ships with a calculating eye. We are not the first strangers to arrive here with strange sails and strange goods, but we may be the first to have come from so far west."
 cape_route_to_india_events.16.a: "Trade with the [ShowCultureNameWithNoTooltip('somali_culture')] merchants. Every contact here is worth making."
 cape_route_to_india_events.16.b: "Observe, record, and move north. We came to find $india$, not to linger here."
 cape_route_to_india_events.16.c: "Turn back. The route ahead is unknown and our provisions will not last."
 cape_route_to_india_events.16.historical_info: "Могадишо был одним из старейших и богатейших городов восточноафриканского побережья, с непрерывной историей торговли, уходящей корнями за много веков до прихода португальцев. Арабские географы упоминали его как крупный порт уже в девятом веке. Ко времени похода да Гамы городом правил султанат, входивший в торговую сеть Суахилийского побережья, связывавшую внутренние области Африки с Аравией, Персией и Индийским субконтинентом. Решение португальцев обходить или принуждать эти суахилийские города-государства ради установления собственной торговой монополии привело их к прямому столкновению с уже существующей и весьма эффективной торговой системой."
 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "Ибадитский порт"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] поднимается из красных скал, а запах моря здесь иной — суше, острее, с привкусом пыли и [ShowGoodsName('salt')] одновременно. Гавань — одна из лучших на [ShowProvinceDefinitionName('arabian_sea_province')], довольно глубокая для крупных судов и укрытая от юго-западного муссона. Купцы [ShowCultureName('omani_culture')] плавают в $india$ уже тысячу лет. Люди на набережной знают маршруты, ветра и сроки. Они знают, когда выходить в море, а когда ждать. Они смотрят на нас и гадают, чего мы хотим."
 cape_route_to_india_events.17.a: "Seek an audience with the [ShowCultureNameWithNoTooltip('omani_culture')] authorities and announce our presence."
 cape_route_to_india_events.17.b: "Pay Arab navigators for their charts and knowledge of the crossing to $india$."
 cape_route_to_india_events.17.c: "Resupply quickly and leave. The [ShowCultureNameWithNoTooltip('omani_culture')] sailors are no friends of ours."
 cape_route_to_india_events.17.d: "Повернуть назад. Переход в $india$ нам не по силам."
 cape_route_to_india_events.17.historical_info: "Masqat (Muscat) was a principal port of the Ibadi Imamate of Oman, one of the major maritime powers of the western Indian Ocean. Omani sailors were among the most skilled navigators in the world, deeply familiar with the monsoon winds that governed crossing times between Arabia and the Indian subcontinent. The Portuguese arrival threatened the Omani role as intermediary in the spice trade, and relations between Portugal and Oman remained hostile for most of the sixteenth century, culminating in repeated wars for control of the Persian Gulf and East African ports. Oman eventually expelled the Portuguese from much of their East African network in the seventeenth century."
 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "The [por_feitoria_builder.GetAdjective|U] Have Built a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.18.desc: "Their ships arrived without warning, dropped anchor in the outer roads, and trained their guns on the harbor. The request was polite in form and absolute in substance. They wished to build a trading post. They would pay a small rent. They would respect local laws. What they did not say — what did not need saying — was what would happen if we refused. The timber was already cut and loaded in their holds. The post was raised in a matter of days. It flies the Portuguese cross now, where our own banner flew before."
 cape_route_to_india_events.18.a: "We have no choice. Their cannon speaks louder than our protests."
 cape_route_to_india_events.18.b: "Send a formal protest and demand they respect our sovereignty."
 cape_route_to_india_events.18.historical_info: "Португальская система фейторий стала одним из первых примеров европейского торгового империализма в Азии и Африке. Основывая укреплённые торговые фактории в уже существующих гаванях, Португалия получала доступ к сложившимся торговым сетям, не неся издержек полного территориального завоевания. Местные правители, соглашавшиеся на такие условия, получали доступ к португальским товарам и морскую защиту от соперников; те же, кто отказывался, подвергались обстрелу. Эта система превратила Индийский океан из сравнительно открытого торгового пространства в пространство, выстроенное вокруг португальского морского господства и торговой монополии Casa da Índia."
 cape_route_to_india_events.provisioned_tt: "The fleet is fully provisioned, and its crews will better withstand the long legs ahead"
 cape_route_to_india_events.supplies_up_tt: "The fleet's provisions are replenished"
 cape_route_to_india_events.supplies_down_tt: "The fleet's provisions run lower"
 cape_route_to_india_events.morale_up_tt: "Morale among the crews rises"
 cape_route_to_india_events.morale_down_tt: "Morale among the crews falls"
 cape_route_to_india_events.morale_crash_tt: "Morale collapses — the crews are pushed to the edge of mutiny"
 cape_route_to_india_events.ship_lost_tt: "A vessel is lost, and the expedition is reduced"
 cape_route_to_india_events.cargo_loaded_tt: "Трюмы наполняются грузом [ShowGoodsName('pepper')] — чем больше выживших вернётся из плавания, тем богаче будет привезённый груз"
 cape_route_to_india_events.cargo_spent_tt: "The holds are lighter — the cargo spent to buy this favor will not be sold at journey's end"
 cape_route_to_india_events.19.title: "Морская хворь"
 cape_route_to_india_events.19.desc: "Начинается всё, как всегда, с дёсен. Они размягчаются, потом начинают кровоточить, а после зубы шатаются в своих лунках. Старые раны, зажившие много лет назад, вновь раскрываются, будто нанесённые заново. Люди становятся вялыми, затем задыхаются, а потом и вовсе не могут подняться с гамаков. У лекаря нет средства от этого — ни у кого нет. Бочки с солёной рыбой и изъеденными долгоносиком сухарями, что поддерживали флот через пустынные морские мили, не содержат ничего, что могло бы этому противостоять. Каждое утро на перекличке звучит всё меньше голосов. Тела, завёрнутые в собственные гамаки, уходят за борт, а мили до ближайшего дружественного берега тянутся без всякой пощады."
 cape_route_to_india_events.19.a: "Ration the last of the preserved fruit and make what speed we can for land."
 cape_route_to_india_events.19.b: "Nothing to be done. Bury the dead; pray the living outlast the crossing."
 cape_route_to_india_events.19.b.tt: "Многие члены экипажа не выживут — доходы от плавания сократятся"
 cape_route_to_india_events.19.historical_info: "Цинга, вызванная нехваткой витамина C, была самым страшным убийцей моряков в эпоху дальних плаваний. В первом плавании Васко да Гамы в $india$ из ста сорока восьми человек погибли, по разным оценкам, девяносто три — подавляющее большинство от цинги во время долгих переходов вдали от свежей пищи. Причину болезни удастся достоверно установить лишь два с половиной века спустя; моряки и врачи понимали лишь одно — свежая провизия, и прежде всего цитрусовые, каким-то образом сдерживает недуг, но это знание вновь и вновь обреталось и забывалось."
 cape_route_to_india_events.20.title: "Южный шторм"
 cape_route_to_india_events.20.desc: "Барометр предупреждал — если бы кто-то умел его читать: с юго-запада под ясным небом накатывала долгая тяжёлая зыбь. А затем небо перестало быть ясным. Ветер крепчал, и крепчал ещё сильнее, срывая гребни волн и расшвыривая пену плашмя по воде. Море вздымается до высоты, для которой ни у кого на борту нет слов — серо-зелёные стены, исчерченные пеной, вздымают корабли кормой вперёд к несущимся облакам и бросают их во впадины, где ветер вдруг стихает, жутко и неподвижно. Где-то во мраке другие корабли палят из пушек, чтобы не потерять друг друга, но грохот почти мгновенно тонет в рёве стихии. Теперь нет иного курса, кроме того, что позволит море."
 cape_route_to_india_events.20.a: "Hand the sails and heave to. We ride it out and trust the ships."
 cape_route_to_india_events.20.b: "Run before it under a scrap of canvas and pray we are not pooped."
 cape_route_to_india_events.20.b.win_tt: "Риск оправдался — флот уходит от самого страшного в буре"
 cape_route_to_india_events.20.b.lose_tt: "Море берёт своё"
 cape_route_to_india_events.20.historical_info: "Воды у южной оконечности Африки, где тёплое течение Игольного мыса встречается с холодной атлантической зыбью, идущей из Южного океана, считаются одними из самых опасных в мире. Волны-убийцы, способные захлестнуть крупное судно, фиксируются там и по сей день. Для небольших кораблей эпохи великих открытий — каракк и каравелл водоизмещением в несколько сотен тонн — южноатлантический шторм был смертельной угрозой, и путь вокруг мыса не зря получил своё первое имя — мыс Бурь."
 cape_route_to_india_events.21.title: "Безветренное море"
 cape_route_to_india_events.21.desc: "Ветер стихает в полдень и больше не возвращается. Паруса безвольно повисают на мачтах, бессмысленно хлопая в такт качке на зыби. Ко второму дню море становится гладким, как стекло — огромное слепящее зеркало, простирающееся до мерцающего от зноя горизонта. Смола плавится в палубных пазах. Вода в бочках становится тёплой, зелёной и тухлой. Не остаётся ничего иного, кроме как ждать — ждать, смотреть на солнце, слушать скрип шпангоутов и стараться не считать, сколько провизии съедают люди, никуда не движущиеся. Моряки вполголоса рассказывают о кораблях, найденных годы спустя дрейфующими, чьи команды давно умерли от жажды в виду ветра, которого они так и не дождались."
 cape_route_to_india_events.21.a: "Ждать ветра. Больше ничего не поделать."
 cape_route_to_india_events.21.b: "Put the boats out and tow — anything is better than this stillness."
 cape_route_to_india_events.21.historical_info: "Экваториальные штили — так называемые doldrums, или зона внутритропической конвергенции — были печально известной опасностью атлантического перехода в южное полушарие и обратно. Парусное судно могло застрять там в мёртвом штиле на дни или недели, расходуя провизию и воду, не продвигаясь при этом ни на милю. Именно для того, чтобы избежать этого пояса штилей и встречных ветров, португальские мореплаватели разработали приём #italic volta do mar#! — большой манёвр с уходом далеко на запад в Атлантику, почти до Бразилии, чтобы поймать попутные южные ветра, прежде чем повернуть обратно на восток к мысу."
 cape_route_to_india_events.22.title: "Червь в корпусе"
 cape_route_to_india_events.22.desc: "Плотник обнаруживает это при обычном промере трюмной воды: бур выходит мягким, а когда он проверяет обшивку ниже ватерлинии, инструмент уходит в дерево, которое должно быть твёрдым, как железо. Корабельный червь. Тёплая тропическая вода кишит этими тварями, и они точат корпуса с тех самых пор, как флот пересёк экватор — тысячи бледных ходов, источивших древесину изнутри сотами, незаметные до тех пор, пока не подведёт доска или помпы уже не будут справляться. Если оставить это без внимания, однажды такой изъеденный корабль просто разойдётся по швам и пойдёт ко дну со всей командой. Лицо плотника говорит [target_leader.GetName] всё ещё до того, как тот произносит хоть слово."
 cape_route_to_india_events.22.a: "Careen the ships on the nearest strand and burn the worm from the timbers."
 cape_route_to_india_events.22.a.tt: "Кренгование стоит времени и денег, но спасает флот"
 cape_route_to_india_events.22.b: "Разобрать худший корпус на припасы и дерево, и бросить его."
 cape_route_to_india_events.22.c: "Направиться в дружественную гавань и провести настоящий ремонт."
 cape_route_to_india_events.22.c.tt: "Настоящий ремонт в безопасной гавани поднимает дух флота"
 cape_route_to_india_events.22.historical_info: "Корабельный червь #italic Teredo navalis#! — на самом деле вовсе не червь, а вид морского моллюска — был бичом деревянных судов в тёплых водах, способным разрушить незащищённый корпус за один сезон. Его разрушительная деятельность породила целые века мер противодействия: корпуса обшивали свинцом, покрывали смолой и салом или делали двойную обшивку с жертвенным внешним слоем. Проблема была настолько острой на пути в $india$, что португальцы в конце концов построили специальные сооружения для кренгования на своих базах в Индийском океане, чтобы очищать и чинить корпуса между плаваниями."
 cape_route_to_india_events.24.title: "Мятеж"
 cape_route_to_india_events.24.desc: "It has been coming for weeks — in the muttered conversations that stop when an officer approaches, in the sullen slowness with which orders are obeyed, in the looks. Now it comes into the open. A knot of men on the forecastle, one of them with a marlinspike in his fist, and behind them a crowd of others who have not yet decided which way they will jump. Their demands are the demands of frightened men who believe they have been led to their deaths: turn back, make for a Christian port, anything but sail on into an ocean that has already swallowed so many of their fellows. [target_leader.GetName] stands alone at the break of the quarterdeck. What [target_leader.GetSheHe] does in the next minute will decide whether there is a voyage left at all."
 cape_route_to_india_events.24.a: "Put the ringleaders ashore, and let the fainthearted go with them."
 cape_route_to_india_events.24.b: "Встретить их холодной сталью. Корабль — не место для демократии."
 cape_route_to_india_events.24.fight_win_tt: "Офицеры одерживают верх, и порядок восстановлен"
 cape_route_to_india_events.24.fight_lose_tt: "Схватка кровава, и флот расплачивается за неё"
 cape_route_to_india_events.24.c: "Speak to them of $india$, of the riches that await, of the glory of the endeavor."
 cape_route_to_india_events.24.rouse_tt: "Слова [target_leader.GetNameWithNoTooltip] вновь укрепляют решимость команды"
 cape_route_to_india_events.25.title: "Пустынный берег"
 cape_route_to_india_events.25.desc: "Низкий зелёный берег поднимается из дымки с подветренной стороны — ни дыма, ни паруса, ни следа человеческой руки, только лес, спускающийся к полосе прибоя, а за ним — обещание пресной воды и какой-нибудь дичи, что может дать эта земля. На картах здесь ничего не отмечено. Земля не принадлежит никому, неизвестна, и она может таить в себе что угодно: приветливые источники и лёгкую охоту, либо лихорадку, либо враждебный народ, незримо наблюдающий из-за деревьев. Но бочки с водой почти пусты, а люди осунулись от голода, и берег есть берег."
 cape_route_to_india_events.25.a: "Send the boats ashore for water and whatever the land will yield."
 cape_route_to_india_events.25.b: "Too great a risk on an unknown coast. Note it on the chart and sail on."
 cape_route_to_india_events.26.title: "Берег, готовый к торговле"
 cape_route_to_india_events.26.desc: "Здешний берег заселён, и его жители не враждебны. Каноэ выходят навстречу флоту — сперва настороженно, затем всё смелее, показывая рыбу и фрукты и указывая на пляж, где уже спешно собирается что-то вроде рынка. Тот, кто владеет этим отрезком побережья, не питает вражды к чужеземцам, а вид флотских [ShowGoodsName('iron')] и [ShowGoodsName('cloth')], судя по всему, разжёг интерес к торговле. Это именно тот случай, что так редко выпадает на долгих пустых переходах: место, где можно наполнить бочки водой, купить свежей еды и дать людям ступить на твёрдую землю среди тех, кто не желает им зла."
 cape_route_to_india_events.26.a: "Barter [ShowGoodsNameWithNoTooltip('iron')] and [ShowGoodsNameWithNoTooltip('cloth')] for all the fresh provisions they will sell."
 cape_route_to_india_events.26.b: "Нам не до того, чтобы терять дни. Наберём только воды и пойдём дальше."
 cape_route_to_india_events.27.title: "Пропали без вести"
 cape_route_to_india_events.27.desc: "Последний корабль пропал. Из-за моря ли, болезни, отчаяния самих людей или враждебного берега — дома об этом никогда не узнают наверняка. Известно будет лишь то, что флот, вышедший в путь с такой торжественностью, не вернётся. Ни трюмов, полных [ShowGoodsName('pepper')]. Ни триумфального возвращения. Ни карт пути к $india$. Где-то на этой необъятной дуге океана, между берегом Африки и богатствами Востока, экспедиция просто оборвалась, и море сомкнулось над ней, будто её никогда и не было. В Лиссабоне семьи будут ждать месяцы, а после и годы, прежде чем поймут правду."
 cape_route_to_india_events.27.a: "Пусть [ROOT.GetCountry.GetReligion.GetGodName] примет их души. Мы не скоро решимся на это снова."
 cape_route_to_india_events.27.historical_info: "Морской путь в $india$ был проложен ценой немыслимых человеческих жертв. Даже удачные плавания нередко уносили половину экипажа и часть кораблей; неудачные же исчезали полностью, не оставляя ничего, кроме того факта, что флот не вернулся. Из кораблей, что в последующее столетие пытались пройти #italic Carreira da Índia#!, значительная часть была потеряна безвозвратно — разбившись у берегов Африки, погибнув в штормах Южного океана или просто пропав без вести. Великие богатства, быть может, и потекли в Лиссабон, но плата за них — утонувшие и сгоревшие в лихорадке люди — была такова, что забывать о ней нельзя."
 cape_route_to_india_events.28.title: "Высадка у [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.28.desc.empty: "Десять конусов чёрной вулканической породы вздымаются из равнодушного моря, и ни одна живая душа не обитает ни на одном из них. Ни дыма, ни паруса, ни флага — только морские птицы, ветер да несколько солоноватых источников среди пепла. Старые карты называют эти острова по имени, но ни одна корона так и не заселила их. Они лежат прямо на пути наших вод, и [target_leader.GetName] понимает их ценность так же ясно, как [target_leader.GetSheHe] знает [target_leader.GetHerHis] собственное имя: тот, кто владеет [ShowProvinceDefinitionName('cape_verde_province')], владеет вратами в [ShowContinentName('atlantic_ocean_continent')]. И в этот час ими не владеет никто."
 cape_route_to_india_events.28.desc.foreign: "Another crown's banner snaps over the anchorage at [ShowLocationName('santiago')]. Someone reached these islands ahead of us and put down roots — a garrison, a battery, a harbormaster who rows out to ask our business in a tone that is courteous and unwelcoming in equal measure. The islands sit astride the very waters our route must cross; in a rival's hands they are a knife held to the throat of every voyage south. [target_leader.GetName] studies the fortifications from the rail, says nothing, and thinks a great deal."
 cape_route_to_india_events.28.a: "Claim the islands and raise a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — it must fly our flag."
 cape_route_to_india_events.28.b: "Put ashore for water and forage what little the islands offer."
 cape_route_to_india_events.28.c: "Эти острова не наши, чтобы ими пользоваться. Идём дальше на юг."
 cape_route_to_india_events.28.d: "Вернуться домой."
 cape_route_to_india_events.28.historical_info: "Острова Кабо-Верде были замечены португальскими мореплавателями около 1456 года и заселены с 1462 года, а до того были совершенно необитаемы. Их положение в средней части Атлантики, где дуют северо-восточные пассаты, сделало их незаменимым перевалочным пунктом для плаваний вокруг Африки и в Америку. Держава, владевшая Кабо-Верде, получала в свои руки узловую точку на всех южных путях; неслучайно Португалия занялась заселением и укреплением островов по мере роста своих океанских амбиций."
 cape_route_to_india_events.29.title: "Каменный столп"
 cape_route_to_india_events.29.desc.rafael: "The fleet has put in at the mouth of a broad, muddy river the pilots are already calling the [ShowLocationNameWithNoTooltip('quelimane')] — the River of Good Signs — for here, at last, the men have found what they crossed half the world to see: local craft rigged in the Arab fashion, traders who know the word for '$india$' and point east when they say it. The great crossing is near. In the hold lie the worked limestone pillars carried from home for exactly this purpose, each crowned with a cross and the royal arms. The carpenter asks whether to bring one ashore. To raise it is to plant a claim in stone and take on fresh water and wood while the masons work — but it will cost the fleet days it may not have."
 cape_route_to_india_events.29.desc.maria: "Здесь у берега лежат низкие островки, зелёные и хорошо орошённые, укрытые от волн, — та земля, что усталый флот ценит выше золота. $india$ теперь уже близка; малабарский берег — в нескольких днях плавания к югу. В трюме ждёт ещё один известняковый столп, отделанный и с надписью ещё до начала плавания, готовый провозгласить, что корабли нашей короны первыми достигли этих вод. Установить его — значит оставить след, который переживёт всех, кто сейчас на борту, — но церемония вместе с килеванием и пополнением запасов воды задержит флот, пока меняется сезон."
 cape_route_to_india_events.29.desc: "Здешний берег стоит отметить. В трюме лежит один из отделанных известняковых столпов, взятых из дома, — увенчанный крестом и королевским гербом, — предназначенный встать на мысу и провозгласить, что наши корабли прошли здесь первыми. Воздвигнуть его — дело торжественное и небыстрое; флоту придётся стоять на якоре, пока каменщики устанавливают камень."
 cape_route_to_india_events.29.a: "Воздвигнуть #italic падран#! — пусть камень и крест отметят наш путь."
 cape_route_to_india_events.29.b: "Не время для церемоний — пополнить запасы воды, добыть провизию и идти дальше."
 cape_route_to_india_events.29.historical_info: "#italic Падран#! представлял собой каменный столп, увенчанный крестом и гербом Португалии; его везли на борту в готовом виде и устанавливали на вновь достигнутых берегах, чтобы заявить об открытии и суверенитете. По свидетельству гуманиста Дамиана де Гойша, флот Васко да Гамы установил пять таких столпов во время плавания к $india$: #italic Сан-Рафаэл#! на Реке Добрых Знамений, #italic Сан-Жоржи#! в Мозамбике, #italic Эшпириту-Санту#! в Малинди, #italic Санта-Марию#! на островках и #italic Сан-Габриэл#! в Каликуте. Эти столпы пришли на смену недолговечным деревянным крестам прежних плаваний и были рассчитаны на века; некоторые из них простояли столетиями."
 cape_route_to_india_events.30.title: "Плавание оставлено"
 cape_route_to_india_events.30.a: "So be it. We return with what we have learned, if nothing else."
 cape_route_to_india_events.30.historical_info: "Не каждая португальская экспедиция вдоль африканского берега доходила до конечной цели. Капитаны неизменно взвешивали риски неведомого перехода против уже собранных кораблей и людей, и безопасное возвращение с неполными сведениями о новом побережье нередко считалось более разумным решением. Такие плавания понемногу пополняли карты, даже если не достигали $india$, а накопленные за жизнь целого поколения частичные сведения в итоге и сделали возможным полное плавание Васко да Гамы."
 cape_route_to_india_events.14.a.owned: "Укрепить Сан-Жоржи-да-Мину — [ShowCultureNameWithNoTooltip('akan')] уже торгуют через наши руки."
 cape_route_to_india_events.15.a.owned: "Укрепить нашу факторию здесь — остров уже удерживает нашу [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] торговлю."
 cape_route_to_india_events.15.c.tt: "Корпуса кораблей очищены и просмолены — в этом плавании корабельный червь флоту не страшен"
 cape_route_to_india_events.3.a.owned: "Вложить ещё средств в остров — [ShowLocationNameWithNoTooltip('sao_tome')] уже подчиняется нашему флагу."
 cape_route_to_india_events.31.a: "Соблюдём условия — двор поворчит на иноземное оружие, но стерпит."
 cape_route_to_india_events.31.b: "Изложим всё на бумаге: подати и права закреплены за обеими коронами."
 cape_route_to_india_events.31.historical_info: "Не каждая фейтория возводилась под угрозой обстрела. Султан Малинди, давно враждовавший с Момбасой, принял флот Васко да Гамы как полезный противовес и предоставил лоцмана, который провёл корабли до Каликута. Малинди на десятилетия осталось португальским союзником на суахилийском побережье, где сперва разместилась португальская фактория, а затем и форт. Правители, вовремя пошедшие на сговор, получали доступ к португальским товарам и морскую защиту от собственных врагов, а некоторые пользовались этим союзом, чтобы свести старые счёты. Такие сделки редко бывали равными, но заключённые добровольно держались куда дольше тех, что были навязаны силой."
 cape_route_to_india_events.31.title: "Португальцы строят свою [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.5.a.owned: "Расширить наш великий пост в [ShowLocationNameWithNoTooltip('luanda')] — ему не будет равных на этом побережье."
 cape_route_to_india_events.5.b.owned: "Расширить торговую факторию и склад, которые у нас уже здесь есть."
 cape_route_to_india_events.8.a.morale_tt: "Боевой дух команд значительно возрастает (#G +15#! к боевому духу экипажа)"
 cape_route_to_india_events.8.b.morale_tt: "Боевой дух команд немного возрастает (#G +8#! к боевому духу экипажа)"
 cape_route_to_india_events.8.c.morale_tt: "Боевой дух команд заметно возрастает (#G +10#! к боевому духу экипажа)"
 cape_route_to_india_events.9.a.owned: "Вложить средства в нашу торговую факторию в [ShowLocationNameWithNoTooltip('sofala')] — это золото сделает [ROOT.GetCountry.GetNameWithNoTooltip] богатой."
 cape_route_to_india_events.morale_crash_15_tt: "Боевой дух рушится — команда на грани бунта (#R -15#! к боевому духу экипажа)"
 cape_route_to_india_events.morale_crash_20_tt: "Боевой дух рушится — команда на грани бунта (#R -20#! к боевому духу экипажа)"
 cape_route_to_india_events.morale_down_10_tt: "Боевой дух команды падает (#R -10#! к боевому духу экипажа)"
 cape_route_to_india_events.morale_down_3_tt: "Боевой дух команды падает (#R -3#! боевой дух экипажа)"
