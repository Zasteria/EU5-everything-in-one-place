 cape_route_to_india_events.morale_crash_15_tt: "Боевой дух подорван: экипажи на грани мятежа (#G −15#! к боевому духу)"
 cape_route_to_india_events.morale_crash_20_tt: "Боевой дух подорван: экипажи на грани мятежа (#G −20#! к боевому духу)"
 cape_route_to_india_events.ship_lost_tt: "Корабль потерян, и флот стал меньше (#R −1#! к числу судов)"
 cape_route_to_india_events.cargo_loaded_tt: "Трюмы наполняются грузом [ShowGoodsName('pepper')] — чем больше выживших вернётся из плавания, тем богаче будет привезённый груз"
 cape_route_to_india_events.cargo_spent_tt: "В трюмах стало посвободнее: груз, потраченный на покупку этой благосклонности, не будет продан до конца путешествия (#R −20#! к количеству груза)"
 cape_route_to_india_events.pilot_gained_tt: "К флоту примкнул опытный лоцман. Мудрый совет этого человека пригодится нам в переговорах с Каликутом."
 cape_route_to_india_events.19.title: "Морская хворь"
 cape_route_to_india_events.19.desc: "Начинается всё, как всегда, с дёсен. Они размягчаются, потом начинают кровоточить, а после зубы шатаются в своих лунках. Старые раны, зажившие много лет назад, вновь раскрываются, будто нанесённые заново. Люди становятся вялыми, затем задыхаются, а потом и вовсе не могут подняться с гамаков. У лекаря нет средства от этого — ни у кого нет. Бочки с солёной рыбой и изъеденными долгоносиком сухарями, что поддерживали флот через пустынные морские мили, не содержат ничего, что могло бы этому противостоять. Каждое утро на перекличке звучит всё меньше голосов. Тела, завёрнутые в собственные гамаки, уходят за борт, а мили до ближайшего дружественного берега тянутся без всякой пощады."
 cape_route_to_india_events.19.a: "Раздадим последние фрукты и помчимся к берегу на всех парусах."
 cape_route_to_india_events.19.b: "Выбора у нас нет. Похороним мёртвых и будем молиться за живых."
 cape_route_to_india_events.19.b.tt: "Многие члены экипажа не выживут — доходы от плавания сократятся"
 cape_route_to_india_events.19.historical_info: "Цинга, вызванная нехваткой витамина C, была самым страшным убийцей моряков в эпоху дальних плаваний. В первом плавании Васко да Гамы в $india$ из ста сорока восьми человек погибли, по разным оценкам, девяносто три — подавляющее большинство от цинги во время долгих переходов вдали от свежей пищи. Причину болезни удастся достоверно установить лишь два с половиной века спустя; моряки и врачи понимали лишь одно — свежая провизия, и прежде всего цитрусовые, каким-то образом сдерживает недуг, но это знание вновь и вновь обреталось и забывалось."
 cape_route_to_india_events.20.title: "Южный шторм"
 cape_route_to_india_events.20.desc: "Барометр предупреждал — если бы кто-то умел его читать: с юго-запада под ясным небом накатывала долгая тяжёлая зыбь. А затем небо перестало быть ясным. Ветер крепчал, и крепчал ещё сильнее, срывая гребни волн и расшвыривая пену плашмя по воде. Море вздымается до высоты, для которой ни у кого на борту нет слов — серо-зелёные стены, исчерченные пеной, вздымают корабли кормой вперёд к несущимся облакам и бросают их во впадины, где ветер вдруг стихает, жутко и неподвижно. Где-то во мраке другие корабли палят из пушек, чтобы не потерять друг друга, но грохот почти мгновенно тонет в рёве стихии. Теперь нет иного курса, кроме того, что позволит море."
 cape_route_to_india_events.20.a: "Уберём паруса и ляжем в дрейф. Наши корабли всё выдержат."
 cape_route_to_india_events.20.b: "Продолжим путь под штормовыми парусами и будем молиться, чтобы нас не накрыло волной."
 cape_route_to_india_events.20.b.win_tt: "Риск оправдался — флот уходит от самого страшного в буре"
 cape_route_to_india_events.20.b.lose_tt: "Море берёт своё"
 cape_route_to_india_events.20.historical_info: "Воды у южной оконечности Африки, где тёплое течение Игольного мыса встречается с холодной атлантической зыбью, идущей из Южного океана, считаются одними из самых опасных в мире. Волны-убийцы, способные захлестнуть крупное судно, фиксируются там и по сей день. Для небольших кораблей эпохи великих открытий — каракк и каравелл водоизмещением в несколько сотен тонн — южноатлантический шторм был смертельной угрозой, и путь вокруг мыса не зря получил своё первое имя — мыс Бурь."
 cape_route_to_india_events.21.title: "Безветренное море"
 cape_route_to_india_events.21.desc: "Ветер стихает в полдень и больше не возвращается. Паруса безвольно повисают на мачтах, бессмысленно хлопая в такт качке на зыби. Ко второму дню море становится гладким, как стекло — огромное слепящее зеркало, простирающееся до мерцающего от зноя горизонта. Смола плавится в палубных пазах. Вода в бочках становится тёплой, зелёной и тухлой. Не остаётся ничего иного, кроме как ждать — ждать, смотреть на солнце, слушать скрип шпангоутов и стараться не считать, сколько провизии съедают люди, никуда не движущиеся. Моряки вполголоса рассказывают о кораблях, найденных годы спустя дрейфующими, чьи команды давно умерли от жажды в виду ветра, которого они так и не дождались."
 cape_route_to_india_events.21.a: "Ждать ветра. Больше ничего не поделать."
 cape_route_to_india_events.21.b: "Спускаем лодки на воду и берём корабль на буксир. Всё лучше, чем слушать зловещую тишину."
 cape_route_to_india_events.21.historical_info: "Экваториальные штили — так называемые doldrums, или зона внутритропической конвергенции — были печально известной опасностью атлантического перехода в южное полушарие и обратно. Парусное судно могло застрять там в мёртвом штиле на дни или недели, расходуя провизию и воду, не продвигаясь при этом ни на милю. Именно для того, чтобы избежать этого пояса штилей и встречных ветров, португальские мореплаватели разработали приём #italic volta do mar#! — большой манёвр с уходом далеко на запад в Атлантику, почти до Бразилии, чтобы поймать попутные южные ветра, прежде чем повернуть обратно на восток к мысу."
 cape_route_to_india_events.22.title: "Червь в корпусе"
 cape_route_to_india_events.22.desc: "Плотник обнаруживает это при обычном промере трюмной воды: бур выходит мягким, а когда он проверяет обшивку ниже ватерлинии, инструмент уходит в дерево, которое должно быть твёрдым, как железо. Корабельный червь. Тёплая тропическая вода кишит этими тварями, и они точат корпуса с тех самых пор, как флот пересёк экватор — тысячи бледных ходов, источивших древесину изнутри сотами, незаметные до тех пор, пока не подведёт доска или помпы уже не будут справляться. Если оставить это без внимания, однажды такой изъеденный корабль просто разойдётся по швам и пойдёт ко дну со всей командой. Лицо плотника говорит [target_leader.GetName] всё ещё до того, как тот произносит хоть слово."
 cape_route_to_india_events.22.a: "Нужно положить суда на бок и выжечь червей."
 cape_route_to_india_events.22.a.tt: "Кренгование стоит времени и денег, но спасает флот"
 cape_route_to_india_events.22.b: "Разобрать худший корпус на припасы и дерево, и бросить его."
 cape_route_to_india_events.22.c: "Направиться в дружественную гавань и провести настоящий ремонт."
 cape_route_to_india_events.22.c.tt: "Настоящий ремонт в безопасной гавани поднимает дух флота"
 cape_route_to_india_events.22.historical_info: "Корабельный червь #italic Teredo navalis#! — на самом деле вовсе не червь, а вид морского моллюска — был бичом деревянных судов в тёплых водах, способным разрушить незащищённый корпус за один сезон. Его разрушительная деятельность породила целые века мер противодействия: корпуса обшивали свинцом, покрывали смолой и салом или делали двойную обшивку с жертвенным внешним слоем. Проблема была настолько острой на пути в $india$, что португальцы в конце концов построили специальные сооружения для кренгования на своих базах в Индийском океане, чтобы очищать и чинить корпуса между плаваниями."
 cape_route_to_india_events.24.title: "Мятеж"
 cape_route_to_india_events.24.desc: "Мятеж случился не вдруг: недовольство среди моряков зрело неделями. Они шептались, поглядывая по сторонам, и замолкали при приближении офицеров. Не спешили исполнять приказы. Смотрели дерзко и с вызовом. Теперь же всё вышло наружу. Бунтовщики собрались в носовом кубрике: кто-то сжимал в кулаке свайку, а самые нерешительные держались позади. Они не разбойники: их действия продиктованы страхом. Эти люди уверены, что их ведут на верную смерть, и потому требуют, чтобы капитан повернул назад, к #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ому#! порту. Они готовы на всё, лишь бы не углубляться в открытый океан, который погубил их товарищей. [target_leader.GetName] стоит у края кормовой палубы. Сейчас в руках этого человека судьба всего экипажа."
 cape_route_to_india_events.24.a: "Высадим зачинщиков на берег, а малодушных отпустим."
 cape_route_to_india_events.24.b: "Встретить их холодной сталью. Корабль — не место для демократии."
 cape_route_to_india_events.24.fight_win_tt: "Офицеры одерживают верх, и порядок восстановлен"
 cape_route_to_india_events.24.fight_lose_tt: "Схватка кровава, и флот расплачивается за неё"
 cape_route_to_india_events.24.c: "Расскажем им об Индии. Кто не мечтает о богатстве и славе?"
 cape_route_to_india_events.24.rouse_tt: "Слова [target_leader.GetNameWithNoTooltip] вновь укрепляют решимость команды"
 cape_route_to_india_events.25.title: "Пустынный берег"
 cape_route_to_india_events.25.desc: "Низкий зелёный берег поднимается из дымки с подветренной стороны — ни дыма, ни паруса, ни следа человеческой руки, только лес, спускающийся к полосе прибоя, а за ним — обещание пресной воды и какой-нибудь дичи, что может дать эта земля. На картах здесь ничего не отмечено. Земля не принадлежит никому, неизвестна, и она может таить в себе что угодно: приветливые источники и лёгкую охоту, либо лихорадку, либо враждебный народ, незримо наблюдающий из-за деревьев. Но бочки с водой почти пусты, а люди осунулись от голода, и берег есть берег."
 cape_route_to_india_events.25.a: "Отправим лодки с моряками за водой и припасами."
 cape_route_to_india_events.25.b: "Риск слишком велик. Отметим землю на карте и продолжим путь."
 cape_route_to_india_events.26.title: "Берег, готовый к торговле"
 cape_route_to_india_events.26.desc: "Здешний берег заселён, и его жители не враждебны. Каноэ выходят навстречу флоту — сперва настороженно, затем всё смелее, показывая рыбу и фрукты и указывая на пляж, где уже спешно собирается что-то вроде рынка. Тот, кто владеет этим отрезком побережья, не питает вражды к чужеземцам, а вид флотских [ShowGoodsName('iron')] и [ShowGoodsName('cloth')], судя по всему, разжёг интерес к торговле. Это именно тот случай, что так редко выпадает на долгих пустых переходах: место, где можно наполнить бочки водой, купить свежей еды и дать людям ступить на твёрдую землю среди тех, кто не желает им зла."
 cape_route_to_india_events.26.a: "Обменяем железо и текстиль на свежую провизию."
 cape_route_to_india_events.26.b: "Нам не до того, чтобы терять дни. Наберём только воды и пойдём дальше."
 cape_route_to_india_events.27.title: "Пропали без вести"
 cape_route_to_india_events.27.desc: "Последний корабль пропал. Из-за моря ли, болезни, отчаяния самих людей или враждебного берега — дома об этом никогда не узнают наверняка. Известно будет лишь то, что флот, вышедший в путь с такой торжественностью, не вернётся. Ни трюмов, полных [ShowGoodsName('pepper')]. Ни триумфального возвращения. Ни карт пути к $india$. Где-то на этой необъятной дуге океана, между берегом Африки и богатствами Востока, экспедиция просто оборвалась, и море сомкнулось над ней, будто её никогда и не было. В Лиссабоне семьи будут ждать месяцы, а после и годы, прежде чем поймут правду."
 cape_route_to_india_events.27.a: "Пусть [ROOT.GetCountry.GetReligion.GetGodName] примет их души. Мы не скоро решимся на это снова."
 cape_route_to_india_events.27.historical_info: "Морской путь в $india$ был проложен ценой немыслимых человеческих жертв. Даже удачные плавания нередко уносили половину экипажа и часть кораблей; неудачные же исчезали полностью, не оставляя ничего, кроме того факта, что флот не вернулся. Из кораблей, что в последующее столетие пытались пройти #italic Carreira da Índia#!, значительная часть была потеряна безвозвратно — разбившись у берегов Африки, погибнув в штормах Южного океана или просто пропав без вести. Великие богатства, быть может, и потекли в Лиссабон, но плата за них — утонувшие и сгоревшие в лихорадке люди — была такова, что забывать о ней нельзя."
 cape_route_to_india_events.28.title: "Высадка у [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.28.desc.empty: "Десять конусов чёрной вулканической породы вздымаются из равнодушного моря, и ни одна живая душа не обитает ни на одном из них. Ни дыма, ни паруса, ни флага — только морские птицы, ветер да несколько солоноватых источников среди пепла. Старые карты называют эти острова по имени, но ни одна корона так и не заселила их. Они лежат прямо на пути наших вод, и [target_leader.GetName] понимает их ценность так же ясно, как [target_leader.GetSheHe] знает [target_leader.GetHerHis] собственное имя: тот, кто владеет [ShowProvinceDefinitionName('cape_verde_province')], владеет вратами в [ShowContinentName('atlantic_ocean_continent')]. И в этот час ими не владеет никто."
 cape_route_to_india_events.28.desc.foreign: "Над якорной стоянкой [ShowLocationName('santiago')] развеваются #L [rival_owner.GetAdjective|l]ие#!#! знамёна. Судя по гарнизону и батарее, [rival_owner.GetName] уже здесь. Мы опоздали. Портовый смотритель плывёт к нам на лодке, чтобы узнать о цели нашего визита. Он разговаривает вежливо, но в его словах чувствуется неприязнь. Наш маршрут пролегает прямо вдоль островов. В руках неприятеля они подобны ножу, который приставляют к горлу капитана каждого судна, следующего на юг. [target_leader.GetName] стоит у леера и молча осматривает укрепления."
 cape_route_to_india_events.28.a: "Завоюем острова и построим фейторию с нашим флагом."
 cape_route_to_india_events.28.b: "Высадимся на берег, чтобы набрать воды и пополнить припасы."
 cape_route_to_india_events.28.c: "Эти острова не наши, чтобы ими пользоваться. Идём дальше на юг."
 cape_route_to_india_events.28.d: "Вернуться домой."
 cape_route_to_india_events.28.historical_info: "Острова Кабо-Верде были замечены португальскими мореплавателями около 1456 года и заселены с 1462 года, а до того были совершенно необитаемы. Их положение в средней части Атлантики, где дуют северо-восточные пассаты, сделало их незаменимым перевалочным пунктом для плаваний вокруг Африки и в Америку. Держава, владевшая Кабо-Верде, получала в свои руки узловую точку на всех южных путях; неслучайно Португалия занялась заселением и укреплением островов по мере роста своих океанских амбиций."
 cape_route_to_india_events.29.title: "Каменный столп"
 cape_route_to_india_events.29.desc.rafael: "Флот остановился в [ShowLocationNameWithNoTooltip('quelimane')], у устья широкой и грязной реки, которую лоцманы уже прозвали «рекой добрых знамений». Именно здесь путешественники нашли то, ради чего переплыли полмира: снаряжённое на #TOOLTIP:CULTUREGROUP,arabian_group,X #L арабский#!#! лад судно и купцов, которые, услышав слово «Индия», уверенно указывают на восток. Наша цель уже близко: осталось лишь пересечь Аравийское море. В трюме лежат привезённые с родины известняковые колонны, увенчанные крестами и королевскими гербами. Плотник спрашивает, стоит ли вынести одну из них на берег. Воздвигнув её здесь, мы заявим о своих притязаниях на эту землю, а заодно успеем набрать пресной воды и древесины для ремонта кораблей, пока работают каменщики. Однако на всё это нужно время, которого у флота и так не много."
 cape_route_to_india_events.29.desc.maria: "Здесь у берега лежат низкие островки, зелёные и хорошо орошённые, укрытые от волн, — та земля, что усталый флот ценит выше золота. $india$ теперь уже близка; малабарский берег — в нескольких днях плавания к югу. В трюме ждёт ещё один известняковый столп, отделанный и с надписью ещё до начала плавания, готовый провозгласить, что корабли нашей короны первыми достигли этих вод. Установить его — значит оставить след, который переживёт всех, кто сейчас на борту, — но церемония вместе с килеванием и пополнением запасов воды задержит флот, пока меняется сезон."
 cape_route_to_india_events.29.desc: "Здешний берег стоит отметить. В трюме лежит один из отделанных известняковых столпов, взятых из дома, — увенчанный крестом и королевским гербом, — предназначенный встать на мысу и провозгласить, что наши корабли прошли здесь первыми. Воздвигнуть его — дело торжественное и небыстрое; флоту придётся стоять на якоре, пока каменщики устанавливают камень."
 cape_route_to_india_events.29.a: "Воздвигнуть #italic падран#! — пусть камень и крест отметят наш путь."
 cape_route_to_india_events.29.b: "Не время для церемоний — пополнить запасы воды, добыть провизию и идти дальше."
 cape_route_to_india_events.29.historical_info: "#italic Падран#! представлял собой каменный столп, увенчанный крестом и гербом Португалии; его везли на борту в готовом виде и устанавливали на вновь достигнутых берегах, чтобы заявить об открытии и суверенитете. По свидетельству гуманиста Дамиана де Гойша, флот Васко да Гамы установил пять таких столпов во время плавания к $india$: #italic Сан-Рафаэл#! на Реке Добрых Знамений, #italic Сан-Жоржи#! в Мозамбике, #italic Эшпириту-Санту#! в Малинди, #italic Санта-Марию#! на островках и #italic Сан-Габриэл#! в Каликуте. Эти столпы пришли на смену недолговечным деревянным крестам прежних плаваний и были рассчитаны на века; некоторые из них простояли столетиями."
 cape_route_to_india_events.30.title: "Плавание оставлено"
 cape_route_to_india_events.30.desc: "Приказ отдан, и на этом корабле никто не спорит — лишь облегчение на одних лицах и разочарование на других. Нос разворачивается. За спиной остаётся неведомый берег; впереди — долгий знакомый путь домой. Ни карт $india$, ни трюмов, полных [ShowGoodsName('pepper')], ни места в летописях историков о том, кто первым отыскал морской путь на восток. Но корабли целы, команды живы, а гавань родного дома — не надежда, а неизбежность.\n\n[target_leader.GetName] долго смотрит на горизонт за кормой, прежде чем обратить [target_leader.GetHerHis] внимание на задачи плавания, что ещё ждут [target_leader.GetHerHim]."
 cape_route_to_india_events.30.a: "Что ж, вернёмся с теми скромными знаниями, что успели добыть."
 cape_route_to_india_events.30.historical_info: "Не каждая португальская экспедиция вдоль африканского берега доходила до конечной цели. Капитаны неизменно взвешивали риски неведомого перехода против уже собранных кораблей и людей, и безопасное возвращение с неполными сведениями о новом побережье нередко считалось более разумным решением. Такие плавания понемногу пополняли карты, даже если не достигали $india$, а накопленные за жизнь целого поколения частичные сведения в итоге и сделали возможным полное плавание Васко да Гамы."
 cape_route_to_india_events.31.title: "Португальцы основывают свою фейторию"
 cape_route_to_india_events.31.desc: "Их капитан сошёл на берег с подарками, а не с пушкарями, и условия были улажены за три дня переговоров: участок земли у воды для их [ShowBuildingTypeName('por_feitoria')], рента в нашу казну, наши собственные суды для разбора любой тяжбы между их людьми и нашими, и их флот, готовый встать между этой гаванью и нашими соперниками. Лес для постройки вышел из их трюмов уже нарезанный по размеру, и застава была поднята за считанные дни.\n\nНад ней реет герб [por_feitoria_builder.GetName] рядом с нашим собственным, а стоянка внизу оживлённее, чем была целое поколение. Наши внуки, может, ещё проклянут эту сделку, но счёт на сегодня прост: у нас есть порох, ткани и друг с пушками, а у них — склад и причал."
 cape_route_to_india_events.31.a: "Двор будет возмущаться, но мы выполним свою часть уговора."
 cape_route_to_india_events.31.b: "Закрепим условия аренды на бумаге во избежание недоразумений."
 cape_route_to_india_events.31.historical_info: "Не каждая фейтория была основана под угрозой обстрела из корабельных пушек. Например, султан Малинди, многие годы враждовавший с правителями Момбасы, заручился помощью флота Васко да Гамы и взамен предоставил ему своего лоцмана, который помог мореплавателю добраться до Каликута. В результате город Малинди несколько десятилетий оставался основным союзником Португалии на суахильском побережье, где сначала был возведён торговый пост, а затем и крепость. Таким образом, правители, которые добровольно договаривались с португальцами, получали доступ к их товарам и могли рассчитывать на их военную помощь, чем некоторые пользовались для сведения старых счётов. Подобные сделки редко были справедливыми для туземцев, и тем не менее они действовали гораздо дольше тех, что были навязаны силой."
