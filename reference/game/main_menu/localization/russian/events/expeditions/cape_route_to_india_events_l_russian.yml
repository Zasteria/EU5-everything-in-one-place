l_russian:
 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "Флот выходит в море"
 cape_route_to_india_events.1.desc: "Подобного флота наши воды не видели уже целое поколение. Четыре корабля, сто семьдесят человек, запасов #TOOLTIP:GOODS,salt,X соли#!, #TOOLTIP:GOODS,fish,X #L рыбы#!#! и сухарей на несколько лет вперёд — и приказ правителя! [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] хочет, чтобы мы отыскали морской путь в Индию. Священники благословляют корабли. Толпа теснится у самой кромки воды. Некоторые рыдают.\n\n[target_leader.GetName] стоит на носу корабля, пока суда выходят из гавани в Атлантический океан. Позади [Select_CString(target_leader.IsFemale, 'неё', 'него')] гавань постепенно превращается в белое пятнышко на зелёном склоне холма. А впереди безграничный океан. [Select_CString(target_leader.IsFemale, 'Она выполнила', 'Он выполнил')] все расчёты. [Select_CString(target_leader.IsFemale, 'Она', 'Он')] знает, что ждёт нас в этом плавании. Но всё решает лишь [ROOT.GetCountry.GetReligion.GetGodName]."
 cape_route_to_india_events.1.a: "Если [ROOT.GetCountry.GetReligion.GetGodName|U] позволит, мы вернёмся с трюмами, полными пряностей."
 cape_route_to_india_events.1.b: "Помолимся — и тотчас же отплываем."
 cape_route_to_india_events.1.historical_info: "Португальская экспедиция по поиску морского пути в Индию стала результатом почти ста лет постепенного продвижения на юг вдоль африканского побережья. В 1488 году Бартоломеу Диаш обогнул мыс Доброй Надежды, доказав, что путь в Индию возможен. Плавание Васко да Гамы в 1497–1499 годах завершило начатое — его корабли вернулись домой с грузом перца и пряностей, стоимость экспедиции окупилась в шестьдесят раз. Это путешествие коренным образом изменило мировую торговлю пряностями, положив конец венецианско-османской монополии на сухопутные торговые пути."
 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "Острова Зелёного Мыса"
 cape_route_to_india_events.2.desc: "Десять вулканических островов высятся над ровной, безликой морской гладью — таков архипелаг Зелёного Мыса. Флот знал, что встретит их на пути, и всё же их появление стало облегчением: твёрдая земля после долгих недель в открытом океане. Резиденция губернатора в [ShowLocationName('santiago')] представляет собой скромное здание из побелённого камня. В гавани пахнет солью, сушёной рыбой и едва уловимым орселем, лишайником, который соскребают со скал для изготовления красителя.\n\n[target_leader.GetName] обдумывает выбор. [ROOT.GetCountry.GetName] влад[ROOT.GetCountry.Custom('end_etyut')] этими островами уже несколько десятилетий, но «влад[ROOT.GetCountry.Custom('end_etyut')]» слишком громко сказано: крохотный гарнизон, кучка поселенцев и ежегодный корабль с припасами. Чтобы этот маршрут обрёл значение для будущего [ROOT.GetCountry.Custom('CL_GEN')], острова должны стать чем-то большим, чем просто местом отдыха и пополнения запасов."
 cape_route_to_india_events.2.a: "Выделим средства на расширение форпоста, охраняющего наш южный морской маршрут."
 cape_route_to_india_events.2.b: "Пополним запасы, наберём пресной воды и продолжим плавание."
 cape_route_to_india_events.2.c: "Не стоит задерживаться — мы только отплыли и не можем терять время впустую."
 cape_route_to_india_events.2.d: "Возвратиться домой."
 cape_route_to_india_events.2.historical_info: "Острова Зелёного Мыса были открыты португальскими мореплавателями приблизительно в 1456 году, а с 1462 года началось заселение архипелага. Благодаря своему расположению в Атлантическом океане, на пути северо-восточных пассатов, острова стали важным перевалочным пунктом для плаваний к Южной Америке и вокруг Африки. После того как Васко да Гама подтвердил, что существует морской путь в Индийский океан, стратегическое значение островов существенно выросло. К XVI веку они стали важным центром трансатлантической работорговли."
 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "[ShowLocationNameWithNoTooltip('sao_tome')]"
 cape_route_to_india_events.3.desc_common: "Жара даёт о себе знать, прежде чем марсовый замечает на горизонте сушу: едва флот пересекает экватор, на палубу обрушивается влажная, удушливая стена зноя. Моряки задыхаются, а океан не приносит прохлады и облегчения. [ShowLocationName('sao_tome')] выступает из утреннего тумана тёмно-зелёной короной с двумя окутанными облаками вершинами. Водопады прорезают склоны и теряются среди столь густого леса, что свет не достигает земли."
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nНебольшое поселение ютится на западном берегу. По словам поселенцев, здешняя почва необычайно плодородна: что ни посади — всё растёт. На этом острове можно сколотить целое состояние, выращивая сахарный тростник, были бы люди, способные работать на плантациях."
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nНа береге не видно дымов, в бухтах — лодок. Остров необитаем — шлюпки флота первыми достигают этого пляжа. И всё же там, где удаётся вырубить джунгли, почва чёрная, глубокая и необычайно плодородная. На таком острове можно сколотить целое состояние, выращивая сахарный тростник, были бы люди, способные работать на плантациях — и если раньше людей не погубят экваториальные лихорадки."
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nНа западном берегу уже ютится поселение под чужим флагом: причалы, часовня, первые поля сахарного тростника, устроенные [rival_owner.GetAdjective|l]ими поселенцами, которые добрались до этого плодородного острова раньше #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Почва здесь и впрямь богата, как и рассказывали другие путешественники, но она уже занята. Всё, чего мы хотим добиться на Сан-Томе, теперь придётся либо отнять, либо выторговать у [rival_owner.Custom('CL_GEN')]."
 cape_route_to_india_events.3.a: "Нужно основать факторию — этот остров стоит вложенных средств."
 cape_route_to_india_events.3.a.owned: "Вложим в остров дополнительные средства — Сан-Томе уже признал нашу власть."
 cape_route_to_india_events.3.b: "Воздвигнем #italic падран#! и заявим права на остров от имени короны."
 cape_route_to_india_events.3.c: "Пополним запасы пресной воды и продолжим путь на юг."
 cape_route_to_india_events.3.d: "Возвратиться домой."
 cape_route_to_india_events.3.historical_info: "Сан-Томе был необитаем, пока примерно в 1470 году к его берегам не приплыли португальские мореплаватели. Экваториальный климат был крайне губителен для европейских поселенцев — смертность от болезней была высокой. Однако для выращивания сахарного тростника местные условия были чрезвычайно благоприятны. К 1520-м годам Сан-Томе стал крупнейшим в мире производителем сахарного тростника. На его плантациях трудились почти исключительно порабощённые африканцы. Позднее остров превратился в один из главных перевалочных пунктов трансатлантической работорговли и сохранял эту роль более двух столетий подряд."
 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "Устье Великой реки"
 cape_route_to_india_events.4.desc: "Здесь океан меняет свой цвет на бурый. Уже целый день моряки наблюдают, как бирюзовое море смешивается с густой, мутно-коричневой, цвета крепкого чая илистой жижей. А затем они видят исток этого потока: река, шире любой реки в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! и шире всех рек, которые доводилось видеть этим людям, впадает в [ShowContinentName('atlantic_ocean_continent')] мощным бурым потоком, окрашивая море на многие километры вокруг.\n\nИз мангровых зарослей появляются огромные лодки тридцать футов в длину, выдолбленные из цельного ствола дерева. В каждой по дюжине гребцов, которые приводят её в движение с безупречной слаженностью. Стоящие на носу лодок мужчины безоружны. Они наблюдают за флотом со спокойным любопытством людей, которые не испытывают страха перед чужаками."
 cape_route_to_india_events.4.a: "Испросим аудиенции, если правитель этих земель [target_owner.Custom('GetRulerOrRegentTitle')] сможет нас принять."
 cape_route_to_india_events.4.b: "Закупим у местных слоновую кость, медь и всё, что они предложат."
 cape_route_to_india_events.4.c: "Нанесём устье реки на карту и продолжим путь на юг — мы не можем задерживаться."
 cape_route_to_india_events.4.d: "Возвратиться домой."
 cape_route_to_india_events.4.historical_info: "Королевство Конго было одним из наиболее развитых политических образований Африки к югу от Сахары. Под его властью находились обширные территории, охватывавшие значительную часть современных Конго, Анголы и Габона. Маниконго (король) правил посредством иерархической бюрократии и опирался на сложную систему управления провинциями. В 1480-х годах португальские миссионеры установили контакты с королевством, положив начало отношениям, которые оказали глубокое влияние на обе стороны, а в конечном счёте обернулись для них катастрофой. В 1490-х годах королевство приняло христианство, а правящий на тот момент маниконго взял имя Жуан I."
 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
 cape_route_to_india_events.5.desc: "Каждый офицер экспедиции узнаёт это место с первого взгляда. Никто из моряков не встречал на всём африканском побережье гавани, подобной этой: длинная изогнутая бухта, защищённая с юго-запада естественной песчаной косой, глубоководье до самого берега и небольшой мыс за бухтой, откуда открывается обзор во все стороны. Местные рыбаки называют её Лоандой — «плоским местом».\n\nВ лучах послеполуденного солнца [target_leader.GetName] проходит вдоль всей песчаной косы: по одну сторону лежит бухта, по другую простирается открытый [ShowContinentName('atlantic_ocean_continent')]. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] уже думает о возведении крепостных стен. И о пресной воде. И о том, сколько кораблей местный гарнизон сможет защитить или перехватить. Город, основанный в этой бухте, мог бы установить контроль над всей торговлей южной Атлантики."
 cape_route_to_india_events.5.desc.owned: "Флот входит в бухту, чьи достоинства и без того очевидны: над Луандой уже реет флаг #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а длинная песчаная коса укрывает корабли, служащие нашей короне.\n\nВ лучах послеполуденного солнца [target_leader.GetName] проходит вдоль всей песчаной косы: по одну сторону лежит бухта, по другую простирается открытый [ShowContinentName('atlantic_ocean_continent')]. [Select_CString(target_leader.IsFemale, 'Она', 'Он' )] думает уже не о том, стоит ли захватывать эту землю, а о том, сколько ещё она может дать. Если ещё основательнее укрепить город, он мог бы установить контроль над всей торговлей южной Атлантики."
 cape_route_to_india_events.5.a: "Построим здесь крупную фейторию — ей не будет равных."
 cape_route_to_india_events.5.a.owned: "Расширим нашу крупную факторию в Луанде — на всём побережье ей не будет равных."
 cape_route_to_india_events.5.b: "Построим небольшую факторию и продовольственный склад."
 cape_route_to_india_events.5.b.owned: "Расширим имеющиеся здесь факторию и продовольственный склад."
 cape_route_to_india_events.5.c: "Отметим это место на картах и продолжим путь на юг."
 cape_route_to_india_events.5.d: "Возвратиться домой."
 cape_route_to_india_events.5.historical_info: "Луанда была официально основана в качестве португальской колонии в 1575 году под руководством Паулу Диаша де Новаиша и стала одним из старейших европейских поселений в Африке к югу от Сахары. Благодаря естественной гавани она на протяжении более четырёх столетий оставалась главным портом португальской Анголы. Начиная с XVI века Луанда превратилась в главный порт отправки невольников в рамках трансатлантической работорговли в южной части Африки: отсюда миллионы людей вывозили в Бразилию и на Карибы."
 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "Пустынное побережье"
 cape_route_to_india_events.6.desc: "Здесь пустыня подходит к самому морю, красные дюны поднимаются прямо от линии прибоя, а с их гребней ветер уносит в воздух струящийся песок. Ни деревьев, ни малейших признаков пресной воды. Побережье к северу, которое моряки прозвали [ShowLocationName('skeleton_coast')], из-за белеющих на пляже китовых костей, кажется совершенно безлюдным на сотни миль во все стороны.\n\nИ всё же бухта спокойна. Укрытая от мощных океанских волн, она позволяет флоту починить повреждённую мачту и пополнить запасы воды из солоноватого источника среди дюн. На крутом берегу над бухтой штурман с помощью своих инструментов измеряет угол солнца и делает записи. Мыс Бурь, говорит он, находится всего в неделе плавания к югу. Некоторые моряки осеняют себя крестным знамением."
 cape_route_to_india_events.6.a: "Ободрим команду: до Мыса Бурь рукой подать. Вперёд!"
 cape_route_to_india_events.6.b: "У этих течений и ветров свой язык, и я умею его читать."
 cape_route_to_india_events.6.c: "Пусть люди отдохнут: им понадобятся силы для бурь, которые ждут нас впереди."
 cape_route_to_india_events.6.d: "Пора поворачивать домой — это побережье слишком пустынно, зачем испытывать судьбу дальше?"
 cape_route_to_india_events.6.historical_info: "Португальские моряки называли побережье Намибии #italic «Costa dos Esqueletos»#!, или #italic «Берег Скелетов»#!, из-за обилия китовых и тюленьих костей, а также обломков кораблей, выброшенных на наветренный берег мощными юго-западными ветрами. Залив Уолфиш-Бей, названный голландцами #italic «Walvischbaai»#!, или #italic «Китовый залив»#!, был одной из немногих защищённых якорных стоянок на этом в остальном крайне негостеприимном побережье. В 1488 году Бартоломеу Диаш сделал здесь остановку во время плавания на юг."
 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "Мыс Бурь"
 cape_route_to_india_events.7.desc: "За три месяца плавания ничто не могло подготовить моряков к такому испытанию. Буря налетает с юго-запада без предупреждения, обрушивая на корабли волны высотой в сорок футов. Головной корабль исчезает в глубокой впадине между волнами, и на несколько мгновений все с замиранием сердца ждут, появится ли он вновь. Такелаж рвётся, а матросов сбрасывает с мачт. [target_leader.GetName] обеими руками вцепляется в кормовой поручень и смотрит на хаос вокруг себя. И где-то среди какофонии ветра и грохота разбивающихся волн [Select_CString(target_leader.IsFemale, 'она', 'он')] понимает: они прошли мыс Бурь. Великая южная оконечность Африки, край известного мира, осталась за кормой.\n\nПуть в Индию открыт."
 cape_route_to_india_events.7.a: "Наречём его мысом Доброй Надежды и без промедления в путь на восток!"
 cape_route_to_india_events.7.b: "Укроемся с подветренной стороны мыса и переждём бурю."
 cape_route_to_india_events.7.d: "Мы сделали достаточно: Мыс Бурь обогнули. Поворачиваем домой."
 cape_route_to_india_events.7.historical_info: "В 1488 году Бартоломеу Диаш впервые обогнул южную оконечность Африки и нарёк её #italic «Cabo das Tormentas»#!, или #italic «Мыс Бурь»#!. Согласно португальским источникам, король Жуан II впоследствии переименовал его в #italic «Cabo da Boa Esperança»#!, или #italic «Мыс Доброй Надежды»#!, рассчитывая воодушевить будущих мореплавателей. Не исключено, что эта история просто вымысел. Мыс не является самой южной точкой Африки — это первенство принадлежит мысу Агульяс, расположенному примерно в двухстах километрах восточнее. Однако мыс Доброй Надежды отмечает место встречи Атлантического и Индийского океанов и служит воротами на восток."
 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "Залив Пастухов"
 cape_route_to_india_events.8.desc: "Бухта спокойна и прекрасна. С юго-запада её защищает невысокий мыс. Вдоль берега растут млечные деревья, дающие желанную тень. А на склоне холма над пляжем пасётся скот — упитанные, здоровые животные, собравшиеся в огромные стада. За ними присматривают высокие люди, носящие красновато-жёлтую раскраску и стеклянные бусы. С тех пор как флот бросил якорь, они наблюдают за кораблями с безопасного расстояния.\n\nПри виде свежего мяса у некоторых моряков на глазах наворачиваются слёзы. Они неделями питаются одной лишь солёной рыбой и чёрствыми сухарями. Наконец один из пастухов спускается к самой воде и замирает там, наблюдая за флотом, пока капитан не садится в длинную шлюпку и не направляется ему навстречу. На берегу начинается обмен: #TOOLTIP:GOODS,copper,X #L медные#!#! кольца, сушёная рыба и множество терпеливых жестов. К наступлению ночи в трюме оказываются три коровы. Для каждого моряка на корабле мычание становится самым прекрасным звуком, какой ему когда-либо доводилось слышать."
 cape_route_to_india_events.8.a: "Закупим у местных медь, текстиль для скота и воздвигнем #italic падран#!."
 cape_route_to_india_events.8.a.morale_tt: "Боевой дух экипажей значительно крепнет (#G +15#! к боевому духу)"
 cape_route_to_india_events.8.b: "Воздвигнем #italic падран#!! [ROOT.GetCountry.GetNameWithNoTooltip] заявл[ROOT.GetCountry.Custom('end_etyut')] права на эти земли."
 cape_route_to_india_events.8.b.morale_tt: "Боевой дух экипажей несколько крепнет (#G +8#! к боевому духу)"
 cape_route_to_india_events.8.c: "Дадим нашим людям немного передохнуть и восстановить силы, прежде чем мы продолжим путь на север."
 cape_route_to_india_events.8.c.morale_tt: "Боевой дух экипажей заметно крепнет (#G +10#! к боевому духу)"
 cape_route_to_india_events.8.d: "Возвратиться домой."
 cape_route_to_india_events.8.historical_info: "Среди португальских мореплавателей Залив Моссел называли #italic «Bahia dos Vaqueiros»#!, или #italic «Залив Пастухов»#!, а позднее — #italic «Aguada de São Brás»#!, или #italic «Водопой Святого Власия»#!. В 1488 году Бартоломеу Диаш установил здесь каменный #italic падран#! — традиция, которую в 1497 году продолжил Васко да Гама. Готтентоты, коренные жители этих мест, поначалу охотно торговали с участниками обеих экспедиций, но затем отношения между ними испортились. Когда люди Васко да Гамы попытались набрать пресной воды без должной платы, местные жители забросали их камнями."
 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "Золотой порт Софалы"
 cape_route_to_india_events.9.desc: "Гавань Софалы заполнена дау. Это не привычные флоту небольшие рыбацкие лодки, которых было изрядно вдоль южного побережья, а океанские суда из #TOOLTIP:REGION,arabia_region,X #L Аравии#!#! и #TOOLTIP:REGION,persia_region,X #L Персии#!#!, осевшие под тяжестью груза #TOOLTIP:GOODS,ivory,X #L поделочной кости#!#!, эбенового дерева и #TOOLTIP:GOODS,cloth,X #L текстиля#!#!. На набережной купцы ведут торговлю на #TOOLTIP:LANGUAGE,arabic_language,X #L арабском#!#! и [location.GetDominantCulture.GetLanguage.GetAdjective|l]ом, который не может определить ни один из переводчиков флота. Рулоны индийской хлопковой ткани меняют на крошечные щепотки золотого песка.\n\nАрабские купцы, на протяжении столетий заправлявшие всеми делами в этом порту, наблюдают за прибытием [ROOT.GetCountry.GetAdjective|l]ого флота из-под навесов своих складов. Их лица непроницаемы, но позы выдают отношение к происходящему: появление этих чужаков, вооружённых железными пушками и украсивших паруса крестами, не сулит ничего доброго. Капитан флота отмечает в своём журнале крупнейшие склады, расположение стоянок дау и глубину у входа в бухту."
 cape_route_to_india_events.9.a: "Построим здесь крупную фейторию. Местное золото обогатит [ROOT.GetCountry.Custom('CL_ACC')]."
 cape_route_to_india_events.9.a.owned: "Вложим средства в нашу факторию в Софале. Это золото обогатит [ROOT.GetCountry.Custom('CL_ACC')]."
 cape_route_to_india_events.9.b: "Закупим у местных золотой песок и разузнаем, что находится в глубине материка."
 cape_route_to_india_events.9.c: "Соберём нужные сведения и отправимся в путь — время дорого."
 cape_route_to_india_events.9.d: "Возвратиться домой."
 cape_route_to_india_events.9.historical_info: "Софала была самым южным крупным портом торговой сети суахили и контролировала доступ к золотым приискам в царстве #italic Мутапа#!, или #italic Великий Зимбабве#!, расположенном на горном плато к западу. Арабские купцы вели здесь торговлю как минимум с X века. В 1505 году португальцы захватили Софалу, разрушили арабскую торговую сеть и попытались перенаправить торговлю золотом по собственным каналам. Им удалось это лишь отчасти, поскольку значительная часть торговли переместилась во внутренние районы, куда португальцы ещё не смогли проникнуть."
 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "Остров [ShowLocationNameWithNoTooltip('mozambique')]"
 cape_route_to_india_events.10.desc: "Небольшой остров, не более трёх километров в поперечнике, отделённый от материка узким проливом, глубины которого едва хватает для прохода океанских судов. На острове возвышается каменная фактория под зелёным флагом, а гавань заполнена дау, прибывшими со всех концов #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Индийского океана#!#!. Из внутренних районов поступает #TOOLTIP:GOODS,ivory,X #L поделочная кость#!#! и эбеновое дерево, с материка пригоняют невольников, с юга доставляют [ShowGoodsName('copper')|l], а из Индии и Китая везут [ShowGoodsName('cloth')|l] и [ShowGoodsName('porcelain')|l] — и всё это кочует из рук в руки по торговым путям, не угасавшим уже шесть столетий кряду.\n\n[target_ruler_country.Custom('GetRulerOrRegentTitle')] обладает немалым богатством и подозрительностью. Купцы из #TOOLTIP:CULTUREGROUP,arabian_group,X #L Аравии#!#!, прибывшие сюда раньше флота, предупредили [Select_CString(target_ruler.IsFemale, 'её', 'его')], что чужеземцы — [ROOT.GetCountry.GetReligion.GetAdjective|l]ие пираты, которые уничтожают всё, что не могут украсть. [target_ruler.GetHeShe|U] принимает посланника флота с осторожной учтивостью, в окружении вооружённой стражи, и настойчиво расспрашивает об оружии. Оказавшись в самом сердце гавани, под прицелом многочисленных пушек, [target_ruler.GetHeShe|l] вряд ли чувствует себя в безопасности — во всяком случае, [ROOT.GetCountry.GetAdjective|l]ие разбойники сочли бы такое положение довольно неуютным."
 cape_route_to_india_events.10.a: "[target_ruler_country.Custom('GetRulerOrRegentTitle')] не чурается брать взятки, посулите товары и выкупите право на строительство."
 cape_route_to_india_events.10.b: "Выторгуем торговые права с помощью дипломатических уловок и богатых даров."
 cape_route_to_india_events.10.c: "Предложим арабским купцам более выгодные условия, переманим местных, и тогда [target_ruler_country.Custom('GetRulerOrRegentTitle')] будет на нашей стороне."
 cape_route_to_india_events.10.d: "Пока признаем притязания, которые выдвигает [target_ruler_country.Custom('GetRulerOrRegentTitle')], и продолжим путь на север."
 cape_route_to_india_events.10.f: "Воздвигнем #italic падран Святого Георгия#!."
 cape_route_to_india_events.10.e: "Возвратиться домой."
 cape_route_to_india_events.10.historical_info: "Остров Мозамбик стал важнейшей португальской опорной базой в Восточной Африке после официального основания здесь фактории в 1507 году. Форт Сан-Себастьян, построенный в XVI веке, и сегодня остаётся одной из старейших сохранившихся европейских крепостей в Африке к югу от Сахары. Более двух столетий остров служил административным центром португальских владений в Восточной Африке и промежуточной остановкой на морском пути в Индию. Его захват фактически разрушил систему арабского контроля над торговой сетью северного побережья суахили."
 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "Западня у Момбасы"
 cape_route_to_india_events.11.desc: "Проход в гавань Момбасы довольно узок, не более двух кабельтовых. По обеим сторонам возвышаются берега. Когда корабли заходят в гавань, экипажи начинают подозревать неладное. На набережной беззаботно прохаживаются люди, чья показная непринуждённость выдаёт в них хорошо вооружённых людей, которым приказали изображать безоружных. Дау стоит на якоре в необычном месте, словно намереваясь перекрыть выход из пролива. А посланник, которого отправляет [target_ruler_country.Custom('GetRulerOrRegentTitle')], поднявшись на флагмана с дарами и почестями, задаёт подозрительно много вопросов о количестве вооружённых на борту.\n\nВ ту ночь переводчик, служивший при флоте, тайком пробирается в каюту капитана. Перед тем как вернуться на берег, посланник разговаривал со своими спутниками на [location.GetDominantCulture.GetLanguage.GetAdjective|l]ом языке, который переводчик знает. Слова посланника не оставляли сомнений: флоту не позволят покинуть Момбасу."
 cape_route_to_india_events.11.a: "Отчалим до рассвета, подобный приём не стоит риска."
 cape_route_to_india_events.11.b: "Останемся и попытаемся поторговать, несмотря на очевидную напряжённость в отношениях."
 cape_route_to_india_events.11.c: "Если они замышляют какое-то вероломство, мы нанесём удар первыми. Всем приготовиться!"
 cape_route_to_india_events.11.d: "Пора домой — мы не станем здесь рисковать флотом."
 cape_route_to_india_events.11.historical_info: "В апреле 1498 года Васко да Гама едва не попал в засаду у Момбасы. Согласно португальским источникам, предоставленные султаном местные лоцманы попытались направить корабли флота на песчаную отмель. Да Гама отвёл флот, прежде чем ловушка захлопнулась. В последующие десятилетия португальцы неоднократно возвращались, чтобы обстрелять и разграбить Момбасу. Построенный в 1593 году форт Иисус обеспечил португальцам контроль над гаванью, однако в 1698 году, после продолжительной осады, город захватили оманцы."
 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "Дружественный [target_ruler_country.Custom('GetRulerOrRegentTitle')|l]"
 cape_route_to_india_events.12.desc: "В [ShowLocationName('malindi')] всё иначе, чем в других местах, где флот бывал прежде. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] [target_ruler.GetName] спускается к гавани в одежде из белого и зелёного шёлка в сопровождении музыкантов, играющих на инструментах, звучания которых никто из [ROOT.GetCountry.GetAdjective|l]их путешественников раньше не слышал. Благодаря своим связям на юге [target_ruler.GetSheHe|U] уже знает о приближении флота и ожидает его прибытия.\n\nУ [Select_CString(target_ruler.IsFemale, 'неё', 'него')] есть дар, который ценнее слоновой кости — лоцман, двенадцать раз ходивший морем в Каликут. Он знает каждое течение, каждый риф и каждую перемену ветра на пути отсюда к Малабарскому побережью. Он знает, когда юго-западный муссон позволит кораблю пересечь [ShowContinentName('indian_ocean_continent')] за три недели, а когда погубит его за двадцать четыре часа. Имя лоцмана, настаивает [target_ruler.GetNameWithNoTooltip], трудно передать на европейском языке. Но [Select_CString(target_ruler.IsFemale, 'её', 'его')] знания не нуждаются в переводе, и цена этих знаний — дружба."
 cape_route_to_india_events.12.a: "Мы с радостью примем и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] лоцмана, и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] дружбу."
 cape_route_to_india_events.12.b: "[target_ruler_country.Custom('GetRulerOrRegentTitle')] получит от нас подарки, помощь и защиту."
 cape_route_to_india_events.12.c: "[ROOT.GetCountry.GetReligion.GetGodName|U] ждёт от нас свершений. Помолимся же перед отплытием!"
 cape_route_to_india_events.12.e: "Возведём #italic падран Эспириту-Санту#! и приступим к великой миссии."
 cape_route_to_india_events.12.d: "Вернёмся домой: до Каликута далеко, и путешествие обещает быть опасным."
 cape_route_to_india_events.12.historical_info: "Из-за давней вражды с Момбасой султан Малинди благоволил португальцам, надеясь, что они помогут ему получить перевес в затяжной борьбе. Личность знатока Индийского океана, предоставленного Васко да Гаме — в португальских источниках он известен как Малемо Канака, — долгие столетия оставалась предметом научных споров. Некоторые историки полагают, что это Ахмад ибн Маджид — величайший арабский лоцман XV века, автор целого ряда трудов о пересечении Индийского океана. Другие решительно отвергают эту теорию и считают, что речь идёт о гуджаратском купце. Кем этот человек был на самом деле, неизвестно до сих пор."
 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "Каликут — столица пряностей"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] крупнее, чем [ROOT.GetCountry.GetCapital.GetName]. В этом порту столько кораблей, что и не сосчитать: здесь стоят суда из #TOOLTIP:REGION,arabia_region,X #L Аравии#!#!, #TOOLTIP:REGION,persia_region,X #L Персии#!#!, #TOOLTIP:AREA,gujarat_area,X #L Гуджарата#!#!, #TOOLTIP:REGION,bengal_region,X #L Бенгалии#!#!, Китая, #TOOLTIP:LOCATION,malacca,X #L Малакки#!#! и с острова #TOOLTIP:AREA,java_area,X #L Ява#!#!. #TOOLTIP:GOODS,pepper,X #L Перец#!#!, корица, кардамон и #TOOLTIP:GOODS,cloves,X #L гвоздика#!#! обладают воистину чародейской притягательностью! Флот бросает якоря на рейде, уже заставленном дау, и #TOOLTIP:CULTUREGROUP,arabian_group,X #L аравийские#!#! купцы наблюдают за этой толчеёй с берега.\n\nЦелых два месяца [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] — [Select_CString(target_ruler.IsFemale, 'правительница', 'правитель' )] Каликута, редко [Select_CString(target_ruler.IsFemale, 'покидающая', 'покидающий' )] свою пышную обитель, — слышит, что пришельцы — вовсе не торговцы, а пираты с холодного севера. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] [Select_CString(target_ruler.IsFemale, 'согласилась', 'согласился' )] принять капитана из дальних земель, однако [Select_CString(target_ruler.IsFemale, 'её', 'его' )] [target_ruler_country.GetGovernment.GetCourtTitle|l] остаётся настороже, а [Select_CString(target_ruler.IsFemale, 'её', 'его' )] купцы заметно нервничают. В местном воздухе витает аромат чёрного перца и морской соли: торговые суда бороздят эти воды уже тысячу лет. Судьба экспедиции решится в ближайший час."
 cape_route_to_india_events.13.a: "Пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] оценит наши товары, а после запросим факторию."
 cape_route_to_india_events.13.b: "Озвучим требования: фиксированные пошлины, защита и безопасная стоянка."
 cape_route_to_india_events.13.c: "Обвиним аравийских купцов во лжи. Пусть [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] выбирает."
 cape_route_to_india_events.13.d: "Прислушаемся к совету лоцмана. Он и [target_ruler_country.GetGovernment.GetCourtTitle|l] — старые знакомые."
 cape_route_to_india_events.13.e: "Выставим #italic падран Сан-Габриела#! на всеобщее обозрение."
 cape_route_to_india_events.13.historical_info: "Порт Кожикоде, который европейцы называли Каликутом, был одним из важнейших узлов торговли специями в Индийском океане. Правил им #italic самутири#! — «владыка морей», также известный как заморин. Он поддерживал равновесие между аравийскими купцами, которые играли ключевую роль в торговле, индийскими государствами-соперниками и — позднее — гостями из Европы. Первый приём Васко да Гамы в 1498 году прошёл неоднозначно: его дары посчитали недостаточно ценными, а аравийские купцы сумели настроить двор против него. В итоге капитан покинул гавань лишь с небольшим и незначительным грузом. Выгодного сотрудничества удалось добиться только в ходе последующих экспедиций и после угроз применить против второй стороны корабельную артиллерию."
 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "Золотой Берег"
 cape_route_to_india_events.14.desc: "Лес находится в дне пути от побережья, и по этой дороге ходят довольно часто. Два-три раза в неделю на пляж прибывают караваны: работники переносят золотой песок, добытый из речного гравия во внутренних землях. #TOOLTIP:CULTURE,$akan_tt$, #L Аканские#!#! короли контролируют россыпные месторождения и продают излишки золота через вангарскую торговую сеть, которой исполнилось уже четыре столетия.\n\nПодданные #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! наслышаны об этом месте. Любой #TOOLTIP:CULTUREGROUP,arabian_group,X $tt_op_L$аравийский$tt_cl_2$ капитан, которому доводилось тут торговать, называл рынки Золотого Берега богатейшими на всём побережье Гвинеи. Местные жители привыкли к иностранным судам и не боятся чужаков: их интересует лишь потенциальная выгода."
 cape_route_to_india_events.14.a: "Воздвигнем форт Сан-Жоржи-да-Мина, и аканы будут торговать с его комендантом."
 cape_route_to_india_events.14.a.owned: "Укрепим форт Сан-Жоржи-да-Мина: аканы уже торгуют с нашим государством."
 cape_route_to_india_events.14.b: "Договоримся о пленных, которых аканы берут в качестве военной дани."
 cape_route_to_india_events.14.c: "Нападём на поселение, пока вангарские купцы не отбыли."
 cape_route_to_india_events.14.d: "Подумаем потом, а пока двинемся на юг. Медлить нельзя."
 cape_route_to_india_events.14.e: "Вернёмся домой. Что ещё нужно, кроме золота?"
 cape_route_to_india_events.14.historical_info: "В 1482 году португальцы построили на Золотом Берегу форт Сан-Жоржи-да-Мина, также известный как крепость Элмина. Материалами послужили камень, добытый на соседнем мысе, а также древесина, заготовленная в Португалии и доставленная по морю. Сооружение воздвигли всего за несколько недель: отчасти благодаря договорённости с местным вождём Карамансой, отчасти просто из-за спешки. Изначально задача форта состояла в контроле над торговлей золотом с аканскими лесными королевствами, однако за несколько десятилетий крепость превратилась в главный узел работорговли в Атлантическом океане: сюда доставляли пленников, захваченных в местных войнах. После их отправляли на запад: на сахарные плантации острова Сан-Томе, а впоследствии — Бразилии. Историк Уолтер Родни посчитал, что торговля с Золотым Берегом приносила португальцам несколько сотен тысяч крузадо в год, пока рабы не вытеснили золото с позиции основного товара."
 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "Остров Фернандо-По"
 cape_route_to_india_events.15.desc: "Из вод Гвинейского залива поднимается остров: это вулканический пик, увенчанный облаками и густо поросший джунглями, спускающимися к самой воде. Здесь живёт народ #TOOLTIP:CULTURE,$bubi_tt$, #L буби#!#!, прежде не видавший европейцев. Прячась за деревьями, местные наблюдают, как флот останавливается в естественной бухте, а моряки спускают лодку на воду.\n\nПутешественник, в честь которого назван остров, побывал тут несколько десятилетий назад и лишь в общих чертах нанёс объект на карту. У лоцмана эта карта есть, но на ней не указано, стоит ли вообще останавливаться в этом месте."
 cape_route_to_india_events.15.desc.owned: "Остров по-прежнему возвышается над волнами: это вулканический пик, увенчанный облаками и густо поросший джунглями, спускающимися к самой воде. Однако над якорной стоянкой уже реет португальский флаг, а наш флот встречают соотечественники на лодках.\n\nТеперь [target_leader.GetName] может не гадать, стоит ли здесь останавливаться. Вопрос в том, какую ещё выгоду можно извлечь из этого оплота [ROOT.GetCountry.Custom('CL_GEN')], который контролирует торговлю в Гвинейском заливе."
 cape_route_to_india_events.15.a: "Учредим на острове форпост и будем управлять торговлей в Гвинейском заливе."
 cape_route_to_india_events.15.a.owned: "Укрепим форпост на острове: мы уже установили контроль над торговлей в Гвинейском заливе."
 cape_route_to_india_events.15.b: "Воздвигнем #italic падран#!, нанесём остров на карту и присвоим его себе."
 cape_route_to_india_events.15.c: "Починим донья, наполним бочки и запасёмся провизией."
 cape_route_to_india_events.15.c.tt: "Корпуса чистят и смолят, так что в этом путешествии корабельные черви флоту не страшны"
 cape_route_to_india_events.15.d: "Вернёмся домой. В конце концов, Гвинейский залив мы исследовали."
 cape_route_to_india_events.15.historical_info: "В 1472 году португальский мореплаватель Фернан ду По стал первым европейцем, добравшимся до острова Фернандо-По, ныне известного как Биоко. Народ буби, уединённо проживавший тут столетиями, прибыл сюда с большой земли намного раньше. Португальцы использовали остров как перевалочный пункт, но основать постоянное поселение им не удавалось: отчасти из-за тропических болезней, а отчасти из-за того, что буби не шли с ними на контакт. В последующие века Биоко несколько раз переходил из рук в руки: так, в 1778 году по договору в Эль-Пардо Португалия передала остров Испании в обмен на территориальные уступки в Южной Америке. В конечном итоге он вошёл в состав современной Экваториальной Гвинеи."
 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "Город морского султана"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] крупнее, чем мы ожидали. Городская гавань заполнена индийскими и #TOOLTIP:REGION,arabia_region,X #L аравийскими#!#! дау: их трюмы ломятся от #TOOLTIP:GOODS,cloth,X #L текстиля#!#!, #TOOLTIP:GOODS,copper,X #L меди#!#! и #TOOLTIP:GOODS,porcelain,X фарфора#!. [ShowLocationNameWithNoTooltip('mogadishu')] правит [target_owner.Custom('GetRulerOrRegentTitle')|l]: этот человек, которого назначает [target_owner.GetName], руководит торговлей между #TOOLTIP:CULTURE,$somali_culture_tt$,X #L сомалийцами#!#! и внешним миром. Купцы, собравшиеся на пристани, оценивающе разглядывают наши суда. Мы не первые чужаки, прибывшие сюда под незнакомыми флагами и с диковинными товарами, но, возможно, из столь далёких западных земель сюда ещё никто не добирался."
 cape_route_to_india_events.16.a: "Будем торговать с сомалийскими купцами. Для нас важны любые связи."
 cape_route_to_india_events.16.b: "Понаблюдаем и двинемся на север. В конце концов, наша цель — $india$."
 cape_route_to_india_events.16.c: "Повернём назад. Путь нам неизвестен, а провизия на исходе."
 cape_route_to_india_events.16.historical_info: "Могадишо был одним из старейших и богатейших приморских городов Восточной Африки. Его широкие торговые связи начали формироваться за столетия до прибытия португальцев: на аравийских картах он значился как крупный порт уже в IX веке. Во времена Васко да Гамы Могадишо находился во власти султаната и входил в торговую сеть Суахильского побережья, которая соединяла Африку с Аравией, Персией и Индийским макрорегионом. Решение португальцев обойти эти города-государства или подчинить их силой ради установления собственной торговой монополии привело к прямому противостоянию с уже существующей и, к тому же, высокоэффективной коммерческой системой."
 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "Ибадитский порт"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] возвышается над красными скалами, и море пахнет здесь по-другому: его аромат суше и резче, в нём ощущается #TOOLTIP:GOODS,salt,X #L соль#!#! с примесью пыли. Эта гавань — одна из лучших в #TOOLTIP:PROVINCE_DEFINITION,arabian_sea_province,X #L Аравии#!#!: воды здесь достаточно глубоки для крупных судов, а рельеф надёжно защищает город от юго-западного муссона. #TOOLTIP:CULTURE,$omani_culture_tt$,X #L Оманские#!#! купцы открыли путь в Индию уже тысячу лет тому назад. Людям на пристани прекрасно известны все ветра, сроки и маршруты. Они знают, когда отправиться в плавание, а когда лучше повременить. Они смотрят на нас, пытаясь угадать, чего мы хотим."
 cape_route_to_india_events.17.a: "Разыщем оманские власти и представимся им."
 cape_route_to_india_events.17.b: "Приобретём карты в Индию у аравийских лоцманов."
 cape_route_to_india_events.17.c: "Пополним запасы и отчалим. Оманские моряки нам не друзья."
 cape_route_to_india_events.17.d: "Повернём назад. Путешествие в Индию нам не по плечу."
 cape_route_to_india_events.17.historical_info: "Маскат был ключевым портом ибадитского имамата Оман — одной из крупнейших морских держав в западной части Индийского океана. Оманские моряки превосходно знали судоходные маршруты и расписание муссонных ветров, ведь от этого зависела продолжительность путешествий между Аравией и Индийским макрорегионом. Прибытие португальцев подставило под удар посредническую роль оманцев в торговле пряностями: отношения этих двух народов оставались напряжёнными в течение почти всего XVI столетия, и в итоге конфликт вылился в череду войн за контроль над Персидским заливом и восточно-африканскими портами. В XVII веке оманцы вытеснили португальцев из большинства своих оплотов в Восточной Африке."
 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "Португальцы построили фейторию"
 cape_route_to_india_events.18.desc: "Португальцы застали нас врасплох. Они бросили якоря на внешнем рейде и направили артиллерию на гавань. Их просьба, вежливая по форме, по сути была безапелляционной. Они хотят построить факторию. Они согласны платить небольшой налог. Они будут уважать местные законы. Они не упомянули, что произойдёт, если мы им откажем, но этого и не потребовалось. Древесину португальцы заготовили заранее и привезли в трюмах. Факторию возвели за считаные дни. Теперь там, где прежде развевалось наше знамя, красуется #L [por_feitoria_builder.GetAdjective|l]ий#! крест."
 cape_route_to_india_events.18.a: "У нас нет выбора: против пушек не попрёшь."
 cape_route_to_india_events.18.b: "Мы протестуем: наш суверенитет надо уважать."
 cape_route_to_india_events.18.historical_info: "Португальская система фейторий стала одним из первых примеров европейского торгового империализма в Африке и Азии. Строительство укреплённых купеческих поселений в чужих портах позволило португальцам внедриться в уже сформированные торговые сети, не тратя силы на полноценные завоевания. Если местные правители принимали условия, им предоставляли доступ к португальским товарам и обеспечивали защиту от врагов с моря, если отказывались, в ход шла артиллерия. Таким образом, Индийский океан из сравнительно свободного торгового пространства превратился в вотчину португальского флота, фактически монополию компании «Каса-да-Индия»."
 cape_route_to_india_events.provisioned_25_tt: "Флот полностью обеспечен припасами, и экипажи будут легче переносить дальнейшее путешествие (#G +25#! к провизии)"
 cape_route_to_india_events.provisioned_30_tt: "Флот полностью обеспечен припасами, и экипажи будут легче переносить дальнейшее путешествие (#G +30#! к провизии)"
 cape_route_to_india_events.provisioned_40_tt: "Флот полностью обеспечен припасами, и экипажи будут легче переносить дальнейшее путешествие (#G +40#! к провизии)"
