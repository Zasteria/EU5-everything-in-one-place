l_russian:
 treasure_fleet_events.1.title: "Эпоха морских экспедиций"
 treasure_fleet_events.1.entry: "$treasure_fleet_events.1.title$"
 treasure_fleet_events.1.desc: "Последние десятилетия были на редкость изобильными, и в казне скопилось большое количество золота и других ресурсов. Эти средства можно направить на дальнейшее укрепление и без того сильных позиций #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного государства#!#! в глазах остального мира. Мы построим огромный флот и отправим во все концы света эскадры, полные самых драгоценных сокровищ #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, чтобы убедить заморские страны вступить в ряды наших #TOOLTIP:SUBJECT_TYPE,tributary,X #L данников#!#!."
 treasure_fleet_events.1.a: "Так мы и сделаем!"
 chi_able_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] получит доступ к [Concept('action', 'действию')|e] «[ShowGenericActionName('start_a_treasure_voyage')]», которое позволяет в обмен на [Concept('gold', 'золото')|e] вовлекать новые страны в систему #TOOLTIP:SUBJECT_TYPE,tributary,X #L данников#!#!. Это возможно лишь до тех пор, пока [ROOT.GetCountry.GetName] остаётся [Concept('international_organization_leader_short', 'лидером')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,middle_kingdom,X #L Срединного государства#!#!."
 treasure_fleet_events.2.title: "Конец эпохи"
 treasure_fleet_events.2.desc: "Оглядываясь на эпоху морских экспедиций, жители #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! видят лишь напрасный расход средств. Ради мимолётного повышения престижа страны были потрачены колоссальные суммы. Будущим летописцам лучше не упоминать об этом постыдном эпизоде нашей истории…"
 treasure_fleet_events.2.a: "Что ж, ничего не поделаешь."
 chi_unable_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] больше не сможет использовать действие «[ShowGenericActionName('start_a_treasure_voyage')]»."
 treasure_fleet_events.3.title: "Отправление экспедиции"
 treasure_fleet_events.3.desc: "После долгих сборов наш великий флот наконец-то готов к отплытию. $expedition_leader_name$ с командой отправляются в неизвестность, по пути в область [target_area.GetName] они столкнутся с удивительными приключениями и страшными бедствиями, но мы уверены, что наши моряки не подведут — ведь для этой миссии их [Select_CString(ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale, 'отобрала сама', 'отобрал сам' )] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName].\n\nНа рассвете флот отплывёт из порта [start_location.Custom('LR_GEN')|l] [start_location.GetName]. Пройдёт не один год, прежде чем эскадра вернётся к нашим берегам. Пожелаем им доброго пути!"
 treasure_fleet_events.3.a: "Удачи!"
 chinese_treasure_expeditions_send_tooltip: "The $expedition_name_treasure_voyage$ is sent towards [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName] under the leadership of [character_expedition_leader_target.GetName].\nThe fleet holds #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [gold|e] worth in cargo intended for gifts to [countries|e] that they will visit."
 treasure_fleet_events.4.title: "Вести с $expedition_name_treasure_voyage$"
 treasure_fleet_events.4.desc: "A junk has put in at one of the southern ports with news from the $expedition_name_treasure_voyage$. The fleet under $expedition_leader_name$ has reached the harbor of [port_location.GetName] in the country of [port_country.GetName], and the local court has been received in due form. Trade goods have been exchanged, the customary gifts presented to the ruler. The fleet's chronicler reports the wind and the season are favorable for the next leg of the journey. There is, the captain notes, no immediate reason for the imperial court to expect ill news."
 treasure_fleet_events.4.a: "Пусть ветер и дальше будет попутным."
 treasure_fleet_events.5.title: "$expedition_name_treasure_voyage$ прибывает из [expedition_initiator.Custom('CL_GEN')]"
 treasure_fleet_events.5.desc: "На рассвете перед жителями [target_stop.Custom('LR_GEN')|l] [target_stop.GetName] предстаёт невероятное, даже пугающее зрелище. Горизонт превращается в настоящий лес мачт — к гавани приближается огромный #L [expedition_initiator.GetAdjective|l]ий#! флот #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#!. $expedition_leader_name$ во главе эскадры сходит на берег за разрешением пополнить припасы в [target_stop.Custom('LR_PREP')|l] [target_stop.GetNameWithNoTooltip]. А затем происходит нечто странное: [expedition_initiator.GetAdjectiveWithNoTooltip|l]ие моряки буквально осыпают местных чиновников ценными дарами. Они хотят, чтобы [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'приняла', 'принял' )] их делегацию."
 treasure_fleet_events.5.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] с радостью встретит чужеземных гостей."
 treasure_fleet_events.5.a.entry: "Пригласим их к нашему двору."
 treasure_fleet_events.6.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] принимает гостей"
 treasure_fleet_events.6.desc: "$expedition_leader_name$ со спутниками наконец-то прибыли во дворец. Поначалу [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'наша досточтимая', 'наш досточтимый' )] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'была глубоко впечатлена', 'был глубоко впечатлён' )] размерами их эскадры и щедрыми подарками. Тем сильнее было разочарование, когда чужеземцы, по сути, предложили нам стать [expedition_initiator.GetAdjectiveWithNoTooltip|l]ими #TOOLTIP:SUBJECT_TYPE,tributary,X #L данниками#!#!. С другой стороны, подчиняться столь могущественной державе не так плохо, как может показаться…"
 treasure_fleet_events.6.a: "Всякая дружба имеет свою цену."
 treasure_fleet_events.6.b: "Мы не покоримся!"
 chinese_expedition_resolution_tt: "$expedition_name_treasure_voyage$ из Китая следующие несколько месяцев простоит в порту [target_stop.GetName]. В это время будут происходить [Concept('events', 'события')|e], в ходе которых мы сможем пообщаться с китайцами и изменить их мнение о нас. Когда флот отплывёт домой, мы узнаем, какое впечатление наше вассальное государство произвело на посланников: \n\nПослушное (от #y 67#! до #y 100#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_positive', ROOT.GetCountry.MakeScope.Self)]\nДружелюбное (от #y 33#! до #y 66#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_positive', ROOT.GetCountry.MakeScope.Self)]\nРавнодушное (от #y −32#! до #y 32#!):\n$NOTHING_HAPPENS_EFFECT$\nНепочтительное (от #y −66#! до #y −33#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_negative', ROOT.GetCountry.MakeScope.Self)]\nНадменное (от #y −100#! до #y −67#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_negative', ROOT.GetCountry.MakeScope.Self)]"
 treasure_fleet_events.7.title: "Достойные дары"
 treasure_fleet_events.7.desc: "Завершив миссию на территории #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, золотой флот #ONCLICK:COUNTRY,[expedition_initiator.Custom('CL_tt')] #TOOLTIP:COUNTRY,[expedition_initiator.Custom('CL_tt')],X [expedition_initiator.Custom('CL_GEN')|L]#!#! готовится к скорому выходу в море. По обычаю, в знак уважения и в качестве подтверждения нашего статуса #TOOLTIP:SUBJECT_TYPE,tributary,X #L данников#!#! мы должны преподнести им всё самое лучшее, чем славится наша страна."
 treasure_fleet_events.7.a: "Мы продемонстрируем им свою щедрость."
 treasure_fleet_events.7.gift: "Мы преподнесём им свои диковинки."
 treasure_fleet_events.7.b: "Мы не можем себе этого позволить…"
 treasure_fleet_events.8.title: "Экспедиция отплывает"
 treasure_fleet_events.8.desc: "#L [expedition_initiator.GetAdjective]ий#! золотой флот наконец покидает гавань [target_stop.Custom('LR_GEN')|l] [target_stop.GetName]. Чужеземные гости надолго запомнят гостеприимство нашей страны, мы же пожелаем им удачи и доброго пути."
 treasure_fleet_events.8.a: "До свидания!"
 chi_fleet_will_depart: "#L [expedition_initiator.GetAdjective]ая#! экспедиция покинет #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!."
 chinese_expedition_opinion: "Мнение членов золотого флота"
 based_on_expedition_opinion: "$chinese_expedition_opinion$ сейчас составляет [ROOT.GetVariable('chinese_expedition_opinion').GetValue], поэтому произойдёт следующее:"
 treasure_fleet_events.9.title: "$expedition_name_treasure_voyage$ вернётся домой"
 treasure_fleet_events.9.desc: "Эскадра, которую мы несколько лет назад отправили в [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.Custom('LR_ACC')|l] [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName], наконец-то вернулась домой. Отважные мореплаватели привезли с собой чужеземных посланников и множество даров, полученных в ходе долгих странствий. $expedition_leader_name$ уже едет в столицу, чтобы представить ко двору зарубежных дипломатов и подарки из далёких стран."
 treasure_fleet_events.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.9.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.10.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] встречает экспедицию"
 treasure_fleet_events.10.desc: "$expedition_leader_name$ с триумфом возвращается в город [ROOT.GetCountry.GetCapital.GetName], и там экспедицию встречает ликующая толпа. Путешественники доставили ко двору посланцев из многих стран, готовых присягнуть на верность [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'нашей государыне', 'нашему государю' )]. [ROOT.GetCountry.GetGovernment.GetRulerTitle] весьма [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'обрадована', 'обрадован' )] их согласием посетить столицу."
 treasure_fleet_events.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.10.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.11.title: "Завершение экспедиции"
 treasure_fleet_events.11.desc: "$expedition_name_treasure_voyage$ вернулся домой. Осталось подвести итоги и понять, оправдала ли эта экспедиция затраченные средства и стоит ли организовывать столь дорогостоящие предприятия в будущем."
 treasure_fleet_events.11.a: "Нужно готовить новые экспедиции."
 chi_we_will_gift_cloves: "[expedition_initiator.GetName] получит от нас #TOOLTIP:GOODS,cloves,X #L гвоздику#!#!."
 chi_we_will_gift_giraffe: "[expedition_initiator.GetName] получит от нас жирафа."
 chi_we_will_gift_persian_blue: "[expedition_initiator.GetName] получит от нас местный #TOOLTIP:GOODS,dyes,X #L краситель#!#!."
 treasure_fleet_events.12.title: "Экзотический зверь"
 treasure_fleet_events.12.desc: "$expedition_name_treasure_voyage$ привозит домой дивного зверя, от вида которого [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] приходят в неописуемый восторг! Это крупное пятнистое животное с невероятно длинной шеей за границей именуют жирафом, однако наши придворные находят в нём поразительное сходство с #italic цилинем#! — существом из #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайских#!#! мифов, предвещающим золотой век для текущей династии. Мы можем использовать эту легенду, чтобы поднять свой престиж, но в таком случае мы завысим ожидания людей."
 treasure_fleet_events.12.a: "Это легендарный #italic цилинь#!!"
 treasure_fleet_events.12.b: "Зверь и впрямь удивительный."
 treasure_fleet_events.13.title: "Бесподобный цвет"
 treasure_fleet_events.13.desc: "Наша славная экспедиция привезла с #TOOLTIP:SUB_CONTINENT,middle_east,X #L Ближнего Востока#!#! удивительный #TOOLTIP:GOODS,dyes,X #L краситель#!#! насыщенного синего цвета, который будет потрясающе смотреться на нашей знаменитой #TOOLTIP:GOODS,pottery,X #L керамике#!#!. Такого объёма как раз хватит на глазурование первых партий."
 treasure_fleet_events.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.13.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.14.title: "Изысканный вкус"
 treasure_fleet_events.14.desc: "#TOOLTIP:REGION,indonesia_region,X #L Индонезия#!#! славится своими специями, но такой ароматной #TOOLTIP:GOODS,cloves,X #L гвоздики#!#!, как на #TOOLTIP:AREA,moluccas_area,X #L Молуккских островах#!#!, нет больше нигде. Местные жители приняли нашу делегацию исключительно радушно и подарили нам крупную партию этой изысканной приправы. $expedition_name_treasure_voyage$ привозит домой столько гвоздики, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] смогут наслаждаться её вкусом несколько месяцев кряду."
 treasure_fleet_events.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.14.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.15.title: "Поимка [Select_CString(extradited_character.IsFemale,'беглянки', 'беглеца')]"
 treasure_fleet_events.15.desc: "$expedition_name_treasure_voyage$ приносит неожиданные плоды: $expedition_leader_name$ и $expedition_leader_name_herhis$ верная команда моряков сумели выследить [Select_CString(extradited_character.IsFemale,'известную смутьянку', 'известного смутьяна')] по имени [extradited_character.GetName]. [extradited_character.GetShortNameWithNoTooltip] давным-давно [Select_CString(extradited_character.IsFemale,'покинула', 'покинул')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!, избежав правосудия. Однако наша экспедиция не только нашла [Select_CString(extradited_character.IsFemale,'негодяйку', 'негодяя')], но и отбила [Select_CString(extradited_character.IsFemale,'её', 'его')] у охраны убежища на территории #ONCLICK:COUNTRY,[asylum_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[asylum_country.Custom('CL_tt')],X [asylum_country.Custom('CL_GEN')|L]#!#!. Теперь [Select_CString(extradited_character.IsFemale,'она', 'он')] находится в #TOOLTIP:SUB_CONTINENT,china,X #L Китае#!#! и ожидает наказания."
 treasure_fleet_events.15.a: "Мы повесим [Select_CString(extradited_character.IsFemale,'эту жалкую преступницу', 'этого жалкого преступника')]!"
 treasure_fleet_events.15.b: "Мы [Select_CString(extradited_character.IsFemale,'её', 'его')] обезглавим!"
 treasure_fleet_events.15.b.entry: "Отрубим ему голову."
 treasure_fleet_events.15.c: "Мы проведём #italic линчи#!: порежем [Select_CString(extradited_character.IsFemale,'её', 'его')] на кусочки."
 treasure_fleet_events.15.d: "Мы помилуем [Select_CString(extradited_character.IsFemale,'беглянку: она', 'беглеца: он')] нам ещё пригодится."
 treasure_fleet_events.15.d.entry: "Помилуем инакомыслящего: он ещё нам пригодится."
 treasure_fleet_events.16.title: "Казнь пирата по имени [executed_character.GetNameWithNoTooltip]"
 treasure_fleet_events.16.desc: "[executed_character.GetName] происходит из области [executed_character.GetBirthLocation.GetArea.GetName]. После введения #TOOLTIP:POLICY,haijin_policy,X #L Хайцзиня#!#! [Select_CString(executed_character.IsFemale,'её', 'его')] семья подаётся в пираты. Сбежав из страны, [executed_character.GetShortNameWithNoTooltip] возглавляет пиратское сообщество на территории #ONCLICK:COUNTRY,[loser_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[loser_country.Custom('CL_tt')],X [loser_country.Custom('CL_GEN')|L]#!#!. $expedition_leader_name$ впоследствии участвует в нескольких сражениях у берегов [loser_country.Custom('rank_ru_GEN')], где [executed_character.GetNameWithNoTooltip] выступает на стороне противника. Пора разобраться с [Select_CString(executed_character.IsFemale,'этой мерзавкой', 'этим мерзавцем')], чтобы другим неповадно было!"
 treasure_fleet_events.16.a: "Правосудие свершилось."
 treasure_fleet_events.17.title: "[Select_CString(loser_character.IsFemale,'Строптивая правительница', 'Строптивый правитель')]"
 treasure_fleet_events.17.desc: "$expedition_name_treasure_voyage$ преподносит приятный сюрприз: во время путешествия $expedition_leader_name$ и команда схватили очень важного человека. Это [loser_character.GetName], в прошлом [loser_country.GetGovernment.GetRulerTitle|l] [loser_country.Custom('longname_ru_GEN')]. Вопиющее неуважение к сюзерену привело [Select_CString(loser_character.IsFemale,'строптивую правительницу', 'строптивого правителя')] к стремительному поражению. Теперь [Select_CString(loser_character.IsFemale,'она', 'он')] томится в нашем плену."
 treasure_fleet_events.17.a: "Мы с [Select_CString(loser_character.IsFemale,'ней', 'ним')] поквитаемся."
 treasure_fleet_events.17.a.entry: "Накажем его в назидание другим."
 treasure_fleet_events.17.b: "Мы проявим милосердие."
 treasure_fleet_events.18.title: "Будущее [loser_country.Custom('CL_GEN')]"
 treasure_fleet_events.18.desc: "Глава #ONCLICK:COUNTRY,[loser_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[loser_country.Custom('CL_tt')],X [loser_country.Custom('CL_GEN')|L]#!#! по глупости своей решает пойти против #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#!, которое представляет $expedition_leader_name$ со своей экспедицией. [loser_country.GetLongNameWithNoTooltip] — эта держава проигрывает в ожесточённом столкновении, и, пока идёт разбирательство, на пустующее место временно назначается [loser_country.GetGovernment.GetRulerTitle|l]."
 treasure_fleet_events.18.a: "Отправим наместника. Пусть им станет [target_character_for_viceroyalty.GetNameWithNoTooltip]."
 treasure_fleet_events.18.a.entry: "Пусть правит в качестве нашего наместника."
 treasure_fleet_events.18.b: "Пусть местный номинальный глава остаётся."
 treasure_fleet_events.19.title: "Наместник из державы [expedition_initiator.GetNameWithNoTooltip]"
 treasure_fleet_events.19.desc: "Мы получили новости из #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#!. Теперь наша страна — китайский #TOOLTIP:SUBJECT_TYPE,tributary,X #L данник#!#!, и в обозримом будущем ею будет управлять китайский наместник, [target_character_for_viceroyalty.GetName]. Такова наша судьба: жить под вражеской пятой."
 treasure_fleet_events.19.a: "Однажды мы сбросим китайское иго."
 treasure_fleet_events.20.title: "Дары из далёких земель"
 treasure_fleet_events.20.desc: "Во время экспедиции наши моряки получили множество разных подарков от местных жителей и привезли эти побрякушки в #TOOLTIP:SUB_CONTINENT,china,X #L Китай#!#!. Они не представляют особой ценности, но повышают привлекательность #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#! и укрепляют наш престиж."
 treasure_fleet_events.20.a: "Другого мы и не ожидали."
 treasure_fleet_events.21.title: "Умирает [target.GetNameWithNoTooltip]"
 treasure_fleet_events.21.desc: "Мы узнали, что $expedition_leader_name$, глава нашей экспедиции золотого флота, больше не с нами. Увы, порой путешествия бывают смертельно опасными. Теперь экспедицию возглавит [new_leader.GetName]. Отныне её судьба зависит от нового лидера."
 treasure_fleet_events.21.a: "Надеемся, это не дурное предзнаменование."
 chi_new_expedition_leader: "[new_leader.GetName] теперь руководит нашей экспедицией «$expedition_name_treasure_voyage$»."
 treasure_fleet_events.22.title: "Нехватка средств"
 treasure_fleet_events.22.desc: "Мы получили известие, что у $expedition_name_treasure_voyage$ закончились дары для ведения дипломатии. Не имея подобающих даров, флот откажется от дальнейших визитов вежливости в иностранные порты до конца плавания. Возможно, в следующий раз следует выделять нашим экспедициям более подобающие средства."
 treasure_fleet_events.22.a: "Это позорно."
 chi_expedition_is_returning_to_china: "The $expedition_name_treasure_voyage$ has run out of gifts and will no longer call at foreign ports for the rest of the voyage."
 show_current_chinese_expedition_amount: "[COUNTRY.MakeScope.GetVariable('chinese_expedition_opinion').GetValue]"
 change_amount_of_treasure_voyage_tt: "Количество груза, перевозимого $expedition_name_treasure_voyage$, увеличено на $VALUE|+$"
 change_amount_of_treasure_voyage_tt_neg: "Количество груза, перевозимого $expedition_name_treasure_voyage$, уменьшено на $VALUE|-$"
 change_opinion_of_expedition: "$chinese_expedition_opinion$ по отношению к нам улучшается на $VALUE|0Y$ (сейчас: $show_current_chinese_expedition_amount$)"
 change_opinion_of_expedition_neg: "$chinese_expedition_opinion$ по отношению к нам ухудшается на $VALUE|0Y$ (сейчас: $show_current_chinese_expedition_amount$)"
 give_gold_to_expedition: "Члены экспедиции «$expedition_name_treasure_voyage$» получат $VALUE|2Y$."
 chi_gift_received_count: "Мы получили [ROOT.GetVariable('gifts_received').GetValue|2+=] [Concept('gold', 'дукатов')|e]. Эта сумма конвертируется в:"
 treasure_fleet_events.23.title: "Золотой флот попал в шторм"
 treasure_fleet_events.23.desc: "Во время плавания наш самый крупный золотой флот столкнулся с коварнейшим из врагов — свирепой бурей, которая застала врасплох даже самых опытных моряков. Многие корабли затонули, а вместе с ними ушли на дно наши подарки и товары."
 treasure_fleet_events.23.a: "Мы ничего не можем поделать."
 treasure_fleet_events.23.a.entry: "$common_string_nothing_we_can_do_about_it$"
 treasure_fleet_events.24.title: "Сражение с пиратским флотом"
 treasure_fleet_events.24.desc: "[target_location.GetTopography.GetName] в [TARGET_LOCATION.Custom('LR_PREP')|l] [TARGET_LOCATION.GetName] навсегда останется в памяти наших моряков. Здесь наш славный золотой флот столкнулся с гнусными пиратами. Конечно же, наши храбрые воины не растерялись. Они немедленно вступили с врагом в решающий бой, уничтожили пиратские суда и взяли в плен их главарей. К сожалению, в этой битве наш флот потерял множество людей и кораблей, а также лишился важных ресурсов."
 treasure_fleet_events.24.a: "Эта битва поднимет наш престиж."
 treasure_fleet_events.25.title: "Далёкий парус"
 treasure_fleet_events.25.desc: "Lookouts hail a sail on the horizon: a merchant fleet, richly laden, plying the same waters as our own. $expedition_leader_name$ orders our captains to greet them in peace, and a brisk exchange follows: bolts of silk and fine porcelain traded for spices, gemstones, and rarities of the southern seas.\n\nThe holds of the $expedition_name_treasure_voyage$ ride heavier than before."
 treasure_fleet_events.25.a: "Попутный ветер и честная сделка."
 treasure_fleet_events.30.title: "Пир при дворе"
 treasure_fleet_events.30.a: "Пусть узрят наше великолепие."
 treasure_fleet_events.31.title: "Curios for the Emperor"
 treasure_fleet_events.31.a: "Скупить лучшее, что предлагает рынок."
 treasure_fleet_events.31.b: "Наше золото лучше сберечь для подношений."
 treasure_fleet_events.26.title: "Испытание власти"
 treasure_fleet_events.26.desc: "Открытое море и ненадёжная карта вызывают раздор среди офицеров $expedition_name_treasure_voyage$. Одни настаивают, чтобы $expedition_leader_name$ держал(-а) осторожный курс; другие ратуют за более быстрый, но опасный путь. Все взоры обращены к адмиралу, и то, как $expedition_leader_name_herhis$ проявит власть сейчас, надолго запомнится."
 treasure_fleet_events.26.a: "Держать осторожный и размеренный курс."
 treasure_fleet_events.26.b: "Рискнуть и пойти более быстрым путём."
 treasure_fleet_events.27.title: "Чудо морских глубин"
 treasure_fleet_events.27.desc: "Целые день и ночь флот идёт бок о бок с существом невиданных размеров, чья спина рассекает волны, точно плавучий остров. Летописцы $expedition_name_treasure_voyage$ заполняют свитки описанием увиденного, а моряки принимают это за самое благоприятное знамение. Рассказы об этом чуде будут звучать в каждой чайной, когда флот вернётся домой."
 treasure_fleet_events.27.a: "Диво, что поразит двор."
 treasure_fleet_events.28.title: "Знамение в небесах"
 treasure_fleet_events.28.desc: "Флотские астрономы замечают странный свет, пересекающий ночное небо, и склоняются над картами, силясь разгадать его смысл. Какова бы ни была его истинная природа, моряки читают в небесах послание свыше, и над палубами $expedition_name_treasure_voyage$ воцаряется благоговейная тишина."
 treasure_fleet_events.28.a: "Внять тому, что предвещают небеса."
 treasure_fleet_events.29.title: "Штиль"
 treasure_fleet_events.29.desc: "Ветер стихает совсем, и великие корабли $expedition_name_treasure_voyage$ замирают на глади моря, точно стеклянной. День за днём паруса безжизненно висят, и $expedition_leader_name$ вместе с офицерами остаётся лишь ждать и вглядываться в горизонт в надежде на дуновение ветра. Путь от этого станет только длиннее."
 treasure_fleet_events.29.a: "Ждать возвращения ветра."
 treasure_fleet_events.32.title: "Пожар в порту"
 treasure_fleet_events.32.desc: "A fire breaks out among the crowded warehouses of [target_stop.GetName], where a portion of the fleet's goods lay in storage. The sailors of the $expedition_name_treasure_voyage$ join the bucket lines, but not before the flames claim crates of silk and porcelain set aside as gifts."
 treasure_fleet_events.32.a: "Дорого обошедшаяся ночь."
 treasure_fleet_events.33.title: "Местный лоцман"
 treasure_fleet_events.33.desc: "Бывалый моряк из [target_stop.GetName], знающий здешние рифы и течения, предлагает провести $expedition_name_treasure_voyage$ дальнейшим путём. $expedition_leader_name$ раздумывает, стоит ли доверить курс флота чужой руке."
 treasure_fleet_events.33.a: "Принять его знания на борт."
 treasure_fleet_events.33.b: "Своих штурманов довольно."
 treasure_fleet_events.34.title: "Дар адмиралу"
 treasure_fleet_events.34.desc: "Когда флот готовится сняться с якоря в [target_stop.GetName], местный двор преподносит $expedition_leader_name$ прощальный дар редкой ценности — знак уважения, который [GetInternationalOrganization('middle_kingdom').GetName] увезёт домой к [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 treasure_fleet_events.34.a: "Достойное пополнение для дани."
 treasure_fleet_events.35.title: "Поиск переводчика"
 treasure_fleet_events.35.desc: "Чем сильнее корабли #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайской#!#! экспедиции по поиску сокровищ отдаляются от дома, тем сложнее морякам поддерживать с нами связь. Однако они полны решимости плыть дальше и встретиться с представителями различных культур. Увы, без переводчика общение с ними вряд ли будет продуктивным. Члены экспедиции просят нас найти местного переводчика, который поможет им преодолеть языковой барьер."
 treasure_fleet_events.35.a: "Немедленно найдём переводчика!"
 treasure_fleet_events.35.b: "Это не наша проблема."
 treasure_fleet_events.36.title: "Передача карт"
 treasure_fleet_events.36.desc: "Команда экспедиции «$expedition_name_treasure_voyage$» просит нас предоставить им карты местных водных путей. Мы не обязаны это делать, но $expedition_leader_name$ и #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайские#!#! элиты, которые сейчас находятся в районе «$expedition_location_name$», сочтут нашу помощь жестом доброй воли и будут очень нам благодарны."
 treasure_fleet_events.36.a: "Передадим им всё, что у нас есть."
 treasure_fleet_events.36.b: "Нам нечем с ними поделиться."
 treasure_fleet_events.37.title: "Затраты на эксплуатацию"
 treasure_fleet_events.37.desc: "Местные [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] решили обмануть моряков из экспедиции «$expedition_name_treasure_voyage$» и открыли новые рынки рядом с гаванью района $expedition_location_name$. На этих рынках они продают товары втридорога, а наиболее жадные купцы вообще подняли цены до небес. А что? Морякам деваться некуда — всё равно купят! Из-за этого на улицах начались вооружённые стычки, которые привели к беспорядкам. [fleet_loc.GetRank.GetName] погружается в хаос."
 treasure_fleet_events.37.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] должны понести наказание!"
 treasure_fleet_events.37.a.entry: "Наказать горожан!"
 treasure_fleet_events.37.b: "Привлечём к ответственности моряков."
 treasure_fleet_events.38.title: "Отрезвляющая пощёчина"
 treasure_fleet_events.38.desc: "Наши [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] крайне недовольны тем вниманием, которое мы уделяем членам экспедиции «$expedition_name_treasure_voyage$». Они считают #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайцев#!#! надменными захватчиками, не заслуживающими того приёма, который им оказывают. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] требуют, чтобы мы лишили китайских моряков части привилегий. Пусть знают, что им здесь не рады."
 treasure_fleet_events.38.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] правы. Последуем их советам."
 treasure_fleet_events.38.a.entry: "Удовлетворим просьбы аристократов."
 treasure_fleet_events.38.b: "Последнее, что нам нужно, — это разгневанные китайцы."
 treasure_fleet_events.39.title: "Неуважение к религии"
 treasure_fleet_events.39.desc: "#TOOLTIP:CULTUREGROUP,chinese_group,X #L Китайские#!#! моряки из экспедиции в поисках сокровищ по незнанию нарушили #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ие#! обычаи и совершили страшное святотатство. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] пришли в бешенство. Они требуют извинений от лидера экспедиции по имени $expedition_leader_name$."
 treasure_fleet_events.39.a: "Пусть $expedition_leader_name_tooltipless$ принесёт свои извинения."
 treasure_fleet_events.39.b: "Не будем вмешиваться."
 treasure_fleet_events.40.title: "Запрос на экстрадицию"
 treasure_fleet_events.40.desc: "Члены экспедиции «$expedition_name_treasure_voyage$» говорят, что один из наших придворных, [target_escapee.GetName], — мятежник, сбежавший из #ONCLICK:COUNTRY,[expedition_initiator.Custom('CL_tt')] #TOOLTIP:COUNTRY,[expedition_initiator.Custom('CL_tt')],X [expedition_initiator.Custom('CL_GEN')|L]#!#!. $expedition_leader_name$ и #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайские#!#! элиты требуют передать его #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединному Государству#!#!, где его будут судить по всей строгости закона."
 treasure_fleet_events.40.a: "Выполним их просьбу."
 treasure_fleet_events.40.b: "Это полный абсурд!"
 treasure_fleet_events.41.title: "Совместные военные учения"
 treasure_fleet_events.41.desc: "Лидер экспедиции «$expedition_name_chinese_expedition$» предлагает нам принять участие в совместных учениях. Эти учения будут полезны обеим сторонам и укрепят доверие между нами и китайцами, но нам следует быть начеку: никогда не знаешь, чего ожидать от иностранных солдат. Ближе всего к району $expedition_location_name$ находится отряд «[target_unit.GetName]». Он и будет участвовать в совместных учениях с китайцами."
 treasure_fleet_events.41.a: "Примем предложение."
 treasure_fleet_events.41.b: "Мы всегда можем отказаться."
 treasure_fleet_events.42.title: "Помощь от китайцев"
 treasure_fleet_events.42.desc: "Когда члены китайской экспедиции «$expedition_name_treasure_voyage$» прибыли в район $expedition_location_name$, то узнали: [ROOT.GetCountry.GetLongName] — эта держава ведёт кровопролитную войну. Оказалось, что [expedition_initiator.GetLongName] не слишком высокого мнения о наших врагах. Теперь китайцы предлагают нам помощь в этом конфликте."
 treasure_fleet_events.42.a: "Нам пригодится любая помощь."
 treasure_fleet_events.42.b: "Это наша война, а не их."
 treasure_fleet_events.43.title: "Китайские путешественники помогают врагам"
 treasure_fleet_events.43.desc: "Наши шпионы уведомили нас: [expedition_initiator.GetLongName] — эта держава проводит масштабную экспедицию «$expedition_name_treasure_voyage$» во главе которой стоит $expedition_leader_name$. Недавно её члены прибыли во вражеский порт, расположенный в районе $expedition_location_name$. Похоже, они согласились помочь #ONCLICK:COUNTRY,[from.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from.Custom('CL_tt')],X [from.Custom('CL_DAT')|L]#!#! в войне против нас!"
 treasure_fleet_events.43.a: "Мы никогда не простим китайцев!"
 treasure_fleet_events.44.title: "Запрос на строительство мечети"
 treasure_fleet_events.44.desc: "Как оказалось, глава экспедиции «$expedition_name_chinese_expedition$» $expedition_leader_name$, как и многие другие её участники, исповедует религию «[target_religion.GetName]». Они просят разрешить им построить мечеть, чтобы поддержать местную [target_religion.GetAdjectiveWithNoTooltip|l]ую общину."
 treasure_fleet_events.44.a: "Удовлетворим запрос."
 treasure_fleet_events.44.b: "Объясним им, что это грех."
 treasure_fleet_events.45.title: "$expedition_location_name_tooltipless$ и китайская диаспора"
 treasure_fleet_events.45.desc: "В районе $expedition_location_name$ живёт крупная #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайская#!#! диаспора, которая формировалась многие десятилетия. Китайские купцы брали в жёны местных женщин, селились здесь и становились полноправными членами нашего общества. Недавно сюда прибыла экспедиция «$expedition_name_treasure_voyage$» из #ONCLICK:COUNTRY,[expedition_initiator.Custom('CL_tt')] #TOOLTIP:COUNTRY,[expedition_initiator.Custom('CL_tt')],X [expedition_initiator.Custom('CL_GEN')|L]#!#!. Её лидер хочет поддержать диаспору своих бывших сограждан."
 treasure_fleet_events.45.a: "Отличная идея."
 treasure_fleet_events.45.b: "Остановить их!"
 treasure_fleet_events.46.title: "Солдаты остаются"
 treasure_fleet_events.46.desc: "Несколько демобилизованных солдат из экспедиции «$expedition_name_chinese_expedition$» женились на местных девушках и решили осесть в районе $expedition_location_name$. Со временем они обзаведутся полезными связями, что будет нам очень на руку."
 treasure_fleet_events.46.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 treasure_fleet_events.46.a.entry: "$common_string_alright$"
 treasure_fleet_events.47.title: "$expedition_name_treasure_voyage$ помогает нам"
 treasure_fleet_events.47.desc: "Когда члены экспедиции «$expedition_name_chinese_expedition$» прибыли в район $expedition_location_name$, то обнаружили, что [ROOT.GetCountry.GetFlavorRank|l] находится в состоянии гражданской войны. Лидер экспедиции «$expedition_name_treasure_voyage$» $expedition_leader_name$ и другие её участники оказались неробкого десятка. Они прониклись сочувствием к #L [ROOT.GetCountry.GetAdjective|l]ому#! народу и предлагают нам военную помощь от имени #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Срединного Государства#!#!."
 treasure_fleet_events.47.a: "Мы примем любую помощь."
 treasure_fleet_events.47.b: "Нет, нам не нужна их помощь."
 treasure_fleet_events.48.title: "$treasure_fleet_events.47.title$"
 treasure_fleet_events.48.desc: "Участники экспедиции «$expedition_name_chinese_expedition$» приняли сторону в конфликте, получившем название «[target_war.GetName]». Может, $expedition_leader_name$ — и умный лидер, но решение поддержать #ONCLICK:COUNTRY,[country_at_war_with.Custom('CL_tt')] #TOOLTIP:COUNTRY,[country_at_war_with.Custom('CL_tt')],X [country_at_war_with.Custom('CL_ACC')|L]#!#! вместо #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! мудрым не назовёшь. Мы разгромим их на поле боя."
 treasure_fleet_events.48.a: "Мы этого не забудем!"
 treasure_fleet_events.49.title: "Китайцы в бешенстве"
 treasure_fleet_events.49.desc: "Отношения между #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! и нашими гостями из экспедиции «$expedition_name_treasure_voyage$» накалились до предела. В последние дни стычки между нашим гарнизоном и иностранными моряками значительно участились. Тем не менее, гости продолжали поддерживать с нами контакты, пусть и без прежней теплоты. Однако сейчас их терпение, похоже, лопнуло. $expedition_leader_name$ больше не хочет иметь с нами никаких дел. Участники экспедиции собираются покинуть территорию [ROOT.GetCountry.Custom('longname_ru_wntt_GEN')], пока ситуация окончательно не вышла из-под контроля."
 treasure_fleet_events.49.a: "Нужно наладить отношения с китайцами."
 treasure_fleet_events.49.b: "Скатертью дорога!"
 chinese_interregnum: "#ONCLICK:COUNTRY,[THIS.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[THIS.GetCountry.Custom('CL_tt')],X [THIS.GetCountry.Custom('CL_ACC')|L]#!#! ждёт период #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайского#!#! междуцарствия."
 treasure_fleet_events.50.title: "Призыв к войне"
 treasure_fleet_events.50.desc: "Глава экспедиции «$expedition_name_treasure_voyage$» $expedition_leader_name$ просит нас вступить в войну против #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!. Мы не знаем, почему #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайцы#!#! так ополчились на эту страну. Так или иначе, [target_country.Custom('rank_ru_ACC')] ждут тяжёлые времена, а [target_country.GetGovernment.GetRulerTitle|l], возможно, скоро и вовсе простится с жизнью. Лидеры экспедиции призывают нас покарать непокорных во имя Небес."
 treasure_fleet_events.50.a: "Мы сделаем всё, что они попросят."
 treasure_fleet_events.50.b: "Мы не станем им подчиняться."
 treasure_fleet_events.51.title: "Неудачные дары"
 treasure_fleet_events.51.desc: "Мы узнали, что участников экспедиции «$expedition_name_treasure_voyage$» из числа элиты не устраивают наши дары, хотя они и не говорят об этом открыто. Мы заметили недовольство на их лицах, ещё когда [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'принимала', 'принимал')] их у себя. Шпионы подслушали их разговоры и подтвердили наши опасения."
 treasure_fleet_events.51.a: "Выплатим им компенсацию."
 treasure_fleet_events.51.b: "Пусть сперва к нам обратятся, а потом посмотрим."
 treasure_fleet_events.52.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] в центре скандала"
 treasure_fleet_events.52.desc: "Во время аудиенции у [ROOT.GetCountry.GetGovernment.GetRulerTitle] один из [ROOT.GetCountry.GetGovernment.GetCourtTitle] произнёс презреннейшие слова о наших гостях из [ShowCultureGroupName('chinese_group')], нанеся им тяжкое оскорбление. Если ничего не предпринять, $expedition_name_treasure_voyage$ может доложить об этом происшествии [expedition_initiator.GetGovernment.GetRulerTitle]."
 treasure_fleet_events.52.a: "Принесём им официальные извинения."
 treasure_fleet_events.52.b: "Осыпем их подарками."
 treasure_fleet_events.52.c: "Мы не станем наказывать своих."
 treasure_fleet_events.53.title: "Радушный приём"
 treasure_fleet_events.53.desc: "Лидеры экспедиции «$expedition_name_treasure_voyage$» очень довольны оказанным приёмом и полученными привилегиями. Мы не только обменялись с ними подарками, но и помогли им отремонтировать корабли. Мы знаем, что они благодарны нам за гостеприимство, хотя и не говорят об этом открыто."
 treasure_fleet_events.53.a: "Гостеприимство — это ключ к успеху!"
 treasure_fleet_events.53.b: "Пусть не обольщаются."
 treasure_fleet_events.54.title: "Оскорбление наших посланников"
 treasure_fleet_events.54.a: "Такому неуважению не бывать."
 treasure_fleet_events.54.b: "Не пристало нам обращать на это внимание."
 treasure_fleet_events.54.a.tt: "Соседние [nations|e], которые впоследствии посетит $expedition_name_treasure_voyage$, получат возможность объявить [war|e] государству [insulting_court.GetName] при нашей поддержке"
 treasure_fleet_events.55.title: "Впутаны в чужие дела"
 treasure_fleet_events.55.a: "Пусть весь мир увидит, как далеко простирается наше влияние."
 treasure_fleet_events.55.b: "Дальние войны нас не касаются."
 treasure_fleet_events.56.title: "Меч, обнажённый вдали от родины"
 treasure_fleet_events.56.a: "Пусть научатся бояться нашей мощи."
 treasure_fleet_events.56.b: "Такая вражда нам не на пользу, ведь мы так далеко от дома."
 treasure_fleet_events.57.title: "Отвергнуты с презрением"
 treasure_fleet_events.57.a: "Оскорбление будет запомнено."
 treasure_fleet_events.57.b: "Не пристало нам таить подобную обиду."
 treasure_fleet_events.57.a.tt: "Соседний двор, который позднее посетит $expedition_name_treasure_voyage$, может быть призван объявить [war|e] против [contemptuous_court.GetName]"
 treasure_fleet_events.58.title: "Оскорбление отомщено"
 treasure_fleet_events.58.a: "Пусть все, кто презирает нас, примут это к сведению."
 treasure_fleet_events.59.title: "Сородичи за морями"
 treasure_fleet_events.59.a: "Пусть наши сородичи за морями с гордостью несут наше имя."
 treasure_fleet_events.59.b: "Их место дома, среди предков."
 treasure_fleet_events.60.title: "Оплошность посланника"
 treasure_fleet_events.60.a: "Наши послы не подвластны чужому алтарю."
 treasure_fleet_events.60.b: "Адмирал загладит вину."
 treasure_fleet_events.1.zheng_he_owned_tt: "Чжэн Хэ должен в настоящий момент состоять у нас на службе"
 treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$ за их визит."
 treasure_fleet_events.7.desc_shared: "Завершив свою миссию в [ROOT.GetCountry.GetName], сокровищный флот [expedition_initiator.GetName] в настоящее время пополняет запасы, намереваясь отправиться в путь через несколько месяцев. По обычаю следовало бы преподнести им лучшее, что может предложить [ROOT.GetCountry.GetFlavorRank], в знак признательности"
 treasure_fleet_events.30.desc: "While the fleet lies at anchor off [target_stop.GetName], the local court hosts a great banquet in honor of the $expedition_name_treasure_voyage$. Musicians, dancers, and dishes of a hundred kinds are laid before $expedition_leader_name$ and the captains, who present the customary gifts and speak of the greatness of the [GetInternationalOrganization('middle_kingdom').GetName].\n\nWord of the fleet's splendid conduct abroad will surely reach home."
 treasure_fleet_events.31.desc: "The markets of [target_stop.GetName] overflow with wonders unknown in our lands: caged birds of impossible color, strange beasts, aromatic woods, and jewels cut in foreign fashion. The merchants of the $expedition_name_treasure_voyage$ could fill a hold with curiosities fit to delight the [ROOT.GetCountry.GetGovernment.GetRulerTitle], though it would mean parting with a portion of the gold set aside for gifts.\n\nShall we open the coffers?"
 treasure_fleet_events.54.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that at the court of [insulting_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met not with the deference owed the [GetInternationalOrganization('middle_kingdom').GetName], but with open scorn — and [insulting_court.GetGovernment.GetRulerTitle] let the insult stand.\n\n$expedition_leader_name$ awaits our word. Shall such contempt be answered, or is it beneath us to take notice?"
 treasure_fleet_events.55.desc: "Dispatches from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] carry unexpected news. Far from home, $expedition_leader_name$ has thrown the arms and treasure of the $expedition_name_treasure_voyage$ behind the ruler of [country_at_war_with.GetName], a realm now torn by a war of succession.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] marvel at how far the reach of the [GetInternationalOrganization('middle_kingdom').GetName] now extends. Others mutter that the quarrels of distant realms are no fit business of ours."
 treasure_fleet_events.56.desc: "Word comes from the $expedition_name_treasure_voyage$ that $expedition_leader_name$ has lent imperial soldiers to a host court's war. [target_country.GetName], who found our men arrayed against them, now number the [GetInternationalOrganization('middle_kingdom').GetName] among their foes.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided. To some it is proof that the reach of the throne now extends even to the far side of the world. To others it is a needless enemy earned in a war that was never ours."
 treasure_fleet_events.57.desc: "Grave news reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. At the court of [contemptuous_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met with such open contempt that $expedition_leader_name$ weighed anchor and quit their waters, the customary courtesies flung back in our faces.\n\nThe fleet's chronicler has entered [contemptuous_court.GetNameWithNoTooltip] in its ledger of those who have wronged the [GetInternationalOrganization('middle_kingdom').GetName]. Shall the affront be remembered, or forgiven?"
 treasure_fleet_events.58.desc: "Word of triumph reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Stirred by the presence of the $expedition_name_treasure_voyage$, the court of [avenging_court.GetName] has taken up arms against [target_country.GetName], the very realm that once held our envoys in contempt.\n\nHeaven's displeasure, it seems, needs no imperial army to make itself felt. The reach of the [GetInternationalOrganization('middle_kingdom').GetName] carries even into the wars of distant kings."
 treasure_fleet_events.59.desc: "Reports reach the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of a flourishing community of our countrymen in far-off [diaspora_port.GetName]. Merchants and sailors who settled there generations ago have taken local wives and prospered, and now $expedition_leader_name$ has extended the hand of the $expedition_name_treasure_voyage$ to these distant kin.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] swell with pride that the blood of the [GetInternationalOrganization('middle_kingdom').GetName] runs in every port of the southern seas. Others frown upon subjects who would make their home so far from the graves of their ancestors."
 treasure_fleet_events.60.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of an unhappy incident at the court of [offended_court.GetName]. $expedition_leader_name$, unversed in the rites of a foreign faith, has given grave offense, and the [offended_court.GetGovernment.GetRulerTitle] now demands that our envoy make amends.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is of two minds. Some hold that the envoys of the [GetInternationalOrganization('middle_kingdom').GetName] owe no deference to foreign altars. Others fear that such carelessness sullies our name in every port yet to come."
