 grand_tour_events.worth_the_delay: "и решим, стоило ли ради этого делать остановку в нашем путешествии."
 grand_tour_events.seek_audience: "Испросим аудиенции, если [court_host.GetNameWithNoTooltip] сможет нас принять."
 grand_tour_events.seek_castle_audience: "Испросим аудиенции в замке, если [court_host.GetNameWithNoTooltip] сможет нас принять."
 grand_tour_events.attend_university_lectures: "Посетим лекции в университете."
 grand_tour_events.prodigy_knowledge: "Пусть [target_leader.GetNameWithNoTooltip] блеснёт своей учёностью."
 grand_tour_events.prodigy_connections: "Пусть [target_leader.GetNameWithNoTooltip] блеснёт своими связями."
 grand_tour_events.prodigy_experience: "Пусть [target_leader.GetNameWithNoTooltip] блеснёт своим опытом."
 grand_tour_events.1.title: "Большое путешествие"
 grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] собирается, сундуки упаковываются, а свита уже готова держать путь на юг. Нас ждёт #TOOLTIP:REGION,italy_region,X #L Италия#!#! — край античных руин, знаний эпохи #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#! и дворов, на фоне искусства политики которых мы выглядим неопытными юнцами. Всё, чему там научится [ROOT.GetCountry.GetGovernment.GetHeirTitle|l], будет определять судьбу нашей державы на целое поколение вперёд. Остаётся лишь решить, какое именно образование мы намерены [Select_CString(target_leader.IsFemale, 'её', 'ему')] дать."
 grand_tour_events.1.a: "При #TOOLTIP:REGION,italy_region,X #L итальянских#!#! дворах [Select_CString(target_leader.IsFemale, 'она', 'он')] узнает то, чего не найти ни в одной книге."
 grand_tour_events.1.party: "Устройте напоследок пир, прежде чем отправиться в путь. И не жалейте денег."
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName] — это [target_location.GetRank.GetName|l], словно вопреки самой географии выросший посреди грязи и живущий за счёт торговли. Им правит совет купеческих семейств, переживший все #TOOLTIP:CONTINENT,europe,X #L европейские#!#! династии."
 grand_tour_events.2.desc.ducal_palace: "А над лагуной розовеет роскошный дворец дожей — наглядное воплощение изысканности и богатства."
 grand_tour_events.2.desc.heir_arrival: "[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает, пожалуй, в самый космополитичный [target_location.GetRank.GetNameWithNoTooltip|l] в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. На его рынках можно услышать все языки Средиземноморья, а за определённую плату раздобыть любые сведения."
 grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip] — Серениссима"
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ #TOOLTIP:BUILDING_TYPE,venetian_arsenal,X #L Арсенал#!#! занимает весь восточный квартал Венеции. Его мастеровые могут заложить киль военного корабля и завершить его постройку за один рабочий день. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Остальные верфи восточного квартала строят торговые суда и боевые галеры в привычном для #TOOLTIP:CONTINENT,europe,X #L европейских#!#! портов неторопливом ритме. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.knowledge: "Изучите кораблестроение на Венецианском арсенале."
 grand_tour_events.2.experience: "Осмотрите верфи, где строят боевые галеры [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.2.connections: "Посетите приём, устроенный [court_host.GetNameWithNoTooltip]."
 grand_tour_events.2.party: "Отложим учётные книги и проведём ночь в компании гуляк на каналах."
 grand_tour_events.2.historical_info: "В неделю Вознесения 1645 года англичанин Джон Ивлин, путешествовавший по Франции и Италии, посетил оперу #italic «Ercole in Lidia»#!, или #italic «Геракл в Лидии»#!, в одном из общественных театров Венеции. В  дневнике он восхищался тем, что декорации сменились тринадцать раз, и особо выделил сопрано Анну Ренци. Однако певец-кастрат произвёл на него ещё большее впечатление, а генуэзского баса Ивлин назвал «несравненным». Расписные декорации, создававшие иллюзию перспективы, и механизмы, поднимавшие фигуры над сценой, всех заворожили, а спектакль, по его словам, «держал наши уши и глаза в плену до двух часов ночи». Следующей весной Ивлин покинул Венецию и увёз с собой сундуки с книгами, гравюрами и сосудами со знаменитым венецианским териаком."
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] Возрождения"
 grand_tour_events.3.desc: "[target_location.GetName] уступает своей славе в размерах, зато превосходит её своей необычностью. [target_location.GetRank.GetName] наполнен новыми идеями: философы говорят о возрождении античности, купцы видят в нём выгодное место для торговли, а живописцы восхищаются тем, как свет ложится на оштукатуренные стены. [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает и узнаёт, что сегодня вечером двор даёт приём для иностранных гостей, если только [target_leader.GetSheHe|l] не слишком [Select_CString(target_leader.IsFemale, 'утомлена', 'утомлён')] дорогой.\n\nЕсть и отдельное приглашение — посетить монастырскую библиотеку, где в хранится самое удивительное во всём западном христианском мире собрание #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческих#!#! манускриптов."
 grand_tour_events.3.knowledge: "Попросим представить нас учёным монастыря."
 grand_tour_events.3.experience: "Осмотрим мастерские, где обрабатывают шерсть и лавки ювелиров с Понте-Веккьо."
 grand_tour_events.3.connections: "Изучим искусство покровительства, которым славится [court_host.GetNameWithNoTooltip|l]."
 grand_tour_events.3.party: "Забудем на время манускрипты и испытаем удачу в игорными столами [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.3.historical_info: "Осенью 1764 года заболевший шотландский романист Тобайас Смоллетт осматривал галерею Уффици. Стоя перед Венерой Медицейской, которой остальные участники Большого путешествия восхищались словно по общему уговору, он написал: «Не могу отделаться от мысли, что в чертах Венеры нет никакой красоты, а её поза неловка и совершенно не соответствует её образу». Позднее Лоренс Стерн увековечил это резкое высказывание. В его книге вымышленный персонаж Йорик укоряет Смельфунгуса перед Пантеоном в Риме и возмущается, что тот «непристойно обругал богиню и обошелся с ней хуже, чем с уличной девкой, без малейшего к тому повода». Их перебранка из-за мраморной Венеры пережила обоих."
 grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip] — Вечный город"
 grand_tour_events.4.desc: "[target_location.GetName] существует одновременно в двух эпохах. Под открытым небом, среди зимней травы располагается Форум: его колонны стоят под причудливыми углами посреди пастбищ, а мрамор отсюда веками вывозили строители, которым требовался камень. Над руинами высится церковь, которой суждено стать престолом всего христианского мира. Она возвышается над самым сердцем современного #L #TOOLTIP:LOCATIONRANK,[target_location.GetRank.Custom('LR_tt')],X [target_location.GetRank.Custom('LR_GEN')|l]#!#!.\n\n[target_leader.GetName] может провести время среди руин или среди живых. Папский двор хранит вековые традиции, отличается строгим церемониалом и поддерживает связи со всеми #TOOLTIP:RELIGION,$catholic_tt$,X #L католическими#!#! державами #TOOLTIP:CONTINENT,europe,X #L Европы#!#!."
 grand_tour_events.4.knowledge: "Изучим рукописи Ватиканской библиотеки и пообщаемся с местными гуманистами."
 grand_tour_events.4.experience: "Прогуляемся среди античных руин и измерим древние памятники."
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.party: "Забудем на одну ночь о руинах и скоротаем время в винных лавках [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.4.historical_info: "15 октября 1764 года англичанин Эдвард Гиббон, завершавший своё Большое путешествие по Италии, сидел в раздумьях среди руин на Капитолийском холме. Босоногие монахи пели вечерню в здании, которое он принял за древний храм Юпитера. Позднее в своих мемуарах Гиббон писал, что именно там, среди обломков колонн и затихающего вечернего песнопения, «мне впервые пришла в голову мысль написать об упадке и разрушении города». Замысел, возникший в тот единственный вечер в Риме, за последующие двадцать лет исследований в Англии постепенно вырос в труд под названием #italic «История упадка и разрушения Римской империи»#!."
 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.5.desc: "[target_location.GetName] — самая южная точка Большого путешествия и старейший среди #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянских#!#! великих дворов. Этот [target_location.GetRank.GetName|l] с населением в миллион человек раскинулся в тени Везувия. В его облике #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческое#!#! наследие наслаивается на #TOOLTIP:CULTURE,$roman_culture_tt$,X #L римское#!#! и норманнское, а также на наследие тех, кто властвовал здесь позднее. Каждое завоевание оставило свой след в архитектуре — нужно лишь уметь его распознать. [target_country.GetAdjective]ий двор встречает гостей такой великолепной церемонией, что дворы Северной #TOOLTIP:CONTINENT,europe,X #L Европы#!#! на его фоне кажутся временными пристанищами.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] уже [Select_CString(target_leader.IsFemale, 'побывала', 'побывал')] в #TOOLTIP:LOCATION,venice,X #L Венеции#!#!, #TOOLTIP:LOCATION,florence,X #L Флоренции#!#! и #TOOLTIP:LOCATION,rome,X #L Риме#!#!. Это последний урок."
 grand_tour_events.5.knowledge: "Посвятим последние недели посещению библиотек и древних руин."
 grand_tour_events.5.experience: "Примем участие в раскопках погребённого Геркуланума."
 grand_tour_events.5.connections: "Проведём последние недели при дворе. [court_host.GetNameWithNoTooltip] — того стоит."
 grand_tour_events.5.party: "Забудем уроки ради последней ночи в тавернах [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.5.historical_info: "В январе 1786 года Эстер Пьоцци поднималась на Везувий, держась на верёвке рядом со своим проводником Бартоломео по прозвищу «Циклоп Везувия». На полпути она решила передохнуть у кельи местного отшельника. Француз, живший там, внезапно узнал её и спросил: «Разве я не встречал вас прежде, мадам? Да, точно встречал. Я ведь даже делал вам укладку, когда работал парикмахером в Лондоне». Узнав, что четырёхлетний мальчик из её спутников уже добрался до края кратера, Пьоцци, пристыженная этим обстоятельством, продолжила восхождение на вулкан, чтобы собственными глазами увидеть дымящийся кратер Везувия. Впоследствии она описала эту встречу в своих путевых заметках."
 grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip] — Город древней Арены"
 grand_tour_events.6.desc: "[target_location.GetName] возвышается у изгиба реки. Его [target_location.GetRank.GetName|l] раскинулся в длинной тени амфитеатра, старше любого двора в #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Римская арена сохранилась почти целиком — её каменные ярусы поднимаются над крышами домов. Теперь здесь устраивают рынки и ярмарки, а в редкие праздничные дни проходят зрелища, отдалённо напоминающие игры, ради которых арену когда-то построили.\n\nВ [target_location.Custom('LR_PREP')|l] [target_location.GetName] есть не только руины, но и лекционные залы, а местный двор с нетерпением ждёт, когда [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] найдёт время представиться."
 grand_tour_events.6.knowledge: "Осмотрим римские руины и познакомимся с древними инженерными решениями строителей арены."
 grand_tour_events.6.experience: "Осмотрим мраморные карьеры и познакомимся с речной торговлей на Адидже."
 grand_tour_events.6.connections: "[court_host.GetNameWithNoTooltip] приглашает нас нанести визит. Кроме того, можно посетить влиятельнейшие семейства [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.6.party: "Оставим осмотр амфитеатра на потом и проведём ночь в тавернах внизу."
 grand_tour_events.6.historical_info: "Прибыв в Верону в апреле 1785 года, Эстер Пьоцци почувствовала, как её сердце «заметно расширилось» от восторга при виде столь хорошо сохранившегося римского амфитеатра. Позднее она назвала город «самым оживлённым на вид городом, в котором мне доводилось жить». Проводник, знакомивший её с древностями Филармонической академии, уверял её, что английские мраморы Арундела погубила угольная копоть. Однако она узнала в его словах дословную цитату из путеводителя #italic «Иллюстрированная Верона»#!, которую он просто выучил наизусть. В своих опубликованных путевых заметках она назвала этот обман «malafede и весьма нелепым предубеждением»."
 grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip] — Идеальный город"
 grand_tour_events.7.desc: "[target_location.GetName] не кажется творением случая — потому что таковым и не является. Широкие прямые проспекты пересекают [target_location.GetRank.GetName|l], образуя планировку, которая никогда не сложилась бы сама собой в средневековом городе. Город продуман заранее, чтобы быть не только удобным для жизни, но и радовать взор. Герцогский театр, типографии и поэты, собирающиеся при дворе, служат одной цели — превратить этот небольшой [target_location.GetRank.GetNameWithNoTooltip|l] в образец градостроительства будущего.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает ко двору, где поэзией интересуются не меньше, чем искусством управления государством."
 grand_tour_events.7.knowledge: "Полистаем рыцарские романы, хранящиеся в герцогской библиотеке."
 grand_tour_events.7.experience: "Осмотрите герцогскую оружейную и шлюзы на каналах [target_location.GetRank.Custom('LR_GEN')|l]."
 grand_tour_events.7.connections: "[court_host.GetNameWithNoTooltip] организует представление, стоит и его посетить."
 grand_tour_events.7.party: "Забудем на время о герцогских стихах и поищем более шумные развлечения."
 grand_tour_events.7.historical_info: "В апреле 1817 года лорд Байрон, путешествовавший по Италии, посетил больницу Святой Анны в Ферраре. Там, ему показали тесную камеру, в которой, согласно преданию, в 1580-х годах герцог Альфонсо II д’Эсте заточил поэта Торквато Тассо, посчитав его безумным. Эта реликвия прошлого произвела на Байрона более сильное впечатление, чем находившийся неподалёку памятник Ариосто. На следующий день он написал «Плач Тассо», драматический монолог, передающий отчаяние поэта. Посещение больницы стало одним из самых знаменитых паломничеств Большого путешествия эпохи романтизма, закрепив в воображении путешественников образ падшего двора д’Эсте в Ферраре."
 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip] — Учёный город"
 grand_tour_events.8.desc: "В [target_location.GetRank.Custom('LR_PREP')|l] [target_location.GetName] право и искусство ведения спора преподают дольше, чем где-либо ещё в христианском мире. [target_location.GetRank.GetName] открыто демонстрирует свою учёность: его портики заполнены студентами из разных стран, а лекционные залы старше большинства окружающих их церквей. [ROOT.GetCountry.GetGovernment.GetHeirTitle] может прожить здесь всю жизнь и всё равно не прочесть всех трудов, созданных выдающимися правоведами.\n\nЕсть здесь и двор, заслуживающий внимания, если политика интересует нас больше, чем юриспруденция."
 grand_tour_events.8.knowledge: "Посетим лекцию по гражданскому праву в университете."
 grand_tour_events.8.experience: "Осмотрим шёлковые фабрики, благодаря которым ткани [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] получили известность."
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.party: "Оставим лекции на потом и скоротаем время за вином со студентами."
 grand_tour_events.8.historical_info: "В 1739 году французский юрист Шарль де Бросс, путешествовавший по Италии, провёл вечер в Болонье в гостях у Лауры Басси, которая к тому времени снискала славу первой женщины в Европе, возглавившей университетскую кафедру. В её доме собирались местные учёные, чтобы обсудить вопросы такой новой науки, как электричество. Позднее де Бросс вспоминал, как ему пришлось освежить свои подзабытые школьные знания латыни, чтобы вместе с собравшимися рассуждать о магнетизме и «необычайном притяжении наэлектризованных тел». Он описал этот вечер в своих #italic «Письмах, написанных из Италии»#!, а салон Басси стал одним из самых посещаемых мест для участников Большого путешествия, приезжавших в Болонью."
 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip] — Город Палио"
 grand_tour_events.9.desc: "[target_location.GetName] раскинулся на трёх холмах вокруг площади, очертаниями напоминающей раковину. Собор с полосатой облицовкой виден с каждой улицы, поднимающейся к нему. [target_location.GetRank.GetName] разбогател благодаря торговле #TOOLTIP:GOODS,wool,X #L шерстью#!#! и банковскому делу, прежде чем #TOOLTIP:LOCATION,florence,X #L Флоренция#!#! сумела затмить его славу. Сиена так и не смирилась с утратой былого положения, и это соперничество до сих пор ощущается в каждом разговоре при дворе.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает как раз к скачкам, которые дважды в год проходят на площади, украшенной знамёнами."
 grand_tour_events.9.knowledge: "Посетим лекцию по каноническому праву в университете."
 grand_tour_events.9.experience: "Осмотрим фрески и полистаем знаменитые банковские книги [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.9.connections: "Понаблюдаем за скачками с лоджии, которую по обыкновению занимает [court_host.GetNameWithNoTooltip]."
 grand_tour_events.9.party: "Отложим осмотр фресок ради игорных столов на Кампо."
 grand_tour_events.9.historical_info: "Осенью 1764 года романист Тобайас Смоллетт, направлявшийся из Флоренции в Рим, остановился на ночь в Сиене. В своей книге #italic «Путешествия по Франции и Италии»#! он с раздражением жаловался, что его «поселили в доме, провонявшем отхожим местом», «за ужином кормили из рук вон плохо». При этом Смоллетт признавал, что город «велик и хорошо выстроен», и отмечал, что сиенцы настолько «гордятся своей учтивостью и чистотой своего диалекта», что иностранные путешественники останавливались в Сиене специально, чтобы научиться правильному итальянскому произношению. Рассказ Смоллетта стал одной из самых известных английских жалоб на гостеприимство Тосканы в эпоху Большого путешествия."
 grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip] — Город Падающей башни"
 grand_tour_events.10.desc: "[target_location.GetName] возвёл колокольню, которая начала крениться, но вместо того, чтобы снести её, продолжил строительство. Теперь [target_location.GetRank.GetName|l] гордится её наклоном, а не считает его недостатком. Некогда Пиза была морской державой, на равных соперничавшей с #TOOLTIP:LOCATION,genoa,X #L Генуей#!#! и #TOOLTIP:LOCATION,venice,X #L Венецией#!#!. Однако от былого флота не осталось и следа. Вместо этого город обзавёлся университетом и соборной площадью.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] может здесь посвятить время учёбе или прогуляться по гавани, некогда игравшей важную роль."
 grand_tour_events.10.knowledge: "Посетим лекции в университете на соборной площади."
 grand_tour_events.10.experience: "Осмотрим старый арсенал и мастерские кожевенников на берегах Арно."
 grand_tour_events.10.connections: "[court_host.GetNameWithNoTooltip] организует приём, стоит нанести вести и представиться."
 grand_tour_events.10.party: "Сбежим с лекции ради ночи в тавернах у гавани."
 grand_tour_events.10.historical_info: "В конце 1821 года Перси и Мэри Шелли обосновались в Пизе и убедили лорда Байрона присоединиться к ним, разместив его в Палаццо Ланфранки на набережной Лунгарно. Вместе с Эдвардом и Джейн Уильямс, а позднее и Эдвардом Трелони, они образовали сообщество, впоследствии получившее название «Пизанский кружок». Байрон привёз с собой лошадей, собак и обезьян, а участники кружка провели зиму, обдумывая планы литературного журнала #italic «Либерал»#!. Ли Хант добрался до Италии лишь следующим летом и сошёл на берег всего за несколько дней до того, как в июле Шелли утонул у побережья Тосканы. В течение нескольких месяцев созданный Шелли в Пизе кружок распался, оставив городу одно из самых памятных мест в истории романтизма."
 grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip] — Город Святого Франциска"
 grand_tour_events.11.desc: "[target_location.GetName] раскинулся на зелёном склоне холма вокруг базилики, где покоятся мощи его знаменитого уроженца, монаха, отринувшего всё мирское и превратившего [target_location.GetRank.GetName|l] в одно из главных мест паломничества на Западе. Фрески, покрывающие стены базилики, привлекают художников не меньше, чем паломников.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] может посвятить время изучению фресок или общению с монахами, которые и по сей день живут по уставу своего ордена."
 grand_tour_events.11.knowledge: "Изучим фрески и житие святого."
 grand_tour_events.11.experience: "Осмотрим мастерские, где изготавливают предметы религиозного почитания и памятные знаки для паломников."
 grand_tour_events.11.connections: "[court_host.GetNameWithNoTooltip] и городские чиновники не против с нами познакомиться. Не будем заставлять их долго ждать."
 grand_tour_events.11.party: "Променяем общество монахов на более весёлый вечер в городе."
 grand_tour_events.11.historical_info: "Вечером 26 октября 1786 года Иоганн Вольфганг фон Гёте прибыл в Ассизи. В своём #italic «Итальянском путешествии»#! он вспоминал, как отвернулся от «огромного нагромождения церквей, поставленных одна на другую, словно Вавилонская башня», где хранились мощи святого Франциска, открыто выразив отвращение к этому месту паломничества. Вместо этого он поднялся к римскому храму Минервы на площади старого города и назвал его «первым целым памятником античности, который я когда-либо видел». То, что Гёте предпочёл языческий храм самой знаменитой святыне Ассизи, стало одним из самых поразительных личных мнений, сохранившихся со времён Большого путешествия."
 grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip] — Этрусский город"
 grand_tour_events.12.desc: "[target_location.GetName] стоит на холме за стенами, возведёнными этрусками задолго до возвышения Рима. Жители [target_location.GetRank.Custom('LR_GEN')|l] и по сей день проходят через древние ворота, не задумываясь об их истории. В последнее время местные живописцы прославились по всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!, а университет по-прежнему собирает полные лекционные залы.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] может посвятить время изучению древних стен или знакомству с новыми картинами сообразно своим интересам."
 grand_tour_events.12.knowledge: "Посетим университет и пройдёмся по древним этрусским стенам."
 grand_tour_events.12.experience: "Осмотрим гончарные мастерские, прославившиеся изделиями из майолики."
 grand_tour_events.12.connections: "[court_host.GetNameWithNoTooltip] устраивает приём — попросим представить нас при дворе."
 grand_tour_events.12.party: "Забудем о древних стенах ради ночи в тавернах, где собираются студенты."
 grand_tour_events.12.historical_info: "В начале 1765 года романист Тобайас Смоллетт возвращался из Рима во Флоренцию, когда его экипаж начал крутой подъём к Перудже. Измученные лошади не справлялись с тяжестью кареты и стали скользить назад, увлекая её к краю пропасти. В последний момент прохожий подложил большой камень под одно из колёс и остановил экипаж, и тем самым спас всех пассажиров от того, чтобы, по словам самого Смоллетта, «разбиться вдребезги». Поскольку в тот день перекладных не нашлось, Смоллетту и его семье пришлось заночевать в городе. Они посетили местные церкви и осмотрели картины Пьетро Перуджино, прославленного уроженца этих мест, а затем продолжили путь во Флоренцию."
 grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip] — Город на Дунае"
 grand_tour_events.13.desc: "[target_location.GetName] контролирует переправу через реку, у которой сходятся пути из #TOOLTIP:REGION,italy_region,X #L Италии#!#!, с #TOOLTIP:REGION,balkan_region,X #L Балкан#!#! и из #TOOLTIP:LANGUAGE,german_language,X #L германских#!#! земель. Доходы от пошлин принесли [target_location.GetRank.Custom('LR_DAT')|l] [target_location.GetRank.GetName] немалое богатство. В самом центре возвышается герцогский дворец Хофбург, где располагается двор, претендующего на куда большее, чем положение сугубо регионального игрока.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] наконец пересекает Альпы. Теперь дороги станут ровнее, а путь — легче."
 grand_tour_events.13.knowledge: "Посетим соборные школы и познакомимся с городскими учёными."
 grand_tour_events.13.experience: "Осмотрим арсенал и лодочные пристани вдоль Дуная."
 grand_tour_events.13.connections: "[court_host.GetNameWithNoTooltip] устраивает прием в Хофбурге, стоит представиться."
 grand_tour_events.13.party: "Отложим учёбу в соборных школах ради ночи на берегах Дуная."
 grand_tour_events.13.historical_info: "В 1775 году врач Джон Мур путешествовал по Вене в качестве спутника юного герцога Гамильтона. Сначала их принял на частной аудиенции император Иосиф II, а затем они удостоились приёма у самой императрицы Марии Терезии в Шёнбруннском дворце. Мур отметил, что легендарная чопорность двора рассеялась, когда государственный канцлер князь Кауниц заметил среди путешественников четырнадцатилетнего сына Мура и настоял, чтобы император и императрица приняли также и юношу. Мур записал и старую придворную историю о вспышке оспы, поразившей семью Габсбургов восемью годами ранее. Узнав об оспе, одна из дочерей императрицы потребовала зеркало и не теряя самообладания попрощалась с красотой, которую болезнь вскоре должна была у неё отнять."
 grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip] — Золотой город"
 grand_tour_events.14.desc: "[target_location.GetName] раскинулся по обоим берегам Влтавы. Каменный мост соединяет Старый город с замковым холмом, а [target_location.GetRank.GetName|l] держится так, словно является столицей империи. Университет на холме привлекает студентов со всех концов #TOOLTIP:LANGUAGE,german_language,X #L германских#!#! земель и из-за их пределов.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] оказывается в городе, который измеряет собственную значимость столетиями, а не годами."
 grand_tour_events.14.knowledge: "Посетим лекции в университете на холме."
 grand_tour_events.14.experience: "Осмотрим стеклодувные мастерские и мастерские ювелиров на Золотой улочке."
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.14.party: "Пропустим занятия в университете ради ночи в тавернах на реке."
 grand_tour_events.14.historical_info: "В 1775 году врач Джон Мур сопровождал юного герцога Гамильтона в путешествии по Богемии. Когда они стояли на одной из пражских улиц, их разговор услышал проходивший мимо священник одной из городских семинарий. «Уверяю вас, я тоже ирландец», — заявил он. Когда его спросили, как ему удалось так быстро догадаться об их происхождении, священник ответил, что понял всё, едва услышал их английскую речь. До конца их пребывания в Праге он стал их проводником и, среди прочего, показал им окно канцелярии, из которого в 1618 году выбросили двух дворян и их секретаря. Мур с сухой иронией заметил, что этот прецедент стоило бы рекомендовать государственным деятелям повсюду."
 grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip] — Город монахов"
 grand_tour_events.15.desc: "[target_location.GetName] получил своё название от монахов, чья обитель находилась здесь ещё до того, как герцоги основали рядом рынок и монетный двор. С тех пор [target_location.GetRank.GetName|l] значительно разросся. Герцогский двор Виттельсбахов поддерживает в [target_location.GetRank.Custom('LR_PREP')|l] порядок лучше, чем во многих других городах, а местные пивовары исправно снабжают горожан своим напитком.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] найдёт здесь и учёных, и хорошо организованный двор."
 grand_tour_events.15.knowledge: "Посетим соборные школы и познакомимся с городскими летописцами."
 grand_tour_events.15.experience: "Осмотрим герцогский арсенал и склады с солью."
 grand_tour_events.15.connections: "[court_host.GetNameWithNoTooltip] устраивает приём при герцогском дворе, стоит представиться."
 grand_tour_events.15.party: "Отложим летописи ради ночи в компании пивоваров."
 grand_tour_events.15.historical_info: "В 1786 году писательница Эстер Линч Пьоцци отправилась вместе с мужем в продолжительное свадебное путешествие по Европе. На рассвете, после ночного перехода через Альпы из Инсбрука, супруги прибыли в Мюнхен и отправились осматривать картинную галерею курфюрста и его кабинет редкостей. Среди экспонатов, которые показал ей местный коллекционер, оказалось миниатюрное изображение Богоматери с Младенцем, выполненное из материала, напоминавшего скрученную паутину. Оно было настолько тонким, что изображённые фигуры невозможно было различить невооружённым глазом — они становились видны лишь под микроскопом. Пьоцци с изумлением описала увиденное, поражаясь тому, сколько труда потребовало создание столь тонкого и непрактичного произведения."
 grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip] — Город на Сене"
 grand_tour_events.16.desc: "[target_location.GetName] раскинулся по обоим берегам реки вокруг острова, на котором возвышается величественный собор. [target_location.GetRank.GetName] крупнее почти всех городов, которые [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] и свита успели увидеть за время этого путешествия. В университетском квартале на левом берегу теологию и право изучают больше студентов, чем жителей насчитывает большинство городов.\n\nКоролевский двор принимает гостей с такой торжественностью, что его высокое мнение о самом себе не вызывает ни малейших сомнений."
 grand_tour_events.16.knowledge: "Посетим учёные диспуты в университете на левом берегу."
 grand_tour_events.16.experience: "Заглянем в переплётные мастерские и типографии неподалёку от университета. "
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.16.party: "Откажемся от диспутов ради посиделок в тавернах на левом берегу."
 grand_tour_events.16.historical_info: "В октябре 1763 года, во время своего пребывания в Париже, романист Тобайас Смоллетт увидел по дороге в Шуази наёмную карету и то, как из неё выпрыгнули пятеро или шестеро вооружённых мужчин. Каждый занял позицию за отдельным деревом. Полагая, что это дорожные разбойники или стражники, преследующие преступника, Смоллетт спросил слугу, кто они такие. Оказалось, что это господа, приехавшие из города на однодневную охоту на зайцев: укрывшись за деревьями, они стреляли в любую дичь, которая пробегала мимо. Всё это зрелище показалось Смоллетту гротескным, и он иронично заметил, что, по крайней мере, таким способом можно эффективно очистить поле от зайцев."
 grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip] — Город ярмарок"
 grand_tour_events.17.desc: "[target_location.GetName] стоит у слияния двух рек, и [target_location.GetRank.GetName|l] превратил это выгодное расположение в источник богатства. На королевские ярмарки сюда съезжаются купцы из #TOOLTIP:REGION,italy_region,X #L Италии#!#!, #TOOLTIP:CULTUREGROUP,german_group,X #L германских#!#! земель и Фландрии. В ярмарочные дни улицы заполняются торговцами #TOOLTIP:GOODS,silk,X #L шёлком#!#! и #TOOLTIP:GOODS,dyes,X #L красителями#!#!. Товаров прибывает больше, чем способны вместить городские склады. Местные печатни работают почти так же быстро, как ткачи ткут ткани.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает в город, жизнь которого определяется торговлей, а не придворными церемониями."
 grand_tour_events.17.knowledge: "Разыщем поэтов-гуманистов, собирающихся в печатнях."
 grand_tour_events.17.experience: "Посетим типографии и изучим купеческие бухгалтерские книги."
 grand_tour_events.17.connections: "[court_host.GetNameWithNoTooltip] приглашает нас нанести визит. Кроме того, можно посетить крупнейших купцов [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.17.party: "Отложим учётные книги и проведём ночь в компании гуляк."
 grand_tour_events.17.historical_info: "В октябре 1763 года романист Тобайас Смоллетт прибыл в Лион по пути на юг, в Италию. Свои впечатления он изложил в письмах, позднее опубликованных в книге #italic «Путешествия по Франции и Италии»#!. Сначала его направили в меблированные комнаты, где не оказалось свободных мест. В другой таверне с него потребовали двенадцать ливров в день за три убогие комнаты и ещё тридцать два ливра за еду. Возмущённый откровенным вымогательством, он молча вышел и поехал в другую гостиницу. Его рассказ о лионских постоялых дворах, завышавших цены, стал одним из самых цитируемых фрагментов книги и превратился в излюбленный повод для жалоб английских путешественников, направлявшихся в Италию."
 grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip] — Перекрёсток дорог"
 grand_tour_events.18.desc: "[target_location.GetName] обязан своим названием пересекающимся здесь дорогам. [target_location.GetRank.GetName] и поныне служит местом их пересечения, раскинувшись по обе стороны реки, разделяющей #TOOLTIP:LANGUAGE,french_language,X #L франкоязычные#!#! и #TOOLTIP:LANGUAGE,german_language,X #L германоязычные#!#! земли. Шпиль городского собора возвышается выше всего, что [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] и свита видели за время путешествия. У собора только одна башня: вторую, задуманную ей в пару, так и не построили.\n\nВольный город управляет собой сам, а его печатники в последнее время приобрели не меньшее значение, чем купцы."
 grand_tour_events.18.knowledge: "Посетим лекцию в гимназии Иоганнеса Штурма."
 grand_tour_events.18.experience: "Поднимемся на соборную башню и осмотрим типографии."
 grand_tour_events.18.connections: "[court_host.GetNameWithNoTooltip] и городской совет устраивают приём, на который мы приглашены."
 grand_tour_events.18.party: "Отложим посещение типографий ради ночи в тавернах под соборным шпилем."
 grand_tour_events.18.historical_info: "В начале 1770-х годов шотландский врач Джон Мур путешествовал по континентальной Европе в качестве спутника герцога Гамильтона. В Страсбурге он поднялся на шпиль собора высотой 466 футов и позднее описал это посещение в книге #italic «Взгляд на общество и обычаи Франции, Швейцарии и Германии»#!. Мур вспоминал, как вместе с толпой зевак ожидал прибытия на мессу незаконнорождённого сына Людовика XV. Однако полдень наступил раньше, чем появился вельможа, и собравшиеся разошлись, так и не услышав службы. Позднее Мур услышал страстную проповедь о тирании страстей. Он также отметил огромный соборный рог, в который каждую ночь трубили в память о заговоре, с которым местные проводники по-прежнему связывали резню, произошедшую четыреста лет назад."
 grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip] — Врата Средиземноморья"
 grand_tour_events.19.desc: "[target_location.GetRank.GetName] [target_location.GetName] был портом ещё до возникновения Рима. Его основали #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческие#!#! мореплаватели, увидевшие гавань и решившие остаться здесь навсегда. И по сей день в каждом его квартале пахнет солью и дёгтем. У набережных теснится множество галер со всего Средиземноморья, а на рынках продают товары, которые не суждено попасть во внутренние области #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] увидит, что настоящим хозяином [target_location.GetRank.Custom('LR_GEN')|l] остаётся море."
 grand_tour_events.19.knowledge: "Изучим надписи, напоминающие о греческих основателях [target_location.GetRank.Custom('LR_GEN')|l]."
 grand_tour_events.19.experience: "Посетим гавань и побеседуем со средиземноморскими моряками."
 grand_tour_events.19.connections: "[court_host.GetNameWithNoTooltip] устраивает приём, его стоит посетить."
 grand_tour_events.19.party: "Променяем светские пересуды на ночь в тавернах у причалов."
 grand_tour_events.19.historical_info: "В мае 1765 года романист Тобайас Смоллетт прибыл в Марсель, возвращаясь через Прованс. Свои впечатления от портового города он изложил в письмах, позднее опубликованных в книге #italic «Путешествия по Франции и Италии»#!. Прогуливаясь по набережной гавани, Смоллетт наблюдал за галерными рабами, которых корона сдавала внаём для работы в небольших съёмных лавках. Они работали сапожниками, серебряных дел мастерами и книготорговцами и, невзирая на то, что их приковывали цепью за одну ногу, они, по его наблюдениям, жили неплохо и выглядели жизнерадостными. Смоллетт счёл Марсель величественным и процветающим городом, хотя и жаловался, что хозяева гостиниц брали с него по четыре ливра с человека за каждую трапезу."
 grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip] — Город Августа"
 grand_tour_events.20.desc: "[target_location.GetName] носит имя основавшего его императора, и с тех пор [target_location.GetRank.GetName|l] не перестаёт расти. Местные банкирские дома оперируют суммами, на фоне которых казна некоторых королей кажется скромной. Имперский рейхстаг собирается здесь так часто, что [target_location.GetRank.GetNameWithNoTooltip|l] привык принимать князей.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] видит, что здесь о деньгах говорят столь же открыто, как и о происхождении."
 grand_tour_events.20.knowledge: "Осмотрим древние памятники города и изучим рукописи гуманистов."
 grand_tour_events.20.experience: "Ознакомимся с бухгалтерскими книгами крупнейших банкирских домов."
 grand_tour_events.20.connections: "Посетим приём, который устраивает [court_host.GetNameWithNoTooltip]."
 grand_tour_events.20.party: "Отложим учётные книги ради игорных столов."
 grand_tour_events.20.historical_info: "Утром 15 июля 1772 года английский историк музыки Чарльз Бёрни прибыл в Аугсбург, проведя всю ночь в пути, и сразу направился в кафедральный собор. Там он услышал проповедь на немецком языке, а затем праздничную мессу в исполнении двух хоров. Пение ему понравилось, однако гармонии органиста показались настолько грубыми и вычурными, что музыка скорее мучила слух, чем доставляла удовольствие. Бёрни также поразил резкий грохот барабанов и труб во время возношения Святых Даров. С таким он прежде сталкивался лишь в Антверпене. Узнав, что кантор, к которому он вёз рекомендательные письма, был в отъезде, Бёрни не стал задерживаться и продолжил путешествие, собирая материалы для своей истории музыки."
 grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip] — Кафедральный город"
 grand_tour_events.21.desc: "Строительство кафедрального собора в [target_location.Custom('LR_PREP')|l] [target_location.GetName] длится так давно, что никто из ныне живущих не помнит, когда оно началось. Над #L #TOOLTIP:LOCATIONRANK,[target_location.GetRank.Custom('LR_tt')],X [target_location.GetRank.Custom('LR_INST')|l]#!#! возвышается недостроенная башня, на вершине которой всё ещё стоит подъёмный кран, оставленный каменщиками. По Рейну мимо этого [target_location.GetRank.Custom('LR_GEN')|l] проходит больше торговых судов, чем почти где-либо ещё в #TOOLTIP:LANGUAGE,german_language,X #L немецкоязычных#!#! землях, а архиепископ обладает властью, сопоставимой с властью любого князя.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает в город, где терпение измеряют столетиями."
 grand_tour_events.21.knowledge: "Посетим строительную площадку кафедрального собора и пообщаемся с учёными университета."
 grand_tour_events.21.experience: "Осмотрим литейные мастерские, где отливают колокола для церквей Рейнской области."
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.21.party: "Отложим осмотр собора ради вечера на берегу Рейна."
 grand_tour_events.21.historical_info: "В сентябре 1794 года писательница Анна Радклиф прибыла в Кёльн во время путешествия по Рейнской области вместе с мужем. Позднее она описала эту поездку в путевых заметках #italic «Путешествие, совершенное летом 1794 года»#!. Город был переполнен беженцами, спасавшимися от французских армий, наступавших на Льеж и Маастрихт. Улицы заполнили санитарные повозки с ранеными и умирающими. Все гостиницы были заняты, и путешественникам приходилось ночевать в экипажах, на бильярдных столах и шезлонгах — свободных комнат не было. Позднее Радклиф писала, что увиденное дало ей более глубокое представление об истинной цене войны, чем любое описание сражения, которое ей доводилось читать."
 grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip] — Город Барсино"
 grand_tour_events.22.desc: "[target_location.GetName] ведёт историю своих стен от римской колонии, некогда стоявшей на этом месте, а [target_location.GetRank.GetName|l] превратился в самый оживлённый порт побережья. Его гавань заполнена галерами, перевозящими #TOOLTIP:GOODS,wool,X #L шерсть#!#!, пряности и #TOOLTIP:GOODS,dyes,X #L красители#!#! по всему западному Средиземноморью. К собственному морскому кодексу города обращаются даже капитаны, никогда в нём не бывавшие.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] уже почти дома."
 grand_tour_events.22.knowledge: "Посетим лекцию о законах каталонских #italic кортесов#!."
 grand_tour_events.22.experience: "Изучим морской кодекс, хранящийся на торговой бирже."
 grand_tour_events.22.connections: "[court_host.GetNameWithNoTooltip] устраивает приём, стоит представиться."
 grand_tour_events.22.party: "Отложим морской кодекс ради вечера в тавернах у причалов."
 grand_tour_events.22.historical_info: "В конце октября 1775 года английский антиквар Генри Суинберн прибыл в Барселону незадолго до того, как городские ворота закрылись на ночь. Позднее он описал этот случай в книге #italic «Путешествия по Испании в 1775 и 1776 гг.»#!. Нанеся визит вежливости губернатору, Суинберн отправился в театр и поначалу вынес суровый приговор увиденному: «На этой сцене воцарилась скука». Но спустя несколько дней его мнение изменилось благодаря энергичной постановке #italic «Эль Сид Кампеадор»#!, в которой актёры были одеты в старинные испанские костюмы. Осмотрев цитадель, он отметил, что её расположили в сырой, кишащей комарами низине, а выбор места, по его мнению, объяснялся скорее стремлением держать город в страхе, чем заботой о здоровье."
 grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip] — Город королей"
 grand_tour_events.23.desc: "Замок на холме [target_location.Custom('LR_GEN')|l] [target_location.GetName] служит местом коронации и погребения королей, а [target_location.GetRank.GetName|l] относится к обеим церемониям с одинаковой торжественностью. Его университет старше большинства высших учебных заведений #TOOLTIP:LANGUAGE,german_language,X #L немецкоязычных#!#! земель. Здесь студенты со всего региона астрономию и право. Торговля #TOOLTIP:GOODS,amber,X #L янтарём#!#! и #TOOLTIP:GOODS,salt,X солью#! обеспечивает постоянное оживление на городских рынках.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает в последний крупный город на пути домой."
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.23.experience: "Осмотрим Суконные ряды, где купцы предлагают свои товары."
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.23.party: "Отложим занятия в лекционном зале ради ночной прогулки у замка."
 grand_tour_events.23.historical_info: "25 июля 1778 года Уильям Кокс, наставник юного лорда Герберта, сопровождавший его в продолжительном Большом путешествии по Северной и Восточной Европе, пересёк Вислу и прибыл в Краков. Бывшая столица Польши всё ещё носила следы недавних осад: пушечные ядра и картечь оставили на городе свои отметины, а великолепные особняки лежали в руинах. Кокс посетил университет, основанный Казимиром Великим. Библиотекарь показал ему турецкую книгу, не имевшую большой самостоятельной ценности, но считавшуюся большой редкостью. Её захватили в качестве трофея в Хотинской битве, а затем сам король Ян Собеский преподнёс её университету в память о победе, спасшей Польшу и принесшей ему польский престол."
 grand_tour_events.24.title: "Куда дальше?"
 grand_tour_events.24.desc: "Из [target_location.Custom('LR_GEN')|l] [target_location.GetName] ведут несколько дорог. [target_leader.GetName] предстоит решить, куда продолжить путь: вглубь #TOOLTIP:REGION,italy_region,X #L Италии#!#! или направиться домой."
 grand_tour_events.24.a: "Сделать крюк через Верону."
 grand_tour_events.24.b: "Вместо этого направиться к Ферраре."
 grand_tour_events.24.c: "Свернуть к Болонье."
 grand_tour_events.24.d: "Держать путь на Флоренцию."
 grand_tour_events.24.e: "Сделать остановку в Сиене."
 grand_tour_events.24.f: "Сначала заехать в Пизу."
 grand_tour_events.24.g: "Направиться к Ассизи."
 grand_tour_events.24.h: "Вместо этого направиться к Перудже."
 grand_tour_events.24.i: "Держать путь на Рим."
 grand_tour_events.24.j: "Продолжить свой путь к Неаполю."
 grand_tour_events.24.k: "Большое путешествие подходит к концу. Пора возвращаться домой."
 grand_tour_events.25.title: "Путь домой"
 grand_tour_events.25.desc: "Наконец кавалькада поворачивает в сторону дома. Вместо того чтобы повторять весь южный маршрут в обратном направлении, [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] выбрать место для остановки перед последним этапом пути — чтобы дать лошадям отдохнуть и, возможно, посетить ещё один двор, прежде чем вернуться домой."
 grand_tour_events.25.desc.second: "Одной остановки недостаточно, чтобы считать возвращение домой состоявшимся. Прежде чем [target_leader.GetName] вернётся в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName], [Select_CString(target_leader.IsFemale, 'ей', 'ему')] предстоит выбрать ещё один город для остановки: последний двор, последняя диковинка — и лишь после этого Большое путешествие действительно завершится."
 grand_tour_events.25.a: "Сделать остановку в Вене."
 grand_tour_events.25.b: "Дать лошадям отдохнуть в Праге."
 grand_tour_events.25.c: "Повернуть домой через Мюнхен."
 grand_tour_events.25.d: "Сделать остановку в Париже перед последним отрезком пути."
 grand_tour_events.25.e: "На обратном пути домой проехать через Лион."
 grand_tour_events.25.f: "Сначала пересечь море и заехать в Лондон, а затем двинуться вглубь страны"
 grand_tour_events.25.g: "Сначала завернуть в Страсбург."
 grand_tour_events.25.h: "Проехать через Марсель."
 grand_tour_events.25.i: "Перед последним отрезком пути заехать в Аугсбург."
 grand_tour_events.25.k: "Немного отдохнуть в Кёльне."
 grand_tour_events.25.l: "Вернуться домой морем через Барселону."
 grand_tour_events.25.n: "Сделать остановку в Орлеане."
 grand_tour_events.25.o: "Перед последним отрезком пути домой проехать через Краков."
 grand_tour_events.25.p: "Хватит откладывать возвращение. Немедленно отправляемся домой."
 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip] — Город на Темзе"
 grand_tour_events.26.desc: "[target_location.GetName] раскинулся вдоль реки за стенами, впервые возведёнными римлянами, и с тех пор далеко перерос их пределы. Даже мост застроен домами и лавками. Торговля #TOOLTIP:GOODS,wool,X #L шерстью#!#! наполняет городские склады, а парламент заседает здесь столь часто, что [target_location.GetRank.GetNameWithNoTooltip|l] привык принимать тех, кто ведёт государственные дела.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] убеждается, что местный двор по своим амбициям ничуть не уступает любому другому на континенте."
 grand_tour_events.26.knowledge: "Послушаем лекцию об общем праве в одном из иннов корпораций барристеров."
 grand_tour_events.26.experience: "Нанесём визит торговцам шерстью и посетим места собраний городских цехов."
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.party: "Отложим посещение собраний городских цехов ради вечера в тавернах [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 grand_tour_events.26.historical_info: "В 1765 году французский юрист и литератор Пьер-Жан Гросле провёл почти год в Лондоне, собирая материалы для книги, позднее переведённой под названием #italic «Путешествие в Лондон»#!. Среди прочих наблюдений он описал, как один государственный министр провёл за игорным столом целый день, поддерживая силы исключительно холодной говядиной, положенной между двумя ломтиками поджаренного хлеба. «Это новое блюдо, — писал Гросле, — стало весьма популярным за время моего пребывания в Лондоне». Впоследствии оно получило имя своего изобретателя. Этот случай, правдивый или приукрашенный, стал самым часто цитируемым эпизодом книги Гросле о его путешествии."
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], Город на Луаре"
 grand_tour_events.27.desc: "[target_location.GetName] расположен там, где Луара поворачивает на север, прежде чем вновь направиться к морю. [target_location.GetRank.GetName] издавна извлекает выгоду из торговли, идущей по реке. В местном университете право преподают почти столь же строго, как в Болонье, а городские стены выдерживали осады, пережить которые другим городам не удалось.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] встречает здесь учёных и солдат, которым есть что рассказать."
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.experience: "Осмотрим винные погреба и посетим гильдию лодочников на Луаре."
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.party: "Пропустим лекции по праву ради вечера в тавернах у реки."
 grand_tour_events.27.historical_info: "В апреле 1644 года молодой писатель Джон Ивлин остановился в Орлеане во время путешествия вниз по Луаре, ставшего одним из первых документально засвидетельствованных Больших путешествий. Он посетил старинный университет, студенты которого по-прежнему делились на четыре исторические «нации»: французскую, нормандскую, пикардийскую и верхненемецкую. У каждой были свои собственные выборные представители. Ивлин также посетил две публичные городские библиотеки и с удивлением отмечал, что учёный мог взять книгу к себе домой, в своё жилище, просто оставив записку со своей подписью. Такая свобода библиотечных правил показалась ему примечательной. Кроме того, он осмотрел соборную церковь Святого Креста, некогда величественную, но всё ещё хранившую заметные следы недавних гражданских войн."
 grand_tour_events.28.title: "Возможность получить образование"
 grand_tour_events.28.desc.university: "До свиты дошли вести, что [target_leader.GetName] может поступить в университет [target_location.Custom('LR_GEN')|l] [target_location.GetName] и это можно устроить. Там [Select_CString(target_leader.IsFemale, 'её', 'его')] ждут лекции, диспуты и общество учёных, чьи имена будут помнить ещё долго после того, как это Большое путешествие забудется."
 grand_tour_events.28.desc.scholar: "До свиты дошли вести об учёном из [target_location.Custom('LR_GEN')|l] [target_location.GetName], чья слава привлекает студентов со всего континента. Если предложить ему достойное вознаграждение и если [target_leader.GetName] придётся ему по душе, он может согласиться на время стать [Select_CString(target_leader.IsFemale, 'её', 'его')] наставником."
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.29.title: "Учёба подходит к концу"
 grand_tour_events.29.desc: "Месяцы учёбы подходят к концу, и [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, чему на самом деле удалось научиться в [target_location.Custom('LR_PREP')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.30.title: "Возможность получить боевой опыт"
 grand_tour_events.30.desc: "[ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что [target_country.GetLongName] наход[target_country.Custom('endlong_ityat')]ся в состоянии войны, а его офицерский корпус готов принимать добровольцев, если их представят нужным людям. [target_leader.GetName] не получит реального командования и не будет нести ответственности за то, что случится с солдатами, но сможет ездить верхом рядом с опытными офицерами, наблюдать за военной кампанией своими глазами и узнать то, чего не прочтёт ни в одной книге по военной стратегии."
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.31.title: "Военная кампания подходит к концу"
 grand_tour_events.31.desc: "Время военных походов подходит к концу, и [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, чему на самом деле удалось научиться у офицеров [target_location.Custom('LR_GEN')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.32.title: "Возможность обзавестись связями"
 grand_tour_events.32.desc: "[target_leader.GetName] получает приглашение провести сезон при дворе [target_country.Custom('longname_ru_GEN')] в качестве почётного гостя. [Select_CString(target_leader.IsFemale, 'Ей', 'Ему')] предоставят покои во дворце, будут ждать на каждом приёме и представят всех придворных и приезжих дипломатов, с которыми стоит познакомиться."
 grand_tour_events.32.desc.no_owner: "[target_leader.GetName] получает приглашение провести сезон в доме влиятельнейшего семейства [target_location.Custom('LR_GEN')|l] [target_location.GetName]. [Select_CString(target_leader.IsFemale, 'Её', 'Его')] представят всем достойным внимания людям и будут неизменно приглашать к семейному столу."
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.33.title: "Придворный сезон подходит к концу"
 grand_tour_events.33.desc: "Придворный сезон подходит к концу, и [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, что в действительности дали ему знакомства, заведённые в [target_location.Custom('LR_PREP')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$."
 grand_tour_events.33.a: "Поразмыслим над тем, что нам удалось извлечь из новых знакомств и продолжим наш путь."
 grand_tour_events.34.title: "Возможность постичь искусство фехтования"
 grand_tour_events.34.desc: "[ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что в [target_location.Custom('LR_PREP')|l] [target_location.GetName] находится прославленный мастер фехтования, готовый на целый сезон взять в ученики [Select_CString(target_leader.IsFemale, 'подающую надежды юную девушку', 'подающего надежды молодого человека')]. [target_leader.GetName] не участвовать в серьёзных дуэлях или улаживать настоящие распри, зато [Select_CString(target_leader.IsFemale, 'она', 'он')] сможет освоить работу ног, чувство момента и ту особую отвагу, которой не научит ни одно наставление по владению оружием."
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.35.title: "Занятия подходят к концу"
 grand_tour_events.35.desc: "Сезон занятий подходит к концу, и [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'должна', 'должен')] решить, чему на самом деле удалось научиться на поединках в [target_location.Custom('LR_PREP')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.36.title: "Письмо с родины"
 grand_tour_events.36.desc: "Наконец до участников Большого путешествия доходит письмо из #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. В нём [ROOT.GetCountry.GetGovernment.GetRuler.GetName] с теплотой пишет о том, что [target_leader.GetName] пользуется всеобщим уважением при дворе, а [Select_CString(target_leader.IsFemale, 'её', 'его')] рассказы о времени, проведённом за границей, неизменно впечатляют всех придворных. На родине эти путевые заметки уже не раз становились темой застольных бесед."
 grand_tour_events.36.a: "Отметим получение весточки небольшим торжеством."
 grand_tour_events.36.b: "Нам некогда возвращаться к прежним придворным делам."
 grand_tour_events.37.title: "[Select_CString(gt_admirer.IsFemale, 'Местная поклонница', 'Местный поклонник')]"
 grand_tour_events.37.desc: "[Select_CString(gt_admirer.IsFemale, 'Местная юная дворянка', 'Местный молодой дворянин')] по имени [gt_admirer.GetName] явно [Select_CString(gt_admirer.IsFemale, 'прониклась', 'проникся')] уважением к [Select_CString(target_leader.IsFemale, 'её', 'его')] положению и воспитанию. [Select_CString(gt_admirer.IsFemale, 'Она разыскала', 'Он разыскал')] [Select_CString(target_leader.IsFemale, 'её', 'его')], надеясь оказать [Select_CString(target_leader.IsFemale, 'ей', 'ему')] какую-либо услугу, пока [target_leader.GetName] находится в [target_location.Custom('LR_PREP')|l] [target_location.GetName]."
 grand_tour_events.37.a: "Пусть устроит [Select_CString(target_leader.IsFemale, 'её', 'его')] знакомство с нужными людьми."
 grand_tour_events.37.b: "Мы можем принять в дар от [Select_CString(gt_admirer.IsFemale, 'неё', 'него')] прекрасную одежду, подходящую для Большого путешествия."
 grand_tour_events.37.c: "Мы можем принять [Select_CString(gt_admirer.IsFemale, 'её', 'его')] приглашение остановиться в [Select_CString(gt_admirer.IsFemale, 'её', 'его')] доме."
 grand_tour_events.38.title: "Полезное знакомство"
 grand_tour_events.38.desc: "На званом ужине [target_leader.GetName] соседствует со скромным молодым человеком по имени [gt_secretary.GetName], который не склонен излишне распространяться о себе. Но случайное замечание выдаёт в нём секретаря кардинала. Он вскользь даёт понять, что может замолвить словечко, чтобы [target_cardinal.GetName] принял нашу свиту, если [target_leader.GetNameWithNoTooltip] сумеет произвести благоприятное впечатление этим вечером."
 grand_tour_events.38.a: "Попросим устроить знакомство, рискуя при этом поставить себя в неловкое положение."
 grand_tour_events.38.b: "Будем настойчиво добиваться встречи, невзирая на возможный конфуз."
 grand_tour_events.38.c: "Давайте наслаждаться вечером и оставим всё как есть."
 grand_tour_events.39.title: "Момент озарения"
 grand_tour_events.39.desc: "В разгар спора в [target_location.Custom('LR_PREP')|l] [target_location.GetName] один из доводов, который приводит [target_leader.GetName], неожиданно поражает всех глубиной мысли. Собравшиеся учёные умолкают, а затем одобрительно кивают."
 grand_tour_events.39.a: "Продолжим развивать свою мысль, рискуя стать посмешищем, если мы окажемся неправы."
 grand_tour_events.39.b: "Доведём спор до предела, не боясь стать посмешищем."
 grand_tour_events.39.c: "Сегодня мы выступили вполне достойно. Ну и хватит."
 grand_tour_events.40.title: "Демонстрация мастерства"
 grand_tour_events.40.desc: "Во время поединка в школе фехтования в [target_location.Custom('LR_PREP')|l] [target_location.GetName] [target_leader.GetName] замечает незащищённое место в защите противника, о которой не рассказывал ни один учитель. На мгновение все присутствующие замирают — они ждут, что же [Select_CString(target_leader.IsFemale, 'она', 'он')] предпримет дальше."
 grand_tour_events.40.a: "Продолжим атаку, даже если мы рискуем упасть самым нелепым образом."
 grand_tour_events.40.b: "Продолжим обмениваться выпадами, пусть даже это грозит травмой."
 grand_tour_events.40.c: "Проявим себя достойно и на этом остановимся."
 grand_tour_events.40.injury_tt: "[target_leader.GetName] неудачно падает и [Select_CString(target_leader.IsFemale, 'вынуждена', 'вынужден')] некоторое время провести в постели, залечивая ушибы и уязвлённую гордость."
 grand_tour_events.41.title: "Приступ болезни"
 grand_tour_events.41.desc: "[target_leader.GetName] заболевает сильным кишечным расстройством, которое, по предположению врачей, вызвано употреблением местной воды. Они уверяют свиту, что болезнь не смертельна, но настолько неприятна, что [Select_CString(target_leader.IsFemale, 'ей', 'ему')] пришлось провести несколько дней в постели. К тому же услуги врачей обходятся недёшево."
 grand_tour_events.41.a: "Отправим за врачом."
 grand_tour_events.41.b: "Пригласим самого искусного из врачей."
 grand_tour_events.41.c: "Пусть болезнь идёт своим чередом."
 grand_tour_events.42.title: "Тоска по дому"
 grand_tour_events.42.desc: "Пребывание вдали от дома уже не кажется таким увлекательным, как прежде, и [target_leader.GetName] всё чаще вспоминает родину, ведь там [Select_CString(target_parent.IsFemale, 'осталась', 'остался')] [Select_CString(target_leader.IsFemale, 'её', 'его')] [Select_CString(target_parent.IsFemale, 'мать', 'отец')]. [target_leader.GetName] не может сосредоточиться на текущих делах."
 grand_tour_events.42.a: "Напишем [Select_CString(target_parent.IsFemale,'ей','ему')] домой и приложим небольшой подарок."
 grand_tour_events.42.b: "Закажем портрет, чтобы отправить [Select_CString(target_parent.IsFemale,'ей','ему')]."
 grand_tour_events.42.c: "Бросим путешествие и вернёмся домой к [Select_CString(target_parent.IsFemale,'ней','нему')]."
 grand_tour_events.43.title: "Дорогая оплошность"
 grand_tour_events.43.desc: "Лишь потом выясняется, что не к месту [target_leader.GetName] [Select_CString(target_leader.IsFemale,'поздоровалась','поздоровался')] с местным магистратом на вчерашнем приёме — нарушение старшинства, очевидное всем в зале, кроме свиты. Хозяин вряд ли забудет это без какого-нибудь жеста раскаяния, хотя неловкий жест вполне может лишь ухудшить дело."
 grand_tour_events.43.a: "Преподнесём небольшой подарок в знак извинения, рискуя, что он не произведёт впечатления."
 grand_tour_events.43.b: "Извинимся грандиозно."
 grand_tour_events.43.c: "Оставим всё как есть."
 grand_tour_events.44.title: "Продажная стража"
 grand_tour_events.44.desc: "Возвращаясь затемно, [target_leader.GetName] встречает в переулке людей в ливреях городской стражи, которых кошелёк чужака волнует куда больше, чем закон, который они поклялись охранять."
 grand_tour_events.44.a: "Утром донесём на стражников магистрату."
 grand_tour_events.44.b: "Сразимся со стражниками в переулке."
 grand_tour_events.44.c: "Бросимся бежать по улице, крича о помощи."
 grand_tour_events.44.d: "Отдадим кошелёк и уйдём."
 grand_tour_events.45.title: "Попутчик"
 grand_tour_events.45.desc: "В толпе посетителей оживлённого постоялого двора [ROOT.GetCountry.GetGovernment.GetHeirTitle] заводит разговор с человеком по имени [gt_friend.GetName] — [Select_CString(gt_friend.IsFemale, 'ещё одной молодой аристократкой с родины, путешествующей', 'ещё одним молодым аристократом с родины, путешествующим')] почти тем же маршрутом по тем же причинам. Они сразу находят общий язык, делятся рассказами о родной стране и о своих путешествиях, пока дорога снова не разводит их — каждого в свой город."
 grand_tour_events.45.a: "Так начинается крепкая дружба."
 grand_tour_events.45.b: "Пожелаем удачи и продолжим путь в одиночестве."
 grand_tour_events.friendship_up_1_tt: "Дружба с персонажем [gt_friend.GetName] усиливается (#G +1#! к дружбе)"
 grand_tour_events.friendship_up_2_tt: "Дружба с персонажем [gt_friend.GetName] значительно усиливается (#G +2#! к дружбе)"
 grand_tour_events.friendship_down_1_tt: "Дружба с персонажем [gt_friend.GetName] слабеет (#R -1#! к дружбе)"
 grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], [Select_CString(gt_friend.IsFemale, 'новая подруга', 'новый друг')] [Select_CString(heir.IsFemale, 'нашей наследницы', 'нашего наследника')], [Select_CString(gt_friend.IsFemale, 'готова', 'готов')] последовать за [Select_CString(heir.IsFemale, 'ней', 'ним')] домой, к нашему двору."
 grand_tour_events.friend_reunion_intro: "Неожиданно [gt_friend.GetName] тоже [Select_CString(gt_friend.IsFemale, 'приехала', 'приехал')] в [target_location.Custom('LR_ACC')|l] [target_location.GetName]: пути двух друзей вновь пересеклись после разлуки, и разговор продолжается, будто и не прерывался."
 grand_tour_events.46.title: "Друг в беде"
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [Select_CString(gt_friend.IsFemale, 'Её', 'Его')] кошелёк, [Select_CString(gt_friend.IsFemale, 'признаётся она', 'признаётся он')], опустел из-за череды неудач за карточным столом, и [Select_CString(gt_friend.IsFemale, 'она', 'он')], явно смутившись, спрашивает, нельзя ли как-то помочь, пока долг не превратился в скандал."
 grand_tour_events.46.a: "Тихо покроем [Select_CString(gt_friend.IsFemale, 'её', 'его')] долг из собственных средств."
 grand_tour_events.46.b: "Напишем знакомым, чтобы они предоставили [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] кредит."
 grand_tour_events.46.c: "Пожелаем [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] удачи — пусть [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] ищет выход."
 grand_tour_events.47.title: "Совместное открытие"
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Обмениваясь новостями о том, чему каждый научился с момента расставания, [gt_friend.GetNameWithNoTooltip] признаётся, что [Select_CString(gt_friend.IsFemale, 'запуталась', 'запутался')] в лекции — тексте, который наши собственные занятия уже давно сделали для нас понятным, — и просит помочь разобраться."
 grand_tour_events.47.a: "Сядем и всё объясним, опираясь на то, что нам уже известно."
 grand_tour_events.47.b: "Вместо этого наймём репетитора, который поможет [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] разобраться."
 grand_tour_events.47.c: "Скажем [Select_CString(gt_friend.IsFemale, 'ей', 'ему')], что всё просто, и пусть [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] разбирается."
 grand_tour_events.48.title: "Слово в нужное ухо"
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'услышала', 'услышал')] о частном салоне в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip], где собираются приличные местные семьи, но у [Select_CString(gt_friend.IsFemale, 'неё', 'него')] нет знакомых, которые помогли бы туда попасть. [target_leader.GetName] же, благодаря знакомствам, приобретённым в ходе путешествия, находится в совсем иной ситуации."
 grand_tour_events.48.a: "Отправим весточку нашему знакомому и поручимся за [Select_CString(gt_friend.IsFemale, 'неё', 'него')]."
 grand_tour_events.48.b: "Вместо этого оплатим [Select_CString(gt_friend.IsFemale, 'её', 'его')] вход на менее важное собрание."
 grand_tour_events.48.c: "Скажем [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] [Select_CString(gt_friend.IsFemale, 'самой', 'самому')] искать способ попасть туда."
 grand_tour_events.49.title: "Угроза насилия"
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Встреча быстро принимает дурной оборот: [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'перешла дорогу', 'перешёл дорогу')] местному ростовщику, и тот теперь стоит у их стола на постоялом дворе с двумя наёмными громилами и обещает сломать не только мебель, если долг не будет погашен уже сегодня."
 grand_tour_events.49.a: "Вмешаемся сами: мы знаем, как обращаться с такими типами."
 grand_tour_events.49.b: "Просто расплатимся с кредитором и закончим на этом."
 grand_tour_events.49.c: "Оставим [Select_CString(gt_friend.IsFemale, 'её', 'его')] разбираться с последствиями в одиночку."
 grand_tour_events.50.title: "Небольшая хворь"
 grand_tour_events.50.desc: "[target_leader.GetName] узнаёт, что [gt_friend.GetName] тоже [Select_CString(gt_friend.IsFemale, 'приехала', 'приехал')] в [target_location.Custom('LR_ACC')|l] [target_location.GetName] и лежит в постели на местном постоялом дворе, подхватив в дороге простуду с лихорадкой. Трактирщик бормочет, что кошелёк [Select_CString(gt_friend.IsFemale, 'молодой девушки', 'молодого человека')] казался тощим при оплате комнаты и что [Select_CString(gt_friend.IsFemale, 'она', 'он')] уже дважды [Select_CString(gt_friend.IsFemale, 'отмахнулась', 'отмахнулся')] от местного врача, чтобы сэкономить на лечении."
 grand_tour_events.50.a: "Оплатим услуги врача вопреки [Select_CString(gt_friend.IsFemale, 'её', 'его')] возражениям."
 grand_tour_events.50.b: "Сами будем ухаживать за [Select_CString(gt_friend.IsFemale, 'ней', 'ним')], опираясь на собственный опыт путешествий."
 grand_tour_events.50.c: "Навестим [Select_CString(gt_friend.IsFemale, 'её', 'его')] и пожелаем скорейшего выздоровления."
 grand_tour_events.50.d: "Тогда лучше держаться подальше."
