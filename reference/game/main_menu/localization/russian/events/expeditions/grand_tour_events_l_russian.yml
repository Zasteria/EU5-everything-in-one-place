 grand_tour_events.28.desc.scholar: "До свиты доходит весть об учёном муже в [target_location.GetName], чья слава привлекает студентов со всего континента и которого, за должную плату и ради подходящего ученика, можно было бы уговорить на время взять к себе [target_leader.GetName]."
 grand_tour_events.28.desc.university: "До свиты доходит весть, что для [target_leader.GetName] можно устроить место среди студентов университета [target_location.GetName]: лекции, диспуты и общество учёных мужей, чьи имена будут помнить ещё долго после того, как об этом путешествии забудут."
