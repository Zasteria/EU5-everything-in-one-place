 grand_tour_events.opportunity_accept: "Примем это предложение."
 grand_tour_events.opportunity_commit: "Полностью посвятим себя этому, отложив все прочие дела."
 grand_tour_events.opportunity_decline: "Учтиво откажемся и продолжим наш путь."
