 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Ordinary shipyards line the eastern quarter, turning out merchant hulls and war galleys at the unhurried pace common to every port in [ShowContinentNameWithNoTooltip('europe')]. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.8.desc: "[target_location.GetName] has been teaching law and argument longer than any other place in Christendom, and the [target_location.GetRank.GetName] wears its learning openly: porticoes lined with students from every nation, lecture halls older than most of the churches that surround them. A visiting [ROOT.GetCountry.GetGovernment.GetHeirTitle] could spend a lifetime here and still not exhaust what the doctors of law have written.\n\nThere is also a court to be seen, should politics interest us more than jurisprudence."
 grand_tour_events.9.desc: "[target_location.GetName] rises across three ridges around a shell-shaped square, its striped Duomo visible from every street that climbs toward it. The [target_location.GetRank.GetName] built its wealth on [ShowGoodsName('wool')] and banking before [ShowLocationName('florence')] eclipsed it, and it has never quite forgiven the eclipse, a rivalry that still colors every conversation at court.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] arrives in time to see the horse race that fills the square twice a year, banners and all."
 grand_tour_events.10.desc: "[target_location.GetName] built a bell tower that could not stand straight and, rather than tear it down, simply kept building; the [target_location.GetRank.GetName] treats the tilt as a point of pride rather than an embarrassment. Once a maritime power that rivaled [ShowLocationName('genoa')] and [ShowLocationName('venice')], its galleys are gone now, but its university and its cathedral square remain.\n\nA visiting [ROOT.GetCountry.GetGovernment.GetHeirTitle] can study here as easily as walk the harbor that used to matter."
 grand_tour_events.11.desc: "[target_location.GetName] climbs a green hillside around the basilica built to hold the bones of the man born there, a friar who owned nothing and left the [target_location.GetRank.GetName] one of the great pilgrimage destinations of the west. The frescoed walls inside draw painters and pilgrims in equal number.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] may spend the visit among the frescoes or among the friars who still keep the order's rule."
 grand_tour_events.12.desc: "[target_location.GetName] sits high on its hill behind walls the Etruscans raised long before Rome ever mattered, and the [target_location.GetRank.GetName] still passes through their gates every day without a second thought. Its painters have lately made a name across [ShowRegionName('italy_region')], and its university keeps its lecture halls full.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] can study either the old walls or the new paintings, as inclination allows."
 grand_tour_events.13.desc: "[target_location.GetName] guards the river crossing where the roads from [ShowRegionName('italy_region')], the [ShowRegionName('balkan_region')], and the [ShowLanguageName('german_language')] lands all meet, and the [target_location.GetRank.GetName] has grown fat on the tolls. The ducal Hofburg dominates its center, home to a court that treats itself as something more than merely regional.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] has crossed the Alps at last; the roads from here run easier."
 grand_tour_events.14.desc: "[target_location.GetName] spreads across both banks of the Vltava, its stone bridge linking the old town to the castle hill, and the [target_location.GetRank.GetName] carries itself like the capital of an empire. The university on the hill draws students from every corner of the [ShowLanguageName('german_language')] lands and beyond.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] finds a city that measures its own importance in centuries, not seasons."
 grand_tour_events.15.desc: "[target_location.GetName] takes its very name from the monks whose settlement stood here before the dukes built a market and a mint beside it, and the [target_location.GetRank.GetName] has grown considerably since. The ducal court of the Wittelsbachs keeps the [target_location.GetRank.GetNameWithNoTooltip] more orderly than most, and the local brewers keep it well supplied.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] will find both scholars and a well-run court waiting."
 grand_tour_events.16.desc: "[target_location.GetName] straddles its river around an island crowned by the great cathedral, and the [target_location.GetRank.GetName] is larger than almost anywhere else our [ROOT.GetCountry.GetGovernment.GetHeirTitle] has yet seen on this tour. The university quarter on the left bank teaches theology and law to more students than most cities hold people.\n\nThe royal court, when it receives visitors, does so with a formality that leaves no doubt about its own opinion of itself."
 grand_tour_events.17.desc: "[target_location.GetName] sits where two rivers meet, and the [target_location.GetRank.GetName] has turned that confluence into a fortune: merchants from [ShowRegionName('italy_region')], the [ShowCultureGroupName('german_group')] lands, and Flanders all converge here for the royal fairs, when the streets fill with more [ShowGoodsName('silk')] and [ShowGoodsName('dyes')] than the warehouses can hold. The presses here print almost as fast as the looms weave.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] arrives to find a city that runs on commerce rather than ceremony."
 grand_tour_events.18.desc: "[target_location.GetName] takes its name from the roads that cross here, and the [target_location.GetRank.GetName] still serves the same purpose, straddling the river that divides the [ShowLanguageName('french_language')]-speaking lands from the [ShowLanguageName('german_language')] ones. Its cathedral spire climbs higher than anything else our [ROOT.GetCountry.GetGovernment.GetHeirTitle] has seen on the whole tour, a single tower where a matching second was never built.\n\nThe free city governs itself, and its printers have lately begun to matter as much as its merchants."
 grand_tour_events.19.desc: "[target_location.GetName] has been a port since before Rome existed, founded by [ShowCultureName('greek_culture')] sailors who saw the harbor and never left, and the [target_location.GetRank.GetName] still smells of salt and tar in every quarter. Galleys from half the Mediterranean crowd its waterfront, and the markets sell goods that never see the interior of [GetCountry('FRA').GetName].\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] finds the sea itself the [target_location.GetRank.GetNameWithNoTooltip]'s true ruler."
 grand_tour_events.20.desc: "[target_location.GetName] carries the name of the emperor who founded it, and the [target_location.GetRank.GetName] has not stopped growing since. Banking houses here move sums that make some royal treasuries look modest, and the Imperial Diet meets often enough that the [target_location.GetRank.GetNameWithNoTooltip] has grown used to hosting princes.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] arrives to find money discussed as openly as lineage."
 grand_tour_events.21.desc: "[target_location.GetName] has been building its cathedral for longer than anyone alive can remember, a half-finished tower rising over the [target_location.GetRank.GetName] with a crane still perched on top where the masons left it. The Rhine carries more trade past this [target_location.GetRank.GetNameWithNoTooltip] than almost anywhere else in the [ShowLanguageName('german_language')] lands, and its archbishop rules as much as any prince.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] finds a city that measures patience in centuries."
 grand_tour_events.22.desc: "[target_location.GetName] traces its walls back to the Roman colony that first stood here, and the [target_location.GetRank.GetName] has grown into the busiest port on this coast, its harbor thick with galleys trading [ShowGoodsName('wool')], spice, and [ShowGoodsName('dyes')] across the western Mediterranean. Its own maritime code is consulted by captains who have never set foot in the city itself.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] has nearly finished the long road home."
 grand_tour_events.23.desc: "[target_location.GetName] crowns its hill with the castle where kings are made and buried, and the [target_location.GetRank.GetName] treats both ceremonies with equal solemnity. Its university, older than most in the [ShowLanguageName('german_language')] lands, teaches astronomy and law to students drawn from across the region, and the [ShowGoodsName('amber')] and [ShowGoodsName('salt')] trade keeps its markets busy year-round.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] finds the last great stop before home."
 grand_tour_events.26.desc: "[target_location.GetName] sprawls along its river behind walls the Romans first raised, and the [target_location.GetRank.GetName] has grown well beyond them since, its bridge crowded with houses and shops of its own. The [ShowGoodsName('wool')] trade fills its warehouses, and Parliament meets often enough that the [target_location.GetRank.GetNameWithNoTooltip] has grown used to hosting the realm's business.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] finds a court every bit as ambitious as any on the continent."
 grand_tour_events.27.desc: "[target_location.GetName] sits where the Loire bends north before turning back toward the sea, and the [target_location.GetRank.GetName] has long profited from the traffic that follows the river. Its university teaches law almost as rigorously as [ShowLocationName('bologna')]'s, and its walls have held against sieges that other cities did not survive.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] finds both scholars and soldiers with stories to tell."
