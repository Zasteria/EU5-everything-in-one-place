 grand_tour_events.30.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что [target_country.GetLongName] ведёт войну, а его офицерский корпус готов принимать гостей с надлежащими рекомендациями. [target_leader.GetName] не получит настоящего командования и не понесёт ответственности за судьбу солдат, но сможет ехать рядом с бывалыми офицерами, воочию наблюдать за военной кампанией и узнать то, чего не передаст ни одна книга по стратегии."
 grand_tour_events.30.title: "Полевая возможность"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.31.desc: "Сезон кампании подходит к концу, и [target_leader.GetName] предстоит решить, чему на самом деле удалось научиться у офицеров [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.31.title: "Конец кампании"
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.32.desc: "До [target_leader.GetName] доходит весть о приглашении провести сезон при дворе [target_country.GetLongName] в качестве гостя: покои во дворце, постоянное приглашение на каждый приём и знакомство со всеми придворными и заезжими дипломатами, с кем стоит быть знакомым."
 grand_tour_events.32.desc.no_owner: "До [target_leader.GetName] доходит весть о приглашении провести сезон в качестве гостя в доме знатнейшей семьи [target_location.GetName]: знакомство со всеми, с кем стоит быть знакомым, и постоянное место за их столом."
 grand_tour_events.32.title: "Возможность завести знакомства"
 grand_tour_events.33.a: "Обдумать приобретённое и продолжить путешествие."
 grand_tour_events.33.desc: "Сезон при дворе подходит к концу, и [target_leader.GetName] предстоит решить, что на самом деле удалось приобрести от знакомств, заведённых в [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.33.title: "Сезон при дворе подходит к концу"
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.34.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] узнаёт, что в [target_location.GetName] живёт мастер фехтования с подлинной славой, готовый на сезон взять многообещающего ученика. [target_leader.GetName] не пришлось бы драться на настоящей дуэли или разрешать подлинную ссору, но можно было бы освоить работу ног, чувство времени и ту особую отвагу, которую не в силах передать ни один трактат о фехтовании."
 grand_tour_events.34.title: "Возможность заняться фехтованием"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.35.desc: "Сезон уроков подходит к концу, и [target_leader.GetName] предстоит решить, чему на самом деле удалось научиться в поединках, проведённых в [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.35.title: "Конец урокам"
 grand_tour_events.36.a: "Отметить это небольшим торжеством."
 grand_tour_events.36.b: "У нас нет времени думать о родном дворе."
 grand_tour_events.36.desc: "Письмо из [ROOT.GetCountry.GetName] наконец находит участников путешествия. В нём — тёплые слова от [ROOT.GetCountry.GetGovernment.GetRuler.GetName] о том, что при дворе хорошо отзываются о [target_leader.GetName], а также рассказ о том, как [target_leader.GetHerHim] описывает [target_leader.GetHerHis] время за границей, уже ставшее темой не одного застолья на родине."
 grand_tour_events.36.title: "Письмо из дома"
 grand_tour_events.37.a: "Представить [target_leader.GetHerHim] нужным людям."
 grand_tour_events.37.b: "Принять от [gt_admirer.GetHerHis] подарок — изысканную одежду, подобающую путешествию."
 grand_tour_events.37.c: "Принять приглашение [gt_admirer.GetHerHis] остановиться в [gt_admirer.GetHerHis] собственном доме."
 grand_tour_events.37.desc: "[gt_admirer.GetName], молодой местный дворянин, явно очарованный [target_leader.GetHerHis] положением и происхождением, разыскал [target_leader.GetHerHim], желая быть чем-нибудь полезным во время [target_leader.GetHerHis] визита в [target_location.GetName]."
 grand_tour_events.37.title: "Местный поклонник"
 grand_tour_events.38.a: "Настоять на знакомстве, рискуя произвести неловкое впечатление."
 grand_tour_events.38.b: "Настоять на своём, невзирая на неловкость."
 grand_tour_events.38.c: "Насладиться вечером и на этом остановиться."
 grand_tour_events.38.desc: "На званом ужине [target_leader.GetName] сажают рядом с [gt_secretary.GetName], скромным молодым человеком, который мало говорит о себе, пока случайное замечание не выдаёт в нём секретаря кардинала [target_cardinal.GetName]. Он намекает, что одно его слово может устроить приём у самого кардинала для [target_leader.GetNameWithNoTooltip], если сегодняшнее впечатление окажется благоприятным."
 grand_tour_events.38.title: "Полезное знакомство"
 grand_tour_events.39.a: "Развить мысль дальше, рискуя выставить себя на посмешище, если ошибиться."
 grand_tour_events.39.b: "Довести до предела, невзирая на насмешки."
 grand_tour_events.39.c: "Сегодня и так неплохо вышло. На этом и остановиться."
 grand_tour_events.39.desc: "Во время диспута в [target_location.GetName] довод, приведённый [target_leader.GetName], вдруг оказывается блестящим озарением, и собравшиеся учёные умолкают, а затем одобрительно кивают."
 grand_tour_events.39.title: "Миг озарения"
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.experience: "Пройтись по древним руинам и измерить памятники."
 grand_tour_events.4.knowledge: "Обратиться к рукописям и учёным-гуманистам Ватиканской библиотеки."
 grand_tour_events.4.party: "Оставить руины ради ночи в винных лавках [target_location.GetNameWithNoTooltip]."
 grand_tour_events.40.a: "Продолжить атаку, рискуя неудачно упасть."
 grand_tour_events.40.b: "Форсировать схватку, невзирая на риск травмы."
 grand_tour_events.40.c: "Достойно завершить и на этом остановиться."
 grand_tour_events.40.desc: "Во время поединка в фехтовальной школе [target_location.GetName] [target_leader.GetName] находит брешь, которой не учил ни один наставник, и на миг весь зал замирает, наблюдая, что [target_leader.GetSheHe] с этим сделает."
 grand_tour_events.40.injury_tt: "[target_leader.GetName] неудачно падает и слёг, зализывая раны и уязвлённую гордость"
 grand_tour_events.40.title: "Проявление мастерства"
 grand_tour_events.41.a: "Послать за лекарем."
 grand_tour_events.41.b: "Послать за лучшим лекарем, какого только можно сыскать."
 grand_tour_events.41.c: "Пусть болезнь идёт своим чередом."
 grand_tour_events.41.desc: "[target_leader.GetName] сваливает сильное расстройство желудка, вызванное, как подозревают лекари, местной водой: ничего опасного для жизни, уверяют они свиту, но достаточно неприятного, чтобы продержать [target_leader.GetHerHim] в постели несколько дней, а услуги их отнюдь не дёшевы."
 grand_tour_events.41.title: "Приступ хвори"
 grand_tour_events.42.a: "Написать письмо домой, к [target_parent.GetHerHim], и приложить небольшой подарок."
 grand_tour_events.42.b: "Заказать портрет, чтобы отправить его [target_parent.GetHerHim]."
 grand_tour_events.42.c: "Прервать путешествие и вернуться домой, к [target_parent.GetHerHim]."
 grand_tour_events.42.desc: "Новизна пребывания уже поблекла, и [target_leader.GetName] замечает, что [target_leader.GetHerHis] мысли всё чаще устремляются домой — прежде всего к [target_parent.GetName]. Это отнюдь не идёт на пользу [target_leader.GetHerHis] сосредоточенности."
 grand_tour_events.42.title: "Тоска по дому"
 grand_tour_events.43.a: "Преподнести небольшой подарок в знак извинения, рискуя, что он не произведёт впечатления."
 grand_tour_events.43.b: "Сделать пышный жест извинения."
 grand_tour_events.43.c: "Оставить дело без последствий."
 grand_tour_events.43.desc: "Лишь после случившегося выясняется, что [target_leader.GetName] приветствовал местного судью не по старшинству на вчерашнем приёме — нарушение этикета, очевидное всем в зале, кроме самой свиты. Хозяин вряд ли забудет об этом без какого-либо жеста раскаяния, хотя неуклюжая попытка может лишь усугубить дело."
 grand_tour_events.43.title: "Дорогостоящая оплошность"
 grand_tour_events.44.a: "Утром донести на стражников судье."
 grand_tour_events.44.b: "Вызвать стражников на дуэль прямо в переулке."
 grand_tour_events.44.c: "Броситься на улицу, крича о помощи."
 grand_tour_events.44.d: "Отдать кошелёк и уйти."
 grand_tour_events.44.desc: "Возвращаясь затемно, [target_leader.GetName] подвергается нападению в переулке со стороны людей в ливреях городской стражи, которых куда больше интересует кошелёк чужестранца, чем закон, который они поклялись блюсти."
 grand_tour_events.44.title: "Продажная стража"
 grand_tour_events.45.a: "Прекрасное начало для дружбы."
 grand_tour_events.45.b: "Пожелать ему удачи и держаться своей компании."
 grand_tour_events.45.desc: "Среди толпы оживлённого трактира наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] заводит разговор с [gt_friend.GetName], ещё одним молодым дворянином с родины, совершающим тот же путь по тем же причинам. Они сразу находят общий язык, обмениваясь рассказами о своей стране и путешествиях, прежде чем дорога снова разводит их — каждого в свой город."
 grand_tour_events.45.title: "Попутчик"
 grand_tour_events.46.a: "Тихо покрыть [gt_friend.GetHerHis] долг из нашего собственного кошелька."
 grand_tour_events.46.b: "Написать нашим знакомым, чтобы они предоставили [gt_friend.GetHerHim] кредит."
 grand_tour_events.46.c: "Пожелать [gt_friend.GetHerHim] удачи и позволить [gt_friend.GetHerHim] самому найти [gt_friend.GetHerHis] собственный выход из этого положения."
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis] кошелёк, признаётся [gt_friend.GetSheHe], опустел из-за неудачной полосы за карточным столом, и [gt_friend.GetSheHe] спрашивает с явным смущением, не могли бы мы как-нибудь помочь, прежде чем долг обернётся скандалом."
 grand_tour_events.46.title: "Друг в беде"
 grand_tour_events.47.a: "Сесть и объяснить, опираясь на то, что мы уже знаем."
 grand_tour_events.47.b: "Нанять учителя, чтобы тот разъяснил всё [gt_friend.GetHerHim]."
 grand_tour_events.47.c: "Сказать [gt_friend.GetHerHim], что всё просто, и оставить [gt_friend.GetHerHim] разбираться самостоятельно."
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Наверстывая упущенное за время разлуки, [gt_friend.GetNameWithNoTooltip] признаётся, что запутался в одной лекции — тексте, который нам самим уже давно ясен, — и просит помочь разобраться."
 grand_tour_events.47.title: "Общее открытие"
 grand_tour_events.48.a: "Отправить весточку нашему знакомому с просьбой поручиться за [gt_friend.GetHerHim]."
 grand_tour_events.48.b: "Вместо этого оплатить [gt_friend.GetHerHis] вход на менее изысканный приём."
 grand_tour_events.48.c: "Сказать [gt_friend.GetHerHim], чтобы искал путь [gt_friend.GetHerHis] собственными силами."
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] прослышал о частном салоне в [target_location.GetNameWithNoTooltip], где собираются лучшие семьи [target_location.GetRank.GetName], но там нет никого, кто мог бы обеспечить [gt_friend.GetHerHim] доступ. [target_leader.GetName], благодаря связям, заведённым во время путешествия, — совсем другое дело."
 grand_tour_events.48.title: "Слово в нужное ухо"
 grand_tour_events.49.a: "Вмешаться самим — мы знаем, как обращаться с такими людьми."
 grand_tour_events.49.b: "Просто расплатиться с тем, кому причитается долг, и на этом закрыть дело."
 grand_tour_events.49.c: "Оставить [gt_friend.GetHerHim] самостоятельно расхлёбывать последствия."
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Встреча быстро оборачивается скверно: [gt_friend.GetNameWithNoTooltip] перешёл дорогу местному ростовщику, и теперь этот человек стоит у их столика в трактире с двумя нанятыми головорезами, обещая сломать не только мебель, если долг не будет уплачен этой же ночью."
 grand_tour_events.49.title: "Угроза насилия"
 grand_tour_events.5.connections: "Провести последние недели при дворе [court_host.GetNameWithNoTooltip]."
 grand_tour_events.5.experience: "Присоединиться к землекопам, раскапывающим погребённый Геркуланум."
 grand_tour_events.5.knowledge: "Провести последние недели среди библиотек и развалин."
 grand_tour_events.5.party: "Обменять уроки на последнюю ночь в тавернах [target_location.GetNameWithNoTooltip]."
 grand_tour_events.50.a: "Оплатить лекаря, невзирая на возражения [gt_friend.GetHerHis]."
 grand_tour_events.50.b: "Выходить [gt_friend.GetHerHim] самим, полагаясь на собственный дорожный опыт."
 grand_tour_events.50.c: "Навестить [gt_friend.GetHerHim] и пожелать [gt_friend.GetHerHim] скорейшего выздоровления."
 grand_tour_events.50.d: "Лучше тогда не приближаться."
 grand_tour_events.50.desc: "До [target_leader.GetName] доходит весть, что [gt_friend.GetName] тоже прибыл в [target_location.GetName] и теперь лежит в постели в местном трактире, свалившись с лихорадочным ознобом, подхваченным в дороге. Трактирщик бормочет, что кошель молодого человека выглядел тощим, когда тот платил за комнату, и что он уже дважды отказывался от местного лекаря, чтобы сэкономить на плате."
 grand_tour_events.50.title: "Небольшая хворь"
 grand_tour_events.6.connections: "Нанести визит [court_host.GetNameWithNoTooltip] и знатнейшим домам [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.6.experience: "Осмотреть карьеры [ShowGoodsNameWithNoTooltip('marble')] и речную торговлю по Адидже."
 grand_tour_events.6.knowledge: "Изучить римские развалины и древнее инженерное искусство арены."
 grand_tour_events.6.party: "Пропустить амфитеатр ради ночи в тавернах внизу."
 grand_tour_events.7.connections: "Побывать на представлении при дворе [court_host.GetNameWithNoTooltip]."
 grand_tour_events.7.experience: "Осмотреть герцогский арсенал и шлюзы канала в [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.7.knowledge: "Прочесть рыцарские романы, хранящиеся в герцогской библиотеке."
 grand_tour_events.7.party: "Отложить герцогские вирши ради более весёлого вечера."
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.experience: "Осмотреть мануфактуры [ShowGoodsNameWithNoTooltip('silk')], что сделали нить [target_location.GetNameWithNoTooltip] знаменитой."
 grand_tour_events.8.historical_info: "В 1739 году французский судья Шарль де Бросс, путешествуя по Италии, провёл вечер в Болонье в доме Лауры Басси — уже тогда первой женщины в Европе, занявшей университетскую кафедру, — где местные учёные собирались обсуждать новую науку об электричестве. Позднее де Бросс вспоминал, как ему пришлось стряхнуть пыль со своей школярской латыни, чтобы спорить о магнетизме и «удивительном притяжении наэлектризованных тел» перед собравшимся обществом. Он описал этот вечер в своих #italic Lettres familières écrites d'Italie#!, и салон Басси стал одной из самых посещаемых остановок для путешественников «Гран-тура», проезжавших через город."
 grand_tour_events.8.knowledge: "Посетить лекцию по гражданскому праву в университете."
 grand_tour_events.8.party: "Пропустить лекцию ради вина в компании студентов."
 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip], город учёности"
 grand_tour_events.9.connections: "Посмотреть скачки с лоджии [court_host.GetNameWithNoTooltip]."
 grand_tour_events.9.experience: "Изучить фрески и знаменитые банковские книги [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.9.historical_info: "Осенью 1764 года романист Тобиас Смоллетт прервал свой путь из Флоренции в Рим ночлегом в Сиене и посетовал в своих опубликованных #italic «Путешествиях по Франции и Италии» #! что был «скверно расквартирован в доме, вонявшем как отхожее место», и «ужасно отужинал». Он признавал, что город был «большим и хорошо застроенным», и отмечал, что сиенцы «гордятся своей учтивостью и чистотой своего наречия» — настолько, что иностранные путешественники селились здесь исключительно ради того, чтобы выучить правильное итальянское произношение. Рассказ Смоллетта стал одной из самых известных английских жалоб на гостеприимство Тосканы времён Гранд-тура."
 grand_tour_events.9.knowledge: "Посетить лекцию по каноническому праву в университете."
 grand_tour_events.9.party: "Променять фрески на игорные столы Кампо."
 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip], город Палио"
