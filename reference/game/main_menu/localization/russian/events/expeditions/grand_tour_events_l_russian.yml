l_russian:
 grand_tour_events.1.title: "Марморина"
 grand_tour_events.1.desc: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] is assembled, the trunks are packed, and the escort is formed on the road south. [ShowRegionName('italy_region')] awaits — the land of ancient ruins, [ShowInstitutionName('renaissance')] learning, and courts whose political arts make the north look young. Whatever our [ROOT.GetCountry.GetGovernment.GetHeirTitle] learns there will shape this realm for a generation. The only question is what kind of education we mean to give [target_leader.GetHerHim]."
 grand_tour_events.1.a: "Send [target_leader.GetHerHim] to the scholars and libraries above all else."
 grand_tour_events.1.b: "The great courts of [ShowRegionNameWithNoTooltip('italy_region')] will teach [target_leader.GetHerHim] what books cannot."
 grand_tour_events.1.historical_info: "The Grand Tour, the practice of sending young European aristocrats on an extended educational journey through Italy, emerged gradually in the fifteenth and sixteenth centuries and became a formal institution among the northern European nobility by the seventeenth. Florence, Rome, Venice, and Naples formed the canonical circuit, each offering something the courts of the north lacked: humanist scholarship, classical antiquity, the art of Renaissance patronage, and the ceremony of the oldest royal courts in Europe. Participants were expected to return transformed, fit for statecraft and diplomacy in a way that domestic tutors could not achieve."
 grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip], Светлейшая республика"
 grand_tour_events.2.desc: "[target_location.GetName] is a [target_location.GetRank.GetName] that exists in deliberate defiance of geography — built on mud, floating on trade, governed by a council of merchant families that has outlasted every dynasty in [ShowContinentName('europe')]. The Arsenal that sprawls across the eastern quarter can lay a warship's keel and float it complete within a single working day. The ducal palace gleams pink above the lagoon.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] has arrived in perhaps the most cosmopolitan [target_location.GetRank.GetNameWithNoTooltip] in [ShowContinentNameWithNoTooltip('europe')], where every language of the Mediterranean is spoken in the markets and every kind of intelligence can be purchased at the right price."
 grand_tour_events.2.a: "Study naval engineering in the Arsenal."
 grand_tour_events.2.b: "Attend the reception held by [city_ruler.GetNameWithNoTooltip]."
 grand_tour_events.2.c: "Return home."
 grand_tour_events.2.historical_info: "Venice in the fifteenth century was among the most powerful states in Europe and the richest city in the western Mediterranean. The Arsenal employed up to sixteen thousand workers and pioneered assembly-line manufacturing centuries before the industrial revolution, capable of outfitting a fully armed galley in a single day when required. Venice's unique constitution, which had resisted both internal coups and external conquest for eight hundred years, was studied with fascination by political theorists across Europe who saw it as a model of stable republican government."
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.3.desc: "[target_location.GetName] is smaller than the reputation that precedes it, and stranger. The [target_location.GetRank.GetName] hums with something that does not quite have a name yet — philosophers calling it a rebirth of antiquity, merchants calling it good business, painters calling it the way the light falls on plaster. Our [ROOT.GetCountry.GetGovernment.GetHeirTitle] arrives to find that the court will receive foreign visitors this evening, if [target_leader.GetSheHe] is not too fatigued by the road from [ShowLocationName('venice')].\n\nThere is also, separately, an invitation to the monastery library where the most remarkable collection of [ShowCultureName('greek_culture')] manuscripts in western Christendom quietly waits."
 grand_tour_events.3.a: "Seek an introduction to the scholars at court."
 grand_tour_events.3.b: "Learn the art of patronage at the court of [city_ruler.GetNameWithNoTooltip]."
 grand_tour_events.3.c: "Return home."
 grand_tour_events.3.historical_info: "Florence under the Medici was the intellectual capital of fifteenth-century Europe. The ruling family maintained an informal academy of humanist scholars including Marsilio Ficino and Pico della Mirandola, who sought to reconcile classical philosophy with Christian theology. The library assembled under Cosimo de' Medici housed hundreds of Greek manuscripts rescued from Byzantium after the fall of Constantinople in 1453. Diplomatic missions, merchants, and curious foreigners all passed through the Palazzo Medici, which functioned as much as an embassy as a private residence."
 grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip], Вечный город"
 grand_tour_events.4.desc: "[target_location.GetName] exists in two times at once. The Forum lies open beneath winter grass, its columns standing at strange angles in the middle of cattle pastures, marble quarried by every contractor who needed it over the past thousand years. Above it all, the church that is to serve as the seat of all Christendom towers over the heart of the modern city.\n\n[target_leader.GetName] can spend [target_leader.GetHisHer] time among the ruins or among the living. The papal court is old, ceremonious, and connected to every [ShowReligionAdjective('catholic')] throne in [ShowContinentName('europe')]."
 grand_tour_events.4.a: "Walk the ancient ruins and measure the monuments."
 grand_tour_events.4.b: "Seek an audience with [city_ruler.GetNameWithNoTooltip]."
 grand_tour_events.4.c: "Return home."
 grand_tour_events.4.historical_info: "Rome in the fifteenth century was simultaneously a ruin and a construction site. The medieval papacy had permitted most of the ancient city to decay; the population had fallen from over a million in antiquity to fewer than twenty thousand. The Renaissance popes began an ambitious program of reconstruction, demolishing ancient monuments for building material while simultaneously funding new churches, palaces, and the rebuilding of Saint Peter's Basilica. Visitors who walked among the ancient ruins often drew or measured them, contributing to a growing body of architectural knowledge that would transform European building in the following century."
 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], Kingdom of Two Sicilies"
 grand_tour_events.5.desc: "[target_location.GetName] is the southernmost point of the tour and the most ancient of the great [ShowCultureGroupName('italian_group')] courts — a [target_location.GetRank.GetName] of a million souls sprawled beneath the shadow of Vesuvius, its history layered [ShowCultureName('greek_culture')] on [ShowCultureName('roman_culture')],  [ShowCultureName('norman')], and even more recent masters, each conquest visible in the architecture if one knows where to look. The [target_country.GetGovernment.GetAdjective] [target_country.GetGovernment.GetCourtTitle] receives visitors with a ceremony that makes the courts of northern [ShowContinentName('europe')] seem provisional by comparison.\n\nOur [ROOT.GetCountry.GetGovernment.GetHeirTitle] has seen [ShowLocationName('venice')], [ShowLocationName('florence')], and [ShowLocationName('rome')]. This is the final lesson."
 grand_tour_events.5.a: "Spend the last weeks among the libraries and ruins."
 grand_tour_events.5.b: "Spend the last weeks at the court of [city_ruler.GetNameWithNoTooltip]."
 grand_tour_events.5.historical_info: "Naples under its ruling dynasty in the fifteenth century was one of the largest and most populous cities in Europe, rivaling Paris and Constantinople. The court that Alfonso the Magnanimous established when he conquered the kingdom in 1442 attracted humanist scholars, poets, and artists from across Italy. The city's Greek foundations were visible in its oldest quarters, and classical ruins lay mixed with medieval churches throughout the surrounding countryside. Campania's landscape, including the buried cities of Pompeii and Herculaneum, had been a destination for antiquarian visitors since at least the fourteenth century."
 grand_tour_events.6.title: "A Pause in [side_city.GetNameWithNoTooltip]"
 grand_tour_events.6.desc: "The road south passes through [side_city.GetName], and the tour pauses here for a few days. The [side_city.GetRank.GetName] is smaller than [ShowLocationName('venice')] or [ShowLocationName('florence')], but it has its own particular character — its own churches, its own academies, its own web of civic politics. A visitor who looks carefully will find something worth carrying home."
 grand_tour_events.6.a: "Visit the workshops, studios, and libraries."
 grand_tour_events.6.b: "Make ourselves known to [city_ruler.GetNameWithNoTooltip]."
 grand_tour_events.6.historical_info: "The Italian peninsula in the fifteenth century was a patchwork of city-states, signorie, and small courts, each with its own civic pride and cultural identity. Cities that stood in the shadow of Florence or Venice on a European scale were nonetheless significant centers of art, learning, and political theory. Verona under the Scaligeri, Ferrara under the Este, Bologna with its ancient university, Siena with its famous banking traditions, Pisa with its scientific legacy, Assisi with its Franciscan heritage, and Perugia with its school of painting — each offered something distinctive to a visitor with time and curiosity enough to look."
 grand_tour_events.7.title: "The Long Road Home"
 grand_tour_events.7.desc: "The tour turns north at last. Rather than retrace the road that carried [target_leader.GetName] south, the party crosses the mountains by a different pass and comes down into [return_city.GetName], a great [return_city.GetRank.GetName] of the north that few of the company have ever seen. After the marble and antiquity of [ShowRegionName('italy_region')] the place feels solid and near, the last worthy stop before home. There is time to rest the horses, take stock of all that has been learned, and decide whether to announce the [ROOT.GetCountry.GetGovernment.GetHeirTitle]'s presence to the [return_city.GetRank.GetNameWithNoTooltip]'s masters."
 grand_tour_events.7.a: "Pass through quietly and press on toward home."
 grand_tour_events.7.b: "Present ourselves at the court of [city_ruler.GetNameWithNoTooltip]."
 grand_tour_events.7.historical_info: "The return leg of a Grand Tour seldom retraced the outbound journey. Travelers crossing back over the Alps descended into the German lands, the Swiss cantons, or France, and a young heir returning home would often break the journey in a major northern city, Vienna, Munich, Lyon, or Paris among them, to rest and to present himself at court. These homeward courtesies were part of the tour's diplomatic purpose: an heir who had been received graciously abroad came home with a web of acquaintance and goodwill that could shape alliances for a generation."
 grand_tour_events.1.party: "Потратить деньги на последнюю ночь веселья перед дорогой."
 grand_tour_events.10.connections: "Представиться [court_host.GetNameWithNoTooltip]."
 grand_tour_events.10.experience: "Осмотреть старый арсенал и мастерские кожевников вдоль Арно."
 grand_tour_events.10.historical_info: "В конце 1821 года Перси и Мэри Шелли обосновались в Пизе и уговорили лорда Байрона присоединиться к ним, поселив его во дворце Ланфранки на набережной Лунгарно; вместе с Эдвардом и Джейн Уильямс, а позднее Эдвардом Трелони, они образовали кружок, впоследствии известный как «Пизанский кружок». Байрон прибыл со свитой из лошадей, собак и обезьян, и всю зиму компания разрабатывала планы литературного журнала #italic «Либерал» #!. Ли Хант наконец добрался до Италии следующим летом, высадившись всего за несколько дней до того, как Шелли утонул у берегов Тосканы в июле того же года; собрание, созданное Шелли в Пизе, распалось спустя несколько месяцев, оставив город одной из самых памятных остановок эпохи романтизма."
 grand_tour_events.10.knowledge: "Посетить лекции в университете на соборной площади."
 grand_tour_events.10.party: "Покинуть лекцию ради ночи в портовых тавернах."
 grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip], город падающей башни"
 grand_tour_events.11.connections: "Встретиться с [court_host.GetNameWithNoTooltip] и городскими чиновниками."
 grand_tour_events.11.experience: "Осмотреть мастерские, изготовляющие благочестивые реликвии и значки."
 grand_tour_events.11.historical_info: "Вечером 26 октября 1786 года Иоганн Вольфганг фон Гёте прибыл в Ассизи и, по его собственным словам в #italic«Итальянском путешествии»#!, отвернулся от «огромной массы церквей, наваленных друг на друга, будто Вавилонская башня», где хранились мощи святого Франциска, отозвавшись о месте паломничества с явной неприязнью. Вместо этого он поднялся к римскому храму Минервы на площади старого города, назвав его «первым цельным памятником античности, который мне довелось увидеть». Пренебрежение Гёте к самой знаменитой святыне Ассизи в пользу языческого храма стало одним из самых неожиданных личных суждений, дошедших до нас с эпохи Grand Tour."
 grand_tour_events.11.knowledge: "Изучить фрески и житие святого."
 grand_tour_events.11.party: "Оставить компанию монахов ради более оживлённого вечера в городе."
 grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip], Город святого Франциска"
 grand_tour_events.12.connections: "Добиться представления при дворе [court_host.GetNameWithNoTooltip]."
 grand_tour_events.12.experience: "Посетить гончарные мастерские, славящиеся майоликой."
 grand_tour_events.12.historical_info: "В начале 1765 года писатель Тобайас Смоллетт возвращался из Рима во Флоренцию, когда его карета начала крутой подъём в Перуджу, а измученные лошади стали пятиться назад под тяжестью экипажа, увлекая его к краю обрыва. Прохожий вовремя подсунул под одно из колёс большой камень, остановив скольжение и спасая всю компанию от того, чтобы, по собственным словам Смоллетта, разбиться в щепки. Поскольку сменных лошадей в тот день не нашлось, Смоллетту и его семье пришлось провести ночь в городе, осматривая его церкви и полотна уроженца этих мест, Пьетро Перуджино, прежде чем снова отправиться в путь на Флоренцию."
 grand_tour_events.12.knowledge: "Учиться в университете и пройтись вдоль старых этрусских стен."
 grand_tour_events.12.party: "Пропустить старые стены ради ночи в студенческих тавернах."
 grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip], город этрусков"
 grand_tour_events.13.connections: "Представиться в Хофбурге [court_host.GetNameWithNoTooltip]."
 grand_tour_events.13.experience: "Осмотреть арсенал и пристани лодочников вдоль Дуная."
 grand_tour_events.13.historical_info: "В 1775 году врач Джон Мур посетил Вену в качестве спутника молодого герцога Гамильтона, и пара была принята на частной аудиенции императором Иосифом II, а затем самой императрицей Марией Терезией в Шёнбрунне. Мур отметил, что легендарная строгость двора рассеялась, когда государственный канцлер, князь Кауниц, заметил, что с ними путешествует и четырнадцатилетний сын самого Мура, и настоял, чтобы император с императрицей приняли и его. Мур также записал старую придворную историю о вспышке оспы, поразившей семью Габсбургов восемь лет назад: узнав, что заразилась этой болезнью, одна из дочерей императрицы немедленно потребовала зеркало и весело попрощалась с красотой, которую та собиралась погубить."
 grand_tour_events.13.knowledge: "Посетить соборные школы и городских учёных."
 grand_tour_events.13.party: "Обменять соборные школы на ночь у Дуная."
 grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip], город на Дунае"
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.14.experience: "Осмотреть стекольные мастерские и золотых дел мастеров Золотой улочки."
 grand_tour_events.14.historical_info: "Путешествуя по Богемии в 1775 году в качестве спутника молодого герцога Гамильтона, врач Джон Мур стоял со своим подопечным на пражской улице, когда проходивший мимо священник, служивший при одной из городских семинарий, услышал их речь и заявил: «Уверяю вас, я тоже ирландец». На вопрос, как он так быстро распознал их происхождение, священник ответил, что понял это, едва услышав английскую речь. Он стал их проводником до конца визита и в какой-то момент показал им окно канцелярии, из которого в 1618 году выбросили двух дворян и их секретаря — пример, который Мур с усмешкой рекомендовал государственным мужам повсюду."
 grand_tour_events.14.knowledge: "Посетить лекции в университете на холме."
 grand_tour_events.14.party: "Оставить университет ради ночи в тавернах у реки."
 grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip], золотой город"
 grand_tour_events.15.connections: "Представиться при герцогском дворе [court_host.GetNameWithNoTooltip]."
 grand_tour_events.15.experience: "Осмотреть герцогский арсенал и склады торговли [ShowGoodsNameWithNoTooltip('salt')]."
 grand_tour_events.15.historical_info: "В 1786 году писательница Эстер Линч Пиоцци проезжала через Мюнхен вместе с мужем во время их долгого свадебного путешествия по континенту, прибыв на рассвете после ночного перехода через Альпы из Инсбрука, и остановилась, чтобы осмотреть картинную галерею и кабинет редкостей курфюрста. Среди экспонатов, показанных ей местным коллекционером, было тончайшее изображение Мадонны с Младенцем, выполненное из подобия паутинной нити, столь тонкой работы, что фигуры невозможно было разглядеть невооружённым глазом — лишь под микроскопом. Пиоцци с изумлением описала эту вещицу, дивясь тому, сколько труда было положено на столь тонкое и совершенно бесполезное изделие."
 grand_tour_events.15.knowledge: "Посетить соборные школы и городских летописцев."
 grand_tour_events.15.party: "Отложить летописи ради ночи среди пивоваров."
 grand_tour_events.15.title: "[target_location.Custom('LR_GEN')] город монахов"
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.16.experience: "Посетить переплётные и печатные мастерские близ университета."
 grand_tour_events.16.historical_info: "Во время своего пребывания в Париже в октябре 1763 года писатель Тобиас Смоллетт наблюдал, как наёмная карета остановилась на дороге в Шуази и из неё высыпали пять или шесть вооружённых мужчин, каждый из которых занял позицию за отдельным деревом. Ожидая увидеть разбойников или преследующих преступника чиновников, Смоллетт спросил своего слугу, кто это такие, и узнал, что это были господа, выехавшие из города на однодневную охоту на зайцев, стрелявшие из укрытия по любой пробегавшей мимо дичи. Смоллетт нашёл всё это зрелище нелепым, сухо заметив, что по крайней мере это был эффективный способ очистить поле от зайцев."
 grand_tour_events.16.knowledge: "Посетить диспуты в университете на левом берегу."
 grand_tour_events.16.party: "Пропустить диспуты ради таверн на левом берегу."
 grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip], город на Сене"
 grand_tour_events.17.connections: "Нанести визит [court_host.GetNameWithNoTooltip] и ведущим купцам [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.17.experience: "Посетить типографии и бухгалтерские книги купцов."
 grand_tour_events.17.historical_info: "В октябре 1763 года писатель Тобиас Смоллетт, направляясь на юг в Италию, прибыл в Лион и описал этот визит в письмах, позднее опубликованных под названием #italic Путешествия по Франции и Италии#!. Его направили в гостиницу, оказавшуюся полной, и поселили в таверне, где за три убогие комнаты требовали двенадцать ливров в день, а за питание — ещё тридцать два; возмущённый таким поборами, он молча уехал и направился прямиком в конкурирующую гостиницу. Рассказ Смоллетта о лионских трактирщиках, дерущих втридорога, стал одним из самых цитируемых мест его книги и излюбленной жалобой английских путешественников на пути в Италию."
 grand_tour_events.17.knowledge: "Отыскать поэтов-гуманистов, собирающихся у печатных станков."
 grand_tour_events.17.party: "Отложить счётные книги ради ночи среди гуляк."
 grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip], город ярмарок"
 grand_tour_events.18.connections: "Встретиться с [court_host.GetNameWithNoTooltip] и городским советом."
 grand_tour_events.18.experience: "Подняться на башню собора и посетить печатные мастерские."
 grand_tour_events.18.historical_info: "В начале 1770-х годов шотландский врач Джон Мур, путешествуя по континенту в качестве спутника герцога Гамильтона, взобрался на 466-футовый шпиль Страсбургского собора и описал свой визит в книге #italic«Взгляд на общество и нравы во Франции, Швейцарии и Германии»#!. Он рассказывает, как ждал вместе с толпой прихода на службу незаконнорожденного сына Людовика XV, но когда пробило полдень, а вельможа не явился, собрание разошлось, не дождавшись его, после чего Мур услышал горячую проповедь о тирании страстей. Мур также отметил, что в соборе каждую ночь звучит большой рог — в память о заговоре, который проводники до сих пор считали причиной резни, случившейся четыре века назад."
 grand_tour_events.18.knowledge: "Побывать на лекции в гимназии Иоганна Штурма."
 grand_tour_events.18.party: "Оставить типографии и провести ночь под шпилем."
 grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip], город на перекрёстке дорог"
 grand_tour_events.19.connections: "Нанести визит [court_host.GetNameWithNoTooltip]."
 grand_tour_events.19.experience: "Посетить гавань и поговорить со средиземноморскими моряками."
 grand_tour_events.19.historical_info: "В мае 1765 года писатель Тобайас Смоллетт прибыл в Марсель во время своего возвращения через Прованс и описал этот портовый город в письмах, позднее опубликованных под названием #italic«Путешествие по Франции и Италии»#!. Прогуливаясь по набережной гавани, он наблюдал за галерными рабами, которых Корона отдавала в наем для работы в небольших арендованных лавках: прикованные одной ногой, они, по его словам, жили неплохо и выглядели весёлыми, как сапожники, серебряники и книготорговцы. Смоллетт назвал Марсель благородным и процветающим городом, хотя и посетовал, что местные трактирщики брали с него по четыре ливра с человека за каждую трапезу."
 grand_tour_events.19.knowledge: "Изучить надписи, напоминающие о [ShowCultureNameWithNoTooltip('greek_culture')] основателях [target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.19.party: "Обменять сплетни на ночь в портовых трактирах."
 grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip], врата Средиземноморья"
 grand_tour_events.2.connections: "Побывать на приёме, устроенном [court_host.GetNameWithNoTooltip]."
 grand_tour_events.2.desc.ducal_palace: "Тем временем роскошный дворец дожа розовеет над лагуной, являя всем напоказ утончённость и великолепие."
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName] — это [target_location.GetRank.GetName], что существует наперекор самой географии, стоит на иле, держится на торговле и управляется советом купеческих семей, переживших все династии [ShowContinentName('europe')]."
 grand_tour_events.2.desc.heir_arrival: "Наш наследник [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибыл в, пожалуй, самый космополитичный [target_location.GetRank.GetNameWithNoTooltip] [ShowContinentNameWithNoTooltip('europe')], где на рынках звучат все языки Средиземноморья, а любые сведения можно купить за подходящую цену."
 grand_tour_events.2.experience: "Осмотреть верфи, где строят военные галеры [target_location.GetNameWithNoTooltip]."
 grand_tour_events.2.knowledge: "Изучить военно-морское дело в [ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]."
 grand_tour_events.2.party: "Оставить счётные книги и провести ночь среди гуляк на каналах."
 grand_tour_events.20.connections: "Посетить прием, устроенный [court_host.GetNameWithNoTooltip]."
 grand_tour_events.20.experience: "Изучить бухгалтерские книги крупных банковских домов."
 grand_tour_events.20.historical_info: "Утром 15 июля 1772 года английский историк музыки Чарльз Бёрни прибыл в Аугсбург после ночного путешествия и сразу направился в собор, где услышал немецкую проповедь и мессу, исполненную двумя хорами по случаю праздника. Певцы привели его в восхищение, но гармонии органиста показались ему настолько грубыми и вычурными, что исполнение скорее терзало слух, чем радовало его, а резкий всплеск барабанов и труб при вознесении Святых Даров и вовсе поразил его — обычай, который он больше нигде не встречал, кроме Антверпена. Узнав, что кантор, которому он вёз письма, отсутствует в городе, Бёрни, собиравший материал для своей истории музыки, не стал задерживаться."
 grand_tour_events.20.knowledge: "Изучить городские древности и гуманистические рукописи."
 grand_tour_events.20.party: "Отложить гроссбухи ради игральных столов."
 grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip], город Августа"
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.21.experience: "Осмотреть литейни, отливающие колокола для церквей Рейнской области."
 grand_tour_events.21.historical_info: "В сентябре 1794 года писательница Анна Радклиф прибыла в Кёльн, путешествуя по Рейнской области вместе с мужем — эта поездка описана в её изданном путевом дневнике #italic Путешествие, совершённое летом 1794 года#!. Она застала город переполненным беженцами, спасавшимися от французских армий, наступавших на Льеж и Маастрихт: улицы были заполнены госпитальными повозками с ранеными и умирающими. Все гостиницы были забиты; попутчикам приходилось ночевать в каретах, на бильярдных столах и шезлонгах за неимением комнат. Позднее Радклиф писала, что эта картина научила её истинной цене войны больше, чем любое сражение, о котором она читала."
 grand_tour_events.21.knowledge: "Посетить соборную стройку и учёных университета."
 grand_tour_events.21.party: "Пропустить соборную стройку ради ночи на берегу Рейна."
 grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip], город собора"
 grand_tour_events.22.connections: "Явиться ко двору [court_host.GetNameWithNoTooltip]."
 grand_tour_events.22.experience: "Изучить морской кодекс, хранящийся в купеческой бирже."
 grand_tour_events.22.historical_info: "В конце октября 1775 года английский антиквар Генри Суинберн прибыл в Барселону как раз перед тем, как городские ворота закрылись на ночь — этот эпизод он описал в своих #italic Путешествиях по Испании в 1775 и 1776 годах#!. Засвидетельствовав почтение губернатору, он посетил театр, поначалу ворча, что «Скука воцарилась на этой сцене», но спустя несколько дней был покорён живым представлением #italic «Сида Кампеадора»#!, сыгранным в старинных испанских костюмах. Он также осмотрел цитадель, отметив, что её низкая, сырая, кишащая москитами местность была выбрана не ради здоровья, а чтобы держать город внизу в страхе."
 grand_tour_events.22.knowledge: "Посетить лекцию о законах каталонских #italic Кортесов#!."
 grand_tour_events.22.party: "Променять морской кодекс на портовые таверны."
 grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip], город Барцино"
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.23.experience: "Осмотреть Суконные ряды, где торгуют купцы."
 grand_tour_events.23.historical_info: "25 июля 1778 года Уильям Кокс, странствующий наставник юного лорда Герберта в его продолжительном большом путешествии по северной и восточной Европе, переправился через Вислу в Краков и застал старую польскую столицу израненной пушечными и картечными обстрелами недавних осад, а её величественные дома — в развалинах. Он осмотрел университет, основанный Казимиром Великим, где библиотекарь показал ему турецкую книгу, не представлявшую большой ценности саму по себе, но почитаемую как диковину: захваченная среди трофеев в битве при Хотине, она была подарена университету самим королём Яном Собеским в память о победе, спасшей Польшу и принёсшей ему её трон."
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.23.party: "Покинуть лекционный зал ради вечера у замка."
 grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip], город королей"
 grand_tour_events.24.a: "Сделать крюк до [ShowLocationNameWithNoTooltip('verona')]."
 grand_tour_events.24.b: "Направиться вместо этого в [ShowLocationNameWithNoTooltip('ferrara')]."
 grand_tour_events.24.c: "Свернуть в [ShowLocationNameWithNoTooltip('bologna')]."
 grand_tour_events.24.d: "Продолжить путь до [ShowLocationNameWithNoTooltip('florence')]."
 grand_tour_events.24.desc: "Из [target_location.GetName] открывается несколько путей. [target_leader.GetName] предстоит решить, куда продолжится путешествие: вглубь [ShowRegionName('italy_region')] или домой."
 grand_tour_events.24.e: "Прервать путешествие в [ShowLocationNameWithNoTooltip('siena')]."
 grand_tour_events.24.f: "Сначала заглянуть в [ShowLocationNameWithNoTooltip('pisa')]."
 grand_tour_events.24.g: "Повернуть к [ShowLocationNameWithNoTooltip('assisi')]."
 grand_tour_events.24.h: "Направиться вместо этого в [ShowLocationNameWithNoTooltip('perugia')]."
 grand_tour_events.24.i: "Продолжить путь до [ShowLocationNameWithNoTooltip('rome')]."
 grand_tour_events.24.j: "Продолжить путь до [ShowLocationNameWithNoTooltip('naples')]."
 grand_tour_events.24.k: "Турне окончено. Пора вернуться домой."
 grand_tour_events.24.title: "Куда дальше?"
 grand_tour_events.25.a: "Прервать путешествие в [ShowLocationNameWithNoTooltip('vienna')]."
 grand_tour_events.25.b: "Дать отдых лошадям в [ShowLocationNameWithNoTooltip('prague')]."
 grand_tour_events.25.c: "Повернуть домой через [ShowLocationNameWithNoTooltip('munich')]."
 grand_tour_events.25.d: "Остановиться в [ShowLocationNameWithNoTooltip('paris')] перед последним отрезком пути."
 grand_tour_events.25.desc: "Турне наконец поворачивает домой. Вместо того чтобы вновь проделать весь путь на юг, [target_leader.GetName] должен выбрать, где прервать путешествие перед последним отрезком пути: остановку, чтобы дать отдых лошадям и, быть может, быть принятым при ещё одном дворе перед возвращением."
 grand_tour_events.25.desc.second: "Одной остановки мало, чтобы назвать это возвращением домой. Прежде чем дорога окончательно приведёт обратно в [ROOT.GetCountry.GetCapital.GetName], [target_leader.GetName] выбирает ещё один город, чтобы прервать путешествие: последний двор, последнюю диковинку, прежде чем турне действительно завершится."
 grand_tour_events.25.e: "Проехать через [ShowLocationNameWithNoTooltip('lyon')] по пути домой."
 grand_tour_events.25.f: "Переправиться в [ShowLocationNameWithNoTooltip('london')], прежде чем повернуть вглубь материка."
 grand_tour_events.25.g: "Сначала заехать в [ShowLocationNameWithNoTooltip('strasbourg')]."
 grand_tour_events.25.h: "Проложить путь через [ShowLocationNameWithNoTooltip('marseille')]."
 grand_tour_events.25.i: "Направиться в [ShowLocationNameWithNoTooltip('augsburg')] перед последним переходом."
 grand_tour_events.25.k: "Немного отдохнуть в [ShowLocationNameWithNoTooltip('cologne')]."
 grand_tour_events.25.l: "Отправиться домой морем через [ShowLocationNameWithNoTooltip('barcelona')]."
 grand_tour_events.25.n: "Прервать путешествие в [ShowLocationNameWithNoTooltip('orleans')]."
 grand_tour_events.25.o: "Проехать через [ShowLocationNameWithNoTooltip('krakow')] перед последним отрезком пути домой."
 grand_tour_events.25.p: "Довольно проволочек. Направиться прямо домой."
 grand_tour_events.25.title: "Дорога домой"
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.experience: "Посетить торговцев [ShowGoodsNameWithNoTooltip('wool')] и городские гильдейские палаты."
 grand_tour_events.26.historical_info: "В 1765 году французский судья и литератор Пьер-Жан Гроле провёл почти год в Лондоне, собирая материал для книги, впоследствии переведённой как #italic«Путешествие в Лондон»#!. Среди прочих наблюдений он описал министра, который провёл двадцать четыре часа кряду за карточным столом, питаясь всё это время лишь холодной говядиной, зажатой между двумя ломтями поджаренного хлеба. «Это новое блюдо, — писал Гроле, — стало весьма модным во время моего пребывания в Лондоне», получив впоследствии имя своего изобретателя. Этот анекдот, приукрашенный или нет, стал самой цитируемой строкой его «Путешествия»."
 grand_tour_events.26.knowledge: "Посетить чтение о общем праве в судебных иннах."
 grand_tour_events.26.party: "Оставить гильдейские дела ради ночи в тавернах [target_location.GetNameWithNoTooltip]."
 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip], город на Темзе"
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.experience: "Осмотреть винные погреба и гильдию лодочников Луары."
 grand_tour_events.27.historical_info: "В апреле 1644 года молодой мемуарист Джон Ивлин прервал своё путешествие вниз по Луаре в Орлеане — это стало одним из первых задокументированных Гранд-туров. Он посетил древний университет, студенты которого по-прежнему делились на четыре исторические «нации» — французскую, нормандскую, пикардийскую и верхнегерманскую, — каждая со своими должностными лицами, и пользовался двумя городскими публичными библиотеками, отмечая, что учёный муж мог взять книгу к себе на квартиру, лишь оставив расписку, — щедрость, показавшуюся ему примечательной. Он также видел коллегиальную церковь Святого Креста, некогда величественную, но всё ещё носившую видимые следы недавних гражданских войн."
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.party: "Пропускать лекции по праву ради таверн у реки."
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], город на Луаре"
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
