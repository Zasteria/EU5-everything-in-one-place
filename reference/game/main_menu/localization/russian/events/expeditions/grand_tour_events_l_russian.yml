 grand_tour_events.1.title: "Марморина"
 grand_tour_events.1.desc: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] is assembled, the trunks are packed, and the escort is formed on the road south. [ShowRegionName('italy_region')] awaits: the land of ancient ruins, [ShowInstitutionName('renaissance')] learning, and courts whose political arts make the north look young. Whatever our [ROOT.GetCountry.GetGovernment.GetHeirTitle] learns there will shape this realm for a generation. The only question is what kind of education we mean to give [target_leader.GetHerHim]."
 grand_tour_events.1.a: "Its courts will teach [target_leader.GetHerHim] what books cannot."
 grand_tour_events.1.party: "Spend the coin on one last night of revelry before the road."
 grand_tour_events.2.desc.geography_intro: "[target_location.GetName] is a [target_location.GetRank.GetName] that exists in deliberate defiance of geography, built on mud, floating on trade, governed by a council of merchant families that has outlasted every dynasty in [ShowContinentName('europe')]."
 grand_tour_events.2.desc.ducal_palace: "While the opulent ducal palace gleams pink above the lagoon in a show of refinement and luxury for all to see."
 grand_tour_events.2.desc.heir_arrival: "Our [ROOT.GetCountry.GetGovernment.GetHeirTitle] has arrived in perhaps the most cosmopolitan [target_location.GetRank.GetNameWithNoTooltip] in [ShowContinentNameWithNoTooltip('europe')], where every language of the Mediterranean is spoken in the markets and every kind of intelligence can be purchased at the right price."
 grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip], Светлейшая республика"
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ [ShowBuildingTypeName('venetian_arsenal')], раскинувшийся по всему восточному кварталу, способен заложить киль военного корабля и спустить его на воду готовым за один рабочий день. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Обычные верфи тянутся вдоль восточного квартала, выпуская торговые корпуса и военные галеры в том неспешном темпе, что свойствен всякому порту в [ShowContinentNameWithNoTooltip('europe')]. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.knowledge: "Study naval engineering in the [ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]."
 grand_tour_events.2.experience: "Tour the shipyards where [target_location.GetNameWithNoTooltip]'s war galleys are built."
 grand_tour_events.2.connections: "Attend the reception held by [court_host.GetNameWithNoTooltip]."
 grand_tour_events.2.party: "Trade the ledgers for a night among the canal revelers."
 grand_tour_events.2.historical_info: "During Ascension Week in 1645, the English gentleman John Evelyn, then on his own extended tour of France and Italy, attended a performance of the opera #italic Ercole in Lidia#! in one of Venice's public theaters. His diary marvels at scenery that shifted thirteen times and singles out the soprano Anna Renzi, though he judged a castrato singer even her superior, and pronounced a Genoese bass 'incomparable.' Between the painted perspectives and flying machines, the spectacle 'held us by the eyes and ears till two in the morning.' He left Venice the following spring, his trunks packed with books, prints, and jars of the city's famous theriac."
 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.3.desc: "[target_location.GetName] меньше своей репутации и куда причудливее. [target_location.GetRank.GetName] полнится новыми идеями: философы называют его возрождением античности, купцы — выгодным делом, художники — игрой света на штукатурке. Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает и узнаёт, что этим вечером двор примет иноземных гостей, если [target_leader.GetSheHe] не слишком утомлён дорогой.\n\nОтдельно приходит и приглашение в монастырскую библиотеку, где тихо хранится самое замечательное собрание [ShowCultureName('greek_culture')] рукописей во всём западном христианском мире."
 grand_tour_events.3.knowledge: "Seek an introduction to the scholars at the monastery."
 grand_tour_events.3.experience: "Tour the [ShowGoodsNameWithNoTooltip('wool')] workshops and the Ponte Vecchio goldsmiths."
 grand_tour_events.3.connections: "Learn the art of patronage at the court of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.3.party: "Set the manuscripts aside for gaming at [target_location.GetNameWithNoTooltip]'s tables."
 grand_tour_events.3.historical_info: "In the autumn of 1764, the ailing Scottish novelist Tobias Smollett toured the Uffizi and, standing before the Venus de' Medici that every other Grand Tourist praised on faith, wrote, 'I cannot help thinking that there is no beauty in the features of Venus, and that the attitude is aukward and out of character.' Laurence Sterne later immortalized the outburst, having his fictional Yorick confront 'Smelfungus' over it before the Pantheon in Rome, complaining he had 'fallen foul upon the goddess, and used her worse than a common strumpet, without the least provocation in nature.' Their quarrel over one marble Venus outlived them both."
 grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip], Вечный город"
 grand_tour_events.4.desc: "[target_location.GetName] существует одновременно в двух временах. Форум лежит открытым под зимней травой, его колонны стоят под странными углами посреди пастбищ для скота, а мрамор растащен на нужды всякого подрядчика за минувшую тысячу лет. Над всем этим возвышается храм, которому суждено стать престолом всего христианского мира, — он господствует над сердцем нынешнего [target_location.GetRank.GetName].\n\n[target_leader.GetName] может провести [target_leader.GetHisHer] время как среди руин, так и среди живых. Папский двор стар, церемонен и связан с каждым [ShowReligionAdjective('catholic')] престолом в [ShowContinentName('europe')]."
 grand_tour_events.4.knowledge: "Consult the Vatican Library's manuscripts and humanists."
 grand_tour_events.4.experience: "Walk the ancient ruins and measure the monuments."
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.party: "Leave the ruins for a night in [target_location.GetNameWithNoTooltip]'s wine shops."
 grand_tour_events.4.historical_info: "On 15 October 1764, the English gentleman Edward Gibbon, then completing his own Grand Tour of Italy, sat musing amid the ruins on the Capitoline Hill while barefoot friars sang vespers in what he took for the old Temple of Jupiter. He later wrote in his memoirs that it was there, amid broken columns and the fading evening chant, that 'the idea of writing the decline and fall of the city first started to my mind.' The notion he carried away from that single Roman evening grew, across the next twenty years of study back in England, into #italic The History of the Decline and Fall of the Roman Empire#!."
 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.5.desc: "[target_location.GetName] — самая южная точка путешествия и древнейший из великих дворов [ShowCultureGroupName('italian_group')], [target_location.GetRank.GetName], где обитает миллион душ, раскинувшийся в тени Везувия; его история слоится одна на другую — [ShowCultureName('greek_culture')], [ShowCultureName('roman_culture')], [ShowCultureName('norman')] и даже более поздние властители, и каждое завоевание видно в архитектуре, если знать, куда смотреть. [target_country.GetGovernment.GetAdjective] [target_country.GetGovernment.GetCourtTitle] принимает гостей с церемониалом, рядом с которым дворы северной [ShowContinentName('europe')] кажутся чем-то временным.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] уже повидал [ShowLocationName('venice')], [ShowLocationName('florence')] и [ShowLocationName('rome')]. Это последний урок."
 grand_tour_events.5.knowledge: "Spend the last weeks among the libraries and ruins."
 grand_tour_events.5.experience: "Join the diggers uncovering buried Herculaneum."
 grand_tour_events.5.connections: "Spend the last weeks at the court of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.5.party: "Trade the lessons for a final night in [target_location.GetNameWithNoTooltip]'s taverns."
 grand_tour_events.5.historical_info: "In January 1786, Hester Piozzi climbed Vesuvius roped to her guide Bartolomeo, 'the Cyclop of Vesuvius,' and stopped to rest at the hermit's cell partway up. The hermit, a Frenchman, suddenly recognized her: 'Did I never see you before, Madam? Yes, sure I have, and dressed you too, when I was a hair-dresser in London.' Shamed into continuing when she learned a four-year-old boy in her party had already reached the crater's edge, Piozzi pressed on to see the smoking chimney for herself, and recorded the whole encounter in her published travel letters."
 grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip] — Город древней Арены"
 grand_tour_events.6.desc: "[target_location.GetName] поднимается там, где изгибается река, и его [target_location.GetRank.GetName] застроен в длинной тени амфитеатра, что старше любого двора в [ShowRegionName('italy_region')]. Римская арена стоит почти целиком, каменные ярусы её поднимаются над крышами домов, принимая рынки, ярмарки, а в редкий праздничный день — нечто похожее на те самые игры, ради которых она была построена.\n\nЗдесь есть не только руины, но и учебные залы, а двор с готовностью примет заезжего [ROOT.GetCountry.GetGovernment.GetHeirTitle]."
 grand_tour_events.6.knowledge: "Study the Roman ruins and the arena's ancient engineering."
 grand_tour_events.6.experience: "Tour the [ShowGoodsNameWithNoTooltip('marble')] quarries and river trade along the Adige."
 grand_tour_events.6.connections: "Call upon [court_host.GetNameWithNoTooltip] and the [target_location.GetRank.GetNameWithNoTooltip]'s leading houses."
 grand_tour_events.6.party: "Skip the amphitheater for a night in the taverns below."
 grand_tour_events.6.historical_info: "Arriving in Verona in April 1785, Hester Piozzi felt her heart 'sensibly dilate' at finding the Roman amphitheater so well preserved, and later called the city 'the gayest looking town I ever lived in.' A guide showing her the Philharmonic Academy's antiquities assured her that England's own Arundel marbles had long since been ruined by coal smoke, until she recognized the line, word for word, from the guidebook #italic Verona illustrata#! he had memorized. She recorded the deception as 'malafede, and a very ridiculous prejudice' in her published account of the tour."
 grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip] — Идеальный город"
 grand_tour_events.7.desc: "[target_location.GetName] не выглядит случайностью, потому что таковой не является. Широкие прямые проспекты рассекают [target_location.GetRank.GetName] по узору, до которого ни один средневековый город не дорос бы сам по себе, — он спланирован намеренно, чтобы им любовались не меньше, чем в нём жили. Герцогский театр, типографии и поэты, что не покидают двор, служат одной и той же цели: заставить этот небольшой [target_location.GetRank.GetNameWithNoTooltip] выглядеть будущим градостроительства.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит здесь двор, интересующийся стихами не меньше, чем государственными делами."
 grand_tour_events.7.knowledge: "Read the chivalric romances kept in the ducal library."
 grand_tour_events.7.experience: "Tour the ducal armory and the [target_location.GetRank.GetNameWithNoTooltip]'s canal locks."
 grand_tour_events.7.connections: "Attend a performance at the court of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.7.party: "Set the ducal verses aside for a livelier night out."
 grand_tour_events.7.historical_info: "In April 1817, Lord Byron, then touring Italy, visited the Hospital of Sant'Anna in Ferrara and was shown the cramped cell where the poet Torquato Tasso was said to have been confined for madness by Duke Alfonso II d'Este in the 1580s. Byron found the relic more affecting than Ariosto's own monument nearby, and the next day he composed 'The Lament of Tasso,' a dramatic monologue voicing the poet's despair. The visit became one of the most famous Grand Tour pilgrimages of the Romantic era, fixing Ferrara's fallen Estense court in the traveler's imagination."
 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip] — Учёный город"
 grand_tour_events.8.desc: "[target_location.GetName] обучает праву и красноречию дольше, чем любое иное место христианского мира, и [target_location.GetRank.GetName] открыто носит свою учёность: портики полны студентов из всех земель, а лекционные залы старше большинства окружающих их церквей. Заезжий [ROOT.GetCountry.GetGovernment.GetHeirTitle] мог бы провести здесь всю жизнь и всё равно не исчерпать написанного законоведами.\n\nЕсть здесь и двор, который стоит увидеть, если политика интересует нас больше правоведения."
 grand_tour_events.8.knowledge: "Attend a lecture on civil law at the university."
 grand_tour_events.8.experience: "Tour the [ShowGoodsNameWithNoTooltip('silk')] mills that made [target_location.GetNameWithNoTooltip]'s thread famous."
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.party: "Skip the lecture hall for wine among the students."
 grand_tour_events.8.historical_info: "In 1739, Charles de Brosses, a French magistrate touring Italy, spent an evening in Bologna at the home of Laura Bassi, already the first woman in Europe to hold a university chair, where local scholars gathered to debate the new science of electricity. De Brosses later recalled having to dust off his rusty schoolboy Latin to argue about magnetism and 'the singular attraction of electrified bodies' before the assembled company. He recorded the evening in his #italic Lettres familières écrites d'Italie#!, and Bassi's salon became one of the most-visited stops for Grand Tourists passing through the city."
 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip] — Город Палио"
 grand_tour_events.9.desc: "[target_location.GetName] поднимается на трёх холмах вокруг площади в форме раковины, и его полосатый собор виден с любой улицы, что взбирается к нему. [target_location.GetRank.GetName] построил своё богатство на [ShowGoodsName('wool')] и банковском деле, прежде чем его затмил [ShowLocationName('florence')], и он так и не простил этого затмения — соперничество и поныне окрашивает каждый разговор при дворе.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает как раз вовремя, чтобы увидеть конные скачки, что дважды в год заполняют площадь знамёнами и всем прочим."
 grand_tour_events.9.knowledge: "Attend a lecture on canon law at the university."
 grand_tour_events.9.experience: "Study the frescoes and the [target_location.GetRank.GetNameWithNoTooltip]'s famous banking ledgers."
 grand_tour_events.9.connections: "Watch the race from the loggia of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.9.party: "Trade the frescoes for the gaming tables of the Campo."
 grand_tour_events.9.historical_info: "In the autumn of 1764, the novelist Tobias Smollett broke his journey from Florence to Rome with a night in Siena, and grumbled in his published #italic Travels through France and Italy#! that he was 'indifferently lodged in a house that stunk like a privy' and 'fared wretchedly at supper.' He allowed that the city was 'large and well built,' and noted that the Sienese 'pique themselves upon their politeness, and the purity of their dialect,' so much so that foreign visitors lodged there purely to learn correct Italian pronunciation. Smollett's account became one of the best-known English complaints about Grand Tour hospitality in Tuscany."
 grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip] — Город Падающей башни"
 grand_tour_events.10.desc: "[target_location.GetName] построил колокольню, которая никак не желала стоять прямо, и вместо того чтобы снести её, здесь попросту продолжили строительство; [target_location.GetRank.GetName] воспринимает этот наклон как предмет гордости, а не позора. Некогда морская держава, соперничавшая с [ShowLocationName('genoa')] и [ShowLocationName('venice')], свои галеры она давно утратила, но университет и соборная площадь остались.\n\nПосещающий город [ROOT.GetCountry.GetGovernment.GetHeirTitle] может с равным успехом изучать науки здесь или пройтись по гавани, которая когда-то имела значение."
 grand_tour_events.10.knowledge: "Attend lectures at the university on the cathedral square."
 grand_tour_events.10.experience: "Visit the old arsenal and leatherworkers along the Arno."
 grand_tour_events.10.connections: "Present ourselves to [court_host.GetNameWithNoTooltip]."
 grand_tour_events.10.party: "Leave the lecture for a night among the harbor taverns."
 grand_tour_events.10.historical_info: "In late 1821, Percy and Mary Shelley settled in Pisa and persuaded Lord Byron to join them, installing him in the Palazzo Lanfranchi on the Lungarno; together with Edward and Jane Williams, and later Edward Trelawny, they formed the circle later known as the 'Pisan Circle.' Byron arrived with a retinue of horses, dogs, and monkeys, and the group spent the winter drafting plans for a literary magazine, #italic The Liberal#!. Leigh Hunt finally reached Italy the following summer, landing just days before Shelley drowned off the Tuscan coast that July; the gathering Shelley had built in Pisa dispersed within months, leaving the city one of Romanticism's most storied way-stations."
 grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip] — Город Святого Франциска"
 grand_tour_events.11.desc: "[target_location.GetName] поднимается по зелёному склону холма вокруг базилики, построенной, чтобы хранить кости человека, рождённого здесь, — монаха, не владевшего ничем и оставившего [target_location.GetRank.GetName] одним из величайших мест паломничества на западе. Расписанные фресками стены внутри привлекают художников и паломников в равной мере.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] может провести время визита среди фресок или среди монахов, всё ещё соблюдающих устав ордена."
 grand_tour_events.11.knowledge: "Study the frescoes and the life of the saint."
 grand_tour_events.11.experience: "Tour the workshops making devotional relics and badges."
 grand_tour_events.11.connections: "Meet with [court_host.GetNameWithNoTooltip] and the town's officials."
 grand_tour_events.11.party: "Set the friars' company aside for a livelier night in town."
 grand_tour_events.11.historical_info: "On the evening of 26 October 1786, Johann Wolfgang von Goethe reached Assisi and, by his own account in #italic Italian Journey#!, turned away from the 'vast mass of churches piled Babel-wise one over another' that held the remains of Saint Francis, dismissing the pilgrimage site with open aversion. He climbed instead to the Roman Temple of Minerva on the old town's piazza, calling it 'the first complete memorial of antiquity that I had ever seen.' Goethe's snub of Assisi's most famous shrine in favor of a pagan temple became one of the more startling personal verdicts to survive from the Grand Tour era."
 grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip] — Этрусский город"
 grand_tour_events.12.desc: "[target_location.GetName] высится на своём холме за стенами, возведёнными этрусками задолго до того, как Рим обрёл значение, и [target_location.GetRank.GetName] по-прежнему ежедневно проходит сквозь их ворота, не задумываясь об этом. Его художники в последнее время снискали известность по всей [ShowRegionName('italy_region')], а университет держит лекционные залы полными.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] может изучать либо древние стены, либо новые картины — как подскажет собственная склонность."
 grand_tour_events.12.knowledge: "Study at the university and walk the old Etruscan walls."
 grand_tour_events.12.experience: "Visit the potters' workshops famous for majolica."
 grand_tour_events.12.connections: "Seek an introduction at the court of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.12.party: "Skip the old walls for a night among the students' taverns."
 grand_tour_events.12.historical_info: "In early 1765, the novelist Tobias Smollett was traveling from Rome back toward Florence when his carriage began the steep climb into Perugia and his exhausted horses started sliding backward with the coach's weight, dragging it toward the edge of a precipice. A passer-by wedged a large stone behind one wheel just in time to stop the slide, saving the whole party from being, in Smollett's own words, dashed in pieces. With no relay horses available that day, Smollett and his family were forced to spend the night in the city, touring its churches and the paintings of its native son, Pietro Perugino, before resuming the road to Florence."
 grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip] — Город на Дунае"
 grand_tour_events.13.desc: "[target_location.GetName] стережёт речную переправу, где сходятся дороги из [ShowRegionName('italy_region')], [ShowRegionName('balkan_region')] и земель, говорящих на [ShowLanguageName('german_language')], и [target_location.GetRank.GetName] изрядно разбогател на пошлинах. Герцогский Хофбург господствует в его центре — обитель двора, считающего себя чем-то большим, чем просто региональной властью.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] наконец пересёк Альпы; отсюда дороги пойдут легче."
 grand_tour_events.13.knowledge: "Visit the cathedral schools and the city's scholars."
 grand_tour_events.13.experience: "Tour the arsenal and the boatmen's wharves along the Danube."
 grand_tour_events.13.connections: "Present ourselves at the Hofburg to [court_host.GetNameWithNoTooltip]."
 grand_tour_events.13.party: "Trade the cathedral schools for a night along the Danube."
 grand_tour_events.13.historical_info: "In 1775, the physician John Moore toured Vienna as traveling companion to the young Duke of Hamilton, and the pair were received in a private audience by Emperor Joseph II, then by Empress Maria Theresa herself at Schönbrunn. Moore noted that the court's fabled rigidity dissolved once the state chancellor, Prince Kaunitz, noticed Moore's own fourteen-year-old son traveling with their party and insisted the Emperor and Empress receive him too. Moore also recorded an old court story about the smallpox outbreak that had struck the Habsburg family eight years before: on learning she had contracted the disease, one of the Empress's daughters had immediately called for a looking glass and cheerfully bid farewell to the beauty it was about to ruin."
 grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip] — Золотой город"
 grand_tour_events.14.desc: "[target_location.GetName] раскинулся по обоим берегам Влтавы, каменный мост соединяет старый город с замковым холмом, и [target_location.GetRank.GetName] держится так, будто он столица империи. Университет на холме привлекает студентов из всех уголков земель, говорящих на [ShowLanguageName('german_language')], и не только.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] застаёт город, что меряет собственную значимость веками, а не временами года."
 grand_tour_events.14.knowledge: "Attend lectures at the university on the hill."
 grand_tour_events.14.experience: "Tour the glassworks and the goldsmiths of the Golden Lane."
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.14.party: "Leave the university for a night among the river taverns."
 grand_tour_events.14.historical_info: "Touring Bohemia in 1775 as companion to the young Duke of Hamilton, the physician John Moore was standing with his charge in a Prague street when a passing priest, attached to one of the city's seminaries, overheard them speaking and declared, 'I do assure you now, I am an Irishman too.' Asked how he had recognized their nationality so readily, the priest replied that he knew it the moment he heard them speak English. He became their guide for the rest of the visit, at one point showing them the chancellery window from which two noblemen and their secretary had been thrown in 1618, a precedent Moore wryly commended to statesmen everywhere."
 grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip] — Город монахов"
 grand_tour_events.15.desc: "[target_location.GetName] берёт само своё имя от монахов, чьё поселение стояло здесь ещё до того, как герцоги устроили рядом рынок и монетный двор, и с тех пор [target_location.GetRank.GetName] заметно разросся. Герцогский двор Виттельсбахов держит [target_location.GetRank.GetNameWithNoTooltip] в большем порядке, чем большинство прочих, а местные пивовары заботятся о том, чтобы недостатка в припасах не было.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] найдёт здесь и учёных мужей, и хорошо устроенный двор."
 grand_tour_events.15.knowledge: "Visit the cathedral schools and city chroniclers."
 grand_tour_events.15.experience: "Tour the ducal armory and the [ShowGoodsNameWithNoTooltip('salt')] trade warehouses."
 grand_tour_events.15.connections: "Present ourselves at the ducal court of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.15.party: "Set the chronicles aside for a night among the brewers."
 grand_tour_events.15.historical_info: "In 1786, the writer Hester Lynch Piozzi passed through Munich with her husband on their long continental honeymoon, arriving at dawn after a night crossing the Alps from Innsbruck and pausing to tour the Elector's picture gallery and cabinet of curiosities. Among the pieces a local collector showed her was a minutely worked image of the Virgin and Child rendered in something like spun cobweb, so fine that its figures could not be made out by the naked eye and only became visible under a microscope. Piozzi recorded the display with wonder, marveling at the great pains spent on so delicate and impractical a piece of workmanship."
 grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip] — Город на Сене"
 grand_tour_events.16.desc: "[target_location.GetName] раскинулся по обоим берегам реки вокруг острова, увенчанного великим собором, и [target_location.GetRank.GetName] крупнее почти всего, что наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] успел повидать за это путешествие. Университетский квартал на левом берегу обучает богословию и праву больше студентов, чем иные города насчитывают жителей.\n\nКоролевский двор, принимая гостей, делает это с такой торжественностью, что не остаётся сомнений в его собственном мнении о себе."
 grand_tour_events.16.knowledge: "Attend disputations at the university on the left bank."
 grand_tour_events.16.experience: "Visit the bookbinders and print shops near the university."
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.16.party: "Skip the disputations for taverns on the left bank."
 grand_tour_events.16.historical_info: "During his stay in Paris in October 1763, the novelist Tobias Smollett watched a hackney coach stop on the road to Choisy and disgorge five or six armed men, who each took up a position behind a separate tree. Expecting footpads or officers in pursuit of a criminal, Smollett asked his servant who they were, only to learn they were gentlemen out from the city for a day's hare hunting, shooting from cover at whatever game passed by. Smollett found the whole spectacle grotesque, noting dryly that it was at least an effective way of clearing a field of hares."
 grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip] — Город ярмарок"
 grand_tour_events.17.desc: "[target_location.GetName] стоит на слиянии двух рек, и [target_location.GetRank.GetName] обратил это слияние в настоящее богатство: купцы из [ShowRegionName('italy_region')], земель, говорящих на [ShowCultureGroupName('german_group')], и Фландрии съезжаются сюда на королевские ярмарки, когда улицы заполняются таким количеством [ShowGoodsName('silk')] и [ShowGoodsName('dyes')], что складов не хватает. Здешние печатные станки работают почти так же споро, как ткацкие станки.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает и застаёт город, живущий торговлей, а не церемониями."
 grand_tour_events.17.knowledge: "Seek out the humanist poets who gather at the presses."
 grand_tour_events.17.experience: "Visit the printing houses and the merchants' account books."
 grand_tour_events.17.connections: "Call upon [court_host.GetNameWithNoTooltip] and the [target_location.GetRank.GetNameWithNoTooltip]'s leading merchants."
 grand_tour_events.17.party: "Set the ledgers aside for a night among the revelers."
 grand_tour_events.17.historical_info: "In October 1763, the novelist Tobias Smollett reached Lyon on his way south to Italy and recorded the visit in letters later published as #italic Travels through France and Italy#!. Directed to a lodging-house that proved full, he was shown to a tavern demanding twelve livres a day for three shabby rooms and thirty-two more for meals; incensed at the imposition, he left without a word and drove straight to a rival inn instead. Smollett's account of Lyon's overcharging innkeepers became one of his book's most quoted passages, a staple complaint among English travelers on the road to Italy."
 grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip] — Перекрёсток дорог"
 grand_tour_events.18.desc: "[target_location.GetName] берёт своё имя от дорог, что сходятся здесь, и [target_location.GetRank.GetName] по сей день служит той же цели, раскинувшись по обе стороны реки, разделяющей земли, говорящие на [ShowLanguageName('french_language')], от земель, говорящих на [ShowLanguageName('german_language')]. Шпиль его собора поднимается выше всего, что наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] видел за всё путешествие, — единственная башня, парную которой так и не построили.\n\nВольный город управляет собой сам, а его печатники в последнее время значат не меньше, чем его купцы."
 grand_tour_events.18.knowledge: "Attend a lecture at Johannes Sturm's Gymnasium."
 grand_tour_events.18.experience: "Climb the cathedral tower and visit the printing workshops."
 grand_tour_events.18.connections: "Meet with [court_host.GetNameWithNoTooltip] and the city council."
 grand_tour_events.18.party: "Leave the printing houses for a night below the spire."
 grand_tour_events.18.historical_info: "In the early 1770s, the Scottish physician John Moore, touring the Continent as companion to the Duke of Hamilton, climbed the 466-foot steeple of Strasbourg Cathedral and recorded his visit in #italic A View of Society and Manners in France, Switzerland, and Germany#!. He describes waiting with a crowd for an illegitimate son of Louis XV to attend mass, only for the congregation to disperse unheard when noon struck before the nobleman arrived, and he then heard a fiery sermon on the tyranny of the passions. Moore also noted the cathedral's great horn, sounded nightly in memory of a plot the guides still blamed for a massacre four centuries before."
 grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip] — Врата Средиземноморья"
 grand_tour_events.19.desc: "[target_location.GetName] остаётся портом с времён, предшествовавших самому существованию Рима, основанный [ShowCultureName('greek_culture')] мореходами, что увидели гавань и остались здесь навсегда, и [target_location.GetRank.GetName] по сей день пахнет солью и смолой в каждом квартале. Галеры едва ли не со всего Средиземноморья теснятся у его причалов, а на рынках продают товары, что никогда не видели внутренних земель [GetCountry('FRA').GetName].\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит, что истинным правителем [target_location.GetRank.GetNameWithNoTooltip] служит само море."
 grand_tour_events.19.knowledge: "Study the inscriptions recalling the [target_location.GetRank.GetNameWithNoTooltip]'s [ShowCultureNameWithNoTooltip('greek_culture')] founders."
 grand_tour_events.19.experience: "Visit the harbor and speak with Mediterranean sailors."
 grand_tour_events.19.connections: "Call upon [court_host.GetNameWithNoTooltip]."
 grand_tour_events.19.party: "Trade the gossip for a night among the dockside taverns."
 grand_tour_events.19.historical_info: "In May 1765, the novelist Tobias Smollett reached Marseille on his return journey through Provence and described the port city in letters later published as #italic Travels through France and Italy#!. Strolling the harbor quay, he watched the galley slaves rented out by the Crown to work at trades in little rented booths, chained by one foot yet, in his words, living well and looking jolly as shoemakers, silversmiths, and booksellers. Smollett judged Marseille a noble and flourishing city, though he grumbled that its innkeepers charged him four livres a head for every meal."
 grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip] — Город Августа"
 grand_tour_events.20.desc: "[target_location.GetName] носит имя императора, что его основал, и [target_location.GetRank.GetName] с тех пор не перестаёт расти. Банкирские дома здесь ворочают суммами, рядом с которыми иные королевские казны кажутся скромными, а имперский рейхстаг собирается достаточно часто, чтобы [target_location.GetRank.GetNameWithNoTooltip] привык принимать князей.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибывает и застаёт город, где о деньгах говорят так же открыто, как о родословной."
 grand_tour_events.20.knowledge: "Consult the city's antiquities and humanist manuscripts."
 grand_tour_events.20.experience: "Study the account books of the great banking houses."
 grand_tour_events.20.connections: "Attend a reception hosted by [court_host.GetNameWithNoTooltip]."
 grand_tour_events.20.party: "Set the ledgers aside for the gaming tables."
 grand_tour_events.20.historical_info: "On the morning of 15 July 1772, the English music historian Charles Burney reached Augsburg after traveling all night and went straight to the cathedral, where he heard a German sermon and a mass sung by two choirs to mark a festival. He admired the singers but found the organist's harmonies so crude and far-fetched that the performance tortured rather than pleased the ear, and he was startled by a rude flourish of drums and trumpets at the elevation of the Host, a custom he had heard nowhere else but Antwerp. Learning the cantor he carried letters for was out of town, Burney, gathering material for his history of music, did not linger."
 grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip] — Кафедральный город"
 grand_tour_events.21.desc: "[target_location.GetName] строит свой собор дольше, чем может припомнить кто-либо из ныне живущих, — недостроенная башня возвышается над [target_location.GetRank.GetName], и на самой её вершине по сей день стоит кран, оставленный каменщиками. Рейн проносит мимо этого [target_location.GetRank.GetNameWithNoTooltip] больше торговли, чем почти где-либо ещё в землях, говорящих на [ShowLanguageName('german_language')], а тамошний архиепископ правит не менее властно, чем иной государь.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] застаёт город, что меряет терпение веками."
 grand_tour_events.21.knowledge: "Visit the cathedral works and the university's scholars."
 grand_tour_events.21.experience: "Tour the foundries casting bells for Rhineland churches."
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.21.party: "Skip the cathedral works for a night along the Rhine."
 grand_tour_events.21.historical_info: "In September 1794, the novelist Ann Radcliffe reached Cologne while touring the Rhineland with her husband, an excursion recorded in her published travelogue #italic A Journey Made in the Summer of 1794#!. She found the city overwhelmed with refugees fleeing the French armies advancing on Liège and Maastricht, its streets crowded with hospital wagons bearing the wounded and dying. Every inn was full; fellow travelers slept in carriages, on billiard tables, and on chaise-longues for want of a room. Radcliffe later wrote that the scene taught her more of war's true cost than any battle she had read of."
 grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip] — Город Барсино"
 grand_tour_events.22.desc: "[target_location.GetName] ведёт свои стены от римской колонии, что стояла здесь изначально, и [target_location.GetRank.GetName] разросся до самого оживлённого порта на этом побережье — его гавань полнится галерами, везущими [ShowGoodsName('wool')], пряности и [ShowGoodsName('dyes')] через всё западное Средиземноморье. К его морскому кодексу обращаются капитаны, никогда не бывавшие в самом городе.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] почти завершил долгий путь домой."
 grand_tour_events.22.knowledge: "Attend a lecture on the laws of the Catalan #italic Corts#!."
 grand_tour_events.22.experience: "Study the maritime code kept at the merchants' exchange."
 grand_tour_events.22.connections: "Present ourselves at the court of [court_host.GetNameWithNoTooltip]."
 grand_tour_events.22.party: "Trade the maritime code for dockside taverns."
 grand_tour_events.22.historical_info: "In late October 1775, the English antiquarian Henry Swinburne reached Barcelona just before the city gates shut for the night, an episode he recounted in his #italic Travels through Spain, in the Years 1775 and 1776#!. After paying his respects to the governor, he attended the theater, grumbling at first that 'Dulness has established her throne on this stage,' only to be won over days later by a spirited performance of #italic El Cid Campeador#! played in old Spanish costume. He also inspected the citadel, noting its low, damp, mosquito-plagued ground was chosen less for health than to overawe the city below."
 grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip] — Город королей"
 grand_tour_events.23.desc: "[target_location.GetName] венчает свой холм замком, где коронуют и хоронят королей, и [target_location.GetRank.GetName] относится к обоим обрядам с одинаковой торжественностью. Его университет, старше большинства в землях, говорящих на [ShowLanguageName('german_language')], обучает астрономии и праву студентов со всего края, а торговля [ShowGoodsName('amber')] и [ShowGoodsName('salt')] держит его рынки оживлёнными круглый год.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит здесь последнюю великую остановку перед домом."
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.23.experience: "Tour the Cloth Hall where merchants trade their wares."
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.23.party: "Leave the lecture hall for a night near the castle."
 grand_tour_events.23.historical_info: "On 25 July 1778, William Coxe, traveling tutor to the young Lord Herbert on an extended Grand Tour through northern and eastern Europe, crossed the Vistula into Kraków and found the old Polish capital scarred by cannon and grapeshot from recent sieges, its grand houses fallen into ruin. He toured the university founded by Casimir the Great, where the librarian showed him a Turkish book of no great value in itself, but prized as a curiosity: taken among the spoils at the Battle of Khotyn, it had been presented to the university by King John Sobieski himself as a memorial of the victory that saved Poland and won him its throne."
 grand_tour_events.24.title: "Where Next?"
 grand_tour_events.24.desc: "From [target_location.GetName], several roads lie open. [target_leader.GetName] must decide which way the tour continues: deeper into [ShowRegionName('italy_region')], or toward home."
 grand_tour_events.24.a: "Detour to [ShowLocationNameWithNoTooltip('verona')]."
 grand_tour_events.24.b: "Make for [ShowLocationNameWithNoTooltip('ferrara')] instead."
 grand_tour_events.24.c: "Turn aside to [ShowLocationNameWithNoTooltip('bologna')]."
 grand_tour_events.24.d: "Press on to [ShowLocationNameWithNoTooltip('florence')]."
 grand_tour_events.24.e: "Break the journey at [ShowLocationNameWithNoTooltip('siena')]."
 grand_tour_events.24.f: "Swing by [ShowLocationNameWithNoTooltip('pisa')] first."
 grand_tour_events.24.g: "Turn toward [ShowLocationNameWithNoTooltip('assisi')]."
 grand_tour_events.24.h: "Make for [ShowLocationNameWithNoTooltip('perugia')] instead."
 grand_tour_events.24.i: "Press on to [ShowLocationNameWithNoTooltip('rome')]."
 grand_tour_events.24.j: "Continue to [ShowLocationNameWithNoTooltip('naples')]."
 grand_tour_events.24.k: "The tour has seen enough. Return home."
 grand_tour_events.25.title: "The Road Home"
 grand_tour_events.25.desc: "The tour turns toward home at last. Rather than retrace the entire road south, [target_leader.GetName] must choose where to break the journey before the final stretch: a stop to rest the horses and, perhaps, be received at another court before returning."
 grand_tour_events.25.desc.second: "One stop is not enough to call it a homecoming. Before the road finally leads back to [ROOT.GetCountry.GetCapital.GetName], [target_leader.GetName] chooses one more city to break the journey: a last court, a last curiosity, before the tour is truly over."
 grand_tour_events.25.a: "Break the journey at [ShowLocationNameWithNoTooltip('vienna')]."
 grand_tour_events.25.b: "Rest the horses at [ShowLocationNameWithNoTooltip('prague')]."
 grand_tour_events.25.c: "Turn homeward by way of [ShowLocationNameWithNoTooltip('munich')]."
 grand_tour_events.25.d: "Stop at [ShowLocationNameWithNoTooltip('paris')] before the final stretch."
 grand_tour_events.25.e: "Pass through [ShowLocationNameWithNoTooltip('lyon')] on the way home."
 grand_tour_events.25.f: "Cross to [ShowLocationNameWithNoTooltip('london')] before turning inland."
 grand_tour_events.25.g: "Break off at [ShowLocationNameWithNoTooltip('strasbourg')] first."
 grand_tour_events.25.h: "Route the journey through [ShowLocationNameWithNoTooltip('marseille')]."
 grand_tour_events.25.i: "Make for [ShowLocationNameWithNoTooltip('augsburg')] before the last leg."
 grand_tour_events.25.k: "Rest a while in [ShowLocationNameWithNoTooltip('cologne')]."
 grand_tour_events.25.l: "Sail home by way of [ShowLocationNameWithNoTooltip('barcelona')]."
 grand_tour_events.25.n: "Break the journey at [ShowLocationNameWithNoTooltip('orleans')]."
 grand_tour_events.25.o: "Pass through [ShowLocationNameWithNoTooltip('krakow')] before the final leg home."
 grand_tour_events.25.p: "Enough delay. Make directly for home."
 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip] — Город на Темзе"
 grand_tour_events.26.desc: "[target_location.GetName] раскинулся вдоль реки за стенами, впервые возведёнными римлянами, и с тех пор [target_location.GetRank.GetName] значительно перерос их границы — его мост тесно застроен собственными домами и лавками. Склады ломятся от торговли [ShowGoodsName('wool')], а парламент заседает так часто, что [target_location.GetRank.GetNameWithNoTooltip] привык принимать у себя государственные дела королевства.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] обнаруживает двор ничуть не менее честолюбивый, чем любой на континенте."
 grand_tour_events.26.knowledge: "Attend a reading at the Inns of Court on common law."
 grand_tour_events.26.experience: "Visit the [ShowGoodsNameWithNoTooltip('wool')] merchants and the city's guildhalls."
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.party: "Set the guildhalls aside for a night in [target_location.GetNameWithNoTooltip]'s taverns."
 grand_tour_events.26.historical_info: "In 1765 the French magistrate and man of letters Pierre-Jean Grosley spent nearly a year in London gathering material for the book later translated as #italic A Tour to London#!. Among his observations, he recorded watching a minister of state pass twenty-four unbroken hours at a gaming table, sustained the whole time by nothing but cold beef pressed between two slices of toasted bread. 'This new dish,' Grosley wrote, 'grew highly in vogue during my residence in London,' known thereafter by its inventor's name. The anecdote, embellished or not, became the most quoted line of his Tour."
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], the City on the Loire"
 grand_tour_events.27.desc: "[target_location.GetName] стоит там, где Луара изгибается к северу, прежде чем вновь повернуть к морю, и [target_location.GetRank.GetName] издавна извлекал выгоду из движения по реке. Его университет преподаёт право почти так же строго, как в [ShowLocationName('bologna')], а его стены выдерживали осады, которых не пережили другие города.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] находит здесь и учёных, и воинов, которым есть что рассказать."
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.experience: "Tour the wine cellars and the Loire boatmen's guild."
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.party: "Skip the law lectures for taverns by the river."
 grand_tour_events.27.historical_info: "In April 1644, the young diarist John Evelyn broke his journey down the Loire at Orléans, on what became one of the earliest documented Grand Tours. He visited the ancient university, whose students were still divided into four historic 'nations,' French, Norman, Picard, and High Dutch, each with its own officers, and used the city's two public libraries, remarking that a scholar could borrow a book to his own lodgings merely by leaving a signed note, a liberality he found remarkable. He also saw the collegiate church of St. Croix, once stately but still visibly scarred by the recent civil wars."
 grand_tour_events.28.title: "A Learning Opportunity"
 grand_tour_events.28.desc.university: "Word reaches the retinue that a place among the students of [target_location.GetName]'s university could be arranged for [target_leader.GetName]: lectures, disputations, and the company of scholars whose names will be remembered long after this tour is forgotten."
 grand_tour_events.28.desc.scholar: "Word reaches the retinue of a scholar in [target_location.GetName] whose reputation draws students from across the continent, and who might be persuaded, for a price, and for the right pupil, to take on [target_leader.GetName] for a time."
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.29.title: "The Lectures End"
 grand_tour_events.29.desc: "The months of study draw to a close, and [target_leader.GetName] must decide what has truly been learned in [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.30.title: "A Field Opportunity"
 grand_tour_events.30.desc: "Our [ROOT.GetCountry.GetGovernment.GetHeirTitle] learns that the [target_country.GetLongName] is at war, and that its officer corps is willing to take on visitors with the right introductions. [target_leader.GetName] would hold no real command and bear no responsibility for what befalls the men, but could ride beside seasoned officers, watch a campaign made firsthand, and learn what no book on strategy has ever quite captured."
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.31.title: "The Campaign Ends"
 grand_tour_events.31.desc: "The campaigning season draws to a close, and [target_leader.GetName] must decide what has truly been learned from the officers of [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.32.title: "A Contact Opportunity"
 grand_tour_events.32.desc: "Word reaches [target_leader.GetName] of an invitation to join the court of the [target_country.GetLongName] as a guest for a season: rooms at the palace, a standing invitation to every reception, and introductions to every courtier and visiting diplomat worth knowing."
 grand_tour_events.32.desc.no_owner: "Word reaches [target_leader.GetName] of an invitation to join the household of [target_location.GetName]'s leading family as a guest for a season: introductions to every notable worth knowing, and a standing invitation to their table."
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.33.title: "The Season at Court Ends"
 grand_tour_events.33.desc: "The season at court draws to a close, and [target_leader.GetName] must decide what has truly been gained from the acquaintances made in [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.33.a: "Reflect on what was gained, and continue the journey."
 grand_tour_events.34.title: "A Fencing Opportunity"
 grand_tour_events.34.desc: "Our [ROOT.GetCountry.GetGovernment.GetHeirTitle] learns that [target_location.GetName] harbors a fencing master of real renown, willing to take on a promising pupil for the season. [target_leader.GetName] would fight no duel of real consequence and settle no true quarrel, but could learn the footwork, the timing, and the particular courage that no manual of arms has ever quite captured."
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.35.title: "The Lessons End"
 grand_tour_events.35.desc: "The season of lessons draws to a close, and [target_leader.GetName] must decide what has truly been learned from the bouts fought in [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.36.title: "A Letter from Home"
 grand_tour_events.36.desc: "A letter from [ROOT.GetCountry.GetName] catches up with the tour at last. It brings tender words from [ROOT.GetCountry.GetGovernment.GetRuler.GetName] that the court speaks well of [target_leader.GetName], and of the account [target_leader.GetHerHim] is making of [target_leader.GetHerHis] time abroad, already the subject of more than one supper table at home."
 grand_tour_events.36.a: "Mark it with a small celebration."
 grand_tour_events.36.b: "We have no time for the old home court."
 grand_tour_events.37.title: "A Local Admirer"
 grand_tour_events.37.desc: "[gt_admirer.GetName], a young local noble plainly taken with [target_leader.GetHerHis] standing and breeding, has sought [target_leader.GetHerHim] out, eager to be of some use during [target_leader.GetHerHis] visit to [target_location.GetName]."
 grand_tour_events.37.a: "Let [target_leader.GetHerHim] be presented to the right people."
 grand_tour_events.37.b: "Accept [gt_admirer.GetHerHis] gift of fine clothes, fitting for the tour."
 grand_tour_events.37.c: "Accept [gt_admirer.GetHerHis] invitation to stay at [gt_admirer.GetHerHis] own home."
 grand_tour_events.38.title: "A Useful Introduction"
 grand_tour_events.38.desc: "At a supper party, [target_leader.GetName] is seated beside [gt_secretary.GetName], an unassuming young man who says little of himself, until a chance remark reveals him to be secretary to Cardinal [target_cardinal.GetName]. He lets slip that a word from him could see [target_leader.GetNameWithNoTooltip] received by the cardinal himself, if the impression made tonight is the right one."
 grand_tour_events.38.a: "Press for the introduction, risking an awkward impression."
 grand_tour_events.38.b: "Push hard for it, embarrassment be damned."
 grand_tour_events.38.c: "Enjoy the evening, and leave it at that."
 grand_tour_events.39.title: "A Moment of Insight"
 grand_tour_events.39.desc: "In the middle of a disputation in [target_location.GetName], an argument from [target_leader.GetName] suddenly lands as an insightful stroke of genius, and the assembled scholars fall silent, then nod their approval."
 grand_tour_events.39.a: "Press further, risking ridicule if wrong."
 grand_tour_events.39.b: "Push it to the limit, ridicule be damned."
 grand_tour_events.39.c: "A fair showing today. Let it rest there."
 grand_tour_events.40.title: "A Show of Skill"
 grand_tour_events.40.desc: "During a bout at the fencing school in [target_location.GetName], [target_leader.GetName] finds an opening no instructor ever taught, and for a moment the whole room watches to see what [target_leader.GetSheHe] does with it."
 grand_tour_events.40.a: "Press the attack, risking an ugly fall."
 grand_tour_events.40.b: "Force the exchange, injury be damned."
 grand_tour_events.40.c: "Rise to the occasion, and leave it there."
 grand_tour_events.40.injury_tt: "[target_leader.GetName] takes a bad fall and is laid up, nursing bruises and pride"
 grand_tour_events.41.title: "A Bout of Illness"
 grand_tour_events.41.desc: "[target_leader.GetName] comes down with a bad case of the flux, brought on, the physicians suspect, by the local water: nothing life-threatening, they assure the retinue, but unpleasant enough to keep [target_leader.GetHerHim] abed for some days, and their fees are not cheap."
 grand_tour_events.41.a: "Send for a physician."
 grand_tour_events.41.b: "Send for the finest physician to be had."
 grand_tour_events.41.c: "Let it run its course."
 grand_tour_events.42.title: "Homesickness"
 grand_tour_events.42.desc: "The novelty of the stay has worn thin, and [target_leader.GetName] finds [target_leader.GetHerHis] thoughts drifting home, to [target_parent.GetName] above all. It does nothing for [target_leader.GetHerHis] concentration."
 grand_tour_events.42.a: "Write home to [target_parent.GetHerHim], with a small gift."
 grand_tour_events.42.b: "Commission a portrait to send [target_parent.GetHerHim]."
 grand_tour_events.42.c: "Abandon the tour, and return home to [target_parent.GetHerHim]."
 grand_tour_events.43.title: "A Costly Misstep"
 grand_tour_events.43.desc: "It emerges only after the fact that [target_leader.GetName] greeted the local magistrate out of turn at last night's reception, a breach of precedence obvious to everyone in the room but the retinue. Their host is unlikely to forget it without some gesture of contrition, though a clumsy one could easily make matters worse."
 grand_tour_events.43.a: "Offer a small gift by way of apology, risking it falls flat."
 grand_tour_events.43.b: "Make a grand gesture of apology."
 grand_tour_events.43.c: "Let the matter lie."
 grand_tour_events.44.title: "The Corrupt Watch"
 grand_tour_events.44.desc: "Returning after dark, [target_leader.GetName] is set upon in an alley by men in the city watch's livery, more interested in a stranger's purse than the law they are sworn to keep."
 grand_tour_events.44.a: "Denounce the watchmen to the magistrate in the morning."
 grand_tour_events.44.b: "Duel the watchmen in the alley."
 grand_tour_events.44.c: "Flee into the street, shouting for help."
 grand_tour_events.44.d: "Hand over the purse, and walk away."
 grand_tour_events.45.title: "Попутчик"
 grand_tour_events.45.desc: "В толпе посетителей оживлённого постоялого двора [ROOT.GetCountry.GetGovernment.GetHeirTitle] заводит разговор с человеком по имени [gt_friend.GetName] — [Select_CString(gt_friend.IsFemale, 'ещё одной молодой аристократкой с родины, путешествующей', 'ещё одним молодым аристократом с родины, путешествующим')] почти тем же маршрутом по тем же причинам. Они сразу находят общий язык, делятся рассказами о родной стране и о своих путешествиях, пока дорога снова не разводит их — каждого в свой город."
 grand_tour_events.45.a: "Так начинается крепкая дружба."
 grand_tour_events.45.b: "Пожелаем удачи и продолжим путь в одиночестве."
 grand_tour_events.friendship_up_1_tt: "Дружба с персонажем [gt_friend.GetName] усиливается (#G +1#! к дружбе)"
 grand_tour_events.friendship_up_2_tt: "Дружба с персонажем [gt_friend.GetName] значительно усиливается (#G +2#! к дружбе)"
 grand_tour_events.friendship_down_1_tt: "Дружба с персонажем [gt_friend.GetName] слабеет (#R -1#! к дружбе)"
 grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], [Select_CString(gt_friend.IsFemale, 'новая подруга', 'новый друг')] [Select_CString(heir.IsFemale, 'нашей наследницы', 'нашего наследника')], [Select_CString(gt_friend.IsFemale, 'готова', 'готов')] последовать за [Select_CString(heir.IsFemale, 'ней', 'ним')] домой, к нашему двору."
 grand_tour_events.friend_reunion_intro: "Неожиданно [gt_friend.GetName] тоже [Select_CString(gt_friend.IsFemale, 'приехала', 'приехал')] в [target_location.Custom('LR_ACC')|l] [target_location.GetName]: пути двух друзей вновь пересеклись после разлуки, и разговор продолжается, будто и не прерывался."
 grand_tour_events.46.title: "Друг в беде"
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis] purse, [gt_friend.GetSheHe] admits, has been emptied by a run of bad luck at the card tables, and [gt_friend.GetSheHe] asks, plainly embarrassed, whether there is any way we could help before the debt becomes a scandal."
 grand_tour_events.46.a: "Тихо покроем [Select_CString(gt_friend.IsFemale, 'её', 'его')] долг из собственных средств."
 grand_tour_events.46.b: "Напишем знакомым, чтобы они предоставили [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] кредит."
 grand_tour_events.46.c: "Пожелаем [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] удачи — пусть [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] ищет выход."
 grand_tour_events.47.title: "Совместное открытие"
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Обмениваясь новостями о том, чему каждый научился с момента расставания, [gt_friend.GetNameWithNoTooltip] признаётся, что [Select_CString(gt_friend.IsFemale, 'запуталась', 'запутался')] в лекции — тексте, который наши собственные занятия уже давно сделали для нас понятным, — и просит помочь разобраться."
 grand_tour_events.47.a: "Сядем и всё объясним, опираясь на то, что нам уже известно."
 grand_tour_events.47.b: "Вместо этого наймём репетитора, который поможет [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] разобраться."
 grand_tour_events.47.c: "Скажем [Select_CString(gt_friend.IsFemale, 'ей', 'ему')], что всё просто, и пусть [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] разбирается."
 grand_tour_events.48.title: "Слово в нужное ухо"
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'услышала', 'услышал')] о частном салоне в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip], где собираются приличные местные семьи, но у [Select_CString(gt_friend.IsFemale, 'неё', 'него')] нет знакомых, которые помогли бы туда попасть. [target_leader.GetName] же, благодаря знакомствам, приобретённым в ходе путешествия, находится в совсем иной ситуации."
 grand_tour_events.48.a: "Отправим весточку нашему знакомому и поручимся за [Select_CString(gt_friend.IsFemale, 'неё', 'него')]."
 grand_tour_events.48.b: "Вместо этого оплатим [Select_CString(gt_friend.IsFemale, 'её', 'его')] вход на менее важное собрание."
 grand_tour_events.48.c: "Скажем [Select_CString(gt_friend.IsFemale, 'ей', 'ему')] [Select_CString(gt_friend.IsFemale, 'самой', 'самому')] искать способ попасть туда."
 grand_tour_events.49.title: "Угроза насилия"
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Встреча быстро принимает дурной оборот: [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'перешла дорогу', 'перешёл дорогу')] местному ростовщику, и тот теперь стоит у их стола на постоялом дворе с двумя наёмными громилами и обещает сломать не только мебель, если долг не будет погашен уже сегодня."
 grand_tour_events.49.a: "Вмешаемся сами: мы знаем, как обращаться с такими типами."
 grand_tour_events.49.b: "Просто расплатимся с кредитором и закончим на этом."
 grand_tour_events.49.c: "Оставим [Select_CString(gt_friend.IsFemale, 'её', 'его')] разбираться с последствиями в одиночку."
 grand_tour_events.50.title: "Небольшая хворь"
 grand_tour_events.50.desc: "[target_leader.GetName] узнаёт, что [gt_friend.GetName] тоже [Select_CString(gt_friend.IsFemale, 'приехала', 'приехал')] в [target_location.Custom('LR_ACC')|l] [target_location.GetName] и лежит в постели на местном постоялом дворе, подхватив в дороге простуду с лихорадкой. Трактирщик бормочет, что кошелёк [Select_CString(gt_friend.IsFemale, 'молодой девушки', 'молодого человека')] казался тощим при оплате комнаты и что [Select_CString(gt_friend.IsFemale, 'она', 'он')] уже дважды [Select_CString(gt_friend.IsFemale, 'отмахнулась', 'отмахнулся')] от местного врача, чтобы сэкономить на лечении."
 grand_tour_events.50.a: "Оплатим услуги врача вопреки [Select_CString(gt_friend.IsFemale, 'её', 'его')] возражениям."
 grand_tour_events.50.b: "Сами будем ухаживать за [Select_CString(gt_friend.IsFemale, 'ней', 'ним')], опираясь на собственный опыт путешествий."
 grand_tour_events.50.c: "Навестим [Select_CString(gt_friend.IsFemale, 'её', 'его')] и пожелаем скорейшего выздоровления."
 grand_tour_events.50.d: "Тогда лучше держаться подальше."
