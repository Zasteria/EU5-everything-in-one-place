l_russian:
 mining_survey_events.1.title: "Разведочная комиссия"
 mining_survey_events.1.desc: "Отряд рудознатцев стоит наготове на дворе, их вьючные мулы нагружены кирками, бурами и промасленным деревянным сундуком с тиглями, весами и кислотами пробирного мастера. Год они будут ходить по нашей горной стране, промывая русла ручьёв на золотой песок, вгрызаясь в кварцевые жилы и расспрашивая пастухов о том, в каких долинах лоток даёт цвет. Эти холмы уже отдавали своё богатство прежде, часто народам, о которых мы совсем позабыли. Нет причин думать, что им больше нечего дать."
 mining_survey_events.1.a: "Spare no expense. Send the best assayers and a generous purse for samples."
 mining_survey_events.1.b: "A modest commission will do. The headmen will provide guides and shelter."
 mining_survey_events.1.historical_info: "Систематическая разведка недр практиковалась по всей средневековой и ранней Новой Европе, наиболее известно — в Рудных горах Саксонии и Богемии, где открытие серебряных жил в двенадцатом веке породило такие города-однодневки, как Фрайберг, Яхимов и Шнееберг. #italic О горном деле#! Георгия Агриколы (1556) стало основным учебником этого ремесла, подробно описывая использование лозоискательных прутьев, пробирный анализ образцов руды в небольших тиглях и правовые обычаи, регулирующие заявку прав на месторождения."
 mining_survey_events.10.title: "Жила [ShowGoodsNameWithNoTooltip('iron')]"
 mining_survey_events.10.desc: "Рудознатцы наткнулись на жилу высокосортной [ShowGoodsName('iron')] руды, что уходит глубоко в гору — камень исполосован чёрным и красным там, где его обнажили кирки. Старейшина ближней деревни говорит, что его дед рассказывал о старых выработках где-то на склоне выше; новые шахты, возможно, просто вновь открывают то, что было утрачено. Кузницы и литейни вниз по течению будут сыты на целое поколение, если находка не подведёт."
 mining_survey_events.10.a: "Объявить о находке. Пусть [ROOT.GetCountry.GetFlavorRank] узнает о том, что у нас есть."
 mining_survey_events.10.b: "Develop it quietly. The rival foundries need not hear of it yet."
 mining_survey_events.10.historical_info: "Добыча железа в доиндустриальной Европе строилась на небольших поверхностных выработках и неглубоких шахтах, следовавших за видимым выходом руды на поверхность, а сыродутные горны превращали руду в кованое железо прямо близ рудника. Доменная печь, появившаяся в позднем Средневековье, позволила производить чугун в куда больших количествах, и на этом строили своё раннее новоевропейское благополучие великие железодобывающие области Швеции, Штирии и Страны Басков."
 mining_survey_events.11.title: "Залежь [ShowGoodsNameWithNoTooltip('copper')]"
 mining_survey_events.11.desc: "Рудознатцы прошли по полосе камня с зелёными подтёками вверх по склону холма и нашли источник: залежь [ShowGoodsName('copper')], что тянется через обрыв скалы, открытая всем ветрам и ждущая, когда её начнут разрабатывать. Пробирный мастер разбивает образец на своей переносной наковальне, бросает его в тигель и сообщает, что металл чист и даёт хороший выход. Плавильщиков уже вызывают из южных городов."
 mining_survey_events.11.a: "Develop the workings openly. The [ROOT.GetCountry.GetFlavorRank] should know we strike [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b: "Develop the workings quietly. The brass-founders will pay better if rumor stays low."
 mining_survey_events.11.historical_info: "Добыча меди в доиндустриальной Европе была сосредоточена в нескольких прославленных областях: Фалуне в Швеции, склонах Рудных гор, Мансфельдском крае в Саксонии и Тирольских Альпах. Этот металл был необходим для бронзовых орудий, обшивки кораблей и латунных изделий, и прибыльный медный рудник мог обогатить как корону, которой он принадлежал, так и купеческие дома, финансировавшие его разработку. Банкирская династия Фуггеров возвысилась отчасти благодаря контролю над тирольской медью."
 mining_survey_events.12.title: "Залежь [ShowGoodsNameWithNoTooltip('tin')] в холмах"
 mining_survey_events.12.desc: "Старатели проследили тёмные оловянные камешки в русле ручья вверх по склону и нашли жилу там, где она выходит на поверхность: порода, содержащая [ShowGoodsName('tin')], тянется толстым и чистым слоем вдоль кварцевой жилы. Рудокопы уже возводят крепи в шахте и ставят толчейную мельницу у подножия холма. Бронзолитейщики, оловянщики и мастера столовой посуды будут обеспечены сырьём на целое поколение."
 mining_survey_events.12.a: "Announce the discovery. A new [ShowGoodsNameWithNoTooltip('tin')] lode is a matter of state interest."
 mining_survey_events.12.b: "Keep the find quiet. The bronze trade rewards those who corner the supply."
 mining_survey_events.12.historical_info: "Олово было стратегическим металлом в домодерном мире, необходимым как для бронзовых пушек, так и для домашней оловянной посуды, а его запасы были сосредоточены в нескольких известных областях: Корнуолле, Рудных горах и части Богемии. Оловянные округа Корнуолла с эпохи Средневековья пользовались особым правовым статусом, имея собственные суды и парламент, а корнуоллская торговля оловом питала производство латуни и бронзы по всей Атлантической Европе."
 mining_survey_events.13.title: "Галенит в известняке"
 mining_survey_events.13.desc: "В холмистой местности вскрыт пласт галенита: его тёмные кристаллы пронизаны серебристыми проблесками, обещающими полезный побочный продукт плавки. [ShowGoodsName('lead')] из этого пласта пойдёт на кровли церквей, обшивку труб и отливку дроби, а доля [ShowGoodsName('silver')] поможет окупить разработку. Штейгер докладывает о чистом забое и устойчивой тяге в новой шахте."
 mining_survey_events.13.a: "Огласить находку. [ShowGoodsNameWithNoTooltip('lead')] — дело общественного интереса."
 mining_survey_events.13.b: "Quietly contract the output to the powder mills and the printers."
 mining_survey_events.13.historical_info: "В домодерной Европе свинец и серебро почти всегда добывались вместе, поскольку галенитовая руда давала оба металла благодаря процессу купеляции, изобретённому в древности и усовершенствованному в Средние века. Мендипские холмы в Англии, Гарц в Саксонии и Сьерра-Морена в Испании были важнейшими свинцово-серебряными округами, а добываемый свинец шёл на всё — от кровель соборов до типографских литер и свинцовых водопроводных труб."
 mining_survey_events.14.title: "[ShowGoodsNameWithNoTooltip('silver')] в скале"
 mining_survey_events.14.desc: "Старатели наткнулись на [ShowGoodsName('silver')] — жилу, достаточно широкую, чтобы в ней размахнуться киркой, и достаточно чистую, чтобы полироваться прямо в породе. Тигли пробирщика ещё не остыли после испытаний. Шахта укреплена крепью, и первые тележки руды уже поднимают на поверхность скрипучим воротом. Монетный двор не будет знать нужды в драгоценном металле ещё целое поколение, а дворы [ShowContinentName('europe')] узнают об этой находке в течение года."
 mining_survey_events.14.a: "Announce the strike to the [ROOT.GetCountry.GetFlavorRank]. A [ShowGoodsNameWithNoTooltip('silver')] mine is a triumph."
 mining_survey_events.14.b: "Keep the strike quiet. Foreign interest in our [ShowGoodsNameWithNoTooltip('silver')] could prove inconvenient."
 mining_survey_events.14.historical_info: "Silver mining transformed European economies in the late medieval and early modern periods. The discovery of major silver veins at Schwaz in the Tyrol and Joachimsthal in Bohemia in the late 1400s, followed by the Potosí strike in the Andes in 1545, flooded Europe with bullion and underwrote the great inflations of the sixteenth century. A productive silver mine was a strategic asset on the scale of a fleet or a fortress."
 mining_survey_events.15.title: "Жёлтый металл"
 mining_survey_events.15.desc: "Старатели наткнулись на [ShowGoodsName('goods_gold')]. Кварцевая жила, пронизанная грубыми нитями металла, обнажилась на скальной стене там, где зимний обвал снял слой почвы. Металл ярко блестит в свете фонаря и не тронут с тех пор, как порода была заложена. Староста деревни предлагает сдать разработки в аренду [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] за то, что он называет справедливой долей. Пробирщик рекомендует принять предложение, но с оговорками."
 mining_survey_events.15.a: "Объявить о находке. Пусть враги о ней узнают."
 mining_survey_events.15.b: "Develop the workings quietly. [ShowGoodsNameWithNoTooltip('goods_gold')] attracts unwanted visitors."
 mining_survey_events.15.historical_info: "Самородное золото в доиндустриальной Европе было редкостью и быстро истощалось. Средневековые золотые рудники Кремницы в Словакии и Вранчи в Валахии были заметными местными источниками, но большая часть европейского золота добывалась из аллювиальных россыпей рек, таких как Рейн и Тахо, либо получалась при переработке серебряной фракции свинцово-серебряных руд. Обнаружение самородного золота в сколько-нибудь значительном количестве было редкой удачей, и корона неизменно спешила заявить на него свои права."
 mining_survey_events.16.title: "Чёрный камень горит жарко"
 mining_survey_events.16.desc: "Через эти холмы проходит мощный пласт [ShowGoodsName('coal')], выходящий на поверхность в двух местах, где его вскрыла речная эрозия. Пласт легко прослеживается, а [ShowGoodsNameWithNoTooltip('coal')] горит чисто. Местные кузнецы уже меняют на него дровяное топливо для своих горнов. Кузницы, солеварни и стекольные мастерские теперь можно снабжать из этого пласта без дальнейшего сведения лесов в округе."
 mining_survey_events.16.a: "Develop the seam under [ROOT.GetCountry.GetGovernment.GetAdjective] grant. The [ROOT.GetCountry.GetFlavorRank] should know."
 mining_survey_events.16.b: "Lease the workings to the iron-masters in exchange for a steady fraction."
 mining_survey_events.16.historical_info: "Добыча угля в небольших масштабах велась в Европе с эпохи Средневековья, главным образом в Уэльсе, Ньюкаслском угольном бассейне и в некоторых областях Льежа, однако настоящий подъём этой отрасли пришёлся на ранний Новый век, когда топливный кризис заставил вырубать леса под пашню. В семнадцатом веке морской уголь из Ньюкасла тысячами тонн отправлялся в Лондон, и без него железоделательная промышленность не пережила бы нехватки древесного угля."
 mining_survey_events.17.title: "Хорошо колющийся [ShowGoodsNameWithNoTooltip('stone')]"
 mining_survey_events.17.desc: "В холмах открыта новая каменоломня: [ShowGoodsName('stone')] чисто раскалывается по слоям залегания и после выемки твердеет на воздухе. Главный каменщик прибыл с постройки собора, чтобы осмотреть образец блока, и признал его пригодным как для тёсаной кладки, так и для тонкой резьбы и несущих рядов. Каждый собор и крепостная стена на сто миль вокруг будут снабжаться отсюда на протяжении целого поколения."
 mining_survey_events.17.a: "Take the workings into [ROOT.GetCountry.GetGovernment.GetAdjective] hands. [ShowGoodsNameWithNoTooltip('stone')] is a strategic resource."
 mining_survey_events.17.b: "Lease the quarry to the master masons' guild for a steady rent."
 mining_survey_events.17.historical_info: "Строительный камень был товаром неспешным, но ценным в доиндустриальной Европе, поскольку стоимость перевозки была главным фактором его цены. Продуктивная каменоломня в дне пути от крупного города или строительной площадки становилась долгосрочным достоянием, и великие средневековые соборные стройки в Реймсе, Солсбери и Кёльне содержали собственные каменоломни на протяжении многих поколений, чтобы обеспечивать нужды строительства."
 mining_survey_events.18.title: "[ShowGoodsNameWithNoTooltip('marble')] в лощине"
 mining_survey_events.18.desc: "В укрытой лощине обнаружен [ShowGoodsName('marble')] высочайшего качества с прожилками, и главный каменщик вырезал образец блока, который после полировки даёт глубокий полупрозрачный блеск. Местные скульпторы уже подают прошения о праве первыми получать эту добычу. Мастерские вплоть до самой столицы будут пользоваться этой каменоломней на протяжении целого поколения, и резчики алтарей и гробниц сочтут себя облагодетельствованными."
 mining_survey_events.18.a: "Make the discovery known. A great [ShowGoodsNameWithNoTooltip('marble')] quarry is a national treasure."
 mining_survey_events.18.b: "Reserve the [ShowGoodsNameWithNoTooltip('marble')] for [ROOT.GetCountry.GetGovernment.GetAdjective] workshops. Discretion serves us better than fame."
 mining_survey_events.18.historical_info: "Мрамор для тонкой скульптуры и архитектуры средневековой и ренессансной Европы добывался в немногих прославленных каменоломнях: Карраре в Тоскане, Паросе и Пентеликоне в Греции, а также Сен-Бе в Пиренеях. Открытие новой богатой жилы мрамора статуарного качества становилось событием среди художников, которые заказывали образцы и лично отправлялись осмотреть многообещающую находку."
 mining_survey_events.19.title: "Камни, что играют светом"
 mining_survey_events.19.desc: "Разведчики нашли в русле ручья гравий с [ShowGoodsName('gems')] и проследили его до более богатого гнезда на склоне холма выше, где вмещающей породой служит пегматит, пронизанный кристаллами. Представитель камнерезов, вызванный из столицы, сортирует груду необработанных камней по цвету и чистоте и сообщает, что доля пригодных для резки камней исключительно высока. Придворным ювелирам не будет нехватки в камнях на протяжении целого поколения."
 mining_survey_events.19.a: "Announce the find. A [ShowGoodsNameWithNoTooltip('gems')]-pit is a wonder worth boasting of."
 mining_survey_events.19.b: "Reserve the output for the [ROOT.GetCountry.GetGovernment.GetAdjective] household. [ShowGoodsNameWithNoTooltip('gems')] are a discreet sort of wealth."
 mining_survey_events.19.historical_info: "Добыча драгоценных камней в Европе была делом незначительным по сравнению с великими индийскими и бирманскими месторождениями, но местные источники гранатов, берилла, аметиста и топаза разрабатывались в Богемском нагорье, шотландских Кернгормс и некоторых районах Пиренеев. Камнерезные мастерские Идар-Оберштайна в Рейнской области стали центром обработки местных камней, и удачная находка могла обеспечить работой их мастеров на долгие годы."
 mining_survey_events.20.title: "Киноварь в горах"
 mining_survey_events.20.desc: "A cinnabar deposit has been opened in the highlands, its bright red ore the unmistakable sign of [ShowGoodsName('mercury')] in the rock. The retort and the condenser are being set up at a safe distance from the workings. The alchemists, the assayers, and the gilders will all draw on this mine for a generation, and the silver-refiners of the New World may yet pay anything to ship our quicksilver to their mints."
 mining_survey_events.20.a: "Открыто развивать рудник. [ShowGoodsNameWithNoTooltip('mercury')] — стратегический товар."
 mining_survey_events.20.b: "Develop the mine quietly. A monopoly on quicksilver is a powerful thing."
 mining_survey_events.20.historical_info: "Ртуть, единственный жидкий при комнатной температуре металл, была незаменима для процесса амальгамации, который в шестнадцатом веке стал главенствующим в переработке американского серебра. Рудник Альмаден в Кастилии и Идрия в Крайне были двумя великими европейскими источниками, и корона Испании держала альмаденские выработки под строгой королевской монополией, отправляя ртуть в Мексику и Перу на галеонах под охраной флота."
 mining_survey_events.21.title: "Соляной источник"
 mining_survey_events.21.desc: "В нагорье открыто новое месторождение каменной [ShowGoodsName('salt')], с рассольными источниками, выходящими там, где пласты пересекают дно долины. Солевары уже принялись за работу, а местные крестьяне пригоняют скот пить у соляных выходов. От этого выиграют и торговля солёным мясом, и общий стол, а габель, если мы решим её ввести, покроет год расходов на нужды [ROOT.GetCountry.GetGovernment.Custom('CL_GEN')] двора одной лишь этой находкой."
 mining_survey_events.21.a: "Развивать соляные промыслы [ShowGoodsNameWithNoTooltip('salt')] под [ROOT.GetCountry.GetGovernment.GetAdjective] грамотой."
 mining_survey_events.21.b: "Lease the operation to the salt-merchants for a steady fraction."
 mining_survey_events.21.historical_info: "Соль была стратегическим товаром в доиндустриальной Европе — незаменимым средством консервации пищи и важным источником государственных доходов через различные соляные налоги и монополии, самой известной из которых была французская габель. Крупные соляные копи Велички в Польше, Гальштата в Австрии и Кардоны в Каталонии разрабатывались веками и составили состояние семей и корон, владевших ими."
 mining_survey_events.22.title: "Найдены сланцы с [ShowGoodsNameWithNoTooltip('alum')]"
 mining_survey_events.22.desc: "Изыскатели обнаружили в предгорьях сланцы, содержащие [ShowGoodsName('alum')]: порода естественным образом выветривается в соль, за которую красильщики готовы платить любую цену. Пробная обжиговая печь дала из первых образцов чистый белый [ShowGoodsNameWithNoTooltip('alum')], и представители суконных торговцев уже интересуются долгосрочными контрактами. Текстильная торговля долго ждала источника ближе к дому, чем папская монополия в Тольфе."
 mining_survey_events.22.a: "Announce the find. [ShowGoodsNameWithNoTooltip('alum')] is a triumph of the [ROOT.GetCountry.GetFlavorRank]'s industry."
 mining_survey_events.22.b: "Develop the workings quietly. The papal [ShowGoodsNameWithNoTooltip('alum')] monopoly does not need to know."
 mining_survey_events.22.historical_info: "Квасцы, незаменимый протравитель для закрепления красителей на ткани, были стратегическим текстильным товаром на протяжении Средневековья и раннего Нового времени. Открытие крупных залежей квасцов в Тольфе в Папской области в 1462 году создало ватиканскую монополию, которая продержалась более века, пока не были освоены альтернативные источники в Англии, Швеции и Нидерландах. Любая страна, способная обеспечить себя собственными квасцами, избавляла свою суконную промышленность от досадной зависимости от иностранных поставок."
 mining_survey_events.23.title: "[ShowGoodsNameWithNoTooltip('saltpeter')] в долине"
 mining_survey_events.23.desc: "[ShowGoodsName('saltpeter')] добыт из почвы укрытой долины — белые кристаллы выступили на скальной поверхности после весеннего таяния. Пороховой мастер, прибывший из арсенала, взял пробу необработанной селитры и объявил её пригодной для очистки на порох высшего качества. Пороховые мельницы не будут испытывать нужды в селитре ещё поколение, и артиллерийский обоз [ROOT.GetCountry.GetFlavorRank] наконец сможет соответствовать её амбициям."
 mining_survey_events.23.a: "Develop the workings under [ROOT.GetCountry.GetGovernment.GetAdjective] monopoly. [ShowGoodsNameWithNoTooltip('saltpeter')] is a matter of war."
 mining_survey_events.23.b: "Allow the powder-merchants to develop the workings in exchange for first call on the output."
 mining_survey_events.23.historical_info: "Селитра, главный ингредиент пороха, в доиндустриальной Европе добывалась из укрытых почв, долго удобрявшихся навозом и пометом, либо ввозилась за большие деньги из Индии и Леванта. Государственный контроль над добычей селитры был стратегическим вопросом: в Англии существовала система «селитряных людей» с законным правом копать под конюшнями и голубятнями, а во Франции королевская монополия — #italic Régie des Poudres#! — сохранялась до XIX века."
 # BAD events
 mining_survey_events.30.title: "Обвал в разведочной шахте"
 mining_survey_events.30.desc: "Катастрофа на месторождении [ShowGoodsName('iron')]. Разведочный шурф обрушился ночью — крепь была сорвана медленной осадкой рыхлого сланца над рудной жилой. Двое из разведочной группы погребены под обвалом; ещё один, ученик пробирного мастера, был вытащен со сломанной ногой и решительно отказался когда-либо снова спускаться под землю. Штейгер говорит, что [ShowGoodsNameWithNoTooltip('iron')] там есть, но чтобы добраться до неё, придётся прокладывать новую штольню через более твёрдую породу, а расходы будут немалые."
 mining_survey_events.30.a: "Withdraw the team. Some prospects are not worth burying men to reach."
 mining_survey_events.30.historical_info: "Обвалы кровли и разрушения шахт были хронической профессиональной опасностью доиндустриальной горной добычи. Деревянная крепь, поддерживающая выработки, гнила во влажном грунте; рыхлые пласты над рудной жилой оседали без предупреждения; а стандартный метод камерно-столбовой добычи оставлял всё более незакреплённые пустоты по мере выработки руды. Горняцкие часовни, похоронные братства горняков и фонды для вдов горняков были неотъемлемой чертой каждого европейского горнопромышленного края."
 mining_survey_events.31.title: "Ядовитый дым из выработок"
 mining_survey_events.31.desc: "Разработка [ShowGoodsName('copper')] приносит руду неожиданного свойства. Первая куча для обжига, устроенная для удаления сульфидов перед плавкой, испускает едкий жёлтый дым, который согнал рабочих со склона и губит траву на полмили по ветру. Местные крестьяне подали официальную жалобу. Металлург говорит, что может построить настоящие обжиговые печи для улавливания дыма, но это потребует золота и времени, которых мы не закладывали в смету."
 mining_survey_events.31.a: "Abandon the prospect. The locals are not wrong about the air."
 mining_survey_events.31.historical_info: "Плавка меди из сульфидных руд высвобождала большие количества сернистого газа, который губил посевы, скот и лёгкие людей по всей округе. Медный округ Фалун в Швеции был печально известен своим дымом, который, как говорили, делал окрестные земли бесплодными на много миль вокруг, а великая медеплавильная долина нижнего Гарца была не менее разорительной. Гражданские иски против рудников за ущерб от дыма были обычным делом начиная со Средневековья."
 mining_survey_events.32.title: "Русло реки пересохло"
 mining_survey_events.32.desc: "Разработка [ShowGoodsName('tin')] поначалу выглядела многообещающе: аллювиальный касситерит в достаточном количестве, который вымывали из русла реки целыми повозками. Но источник россыпи так и не найден, а русла ныне выработаны от тяжёлой руды. Шурфы, выкопанные выше по склону, наткнулись лишь на пустую породу. У команды закончились очевидные места для копки, а расходы на более глубокие разведочные шахты без каких-либо доказательств трудно оправдать."
 mining_survey_events.32.a: "Оставить разработку. Россыпь оказалась сиюминутной удачей."
 mining_survey_events.32.historical_info: "Аллювиальная добыча олова, то есть разработка оловоносного гравия в руслах рек и ручьёв, была изначальным способом корнуоллской добычи олова и сохранялась вплоть до раннего Нового времени. Когда лёгкий гравий заканчивался, рудознатцам приходилось прослеживать россыпь до её источника путём систематической разведки окрестных холмов. Многие многообещающие ручьи вели лишь к тонкой рассеянной жиле, не оправдывавшей затрат на подземную разработку."
 mining_survey_events.33.title: "Рабочие занемогли"
 mining_survey_events.33.desc: "Разработка [ShowGoodsName('lead')] даёт руду. А рабочие дают жалобы. У людей, выходящих со смены, серовато-землистые дёсны, распухшие суставы и тяжёлая заторможенность, которую лагерный лекарь называет коликой рудокопов. Двое умерли; ещё четверо слишком больны, чтобы спускаться в шахту. Штейгер говорит, что работы можно продолжать, если нанять новых людей и смириться с потерями, но местный старейшина задаёт неудобные вопросы о том, кто будет следующим."
 mining_survey_events.33.a: "Close the workings. We did not come here to bury free men of the [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.33.historical_info: "Lead poisoning, the #italic colic plumbica#! of the ancients, was a well-known occupational disease of lead miners, smelters, glaziers, and potters. Bernardino Ramazzini's #italic De morbis artificum diatriba#! (1700), the foundational text of occupational medicine, devoted a long chapter to the affliction. The standard remedies of bleeding, purging, and milk-drinking were ineffective, and the only real preventive was to limit exposure, which mine-owners had little economic incentive to do."
 mining_survey_events.34.title: "Жила выклинивается"
 mining_survey_events.34.desc: "Жила [ShowGoodsName('silver')] была широкой там, где рудознатцы впервые вскрыли её, и первые повозки руды по анализу давали свыше тридцати марок [ShowGoodsNameWithNoTooltip('silver')] на центнер. Но затем, на десять ярдов вглубь по падению пласта, жила резко сузилась, руда обеднела, и забой теперь едва окупает расходы на подъём породы на поверхность. Геологи называют это #italic выклиниванием #!. У рудокопов на этот счёт есть выражение куда менее вежливое. Возможно, дальше вдоль разлома найдётся ещё [ShowGoodsNameWithNoTooltip('silver')], но чтобы это выяснить, потребуются дорогостоящие разведочные шахты без каких-либо доказательств."
 mining_survey_events.34.a: "Отступить. Выклинившаяся жила — закрытая дверь."
 mining_survey_events.34.historical_info: "Silver veins were notoriously variable along their length, swelling to feet-thick ore bodies in some sections and narrowing to barren stringers in others. The vagaries of vein geometry made silver mining a profession of educated gambling, and the rise and fall of medieval boom towns like Joachimsthal, Schwaz, and Iglau tracked the discovery and exhaustion of particular veins with grim regularity."
 mining_survey_events.35.title: "All That Glitters is not Gold"
 mining_survey_events.35.desc: "Разочарование на разработке [ShowGoodsName('goods_gold')]. Яркие металлические вкрапления в кварце — вовсе не [ShowGoodsNameWithNoTooltip('goods_gold')], а пирит, сернистое железо, обманывавшее старателей с самой зари металлургии. Первая проба, проведённая пробирщиком путём восстановления в тигле, дала не жёлтый королёк [ShowGoodsNameWithNoTooltip('goods_gold')], а тонкую красную сернистую окалину и кусок чугуна. Старейшина местной деревни явно не удивлён: он слышал старые бабушкины сказки про #italic Narrengold#! на этом склоне и ждал, узнают ли наши учёные мужи разницу."
 mining_survey_events.35.a: "Pack up and leave. Fool's gold is the prospector's eternal companion."
 mining_survey_events.35.historical_info: "Пирит, сульфид железа, отливающий латунно-жёлтым блеском в породе и получивший в немецких горнорудных краях прозвище #italic Narrengold#! («золото дураков»), вводил старателей в заблуждение с тех самых пор, как люди начали искать настоящий металл. Отличительные пробы — ковкость под молотом (пирит крошится, золото расплющивается), удельный вес (золото в девятнадцать раз плотнее воды, пирит лишь в пять раз), и поведение при огневом анализе (золото не изменяется, пирит выгорает, превращаясь в серу и оксид железа) — были обычной практикой для любого сведущего пробирщика."
 mining_survey_events.36.title: "Рудничный газ в пласте"
 mining_survey_events.36.desc: "Пласт [ShowGoodsName('coal')] залегает толстым и чистым слоем. Но он же полон рудничного газа. Болотный газ, скапливающийся в любой глубокой выработке [ShowGoodsNameWithNoTooltip('coal')], воспламенился от лампы одного из забойщиков, и последовавший взрыв убил троих на месте и обжёг ещё шестерых так тяжело, что они больше не смогут работать. Штейгер говорит, что пласт можно разрабатывать, но лишь при постоянном проветривании через вентиляционный ствол и печь, а это потребует немалых средств прежде, чем удастся добыть хоть немного [ShowGoodsNameWithNoTooltip('coal')]."
 mining_survey_events.36.a: "Close the working. We are not yet equipped to fight firedamp."
 mining_survey_events.36.historical_info: "Рудничный газ, метан, скапливающийся в угольных выработках и взрывающийся от любого открытого огня, был постоянным убийцей шахтёров доиндустриальной эпохи. Стандартной мерой борьбы служило систематическое проветривание парными стволами с печью у подножия восходящего ствола, вытягивающей воздух через выработки; безопасная лампа Дэви, позволявшая освещать забой без риска воспламенения, была изобретена лишь в 1815 году. До тех пор каждый глубокий угольный пласт разрабатывался под постоянной угрозой катастрофы."
 mining_survey_events.37.title: "Затопление каменоломни"
 mining_survey_events.37.desc: "[ShowGoodsName('stone')] здесь превосходный, но каменоломню невозможно осушить. Первый карьер, углублённый на двенадцать футов вдоль пласта, за ночь заполняется водой из родника, которого каменотёсы не предвидели, и нижний ряд [ShowGoodsNameWithNoTooltip('stone')] теперь скрыт под тремя футами холодной воды. Мастер-каменщик говорит, что каменоломню можно разрабатывать, если прорыть дренажную штольню в долину внизу, но сама штольня — это ещё год каменных работ, а бюджет этого не предусматривал."
 mining_survey_events.37.a: "Забросить каменоломню. Затопленный карьер — карьер закрытый."
 mining_survey_events.37.historical_info: "Осушение каменоломен было постоянной инженерной проблемой в доиндустриальной добыче камня, и многие в остальном прибыльные карьеры забрасывались, когда забой опускался ниже местного уровня грунтовых вод. Стандартными решениями были дренажные штольни, прорубаемые горизонтально к более низкой местности (так называемые #italic Stollen#! в немецкой горнорудной традиции), водяные колёса, приводящие в движение цепные насосы с бадьями, а с семнадцатого века — постепенное внедрение паровых насосных машин."
 mining_survey_events.38.title: "Глыба раскалывается"
 mining_survey_events.38.desc: "[ShowGoodsName('marble')] поначалу казался цельным прямо у забоя. Два дня спустя, когда первую огромную глыбу наконец отделили от коренной породы и опустили на деревянные катки, она треснула по невидимой трещине, распавшись на шесть бесполезных обломков под собственным весом при спуске. Мастер-каменщик обходит забракованную глыбу, постукивает по ней молотком и произносит то, что вся артель уже и так знает: [ShowGoodsNameWithNoTooltip('marble')] в этой лощине насквозь пронизан внутренними трещинами, которые никакой осмотр забоя не мог выявить."
 mining_survey_events.38.a: "Close the quarry. Fractured [ShowGoodsNameWithNoTooltip('marble')] is fit only for road metal."
 mining_survey_events.38.historical_info: "Мраморные глыбы для статуй и тонкой архитектурной отделки должны были быть свободны от внутренних изъянов, и обнаружение скрытых трещин (#italic peli#! на жаргоне итальянских каменотёсов) было постоянным кошмаром ремесла. Мастера-скульпторы лично приезжали в каменоломни, чтобы осмотреть необработанные глыбы перед заказом, и стоимость крупного заказа на статую включала щедрый запас на случай, если после доставки глыба окажется с изъяном."
 mining_survey_events.39.title: "Стекло, а не хрусталь"
 mining_survey_events.39.desc: "Гравийные наносы, содержащие [ShowGoodsName('gems')], оказались необычайно богаты. Подозрительно богаты. Королевский ювелир, доставленный из столицы под охраной, осматривает добычу при ярком свете лампы, взвешивает каждый камень на ладони, царапает один осколком корунда и выносит неизбежный приговор: большинство находок — подделка, свинцовое стекло, хитроумно огранённое и состаренное так, чтобы походить на необработанный хрусталь. Кто-то подсыпал камни в русло реки. Штейгер этим утром заметно отсутствует в лагере."
 mining_survey_events.39.a: "Сворачиваемся. Всё это месторождение было мошенничеством."
 mining_survey_events.39.historical_info: "«Засолка» — практика подбрасывания настоящей руды или обработанных самоцветов на участок для привлечения инвестиций — была древним промысловым обманом на горнорудном фронтире. Штейгер, подсаливавший собственные выработки, местный проводник, разбрасывавший несколько припрятанных образцов вдоль выбранного ручья, и заезжий делец, устраивавший «удачную» находку, — вечные фигуры в истории как европейского, так и американского горного дела. Продажный оценщик, подтверждавший подлог, довершал обычную схему."
 mining_survey_events.40.title: "Безумие от [ShowGoodsNameWithNoTooltip('mercury')]"
 mining_survey_events.40.desc: "Выработки [ShowGoodsName('mercury')] дают металл. А ещё они дают безумцев. Рабочие у ретортных печей начали неудержимо трястись; подмастерье, которому поручили помешивать конденсированную [ShowGoodsNameWithNoTooltip('mercury')], лишился зубов и не владеет двумя пальцами на правой руке; а главный металлург, лучше всех знавший об опасностях, впал в раздражённую рассеянность, которую лагерный врач называет #italic шляпным безумием#! и считает неизлечимой. [ShowGoodsNameWithNoTooltip('mercury')] здесь есть. А вот людей, чтобы её добыть, — нет."
 mining_survey_events.40.a: "Закрыть выработки. Никакой металл не стоит этого."
 mining_survey_events.40.historical_info: "Ртутное отравление, проявлявшееся в дрожи, выпадении зубов и постепенном психическом расстройстве, было хорошо известной профессиональной болезнью рудокопов, добывавших киноварь, работников у реторт и серебряных амальгамщиков. Рудник Альмаден в Кастилии, крупнейший европейский источник ртути, разрабатывался отчасти каторжным трудом именно по этой причине. Английское выражение #italic безумен, как шляпник#! сохранило память об этом ремесле — со времён, когда мастеров по изготовлению фетровых шляп травила ртуть, применяемая в их деле."
 mining_survey_events.41.title: "Рассольный источник иссяк"
 mining_survey_events.41.desc: "Участок с [ShowGoodsName('salt')] начинался хорошо. Рассольный источник был мощным, котлы давали белую [ShowGoodsNameWithNoTooltip('salt')] высшего качества, а солеторговцы уже вели переговоры о долгосрочных контрактах. Но после засушливого лета и более холодной, чем обычно, зимы источник ослаб до тонкой струйки, а затем и вовсе иссяк. Присланный геолог сообщает, что подземный источник был не возобновляемым потоком, а конечным карманом захваченного рассола, и что месторождение практически исчерпано."
 mining_survey_events.41.a: "Отступить. Пересохший источник — это конец рассольного промысла по добыче [ShowGoodsNameWithNoTooltip('salt')]."
 mining_survey_events.41.historical_info: "Рассольные источники и месторождения каменной соли имели совершенно разную геологическую природу и хозяйственные перспективы. Некоторые рассольные источники, как в Галле в Саксонии или Сален-ле-Бен в Юра, действовали веками и кормили целые города; другие же были по сути ископаемыми карманами, истощавшимися за одно поколение интенсивной добычи. Каменная соль, добываемая в таких местах, как Величка и Кардона, была более надёжным, но и более капиталоёмким ресурсом."
 mining_survey_events.42.title: "Сланцы бесплодны"
 mining_survey_events.42.desc: "Сланцевый выход на поверхность выглядел многообещающе: порода при выветривании давала соль, чистую и белую при пробе. Но под покровом сланцы оказались бесплодны: толстые, тёмные и совершенно лишённые пиритовых жил с [ShowGoodsName('alum')], которые, казалось, обещали поверхностные образцы. Химик пробует кислотное выщелачивание, затем обжиг, затем долгую выдержку на отвале — и получает почти ничего. Рабочие, привезённые с немалыми затратами из текстильных городов, сидят без дела, пока инженер перебирает один способ за другим."
 mining_survey_events.42.a: "Close the works. We cannot manufacture [ShowGoodsNameWithNoTooltip('alum')] where the chemistry does not allow it."
 mining_survey_events.42.historical_info: "Производство квасцов из пиритовых сланцев требовало точно выверенного минерального состава: железный пирит давал сульфат-ион, глинистый сланец — алюминий, а долгое выветривание сводило то и другое воедино в растворе. Поверхностные образцы легко вводили в заблуждение, ведь именно на выходах природное выветривание уже сделало свою работу; подземная же порода часто оказывалась бесплодной. Йоркширские квасцовые промыслы на побережье Северного моря потратили десятилетия и немалый капитал на сланцы, которые в итоге не дали ничего."
 mining_survey_events.43.title: "Земля не даёт ничего"
 mining_survey_events.43.desc: "Почва в долине, по слухам, должна была быть богата [ShowGoodsName('saltpeter')]. Местные крестьяне говорили, что их деды каждую весну собирали белый налёт со скальной стены. Старатели уже перекопали, выщелочили и выпарили почву в десятке мест по всей долине — и получили почти ничего ценного. Пороховых дел мастер, увидев скудный выход, предполагает, что старые залежи [ShowGoodsNameWithNoTooltip('saltpeter')] могли быть выработаны теми самыми крестьянами, чьи деды рассказывали эти истории. Теперь долина лишена [ShowGoodsNameWithNoTooltip('saltpeter')]."
 mining_survey_events.43.a: "Abandon the valley. We cannot make [ShowGoodsNameWithNoTooltip('saltpeter')] where the soil is dead."
 mining_survey_events.43.historical_info: "Почвы, богатые селитрой, не были неисчерпаемы. Естественный процесс образования селитры во влажной, унавоженной земле занимал годы и легко истощался при интенсивной добыче. Поэтому немецкая традиция #italic Salpetersieder#! включала систематическое устройство искусственных #italic Salpeterplantagen#! — куч навоза, извести и золы, которые годами выдерживали и обрабатывали для получения устойчивого выхода селитры. Переход от поиска селитры к её производству стал важным шагом в рационализации доиндустриального производства пороха."
