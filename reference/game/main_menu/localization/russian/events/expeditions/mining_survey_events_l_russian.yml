l_russian:
 mining_survey_events.1.title: "Комиссия рудоискателей"
 mining_survey_events.1.desc: "Во дворе наготове стоит отряд рудоискателей: вьючные мулы нагружены кирками, бурами и промасленным деревянным сундуком, в котором лежат тигли, весы и кислоты пробирщика. Целый год они будут ходить по нашему нагорью, проверяя русла ручьёв на россыпное золото, обстукивая молотками кварцевые жилы и расспрашивая пастухов, в каких долинах в лотке появляются золотые крупицы. Эти холмы и прежде отдавали своё богатство, часто народам, о которых мы совсем забыли. Нет причин думать, что в них ничего не осталось."
 mining_survey_events.1.a: "Не пожалеем средств. Отправим опытных пробирщиков за образцами золота."
 mining_survey_events.1.b: "Достаточно скромной платы. Старейшины предоставят проводников и кров."
 mining_survey_events.1.historical_info: "В Средние века и в раннее Новое время в Европе активно проводилась разведка рудных залежей. Наиболее широко эта деятельность велась в Рудных горах Саксонии и Богемии, где открытие залежей серебра в XII веке привело к бурному росту таких городов, как Фрайберг, Яхимов и Шнеберг. В 1556 году было издано сочинение Георга Агриколы #italic «О горном деле и металлургии»#!, где были подробно описаны методы лозоходства и опробования руды, а также приведены правовые обычаи касательно притязаний на рудоносные участки. Этот труд почти 200 лет служил одним из основных руководств по добыче и обработке металлов."
 mining_survey_events.10.title: "Пласт железной руды"
 mining_survey_events.10.desc: "Рудоискатели наткнулись на пласт высокосортного железа. Он уходит глубоко в гору, а порода там, где её обнажили кирки, прочерчена чёрным и рыжим. Староста ближайшей деревни рассказывает, что его дед упоминал о старых выработках где-то выше по склону: возможно, новые шахты снова открывают то, что когда-то было утрачено. Если находка не подведёт, кузницы и литейные в низовьях будут обеспечены работой на целое поколение."
 mining_survey_events.10.a: "Объявим о находке. Пусть [ROOT.GetCountry.GetFlavorRank] узнает, что у нас есть."
 mining_survey_events.10.b: "Будем вести разработку тихо. Литейным соперников пока незачем знать о находке."
 mining_survey_events.10.historical_info: "Добыча железа в доиндустриальной Европе опиралась на небольшие поверхностные разработки и неглубокие шахты, шедшие вслед за выходом руды на поверхность, а сыродутные печи превращали руду в кованое железо неподалёку от рудника. Доменная печь, появившаяся в позднем Средневековье, позволила получать чугун в куда больших объёмах, и стала источников процветания крупнейших железодобывающих регионов: Швеции, Штирии и Страна Басков."
 mining_survey_events.11.title: "Медная жила"
 mining_survey_events.11.desc: "Рудоискатели поднялись по склону холма вслед за прожилкой породы, позеленевшей от окислов, и нашли её источник: медную жилу, прорезающую скалу, открытую всем ветрам и так и ждущую вскрытия. Пробирщик раскалывает образец на походной наковальне, бросает его в тигель и сообщает, что металл чист и даёт хороший выход. Из городов на юге уже вызывают плавильщиков."
 mining_survey_events.11.a: "Будем вести разработку открыто. Пусть [ROOT.GetCountry.GetFlavorRank] узнает о нашей меди."
 mining_survey_events.11.b: "Будем вести разработку тихо. Литейщики латуни заплатят больше, пока слухи не разошлись."
 mining_survey_events.11.historical_info: "В доиндустриальной Европе добыча меди была сосредоточена в нескольких знаменитых округах: Фалуне в Швеции, на склонах Рудных гор, в районе Мансфельд в Саксонии и в Тирольских Альпах. Металл был необходим для бронзовой артиллерии, обшивки кораблей и латунных изделий, а богатый медный рудник мог обогатить как корону, которой он принадлежал, так и торговые дома, финансировавшие его разработку. Банкирская династия Фуггеров обязана своему успеху отчасти благодаря контролю над тирольской медью."
 mining_survey_events.12.title: "Оловянная жила в холмах"
 mining_survey_events.12.desc: "Рудоискатели поднялись по склону вдоль русла ручья, ориентируясь по тёмной гальке касситерита, и нашли жилу там, где она выходит на поверхность: порода, содержащая олово, тянется толстой чистой полосой вдоль кварцевой жилы. У подножия холма горняки уже ставят шахты с деревянной крепью и дробильную мельницу. Литейщики бронзы, оловянщики и изготовители посуды на целое поколение будут обеспечены материалом."
 mining_survey_events.12.a: "Объявим о находке. Новая оловянная жила — дело государственной важности."
 mining_survey_events.12.b: "Сохраним это в тайне. Захватим рынок бронзы раньше соперников."
 mining_survey_events.12.historical_info: "В доиндустриальном мире олово было стратегически важным металлом: оно требовалось как для бронзовых пушек, так и для бытовой оловянной посуды. Запасы его были сосредоточены в немногих знаменитых краях: Корнуолле, Рудных горах и некоторых областях Богемии. Корнуольские оловянные рудники со Средневековья обладали особым правовым статусом, имели собственные суды и парламент, а корнуольская торговля оловом питала производство бронзы и латуни по всей атлантической Европе."
 mining_survey_events.13.title: "Галенит в известняке"
 mining_survey_events.13.desc: "В холмистом краю вскрыт пласт галенита: его тёмные кристаллы пронизаны серебристыми проблесками, обещающими полезный побочный продукт плавки. #TOOLTIP:GOODS,lead,X #L Свинец#!#! из этого пласта пойдёт на кровли церквей, трубы и отливку дроби, а извлечённое #TOOLTIP:GOODS,silver,X #L серебро#!#! поможет оплатить разработку. Бригадир докладывает, что забой чистый, а по новой шахте идёт ровная тяга воздуха."
 mining_survey_events.13.a: "Сделаем находку достоянием гласности. Свинец — дело общественной важности."
 mining_survey_events.13.b: "Негласно заключим контракты с пороховыми заводами и типографиями."
 mining_survey_events.13.historical_info: "В доиндустриальной Европе свинец и серебро почти всегда добывали вместе: из галенита получали оба металла путём купелирования — процесса, изобретённого ещё в древности и совершенствовавшегося на протяжении всего Средневековья. Холмы Мендип в Англии, горы Гарц в Саксонии и Сьерра-Морена в Испании были важными районами добычи свинца и серебра, и добытый там свинец шёл на всё, от кровель соборов до типографского шрифта и труб городского водопровода."
 mining_survey_events.14.title: "Серебро в камне"
 mining_survey_events.14.desc: "Рудоискатели нашли крупную жилу самородного серебра, добывать которое проще простого — только маши киркой. Тигли пробирщика ещё горячи после пробных плавок. Шахта закреплена брёвнами, и скрипучая лебёнка уже поднимает на поверхность первые телеги руды. Монетный двор будет обеспечен слитками на целое поколение, и уже в этом году о находке заговорят дворы всей #TOOLTIP:CONTINENT,europe,X #L Европы#!#!."
 mining_survey_events.14.a: "Пусть [ROOT.GetCountry.GetFlavorRank] узнает об этом. Серебряный рудник — это триумф."
 mining_survey_events.14.b: "Сохраним это в тайне. Чужие взгляды на наше серебро добра не принесут."
 mining_survey_events.14.historical_info: "Добыча серебра преобразила европейские экономики в позднем Средневековье и раннем Новом времени. Открытие крупных серебряных жил в Шваце в Тироле и в Яхимове в Богемии в конце 1400-х годов, а затем находка в Потоси в Андах в 1545 году наводнили Европу слитками и стали причиной великих инфляций XVI века. Прибыльный серебряный рудник был стратегическим достоянием уровня флота или крепости."
 mining_survey_events.15.title: "Жёлтый металл"
 mining_survey_events.15.desc: "Рудоискатели обнаружили богатое месторождение #TOOLTIP:GOODS,goods_gold,X #L золота#!#! в кварцевой жиле — вкрапления драгоценного металла в кристаллах кварца обнажились на скале там, где зимний обвал сорвал почвенный покров. На свету металл ярко блестит: его никто не касался с тех пор, как образовалась порода. Староста деревни предлагает: пусть [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] арендует залежи за справедливую, по его мнение, долю. Пробирщик советует согласиться, но на определённых условиях."
 mining_survey_events.15.a: "Объявим о находке. Пусть о ней узнают и наши враги."
 mining_survey_events.15.b: "Будем вести работы тихо. Золото привлекает непрошеных гостей."
 mining_survey_events.15.historical_info: "Месторождения самородного золота в доиндустриальной Европе были редкостью и рано истощились. Средневековые золотые рудники Кремницы в Словакии и Вранчи в Валахии были значительными местными источниками, но большая часть европейского золота поступала из россыпей в таких реках, как Рейн и Тахо, или из очистки серебряной фракции свинцово-серебряных руд. Находка самородного золота в более-менее заметном количестве становилась удачей первой величины, и корона неизменно спешила заявить на неё свои права."
 mining_survey_events.16.title: "Чёрный камень горит жарко"
 mining_survey_events.16.desc: "В здешних холмах залегает толстый угольный пласт, выходящий на поверхность в двух местах, что облегчит его разработку. Пласт легко проследить, а #TOOLTIP:GOODS,coal,X #L уголь#!#! горит чисто. Местные кузнецы уже начала заменять им дрова для горнов. Кузни, солеварни и стекольные мастерские теперь надолго обеспечены ценным горючим, и нам не придётся наращивать вырубку леса."
 mining_survey_events.16.a: "Начнём разработку по #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ому#! разрешению. Пусть [ROOT.GetCountry.GetFlavorRank] узнает об этом."
 mining_survey_events.16.b: "Сдадим выработки в аренду мастерам железных дел за достойную долю."
 mining_survey_events.16.historical_info: "Добыча угля в Европе велась в небольших масштабах со Средневековья, главным образом в Уэльсе, в угольном месторождении Ньюкасла и в окрестностях Льежа, но настоящий размах она приобрела во времена топливного кризиса раннего Нового времени, когда леса вырубали под пашню. В XVII веке «морской уголь» из Ньюкасла отправляли в Лондон тысячами тонн, и без него железная промышленность не пережила бы нехватки древесного угля."
 mining_survey_events.17.title: "Хороший строительный камень"
 mining_survey_events.17.desc: "В холмах открылась новая каменоломня; добываемый в ней #TOOLTIP:GOODS,stone,X rамень#! легко обтёсывается и крепко держится в кладке. Главного каменщика привезли со строительства собора осмотреть пробный блок, и он признал его пригодным для облицовки, тонкой резьбы и несущих конструкций. Все соборы и куртины в окрестности сотни миль будут обеспечены камнем на целое поколение вперёд."
 mining_survey_events.17.a: "Возьмём выработки под #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий#! контроль. Камень — стратегический ресурс."
 mining_survey_events.17.b: "Сдадим карьер в аренду гильдии каменщиков за постоянную плату."
 mining_survey_events.17.historical_info: "Строительный камень в доиндустриальной Европе был ценным, но тяжёлым в перевозке товаром, поскольку основную долю его цены составляли транспортные расходы. Производительный карьер в пределах одного дня пути от крупного города или строительной площадки становился долговременным достоянием, а при строительстве великих средневековых соборов в Реймсе, Солсбери и Кёльне на протяжении нескольких поколений использовались специальные карьеры, обеспечивавшие потребности этих сооружений."
 mining_survey_events.18.title: "Мрамор в лощине"
 mining_survey_events.18.desc: "В укромной лощине найдены прожилки #TOOLTIP:GOODS,marble,X #L мрамора#!#! высочайшего качества, и главный каменщик вырезал пробный блок, который удалось отполировать до глубокого полупрозрачного сияния. Местные скульпторы уже ходатайствуют о преимущественном праве покупки всего выпуска. Мастерские вплоть до самой столицы будут целое поколение брать камень из этого карьера, а резчики алтарей и надгробий могут считать себя счастливчиками."
 mining_survey_events.18.a: "Объявим об этом. Крупный мраморный карьер — достояние державы."
 mining_survey_events.18.b: "Тихо оставим мрамор для #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]их#! нужд."
 mining_survey_events.18.historical_info: "Мрамор для изящных скульптур и архитектуры в Европе Средних веков и Возрождения добывали в нескольких знаменитых карьерах: в Карраре в Тоскане, на Паросе и Пентеликоне в Греции и в Сен-Беа в Пиренеях. Открытие нового пласта статуарного мрамора становилось событием для художников: они заказывали образцы и лично отправлялись осмотреть многообещающую находку."
 mining_survey_events.19.title: "Камни, ловящие свет"
 mining_survey_events.19.desc: "Рудоискатели нашли в русле ручья гравий, в котором содержатся #TOOLTIP:GOODS,gems,X #L драгоценные камни#!#!, и проследили его до более богатого месторождения выше по склону, где порода представляет собой пегматит, пронизанный кристаллами. Представитель гранильщиков, вызванный из столицы, сортирует кучу необработанных камней по цвету и чистоте и сообщает, что доля пригодного для огранки исключительно велика. Придворные ювелиры целое поколение не будут нуждаться в камнях."
 mining_survey_events.19.a: "Объявим о находке. Копь драгоценных камней — чудо, которым не грех похвастаться."
 mining_survey_events.19.b: "Тихо приберём драгоценные камни для #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой#! казны."
 mining_survey_events.19.historical_info: "Добыча драгоценных камней в Европе была делом скромным по сравнению с великими индийскими и бирманскими копями, однако местные залежи граната, берилла, аметиста и топаза разрабатывались в Богемском нагорье, в шотландских горах Кэрнгорм и в некоторых областях Пиренеев. Гранильные мастерские Идар-Оберштайна в Рейнской области стали центром огранки местных камней, и богатая находка могла занять их мастеров на долгие годы."
 mining_survey_events.20.title: "Киноварь в холмах"
 mining_survey_events.20.desc: "В нагорьях были обнаружены залежи киновари — эту ярко-красную #TOOLTIP:GOODS,mercury,X #L ртутную#!#! руду ни с чем не спутать. Реторту и конденсатор устанавливают на безопасном расстоянии от выработок. Алхимики, пробирщики и золотых дел мастера теперь на поколение вперёд обеспечены бесценным для своего ремесла жидким металлом, а мастера, очищающие серебро в Новом Свете, возможно, заплатят любые деньги, лишь бы получить нашу ртуть для своих монетных дворов."
 mining_survey_events.20.a: "Будем разрабатывать рудник открыто. Ртуть — стратегический товар."
 mining_survey_events.20.b: "Будем разрабатывать тихо. Монополия на ртуть — хорошее подспорье."
 mining_survey_events.20.historical_info: "Ртуть — единственный металл, остающийся жидким при комнатной температуре, — была необходима для амальгамации, процесса, который в XVI веке стал господствующим при очищении американского серебра. Рудник Альмаден в Кастилии и Идрия в Крайне были двумя главными европейскими источниками, и испанская корона держала альмаденские выработки как строгую королевскую монополию, отправляя ртуть в Мексику и Перу на галеонах под охраной военных кораблей."
 mining_survey_events.21.title: "Солёный источник"
 mining_survey_events.21.desc: "В нагорьях обнаружили крупные залежи каменной соли — их нашли по солоноватой воде ручейков, на дне которых соляные пласты выходили на поверхность. Солевары уже взялись за дело, а местные земледельцы гонят скот на водопой к солёным источникам. Это отличная новость для кулинаров и торговцев солониной, а налог габель, если мы решим его ввести, покроет с одной лишь этой находки годовые бытовые расходы #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого#! двора."
 mining_survey_events.21.a: "Развернём соляной промысел по #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ому#! разрешению."
 mining_survey_events.21.b: "Сдадим промысел в аренду торговцам солью за стабильную долю."
 mining_survey_events.21.historical_info: "Соль была стратегическим товаром в доиндустриальной Европе: она была незаменима для сохранения пищи и служила важным источником государственных доходов благодаря различным соляным налогам и монополиям, самым известным из которых был французский габель. Большие соляные копи Велички в Польше, Гальштата в Австрии и Кардоны в Каталонии разрабатывались веками и стали источником состояния семей и корон, которым принадлежали."
 mining_survey_events.22.title: "Найдены квасцовые сланцы"
 mining_survey_events.22.desc: "В холмистой местности рудоискатели обнаружили пласты #TOOLTIP:GOODS,alum,X #L квасцовых#!#! сланцев. Камень давно выветрился, и осталась чистая соль, за которую красильщики готовы будут отдать любые деньги. Пробная реторта дала из первых образцов чистые белые квасцы, и представители торговцев тканью уже справляются о долгосрочных договорах. Текстильная торговля давно ждала источника, который был бы ближе к дому, чем папская монополия в Тольфе."
 mining_survey_events.22.a: "Объявим о находке. Квасцы — триумф ремесла [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 mining_survey_events.22.b: "Будем вести разработку тихо. Папской монополии на квасцы знать об этом незачем."
 mining_survey_events.22.historical_info: "Квасцы — незаменимая протрава для закрепления красителей на ткани — на протяжении Средневековья и раннего Нового времени оставались стратегическим товаром текстильной промышленности. Открытие крупных месторождений квасцов в Тольфе в Папской Области в 1462 году породило папскую монополию, продержавшуюся более века, пока не были освоены альтернативные источники в Англии, Швеции и Нидерландах. Любая держава, которая могла обеспечить себя собственными квасцами, избавляла свою текстильную промышленность от унизительной зависимости от иностранцев."
 mining_survey_events.23.title: "Селитра в долине"
 mining_survey_events.23.desc: "В неприметной долине после весеннего половодья рудоискатели обнаружили на камнях характерные белые кристаллы селитры, целый пласт которой залегал неглубоко под землёй. Мастер по пороху, вызванный из арсенала, проверяет сырую селитру и признаёт её годной для переработки в порох высшего качества. Теперь [ROOT.GetCountry.GetFlavorRank] ещё долго не будет испытывать недостатка в порохе, а её артиллерийский парк наконец сможет соответствовать амбициям."
 mining_survey_events.23.a: "Начнём разработку под #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой#! монополией. Селитра — это война."
 mining_survey_events.23.b: "Пусть торговцы порохом ведут разработку в обмен на первоочередное право на добытое."
 mining_survey_events.23.historical_info: "Селитру, главный ингредиент пороха, в доиндустриальной Европе добывали из укрытых от дождя почв, долгое время удобрявшихся навозом и помётом, либо ввозили с огромными затратами из Индии и Леванта. Государственный контроль над производством селитры был вопросом стратегической важности: в Англии действовала система селитроваров, имевших законное право копать под конюшнями и голубятнями, а во Франции вплоть до XIX века действовала #italic Régie des Poudres#! — королевская монополия."
 # BAD events
 mining_survey_events.30.title: "Обвал в разведочном шурфе"
 mining_survey_events.30.desc: "Бедствие на разведочном участке, где ищут #TOOLTIP:GOODS,iron,X #L железо#!#!. Разведочный шурф обрушился ночью: крепь вырвало медленным оседанием рыхлого сланца над рудным пластом. Двое рудоискателей погребены; ещё одного, ученика пробирщика, вытащили со сломанной ногой и с твёрдым решением никогда больше не спускаться в шахту. Бригадир говорит, что железо там есть, но чтобы добраться до него, придётся пробивать новую штольню в более твёрдой породе, а это обойдётся недёшево."
 mining_survey_events.30.a: "Отзовём бригаду. Есть земля, ради которой не стоит хоронить людей."
 mining_survey_events.30.historical_info: "Обрушения кровли и стволов шахт были хронической профессиональной опасностью горных работ доиндустриальной эпохи. Деревянная крепь выработок гнила во влажном грунте; рыхлые слои над рудным пластом оседали без предупреждения; а привычный камерно-столбовой способ добычи по мере выемки руды оставлял всё больше незакреплённых пустот. Горняцкие часовни, похоронные братства и фонды помощи вдовам шахтёров были неотъемлемой частью каждого горнодобывающего округа Европы."
 mining_survey_events.31.title: "Ядовитый дым из выработок"
 mining_survey_events.31.desc: "Руда, найденная на разведочном участке, где ищут #TOOLTIP:GOODS,copper,X #L медь#!#!, оказалась неожиданного свойства. Первая обжиговая куча, сложенная, чтобы выгнать сульфиды перед плавкой, выделяет едкий жёлтый дым, который согнал рабочих со склона и губит траву на полмили по ветру. Местные земледельцы подали официальную жалобу. Металлург говорит, что может построить настоящие обжиговые печи, чтобы сдерживать испарения, но это будет стоить золота и времени, на которые мы не рассчитывали."
 mining_survey_events.31.a: "Прекратим разведку. Местные правы насчёт воздуха."
 mining_survey_events.31.historical_info: "Выплавка меди из сульфидных руд выбрасывала большое количество сернистого газа, который губил посевы, скот и лёгкие людей на всей прилегающей сельской местности. Медный округ Фалуна в Швеции имел дурную репутацию из-за своего дыма, от которого, по слухам, окрестные поля на много миль превращались в бесплодную землю, а великая медеплавильная долина Нижнего Гарца была не менее разрушительной. Гражданские иски против горных предприятий за ущерб от дыма были обычным делом со Средневековья."
 mining_survey_events.32.title: "Оскудевшее русло"
 mining_survey_events.32.desc: "Разведочный участок, где ищут #TOOLTIP:GOODS,tin,X #L олово#!#!, поначалу обнадёживал: россыпной касситерит в промышленном количестве вымывали из русла целыми телегами. Но источник россыпи не найден, а русла теперь начисто очищены от тяжёлой руды. Шурфы, пробитые в склонах холмов выше выработок, натыкались лишь на пустую породу. Отряд исчерпал все очевидные места для раскопок, а траты на более глубокие шахты без всяких свидетельств трудно оправдать."
 mining_survey_events.32.a: "Прекратим разведку. Россыпь была лишь недолгим везением."
 mining_survey_events.32.historical_info: "Промывка оловянных россыпей — разработка оловоносной гальки в руслах ручьёв и рек — была исконным способом добычи олова в Корнуолле и сохранялась до начала Нового времени. Когда лёгкие россыпи истощались, горнякам приходилось идти по следу россыпи к её источнику, систематически обследуя окрестные холмы. Многие многообещающие ручьи приводили лишь к тонкой вкрапленной жиле, не оправдывавшей затрат на подземные работы."
 mining_survey_events.33.title: "Рабочие заболевают"
 mining_survey_events.33.desc: "Разведочный участок, где ищут #TOOLTIP:GOODS,lead,X #L свинец#!#!, даёт руду. Рабочие — жалобы. У выходящих из смены сероватые дёсны, распухшие суставы и сильная вялость, которую лагерный врач называет свинцовой коликой. Двое умерли; ещё четверо слишком больны, чтобы спускаться в шахту. Бригадир говорит, что работы можно продолжать, если нанять замену и смириться с потерями, но староста деревни задаёт неприятные вопросы о том, кто будет следующим."
 mining_survey_events.33.a: "Закроем участок. Мы не затем сюда пришли, чтобы хоронить свободных людей [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 mining_survey_events.33.historical_info: "Свинцовое отравление — #italic colica plumbica#! предков — было хорошо известной профессиональной болезнью свинцовых рудокопов, плавильщиков, стекольщиков и гончаров. Трактат Бернардино Рамаццини #italic De morbis artificum diatriba#! («Рассуждения о болезнях ремесленников», 1700), основополагающий труд по профессиональной медицине, посвятил этому недугу большую главу. Обычные средства — кровопускание, слабительные и молочная диета — были бесполезны, а единственной реальной мерой профилактики было ограничение контакта, к чему у владельцев рудников почти не было экономических стимулов."
 mining_survey_events.34.title: "Жила выклинивается"
 mining_survey_events.34.desc: "#TOOLTIP:GOODS,silver,X #L Серебряная#!#! жила была широкой там, где рудоискатели впервые её вскрыли, и первые подводы показали при пробе свыше тридцати марок серебра на центнер. Затем, в десяти ярдах вниз по падению пласта, жила резко сузилась, руда оскудела, и забой теперь едва окупает затраты на подъём породы на поверхность. Геологический термин — #italic выклинивание#!. Шахтёрский — куда более груб. Возможно, дальше вдоль разлома серебра больше, но чтобы найти его, придётся пробивать дорогостоящие разведочные шахты наугад."
 mining_survey_events.34.a: "Отступим. Выклинившаяся жила — закрытая дверь."
 mining_survey_events.34.historical_info: "Серебряные жилы, как известно, сильно отличалисьпо протяжённости: на одних участках они раздувались в рудные тела толщиной в несколько футов, на других сужались до пустых прожилков. Капризы геометрии жил превращали добычу серебра в своего рода азартную игру, а расцвет и упадок средневековых шахтёрских городов — Яхимова, Шваза и Йиглавы — с мрачной закономерностью повторяли открытие и истощение отдельных жил."
 mining_survey_events.35.title: "Не всё то золото, что блестит"
 mining_survey_events.35.desc: "Разочарование на разведочном участке, где ищут #TOOLTIP:GOODS,goods_gold,X #L золото#!#!. Яркие металлические блёстки в кварце — не золото, а пирит, сернистое железо, которое обманывало рудоискателей ещё на заре металлургии. Первая проба пробирщика — восстановление в тигле — дала не жёлтую каплю золота, а тонкий красный серный налёт и кусок чугуна. Староста местной деревни подчёркнуто не удивлён: он слышал старые дедовские рассказы о #italic золоте дураков#! на этом склоне и хотел увидеть, поймут ли наши учёные разницу."
 mining_survey_events.35.a: "Свернём лагерь и уйдём. Золото дураков — старейшая уловка, на которую попадаются рудоискатели."
 mining_survey_events.35.historical_info: "Пирит — сернистое железо, отливающее в породе латунной желтизной и получившее в немецких шахтёрских краях народное название #italic золото дураков#!, — вводил рудоискателей в заблуждение с тех пор, как люди начали искать настоящий металл. Различительные пробы — ковкость под молотом (пирит крошится, золото расплющивается), удельный вес (золото тяжелее воды в девятнадцать раз, пирит — лишь в пять) и поведение при пробирной плавке (золото выдерживает, пирит выгорает серой и оксидом железа) — были обычной практикой для любого грамотного пробирщика."
 mining_survey_events.36.title: "Рудничный газ в пласте"
 mining_survey_events.36.desc: "Пласт, где залегает #TOOLTIP:GOODS,coal,X уголь#!, толстый и чистый. Но он также полон рудничного газа. Болотный газ, скапливающийся в любой глубокой угольной выработке, вспыхнул от лампы одного из забойщиков, и последовавший взрыв убил трёх человек на месте, а ещё шестерых обжёг так, что работать они больше не смогут. Бригадир говорит, что пласт можно разрабатывать, но только при постоянной вентиляции через воздухопровод с печью, а это потребует значительных вложений, прежде чем будет добыт хоть кусок угля."
 mining_survey_events.36.a: "Закроем выработку. Мы пока не готовы бороться с рудничным газом."
 mining_survey_events.36.historical_info: "Рудничный газ — метан, скапливающийся в угольных выработках и взрывающийся от любого огня, — был постоянной причиной гибели шахтёров доиндустриальной эпохи. Обычной мерой борьбы служила систематическая вентиляция парными стволами с печью у основания вытяжного ствола, протягивавшая воздух через выработки; безопасная лампа Дэви, позволявшая освещать шахту без риска воспламенения, была изобретена только в 1815 году. До тех пор каждый глубокий угольный пласт разрабатывался в условиях постоянной угрозы."
 mining_survey_events.37.title: "Затопленный карьер"
 mining_survey_events.37.desc: "#TOOLTIP:GOODS,stone,X #L Камень#!#! превосходный, но карьер не желает оставаться сухим. Первая выработка, врезанная на двенадцать футов в осадочный слой, за ночь наполняется водой из родника, которого камнетёсы не ожидали, и нижний слой камня теперь лежит под тремя футами холодной воды. Главный каменщик говорит, что карьер можно разрабатывать, если прорыть водоотводную штольню к долине внизу, но эта штольня сама по себе обойдётся в год работ, и бюджет на неё не рассчитан."
 mining_survey_events.37.a: "Оставим карьер. Затопленная выработка — всё равно что закрытая."
 mining_survey_events.37.historical_info: "Осушение карьеров было постоянной инженерной проблемой доиндустриальной добычи камня, и многие в остальном продуктивные выработки забрасывали, когда забой опускался ниже местного уровня грунтовых вод. Типичными решениями были дренажные галереи, прорубаемые горизонтально к низине (так называемые #italic штольни#! немецкой шахтёрской традиции), водяные колёса, приводившие в действие цепные насосы с черпаками, а начиная с XVII века — постепенное внедрение паровых насосных машин."
 mining_survey_events.38.title: "Блок раскалывается"
 mining_survey_events.38.desc: "#TOOLTIP:GOODS,marble,X #L Мрамор#!#! поначалу выглядел добротным в забое. Два дня спустя, когда первый огромный блок наконец отделили от скального основания и опустили на деревянные катки, он раскололся из-за невидимого изъяна, распавшись на шесть бесполезных кусков под тяжестью собственного спуска. Главный каменщик обходит забракованный блок, постукивает по нему молотком и произносит то, что бригада уже знает: мрамор в этой ложбине пронизан внутренними трещинами, которых не выявил ни один осмотр забоя."
 mining_survey_events.38.a: "Закроем забой. Треснутый мрамор годится разве что на щебень для дорог."
 mining_survey_events.38.historical_info: "Мраморные блоки для скульптуры и тонких архитектурных работ не должны были иметь внутренних изъянов, и обнаружение скрытых трещин (#italic peli#! на жаргоне итальянских камнетёсов) было вечным кошмаром ремесла. Опытные скульпторы лично посещали карьеры, чтобы осмотреть необработанные блоки до заказа, а в стоимость крупного скульптурного заказа входил щедрый запас на блоки, оказавшиеся с изъяном уже после доставки."
 mining_survey_events.39.title: "Страз вместо кристалла"
 mining_survey_events.39.desc: "Гравий, содержащий #TOOLTIP:GOODS,gems,X #L драгоценные камни#!#!, оказался необычайно богатым. Подозрительно богатым. Королевский гранильщик, доставленный из столицы под охраной, осматривает добычу под яркой лампой, взвешивает каждый камень на ладони, чертит одним по осколку корунда и выносит неизбежный вердикт: большая часть находок — страз, свинцовое стекло, искусно огранённое и состаренное, чтобы выглядеть как необработанный кристалл. Кто-то подсолил русло ручья. Бригадир сегодня утром подозрительно отсутствует в лагере."
 mining_survey_events.39.a: "Сворачиваемся. Вся эта разведка оказалась мошеннической уловкой."
 mining_survey_events.39.historical_info: "«Подсаливание» — подкладывание настоящей руды или обработанных самоцветов на разведочном участке с целью привлечения инвестиций — древней формой профессионального мошенничества на горнодобывающих территориях. Бригадир, подсаливавший собственные выработки, местный проводник, рассыпавший несколько спрятанных образцов вдоль выбранного русла, и отсутствующий организатор, устроивший тщательно подстроенную находку, были неизменными фигурами в истории европейской и американской горной добычи. Нечестный пробирщик, подтверждавший подделку, довершал привычную схему."
 mining_survey_events.40.title: "Ртутное безумие"
 mining_survey_events.40.desc: "На #TOOLTIP:GOODS,mercury,X #L ртутных#!#! приисках добывают металл. А ещё там производят безумцев. Рабочие у реторты стали неудержимо дрожать; ученик, которому поручили помешивать сконденсированную ртуть, потерял зубы и способность двигать двумя пальцами правой руки; а главный металлург, лучше всех знавший риски, впал в раздражительную рассеянность, которую лагерный врач называет #italic безумием шляпника#! и объявляет неизлечимой. Ртуть ждёт, чтобы её добыли. Но вот людей, чтобы её добыть, больше нет."
 mining_survey_events.40.a: "Закроем выработки. Никакой металл не стоит таких жертв."
 mining_survey_events.40.historical_info: "Отравление ртутью, проявлявшееся тремором, потерей зубов и прогрессирующим психическим расстройством, было хорошо известной профессиональной болезнью добытчиков киновари, работников реторт и амальгаматоров серебра. Рудник Альмаден в Кастилии, главный европейский источник ртути, именно по этой причине частично разрабатывался трудом каторжников. Английское выражение #italic «безумен, как шляпник»#! сохранило память об этом ремесле: шляпники, делавшие фетровые шляпы, отравлялись ртутью, применявшейся в их деле."
 mining_survey_events.41.title: "Солёный источник иссякает"
 mining_survey_events.41.desc: "Поиски #TOOLTIP:GOODS,salt,X #L соли#!#! начались многообещающе. Солёный источник бил сильно, солевары производили белую соль высшего качества, а торговцы уже вели переговоры о долгосрочных контрактах. Затем, после засушливого лета и необычно холодной зимы, источник ослаб до струйки и наконец иссяк. Геолог, посланный разобраться, докладывает, что подземный источник был ограниченным карманом запертого рассола, а не возобновляемым потоком, и что месторождение, по сути, исчерпано."
 mining_survey_events.41.a: "Отступим. Пересохший источник — конец солеваренного промысла."
 mining_survey_events.41.historical_info: "Солёные источники и залежи каменной соли имели совершенно разный геологический характер и экономические перспективы. Некоторые источники рассола, например в Галле в Саксонии или Сален-ле-Бене в Юре, били веками и содержали значительные города; другие были, по сути, ископаемыми карманами, истощавшимися за поколение интенсивной разработки. Каменная соль, добывавшаяся в таких местах, как Величка и Кардона, была более надёжным, но и более капиталоёмким ресурсом."
 mining_survey_events.42.title: "Сланцы бесплодны"
 mining_survey_events.42.desc: "Выход сланцев на поверхность выглядел многообещающе: порода выветривалась в соль, которая в пробе получалась чистой и белой. Но под покровом сланцы бесплодны: плотные, тёмные и совершенно лишённые пиритовых жил, содержащих #TOOLTIP:GOODS,alum,X #L квасцы#!#!, которые обещали поверхностные образцы. Химик пробует кислотное выщелачивание, затем обжиг, затем долгое выветривание на отвале, но практически ничего не получает. Рабочие, привезённые с немалыми затратами из текстильных городов, простаивают, пока инженер перебирает один способ за другим."
 mining_survey_events.42.a: "Закроем производство. Химия не даст здесь квасцов."
 mining_survey_events.42.historical_info: "Производство квасцов из пиритовых сланцев требовало строго определённого минерального состава: железного колчедана, дающего сульфат-ион, глинозёмистого сланца, дающего алюминий, и долгого процесса выветривания, чтобы свести их вместе в растворе. Образцы с поверхности могли легко ввести в заблуждение, поскольку обнажение находилось там, где естественное выветривание уже сделало свою работу; подземные породы же зачастую оказывались пустыми. Йоркширские квасцовые прииски на побережье Северного моря десятилетиями и ценой больших затрат работали на сланцах, которые в итоге так ничего и не дали."
 mining_survey_events.43.title: "Почва ничего не даёт"
 mining_survey_events.43.desc: "В почве долины, как предполагалось, должно быть много #TOOLTIP:GOODS,saltpeter,X #L селитры#!#!. Местные земледельцы говорили, что их деды каждую весну собирали белый налёт со скал. К настоящему моменту рудоискатели провели раскопки, выщелачивание и выпаривание почвы в дюжине мест вдоль дна долины, но практически ничего ценного не обнаружили. Мастер по пороху, которому показали скудные находки, предполагает, что старые залежи селитры могли быть выработаны самими земледельцами, чьи деды и рассказывали эти истории. Теперь в долине не осталось селитры."
 mining_survey_events.43.a: "Оставим долину. Почва мертва: селитры здесь нет."
 mining_survey_events.43.historical_info: "Селитроносные почвы не были бесконечными. Естественный процесс образования селитры во влажной унавоженной земле занимал годы, и интенсивная добыча быстро его истощала. Поэтому традиция немецких #italic селитроваров#! включала систематическое создание искусственных #italic селитряных плантаций#!, где навоз, известь и золу складывали в кучи и годами за ними ухаживали, чтобы получать устойчивый выход селитры. Переход от поиска селитры к её изготовлению стал важным шагом в рационализации доиндустриального производства пороха."
