l_russian:
 expedition_succession_events.new_leader_tt: "[target_leader.GetName] принимает командование экспедицией"
 expedition_succession_events.morale_down_tt: "The crew's spirits suffer at the loss of their leader (#R -20#! Crew Morale)"
 expedition_succession_events.1.title: "Новая рука у карт"
 expedition_succession_events.1.desc: "В [ROOT.GetCountry.GetCapital.GetName] приходит весть, что предводитель экспедиции скончался. К счастью, среди офицеров, оставшихся на борту, есть человек, обладающий достаточной образованностью и выдержкой, чтобы читать карту и удерживать команду в порядке, и остальные с потери признали его старшинство.\n\nКоманда утверждает его в командовании, и экспедиция продолжает путь под его руководством."
 expedition_succession_events.1.a: "Быть по сему. Плавание продолжается."
 expedition_succession_events.2.title: "Новый капитан-генерал"
 expedition_succession_events.2.desc: "В [ROOT.GetCountry.GetCapital.GetName] приходит весть, что адмирал флота скончался. Флот не может плыть по этим водам без предводителя, но, к счастью, один из офицеров достаточно старший и способный, чтобы остальные приняли его слово как закон, и он уже занял капитанский мостик.\n\nОфицеры утверждают его новым командующим флота, и плавание продолжается под его началом."
 expedition_succession_events.2.a: "Быть по сему. Флот идёт дальше."
 expedition_succession_events.generic_new_leader_tt: "[target.GetName] takes command of the expedition"
 expedition_succession_events.3.title: "Command Passes On"
 expedition_succession_events.3.desc: "Донесение, доставленное домой последней возвращающейся лодкой, сообщает, что [former_leader.GetName], возглавлявший экспедицию, погиб в пути. Отряд не стал ждать распоряжений; к тому времени, как письмо было запечатано, выжившие уже решили этот вопрос между собой, как обычно поступают люди, далёкие от какого-либо двора.\n\n[target.GetName] принял командование, и экспедиция продолжает путь."
 expedition_succession_events.3.a: "The work is bigger than any one man."
