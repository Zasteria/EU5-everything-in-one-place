l_russian:
 expedition_succession_events.new_leader_tt: "[target_leader.GetName] возглавляет экспедицию"
 expedition_succession_events.morale_down_tt: "Настроение экипажа ухудшается из-за гибели капитана (#R −20#! к боевому духу)"
 expedition_succession_events.1.title: "Новый командир экспедиции"
 expedition_succession_events.1.desc: "[ROOT.GetCountry.GetCapital.GetName] [Select_CString(ROOT.GetCountry.GetCapital.IsFemale, 'получила', 'получил')] донесение о том, что командир экспедиции скончался. К счастью, среди офицеров на борту есть человек, чьих знаний и отваги достаточно, чтобы читать морские карты и поддерживать дисциплину среди экипажа. После смерти прежнего командира экспедиции остальные уже признали его негласным руководителем путешествия.\n\nЭкипаж официально передаёт ему командование, и экспедиция продолжает свой путь под его началом."
 expedition_succession_events.1.a: "Быть посему. Плавание продолжается."
 expedition_succession_events.2.title: "Новый командующий флотом"
 expedition_succession_events.2.desc: "[ROOT.GetCountry.GetCapital.GetName] [Select_CString(ROOT.GetCountry.GetCapital.IsFemale, 'получила', 'получил')] донесение о том, что адмирал флота скончался. А без него флот не может продолжать плавание в этих водах. Однако, к счастью, среди командного состава нашёлся один достаточно опытный и способный офицер, которому остальные беспрекословно подчиняются. Он уже занял место на квартердеке.\n\nОфицеры признают его новым командующим флотом, и плавание продолжается под его руководством."
 expedition_succession_events.2.a: "Быть посему. Флот держит курс дальше."
 expedition_succession_events.generic_new_leader_tt: "[target.GetName] возглавля[target.Custom('end_etyut')] экспедицию"
 expedition_succession_events.3.title: "Передача командования"
 expedition_succession_events.3.desc: "Последняя лодка, вернувшаяся домой, привезла депешу с известием о том, что [former_leader.GetName], [Select_CString(former_leader.IsFemale, 'руководившая', 'руководивший')] экспедицией, [Select_CString(former_leader.IsFemale, 'погибла', 'погиб')] во время путешествия. Экипаж не стал ждать дальнейших указаний. Оставшиеся в живых сами решили, кому принять командование, ещё до того, как сургуч оказался на письме. Такое нередко случается с людьми, оказавшимися вдали от двора.\n\n[target.GetName] принимает командование, а экспедиция продолжает путь."
 expedition_succession_events.3.a: "Эта миссия важнее отдельно взятого человека."
