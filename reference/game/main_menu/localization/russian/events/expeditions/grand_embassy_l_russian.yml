l_russian:
 grand_embassy.1.title: "Подготовка Великого посольства"
 grand_embassy.1.desc: "Прежде чем посольство отправится в путь, необходимо определить его состав. Правитель, окружённый почётом на банкетах и охраной в своих покоях, увидит лишь то, что принимающая сторона захочет ему показать. Мастерские, сухие доки и учебные плацы почётным гостям не покажут. [figurehead.GetName] станет официальным представителем посольства, а [target_ruler.GetName] будет передвигаться среди свиты, не привлекая к себе внимания. На что мы готовы пойти ради сохранения этой тайны?"
 grand_embassy.1.a: "Подготовьте обычное посольство."
 grand_embassy.1.a.tt: "Обычные приготовления, обычная секретность (Скрытность: 55)"
 grand_embassy.1.b: "Сделайте всё возможное, чтобы сохранить всё в тайне."
 grand_embassy.1.b.tt: "Особые меры обеспечивают полную анонимность (Скрытность: 75)"
 grand_embassy.1.c: "Отправьте подставные посольства."
 grand_embassy.1.c.tt: "Подставные посольства помогают спутать следы (Скрытность: 95)"
 grand_embassy.2.title: "Город [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] принимает Великое посольство"
 grand_embassy.2.desc.port: "Посольство прибыло в [embassy_country.GetCapital.Custom('LR_ACC')|l] [embassy_country.GetCapital.GetName]. Главная цель визита — осмотреть сухие доки и арсеналы, где [embassy_country.GetName] строит флот, благодаря которому сохраняет своё превосходство на море. От того, какое впечатление мы произведём при [embassy_country.GetAdjective|l]ом дворе зависит, что именно нам покажут."
 grand_embassy.2.desc.inland: "Посольство прибыло в [embassy_country.GetCapital.Custom('LR_ACC')|l] [embassy_country.GetCapital.GetName]. Главная цель визита — осмотреть мастерские и учебные плацы, где ремесленники и инструкторы #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! уже добились коренных перемен в торговле и военном деле своей державы. От того, какое впечатление мы произведём при [embassy_country.GetAdjective|l]ом дворе зависит, что именно нам покажут."
 grand_embassy.2.a: "Пусть от лица посольства выступает [figurehead.GetShortNameWithNoTooltip], а [target_ruler.GetShortNameWithNoTooltip] останется среди свиты."
 grand_embassy.2.a_no_figurehead: "Пусть [target_ruler.GetShortNameWithNoTooltip] остаётся среди свиты."
 grand_embassy.2.b: "[target_ruler.GetShortNameWithNoTooltip] будет [Select_CString(target_ruler.IsFemale, 'представлена', 'представлен')] в своём официальном качестве."
 grand_embassy.2.c: "Стоит держаться подальше от [embassy_country.GetAdjective|l]ого двора. Мы прибыли сюда не для того, чтобы привлекать к себе внимание."
 grand_embassy.3.title: "Великое посольство в городе [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.3.desc.unaware: "Посольство #ONCLICK:COUNTRY,[from.GetKey] #TOOLTIP:COUNTRY,[from.GetKey],X [from.Custom('CL_GEN')|L]#!#! прибыло к [ROOT.GetCountry.GetAdjective|l]ому двору. По собственным словам, они всего лишь обычные путешественники, желающие ознакомиться с тем, как устроены дела в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Позволим ли мы им заглянуть в наши мастерские и учреждения или предпочтём поскорее от них избавиться?"
 grand_embassy.3.desc.aware: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] имеет на службе людей, которым удалось незаметно выяснить, кто на самом деле входит в состав этого посольства. Если [target_ruler.GetName] будет [Select_CString(target_ruler.IsFemale, 'раскрыта', 'раскрыт')], это поставит обе стороны в затруднительное положение. Однако принять у себя правителя, который пожелал лично ознакомиться с выдающимися достижениями #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, пусть даже под видом обычного путешественника, — большая честь. Скрытность, выходит, может быть взаимовыгодной."
 grand_embassy.3.a: "Позвольте им осмотреть наши мастерские и учреждения."
 grand_embassy.3.b: "Наши чудеса достойны всеобщего восхищения."
 grand_embassy.3.c: "Незачем раскрывать наши секреты всяким иностранцам."
 grand_embassy.3.d: "Позвольте им осмотреть наши мастерские и учреждения, но без особой огласки."
 grand_embassy.3.e: "Столь почётные гости вправе беспрепятственно ознакомиться с нашими достижениями."
 grand_embassy.3.f: "[Select_CString(target_ruler.IsFemale, 'Уважаемая', 'Уважаемый')] [target_ruler.GetShortNameWithNoTooltip], мы вас узнали, и здесь вам не рады."
 grand_embassy.4.title: "Разрешение остаться"
 grand_embassy.4.desc: "После того как стало известно, кто прибыл вместе с посольством, [embassy_country.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! предлагает нам задержаться и осмотреть другие достопримечательности страны."
 grand_embassy.4.a: "Мы примем это приглашение с благодарностью."
 grand_embassy.4.b: "Обратитесь к принимающей стороне с просьбой ещё продлить наше пребывание."
 grand_embassy.6.title: "Затянувшийся визит принёс свои плоды"
 grand_embassy.6.desc: "[target_ruler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'задержалась', 'задержался')] в городе [embassy_country.GetCapital.GetName], чтобы лично изучить #L [embassy_country.GetAdjective|l]ие#! технологические новшества. Это время было потрачено совсем не зря."
 grand_embassy.6.a: "Это пойдёт на пользу нашим государственным институтам!"
 grand_embassy.6.b: "Это пойдёт на пользу нашим вооружённым силам!"
 grand_embassy.7.title: "Успех Великого посольства"
 grand_embassy.7.desc: "Визит в город [embassy_country.GetCapital.GetName] был чрезвычайно успешным, но теперь нам снова пора в путь. Куда мы направимся дальше?"
 grand_embassy.7.a: "Возвратиться домой."
 grand_embassy.7.b: "Держать путь в район [target_1.GetNameWithNoTooltip]."
 grand_embassy.7.c: "Вместо этого направиться в район [target_2.GetNameWithNoTooltip]."
 grand_embassy.7.d: "Выбрать следующей остановкой район [target_3.GetNameWithNoTooltip]."
 grand_embassy.7.e: "Посетить также район [target_4.GetNameWithNoTooltip]."
 grand_embassy.7.f: "Направить посольство в район [target_5.GetNameWithNoTooltip]."
 grand_embassy.5.title: "В просьбе остаться отказано"
 grand_embassy.5.desc: "Залогом быстрой модернизации #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! является изучение технологических новшеств #TOOLTIP:SUB_CONTINENT,western_europe,X #L Западной Европы#!#!. К несчастью, #L [embassy_country.GetAdjective|l]ие#! власти отказались пойти нам навстречу и позволить задержаться в городе [embassy_country.GetCapital.GetName] для изучения их достижений."
 grand_embassy.5.a: "Возвратиться домой."
 grand_embassy.5.b: "Постараемся извлечь пользу из визита в район [target_1.GetNameWithNoTooltip]."
 grand_embassy.5.c: "Поищем более радушного приёма в районе [target_2.GetNameWithNoTooltip]."
 grand_embassy.5.d: "Возможно, район [target_3.GetNameWithNoTooltip] окажется гостеприимнее"
 grand_embassy.5.e: "Лучше попытаем счастья в районе [target_4.GetNameWithNoTooltip]."
 grand_embassy.5.f: "Наконец, можно нанести визит в район [target_5.GetNameWithNoTooltip]."
 grand_embassy.discretion_down_5_tt: "Оставаться в тени становится всё сложнее (#R −5#! к скрытности)"
 grand_embassy.discretion_down_10_tt: "Двор начинает подозревать неладное (#R −10#! к скрытности)"
 grand_embassy.discretion_down_20_tt: "Излишняя благосклонность привлекает ненужное внимание (#R −20#! к скрытности)"
 grand_embassy.discretion_down_30_tt: "Наше прикрытие раскрыто (#R −30#! к скрытности)"
 grand_embassy.discretion_up_10_tt: "Нам удалось остаться незамеченными (#G +10#! к скрытности)"
 grand_embassy.discretion_set_0_tt: "Больше нет смысла притворяться (Скрытность: 0)"
 grand_embassy.modernization_up_0to10_tt: "Лучше перенимать опыт, оставаясь в тени (#G от +0 до +10#! к модернизации)"
 grand_embassy.opportunities_set_1_tt: "Посторонним многого не показывают (Возможности: 1)"
 grand_embassy.opportunities_set_2_tt: "Некоторые двери открыты даже для посторонних (Возможности: 2)"
 grand_embassy.opportunities_set_3_tt: "Перед нами открыты любые двери (Возможности: 3)"
 grand_embassy.opportunities_set_4_tt: "Нам дали полный доступ (Возможности: 4)"
 grand_embassy.opportunities_up_1_tt: "Приглашение открывает ещё одну дверь (#G +1#! к возможностям)"
 grand_embassy.opportunities_up_2_tt: "Настойчивость, сколь бы унизительной она ни была, открывает ещё две двери (#G +2#! к возможностям)"
 grand_embassy.opportunities_down_1_tt: "День потрачен впустую (#R −1#! к возможностям)"
 received_grand_embassy: "Великое посольство принято"
 rejected_grand_embassy: "Великое посольство отправлено восвояси"
 humiliated_grand_embassy: "Унижение Великого посольства"
 grand_embassy.8.title: "Неприятности на родине"
 grand_embassy.8.desc: "Посольство получило тревожные вести о беспорядках на родине. Пока [target_ruler.GetName] пребывает за границей, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] желают знать, где находится [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]. Если прервать путешествие сейчас, мы вернёмся ни с чем. Если же планы не менять, стране придётся ещё какое-то время обходиться без [Select_CString(target_ruler.IsFemale, 'правительницы', 'правителя')]."
 grand_embassy.8.a: "Нам нужно немедленно возвращаться домой."
 grand_embassy.8.b: "Знания, которые ещё можно получить, оправдывают любые издержки."
 grand_embassy.modernization_up_5_tt: "Мы многому научились (#G +5#! к модернизации)"
 grand_embassy.modernization_up_15_tt: "Урок усвоен в полной мере (#G +15#! к модернизации)"
 grand_embassy.discretion_up_20_tt: "Золото делает людей на удивление забывчивыми (#G +20#! к скрытности)"
 grand_embassy.9.title: "Контора"
 grand_embassy.9.desc: "Находясь [embassy_country.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_PREP')|L]#!#!, мы встретили казначея. Он знакомит нас с учётными книгами и налоговыми реестрами, на которых держится вся работа казначейства. Его испачканные чернилами пальцы уверенно скользят по колонкам цифр, а итоговые суммы неизменно сходятся. Каждая сумма вносится в книги дважды: как долг и как уплата долга, так что ни одна монета не остаётся неучтённой. Кроме того, к концу недели цифры дополнительно сверяют с документами о грузе, прибывшем в порт. За определённую плату и при должном терпении можно узнать много нового и проследить весь процесс от начала до конца."
 grand_embassy.9.a: "Стоит взять этот метод на заметку."
 grand_embassy.9.b: "Заплатите им за возможность ознакомиться с реестрами целиком."
 grand_embassy.9.c: "Заплатите им за возможность ознакомиться со всеми учётными книгами и останьтесь досконально освоить систему учёта."
 grand_embassy.10.title: "Составители альманахов"
 grand_embassy.10.desc: "В [embassy_country.GetCapital.Custom('LR_PREP')|l] [embassy_country.GetCapital.GetName] действует общество писцов, которое ведёт учёт буквально всего: рождений, урожаев, кораблей в порту и даже еженедельных изменений цен на хлеб. Все полки их контор заставлены учётными книгами. Каждая запись датирована и сопоставляется с предыдущими, благодаря чему цифры начинают рассказывать историю, которую не смог бы изложить ни один летописец. По утверждению составителей, их альманахи отражают положение дел в стране точнее любой хроники и позволяют предсказывать голод и изобилие, выявляя скрытые закономерности. За определённую плату они готовы рассказать о своих методах любому, кто достаточно усидчив, чтобы разобраться в вычислениях."
 grand_embassy.10.a: "Стоит взять их методы на заметку."
 grand_embassy.10.b: "Заплатите им за возможность подробно ознакомиться с их ремеслом."
 grand_embassy.10.c: "Заплатите им за возможность ознакомиться со всеми методами и останьтесь досконально их освоить."
 grand_embassy.11.title: "Придворные нравы и мода"
 grand_embassy.11.desc: "Крой камзола, форма парика, глубина поклона — придворные #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! изучают эти тонкости столь же тщательно, как условия договоров. Неподходящая длина подола может испортить репутацию, на восстановление которой потребуются годы. Каждая складка одежды и каждое перо что-то означают, но непосвящённым этого не разгадать. Посольство, не соблюдающее придворную моду, при дворе попросту не замечают. Один из придворных готов втайне рассказать нам, что здесь носят и почему, а также кому следует кланяться первым и насколько глубоким должен быть поклон."
 grand_embassy.11.a: "Смотрим и запоминаем."
 grand_embassy.11.b: "Заплатите придворному за некоторые разъяснения местных нравов и моды."
 grand_embassy.11.c: "Заплатите придворному за подробное разъяснение местных нравов и моды и останьтесь досконально их изучить."
 grand_embassy.12.title: "Кружок идей"
 grand_embassy.12.desc: "В одном из особняков близ дворца почти каждый вечер собираются купцы, учёные и скучающие дворяне, чтобы за чашкой кофе обсудить темы, которые прежде не принято было обсуждать открыто: налоги, религию и допустимые пределы власти монарха. Беседы длятся до поздней ночи, а голоса становятся всё громче по мере того, как свечи догорают. Присутствие незнакомцев никого не тревожит, если те могут достойно поддержать разговор. Даже посторонний может получить приглашение на такую встречу. Главное, чтобы кофе был хорош, а его суждения отличались смелостью."
 grand_embassy.12.a: "Просто посидим в сторонке и молча послушаем."
 grand_embassy.12.b: "Заплатите за приглашение на встречу."
 grand_embassy.12.c: "Заплатите за полноправное участие в кружке и останьтесь в совершенстве освоить искусство ведения подобных дискуссий."
 grand_embassy.13.title: "Литейный цех"
 grand_embassy.13.desc: "В литейных цехах #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! пушки отливают способом, за секрет которого наши оружейники дорого бы заплатили: от состава сплава и конструкции формы до определения времени остывания. От печей волнами поднимается жар, но мастера работают с расплавленным металлом с невозмутимостью, в которой читается не просто сноровка, а привычка, выработанная годами. Начальник цеха, взмокший от жара и не скрывающий гордости за результаты своего труда, готов за вознаграждение поделиться кое-какими секретами. Особенно ему по душе те, кто не просто слушает, а понимает, что происходит у них перед глазами."
 grand_embassy.13.a: "Ну, что ж, посмотрим, как они отливают пушки."
 grand_embassy.13.b: "Заплатите начальнику цеха за секреты его ремесла."
 grand_embassy.13.c: "Заплатите начальнику цеха за подробный рассказ о способе литья металла и останьтесь досконально его изучить."
 grand_embassy.14.title: "Учебный плац"
 grand_embassy.14.desc: "На учебном плацу близ [embassy_country.GetCapital.Custom('LR_GEN')|l] [embassy_country.GetCapital.GetName], роты с великолепной слаженностью меняют построение и перезаряжают мушкеты. Наше ополчение вряд ли смогло бы поспеть за этими бравыми солдатам. Сапоги отбивают шаги по утрамбованной земле, ни на мгновение не сбиваясь с ритма. Офицеры выкрикивают приказы, а солдаты их исполняют, едва заслышав начало команды. Всё подразделение движется как единое целое, а не как толпа ряженных ополченцев. Польщённый нашим вниманием, сержант-инструктор предлагает подробно ознакомить нас со всеми этапами боевой подготовки — от первой команды до последнего залпа."
 grand_embassy.14.a: "Мы просто понаблюдаем за строевой подготовкой."
 grand_embassy.14.b: "Заплатите сержанту за более подробную демонстрацию."
 grand_embassy.14.c: "Щедро заплатите сержанту и останьтесь досконально изучить основы строевой подготовки."
 grand_embassy.15.title: "Слово в нужное ухо"
 grand_embassy.15.desc: "Камергер, отвечающий за организацию наших аудиенций, осторожно даёт понять, что подарок нужному человеку может открыть немало дверей. А отдельные имена удивительным образом исчезают из определённых списков, стоит лишь посулить звонкую монету. При этом он говорит об этом как бы невзначай, примерно как о погоде, и смотрит, уловили ли мы намёк. При дворе это обычное дело, хотя плата обычно тем выше, чем настойчивее просьба."
 grand_embassy.15.a: "Преподнесите подобающий подарок."
 grand_embassy.15.b: "Преподнесите существенно более щедрый подарок."
 grand_embassy.16.title: "Осторожный посредник"
 grand_embassy.16.desc: "Посредник, промышляющий тем, что помогает иностранцам решать разнообразные вопросы в пути, предлагает нам свои услуги, утверждая, что у него есть связи на всех караульных постах и таможнях вплоть до самой границы. Говорит он осторожно, намёками и недомолвками — никогда не уточняет, кто перед ним в долгу, но ясно даёт понять, что таких людей немало. За определённую плату он позаботится о том, чтобы посольство не донимали лишними вопросами о том, куда она направляется и зачем, а в случае настойчивых расспросов — чтобы ответы были достаточно уклончивыми."
 grand_embassy.16.a: "Наймите посредника."
 grand_embassy.16.b: "Наймите посредника и дополнительно заплатите ему за молчание."
 grand_embassy.17.title: "Длинный язык"
 grand_embassy.17.desc: "Один из членов нашей свиты, изрядно напившись в трактире и пытаясь покрасоваться перед незнакомцами, сболтнул лишнего о том, кто в действительности возглавляет наше посольство. Наутро он даже не смог вспомнить, кому и что он говорил, а вот трактирщик ничего не забыл, как и те, кто выпивал за соседним столом. Слух уже гуляет среди слуг, и они пересказывают его с тем особым удовольствием, с каким разбалтывают самые пикантные секреты."
 grand_embassy.17.a: "Теперь уже ничего не поделать."
 grand_embassy.17.b: "Заплатите нужным людям, чтобы замять этот слух."
 grand_embassy.18.title: "Неожиданная встреча со старым знакомым"
 grand_embassy.18.desc: "На одной из улиц посольство сталкивается с купцом, который давным-давно, в более благоприятные времена, торговал [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Завидев нас, он на мгновение застывает и пристально всматривается в лицо главы нашего посольства, а затем поспешно удаляется, не сказав ни слова. Ошибиться невозможно, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'раскрыта', 'раскрыт')], поскольку на лице купца отразилось не простое любопытство, а внезапное изумление человека, узнавшего кого-то, кого не ожидал встретить. А он точно знает, кого встретил, и мы вряд ли сможем повлиять на то, решит ли он сохранить это в тайне."
 grand_embassy.18.a: "Остаётся лишь надеяться на то, что он будет помалкивать."
 grand_embassy.18.b: "Разыщите его и заплатите ему за молчание."
 grand_embassy.19.title: "Любопытный хозяин постоялого двора"
 grand_embassy.19.desc: "Хозяин постоялого двора, где остановилось посольство, задаёт слишком много вопросов и каждый произносит с нарочитой непринуждённостью человека, подозревающего, что ответы имеют значение. Например, почему столь богатая свита держится так скромно? Почему путешественники никогда не пересчитывают деньги? Отчего никто из наших людей не смотрит ему в глаза, когда речь заходит о цели поездки? Пока он нас ни в чём не подозревает, просто любопытствует, обдумывая каждую странность в наших словах и поведении, словно человек, который вертит в руках монету, проверяя, не обрезаны ли у неё края. Впрочем, это ненадолго."
 grand_embassy.19.a: "Не вдавайтесь в подробности."
 grand_embassy.19.b: "Щедро заплатите ему, чтобы он перестал совать свой нос в чужие дела."
 grand_embassy.20.title: "Перехваченное письмо"
 grand_embassy.20.desc: "Письмо, отправленное на родину, в котором недвусмысленно [Select_CString(target_ruler.IsFemale, 'упоминалась', 'упоминался')] [target_ruler.GetName] и подробнее, чем стоило бы раскрывалась истинная цель посольства, пропало где-то по пути между курьером и кораблём. Не последовало ни требования выкупа, ни обвинений, ни малейшего намёка на то, куда оно могло деться, а это тревожит куда сильнее, чем если бы на нас вышел похититель. Мы не знаем, у кого оказалось наше письмо, кто успел его прочесть и как собирается с ним поступить, узнав его содержание."
 grand_embassy.20.a: "Письмо не вернуть."
 grand_embassy.20.b: "Щедро оплатите розыски письма, а как найдёте, сожгите его."
 grand_embassy.21.title: "Пир в нашу честь"
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] устраивает пир в честь посольства, на котором тостам, похвалам и речам, кажется, не будет конца, и всё мероприятие затянется на целый день. Каждое следующее блюдо изысканнее предыдущего, словно повара на кухне соревнуются друг с другом. Каждое блюдо следует похвалить, на каждый тост — ответить, а каждого словоохотливого вельможу — выслушать до конца, даже если в его речи нет ничего стоящего. Отклонить приглашение было бы оскорблением, а присутствовать на пиру значит провести весь день за церемониями и угощениями."
 grand_embassy.21.a: "Мы останемся до конца торжества."
 grand_embassy.21.b: "Нужно незаметно ускользнуть и заняться чем-нибудь более полезным."
 grand_embassy.22.title: "Назначение сопровождающего"
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle] решает выделить нам сопровождающего, который будет следить за каждым шагом нашего посольства. Человек он любезный, неутомимый и полный решимости показывать нам исключительно сады и галереи, несмотря на все наши вежливые просьбы. На всё-то у него готов ответ, а на любое неловкое молчание припасена тема для отвлечения разговора, чтобы свести всё обратно к фонтанам, да фрескам, стоит нам оказаться неподалёку от чего-то действительно стоящего. Мастерские нам не посетить, как бы мы его ни упрашивали."
 grand_embassy.22.a: "Что ж, пойдём туда, куда он указывает."
 grand_embassy.22.b: "Можно напомнить ему о нашем высоком положении, чтобы он показал нам что-нибудь помимо садов и галерей."
 grand_embassy.23.title: "Затянувшаяся аудиенция"
 grand_embassy.23.desc: "Аудиенция у какого-то совершенно незначительного чиновника тянется уже не первый час: комплименты сказаны, благодарности за вручённые подарки принесены, а беседа идёт по кругу — обмен всё теми же любезностями, только обёрнутыми в другие выражения, и так до бесконечности, пока они окончательно не теряют всякий смысл. Похоже, он совершенно никуда не спешит, а напротив, наслаждается вниманием иностранных гостей, которое его интересует куда больше, чем предмет разговора. К моменту, когда аудиенция завершается, день уже безвозвратно упущен для чего-либо действительно полезного."
 grand_embassy.23.a: "Чтобы это вынести, нам понадобится вся наша учтивость."
 grand_embassy.23.b: "Необходимо сократить время аудиенции, невзирая на положение чиновника."
 grand_embassy.24.title: "Сговорчивый распорядитель"
 grand_embassy.24.desc: "Распорядитель, в обязанности которого входит ведение записей о делах хозяйства, намекает с осторожностью человека, не впервые предлагающего подобную услугу, что за подходящую плату он может «потерять» некоторые имена. Он не просит об этом напрямую, вместо этого вопрос повисает в тишине, пока он с терпением бывалого пройдохи ждёт, что мы уловим намёк и заполним возникшую неловкую паузу в разговоре."
 grand_embassy.24.a: "Заплатите распорядителю, чтобы он опустил некоторые имена в своих записях."
 grand_embassy.24.b: "Заплатите распорядителю, чтобы он избавился от записей."
 grand_embassy.25.title: "Отвлекающие пересуды"
 grand_embassy.25.desc: "Почти одновременно с нашим прибывает посольство от менее влиятельного двора. Её представители шумят и ведут себя бесцеремонно, а потому становятся куда более удобной темой для пересудов. Стоит лишь заплатить не в меру болтливым слугам, и все местные сплетники и сплетницы будут обсуждать чужих гостей — то, куда они ходят и чем занимаются. А нас, наконец-то, все оставят в покое."
 grand_embassy.25.a: "Раздайте по паре монет кому следует."
 grand_embassy.25.b: "Щедро заплатите нужным слугам."
 grand_embassy.26.title: "Незаметный проводник"
 grand_embassy.26.desc: "Местный проводник знает все улицы и двери, где можно укрыться от посторонних глаз, и часы, когда стража предпочитает не замечать происходящего. Он предлагает помочь посольству оставаться незамеченным при передвижениях. Причины подобных предосторожностей его не интересуют, он лишь хочет знать, сколько мы готовы за это заплатить."
 grand_embassy.26.a: "Наймите проводника."
 grand_embassy.26.b: "Наймите проводника и дополнительно заплатите за особые меры предосторожности."
