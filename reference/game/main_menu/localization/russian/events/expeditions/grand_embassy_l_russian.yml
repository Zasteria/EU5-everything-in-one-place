l_russian:
 grand_embassy.2.title: "Город [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] принимает Великое посольство"
 grand_embassy.2.desc: "A grand embassy has arrived from [from.GetName] led by [target_ruler.GetName] [target_ruler.GetHerselfHimself]. [target_ruler.GetSheHe|U] is touring [ShowSubContinentName('western_europe')] in order to secure better relations with its states — especially those who share common enemies. How should we greet [target_ruler.GetHerHim]?"
 grand_embassy.2.a: "Invite [target_ruler.GetHerHim] to stay."
 received_grand_embassy: "Великое посольство принято"
 grand_embassy.2.b: "Politely turn [target_ruler.GetHerHim] away."
 rejected_grand_embassy: "Великое посольство отправлено восвояси"
 grand_embassy.2.c: "Send [target_ruler.GetHerHim] packing!"
 grand_embassy.3.title: "Великое посольство в городе [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.3.desc: "Overwhelmed by our warm welcome, [target_ruler.GetName] has informed us that [target_ruler.GetSheHe] wishes to extend [target_ruler.GetHerHis] visit in [ROOT.GetCountry.GetCapital.GetName]. In [target_ruler.GetHerHis] quest to modernize the [from.GetLongName], [target_ruler.GetSheHe] is most eager to get a chance to study the technological advancements of [ShowSubContinentName('western_europe')]."
 grand_embassy.3.a: "Invite [target_ruler.GetHerHim] to stay and study our governmental institutions."
 grand_embassy.3.a.tt: "[target_ruler.GetName] многое узнает о наших государственных институтах"
 invited_to_study_institutions: "Приглашение изучить институты"
 grand_embassy.3.b: "Invite [target_ruler.GetHerHim] to stay and study our army."
 grand_embassy.3.b.tt: "[target_ruler.GetName] многое узнает об устройстве нашей армии"
 grand_embassy.3.c: "Invite [target_ruler.GetHerHim] to stay and study our navy."
 grand_embassy.3.c.tt: "[target_ruler.GetName] многое узнает об устройстве нашего флота"
 grand_embassy.3.d: "[target_ruler.GetSheHe|U] has overstayed [target_ruler.GetHerHis] welcome..."
 grand_embassy.4.title: "Разрешение остаться"
 grand_embassy.4.desc: "Hearing of [target_ruler.GetName]'s reforms to modernize the [ROOT.GetCountry.GetLongName], [embassy_country.GetName] has graciously invited us to extend our stay in [embassy_country.GetCapital.GetName] to take the opportunity to study their technological advancements."
 grand_embassy.4.a: "Let us stay and study [target_institution.GetNameWithNoTooltip]."
 grand_embassy.4.b: "Let us stay and study their army."
 grand_embassy.4.c: "Let us stay and study their navy."
 grand_embassy.4.d: "No, we have other countries to visit."
 grand_embassy.4.e: "The time has come to return home."
 grand_embassy.5.title: "В просьбе остаться отказано"
 grand_embassy.5.desc: "Залогом быстрой модернизации #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! является изучение технологических новшеств #TOOLTIP:SUB_CONTINENT,western_europe,X #L Западной Европы#!#!. К несчастью, #L [embassy_country.GetAdjective|l]ие#! власти отказались пойти нам навстречу и позволить задержаться в городе [embassy_country.GetCapital.GetName] для изучения их достижений."
 grand_embassy.5.a: "Very well, we have other countries to visit."
 grand_embassy.5.b: "The time has come to return home."
 grand_embassy.6.title: "Затянувшийся визит принёс свои плоды"
 grand_embassy.6.desc: "[target_ruler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'задержалась', 'задержался')] в городе [embassy_country.GetCapital.GetName], чтобы лично изучить #L [embassy_country.GetAdjective|l]ие#! технологические новшества. Это время было потрачено совсем не зря."
 grand_embassy.6.a: "Это пойдёт на пользу нашим государственным институтам!"
 grand_embassy.6.b: "Это пойдёт на пользу нашим вооружённым силам!"
 grand_embassy.6.c: "Это пойдёт на пользу нашему флоту!"
 grand_embassy.7.title: "Успех Великого посольства"
 grand_embassy.7.desc: "Визит в город [embassy_country.GetCapital.GetName] был чрезвычайно успешным, но теперь нам снова пора в путь. Куда мы направимся дальше?"
 grand_embassy.7.a: "We still have other countries to visit."
 grand_embassy.7.b: "The time has come to return home."
 grand_embassy.11.title: "The Embassy Has Been Turned Away"
 grand_embassy.11.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has refused to receive [target_ruler.GetName] and the delegation. No reason has been given that the chronicler considers worth recording. The embassy's standing is reduced by the rebuff; the embassy itself, however, is not yet at an end."
 grand_embassy.11.a: "Try our luck at another court."
 grand_embassy.12.title: "The Embassy Has Been Insulted"
 grand_embassy.12.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has not merely refused to receive [target_ruler.GetName] but has done so in terms that no chronicler will repeat in print. The casus belli is registered. Whether to press it now, or to continue the journey and address the matter later, is for the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to decide."
 grand_embassy.12.a: "There are other courts. Press on."
 grand_embassy.1.a: "Подготовить посольство как обычно."
 grand_embassy.1.a.tt: "Обычные приготовления, обычная скрытность (Осторожность: 55)"
 grand_embassy.1.b: "Приложить особые усилия ради сохранения тайны."
 grand_embassy.1.b.tt: "Дополнительная осторожность обеспечит настоящую анонимность (Осторожность: 75)"
 grand_embassy.1.c: "Отправить ложные посольства."
 grand_embassy.1.c.tt: "Обманные посольства запутают след (Осторожность: 95)"
 grand_embassy.1.desc: "Прежде чем посольство отправится в путь, нужно решить, каким оно будет. Правитель, которого водят по банкетам и охраняемым покоям, видит лишь то, что хозяева хотят показать; мастерские, сухие доки и плацы остаются закрытыми для почётных гостей. [figurehead.GetName] отправится как публичное лицо посольства, а [target_ruler.GetName] будет держаться среди свиты, не привлекая внимания. Насколько далеко нам стоит зайти, чтобы сохранить это в тайне?"
 grand_embassy.1.title: "Подготовка посольства"
 grand_embassy.10.a: "Отметить для себя их методы."
 grand_embassy.10.b: "Заплатить за полное изложение их ремесла."
 grand_embassy.10.c: "Оплатить полное исследование и остаться, чтобы освоить его в совершенстве."
 grand_embassy.10.desc: "Сообщество писцов в [embassy_country.GetCapital.GetName] взялось считать всё подряд: рождения, урожаи, суда в порту и даже цену на хлеб от недели к неделе. Их книги заполняют целые полки, каждый столбец датирован и сопоставлен с предыдущим, пока сами цифры не начинают рассказывать историю, которую не поведал бы ни один летописец. Их альманахи утверждают, что показывают государство точнее любой хроники, предсказывая голод и изобилие по закономерностям, которые замечают лишь они одни. За плату они готовы объяснить свои методы любому, кто достаточно терпелив, чтобы высидеть все вычисления."
 grand_embassy.10.title: "Составители альманахов"
 grand_embassy.11.b: "Заплатить придворному за более подробный урок."
 grand_embassy.11.c: "Оплатить полный урок и остаться, чтобы освоить его в совершенстве."
 grand_embassy.12.b: "Заплатить за вход в этот круг."
 grand_embassy.12.c: "Заплатить за полное участие в кругу и остаться, чтобы освоить его в совершенстве."
 grand_embassy.13.a: "Понаблюдать за отливкой."
 grand_embassy.13.b: "Заплатить мастеру литейного двора, чтобы он объяснил ремесло."
 grand_embassy.13.c: "Заплатить мастеру сполна и остаться, чтобы освоить ремесло в совершенстве."
 grand_embassy.13.desc: "В литейнях [embassy_country.GetName] пушки отливают способами, за знание которых наши оружейники дорого бы заплатили: состав сплава, форма формы для отливки, время остывания. Жар струится от жерл печей, и рабочие двигаются вокруг расплавленного металла со спокойствием, что говорит скорее о многолетней привычке, чем о простом мастерстве. Мастер литейного двора, весь в поту и явно гордый своим делом, готов рассказать больше — за плату, — и, похоже, нет ему большей радости, чем зритель, действительно понимающий, на что он смотрит."
 grand_embassy.13.title: "Литейный двор"
 grand_embassy.14.a: "Понаблюдать за учением."
 grand_embassy.14.b: "Заплатить сержанту, чтобы рассмотреть всё поближе."
 grand_embassy.14.c: "Заплатить сержанту целиком и остаться, чтобы освоить учение."
 grand_embassy.14.desc: "На плацу за пределами [embassy_country.GetCapital.GetName] роты перестраиваются и заряжают оружие в лад, быстрее, чем это удалось бы любому нашему ополчению, и сапоги бьют по утоптанной земле в ритме, который, кажется, никогда не сбивается. Офицеры выкрикивают команды, а строй отвечает на них прежде, чем слова успевают слететь с губ, и весь строй поворачивается как единое тело, а не как сотня отдельных людей. Сержант-инструктор, польщённый нашим вниманием, предлагает показать всё учение целиком, от первой команды до последнего залпа."
 grand_embassy.14.title: "Плац"
 grand_embassy.15.a: "Предложить обычный дар."
 grand_embassy.15.b: "Предложить значительно более щедрый дар."
 grand_embassy.15.desc: "Камергер, устраивающий наши приёмы, тихо даёт понять, что дар в нужные руки способен отворить немало дверей, а некоторые имена в некоторых списках имеют свойство ускользать из памяти, как только монета переходит из рук в руки. Он упоминает об этом почти вскользь, будто говорит о погоде, и ждёт, поймём ли мы намёк. Дело обычное, встречающееся при любом дворе, хотя цена, как правило, растёт по мере запроса."
 grand_embassy.15.title: "Слово в нужное ухо"
 grand_embassy.16.a: "Нанять посредника."
 grand_embassy.16.b: "Нанять посредника и вдобавок заплатить за его молчание."
 grand_embassy.16.desc: "Посредник, живущий тем, что облегчает путь иноземным гостям, предлагает свои услуги, утверждая, что имеет связи в каждой караульне и на каждой таможенной заставе отсюда и до границы. Он говорит осторожными полуфразами, никогда не называя прямо, кто ему обязан, но давая понять, что таковые есть. За плату он может позаботиться, чтобы о том, куда и почему направляется посольство, задавали поменьше вопросов, а ответы, если их всё же потребуют, выходили удовлетворительно неясными."
 grand_embassy.16.title: "Осторожный посредник"
 grand_embassy.17.a: "Теперь уже ничего не поделать."
 grand_embassy.17.b: "Заплатить, чтобы слух заглушили."
 grand_embassy.17.desc: "Один из нашей свиты, изрядно хлебнув в таверне и желая произвести впечатление на компанию незнакомцев, сболтнул куда больше, чем следовало, о том, кто на самом деле возглавляет это посольство. К утру он и сам не помнит своих слов, но трактирщик помнит, как и все, кто сидел за соседним столом. Слух уже расползается по челядным покоям, передаваемый с тем смаком, что приберегают для тайн, слишком заманчивых, чтобы держать их при себе."
 grand_embassy.17.title: "Длинный язык"
 grand_embassy.18.a: "Надеяться, что он будет держать язык за зубами."
 grand_embassy.18.b: "Найти его и заплатить за молчание."
 grand_embassy.18.desc: "Купец, некогда торговавший в [ROOT.GetCountry.GetName] — давно, при более счастливых обстоятельствах, — проходит мимо делегации на улице и вдруг замирает на полушаге, слишком долго вглядываясь в лицо [target_ruler.GetName], прежде чем поспешить дальше, не сказав ни слова. Ошибиться в выражении его лица невозможно: это не праздное любопытство, а внезапное, испуганное узнавание. Он прекрасно знает, кого увидел, и оставит ли он это знание при себе — уже не в нашей власти."
 grand_embassy.18.title: "Узнали на улице"
 grand_embassy.19.a: "Отвечать как можно меньше."
 grand_embassy.19.b: "Заплатить ему достаточно, чтобы он перестал спрашивать."
 grand_embassy.19.desc: "Трактирщик, у которого остановилась делегация, задаёт слишком много вопросов, и каждый из них произносится с нарочитой небрежностью человека, который уже подозревает, что ответы имеют значение: почему столь изысканная свита путешествует так скромно, почему монета всегда наготове и её никогда не пересчитывают дважды, почему никто из спутников не смотрит ему в глаза, когда его спрашивают о делах. Он пока не подозревает всерьёз, лишь любопытствует, вертя в уме эти мелкие странности, как человек вертит монету, проверяя, не обрезан ли край. Впрочем, долго это может не продлиться."
 grand_embassy.19.title: "Любопытный трактирщик"
 grand_embassy.2.a_no_figurehead: "Оставить [target_ruler.GetShortNameWithNoTooltip] среди свиты."
 grand_embassy.2.desc.inland: "Посольство прибыло в [embassy_country.GetCapital.GetName]. Мы приехали ради доступа: к мастерским и плацам, где ремесленники и учителя военного дела [embassy_country.GetName] уже преобразили её торговлю и армию. То, как мы представимся при дворе [embassy_country.GetGovernment.GetCourtTitle], решит, сколько из этого нам действительно покажут."
 grand_embassy.2.desc.port: "Посольство прибыло в [embassy_country.GetCapital.GetName]. Мы приехали ради доступа: к сухим докам и арсеналам, где [embassy_country.GetName] строит флот, сохраняющий за ней превосходство на море. То, как мы представимся при дворе [embassy_country.GetGovernment.GetCourtTitle], решит, сколько из этого нам действительно покажут."
 grand_embassy.20.a: "Вернуть его уже нельзя."
 grand_embassy.20.b: "Не жалея денег, найти его и сжечь."
 grand_embassy.20.desc: "Письмо, предназначенное для отправки домой, прямо называющее [target_ruler.GetName] и описывающее истинную цель делегации подробнее, чем позволяла бы всякая осторожность, пропало между курьером и кораблём. Ни требования выкупа, ни обвинения, ни малейшего намёка на то, куда оно исчезло, не последовало — и это, по-своему, тревожит даже сильнее, чем если бы что-то из этого случилось. Где оно оказалось, кто его прочёл и что намерены делать с узнанным — сказать мы не можем."
 grand_embassy.20.title: "Перехваченное письмо"
 grand_embassy.21.a: "Стерпеть и высидеть до конца."
 grand_embassy.21.b: "Улизнуть, чтобы заняться чем-то более полезным."
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] устроил пир в честь делегации — с тостами, дарами и речами, которых хватит на целый день, и каждое блюдо подаётся всё изысканнее прежнего, будто кухни соревнуются друг с другом. Каждое кушанье нужно похвалить, каждый тост поддержать ответным, а каждого многословного вельможу выслушать до конца, сколько бы пустых слов он ни говорил. Отказаться было бы оскорблением; остаться же — значит потерять весь день на церемонии и полные тарелки."
 grand_embassy.21.title: "Пир в нашу честь"
 grand_embassy.22.a: "Следовать туда, куда ведут."
 grand_embassy.22.b: "Настоять, как подобает гостям высокого ранга, на большем."
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle] назначил чиновника, который сопровождает делегацию на каждом шагу: любезный, неутомимый и твёрдо намеренный показать нам лишь сады да галереи, как бы вежливо мы ни просили о большем. У него готов ответ на любой вопрос и отвлечение наготове на любое молчание — стоит разговору хоть немного приблизиться к чему-то полезному, как он тут же сворачивает его обратно к фонтанам и фрескам. Мастерские остаются недосягаемыми, сколько бы способов мы ни перепробовали."
 grand_embassy.22.title: "Назначенный провожатый"
 grand_embassy.23.a: "Стерпеть это вежливо."
 grand_embassy.23.b: "Прервать аудиенцию, невзирая на чины."
 grand_embassy.23.desc: "Аудиенция у мелкого чиновника растягивается на часы: обмен любезностями, восхищение подарками, ни слова по существу — одни и те же вежливые фразы повторяются в чуть ином порядке, пока не теряют всякий смысл. Он, похоже, никуда не спешит, наслаждаясь вниманием иноземных гостей куда больше, чем содержанием того, о чём можно было бы говорить. К тому времени, когда всё наконец заканчивается, день для чего-то более полезного уже давно упущен."
 grand_embassy.23.title: "Долгая аудиенция"
 grand_embassy.24.a: "Заплатить управляющему за облегчённую запись."
 grand_embassy.24.b: "Заплатить управляющему, чтобы запись исчезла вовсе."
 grand_embassy.24.desc: "Управляющий, ведущий повседневные записи хозяйства, намекает — с осторожностью человека, которому не впервой, — что кое-какие имена вполне могут остаться незаписанными, за подобающее вознаграждение. Он не спрашивает прямо; он даёт молчанию говорить за себя и с привычным терпением ждёт, когда мы его нарушим."
 grand_embassy.24.title: "Сочувствующий управляющий"
 grand_embassy.25.a: "Раздать немного монет."
 grand_embassy.25.b: "Раздать щедрое количество монет."
 grand_embassy.25.desc: "Делегация соперников из менее значимого двора, прибывшая почти одновременно с нашей, притягивает куда больше пересудов — она шумна, бесцеремонна и вообще куда занятнее для разговоров. Немного монет, розданных нужным слугам, могли бы сохранить такое положение дел, направляя всякий праздный язык к их приходам и уходам, а не к нашим."
 grand_embassy.25.title: "Отвлекающий слух"
 grand_embassy.26.a: "Нанять проводника."
 grand_embassy.26.b: "Нанять проводника и заплатить сверху за дополнительную осторожность."
 grand_embassy.26.desc: "Местный проводник, знающий, какие улицы и двери избегают лишних глаз, а также в какие часы стража смотрит в другую сторону, предлагает провести делегацию туда и обратно незамеченной. Он не задаёт вопросов, зачем нужна такая осторожность — только о том, сколько это будет стоить."
 grand_embassy.26.title: "молчаливый провожатый"
 grand_embassy.3.desc.aware: "При дворе [ROOT.GetCountry.GetGovernment.GetCourtTitle] тихо выяснили, кто на самом деле сопровождает это посольство. Разоблачить [target_ruler.GetName] открыто было бы неловко для всех сторон, но принимать правителя, готового учиться у чудес [ROOT.GetCountry.GetName], пусть даже инкогнито, — немалая честь. Как видно, осторожность играет на руку обеим сторонам."
 grand_embassy.3.desc.unaware: "Посольство из [from.GetName] прибыло к [ROOT.GetCountry.GetGovernment.GetCourtTitle] — по их собственным словам, ничем не примечательные путники, желающие своими глазами увидеть, как всё устроено у [ROOT.GetCountry.GetName]. Впустить ли их в наши мастерские и учреждения, или отправить восвояси?"
 grand_embassy.3.e: "Гости столь высокого положения вправе беспрепятственно увидеть наши чудеса."
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip], мы знаем, кто ты, и тебе здесь не рады."
 grand_embassy.5.c: "Поискать более тёплый приём в [target_2.GetNameWithNoTooltip]."
 grand_embassy.5.d: "[target_3.GetNameWithNoTooltip] может оказаться более гостеприимным."
 grand_embassy.5.e: "Попытать удачи вместо этого в [target_4.GetNameWithNoTooltip]."
 grand_embassy.5.f: "Остаётся ещё нанести визит в [target_5.GetNameWithNoTooltip]."
 grand_embassy.7.c: "Направиться вместо этого в [target_2.GetNameWithNoTooltip]."
 grand_embassy.7.d: "Обратить взор на [target_3.GetNameWithNoTooltip]."
 grand_embassy.7.e: "Остаётся ещё посетить [target_4.GetNameWithNoTooltip]."
 grand_embassy.7.f: "Направить посольство в сторону [target_5.GetNameWithNoTooltip]."
 grand_embassy.8.a: "Мы должны немедленно вернуться домой."
 grand_embassy.8.b: "Уроки, которые ещё предстоит усвоить, стоят этой цены."
 grand_embassy.8.desc: "До посольства дошли вести о том, что дома начались неприятности. Пока [target_ruler.GetName] ещё за границей, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] желают знать, куда подевался их [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Прервать путешествие сейчас значит вернуться домой ни с чем. Продолжить путь значит ещё некоторое время править в отсутствие."
 grand_embassy.8.title: "Неприятности дома"
 grand_embassy.9.a: "Отметить для себя этот метод."
 grand_embassy.9.b: "Заплатить, чтобы изучить реестры полностью."
 grand_embassy.9.c: "Заплатить, чтобы увидеть все книги, и остаться, чтобы овладеть ими в совершенстве."
 grand_embassy.9.desc: "В [embassy_country.GetName] хранитель счётных книг знакомит нас с реестрами и налоговыми ведомостями, на которых держится казна. Испачканные чернилами пальцы без колебаний скользят по каждому столбцу, и итоговые суммы, кажется, никогда не лгут. Хранитель заносит каждую сумму дважды — сначала как причитающуюся, затем как уплаченную, — чтобы ни одна монета не ускользнула незамеченной, а к концу недели сверяет записи с портовыми манифестами. Тем, кто готов заплатить за время хранителя и достаточно терпелив, чтобы проследить метод до конца, есть чему ещё поучиться."
 grand_embassy.9.title: "Счётный дом"
