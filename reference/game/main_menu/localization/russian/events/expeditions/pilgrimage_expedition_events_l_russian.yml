 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.30.a: "Заплатить требуемый выкуп."
 pilgrimage_expedition_events.30.b: "Попытаться ускользнуть под покровом темноты."
 pilgrimage_expedition_events.30.title: "Захвачены ради выкупа"
