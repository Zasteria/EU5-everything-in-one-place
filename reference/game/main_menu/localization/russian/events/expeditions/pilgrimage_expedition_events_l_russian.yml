l_russian:
 pilgrimage_expedition_events.1.title: "Священный город [current_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.1.desc: "После долгих месяцев утомительного пути [target_ruler.GetName] наконец стоит перед стенами [current_location.GetName], города Распятия, города Воскресения, самой святой земли во всём христианском мире. Пыль тысяч паломников висит в воздухе, смешиваясь с ладаном, доносящимся из сотен часовен.\n\nВ самом сердце города возвышается храм Гроба Господня, воздвигнутый над самой скалой Голгофы. [target_ruler.GetSheHe|U] проделал долгий путь ради этого мгновения. Долгая дорога, стёртые в кровь ноги, бессонные ночи — всё это забывается, когда огромные врата распахиваются и запах священного елея и древнего камня устремляется навстречу [target_ruler.GetHimHer]."
 pilgrimage_expedition_events.1.a: "Пасть ниц перед Гробом Господним."
 pilgrimage_expedition_events.1.b: "Заказать часовню во имя [ROOT.GetCountry.GetNameWithNoTooltip]."
 pilgrimage_expedition_events.1.historical_info: "Паломники-христиане начали отправляться в Иерусалим с IV века, когда император Константин поручил построить церковь Гроба Господня на месте погребения и воскресения Христа. Во время крестовых походов город неоднократно переходил из рук в руки. В 1099 году его захватили участники Первого крестового похода. В 1187 году он стал добычей Саладина. В 1229 году, при Фридрихе II, Иерусалим ненадолго вернулся под контроль христиан, после чего окончательно перешёл под власть мамлюков. Несмотря на утрату христианского господства, святые места остаются доступными для паломников благодаря дипломатическим договоренностям. Так Иерусалим стал главным центром католического паломничества во всём средневековом мире."
 pilgrimage_expedition_events.2.title: "Вечный город"
 pilgrimage_expedition_events.2.desc: "[current_location.GetName] медленно поднимается над равниной, его купола и башни ловят предвечерний свет, когда свита [target_ruler.GetName] переходит последний мост через Тибр. [current_location.GetRank.GetName] обширен и древен, его улицы полны паломников со всех уголков христианского мира, каждого из которых влечёт одно и то же незримое течение.\n\nНа вершине Ватиканского холма возносится собор Святого Петра. Здесь престол наместника Христова, живой власти Церкви на земле. [target_ruler.GetNameWithNoTooltip] благоговеет, оказавшись в самом сердце [ShowReligionAdjective('catholic')] духовности."
 pilgrimage_expedition_events.2.a: "Смиренно признать божественную власть."
 pilgrimage_expedition_events.2.b: "Сделать пожертвование, достойное [ROOT.GetCountry.GetGovernment.Custom('CL_GEN')]."
 pilgrimage_expedition_events.2.c: "Мы воздали должное почтение. Наш народ нуждается в нашем возвращении."
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.2.historical_info: "Рим стал средоточием христианской власти с первых веков существования Церкви благодаря мученической кончине апостола Петра, чья гробница покоится под великой базиликой, носящей его имя. Папство обрело как духовную, так и мирскую власть, притягивая правителей и паломников со всей Европы, искавших отпущения грехов, законности своей власти и благословения преемника Петра. Юбилейные годы, начатые в 1300 году папой Бонифацием VIII, привлекли сотни тысяч паломников и закрепили за Римом место главной цели католического паломничества."
 pilgrimage_expedition_events.3.title: "Конец Камино"
 pilgrimage_expedition_events.3.desc: "Последние мили пути #italic Camino de Santiago#! — самые многолюдные. Со всех дорог и из всех долин потоки паломников стекаются к великому собору в [current_location.GetName], их посохи отполированы до блеска, а плащи покрыты пылью пятисот лиг пути. Некоторые плачут. Некоторые прошли босиком добрую сотню миль.\n\n[target_ruler.GetName] едет во главе [target_ruler.GetHerHis] свиты, но спешивается, когда вдали показываются башни собора. Кажется правильным пройти последний отрезок пешком. Мощный рёв паломнического гимна поднимается на ветру: #italic Ultreia! Ultreia!#! — и камни дороги, кажется, отзываются ему эхом."
 pilgrimage_expedition_events.3.a: "Возблагодарить у гробницы святого Иакова."
 pilgrimage_expedition_events.3.b: "Провозгласим это знаком того, что Господу угодно наше правление."
 pilgrimage_expedition_events.3.c: "Знаменательный день. Но нашими [ROOT.GetCountry.GetFlavorRank] всё равно нужно управлять."
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.3.historical_info: "Культ святого апостола Иакова в Сантьяго-де-Компостела зародился в IX веке, когда в Галисии были обнаружены мощи апостола Иакова, и король Астурии Альфонсо II заложил собор, чтобы их там хранить. Вскоре туда начали приходить паломники, и #italic Камино-де-Сантьяго#!, или путь Святого Иакова, стал наряду с Римом и Иерусалимом одним из трёх великих мест паломничества средневековых христиан. К XII веку вдоль дороги выросли многочисленные больницы, монастыри и церкви, по этому пути шли пилигримы со всех уголков Европы. Посещение Сантьяго давало паломнику право на получение свидетельства «Компостела» и полную индульгенцию."
 pilgrimage_expedition_events.4.title: "Рака Трёх Королей"
 pilgrimage_expedition_events.4.desc: "[current_location.GetName] — [current_location.GetRank.GetName] журавлей и строительных лесов. Великий собор строится уже почти два столетия, его недостроенные башни с каждым годом поднимаются всё выше к завершению, которое не наступит ещё многие поколения. И всё же, даже незавершённое, это здание безмерно величественно — говорят, самое большое в мире.\n\nВ южном трансепте, за алтарём, пылающим золотой фольгой и светом свечей, стоит рака Трёх Царей: золотой реликварий с костями волхвов, что следовали за звездой до самого Вифлеема. [target_ruler.GetName] слышала об этом с детства. Но ничто не могло по-настоящему подготовить [target_ruler.GetHimHer] к увиденному."
 pilgrimage_expedition_events.4.a: "Преклонить колени и почтить раку Трёх Волхвов."
 pilgrimage_expedition_events.4.b: "Сделать щедрое пожертвование на строительство собора."
 pilgrimage_expedition_events.4.c: "Помолимся, а затем отправимся в путь."
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.4.historical_info: "Рака Трёх Волхвов в Кёльне — крупнейший реликварий западного мира, где, как считается, покоятся кости библейских волхвов. Мощи были захвачены императором Священной Римской империи Фридрихом Барбароссой после завоевания Милана в 1164 году и переданы кёльнскому архиепископу Райнальду фон Дасселю. Их прибытие превратило Кёльн в один из важнейших центров паломничества в Северной Европе и стало толчком к строительству великого готического собора, начатому в 1248 году, — проекта, завершённого лишь в 1880 году. Связь волхвов с царской властью и Богоявлением делала их культ особенно значимым для светских правителей, искавших божественного одобрения."
 pilgrimage_expedition_events.5.title: "Собор Шартрской Богоматери"
 pilgrimage_expedition_events.5.desc: "Говорят, витражи [current_location.GetName] нельзя описать словами — их можно только увидеть. [target_ruler.GetName] стоит в нефе и понимает почему. Собор наполнен синим светом, светом, прошедшим сквозь тысячу цветных стёкол и превратившимся во что-то уже не вполне земное. Он падает на каменный пол переменчивыми пятнами, на лица коленопреклонённых паломников, на древнюю реликвию в золотом ковчеге за главным алтарём.\n\n#italic Sancta Camisa#!, покров Девы Марии, в котором она, по преданию, была облачена во время Благовещения, привлекает сюда верующих со времён Карла Великого. [target_ruler.GetNameWithNoTooltip] замирает и, неожиданно для себя, испытывает глубокое волнение."
 pilgrimage_expedition_events.5.a: "Почтить #italic Sancta Camisa#! и помолиться Богоматери."
 pilgrimage_expedition_events.5.b: "Красота этого места заслуживает созерцания."
 pilgrimage_expedition_events.5.c: "Красивый собор. Но нас ждут дома."
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.5.historical_info: "Собор Нотр-Дам-де-Шартр — один из лучших образцов французской готической архитектуры, служивший местом паломничества с раннего Средневековья. Его главная реликвия, #italic Sancta Camisa#! — отрез ткани, считающийся туникой, которую носила Дева Мария во время Благовещения, — была подарена собору Карлом Великим и уцелела во время катастрофического пожара 1194 года, уничтожившего прежнее романское здание. Собор был отстроен вокруг реликвии с поразительной быстротой, а его западная роза и стрельчатые окна, датируемые примерно 1220 годом, считаются одними из самых знаменитых средневековых витражей в мире. #italic Sancta Camisa#! сделала Шартр одним из главных мест паломничества, посвящённых Богоматери, в Европе."
 pilgrimage_expedition_events.6.title: "Рака мученика"
 pilgrimage_expedition_events.6.desc: "[current_location.GetName] расположен в неглубокой долине среди зелёных [ShowCultureName('english')] земель, и башни его собора видны путнику за много миль до прибытия. [current_location.GetRank.GetName] переполнен паломниками: странноприимные дома не вмещают всех, люди ночуют в амбарах и на дворах, а дороги забиты людьми, говорящими на десятке языков и идущими к одной и той же цели.\n\nРака святого Фомы Бекета находится в капелле Троицы за главным алтарём. Некогда это была самая роскошно украшенная рака во всей [ShowScriptedGeographyName('england_geography')]: драгоценные камни, золото, всевозможные приношения по обету. [target_ruler.GetName] останавливается перед ней. Здесь человек был убит за то, что бросил вызов королю. И здесь же этот самый вызов обернулся святостью. В этом есть некий урок, так или иначе."
 pilgrimage_expedition_events.6.a: "Зажечь свечу и помолиться у гробницы Бекета."
 pilgrimage_expedition_events.6.b: "Заказать мессу за души верующих."
 pilgrimage_expedition_events.6.c: "Святому довольно почтения от правителей. Пора возвращаться домой."
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.6.historical_info: "Томас Бекет, архиепископ Кентерберийский, был убит в собственном соборе рыцарями, действовавшими по подразумеваемой воле короля Англии Генриха II, 29 декабря 1170 года. Его смерть потрясла весь христианский мир, и всего три года спустя, в 1173 году, он был канонизирован. Генрих II был вынужден публично покаяться у гробницы Бекета, а его гробница быстро стала самым посещаемым местом паломничества в Англии, увековеченным в #italic «Кентерберийских рассказах» #! Джеффри Чосера. Гробница была украшена необычайным собранием драгоценных камней и золота, пожертвованных за два столетия, включая «Регале Франции» — крупный рубин, подаренный королём Людовиком VII. В 1538 году Генрих VIII приказал разрушить гробницу и конфисковать её сокровища."
 pilgrimage_expedition_events.7.title: "Кафедра святого Патрика"
 pilgrimage_expedition_events.7.desc: "[current_location.GetName] стоит на невысоком холме на севере [ShowRegionName('ireland_region')], и его сдвоенные соборы видны с окрестных полей. Это не величественный город — не [ShowLocationName('rome')], не [ShowLocationName('jerusalem')], — но свою древность он носит с тихим достоинством. Здесь находится старейшая [ShowReligionGroupAdjective('christian')] община [ShowRegionNameWithNoTooltip('ireland_region')], кафедра, основанная самим святым Патриком, когда он прибыл обращать остров в веру.\n\n[target_ruler.GetName] прибывает ранним утром, когда над холмами ещё держится туман. Каноник собора встречает [target_ruler.GetHimHer] у ворот и ведёт [target_ruler.GetHimHer] к месту, где, как говорят, молился сам Патрик. Скромность этого места неожиданна и почему-то кажется уместной."
 pilgrimage_expedition_events.7.a: "Присутствовать на мессе в соборе святого Патрика."
 pilgrimage_expedition_events.7.b: "Оставить пожертвование у гробницы святого Патрика."
 pilgrimage_expedition_events.7.c: "Визит совершён с должным почтением. Пора возвращаться."
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.7.historical_info: "Армаг традиционно считается церковной столицей Ирландии — статус, обусловленный его связью со святым Патриком, который, как гласит предание, основал там свою главную церковь около 445 года. Кафедра Армага стала первопрестольной для Ирландской церкви — положение, за которое до сих пор спорят католический и протестантский соборы, стоящие на двух холмах города. С приближением Реформации значение Армага заключалось не только в политической силе, но и в символическом весе — как церкви апостола, обратившего Ирландию в веру, — что делало его целью для правителей, желавших продемонстрировать благочестие или солидарность с Ирландской церковью."
 pilgrimage_expedition_events.8.title: "Святилище у дороги"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] прибывает в [current_location.GetName], ещё одну остановку на долгом пути благочестия. Какая бы реликвия или память о святости ни привлекла сюда паломников впервые, она продолжает притягивать их и поныне, поколение за поколением, задолго после того, как большинство проходящих этим путём забыли подробности.\n\n[target_ruler.GetSheHe|U] останавливается среди прочих путников, усталая и покрытая пылью, как и [target_ruler.GetHerHis] собственная свита, и возносит благодарность за благополучный путь, пройденный до сих пор."
 pilgrimage_expedition_events.8.a: "Воздадим благодарность за безопасное путешествие."
 pilgrimage_expedition_events.8.b: "Оставим дары будущим паломникам."
 pilgrimage_expedition_events.8.c: "В этом святом месте мы побывали. Пора возвращаться домой."
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.9.title: "Паломничество оборачивается скорбью"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] [Select_CString(target_ruler.IsFemale, 'умерла', 'умер' )] в пути, и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] паломничество останется незавершённым. Вести об утрате дойдут до #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! нескоро: их принесут домой верные слуги, до последнего вздоха остававшиеся подле [Select_CString(target_ruler.IsFemale, 'своей правительницы', 'своего правителя' )]."
 pilgrimage_expedition_events.9.a: "Нас постигла невосполнимая утрата."
 pilgrimage_expedition_events.17.title: "Паломничество брошено"
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName] поворачивает обратно к дому с неисполненным обетом: паломничество брошено, так и не достигнув цели. Вести о нарушенной клятве дойдут до #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! раньше самого правителя, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] будут помнить об этом ещё долго после того, как утихнут пересуды при дворе."
 pilgrimage_expedition_events.17.a: "Мы возвращаемся со стыдом, предав нашу клятву Господу."
 pilgrimage_expedition_events.10.title: "Ассизский бедняк"
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] поднимается по последнему склону к [current_location.GetName], и перед [target_ruler.GetHimHer] встаёт великая базилика в два яруса из светлого камня, возведённая прямо на склоне холма и построенная с поразительной скоростью после смерти того, в чью честь она названа — нищего, не владевшего ничем, а ныне повелевающего одной из самых великолепных церквей Италии.\n\nВнутри нижней церкви, в крипте, высеченной в живой скале, покоится сам Франциск Ассизский. [target_ruler.GetSheHe|U] преклоняет колени перед гробницей человека, отказавшегося от шёлка и золота ради верёвочного пояса и босых ног, который, как говорят, проповедовал птицам и укротил волка. Противоречие между бедностью святого и великолепием, воздвигнутым в его память, не ускользает от [target_ruler.GetHimHer]."
 pilgrimage_expedition_events.10.a: "Смиренно опустимся на колени, как сделал бы сам Франциск."
 pilgrimage_expedition_events.10.b: "Подадим милостыню беднякам у входа, в духе самого святого."
 pilgrimage_expedition_events.10.c: "Мы выразили почтение. Пора домой."
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "Франциск Ассизский (1181/2 — 1226) отрёкся от богатства своей семьи ради жизни в нищете. Он основал орден францисканцев на принципах смирения, странствующего проповедничества и служения бедным и больным. Франциск был канонизирован папой Григорием IX в 1228 году, всего через два года после своей кончины, что стало одним из самых быстрых причислений к лику святых в средневековой истории. Возведение базилики Святого Франциска началось в том же году и в основном завершилось к 1253 году; позже её нижнюю и верхнюю церкви украсили фресками, авторами которых считаются Чимабуэ и Джотто. Вопреки тому, что сам святой отвергал материальные блага, Ассизи стал одним из главных центров паломничества в католической Европе, привлекавшим как правителей, так и простых пилигримов."
 pilgrimage_expedition_events.11.title: "Святой покровитель моряков"
 pilgrimage_expedition_events.11.desc: "[current_location.GetName] пахнет морем задолго до того, как [target_ruler.GetName] достигает его стен — порт, который [current_location.GetRank.GetName] выстроил вокруг единственного великого сокровища. Под романскими сводами базилики покоится гробница Николая Мирликийского, привезённая сюда местными моряками более ста лет назад, вывезенная из разрушающихся церквей христианского Востока, уже неспособного их защитить.\n\nРаз в год гробницу открывают, и из-под костей святого добывают прозрачную жидкость — #italic манну#!, которая, как верят и [ShowReligionAdjective('catholic')], и [ShowReligionAdjective('orthodox')], обладает целительной силой. [target_ruler.GetName] показывают склянку с ней, и его поражает мысль, что ни одна другая святыня на этом пути паломничества не почитается так безраздельно обеими ветвями христианства одновременно."
 pilgrimage_expedition_events.11.a: "Почтим усыпальницу и получим сосуд со святой манной."
 pilgrimage_expedition_events.11.b: "Закажем мессу по морякам, вернувшим святого домой."
 pilgrimage_expedition_events.11.c: "Святой нас благословил. Теперь мы возвращаемся домой."
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "В 1087 году шестьдесят два моряка из Бари отплыли в Миры Ликийские, находившиеся тогда под угрозой сельджукского завоевания, и извлекли мощи святого Николая, спасая их от возможной утраты или уничтожения. Святыни прибыли в Бари 9 мая 1087 года — это событие и по сей день празднуется как перенесение мощей, — и для их хранения была возведена базилика Святого Николая, чью крипту в 1089 году освятили в присутствии папы Урбана II. С момента прибытия реликвий вокруг костей продолжала образовываться прозрачная жидкость, которую верующие называют #italic манной#!; архиепископ Бари собирает её раз в год. Будучи покровителем моряков, торговцев и детей, а также одним из немногих святых, почитаемых с одинаковым благоговением как в католическом, так и в православном мире, Николай превратил Бари в центр паломничества, не имеющий себе равных во всей Италии."
 pilgrimage_expedition_events.12.title: "Ангельское освящение"
 pilgrimage_expedition_events.12.desc: "Бенедиктинское аббатство в [current_location.GetName] расположено на краю тёмного леса в [ShowCultureGroupName('swiss_group')] нагорьях, а его чернорясые монахи ведут свой род от одинокого отшельника, убитого разбойниками на этом самом месте много поколений назад. [target_ruler.GetName] слышал эту историю с детства: о том, как здешняя часовня была освящена не епископом, а самим Христом, сошедшим с хором ангелов и святых накануне её освящения.\n\nВ капелле Богоматери стоит предмет того первого, спорного освящения: небольшая статуя Девы Марии, потемневшая за века от свечного дыма до глубокой черноты. Паломники со всех немецкоязычных земель преклоняют перед ней колени в непрерывной череде, уходящей в прошлое дальше, чем [target_ruler.GetNameWithNoTooltip] может легко себе представить."
 pilgrimage_expedition_events.12.a: "Преклоним колени перед Чёрной Мадонной в молчаливой молитве."
 pilgrimage_expedition_events.12.b: "Сделаем пожертвование в знаменитую библиотеку и скрипторий аббатства."
 pilgrimage_expedition_events.12.c: "Хватит с нас этих тёмных лесов. Пойдём дальше."
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "Аббатство Эйнзидельн ведёт свою историю от отшельника Майнрада, который поселился в этом лесу и был убит разбойниками в 861 году. Официальный монастырь был основан на этом месте в 934 году монахом Эберхардом. Согласно старинному преданию, местная часовня была чудесным образом освящена самим Христом в ночь на 14 сентября 948 года — это утверждение впоследствии официально признал папа Лев VIII. Местная статуя Чёрной Мадонны на протяжении веков привлекает паломников: благодаря ей Эйнзидельн стал одним из самых посещаемых центров поклонения Богородице во всём немецкоязычном мире."
 pilgrimage_expedition_events.13.title: "Ясная гора"
 pilgrimage_expedition_events.13.desc: "#italic Ясна-Гура#!, Светлая гора, поднимается над равниной задолго до того, как [target_ruler.GetName] достигает ворот монастыря, а её белые стены ловят свет так, как несомненно и задумывали построившие её монахи-паулины. Внутри, за стеной вотивного серебра и горящих свечей, висит тёмноликая икона Девы Марии, сделавшая эту скромную [ShowCultureGroupName('polish_group')] [current_location.GetRank.GetName] местом паломничества со всего севера.\n\n[target_ruler.GetName] внимательно всматривается в лик Мадонны и замечает их: два параллельных шрама на правой щеке, старые раны, которые не смогла до конца стереть ни одна реставрация. Меч разбойника когда-то давно рассёк её лик, и монахи, вновь писавшие образ, снова и снова обнаруживали, как порезы проступают сквозь свежую краску, пока не оставили попыток скрыть содеянное."
 pilgrimage_expedition_events.13.a: "Почтим икону и её неисцелимые раны."
 pilgrimage_expedition_events.13.b: "Пожертвуем золото на укрепления, чтобы никто больше не смог ограбить монастырь."
 pilgrimage_expedition_events.13.c: "Посмотрели Ясную Гору, а теперь пора домой."
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "Паулинский монастырь на Ясной Горе был основан в 1382 году князем Владиславом Опольчиком, который привёз с собой икону Пресвятой Девы с Младенцем, написанную в византийском стиле и уже тогда считавшуюся чудотворной. На Пасху 1430 года отряд гуситских налётчиков из Богемии, Моравии и Силезии ворвался в монастырь: они разбили икону на части и дважды рассекли лик Богоматери саблей. Реставраторы при королевском дворе Владислава II Ягайло в Кракове восстановили полотно, однако шрамы проступали сквозь каждый новый слой краски, и в итоге их решили оставить как постоянную, намеренную деталь изображения. Ченстоховская икона Божией Матери стала главной мариинской святыней Польши, а её отмеченный шрамами лик на протяжении веков воспроизводился на иконах по всему региону."
 pilgrimage_expedition_events.14.title: "Престол святого Иштвана"
 pilgrimage_expedition_events.14.desc: "[current_location.GetName] расположен там, где изгибается Дунай, и его соборный холм возвышается над рекой, некогда обозначавшей край христианской Европы. Здесь, в часовне, не раз перестроенной с тех пор, родился, был крещён и в зимний день на рубеже тысячелетия коронован как первый христианский король своего народа Стефан Венгерский.\n\n[target_ruler.GetName] принимает архиепископ [current_location.GetNameWithNoTooltip], примас Венгрии, преемник кафедры, основанной самим Стефаном. Архиепископ рассказывает о молодом короле, который предпочёл крещение старым богам, который построил эту церковь прежде своего дворца и который был канонизирован спустя всего несколько десятилетий после смерти — именно потому, что понимал: христианская корона должна опираться на христианскую церковь."
 pilgrimage_expedition_events.14.a: "Почтим память святого Иштвана тихой молитвой."
 pilgrimage_expedition_events.14.b: "Проведём долгую беседу с архиепископом-примасом Венгрии."
 pilgrimage_expedition_events.14.c: "Достойный визит для христианского правителя. Пора в дорогу."
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "Иштван I Святой родился около 975 года в Эстергоме и был коронован там в канун Рождества 1000 года. Это событие ознаменовало официальное рождение христианского королевства Венгрия. В 1001 году Иштван основал старейшее в стране архиепископство Эстергомское. С тех пор его архиепископы неизменно носят титул примаса Венгрии. Эстергом служил политической и религиозной столицей королевства вплоть до середины XIII века, а канонизация самого Иштвана в 1083 году окончательно закрепила за городом статус духовного сердца венгерского христианства."
 pilgrimage_expedition_events.15.title: "Хорватский Назарет"
 pilgrimage_expedition_events.15.desc: "На холме над [current_location.GetName], откуда открывается вид на залив, стоит скромная францисканская церковь, возведённая вокруг пустого места, где, как уверяют здешние паломники, некогда стояло нечто необычайное. Три года, говорят они, на этой земле стоял сам дом Святого Семейства, перенесённый целиком из Назарета ангелами, когда Святая земля стала слишком опасной, чтобы его защищать, прежде чем продолжить свой чудесный путь в итальянское Лорето.\n\n[target_ruler.GetName] показывают картину, которую Папа прислал в утешение [current_location.GetRank.GetName] за утрату дома: Богородицу, кормящую младенца Христа, — работу, приписываемую самому святому Луке. С тех пор она на протяжении поколений привлекает паломников на этот холм — святыню того, чего здесь больше нет, и всё же оно каким-то образом по-прежнему здесь."
 pilgrimage_expedition_events.15.a: "Поклонимся иконе Богоматери Трсатской."
 pilgrimage_expedition_events.15.b: "Закажем в святилище у моря мессу за безопасное путешествие."
 pilgrimage_expedition_events.15.c: "Дом Марии перенёсся в Лорето. Перенесёмся и мы — домой."
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "Согласно преданию, Святой дом из Назарета, обитель Девы Марии, был перенесён ангелами на холм Трсат над Риекой 10 мая 1291 года и оставался там на протяжении трёх лет, после чего 10 декабря 1294 года продолжил свой путь в итальянское Лорето. Князь Никола I Франкопан воздвиг на месте хижины первую церковь. В 1367 году папа Урбан V в утешение в связи с отбытием Святого дома прислал святилищу икону Богоматери с Младенцем, традиционно приписываемую кисти святого Луки. Со следующего столетия стражами этого святого места стали монахи-францисканцы. Легенда закрепила за городом его негласное и вечное прозвище — Хорватский Назарет."
 pilgrimage_expedition_events.16.title: "Король и мученик"
 pilgrimage_expedition_events.16.desc: "Собор в [current_location.GetName] вздымается суровым серым силуэтом на фоне северного неба, возведённый над песчаной отмелью, где чуть более года спустя после смерти короля была вскрыта его могила — и, к изумлению всех присутствовавших, обнаружилось, что тело его не тронуто тлением. Его волосы и ногти, гласит предание, продолжали расти в тёмной земле, а из гроба, где должен был царить смрад смерти, поднималось сладкое благоухание.\n\n[target_ruler.GetName] стоит перед ракой Олафа Харальдссона — некогда викингского военного вождя, павшего в битве, пытаясь силой навязать христианство королевству, которое его не желало, и причисленного к лику святых уже в течение года после смерти одним лишь народным почитанием, безо всякого далёкого папы римского. Это, размышляет [target_ruler.GetNameWithNoTooltip], странная разновидность святости: обретённая не кротким благочестием, а мечом, и смертью за дело, лишь задним числом представшее праведным."
 pilgrimage_expedition_events.16.a: "Почтим нетленного короля в его усыпальнице."
 pilgrimage_expedition_events.16.b: "Олав преподал нам урок: насаждать веру мечом — всё равно праведное дело."
 pilgrimage_expedition_events.16.c: "Какое холодное и святое место. Отправимся домой."
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "Король Норвегии Олав Харальдсон погиб при Стиклестаде 29 июля 1030 года в битве за возвращение своего престола и завершение насильственной христианизации своего королевства. Когда спустя год и пять дней, 3 августа 1031 года, его могила была вскрыта, епископ Гримкель обнаружил, что тело правителя осталось нетленным. На основании одного лишь этого открытия он провозгласил Олава святым — эта местная канонизация впоследствии была официально подтверждена папой Александром III в 1164 году. Нидаросский собор, воздвигнутый над его усыпальницей, стал главным центром паломничества на всём севере, привлекая верующих со всей Скандинавии и из других земель по сети дорог, которые и по сей день известны как Тропы святого Олава."
 pilgrimage_expedition_events.18.title: "Горный перевал"
 pilgrimage_expedition_events.18.desc: "Дорога поднимается в голую, продуваемую ветрами местность, сужаясь до тропы вдоль склона горы. [target_ruler.GetName] останавливается там, где путь разделяется: более длинный обход, огибающий самый трудный подъём, и прямой путь, который, по словам местных пастухов, переживают не все неподготовленные путники.\n\n[target_ruler.GetSheHe|U] взвешивает гору против календаря. Каждый день, потраченный на поиски более лёгкого пути, — это день, на который отряд не приближается к концу странствия."
 pilgrimage_expedition_events.18.a: "Наймём местных проводников, знающих безопасные тропы."
 pilgrimage_expedition_events.18.b: "Пойдём вперёд без них, уповая на веру и собственные силы."
 pilgrimage_expedition_events.18.c: "Повернём назад и пойдём по длинной дороге в обход горы."
 pilgrimage_expedition_events.19.title: "Морской шторм"
 pilgrimage_expedition_events.19.desc: "Небо над кораблём темнеет без предупреждения, и уже через час команда сражается с волнами, перехлёстывающими через борт. [target_ruler.GetName] отбрасывает к мачте, прежде чем удаётся ухватиться за опору, а палуба под [target_ruler.GetHimHer] раскачивается, будто живая.\n\nВнизу, в трюме, паломники цепляются за всё, что прикреплено намертво, и молятся сразу на десятке наречий. Больше ничего не остаётся, пока море само не решит их отпустить."
 pilgrimage_expedition_events.19.a: "Укроемся в трюме и будем надеяться, что корабль выдержит."
 pilgrimage_expedition_events.19.b: "Соберём спутников на палубе и будем молиться на протяжении шторма."
 pilgrimage_expedition_events.19.afloat_tt: "Команде удаётся удержать корабль на плаву"
 pilgrimage_expedition_events.19.off_course_tt: "Из-за шторма корабль сильно сбивается с курса"
 pilgrimage_expedition_events.19.faith_protects_tt: "Наша вера помогает нам пережить шторм"
 pilgrimage_expedition_events.19.piety_lacking_tt: "Нашего благочестия недостаточно, чтобы утихомирить шторм"
 pilgrimage_expedition_events.20.title: "Переправа"
 pilgrimage_expedition_events.20.desc: "Дорога внезапно обрывается у реки, вздувшейся и помутневшей от недавних дождей; брод, который должен быть здесь, скрыт под течением, способным сбить лошадь с ног. С дальнего берега за путниками наблюдает паромщик, не спешащий переправляться, пока не увидит цвет хорошей монеты.\n\n[target_ruler.GetName] поочерёдно окидывает взглядом воду и паромщика. Ни то, ни другое сегодня не внушает особого доверия."
 pilgrimage_expedition_events.20.a: "Заплатим паромщику за безопасную переправу."
 pilgrimage_expedition_events.20.b: "Пересечём реку вброд и сбережём деньги."
 pilgrimage_expedition_events.21.title: "Болотная лихорадка"
 pilgrimage_expedition_events.21.desc: "Дорога на много миль тонет в стоячей воде, и воздух густеет от запаха гнили и назойливых насекомых. Уже через несколько дней кашель в свите сменяется лихорадкой, и не одного путника приходится нести, а не вести за собой.\n\n[target_ruler.GetName] наблюдает, как отряд становится всё малочисленнее и тише с каждой милей через эти земли, и невольно задумывается, сколько из них отправились в паломничество, а сколько — навстречу мору."
 pilgrimage_expedition_events.21.a: "Поспешим вперёд, чтобы скорее оставить болота позади."
 pilgrimage_expedition_events.21.b: "Сделаем привал и дадим больным выздороветь."
 pilgrimage_expedition_events.22.title: "Зимнее бездорожье"
 pilgrimage_expedition_events.22.desc: "Снег смыкается над перевалом впереди сугробами выше человеческого роста, и местные жители прямо говорят, что этой дорогой никто не пройдёт до весны. [target_ruler.GetName] не рассчитывал потерять целый сезон из-за погоды, но гора не спрашивает дорожных планов.\n\nПоблизости есть городок, где хватит места для всего отряда, если [target_ruler.GetHerHis] кошелёк выдержит расходы на постой. А ещё есть проводники, готовые за плату утверждать, что знают путь даже теперь."
 pilgrimage_expedition_events.22.a: "Переждём зиму в ближайшем городке."
 pilgrimage_expedition_events.22.b: "Наймём проводников и пробьёмся сквозь снежные завалы."
 pilgrimage_expedition_events.23.title: "Гостеприимство лорда"
 pilgrimage_expedition_events.23.desc: "Весть о приближении паломничества опередила сам отряд, и местный владетель выезжает лично, чтобы приветствовать [target_ruler.GetName] и пригласить отдохнуть за собственным столом, прежде чем продолжить путь. Предложенное гостеприимство щедро и явно рассчитано на то, чтобы быть замеченным и запомненным.\n\n[target_ruler.GetSheHe|U] прекрасно понимает, чем на самом деле является это предложение: одновременно и благочестием, и способом упрочить положение, если принять его с должным изяществом."
 pilgrimage_expedition_events.23.a: "С радостью примем приглашение."
 pilgrimage_expedition_events.23.b: "Отклоним приглашение, предпочтя уединённую молитву."
 pilgrimage_expedition_events.24.title: "Плата враждебному лорду"
 pilgrimage_expedition_events.24.desc: "Дорога впереди проходит через владения сеньора, причисляющего [ROOT.GetCountry.GetName] к своим врагам, и его люди уже ждут на границе с заставой и требованием пошлины. [target_ruler.GetName] надеялся пройти незаметно. Эта надежда умирает при виде пик, перегородивших дорогу.\n\nСборщик пошлины называет цену, которая скорее оскорбление, чем предложение, и ждёт, чего стоит гордость [target_ruler.GetHerHis]."
 pilgrimage_expedition_events.24.a: "Заплатим объявленную пошлину."
 pilgrimage_expedition_events.24.b: "Пойдём напролом силами того отряда, что у нас есть."
 pilgrimage_expedition_events.24.c: "Свернём в сторону и найдём более долгий обходной путь."
 pilgrimage_expedition_events.25.title: "Иная вера"
 pilgrimage_expedition_events.25.desc: "Дорога проходит мимо святыни, почитаемой [current_location.GetDominantReligion.GetAdjective] верующими, с непривычными иконами и обрядами. [target_ruler.GetName] наблюдает за местными прихожанами, занятыми своими молитвами, — любопытствующими и немного настороженными в отношении проходящих чужаков.\n\nСреди паломников издавна принято спорить о вере с каждым, кто готов слушать. [target_ruler.GetSheHe|U] раздумывает, стоит ли сегодня предаться этой привычке."
 pilgrimage_expedition_events.25.a: "Вступим с местными в спор об истинной вере."
 pilgrimage_expedition_events.25.b: "Проявим осторожность и пройдём мимо без лишнего шума."
 pilgrimage_expedition_events.26.title: "Разбойники на дороге"
 pilgrimage_expedition_events.26.desc: "На этом участке дороги дикая глушь поглощает путь, и ни один сеньор своим указом не гарантирует здесь безопасности — из-за кромки леса появляются фигуры прежде, чем свита успевает среагировать: вооружённые, оборванные, явно не новички в деле грабежа путников. [target_ruler.GetName] быстро пересчитывает их. Их достаточно, чтобы стать проблемой, но слишком мало, чтобы сойти за войско.\n\nИх предводитель выходит вперёд и называет цену за безопасный проход таким тоном, что ясно, чего ждать в случае отказа."
 pilgrimage_expedition_events.26.a: "Откупимся от них и покончим с этим."
 pilgrimage_expedition_events.26.b: "Примем бой и сразимся за честь паломничества."
 pilgrimage_expedition_events.27.title: "Ещё больше паломников"
 pilgrimage_expedition_events.27.desc: "Слух о королевском паломничестве бежит впереди самой процессии, и к тому времени, как [target_ruler.GetName] добирается до следующего перекрёстка, там уже собралась пёстрая толпа простых паломников, надеющихся преодолеть остаток пути под защитой правительской свиты.\n\nСреди них есть целые семьи и старики, идущие пешком, которые в одиночку далеко не уйдут. [target_ruler.GetSheHe|U] не может кормить всю эту толпу вечно, но прогнать их здесь означало бы бросить их на произвол судьбы."
 pilgrimage_expedition_events.27.a: "Примем страждущих под свою защиту."
 pilgrimage_expedition_events.27.b: "Прогоним их, чтобы не задерживаться в пути."
 pilgrimage_expedition_events.29.title: "Корсары у побережья"
 pilgrimage_expedition_events.29.desc: "Низкий тёмный корпус пересекает горизонт, вёсла сверкают на солнце, судно нагоняет паломнический корабль быстрее, чем это пристало честному торговцу. [target_ruler.GetName] узнаёт силуэт корсарского судна задолго до того, как об этом кричит впередсмотрящий, а поблизости нет ни порта, ни берега, ни помощи.\n\n[target_ruler.GetSheHe|U] собирает на палубе всех бойцов, каких только может выставить свита, и прикидывает, достаточно ли их — или же запасы корабля стоят дороже, чем схватка."
 pilgrimage_expedition_events.29.a: "Возьмёмся за оружие и дадим отпор пиратам."
 pilgrimage_expedition_events.29.b: "Пожертвуем припасами и будем надеяться, что этого хватит."
 pilgrimage_expedition_events.30.title: "Требование выкупа"
 pilgrimage_expedition_events.30.desc: "Свита поредела за время долгого пути, и теперь [target_ruler.GetName] — лёгкая мишень, а кто-то по дороге это заметил. Вооружённые люди окружают отряд прежде, чем удаётся собрать надёжную стражу, и их предводитель называет цену за свободу правителя так же небрежно, как торговец называет цену на хлеб.\n\nУ [target_ruler.GetSheHe|U] осталось мало людей, на которых можно положиться, и ещё меньше хороших вариантов."
 pilgrimage_expedition_events.30.a: "Заплатим требуемый выкуп."
 pilgrimage_expedition_events.30.b: "Попытаемся сбежать под покровом ночи."
 pilgrimage_expedition_events.28.title: "Пустые закрома"
 pilgrimage_expedition_events.28.desc: "Запасы свиты иссякли где-то за последним городом, достойным этого названия, и животы спутников опустели так же, как мешки, некогда хранившие хлеб. [target_ruler.GetName] ещё не приходилось вести за собой войско, и это заметно: голод не заботит святость лежащего впереди пути.\n\nЗдешние земли, по крайней мере, милостивы: поля, сады и деревенский рынок неподалёку — если свита [target_ruler.GetHerHis] готова потратить время, монету или гордость, что потребуются, чтобы этим воспользоваться."
 pilgrimage_expedition_events.28.a: "Разошлём людей по округе на сбор припасов."
 pilgrimage_expedition_events.28.b: "Скупим все припасы по любой цене, которую назовут."
 pilgrimage_expedition_events.28.c: "Выбора нет. Придётся повернуть назад."
 pilgrimage_resupply_light: "Заплатим местным за свежих коней, провизию и наёмных рабочих."
 pilgrimage_resupply_heavy: "Не пожалеем средств, чтобы полностью пополнить запасы и усилить свиту."
