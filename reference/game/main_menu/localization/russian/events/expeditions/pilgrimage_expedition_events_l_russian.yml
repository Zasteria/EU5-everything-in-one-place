l_russian:
 pilgrimage_expedition_events.1.title: "[target_location.GetNameWithNoTooltip], the Holy City"
 pilgrimage_expedition_events.1.desc: "After months of weary travel, [target_ruler.GetName] stands at last before the walls of [target_location.GetName], city of the Crucifixion, city of the Resurrection, the holiest ground in all of Christendom. The dust of a thousand pilgrims hangs in the air, mingling with incense drifting from a hundred chapels.\n\nAt the center of it all stands the Church of the Holy Sepulchre, built over the very rock of Golgotha. [target_ruler.GetSheHe|U] has journeyed far for this moment. The long road, the blistered feet, the sleepless nights, all of it falls away as the great doors swing open and the smell of holy oil and old stone rushes out to meet [target_ruler.GetHimHer]."
 pilgrimage_expedition_events.1.a: "Пасть ниц перед Гробом Господним."
 pilgrimage_expedition_events.1.b: "Заказать часовню во имя [ROOT.GetCountry.GetNameWithNoTooltip]."
 pilgrimage_expedition_events.1.c: "This pilgrimage has reached its summit. It is time to go home."
 pilgrimage_expedition_events.1.historical_info: "Иерусалим привлекал христианских паломников с IV века, когда император Константин повелел возвести Храм Гроба Господня на месте погребения и воскресения Христа. Город неоднократно переходил из рук в руки во время Крестовых походов: был взят участниками Первого крестового похода в 1099 году, утрачен в пользу Саладина в 1187 году и ненадолго возвращён по договору при Фридрихе II в 1229 году, прежде чем окончательно перейти под власть мамлюков. Несмотря на утрату христианского правления, святые места оставались доступны паломникам благодаря дипломатическим соглашениям, что делало Иерусалим величайшей целью католического благочестия во всём средневековом мире."
 pilgrimage_expedition_events.2.title: "The Eternal City"
 pilgrimage_expedition_events.2.desc: "[target_location.GetName] rises slowly out of the plain, its domes and towers catching the afternoon light as [target_ruler.GetName]'s retinue crosses the last bridge over the Tiber. The city is vast and ancient, its streets crowded with pilgrims from every corner of Christendom, each drawn by the same invisible current.\n\nAt the summit of the Vatican hill, Saint Peter's rises against the sky. Here is the throne of the Vicar of Christ, the living authority of the Church on earth. [target_ruler.GetNameWithNoTooltip] is in awe of being at the center of [ShowReligionAdjective('catholic')] spirituality."
 pilgrimage_expedition_events.2.a: "Смиренно признать божественную власть."
 pilgrimage_expedition_events.2.b: "Сделать пожертвование, достойное [ROOT.GetCountry.GetGovernment.Custom('CL_GEN')]."
 pilgrimage_expedition_events.2.c: "Мы воздали должное почтение. Наш народ нуждается в нашем возвращении."
 pilgrimage_expedition_events.2.historical_info: "Рим стал средоточием христианской власти с первых веков существования Церкви благодаря мученической кончине апостола Петра, чья гробница покоится под великой базиликой, носящей его имя. Папство обрело как духовную, так и мирскую власть, притягивая правителей и паломников со всей Европы, искавших отпущения грехов, законности своей власти и благословения преемника Петра. Юбилейные годы, начатые в 1300 году папой Бонифацием VIII, привлекли сотни тысяч паломников и закрепили за Римом место главной цели католического паломничества."
 pilgrimage_expedition_events.3.title: "Конец Камино"
 pilgrimage_expedition_events.3.desc: "The last miles of the Camino de Santiago are the most crowded. From every road and every valley, streams of pilgrims converge on the great cathedral at [target_location.GetName], their staffs worn smooth, their cloaks caked with the dust of five hundred leagues. Some weep. Some have walked barefoot for a hundred miles.\n\n[target_ruler.GetName] rides at the head of [target_ruler.GetHerHis] retinue, but dismounts as the cathedral towers come into view. It seems right to walk the last stretch. A great roar of the pilgrims' hymn rises on the wind, #italic Ultreia! Ultreia!#!, and the stones of the road seem to ring with it."
 pilgrimage_expedition_events.3.a: "Возблагодарить у гробницы святого Иакова."
 pilgrimage_expedition_events.3.b: "[target_ruler.GetNameWithNoTooltip] has found something on this road. [target_ruler.GetSheHe|U] can feel it."
 pilgrimage_expedition_events.3.c: "Знаменательный день. Но нашими [ROOT.GetCountry.GetFlavorRank] всё равно нужно управлять."
 pilgrimage_expedition_events.3.historical_info: "The cult of Saint James the Apostle at Santiago de Compostela emerged in the 9th century, when relics identified as those of James were discovered in Galicia and enshrined by King Alfonso II of Asturias. The resulting pilgrimage route, the Camino de Santiago, became one of the three great pilgrimages of medieval Christendom alongside Rome and Jerusalem. By the 12th century the road was lined with hospitals, monasteries, and churches, and pilgrims from every European nation walked it. Reaching Santiago entitled the pilgrim to a Compostela certificate and a plenary indulgence."
 pilgrimage_expedition_events.4.title: "Рака Трёх Королей"
 pilgrimage_expedition_events.4.desc: "[target_location.GetName] is a [target_location.GetRank.GetName] of cranes and scaffolding. The great cathedral has been under construction for nearly two centuries, its unfinished towers climbing higher each year toward a completion that will not come for generations still unborn. Yet even incomplete, the building is vast beyond measure, the largest in the world, men say.\n\nWithin the south transept, behind an altar blaze of gold leaf and candlelight, stands the Shrine of the Three Kings: a golden reliquary containing the bones of the Magi who followed the star to Bethlehem. [target_ruler.GetName] has heard of it since childhood. Nothing quite prepares [target_ruler.GetHimHer] for this."
 pilgrimage_expedition_events.4.a: "Преклонить колени и почтить раку Трёх Волхвов."
 pilgrimage_expedition_events.4.b: "Сделать щедрое пожертвование на строительство собора."
 pilgrimage_expedition_events.4.c: "Помолимся, а затем отправимся в путь."
 pilgrimage_expedition_events.4.historical_info: "Рака Трёх Волхвов в Кёльне — крупнейший реликварий западного мира, где, как считается, покоятся кости библейских волхвов. Мощи были захвачены императором Священной Римской империи Фридрихом Барбароссой после завоевания Милана в 1164 году и переданы кёльнскому архиепископу Райнальду фон Дасселю. Их прибытие превратило Кёльн в один из важнейших центров паломничества в Северной Европе и стало толчком к строительству великого готического собора, начатому в 1248 году, — проекта, завершённого лишь в 1880 году. Связь волхвов с царской властью и Богоявлением делала их культ особенно значимым для светских правителей, искавших божественного одобрения."
 pilgrimage_expedition_events.5.title: "Our Lady of [target_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.5.desc: "They say the windows of [target_location.GetName] cannot be described, only seen. [target_ruler.GetName] stands in the nave and understands why. The cathedral is filled with blue light, light that has passed through a thousand panes of colored glass and been transformed into something no longer quite earthly. It falls on the stone floor in shifting pools, on the faces of the kneeling pilgrims, on the ancient relic in its golden case behind the high altar.\n\nThe #italic Sancta Camisa#!, the veil of the Virgin Mary, said to have been worn at the Annunciation, has drawn the faithful here since Charlemagne. [target_ruler.GetNameWithNoTooltip] stands very still and is unexpectedly moved."
 pilgrimage_expedition_events.5.a: "Почтить #italic Sancta Camisa#! и помолиться Богоматери."
 pilgrimage_expedition_events.5.b: "Красота этого места заслуживает созерцания."
 pilgrimage_expedition_events.5.c: "A beautiful cathedral. We must press on."
 pilgrimage_expedition_events.5.historical_info: "Собор Нотр-Дам-де-Шартр — один из лучших образцов французской готической архитектуры, служивший местом паломничества с раннего Средневековья. Его главная реликвия, #italic Sancta Camisa#! — отрез ткани, считающийся туникой, которую носила Дева Мария во время Благовещения, — была подарена собору Карлом Великим и уцелела во время катастрофического пожара 1194 года, уничтожившего прежнее романское здание. Собор был отстроен вокруг реликвии с поразительной быстротой, а его западная роза и стрельчатые окна, датируемые примерно 1220 годом, считаются одними из самых знаменитых средневековых витражей в мире. #italic Sancta Camisa#! сделала Шартр одним из главных мест паломничества, посвящённых Богоматери, в Европе."
 pilgrimage_expedition_events.6.title: "Рака мученика"
 pilgrimage_expedition_events.6.desc: "[target_location.GetName] sits in a shallow valley in the green [ShowCultureName('english')] countryside, and its cathedral towers can be seen for miles before you reach it. The town is thick with pilgrims; hostels overflow into barns and courtyards, and the roads are packed with people speaking a dozen languages, all making their way to the same place.\n\nThe Shrine of Saint Thomas Becket is in the Trinity Chapel behind the high altar. It was once the most lavishly adorned shrine in [ShowScriptedGeographyName('england_geography')]: jewels, gold, votive offerings of every kind. [target_ruler.GetName] pauses before it. Here a man was struck down for defying a king. Here that same defiance became sanctity. There is something instructive in that, one way or another."
 pilgrimage_expedition_events.6.a: "Зажечь свечу и помолиться у гробницы Бекета."
 pilgrimage_expedition_events.6.b: "Заказать мессу за души верующих."
 pilgrimage_expedition_events.6.c: "Святому довольно почтения от правителей. Пора возвращаться домой."
 pilgrimage_expedition_events.6.historical_info: "Томас Бекет, архиепископ Кентерберийский, был убит в собственном соборе рыцарями, действовавшими по подразумеваемой воле короля Англии Генриха II, 29 декабря 1170 года. Его смерть потрясла весь христианский мир, и всего три года спустя, в 1173 году, он был канонизирован. Генрих II был вынужден публично покаяться у гробницы Бекета, а его гробница быстро стала самым посещаемым местом паломничества в Англии, увековеченным в #italic «Кентерберийских рассказах» #! Джеффри Чосера. Гробница была украшена необычайным собранием драгоценных камней и золота, пожертвованных за два столетия, включая «Регале Франции» — крупный рубин, подаренный королём Людовиком VII. В 1538 году Генрих VIII приказал разрушить гробницу и конфисковать её сокровища."
 pilgrimage_expedition_events.7.title: "Кафедра святого Патрика"
 pilgrimage_expedition_events.7.desc: "[target_location.GetName] sits on a low hill in the north of [ShowRegionName('ireland_region')], its twin cathedrals visible from the surrounding farmland. It is not a grand city — not [ShowLocationName('rome')], not [ShowLocationName('jerusalem')] — but it wears its antiquity with quiet authority. This is the oldest [ShowReligionGroupAdjective('christian')] community in [ShowRegionNameWithNoTooltip('ireland_region')], the see established by Saint Patrick himself when he came to convert the island.\n\n[target_ruler.GetName] arrives in the early morning, when mist still clings to the hills. A canon of the cathedral meets [target_ruler.GetHimHer] at the gate and leads [target_ruler.GetHimHer] to the site where Patrick is said to have prayed. The humility of the place is unexpected and somehow appropriate."
 pilgrimage_expedition_events.7.a: "Присутствовать на мессе в соборе святого Патрика."
 pilgrimage_expedition_events.7.b: "Оставить пожертвование у гробницы святого Патрика."
 pilgrimage_expedition_events.7.c: "Визит совершён с должным почтением. Пора возвращаться."
 pilgrimage_expedition_events.7.historical_info: "Армаг традиционно считается церковной столицей Ирландии — статус, обусловленный его связью со святым Патриком, который, как гласит предание, основал там свою главную церковь около 445 года. Кафедра Армага стала первопрестольной для Ирландской церкви — положение, за которое до сих пор спорят католический и протестантский соборы, стоящие на двух холмах города. С приближением Реформации значение Армага заключалось не только в политической силе, но и в символическом весе — как церкви апостола, обратившего Ирландию в веру, — что делало его целью для правителей, желавших продемонстрировать благочестие или солидарность с Ирландской церковью."
 pilgrimage_expedition_events.8.title: "The Abbey of the Holy Savior"
 pilgrimage_expedition_events.8.desc: "The Brigittine Abbey at [target_location.GetName] sits at the edge of Lake [ShowLocationName('vattern')], its whitewashed walls mirrored in the still gray water. Founded by Saint Birgitta herself, who saw its construction in a vision before the stone was even laid, it is the newest of the great pilgrimage sites of Christendom, and the only one founded by a woman.\n\nThe nuns receive [target_ruler.GetName] in silence, leading [target_ruler.GetHimHer] through cool cloisters to the chapel where the saint's relics are kept. There is a quality of light here, northern light, pale and clear, that feels different from the golden warmth of [ShowLocationName('rome')] or the ancient dust of [ShowLocationName('jerusalem')]. Holiness, [target_ruler.GetNameWithNoTooltip] reflects, wears many faces."
 pilgrimage_expedition_events.8.a: "Pray in the chapel of Saint Birgitta."
 pilgrimage_expedition_events.8.b: "Commission the sisters to copy [target_ruler.GetHerHis] spiritual reflections."
 pilgrimage_expedition_events.8.c: "We have lingered long enough. The road home calls."
 pilgrimage_expedition_events.8.historical_info: "Birgitta of Sweden (c. 1303-1373) was a mystic, theologian, and founder of the Brigittine order, who spent much of her later life in Rome advocating for the return of the papacy from Avignon. She experienced hundreds of revelations which she dictated in Swedish and which were translated and widely circulated as the #italic Revelationes#!. Pope Urban V personally commissioned the founding of Vadstena Abbey based on her visions; she was canonized in 1391, becoming one of the patron saints of Europe. Vadstena drew pilgrims from across Scandinavia and northern Europe, its importance enhanced by the royal connections of the Brigittine order and its unusual double monastery for both monks and nuns."
 pilgrimage_expedition_events.10.a: "Смиренно преклонить колени, как сделал бы сам Франциск."
 pilgrimage_expedition_events.10.b: "Подать милостыню нищим у входа, в духе самого святого."
 pilgrimage_expedition_events.10.c: "Мы почтили это место. Пора возвращаться."
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "Франциск Ассизский (1181/2-1226) отрёкся от богатства своей семьи, чтобы жить в бедности, и основал орден францисканцев на началах смирения, странствующей проповеди и служения бедным и больным. Он был канонизирован папой Григорием IX в 1228 году, всего через два года после смерти — одна из самых быстрых канонизаций в истории Средневековья. Строительство базилики Сан-Франческо началось в том же году и было в основном завершено к 1253 году; её нижняя и верхняя церкви позднее были украшены фресками, приписываемыми Чимабуэ и Джотто. Несмотря на то что сам святой отвергал материальное богатство, Ассизи стал одним из величайших мест паломничества католической Европы, привлекая как правителей, так и простых пилигримов."
 pilgrimage_expedition_events.10.title: "Бедняк из Ассизи"
 pilgrimage_expedition_events.11.a: "Почтить гробницу и получить сосуд с миром."
 pilgrimage_expedition_events.11.b: "Заказать мессу за моряков, привёзших святого домой."
 pilgrimage_expedition_events.11.c: "Святой благословил нас. Теперь мы возвращаемся домой."
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "В 1087 году шестьдесят два моряка из Бари отплыли в Миры Ликийские, которым тогда угрожало сельджукское завоевание, и вывезли мощи святого Николая, прежде чем те могли быть утрачены или уничтожены. Мощи прибыли в Бари 9 мая 1087 года — этот день до сих пор отмечается как праздник перенесения мощей, — и для их хранения была возведена базилика Сан-Никола, крипта которой была освящена в присутствии папы Урбана II в 1089 году. С момента прибытия мощей вокруг костей продолжает образовываться прозрачная жидкость, которую верующие называют #italic миррой #!, её ежегодно собирает архиепископ Бари. Как покровитель моряков, купцов и детей, а также один из немногих святых, почитаемых с равным благоговением и в католическом, и в православном мире, Николай сделал Бари местом паломничества, не имеющим равных в Италии."
 pilgrimage_expedition_events.11.title: "Святой покровитель моряков"
 pilgrimage_expedition_events.12.a: "Преклонить колени перед Чёрной Мадонной в молчаливом благочестии."
 pilgrimage_expedition_events.12.b: "Одарить прославленную библиотеку и скрипторий аббатства."
 pilgrimage_expedition_events.12.c: "Довольно с нас этих тёмных лесов. Идём дальше."
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "Айнзидельн ведёт своё начало от отшельника Мейнрада, который поселился в этом лесу и был убит разбойниками в 861 году. Настоящий монастырь был основан на этом месте в 934 году монахом Эберхардом, и, согласно живучей легенде, его часовня была чудесным образом освящена самим Христом в ночь на 14 сентября 948 года — притязание, позднее подтверждённое папой Львом VIII. Чёрная Мадонна аббатства на протяжении веков служила предметом паломнического почитания, что сделало Айнзидельн одним из самых посещаемых марианских святилищ в немецкоязычном мире."
 pilgrimage_expedition_events.12.title: "Освящение ангелами"
 pilgrimage_expedition_events.13.a: "Почтить икону и её нетленные раны."
 pilgrimage_expedition_events.13.b: "Пожертвовать золото на укрепления, чтобы обитель не разграбили."
 pilgrimage_expedition_events.13.c: "Мы увидели Ясную Гору. Пора домой."
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "Монастырь паулинов на Ясной Горе был основан в 1382 году князем Владиславом Опольчиком, который привёз с собой икону Богородицы с Младенцем в византийском стиле, уже почитавшуюся чудотворной. На Пасху 1430 года отряд гуситских налётчиков из Богемии, Моравии и Силезии разграбил монастырь, разбив икону на части и дважды рассёкши саблей лик Богородицы. Реставраторы при королевском дворе Владислава Ягайло в Кракове восстановили образ, но шрамы проступали сквозь каждый новый слой краски, и в конце концов их оставили как неизменную, намеренную часть изображения. Ченстоховская Богоматерь стала главной марийской святыней Польши, и её изрубленный лик копировали на иконах по всему региону на протяжении веков."
 pilgrimage_expedition_events.13.title: "Светлая гора"
 pilgrimage_expedition_events.14.a: "Почтить память святого Стефана молчаливой молитвой."
 pilgrimage_expedition_events.14.b: "Долго беседовать с архиепископом-примасом Венгрии."
 pilgrimage_expedition_events.14.c: "Достойный визит для христианского правителя. Пора отправляться."
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "Стефан I Венгерский родился около 975 года в Эстергоме и был там же коронован накануне Рождества 1000 года — событие, ознаменовавшее официальное рождение христианского Венгерского королевства. В 1001 году Стефан основал Эстергомскую архиепархию, старейшую в стране, и её архиепископы с тех пор носят титул примаса Венгрии. Эстергом служил политической и религиозной столицей королевства до середины XIII века, а канонизация самого Стефана в 1083 году окончательно закрепила за городом статус духовного центра венгерского христианства."
 pilgrimage_expedition_events.14.title: "Кафедра святого Стефана"
 pilgrimage_expedition_events.15.a: "Поклониться иконе Богоматери Трсатской."
 pilgrimage_expedition_events.15.b: "Заказать мессу за благополучное странствие в [current_location.GetRank.GetNameWithNoTooltip], что находится у моря."
 pilgrimage_expedition_events.15.c: "Дом отправился дальше, в Лорето. Значит, и нам пора — домой."
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "По преданию, Святой дом из Назарета, жилище Девы Марии, был перенесён ангелами на холм Трсат над Риекой 10 мая 1291 года и оставался там три года, прежде чем 10 декабря 1294 года отправиться дальше, в Лорето, в Италии. Никола I Франкопан воздвиг на этом месте первую церковь, дабы отметить место, где стоял дом. В 1367 году папа Урбан V прислал святилищу икону Богоматери с младенцем, по преданию, написанную самим святым Лукой, в утешение за уход дома, а с последующего столетия святыню охраняют монахи-францисканцы. Легенда закрепила за городом прочное прозвище — Хорватский Назарет."
 pilgrimage_expedition_events.15.title: "Хорватский Назарет"
 pilgrimage_expedition_events.16.a: "Почтить нетленного короля у его гробницы."
 pilgrimage_expedition_events.16.b: "Урок Олава: вера, добытая мечом, всё же вера."
 pilgrimage_expedition_events.16.c: "Холодное и святое место. Пора домой."
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "Олав Харальдссон, король Норвегии, погиб в битве при Стикластадире 29 июля 1030 года, сражаясь за возвращение своего трона и завершение христианизации своего королевства силой оружия. Когда его могилу вскрыли год и пять дней спустя, 3 августа 1031 года, епископ Гримкель обнаружил тело нетленным и на одном лишь этом основании объявил Олава святым — местная канонизация, позднее подтверждённая папой Александром III в 1164 году. Над его гробницей был возведён Нидаросский собор, ставший главным местом паломничества Севера и притягивавший верующих со всей Скандинавии и за её пределами по сети дорог, которые и поныне называют Путями Святого Олава."
 pilgrimage_expedition_events.16.title: "Король-мученик"
 pilgrimage_expedition_events.17.a: "Мы возвращаемся с позором, не исполнив данный Богу обет."
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName] поворачивает домой, не исполнив обета — паломничество брошено, не дойдя до цели. Весть о нарушенном обете доходит до [ROOT.GetCountry.GetName] раньше, чем возвращается [target_leader.GetHimHer], и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] будет помнить об этом ещё долго после того, как [ROOT.GetCountry.GetGovernment.GetCourtTitle] уже забудет."
 pilgrimage_expedition_events.17.title: "Паломничество, оставленное незавершённым"
 pilgrimage_expedition_events.18.a: "Нанять местных проводников, знающих каждый безопасный уступ."
 pilgrimage_expedition_events.18.b: "Идти дальше без них, полагаясь на веру и твёрдость шага."
 pilgrimage_expedition_events.18.c: "Повернуть назад и пойти длинным путём в обход хребта."
 pilgrimage_expedition_events.18.title: "Горный перевал"
 pilgrimage_expedition_events.19.a: "Переждать бурю внизу, под палубой, и надеяться, что корабль выдержит."
 pilgrimage_expedition_events.19.afloat_tt: "Команде удаётся удержать корабль на плаву"
 pilgrimage_expedition_events.19.b: "Собрать спутников на палубе и молиться, пока не утихнет буря."
 pilgrimage_expedition_events.19.faith_protects_tt: "Наша вера защищает нас сквозь бурю"
 pilgrimage_expedition_events.19.off_course_tt: "Буря сильно сбивает корабль с курса"
 pilgrimage_expedition_events.19.piety_lacking_tt: "Нашего благочестия недостаточно перед бурей"
 pilgrimage_expedition_events.19.title: "Буря на море"
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.20.a: "Заплатить паромщику за безопасную переправу."
 pilgrimage_expedition_events.20.b: "Перейти реку вброд самим и сэкономить на плате."
 pilgrimage_expedition_events.20.title: "Переправа через реку"
 pilgrimage_expedition_events.21.a: "Поспешить вперёд и оставить болота позади."
 pilgrimage_expedition_events.21.b: "Остановиться и дать больным оправиться, прежде чем продолжить путь."
 pilgrimage_expedition_events.21.title: "Лихорадка в болотах"
 pilgrimage_expedition_events.22.a: "Переждать зиму в ближайшем городе."
 pilgrimage_expedition_events.22.b: "Заплатить за проводников и повозки, чтобы пробиться через перевал."
 pilgrimage_expedition_events.22.title: "Зима закрывает дорогу"
 pilgrimage_expedition_events.23.a: "Принять гостеприимство с благодарностью."
 pilgrimage_expedition_events.23.b: "Отказаться от задержки и помолиться в одиночестве."
 pilgrimage_expedition_events.23.title: "Гостеприимство лорда"
 pilgrimage_expedition_events.24.a: "Заплатить требуемую пошлину."
 pilgrimage_expedition_events.24.b: "Прорваться силой с нашей свитой."
 pilgrimage_expedition_events.24.c: "Свернуть и поискать более долгий путь в обход его земель."
 pilgrimage_expedition_events.24.title: "Пошлина враждебного лорда"
 pilgrimage_expedition_events.25.a: "Поспорить с местными о достоинствах истинной веры."
 pilgrimage_expedition_events.25.b: "Не будить лихо, пока оно тихо, и пройти мимо."
 pilgrimage_expedition_events.25.title: "Иной веры"
 pilgrimage_expedition_events.26.a: "Откупиться от них и покончить с этим."
 pilgrimage_expedition_events.26.b: "Встать и сражаться за честь паломничества."
 pilgrimage_expedition_events.26.title: "Разбойники на дороге"
 pilgrimage_expedition_events.27.a: "Принять их в свою компанию."
 pilgrimage_expedition_events.27.b: "Прогнать их прочь, чтобы не сбавлять темп."
 pilgrimage_expedition_events.27.title: "Паломники присоединяются к каравану"
 pilgrimage_expedition_events.28.a: "Отправить свиту на поиски продовольствия по округе."
 pilgrimage_expedition_events.28.b: "Скупить всю найденную еду, не считаясь с ценой."
 pilgrimage_expedition_events.28.c: "Ничего не поделаешь. Поворачиваем назад."
 pilgrimage_expedition_events.28.title: "Пустые закрома"
 pilgrimage_expedition_events.29.a: "Взяться за оружие и дать отпор."
 pilgrimage_expedition_events.29.b: "Отдать корабельные запасы и надеяться, что этого будет достаточно."
 pilgrimage_expedition_events.29.title: "Корсары у побережья"
