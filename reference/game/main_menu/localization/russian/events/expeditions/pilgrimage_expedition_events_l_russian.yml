l_russian:
 pilgrimage_expedition_events.1.title: "Священный город [current_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.1.desc: "После долгих месяцев изнурительного пути [target_ruler.GetName] наконец стоит перед стенами [current_location.Custom('LR_GEN')|l] [current_location.GetName] — города Распятия, города Воскресения, священнейшей земли для всего христианского мира. Местная пыль, поднятая тысячами паломников, смешивается с ароматом ладана, который струится из сотен часовен.\n\nВ самом сердце этой земли возвышается Храм Гроба Господня, возведённый на той самой скале Голгофе. Долгий путь [Select_CString(target_ruler.IsFemale, 'проделала', 'проделал' )] [target_ruler.GetName] ради этого мгновения. Дорожные тяготы, стёртые в кровь ноги, бессонные ночи — всё это мгновенно забывается, когда распахиваются великие врата, откуда исходит благоухание святого елея и древнего камня."
 pilgrimage_expedition_events.1.a: "Падём ниц перед Гробом Господним."
 pilgrimage_expedition_events.1.b: "Заложим часовню во славу [ROOT.GetCountry.Custom('CL_GEN')]."
 pilgrimage_expedition_events.1.historical_info: "Паломники-христиане начали отправляться в Иерусалим с IV века, когда император Константин поручил построить церковь Гроба Господня на месте погребения и воскресения Христа. Во время крестовых походов город неоднократно переходил из рук в руки. В 1099 году его захватили участники Первого крестового похода. В 1187 году он стал добычей Саладина. В 1229 году, при Фридрихе II, Иерусалим ненадолго вернулся под контроль христиан, после чего окончательно перешёл под власть мамлюков. Несмотря на утрату христианского господства, святые места остаются доступными для паломников благодаря дипломатическим договоренностям. Так Иерусалим стал главным центром католического паломничества во всём средневековом мире."
 pilgrimage_expedition_events.2.title: "Вечный город"
 pilgrimage_expedition_events.2.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] медленно поднимается над равниной. Его купола и башни купаются в лучах полуденного солнца, пока [target_ruler.GetName] и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] свита пересекают последний мост через Тибр. На улицах этого огромного и древнего #L #TOOLTIP:LOCATIONRANK,[current_location.Custom('LR_tt')],X [current_location.Custom('LR_GEN')|l]#!#! полно паломников со всех концов христианского мира, и каждого из них привело сюда одно и то же невидимое течение.\n\nПочти в небесах, на вершине Ватиканского холма виднеется собор Святого Петра. Здесь находится престол наместника Христа — живое воплощение церковной власти на земле. [target_ruler.GetNameWithNoTooltip], оказавшись в самом сердце #TOOLTIP:RELIGION,$catholic_tt$,X $tt_op_L$католической$tt_cl_2$ веры, чувствует благоговение."
 pilgrimage_expedition_events.2.a: "Скромно склонимся перед священной властью."
 pilgrimage_expedition_events.2.b: "Сделаем пожертвование, достойное нашего титула."
 pilgrimage_expedition_events.2.c: "Мы исполнили наш долг. Пора возвращаться к своему народу."
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.2.historical_info: "Рим стал престолом христианской власти в первые столетия существования Церкви после мученической кончины апостола Петра, чья гробница покоится под величественной базиликой, носящей его имя. Папство со временем превратилось как в духовную, так и в светскую силу, оно привлекало правителей и паломников со всей Европы, искавших отпущения грехов, легитимности и благословения от преемника Петра. Юбилейные годы, учреждённые в 1300 году папой Бонифацием VIII, привлекли в Рим сотни тысяч пилигримов и окончательно закрепили за городом статус главного центра католического паломничества."
 pilgrimage_expedition_events.3.title: "Конец Камино"
 pilgrimage_expedition_events.3.desc: "Последний отрезок #italic пути Святого Иакова#! приходится преодолевать в тесноте. Со всех дорог, из каждой долины сюда стекаются потоки паломников и устремляются к величественному собору в [current_location.Custom('LR_PREP')|l] [current_location.GetName]. Их посохи стёрты до блеска, а плащи покрыты пылью пятисот лиг пути. Кое-кто плачет. Некоторые прошли босиком не одну сотню километров.\n\n[target_ruler.GetName] едет во главе свиты, но спешивается, как только на горизонте показываются башни собора. Лучше всего будет пройти последний отрезок пути пешком. Ветер разносит громогласный хор паломнического гимна: #italic «Ультрейя! Ультрейя!»#! — и кажется, будто сами камни мостовой вторят этому кличу."
 pilgrimage_expedition_events.3.a: "Воздадим благодарность могиле Святого Иакова."
 pilgrimage_expedition_events.3.b: "Провозгласим это знаком того, что Господу угодно наше правление."
 pilgrimage_expedition_events.3.c: "Знаменательный день. Но нам пора возвращаться [ROOT.GetCountry.Custom('endrank_predlog_vvo')] [ROOT.GetCountry.Custom('rank_ru_ACC')|l]."
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.3.historical_info: "Культ святого апостола Иакова в Сантьяго-де-Компостела зародился в IX веке, когда в Галисии были обнаружены мощи апостола Иакова, и король Астурии Альфонсо II заложил собор, чтобы их там хранить. Вскоре туда начали приходить паломники, и #italic Камино-де-Сантьяго#!, или путь Святого Иакова, стал наряду с Римом и Иерусалимом одним из трёх великих мест паломничества средневековых христиан. К XII веку вдоль дороги выросли многочисленные больницы, монастыри и церкви, по этому пути шли пилигримы со всех уголков Европы. Посещение Сантьяго давало паломнику право на получение свидетельства «Компостела» и полную индульгенцию."
 pilgrimage_expedition_events.4.title: "Рака Трёх Волхвов"
 pilgrimage_expedition_events.4.desc: "[current_location.GetName] — это [current_location.GetRank.GetName|l] строительных лесов и кранов. Величественный собор строится уже почти два века: его башни с каждым годом поднимаются всё выше, но окончания строительства не застанут даже наши будущие потомки. Однако и недостроенное здание поражает невообразимыми масштабами: очевидцы говорят, что это величайший храм в мире.\n\nВ южном трансепте, за алтарём, который сияет сусальным золотом и освещён пламенем свечей, покоится Рака Трёх Волхвов — это золотой ковчег с мощами мудрецов, что шли за звездой в Вифлеем. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'слышала', 'слышал' )] об этом святом месте с самого детства. Но воочию это сооружение всё равно потрясает до глубины души."
 pilgrimage_expedition_events.4.a: "Преклоним колена и помолимся Раке Трёх Волхвов."
 pilgrimage_expedition_events.4.b: "Сделаем щедрое пожертвование на строительство собора."
 pilgrimage_expedition_events.4.c: "Помолимся, и в путь."
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.4.historical_info: "Рака Трёх Волхвов в Кёльне — это величайший реликварий в западном мире и место упокоения библейских мудрецов, пришедших к младенцу Иисусу. Эти святыни были захвачены императором Священной Римской империи Фридрихом Барбароссой после взятия Милана в 1164 году и подарены архиепископу Кёльнскому Райнальду фон Дасселю. Мощи превратили Кёльн в один из важнейших центров паломничества Северной Европы. Специально для них в 1248 году здесь был заложен величественный готический собор, строительство которого завершилось лишь в 1880 году. Связь волхвов с королевской властью и праздником Богоявления сделала их культ особенно значимым для светских правителей, которые искали божественного покровительства."
 pilgrimage_expedition_events.5.title: "Собор Шартрской Богоматери"
 pilgrimage_expedition_events.5.desc: "Говорят, витражи собора в #L #TOOLTIP:LOCATIONRANK,[current_location.Custom('LR_tt')],X [current_location.Custom('LR_PREP')|l]#!#! невозможно описать словами — их нужно увидеть воочию. [target_ruler.GetName] стоит в нефе и понимает почему. Собор залит сияющим синим светом, который преломился в тысяче цветных стёкол и превратился в нечто неземное. Он падает на каменный пол зыбкими цветными лучами, ложится на лица коленопреклонённых паломников и озаряет древнюю святыню в золотом ковчеге за главным алтарём.\n\nЭто часть Плата Богородицы, который, по преданию, был на ней в момент Благовещения. Эта святыня привлекает сюда верующих со времён Карла Великого. [target_ruler.GetNameWithNoTooltip] стоит не шелохнувшись, ощущая неожиданное и глубокое волнение."
 pilgrimage_expedition_events.5.a: "Преклонимся перед #italic Платом#! и помолиться Богородице."
 pilgrimage_expedition_events.5.b: "Красота этого места наводит на размышления."
 pilgrimage_expedition_events.5.c: "Красивый собор. Но нас ждут дома."
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.5.historical_info: "Собор Шартрской Богоматери — один из величайших шедевров французской готической архитектуры, служивший местом паломничества со времён раннего Средневековья. Его главная святыня, Плат Богородицы, представляет собой полотно, которое, по преданию, было на Деве Марии в момент Благовещения. Он был передан собору Карлом Великим и чудом уцелел в катастрофическом пожаре 1194 года, уничтожившем прежнее романское здание. Храм был отстроен вокруг спасённой реликвии с невероятной быстротой, и теперь его западная роза и стрельчатые окна, датируемые примерно 1220 годом, считаются одними из самых знаменитых образцов средневекового витражного искусства в мире. Благодаря Плату Богородицы Шартр стал одним из главных центров Мариинского паломничества в Европе."
 pilgrimage_expedition_events.6.title: "Гробница мученика"
 pilgrimage_expedition_events.6.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] примостился в пологой долине среди зелёных просторов #L [ShowCultureName('english')|l]ой#! провинции, а башни его собора издалека видны идущему к ним путнику. Это [current_location.GetRank.GetName|l] паломников: его постоялые дворы переполнены, людям приходится тесниться в амбарах и внутренних двориках, а дороги забиты толпами, говорящими на дюжине разных языков. И все они держат путь в одно и то же место.\n\nГробница святого Томаса Бекета находится в капелле Святой Троицы за главным алтарём. Когда-то это была самая роскошно украшенная усыпальница во всём регионе [ShowScriptedGeographyName('england_geography')]: драгоценные камни, золото, обетные дары всех мастей. [target_ruler.GetName] застывает перед ней. На этом месте человек был сражён за то, что осмелился пойти против короля. Здесь же это неповиновение превратилось в святость. Тут есть о чём задуматься — как к этой истории ни относись."
 pilgrimage_expedition_events.6.a: "Поставим свечу и помолимся у гробницы Бекета."
 pilgrimage_expedition_events.6.b: "Закажем мессу за упокой душ верующих."
 pilgrimage_expedition_events.6.c: "Этому святому молились многие правители. Поедем лучше домой."
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.6.historical_info: "Архиепископ Кентерберийский Томас Бекет был убит 29 декабря 1170 года в своём собственном соборе рыцарями, которые действовали по негласному изволению короля Англии Генриха II. Его гибель потрясла весь христианский мир, и он был канонизирован всего три года спустя, в 1173 году. Генрих II был вынужден принести публичное покаяние у гробницы Бекета, а сама усыпальница быстро стала самым посещаемым местом паломничества в Англии — о ней писал в своих «Кентерберийских рассказах» Джеффри Чосер. За два столетия гробница была украшена невероятной коллекцией драгоценных камней и золота, пожертвованных паломниками: среди них был и огромный самоцвет, подаренный королём Людовиком VII. В 1538 году Генрих VIII приказал уничтожить усыпальницу, а все её сокровища конфисковать в пользу короны."
 pilgrimage_expedition_events.7.title: "Кафедра Святого Патрика"
 pilgrimage_expedition_events.7.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] располагается на пологом холме в Северной #TOOLTIP:REGION,ireland_region,X $tt_op_L$Ирландии$tt_cl_2$, а два местных собора возвышаются над окружающими пашнями на много миль вокруг. По размерам это, конечно, не [ShowLocationName('rome')] и не [ShowLocationName('jerusalem')], но местная древняя история не менее значительна. Перед нами старейшая #TOOLTIP:RELIGIONGROUP,christian,X #L христианская#!#! община в Ирландии — епископская кафедра здесь была основана святым Патриком, когда он прибыл на остров для обращения местных жителей.\n\n[target_ruler.GetName] прибывает ранним утром, когда холмы ещё окутаны туманом. Каноник собора встречает делегацию у ворот и провожает её к месту, где, по преданию, молился сам Патрик. Это святое место удивляет своей скромностью, но роскошь была бы ему не к лицу."
 pilgrimage_expedition_events.7.a: "Посетим мессу в соборе Святого Патрика."
 pilgrimage_expedition_events.7.b: "Оставим пожертвование у часовни Святого Патрика."
 pilgrimage_expedition_events.7.c: "Мы посетили это место с благой целью. Пора возвращаться домой."
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.7.historical_info: "Арма традиционно считается духовной столицей Ирландии. Данный статус закрепился за городом благодаря его связи со святым Патриком, который, по преданию, основал здесь свою главную церковь около 445 года нашей эры. Арманская кафедра стала архиепископским престолом примаса Ирландской церкви — за это положение впоследствии соперничали католический и протестантский соборы, которые по сей день венчают два холма этого города. На фоне Реформации значение Арма было в равной степени символическим (ведь это был храм апостола, обратившего всю Ирландию) и политическим. Поэтому этот город имел большую ценность для правителей, которые стремились продемонстрировать благочестие или солидарность с Ирландской церковью."
 pilgrimage_expedition_events.8.title: "Святилище у дороги"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] прибывает в [current_location.Custom('LR_ACC')|l] [current_location.GetName] — ещё одну путевую обитель на долгом пути благочестия. Какая бы святыня или память о святости ни привлекла к этому месту первых пилигримов, они продолжают стекаться сюда поколение за поколением, даже когда большинство идущих этой дорогой уже позабыли подробности её истории.\n\n[target_ruler.GetName] застывает посреди других странников, таких же изнурённых и покрытых дорожной пылью, как и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] собственная свита, и возносит благодарность за благополучное завершение этой части пути."
 pilgrimage_expedition_events.8.a: "Воздадим благодарность за безопасное путешествие."
 pilgrimage_expedition_events.8.b: "Оставим дары будущим паломникам."
 pilgrimage_expedition_events.8.c: "В этом святом месте мы побывали. Пора возвращаться домой."
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.9.title: "Паломничество оборачивается скорбью"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] [Select_CString(target_ruler.IsFemale, 'умерла', 'умер' )] в пути, и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] паломничество останется незавершённым. Вести об утрате дойдут до #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! нескоро: их принесут домой верные слуги, до последнего вздоха остававшиеся подле [Select_CString(target_ruler.IsFemale, 'своей правительницы', 'своего правителя' )]."
 pilgrimage_expedition_events.9.a: "Нас постигла невосполнимая утрата."
 pilgrimage_expedition_events.17.title: "Паломничество брошено"
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName] поворачивает обратно к дому с неисполненным обетом: паломничество брошено, так и не достигнув цели. Вести о нарушенной клятве дойдут до #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! раньше самого правителя, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] будут помнить об этом ещё долго после того, как утихнут пересуды при дворе."
 pilgrimage_expedition_events.17.a: "Мы возвращаемся со стыдом, предав нашу клятву Господу."
 pilgrimage_expedition_events.10.title: "Ассизский бедняк"
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] преодолевает последний холм на пути к [current_location.Custom('LR_DAT')|l] [current_location.GetName], и перед [Select_CString(target_ruler.IsFemale, 'её', 'его' )] взором вырастает величественная базилика. Два её яруса из бледного камня, встроенные прямо в склон холма, были возведены с поразительной быстротой после кончины человека, в чью честь освящён этот храм, — нищего, который не владел ничем, а теперь повелевает одной из самых великолепных церквей Италии.\n\nВ нижней церкви, высеченной в скале крипте, покоится сам Франциск Ассизский. [target_ruler.GetName] опускается на колени перед гробницей человека, который променял шёлк и золото на верёвочный пояс и босые ноги, а также, по преданию, проповедовал птицам и приручил волка. Противоречие между бедностью святого и воздвигнутым в его память великолепием не укрывается от взора правителя."
 pilgrimage_expedition_events.10.a: "Смиренно опустимся на колени, как сделал бы сам Франциск."
 pilgrimage_expedition_events.10.b: "Подадим милостыню беднякам у входа, в духе самого святого."
 pilgrimage_expedition_events.10.c: "Мы выразили почтение. Пора домой."
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "Франциск Ассизский (1181/2 — 1226) отрёкся от богатства своей семьи ради жизни в нищете. Он основал орден францисканцев на принципах смирения, странствующего проповедничества и служения бедным и больным. Франциск был канонизирован папой Григорием IX в 1228 году, всего через два года после своей кончины, что стало одним из самых быстрых причислений к лику святых в средневековой истории. Возведение базилики Святого Франциска началось в том же году и в основном завершилось к 1253 году; позже её нижнюю и верхнюю церкви украсили фресками, авторами которых считаются Чимабуэ и Джотто. Вопреки тому, что сам святой отвергал материальные блага, Ассизи стал одним из главных центров паломничества в католической Европе, привлекавшим как правителей, так и простых пилигримов."
 pilgrimage_expedition_events.11.title: "Святой покровитель моряков"
 pilgrimage_expedition_events.11.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] начинает пахнуть морем задолго до того, как [target_ruler.GetName] добирается до его стен. Это портовый [current_location.GetRank.GetName|l], выстроенный вокруг одного-единственного великого сокровища. Под романскими сводами базилики покоится гробница Николая Мирликийского, перенесённая сюда местными моряками более ста лет назад из разрушавшихся храмов христианского Востока, который уже не мог их защитить.\n\nРаз в год гробницу вскрывают и собирают прозрачную жидкость, которую источают мощами святого, — #italic манну#!. В её исцеляющую силу одинаково верят как #TOOLTIP:RELIGION,$catholic_tt$,X $tt_op_L$католики$tt_cl_2$, так и #TOOLTIP:RELIGION,$orthodox_tt$,X $tt_op_L$православные$tt_cl_2$. [target_ruler.GetName] разглядывает ковчег с этой святыней, и [Select_CString(target_ruler.IsFemale, 'её', 'его' )] поражает мысль: ни одно другое святое место на всём пути паломничества не почитается столь единодушно обеими ветвями христианского мира одновременно."
 pilgrimage_expedition_events.11.a: "Почтим усыпальницу и получим сосуд со святой манной."
 pilgrimage_expedition_events.11.b: "Закажем мессу по морякам, вернувшим святого домой."
 pilgrimage_expedition_events.11.c: "Святой нас благословил. Теперь мы возвращаемся домой."
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "В 1087 году шестьдесят два моряка из Бари отплыли в Миры Ликийские, находившиеся тогда под угрозой сельджукского завоевания, и извлекли мощи святого Николая, спасая их от возможной утраты или уничтожения. Святыни прибыли в Бари 9 мая 1087 года — это событие и по сей день празднуется как перенесение мощей, — и для их хранения была возведена базилика Святого Николая, чью крипту в 1089 году освятили в присутствии папы Урбана II. С момента прибытия реликвий вокруг костей продолжала образовываться прозрачная жидкость, которую верующие называют #italic манной#!; архиепископ Бари собирает её раз в год. Будучи покровителем моряков, торговцев и детей, а также одним из немногих святых, почитаемых с одинаковым благоговением как в католическом, так и в православном мире, Николай превратил Бари в центр паломничества, не имеющий себе равных во всей Италии."
 pilgrimage_expedition_events.12.title: "Ангельское освящение"
 pilgrimage_expedition_events.12.desc: "Бенедиктинское аббатство в [current_location.Custom('LR_PREP')|l] [current_location.GetName] примостилось на опушке дремучего леса в верховьях #TOOLTIP:CULTUREGROUP,swiss_group,X #L швейцарских#!#! земель. Его облачённые в чёрные рясы монахи ведут свою историю от безмолвного отшельника, зверски убитого здесь разбойниками много поколений назад. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'слышала', 'слышал' )] это предание ещё в детстве: местная часовня была освящена не епископской рукой, но самим Христом, который сошёл сюда вместе с хором ангелов и святых накануне дня её торжественного открытия.\n\nВ капелле Богоматери высится предмет того самого первого, оспариваемого освящения — небольшая статуя Девы Марии, потемневшая от многовековой копоти церковных свечей до глубокого чёрного цвета. Пилигримы со всех немецкоязычных земель склоняются перед ней в неподвластной воображению бесконечной веренице."
 pilgrimage_expedition_events.12.a: "Преклоним колени перед Чёрной Мадонной в молчаливой молитве."
 pilgrimage_expedition_events.12.b: "Сделаем пожертвование в знаменитую библиотеку и скрипторий аббатства."
 pilgrimage_expedition_events.12.c: "Хватит с нас этих тёмных лесов. Пойдём дальше."
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "Аббатство Эйнзидельн ведёт свою историю от отшельника Майнрада, который поселился в этом лесу и был убит разбойниками в 861 году. Официальный монастырь был основан на этом месте в 934 году монахом Эберхардом. Согласно старинному преданию, местная часовня была чудесным образом освящена самим Христом в ночь на 14 сентября 948 года — это утверждение впоследствии официально признал папа Лев VIII. Местная статуя Чёрной Мадонны на протяжении веков привлекает паломников: благодаря ей Эйнзидельн стал одним из самых посещаемых центров поклонения Богородице во всём немецкоязычном мире."
 pilgrimage_expedition_events.13.title: "Ясная гора"
 pilgrimage_expedition_events.13.desc: "#italic Ясная Гора#! показывается над равниной задолго до того, как [target_ruler.GetName] добирается до монастырских врат; её белые стены купаются в лучах солнца — именно такого эффекта и добивались воздвигшие её монахи-паулины. Внутри, за стеной из обетного серебра и горящих свечей, покоится лик Тёмнолицей Мадонны, превративший этот скромный #TOOLTIP:CULTUREGROUP,polish_group,X #L польский#!#! [current_location.GetRank.GetName|l] в центр притяжения для паломников со всего севера.\n\n[target_ruler.GetName] внимательно вглядывается в лик Богоматери и замечает их: два параллельных шрама на её правой щеке — старые раны, которые так и не смогла полностью сгладить ни одна реставрация. Когда-то давно клинок грабителя рассёк икону, и монахи, пытавшиеся позже переписать святыню, раз за раз обнаруживали, что порезы проступают сквозь свежую краску, пока наконец не оставили попыток скрыть то, что было содеяно."
 pilgrimage_expedition_events.13.a: "Почтим икону и её неисцелимые раны."
 pilgrimage_expedition_events.13.b: "Пожертвуем золото на укрепления, чтобы никто больше не смог ограбить монастырь."
 pilgrimage_expedition_events.13.c: "Посмотрели Ясную Гору, а теперь пора домой."
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "Паулинский монастырь на Ясной Горе был основан в 1382 году князем Владиславом Опольчиком, который привёз с собой икону Пресвятой Девы с Младенцем, написанную в византийском стиле и уже тогда считавшуюся чудотворной. На Пасху 1430 года отряд гуситских налётчиков из Богемии, Моравии и Силезии ворвался в монастырь: они разбили икону на части и дважды рассекли лик Богоматери саблей. Реставраторы при королевском дворе Владислава II Ягайло в Кракове восстановили полотно, однако шрамы проступали сквозь каждый новый слой краски, и в итоге их решили оставить как постоянную, намеренную деталь изображения. Ченстоховская икона Божией Матери стала главной мариинской святыней Польши, а её отмеченный шрамами лик на протяжении веков воспроизводился на иконах по всему региону."
 pilgrimage_expedition_events.14.title: "Престол святого Иштвана"
 pilgrimage_expedition_events.14.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] расположился у самой излучины Дуная; его соборный холм возвышается над рекой, которая некогда обозначала рубеж христианской Европы. Здесь, в часовне, которую с тех пор не раз перестраивали, Иштван Святой родился, принял крещение и в один из зимних дней на рубеже тысячелетий был увенчан короной как первый христианский король своего народа.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'удостоилась', 'удостоился' )] приёма у архиепископа [current_location.Custom('LR_GEN')|l] [current_location.GetNameWithNoTooltip], примаса Венгрии и преемника кафедры, основанной самим Иштваном. Архиепископ повествует о молодом короле, который предпочёл крещение старым богам, воздвиг этот храм ещё до того, как заложил свой дворец, и был причислен к лику святых спустя всего несколько десятилетий после своей кончины — именно потому, что осознавал: христианская корона должна опираться на христианскую церковь."
 pilgrimage_expedition_events.14.a: "Почтим память святого Иштвана тихой молитвой."
 pilgrimage_expedition_events.14.b: "Проведём долгую беседу с архиепископом-примасом Венгрии."
 pilgrimage_expedition_events.14.c: "Достойный визит для христианского правителя. Пора в дорогу."
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "Иштван I Святой родился около 975 года в Эстергоме и был коронован там в канун Рождества 1000 года. Это событие ознаменовало официальное рождение христианского королевства Венгрия. В 1001 году Иштван основал старейшее в стране архиепископство Эстергомское. С тех пор его архиепископы неизменно носят титул примаса Венгрии. Эстергом служил политической и религиозной столицей королевства вплоть до середины XIII века, а канонизация самого Иштвана в 1083 году окончательно закрепила за городом статус духовного сердца венгерского христианства."
 pilgrimage_expedition_events.15.title: "Хорватский Назарет"
 pilgrimage_expedition_events.15.desc: "На холме над [current_location.Custom('LR_INST')|l] [current_location.GetName], откуда открывается вид на залив, стоит скромная францисканская церковь. Она возведена у пустого места, где, как утверждают здешние паломники, некогда находилось нечто необычайное. По их словам, на протяжении трёх лет на этой земле покоился сам дом Святого Семейства, перенесённый ангелами целиком из Назарета, когда на Святой Земле стало слишком опасно, а затем продолжил своё чудесное путешествие в итальянское Лорето.\n\n[target_ruler.GetName] видит здесь икону, которую папа римский послал в утешение местным жителям в связи с отбытием святыни. Богоматерь, кормящая младенца Христа, считается творением самого апостола Луки. С тех пор этот образ из поколения в поколение привлекает паломников на этот склон холма — святилище в честь того, чего здесь больше нет, но что каким-то образом всё ещё незримо присутствует."
 pilgrimage_expedition_events.15.a: "Поклонимся иконе Богоматери Трсатской."
 pilgrimage_expedition_events.15.b: "Закажем в святилище у моря мессу за безопасное путешествие."
 pilgrimage_expedition_events.15.c: "Дом Марии перенёсся в Лорето. Перенесёмся и мы — домой."
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "Согласно преданию, Святой дом из Назарета, обитель Девы Марии, был перенесён ангелами на холм Трсат над Риекой 10 мая 1291 года и оставался там на протяжении трёх лет, после чего 10 декабря 1294 года продолжил свой путь в итальянское Лорето. Князь Никола I Франкопан воздвиг на месте хижины первую церковь. В 1367 году папа Урбан V в утешение в связи с отбытием Святого дома прислал святилищу икону Богоматери с Младенцем, традиционно приписываемую кисти святого Луки. Со следующего столетия стражами этого святого места стали монахи-францисканцы. Легенда закрепила за городом его негласное и вечное прозвище — Хорватский Назарет."
 pilgrimage_expedition_events.16.title: "Король и мученик"
 pilgrimage_expedition_events.16.desc: "Собор в [current_location.Custom('LR_PREP')|l] [current_location.GetName] высится суровой и серой громадой на фоне северного неба. Он возведён прямо над песчаной косой, где был похоронен король Олав Харальдсон. Спустя чуть более чем год после его кончины могила была вскрыта, и к изумлению всех присутствующих, его тело оказалось нетленным. Предание гласит, что его волосы и ногти продолжали расти в тёмной земле, а из гроба, откуда должен был исходить трупный смрад, струилось сладостное благоухание.\n\n[target_ruler.GetName] стоит перед усыпальницей Олава Харальдсона — некогда предводителя викингов, который пал в бою, пытаясь силой насадить христианство в королевстве, не желавшем этого, и который всего через год после смерти был провозглашён святым всеобщим признанием, без участия далёкого папы римского. [target_ruler.GetNameWithNoTooltip] размышляет о странной судьбе этого святого: он обрёл святость не кротким благочестием, но мечом и смертью за дело, которое оказалось праведным лишь спустя многие годы."
 pilgrimage_expedition_events.16.a: "Почтим нетленного короля в его усыпальнице."
 pilgrimage_expedition_events.16.b: "Олав преподал нам урок: насаждать веру мечом — всё равно праведное дело."
 pilgrimage_expedition_events.16.c: "Какое холодное и святое место. Отправимся домой."
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "Король Норвегии Олав Харальдсон погиб при Стиклестаде 29 июля 1030 года в битве за возвращение своего престола и завершение насильственной христианизации своего королевства. Когда спустя год и пять дней, 3 августа 1031 года, его могила была вскрыта, епископ Гримкель обнаружил, что тело правителя осталось нетленным. На основании одного лишь этого открытия он провозгласил Олава святым — эта местная канонизация впоследствии была официально подтверждена папой Александром III в 1164 году. Нидаросский собор, воздвигнутый над его усыпальницей, стал главным центром паломничества на всём севере, привлекая верующих со всей Скандинавии и из других земель по сети дорог, которые и по сей день известны как Тропы святого Олава."
 pilgrimage_expedition_events.18.title: "Горный перевал"
 pilgrimage_expedition_events.18.desc: "Дорога уходит вверх, в бесплодные, обдуваемые ветрами земли, а путь сужается до тропы на самом склоне горы. [target_ruler.GetName] останавливается на развилке. Первый путь — долгий, в обход крутого подъёма. Второй — прямой: однако местные пастухи говорят, что неподготовленные путники на нём часто погибают.\n\n[target_ruler.GetSheHe|U] прикидывает, сколько времени уйдёт на преодоление горы. Каждый день, потраченный на поиски обхода, будет удлинять и без того затянувшийся переход."
 pilgrimage_expedition_events.18.a: "Наймём местных проводников, знающих безопасные тропы."
 pilgrimage_expedition_events.18.b: "Пойдём вперёд без них, уповая на веру и собственные силы."
 pilgrimage_expedition_events.18.c: "Повернём назад и пойдём по длинной дороге в обход горы."
 pilgrimage_expedition_events.19.title: "Морской шторм"
 pilgrimage_expedition_events.19.desc: "Небо внезапно темнеет, и уже через час корабль захлёстывают огромные волны. [target_ruler.GetName] не успевает нащупать опору и с силой ударяется о мачту, а в это время палуба под [Select_CString(target_ruler.IsFemale, 'её', 'его' )] ногами вздымается словно живой зверь.\n\nВ трюме паломники хватаются за всё, что крепко прибито, и молятся на десятках разных наречий. Им остаётся лишь ждать, пока разъярённое море насытится их страданиями."
 pilgrimage_expedition_events.19.a: "Укроемся в трюме и будем надеяться, что корабль выдержит."
 pilgrimage_expedition_events.19.b: "Соберём спутников на палубе и будем молиться на протяжении шторма."
 pilgrimage_expedition_events.19.afloat_tt: "Команде удаётся удержать корабль на плаву"
 pilgrimage_expedition_events.19.off_course_tt: "Из-за шторма корабль сильно сбивается с курса"
 pilgrimage_expedition_events.19.faith_protects_tt: "Наша вера помогает нам пережить шторм"
 pilgrimage_expedition_events.19.piety_lacking_tt: "Нашего благочестия недостаточно, чтобы утихомирить шторм"
 pilgrimage_expedition_events.20.title: "Переправа"
 pilgrimage_expedition_events.20.desc: "Дорога резко обрывается у реки, которая стала полноводной и мутной после недавних дождей. Брод полностью скрылся под бурным потоком, который запросто повалит и утянет за собой любого коня. С противоположного берега за вами наблюдает паромщик. Он не спешит плыть навстречу, пока не увидит блеск звонкой монеты.\n\n[target_ruler.GetName] переводит взгляд с реки на паромщика и обратно. Ни то, ни другое сегодня не внушает особого доверия."
 pilgrimage_expedition_events.20.a: "Заплатим паромщику за безопасную переправу."
 pilgrimage_expedition_events.20.b: "Пересечём реку вброд и сбережём деньги."
 pilgrimage_expedition_events.21.title: "Болотная лихорадка"
 pilgrimage_expedition_events.21.desc: "Дорога на мили вокруг погружается в стоячую воду, а воздух наполняется полчищами гнуса и запахом разложения. За считанные дни обычный кашель перерастает в сильную лихорадку — и вот уже многих заболевших приходится тащить на себе, идти они не в силах.\n\n[target_ruler.GetName] обводит взглядом поредевшие ряды спутников и задаётся вопросом, сколькие из них отправлялись в паломничество, а нашли вместо этого погибель."
 pilgrimage_expedition_events.21.a: "Поспешим вперёд, чтобы скорее оставить болота позади."
 pilgrimage_expedition_events.21.b: "Сделаем привал и дадим больным выздороветь."
 pilgrimage_expedition_events.22.title: "Зимнее бездорожье"
 pilgrimage_expedition_events.22.desc: "Перевал впереди завалило снежными сугробами выше человеческого роста, и здешние крестьяне в один голос твердят: до весны пройти дальше не выйдет. [target_ruler.GetName] не хочет терять целые месяцы из-за капризов природы, но у горы свои планы.\n\nНеподалёку есть городок, где можно разместить весь отряд, если [Select_CString(target_ruler.IsFemale, 'её', 'его' )] кошель выдержит такие траты. С другой стороны, за хорошую цену можно нанять проводников. Они божатся, что способны провести путников сквозь метель даже в такую пору."
 pilgrimage_expedition_events.22.a: "Переждём зиму в ближайшем городке."
 pilgrimage_expedition_events.22.b: "Наймём проводников и пробьёмся сквозь снежные завалы."
 pilgrimage_expedition_events.23.title: "Гостеприимство лорда"
 pilgrimage_expedition_events.23.desc: "Весть о приближении паломников разнеслась быстрее, чем двигался сам отряд. Местный лорд самолично выезжает навстречу, чтобы их поприветствовать, и [target_ruler.GetName] получает приглашение разделить с ним трапезу перед продолжением пути. Гостеприимство хозяина бьёт через край — он явно жаждет, чтобы его щедрость запомнили.\n\n[target_ruler.GetName] прекрасно видит, что кроется за этим приглашением — возможность снискать почёт и благочестие, если отнестись к нему со всей учтивостью."
 pilgrimage_expedition_events.23.a: "С радостью примем приглашение."
 pilgrimage_expedition_events.23.b: "Отклоним приглашение, предпочтя уединённую молитву."
 pilgrimage_expedition_events.24.title: "Плата враждебному лорду"
 pilgrimage_expedition_events.24.desc: "Путь лежит через владения лорда, который считает #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! одним из своих врагов, и его стража уже выстроилась в ряд на границе у таможенной заставы. [target_ruler.GetName] напрасно надеется беспрепятственно пройти по этим землям — дорогу отряду преграждают пики.\n\nСборщик пошлин объявляет плату, которая выглядит скорее как оскорбление, и выжидательно смотрит на гостей, словно проверяя, чего стоит их гордость."
 pilgrimage_expedition_events.24.a: "Заплатим объявленную пошлину."
 pilgrimage_expedition_events.24.b: "Пойдём напролом силами того отряда, что у нас есть."
 pilgrimage_expedition_events.24.c: "Свернём в сторону и найдём более долгий обходной путь."
 pilgrimage_expedition_events.25.title: "Иная вера"
 pilgrimage_expedition_events.25.desc: "Путь пролегает мимо святилища, которого чтят приверженцы #L [current_location.GetDominantReligion.GetAdjective|l]ой#! веры, чьи иконы и обряды кажутся нам чуждыми. [target_ruler.GetName] наблюдает за местными верующими, которые совершают свои молитвы, — те косятся на проходящий отряд с любопытством и лёгким недоверием.\n\nУ паломников есть давняя привычка спорить о вере с каждым, кто готов слушать. [target_ruler.GetName] размышляет, стоит ли сегодня поддаться этому искушению."
 pilgrimage_expedition_events.25.a: "Вступим с местными в спор об истинной вере."
 pilgrimage_expedition_events.25.b: "Проявим осторожность и пройдём мимо без лишнего шума."
 pilgrimage_expedition_events.26.title: "Разбойники на дороге"
 pilgrimage_expedition_events.26.desc: "На одном из участков пути дорога ныряет в глухую чащу, где не действует закон ни одного лорда, способный защитить путников. Не успевает отряд опомниться, как из лесной тени высыпают вооружённые оборванцы. Сразу видно, для них грабёж — дело привычное. [target_ruler.GetName] быстро оценивает их силы. Для мелкой банды их, пожалуй, многовато, а для настоящего войска — маловато.\n\nИх атаман выступает вперёд и объявляет цену за проход; суровый голос разбойника красноречиво говорит о том, что ждёт отряд в случае отказа."
 pilgrimage_expedition_events.26.a: "Откупимся от них и покончим с этим."
 pilgrimage_expedition_events.26.b: "Примем бой и сразимся за честь паломничества."
 pilgrimage_expedition_events.27.title: "Ещё больше паломников"
 pilgrimage_expedition_events.27.desc: "Молва о паломничестве венценосной особы опережает сам отряд. Когда [target_ruler.GetName] добирается до очередной развилки, там уже толпится убогая вереница простых богомольцев, надеющихся пройти остаток пути под крылом государевой стражи.\n\nСреди них немало семей с детьми и дряхлых старцев, которые едва ли одолеют дорогу в одиночку. [target_ruler.GetName] не в силах кормить эту прорву людей до скончания веков, но прогнать их сейчас — значит бросить на произвол судьбы."
 pilgrimage_expedition_events.27.a: "Примем страждущих под свою защиту."
 pilgrimage_expedition_events.27.b: "Прогоним их, чтобы не задерживаться в пути."
 pilgrimage_expedition_events.29.title: "Корсары у побережья"
 pilgrimage_expedition_events.29.desc: "Низкий тёмный силуэт корабля режет горизонт, а его вёсла хищно сверкают на солнце. Он приближается к судну паломников быстрее, чем пристало бы любому честному торговцу. Задолго до окрика матроса на мачте [target_ruler.GetName] узнаёт в нём пиратский корабль — а поблизости ни гавани, ни спасительной суши, ни единой живой души на помощь.\n\n[target_ruler.GetName] созывает на палубу всех боеспособных людей из своей гвардии и тщательно взвешивает: выдержат ли они натиск или проще отдать корабельное добро без кровопролития."
 pilgrimage_expedition_events.29.a: "Возьмёмся за оружие и дадим отпор пиратам."
 pilgrimage_expedition_events.29.b: "Пожертвуем припасами и будем надеяться, что этого хватит."
 pilgrimage_expedition_events.30.title: "Требование выкупа"
 pilgrimage_expedition_events.30.desc: "Поскольку дорога сильно проредила свиту, [target_ruler.GetName] становится лёгкой добычей — и кое-кто на пути это уже заметил. Не успели стражники выстроить оборону, как отряд окружили вооружённые разбойники. Их предводитель называет цену за свободу правителя таким же будничным тоном, как торговец называет стоимость хлеба.\n\nСилы явно неравны, и выпутаться из этой передряги будет непросто."
 pilgrimage_expedition_events.30.a: "Заплатим требуемый выкуп."
 pilgrimage_expedition_events.30.b: "Попытаемся сбежать под покровом ночи."
 pilgrimage_expedition_events.28.title: "Пустые закрома"
 pilgrimage_expedition_events.28.desc: "Припасы иссякли вскоре после того, как позади остался последний приличный городишко. Желудки гвардейцев пусты, а в мешках из-под хлеба гуляет ветер. Сразу видно, что [target_ruler.GetName] знает о походах лишь понаслышке: голоду нет дела до того, насколько свят ваш путь.\n\nК счастью, этот край не совсем бесплоден: поблизости есть поля, сады и деревенский рынок. Вопрос лишь в том, переступит ли отряд через свою гордость, чтобы потратить драгоценные дни и звонкое золото на пропитание."
 pilgrimage_expedition_events.28.a: "Разошлём людей по округе на сбор припасов."
 pilgrimage_expedition_events.28.b: "Скупим все припасы по любой цене, которую назовут."
 pilgrimage_expedition_events.28.c: "Выбора нет. Придётся повернуть назад."
 pilgrimage_resupply_light: "Заплатим местным за свежих коней, провизию и наёмных рабочих."
 pilgrimage_resupply_heavy: "Не пожалеем средств, чтобы полностью пополнить запасы и усилить свиту."
