 pilgrimage_expedition_events.9.a: "Мы будем скорбеть о нашей утрате."
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] скончался в пути, и паломничество осталось неоконченным. Весть о потере дойдёт до [ROOT.GetCountry.GetName] не скоро — её принесут домой те слуги, что оставались рядом с [target_leader.GetHerHis] стороны до последнего часа."
 pilgrimage_expedition_events.9.title: "Паломничество, окончившееся скорбью"
