l_russian:
 hajj_caravan_events.1.title: "Дорога в Мекку"
 hajj_caravan_events.1.desc: "Караван собран, молитвы прочитаны, и начинается долгий путь в Хиджаз. Толпы людей заполняют улицы, чтобы проводить нас, — знак того, что этот род по-прежнему исполняет обязанности перед верой. Мекка находится в нескольких месяцах пути, за пустынями и морями, беспощадными к неподготовленным."
 hajj_caravan_events.1.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] отправляется в путь одновременно как властитель и слуга Аллаха."
 hajj_caravan_events.1.b: "Снабдим караван всем необходимым и соберём охрану на время пути."
 hajj_caravan_events.1.c: "Снабдим и защитим караван, а перед нами понесут #italic махмал#!."
 hajj_caravan_events.1.historical_info: "За время своего правления (786–809 гг.) аббасидский халиф Харун ар-Рашид девять раз совершал паломничество из Багдада, причём часть пути он проходил пешком в знак благоговения. Его набожность стала образцом, которому на протяжении многих веков стремились подражать благочестивые правители."
 hajj_caravan_events.display_wealth: "Понесём #italic махмал#! открыто, чтобы все могли увидеть богатство [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 hajj_caravan_events.guards_up_tt: "Вооружённый конвой каравана усиливается (#G +25#! к вооружённому конвою)"
 hajj_caravan_events.guards_down_15_tt: "Вооружённый конвой каравана слабеет (#R -15#! к вооружённому конвою)"
 hajj_caravan_events.guards_down_20_tt: "Вооружённый конвой каравана слабеет (#R -20#! к вооружённому конвою)"
 hajj_caravan_events.splendor_up_15_tt: "Роскошь каравана растёт (#G +15#! к роскоши)"
 hajj_caravan_events.splendor_up_20_tt: "Роскошь каравана растёт (#G +20#! к роскоши)"
 hajj_caravan_events.splendor_up_30_tt: "Роскошь каравана растёт (#G +30#! к роскоши)"
 hajj_caravan_events.splendor_down_10_tt: "Роскошь каравана падает (#G -10#! к роскоши)"
 hajj_caravan_events.splendor_down_15_tt: "Роскошь каравана падает (#G -15#! к роскоши)"
 hajj_caravan_events.splendor_down_20_tt: "Роскошь каравана падает (#G -20#! к роскоши)"
 hajj_caravan_events.splendor_down_25_tt: "Роскошь каравана падает (#G -25#! к роскоши)"
 hajj_caravan_events.weakened_tt: "Караван вынужден идти без отдыха, что делает его уязвимым перед лицом предстоящих испытаний"
 hajj_caravan_events.recovered_tt: "Отдохнув и напившись, караван восстанавливает силы"
 hajj_caravan_events.mahmal_lost_tt: "Махмал был потерян во время бури"
 hajj_caravan_events.mahmal_gained_tt: "Теперь караван несёт махмал, демонстрирующий богатство иноземным хозяевам на пути, но его можно потерять из-за налётчиков или бурь"
 hajj_caravan_events.2.title: "Ворота Мекки"
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. В воздухе древнего порта [jeddah_location.GetRank.GetName|l] смешались запахи #TOOLTIP:GOODS,salt,X #L соли#!#!, #TOOLTIP:GOODS,incense,X благовоний#! и пота десяти тысяч паломников, прибывших сюда раньше нас по морю. Торговцы наперебой предлагают провизию по двойным ценам, а учёные спорят о правильном порядке обрядов. #TOOLTIP:LOCATION,mecca,X #L Мекка#!#! уже близко, до неё меньше трёх дней пути по суше, но караван устал, а припасы на исходе. Мы можем сразу двинуться дальше или сначала потратить день на отдых и пополнение запасов."
 hajj_caravan_events.2.a: "Отдохнём здесь и войдём в священный город со свежими силами."
 hajj_caravan_events.2.b: "Мы зашли слишком далеко, чтобы останавливаться. Продолжим путь к Мекке."
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "Халиф Усман ибн Аффан, третий из праведных халифов, в 646 году назначил Джидду официальным портом для паломников, прибывающих по морю. С тех пор город сохраняет эту роль в организации хаджа."
 hajj_caravan_events.3.title: "Кааба"
 hajj_caravan_events.3.desc: "Перед нами открывается Большая мечеть, а в её сердце возвышается Кааба — древняя, укрытая чёрным покровом, старше самой памяти. Вокруг неё неспешно движутся по кругу верующие в белых одеждах: тысячи людей со всех уголков света, где слышен призыв к молитве. Здесь султан и пастух одеты одинаково. Путь окончен. Осталось только решить, какими паломниками мы станем. То, что предлагают здесь, ещё целое поколение будет отзываться эхом на рынках, в мечетях и при дворах мусульманского мира."
 hajj_caravan_events.3.a: "Щедро раздадим золото. Пусть ни один паломник не останется здесь голодным."
 hajj_caravan_events.3.b: "Пожертвуем средства мечетям и учёным, оберегающим священный город."
 hajj_caravan_events.3.c: "Совершим обряды тихо. Пусть это останется между нами и Всевышним."
 hajj_caravan_events.3.d: "[ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] обеспечивает нас всем необходимым."
 hajj_caravan_events.3.e: "Не пожалеем средств. Украсим караван золотом и шёлком."
 hajj_caravan_events.3.historical_info: "Самым знаменитым королевским хаджем в истории стало паломничество Мансы Мусы I из Мали в 1324 году. Он отправился в путь со свитой из шестидесяти тысяч человек и с таким количеством золота, что мог щедро раздавать его на каждой остановке, из-за чего цены на золото в Северной Африке и на Ближнем Востоке рухнули и не могли оправиться около десяти лет. Визит Мансы Мусы ко двору египетского султана подробно описали арабские летописцы, отметившие как его исключительную щедрость, так и вызванные ею экономические потрясения."
 hajj_caravan_events.4.title: "Город тысячи минаретов"
 hajj_caravan_events.4.desc: "#TOOLTIP:LOCATION,cairo,X #L Каир#!#! огромен и стар и проглатывает караван, стоит нам миновать северные ворота: кругом шум, пряности, запах дубящейся кожи и жареного мяса. Над крышами возвышается великая мечеть аль-Азхар, чьи учёные считаются лучшими в [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective|l]ом мире. Наш правитель мог бы задержаться, чтобы поучиться у них, или просто пополнить запасы и двинуться дальше, в Мекку."
 hajj_caravan_events.4.a: "Посидим с учёными аль-Азхара, пока есть возможность."
 hajj_caravan_events.4.b: "Мы пришли ради Мекки, а не Каира. Пополним запасы и двинемся дальше."
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "Историк и учёный Ибн Хальдун поселился в Каире в 1382 году, где преподавал в аль-Азхаре и занимал должность главного маликитского судьи города. Его слава привлекала правителей и учёных со всего мусульманского мира, стремившихся послушать его лекции или получить совет."
 hajj_caravan_events.5.title: "Старая столица"
 hajj_caravan_events.5.desc: "Багдад когда-то был величайшим городом мира, столицей халифата, чьи земли простирались от Атлантического океана до #TOOLTIP:SUB_CONTINENT,central_asia,X #L Центральной Азии#!#!, пока монголы не сожгли его дотла. Теперь здесь тише: рынки стали меньше, а учёные не столь ревностны, но гробницы святых усопших по-прежнему привлекают паломников со всего востока, и наш правитель мог бы почтить их память, прежде чем повернуть на юг, где находится [ShowAreaName('hedjaz_area')]."
 hajj_caravan_events.5.a: "Посетим святыни и разыщем местных учёных."
 hajj_caravan_events.5.b: "Почтим память и двинемся дальше."
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "Зубайда бинт Джафар, жена аббасидского халифа Харуна ар-Рашида, профинансировала строительство Дарб Зубайды, дороги для паломников с колодцами, резервуарами и постоялыми дворами, протянувшейся от окрестностей Багдада до самой Мекки. Она сделала это после того, как сама увидела, насколько труден путь."
 hajj_caravan_events.6.title: "Дамасский привал"
 hajj_caravan_events.6.desc: "Сады уступают место крепостным стенам #TOOLTIP:LOCATION,damascus,X $tt_op_L$Дамаска$tt_cl_2$, одного из старейших городов, сохранившихся до наших дней, а его Большая мечеть известна во всём мусульманском мире. Молитва под куполом мечети и беседы с правоведами, заполняющими её дворы, заняли бы много дней, которых у нас, возможно, нет; караван мог бы в это время напоить животных, пополнить запасы и уйти к утру."
 hajj_caravan_events.6.a: "Задержимся ненадолго среди здешних мечетей и правоведов."
 hajj_caravan_events.6.b: "Напоим животных и уйдём к рассвету."
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "В 50-х годах XIV века османский султан Сулейман Великолепный приказал построить в Дамаске комплекс Такия ас-Сулеймания — мечеть, постоялый двор и общественную столовую, возведённые специально для того, чтобы размещать и кормить тысячи паломников, собираюшихся там каждый год перед отправлением хаджского каравана в Мекку."
 hajj_caravan_events.7.title: "Хаджи"
 hajj_caravan_events.7.desc: "Караван возвращается домой: его припасы сократились, а паломники изменились. Молва уже обогнала верблюдов, и толпы собираются, чтобы встретить правителя, который стоял перед Каабой и вернулся, чтобы рассказать об этом. С этого дня наш правитель носит титул Хаджи — заслуженный, а не дарованный, и он останется с ним навсегда."
 hajj_caravan_events.7.a: "Да будет известно: [ROOT.GetCountry.GetReligion.GetGodName] был к нам милостив, и мы проделали путь в Мекку и обратно."
 hajj_caravan_events.7.historical_info: "Аския Мухаммад Туре из Сонгайской империи совершил хадж в 1496–1497 годах со свитой в несколько сотен человек и с целым состоянием в золоте, которое он раздавал в качестве милостыни по пути. В Каире аббасидский претендент на халифат пожаловал ему титул халифа Судана, и домой он вернулся аль-Хаджи, а его власть над исламом Западной Африки была подтверждена паломничеством."
 hajj_caravan_events.8.title: "Смерть на пути в Мекку"
 hajj_caravan_events.8.desc: "До каравана доходит весть о смерти нашего правителя в пути, вдали от дома и ещё дальше от Каабы. Без государя во главе караван не может продолжать путь. Он распадается: одни паломники поворачивают назад, другие идут дальше в одиночку, чтобы завершить обряды, ради которых отправились."
 hajj_caravan_events.8.a: "Да сжалится [ROOT.GetCountry.GetReligion.GetGodName] над их душами."
 hajj_caravan_events.hire_escorts: "Наймём больше стражников для предстоящего пути."
 hajj_caravan_events.adorn: "Украсим караван знамёнами и шёлком, а затем подождём."
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.9.title: "Разбойники на дороге"
 hajj_caravan_events.9.desc: "Из дрожащего марева появляются всадники пустыни с поднятыми копьями, описывающие круги вокруг колонны. Они следили, как мы пересекаем их пески, и решили, что караван стоит захватить. Наша охрана смыкает ряды, но исход сражения на открытой пустыне никогда не бывает предрешён."
 hajj_caravan_events.9.a: "Заплатим дань. Серебро дешевле крови."
 hajj_caravan_events.9.b: "Пусть охрана отработает своё жалованье."
 hajj_caravan_events.9.b.chance_tt: "Охрана может не отразить налётчиков, и вместо [Concept('prestige', 'престижа')|e] мы потеряем стражников и роскошь."
 hajj_caravan_events.9.c: "Это паломники, идущие в Мекку. Их охраняет [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.9.c.chance_tt: "Мольбы могут не сработать, и вместо [Concept('prestige', 'престижа')|e] и [Concept('legitimacy', 'легитимности')|e] мы потеряем стражников и роскошь."
 hajj_caravan_events.10.title: "Пересохшие колодцы"
 hajj_caravan_events.10.desc: "Колодцы впереди пусты: на их дне потрескавшаяся грязь, а воду вычерпал до последней капли какой-то караван, прошедший здесь за несколько дней до нас. Бурдюки на боках верблюдов уже полегчали, животные ревут от жажды, а беспощадное солнце поднимается всё выше. Проводники начинают бормотать о том, как далеко до следующего хорошего источника."
 hajj_caravan_events.10.a: "Лучше задержаться, чем погибнуть. Повернём к дальнему колодцу."
 hajj_caravan_events.10.b: "Следующего источника хватит. Продолжим путь."
 hajj_caravan_events.11.title: "Самум"
 hajj_caravan_events.11.desc: "Горизонт окрашивается в цвет ржавчины, а ветер начинает завывать. Стена песка обрушивается на колонну, и через мгновение не видно уже ни дороги, ни неба, ни всадника впереди — только жгучая тьма."
 hajj_caravan_events.11.a: "Сбросим поклажу, закроем лица платками. Переждём бурю."
 hajj_caravan_events.11.b: "Свяжем колонну верёвкой и двинемся сквозь бурю."
 hajj_caravan_events.12.title: "Лихорадка в караване"
 hajj_caravan_events.12.desc: "Всё начинается с нескольких заболевших, но к утру лихорадка уже в каждой палатке: она за считаные дни выводит из строя даже самых сильных. У тесной группы паломников нет шансов избежать заражения."
 hajj_caravan_events.12.a: "Остановимся. Ни один паломник не умрёт брошенным."
 hajj_caravan_events.12.b: "Погода не станет ждать больных."
 hajj_caravan_events.13.title: "Цена, которую назначил [toll_owner.GetGovernment.GetRulerTitle]"
 hajj_caravan_events.13.desc: "Дорога впереди пересекает земли местного лорда, и его всадники лениво преграждают путь, сидя в сёдлах, уперев копья в землю. Навстречу выходит улыбающийся глашатай: за воду полагается пошлина, за проход — пошлина, даже за песок под нашими ногами — тоже пошлина, и пока она не будет уплачена, караван не сдвинется с места. Позади нас на жаре ждут паломники, наблюдая, из чего сделан их правитель."
 hajj_caravan_events.13.a: "Заплатим и покончим с этим."
 hajj_caravan_events.13.b: "Мы ему ничего не должны. Объедем его колодцы."
 hajj_caravan_events.13.c: "Пусть [toll_owner.GetGovernment.GetRulerTitle] увидит наш караван и пересмотрит пошлину."
 hajj_caravan_events.14.title: "Зелёный привал"
 hajj_caravan_events.14.desc: "Впереди из песка поднимаются пальмы, под ними бьёт родник, а вокруг собираются люди, выходящие навстречу паломникам с финиками и прохладной водой. Приютить идущих к священному городу — само по себе акт благочестия, и предлагается он безвозмездно."
 hajj_caravan_events.14.a: "Дадим каравану как следует отдохнуть и напиться, прежде чем двинемся дальше."
 hajj_caravan_events.14.b: "Поделимся припасами с бедняками оазиса."
 hajj_caravan_events.14.c: "Поблагодарим их и продолжим путь."
 hajj_caravan_events.15.title: "Учёные на дороге"
 hajj_caravan_events.15.desc: "К каравану присоединяется группа странствующих учёных, направляющихся в тот же священный город, с сумками, полными книг. Вечерами у костров они до поздней ночи рассуждают о праве и Писании."
 hajj_caravan_events.15.a: "Присядем среди них и послушаем."
 hajj_caravan_events.15.b: "Устроим с ними дебаты."
 hajj_caravan_events.16.title: "Сезон упущен"
 hajj_caravan_events.16.desc: "Мы прибываем слишком поздно. Год сменился, и вместе с ним нас миновал и день Арафа — часы между полуднем и закатом, когда каждый паломник сезона должен был вместе с остальными стоять на той равнине у подножия горы Милосердия, молясь и прося прощения. По слову Пророка, хадж — не что иное, как этот единственный день. Пропустишь его — и никакой обряд, совершённый после, не завершит паломничества. Каравану остаётся лишь разойтись и вернуться домой, а путь придётся начинать заново в следующем году."
 hajj_caravan_events.16.a: "Мы слишком долго медлили. Придётся начинать всё заново."
 hajj_caravan_events.17.title: "Буря"
 hajj_caravan_events.17.desc: "Небо чернеет, и море вздымается серыми холмами. Корабль бросает из стороны в сторону, такелаж отчаянно скрипит, и одна неудачная волна способна проломить корпус или утащить судно на дно со всеми на борту."
 hajj_caravan_events.17.a: "Держимся крепче. Корабелы построили его на совесть."
 hajj_caravan_events.17.b: "Поднимем паруса и попытается убежать от шторма."
 hajj_caravan_events.18.title: "Штиль"
 hajj_caravan_events.18.desc: "Ветер стихает. Паруса безжизненно обвисли, море стало гладким, как металл, и корабль неподвижно стоит под беспощадным солнцем. С каждым безветренным днём воды остаётся всё меньше, как и терпения."
 hajj_caravan_events.18.a: "Подождём. Ветер всегда возвращается."
 hajj_caravan_events.18.b: "Спустим шлюпки. Мы не станем сидеть и гнить."
 hajj_caravan_events.19.title: "Лихорадка в трюме"
 hajj_caravan_events.19.desc: "Болезнь расползается по душному, спёртому воздуху нижних палуб, и за несколько дней больных становится больше, чем здоровых. Корабль по-прежнему нужно вести, а рук для работы с каждым днём всё меньше."
 hajj_caravan_events.19.a: "Пойдём к берегу. Экипажу нужна чистая вода."
 hajj_caravan_events.19.b: "Сохраним курс и положимся на выносливость экипажа."
 hajj_caravan_events.20.title: "Корсары"
 hajj_caravan_events.20.desc: "Низкая быстрая галера идёт на сближение с флотом, а следом за ней — ещё две, со сверкающими на солнце вёслами. Ни флагов, ни окликов — лишь блеск клинков вдоль бортов да учащающийся бой барабана, разносящийся над водой. Корсары выбрали паломников своей добычей. Дозорные поднимают тревогу, а под палубой верующие прижимают к себе узлы и молятся."
 hajj_caravan_events.20.a: "Откупимся и продолжим путь."
 hajj_caravan_events.20.b: "Расчистим палубы. Прорвёмся сквозь них."
 hajj_caravan_events.20.b.chance_tt: "Охрана может не отбить нападение корсаров, и вместо [Concept('prestige', 'престижа')|e] мы потеряем охрану и роскошь"
 hajj_caravan_events.21.title: "Риф"
 hajj_caravan_events.21.desc: "Резкая дрожь пробегает по всему корпусу, и палуба уходит из-под ног: не нанесённый на карты риф вспарывает коралловыми зубьями обшивку под ватерлинией. В трюм уже поступает морская вода, и команда бросается к помпам. Корабль пробит и оседает, но ещё не потерян, а ближайшая земля — лишь зелёное пятнышко на горизонте."
 hajj_caravan_events.21.a: "Подведём флот к берегу и починим корабль как следует."
 hajj_caravan_events.21.b: "Оставим часть экипажа спасать корабль. Остальные поплывут дальше."
 hajj_caravan_events.22.title: "Купец в море"
 hajj_caravan_events.22.desc: "Торговое судно окликает нас: его палубы завалены рулонами шёлка и тонких тканей из дальних портов. Капитан готов торговать по себестоимости, но только после неторопливого торга."
 hajj_caravan_events.22.a: "Купим лучшую ткань на борту."
 hajj_caravan_events.22.b: "Некогда торговаться. Пусть плывут дальше."
