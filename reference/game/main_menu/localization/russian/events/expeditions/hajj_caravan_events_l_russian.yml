l_russian:
 hajj_caravan_events.1.title: "The Road to Mecca"
 hajj_caravan_events.1.desc: "Караван собран, молитвы произнесены, и начинается долгий путь в [ShowAreaName('hedjaz_area')]. Толпы выстраиваются вдоль улиц, чтобы проводить нас, — доказательство того, что наш дом всё ещё чтит заветы веры. До [ShowLocationName('mecca')] — месяцы пути через пустыни и открытые воды, что карают неподготовленных."
 hajj_caravan_events.1.a: "Наш [ROOT.GetCountry.GetGovernment.GetRulerTitle] отправляется в путь и как правитель, и как слуга [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.1.b: "Provision the caravan well and raise a sizeable escort to guard the road."
 hajj_caravan_events.1.c: "Ensure the caravan is fully stocked and secure, and bear the #italic maḥmal#! before us."
 hajj_caravan_events.1.historical_info: "Аббасидский халиф Харун ар-Рашид совершал паломничество из Багдада девять раз за время своего правления (786–809), даже проходя часть пути пешком в знак благочестия, и его преданность стала образцом, которому набожные правители стремились подражать многие века после него."
 hajj_caravan_events.display_wealth: "Несите #italic махмаль#! открыто, чтобы все могли узреть богатство [ROOT.GetCountry.Custom('CL_GEN')]."
 hajj_caravan_events.guards_up_tt: "The caravan's guard escort grows"
 hajj_caravan_events.guards_down_tt: "The caravan's guard escort is diminished"
 hajj_caravan_events.splendor_up_tt: "The caravan's splendor grows"
 hajj_caravan_events.splendor_down_tt: "The caravan's splendor is diminished"
 hajj_caravan_events.weakened_tt: "Гонимый вперёд без отдыха, караван ослаб перед грядущими испытаниями"
 hajj_caravan_events.recovered_tt: "Отдохнув и напоив животных, караван сбрасывает усталость"
 hajj_caravan_events.2.title: "Врата [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. Древний порт [jeddah_location.GetRank.GetName|l] пахнет [ShowGoodsName('salt')], [ShowGoodsName('incense')] и потом десяти тысяч паломников, прибывших раньше нас морем. Торговцы продают припасы по двойной цене, а учёные спорят о правильном порядке обрядов. [ShowLocationName('mecca')] уже близко, меньше трёх дней по суше, но караван утомлён, а припасы на исходе. Можно двинуться дальше без остановки или провести здесь день, отдыхая и пополняя запасы."
 hajj_caravan_events.2.a: "Отдохнуть здесь и войти в святой город со свежими силами."
 hajj_caravan_events.2.b: "Мы прошли слишком много, чтобы останавливаться теперь. Двинуться прямо к [ShowLocationNameWithNoTooltip('mecca')]."
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "Халиф Усман ибн Аффан, третий из праведных халифов (рашидун), в 646 году назначил Джидду официальным портом прибытия для паломников, приплывающих морем, — роль, которую город сохраняет для хаджа по сей день."
 hajj_caravan_events.3.title: "Кааба"
 hajj_caravan_events.3.desc: "Перед нами открывается Заповедная мечеть, а в её сердце стоит Кааба — чёрная, укрытая покровом, древняя, старше самой памяти. Вокруг неё в терпеливом движении кружат тысячи верующих в белых одеяниях, пришедшие из всех земель, где слышен призыв к молитве. Здесь султан и пастух одеты одинаково. Путь окончен. Теперь вопрос лишь в том, какими паломниками мы предстанем. То, что будет подарено здесь, отзовётся на рынках, в мечетях и при дворах мусульманского мира на целое поколение."
 hajj_caravan_events.3.a: "Distribute gold freely. Let no pilgrim here go hungry on our account."
 hajj_caravan_events.3.b: "Одарить мечети и учёных, хранящих святой город."
 hajj_caravan_events.3.c: "Совершить обряды тихо. Это дело между нами и [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.3.d: "Our [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] has already provisioned everything. Perform the rites in full."
 hajj_caravan_events.3.e: "Spare no expense. Let the caravan glitter with gold and silk to behold."
 hajj_caravan_events.3.historical_info: "Самым знаменитым в истории Хаджем правителя стало паломничество Манса Мусы I Малийского в 1324 году. Он путешествовал в сопровождении шестидесяти тысяч человек и вёз с собой столько золота, что раздавал его щедрой рукой на каждой остановке — это паломничество вызвало десятилетний обвал цен на золото по всей Северной Африке и Ближнему Востоку. Его визит ко двору египетского султана подробно описали арабские хронисты, отметившие как его необычайную щедрость, так и вызванное ею экономическое потрясение."
 hajj_caravan_events.4.title: "Город тысячи минаретов"
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')] огромен и стар, и он поглощает караван в тот же миг, как мы проходим сквозь северные ворота — шум, пряности, дубленая кожа, жареное мясо. Над крышами возвышается великая мечеть Аль-Азхар, чьи учёные считаются одними из лучших во всём [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] мире. Наш правитель может задержаться здесь, чтобы учиться у них, или же просто пополнить запасы и двинуться дальше, к [ShowLocationName('mecca')]."
 hajj_caravan_events.4.a: "Провести время с учёными Аль-Азхара, пока есть возможность."
 hajj_caravan_events.4.b: "Мы шли ради [ShowLocationNameWithNoTooltip('mecca')], а не ради [ShowLocationNameWithNoTooltip('cairo')]. Пополнить запасы и идти дальше."
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "Историк и учёный Ибн Хальдун поселился в Каире в 1382 году, где преподавал в Аль-Азхаре и служил главным маликитским судьёй города. Его слава привлекала правителей и учёных со всего мусульманского мира, стремившихся послушать его лекции или получить его совет."
 hajj_caravan_events.5.title: "Старая столица"
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')] некогда был величайшим городом мира, столицей халифата, простиравшегося от [ShowContinentName('atlantic_ocean_continent')] до [ShowSubContinentName('central_asia')], прежде чем монголы сожгли его дотла. То, что осталось — это меньшие рынки и менее ревностные учёные, но святыни его почивших праведников по-прежнему притягивают паломников со всего востока, и наш правитель мог бы почтить их память здесь, прежде чем повернуть на юг, к [ShowAreaName('hedjaz_area')]."
 hajj_caravan_events.5.a: "Посетить святыни и отыскать их учёных."
 hajj_caravan_events.5.b: "Почтить память, а затем идти дальше."
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "Зубайда бинт Джафар, жена аббасидского халифа Харуна ар-Рашида, лично испытав тяготы пути, профинансировала строительство Дарб Зубайда — паломнической дороги с колодцами, цистернами и станциями, тянувшейся от окрестностей Багдада до самой Мекки."
 hajj_caravan_events.6.title: "Дамасская остановка"
 hajj_caravan_events.6.desc: "Сады сменяются стенами [ShowLocationName('damascus')] — одного из старейших городов, что стоят и поныне, чья Великая мечеть славится по всей общине верующих. Молитва под её куполом и беседы с законоведами, заполняющими её дворы, отняли бы у нас дни, которых у нас может и не быть; караван с тем же успехом мог бы напоить животных, пополнить запасы и к утру уйти дальше."
 hajj_caravan_events.6.a: "Задержаться ненадолго среди мечетей и законоведов."
 hajj_caravan_events.6.b: "Напоить животных и уйти на рассвете."
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "В 1550-х годах османский султан Сулейман Великолепный повелел построить в Дамаске комплекс Такиййа ас-Сулайманийя — мечеть, странноприимный дом и бесплатную кухню, возведённые специально для того, чтобы принимать и снабжать тысячи паломников, собиравшихся здесь каждый год перед тем, как караван хаджа отправлялся в Мекку."
 hajj_caravan_events.7.title: "Ḥājjī"
 hajj_caravan_events.7.desc: "Караван возвращается домой — с опустевшими запасами и изменившимися паломниками. Молва обогнала верблюдов, и толпы собираются, чтобы встретить правителя, который предстал перед Каабой и остался жив, дабы рассказать об этом. С этого дня наш правитель носит титул хаджи — заслуженный, а не дарованный, и по праву принадлежащий ему."
 hajj_caravan_events.7.a: "Let it be known, from [ShowLocationNameWithNoTooltip('mecca')] and back, by the grace of [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.7.historical_info: "Askia Muḥammad Ture of the Songhai Empire undertook the Ḥajj in 1496–97 with a retinue of hundreds and a fortune in gold to give away as alms along the way. In Cairo, the Abbasid claimant to the caliphate granted him the title Caliph of the Sudan, and he returned home as al-Ḥajj, his authority over West African Islam confirmed by the pilgrimage."
 hajj_caravan_events.8.title: "Death on the Road to Mecca"
 hajj_caravan_events.8.desc: "До каравана доходит весть, что наш правитель скончался в пути — вдали от дома и ещё дальше от Каабы. Без государя во главе караван не может продолжать путь, как прежде. Он распадается: одни паломники поворачивают назад, другие продолжают путь в одиночку, чтобы завершить обряды, ради которых пришли."
 hajj_caravan_events.8.a: "Да смилуется [ROOT.GetCountry.GetReligion.GetGodName] над его душой."
 hajj_caravan_events.hire_escorts: "Нанять больше охраны на оставшийся путь."
 hajj_caravan_events.adorn: "Commission banners, silks, and finery to adorn the caravan, and wait while they are made ready."
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.9.title: "Разбойники на дороге"
 hajj_caravan_events.9.desc: "Из марева зноя появляются они — всадники пустыни с поднятыми копьями, кружащие вокруг колонны. Они видели, как мы пересекали их пески, и решили, что караван стоит того, чтобы его захватить. Наша стража смыкает ряды, но бой в открытой пустыне никогда не сулит верной удачи."
 hajj_caravan_events.9.a: "Заплатить дань. Серебро дешевле крови."
 hajj_caravan_events.9.b: "Пусть стража отработает свой хлеб."
 hajj_caravan_events.9.c: "Remind them these are pilgrims bound for [ShowLocationNameWithNoTooltip('mecca')], under [ROOT.GetCountry.GetReligion.GetGodName]'s protection."
 hajj_caravan_events.10.title: "Иссохшие колодцы"
 hajj_caravan_events.10.desc: "The wells ahead stand empty — cracked mud at the bottom, drained to the dregs by some caravan that passed through days before us. The skins slung along the camels' flanks are already light, the animals lowing their thirst, and the sun climbs higher with no mercy in it. The guides fall to muttering about how far the next good water lies."
 hajj_caravan_events.10.a: "Лучше медленно, чем мёртво. Свернуть к дальнему колодцу."
 hajj_caravan_events.10.b: "Следующая вода сгодится. Продолжать путь."
 hajj_caravan_events.11.title: "Самум"
 hajj_caravan_events.11.desc: "Горизонт окрашивается в цвет ржавчины, и ветер поднимается до крика. Стена песка обрушивается на колонну, и в считаные мгновения не остаётся ни дороги, ни неба, ни всадника впереди — лишь колючая тьма."
 hajj_caravan_events.11.a: "Опустить тюки, поднять покрывала. Переждём."
 hajj_caravan_events.11.b: "Связать колонну верёвками и пробиваться сквозь бурю."
 hajj_caravan_events.12.title: "Лихорадка в караване"
 hajj_caravan_events.12.desc: "It begins with a few cases, but by morning it is in every tent: a fever that hollows out even the strongest in days. Packed together on the road, the pilgrims have now way to avoid it."
 hajj_caravan_events.12.a: "Мы остановимся. Ни один паломник не умрёт брошенным."
 hajj_caravan_events.12.b: "Время паломничества не станет ждать больных."
 hajj_caravan_events.13.title: "The Emir's Price"
 hajj_caravan_events.13.desc: "Дорога впереди пересекает земли местного владыки, и его всадники встали поперёк пути, уперев копья в землю, вовсе не торопясь. Его глашатай выходит с улыбкой: есть пошлина за воду, пошлина за проход, пошлина даже за песок под нашими ногами — и караван не тронется дальше, пока не будет уплачено. Позади нас паломники ждут на жаре, наблюдая, из какого теста сделан их государь."
 hajj_caravan_events.13.a: "Заплатить и покончить с этим."
 hajj_caravan_events.13.b: "Мы ничего ему не должны. Обойдём его колодцы стороной."
 hajj_caravan_events.13.c: "Let the emir look upon our caravan, and reconsider whom he would tax."
 hajj_caravan_events.14.title: "Зелёная стоянка"
 hajj_caravan_events.14.desc: "Впереди из песка поднимаются пальмы, а под ними — источник, и вокруг него люди, выходящие встречать паломников с финиками и прохладной водой. Приютить идущих в святой город — само по себе деяние благочестия, и дар этот дан от чистого сердца."
 hajj_caravan_events.14.a: "Отдохнуть и полностью напоить караван, прежде чем двинуться дальше."
 hajj_caravan_events.14.b: "Поделиться припасами с бедняками оазиса."
 hajj_caravan_events.14.c: "Поблагодарить их и продолжить путь."
 hajj_caravan_events.15.title: "Учёные в пути"
 hajj_caravan_events.15.desc: "К каравану присоединяется группа странствующих учёных, держащих путь в тот же священный город, их сумки отягощены книгами. У вечерних костров они до глубокой ночи рассуждают о законе и Писании."
 hajj_caravan_events.15.a: "Сесть среди них и слушать."
 hajj_caravan_events.15.b: "Отвечать доводом на довод."
 hajj_caravan_events.16.title: "Сезон миновал"
 hajj_caravan_events.16.desc: "Мы прибываем слишком поздно. Год сменился, и вместе с ним прошло стояние в Арафате — часы между полуднем и закатом, когда каждый паломник этого сезона должен был стоять вместе с другими на той равнине под Горой Милосердия, молясь и прося прощения. Слова Пророка гласят, что Хадж — это не что иное, как тот единственный полдень; упусти его, и никакой обряд, совершённый позже, не завершит паломничества. Каравану остаётся лишь разойтись и вернуться домой, чтобы в следующем году начать путь сначала."
 hajj_caravan_events.16.a: "Мы задержались слишком долго. Придётся начать всё заново."
 hajj_caravan_events.17.title: "Буря"
 hajj_caravan_events.17.desc: "The sky blackens and the sea heaves itself into grey hills of water. The ship pitches, the rigging shrieks, and one wave taken wrong could stave in a hull or drag a vessel under with every soul aboard."
 hajj_caravan_events.17.a: "Держаться. Корабельщики построили её на славу."
 hajj_caravan_events.17.b: "Паруса в ветер и вперёд."
 hajj_caravan_events.18.title: "Штиль"
 hajj_caravan_events.18.desc: "Ветер стихает совсем. Паруса безвольно повисли, море лежит гладко, будто выкованный металл, и корабль застыл неподвижно под безжалостным солнцем. С каждым безветренным днём воды становится всё меньше, а нрав людей — всё горячее."
 hajj_caravan_events.18.a: "Ждать. Ветер всегда возвращается."
 hajj_caravan_events.18.b: "Спустить шлюпки. Мы не станем сидеть и гнить."
 hajj_caravan_events.19.title: "Лихорадка в трюме"
 hajj_caravan_events.19.desc: "Болезнь расползается по спёртому, дурному воздуху нижних палуб, и через несколько дней больных становится больше, чем здоровых. Кораблю всё же нужен уход, а рук для этого с каждым рассветом остаётся всё меньше."
 hajj_caravan_events.19.a: "Идём к берегу. Команде нужна чистая вода."
 hajj_caravan_events.19.b: "Держим курс и верим, что руки выдержат."
 hajj_caravan_events.20.title: "Corsairs"
 hajj_caravan_events.20.desc: "Низкая быстрая галера режет волны навстречу флоту, а за ней ещё две — вёсла сверкают на солнце. Ни флагов, ни оклика — лишь блеск клинков вдоль бортов да учащённый бой барабана, разносящийся над водой. Корсары — и они выбрали паломников своей добычей. Дозорные кричат тревогу, а в трюмах верующие прижимают к себе узлы и молитвы."
 hajj_caravan_events.20.a: "Откупиться и уйти."
 hajj_caravan_events.20.b: "Очистить палубы. Прорвёмся с боем."
 hajj_caravan_events.21.title: "Риф"
 hajj_caravan_events.21.desc: "Скрежещущий удар проходит по всему корпусу, и палуба уходит из-под ног — неизвестный риф, его коралловые зубья вспарывают доски ниже ватерлинии. Морская вода уже булькает в трюме, и команда бросается к помпам. Судно пробито и оседает, но ещё не потеряно, а ближайшая земля — лишь низкая зелёная полоска на горизонте."
 hajj_caravan_events.21.a: "Вытащить флот на берег и как следует его починить."
 hajj_caravan_events.21.b: "Оставить команду спасать судно. Остальные плывут дальше."
 hajj_caravan_events.22.title: "Купец в море"
 hajj_caravan_events.22.desc: "A merchant vessel hails us across the water, her decks stacked with bolts of silk and fine cloth from distant ports. Her captain will trade  at a merchant's price, but only after a merchant's unhurried haggling."
 hajj_caravan_events.22.a: "Купить лучшую ткань на борту."
 hajj_caravan_events.22.b: "Некогда торговаться. Пусть проходят мимо."
 hajj_caravan_events.20.b.chance_tt: "Наша стража может не отбить корсаров, что обойдётся потерей стражи и великолепия вместо [prestige|e]"
 hajj_caravan_events.9.b.chance_tt: "Наша стража может не суметь отбить разбойников, что обойдётся потерей стражи и блеска вместо [prestige|e]"
