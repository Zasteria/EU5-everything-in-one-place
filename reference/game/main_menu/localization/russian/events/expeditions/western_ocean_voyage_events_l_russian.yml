 western_ocean_voyage_events.ship_gained_tt: "Флот пополняется ещё одним кораблём (#G +1#! кораблей)"
 western_ocean_voyage_events.ship_lost_tt: "Флот теряет судно (#R -1#! кораблей)"
 western_ocean_voyage_events.charted_kept_tt: "Воды, нанесённые флотом на карту, остаются на наших картах"
 western_ocean_voyage_mythical_cities_tt: "Картографирование берегов Америки откроет возможность организовать [Concept('expeditions','экспедиции')|e] на поиски её легендарных затерянных городов"
 western_ocean_voyage_events.1.title: "Курс на запад"
 western_ocean_voyage_events.1.desc: "Корабли глубоко осели в гавани, нагруженные припасами для плавания, к которому не готовила нас ни одна карта. [target_leader.GetName] месяцами [Select_CString(target_leader.IsFemale,'отстаивала','отстаивал')] перед придворными свою правоту: океан на западе уже, чем твердят учёные, а Индия находится в пределах досягаемости для решительного флота.\n\nУчёные остаются при своём. Моряки встревожены. Но ветер попутный, прилив меняется, и остаётся лишь отдать швартовы."
 western_ocean_voyage_events.1.a: "Поплывём дальше, что бы ни таил океан. Мы найдём это первыми."
 western_ocean_voyage_events.1.b: "Плывём дальше, к чему бы ни вёл нас океан. Мы отыщем это первыми."
 western_ocean_voyage_events.1.c: "Пусть ветра будут нашей картой."
 western_ocean_voyage_events.1.columbus: "[target_leader.GetNameWithNoTooltip] заверяет, что по точным расчётам до цели три тысячи миль, не больше."
 western_ocean_voyage_events.1.historical_info: "Идея достичь Азии, отправившись по морю на запад, десятки лет обсуждалась европейскими учёными до первой попытки такого путешествия. Главным препятствием была даже не форма Земли, которую образованные люди уже считали шарообразной, а её размер. Большинство учёных справедливо полагали, что океан слишком широк, и делали из этого вывод о том, что пересечь его невозможно. Доказать их неправоту удалось лишь благодаря неожиданным открытиям, сделанным экспедициями на своём пути."
 western_ocean_voyage_events.2.title: "На краю карты"
 western_ocean_voyage_events.2.desc: "Счастливые острова, как называли их древние, лежат на самом краю каждой карты, что мы используем в регионе [ShowLocationName('northern_fuerteventura_coast')]. За ними у океана нет ни названий, ни записанных глубин, ни начертанных берегов. Местные рыбаки говорят, что перед бурей иногда видят птиц, летящих с запада, и [target_leader.GetName] считает это знаком земли за горизонтом, а команда — предвестием шторма.\n\nМы берём пресную воду, солёное мясо и сухари. На закате люди смотрят, как море становится золотым, а потом тёмнеет."
 western_ocean_voyage_events.2.a: "Пополним припасы и отплывём в течение недели."
 western_ocean_voyage_events.2.b: "Люди не готовы. Повернём назад."
 western_ocean_voyage_events.2.c: "Отправить лодки на берег за водой и козами."
 western_ocean_voyage_events.2.c.calm_tt: "Десант возвращается без происшествий"
 western_ocean_voyage_events.2.c.clash_tt: "Десант вступает в стычку с островитянами"
 western_ocean_voyage_events.2.d: "Купить каравеллу у островных корабелов."
 western_ocean_voyage_events.2.e: "Пополнить запасы воды и плыть дальше с тем, что у нас есть."
 western_ocean_voyage_events.2.f: "Люди не готовы. Поворачиваем назад."
 western_ocean_voyage_events.2.historical_info: "Канарские острова служили стандартной отправной точкой для атлантических плаваний в неизвестность: они лежат на краю изученных вод Атлантики, а оттуда на юго-запад, к Карибскому морю, дуют постоянные ветры. Стратегическое значение островов было настолько очевидно, что за контроль над ними Португалия и Кастилия спорили на протяжении большей части XV века."
 western_ocean_voyage_events.3.title: "Мы зашли достаточно далеко"
 western_ocean_voyage_events.3.desc: "Хлеб плесневеет. Бочки с водой пахнут затхлостью. Трое слегли в лихорадке. Этим утром [target_leader.GetName] принимает делегацию с простым посланием: они достаточно плыли на запад, не видели ничего, кроме открытого моря, и намерены повернуть на восток, независимо от того, согласится ли с этим [target_leader.GetNameWithNoTooltip].\n\nЗемли нет ни в одной стороне. Нет вообще ничего, только ветер в корму, который донёс их досюда, а обратно уже не понесёт."
 western_ocean_voyage_events.3.a: "Пообещаем ещё три дня и долю во всём, что найдём."
 western_ocean_voyage_events.3.b: "Люди правы. Повернём назад."
 western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] обещает команде ещё три дня, подтасовав записи в судовом журнале."
 western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] успокаивает команду поддельным судовым журналом, поэтому боевой дух экипажа не падает"
 western_ocean_voyage_events.3.historical_info: "В рассказах о плавании 1492 года упоминается настоящий кризис боевого духа примерно через месяц после начала форсирования Атлантики: команда грозила мятежом и требовала от Колумба изменить курс и вернуться домой. Как именно был разрешён кризис — обещанием земли в течение трёх дней, появлением плавучих водорослей или просто силой личности Колумба, — остаётся предметом споров. Землю заметили на следующее утро."
 western_ocean_voyage_events.4.title: "Ланд"
 western_ocean_voyage_events.4.desc: "Незадолго до рассвета с верхушки мачты раздаётся крик. Затем другой, громче. Затем кричит каждый, кто есть на палубе.\n\nНа горизонте виднеются очертания. Сначала едва заметное потемнение неба, но по мере того как светает, они становятся несомненными: деревья, береговая линия, зелёные холмы над неподвижной водой. Море вокруг кораблей из тёмно-синего стало зелёным, а затем бледно-бирюзовым. Над головой кружат незнакомые птицы. Мимо бортов проплывают ветви со странными листьями.\n\n[target_leader.GetName] стоит на носу и долго молчит.\n\nКогда лодки подходят к берегу, островитяне уже собрались посмотреть, и у некоторых в носу заметны маленькие золотые украшения. На вопрос — скорее жестом, чем словом — откуда взялось золото, они указывают вглубь острова, а некоторые — на юг, на холмы, которых никто из команды отсюда не видит."
 western_ocean_voyage_events.4.a: "Водрузим флаг. Чем бы ни было это место, оно принадлежит нам."
 western_ocean_voyage_events.4.b: "Это не похоже ни на одно описание Индий. Пока ничего не станем объявлять своим."
 western_ocean_voyage_events.4.columbus: "Водрузим знамя. [target_leader.GetShortNameWithNoTooltip] [Select_CString(target_leader.IsFemale,'уверена','уверен')], что мы достигли Индий."
 western_ocean_voyage_events.4.historical_info: "Первый контакт между европейцами и народами Америки произошёл на Карибах в 1492 году. Жители Багамских островов таино, называвшие свой остров #italic Гуанахани#!, встречали прибывающие корабли с берега. В течение одного поколения эпидемические болезни, с которыми таино прежде не сталкивались, унесли жизни большинства населения Карибских островов. Долгосрочные последствия этого плавания изменили экологию, экономику и население каждого континента Земли."
 western_ocean_voyage_events.5.title: "Остров семи городов"
 western_ocean_voyage_events.5.desc: "Где-то на середине форсирования, при ровном ветре и хорошем ходе кораблей, [target_leader.GetName] изучает старую карту, принесённую лоцманами. Нарисованная людьми, никогда не плававшими в этом океане, она отмечает огромный остров далеко к западу от #TOOLTIP:AREA,azores_area,X #L Азорских островов#!#!: Антилию, обнесённую стенами и усеянную семью городами, основанными, как говорят, епископами, которые бежали из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, когда её захватили армии Омейядов.\n\nНикто на борту этого острова не видел и не ожидает увидеть. Но карта старая, чертившие её не были глупцами, а здесь, где на горизонте ничего нет, старая легенда ценится больше, чем в порту."
 western_ocean_voyage_events.5.a: "Проложим курс по ней — вдруг старые карты не лгут."
 western_ocean_voyage_events.5.b: "На картах моряков полно островов, которых никогда не было."
 western_ocean_voyage_events.5.historical_info: "Антилия, Остров семи городов, появляется на португальских и генуэзских картах уже в 1424 году и обозначает большой остров к западу от Азорских островов. Легенда гласила, что семь вестготских епископов бежали из Иберии в 714 году, во время завоевания Омейядами, и основали семь городов на острове в западном океане. Легенда пережила эпоху исследований, которая, как считается, её опровергла: когда десятилетия спустя Франсиско Васкес де Коронадо отправился на поиски семи золотых городов на юго-западе Северной Америки, он взял название для своей цели из этого более древнего, чисто европейского предания."
 western_ocean_voyage_events.6.title: "Откуда берётся золото"
 western_ocean_voyage_events.6.desc: "Толмачи не сходятся в толковании слов. Один уверяет, что островитяне называют место. Другой — что народ. Третий — что жест на юг и жест вглубь острова — это два разных ответа на два разных вопроса, которые никто не переводит верно.\n\nОдно известно наверняка — направление: вглубь острова, а дальше на юг, к горам и рекам, которых никто из команды не видел. [target_leader.GetName] всё равно велит лоцманам нанести на карту этот наполовину слух и наполовину догадку на случай, если кому-нибудь однажды понадобится узнать, где искать."
 western_ocean_voyage_events.6.a: "Занесём как есть, вместе с противоречиями."
 western_ocean_voyage_events.6.b: "Оставим лишь то, в чём все согласны: в глубине острова и золото."
 western_ocean_voyage_events.6.historical_info: "Ранние рассказы о контакте на Карибах описывают таино, носивших маленькие золотые украшения. Золото там, судя по всему, скорее обрабатывали, чем добывали, во всяком случае, в количествах, заметных пришельцам. На вопрос, откуда оно, островитяне жестами неоднократно указывали вглубь суши, а иногда — на земли дальше к югу и западу. Именно эти чужие, неверно истолкованные указания, а не какие-либо подтверждённые находки, определили, куда следующие поколения исследователей отправлялись за золотом в Америке."
 western_ocean_voyage_events.7.title: "Мы прочитали донесения перед двором"
 western_ocean_voyage_events.7.desc: "Корабли наконец заходят в гавань, покрытые солью и потрёпанные, и уже через несколько дней мы зачитываем вслух рассказ, который [Select_CString(target_leader.IsFemale,'привезла','привёз')] [target_leader.GetName]: острова, форсирование, диковинные птицы и ещё более диковинные плоды, золото на людях, ничего не слышавших о нас до нашего появления.\n\nОдни сомневаются в большей части сказанного, но мы всё равно записываем всё. Карты начинают осторожно меняться на западных полях, где раньше ничего не рисовали."
 western_ocean_voyage_events.7.desc.later: "Корабли наконец-то входят в гавань, покрытые солью и потрёпанные бурями, и уже через несколько дней мы зачитываем вслух отчёт [target_leader.GetName] при [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Моряки другой короны побывали на этих островах раньше нас, и их донесения давно обошли все дворы Европы.\n\nИ всё же наш флот пересёк тот же океан и вернулся домой, а это немало. Теперь наши лоцманы сами знают западные ветра, и никакая чужая карта не научит их этому лучше собственного опыта."
 western_ocean_voyage_events.7.a: "Оставим доклад как есть."
 western_ocean_voyage_events.7.historical_info: "Письменные и устные отчёты возвратившихся экспедиций зачитывались при королевских дворах по всей Западной Европе в течение нескольких месяцев после каждого высадки на берег, а их переводы впоследствии получили широкое распространение. Эти рассказы, искажённые в процессе перевода и под влиянием амбиций их рассказчиков, описывали богатства внутренних районов, которые ни один европеец ещё не видел собственными глазами. Именно эти свидетельства из вторых рук, в большей степени, чем какие-либо подтверждённые открытия, побудили последующие поколения исследователей отправляться всё глубже вглубь материка и всё южнее в поисках источников того, что первые прибывшие успели лишь мельком увидеть."
 western_ocean_voyage_events.8.title: "Мятеж в открытом море"
 western_ocean_voyage_events.8.desc: "Всё начинается с ропота на смене вахты, а заканчивается ножами, обнажёнными на главной палубе. Команда одного из наших кораблей заперла офицеров внизу и передаёт через воду: они повернут домой с первыми лучами солнца и возьмут на абордаж любой корабль, что попытается их остановить.\n\n[target_leader.GetName] стоит у борта, оценивая расстояние между двумя корпусами. За спиной [target_leader.GetHerHim] верные экипажи ждут, что решит [target_leader.GetSheHe]."
 western_ocean_voyage_events.8.a: "Позволить мятежникам забрать свой корабль и уйти домой."
 western_ocean_voyage_events.8.b: "Взять их на абордаж. В море кораблю не место для совета."
 western_ocean_voyage_events.8.fight_win_tt: "Офицеры одерживают верх и восстанавливают порядок"
 western_ocean_voyage_events.8.fight_lose_tt: "Схватка оказывается кровавой, и флот платит за это дорогую цену"
 western_ocean_voyage_events.8.c: "Рассказать им об Индиях и золоте, что ждёт их там."
 western_ocean_voyage_events.8.rouse_tt: "Слова [target_leader.GetNameWithNoTooltip] вновь зажигают решимость в команде"
 western_ocean_voyage_events.9.title: "Лихорадка в трюме"
 western_ocean_voyage_events.9.desc: "Вода в бочках позеленела, а в солонине завелись черви. Сперва несколько человек слегли с лихорадкой, потом дюжина, а там и столько, что офицерам едва хватает людей на вахты. Лекарь пускал им кровь и давал рвотное, но больше ничего сделать не может.\n\nЗдоровые смотрят на больных, затем на пустой горизонт, и не произносят вслух то, о чём думают все."
 western_ocean_voyage_events.9.a: "Убавить паруса и ухаживать за больными, пока лихорадка не отступит."
 western_ocean_voyage_events.9.b: "Нам нельзя терять дни. Похоронить мёртвых и плыть дальше."
 western_ocean_voyage_events.9.historical_info: "Дальние океанские переходы в пятнадцатом веке ограничивались не столько навигацией, сколько тем, что способен был вынести корабль. Вода, хранившаяся в деревянных бочках, портилась за несколько недель, солёные припасы гнили на жаре, а команды, набитые в тесные трюмы, заражали друг друга лихорадкой и дизентерией. Капитаны, отправлявшиеся в открытую Атлантику, брали свежие запасы в последнем доступном порту — часто на Канарских островах или островах Зелёного Мыса, — ведь после этого пополнить их было уже негде."
 western_ocean_voyage_events.10.title: "Домой, не дойдя до края"
 western_ocean_voyage_events.10.desc: "Флот возвращается в гавань гораздо раньше, чем кто-либо ожидал: трюмы ещё наполовину полны, а команды целы и невредимы. Они не нашли земли — лишь открытую воду и ветер, который не давал забыть, как далеко они от дома.\n\nПри дворе об этом плавании говорят тихо, если вообще говорят. И всё же лоцманы вели свои журналы, и теперь наши карты западных вод простираются чуть дальше, чем прежде."
 western_ocean_voyage_events.10.a: "Океан никуда не денется — он подождёт нас и в следующий раз."
 western_ocean_voyage_events.11.title: "Пропали без вести"
 western_ocean_voyage_events.11.desc: "Проходят месяцы, а вестей от флота, ушедшего на запад, нет. Потом проходит год. Купцы, вложившиеся в плавание, списывают свои доли, а семьи моряков перестают ждать у гаванской стены.\n\nПогибли ли корабли в шторме, остались ли без воды в открытом океане, или просто плыли дальше, пока не осталось ничего — этого не узнает никто. У нас осталось лишь последнее донесение, отправленное флотом домой перед тем, как он вышел за пределы нанесённого на карты мира."
 western_ocean_voyage_events.11.a: "Море забрало их. Помолимся за их души."
 western_ocean_voyage_events.11.historical_info: "Атлантические плавания в неизведанное часто заканчивались бесследно. Генуэзские братья Уголино и Вадино Вивальди вышли на запад через Гибралтарский пролив в 1291 году в поисках морского пути в Индию и больше о них никто не слышал. Два века спустя португальские братья Гаспар и Мигел Кортерреал пропали в отдельных плаваниях к северо-западной Атлантике в 1501 и 1502 годах."
 western_ocean_voyage_events.13.title: "Море водорослей"
 western_ocean_voyage_events.13.desc: "Вот уже несколько дней корабли идут сквозь плавучие луга желто-зелёных водорослей, местами такие густые, что, кажется, они удерживают корпуса на месте. Старые моряки клянутся, что это верный знак мелководья впереди, и что флот сядет на мель у какого-нибудь скрытого берега прежде, чем кто-либо его заметит.\n\n[target_leader.GetName] приказывает приготовить лотлинь. Люди всматриваются в воду и ждут, что она им скажет."
 western_ocean_voyage_events.13.a: "Лечь в дрейф и промерить глубину."
 western_ocean_voyage_events.13.b: "Водоросли — не риф. Держать курс и идти напролом."
 western_ocean_voyage_events.13.c: "Наш лоцман считает, что это течение, а не мелководье."
 western_ocean_voyage_events.13.historical_info: "Саргассово море, область Северной Атлантики, покрытая плавучими полями саргассовых водорослей, лежит на пути от Канарских островов к Карибскому морю. Флот Колумба вошёл в него в сентябре 1492 года. Его экипажи боялись, что водоросли скрывают отмели или могут опутать корабли, но промеры не находили дна, и флот прошёл невредимым."
 western_ocean_voyage_events.14.title: "Признаки земли"
 western_ocean_voyage_events.14.desc: "Впередсмотрящий замечает резную палку, проплывающую мимо носа корабля, затем зелёную ветвь с листьями и ягодами. На закате над кораблём пролетают стаи птиц, все в одном направлении — на юго-запад.\n\nНикто ещё не произносит это слово вслух. Но люди, которые несколько дней назад грозились повернуть назад, теперь толпятся у борта при каждой смене вахты, вглядываясь в горизонт."
 western_ocean_voyage_events.14.a: "Следовать за птицами. Земля недалеко."
 western_ocean_voyage_events.14.b: "Отметить это в судовом журнале и держать прежний курс."
 western_ocean_voyage_events.14.historical_info: "В последние дни перед высадкой в октябре 1492 года в журнале Колумба отмечены резная палка, ветвь с ягодами, тростник и большие стаи птиц, летящих на юго-запад. 7 октября он изменил курс, последовав за птицами, что привело флот к Багамам пять дней спустя."
 western_ocean_voyage_events.15.c: "Наш лоцман знает эти небеса. Держи курс в тихую четверть."
 western_ocean_voyage_events.16.c: "Наш лоцман знает, откуда возвращается ветер. Иди и найди его."
