l_russian:
 western_ocean_voyage_events.1.title: "Мы плывём на запад"
 western_ocean_voyage_events.1.columbus: "According to [target_leader.GetName]'s precise calculations it is three thousand miles, no more."
 western_ocean_voyage_events.1.a: "Sail on. Whatever lies across this ocean, we shall find it first."
 western_ocean_voyage_events.1.historical_info: "Идея достичь Азии, плывя на запад, обсуждалась европейскими учёными десятилетиями, прежде чем было предпринято первое такое плавание. Главным препятствием была не форма земли, которую образованные люди считали шарообразной, а её размер. Большинство учёных верно полагали, что океан слишком широк, чтобы его пересечь. Экспедиции, доказавшие их неправоту, сделали это не опровергнув расчёты, а обнаружив на пути нечто неожиданное."
 western_ocean_voyage_events.2.title: "Край изведанного мира"
 western_ocean_voyage_events.2.a: "Пополнить запасы и отплыть в течение недели."
 western_ocean_voyage_events.2.b: "Люди не готовы. Мы поворачиваем назад."
 western_ocean_voyage_events.2.historical_info: "Канарские острова служили стандартной точкой отправления для атлантических плаваний в неизвестность благодаря своему положению на краю изученных атлантических вод и надёжным пассатам, дующим оттуда на юго-запад к Карибскому морю. Их стратегическое значение понимали настолько хорошо, что контроль над островами оспаривался между Португалией и Кастилией на протяжении большей части пятнадцатого века."
 western_ocean_voyage_events.3.title: "Мы уже далеко зашли"
 western_ocean_voyage_events.3.desc: "The bread is going moldy. The water casks smell. Three men have taken a fever. This morning a delegation came to [target_leader.GetName] with a simple message: they have sailed west long enough, seen nothing but open sea, and intend to sail east again whether [target_leader.GetNameWithNoTooltip] agrees or not.\n\nThere is no land in any direction. There is nothing at all, only the wind from behind, which has carried them this far and would carry them no further back."
 western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] обещает команде ещё три дня, ссылаясь на подделанный судовой журнал."
 western_ocean_voyage_events.3.a: "Пообещать ещё три дня и долю во всём, что мы найдём."
 western_ocean_voyage_events.3.b: "Люди правы. Мы поворачиваем назад."
 western_ocean_voyage_events.3.historical_info: "Свидетельства о плавании 1492 года фиксируют настоящий кризис морального духа примерно через месяц атлантического перехода, когда команда угрожала бунтом и требовала от Колумба изменить курс домой. Разрешение этого кризиса, которое приписывают то обещанию земли в течение трёх дней, то замеченной плывущей растительности, то просто силе убеждения самого Колумба, остаётся предметом споров. Земля была замечена на следующее утро."
 western_ocean_voyage_events.4.title: "Land!"
 western_ocean_voyage_events.4.desc: "Just before dawn a cry comes from the crow's nest. Then another, louder. Then every man on deck is shouting.\n\nA shape on the horizon. Low at first, barely more than a darkening of the sky, but as the light grows it becomes unmistakable: trees, a shoreline, green hills rising from still water. The sea around the ships has turned from deep blue to green to pale turquoise. Strange birds circle overhead. Branches with unfamiliar leaves drift past the hull.\n\n[target_leader.GetName] stands at the bow and says nothing for a long time."
 western_ocean_voyage_events.4.columbus: "[target_leader.GetNameWithNoTooltip] plants the royal banner and names the island San Salvador, certain he has reached the Indies."
 western_ocean_voyage_events.4.a: "Plant the flag. Whatever this place is, it belongs to us now."
 western_ocean_voyage_events.4.b: "This matches no account of the Indies. Claim nothing until we know more."
 western_ocean_voyage_events.4.historical_info: "Первый контакт европейцев с народами Америки произошёл на Карибах в 1492 году. Таино, коренные жители Багам, называвшие свой остров #italic Гуанахани#!, встречали прибывшие корабли на берегу. За одно поколение эпидемии, к которым у таино не было врождённого иммунитета, унесли жизни большей части населения Карибских островов. Долгосрочные последствия этого плавания изменили экологию, экономику и население всех континентов Земли."
 western_ocean_voyage_events.5.a: "Проложить курс по ней — вдруг старые карты не лгут."
 western_ocean_voyage_events.5.b: "Морские карты полны островов, которых никогда не существовало."
 western_ocean_voyage_events.5.historical_info: "Антилия, Остров семи городов, появлялась на португальских и генуэзских картах ещё в 1424 году — как большой остров к западу от Азорских островов. Легенда гласила, что семь вестготских епископов бежали из Иберии в 714 году, во время завоевания Омейядов, и основали семь городов на острове в западном океане. Легенда пережила саму эпоху открытий, которая, казалось бы, должна была её опровергнуть: десятилетия спустя, когда Франсиско Васкес де Коронадо отправился на поиски семи золотых городов на юго-западе Америки, он назвал свою цель в честь этого более древнего, чисто европейского предания."
 western_ocean_voyage_events.5.title: "Остров семи городов"
 western_ocean_voyage_events.6.a: "Записать как есть, вместе с противоречиями."
 western_ocean_voyage_events.6.b: "Оставить лишь то, в чём все сходятся: вглубь материка, и золото."
 western_ocean_voyage_events.6.historical_info: "Ранние свидетельства контактов на Карибах описывают таино, носивших небольшие золотые украшения, скорее выделанные, чем добытые на месте в сколько-нибудь заметном для пришельцев количестве. На вопрос жестами, откуда оно взялось, островитяне снова и снова указывали вглубь суши, а по некоторым свидетельствам — на земли ещё южнее и западнее. Именно эти пересказанные из вторых уст, искажённые переводом указания, а вовсе не какая-либо подтверждённая находка, определили, где последующие поколения исследователей искали золото в Америке."
 western_ocean_voyage_events.6.title: "Откуда берётся золото"
 western_ocean_voyage_events.7.a: "Оставить донесение без изменений."
 western_ocean_voyage_events.7.historical_info: "Письменные и устные донесения вернувшихся экспедиций зачитывались при королевских дворах Западной Европы уже спустя месяцы после каждой высадки, а переводные версии впоследствии широко расходились. Эти рассказы, искажённые переводом и честолюбием их авторов, описывали богатства вглубь материка, которых ни один европеец ещё не видел своими глазами. Именно эти пересказанные из вторых уст свидетельства, а не какое-либо подтверждённое открытие, побудили последующие поколения исследователей искать всё дальше вглубь суши и всё дальше на юг источники того, что первые прибывшие лишь мельком увидели."
 western_ocean_voyage_events.7.title: "Мы читаем донесения при [ROOT.GetCountry.GetGovernment.Custom('CL_PREP')]"
 western_ocean_voyage_mythical_cities_tt: "Составление карт побережья Америки сделает доступными [expeditions|e] для поиска легендарных затерянных городов"
 western_ocean_voyage_events.1.desc: "The ships sit low in the harbor, provisioned for a voyage no chart has prepared us for. [target_leader.GetName] has spent months at [ROOT.GetCountry.GetGovernment.GetCourtTitle] arguing [target_leader.GetHisHer] case, that the ocean to the west is narrower than the scholars claim, and that the Indies lie within reach of a determined fleet.\n\nThe learned men remain unconvinced. The sailors are uneasy. But the wind is fair, the tide is turning, and there is nothing left to do but cast off the lines."
 western_ocean_voyage_events.2.desc: "The Fortunate Islands, so the ancients named them, sit at the very edge of every chart we carry in [ShowLocationName('northern_fuerteventura_coast')]. Beyond it the ocean has no names, no depths recorded, no coastline drawn. The local fishermen say they sometimes see birds flying from the west before a storm, which [target_leader.GetName] takes as a sign of land beyond the horizon. The crew takes it as a sign of storms.\n\nWe take on fresh water, salt meat, and hard biscuit. At sunset the men watch the sea turn gold, then dark."
 western_ocean_voyage_events.5.desc: "Somewhere past the midpoint of the crossing, with the wind steady and the ships making good way, the pilots bring an old chart to [target_leader.GetName]. Drawn by men who never sailed this ocean, it marks a great island far west of the [ShowAreaName('azores_area')]: Antillia, walled and studded with seven cities, said to have been founded by bishops who fled [ShowRegionName('iberia_region')] when the Umayyad armies overran it.\n\nNo one aboard has seen this island, and no one aboard expects to. But the chart is old, the men who drew it were no fools, and out here, with nothing on any horizon, an old story is worth more than it would be in port."
 western_ocean_voyage_events.6.desc: "Word for word, the interpreters do not agree. One insists the islanders are naming a place. Another, that they are naming a people. A third, that the gesture south and the gesture inland are two different answers to two different questions nobody translates correctly.\n\nWhat is certain is the direction: inland, and beyond that, south, toward mountains and rivers none of the crew have seen. [target_leader.GetName] has the pilots mark it on the chart anyway, half rumor and half guess, in case anyone ever needs to know where to look."
 western_ocean_voyage_events.7.desc: "The ships make harbor at last, salt-crusted and battered, and within days we read [target_leader.GetName]'s account aloud at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. The islands, the crossing, the strange birds and stranger fruit, the gold worn by people who had never heard of us until the moment we arrived.\n\nSome doubt most of what is said, yet we write all of it down regardless. Charts begin to change, cautiously, in the western margins where nothing used to be drawn."
