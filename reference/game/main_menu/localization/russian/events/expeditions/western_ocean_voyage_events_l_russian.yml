 western_ocean_voyage_events.morale_up_10_tt: "Боевой дух экипажей крепнет (#G +10#! боевой дух)"
 western_ocean_voyage_events.morale_up_15_tt: "Боевой дух экипажей крепнет (#G +15#! боевой дух)"
