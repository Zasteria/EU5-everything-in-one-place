l_russian:
 western_ocean_voyage_events.1.title: "Мы плывём на запад"
 western_ocean_voyage_events.1.desc: "Корабли низко сидят в гавани, снаряжённые для плавания, к которому не готова ни одна карта. [target_leader.GetName] месяцами отстаивал при [ROOT.GetCountry.GetGovernment.GetCourtTitle] правоту [target_leader.GetHisHer] дела: что западный океан уже, чем утверждают учёные мужи, и что Индии лежат в пределах досягаемости решительного флота.\n\nУчёные мужи остаются непреклонны. Моряки неспокойны. Но ветер попутный, начинается прилив, и не остаётся ничего иного, кроме как отдать швартовы."
 western_ocean_voyage_events.1.columbus: "According to [target_leader.GetNameWithNoTooltip]'s precise calculations it is three thousand miles, no more."
 western_ocean_voyage_events.1.a: "Sail on, whatever the ocean holds. We shall find it first."
 western_ocean_voyage_events.1.historical_info: "Идея достичь Азии, отправившись морем на запад, обсуждалась европейскими учёными на протяжении десятилетий до первой попытки такого путешествия. Главным препятствием была даже не форма Земли, которую образованные люди уже считали шарообразной, а её размер. Большинство учёных верно полагали, что океан слишком широк, и делали из этого вывод о том, что пересечь его невозможно. Доказать их неправоту удалось лишь благодаря неожиданным открытиям, сделанным экспедициями на своём пути."
 western_ocean_voyage_events.2.title: "Край изведанного мира"
 western_ocean_voyage_events.2.desc: "Счастливые острова, как называли их древние, лежат на самом краю всех карт, что мы везём в [ShowLocationName('northern_fuerteventura_coast')]. За их пределами у океана нет названий, не отмечены глубины, не нанесены берега. Местные рыбаки говорят, что порой видят птиц, летящих с запада перед бурей, и [target_leader.GetName] считает это знаком земли за горизонтом. Команда же считает это знаком бури.\n\nМы берём на борт свежую воду, солонину и сухари. На закате люди смотрят, как море становится золотым, а затем тёмным."
 western_ocean_voyage_events.2.a: "Пополнить запасы и отплыть в течение недели."
 western_ocean_voyage_events.2.b: "Люди не готовы. Мы поворачиваем назад."
 western_ocean_voyage_events.2.historical_info: "Канарские острова служили стандартной точкой отправления для атлантических плаваний в неизвестность благодаря своему положению на краю изученных атлантических вод и надёжным пассатам, дующим оттуда на юго-запад к Карибскому морю. Их стратегическое значение понимали настолько хорошо, что контроль над островами оспаривался между Португалией и Кастилией на протяжении большей части пятнадцатого века."
 western_ocean_voyage_events.3.title: "Мы уже далеко зашли"
 western_ocean_voyage_events.3.desc: "Хлеб покрывается плесенью. Бочки с водой пахнут гнилью. Трое слегли с лихорадкой. Этим утром к [target_leader.GetName] явилась делегация с простым посланием: они достаточно долго шли на запад, не видя ничего, кроме открытого моря, и намерены повернуть обратно на восток, согласится ли [target_leader.GetNameWithNoTooltip] или нет.\n\nЗемли не видно ни в одной стороне. Нет ничего вовсе, лишь попутный ветер, что нёс их так далеко и не понесёт назад."
 western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] обещает команде ещё три дня, ссылаясь на подделанный судовой журнал."
 western_ocean_voyage_events.3.a: "Пообещать ещё три дня и долю во всём, что мы найдём."
 western_ocean_voyage_events.3.b: "Люди правы. Мы поворачиваем назад."
 western_ocean_voyage_events.3.historical_info: "Свидетельства о плавании 1492 года фиксируют настоящий кризис морального духа примерно через месяц атлантического перехода, когда команда угрожала бунтом и требовала от Колумба изменить курс домой. Разрешение этого кризиса, которое приписывают то обещанию земли в течение трёх дней, то замеченной плывущей растительности, то просто силе убеждения самого Колумба, остаётся предметом споров. Земля была замечена на следующее утро."
 western_ocean_voyage_events.4.title: "Land!"
 western_ocean_voyage_events.4.desc: "Незадолго до рассвета с вороньего гнезда раздаётся крик. Затем ещё один, громче. Затем кричит уже вся палуба.\n\nНа горизонте — очертания. Сперва едва различимые, лишь тёмное пятно на небе, но с рассветом становится ясно: деревья, береговая линия, зелёные холмы, встающие из спокойной воды. Море вокруг кораблей из глубокого синего стало зелёным, а затем бледно-бирюзовым. Над головой кружат странные птицы. Мимо борта проплывают ветви с незнакомой листвой.\n\n[target_leader.GetName] стоит на носу корабля и долго молчит.\n\nКогда лодки достигают берега, островитяне уже собрались посмотреть, и у некоторых из них в носу видны маленькие золотые украшения. На вопрос, больше жестами, чем словами, откуда взято золото, они указывают вглубь острова, а некоторые — на юг, в сторону холмов, которых никто из команды отсюда не видит."
 western_ocean_voyage_events.4.columbus: "Plant the banner. [target_leader.GetShortNameWithNoTooltip] is sure this is the Indies."
 western_ocean_voyage_events.4.a: "Plant the flag. Whatever this place is, it belongs to us."
 western_ocean_voyage_events.4.b: "This matches no account of the Indies. Claim nothing yet."
 western_ocean_voyage_events.4.historical_info: "Первый контакт европейцев с народами Америки произошёл на Карибах в 1492 году. Таино, коренные жители Багам, называвшие свой остров #italic Гуанахани#!, встречали прибывшие корабли на берегу. За одно поколение эпидемии, к которым у таино не было врождённого иммунитета, унесли жизни большей части населения Карибских островов. Долгосрочные последствия этого плавания изменили экологию, экономику и население всех континентов Земли."
 western_ocean_voyage_events.5.title: "The Isle of the Seven Cities"
 western_ocean_voyage_events.5.desc: "Где-то на середине пути, при устойчивом ветре и хорошем ходе кораблей, лоцманы приносят [target_leader.GetName] старую карту. Начертанная людьми, никогда не бороздившими этот океан, она отмечает большой остров далеко к западу от [ShowAreaName('azores_area')]: Антилию, обнесённую стенами и усеянную семью городами, основанную, как говорят, епископами, бежавшими из [ShowRegionName('iberia_region')], когда его захватили войска Омейядов.\n\nНикто на борту не видел этого острова, и никто не ждёт его увидеть. Но карта стара, начертавшие её люди не были глупцами, а здесь, где на горизонте нет ничего, старая история стоит дороже, чем стоила бы в порту."
 western_ocean_voyage_events.5.a: "Chart our course by it, in case the old charts are right."
 western_ocean_voyage_events.5.b: "Sailors' charts are full of islands that were never there."
 western_ocean_voyage_events.5.historical_info: "Antillia, the Isle of the Seven Cities, appeared on Portuguese and Genoese charts as early as 1424, marking a large island west of the Azores. The legend behind it held that seven Visigothic bishops had fled Iberia in 714, during the Umayyad conquest, and founded seven cities on an island in the western ocean. The legend outlived the age of exploration that supposedly disproved it: when Francisco Vázquez de Coronado set out decades later to find seven golden cities in the American Southwest, he named his goal after this older, purely European tale."
 western_ocean_voyage_events.6.title: "Where the Gold Comes From"
 western_ocean_voyage_events.6.desc: "Слово в слово толмачи не сходятся во мнениях. Один уверяет, что островитяне называют место. Другой — что они называют народ. Третий — что жест на юг и жест вглубь острова суть два разных ответа на два разных вопроса, которые никто не переводит верно.\n\nНесомненно лишь направление: вглубь острова, а за ним — на юг, к горам и рекам, которых никто из команды не видел. [target_leader.GetName] всё же велит лоцманам отметить это на карте — наполовину слух, наполовину догадку, — на случай, если кому-нибудь однажды понадобится знать, куда смотреть."
 western_ocean_voyage_events.6.a: "Note it as it stands, contradictions included."
 western_ocean_voyage_events.6.b: "Keep only the part everyone agrees on: inland, and gold."
 western_ocean_voyage_events.6.historical_info: "Early accounts of contact in the Caribbean describe the Taíno wearing small ornaments of gold, worked rather than mined locally in any quantity the newcomers could see. Asked through gesture where it came from, islanders repeatedly indicated the interior and, in some accounts, lands further south and west. These secondhand, mistranslated directions, more than any confirmed find, shaped where subsequent generations of explorers went looking for gold in the Americas."
 western_ocean_voyage_events.7.title: "We Read the Reports at [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 western_ocean_voyage_events.7.desc: "Корабли наконец входят в гавань, покрытые солью и потрёпанные, и уже через несколько дней рассказ [target_leader.GetName] зачитывают вслух в [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Острова, переход через океан, странные птицы и ещё более странные плоды, золото, что носили люди, никогда прежде о нас не слышавшие, — до самого того мига, когда мы явились.\n\nМногие сомневаются в большей части сказанного, но мы всё же записываем всё до слова. Карты начинают меняться, осторожно, в западных полях, где прежде ничего не было начертано."
 western_ocean_voyage_events.7.a: "Let the account stand as written."
 western_ocean_voyage_events.7.historical_info: "Written and oral reports from the returning expeditions were read at royal courts across Western Europe within months of each landfall, and translated versions circulated widely thereafter. These accounts, garbled by translation and by the ambitions of their tellers, described interior wealth that no European had yet seen firsthand. It was this secondhand testimony, more than any confirmed discovery, that sent subsequent generations of explorers searching further inland and further south for the sources of what the first arrivals had only glimpsed."
 western_ocean_voyage_mythical_cities_tt: "Charting the coasts of the Americas will make the [expeditions|e] to search for its legendary lost cities available"
