l_russian:
 crisis_of_faith.1.title: "Начало раскола"
 crisis_of_faith.1.desc: "Благоговение перед нашей государственной церковью пошатнулось, и верующие перестали внимать её учению. Проповедники, сеющие раскол, обретают всё больше сторонников, а духовенство разделилось на реформаторов и консерваторов. Нам предстоит решить, как поступить: пойти на уступки реформаторам и найти компромисс или уничтожить раскол огнём и мечом."
 crisis_of_faith.1.a: "Пойти на уступки реформаторам."
 crisis_of_faith.1.b: "Уничтожить раскольников!"
 crisis_of_faith.1.tt: "Самые неспокойные провинции выступят в поддержку фракции, связанной с #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризисом веры#!#!"
 crisis_of_faith.1.a.tt: "Духовенство в некоторых самых неспокойных провинциях всё же присоединится к фракции, связанной с #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризисом веры#!#!"
 crisis_of_faith.2.title: "Распространение ереси"
 crisis_of_faith.2.desc: "До нас доходят вести о том, что целые приходы принимают раскольническое учение. Мы можем отправить верных священнослужителей, чтобы истребить еретиков, пока эта зараза не распространилась дальше, или же не вмешиваться и надеяться, что религиозный пыл со временем угаснет сам собой."
 crisis_of_faith.2.a: "Пора истребить еретиков."
 crisis_of_faith.2.b: "Пусть идёт, как идёт."
 crisis_of_faith.3.title: "Сплочение верующих"
 crisis_of_faith.3.desc: "В противовес раскольникам повсюду стали собираться толпы набожных людей, чтобы вновь заявить о своей преданности истинной вере. Их рвение способно вновь разжечь религиозный пыл по всей державе, но без должного контроля он может обернуться волнениями."
 crisis_of_faith.3.a: "Рвение верующих заслуживает нашей поддержки."
 crisis_of_faith.3.b: "Не допускайте беспорядков."
 crisis_of_faith.4.title: "Духовенство призывает изменить вероучение"
 crisis_of_faith.4.desc: "Делегация умеренно настроенных священнослужителей просит нас внести изменения в церковное учение и устранить разногласия, пока они не привели к ещё большему расколу. Одобрение предложенных ими реформ успокоит священнослужителей и замедлит распространение раскола, однако отступление от священного учения имеет свою цену. Отказ позволит отстоять неизменность догматов, но точно повредит отношениям с духовенством."
 crisis_of_faith.4.a: "Мы готовы одобрить предложенные ими реформы."
 crisis_of_faith.4.b: "Мы ни за что не поменяем наше вероучение."
 crisis_of_faith.5.title: "Повод учредить инквизицию"
 crisis_of_faith.5.desc: "Наши самые ревностные священнослужители молят нас учредить инквизицию и при её участии начать преследование раскольников. Они помогут возродить благочестие и усмирить еретиков. Однако посеянный ими страх охватит всю державу. А можно проявить сдержанность и уберечь население от ещё больших страданий."
 crisis_of_faith.5.a: "Раскольниками займётся инквизиция."
 crisis_of_faith.5.b: "Стоит проявить сдержанность."
 crisis_of_faith.12.title: "Покровитель раскола"
 crisis_of_faith.12.desc: "У раскольников появился щедрый покровитель. [crisis_of_faith_heresiarch_scope.GetName] [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'была приглашена', 'был приглашён')] на приём в один из роскошных дворцов нашей державы, а его знатный хозяин теперь оплачивает переписывание запрещённых нами проповедей. Мы можем тайно перекупить его лояльность или же смириться с тем, что правительство не может следить за каждым дворцом в наших землях."
 crisis_of_faith.12.a: "Давайте перекупим его лояльность."
 crisis_of_faith.12.b: "Невозможно следить за каждым дворцом."
 crisis_of_faith.13.title: "Публичные проповеди"
 crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] больше не проповедует по подвалам. На рыночной площади собралась толпа, чтобы услышать раскольническое учение, и никто не попытался её разогнать. Остановить проповедь — значит показать, что наша церковь ещё способна утверждать свою власть, но силой стащить проповедника с кафедры на глазах у толпы — само по себе скандал."
 crisis_of_faith.13.a: "Остановите проповедь."
 crisis_of_faith.13.b: "Пусть верующие сами решают."
 crisis_of_faith.100.title: "Искоренение ереси"
 crisis_of_faith.100.desc: "Раскол удалось преодолеть. Проповедники-раскольники разогнаны, их последователи вернулись в лоно церкви, а духовенство вновь исповедует единое вероучение. Церковь возродилась, её авторитет восстановлен, а наша вера укрепилась."
 crisis_of_faith.100.a: "Вера устояла."
 crisis_of_faith.101.title: "Утверждение раскольнического учения"
 crisis_of_faith.101.desc: "Раскол одержал верх. Реформированное вероучение повсеместно утверждается в наших церквях и при дворе, а старое учение отвергается. Целому поколению жителей нашей державы предстоит жить в условиях религиозного раскола, а духовенство более не будет всецело признавать власть нашей короны."
 crisis_of_faith.101.desc.heresiarch: "Раскол одержал верх, и у него есть лидер, у которого есть имя. [crisis_of_faith_heresiarch_scope.GetName] [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'проповедовала', 'проповедовал')] реформированное учение до тех пор, пока его уже нельзя было заглушить. Однако нашу власть сломило не [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'её', 'его')] слово, а восставшее духовенство, одержавшее победу на поле боя. Теперь победители провозглашают возвышение ересиарха, и в церкви не осталось никого, кто был бы готов дать им отпор. Святыни, которые мы прежде защищали, теперь без лишнего шума предают забвению."
 crisis_of_faith.101.a: "Раскол торжествует."
 crisis_of_faith.101.b: "Пусть ересиарх займёт трон."
 crisis_of_faith.102.title: "Отречение от веры"
 crisis_of_faith.102.desc: "Церковь больше не находится под нашей властью. Раскольники продолжают проповедовать своё учение, но наши священнослужители уже не вступают с ними в полемику, поскольку наше духовенство больше не представляет государство. Учение, которое мы отказались защищать, всё ещё живёт в речах верующих, а сторонники старых догм помнят, как мы оставили их без поддержки."
 crisis_of_faith.102.a: "Церковь больше не подчиняется нашей власти."
 crisis_of_faith.10.title: "Проповедь обновления"
 crisis_of_faith.10.desc: "Мы направляем наиболее преданных церкви священнослужителей к народу, чтобы те проповедовали обновление веры и призывали верующих вернуться в лоно церкви. Их проповеди укрепляют веру по всей державе и отвращают людей от раскольников, однако всеобщий религиозный подъём грозит нарушить привычный порядок вещей."
 crisis_of_faith.10.a: "Отправьте проповедников."
 crisis_of_faith.10.a.tt: "Все группы населения, поддерживающие в настоящее время фракцию, связанную с #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризисом веры#!#!, получат некоторую часть довольства"
 crisis_of_faith.11.title: "Проведение синода"
 crisis_of_faith.11.desc: "Мы созываем духовенство на великий собор, чтобы раз и навсегда разрешить разногласия в вопросах веры. Собравшиеся архиереи сплачиваются вокруг ортодоксального учения, оставляя раскольников в изоляции и отчасти восстанавливая единство церкви."
 crisis_of_faith.11.a: "Созовём собор."
 crisis_of_faith.11.a.tt: "Все группы населения, поддерживающие в настоящее время фракцию, связанную с #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризисом веры#!#!, получат некоторую часть довольства"
 crisis_of_faith.6.title: "Виновник церковного раскола"
 crisis_of_faith.6.desc: "Наши агенты проследили путь запрещённых проповедей, выявив переписчиков и гонцов, которые передавали их дальше. Все следы ведут к одному человеку. Это [crisis_of_faith_heresiarch_scope.GetName]! Именно [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'она', 'он')] стоит за раскольническим учением и именно [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'она', 'он')] до сих пор [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'проповедовала', 'проповедовал')] его прямо в стенах нашей церкви."
 crisis_of_faith.6.a: "Раскройте имя ересиарха."
 crisis_of_faith.6.a.tt: "Личность ересиарха установлена. Открыто действие «Осуждение ересиарха»"
 crisis_of_faith.7.title: "Осуждение ересиарха"
 crisis_of_faith.7.desc.ready: "Корона вновь обрела авторитет, и настал час показать свою силу в действии. [crisis_of_faith_heresiarch_scope.GetName] будет [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'разоблачена', 'разоблачён')] перед лицом собравшихся верующих — мы во всех подробностях раскроем [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'её', 'его')] заблуждения и лишим влияния, благодаря которому стал возможен текущий раскол. Без своего создателя реформированное вероучение превратится в пустые слухи."
 crisis_of_faith.7.desc.not_ready: "Мы могли бы назвать имя ересиарха перед лицом собравшихся верующих, а [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'ею', 'им')] оказался [crisis_of_faith_heresiarch_scope.GetName], и могли бы покончить с расколом раз и навсегда. Однако у короны здесь нет власти. Духовенство, укрывающее [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'её', 'его')], обладает большей властью, чем престол, желающий осудить [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'еретичку', 'еретика')]. Так что если попытка обличить ересиарха провалится, в памяти останется не само обвинение, а отказ церкви подчиниться воле короны."
 crisis_of_faith.7.a: "Ересиарх будет осуждён перед лицом верующих."
 crisis_of_faith.7.a.fail_tt: "Короне не хватает власти, чтобы выступить против ересиарха."
 crisis_of_faith.8.title: "Согласие с раскольниками"
 crisis_of_faith.8.desc: "Раскол невозможно преодолеть силой, и остаётся лишь пойти на уступки. Мы признаем вероучение реформаторов и предоставим им соответствующее положение в нашей церкви. Их фракция распадётся, а проповедники вернутся в приходы, которые теперь будут принадлежать им по праву. Прежнего благочестия нам уже не вернуть, а сделанные уступки будет невозможно отменить."
 crisis_of_faith.8.a: "Пусть исповедуют своё учение."
