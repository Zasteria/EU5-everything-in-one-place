l_russian:
 crisis_of_faith.1.title: "Раскол разгорается"
 crisis_of_faith.1.desc: "Приверженность нашей государственной церкви пошатнулась, и верующие более не внимают её учению. Проповедники-раскольники собирают сторонников, а духовенство раскалывается на реформаторов и непримиримых. Нам предстоит выбрать путь: пойти навстречу реформаторам и искать примирения, либо подавить раскол огнём и мечом."
 crisis_of_faith.1.a: "Пойти навстречу реформаторам."
 crisis_of_faith.1.b: "Подавить раскольников!"
 crisis_of_faith.1.tt: "Наиболее неспокойные провинции восстанут в поддержку фракции «[ShowDisasterName('crisis_of_faith')]»"
 crisis_of_faith.2.title: "Ересь распространяется"
 crisis_of_faith.2.desc: "Приходят донесения о целых приходах, обратившихся к раскольническому учению. Мы можем направить верное духовенство, чтобы искоренить еретиков прежде, чем зараза распространится дальше, или пустить дело на самотёк в надежде, что пламя ереси угаснет само собой."
 crisis_of_faith.2.a: "Искоренить еретиков."
 crisis_of_faith.2.b: "Оставить всё как есть."
 crisis_of_faith.3.title: "Сплочение верных"
 crisis_of_faith.3.desc: "In defiance of the schism, devout crowds gather to reaffirm the orthodox faith. Their zeal could rekindle devotion across the realm, though such passions can easily tip into unrest if left unchecked."
 crisis_of_faith.3.a: "Разделить их рвение."
 crisis_of_faith.3.b: "Поддержать порядок."
 crisis_of_faith.4.title: "Духовенство требует реформы вероучения"
 crisis_of_faith.4.desc: "Делегация умеренного духовенства просит нас изменить церковное учение и залечить раскол, пока он не расширился. Согласие на реформы успокоит духовенство и замедлит раскол, но пересмотр священного учения — дело нешуточное. Отказ же удержит прежний порядок ценой расположения клира."
 crisis_of_faith.4.a: "Одобрить их реформы."
 crisis_of_faith.4.b: "Отказаться менять доктрину."
 crisis_of_faith.5.title: "Возможность для инквизиции"
 crisis_of_faith.5.desc: "Наше самое ревностное духовенство просит разрешения начать инквизицию против раскольников. Чистка восстановит благочестие и усмирит еретиков, но порождённый ею страх разойдётся по всему королевству. Мы также можем проявить сдержанность, избавив народ от лишних страданий."
 crisis_of_faith.5.a: "Начать инквизицию."
 crisis_of_faith.5.b: "Проявить сдержанность."
 crisis_of_faith.100.title: "Ересь сокрушена"
 crisis_of_faith.100.desc: "The schism has been mended. The schismatic preachers are scattered, their followers returned to the fold, and the clergy reunited beneath the orthodox banner. Our church stands renewed, its authority and our devotion restored."
 crisis_of_faith.100.a: "Вера выстояла."
 crisis_of_faith.101.title: "Раскольническая доктрина укрепилась"
 crisis_of_faith.101.desc: "The schism has prevailed. The reformed doctrine takes root in our churches and our courts, and the old orthodoxy is cast aside. For a generation, our realm will live with a divided faith and a clergy that no longer answers wholly to our throne."
 crisis_of_faith.101.a: "Раскол одерживает победу."
 crisis_of_faith.10.title: "Preach Renewal"
 crisis_of_faith.10.desc: "Мы отправляем наше самое преданное духовенство к народу, чтобы проповедовать обновление и призывать верующих вернуться домой. Их проповеди возрождают благочестие по всему государству и лишают раскольников их сторонников, хотя потрясение великого возрождения нарушает привычный порядок вещей."
 crisis_of_faith.10.a: "Отправить проповедников."
 crisis_of_faith.11.title: "Convene a Synod"
 crisis_of_faith.11.desc: "Мы созываем духовенство на великий собор, чтобы окончательно разрешить спорную доктрину. Собравшиеся прелаты смыкают ряды вокруг ортодоксального учения, изолируя раскольническую фракцию и восстанавливая некоторую степень единства церкви."
 crisis_of_faith.11.a: "Созвать собор."
 crisis_of_faith.1.a.tt: "Духовенство в нескольких наиболее неспокойных провинциях всё же присоединится к фракции «[ShowDisasterName('crisis_of_faith')]»"
 crisis_of_faith.10.a.tt: "Все попы, поддерживающие сейчас фракцию [ShowDisasterName('crisis_of_faith')], получат некоторое удовлетворение"
 crisis_of_faith.101.b: "Пусть ересиарх взойдёт на престол."
 crisis_of_faith.101.desc.heresiarch: "Раскол одержал победу, и у него есть лицо. [crisis_of_faith_heresiarch_scope.GetName] проповедовал реформированное учение, пока его нельзя было заставить молчать, хотя именно взбунтовавшееся духовенство сломило нашу власть на поле боя. Теперь победившее духовенство провозглашает возвышение [crisis_of_faith_heresiarch_scope.GetHerHis], и в нашей церкви не осталось никого, кто желал бы им отказать. То, что мы защищали как священное, тихо отложено в сторону."
 crisis_of_faith.102.a: "Церковь более не наша, чтобы ею править."
 crisis_of_faith.102.desc: "Мы больше не правим как церковь. Что бы ни проповедовали раскольники, наше духовенство им не ответит, ибо оно более не говорит от имени государства. Доктрина, которую мы перестали защищать, осталась в устах верующих, а те, кто хранил для нас старое православие, помнят, кто оставил их без защиты."
 crisis_of_faith.102.title: "Вера оставлена"
 crisis_of_faith.11.a.tt: "Каждый поп, поддерживающий сейчас фракцию [ShowDisasterName('crisis_of_faith')], получит некоторое удовлетворение"
 crisis_of_faith.12.a: "Вернуть эту верность за деньги."
 crisis_of_faith.12.b: "Мы не в силах уследить за каждым залом."
 crisis_of_faith.12.desc: "Дело раскольников нашло себе кошелёк. [crisis_of_faith_heresiarch_scope.GetName] был принят в одном из великих залов нашего королевства, и знатный вельможа, открывший ему двери, теперь оплачивает переписывание проповедей, которые мы запретили. Мы можем тайно предложить ему больше за верность или же признать, что не в силах уследить за каждым залом в стране."
 crisis_of_faith.12.title: "Покровитель раскола"
 crisis_of_faith.13.a: "Заставить проповедника замолчать."
 crisis_of_faith.13.b: "Пусть верующие сами рассудят."
 crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] больше не проповедует в подвалах. На рыночной площади собралась толпа, чтобы услышать раскольническую доктрину, произнесённую вслух, и никто не попытался этому помешать. Заставить проповедника замолчать значило бы показать, что наша церковь всё ещё сохраняет власть, хотя стаскивать проповедника с кафедры на глазах у толпы — само по себе скандал."
 crisis_of_faith.13.title: "Проповедь на открытом месте"
 crisis_of_faith.6.a: "Назвать ересиарха."
 crisis_of_faith.6.a.tt: "Ересиарх установлен, открыто действие «Обличить ересиарха»"
 crisis_of_faith.6.desc: "Наши агенты проследили путь запретных проповедей через переписчиков и курьеров, что их переносили, и каждый след ведёт к одной и той же двери. [crisis_of_faith_heresiarch_scope.GetName] — автор раскольнического учения, и до сих пор [crisis_of_faith_heresiarch_scope.GetSheHe] проповедовал(а) его внутри нашей же церкви."
 crisis_of_faith.6.title: "Рука, стоящая за раскольом"
 crisis_of_faith.7.a: "Осудить ересиарха перед верующими."
 crisis_of_faith.7.a.fail_tt: "У короны недостаточно власти, чтобы выступить против ересиарха"
 crisis_of_faith.7.desc.not_ready: "Мы бы назвали [crisis_of_faith_heresiarch_scope.GetName] перед собравшимися верующими и покончили с расколом, но корона не властна в этом зале. Духовенство, что укрывает [crisis_of_faith_heresiarch_scope.GetHerHim], сильнее трона, что желал бы осудить [crisis_of_faith_heresiarch_scope.GetHerHim], а провалившееся обличение запомнится как обличение отвергнутое."
 crisis_of_faith.7.desc.ready: "Корона снова говорит с властью, и настал момент воспользоваться ею. Мы назовём [crisis_of_faith_heresiarch_scope.GetName] перед собравшимися верующими, изложим [crisis_of_faith_heresiarch_scope.GetHerHis] заблуждения в полном объёме и лишим [crisis_of_faith_heresiarch_scope.GetHerHim] положения, что и сделало раскол возможным. Без своего автора реформированное учение — не более чем слух."
 crisis_of_faith.7.title: "Обличить ересиарха"
 crisis_of_faith.8.a: "Позволить им получить своё учение."
 crisis_of_faith.8.desc: "Раскол не сломить, значит, его нужно купить. Мы предоставим реформаторам требуемое ими учение и положение внутри нашей церкви, что с ним связано. Фракция распустится, а её проповедники вернутся в общины, которые теперь по праву принадлежат им. Наша набожность не восстановится после этого, и уступку нельзя будет отменить."
 crisis_of_faith.8.title: "Уступить раскольникам"
