l_russian:
 oligarchic_capture.1.title: "Усиление фракции"
 oligarchic_capture.1.desc: "Долгие годы упадка подорвали наши республиканские институты изнутри. Почувствовав слабость государства, одно из влиятельных сословий решило прибрать к рукам весь законодательный аппарат, оттеснив от власти политических соперников и подчинив закон собственной воле. Перед нами стоит непростой выбор: принять требования фракции и сохранить непрочный мир либо дать отпор, рискуя спровоцировать открытый мятеж."
 oligarchic_capture.1.a: "Придётся уступить требованиям фракции."
 oligarchic_capture.1.b: "Мы окажем им сопротивление, чего бы это ни стоило!"
 oligarchic_capture.1.tt: "Самые недовольные провинции выступят в поддержку фракции, связанной с #TOOLTIP:DISASTER_TYPE,oligarchic_capture,X #L олигархическим захватом#!#!"
 oligarchic_capture.2.title: "Олигархи вымогают деньги"
 oligarchic_capture.2.desc: "Предводители фракции предъявляют нам едва завуалированное требование передать им крупную сумму денег под видом заботы об общественном благе. Если мы уступим, их недовольство на время утихнет. Если откажем, они обратят наше решение себе на пользу и привлекут на свою сторону ещё больше сторонников."
 oligarchic_capture.2.a: "Мы заплатим солдатам."
 oligarchic_capture.2.b: "Мы не потерпим вымогательства."
 oligarchic_capture.3.title: "Граждане требуют реформ"
 oligarchic_capture.3.desc: "На городских площадях собираются толпы людей, требующих покончить с засильем фракций и вернуть республике честное правление. Их пыл даёт нам возможность возродить республиканские идеалы, однако потворство разгорячённой толпе грозит привести к волнениям."
 oligarchic_capture.3.a: "Стоит поддержать их требования."
 oligarchic_capture.3.b: "Обеспечьте порядок на улицах."
 oligarchic_capture.4.title: "Чистка среди сенаторов"
 oligarchic_capture.4.desc: "Олигархи добиваются исключения из сената целой группы сенаторов, чью преданность они ставят под сомнение. Согласие на эту чистку позволит ненадолго стабилизировать обстановку в державе, но усилит позиции фракции. Заступившись за обвиняемых, мы отстоим наши институты, хотя и это чревато новыми потрясениями."
 oligarchic_capture.4.a: "Ничего не имеем против чистки."
 oligarchic_capture.4.b: "Предоставьте защиту обвиняемым."
 oligarchic_capture.5.title: "Беспорядки на улицах"
 oligarchic_capture.5.desc: "Противостояние сторонников фракции и её противников вылилось в потасовки на рынках и пристанях. Мы можем выждать, пока страсти утихнут сами собой, или отправить стражу на подавление беспорядков."
 oligarchic_capture.5.a: "Дайте страстям улечься."
 oligarchic_capture.5.b: "Подавите беспорядки твёрдой рукой."
 oligarchic_capture.100.title: "Восстановление республики"
 oligarchic_capture.100.desc: "Господству фракции положен конец. Наши суды, советы и собрания вновь действуют в интересах граждан, а не узкого круга вельмож. Республика преодолела кризис, а её государственные институты вышли из него окрепшими."
 oligarchic_capture.100.a: "Наши институты выстояли."
 oligarchic_capture.101.title: "Утверждение олигархической конституции"
 oligarchic_capture.101.desc: "Фракция одержала победу. Новая конституция, составленная в интересах олигархов, закрепляет их господство в самом фундаменте государства. На целое поколение от республики останется одно название, а все государственные посты станут предметом торга между узким кругом власть имущих."
 oligarchic_capture.101.desc.ringleader: "Фракция одержала победу, а её главарь по имени [oligarchic_ringleader_scope.GetName] выходит из тени закулисных интриг в сенате и открыто претендует на корону. На целое поколение от республики останется одно название, а все государственные посты станут предметом торга между узким кругом власть имущих."
 oligarchic_capture.101.a: "Фракция одержала победу."
 oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] завладевает короной."
 oligarchic_capture.6.title: "Разоблачение главаря"
 oligarchic_capture.6.desc: "Неделями наши агенты шли по следу денежных переводов, подарков и тайных распоряжений внутри фракции. В конце концов выяснилось, кто на самом деле стоит за её действиями — некто по имени [oligarchic_ringleader_scope.GetName]."
 oligarchic_capture.6.a: "Теперь мы знаем, с кем имеем дело."
 oligarchic_capture.7.title: "Противостояние с главарём"
 oligarchic_capture.7.desc.ready: "[oligarchic_ringleader_scope.GetName] [Select_CString(oligarchic_ringleader_scope.IsFemale, 'разоблачена', 'разоблачён')], и теперь мы можем открыто выступить против [Select_CString(oligarchic_ringleader_scope.IsFemale, 'неё', 'него')]. Авторитет короны достаточно укрепился, чтобы без промедления разгромить фракцию."
 oligarchic_capture.7.desc.not_ready: "[oligarchic_ringleader_scope.GetName] [Select_CString(oligarchic_ringleader_scope.IsFemale, 'разоблачена', 'разоблачён')], и мы могли бы открыто выступить против [Select_CString(oligarchic_ringleader_scope.IsFemale, 'неё', 'него')], однако авторитет короны ещё недостаточно высок. Поспешный удар лишь укрепит единство фракции."
 oligarchic_capture.7.a: "Пора выступить против них."
 oligarchic_capture.7.a.success_tt: "Наша [Concept('crown_power', 'власть правителя')|e] составляет не менее 30%, поэтому попытка увенчается успехом"
 oligarchic_capture.7.a.fail_tt: "Наша [Concept('crown_power', 'власть правителя')|e] пока ниже 30%, поэтому попытка обречена на провал, а последовавшая реакция серьёзно подорвёт стабильность"
 oligarchic_capture.8.title: "Переговоры с сословием об уступках"
 oligarchic_capture.8.desc: "Вместо прямой конфронтации с фракцией мы начинаем негласные переговоры, предлагая золото и небольшие уступки в надежде унять недовольство и сдержать дальнейший рост её влияния."
 oligarchic_capture.8.a: "Начнём переговоры."
 oligarchic_capture.12.title: "Главарь обхаживает придворного"
 oligarchic_capture.12.desc: "До нас дошли вести, что главарь фракции ведёт тайные переговоры с одним из наших придворных, предлагая ему всевозможные блага в обмен на поддержку. Мы можем закрыть на это глаза или принять меры, чтобы заручиться верностью придворного."
 oligarchic_capture.12.a: "Пусть всё идёт своим чередом. Оно того не стоит."
 oligarchic_capture.12.b: "Напомните придворному о его долге перед короной."
 oligarchic_capture.13.title: "Главарь испытывает власть короны"
 oligarchic_capture.13.desc: "На глазах у всего двора главарь фракции открыто испытывает власть короны на прочность, пытаясь выявить её слабости. Мы можем оставить эти выпады без ответа либо решительно пресечь подобные выходки."
 oligarchic_capture.13.a: "Оставьте эти выпады без ответа."
 oligarchic_capture.13.b: "Необходимо решительно пресечь эти выпады."
 oligarchic_capture.10.title: "Объединение граждан"
 oligarchic_capture.10.desc: "Наши глашатаи разносят по всем кварталам и рынкам весть о том, что республика принадлежит её гражданам, а не горстке вельмож. На площадях собираются те, кто готов выступить в защиту прежнего порядка, однако подобные собрания могут обернуться беспорядками."
 oligarchic_capture.10.a: "Вперёд, на городские площади!"
 oligarchic_capture.11.title: "Зачистка олигархов"
 oligarchic_capture.11.desc: "Мы решаем устранить руководство фракции. По нашему приказу повсеместно производятся аресты, прежние связи фракции рушатся, а её власть над нашими институтами слабеет. Знать возмущена действиями властей, державу сотрясают потрясения, однако олигархи теряют свои позиции."
 oligarchic_capture.11.a: "Устраните главарей фракции."
