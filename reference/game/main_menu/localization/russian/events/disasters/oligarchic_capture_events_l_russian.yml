l_russian:
 oligarchic_capture.1.title: "Восстание фракции"
 oligarchic_capture.1.desc: "Годы упадка подточили наши республиканские институты. Одно из сословий, почуяв слабость власти, вознамерилось прибрать к рукам законодательные органы, отстранив соперников и подчинив закон своей воле. Нам предстоит решить, как встретить этот вызов: покориться фракции и сохранить хрупкий мир или же дать ей отпор, рискуя открытым мятежом."
 oligarchic_capture.1.a: "Покориться требованиям фракции."
 oligarchic_capture.1.b: "Дать им отпор, чего бы это ни стоило!"
 oligarchic_capture.1.tt: "Наиболее недовольные провинции восстанут в поддержку фракции [ShowDisasterName('oligarchic_capture')]"
 oligarchic_capture.2.title: "Олигархи требуют дань"
 oligarchic_capture.2.desc: "Главари фракции выдвигают нам едва прикрытое требование денег, выдавая его за вклад в общественное благо. Заплатим — и их пыл на время утихнет. Откажем — и они используют наше неповиновение, чтобы собрать под своими знамёнами ещё больше сторонников."
 oligarchic_capture.2.a: "Мы заплатим солдатам."
 oligarchic_capture.2.b: "Нас не запугать вымогательством."
 oligarchic_capture.3.title: "Граждане требуют реформ"
 oligarchic_capture.3.desc: "На площадях собираются толпы, требуя восстановления честного правления и конца власти фракций. Их рвение — шанс вернуть республиканский дух, хотя потакание толпе грозит беспорядками."
 oligarchic_capture.3.a: "Поддержать их дело."
 oligarchic_capture.3.b: "Навести порядок на улицах."
 oligarchic_capture.4.title: "Чистка в сенате"
 oligarchic_capture.4.desc: "Олигархи намерены изгнать группу сенаторов, которых считают неблагонадёжными. Позволить эту чистку — значит на время успокоить государство, но подарить фракции ещё одну победу. Защитить обвинённых — значит отстоять наши институты ценой новых потрясений."
 oligarchic_capture.4.a: "Позволить чистке свершиться."
 oligarchic_capture.4.b: "Защитить обвинённых."
 oligarchic_capture.5.title: "Волнения на улицах"
 oligarchic_capture.5.desc: "Стычки между сторонниками фракции и их противниками выплёскиваются на рынки и в порт. Мы можем дать страстям утихнуть самим или послать стражу навести порядок твёрдой рукой."
 oligarchic_capture.5.a: "Дать страстям утихнуть."
 oligarchic_capture.5.b: "Решительно навести порядок."
 oligarchic_capture.100.title: "The Republic Restored"
 oligarchic_capture.100.desc: "Хватка фракции сломлена. Наши суды, советы и собрания вновь отвечают перед гражданами, а не перед кликой знати. Республика выдержала бурю, и её институты закалились этим испытанием."
 oligarchic_capture.100.a: "Наши институты устояли."
 oligarchic_capture.101.title: "Олигархическая конституция укоренилась"
 oligarchic_capture.101.desc: "Фракция победила. Новая конституция, составленная в угоду олигархам, закрепляет их господство в самих основах государства. На целое поколение наша республика останется республикой лишь по названию, а её должности будут переходить из рук в руки среди узкого круга могущественных лиц."
 oligarchic_capture.101.desc.ringleader: "Фракция победила, и её вожак, [oligarchic_ringleader_scope.GetName], выходит из тени сенатских кулуаров, чтобы открыто заявить свои права на корону. На целое поколение наша республика останется республикой лишь по названию, а её должности будут переходить из рук в руки среди узкого круга могущественных лиц."
 oligarchic_capture.101.a: "Фракция победила."
 oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] получает корону."
 oligarchic_capture.6.title: "Разоблачение вожака"
 oligarchic_capture.6.desc: "Наши агенты неделями прослеживали монеты, услуги и тайные указания в рядах фракции. Наконец удалось выяснить единственное имя того, кто действительно направляет её курс: [oligarchic_ringleader_scope.GetName]."
 oligarchic_capture.6.a: "Теперь мы знаем, с кем иметь дело."
 oligarchic_capture.7.title: "Confront the Ringleader"
 oligarchic_capture.7.desc.ready: "Теперь, когда [oligarchic_ringleader_scope.GetName] разоблачён, мы можем действовать против него напрямую. Власть короны восстановилась в достаточной мере, чтобы фракцию можно было быстро сокрушить."
 oligarchic_capture.7.desc.not_ready: "Теперь, когда [oligarchic_ringleader_scope.GetName] разоблачён, мы могли бы действовать против него напрямую, но власть короны ещё не восстановилась в достаточной мере. Поспешный удар может лишь сплотить фракцию ещё сильнее."
 oligarchic_capture.7.a: "Выступить против них."
 oligarchic_capture.7.a.fail_tt: "Наша [crown_power|e] ещё не достигла 30%, поэтому попытка провалится, а ответный удар дорого обойдётся нашей стабильности"
 oligarchic_capture.8.title: "Negotiate Estate Concessions"
 oligarchic_capture.8.desc: "Вместо того чтобы открыто противостоять фракции, мы открываем тайный канал переговоров, предлагая золото и небольшие уступки, дабы смягчить её недовольство и замедлить её рост."
 oligarchic_capture.8.a: "Начать переговоры."
 oligarchic_capture.12.title: "Главарь ухаживает за придворным"
 oligarchic_capture.12.desc: "До нас доходит весть, что главарь фракции тайно обхаживает одного из придворных нашего двора, предлагая услуги и обещания в обмен на поддержку. Мы можем закрыть на это глаза или укрепить верность придворного."
 oligarchic_capture.12.a: "Оставить всё как есть; не стоит хлопот."
 oligarchic_capture.12.b: "Подтвердить верность придворного короне."
 oligarchic_capture.13.title: "Главарь испытывает коронные владения"
 oligarchic_capture.13.desc: "Главарь фракции открыто испытывает, насколько далеко ещё простирается власть коронных владений, выискивая слабые места на глазах у всего двора. Мы можем оставить этот вызов без ответа или ответить решительно."
 oligarchic_capture.13.a: "Оставить вызов без ответа."
 oligarchic_capture.13.b: "Ответить решительно."
 oligarchic_capture.10.title: "Rally the Citizenry"
 oligarchic_capture.10.desc: "Глашатаи разносят наш призыв по каждому кварталу и рынку: республика принадлежит своим гражданам, а не кучке знатных особ. Площади заполняются теми, кто готов отстоять старый порядок, хотя подобные сборища всегда чреваты беспорядками."
 oligarchic_capture.10.a: "На площади!"
 oligarchic_capture.11.title: "Purge the Oligarchs"
 oligarchic_capture.11.desc: "Мы решаем нанести удар прямо по руководству фракции. Проводятся аресты, их сети разрушаются, а хватка на наших институтах ослабевает. Знать возмущена суровыми мерами, и государство содрогается, но олигархи отброшены назад."
 oligarchic_capture.11.a: "Нанести удар по их лидерам."
 oligarchic_capture.7.a.success_tt: "Наша [crown_power|e] достигла 30% или более, поэтому попытка увенчается успехом"
