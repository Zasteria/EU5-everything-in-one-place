l_russian:
 flavor_iberian_union.1.title: "Пиренейская свадьба"
 flavor_iberian_union.1.desc: "Брак, объединивший короны #ONCLICK:COUNTRY,[iu_member_a.Custom('CL_tt')] #TOOLTIP:COUNTRY,[iu_member_a.Custom('CL_tt')],X [iu_member_a.Custom('CL_GEN')|L]#!#! и #ONCLICK:COUNTRY,[iu_member_b.Custom('CL_tt')] #TOOLTIP:COUNTRY,[iu_member_b.Custom('CL_tt')],X [iu_member_b.Custom('CL_GEN')|L]#!#!, даёт возможность выковать прочный союз между нашими державами. Хотя этот союз родился из политической необходимости, [ROOT.GetCountry.GetGovernment.GetAdjective]ая чета, судя по всему, вполне счастлива в браке, и вместе они укрепляют унию, создавая прочное политическое образование, которое можно считать великой державой в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!."
 flavor_iberian_union.1.historical_info: "Самый известный из иберийских династических союзов был заключён в 1469 году браком Изабеллы I Кастильской и Фердинанда II Арагонского, католических королей. Их союз объединил две величайшие короны полуострова, сохранив при этом отдельные институты каждой, а их внук Карл унаследовал обе как единое королевство. Столетие спустя, в 1580 году, Филипп II предъявил права на пустующий португальский трон и объединил Кастилию, Арагон и Португалию под властью испанских Габсбургов вплоть до Португальской реставрации 1640 года."
 flavor_iberian_union.1.a: "Пусть ничто не нарушит единения двух наших стран!"
 flavor_iberian_union.2.title: "Иберийская уния"
 flavor_iberian_union.2.desc: "Короны #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! перешли к одному государю. То, что начиналось как брак двух домов, стало личной унией: троны наших держав теперь покоятся на одном челе. Каждое королевство сохраняет свои законы, свои суды и свою гордость, но в вопросах легитимности и династии они говорят одним голосом. Рождается Иберийская уния — а вместе с ней и обещание державы, способной соперничать с любой в христианском мире."
 flavor_iberian_union.2.historical_info: "Когда наследник двух корон унаследовал обе, получилось не единое королевство, а составная монархия: отдельные государства с общим правителем. Такова была конституционная реальность Испанской монархии, где Кастилия, Арагон, а позднее и Португалия сохраняли каждая свои #italic кортесы#!, законы и управление при общем короле. Такие унии длились лишь до тех пор, пока существовала общая династия, а отсутствие наследника могло разделить то, что соединил брак."
 flavor_iberian_union.2.a: "Пусть наши державы процветают как одна."
 flavor_iberian_union.3.title: "Пиренейская свадьба"
 flavor_iberian_union.3.desc: "Вопрос престолонаследия тяжким грузом лежит над нашей державой, пока [initiator_candidate.GetName] [Select_CString(initiator_candidate.IsFemale,'не замужем','не женат')]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] подталкивает сословие [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] к поискам брака ради обеспечения престолонаследия, и звучат предложения связать нашу судьбу с одной из прочих #TOOLTIP:RELIGIONGROUP,christian,X #L христианских#!#! корон #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!. Без сильного преемника [ROOT.GetCountry.GetFlavorRank] может столкнуться со смутой, соперничающими претендентами и даже иностранным вмешательством."
 flavor_iberian_union.3.historical_info: "Так называемая Пиренейская свадьба сыграла ключевую роль в династическом кризисе, охватившем Кастилию после смерти короля Энрике IV. На трон претендовали два кандидата: Изабелла Кастильская, которую поддержал её муж Фердинанд Арагонский, и её племянница Хуана, за которой стояла Португалия. Противостояние завершилось победой Изабеллы и Фердинанда, ознаменовавшей начало эпохи так называемых католических монархов. Заключённая ими уния между Кастилией и Арагоном привела к образованию единого испанского государства."
 flavor_iberian_union.3.a: "Отправим предложение о браке [iu_partner_a.Custom('CL_DAT')]."
 flavor_iberian_union.3.b: "Обратимся вместо этого к [iu_partner_b.Custom('CL_DAT')]."
 flavor_iberian_union.3.c: "Найдём другой способ."
 flavor_iberian_union.4.title: "Пиренейская свадьба"
 flavor_iberian_union.4.desc: "Посланник #ONCLICK:COUNTRY,[iu_initiator.Custom('CL_tt')] #TOOLTIP:COUNTRY,[iu_initiator.Custom('CL_tt')],X [iu_initiator.Custom('CL_GEN')|L]#!#! прибыл к нам и предлагает династический брак: [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] из нашего дома заключат союз, чтобы объединить наши державы. Это предложение сулит взаимное процветание и стабильность, однако часть советников относится к нему скептически. Такой союз мог бы скрепить альянс против общих врагов и в перспективе привести к объединению корон, но другие предупреждают, что в долгосрочной перспективе он может угрожать нашей независимости."
 flavor_iberian_union.4.a: "Мы ничего не потеряем."
 flavor_iberian_union.4.b: "Разумнее будет им отказать."
 flavor_iberian_union.5.title: "Согласие на династический брак"
 flavor_iberian_union.5.desc: "[ROOT.GetCountry.GetFlavorRank] и [iu_chosen.GetName] звонят в колокола: [initiator_candidate.GetName] и [iu_chosen_candidate.GetName] заключают брак, создавая единый род [ROOT.GetCountry.GetGovernment.GetAdjective]. Люди заполняют улицы, и оба двора поднимают кубки за союз, над которым трудились послы и епископы. То, что было холодным политическим расчётом, теперь скреплено клятвами и торжеством.\n\nЭтот брак даёт куда больше, чем сезон празднеств. Наши династии соединены, дома связаны кровью, и если брак будет благословлён ребёнком, который унаследует обе короны, настанет день, когда наши державы будут управляться как одна. А пока наше престолонаследие от этого прочнее, а наше положение среди дворов христианского мира растёт вместе с великолепием торжества."
 flavor_iberian_union.5.a: "Прекрасная новость!"
 flavor_iberian_union.6.title: "Отказ от династического брака"
 flavor_iberian_union.6.desc: "[iu_chosen.GetName] отклоняет наше предложение о браке. Это решение на долгие годы омрачит отношения между нашими странами. Хуже того, вопрос нашего престолонаследия по-прежнему остаётся неразрешённым."
 flavor_iberian_union.6.a: "Мы найдём другое решение."
 flavor_iberian_union.7.title: "Выбор в чужую пользу"
 flavor_iberian_union.7.desc: "[iu_initiator.GetName] связывает свой род с семейством [iu_chosen.GetName], а не с нашим, хотя мы были не менее достойным вариантом. Обида жжёт, но в ней есть и возможность: такого оскорбления достаточно, чтобы силой взять то, что должно было достаться нам через брак."
 flavor_iberian_union.7.a: "Это оскорбление не останется без ответа."
 iu_marriage_may_form_union_tt: "Это может привести к образованию [Concept('union','унии')|e]."
 iu_spurned_will_be_displeased_tt: "Род [iu_spurned.GetName] может плохо отнестись к тому, что для этого брака выбрали не их."
