l_russian:
 iberian_culture.1.title: "Песни о Реконкисте"
 iberian_culture.1.desc: "Наши столкновения с неверными вдохновили менестрелей и простой народ слагать песни о доблести воинов, сражающихся за торжество #TOOLTIP:RELIGIONGROUP,christian,X #L христианского#!#! дела. Слава о нас расходится по [ROOT.GetCountry.Custom('rank_ru_DAT')|l] — и её можно обратить себе на пользу: пусть песни воодушевляют наших воинов в бою, и тогда, быть может, под наши знамёна вступит ещё больше храбрецов."
 iberian_culture.1.a: "Пусть они звучат на поле боя!"
 iberian_culture.1.b: "Эти песни побудят других вставать под наши знамёна!"
 iberian_culture.2.title: "Герой Реконкисты"
 iberian_culture.2.desc: "Против #ONCLICK:COUNTRY,[GetCountry('GRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GRA').Custom('CL_tt')],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! сражалось много отважных воинов, но особенно [Select_CString(new_general.IsFemale, 'отличилась', 'отличился' )] [new_general.GetName], [Select_CString(new_general.IsFemale, 'проявившая', 'проявивший' )] в бою мужество и умение. Слава о [Select_CString(new_general.IsFemale, 'ней', 'нём' )] разошлась по [ROOT.GetCountry.Custom('rank_ru_DAT')|l], и многие при дворе говорят, что столь доблестному воину следует доверить командование по [Select_CString(new_general.IsFemale, 'её', 'его' )] заслугам."
 iberian_culture.2.a: "[Select_CString(new_general.IsFemale, 'Она', 'Он' )] поведёт наши войска."
 iberian_culture.2.b: "[Select_CString(new_general.IsFemale, 'Её', 'Его' )] способностям найдётся другое применение."
 iberian_culture.3.title: "Заселение юга"
 iberian_culture.3.desc: "После того как #TOOLTIP:AREA,granada_area,X #L Гранада#!#! наконец была освобождена от #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманского#!#! владычества, многие семьи устремили взоры к этим землям в надежде найти обрести новые возможности. В последнее время до нас доходят вести о переселенцах из провинции [origin_province.GetName]: [target_province.GetName] для многих — место, где можно поселиться на брошенной земле и начать новую жизнь."
 iberian_culture.3.a: "Пусть приезжают."
 iberian_culture.3.b: "Попытаемся ограничить количество переселенцев."
 iberian_culture.4.title: "Чудесное явление Девы Марии"
 iberian_culture.4.desc: "До нас дошла весть, что в [target_location.Custom('LR_PREP')|l] [target_location.GetName] якобы случилось чудо: на склоне холма, что возвышается над поселением, явилась сама пресвятая Дева Мария. Хотя многие относятся к этой истории с недоверием, новость уже разошлась далеко за пределы окрестностей, и теперь сюда отовсюду стекаются паломники. Местные ловкачи уже зарабатывают на запрудивших улицы приезжих, а в казну потекли щедрые пожертвования, и теперь всё чаще звучит вопрос, как распорядиться этим внезапно обретённым богатством."
 iberian_culture.4.a: "Вложим эти деньги в местные нужды."
 iberian_culture.4.b: "Эти пожертвования получат [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]."
 iberian_culture.4.c: "Раздадим беднякам милостыню."
 iberian_culture.4.d: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] займутся этими пожертвованиями."
 iberian_culture.5.title: "Возвращение из северных морей"
 iberian_culture.5.desc: "#TOOLTIP:CULTURE,$basque_tt$,X #L Баскские#!#! китобои вернулись из очередного похода в далёкие северные моря. Их не сломили жестокие бури и не погубили неизведанные большинству мореходов воды; они привезли домой не только ценный груз, но и подлинное богатство — бесценные знания. Теперь [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] спорит, как бы лучше употребить эти уроки с наибольшей пользой для державы."
 iberian_culture.5.a: "Пусть каждый новый поход будет уроком."
 iberian_culture.5.b: "Океан безграничен; безграничны и возможности, что он открывает."
 iberian_culture.6.title: "Умелый творец-мудехар"
 iberian_culture.6.desc: "По [ROOT.GetCountry.Custom('rank_ru_DAT')|l] расходится слава об искусном творце-#TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманине#!#! по имени [target_character.GetName]. Не остаётся в стороне и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]: придворные предлагают пригласить [Select_CString(target_character.IsFemale, 'её', 'его' )] ко двору, дабы [Select_CString(target_character.IsFemale, 'её', 'его' )] таланты служили нам, однако многие [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] возражают против того, чтобы оказывать такую честь мудехару."
 iberian_culture.6.a: "Талант не зависит от веры."
 iberian_culture.6.b: "Таких почестей заслуживают только #TOOLTIP:RELIGIONGROUP,christian,X #L христиане#!#!."
 iberian_culture.7.title: "Спор на рынке"
 iberian_culture.7.desc: "В [target_location.Custom('LR_PREP')|l] [target_location.GetName] начались распри: #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитские#!#! и #TOOLTIP:RELIGION,$catholic_tt$,X #L католические#!#! купцы обвиняют друг друга в том, что местные чиновники и гильдии несправедливо покровительствуют только одной стороне. Они просят, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] вмешались и разрешили этот спор."
 iberian_culture.7.a: "Справедливость должна восторжествовать."
 iberian_culture.7.a.tt1: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитских#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] повышается на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 iberian_culture.7.a.tt2: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
 iberian_culture.7.b: "Мы должны защитить своих."
 iberian_culture.7.b.tt1: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитских#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
 iberian_culture.7.b.tt2: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] повышается на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 iberian_culture.7.c: "Пусть сами разбираются."
 iberian_culture.8.title: "Конфликт из-за традиций мудехаров"
 iberian_culture.8.desc: "В [target_location.Custom('LR_PREP')|l] [target_location.GetName] местные #TOOLTIP:RELIGION,$sunni_tt$,X #L сунниты#!#! вновь собрались, чтобы отпраздновать один из своих традиционных праздников, как делали их предки на протяжении многих поколений. Хотя многие считают эти торжества безобидной частью повседневной жизни, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] требуют от нас их запретить, поскольку [ROOT.GetCountry.GetFlavorRank|l] является #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! державой, а подобные празднества идут вразрез с её устоями."
 iberian_culture.8.a: "Не будем препятствовать празднествам."
 iberian_culture.8.a.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитских#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] повышается на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 iberian_culture.8.b: "Запретить проведение празднеств."
 iberian_culture.8.b.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитских#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.9.title: "Процветающий мудехарский квартал"
 iberian_culture.9.desc: "Мудехарский квартал в [target_location.Custom('LR_PREP')|l] [target_location.GetName] переживает расцвет: сюда стекаются многочисленные ремесленники и торговцы, чьё трудолюбие обеспечивает рост благополучия местной общины. Растущее богатство мудехаров благотворно сказывается на экономике [target_location.Custom('LR_GEN')|l], однако некоторые представители местной знати начинают опасаться, что однажды её влияние сможет сравняться с их собственным."
 iberian_culture.9.a: "Процветание обернётся благом для всех."
 iberian_culture.9.b: "Изъять часть богатств мудехаров, чтобы ограничить их влияние."
 iberian_culture.9.b.tt: "All [ShowReligionAdjective('sunni')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 iberian_culture.10.title: "Прославленные мудехарские врачи"
 iberian_culture.10.desc: "Мудехарские врачи в последнее время снискали широкое признание [ROOT.GetCountry.Custom('endrank_predlog_vvo')] [ROOT.GetCountry.Custom('rank_ru_PREP')|l], и многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] всё чаще обращаются к ним за помощью. Некоторые наши советники предлагают официально назначить их врачами [ROOT.GetCountry.GetAdjective|l]ого двора, однако влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] решительно возражают против этого."
 iberian_culture.10.a: "Врачебное искусство важнее веры."
 iberian_culture.10.b: "Лучше назначить христианского врача."
 iberian_culture.11.title: "Конверсо под подозрением"
 iberian_culture.11.desc: "До [ROOT.GetCountry.GetAdjective|l]ого двора дошли вести о том, что [target_character.GetName], искусный торговец из семьи, ранее исповедавшей [ShowReligionName('judaism')|l], был обвинён в том, что он продолжает тайно отправлять обряды своей прежней веры. Согласно полученному письму он читал запрещённые молитвы и принимал участие в тайных собраниях, однако некоторые утверждают, что эти обвинения продиктованы завистью и спорами из-за долгов."
 iberian_culture.11.a: "Пусть наши церковные суды расследуют эти еретические деяния."
 iberian_culture.11.b: "Это гнусная клевета!"
 iberian_culture.12.title: "Обвинения против сефардских купцов"
 iberian_culture.12.desc: "Нескольких видных #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардских#!#! купцов из [target_location.Custom('LR_GEN')|l] [target_location.GetName] обвиняют в том, что они сколотили состояние незаконными способами: пользовались лазейками в налогообложении, занимались ростовщичеством или манипулировали ценами ради собственной выгоды. Несмотря на то, что эти обвинения исходят от их конкурентов, и мы не можем знать наверняка, правдивы ли они, необходимо принять меры, пока конфликт не перерос в нечто большее."
 iberian_culture.12.a: "Конфискуйте их богатства."
 iberian_culture.12.a.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] из числа #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардских#!#! #TOOLTIP:POPTYPE,burghers,X #L горожан#!#! снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.12.b: "Нельзя действовать, опираясь лишь на голословные обвинения."
 iberian_culture.12.b.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName], не принадлежащих к #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардским#!#! #TOOLTIP:POPTYPE,burghers,X #L горожанам#!#!, снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.13.title: "Борьба с жарой и чумой"
 iberian_culture.13.desc: "В южных регионах [ROOT.GetCountry.Custom('rank_ru_GEN')|l] существует традиция белить дома гашёной известью, благодаря чему в них легче сохранять прохладу под палящим солнцем. Кроме того, считается, что известь препятствует распространению болезней. Жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] недавно столкнулись с нехваткой гашёной извести, и [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] получили их просьбу помочь им защитить свои дома."
 iberian_culture.13.a: "Выделить им необходимое количество гашёной извести."
 iberian_culture.13.a.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] повышается на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 iberian_culture.13.b: "У нас нет лишних денег."
 iberian_culture.13.b.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.14.title: "Конфликт из-за королевских перегонных дорог"
 iberian_culture.14.desc: "Смена времён года знаменует начало сезонного перегона миллионов овец по Каньядес-Реалес — историческим королевским перегонным дорогам, пересекающим наши земли. Однако жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] отказываются пропускать пастухов через своё поселение, опасаясь, что животные вытопчут их поля."
 iberian_culture.14.a: "Сохранить за пастухами их древнее право прохода."
 iberian_culture.14.a.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] из числа #TOOLTIP:POPTYPE,peasants,X #L крестьян#!#! в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.14.b: "Урегулируем спор в пользу местного населения."
 iberian_culture.15.title: "Спор в Водном суде"
 iberian_culture.15.desc: "Традиционный Водный суд недавно приступил к рассмотрению спора между [target_location_1.Custom('LR_INST')|l] [target_location_1.GetName] и [target_location_2.Custom('LR_INST')|l] [target_location_2.GetName]. Под палящим летним солнцем в регионе не хватает воды, чтобы в полной мере обеспечить поля обоих поселений, поэтому их жители затеяли тяжбу о правах на её распределение."
 iberian_culture.15.a: "В первую очередь следует обеспечить [target_location_1.Custom('LR_ACC')|l] [target_location_1.GetName]."
 iberian_culture.15.b: "Поля [target_location_2.Custom('LR_GEN')|l] [target_location_2.GetNameWithNoTooltip] важнее."
 iberian_culture.15.c: "Воду следует распределить поровну."
 iberian_culture.16.title: "Защита фуэрос"
 iberian_culture.16.desc: "Нашему сборщику налогов, направленному в [target_location.Custom('LR_ACC')|l] [target_location.GetName], местные магистраты не позволили войти в город. Представители региональной знати ссылаются на свои древние #italic фуэрос#!, привилегии, закреплённые законами и полностью освобождающие их от налогов, которые взимают [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], кроме случаев, когда местное собрание прямо разрешает их сбор."
 iberian_culture.16.a: "Законы стоит уважать."
 iberian_culture.16.b: "Государственные нужды превыше всего!"
 iberian_culture.17.title: "Разбойники Сьерры"
 iberian_culture.17.desc: "До [ROOT.GetCountry.GetAdjective|l]ого двора дошли вести о том, что хорошо вооружённые разбойники заняли горные перевалы вокруг [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Они грабят проходящие караваны и обозы, парализуя торговлю во всём регионе. Если их не остановить, это может побудить других встать на путь разбоя."
 iberian_culture.17.a: "Нам самим сил не хватает."
 iberian_culture.17.b: "Снарядить экспедицию, чтобы прочесать горы."
 iberian_culture.18.title: "Мудехарское искусство"
 iberian_culture.18.desc: "На протяжении столетий жители #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! восхищались #TOOLTIP:RELIGIONGROUP,muslim,X #L исламской#!#! архитектурой, господствовавшей во времена аль-Андалуса. Многие архитекторы стали привносить различные элементы мудехарского искусства в романские и готические постройки — будь то геометрические орнаменты или декоративная лепнина. Недавно [target_artist.GetName], [Select_CString(target_artist.IsFemale, 'которую', 'которого')] наняли [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], [Select_CString(target_artist.IsFemale, 'обратилась', 'обратился')] за разрешением использовать этот стиль в королевских заказах."
 iberian_culture.18.a: "Дать своё согласие."
 iberian_culture.18.b: "Трон не должен ассоциироваться с исламским искусством."
 iberian_culture.19.title: "Испанская готика"
 iberian_culture.19.desc: "Строители во всех уголках [ROOT.GetCountry.Custom('rank_ru_GEN')|l] начали развивать архитектурный стиль, не имеющий себе равных в христианском мире. Взяв за основу устремлённые ввысь соборы западных стран и давние строительные традиции наших земель, они создают монументы, прославляющие Господа и величие #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Этот стиль, получивший название «испанская готика», может на века изменить облик нашей страны, если мы окажем ему своё покровительство."
 iberian_culture.19.a: "Пусть камень возвестит о нашей славе!"
 iberian_culture.19.b: "Лучше потратим ресурсы на что-то другое."
 iberian_culture.20.title: "Проторенессанс"
 iberian_culture.20.desc: "Из #TOOLTIP:REGION,italy_region,X #L Италии#!#! в наши земли начали приходить новые художественные идеи, получившие название [ShowInstitutionNameWithNoTooltip('renaissance')]. Многие наши архитекторы и художники стали соединять эти веяния с местными традициями. Всё чаще жители [ROOT.GetCountry.Custom('rank_ru_GEN')|l] заказывают произведения, созданные под влиянием этого нового стиля, и, если мы будем его поощрять, это новое художественное движение может открыть путь к эпохе процветания и новаторства."
 iberian_culture.20.a: "Приветствовать эту новую традицию."
 iberian_culture.20.b: "Сохраним наши древние традиции."
 iberian_culture.21.title: "Обращение новых христиан"
 iberian_culture.21.desc: "Немалое число #TOOLTIP:RELIGION,$judaism_tt$,X #L иудеев#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName] решило добровольно принять крещение и перейти в #TOOLTIP:RELIGION,$catholic_tt$,X #L католическую#!#! веру. Для одних эти новообращённые стали свидетельством торжества Церкви, а другие сомневаются в искренности их обращения и именуют их новыми христианами, отделяя от тех, чьи семьи придерживаются католичества на протяжении многих поколений."
 iberian_culture.21.a: "Принять их в лоно Церкви."
 iberian_culture.21.b: "Приумножить ряды новообращённых силой."
 iberian_culture.21.b.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейских#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
 iberian_culture.22.title: "Энсьерро"
 iberian_culture.22.desc: "Жители города [ShowLocationName('cuellar')], где, по преданию, проходит старейший в #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! энсьерро, или праздник с бегами быков, столкнулись с нехваткой средств для проведения ежегодного торжества. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] получили прошение выделить необходимое финансирование, взамен же горожане обещают, что [Select_CString(target_ruler.IsFemale, 'покровительницей', 'покровителем')] праздника будет [Select_CString(target_ruler.IsFemale, 'названа', 'назван')] [target_ruler.GetName], а не Пресвятая Дева Мария, Царица Святого Розария, в честь которой его обычно проводят."
 iberian_culture.22.a: "Мы должны им помочь!"
 iberian_culture.22.b: "Мы не можем покровительствовать этому варварскому зрелищу!"
 iberian_culture.22.b.tt: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] в городе [ShowLocationName('cuellar')] снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.23.title: "Культ алумбрадос"
 iberian_culture.23.desc: "До [ROOT.GetCountry.GetAdjective|l]ого двора и церковных властей дошли тревожные известия о странном мистическом братстве, которое тайно набирает в свои ряды новых членов во всех уголках [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. Его последователи именуют себя иллюминатами, или просвещёнными, и утверждают, что истинная вера позволяет обрести божественное просветление от Святого Духа, а потому священники, таинства, паломничества и даже святая месса им не нужны. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] опасаются сходства этих учений с протестантскими ересями и требуют начать расследование."
 iberian_culture.23.a: "Покончить с иллюминатами."
 iberian_culture.23.b: "Не всякий слух указывает на еретика."
 iberian_culture.23.b.tt: "Если не принять мер, влияние культа продолжит шириться."
 iberian_culture.24.title: "Маски сброшены"
 iberian_culture.24.desc: "Наше нежелание расследовать слухи, связанные с иллюминатами, было ошибкой. Влияние культа значительно усилилось в провинции [target_province.GetName], так что его последователи теперь открыто признаются в приверженности #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранским#!#! ересям. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] корят власти в том, что те проигнорировали предупреждения и просьбы о расследовании, утверждая, что, если бы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] предприняли решительные меры, это позволило бы предотвратить распространение этой ереси."
 iberian_culture.24.a: "Мы не можем преследовать всех несогласных."
 iberian_culture.24.a.tt: "15% #TOOLTIP:RELIGION,$catholic_tt$,X #L католического#!#! [Concept('pops', 'населения')|e] обратится в другую религию — #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#!"
 iberian_culture.24.a.tt2: "[Concept('pop_satisfaction', 'Довольство')|e] всех #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! [Concept('pops', 'групп населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] снижается на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
 iberian_culture.24.b: "Они были правы. Нам следует проявить осторожность."
 iberian_culture.24.b.tt: "5% #TOOLTIP:RELIGION,$catholic_tt$,X #L католического#!#! [Concept('pops', 'населения')|e] обратится в другую религию — #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#!"
 iberian_culture.24.b.tt2: "[Concept('pop_satisfaction', 'Довольство')|e] всех [Concept('pops', 'групп населения')|e] в провинции [target_province.GetName] снижается на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
 iberian_culture.25.title: "Сохранение ирригации"
 iberian_culture.25.desc: "При #TOOLTIP:RELIGIONGROUP,muslim,X #L исламском#!#! правлении в #TOOLTIP:AREA,granada_area,X #L Гранаде#!#! были созданы сложные #TOOLTIP:BUILDING_TYPE,irrigation_systems,X #L ирригационные#!#!сооружения, по которым драгоценная вода из Сьерра-Невады доставляется на  поля и в сады плодородных долин. Борьба за этот край нанесла огромный вред инфраструктуре, от которой издавна зависело выживание местных жителей."
 iberian_culture.25.a: "Выделить средства на их восстановление."
 iberian_culture.25.b: "Нам это не по карману."
 iberian_culture.26.title: "Дорога в Сантьяго"
 iberian_culture.26.desc: "Ежегодно тысячи паломников отправляются в долгий путь в #TOOLTIP:LOCATION,santiago_compostela,X #L Сантьяго-де-Компостела#!#!. Их паломничество приносит процветание множеству поселений, однако само путешествие остаётся нелёгким, поскольку многие дороги и мосты пришли в негодность. Жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] отправили прошение к [ROOT.GetCountry.GetAdjective|l]ому двору с тем, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] повелели привести в порядок дороги, ведущие к Компостеле. Они считают, что подобное решение укрепит как веру, так и торговлю во всех уголках [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 iberian_culture.26.a: "На паломников никаких денег не жалко."
 iberian_culture.26.b: "Сейчас у нас есть дела поважнее."
 iberian_culture.27.title: "Угасающая традиция"
 iberian_culture.27.desc: "Веками #TOOLTIP:AREA,galicia_area,X #L галисийские#!#! трубадуры слагали свои традиционные #italic кантиги#! на #TOOLTIP:DIALECT,galician_dialect,X #L галисийском#!#! диалекте — почитаемом литературном языке, влияние которого давно вышло далеко за пределы самой #TOOLTIP:AREA,galicia_area,X #L Галисии#!#!. Однако поскольку это наречие не является официальным языком [ROOT.GetCountry.GetAdjective|l]ого двора #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, эта традиция песнесложения постепенно угасает."
 iberian_culture.27.a: "Стоит поддержать сохранение этой традиции."
 iberian_culture.27.b: "Расширим употребление нашего языка."
 iberian_culture.28.title: "Рыбацкие братства"
 iberian_culture.28.desc: "Рыбаки [target_location.Custom('LR_GEN')|l] [target_location.GetName] объединились в гильдию, которую они назвали Рыбацким братством. Говорят, оно будет регулировать рыбный промысел, сохранять знания о морском деле и защищать интересы тех, кто отваживается выходить в море. В трудные времена братство служит опорой местной общине, оказывая помощь своим членам и их семьям."
 iberian_culture.28.a: "Оказать поддержку их гильдии."
 iberian_culture.28.b: "Их знания пригодятся нашему флоту."
 iberian_culture.29.title: "Расцвет валенсийского шёлка"
 iberian_culture.29.desc: "#TOOLTIP:LOCATION,valencia,X #L Валенсийские#!#! ткачи прославились своими великолепными тканями из #TOOLTIP:GOODS,silk,X #L шёлка#!#!, которыми восхищаются по всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Торговцы и [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] неслыханно обогатились благодаря этому процветающему промыслу. Тем не менее, при [ROOT.GetCountry.GetAdjective|l]ом дворе нет единого мнения о том, как следует распорядиться этим богатством."
 iberian_culture.29.a: "Вложить эти средства в развитие местных промыслов."
 iberian_culture.29.b: "Эти богатства послужат [ROOT.GetCountry.Custom('rank_ru_DAT')|l]."
 iberian_culture.30.title: "Виноградники Риохи"
 iberian_culture.30.desc: "Плодородные долины Эбро издавна славятся виноградниками Риохи. Здесь производят вина отменного качества, и наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] увидели в этом возможность превратить виноделие в крупную отрасль, заложив новые виноградники по всем провинциям [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. Однако [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] выступают против, опасаясь, что подобные перемены поставят под угрозу местные обычаи, которыми веками руководствовались при производстве вина."
 iberian_culture.30.a: "Расширим наши виноградники."
 iberian_culture.30.b: "Защитить наши традиции виноделия."
