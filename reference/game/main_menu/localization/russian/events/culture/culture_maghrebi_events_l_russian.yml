l_russian:
 # Estate related
 maghrebi_culture_masters_of_sahara_country_bonus: "Благодаря [Concept('decision', 'решению')|e] «$maghreb_masters_of_the_sahara.title$»\nможно получить следующий бонус:"
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "Благодаря [Concept('decision', 'решению')|e] «$maghreb_masters_of_the_sahara.title$»\nможно получить следующий бонус (он влияет на [Concept('locations', 'районы')|e] с рельефом «[ShowVegetationName('desert')]»):"
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "Благодаря [Concept('decision', 'решению')|e] «$maghreb_masters_of_the_sahara.title$»\nможно получить следующий бонус (он влияет на [Concept('locations', 'районы')|e] с климатом «[ShowClimateName('arid')]»):"
 # Estate end
 maghrebi_culture.1.title: "Иудейская община [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.1.desc: "Значительная часть изгнанного при Альмохадах #TOOLTIP:CULTURE,$mustaarabi_tt$,X #L мустаравского#!#! населения #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! недавно нашла себе новый дом в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. И хотя [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #L [ROOT.GetCountry.GetAdjective]ой#! державы в последнее время более терпимо относится к иудеям, некоторые чрезмерно рьяно настроенные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] уже заговорили о возвращении отвергнутых когда-то альмохадских порядков."
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] останется прибежищем для мустаравов."
 maghrebi_culture.1.b: "Пусть радикальные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] помогут нам заставить их принять новую веру — это будет [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip|l]."
 maghrebi_culture.2.title: "Ибадитские владения Магриба"
 maghrebi_culture.2.desc: "Уже давно в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#! не существует сильного ибадитского государства, способного оказывать влияние на весь регион. Но [our_ruler.GetName], похоже, стремится возродить старый порядок: [Select_CString(our_ruler.IsFemale, 'ей', 'ему' )] удалось объединить земли, где #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитская#!#! вера всё ещё крепка. Хотя [ROOT.GetCountry.GetName] не столь богат[ROOT.GetCountry.Custom('end_fem')], как развитые державы Магриба, всё-таки не стоит списывать такие успехи со счетов: возможно, [our_ruler.GetShortNameWithNoTooltip] ещё сумеет построить новую страну для ибадитов."
 maghrebi_culture.2.a: "Мы позаботимся о том, чтобы в Магрибе было сильное ибадитское государство!"
 maghrebi_culture.2.b: "Мы пойдём своим путём."
 maghrebi_culture.3.title: "Восстановление власти ибадитов в Магрибе"
 maghrebi_culture.3.desc: "[our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'сделала', 'сделал' )] почти невозможное: [Select_CString(our_ruler.IsFemale, 'она создала', 'он создал' )] в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#! новое #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитское#!#! государство. Теперь [ROOT.GetCountry.GetName] — одна из сильнейших держав региона, а некоторые придворные уже настаивают, что [our_ruler.GetNameWithNoTooltip] [Select_CString(our_ruler.IsFemale, 'должна', 'должен' )] теперь пересмотреть отношение к другим течениям #TOOLTIP:RELIGIONGROUP,muslim,X #L ислама#!#!. Но, хоть такой порядок и привлёк к нам новых последователей, большинство жителей Магриба по-прежнему исповедует #TOOLTIP:RELIGION,$sunni_tt$,X #L суннизм#!#!."
 maghrebi_culture.3.a: "Мы будем с терпением относиться ко всем разновидностям ислама."
 maghrebi_culture.3.b: "Последователи остальных течений должны обратиться в ибадизм."
 maghrebi_culture.4.title: "Молодые ибадитские державы Магриба"
 maghrebi_culture.4.desc: "После падения державы Рустамидов — могущественного #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитского#!#! султаната, обладавшего большим влиянием в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#!, — многие последователи ибадизма со временем переселились в #TOOLTIP:AREA,desert_area,X #L сахарские оазисы#!#!. Теперь владения #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! вплотную придвинулись к этим землям, и некоторые придворные считают, что [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'должна', 'должен' )] начать поход против #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! — одного из немногих сохранившихся и при этом сравнительно слабых пережитков рухнувшего султаната."
 maghrebi_culture.4.a: "Воспользуемся слабостью [target_country.Custom('CL_GEN')]!"
 maghrebi_culture.4.b: "Они слишком далеки и раздроблены, чтобы представлять угрозу."
 maghrebi_culture.5.title: "Покорение магрибских ибадитов"
 maghrebi_culture.5.desc: "Значительная доля ибадитов — жителей #TOOLTIP:AREA,desert_area,X #L сахарских оазисов#!#! — сегодня находится под властью #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. И поскольку число исповедующих ибадизм в нашей державе действительно впечатляет, придворные советуют: если [our_ruler.GetName] не примет в отношении этих людей политику терпимости, в стране могут начаться беспорядки на религиозной почве."
 maghrebi_culture.5.a: "Пусть их ведёт [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip|l]."
 maghrebi_culture.5.b: "Попробуем вместо этого интегрировать их мирно."
 maghrebi_culture.6.title: "Нарастающее влияние [ROOT.GetCountry.Custom('CL_GEN')]"
 maghrebi_culture.6.desc: "После падения Альмохадов значительное влияние в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#! обрели [target_country_1.GetName] и [target_country.GetName], однако только одна из этих держав — [target_country.GetNameWithNoTooltip] — сильна по-настоящему: об этом [Select_CString(our_ruler.IsFemale, 'позаботилась', 'позаботился' )] [our_ruler.GetName]. Хотя знать [target_country_1.Custom('CL_GEN')] и [target_country.Custom('CL_GEN')] опасается [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого влияния, многие магрибские народы благосклонно относятся к нашей власти."
 maghrebi_culture.6.a: "Мы установим в Магрибе [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ую власть!"
 maghrebi_culture.7.title: "Орошение пальм в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.7.desc: "Многие земли #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! плодородны, однако условия здесь бывают поистине суровы: сказывается близость #TOOLTIP:AREA,desert_area,X #L сахарских оазисов#!#!.\n\n[target_location.GetName] запрашивает средства на воплощение смелого замысла: если в #L #TOOLTIP:LOCATIONRANK,[target_location.GetRank.Custom('LR_tt')],X [target_location.GetRank.Custom('LR_PREP')|l]#!#! появится [ShowBuildingTypeName('maghreb_palm_irrigation')|l], то, возможно, жизнь в регионе получится облегчить."
 maghrebi_culture.7.a: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] сделают оросительную сеть — мы выделим средства."
 maghrebi_culture.7.b: "У нас нет лишних ресурсов."
 maghrebi_culture.8.title: "Утончённая архитектура [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.8.desc: "Жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] издавна славятся своим архитектурным мастерством: даже [ShowVegetationName('desert')|l] не мешает им возводить такие постройки, которые способны впечатлить и наших придворных зодчих. Пусть даже местность вокруг [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] отличается от условий [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip], зодчие считают, что увиденное ими можно применить и здесь — при условии, что их поддержит [our_ruler.GetName]."
 maghrebi_culture.8.a: "Внедрим некоторые архитектурные особенности в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.8.b: "Вместо этого лучше снабдим [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] дополнительными ресурсами."
 maghrebi_culture.9.title: "Традиции амазигского народа"
 maghrebi_culture.9.desc: "После того как в XI веке многие #TOOLTIP:CULTURE,$bedouin_culture_tt$,X #L бедуинские#!#! племена при поддержке Фатимидов переселились в #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#!, местным #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазигским#!#! народам пришлось считаться с резким увеличением численности #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабской#!#! знати. При власти #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! многие амазиги сохраняют самостоятельность, хотя некоторые придворные считают, что некоторые арабские [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] заслуживают, чтобы их пригласили [ROOT.GetCountry.Custom('end_predlog_vvo')] [ROOT.GetCountry.GetNameWithNoTooltip]: так укрепится законность нашей власти. Однако [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')|l] наверняка останутся недовольны этим решением."
 maghrebi_culture.9.a: "Мы должны стремиться взаимодействовать с арабской знатью."
 maghrebi_culture.9.b: "Лучше постараемся сохранить амазигские традиции."
 maghrebi_culture.10.title: "[target_location.GetNameWithNoTooltip] — важный пункт в торговле через Сахару"
 maghrebi_culture.10.desc: "Купцы-[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] уже много десятилетий подряд делают остановки в [target_location.Custom('LR_PREP')|l] [target_location.GetName] — важном пункте, расположенном на одном из многочисленных торговых путей через #TOOLTIP:AREA,desert_area,X #L сахарские оазисы#!#!. В последние годы этот [target_location.GetRank.GetName|l], будучи под защитой #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, приобрёл ещё более важное значение: купцы знают, что по #L [ROOT.GetCountry.GetAdjective|l]им#! землям можно странствовать в безопасности, и поэтому начали останавливаться здесь чаще. Сегодня [target_location.GetNameWithNoTooltip] пользуется доброй славой едва ли не во всей Сахаре, но у этой монеты есть и вторая сторона: такая слава — тяжёлое бремя.\n\nЧтобы [target_location.GetRank.GetNameWithNoTooltip|l] и дальше сохранял свою важность для торговли, многие придворные считают, что [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'должна', 'должен' )] выделить [target_location.GetRank.Custom('LR_DAT')|l] необходимые средства для приёма всё возрастающего потока купцов."
 maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip|U] должен сохранить свою важность для купцов!"
 maghrebi_culture.10.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не может выделить [target_location.Custom('LR_DAT')|l] [target_location.GetNameWithNoTooltip] лишние ресурсы."
 maghrebi_culture.11.title: "Процветающее сельское хозяйство в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.11.desc: "[target_location.GetName] располагается в одном из самых суровых регионов #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! — и тем удивительнее, что местные жители сумели улучшить своё положение: [ShowBuildingTypeName('maghreb_palm_irrigation')|l] — большое подспорье для каждого, что с особенной охотой подтвердят [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.11.a: "$common_string_good$"
 maghrebi_culture.12.title: "Под властью Хафсидов"
 maghrebi_culture.12.desc: "После падения Альмохадов #TOOLTIP:CULTURE,$tunisian_tt$,X #L тунисские#!#! Хафсиды сохранили значительное влияние в восточной части #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#!. И хотя #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! удалось отстоять определённую долю независимости от #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, хафсидские правители всё-таки проявили себя достойными защитниками [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их земель. Но память о власти Альмохадов постепенно угасает, и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] всё чаще задаётся вопросом, насколько ещё оправдано подчинение Хафсидам. Некоторые уже считают, что пришло время для [ROOT.GetCountry.Custom('CL_GEN')] освободиться от тунисского ига."
 maghrebi_culture.12.a: "Хафсиды — надёжные защитники [ROOT.GetCountry.Custom('CL_GEN')]."
 maghrebi_culture.12.b: "Пора освободиться от хафсидской власти."
 maghrebi_culture.13.title: "Тунисские [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] вмешиваются во внутренние дела"
 maghrebi_culture.13.desc: "Хотя [ROOT.GetCountry.GetLongName] уже достаточно давно призна[ROOT.GetCountry.Custom('endlong_youtyut')] верховенство власти #TOOLTIP:CULTURE,$tunisian_tt$,X #L Туниса#!#!, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] [ROOT.GetCountry.Custom('CL_GEN')] в значительной мере сохраняет самостоятельность. Однако недавние вылазки, которые [target_character.GetName] предпринимает на земли, издавна считающиеся #L [ROOT.GetCountry.GetCulture.GetName|l]ими#!, вызвали у народа волнения. Многие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] требуют немедленно изгнать этого человека из державы, но такой поступок наверняка вызовет недовольство #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!."
 maghrebi_culture.13.a: "[target_character.GetNameWithNoTooltip] будет [Select_CString(target_character.IsFemale, 'изгнана', 'изгнан' )] из [ROOT.GetCountry.Custom('CL_GEN')]!"
 maghrebi_culture.13.b: "Пусть остаётся при дворе."
 maghrebi_culture.14.title: "Дикие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] устраивают налёт на [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] в смятении: [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] устроили набег на [target_location.Custom('LR_ACC')|l] [target_location.GetName], снарядив для этого верных себе воинов. [target_location.GetNameWithNoTooltip] — одна из главных остановок для купцов, пересекающих Сахару по важному торговому пути. Понёсшие ущерб [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] требуют возмещения, и выплачивать его должны, разумеется, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.14.a: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] выплатят компенсацию пострадавшим купцам."
 maghrebi_culture.14.b: "Мы упрекнём зачинщиков, но возмещение выплатит государство."
 maghrebi_culture.14.c: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] поступили правильно. Мы разрешим продолжать налёты."
 maghrebi_culture.15.title: "#L [target_culture.GetNameWithNoTooltip|U]ие#! [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] всё чаще выражают поддержку"
 maghrebi_culture.15.desc: "По мере того как #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! всё больше покоряется #L [ROOT.GetCountry.GetAdjective|l]ой#! власти, всё больше туземных народов присягает на верность [ROOT.GetCountry.Custom('CL_DAT')]. Среди них особенно благосклонно к [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой власти относятся #L [target_culture.GetName|l]ие#! [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')|l]: многие [target_culture.GetNameWithNoTooltip|l]ие вожди уже предлагают нам полную поддержку. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] искренне удивляется подобному рвению. Одни считают, что [our_ruler.GetName] поступит правильно, если открыто поддержит [target_culture.GetNameWithNoTooltip|l]ие интересы и будет покровительствовать этим людям в Магрибе; другие предлагают воспользоваться их преданностью, пока та ещё способна приносить пользу."
 maghrebi_culture.15.a: "Мы рады их поддержке."
 maghrebi_culture.15.b: "Воспользуемся их поддержкой, чтобы укрепить своё влияние в Магрибе."
 maghrebi_culture.16.title: "Выдающийся [target_culture.GetNameWithNoTooltip|l]ий полководец"
 maghrebi_culture.16.desc: "По мере укрепления в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#! #L [ROOT.GetCountry.GetAdjective|l]ой#! власти теснее становятся и взаимные узы между #L [target_culture.GetName|l]ими#! народами и #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! знатью, что идёт державе только на пользу. [target_culture.GetNameWithNoTooltip|U]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], стремящиеся заверить [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий двор в своей преданности, предложили одного из своих наиболее одарённых предводителей на службу [ROOT.GetCountry.Custom('CL_DAT')]. Однако некоторые [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] считают, что [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'должна', 'должен' )] отклонить это предложение: они боятся, что если [target_culture.GetNameWithNoTooltip|l]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] станут самостоятельнее, наша власть в Магрибе в конечном счёте может ослабнуть."
 maghrebi_culture.16.a: "Мы приветствуем тебя, [target_character.GetShortNameWithNoTooltip]! [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] станет тебе домом."
 maghrebi_culture.16.b: "Не станем нанимать [Select_CString(target_character.IsFemale, 'её', 'его' )] в качестве генерала."
 maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] предлагают многообещающего полководца"
 maghrebi_culture.17.desc: "Хотя [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! долгое время доставляли хлопоты двору державы, в последние годы они с неохотой, но всё-таки начали признавать [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ую власть над #TOOLTIP:REGION,maghreb_region,X #L Магрибом#!#!. Сегодня же они, стремясь подтвердить свою верность, заявляют, что [target_character.GetName] может сослужить [ROOT.GetCountry.Custom('CL_DAT')] хорошую службу, поскольку обладает выдающимися способностями. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не может сойтись во мнениях: некоторые считают, что это уловка, а [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] таким образом рассчитывают на одно: что [our_ruler.GetName] начнёт относиться к ним доброжелательнее."
 maghrebi_culture.17.a: "Согласимся на их предложение."
 maghrebi_culture.17.b: "Нельзя допустить, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] обрели ещё больше влияния."
 maghrebi_culture.18.title: "Династия [our_ruler.GetDynasty.GetNameWithNoTooltip] набирает влияние"
 maghrebi_culture.18.desc: "После падения Альмохадов власть в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#! оказалась в значительной степени сосредоточена в руках двух династий — #TOOLTIP:DYNASTY,$marinid_dynasty_tt$,X #L Маринидов#!#! и #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсидов#!#!. Однако недавние военные походы, которые предпринимает [our_ruler.GetDynasty.GetName], доказали: в регионе крепнет новая сила. Хотя династия [our_ruler.GetDynasty.GetNameWithNoTooltip] уже завоевала поддержку среди коренных жителей Магриба — амазигов, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] настоятельно советует поискать опору для соперничества с другими крупными державами где-нибудь за пределами этих мест."
 maghrebi_culture.18.a: "Нужно обрести союзников, чтобы укрепить своё положение."
 maghrebi_culture.18.b: "Лучше займёмся внутренней политикой."
 maghrebi_culture.19.title: "Чувство общности с [target_culture.GetNameWithNoTooltip|l]ими народами"
 maghrebi_culture.19.desc: "Переселение #TOOLTIP:CULTURE,$bedouin_culture_tt$,X #L бедуинов#!#! в #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! в XI веке сильно изменило политическую обстановку в регионе, однако при [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой власти между #L [ROOT.GetCountry.GetCulture.GetName|l]им#! и #L [target_culture.GetName|l]им#! народами вновь возникло чувство единства. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ое владычество над родным Магрибом во многом положило конец прежним племенным распрям, и на смену вражде приходит чувство общности."
 maghrebi_culture.19.a: "Единство — залог непобедимости!"
 maghrebi_culture.19.b: "Мы постараемся нарастить влияние на Магриб за счёт единства с [target_culture.GetNameWithNoTooltip|l]им народом."
 maghrebi_culture.19.c: "[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|U]о-[target_culture.GetNameWithNoTooltip|l]ие культурные узы неразрывны."
 maghrebi_culture.20.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip|U]ая власть над Магрибом"
 maghrebi_culture.20.desc: "Многие представители #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! знати постепенно перенимают отдельные #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабские#!#! обычаи и традиции, что иногда приводит к столкновениям с приверженными старым порядкам народами #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#!. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] отмечает: многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] жалуются, что #L [target_culture.GetName|l]ие#! народы, в частности [target_culture.GetNameWithNoTooltip|l]ая знать, отказываются вести с ними какие-либо дела.\n\nСтремясь укрепить своё влияние во владениях #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] выступили с обращением: они надеются, что [our_ruler.GetName] будет решительнее ассимилировать [target_culture.GetNameWithNoTooltip|l]ое население. Однако некоторые при дворе опасаются, что, согласись мы на такое предложение, нестабильность лишь усилится."
 maghrebi_culture.20.a: "Постараемся, чтобы они ассимилировались в [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ое общество."
 maghrebi_culture.20.b: "Вместо этого постараемся интегрировать [target_culture.GetNameWithNoTooltip|l]ие народы."
 maghrebi_culture.21.title: "Тяжёлая участь Магриба"
 maghrebi_culture.21.desc: "Падение последней #TOOLTIP:RELIGIONGROUP,muslim,X #L исламской#!#! державы #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! вызвало неподдельную панику среди обитателей #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#!: многие опасаются, что христианские королевства полуострова вскоре обратят свой взор на них. Уже сейчас многие #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусцы#!#! возлагают все свои надежды на [ROOT.GetCountry.Custom('CL_ACC')] — последнего в их глазах защитника от гнева #TOOLTIP:CULTUREGROUP,iberian_group,X #L иберийцев#!#!."
 maghrebi_culture.21.a: "Мы не станем склоняться перед иберийскими захватчиками!"
 maghrebi_culture.21.b: "Разумно будет опасаться прибытия завоевателей."
 maghrebi_culture.22.title: "Присутствие в Средиземноморье"
 maghrebi_culture.22.desc: "Народы #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! издавна полагались прежде всего на торговлю через Сахару, однако походы, которые [Select_CString(our_ruler.IsFemale, 'предпринимала', 'предпринимал' )] [our_ruler.GetName], позволили [ROOT.GetCountry.Custom('CL_DAT')] закрепиться на побережье. Сегодня выход к такой важной артерии, как [ShowScriptedGeographyName('mediterranean_sea_geography')], — не мечта, а действительность. Многие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], почуявшие возможность нарастить своё богатство, призывают к одному: пусть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] вложится в строительство нового флота! Другие, впрочем, опасаются, что развитие морской торговли приведёт к постепенному упадку старых караванных путей, которые уже много лет приносят [ROOT.GetCountry.Custom('CL_DAT')] доход."
 maghrebi_culture.22.a: "Нужно поскорее заявить о себе и на море."
 maghrebi_culture.22.b: "Нельзя, чтобы торговые пути через Сахару начали увядать."
 maghrebi_culture.23.title: "Недовольство арабизированной знати"
 maghrebi_culture.23.desc: "#L [target_culture.GetName|U]ое#! влияние на #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! велико и настолько сильно, что не угасает с годами. При этом их отношения с #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазигским#!#! народом остаются напряжёнными: [target_culture.GetNameWithNoTooltip|l]ие деятели выступают за решительную ассимиляцию амазигов и призывают тех перенимать #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабские#!#! обычаи. С возвышением #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! — [ROOT.GetCountry.Custom('rank_ru_GEN')|l], где #L [ROOT.GetCountry.GetCulture.GetName|l]ие#! деятели составляют правящую элиту, — некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всё чаще просят, чтобы [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'ограничила', 'ограничил' )] [target_culture.GetNameWithNoTooltip|l]ое влияние. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U], однако, не торопится с этим соглашаться: некоторые считают, что [target_culture.GetNameWithNoTooltip|l]ая знать — незаменимый союзник, который поможет укрепить нашу власть над Магрибом."
 maghrebi_culture.23.a: "Попробуем добиться компромисса между [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ой и [target_culture.GetNameWithNoTooltip|l]ой знатью."
 maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip|U]ому влиянию на Магриб пришёл конец."
 maghrebi_culture.24.title: "Новые [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ие килимы"
 maghrebi_culture.24.desc: "#L [ROOT.GetCountry.GetCulture.GetName|U]ие#! гобелены давно пользуются спросом по всему #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!; они — важный товар для многих #L [ROOT.GetCountry.GetAdjective|l]их#! купцов. Однако в последние годы более надёжные поставки красителей позволили наладить производство совершенно новых [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]их килимов, и интерес к этим изделиям вырос как в самом #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#!, так и за его пределами."
 maghrebi_culture.24.a: "Пожнём плоды происходящего."
 maghrebi_culture.24.b: "Будем продолжать вкладывать средства в новые гобелены!"
 maghrebi_culture.25.title: "Сплочение земель, которыми владеют [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.25.desc: "В прошлом [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] неоднократно помогали #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! отражать угрозы извне, однако по мере укрепления и развития в [ROOT.GetCountry.Custom('rank_ru_PREP')|l] бюрократии [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] всё чаще задаётся вопросом, насколько такой порядок себя оправдывает. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] действительно много раз защищали [ROOT.GetCountry.Custom('CL_ACC')], но вместе с этим доставляли немало хлопот, когда не соглашались с решениями двора.\n\nСегодня всё чаще звучит мнение, что государство уже достаточно окрепло, и [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] как опора и главная оборонительная сила ему больше не нужны. Более того, чтобы силы [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ой державы продолжали крепнуть, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] должны быть окончательно ограничены во влиянии и подчинены."
 maghrebi_culture.25.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] забыли, какое место им отведено в этом мире, и мы об этом напомним."
 maghrebi_culture.25.b: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|l] сохраняют самостоятельность — нам не нужны междоусобицы."
 maghrebi_culture.26.title: "Господство над Магрибом"
 maghrebi_culture.26.desc: "Падение державы Альмохадов погрузило #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! в хаос и привело к ослаблению влияния на #TOOLTIP:REGION,iberia_region,X #L Иберию#!#!. Фактически ведущей силой в регионе стал[ROOT.GetCountry.Custom('end_fem')] [ROOT.GetCountry.GetName], и [our_ruler.GetName] немало [Select_CString(our_ruler.IsFemale, 'потрудилась', 'потрудился' )], чтобы достичь таких высот. Хотя часть Магриба всё ещё находится вне [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого влияния, #TOOLTIP:CULTUREGROUP,iberian_group,X #L иберийским#!#! королевствам теперь придётся считаться с [ROOT.GetCountry.Custom('CL_INST')] как с серьёзным соперником, которого не стоит недооценивать любому желающему завоевать Магриб."
 maghrebi_culture.26.a: "Мы — защитники Магриба!"
 maghrebi_culture.27.title: "Золотой век династии [our_ruler.GetDynasty.GetNameWithNoTooltip] в Магрибе"
 maghrebi_culture.27.desc: "Значительная часть #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! находится под #L [ROOT.GetCountry.GetAdjective|l]ой#! властью — и династия [our_ruler.GetDynasty.GetName] не собирается сидеть сложа руки: она берётся за обновление важнейших культурных сооружений региона, а заодно покровительствует строительству новых центров учёности. Ещё недавно Магриб был близок к тому, чтобы оказаться под властью чужеземных держав, однако при династии [our_ruler.GetDynasty.GetNameWithNoTooltip] он превратился в могущественную силу, уважение к которой проявляет едва ли не всё [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.a: "Да будет власть династии [our_ruler.GetDynasty.GetNameWithNoTooltip] долгой и успешной!"
 maghrebi_culture.28.title: "Влияние на корсаров"
 maghrebi_culture.28.desc: "#TOOLTIP:REGION,maghreb_region,X #L Магрибские#!#! каперы давно снискали в #TOOLTIP:CONTINENT,europe,X #L Европе#!#! славу грозных морских налётчиков, которых боится всё [ShowScriptedGeographyName('mediterranean_sea_geography')], однако у них никогда не было постоянного покровителя — те менялись от государства к государству.\n\nТеперь, по мере того как на побережье всё сильнее укрепляется #L [ROOT.GetCountry.GetAdjective|l]ое#! влияние, каперы всё чаще обращаются к [ROOT.GetCountry.Custom('CL_DAT')] в надежде заручиться нашей поддержкой и усилить набеги по всему Средиземноморью. Однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] имеет свой взгляд на этот вопрос: некоторые видят возможность, наоборот, ослабить каперов и тем самым попытаться восстановить отношения с европейскими державами, значительно омрачённые столетиями вражды."
 maghrebi_culture.28.a: "Предложим полное покровительство со стороны государства."
 maghrebi_culture.28.b: "Позволим корсарам и дальше заниматься разбоем."
 maghrebi_culture.28.c: "Примем самые строгие меры против корсаров."
 # Decisions
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Централизация меджлиса Амми Саид"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "После падения державы Рустамидов многие #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадиты#!#! #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! были вынуждены бежать в долину Мзаб. Часть их держав вошла в состав меджлиса Амми Саид, где заправляют [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]; другие же предпочли сохранить самостоятельность.\n\nПоскольку почти все густонаселённые ибадитские земли сегодня принадлежат #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, [our_ruler.GetName] желает перенести меджлис Амми Саид в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName], — так [Select_CString(our_ruler.IsFemale, 'она', 'он' )] надеется создать в Магрибе сильное и влиятельное ибадитское государство."
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "Разрозненный совет, находящийся сразу в нескольких независимых #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитских#!#! государствах, способен только советовать — но не править. Однако такой порядок не вечен: поскольку самые густонаселённые из этих земель сегодня подчинены нам, меджлис Амми Саид можно собрать в одном месте и под единой властью. В долине Мзаб может зародиться самостоятельная держава, охватывающая весь #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#!."
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "Верные нам [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] помогут укрепить власть!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "$crown_estate$, верные нам, помогут укрепить власть!"
 maghreb_masters_of_the_sahara.title: "Хозяева Сахары"
 maghreb_masters_of_the_sahara.desc: "Проходят года и сменяются поколения, но жизнь народов #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! остаётся всё так же неразрывно связана с торговлей через Сахару. Пустыня беспощадна, и перевозка ценных товаров — трудное занятие, но если нам удастся укрепить своё влияние в #TOOLTIP:AREA,desert_area,X #L сахарских оазисах#!#! и заодно развить инфраструктуру главных караванных стоянок, то наши народы смогут подчинить себе даже эти суровые пески."
 maghreb_masters_of_the_sahara.a: "Мы добились невозможного!"
 empower_the_desert_power_privilege_tt: "Привилегия «[ShowEstatePrivilegeName('desert_power')]» будет значительно расширена и начнёт предоставлять дополнительные преимущества в противовес штрафам в [Concept('locations', 'районах')|e] с рельефом «[ShowVegetationName('desert')]» и климатом «[ShowClimateName('arid')]»"
 empower_the_desert_power_privilege_tt_default_bonus: "Привилегия «[ShowEstatePrivilegeName('desert_power')]» также получит #G +0,0020#! к модификатору «[ShowModifierTypeName('global_monthly_development')]» и #G +2,50%#! к модификатору «[ShowModifierTypeName('global_max_control')]»"
