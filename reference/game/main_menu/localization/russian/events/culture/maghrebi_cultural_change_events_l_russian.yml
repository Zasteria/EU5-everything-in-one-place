 maghrebi_cultural_change_events.1004.title: "Дерзость андалусских переселенцев"
 maghrebi_cultural_change_events.1004.desc: "В последние годы наши братья по #TOOLTIP:RELIGIONGROUP,muslim,X #L исламской#!#! вере — #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусцы#!#! всё чаще бегут из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, спасаясь от жестоких преследований. Однако в новом доме, что даровал им [ROOT.GetCountry.GetReligion.GetGodName], они ведут себя совершенно возмутительно: эти дерзкие переселенцы осмеливаются открыто жаловаться на условия жизни в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#!, превознося при этом тех, кто остался в землях ненавистных им #TOOLTIP:RELIGIONGROUP,christian,X #L христианских#!#! держав!\n\nВысказывается по этому поводу и [target_pop2.GetName]: некоторые местные [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] называют подобное отношение почти что отступлением от веры."
 maghrebi_cultural_change_events.1004.a: "Если в Иберии так хорошо живётся, то что они забыли здесь?"
 maghrebi_cultural_change_events.1004.b: "Постараемся утихомирить обе стороны."
