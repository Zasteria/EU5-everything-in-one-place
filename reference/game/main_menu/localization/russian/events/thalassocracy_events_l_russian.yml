l_russian:
 thalassocracy_events.1.title: "Плоды трудов наших"
 thalassocracy_events.1.desc_success: "Стремительное расширение военного флота прошло чрезвычайно успешно! Множество новых и модернизированных кораблей, укомплектованных обученными экипажами, отныне будут грозить всем нашим врагам и соперникам. Гнусные пираты и вражеские эскадры никогда больше не смогут оспорить наше морское владычество. Обеспечив безопасность торговых путей, мы облегчим управление далёкими заморскими колониями и сможем распространять нашу мощь даже через океан."
 thalassocracy_events.1.desc_failure: "После многолетних тяжёлых дебатов о финансировании военного флота мы вынуждены оставить нашу мечту о владычестве над морями. Без сильного флота никакой талассократии быть не может, ведь мы не в силах защитить от вражеских каперов даже собственные воды."
 thalassocracy_events.1.a: "Наша морская империя станет ещё сильнее!"
 unlock_thalassocracy_reform_tt: "Открывает доступ к [Concept('government_reform', 'государственному принципу')|e] «[ShowGovernmentReformName('thalassocracy_reform')]»"
 thalassocracy_events.1.b: "Придётся жить с последствиями нашей неудачи."
