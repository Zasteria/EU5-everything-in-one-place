l_russian:
 holy_war.1.title: "Призыв к священной войне"
 holy_war.1.desc: "Ко двору прибыли проповедники. Охрипшими от религиозного пыла голосами они призывают всех правоверных взяться за оружие и выступить против #ONCLICK:COUNTRY,[preach_io.GetTarget.Custom('CL_tt')] #TOOLTIP:COUNTRY,[preach_io.GetTarget.Custom('CL_tt')],X [preach_io.GetTarget.Custom('CL_GEN')|L]#!#!. Все глаза обращены на нас. Ответим ли мы на призыв?"
 holy_war.1.a: "Мы вступим в борьбу!"
 holy_war.1.b: "Не в этот раз."
 holy_war.2.title: "Взнос на священную войну"
 holy_war.2.desc: "К нам с просьбой прибыли посланцы [levy_leader.Custom('longname_ru_GEN')]. Объединение «[levy_io.GetName]» ведёт священную войну против #ONCLICK:COUNTRY,[levy_io.GetTarget.Custom('CL_tt')] #TOOLTIP:COUNTRY,[levy_io.GetTarget.Custom('CL_tt')],X [levy_io.GetTarget.Custom('CL_GEN')|L]#!#!, и война эта обходится недёшево. Мы их братья по вере, поэтому нас просят пополнить их опустевшую казну. Готовы ли мы открыть свою сокровищницу ради святого дела?"
 holy_war.2.a: "Заплатим небольшую сумму."
 holy_war.2.b: "Мы щедро поддержим их средствами."
 holy_war.2.c: "Лучше сами присоединимся к войне."
 holy_war.2.d: "Наша страна не станет оплачивать чужие войны!"
 holy_war.2.d.tt: "Каждый участник объединения «[levy_io.GetName]» получит модификатор #R «Уклонились от священной войны»#! к мнению о нас"
 holy_war.3.title: "Наш народ обращают!"
 holy_war.3.desc: "В землях, которые отобрал у нас враг, по деревням ходят чужие священники и угрозами принуждают наших единоверцев оставить веру отцов. Вести о каждом случае обращения доходят до нашего двора, и мы нескоро забудем эти преступления."
 holy_war.3.a: "Они заплатят за это!"
 holy_war.3.a.tt: "Мы не станем бороться с насильственным обращением"
 holy_war.4.title: "Упрёк от верующих"
 holy_war.4.desc: "Руководитель священной войны заявляет, что мы уклоняются от выполнения священного долга. Если не доказать свою преданность делу веры, это может иметь серьёзные последствия. Как мы ответим?"
 holy_war.4.a: "Удвоим наши усилия."
 holy_war.4.a.tt: "Лидер священной войны даёт нам #G 2 года#! на то, чтобы показать себя. Если к этому времени степень нашего участия в конфликте увеличится, верующие будут удовлетворены — а если нет, придётся за это ответить."
 holy_war.4.b: "Мы никому не подчиняемся!"
 holy_war.6.title: "Верующие обрадованы"
 holy_war.6.desc: "Вести о нашем рвении на полях священной войны разошлись по всему свету, и теперь духовные лидеры верующих с благодарностью поминают нас в молитвах. Их сомнения сменились благосклонностью."
 holy_war.6.a: "Так хочет Бог!"
 holy_war.6.a.muslim: "#italic Allāhu akbar#!."
 holy_war.20.title: "Верующие недовольны"
 holy_war.20.desc: "Время, отведённое для исполнения клятвы, истекло, а мы так и не сделали ничего, чтобы выполнить её. Руководители священной войны не забыли о данных им обещаниях, и теперь нас ждёт суровое осуждение."
 holy_war.20.a: "Придётся принять их строгий суд."
 holy_war.7.title: "Ответ на призыв"
 holy_war.7.desc: "[preach_target.GetName] внял[preach_target.Custom('end_fem')] нашим проповедям и присоединил[preach_target.Custom('end_assya')] к священной войне, пообещав выделить воинов и пожертвовать средства ради святого дела. Ещё один меч покидает ножны во имя веры. Наше воинство растёт на глазах."
 holy_war.7.a: "Верные собираются на войну."
 holy_war.8.title: "Призыв отвергнут"
 holy_war.8.desc: "[preach_target.GetName] остал[preach_target.Custom('end_assya')] глух[preach_target.Custom('end_fem')] к нашим проповедям и отказал[preach_target.Custom('end_assya')] присоединяться к священной войне. Верующие запомнят холодный приём, с которым столкнулись наши посланники."
 holy_war.8.a: "Да будет так."
 holy_war.8.a.tt: "Наше предложение проигнорировано"
 holy_war.9.title: "Предложение кафедры кардинала"
 holy_war.9.desc: "Если мы согласимся принять крест, [cardinal_offerer.GetName], лидер объединения «[cardinal_io.GetName]», обеща[cardinal_offerer.Custom('end_etyut')] произвести одного из наших прелатов в кардиналы и основать для него новую епархию в нашей державе. Готовы ли мы посвятить себя этой священной миссии?"
 holy_war.9.a: "Мы принимаем эту честь и присоединимся к крестовому походу."
 holy_war.9.a.no_seat_tt: "У нас и так в каждом селении есть по кардинальской кафедре, престиж державы для нас куда важнее"
 holy_war.9.b: "Мы отказываемся."
 holy_war.10.title: "Обещание признания"
 holy_war.10.desc: "Если мы присоединимся к священной войне против неверных, [recognition_offerer.GetName], лидер объединения «[recognition_io.GetName]», обеща[recognition_offerer.Custom('end_etyut')] признать наш высокий статус среди истинно верующих. Это не только поднимет духовный авторитет страны, но и придаст легитимности нашему правлению. Примем ли мы это предложение?"
 holy_war.10.a: "Мы готовы присоединиться к джихаду."
 holy_war.10.b: "Мы отказываемся."
 holy_war.13.title: "Неверные согласны заплатить"
 holy_war.13.desc: "[threatening_crusade.GetName] — серьёзная угроза, и она возымела действие. Страшась прогневать священное воинство, [parias_payer.GetName] согласил[parias_payer.Custom('end_assya')] выплатить дань. Их золото пополнило нашу казну, но это лишь недолгая передышка — пройдёт немного времени, и священная война всё равно придёт к ним на порог."
 holy_war.13.a: "Их золото послужит святому делу."
 holy_war.13.a.tt: "Они выплатили дань"
 holy_war.14.title: "Неверные не желают платить"
 holy_war.14.desc: "[parias_payer.GetName] открыто броса[parias_payer.Custom('end_etyut')] нам вызов, отвергнув требование выплатить дань. Их дерзость лишь разожгла священный пыл верующих. Неверных ждёт страшная кара: [threatening_crusade.GetName|l]."
 holy_war.14.a: "Мы ответим им мечом."
 holy_war.14.a.tt: "Они отказались платить дань"
 holy_war.17.title: "Чудесное исцеление"
 holy_war.17.desc: "Поражённый лихорадкой солдат, которого лагерные врачеватели считали без пяти минут покойником, внезапно поднялся с постели совершенно здоровым. Многие называют его исцеление вмешательством свыше, однако в бреду беднягу терзали странные и пугающие видения, и теперь он убеждён, что то были предсказания грядущего. В лагере с тревогой обсуждают его пророчества. Как нам лучше поступить?"
 holy_war.17.a: "Объявим его выздоровление чудом, чтобы поднять боевой дух войска!"
 holy_war.17.a.muslim: "$holy_war.17.a$"
 holy_war.17.a.tt: "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.17.b: "Замять дело, пока он не посеял панику в лагере."
 holy_war.18.title: "Пыл угасает"
 holy_war.18.desc: "Затянувшееся ожидание тяжело сказывается на войске. Пылкие и страстные молитвы сменились дежурным повторением давно заученных слов, из-за сущих пустяков в лагере вспыхивают ссоры, а по ночам у костров снова разгораются забытые распри. Пламя рвения, толкавшее верующих присоединиться к святому делу, угасло и превратилось в холодную золу. Если не разжечь его вновь, войско растает, даже не вступив в бой. Как мы поступим?"
 holy_war.18.a: "Устроим торжественную проповедь и пир для всего войска."
 holy_war.18.a.tt: "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.18.b: "Верующие должны найти огонь внутри себя."
 holy_war.18.b.tt: "Уменьшает религиозное рвение священной войны на #R 5#! и сдвигает подготовку назад на #R 5#!"
 holy_war.19.title: "Неистовый проповедник"
 holy_war.19.desc: "К лагерю прибился бродячий проповедник. В его глазах тлеет безумие, одежды изношены от долгих странствий, а голос охрип от непрерывных увещеваний. Его пылкие речи собирают целые толпы работников, безземельных крестьян и прочего небогатого, но набожного люда, и они рвутся немедленно вступить в бой во имя веры. Фанатичность проповедника не знает границ, он совершенно неуправляем и не признаёт власти командующих походом вельмож. Что нам делать с этим смутьяном?"
 holy_war.19.a: "Пусть разжигает огонь в сердцах верующих."
 holy_war.19.a.tt: "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.19.b: "Осадить его, пока дело не дошло до беспорядков."
 holy_war.21.title: "Спор за добычу"
 holy_war.21.desc: "Город едва успел пасть, а наши солдаты и воины союзного войска уже сцепились из-за добычи. В тесных переулках уже сверкают ножи, шатры опрокинуты, а давние распри между двумя армиями вот-вот перерастут в настоящее побоище. Если немедленно не уладить эту ссору, вчерашние братья по оружию на радость неприятелю станут врагами, и тогда весь поход окажется под угрозой. Что же нам делать?"
 holy_war.21.a: "Наши люди заслужили эту добычу потом и кровью."
 holy_war.21.a.tt: "Уменьшает религиозное рвение священной войны на #R 5#!"
 holy_war.21.b: "Ради всего святого, их нужно остановить!"
 holy_war.21.b.tt: "Увеличивает религиозное рвение священной войны на #G 5#!"
 holy_war.22.title: "Болезнь поражает войско"
 holy_war.22.desc: "Переполненный лагерь осаждающих охвачен губительной лихорадкой, хмурыми утрами из шатров выносят всё больше впавших в забытье больных. Армейские врачеватели пытаются лечить их кровопусканием, очищением и молитвами, но болезнь не отступает. Весь лагерь пропитался тяжёлым смрадом умирающих, наше воинство слабеет день ото дня, а вражеские стены по-прежнему крепки. Как противостоять этой напасти?"
 holy_war.22.a: "Продолжаем осаду, чего бы это ни стоило."
 holy_war.22.b: "Дать войску отдых, пока болезнь не отступит."
 holy_war.22.b.tt: "Уменьшает религиозное рвение священной войны на #R 5#!"
 holy_war.23.title: "Смерть героя"
 holy_war.23.desc: "[fallen_champion.GetName] [Select_CString(fallen_champion.IsFemale, 'погибла', 'погиб' )] смертью храбрых при осаде [sieged_location.Custom('LR_GEN')|l] [sieged_location.GetName]. Совершив множество подвигов, которые непременно будут воспеты в песнях, [Select_CString(fallen_champion.IsFemale, 'она пала', 'он пал' )] в яростной схватке на крепостной стене. Гибель героя оплакивают и гордые вельможи, и простые солдаты. [Select_CString(fallen_champion.IsFemale, 'Её', 'Его' )] кровь взывает к отмщению, и воины рвутся в бой, чтобы жестоко отплатить неприятелю. Как мы почтим [Select_CString(fallen_champion.IsFemale, 'её', 'его' )] смерть?"
 holy_war.23.a: "Мы будем чтить [Select_CString(fallen_champion.IsFemale, 'её', 'его' )] как мученика, погибшего за веру!"
 holy_war.23.a.tt: "Увеличивает религиозное рвение священной войны на #G 10#!"
 holy_war.23.b: "Проведём скромную церемонию прощания."
 holy_war.23.b.tt: "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.24.title: "Лицемеры в наших рядах"
 holy_war.24.desc: "По лагерю ползут зловещие слухи. Говорят, будто среди верующих затесались еретики и лицемеры, их молитвы — пустое притворство, а преданность делу вызывает серьёзные сомнения. Самые набожные требуют очистить от них ряды святого воинства, пока их ядом не заразилось всё войско. Другие призывают быть рассудительнее — клинок остаётся клинком, какой бы веры ни придерживался солдат в глубине своей души. Как нам лучше поступить?"
 holy_war.24.a: "Лицемерам не место в наших рядах!"
 holy_war.24.a.tt: "Увеличивает религиозное рвение священной войны на #G 8#!"
 holy_war.24.b: "Мы закроем на это глаза. И так каждый меч на счету."
 holy_war.24.b.tt: "Уменьшает религиозное рвение священной войны на #R 5#!"
 holy_war.25.title: "Благочестивое завещание"
 holy_war.25.desc: "Один из богатейших вельмож нашей державы недавно отошёл в мир иной, в своей последней воле завещав значительную сумму на дело священной войны. Его душеприказчики доставили в лагерь запечатанные сундуки с золотом, и мы можем распорядиться этими средствами по своему усмотрению. Однако на золото претендуют и командиры, и духовенство, и бедняки. Что же нам делать с этим нежданно свалившимся богатством?"
 holy_war.25.a: "Эти деньги пригодятся в наших собственных войнах."
 holy_war.25.b: "Передадим его в казну священной войны."
 holy_war.25.b.tt: "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.25.c: "Золото следует раздать как подаяние верующим."
 holy_war.25.c.tt: "Увеличивает религиозное рвение священной войны на #G 3#!"
 holy_war.27.title: "Подкуп удался"
 holy_war.27.desc: "Серебро сделало своё дело — [desertion_member.GetName] принял[desertion_member.Custom('end_fem')] деньги и отказал[desertion_member.Custom('end_assya')] от дальнейшего участия в походе. Без лишних фанфар [desertion_member.GetAdjectiveWithNoTooltip|l]ие воины свернули знамёна и под надуманным предлогом поспешили домой. В который раз деньги сумели купить то, чего нельзя было добиться ни проповедью, ни сталью — один из врагов устранён, а неприятельские силы подорваны его уходом. Это должно напомнить нам об истинной цене верности."
 holy_war.27.a: "Алчность побеждает там, где не справится меч."
 holy_war.27.a.tt: "[desertion_member.GetName] бер[desertion_member.Custom('end_youtut')] деньги и отправля[desertion_member.Custom('end_etyut')]ся домой. Объединение «[desertion_io.GetName]» теряет важного участника"
 holy_war.28.title: "Наше серебро отвергнуто"
 holy_war.28.desc: "[desertion_member.GetName] прогнал[desertion_member.Custom('end_fem')] со двора посланника, доставившего секретное предложение. Не соблазнившись нашими деньгами, неприятель поклялся с удвоенными усилиями продолжать войну. Хуже того, слухи о нашей попытке подкупа могут достичь чужих ушей, и тогда мы прослывём бесчестными мошенниками в глазах всего мира. Эта затея принесла одни проблемы."
 holy_war.28.a: "Да будет так."
 holy_war.28.a.tt: "Они не приняли взятку"
 holy_war.29.title: "Папский легат"
 holy_war.29.desc: "По приказу Его Святейшества к нам [Select_CString(papal_legate..IsFemale, 'прибыла', 'прибыл' )] [papal_legate.GetName] — прелат и воин, столь же [Select_CString(papal_legate..IsFemale, 'искусная', 'искусный' )] в ратном деле, сколь и в духовном служении. [Select_CString(papal_legate..IsFemale, 'Ей', 'Ему' )] велено возглавить наше войско и показать всему миру, что [holy_war.GetName] пользуется полной поддержкой со стороны Рима. Легат станет полезным приобретением для нашей армии и поможет укрепить связь со Святым престолом, но мы не должны забывать, что отвечает [Select_CString(papal_legate..IsFemale, 'она', 'он' )] только перед папой, и только потом перед нами. Так нужны ли нам [Select_CString(papal_legate..IsFemale, 'её', 'его' )] услуги?"
 holy_war.29.a: "Мы рады принять легата под наши знамёна."
 holy_war.29.a.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.29.b: "Поблагодарим [Select_CString(papal_legate..IsFemale, 'её', 'его' )] и отправим назад в Рим."
 holy_war.30.title: "Продавцы индульгенций"
 holy_war.30.desc: "Почуяв возможность наживы, лагерь наводнили торговцы индульгенциями. Они набрасываются на солдат словно стервятники на падаль, убеждая их отдать последние деньги в обмен на отпущение грехов и освящённые безделушки. Чем больше прибыли приносит этот промысел, тем громче ропщут самые набожные из воинов — им кажется, что продажа индульгенций бесчестит наше священное дело. Но без денег нам никак не обойтись, ибо ни одна священная война не выигрывалась одной лишь молитвой. Как же нам поступить?"
 holy_war.30.a: "Их серебро пополнит военную казну."
 holy_war.30.a.tt: "Уменьшает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 3#!"
 holy_war.30.b: "Скрытно переместим деньги в нашу собственную сокровищницу."
 holy_war.30.b.tt: "Уменьшает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #R 5#!"
 holy_war.30.c: "Изгнать мошенников из лагеря!"
 holy_war.30.c.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.31.title: "Мощи святого"
 holy_war.31.desc: "Благодарные монахи проделали долгий и опасный путь, чтобы доставить к нашему двору кости почитаемого святого. Подобные реликвии стоят дороже любого золота — когда они наконец найдут пристанище, тысячи верующих потянутся к месту их упокоения, чтобы вознести молитвы и поклониться святыне. Как мы поступим с мощами?"
 holy_war.31.a: "Поместим их в раку в столице."
 holy_war.31.b: "Их понесут перед нашими воинами в битву."
 holy_war.31.b.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 8#!"
 holy_war.32.title: "Клятва крестоносца"
 holy_war.32.desc: "На глазах у всего двора [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] преклоняет колени перед алтарём, а затем клянётся принять крест и лично возглавить воинство верующих в священной войне, разделив все тяготы и опасности похода со скромными пехотинцами. Теперь вся страна будет ждать, что мы выполним это дерзкое и рискованное обещание. Но стоит ли оставлять обет в силе?"
 holy_war.32.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] лично поведёт крестоносное воинство."
 holy_war.32.a.tt: "Увеличивает религиозное рвение [Concept('crusade', 'крестового похода')|e] на #G 5#!"
 holy_war.32.b: "Для державы полезнее, когда [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip|l] восседает на троне."
 holy_war.33.title: "Христианский мир принимает крест"
 holy_war.33.desc: "Могучая волна религиозного пыла захлестнула державу. Люди всякого звания рвутся нашить на свои одеяния кресты и выступить в защиту веры. Знатные рыцари и землевладельцы соперничают за честь идти в авангарде воинства, а простой деревенский люд берётся за любое оружие, какое только может найти. Чьё рвение послужит нам в первую очередь?"
 holy_war.33.a: "Созовём под знамёна рыцарей и дворян."
 holy_war.33.b: "Мы соберём великую армию из простонародья."
 holy_war.34.title: "Суфийский шейх"
 holy_war.34.desc: "Почитаемый суфийский шейх [sufi_shaykh.GetName], чьи набожность и учёность известны всему мусульманскому миру, прибыл в наш лагерь с отрядом верных последователей. Его вечерние проповеди у костра разжигают огонь в сердцах гази. Воины, которые ещё вчера едва переставляли ноги, сегодня с горящими глазами рассуждают о мученической смерти. Как нам принять этого святого человека?"
 holy_war.34.a: "Приблизим шейха ко двору."
 holy_war.34.a.tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 5#!"
 holy_war.34.b: "Странствующих мистиков лучше держать подальше от двора."
 holy_war.34.b.tt: "Уменьшает религиозное рвение [Concept('jihad', 'джихада')|e] на #R 3#!"
 holy_war.35.title: "Гази требуют свою долю"
 holy_war.35.desc: "Добровольцы, поспешившие откликнуться на наш призыв, настойчиво требуют обещанной им добычи. Недовольные воины столпились перед нашим шатром, выкрикивая свои требования, их терпение на исходе. Они говорят, что сражались за веру, но также за своих жён и детей — а если они так и останутся с пустыми руками, то к следующей тяжёлой битве наши ряды могут заметно поредеть. Как мы ответим на их требования?"
 holy_war.35.a: "Поделимся с гази долей добычи."
 holy_war.35.a.tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 5#!"
 holy_war.35.b: "Добыча пойдёт в военную казну, а не в чьи-то карманы."
 holy_war.35.b.tt: "Уменьшает религиозное рвение [Concept('jihad', 'джихада')|e] на #R 3#!"
 holy_war.36.title: "Фетва правоведа"
 holy_war.36.desc: "Влиятельный правовед, чьё мнение уважают по #italic умме#!, издал #italic фетву#!, в которой объявил священную войну святым долгом всякого верующего, способного держать оружие. Если поручить переписчикам сделать сотни копий и разослать их по мечетям, то вся умма преисполнится рвения и захочет поддержать наше дело. Будем ли мы распространять эту фетву?"
 holy_war.36.a: "Пусть весь мир узнает об этом решении."
 holy_war.36.a.tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 8#!"
 holy_war.36.b: "Примем фетву с благодарностью, но без лишнего шума."
 holy_war.36.b.tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 3#!"
 holy_war.37.title: "Добровольцы со всей уммы"
 holy_war.37.desc: "Весть о священной войне разнеслась далеко за пределы наших рубежей, и теперь к месту сбора прибывают отряды добровольцев-гази из далёких мусульманских земель. Они устали после долгого пути, покрыты пылью, но исполнены решимости. Они просят лишь об одном: позволить им встать в строй и сразиться с врагом. Конечно, нам придётся кормить немало лишних ртов, но вместе с ними мы получим множество рвущихся в бой клинков. Примем ли мы их в свои ряды?"
 holy_war.37.a: "Примем добровольцев с распростёртыми объятиями."
 holy_war.37.a.tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 3#!"
 holy_war.37.b: "Мы не сможем прокормить всех странствующих фанатиков."
 holy_war.38.title: "Священное знамя"
 holy_war.38.desc: "В наши руки передали древнее военное знамя. Согласно преданию, оно развевалось над рядами воинов истинной веры в дни её первых побед над неверными. И пусть его ткань выцвела и истёрлась от времени, один его вид пробуждает в сердцах верующих праведный гнев, а воины клянутся без колебаний последовать за ним навстречу любой опасности. Как мы распорядимся этой бесценной реликвией?"
 holy_war.38.a: "Пусть это знамя поведёт наше войско в бой."
 holy_war.38.a.tt: "Увеличивает религиозное рвение [Concept('jihad', 'джихада')|e] на #G 5#!"
 holy_war.38.b: "Такое сокровище следует тщательно оберегать."
 sacred_war_banner: "Священное знамя"
 sacred_war_banner_desc: "Это выцветшее и истёртое от времени военное знамя, под которым верующие, согласно преданию, одержали свои первые победы. Теперь оно считается величайшей святыней державы и выносится лишь в самые священные праздники, чтобы пробудить в верных праведный пыл."
 holy_war.39.title: "Предложение кафедры принято"
 holy_war.39.desc: "[cardinal_candidate.GetName] согласил[cardinal_candidate.Custom('end_assya')] на наше предложение о кардинальской кафедре и принял[cardinal_candidate.Custom('end_fem')] крест, пообещав, что объединение «[cardinal_io.GetName]» получит их помощь. Будем надеяться, что среди духовенства этой страны найдётся кто-то, достойный высокого звания князя Церкви."
 holy_war.39.a: "Deo gratias!"
 holy_war.40.title: "Предложение кафедры отвергнуто"
 holy_war.40.desc: "[cardinal_candidate.GetName] не принял[cardinal_candidate.Custom('end_fem')] наше предложение о кардинальской кафедре. Значит, объединение «[cardinal_io.GetName]» обойдётся без их участия, а эта честь будет предложена другой державе."
 holy_war.40.a: "Да будет так."
 holy_war.41.title: "Наше признание принято"
 holy_war.41.desc: "[recognition_candidate.GetName] принял[recognition_candidate.Custom('end_fem')] наше обещание признания и пообещал[recognition_candidate.Custom('end_fem')] присоединиться к борьбе против неверных. Объединение «[recognition_io.GetName]» получит их помощь."
 holy_war.41.a: "Аллах велик."
 holy_war.42.title: "Наше признание отвергнуто"
 holy_war.42.desc: "[recognition_candidate.GetName] проигнорировал[recognition_candidate.Custom('end_fem')] наше обещание признания. Таким образом, объединение «[recognition_io.GetName]» обойдётся без их участия, но истинно верующие запомнят, кто отвернулся от них в час нужды."
 holy_war.42.a: "Да будет так."
