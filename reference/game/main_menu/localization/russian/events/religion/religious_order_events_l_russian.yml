l_russian:
 religious_orders.1.desc: "Скончался богатый благотворитель, и по его завещанию небольшое состояние переходит к [target_order.GetName]. Братья уже заговорили о новых крышах для своих обителей и хлебе для нищих у их ворот. По обычаю такие дары остаются за ними, хотя сумма подобного размера редко ускользает от внимания [target_character.GetName]."
 religious_orders.1.a: "Пусть братья оставят его себе."
 religious_orders.1.b: "Забрать его в казну."
 religious_orders.2.title: "[target_order.GetNameWithNoTooltip] ищет пристанища"
 religious_orders.2.desc: "[target_order.GetName] разросся настолько, что его немногочисленные обители уже не вмещают всех, и братья просят у нас земли для расширения. Они обратили взор на [target_location.GetName], где хотели бы возвести новую обитель и собирать послушников из окрестных земель. Земля эта в нашей власти — дать её или отказать, и они ждут нашего решения."
 religious_orders.2.a: "Дать землю."
 religious_orders.2.b: "Наделить вместо этого местное [GetEstateNameWithNoTooltip('clergy_estate')]."
 religious_orders.2.c: "Отказать им."
 locals_embrace_the_order_desc: "Народ сразу полюбил братьев, и уже через сезон новая обитель кажется, будто стояла среди них всегда"
 order_works_to_bolster_local_wealth_desc: "Братья взялись осушать поля и чинить дороги, и округа богатеет от их трудов"
 order_projects_central_authority_desc: "С обустройством ордена в [target_location.GetName] власть [target_character.GetName] теперь простирается немного дальше, чем прежде"
 order_appreciates_new_holding_desc: "Братья с благодарностью принимают дар, и в обителях ордена с теплотой вспоминают милость [target_character.GetName]"
 religious_orders.3.title: "[target_order.GetNameWithNoTooltip] пробуждает верующих"
 religious_orders.3.desc: "[target_order.GetName] пробудил в стране небывалое благочестие, и братья гордятся тем рвением, что сами же и разожгли. Одни хотели бы направить это усердие в те города, куда наша вера ещё не проникла, дабы обратить души, недоступные приходским священникам. Другие лишь ворчат, что подобные настроения редко остаются мягкими к денежным людям гильдий."
 religious_orders.3.a: "Благословить рвение."
 religious_orders.3.b: "Потребовать пожертвование от [GetEstateNameWithNoTooltip('burghers_estate')]."
 religious_orders.3.c: "Отправить братьев проповедовать там, где вера слабее всего."
 religious_orders.4.title: "Скандал в обители"
 religious_orders.4.desc: "До нас дошли слухи, что некоторые братья из [target_order.GetName] живут далеко от своих обетов, и молва об этом уже расходится за стены обители. Капитул смотрит на нас в надежде, что мы вмешаемся прежде, чем скандал причинит настоящий вред."
 religious_orders.4.a: "Покарать виновных."
 religious_orders.4.b: "Уладить дело без шума."
 scandal_kept_quiet_desc: "Дело удалось замять, хотя на имени ордена остаётся лёгкое пятно"
 scandal_breaks_open_desc: "Молчание не помогает, и братья винят в разразившемся скандале [target_character.GetName]"
 religious_orders.5.title: "Покровитель отступается"
 religious_orders.5.desc: "Один из знатных домов [GetEstateName('nobles_estate')] долгое время содержал [target_order.GetName], но теперь этот кошелёк закрылся. Братья тотчас же ощутили нужду и обратились к [target_character.GetName] в надежде, что [target_character.GetSheHe] не позволит их делу зачахнуть."
 religious_orders.5.a: "Покрыть недостачу из казны."
 religious_orders.5.b: "Пусть довольствуются меньшим."
 religious_orders.5.c: "Потребовать, чтобы [GetEstateNameWithNoTooltip('nobles_estate')] нашло нового покровителя."
 new_patron_steps_forward_desc: "Соперничающий дом берёт на себя покровительство, и казна ордена снова полнится"
 no_patron_steps_forward_desc: "Новый покровитель не находится, и братья принимают наше вмешательство с неприязнью"
 treasury_gift_entrenches_order_desc: "Орден с толком распоряжается даром, и его власть над нашими землями от этого только крепнет"
 treasury_gift_earns_gratitude_desc: "Братья принимают монеты как знак благосклонности, и их расположение к [target_character.GetName] становится глубже"
 religious_orders.6.title: "Опустевшее послушничество"
 religious_orders.6.desc_martial: "Мало юношей приходит взять меч и крест вместе с [target_order.GetName]. Его командорства стоят полупустыми, и ветераны-братья вслух спрашивают, кто будет держать границу, когда их не станет."
 religious_orders.6.desc_monastic: "Год от года всё меньше послушников стучится в врата [target_order.GetName]. Хоры стоят пустыми на утрене, и стареющие братья тревожатся, кто будет вести службы, когда их не станет."
 religious_orders.6.a: "Открыть врата всем, кто желает служить."
 religious_orders.6.b: "Держаться строгих обетов."
 religious_orders.6.c: "Финансировать набор новобранцев."
 order_abandons_a_house_desc: "Не имея послушников, чтобы заполнить его, орден тихо отказывается от одного из своих домов"
 order_withers_for_want_of_novices_desc: "Орден держится своих устоев, но его силы и рвение убывают из-за нехватки свежей крови"
 religious_orders.101.title: "Рыцарь ордена"
 religious_orders.101.desc: "Среди братьев [target_order.GetName] есть рыцарь, о котором пограничные деревни уже слагают песни. Его начальники, помня, откуда берётся их хлеб, готовы предоставить меч [target_character.GetName] нашим знамёнам на всё время, что продлятся наши войны."
 religious_orders.101.a: "Дать ему поручение, достойное песен."
 religious_orders.101.b: "Его место на границе."
 religious_orders.102.title: "Мечи через границу"
 religious_orders.102.desc: "Братья [target_order.GetName] без разрешения вторглись в [target_country.GetName] и вернулись домой, гоня перед собой украденный скот. Мы не находимся в состоянии войны. Послы нашего соседа уже в пути, и явятся они не с молитвами."
 religious_orders.102.a: "Возместить убытки и упрекнуть орден."
 religious_orders.102.b: "Что взято у неверных, то взято по праву."
 religious_orders.103.title: "Камень на камень"
 religious_orders.103.desc: "Пришло письмо от хранителей [target_order.GetName], написанное так, как пишут воины: стены их дома в [target_location.GetName] старше самой границы, которую они охраняют, а известь дешевле скорби. Просят они немного и просят напрямик."
 religious_orders.103.a: "Оплатить крепкий камень."
 religious_orders.103.b: "Со стенами можно подождать; пусть лучше расширят патрули."
 religious_orders.104.title: "Маяки остались тёмны"
 religious_orders.104.desc_captives: "К тому времени, как в [target_location.GetName] подняли тревогу, налётчики уже уходили — и уходили не с пустыми руками. Селян связали и увели, чтобы продать на рынках, которых мы никогда не увидим. Сторожевые огни [target_order.GetName] горели всю ночь и никого не предупредили, хотя хранители давали обет предотвращать именно это."
 religious_orders.104.desc_herds: "Пастбища вокруг [target_location.GetName] были очищены за одну ночь — во всей округе не осталось ни копыта, ни рога. Зернохранилища ощутят эту потерю задолго до конца года. Хранители [target_order.GetName] всё спрашивают друг друга, почему маяки остались тёмны."
 religious_orders.104.desc_plate: "Налётчики ночью проскользнули мимо сторожевых огней [target_order.GetName], и к утру церковь в [target_location.GetName] стояла обобрана до нагого камня — серебро и реликвии унесли в мешках через седло. Братья не могут смотреть нам в глаза."
 religious_orders.104.a: "Стерпеть потерю."
 religious_orders.104.b: "Отправить братьев в погоню за налётчиками."
 wardens_spoils_recovered_desc: "Братья скачут без отдыха и настигают налётчиков у брода. Они возвращаются со всем, кроме извинений, а история уже обрастает подробностями в пересказах"
 wardens_trail_cold_desc: "Братья выезжают в погоню, но находят лишь следы копыт да остывший пепел. Потеря остаётся при нас, как и позор"
 religious_orders.105.title: "Чернила и пергамент"
 religious_orders.105.desc: "Братья ордена [target_order.GetName] ведут самые аккуратные книги учёта в наших землях, и они это знают. Их настоятели предложили нам писцов, чьё владение [ROOT.GetCountry.GetLiturgicalLanguage.GetName] безупречно, а счёт беспощаден, прося взамен лишь тихую келью и скромное содержание."
 religious_orders.105.a: "Приставить их к налоговым книгам."
 religious_orders.105.b: "Приставить их к государственной переписке."
 religious_orders.106.title: "Сломанная печать"
 religious_orders.106.desc: "Письмо под нашей личной печатью было зачитано в капитуле ордена [target_order.GetName] за три дня до того, как его получатель сломал воск. Братья, служащие в нашей канцелярии, ничего не забывают. Теперь выясняется, что и хранить тайны они тоже не умеют."
 religious_orders.106.a: "Отстранить их от канцелярии."
 religious_orders.106.b: "Подсунуть им подложные записи."
 religious_orders.106.c: "Стерпеть это молча."
 confidants_ruse_swallowed_desc: "Подложные цифры расходятся именно так, как мы и надеялись, и мы отмечаем каждого, через чьи руки они проходят"
 confidants_ruse_discovered_desc: "Зоркий брат замечает выдуманные цифры уже через неделю, а орден не прощает, когда его выставляют дураком"
 religious_orders.107.title: "Домой с моря"
 religious_orders.107.desc_crews: "С палубами, полными моряков, снятых с корабля, потерпевшего крушение на дальних отмелях, галера [target_order.GetName] с трудом добралась до гавани, глубоко осев в воде. Спасённые клянутся, что братья гребли сквозь такую бурю, в которую не вышел бы ни один наёмный капитан, и клянутся в этом громко в каждой таверне на пристани."
 religious_orders.107.desc_charts: "Галера [target_order.GetName] вернулась домой после долгого сопровождения, и её капитан сходит на берег с лоциями, исправленными собственной рукой: промеры глубин и якорные стоянки, о которых наши лоцманы и не знали, отмечены ясно для всякого грамотного человека."
 religious_orders.107.desc_relic: "Половина побережья вышла посмотреть, как галера [target_order.GetName] входит в порт под всеми своими вымпелами. Братья несут на берег реликвию, купленную в далёкой гавани, и толпа на пристани теснится, чтобы взглянуть на неё."
 religious_orders.107.a: "Принять их с почестями."
 religious_orders.107.b: "Орден сам разберётся со своими."
 religious_orders.108.title: "Погибли с командой"
 religious_orders.108.desc: "Лучшая галера [target_order.GetName] разбилась о мель во время зимнего шторма, на виду у гавани и вне всякой помощи. Братья на её борту утонули рядом с лоцманами, которых сами годами обучали. Вдоль побережья звонят колокола ордена, а хоронить некого."
 religious_orders.108.a: "Переоснастить их флотилию за наш счёт."
 religious_orders.108.b: "Море даёт, море и забирает."
 religious_orders.109.title: "Неукоснительные часы"
 religious_orders.109.desc: "Дольше, чем помнят большинство ныне живущих, братья [target_order.GetName] неукоснительно соблюдают часы молитвы, не пропустив ни единой ночи. Заутреня в стужу и вечерня в моровые времена — молитва за молитвой, как ряды кладки в стене. В народе уже говорят вслух, что [ROOT.GetCountry.GetFlavorRank] стоит потому, что братья молятся на коленях."
 religious_orders.109.a: "Объявить день благодарения."
 religious_orders.109.b: "Послать за благословением аббата."
 religious_orders.110.title: "Голос из кельи"
 religious_orders.110.desc: "Отшельник [target_order.GetName], замурованный в своей келье вот уже двадцать лет, начал кричать через оконную щель, что над нами нависли огонь и мор, точно занесённый меч. Паломники разносят его слова из прихода в приход быстрее любого гонца, и с каждым пересказом они становятся всё страшнее."
 religious_orders.110.a: "Повелеть аббату заставить его умолкнуть."
 religious_orders.110.b: "Пусть выкрикнет своё предостережение."
 doom_talk_fades_desc: "Целый сезон страна затаивает дыхание. Затем урожай собирают благополучно, а небо не желает падать, и пророчество тихо умирает от неловкости"
 dread_takes_hold_desc: "Страх пускает корни. Поля стоят полузаброшенные, пока кающиеся бродят по дорогам, а часовни ордена никогда не были так полны"
 religious_orders.111.title: "Кодекс из мрака"
 religious_orders.111.desc: "Братья [target_order.GetName] в [target_location.GetName], перепереплетая источенный червями псалтырь, обнаружили под досками переплёта более древний текст: список, сделанный столетия назад и оплаканный как утраченный всеми учёными, кто когда-либо его искал. Библиотекарь с тех пор не спит, и его письмо к нам намекает, что и не собирается."
 religious_orders.111.a: "Велеть сделать списки для наших людей."
 religious_orders.111.b: "Пусть остаётся в их библиотеке."
 religious_orders.112.title: "Пожар в скриптории"
 religious_orders.112.desc_chronicles: "Огарок свечи и сквозняк — и к заутрене скрипторий [target_order.GetName] в [target_location.GetName] исчез. Хроники, которые братья вели о наших деяниях, год за годом с незапамятных времён, сгорели вместе с полками, на которых стояли. Что бы мы ни совершили, доказательств этому теперь куда меньше."
 religious_orders.112.desc_psalters: "Скрипторий [target_order.GetName] в [target_location.GetName] сгорел до дверных косяков ещё до рассвета, и вместе с ним сгорели великие хоровые книги. Псалтыри и антифонарии были гордостью обители, украшенные миниатюрами, плодом труда многих поколений. Теперь службы будут петь по памяти, а память подводит."
 religious_orders.112.desc_charters: "Огонь ночью пожрал скрипторий [target_order.GetName] в [target_location.GetName], а вместе с ним — грамоты и купчие на половину округи. Всякая граница, которую братья когда-либо закрепляли на пергаменте, теперь дело мнения, а мнения в таких делах редко бывают скромными."
 religious_orders.112.a: "Отстроить заново, полку за полкой."
 religious_orders.112.b: "Пепел учит смирению."
 religious_orders.113.title: "Поля из пустоши"
 religious_orders.113.desc: "Братья [target_order.GetName] три зимы осушали болото под своей гранжей в [target_location.GetName], и этой весной вода наконец отступила. Там, где гнездились цапли, теперь чёрная земля, и её оказалось больше, чем кто-либо ожидал, а вопрос о том, чей плуг вспашет её первым, встал с первой же сухой неделей."
 religious_orders.113.a: "Пусть гранжи расширяются."
 religious_orders.113.b: "Поселить наших людей на новой земле."
 religious_orders.114.title: "Мор в хлевах"
 religious_orders.114.desc: "В хлевах [target_order.GetName] близ [target_location.GetName] вспыхнул мор. Скотина стоит дрожа, понурив головы, пока лекари по скотине спорят друг с другом, а братья прямо спрашивают нас, взяться ли за нож или за молитву."
 religious_orders.114.a: "Забить и сжечь."
 religious_orders.114.b: "Довериться молитве и чистой соломе."
 murrain_passes_over_desc: "Хворь угасает в течение месяца. Братья, никогда в этом не сомневавшиеся, из деликатности не спешат об этом громко заявлять"
 murrain_spreads_desc: "Мор перекидывается из хлевов обители на все стада в округе, и молебны никак не замедляют его поступь"
 religious_orders.115.title: "Гром над торговой площадью"
 religious_orders.115.desc: "Монах ордена [target_order.GetName] взял привычку проповедовать на рынке [target_location.GetName] как раз в тот час, когда менялы открывают свои лавки. Он не называет имён, да и не нужно. Бедняки заполняют площадь, чтобы его послушать, а менялы в последнее время стали приходить позже и уходить раньше."
 religious_orders.115.a: "Пусть гремит."
 religious_orders.115.b: "Посоветовать проповедь помягче."
 religious_orders.116.title: "Кафедра поворачивается"
 religious_orders.116.desc: "Тот же дар, что собирает толпу на площади, с той же лёгкостью может разрушить и репутацию. Монах ордена [target_order.GetName] обратил свои проповеди против нас в [target_location.GetName]: наши подати и наши грехи он перечисляет один за другим с кафедры, пока толпа считает вслух вместе с ним."
 religious_orders.116.a: "Ответить ему милосердием."
 religious_orders.116.b: "Стащить его с кафедры."
 friar_recants_desc: "В заточении пыл его угасает, и он отрекается от своих слов перед свидетелями. Позор ложится на весь орден"
 martyr_of_the_square_desc: "Он идёт в свою келью с песней на устах, и площадь этого не забывает. Братья уже называют его мучеником, а город вторит братьям"
 religious_orders.117.title: "Колесо подкидышей"
 religious_orders.117.desc: "Братья [target_order.GetName] устроили в стене своей обители в [target_location.GetName] вращающееся колесо, куда можно оставить младенца без имени и без единого вопроса. Колесо вертится куда чаще, чем город готов признать, и колыбели ордена не пустуют."
 religious_orders.117.a: "Восхвалить их милосердие."
 religious_orders.117.b: "Пусть детей забирают приходы."
 religious_orders.118.title: "Переполненный приют"
 religious_orders.118.desc: "Вместе с дорожным людом в город пришла лихорадка, и приют [target_order.GetName] в [target_location.GetName] распахнул двери, как того требует устав ордена. Больные лежат по двое на койке и вдоль стен монастырской галереи между ними. Городские лекари называют это место лампой, зажжённой для мотыльков."
 religious_orders.118.a: "Запереть двери приюта."
 religious_orders.118.b: "Милосердие не отступает."
 hospice_spared_desc: "Лихорадка угасает у стен приюта, будто по уговору. Братья хоронят немногих умерших и замечают, что устав доказал свою правоту"
 hospice_fever_spreads_desc: "То, что собралось в приюте, не остаётся в приюте. Лихорадка выходит наружу вместе с исцелёнными и скорбящими, и квартал за кварталом захлёстывает болезнь"
 religious_orders.119.title: "Отпущение грехов для Маршей"
 religious_orders.119.desc: "Война закончилась, но счёт за неё ещё не оплачен. Духовники [target_order.GetName] попросили разрешения обойти самые пострадавшие кварталы, чтобы услышать то, чего люди не расскажут соседям, и отпустить то, чего они не могут забыть."
 religious_orders.119.a: "Отправить их к народу."
 religious_orders.119.b: "Их первое дело — с сильными мира сего."
 religious_orders.120.title: "Отпущение грехов на продажу"
 religious_orders.120.desc_noble: "Один из братьев [target_order.GetName] завёл тихую торговлю: отпускает грехи знатному дому из [GetEstateName('nobles_estate')], который ещё не закончил их совершать, а поток даров идёт вровень с отпущениями. Капитул смущён. Дом, о котором идёт речь, — нет."
 religious_orders.120.desc_merchant: "Брат [target_order.Custom('CL_GEN')] продавал чистую совесть купеческим домам — отпущение грехов, оценённое в бухгалтерских книгах не хуже прочего товара. Для [GetEstateName('burghers_estate')] честно уплаченная цена справедлива — совсем не грех, в чём, собственно, и заключается суть проблемы."
 religious_orders.120.desc_prelate: "Среди духовников [target_order.GetName] есть один, чьи покаяния становятся заметно легче по мере того, как растёт знатность грешников, и каждый из его исповедующихся — такой же церковник, отпущенный от грехов, которые известны во всём приходе. [GetEstateName('clergy_estate')] предпочло бы, чтобы мы не всматривались слишком пристально."
 religious_orders.120.a: "Потребовать, чтобы орден выдал его."
 religious_orders.120.b: "Исповеданное принадлежит Богу."
 religious_orders.201.title: "После кабальгады"
 religious_orders.201.desc: "Братья возвращаются из набега с добычей и пленниками, и в командорстве нет единого мнения, как отметить это событие."
 religious_orders.201.a: "Выставить добычу на показ и разжечь рвение ордена к границам ещё сильнее."
 religious_orders.201.b: "Тихо направить добычу на укрепление обороны рубежей."
