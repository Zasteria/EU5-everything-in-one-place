l_russian:
 religious_orders.1.title: "Благочестивое завещание"
 religious_orders.1.desc: "Умирая, богатый покровитель завещал братьям-монахам немалое состояние. [target_order.GetName] уже предвкушает новые крыши над постройками капитула и повозки хлеба для раздачи голодающим, ведь завещанные богатства принадлежат ему по праву. Тем не менее, [target_character.GetName] наверняка имеет собственное мнение на этот счёт…"
 religious_orders.1.a: "Пусть братья оставят деньги себе."
 religious_orders.1.b: "Золото пойдёт в казну."
 religious_orders.2.title: "[target_order.GetNameWithNoTooltip] ищет возможности для расширения"
 religious_orders.2.desc: "[target_order.GetName] давно перерос свою группу построек, его братья просят нас о расширении орденских владений. Они замыслили построить новый капитул в [target_location.Custom('LR_PREP')|l] [target_location.GetName], рассчитывая привлечь новых послушников из числа жителей окрестных земель. Земля эта принадлежит нам, и лишь нам решать, отдать её ордену или нет."
 religious_orders.2.a: "Они получат свою землю."
 religious_orders.2.b: "Пусть лучше этой землёй распорядятся местные [GetEstateNameWithNoTooltip('clergy_estate')|l]."
 religious_orders.2.c: "Откажем в просьбе."
 locals_embrace_the_order_desc: "Местное население тепло встречает братьев, через несколько месяцев уже и не скажешь, что капитул был построен совсем недавно"
 order_works_to_bolster_local_wealth_desc: "Братья берутся осушать поля и ремонтировать дороги, благодаря их трудам регион начинает быстро богатеть"
 order_projects_central_authority_desc: "С появлением ордена в [target_location.Custom('LR_PREP')|l] [target_location.GetName] [target_character.GetName] укрепляет свою власть над окрестными территориями"
 order_appreciates_new_holding_desc: "Братья с благодарностью принимают дар. [target_character.GetName] пользуется огромным уважением в орденских капитулах"
 religious_orders.3.title: "[target_order.GetNameWithNoTooltip] разжигает пыл верующих"
 religious_orders.3.desc: "[target_order.GetName] пробудил в стране небывалое религиозное рвение, что стало предметом особой гордости среди братьев. Некоторые предлагают направить этот пыл в города, где наша вера пока недостаточно сильна, и обратить души, до которых так и не удалось достучаться местным священникам. Другие предостерегают, что состоятельные горожане и гильдии нередко страдают от подобных проявлений фанатизма."
 religious_orders.3.a: "Да будут благословенны пылкие сердца."
 religious_orders.3.b: "[GetEstateNameWithNoTooltip('burghers_estate')|U] должны внести свой вклад."
 religious_orders.3.c: "Братьям следует проповедовать там, где вера слабее всего."
 religious_orders.4.title: "Скандал в монастыре"
 religious_orders.4.desc: "[target_order.GetName] оказался в центре скандала. До нас дошли сведения, что некоторые братья давно позабыли свои обеты, и слухи об этом уже просочились за стены монастыря. Капитул надеется, что мы сумеем погасить скандал, пока он не нанёс ощутимого вреда."
 religious_orders.4.a: "Накажем виновных."
 religious_orders.4.b: "Решим проблему без лишнего шума."
 scandal_kept_quiet_desc: "Скандал удаётся замять, хотя репутация ордена немного подпорчена"
 scandal_breaks_open_desc: "Замолчать проблему не удаётся, и теперь братья считают, что в разразившемся скандале [Select_CString(target_character.IsFemale, 'виновата', 'виноват' )] [target_character.GetName]"
 religious_orders.5.title: "Утрата покровителя"
 religious_orders.5.desc: "[target_order.GetName] издавна пользуется покровительством одного славного аристократического рода, но сейчас [GetEstateName('nobles_estate')|l] затянули пояса. Не привыкшие к нужде братья просят, чтобы [target_character.GetName] [Select_CString(target_character.IsFemale, 'нашла', 'нашёл' )] выход из трудного положения."
 religious_orders.5.a: "Мы покроем недостачу из казны."
 religious_orders.5.b: "Пусть научатся экономить."
 religious_orders.5.c: "[GetEstateNameWithNoTooltip('nobles_estate')] должны найти ордену нового покровителя."
 new_patron_steps_forward_desc: "Другой знатный дом пользуется шансом утереть нос соперникам, и сундуки ордена вновь наполняются золотом"
 no_patron_steps_forward_desc: "Желающих стать покровителем ордена не находится, и братья во всём обвиняют нас"
 treasury_gift_entrenches_order_desc: "Орден умело распоряжается даром, его хватка на наших землях становится крепче"
 treasury_gift_earns_gratitude_desc: "Братья благосклонно принимают деньги, и [target_character.GetName] приобретает немалый авторитет в глазах ордена"
 religious_orders.6.title: "Пустые кельи"
 religious_orders.6.desc_martial: "[target_order.GetName] хиреет, в последние годы всё меньше молодых воинов стремятся принять крест и меч, вступив в его ряды. Командорства стоят полупустыми, а пожилые братья не перестают гадать, кто же будет удерживать рубежи, когда их не станет."
 religious_orders.6.desc_monastic: "[target_order.GetName] хиреет, с каждым годом всё меньше молодых послушников стучатся в его ворота. Утром почти никогда почти нет певчих, а пожилые братья не перестают гадать, кто же будет служить, когда их не станет."
 religious_orders.6.a: "Распахнём ворота для всех желающих."
 religious_orders.6.b: "Мы должны придерживаться строгих обетов."
 religious_orders.6.c: "Найдём средства на то, чтобы рассказывать об ордене."
 order_abandons_a_house_desc: "Оставшись без новых послушников, орден вынужден закрыть один из своих капитулов"
 order_withers_for_want_of_novices_desc: "Орден упрямо держится за свои высокие стандарты, однако без притока новой крови его прежняя мощь и пыл угасают"
 religious_orders.101.title: "Герой ордена"
 religious_orders.101.desc: "Среди братьев ордена служит прославленный рыцарь, чьё имя воспето жителями пограничных деревень. [target_order.GetName] не забывает о том, кому обязан своим высоким положением, и его руководство предлагает, чтобы [target_character.GetName] [Select_CString(target_character.IsFemale, 'сражалась', 'сражался' )] под нашим знаменем, пока мы нуждаемся в [Select_CString(target_character.IsFemale, 'её', 'его' )] услугах."
 religious_orders.101.a: "Дадим [Select_CString(target_character.IsFemale, 'ей', 'ему' )] должность, достойную [Select_CString(target_character.IsFemale, 'её', 'его' )] славы."
 religious_orders.101.b: "[Select_CString(target_character.IsFemale, 'Её', 'Его' )] место на границе."
 religious_orders.102.title: "Набег через границу"
 religious_orders.102.desc: "[target_order.GetName] без дозволения перешёл границу #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! и угнал оттуда стадо скота. Теперь нам грозит война, посланники соседей уже в пути, и скачут они вовсе не для того, чтобы помолиться."
 religious_orders.102.a: "Выплатим соседям компенсацию и публично накажем орден."
 religious_orders.102.b: "То, что отобрано у неверных, украденным не считается."
 religious_orders.103.title: "Камень за камнем"
 religious_orders.103.desc: "Орденские братья из [target_location.Custom('LR_GEN')|l] [target_location.GetName] жалуются, что стены их капитула старше, чем сам [target_order.GetName|l], а скрепляющий камни раствор буквально крошится в пальцах. Рыцари просят немногого, но делают это с солдатской прямотой и в выражениях не стесняются."
 religious_orders.103.a: "Мы заплатим за крепкий камень."
 religious_orders.103.b: "Стены могут подождать, пусть высылают больше патрулей."
 religious_orders.104.title: "Никто не зажёг сигнальные огни"
 religious_orders.104.desc_captives: "К тому времени, как в [target_location.Custom('LR_PREP')|l] [target_location.GetName] подняли тревогу, налётчики уже удирали — причём не с пустыми руками. Они угнали в плен множество крестьян, теперь несчастных ждёт рабство в далёких и неведомых странах. Костры на границе горели всю ночь, однако [target_order.GetName|l] так никого и не предупредил об опасности — а ведь рыцари давали клятву, что станут нашим щитом."
 religious_orders.104.desc_herds: "За одну ночь пастбища вокруг [target_location.Custom('LR_GEN')|l] [target_location.GetName] совершенно опустели, в окрестностях не осталось ни единой головы скота. Амбары почувствуют эту утрату задолго до конца года. Никто не понимает, почему [target_order.GetName|l] не зажёг сигнальные огни."
 religious_orders.104.desc_plate: "Воспользовавшись темнотой, налётчики проскользнули мимо костров дозорных, которых выставил [target_order.GetName|l]. К утру в церкви [target_location.Custom('LR_GEN')|l] [target_location.GetName] остались лишь голые стены — всё её серебро и священные реликвии оказались в седельных сумках у разбойников. Братья ордена смущённо отводят глаза."
 religious_orders.104.a: "Придётся смириться с потерей."
 religious_orders.104.b: "Братья должны догнать налётчиков!"
 wardens_spoils_recovered_desc: "Братья ордена скачут без отдыха и настигают налётчиков на переправе. Им удаётся отбить у разбойников добычу, и слава об их деяниях расходится по округе"
 wardens_trail_cold_desc: "Братья находят лишь остывшие кострища и отпечатки копыт. Потерянное не вернуть, а позор не смоется ещё долго"
 religious_orders.105.title: "Перо и чернила"
 religious_orders.105.desc: "Никто в наших землях не может сравниться с орденскими братьями по части ведения учётных книг, и им это прекрасно известно. [target_order.GetName] предлагает нам услуги своих писцов, которые в совершенстве владеют счётом и #L [ROOT.GetCountry.GetLiturgicalLanguage.GetName|l]им#! языком. Всё, что им требуется — это скромное жалование и тихое помещение для работы."
 religious_orders.105.a: "Пусть работают над налоговыми записями."
 religious_orders.105.b: "Пусть займутся государственной корреспонденцией."
 religious_orders.106.title: "Сломанная печать"
 religious_orders.106.desc: "Скреплённое нашей печатью письмо ещё не достигло адресата, а [target_order.GetName|l] уже несколько дней обсуждает его содержимое. Похоже, братья, работающие в нашей канцелярии, обладают хорошей памятью… и привычкой болтать без умолку."
 religious_orders.106.a: "Уволим их из канцелярии."
 religious_orders.106.b: "Подсунем им подложные документы."
 religious_orders.106.c: "Придётся смириться."
 confidants_ruse_swallowed_desc: "Поддельные сведения попадают куда надо, а мы тщательно отмечаем, через чьи руки они прошли"
 confidants_ruse_discovered_desc: "Один внимательный брат меньше чем за неделю замечает, что числа не сходятся. Орден не забудет этот обман"
 religious_orders.107.title: "Возвращение в родную гавань"
 religious_orders.107.desc_crews: "Галера орденских братьев, загруженная почти до предела, заходит в гавань. Её палубы полны моряков, снятых с севшего на мель судна. Спасённые наперебой рассказывают, как братья отважно вели корабль через бурю, в которую иной капитан не сунулся бы ни за какие деньги. За [target_order.GetName|l] поднимают тосты во всех портовых тавернах."
 religious_orders.107.desc_charts: "Галера орденских братьев вернулась домой после долгого плавания. [target_order.GetName] доставил в порт исправленные мореходные карты, где рукой капитана отмечены проливы и природные гавани, о которых даже не подозревали наши навигаторы."
 religious_orders.107.desc_relic: "Половина города сбежалась посмотреть, как в порт под всеми знамёнами входит галера орденских братьев. [target_order.GetName] привёз домой реликвию, купленную в далёких краях, и жители стремятся увидеть её хотя бы издали."
 religious_orders.107.a: "Мы встретим их как героев."
 religious_orders.107.b: "Дела ордена нас не касаются."
 religious_orders.108.title: "Пропавшие в море"
 religious_orders.108.desc: "Лучшая галера, которой мог похвастать [target_order.GetName|l], затонула рядом с гаванью, разбившись о песчаную косу во время зимней бури. Все братья на её борту утонули, равно как и навигаторы, обучавшиеся у них годами. В орденских церквях на берегу бьют колокола, однако хоронить некого."
 religious_orders.108.a: "Оплатим из казны ремонт их эскадры."
 religious_orders.108.b: "Море как даёт, так и забирает."
 religious_orders.109.title: "Литургия часов"
 religious_orders.109.desc: "[target_order.GetName] славится своей дисциплиной, его братья днём и ночью проводят службы с незапамятных времён. Они не пропускают ни единого дня, утрени и вечерни проходят в назначенный час как в жару, так и в мороз. Люди говорят, что пока братья продолжают молиться, [ROOT.GetCountry.GetFlavorRank|l] буд[ROOT.GetCountry.Custom('endrank_etut')] жить."
 religious_orders.109.a: "Объявим день благодарения."
 religious_orders.109.b: "Пусть настоятель благословит нас."
 religious_orders.110.title: "Голос из кельи"
 religious_orders.110.desc: "[target_order.GetName] сообщает, что анахорет, последние двадцать лет замурованный в собственной келье, вдруг возопил сквозь оконную щель, будто огонь и мор нависли над нами подобно мечу. Паломники разносят его слова из одного прихода в другой быстрее, чем любой гонец, и с каждым пересказом картина становится всё более пугающей."
 religious_orders.110.a: "Пусть настоятель заставит его замолкнуть."
 religious_orders.110.b: "Пускай вопит сколько влезет."
 doom_talk_fades_desc: "Следующие несколько месяцев вся страна живёт, затаив дыхание. Однако урожай выдаётся богатым, небо на землю не падает, и о пророчестве все скоро забывают"
 dread_takes_hold_desc: "Людей охватывает ужас. Поля стоят в запустении, по дорогам бредут кающиеся грешники, а часовни ордена полны как никогда"
 religious_orders.111.title: "Обретённый список"
 religious_orders.111.desc: "[target_order.GetName] обрёл настоящее сокровище. Реставрируя поеденный жучками псалтирь, братья-монахи из [target_location.Custom('LR_GEN')|l] [target_location.GetName] обнаружили более древний текст, спрятанный в досках старого переплёта, — это список, сделанный столетия назад и считавшийся давно утраченным. Орденский библиотекарь провёл над манускриптом уже несколько бессонных ночей и явно не собирается останавливаться."
 religious_orders.111.a: "Пусть сделают копию для наших учёных мужей."
 religious_orders.111.b: "Манускрипт должен храниться в орденской библиотеке."
 religious_orders.112.title: "Пожар в скриптории"
 religious_orders.112.desc_chronicles: "Непогашенная свеча, внезапный порыв ветра — и к утрене от орденского скриптория в [target_location.Custom('LR_PREP')|l] [target_location.GetName] остались одни угольки. [target_order.GetName] лишился всей своей истории — в пламени сгинули десятилетия хроник, которые братья кропотливо записывали с первых дней существования ордена, а с хрониками сгорели и свидетельства о наших деяниях…"
 religious_orders.112.desc_psalters: "Перед рассветом орденский скрипторий в [target_location.Custom('LR_PREP')|l] [target_location.GetName] сгорел до основания. [target_order.GetName] лишился бесценных псалтирей и антифонариев, которые иллюстрировало несколько поколений художников. Теперь хору придётся петь по памяти, а память, как известно, ненадёжный наставник…"
 religious_orders.112.desc_charters: "Орденский скрипторий в [target_location.Custom('LR_PREP')|l] [target_location.GetName] сгорел этой ночью, вместе с ним погибли расписки и документы на земли и титулы половины округа. Все границы, зафиксированные братьями, теперь станут предметом спора, а мнения заинтересованных сторон редко бывают объективны…"
 religious_orders.112.a: "Мы построим всё заново, полка за полкой."
 religious_orders.112.b: "Пепел напоминает нам о необходимости смирения."
 religious_orders.113.title: "Пашни на месте болот"
 religious_orders.113.desc: "На протяжении трёх зим [target_order.GetName|l] осушал болота рядом со своей мызой возле [target_location.Custom('LR_GEN')|l] [target_location.GetName], и этой весной вода наконец-то ушла. Там, где прежде гнездовались аисты, раскинулись обширные поля чернозёма. Остаётся решить, кому выпадет честь возделывать эти земли…"
 religious_orders.113.a: "Орден может расширить свою мызу."
 religious_orders.113.b: "Отдадим новые пашни нашим крестьянам."
 religious_orders.114.title: "Падёж скота в коровниках"
 religious_orders.114.desc: "[target_order.GetName] сообщает, что в коровниках возле [target_location.Custom('LR_GEN')|l] [target_location.GetName] случился падёж скота. Животные дрожат, опустив головы, пока коновалы спорят друг с другом. Братья хотят знать, что сейчас поможет больше — нож или молитва?"
 religious_orders.114.a: "Забьём и сожжём больных животных."
 religious_orders.114.b: "Доверимся молитве и чистой соломе."
 murrain_passes_over_desc: "Вспышка болезни проходит за месяц. Братья не сомневались, что так и будет, но из вежливости не говорят об этом вслух"
 murrain_spreads_desc: "Болезнь из орденских коровников распространяется на все стада в округе. Богослужения не в силах остановить заразу"
 religious_orders.115.title: "Гром на рыночной площади"
 religious_orders.115.desc: "Трудно сказать, причастен к этому [target_order.GetName|l] или нет, но один из его святых отцов взял за правило проповедовать на рынке [target_location.Custom('LR_GEN')|l] [target_location.GetName] именно в те часы, когда менялы открывают свои лавки. Он ни на кого не указывает в явном виде, но это и не нужно. Толпы бедняков собираются на площади, чтобы послушать его речи, а ростовщики теперь стараются открываться попозже и закрываться пораньше."
 religious_orders.115.a: "Пусть задаст им жару."
 religious_orders.115.b: "Ему стоит быть аккуратнее в своих проповедях."
 religious_orders.116.title: "Проповедник нашёл новую цель"
 religious_orders.116.desc: "Дар, способный собирать площади, столь же легко разрушает репутации. Проповедник ордена из [target_location.Custom('LR_GEN')|l] [target_location.GetName] обратил свой взор на нас. Он старательно перечисляет все наши прегрешения и несправедливые налоги, а собравшаяся толпа хором ведёт им счёт."
 religious_orders.116.a: "Мы ответим на обвинения милосердием."
 religious_orders.116.b: "Взять его прямо во время проповеди!"
 friar_recants_desc: "В темнице проповедник быстро теряет свой пыл и раскаивается при свидетелях. [target_order.GetName] опозорился"
 martyr_of_the_square_desc: "Проповедник идёт в темницу, распевая псалмы. Его самоотверженность не остаётся незамеченной, братья ордена уже называют его мучеником, а горожане с готовностью прислушиваются к их словам"
 religious_orders.117.title: "Колесо подкидышей"
 religious_orders.117.desc: "[target_order.GetName] распорядился вмонтировать в стену своего капитула в [target_location.Custom('LR_PREP')|l] [target_location.GetName] особое поворотное устройство, где матери могут анонимно оставить нежеланных детей. Этим «колесом подкидышей» пользуются чаще, чем горожанам хотелось бы знать, ясли при ордене уже переполнены."
 religious_orders.117.a: "Их благотворительная деятельность достойна восхищения."
 religious_orders.117.b: "Пусть младенцев разберут приходские церкви."
 religious_orders.118.title: "Переполненная лечебница"
 religious_orders.118.desc: "Непрерывный поток путников принёс в [target_location.Custom('LR_ACC')|l] [target_location.GetName] лихоманку, и, как велит обычай, [target_order.GetName|l] приказал распахнуть двери лечебницы для всех страждущих. Больные лежат по двое на койке, а тех, кому не хватило места, укладывают прямо в проходах. Городские врачи считают, что это место превратилось в рассадник заразы."
 religious_orders.118.a: "Заколотим двери лечебницы."
 religious_orders.118.b: "Благотворительность болезней не боится."
 hospice_spared_desc: "Вспышка лихоманки скоро проходит, не выйдя за пределы лечебницы. Орденские монахи доказали эффективность своих правил, хоть и ценой жизни нескольких братьев."
 hospice_fever_spreads_desc: "Словно из лопнувшего гнойника, скопившаяся в лечебнице зараза прорывается наружу. Лихоманка разносится по улицам вместе с исцелившимися и теми, кто пришёл оплакать умерших, поражая квартал за кварталом"
 religious_orders.119.title: "Отпущение для проклятых"
 religious_orders.119.desc: "Война окончилась, но её счета остаются неоплаченными. [target_order.GetName] просит дозволения отправить исповедников в наиболее пострадавшие районы, чтобы люди могли рассказать им то, в чём никогда не признаются соседям, и получили отпущение грехов за поступки, которые никогда не смогут забыть."
 religious_orders.119.a: "Пусть идут в народ."
 religious_orders.119.b: "Сначала им следует позаботиться о нуждах знати."
 religious_orders.120.title: "Индульгенции на продажу"
 religious_orders.120.desc_noble: "[target_order.GetName] снова в центре скандала: один из братьев тайком превратил отпущение грехов в доходное дело. [GetEstateName('nobles_estate')] из одного великого дома могут получить у него прощение даже тех грехов, которые ещё только собираются совершить — и за этим всякий раз следуют щедрые дары. Капитул готов провалиться сквозь землю от стыда, а вот аристократов нисколько не смущает такой поворот событий."
 religious_orders.120.desc_merchant: "[target_order.GetName] снова в центре скандала: один из братьев продаёт отпущение грехов купцам, причём платят они по прейскуранту, как за любой другой товар. [GetEstateName('burghers_estate')] считают, что в добровольно заключённой сделке по справедливой цене нет ничего предосудительного — и это, пожалуй, хуже всего."
 religious_orders.120.desc_prelate: "[target_order.GetName] снова в центре скандала: один из его исповедников склонен накладывать лёгкие епитимьи за самые тяжкие грехи, причём исповедуются ему исключительно служители церкви, чьи многочисленные прегрешения известны каждому их прихожанину. [GetEstateName('clergy_estate')] дают понять, что нам лучше закрыть на это глаза."
 religious_orders.120.a: "Орден должен немедленно выдать исповедника."
 religious_orders.120.b: "Содержание исповеди может осудить лишь Господь."
 religious_orders.201.title: "После кабальгады"
 religious_orders.201.desc: "Братья вернулись из набега с добычей и множеством пленников. Командорство должно решить, как распорядиться этим богатством."
 religious_orders.201.a: "Выставим трофеи напоказ, чтобы сильнее разжечь рвение воинов ордена."
 religious_orders.201.b: "Потратим добытые средства на защиту приграничья."
 religious_orders.202.title: "Опора среди неверных"
 religious_orders.202.desc: "Наши солдаты вырвали [ro_conquest_location.GetName] из рук неверных, и братья [ro_conquest_order.GetName] смотрят на это с намерением. Там, где вера ещё не утвердилась, они желают основать командорство — дом молитвы и меча на новом рубеже, — и просят нашего дозволения на то, чтобы его возвести.​"
 religious_orders.202.a: "Позволить им возвести командорство."
 religious_orders.202.b: "Этот рубеж им пока не по силам."
