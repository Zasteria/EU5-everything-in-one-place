l_russian:
 shurat: "Аш-Шурат"
 ibadi_events.1.title: "Рустамидское наследие"
 ibadi_events.1.desc: "$legacy_of_rustamids_desc$\n\nВозродив традиции имамата древности, [target_character.GetName] становится первым #TOOLTIP:POLICY,ibadi_zuhur_imam_policy,X #L имамом аз-зухур#!#! в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#!. Верующим больше не придётся жить при #TOOLTIP:POLICY,ibadi_kitman_imam_policy,X #L китмане#!#!."
 ibadi_events.1.a: "Наступает новая эра."
 ibadi_events.1.b: "Воистину, [ROOT.GetCountry.GetReligion.GetGodName] улыбается нам."
 may_adopt_a_different_color: "Мы можем выбрать цветом нашей державы #Y тёмно-синий#!"
 rustamids_adopt_different_color: "Мы выбрали цветом нашей державы #Y тёмно-синий#!"
 ibadi_events.2.title: "Слабый имам"
 ibadi_events.2.desc: "[target_estate.GetName|U] недовольны тем, как правит [target_character.GetName], [ShowPolicyName('ibadi_daif_imam_policy')|l]. С властью слабого имама можно мириться только во времена кризиса, а в данное время #TOOLTIP:RELIGION,$ibadi_tt$,X #L ибадитам#!#! #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! ничто не угрожает."
 ibadi_events.2.a: "Нам нужен более достойный лидер."
 ibadi_weak_imam_penalty_tt: "[ShowPolicyName('ibadi_daif_imam_policy')] будет давать постепенно возрастающие штрафы, пока мы не сменим [Concept('ruler', 'правителя')|e] и не провозгласим [ShowGenericActionName('return_to_zuhur_imamate')|l]"
 has_penalty_for_weak_imam: "Требования больше не выполняются, и началось [Concept('event', 'событие')|e] #Y «$ibadi_events.2.title$»#!"
