l_russian:
 western_schism.1.title: "Раскол в католической церкви"
 western_schism.1.desc: "#TOOLTIP:RELIGION,$catholic_tt$,X #L Католичество#!#! переживает раскол, и в курии разразилась фракционная борьба.\n\nНам не привыкать к противоречиям в церкви, но на этот раз их причины иные. Когда умер последний [GetInternationalOrganization('catholic_church').GetLeaderTitle], #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянские#!#! кардиналы решили воплотить мечту, которую лелеяли с тех самых пор, как институт папства перешёл под контроль #TOOLTIP:CULTUREGROUP,french_group,X #L французов#!#!, и выступили за возвращение Святого Престола в распоряжение Италии. Кардиналам противостоят французские священнослужители: они настаивают на том, чтобы [GetInternationalOrganization('catholic_church').GetLeaderTitle] оставался под их контролем. Из-за несовместимости позиций этих двух групп католический мир быстро погружается в состояние внутренней вражды, и благочестивые #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католики#!#! остаются без духовных пастырей. До тех пор, пока конфликт не утихнет, им придётся жить без опоры на привычные авторитеты и самостоятельно решать, кто является истинным проводником божественной воли."
 western_schism.1.a: "Плохи дела."
 western_schism.3.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] недовольны расколом"
 western_schism.3.desc: "Мы до сих пор не выбрали, кто нам больше импонирует: [target_schism_pope_cardinal.GetName] или [target_schism_opponent_cardinal.GetName]. Наши кардиналы настоятельно просят нас поторопиться с принятием решения."
 western_schism.3.a: "С этим решением можно повременить…"
 western_schism.4.title: "[jan_hus.GetNameWithNoTooltip]"
 western_schism.4.desc: "В самом сердце области [ROOT.GetCountry.GetCapital.GetArea.GetName] разгорается пламя религиозного инакомыслия, раздуваемое сильными ветрами перемен. [jan_hus.GetName] — харизматичный #TOOLTIP:CULTURE,$czech_tt$,X #L чешский#!#! священник и учёный — выступает против коррупции, в которой якобы погрязла #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католическая церковь#!#!. Его слова находят отклик в сердцах простого народа, и приверженцев #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситск#!#! веры становится всё больше.\n\n[jan_hus.GetNameWithNoTooltip] осуждает роскошь и излишества, присущие католичеству, и призывает вернуться к простоте и чистоте раннего христианства. Его последователи, известные как гуситы, принимают его учение, и их рвение растёт с каждым днём. Своими проповедями [jan_hus.GetLastNameWithNoTooltip] подрывает авторитет, которым пользуется католическая церковь и #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священная Римская империя#!#!, изменяя тем самым устоявшийся порядок."
 western_schism.4.historical_info: "Ян Гус, также известный как Иоганн Гус, — знаменитый теолог, философ и один из первых реформаторов католицизма. Он стоял у истоков гуситской веры, предшестовавшей лютеранству. Гус рос в бедной семье, и родители отправили его в монастырь, чтобы открыть сыну путь к лучшему будущему. Во время службы он выступал против пороков католической церкви в Богемии. Когда папой был избран Александр V, он издал буллу об отлучении от церкви непокорного священника. Уже после Великого западного раскола Гус был вызван на собор в Констанце, чтобы защищать свои взгляды, но был немедленно арестован и брошен в тюрьму. Он не отрёкся от своих идей и 6 июля 1415 года был сожжён на костре за ересь. Его последователи основали новую религию и несколько десятков лет ожесточённо воевали с католиками, организовавшими против них пять крестовых походов. Гуситская вера просуществовала в Богемии почти два столетия."
 western_schism.4.a: "В его учении что-то есть…"
 western_schism.5.title: "Утрата веры"
 western_schism.5.desc: "[target_schism_pope_cardinal.GetName] и [target_schism_opponent_cardinal.GetName] развязали острый конфликт, который подрывает стабильность ряда держав, включая нашу. Будущее Святого престола стоит под вопросом, что вызывает сомнения относительно правильного порядка проведения церковной службы и подрывает религиозную веру народа."
 western_schism.5.a: "Мы будем молиться о скорейшем прекращении этих распрей."
 western_schism.5.b: "Возможно, нашему народу стоит поискать альтернативу."
 western_schism.6.title: "[opponent_support_location.GetNameWithNoTooltip] и [pope_support_location.GetNameWithNoTooltip] в состоянии вражды"
 western_schism.6.desc: "[target_schism_opponent_cardinal.GetName] пользуется поддержкой [opponent_support_location.Custom('LR_GEN')|l] [opponent_support_location.GetName], тогда как [target_schism_pope_cardinal.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale,'заручилась', 'заручился')] доверием [pope_support_location.Custom('LR_GEN')|l] [pope_support_location.GetName]. Недавно между жителями этих городов разразился скандал, и теперь они требуют, чтобы [target_ruler.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale,'заняла', 'занял')] свою сторону в этом споре."
 western_schism.6.a: "Жители [opponent_support_location.Custom('LR_GEN')|l] [opponent_support_location.GetName] однозначно правы."
 western_schism.6.b: "Поддержим население [pope_support_location.Custom('LR_GEN')|l] [pope_support_location.GetName]."
 western_schism.6.c: "Пусть сами улаживают свои глупые разногласия."
 western_schism_resolution_impact_positive.tt: "Выбранная сторона получит долю поддержки в Великом западном расколе."
 western_schism_resolution_impact_negative.tt: "Выбранная сторона лишится доли поддержки в Великом западном расколе."
 western_schism.7.title: "Развитие торговли в Италии"
 western_schism.7.desc: "Своими усилиями [target_schism_pope_cardinal.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale,'смогла', 'смог')] обеспечить развитие и процветание торговли в #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] весьма рады таким переменам, поскольку они полностью соответствуют их интересам."
 western_schism.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 italian_trade: "Связи с Италией"
 western_schism_8_10_common_string: "Наша позиция относительно #TOOLTIP:SITUATION,western_schism,X #L Великого западного раскола#!#! привела к волнениям в некоторых частях нашей страны. Жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] начали вооружаться и требовать, чтобы мы признали, что"
 western_schism.8.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] пользуется народной поддержкой"
 western_schism.8.desc: "$western_schism_8_10_common_string$ именно [target_schism_opponent_cardinal.GetName] — единственный законный папа."
 western_schism.8.a: "Мы не станем поддаваться таким наглым требованиям."
 western_schism.8.b: "Возможно, [target_schism_opponent_cardinal.GetNameWithNoTooltip] действительно лучше подходит на эту роль."
 western_schism.9.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] ценит верность"
 western_schism.9.desc: "Истинный [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] [target_schism_opponent_cardinal.GetName], которому подчиняется #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католическая церковь#!#!, предоставил нашим священникам особые права в награду за нашу преданность."
 western_schism.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.10.title: "[target_schism_pope_cardinal.GetNameWithNoTooltip] пользуется народной поддержкой"
 western_schism.10.desc: "$western_schism_8_10_common_string$ именно [target_schism_pope_cardinal.GetName] — единственный законный папа."
 western_schism.10.a: "Если они хотят бунтовать — пусть попробуют."
 western_schism.10.b: "Их аргументы звучат убедительно."
 western_schism_11_12_common_string: "пользуется большой поддержкой #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!. [target_country.GetAdjectiveWithNoTooltip]ие власти публично выражают своё восхищение нашей стойкостью и непоколебимой верой, столь редкой в эти смутные времена.\n\nРазумеется, эти сладкие речи преследуют лишь одну цель — заручиться дальнейшей поддержкой #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Тем не менее мы сможем извлечь пользу из их похвалы — особенно если"
 western_schism_11_12_common_string_2: "с нашей помощью выйдет из противостояния победителем. Кроме того, она станет сильным козырем, чтобы продавить наши собственные интересы в католической церкви…"
 western_schism.11.title: "[target_country.GetAdjectiveWithNoTooltip]ие власти благодарят нас за поддержку"
 western_schism.11.desc: "В борьбе за верховенство над #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католической церковью#!#! [target_schism_pope_cardinal.GetName] $western_schism_11_12_common_string$ [target_schism_pope_cardinal.GetNameWithNoTooltip] $western_schism_11_12_common_string_2$"
 western_schism.11.a: "[target_schism_pope_cardinal.GetNameWithNoTooltip] — вот истинный [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
 western_schism.11.b: "Мы используем похвалу [target_country.Custom('CL_GEN')], чтобы повлиять на церковь."
 western_schism.12.desc: "В борьбе за верховенство над #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католической церковью#!#! [target_schism_opponent_cardinal.GetName] $western_schism_11_12_common_string$ [target_schism_opponent_cardinal.GetNameWithNoTooltip] $western_schism_11_12_common_string_2$"
 western_schism.12.a: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] — вот истинный [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
 western_schism_13_14_common_string: "наиболее достойная кандидатура на должность предстоятеля #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католической церкви#!#!. К несчастью, другие сословия с ними решительно не согласны. Раскол, поразивший церковь, грозит разделить и нашу державу, и мы должны действовать предельно осторожно, чтобы не усугубить сословный конфликт."
 western_schism.13.title: "Вопреки всему"
 western_schism.13.desc: "Богобоязненные [target_estate.GetName|l] нашей страны убеждены, что [target_schism_pope_cardinal.GetName] — $western_schism_13_14_common_string$"
 western_schism.13.a: "[target_estate.GetNameWithNoTooltip] правы."
 western_schism.13.b: "Мы согласны с большинством."
 western_schism.14.desc: "Богобоязненные [target_estate.GetName|l] нашей страны убеждены, что [target_schism_opponent_cardinal.GetName] — $western_schism_13_14_common_string$"
 western_schism.15.title: "[Select_CString(target_character.IsFemale, 'Бродячая проповедница', 'Бродячий проповедник' )]"
 western_schism.15.desc: "#TOOLTIP:SITUATION,western_schism,X #L Великий западный раскол#!#! подорвал авторитет церкви и всерьёз пошатнул веру наших подданных. [unrest_location_scope.GetName] — здесь это проявляется особенно ярко. [Select_CString(target_character.IsFemale, 'Новая проповедница', 'Новый проповедник')] по имени [target_character.GetName] будоражит и без того заблудший народ, внушая публике еретические воззрения и обвиняя церковь во всех грехах. [target_character.GetShortNameWithNoTooltip] утверждает, что [Select_CString(target_character.IsFemale, 'она истинная поборница', 'он истинный поборник' )] #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ой#! веры, однако [Select_CString(target_character.IsFemale, 'её', 'его' )] проповеди наводят некоторых местных жителей на опасные мысли. Мы должны действовать быстро, чтобы остановить эту ересь."
 western_schism.15.a: "[Select_CString(target_character.IsFemale, 'Она', 'Он' )] не так уж [Select_CString(target_character.IsFemale, 'далека', 'далёк' )] от истины."
 western_schism.15.b: "Мы не можем позволить [Select_CString(target_character.IsFemale, 'ей', 'ему' )] будоражить людей."
 western_schism.1000.title: "Цена покорности"
 western_schism_action_event_tt: "Мы попросим одного из кандидатов оказать нам денежную помощь."
 western_schism.1001.desc: "[target.GetGovernment.GetRuler.GetName] достойно [Select_CString(target.GetGovernment.GetRuler.IsFemale, 'отблагодарила', 'отблагодарил' )] нас за верность — как того и заслуживает столь могущественная и влиятельная держава, как [ROOT.GetCountry.GetName]. Получив нашу поддержку, [target.GetName] вне всякого сомнения сможет возглавить #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католическую церковь#!#!."
 western_schism.1001.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.1002.desc: "[target.GetGovernment.GetRuler.GetName] [Select_CString(target.GetGovernment.GetRuler.IsFemale, 'презрела', 'презрел' )] протянутую нами руку и [Select_CString(target.GetGovernment.GetRuler.IsFemale, 'отказала', 'отказал' )] нам в должном уважении. Разумеется, [ROOT.GetCountry.GetName] не потерпит подобного отношения и переосмыслит свои приоритеты."
 western_schism.1002.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 western_schism.1100.title: "Обманчивая поддержка [target_country.Custom('CL_GEN')]"
 western_schism.1100.desc: "Наши отношения с #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и без того были довольно натянутыми, а из-за #TOOLTIP:SITUATION,western_schism,X #L Великого западного раскола#!#! они испортились окончательно. И хотя наше влияние на #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католическую церковь#!#! далеко не безгранично, мы можем воспользоваться им, чтобы склонить чашу весов в свою пользу."
 western_schism.1100.a: "Нам нужно больше влияния!"
 western_schism.1100.b: "Не стоит обзаводиться новыми врагами."
 western_schism.1101.title: "Тяжкое оскорбление"
 western_schism.1101.desc: "Лживые и беспринципные посланники #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_GEN')|L]#!#! стараются уменьшить наше влияние на #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католическую церковь#!#!! Мы не потерпим подобного отношения. Пора напомнить негодяям их место!"
 western_schism.1101.a: "[ROOT.GetCountry.Custom('common_string_we_must_do_something')]"
 western_schism.1200.title: "Сомнительные действия [target_country.Custom('CL_GEN')]"
 western_schism.1200.desc: "#TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католический#!#! мир охвачен хаосом из-за непрекращающегося #TOOLTIP:SITUATION,western_schism,X #L Великого западного раскола#!#!. В самом деле, когда к Святому Престолу рвётся ложный [GetInternationalOrganization('catholic_church').GetLeaderTitle|l], это может поколебать даже самую истовую веру. Недавно [target_ruler.GetName], [target_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_ruler.IsFemale, 'оказалась замешана', 'оказался замешан' )] в одном дипломатическом инциденте, из которого можно предположить, что [Select_CString(target_ruler.IsFemale, 'она', 'он' )] втайне поддерживает ложного претендента. Нам следует отправить в [target_country.Custom('CL_ACC')] делегацию, чтобы выяснить [Select_CString(target_ruler.IsFemale, 'её', 'его' )] истинные намерения и убедиться, что [target_country.GetGovernment.GetRulerTitle|l] не [Select_CString(target_ruler.IsFemale, 'сбилась', 'сбился' )] с истинного пути."
 western_schism.1200.a: "Делегация отправится в [target_country.Custom('CL_ACC')]."
 western_schism.1200.b: "У нас полно других забот."
 western_schism.1201.title: "Папская делегация"
 western_schism.1201.desc: "[target_schism_pope_cardinal.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale, 'прислала', 'прислал' )] к нашему двору своего посланника. Мы пока не знаем, в чём состоит цель этого визита, но [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] наверняка рассчитывает, что легата примут как официального представителя #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католической церкви#!#! — и ему наверняка поручено узнать, какую позицию мы занимаем в отношении #TOOLTIP:SITUATION,western_schism,X #L Великого западного раскола#!#!. И пусть мы не вправе указать легату на дверь, по крайней мере мы можем открыто заявить о том, на чьей мы стороне."
 western_schism.1201.a: "Разумеется, [target_schism_pope_cardinal.GetNameWithNoTooltip] — истинный [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]."
 western_schism.1201.b: "Наш кандидат — [target_schism_opponent_cardinal.GetNameWithNoTooltip]."
 western_schism.1300.title: "Созыв собора"
 western_schism.1300.desc: "Наше положение в курии сейчас весьма благоприятно: у нас достаточно сторонников, чтобы можно было созвать собор в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. И хотя #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католическая церковь#!#! наверняка будет сомневаться в законности подобного собора, главное — с его заявлениями согласятся наши последователи, тем самым продемонстрировав кардиналам наше влияние. Мы не в силах положить конец #TOOLTIP:SITUATION,western_schism,X #L Великому западному расколу#!#!, но собор, на котором [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] явит остальным свой авторитет, станет важным шагом к разрешению конфликта в нашу пользу."
 western_schism.1300.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.1300.a.tt: "Каждая страна, исповедующая #L [THIS.GetReligion.GetAdjective|l]ую#! веру, получает [ShowBiasValue('schism_called_council')|+=0] к мнению о #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!"
 western_schism.1301.title: "Собор [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 western_schism.1301.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] нашей державы принимает у себя дипломатов из #ONCLICK:COUNTRY,[council_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[council_country.Custom('CL_tt')],X [council_country.Custom('CL_GEN')|L]#!#!. Они прибыли в нашу державу с призывом: все [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] должны отправиться на собор в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. И хотя противники этого мероприятия уже сомневаются в законности нового собора, нельзя исключать, что на нём будет сделан большой шаг к окончанию #TOOLTIP:SITUATION,western_schism,X #L Великого западного раскола#!#!."
 western_schism.1301.a: "Выразим поддержку и отправимся на собор."
 western_schism.1301.b: "Нужно будет признать авторитет собор."
 western_schism.1301.c: "Какая дерзость! Мы отказываемся слушать этих самозванцев."
 western_schism.2000.title: "Католическая церковь снова едина!"
 western_schism.2000.desc: "Благодаря усилиям #ONCLICK:COUNTRY,[winner_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[winner_country.Custom('CL_tt')],X [winner_country.Custom('CL_GEN')|L]#!#! собор наконец-то покончил с Великим западным расколом. На престол святого Петра восходит [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] новой эпохи. #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католическая церковь#!#! сумела восстановить единство, хотя авторитет папской власти был основательно подорван. Остаётся надеяться, что ущерб, нанесённый нашей вере, не окажется непоправимым, а [target_character.GetName] проявит себя [Select_CString(target_character.IsFemale, 'достойной', 'достойным' )] титула «[GetInternationalOrganization('catholic_church').GetLeaderTitle|l]»."
 western_schism.2000.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.2100.title: "Новый [GetInternationalOrganization('catholic_church').GetLeaderTitle] для церкви"
 western_schism.2100.desc.common: "После настойчивых попыток положить на соборе конец #TOOLTIP:SITUATION,western_schism,X #L Великому западному расколу#!#! нам окончательно стало понятно, что наш кандидат — единственный человек, безусловно имеющий право носить титул «[GetInternationalOrganization('catholic_church').GetLeaderTitle|l]». И хотя некоторые до сих пор занимают сторону еретика и самозванца, нас всё-таки поддерживает достаточно сторонников, чтобы #TOOLTIP:SITUATION,western_schism,X #L Великий западный раскол#!#! можно было смело объявить пережитком прошлого."
 western_schism.2100.desc.a: "$western_schism.2100.desc.common$\n\nС той поддержкой, которой мы сумели заручиться, мы без труда найдём подходящего кандидата из наших собственных рядов и вернём папский авторитет вечному городу #TOOLTIP:LOCATION,rome,X #L Риму#!#!."
 western_schism.2100.desc.b: "$western_schism.2100.desc.common$\n\nБлагодаря нашему влиянию в курии, мы сможем сохранить устоявшуюся традицию папства в #TOOLTIP:LOCATION,avignon,X #L Авиньоне#!#!."
 western_schism.2100.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.20.title: "Два епископа — один престол"
 western_schism.20.desc: "В нашей державе идёт нешуточная борьба за епископство. Освободившийся престол едва успел остыть, как права на него заявили сразу двое претендентов: один из них — с римской печатью, второй — с печатью от другого папы. Каждый из них угрожает другому #R отлучением#! от церкви, и каждый требует от нас признать его. Тем временем у епархии до сих пор нет главы; священники не знают, что делать, и все ждут, когда [ROOT.GetCountry.GetGovernment.GetRuler.GetName] наконец укажет им истинного пастыря."
 western_schism.20.a: "Престол принадлежит посланцу Рима."
 western_schism.20.b: "Престол принадлежит второму посланцу."
 western_schism.20.c: "Пусть спорят; деньги будут идти нам."
 western_schism.21.title: "Отказ от повиновения"
 western_schism.21.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'получила', 'получил' )] от правоведов и наставников религиозных школ дерзкий совет: не признавать #Y ни одного#! из претендентов до тех пор, пока тиара не отойдёт окончательно кому-либо одному из них, а христианский мир не воссоединится. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] в ужасе от подобного предложения; королевские казначеи же тихо радуются: это значит, что им не придётся выплачивать лишние поборы."
 western_schism.21.a: "Мы не станем признавать папу, пока церковь не воссоединится."
 western_schism.21.b: "Мы останемся верны церкви."
 western_schism.22.title: "Соперничающие сборщики аннатов"
 western_schism.22.desc: "С разницей в несколько дней к нам прибыли сборщики налогов от обоих пап, вооружённые каждый своим подтверждающим полномочия письмом с хозяйской печатью. Оба потребовали от нас выплатить с каждого бенефиция в державе причитающиеся им — а вернее, истинному папе — #Y аннаты#!, то есть получаемые церковниками доходы за первый год службы. Они бросают друг на друга презрительные взгляды: каждый хочет примериться к нашей казне."
 western_schism.22.a: "Рим получит причитающееся."
 western_schism.22.b: "Заплатим представителю второго претендента."
 western_schism.22.c: "Отправим обоих восвояси. Деньги останутся у нас."
 western_schism.23.title: "Провозглашение Юбилея"
 western_schism.23.desc: "Один из пап провозгласил #Y Юбилейный год#!, пообещав полное отпущение грехов всякому паломнику, который придёт поклониться мощам апостолов. Другой папа объявил, что это — не более чем попытка облапошить верующих и заставить их расстаться с серебром. Народ, впрочем, уже начинает собираться в дорогу и просить у нас благословения."
 western_schism.23.a: "Ступайте, верующие. Да будут милостивы к вам небеса."
 western_schism.23.b: "Это не благо, а обман. Никто никуда не пойдёт."
 western_schism.24.title: "Торговцы индульгенциями"
 western_schism.24.desc: "На наших рынках толпами собираются продавцы индульгенций — бумаг с печатями того или иного папы. Каждый из них громко заверяет, что именно его индульгенция и никакая иная позволит свободно войти в рай. Простой народ послушно скупает у них бумаги, однако у каждого на сердце тяжёлым грузом лежит мысль: разве можно продавать спасение, словно на торгах, и разве может церковь с двумя главами договориться, какой именно ключ подойдёт к замку?"
 western_schism.24.a: "Выдать им разрешения на торговлю в обмен на долю с продаж."
 western_schism.24.b: "Прогнать этих мошенников с улиц."
 western_schism.25.title: "Проповедник последних дней"
 western_schism.25.desc: "По городам и весям нашей державы странствует сухощавая фигура во власянице — [apocalyptic_preacher.GetName]. Этот человек неизменно собирает около себя толпы, жадно внимающие каждому [Select_CString(apocalyptic_preacher.IsFemale, 'её', 'его' )] слову. Церковь с двумя главами, утверждает [Select_CString(apocalyptic_preacher.IsFemale, 'она', 'он' )], — это верный знак конца света, и только #Y кара небесная#! может спасти державу от заблудших церковников. Возрыдавшие крестьяне, сбросив обувь, идут за [Select_CString(apocalyptic_preacher.IsFemale, 'проповедницей', 'проповедником' )], а наши [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] взирают на происходящее с тревогой."
 western_schism.25.a: "Пусть проповедует. Людям нужна надежда."
 western_schism.25.a.tt: "#Y [apocalyptic_preacher.GetName]#! будет проповедовать дальше. Со временем мы можем утратить контроль над происходящим."
 western_schism.25.b: "Немедленно положить конец этим богохульным речам!"
 western_schism.26.title: "Радикальные флагелланты"
 western_schism.26.desc: "Движение кающихся превратилось в бунт: последователи, которых ведёт за собой [apocalyptic_preacher.GetName], хлещут себя до крови на глазах у народа и прилюдно вопят, что каждый священник — слуга Антихриста, а каждый папа — мошенник. Бичующиеся больше не повинуются нашим приказам; на дорогах — толпы безумцев с дикими глазами и плётками."
 western_schism.26.a: "Сокрушить их, чего бы это ни стоило."
 western_schism.26.b: "Обернуть их ярость против лжепапы."
 western_schism.27.title: "Дрогнувший кардинал"
 western_schism.27.desc: "Соперничающая курия втайне от всех пытается переманить на свою сторону одного из наших кардиналов: престол, который ему обещают, куда ценнее любых наших подарков. Сам кардинал пока ещё не объявил о своём решении, однако, судя по уклончивому тону в переписке, его верность всё-таки можно купить. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] решить, стоит ли она затрат."
 western_schism.27.a: "Выкупить его совесть, пока он не расстался с ней окончательно."
 western_schism.27.b: "Пусть уходит. Человек, которого можно купить, ничего не стоит."
 western_schism.28.title: "Письмо от святой"
 western_schism.28.desc: "Наш двор получил письмо от святой, пользующейся в народе глубочайшим уважением за снисходящие на неё видения. В письме она в самых убедительных выражениях призывает нас занять сторону единственно достойного римского понтифика и заодно склонить к этому же кардиналов. Переписанное много раз письмо стремительно распространяется среди верующих, и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] томятся в ожидании того, какое решение примет [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 western_schism.28.a: "Святая говорит истину. Пусть к нам прислушается весь христианский мир!"
 western_schism.28.b: "Мы не пойдём на поводу у каких-то видений."
 western_schism.29.title: "Щедрость курии"
 western_schism.29.desc: "Избранный нами папа желает сохранить верность своих кардиналов, а потому щедро осыпает наш двор подарками: мощами в позолоченных реликвариях, многочисленными диспенсациями и золотом — настолько обильно, что вопросы возникли бы у кого угодно. В письмах к нам он расточает благодарность, но одновременно намекает на определённые ожидания от нас. Если мы согласимся им следовать, власть папы над нами укрепится. Отказ же будет равнозначен открытому обвинению папы в #R святокупстве#!."
 western_schism.29.a: "Принять его подарки — и укрепить связующие нас узы."
 western_schism.29.b: "Симония — это грех. Мы отказываемся."
 western_schism.30.title: "Дебаты докторов"
 western_schism.30.desc: "Между заведующими кафедрой богословия в нашем университете пролегла пропасть. Причиной разногласий стал непростой — и опасный — вопрос: может ли #Y всеобщий собор#! осудить папу и сместить его ради блага церкви? Доктора помоложе утверждают, что нет других способов преодолеть раскол; старшие наставники же уверены, что такой поступок станет для всех проклятием. Обе стороны ждут, что [ROOT.GetCountry.GetGovernment.GetRuler.GetName] уладит этот спор."
 western_schism.30.a: "Собор может осудить кого угодно — даже папу. Пусть так и будет."
 western_schism.30.b: "Это ересь! Её следует единогласно осудить."
 western_schism.31.title: "За кем пойдут кардиналы?"
 western_schism.31.desc: "Кардиналы седлают мулов, собираясь на консисторию. Перед отъездом остаётся выяснить лишь одно: какие указания даст им [ROOT.GetCountry.GetGovernment.GetRuler.GetName], поскольку до сих пор непонятно, чью сторону должны занять наши церковные мужи. День ото дня раскол между церквями лишь углубляется, напряжение растёт, и соблазн просто промолчать становится только сильнее."
 western_schism.31.a: "Подчинитесь Риму — городу апостола."
 western_schism.31.b: "Подчинитесь другому претенденту — церкви нужна реформа."
 western_schism.31.c: "Пусть каждый поступает так, как ему велит совесть."
 western_schism.32.title: "Пустующая казна Рима"
 western_schism.32.desc: "Сундуки города Святого Петра пусты. Оставшиеся без жалования кардиналы меряют шагами коридоры, ворча себе под нос, в то время как другая курия в Авиньоне устраивает на десятины с половины христианского мира щедрые пиры и обряжается в шелка. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] опасается, что слуги Рима, недовольные своей бедностью, могут безвозвратно покинуть город."
 western_schism.32.a: "Продавайте должности. Рим не будет попрошайничать."
 western_schism.32.b: "Попросим помощи у лояльных князей."
 western_schism.33.title: "Римская толпа"
 western_schism.33.desc: "Народ Рима заполонил улицы, от шума ходят ходуном все окна во дворце: собравшиеся кричат, что папство #Y должно оставаться итальянским#! и горе тому кардиналу, который задумает вновь перенести его во Францию. Толпа угрожающе смотрит на курию, и [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] выбрать между яростью толпы и достоинством церкви."
 western_schism.33.a: "Склонимся перед волей народа Рима."
 western_schism.33.b: "Очистим улицы и восстановим порядок."
 western_schism.34.title: "Взаимное отлучение"
 western_schism.34.desc: "К нам пришли вести сразу из обеих курий: каждый папа торжественно #R отлучил#! другого, а также каждого князя, священника и крестьянина, посмевшего пойти не за тем пастырем. Наш народ в ужасе крестится, шепча, что они обречены независимо от своего выбора, и что в целой половине христианского мира таинства церкви утратили смысл."
 western_schism.34.a: "Успокоим их грандиозной религиозной церемонией."
 western_schism.34.b: "Страх — это рычаг. Воспользуемся им, чтобы отнять золото у церкви."
 western_schism.35.title: "Реликвия сомнительной подлинности"
 western_schism.35.desc: "Расположенный на наших землях монастырь обнаружил некую реликвию и заверяет, что она благословит того папу, который является законным викарием Христа. Паломники уже толпятся у ворот. Соперничающие священники кричат о #R подлоге#! и требуют сжечь реликвию. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] решить, сделать это чудо знаменем нашей веры или позволить богословам хладнокровно препарировать этот артефакт."
 western_schism.35.a: "Это дар небес, и его нужно почитать."
 western_schism.35.b: "Пусть учёные мужи поближе изучат это «чудо»."
 western_schism.36.title: "Наёмники для курии"
 western_schism.36.desc: "Мы получили полное отчаяния письмо, скреплённое печатью выбранного нами папы: он умоляет прислать оружие, людей и деньги, чтобы силой вырвать Папскую Область из рук самозванца, поскольку слова и голоса оказались бессильны. Отряд закалённых копьеносцев готов выдвинуться, если [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] заплатит им из своей казны."
 western_schism.36.a: "Отправим отряд. Наш папа получит солдат."
 western_schism.36.b: "Он подождёт, у нас хватает своих войн."
 western_schism.37.title: "Нейтральный князь"
 western_schism.37.desc: "Наши хитроумнейшие советники, придвинувшись поближе, дают умный совет: можно не поддержать ни одного из пап, но предложить им обоим нашу верность, чтобы они попытались переманить нас золотом и привилегиями. Такое решение озолотит нас, но верующие не зря всюду говорят, что без доверия не стоит ждать любви."
 western_schism.37.a: "Пообещаем всем, не поддержим никого и наживёмся на обоих."
 western_schism.37.b: "Мы не двурушники. Выберем папу."
 western_schism.38.title: "Слухи о большом соборе"
 western_schism.38.desc: "Смелые слухи разносятся по всему христианскому миру: кардиналы #Y обеих#! сторон, устав от скандала, могут созвать большой собор, чтобы осудить соперничающих пап и одним махом свергнуть обоих. Для кого-то это единственное мирное решение, другие видят в этом ересь, ибо кто может быть выше викария Христа? [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] выбрать сторону ещё до начала собора."
 western_schism.38.a: "Собор может быть нашим единственным шансом на мир. Поддержим его."
 western_schism.38.b: "Ни один собор не может быть выше викария Христа. Осудим его."
 western_schism.39.title: "Третий претендент"
 western_schism.39.desc: "Произошло немыслимое. Совет кардиналов объявил о смещении обоих пап и #Y избрал третьего#!, чтобы устранить раскол. Теперь у христианства целых три отца и ни одного главы. Ни один из старых пап не желает уступать свой престол, и каждый европейский двор должен вновь задаться вопросом, где же находиться истинная церковь Христа."
 western_schism.39.a: "Собор вынес решение. Мы признаем избранного папу."
 western_schism.39.b: "Мы останемся с тем папой, которого уже знаем."
 western_schism.2200.desc: "Ещё один шаг, и мы придём к простому, но элегантному решению проблем, вызванных #TOOLTIP:SITUATION,western_schism,X #L Великим западным расколом#!#!. Если мы принудим обе стороны отказаться от претензий на Святой Престол и объявим новые выборы, мы добьёмся того, что во главе церкви вновь будет стоять легитимный носитель титула «[GetInternationalOrganization('catholic_church').GetLeaderTitle|l]», и сможем наконец заняться восстановлением разрушений, полученных в эти времена раздора. [GetInternationalOrganization('catholic_church').GetLeaderTitle|U], несомненно, достойно справится с задачей объединения разобщённых священников и закрепления истинного вероучения."
 western_schism.2000.desc.unresolved: "Не удалось созвать Собор для разрешения этого вопроса, и соперничающие притязания угасли из-за отсутствия поддержки. [ShowSituationName('western_schism')] завершается, и ни один из кандидатов не признан законным [GetInternationalOrganization('catholic_church').GetLeaderTitle], а [GetInternationalOrganization('catholic_church').GetName] остаётся с сильно подорванным авторитетом этой должности. Будем надеяться, что это не нанесло непоправимого урона нашей вере."
 western_schism.2000.title.unresolved: "Раскол сходит на нет"
