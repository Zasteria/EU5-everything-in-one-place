l_russian:
 nanbokuchou.1.title: "$nanbokuchou$"
 nanbokuchou.1.desc.common: "Наступил период неопределённости. За власть в стране борются [target_koumyou.GetName] из #L [GetCountry('NTC').GetAdjective|l]ого#! рода с резиденцией в городе [GetCountry('NTC').GetCapital.GetName] и [target_go_daigo.GetName] из #L [GetCountry('STC').GetAdjective|l]ого#! рода с центром в городе [GetCountry('STC').GetCapital.GetName] — претенденты на Хризантемовый трон."
 nanbokuchou.1.desc.north: "$nanbokuchou.1.desc.common$\n\nС тех пор как [target_go_daigo.GetNameWithNoTooltip] [Select_CString(target_go_daigo.IsFemale, 'сбежала', 'сбежал' )] из #ONCLICK:COUNTRY,[target_ashikaga.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_ashikaga.Custom('CL_tt')],X [target_ashikaga.Custom('CL_GEN')|L]#!#! и [Select_CString(target_go_daigo.IsFemale, 'уединилась', 'уединился' )] в [ShowLocationNameWithNoTooltip('yoshino')], [Select_CString(target_go_daigo.IsFemale, 'она стала', 'он стал' )] настоящей головной болью для #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X #L Японского сёгуната#!#!."
 nanbokuchou.1.desc.south: "$nanbokuchou.1.desc.common$\n\nИмператор [target_go_daigo.GetNameWithNoTooltip] был вынужден бежать из #ONCLICK:COUNTRY,[target_ashikaga.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_ashikaga.Custom('CL_tt')],X [target_ashikaga.Custom('CL_GEN')|L]#!#!. Вместо него державой теперь правит [target_koumyou.GetNameWithNoTooltip]."
 nanbokuchou.1.desc.neutral: "$nanbokuchou.1.desc.common$\n\nОба императора пользуются поддержкой, и конфликт между этими группами — лишь вопрос времени. Пока их силы равны, но чаша весов легко может склониться в одну или другую сторону. Сейчас мы сохраняем нейтралитет, хотя в любой момент можем поддержать один из лагерей."
 nanbokuchou.1.a: "Наша позиция непоколебима."
 nanbokuchou.1.b: "Похоже, нам выгоднее перейти на другую сторону."
 nanbokuchou.1.c: "Лучше никому не присягать."
 nanbokuchou.1.d: "[GetCountry('NTC').GetLongNameWithNoTooltip] — мы поддержим эту державу с центром в городе [GetCountry('NTC').GetCapital.GetNameWithNoTooltip]."
 nanbokuchou.1.e: "[GetCountry('STC').GetLongNameWithNoTooltip] — мы поддержим эту державу с центром в городе [GetCountry('STC').GetCapital.GetNameWithNoTooltip]."
 nanbokucho_neutrality: "Мы не станем никого поддерживать и провозгласим нейтралитет."
 nanbokuchou.2.title: "Окончание периода $nanbokuchou$"
 nanbokuchou.2.desc: "Времена неопределённости подошли к концу. [target_emperor.GetLongName] объединил[target_emperor.Custom('endlong_fem')] наши земли и положил[target_emperor.Custom('endlong_fem')] конец интригам императора [GetCharacter('jap_go_daigo_tenno').GetName]. Сильная единая власть пришла на смену стране, раздираемой междоусобицами. Все понимают, что [target_character.GetName] по праву занимает своё место. [Select_CString(target_character.IsFemale,'Она', 'Он')] и [GetUniqueInternationalOrganization('japanese_shogunate').GetLeaderTitle|l] становятся в нашей стране неоспоримыми авторитетами. Наконец все кланы будут преследовать общую цель."
 nanbokuchou.2.a: "Наконец-то мир и стабильность."
 nanbokuchou.3.title: "Окно возможностей"
 nanbokuchou.3.desc: "Уже какое-то время в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$japanese_shogunate_tt$,X $tt_op_L$Японском сёгунате$tt_cl_2$ конфликт — враждуют дворы [target_supported_court.GetLongName] и [target_enemy_court.GetLongName]. [target_shogun.GetGovernment.GetRulerOrRegent.GetName] и [GetCountry('NTC').GetGovernment.GetRulerOrRegent.GetName] продолжают противостоять [Select_CString(GetCountry('STC').GetGovernment.GetRulerOrRegent.IsFemale,'правительнице', 'правителю')] — это [GetCountry('STC').GetGovernment.GetRulerOrRegent.GetName], [Select_CString(GetCountry('STC').GetGovernment.GetRulerOrRegent.IsFemale,'мечтающая', 'мечтающий')] занять трон. [target_supported_court.GetLongNameWithNoTooltip] — до сих пор мы поддерживали их сторону, но ветер перемен начинает набирать силу.\n\nУстав от напряжённой борьбы, обе стороны, кажется, забыли, что за поддержку надо платить, и это вызвало недовольство среди их приверженцев [ROOT.GetCountry.Custom('endrank_predlog_vvo')] [ROOT.GetCountry.Custom('rank_ru_PREP')|l]. [target_enemy_court.GetWithNoTooltip]ие посланники утверждают, что [target_enemy_emperor.GetNameWithNoTooltip] не поскупится на награды, если мы присягнём [Select_CString(target_enemy_emperor.IsFemale,'ей', 'ему')] на верность."
 nanbokuchou.3.a: "Мы останемся верны своему слову."
 nanbokuchou.3.b: "Нельзя упускать такую возможность."
 refused_changing_court_support: "Отказывается поддержать нас"
 betrayed_court_support: "Предаёт наше доверие"
 nanbokuchou.4.title: "Предательство"
 nanbokuchou.4.desc: "[target_betrayer.GetLongName] — подлые крысы, лишённые чести. В разгар нашего противостояния [target_enemy_court.Custom('endlong_predlog_sso')] [target_enemy_court.Custom('longname_ru_INST')] они нарушили свою клятву и перебежали на сторону врага, соблазнённые лживыми обещаниями. Очевидно, они считают, что [target_enemy_emperor.GetName] сокрушит нас. Пришло время доказать им обратное на поле боя."
 nanbokuchou.4.a: "Предатели!"
 nanbokuchou.5.title: "Цена войны"
 nanbokuchou.5.desc: "[GetCountry('NTC').GetLongName] и [GetCountry('STC').GetLongName] не прекращают враждовать, и в этой борьбе уже давно участвуют все кланы. Пролились реки крови, погибло множество искусных воинов, но противостояние всё не заканчивается. Этот раскол — глубокая рана на теле нашего народа, которая ещё долго будет болеть и гноиться. Неизвестно, заживёт ли она вообще. Быть может, пришло время сложить оружие и попытаться договориться?"
 nanbokuchou.5.a: "Нет, мы продолжим сражаться!"
 nanbokuchou.5.b: "Лучше проявить благоразумие."
 nanbokuchou.6.title: "Противостояние"
 nanbokuchou.6.desc: "Вся держава вовлечена в конфликт между #ONCLICK:COUNTRY,[GetCountry('NTC').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('NTC').Custom('CL_tt')],X [GetCountry('NTC').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('STC').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('STC').Custom('CL_tt')],X [GetCountry('STC').Custom('CL_INST')|L]#!#!, претендующими на императорский трон. В это смутное время кланам нередко выпадает шанс реализовать свои интересы. Мы можем воспользоваться моментом за счёт нашего врага — это [target_enemy.GetLongName]."
 nanbokuchou.6.a: "Этот клан должен стать нашим."
 nanbokuchou.7.title: "Время для нападения"
 nanbokuchou.7.desc: "[target_enemy.GetLongName] — наши заклятый враги, которые противостоят нам долгие годы. Сейчас, в период $nanbokuchou$, мы получили шанс поставить его на место. Пришло время показать этим строптивцам, что бывает с теми, кто не подчиняется нашему клану, и прибрать к рукам их территории."
 nanbokuchou.7.a: "Их земли станут нашими."
 nanbokuchou.7.b: "Сейчас неподходящее время."
 nanbokuchou.8.title: "Новая императорская династия"
 nanbokuchou.8.common: "Борьба между #ONCLICK:COUNTRY,[GetCountry('NTC').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('NTC').Custom('CL_tt')],X [GetCountry('NTC').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('STC').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('STC').Custom('CL_tt')],X [GetCountry('STC').Custom('CL_INST')|L]#!#! привела к неожиданному результату: появлению нового претендента на власть."
 nanbokuchou.8.imperial.desc: "$nanbokuchou.8.common$ [target_new_emperor_ruler.GetName] принадлежит к династии [target_new_emperor_ruler.GetDynasty.GetName] и тоже может претендовать на Хризантемовый трон. Если мы заручимся серьёзной поддержкой, то без труда заявим свои права на него."
 nanbokuchou.8.desc: "$nanbokuchou.8.common$ [Select_CString(target_new_emperor_ruler.IsFemale,'Новая претендентка', 'Новый претендент')] на Хризантемовый трон, [target_new_emperor_ruler.GetName|l], чья держава — [target_new_emperor.GetLongName], легко сможет занять его, если заручится необходимой поддержкой."
 nanbokuchou.8.a: "Мы сплотимся вокруг новой ветви."
 nanbokuchou.8.b: "Мы не признаем новую ветвь."
 nanbokuchou.8.tt: "Мы поддержим новую ветвь императорской семьи"
 nanbokuchou.9.title: "Бесконечный период Намбокутё"
 nanbokuchou.9.desc: "Противостояние двух соперничающих императорских дворов продолжается уже несколько лет. Эта борьба грозит расколоть страну надвое, а конца конфликту всё не видно. Многие [ROOT.GetCountry.Custom('endlong_predlog_vvo')] [ROOT.GetCountry.Custom('longname_ru_PREP')] считают, что ради сохранения единства трона нам следует отказаться от своих притязаний в пользу [target_emperor.Custom('longname_ru_GEN')]. Конечно, божественное право на власть — не то, чем можно просто взять и поступиться, однако будущее страны вызывает серьёзные опасения, и разделённая династия может обернуться для нас ещё более суровыми испытаниями."
 nanbokuchou.9.a: "Мы согласны принести величайшую жертву ради воссоединения страны."
 nanbokuchou.9.b: "Сначала пусть признают старшинство нашей линии."
 destroy_all_clan_buildings_tt: "Все клановые сооружения будут уничтожены, а мы перестанем существовать"
