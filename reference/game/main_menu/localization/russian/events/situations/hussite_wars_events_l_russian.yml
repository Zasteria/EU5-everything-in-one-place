l_russian:
 hussite_wars: "Гуситские войны"
 hussite_wars_desc: "#TOOLTIP:RELIGION,$hussite_tt$,X #L Гуситы#!#! и #TOOLTIP:RELIGION,$catholic_tt$,X #L католики#!#! бесконечно конфликтуют. Эта череда столкновений быстро переросла в полномасштабную войну за религиозную принадлежность державы."
 recognized_hussites_tt: "#Y  Гуситские войны#! закончились нашей победой"
 has_not_had_this_situation_before_tt: "Эта [Concept('situation', 'ситуация')|e] возникла впервые"
 DEFENDERS_CATHOLICISM: "Оборонительный [Concept('alliance', 'союз')|e] против Богемии"
 DEFENDERS_HUSSITISM: "Оборонительный [Concept('alliance', 'союз')|e] против Рима"
 bohemia_and_emperor_at_war_with_both_being_leaders_tt: "[GetCountry('BOH').GetName] и [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetName] воюют друг с другом, причём каждая из этих [Concept('country', 'держав')|e] является [Concept('war_leader', 'лидером войны')|e] для своей стороны"
 HERETICS_KILLED: "Убитые на трибунале"
 HERETICS_CONVERTED: "Обращённые на трибунале"
 loc_key_desc_tribunal: "В ходе [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,hussite_wars,X #L «Гуситские войны»#!#! врагам #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#! доступно уникальное [Concept('action', 'действие')|e] [Concept('unit', 'отряда')|e] «[ShowUnitAbilityName('hussite_tribunal')]». Воспользоваться им можно в тех [Concept('locations', 'районах')|e], которые находятся под контролем [Concept('enemy', 'врагов')|e]-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиков#!#!. Часть исповедующего гуситство [Concept('pops', 'населения')|e] будет [Concept('convert', 'обращена')|e], остальные — преданы мечу."
 hussite_wars.1.title: "[jan_zelivsky_scope.GetNameWithNoTooltip] и его конгрегация"
 hussite_wars.1.entry: "Конгрегация Яна Желивского"
 HUSSITE_WARS_SIDE_BOHEMIA: "[THIS.GetLocation.GetOwner.GetLongName|Y] и [GetCountry('BOH').GetLongName] поддерживают друг друга в #TOOLTIP:SITUATION,hussite_wars,X #L Гуситских войнах#!#!!"
 HUSSITE_WARS_SIDE_EMPEROR: "[THIS.GetLocation.GetOwner.GetLongName|Y] и [GetCountry('BOH').GetLongName] враждуют друг с другом в #TOOLTIP:SITUATION,hussite_wars,X #L Гуситских войнах#!#!!"
 emperor_hw_tt: "Это [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRulerTitle|l] — непримиримый враг #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#!"
 boh_hw_tt: "Это [GetCountry('BOH').GetLongName] — защитники #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#!!"
 recent_tribunal_tt: "За последние #Y 5#! лет здесь было совершено действие «[ShowUnitAbilityName('hussite_tribunal')]»"
 convert_heretics_hw_action: "Принудительные обращения"
 convert_heretics_hw_action_desc: "Хватит терпеть давление со стороны еретиков! Пора встать на защиту #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситских#!#! традиций и верований. Для этого нам понадобится строгая дисциплина, в том числе в обрядах, совершаемых в [actor.Custom('rank_ru_PREP')|l]."
 demand_donation_key: "Нас ждут стычки и войны, но без них невозможно обеспечить мир и защитить границы. Мы потребуем, чтобы средства на это нам предоставили самые влиятельные"
 demand_noble_donations_hw_action: "Потребовать пожертвований от аристократов"
 demand_noble_donations_hw_action_desc: "$demand_donation_key$ аристократы."
 demand_clergy_donations_hw_action: "Потребовать пожертвований от священников"
 demand_clergy_donations_hw_action_desc: "$demand_donation_key$ священники."
 demand_burgher_donations_hw_action: "Потребовать пожертвований от купцов"
 demand_burgher_donations_hw_action_desc: "$demand_donation_key$ горожане."
 prepare_defenses_hw_action: "Подготовить оборону"
 prepare_defenses_hw_action_desc: "Вскоре на наши земли обрушатся бесчисленные толпы #TOOLTIP:RELIGION,$catholic_tt$,X #L католиков#!#!, объятых безумным желанием установить верховенство своей религии. Разумно будет позаботиться о том, чтобы в каждой провинции была устроена надёжная оборона."
 align_with_moderates_help_hw_action: "Поддержать умеренных"
 align_with_moderates_help_hw_action_desc: "Показав терпимость и готовность идти на переговоры, мы наверняка привлечём на свою сторону многих сочувствующих — даже из тех держав, что преклонили колено перед #TOOLTIP:RELIGION,$catholic_tt$,X #L католиками#!#!."
 align_with_radicals_help_hw_action: "Поддержать радикалов"
 align_with_radicals_help_hw_action_desc: "Мы остались одни в окружении еретиков, и они бродят около наших границ с голодными взглядами, словно шакалы. Никакой терпимости к врагам! Мы будем ревностны и беспощадны."
 join_the_imperial_side_hw_action: "Займём сторону [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('longname_ru_GEN')]"
 join_the_imperial_side_hw_action_desc: "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] вед[GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('endlong_youtut')] тяжёлую борьбу с ересью, и наша задача — помочь стереть эту заразу с лица #TOOLTIP:CONTINENT,europe,X #L Европы#!#!!"
 join_the_hussite_side_hw_action: "Встать на сторону державы [GetCountry('BOH').GetLongNameWithNoTooltip]"
 join_the_hussite_side_hw_action_desc: "Мы не можем закрывать глаза на бесчинства, которые [GetCountry('PAP').GetLongName] творит по отношению к несчастным. [GetCountry('BOH').GetLongName] будет под нашей защитой, и вместе мы положим конец этому безумному [GetCountry('PAP').GetAdjectiveWithNoTooltip|l]ому крестовому походу!"
 hw_province_gains_hw_heretic_conversions_modifier_tt: "Обозначенная [Concept('province', 'провинция')|e] получит модификатор «[ShowModifier('hw_heretic_conversions_modifier')]» на #Y 10#! лет"
 prepare_defenses_hw_action_tt: "Каждый [Concept('location', 'район')|e] в обозначенной [Concept('province', 'провинции')|e] получит модификатор #TOOLTIP:STATIC_MODIFIER,hw_prepared_defenses_modifier,X #V #L «Подготовка обороны»#!#! на #Y 15#! лет. При возможности в [Concept('province_capital', 'столице провинции')|e] будет построен #TOOLTIP:BUILDING_TYPE,castle,X #L замок#!#! по цене в #G –90%#! от базовой"
 countries_less_likely_to_join_against_us_tt: "Соседствующие с нами [Concept('countries', 'державы')|e] с #G меньшей вероятностью#! будут присоединяться к войнам против нас, пока действует модификатор «[ShowModifier('promoted_moderates_modifier')]»"
 countries_more_likely_to_join_against_us_tt: "Соседствующие с нами [Concept('countries', 'державы')|e] с #R большей вероятностью#! будут присоединяться к войнам против нас, пока действует модификатор «[ShowModifier('promoted_radicals_modifier')]»"
 catholic_victory_tt: "Победа католиков"
 hussite_victory_tt: "Победа гуситов"
 reignite_the_fires_of_crusade_tt: "Отношения между [GetCountry('BOH').Custom('longname_ru_wntt_INST')] и католическими [Concept('countries', 'державами')|e] ухудшатся. Со временем многие могут примкнуть к нашему делу"
 income_depends_on_estate_power_tt: "Получаемая сумма [Concept('gold', 'дукатов')|e] будет в основном зависеть от [Concept('estate_power', 'власти')|e] [Concept('estate', 'сословия')|e]"
 join_current_war_against_emperor_tt: "Мы присоединимся к [Concept('war', 'войне')|e] [GetCountry('BOH').Custom('longname_ru_GEN')] против [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('longname_ru_GEN')]"
 join_current_war_against_bohemia_tt: "Мы присоединимся к [Concept('war', 'войне')|e] [GetCountry('PAP').Custom('longname_ru_GEN')] против [GetCountry('BOH').Custom('longname_ru_GEN')]"
 #########
 hussite_wars.1.desc.generic: "Разгневанные толпы во главе со священником по имени [jan_zelivsky_scope.GetName] заполонили улицы [target_boh_capital_scope.Custom('LR_GEN')|l] [target_boh_capital_scope.GetName]. Они требуют от городского совета расширения прав и освобождения нескольких заключённых-#TOOLTIP:RELIGION,$hussite_tt$,X гуситов#!#!."
 hussite_wars.1.desc: "$hussite_wars.1.desc.generic$ К сожалению, судья и его помощники не исполнили требования протестующих, что привело к росту недовольства отсутствием реформ и вспышкам насилия. Быть может, пришло время разорвать этот порочный круг…"
 hussite_wars.1.desc.other_heresy: "$hussite_wars.1.desc.generic$ Преимущественно #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ий#! совет симпатизирует гуситским братьям, но #TOOLTIP:RELIGION,$catholic_tt$,X #L католические#!#! агенты не прекращают свою подрывную деятельность. Сохраним ли мы свою веру или примем гуситскую, #TOOLTIP:RELIGION,$catholic_tt$,X #L католический#!#! мир в любом случае продолжит считать нас еретиками, от которых следует избавиться…"
 hussite_wars.1.a: "Смерть тебе, [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
 hussite_wars.1.b: "Мы не можем себе позволить расколы среди католиков."
 end_hussite_wars_situation_tt: "Это предотвратит возникновение [Concept('situation', 'ситуации')|e] #TOOLTIP:SITUATION,hussite_wars,X #L «Гуситские войны»#!#!"
 boh_every_neighboring_country_tt: "Каждая несоюзная [Concept('country', 'держава')|e] рядом с нами или любым из наших [Concept('subjects', 'ленников')|e] получит [ShowBiasValue('violated_congress_of_visegrad_modifier')|+=0] к [Concept('opinion', 'мнению')|e] о нас"
 hussite_rebellion_tooltip: "Каждая [Concept('pop', 'группа населения')|e], которая симпатизирует #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситам#!#!, мобилизует силы и подержит [hussite_rebel_scope.GetName]"
 every_neighbor_of_bohemia_gets_hussite_wars.3_tt: "Событие #Y «Правоверные призывают к оружию»#! происходит в каждой #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! несоюзной державе неподалёку от #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!"
 hussite_wars.6_happens_for_catholic_champion_scope_tt: "[catholic_champion_scope.GetName] переживает событие #Y  «Воинственное #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#!»#!"
 hussite_wars.3.title: "Правоверные призывают к оружию"
 hussite_wars.3.desc: "Желая искоренить ересь, [GetCountry('PAP').GetGovernment.GetRulerTitle|l] ополчился против народа #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!. Он требует, чтобы мы исполнили свой #TOOLTIP:RELIGION,$catholic_tt$,X #L католический#!#! долг и присоединились к священному воинству. Нам стоит хорошенько подумать. Не хотелось бы нажить себе могущественных врагов в бессмысленной попытке доказать свою правоверность."
 hussite_wars.3.a: "К оружию!"
 hussite_wars.3.b: "Давайте не будем спешить."
 hussite_wars.4.title.hussite_victory_ally_or_subject: "Общая победа в Гуситских войнах"
 hussite_wars.4.title.hussite_victory: "Гуситская победа в Гуситских войнах"
 hussite_wars.4.title.catholic_victory: "Католическая победа в Гуситских войнах"
 hussite_wars.4.a.desc: "Наша борьба за равноправие и признание со стороны #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! власти принесла свои плоды. Мы защитили наш народ и нашу веру, а теперь претендуем на важное место за европейским столом."
 hussite_wars.4.b.desc: "Мы вкусили горечь поражения и были вынуждены признать верховенство #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! церкви. У нас была мечта, в которую мы верили всей душой, но мы дрогнули перед лицом коррупции и зла, и ей не суждено было сбыться…"
 hussite_wars.4.c.desc: "Господь благословил нас на победу в крестовом походе против еретиков. Мы погасили пламя #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#! [GetCountry('BOH').Custom('endlong_predlog_vvo')] [GetCountry('BOH').Custom('longname_ru_PREP')], восстановив законную власть #TOOLTIP:RELIGION,$catholic_tt$,X #L католичества#!#!. Пусть весь мир видит, что воля церкви непоколебима."
 hussite_wars.4.d.desc: "Наше дело было праведным, но в [target_capital.Custom('LR_PREP')|l] [target_capital.GetNameWithNoTooltip] всё равно взяли верх последователи #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#!. Этот конфликт придал смелости [GetCountry('BOH').Custom('longname_ru_DAT')] благодаря официальному признанию местной ереси. Мы должны смириться с этим позорным миром и найти иной способ восстановить единство #TOOLTIP:RELIGION,$catholic_tt$,X #L католичества#!#!."
 hussite_wars.4.e.desc: "Тень поражения повисла над нашим гуситским движением. Несмотря на совместную борьбу с нашими братьями [GetCountry('BOH').Custom('endlong_predlog_vvo')] [GetCountry('BOH').Custom('longname_ru_PREP')], силы #TOOLTIP:RELIGION,$catholic_tt$,X #L католичества#!#! взяли верх, вернув старые порядки. Наша вера выстоит, потому что идеи, за которые мы сражались, не так-то просто подавить."
 hussite_wars.4.f.desc: "Пусть даже каждый из нас — #TOOLTIP:RELIGION,$catholic_tt$,X #L католик#!#!, мы всё же решили принять сторону #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситов#!#! #ONCLICK:COUNTRY,[GetCountry('BOH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOH').Custom('CL_tt')],X [GetCountry('BOH').Custom('CL_GEN')|L]#!#!. Общая цель сплачивает союзников покрепче голосов прелатов из далёких земель, и мы ни разу не бросили своих товарищей за все эти долгие и тяжёлые годы.\n\nКогда война закончилась, мы поняли, что наша ставка оказалась верной. [GetCountry('BOH').GetNameWithNoTooltip] одержал[GetCountry('BOH').Custom('end_fem')] триумфальную победу, пролив для этого немало пота и крови, добил[GetCountry('BOH').Custom('end_assya')] признания своей веры на всём континенте, и эти усилия вознаградились сторицей; мы же, как союзники, тоже получили свою долю от торжества справедливости. Пусть каждый, кто посмел усомниться в нашей решительности, теперь задумается, что такое подлинная верность."
 hussite_wars.4.g.desc: "В конце концов #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситство#!#! уступило место другой реформистской идеологии. Борьба за кубки обернулась для #ONCLICK:COUNTRY,[GetCountry('BOH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOH').Custom('CL_tt')],X [GetCountry('BOH').Custom('CL_GEN')|L] самым непредсказуемым образом. Гуситские войны подходят к своему логическому завершению."
 hussite_wars.4.a: "Истинная вера победила!"
 hussite_wars.4.b: "На священной войне все средства хороши…"
 hussite_wars.4.c: "Церковь победила!"
 hussite_wars.4.d: "Ересь выстояла…"
 hussite_wars.4.e: "Наша вера выстоит несмотря на поражение."
 hussite_wars.4.f: "Вместе мы победим!"
 hussite_wars.4.g: "Вот и конец истории."
 hussite_wars.5.title: "[Select_CString(target_character.IsFemale,'Одноглазая', 'Одноглазый')] [target_character.GetLastNameWithNoTooltip]"
 hussite_wars.5.entry: "Одноглазый Жижка"
 hussite_wars.5.desc: "В каждой войне есть свои герои и [target_character.GetName] как раз из их числа. [Select_CString(target_character.IsFemale,'Её', 'Его')] вклад в общее дело невозможно переоценить. Ходят слухи, что вражеская стрела лишила [Select_CString(target_character.IsFemale,'её', 'его')] одного глаза. Очевидцы говорят, что вместо того, чтобы отступить или сдаться, [Select_CString(target_character.IsFemale,'она', 'он')] просто [Select_CString(target_character.IsFemale,'вытащила', 'вытащил')] стрелу и [Select_CString(target_character.IsFemale,'продолжила', 'продолжил')] сражаться.\n\nНесмотря на увечье, [target_character.GetName] [Select_CString(target_character.IsFemale,'стала', 'стал')] грозным полководцем и жаждет повышения, чтобы получить в подчинение больше людей и привести их к победе. Если мы провозгласим [Select_CString(target_character.IsFemale,'её', 'его')] [Select_CString(target_character.IsFemale,'героиней', 'героем')] и символом нашего сопротивления, то нанесём #TOOLTIP:RELIGION,$catholic_tt$,X #L католичеству#!#! серьёзный удар."
 hussite_wars.5.a: "Нашим людям нужен великий герой."
 hussite_wars.5.historical_info: "Ян Жижка из Троцнова — выдающийся полководец XV века, получивший известность как один из вождей гуситского движения. Под его командованием гуситы одержали множество побед. Именно он изобрёл военную тактику, предполагающую использование скреплённых повозок для мобильной обороны. Его стратегический гений и харизма помогли гуситам выстоять во время многочисленных крестовых походов, организованных католической церковью."
 hussite_wars.6.title: "Воинственное католичество"
 hussite_wars.6.desc: "В тяжёлые времена, когда мир вокруг стал рассадником ереси, мы должны собрать волю в кулак и начать крестовый поход против тех, кто желает навредить нашему правоверному народу.\n\n[GetCountry('BOH').GetLongName] — наш враг, и сам глава католической церкви попросил нас поднять знамя ревностной священной войны, чтобы поддержать его борьбу. За [ShowReligionName('catholic')|l]!"
 hussite_wars.6.a: "Мы уничтожим этих еретиков!"
 hussite_wars.6.b: "Мы не цепные псы папизма!"
 hussite_wars.7.title: "Незавидная судьба гуситов"
 hussite_wars.7.desc: "Избитый гонец принёс нам ужасную весть. Он рассказал о подлом крестовом походе, начатом #ONCLICK:COUNTRY,[GetCountry('PAP').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PAP').Custom('CL_tt')],X [GetCountry('PAP').Custom('CL_INST')|L]#!#!. Территория #ONCLICK:COUNTRY,[GetCountry('BOH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOH').Custom('CL_tt')],X [GetCountry('BOH').Custom('CL_GEN')|L]#!#! утопает в крови: крестоносцы оставляют после себя выжженные земли, а на улицах сошлись в смертельной схватке тысячи солдат и крестьян.\n\nГонец напоминает о крепких узах братства, которые связывают наши народы, и просит нас не оставлять его людей в беде. Власти [GetCountry('BOH').Custom('CL_GEN')] взывают о помощи!"
 hussite_wars.7.a: "И власти [GetCountry('POL').Custom('CL_GEN')] откликнутся на её зов. Приказать всадникам седлать лошадей!"
 hussite_wars.7.b: "Мы не враги самим себе…"
 teutons_hussite_wars_tt: "[GetCountry('TEU').GetLongName] — здесь происходит событие #Y  «Правоверные призывают к оружию»#!"
 hussite_wars.8.title: "Общий враг"
 hussite_wars.8.desc: "Наши сограждане в отчаянии. Сейчас, когда армия еретиков ломится в наши ворота, многие, казалось бы, непримиримые противоречия отошли на второй план: все объединились против жадных и недальновидных врагов. Наши смелые и благочестивые люди обязательно справятся с этой бедой и одолеют тех, кто желает навредить нашему народу и нашей вере, добьются справедливости, восстановят уважение к себе и вернут былое величие."
 hussite_wars.8.a: "Вперёд, славные сыны и дщери [GetCountry('BOH').Custom('CL_GEN')]!"
 boh_clergy_donation_tt: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] пожертвуют средства, которые будут направлены на повышение духа нашего народа"
 hussite_wars.8.b: "Мы будем распространять наше учение против католиков с ещё большим рвением."
 hussite_wars.8.c: "Пусть в эти трудные времена нам помогут [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]…"
 hussite_wars.9.title: "Новый крестовый поход против гуситов"
 hussite_wars.9.desc: "Чума под названием «[ShowReligionName('hussite')|l]» — угроза каждому богобоязненному и набожному человеку. Эта болезнь подтачивает единство нашей веры и основы божественного миропорядка. Гуситы распространяют ересь, сеют раздор и порочат священное учение, которому #TOOLTIP:RELIGION,$catholic_tt$,X #L католики#!#! прилежно следуют десятилетиями. Терпеть такое пренебрежение больше невозможно. Наш священный долг — созвать легионы католиков и решительным шагом отправиться в поход — уничтожить ересь, пока та не успела окончательно разъесть сердца людей. Стерев все следы гуситского влияния, мы сбережём свою веру и восстановим священный порядок, по которому так истосковались наши земли."
 hussite_wars.9.a: "На войну!"
 hussite_wars.9.b: "Пока что будем выжидать."
 explain_situation_peace_treaty_tt: "В ходе этой [Concept('war', 'войны')|e] мы сможем уничтожить #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситство#!#! с помощью [Concept('peace_treaties', 'мирных договоров')|e] «[ShowPeaceTreatyTypeName('force_convert')]» и «[ShowPeaceTreatyTypeName('supress_hussite_faith')]» и положить конец #TOOLTIP:SITUATION,hussite_wars,X #L Гуситским войнам#!#!"
 hussite_wars.10.title: "Гуситские войны"
 hussite_wars.10.desc: "[target_bohemia.GetName] находится на грани катастрофы. Всё больше недовольных примыкает к движению #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситов#!#!, и в глазах #TOOLTIP:RELIGION,$catholic_tt$,X #L католических#!#! стран наша держава превращается в изгоя. После того как [Select_CString(GetCharacter('boh_jan_hus').IsFemale, 'была казнена', 'был казнён' )] [GetCharacter('boh_jan_hus').GetName], раскольничество лишь усугубилось. И [GetCountry('BOH').GetGovernment.GetEstateName('peasants_estate')|l], и [GetCountry('BOH').GetGovernment.GetEstateName('nobles_estate')|l] — каждый сегодня внимает еретическим проповедям с призывами основать новую церковь, над которой [target_location1.GetName] не будет иметь никакой власти.\n\n[GetCountry('BOH').Custom('rank_ru_ACC')] охватывают беспорядки, а в [target_location2.Custom('LR_PREP')|l] [target_location2.GetName] разгорается пожар реформации. Для участников #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской империи#!#! происходящее — уже не просто народный бунт, а целенаправленный мятеж еретиков, готовых добиваться своего с оружием в руках. Если не сдержать распространение этой напасти на территории [target_bohemia.Custom('CL_GEN')], она распространится за границы державы, и тогда угроза нависнет над всем #TOOLTIP:RELIGIONGROUP,christian,X #L христианским#!#! миром."
 hussite_wars.10.a: "К оружию! Отстоим свою веру!"
 hussite_wars.10.historical_info: "Гуситские войны (1419–1434) — череда религиозных и гражданских конфликтов на территории Богемии, вызванных казнью Яна Гуса — чешского реформатора и критика католической церкви. Его последователи, называвшие себя гуситами, требовали проведения церковных реформ: допускать к причастию всех без исключения и учредить собственную церковь, независимую от Рима. Гуситам-радикалам противостояли верные своей церкви католики и подчинявшиеся императору Священной Римской империи и папе римскому крестоносцы. Свою небольшую по сравнению с противниками численность гуситы достойно компенсировали изобретательной тактикой на поле боя и сплочённостью, что позволяло им наносить врагу чувствительные поражения. Впоследствии церковь была вынуждена пойти на переговоры и даже на некоторые уступки."
 hussite_wars.10.b: "Мы покараем этих еретиков!"
 hussite_wars.10.c: "Час расплаты ещё не пробил…"
 #Rebels
 hussite_rebellion: "Восстание гуситов"
 hussite_wars.11.title: "Гуситские войны"
 hussite_wars.11.desc: "В провинции [target_boh_capital_scope.GetName] неспокойно. Во всех её соборах и церквях обсуждают последнюю новость: [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l] считает нас опасными еретиками, которых следует либо задавить силой, либо обратить в свою веру. Теперь факел #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситства#!#!, который мы несём в руках, стал не только нашим спасением, но и знаменем. Крестоносцы сосредотачивают силы у наших границ. Мы отринули #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#! ради истинной веры и должны быть готовы защитить как её, так и свой народ."
 hussite_wars.11.a: "Сразимся за веру и людей!"
 hussite_wars_11_tt: "Ситуация #TOOLTIP:SITUATION,hussite_wars,X #L «Гуситские войны»#!#! началась"
 HUSSITE_WARS_NO_SUPPORTERS: "Ни одна [country|e] не приняла эту сторону"
