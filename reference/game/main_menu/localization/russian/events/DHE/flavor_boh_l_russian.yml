l_russian:
 flavor_boh.1.title: "Гуситы возвращаются!"
 flavor_boh.1.entry: "Гуситы возвращаются!"
 flavor_boh.1.desc: "Несмотря на все наши усилия, попытки установить мир между #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситами#!#! и #TOOLTIP:RELIGION,$catholic_tt$,X #L католиками#!#! потерпели крах. Руководитель гуситов по имени [jiri_z_podebrad.GetName] собрал войско и теперь ведёт его на #TOOLTIP:LOCATION,prague,X #L Прагу#!#!. В собственных глазах он — будущий [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. После овладения престолом он намеревается положить конец гонениям на последователей учения, которое проповедовал [GetCharacter('boh_jan_hus').GetLastName]."
 flavor_boh.1.historical_info: "Йиржи из Кунштата и Подебрад был богемским дворянином и одним из лидеров гуситов. Во время правления короля Ладислава между сторонниками католицизма и гуситами усилилась напряжённость, тогда Йиржи собрал армию, захватил столицу и одержал победу над знатью, которая всё ещё оставалась верной папе римскому. В 1451 году император Священной Римской империи Фридрих III поручил ему управление Богемией, а в 1458 году богемские сословия, — включая даже приверженцев папы, — единодушно избрали его королём. Йиржи пытался проводить политику мира и терпимости, но после нескольких лет правления католическая оппозиция подняла восстание, поддержав венгерского короля Матьяша Корвина, который вторгся в Богемию, чтобы вернуть её в лоно католической церкви."
 flavor_boh.1.a: "[GetCharacter('boh_jan_hus').GetNameWithNoTooltip] знал истину."
 flavor_boh.1.a.entry: "Ян Гус знал истину."
 flavor_boh.1.b: "Пусть [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] следует за Гусом, а народ пойдёт за Римом."
 flavor_boh.1.b.entry: "Пусть следует за Гусом, а народ пойдёт за Римом."
 STATIC_MODIFIER_NAME_boh_hussite_king: "Власть гуситов"
 STATIC_MODIFIER_NAME_DESC_boh_hussite_king: "Владыка нашей державы поддерживает #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситство#!#! — религиозное движение, которое основал [GetCharacter('boh_jan_hus').GetName] в противовес #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! церкви. И хотя немало наших подданных поддерживают гуситские идеи, правители-#TOOLTIP:RELIGIONGROUP,christian,X #L христиане#!#! из других стран Европы относятся к нам в лучшем случае враждебно."
 flavor_boh.1.c: "Мы сохраним верность Риму!"
 boh_papal_reconciled: "Повиновение гуситов"
 flavor_boh.2.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]-еретик"
 flavor_boh.2.entry: "$flavor_boh.2.title$"
 flavor_boh.2.desc: "[target_character.GetName] — [Select_CString(target_character.IsFemale, 'ярая последовательница', 'ярый последователь' )] #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситских#!#! идей, на почве этих взглядов [Select_CString(target_character.IsFemale, 'настроившая', 'настроивший' )] против себя #TOOLTIP:RELIGION,$catholic_tt$,X #L католическую#!#! церковь. [GetCountry('PAP').GetGovernment.GetRulerTitle|U] мнит себя милостивым владыкой, а потому предлагает примириться с церковью и даже готов пойти на уступки, если мы отречёмся от учения еретика по имени [GetCharacter('boh_jan_hus').GetLastName] и вернёмся к римским догмам."
 flavor_boh.2.a: "Преклоним колено перед Римом."
 flavor_boh.2.b: "Останемся верными Христу."
 flavor_boh.3.title: "Зеленогорский союз"
 flavor_boh.3.entry: "$flavor_boh.3.title$"
 flavor_boh.3.desc: "Приверженцы папства в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! крайне недовольны тем, что [target_character.GetName] [Select_CString(target_character.IsFemale, 'отказалась', 'отказался' )] подавить #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситскую#!#! веру — они считают, что поступить так мог только еретик и враг церкви. Ответ последовал быстро: на собрании в Зелена-Горе [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'была объявлена недостойной', 'был объявлен недостойным' )] своего престола. Теперь [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашей державы находится в затруднительном положении: сторонники папы вместе со своими союзниками из числа #TOOLTIP:AREA,silesia_area,X #L силезских#!#! дворян открыто подняли мятеж."
 flavor_boh.3.a: "Мы их разгромим!"
 flavor_boh.4.title: "Владиславский зал"
 flavor_boh.4.entry: "$flavor_boh.4.title$"
 flavor_boh.4.desc: "Наш замечательный архитектор [target_character.GetName] поистине превзошёл самого себя. Последнее его творение — [ShowWorkOfArtName('vladislav_hall')], крупнейшее в #TOOLTIP:LOCATION,prague,X #L Праге#!#! светское помещение — можно без преувеличения назвать шедевром архитектуры. Здесь можно проводить что угодно: пиршества, коронации, другие важные для двора мероприятия… Зал этот настолько велик, что здесь без труда получится устроить даже рыцарский турнир с верховыми лошадями."
 flavor_boh.4.a: "Великолепно!"
 flavor_boh.4.historical_info: "Владиславский зал — выдающийся памятник поздней готики, построенный в 1493–1502 годах Бенедиктом Рейтом в рамках масштабной перестройки Пражского града, затеянной королём Владиславом II. Это огромное помещение с высокими витиеватыми сводами считается одним из чудес позднесредневековой архитектуры. Изначально Владиславский зал использовался для королевских церемоний, пиров и рыцарских турниров, позднее, в эпоху Габсбургов, там проводились заседания парламента и выборы монарха. Ведущая в зал лестница настолько широка, что ей могли пользоваться конные рыцари в полном облачении."
 flavor_boh.6.title: "Браге и Кеплер"
 flavor_boh.6.entry: "$flavor_boh.6.title$"
 flavor_boh.6.desc: "[ROOT.GetCountry.GetCapital.GetName] — настоящий оплот научного прогресса, сюда стекаются самые выдающиеся умы нашего времени. Среди них и знаменитый датский астроном [target_character.GetName], который прославился своими наблюдениями за небесными телами. Он стремится проверить свои теории, и в этом ему поможет знаменитый математик, обладатель выдающегося аналитического ума [target_character2.GetName]. Их совместные исследования могут кардинально изменить наши представления о небесах и повысить престиж нашей державы, однако последние находки учёных идут вразрез с устоявшимися взглядами…"
 flavor_boh.6.historical_info: "Известный учёный Тихо Браге на закате своей жизни переехал в Прагу, где получил должность придворного астронома и построил новую обсерваторию. В работе ему помогал Иоганн Кеплер, который после смерти Браге продолжил использовать заметки учёного и на основе этих знаний открыл законы движения планет."
 flavor_boh.6.a: "Блестяще!"
 flavor_boh.6.b: "Хватит попусту таращиться в небо!"
 flavor_boh.7.title: "Гуситские традиции"
 flavor_boh.7.entry: "Гуситские традиции"
 flavor_boh.7.desc: "Среди народа #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! ещё сильны #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситские#!#! традиции, однако после того, как Мартин Лютер написал свои 95 тезисов, многие высокие чины всё чаще начинают отворачиваться от гуситства и обращаться в #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#!. Нам пора определиться, как поступать дальше: оставаться ли гуситами или присоединиться к лютеранскому движению Реформации."
 flavor_boh.7.a: "Мы сохраним гуситскую веру."
 flavor_boh.7.b: "Мы присоединимся к Реформации. Да здравствуют Лютер и [GetCharacter('boh_jan_hus').GetLastNameWithNoTooltip]!"
 flavor_boh.7.b.entry: "Мы присоединимся к Реформации. Да здравствуют Лютер и Гус!"
 flavor_boh.8.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]: зимний король"
 flavor_boh.8.entry: "$flavor_boh.8.title$"
 flavor_boh.8.desc: "#TOOLTIP:RELIGION,$catholic_tt$,X #L Католикам#!#! и #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранам#!#! не привыкать ко взаимной религиозной неприязни, однако в последнее время конфликт их опасно обострился. Некоторые исповедующие лютеранство дворяне сумели заручиться поддержкой еретиков-единомышленников из соседних стран и даже избрали себе нового кандидата на должность правителя, хотя [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! сегодня — [target_character.GetName]. Дерзость их не знает границ; столкновение на религиозной почве неизбежно. Либо мы примем лютеранство мирно, либо встретим еретиков с оружием в руках."
 flavor_boh.8.historical_info: "В 1608 году обострилось напряжение между католическими и протестантскими землями империи. Протестанты заключили между собой союз, который возглавил курфюрст Пфальцский Фридрих при поддержке Бранденбурга и Гессен-Касселя. В ответ на это католики образовали собственный союз — Католическую лигу. В 1618 году богемские протестанты подняли восстание и избрали Фридриха Пфальцского королём Богемии, чем возмутили императора — действующего короля Богемии. Императорский полководец Тилли, посланный разбить мятежников, отправился со своим войском в Богемию, где разгромил армию Фридриха при Белой горе, положив тем самым конец правлению «короля», а заодно — протестантскому сопротивлению в Австрии и Южной Германии. Сбежавший из Богемии Фридрих получил в народе прозвище «зимний король» — за своё недолгое правление."
 flavor_boh.8.a: "Постараемся избежать кровопролития."
 flavor_boh.8.b: "С нами Бог!"
 boh_lutheran_king: "Лютеранский король на престоле"
 flavor_boh.9.title: "[GetCountry('BOH').GetGovernment.GetRulerTitle]-гусит на троне [GetCountry('BOH').Custom('CL_GEN')]"
 flavor_boh.9.desc: "На престол #ONCLICK:COUNTRY,[GetCountry('BOH').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BOH').Custom('CL_tt')],X [GetCountry('BOH').Custom('CL_GEN')|L]#!#! восходит [GetCountry('BOH').GetGovernment.GetRulerTitle|l], чью душу, очевидно, искушает сам дьявол, ибо [target_character.GetName] исповедует еретическую #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситскую#!#! веру, открыто отказываясь от веры истинной. Коллегия кардиналов считает, что этим оскорбляется не только католическая вера, но и непосредственно [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l]."
 flavor_boh.9.a: "Будь [Select_CString(target_character.IsFemale, 'проклята', 'проклят' )] [target_character.GetNameWithNoTooltip] и [Select_CString(target_character.IsFemale, 'её', 'его' )] дом!"
 flavor_boh.9.a.entry: "Мы должны осудить его и его дом."
 boh_heretic_hussite: "Гусит-еретик"
 flavor_boh.9.b: "Стоит примириться с [GetCountry('BOH').Custom('CL_INST')]."
 flavor_boh.9.b.entry: "Стоит примириться с Богемией."
 flavor_boh.10.title: "Власти [GetCountry('PAP').Custom('longname_ru_wntt_GEN')] заявляют: «[target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'виновна', 'виновен' )]»"
 flavor_boh.10.desc: "[GetCountry('PAP').GetLongName] утверждает, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашей державы [Select_CString(target_character.IsFemale, 'виновна', 'виновен' )] в рапространении #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситской#!#! ереси."
 flavor_boh.10.a: "Я не отрекусь от своего народа!"
 flavor_boh.11.title: "[GetCountry('PAP').GetLongNameWithNoTooltip] уступа[GetCountry('PAP').Custom('endlong_etyut')]"
 flavor_boh.11.desc: "Нам сообщили, что [GetCountry('PAP').GetLongName] отказывается от своих обвинений, хотя [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] открыто выступает в поддержку #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситского#!#! движения."
 flavor_boh.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_boh.11.a.entry: "$common_string_brilliant$"
 flavor_boh.13.title: "Разброд в церкви"
 flavor_boh.13.desc: "В #TOOLTIP:LOCATION,konstanz,X #L Констанце#!#! скоро соберётся совет, где будет обсуждаться #TOOLTIP:RELIGION,$catholic_tt$,X #L католическая#!#! вера. Приглашение посетить совет и поделиться своими взглядами касательно церковных распрей получил и [target_character.GetName] — ему пообещали неприкосновенность."
 flavor_boh.13.a: "Ничего плохого не случится!"
 flavor_boh.14.title: "Совет в Констанце"
 flavor_boh.14.desc: "Великий собор в #TOOLTIP:LOCATION,konstanz,X #L Констанце#!#! — вестник судьбоносных перемен, что несут с собой религиозная смута — и, возможно, поступки одного человека. Перед советом предстал [target_character.GetName] — #L [GetCountry('BOH').GetAdjective|l]ий#! реформатор и сторонник религиозных свобод. Жизнь его может оборваться в любой момент. Под священными сводами разносятся слова учения, которое проповедует [target_character.GetLastNameWithNoTooltip], — учения, выступающего против власти #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! церкви и призывающего к реформам. Последователи его — гуситы — затаили дыхание в ожидании, какое решение примет совет."
 flavor_boh.14.a: "Пусть [target_character.GetNameWithNoTooltip] сгорит на костре."
 flavor_boh.14.a.entry: "Пусть сгорит на костре."
 flavor_boh.14.b: "Еретика следует помиловать."
 flavor_boh.15.title: "[target_character.GetNameWithNoTooltip] сожжён на костре"
 flavor_boh.15.entry: "Сожжение Яна Гуса"
 flavor_boh.15.desc: "В анналы религиозной борьбы вписана новая страшная глава. Жизнь, которую вёл #L [ROOT.GetCountry.GetAdjective|l]ий#! реформатор [target_character.GetName], обрывается на ужасной и трагической ноте. В сердцах праведников вспыхивает огонь раскольничества, а #TOOLTIP:RELIGION,$catholic_tt$,X #L католическая#!#! церковь тем временем собирает силы, чтобы нанести мощный удар по еретическому учению, которое проповедовал [target_character.GetLastNameWithNoTooltip]."
 flavor_boh.15.a: "Неужели он был таким же, как и мы?"
 flavor_boh.16.title: "[target_character.GetNameWithNoTooltip] отпущен"
 flavor_boh.16.entry: "Освобождение Яна Гуса"
 flavor_boh.16.desc: "Постановление совета поразило всех. Одним росчерком пера судьи предопределили ход мировой истории. [target_character.GetName], #L [ROOT.GetCountry.GetAdjective|l]ий#! реформатор, некогда обвинявшийся в ереси, получил призрачную возможность искупить свои грехи: он больше не считается врагом #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! церкви, а потому может и дальше распространять своё учение."
 flavor_boh.16.a: "Это учение непременно распространится…"
 flavor_boh.17.title: "Первый Вишеградский съезд"
 flavor_boh.17.entry: "Первый Вишеградский съезд"
 flavor_boh.17.desc: "С тех пор как #L [ROOT.GetCountry.GetAdjective|l]ий#!, #L [GetCountry('HUN').GetAdjective|l]ий#! и #L [GetCountry('POL').GetAdjective|l]ий#! дома в последний раз собирались обсуждать вопрос расширения #L [GetCountry('HAB').GetAdjective|l]их#! границ, прошло несколько лет. Чтобы отношения между тремя державами стали ещё прочнее, мы отозвали свою претензию на престол #TOOLTIP:DYNASTY,$piast_dynasty_tt$,X #L Пястов#!#!.\n\nВ ответ нам оказали жест доброй воли, пожаловав исключительные права на торговые маршруты, а также признав нашу власть над #TOOLTIP:AREA,silesia_area,X #L Силезией#!#!, после чего наши связи лишь окрепли. Возможно, это соглашение ещё сыграет немаловажную роль в стремлении пересилить влияние семейства #TOOLTIP:DYNASTY,$habsburg_dynasty_tt$,X #L Габсбургов#!#!."
 flavor_boh.17.a: "Мы будем и дальше чтить соглашение!"
 flavor_boh.17.b: "У нас совсем другие планы…"
 flavor_boh.18.title: "Староместская ратуша"
 flavor_boh.18.entry: "$flavor_boh.18.title$"
 flavor_boh.18.desc: "Управление нашими владениями — сложное дело, требующее невероятной тщательности от каждого канцлера и члена совета.\n\nЧтобы упростить судопроизводство, а заодно и процессы руководства [ROOT.GetCountry.Custom('rank_ru_INST')|l], [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l] предлагает нам приобрести у какой-либо богатой семьи большой дом и превратить его в место, где советники и представители сословий будут встречаться и обсуждать вопросы политики и государственных дел."
 flavor_boh.18.a: "Это пойдёт на пользу [ROOT.GetCountry.GetGovernment.GetAdjective|l]ой репутации!"
 flavor_boh.18.a.entry: "Это пойдёт на пользу королевской репутации!"
 flavor_boh.18.b: "Не следует нарушать сложившийся порядок."
 flavor_boh.20.title: "Пражский университет"
 flavor_boh.20.entry: "Пражский университет"
 flavor_boh.20.desc: "Чтобы по праву считать себя одним из самых просвещённых и образованных народов мира, необходимо всерьёз заняться распространением знаний. Этому, к счастью, способствуют высшие слои нашего общества: в последнее время они испытывают неподдельный интерес к обучению в просторных университетских залах и передаче усвоенной там мудрости другим. Они даже требуют от нас построить новый #TOOLTIP:BUILDING_TYPE,university,X #L университет#!#!, чтобы вырастить новое поколение мыслителей!"
 flavor_boh.20.a: "Превосходная идея!"
 flavor_boh.20.b: "Сомнительная идея…"
 flavor_boh.21.title: "Нове-Место"
 flavor_boh.21.entry: "$flavor_boh.21.title$"
 flavor_boh.21.desc: "Чтобы никто не сомневался, что [target_character.GetName] — великолепный правитель, а народ богат и живёт в изобилии, совет [target_location.Custom('LR_GEN')] [target_location.GetName] предложил соорудить в пределах границ нашей великой столицы новый город. В поддержку этой идеи выступают многие советники, желающие, чтобы при слове «[target_location.GetNameWithNoTooltip]» каждому представлялись поражающие воображение новые дома, воплощающие в себе всё великолепие и трудолюбие нашего народа."
 flavor_boh.21.a: "Построим новый город!"
 flavor_boh.21.b: "Это не лучшее расходование наших средств."
 flavor_boh.23.title: "[target_area.GetNameWithNoTooltip]: земельный суд"
 flavor_boh.23.entry: "Земельный суд Моравии"
 flavor_boh.23.desc: "Задачу управления нашими владениями нельзя назвать лёгкой. Сотни земских начальников и управляющих без устали трудятся день и ночь, чтобы в казну исправно поступали налоги, а на окраинных землях не творилось произвола.\n\nНедавно градоначальники из области [target_area.GetName] попросили нас учредить областной суд, который будет руководить делами от имени [target_capital.Custom('LR_GEN')|l] [target_capital.GetName]. В его состав войдёт выбранный на местном уровне управляющий, а надзирать за работой станет областной судья. Помимо них заседать будут 14 самых выдающихся местных дворян."
 flavor_boh.23.a: "Хорошо. Мы одобряем этот план."
 flavor_boh.23.b: "Не стоит отворачиваться от центральной власти…"
 boh_control_prosp_dev_moravia_tt: "Каждый [Concept('location', 'район')|e] в области [target_area.GetName] получит:\n#G 10%#! контроля\n#G 1#! ед. развития\n#G 10%#! процветания"
 boh_prosperity_capital_prov: "Каждый [Concept('location', 'район')|e] в провинции [target_capital.GetName] получит:\n#G 10%#! процветания"
 flavor_boh.24.title: "Кодекс Maiestas Carolina"
 flavor_boh.24.entry: "$flavor_boh.24.title$"
 flavor_boh.24.desc: "Уже далеко не первое столетие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] пользуются почти безграничной властью над своими владениями, из-за чего многие нередко осмеливались даже оспаривать власть короны.\n\nТакое свободомыслие породило крайне опасный прецедент. Многие советники предлагают нам ограничить власть самых видных дворян, издав соответствующие статьи. Однако в таком случае мы рискуем подорвать равновесие…"
 flavor_boh.24.a: "Приступим к составлению статей. Мы здесь власть!"
 flavor_boh.24.b: "Не будем тревожить власть имущих."
 flavor_boh.25.title: "Мастер из Вишши-Брода"
 flavor_boh.25.entry: "$flavor_boh.25.title$"
 flavor_boh.25.desc: "За последние несколько лет немалую славу в нашей державе обрёл художник [target_artist.GetName]. Его многочисленные картины настолько впечатляют, что мы всерьёз задумываемся над тем, чтобы пригласить такого талантливого творца к своему двору. Такой жест не только возвысит нашу культуру в глазах других, но и усладит наш художественный вкус."
 flavor_boh.25.a: "Одно из величайших имён в нашей живописи!"
 flavor_boh.25.b: "Эти картины явно переоценены…"
 flavor_boh.26.title: "Корона Святого Вацлава"
 flavor_boh.26.entry: "$flavor_boh.26.title$"
 flavor_boh.26.desc: "Нелёгкие времена для нашего королевского дома мы перенесли с достоинством, выйдя из этого горнила лишь сильнее; враги, сокрушённые нами на пути к власти, тому подтверждение.\n\nЧтобы у каждого окончательно отпали сомнения в нашем величии, советники выступили с предложением выковать великолепнейшую корону и посвятить её Святому Вацлаву. Корона эта, украшенная золотом и почти сотней различных драгоценных камней, станет главным символом нашей власти и достатка!"
 flavor_boh.26.a: "Не пожалеем своих средств на создание такого шедевра!"
 flavor_boh.26.b: "Посвящение Святому Вацлаву потребует пожертвований…"
 flavor_boh.26.c: "Подобные безделушки непозволительно дороги."
 wear_st_wenceslas_crown_tt: "[target_character.GetName] наденет новую корону"
 flavor_boh.27.title: "Кафедральный собор Святого Вита"
 flavor_boh.27.entry: "Собор Святого Вита"
 flavor_boh.27.desc: "#TOOLTIP:BUILDING_TYPE,cathedral,X #L Кафедральный собор#!#! Святого Вита, построенный ещё в X веке, — давнее и прекрасное олицетворение нашего могущества и веры. Однако со временем [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetName] становится лишь великолепнее, а значит, и посвящения наши божественным покровителям должны быть достаточно грандиозными. Уже составлены планы по расширению собора — остаётся лишь нанять рабочих, если мы всё-таки решимся взяться за это серьёзное начинание."
 flavor_boh.27.a: "Вложим средства в расширение!"
 flavor_boh.27.b: "Это слишком дорого…"
 flavor_boh.27.historical_info: "Заложенный в 930 году богемским князем Вацлавом собор изначально представлял собой ротонду в раннем романском стиле. Уже позже, в 1060 году, князь Спытигнев II под влиянием христианской общины, пожелавшей церковь большего размера, пристроил к южной апсиде романскую базилику. План собора был составлен под впечатлением от романской архитектуры Священной Римской Империи, в частности — от церкви аббатства в Хильдесхейме и Шпайерского собора. В 1344 году, когда в Праге возникла архиепархия, началось строительство собора в готическом стиле, прервавшееся из-за Гуситских войн, разразившихся в следующем столетии. С тех пор на протяжении последующих веков несколько раз предпринимались попытки закончить работы, однако достроить собор удалось только в 1844–1929 годах."
 flavor_boh.28.title: "Жидкая радость"
 flavor_boh.28.entry: "$flavor_boh.28.title$"
 flavor_boh.28.desc: "Жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] после долгого трудового дня любят выпить кружку-другую освежающего #TOOLTIP:GOODS,beer,X #L пива#!#!. Любовь к этому напитку здесь настолько крепка, что многие даже начали варить пиво у себя дома, и теперь пивоварни работают повсеместно и в городах, и в сёлах.\n\nПохоже, что каждая семья варит свой неповторимый сорт пива, а где жажда, там и прибыль… Многие выдающиеся [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] просят нас обеспечить постоянное производство пива, чтобы местные сорта прославились повсюду."
 flavor_boh.28.a: "Так тому и быть."
 flavor_boh.28.b: "Никакого алкоголя! За работу!"
 flavor_boh.29.title: "Великое начинается с малого"
 flavor_boh.29.entry: "$flavor_boh.29.title$"
 flavor_boh.29.desc: "Многие [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] мечтают о яркой жизни и высоком положении. Мы не против, чтобы народ стремился к успеху, однако нет ничего зазорного в том, чтобы трудиться на земле: это честный и уважаемый труд.\n\nНекоторым, впрочем, всё-таки удаётся воплотить свою мечту. В [target_capital_location.Custom('LR_PREP')|l] [target_capital_location.GetName] ходят слухи о том, что якобы в тех краях появился умелый и доблестный воин, но если вникнуть в подробности, довольно сложно сказать, где там правда, а где вымысел.\n\n[target_character.GetName] — сын кузнеца. Его родную деревню Стршибрна-Скалице рядом с [target_location.Custom('LR_INST')|l] [target_location.GetName] сожгли во время войны. Он был вынужден с юных лет взяться за меч. Обучившись воинскому искусству и променяв мирную жизнь на битвы и подвиги, он отправился странствовать. И вот, теперь [target_character.GetShortNameWithNoTooltip] пришёл к нам."
 flavor_boh.29.a: "Из него выйдет отличный начальник!"
 flavor_boh.29.b: "Он забывает своё место."
 flavor_boh.30.title: "В [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] найдено серебро"
 flavor_boh.30.entry: "Серебро в Яхимове"
 flavor_boh.30.desc: "Нам сообщили, что крестьяне из [target_location.Custom('LR_GEN')|l] [target_location.GetName] обнаружили чистейшие залежи #TOOLTIP:GOODS,silver,X #L серебра#!#!. Местность оказалась крайне удачной: залежи готовы к разработке и, по нашим оценкам, запасы драгоценного металла здесь весьма велики.\n\nОткрыв здесь рудник, мы не только увеличим благосостояние местных жителей, но и привлечём новых поселенцев, желающих заработать на добыче серебра."
 flavor_boh.30.a: "Хорошо. Вложим средства в добычу."
 flavor_boh.30.b: "Нет. Распределим всё, что можно добыть без труда, и не будем нарушать сложившийся порядок."
 flavor_boh.31.title: "Корона [ROOT.GetCountry.Custom('CL_GEN')]"
 flavor_boh.31.entry: "$flavor_boh.31.title$"
 flavor_boh.31.desc: "[target_art.GetName] на голове, а #TOOLTIP:AREA,bohemia_area,X #L Богемия#!#!, #TOOLTIP:AREA,moravia_area,X #L Моравия#!#! и #TOOLTIP:AREA,silesia_area,X #L Силезия#!#! в руках: [ROOT.GetCountry.GetLongName] — [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName|l] из числа самых сильных в Европе, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] — далеко не самый слабый игрок. Советники преподнесли нам идею: у нас есть [target_art.GetNameWithNoTooltip|l], а значит, разумно было бы присовокупить это слово к названию [ROOT.GetCountry.Custom('longname_ru_wntt_GEN')]."
 flavor_boh.31.a: "Отныне мы — Корона [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_boh.31.a.entry: "Отныне мы правим Богемией."
 flavor_boh.31.b: "Нас и так всё устраивает."
 crown_of_bohemia_tt: "Наша держава будет называться #Y Корона [GetCountry('BOH').Custom('CL_GEN')]#!"
 flavor_boh.32.title: "Судьба [GetCountry('LUX').Custom('CL_GEN')]"
 flavor_boh.32.entry: "Судьба Люксембурга"
 flavor_boh.32.desc: "Герцогства, которыми правит [target_character.GetName] — не только как [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, но и как [GetCountry('LUX').GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[GetCountry('LUX').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LUX').Custom('CL_tt')],X [GetCountry('LUX').Custom('CL_GEN')|L]#!#! — недавно стали значительно больше после того, как [Select_CString(target_character.IsFemale, 'её', 'его' )] избрали [Select_CString(target_character.IsFemale, 'императрицей', 'императором' )] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!. Это значительно усложняет бюрократию, в том числе в отношении титулов. Однако выход есть. [GetCountry('LUX').GetLongNameWithNoTooltip] — эта держава может отойти другому правителю, и тогда руководить ей будет [target_heir.GetName|l].\n\nИ хотя [target_character.GetNameWithNoTooltip] в этом случае будет испытывать меньше забот при управлении своими владениями, принадлежащие [Select_CString(target_character.IsFemale, 'ей', 'ему' )] территории станут меньше (пусть даже управлять ими продолжит династия [target_character.GetDynasty.GetName]). Если же оставить всё как есть, другие правители могут воспринять нас как угрозу, увидев, сколькими титулами одновременно владеет [target_character.GetShortNameWithNoTooltip]."
 flavor_boh.32.a: "Немедленно передать владение [Select_CString(target_heir.IsFemale, 'новой правительнице', 'новому правителю' )]!"
 flavor_boh.32.b: "Нет, это всё наше!"
 flavor_boh.33.title: "Продажа [GetCountry('BRA').Custom('longname_ru_wntt_GEN')]"
 flavor_boh.33.entry: "Покупка Бранденбурга"
 flavor_boh.33.desc: "[GetCountry('BRA').GetLongName] — эта держава давно пользуется в #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! немалым влиянием, как, впрочем, и династия [target_bra_ruler.GetDynasty.GetName]. Кроме того, [target_ruler.GetName] — [GetUniqueInternationalOrganization('hre').GetLeaderTitle|l], поэтому нам следует добиться, чтобы нас назначили выборщиками: такой чин окажется исключительно полезным. [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.Custom('CL_GEN')] — хороший титул, однако владение [GetCountry('BRA').Custom('CL_INST')] не только позволит нам стать выборщиками, но и ограничит влияние династии [target_bra_ruler.GetDynasty.GetNameWithNoTooltip].\n\nЭтот род безнадёжно опьянён жадностью и стремлением к власти, поэтому мы могли бы предложить им перекупить владение [GetCountry('BRA').Custom('CL_INST')] (владельцем, соответственно, станет [target_character.GetName]) и посмотреть, сколько они за него запросят."
 flavor_boh.33.a: "Сделаем им такое предложение."
 flavor_boh.33.b: "Найдутся и более полезные траты."
 flavor_boh.33.tt: "[GetCountry('BRA').GetLongName] — эта держава получит от нас предложение о покупке"
 flavor_boh.33.historical_info: "В 1373 году король Богемии и император Священной Римской Империи Карл IV приобрёл для своего сына и наследника Вацлава IV Бранденбургскую марку. Правил ей, однако, сам Карл, поскольку Вацлав был ещё слишком юн. Благодаря этой покупке император заодно заручился ещё одним голосом курфюрста. Впоследствии, однако, влияние династии Люксембургов ослабло, поэтому, когда ещё одному сыну Карла — Сигизмунду — пришёл черёд избираться на должность императора, голоса выборщиков он приобрёл, передав наследственные права на Бранденбург династии Гогенцоллернов."
 flavor_boh.34.title: "[GetCountry('BOH').GetLongNameWithNoTooltip] — потенциальный покупатель [ROOT.GetCountry.Custom('rank_ru_GEN')|l]"
 flavor_boh.34.desc: "[GetCountry('BOH').GetLongName] — эта держава ведёт себя необычайно смело, ведь её владыка после недавних выборов ещё и император #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!. Теперь они пытаются взять выборы в свои руки и даже выдвинули смелое предложение продать им наше государство, править которым в таком случае станет [target_character.GetName].\n\nИ хотя династия [target_bra_ruler.GetDynasty.GetName] после этого утратит значительную долю своего влияния, деньги за продажу могут пойти на развитие оставшихся земель. Кроме того, власть рода [target_bra_ruler.GetDynasty.GetName] и защита со стороны [GetCountry('BOH').Custom('CL_GEN')] могут оказаться предпочтительнее существующего порядка."
 flavor_boh.34.a: "Выставим им цену."
 flavor_boh.34.b: "Мы не продаёмся!"
 flavor_boh.34.tt: "[GetCountry('BOH').GetLongName] — эта держава получит от нас предложение цены"
 flavor_boh.35.title: "Ответ [GetCountry('BRA').Custom('longname_ru_wntt_GEN')]"
 flavor_boh.35.desc_no_heir: "$flavor_boh.35.desc$\n\nОднако принять это предложение у нас некому, поскольку [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] отсутствует."
 flavor_boh.35.desc: "[GetCountry('BRA').GetLongName] — власти этой державы присылают ответ, указав в нём сумму, которую считают допустимым возмещением за продажу части своей территории и воцарение другого правителя, ведь тогда [GetCountry('BRA').GetGovernment.GetRulerTitle|l] лишится своего престола, а восседать на нём будет [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] нашего государства."
 flavor_boh.35.a: "Это приемлемо."
 flavor_boh.35.b: "Увы, это неприемлемо."
 flavor_boh.36.title: "Четыре статьи [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]"
 flavor_boh.36.entry: "$flavor_boh.36.title$"
 flavor_boh.36.desc: "Последние несколько лет прошли в безостановочной борьбе за нашу веру. Счёт нашим погибшим праведникам идёт на тысячи, а народ, некогда кроткий и безропотный, обратился в неистовство и теперь готов воевать против всех подряд. Но вот наконец-то наступил шаткий мир. Мы собираем раненых, готовимся праздновать победу и возносить почести убитым, однако главное — мы сели за стол переговоров с теми, кто открыто стремился уничтожить нашу религию.\n\nВозможно, сам Господь дал нам силы бросить вызов погрязшей в свей гордыне и иных грехах #TOOLTIP:RELIGION,$catholic_tt$,X #L католической#!#! церкви. Теперь же необходимо решить, выдвинуть ли этим подлецам наши требования или отклонить их мольбы о перемирии и продолжить поход против разложения католических нравов."
 flavor_boh.36.a: "Может, пришло время для мира?"
 enable_4_articles_prague_reform: "Открывает [Concept('government_reform', 'государственный принцип')|e] «[ShowGovernmentReformName('four_articles')]»"
 flavor_boh.36.b: "Хватит разговоров!"
 STATIC_MODIFIER_NAME_bohemian_aggression_modifier: "Богемская агрессия"
 STATIC_MODIFIER_DESC_bohemian_aggression_modifier: "Враг, не сумев искоренить нашу веру, запросил о мире. Однако теперь за оружие возьмёмся уже мы и уничтожим их раз и навсегда!"
 opinion_hussite_aggression_modifier: "Отклонили четыре статьи"
 boh_widespread_condemnation_tt: "Каждая #TOOLTIP:RELIGION,$catholic_tt$,X #L католическая#!#! держава получит [ShowBiasValue('opinion_hussite_aggression_modifier')|+=0] к мнению о нас"
 four_articles: "Четыре статьи"
 four_articles_desc: "Это требования, которые наши государственные и религиозные деятели выдвинули врагам — участникам крестовых походов, объявленных папой в жалкой попытке подавить наши верования."
 flavor_boh.36.historical_info: "Четыре пражские статьи (они же просто четыре статьи) — список требований, выдвинутых в XV веке на Ферраро-Флорентийском соборе последователями богемского реформатора Яна Гуса. Они сыграли немаловажную роль в истории движения гуситов — предвестников протестантской Реформации. Среди заявленных требований были свобода проповедования слова Божьего и причащения, реформа церкви как института и изгнание грешников из её рядов."
 jan_hus_executed_boh: "[GetCharacter('boh_jan_hus').GetNameWithNoTooltip] казнён"
 jan_hus_executed_pap: "[GetCharacter('boh_jan_hus').GetNameWithNoTooltip] казнён"
 jan_hus_free_boh: "[GetCharacter('boh_jan_hus').GetNameWithNoTooltip] освобождён"
 jan_hus_free_pap: "[GetCharacter('boh_jan_hus').GetNameWithNoTooltip] освобождён"
 flavor_boh.38.title: "Воссоединение Праги"
 flavor_boh.38.entry: "Воссоединение Праги"
 flavor_boh.38.desc: "#TOOLTIP:LOCATION,prague,X #L Прага#!#! уже не первое столетие носит звание #L [ROOT.GetCountry.GetAdjective|l]ой#! столицы — и делает это с заслуженной гордостью. Однако в свете последних достижений науки и начала индустриализации стало очевидно, что инфраструктура этого [target_location.Custom('LR_GEN')|l] слишком устарела. Чтобы столица могла развиваться и дальше на радость своим жителям, все районы [target_location.Custom('LR_GEN')|l] следует объединить и составить единый инфраструктурный план, без которого расширение Праги будет невозможно."
 flavor_boh.38.a: "Нужно выделить деньги на обновление Праги."
 flavor_boh.38.b: "Это слишком дорого."
 flavor_boh.38.historical_info: "В 1784 году четыре исторических района Праги — Старе-Место, Нове-Место, Мала-Страна и Градчаны — были объединены в один, после чего перестали считаться самостоятельными городами."
 flavor_boh.40.title: "Расширение Кутна-Горы"
 flavor_boh.40.entry: "Расширение Кутна-Горы"
 flavor_boh.40.desc: "#TOOLTIP:LOCATION,kutna_hora,X #L Кутна-Гора#!#! — основа основ #L [ROOT.GetCountry.GetAdjective|l]ого#! богатства: её глубокие #TOOLTIP:GOODS,silver,X #L серебряные#!#! рудники питают нашу экономику. Историческую и экономическую важность Кутна-Горы не описать словами, поскольку без неё наша казна бы пустовала, а различные начинания — были бы просто невозможны. Мы можем вложить в развитие местного шахтёрского дела дополнительные средства, чтобы город развивался и дальше, а богатства его стали достоянием и последующих поколений."
 flavor_boh.40.a: "Вложимся в расширение."
 flavor_boh.40.b: "В этом нет смысла."
 flavor_boh.40.a.tt: "Вложение в инфраструктуру Кутна-Горы снизит риски обвалов и наводнений."
 flavor_boh.41.title: "Затопление Кутна-Горы"
 flavor_boh.41.entry: "Затопление Кутна-Горы"
 flavor_boh.41.desc: "#TOOLTIP:GOODS,silver,X #L Серебряные#!#! рудники #TOOLTIP:LOCATION,kutna_hora,X #L Кутна-Горы#!#! в последнее время всё чаще заливает водой. Затопление главных рудников, в которых находятся самые большие жилы, грозит уничтожить местные шахтёрские традиции, складывавшиеся на протяжении столетий. Правительство Кутна-Горы попросило нас помочь им спасти из рудников всё, что ещё можно спасти, однако поиски в обвалившейся шахте — это и дорого, и опасно."
 flavor_boh.41.a: "Мы сделаем всё, что сможем."
 flavor_boh.41.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 flavor_boh.41.b.entry: "$common_string_nothing_we_can_do_about_it$"
 flavor_boh.41.historical_info: "В XVI–XVII веках на Кутна-Гору обрушилась череда разрушительных наводнений. Горная промышленность города пострадала настолько, что так и не смогла восстановиться до конца."
 flavor_boh.42.title: "Общеславянский съезд [GetCurrentYear] года"
 flavor_boh.42.entry: "Общеславянский съезд"
 flavor_boh.42.desc: "По всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!, словно пожар, распространяются идеи национализма. Не обошли они стороной и представителей #TOOLTIP:CULTUREGROUP,slavic_group,X #L славянских#!#! народов, которые собрались в #TOOLTIP:LOCATION,prague,X #L Праге#!#!, чтобы обсудить взаимопомощь. Уже сейчас становится очевидно растущее влияние всеславянского движения за взаимодействие между славянскими народами а также совместное развитие народной словесности и обычаев. Некоторые даже призывают к объединению всех славян под одним знаменем. Весьма вероятно, что в будущем это движение станет серьёзной силой."
 flavor_boh.42.a: "Слава роду!"
 flavor_boh.42.historical_info: "Первый общеславянский съезд, прошедший в Праге, стал серьёзным шагом к продвижению идеи единства между славянскими народами. На нём же впервые были приняты сине-бело-красный панславянский флаг и гимн «Гей, славяне!»."
 flavor_boh.43.title: "[target_character.GetNameWithNoTooltip]"
 flavor_boh.43.entry: "Ян Амос Коменский"
 flavor_boh.43.desc: "Монах-каликстинец [target_character.GetName] — поборник всеобщего образования, известный под прозвищем «Народный учитель». Его изобретательные подходы к обучению и попытки перестроить систему образования в целом уже оказали немалое влияние на наше общество и постепенно получают всё больше признания. Не стоит упускать возможность применить такой бесценный опыт на службе #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!."
 flavor_boh.43.a: "Такой талант наверняка пригодится при дворе."
 flavor_boh.43.a.entry: "Двор наверняка найдёт применение такому таланту."
 flavor_boh.43.historical_info: "Ян Амос Коменский, он же Комений, — основоположник современной педагогической системы и сторонник всеобщего образования. Разработал передовые методы обучения, сделав упор на понимание предмета и критическое мышление вместо механического заучивания."
 flavor_boh.44.title: "Золотой город Прага"
 flavor_boh.44.entry: "Золотой город Прага"
 flavor_boh.44.desc: "Наша чудесная столица #TOOLTIP:LOCATION,prague,X #L Прага#!#! — крупнейший город #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#! — в народе известна под прозвищем «Золотой город» и неизменно манит к себе жителей даже самых далёких краёв. Сюда съезжаются и учёные, и купцы, и ремесленники, и каждый из них вносит свой неповторимый вклад в процветание столицы. На их талантах и деньгах зиждятся наши культура и могущество."
 flavor_boh.44.a: "Великолепно!"
 STATIC_MODIFIER_NAME_the_golden_city_of_prague: "Золотой город"
 flavor_boh.44.historical_info: "В годы правления Карла IV процветающая столица Богемии превратилась в крупный политический, культурный и экономический центр. Поскольку здесь заседал сам император, Прага де-факто стала столицей и Священной Римской Империи, что поспособствовало стремительному развитию города. При Карле были построены такие известные достопримечательности, как Карлов мост, Нове-Место и собор Святого Вита."
 flavor_boh.45.title: "Открытие рукописи Войнича"
 flavor_boh.45.entry: "$flavor_boh.45.title$"
 flavor_boh.45.desc: "Ректор Карлова университета в #TOOLTIP:LOCATION,prague,X #L Праге#!#! при изучении архивов обнаружил крайне необычную рукопись, написанную на неизвестном языке и дополненную загадочными рисунками. Сам кодекс посвящён целому множеству предметов — от астрологии до рецептов, однако разгадать написанное не в силах ни один учёный. Вокруг рукописи ведутся ожесточённые споры: кто-то предлагает сохранить её для последующего изучения, а другие опасаются, что в архивы каким-то образом попал гримуар, написанный на языке дьявола."
 flavor_boh.45.a: "Сохраним это необычное произведение."
 flavor_boh.45.b: "Сжечь его — оно богопротивно!"
 voynich_manuscript: "Рукопись Войнича"
 flavor_boh.45.historical_info: "Рукопись Войнича — загадочный иллюстрированный средневековый кодекс, написанный на неизвестном языке с нерасшифрованной письменностью. Его предназначение и происхождение не раскрыты и по сей день."
 flavor_boh.46.title: "[target_character.GetNameWithNoTooltip]"
 flavor_boh.46.entry: "Ян Рокицана"
 flavor_boh.46.desc: "[target_character.GetName] — важный представитель #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситского#!#! движения — служит архиепископом #TOOLTIP:LOCATION,prague,X #L Праги#!#!. И хотя вокруг разворачиваются жаркие религиозные конфликты, его приверженность делу гуситов и попытки примирить между собой умеренное и радикальное течение не остались незамеченными [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. [target_character.GetLastNameWithNoTooltip] превосходно разбирается в богословии и умеет вести религиозные диспуты, а потому никто другой не справится с распространением нашей веры лучше него."
 flavor_boh.46.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_boh.46.a.entry: "$common_string_brilliant$"
 flavor_boh.46.historical_info: "Ян Рокицана — один из важнейших деятелей гуситского движения, опытный руководитель и богослов, оказавший немалое влияние на религиозные и политические реформы в землях Богемской короны. Распространял идеи гуситов и стремился объединить соперничающие течения, значительно повлияв тем самым на религиозную обстановку в королевстве."
 flavor_boh.47.title: "[target_character.GetNameWithNoTooltip]"
 flavor_boh.47.entry: "Иржи Мелантрих из Авентина"
 flavor_boh.47.desc: "[target_character.GetName] — громкое имя в #TOOLTIP:DIALECT,czech_dialect,X #L чешской#!#! литературе: он издатель, печатник и переводчик. Благодаря его вкладу в развитие чешского языка и стремлению сделать книги доступными для народа у нас в державе растёт уровень грамотности. Вместе с этим растёт и влияние, которым пользуется [target_character.GetName], поэтому его знания следует поставить на службу [ROOT.GetCountry.Custom('rank_ru_DAT')|l] — такая возможность у нас есть."
 flavor_boh.47.a: "Нельзя, чтобы это умение пропадало зря."
 flavor_boh.47.historical_info: "Иржи Мелантрих из Авентина — чешский печатник и издатель, внёсший значительный вклад в культурное и интеллектуальное развитие Богемии. Благодаря выпуску и распространению литературных и научных трудов помог не только сохранить, но и развить чешский язык и литературу, поспособствовав подъёму чешской культуры в целом."
 STATIC_MODIFIER_NAME_melantrichs_efforts: "Старания Мелантриха"
 flavor_boh.48.title: "[target_character.GetNameWithNoTooltip]"
 flavor_boh.48.entry: "Килиан Игнац Динценхофер"
 flavor_boh.48.desc: "[target_character.GetName] — один из самых выдающихся архитекторов #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, работающих в стиле барокко. Каждому известны его знаменитые шедевры, такие как церковь Святого Николая в #TOOLTIP:LOCATION,prague,X #L Праге#!#! или Бржевновский монастырь. При работе [target_character.GetLastNameWithNoTooltip] постоянно изобретает что-то новое и проявляет огромное внимание к деталям, за что пользуется большим уважением. Число сооружений, к которым он приложил руку, уже перевалило за сорок. Наверняка [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] обрадуется, если этот человек получит придворную должность."
 flavor_boh.48.a: "Мы весьма ценим его труды."
 flavor_boh.48.historical_info: "Архитектурные работы Динценхофера в стиле барокко, такие как церковь Святого Иоанна Непомука или Пражская Лорета, полюбились не только его современникам, но и потомкам. Свойственные архитектору новаторство и внимание к деталям стали ключевым фактором в истории архитектуры и культуры королевства."
 flavor_boh.49.title: "[target_character.GetNameWithNoTooltip]"
 flavor_boh.49.entry: "Йосеф Добровский"
 flavor_boh.49.desc: "Знаменитый языковед и историк [target_character.GetName] — один из важнейших деятелей #TOOLTIP:CULTURE,$czech_tt$,X #L чешского#!#! национального возрождения, который вдохновлялся идеями #TOOLTIP:INSTITUTION,enlightenment,X #L Просвещение#!#! и только начавшимися складываться представлениями о национальных государствах. [target_character.GetLastNameWithNoTooltip] горячо призывает других сохранять и возрождать чешский язык, культуру и самосознание.\n\nЕго научные труды и преданность заботе о культурном достоянии вызывают неподдельную гордость и чувство единства у чешского народа. У чехов начинает просыпаться массовое осознание, которое наверняка предопределит будущее всей державы."
 flavor_boh.49.a: "Мы поддерживаем его взгляды."
 flavor_boh.49.b: "Поддержав его, мы разозлим меньшинства."
 flavor_boh.49.historical_info: "Йосеф Добровский — одна из важнейших фигур чешского национального возрождения. Выступал за сохранение и развитие чешского языка и культуры, чем помог пробудить в народе чувство гордости и национального самосознания. Под влиянием его научных трудов и стараний поддержать культурное наследие народа складывалось чешское национальное самосознание той эпохи."
 flavor_boh.50.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий кристалл"
 flavor_boh.50.entry: "$flavor_boh.50.title$"
 flavor_boh.50.desc: "Уже не первое столетие почти все стеклодувы пользуются исключительно #L [GetCountry('VEN').GetAdjective|l]им#!#TOOLTIP:GOODS,glass,X #L стеклом#!#!, а цеха поменьше стараются повторить успехи мастеров с острова Мурано. На территории #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! стекло производят ещё с XII века, однако лишь сегодня, когда стало возможно совмещать добываемый у нас мел с поташем, [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие стеклодувы наконец оказались способны бросить вызов своим [GetCountry('VEN').GetAdjectiveWithNoTooltip|l]им соперникам.\n\nНовая разновидность [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого хрусталя прочнее и ярче, чем [GetCountry('VEN').GetAdjectiveWithNoTooltip|l]ий хрусталь, а главное — она заметно отличается внешне. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие хрустальные люстры, стеклянные украшения и гравировки по стеклу всё чаще начинают встречаться при дворах #TOOLTIP:CONTINENT,europe,X #L Европы#!#!."
 flavor_boh.50.a: "Всё кристально ясно."
 flavor_boh.50.a.tt: "[Concept('prosperity', 'Процветание')|e] каждого принадлежащего нам [Concept('location', 'района')|e] с #TOOLTIP:BUILDING_TYPE,market_village,X #L торговой деревней#!#! или #TOOLTIP:BUILDING_TYPE,glassworks,X #L стекольной фабрикой#!#! увеличивается на #G 20%#!."
 flavor_boh.51.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие традиции пивоварения"
 flavor_boh.51.entry: "$flavor_boh.51.title$"
 flavor_boh.51.desc: "#TOOLTIP:GOODS,beer,X #L Пиво#!#! — древняя и неотъемлемая часть нашей культуры. Полакомиться этим жидким золотом, которое по праву считается народным #TOOLTIP:CULTURE,$czech_tt$,X #L чешским#!#! напитком, любят все: короли в роскошных замках, знать в величественных усадьбах, простые крестьяне в скромных хатах… К становлению этого обычая приложили руку и монастыри: на протяжении долгих столетий они совершенствовали свои методы пивоварения, поэтому монастырское пиво — одно из вкуснейших на территории [ROOT.GetCountry.Custom('rank_ru_GEN')|l].\n\nИстория чешского пива насчитывает не одну сотню лет. Каждое поколение дорабатывает рецепты, доставшиеся им от предков, и затем передаёт их потомкам. Эта традиция не только объединяет наш народ, но и помогает наполнять казну."
 flavor_boh.51.a: "Na zdraví!"
 flavor_boh.51.a.tt: "Каждый принадлежащий нам [Concept('location', 'район')|e] с #TOOLTIP:BUILDING_TYPE,brewery,X #L пивоварней#!#!, #TOOLTIP:BUILDING_TYPE,beer_workshop,X #L пивоваренной мастерской#!#!, #TOOLTIP:BUILDING_TYPE,brewery_manufactory,X #L крупным пивзаводом#!#! или #TOOLTIP:BUILDING_TYPE,brewery_mill,X #L пивоваренным заводом#!#! получает [ShowNamedValue('prosperity_severe_bonus')|+=2%] к [Concept('prosperity', 'процветанию')|e]"
 flavor_boh.52.title: "Болотное чудище из Визовице"
 flavor_boh.52.entry: "Болотное чудище из Визовице"
 flavor_boh.52.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] получает тревожные донесения из области близ #TOOLTIP:LOCATION,vizovice,X #L Визовице#!#!. Среди местных жителей стремительно, как пожар, разносится леденящий кровь слух: на болотах поселилось ужасное чудовище, которое похищает и пожирает беспомощных крестьян. Народ настолько запуган, что о порядке в селе пришлось позабыть. Некоторые советники предлагают отправить туда войско с приказом поймать чудовище и положить конец зловредным слухам, однако другие уверены, что это просто народные байки и [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] не должны тратить деньги и время на подобные мелочи."
 flavor_boh.52.a: "Отправим отряд и выясним, что происходит."
 flavor_boh.52.b: "Нельзя быть такими суеверными…"
 #has_variable custom tooltips
