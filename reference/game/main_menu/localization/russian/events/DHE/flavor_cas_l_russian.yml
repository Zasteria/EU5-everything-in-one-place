 flavor_cas.1900.desc: "Our [ShowCultureName('catalan')] provinces have risen in open revolt. Forced to quarter our armies and bear the burdens of the war effort under our rule, the populace has turned on the authority of [target_ruler.GetName] and on the [ROOT.GetCountry.GetFlavorRank] itself. Riots have broken out in more than one settlement, the countryside is aflame, and the rebels already look to our enemies for protection.\n\nWe must decide how to answer this defiance, lest we see ourselves engulfed in the flames of the revolt."
 flavor_cas.1901.desc_subject: "Discontent festers across [GetCountry('POR').GetName]. Though the [GetCountry('POR').GetFlavorRank] still keeps its own laws and customs beneath our crown, there are many [ShowCultureName('portuguese')] people who dream of an independent kingdom once more.\n\n[target_ruler.GetName] must decide how firmly our [ROOT.GetCountry.GetFlavorRank] should hold our territories together."
 flavor_cas.1901.desc_annexed: "Our [ShowCultureName('portuguese')] lands, long since absorbed into the [ROOT.GetCountry.GetFlavorRank], have risen in revolt. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] rally behind [target_character.GetName] and proclaim the restoration of an independent kingdom.\n\n[target_ruler.GetName] must decide how to meet this rebellion."
 flavor_cas.1902.desc: "Popular revolution has erupted across our [ShowCultureGroupName('italian_group')] possessions. In many of our settlements there, the people have risen against the crushing taxes levied to fund our wars, and revolutionary governments now hold the streets. Their fury strikes at the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] as much as at the rule of [target_character.GetName].\n\nThe [ROOT.GetCountry.GetFlavorRank] must restore order before the contagion spreads."
