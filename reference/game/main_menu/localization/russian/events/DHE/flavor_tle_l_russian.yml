l_russian:
 banu_al_wad: "Бану Абд аль-Вад"
 FATE_OF_TLEMCEN: "Судьба [ShowLocationNameWithNoTooltip('tlemcen')]"
 flavor_tle.1.title: "Падение города [capital_scope.GetNameWithNoTooltip]"
 flavor_tle.1.desc: "Город [capital_scope.GetName], столица нашей славной державы, пал под натиском вражеских войск. Но что ещё хуже, [Select_CString(ruler_scope.IsFemale,'наша дорогая правительница', 'наш дорогой правитель')] [ruler_scope.GetName] и [Select_CString(ruler_scope.IsFemale,'её', 'его')] сыновья были подло убиты во время нападения.\n\nЖители [ROOT.GetCountry.Custom('rank_ru_GEN')] потрясены этой чудовищной трагедией, и все понимают, что теперь дать отпор врагу будет ещё сложнее…"
 flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 tle_morrocan_tlemcen_war: "Если [target_location.GetName] будет захвачен [mor_scope.GetLongName] в ходе [target_war.GetName], [mor_scope.GetName] сможет силой превратить [tle_scope.GetName] в [ShowSubjectTypeName('fiefdom')]"
 tle_additional_warning: "[target_siege.GetName] необходимо снять как можно скорее!"
 flavor_tle.2.title: "Падение города [target.GetNameWithNoTooltip]"
 flavor_tle.2.desc: "[target.GetName], жемчужина [target.GetArea.GetName], наконец пала под нашей осадой и сдалась нашим могучим армиям. Как только ворота открылись, наши войска ворвались в [target.GetRank.GetName], стремясь захватить главную цитадель в надежде на добычу и пленников. В цитадели оказалось множество членов [target_country.GetGovernment.GetAdjective] семьи, которых наши солдаты быстро схватили и вывели к [from_country.GetAdjective] генералам. Быть может, это конец [target_war.GetName]?"
 flavor_tle.2.a: "Позаботьтесь о том, чтобы [target_dynasty.GetNameWithNoTooltip] не стали помехой."
 flavor_tle.2.b: "Вперёд, на [ShowLocationNameWithNoTooltip('oran')]!"
 TLE_once_truce_ends_zayyanid_pretenders_tt: "Once the [truce|e] with [target_country.GetName] ends, they will have access to the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e], allowing them to declare a special [ShowCasusBelliName('cb_independence_war')] [war|e]"
 flavor_tle.3.title: "$flavor_tle.2.title$"
 flavor_tle.3.desc: "Столица нашего возлюбленного [ROOT.GetCountry.GetFlavorRank], [target.GetName], пала перед нашими злодейскими врагами из [from_country.GetLongName]. К этой трагедии добавилось то, что многие члены нашей возлюбленной семьи [target_dynasty.GetName] погибли во время штурма.\n\nЭта катастрофа вызвала волну отчаяния по всей [ROOT.GetCountry.GetLongName] и сделала продолжение войны практически невозможным. Хотя одних лишь убийств недостаточно, чтобы парализовать страну, потеря доверия к руководству — вполне достаточна. Оставшись без поддержки наших племенных союзников, наш боевой дух находится на самом низком уровне, и, не имея сложившегося движения сопротивления, это означает конец [target_war.GetName]."
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]."
 TLE_as_per_the_warning: "Мы не вняли предупреждениям и допустили, чтобы наш возлюбленный [target.GetName] был захвачен. Семья [target_dynasty.GetName] истреблена, и теперь мы — [ShowSubjectTypeName('fiefdom')] [from_country.GetName]."
 zayyanid_pretenders_decision.title: "Возвести на трон принца [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]"
 zayyanid_pretenders_decision.desc: "Правление [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] в лучшем случае неудобно для [ROOT.GetCountry.GetLongName], а в худшем — тиранично. Пригласим же принца [ShowDynastyName('zayyanid_dynasty')] вновь править нами и объединим все [ShowEstateTypeName('tribes_estate')] против общего врага."
 zayyanid_pretenders_decision.desc.entry: "The rule of our overlord is truly tyrannical. It shakes the superiority of the $banu_al_wad$ tribes to the very core. Let us invite a [ShowDynastyName('zayyanid_dynasty')] prince to rule us again, and unite all the [ShowEstateTypeName('tribes_estate')] against a common foe."
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 zayyanid_pretenders_decision.a.entry: "$common_string_great$"
 zayyanid_prince_takes_over: "Принц [ShowDynastyName('zayyanid_dynasty')] [dynasty|e] приходит к власти"
 flavor_tle.4.title: "$flavor_tle.7.title$"
 flavor_tle.4.desc: "Ситуация в [from_country.GetName] становится всё более и более безнадёжной. Многие претенденты из династии [target_dynasty.GetName] вышли из тени и активно ищут поддержки среди племён [ShowCultureName('zenati')] в этих землях. Если нам не удастся заручиться благосклонностью местных сословий, [target_location.GetName] может стать очагом народного восстания, что положит конец нашей власти над [ShowRegionName('maghreb_region')]. Сможет ли [target_country.GetName] выстоять перед такой бурей?"
 flavor_tle.4.a: "Мы должны прислушаться к этим предупреждениям."
 tle_rules_for_zayyanid_pretenders: "If [target_country.GetName] fails to keep the [from_country.GetLongName] [subject_loyalty|e] above #Y 30#! during any of the following #Y 20#! years, [from_country.GetName] will be able to declare [ShowCasusBelliName('cb_independence_war')] [war|e] with the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e]"
 tle_rules_part_two: "Если это произойдёт, [from_country.GetName] получит значительные бонусы к военной силе, а [target_country.GetName] получит следующее:"
 flavor_tle.5.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] возвращаются в [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]!"
 flavor_tle.5.desc: "[target_character.GetName], претендент на [from_country.GetAdjective] престол, только что вступил в [ROOT.GetCountry.GetCapital.GetName] под овацию [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] и представителей [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]. Этот шаг — открытое объявление войны от [from_country.GetName] против [target_country.GetLongName], государства, которое правило [ROOT.GetCountry.GetCapital.GetName] слишком долго. [target_character.GetShortNameWithNoTooltip] пользуется широкой поддержкой в [from_country.GetNameWithNoTooltip], но самое главное — обеспечил себе [ShowModifier('tle_zayyanid_tribe_support')]: поддержку крупнейшего и самого могущественного племени [ShowCultureName('zenati')] в [ROOT.GetCountry.GetFlavorRank], родного племени дома [target_dynasty.GetName].\n\nМы покажем этим ублюдкам из [target_country.GetAdjectiveWithNoTooltip], кто одержит победу в [target_war.GetName]!"
 flavor_tle.5.a: "Слава да будет [ROOT.GetCountry.GetReligion.GetGodName]!"
 zayyanid_pretender_effect: "Мы объявим [ShowCasusBelliName('cb_independence_war')] против нашего [overlord|e] и получим дополнительные преимущества по следующему событию:"
 flavor_tle.6.title: "Восстание в [from_country.GetLongNameWithNoTooltip]!"
 flavor_tle.6.desc: "Все наши искренние усилия — дарованные привилегии, дипломатические миссии, роскошные подарки, назначенные должности — оказались напрасны, ибо племена [from_country.GetName] всё ещё предпочитают поддерживать тирана [target_character.GetName] из дома [target_dynasty.GetName], а не более милостивое правление [target_country.GetAdjective].\n\nПусть будет так! Пусть они познают гнев наших армий! Мы обрушим на них божественную кару [ROOT.GetCountry.GetReligion.GetGodName] и добудем победу в [target_war.GetName]!"
 flavor_tle.6.a: "Наша гегемония в [ShowRegionNameWithNoTooltip('maghreb_region')] непоколебима!"
 flavor_tle.7.title: "[target_dynasty.GetNameWithNoTooltip] претенденты"
 flavor_tle.7.entry: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] претенденты"
 flavor_tle.7.desc: "За последние несколько лет многие уцелевшие члены рода [target_dynasty.GetName] вышли из тени, пытаясь заявить свои права на [target_location.GetName] и [from_country.GetAdjective] престол. Они пользуются сдержанной поддержкой среди населения и [target_country.GetGovernment.GetEstateName('tribes_estate')], и общественные настроения постепенно склоняются в их пользу. Если наши повелители из [target_country.GetLongName] продолжат усугублять кризис в [target_location.GetProvince.GetName], мы вполне можем увидеть возвращение рода [target_dynasty.GetNameWithNoTooltip] к власти."
 flavor_tle.7.a: "Возможно, это пойдёт нам на пользу."
 flavor_tle.8.title: "The [ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]"
 flavor_tle.8.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] of [ROOT.GetCountry.GetName] have recently issued a new fatwā, permitting our religious brethren to practice #italic Taqiyya#! when faced with persecution. Named after the place where it was proclaimed, the [ShowDecisionName('oran_fatwa_decision')] has reached [ShowRegionName('iberia_region')] and is being widely distributed amongst the oppressed [ShowReligionAdjective('sunni')] kin.\n\nThis permission to practice Taqiyya allows the hidden practice of [ShowReligionGroupName('muslim')] while pretending to be of another faith. Normally forbidden in the #italic 'Umma#!, this fatwā allows such practice in [ShowRegionName('iberia_region')]."
 flavor_tle.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tle.8.a.entry: "$common_string_great$"
 oran_fatwa_decision.title: "[ShowLocationNameWithNoTooltip('oran')] Fatwā"
 oran_fatwa_decision.desc: "$flavor_tle.8.desc$"
 oran_fatwa_decision.desc.entry: "Our [ShowReligionAdjective('sunni')] brethren in [ShowRegionName('iberia_region')] are in oppression. We cannot let them remain in #italic Taqiyya#! and their faith falter. A fatwā needs to be issued to aid them in their struggles."
 oran_fatwa_decision.a: "$flavor_tle.8.a$"
 has_more_prestige_than_root_tt: "Has more [prestige|e] than [ROOT.GetCountry.GetName]"
 has_most_prestige_out_of_all_maghrebi_sunni_countries: "Has more [prestige|e] than all [ShowReligionAdjective('sunni')] countries with [capital|e] in [ShowRegionName('maghreb_region')]"
 tle_enable_free_the_mudejar_cb_tt: "[ShowReligionAdjective('sunni')] [countries|e] with [capital|e] in [ShowRegionName('maghreb_region')] will be able to fabricate the [ShowCasusBelliName('cb_free_the_mudejar')] [casus_belli|e] on [ShowReligionGroupAdjective('christian')] targets that have [provinces|e] with [ShowReligionAdjective('sunni')] [pops|e] in [ShowRegionName('iberia_region')]"
 tle_enable_events_for_liberating_mudejar_tt: "[ShowReligionAdjective('sunni')] [countries|e] that [occupy|e] [locations|e] with [ShowReligionAdjective('sunni')] [pops|e] in a [ShowCasusBelliName('cb_free_the_mudejar')] [war|e] will receive [events|e] about liberating the local population"
 flavor_tle.9.title: "Liberation of [target.GetNameWithNoTooltip]"
 flavor_tle.9.desc: "The times of oppression for our [ROOT.GetCountry.GetReligion.GetAdjective] brethren in [target.GetName] might finally be over. For decades now, those poor souls have suffered maltreatment under the tyrannical rule of the [target.GetOwner.GetLongName]. Yet now, having been liberated by our forces, they may finally practice [ShowReligionGroupName('muslim')] in peace. They shall conceal their faith no more."
 flavor_tle.9.a: "Rejoice, brethren!"
 tle_fires_for_all_locations: "This [effect|e] works for every liberated [location|e], but this [event|e] notification is only for [province_capitals|e]"
 flavor_tle.10.title: "Arabization of [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_tle.10.entry: "Arabization of $TLE$"
 flavor_tle.10.desc: "[ShowAreaName('algiers_area')] is but one of the areas of [ShowRegionName('maghreb_region')] being heavily Arabized under the influence of the [ShowCultureGroupName('arabic_group')] [ShowEstateTypeName('tribes_estate')]. As this process progresses, [ShowLanguageName('tamazight_language')] is falling out of use, and the urban elites are embracing the local [ShowLanguageName('arabic_language')] dialect in earnest. Indeed, with increasing immigration from [ShowRegionName('iberia_region')], we are seeing our [ShowEstateTypeName('nobles_estate')] adopt those customs in full. Our state might very well embrace being [ShowCultureName('algerian')] soon."
 flavor_tle.10.a: "We need to strengthen our roots."
 flavor_tle.10.b: "That is our future!"
 flavor_tle.11.title: "Верность обеспечена"
 flavor_tle.11.desc: "Прошли десятилетия с тех пор, как [target_country.GetAdjective] покорение [from_country.GetName] состоялось, и слухи о возвращении [ShowDynastyName('zayyanid_dynasty')] почти утихли. Похоже, нам наконец удалось усмирить [ShowCultureName('zenati')] [from_country.GetGovernment.GetEstateName('tribes_estate')] и главного вождя среди них — $banu_al_wad$. Как только их земли будут интегрированы, мы возвестим новую эру процветания для [ShowRegionName('maghreb_region')]."
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tle_secured: "[from_country.GetName] больше не сможет поднять восстание через [ShowDecisionName('zayyanid_pretenders_decision')]"
 flavor_tle.12.title: "Throwing Off Our Tribal Roots"
 flavor_tle.12.entry: "$flavor_tle.12.title$"
 flavor_tle.12.desc: "The foundations of the [target_country.GetAdjective] state are based upon the [target_government_reform.GetName], the most populous tribe in the vicinity of [target_location.GetName]. It is from this tribe that the [target_dynasty.GetName] dynasty originated, which in turn gave rise to the [target_country.GetFlavorRank] we are today. However, recent times have seen the gradual weakening of the [target_estate.GetName], which threatens the balance of power in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. If nothing is done to empower the $banu_al_wad$, their political privileges will fade into the pages of history."
 flavor_tle.12.a: "We must seek legitimacy from more than just the tribes."
 flavor_tle.12.b: "The primacy of the $banu_al_wad$ must be maintained!"
 tle_empower_banu_al_wad_reform: "[ShowGovernmentReformName('tle_support_of_banu_al_wad')] will additionally provide unscaled [ShowNamedValue('small_stability_investment')|+=] [ShowModifierTypeName('stability_investment')] [modifier|e]"
 flavor_tle.13.title: "Рост [ShowLocationNameWithNoTooltip('oran')]"
 flavor_tle.13.entry: "$flavor_tle.13.title$"
 flavor_tle.13.desc: "Если [target_location2.GetName] — наши ворота для торговли в [ShowScriptedGeographyName('sahara_desert_geography')], то [target_location.GetName] — наше окно для торговли с [ShowContinentName('europe')]. Ни один другой порт не играет столь важной роли, как [target_location.GetNameWithNoTooltip], ведь это главная гавань, связывающая нас с нашими морскими партнёрами в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Возможно, [target_location.GetRank.GetName] заслуживает дополнительных привилегий для усиления местного [target_estate.GetName]."
 flavor_tle.13.a: "A splendid idea!"
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] не заслуживает особого отношения."
