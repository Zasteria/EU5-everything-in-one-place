l_russian:
 banu_al_wad: "Бану Абд аль-Вад"
 FATE_OF_TLEMCEN: "Судьба Тлемсена"
 flavor_tle.1.title: "Падение города [capital_scope.GetNameWithNoTooltip]"
 flavor_tle.1.desc: "Город [capital_scope.GetName], столица нашей славной державы, пал под натиском вражеских войск. Но что ещё хуже, [Select_CString(ruler_scope.IsFemale,'наша дорогая правительница', 'наш дорогой правитель')] [ruler_scope.GetName] и [Select_CString(ruler_scope.IsFemale,'её', 'его')] сыновья были подло убиты во время нападения.\n\nЖители [ROOT.GetCountry.Custom('rank_ru_GEN')] потрясены этой чудовищной трагедией, и все понимают, что теперь дать отпор врагу будет ещё сложнее…"
 flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 tle_morrocan_tlemcen_war: "Если [mor_scope.GetLongName] захват[mor_scope.Custom('endlong_ityat')] [target_location.Custom('LR_ACC')|l] [target_location.GetName], пока идёт [target_war.GetName], [mor_scope.GetName] смо[mor_scope.Custom('end_gegu')] силой обратить #ONCLICK:COUNTRY,[tle_scope.Custom('CL_tt')] #TOOLTIP:COUNTRY,[tle_scope.Custom('CL_tt')],X [tle_scope.Custom('CL_ACC')|L]#!#! в свой #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феод#!#!"
 tle_additional_warning: "Осаду [target_siege.Custom('LR_GEN')|l] [target_siege.GetName] необходимо снять в кратчайшие сроки!"
 flavor_tle.2.title: "Падение города [target.GetNameWithNoTooltip]"
 flavor_tle.2.desc: "[target.GetRank.GetName|U] [target.GetName], жемчужина области [target.GetArea.GetName], не выдержал осады и наконец сдался нашей могучей армии. Когда ворота открылись, наши войска хлынули в #L #TOOLTIP:LOCATIONRANK,[target.GetRank.Custom('LR_tt')],X [target.GetRank.Custom('LR_ACC')|l]$tt_cl_2$, стремясь захватить главную цитадель, чтобы завладеть добычей и пленниками. Среди тех, кто укрылся за её стенами, оказалось немало представителей правящей [target_country.GetGovernment.GetAdjective|l]ой семьи. Наши солдаты немедленно их схватили и доставили к [from_country.GetAdjective|l]им военачальникам. Неужели [target_war.GetName] близится к завершению?"
 flavor_tle.2.a: "Убедитесь, что представители династии [target_dynasty.GetNameWithNoTooltip] не будут препятствовать нашим планам."
 flavor_tle.2.b: "Вперёд, на Оран!"
 TLE_once_truce_ends_zayyanid_pretenders_tt: "После окончания [Concept('truce', 'перемирия')|e] с #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#!, им откроется [Concept('decision', 'решение')|e] «[ShowDecisionName('zayyanid_pretenders_decision')]», позволяющее объявить особую [Concept('war', 'войну')|e] за [ShowCasusBelliName('cb_independence_war')|l]"
 flavor_tle.3.title: "$flavor_tle.2.title$"
 flavor_tle.3.desc: "Столица нашей любимой державы, [target.GetName], захвачена нашими заклятыми врагами из [from_country.Custom('longname_ru_GEN')] [from_country.GetLongName]. В довершение этой трагедии во время штурма погибло множество представителей нашей дорогой династии [target_dynasty.GetName].\n\nВесть об этой катастрофе прокатилась волной отчаяния по [ROOT.GetCountry.Custom('longname_ru_DAT')] и практически лишила страну сил продолжать войну. Гибель членов правящей семьи сама по себе не смогла бы парализовать государство, а вот утрата доверия к правителям — совсем другое дело. После того как союзные нам племена бросили нас на произвол судьбы, наш боевой дух пал так низко, как никогда прежде. А поскольку организованного сопротивления так и не возникло, [target_war.GetName] подходит к концу."
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 TLE_as_per_the_warning: "Мы не прислушались к предостережениям и допустили захват нашего любимого [target.GetRank.Custom('LR_GEN')|l] [target.GetName]. Все представители династии [target_dynasty.GetName] были перебиты, а мы стали #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!."
 zayyanid_pretenders_decision.title: "Восшествие на престол Зайянидского принца"
 zayyanid_pretenders_decision.desc: "Владычество #ONCLICK:COUNTRY,[ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('CL_tt')],X [ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('CL_GEN')|L]#!#! в лучшем случае стесняет [ROOT.GetCountry.Custom('longname_ru_ACC')], а в худшем — оборачивается тиранией. Давайте пригласим принца из династии [ShowDynastyName('zayyanid_dynasty')]. Пусть он вновь правит нами и объединит все #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племена#!#! в борьбе с общим врагом."
 zayyanid_pretenders_decision.desc.entry: "Наш сюзерен — тиран. Его владычество подрывает господствующее положение племён $banu_al_wad$. Давайте пригласим принца из династии [ShowDynastyName('zayyanid_dynasty')]. Пусть он вновь правит нами и объединит все #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племена#!#! в борьбе с общим врагом."
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 zayyanid_pretenders_decision.a.entry: "$common_string_great$"
 zayyanid_prince_takes_over: "Приход к власти принца из [Concept('dynasty', 'династия')|e] #TOOLTIP:DYNASTY,$zayyanid_dynasty_tt$,X #L Зайянидов#!#!"
 flavor_tle.4.title: "$flavor_tle.7.title$"
 flavor_tle.4.desc: "Обстановка в #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_PREP')|L]#!#! с каждым днём становится всё опаснее. Многие претенденты из династии [target_dynasty.GetName] вышли из тени и активно ищут поддержки среди #TOOLTIP:CULTURE,$zenati_tt$,X #L зенетских#!#! племён, проживающие в этих краях. Если местные сословия не удастся склонить на нашу сторону, [target_location.GetName] может стать центром народного восстания, которое положит конец нашему господству в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#!. Смо[target_country.Custom('end_gegu')] ли [target_country.GetName] справиться с надвигающейся бурей?"
 flavor_tle.4.a: "Нельзя игнорировать эти предупреждения."
 tle_rules_for_zayyanid_pretenders: "Если в течение следующих #Y 20#! лет [target_country.GetName] не смо[target_country.Custom('end_gegu')] удерживать [Concept('subject_loyalty', 'лояльность своего ленника')|e], [from_country.Custom('longname_ru_GEN')], выше #Y 30#! ед., [from_country.GetName] получ[from_country.Custom('end_itat')] возможность воспользоваться [Concept('decision', 'решением')|e] «[ShowDecisionName('zayyanid_pretenders_decision')]» и объявить [Concept('war', 'войну')|e] за [ShowCasusBelliName('cb_independence_war')|l]"
 tle_rules_part_two: "Если такое произойдёт, [from_country.GetName] получ[from_country.Custom('end_itat')] существенные бонусы к своей военной численности, а [target_country.GetName] получ[target_country.Custom('end_itat')] следующее:"
 flavor_tle.5.title: "Возвращение Зайянидов в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]!"
 flavor_tle.5.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale, 'претендентка', 'претендент')] на [from_country.GetAdjective|l]ий трон, [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл')] в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName], где его приветствовали [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] и представители #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племён#!#!. Фактически этот шаг равносилен объявлению войны со стороны #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! [target_country.Custom('longname_ru_DAT')], державе, которая уже слишком долго удерживает власть над [ROOT.GetCountry.GetCapital.Custom('LR_INST')|l] [ROOT.GetCountry.GetCapital.GetName]. [target_character.GetShortNameWithNoTooltip] пользуется широкой поддержкой [from_country.Custom('end_predlog_vvo')] [from_country.Custom('CL_PREP')], но самое главное то, что [Select_CString(target_character.IsFemale, 'она заручилась', 'он заручился')] поддержкой Бану Абд аль-Вад, крупнейшего и сильнейшего из #TOOLTIP:CULTURE,$zenati_tt$,X #L зенетских#!#! племён [ROOT.GetCountry.Custom('endrank_predlog_vvo')] [ROOT.GetCountry.Custom('rank_ru_PREP')|l], к которому принадлежит и династия [target_dynasty.GetName].\n\nМы ещё покажем этим [target_country.GetAdjectiveWithNoTooltip|l]им мерзавцам, что [target_war.GetName] закончится нашей победой!"
 flavor_tle.5.a: "Слава Аллаху!"
 zayyanid_pretender_effect: "Мы объявим нашему [Concept('overlord', 'сюзерену')|e] войну за [ShowCasusBelliName('cb_independence_war')|l] и получим дополнительные бонусы от следующего события:"
 flavor_tle.6.title: "Восстание [from_country.Custom('endlong_predlog_vvo')] [from_country.Custom('longname_ru_wntt_PREP')]!"
 flavor_tle.6.desc: "Несмотря на все наши ревностные усилия — предоставление привилегий, дипломатические миссии, щедрые дары и назначения на высокие должности, — добиться расположения племён #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! не получилось. Они по-прежнему верны династии [target_dynasty.GetName], которую возглавляет [target_character.GetName], и, к сожалению, отвергают более мягкое правление #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!.\n\nДа будет так! Мы обрушим на них всю мощь наших армий! Пусть [ROOT.GetCountry.GetReligion.GetGodName] покарает их, а [target_war.GetName] божественной милостью закончится нашей победой!"
 flavor_tle.6.a: "Мы никому не позволим посягнуть на наше господство в Магрибе!"
 flavor_tle.7.title: "Претенденты из династии [target_dynasty.GetNameWithNoTooltip]"
 flavor_tle.7.entry: "Зайянидские претенденты"
 flavor_tle.7.desc: "За последние несколько лет многие пережившие бойню представители династии [target_dynasty.GetName] вышли из подполья и начали борьбу за возвращение [target_location.Custom('LR_GEN')|l] [target_location.GetName] и [from_country.GetAdjective|l]ого престола. Их поддержка среди населения и #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племён#!#! пока невелика, но настроения людей постепенно меняются в их пользу. Если наш сюзерен из [target_country.Custom('longname_ru_GEN')] продолжит усугублять обстановку в провинции [target_location.GetProvince.GetName], восстановление династии [target_dynasty.GetNameWithNoTooltip] на престоле вполне может стать реальностью."
 flavor_tle.7.a: "Это может быть нам на руку."
 flavor_tle.11.title: "Укрепление лояльности"
 flavor_tle.11.desc: "С момента [target_country.GetAdjective|l]ого завоевания #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! прошло несколько десятилетий, и слухи о возвращении династии #TOOLTIP:DYNASTY,$zayyanid_dynasty_tt$,X #L Зайянидов#!#! уже почти забыты. Похоже, нам удалось сломить сопротивление #TOOLTIP:CULTURE,$zenati_tt$,X #L зенетских#!#! #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племён#!#!, в том числе $banu_al_wad$. После присоединения их земель #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! вступит в новую эпоху процветания."
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tle_secured: "[from_country.GetName] больше не смо[from_country.Custom('end_gegu')] восставать благодаря решению «[ShowDecisionName('zayyanid_pretenders_decision')]»"
 flavor_tle.13.title: "Рост Орана"
 flavor_tle.13.entry: "$flavor_tle.13.title$"
 flavor_tle.13.desc: "Если [target_location2.GetName] — наши врата к торговле в Сахаре, то [target_location.GetName] — наше окно к торговле в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Значение порта в [target_location.Custom('CL_PREP')] сложно переоценить, поскольку это главная гавань, связывающая нас с нашими морскими партнёрами на Средиземноморье. Возможно, стоит даровать #L #TOOLTIP:COUNTRY_RANK,[target_location.GetRank.Custom('CF_tt')],X [target_location.GetRank.Custom('rank_ru_DAT')|l]#!#! дополнительные привилегии. Таким образом, местные [target_estate.GetName|l] смогут укрепить своё положение благодаря нашей помощи."
 flavor_tle.13.a: "Превосходная мысль!"
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] не заслуживает особого обращения."
