 expedition_leader_name_herhim: "[Select_CString(character_expedition_leader_target.IsFemale,'Её', 'Его')]"
 expedition_leader_name_herhis: "[Select_CString(character_expedition_leader_target.IsFemale,'Её', 'Его')]"
 expedition_leader_name_herselfhimself: "[Select_CString(character_expedition_leader_target.IsFemale,'Сама', 'Сам')]"
 expedition_location_name: "[expedition_initiator.MakeScope.GetVariable('chinese_treasure_fleet_location').GetLocation.GetName]"
 expedition_location_name_tooltipless: "[expedition_initiator.MakeScope.GetVariable('chinese_treasure_fleet_location').GetLocation.GetNameWithNoTooltip]"
 chi_neighboring_nations_might_get_cb_on_us: "Соседние [Concept('nations', 'державы')|e], посещённые членами экспедиции «$expedition_name_treasure_voyage$», смогут объявить [Concept('war', 'войну')|e] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! и получить их поддержку."
 not_is_treasure_voyage_active: "Сейчас не проводится ни одна экспедиция «$expedition_name_treasure_voyage$»"
 chinese_treasure_expeditions_when_expedition_returns: "Когда экспедиция вернётся в #ONCLICK:COUNTRY,[expedition_initiator.Custom('CL_tt')] #TOOLTIP:COUNTRY,[expedition_initiator.Custom('CL_tt')],X [expedition_initiator.Custom('CL_ACC')|L]#!#!:"
 flavor_chi_por.1.requirement_tt: "[ShowFormableCountryName('CHI_f')] владеет [ShowLocationName('xiangshan_xinhui')]"
