l_russian:
 flavor_mfa.1.title: "Византийские традиции"
 flavor_mfa.1.entry: "Византийские традиции"
 flavor_mfa.1.desc: "[ROOT.GetCountry.GetLongName] сто[ROOT.GetCountry.Custom('endlong_ityat')] на перепутье. Всего каких-то несколько десятилетий назад на престол [ROOT.GetCountry.Custom('rank_ru_GEN')|l] [Select_CString(target_character2.IsFemale, 'взошла', 'взошёл' )] [target_character2.GetName] из славной династии [target_character.GetDynasty.GetName]. Несмотря на своё #TOOLTIP:STATIC_MODIFIER,byz_born_in_the_purple_modifier,X #V #L багрянородное#!#!#! происхождение, [Select_CString(target_character2.IsFemale, 'она обратилась', 'он обратился' )] в #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#! и полностью [Select_CString(target_character2.IsFemale, 'переняла', 'перенял' )] #TOOLTIP:CULTURE,$piedmontese_tt$,X #L пьемонтскую#!#! культуру, отказавшись от родных #L [target_country.GetAdjective|l]их#! корней.\n\nСегодня [ROOT.GetCountry.Custom('CL_INST')] правит [Select_CString(target_character2.IsFemale, 'её', 'его' )] потомок [target_character.GetName] — человек, который, возможно, ещё будет предаваться несбыточным мечтам о жизни в [target_country.Custom('longname_ru_wntt_PREP')], если бы [Select_CString(target_character.IsFemale, 'её', 'его' )] угораздило родиться не в [target_character.GetLocation.Custom('LR_PREP')|l] [target_character.GetLocation.GetName]."
 flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip] правильно [Select_CString(target_character2.IsFemale, 'поступила', 'поступил' )], что [Select_CString(target_character2.IsFemale, 'приспособилась', 'приспособился' )]."
 flavor_mfa.1.a.entry: "Наш правитель поступил правильно, что приспособился."
 flavor_mfa.1.b: "Мы не станем отказываться от корней!"
 mfa_extra_information_about_reform: "[Concept('modifiers', 'Модификаторы')|e] реформы «[target_government_reform.GetName]» меняются от отрицательных к положительным в зависимости от процентных показателей #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческой#!#! [Concept('culture', 'культуры')|e] и #TOOLTIP:RELIGION,$orthodox_tt$,X #L православно-христианской#!#! [Concept('religion', 'религии')|e]. По мере обращения #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! штрафы постепенно начнут превращаться в бонусы. Модификаторы меняются от #N -1#! до #G +1#!"
 mfa_opportunity_for_thessaloniki: "Если мы внедрим реформу «[target_government_reform.GetName]», а процентные показатели #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греческой#!#! [Concept('culture', 'культуры')|e] и #TOOLTIP:RELIGION,$orthodox_tt$,X #L православно-христианской#!#! [Concept('religion', 'религии')|e] достигнут #W 75%#!, мы сможем запросить у #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! феод в #TOOLTIP:LOCATION,thessaloniki,X #L Фессалониках#!#! и окрестностях"
 flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]"
 flavor_mfa.2.entry: "Фачино Кане"
 flavor_mfa.2.desc: "В [ROOT.GetCountry.Custom('rank_ru_ACC')|l] [Select_CString(target_character.IsFemale, 'прибыла', 'прибыл' )] знаменитый кондотьер [target_character.GetName] родом из местности, что зовётся [target_character.GetBirthLocation.GetName]. За долгие годы службы у других держав [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'снискала', 'снискал' )] славу умелого командира. [Select_CString(target_character.IsFemale, 'Её', 'Его' )] заслуги поистине впечатляют, а потому мы считаем, что компания, которой [Select_CString(target_character.IsFemale, 'она', 'он' )] руководит, станет для нас ценным приобретением в войнах против других держав в этой области."
 flavor_mfa.2.a: "Нужно нанять [Select_CString(target_character.IsFemale, 'её', 'его' )]."
 flavor_mfa.2.a.entry: "Нужно нанять его."
 flavor_mfa.2.b: "Предложить [Select_CString(target_character.IsFemale, 'ей', 'ему' )] некоторые территории в обмен на службу."
 flavor_mfa.2.b.entry: "Предложить ему некоторые территории в обмен на службу."
 flavor_mfa.2.c: "Пф! Пусть бродяги ищут работы в других странах."
 mfa_facino_condotierro: "Банда Фачино"
 flavor_mfa.3.title: "Императорские амбиции"
 flavor_mfa.3.entry: "$flavor_mfa.3.title$"
 flavor_mfa.3.desc: "[target_character.GetName] — не #TOOLTIP:STATIC_MODIFIER,byz_born_in_the_purple_modifier,X #V #L багрянородный ребёнок#!#!#! и не отпрыск императора, однако в [Select_CString(target_character.IsFemale, 'её', 'его' )] жилах всё же течёт имперская кровь семейства [target_character.GetDynasty.GetName]. [Select_CString(target_character.IsFemale, 'Ей', 'Ему' )] недостаточно быть лишь одним из многих мелких правителей #TOOLTIP:AREA,piemonte_area,X #L Пьемонта#!#! — [target_character.GetShortNameWithNoTooltip] считает, что заслуживает лучшей доли, чем всего-навсего #TOOLTIP:COUNTRY_RANK,rank_county,X #L графства#!#!."
 flavor_mfa.3.a: "Пьемонту нужен новый гегемон."
 flavor_mfa.3.b: "[Select_CString(target_character.IsFemale, 'Её', 'Его' )] устремления приведут лишь к тому, что против нас обратятся все остальные."
 flavor_mfa.3.b.entry: "Его устремления приведут лишь к тому, что против нас обратятся все остальные."
 mfa_if_we_conquer_enough_in_20_years: "Если [ROOT.GetCountry.GetName] довед[ROOT.GetCountry.Custom('end_youtut')] численность [population_i|e] [Concept('population', 'населения')|e] хотя бы до #W [DisplayPopulationNumber('(CFixedPoint)500')]#! в течение #W 20#! лет, держава получит [SCOPE.ScriptValue('prestige_mild_bonus')|+=] к [prestige_i|e] [Concept('prestige', 'престижу')|e] и [Concept('modifier', 'модификатор')|e] «[ShowModifier('mfa_elevation_modifier')]» на #W 40#! лет; кроме того, возможно также повышение её ранга до #TOOLTIP:COUNTRY_RANK,rank_duchy,X #L герцогства#!#!, если он ниже, чем герцогство\nЕсли [ROOT.GetCountry.GetName] не смо[ROOT.GetCountry.Custom('end_gegu')] этого добиться, держава получит [SCOPE.ScriptValue('prestige_extreme_penalty')|+=] к [prestige_i|e] [Concept('prestige', 'престижу')|e] и [SCOPE.ScriptValue('stability_weak_penalty')|+=] к [stability_i|e] [Concept('stability', 'стабильности')|e], а все соседи получат [Concept('casus_belli', 'повод для войны')|e] против неё «[ShowCasusBelliName('cb_cut_down_in_size')]»"
 flavor_mfa.4.title: "Посмешище на всю Италию"
 flavor_mfa.4.desc: "Несколько десятилетий назад [target_character.GetName] [Select_CString(target_character.IsFemale, 'поклялась', 'поклялся' )], что станет гегемоном #TOOLTIP:AREA,piemonte_area,X #L Пьемонта#!#!. Сегодня же всё, что напоминает об этих устремлениях, — это беспрерывные ядовитые насмешки, которым подвергаются [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Династия [target_character.GetDynasty.GetName] из [ROOT.GetCountry.Custom('longname_ru_GEN')] не просто не добилась желаемого — она нажила себе новых врагов. Осталась ли у соседей [ROOT.GetCountry.Custom('rank_ru_GEN')|l] хоть толика сочувствия к этой несчастной державе?"
 flavor_mfa.4.a: "Мы сделали всё, что смогли."
 flavor_mfa.5.title: "Перезрелый плод"
 flavor_mfa.5.desc: "В последние годы [from_country.GetLongName] не покладая рук дела[from_country.Custom('endlong_etyut')] всё, что только можно, лишь бы превратить соседей во врагов. Пока что, впрочем, успехи сомнительны: всё, что этой державе удалось добиться, — это насмешек пополам с раздражением в свой адрес. Мы — как и многие другие — искренне презираем эту убогую державу."
 flavor_mfa.5.a: "Какое несчастье!"
 flavor_mfa.6.title: "Герцоги Пьемонта"
 flavor_mfa.6.desc: "Много лет назад [target_character.GetName] [Select_CString(target_character.IsFemale, 'поклялась', 'поклялся' )], что [Select_CString(target_character.IsFemale, 'её', 'его' )] род — #L [ROOT.GetCountry.GetAdjective|l]ая#! династия [target_character.GetDynasty.GetName] — в один прекрасный день непременно добьётся заслуженного величия. И сегодня мы поняли, что [Select_CString(target_character.IsFemale, 'она', 'он' )] не бросает слов на ветер: отныне жемчужина #TOOLTIP:AREA,piemonte_area,X #L Пьемонта#!#! будет именоваться #TOOLTIP:COUNTRY_RANK,rank_duchy,X #L герцогством#!#!."
 flavor_mfa.6.a: "Возможно, [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие правители тоже заслуживают багрянородства?"
 flavor_mfa.6.b: "Да здравству[ROOT.GetCountry.Custom('end_etyut')] [ROOT.GetCountry.GetNameWithNoTooltip]!"
 mfa_purple_color: "Наш цвет сменится на оттенок #W тёмно-пурпурного#!"
 flavor_mfa.7.title: "Наши притязания на Королевство Фессалоники"
 flavor_mfa.7.entry: "$flavor_mfa.7.title$"
 flavor_mfa.7.desc: "[target_character.GetName], выходец из династии [target_character.GetDynasty.GetName], чей родоначальник — [target_character2.GetName], имеет законные, хоть и не первоочередные права на престол [target_country.Custom('longname_ru_GEN')] по принципу родовой принадлежности. Есть у [Select_CString(target_character.IsFemale, 'неё', 'него' )] и другое притязание, о котором знают далеко не все, — на #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевство Фессалоники#!#!; эта претензия восходит уже к такому деятелю, как [target_character3.GetName], и династии [target_character3.GetDynasty.GetName]. [target_character.GetName] считает, что при потворстве семейства [target_character.GetDynasty.GetNameWithNoTooltip], чьё родовое гнездо — [target_country.GetCapital.GetName], мы сможем в обмен на определённые уступки добиться [target_location.Custom('LR_GEN')|l] [target_location.GetName]."
 flavor_mfa.7.a: "Выдвинуть притязания."
 flavor_mfa.7.b: "Мы не станем злоупотреблять их добротой."
 MFA_request_thessalonica: "Мы запросим у [target_country.Custom('longname_ru_GEN')] все земли в #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкидиках#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижней Македонии#!#! и #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральной Македонии#!#! в качестве #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феода#!#!"
 flavor_mfa.8.title: "Просьба [from_country.Custom('CL_GEN')]"
 flavor_mfa.8.desc: "Нашему сородичу из династии [target_character.GetDynasty.GetName] в [from_country.Custom('longname_ru_PREP')] удалось установить в #TOOLTIP:REGION,italy_region,X #L Италии#!#! настоящую #L [target_country.GetAdjective|l]ую#! державу: местные жители исповедуют #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ую#! веру, придерживаются #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! культуры, носят пурпурные одеяния и разговаривают на нашем языке. Их [Select_CString(target_character.IsFemale, 'правительница', 'правитель' )] [target_character.GetName], упирая на наши исторические связи, а также связи современные, просит выделить [Select_CString(target_character.IsFemale, 'ей', 'ему' )] феод в [target_location.Custom('LR_PREP')|l] [target_location.GetName] и окрестностях, поскольку якобы издревле обладает правом на престол #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевства Фессалоники#!#!."
 flavor_mfa.8.a: "[Select_CString(target_character.IsFemale, 'Ей', 'Ему' )] должно хватать ума не вспоминать об этом латинском образовании."
 flavor_mfa.8.b: "Мы выполним их просьбу."
 mfa_make_thessaloniki_subject: "Наши [Concept('locations', 'районы')|e] в #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкидиках#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижней Македонии#!#! и #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральной Македонии#!#! станут #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!"
 flavor_mfa.1000.title: "$flavor_mfa.7.title$"
 flavor_mfa.1000.entry: "$flavor_mfa.7.title$"
 flavor_mfa.1000.desc: "Несмотря на происхождение из славного рода [target_character.GetDynasty.GetName], [target_character.GetName] обладает достаточно серьёзным притязанием на #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевство Фессалоники#!#!, которому [Select_CString(target_character.IsFemale, 'обязана', 'обязан' )] своему далёкому родственнику по имени [target_character3.GetName]. И хотя однозначность этого притязания сомнительна, мы всё-таки можем рассчитывать на поддержку других держав, поскольку многие #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянские#!#! государства сейчас стараются, воспользовавшись #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip]им кризисом наследования#!#!, урвать собственный кусок [target_country.Custom('longname_ru_GEN')]."
 flavor_mfa.1000.a: "Мы отправляемся в поход!"
 flavor_mfa.1000.b: "Будет глупо развязывать войну из-за таких пустяковых претензий."
 recipient_agrees_to_join_war: "[recipient.GetName] пообеща[recipient.Custom('end_etyut')] присоединиться к войне #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_GEN')|L]#!#! против [GetCountry('BYZ').Custom('longname_ru_GEN')] в течение нескольких лет"
 MFA_gather_allies: "[ROOT.GetCountry.GetName] попробу[ROOT.GetCountry.Custom('end_etyut')] созвать союзников посредством [Concept('country_interaction', 'взаимодействия с державой')|e] «[ShowCountryInteractionName('mfa_join_against_byz')]»\nЧерез #W 3#! года начнётся [Concept('event', 'событие')|e], позволяющее объявить [Concept('war', 'войну')|e] при поддержке союзников"
 flavor_mfa.1001.title: "Умиротворение [from_country.GetAdjectiveWithNoTooltip|l]их претендентов"
 flavor_mfa.1001.desc: "Подлое #L [from_country.GetAdjective|l]ое#! семейство [target_character.GetDynasty.GetName] выдвинуло претензии на #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевство Фессалоники#!#!, обосновывая его происхождением от дома [target_character3.GetDynasty.GetName]. Как сообщают наши шпионы, они пытаются собрать #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянскую#!#! лигу и совместно отобрать эти земли, воспользовавшись #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip]им кризисом наследования#!#!."
 flavor_mfa.1001.a: "Мы не уступим этим предателям ни пяди земли!"
 flavor_mfa.1001.b: "Предложим им символический надел."
 flavor_mfa.1001.c: "Да пусть забирают на здоровье!"
 mfa_offer_few_provinces: "Мы предложим #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_DAT')|L]#!#! [Concept('provinces', 'провинции')|e] #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкидики#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижняя Македония#!#! и #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральная Македония#!#!, чтобы умиротворить эту державу"
 mfa_offer_entire_geography: "Мы предложим #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_DAT')|L]#!#! все свои земли на территории #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевства Фессалоники#!#!"
 flavor_mfa.1002.title: "Удачная возможность"
 flavor_mfa.1002.desc: "Много лет прошло с тех пор, как мы начали собрать союзников в поход против [target_country.Custom('longname_ru_GEN')]. Наши ослабленные междоусобицей враги вряд ли окажут серьёзное сопротивление. Под наши знамёна стекаются всё новые державы; ещё немного — и тогда мы докажем всему миру, что именно наша ветвь династии [target_dynasty.GetName] сильнее других."
 flavor_mfa.1002.a: "Спускайте псов войны!"
 flavor_mfa.1002.b: "Сейчас неподходящее время."
 flavor_mfa.1002.c: "Лучше отказаться от этого замысла."
 flavor_mfa.1003.title: "Верность соглашению"
 flavor_mfa.1003.desc: "Наконец разразилась давно назревавшая война с [target_country.Custom('longname_ru_INST')], и нас призвали сдержать данное #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_DAT')|L]#!#! слово. Придём ли мы на помощь в гражданской войне с участием семейства [target_character.GetDynasty.GetName], или же бросим [from_country.Custom('longname_ru_wntt_ACC')] на произвол судьбы, и пусть [target_war.GetName] идёт своим чередом?"
 flavor_mfa.1003.a: "Мы не станем бросать союзника."
 flavor_mfa.1003.b: "Правильнее всего будет наблюдать со стороны."
 flavor_mfa.1005.title: "Помощь из [target_country.Custom('CL_GEN')]"
 flavor_mfa.1005.desc: "На празднике малодушия в [target_country.Custom('longname_ru_PREP')] возобладал здравый смысл: нам предложили уступить территории #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевства Фессалоники#!#!. Это предложение следует тщательно обдумать, ибо поход сам по себе — большой риск."
 flavor_mfa.1005.a: "Будем довольствоваться тем, что можем взять."
 flavor_mfa.1005.b: "Зря они возомнили, что смогут нас остановить!"
 mfa_make_thessaloniki_subject_out_of_provinces: "#L [target_country.GetAdjective]ие#! [Concept('locations', 'районы')|e] в #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкидиках#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижней Македонии#!#! и #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральной Македонии#!#! станут #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!"
 mfa_make_thessaloniki_subject_out_of_geography: "#L [target_country.GetAdjective]ие#! [Concept('locations', 'районы')|e] в #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королевстве Фессалоники#!#! станут #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!"
 flavor_mfa.1006.title: "Ответ [from_country.Custom('longname_ru_wntt_GEN')]"
 flavor_mfa.1006.desc.affirmative: "Гражданскую войну с участием семейства [target_character.GetDynasty.GetName] удалось предотвратить! Похоже, что гнусная #L [from_country.GetAdjective|l]ая#! ветвь этого рода наконец обрела рассудок и решила прекратить боевые действия, согласившись на предложенную нами передачу земель."
 flavor_mfa.1006.desc.negative: "Подлецы из #L [from_country.GetAdjective|l]ой#! династии [target_character.GetDynasty.GetName] — предатели и обманщики! На наше скромное предложение разрешить дело миром они ответили отказом. Истинно говорят нам, эти #TOOLTIP:LANGUAGE,latin_language,X #L латинские#!#! дьяволы — слуги самого Сатаны!"
 flavor_mfa.1006.affirmative: "Мир восторжествовал."
 flavor_mfa.1006.negative: "Ничто не приносит столько боли, как предательство со стороны родных."
 mfa_start_war_against_byz_decision.desc.entry: "Настало время призвать наших союзников и наконец сразиться с нашими сородичами в [ShowScriptedGeographyName('greece_geography')]."
