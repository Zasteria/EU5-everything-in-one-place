l_russian:
 flavor_gra.1.title: "Мавританские беженцы"
 flavor_gra.1.desc: "Гранада пала под натиском неверных! Последний оплот знаний и жемчужина Аль-Андалуса теперь в руках e кастильцев. Пока исламский мир оправляется от потрясения, мавританские беженцы стекаются в мусульманские города Северной Африки и Ближнего Востока, привозя с собой рукописи таких выдающихся учёных, как Ибн Рушд, Абуль-Касим аз-Захрави и Ибн Туфайль. Пригласив их на территорию #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, мы ускорим развитие науки и искусства."
 flavor_gra.1.a: "Конечно, пусть приезжают!"
 flavor_gra.1.a.entry: "Конечно, пусть приезжают к нам!"
 flavor_gra.1.b: "Нет. Мы не нуждаемся в них"
 flavor_gra.2.title: "Сицилийский эмират"
 flavor_gra.2.entry: "$flavor_gra.2.title$"
 flavor_gra.2.desc: "В прошлом Сицилийский эмират сотни лет служил бастионом нашей веры, но в 1087 году крестоносцы всё-таки захватили остров.\n\nТеперь эти заветные земли принадлежат нам, и мы не должны их потерять!"
 flavor_gra.2.a: "Для абсолютного контроля нужна абсолютная власть."
 STATIC_MODIFIER_NAME_sicily_in_safe_hands: "Укрепление власти"
 STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "Благодаря непосредственному контролю над Сицилией мы можем вкладывать больше средств в развитие и благополучие острова."
 flavor_gra.3.title: "Помощь [GetCountry('TUR').Custom('CL_GEN')]"
 flavor_gra.3.entry: "Просьба об османской поддержке"
 flavor_gra.3.desc: "Война против #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! может обернуться для нас катастрофой, поэтому имеет смысл попросить поддержки у наших братьев по вере. Возможно, династия [GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName] ответит на наш призыв, если мы поступимся своей гордостью и обратимся к ним за помощью…"
 flavor_gra.3.a: "Это наш единственный шанс!"
 flavor_gra.3.tt: "[GetCountry('TUR').GetNameWithNoTooltip] может защитить нас от [GetCountry('CAS').Custom('CL_GEN')]"
 flavor_gra.3.b: "Мы справимся сами."
 flavor_gra.3.historical_info: "Насридские правители Гранады отправили послов к османам и мамлюкам, чтобы попросить их поддержки в борьбе против Кастилии. В то время османы как раз расширяли своё присутствие в западном Средиземноморье, поэтому власти Гранады рассчитывали, что они согласятся отправить 200 000 турецких солдат в Валенсию для отражения христианской угрозы."
 flavor_gra.4.title: "Удручающий ответ"
 flavor_gra.4.entry: "$flavor_gra.4.title$"
 flavor_gra.4.desc: "[GetCountry('TUR').GetName] сообщил[GetCountry('TUR').Custom('end_fem')], что #italic не смогут#! нам помочь, поскольку у них есть более насущные дела. В своём письме они лестно отзываются об Аль-Андалусе и его былой славе, но, к сожалению, от этих слов мало толку…"
 flavor_gra.4.a: "Мы не сдадимся!"
 flavor_gra.4.historical_info: "Правители Гранады до последнего надеялись на помощь османов и мамлюков, однако те вскоре погрязли в войне между собой, поэтому не могли оказать никакой существенной поддержки на поле боя. Тем не менее турки задействовали свой флот, который под командованием Кемаль-реиса начал устраивать набеги на кастильские владения в западном Средиземноморье, а в дальнейшем помогал перевозить мусульманских беженцев из Испании."
 ibn_khaldun_patronage: "К нашему двору прибыл человек выдающегося ума — знаменитый учёный и философ [target_character.GetName], который нуждается в нашем покровительстве, чтобы продолжить свои труды и исследования. Он много писал об управлении, экономике, а также расцвете и падении империй, поэтому [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] только выиграет от его присутствия. Нам не помешал бы такой мудрый советчик. Стоит ли нам взять его под своё крыло?"
 flavor_gra.5.title: "[target_character.GetNameWithNoTooltip] просит о покровительстве"
 flavor_gra.5.entry: "Ибн Хальдун просит о покровительстве"
 flavor_gra.5.desc: "$ibn_khaldun_patronage$"
 flavor_gra.5.a: "Славно."
 flavor_gra.5.b: "Это пустая трата средств!"
 flavor_gra.6.title: "Жемчужина пролива"
 flavor_gra.6.entry: "$flavor_gra.6.title$"
 flavor_gra.6.desc: "Нам поступило донесение от #italic вали#! [target_location.Custom('LR_GEN')|l] [target_location.GetName]: стены по-прежнему прочны, в гавани не протолкнуться от кораблей, а денег в нашу казну за этот месяц поступило больше, чем за весь год — из других районов [ROOT.GetCountry.Custom('rank_ru_GEN')|l]. С алькасабы, увенчанной крепостью Хибральфаро, погожим утром открывается превосходный обзор на пролив, и пусть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] найдёт умиротворение в этом знании.\n\n[ROOT.GetCountry.GetCapital.GetName] обеспечивает нам место на престоле, а [target_location.GetNameWithNoTooltip] — почти всё остальное: налоговые поступления от входящих в гавань судов, близость #L [GetCountry('GEN').GetAdjective|l]их#! торговых представительств, предпочитающих оставаться здесь на зимовку, и обилие сладкого креплёного вина из глубинки — оно пользуется славой даже [GetCountry('FLA').Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('FLA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FLA').Custom('CL_tt')],X [GetCountry('FLA').Custom('CL_PREP')|L]#!#!. Если мы вдруг утратим этот город, ничто не сможет восполнить нам такую потерю.\n\nИменно в этом, впрочем, и заинтересованы наши соперники. За гаванью уже два поколения подряд зорко след[GetCountry('CAS').Custom('end_ityat')] [GetCountry('CAS').GetName], но враг может ударить и изнутри: не один наш предшественник, водрузивший своё знамя на стены этой крепости, позднее вынужден был отбивать твердыню у мятежников."
 flavor_gra.6.a: "Мы будем защищать Малаку так же отчаянно, как защищаем корону."
 flavor_gra.6.historical_info: "Малака (Малага) — второй по величине город Гранадского эмирата, один из важнейших средиземноморских портов для исламских держав Средневековья. После того как в 1239 году Насриды присоединили к себе остатки последней тайфы эпохи Хаммадидов, власть над городом оказалась сосредоточена в руках #italic вали#! — наместника, назначаемого непосредственно султаном. Первым вали Малаки стал Исмаил, брат Мухаммада I. Впоследствии вали традиционно выбирались из числа близких родственников султана, а срок их полномочий был почти не ограничен.\n\nКраеугольным камнем обороны Малаки была алькасаба — расположенная на холме крепость, выходящая на гавань. Вскоре её дополнила крепость Хибральфаро, построенная выше алькасабы и соединённая с ней проходом — корачей. С крепостных стен стража могла наблюдать за кораблями в Гибралтарском проливе — суда были видны ещё задолго до входа в порт. В расположенных в низине #italic фундуках#! — постоялых дворах — размещались генуэзские, каталонские и магрибские купцы. Взимавшиеся в порту Малаки таможенные сборы составляли основную статью доходов Насридской казны.\n\nТовары из Малаки поставлялись даже в такие далёкие страны, как Фландрия и Египет. Значительным спросом на европейских рынках пользовались андалузский шёлк, люстровая керамика, сушёные фиги и изюм из Ахаркии, а также сладкое креплёное вино. С верфей Гуадальмедины на воду сходили насридские галеры, патрулировавшие залив совместно с маринидскими кораблями.\n\nДолжность правителя Малаки была, однако, сопряжена с большим риском: от неё до престола оставался всего один шаг, и в годы раздробленности мятеж поднимали, как правило, именно местные вали. В 1359 году над городом взвились знамёна Мухаммада VI — «малинового султана», а в 1487 году Малака окончательно пала под натиском католических монархов. С её завоеванием закончилась эпоха Аль-Андалуса, а через полдесятилетия пала Гранада."
 flavor_gra.7.entry: "$flavor_gra.7.title$"
 flavor_gra.7.title: "Восстановление #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#!"
 flavor_gra.7.desc: "О [ROOT.GetReligion.GetGodName], во имя твоё мы вернули себе [target_location.GetRank.GetName|l] [target_location.GetName] — некогда важное для андалусцев владение, а сегодня — место, где [target_character.GetName] и [Select_CString(target_character.IsFemale, 'её', 'его' )] [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] твёрдо намереваются возродить господствовавшую здесь когда-то #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ую#! веру."
 flavor_gra.7.a: "[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]ое прошлое этого места пора превратить в настоящее."
 gra_convert_cordoba_to_root_religion: "#Y 40%#! [Concept('pops', 'населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] обратится в другую религию ([ROOT.GetCountry.GetReligion.GetName|l])"
 flavor_gra.7.b: "Мы не станем обращать людей насильно, а постараемся принять и интегрировать их."
 flavor_gra.8.entry: "$flavor_gra.8.title$"
 flavor_gra.8.title: "Жемчужина Иберии"
 flavor_gra.8.desc: "В самом сердце #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! находится [target_location.GetRank.GetName|l], где издавна друг рядом с другом проживают носители #TOOLTIP:RELIGIONGROUP,christian,X #L христианской#!#!, #TOOLTIP:RELIGIONGROUP,muslim,X #L исламской#!#! и #L [ShowReligionGroupAdjective('judaism')|l]ой#! культур. Поскольку теперь мы — владыки этих краёв, [ROOT.GetCountry.GetRank.GetName|l] стоит перед выбором: как именно поступить с новыми владениями?\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U], а заодно и [target_character.GetName], считают, что [target_location.GetRank.GetNameWithNoTooltip|l] достоин дальнейшего процветания. [target_location.GetName] будет подлинной жемчужиной Иберии — так считают все без исключения сословия, прилагающие усилия к воплощению этого замысла."
 flavor_gra.8.a: "Пусть [ShowLocationNameWithNoTooltip('toledo')] процветает!"
 flavor_gra.9.entry: "$flavor_gra.9.title$"
 flavor_gra.9.title: "Евреи-сефарды"
 flavor_gra.9.desc: "[ShowReligionName('judaism')|U] — вера, далеко не чуждая обитателям #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!: в её благополучных городах сложились целые общины последователей этой религии, и некоторые из них уже всерьёз намереваются превратить #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName] в надёжное пристанище для собратьев по вере, где они не будут подвергаться гонениям и унижениям.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] расходится во мнениях: кто-то поддерживает это начинание, иные же, менее терпимые в вопросах веры, считают подобные поползновения попыткой попрать всё святое, что только есть в [ROOT.GetCountry.Custom('rank_ru_PREP')|l], и что [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] необходимо защитить от нравственного разложения."
 flavor_gra.9.a: "Мы будем защищать права иудеев."
 flavor_gra.9.b: "Неверующие никогда не будут жить в мире, [ROOT.GetCountry.GetReligion.GetGodName] в том свидетелем!"
 gra_jewish_people_in_target_location_become_unhappy: "Каждая #TOOLTIP:RELIGION,$judaism_tt$,X #L иудейская#!#! [Concept('pop', 'группа населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] получит [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] к довольству"
 flavor_gra.10.entry: "Наш правитель убит"
 flavor_gra.10.title: "[target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale,'убита', 'убит')]"
 flavor_gra.10.desc: "В #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! трагедия!\n\nНеизвестный безумец, дождавшись, пока [target_character.GetName] закончит молитву в [target_location.Custom('LR_PREP')|l] [target_location.GetName], напал на [Select_CString(target_character.IsFemale, 'неё', 'него' )] и нанёс несколько ужасных ударов. Даже лучшие придворные лекари оказались бессильны исцелить страшные раны, и всего через несколько часов [Select_CString(target_character.IsFemale, 'несчастную', 'несчастного' )] постигла смерть.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] пребывает в печали. Некоторые уверены, что нападение было подстроено заранее: по их словам, противники [Select_CString(target_character.IsFemale, 'убитой', 'убитого' )] специально отвлекли [Select_CString(target_character.IsFemale, 'её', 'его' )] телохранителей, чтобы убийца мог воспользоваться случаем. Истины, впрочем, не знает никто. Лучше не ворошить прошлое."
 flavor_gra.10.a: "Что теперь будет с [ROOT.GetCountry.Custom('CL_INST')]?"
 flavor_gra.11.entry: "$flavor_gra.11.title$"
 flavor_gra.11.title: "Гранадский шёлк"
 flavor_gra.11.desc: "Производимый [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! #TOOLTIP:GOODS,silk,X #L шёлк#!#! — самый прославленный в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Иностранные купцы выстраиваются в очередь за этим товаром, чтобы #TOOLTIP:LOCATION,genoa,X #L генуэзские#!#!, #TOOLTIP:LOCATION,venice,X #L венецианские#!#! и даже #TOOLTIP:LOCATION,prague,X #L пражские#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] могли удовлетворить свою потребность в роскоши. Для нас, разумеется, такое положение более чем выгодно.\n\nОднако выгода может быть не только финансовой: наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] предлагают распространить торговлю шёлком на весь мир, чтобы сподвигнуть и другие державы покупать наш товар, а значит — монополизировать торговлю им. При этом вырастет и престиж нашего государства."
 flavor_gra.11.a: "Гранадский шёлк будет известен во всём мире!"
 unlock_expand_iberian_silk_decision: "Будет открыто [Concept('decision', 'решение')|e] «$gra_expand_seda_de_granada.title$». Для его принятия потребуется, чтобы была завоёвана [ShowLocationName('murcia')]"
 flavor_gra.12.entry: "$flavor_gra.12.title$"
 flavor_gra.12.title: "Торговая выгода"
 flavor_gra.12.desc: "Наш #TOOLTIP:GOODS,silk,X #L шёлк#!#! славится на всю #TOOLTIP:CONTINENT,europe,X #L Европу#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|U] из всех уголков #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! стремятся не только заработать на его продаже, но и показать всему миру непревзойдённое качество нашего производства. Поскольку сделать это в одиночку невозможно, они обратились к нам с просьбой установить новые торговые маршруты, которые поспособствуют не только сохранению товарного обмена, но и поддержанию доброго имени и престижа нашей державы во всём, что касается торговли шёлком."
 flavor_gra.12.a: "Постараемся нарастить торговые возможности с помощью дипломатии."
 flavor_gra.13.entry: "$flavor_gra.13.title$"
 flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$"
 flavor_gra.13.desc: "Существование #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! под угрозой, и многие вступают в наше воинство добровольно.\n\nЭтими бойцами, преимущественно #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазигского#!#! происхождения, командует [target_character2.GetName] — умелый, хоть и не совсем надёжный полководец. [ShowSituationName('battle_for_the_strait')|U] закончится в нашу пользу лишь в том случае, если мы устраним как можно больше неопределённостей, и эти добровольцы ещё могут сослужить нам опорой для возведения кого-либо на престол. Вместо того чтобы передавать их под командование чужеземцев, мы постараемся сделать так, чтобы ими руководили выходцы из династии [target_character.GetDynasty.GetName], — в таком случае риск предательства будет устранён."
 flavor_gra.13.a: "Пусть каждый из них служит нашей державе."
 flavor_gra.13.b: "Мы избавимся от каждого, чья преданность не абсолютна."
 gra_mercenary_company_will_be_weaker_and_more_expensive: "В компании [Concept('mercenary', 'наёмников')|e] будет #Y вполовину#! меньше солдат, и их услуги будут дороже"
 flavor_gra.14.entry: "$flavor_gra.14.title$"
 flavor_gra.14.title: "Каср ар-Рияд-ас-Саид"
 flavor_gra.14.desc: "Мало что придаёт нам столько же престижа, сколько [ShowBuildingTypeName('alhambra')] в #TOOLTIP:LOCATION,granada,X #L Гранаде#!#!. Однако [target_character.GetName], в чьих руках находится [ROOT.GetCountry.GetRank.GetName|l], считает, что этого мало, и слава о династии [target_character.GetDynasty.GetName] должна распространиться далеко за пределы #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!, по всему #TOOLTIP:RELIGIONGROUP,muslim,X #L исламскому#!#! миру. Ради этого [Select_CString(target_character.IsFemale, 'она', 'он' )] намеревается нанять лучших в державе архитекторов, чтобы те соорудили в центре Альгамбры дворец, украшенный львиными статуями и сотовыми сводами — #italic мукарнасами#!."
 flavor_gra.14.a: "Мы поддержим этот замысел деньгами."
 flavor_gra.14.b: "Пусть слава династии [target_character.GetDynasty.GetNameWithNoTooltip] покроет весь мир!"
 flavor_gra.14.b.entry: "Пусть слава нашей династии покроет весь мир!"
 flavor_gra.14.c: "Тщетное дело — пытаться насытить алчных."
 flavor_gra.15.entry: "$flavor_gra.15.title$"
 flavor_gra.15.title: "Шанс в борьбе"
 flavor_gra.15.desc: "Наши дипломаты и шпионы доложили, что #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! раздирает на части смута — настолько великая, что [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'вынуждена', 'вынужден' )] обращать всё своё внимание на внутреннюю политику, тем самым давая нам передышку от тяжёлого ярма. [target_character.GetName] даже считает, что сложившейся обстановкой нужно воспользоваться — мы можем отвлечь своё внимание от [target_country.Custom('CL_GEN')], и тогда [ShowSituationName('battle_for_the_strait')], возможно, оберётся в нашу пользу."
 flavor_gra.15.a: "Помолимся, чтобы их смута продолжалась."
 gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "Пока в #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_PREP')|L]#!#! или #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_PREP')|L]#!#! [Concept('disaster', 'бедствие')|e], мы будем ежемесячно получать #G 0,1#! ед. [Concept('granadan_sovereignty', 'гранадского суверенитета')|e]"
 flavor_gra.16.entry: "$flavor_gra.16.title$"
 flavor_gra.16.title: "Противоречия в Малаге"
 flavor_gra.16.desc: "Борьба за суверенное существование на просторах #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! идёт тяжело: правители #ONCLICK:COUNTRY,[GetCountry('MOR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('MOR').Custom('CL_tt')],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#! надёжно засели в провинции [ShowProvinceDefinitionName('malaga_province')], которая по праву принадлежит нам.\n\n[target_character2.GetName] считает, что они заслужили это владение, поскольку мы как [ROOT.GetCountry.GetRank.GetName|l] обязаны им за оказанную некогда помощь. С другой стороны, сословия #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! утверждают, что такой поступок — покушение на нашу независимость, и призывают нас вернуть этот край."
 flavor_gra.16.a: "Вперёд, к завоеваниям!"
 flavor_gra.16.b: "Мы не станем воевать с соседями."
 flavor_gra.17.entry: "$flavor_gra.17.title$"
 flavor_gra.17.title: "Столица старого халифата"
 flavor_gra.17.desc: "#TOOLTIP:LOCATION,cordoba,X #L Кордова#!#! имеет для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! немаловажное значение: этот город, некогда богатый и процветающий, в прошлом был столицей #TOOLTIP:REGION,iberia_region,X #L иберийского#!#! халифата. Сегодня же разгул преступности приобрёл здесь невероятный размах, от столкновений с #TOOLTIP:RELIGIONGROUP,christian,X #L христианскими#!#! монархами от многих кварталов остались только развалины, и местные жители тихо проклинают наступившие в городе недобрые времена.\n\n[target_character.GetName] не собирается и дальше мириться с таким положением. В этом величественном городе заседали могущественнейшие правители #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, так почему бы не превратить его в величайшую столицу за всю историю человечества?"
 flavor_gra.17.a: "В Кордове снова наступит процветание!"
 flavor_gra.17.b: "Пусть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] остаётся на своём месте."
 flavor_gra.18.entry: "$flavor_gra.18.title$"
 flavor_gra.18.title: "Наперекор [GetCountry('CAS').Custom('CL_DAT')]"
 flavor_gra.18.desc: "Мы гордимся своей преемственностью от Андалусии, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] нашей державы не разделяет этой гордости: мы вынуждены выплачивать #ONCLICK:COUNTRY,[GetCountry('CAS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CAS').Custom('CL_tt')],X [GetCountry('CAS').Custom('CL_DAT')|L]#!#! унизительную дань. Она не даёт нашей экономике расти и лишь укрепляет нашего главного противника в борьбе за #TOOLTIP:REGION,iberia_region,X #L Иберию#!#!. Вместо того чтобы мириться с положением, наши командиры предлагают наконец сбросить с себя ярмо и освободиться от навязанного бремени — вряд ли для этого будет более удачный миг."
 flavor_gra.18.a: "Даже если в этот раз не получится, рано или поздно мы сбросим цепи."
 flavor_gra.18.b: "Подождём более удачной возможности, а пока останемся покорными."
 flavor_gra.19.title: "Отягощение бремени"
 flavor_gra.19.desc: "Наши добрые отношения с #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_INST')|L]#!#! закончились. Вместо того чтобы радоваться процветанию своей державы, [target_character.GetName], заметив, что наши границы уязвимы, [Select_CString(target_character.IsFemale, 'решила', 'решил' )] вовсе прекратить выплачивать нам дань. Разумеется, такое решение не осталось незамеченным, и теперь [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] единодушно заявляет: этим выскочкам необходимо напомнить об их обязательствах. Если нам и впредь не станут выплачивать дань, у нас будет повод присоединить [from_country.Custom('CL_ACC')] к себе раз и навсегда."
 flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip] падёт!"
 flavor_gra.19.a.entry: "Они заплатят за это!"
 flavor_gra.20.entry: "$flavor_gra.20.title$"
 flavor_gra.20.title: "Процветающие рынки Гранады"
 flavor_gra.20.desc: "Производство #TOOLTIP:GOODS,silk,X #L шёлка#!#!, которым с таким рвением наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] торгуют по всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!, продолжает приносить плоды: в #TOOLTIP:LOCATION,granada,X #L Гранаде#!#! открываются новые рынки, что, в свою очередь, лишь ещё больше подстёгивает торговлю. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|U] всячески — и деньгами, и связями — поощряют её развитие.\n\nМы построим величайший #TOOLTIP:BUILDING_TYPE,marketplace,X #L рынок#!#! во всей #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! — [ShowBuildingTypeName('al_qaysariyya_market')], куда будут стекаться и наши, и иностранные купцы, привозящие товары даже из самых далёких уголков мира."
 flavor_gra.20.a: "[ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')] — достойное вложение! Приступим к строительству."
 flavor_gra.20.b: "Увы, в этот раз наши [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] останутся разочарованными."
 flavor_gra.21.entry: "$flavor_gra.21.title$"
 flavor_gra.21.title: "Дворцовый город Кордова"
 flavor_gra.21.desc: "Произошедшая в XI веке фитна погрузила все #TOOLTIP:RELIGIONGROUP,muslim,X #L исламские#!#! державы #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! в хаос. Бессчётное количество людей погибло, а многие постройки оказались разрушены. Среди них — величественный дворец [ShowBuildingTypeName('madinat_al_zahra')], раскинувшийся на западной окраине #TOOLTIP:LOCATION,cordoba,X #L Кордовы#!#! и служивший символом власти халифов над исламским миром. От изысканных мечетей, пышных садов и заполненных воинами казарм остались только развалины.\n\n[target_character.GetName] хочет восстановить погубленный #TOOLTIP:LOCATIONRANK,city,X #L город#!#! и возвыситься над остальными правителями и претендентами, желающими бросить [Select_CString(target_character.IsFemale, 'ей', 'ему' )] вызов."
 flavor_gra.21.a: "Наш престиж затмит всё вокруг!"
 flavor_gra.21.b: "Пусть руины остаются руинами."
 flavor_gra.22.entry: "$flavor_gra.22.title$"
 flavor_gra.22.title: "[ShowBuildingTypeNameWithNoTooltip('library_cordoba')|U]"
 flavor_gra.22.desc: "[ShowBuildingTypeName('library_cordoba')|U] отстроена вновь, и в #TOOLTIP:LOCATION,cordoba,X #L Кордове#!#! наступила новая эпоха расцвета словесности и грамоты.\n\nКак в старые времена, учёные из всех уголков #TOOLTIP:RELIGIONGROUP,muslim,X #L исламского#!#! мира съезжаются в Кордову, чтобы припасть к обильному источнику знаний по литературе, науке, богословию… Благополучно складывается быт и у жителей города: они знакомятся с далёкими культурами и перенимают невиданные прежде обычаи."
 flavor_gra.22.a: "Жителей Кордовы ждёт процветание!"
 add_pop_satisfaction_based_on_literacy: "Все [Concept('pop', 'группы населения')|e] в этом [Concept('location', 'районе')|e] получат [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]. Оно зависит от [Concept('pop_literacy', 'грамотности населения')|e]"
 flavor_gra.23.entry: "$flavor_gra.23.title$"
 flavor_gra.23.title: "Гавань для любых знаний"
 flavor_gra.23.desc: "Благодаря нашей великодушной и непривычной во многих других державах политике [ROOT.GetCountry.GetName] сегодня — подлинное средоточие знаний и мудрости. Наши успехи в постижении богословия впечатляют настолько, что от желающих поступить в университеты страны почти что нет отбоя.\n\nДаже [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] сегодня выглядит иначе: мудрее и образованнее, чем прежде. Придворные предлагают устранить давно существующие в образовании ограничения, чтобы проложить путь для науки."
 flavor_gra.23.a: "Да здравствует прогресс!"
 flavor_gra.24.title: "Оплот ислама"
 flavor_gra.24.desc: "Вести о нашей победе в сражении за #TOOLTIP:REGION,iberia_region,X #L Иберию#!#! стремительно разнеслись по всему #TOOLTIP:RELIGIONGROUP,muslim,X #L исламскому#!#! миру. Мы совершили без преувеличения колоссальный подвиг: наша держава доказала, что может выдержать любую бурю. Для жителей #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! [target_character.GetName] — подлинный герой, защитник и оплот, оберегающий страну от врагов, стремящихся погрузить её в хаос."
 flavor_gra.24.a: "Возрадуемся!"
 flavor_gra.1000.entry: "$flavor_gra.1000.title$"
 flavor_gra.1000.title: "Выдающаяся личность"
 flavor_gra.1000.desc: "[target_character.GetName], выходец из династии [ShowDynastyName('nasrid_dynasty')], недавно [Select_CString(target_character.IsFemale, 'снискала', 'снискал' )] себе славу в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. За последние несколько лет кровавых войн с соседями этот человек проявил себя достойнейшим полководцем — тысячи воинов готовы следовать за [Select_CString(target_character.IsFemale, 'ней', 'ним' )] куда угодно. [Select_CString(target_character.IsFemale, 'Ей', 'Им' )] [Select_CString(target_character2.IsFemale, 'заинтересовалась сама', 'заинтересовался сам' )] [target_character2.GetName] — [Select_CString(target_character2.IsFemale, 'она', 'он' )] считает, что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] наверняка оценит по достоинству присутствие столь яркой особы. Однако такие [Select_CString(target_character.IsFemale, 'её', 'его' )] качества, как честолюбие вкупе с большими притязаниями, заставляют обеспокоиться…"
 flavor_gra.1000.a: "Великой державе нужны великие люди."
 gra_yusuf_will_most_likely_rebel: "Если [target_character.GetName] получит предложение служить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, впоследствии [Select_CString(target_character.IsFemale, 'она', 'он' )] может поднять восстание, в котором будет [Select_CString(target_character2.IsFemale, 'свергнута', 'свергнут' )] [target_character2.GetName]"
 flavor_gra.1000.b: "Лучше не будем рисковать."
 gra_banishing_yusuf_prevents_the_rebellion: "Если [target_character.GetName] будет [Select_CString(target_character.IsFemale, 'изгнана', 'изгнан' )], [Select_CString(target_character.IsFemale, 'она', 'он' )] не сможет поднять мятеж"
 flavor_gra.1000.c: "Знающие люди утверждают, что этот замысел обернётся против нас."
 flavor_gra.1001.title: "[target_character.GetNameWithNoTooltip] поднимает восстание"
 flavor_gra.1001.desc: "Воспользовавшись любовью народа к себе и собрав под свои знамёна легион последователей, [target_character.GetName] — человек, едва ли не более могущественный и влиятельный, чем даже [target_character2.GetName], — выдвигает властям державы ультиматум: либо мы отрекаемся от престола в [Select_CString(target_character.IsFemale, 'её', 'его' )] пользу, либо [target_character.GetNameWithNoTooltip] начинает в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! разрушительную войну."
 flavor_gra.1001.a: "Мы никогда не откажемся от престола ради какого-то выскочки!"
 flavor_gra.1001.b: "Не будем лишний раз проливать кровь. [target_character2.GetNameWithNoTooltip] отречётся."
 flavor_gra.1001.b.entry: "Не будем лишний раз проливать кровь. Мы отречёмся."
 flavor_gra.1100.entry: "$flavor_gra.1100.title$"
 flavor_gra.1100.title: "Восходящая звезда"
 flavor_gra.1100.desc: "Среди наших воинов на передовой начинают распространяться слухи о [Select_CString(target_character.IsFemale, 'некоей девушке', 'некоем юноше' )] по имени [target_character.GetName] — человеке необычайного таланта, стремительно продвигающегося по службе и уже дослужившегося до генерала. Говорят, что у [Select_CString(target_character.IsFemale, 'неё', 'него' )] глаз, как у орла: даже в гуще сражения [Select_CString(target_character.IsFemale, 'она', 'он' )] может окинуть взором поле боя и принять верное решение. Говорят, что никто ещё не смог одолеть [Select_CString(target_character.IsFemale, 'её', 'его' )] в бою на мечах. Однако лишь время покажет, много ли правды в этой молве…"
 flavor_gra.1100.a: "Мы будем с большим интересом наблюдать за карьерой этого дарования."
 flavor_gra.1100.b: "От таких людей можно ждать только беды."
 flavor_gra.1101.title: "Один из многих"
 flavor_gra.1101.desc: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetOralAddress|U]! Мы пришли к заключению, что несуразные слухи, распространяемые простыми солдатами, частично имеют под собой основание: этот человек действительно способен на невероятные свершения. Так, нам стало известно, что [Select_CString(target_character.IsFemale, 'ей', 'ему' )] удалось отбить фланговый удар вражеской кавалерии силами всего лишь одного полка. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] считает, что [Select_CString(target_character.IsFemale, 'ей', 'ему' )] стоит пожаловать высокий титул, поскольку столь выдающиеся подвиги заслуживают достойного вознаграждения. Пусть даже в стране много таких, как [Select_CString(target_character.IsFemale, 'она', 'он' )], но также вероятно, что перед нами — предвестник второго пришествия Халида ибн аль-Валида."
 flavor_gra.1101.a: "Нам нужно больше таких людей."
 flavor_gra.1102.title: "В окружении сторонников"
 flavor_gra.1102.desc: "После того как [target_character.GetName] [Select_CString(target_character.IsFemale, 'получила', 'получил' )] свой благородный титул, [Select_CString(target_character.IsFemale, 'её', 'его' )] ближайшие соратники вообразили себя кем-то вроде свиты: они стараются всячески потакать [Select_CString(target_character.IsFemale, 'её', 'его' )] потребностям и даже говорят от [Select_CString(target_character.IsFemale, 'её', 'его' )], когда [target_character.GetName] отсутствует. В поместье, что находится в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#!, не отбиться от посетителей: народные массы жаждут увидеть благородный лик. Некоторые даже настолько возвеличивают [Select_CString(target_character.IsFemale, 'её', 'его' )] подвиги, что доводят себя до религиозного исступления и едва ли не поклоняются этому человеку, словно богу."
 flavor_gra.1102.a: "Это сильно бросается в глаза…"
 flavor_gra.1103.title: "Появление претендента"
 flavor_gra.1103.desc: "Мы выяснили, почему свита, которой окружает себя [target_character.GetName], ведёт себя таким образом: эти люди распускают слух, что на самом деле полководец — выходец из младшей ветви легендарной династии [ShowDynastyName('umayyad_dynasty')], при которой в #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! когда-то наступил золотой век. И хотя подтвердить или опровергнуть это заявление невозможно, некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] уже углядели для себя возможность занять положение повыше, заручившись расположением ложного претендента. Численность этого культа разрослась до полноценной дивизии, и вскоре под угрозой может оказаться вся наша власть над армией."
 flavor_gra.1103.a: "Будем надеяться, что из этого ничего не выйдет."
 flavor_gra.1104.title: "День расплаты"
 flavor_gra.1104.desc: "Проклятье! Против нас поднято восстание! Под предлогом происхождения от семейства [ShowDynastyName('umayyad_dynasty')] [Select_CString(target_character.IsFemale, 'бунтовщица сплотила', 'бунтовщик сплотил' )] вокруг себя верных сторонников и [Select_CString(target_character.IsFemale, 'приказала', 'приказал' )] им двинуться на крупнейшие города страны, чтобы разжигать там беспорядки и рассказывать народу о существовании в державе истинного претендента на престол. Мы не отрицаем величия #TOOLTIP:LOCATION,cordoba,X #L кордовской#!#! династии [ShowDynastyNameWithNoTooltip('umayyad_dynasty')], при которой нашим предкам сопутствовало процветание, однако вряд ли у неё остались прямые потомки. Впрочем, народ об этом не задумывается; ему достаточно славных ратных подвигов. К делу претендента примыкают всё новые люди, и крики о том, что [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale, 'должна', 'должен' )] сложить с себя полномочия, становятся всё громче."
 flavor_gra.1104.a: "Сокрушить претендента!"
 flavor_gra.1104.b: "Здесь мы бессильны."
 flavor_gra.1200.entry: "$flavor_gra.1200.title$"
 flavor_gra.1200.title: "Помощь из Магриба"
 flavor_gra.1200.desc: "[ShowSituationName('battle_for_the_strait')|U] в самом разгаре, и только вмешательство другой державы может спасти нас от неизбежного разгрома. Поскольку за право одолеть нас первыми состязаются [GetCountry('CAS').GetName] и [GetCountry('MOR').GetName], очевидно, что следует обратиться к третьей стороне. Державы #TOOLTIP:REGION,maghreb_region,X #L Магриба#!#! близки нам по духу, и у них, особенно у сильнейшей страны региона — #ONCLICK:COUNTRY,[strongest_maghreb_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[strongest_maghreb_country.Custom('CL_tt')],X [strongest_maghreb_country.Custom('CL_GEN')|L]#!#!, собственный взгляд на происходящее. Возможно, [target_character2.GetName] не откажет нам в помощи, если мы обратимся с просьбой об интервенции?"
 flavor_gra.1200.a: "Нам отчаянно нужна подмога."
 flavor_gra.1200.b: "Мы не допустим интервенции даже ради собственного существования."
 flavor_gra.1201.title: "$flavor_gra.1200.title$"
 flavor_gra.1201.desc: "Из #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! к нам прибыл посол, чтобы обсудить сложившуюся в #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! обстановку. Нам сообщили, что [from_country.GetName] в безвыходном положении, и попросили любыми средствами, будь то золото или воины, помочь отстоять оказавшуюся под угрозой государственность."
 flavor_gra.1201.a: "Выделим им золото."
 flavor_gra.1201.b: "Отправим им на помощь воинов."
 flavor_gra.1201.c: "Поделимся и золотом, и воинами."
 flavor_gra.1201.d: "Мы не видим причины вмешиваться."
 flavor_gra.1300.entry: "$flavor_gra.1300.title$"
 flavor_gra.1300.title: "Помощь с востока"
 flavor_gra.1300.desc: "Падение #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! под натиском #L [target_country.GetAdjective|l]их#! войск стало серьёзным ударом для #TOOLTIP:RELIGIONGROUP,christian,X #L христианских#!#! королевств #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, осознавших свою уязвимость перед #TOOLTIP:RELIGIONGROUP,muslim,X #L исламскими#!#! захватчиками. [Select_CString(target_character2.IsFemale, 'Опьянённая', 'Опьянённый' )] триумфом [target_character2.GetName] теперь стремится завладеть новыми землями известного мира. Возможно, сейчас будет разумно послать делегацию в город [target_country.GetCapital.GetName] и попросить послать нам опытных полководцев и солдат, чтобы перенять у них ценный опыт."
 flavor_gra.1300.a: "Отправим делегацию."
 flavor_gra.1300.b: "Обойдёмся без их помощи."
 gra_demand_a_mercenary_company: "Мы попросим #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! предоставить нам либо [Concept('gold', 'дукаты')|e], либо компанию [Concept('mercenary', 'наёмников')|e] под командованием одного из их [Concept('characters', 'персонажей')|e]"
 flavor_gra.1301.title: "$flavor_gra.1300.title$"
 flavor_gra.1301.desc: "[target_character.GetName], владыка #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'послала', 'послал' )] в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! делегацию. Прибывшие в город послы поздравили нас с завоеванием #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! и передали самые тёплые слова о воинском мастерстве наших полководцев. Мы нанесли сильнейший удар #TOOLTIP:RELIGIONGROUP,christian,X #L христианскому#!#! миру, и теперь нас просят оказать другой стороне военную помощь: в #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! собираются ястребы, для которых нет ничего более отвратительного, чем #TOOLTIP:RELIGIONGROUP,muslim,X #L ислам#!#!. Возглавить экспедицию [Select_CString(mercenary_general.IsFemale, 'вызвалась', 'вызвался' )] [mercenary_general.GetName]; [Select_CString(mercenary_general.IsFemale, 'её', 'его' )] влечёт не только жажда славы, но и желание услужить: в случае удачного похода [target_character2.GetName] расширит границы [ROOT.GetCountry.Custom('rank_ru_GEN')|l] до самых Геркулесовых столбов."
 flavor_gra.1301.a: "Кто мы такие, чтобы мешать нашим воинам покорять новые земли?"
 flavor_gra.1301.b: "Полководцы и солдаты нужны нам самим, но мы можем поделиться золотом."
 flavor_gra.1301.c: "Нет смысла подбрасывать дрова в огонь, который почти потух."
 conquest_of_andalusi_integration_tt: "Завоевание [locations|e] с [ShowCultureName('andalusi')] [pops|e] даёт [integration|e], соразмерно доле этой [culture|e]"
 gra_cordoba_province_gains_core: "Каждый [location|e] в [target_location.GetProvinceDefinition.GetName] [province|e] становится [core|e] [ROOT.GetCountry.GetName]"
 leader_dies: "#Y [target_character.GetName] не выживает#!"
 leader_is_scarred: "#Y [target_character.GetName] выживает, но остаётся со шрамами#!"
