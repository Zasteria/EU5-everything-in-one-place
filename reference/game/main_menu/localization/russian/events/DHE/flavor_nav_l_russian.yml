l_russian:
 flavor_nav.1.title: "Совместное правление [target_character.GetNameWithNoTooltip] и [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.1.entry: "Совместное правление Жанны II и Филиппа д'Эврё"
 flavor_nav.1.desc: "После вступления на престол [ROOT.GetCountry.GetName] в 1329 году [target_character.GetName] и [target_character_2.GetName] правили [ROOT.GetCountry.GetFlavorRank] совместно; однако владения [target_character_2.GetNameWithNoTooltip] в [ShowRegionName('france_region')] явно предпочитаются обоими правителями, которые часто оставляют [ROOT.GetCountry.GetNameWithNoTooltip], чтобы обосноваться в своих [ShowCultureGroupNameWithNoTooltip('french_group')] землях.\n\nХотя [ROOT.GetCountry.GetGovernment.GetCourtTitle] нашёл немало способных регентов для управления [ROOT.GetCountry.GetFlavorRank] в отсутствие правителей, за последние годы недовольство лишь росло, и многие [ROOT.GetCountry.GetAdjectiveWithNoTooltip] лорды желают обратиться к обоим правителям с просьбой обосноваться в [ROOT.GetCountry.GetCapital.GetName] на постоянной основе, чтобы [ROOT.GetCountry.GetFlavorRank] не казался слабым в глазах алчных иноземных держав."
 flavor_nav.1.a: "Наши владения в [ShowRegionNameWithNoTooltip('france_region')] для нас важнее всего."
 flavor_nav.1.b: "Оба королевства должны управляться в равной степени."
 flavor_nav.1.c: "Земли [ROOT.GetCountry.GetNameWithNoTooltip] должны быть нашей главной заботой."
 flavor_nav.2.title: "Восшествие [target_character.GetNameWithNoTooltip] на престол"
 flavor_nav.2.entry: "Восшествие на престол Карла Наваррского"
 flavor_nav.2.desc: "После смерти [GetCharacter('nav_jeanne_ii_capet').GetName] честолюбивый [target_character.GetName] взошёл на престол. По прибытии в [ROOT.GetCountry.GetCapital.GetName] для проведения [ROOT.GetCountry.GetGovernment.GetAdjective|U] церемонии и коронации [target_character.GetSheHe] уже проявляет себя как нетипичный правитель, показывая [target_character.GetHerselfHimself] таковым, поскольку [target_character.GetNameWithNoTooltip] выразил желание принести присягу на [ShowDialectName('aragonese_dialect')]. Это вызвало некоторое недовольство среди [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], которое предпочло бы, чтобы присяга приносилась по традиции на [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.a: "Принести присягу на романском языке."
 flavor_nav.2.b: "Глупая затея: присяга должна быть принесена на [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.c: "Пусть присягу примут вместо этого на [ShowLanguageNameWithNoTooltip('basque_language')]."
 flavor_nav.3.title: "Владения [target_character.GetNameWithNoTooltip]"
 flavor_nav.3.entry: "Французские владения Карла Наваррского"
 flavor_nav.3.desc: "Унаследовав земли как [GetCharacter('nav_philip_iii_evreux').GetName], так и [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] теперь правит обширной территорией, охватывающей [ROOT.GetCountry.GetName] и несколько владений в пределах [ShowRegionName('france_region')]. Хотя [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] и [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] правили [ROOT.GetCountry.GetNameWithNoTooltip] совместно, они лишь ненадолго посещали [ROOT.GetCountry.GetFlavorRank], предпочитая обосноваться в [ShowRegionNameWithNoTooltip('france_region')].\n\nПосле восшествия [target_character.GetNameWithNoTooltip] на престол многие союзники в [ROOT.GetCountry.GetGovernment.GetCourtTitle] призвали [target_character.GetHerHim] обосноваться в [ROOT.GetCountry.GetNameWithNoTooltip] на постоянной основе, хотя другие считают, что [ROOT.GetCountry.GetGovernment.GetRulerTitle] может иметь более далёкие замыслы в отношении спорного престола [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.a: "Вести дела [ROOT.GetCountry.GetGovernment.GetCourtTitle] в наших владениях в [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.b: "Иметь [ROOT.GetCountry.GetGovernment.Custom('CL_ACC')] в [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.3.c: "Сосредоточим нашу власть на [evr_country.GetNameWithNoTooltip]."
 flavor_nav.3.c.entry: "Управлять нашими владениями из Эврё."
 nav_will_be_able_to_rally_other_appanages_tt: "Reaching #G 150#! relations with a Appanage subject of [GetCountry('FRA').GetName] will make them more inclined to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] through the [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')] [decision|e]"
 flavor_nav.4.title: "Притязание династии [ShowDynastyNameWithNoTooltip('capet_dynasty')]"
 flavor_nav.4.entry: "Капетианское притязание"
 flavor_nav.4.desc: "Хотя многие подозревали, что [target_character.GetName] — честолюбивый(ая) [ROOT.GetCountry.GetGovernment.GetRulerTitle], мало кто ожидал услышать о прямом желании [target_character.GetHerHis] претендовать на престол [fra_country.GetName]. Хотя претензии [target_character.GetNameWithNoTooltip] сильны благодаря крови [ShowDynastyName('capet_dynasty')] дома [GetCharacter('nav_jeanne_ii_capet').GetShortName], одним из условий наследования [GetCharacter('nav_jeanne_ii_capet').GetHerHis] [ROOT.GetCountry.GetName] было отречение от прав на [fra_country.GetNameWithNoTooltip].\n\nПоскольку многие лорды [fra_country.GetNameWithNoTooltip] также вряд ли полностью признают притязания [target_character.GetNameWithNoTooltip] из-за древнего закона [ShowHeirSelectionName('salic_law')], некоторые считают, что [target_character.GetNameWithNoTooltip] следует использовать [target_character.GetHerHis] политическое влияние внутри [fra_country.GetNameWithNoTooltip], чтобы убедить более влиятельных лордов."
 flavor_nav.4.a: "Престол [fra_country.GetNameWithNoTooltip] по праву принадлежит [target_character.GetNameWithNoTooltip]!"
 flavor_nav.4.a.entry: "Престол Франции по праву принадлежит Карлу!"
 flavor_nav.4.b: "Использовать эти притязания для укрепления легитимности среди наших [ShowCultureGroupNameWithNoTooltip('french_group')] подданных."
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] уже отреклась от [GetCharacter('nav_jeanne_ii_capet').GetHerHis] притязания: сосредоточимся вместо этого на правлении [ROOT.GetCountry.GetNameWithNoTooltip]."
 unlocks_enforce_the_capetian_claim_to_france_tt: "Открывает [decision|e] «$navarre_charles_ii_claim_to_france.title$»"
 nav_appanage_support_for_french_throne_tt: "If [ROOT.GetCountry.GetNameWithNoTooltip] is an Appanage, reaching #G +150#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will incline them to to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] through the [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')] [decision|e]"
 flavor_nav.5.title: "Союз с [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.5.entry: "Союз с Этьеном Марселем"
 flavor_nav.5.desc: "Первоначально многие усилия [target_character.GetName] по обретению поддержки не увенчались успехом: несколько [fra_country.GetAdjectiveWithNoTooltip] лордов заявили о своей верности [fra_ruler.GetName] и отвергли претензии [target_character.GetNameWithNoTooltip]. Но хотя [target_character.GetNameWithNoTooltip] удалось склонить на свою сторону некоторых менее влиятельных [fra_country.GetAdjectiveWithNoTooltip] лордов, многие советники [target_character.GetShortNameWithNoTooltip] не ожидали услышать, что видный [target_character_2.GetName] готов оказать [target_character.GetNameWithNoTooltip] поддержку от имени [target_character_2.GetHerHis]. Будучи членом [fra_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_character_2.GetNameWithNoTooltip] долгое время был(а) бельмом на глазу для [fra_ruler.GetNameWithNoTooltip], мешая многим усилиям [fra_ruler.GetHerHis] в Генеральных штатах. Хотя [target_character_2.GetNameWithNoTooltip] окажется бесценным приобретением, некоторые опасаются, что амбиции [target_character_2.GetHerHis] могут разойтись с намерениями [target_character.GetNameWithNoTooltip], и потому [target_character_2.GetSheHe] может обернуться скорее обременением.\n\nБолее того, [target_character_2.GetNameWithNoTooltip] принёс(ла) весть, что лорды [nrm_country.GetName] недовольны [fra_ruler.GetNameWithNoTooltip] и, вероятно, будут готовы поддержать [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] станет неоценимым соратником."
 flavor_nav.5.a.entry: "Этьен Марсель станет неоценимым соратником."
 flavor_nav.5.b: "Пусть [target_character_2.GetHerHim] перенаправляет доходы [fra_country.GetNameWithNoTooltip] в нашу казну."
 flavor_nav.5.b.entry: "Пусть он перенаправляет доходы Франции в нашу казну."
 flavor_nav.5.c: "Полностью отказаться от [target_character_2.GetHerHis] помощи. Мы возьмём [fra_country.GetNameWithNoTooltip] без [target_character_2.GetHerHis] интриг."
 flavor_nav.5.c.entry: "Полностью отказаться от его помощи. Мы возьмём Францию без его интриг."
 nav_decision_seizure_of_duchy_of_normandy_tt: "Открывает [decision|e] «$nav_coercing_of_normandy.title$»"
 flavor_nav.6.title: "Огненный конец"
 flavor_nav.6.entry: "Огненная смерть Карла Наваррского"
 flavor_nav.6.desc: "Хотя здоровье [target_character.GetName] в последние годы ухудшалось, [ROOT.GetCountry.GetGovernment.GetCourtTitle] всё же был потрясён известием о том, что [target_character.GetSheHe] погиб(ла) в пожаре в [target_character.GetHerHis] покоях прошлой ночью. По слухам, ходившим в [ROOT.GetCountry.GetGovernment.GetCourtTitle], во время лечения от [target_character.GetHerHis] недуга свеча упала на постель [target_character.GetNameWithNoTooltip] и та вспыхнула.\n\nТеперь [scope_our_heir.GetName] восходит на престол с меньшими притязаниями, чем у [our_ruler.GetHerHis] предшественника(-цы), и многие гадают, как летописцы [ROOT.GetCountry.GetName] запомнят правление [target_character.GetNameWithNoTooltip]."
 flavor_nav.6.a: "[target_character.GetHerHis|U] reign will be remembered as an ambitious, but terrible one."
 flavor_nav.6.b: "[target_character.GetSheHe|U] shall be remembered as the Conqueror of [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c: "[target_character.GetSheHe|U] shall be remembered for [target_character.GetHerHis] shift towards [ROOT.GetCountry.GetNameWithNoTooltip], despite [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')] origins."
 flavor_nav.6.d: "Нам следует смотреть в будущее."
 flavor_nav.7.title: "Спорные пограничные земли"
 flavor_nav.7.entry: "Раздел пограничных областей"
 flavor_nav.7.desc: "Хотя отношения между [ROOT.GetCountry.GetName] и [cas_country.GetName] в прошлом были враждебными, правители [cas_country.GetNameWithNoTooltip] никогда не стремились к полному завоеванию [ROOT.GetCountry.GetFlavorRank]. Однако в приграничных землях [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')] и [ShowProvinceDefinitionName('alava_province')] напряжённость между более влиятельными местными семьями нарастала уже некоторое время из-за нечётко определённых границ региона.\n\nХотя представители [cas_country.GetNameWithNoTooltip] и [our_ruler.GetName] работали над разрешением приграничных споров, вспышка [ShowDisasterNameWithNoTooltip('castilian_civil_war')] в [cas_country.GetNameWithNoTooltip] значительно застопорила дальнейшие переговоры, что привело к ещё большей вражде между видными местными династиями.\n\nТеперь, когда [cas_country.GetNameWithNoTooltip] оказалась погружена во внутренний конфликт, представители этих местных семей обратились к [our_ruler.GetNameWithNoTooltip] с просьбой начать вторжение, чтобы захватить спорные земли."
 flavor_nav.7.a: "Эти территориальные споры, если их не разрешить, скорее всего, продолжат злить [ROOT.GetCountry.GetAdjectiveWithNoTooltip] семейства."
 flavor_nav.7.b: "Приостановить все дальнейшие дипломатические переговоры: мы должны обеспечить наши права на этот регион!"
 flavor_nav.8.title: "Вакуум власти проникает в [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_nav.8.entry: "Вакуум власти проникает в Наварру"
 flavor_nav.8.desc: "Хотя [ShowDisasterNameWithNoTooltip('castilian_civil_war')] завершился, последствия по всей [ShowRegionName('iberia_region')] ещё ощущаются. Поскольку большая часть приграничных земель теперь менее защищена гарнизонами, старая вражда между семьями региона переросла в открытую войну.\n\nИз-за слабости [cas_country.GetName], накал конфликта в регионе представляет собой непростую задачу для [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetName]."
 flavor_nav.8.a: "[ROOT.GetCountry.GetNameWithNoTooltip] ждут опасные времена."
 nav_end_blood_feud_decision_enabled_tt: "Открывает [decision|e] «$nav_end_the_blood_feuds.title$»"
 nav_sow_division_in_the_borderlands_enabled_tt: "Открывает [decision|e] «$nav_sow_division_in_the_borderlands.title$»"
 flavor_nav.9.title: "Распад [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]"
 flavor_nav.9.entry: "Распад Бискайи"
 flavor_nav.9.desc: "Хотя контроль над [ShowProvinceDefinitionName('biscay_province')] долгое время оставался предметом спора между [cas_country.GetName] и [ROOT.GetCountry.GetName], регион был домом для многих видных семей, из которых династия Аро служила самым влиятельным и преданным вассалом. Однако [cas_country.GetNameWithNoTooltip] взялись напрямую распускать титулы в регионе, а затем аннексировали спорные земли в пределах [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')].\n\nЭти действия [cas_country.GetNameWithNoTooltip] сильно разгневали семью Аро, которая призвала [ROOT.GetCountry.GetGovernment.GetCourtTitle] финансировать повстанцев в [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')], чтобы покарать тех, кто поддержал аннексию региона [cas_country.GetAdjectiveWithNoTooltip]."
 flavor_nav.9.a: "Мы не можем пойти на уступки требованиям семьи Аро, не рискуя вызвать гнев [cas_country.GetAdjectiveWithNoTooltip]."
 flavor_nav.9.a.entry: "Мы не можем пойти на уступки требованиям семьи Аро, не рискуя вызвать гнев Кастилии."
 flavor_nav.9.b: "Поддержать семью Аро в их попытках посеять смуту на местах."
 flavor_nav.10.title: "Зов церкви"
 flavor_nav.10.entry: "$flavor_nav.10.title$"
 flavor_nav.10.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] отпускает свою старшую дочь в [ShowLocationName('paris')], и прямо сейчас она ожидает свиту, которая проводит её в новую жизнь.\n\n[target_character.GetName] родилась первой и унаследовала все владения родителей, но на этом её везение закончилось. [GetCountry('ARA').GetGovernment.GetRuler.GetName] отменил свадьбу с ней и в результате женился на её младшей сестре по имени [target_sister.GetShortName].\n\nТеперь женщину готовы принять парижские [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], и она собирается посвятить себя служению нашему Господу и Спасителю.\n\nОднако некоторые полагают, что [target_character.GetName] всё ещё может быть полезна государству и представляет некую ценность в переговорах."
 flavor_nav.10.a: "Она станет монахиней."
 flavor_nav.10.a.entry: "Использовать власть короны, чтобы не допустить дальнейшего кровопролития."
 flavor_nav.10.b: "Она ещё нам пригодится."
 flavor_nav.11.title: "Семьи, поддерживаемые [ROOT.GetCountry.GetAdjectiveWithNoTooltip], добиваются превосходства в [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.11.entry: "Семьи, поддерживаемые Наваррой, добиваются превосходства в приграничье"
 flavor_nav.11.desc: "Although the conflicts between the Pro [ROOT.GetCountry.GetAdjective] and [GetCountry('CAS').GetAdjective] families in the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] has left a devastating effect on the region, [ROOT.GetCountry.GetAdjectiveWithNoTooltip] families have managed to do the near impossible, and restore much of [ROOT.GetCountry.GetNameWithNoTooltip]'s influence over the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. While [GetCountry('CAS').GetNameWithNoTooltip] may still maneuver to reassert its control over the region, it will undoubtedly prove a costly affair for the [GetCountry('CAS').GetAdjectiveWithNoTooltip] [GetCountry('CAS').GetGovernment.GetCourtTitle]."
 flavor_nav.11.a: "Пусть это откроет путь к усилению [ROOT.GetCountry.GetNameWithNoTooltip]."
 navarre_gains_castile_basque_lands_tt: "Все владения [GetCountry('CAS').GetName] в [ShowScriptedGeographyName('nav_contested_basque_borderlands')] с высокой вероятностью перейдут под власть [ROOT.GetCountry.GetName], если только [GetCountry('CAS').GetNameWithNoTooltip] не решится на крайние меры, чтобы удержать контроль над этими землями"
 flavor_nav.12.title: "Укрепление эрмандад"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "Хотя эрмандады [ROOT.GetCountry.GetName] в прошлом доказали, что являются надёжными союзниками, десятилетия кровной вражды между различными семьями [ROOT.GetCountry.GetAdjectiveWithNoTooltip] достигли предела.\n\nМногие члены [ROOT.GetCountry.GetGovernment.GetCourtTitle] выделили средства на содержание [ROOT.GetCountry.GetGovernment.GetAdjective|U] ветви эрмандад. Несмотря на дороговизну этого предприятия, обретя силу, эрмандады помогут утвердить власть [our_ruler.GetName] над враждующими семьями и окончательно взять их под контроль."
 flavor_nav.12.a: "Эрмандады наконец положат конец этим семейным распрям."
 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] и опекунство над [scope_our_heir.GetNameWithNoTooltip]"
 flavor_nav.13.entry: "Хуан де Бомонт и опекунство над наследником"
 flavor_nav.13.desc: "Хотя Бомонты уже некоторое время пользуются влиянием в [ROOT.GetCountry.GetName], предложение лично наставлять [scope_our_heir.GetName] стало неожиданностью. Хотя [target_character.GetName] имеет репутацию человека чести, некоторые советники опасаются, что предложение [target_character.GetHerHis] об опекунстве может быть уловкой, чтобы заслужить расположение [scope_our_heir.GetNameWithNoTooltip], который однажды станет правителем [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_nav.13.a: "[target_character.GetHeShe|U] would make for an excellent tutor."
 flavor_nav.13.a.entry: "Он станет отличным наставником."
 flavor_nav.13.b: "Мы не можем допустить, чтобы [target_character.GetHerHim] имел влияние на нашего [scope_our_heir.GetNameWithNoTooltip]."
 flavor_nav.13.b.entry: "Мы не можем допустить, чтобы он имел влияние на нашего наследника."
 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] и [target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "Влияние супруга и Педро де Перальта"
 flavor_nav.14.desc: "Одна из знатных семей [ROOT.GetCountry.GetGovernment.GetCourtTitle], Аграмонты, накопила значительное влияние при [target_character.GetName], а также установила тесное сотрудничество с [scope_our_consort.GetName]. Хотя их вклад принёс плоды для [ROOT.GetCountry.GetName], некоторые опасаются, что за их интригами могут скрываться более тёмные цели."
 flavor_nav.14.a: "Аграмонты хорошо служили нам."
 flavor_nav.14.b: "[target_character.GetHerHis|U] influence with [scope_our_consort.GetNameWithNoTooltip] is concerning: move to seperate them."
 flavor_nav.14.b.entry: "Его влияние на консорта вызывает беспокойство: нужно разлучить их."
 flavor_nav.15.title: "Надвигающийся узурпаторский захват власти у [the_legal_heir.GetNameWithNoTooltip]"
 flavor_nav.15.entry: "Надвигающийся узурпаторский захват власти у наследника"
 flavor_nav.15.desc: "Хотя [our_ruler.GetName] правил(а) уверенно, недавно [our_ruler.GetSheHe] оказался(-ась) прикован(а) к постели болезнью. Опасаясь, что конец жизни [ROOT.GetCountry.GetGovernment.GetRulerTitle] близок, приверженцы Аграмонтов, верные [the_consort_usurper.GetName], тайно провозгласили [the_consort_usurper.GetHerHim] новым правителем [ROOT.GetCountry.GetName].\n\nВ то время как [the_legal_heir.GetNameWithNoTooltip] находится вдали от [ROOT.GetCountry.GetGovernment.GetCourtTitle], некоторые из Бомонтов тайно отправили письма в свиту [the_legal_heir.GetHerHis], надеясь известить [the_legal_heir.GetHerHim] о предательстве Аграмонтов. Если письма прибудут своевременно, возможно, ещё есть время собрать достаточно сторонников, чтобы подавить заговор Аграмонтов до того, как он увенчается успехом."
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] больше подходит на роль правителя [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.15.a.entry: "Двор больше подходит на роль правителя Наварры."
 flavor_nav.15.b: "Side with [the_legal_heir.GetNameWithNoTooltip], the legal ruler of [ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_nav.15.b.entry: "Встать на сторону нашего наследника, законного правителя Наварры!"
 flavor_nav.15.historical_info: "Соправители Бланка I и Хуан II постановили, что их сын Карл, принц Вианский, унаследует трон Наварры после смерти Бланки. Однако вместо того чтобы передать трон Карлу, Хуан II решил сохранить власть над землями Наварры, фактически став королём и свергнув собственного сына. Заручившись поддержкой партий Бомонте и Аграмонте, они впоследствии столкнулись в Наваррской гражданской войне, из которой Хуан II в итоге вышел победителем, сохранив за собой трон Наварры."
 flavor_nav.16.title: "Претензия [target_country.GetAdjectiveWithNoTooltip]"
 flavor_nav.16.desc: "Заручившись значительной поддержкой по всей [ShowRegionName('france_region')], [target_character.GetName] открыто заявил(а) о своих правах на трон [ShowRegionNameWithNoTooltip('france_region')] и разослал(а) гонцов по всей [ShowRegionNameWithNoTooltip('france_region')], предлагая последний шанс присоединиться к [target_character.GetHerHim] в [target_character.GetHerHis] попытке захватить его. Хотя [target_character.GetShortNameWithNoTooltip] снискал(а) немалую благосклонность нашего [ROOT.GetCountry.GetGovernment.GetCourtTitle], некоторые члены совета опасаются, что [target_character.GetSheHe] сильно дестабилизирует положение в [ShowRegionNameWithNoTooltip('france_region')], если [target_character.GetSheHe] добьется успеха."
 flavor_nav.16.a: "Мы заявим о поддержке [target_character.GetNameWithNoTooltip]."
 flavor_nav.16.b: "Остаться в стороне от этого конфликта."
 flavor_nav.16.c: "[target_character.GetSheHe|U] must be stopped."
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] will join [target_character.GetName]'s war for control of [ShowRegionName('france_region')]"
 flavor_nav.17.title: "Тяжкая доля [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.17.desc: "Многие наши земли вдоль [ShowScriptedGeographyName('nav_contested_basque_borderlands')] с [GetCountry('NAV').GetName] оказались захвачены про-[GetCountry('NAV').GetAdjectiveWithNoTooltip] фракциями, а многие семьи [ShowCultureName('basque')], верные [ROOT.GetCountry.GetName], были разорены. Хотя некоторые члены [ROOT.GetCountry.GetGovernment.GetCourtTitle] считают, что регион ещё не потерян, вернуть там власть будет непросто — многие местные жители теперь зависят от могущественных [GetCountry('NAV').GetAdjectiveWithNoTooltip] семей."
 flavor_nav.17.a: "Пусть приграничные земли отойдут к [GetCountry('NAV').GetNameWithNoTooltip]."
 flavor_nav.17.b: "Мы запомним это восстание народов [ShowCultureNameWithNoTooltip('basque')]."
 flavor_nav.17.c: "Немедленно подавить восстание, чего бы это ни стоило!"
 flavor_nav.20.title: "Монастырь Сан-Франциско в Олите"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] — очень набожный человек, поэтому [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'её', 'его')] так расстраивают темпы строительства монастыря Сан-Франциско в [ShowLocationName('olite')].\n\nРаботы ведутся уже более ста лет, и проект пока далёк от завершения.\n\nЧтобы ускорить строительство, нужно много денег, зато этот монастырь повысит наш престиж и станет новой точкой притяжения."
 flavor_nav.20.a: "И слава Богу!"
 flavor_nav.20.b: "Столько ждали, и ещё подождём."
 flavor_nav.20.historical_info: "По легенде, святой Франциск Ассизский основал монастырскую общину в Олите приблизительно в 1213-1214 году в ходе паломничества в Сантьяго-де-Компостелу.\n\nОфициально орден был учреждён королём Теобальдом II, а последующие правители Наварры — особенно Иоанна II и Карл II, — поддерживали объединение духовно и финансово, способствуя его развитию и привлечению новых последователей.\n\n Впоследствии община превратилась в апостольскую школу: здесь обучали миссионеров для отправки в Испанию и Америку, а во время кампании 1795 года здание было переоборудовано в госпиталь."
 flavor_nav.21.title: "Зов церкви"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] отпускает свою старшую дочь в [ShowLocationName('paris')], и прямо сейчас она ожидает свиту, которая проводит её в новую жизнь.\n\n[target_character.GetName] родилась первой и унаследовала все владения родителей, но на этом её везение закончилось. [GetCountry('ARA').GetGovernment.GetRuler.GetName] отменил свадьбу с ней и в результате женился на её младшей сестре по имени [target_sister.GetShortName].\n\nТеперь женщину готовы принять парижские [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], и она собирается посвятить себя служению нашему Господу и Спасителю.\n\nОднако некоторые полагают, что [target_character.GetName] всё ещё может быть полезна государству и представляет некую ценность в переговорах."
 flavor_nav.21.a: "Она станет монахиней."
 flavor_nav.21.b: "Она ещё нам пригодится."
 flavor_nav.21.historical_info: "Несмотря на то, что Жанна была обручена с Педро IV Арагонским, этот брак так и не состоялся. Историки предполагают, что она могла страдать от какого-то недуга или болезни, из-за которой стала непривлекательной невестой. Мария, её младшая сестра, заняла её место и вышла замуж за Педро вместо неё.\n\nПоскольку этот брак состоялся, Жанна была вынуждена отказаться от прав на престол и удалилась во францисканское аббатство Лоншан близ Парижа, став одной из «бедных клариссинок»."
 flavor_nav.30.title: "Ирригационные проекты в Туделе"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|L] подолгу задерживается в своих владениях во #TOOLTIP:REGION,france_region,X #L Франции#!#!, однако [ROOT.GetCountry.GetLongName] всегда остаётся в [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'её', 'его')] мыслях, и [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'она', 'он')] неизменно находит время на развитие тамошних проектов.\n\nЮжные области [ROOT.GetCountry.Custom('rank_ru_GEN')], в частности [ShowLocationName('tudela')], отличаются засушливым климатом, однако земли там плодородные. Выкопав несколько каналов, мы улучшим ирригацию полей, и они начнут приносить больше урожая."
 flavor_nav.30.a: "Это существенно повысит урожайность."
 flavor_nav.30.b: "У нас нет средств на такие задумки."
 flavor_nav.30.historical_info: "Во время своего правления Иоанна II и Филипп III воплотили в жизнь ряд проектов, поспособствовавших экономическому развитию Наварры. Одним из них стало расширение ирригационных систем в области Туделы — важнейшего южного города королевства."
 flavor_nav.40.title: "Копия «Законов Наварры»"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|L] всё больше внимания уделяет насущным проблемам своей державы, поэтому было решено заказать для [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'неё', 'него')] копию #italic «Законов Наварры»#!.\n\nМы привлечём к работе над копией самых искусных переписчиков, а её изящно украшенная обложка будет выполнена из первосортной кожи. Как того требует традиция, при составлении подобных документов используются [spanish_language.GetName] и [basque_language.GetName], точнее говоря, их причудливое смешение.\n\nБеда в том, что [ROOT.GetCountry.GetGovernment.GetRulerTitle] знает только [french_language.GetName] и совсем не владеет наваррско-арагонским языком."
 flavor_nav.40.a: "Мы переведём книгу на французский."
 flavor_nav.40.a.entry: "Мы добавим перевод на французский."
 flavor_nav.40.b: "Пусть правители учат свой исконный язык."
 flavor_nav.40.c: "Государственным языком должен стать баскский: на нём говорит большинство."
 flavor_nav.40.historical_info: "Вероятно, для большинства подданных Королевства Наварры родным языком являлся баскский (#italic Lingua Navarrorum#!), однако в официальных документах, как правило, использовался наваррско-арагонский язык (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! или #italic Lengoage de Navarra#!), поскольку окситанский к тому времени вышел из обихода.\n\nКроме того, с 1234 года, когда на трон Наварры взошёл первый представитель Шампанской династии, в высших кругах начал набирать популярность французский."
 flavor_nav.50.title: "Осада Альхесираса"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "До нас дошла новость о военных действиях на #L [target_country.GetAdjective]ой#! границе. [GetCountry('CAS').GetName] возобновляет крестовый поход на [target_country.Custom('CL_ACC')], и [target_character.GetName] спешно [Select_CString(target_character.IsFemale,'вернулась', 'вернулся')] в [ROOT.GetCountry.Custom('CL_ACC')], чтобы принять участие в сражениях.\n\nХотя вмешательство в этот конфликт не несёт очевидной выгоды [ROOT.GetCountry.Custom('rank_ru_DAT')], мы считаем своим долгом помочь соседям изгнать #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#! из #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!."
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] поведёт наших бойцов."
 flavor_nav.50.a.entry: "Наш человек поведёт за собой воинов."
 flavor_nav.50.b: "Мы отправим бойцов, но [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'нужна', 'нужен')] нам здесь."
 flavor_nav.50.b.entry: "Мы отправим бойцов, но он нужен нам здесь."
 flavor_nav.50.c: "[ROOT.GetCountry.GetNameWithNoTooltip] не станет в это вмешиваться."
 flavor_nav.50.c.entry: "Нас это не касается."
 flavor_nav.50.historical_info: "В 1343 году Филипп, правитель Наварры, принял решение присоединиться к крестовому походу на Гранаду: он считал своим долгом освободить Иберию от мусульман. Хотя его войско было небольшим, оно, как и организованная королём доставка провизии через Бискайский залив, сыграло важную роль в осаде Альхесираса. К несчастью, вскоре Филипп тяжёло заболел и в сентябре 1343 года скончался. Его тело доставили в Памплону, а сердце захоронили в Париже. Свои соболезнования Иоанне, вдове короля, высказал сам папа римский Климент VI. В конечном итоге Альхесирас пал. Иоанна правила Наваррой до своей смерти в 1349 году, а после трон перешёл Карлу II, сыну Иоанны и Филиппа."
 flavor_nav.60.title: "Последняя воля королевы"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "[target_character.GetName] отходит в лучший мир. В письме, выражающем его последнюю волю, король просит [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'свою преемницу', 'своего преемника')] возвести часовню для церкви Санта-Мария-ла-Реаль, расположенной в городе [ShowLocationName('olite')].\n\nНекоторые придворные предлагают назвать будущую постройку часовней Непорочного зачатия Девы Марии. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] хочет во что бы то ни стало претворить проект в жизнь, ведь [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'ему', 'ей')] прекрасно известно, насколько набожным был [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.60.a: "Последняя воля королевы должна быть исполнена."
 flavor_nav.60.b: "Мы найдём этим средствам лучшее применение."
 flavor_nav.60.historical_info: "В 1349 году королева Иоанна II умирает от чумы. В письме, выражающем её последнюю волю, она, помимо всего прочего, просит своего сына Карла II выделить средства на строительство часовни для готической церкви Санта-Мария-ла-Реаль, расположенной в Олите.\n\nВ этой церкви члены династии Эврё проводили религиозные церемонии и обряды. По своей архитектуре она напоминает Собор Парижской Богоматери."
 #Decisions
 navarre_charles_ii_claim_to_france.title: "Законные права на [GetCountry('FRA').GetNameWithNoTooltip]"
 navarre_charles_ii_claim_to_france.desc: "Although [GetCharacter('nav_jeanne_ii_capet').GetName] abandoned [GetCharacter('nav_jeanne_ii_capet').GetHerHis] claim to [GetCountry('FRA').GetNameWithNoTooltip], [GetCharacter('nav_charles_ii_evreux').GetName] still maintains a direct blood lineage to the old [GetCharacter('fra_louis_x_capet').GetName]. Even should the [ShowHeirSelectionName('salic_law')] wrongly decree [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] ineligible, [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip]'s claim is still stronger than that of the current rulers of [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france.a: "Настало время заявить наши законные права на [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
 navarre_charles_ii_claim_to_france_appanage_route.a: "The time has come to launch a civil war to claim the throne!"
 nav_appanage_willingness_to_join_tt: "Reaching #G +150#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will make them incline to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 nav_coercing_of_normandy.title: "Принуждение [GetCountry('NRM').GetNameWithNoTooltip]"
 nav_coercing_of_normandy.desc: "Находясь на переднем крае [ShowSituationNameWithNoTooltip('hundred_years_war')], многие лорды [GetCountry('NRM').GetName] стали выражать недовольство нынешним правителем [GetCountry('FRA').GetName]. Благодаря унаследованным землям [GetCharacter('nav_philip_iii_evreux').GetName], [GetCharacter('nav_charles_ii_evreux').GetName] сохранил тесные связи с людьми в [GetCountry('NRM').GetFlavorRank], некоторые из которых, возможно, готовы признать [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] своим новым сюзереном."
 nav_coercing_of_normandy.a: "Захватить власть над [GetCountry('NRM').GetNameWithNoTooltip]!"
 nav_end_the_blood_feuds.title: "Положить конец кровной вражде"
 nav_end_the_blood_feuds.desc: "С окончания [ShowDisasterName('castilian_civil_war')] значительная часть [GetCountry('NAV').GetName] оставалась ареной затяжной кровной вражды между семьями, осмелевшими из-за ослабления влияния [GetCountry('CAS').GetAdjectiveWithNoTooltip]. Теперь, когда влияние [GetCountry('NAV').GetAdjectiveWithNoTooltip] укрепилось, мы можем воспользоваться этим и раз и навсегда покончить с этой враждой."
 nav_end_the_blood_feuds.a: "Власть восстановлена!"
 nav_sow_division_in_the_borderlands.title: "Посеять раздор в приграничье"
 nav_sow_division_in_the_borderlands.desc: "Поскольку влияние [GetCountry('CAS').GetAdjective] в [ShowScriptedGeographyName('nav_contested_basque_borderlands')] ныне лишь тень прежнего, продолжающаяся вражда между семьями региона, верными [GetCountry('NAV').GetName], может оказаться полезной, если мы решим поддержать их открытую борьбу против других семей, всё ещё верных [GetCountry('CAS').GetNameWithNoTooltip]. Хотя это может обойтись недёшево, [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] способны вновь воссоединиться с [GetCountry('NAV').GetNameWithNoTooltip]."
 nav_sow_division_in_the_borderlands.a: "Разрешить разорять владения соперничающих семей."
 nav_sow_division_in_the_borderlands.b: "Сжечь окраины приграничья."
 nav_sow_division_in_the_borderlands.c: "Посеять недоверие на землях, удерживаемых [GetCountry('CAS').GetAdjectiveWithNoTooltip]."
 nav_sow_division_in_the_borderlands_a_tt: "Каждый [location|e], находящийся [owned|e] у [GetCountry('CAS').GetName] в [ShowScriptedGeographyName('nav_contested_basque_borderlands')], получит [ShowModifier('nav_feud_crossfire')] на 3 года и понесёт серьёзные потери [prosperity|e] и [pop_satisfaction|e]"
 nav_sow_division_in_the_borderlands_b_tt: "Каждый [location|e], находящийся [owned|e] у [GetCountry('CAS').GetName] в [ShowScriptedGeographyName('nav_contested_basque_borderlands')], получит [ShowModifier('nav_destructive_feuds')] на 3 года и понесёт умеренные потери [prosperity|e], [pop_satisfaction|e] и [development|e]"
 nav_sow_division_in_the_borderlands_c_tt: "Каждый [location|e], находящийся [owned|e] у [GetCountry('CAS').GetName] в [ShowScriptedGeographyName('nav_contested_basque_borderlands')], получит [ShowModifier('nav_widespread_distrust_caused_by_feuds')] на 3 года и понесёт умеренные потери [prosperity|e], [pop_satisfaction|e] и [control|e]"
