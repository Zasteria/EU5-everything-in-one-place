l_russian:
 flavor_gen_tun.1.title: "Лёгкая добыча"
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.1.desc: "Древний и прекрасный [target_location.GetRank.GetName|l] [target_location.GetName] возвышается над #TOOLTIP:LOCATION,cape_tajura,X #L мысом Таджура#!#!. Несмотря на то что [ShowScriptedGeographyName('mediterranean_sea_geography')] и его экономика немыслимы без этого важного торгового центра, он по-прежнему остаётся во владении [target_country.Custom('longname_ru_GEN')] — государства, слишком слабого, чтобы самостоятельно отразить наше вторжение. Мы можем высадиться в провинции [ShowProvinceDefinitionName('tripolitania_province')], разграбить побережье и затем продать завоёванные земли соседнему государству или и вовсе оставить их себе."
 flavor_gen_tun.1.a: "Прекрасная идея!"
 flavor_gen_tun.1.b: "Такой шанс выпадает лишь тем, кто готов взяться за оружие."
 flavor_gen_tun.2.title: "Продажа Триполи"
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.2.desc: "Завоевав и разграбив [target_location.GetRank.Custom('LR_ACC')|l] [target_location.GetName], [ROOT.GetCountry.GetFlavorRank|l] получи[ROOT.GetCountry.Custom('endrank_fem')] крупную колонию в области [target_location.GetArea.GetName], чья культура и вера сильно отличаются от культуры и веры её новой метрополии в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Возможно, стоит передать эти земли одному из соседних племён."
 flavor_gen_tun.2.a: "Продадим новую колонию соседнему племени Бану Табит."
 flavor_gen_tun.2.b: "Возможно, племя Бану Макки пожелает выкупить свои земли."
 flavor_gen_tun.2.c: "[tunis_location.GetOwner.GetLongNameWithNoTooltip] несомненно заинтересуется нашим предложением."
 flavor_gen_tun.2.d: "[target_location.GetRank.GetNameWithNoTooltip|U] [target_location.GetNameWithNoTooltip] принадлежит нам!"
 flavor_gen_tun.2.d.entry: "Триполи принадлежит нам!"
 sale_of_tripoli_tt: "Мы продадим наши колонии в [target_location.Custom('LR_PREP')|l] [target_location.GetName] за [SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [Concept('gold', 'дукатов')|e], передав вместе с ними все связанные [Concept('locations', 'районы')|e] (всего [Concept('locations', 'районов')|e]: #Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#!)"
 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
 flavor_gen_tun.3.desc: "Посланник из #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! прибыл в [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName] с предложением продать нам их владения в [target_location.Custom('LR_PREP')|l] [target_location.GetName] за немалые деньги. И всё же значение #L #TOOLTIP:COUNTRY_RANK,[target_location.GetRank.Custom('CF_tt')],X [target_location.GetRank.Custom('rank_ru_GEN')|l]#!#! сложно переоценить — приобретение этих владений стало бы весьма полезным для [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_gen_tun.3.desc_banu_makki: "За дерзость, которую продемонстрирова[from_country.Custom('endlong_fem')] [from_country.GetLongName], их покарает [ROOT.GetCountry.GetReligion.GetGodName]! Захватив наш прекрасный [target_location.Custom('LR_ACC')|l] [target_location.GetName], они теперь предлагают нам «возможность» выкупить его обратно. А самое досадное то, что нам, вероятно, действительно придётся принять их предложение…"
 flavor_gen_tun.3.a: "Хорошо, мы согласны."
 flavor_gen_tun.3.b: "Зачем платить за то, что можно взять силой?"
 flavor_gen_tun.3.c: "При всём уважении, нам всё равно."
