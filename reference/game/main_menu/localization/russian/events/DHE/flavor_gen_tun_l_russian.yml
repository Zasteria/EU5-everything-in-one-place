l_russian:
 flavor_gen_tun.1.title: "Спелый плод для срывания"
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.1.desc: "Древний и прекрасный [target_location.GetRank.GetName] [target_location.GetName] возвышается над [ShowLocationName('cape_tajura')]. Несмотря на его значение для экономики региона [ShowScriptedGeographyName('mediterranean_sea_geography')], он остаётся в руках [target_country.GetLongName] — государства слишком слабого, чтобы в одиночку противостоять нашему вторжению. Мы могли бы высадиться в [ShowProvinceDefinitionName('tripolitania_province')], разграбить побережье, а затем продать наши завоевания соседнему государству — или даже оставить их себе."
 flavor_gen_tun.1.a: "Прекрасная идея!"
 flavor_gen_tun.1.b: "Такие возможности — удел любителей войны."
 flavor_gen_tun.2.title: "Продажа $tripoli$"
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.2.desc: "После завоевания и разграбления [target_location.GetName] наш [ROOT.GetCountry.GetFlavorRank] теперь владеет обширной колонией в области [target_location.GetArea.GetName] — землёй, весьма отличной по культуре и вере от нашей метрополии в [ROOT.GetCountry.GetCapital.GetName]. Возможно, стоит передать её одному из соседних племён."
 flavor_gen_tun.2.a: "Продать её соседнему племени Бану Сабит."
 flavor_gen_tun.2.b: "Возможно, Бану Макки заинтересуются выкупом своих прежних земель."
 flavor_gen_tun.2.c: "Мы уверены, что [tunis_location.GetOwner.GetLongNameWithNoTooltip] будут заинтересованы."
 flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip] принадлежит нам!"
 flavor_gen_tun.2.d.entry: "$tripoli$ принадлежит нам!"
 sale_of_tripoli_tt: "Мы продадим наши колонии в [target_location.GetName] за [SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [gold|e], передав все связанные с ними [locations|e] — итого #Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#! [locations|e]"
 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
 flavor_gen_tun.3.desc: "Посланник от [from_country.GetName] прибыл в [ROOT.GetCountry.GetCapital.GetName], предлагая продать нам свои территории в [target_location.GetName] за немалую цену. Однако ценность [target_location.GetRank.GetName] не стоит недооценивать — это было бы хорошим приобретением для [ROOT.GetCountry.GetFlavorRank]."
 flavor_gen_tun.3.desc_banu_makki: "Дерзость, проявленная [from_country.GetLongName], заслуживает наказания непосредственно от [ROOT.GetCountry.GetReligion.GetGodName]! Завоевав наш прекрасный [target_location.GetRankAndName], они теперь предлагают нам «возможность» заплатить за его возвращение. Самое досадное в этом то, что мы, пожалуй, и вправду можем принять их предложение..."
 flavor_gen_tun.3.a: "Хорошо, мы согласимся."
 flavor_gen_tun.3.b: "Зачем платить за то, что мы можем завоевать?"
 flavor_gen_tun.3.c: "При всём уважении, нам это неважно."
