l_russian:
 VER_benefits_from_winning_the_war: "В конфликте «[target_war.GetName]» нам будет доступно [Concept('peace_offer', 'предложение о мире')|e] «[ShowPeaceTreatyTypeName('scaligeri_victory')]»"
 ver_remove_antagonism: "Исчезнет [Concept('antagonism', 'неприязнь')|e] #ONCLICK:COUNTRY,[THIS.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[THIS.GetCountry.Custom('CL_tt')],X [THIS.GetCountry.Custom('CL_GEN')|L]#!#! по отношению к другим [Concept('countries', 'державам')|e], вызванная требованиями [Concept('peace_treaty', 'мирного договора')|e]"
 ver_add_integration_in_every_location: "Каждый находящийся [Concept('owned', 'во владении')|e] [Concept('location', 'район')|e] в регионе [ShowScriptedGeographyName('scaligeri_conquests_geography')] получит #G +100%#! к [Concept('integration', 'интеграции')|e]"
 SCALIGER_WAR_NAME: "Война Скалигеров"
 ver_demands_start: "Мы запросим"
 ver_demands_end: "как часть мирного договора в конфликте «[target_war.GetName]»"
 ver_demands_FLO_pescia_demand: "$ver_demands_start$ район [ShowLocationName('pescia')] $ver_demands_end$"
 ver_demands_FLO_lucca_demand: "$ver_demands_start$ провинцию [ShowProvinceDefinitionName('lucca_province')] $ver_demands_end$"
 ver_demands_VEN_mestre_demand: "$ver_demands_start$ район [ShowLocationName('mestre')] $ver_demands_end$"
 ver_demands_VEN_treviso_demand: "$ver_demands_start$ провинцию [ShowProvinceDefinitionName('venice_province')] $ver_demands_end$"
 ver_demands_MLO_brescia_demand: "$ver_demands_start$ провинцию [ShowProvinceDefinitionName('brescia_province')] $ver_demands_end$"
 ver_demands_MLO_parma_demand: "$ver_demands_start$ провинцию [ShowProvinceDefinitionName('parma_province')] $ver_demands_end$"
 ver_effect_depends_on_scope: "Эффекты [Concept('peace_treaty', 'мирного договора')|e] будут зависеть от выборов, сделанных в ходе [Concept('event', 'события')|e]"
 VER_benefits_for_coalition_members: "Атакующая сторона в конфликте «[target_war.GetName]» будет получать [Concept('events', 'события')|e], позволяющие выдвинуть претензии на различные пограничные территории; захват территорий другими способами будет недоступен"
 VER_cannot_take_territory_besides_scripted_peace_deal: "Захватывать территорию необходимо с помощью особых мирных договоров, доступ к которым открывается в [Concept('events', 'событиях')|e] войны Скалигеров"
 scaligeri_war_historical_info: "К середине 1336 года затянувшийся конфликт рода Скалигеров с Венецией привёл к войне. Поводом для конфликта стало перекрытие реки По цепями — таким образом Верона могла собирать пошлины за проход, что напрямую угрожало венецианской коммерции. Попытки разрешить спор путём переговоров наткнулись на жёсткую позицию сената Светлейшей Республики: Венеция приостановила поставки соли, из-за чего принадлежавшая тогда Скалигерам Падуя была вынуждена самостоятельно заняться производством этого продукта. К 22 июня наступило бесповоротное обострение: Флоренция и Венеция подписали соглашение, по которому первая обязывалась покрыть две трети расходов на предстоящую войну."
 flavor_ver.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.1.desc: "Владения династии [target_dynasty.GetName], которые в своё время потом и кровью [Select_CString(target_character.IsFemale, 'добывала', 'добывал' )] [target_character.GetName], в последние годы стали лакомым кусочком для огромного союза небольших государств севера #TOOLTIP:REGION,italy_region,X #L Италии#!#!, куда изначально входили только [GetCountry('VEN').GetLongName] и [GetCountry('FLO').GetLongName]. Наши попытки разрешить конфликт мирным путём потерпели крах: судьи решили самым предательским образом занять сторону наших врагов. Впрочем, им же хуже: теперь они тоже понесут наказание."
 flavor_ver.1.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.1.a: "Слабых ждёт истребление."
 flavor_ver.2.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.2.desc: "На воинственный дом [target_dynasty.GetName] точит нож огромный союз, который возглавляет [anti_scaligeri_leader.GetLongName]. [target_war.GetName|U] может окончиться в нашу пользу, если мы найдём в себе силы создать перелом, но для этого нам понадобится помощь новых союзников. На границе с #ONCLICK:COUNTRY,[target_ver.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_ver.Custom('CL_tt')],X [target_ver.Custom('CL_INST')|L]#!#! собираются #L [mlo_participant.GetAdjective|l]ие#! силы — [mlo_army.GetName], [flo_participant.GetLongName] поддерживает войну своими обширными финансами, а во главе нашей армии стоит [target_character.GetName]. Вскоре [target_ver.GetAdjectiveWithNoTooltip|l]ие солдаты восторжествуют, и в #TOOLTIP:REGION,italy_region,X #L Италии#!#! снова воцарится мир."
 flavor_ver.2.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.2.a: "Мы сотрём с лица земли проклятых Скалигеров!"
 ver_owner_is_an_defender: "[THIS.GetLocation.Custom('LR_INST')] [THIS.GetLocation.GetName] [Concept('owner', 'владеет')|e] держава, являющаяся [Concept('defender', 'обороняющейся стороной')|e] в конфликте «[target_war.GetName]»"
 ver_controller_is_an_attacker: "[THIS.GetLocation.Custom('LR_ACC')|l] [THIS.GetLocation.GetName] [Concept('controller', 'контролирует')|e] держава, являющаяся [Concept('attacker', 'атакующей стороной')|e] в конфликте «[target_war.GetName]»."
 flavor_ver.3.title: "Наши претензии на провинцию [target_province.GetNameWithNoTooltip]"
 flavor_ver.3.desc: "[target_war.GetName] против династии [target_dynasty.GetName] [target_country.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#! идёт превосходно: недавно наши войска заняли провинцию [target_province.GetName] — местность, где [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! пользуется сильным влиянием. Возможно, стоит выдвинуть на неё притязания, чтобы наши союзники в #ONCLICK:COUNTRY,[war_leader.Custom('CL_tt')] #TOOLTIP:COUNTRY,[war_leader.Custom('CL_tt')],X [war_leader.Custom('CL_PREP')|L]#!#! знали, что у нас есть собственный интерес к владениям династии [target_dynasty.GetNameWithNoTooltip]."
 flavor_ver.3.entry: "Миланские требования в войне Скалигеров"
 flavor_ver.3.a: "Выдвинуть притязания."
 flavor_ver.3.b: "Может быть, нам лучше подойдёт [ShowProvinceDefinitionNameWithNoTooltip('parma_province')]?"
 flavor_ver.4.title: "Наши претензии на район [target_location.GetNameWithNoTooltip]"
 flavor_ver.4.desc: "На наших глазах терпит крах династия [target_dynasty.GetName] — бывший гегемон Северной #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Такой успех стал возможен лишь благодаря нашим стараниям и стараниям наших союзников. Теперь о своих интересах непременно заяв[ROOT.GetCountry.Custom('endlong_ityat')] [ROOT.GetCountry.GetLongName] — держава, в 1336 году покрывшая из своей казны две трети расходов на войну. А что касается нас, то нам по душе [target_country.GetName] — держава Скалигеров, долго и упорно сопротивлявшаяся владычеству #TOOLTIP:LOCATION,florence,X #L Флоренции#!#!."
 flavor_ver.4.entry: "Флорентийские требования в войне Скалигеров"
 flavor_ver.4.a: "Предъявить претензии на район [ShowLocationNameWithNoTooltip('pescia')]."
 flavor_ver.4.b: "[target_country.GetCapital.GetRank.GetNameWithNoTooltip] принадлежит нам целиком!"
 flavor_ver.4.b.entry: "Город принадлежит нам целиком!"
 flavor_ver.5.title: "Наши претензии на провинцию [target_province.GetNameWithNoTooltip]"
 flavor_ver.5.desc: "Война — страшно затратное дело… Или же не совсем?\n\n[target_war.GetName|U], похоже, всё-таки может обернуться для нас выигрышным образом, даже несмотря на всю пролитую кровь. Заявленная цель этого конфликта — свержение династии [target_dynasty.GetName], однако в процессе мы сможем получить территории, которые представители этой самой династии отвоевали в других, не менее кровавых сражениях. Возможно, мы раздвинем границы в сторону таких территорий, как [target_location.GetName] и даже провинция [target_province.GetName] — земель, культурно близких к [ROOT.GetCountry.Custom('rank_ru_DAT')|l]."
 flavor_ver.5.entry: "Венецианские требования в войне Скалигеров"
 flavor_ver.5.a: "[target_location.GetNameWithNoTooltip] будет принадлежать нам!"
 flavor_ver.5.a.entry: "Местре будет принадлежать нам!"
 flavor_ver.5.b: "[target_province.GetNameWithNoTooltip] станет основой #italic Terraferma#!."
 flavor_ver.5.b.entry: "Веронская Венето станет основой #italic Terraferma#!."
 flavor_ver.6.title: "Притязания [from_country.Custom('CL_GEN')]"
 flavor_ver.6.desc: "Из [from_country.Custom('longname_ru_GEN')] прибыл гонец, привёзший нам требования этой державы к династии [target_dynasty.GetName] из #ONCLICK:COUNTRY,[war_enemy.Custom('CL_tt')] #TOOLTIP:COUNTRY,[war_enemy.Custom('CL_tt')],X [war_enemy.Custom('CL_GEN')|L]#!#!. Нам нужно поразмыслить, какой облик примет [target_peace_treaty.GetName] и на каких условиях закончится [target_war.GetName], иначе [from_country.GetAdjectiveWithNoTooltip|l]ие послы сочтут, что мы нарушили слово."
 flavor_ver.6.a: "Мы рассмотрим их просьбу — когда придёт время."
 ver_peace_treaty_has_become_available: "В конфликте «[target_war.GetName]» доступен мирный договор «[target_peace_treaty.GetName]»"
 flavor_ver.7.title: "Наш триумф"
 flavor_ver.7.desc: "Долгие годы кровопролития подошли к концу: $SCALIGER_WAR_NAME$ завершилась. Сегодня #L [ROOT.GetCountry.GetAdjective|l]ие#! войска маршируют по [target_location.Custom('LR_DAT')|l] [target_location.GetName], торжествуя над поверженными врагами. Мы воевали не просто за господство над севером #TOOLTIP:REGION,italy_region,X #L Италии#!#!: на кону стояло имя «[target_character.GetName]» — человека, основавшего [ROOT.GetCountry.Custom('longname_ru_ACC')], и мы всеми силами отстаивали [Select_CString(target_character.IsFemale, 'её', 'его' )] наследие."
 flavor_ver.7.a: "Слава династии [target_dynasty.GetNameWithNoTooltip]!"
 flavor_ver.8.title: "Победа лиги"
 flavor_ver.8.desc: "Судьба воинственной династии [target_dynasty.GetName] решилась: проклятые Скалигеры потерпели поражение, а владения, где когда-то [Select_CString(target_character.IsFemale, 'властвовала', 'властвовал' )] [target_character.GetName], опустошены. Закончились те годы, когда Северной #TOOLTIP:REGION,italy_region,X #L Италией#!#! могли единолично править тираны. Мы вершим историю #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, и на наших глазах наступил поворотный её момент!"
 flavor_ver.8.a: "Скатертью дорога!"
 flavor_ver.1000.title: "[target_character2.GetNameWithNoTooltip] и [Select_CString(target_character2.IsFemale, 'её', 'его' )] родня"
 flavor_ver.1000.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale, 'изгнанная правительница', 'изгнанный правитель' )] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! и [Select_CString(target_character.IsFemale, 'родственница', 'родственник' )] такого деятеля, как [target_character2.GetName], даже сегодня занимает должность викария. Это означает, что [target_country.GetCapital.GetRankAndName|l] и сегодня в какой-то мере находится под [Select_CString(target_character.IsFemale, 'её', 'его' )] влиянием. [target_character.GetShortNameWithNoTooltip] формально [Select_CString(target_character.IsFemale, 'верна', 'верен' )] семейству [target_dynasty.GetName], но при этом пользуется расположением в своих старых владениях и наверняка держит злость на Скаллигеров за преступления против династии [target_character.GetDynasty.GetName]. Кроме того, нам известно, что [Select_CString(target_character.IsFemale, 'она неравнодушна', 'он неравнодушен' )] к служащему нам кондотьеру по имени [target_character2.GetShortNameWithNoTooltip]. Если [Select_CString(target_character.IsFemale, 'её', 'его' )] [target_country.GetCapital.GetRank.GetName|l] окажется под обстрелом наших осадных орудий, мы не сомневаемся, что [Select_CString(target_character.IsFemale, 'она', 'он' )] переметнётся."
 flavor_ver.1000.a: "Какой красивый — и дьявольский! — замысел…"
 ver_padua_incident_rules: "Если #TOOLTIP:LOCATION,padova,X #L Падуя#!#! будет оккупирована до #W 1339.1.1#!, [target_country.GetName] смен[target_country.Custom('end_ityat')] сторону в конфликте «[target_war.GetName]» и обрет[target_country.Custom('end_youtut')] независимость"
 flavor_ver.1001.title: "Возможное предательство"
 flavor_ver.1001.desc: "Наши шпионы в [target_location.Custom('LR_PREP')|l] [target_location.GetName] сообщают, что, возможно, прямо у нас под носом проходят вражеские переговоры: пока идёт [target_war.GetName], кто-то из [target_country.Custom('longname_ru_GEN')] ведёт переписку с нашими врагами. Эти новости заставили нас засомневаться в верности #L [target_country.GetAdjective|l]ой#! стороны — что, если впоследствии нас предадут? Пока что мы поручили сыщикам найти виновника, но неизвестно, сумеют ли они справиться с этим поручением вовремя."
 flavor_ver.1001.desc_pad: "Наши шпионы из столицы сообщают, что, возможно, прямо у нас под носом проходят вражеские переговоры: пока идёт [target_war.GetName], кто-то ведёт переписку с нашими врагами. Среди нас затесался предатель, и [target_location.GetName] в опасности! Пока что мы поручили сыщикам найти виновника, но неизвестно, сумеют ли они справиться с этим поручением вовремя."
 flavor_ver.1001.a: "Эту погань нужно искоренить!"
 flavor_ver.1002.title: "Заговорщик найден!"
 flavor_ver.1002.entry: "$flavor_ver.1002.title$"
 flavor_ver.1002.desc: "[target_character2.GetName] лично наблюдает за тем, как [target_character.GetName] предстаёт перед судом по обвинению в заговоре с врагами династии [target_dynasty.GetName]. Несколько месяцев подряд [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'вела', 'вёл' )] переписку с нашими противниками в надежде, что [target_war.GetName] закончится на их условиях. Причиной всего этого стала глубокая ненависть: [target_character.GetShortName] так и не [Select_CString(target_character.IsFemale, 'смогла', 'смог' )] смириться с потерей власти десять лет назад."
 flavor_ver.1002.a: "Смерть!"
 flavor_ver.1003.title: "Врата открыты!"
 flavor_ver.1003.desc: "В последние часы осады наш союзник в [target_location.Custom('LR_PREP')|l] [target_location.GetName] — [target_character.GetName] — [Select_CString(target_character.IsFemale, 'приказала', 'приказал' )] гарнизону отбить отвлекающую атаку у одних ворот, тем самым оставив открытыми другие. Весь [target_location.GetRank.GetName|l] оказался беззащитен перед нашими войсками. Последствия не заставили себя ждать: поселение взято, а [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'провозглашена', 'провозглашён' )] правителем #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, чему весьма обрадовались местные [target_estate.GetName|l]. Теперь [target_war.GetName] примет совсем иной оборот: династия [target_dynasty.GetName] только что лишилась одного из самых ценных своих владений."
 flavor_ver.1003.a: "Побольше бы таких побед!"
 flavor_ver.1004.title: "Предсмертные муки союзника"
 flavor_ver.1004.desc: "Страшные новости! Династия [target_dynasty.GetName] узнала, что [target_character.GetName] — [Select_CString(target_character.IsFemale, 'бывшая правительница', 'бывший правитель' )] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! и наш союзник в этой державе — тайно содействует нам. #L [target_country2.GetAdjective]ие#! владыки не раздумывали дважды: [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'была взята', 'был взят' )] в плен и сразу же [Select_CString(target_character.IsFemale, 'приговорена', 'приговорён' )] к смерти; сопутствующий приказ [Select_CString(target_character2.IsFemale, 'отдала', 'отдал' )] [target_character2.GetName]."
 flavor_ver.1004.a: "Мы потеряли сильного союзника."
 flavor_ver.1005.title: "Падение Падуи"
 flavor_ver.1005.desc: "Оказалось, что заговорщик в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#!, — это не кто иной, как [target_character.GetName]! [Select_CString(target_character.IsFemale, 'Эта подлая женщина, которую', 'Этот подлец, которого' )] [target_character2.GetName] около десяти лет назад [Select_CString(target_character2.IsFemale, 'лишила', 'лишил' )] должности викария, всё это время [Select_CString(target_character.IsFemale, 'вынашивала', 'вынашивал' )] замысел отмщения династии [target_dynasty.GetName]. И сегодня этот замысел наконец удалось воплотить в жизнь: [target_location.GetRank.GetName|l] сдан нашим врагам, а [target_country.GetNameWithNoTooltip] сегодня у [Select_CString(target_character.IsFemale, 'неё', 'него' )] в руках."
 flavor_ver.1005.a: "Мы победим, и неважно, в чьих руках [target_country.GetNameWithNoTooltip]."
 ver_will_join_target_war: "[THIS.GetCountry.GetName] присоедин[THIS.GetCountry.Custom('end_ityat')]ся к войне «[target_war.GetName]» на стороне атакующих"
