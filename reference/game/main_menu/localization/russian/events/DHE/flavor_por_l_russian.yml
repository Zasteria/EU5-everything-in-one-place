l_russian:
 flavor_por.1.title: "[columbus_scope.GetNameWithNoTooltip]"
 flavor_por.1.entry: "Христофор Колумб в Португалии"
 flavor_por.1.desc: "Державы #TOOLTIP:SUB_CONTINENT,western_europe,X #L Западной Европы#!#! одержимы идеей найти морской путь в #TOOLTIP:SUB_CONTINENT,india,X #L Индию#!#!. К счастью, недавно к нашему двору прибыл #TOOLTIP:CULTURE,$ligurian_tt$,X #L лигурийский#!#! мореплаватель, у которого есть интересный план. Он утверждает, что вовсе необязательно огибать #TOOLTIP:SUB_CONTINENT,southern_africa,X #L Южную Африку#!#!, поскольку существует более короткий путь через запад. Несмотря на сомнения некоторых советников, эта идея звучит весьма многообещающе."
 flavor_por.1.a: "Отклоним предложение."
 flavor_por.1.b: "Наймём Колумба."
 flavor_por.1.historical_info: "В 1492 году Христофор Колумб, получив одобрение кастильской короны, отправился в своё знаменитое плавание через Атлантику с целью найти западный путь в Азию. За семь лет до этого, в 1485 году, он обращался с аналогичным предложением к португальскому королю Жуану II, но советники убедили того отказать. В 1488 году Колумб ещё раз попытался убедить монарха, но вновь получил отказ: как раз в то время португальский мореплаватель Бартоломеу Диаш успешно обогнул мыс Доброй Надежды, так что восточный путь показался королю более предпочтительным."
 flavor_por.2.title: "Атлантическая работорговля"
 flavor_por.2.entry: "$flavor_por.2.title$"
 flavor_por.2.desc: "Создание плантаций оказалось для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! крайне прибыльным предприятием. При этом с ростом спроса на новые товары растёт и необходимость в дешёвой рабочей силе. Поскольку у нас есть торговые связи с африканскими державами, мы могли бы закупать в #TOOLTIP:SUB_CONTINENT,west_africa,X #L Западной Африке#!#!#TOOLTIP:POPTYPE,slaves,X #L рабов#!#! для наших плантаций."
 flavor_por.2.a: "Поддержим работорговлю в Западной Африке."
 african_slave_trade_encouraged: "Поддержка работорговли"
 flavor_por.2.b: "Корона не должна вмешиваться."
 flavor_por.2.historical_info: "При освоении земель и ресурсов Нового Света массово использовался рабский труд. После того, как численность коренного населения значительно сократилась из-за тяжёлой работы и инфекций, занесённых из Европы, колонизаторы столкнулись с нехваткой рабочей силы. Долговое рабство несколько смягчило эту проблему, но не решило её полностью. Это привело к началу атлантической работорговли, в ходе которой «живой товар» закупался на побережье Западной Африки и доставлялся в Бразилию. Таким образом через океан было переправлено более 3 миллионов африканцев, большинство из которых стали рабами на обширных плантациях сахарного тростника."
 flavor_por.3.title: "Миссионеры на Островах пряностей"
 flavor_por.3.entry: "$flavor_por.3.title$"
 flavor_por.3.desc: "Открытие Островов пряностей сулит огромную экономическую выгоду, но не стоит забывать и о нашем священном долге. Мы должны проповедовать местным жителям истинную #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ую#! веру, чтобы привести их заблудшие души к спасению."
 flavor_por.3.a: "Попытаемся обратить местное население в [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]ую веру."
 flavor_por.3.a.entry: "Распространим католическую веру."
 flavor_por.3.historical_info: "Молуккские острова, в то время известные как #italic Острова пряностей#!, в XVI веке играли важную роль в португальской торговле в Юго-Восточной Азии. После изгнания из Тернате португальцы основали новую торговую колонию на острове Амбон, открытом ими в 1513 году. На нее регулярно нападали местные мусульмане, однако миссионерам удалось обратить значительную часть островитян в христианскую веру. К концу XVI века на Молуккских островах было более 50 000 христиан, большинство из которых проживало на Амбоне."
 flavor_por.5.title: "Торре-ди-Белен"
 flavor_por.5.entry: "$flavor_por.5.title$"
 flavor_por.5.desc: "В последние десятилетия порт #TOOLTIP:LOCATION,lisbon,X #L Лиссабона#!#! приобретает всё большее торговое значение, и в связи с этим наших укреплений в устье реки Тежу явно становится недостаточно. Недавно к нам обратился один #L [ROOT.GetCountry.GetAdjective|l]ий#! архитектор, который предлагает взять на себя задачу по строительству нового прибрежного форта для защиты города от нападений с моря."
 flavor_por.5.a: "Мы должны её построить!"
 flavor_por.5.b: "У нас есть более важные дела."
 flavor_por.5.historical_info: "Башня Торре-ди-Белен была возведена в начале XVI века по приказу Мануэля I для защиты устья реки Тежу. Архитектурный стиль, в котором она построена, называется мануэлину и представляет собой португальскую разновидность поздней готики. В 1571 году башня была укреплена, но в 1580 году армия испанского герцога Альбы разрушила её всего за несколько часов осады. Позднее её подземелья служили тюрьмой."
 flavor_por.6.title: "Монастырь Жеронимуш"
 flavor_por.6.entry: "$flavor_por.6.title$"
 flavor_por.6.desc: "[Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'Наша', 'Наш')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] считает, что члены [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'её', 'его')] династии нуждаются в достойном месте захоронения. Архитекторы уже подготовили план строительства грандиозного монастыря и ждут нашего приказа, чтобы начать работу."
 flavor_por.6.a: "Он станет зримым воплощением нашей славы."
 flavor_por.6.b: "Это слишком дорого."
 flavor_por.6.historical_info: "Строительство монастыря Жеронимуш началось в 1501 году. Первоначально его финансировал король Мануэль I на средства, полученные от #italic Vintena da Pimenta#! — особого налога на африканские и дальневосточные товары. Впоследствии этот монастырь стал местом упокоения его самого, а также последующих португальских монархов Ависской и Брагансской династии. В 1580 году, когда после династического кризиса, вызванного смертью Себаштьяна I, Португалия заключила унию с Испанией, строительство монастыря было остановлено. Оно возобновилось только в 1640 году, когда Португалия вновь обрела независимость. В 1669 году монастырь получил золочёный потолок, а в конце XVIII века были закончены большие фрески. В XIX веке на территории монастыря были перезахоронены останки Васко да Гамы и Луиша де Камоэнса."
 flavor_por.7.title: "Путешественники прибыли в Индию"
 flavor_por.7.entry: "$flavor_por.7.title$"
 flavor_por.7.desc: "Наши исследователи добрались до Индии и начали мелкую торговлю с её жителями. Мы должны как можно скорее воспользоваться этим, чтобы получить преференции в этом регионе. Окрестности Гоа могут стать идеальным форпостом для нашей торговой экспансии."
 flavor_por.7.a: "Великолепно!"
 flavor_por.7.historical_info: "Высадившись 20 мая 1498 года в окрестностях города Кожикоде (Каликут), Васко да Гама стал первым португальцем, побывавшим в Индии. Несмотря на протесты арабских купцов, он сумел получить у местного правителя-заморина разрешение на торговлю, однако в дальнейшем ему не хватило золота для оплаты пошлин. Впрочем, в целом эта экспедиция оказалась очень прибыльной: стоимость грузов, привезённых из неё в Португалию, в шестьдесят раз превышала расходы на её организацию."
 flavor_por.8.title: "Генерал-губернаторство Бразилия"
 flavor_por.8.entry: "$flavor_por.8.title$"
 flavor_por.8.desc: "Мы создали в своих колониях капитанства, но так и не смогли организовать эффективное управление ими. Местные губернаторы и аристократы слишком заняты борьбой за власть и не могут дать организованный отпор пиратам и туземцам, нападающим на наши владения. Чтобы решить эту проблему, мы можем создать генерал-губернаторство — новое ведомство, которое будет контролировать работу капитанств и управлять колониями в #TOOLTIP:REGION,brazil_region,X #L Брализии#!#! от имени [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'нашей правительницы', 'нашего правителя')]."
 flavor_por.8.a: "Отличная идея!"
 flavor_por.8.b: "Нам это ни к чему!"
 flavor_por.8.historical_info: "Генерал-губернаторство Бразилия было основано в 1549 году португальским королём Жуаном III. По замыслу монарха, этот орган власти должен был объединить капитанства и обеспечить централизованное управление португальскими колониями в Бразилии."
 flavor_por.9.title: "Торговый конфликт в Индийском океане"
 flavor_por.9.entry: "$flavor_por.9.title$"
 flavor_por.9.desc: "С прибытием португальских кораблей в Индийский океан и Аравийское море у нас наконец-то появилась возможность помешать #TOOLTIP:CULTUREGROUP,arabian_group,X #L арабскому#!#! судоходству в этих регионах. В частности, мы можем значительно сократить поставки специй и шелка в #TOOLTIP:LOCATION,alexandria,X #L Александрию#!#! и тем самым нанести значительный ущерб нашим торговым конкурентам на Ближнем Востоке и в #TOOLTIP:REGION,italy_region,X #L Италии#!#!."
 flavor_por.9.a: "Добиться контроля над торговлей пряностями"
 portuguese_privateers: "Португальские каперы"
 flavor_por.9.b: "Улучшить отношения с властями региона"
 careful_trade_expansion: "Осторожная торговая экспансия"
 flavor_por.10.title: "Губернатор Мартин Афонсу де Соуза"
 flavor_por.10.entry: "$flavor_por.10.title$"
 flavor_por.10.desc: "Наша колония в #TOOLTIP:REGION,brazil_region,X #L Брализии#!#! постоянно подвергается нападениям пиратов, которые грабят её прибрежные территории. Мы должны немедленно дать им отпор, пока ситуация не вышла из-под контроля. Надо отправить в этот регион опытного и решительного губернатора."
 flavor_por.10.a: "Назначим де Соузу."
 flavor_por.10.historical_info: "Первые португальские колонисты получили в Бразилии участки земли, вытянутые от побережья вглубь континента. Поскольку многие из них были капитанами морских кораблей, такие наделы назывались капитанствами. Владельцы капитанств принимали у себя новых поселенцев, давая им защиту и правосудие, но, будучи независимыми друг от друга, были не в силах дать отпор иноземным пиратам. По приказу португальского короля Жуана III туда направился Афонсу де Соуза, который успешно справился с пиратами и ускорил освоение внутренних земель Бразилии. В 1534 году де Соуза получил в награду за труды капитанство Сан-Висенти."
 flavor_por.11.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] планирует поход на Северную Африку"
 flavor_por.11.entry: "$flavor_por.11.title$"
 flavor_por.11.desc: "За морем находятся обширные земли, населённые иноверцами. Уничтожив этих варваров во имя Господа, мы сможем значительно расширить свои владения и обеспечить себе господство в #TOOLTIP:REGION,north_atlantic_ocean_region,X #L Северном Атлантическом океане#!#!."
 flavor_por.11.a: "Устроим крестовый поход против язычников Африки."
 prepares_crusade: "Подготовка к крестовому походу"
 flavor_por.11.b: "Нам следует заняться другими делами."
 flavor_por.11.historical_info: "В 1578 году король Себаштьян снарядил экспедицию для покорения Марокко, где Португалия уже владела Танжером и Сеутой. Вскоре после высадки его армия вступила в битву при Эль-Ксар-эль-Кебире, где была наголову разбита марокканскими берберами под предводительством Мулая Исмаила. В этой битве погиб сам король, а также большинство сопровождавших его португальских аристократов. Вызванный этим династический кризис привел к переходу Португалии под испанский контроль и стал началом упадка этой державы."
 flavor_por.12.title: "Метуэнский договор"
 flavor_por.12.entry: "$flavor_por.12.title$"
 flavor_por.12.desc: "К нам прибыл англичанин, находящийся на службе при #L [target_country.GetAdjective|l]ом#! дворе. Он предлагает заключить торговое соглашение, которое пойдёт на пользу обеим нашим державам. Так, мы сможем более свободно продавать им свои товары и импортировать те вещи, которые не способны производить самостоятельно."
 flavor_por.12.a: "Принять договор."
 accepted_meuthen_agreement: "Принят Метуэнский договор"
 flavor_por.12.b: "Не примем договор."
 denounced_meuthen_agreement: "Расторгнут Метуэнский договор"
 flavor_por.12.historical_info: "Джон Метуэн (1650–1706) — опытный дипломат, подписавший в 1703 году мирный договор между Англией и Португалией. Условия этого договора предполагали поставки в Португалию английской пряжи и сукна в обмен на свободный ввоз в Англию портвейна. В результате Португалия, по сути, попала под экономическое влияние Англии. Формально договор действовал до 1836 года, однако фактически португальский король Жозе I перестал исполнять его условия уже в 1750 году. Сам Джон Метуэн умер в 1706 году, спустя всего три года после своего величайшего триумфа."
 flavor_por.13.title: "Граф де Эрисейра"
 flavor_por.13.entry: "$flavor_por.13.title$"
 flavor_por.13.desc: "[target_character.GetName], граф де Эрисейра и видный представитель #L [ROOT.GetCountry.GetAdjective|l]ой#! знати, даёт нашему правительству советы по ведению торговли. Он весьма талантливый человек и убеждённый сторонник меркантилизма. Хотя экономические вопросы являются его главным профессиональным интересом, при необходимости мы можем заручиться его помощью и в других областях государственного управления."
 flavor_por.13.a: "Последуем его совету!"
 flavor_por.13.b: "Выгнать его прочь!"
 flavor_por.13.historical_info: "Дон Луиш де Менезиш, граф де Эрисейра, был убежденным последователем меркантилизма и помогал реформировать португальское государство с целью большего контроля над торговлей."
 flavor_por.17.title: "Период неопределённости"
 flavor_por.17.entry: "$flavor_por.17.title$"
 flavor_por.17.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] по-прежнему не имеет наследника мужского пола, что ставит [ROOT.GetCountry.Custom('rank_ru_ACC')|l] под угрозу иностранного вмешательства. Если преемницей станет [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'её', 'его')] дочь [heir.GetName], она с большой вероятностью будет марионеткой своего мужа, а он будет править #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! вместо неё.\n\nВстревоженные такой перспективой, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] предлагают изменить закон о престолонаследии, чтобы лишить её права на корону. По их мнению, если [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] так и не сможет обзавестись сыном, то наследником должен стать [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'её', 'его')] незаконнорождённый сводный брат по имени [john_avis.GetName]."
 flavor_por.17.a: "Отклонить их предложение."
 flavor_por.17.a.custom: "#L [GetCountry('POR').GetAdjective]ие#! #TOOLTIP:POPTYPE,burghers,X #L горожане#!#! и #TOOLTIP:POPTYPE,nobles,X #L аристократы#!#! получают [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 flavor_por.17.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] попытаются возвести на престол Джона Эвиса"
 flavor_por.17.tt2: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'заслужила', 'заслужил')] признание своего окружения за то, что [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'отвергла', 'отверг')] предложение, которое выдвинули [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]"
 avis_supporters: "Сторонники Жуана Ависа"
 flavor_por.17.b: "Мы согласны."
 flavor_por.17.tt3: "[heir.GetName] лишится права на престолонаследие"
 flavor_por.19.title: "[joao_braganca.GetNameWithNoTooltip]"
 flavor_por.19.entry: "Жуан де Браганса"
 flavor_por.19.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] стремительно теряют влияние, и теперь у них не осталось ни мест в совете, ни поддержки со стороны двора. При этом наши шпионы сообщают, что выскочка по имени [joao_braganca.GetName] пытается найти сторонников, свергнуть [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'нашу правительницу', 'нашего правителя')] и восстановить все привилегии, которые утратили [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
 flavor_por.19.desc_subject: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] стремительно теряют своё влияние, у них не осталось ни мест в совете, ни поддержки со стороны двора. Однако наши шпионы сообщают, что храбрый маркиз [joao_braganca.GetName] планирует свергнуть #L [overlord.GetCountry.GetAdjective|l]ую#! власть и провозгласить независимость #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. В этом деле его поддерживает группа аристократов, которые известны как #italic «Сорок заговорщиков»#!. Вместе они уже разработали план и лишь ждут подходящего момента, чтобы нанести удар."
 flavor_por.19.a: "Отречься от престола и уступить ему власть."
 flavor_por.19.tt1: "Появится [Concept('character', 'персонаж')|e] [joao_braganca.GetNameWithNoTooltip], который займёт престол, и его поддержат [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]"
 flavor_por.19.b: "Пусть [joao_braganca.GetNameWithNoTooltip] возглавит сражение."
 flavor_por.19.b.entry: "Пусть борьбу возглавит $name_john.portuguese_language$."
 flavor_por.19.tt2: "[joao_braganca.GetNameWithNoTooltip] заручится поддержкой аристократов в борьбе за освобождение #ONCLICK:COUNTRY,[target_root_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_root_country.Custom('CL_tt')],X [target_root_country.Custom('CL_GEN')|L]#!#! от #L [GetCountry('SPA').GetAdjective|l]ого#! влияния"
 flavor_por.19.c: "Никаких уступок."
 STATIC_MODIFIER_NAME_braganca_rebellion: "Мятеж Брагансы"
 flavor_por.19.d: "Нам не нужны проблемы."
 flavor_por.19.tt3: "Добившись уступок со стороны власти, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] прекращают мятеж"
 flavor_por.19.e: "Казнить смутьяна."
 braganca_supporters: "Сторонники Жуана де Брагансы"
 flavor_por.19.tt4: "После смерти Жуана де Брагансы мятеж угас сам собой."
 flavor_por.21.title: "«Лузиады»"
 flavor_por.21.entry: "$flavor_por.21.title$"
 flavor_por.21.desc: "Луиш де Камоэнс завершил работу над своей эпической поэмой «Лузиады», которая в полумифическом ключе описывает великие путешествия наших соотечественников в Индию. Это настоящий шедевр #L [ROOT.GetCountry.GetCulture.GetName|l]ой#! литературы, который непременно станет известным во всём мире."
 flavor_por.21.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_por.21.a.entry: "$common_string_brilliant$"
 flavor_por.21.historical_info: "$the_lusiads_desc$ Опубликованные в 1572 году, «Лузиады» считаются главным национальным эпосом Португалии."
 flavor_por.22.title: "Васко да Гама предлагает свои услуги"
 flavor_por.22.entry: "$flavor_por.22.title$"
 flavor_por.22.desc: "Будучи родом из семьи мелких #TOOLTIP:CULTURE,$portuguese_tt$,X #L португальских#!#! аристократов, [target_character.GetName] начал свою карьеру моряка в рядах военного ордена. Теперь он предлагает нам свои услуги и надеется стать первым, кто найдёт морской путь в Индию. Он обладает знаниями о математике и навигации, а также имеет опыт морских сражений, поэтому он бы вполне мог возглавить новую экспедицию."
 flavor_por.22.a: "Он хорошо послужит нашей стране"
 flavor_por.22.historical_info: "До своего знаменитого путешествия в индийский город Кожикоде (Каликут) мореплаватель Васко да Гама служил в ордене Сантьяго, который пользовался благосклонностью короля Жуана II — в прошлом магистра этого ордена. Отправившись в путь в 1497 году с 4 кораблями, Васко да Гама достиг Индии в мае 1498 года и вернулся в Португалию в 1499 году. Он многократно окупил все расходы, продав привезённые пряности, и, что гораздо важнее, открыл новый морской путь в Индию."
 flavor_por.23.title: "Монастырь Баталья"
 flavor_por.23.desc: "[Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'Наша', 'Наш')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'поклялась', 'поклялся')] построить монастырь в честь Девы Марии, если мы одержим победу в войне против #ONCLICK:COUNTRY,[loser.Custom('CL_tt')] #TOOLTIP:COUNTRY,[loser.Custom('CL_tt')],X [loser.Custom('CL_GEN')|L]#!#!. Враг повержен, и пришло время исполнить клятву."
 flavor_por.23.a: "Потрясающая идея!"
 flavor_por.23.historical_info: "После победы в сражении при Алжубарроте в 1385 году, когда португальская армия разгромила кастильские войска, король Португалии Жуан I выполнил своё обещание и поручил построить монастырь в честь Девы Марии. $batalha_monastery_desc$"
 flavor_por.24.title: "[ROOT.GetCountry.GetGovernment.GetAdjective]ий пантенон"
 flavor_por.24.entry: "$flavor_por.24.title$"
 flavor_por.24.desc: "В коридорах [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого дворца слышен скорбный плач: [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'наша правительница скончалась', 'наш правитель скончался')], и теперь мы должны организовать [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'ей', 'ему')] достойные похороны. Ещё при жизни [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'она упоминала', 'он упоминал')], что хочет быть [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'погребённой', 'погребённым')] в монастыре Алкобаса, однако никто не знает, какой бы [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'она хотела', 'он хотел')] видеть саму церемонию. Скромные похороны могут повредить престижу [ROOT.GetCountry.Custom('rank_ru_GEN')], а слишком роскошные грозят заметно истощить нашу казну."
 flavor_por.24.a: "[old_ruler.GetShortNameWithNoTooltip] заслуживает торжественных похорон."
 flavor_por.24.a.entry: "Этот правитель заслуживает торжественных похорон."
 flavor_por.24.b: "Нам ни к чему хвастаться."
 flavor_por.24.historical_info: "Монастырь Алкобаса, основанный в 1153 году королем Афонсу I, много веков оставался местом последнего упокоения португальских монархов, что позволило ему стать одним из самых богатых и влиятельных в стране. В Средневековье он, наряду с монастырем Санта-Крус возле Коимбры, играл ключевую роль в религиозной жизни королевства, а в наши дни его считают одним из самых красивых в Португалии."
 flavor_por.25.title: "Новый оплот ордена Христа"
 flavor_por.25.entry: "$flavor_por.25.title$"
 flavor_por.25.desc: "В ходе Реконкисты нам удалось прогнать #TOOLTIP:RELIGIONGROUP,muslim,X #L исламских#!#! захватчиков со своих земель, и теперь орден Христа в #TOOLTIP:LOCATION,tavira,X #L Тавире#!#! несколько утратил своё значение. Кроме того, репутация ордена в этом регионе оставляет желать лучшего.\n\nВвиду этого некоторые советники предлагают переместить его в прежнюю резиденцию тамплиеров, а именно — в крепость на севере #TOOLTIP:PROVINCE_DEFINITION,estremadura_province,X #L Эштремадуры#!#!."
 flavor_por.25.a: "Пусть они займут крепость тамплиеров в Томаре."
 flavor_por.25.b: "Пусть они остаются на прежнем месте."
 flavor_por.25.historical_info: "В ответ на упразднение ордена тамплиеров в 1312 году король Диниш I основал новый орден Христа, также известный как #italic Christi Militia#!. Он был учреждён в 1317 году, а в 1319 году папа Иоанн XXII официально одобрил его своей буллой #italic AD EA EX QVIBVS#!. После переговоров 1323 года папа издал ещё одну буллу, которая позволила Динишу передать ордену Христа собственность тамплиеров. Хотя рыцари нового ордена соблюдали обеты бедности, безбрачия и послушания, их статус как преемников тамплиеров является предметом исторических дебатов. Первым Великим магистром ордена стал дон Жиль Мартинш из Ависской династии.\n\nПервоначально резиденцией ордена был замок Кастро Марим в Алгарве, но в 1357 году его рыцари переселились в бывший тамплиерский замок Томар близ Сантарема. Это событие стало важной вехой в средневековой истории Португалии."
 flavor_por.26.title: "Вино из Мадейры"
 flavor_por.26.entry: "$flavor_por.26.title$"
 flavor_por.26.desc: "С момента открытия #TOOLTIP:PROVINCE_DEFINITION,madeira_province,X #L Мадейры#!#! у нас появилась возможность выращивать сахарный тростник, поскольку земли архипелага обладают идеальным климатом для создания плантаций. Однако с развитием сахарной промышленности в #TOOLTIP:REGION,brazil_region,X #L Бразилии#!#! производство мадейрского #TOOLTIP:GOODS,sugar,X #L сахара#!#! стало менее выгодным. В связи с этим многие предлагают развивать другие отрасли, и в частности — #TOOLTIP:GOODS,wine,X #L виноделие#!#!."
 flavor_por.26.a: "Мы будем производить вино."
 flavor_por.26.b: "Сахар для нас важнее."
 flavor_por.26.historical_info: "Сахарный тростник долгое время был основой экономики Мадейры, обеспечивая процветание Фуншала и привлекая авантюристов и купцов из Европы. В XV веке Фуншал стал ключевым портом в европейской торговле. При выращивании тростника широко применялся труд рабов, в том числе гуанчей, берберов и выходцев из Западной Африки. Так, в 1617 году берберские пираты угнали в рабство 1200 жителей острова Порту-Санту. Впрочем, самих рабовладельцев там было немного. Местный опыт использования подневольного труда на плантациях впоследствии переняли заморские колонии. Мадейра оставалась одним из крупнейших поставщиков сахара до XVI века, но потом перестала выдерживать конкуренцию с Бразилией и Сан-Томе. Дело дошло до импорта сахара из других португальских колоний. Некогда богатейшая индустрия острова пришла в упадок, уступив место другим производствам."
 flavor_por.27.title: "Христиане апостола Фомы"
 flavor_por.27.entry: "$flavor_por.27.title$"
 flavor_por.27.desc: "Впервые прибыв на берега #TOOLTIP:SUB_CONTINENT,india,X #L Индии#!#!, мы вскоре встретили местных последователей нашего Господа и Спасителя Иисуса Христа. Они подвергались преследованиям со стороны более многочисленных #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманских#!#! и #TOOLTIP:RELIGION,$hindu_tt$,X #L индуистских#!#! общин, что дало нам повод объединиться с ними против общей угрозы.\n\nОднако, проведя в их компании чуть больше времени, мы заметили, что их богослужебные обряды значительно отличаются от наших и зачастую граничат с ересью. Многие в нашей державе считают, что мы должны наставить их на правильный путь, но есть и те, кто отстаивает права местных христиан на собственные обряды, какими бы странными они нам ни казались."
 flavor_por.27.a: "Они должны примкнуть к нашей пастве."
 flavor_por.27.b: "Главное, что они — христиане..."
 flavor_por.27.historical_info: "В 1498 году экспедиция Васко да Гамы впервые встретила христиан апостола Фомы, которые из-за своего уязвимого положения в обществе и притеснения со стороны местных властей охотно пошли на союз с португальцами. Те же, стремясь контролировать торговлю пряностями и распространять католическое учение, учредили так называемый «королевской патронаж» — организацию, получившую духовную власть на покорённых территориях. Первоначально она обращалась с христианами апостола Фомы довольно мягко, но в 1552 году усилила давление, а к 1575 году в результате ряда стратегических ходов изолировала общину от ее иерархов. На Диамперском соборе 1599 года архиепископ Гоа Алейшу де Менезеш принудил к согласию её последнего митрополита.\n\nПроведенный Менезешем собор утвердил литургические реформы, предал анафеме определённые местные обычаи и официально привёл христиан апостола Фомы в лоно Католической церкви. Однако такие действия португальцев, как сожжение «еретических» сирийских книг и ликвидация кастовой системы, вызвали массовое недовольство, которое впоследствии обернулась сложным периодом борьбы религий и культур."
 flavor_por.28.title: "Учреждение португальской инквизиции"
 flavor_por.28.entry: "$flavor_por.28.title$"
 flavor_por.28.desc: "Когда [Select_CString(target_character.IsFemale,'наша правительница', 'наш правитель')] [target_character.GetName] и [ROOT.GetCountry.GetGovernment.GetConsort.GetName] заключили помолвку, одним из условий их брачного союза стало создание в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! инквизиции, которая будет следить за тем, чтобы новообращённые христиане нашей державы втайне не практиковали свою старую веру.\n\nУчреждение собственной инквизиции обеспечит лояльность тех подданных, которые ещё недавно исповедовали другую религию и могут представлять угрозу безопасности страны. Однако это решение также может породить недовольство среди тех самых людей, которые опасались, что их вера станет поводом для гонений."
 flavor_por.28.a: "Мы учредим португальскую инквизицию."
 flavor_por.28.b: "Это не самая лучшая идея."
 flavor_por.28.historical_info: "Португальскую инквизицию (#italic Inquisição Portuguesa#!), полностью именуемую Генеральным советом Святой палаты инквизиции в Португалии, создал король Жуан III по просьбе своего отца Мануэла I, однако одобрение папы Павла III она получила лишь после смерти последнего в 1536 году. Впоследствии она объединилась с испанской и римской инквизициями, а в 1821 году была ликвидирована."
 flavor_por.29.title: "Epistola de Victoria Contra Infideles"
 flavor_por.29.entry: "$flavor_por.29.title$"
 flavor_por.29.desc: "[Select_CString(target_character.IsFemale,'Наша правительница', 'Наш правитель')] [target_character.GetName] требует, чтобы все наши подданные, исповедующие #TOOLTIP:RELIGION,$judaism_tt$,X #L иудаизм#!#!, приняли #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#!, иначе им грозит изгнание из страны. [Select_CString(target_character.IsFemale,'Её', 'Его')] указ, получивший название #italic «Epistola de Victoria Contra Infideles»#!, направлен на обращение всего населения в единую веру и придание #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! статуса полноценной #TOOLTIP:RELIGIONGROUP,christian,X #L христианской#!#! державы."
 flavor_por.29.a: "Они должны креститься!"
 flavor_por.29.b: "Оставим их в покое."
 flavor_por.29.tt1: "Большинство сефардов нашей страны обратятся в католичество, а те, кто откажется, будут изгнаны из страны."
 flavor_por.29.tt2: "Сефарды в нашей стране будут рады."
 flavor_por.29.historical_info: "5 декабря 1496 года португальский король Мануэл I под давлением королевской четы Испании повелел изгнать или обратить в христианство всех евреев своей своей страны — таким было условие его брака с принцессой Изабеллой. Первоначальный указ предписывал изгнание, но в 1497 году король потребовал насильственно крестить португальских евреев, а тех, кто сопротивляется, высылать в Сан-Томе и Принсипи. Но даже согласие сменить веру не облегчало жизнь новых христиан: их ждал период религиозных гонений с такими событиями, как Лиссабонский погром 1506 года и учреждение инквизиции в 1536 году."
 flavor_por.30.title: "Лиссабонский погром"
 flavor_por.30.entry: "$flavor_por.30.title$"
 flavor_por.30.desc: "В #TOOLTIP:LOCATION,lisbon,X #L Лиссабоне#!#! вспыхнули беспорядки, и тысячи разъярённых горожан убивают так называемых #italic «новых христиан»#! без суда и следствия.\n\nВсё началось с того, что во время очередной церковной службы от распятия якобы начал исходить свет. Один из #italic новообращённых#! высмеял заявления о чуде, из-за чего прихожане пришли в ярость: они забили мужчину до смерти, а затем принялись искать его сородичей.\n\nТеперь город охвачен пламенем, а его улицы залиты кровью как #italic новых#!, так и #italic старых христиан#!."
 flavor_por.30.a: "Мы ничего не можем поделать."
 flavor_por.30.b: "Остановить это безумие."
 flavor_por.30.tt1: "#Y Огромное#! количество новых и старых христиан #R погибнет#!."
 flavor_por.30.tt2: "#Y Большое#! количество новых и старых христиан #R погибнет#!."
 flavor_por.30.tt3: "#Y Значительное#! количество новых и старых христиан #R погибнет#!."
 flavor_por.30.tt4: "#Y Небольшое#! количество новых и старых христиан #R погибнет#!."
 flavor_por.30.historical_info: "В воскресение 19 апреля 1506 года прихожане лиссабонских церквей стали нападать на людей, подозреваемых в скрытом иудаизме. Вскоре антисемитский бунт, впоследствии названный Лиссабонским погромом, охватил весь город. Эта вспышка уличного насилия закончилась гибелью не только множества #italic новых христиан#!, как называли крещёных евреев (согласно источникам, от 1000 до 4000 человек), но и значительного количества #italic старых#!."
 flavor_por.31.title: "Изгнание мусульман из Португалии"
 flavor_por.31.entry: "$flavor_por.31.title$"
 flavor_por.31.desc: "Со взятием #TOOLTIP:PROVINCE_DEFINITION,algarve_province,X #L Алгарве#!#! в 1249 году португальская Реконкиста подошла к концу, однако на наших землях по-прежнему живут тысячи #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#!, чья лояльность [ROOT.GetCountry.Custom('rank_ru_DAT')|l] вызывает большие сомнения. [target_character.GetName] считает, что эти иноверцы угрожают безопасности не только нашей страны, но и всей #TOOLTIP:REGION,iberia_region,X #L Иберии#!#!. Наши советники предлагают разные варианты решения проблемы, но все они так или иначе чреваты массовыми беспорядками."
 flavor_por.31.a: "Прогоним их прочь."
 flavor_por.31.b: "Заставим их сменить веру!"
 portuguese_muslim_uprising: "Андалусское восстание"
 flavor_por.31.c: "Они — наши верные подданные."
 flavor_por.31.tt1: "Большинство мусульман нашей страны обратятся в католичество, а те, кто откажется, будут изгнаны из страны. С большой вероятностью они поднимут бунт. Соседние мусульманские страны получат повод для войны против нас."
 flavor_por.31.tt2: "Попытка обращения #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусских#!#! мусульман в нашу веру может привести к восстанию. Чтобы избежать этого риска, мы просто изгоним их из Португалии."
 flavor_por.31.tt3: "Проживающие в нашей державе #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусцы#!#! будут довольны нашим решением оставить их в покое."
 flavor_por.31.historical_info: "Изгнание мусульман из Португалии, менее известное на фоне насильственного крещения евреев, произошло в декабре 1496 года. Хотя Португалия отличалась от других регионов Европы значительно большей терпимостью к исламу, Мануэль I издал соответствующий указ без явного повода. Изначально португальское правительство рассматривало насильственное крещение или казнь мусульман, но, опасаясь мести исламских стран Северной Африки, в итоге остановились на депортации. В числе возможных причин указа называют и стремление короля к религиозному единству, связанное с католическими испанскими монархами Изабеллой и Фердинандом, и влияние исповедника-доминиканца Хорхе Вогадо, и даже планы по завоеванию Марокко. Большинство мусульман бежало в Северную Африку."
 flavor_por.32.title: "Джихад против [GetCountry('POR').Custom('CL_GEN')]"
 flavor_por.32.entry: "Португальским мусульманам нужна наша помощь"
 flavor_por.32.desc: "[Select_CString(target_character.IsFemale,'Гнусная правительница', 'Гнусный правитель')] #ONCLICK:COUNTRY,[GetCountry('POR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('POR').Custom('CL_tt')],X [GetCountry('POR').Custom('CL_GEN')|L]#!#! [Select_CString(target_character.IsFemale,'издала', 'издал')] указ, обязывающий всех местных #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#! принять #TOOLTIP:RELIGION,$catholic_tt$,X #L католичество#!#! под угрозой изгнания из страны.\n\nХотя наш долг вмешаться и защитить своих братьев по вере, некоторые советники считают, что ради этого не стоит подвергать нашу державу опасности."
 flavor_por.32.a: "Об этом стоит подумать."
 flavor_por.32.b: "Объявить им джихад."
 flavor_por.33.title: "Рибейра-даш-Науш"
 flavor_por.33.entry: "$flavor_por.33.title$"
 flavor_por.33.desc: "На протяжении сотен лет наши суда строились на доках #italic терсенаш#! в #TOOLTIP:LOCATION,lisbon,X #L Лиссабоне#!#!, но город уже давно нуждается в полноценной верфи. К счастью, недавно [target_character.GetName] [Select_CString(target_character.IsFemale,'изъявила', 'изъявил')] желание возвести в районе старых доков дворец #italic Пасу-де-Рибейра#!, и теперь у нас появилась возможность построить поблизости современную верфь.\n\nРаботники нарекли новый судостроительный комплекс #italic Рибейра-даш-Науш#!, и это название уже успело прижиться. Это предприятие значительно расширит наши возможности по строительству кораблей, а значит, позволит нам в кратчайшие сроки создать мощный флот."
 flavor_por.33.a: "Это нам пригодится."
 flavor_por.33.historical_info: "Территория Морского арсенала, где когда-то находились средневековые морские доки терсенаш, сильно изменилась после того, как король Мануэл I построил здесь Пасу-да-Рибейра. Возведение новых терсенаш под названием Рибейра-даш-Науш к западу от королевского дворца сыграло важную роль в строительстве кораблей, без которых были бы невозможны португальские географические открытия. Эти верфи, крупнейшие в Португальской империи, служили моделью для судостроительных предприятий в колониях, в первую очередь на Гоа и в Кочине."
 flavor_por.34.title: "Перенос университета города [current_location.GetNameWithNoTooltip]"
 flavor_por.34.entry: "Перенос университета Коимбры"
 flavor_por.34.desc: "Университет города [current_location.GetName] был изначально основан в 1290 году под названием «[ShowLawName('por_estudo_geral_law')]», и тогда он находился в городе [target_location.GetName]. Там учебное заведение действовало вплоть до 1308 года, но из-за конфликтов с местными жителями его пришлось перенести на нынешнее место.\n\nВпрочем, с тех пор былые разногласия удалось разрешить, поэтому при желании [target_character.GetName] вполне может перенести университет обратно в столицу."
 flavor_por.34.a: "Перенести университет в город [target_location.GetNameWithNoTooltip]."
 flavor_por.34.a.entry: "Вернём сооружение в Лиссабон."
 flavor_por.34.b: "Мы не можем позволить этим конфликтам разгореться вновь."
 flavor_por.35.title: "[target_character.GetNameWithNoTooltip] и [Select_CString(target_character.IsFemale,'её', 'его')] меркантилистские идеи"
 flavor_por.35.entry: "Меркантилистские идеи графа де Эрисейра"
 flavor_por.35.desc: "Один из членов совета и [Select_CString(target_character.IsFemale,'ярая сторонница', 'ярый сторонник')] #TOOLTIP:SOCIETAL_VALUE,mercantilism_vs_free_trade,X #L меркантилизма#!#! по имени [target_character.GetName] выдвигает множество разумных предложений по развитию #L [ROOT.GetCountry.GetAdjective|l]ой#! промышленности. Беда в том, что для осуществления [Select_CString(target_character.IsFemale,'её', 'его')] планов нам потребуется кардинально изменить законодательство, что может разозлить многих влиятельных людей.\n\n[target_character.GetNameWithNoTooltip] считает одной из важных проблем то, что жители нашей державы носят одежду из иностранных материалов. По [Select_CString(target_character.IsFemale,'её', 'его')] мнению, мы можем исправить эту ситуацию, вложив средства в расширение производства #TOOLTIP:GOODS,wool,X #L шерсти#!#! и #TOOLTIP:GOODS,cloth,X #L текстиля#!#! в городе [target_location.GetName], который уже зарекомендовал себя как основной поставщик шерсти в державе."
 flavor_por.35.a: "Прислушаемся к [Select_CString(target_character.IsFemale,'её', 'его')] совету."
 flavor_por.35.a.entry: "Прислушаемся к его совету."
 flavor_por.35.b: "Слишком рискованный план."
 flavor_por.36.title: "[target_character.GetNameWithNoTooltip] лелеет амбиции"
 flavor_por.36.entry: "Устремления маркиза де Помбал"
 flavor_por.36.desc: "[ruler_scope.GetName] считает, что [ROOT.GetCountry.GetLongName] постепенно теря[ROOT.GetCountry.Custom('endlong_etyut')] политическое и торговое влияние, из-за чего начина[ROOT.GetCountry.Custom('endlong_etyut')] отставать от других великих держав #TOOLTIP:CONTINENT,europe,X #L Европы#!#!. Надеясь исправить эту ситуацию, [ruler_scope.GetNameWithNoTooltip] стремится набрать в совет талантливых государственных деятелей, которые смогут вызволить страну из застоя. Одним из таких людей [Select_CString(target_character.IsFemale,'стала', 'стал')] [target_character.GetName], [Select_CString(target_character.IsFemale,'побывавшая', 'побывавший')] во многих дворах Европы и [Select_CString(target_character.IsFemale,'придумавшая', 'придумавший')] целый ряд идей, которые [Select_CString(target_character.IsFemale,'она хотела', 'он хотел')] бы реализовать.\n\nНаиболее актуальными из [Select_CString(target_character.IsFemale,'её', 'его')] планов являются реформы аграрного и промышленного секторов, а также создание новых предприятий для торговли ходовыми товарами. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] наверняка будут недовольны подобными изменениями."
 flavor_por.36.a: "Последуем [Select_CString(target_character.IsFemale,'её', 'его')] советам."
 flavor_por.36.a.entry: "Немедленно претворить его идеи в жизнь!"
 flavor_por.36.b: "Очевидно, [Select_CString(target_character.IsFemale,'она самая обыкновенная шарлатанка', 'он самый обыкновенный шарлатан')]."
 flavor_por.36.b.entry: "Нужно больше внимания уделять государству и меньше — всяким проходимцам."
 flavor_por.37.title: "[target_work_of_art.GetNameWithNoTooltip]"
 flavor_por.37.entry: "Esmeraldo de Situ Orbis"
 flavor_por.37.desc: "[Select_CString(target_character.IsFemale, 'Наша выдающаяся исследовательница', 'Наш выдающийся исследователь' )] по имени [target_character.GetName] [Select_CString(target_character.IsFemale, 'завершила', 'завершил' )] работу над монументальным #TOOLTIP:WORK_OF_ART_TYPE,treatise,X #L трактатом#!#! под названием [target_work_of_art.GetName]. В этом труде по космографии и навигации описаны последние открытия #L [ROOT.GetCountry.GetAdjective|l]их#! путешественников, а также применявшиеся там научные методы. [Select_CString(ruler_scope.IsFemale,'Наша правительница', 'Наш правитель')] [ruler_scope.GetName] [Select_CString(ruler_scope.IsFemale,'смогла первой', 'смог первым')] ознакомиться с трактатом и решить, стоит ли его публиковать."
 flavor_por.37.a: "Спрячем манускрипт, чтобы остановить распространение этих знаний."
 flavor_por.37.b: "Опубликуем его: пусть он повысит наш престиж!"
 variable_num_of_explorations_tt: "Наши исследователи проложили множество маршрутов"
 flavor_por.38.title: "[target_character.GetNameWithNoTooltip]"
 flavor_por.38.entry: "Гаспар да Индия"
 flavor_por.38.desc: "Из недавней #TOOLTIP:SUB_CONTINENT,india,X #L индийской#!#! экспедиции наши моряки привезли интереснейшего человека по имени [target_character.GetName]. Он утверждает, что является #L [target_character.GetReligion.GetAdjective|l]им#! путешественником родом из #ONCLICK:COUNTRY,[GetCountry('POL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('POL').Custom('CL_tt')],X [GetCountry('POL').Custom('CL_GEN')|L]#!#! и владеет множеством иностранных языков. Если это правда, то он мог бы послужить нам в качестве [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого переводчика в странах Востока."
 flavor_por.38.a: "Назначьте его к нам на флот!"
 flavor_por.38.b: "Мы не нуждаемся в его услугах."
 flavor_por.39.title: "$por_geral_de_espanha$"
 flavor_por.39.entry: "$flavor_por.39.title$"
 flavor_por.39.desc: "[ShowTraitName('bastard')] по имени [target_character.GetName] показал себя весьма опытным и образованным человеком, к советам которого прислушивается даже наш [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]. Вернувшись с войны против [GetCountry('MOR').Custom('longname_ru_GEN')], он составил большую #TOOLTIP:WORK_OF_ART_TYPE,chronicle,X #L хронику#!#!, где подробно описал историю Реконкисты и роль #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! в ней."
 flavor_por.39.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_por.39.a.entry: "$common_string_brilliant$"
 flavor_por.40.title: "[ShowPolicyNameWithNoTooltip('por_lei_mental')]"
 flavor_por.40.entry: "Lei Mental"
 flavor_por.40.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] ведут бесконечную борьбу за власть. Каждый наш [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] в той или иной степени пытался #TOOLTIP:SOCIETAL_VALUE,centralization_vs_decentralization,X #L централизовать#!#! государство, но зачастую сталкивался с сопротивлением влиятельной знати. Это привело к созданию бесчисленного множества законов, которые перегружают наш административный и бюрократический аппарат. В связи с этим [target_character.GetName] планирует утвердить [ShowPolicyName('por_lei_mental')] — исчерпывающий документ, который поможет положить конец внутренним распрям."
 flavor_por.40.a: "Ввести закон."
 flavor_por.40.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] наверняка будут против."
 flavor_por.40.b.entry: "Нельзя злить аристократов!"
 flavor_por.41.title: "Общие корни"
 flavor_por.41.desc: "Многие знатные дома представлены одновременно и в нашей державе, и на территории #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!. Среди них есть такие влиятельные династии, как [GetDynasty('castro_dynasty').GetName], [GetDynasty('meneses_dynasty').GetName], [GetDynasty('albuquerque_dynasty').GetName] и многие другие. Такое выгодное расположение позволяет представителям этих родов произвольно пересекать границу и поддерживать связи одновременно с двумя дворами.\n\nНедавно этой ситуацией [Select_CString(target_character.IsFemale,'воспользовалась', 'воспользовался')] [target_character.GetName]: [Select_CString(target_character.IsFemale,'она была настолько возмущена', 'он был настолько возмущён')] нашей политикой, что [Select_CString(target_character.IsFemale,'решила', 'решил')] покинуть страну и примкнуть к [target_country.GetAdjectiveWithNoTooltip|l]ому двору."
 flavor_por.41.a: "Скатертью дорога!"
 por_reason_for_flavor_por_41: "Чтобы избежать подобных инцидентов в будущем, нам следует поддерживать [Concept('estate_satisfaction', 'довольство сословия')|e] «[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]» на уровне выше #Y 30%#!."
 flavor_por.42.title: "[target_character.GetNameWithNoTooltip] переезжает в [ROOT.GetCountry.Custom('CL_ACC')]"
 flavor_por.42.entry: "В Португалию переезжает аристократ"
 flavor_por.42.desc: "[Select_CString(target_character.IsFemale,'Представительница', 'Представитель')] #L [origin_country.GetAdjective|l]ой#! знати по имени [target_character.GetName] недавно [Select_CString(target_character.IsFemale,'прибыла', 'прибыл')] в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#!, чтобы присоединиться к нашему двору. Причины такого решения нам неизвестны, но, по всей видимости, это связано с [Select_CString(target_character.IsFemale,'её', 'его')] недовольством политикой [origin_country.GetAdjectiveWithNoTooltip|l]их властей."
 flavor_por.42.a: "Добро пожаловать!"
 flavor_por.43.title: "$livro_das_cantigas$"
 flavor_por.43.entry: "$flavor_por.43.title$"
 flavor_por.43.desc: "[target_character.GetName] доживает свои последние дни в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Возможно, он последний великий песенник #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Он был внебрачным сыном легендарного короля-поэта, а также проявил себя на творческом поприще и написал множество #italic кантиг#!. Более того, он приложил немало усилий, чтобы увековечить свои труды, составив огромный сборник песен под названием [target_work_of_art.GetName]. Понимая, что смерть близка, он решил передать этот сборник своему племяннику из #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! по имени [target_dedication_character.GetName]."
 flavor_por.43.a: "Отнесёмся с уважением к его решению."
 flavor_por.43.b: "Эта книга должна остаться у нас!"
 flavor_por.44.title: "$flavor_por.43.title$"
 flavor_por.44.entry: "$flavor_por.44.title$"
 flavor_por.44.desc: "[target_dedication_character.GetName] [Select_CString(target_dedication_character.IsFemale,'получила', 'получил')] от [Select_CString(target_character.IsFemale,'своей родственницы', 'своего родственника')] подарок — огромный сборник [Select_CString(target_character.IsFemale,'её', 'его')] собственных песен под названием [target_work_of_art.GetName]. Это настоящий шедевр поэзии, и владеть им — большая честь."
 flavor_por.44.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_por.44.a.entry: "$common_string_brilliant$"
 flavor_por.45.title: "[ShowGovernmentReformNameWithNoTooltip('por_ordinances')]"
 flavor_por.45.entry: "Указы Афонсу"
 flavor_por.45.desc: "На территории нашей державы одновременно применяется каноническое, римское и государственное право, что порождает множество противоречий. Намереваясь навести порядок в нашем законодательстве, [target_character.GetName] [Select_CString(target_character.IsFemale,'решила', 'решил')] утвердить единый свод законов, который получил название «[ShowGovernmentReformName('por_ordinances')]». Мы уже готовы изготовить тысячи копий этого документа и разослать их по всем регионам, чтобы повысить эффективность работы правительства."
 flavor_por.45.a: "Проведём реформу."
 flavor_por.45.b: "Мы пока не готовы к таким переменам."
 por_upgrade_ordinances: "Эффекты [Concept('modifiers', 'модификаторов')|e] от государственного принципа «[ShowGovernmentReformName('por_ordinances')]» будут усилены на #g 50%#!. При этом потребности [Concept('pops', 'населения')|e] в #TOOLTIP:GOODS,paper,X #L бумаге#!#! увеличатся вдвое."
 flavor_por.46.title: "Печатный станок и «[ShowGovernmentReformNameWithNoTooltip('por_ordinances')]»"
 flavor_por.46.entry: "Указы Мануэла"
 flavor_por.46.desc: "С изобретением #TOOLTIP:INSTITUTION,printing_press,X #L печатного станка#!#! у нас появилась возможность ускорить издание «#TOOLTIP:GOVERNMENT_REFORM,por_ordinances,X #L Португальских ордонансов#!#!». Кроме того, теперь мы можем внести в документ ряд дополнений и избавиться от устаревших законов, которые потеряли свою актуальность за последние десятилетия. Это определённо пойдёт на благо [ROOT.GetCountry.Custom('rank_ru_DAT')|l], но потребует значительных вложений."
 flavor_por.46.a: "Заказать новое издание."
 flavor_por.46.b: "Всё и так работает неплохо."
 flavor_por.47.title: "Мизерикордия"
 flavor_por.47.entry: "$flavor_por.47.title$"
 flavor_por.47.desc: "До недавнего времени заботой о бедных и больных занимались учреждения, известные как #italic албергарии#! и #italic госпитали#!. Однако скоро они могут потерять свою актуальность, поскольку недавно несколько жителей города [target_location.GetName] основали новое благотворительное братство под названием «[ShowModifier('por_misericordia')]». Члены самых разных сословий выражают свою поддержку этой организации и массово вступают в её ряды, и теперь её представительства можно встретить в любой части #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Единственные, кто ещё не высказал своего мнения о братстве, — это правительство страны."
 flavor_por.47.a: "Примем их под своё покровительство."
 flavor_por.47.b: "У нас есть некоторые сомнения."
 flavor_por.48.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.48.entry: "В Брюгге основана фейтория"
 flavor_por.48.desc: "В последнее время #L [ROOT.GetCountry.GetAdjective|l]ие#! [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] стали часто посещать [target_location.Custom('LR_ACC')|l] [target_location.GetName], что побудило местные власти предоставить им определённые привилегии. Благодаря этому город стал одним из наших основных торговых партнёров в Северной #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Чтобы мы могли и дальше развивать сотрудничество, многие [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] просят нас построить в этом районе новую #TOOLTIP:BUILDING_TYPE,trade_office,X #L торговую контору#!#!."
 flavor_por.48.a: "Выделить средства на строительство конторы."
 flavor_por.48.b: "Лучше построим что-нибудь для внутренних нужд."
 flavor_por.49.title: "[target_character.GetNameWithNoTooltip]"
 flavor_por.49.entry: "Фернан Лопеш"
 flavor_por.49.desc: "[target_character.GetName] приобрёл большую известность при дворе благодаря своему писательскому дару. В частности, он создал множество трудов по [ROOT.GetCountry.GetAdjective|l]ой истории, которые безусловно пригодятся нам для обучения будущих поколений. Благодаря своему положению он стал участником целого ряда важных событий, поэтому многие предлагают назначить его на должность архивариуса или летописца."
 flavor_por.49.a: "Назначить [Select_CString(target_character.IsFemale,'её главной летописицей', 'его главным летописцем')]."
 flavor_por.49.a.entry: "Назначим его главным летописцем."
 flavor_por.49.b: "Не слишком впечатляет."
 flavor_por.50.title: "Подчинение орденов"
 flavor_por.50.entry: "$flavor_por.50.title$"
 flavor_por.50.desc: "Эпоха #L [target_religion.GetAdjective|l]их#! #TOOLTIP:GOVERNMENT_REFORM,military_order_reform,X #L рыцарских орденов#!#! близится к завершению. Их численность стремительно сокращается, а участие в подобных организациях уже не считается чем-то престижным. Исходя из этого [GetCountry('PAP').GetGovernment.GetRulerTitle|l] [Select_CString(GetCountry('PAP').GetGovernment.GetRuler.IsFemale,'дала', 'дал')] согласие на то, чтобы [target_character.GetName] [Select_CString(target_character.IsFemale,'стала', 'стал')] великим магистром ряда духовных орденов, и теперь мы имеем над ними полный контроль."
 flavor_por.50.a: "Будем управлять ими напрямую."
 flavor_por.50.b: "Распустить ордена!"
 flavor_por.51.title: "Сан-Жоржи-да-Мина"
 flavor_por.51.entry: "$flavor_por.51.title$"
 flavor_por.51.desc: "Во время недавней экспедиции в районе #TOOLTIP:AREA,gulf_of_africa_sea,X #L Гвинейский залив#!#! мы натолкнулись на группу местных жителей из [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Хотя такие встречи случаются довольно часто, эта ситуация заслуживает особого внимания, поскольку те туземцы торговали #TOOLTIP:GOODS,goods_gold,X золотом#!. Если местные так охотно расстаются со столь драгоценным товаром, значит, где-то рядом должны быть богатые залежи этого металла. Понимая, что для его добычи нам потребуется расширить своё присутствие в этом районе, наши путешественники возвели неподалёку #italic падран#! и начали строительство небольшого аванпоста."
 flavor_por.51.a: "Надо продолжать эту торговлю."
 flavor_por.51.b: "Мы найдём другой источник золота."
 flavor_por.52.title: "[Select_CString(CHARACTER.IsFemale, 'Мореплавательница', 'Мореплаватель' )]"
 flavor_por.52.entry: "$flavor_por.52.title$"
 flavor_por.52.desc: "За последние годы [target_character.GetName] [Select_CString(target_character.IsFemale,'сумела', 'сумел')] выгодно отличиться от всех остальных #italic инфантов#! #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [Select_CString(target_character.IsFemale,'Она', 'Он')] обладает необычайной прозорливостью и твёрдо верит, что будущее нашей державы лежит в открытии новых земель. Ввиду этого [Select_CString(target_character.IsFemale,'она готова', 'он готов')] готов тратить значительную часть своего личного состояния на отправку экспедиций через #TOOLTIP:REGION,north_atlantic_ocean_region,X #L Северный Атлантический океан#!#!. Мы могли бы поддержать [Select_CString(target_character.IsFemale,'её', 'его')] в этом деле, предоставив [Select_CString(target_character.IsFemale,'ей', 'ему')] монополию на ведение подобной деятельности."
 flavor_por.52.a: "Предоставить [Select_CString(CHARACTER.IsFemale, 'ей', 'ему' )] монополию!"
 flavor_por.52.b: "Это было бы слишком щедро."
 flavor_por.52.b.entry: "Это было бы слишком щедро."
 flavor_por.53.title: "[target_character.GetNameWithNoTooltip]"
 flavor_por.53.entry: "Бартоломеу Диаш"
 flavor_por.53.desc: "Один из наших моряков по имени [target_character.GetName] отлично проявил себя в ходе прошлых экспедиций, за что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] оказывает ему особую благосклонность. Так, он значительно продвинулся по служебной лестнице и даже получил право на ежемесячное жалование, которое позволяет ему заниматься подготовкой следующих проектов. Многие члены двора желают, чтобы именно он возглавил нашу следующую экспедицию."
 flavor_por.53.a: "Назначим его командующим экспедицией."
 flavor_por.53.b: "Для нас важнее сухопутные дела."
 flavor_por.54.title: "Зарождение терций"
 flavor_por.54.entry: "$flavor_por.54.title$"
 flavor_por.54.desc: "Постоянные конфликты в #TOOLTIP:CONTINENT,europe,X #L Европе#!#! стимулируют развитие военной мысли. Одним из главных новшеств последнего времени стала #TOOLTIP:ADVANCE_DEFINITION,tercio,X #L терция#!#! — особый пехотный строй, который может значительно повысить боеспособность #L [ROOT.GetCountry.GetAdjective|l]ой#! армии. Однако вместо того, чтобы использовать этот строй в сухопутных сражениях, [target_character.GetName] планирует внедрить его во флоте."
 flavor_por.54.a: "Из них выйдет отличная морская пехота."
 flavor_por.54.b: "Пусть они воюют на суше."
 flavor_por.54.historical_info: "В отличие от испанцев, португальцы использовали терции в войне на море. Эти подразделения, сражавшиеся с османами и марокканцами в битве при Эль-Ксар-эль-Кебире, стали предшественниками современного Корпуса морской пехоты Португалии."
 flavor_por.55.title: "[ShowBuildingTypeNameWithNoTooltip('por_feitoria')] в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.55.entry: "Фейтория в Аргене"
 flavor_por.55.desc: "[target_character.GetName] считает, что [target_location.GetName] — идеальное место для основания #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейтории#!#!. Занимая выгодное положение между #TOOLTIP:REGION,maghreb_region,X #L Магрибом#!#! и #TOOLTIP:REGION,guinea_region,X #L Гвинеей#!#!, [target_location.GetRank.GetName|l] может послужить плацдармом для укрепления нашего торгового влияния в регионе, поэтому нам стоит всерьёз задуматься о создании здесь аванпоста."
 flavor_por.55.historical_info: "Аргуим, первая португальская фейтория в Африке, служила ключевым центром торговли золотом и рабами. Её было легко оборонять, для кораблей в ней была безопасная гавань, а по суше её часто посещали караваны из-за Сахары, пришедшие за солью. Впрочем, корона не уделяла ей такого внимания, как другим фейториям, и в конце концов в 1633 году её форт был взят отрядом из сорока голландских солдат."
 flavor_por.55.a: "Это будет маленький шаг к великой цели."
 flavor_por.55.b: "Это бессмысленная затея."
 flavor_por.56.title: "[ShowBuildingTypeNameWithNoTooltip('por_feitoria')] в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.56.entry: "Фейтория в Макао"
 flavor_por.56.desc: "С тех пор как мы получили контроль над [target_location.Custom('LR_INST')|l] [target_location.GetName], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] непрерывно пытаются расширить своё влияние в #TOOLTIP:SUB_CONTINENT,china,X #L Китае#!#!. Для этого они предлагают основать в этом районе #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторию#!#!, о чём уже давно подумывает и [Select_CString(target_character.IsFemale,'сама', 'сам')] [target_character.GetName]."
 flavor_por.56.historical_info: "Портовый город Макао, полученный от правителей династии Мин в 1557 году, расцвёл под португальской властью. Королевский двор и орден иезуитов активно вкладывали в него средства, способствуя развитию торговли с Китаем по суше и с Японией по морю."
 flavor_por.56.a: "Нам необходимо наращивать присутствие в Китае."
 flavor_por.56.b: "Свободная торговля — вот что даст нам влияние."
 flavor_por.57.title: "Поддержка торговли в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.57.entry: "Фейтория в Гоа"
 flavor_por.57.desc: "Необходимо усилить контроль над портом [target_location.Custom('LR_GEN')|l] [target_location.GetName], чтобы [ROOT.GetCountry.GetCapital.GetMarket.GetName|l] исправно получал ресурсы. [target_character.GetName] предлагает построить там #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторию#!#!, чтобы наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] могли и дальше расширять своё влияние в #TOOLTIP:SUB_CONTINENT,india,X #L Индии#!#!."
 flavor_por.57.historical_info: "Территория Гоа была приобретена Афонсу де Албукерке в 1510 году в качестве плацдарма для завоевания Малакки и Ормуза. Став главной базой португальского флота в Индийском океане, она способствовала торговле пряностями и позволяла Португалии расширять морское присутствие."
 flavor_por.57.a: "Звучит заманчиво."
 flavor_por.57.b: "В этом нет необходимости."
 flavor_por.57.b.entry: "В этом нет необходимости."
 flavor_por.58.title: "Укрепление [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.58.entry: "Фейтория в Ормузе"
 flavor_por.58.desc: "Остров [target_location.GetName] занимает стратегически важное положение в #TOOLTIP:LOCATION,persian_gulf,X #L Персидском заливе#!#!, поэтому местный порт играет большую роль для нашей торговли в #TOOLTIP:CONTINENT,asia,X #L Азии#!#!. Ввиду этого [target_character.GetName] желает основать в [target_location.Custom('LR_PREP')|l] хорошо укреплённую #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторию#!#!, чтобы наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] могли свободно наращивать своё присутствие в близлежащих районах."
 flavor_por.58.historical_info: "После того, как Афонсу де Албукерке стремительно завоевал Ормуз, этому острову стали угрожать персы и османы. Для защиты от них Афонсу построил крепость Непорочного Зачатия Девы Марии, которая позволяла Португалии контролировать Персидский залив до 1622 года. Потом крепость была захвачена объединёнными силами Сефевидов и Британской Ост-Индской компании."
 flavor_por.58.a: "Одобрить строительство крепости."
 flavor_por.58.a.entry: "Мы укрепим Ормуз."
 flavor_por.58.b: "Его природной защиты более чем достаточно."
 flavor_por.59.title: "Контроль над проливом [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.59.entry: "Фейтория в Малакке"
 flavor_por.59.desc: "Чтобы свободно торговать в Восточной #TOOLTIP:CONTINENT,asia,X #L Азии#!#!, сначала нужно обеспечить защиту порта [target_location.Custom('LR_GEN')|l] [target_location.GetName]. К счастью, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] готовы выделить средства на строительство в этом районе укреплённой #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейтории#!#!."
 flavor_por.59.historical_info: "Малакка перешла к Португалии после осады, успешно проведенной Афонсу де Албукерке в 1511 году. Впоследствии этот город стал одним из ключевых португальских форпостов. Понимая, что соседние страны непременно попытаются захватить контроль над проливом, власти страны возвели надёжные укрепления. Малакка оставалась под португальским контролем до 1641 года, когда её захватили голландцы."
 flavor_por.59.a: "Надо укрепить пролив."
 flavor_por.59.b: "Нам это ни к чему."
 flavor_por.60.title: "Далёкий оплот"
 flavor_por.60.entry: "$flavor_por.60.title$"
 flavor_por.60.desc: "[target_location.GetName] — один из опорных пунктов наших экспедиций в районе #TOOLTIP:REGION,north_atlantic_ocean_region,X #L Северной#!#! и #TOOLTIP:REGION,south_atlantic_region,X #L Южной Атлантики#!#!. Однако западные морские пути становятся всё более востребованными, и нам стоит задуматься о расширении [target_location.Custom('LR_GEN')|l]. Члены правительства предлагают вложить в развитие порта дополнительные средства, чтобы он полностью отвечал нашим растущим потребностям."
 flavor_por.60.historical_info: "Благодаря своему положению, удобному как для торговцев, так и для исследователей, Ангра процветала под португальской властью. В этот порта, которым единолично правил богатый купец Лукас де Касена, вкладывали средства фламандские, испанские и генуэзские элиты. В начале 1500-х годов король Жуан III пожаловал ему статус города."
 flavor_por.60.a: "Выделить средства на расширение порта."
 flavor_por.60.a.entry: "Выделим средства на развитие Ангры."
 flavor_por.60.b: "Этим деньгам найдётся лучшее применение."
 flavor_por.61.title: "[target_location.GetNameWithNoTooltip] в центре внимания"
 flavor_por.61.entry: "Крестовый поход на Сеуту"
 flavor_por.61.desc: "[Select_CString(target_character.IsFemale,'Движимая', 'Движимый')] идеей расширения нашего присутствия в #TOOLTIP:REGION,maghreb_region,X #L Магрибе#!#!, [target_character.GetName] [Select_CString(target_character.IsFemale,'решила', 'решил')] узнать позицию правительства и военного совета по этому вопросу. Большинство сходится во мнении, что для начала нужно взять под контроль [target_location.Custom('LR_ACC')|l] [target_location.GetName]. Однако, если мы всё же решим пойти войной на #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#!, надо быть готовыми к ожесточённому сопротивлению."
 flavor_por.61.historical_info: "Вскоре после победы в битве при Алжубарроте португальский король Жуан I начал готовить экспедицию для взятия Сеуты — ведь этот город позволил бы ему контролировать торговлю с Левантом, Египтом и Ливией. С его стремительного захвата началась история Португальской империи."
 flavor_por.61.a: "Мы продолжим завоевания."
 flavor_por.61.b: "Возможно, нам стоит укрепить свою власть мирным путём."
 flavor_por.62.title: "[target_character.GetNameWithNoTooltip] лелеет амбиции"
 flavor_por.62.entry: "Магеллан"
 flavor_por.62.desc: "[target_character.GetName] обратился к нам за поддержкой его амбициозного проекта. Он хочет собрать небольшой флот и совершить первое в истории кругосветное плавание. Безусловно, это крайне рискованная затея, но если мы ему откажем, то он может совершить это путешествие уже под знаменем другой державы…"
 flavor_por.62.historical_info: "$flavor_por_magellan_historical_info$"
 flavor_por.62.a: "Пусть предлагает свои безумные идеи кому-нибудь другому."
 flavor_por.62.a.entry: "Пусть предлагает свои безумные идеи кому-нибудь другому."
 flavor_por.62.b: "Отвергать столь грандиозный план было бы неразумно..."
 flavor_por_magellan_historical_info: "Плавание Фернана де Магальяйнша, более известного как Магеллан, стало одной из самых знаменитых экспедиций, отправившихся из Иберии. Сначала Фернан служил в Португальской Ост-Индии, помогая Афонсу де Албукерке завоёвывать Малакку, а потом стал планировать собственное путешествие с целью найти Острова пряностей. После того, как португальский король несколько раз отказал ему в поддержке, он обратился к испанскому монарху Карлосу I и получил желаемое."
 flavor_por.64.title: "Защита [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 flavor_por.64.entry: "Фейтория на Золотом Берегу"
 flavor_por.64.desc: "Некоторые советники предлагают основать в [target_location.Custom('LR_PREP')|l] [target_location.GetName] укреплённую #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторию#!#!, которая позволит нам взять под контроль торговлю в #TOOLTIP:REGION,guinea_region,X #L Гвинее#!#!. [target_character.GetName] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] также имеют в этом районе свои интересы, поэтому мы можем рассчитывать на их поддержку в этом деле."
 flavor_por.64.historical_info: "Замок Эльмина является самой известной португальской фейторией в Африке. Его построил Генрих Мореплаватель в 1481 году, чтобы контролировать морской путь из Индии в Европу вдоль Золотого Берега. Туда стекалось множество европейских, азиатских и африканских торговцев. Португалия контролировала эту фейторию до 1637 года, когда её захватили голландцы."
 flavor_por.64.a: "Здравая идея."
 flavor_por.64.b: "Управлять ветрами торговли? Пусть они дуют естественным образом."
 flavor_por.65.title: "Дом Мендес"
 flavor_por.65.entry: "$flavor_por.65.title$"
 flavor_por.65.desc: "[mendes_bank_hq.GetName] полон талантов, но среди купцов и финансистов особенно выделяется семья [target_dynasty.GetName]. Её члены сколотили состояние на торговле пряностями и кредитовании европейских монархов. Теперь этот род хочет формализовать свою банковскую деятельность. Его связи простираются от Пиренейского полуострова до дворов Северной Европы. Нет сомнений, что из них получатся отличные финансовые партнёры."
 flavor_por.65.historical_info: "Мендесы — португальская семья банкиров с еврейскими корнями, которая прославилась в XVI веке. Её самым известным членом была Грасия Мендес Наси — богатейшая и влиятельнейшая женщина Европы, управлявшая обширной торговой империей из Лисабона, Антверпена, Венеции и Константинополя. Банк Мендесов выдавал кредиты европейским монархам, спонсировал торговлю пряностями и был одним из важнейших финансовых институтов того времени."
 flavor_por.65.a: "Их ресурсы пойдут нам на благо."
 flavor_por.65.b: "Вместе мы разбогатеем!"
 flavor_por.66.title: "$flavor_por.65.title$"
 flavor_por.66.desc: "Мы создали свой банк [GetCountry('POR').Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('POR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('POR').Custom('CL_tt')],X [GetCountry('POR').Custom('CL_PREP')|L]#!#!. Через нашу бухгалтерию проходят доходы от торговли специями и кредиты европейских монархов. Мы докажем свою незаменимость не только купцам, но и [GetCountry('POR').Custom('rank_ru_DAT')|l]."
 flavor_por.66.a: "Наше состояние растёт с каждым путешествием."
 flavor_por.67.title: "Into the Unknown"
 flavor_por.67.entry: "$flavor_por.67.title$"
 flavor_por.67.desc: "The seas beyond our shores remain veiled in mystery, but merchants and travelers tell us of distant markets overflowing with riches beyond our imagination. Others tell the tale of the mighty kingdom of Prester John, who is said to have established his realm somewhere far in the Indies. If we could but discover a sea route to those lands beyond the ocean, [ROOT.GetCountry.GetName] might trade directly with the riches of [ShowSubContinentName('india')] and beyond, and perhaps even unite forces with the fabled realm of Prester John."
 flavor_por.67.a: "Вперёд, в неизвестность!"
 flavor_por.67.b: "Нам следует сосредоточиться на внутренних делах."
 flavor_por.67.a.tt: "До конца #V Эпохи открытий#! успешные миссии [exploration|e] с вероятностью 10% продлевают действие [ShowModifier('POR_into_the_beyond')] на 10 лет"
 flavor_por.67.historical_info: "После Реконкисты и мусульманского господства над восточным Средиземноморьем португальская корона искала новые возможности за пределами Иберии. Движимая как богатствами дальних земель, так и легендами о пресвитере Иоанне, чьё царство могло бы стать ценным союзником против исламских держав, Португалия исследовала африканское побережье и искала морской путь в Индию, превратившись в одну из первых мировых империй."
 flavor_por.68.title: "Поход продолжается"
 flavor_por.68.entry: "$flavor_por.68.title$"
 flavor_por.68.desc: "Наши экспедиции в неведомые моря уже принесли свои плоды, открыв новые земли и неизведанные воды за пределами известного мира. Каждое открытие укрепляет нашу веру в то, что богатства Востока уже почти в наших руках, и возрождает надежду отыскать где-то за океаном сказочное царство пресвитера Иоанна."
 flavor_por.68.a: "Многое ещё предстоит открыть."
 flavor_por.69.title: "Триумф в Реставрационной войне"
 flavor_por.69.entry: "$flavor_por.69.title$"
 flavor_por.69.desc: "Борьба за нашу независимость наконец подошла к концу. Под предводительством [target_ruler.GetName] мы обеспечили независимость [ROOT.GetCountry.GetName]. Наш народ высыпал на улицы, чтобы прославлять [target_ruler.GetNameWithNoTooltip] как Восстановителя [ROOT.GetCountry.GetNameWithNoTooltip], освободителя и родоначальника нашего возрождённого [ROOT.GetCountry.GetFlavorRank]."
 flavor_por.69.a: "Да здравствует Восстановитель!"
 flavor_por.69.trigger_tt: "Выбрал Жуана де Браганса возглавить нацию в событии «$flavor_por.19.entry$»"
 flavor_por.69.john_tt: "Жуан де Браганса жив и является правителем нации"
 flavor_por.69.historical_info: "Иберийская уния возникла в 1580 году, когда король Испании Филипп II заявил свои права на престол Португалии после кризиса престолонаследия, вызванного смертью короля Себастьяна, а затем и его дяди, короля Энрике. Со временем недовольство росло, поскольку интересы Португалии сталкивались с интересами Испании, и в 1640 году вспыхнуло восстание под предводительством Жуана, герцога Браганского, которого провозгласили королём. Хотя война была долгой и продлилась 27 лет, Португалия сумела восстановить свою независимость, положив конец Иберийской унии."
 flavor_por.70.title: "Катастрофа на поле боя"
 flavor_por.70.entry: "$flavor_por.70.title$"
 flavor_por.70.desc: "До [ROOT.GetCountry.GetGovernment.GetCourtTitle] дошли ужасные вести: наш любимый [target_ruler.GetName] пал, ведя нашу армию против сил язычников при [target_location.GetName]. Пока враг наступает, мы оказались в опасном положении, беззащитные перед внутренними распрями и иноземными амбициями."
 flavor_por.70.a: "Скорбите, но не падайте духом!"
 flavor_por.70.historical_info: "В 1578 году Португалия потерпела катастрофическое поражение в битве при Алькасер-Кибире в Марокко. Король Себастьян погиб в бою, не оставив наследника, что ввергло Португалию в династический кризис. Хотя ему наследовал его дядя Энрике, новый король был кардиналом, связанным обетом безбрачия, и потому тоже умер бездетным. В итоге португальская корона была захвачена королём Испании Филиппом II, что привело к включению Португалии в Иберийскую унию на следующие 60 лет."
 flavor_por.71.title: "Корона в опасности"
 flavor_por.71.entry: "$flavor_por.71.title$"
 flavor_por.71.desc: "До [ROOT.GetCountry.GetGovernment.GetCourtTitle] дошли вести о безвременной кончине [GetCountry('POR').GetAdjective] [GetCountry('POR').GetGovernment.GetRulerTitle] в битве при [target_location.GetName]. [GetCountry('POR').GetNameWithNoTooltip] теперь уязвима, и многие настаивают, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] воспользовалось этой слабостью в наших интересах, дабы мы могли осуществить свою мечту — объединить [ShowRegionName('iberia_region')] под властью единого правителя, и этим правителем будем мы!"
 flavor_por.71.a: "Вот момент, которого мы так долго ждали!"
 flavor_por.71.b: "Наследование [GetCountry('POR').GetAdjectiveWithNoTooltip] — их внутреннее дело."
 flavor_por.71.historical_info: "$flavor_por.70.historical_info$"
 flavor_por.72.title: "Обнаружены драгоценные металлы в [ShowRegionNameWithNoTooltip('brazil_region')]"
 flavor_por.72.entry: "Обнаружены драгоценные металлы в Бразилии"
 flavor_por.72.desc: "Наши заморские владения в [ShowRegionName('brazil_region')] сообщают об обнаружении крупных залежей драгоценных металлов. Местные отряды первопроходцев, известных как #italic бандейранты#, уже сформировались и продвигаются вглубь материка в надежде отыскать ещё больше богатств."
 flavor_por.72.a: "Поддержать бандейрантов."
 flavor_por.72.b: "Не будем тратить наши ресурсы на исследование джунглей."
 flavor_por.72.historical_info: "Открытие золота сыграло важную роль в португальской экспансии в Бразилии. Начиная с XVI века, экспедиции #italic бандейрантов# отодвигали границы португальской Бразилии далеко за пределы линий, установленных Тордесильясским договором. Эти экспедиции обнаружили обширные залежи металла, особенно в области Минас-Жерайс, что впоследствии положило начало одной из крупнейших и продолжительнейших золотых лихорадок в мире."
 flavor_por.73.title: "Brazilian Gold Rush"
 flavor_por.73.entry: "$flavor_por.73.title$"
 flavor_por.73.desc: "Years have passed since our first discovery of precious metals in [ShowRegionName('brazil_region')], and since then, our #italic Bandeirantes# have uncovered vast deposits that attract people from far and wide. Fortune seekers and laborers now pour into [ShowRegionNameWithNoTooltip('brazil_region')] in unprecedented numbers, and as vast quantities of gold begin to flow back to [ROOT.GetCountry.GetName], our coffers swell beyond anything previously imagined."
 flavor_por.73.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_por.73.a.entry: "Великолепно!"
 flavor_por.73.historical_info: "Бразильская золотая лихорадка началась после обнаружения обширных золотых залежей в области Минас-Жерайс в конце XVII века. Это был один из крупнейших и продолжительнейших периодов золотой лихорадки в мире, вызвавший переселение сотен тысяч людей в Бразилию. Эти золотые рудники сильно зависели от принудительного труда и держались на рабах, привезённых из Африки для работы во внутренних областях Бразилии."
 flavor_por.74.title: "[target_character.GetNameWithNoTooltip] желает отправиться в экспедицию"
 flavor_por.74.entry: "Экспедиция Антониу Тавареса"
 flavor_por.74.desc: "The expeditions of our #italic Bandeirantes# continue to tame the interior of [ShowRegionName('brazil_region')] and expand [ROOT.GetCountry.GetAdjective] influence in the region. One such recent expedition, led by [target_character.GetName], successfully charted the previously unknown areas of [target_area.GetName]. [target_character.GetLastNameWithNoTooltip] is now willing to share the knowledge [target_character.GetSheHe] attained during that expedition with the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] in exchange for our support of future expeditions."
 flavor_por.74.a: "Мы дадим денег на эту экспедицию."
 flavor_por.74.b: "У нас есть дела поважнее."
 flavor_por.74.historical_info: "Antonio Raposo Tavares was one of the most significant #italic Bandeirantes# who engaged in the exploration of the interior of Brazil. Although his expeditions were also responsible for the destruction of Jesuit missions and the enslavement of thousands of indigenous peoples, Raposo Tavares' explorations greatly expanded Portuguese influence beyond the limits imposed by the Treaty of Tordesillas."
 flavor_por.75.title: "Бандейранты начинают эксплуатировать местное население"
 flavor_por.75.entry: "$flavor_por.75.title$"
 flavor_por.75.desc: "The growing demand for labor in our colonial possessions has driven many #italic Bandeirantes# to conduct slave raids on local natives. Expeditions are now organized to venture deep into the interior and seize native people who can be put to work in the mines."
 flavor_por.75.a: "Закроем на это глаза."
 flavor_por.75.b: "Ситуация разрешится сама собой."
 flavor_por.75.c: "Наша экономика зависит от этого."
 flavor_por.75.historical_info: "The #italic Bandeirantes# originated as explorers and frontiersmen, but over time, these expeditions increasingly turned into raids aimed at capturing native people for enslavement. Throughout the 17th century, raids against native communities and Jesuit missions became a defining feature of many #italic bandeiras#, supplying forced labor for plantations, settlements, and eventually the rapidly expanding mining industry."
 flavor_por.76.title: "[target_character.GetNameWithNoTooltip] желает отправиться в экспедицию"
 flavor_por.76.entry: "Экспедиция Фернана Диаша"
 flavor_por.76.desc: "К нам недавно обратился [target_character.GetName], желающий организовать экспедицию вглубь [ShowRegionName('brazil_region')]. [target_character.GetLastNameWithNoTooltip] полагает, что обнаружил место, где находятся изумруды Сабарабусу, и хочет отыскать их как для [target_character.GetHisHer] собственной выгоды, так и во имя богатства и славы [ROOT.GetCountry.GetName]. Однако местное [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], работающее с туземным населением, выступает против этой затеи, обвиняя [target_character.GetHimHer] в эксплуатации местных жителей в качестве рабочей силы для подобных экспедиций."
 flavor_por.76.a: "Мы дадим денег на эту экспедицию."
 flavor_por.76.a.tt: "Мы профинансируем экспедицию, которая может принести нам огромное богатство или закончиться неудачей"
 flavor_por.76.b: "Мы дадим экспедиции больше, чем они просят."
 flavor_por.76.b.tt: "Мы усилим экспедицию дополнительными средствами, повышая шансы на успех"
 flavor_por.76.c: "Нам это не нужно."
 flavor_por.76.historical_info: "Fernão Dias, also known as the Emerald Hunter, was one of the most renowned #italic Bandeirantes#. He was famous for leading a seven-year expedition into the previously uncharted lands beyond Minas Gerais in search of the legendary Emeralds of Sabarabuçu, a fabled mountain range believed to contain immense mineral wealth. Although his expedition failed in its original goal, Dias extensively mapped uncharted regions, founded new settlements, and helped open routes that eventually led to the discovery of vast gold deposits deeper in the Brazilian interior."
 flavor_por.77.title_success: "The Emerald Hunter"
 flavor_por.77.entry: "$flavor_por.77.title_success$"
 flavor_por.77.trigger_tt: "Фернан Диаш жив"
 flavor_por.77.expedition_tt: "Профинансировал экспедицию Фернана Диаша в событии «$flavor_por.76.entry$»"
 flavor_por.77.desc_success: "После многих лет странствий по глухим лесам [ShowRegionName('brazil_region')] [target_character.GetName] вернулся с повозками, полными сверкающих зелёных самоцветов, каких прежде не видели в наших краях. Полагая, что это и есть легендарные изумруды Сабарабусу, экспедиция увенчалась успехом, превзойдя все ожидания."
 flavor_por.77.a_success: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_por.77.a.entry: "Превосходно!"
 flavor_por.77.title_failure: "Охотник без изумрудов"
 flavor_por.77.desc_failure: "Долгожданная экспедиция [target_character.GetName] наконец вернулась, однако настроение вовсе не победное. Хотя из внутренних земель [ShowRegionName('brazil_region')] и были привезены целые повозки минералов, камни оказались бесполезными, а огромные затраты на предприятие принесли лишь разочарование."
 flavor_por.77.a_failure: "И всё это ради никчёмных камней..."
 flavor_por.79.title: "Воин [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_por.79.entry: "Воин Португалии"
 flavor_por.79.desc: "[target_character.GetName] стремительно поднялся по рядам наших армий. Проявив себя [target_character.GetHerselfHimself] как способный полководец, [target_character.GetHisHer] командование неизменно сопровождается победами. По мере того как слава о [target_character.GetHisHer] подвигах распространяется далеко за пределы поля боя, всё чаще звучат предложения не ограничивать столь выдающийся талант подчинённой должностью."
 flavor_por.79.a: "Возвысить [target_character.GetHimHer] до более высокого командования."
 flavor_por.79.a.entry: "Возвысить его до более высокого командования."
 flavor_por.79.b: "Мы применим [target_character.GetHisHer] опыт иным образом."
 flavor_por.79.b.entry: "Мы применим его опыт иным образом."
 flavor_por.79.historical_info: "Нуну Алвариш Перейра по праву считается одним из величайших средневековых полководцев Португалии. Занимая должность коннетабля Португалии, он сыграл решающую роль в обеспечении португальской независимости во время кризиса 1383–1385 годов, особенно в войне с Кастилией. Его самая знаменитая победа была одержана в битве при Алжубарроте, что обеспечило выживание новообразованного дома Авиш. После военной карьеры он в итоге удалился от мирских дел, приняв монашескую жизнь кармелитского брата."
 flavor_por.80.title: "Изгнание [ShowLawNameWithNoTooltip('society_of_jesus')]"
 flavor_por.80.entry: "Изгнание Общества Иисуса"
 flavor_por.80.desc: "Влияние [ShowLawName('society_of_jesus')] неуклонно растёт и уже вступает в противоречие с интересами [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Их обвиняют во вмешательстве в колониальные дела, подстрекательстве к мятежам и прямом подрыве власти престола."
 flavor_por.80.a: "Изгнать их и конфисковать их имущество."
 flavor_por.80.b: "Мы найдём способ мирно сосуществовать."
 flavor_por.80.historical_info: "К середине XVIII века влияние иезуитов вступило в прямое противоречие с интересами португальской короны. Корона и Орден прежде всего расходились в вопросах колониальной политики. После Гуаранийской войны и последствий дела Тавора Португалия под руководством маркиза де Помбала начала решительные действия против ордена, что привело к его изгнанию из Португалии и всех её владений в 1759 году, а также к конфискации всего его имущества."
 flavor_por.81.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_por.81.entry: "Нуну Гонсалвиш"
 flavor_por.81.desc: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] has recently been presented with some of the works of [target_artist.GetName]. Having found [target_arist.GetHimHer] very skilled and capable, they now suggest that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] should consider commissioning [target_arist.GetHimHer] to produce new works in service of [ROOT.GetCountry.GetName]."
 flavor_por.81.a: "Let us see what [target_arist.GetSheHe] is capable of!"
 flavor_por.81.a.entry: "Посмотрим, на что он способен!"
 flavor_por.81.b: "Let [target_arist.GetHimHer] work independently."
 flavor_por.81.b.entry: "Пусть он работает самостоятельно."
 flavor_por.81.historical_info: "Хотя о его жизни известно очень мало, Нуну Гонсалвиш считается одним из величайших художников средневековой Португалии. Служив придворным живописцем короля Афонсу V, он более всего известен благодаря своей работе над алтарём Святого Викентия — полиптихом, изображающим главные элементы португальского общества XV века."
 flavor_por.1000.title: "Захват «Санта-Катарины»"
 flavor_por.1000.entry: "$flavor_por.1000.title$"
 flavor_por.1000.desc: "Подлые #TOOLTIP:CULTURE,$low_franconian_tt$,X #L нижнефранконские#!#! торговцы захватили один из наших кораблей. Адмирал, который взял наше судно на абордаж, заявляет, что оно находилось в свободных водах, и поэтому он имеет право забрать его себе. Однако наши купцы утверждают, что «Санта-Катарина» стояла в португальских водах, поэтому захват совершенно незаконен. Они настаивают на том, чтобы мы потребовали вернуть и сам корабль, и весь груз, который он перевозил."
 flavor_por.1000.a: "Мы требуем возвращения груза!"
 flavor_por.1000.b: "Не будем заострять вопрос."
 flavor_por.1000.historical_info: "В феврале 1603 года три корабля Голландской Ост-Индской компании захватили у берегов Сингапура португальскую каракку «Санта-Катарина». Её груз стоимостью 2,2 миллиона гульденов удвоил капитал компании, однако законность такого трофея была сомнительной даже с точки зрения голландского права, что вызвало протесты со стороны Португалии. Этот инцидент привёл к эскалации Голландско-португальской войны, длившейся с 1602 по 1663 год."
 flavor_por.1001.title: "Захват «Санта-Катарины»"
 flavor_por.1001.desc: "$flavor_por.5.desc$"
 flavor_por.1001.a: "Груз по праву принадлежит нам!"
 flavor_por.1001.b: "Вернём груз."
 flavor_por.1002.title: "Голландцы оставляют груз себе"
 flavor_por.1002.entry: "$flavor_por.1002.title$"
 flavor_por.1002.desc: "Голландцы отказываются возвращать груз «Санта-Катарины»!"
 flavor_por.1002.a: "Они хотят войны..."
 flavor_por.1003.title: "Голландцы возвращают груз"
 flavor_por.1003.entry: "$flavor_por.1003.title$"
 flavor_por.1003.desc: "Голландцы признали законность наших требований и согласились вернуть груз."
 flavor_por.1003.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_por.1003.a.entry: "$common_string_brilliant$"
 flavor_por.2000.title: "[target_character.GetNameWithNoTooltip] присоединяется к нашему двору"
 flavor_por.2000.entry: "Инеш де Каштру становится придворной"
 flavor_por.2000.desc: "Недавно к нам прибыла #L [target_country.GetAdjective|l]ая#! придворная дама по имени [target_character.GetName]. Она представилась фрейлиной невесты одного из высокопоставленных чиновников #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. В любой другой ситуации эта новость прошла бы мимо нас, однако члены двора заметили, что [target_character2.GetName] буквально не может оторвать глаз от нашей гостьи…"
 flavor_por.2000.a: "Будем надеяться, что это временно."
 flavor_por.2001.title: "Дела сердечные"
 flavor_por.2001.entry: "$flavor_por.2001.title$"
 flavor_por.2001.desc: "По двору расходятся слухи, что наследник #L [ROOT.GetCountry.GetAdjective|l]ого#! престола [target_character2.GetName] и [target_character.GetName] не на шутку влюбились друг в друга. Они постоянно обмениваются любовными письмами и даже устраивают тайные встречи. Этот роман привлекает лишнее внимание к династии [target_character2.GetDynasty.GetName] и серьёзно подрывает её престиж. Несмотря на все наши попытки разлучить пару, им всё равно удаётся поддерживать друг с другом связь."
 flavor_por.2001.a: "В конце концов они наскучат друг другу."
 flavor_por.2002.title: "Влияние династии [target_character.GetDynasty.GetNameWithNoTooltip]"
 flavor_por.2002.desc: "[target_character2.GetName] [Select_CString(target_character2.IsFemale,'попала', 'попал')] в опасную ситуацию: [target_character.GetName] и [Select_CString(target_character.IsFemale,'её', 'его')] родственники из династии [target_character.GetDynasty.GetName] вошли к [Select_CString(target_character2.IsFemale,'ней', 'нему')] в доверие и по сути стали [Select_CString(target_character2.IsFemale,'её', 'его')] ближайшими советниками. Говорят, они подначивают [Select_CString(target_character2.IsFemale,'её', 'его')] заявить о своих претензиях на престол наших соседей, что стало бы для нас настоящей катастрофой. Нельзя позволить, чтобы столь могущественные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] влияли на наши политические решения!"
 flavor_por.2002.a: "Этому нужно положить конец. [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale,'должна', 'должен')] умереть."
 flavor_por.2002.a.entry: "Этому нужно положить конец. Он должен умереть."
 flavor_por.2002.b: "Тут ничего не поделаешь."
 flavor_por.2003.title: "[target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale,'убита', 'убит')]"
 flavor_por.2003.desc: "Получив приказ, наши убийцы проникли в #TOOLTIP:BUILDING_TYPE,monastery,X #L монастырь#!#!, где [Select_CString(target_character.IsFemale,'находилась', 'находился')] [target_character.GetName], и без колебаний убили [Select_CString(target_character.IsFemale,'её', 'его')] прямо на глазах у родственников.\n\nНам неизвестно, как именно [target_character2.GetName] [Select_CString(target_character2.IsFemale,'отреагировала', 'отреагировал')] на эту новость, но одно ясно наверняка: [Select_CString(target_character2.IsFemale,'она', 'он')] знает, кто заказал это убийство, и теперь [Select_CString(target_character2.IsFemale,'ею', 'им')] движет жажда мести."
 flavor_por.2003.a: "Так и должно быть."
 flavor_por.2004.title: "Открытый бунт"
 flavor_por.2004.desc: "Теперь всем стало понятно, какую месть [Select_CString(target_character2.IsFemale,'готовила', 'готовил')] [target_character2.GetName]. [Select_CString(target_character2.IsFemale,'Возмущённая', 'Возмущённый')] поступком своего отца, [Select_CString(target_character2.IsFemale,'она возглавила', 'он возглавил')] восстание, получившее название «[target_rebel.GetName]». Мятежники заявляют, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'превратилась', 'превратился')] в тирана, а потому [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'её', 'его')] необходимо свергнуть. Ситуация явно вышла из-под контроля, и единственный способ решить всё миром — добровольно отречься от престола."
 flavor_por.2004.a: "Этот щенок — ничто против наших армий!"
 flavor_por.2004.b: "Пусть [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] уступит власть."
 flavor_por.2004.b.entry: "Пусть отречётся от престола."
 flavor_por.2005.title: "[target_character.GetNameWithNoTooltip] восходит к вершине"
 flavor_por.2005.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale,'возглавила', 'воглавил')] нашу державу, и теперь [Select_CString(target_character.IsFemale,'она вольна', 'он волен')] делать всё, что пожелает. В первую очередь, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(target_character.IsFemale,'решила', 'решил')] почтить память своей убитой возлюбленной по имени [dead_lover.GetName]. [Select_CString(target_character.IsFemale,'Она организовала', 'Он организовал')] большую траурную процессию от места её захоронения до нового мавзолея, где теперь будет покоиться её тело. Затем она официально [Select_CString(target_character.IsFemale,'сообщила', 'сообщил')], что незадолго до трагедии они успели пожениться, поэтому на момент гибели [dead_lover.GetNameWithNoTooltip] была его законной супругой. На основании этого [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'намерена', 'намерен')] найти убийц и предать их правосудию."
 flavor_por.2005.a: "Ах, какая драма!"
 flavor_por.2006.title: "Правосудие свершилось"
 flavor_por.2006.desc: "[target_character.GetName] наконец [Select_CString(target_character.IsFemale,'добилась', 'добился')] правосудия, и теперь [dead_lover.GetName] официально [Select_CString(dead_lover.IsFemale,'отомщена', 'отомщён')]. После долгих месяцев неустанных поисков [Select_CString(target_character.IsFemale,'ей', 'ему')] всё же удалось поймать убийц и организовать их показательную казнь. После этого палач вырвал из их холодных тел сердца, что символизирует их бессердечные поступки при жизни. Будем надеяться, что это был последний случай подобной жестокости со стороны [Select_CString(target_character.IsFemale,'нашей правительницы', 'нашего правителя')]…"
 flavor_por.2006.a: "Поистине трагическая история."
 flavor_por.2007.title: "Династия [target_character.GetDynasty.GetNameWithNoTooltip]"
 flavor_por.2007.entry: "Влияние Каштру"
 flavor_por.2007.desc: "Наши опасения относительно пагубного влияния династии [target_character.GetDynasty.GetNameWithNoTooltip] подтвердились. Следуя их дурным советам, [target_character2.GetName] самовольно [Select_CString(target_character2.IsFemale,'организовала', 'организовал')] военный поход против наших соседей и [Select_CString(target_character2.IsFemale,'умудрилась', 'умудрился')] попасть в плен. Хотя в итоге [Select_CString(target_character2.IsFemale,'ей', 'ему')] всё же удалось откупиться, эта ситуация нанесла колоссальный ущерб репутации нашей державы."
 flavor_por.2007.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 flavor_por.2007.a.entry: "$common_string_curses$"
 flavor_por.2100.title: "Жест дружелюбия"
 flavor_por.2100.entry: "Письмо персидскому царю"
 flavor_por.2100.desc: "В последнее время у нас довольно натянутые отношения с #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#!. [target_character.GetName] весьма [Select_CString(target_character.IsFemale,'огорчена', 'огорчён')] этой ситуацией и [Select_CString(target_character.IsFemale,'намерена', 'намерен')] её исправить. Возможно, [target_country.GetGovernment.GetRulerTitle|l] [target_character2.GetName] будет более [Select_CString(target_character2.IsFemale,'склонна', 'склонен')] к сотрудничеству, если мы отправим [Select_CString(target_character2.IsFemale,'ей', 'ему')] дружеское письмо на тему #L [ROOT.GetCountry.GetAdjective|l]ой#! истории, культуры и религии."
 flavor_por.2100.historical_info: "В начале XVI века персидский шах Исмаил I искал дружбы с Португалией и даже рассматривал возможность перехода в католичество. Увы, этим планам не суждено было сбыться: шах умер до того, как договор был подписан, положив конец надеждам на союз Португалии и Сефевидов."
 flavor_por.2100.a: "Сделаем для него всё возможное!"
 flavor_por.2100.b: "Пары дружеских писем будет достаточно."
 por_persia_glorify_jesus_tt: "Мы отправим в #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_DAT')|L]#!#! письмо, в котором рассуждаем об #Y Иисусе Христе#!. Возможно, после этого [target_country.GetGovernment.GetRulerTitle|l] проявит интерес к #L [ROOT.GetCountry.GetReligion.GetName|l]ой#! вере."
 flavor_por.2101.title: "Письмо из [prev_country.Custom('CL_GEN')]"
 flavor_por.2101.entry: "Письмо из предыдущей державы"
 flavor_por.2101.desc: "[prev_country.GetGovernment.GetRulerTitle] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! [Select_CString(prev_country.GetGovernment.GetRuler.IsFemale,'отправила', 'отправил')] нам письмо. В нём в основном говорится о величии #L [prev_country.GetAdjectiveWithNoTooltip|l]ой#! культуры, однако [target_character.GetName] также упоминает о своём восхищении личностью и учением Иисуса Христа. В конце письма [Select_CString(target_character.IsFemale,'она', 'он')] выражает надежду на то, что [target_character2.GetName] пришлёт [Select_CString(target_character.IsFemale,'ей', 'ему')] ответ и что их общение положит начало более тёплым и дружеским отношениям между нашими державами."
 flavor_por.2101.historical_info: "$flavor_por.2100.historical_info$"
 flavor_por.2101.a: "Нам стоит завести дружбу с ними."
 flavor_por.2101.b: "Хвалить себя, а не нас? Что за насмешка?"
 flavor_por.2101.c: "Знаете, возможно, этот Иисус и правда был истинным пророком."
 flavor_por.2200.title: "Налаживание торговли в Японии"
 flavor_por.2200.entry: "Налаживание торговли в Японии"
 flavor_por.2200.desc: "С тех пор как мы открыли #TOOLTIP:REGION,japan_region,X #L японские острова#!#!, наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] непрерывно говорят о желании основать там торговый аванпост. Возможно, если мы сделаем выгодное предложение, [target_character2.GetName] позволит нам создать в #TOOLTIP:CONTINENT,asia,X #L Азии#!#! полноценную торговую сеть."
 flavor_por.2200.a: "Стоит попробовать."
 flavor_por.2200.b: "Проще будет захватить [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]."
 flavor_por.2200.b.entry: "Вот почему следует завоевать [ShowLocationNameWithNoTooltip('kumage_oosumi')]."
 por_nanban_owner_must_accept_tt: "Эффекты не будут действовать, пока владелец [target_location.Custom('LR_ACC')|l] [target_location.GetName] не примет наше предложение"
 flavor_por.2201.title: "[prev_country.GetNameWithNoTooltip] делает нам предложение"
 flavor_por.2201.desc: "[prev_country.GetGovernment.GetRulerTitle] #ONCLICK:COUNTRY,[prev_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[prev_country.Custom('CL_tt')],X [prev_country.Custom('CL_GEN')|L]#!#! предложил нам большую сумму золота в обмен на право пользования портом в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Хотя нам бы не помешали лишние средства, подобная сделка наверняка приведёт к ослаблению нашего торгового влияния в #TOOLTIP:REGION,japan_region,X #L Японии#!#! и сделает нашу державу более #TOOLTIP:SOCIETAL_VALUE,outward_vs_inward,X #L открытой#!#! для иностранцев."
 flavor_por.2201.a: "Мы с радостью возьмём золото."
 flavor_por.2201.b: "Этим подлым чужеземцам нельзя доверять."
 flavor_por.2201.b.entry: "Этим подлым чужеземцам нельзя верить."
 flavor_por.17.concern_daughter: "Если дочь [ROOT.GetCountry.GetGovernment.GetRuler.GetName] наследует [ROOT.GetCountry.GetGovernment.GetRuler.GetHimHer], она рискует стать лишь марионеткой в руках мужа, который вместо неё станет править [ROOT.GetCountry.GetName]."
 flavor_por.17.concern_fallback: "Поскольку наследника нет и в помине, честолюбивые претенденты уже собирают сторонников, каждый отстаивая своё право на престол."
 flavor_por.17.concern_queen: "Хотя престол уже занят [ROOT.GetCountry.GetGovernment.GetRuler.GetName], многие боятся, что [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] власть будет оспорена соперником, отстаивающим более веское право силой меча."
 flavor_por.17.exclusion_daughter: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] предлагают изменить закон о наследовании, чтобы лишить [heir.GetName] права на корону. Они объединились в стремлении возвести на престол незаконнорождённого сводного брата и дворянина [john_avis.GetName], чтобы он занял [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] место, если [ROOT.GetCountry.GetGovernment.GetRulerTitle] не произведёт на свет наследника мужского пола."
 flavor_por.17.exclusion_fallback: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] предлагают официально запретить женщинам наследовать корону. Они объединились в стремлении возвести на престол незаконнорождённого сводного брата и дворянина [john_avis.GetName], доверяя его праву больше, чем праву любого наследника по женской линии."
 flavor_por.17.tt3_no_heir: "Женщины будут навсегда исключены из линии наследования"
