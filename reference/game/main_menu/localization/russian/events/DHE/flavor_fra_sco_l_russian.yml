l_russian:
 flavor_fra_sco.101.title: "[GetCountry('SCO').GetAdjectiveWithNoTooltip]ий король в изгнании"
 flavor_fra_sco.101.entry: "Шотландский король в изгнании"
 flavor_fra_sco.101.desc: "Со времён заключения Старого союза в 1295 году [GetCountry('SCO').GetName] и [GetCountry('FRA').GetName] поддерживали хорошие отношения. Именно поэтому, потерпев поражение в битве при Халидон-Хилле в 1333 году, [GetCharacter('sco_david_ii').GetName] и его ближайшие советники решили бежать на территорию [GetCountry('FRA').Custom('CL_GEN')], где [GetCharacter('fra_philip_vi_valois').GetName] любезно [Select_CString(GetCharacter('fra_philip_vi_valois').IsFemale, 'предоставила', 'предоставил' )] им убежище. С тех пор [GetCharacter('sco_edward_balliol').GetShortName], претендент на шотландский престол, заручился поддержкой #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#!, чтобы расправиться со сторонниками Давида и заполучить власть.\n\nЕсли [GetCountry('SBL').Custom('CL_DAT')] удастся достичь своей цели, то королевство снова окажется под влиянием [GetCountry('ENG').Custom('CL_GEN')], и единственный способ предотвратить такой исход — добиться того, чтобы [GetCharacter('sco_david_ii').GetShortNameWithNoTooltip] и его [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ие единомышленники получили поддержку."
 flavor_fra_sco.101.b: "[GetCharacter('sco_david_ii').GetNameWithNoTooltip] получит от нас все необходимые ресурсы."
 flavor_fra_sco.101.b.entry: "$name_david$ $Bruce$ получит от нас все необходимые ресурсы."
 flavor_fra_sco.101.a: "[GetCharacter('sco_david_ii').GetNameWithNoTooltip] и его люди получат от нас поддержку — мы встанем на их сторону."
 flavor_fra_sco.101.a.entry: "$name_david$ $Bruce$ и его люди получат от нас поддержку."
 flavor_fra_sco.101.c: "Борьба уже проиграна. [GetCharacter('sco_david_ii').GetNameWithNoTooltip] [Select_CString(GetCharacter('sco_david_ii').IsFemale, 'должна', 'должен' )] вернуться на родину."
 flavor_fra_sco.101.c.entry: "Шотландия потеряна, $name_david$ $Bruce$ должен вернуться."
 flavor_fra_sco.101.d: "[GetCharacter('sco_david_ii').GetNameWithNoTooltip] будет [Select_CString(GetCharacter('sco_david_ii').IsFemale, 'возвращена', 'возвращён' )] своим соперникам, чтобы помочь им в борьбе за престол."
 flavor_fra_sco.101.d.entry: "$name_david$ $Bruce$ станет той поддержкой, которую получит $name_edward$."
 flavor_fra_sco.102.title: "[GetCharacter('sco_david_ii').GetNameWithNoTooltip] достиг совершеннолетия"
 flavor_fra_sco.102.entry: "Давид II достиг совершеннолетия"
 flavor_fra_sco.102.ballioldefeated.desc: "В течение последних нескольких лет [GetCharacter('sco_david_ii').GetName] был почётным гостем при нашем дворе, где смог получить образование, достойное [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ого принца. Теперь же, достигнув совершеннолетия, король заявил о своём намерении вернуться в родные земли #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#! и занять престол, но заверил, что он не останется перед нами в долгу за оказанную помощь. Перед отъездом он попросил нас о последней услуге, а именно — предоставить ему нескольких [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]их советников, которые помогут обеспечить порядок и стабильность во время его правления."
 flavor_fra_sco.102.warongoing.desc: "В течение последних нескольких лет [GetCharacter('sco_david_ii').GetName] был почётным гостем при нашем дворе, где он смог получить образование, достойное [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ого принца. Теперь же, достигнув совершеннолетия, король заявил о своём намерении вернуться в родные земли #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#! и расправиться с #L [GetCountry('SBL').GetAdjective|l]ими#! мятежниками, но заверил, что он не останется перед нами в долгу за оказанную помощь. Перед отъездом он попросил нас о последней услуге, а именно — предоставить ему небольшое войско, которое поможет ему разбить врага и вернуть себе [GetCountry('SCO').GetAdjectiveWithNoTooltip|l]ий престол."
 flavor_fra_sco.102.a: "[GetCharacter('sco_david_ii').GetShortNameWithNoTooltip] может на нас рассчитывать."
 flavor_fra_sco.102.a.entry: "$name_david$ может на нас рассчитывать."
 flavor_fra_sco.102.b: "Мы отберём для этой задачи лучших солдат."
 flavor_fra_sco.102.b.entry: "Мы отберём для этой задачи лучших бойцов."
 flavor_fra_sco.102.c: "Мы сделали всё, что могли. Дальше [GetCharacter('sco_david_ii').GetShortNameWithNoTooltip] должен справиться сам."
 flavor_fra_sco.102.c.entry: "Мы сделали всё, что могли. Дальше $name_david$ должен справиться сам."
 flavor_fra_sco.102.d: "Пусть возьмёт с собой отряд ополченцев."
 flavor_fra_sco.102.e: "Мы сделали всё, что могли. Дальше [GetCharacter('sco_david_ii').GetShortNameWithNoTooltip] должен справиться сам."
 flavor_fra_sco.102.e.entry: "Мы сделали всё, что могли. Дальше $name_david$ должен справиться сам."
 variable_scotland_did_not_extend_regency_tt: "Шотландия не продлила регентство"
 variable_fra_asylum_for_david_II_tt: "Франция предоставила убежище Давиду II"
 flavor_fra_sco.103.title: "Французы предлагают выдать Давида II"
 flavor_fra_sco.103.desc: "К нашему двору неожиданно прибыла [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ая делегация, а вместе с ней — претендующий на #L [GetCountry('SCO').GetAdjective|l]ий#! престол [GetCharacter('sco_david_ii').GetName]. После битвы при Халидон-Хилле [GetCharacter('sco_david_ii').GetNameWithNoTooltip|l] бежал [GetCountry('FRA').Custom('predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_ACC')|L]#!#!, и с тех пор французские послы многократно пытались заключить с нами хоть какую-то сделку, но безуспешно. В этот же раз французы выдвинули действительно интересное предложение: они готовы признать, что [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip|l] является [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'законной правительницей', 'законным правителем')] #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!, если [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'она', 'он')] прекратит поддержку #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! и встанет на сторону [GetCountry('FRA').Custom('CL_GEN')]. В обмен на это они согласны, чтобы [GetCharacter('sco_david_ii').GetNameWithNoTooltip|l] оказался у нас. Если мы примем это предложение, его сторонники наверняка потеряют мотивацию сражаться и будут вынуждены сложить оружие."
 flavor_fra_sco.103.a: "Пожалуй, сотрудничество [GetCountry('FRA').Custom('end_predlog_sso')] [GetCountry('FRA').Custom('CL_INST')] нам выгоднее, чем [GetCountry('ENG').Custom('end_predlog_sso')] [GetCountry('ENG').Custom('CL_INST')]."
 flavor_fra_sco.103.a.entry: "Пожалуй, сотрудничество с французами нам выгоднее."
 flavor_fra_sco.103.b: "Откажемся от сделки, но отпустим послов."
 flavor_fra_sco.103.c: "Казнить всех!"
 flavor_fra_sco.103.c.entry: "Казнить всех!"
 flavor_fra_sco.104.title: "[GetCountry('SBL').GetNameWithNoTooltip] соглашается на сделку"
 flavor_fra_sco.104.desc: "Наши дипломаты вернулись с хорошими вестями: [GetCountry('SBL').GetGovernment.GetRuler.GetName|l] с радостью принял наше предложение. Поскольку [GetCharacter('sco_david_ii').GetName] теперь фактически находится в заложниках, многие его сторонники будут вынуждены сдаться, что значительно облегчит задачу Баллиола и поможет ему занять #L [GetCountry('SBL').GetAdjective|l]ий#! престол."
 flavor_fra_sco.104.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_fra_sco.104.a.entry: "$common_string_brilliant$"
 flavor_fra_sco.105.title: "[GetCountry('SBL').GetNameWithNoTooltip] отказывается от сделки"
 flavor_fra_sco.105.balliol_refuses.desc: "Наши дипломаты вернулись ни с чем: переговоры зашли в тупик, и [GetCountry('SBL').GetGovernment.GetRuler.GetName|l] отверг наше предложение. Несмотря на нашу готовность выдать его соперника, власти [GetCountry('SBL').Custom('CL_GEN')] не согласились разорвать связи с властями #ONCLICK:COUNTRY,[GetCountry('ENG').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ENG').Custom('CL_tt')],X [GetCountry(GetCountry('ENG').Custom('CL_GEN')|L]#!#! и перейти на сторону #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!. При этом сам [GetCharacter('sco_david_ii').GetName] и его советники пришли в ярость из-за нашего поступка, поэтому отказались возвращаться и остались на территории #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!."
 flavor_fra_sco.105.balliol_executes_delegation.desc: "Наша дипломатическая миссия с треском провалилась: [GetCountry('SBL').GetGovernment.GetRuler.GetName|l] отверг наше предложение, после чего [GetCharacter('sco_david_ii').GetName] и большинство послов были преданы казни. Более того, советники убитого короля, доселе находившиеся при [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ом дворе, пришли в ярость от нашего поступка. Они решили вернуться на территорию #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#! и заявили, что Старый союз можно считать расторгнутым."
 flavor_fra_sco.105.a: "Это настоящая катастрофа!"
 flavor_fra_sco.106.title: "Власти [GetCountry('SBL').Custom('CL_GEN')] берут Давида II в заложники"
 flavor_fra_sco.106.desc: "[GetCharacter('sco_david_ii').GetName] попал в плен к узурпаторам! Он и его верные советники, находившиеся во #L [GetCountry('FRA').GetAdjective|l]ом#! изгнании, согласились принять участие в мирных переговорах, но вместо этого французы воспользовались их доверием и просто выдали Давида нашему врагу. Похоже, #ONCLICK:COUNTRY,[GetCountry('SBL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SBL').Custom('CL_tt')],X [GetCountry('SBL').Custom('CL_GEN')|L]#!#! удалось заключить с ними какую-то сделку, и теперь они решили помочь этой державе в борьбе за престол."
 flavor_fra_sco.106.a: "Мы одержим победу над [GetCountry('SBL').Custom('CL_INST')] и без поддержки [GetCountry('FRA').Custom('CL_GEN')]."
 flavor_fra_sco.106.a.entry: "Мы одержим победу и без поддержки французов."
 flavor_fra_sco.107.title: "Власти [GetCountry('SBL').Custom('CL_GEN')] казнят Давида II"
 flavor_fra_sco.107.desc: "Произошла чудовищная трагедия! [GetCountry('SBL').GetName] и [GetCountry('SCO').GetName] согласились провести мирные переговоры при посредничестве #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!, но по прибытии наша делегация оказалась в западне: [GetCountry('SBL').GetGovernment.GetRuler.GetName|l] [Select_CString(GetCountry('SBL').GetGovernment.GetRuler.IsFemale,'воспользовалась', 'воспользовался')] случаем, приказав казнить Давида и большинство послов. Теперь [target_regent.GetName] будет править в качестве регента, пока мы не изберём нового короля. Однако, кто бы ни стал новым правителем нашей державы, [GetCountry('SBL').GetGovernment.GetRuler.GetNameWithNoTooltip|l] должен ответить за своё вероломство…"
 flavor_fra_sco.107.a: "Власти [GetCountry('SBL').Custom('CL_GEN')] пожалеют о содеянном!"
 flavor_fra_sco.107.a.entry: "Они заплатят за это!"
 flavor_fra_sco.108.title: "Власти [GetCountry('FRA').Custom('CL_GEN')] оказывают поддержку"
 flavor_fra_sco.108.desc: "Под защитой [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ой короны [GetCharacter('sco_david_ii').GetName] и его ближайшие советники находятся в безопасности. В знак приверженности нашему союзу французы также прислали дополнительные средства, которые непременно помогут нам в борьбе за власть."
 flavor_fra_sco.108.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_fra_sco.108.a.entry: "$common_string_brilliant$"
 flavor_fra_sco.109.title: "Власти [GetCountry('FRA').Custom('CL_GEN')] выдворяют Давида II"
 flavor_fra_sco.109.desc: "Бежав из #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! после битвы при Халидон-Хилле в 1333 году, [GetCharacter('sco_david_ii').GetName] запросил убежище при [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ом дворе. Изначально он должен был оставаться на территории #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! до окончания конфликта, но недавно он и его советники по неизвестным причинам вернулись на родину. По всей видимости, власти [GetCountry('FRA').Custom('CL_GEN')] потеряли всякий интерес к внутренним [GetCountry('SCO').GetAdjectiveWithNoTooltip|l]им распрям."
 flavor_fra_sco.109.desc_b: "Бежав из #ONCLICK:COUNTRY,[GetCountry('SCO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SCO').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! после битвы при Халидон-Хилле в 1333 году, [GetCharacter('sco_david_ii').GetName] запросил убежище при [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ом дворе. Изначально он должен был оставаться на территории #ONCLICK:COUNTRY,[GetCountry('FRA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('FRA').Custom('CL_tt')],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! до окончания конфликта, но недавно он и его советники вернулись на родину для проведения мирных переговоров. Стремясь заключить долгожданную сделку после ряда неудачных попыток, [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ая сторона предложила выдать Давида в качестве заложника, однако его сторонники выступили резко против этой идеи и прекратили диалог. Несмотря на вражду, власти #ONCLICK:COUNTRY,[GetCountry('SBL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SBL').Custom('CL_tt')],X [GetCountry('SBL').Custom('CL_GEN')|L]#!#! позволили [GetCountry('SCO').GetAdjectiveWithNoTooltip|l]ой делегации покинуть встречу невредимой."
 flavor_fra_sco.109.a: "Похоже, Старый союз развалился."
 flavor_fra_sco.109.b: "Как [GetCountry('FRA').GetNameWithNoTooltip] посмел[GetCountry('FRA').Custom('end_fem')] так обращаться с нашим королём?!"
 flavor_fra_sco.109.b.entry: "Как французы посмели так обращаться с нашим королём?!"
 flavor_fra_sco.110.title: "[GetCountry('SBL').GetGovernment.GetRuler.GetNameWithNoTooltip] одержал победу"
 flavor_fra_sco.110.entry: "Баллиол побеждает в Шотландии"
 flavor_fra_sco.110.a: "Нам пригодится такой союзник, как [GetCountry('SBL').GetGovernment.GetRuler.GetNameWithNoTooltip|l]."
 flavor_fra_sco.110.a.entry: "Нам пригодится такой союзник."
 flavor_fra_sco.110.desc: "Благодаря нашей поддержке [GetCountry('SBL').GetGovernment.GetRuler.GetName|l] одолел лоялистов и взошёл на #L [GetCountry('SCO').GetAdjective|l]ий#! престол. При этом ранее мы договорились, что в случае успеха заключим союз между нашими державами."
 variable_balliol_accepts_fra_backing_tt: "Эдуард Баллиол принял помощь от французов"
 flavor_fra_sco.111.title: "[GetCountry('SBL').GetGovernment.GetRuler.GetShortNameWithNoTooltip] одержал победу"
 flavor_fra_sco.111.a: "В будущем власти [GetCountry('FRA').Custom('CL_GEN')] могут оказаться ценными союзниками."
 flavor_fra_sco.111.a.entry: "В будущем Франция станет ценным союзником."
 flavor_fra_sco.111.desc: "[GetCountry('SBL').GetGovernment.GetRuler.GetName] сокрушил своих врагов, тем самым положив конец #L [GetCountry('SCO').GetAdjective|l]ой#! гражданской войне и объединив королевство под своей властью. Теперь, придерживаясь прежней договорённости, [GetCountry('FRA').GetName] предлагает заключить союз между нашими державами."
 #Tooltips
 lord_balliol_recieves_david_ii_tt: "[david_ii_bruce.GetNameWithNoTooltip] и его советники будут переданы Баллиолу, чтобы убедить его встать на нашу сторону"
 fra_grant_sco_large_levy_tt: "В столице [GetCountry('SCO').Custom('CL_GEN')] появится армия из 2500 феодальных ополчений"
 fra_grant_sco_footmen_regiments_tt: "В столице [GetCountry('FRA').Custom('CL_GEN')] появится армия из 1000 пехотных отрядов"
 fra_one_french_advisors_for_david_tt: "[GetCountry('FRA').GetAdjectiveWithNoTooltip]ая корона предоставит [GetCountry('SCO').Custom('CL_DAT')] одного опытного советника"
 fra_two_french_advisors_for_david_tt: "[GetCountry('FRA').GetAdjectiveWithNoTooltip]ая корона предоставит [GetCountry('SCO').Custom('CL_DAT')] двух опытных советников"
 fra_three_french_advisors_for_david_tt: "[GetCountry('FRA').GetAdjectiveWithNoTooltip]ая корона предоставит [GetCountry('SCO').Custom('CL_DAT')] трёх опытных советников"
 sco_fra_court_education_of_david_II_tt: "Находясь при [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ом дворе, [david_ii_bruce.GetNameWithNoTooltip] получит отличное образование!"
 sco_will_be_angry_for_using_david_tt: "Если Баллиол откажется от сделки, [GetCountry('SCO').GetAdjectiveWithNoTooltip|l]ие дворяне будут крайне недовольны тем, что мы пытались отдать их короля в плен"
