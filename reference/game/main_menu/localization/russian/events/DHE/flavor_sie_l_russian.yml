l_russian:
 unlocked_advance_marble_tradition_tt: "Пройдено [Concept('dynamic_historical_event', 'динамическое историческое событие')|e] «$flavor_sie.1.title$»"
 flavor_sie.1.title: "Банк Монте дей Паски"
 flavor_sie.1.entry: "$flavor_sie.1.title$"
 flavor_sie.1.desc: "#italic Монти ди пьета#!, или «банки милосердия», становятся всё более частым явлением в нашей державе. Это благотворительные финансовые организации, которые получают деньги с пожертвований и выдают малоимущим ссуды под низкий процент. Возможно, правительству стоит выделить средства на создание подобного учреждения в [monte_paschi_bank_hq.Custom('LR_PREP')|l] [monte_paschi_bank_hq.GetName]. Фактически оно будет служить национальным банком нашей державы и способствовать повышению благосостояния нашего народа."
 flavor_sie.1.a: "Это поможет нам наполнить казну."
 flavor_sie.1.b: "Воистину, это богоугодное дело!"
 flavor_sie.1.historical_info: "#italic Банк Монте дей Паски ди Сиена#!, основанный в Сиенской республике в 1472 году, считается старейшим из банков, действующих до сих пор. Изначально он был создан как некоммерческий ломбард, а свой статус современного банка приобрёл лишь после присоединения к Великому герцогству Тосканскому в 1624 году. После объединения Италии его деятельность распространилась на весь Апеннинский полуостров."
 flavor_sie.2.title: "$flavor_sie.1.title$"
 flavor_sie.2.desc: "Банки милосердия являются своего рода благотворительными организациями, которые стараются помогать бедным слоям населения. Впрочем, гуманитарный характер этих банков вовсе не запрещает нам извлекать прибыль из этой деятельности…"
 flavor_sie.2.a: "Они будут нашими!"
 flavor_sie.3.entry: "$flavor_sie.3.title$"
 flavor_sie.3.title: "Золотой век Сиены"
 flavor_sie.3.desc: "Годы мира и процветания наряду с расширением #L [ROOT.GetCountry.GetAdjective|l]их#! границ привели к тому, что в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#! [target_location.GetName] наступил самый настоящий золотой век. Местные жители находят время и для усердного труда, и для отдыха, а потому живут в богатстве и процветании. Иными словами, дела здесь идут крайне хорошо, и местные жители уверены, что эта идиллия будет длиться вечно."
 flavor_sie.3.a: "Наш золотой век никогда не закончится!"
 sie_gain_modifier_until_the_black_death: "[ShowLocationName('siena')] получит [Concept('location_modifier', 'модификатор')|e] #TOOLTIP:STATIC_MODIFIER,sie_golden_age_of_siena,X $tt_op_V$$tt_op_L$«Золотой век Сиены»$tt_cl_3$, который будет действовать до начала [Concept('situation', 'ситуации')|e] «[ShowSituationNameWithNoTooltip('black_death')]»"
 flavor_sie.4.entry: "$flavor_sie.4.title$"
 flavor_sie.4.title: "Восстановление после чёрной смерти"
 flavor_sie.4.desc: "Чума, прошедшая по #TOOLTIP:REGION,italy_region,X #L Италии#!#! и другим странам #TOOLTIP:CONTINENT,europe,X #L Европы#!#!, нанесла [target_location.Custom('LR_DAT')|l] [target_location.GetName] непоправимый ущерб. Теперь его некогда шумные улицы пустуют, напоминая о том, что и грешники, и праведники равны перед лицом смерти. Впрочем, вместо того чтобы унывать, мы можем помочь оставшимся местным жителям снова встать на ноги."
 flavor_sie.4.a: "Мы выделим казённые средства на восстановление [target_location.Custom('LR_GEN')|l]."
 flavor_sie.4.a.entry: "Мы выделим казённые средства на восстановление этого района."
 sie_all_pops_lose_satisfaction: "Все [Concept('pops', 'группы населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] получат [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 flavor_sie.4.b: "Это вечный круговорот жизни и смерти. Из него нет выхода."
 flavor_sie.5.entry: "$flavor_sie.5.title$"
 flavor_sie.5.title: "Основание порта в Гроссето"
 flavor_sie.5.desc: "Сейчас наше присутствие на побережье #TOOLTIP:REGION,italy_region,X #L Италии#!#! весьма небольшое. Несмотря на это, многие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] призывают правительство #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! расширить флот и уверяют, что недавно приобретённый нами [target_location.GetRank.GetName|l] [target_location.GetName] отлично подходит для строительства нового порта.\n\nМногие граждане [ROOT.GetCountry.Custom('rank_ru_GEN')|l] переехали сюда в надежде на то, что мы заметим потенциал этого [target_location.Custom('LR_GEN')|l] и вложим средства в развитие его морской инфраструктуры."
 flavor_sie.5.a: "Новый порт поможет нам наладить морскую торговлю."
 flavor_sie.5.b: "Лучше сосредоточимся на наших сухопутных границах."
 flavor_sie.6.entry: "$flavor_sie.6.title$"
 flavor_sie.6.title: "Морское влияние в Питильяно"
 flavor_sie.6.desc: "Наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] уже давно пытаются конкурировать с морскими купцами из других #TOOLTIP:REGION,italy_region,X #L итальянских#!#! держав, но у них нет для этого необходимой инфраструктуры. Прежде всего им не хватает портов на рынке #L #TOOLTIP:LOCATIONRANK,[target_location.GetMarket.GetCenterLocation.Custom('LR_tt')],X [target_location.GetMarket.GetCenterLocation.Custom('LR_GEN')|l]#!#! [target_location.GetMarket.GetShortName], однако у них на примете есть и другие районы.\n\nВ частности, многие наши [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] обратили внимание на перспективный #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName]. Они считают, что нам стоит расширить местный порт и превратить его в полноценный торговый узел, доступный всем купцам."
 flavor_sie.6.a: "Это выгодное вложение."
 flavor_sie.6.b: "Мы не будем тратить средства лишь потому, что так хотят [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l]."
 flavor_sie.6.b.entry: "Мы не будем тратить средства лишь потому, что так хотят богачи."
 flavor_sie.7.entry: "$flavor_sie.7.title$"
 flavor_sie.7.title: "Порт Пьомбино"
 flavor_sie.7.desc: "Купцы, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] массово переезжают в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName], которому наш двор уделяет особое внимание.\n\nПонимая, что расширение местного порта позволит нам нарастить морскую торговлю, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] обратились к правительству с просьбой выделить средства на развитие этого района. Они твёрдо убеждены, что при правильном подходе этот [target_location.GetNameWithNoTooltip] может стать одним из самых богатых и привлекательных во всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!."
 flavor_sie.7.a: "Развитие этого порта положительно скажется на нашей торговле."
 flavor_sie.7.b: "Нам не нужен ещё один крупный порт."
 flavor_sie.8.entry: "$flavor_sie.8.title$"
 flavor_sie.8.title: "Возвращение из изгнания"
 flavor_sie.8.desc: "Многие влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] участвуют в #L [ROOT.GetCountry.GetAdjective|l]ой#! политике, но никому из них не удавалось обрести даже малую часть той власти, которую обрело семейство [GetDynasty('petrucci').GetName]. По крайней мере, так было до тех пор, пока всех его членов не изгнали из-за обвинений в подготовке переворота.\n\nВпрочем, несмотря на запятнанную репутацию, [Select_CString(target_character.IsFemale, 'одна представительница', 'один представитель' )] этого рода всё же [Select_CString(target_character.IsFemale, 'осмелилась', 'осмелился' )] вернуться на родину своих предков, в легендарный #L #TOOLTIP:LOCATIONRANK,[target_capital.Custom('LR_tt')],X [target_capital.Custom('LR_ACC')|l]#!#! [target_capital.GetName]. Местные простолюдины с радостью встретили [Select_CString(target_character.IsFemale, 'её', 'его' )] и выразили надежду, что [Select_CString(target_character.IsFemale, 'она', 'он' )] наконец заберёт себе власть, которую оккупировали коррумпированные [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]. Разумеется, есть и те, кто видит в [Select_CString(target_character.IsFemale, 'этой женщине', 'этом мужчине' )] угрозу сложившемуся порядку. Они требуют, чтобы правительство как можно скорее изгнало [Select_CString(target_character.IsFemale, 'её', 'его' )], пока [Select_CString(target_character.IsFemale, 'она не попыталась', 'он не попытался' )] устроить очередной переворот."
 flavor_sie.8.a: "Один влиятельный человек для нас не угроза."
 flavor_sie.8.b: "Есть много прекрасных способов приструнить выскочек…"
 flavor_sie.8.c: "Эту семью изгнали не просто так."
 sie_triumphant_return_means_possibility_of_coup: "Вернувшись [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! и став [Select_CString(target_character.IsFemale, 'правительницей', 'правителем' )], [target_character.GetName] постарается сосредоточить власть в своих руках."
 flavor_sie.9.entry: "$flavor_sie.9.title$"
 flavor_sie.9.title: "Приход к власти"
 flavor_sie.9.desc: "Много лет назад [ROOT.GetCountry.GetLongName] был[ROOT.GetCountry.Custom('endlong_fem')] поделен[ROOT.GetCountry.Custom('endlong_enna')] между семьями, которые занимали разные должности. Но когда к власти [Select_CString(target_character.IsFemale, 'пришла', 'пришёл' )] [target_character.GetName], многие из этих должностей оказались заняты лоялистами — [Select_CString(target_character.IsFemale, 'её', 'его' )] приближёнными и членами династий, полностью поддержавших смещение баланса сил.\n\nНа собрании [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не решается возражать: у [Select_CString(target_character.IsFemale, 'правительницы', 'правителя' )] достаточно влияния, чтобы усмирить любого политического оппонента.\n\nТакой уровень контроля над [ROOT.GetCountry.Custom('rank_ru_INST')|l] приводит к тому, что династия [target_character.GetDynasty.GetName] укрепляет свои позиции в стране."
 flavor_sie.9.a: "Одна династия будет править всеми."
 flavor_sie.10.entry: "$flavor_sie.10.title$"
 flavor_sie.10.title: "Художественный стиль Сиены"
 flavor_sie.10.desc: "В эпоху #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#! на территории #TOOLTIP:REGION,italy_region,X #L Италии#!#! появилось множество художественных направлений. Одним из самых примечательных стал #L [ROOT.GetCountry.GetAdjective|l]ий#! стиль. Его религиозно-мистическая направленность резко контрастирует с гуманистическими и экспрессионистскими традициями #TOOLTIP:LOCATION,florence,X #L Флоренции#!#!. [ROOT.GetCountry.GetGovernment.GetCourtTitle] считает, что этот стиль послужит распространению нашей культуры в #TOOLTIP:CONTINENT,europe,X #L Европе#!#! и повысит наш престиж."
 flavor_sie.10.a: "Сиена станет самым престижным городом!"
 flavor_sie.10.b: "У нас нет средств на подобные проекты."
 flavor_sie.11.entry: "$flavor_sie.11.title$"
 flavor_sie.11.title: "Расширение сиенской школы живописи"
 flavor_sie.11.desc: "В разгар эпохи #TOOLTIP:INSTITUTION,renaissance,X #L Возрождения#!#! культурное самосознание #TOOLTIP:REGION,italy_region,X #L Италии#!#! полностью преобразилось, и во многих городах стали развиваться самобытные художественные направления. Однако #L [ROOT.GetCountry.GetAdjective|l]ая#! традиция, к счастью, не канула в Лету. Напротив, появляется всё больше творцов, которые желают работать в нашем стиле.\n\nВ их числе — [target_character.GetName]. [Select_CString(target_character.IsFemale, 'Она', 'Он' )] стремится привнести больше духовности в эстетику #TOOLTIP:LOCATION,siena,X #L Сиены#!#!."
 flavor_sie.11.a: "Нам нужны такие творцы, как [Select_CString(target_character.IsFemale,'она', 'он')]."
 flavor_sie.11.a.entry: "Нам нужны новые творцы."
 flavor_sie.11.b: "Лучше не цепляться за старое, а черпать вдохновение в других стилях."
 flavor_sie.12.entry: "$flavor_sie.12.title$"
 flavor_sie.12.title: "Сиенская святость"
 flavor_sie.12.desc: "[target_character.GetName] чрезвычайно [Select_CString(target_character.IsFemale,'набожна', 'набожен')], и [target_character.GetReligion.GetGodName] играет в [Select_CString(target_character.IsFemale,'её', 'его')] жизни первостепенную роль. Многие жители #TOOLTIP:LOCATION,siena,X #L Сиены#!#! считают [Select_CString(target_character.IsFemale,'её самой ревностной верующей', 'его самым ревностным верующим')] после папы римского.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] не может не замечать [Select_CString(target_character.IsFemale,'её', 'его')] пыла и любви к богословию. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] считают, что [Select_CString(target_character.IsFemale,'она', 'он')] подаёт пример нашего благочестия всему #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ому#! миру, а [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] относятся к [Select_CString(target_character.IsFemale,'ней', 'нему')] как к [Select_CString(target_character.IsFemale,'святой, которая способна', 'святому, который способен')] даровать им процветание."
 flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_sie.12.a.entry: "Прекрасно!"
