l_russian:
 flavor_mll.1.title: "Напряжённые отношения [target_country.Custom('end_predlog_sso')] [target_country.Custom('CL_INST')]"
 flavor_mll.1.entry: "Напряжённые отношения с Арагоном"
 flavor_mll.1.desc: "С тех пор как [Select_CString(GetCharacter('ara_jacme_i_arago').IsFemale, 'скончалась', 'скончался' )] [GetCharacter('ara_jacme_i_arago').GetName], [ROOT.GetCountry.GetLongName] и [target_country.GetLongName] неизменно сохраняли добрососедские отношения, при этом [ROOT.GetCountry.GetNameWithNoTooltip] признавал[ROOT.GetCountry.Custom('end_fem')] [target_country.GetAdjectiveWithNoTooltip|l]ий сюзеренитет. Всё изменилось, когда к власти [Select_CString(our_ruler.IsFemale, 'пришла', 'пришёл' )] [our_ruler.GetName]. Считая, что [Select_CString(our_ruler.IsFemale, 'она', 'он' )] и [ara_ruler.GetName] равны по статусу, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'объявила', 'объявил' )], что не станет подчиняться другому монарху. Излишне говорить, что [target_country.GetCapital.GetName] не в восторге от этого заявления.\n\nДо сих пор [target_country.GetNameWithNoTooltip] не предпринимал[target_country.Custom('end_fem')] враждебных действий против [ROOT.GetCountry.Custom('CL_GEN')], однако многие при [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ом дворе опасаются, что своими резкими заявлениями [our_ruler.GetNameWithNoTooltip] даст [target_country.GetAdjectiveWithNoTooltip|l]им властям повод аннексировать страну."
 flavor_mll.1.a: "Мы должны соблюдать предельную осторожность."
 repair_or_damage_relations_with_aragon_tt: "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! до #G +190#!, это позволит сгладить конфликт с [target_country.GetAdjectiveWithNoTooltip|l]им двором. В противном случае нам стоит готовиться к окончательному разрыву [target_country.Custom('end_predlog_sso')] [target_country.Custom('CL_INST')]."
 flavor_mll.2.title: "Последствия [target_country_1.GetAdjectiveWithNoTooltip|l]ого конфликта"
 flavor_mll.2.entry: "Последствия конфликта с Генуей"
 flavor_mll.2.desc: "Недавнее противостояние между #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[target_country_1.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_1.Custom('CL_tt')],X [target_country_1.Custom('CL_INST')|L]#!#! обернулось экономической катастрофой для [ROOT.GetCountry.Custom('longname_ru_GEN')]. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] возмущены тем, что [target_country.GetAdjectiveWithNoTooltip|l]ие власти конфисковали их корабли для ведения кампании в #TOOLTIP:AREA,sardinia_area,X #L Сардинии#!#!. Этот конфликт уже завершился, но [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие торговые пути до сих пор не восстановились, и теперь [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] требуют, чтобы [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] компенсировали им ущерб. В то же время многие при дворе настаивают на введении новых налогов, ведь с потерей множества кораблей [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие берега стали беззащитными перед набегами #TOOLTIP:REGION,maghreb_region,X #L магрибских#!#! корсаров."
 flavor_mll.2.a: "Мы введём новый налог, чтобы пополнить сундуки [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_mll.2.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|U] не должны остаться без поддержки. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|U] выделят необходимые средства."
 flavor_mll.3.title: "[our_ruler.GetNameWithNoTooltip] и [Select_CString(our_ruler.IsFemale, 'её', 'его' )] палатинские законы"
 flavor_mll.3.entry: "Палатинские законы Хайме III"
 flavor_mll.3.desc: "Желая укрепить своё положение [Select_CString(our_ruler.IsFemale, 'независимой правительницы', 'независимого правителя' )] в глазах #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'велела', 'велел' )] составить свод законов, получивший название «[ShowPolicyName('mll_leges_palatinae')]». Новый кодекс подчёркивает независимый статус [ROOT.GetCountry.Custom('CL_GEN')] и укрепляет властные полномочия [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого двора."
 flavor_mll.3.a: "Мы немедленно введём новый свод законов, чтобы укрепить положение страны!"
 flavor_mll.3.b: "Пока отложим принятие нового свода, но будем держать его под рукой."
 flavor_mll.3.c: "Существующие законы нас полностью устраивают, мы не станем их менять."
 flavor_mll.4.title: "Иллюстрированный манускрипт «[ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]»"
 flavor_mll.4.entry: "Иллюстрированный манускрипт Leges Palatinae"
 flavor_mll.4.desc: "Заложив основы нового #TOOLTIP:LAW,legal_code_law,X #L свода законов#!#!, [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'наняла', 'нанял' )] несколько #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянских#!#! мастеров, чтобы создать богато украшенный манускрипт этого кодекса. Художники потрудились на славу, манускрипт отличается высочайшим качеством, и некоторые вельможи при дворе советуют подарить его кому-нибудь из соседних правителей для укрепления дипломатических отношений."
 flavor_mll.4.a: "Пусть артефакт пока остаётся при дворе."
 flavor_mll.4.b: "[fra_ruler.GetShortNameWithNoTooltip] из [target_country_1.Custom('CL_GEN')] обрадуется такому подарку."
 flavor_mll.4.b.entry: "Достойный подарок для правителя Франции."
 flavor_mll.4.c: "Мы отправим манускрипт в [target_country.GetCapital.Custom('LR_ACC')|l] [target_country.GetCapital.GetNameWithNoTooltip] как свидетельство высокого престижа [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_mll.4.c.entry: "Мы отправим манускрипт в Арагон как свидетельство высокого престижа Майорки."
 flavor_mll.5.title: "Владения в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 flavor_mll.5.entry: "Владения в Монпелье"
 flavor_mll.5.desc: "Когда [Select_CString(GetCharacter('ara_jacme_i_arago').IsFemale, 'скончалась', 'скончался' )] [GetCharacter('ara_jacme_i_arago').GetName], #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! отошёл ряд владений в континентальной #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. Особое место среди них занимает [target_location.GetRank.GetName|l] [target_location.GetName], тесно связанный с #L [target_country_1.GetAdjective|l]им#! двором.\n\nВ свете напряжённых отношений между #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и [ROOT.GetCountry.Custom('CL_INST')] некоторые придворные считают, что [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'должна', 'должен' )] обратиться за поддержкой, чтобы на призыв откликнулись #TOOLTIP:CULTURE,$languedocien_tt$,X #L лангедокские#!#! [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] из [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]. Другие рекомендуют предложить [target_location.Custom('LR_ACC')|l] [target_country_1.Custom('CL_DAT')], чтобы заручиться покровительством могущественного соседа."
 flavor_mll.5.a: "Воспользуемся своим положением в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip], чтобы получить поддержку местного дворянства."
 flavor_mll.5.a.entry: "Воспользуемся своим положением в Монпелье, чтобы получить поддержку местного дворянства."
 flavor_mll.5.b: "Лучше сосредоточимся на делах [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_mll.5.c: "Договоримся [target_country_1.Custom('end_predlog_sso')] [target_country_1.Custom('CL_INST')] о передаче [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 flavor_mll.5.c.entry: "Мы договоримся с Францией о передаче Монпелье."
 mll_unlock_sale_of_montpellier_decision_tt: "Разблокирует [Concept('decision', 'решение')|e] «$mll_exchange_of_montpellier.title$», которое позволяет заручиться дипломатической поддержкой #ONCLICK:COUNTRY,[target_country_1.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_1.Custom('CL_tt')],X [target_country_1.Custom('CL_GEN')|L]#!#!"
 flavor_mll.6.title: "Защита Балеарских островов"
 flavor_mll.6.entry: "Защита Балеарских островов"
 flavor_mll.6.desc: "В прошлом #L [target_country.GetAdjective|l]ие#! патрули успешно сдерживали #TOOLTIP:CULTUREGROUP,maghrebi_group,X #L магрибские#!#! набеги на #TOOLTIP:AREA,balearics_area,X #L Балеарские острова#!#!, однако в последние годы нападения корсаров стали серьёзной проблемой для [ROOT.GetCountry.Custom('longname_ru_GEN')].\n\nПока в отношениях [target_country.Custom('end_predlog_sso')] [target_country.Custom('CL_INST')] сохраняется напряжённость, некоторые вельможи при дворе предлагают возвести комплекс береговых укреплений для обороны островов от магрибских налётчиков — а заодно и от потенциального вторжения со стороны [target_country.Custom('CL_GEN')]…"
 flavor_mll.6.a: "Мы выделим необходимые средства, чтобы сделать Балеарские острова неприступными для врагов."
 flavor_mll.6.b: "Такие расходы нам не по карману."
 mll_area_gains_naval_defensives_tt: "Все [Concept('locations', 'районы')|e] #TOOLTIP:AREA,balearics_area,X #L Балеарских островов#!#! на 60 лет получат модификатор «[ShowModifier('mll_expansion_of_coastal_fortifications')]»"
 flavor_mll.7.title: "В поисках иностранной помощи"
 flavor_mll.7.entry: "$flavor_mll.7.title$"
 flavor_mll.7.desc: "Отношения между #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! и [target_country.Custom('longname_ru_INST')] безнадёжно испорчены. Многие придворные советники считают, что пришло время обратиться за помощью к старым соперникам [target_country.Custom('CL_GEN')]. Лишь заручившись их поддержкой, [our_ruler.GetName] сохранит шансы освободиться от гнёта [target_country.GetAdjectiveWithNoTooltip|l]ой столицы."
 flavor_mll.7.a: "Обратимся за помощью к [target_country_2.Custom('CL_DAT')]."
 flavor_mll.7.a.entry: "Обратимся за помощью к Кастилии."
 flavor_mll.7.b: "Обратимся за помощью к [target_country_3.Custom('longname_ru_wntt_DAT')]."
 flavor_mll.7.b.entry: "Обратимся за помощью к Неаполитанскому королевству."
 flavor_mll.7.c: "Поищем поддержки у наших старых врагов из [target_country_4.Custom('CL_GEN')]."
 flavor_mll.7.c.entry: "Поищем поддержки у наших старых врагов из Генуи."
 flavor_mll.7.d: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] нашей страны — вот наша единственная надежда."
 mll_conditions_for_castile_support_tt: "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country_2.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_2.Custom('CL_tt')],X [target_country_2.Custom('CL_INST')|L]#!#! до #G +150#!, эта страна получит #G +50#! к принятию любого нашего движения за независимость"
 mll_conditions_for_naples_support_tt: "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country_3.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_3.Custom('CL_tt')],X [target_country_3.Custom('CL_INST')|L]#!#! до #G +120#!, эта страна получит #G +50#! к принятию любого нашего движения за независимость"
 mll_conditions_for_genoa_support_tt: "Если в ближайшие годы [ROOT.GetCountry.GetName] суме[ROOT.GetCountry.Custom('end_etyut')] улучшить отношения [target_country_4.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_4.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_4.Custom('CL_tt')],X [target_country_4.Custom('CL_INST')|L]#!#! до #G +100#!, эта страна получит #G +50#! к принятию любого нашего движения за независимость"
 MLL_PLEDGED_SUPPORT: "Обещание поддержки"
 flavor_mll.8.title: "Конец присяги"
 flavor_mll.8.entry: "Конец арагонской присяги"
 flavor_mll.8.desc: "Все попытки примирить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! [target_country.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! путём переговоров себя исчерпали, [target_country.GetAdjectiveWithNoTooltip|l]ие дипломаты более не верят, что [our_ruler.GetName] пойдёт на компромисс. Следует ожидать, что в скором времени [target_country.GetLongNameWithNoTooltip] начн[target_country.Custom('endlong_youtut')] искать предлог для открытого захвата [ROOT.GetCountry.Custom('CL_ACC')]."
 flavor_mll.8.a: "Наши отношения достигли точки кипения!"
 mll_ara_will_likely_pursue_subjugation_tt: "Скорее всего, власти #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! попытаются захватить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! и напрямую подчинить страну [target_country.GetAdjectiveWithNoTooltip|l]ой короне"
 flavor_mll.9.title: "Налаживание отношений"
 flavor_mll.9.entry: "Налаживание отношений с Арагоном"
 flavor_mll.9.desc: "Усилиями #L [target_country.GetAdjective|l]их#! и #L [ROOT.GetCountry.GetAdjective|l]их#! дипломатов нарастающий между державами кризис был предотвращён. И хотя [target_country.GetNameWithNoTooltip] по-прежнему не призна[target_country.Custom('end_youtyut')] наше стремление к независимости, мы освободились от большей части финансовых обязательств перед сюзереном. Многие при дворе считают, что [our_ruler.GetNameWithNoTooltip] уже [Select_CString(our_ruler.IsFemale, 'одержала', 'одержал' )] большую дипломатическую победу, хотя ряд вельмож полагает, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'должна', 'должен' )] добиваться полной независимости от [target_country.Custom('CL_GEN')]."
 flavor_mll.9.a: "Кризис миновал."
 mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName] откаж[target_country.Custom('end_etut')]ся от политики силового присоединения #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, при этом [ROOT.GetCountry.GetNameWithNoTooltip] смо[ROOT.GetCountry.Custom('end_gegu')]т и дальше искать способы добиться полной независимости от сюзерена"
 flavor_mll.10.title: "Становление вице-королевства"
 flavor_mll.10.entry: "Вице-королевство [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_mll.10.desc: "С восстановлением прежних отношений между #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! [target_country.GetLongNameWithNoTooltip] вновь обратил[target_country.Custom('endlong_fem')] свой взор к #TOOLTIP:AREA,balearics_area,X #L Балеарским островам#!#!. Экономика [ROOT.GetCountry.Custom('CL_GEN')] серьёзно пострадала из-за #TOOLTIP:CULTUREGROUP,maghrebi_group,X #L магрибских#!#! набегов и последствий конфликта [target_country_1.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_1.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_1.Custom('CL_tt')],X [target_country_1.Custom('CL_INST')|L]#!#!, и [target_country.GetAdjectiveWithNoTooltip|l]ий двор предлагает наделить [ROOT.GetCountry.Custom('longname_ru_wntt_ACC')] статусом вице-королевства, что обеспечит островам дальнейшую поддержку [target_country.GetAdjectiveWithNoTooltip|l]ой короны."
 flavor_mll.10.a: "Надо использовать свой новообретённый статус, чтобы усилить позиции [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_mll.10.b: "Наша задача — защитить средиземноморские интересы [target_country.Custom('CL_GEN')] и [ROOT.GetCountry.Custom('CL_GEN')]."
 flavor_mll.10.b.entry: "Наша задача — защитить средиземноморские интересы Арагона и Майорки."
 flavor_mll.10.c: "Откажемся от предложенного [target_country.Custom('CL_INST')] вице-королевства."
 flavor_mll.10.c.entry: "Откажемся от предложенного Арагоном вице-королевства."
 flavor_mll.11.title: "[source_of_piracy.GetNameWithNoTooltip] — рассадник пиратства"
 flavor_mll.11.entry: "[ShowCultureGroupNameWithNoTooltip('maghrebi_group')] — рассадник пиратства"
 flavor_mll.11.desc: "[ROOT.GetCountry.GetLongName] уже давно страда[ROOT.GetCountry.Custom('endlong_etyut')] от набегов #TOOLTIP:REGION,maghreb_region,X #L магрибских#!#! корсаров, однако в последние годы ситуация резко ухудшилась, и виной тому [source_of_piracy.GetName]. Возмущённые [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] требуют, чтобы [our_ruler.GetNameWithNoTooltip] [Select_CString(our_ruler.IsFemale, 'атаковала', 'атаковал' )] этот рассадник пиратства и навсегда [Select_CString(our_ruler.IsFemale, 'покончила', 'покончил' )] с этой угрозой нашим берегам."
 flavor_mll.11.a: "Пора разобраться [source_of_piracy.Custom('end_predlog_sso')] [source_of_piracy.GetAdjectiveWithNoTooltip|l]ими пиратами."
 flavor_mll.11.a.entry: "Пора разобраться с пиратами."
 flavor_mll.11.b: "Чтобы покончить с ними, необходимо захватить [source_of_piracy.GetAdjectiveWithNoTooltip|l]ие владения."
 flavor_mll.11.b.entry: "Чтобы покончить с ними, необходимо захватить их владения."
 flavor_mll.12.title: "Стены Алькудии"
 flavor_mll.12.entry: "$flavor_mll.12.title$"
 flavor_mll.12.desc: "Алькудия, расположенная на окраине [target_location.Custom('LR_GEN')|l] [target_location.GetName], вот уже целое столетие постоянно подвергается набегам #TOOLTIP:REGION,maghreb_region,X #L магрибских#!#! корсаров. Зная о уязвимости этого поселения, [GetCharacter('mll_jacme_ii_mallorca').GetName] в своё время [Select_CString(GetCharacter('mll_jacme_ii_mallorca').IsFemale, 'велела', 'велел' )] возвести новые крепостные стены для защиты от будущих атак. И хотя строительство до сих пор не завершено, существующие укрепления уже доказали свою эффективность. Некоторые придворные вельможи считают, что [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] должны построить такие же стены для защиты #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetNameWithNoTooltip]."
 flavor_mll.12.a: "Мы профинансируем строительство новых укреплений для защиты [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
 flavor_mll.12.a.entry: "Мы профинансируем строительство новых укреплений для защиты всего Манакора."
 flavor_mll.12.b: "Необходимо завершить постройку стен Алькудии."
 flavor_mll.12.c: "Строительство в Алькудии пора прекратить."
 flavor_mll.13.title: "Свобода от [target_country.Custom('CL_GEN')]"
 flavor_mll.13.entry: "Провозглашение независимости"
 flavor_mll.13.desc: "[our_ruler.GetName] и [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий двор наконец-то добились подлинной независимости [ROOT.GetCountry.Custom('CL_GEN')] от [target_country.Custom('longname_ru_GEN')]. [target_country.GetAdjectiveWithNoTooltip]ие власти были вынуждены смириться с отделением [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их владений, и [target_country.GetCapital.GetName] нам больше не указ. Теперь [ShowScriptedGeographyName('mediterranean_sea_geography')] принадлежит нам!"
 flavor_mll.13.a: "Отныне [ROOT.GetCountry.GetNameWithNoTooltip] буд[ROOT.GetCountry.Custom('end_etut')] строить собственное будущее."
 flavor_mll.14.title: "[our_ruler.GetNameWithNoTooltip] получает поддержку университета из [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 flavor_mll.14.entry: "Учёные из Монпелье поддерживают наше правление"
 flavor_mll.14.desc: "#TOOLTIP:BUILDING_TYPE,university,X #L Университетские#!#! учёные из [target_location.Custom('LR_GEN')|l] [target_location.GetName] — нашего владения в континентальной Европе — энергично поддержали власть [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой короны. [our_ruler.GetName] пользуется безграничным доверием этих учёных; их вклад в принятие нового свода законов «[ShowPolicyName('mll_leges_palatinae')]» укрепляет авторитет нашего монарха и усиливает власть [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого двора."
 flavor_mll.14.a: "Мы рады их поддержке."
 flavor_mll.14.b: "Благодаря их высокой оценке [our_ruler.GetShortNameWithNoTooltip] сможет укрепить свои политические позиции."
 flavor_mll.14.b.entry: "Благодаря их высокой оценке [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] сможет укрепить свои политические позиции."
 flavor_mll.15.title: "Восстановление торгового влияния [ROOT.GetCountry.Custom('CL_GEN')]"
 flavor_mll.15.entry: "Восстановление торгового влияния Майорки"
 flavor_mll.15.desc: "Экономическая политика [ROOT.GetCountry.Custom('longname_ru_GEN')] больше не зависит от капризов #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, и многие наши купцы с энтузиазмом открывают собственные предприятия, надеясь вернуть #L [ROOT.GetCountry.GetAdjective|l]ой#! торговле былое влияние в Средиземноморье. Столкновения между #ONCLICK:COUNTRY,[target_country_1.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country_1.Custom('CL_tt')],X [target_country_1.Custom('CL_INST')|L]#!#! и [target_country.Custom('CL_INST')] изрядно подорвали экономический потенциал [ROOT.GetCountry.Custom('CL_GEN')], но когда [ROOT.GetCountry.GetFlavorRank|l] обрет[ROOT.GetCountry.Custom('endrank_youtut')] независимость, [ShowScriptedGeographyName('mediterranean_sea_geography')] вновь будет считаться с купцами из нашей страны.\n\nКое-кто при дворе говорит, что [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] должны получить дополнительные привилегии — вместе со снятием прежних ограничений, оставшихся со времён [target_country.GetAdjectiveWithNoTooltip|l]ого правления, чтобы развитие нашей торговли получило дополнительный импульс. Иные, впрочем, опасаются, что с усилением городского сословия [ROOT.GetCountry.GetNameWithNoTooltip] риску[ROOT.GetCountry.Custom('end_etyut')] со временем превратиться в #TOOLTIP:GOVTYPE,republic,X #L республику#!#! наподобие #TOOLTIP:REGION,italy_region,X #L итальянских#!#!."
 flavor_mll.15.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|U] верно служат стране и заслуживают новых привилегий."
 flavor_mll.15.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] самостоятельно займётся этими вопросами."
 flavor_mll.15.c: "Нам следует сосредоточиться на внутренних проблемах."
 # Decisions
 mll_a_hub_of_mediterranean_trade.title: "Центр средиземноморской торговли"
 mll_a_hub_of_mediterranean_trade.desc: "Войны между #ONCLICK:COUNTRY,[GetCountry('ARA').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('ARA').Custom('CL_tt')],X [GetCountry('ARA').Custom('CL_INST')|L]#!#! и #ONCLICK:COUNTRY,[GetCountry('GEN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GEN').Custom('CL_tt')],X [GetCountry('GEN').Custom('CL_INST')|L]#!#! нанесли #L [GetCountry('MLL').GetAdjective|l]им#! торговым путям тяжёлый ущерб, но с обретением независимости у [GetCountry('MLL').Custom('longname_ru_wntt_GEN')] появилась возможность вдохнуть новую жизнь в некогда прибыльные маршруты. Более того, ввиду выгодного географического положения Балеарских островов у нас есть все шансы стать ведущей торговой державой Средиземноморья."
 mll_a_hub_of_mediterranean_trade.a: "Скоро [GetCountry('MLL').GetNameWithNoTooltip] буд[GetCountry('MLL').Custom('end_etut')] доминировать в Средиземном море."
 mll_exchange_of_montpellier.title: "Передача Монпелье"
 mll_exchange_of_montpellier.desc: "В соответствии с завещанием, которое [Select_CString(GetCharacter('ara_jacme_i_arago').IsFemale, 'оставила', 'оставил' )] [GetCharacter('ara_jacme_i_arago').GetName], территорией Монпелье теперь владеет [GetCharacter('mll_jacme_ii_mallorca').GetName], и с тех пор она остаётся важнейшим владением [GetCountry('MLL').Custom('longname_ru_wntt_GEN')] на континенте. Тем не менее ввиду растущей напряжённости между [GetCountry('MLL').Custom('CL_INST')] и [GetCountry('ARA').Custom('CL_INST')] есть смысл предложить эту землю [GetCountry('FRA').Custom('longname_ru_wntt_DAT')] — и таким образом заручиться поддержкой могущественной державы."
 mll_exchange_of_montpellier.a: "Предложим [GetCountry('FRA').Custom('longname_ru_wntt_DAT')] купить Монпелье."
 mll_exchange_of_montpellier.b: "Передадим [GetCountry('FRA').Custom('longname_ru_wntt_DAT')] Монпелье в обмен на гарантии."
 mll_exchange_of_montpellier.c: "[ShowLocationNameWithNoTooltip('montpellier')] — [GetCountry('MLL').GetAdjectiveWithNoTooltip|l]ая земля!"
 mll_french_support_for_montpellier_tt: "[GetCountry('FRA').GetName] на 50 лет получ[GetCountry('FRA').Custom('end_itat')] #G +100#! к принятию любого нашего движения за независимость."
