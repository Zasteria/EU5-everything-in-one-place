l_russian:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "Славно."
 flavor_tun.1.b: "Это пустая трата средств!"
 flavor_tun.2.caliphal_backstory: "Наше государство образовалось во время распада [GetCountry('ALM').GetAdjective] халифата. Именно тогда основатель династии [ShowDynastyName('hafsid_dynasty')], досточтимый Абу Закария, принял титул #italic«Амир аль-Му'минин»#!, взяв на себя роль $rank_empire_muslim_ruler_male$, и #italic де факто#! провозгласил независимость. Это притязание было немедленно признано династией [ShowDynastyName('nasrid_dynasty')] в [ShowCountryNameIfActive('GRA')], а также правителями других [ShowCultureName('andalusi')] городов. Когда возникли государства [ShowCountryNameIfActive('TLE')] и [ShowCountryNameIfActive('MOR')], они тоже вскоре признали наши права. Наша власть уважаема даже в священном городе [ShowLocationName('mecca')], где шариф признал наши притязания на халифат в 1259 году, после недавнего падения Аббасидов под натиском монголов."
 flavor_tun.2.title: "Ослабление халифата"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.a: "Мы заставим их уважать нас!"
 flavor_tun.2.b: "Отказаться от титула."
 tun_caliphate_decision_enabled: "Открывает [ShowDecisionName('hafsid_caliphate_decision')] [decision|e]"
 flavor_tun.3.title: "Восстановление власти халифа"
 flavor_tun.3.a: "Мы позаботимся об #italic умме#!!"
 hafsid_caliphate_name_tt: "В наше название войдёт титул #Y халифат#!"
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
 flavor_tun.4.title: "Наследование [aging_monarch.GetNameWithNoTooltip]"
 flavor_tun.4.entry: "Наследование [GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip]"
 flavor_tun.4.a: "Пусть [preferred_heir.GetNameWithNoTooltip] из [target_country.GetNameWithNoTooltip] примет власть."
 flavor_tun.4.a.entry: "Пусть [GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip] из $GFS$ примет власть."
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] — безопасный выбор."
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] — безопасный выбор."
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] помог бы объединить владения."
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] помог бы объединить владения."
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName] будет назначен(а) в качестве [heir|e] [ROOT.GetCountry.GetName]"
 TUN_unite_two_realms_tt: "Поскольку [THIS.GetCharacter.GetName] является [ruler|e] государства-[ShowSubjectTypeName('familial_governor')] в составе [THIS.GetCharacter.GetCourtCountry.GetName], когда [THIS.GetCharacter.GetSheHe] взойдёт на престол, оба государства объединятся"
 TUN_civil_war_from_preferred_heir_tt: "Поскольку [preferred_heir.GetName] является предпочитаемым наследником, [preferred_heir.GetSheHe] вскоре начнёт [war|e] при поддержке сословия «[ShowEstateTypeName('tribes_estate')]», из-за чего наши [locations|e], находящиеся в [ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')], перейдут на другую сторону"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[usurper_scope.GetName] might try to usurp the throne from [THIS.GetCharacter.GetName]"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] will accede to the throne of [from_country.GetName], uniting the two countries under [from_country.GetAdjectiveWithNoTooltip] banner"
 flavor_tun.5.title: "Назначение в [from_country.GetNameWithNoTooltip]"
 flavor_tun.5.desc_positive: "Отличные новости! [aging_monarch.GetName] из [from_country.GetLongName] только что назначил [preferred_heir.GetName] наследником [aging_monarch.GetHerHis] [from_country.GetFlavorRank]. Это не удивительно, ведь [preferred_heir.GetShortNameWithNoTooltip] уже давно считается ожидаемым преемником. С таким правителем у власти будущее [ShowScriptedGeographyName('ifriqiya_geography')] представляется светлым."
 flavor_tun.5.desc_negative: "Проклятье! Неслыханным решением [aging_monarch.GetName] из [from_country.GetName] только что назначил [appointed_heir.GetName] преемником вместо [aging_monarch.GetHerHim]. В [ShowScriptedGeographyName('ifriqiya_geography')] хорошо известно, что [preferred_heir.GetName] — самый популярный кандидат и естественный наследник, так что, должно быть, произошло нечто незаконное, чтобы [appointed_heir.GetNameWithNoTooltip] получил титул наследника."
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] не потерпит этого!"
 flavor_tun.5.c: "Нам придётся смириться с этим."
 flavor_tun.6.title: "Ожидаемый ответ"
 flavor_tun.6.desc: "Как и предполагалось, назначение [appointed_heir.GetName] не понравилось [preferred_heir.GetName], который поспешил оспорить это решение. Опираясь на поддержку сословия «[ShowEstateTypeName('tribes_estate')]», [target_country.GetName] объявил войну за престол [ROOT.GetCountry.Custom('CL_ACC')], и войска [preferred_heir.GetShortNameWithNoTooltip] уже движутся к [ROOT.GetCountry.GetCapital.GetName]."
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]."
 GFS_will_receive_following: "Если [target_country.GetName] решит начать [war|e] из-за этого:"
 flavor_tun.7.title: "Захват престола!"
 flavor_tun.7.desc: "Несмотря на то, что [target_character2.GetName] был назначен наследником [from_country.GetLongName], их непокорный брат/сестра [target_character.GetName] решил(а) воспользоваться нынешним положением [target_character.GetHerHis] в столице, чтобы захватить власть над [from_country.GetFlavorRank]. Это несомненно разгневает [target_character2.GetShortNameWithNoTooltip] из [target_country.GetName], который(ая) непременно возьмётся за оружие против [target_character.GetHerHis] [target_character2.GetSisterBrother]."
 flavor_tun.7.a: "Кто первый пришёл, тот и получил."
 flavor_tun.7.b: "Это возмутительно! Это несправедливо!"
 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.a: "К бою!"
 flavor_tun.8.b: "Мы не можем позволить себе воевать."
 flavor_tun.10.title: "Эмиризм"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')] — это притон беззакония и порока. На протяжении почти столетия [ROOT.GetCountry.GetLongName] и его подчинённые из [ShowDynastyName('hafsid_dynasty')] не могли установить контроль за пределами городов, что привело к повсеместным беспорядкам и преступности в сельских провинциях. И всё же луч надежды озаряет знатных людей [ShowCultureName('andalusi')] и ведущих шейхов [ShowEstateTypeName('nobles_estate')] — это идеология эмиризма, провозглашающая грядущее, в котором один региональный эмир будет править всем [ShowAreaName('tunis_area')], вновь приведя его к процветанию."
 flavor_tun.10.a: "Пусть [ROOT.GetCountry.GetReligion.GetGodName] укажет нам путь."
 flavor_tun.10.a.entry: "Пусть $muslim_god_name$ укажет нам путь."
 tun_info_about_tunis_decentralization: "Нам следует как можно скорее отменить [ShowGovernmentReformName('tun_strong_familial_governors')] [government_reform|e]"
 tun_additional_benefits_for_farfanes_tt: "[ShowEstatePrivilegeName('catalan_merchant_privileges')] will grant up to #Y +0.25#! [ShowModifierTypeName('monthly_towards_centralization')], depending on our [ShowUnitDefinitionName('a_farfanes')] count"
 flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')], воссоединённая"
 flavor_tun.11.a: "Начинается новая эпоха."
 flavor_tun.11.b: "Рождение новой идентичности."
 IFRIQIYA_NAME: "'Ifrīqiya"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
 flavor_tun.12.title: "Рост пиратства в [ShowLocationNameWithNoTooltip('bejaia')]"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "В последние годы [target_location.GetName] стал свидетелем расширения самой необычной, но весьма прибыльной отрасли — пиратства в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Вот уже много десятилетий местные шейхи широко поддерживают [ShowBuildingTypeName('pirate_haven')] и его не такие уж тайные набеги на [ShowReligionGroupAdjective('christian')] деревни, несмотря на существующие торговые связи. Подобные набеги действительно вредят нашим отношениям с потенциальными торговыми партнёрами, но прибыль, которую мы получаем благодаря политике «[ShowPolicyName('state_piracy_policy')]», нельзя недооценивать."
 flavor_tun.12.a: "Они враги [ROOT.GetCountry.GetReligion.GetGodName]!"
 flavor_tun.12.a.entry: "Они враги $muslim_god_name$!"
 flavor_tun.12.b: "Как скажете."
 flavor_tun.12.c: "Пиратство не принесёт нам ничего хорошего."
 flavor_tun.13.title: "Экономическая удавка"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "The [ShowReligionGroupAdjective('christian')] merchants in [ROOT.GetCountry.GetName] have already received wide-ranging [ShowEstatePrivilegeName('catalan_merchant_privileges')]. Despite those, despite the quarters that we so generously provide them, the ability to defer to their own, the freedom of religion we have granted them, the [target_country.GetAdjective] [target_country.GetGovernment.GetEstateName('burghers_estate')] still demand more — otherwise their home country may cease business with us altogether."
 flavor_tun.13.a: "Наёмники слишком важны для нас."
 flavor_tun.13.b: "Ба! Нам не нужны их услуги."
 tun_economic_stranglehold_tt: "The [ShowModifierTypeName('global_merchant_power')] in [ShowEstatePrivilegeName('catalan_merchant_privileges')] will be increased by #R -10.0%#!"
 flavor_tun.14.title: "Требование родственника"
 flavor_tun.14.desc: "Один из принцев рода [ShowDynastyName('hafsid_dynasty')], [target_character.GetName], обрёл достаточно влияния, чтобы потребовать должность [ShowSubjectTypeName('familial_governor')]. Если мы не уступим и не пожалуем [target_location.GetName] [target_character.GetNameWithNoTooltip], это непременно вызовет волнения в [ROOT.GetCountry.GetLongName]."
 flavor_tun.14.a: "Пусть [target_character.GetHerHim] получит это!"
 flavor_tun.14.b: "Сейчас неподходящее время."
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName] рассчитывает стать [ShowSubjectTypeName('familial_governor')], и пока [target_character.GetSheHe] не получит эту должность через [ShowCharacterInteractionName('assign_familial_governor')], у [target_character.GetSheHe] будет сохраняться возможность вновь запускать это [event|e]"
 flavor_tun.15.title: "Спор о престолонаследии"
 flavor_tun.15.desc: "Смерть старого [old_ruler.GetName] оставила вакуум власти в [ROOT.GetCountry.GetCapital.GetName]. Формально [new_ruler.GetName] должен занять пост правителя в [ROOT.GetCountry.GetName], однако преемственность отнюдь не гарантирована. Народное восстание, поддерживаемое неизвестной силой, сейчас движется по улицам столицы, пытаясь обеспечить престолонаследие [target_character2.GetName]. Поддержим ли мы законного наследника, или позволим [ShowEstateTypeName('burghers_estate')] добиться своего?"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] — законный наследник!"
 flavor_tun.15.b: "Мы должны прислушаться к восставшим."
 flavor_tun.16.title: "Престолонаследие [target.GetNameWithNoTooltip]"
 flavor_tun.16.desc: "С восшествием на престол [new_ruler.GetName] земли [target.GetLongName] и [ROOT.GetCountry.GetName] вновь объединены под властью единого центрального правителя из династии [ShowDynastyName('hafsid_dynasty')]. Будем надеяться, что [ShowScriptedGeographyName('ifriqiya_geography')] вскоре воссоединится и более не будет страдать от тяжёлой [ShowSocietyDirectionName('decentralization')]."
 flavor_tun.16.a: "Ещё один шаг к единству."
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "[target.GetName] был [Concept('annexed','Присоединён')|e] к [ROOT.GetCountry.GetName]"
 flavor_tun.17.title: "Спор о престолонаследии в [from_country.GetNameWithNoTooltip]"
 flavor_tun.17.desc: "Заручившись достаточной поддержкой среди [from_country.GetGovernment.GetEstateName('burghers_estate')] в [from_country.GetCapital.GetName], [target_character2.GetShortNameWithNoTooltip] стал номинальным правителем государства, тем самым фактически лишив [new_ruler.GetNameWithNoTooltip] законного наследства, а нас — их руководства."
 flavor_tun.17.a: "Мы этого не потерпим!"
 flavor_tun.17.b: "Нас заботят более важные дела."
 flavor_tun.18.title: "Именитый [ShowCultureNameWithNoTooltip('andalusi')]"
 flavor_tun.18.desc: "Местный(ая) [target_character.GetWomanMan] [ShowCultureName('andalusi')] происхождения, рождённый(ая) и выросший(ая) в [target_character.GetBirthLocation.GetArea.GetName], недавно продвинулся(лась) по службе и вошёл(ла) в [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] в [ROOT.GetCountry.GetCapital.GetName]. Похоже, что [target_character.GetName] вскоре станет одним из членов [ShowEstatePrivilegeName('andalusi_elite')] нашего [ROOT.GetCountry.GetFlavorRank]."
 flavor_tun.18.a: "Восхитительно!"
 flavor_tun.19.title: "Новый претендент на престол?"
 flavor_tun.19.desc: "В последнее время улицы [ROOT.GetCountry.GetCapital.GetName] полнятся слухами и пересудами. [ROOT.GetCountry.GetCapital.GetRank.GetName] обдумывает правление [target_character2.GetName] и размышляет, кто мог бы стать достойным преемником [target_character2.GetHerHim]. [ShowEstateTypeName('burghers_estate')] избрали видную особу — [target_character.GetName], — которую считают подобающим наследником престола [ROOT.GetCountry.GetName]. Ходят слухи, что [ShowEstateTypeNameWithNoTooltip('burghers_estate')] соблазнились щедрыми обещаниями [target_character.GetHerHis] о привилегиях и дополнительных правах."
 flavor_tun.19.a: "Что ж, давайте назначим [target_character.GetNameWithNoTooltip]."
 flavor_tun.19.b: "Глупцы, если верят в это."
 hafsid_caliphate_decision.desc.entry: "Нам не удалось закрепить за собой права наследников [GetCountry('ALM').GetAdjective] Халифата. Это нельзя оставить так! Мы должны вернуть себе место главы общины [ShowReligionAdjective('sunni')]!"
 ifriqiya_reunited_decision.desc.entry: "Слишком долго [ShowScriptedGeographyName('ifriqiya_geography')] оставалась разделённой на множество государств, многими из которых правили ветви рода [ShowDynastyName('hafsid_dynasty')]. Мы не можем больше мириться с этой раздробленностью."
 tun_have_more_gp_score_than_us: "Ни одна [ShowReligionAdjective('sunni')] [country|e] не имеет больше [great_power_score|e], чем [THIS.GetCountry.GetName]"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nToday, little of that past splendor remains. Our internal issues have greatly weakened the authority of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], who is a $rank_empire_muslim_ruler_male$ in nothing but name. We must return caliphal authority to the [ROOT.GetCountry.GetLongName]!"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nDespite how this authority faltered in the following century, we managed to bring the [ROOT.GetCountry.GetLongName] back from the brink of irrelevance. The [ROOT.GetCountry.GetFlavorRank] is now once again one of the principal states in the [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] world."
 flavor_tun.4.desc: "[aging_monarch.GetName] is increasingly concerned with the gloomiest, yet most vital decision an aging monarch has to make: appointing [aging_monarch.GetHerHis] successor. Such an appointment should be rather obvious, too, for [preferred_heir.GetName] has always been the favorite of our dear [ROOT.GetCountry.GetGovernment.GetRulerTitle]. The issue lies with [aging_monarch.GetHerHis] other children, [future_usurper.GetName], who aids the government in [ROOT.GetCountry.GetCapital.GetName], and [third_way.GetName] of [target_country2.GetName], a possible pretender to the throne.\n\nThis choice will have a profound impact on the stability of the [ROOT.GetCountry.GetLongName] long after the death of [aging_monarch.GetShortNameWithNoTooltip]."
 flavor_tun.8.desc: "The succession of [target_character2.GetName] in the [from_country.GetLongName] has been usurped by [target_character2.GetHerHis] [target_character.GetSisterBrother], [target_character.GetName], who swiftly moved to take control of the [from_country.GetFlavorRank] and subdued its [from_country.GetGovernment.GetCourtTitle].\n\nIt is humiliating for [target_character2.GetShortNameWithNoTooltip] have [target_character2.GetHerHis] name tarnished like this! We must punish [target_character.GetShortNameWithNoTooltip]."
 flavor_tun.11.desc: "The decentralization of the [ROOT.GetCountry.GetLongName] has been addressed at its core. The era of the [ShowGovernmentReformName('tun_strong_familial_governors')] is over, and all of [ShowScriptedGeographyName('ifriqiya_geography')] stands reunited under the banners of the [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. No longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] countryside be brutalized by rampant crime; no longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] emirs be blackmailed by the [ShowEstateTypeName('nobles_estate')]; no longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] state be dependent on the support of foreign actors.\n\nIt is a time of reckoning for the old order, and a great opportunity for us to usher in a new era."
