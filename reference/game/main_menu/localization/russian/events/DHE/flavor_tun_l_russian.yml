l_russian:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "Славно."
 flavor_tun.1.b: "Это пустая трата средств!"
 tun_have_more_gp_score_than_us: "[THIS.GetCountry.GetName] име[THIS.GetCountry.Custom('end_etyut')] самый высокий [Concept('great_power_score', 'счёт великой державы')|e] среди #TOOLTIP:RELIGION,$sunni_tt$,X #L суннитских#!#! [Concept('country', 'государств')|e]"
 flavor_tun.2.caliphal_backstory: "Наша держава возникла на обломках [GetCountry('ALM').GetAdjective]ого халифата. В те времена досточтимый Абу Закария, основатель династии #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсидов#!#!, принял титул #italic Амир аль-муминин#!, или #italic Повелитель правоверных#!, взяв на себя обязанности халифа и #italic фактически#! объявив о независимости своего государства. Его притязания сразу же признала династия Насридов, правившая в державе [ShowCountryNameIfActive('GRA')], а вслед за ней — эмиры прочих #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусских#!#! городов. Позднее наши притязания признали и вновь созданные [ShowCountryNameIfActive('TLE')] и [ShowCountryNameIfActive('MOR')]. Авторитет нашей державы простирается до самого священного города [ShowLocationName('mecca')], шериф которого признал наши права на титул халифа в 1259 году после того, как Аббасиды пали под натиском монголов."
 flavor_tun.2.title: "Упадок халифата"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nСегодня от былого величия почти ничего не осталось. Из-за наших внутренних проблем [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], уже давно лишь на бумаге являвшийся халифом, сильно ослаб. Его влияние испарилось. Нам надлежит восстановить авторитет халифской власти [ROOT.GetCountry.Custom('longname_ru_GEN')]!"
 flavor_tun.2.a: "Мы заставим их нас уважать!"
 flavor_tun.2.b: "Пришло время отказаться от титула."
 tun_caliphate_decision_enabled: "Открывает доступ к [Concept('decision', 'решению')|e] «[ShowDecisionName('hafsid_caliphate_decision')]»"
 flavor_tun.3.title: "Восстановление авторитета халифов"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nНесмотря на то что в следующем столетии авторитет халифов пошатнулся, нам всё же удалось уберечь [ROOT.GetCountry.Custom('longname_ru_ACC')] от полного забвения. [ROOT.GetCountry.GetFlavorRank|U] снова занимает одно из ведущих мест среди держав [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective|l]ого мира."
 flavor_tun.3.a: "Мы позаботимся об #italic умме#!!"
 hafsid_caliphate_name_tt: "Отныне наша держава будет именоваться #Y халифатом#!!"
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.desc.entry: "Нам не удалось утвердиться в качестве преемников [GetCountry('ALM').GetAdjective]ого халифата. Этому необходимо положить конец! Мы должны вернуть себе первенство среди последователей #TOOLTIP:RELIGION,$sunni_tt$,X #L суннизма#!#!!"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
 flavor_tun.4.title: "[aging_monarch.GetNameWithNoTooltip] и вопрос наследования"
 flavor_tun.4.entry: "[GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip] и вопрос наследования"
 flavor_tun.4.desc: "[aging_monarch.GetName] дряхлеет и всё чаще задумывается о самом тягостном, но необходимом для стареющего монарха вопросе — назначении наследника. На первый взгляд, сомнений тут быть не может, поскольку [preferred_heir.GetName] всегда [Select_CString(preferred_heir.IsFemale, 'считалась любимицей', 'считался любимцем')] [Select_CString(aging_monarch.IsFemale, 'нашей дорогой правительницы', 'нашего дорогого правителя')]. Проблема в том, что [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] имеет и других детей. Так, [future_usurper.GetName] помогает правительству в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Но есть и ещё один возможный претендент на трон — [third_way.GetName] [target_country2.GetAdjective][Select_CString(third_way.IsFemale, 'ая', 'ий' )].\n\nЭтот выбор будет иметь далеко идущие последствия для стабильности [ROOT.GetCountry.Custom('longname_ru_GEN')], которые ещё долго будут давать о себе знать даже после того, как [aging_monarch.GetShortNameWithNoTooltip] отойдёт в мир иной."
 flavor_tun.4.a: "Пусть престол унаследует [preferred_heir.GetNameWithNoTooltip] [target_country.GetAdjective][Select_CString(preferred_heir.IsFemale, 'ая', 'ий' )]."
 flavor_tun.4.a.entry: "Пусть престол унаследует [GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip] из Гафсы."
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] — благоразумный выбор."
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] — благоразумный выбор."
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] поможет объединить державы."
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] поможет объединить державы."
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName] будет [Select_CString(THIS.GetCharacter.IsFemale, 'назначена наследницей', 'наследником')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
 TUN_unite_two_realms_tt: "Поскольку [THIS.GetCharacter.GetName] является [Select_CString(THIS.GetCharacter.IsFemale, 'родственной губернаторшей', 'родственным губернатором')] в державе [THIS.GetCharacter.GetCourtCountry.GetName], [Select_CString(THIS.GetCharacter.IsFemale, 'её', 'его')] восшествие на престол приведёт к объединению двух государств"
 TUN_civil_war_from_preferred_heir_tt: "Поскольку [Select_CString(preferred_heir.IsFemale, 'предпочтительной наследницей', 'предпочтительным наследником')] является [preferred_heir.GetName], [Select_CString(preferred_heir.IsFemale, 'она', 'он')] вскоре развяжет [Concept('war', 'войну')|e], заручившись поддержкой #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племён#!#!. Это приведёт к отпадению наших [Concept('locations', 'районов')|e], находящихся под влиянием Гафсы"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName] может попытаться узурпировать власть, в результате чего [THIS.GetCharacter.GetName] потеряет престол"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "Если попытки узурпации престола не будет, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] взойдёт на престол #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!, объединив обе державы под [from_country.GetAdjectiveWithNoTooltip|l]им знаменем"
 flavor_tun.5.title: "Назначение [from_country.Custom('end_predlog_vvo')] [from_country.Custom('CL_PREP')]"
 flavor_tun.5.desc_positive: "Замечательные новости! [Select_CString(aging_monarch.IsFemale, 'Правительница', 'Правитель')] [from_country.Custom('longname_ru_GEN')] [aging_monarch.GetName] только что [Select_CString(aging_monarch.IsFemale, 'объявила', 'объявил')], что [preferred_heir.GetName] станет [Select_CString(preferred_heir.IsFemale, 'наследницей', 'наследником')] [from_country.Custom('rank_ru_GEN')|l]. Впрочем, это неудивительно, поскольку [preferred_heir.GetShortNameWithNoTooltip] уже давно считается наиболее [Select_CString(preferred_heir.IsFemale, 'вероятной преемницей', 'вероятным преемником')]. С таким правителем во главе Ифрикию ждёт светлое будущее."
 flavor_tun.5.desc_negative: "Проклятье! [Select_CString(aging_monarch.IsFemale, 'Правительница', 'Правитель')] #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! [aging_monarch.GetName] только что, вопреки всем ожиданиям, [Select_CString(aging_monarch.IsFemale, 'объявила', 'объявил')], что [appointed_heir.GetName] наследует [Select_CString(aging_monarch.IsFemale, 'её', 'его')] престол. Однако вся Ифрикия знает, что [preferred_heir.GetName] пользуется наибольшей поддержкой и является [Select_CString(preferred_heir.IsFemale, 'законной преемницей', 'законным преемником')]. Назначение же [Select_CString(appointed_heir.IsFemale, 'преемницей', 'преемником')] кого-то другого наводит на мысль, что здесь не обошлось без тёмных делишек."
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] не оставит это без ответа!"
 flavor_tun.5.c: "Нам придётся смириться."
 flavor_tun.6.title: "Предсказуемый ответ"
 flavor_tun.6.desc: "[aging_monarch.GetName] [Select_CString(aging_monarch.IsFemale, 'объявила', 'объявил')], что [appointed_heir.GetName] наследует [Select_CString(aging_monarch.IsFemale, 'её', 'его')] престол. Как и предполагалось, [Select_CString(appointed_heir.IsFemale, 'её', 'его')] назначение [Select_CString(appointed_heir.IsFemale, 'преемницей', 'преемником')] вызвало недовольство — [preferred_heir.GetName] [Select_CString(preferred_heir.IsFemale, 'поспешила', 'поспешил')] заявить о своих правах на трон. При поддержке #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племён#!#! держава [target_country.GetName] объявила войну за престол #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а [preferred_heir.GetShortNameWithNoTooltip] [Select_CString(preferred_heir.IsFemale, 'двинула', 'двинул')] свои войска на [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName]."
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 GFS_will_receive_following: "Если [target_country.GetName] решит из-за этого начать [Concept('war', 'войну')|e]:"
 flavor_tun.7.title: "Узурпация престола!"
 flavor_tun.7.desc: "Несмотря на то что [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'была объявлена наследницей', 'был объявлен наследником')] [from_country.Custom('longname_ru_GEN')], [Select_CString(target_character2.IsFemale, 'её', 'его')] непокорный сиблинг [target_character.GetName] [Select_CString(target_character.IsFemale, 'решила', 'решил')] воспользоваться своим положением в столице, чтобы присвоить себе власть [from_country.Custom('endrank_predlog_vvo')] [from_country.Custom('rank_ru_PREP')|l]. [target_character2.GetShortNameWithNoTooltip] [target_country.GetAdjective][Select_CString(target_character2.IsFemale, 'ая', 'ий' )] наверняка придёт в ярость и, несомненно, выступит против [Select_CString(target_character.IsFemale, 'своей', 'своего')] [Select_CString(target_character2.IsFemale,'сестры', 'брата')] с оружием в руках."
 flavor_tun.7.a: "По времени постройки"
 flavor_tun.7.b: "Это возмутительно! Это несправедливо!"
 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.desc: "[target_character2.GetName] [Select_CString(target_character2.IsFemale, 'лишилась', 'лишился')] своего права на престол [from_country.Custom('longname_ru_GEN')]. Власть [Select_CString(target_character.IsFemale, 'узурпировала', 'узурпировал')] [Select_CString(target_character2.IsFemale, 'её', 'его')] [Select_CString(target_character.IsFemale,'сестра', 'брат')] по имени [target_character.GetName]. [Select_CString(target_character.IsFemale,'Та', 'Тот')] незамедлительно [Select_CString(target_character.IsFemale, 'захватила', 'захватил')] власть [from_country.Custom('endrank_predlog_vvo')] [from_country.Custom('rank_ru_PREP')|l] и [Select_CString(target_character.IsFemale, 'подчинила', 'подчинил')] [from_country.GetAdjective|l]ий двор.\n\n[target_character2.GetShortNameWithNoTooltip] видит, как [Select_CString(target_character2.IsFemale, 'её', 'его')] имя покрывается позором. Какое унижение! [target_character.GetShortNameWithNoTooltip] заслуживает возмездия."
 flavor_tun.8.a: "К бою!"
 flavor_tun.8.b: "Войну мы не можем себе позволить."
 flavor_tun.10.title: "Эмиризм"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "Ифрикия стала пристанищем беззакония и разврата. На протяжении почти ста лет [ROOT.GetCountry.GetLongName] и подвластные #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсидам#!#! владения были не в состоянии утвердить свою власть за пределами собственных городских стен, из-за чего сельские провинции погрязли в беспорядках и преступности. И всё же #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусская#!#! знать и виднейшие шейхи-[ShowEstateTypeName('nobles_estate')|l] верят, что забрезжил луч надежды — эмиризм. Эта идеология обещает будущее, в котором #TOOLTIP:AREA,tunis_area,X #L Аль-Магриб аль-Адна#!#! подчинён одному эмиру, что вернёт региону былое процветание."
 flavor_tun.10.a: "Да укажет нам [ROOT.GetCountry.GetReligion.GetGodName] путь к свету!"
 flavor_tun.10.a.entry: "Да укажет нам Аллах путь к свету!"
 tun_info_about_tunis_decentralization: "Нам необходимо при первой же возможности избавиться от [Concept('government_reform', 'государственного принципа')|e] «[ShowGovernmentReformName('tun_strong_familial_governors')]»"
 tun_additional_benefits_for_farfanes_tt: "[Concept('government_reform', 'Государственный принцип')|e] «[ShowGovernmentReformName('catalan_merchant_privileges')]» предоставляет бонусы к нашему модификатору «[ShowModifierTypeName]» в зависимости от того, сколько у нас войск типа «[ShowUnitDefinitionName('a_farfanes')]»"
 flavor_tun.11.title: "Воссоединение Ифрикии"
 flavor_tun.11.desc: "С децентрализацией [ROOT.GetCountry.Custom('longname_ru_GEN')] покончено раз и навсегда. Эпоха [Concept('government_reform', 'государственного принципа')|e] «[ShowGovernmentReformName('tun_strong_familial_governors')]» подошла к концу, и вся Ифрикия воссоединилась под знамёнами династии [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. Разгул преступности больше не будет терзать [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ие сельские области, [ShowEstateTypeName('nobles_estate')|l] больше не будут шантажировать [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их эмиров, а [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ая держава больше не будет зависеть от чужеземцев.\n\nПришло время покончить со старыми порядками и воспользоваться этой возможностью, чтобы перевернуть страницу истории."
 flavor_tun.11.a: "Начинается новая эпоха."
 flavor_tun.11.b: "Рождение новой общности."
 IFRIQIYA_NAME: "Ифрикия"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.desc.entry: "Слишком долго Ифрикия была разделена на множество государств, немалая часть которых находилась под властью боковых ветвей династии #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсидов#!#!. Пора положить конец этой раздробленности."
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
 flavor_tun.12.title: "Рост пиратства в Беджае"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "В последние годы район [target_location.GetName] стал центром необычного, но довольно прибыльного промысла — пиратства в Средиземном море. Уже не одно десятилетие местные шейхи оказывают широкую поддержку пиратскому схрону и его открытым набегам на #TOOLTIP:RELIGIONGROUP,christian,X #L христианские#!#! деревни, несмотря на существующие торговые связи. Такие набеги наносят ущерб нашим отношениям с потенциальными торговыми партнёрами, однако доходы от #TOOLTIP:POLICY,state_piracy_policy,X #L государственного пиратства#!#! сложно переоценить."
 flavor_tun.12.a: "[ROOT.GetCountry.GetReligion.GetGodName] — наш всевышний, а они его враги!"
 flavor_tun.12.a.entry: "$muslim_god_name$ — наш всевышний, а они его враги!"
 flavor_tun.12.b: "Ну и ладно."
 flavor_tun.12.c: "Пиратство лишь навредит нам."
 flavor_tun.13.title: "Экономическая удавка"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "#TOOLTIP:RELIGIONGROUP,christian,X #L Христианские#!#! купцы в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! уже получили обширные привилегии в рамках государственного принципа «[ShowGovernmentReformName('catalan_merchant_privileges')]». Несмотря на все предоставленные привилегии, щедро выделенные кварталы, дарованное право обращаться к своим властям и свободу вероисповедания, [target_country.GetAdjective|l]ие [target_country.GetGovernment.GetEstateName('burghers_estate')|l] по-прежнему требуют новых уступок, угрожая в противном случае полностью прекратить торговые отношения с нами."
 flavor_tun.13.a: "Наёмники слишком важны."
 flavor_tun.13.b: "Подумаешь! Мы и сами справимся."
 tun_economic_stranglehold_tt: "Модификатор «[ShowModifierTypeName('global_merchant_power')]» в государственном принципе «[ShowGovernmentReformName('catalan_merchant_privileges')]» будет уменьшен на #R 10%#!"
 flavor_tun.14.title: "Требование [Select_CString(target_character.IsFemale, 'родственницы', 'родственника')]"
 flavor_tun.14.desc: "[Select_CString(target_character.IsFemale, 'Одна из хафсидских принцесс', 'Один из хафсидских принцев')] по имени [target_character.GetName] [Select_CString(target_character.IsFemale, 'стала настолько влиятельной', 'стал настолько влиятельным')], что [Select_CString(target_character.IsFemale, 'потребовала', 'потребовал')] должность [Select_CString(target_character.IsFemale, 'родственной губернаторши', 'родственного губернатора')]. Если мы не уступим, и [target_character.GetNameWithNoTooltip] не получит [target_location.Custom('LR_ACC')|l] [target_location.GetName], мы рискуем спровоцировать волнения [ROOT.GetCountry.Custom('endlong_predlog_vvo')] [ROOT.GetCountry.Custom('longname_ru_PREP')]."
 flavor_tun.14.a: "Пусть забирает!"
 flavor_tun.14.b: "Сейчас неподходящее время."
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName] хочет стать [Select_CString(target_character.IsFemale, 'родственной губернаторшей', 'родственным губернатором')], и, пока [target_character.GetName] не получит эту должность с помощью взаимодействию c персонажем «[ShowCharacterInteractionName('assign_familial_governor')]», [Select_CString(target_character.IsFemale, 'она', 'он')] сможет снова и снова вызывать это [Concept('event', 'событие')|e]"
 flavor_tun.15.title: "Спор о престолонаследии"
 flavor_tun.15.desc: "[Select_CString(old_ruler.IsFemale, 'Старая правительница', 'Старый правитель')] [old_ruler.GetName] [Select_CString(old_ruler.IsFemale, 'скончалась', 'скончался')], а с [Select_CString(old_ruler.IsFemale, 'её', 'его')] смертью в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] образовался вакуум власти. Формально наместником #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! [Select_CString(new_ruler.IsFemale, 'должна', 'должен')] стать [new_ruler.GetName], однако [Select_CString(new_ruler.IsFemale, 'её', 'его')] приход к власти вовсе не предрешён. Улицы столицы заполонило восставшее местное население, за которым стоит неизвестная сила. Участники восстания требуют, чтобы [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'получила', 'получил')] престол. Встанем ли мы на сторону законного наследника или уступим требованиям #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L горожан#!#!?"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] — [Select_CString(new_ruler.IsFemale, 'законная наследница', 'законный наследник')]!"
 flavor_tun.15.b: "Мы должны пойти навстречу восставшим."
 flavor_tun.16.title: "Престолонаследие [target.Custom('end_predlog_vvo')] [target.Custom('CL_PREP')]"
 flavor_tun.16.desc: "После того, как [new_ruler.GetName] [Select_CString(new_ruler.IsFemale, 'взошла', 'взошёл')] на престол, [target.GetLongName] и [ROOT.GetCountry.GetName] опять объединились под властью одного правителя из династии #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсидов#!#!. Будем надеяться, что вскоре Ифрикия вновь воссоединится и навсегда забудет о губительной для себя #TOOLTIP:SOCIETAL_VALUE,centralization_vs_decentralization,X #L децентрализации#!#!."
 flavor_tun.16.a: "Ещё на один шаг ближе к единому государству."
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "Держава [target.GetName] была [Concept('annexed', 'присоединена')|e] державой [ROOT.GetCountry.GetName]"
 flavor_tun.17.title: "Спор о престолонаследии [from_country.Custom('end_predlog_vvo')] [from_country.Custom('CL_PREP')]"
 flavor_tun.17.desc: "[from_country.GetGovernment.GetEstateName('burghers_estate')] в [from_country.GetCapital.Custom('LR_PREP')|l] [from_country.GetCapital.GetName] предложили свою широкую поддержку, чему [target_character2.GetShortNameWithNoTooltip] [Select_CString(target_character2.IsFemale, 'была невероятно рада', 'был невероятно рад')], потому что благодаря ей [Select_CString(target_character2.IsFemale, 'она стала номинальной правительницей', 'он стал номинальным правителем')] государства. При этом [new_ruler.GetNameWithNoTooltip] [Select_CString(new_ruler.IsFemale, 'лишилась', 'лишился')] причитающегося [Select_CString(new_ruler.IsFemale, 'ей', 'ему')] наследства, а мы — [Select_CString(new_ruler.IsFemale, 'её как нашей правительницы', 'его как нашего правителя')]."
 flavor_tun.17.a: "Мы этого не потерпим!"
 flavor_tun.17.b: "Есть дела поважнее."
 flavor_tun.18.title: "Андалусск[Select_CString(target_character.IsFemale, 'ая аристократка', 'ий аристократ')]"
 flavor_tun.18.desc: "[Select_CString(target_character.IsFemale, 'Местная андалусская аристократка', 'Местный андалусский аристократ')], [Select_CString(target_character.IsFemale, 'появившаяся', 'появившийся')] на свет и [Select_CString(target_character.IsFemale, 'выросшая', 'выросший')] в области [target_character.GetBirthLocation.GetArea.GetName], недавно [Select_CString(target_character.IsFemale, 'продвинулась', 'продвинулся')] по службе и [Select_CString(target_character.IsFemale, 'получила', 'получил')] место при [ROOT.GetCountry.GetAdjective|l]ом дворе в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Вероятно, вскоре [target_character.GetName] станет [Select_CString(target_character.IsFemale, 'одной', 'одним')] из [Select_CString(target_character.IsFemale, 'представительниц', 'представителей')] #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусской#!#! элиты [ROOT.GetCountry.Custom('rank_ru_GEN')|l]."
 flavor_tun.18.a: "Восхитительно!"
 flavor_tun.19.title: "[Select_CString(target_character.IsFemale, 'Новая наследница', 'Новый наследник')]?"
 flavor_tun.19.desc: "В последнее время по улицам [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] ходят разные слухи и пересуды. [ROOT.GetCountry.GetCapital.GetRank.GetName] обсуждает то, как правит [target_character2.GetName], и кто мог бы [Select_CString(target_character2.IsFemale, 'ей', 'ему')] наследовать. [ShowEstateTypeName('burghers_estate')] выдвинули достойного кандидата — [target_character.GetName]. По их мнению, [Select_CString(target_character.IsFemale, 'она', 'он')] станет [Select_CString(target_character.IsFemale, 'достойной наследницей', 'достойным наследником')] [ROOT.GetCountry.GetAdjective|l]ого престола. Говорят, [ShowEstateTypeNameWithNoTooltip('burghers_estate')|l] купились на [Select_CString(target_character.IsFemale, 'её', 'его')] щедрые обещания новых привилегий и прав."
 flavor_tun.19.a: "Что ж, пусть [target_character.GetNameWithNoTooltip] станет [Select_CString(target_character.IsFemale, 'наследницей', 'наследником')]."
 flavor_tun.19.b: "Только глупцы могут в это поверить."
