 # Event strings
 inheritance_contract.1.title: "Заключён договор о наследовании"
 inheritance_contract.1.desc: "Мы заплатили #ONCLICK:COUNTRY,[SCOPE.sCountry('contract_partner').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('contract_partner').Custom('CL_tt')],X [SCOPE.sCountry('contract_partner').Custom('CL_DAT')|L]#!#! за право унаследовать территории этой державы, если [SCOPE.sCountry('contract_partner').GetGovernment.GetRuler.GetName] умрёт, не оставив наследника. Это крупная трата, но в преспективе она способна принести нам значительную выгоду."
 inheritance_contract.1.a: "Мудрое вложение."
 inheritance_contract.3.title: "Договор о наследовании принёс плоды"
 inheritance_contract.3.desc: "Правитель #ONCLICK:COUNTRY,[SCOPE.sCountry('dead_ruler_country').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('dead_ruler_country').Custom('CL_tt')],X [SCOPE.sCountry('dead_ruler_country').Custom('CL_GEN')|L]#!#! умер, не оставив наследника. В соответствии с [Concept('inheritance_contract', 'договором о наследовании')|e] территория этой державы переходит под нашу корону."
 inheritance_contract.3.a: "Наше терпение вознаграждено."
 inheritance_contract.4.title: "Договор о наследовании утратил силу"
 inheritance_contract.4.desc: "[Concept('inheritance_contract', 'Договор о наследовании')|e], заключённый нами с #ONCLICK:COUNTRY,[SCOPE.sCountry('dead_paying_country').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('dead_paying_country').Custom('CL_tt')],X [SCOPE.sCountry('dead_paying_country').Custom('CL_GEN')|L]#!#!, утратил силу в связи со смертью нашего правителя. Средства, потраченные нами в надежде получить право наследования, пропали впустую."
 inheritance_contract.4.a: "Дорогая ошибка."
