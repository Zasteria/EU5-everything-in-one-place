l_russian:
 LOADING_TIP_0: "#T «Если слова одного монаха противоречат всему тысячелетнему христианскому учению, значит этот монах ошибается».#!\n#tooltip_subheading Карл V, император Священной Римской империи на рейхстаге в Вормсе, 1521#!"
 LOADING_TIP_1: "#T «Войны начинаются по вашей воле, но не прекращаются по вашему желанию».#!\n#tooltip_subheading Никколо Маккиавелли, #italic «История Флоренции»#!, 1521#!"
 LOADING_TIP_2: "#T «Короли — не только наместники Божьи на земле и восседают на Божьем троне, но и самим Богом называются богами».#!\n#tooltip_subheading Яков VI, король Шотландии, Англии, Франции и Ирландии, 1609#!"
 LOADING_TIP_3: "#T «Коль суждено погибнуть нам, — довольно потерь для родины; а будем живы, — чем меньше нас, тем больше будет славы».#!\n#tooltip_subheading Уильям Шекспир, #italic «Генрих V»#!, 1599#!"
 LOADING_TIP_4: "#T «Продать страну? Так почему бы не продать воздух, бескрайнее море, и самую Землю? Разве великий дух не создал их для всех своих детей?»#!\n#tooltip_subheading Текумсе, вождь шауни, 1810#!"
 LOADING_TIP_5: "#T «Священная Римская империя не была ни священной, ни Римской, ни империей».#!\n#tooltip_subheading Вольтер, #italic «Опыт о нравах и духе народов», том 3, глава 70#!, 1773#!"
 LOADING_TIP_6: "#T «Я положил за правило никогда не начинать несправедливых войн, но никогда не прекращать справедливые иначе как победой над всеми моими врагами».#!\n#tooltip_subheading Карл XII, король Швеции, 1699#!"
 LOADING_TIP_7: "#T «Ни одному искусству не учится одно правительство у другого так быстро, как искусству извлекать деньги из кармана своего народа».#!\n#tooltip_subheading Адам Смит, шотландский экономист, #italic «Исследование о природе и причинах богатства народов»#!, 1776#!"
 LOADING_TIP_8: "#T «Задумайтесь на минуту о том, что можете ошибаться».#!\n#tooltip_subheading Оливер Кромвель, лорд-проектор Содружества Англии, Шотландии и Ирландии, 1652#!"
 LOADING_TIP_9: "#T «Я вынужден с прискорбием признать: Людовик должен умереть, потому что родина должна жить».#!\n#tooltip_subheading Максимилиан Робеспьер, депутат Национального конвента, 1792#!"
 LOADING_TIP_10: "#T «Господь и Учитель наш Иисус Христос, говоря: „Покайтесь…“, заповедовал, чтобы вся жизнь верующих была покаянием».#!\n#tooltip_subheading Мартин Лютер, #italic «95 тезисов»#!, 1517#!"
 LOADING_TIP_11: "#T «От тебя мне ни помощи, ни пользы. Никогда бы не подумал, что ты поступишь так — я ожидал от тебя иного, но видимо всё зря…»#!\n#tooltip_subheading Реншильд Левенгаупту во время битвы у Полтавы, 1708#!"
 LOADING_TIP_12: "#T «Иди и воспламени мир!»#!\n#tooltip_subheading Игнатий де Лойола, баскский теолог, около 1540#!"
 LOADING_TIP_13: "#T «Коли уж пришлось запачкать руки, и мне не перестать быть пиратом, лучше уж быть командиром, чем матросом».#!\n#tooltip_subheading Чёрный Барт, валлийский капитан пиратов, 1719#!"
 LOADING_TIP_14: "#T «Лучше один день прожить львом, чем сто лет шакалом».#!\n#tooltip_subheading Типу Султан, «Тигр Майсура», около 1780#!"
 LOADING_TIP_15: "#T «Мы требуем от вас признать Церковь и её первосвященника, Папу, владыками вселенной».#!\n#tooltip_subheading Фердинанд II, король Арагона и Кастилии, #italic «Послание к таино и аравакам»#!, 1500#!"
 LOADING_TIP_16: "#T «Может ли честь приставить новую ногу? Нет. А уврачевать рану? Тоже нет. Что же она такое? Воздух».#!\n#tooltip_subheading Уильям Шекспир, #italic «Генрих IV», часть 1#!, 1597#!"
 LOADING_TIP_17: "#T «Продолжайте следовать моему праведному пути — он ещё не кончен».#!\n#tooltip_subheading Последние слова Камеамеа I, короля Гавайев, 1819#!"
 LOADING_TIP_18: "#T «Если в раю есть испанцы, я предпочитаю ад».#!\n#tooltip_subheading Атуэй, вождь таино, перед тем как испанцы сожгли его на костре, 1512#!"
 LOADING_TIP_19: "#T «Господи, забудем о покое и, исполнившись дерзости, выйдем в море навстречу шторму, который напомнит нам — ты над нами владыка, и потеряв землю из вида, мы обратим свой взор к звёздам небесным».#!\n#tooltip_subheading Сэр Френсис Дрейк, английский мореплаватель, 1577#!"
 LOADING_TIP_20: "#T «А что касается папы, я отвергаю его как врага Христа и Антихриста со всем его лжеучением».#!\n#tooltip_subheading Томас Кранмер, архиепископ Кентерберийский, 1566 г.#!"
 LOADING_TIP_21: "#T «Здесь во Флориде, Вирджинии, Новой Англии и Канаде больше земли, чем могли бы возделать все добрые христиане».#!\n#tooltip_subheading Капитан Джон Смит, английский колонист, 1631#!"
 LOADING_TIP_22: "#T «Мы должны получить свободу несмотря на все преграды. Если те, кто имеет состояния, не поддержат нас, они должны пасть; нам будет достаточно поддержки более многочисленного и достойного класса: людей, которые состояний не имеют». #!\n#tooltip_subheading Вольф Тон, ирландский революционер, 1796#!"
 LOADING_TIP_23: "#T «В Америке нет ни короля, ни лордов, ни церкви, утверждённой законом, и тем не менее эта часть Земли управляется лучше, чем любая другая».#!\n#tooltip_subheading Вольф Тон, ирландский революционер, 1796#!"
 LOADING_TIP_24: "#T «Мы считаем за очевидные истины, что все люди сотворены равными, что им даны их Творцом некоторые неотъемлемые права, в числе которых находятся — жизнь, свобода и право на счастье».#!\n#tooltip_subheading Декларация независимости Соединённых Штатов, 1776#!"
 LOADING_TIP_25: "#T «Конечно, правильны оба утверждения: и человек человеку Бог, и человек человеку волк».#!\n#tooltip_subheading Томас Гоббс, «О гражданине», 1651#!"
 LOADING_TIP_26: "#T «Нет более кроткого человека, чем оный в первобытном его состоянии, помещённого природою в равном расстоянии как от несмышлености скотов, так и от пагубного просвещения человека гражданского».#!\n#tooltip_subheading Жан-Жак Руссо, #italic «Рассуждение о начале и основании неравенства между людьми»#!, 1754#!"
 LOADING_TIP_27: "#T «Если кукушка не кукует, надо свернуть ей шею».#!\n#tooltip_subheading Ода Нобунага, японский даймё, 80-е годы XVI века#!"
 LOADING_TIP_28: "#T «Если кукушка не кукует, надо заставить её куковать».#!\n#tooltip_subheading Тоётоми Хидэёси, кампаку Японии, 90-е годы XVI века#!"
 LOADING_TIP_29: "#T «Если кукушка не кукует, надо подождать».#!\n#tooltip_subheading Токугава Иэясу, сёгун Японии, начало XVII века#!"
 LOADING_TIP_30: "#T «Я не свергаю короля, и не возвожу его на престол, но я служу моему сиру».#!\n#tooltip_subheading Бертран дю Геклен, бретонский генерал, 1369#!"
 LOADING_TIP_31: "#T «Что мне до шведов? Ненавижу их, Как ад кромешный…»#!\n#tooltip_subheading Фридрих Шиллер, немецкий драматург, #italic Смерть Валленштейна#!, 1799#!"
 LOADING_TIP_32: "#T «Город пал, мне незачем больше жить».#!\n#tooltip_subheading Последние слова византийского императора Константина XI, 1453#!"
 LOADING_TIP_33: "#T «Каждого француза следует ненавидеть как самого дьявола».#! \n #tooltip_subheading — Горацио Нельсон, британский адмирал, 1793#!"
 LOADING_TIP_34: "#T «Более я не могу подчиняться — мне довелось распробовать командование, и я не могу от него отречься».#!\n#tooltip_subheading Наполеоне Буонопарте, корсиканский лейтенант артиллерии, 1790#!"
 LOADING_TIP_35: "#T «Командир, который поставит который свой корабль борт о борт с неприятельским, не может считаться действовавшим неправильно».#!\n#tooltip_subheading Горацио Нельсон, британский адмирал, 1805#!"
 LOADING_TIP_36: "#T «#italic Honi soit qui mal y pense#!. Пусть стыдится подумавший плохо об этом»#!\n#tooltip_subheading Король Англии и Франции Эдуард III, девиз Ордена Подвязки, 1348#!"
 LOADING_TIP_37: "#T «Я бы отдал сто жизней, если б имел их и всё, чем я владею, чем допустил бы малейший удар по церкви и служению Господу, ибо я не желаю править еретиками».#!\n#tooltip_subheading Король Испании Филипп II, #italic письмо Папе Пию V#!, 1566#!"
 LOADING_TIP_38: "#T «То, как, по словам Вашего Превосходительства, вы обращаетесь со своими врагами, служит лишним подтверждением #italic Вашей#! щедрости, однако среди английской нации в целом она встречается редко».#!\n#tooltip_subheading Блас де Лесо, испанский адмирал, #italic из письма к вице-адмиралу Эдварду Вернону#!, 1739 г.#!"
 LOADING_TIP_39: "#T «Когда испанец мочится, он должен делать это в сторону Англии».#!\n#tooltip_subheading Блас де Лесо, испанский адмирал, во время осады Картахены-де-Индиас, 1741#!"
 LOADING_TIP_40: "#T «Ибо молитва есть ничто иное, как знак дружбы с Богом».#!\n#tooltip_subheading Святая Тереза Авильская, святая и Учитель Церкви, #italic «Житие Святой Терезы Авильской, написанной ей самой»#!, около 1565#!"
 LOADING_TIP_41: "#T «На испанском я говорю с Богом, на итальянском — с женщинами, по-французски — с мужчинами, и по-немецки с моей лошадью!»#!\n#tooltip_subheading Карл V, император Священной Римской империи, король Испании, эрцгерцог Австрии и пр.#!"
 LOADING_TIP_42: "#T «Сам ван выехал на лошади и пустил в оленя стрелу. Лошадь споткнулась и он упал, однако остался невредим. Оглянувшись вокруг, он сказал: „Не дайте хронистам узнать об этом“».#!\n#tooltip_subheading #italic «Подлинные записи династии Чосон», том 7, часть 4#!, около 1410#!"
 LOADING_TIP_43: "#T «Тот, кто цепляется за жизнь — умирает, тот, кто презирает смерть — живёт».\n#tooltip_subheading Уэсуги Кэнсин, японский даймё, 70-е годы XVI века#!"
 LOADING_TIP_44: "#T «Учение для человека — всё равно что ветви и листья для дерева. Без него он просто не сможет жить». \n#tooltip_subheading Такэда Сингэн, японский даймё, 50-e годы XVI века#!"
 LOADING_TIP_45: "#T «Враг в Хоннодзи». #!\n#tooltip_subheading Акэти Мицухидэ, генерал Ода, 1582#!"
 LOADING_TIP_46: "#T «Англичане до крайности любят сами себя и всё, что им принадлежит; для них нет других людей, кроме них самих, и нет другого мира помимо Англии».#!\n#tooltip_subheading Андреа Тревизан, венецианский дипломат, 1498#!"
 LOADING_TIP_47: "#T «Покуда в Каталонии останется хоть один каталонец, у нас всегда будут враги и всегда будет война».#!\n#tooltip_subheading Франсиско де Кеведо, кастильский писатель, 1645"
 LOADING_TIP_48: "#T «Испания во многих местах своих практически пустынна. Причиной тому — ленность её народа, во многом напоминающая валлийскую…»#!\n#tooltip_subheading Фрэнсис Уиллоби, английский писатель, 1673#!"
 LOADING_TIP_49: "#T «В Англии шестьдесят разных религий и только один соус».#!\n#tooltip_subheading Франческо Караччоло, неаполитанский адмирал, ум. в 1799 г.#!" #HP Sauce?
 LOADING_TIP_50: "#T «Настал день, говорю я, когда — как и во всякий другой — выкажется могущество моей руки и я совершу подвиги, имеющие быть вписанными в книгу славы в назидание грядущим векам».#! \n #tooltip_subheading Кастильский писатель Мигель де Сервантес, #italic «Хитроумный идальго Дон Кихот Ламанчский»#!, 1605#!"
 LOADING_TIP_51: "#T «Мои солдаты разбили врага при Росбахе, не сделав почти ни единого выстрела».#! \n #tooltip_subheading Король Пруссии Фридрих II Великий, около 1757 года#!"
 LOADING_TIP_52: "#T «Железо ржавеет, не находя себе применения; стоячая вода гниёт или на холоде замерзает, а ум человека, не найдя себе применения, чахнет».#! \n #tooltip_subheading — Леонардо да Винчи, флорентийский мыслитель, ок. 1500 г.#!"
 LOADING_TIP_53: "#T «Красота — результат формы и соответствия целого по отношению к отдельным частям, частей по отношению друг к другу и снова — к целому».#! \n #tooltip_subheading — Андреа Палладио, венецианский архитектор, #italic «Четыре книги об архитектуре»#!, 1570 г.#!"
 LOADING_TIP_54: "#T «Природа отлила его и разбила льяло!»#! \n #tooltip_subheading — Лудовико Ариосто, феррарский поэт, #italic «Неистовый Роланд»#!, 1532 г.#!"
 LOADING_TIP_55: "#T «Я — секретарь мира».#! \n #tooltip_subheading — Пьетро Аретино, аретинский сатирик, ок. 1530 г.#!"
 LOADING_TIP_56: "#T «Её [Вселенную] нельзя понять, не научившись сначала понимать её язык, и не изучив буквы, которыми она написана. А написана она на математическом языке».#! \n #tooltip_subheading — Галилео Галилей, пизанский физик, #italic «Пробирщик»#!, 1623 г.#!"
 LOADING_TIP_57: "#T «Выполнить задачу мы намеревались ночью, поскольку, возьмись мы за неё днём, мы бы лишь погубили себя. Видит Бог, мы поступили правильно, и я считаю, что только благодаря этому мы одержали победу».#! \n #tooltip_subheading — Ферндадо д’Авалос, маркиз ди Пескара, командир имперских войск в битве при Павии, 1525 г.#!"
 LOADING_TIP_58: "#T «Всё потеряно, кроме чести».#! \n #tooltip_subheading — Франциск I, король Франции — о битве при Павии, 1525 г.#!"
 LOADING_TIP_59: "#T «Нет ничего радостного в том, чтобы пленить короля-христианина».#! \n #tooltip_subheading — Карл V, император Священной Римской Империи — о битве при Павии, 1525 г.#!"
 LOADING_TIP_60: " #T \"But it seems that this holy battle, which was won near Tarifa, was much more virtuous than the one they say took place at Ubeda.\"#! \n #tooltip_subheading — Fernán Sánchez de Valladolid, Castilian chronicler, comparing the battle of Río Salado with Las Navas de Tolosa, #italic Crónica de Alfonso XI#!, c. 1344#!"
 LOADING_TIP_d008_0: "#T «Эти греки были чрезвычайно набожны в своих богослужениях, в которых участвовали не только жрецы, но и воины; все они читали псалмы на своём языке, к какому бы сословию ни относились».#! \n #tooltip_subheading Валлийский историк Адам из Аска, около 1399 года#!"
 LOADING_TIP_d008_1: "#T «Лучше турецкая чалма, чем папская тиара».#! \n #tooltip_subheading Византийский флотоводец Лука Нотара, около 1453 года#!"
 LOADING_TIP_d008_2: "#T «Бог не попустит мне жить императором без империи. Если город падёт, я паду с ним».#! \n #tooltip_subheading Византийский император Константин XII, 1453#!"
 LOADING_TIP_d008_3: "#T «Мы отвратились от них (латинян) как еретиков и поэтому отмежевались от них».#! \n #tooltip_subheading Византийский богослов Марк Эфесский, около 1439 года#!"
 LOADING_TIP_d009_0: " #T \"When I think carefully about myself, most illustrious Queen, and put before my eyes the antiquity of all the things that were written for our remembrance and memory, one thing I find and draw as a very certain conclusion: that language has always been the companion of empire.\"#! \n #tooltip_subheading — Antonio de Nebrija, Castilian humanist, Prologue to #italic Gramática de la Lengua Castellana#!, 1492#!"
 LOADING_TIP_d009_1: " #T \"Learning does not blunt the iron of the lance, nor makes weak the sword in the knight's hand.\"#! \n #tooltip_subheading — Íñigo López de Mendoza, 1st Marquis of Santillana, Castilian poet and statesman, #italic Proverbios#!, 1437#!"
 LOADING_TIP_d009_2: " #T \"In authority of persons, in ornament of virtues, and in the abilities they possessed, both in learning and in arms, the Castilians were no less excellent than those Greeks, Romans, and Frenchmen so praised in their writings.\"#! \n #tooltip_subheading — Hernando del Pulgar, Castilian chronicler, Prologue to #italic Claros Varones de Castilla#!, c. 1486#!"
 LOADING_TIP_d009_3: " #T \"This work has come to bedeck the Alhambra, a dwelling for men of peace and for warriors, a fortress and a mansion to be enjoyed.\"#! \n #tooltip_subheading — Ibn al-Jayyāb, court poet and vizier of Granada, Alhambra inscription, Tower of the Captive, before 1349#!"
 LOADING_TIP_d009_4: " #T \"I am a garden graced by every beauty — see my splendor, and you will know my being.\"#! \n #tooltip_subheading — Ibn Zamrak, poet and vizier of Granada, Alhambra inscription, Hall of the Two Sisters, c. 1370s#!"
 LOADING_TIP_d009_5: " #T \"Take, my lord, the keys of this paradise. I and those within it are yours.\"#! \n #tooltip_subheading — Muhammad XII 'Boabdil', last Nasrid Emir of Granada, at the surrender of Granada, 1492#!"
 LOADING_TIP_d009_6: " #T \"I have indeed attained my desire in this world, which was to travel through the earth, and I have attained, in this respect, what no other person has attained to my knowledge.\"#! \n #tooltip_subheading — Ibn Battuta, Tangier-born traveler, #italic Rihla#!, c. 1355#!"
 LOADING_TIP_d009_7: " #T \"The vanquished always want to imitate the victor in his distinctive characteristics, his dress, his occupation, and all his other conditions and customs.\"#! \n #tooltip_subheading — Ibn Khaldun, historian in the service of the Marinid Sultans of Fez, #italic Muqaddimah#!, 1377#!"
 LOADING_TIP_d009_8: " #T \"Defeating the Spanish and conquering the Americas would make the peoples as far as the Indies submit to our rule.\"#! \n #tooltip_subheading — Aḥmad al-Manṣūr, Saadi Sultan of Morocco, letter to Elizabeth I of England, c. 1600#!"
