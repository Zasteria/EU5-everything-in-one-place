l_english:
 pmcql_army_on: "Army raise: ON"
 pmcql_army_off: "Army raise: OFF"
 pmcql_navy_on: "Navy raise: ON"
 pmcql_navy_off: "Navy raise: OFF"
 pmcql_peace_on: "Peace dismiss: ON"
 pmcql_peace_off: "Peace dismiss: OFF"
 pmcql_army_desc: "Toggle the game's native automatic raising of army levies at war."
 pmcql_navy_desc: "Toggle the game's native automatic raising of navy levies at war."
 pmcql_peace_desc: "Automatically dismiss army and navy levies while at peace with every country. Uses native dismissal requirements and preserves regular units. Checks daily and retries blocked levies when allowed. Enabling while at peace also dismisses existing levies. Opens the military overview automatically to dismiss levies, even with Default minimized. Leave that overview open if levies are temporarily blocked. Turn off to keep levies raised at peace. Army and navy auto-raise settings are separate."
