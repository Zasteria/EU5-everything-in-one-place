l_english:
 pmcq_port_presence: "Port Presence"
 pmcq_port_presence_desc: "Generate maritime presence across all sea tiles in the sea province adjoining this port while the fleet stays docked. Every sea tile receives the full monthly contribution. Contribution scales with ship types and number, using their base presence ratings and the fleet's presence modifier. Applied on the normal monthly country update while at peace, with a combined fleet contribution capped at 0.9 maritime power per payout, applied in full to every covered sea tile. Automatically turns off when the fleet moves or leaves its starting port; checked each game day. Activate it again after docking to resume. Suspended during war; resumes at peace. Moving or combat ends this action. Existing presence follows normal decay."
 pmcq_port_presence_cta: "Click to enable Port Presence while docked at peace."
 not_pmcq_port_presence: "Stop Port Presence"
 not_pmcq_port_presence_desc: "Stop generating maritime presence from this docked fleet."
 not_pmcq_port_presence_cta: "Click to stop Port Presence."

 pmcqpp_on: "ON"
 pmcqpp_off: "OFF"

 pmcqpp_readout_tip: "Pulses count completed monthly payouts. Power/tile is the last calculated monthly contribution per sea tile. Added total is the last measured gain summed across tiles. Payouts occur on the normal monthly country update while at peace; war pauses the timer. Movement is checked daily and disables the action."

 pmcqpp_header_tip: "Click to enable or disable Port Presence for this fleet. The maritime presence button has a white glowing highlight while enabled, including while suspended during war. Enabling requires the fleet to be stationary in port at peace. Movement automatically disables it on the next daily check."

 pmcqpp_header_tooltip_on: "#T Port Presence — ON#!\nThis docked fleet adds maritime presence to every sea tile in the adjoining sea province on the monthly update. Each tile receives the full contribution, based on the fleet's ships and maritime presence modifier.\n\nPauses during war. Moving, leaving the starting port, or entering combat turns it off on the next daily check.\n\nClick to turn off."
 pmcqpp_header_tooltip_off: "#T Port Presence — OFF#!\nGenerate maritime presence while this fleet stays in port. Every sea tile in the adjoining sea province receives the full contribution on the monthly update, based on the fleet's ships and maritime presence modifier.\n\nTo enable: be at peace with the fleet stationary in port, out of combat and not exiled. Pauses during war and turns off when the fleet moves or leaves port.\n\nClick to turn on."
