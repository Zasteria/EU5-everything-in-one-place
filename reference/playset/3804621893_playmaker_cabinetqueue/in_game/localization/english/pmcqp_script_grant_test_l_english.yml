 pmcqp_script_test: "Script grant test"
 pmcqp_script_test_desc: "Experimental: grant Strengthened Faith through script once. Use a disposable copy of a save without that privilege. Eligibility and affordability are checked. The configured grant price and satisfaction changes apply only if ownership is confirmed. Clergy gain 15%; other non-Crown estates lose 10% of their pre-grant power share. Compare with a normal grant from the same starting save; equivalence and implementation behavior still require verification."
