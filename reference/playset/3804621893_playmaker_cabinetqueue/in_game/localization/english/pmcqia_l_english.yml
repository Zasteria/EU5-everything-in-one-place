l_english:
 pmcqia_button: "Integrate All"
 pmcqia_outliner_integrate: "INT"
 pmcqia_outliner_culture: "CUL"
 pmcqia_outliner_integrate_desc: "Integrate All\n\n$pmcqia_desc$"
 pmcqia_outliner_culture_desc: "Culture Convert All\n\n$pmcqia_culture_desc$"
 pmcqia_desc: "Assign Auto Integrate to eligible cabinet slots, one slot at a time. Includes empty slots; keeps existing members and skips slots already set to Auto Integrate or encouraging a societal value. Uses normal game availability. Slots that cannot be switched are counted as failed. Leave the action menus open while it works."
 pmcqia_stop: "Stop switching"
 pmcqia_stop_desc: "Stop further cabinet changes. Tasks already assigned stay assigned."

 pmcqia_culture_button: "Culture Convert All"
 pmcqia_culture_desc: "Assign Queued Increase Control and Queued Noblesse Oblige when available, then Auto Assimilate to Core to the remaining cabinet slots. Preserve slots encouraging a societal value, existing queued control assignments, and cabinet members. Skip locked control actions. Uses the existing province-control queue; add provinces and Start it separately. Leave the cabinet menus open while assignments run."
 pmcqia_outliner_stop: "STOP"
