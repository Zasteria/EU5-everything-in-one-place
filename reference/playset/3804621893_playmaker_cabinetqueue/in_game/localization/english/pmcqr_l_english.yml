l_english:
 pmcqb_toggle: "Automatic +20 stability"
 pmcqb_toggle_desc: "When On, stability is 80 or below, and Peasant satisfaction is at least 45%, use Ask Commoners for Stability as soon as its native requirements and five-year cooldown allow. Selects the eligible Peasants or Dhimmi estate with the highest satisfaction. Costs 20 percentage points of estate satisfaction, just like the manual button."
 pmcqb_on: "Auto: On"
 pmcqb_off: "Auto: Off"
 pmcqr_subjects: "Add all subjects"
 pmcqr_antagonism: "Add antagonistic nations"
 pmcqr_antagonism_desc: "Append discovered nations in diplomatic range with antagonism toward you strictly above the selected threshold. Use the adjacent minus/plus buttons to choose 10, 20, 30, 40, or 50 (default 30). Skip duplicates and preserve existing queue order. Previously finished nations can be added again. Does not start a paused queue. Normal Improve Relations requirements and completion limits still apply."
 pmcqr_antagonism_less: "Lower antagonism threshold"
 pmcqr_antagonism_less_desc: "Lower the threshold by 10, to a minimum of 10. Applies to the next Add antagonistic nations click; does not change the existing queue."
 pmcqr_antagonism_more: "Raise antagonism threshold"
 pmcqr_antagonism_more_desc: "Raise the threshold by 10, to a maximum of 50. Applies to the next Add antagonistic nations click; does not change the existing queue."
 pmcqr_subjects_desc: "Append all current direct subjects to the relations queue, including previously improved or completed subjects. Clears old completion and retry records for re-added subjects. Skips duplicates and preserves existing queue order and active assignments. Current native limits still apply; Continue at +200 controls the total-opinion stopping rule. Does not start a paused queue."
 pmcqr_continue: "Continue at +200"
 pmcqr_continue_desc: "Toggle whether to keep improving after total opinion reaches +200. When On, stop only at the native Improve Relations cap. Already completed nations must be added again."
 pmcqr_continue_on: "Continue at +200: On"
 pmcqr_continue_off: "Continue at +200: Off"
 pmcqx_toggle: "Automatic subject annexation"
 pmcqx_less: "Lower annexation maximum"
 pmcqx_less_desc: "Lower the maximum simultaneous annexations. Counts manual annexations and pending automatic starts. Ongoing annexations are never cancelled by lowering the maximum."
 pmcqx_more: "Raise annexation maximum"
 pmcqx_more_desc: "Raise the maximum simultaneous annexations, up to 20. Native eligibility, available diplomats and costs still apply."
 pmcqx_toggle_desc: "Watch all direct subjects and start normal annexation when the native Start Annexation action is available. Includes future subjects. Uses normal diplomats, costs and requirements. Turning Off stops new starts but leaves ongoing annexations running. Independent of the relations queue and its Max limit."
 pmcqx_on: "Auto-annex subjects: On"
 pmcqx_off: "Auto-annex subjects: Off"
 pmcqr_title: "Improve Relations Queue"
 pmcqr_pick: "Add Nations to Relations Queue"
 pmcqr_remove_pick: "Remove a waiting nation (pause to recall assigned diplomats first)"
 pmcqr_add: "Add nation"
 pmcqr_add_desc: "Select multiple nations, then Confirm to append them in selection order. Nations already in the queue or current selection cannot be selected twice. Finished nations can be explicitly added again; Confirm clears their old completion record. Cancel discards the selection. Finished nations are never automatically resent. Ended dispatches, including manual recalls or failed starts, are not retried."
 pmcqr_remove: "Remove nation"
 pmcqr_remove_desc: "Remove a waiting nation. To remove an assigned nation, pause and let the queue recall its diplomat first."
 pmcqr_clear: "Clear queue"
 pmcqr_clear_desc: "Clear all waiting nations. Pause first and allow assigned diplomats to be recalled."
 pmcqr_start: "Start relations queue"
 pmcqr_start_desc: "Improve relations with queued nations up to your assignment limit. Stop at the native improvement cap or +200 opinion. Disable other Improve Opinion automation to avoid competing orders."
 pmcqr_pause: "Pause relations queue"
 pmcqr_pause_desc: "Recall assignments started by this queue, retaining unfinished nations. Cleanup runs on the next scan. Manually started assignments are not recalled."
 pmcqr_less: "Use fewer diplomats"
 pmcqr_less_desc: "Lower the maximum simultaneous queue assignments (minimum 1). Excess assignments are recalled on the next scan."
 pmcqr_more: "Use more diplomats"
 pmcqr_more_desc: "Raise the maximum simultaneous queue assignments (maximum 20). Native diplomat availability and action requirements still apply."

 pmcqr_priority_desc: "Move this waiting nation to the front of the relations queue. The next available diplomat will prioritize it when eligible. Current assignments continue."
 pmcqb_header_on: "Autostab: On"
 pmcqb_header_off: "Autostab: Off"
