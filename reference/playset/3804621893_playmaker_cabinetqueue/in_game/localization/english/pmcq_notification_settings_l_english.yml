l_english:
 pmcq_circle_block_on: "Circle block: ON"
 pmcq_circle_block_off: "Circle block: OFF"
 pmcq_circle_block_tip: "Block AI requests for money, privileges, infrastructure and titles sent to you as Circle leader. Existing requests and Circle events are unaffected. This setting is saved."
 pmcq_popup_mute_on: "Popup mute: ON"
 pmcq_popup_mute_off: "Popup mute: OFF"
 pmcq_popup_mute_tip: "Automatically dismiss ordinary informational message popups. Events, diplomatic decisions, alerts and side notifications remain. This setting is saved."
 pmcq_event_memory_on: "Remembered events: ON"
 pmcq_event_memory_off: "Remembered events: OFF"
 pmcq_event_memory_tip: "Enable automatic selection of remembered standard event options. Test version: exact event title and option text must match. Choices are stored in your campaign save. Identical titles and option text share a preference."
 pmcq_event_remember: "Remember"
 pmcq_event_saved: "Saved"
 pmcq_event_remember_tip: "Left-click to select this option and remember it for matching events in this campaign. Right-click to forget this event. If the saved option is absent, the event stays open. Dynamic titles or option text may not match."
