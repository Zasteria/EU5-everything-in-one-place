l_english:
 pmcqie_action: "Auto Integrate Area"
 pmcqie_action_action: "Auto Integrate Area"
 pmcqie_action_active: "Auto Integrate Area"
 pmcqie_action_desc: "Automatically integrate owned provinces throughout an area, then move to the next eligible area. Requires the Integrate Area advance. Selects an available area containing a high-population conquered province, reserves its owned provinces against other automatic integration assignments, and continues until its conquered and colonized land is integrated. Multiple cabinet slots may work on separate areas. Ends the task when no eligible area remains."
 pmcqie_action_action_desc: "$pmcqie_action_desc$"
