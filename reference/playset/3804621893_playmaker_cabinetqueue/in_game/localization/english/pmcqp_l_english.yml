l_english:
 pmcqp_research: "Research"
 pmcqp_dismantle_hre: "Dismantle HRE"
 pmcqp_add_hre_locations: "Add land to HRE"
 pmcqp_add_hre_locations_desc: "Hold to add your eligible land to the Holy Roman Empire. Requires HRE membership. Adds passable land connected to existing imperial territory, skipping conquered and already imperial locations. Rechecks as the imperial border expands. No debug mode is needed."
 pmcqp_dismantle_hre_desc: "Dismantle the Holy Roman Empire immediately, bypassing normal peace treaty requirements. Available to any player country while the Empire exists. Hold to execute."
 pmcqp_research_desc: "Queue Improved Religious Organization, Classic Scholasticism, Universal Christianity, then Guilds when available. Skip unavailable or already queued/researched entries. Existing research is preserved. Opens the research screen."
 pmcqp_economy: "Recommended Setup"
 pmcqp_economy_desc: "Enable automatic estate taxes and minting, maximum court spending, zero diplomatic spending, automatic generals/admirals, skill staffing, automatic army/navy levies with peacetime dismissal, and Autostab estate interactions. Peacetime dismissal begins on the next day when newly enabled. Tax satisfaction targets: Nobility 1%, Burghers 1%, Clergy 100%, Peasants 45%, Tribes 100%, Dhimmi 25%. Replaces full finance automation with these individual settings. Applies once, closes Economy, and returns to Theplaymaker General in the Mod Menu."
