l_english:
 pmcqp_centralization: "Centralization"
 pmcqp_centralization_desc: "Grant missing eligible privileges that move toward Centralization. Each successful new grant pays the configured price and applies satisfaction changes using its own values and current estate power. Owned, unavailable and unaffordable privileges are skipped. Country-specific restrictions and conflicts still apply. Does not open menus or assign cabinet members."
