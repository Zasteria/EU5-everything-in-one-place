l_english:
 pmcq_add:0 "Cabinet Queue: Add Province"
 pmcq_add_desc:0 "Select multiple owned provinces, then Confirm to append them in selection order. Selected provinces cannot be selected twice. Cancel discards the selection. Pause before editing."
 pmcq_remove:0 "Cabinet Queue: Remove Province"
 pmcq_remove_desc:0 "Remove a province from the queue. Pause before editing."
 pmcq_clear:0 "Cabinet Queue: Clear"
 pmcq_clear_desc:0 "Clear the paused queue."
 pmcq_start:0 "Cabinet Queue: Start / Restart"
 pmcq_start_desc:0 "Assign a member to Queued Increase Control, Queued Noblesse Oblige, or both. Start applies only the assigned actions to one eligible province at a time and rotates after your selected 1-6 month stay. Noblesse Oblige alone requires its reform."
 pmcq_pause:0 "Cabinet Queue: Pause"
 pmcq_pause_desc:0 "Stop the queue and remove its bonuses. Custom cabinet assignments and queued provinces are retained."
 pmcq_pick:0 "Choose a province for the cabinet queue"
 pmcq2_control_action:0 "Queued Increase Control"
 pmcq2_control_action_desc:0 "Reserve this cabinet seat for the province queue. Works alone or alongside Queued Noblesse Oblige. Add provinces and press Start on the Cabinet Queue panel."
 pmcq2_nobles_action:0 "Queued Noblesse Oblige"
 pmcq2_nobles_action_desc:0 "Reserve this cabinet seat for the province queue. Works alone or alongside Queued Increase Control. Requires Noblesse Oblige. Provides its control and nobles satisfaction bonuses while participating in a running queue."
 pmcq2_control_bonus:0 "Queued Increase Control"
 pmcq2_control_bonus_desc:0 "Control support from the cabinet queue. Refreshed daily while active."
 pmcq2_nobles_bonus:0 "Queued Noblesse Oblige"
 pmcq2_nobles_bonus_desc:0 "Noble control support from the cabinet queue. Refreshed daily while active."

 # Cabinet UI requests suffix keys in addition to the base action ID.
 pmcq2_control_action_action:0 "Queued Increase Control"
 pmcq2_control_action_active:0 "Queued Increase Control"
 pmcq2_control_action_action_desc:0 "Reserve a cabinet member for the repeating province-control queue."
 pmcq2_nobles_action_action:0 "Queued Noblesse Oblige"
 pmcq2_nobles_action_active:0 "Queued Noblesse Oblige"
 pmcq2_nobles_action_action_desc:0 "Reserve a cabinet member for the Noblesse Oblige province queue."
 # Alias for the alternate prefix reported in the active-state label.
 mcwq2_nobles_action_active:0 "Queued Noblesse Oblige"
