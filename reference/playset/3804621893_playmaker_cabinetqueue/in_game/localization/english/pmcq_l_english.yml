 pmcqt_government_remaining: " ([GetPlayer.MakeScope.ScriptValue('pmcqt_government_months')|0] mo)"
 pmcqt_diplomats_remaining: " ([GetPlayer.MakeScope.ScriptValue('pmcqt_diplomats_months')|0] mo)"
 pmcqt_parliament_remaining: " ([GetPlayer.MakeScope.ScriptValue('pmcqt_parliament_months')|0] mo)"

 pmcqpm_pick: "Select provinces for the cabinet queue"

 pmcq_add_all: "Cabinet Queue: Add All Provinces"
 pmcq_add_all_desc: "Append all owned provinces to the manual control queue, skipping provinces already queued. Existing order is preserved. Pause before editing; press Start when ready."
 pmcq_ui_add_all: "Add All"

 pmcqd_relations_bonus: "Temporary Diplomatic Endeavors: Relations"
 STATIC_MODIFIER_NAME_pmcqd_relations_bonus: "Temporary Diplomatic Endeavors: Relations"

 pmcqs_subject_size_desc: "Target provinces per new subject (1-4). Each added province must border the new subject. Defaults to 2; leftovers form smaller subjects."
