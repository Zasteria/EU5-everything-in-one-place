 pmcq_ui_minus:0 "-"
 pmcq_ui_expand:0 "Cabinet Queue  +"
 pmcq_ui_add:0 "Add province"
 pmcq_ui_remove:0 "Remove"
 pmcq_ui_clear:0 "Clear"
 pmcq_ui_start:0 "Start / Restart"
 pmcq_ui_pause:0 "Pause"
