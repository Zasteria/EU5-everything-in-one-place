 Static_modifier_name_pmcq2_nobles_bonus:0 "Queued Noblesse Oblige"

 pmcq_ui_plus:0 "+"
 pmcq_months_less:0 "Shorter province stay"
 pmcq_months_less_desc:0 "Reduce the stay by one month, down to a minimum of 1. Applies when the next province starts. Start / Restart begins again at the first province with the new duration."
 pmcq_months_more:0 "Longer province stay"
 pmcq_months_more_desc:0 "Increase the stay by one month, up to a maximum of 6. Applies when the next province starts. Start / Restart begins again at the first province with the new duration."

 pmcqa_action:0 "Auto Assimilate to Core"
 pmcqa_action_action:0 "Auto Assimilate to Core"
 pmcqa_action_active:0 "Auto Assimilate to Core"
 pmcqa_action_desc:0 "Automatically promote your primary culture in an integrated province. All locations in the province receive the bonus, including cores. Once the province is fully cored, move to the next eligible province."
 pmcqa_action_action_desc:0 "$pmcqa_action_desc$"
 pmcqa_bonus:0 "Auto Assimilate to Core"
 STATIC_MODIFIER_NAME_pmcqa_bonus:0 "Auto Assimilate to Core"

 pmcq_toggle_culture: "Switch province source"
 pmcq_toggle_culture_desc: "Switch between your manual province list and owned provinces currently targeted by culture assimilation. Culture mode refreshes daily, skips provinces at 95% control or higher, and uses the selected 1-6 month stay. Both queued control actions follow this source. Your manual list is preserved."

 pmcqi_action: "Auto Integrate Provinces"
 pmcqi_action_action: "Auto Integrate Provinces"
 pmcqi_action_active: "Auto Integrate Provinces"
 pmcqi_action_desc: "Automatically integrate conquered provinces, prioritizing population. Once all owned locations in the current province are integrated or cores, move to the next eligible province. Runs independently of the control queue. When no unassigned eligible province remains, ends the task and keeps the cabinet member appointed."
 pmcqi_action_action_desc: "$pmcqi_action_desc$"
 pmcqi_bonus: "Automatic Province Integration"
 pmcqi_bonus_desc: "Integration support from the cabinet member assigned to Auto Integrate Provinces."
 STATIC_MODIFIER_NAME_pmcqi_bonus: "Automatic Province Integration"

 pmcq_multi_member_help: "Multiple cabinet members supported; each works on a separate province."

 pmcqd_boost: "Diplomatic Boost until Month-End"
 pmcqd_boost_desc: "Temporarily matches Diplomatic Endeavors using the best currently assigned cabinet member for diplomacy, including country and character cabinet efficiency. Grants diplomatic reputation and improved relations impact, topping up only what existing Diplomatic Endeavors, Bironovshchina or Posolsky do not already provide. With no assigned member, only the spending top-up applies. Also supplies the missing portion of the +3 reputation from full diplomatic spending. Recalculates daily; click again to refresh immediately. Does not stack, hire, reassign members, charge money or move your slider. Expires on the next calendar month's first daily check."
 pmcqd_cabinet_bonus: "Temporary Diplomatic Endeavors"
 STATIC_MODIFIER_NAME_pmcqd_cabinet_bonus: "Temporary Diplomatic Endeavors"
 pmcqd_slider_bonus: "Temporary Diplomatic Spending Top-Up"
 STATIC_MODIFIER_NAME_pmcqd_slider_bonus: "Temporary Diplomatic Spending Top-Up"

 pmcq_debug_on: "Debug ON"
 pmcq_debug_off: "Debug OFF"

 pmcq_estate_title: "Estates | Green = available | Parliament: Burghers"

 pmcqs_forts: "Remove Forts"
 pmcqs_forts_desc: "Remove stockades, castles and city walls in all your owned locations. Other building types are untouched. Hold to execute."
 pmcqs_subjects: "Create Subjects"
 pmcqs_subjects_desc: "Create standard vassals with up to [GetPlayer.MakeScope.GetVariable('pmcqs_subject_size').GetValueWithDefault('(CFixedPoint)2')|0] adjacent eligible provinces each. Excludes your capital, colonized land, and fully integrated or cored provinces. Leftovers form smaller subjects, including one-province subjects. Hold to execute."



