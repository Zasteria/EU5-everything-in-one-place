l_english:
 pmcqsg_title: "Auto Gift (Experimental)"
 pmcqsg_help: "Send direct gold transfers for 10 favors and the normal gift opinion modifier. Runs when enabled, when Run now is clicked, and monthly. No gift window or diplomat is used. OFF by default."
 pmcqsg_on: "Auto Gift: ON"
 pmcqsg_off: "Auto Gift: OFF"
 pmcqsg_toggle_tip: "Turning ON immediately checks every target. Turning OFF stops further transfers; existing cooldowns and targets are preserved."
 pmcqsg_add: "Add nations"
 pmcqsg_add_desc: "Select several nations to add to the Auto Gift list."
 pmcqsg_pick: "Choose Auto Gift targets"
 pmcqsg_reserve: "Gold to keep after each gift"
 pmcqsg_reserve_tip: "A gift is skipped unless you can pay its entire cost and retain this reserve. Later targets are checked against the gold remaining after earlier gifts."
 pmcqsg_columns: "Nation                                      Cost for 10 favors               Status"
 pmcqsg_price_tip: "Cost for 10 favors, using the game's scaled monthly income and your gift-cost modifier. The displayed amount is the same quote used for the direct gold transfer."
 pmcqsg_ready: "Ready"
 pmcqsg_cooldown: "Gift cooldown"
 pmcqsg_war: "At war with target"
 pmcqsg_range: "Out of range / unknown"
 pmcqsg_funds: "Need more gold"
 pmcqsg_cap: "Too near favor cap"
 pmcqsg_invalid: "Invalid target"
 pmcqsg_remove: "Remove"
 pmcqsg_empty: "Add nations, then turn Auto Gift ON."
 pmcqsg_note: "Each target has a saved 10-year cooldown that also blocks manual Send Gift. Native gift cooldowns are respected. Prices and statuses refresh when this menu opens or a check runs."
 pmcqsg_run: "Run now"
 pmcqsg_run_tip: "Check all listed nations now. Sends eligible gifts immediately, including while paused. Cannot bypass cooldowns or the gold reserve."
 pmcqsg_back: "Back to Mod Menu"
 pmcqsg_selection_help: "Select nations in the list or on the map, then Confirm.\nClick a selected list row again to deselect it."
 pmcqsg_selection_toggle: "Select or deselect this nation. Confirm adds all selected nations to Auto Gift."
 pmcqsg_manual_cooldown_tip: "\n#R Auto Gift cooldown: a gift has already been sent to this nation. Wait until its 10-year cooldown expires.#!"
