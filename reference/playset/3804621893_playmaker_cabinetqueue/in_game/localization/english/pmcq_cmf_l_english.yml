l_english:
 pmcq_name: "Theplaymaker"
 pmcq_desc: "Cabinet automation, diplomacy shortcuts, event favorites and quality-of-life tools."
 pmcq__general_name: "General"
 pmcq__diplomacy_name: "Diplomacy"
 pmcq__general__notifications_name: "Notifications"
 pmcq__general__notifications_desc: "Choose which recurring requests and notifications to suppress."
 pmcq__memory_name: "Message Memory"
 pmcq__memory__events_name: "Message Memory (Experimental)"
 pmcq__memory__events_desc: "Experimental feature. The master switch controls event stars and all automatic favorites behavior. OFF by default. You can browse or load saved favorites without enabling it."
 pmcq__general__hre_name: "Holy Roman Empire"
 pmcq__general__hre_desc: "Add eligible land to the HRE or open the dismantle tool."
 pmcq__diplomacy__shortcuts_name: "Country-panel shortcuts"
 pmcq__diplomacy__shortcuts_desc: "Choose any action from the live diplomacy list for each of the six positions. Choices save with the campaign. Both shortcut rows remain visible."
 pmcq__block_circles_name: "Block Imperial Circle requests"
 pmcq__block_circles_desc: "Suppress routine Circle leader requests, including requests for gold. Enabled by default."
 pmcq__mute_notifications_name: "Suppress notifications"
 pmcq__mute_notifications_desc: "Use the existing notification suppression feature. This does not disable event choices."
 pmcq__favorites_system_name: "Enable Favorites System (Experimental)"
 pmcq__favorites_system_desc: "Master switch, OFF by default. OFF hides the favorite stars beside event choices and disables automatic selection and popup hiding. ON shows the stars and allows automatic selection if enabled below. Saved favorites are kept when switched off."
 pmcq__remember_events_name: "Automatically choose remembered events"
 pmcq__remember_events_desc: "Requires Enable Favorites System to be ON. Automatically selects an available remembered choice and hides its event popup. OFF leaves the stars available for saving choices manually. OFF by default; saved with this campaign."
 pmcq__event_catalog_name: "Event Favorites"
 pmcq__event_catalog_desc: "Browse events, preview available effects and star preferred choices. Selecting a favorite does not fire its event."
 pmcq__event_catalog_text: "Open Event Favorites"
 pmcq__load_preset_name: "Load saved event choices"
 pmcq__load_preset_desc: "Open the installed preset loader. Importing does not enable automatic event selection."
 pmcq__load_preset_text: "Open preset loader"
 pmcq__add_hre_name: "Add land to HRE"
 pmcq__add_hre_desc: "Add eligible connected land to the HRE. Requires HRE membership and eligible land."
 pmcq__add_hre_text: "Add land to HRE"
 pmcq__dismantle_hre_name: "Dismantle HRE"
 pmcq__dismantle_hre_desc: "Open the hold-to-confirm control to dismantle the HRE immediately."
 pmcq__dismantle_hre_text: "Open dismantle tool"
 pmcq_cmf_preset_help: "Load the installed preset below. Existing unrelated favorites are kept. Enable automatic selection separately in Mod Menu > Theplaymaker > Message Memory."
 pmcq_cmf_dismantle_help: "Hold the button below to dismantle the Holy Roman Empire immediately, bypassing normal peace treaty requirements."
 pmcq__diplo_slot_1_name: "Shortcut 1"
 pmcq__diplo_slot_1_desc: "Choose any diplomatic action for position 1, counting from the left. Opens a searchable picker; choosing an action only assigns the shortcut."
 pmcq__diplo_slot_2_name: "Shortcut 2"
 pmcq__diplo_slot_2_desc: "Choose any diplomatic action for position 2, counting from the left. Opens a searchable picker; choosing an action only assigns the shortcut."
 pmcq__diplo_slot_3_name: "Shortcut 3"
 pmcq__diplo_slot_3_desc: "Choose any diplomatic action for position 3, counting from the left. Opens a searchable picker; choosing an action only assigns the shortcut."
 pmcq__diplo_slot_4_name: "Shortcut 4"
 pmcq__diplo_slot_4_desc: "Choose any diplomatic action for position 4, counting from the left. Opens a searchable picker; choosing an action only assigns the shortcut."
 pmcq__diplo_slot_5_name: "Shortcut 5"
 pmcq__diplo_slot_5_desc: "Choose any diplomatic action for position 5, counting from the left. Opens a searchable picker; choosing an action only assigns the shortcut."
 pmcq__diplo_slot_6_name: "Shortcut 6"
 pmcq__diplo_slot_6_desc: "Choose any diplomatic action for position 6, counting from the left. Opens a searchable picker; choosing an action only assigns the shortcut."
 pmcq__general__setup_name: "Recommended Setup"
 pmcq__general__setup_desc: "Apply Playmaker recommended economy and automation settings."
 pmcq__recommended_setup_name: "Recommended Setup"
 pmcq__recommended_setup_desc: "$pmcqp_economy_desc$"
 pmcq__recommended_setup_text: "Apply Recommended Setup"
 pmcq__diplo_slot_1_text: "Choose action for shortcut 1"
 pmcq__diplo_slot_2_text: "Choose action for shortcut 2"
 pmcq__diplo_slot_3_text: "Choose action for shortcut 3"
 pmcq__diplo_slot_4_text: "Choose action for shortcut 4"
 pmcq__diplo_slot_5_text: "Choose action for shortcut 5"
 pmcq__diplo_slot_6_text: "Choose action for shortcut 6"
 pmcq__reset_shortcuts_name: "Reset shortcut layout"
 pmcq__reset_shortcuts_desc: "Restore Send Gift, Buy Access, Food Access, Call to War, Alliance and Threaten War."
 pmcq__reset_shortcuts_text: "Restore original six"
 pmcq_shortcut_picker_title: "Choose country-panel shortcut"
 pmcq_shortcut_picker_help: "Choose any action listed by the game. This saves a shortcut only; it does not send the action. Unavailable actions can still be assigned. Context-specific actions appear when the game exposes them."
 pmcq_shortcut_picker_search: "Search diplomatic actions..."
 pmcq_shortcut_picker_default: "War and Casus Belli"
 pmcq_shortcut_picker_back: "Back to Mod Menu"
 pmcq_custom_shortcut_tip: "Use this saved diplomatic action against the selected country. Right-click to load its category without sending. If the action is unavailable for this country, it cannot run. Normal costs and requirements apply."
 pmcq__general__controls_name: "Mouse Controls"
 pmcq__general__controls_desc: "Customize shortcuts on the war badge."
 pmcq__swap_war_clicks_name: "Swap war-badge clicks"
 pmcq__swap_war_clicks_desc: "ON (default): left-click the war badge to Sue for Peace, right-click to Open War. OFF: restore normal left-click Open War and right-click Sue for Peace. Shift-left-click hints are unchanged."
 pmcq_cmf_preset_help_back: "Back to preset loader"
 pmcq__remove_forts_name: "Remove Forts"
 pmcq__remove_forts_desc: "Remove stockades, castles and city walls from all your owned locations. Opens a confirmation dialog first."
 pmcq__remove_forts_text: "Remove Forts..."
 pmcq_cmf_remove_forts_title: "Remove all forts?"
 pmcq_cmf_remove_forts_help: "This will destroy all stockades, castles and city walls in every location you own. This cannot be undone.\n\nDo you want to continue?"
 pmcq_cmf_remove_forts_cancel: "Cancel"
 pmcq_cmf_remove_forts_confirm: "Yes, remove forts"
 pmcq__diplomacy__gifts_name: "Auto Gift"
 pmcq__diplomacy__gifts_desc: "Experimental direct transfers for favors, with saved per-target cooldowns."
 pmcq__scripted_gifts_name: "Auto Gift (Experimental)"
 pmcq__scripted_gifts_desc: "Choose nations for direct gifts worth 10 favors. OFF by default. Uses a separate ten-year cooldown and an experimental income-based price; no gift slider or diplomat."
 pmcq__scripted_gifts_text: "Open Auto Gift"
