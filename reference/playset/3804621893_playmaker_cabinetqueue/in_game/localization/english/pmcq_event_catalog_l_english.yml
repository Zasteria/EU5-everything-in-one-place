 pmcq_catalog_preset_help_back: "Back to Event Favorites"
 pmcq_catalog_preset_help_body: "1. Save your game.\n\n2. Open your Steam library folder, then go to steamapps > workshop > content > 3450310 > (this mod's Workshop ID). The Workshop ID is the number after id= in the mod's Workshop page URL.\n\n3. Double-click Event Memory Tool.cmd — not the .ps1 file.\n(At your own risk. Never trust AI. GG PC.)\n\n4. Click Choose source save and find your save.\n\n5. Click Save preset..., then Use preset in game.\n\nRestart EU5, then open Mod Menu > Theplaymaker > Message Memory > Load saved event choices to apply your preset."
