l_russian:
 # Mod
 ism_name: "Улучшенное управление субъектами"
 ism_desc: "Добавляет новые взаимодействия, модификации и автоматизацию для значительного улучшения управления субъектами."

 # QoL (qol) Tab
 ism__qol_name: "Качество жизни"
 ## Automations (automations) Group
 ism__qol__automations_name: "Автоматизация"
 ism__auto_take_over_subject_wars_name: "Автоматически вступать в войны субъектов"
 ism__auto_take_over_subject_wars_desc: "Если включено, каждый год вы будете автоматически вступать во все войны субъектов и, по возможности, брать на себя руководство ими."
 ism__auto_subject_map_sharing_name: "Автоматически делиться картами субъектов"
 ism__auto_subject_map_sharing_desc: "Карты ваших субъектов будут постепенно открываться вам каждый год."
 ## Subject Rights (subject_rights) Group
 ism__qol__subject_rights_name: "Права субъектов"
 ism__qol__subject_rights_desc: "Это права, которые вы предоставляете своим подданным."
 ism__block_colonization_name: "Запретить колонизацию"
 ism__block_colonization_desc: "Запретить всем вашим субъектам колонизировать."
 ism__block_urbanization_name: "Запретить урбанизацию"
 ism__block_urbanization_desc: "Запрещает всем вашим субъектам улучшать сельские локации до городов."
 ism__block_columbian_exchange_name: "Запретить Колумбов обмен"
 ism__block_columbian_exchange_desc: "Запрещает всем вашим субъектам использовать Колумбов обмен, когда он доступен."
 ism__block_declaring_war_name: "Запретить объявление войн"
 ism__block_declaring_war_desc: "Запрещает всем вашим субъектам объявлять войну."

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 ism: "ism"
