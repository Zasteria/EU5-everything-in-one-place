l_english:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Select the [country|e] you want to take land from:"
 select_country_to_transfer_land_to: "Select the [country|e] you want to give land to:"
 select_transfer_mode: "Select Transfer Mode"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Select a location to transfer from our subject."
 transfer_province_from_subject_select_title: "Select a province to transfer from our subject."
 transfer_area_from_subject_select_title: "Select an area to transfer from our subject."
 transfer_region_from_subject_select_title: "Select a region to transfer from our subject."

 transfer_location_to_subject_select_title: "Select a location to transfer to our subject."
 transfer_province_to_subject_select_title: "Select a province to transfer to our subject."
 transfer_area_to_subject_select_title: "Select an area to transfer to our subject."
 transfer_region_to_subject_select_title: "Select a region to transfer to our subject."

 select_a_location_to_move_capital: "Click to select a [location|e] that we should move our subject's capital to."

 # Give Land to Subject
 ism_transfer_land_to_subject: "#E #!Give Land"
 ism_transfer_land_to_subject_desc: "We will give land to our subject."
 ism_transfer_land_to_subject_act: "Give Land to [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] will give land to [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] gave land to [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_to_subject: "Give land to $RECIPIENT$?\n$INFO$."

 # Take Land from Subject
 ism_transfer_land_from_subject: "#E #!Take Land"
 ism_transfer_land_from_subject_desc: "We will take land from our subject."
 ism_transfer_land_from_subject_act: "Take Land from [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] will take land from [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] took land from [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Take land from $RECIPIENT$?\n$INFO$."

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Move Capital"
 ism_move_subject_capital_desc: "We will move our subject's capital to a new [location|e]."
 ism_move_subject_capital_act: "Move Capital to [SCOPE.sCountry('target').GetName]"
 ism_move_subject_capital_effect_text: "Move [SCOPE.sCountry('target').GetName] capital to a new [location|e]."
 ism_move_subject_capital_effect_text_past: "Moved [SCOPE.sCountry('target').GetName] capital to a new [location|e]."
 PROPOSE_ism_move_subject_capital: "Move subject's capital to $TARGET$?\n$INFO$."

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Change Liturgical Language"
 ism_change_subject_liturgical_language_desc: "We will demand that they adopt our [liturgical_language|e]!"
 ism_change_subject_liturgical_language_act: "Change Liturgical Language in [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] change the [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] changed the [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_change_subject_liturgical_language: "Change [liturgical_language|e] in $RECIPIENT$?\n$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "Block Colonization"
 ism_block_subject_colonization_desc: "We will prevent our subject from creating new [colonial_charters|e]."
 ism_block_subject_colonization_act: "Blocks Colonization"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] blocks the colonization of [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking the colonization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_colonization: "Block Colonization of $TARGET$?"

 # Allow subject colonization
 ism_allow_subject_colonization: "Allow Colonization"
 ism_allow_subject_colonization_desc: "We will allow our subject to create new [colonial_charters|e]."
 ism_allow_subject_colonization_act: "Allows Colonization"
 ism_allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] allows the colonization of [SCOPE.sCountry('recipient').GetName]"
 ism_allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking the colonization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_allow_subject_colonization: "Allow Colonization of $TARGET$?"

 # Block subject urbanization
 ism_block_subject_urbanization: "Block Urbanization"
 ism_block_subject_urbanization_desc: "We will prevent our subject from creating new towns."
 ism_block_subject_urbanization_act: "Blocks Urbanization"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] blocks the urbanization of [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking the urbanization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_urbanization: "Block Urbanization of $TARGET$?"

 # Allow subject urbanization
 ism_allow_subject_urbanization: "Allow Urbanization"
 ism_allow_subject_urbanization_desc: "We will allow our subject to create new towns."
 ism_allow_subject_urbanization_act: "Allows Urbanization"
 ism_allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] allows the urbanization of [SCOPE.sCountry('recipient').GetName]"
 ism_allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking the urbanization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_allow_subject_urbanization: "Allow Urbanization of $TARGET$?"

 # Block subject declaring war
 ism_block_subject_declaring_war: "Block Declaring War"
 ism_block_subject_declaring_war_desc: "We will prevent our subject from declaring war."
 ism_block_subject_declaring_war_act: "Blocks Declaring War"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] blocks [SCOPE.sCountry('recipient').GetName] from declaring war"
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking [SCOPE.sCountry('recipient').GetName] from declaring war"
 PROPOSE_ism_block_subject_declaring_war: "Block $TARGET$ from declaring war?"

 # Allow subject declaring war
 ism_allow_subject_declaring_war: "Allow Declaring War"
 ism_allow_subject_declaring_war_desc: "We will allow our subject to declare war."
 ism_allow_subject_declaring_war_act: "Allows Declaring War"
 ism_allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] allows [SCOPE.sCountry('recipient').GetName] to declare war"
 ism_allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking [SCOPE.sCountry('recipient').GetName] from declaring war"
 PROPOSE_ism_allow_subject_declaring_war: "Allow $TARGET$ to declare war?"

 # Block subject columbian exchange
 ism_block_columbian_exchange: "Block from Columbian Exchange"
 ism_block_columbian_exchange_desc: "We will prevent our subject from using the Columbian Exchange."
 ism_block_columbian_exchange_act: "Blocks Columbian Exchange"
 ism_block_columbian_exchange_effect_text: "[SCOPE.sCountry('actor').GetName] blocks [SCOPE.sCountry('recipient').GetName] from the Columbian Exchange"
 ism_block_columbian_exchange_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking [SCOPE.sCountry('recipient').GetName] from the Columbian Exchange"
 PROPOSE_ism_block_columbian_exchange: "Block $TARGET$ from using the Columbian Exchange?"

 # Allow subject columbian exchange
 ism_allow_columbian_exchange: "Allow from Columbian Exchange"
 ism_allow_columbian_exchange_desc: "We will allow our subject to use the Columbian Exchange."
 ism_allow_columbian_exchange_act: "Allows Columbian Exchange"
 ism_allow_columbian_exchange_effect_text: "[SCOPE.sCountry('actor').GetName] allows [SCOPE.sCountry('recipient').GetName] to use the Columbian Exchange"
 ism_allow_columbian_exchange_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking [SCOPE.sCountry('recipient').GetName] from the Columbian Exchange"
 PROPOSE_ism_allow_columbian_exchange: "Allow $TARGET$ to use the Columbian Exchange?"

 # Take over all wars
 ism_take_over_wars: "#B #!Take Over War(s)"
 ism_take_over_wars_desc: "We will take over all wars our subject is the leader of."
 ism_take_over_wars_act: "Takes over subject wars."
 ism_take_over_wars_effect_text: "[SCOPE.sCountry('actor').GetName] takes over all the wars of [SCOPE.sCountry('recipient').GetName]"
 ism_take_over_wars_effect_text_past: "[SCOPE.sCountry('actor').GetName] has taken over all the wars of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_take_over_wars: "Take over all of $TARGET$'s wars?"

 # Take subject troops
 ism_take_subject_troops: "#D #!Take Command of Troops"
 ism_take_subject_troops_desc: "We will take command of one of our subject's armies while we fight a war together. Our subject keeps paying for their upkeep, and command returns when the shared war ends or if their loyalty falls too low."
 ism_take_subject_troops_act: "Take Command of Troops from [SCOPE.sCountry('recipient').GetName]"
 ism_take_subject_troops_effect_text: "[SCOPE.sCountry('actor').GetName] takes command of an army of [SCOPE.sCountry('recipient').GetName]"
 ism_take_subject_troops_effect_text_past: "[SCOPE.sCountry('actor').GetName] took command of an army of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_take_subject_troops: "Take command of one of $TARGET$'s armies?"
 ism_take_subject_troops_choose_unit: "Choose an Army to Take Command of"
 ism_take_subject_troops_no_units: "@trigger_no! No eligible armies available to take command of."
 ism_take_subject_troops_select_unit: "Click to select an [army|e] that we should take command of."

 # Return subject troops
 ism_return_subject_troops: "#D #!Return Troops"
 ism_return_subject_troops_desc: "We will return command of all armies we have taken from our subject."
 ism_return_subject_troops_act: "Return Troops to [SCOPE.sCountry('recipient').GetName]"
 ism_return_subject_troops_effect_text: "[SCOPE.sCountry('actor').GetName] returns all taken armies to [SCOPE.sCountry('recipient').GetName]"
 ism_return_subject_troops_effect_text_past: "[SCOPE.sCountry('actor').GetName] returned all taken armies to [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_return_subject_troops: "Return all taken armies to $TARGET$?"
