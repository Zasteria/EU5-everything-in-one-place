 # Mod
 ism_name: "Improved Subject Management"
 ism_desc: "Adds new interactions, modifications, and automations to significantly improve subject management."

 # QoL (qol) Tab
 ism__qol_name: "QoL"
 ## Automations (automations) Group
 ism__qol__automations_name: "Automations"
 ism__auto_take_over_subject_wars_name: "Automatically Join Subject Wars"
 ism__auto_take_over_subject_wars_desc: "When enabled every year you will automatically join, and if possible, take over, all subject wars."
 ism__auto_subject_map_sharing_name: "Automatically Share Subject Maps"
 ism__auto_subject_map_sharing_desc: "Your subject maps will slowly spread to you each year."
 ## Subject Rights (subject_rights) Group
 ism__qol__subject_rights_name: "Subject Rights"
 ism__qol__subject_rights_desc: "These are the rights you grant your subjects."
 ism__block_colonization_name: "Block Colonization"
 ism__block_colonization_desc: "Prevent all your subjects from colonizing."
 ism__block_urbanization_name: "Block Urbanization"
 ism__block_urbanization_desc: "Blocks all your subjects from upgrading rural locations to towns."
 ism__block_columbian_exchange_name: "Block Columbian Exchange"
 ism__block_columbian_exchange_desc: "Blocks all your subjects from using the Columbian Exchange when available."
 ism__block_declaring_war_name: "Block Declaring Wars"
 ism__block_declaring_war_desc: "Blocks all your subjects from declaring war."

