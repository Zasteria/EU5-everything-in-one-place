l_english:
 ILY: "Illyria"
 ILY_ADJ: "Illyrian"
 ILY_f: "Illyria"
 ILY_f_desc: "Croatian and Dalmatian humanists, prelates and city patricians called their language Illyrian and themselves Illyrici for three centuries before any nationalist borrowed the word. Formed by a Catholic Slavic power that gathers the Dalmatian communes, the Croatian marches, Slavonia and the Bosnian hinterland under one crown, Illyria makes that learned claim into a state: heir by adoption to the classical Illyricum, to the Slavonic liturgy in Glagolitic letters that Rome allowed the bishops of the Adriatic, and to the Illyrian colleges of Rome and Loreto. It is the eastern Adriatic answering to itself, not a federation of every South Slav."
