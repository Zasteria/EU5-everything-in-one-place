l_english:

 # ===== Event guard and destiny variables =====
 # nd_cpt_e1_done_tt lives here rather than in the shared
 # nd_event_guards file, following the nd_dnm precedent, so this country's
 # localization is self-contained.
 nd_cpt_e1_done_tt: "$nd_cpt.1.t$ has already happened"
 nd_cpt_formed_tt: "Coptic Egypt has been proclaimed"
 nd_cpt_path_a_tt: "Chose to rule through the diwan"
 nd_cpt_path_b_tt: "Chose to rule through the patriarchate"
 nd_cpt_path_c_tt: "Chose to rule through the armed countryside"

 # ===== Formation event =====
 nd_cpt.1.t: "The Ledger and the Cross"
 nd_cpt.1.d: "Al-Nasir Muhammad is dead and his sons are pulling the sultanate apart between them. The treasury is empty, the amirs are at each other's throats, and the only men in Cairo who know where the money actually is are the Coptic scribes of the diwan. This week they stopped handing over the keys.\n\nNobody in the city mistakes what this is. The Copts are perhaps one Egyptian in five and the share falls every decade. In 1301 every church in Cairo was closed and Christians were ordered into blue turbans; in 1321 some sixty churches were pulled down. Each of those years drove a wave of conversions, and the men now holding the revenue offices grew up counting the losses.\n\nThis state is being founded against the current, by a class whose only weapon is that nothing works without it. So the first question is also the last one: what kind of state is it going to be?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cpt.1.a: "Keep the ledger, change nothing else"
 nd_cpt.1.b: "Give the land to the patriarch"
 nd_cpt.1.c: "Swear the oath the Bashmurites swore"

 # ===== Advance events =====
 nd_cpt.2.t: "The Marshes of Bashmur"
 nd_cpt.2.d: "There is a difficulty with the Bashmurite tradition, and the men reviving it know exactly what it is.\n\nThe last revolt of Bashmur was broken in 831. Al-Ma'mun came south in person and set al-Afshin on the marsh villages; the captured men were executed, the women and children sold, the settlements burned to the reed beds. Bashmur itself ceased to exist. What followed was the first great wave of conversions, and no organised Coptic rising was ever attempted again.\n\nFive hundred years is far too long for a tradition to have survived. What is being handed to the Delta villages is not a memory but a story, assembled out of chronicle fragments and preached with intent. The state has decided this does not matter. A countryside that believes it once fought will fight."
 nd_cpt.2.a: "Let the priests read it with the martyrs"
 nd_cpt.2.b: "Let the marsh shaykhs tell it their own way"

 nd_cpt.3.t: "The Baqt, Struck Through"
 nd_cpt.3.d: "The pact signed at Dongola in 652 outlasted every dynasty that inherited it: grain, lentils, wine and cloth going upriver from Egypt, and four hundred slaves a year coming down. It held for very nearly seven hundred years, which makes it about the longest-observed treaty anyone has recorded, and it has spent the last generation coming apart. In 1317 a sultan's client turned the throne hall at Dongola into a mosque and Makuria fell into civil war.\n\nThe envoys sent south this year carry the old text with one clause struck out. Christians are not to be sold to a Christian court. It is the cheapest article in the agreement and the only one the Nubians ever hated, and giving it up costs Cairo a tribute it can afford to lose in exchange for the only friendly frontier it has."
 nd_cpt.3.a: "Grain south, ivory north, and no slaves"

 nd_cpt.4.t: "The Abuna"
 nd_cpt.4.d: "The metropolitan of the Ethiopian church is consecrated at Alexandria and nowhere else. An emperor a thousand miles up the Blue Nile cannot ordain a priest without a bishop this see appoints, and for centuries Ethiopian embassies have come north carrying gifts and waiting, sometimes for decades, while the throne of Saint Mark took its time.\n\nThe leverage runs the other way too, and both courts know it. Egypt is a country that exists because the river arrives every summer, and the river comes from the highlands. It has been said in Cairo more than once that the Ethiopians could turn it, and said in Gondar more than once that they might.\n\nAn envoy is waiting in the antechamber with the usual request."
 nd_cpt.4.a: "Consecrate the man they have asked for"
 nd_cpt.4.b: "Let the see stand vacant a while longer"

 nd_cpt.5.t: "The Rawk"
 nd_cpt.5.d: "The survey took two years and remeasured every cultivable feddan in Egypt. Its clerks worked in army dinars, a currency that exists only on paper and only for this purpose, and when they were finished the sultan's share of the assessed yield had risen from four twenty-fourths to ten. The men who walked the fields, drew the registers and argued the totals were, overwhelmingly, Copts.\n\nThe registers are being opened again. Half the villages in the Sa'id have lost people since the last count, to plague and flight and conversion, and the ledgers still show them at full strength. The scribes want to know which figure to write down."
 nd_cpt.5.a: "Write down what the surveyors actually found"
 nd_cpt.5.b: "Keep the old totals and let them petition"

 nd_cpt.6.t: "The Archons"
 nd_cpt.6.d: "A handful of Coptic households now hold the revenue of whole provinces on tax farm. They advance money to the treasury against next year's collection, they keep the accounts that decide what next year's collection is, and out of the margin they endow churches, ransom prisoners and school their own sons.\n\nIt is the Coptic position at its most complete and its most exposed. Everything the community has is concentrated in perhaps twenty families and a ledger, and a single bad season, or a single ruler who decides the arithmetic is theft, would take all of it at once. That is not a hypothesis. It is what happened in 1293, and in 1301, and in 1321, and in 1354."
 nd_cpt.6.a: "Let them buy the farms outright"
 nd_cpt.6.b: "Keep the farms and pay them a salary"

 nd_cpt.7.t: "Beyond the Reach of the Chamber"
 nd_cpt.7.d: "This state became Miaphysite by a vote. An estate with a Coptic majority carried the question, the confession changed, and the change was entirely lawful.\n\nThe same procedure runs backwards. A chamber whose weight has become Sunni can carry the same motion in the other direction, and with every decade of conversion the arithmetic gets easier. There is no year in the foreseeable future when it gets harder.\n\nSo the confession is being written out of politics altogether. It is put beyond the reach of any future chamber, of any foreign patron who might demand it as a condition, and of any victor who might extract it at a peace table. The price is exact and it is paid by us as much as by anyone: this crown can no longer change its faith either, for any reason, ever."
 nd_cpt.7.a: "Let it be settled and let it not be reopened"

 nd_cpt.8.t: "The Father of Reform"
 nd_cpt.8.d: "Cyril the Fourth was patriarch for seven years and was dead at forty-five. In that time he founded the first modern Coptic schools, brought the second printing press ever to operate in Egypt, opened a school for girls in Cairo when almost nobody in the country would, and made the church buy books instead of copying them.\n\nHis argument was arithmetic. The community had spent five hundred years losing people and was not going to win any of them back by being numerous. What it could do was be the best-taught population in Egypt, and let the state discover it could not be governed without them. It is the oldest Coptic strategy in existence, restated for an age of printing presses."
 nd_cpt.8.a: "Buy the press and open the girls' school"

 # ===== Formation timed modifiers =====
 STATIC_MODIFIER_NAME_nd_cpt_ledger_state: "The Ledger Keeps the State"
 STATIC_MODIFIER_DESC_nd_cpt_ledger_state: "The clerks rule as clerks. Mosques stay open, qadis keep their courts, Muslim notables keep their offices, and the state is Coptic only at the top. It survives by being indispensable, which means it has promised to touch nobody's faith."
 STATIC_MODIFIER_NAME_nd_cpt_patriarchs_land: "The Patriarch Takes the Land"
 STATIC_MODIFIER_DESC_nd_cpt_patriarchs_land: "Monastic estates become crown land, the Coptic calendar becomes the tax year, and the confession is pressed on the countryside. The fastest road out of minority status, and the one most likely to end with the whole community answering for it."
 STATIC_MODIFIER_NAME_nd_cpt_marsh_oath: "The Oath in the Marshes"
 STATIC_MODIFIER_DESC_nd_cpt_marsh_oath: "A revolt crushed in 831 is dug up, preached and sworn to. Everyone involved knows the tradition is being invented rather than continued. It arms the Delta anyway, and foreign courts read the result as a peasant rising rather than a kingdom."

 # ===== Advance event timed modifiers =====
 STATIC_MODIFIER_NAME_nd_cpt_martyrs_of_bashmur: "The Martyrs of Bashmur"
 STATIC_MODIFIER_DESC_nd_cpt_martyrs_of_bashmur: "Bashmur enters the calendar of saints and is read from the ambo with the rest. The church owns the story, and the men who march do so because a priest told them to."
 STATIC_MODIFIER_NAME_nd_cpt_shaykhs_of_the_marsh: "The Shaykhs of the Marsh"
 STATIC_MODIFIER_DESC_nd_cpt_shaykhs_of_the_marsh: "The Delta villages keep the telling and the state does not get to edit it. Less useful as doctrine, considerably harder to march an army through."
 STATIC_MODIFIER_NAME_nd_cpt_baqt_renewed: "The Baqt Renewed"
 STATIC_MODIFIER_DESC_nd_cpt_baqt_renewed: "Grain and cloth upriver, ivory and gold down, and the slave clause struck out of a treaty seven centuries old."
 STATIC_MODIFIER_NAME_nd_cpt_abuna_consecrated: "The Abuna Consecrated"
 STATIC_MODIFIER_DESC_nd_cpt_abuna_consecrated: "The metropolitan Ethiopia asked for is ordained without a decade of waiting. Gondar remembers generosity in this matter for a very long time."
 STATIC_MODIFIER_NAME_nd_cpt_see_left_vacant: "The See Left Vacant"
 STATIC_MODIFIER_DESC_nd_cpt_see_left_vacant: "No metropolitan is sent. An entire church waits on Alexandria's pleasure, and everyone concerned is reminded who holds the ordination."
 STATIC_MODIFIER_NAME_nd_cpt_survey_as_it_is: "The Survey As It Stands"
 STATIC_MODIFIER_DESC_nd_cpt_survey_as_it_is: "The registers are corrected to what the surveyors found. Revenue falls, the villages stop absconding, and the crown learns what it actually governs."
 STATIC_MODIFIER_NAME_nd_cpt_survey_as_it_was: "The Old Assessment"
 STATIC_MODIFIER_DESC_nd_cpt_survey_as_it_was: "The registers keep the old totals and the villages may petition. They will pay first and petition afterwards, and they will remember which office wrote the figure."
 STATIC_MODIFIER_NAME_nd_cpt_archons_buy_the_farms: "The Archons Buy the Farms"
 STATIC_MODIFIER_DESC_nd_cpt_archons_buy_the_farms: "Twenty households own the revenue of Egypt outright, and spend the margin on churches, schools and the ransom of prisoners. The community has never been richer or more exposed."
 STATIC_MODIFIER_NAME_nd_cpt_farms_stay_with_the_crown: "The Farms Stay With the Crown"
 STATIC_MODIFIER_DESC_nd_cpt_farms_stay_with_the_crown: "The archons are paid a salary and keep the books, and the revenue stays where the treasury can see it. Nobody in the counting house is pleased."
 STATIC_MODIFIER_NAME_nd_cpt_beyond_the_chamber: "Beyond the Chamber"
 STATIC_MODIFIER_DESC_nd_cpt_beyond_the_chamber: "The confession has been written out of politics. It cannot be voted away, demanded as a condition, or extracted at a peace table, and it cannot be abandoned by us either."
 STATIC_MODIFIER_NAME_nd_cpt_fathers_of_reform: "The Father of Reform"
 STATIC_MODIFIER_DESC_nd_cpt_fathers_of_reform: "Presses, schools and a girls' classroom in Cairo. A community that cannot win on numbers decides to win on schooling."

 # ===== Advances: Age of Traditions =====
 nd_cpt_diwan_of_the_copts: "The Diwan of the Copts"
 nd_cpt_diwan_of_the_copts_desc: "Coptic families held the fiscal bureaus of Egypt in unbroken secretarial dynasties, passing the trade from father to son, and it was that expertise rather than any charter of protection that kept them in office through every purge. A Coptic state begins from the ledger because the ledger is the only thing it already owns."
 nd_cpt_house_of_the_flood_gauge: "The House of the Flood Gauge"
 nd_cpt_house_of_the_flood_gauge_desc: "The miqyas on Rawda island, rebuilt in 861 and read every summer. The height of the inundation set the year's assessment before a single field was walked. Whoever reads the column writes the tax roll."
 nd_cpt_keeps_of_the_desert: "Keeps of the Desert"
 nd_cpt_keeps_of_the_desert_desc: "After the raids on Scetis the monasteries of Wadi el-Natrun raised the qasr: a stone tower over a well and a storehouse, built so a community could outlast a siege rather than win one. The whole Coptic military doctrine is contained in that sentence."
 nd_cpt_bashmurite_memory: "The Bashmurite Memory"
 nd_cpt_bashmurite_memory_desc: "The last revolt of Bashmur was crushed in 831, its villages burned and its people sold, and no organised Coptic rising followed it. Five centuries later there is no tradition left to revive, only a story. The state preaches it regardless, because a countryside that believes it once fought will fight."
 nd_cpt_era_of_the_martyrs: "The Era of the Martyrs"
 nd_cpt_era_of_the_martyrs_desc: "The Coptic year counts from Diocletian's persecution in 284, so the community dates its own calendar from the worst thing that ever happened to it. A people that reckons time in survival is difficult to break by threatening it."

 # ===== Advances: Age of Renaissance =====
 nd_cpt_school_of_the_scalae: "The School of the Ladder"
 nd_cpt_school_of_the_scalae_desc: "Al-Safi ibn al-Assal codified Coptic canon law in 1238 and Ibn Kabar finished his Bohairic-Arabic Scala Magna before his death in 1324. A church writing down its own language and law in exactly the generation that watched both begin to die."
 nd_cpt_the_renewed_baqt: "The Renewed Baqt"
 nd_cpt_the_renewed_baqt_desc: "The pact of 652 ran for nearly seven hundred years and is collapsing now: grain and cloth south, slaves and ivory north. A Christian Egypt renews it with the slave clause struck out, which costs the treasury the cheapest article in the treaty and buys the only friendly frontier it has."
 nd_cpt_rumat_al_hadaq: "Rumat al-Hadaq"
 nd_cpt_rumat_al_hadaq_desc: "The eye-smiters, so called because they shot for the face. Nubian bowmen broke Arab invasions in 641 and 652, and Egypt has bought them ever since. A state that cannot raise soldiers from a hostile countryside hires the archers of a friendly one."
 nd_cpt_the_abuna_of_ethiopia: "The Abuna of Ethiopia"
 nd_cpt_the_abuna_of_ethiopia_desc: "Alexandria consecrates the metropolitan of the Ethiopian church, so an emperor a thousand miles upriver depends on a bishop from Cairo. Cairo in turn depends on a river that comes from his highlands. Neither court has ever quite dared to use the leverage."
 nd_cpt_lamp_of_the_shadows: "The Lamp of Shadows"
 nd_cpt_lamp_of_the_shadows_desc: "Ibn Kabar's Misbah al-Zulma sets out the whole Coptic office in twenty-four chapters. Its author spent the persecution of 1321 in hiding and was dead by 1324. It is a church putting itself on paper because it can no longer be certain of being remembered."

 # ===== Advances: Age of Discovery =====
 nd_cpt_marsh_redoubts: "Marsh Redoubts"
 nd_cpt_marsh_redoubts_desc: "Bashmur was narrow sandy banks between reed thickets, supplied on fish and fowl, and ending it cost a caliph a personal expedition and an army under al-Afshin. The ground did most of the work, and the ground is still there."
 nd_cpt_wardens_of_the_towers: "Wardens of the Towers"
 nd_cpt_wardens_of_the_towers_desc: "Not fighting monks. The armed servants, tenants and dependent villagers a great monastery could put on its own walls, which is exactly who the tower over the well and the storehouse was raised to shelter."
 nd_cpt_the_monastery_farms: "The Monastery Farms"
 nd_cpt_the_monastery_farms_desc: "Saint Anthony's is a walled village: lanes of two-storey houses, a grain mill, an olive press, palm gardens and cisterns, fed by a spring that still yields a hundred cubic metres a day. Monastic wealth in Egypt was land and water, never alms."
 nd_cpt_the_rawk_survey: "The Rawk"
 nd_cpt_the_rawk_survey_desc: "The cadastral survey of 1313 to 1315 remeasured every feddan in Egypt in army dinars and raised the sultan's share of the assessed yield from four twenty-fourths to ten. Coptic officials ran it, and it is the clearest single picture of what this class actually did."
 nd_cpt_tongue_of_the_fathers: "The Tongue of the Fathers"
 nd_cpt_tongue_of_the_fathers_desc: "Athanasius of Qus wrote his grammar in the fourteenth century and said plainly that the people of this land had forgotten their language while others had not abandoned theirs. The state teaches it anyway, with no illusions about what it is doing."

 # ===== Advances: Age of Reformation =====
 nd_cpt_the_paid_corps: "The Paid Corps"
 nd_cpt_the_paid_corps_desc: "A Christian treasury cannot hold a slave-soldier aristocracy by land grant and religious bond, so it holds one by cash: mamluks bought outright, paid in coin from the diwan, and loyal for exactly as long as the payment clears."
 nd_cpt_the_archon_households: "The Archon Households"
 nd_cpt_the_archon_households_desc: "The arakhina were Coptic financier families who farmed the revenues, banked the beys and built churches out of the margin. Wealth concentrated in a handful of households is a fragile way to hold a state, and the only one available."
 nd_cpt_confession_beyond_reversal: "The Confession Beyond Reversal"
 nd_cpt_confession_beyond_reversal_desc: "This state turned Miaphysite because an estate with a Coptic majority carried the question in parliament. The same procedure runs backwards, and demography makes it easier every decade. The confession is therefore written out of politics: it can no longer be legislated away, imposed by a patron, or extracted at a peace table, and it can no longer be abandoned by us either."
 nd_cpt_the_union_declined: "The Union Declined"
 nd_cpt_the_union_declined_desc: "A Coptic delegation reached Florence in 1442 and Eugene IV addressed a bull of union to them. Constantinople courted Alexandria as well. Alexandria talked to everybody and joined nobody, which is how a small church remains a church."

 # ===== Advances: Age of Absolutism =====
 nd_cpt_the_endowment_house: "The Endowment House"
 nd_cpt_the_endowment_house_desc: "Coptic endowments paid for churches, schools, burials and the ransom of prisoners, and a family that depended on them moved to where they were administered. A minority that cannot outbreed its neighbours can still decide where it lives."
 nd_cpt_iltizam_ledgers: "The Iltizam Ledgers"
 nd_cpt_iltizam_ledgers_desc: "Tax farming placed the revenue of whole districts in the hands of the men who kept its books. Whether that is the perfection of the Coptic position or its final overexposure depends entirely on which decade you ask in."
 nd_cpt_endurance_of_the_community: "The Endurance of the Community"
 nd_cpt_endurance_of_the_community_desc: "There are no victories to record for these two centuries, which is the point. The achievement is that there is still a community at the end of them."
 nd_cpt_the_holy_synod: "The Holy Synod"
 nd_cpt_the_holy_synod_desc: "Government by a standing council of bishops rather than by one patriarch and his household, which finally settles the succession quarrels that had repeatedly left the throne of Saint Mark vacant for years at a time."

 # ===== Advances: Age of Revolutions =====
 nd_cpt_the_cyrillian_schools: "The Cyrillian Schools"
 nd_cpt_the_cyrillian_schools_desc: "Cyril IV, patriarch from 1854 to 1861, founded the first modern Coptic schools, imported the second printing press to operate in Egypt and opened a school for girls in Cairo. He is remembered as the Father of Reform and he was dead at forty-five."
 nd_cpt_the_coptic_press: "The Coptic Press"
 nd_cpt_the_coptic_press_desc: "Bohairic liturgy set in movable type, canon law printed instead of copied, and the scalae of the thirteenth century finally reaching more readers than any scriptorium could have managed."
 nd_cpt_a_nation_of_the_nile: "A Nation of the Nile"
 nd_cpt_a_nation_of_the_nile_desc: "The argument that the Copts are not a minority in Egypt but the oldest continuous thing in it, and that Egyptian nationhood is therefore theirs to share rather than something to be tolerated within."
 nd_cpt_census_of_the_faithful: "The Census of the Faithful"
 nd_cpt_census_of_the_faithful_desc: "Counting the community properly, for the first time, and learning exactly how the last five centuries went."

 # ===== Units =====
 a_nd_cpt_bashmurite: "Bashmurite"
 a_nd_cpt_bashmurite_desc: "Delta marsh militia raised on a story. They know the channels, they live off fish and fowl, and they are close to worthless in open desert. Raised only through the levy, because this is the countryside rising rather than a regiment the state keeps."
 a_nd_cpt_nubian_bowmen: "Nubian Bowmen"
 a_nd_cpt_nubian_bowmen_desc: "The rumat al-hadaq, shooters at the pupils of the eye. Devastating archery and a willingness to withdraw that reflects whose war they think this is. Recruited only on the southern frontier and in Nubia, where the Baqt contingents came through."
 a_nd_cpt_qasr_warden: "Qasr Warden"
 a_nd_cpt_qasr_warden_desc: "The armed servants and dependent villagers a great monastery could put on its own walls. They hold ground and outlast sieges. They do not march anywhere quickly."
 a_nd_cpt_paid_corps: "Paid Corps"
 a_nd_cpt_paid_corps_desc: "Mamluk cavalry retained by a Christian treasury, with no land grant and no confessional bond to its paymaster. Excellent horse, and the first formation to come apart the moment the state looks poor."

 # ===== Levies =====
 levy_nd_cpt_bashmurite: "Bashmurite Levy"
 levy_nd_cpt_bashmurite_desc: "The Delta marsh villages called out on the strength of a revolt crushed five hundred years ago. Peasants only: there is no Coptic soldier class and the state does not pretend otherwise."
 levy_nd_cpt_qasr_warden: "Qasr Warden Levy"
 levy_nd_cpt_qasr_warden_desc: "The monastery's own armed dependants, mustered from the houses on its payroll rather than from the countryside around it."

 # ===== Buildings =====
 nd_cpt_diwan_office: "Diwan of the Copts"
 nd_cpt_diwan_office_desc: "The revenue bureau, staffed by the secretarial families that ran Egyptian finance under every dynasty since the conquest. It can only be raised where the community is the dominant faith, because a Coptic revenue office needs Coptic clerks. The map of your fiscal machine is the map of your minority."
 nd_cpt_miqyas: "House of the Flood Gauge"
 nd_cpt_miqyas_desc: "The nilometer of Rawda island, a marble column in a sunken well, read every summer by an official whose reading sets the year's assessment. There was one that mattered and it stood in the capital."
 nd_cpt_qasr_tower: "Qasr"
 nd_cpt_qasr_tower_desc: "The keep of a desert monastery: a stone tower over a well and a granary, reached by a drawbridge, built so the community could survive a siege it had no means of winning. Raised only on the arid desert margins where the great houses stand."
 nd_cpt_scalae_school: "School of the Ladder"
 nd_cpt_scalae_school_desc: "A teaching house for Bohairic grammar and the canon law codified by al-Safi ibn al-Assal, named for Ibn Kabar's Scala Magna. It follows the community rather than the map, because the priests who taught it were the priests who used it."
 nd_cpt_baqt_house: "House of the Baqt"
 nd_cpt_baqt_house_desc: "The frontier exchange at Aswan and Qus where the treaty of 652 was counted out: grain and cloth going upriver, ivory and gold coming down, and under a Christian Egypt no slaves in either direction."
 nd_cpt_bashmur_redoubt: "Bashmur Redoubt"
 nd_cpt_bashmur_redoubt_desc: "Cut channels, staked reed beds and a raised bank. The doctrine that cost al-Ma'mun a personal expedition in 831, rebuilt by a state that needs it to be true a second time. Only the wetlands of the Delta have the ground for it."
 nd_cpt_deir_estate: "Deir Estate"
 nd_cpt_deir_estate_desc: "The monastery as an economy rather than a house of prayer: a grain mill, an olive press, palm gardens, cisterns and a walled village of tenants. It can only be laid out around a monastery that already stands."
 nd_cpt_archon_house: "Archon's House"
 nd_cpt_archon_house_desc: "The household of a Coptic financier who farms the revenue of a district, banks the government against next year's collection and endows churches out of the margin. It sits in the market centre because that is where the money moves."
 nd_cpt_endowment_house: "Endowment House"
 nd_cpt_endowment_house_desc: "The office that administers the community's endowments: churches, schools, burials, and the ransom of prisoners. Families that depend on it move to where it is administered, so it draws the community inward to the towns the state controls."
 nd_cpt_cyrillian_school: "Cyrillian School"
 nd_cpt_cyrillian_school_desc: "A modern school on the pattern Cyril IV set out in the 1850s: printed books instead of copied ones, arithmetic and languages beside the liturgy, and classrooms for girls. Founded on the church's older teaching houses rather than planted new."

 # ===== Production methods =====
 nd_cpt_diwan_maintenance: "Revenue Registers"
 nd_cpt_diwan_maintenance_desc: "Paper, ink and the bound registers of assessment and collection, kept in a hand that has been taught in the same families for six centuries."
 nd_cpt_diwan_iltizam_ledgers: "Iltizam Ledgers"
 nd_cpt_diwan_iltizam_ledgers_desc: "The heavier bookkeeping of tax farming: advances, arrears, and the running account between a district's revenue and the household that bought it."
 nd_cpt_miqyas_maintenance: "The Summer Reading"
 nd_cpt_miqyas_maintenance_desc: "Keeping the well clear, the column true and the record unbroken, so that this year's assessment can be argued from last year's mark."
 nd_cpt_qasr_maintenance: "Tower and Storehouse"
 nd_cpt_qasr_maintenance_desc: "Masonry, a stocked granary and a well kept sweet, because the point of the keep is the length of time it can be shut."
 nd_cpt_scalae_maintenance: "Grammar and Canon"
 nd_cpt_scalae_maintenance_desc: "Copied ladders, lexicons and canon collections, and the candles to read them by."
 nd_cpt_scalae_press: "The Bohairic Press"
 nd_cpt_scalae_press_desc: "Type, formes and printer's ink. The liturgy set once and struck a thousand times, which no scriptorium ever managed."
 nd_cpt_baqt_maintenance: "The Frontier Tally"
 nd_cpt_baqt_maintenance_desc: "Grain, cloth and stock counted out against what comes downriver, under the eye of both sets of clerks."
 nd_cpt_bashmur_maintenance: "Reed and Stake"
 nd_cpt_bashmur_maintenance_desc: "Cut timber, staked beds, dried fish for the store and enough iron to arm the village that keeps the bank."
 nd_cpt_deir_maintenance: "Mill, Press and Garden"
 nd_cpt_deir_maintenance_desc: "The upkeep of a self-supplying house: the grain mill, the olive press, the cisterns and the palm gardens behind the wall."
 nd_cpt_archon_maintenance: "The Counting House"
 nd_cpt_archon_maintenance_desc: "Ledgers, correspondence, and the dignified furnishings a family keeps when it wants the government to feel it is calling on an institution."
 nd_cpt_endowment_maintenance: "The Charitable Account"
 nd_cpt_endowment_maintenance_desc: "Bread, cloth, oil and candles issued against the endowment, along with the register that records exactly who received them."
 nd_cpt_cyrillian_maintenance: "Books and Slates"
 nd_cpt_cyrillian_maintenance_desc: "Printed texts, lamps, ink and glass for the windows, bought rather than copied, which is the whole reform in one line."

 # ===== DESTINY: advances =====
 nd_cpt_destiny: "No Longer a Protected People"
 nd_cpt_destiny_desc: "The dhimma was a contract: protection and communal autonomy in exchange for the poll tax and a list of disabilities. A Christian Egypt cannot be a party to it in either direction, so the register of protected persons closes and everyone in the country becomes simply a subject, which is a condition nobody here has been in for seven hundred years. The community's shelter is gone along with its humiliations. What is left is a decision about how to spend the next two centuries."
 nd_cpt_dest_qadis_kept: "The Qadis Keep Their Courts"
 nd_cpt_dest_qadis_kept_desc: "Confirm the four chief judges of Cairo, one to each school of law, and leave marriage, inheritance and endowment exactly where they are. The Friday sermon cannot name this sovereign, so it names the Abbasid caliph who has lived in the city as a pensioner since 1261. Requires a settled realm, a thousand in the treasury, banking embraced, and pepper moving in a market of ours."
 nd_cpt_dest_pepper_crossing: "The Pepper Crossing"
 nd_cpt_dest_pepper_crossing_desc: "Aydhab is where the Karimi land pepper out of Aden and the pilgrims cross to Jeddah. The Karimi are Muslim spice financiers whose capital makes the treasury look provincial, and they lend to it constantly. A Cairo that audits nobody's faith is the only Cairo they will keep using. Take the crossing, and hold a realm rich enough to be worth crossing to."
 nd_cpt_dest_indispensable: "Indispensable"
 nd_cpt_dest_indispensable_desc: "Suakin takes the crossing when Aydhab is finished, and by then the argument is over: nothing in Egypt moves without the men who keep its accounts, and nothing in the ocean trade moves without Egypt. Requires the southern crossing, three thousand in the treasury, high standing and the global trade of the age embraced. Unlocks the Bureau of Endowments."
 nd_cpt_dest_scrolls_of_timotheos: "The Scrolls of Timotheos"
 nd_cpt_dest_scrolls_of_timotheos_desc: "In 1372 the patriarch consecrated a bishop named Timotheos at Cairo for Faras and Qasr Ibrim. He went south, died there, and was buried in the crypt at Ibrim with his letters of consecration beside him. They were found six centuries later, and he is the last bishop of Nubia anyone can name. Take both sees, with thirty regiments and a quiet realm, and stop consecrating men for ground the church cannot hold."
 nd_cpt_dest_throne_hall_dongola: "The Throne Hall at Dongola"
 nd_cpt_dest_throne_hall_dongola_desc: "In 1317 the throne hall of the kings of Makuria was refitted as a mosque and the foundation text was cut into stone with a date on it. Makuria did not end that year, but it never recovered either. Take Dongola and Kerma with fifty regiments, with the confessional age embraced and a realm developed enough to hold the river behind you."
 nd_cpt_dest_all_africa: "Patriarch of All Africa"
 nd_cpt_dest_all_africa_desc: "The title is not an invention: Pope of Alexandria and Patriarch of All Africa on the Holy See of Saint Mark. The Pentapolis of Cyrenaica was Alexandria's own province before Chalcedon, and Soba was the seat of Alwa on the Blue Nile. Hold both, with seventy five regiments and the standing to match, and the jurisdiction stops being a signature and becomes a country. Unlocks the Metropolitan See."

 # ===== DESTINY: events =====
 nd_cpt.9.t: "The Register Is Closed"
 nd_cpt.9.d: "The clerks who kept the register of protected persons have spent a week working out that they are now the government, and that there is nothing left to register.\n\nThe dhimma is a contract and it needs a Muslim sovereign to be a party to it. There is no longer one. The poll tax rolls are void, the blue turbans are void, the prohibition on riding horses is void, and the church that was tolerated is the church of the crown. None of that makes the Copts numerous. It makes a fifth of the country responsible for all of it, with the other four fifths now simply subjects, which is a status Egypt has not put anyone in since the conquest.\n\nAnd the door swings both ways. This state was made by a motion carried in a chamber, and a chamber can carry the same motion back again; every decade of conversion makes that arithmetic easier for whoever wants to try. There is no year ahead in which it gets harder.\n\nSo the only question worth asking is what to do with the time."
 nd_cpt.9.a: "Then let us be a state and not a community"

 nd_cpt.10.t: "The Bench and the Sermon"
 nd_cpt.10.d: "Two decisions arrive in the same week and they have the same answer.\n\nThe first is the bench. Cairo has four chief judges, one for each school of law, sitting in that arrangement since Baybars made it in 1265, and between them they hear every Muslim marriage, inheritance and endowment in Egypt. A Christian government could take that jurisdiction for its own courts. This one reappoints all four instead, by name, in the usual ceremony, and the only thing that changes is whose seal is on the warrant.\n\nThe second is the Friday sermon, which names the sovereign, and cannot name this one. The Abbasid caliph has lived in Cairo as a pensioner since 1261 with no authority beyond his own dignity, and the sermon will name him. Nobody in the mosque will mistake what that means. Nobody is being asked to pretend."
 nd_cpt.10.a: "Confirm the four judges and leave the sermon alone"

 nd_cpt.11.t: "The Karimi at Aydhab"
 nd_cpt.11.d: "The crossing is ours, which means the pepper is ours to price. It comes up from Aden in Karimi bottoms, is carried overland from the Red Sea to Qus, goes down the river to Cairo and out through Alexandria into Venetian and Genoese hulls, and every stage of it is financed by perhaps fifty Muslim households whose credit is better than the treasury's.\n\nThe crown can take that margin. It has been done: declare the pepper crown goods, buy at the crown's price, sell at the crown's price, and let the great houses work as agents or not at all. The revenue arrives at once and it is very large.\n\nIt also teaches every merchant on the ocean that the price of the Egyptian route is set by decree, and that the routes through Hormuz and Basra are not."
 nd_cpt.11.a: "Declare the pepper crown goods"
 nd_cpt.11.b: "Take the toll and leave the trade to them"

 nd_cpt.12.t: "The Bureau of Endowments"
 nd_cpt.12.d: "The waqf of Egypt is enormous. Mosques, madrasas, hospitals, drinking fountains, bread for the poor and the wages of every preacher in the country are paid out of land and shops tied up in perpetuity, and the office that supervises the whole of it has had Coptic clerks in it for as long as it has existed.\n\nThat office now reports to a Christian crown, and there is no precedent anywhere for what it is supposed to do next. The endowments cannot simply be taken. A state that seized the mosques' land would be doing the exact thing it promised not to do, and doing it to four fifths of its subjects.\n\nSo what is left is a question of hands. The overseers who hold these foundations are notables of the majority, and their accounts are, put generously, approximate."
 nd_cpt.12.a: "Leave it with their overseers and audit it yearly"
 nd_cpt.12.b: "Run it out of the diwan like everything else"

 nd_cpt.13.t: "The Bishop Buried at Ibrim"
 nd_cpt.13.d: "The consecration is recorded and so is the burial. Timotheos was made bishop of Faras and Qasr Ibrim at Cairo in 1372 and went south to a see that had been shrinking for a hundred years. He died there and was buried in the crypt with his letters of consecration laid beside him, one in Coptic and one in Arabic, and they were still legible when the crypt was opened six centuries later.\n\nHe is the last bishop of Nubia anyone can name. What comes before him is the pattern of the whole age: Alexandria kept filling sees, with real men and sealed documents, in a country it had no means of defending, and one by one the sees stopped writing back.\n\nThe crown proposes to consecrate the next one and to send soldiers up the river with him."
 nd_cpt.13.a: "Consecrate the next one and send soldiers with him"

 nd_cpt.14.t: "The Inscription of 1317"
 nd_cpt.14.d: "The throne hall at Dongola was two storeys of brick with a domed chamber where the kings of Makuria received embassies, and in 1317 it was washed out, refitted and dedicated as a mosque. The foundation text was cut into stone and set into the wall. It is dated, and it is still there.\n\nThe kingdom did not end that year. It went on in fragments for another century, with kings appointed from Cairo and kings who refused to be, and it finished without anyone troubling to record when. What ended in 1317 was the idea that the hall belonged to a Christian king.\n\nThe hall is ours again. What goes into it is not only a religious decision: there are Nubians who would rather have a king of their own than a governor sent from Egypt, and there is a mosque congregation in Dongola that did not exist three generations ago."
 nd_cpt.14.a: "Take the inscription down and put the altar back"
 nd_cpt.14.b: "Leave the mosque and crown a king we choose"

 nd_cpt.15.t: "Patriarch of All Africa"
 nd_cpt.15.d: "The title is a thousand years old and has meant, for most of them, a courtesy. Pope of Alexandria and Patriarch of All Africa on the Holy See of Saint Mark, with a jurisdiction running from the Pentapolis of Cyrenaica to the cataracts and past them to the confluence at Soba, and with almost no means of reaching any of it.\n\nIt is not a courtesy now. Barca is held and Soba is held, the sees are filled by men who arrive alive, and the church is the largest thing in Africa that answers to a single chair.\n\nWhich raises the question every church of this size has eventually had to answer, usually badly. A metropolitan a thousand miles up the river cannot wait on Cairo for a ruling, and will not always want to."
 nd_cpt.15.a: "One throne, and every bishop appointed from it"
 nd_cpt.15.b: "Every see its own metropolitan and its own tongue"

 # ===== DESTINY: timed modifiers =====
 STATIC_MODIFIER_NAME_nd_cpt_dest_pepper_monopoly: "The Pepper Declared Crown Goods"
 STATIC_MODIFIER_DESC_nd_cpt_dest_pepper_monopoly: "The crown buys the cargo at its own price and sells it at its own price, and the great houses work as its agents or not at all. The revenue is immediate and enormous, and it is sitting in warehouses rather than in the hands of recruiting sergeants."
 STATIC_MODIFIER_NAME_nd_cpt_dest_karimi_toll: "The Toll and Nothing Further"
 STATIC_MODIFIER_DESC_nd_cpt_dest_karimi_toll: "The crossing is taxed at a rate the merchants can live with and the trade is left to the men who understand it. Their credit becomes the cheapest the treasury will ever see, and the route does not move east."
 STATIC_MODIFIER_NAME_nd_cpt_dest_their_own_overseers: "Their Own Overseers"
 STATIC_MODIFIER_DESC_nd_cpt_dest_their_own_overseers: "The endowments stay in the hands that hold them and the diwan audits the accounts once a year without comment. The countryside is quiet, the towns are governable, and the population grows, which is a mixed blessing and everybody knows whose."
 STATIC_MODIFIER_NAME_nd_cpt_dest_diwan_keeps_the_books: "The Diwan Keeps the Books"
 STATIC_MODIFIER_DESC_nd_cpt_dest_diwan_keeps_the_books: "The foundations are administered out of the revenue office like every other account in the country. The figures are finally exact and the building funds actually reach the buildings. The households that used to hold the papers were not consulted."
 STATIC_MODIFIER_NAME_nd_cpt_dest_hall_reconsecrated: "The Hall Reconsecrated"
 STATIC_MODIFIER_DESC_nd_cpt_dest_hall_reconsecrated: "The inscription comes out of the wall, the hall is washed and an altar is set where the throne stood. Every mason between the cataracts is now rebuilding churches, and will be for a generation."
 STATIC_MODIFIER_NAME_nd_cpt_dest_king_of_our_choosing: "A King of Our Choosing"
 STATIC_MODIFIER_DESC_nd_cpt_dest_king_of_our_choosing: "The mosque stands and a Nubian king sits in front of it holding his throne from Cairo, which is how Egypt has handled Dongola for eighty years. It costs nothing in masonry and a great deal in watching."
 STATIC_MODIFIER_NAME_nd_cpt_dest_held_from_alexandria: "Held From Alexandria"
 STATIC_MODIFIER_DESC_nd_cpt_dest_held_from_alexandria: "One throne, one rite, one calendar, and every bishop from Barca to the confluence appointed out of a single chancery. The countryside is held tighter than it has ever been held, and the patriarch's household sits in the government."
 STATIC_MODIFIER_NAME_nd_cpt_dest_every_see_its_own: "Every See Its Own"
 STATIC_MODIFIER_DESC_nd_cpt_dest_every_see_its_own: "Each see keeps its own metropolitan, its own liturgy and its own language, and answers to Alexandria in doctrine and in nothing else. The provinces raise their own men, repair their own damage, and stop feeling occupied."

 # ===== DESTINY: buildings =====
 nd_cpt_diwan_al_ahbas: "Bureau of Endowments"
 nd_cpt_diwan_al_ahbas_desc: "The office supervising the pious foundations of the majority: mosque land, madrasa rents, fountains, hospitals and the wages of preachers, administered by the same clerks who audit everything else in the country. While it stands, no conversion effort whatever is applied in this town by anyone, which is exactly the bargain that was struck."
 nd_cpt_metropolitan_see: "Metropolitan See"
 nd_cpt_metropolitan_see_desc: "A bishop's chair with a cathedral, a household and a consecrated territory, rebuilt in the provinces the throne of Saint Mark has claimed since before Chalcedon. Coptic families settle where a see is administered. Everyone already living there is entitled to notice that nobody asked them first."

 # ===== DESTINY: production methods =====
 nd_cpt_ahbas_maintenance: "The Waqf Registers"
 nd_cpt_ahbas_maintenance_desc: "Deeds of endowment, rent rolls and the yearly account of every foundation in the district, copied fair and kept where both parties can consult them."
 nd_cpt_see_maintenance: "Chrism and Candles"
 nd_cpt_see_maintenance_desc: "Incense, wax, vestment cloth and the wine of the liturgy, carried upriver because none of it is made anywhere near the chair that needs it."

 # ===== BUREAUCRACIES =====
 cpt_altar_lot_bureaucracy: "The Altar Lot"
 cpt_altar_lot_bureaucracy_desc: "The pope of Alexandria is chosen from the monks and never from the bishops, since a bishop is espoused to his own see and cannot be moved from it. When Michael IV died in 1102 the bishops and priests went into the wilderness of Scetis, sat with the elders of the desert for days, and came out with Macarius II. Where the assembly could not agree, the last names went to the altar and a blindfolded child drew one of them. Since 640 the ruler's confirmation has been a formality, and a Coptic crown inherits that limitation along with the church: this is a succession no sovereign arranges in advance."
 cpt_kharaji_year_bureaucracy: "The Kharaji Year"
 cpt_kharaji_year_bureaucracy_desc: "Egypt's tax year runs on the Coptic solar calendar rather than the lunar one, because the assessment follows the inundation and the inundation does not follow the moon. Every regime since the conquest kept the Coptic months for the kharaj for that reason alone, and Egypt was still reckoning taxes by them in 1875. The column on Rawda island, rebuilt in 861, is read each summer; at sixteen cubits the canal is cut and the year opens on a good assessment, and a short flood is answered with remission written into the roll rather than collection enforced on a crop that never came up."
 cpt_zimam_ledgers_bureaucracy: "The Letters of the Zimam"
 cpt_zimam_ledgers_bureaucracy_desc: "In the tenth century the accountants of Egypt cut Coptic uncials down into a fast curvilinear numeral set, the huruf al-zimam or letters of the registers, and estimates, rent rolls and audits were kept in it for the next nine hundred years. It was learned inside the secretarial families and in no school. This is the mechanism the Diwan of the Copts merely houses: clerks were dismissed from the fiscal bureaus at least nine times between 1280 and 1450 and recalled every time, because the books of the previous administration were unreadable to anyone not raised in the hand."
 cpt_arakhina_purse_bureaucracy: "The Purse of the Arakhina"
 cpt_arakhina_purse_bureaucracy_desc: "The arakhina were the lay Coptic notables who farmed revenues, banked officials and stood surety for everyone below them, covering the shortfall in the community's capitation, ransoming prisoners and paying for churches out of their own accounts. The reason mattered: taxation was the chief engine of conversion in medieval Egypt, so a house that paid a poorer family's assessment was buying that family's continued existence as Copts. By the seventeenth century these houses carried more practical weight in Coptic affairs than the patriarch did, and the quarrel over whether laymen or bishops should administer the endowments ran on until a communal council settled it in 1874."

 # The auto-modifier governing the bureaucracy slot grant on formation
 AUTO_MODIFIER_NAME_nd_cpt_bureaucracy_authority: "The Offices of the Community"
 AUTO_MODIFIER_DESC_nd_cpt_bureaucracy_authority: "On formation, [CPT.GetName] may host the institutions the Coptic community ran for itself while it was governed by others: the desert election, the flood assessment, the ledger hand and the purse of the notables. Capacity is deliberately narrow, since a minority regime cannot staff every apparatus at once."
