l_english:

 # ==========================================================================
 # FORMATION EVENT
 # ==========================================================================
 nd_got.1.t: "The Restoration of the Regnum"
 nd_got.1.d: "Granada has fallen. Narbonne answers to a court on the meseta. The lawyers have the Fuero Juzgo open on the table, and the chroniclers of Alfonso III at their elbow, and between them they will tell you that the kingdom of the Goths was never dissolved: only interrupted, for seven hundred and eighty years, by an occupation that no council ever ratified.\n\nWhat remains is to say the name aloud, and the name is the whole argument.\n\nIn Latin it is #bold Regnum Gothorum#!, the kingdom of the councils and the code. That is the state of Reccared and Recceswinth, whose law bound Goth and Roman alike because it was territorial and not personal, whose bishops legislated beside the palatine counts at Toledo, and whose see holds primacy over every church in the peninsula. It is a claim of continuous jurisdiction, and it is argued in the language the claim was written in.\n\nIn the tongue of Wulfila it is #bold Reiki Gutane#!, the rule of the Goths. That is a different claim entirely: not an office inherited but a people surviving, with a name of its own, a king who holds the crown by the oath of his sworn men, and no need of Rome to say so. The Latin apparatus was always borrowed clothing. Take it off.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_got.1.a: "Regnum Gothorum: the kingdom of the councils and the code"
 nd_got.1.b: "Reiki Gutane: the rule of the Goths, in the tongue of Wulfila"

 # ==========================================================================
 # ADVANCE EVENTS
 # ==========================================================================
 nd_got.2.t: "The Book of Judgements"
 nd_got.2.d: "Chindasuinth began it in 642 and Recceswinth promulgated it in 654, after the bishops at the Eighth Council of Toledo had gone through it title by title. Twelve books, fifty-three titles, five hundred and twenty-six laws, all of it in Latin.\n\nIts novelty was not what it said but whom it bound. Before it, a Goth was tried by Gothic custom and a Roman by the Breviary of Alaric, and a man's ancestry decided which book was opened over him. The Liber ended that. One code, one jurisdiction, every subject of the crown inside it, and a clause forbidding any judge to cite any other law at all.\n\nThat last clause is the one your jurists are arguing about."
 nd_got.2.a: "Let no other law be cited in any court of the realm"
 nd_got.2.b: "The code takes in the customs it finds and outlives them"
 nd_got.3.t: "The Councils of Toledo"
 nd_got.3.d: "Eighteen of them between 400 and 702, and they were never merely synods. The king convoked them. Bishops and abbots came, and so did the counts of the palatine office and the lay magnates of the realm, and what they agreed was published as the law of the kingdom.\n\nAt the third, in 589, Reccared read out his abjuration of Arianism and the kingdom changed religion in a room. At the fourth, in 633, Isidore of Seville presided and the seventy-fifth canon made the kingship formally elective and laid an anathema on any man who took the crown by violence. No other successor state to Rome built an institution that legislated for church and crown at once, and none of them lasted as long in one place.\n\nThe question your court cannot avoid is which half of that body actually holds the pen."
 nd_got.3.a: "The council legislates and the king promulgates"
 nd_got.3.b: "The king convokes and the council confirms"
 nd_got.4.t: "The Code as a City Charter"
 nd_got.4.d: "When Ferdinand III took Cordoba in 1236 he did not give the city a new law. He had the Liber translated into Castilian and handed it over as the city's fuero, and did the same at Seville and Murcia and a string of towns after them.\n\nThe move is subtler than it looks. A conquered city given a new charter knows it has been conquered. A city handed the Fuero Juzgo is being told that it was always under this law, that the interruption was the anomaly, and that the crown has come back rather than come in. Incorporation by legal fiction costs nothing and works on people who would resist a garrison.\n\nWhether to keep doing it is now a decision with a price, because a town that keeps its own charter pays for the privilege."
 nd_got.4.a: "Grant the Fuero Juzgo to every town we take"
 nd_got.4.b: "Confirm the towns in their own charters and take the fee"
 nd_got.5.t: "The Primacy of the Spains"
 nd_got.5.d: "Alfonso VI took Toledo in 1085 and within three years Urban II had issued the bull Cunctis Sanctorum, restoring to its bishop the primatial standing he had held under the Gothic kings and naming Bernard of Sedirac first primate of the Spains.\n\nA primacy is not honorific. It is a claim to jurisdiction over other metropolitans, to summon them, to hear appeals from their courts, to have the cross carried before you in their cathedrals. Braga disputed it for four centuries. Tarragona disputed it. Compostela built its own case out of an apostle's bones.\n\nThe argument for Toledo has always been the same one: the councils met here, and the law was written here, and the kingdom is the same kingdom."
 nd_got.5.a: "Press the primacy until every see in Iberia bends"
 nd_got.5.b: "A primacy of honour, and the peace of the Spanish church"
 nd_got.6.t: "The Rite of Isidore"
 nd_got.6.d: "The Hispanic liturgy is older than the kingdom that adopted it. Isidore shaped it, Ildefonsus and Julian of Toledo added to it, and it was sung in every church of the peninsula for five hundred years. Then Gregory VII suppressed it in 1080 in favour of the Roman use, and it survived in six parishes of Toledo and nowhere else on earth.\n\nCisneros would not let it die. In 1500 he printed the Missale Mixtum, in 1502 the breviary, and he endowed a chapel in the cathedral with thirteen chaplains whose whole duty was to sing the old mass daily, forever.\n\nA kingdom that keeps its own rite keeps a claim that predates the reforming papacy. A kingdom that gives it up gains a friend in Rome. Both are true at once."
 nd_got.6.a: "Endow the old rite and sing it daily in the cathedral"
 nd_got.6.b: "Conform to the Roman use, and keep the chapel as memory"
 nd_got.7.t: "The Council Made Permanent"
 nd_got.7.d: "Eighteen councils in three hundred years means one every seventeen years, and always because a king wanted something from them. The bishops came when they were called and went home when they were dismissed, and in the gaps the crown legislated alone.\n\nThe magnates and the primate have now made the obvious argument. If the councils are the kingdom's constitution, and if the crown's own title rests on being the heir of the men who sat at them, then a council that sits only when summoned is not a constitution at all. It is a favour.\n\nThe crown may agree, and be bound. Or it may point out that the councils were royal from the first canon onward, and that a king who cannot dismiss an assembly is not the king the Goths elected."
 nd_got.7.a: "The council sits by right and cannot be dismissed"
 nd_got.7.b: "The council sits when summoned, as it always did"
 nd_got.8.t: "The Anointing of Wamba"
 nd_got.8.d: "Recceswinth died at Gerticos in September 672 and the magnates with him acclaimed Wamba on the spot, an old man who by every account did not want it. He refused until a duke drew a sword on him.\n\nThen he did something no king in the Latin West had done. He went to Toledo, and on the nineteenth of September, in the church of the Praetorian Saints Peter and Paul, Quiricus the metropolitan poured oil on his head. Eighty-two years before Pepin the Short, in a kingdom the Franks called barbarous, a king was consecrated by the church at his accession.\n\nIt made his person sacred. It did not make his office hereditary. The Goths went on electing their kings, and going on killing them, and the two facts sat side by side for the rest of the kingdom's life."
 nd_got.8.a: "Let the oil be poured, as it was at Toledo"
 nd_got.9.t: "One Law for Every Inhabitant"
 nd_got.9.d: "The Real Academia printed the Fuero Juzgo in 1815 with the Latin and the Castilian on facing pages, and the men writing constitutions found something inconvenient in it. The oldest law in Europe already said what they were arguing for: that the law is territorial, that it binds every inhabitant of the realm, and that a man's descent does not decide which court he stands in.\n\nIn 654 that meant Goth and Roman. It is not obvious what it means now, and that is exactly the fight.\n\nOne reading makes the code a living instrument and applies its principle to everyone the realm has since acquired. The other makes it a monument: the nation's oldest possession, studied and honoured, and left where it is."
 nd_got.9.a: "The principle is living law and binds everyone we hold"
 nd_got.9.b: "The code is the nation's oldest inheritance, and a monument"

 # Option hover tooltips
 nd_got.1.a_tt: "The kingdom is proclaimed in the language of the councils and the code."
 nd_got.1.b_tt: "The kingdom is proclaimed in the language of Wulfila's Bible."
 nd_got.2.a_tt: "Recceswinth's monopoly clause enforced against every local custom."
 nd_got.2.b_tt: "The code applied where it fits and glossed where it does not."
 nd_got.3.a_tt: "The canons of Toledo become the law of the kingdom."
 nd_got.3.b_tt: "The council remains a royal instrument, summoned at need."
 nd_got.4.a_tt: "Every town taken is handed the Fuero Juzgo as its charter."
 nd_got.4.b_tt: "Towns keep their own charters under royal confirmation, for a fee."
 nd_got.5.a_tt: "Toledo's jurisdiction pressed on Braga, Tarragona and Compostela."
 nd_got.5.b_tt: "Toledo keeps the title and gives up the jurisdiction."
 nd_got.6.a_tt: "The Hispanic rite endowed and sung daily out of a printed missal."
 nd_got.6.b_tt: "The realm conforms to the Roman use and keeps the old books."
 nd_got.7.a_tt: "An assembly the crown cannot dismiss."
 nd_got.7.b_tt: "An assembly that meets when the crown has business for it."
 nd_got.8.a_tt: "The metropolitan of Toledo consecrates the king at his accession."
 nd_got.9.a_tt: "Territorial jurisdiction applied to every inhabitant of the realm."
 nd_got.9.b_tt: "The code honoured as a national monument and left where it stands."

 # ==========================================================================
 # TIMED MODIFIERS
 # ==========================================================================
 STATIC_MODIFIER_NAME_nd_got_regnum_gothorum: "Regnum Gothorum"
 STATIC_MODIFIER_DESC_nd_got_regnum_gothorum: "The restored kingdom is a juridical person: the councils, the code, and the primacy of Toledo, continuous with Reccared. The crown that rules through the councils does not rule alone."
 STATIC_MODIFIER_NAME_nd_got_reiki_gutane: "Reiki Gutane"
 STATIC_MODIFIER_DESC_nd_got_reiki_gutane: "The kingdom named in the tongue of Wulfila. A people rather than an office, a king held by the oath of his sworn men, and a name that Latin Christendom hears as an archaism."
 STATIC_MODIFIER_NAME_nd_got_no_other_law: "Let No Other Law Be Cited"
 STATIC_MODIFIER_DESC_nd_got_no_other_law: "Recceswinth's clause enforced to the letter. Every court in the realm opens the same book, and the local customs the magnates lived by are simply not admissible."
 STATIC_MODIFIER_NAME_nd_got_code_absorbs_custom: "The Code Takes In What It Finds"
 STATIC_MODIFIER_DESC_nd_got_code_absorbs_custom: "The Liber is applied where it fits and glossed where it does not. Slower, but nobody is told their grandfather's law was never law."
 STATIC_MODIFIER_NAME_nd_got_council_legislates: "The Council Legislates"
 STATIC_MODIFIER_DESC_nd_got_council_legislates: "The canons of Toledo are the law of the kingdom, and the men who write them wear mitres."
 STATIC_MODIFIER_NAME_nd_got_king_convokes: "The King Convokes"
 STATIC_MODIFIER_DESC_nd_got_king_convokes: "The council is a royal instrument, as its first canon says. It meets when the crown has business for it."
 STATIC_MODIFIER_NAME_nd_got_fuero_granted: "The Fuero Juzgo Granted"
 STATIC_MODIFIER_DESC_nd_got_fuero_granted: "Every town taken is handed the code as its charter, and told it was always under this law. Incorporation by legal fiction, at the price of a printing."
 STATIC_MODIFIER_NAME_nd_got_fueros_confirmed: "The Towns Confirmed"
 STATIC_MODIFIER_DESC_nd_got_fueros_confirmed: "Each town keeps its own charter under royal confirmation, and pays for the privilege in coin and loyalty."
 STATIC_MODIFIER_NAME_nd_got_primacy_pressed: "The Primacy Pressed"
 STATIC_MODIFIER_DESC_nd_got_primacy_pressed: "Braga is summoned, Tarragona is overruled, and the cross of Toledo goes before the primate in every cathedral of the peninsula. Nobody outside Iberia thanks us for it."
 STATIC_MODIFIER_NAME_nd_got_primacy_of_honour: "A Primacy of Honour"
 STATIC_MODIFIER_DESC_nd_got_primacy_of_honour: "Toledo keeps the title and drops the jurisdiction. The Spanish church is at peace with itself for the first time in four hundred years."
 STATIC_MODIFIER_NAME_nd_got_rite_endowed: "The Old Rite Endowed"
 STATIC_MODIFIER_DESC_nd_got_rite_endowed: "Thirteen chaplains sing the mass of Isidore daily in the cathedral, out of a printed missal, in a liturgy older than the reformed papacy that once suppressed it."
 STATIC_MODIFIER_NAME_nd_got_rite_conformed: "Conformed to the Roman Use"
 STATIC_MODIFIER_DESC_nd_got_rite_conformed: "The realm sings what Rome sings, and the Mozarabic chapel keeps the old books as a memory rather than a practice."
 STATIC_MODIFIER_NAME_nd_got_council_by_right: "The Council Sits by Right"
 STATIC_MODIFIER_DESC_nd_got_council_by_right: "An assembly the crown cannot dismiss, sitting on the precedent of Toledo. The kingdom now has a constitution and knows it."
 STATIC_MODIFIER_NAME_nd_got_council_by_summons: "The Council Sits by Summons"
 STATIC_MODIFIER_DESC_nd_got_council_by_summons: "The councils were royal from the first canon onward. The crown intends to keep them that way."
 STATIC_MODIFIER_NAME_nd_got_unction_of_wamba: "The Unction of Wamba"
 STATIC_MODIFIER_DESC_nd_got_unction_of_wamba: "Oil poured by the metropolitan of Toledo on 19 September 672, eighty-two years before any Frankish king was consecrated the same way. The person of the king is now sacred. The office is still elective."
 STATIC_MODIFIER_NAME_nd_got_code_for_all: "The Principle Is Living Law"
 STATIC_MODIFIER_DESC_nd_got_code_for_all: "Territorial jurisdiction carried to its conclusion. In 654 it meant Goth and Roman; now it means everyone the realm holds."
 STATIC_MODIFIER_NAME_nd_got_code_as_heritage: "The Oldest Inheritance"
 STATIC_MODIFIER_DESC_nd_got_code_as_heritage: "The Fuero Juzgo studied, printed and honoured as the nation's founding document, and left exactly where it stands."

 # ==========================================================================
 # ADVANCES
 # ==========================================================================
 nd_got_liber_iudiciorum: "Liber Iudiciorum"
 nd_got_liber_iudiciorum_desc: "The code of Chindasuinth and Recceswinth, promulgated in 654 after revision at the Eighth Council of Toledo. Its innovation was territoriality: one law over Goth and Roman alike, replacing a system in which ancestry decided which book was opened over a man."
 nd_got_concilia_toletana: "Councils of Toledo"
 nd_got_concilia_toletana_desc: "Eighteen synods between 400 and 702, convoked by the king and attended by bishops, abbots and the counts of the palatine office. Their canons were promulgated as royal law, making them the only body in post-Roman Europe that legislated for church and crown at once."
 nd_got_universal_muster: "The Muster of the Whole People"
 nd_got_universal_muster_desc: "Wamba's military law of 673, revised by Ervig in 681. It binds general, count and gardingus, Goth and Roman, freeman and manumitted slave, and in Wamba's original text bishops and their retainers as well. No other early medieval kingdom conscripted across ethnicity, clergy and servile status at once."
 nd_got_gardingi: "The Gardingi"
 nd_got_gardingi_desc: "The sworn men of the royal household, holding their rank from a personal oath rather than from land tenure. Ervig's muster law names them as an order beside dukes and counts. They were the crown's counterweight to a nobility that elected kings and unmade them."
 nd_got_pyrenean_closures: "The Clausurae"
 nd_got_pyrenean_closures_desc: "The Gothic pass closures at Panissars and through the Corberes defiles: walls across defiles rather than castles on hills. Wamba forced them in 673 to recover Septimania, and they were the last barrier the Arab-Berber columns crossed in 719."
 nd_got_aurifex_regis: "The Royal Goldsmiths"
 nd_got_aurifex_regis_desc: "The workshops that produced the Guarrazar treasure: twenty-six votive crowns and crosses in gold, sapphire, pearl and cloisonne garnet, hung above altars rather than worn, and buried outside Toledo in 711."
 nd_got_charity_of_masona: "The Charity of Masona"
 nd_got_charity_of_masona_desc: "Masona of Merida, a Goth by birth, founded a hospital around 580 with salaried physicians, open to every comer, Christian and Jew alike, funded from a fixed share of the see's revenue and lending to the poor from a revolving fund."
 nd_got_regal_coinage: "The Regal Coinage"
 nd_got_regal_coinage_desc: "From about 575 Leovigild struck his own name on the tremissis and the mint city on the reverse, breaking with imitative imperial issues. Nearly a hundred mints served the kingdom, sited where tax was gathered and where armies moved."
 nd_got_fuero_charter: "The Code as Charter"
 nd_got_fuero_charter_desc: "Ferdinand III had the Liber translated into Castilian and granted it as the municipal fuero of Cordoba in 1241, then of Seville and Murcia. A conquered city was not given a new law; it was told which law it had always been under."
 nd_got_officium_palatinum: "The Officium Palatinum"
 nd_got_officium_palatinum_desc: "The counts of the household, the treasury, the patrimony and the cubicle, with the royal notaries: a salaried ministerial court in an age of household government, sitting at the councils beside the bishops."
 nd_got_littera_toletana: "Littera Toletana"
 nd_got_littera_toletana_desc: "The Visigothic minuscule, the Iberian book hand that outlived the kingdom by four centuries and was displaced only when the Cluniac reform imposed Carolingian script after 1080. Everything the peninsula remembered of itself was written in it."
 nd_got_ecclesiastical_primacy: "Primacy of the Spains"
 nd_got_ecclesiastical_primacy_desc: "The bull Cunctis Sanctorum of 1088 restored to Toledo the primatial standing it held under the Gothic kings and named Bernard of Sedirac first primate. Braga, Tarragona and Compostela disputed it for centuries."
 nd_got_hispanic_rite: "The Hispanic Rite"
 nd_got_hispanic_rite_desc: "The liturgy of Isidore and Ildefonsus, suppressed in favour of the Roman use in 1080 and surviving in six parishes of Toledo. Cisneros printed its missal in 1500 and endowed a cathedral chapel to sing it daily."
 nd_got_palatine_guard: "The Spatharii"
 nd_got_palatine_guard_desc: "The sword-bearers of the palace, the standing guard of a court where the succession was elective and the previous king had often died of it. Julian of Toledo places them at Wamba's side on the march into Septimania."
 nd_got_via_gothica: "The Gothic Road"
 nd_got_via_gothica_desc: "Toledo sits in the middle of the meseta and Narbonne on the Gulf of Lion, and the only thing joining them is the old Roman trunk road through Zaragoza and the Pyrenean gates. Manned way-stations are the difference between one realm and two."
 nd_got_law_of_all_peoples: "The Law of All Peoples"
 nd_got_law_of_all_peoples_desc: "Recceswinth's code forbids citing any other law in a Gothic court. The point is not exclusion but reach: a subject's ancestry no longer decides his jurisdiction, so the realm can hold peoples it has not assimilated."
 nd_got_toledan_goldwork: "Opus Interrasile"
 nd_got_toledan_goldwork_desc: "The pierced goldwork and hanging pendilia of the later Guarrazar crowns, a Byzantine technique the Toledan workshops took over and kept. Sapphire and pearl replace garnet, which is the kingdom's trade reach showing in its jewellery."
 nd_got_permanent_council: "The Council Made Permanent"
 nd_got_permanent_council_desc: "Eighteen councils across three centuries all met because a king wanted them to. A council that sits by right rather than by summons is a different institution, and the Gothic precedent is the one argument a crown cannot refuse without denying its own title."
 nd_got_general_host: "The General Host"
 nd_got_general_host_desc: "The muster clause of the code restated for an age of firearms. Every free subject still owes service, and the roll is kept by the same city courts that keep the land registers."
 nd_got_septimanian_march: "The Septimanian March"
 nd_got_septimanian_march_desc: "The Gothic province in Gaul: seven sees from Narbonne to Nimes, held for two centuries after Toulouse was lost at Vouille in 507. Holding it means garrisoning the far side of a mountain range against whoever rules the Rhone."
 nd_got_narbonne_staple: "The Narbonne Staple"
 nd_got_narbonne_staple_desc: "Septimania's value was never its farmland. Narbonne was the Roman trunk port of southern Gaul and the junction where the Via Domitia met the Via Aquitania, and a crown holding both ends of that road taxes the traffic without needing a fleet."
 nd_got_national_jurisprudence: "National Jurisprudence"
 nd_got_national_jurisprudence_desc: "Villadiego printed the Fuero Juzgo with commentary in 1600 and advocates argued from it in open court. A kingdom whose working law is a seventh-century code does not need to invent a legal tradition, only a faculty to teach the one it has."
 nd_got_royal_unction: "The Royal Unction"
 nd_got_royal_unction_desc: "Quiricus of Toledo anointed Wamba on 19 September 672, the first consecration of a king at his accession in the Latin West, eighty-two years before Pepin the Short. It made the king's person sacred without making his office hereditary."
 nd_got_primatial_chancery: "The Primatial Chancery"
 nd_got_primatial_chancery_desc: "A see claiming jurisdiction over every other metropolitan in the peninsula needs an apparatus to exercise it. By the eighteenth century Toledo's was the largest ecclesiastical administration in Iberia."
 nd_got_royal_retinue: "The Royal Retinue"
 nd_got_royal_retinue_desc: "The gardingi did not disappear. They were re-established as the household horse of an absolutist court, drawn from the same families, holding a commission where their ancestors held an oath."
 nd_got_academy_edition: "The Academy Edition"
 nd_got_academy_edition_desc: "The Real Academia Espanola printed the Fuero Juzgo in 1815 with the Latin and the Castilian on facing pages, and antiquarians argued over whether the kingdom's oldest law was also its most liberal."
 nd_got_civil_code: "The Civil Code"
 nd_got_civil_code_desc: "The Liber's territorial principle carried to its conclusion: every inhabitant of the realm tried by one law regardless of descent. In the seventh century that meant Goth and Roman; in the nineteenth it means everyone else."
 nd_got_national_conscription: "National Conscription"
 nd_got_national_conscription_desc: "The muster clause outlives every other article of the code, because every state eventually wants it. The kingdom that has conscripted its whole free population since 673 simply keeps the rolls."
 nd_got_gothic_revival: "The Gothic Revival"
 nd_got_gothic_revival_desc: "The nineteenth century dug up Guarrazar and sent the crowns to Paris and Madrid, and the Toledan workshops answered with a trade in damascened and cloisonne reproduction. Antiquarianism became an export."

 # ==========================================================================
 # UNITS
 # ==========================================================================
 a_nd_got_thiufa: "Thiufa"
 a_nd_got_thiufa_desc: "The levy of a thousand under its thiufadus, raised by legal compulsion across every rank of the free population. It holds its ground because breaking it costs a man his standing in law, and it fights like what it is: farmers, labourers and clerics with spears."
 a_nd_got_gardingi: "Gardingi"
 a_nd_got_gardingi_desc: "The king's sworn men, holding their rank from a personal oath rather than from land. They charge frontally, they break morale where they land, and they pay for both in casualties."
 a_nd_got_spatharii: "Spatharii"
 a_nd_got_spatharii_desc: "The sword-bearers of the palace, the standing guard of an elective monarchy that had buried too many kings. Immovable in a line and slow to move anywhere else."
 a_nd_got_hoste_del_fuero: "Hueste del Fuero"
 a_nd_got_hoste_del_fuero_desc: "The general host of the code with matchlocks. Called out from the same rolls the city courts keep for land, faster to raise than any contract army and made of townsmen rather than veterans."
 a_nd_got_gardingi_reales: "Gardingos Reales"
 a_nd_got_gardingi_reales_desc: "The household horse of an absolutist court, still sworn to the king's person and still drawn from the families that swore seven centuries ago. Splendid in the charge and poorly suited to a long campaign away from the court that pays them."
 a_nd_got_milicia_del_fuero: "Milicia del Fuero"
 a_nd_got_milicia_del_fuero_desc: "Universal conscription under the oldest conscription law in Europe. The rolls were already there when the rifles arrived."

 # ==========================================================================
 # LEVIES
 # ==========================================================================
 levy_nd_got_thiufa: "Thiufa Levy"
 levy_nd_got_thiufa_desc: "The muster of the whole free population, drawn from soldiers, peasants, labourers and clergy alike, because Wamba's law of 673 bound bishops and their retainers along with everyone else."
 levy_nd_got_gardingi: "Gardingi Levy"
 levy_nd_got_gardingi_desc: "The sworn men of the royal household, raised from the noble families bound to the king by personal oath."
 levy_nd_got_hoste_del_fuero: "Hueste del Fuero Levy"
 levy_nd_got_hoste_del_fuero_desc: "The general host of the code in the age of the matchlock, called from the rolls kept by the city courts."
 levy_nd_got_gardingi_reales: "Gardingos Reales Levy"
 levy_nd_got_gardingi_reales_desc: "The household cavalry of the court, commissioned from the same noble houses that once swore the gardingal oath."
 levy_nd_got_milicia_del_fuero: "Milicia del Fuero Levy"
 levy_nd_got_milicia_del_fuero_desc: "National conscription under the muster clause of the Liber Iudiciorum, eleven centuries after it was written."

 # ==========================================================================
 # BUILDINGS
 # ==========================================================================
 nd_got_liber_court: "Court of the Liber Iudiciorum"
 nd_got_liber_court_desc: "The court of the comes civitatis and his iudex, holding the certified copy of the code that Recceswinth's law required of every jurisdiction, and forbidden to open any other book."
 nd_got_aula_regia: "Aula Regia"
 nd_got_aula_regia_desc: "The palatine court and the hall of the councils: bishops, abbots, the counts of the household and the magnates of the realm, legislating together and publishing their canons as royal law. It stood at Toledo and could stand nowhere else."
 nd_got_clausurae: "The Clausurae"
 nd_got_clausurae_desc: "Walls thrown across a mountain defile rather than a castle on a hill. The Gothic pass closures held the two halves of the kingdom together, and their fall in 719 ended it."
 nd_got_aurifex: "Royal Goldsmiths' Workshop"
 nd_got_aurifex_desc: "The workshops that hung crowns above altars: gold, sapphire, pearl and cloisonne garnet, with the king's name spelled out in letters dangling from the rim."
 nd_got_xenodochium: "Xenodochium"
 nd_got_xenodochium_desc: "An episcopal hospital on Masona's model, with salaried physicians, open to Christian and Jew alike, and lending to the poor from a fund the see replenishes every year."
 nd_got_moneta_regia: "Moneta Regia"
 nd_got_moneta_regia_desc: "A provincial mint striking the tremissis with the king's name on one face and the city's on the other. Its purpose is not bullion but jurisdiction: the crown made visible in a town it rarely visits."
 nd_got_sedes_primatialis: "Primatial See"
 nd_got_sedes_primatialis_desc: "The see that summons other metropolitans, hears appeals from their courts and has its cross carried before it in their cathedrals. There can be only one, and it argues its case from the councils."
 nd_got_capilla_mozarabe: "Mozarabic Chapel"
 nd_got_capilla_mozarabe_desc: "A chapel endowed to sing the Hispanic rite daily out of a printed missal, keeping alive a liturgy that Rome suppressed and that six parishes of Toledo refused to give up."
 nd_got_mansio_regia: "Mansio Regia"
 nd_got_mansio_regia_desc: "A royal way-station on the Gothic road, a day's ride from the next one, where couriers change horses and the writ of a capital in the middle of the meseta keeps moving toward the sea."
 nd_got_catedra_del_fuero: "Catedra del Fuero Juzgo"
 nd_got_catedra_del_fuero_desc: "A faculty whose entire curriculum is one seventh-century book, and whose graduates fill the courts that apply it."

