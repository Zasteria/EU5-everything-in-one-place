 # PRODUCTION METHODS
 # ==========================================================================
 nd_got_liber_court_maintenance: "Court Registry"
 nd_got_liber_court_maintenance_desc: "Parchment, ink and beeswax for the seals. A court whose authority rests on a written code spends most of its budget on writing."
 nd_got_aula_regia_maintenance: "Conciliar Session"
 nd_got_aula_regia_maintenance_desc: "The cost of assembling the bishops and magnates of a kingdom, feeding them, and publishing what they agreed."
 nd_got_clausurae_maintenance: "Pass Garrison"
 nd_got_clausurae_maintenance_desc: "Stone, timber and weapons hauled up to a wall across a defile that nobody lives near."
 nd_got_pm_gold_cloisonne: "Cloisonne Goldwork"
 nd_got_pm_gold_cloisonne_desc: "Garnets set in gold cells, the technique of the earlier Guarrazar crowns and of the Germanic world that produced them."
 nd_got_pm_opus_interrasile: "Opus Interrasile"
 nd_got_pm_opus_interrasile_desc: "Pierced goldwork with hanging pendilia of pearl and glass, the later Byzantine-influenced Toledan manner."
 nd_got_pm_revival_goldwork: "Revival Goldwork"
 nd_got_pm_revival_goldwork_desc: "Reproduction damascene and cloisonne for a nineteenth-century market that has just seen the Guarrazar crowns in a museum case."
 nd_got_xenodochium_maintenance: "Hospital Endowment"
 nd_got_xenodochium_maintenance_desc: "Medicines, pulses, wine and linen, paid from a fixed share of the see's revenue as Masona's charter laid down."
 nd_got_moneta_regia_maintenance: "Minting Operations"
 nd_got_moneta_regia_maintenance_desc: "Dies, fuel and bullion for a small provincial mint whose real output is the king's name."
 nd_got_sedes_primatialis_maintenance: "Primatial Household"
 nd_got_sedes_primatialis_maintenance_desc: "The books, vestments and wine of a see that keeps its own canon lawyers and answers appeals from half the peninsula."
 nd_got_capilla_mozarabe_maintenance: "Chaplaincy of the Old Rite"
 nd_got_capilla_mozarabe_maintenance_desc: "Thirteen chaplains, the printed missal, candles and altar wine, endowed in perpetuity."
 nd_got_mansio_regia_maintenance: "Way-Station Provisions"
 nd_got_mansio_regia_maintenance_desc: "Fodder, bread and remounts for couriers and troops moving between the meseta and the Gulf of Lion."
 nd_got_catedra_maintenance: "Faculty of the Code"
 nd_got_catedra_maintenance_desc: "Paper, printed editions and bindings for a school that teaches one book and examines on nothing else."

