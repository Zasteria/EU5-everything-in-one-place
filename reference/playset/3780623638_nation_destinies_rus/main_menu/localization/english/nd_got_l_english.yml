 nd_got_e1_done_tt: "The restoration has already been proclaimed"
 nd_got_formed_tt: "Regnum Gothorum has been restored"
 nd_got_path_a_tt: "Proclaimed as Regnum Gothorum"
 nd_got_path_b_tt: "Proclaimed as Reiki Gutane"

 # ==========================================================================
 # DESTINY TREE
 # ==========================================================================
 nd_got_destiny: "The Sickness of the Goths"
 nd_got_destiny_desc: "Canon 75 of the Fourth Council of Toledo, in 633, laid down that a king is raised by the common consent of the magnates and the bishops of the whole people, and pronounced anathema on any man who took the crown otherwise. In the seventy years that followed, kings were deposed, blinded, tonsured and murdered until the Franks had a name for the habit: the sickness of the Goths.\n\nEverything else in the restored constitution is settled. The code is written, the councils have their canons, the primate has his see. Only the making of a king is open, and until the realm closes it every accession is a war waiting for a candidate.\n\n#bold Requires:#! a stable realm."
 nd_got_dest_canon_75: "The Seventy-Fifth Canon"
 nd_got_dest_canon_75_desc: "Isidore of Seville presided at Toledo in 633 and the seventy-fifth canon is his work: the king is raised by the common consent of the magnates and the bishops of the whole people, and whoever seizes the throne by any other means is cast out of the church and out of the kingdom.\n\nRead the wording closely. It says the bishops of the whole people, and the whole people includes the Gothic sees beyond the mountains. An election held while a third of the episcopate answers to a foreign crown is not the election the canon describes. Narbonne is already yours. Its suffragans are not.\n\n#bold Requires:#! Béziers and Agde, and a stable realm."
 nd_got_dest_fiscus_publicus: "The Fisc and the Patrimony"
 nd_got_dest_fiscus_publicus_desc: "At the Eighth Council of Toledo in 653 the bishops were handed the most awkward question a court can be asked. Chindasuinth had confiscated on a scale that made his family rich, and his son Recceswinth laid the whole of it before the council rather than keep it quietly.\n\nWhat came out was a rule that has no equal in any other successor kingdom. Whatever a king acquires after his accession belongs to the treasury of the realm and not to his heirs. His own inherited patrimony remains his own and passes as any man's does. A king who cannot leave the kingdom's revenue to his children has an office to hand on, and not an estate.\n\n#bold Requires:#! Lodève and Nîmes, a treasury of 2000, banking embraced, and a stable realm."
 nd_got_dest_rex_sub_lege: "The King Under the Code"
 nd_got_dest_rex_sub_lege_desc: "Isidore wrote it as wordplay and the lawyers took it as a rule of forfeiture. #italic Rex eris si recte facias, si non facias non eris.#! You will be a king if you act rightly; if you do not, you will not be one.\n\nA crown conferred by an assembly, out of a written code, is held on the code's terms and can be lost on them. This is the end of the argument the councils began: the office outlives the man, the law outranks the office, and the kingdom is a person in law that continues whoever wears the crown. It is not won with an army. It is won by being rich, lettered, stable and old.\n\n#bold Requires:#! the enlightenment embraced, 3000 in the treasury, 10000 total development, 75 prestige, and a stable realm."
 nd_got_dest_rex_cum_patre: "The King Crowned in His Father's Life"
 nd_got_dest_rex_cum_patre_desc: "There is exactly one way a Gothic king ever beat the election, and it is not an argument. It is timing. Chindasuinth was eighty and Braulio of Zaragoza wrote urging him to it, and on the twentieth of January 649 his son Recceswinth was crowned beside him while he still breathed. Leovigild had done it for Hermenegild and Reccared; Egica did it for Wittiza. The sworn men swear to the son in the father's lifetime, and when the father dies there is nothing left to elect.\n\nA king made by his own men owes them a war. The oldest debt in the kingdom is the strait, which Count Julian of Ceuta opened in 711 with his own ships.\n\n#bold Requires:#! Ceuta and Tangier, and an army of 30 regiments."
 nd_got_dest_gens_una: "One People, Two Kingdoms"
 nd_got_dest_gens_una_desc: "The Goths parted at the Danube and were never formally two nations. Theodoric the Amal ruled Italy from Ravenna, married his daughter to the Visigothic king, and when that king fell at Vouillé in 507 took the Spanish kingdom into his own hand and held both until he died in 526. One Gothic realm from Sicily to the Tagus, for nineteen years.\n\nA crown that claims a people rather than an office is claiming the people entire. The other half of it lies at Ravenna under a roof cut from a single stone, and Verona, which the German poets went on calling Bern for eight hundred years, was Theodoric's own city.\n\n#bold Requires:#! Ravenna and Verona, an army of 50 regiments, and 50 prestige."
 nd_got_dest_gutthiuda: "The Tongue Still Spoken"
 nd_got_dest_gutthiuda_desc: "In 1562 Ogier Ghiselin de Busbecq, the emperor's ambassador at Constantinople, fell into conversation with two envoys from the Crimea and wrote down eighty six of their words. #italic Broe#! for bread. #italic Ada#! for egg. #italic Reghen#! for rain. #italic Handa#! for hand.\n\nHe had found the last people on earth who spoke Gothic: a thousand years and three thousand miles from Toledo, in the mountains above the Black Sea, in a principality the Greeks called Theodoro and the maps still label Gothia. Kaffa below them is the Genoese port that is the gate to it.\n\nAn office would never recognise the obligation. A people does. Go and get them.\n\n#bold Requires:#! Theodoro and Kaffa, an army of 75 regiments, and 75 prestige."

 # ==========================================================================
 # DESTINY EVENTS
 # ==========================================================================
 nd_got.10.t: "The Sickness of the Goths"
 nd_got.10.d: "Your jurists have the canons open again, and this time there is nothing to argue about. The seventy-fifth canon of Toledo IV is unambiguous. The king is raised by the common consent of the magnates and the bishops of the whole people. He is not born to it.\n\nThen they turn the page and read the rest of the century. Chindasuinth took the throne from Tulga in a coup and had two hundred noble families destroyed to keep it. Wamba was tonsured while unconscious and woke up a monk. Ervig produced a deathbed abdication nobody believed. Witiza's sons were still fighting Roderic when the ships came over from Africa, and the Franks wrote the whole thing down under one heading: #italic morbus Gothorum#!, the sickness of the Goths, the disease of killing your kings.\n\nThe restored kingdom has inherited the title, the code, the councils and the primacy. It has also inherited this. Nothing in the constitution says how a Gothic king is made, and until something does, every deathbed in Toledo is a mobilisation."
 nd_got.10.a: "Then let the realm settle it, and settle it for good"
 nd_got.11.t: "Anathema"
 nd_got.11.d: "The canon is read out in full at the opening of the council, in the form Isidore left it. The king shall be raised by the common consent of the magnates and the bishops of the whole people. Whoever seizes the crown by tyranny, by usurpation, by oath sworn to a faction or by the blood of a predecessor is anathema before God and cast out from the church and from the whole assembly of Christians with all the accomplices of his impiety.\n\nThe bishops rise and repeat it, and the magnates rise and repeat it, and for the first time since 711 the sentence has an assembly behind it that can actually pronounce it. What they have made is not a ceremony. It is an electorate, and every man in the room now knows that a claimant without their votes is not a rival king but an excommunicate with an army.\n\nThe Septimanian bishops sit with them. They were the point. The canon says the whole people, and a Gothic election held without the sees beyond the mountains would have been exactly the sort of faction the canon condemns."
 nd_got.11.a: "Let no man be king who is not made king in this room"
 nd_got.12.t: "The Treasury and the Purse"
 nd_got.12.d: "The estates of the late king are being counted, and the count has produced the question the councils answered in 653 and every court since has tried to forget.\n\nChindasuinth confiscated on a scale that left his family among the richest in the peninsula, and it was his own son Recceswinth who laid the ledgers before the Eighth Council of Toledo rather than inherit them quietly. The bishops separated the two heaps. What a king acquires after his accession he acquires as king, and it belongs to the treasury of the realm. What he inherited before it he holds as a man, and it passes to his children like anyone else's land.\n\nThat is the whole doctrine of the crown as an office, written in money instead of Latin. Your treasurers want to know which heap the current pile belongs in, and they would like it in writing."
 nd_got.12.a: "What the crown takes belongs to the kingdom, not the king's heirs"
 nd_got.12.b: "The king keeps his own lands, and the realm is paid from them"
 nd_got.13.t: "Rex Eris Si Recte Facias"
 nd_got.13.d: "The formula is Isidore's and it was never meant to be litigated. #italic Rex eris si recte facias, si non facias non eris.#! You will be a king if you act rightly; if you do not, you will not be one. He was playing on the old etymology that derives #italic rex#! from #italic recte#!, and the lawyers have spent four centuries refusing to treat it as a joke.\n\nTheir argument is finished and it is airtight. The crown is conferred by an assembly. It is conferred out of a written code. What is granted on terms can be withdrawn on the same terms, and therefore the kingship is an office with conditions attached and not a possession at all.\n\nThe crown may accept that, swear to the code before the oil touches its head, and become the first monarchy in Europe that is formally answerable to its own law. Or it may accept the argument and reverse its direction: the code binds the realm, the crown is the code's judge and not its subject, and the officers who enforce it answer to the king."
 nd_got.13.a: "The king swears to the code before the crown touches him"
 nd_got.13.b: "The code binds the realm, and the crown is the code's judge"
 nd_got.14.t: "The Son Crowned Beside the Father"
 nd_got.14.d: "Braulio of Zaragoza wrote the letter that mattered. Chindasuinth was eighty, the realm was quiet for once, and the bishop put it to him plainly: name the boy now, while you can still make them swear.\n\nOn the twentieth of January 649 Recceswinth was crowned beside his living father, and four years later he inherited a kingdom without a single claimant riding for Toledo. It was not new. Leovigild had raised Hermenegild and Reccared in his own lifetime. Egica did the same for Wittiza. Association does not win the argument about elective kingship; it makes the argument irrelevant, because the men who would do the electing have already sworn.\n\nSo the oath is taken and the crown is on a boy's head, and the men who swore it want to be used. Across the water is Septem, which the Goths held until Count Julian sent his ships to fetch Tariq over in 711. There is no older debt in the kingdom."
 nd_got.14.a: "The oath is sworn to the son. Now take them across the water"
 nd_got.15.t: "The Amal Inheritance"
 nd_got.15.d: "Ravenna is yours, and in the mausoleum outside the wall there is a roof cut from a single block of Istrian stone, three hundred tons of it, over an empty porphyry tub. The Arians were expelled and the body was thrown out long ago, but the Goths of the city know whose it was.\n\nTheodoric the Amal ruled Italy for thirty three years, married his daughter to the Visigothic king, and after Vouillé took Spain into his own hand and held both realms until 526. It is the only time the gens was one polity, and the memory of it ran so deep that German poets were still singing about Dietrich von Bern, Theodoric of Verona, eight hundred years later.\n\nA crown that claims a people rather than an office has just made good on that claim. What it does with the Italians is the question. Theodoric's own answer was #italic civilitas#!: the Goths keep the sword, the Romans keep the pen, and neither takes up the other's work. The alternative is the one his people took when they first came in, and it is simpler. Give the sworn men their thirds of the land."
 nd_got.15.a: "Settle the sworn men on the land, as the Amals did"
 nd_got.15.b: "The Goths keep the sword and Italy keeps its offices"
 nd_got.16.t: "Broe, Ada, Reghen, Handa"
 nd_got.16.d: "The word list is a copy of a copy, and every clerk who reads it goes quiet.\n\nIn 1562 the emperor's ambassador at Constantinople, a Fleming named Busbecq who collected manuscripts and tulip bulbs, got into conversation with two envoys down from the Crimea. One was a Greek who had learned their speech; the other was one of them and had half forgotten it. Busbecq wrote down eighty six words. #italic Broe#!, bread. #italic Ada#!, egg. #italic Reghen#!, rain. #italic Handa#!, hand. #italic Fyder#!, four. #italic Ies#!, he is.\n\nHe knew exactly what he was holding. So do you. It is your language, spoken by farmers and vine dressers in the hills above the Black Sea, a thousand years and three thousand miles from the room where Reccared abjured Arianism, in a principality the Greeks called Theodoro and every map since has labelled Gothia.\n\nThe Ottomans starved Mangup out over five months in 1475. Your soldiers are standing in it now, and the people in the valley below still say #italic ada#! when they mean an egg."
 nd_got.16.a: "Bring them home, and let the people be one people again"
 nd_got.16.b: "Leave them where they are and hold Gothia as a far march"

 # ==========================================================================
 # DESTINY TIMED MODIFIERS
 # ==========================================================================
 STATIC_MODIFIER_NAME_nd_got_dest_fiscus_regni: "Fiscus Regni"
 STATIC_MODIFIER_DESC_nd_got_dest_fiscus_regni: "The treasury of the kingdom, audited by the council and closed to the royal household. Revenue rises because everyone can see where it goes, and the army waits its turn like everybody else."
 STATIC_MODIFIER_NAME_nd_got_dest_patrimonium_regis: "Patrimonium Regis"
 STATIC_MODIFIER_DESC_nd_got_dest_patrimonium_regis: "The king keeps his inheritance and the realm is paid out of it. A royal domain worked hard, drained, planted and rebuilt, because every acre of it is the crown's own living."
 STATIC_MODIFIER_NAME_nd_got_dest_rex_eris: "Rex Eris"
 STATIC_MODIFIER_DESC_nd_got_dest_rex_eris: "A crown that swore to the code before it was crowned. Every chancery in Christendom now knows that treaties made with this kingdom outlive the man who signed them, and negotiates accordingly."
 STATIC_MODIFIER_NAME_nd_got_dest_lex_ministrorum: "Lex Ministrorum"
 STATIC_MODIFIER_DESC_nd_got_dest_lex_ministrorum: "The code enforced downward. The king's judges ride circuit, the king's men watch the judges, and the schools that produce them are the best endowed in the peninsula. The merchants pay for all of it."
 STATIC_MODIFIER_NAME_nd_got_dest_sortes_gothicae: "Sortes Gothicae"
 STATIC_MODIFIER_DESC_nd_got_dest_sortes_gothicae: "The sworn men given their allotments, as the Goths took their thirds of Italy in 493. A landed warband musters faster and larger, and takes its wealth out of the soil instead of the road."
 STATIC_MODIFIER_NAME_nd_got_dest_civilitas: "Civilitas"
 STATIC_MODIFIER_DESC_nd_got_dest_civilitas: "Theodoric's formula, kept as he kept it. The Goths hold the sword and the Romans hold the pen, and a war fought by one caste of the realm wears down the rest of it far less."
 STATIC_MODIFIER_NAME_nd_got_dest_gutans_gathered: "The Gathered Goths"
 STATIC_MODIFIER_DESC_nd_got_dest_gutans_gathered: "The Crimean Goths brought west and settled among their own. The ranks fill from a people rather than a province, and a crown that went three thousand miles for eighty six words is not a crown anyone forgets."
 STATIC_MODIFIER_NAME_nd_got_dest_marca_gothica: "Marca Gothica"
 STATIC_MODIFIER_DESC_nd_got_dest_marca_gothica: "Gothia held where it stands, garrisoned above the Black Sea and supplied by sea. The forts pay for themselves in claims; the factors who might have been trading elsewhere do not."

 # ==========================================================================
 # DESTINY BUILDINGS
 # ==========================================================================
 nd_got_dest_thesaurus: "Thesaurus Publicus"
 nd_got_dest_thesaurus_desc: "The treasury of the kingdom, kept apart from the chamber of the king. What a king acquires after his accession is counted here and cannot be left to his children, which is the doctrine of the crown as an office stated in ledgers rather than in Latin."
 nd_got_dest_thesaurus_maintenance: "Treasury Audit"
 nd_got_dest_thesaurus_maintenance_desc: "Paper, wax, presses and the plain cloth of men who count other people's money for a salary. A treasury nobody may draw on privately is a treasury that must be seen to be checked."
 nd_got_dest_thiudangardi: "Thiudangardi"
 nd_got_dest_thiudangardi_desc: "Wulfila's Gothic word for kingdom, and it means the king's enclosure: a household and not an office. The hall where the sworn men are fed and quartered, and where an heir is acclaimed in his father's lifetime while the men who would otherwise elect him are standing in the room."
 nd_got_dest_thiudangardi_maintenance: "Household Provision"
 nd_got_dest_thiudangardi_maintenance_desc: "Meat, wine, timber and iron for a hall that keeps armed men fed all winter. The oath is renewed at the table, which means the table is never allowed to be poor."

 # Destiny option hover tooltips
 nd_got.10.a_tt: "The succession is put to the realm as a question to be settled."
 nd_got.11.a_tt: "The assembly of magnates and bishops becomes the electing body."
 nd_got.12.a_tt: "Royal acquisitions after the accession pass to the kingdom's treasury."
 nd_got.12.b_tt: "The king's inherited lands stay private and the crown lives from them."
 nd_got.13.a_tt: "The crown swears to the code and is answerable to it."
 nd_got.13.b_tt: "The crown enforces the code downward through its own officers."
 nd_got.14.a_tt: "The heir is crowned in his father's lifetime and the host crosses."
 nd_got.15.a_tt: "The sworn men take allotments of Italian land."
 nd_got.15.b_tt: "A Gothic army over a Roman administration, as Theodoric ruled."
 nd_got.16.a_tt: "The Crimean Goths are resettled inside the kingdom."
 nd_got.16.b_tt: "Gothia is kept where it stands as a distant march."

 # ==========================================================================
 # BUREAUCRACIES
 # ==========================================================================
 got_numerarii_bureaucracy: "Numerarii of the Fisc"
 got_numerarii_bureaucracy_desc: "The tax establishment of the kingdom. The comes patrimonii at court appointed the numerarius of each city himself, for a term of one year, bypassing the province entirely: the fisc was the most centralised thing the Goths ran. The two Barcelona documents of 592, the De fisco Barcinonensi, record the bishops of Tarraconensis fixing what the collectors might take and what they might charge for taking it, and the Third Council of Toledo (589) had already ordered a provincial synod every year at which the fiscal agents answered for their conduct. The men who assessed the land were audited by the men who baptised it."
 got_schola_episcopalis_bureaucracy: "Episcopal Schools"
 got_schola_episcopalis_bureaucracy_desc: "Canon 1 of the Second Council of Toledo (527) ordered that boys given to the church be raised in a house attached to the cathedral, under the bishop's eye and a teacher's, until they were old enough to choose their own life. It is the earliest cathedral school on record anywhere in the Latin West. The Fourth Council (633) made the rule general, and what came out of those houses was Isidore's Etymologiae, the treatises of Ildefonsus and Julian, and the notarial hands that drafted the code."
 got_sacramentum_fidelitatis_bureaucracy: "Sacramentum Fidelitatis"
 got_sacramentum_fidelitatis_bureaucracy_desc: "The general oath of fidelity sworn to the king by the palatine office, the bishops and the people at every accession, set down in the written form the lawyers called conditiones sacramentorum. Recceswinth's code voided any oath sworn to a lord other than the king, a claim no monarchy north of the Pyrenees could make, since there the whole political order was built from exactly the private oaths this law annulled. Canon 75 of Toledo IV (633) put the anathema of the church behind it, and Egica laid his own oath before the Fifteenth Council in 688 to ask which part of it still bound him. The oath does not say who becomes king. It says the men who swore may not unmake one."
 got_conventus_vicinorum_bureaucracy: "Conventus Publicus Vicinorum"
 got_conventus_vicinorum_bureaucracy_desc: "The public assembly of the neighbours, the one jurisdiction the Liber Iudiciorum recognises below the count's court. A runaway had to be produced before it, a boundary proved before it, straying stock declared to it, and the lesser wrongs of a village settled in it by men who owed no lord for the right to judge. Its descendants are the village concilia of tenth century northern Iberia, which is why the rural clauses of a seventh century code were still working law four hundred years after the kingdom fell."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_got_bureaucracy_authority: "Offices of the Regnum"
 AUTO_MODIFIER_DESC_nd_got_bureaucracy_authority: "A kingdom restored by legal argument inherits the offices that argument names. Beyond the establishment of the royal city, the crown may keep one institution of the Gothic state in working order."
