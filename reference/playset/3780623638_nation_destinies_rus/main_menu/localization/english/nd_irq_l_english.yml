l_english:

 # ============================================================
 # Formation event
 # ============================================================
 nd_irq.1.t: "The City of Peace"
 nd_irq.1.d: "The bridge of boats is remade across the Tigris and the khutba is read in a new name. Iraq has a government again.\n\nWhat it does not have is the thing that made it rich. The Sawad was the highest-yielding tax province in the Islamic world for three hundred years because the canals worked. In 937, in a squalid war between two Turkish commanders, the Nahrawan was cut. Nobody with the money to repair it ever held the ground long enough to try. Tax receipts had already fallen by half before the Mongols arrived; Hulagu inherited a corpse and was blamed for the murder.\n\nSo the new state must decide what Baghdad is for. Al-Mansur called this place Madinat al-Salam, the City of Peace, and for two centuries it was two cities at once: the seat of the Commander of the Faithful, and the place where a Nestorian physician, a Sabian astronomer and a Persian grammarian argued in the same room and were all paid by the treasury. Those two Baghdads did not fall together, and they cannot both be rebuilt first.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_irq.1.a: "Dar al-Khilafa: Baghdad rules Islam again"
 nd_irq.1.a_tt: "Prestige, legitimacy, control and an easier war against other faiths. The Shia of the shrine cities are tolerated less."
 nd_irq.1.b: "Madinat al-Salam: Baghdad teaches it again"
 nd_irq.1.b_tt: "Research, literacy, institutions and a wide tolerance of other faiths. Fewer men answer the muster."

 # ============================================================
 # Advance events
 # ============================================================
 nd_irq.2.t: "The Breach at Nahrawan"
 nd_irq.2.d: "The engineers have walked the line from the Tigris offtake down past Baqubah to the old Wasit tail, and their report is not encouraging. Two hundred kilometres of channel, silted to the crown in places, the regulators robbed for their masonry, whole villages resettled onto the bed because the bed is the only ground that still holds moisture.\n\nIt can be dug. It has been dug before. The question the diwan cannot answer is who pays, and Iraq has only ever had two answers. The Abbasids in their strength mustered the villages by corvee and had the channel open in a season. The Abbasids in their weakness sold the works to the men who owned the land beside them, and never got the water back."
 nd_irq.2.a: "Muster the villages. The state digs its own canal."
 nd_irq.2.a_tt: "Faster building, higher revenue and firmer control. The Sawad villages remember the corvee."
 nd_irq.2.b: "Farm the works to the landholders for a share of the crop."
 nd_irq.2.b_tt: "Higher production, prosperity and development. The crown loses ground to the landholders."

 nd_irq.3.t: "The Four Doors"
 nd_irq.3.d: "Al-Mustansir's school opened in 1234 with something no school had attempted: four iwans off one courtyard, one for each of the Sunni schools of law, so that a Hanafi and a Hanbali would cross the same paving on their way to teach. A library, a hospital and a pharmacy stood behind them. The Mongols burned much and this survived; it is still standing on the left bank.\n\nThe teaching posts are vacant and the endowment is in the crown's gift. Whoever is invited through those doors will define what Iraqi learning means for the next three centuries."
 nd_irq.3.a: "Cut a fifth door. Bring the jurists of Hilla in."
 nd_irq.3.a_tt: "Research, literacy and tolerance of the Shia. The orthodox clergy are less devoted."
 nd_irq.3.b: "Make it the judicial academy of the realm."
 nd_irq.3.b_tt: "Lawmaking, stability and control. The Shia of the shrine cities are tolerated less."

 nd_irq.4.t: "The Thresholds"
 nd_irq.4.d: "They are called the Atabat, the thresholds: Ali at Najaf on the desert edge, Husayn at Karbala, the two imams at Kazimayn across the water from Baghdad, the Askari shrine at Samarra. Four holy cities inside a hundred miles of the capital, each with its keeper families, its endowments and its own quiet diplomacy.\n\nThey are not only devotional. Money arrives from Awadh in India and from Isfahan. Corpses arrive by the caravan-load for burial in the Valley of Peace, and the men who carry them carry news. A ruler in Baghdad who ignores the shrine cities is ignoring the wealthiest and best-connected institution in his own country."
 nd_irq.4.a: "Endow them, appoint their keepers, take the offerings."
 nd_irq.4.a_tt: "Devotion, prestige and the shrine revenue. The holy cities grow restive under an appointed hand."
 nd_irq.4.b: "Leave them their own government. Take the pilgrim roads."
 nd_irq.4.b_tt: "Overland trade, prosperity and standing abroad. The crown gives up its claim on the endowments."

 nd_irq.5.t: "The Mouth of the Gulf"
 nd_irq.5.d: "Everything that reaches Baghdad from India stops first at the head of the Gulf, because a hull built for the open sea cannot take the shoals of the lower rivers and a river boat cannot take the Gulf. The transhipment happens at Basra whether anyone plans it or not.\n\nWhat has changed is that a European power now sits at the strait and charges for the passage. The yards can build ghurab, oared and heavily gunned and shallow enough for the bar, which will beat anything afloat in confined water and lose badly outside it. Or the port can be thrown open to every flag on the understanding that a customs house makes more money than a squadron."
 nd_irq.5.a: "Hold the bar. Nobody passes without our leave."
 nd_irq.5.a_tt: "Stronger galleys, tighter blockades and a bigger presence at sea. The country tires of the fighting."
 nd_irq.5.b: "Open the roadstead. Every flag lands and every flag pays."
 nd_irq.5.b_tt: "Merchant power, seaborne trade and shelter for foreign faiths. The neighbours think less of us."

 nd_irq.6.t: "The Household"
 nd_irq.6.d: "Hasan Pasha came out from Istanbul as governor and started buying Georgian boys. He had them converted, schooled, taught horsemanship and accounts, and married into each other's families. Within a generation his kuls were the only competent administration between Mosul and the Gulf, and within two they were choosing the governor.\n\nThis is the oldest arrangement in the region and it has never once ended the way the buyer intended. The household is loyal, disciplined and effective. It is also, increasingly, the state, and it has no bloodline anyone can swear to."
 nd_irq.6.a: "Let the household govern. It governs well."
 nd_irq.6.a_tt: "Heavy cavalry, discipline and crown estates. A bought household is not a dynasty."
 nd_irq.6.b: "Seat the tribal shaykhs beside it and balance the two."
 nd_irq.6.b_tt: "Bigger levies, more manpower and a contented nobility. The divan decides nothing quickly."

 nd_irq.7.t: "The Indian Canal"
 nd_irq.7.d: "Five hundred thousand rupees arrived from Awadh, sent by ministers who would never see Iraq, to cut a channel from the Euphrates to Najaf so the shrine city would have water. It worked better than anyone wanted. The river found the new bed agreeable and began to prefer it. Desert between Najaf and Karbala came under the plough within a decade and Sunni tribes moved in to farm it.\n\nDownstream on the old Hilla branch the water is dropping. The gardens there are Abbasid-old. Holding both channels means building a masonry regulator at the fork, a work on a scale nobody in Iraq has attempted since the caliphs, and paying for it in silver the treasury does not have."
 nd_irq.7.a: "Let the Hindiyya run. Najaf blooms and Hilla is lost."
 nd_irq.7.a_tt: "Population growth, development and devotion. The towns on the old branch decline."
 nd_irq.7.b: "Build the regulator at the fork and hold both branches."
 nd_irq.7.b_tt: "Building speed, prosperity and development. The mint pays for it."

 # ============================================================
 # Formation variables
 # ============================================================
 nd_irq_formed_tt: "Iraq has been formed."
 nd_irq_path_a_tt: "Founding purpose: Dar al-Khilafa, the political capital."
 nd_irq_path_b_tt: "Founding purpose: Madinat al-Salam, the civilizational capital."

 # ============================================================
 # Timed modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_irq_dar_al_khilafa: "Dar al-Khilafa"
 STATIC_MODIFIER_DESC_nd_irq_dar_al_khilafa: "The House of the Caliphate. Baghdad claims again the right to arbitrate between Muslim rulers, and the Shia of the shrine cities hear the claim exactly as it is meant."
 STATIC_MODIFIER_NAME_nd_irq_madinat_al_salam: "Madinat al-Salam"
 STATIC_MODIFIER_DESC_nd_irq_madinat_al_salam: "The City of Peace, under the name al-Mansur gave it. Translators, physicians and stationers are paid before soldiers are, and the barracks are the first thing to empty."

 STATIC_MODIFIER_NAME_nd_irq_corvee_of_the_sawad: "Corvee of the Sawad"
 STATIC_MODIFIER_DESC_nd_irq_corvee_of_the_sawad: "The villages are mustered with basket and rope and the channel is open in a season. The Sawad remembers being mustered."
 STATIC_MODIFIER_NAME_nd_irq_farmed_waterworks: "Farmed Waterworks"
 STATIC_MODIFIER_DESC_nd_irq_farmed_waterworks: "The landholders dredge their own canal for a standing share of the crop. It stays dredged, and the crown never again decides alone where the water goes."
 STATIC_MODIFIER_NAME_nd_irq_the_fifth_door: "The Fifth Door"
 STATIC_MODIFIER_DESC_nd_irq_the_fifth_door: "The Imami jurists of Hilla teach in the Mustansiriya courtyard beside the four Sunni schools. No other madrasa on earth seats them all."
 STATIC_MODIFIER_NAME_nd_irq_school_of_the_qadis: "School of the Qadis"
 STATIC_MODIFIER_DESC_nd_irq_school_of_the_qadis: "Every judge in the realm holds a licence signed in one courtyard, and that courtyard decides what the law is."
 STATIC_MODIFIER_NAME_nd_irq_patron_of_the_thresholds: "Patron of the Thresholds"
 STATIC_MODIFIER_DESC_nd_irq_patron_of_the_thresholds: "The crown endows the shrines, appoints their keepers and banks the offerings. The keeper families do not forgive being appointed."
 STATIC_MODIFIER_NAME_nd_irq_road_of_the_pilgrims: "Road of the Pilgrims"
 STATIC_MODIFIER_DESC_nd_irq_road_of_the_pilgrims: "The shrine cities keep their own government. The state escorts the caravans from Iran and India and takes the tolls, which pay better than the offerings would have."
 STATIC_MODIFIER_NAME_nd_irq_squadron_at_the_bar: "Squadron at the Bar"
 STATIC_MODIFIER_DESC_nd_irq_squadron_at_the_bar: "Oared gunboats hold the Shatt al-Arab where it meets salt water. Nothing passes without leave, and the quarrel over that never quite ends."
 STATIC_MODIFIER_NAME_nd_irq_open_roadstead: "The Open Roadstead"
 STATIC_MODIFIER_DESC_nd_irq_open_roadstead: "Basra takes every flag and protects every hull upriver. The customs house earns more than a fleet would, and the neighbours call it weakness."
 STATIC_MODIFIER_NAME_nd_irq_rule_of_the_kuls: "Rule of the Kuls"
 STATIC_MODIFIER_DESC_nd_irq_rule_of_the_kuls: "The bought household holds the divan, the treasury and the succession. It governs Iraq better than Istanbul managed, and it cannot produce a dynasty."
 STATIC_MODIFIER_NAME_nd_irq_divan_of_shaykhs: "Divan of Shaykhs"
 STATIC_MODIFIER_DESC_nd_irq_divan_of_shaykhs: "The Muntafiq, the Khaza'il and the Zubayd sit at court beside the household. Between them they can raise every rider in Iraq and agree on nothing quickly."
 STATIC_MODIFIER_NAME_nd_irq_waters_to_najaf: "Waters to Najaf"
 STATIC_MODIFIER_DESC_nd_irq_waters_to_najaf: "The Euphrates takes the new bed. Desert between the shrine cities comes under the plough, and the old Hilla branch is left to the silt."
 STATIC_MODIFIER_NAME_nd_irq_regulator_at_the_fork: "Regulator at the Fork"
 STATIC_MODIFIER_DESC_nd_irq_regulator_at_the_fork: "A masonry sluice holds both branches of the Euphrates open, the largest hydraulic work in Iraq since the caliphs, and it is paid for in coin the treasury had to mint."

 # ============================================================
 # Advances
 # ============================================================
 nd_irq_sawad_cadastre: "The Survey of the Sawad"
 nd_irq_sawad_cadastre_desc: "The measured cadastre Anushirwan imposed on Mesopotamia, inherited whole by the Arab conquest and run from the diwan al-kharaj: every jarib of irrigated ground on a roll, and the tax fixed on the measurement."
 nd_irq_nahrawan_breach: "The Breach at Nahrawan"
 nd_irq_nahrawan_breach_desc: "The canal that carried Tigris water two hundred kilometres to feed the capital, cut in 937 during a war between two Turkish commanders and never properly repaired. Restoring the head regulators is this country's founding act."
 nd_irq_nakhil_husbandry: "Palm Husbandry"
 nd_irq_nakhil_husbandry_desc: "The date palm is propagated from offshoots rather than seed and planted in the three-tier garden, citrus below the palms and vegetables below the citrus. It fruits on saline ground in arid air, which no orchard tree will do."
 nd_irq_bataih_refuge: "The Bataih"
 nd_irq_bataih_refuge_desc: "The marsh belt between Kufa, Wasit and Basra, where the Zanj held out for fourteen years from a capital no cavalry army could reach. Whoever knows the causeways owns the ground."
 nd_irq_mudhif_halls: "Halls of Reed"
 nd_irq_mudhif_halls_desc: "The mudhif is a hall of bundled reeds raised on an island of mats and mud, rebuilt every generation. It is a fortification as much as a guest house, and an army that wants one has to wade to it."
 nd_irq_kuttab_of_the_diwan: "Scribes of the Diwan"
 nd_irq_kuttab_of_the_diwan_desc: "The secretarial class that actually ran the caliphate. Ibn Muqla fixed the proportions of the Arabic script so a document written in Basra read as authoritative in Baghdad; here bureaucracy is a literary profession with a house style."
 nd_irq_mustansiriya_revived: "The Mustansiriya"
 nd_irq_mustansiriya_revived_desc: "Al-Mustansir's school, opened in 1234, the first anywhere to teach all four schools of Sunni law under one roof with a library, a hospital and a pharmacy attached. It survived 1258 and it is still standing."
 nd_irq_warraqin_quarter: "The Stationers' Quarter"
 nd_irq_warraqin_quarter_desc: "Harun al-Rashid's papermakers worked linen and hemp rag because that is what Iraq had. The market that grew around them held over a hundred shops, and al-Jahiz rented one by the day to read the stock."
 nd_irq_atabat_compact: "The Thresholds"
 nd_irq_atabat_compact_desc: "Najaf, Karbala, Kazimayn and Samarra: four shrine cities inside the country's core, drawing pilgrims, endowments and corpses from Iran and India. A state here either comes to terms with them or fights them forever."
 nd_irq_ayyarun_brotherhoods: "The Ayyarun"
 nd_irq_ayyarun_brotherhoods_desc: "The armed young men of Baghdad's quarters, half brotherhood and half gang, bound by futuwwa oath. They ran the city when the caliph could not and manned the walls in siege after siege."
 nd_irq_baghdad_atelier: "The Baghdad Atelier"
 nd_irq_baghdad_atelier_desc: "Sultan Ahmad Jalayir kept a painting workshop at Baghdad and wrote verse for it to illustrate. In the manuscripts made there around 1400 the Persianate miniature stops being decoration and becomes a picture."
 nd_irq_ubulla_roadstead: "The Ubulla Roadstead"
 nd_irq_ubulla_roadstead_desc: "The quay at the head of the Gulf, which the geographers called one of the four earthly paradises. Everything from India transships there, because a sea-going hull cannot take the shoals upstream."
 nd_irq_ghurab_squadron: "The Ghurab Squadron"
 nd_irq_ghurab_squadron_desc: "The raven: an oared gun-vessel shallow enough for the Shatt al-Arab bar and armed enough to argue with a carrack in confined water. Basra fought for the river mouth with these for two centuries."
 nd_irq_muntafiq_emirate: "The Muntafiq Emirate"
 nd_irq_muntafiq_emirate_desc: "A confederation of the lower Euphrates, part settled cultivator and part camel nomad, that outlasted every governor sent against it and held the road between Basra and the desert."
 nd_irq_walls_of_baghdad: "The Walls of Baghdad"
 nd_irq_walls_of_baghdad_desc: "The city changed hands by siege in 1508, 1534, 1623 and 1638, and Murad IV's last assault cost him a third of his army. A city besieged every other generation keeps its cisterns full before anything else."
 nd_irq_muqasama_assessment: "Muqasama"
 nd_irq_muqasama_assessment_desc: "Al-Mahdi replaced the fixed area tax with a share of the actual crop: half on flood-irrigated ground, a third under a waterwheel, a quarter under an animal wheel. The treasury now loses when a canal silts, which is the only arrangement that makes it dredge."
 nd_irq_afrasiyab_basra: "Afrasiyab Basra"
 nd_irq_afrasiyab_basra_desc: "For seventy years Basra was run by a family who answered Istanbul only when it suited them, and kept the port open to Portuguese, Dutch and English factors, Persian pilgrims and Armenian brokers alike."
 nd_irq_attabiya_looms: "Attabi Weaving"
 nd_irq_attabiya_looms_desc: "A watered stripe of silk laid on cotton, named for the Baghdad quarter that wove it, and carried far enough that the word reached English as tabby. It is the one luxury textile a cotton country with almost no silk can make."
 nd_irq_desert_crossing: "The Desert Crossing"
 nd_irq_desert_crossing_desc: "The road from Baghdad to Aleppo runs straight across the Syrian desert instead of following the rivers north, and saves six weeks to anyone who dares it. By the 1780s London's letters to Bombay went this way."
 nd_irq_shrine_awqaf: "The Shrine Endowments"
 nd_irq_shrine_awqaf_desc: "Who appoints the keeper, who counts the offerings, whose pilgrims are admitted. The endowments were fought over in the archives as hard as any border, and the money behind them came from Awadh and Isfahan."
 nd_irq_bitumen_of_hit: "The Bitumen of Hit"
 nd_irq_bitumen_of_hit_desc: "Seeps worked since Babylon and described by Herodotus. The pitch caulked every craft on the Euphrates and every boom built at Basra, which is how a country with no pine forest keeps a fleet watertight."
 nd_irq_kul_household: "The Household"
 nd_irq_kul_household_desc: "Hasan Pasha bought Georgian boys, converted and schooled them and married them into each other's families. Within a generation the kuls were choosing the governor of Baghdad."
 nd_irq_hindiyya_channel: "The Hindiyya Channel"
 nd_irq_hindiyya_channel_desc: "Money sent from Awadh cut a canal to Najaf in the 1790s. It worked so well that the Euphrates changed course, the desert between the shrine cities turned to farmland, and the old Hilla branch began to die."
 nd_irq_mamluk_pashalik: "The Mamluk Pashalik"
 nd_irq_mamluk_pashalik_desc: "The pashas of Baghdad governed as a dynasty in everything but name: they collected the tribute, appointed the judges, and fought Persia on their own account without asking whether they might."
 nd_irq_basra_customs_farm: "The Basra Customs"
 nd_irq_basra_customs_farm_desc: "The richest single revenue farm in Iraq, and whoever held it could pay for an army. Everything moving between the Gulf and Baghdad had to be weighed on that quay."
 nd_irq_najaf_hawza: "The Hawza of Najaf"
 nd_irq_najaf_hawza_desc: "The teaching circles settled at Najaf and the senior jurist there came to be followed from Lucknow to Jabal Amil. A seminary with no state behind it became the widest authority in Islam after the sultanate itself."
 nd_irq_midhat_land_code: "The Land Code"
 nd_irq_midhat_land_code_desc: "Title deeds were offered to tribesmen for ground their clans had farmed in common for centuries. The shaykhs registered it in their own names, and the reform meant to create smallholders created landlords."
 nd_irq_zawra_press: "Al-Zawra"
 nd_irq_zawra_press_desc: "A press arrives at the government house in 1869 and prints the first newspaper in Iraq. The copyists of the stationers' market had been reproducing books one at a time for a thousand years."
 nd_irq_river_steamers: "The River Steamers"
 nd_irq_river_steamers_desc: "Paddle steamers on the Tigris turn a month of raft and towpath into four days. Grain that could never previously reach a port suddenly can, and the whole geography of the country rearranges itself around the two rivers again."
 nd_irq_conscription_of_the_tribes: "Conscription of the Tribes"
 nd_irq_conscription_of_the_tribes_desc: "The draft reaches Iraq and the tribes answer with twenty years of rebellion. A state that wants soldiers from the Muntafiq and the Shammar has to garrison the ground it recruits from, and in the end it gets the men."
 nd_irq_saniyya_domain: "The Saniyya Domain"
 nd_irq_saniyya_domain_desc: "The crown takes the best land for itself: reclaimed marsh, canal frontage, the palm belt of the Shatt al-Arab, administered directly and paying no provincial tax. A private empire inside the public one."

 # ============================================================
 # Buildings
 # ============================================================
 nd_irq_nahrawan_headworks: "Canal Head-Works"
 nd_irq_nahrawan_headworks_desc: "Masonry regulators at the offtake, so an engineer can decide how much river enters the canal and shut it when the flood comes down. Buildable only where there is a river or lake to tap."
 nd_irq_kharaj_diwan: "Kharaj Diwan"
 nd_irq_kharaj_diwan_desc: "The register office of the irrigated land: surveyors' ropes, tax rolls and the clerks who keep them. It knows what every jarib of the district owes and what it has paid."
 nd_irq_nakhil_grove: "Date Palm Grove"
 nd_irq_nakhil_grove_desc: "Palms planted in ranks along the riverbank on ground too saline and too dry for any orchard, with citrus and vegetables in their shade. Basra shipped its dates as far as China."
 nd_irq_suq_al_warraqin: "Suq al-Warraqin"
 nd_irq_suq_al_warraqin_desc: "The stationers' market: copyists working to order in the shopfronts, booksellers, and the readers who treat a bookseller's stock as a lending library. Over a hundred shops stood in the Baghdad original."
 nd_irq_mustansiriya: "Al-Madrasa al-Mustansiriyya"
 nd_irq_mustansiriya_desc: "Four iwans off one courtyard for the four schools of law, with a library, a hospital and a pharmacy behind them. It can only be built at Baghdad, because there is only one of it."
 nd_irq_atabat_hadra: "Shrine Precinct"
 nd_irq_atabat_hadra_desc: "The walled hadra of a great tomb, with its lodging, kitchens, burial ground and keeper families. Buildable only at the shrine cities themselves: Kufa, Karbala, Baghdad and Samarra."
 nd_irq_mudhif_redoubt: "Mudhif Redoubt"
 nd_irq_mudhif_redoubt_desc: "A reed hall on a made island, with the causeways and skiff channels that serve it. Buildable only in wetlands, which in Iraq means the Bataih and nowhere else."
 nd_irq_ubulla_wharf: "Ubulla Wharf"
 nd_irq_ubulla_wharf_desc: "The transhipment quay at the head of the Gulf, where sea-going hulls hand their cargo to river boats that can take the shoals upstream, and where the yards build both."
 nd_irq_attabiya_workshop: "The Attabiya Looms"
 nd_irq_attabiya_workshop_desc: "Master weavers laying a silk stripe on a cotton ground. Buildable only where the market carries cotton, which is the whole point of the attabi recipe."

 # ============================================================
 # Production methods
 # ============================================================
 nd_irq_headworks_maintenance: "Dredging and Revetment"
 nd_irq_headworks_maintenance_desc: "Silt lifted by basket, banks faced with brick and reed mat, sluice gates rehung every season. A canal that is not dredged is a field within a decade."
 nd_irq_diwan_maintenance: "The Tax Rolls"
 nd_irq_diwan_maintenance_desc: "Ledgers, seals and measuring ropes, and the paper to copy an assessment three times so that the village, the district and the treasury each hold one."
 nd_irq_nakhil_harvest: "Offshoot Planting"
 nd_irq_nakhil_harvest_desc: "New palms raised from offshoots of proven mothers rather than from stones, so the grove keeps its variety. Climbers work the crowns with rope and knife at pollination and again at harvest."
 nd_irq_nakhil_canal_fed: "Canal-Fed Grove"
 nd_irq_nakhil_canal_fed_desc: "A cut branch carries water directly to the roots instead of leaving the palms to find the water table, and the ranks can be planted deeper inland. Dense timber shoring holds the banks."
 nd_irq_warraqin_copying: "Copyists to Order"
 nd_irq_warraqin_copying_desc: "A customer names a title and a scribe reproduces it, in ink and gall and lampblack, bound in tooled leather. One copy at a time, which is why a large library takes a lifetime."
 nd_irq_warraqin_press: "The Press"
 nd_irq_warraqin_press_desc: "Cast type and a screw press in the same shopfronts where the copyists worked. The output of a year becomes the output of a week, and the copyists become compositors or nothing."
 nd_irq_mustansiriya_maintenance: "Madrasa, Library and Bimaristan"
 nd_irq_mustansiriya_maintenance_desc: "Stipends for four faculties, paper and binding for the library, and the glass and compounded drugs the hospital and pharmacy consume."
 nd_irq_hadra_maintenance: "The Shrine Service"
 nd_irq_hadra_maintenance_desc: "Lamps, incense, the cloth covering of the tomb chest renewed on the anniversary, and marble for the paving worn hollow by a thousand years of feet."
 nd_irq_mudhif_maintenance: "Reed Cutting"
 nd_irq_mudhif_maintenance_desc: "The qasab is cut, bundled and reset every few years because reed rots. The same cutting supplies the mats, the causeway fill and the roof of every house in the settlement."
 nd_irq_wharf_maintenance: "Rope and Rigging"
 nd_irq_wharf_maintenance_desc: "Imported timber for hulls that cannot be grown locally, cordage from river fibre, and the pitch and cordage stores a working quay burns through."
 nd_irq_wharf_bitumen_caulking: "Bitumen Caulking"
 nd_irq_wharf_bitumen_caulking_desc: "Pitch from the Hit seeps replaces imported stores. It is nearer, cheaper and better, and it is the reason a country with no pine forest can still keep hulls tight."
 nd_irq_attabi_weaving: "Attabi Weave"
 nd_irq_attabi_weaving_desc: "A silk warp stripe laid over a cotton ground, then calendered so the stripe waters. A little silk goes a long way, which is what makes the cloth possible here at all."

 # ============================================================
 # Units and levies
 # ============================================================
 a_nd_irq_madan_marshmen: "Madan Marshmen"
 a_nd_irq_madan_marshmen_desc: "Reed-skiff skirmishers of the Bataih who fight from the mashhuf and along causeways only they can find. On open flatland they are unarmoured men with fish spears."
 levy_nd_irq_madan_marshmen: "Madan Levy"
 levy_nd_irq_madan_marshmen_desc: "Raised only from pops living in the marshes themselves. The levy is the Bataih, not a national militia with a marsh name."
 a_nd_irq_ayyarun: "Ayyarun"
 a_nd_irq_ayyarun_desc: "The sworn brotherhoods of the city quarters. Ferocious behind a barricade and worthless in a field formation: they break enemy morale and cannot take a charge."
 levy_nd_irq_ayyarun: "Ayyarun Levy"
 levy_nd_irq_ayyarun_desc: "Drawn from the burghers and labourers who live behind the walls, never from the countryside, because that is where the futuwwa lodges are."
 a_nd_irq_muntafiq_horse: "Muntafiq Horse"
 a_nd_irq_muntafiq_horse_desc: "Riders of the desert edge who choose whether a battle happens at all, and lose it when the enemy gets to choose instead."
 levy_nd_irq_muntafiq_horse: "Muntafiq Levy"
 levy_nd_irq_muntafiq_horse_desc: "Noble cavalry raised on the dry ground between the Euphrates and the Nejd. The confederation's strength was never in the irrigated Sawad."
 n_nd_irq_ghurab: "Ghurab"
 n_nd_irq_ghurab_desc: "The raven: a shallow oared gun-vessel that trades hull for guns. That is the right trade in a river mouth and the wrong one in open sea."
 a_nd_irq_kul_horsemen: "Kul Horsemen"
 a_nd_irq_kul_horsemen_desc: "The Georgian household of the Baghdad pashas, bought as boys and trained for a decade. There are never many and they take years to make, which is exactly why they ended up ruling Iraq."

 # ============================================================
 # Destiny tree: advances
 # ============================================================
 nd_irq_destiny: "The Register of Waters"
 nd_irq_destiny_desc: "A standing roll of every offtake, weir and sluice in the country: the canal, the villages that drink from it, the year it was last dredged, the silt at its mouth measured against a marked pole. Iraq has been dug out on emergency for six hundred years by men who never wrote down what they found."
 nd_irq_dest_hulwan_gate: "The Gate of Hulwan"
 nd_irq_dest_hulwan_gate_desc: "The Khurasan road leaves the Sawad at Hulwan, passes the rock at Behistun and does not level out until Hamadan, which the Greeks called Ecbatana. Every army that ever took Baghdad came down it, and so does half the water that feeds the eastern plain, because the Diyala and the Karkha both rise behind these ridges. Take Kermanshah and Hamadan and stand an army on the watershed: a state holding the plain and not the passes is holding a rich room with the door open."
 nd_irq_dest_western_wing: "The Western Wing"
 nd_irq_dest_western_wing_desc: "Aleppo and Damascus were the other half of the caliphate and the only road to the sea that runs through nobody else's strait. Take them both, and grow the country enough to pay for holding them, because Syria costs more to keep than to win."
 nd_irq_dest_shadow_caliph: "The Shadow Caliph"
 nd_irq_dest_shadow_caliph_desc: "An Abbasid has lived in Cairo on a Mamluk stipend since 1261, riding in processions and signing the diplomas that make sultans legitimate. Take Cairo and Jerusalem, keep an army and a name large enough to be believed, and bring the line home."
 nd_irq_dest_maragha_instruments: "The Instruments of Maragha"
 nd_irq_dest_maragha_instruments_desc: "Tusi's observatory on the hill above Maragha, paid for out of endowment revenue and staffed by men from Damascus, Mosul, Tiflis and China who could not always talk to each other except in numbers. Take Maragha, embrace the Renaissance and build the country up, because instruments are worth nothing without the men who read them."
 nd_irq_dest_ingenious_devices: "The Ingenious Devices"
 nd_irq_dest_ingenious_devices_desc: "The Banu Musa's hundred machines, al-Jazari's crank that turns a wheel's circle into a pump's straight push, and the Sasanian weirs at Shushtar that have been lifting the Karun for a thousand years. Take Shushtar, embrace manufactories and have the silver ready, because the machinery is paid for before it earns."
 nd_irq_dest_corrected_tables: "The Corrected Tables"
 nd_irq_dest_corrected_tables_desc: "Samarkand holds the paper mills that came west after Talas and Ulugh Beg's sextant, sunk in a trench forty metres long. Take it, embrace the scientific revolution, and recompute the star catalogue for Baghdad's own meridian, because a zij is written for one latitude and is politely wrong everywhere else."

 # ============================================================
 # Destiny tree: events
 # ============================================================
 nd_irq.8.t: "The Register of Waters"
 nd_irq.8.d: "The inspectors have finished the first sweep. Every offtake from Samarra down to the head of the Gulf is on a roll now: the name of the channel, the villages that drink from it, the year it was last cleared, the depth of silt at its mouth measured against a marked pole. Four hundred and some entries, and a third of them describe works that no longer carry water at all.\n\nNobody has held this list before. The caliphs dredged when a famine forced them to and the pashas dredged when a shaykh paid them to, and in both cases the knowledge died with the engineer. What the register changes is small and total: a silted channel is now a line in a ledger with a date beside it, and somebody can be asked why the date has not moved."
 nd_irq.8.a: "Let the inspectors ride, and let them ride again next year."

 nd_irq.9.t: "The Gate of Hulwan"
 nd_irq.9.d: "The road climbs out of the Sawad at Hulwan and behind the first ridge it passes the rock at Behistun, where Darius had his account of a civil war carved too high up for anyone to reach and correct. It does not level out again until Hamadan. Every army that has ever come down onto this plain staged there first.\n\nThe caliphs learned this expensively, and so did the Buyids, who came out of these mountains themselves, and the Ilkhans, and everyone since. Two other things come down this way as well: the Diyala and the Karkha, which between them water the whole eastern half of the Sawad and rise behind the ridge we are now standing on. Baghdad is nine days from Hamadan for a courier and rather less than that for cavalry. The garrisons are placed now, the passes are held to the watershed, and for the first time in a long while the plain is being defended somewhere other than on the plain."
 nd_irq.9.a: "The door is shut and barred, and the bar is watched."

 nd_irq.10.t: "The Western Wing"
 nd_irq.10.d: "Aleppo has given up its citadel and the Umayyad mosque at Damascus has heard the khutba read in Baghdad's name for the first time in six hundred years. The western half of the old caliphate is in hand, and with it the roads to the sea and the pilgrim route running south.\n\nHow to keep it is an older question, and Syria has only ever been answered two ways. The Umayyads cut the country into ajnad, military districts, each with a garrison paid from its own revenue under a governor deliberately sent from somewhere else. The Abbasids in their weakness did the opposite: they left the emirs of Aleppo, Hama and Damascus in their citadels and sent them robes of honour, a diploma and a title, and were obeyed for exactly as long as the robes kept arriving."
 nd_irq.10.a: "Cut it into ajnad. Iraqi garrisons, governors from outside."
 nd_irq.10.b: "Send robes of honour. The emirs keep their citadels."

 nd_irq.11.t: "The Shadow Caliph"
 nd_irq.11.d: "There has been an Abbasid in Cairo since 1261, when a survivor of the family reached Egypt and Baybars had him proclaimed within the month. His descendants have lived there ever since on a stipend, riding in processions, sealing the diplomas that make a Mamluk sultan lawful, and being kept away from any decision more consequential than the choice of a robe.\n\nThe household is ours now, and the city that kept it with them. What is done next settles what this state has been claiming all along. The banners can come out of storage and the claim can be made at full voice, which will be heard from Fez to Samarkand and answered by most of it. Or the man can be escorted home quietly and seated above a chancery, on the understanding that the writ which actually governs is the one with a seal at the bottom."
 nd_irq.11.a: "Raise the black. Let the khutba be read for Baghdad."
 nd_irq.11.b: "Bring him home to a desk. Govern through the diwans."

 nd_irq.12.t: "The Instruments of Maragha"
 nd_irq.12.d: "Hulagu let Tusi build it on the hill above the town and funded it out of endowment revenue, which is the only reason it outlived the man who paid for it. There is a quadrant cut into the rock on the meridian, an armillary sphere, a library nobody has ever counted honestly, and a staff that has included a Chinese astronomer alongside men from Damascus, Mosul and Tiflis who could not reliably talk to one another except in numbers.\n\nThe instruments are crated and roped and coming down the road, and rather more than half the staff has agreed to travel with them. What arrives is not a building. It is a method: observe for thirty years, write down everything including the failures, and never trust a table you have not checked against the sky yourself."
 nd_irq.12.a: "Unload them carefully. Find the men houses and pay them."

 nd_irq.13.t: "The Ingenious Devices"
 nd_irq.13.d: "Two books and one river settle this. The Banu Musa wrote the first in Baghdad, a hundred devices of valves and floats and lamps that trim themselves. Al-Jazari wrote the second at Amid and drew the crank that turns a wheel's circle into a pump's straight push, which is the single most useful drawing anyone in this country has made. Both books were received at court as amusements. Both describe machinery that lifts water.\n\nThe river is the Karun at Shushtar, where Shapur set captured Roman engineers to throw a weir across the stream with a bridge along the top of it, and cut a channel through solid rock to carry the overflow to the mills. It has been working for a thousand years. Our own engineers have measured it and come back quiet."
 nd_irq.13.a: "Put the machines on the land. Lift water to the terraces."
 nd_irq.13.b: "Keep them in the workshops. Clocks and quadrants sell."

 nd_irq.14.t: "The Corrected Tables"
 nd_irq.14.d: "Samarkand held two things Baghdad has always needed. The first is the mills that beat linen rag to pulp, the craft that came west after Talas and made a stationers' market possible here at all. The second is Ulugh Beg's sextant, sunk in a trench forty metres long, and the catalogue of a thousand and eighteen stars his people computed with it, the first in eight centuries that owed Ptolemy nothing.\n\nThe tables are being recomputed for the meridian of Baghdad, because a zij is written for one latitude and is politely wrong everywhere else. What the recomputation is for is the argument in the diwan now. The astronomers want the tax year fixed to the sun, since the lunar year runs a month ahead of the harvest every three decades and the kharaj keeps falling due before there is a crop to pay it with. The stationers want the eastern road kept open and the paper cheap."
 nd_irq.14.a: "Fix the kharaj year to the sun. Tax the crop, not the calendar."
 nd_irq.14.b: "Keep the paper road open. Let a book cost what bread costs."

 # ============================================================
 # Destiny tree: timed modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_irq_dest_jund_of_syria: "The Jund of Syria"
 STATIC_MODIFIER_DESC_nd_irq_dest_jund_of_syria: "Syria cut into military districts on the Umayyad plan, each garrisoned out of Iraq under a governor from somewhere else. It holds, and the estates at home are paying for a great deal of marching they will never see."
 STATIC_MODIFIER_NAME_nd_irq_dest_investiture_of_emirs: "Investiture of the Emirs"
 STATIC_MODIFIER_DESC_nd_irq_dest_investiture_of_emirs: "The lords of Aleppo, Hama and Damascus keep their citadels and hold them in Baghdad's name, on a robe of honour and a sealed diploma. Cheap, durable, and exactly as reliable as the next embassy."
 STATIC_MODIFIER_NAME_nd_irq_dest_black_banners: "The Black Banners"
 STATIC_MODIFIER_DESC_nd_irq_dest_black_banners: "The Abbasid black is out of storage and the khutba is read for Baghdad from Fez to Samarkand. Armies that march under it know what they are for, which is worth more than most things a treasury can buy."
 STATIC_MODIFIER_NAME_nd_irq_dest_writ_of_the_diwans: "The Writ of the Diwans"
 STATIC_MODIFIER_DESC_nd_irq_dest_writ_of_the_diwans: "The caliph is seated above a chancery and the claim is exercised in seals, registers and the couriers who carry them. An establishment that large learns to skim before it learns anything else."
 STATIC_MODIFIER_NAME_nd_irq_dest_water_engines: "The Water Engines"
 STATIC_MODIFIER_DESC_nd_irq_dest_water_engines: "Norias on the Euphrates terraces, dulabs on the Diyala, pumps where the bank is too high for either. Ground nobody would have ploughed is under crop, and the yards that built the machinery were paid long before it earned."
 STATIC_MODIFIER_NAME_nd_irq_dest_clock_and_quadrant: "Clock and Quadrant"
 STATIC_MODIFIER_DESC_nd_irq_dest_clock_and_quadrant: "Water clocks, astrolabes, graduated quadrants and lifting gear built to order in the Baghdad workshops and sold east and west. The market for a marvel has always been better than the market for a ditch."
 STATIC_MODIFIER_NAME_nd_irq_dest_corrected_calendar: "The Corrected Calendar"
 STATIC_MODIFIER_DESC_nd_irq_dest_corrected_calendar: "The kharaj year is fixed to the sun, so the tax falls when the crop is in instead of drifting a month ahead of it every three decades. The jurists have views about calendars and none of them are quiet."
 STATIC_MODIFIER_NAME_nd_irq_dest_road_of_paper: "The Road of Paper"
 STATIC_MODIFIER_DESC_nd_irq_dest_road_of_paper: "The Samarkand road is kept open and the mills are copied at home. A book stops being a bequest and becomes a commodity, which delights everyone except the men whose authority rested on owning one."

 # ============================================================
 # Destiny tree: buildings and production methods
 # ============================================================
 nd_irq_dar_al_barid: "Dar al-Barid"
 nd_irq_dar_al_barid_desc: "A station of the caliphal post: stabling and remounts, a courier's room, sealed dispatch bags, and the sahib al-barid who lives here and whose real commission is to report on the governor next door. Buildable in the towns and cities of the old caliphal road network."
 nd_irq_dulab_works: "The Dulab Works"
 nd_irq_dulab_works_desc: "A yard that builds and repairs water-lifting machinery: the ox-driven dulab, the current-driven naura with its earthenware pots lashed to the rim, and the crank-and-piston pumps out of al-Jazari. Buildable on river and lake ground, because a machine that lifts water needs water under it."
 nd_irq_marsad: "The Marsad"
 nd_irq_marsad_desc: "An observatory: a quadrant cut on the meridian, a shop that files its own graduated brass, and a room of tables kept for the thirty years an observation programme actually takes. Cities only, and only under the sky its tables are written for."
 nd_irq_barid_maintenance: "Post Horses and Dispatch Bags"
 nd_irq_barid_maintenance_desc: "Remounts fed and shod at every stage, saddlery, sealed leather bags, and paper enough to write each report twice so that one copy rides on and one stays behind in the register."
 nd_irq_dulab_maintenance: "Wheels and Pots"
 nd_irq_dulab_maintenance_desc: "Hubs and paddles cut from palm and imported timber, earthenware pots lashed to the rim in their hundreds, rope twisted from date fibre, and ironwork reset every time the river takes the bank."
 nd_irq_marsad_maintenance: "Brass, Glass and Tables"
 nd_irq_marsad_maintenance_desc: "Graduated brass limbs cut and filed by hand, glass for the sightings and the lamps, and the paper that thirty years of nightly observation is entered on and bound."

 # ============================================================
 # Destiny tree: option tooltips
 # ============================================================
 nd_irq.8.a_tt: "The inspectors ride the banks every year from now on."
 nd_irq.9.a_tt: "The Khurasan road is held as far as the watershed."
 nd_irq.10.a_tt: "Faster recruiting and stronger heavy foot. The estates resent the bill."
 nd_irq.10.b_tt: "Loyal subjects, warmer relations abroad and another envoy on the road."
 nd_irq.11.a_tt: "Warscore, army tradition and morale recovery under the black banner."
 nd_irq.11.b_tt: "Control in the towns and faster spy networks. The establishment skims."
 nd_irq.12.a_tt: "The instruments and the men who read them are housed at Baghdad."
 nd_irq.13.a_tt: "Larger rural holdings and more raw material. Borrowing costs more."
 nd_irq.13.b_tt: "Trade income, merchant capacity and a contented burgher estate."
 nd_irq.14.a_tt: "More estate tax and cheaper food purchases. The clergy object loudly."
 nd_irq.14.b_tt: "Literate labourers, one more culture carried, and a quieter clergy."

 # ============================================================
 # BUREAUCRACIES
 # ============================================================

 irq_mirab_nawba_bureaucracy: "Mirab and the Water Turn"
 irq_mirab_nawba_bureaucracy_desc: "The nawba is the turn: a measured span in which one village, and inside it one family, may draw from the canal. The mirab is the watermaster who keeps the turn list, opens and shuts the offtake, and calls out the yearly clearance that stops silt from closing the intake. Harun al-Rashid had the mouths of the Nahrawan shut, dug clean and reopened on that same principle between 786 and 806. Water in Mesopotamia is a ledger entry before it is a resource, and somebody has to keep the ledger."

 irq_soyurghal_bureaucracy: "Soyurghal"
 irq_soyurghal_bureaucracy_desc: "Soyurghal is the Mongol term for a grant made in perpetuity, and it is what the Jalayirids left behind them in Iraq. Qara Yusuf paid his emirs and his kinsmen out of the revenue of assigned land rather than in coin, and within a generation the assignment had hardened into a hereditary holding with its own immunity from tax. Uzun Hasan spent a reign trying to pull that revenue back into direct collection and never finished the work. An army that costs the treasury nothing is an army the treasury cannot recall."

 irq_jahbadhiyya_bureaucracy: "The Jahbadhiyya"
 irq_jahbadhiyya_bureaucracy_desc: "From 908 to 932 the wazirs of Baghdad kept two Jewish bankers on standing retainer, Yusuf ibn Finhas and Harun ibn Imran. They advanced the treasury a fixed sum on the first of every month against the revenue of Ahvaz, held the deposits of the merchant houses, and settled between Baghdad and the provinces on written order, the sakk that gave English its cheque. Ibn al-Furat could not govern without them and could not entirely trust them, which is the standing condition of any state that borrows."

 irq_naqib_al_ashraf_bureaucracy: "Naqib al-Ashraf"
 irq_naqib_al_ashraf_bureaucracy_desc: "The naqib keeps the shajara, the register of those descended from the Prophet, entering their births and their deaths, judging their quarrels, paying their stipends and striking out the false claimants. Baghdad's niqaba was held around the year 1000 by Abu Ahmad al-Husayn ibn Musa, father of the poet al-Sharif al-Radi, and the office ran on under the Ottomans in the hands of the Gaylani house. In Iraq the register crosses the sectarian line instead of following it, because sayyid families and tribal shaykhs claim the same descent on both sides of it."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_irq_bureaucracy_authority: "Offices of the Sawad"
 AUTO_MODIFIER_DESC_nd_irq_bureaucracy_authority: "Baghdad is a capital again rather than a governorate, so [IRQ.GetName] can staff and pay the standing offices of Mesopotamia: the turn list of the canals, the register of grants, the bankers of the diwan and the register of holy descent."
