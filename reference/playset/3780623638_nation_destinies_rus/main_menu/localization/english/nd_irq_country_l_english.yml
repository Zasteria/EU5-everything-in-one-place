l_english:
 IRQ: "Iraq"
 IRQ_ADJ: "Iraqi"
 IRQ_f: "Iraq"
 IRQ_f_desc: "Iraq restores the Sawad, the irrigated land between the Tigris and the Euphrates that once yielded a fifth of the revenue of the Caliphate, as a sovereign Muslim state ruled from Baghdad. The great canals failed long before the Mongols arrived: the Nahrawan was breached during a civil war in 937 and never properly repaired, and Mesopotamia spent the following centuries as a border province of whoever held Tabriz, Cairo or Istanbul. The Jalayirid sultans still kept a real court in Baghdad from the 1330s, proof enough that the country could govern itself. Forming Iraq finishes that work: the canals dug out again, Basra and the Gulf trade held, Kufa and the shrine cities secured, and Baghdad restored as a capital that answers to nobody."
