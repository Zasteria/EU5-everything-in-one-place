l_english:
 nd_ily_formed_tt: "Illyria has been formed"
 nd_ily_e1_done_tt: "The proclamation of Illyria has already been heard"
 nd_ily_path_a_tt: "Chose the #bold Confines of the Kingdom#! destiny"
 nd_ily_path_b_tt: "Chose the #bold Sacrum Illyricum#! destiny"

 STATIC_MODIFIER_NAME_nd_ily_confinia_regni: "Confinia Regni"
 STATIC_MODIFIER_DESC_nd_ily_confinia_regni: "The confines of the kingdom, in the Latin the Croatian chancery used for its own frontier districts. Garrisons are doubled, the approaches are stripped bare, and every valley that leads inland is watched by men who hold their fields on the condition that they watch it. A wall, however, makes no friends of the people standing on the wrong side of it, and a great many of them live within this realm."
 STATIC_MODIFIER_NAME_nd_ily_sacrum_illyricum: "Sacrum Illyricum"
 STATIC_MODIFIER_DESC_nd_ily_sacrum_illyricum: "The Roman institutions of the Illyrian nation become the policy of the state. Colleges are endowed, presses are licensed, and priests are trained in a tongue their congregations already speak and sent where no bishop can follow them. Every ducat spent on a seminary is a ducat not spent on a regiment, and the muster rolls show it."

 STATIC_MODIFIER_NAME_nd_ily_slavonic_rite: "The Slavonic Rite"
 STATIC_MODIFIER_DESC_nd_ily_slavonic_rite: "The village priest keeps his missal in the angular letters, and the crown keeps the village priest. There are more of them than there are canons, and they are believed."
 STATIC_MODIFIER_NAME_nd_ily_latin_chapter: "The Latin Chapter"
 STATIC_MODIFIER_DESC_nd_ily_latin_chapter: "A learned Latin chapter is placed over every Slavonic parish. Rome is pleased, the cathedral schools fill, and the country priest is told what his own missal means."
 STATIC_MODIFIER_NAME_nd_ily_communal_charters: "The Communal Charters"
 STATIC_MODIFIER_DESC_nd_ily_communal_charters: "The coastal towns come back to the crown with their statutes confirmed, their councils intact and their customs their own. They pay, and they remember who let them keep their books."
 STATIC_MODIFIER_NAME_nd_ily_bans_writ: "The Ban's Writ"
 STATIC_MODIFIER_DESC_nd_ily_bans_writ: "The ban's officers sit in the town halls of the coast, and the elected knez answers to them. The communes lose their old freedom of manoeuvre and the kingdom gains a shoreline it actually governs."
 STATIC_MODIFIER_NAME_nd_ily_senj_press: "The Press at Senj"
 STATIC_MODIFIER_DESC_nd_ily_senj_press: "A chapter of canons on a windy Adriatic rock owns a printing press and uses it to print the Mass in Slavonic. Nowhere else in Latin Christendom is that legal."
 STATIC_MODIFIER_NAME_nd_ily_friars_charter: "The Friars' Charter"
 STATIC_MODIFIER_DESC_nd_ily_friars_charter: "The brown habits go where the crown cannot. Under the sultan's own charter the Franciscans keep the Catholics of Bosnia in the faith, and the crown keeps a channel into a province it does not hold."
 STATIC_MODIFIER_NAME_nd_ily_bosnian_claim: "The Bosnian Claim"
 STATIC_MODIFIER_DESC_nd_ily_bosnian_claim: "Bosnia is entered in the chancery as a stolen kingdom rather than a mission field. The gunners measure the walls of Jajce, the border captains are told what a Christian province is worth, and the friars are told to wait."
 STATIC_MODIFIER_NAME_nd_ily_graz_subsidy: "The Graz Subsidy"
 STATIC_MODIFIER_DESC_nd_ily_graz_subsidy: "The inner Austrian estates pay for the cordon, so the cordon obeys the inner Austrian estates. The soldiers are cheap, well supplied and no longer entirely the crown's."
 STATIC_MODIFIER_NAME_nd_ily_banal_frontier: "The Banal Frontier"
 STATIC_MODIFIER_DESC_nd_ily_banal_frontier: "The frontier stays under the ban and the Sabor, and so does the bill. A kingdom that pays for its own walls may also decide where they run."
 STATIC_MODIFIER_NAME_nd_ily_mission_beyond: "The Mission Beyond the Border"
 STATIC_MODIFIER_DESC_nd_ily_mission_beyond: "Graduates of Loreto and San Girolamo cross into the sultan's lands with a breviary, a false name and a route home. They send back more than souls."
 STATIC_MODIFIER_NAME_nd_ily_native_clergy: "A Clergy of Our Own"
 STATIC_MODIFIER_DESC_nd_ily_native_clergy: "The colleges keep their graduates for home altars. The kingdom gains the best educated parish clergy on this side of the Adriatic and the Congregation in Rome gains nothing."
 STATIC_MODIFIER_NAME_nd_ily_croat_regiments: "The Croat Regiments"
 STATIC_MODIFIER_DESC_nd_ily_croat_regiments: "Light horse who scout further, ride harder and burn more thoroughly than anything the Empire can raise for itself. Paris has already stolen the scarf they wear at the throat."
 STATIC_MODIFIER_NAME_nd_ily_crown_confiscation: "The Confiscation"
 STATIC_MODIFIER_DESC_nd_ily_crown_confiscation: "Two heads, and the lands of two houses that had been great since before the kingdom had a ban. The crown is suddenly the largest landowner in Croatia, and the nobility will not forget how it happened."
 STATIC_MODIFIER_NAME_nd_ily_reconciled_magnates: "The Reconciled Magnates"
 STATIC_MODIFIER_DESC_nd_ily_reconciled_magnates: "The sentences are read out and then commuted. The great houses keep their lands and their heads, and thereafter serve a crown that could have taken both."

 nd_ily.1.t: "Regnum Illyricum"
 nd_ily.1.d: "Split is ours. The palace of Diocletian, which has been a town inside a ruin for a thousand years, no longer flies the lion of Saint Mark, and the road up through the Klis pass is open to the interior. Far to the north the ban's officers sit at Zagreb, where Gradec on its hill and the bishop's Kaptol across the ravine have quarrelled for two centuries and are now told to be one city.\n\nWhat is proclaimed here is not merely Croatia enlarged. The men who drafted the style are the same sort who read Pribojević of Hvar and Šišgorić of Šibenik: canons, notaries and city patricians who call their own speech Illyrian and themselves Illyrici, and who hold that this coast and this hinterland are the inheritors of the classical Illyricum. Rome has already granted them the name. In the church of San Girolamo degli Illirici the Mass is said by Slavonic-speaking priests, and the letters they read were given to Saint Jerome by legend and to the bishop of Senj by Innocent IV in fact.\n\nThe kingdom that stands up today has a wall on one side and a pulpit on the other, and it cannot afford both at full strength. Shall Illyria be the confines of the kingdom made permanent, garrisoned to the last valley and hard to everything beyond it? Or shall it be Rome's Slavonic province, spending on colleges and presses and sending its priests across the border rather than its cavalry?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ily.1.a: "We are the wall. Let it be built and manned."
 nd_ily.1.a_tt: "Confinia Regni. Garrisons, levies, supply and attrition against invaders. The Muslim populations of Bosnia are tolerated far less."
 nd_ily.1.b: "Send the priest where the soldier cannot go."
 nd_ily.1.b_tt: "Sacrum Illyricum. Conversion of other faiths, clergy learning, institutions and standing at Rome. Manpower suffers for it."

 nd_ily.2.t: "The Tongue of Saint Jerome"
 nd_ily.2.d: "The privilege is old, oddly specific and entirely genuine. In 1248 Pope Innocent IV wrote to Filip, bishop of Senj, permitting the clergy of his diocese to celebrate the liturgy in the Slavonic tongue using the letters they called Glagolitic. The justification offered was that the alphabet had been devised by Saint Jerome, who was born in Dalmatia and was therefore one of ours. This is false. Jerome had nothing to do with it and the letters came from Moravia. It has also been believed for four hundred years, it is written into papal documents, and it is why the Illyrian church in Rome is dedicated to Saint Jerome and not to anybody else.\n\nWhat it means on the ground is that a peasant in the Kvarner hills hears the Mass in words he understands, from a married village priest who owns perhaps three books and can read all of them. The cathedral canons, trained in Latin and jealous of their Latin, have never entirely made peace with this.\n\nThe chancery asks which clergy the crown intends to build on."
 nd_ily.2.a: "The glagoljaši. They are ours and they are heard."
 nd_ily.2.a_tt: "More rural clergy, better tolerance of our own faith and firmer control."
 nd_ily.2.b: "Set learned Latin canons over every parish."
 nd_ily.2.b_tt: "Better educated clergy, prestige and standing with the papacy."

 nd_ily.3.t: "The Peace of Zadar"
 nd_ily.3.d: "It was settled in the sacristy of the Franciscan friary at Zadar on the eighteenth of February, 1358. Venice renounced the whole coast from the Kvarner to Dubrovnik, and the doge undertook to strike the words duke of Dalmatia and Croatia from his own title. No siege train achieved this. It was achieved by patient war, by Hungarian and Croatian arms in Italy, and by the plain fact that the cities themselves preferred a distant king to a near republic.\n\nThe communes now come back into the kingdom with their statutes in their hands: Split's of 1312, Zadar's of 1305, Šibenik's of 1379, each of them a book of self-government with an elected knez, a council and a settled contempt for outside judges.\n\nThe question in every council chamber from Trogir to Rab is what the crown means to do about those books."
 nd_ily.3.a: "Confirm every statute. Rule a coast that consents."
 nd_ily.3.a_tt: "Stronger trade centres, contented burghers and better seaborne trade."
 nd_ily.3.b: "One kingdom, one law. The ban judges in the cities."
 nd_ily.3.b_tt: "Faster control growth, a stronger crown estate and less separatism."

 nd_ily.4.t: "Eight Books in Fourteen Years"
 nd_ily.4.d: "The first Croatian Glagolitic missal came off a press on the twenty-second of February, 1483, twenty-eight years after Gutenberg finished his Bible, and nobody now knows for certain who printed it or where. What is certain is what happened next. In 1492 the chapter of Senj sent the priest Blaž Baromić to Venice to learn the trade; he worked in Torresani's shop, helped print a Glagolitic breviary in 1493, and came home with the knowledge. The press at Senj ran from 1494 until 1508 and produced eight books. A generation later Šimun Kožičić Benja, bishop of Modruš, set up a second press in his own house at Rijeka and printed six more in the space of thirteen months.\n\nEight books, then six. It is a small output by the standards of Venice, which was printing that many in a fortnight. It is also the only place in Latin Christendom where the Mass itself was being set in type in a vernacular and in an alphabet no Roman could read.\n\nThe canons ask for a further grant of paper and lead."
 nd_ily.4.a: "Let the press run. The letters are our title deed."
 nd_ily.4.a_tt: "More book output, rising literacy and faster institution growth."

 nd_ily.5.t: "The Charter of Milodraž"
 nd_ily.5.d: "The kingdom of Bosnia ended in 1463 in the space of a summer. King Stjepan Tomašević was taken at Ključ and beheaded, the great fortresses opened one after another, and Mehmed rode through a country that had had its own crown a year before.\n\nWhat survived, alone, was the Franciscan custody of Bosna Srebrena, founded in 1340 to work among the Bosnian Church and now the only institution of the Latin church left standing in the province. Its guardian, Fra Anđeo Zvizdović, went to the sultan's camp at Milodraž and came away with a charter: the friars were not to be molested, their houses were not to be taken, and those who followed them were to keep their property and their worship. The document has been kept at Fojnica ever since and produced, again and again, in front of Ottoman judges who did not expect it to exist.\n\nFor four centuries the friars will be the only bishops Bosnia has. The chancery must decide whether that is a foundation or an insult."
 nd_ily.5.a: "The friars hold Bosnia. Fund them and be patient."
 nd_ily.5.a_tt: "Faster conversion of other religion groups, better tolerance of them and warmer relations."
 nd_ily.5.b: "Bosnia is a stolen crown. Prepare to take it back."
 nd_ily.5.b_tt: "Better war score against other faiths, stronger sieges and harder fighting against them in the field."

 nd_ily.6.t: "Who Pays for the Cordon"
 nd_ily.6.d: "The frontier has stopped being an event and become a place. From the Adriatic at Senj to the Drava it is now a permanent belt of forts, watch-houses within sight of one another and settled soldier villages, organised from 1553 into the generalcies of Croatia and Slavonia. The men in it hold their land free of dues in return for hereditary service, turn out at the alarm gun, and are a standing army in everything but name.\n\nIt is also ruinously expensive, and the Sabor cannot pay for it. The estates of Styria, Carinthia and Carniola can, and have offered. They will not, however, pay for soldiers commanded from Zagreb.\n\nThis is the constitutional question of the age, dressed as an accounting problem. Whoever pays the Krajina owns it, and whoever owns it owns the border."
 nd_ily.6.a: "Take the Austrian money. Walls first, pride after."
 nd_ily.6.a_tt: "Cheaper army upkeep and larger garrisons, paid for with crown authority."
 nd_ily.6.b: "The frontier is the kingdom's. We will find the money."
 nd_ily.6.b_tt: "Faster control growth and larger levies, paid for with army upkeep."

 nd_ily.7.t: "Colleges for a Nation Under Another Crown"
 nd_ily.7.d: "In 1580 Gregory XIII founded the Illyrian College at Loreto and gave it to the Jesuits, so that boys from the Slavic lands could be made into priests capable of going home again. In 1589 Sixtus V, who had already rebuilt the church of San Girolamo degli Illirici in Rome, confirmed by the bull Sapientiam Sanctorum a chapter of Slavonic-speaking priests attached to it. Bologna, Fermo and Ancona followed with foundations of their own.\n\nThe purpose was never in doubt. Marin Temperica had written to the Jesuit general in 1582 that a single Slavic tongue would carry a preacher from the Adriatic to the Black Sea, and that the order should print the grammars and dictionaries to fix it. The colleges existed to make missionaries for the lands under Ottoman rule, and by any honest accounting they underperformed. They also produced parish priests, bishops and writers for three centuries.\n\nOur own foundation now takes its first intake, and someone must decide where its graduates are sent."
 nd_ily.7.a: "Across the border. That is what they were made for."
 nd_ily.7.a_tt: "Faster conversion of other religion groups, stronger missionary buildings and better spy networks."
 nd_ily.7.b: "To our own parishes. Charity begins at the altar."
 nd_ily.7.b_tt: "Better educated clergy, a contented clergy estate and more of them."

 nd_ily.8.t: "The Knot at the Throat"
 nd_ily.8.d: "The Germans call them Crabaten and cannot decide whether they are cavalry or a plague. At the height of the war in the Empire something like twenty thousand of them are riding under Imperial colours, most of Wallenstein's harquebusiers among them, and their work is scouting, pursuit, the cutting of convoys and the burning of anything that might feed an enemy the following week. Set them against a line of pike and shot and they will not stand; ask them to ruin a province and it will be ruined.\n\nThe French, who have fought them and hired them, noticed the linen scarf knotted at the throat of the officers, took it up, and named it after the men who wore it. The regiments will outlast the war, the war will outlast the century, and the scarf will outlast both.\n\nThe muster is confirmed and the standards are issued."
 nd_ily.8.a: "Let them ride. The Empire will pay to be frightened."
 nd_ily.8.a_tt: "Stronger light cavalry, more plunder, faster marches and rising army tradition."

 nd_ily.9.t: "Wiener Neustadt"
 nd_ily.9.d: "Petar Zrinski was ban of Croatia and his brother-in-law Fran Krsto Frankopan was the last of a house that had held Krk and the Kvarner since anyone could remember. Between them they controlled a third of the kingdom. Convinced that Vienna had sold the frontier to the sultan at Vasvár and would go on selling it, they spent seven years in correspondence with the French, the Venetians, the Poles and finally the Turks themselves, and they were betrayed by every one of them in turn.\n\nThey came to Vienna under safe conduct in 1670 to beg pardon. On the thirtieth of April 1671 both were beheaded in the courtyard at Wiener Neustadt, and their estates, which were the estates of half of Croatia, passed to the chamber.\n\nThe sentence is signed. What is not yet settled is whether the crown carries it out."
 nd_ily.9.a: "Let the sentence stand. Take the lands with the heads."
 nd_ily.9.a_tt: "A far stronger crown estate and firmer control. The nobility is enraged."
 nd_ily.9.b: "Pardon them. A magnate who owes you his neck is loyal."
 nd_ily.9.b_tt: "A contented nobility, larger levies and legitimacy. The crown estate gives ground."

 nd_ily_glagoljasi: "The Glagoljaši"
 nd_ily_glagoljasi_desc: "In 1248 Innocent IV permitted the bishop of Senj and his clergy to celebrate the liturgy in Slavonic using Glagolitic letters, on the strength of a belief that Saint Jerome had invented the alphabet. The belief was wrong and the privilege was real. It created a class of married, half-lettered village priests, far more numerous than the Latin canons and far closer to the people they served."
 nd_ily_vinodolski_zakonik: "The Vinodol Code"
 nd_ily_vinodolski_zakonik_desc: "Written down on the sixth of January 1288 by forty-two elected men of nine communities of the Vinodol valley, in Glagolitic and in their own speech, to settle exactly what the counts of Krk could and could not demand of them. It is not a town charter but a law of the countryside, and it is old enough that Russkaya Pravda is the only Slavic code that precedes it."
 nd_ily_banderiji: "The Banderia"
 nd_ily_banderiji_desc: "Before the kingdom had a standing frontier army it had the banners of its great houses: Šubić, Nelipić, Kurjaković, Frankopan, each turning out its own mailed retinue under its own arms. Magnificent, expensive, and answerable to a lord before a king."
 nd_ily_banska_vlast: "Banal Authority"
 nd_ily_banska_vlast_desc: "The ban was a viceroy in fact if not in title. He convoked the Sabor, led the banderium of the kingdom, minted in his own name in earlier centuries and judged in the king's. Croatia was a country that had to be governed with its own consent, and the office of ban was the machinery for obtaining it."
 nd_ily_posavska_hrastovina: "The Sava Oakwoods"
 nd_ily_posavska_hrastovina_desc: "The flood forests of the Sava and the Drava grow an oak slow, straight and close-grained enough that shipwrights and coopers will pay to have it carried a very long way. The grain of the Pannonian plain floats down the same rivers."
 nd_ily_tricesima: "The Thirtieth"
 nd_ily_tricesima_desc: "The tricesima, a royal customs of one part in thirty, taken at designated stations on the roads between the interior and the sea. It is the fiscal spine of a kingdom whose real product is the distance between the Sava and the Adriatic."
 nd_ily_zadarski_mir: "The Peace of Zadar"
 nd_ily_zadarski_mir_desc: "By the treaty sworn in the Franciscan sacristy at Zadar in February 1358, Venice renounced the entire Dalmatian coast and the doge struck duke of Dalmatia from his style. The cities came back to the crown, and every later Illyria inherits both the coast and the memory of losing it."
 nd_ily_glagoljski_notari: "The Glagolitic Notaries"
 nd_ily_glagoljski_notari_desc: "The privilege of 1248 was liturgical. Within a century it had become a habit of the whole public life of the littoral: leases, wills, boundary settlements and court records drawn in Glagolitic and in the vernacular, so that a man who could not read Latin could still have his own contract read back to him."
 nd_ily_pavlini: "The Pauline Hermits"
 nd_ily_pavlini_desc: "The one religious order founded within the Croatian and Hungarian kingdom, and the only one that could plausibly be called native. Their house at Lepoglava, endowed by the counts of Celje, kept the oldest grammar school in the country and eventually the best library in it."
 nd_ily_gradec_zlatna_bula: "The Golden Bull of Gradec"
 nd_ily_gradec_zlatna_bula_desc: "Béla IV, fleeing the Mongols, granted Gradec the status of a free royal town in 1242. It faced the bishop's fortified Kaptol across a ravine, feuded with it for the next three hundred years, occasionally burned it, and between the two of them they became Zagreb."
 nd_ily_senjska_tiskara: "The Press at Senj"
 nd_ily_senjska_tiskara_desc: "The Glagolitic missal of 1483 was in print twenty-eight years after Gutenberg. Blaž Baromić learned the trade in Venice and brought it home, and the chapter press at Senj ran from 1494 to 1508. Nowhere else in Latin Europe was the Mass itself being set in type in a vernacular."
 nd_ily_bosna_srebrena: "Bosna Srebrena"
 nd_ily_bosna_srebrena_desc: "The Franciscan custody of Bosnia, founded in 1340, was the only institution of the Latin church to survive the conquest of 1463. Fra Anđeo Zvizdović obtained a charter of protection from Mehmed II at Milodraž, and for four centuries the friars were the only church Catholic Bosnia had."
 nd_ily_antemurale: "Antemurale Christianitatis"
 nd_ily_antemurale_desc: "Leo X gave the kingdom the title in a letter to ban Petar Berislavić in 1519. It was flattery with an obligation attached. Krbava Field in 1493 had already shown what the wall cost when it failed, and it would go on failing at intervals for the next two centuries."
 nd_ily_kaptolske_zidine: "The Chapter Walls"
 nd_ily_kaptolske_zidine_desc: "Between 1512 and 1520 the canons of Zagreb walled their own cathedral precinct with towers and a ditch while the town below remained open. The pattern repeated across the kingdom until the chapter house was routinely the last defensible building in the parish."
 nd_ily_judita: "Judita"
 nd_ily_judita_desc: "Marko Marulić of Split finished it on the twenty-second of April 1501 and had it printed at Venice in 1521: the story of Judith and Holofernes in Croatian verse, aimed squarely at a people under Ottoman attack. He wrote in Latin for Europe, was read by Thomas More and Francis Xavier, and wrote in the vernacular for home."
 nd_ily_pribojevic: "De Origine Slavorum"
 nd_ily_pribojevic_desc: "Vinko Pribojević stood up before the nobles of Hvar in 1525 and told them they were Illyrians, that Alexander's Macedonians had been their kin, and that every Slav from the Adriatic to the Volga was of one blood with them. Printed at Venice in 1532, expanded by Mavro Orbini of Ragusa in 1601, the claim gave a scattered Catholic people a single name to answer to."
 nd_ily_haramije: "The Haramije"
 nd_ily_haramije_desc: "Raised in 1539 as paid foot for the Croatian and Slavonian forts, with one specific task: to run down the Ottoman martolos raiders who crossed the border to take people and sell them. It was a war of abduction, and the haramije were the answer to it."
 nd_ily_vojna_krajina: "The Military Frontier"
 nd_ily_vojna_krajina_desc: "Organised from 1553 into the Croatian and Slavonian generalcies, the Krajina held land in hereditary tenure against hereditary service. Whole populations were moved into it to garrison it, and in time the cordon became a society with its own law, its own captains and no landlords at all."
 nd_ily_karlovac: "Karlstadt"
 nd_ily_karlovac_desc: "Laid out in 1579 on empty meadow at the meeting of the Kupa and the Korana, a six-pointed star with a grid inside it and a garrison paid by the estates of Inner Austria. The frontier's one purpose-built fortress town, and still recognisably its own plan."
 nd_ily_ilirski_kolegiji: "The Illyrian Colleges"
 nd_ily_ilirski_kolegiji_desc: "Gregory XIII opened the Illyrian College at Loreto in 1580; Sixtus V rebuilt San Girolamo degli Illirici in Rome and confirmed its chapter of Slavonic-speaking priests by the bull Sapientiam Sanctorum in 1589. Both existed to make clergy who could go home to lands where no bishop could travel."
 nd_ily_ilirska_gramatika: "The Illyrian Grammar"
 nd_ily_ilirska_gramatika_desc: "Faust Vrančić of Šibenik printed his dictionary of five noble European tongues at Venice in 1595. Bartol Kašić of Pag published Institutionum linguae Illyricae at Rome in 1604 on the order of the Jesuit general, because a missionary needed one Illyrian that a Bosnian and a Dalmatian would both accept."
 nd_ily_skela_spalatensis: "The Scala of Split"
 nd_ily_skela_spalatensis_desc: "Daniel Rodriga spent a decade persuading Venice, and in 1592 the scala at Split opened with its customhouse and its quarantine. The Bosnian pasha agreed to let the caravans turn that way, and the overland trade of the Balkans acquired an Adriatic terminus."
 nd_ily_crabati: "The Croats"
 nd_ily_crabati_desc: "Some twenty thousand Croat light horse rode in Imperial service at the height of the German war, most of Wallenstein's harquebusiers among them. They scouted, pursued, cut convoys and burned country, and the French borrowed the scarf they knotted at the throat and named it after them."
 nd_ily_urota: "The Magnates' Conspiracy"
 nd_ily_urota_desc: "Petar Zrinski and Fran Krsto Frankopan, convinced that Vienna had sold the frontier at Vasvár, conspired with France, Venice, Poland and finally the Porte, and were betrayed by all of them. They were beheaded at Wiener Neustadt on the thirtieth of April 1671 and the greatest estates in Croatia passed to the chamber."
 nd_ily_oslobodjenje_slavonije: "The Recovery of Slavonia"
 nd_ily_oslobodjenje_slavonije_desc: "Karlowitz in 1699 returned Slavonia and Syrmia to the crown, emptied by a century and a half of raiding and grown back to oak forest. What followed was not conquest but settlement: colonists brought in by the wagonload, and frontier regiments planted on the new line."
 nd_ily_rijecka_luka: "The Free Port"
 nd_ily_rijecka_luka_desc: "Rijeka and Bakar were declared free ports in 1719. For the first time the Pannonian interior had a saltwater outlet that it owned outright rather than rented from a republic across the water."
 nd_ily_karolinska_cesta: "The Carolina Road"
 nd_ily_karolinska_cesta_desc: "Driven from Karlovac over the Gorski Kotar to Bakar between 1726 and 1732 by the engineer Anton Matthias Weiss, it was the first road across those mountains a loaded wagon could take. Everything before it went over the passes on a packhorse."
 nd_ily_zupne_skole: "The Parish Schools"
 nd_ily_zupne_skole_desc: "The village priest taught the village children their letters, and the letters he taught were the ones in his own missal. Literacy in this kingdom spread outward from the altar rather than downward from the court, and it reached people no court school would have admitted."
 nd_ily_jozefinska_cesta: "The Josephina and the Louisiana"
 nd_ily_jozefinska_cesta_desc: "The Josephina reached Senj in 1779 and the Lujzijana reached Rijeka in 1811, each straighter and better graded than the last, until a cart could cross from the Sava to the Adriatic in a few days. The wealth of this kingdom was always the distance between them."
 nd_ily_zadarsko_sjemeniste: "The Seminary at Zadar"
 nd_ily_zadarsko_sjemeniste_desc: "Matej Karaman, archbishop of Zadar, printed a corrected Glagolitic missal at Rome in 1741 and founded a seminary in 1748 to train priests who could actually read it. The privilege of 1248 was five hundred years old and still being taught to boys."
 nd_ily_rjecoslozje: "The Rjecoslozje"
 nd_ily_rjecoslozje_desc: "Joakim Stulli of Ragusa spent fifty years on his lexicon and had it printed between 1801 and 1810: some eighty thousand words of Illyrian set against Latin and Italian, the last and largest monument of the learned Illyrian idea before politics took the word away from the scholars."
 nd_ily_urbar: "The Urbarial Settlement"
 nd_ily_urbar_desc: "The peasants of Severin rose in 1755 and the answer was an urbarium: a written schedule of what a tenant owed his lord and, more remarkably, of what he did not. The obligations of the Croatian and Slavonian countryside were fixed on paper and could thereafter be argued about in court."
 nd_ily_kraljevska_akademija: "The Royal Academy"
 nd_ily_kraljevska_akademija_desc: "The Jesuits were suppressed in 1773 and their Zagreb college became the Royal Academy of Sciences in 1776, a crown institution assembled out of a dissolved order's library, lecture rooms and unemployed professors."

 nd_ily_glagoljaska_zupa: "Glagolitic Parish"
 nd_ily_glagoljaska_zupa_desc: "A village church whose priest says Mass in Slavonic from a missal in Glagolitic letters, under a papal privilege granted to the bishop of Senj in 1248 and never withdrawn. He is married, he owns few books, and his congregation understands every word he says. Can only be built where the people actually speak the tongue the privilege covers."
 nd_ily_tridesetnica: "Tricesima Station"
 nd_ily_tridesetnica_desc: "A royal customs office with a weigh-house, a strong room and a guard, taking one part in thirty from every load that passes between the interior and the sea. The revenue is the crown's, not the town's, and the stations stand only where the traffic can be made to stop."
 nd_ily_glagoljska_tiskara: "Glagolitic Press"
 nd_ily_glagoljska_tiskara_desc: "A chapter press with cut Glagolitic type, of the kind Blaž Baromić brought back from Venice to Senj in 1493 and Šimun Kožičić Benja set up in his own house at Rijeka in 1530. Small, clerical, and printing books that no other press in Latin Christendom is permitted to print."
 nd_ily_kaptolska_utvrda: "Chapter Fortress"
 nd_ily_kaptolska_utvrda_desc: "A cathedral precinct walled and towered at the chapter's own expense, on the model of the Zagreb Kaptol between 1512 and 1520. The canons hold the keys and pay the garrison, and when the raiders come the parish comes inside."
 nd_ily_ilirski_kolegij: "Illyrian College"
 nd_ily_ilirski_kolegij_desc: "A residential college on the model of Loreto and San Girolamo, taking boys from Slavic lands and turning out priests who can preach in the tongue their people speak. Its graduates go where bishops cannot, and its library is the best in the province."
 nd_ily_cardak: "Frontier Blockhouse"
 nd_ily_cardak_desc: "A timber watch-house with a firing platform and an alarm gun, one of a chain built within sight of each other along the cordon, and the soldier households settled around it who hold their land against hereditary service. It is only worth building on the border, and the border moves."

 nd_ily_zupa_maintenance: "Parish Upkeep"
 nd_ily_zupa_maintenance_desc: "Candle wax, altar wine, cloth for the vestments and paper for the register of baptisms. The parish priest keeps the only written record most of his people will ever appear in."
 nd_ily_pm_zupna_skola: "Parish School"
 nd_ily_pm_zupna_skola_desc: "The priest teaches the village children to read the letters in his own missal, in a room behind the church, between the harvest and the sowing."
 nd_ily_tridesetnica_maintenance: "Customs Register"
 nd_ily_tridesetnica_maintenance_desc: "Ledgers, seals, lamp wax and the timber of the weigh-house. Every load that stops here is entered, valued and taxed at one part in thirty."
 nd_ily_pm_notarski_ured: "Notary's Office"
 nd_ily_pm_notarski_ured_desc: "A public notary drawing leases, wills and boundary settlements in the vernacular and in Glagolitic, so that the parties can hear their own agreement read back to them."
 nd_ily_pm_karavanska_skela: "Caravan Terminus"
 nd_ily_pm_karavanska_skela_desc: "The Bosnian caravans come down to the quay with wool, hides and wax, are held their forty days, and go back inland with Venetian cloth. The scala at Split turned a trade route by argument rather than by war."
 nd_ily_pm_slobodna_luka: "Free Port Warehouse"
 nd_ily_pm_slobodna_luka_desc: "Under the free port patents the duty is remitted and the goods lie bonded in the crown's own sheds, waiting for a hull. Cordage, pitch and staves outward, everything else inward."
 nd_ily_tiskara_liturgija: "Missals and Breviaries"
 nd_ily_tiskara_liturgija_desc: "The angular Glagolitic of Senj, cut in lead and set by canons, printing the one vernacular liturgy Rome allows in the Latin west."
 nd_ily_pm_pucka_knjiga: "Books for Laymen"
 nd_ily_pm_pucka_knjiga_desc: "Verse, chronicle and devotion in the vernacular for people who are not clergy, in the line that Marulić opened with Judita and never entirely closed again."
 nd_ily_pm_latinicka_slova: "Illyrian in Roman Letters"
 nd_ily_pm_latinicka_slova_desc: "Kašić's grammar was set in Roman type so that a Jesuit in Rome could learn Illyrian without first learning a second alphabet. The compromise doubled the readership and halved the mystique."
 nd_ily_pm_karamanov_misal: "The Corrected Missal"
 nd_ily_pm_karamanov_misal_desc: "Karaman's revision of 1741, cut and cast to the standard of the Congregation for the Propagation of the Faith and shipped back down the coast to parishes that had been using worn copies for two centuries."
 nd_ily_kaptol_maintenance: "Chapter Garrison"
 nd_ily_kaptol_maintenance_desc: "Stone for the curtain wall, timber for the hoardings, arms for the men the canons keep on the payroll, and wax for the choir that goes on singing behind it."
 nd_ily_pm_kaptolski_arsenal: "Chapter Arsenal"
 nd_ily_pm_kaptolski_arsenal_desc: "Powder, shot and small arms stored in the cathedral undercroft, issued to the parish when the alarm gun fires. The bishops of the frontier kept better inventories of muskets than of relics."
 nd_ily_kolegij_maintenance: "College Endowment"
 nd_ily_kolegij_maintenance_desc: "Books, paper, cloth for the students' habits and wax for the night hours. A college of resident boys eats its endowment steadily and produces nothing measurable for six years."
 nd_ily_pm_akademija: "Academy of Sciences"
 nd_ily_pm_akademija_desc: "Lenses, instruments and a printing account, after the crown took a dissolved order's lecture rooms and put natural philosophy in them."
 nd_ily_cardak_maintenance: "Cordon Watch"
 nd_ily_cardak_maintenance_desc: "Powder for the alarm gun, timber for the platform, pitch for the beacon and beasts for the men who ride the line between the houses."
 nd_ily_pm_zadruga: "Soldier Households"
 nd_ily_pm_zadruga_desc: "The extended family holding of the frontier, thirty souls under one roof working land the crown cannot tax, on the single condition that the men of it turn out armed when called."

 a_nd_ily_banderij: "Banderium"
 a_nd_ily_banderij_desc: "The mailed retinue of a great house, raised under its own banner and its own arms. Splendidly mounted and heavy in the charge, slow to assemble, and travelling with a lord's baggage rather than a soldier's."
 a_nd_ily_haramija: "Haramije"
 a_nd_ily_haramija_desc: "Paid frontier foot, raised in 1539 to hunt Ottoman raiders through the woods and river country of the Sava and the Una. Fast, cheap and lightly armed, and never intended to hold a line of battle."
 a_nd_ily_crabat: "Croat Light Horse"
 a_nd_ily_crabat_desc: "Frontier cavalry hired into the German war, unequalled at scouting, pursuit and the ruin of a countryside. They will not stand in a firefight, and the linen scarf at their throats gave Europe the cravat."

 levy_nd_ily_banderij: "Banderium Levy"
 levy_nd_ily_banderij_desc: "The magnates of the kingdom turn out their own mailed retinues under their own banners, as they have done since the crown had no other army."
 levy_nd_ily_haramija: "Haramije Levy"
 levy_nd_ily_haramija_desc: "Frontier foot drawn from the soldier and peasant population of the border forts, paid by the captain and let loose on the raiding roads."

 ##############################################################################
 # DESTINY TREE
 ##############################################################################

 nd_ily_destiny: "The Crown of the Illyrian Nation"
 nd_ily_destiny_desc: "Illyria is proclaimed, and the argument that produced it is now a policy. One treasury cannot garrison every valley and endow every college at the same time, and the course taken at the proclamation is the course the chancery will keep entering in the register until it is finished. Required: stability 75."

 nd_ily_dest_prekodravlje: "Beyond the Drava"
 nd_ily_dest_prekodravlje_desc: "The Drava is not a frontier. It is a road, and the sanjak on the far bank exists to use it: a raiding country with its seat at Pécs and its crossing at Mohács, which has been harvesting Slavonia every summer since 1543. A wall defended from behind it is a wall that is climbed over. Required: own Pécs and Mohács, army size 30."

 nd_ily_dest_alba_graeca: "Alba Graeca"
 nd_ily_dest_alba_graeca_desc: "The chancery calls the white fortress at the confluence Alba Graeca and the rest of Christendom calls it the key. Whoever holds the meeting of the Sava and the Danube decides where the next war will be fought, and the crossing at Šabac decides who reaches the meeting. Required: own Šabac and Belgrade, army size 50, total development 1000."

 nd_ily_dest_banatski_kordon: "The Banat Cordon"
 nd_ily_dest_banatski_kordon_desc: "The line now runs unbroken from the Adriatic to the mountains of Transylvania: watch-houses within sight of one another, crossings that are licensed or closed, and a population that holds its fields on the condition that it turns out at the alarm gun. A kingdom that pays for this out of its own treasury does not take its orders from anybody else's. Unlocks the Frontier Council. Required: own Timișoara and Smederevo, army size 75, prestige 75, total development 1500."

 nd_ily_dest_propaganda: "The Congregation of Propaganda"
 nd_ily_dest_propaganda_desc: "Rome founds the Congregation for the Propagation of the Faith in 1622, and four years later its polyglot press begins cutting type in every alphabet the missions need, the angular letters of Senj among them. The kingdom makes itself that congregation's workshop: presses, paper, seminaries and the men to staff them, paid for at home because nobody else will pay for them. Required: embraced Printing Press, books produced or traded in one of your markets, gold 1000."

 nd_ily_dest_marcanska_unija: "The Union of Marča"
 nd_ily_dest_marcanska_unija_desc: "Simeon Vratanja went to Rome in 1611 and came home a bishop in Roman obedience with his own liturgy untouched. The monastery of Marča becomes the seat of a union eparchy for the Orthodox herdsmen who garrison the frontier, and the most dangerous population in the kingdom becomes, on paper, Catholic. Required: embraced Confessionalism, gold 2000, total development 1000."

 nd_ily_dest_ecclesia_illyrica: "The Illyrian Church"
 nd_ily_dest_ecclesia_illyrica_desc: "Riceputi and Farlati begin the Illyricum Sacrum, a register of every see in Illyricum from the apostles onward, at the moment the crown reaches the province the geographers still call by that name. Shkodër and Lezha come under a Catholic king, and so does the mission archbishopric at Skopje, so that priests trained at Loreto no longer serve at the sultan's pleasure. Unlocks the Marian Shrine. Required: own the whole Illyria province, own Skopje, gold 3000, prestige 75."

 nd_ily.10.t: "What the Kingdom Is For"
 nd_ily.10.d: "The chancery has a habit it learned from the notaries: whatever has been decided is written down at once, so that nobody may later claim it was decided otherwise. The clerks enter the crown's course in the register, Latin on the left and the angular letters on the right, and the entry will be read aloud at every Sabor for as long as there is a Sabor to read it to.\n\nBeyond the last watch-house the country is the same country. The same karst, the same oak, the same villages where the priest is married and the Mass is understood. The line drawn through it is a decision rather than a geography, and a decision can be moved.\n\nWhat follows is the working out of a choice already made."
 nd_ily.10.a: "Enter it in the register."

 nd_ily.11.t: "The Sanjak Across the River"
 nd_ily.11.d: "For a century and a half the summer began the same way. The water dropped, the fords opened, and the horsemen of the sanjak whose seat is Pécs came over the Drava into Slavonia, took what could be driven and whoever could be sold, and were back across before the ban's banderium had finished assembling.\n\nThis year the crossing is made in the other direction. Mohács, where a king and an army were lost in an afternoon in 1526, is entered without a battle; the vineyards on the Villány hills are counted and taxed; and the garrisons that were the raiders' winter quarters become the northernmost posts of the kingdom's own line.\n\nThe frontier has moved for the first time in living memory, and it moved forward."
 nd_ily.11.a: "Garrison the fords. Let them learn the new arithmetic."

 nd_ily.12.t: "Alba Graeca"
 nd_ily.12.d: "The confluence has been taken. Where the Sava runs into the Danube there is a limestone ridge with a fortress on it that Hungarians called Nándorfehérvár, that the chancery enters as Alba Graeca, and that every diplomat in Europe simply calls the key, because the road to Vienna begins at it and so does the road to Constantinople. Šabac, the crossing that made the approach possible, is being rebuilt with a proper ravelin.\n\nWith the line this long a question that could be postponed while it was short can be postponed no longer. The men who hold it are Vlach and Orthodox, refugees settled generations ago on empty ground, who take no landlord, obey their own headmen, and are the best light troops in the Christian world. They have petitioned, again, to have their liberties put in writing."
 nd_ily.12.a: "Grant the statutes. Let the frontier govern itself."
 nd_ily.12.b: "No charter. The line is a command, not a privilege."

 nd_ily.13.t: "The Line Complete"
 nd_ily.13.d: "It is finished. From the Adriatic to the Transylvanian passes there is now a continuous belt of watch-houses, blockhouses, licensed crossings and soldier villages, each within sight of the next, manned by families who hold their land for exactly one reason. Timișoara and its drained marshes are in the belt. So is Smederevo on the Danube. A courier can ride the whole length of it without once leaving the crown's jurisdiction.\n\nWhat nobody in Graz expected is that the bill was paid here. The archduke's subsidy was declined, the estates voted the money, and the line belongs to the kingdom that holds it.\n\nThe war council, which now sits in our own capital, asks what the line is for."
 nd_ily.13.a: "Seal it. Nothing crosses but where we say it crosses."
 nd_ily.13.b: "March it. The best foot in Europe should not sit still."

 nd_ily.14.t: "The Polyglot Press"
 nd_ily.14.d: "In a room off the Piazza di Spagna the Congregation for the Propagation of the Faith keeps a press with more alphabets than any printing house on earth: Greek, Syriac, Armenian, Arabic, Coptic, Cyrillic, and the angular Glagolitic that has been legal in this kingdom and nowhere else since 1248. The punches for it were cut to a Dalmatian hand.\n\nThe arrangement that follows is not charity in either direction. Rome supplies the licence, the standard and the prestige. This kingdom supplies the paper, the endowments, the seminaries and, above all, the men: priests who can preach in a Slavic tongue and pass for locals from the Sava to the Danube, which is precisely what the Congregation cannot recruit anywhere else in Latin Christendom.\n\nThe treasury notes, without enthusiasm, what it costs."
 nd_ily.14.a: "Set the type. We will supply the men and the paper."

 nd_ily.15.t: "The Bishop at Marča"
 nd_ily.15.d: "The monastery stands in the Slavonian frontier country, and the man who has just come back to it from Rome is a bishop twice over. Simeon Vratanja went as the spiritual head of the Orthodox Vlachs who garrison the border; he returned confirmed by the pope, in obedience to Rome, and with his own liturgy, his own calendar and his own married clergy untouched.\n\nEvery interested party regards this as a victory and no two of them agree on what has been won. Rome has a union. The Vlachs have a bishop of their own and a written guarantee of their rite. The chapter at Zagreb has a rival prelate inside its diocese and has already begun writing letters about it, and will still be writing them a century from now.\n\nThe crown must decide which reading is the official one."
 nd_ily.15.a: "A settlement. Confirm him, and confirm the rite."
 nd_ily.15.b: "A stage. Latin bishops, and Roman schools."

 nd_ily.16.t: "The Register of the Illyrian Church"
 nd_ily.16.d: "Two Jesuits in Venice are compiling, see by see and bishop by bishop, the entire ecclesiastical history of Illyricum from the apostles to the present day. It will run to eight folio volumes. Every diocese in it that once had a Catholic bishop is being looked up by the chancery to see who holds the town now, and increasingly the answer is that we do: Shkodër, Lezha and the hill country behind them, and the archbishop's seat at Skopje from which the missions to Serbia and Bulgaria have always been run.\n\nThe Illyrian name has been a claim made by scholars for two hundred years. It is now a jurisdiction.\n\nThere is money for one great work, and two proposals for it."
 nd_ily.16.a: "Build the shrine. Let Christendom come to us."
 nd_ily.16.b: "Endow the colleges. Rome has the greater need."

 STATIC_MODIFIER_NAME_nd_ily_dest_statuta_valachorum: "Statuta Valachorum"
 STATIC_MODIFIER_DESC_nd_ily_dest_statuta_valachorum: "The frontier households receive their privileges in writing: their own headmen, their own courts, their land free of any landlord, and in return a musket in every house and a man at every muster. The crown gains an army it does not have to pay and a province that never quite finishes joining the kingdom."
 STATIC_MODIFIER_NAME_nd_ily_dest_generalatus: "The Generalcy"
 STATIC_MODIFIER_DESC_nd_ily_dest_generalatus: "No charter, no privileges, no headmen. The cordon is a command with commissioned officers, inspected magazines and rolls that are actually called. What it lacks in enthusiasm it makes up by being where it was ordered to be."
 STATIC_MODIFIER_NAME_nd_ily_dest_sealed_cordon: "The Cordon Sealed"
 STATIC_MODIFIER_DESC_nd_ily_dest_sealed_cordon: "The line is closed. Goods cross at licensed stations under guard and nowhere else, the fortresses are built to a plan rather than to a panic, and the merchants who used to slip over the hills at night now pay for the privilege of not doing so. Our own factors abroad cost rather more to keep."
 STATIC_MODIFIER_NAME_nd_ily_dest_marching_frontier: "The Frontier Marches"
 STATIC_MODIFIER_DESC_nd_ily_dest_marching_frontier: "The cordon's regiments are lent to other people's wars and come home knowing things. Light foot who skirmish in broken country, live off it, and re-form after a beating faster than any line regiment in Europe."
 STATIC_MODIFIER_NAME_nd_ily_dest_vlach_bishop: "The Bishop at Marča"
 STATIC_MODIFIER_DESC_nd_ily_dest_vlach_bishop: "The herdsmen keep their liturgy, their calendar and their own prelate, and enter Roman obedience on those terms. Their flocks feed the frontier and their sons fill its companies. The chapter at Zagreb regards the arrangement as an outrage and says so in writing, at length, for a hundred years."
 STATIC_MODIFIER_NAME_nd_ily_dest_latin_obedience: "The Latin Obedience"
 STATIC_MODIFIER_DESC_nd_ily_dest_latin_obedience: "The union is read as a waystation rather than a settlement. Latin bishops are set over the frontier parishes, the schools teach the Roman rite, and conversion proceeds steadily. The muster takes noticeably longer to assemble than it used to, and nobody will say why."
 STATIC_MODIFIER_NAME_nd_ily_dest_pilgrim_road: "The Pilgrim Road"
 STATIC_MODIFIER_DESC_nd_ily_dest_pilgrim_road: "The Holy House is said to have rested on the cliff above the Rijeka crossing before it went on to Loreto, and pilgrims have believed it for four hundred years. Inns, candle makers, badge sellers and money changers line the road to the sanctuary, and the crown takes its share of every one of them."
 STATIC_MODIFIER_NAME_nd_ily_dest_congregation_men: "The Congregation's Men"
 STATIC_MODIFIER_DESC_nd_ily_dest_congregation_men: "The best educated men in the kingdom are Rome's to dispose of, and they go: to Albania, to the Danube, to any court that needs somebody who can write in three alphabets and be trusted with a letter. The endowments that trained them leave with them and are never taxed again."

 nd_ily_consilium_confiniorum: "Frontier Council"
 nd_ily_consilium_confiniorum_desc: "The war council of the frontier, sitting in this kingdom's capital instead of somebody else's. Muster rolls, magazines, engineers and the whole artillery establishment of the line are administered from one table, and the noble houses that supply its officers are heard at it."
 nd_ily_consilium_maintenance: "Council Chancery"
 nd_ily_consilium_maintenance_desc: "Clerks, couriers, sealed registers, map cases and the green cloth the council sits at."
 nd_ily_svetiste: "Marian Shrine"
 nd_ily_svetiste_desc: "A hill sanctuary with a miraculous image, a religious house to keep it, and a track worn smooth by people who walk it barefoot. They come from three kingdoms, they arrive believing, and a good many of them do not go home."
 nd_ily_svetiste_maintenance: "Shrine Upkeep"
 nd_ily_svetiste_maintenance_desc: "Candles by the crate, vestments, altar wine and cheap printed copies of the image."

 nd_ily.10.a_tt: "The destiny path chosen at the proclamation is now open in the Traditions tab."
 nd_ily.11.a_tt: "The far bank of the Drava is ours."
 nd_ily.12.a_tt: "Larger and faster recovering peasant levies. Conquests take longer to integrate."
 nd_ily.12.b_tt: "Faster garrison growth, quicker reinforcement and better initiative in the field."
 nd_ily.13.a_tt: "Better protected trade and more fortresses. Merchants abroad cost more to keep."
 nd_ily.13.b_tt: "Stronger light infantry, faster morale recovery and slower loss of army tradition."
 nd_ily.14.a_tt: "The Congregation's press is ours to feed."
 nd_ily.15.a_tt: "More livestock and better levy quality. The settlement is disputed and stability suffers."
 nd_ily.15.b_tt: "Faster conversion and firmer urban control. Recruitment on the frontier slows."
 nd_ily.16.a_tt: "More merchants, better minting and busier burghers."
 nd_ily.16.b_tt: "Another diplomat and higher literacy. Endowments in mortmain cannot be taxed."

 # ===== BUREAUCRACIES =====
 ily_loca_credibilia_bureaucracy: "Loca Credibilia"
 ily_loca_credibilia_bureaucracy_desc: "The places of authentic faith. From the decree of 1231 a legal act had to be recorded before a cathedral chapter or a monastic convent, and Louis I fixed in 1351 the roll of houses whose seal made an instrument authentic. The chapter of Zagreb, sealing under the image of Saint Stephen since 1297, and the collegiate chapter of Čazma, founded in 1232 by bishop Stjepan II, drew, sealed and stored the charters of the realm, walked the boundaries of disputed land, served summonses and carried out judgments in the king's name. Western Europe hired lay notaries for this work. Here canons did it, and went on doing it until feudal tenure was abolished in the 1840s."
 ily_sabor_kraljevine_bureaucracy: "Sabor Kraljevine"
 ily_sabor_kraljevine_bureaucracy_desc: "The congregation of the realm, first recorded at Zagreb in 1273 and merged on 1 September 1558 into one assembly for Croatia and Slavonia. Prelates, magnates, the ban, the viceban, the protonotary and the deputies of the counties sat together: they voted the dika laid on each hearth, called out the noble insurrection, and the bishops brought banderia of their own. The diet had no fixed seat and answered a summons wherever the ban sent it, which is how it came to sit in the castle at Cetin on 1 January 1527 and elect Ferdinand of Habsburg king of Croatia on its own authority, after taking his oath to the kingdom's laws and liberties."
 ily_visitationes_canonicae_bureaucracy: "Visitationes Canonicae"
 ily_visitationes_canonicae_bureaucracy_desc: "From 1615 the archdeacons of Zagreb rode a circuit of every parish in the diocese and wrote each one down: the priest and what he could read, the church and its vessels, the parish fields and their yield, the confraternities, the number of houses and souls, and the conduct of the people in them. Two hundred and fourteen bound volumes of protocols survive from 1615 onward. It is the nearest thing this kingdom has to a census, kept by clergymen for a crown that cannot pay surveyors, and along the frontier it is also the register of which villages hold to the Greek rite and which have come over."
 ily_tabula_banalis_bureaucracy: "Tabula Banalis"
 ily_tabula_banalis_bureaucracy_desc: "Charles VI erected the Banal Table in 1723 and gave the kingdom a bench that sat all year, in place of the octaval terms under which a suit could outlive the man who brought it. The ban or his viceban presided over seven to nine judges with the protonotary of the realm as reporter; the court took the great causes at first instance and the appeals of the county courts, and from 1725 the king named its members. Its docket was land: who owned what in a country that had been overrun, emptied and granted out again, and no field in Slavonia was worth clearing until that question had an answer."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_ily_bureaucracy_authority: "Illyrian Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_ily_bureaucracy_authority: "On the proclamation of [ILY.GetName], the institutions the Catholic Slavic crown actually ran on (the chapters that held the public seal, the diet of the realm, the archdeacon's circuit and the bench of the ban) become available as toggleable bureaucracies. One slot is granted here and the capital adds another."
