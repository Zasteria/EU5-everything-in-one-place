l_english:
 DNM: "Danubian Monarchy"
 DNM_ADJ: "Danubian"
 DNM_f: "Danubian Monarchy"
 DNM_f_desc: "The Danubian Monarchy is the state the House of Habsburg forges when Austria, Bohemia and Hungary answer to one court: the centralized multi-ethnic monarchy the Habsburgs always reached for and never quite grasped. To the Holy Roman Emperor the German hegemony and the Danube super-state were forever in tension: an emperor bound to the imperial diet, the electors and the Reichstag could never simply centralize three crowns into one. Forming the Danubian Monarchy poses that dilemma as a choice. Remain within the Reich, as the Habsburgs did for three centuries, and rule it from the Danube under imperial law, with the Diet to ratify your Sanction and the Crown of Saint Stephen resentful of every tie to the Empire. Or break with the Reich, walk your imperial lands out with the Emperor's claim upon them, and refound the three crowns as a sovereign empire answerable to no diet but your own. This is not Austria-Hungary, the dualist compromise that history would only reach after a century of crisis, but the composite monarchy at the moment it chose what it would be."
