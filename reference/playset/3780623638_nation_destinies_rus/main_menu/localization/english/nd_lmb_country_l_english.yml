l_english:
 LMB: "Lombardy"
 LMB_ADJ: "Lombard"
 LMB_f: "Lombardy"
 LMB_f_desc: "Claim the Iron Crown of the old regnum Langobardorum and raise the Po valley into a kingdom in its own right, crowned at Monza or Pavia as the medieval kings of Italy once were. From the communes of the Lombard League that humbled Barbarossa at Legnano to the Visconti dukes who stood one campaign from a royal title when plague struck in 1402, Lombardy has always been the heart of northern Italy: its bankers, its looms, and its Ambrosian church lack only a crown to match. A Lombard power that holds both Milan and Pavia may take that final step."
