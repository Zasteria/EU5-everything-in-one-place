 # End Requirements cards are universal; the DNM and Emperor cards toggle
 # based on the viewing player's identity.

 # Top-bar counter labels.
 nd_dnm_chain_header: "The Succession"
 nd_dnm_confidence_header: "Crown Confidence"

 # Two-party strength card tooltips (DNM vs HRE Emperor).
 # Vanilla hussite_wars uses a concise "Strength X%" form (see vanilla
 # BOH_STR_TT). Same pattern here so the text fits the card width.
 nd_dnm_two_party_dnm_str: "Strength [GetCountry('DNM').GetRelativeMilitaryStrength(GetUniqueInternationalOrganization('hre').GetLeaderCountry.Self)|V2%]"
 nd_dnm_two_party_emperor_str: "Strength [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetRelativeMilitaryStrength(GetCountry('DNM').Self)|V2%]"

 # Description card (universal).
 nd_dnm_reaction_of_the_reich_situation_header: "The Estrangement"
 nd_dnm_reaction_of_the_reich_situation_body: "The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] and the [ShowSpecialStatusName('curia')] treat the Danubian monarchy as an apostate.\n\nWhile the estrangement lasts:\n@arrow_bonus_tier_1! The monarchy carries $STATIC_MODIFIER_NAME_nd_dnm_reich_pariah$.\n@arrow_bonus_tier_1! The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] holds the [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e] against it.\n@arrow_bonus_tier_1! The question of the inheritance will be raised at court within the first decade.\n@arrow_bonus_tier_1! Imperial pressure tightens from time to time.\n\nIt ends when any one of these is true:\n@arrow_bonus_tier_2! The [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] has ended, upheld or broken.\n@arrow_bonus_tier_2! The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] is beaten to #Y 80%#! war score and forced to accept #Y Humble the Reich#!.\n@arrow_bonus_tier_2! The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] accepts an offer of reconciliation.\n@arrow_bonus_tier_2! #Y 50#! years pass and the monarchy holds #Y 60#! [legitimacy|e] and #Y 50#! [prestige|e]."

 # DNM perspective card (visible only if SituationView.GetPlayer IS DNM).
 nd_dnm_panel_dnm_header: "What We Must Do"
 nd_dnm_panel_dnm_body: "We are the apostate, and the verdict lifts only if we act.\n\n@arrow_bonus_tier_2! #bold Legitimacy#!: answer the question of the inheritance when the court raises it, then settle the [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')].\n@arrow_bonus_tier_2! #bold Strength#!: beat the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] to #Y 80%#! war score and impose #Y Humble the Reich#!.\n@arrow_bonus_tier_2! #bold Reconciliation#!: offer the Emperor #Y two years' income#!.\n@arrow_bonus_tier_2! #bold Endurance#!: #Y 50#! years, with #Y 60#! [legitimacy|e] and #Y 50#! [prestige|e]."

 # HRE Emperor perspective card (visible only if SituationView.GetPlayer is the IO leader).
 nd_dnm_panel_emperor_header: "Our Case as Emperor"
 nd_dnm_panel_emperor_body: "A prince of the Empire has taken his crowns and gone. We hold the [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e] against him.\n\n@arrow_bonus_tier_1! The ban may be invoked at any time, and it stands until the breach closes.\n@arrow_bonus_tier_1! Beating him in war does not end the estrangement. Only he can close it, or we can destroy him.\n@arrow_bonus_tier_1! He may offer reconciliation. A weak or distracted Emperor accepts more readily."

