 nd_dnm_seek_diet_ratification_desc: "Petition for the Imperial Diet's guarantee of the Pragmatic Sanction, with concessions worth two years' revenue. If it is granted, every constituent crown that still answers to us is welded into the realm and its lands stay imperial. A strong Emperor is less willing to let one member swallow three crowns; a friendly one, and one of our own faith, more. As Emperor, the petition goes to an elector and the price is paid in imperial authority."
