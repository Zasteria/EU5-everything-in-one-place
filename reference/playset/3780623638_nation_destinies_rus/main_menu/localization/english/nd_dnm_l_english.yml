 nd_dnm_sue_for_imperial_reconciliation_desc: "Send a formal embassy to the Emperor's court with a tribute of two years' revenue and a petition: that the Danubian state be received again as a power among powers, not an apostate. A weak Emperor needs friends; a distracted one needs quiet borders; a strong and aggrieved one will mock the overture publicly, and the court will not soon forget the mockery."
