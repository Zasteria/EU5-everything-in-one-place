 # ===== FORMATION EVENT =====
 nd_dnm.1.t: "The Crowns of the Danube"
 nd_dnm.1.d: "It is done. The hereditary lands, the Crown of Saint Wenceslas and the Crown of Saint Stephen have walked out of the Holy Roman Empire together, and the imperial dignity has been laid down. The electors meet without us; the Pope's legates ride for Vienna with grievances; in the German lands the Reich is left to the princes. We have what no Emperor bound to the Reichstag could ever hold: Austria, Bohemia and Hungary as one sovereign realm, answerable to no diet but our own court.\n\nBut a realm of Germans, Czechs, Magyars, Croats, Slovaks and a dozen more is not yet a monarchy. What binds it?\n\n#bold Antemurale Christianitatis#! makes the Danube the shield of Christendom: the Military Frontier, the Grenzer soldier-colonies, the endless Ottoman war that gives every crown a common enemy and a common cause.\n\n#bold Gesamtmonarchie#! makes the Danube one body: the Hofkammer, the Hofkriegsrat, the Pragmatic Sanction welding three chanceries into a single obedient administrative state.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dnm.1.a: "Antemurale Christianitatis: be the bulwark of Christendom"
 nd_dnm.1.b: "Gesamtmonarchie: weld three crowns into one body"

 # ===== HERITAGE DHE EVENTS =====
 nd_dnm.2.t: "The Military Frontier"
 nd_dnm.2.d: "Along the Sava, the Drava and the lower Danube a new kind of society takes shape. Serb, Croat and Vlach families are settled on the border under hereditary land tenure: free of feudal dues, free in their faith, but bound man and boy to perpetual military service. The Militaergrenze is not a fortress line but a living wall of soldier-farmers, the largest militarized population in Europe, watching the Ottoman frontier from cradle to grave. The question is what to do with a standing army that never disbands."
 nd_dnm.2.a: "A spearhead: press the line south into Ottoman lands"
 nd_dnm.2.b: "A shield: settle the line deep and let it sustain itself"
 nd_dnm.3.t: "The White Mountain"
 nd_dnm.3.d: "On a November morning outside Prague the army of the Bohemian Estates is broken in a single afternoon. The Winter King flees; twenty-seven leaders of the revolt are executed on the Old Town Square; the elective monarchy of Saint Wenceslas is abolished by the Verneuerte Landesordnung and the crown declared hereditary, Catholic and Habsburg. A third of Bohemia's land changes hands. No single day did more to forge the composite monarchy, or left a deeper wound in it."
 nd_dnm.3.a: "Re-Catholicize by patent: one faith, imposed from above"
 nd_dnm.3.b: "Bind a new nobility: loyalty bought with confiscated land"
 nd_dnm.4.t: "The Pragmatic Sanction"
 nd_dnm.4.d: "Charles VI has no son, and he will not let the work of two centuries be partitioned at his death. Crown by crown, diet by diet, the Pragmatic Sanction is ratified: the Habsburg lands shall descend #italic indivisibiliter ac inseparabiliter#! (indivisible and inseparable) as one body to a single heir, daughter or son. For the first time Austria, Bohemia and Hungary are not three crowns in one hand but one legal person. It is the constitutional spine of the Gesamtmonarchie. It is also the document the next war will be fought over."
 nd_dnm.4.a: "One realm, one heir, indivisible and inseparable"
 nd_dnm.5.t: "The Theresian Reforms"
 nd_dnm.5.d: "Silesia is lost, and the loss is a verdict: a realm that cannot tax and cannot drill cannot defend itself. From Vienna the reform comes down like a tide: a unified treasury, the Directorium, the conscription cantons, the Theresianum to train the men who will run it. Where Maria Theresa builds the machine, Joseph II pushes it past its limits: the Toleranzpatent, a single chancery language, the serf set free by decree. For one generation the composite monarchy is, very nearly, a state."
 nd_dnm.5.a: "The cameralist machine: taxed, drilled, centrally ruled"
 nd_dnm.5.b: "The Josephine reach: tolerance, literacy, one bureaucracy"

 # ===== FORMATION TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_dnm_antemurale_christianitatis: "Antemurale Christianitatis"
 STATIC_MODIFIER_DESC_nd_dnm_antemurale_christianitatis: "The shield of Christendom on the Danube. The Military Frontier and the Grenzer soldier-colonies make the realm a wall of men against the Ottomans, and standing as the bulwark of the faith wins prestige across Catholic Europe, at the cost of a court forever tied up provisioning the frontier."
 STATIC_MODIFIER_NAME_nd_dnm_gesamtmonarchie: "Gesamtmonarchie"
 STATIC_MODIFIER_DESC_nd_dnm_gesamtmonarchie: "The total monarchy. The Hofkammer, the Hofkriegsrat and the Pragmatic Sanction weld three crowns into one obedient administrative body, taxed and integrated from Vienna, at the cost of the estates' and the imperial diet's resentment of the centralizing court."

 # ===== HERITAGE DHE TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_dnm_frontier_spearhead: "Frontier Spearhead"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_spearhead: "The Military Frontier turned outward: the Grenzer as a spear of reconquest pressing the Ottoman line south."
 STATIC_MODIFIER_NAME_nd_dnm_frontier_shield: "Frontier Shield"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_shield: "The Military Frontier settled deep and self-sustaining, an unbreakable wall that feeds and mans itself."
 STATIC_MODIFIER_NAME_nd_dnm_verneuerte_ordnung: "Verneuerte Landesordnung"
 STATIC_MODIFIER_DESC_nd_dnm_verneuerte_ordnung: "The Bohemian church and constitution remade by imperial patent, the Counter-Reformation imposed from above."
 STATIC_MODIFIER_NAME_nd_dnm_loyal_aristocracy: "Loyal Aristocracy"
 STATIC_MODIFIER_DESC_nd_dnm_loyal_aristocracy: "A new service nobility bound to the crown with the confiscated estates of the White Mountain rebels."
 STATIC_MODIFIER_NAME_nd_dnm_indivisible_realm: "Indivisible Realm"
 STATIC_MODIFIER_DESC_nd_dnm_indivisible_realm: "The Pragmatic Sanction ratified crown by crown: the Habsburg lands one legal body, one inheritance, one loyalty."
 STATIC_MODIFIER_NAME_nd_dnm_theresian_machine: "The Theresian Machine"
 STATIC_MODIFIER_DESC_nd_dnm_theresian_machine: "The cameralist reform of Maria Theresa: a unified treasury, the Directorium, the conscription cantons: the composite monarchy run as a single state."
 STATIC_MODIFIER_NAME_nd_dnm_josephine_reach: "The Josephine Reach"
 STATIC_MODIFIER_DESC_nd_dnm_josephine_reach: "The enlightened reach of Joseph II: the Toleranzpatent, a single chancery language, a literate multi-ethnic bureaucracy."

 # ===== ADVANCES =====
 nd_dnm_bella_gerant_alii: "Bella Gerant Alii"
 nd_dnm_bella_gerant_alii_desc: "\"Let others wage war; you, happy Austria, marry.\" Burgundy, Castile, Bohemia and Hungary all came to the House of Habsburg by inheritance and marriage, not conquest. Dynastic diplomacy is the founding instrument of the Danube state."
 nd_dnm_hofkammer: "The Vienna Hofkammer"
 nd_dnm_hofkammer_desc: "The central Court Chamber, founded 1527, pulled the Lower Austrian, Tyrolean, Bohemian and Hungarian treasuries into one hand in Vienna: the first financial spine of the composite monarchy. Unlocks the Hofkammer."
 nd_dnm_hofkriegsrat: "The Hofkriegsrat"
 nd_dnm_hofkriegsrat_desc: "The Court War Council of 1556, the first standing central military administration in Europe: it planned the Ottoman war, built the fortresses and paid the army of three crowns from one office."
 nd_dnm_huszar: "The Hungarian Huszar"
 nd_dnm_huszar_desc: "The light horse of the Hungarian crown, raised against Ottoman akinci raiders and copied by every army in Europe by 1700. Unlocks the Hungarian Huszar levy."
 nd_dnm_danube_staple: "The Danube Staple"
 nd_dnm_danube_staple_desc: "Vienna's medieval Stapelrecht forced every boat on the river to break cargo and trade at the imperial seat: the institution that turned the Danube into a single commercial artery. Unlocks the Donau-Stapel."
 nd_dnm_militaergrenze: "The Militaergrenze"
 nd_dnm_militaergrenze_desc: "The Military Frontier: Serb, Croat and Vlach colonists settled the Sava-Drava line under hereditary tenure for perpetual border service. Unlocks the Frontier district and the Grenzer levy."
 nd_dnm_kleinkrieg: "The Kleinkrieg Doctrine"
 nd_dnm_kleinkrieg_desc: "The small war of the borderland: ambush, raid and skirmish across the broken Danube terrain, the irregular craft that made the Grenzer, hajduks and pandurs feared from the Sava to the Banat."
 nd_dnm_jesuit_colleges: "The Confessional Border"
 nd_dnm_jesuit_colleges_desc: "The Counter-Reformation pressed up the Danube on the back of the Jesuit colleges of Vienna, Graz, Olomouc and Tyrnau, which re-Catholicized and educated the recovered crowns. Unlocks the Jesuit College."
 nd_dnm_donau_flottille: "The Donau-Flottille"
 nd_dnm_donau_flottille_desc: "The imperial Danube war flotilla: the Tschaike galleys that fought the Ottoman river fleet from Komorn to Belgrade. Unlocks the Tschaike levy."
 nd_dnm_renewed_constitution: "The Renewed Constitution"
 nd_dnm_renewed_constitution_desc: "The Verneuerte Landesordnung of 1627: after the White Mountain the Bohemian crown was made hereditary Habsburg, Catholic and German-administered, and the elective monarchy abolished. The composite monarchy's foundational act of centralization."
 nd_dnm_kuerassier: "The Habsburg Kuerassier"
 nd_dnm_kuerassier_desc: "The steel-breasted heavy household cavalry, the decisive shock arm of the Imperial army from Luetzen to the Ottoman field. Unlocks the Kuerassier levy."
 nd_dnm_kaiserliche_armee: "The Standing Imperial Army"
 nd_dnm_kaiserliche_armee_desc: "The kaiserliche Armee: the first permanent multi-national standing army on the continent, paid from the Hofkammer and drilled by the Hofkriegsrat. Unlocks the Imperial Arsenal."
 nd_dnm_erblande_mercantilism: "Erblande Mercantilism"
 nd_dnm_erblande_mercantilism_desc: "The cameralist development of the hereditary lands: the Linz wool manufactory, the Idrija mercury, the Styrian iron of the Erzberg shipped down the Danube to the markets of the realm."
 nd_dnm_pragmatic_sanction: "The Pragmatic Sanction"
 nd_dnm_pragmatic_sanction_desc: "The decree of 1713, ratified crown by crown: the Habsburg lands shall descend indivisibiliter ac inseparabiliter as one body to a single heir. The constitutional spine of the Gesamtmonarchie."
 nd_dnm_theresian_reforms: "The Theresian Reforms"
 nd_dnm_theresian_reforms_desc: "The reform that followed the loss of Silesia: a unified treasury, the Directorium and the conscription cantons turned the composite monarchy into an administrative machine."
 nd_dnm_theresianum: "The Theresianum"
 nd_dnm_theresianum_desc: "The cameral academy founded in Vienna in 1746 to train the multi-ethnic bureaucracy of the Gesamtmonarchie in a single administrative hand and a single chancery language. Unlocks the Theresianum."
 nd_dnm_banat_colonization: "The Banat Colonization"
 nd_dnm_banat_colonization_desc: "The Schwabenzuege: the great resettlement of the reconquered, depopulated Banat and Backa with Danube-Swabian colonists after the Treaty of Passarowitz, restoring a wasted frontier to cultivation."
 nd_dnm_liechtenstein_artillery: "The Liechtenstein Artillery"
 nd_dnm_liechtenstein_artillery_desc: "The artillery reform of Prince Joseph Wenzel of Liechtenstein: a standardized, mobile gun system that made the Imperial train the best-served artillery in Europe. Unlocks the Artillery Train levy."
 nd_dnm_grenzer_line: "The Konzivilisation"
 nd_dnm_grenzer_line_desc: "The regular-line conversion of the Frontier regiments: the Grenzer remade as drilled European infantry, something between light and line, valued in every theatre of the Imperial wars."
 nd_dnm_united_chancellery: "The United Court Chancellery"
 nd_dnm_united_chancellery_desc: "The Vereinigte Hofkanzlei: the attempt to fuse the Austrian and Bohemian chanceries into one administrative organ, the high-water mark of the centralizing project."
 nd_dnm_danube_steam: "Danube Steam Navigation"
 nd_dnm_danube_steam_desc: "The Erste Donau-Dampfschiffahrts-Gesellschaft, the steamship company that turned the river into the spine of a single industrial Danubian economy from Regensburg to the Iron Gates. Unlocks the Danube Steam Yard."

 # ===== UNITS =====
 a_nd_dnm_huszar_levy: "Hungarian Huszar"
 a_nd_dnm_huszar_levy_desc: "The light horse of the Hungarian crown: fast, far-ranging raiders born of the Ottoman border war, plundering and screening at a pace no heavy cavalry could match."
 a_nd_dnm_grenzer_levy: "Grenzer"
 a_nd_dnm_grenzer_levy_desc: "Military Frontier soldier-colonists. Serb, Croat and Vlach borderers, masters of ambush and skirmish on the broken Sava-Drava terrain, fighting light and living off little."
 n_nd_dnm_tschaike_levy: "Tschaike"
 n_nd_dnm_tschaike_levy_desc: "The shallow-draft river galley of the Danube war flotilla, crewed by the Tschaikisten, that fought the Ottoman fleet from Komorn down to Belgrade."
 a_nd_dnm_kuerassier_levy: "Habsburg Kuerassier"
 a_nd_dnm_kuerassier_levy_desc: "The steel-breasted heavy household cavalry, the decisive shock arm of the Imperial army: a charge of armoured nobility delivered at the breaking point of the line."
 a_nd_dnm_artillery_train_levy: "Liechtenstein Artillery Train"
 a_nd_dnm_artillery_train_levy_desc: "The standardized, mobile Imperial gun system of the Liechtenstein reform, the best-served artillery in Europe by the Napoleonic wars."

 # ===== BUILDINGS =====
 nd_dnm_hofkammer_building: "Hofkammer"
 nd_dnm_hofkammer_building_desc: "The central Court Chamber, Vienna 1527: the treasury that pulled the chambers of every crown into one hand. The financial spine of the Gesamtmonarchie."
 nd_dnm_donau_stapel: "Donau-Stapel"
 nd_dnm_donau_stapel_desc: "The Danube staple house, where Vienna's Stapelrecht forced every boat on the river to break cargo and trade, making the river one commercial artery."
 nd_dnm_militaergrenze_building: "Militaergrenze"
 nd_dnm_militaergrenze_building_desc: "A Military Frontier district: soldier-colonist settlements under hereditary land tenure for perpetual border service, the largest militarized society in early modern Europe."
 nd_dnm_jesuit_college: "Jesuit College"
 nd_dnm_jesuit_college_desc: "A college of the Society of Jesus (Vienna, Graz, Olomouc, Tyrnau), the engine of the Counter-Reformation and the school of the recovered crowns."
 nd_dnm_imperial_arsenal: "Imperial Arsenal"
 nd_dnm_imperial_arsenal_desc: "The kaiserliches Zeughaus: the central armoury and foundry of the standing Imperial army, casting the cannon and storing the muskets of three crowns."
 nd_dnm_theresianum_building: "Theresianum"
 nd_dnm_theresianum_building_desc: "The cameral academy of Vienna, 1746, that trained the multi-ethnic bureaucracy of the composite monarchy in a single administrative hand."
 nd_dnm_danube_steam_yard: "Danube Steam Yard"
 nd_dnm_danube_steam_yard_desc: "A works of the Danube Steam Navigation Company, turning the river into the spine of a single industrial Danubian economy from Regensburg to the Iron Gates."

