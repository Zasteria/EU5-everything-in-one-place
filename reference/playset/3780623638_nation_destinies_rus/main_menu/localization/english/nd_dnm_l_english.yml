 # ===== THE REICH QUESTION (2026-08-24) =====
 nd_dnm.1.d.reich: "It is done. The hereditary lands, the Crown of Saint Wenceslas and the Crown of Saint Stephen stand as one realm, and that realm stands within the Holy Roman Empire still: the greatest of the princes, bound by imperial law, with the imperial crown itself within reach of a house that can win the electors. The Diet watches a member grown larger than the Reich around it.\n\nBut a realm of Germans, Czechs, Magyars, Croats, Slovaks and a dozen more is not yet a monarchy. What binds it?\n\n#bold Antemurale Christianitatis#! makes the Danube the shield of Christendom: the Military Frontier, the Grenzer soldier-colonies, the endless Ottoman war that gives every crown a common enemy and a common cause.\n\n#bold Gesamtmonarchie#! makes the Danube one body: the Hofkammer, the Hofkriegsrat, the Pragmatic Sanction welding three chanceries into a single obedient administrative state.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dnm.1.d.no_reich: "It is done. The hereditary lands, the Crown of Saint Wenceslas and the Crown of Saint Stephen stand as one sovereign realm, and there is no Reich left on the map to ask its leave. Austria, Bohemia and Hungary answer to no diet but our own court.\n\nBut a realm of Germans, Czechs, Magyars, Croats, Slovaks and a dozen more is not yet a monarchy. What binds it?\n\n#bold Antemurale Christianitatis#! makes the Danube the shield of Christendom: the Military Frontier, the Grenzer soldier-colonies, the endless Ottoman war that gives every crown a common enemy and a common cause.\n\n#bold Gesamtmonarchie#! makes the Danube one body: the Hofkammer, the Hofkriegsrat, the Pragmatic Sanction welding three chanceries into a single obedient administrative state.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dnm.52.t: "The Reich Question"
 nd_dnm.52.d.emperor: "The three crowns are one realm, and its ruler wears the imperial crown. The Reich has never held a member of this size, and the electors know what it means: an Emperor whose own lands outweigh the Empire he presides over.\n\nTwo roads lie open. Remain, and rule the Reich from the Danube as the House of Habsburg did for three centuries: a kingdom under imperial law, the Pragmatic Sanction at the mercy of the Diet, and the Crown of Saint Stephen resentful of every tie to the Reich. Or lay the crown down, take the Danube out of the Empire, and answer to no diet but our own."
 nd_dnm.52.d.member: "The three crowns are one realm, and that realm is a member of the Holy Roman Empire: larger than any prince, larger than the Emperor.\n\nRemain, and live under imperial law as the greatest of the princes, with the imperial crown within reach of a house that can win the electors. The Diet must then ratify the Pragmatic Sanction, and the Crown of Saint Stephen will resent every tie to the Reich. Or break with the Empire: our imperial lands leave it with the Emperor's claim upon them, we take the rank of empire, and the Reich answers as it can."
 nd_dnm.52.d.outsider: "The three crowns are one realm, and two of them hold lands of the Holy Roman Empire while the realm itself stands outside it.\n\nThe Emperor's court would receive us as a member: the Crown of Saint Stephen would enter the Reich it has always denied, under imperial law, with the Diet to ratify our Sanction. Or we keep the Danube outside the Empire: our imperial lands leave it with the Emperor's claim upon them, we take the rank of empire, and the Reich answers as it can."
 nd_dnm.52.d.barred: "The three crowns are one realm, and two of them hold lands of the Holy Roman Empire while the realm itself stands outside it.\n\nThe Reich will not have us: the electors' faith is not ours, and its gates are closed. So the Danube stays outside the Empire, our imperial lands leave it with the Emperor's claim upon them, we take the rank of empire, and the Reich answers as it can."
 nd_dnm.52.a: "Remain within the Reich"
 nd_dnm.52.b: "Break with the Reich"
 nd_dnm.52.a_tt: "We remain a member of the [GetUniqueInternationalOrganization('hre').GetName], or enter it, under imperial law. Kingdom rank where the Empire's rank rule allows it; the imperial crown may be won. Once upheld, the Pragmatic Sanction needs the Diet's ratification before the crowns are welded. The Crown of Saint Stephen resents the Reich while Hungary stands as a subject crown. We may break with the Reich later, at the same price."
 nd_dnm.52.b_tt: "Every [location|e] we own within the [GetUniqueInternationalOrganization('hre').GetName] leaves it and the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] gains a core on it. We take the rank of empire. The Reaction of the Reich begins. This cannot be undone."
 nd_dnm.53.t: "The Diet Ratifies the Sanction"
 nd_dnm.53.d: "The Imperial Diet has guaranteed the Pragmatic Sanction. What the electors and the estates of the Reich have sealed, no crown of the Danube may dispute: the constituent crowns that stood as juniors and vassals under the Danubian crown pass into the realm, their lands, their estates and their quarrels ours from this day, and every acre of it imperial still."
 nd_dnm.53.a: "Indivisibiliter ac inseparabiliter"
 nd_dnm.53.a_tt: "Every constituent crown that still answers to us is welded into the realm outright (its lands cored and annexed), and its imperial lands remain within the [GetUniqueInternationalOrganization('hre').GetName]"
 nd_dnm.54.t: "The Reich Takes Note of Our Departure"
 nd_dnm.54.d: "The Danubian crown has left the Holy Roman Empire. Whatever the road out, the consequence is the same: our imperial lands go with us and the Emperor's claim goes with them, the rank of empire is ours, and the Reich answers as it can."
 nd_dnm.54.a: "So be it"
 nd_dnm.54.a_tt: "Applied on departure: every imperial [location|e] we own has left the [GetUniqueInternationalOrganization('hre').GetName] with the [GetUniqueInternationalOrganization('hre').GetLeaderTitle]'s core upon it, we hold the rank of empire, and the Reaction of the Reich has begun where it is enabled."
 nd_dnm.55.t: "The Reich Is No More"
 nd_dnm.55.d: "The Holy Roman Empire has ceased to exist, and the Danubian crown that stood within it stands alone. There is no Diet left to ratify anything, no Emperor to petition, and no Reich for the Crown of Saint Stephen to resent. The realm takes the rank its size has long deserved."
 nd_dnm.55.a: "An empire of our own"
 nd_dnm.55.a_tt: "We hold the rank of empire, and the Crown of Saint Stephen's grievance against the Reich ends."
 nd_dnm.21.d.diet: "The inheritance held. What was guaranteed on paper has been guaranteed in blood, and the crowns that stood under the Danubian crown as juniors and vassals would follow the paper into the realm, were the realm its own master. It is not: it is a member of the Holy Roman Empire, and a Sanction that dissolves crowns of the Reich into one needs the Reich's own guarantee. The Diet will want to be asked, and it will want to be paid."
 nd_dnm.21.b: "We lay the Sanction before the Diet ourselves"
 nd_dnm.21.b_tt: "As Emperor we guarantee the Sanction in the Diet at a cost in imperial authority: grants the Indivisibiliter ac Inseparabiliter modifier, and any constituent crown still held as a subject or union junior is welded into the realm outright, its lands imperial still"
 nd_dnm.21.c: "We shall seek the Diet's ratification"
 nd_dnm.21.c_tt: "The crowns stand as they are until the Diet ratifies the Sanction. Petition the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] with #bold Lay the Sanction before the Diet#! in diplomacy: a strong Emperor is less willing, a friendly one more. Breaking with the Reich makes the Sanction our own law at once."
 nd_dnm.21.e: "Let the crowns stand as they are"
 nd_dnm.21.e_tt: "The Sanction holds and the constituent crowns remain subject crowns; they may still be integrated by the ordinary road"
 nd_dnm_compact_of_the_crowns_tt: "#bold The Compact of the Crowns:#! every constituent crown that answers to us (a [subject|e] or our personal-union junior) opens the compact with a lasting good opinion of the Danubian crown, worth [subject_loyalty|e] while it lasts"
 nd_dnm_sanction_own_law_tt: "#bold The Sanction becomes our own law:#! the Diet's ratification is no longer needed, and every constituent crown that answers to us is welded into the realm outright"
 nd_dnm_compact_of_the_crowns: "The Compact of the Crowns"
