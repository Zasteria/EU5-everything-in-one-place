l_english:

 # ===== AI FORMS NATIONS game rule =====
 rule_nd_ai_formables_rule: "AI Forms Nations"
 setting_nd_ai_formables_off: "Off"
 setting_nd_ai_formables_off_desc: "AI countries never actively form nations: the vanilla behavior, where nation formation is effectively player-only."
 setting_nd_ai_formables_opportunistic: "Opportunistic"
 setting_nd_ai_formables_opportunistic_desc: "An AI country that already meets the requirements of a major formable nation will form it: Spain, Russia, Great Britain, Scandinavia, the Mughals, the Danubian Monarchy, Germany, Italy, or the Netherlands. AI war behavior is unchanged. This only lets the AI take what it has already earned."
 setting_nd_ai_formables_ambitious: "Ambitious"
 setting_nd_ai_formables_ambitious_desc: "As Opportunistic, and an AI country meaningfully on the way to Spain, Russia, Great Britain, Scandinavia, or the Mughals will actively favor wars against countries holding the territory it still needs. Creates a harder, more dynamic world."
