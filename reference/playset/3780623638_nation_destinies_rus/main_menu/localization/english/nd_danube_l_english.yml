 nd_dnb_word_tier_3: "Erbverbruederung"
 nd_dnb_sec_causes: "The Causes"
 nd_dnb_cause_union_label: "The Union Cause"
 nd_dnb_cause_liberty_label: "The Old Liberties"
 nd_dnb_cause_explain_tt: "#T The causes#!\nA cause moves when something happens, and only then. The union gains when a house takes a second throne (#Y +25#!), a betrothal is sealed (#Y +8#!), a pact deepens (#Y +4#!), a diet rules for it (#Y +10#!), a court declares for it (#Y +8#!), or the menace reaches the gates (#Y +10#!, once per rise). The liberties gain from foreign kings, broken pledges, and their own declarations. Untended, both causes fade, but the pact web holds the union: from #Y 5#! standing tiers it fades at half speed, from #Y 8#! not at all.\n\n@arrow_bonus_tier_1! At #Y 50#!, a cause sways the courts: pact offers are received #G more warmly#! under the union, #R more coldly#! under the liberties.\n@arrow_bonus_tier_2! The #bold Old Liberties#! at #Y 100#! close the question and the crowns go their separate ways; so does a decade of quiet with both causes dead.\n@arrow_bonus_tier_2! The #bold Union Cause#! at #Y 100#!, or at #Y 60#! with one house on two thrones, calls the #bold Congress of the Danube#!: the crown whose house holds the most thrones is acclaimed, gains the claim on every free rival and raised pacts, and may weld a second crown of its house into a union on the spot.\n@arrow_bonus_tier_2! When one realm holds every surviving crown, the #bold Danubian Monarchy#! is proclaimed."
 nd_dnb_panel_levers_header: "What We Can Do"
 nd_dnb_panel_levers_body: "#T In the diplomacy view of another crown#!\n@arrow_bonus_tier_2! #bold Propose the Erbverbruederung#!: a succession pact. Each accepted offer climbs one step: League, then Betrothal Compact, then the full Erbverbruederung (hereditary brotherhood: if one royal line fails, the other inherits).\n@arrow_bonus_tier_2! #bold Court the Diet#!: gold now, a friendlier hearing for ten years.\n@arrow_bonus_tier_2! #bold Seal the Double Betrothal#!: promise the next succession to each other. It lets us act on a faltering throne one pact step earlier, and a promise broken becomes our claim.\n@arrow_bonus_tier_2! #bold Contest the Foreign Crown#!: the claim against an outside master.\n\n#T On this panel, under the situation's actions#!\n@arrow_bonus_tier_2! #bold Back the Union#! or #bold Stand for the Old Liberties#!: declare our court's side.\n@arrow_bonus_tier_2! #bold Convene the Diet#! while our cause is ahead.\n@arrow_bonus_tier_2! #bold Honor the League#!: join a pact partner's defence against the menace.\n@arrow_bonus_tier_2! #bold Renounce the Question#! once we are dominant.\n\n#T When a throne falters#!\n@arrow_bonus_tier_1! At pact step #Y 3#! (#Y 2#! with a betrothal sealed) and standing #Y 60#!, we may wed the thrones or press the claim.\n@arrow_bonus_tier_1! A broken betrothal pledge is a claim: when a promised succession is crowned away from us, we may press it by war.\n\n#T When the Congress sits#!\n@arrow_bonus_tier_1! If our house already wears a second crown, we may weld the two into one union at once."
 nd_danube.41.t: "The Crowns Are Ours: What Shall We Be?"
 nd_danube.41.d: "It is done. Every crown of the middle Danube now answers to our house, and the question that opened generations ago is closed. What remains is to decide what we have made. Our chancellors want one monarchy: a single court, a single army, one seal from the Alps to the Carpathians, with the imperial dignity given up to pay for it. The older heads would leave the crowns as they stand, each with its own diet and its own laws, joined only in our person..."
 nd_danube.41.a: "Let it be one monarchy."
 nd_danube.41.b: "Let each crown keep its own diet."
 nd_danube.41.a_tt: "Found the Danubian Monarchy now: we leave the Empire, take imperial rank, and the crowns become one realm"
 nd_danube.41.b_tt: "The crowns stay separate realms under our house. We may found the Monarchy later from the formation panel"

 # ===== v2 respine (2026-08-10): the houses, the grievances, the weld =====
 nd_dnb_sec_houses: "The Houses on the Thrones"
 nd_dnb_word_house_one: "One house, two crowns"
 nd_dnb_word_house_two: "Separate houses"
 nd_dnb_word_foreign_house: "A foreign house wears this crown"
 nd_dnb_grievance_swallow_tt: "The Old Liberties gain #Y +10#!: a broken pledge is one more argument that each crown should keep its own king"
 nd_danube.42.t: "Vienna Crowns Another"
 nd_danube.42.d: "The double betrothal pledged Austria's next succession to our house, and Vienna has crowned another instead. The pledge lies broken on the chancery floor. Our envoys ask for the promised crown; the Viennese answer that God, not parchment, makes kings. The parchment remains in our archive all the same, sealed and witnessed, and half the courts of Christendom know what it says..."
 nd_danube.42.a: "The betrothal was a treaty. Press the claim."
 nd_danube.42.b: "Swallow the slight."
 nd_danube.43.t: "Buda Crowns Another"
 nd_danube.43.d: "The double betrothal pledged Hungary's next succession to our house, and the diet at Buda has raised another to the throne instead. The magnates say a dead king's promise does not bind a living kingdom. Our chancery holds the sealed instrument that says otherwise, and every court on the river is watching to see whether parchment or election carries the day..."
 nd_danube.43.a: "The betrothal was a treaty. Press the claim."
 nd_danube.43.b: "Swallow the slight."
 nd_danube.44.t: "Prague Crowns Another"
 nd_danube.44.d: "The double betrothal pledged Bohemia's next succession to our house, and the estates at Prague have crowned another instead. The Bohemian crown is elective, their spokesmen remind us, and no betrothal outweighs the estates' voice. The instrument in our archive was sealed in better faith than that, and the question it raises will not stay quiet..."
 nd_danube.44.a: "The betrothal was a treaty. Press the claim."
 nd_danube.44.b: "Swallow the slight."
 nd_danube.45.t: "A Foreign Crown on the Danube"
 nd_danube.45.d: "The Question of the Danube has closed, and it closes with our crown in an outside house's keeping. The union of the three crowns will not be made by us, nor for us: whatever the river becomes now, it will be reckoned from a foreign court. The diets keep their laws and their grievances, and wait on another succession..."
 nd_danube.45.a: "So it stands."
 nd_danube.46.t: "One House over Vienna and Buda"
 nd_danube.46.d: "By marriage, by election, or by death, the same house now wears the crowns of Austria and Hungary. What the pacts spoke of in parchment, the family tree has done in flesh. All along the river the chancelleries redraw their reckonings: the union has a candidate now, whether the diets bless it or not..."
 nd_danube.46.a: "The river bends."
 nd_danube.47.t: "One House over Vienna and Prague"
 nd_danube.47.d: "By marriage, by election, or by death, the same house now wears the crowns of Austria and Bohemia. What the pacts spoke of in parchment, the family tree has done in flesh. All along the river the chancelleries redraw their reckonings: the union has a candidate now, whether the diets bless it or not..."
 nd_danube.47.a: "The river bends."
 nd_danube.48.t: "One House over Buda and Prague"
 nd_danube.48.d: "By marriage, by election, or by death, the same house now wears the crowns of Hungary and Bohemia. What the pacts spoke of in parchment, the family tree has done in flesh. All along the river the chancelleries redraw their reckonings: the union has a candidate now, whether the diets bless it or not..."
 nd_danube.48.a: "The river bends."
 nd_danube.49.t: "The Congress of the Danube"
 nd_danube.49.d: "The Congress has met, and it acclaims us protector of the union. The claims on the free crowns are ours, and the pacts stand raised in our favor. The delegates go further still: if our own house already wears a second of the river's crowns, they would see the two welded into one monarchy now, diets, armies and seals joined under our person. It is a larger step than an acclamation, and it cannot be quietly unmade. And the delegates say one thing more, quietly: an acclamation is not yet a union. If the Old Liberties carry the diets before the crowns are gathered, the question will close against us, claims and all..."
 nd_danube.49.a: "Weld the crowns into one monarchy."
 nd_danube.49.b: "The claims suffice. Let the acclamation stand."
 nd_danube.49.b_tt: "We keep the claims and the raised pacts; the crowns remain separate realms"
