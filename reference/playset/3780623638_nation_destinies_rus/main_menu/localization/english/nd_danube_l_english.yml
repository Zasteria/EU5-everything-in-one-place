 # ===== v2 panel presentation (2026-08-10) =====
 nd_dnb_menace_meter_tt: "#T Menace at the Gates#!\nHow hard an outside power presses the three crowns. Empty is calm. Full means a great power is at war with a crown.\n\n@arrow_bonus_tier_1! Rising to #Y 2#! gives the Union Cause #Y +10#!, once per rise.\n@arrow_bonus_tier_1! At #Y 2#! or more, succession pacts no longer need a royal marriage first.\n@arrow_bonus_tier_1! The higher it stands, the readier every court is to accept pacts and betrothals."
 nd_dnb_deeds_hint: "Deeds move the causes. Waiting does not. Hover a bar to see what counts."
 nd_dnb_threshold_60_tt: "The mark at #Y 60#!: the Congress convenes here if one house wears two crowns. At #Y 100#! it convenes regardless."
 nd_dnb_web_tt: "Total pact tiers standing across the three pairs (the web). From #Y 5#! the Union Cause fades at half speed; from #Y 8#! it stops fading."
 nd_dnb_tier_ladder_tt: "#T The pact ladder#!\nOffered as #bold Propose the Erbverbruederung#! in the diplomacy view of the other crown. Each accepted offer climbs one step:\n@arrow_bonus_tier_2! #Y 1#! League: we may join their defensive wars, and their faltering successions concern us.\n@arrow_bonus_tier_2! #Y 2#! Betrothal Compact: we may seal the Double Betrothal with them.\n@arrow_bonus_tier_2! #Y 3#! Erbverbruederung, hereditary brotherhood: if one royal line fails, the other inherits. A faltering succession there is ours to act on."
 nd_danube.50.t: "Vienna and Buda Draw Closer"
 nd_danube.50.d: "Word arrives that the courts of Austria and Hungary have deepened their succession compact: new parchment, new seals, and lawyers speaking warmly of shared inheritance. Every step those two take toward one another is a step the river takes toward one house, and that house is not ours..."
 nd_danube.50.a: "Watch the seals."
 nd_danube.50.a_tt: "The Union Cause advances with every deepened bond between the other crowns"
 nd_danube.51.t: "Vienna and Prague Draw Closer"
 nd_danube.51.d: "Word arrives that the courts of Austria and Bohemia have deepened their succession compact: new parchment, new seals, and lawyers speaking warmly of shared inheritance. Every step those two take toward one another is a step the river takes toward one house, and that house is not ours..."
 nd_danube.51.a: "Watch the seals."
 nd_danube.51.a_tt: "The Union Cause advances with every deepened bond between the other crowns"
