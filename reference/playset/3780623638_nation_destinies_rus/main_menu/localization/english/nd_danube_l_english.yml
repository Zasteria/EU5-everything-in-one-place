 nd_danube.52.a_tt: "The Union Cause advances with every deepened bond between the other crowns"
 nd_danube.53.t: "The Menace Reaches the Gates"
 nd_danube.53.d: "The power beyond the marches now overshadows the crowns of the Danube in earnest. In all three capitals the argument for union turns sharp and practical: proud courts that demanded a wedding before any pact will now sign for safety's sake alone, and the diets listen differently when the horizon smokes..."
 nd_danube.53.a: "The river must answer."
 nd_danube.53.a_tt: "The Union Cause gains #Y +10#!, and while the menace stands at #Y 2#! or more, succession pacts no longer require a royal marriage first"
