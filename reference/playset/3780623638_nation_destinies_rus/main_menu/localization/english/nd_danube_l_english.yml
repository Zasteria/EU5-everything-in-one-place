l_english:

 # ===== THE SUCCESSION OF THE DANUBE: situation surface =====
 nd_danube_succession: "The Succession of the Danube"
 nd_danube_succession_desc: "Three crowns share one river. In Vienna, Buda and Prague the same handful of houses marry, sign pacts of mutual inheritance, and wait on each other's childless kings. Every succession that falters in one capital is weighed in the other two, and the Ottomans are coming up the river while the question stands open..."
 nd_dnb_situation_tt: "Three dynasties contest whether the Danube will answer to one house"
 nd_dnb_standing_explain_tt: "#T Where standing comes from (recalculated monthly)#!\n@arrow_bonus_tier_1! #G +20#! base, #G +20#! for the strongest crown by military strength (#G +10#! for the second)\n@arrow_bonus_tier_1! #G +5#! per royal marriage with another crown, #G +10#! for a shared ruling dynasty\n@arrow_bonus_tier_1! #G +5#! per pact tier, #G +5#! per courted diet, #G +10#! per Double Betrothal\n@arrow_bonus_tier_1! #G +10#! per rival crown capital we hold, #R -20#! if a rival holds ours\n@arrow_bonus_tier_1! #G +15#! per crown already in our fold, #R -25#! while under a foreign master"
 nd_dnb_end_fulfilled_tt: "One realm holds every surviving crown of the Danube, as subject or union junior (founding the Danubian Monarchy also counts). The road there is the #bold Congress of the Danube#!: it convenes when the Union Cause reaches #Y 100#!, or #Y 60#! with one house on two thrones. The Congress acclaims the crown whose house holds the most thrones, hands it the claim on every free rival, and lets it weld a second crown of its own house into a union on the spot"
 nd_dnb_end_sword_tt: "At most one of the three crowns still exists"
 nd_dnb_end_separate_tt: "The Old Liberties have reached #Y 100#! (currently: #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_cause_liberty').GetValue|0]#!), a dominant crown has renounced the question, or ten quiet years have passed with both causes dead and no house on two thrones. This door stays open even after a Congress: an acclamation that never becomes union dies with the question"
 nd_dnb_end_epoch_tt: "#Y 160#! years have passed since the question opened (about #Y [GetSituationByKey('nd_danube_succession').MakeScope.GetVariable('nd_dnb_epoch_years_left').GetValue|0]#! remain)"
 nd_dnb_legend_hab: "The Austrian candidacy"
 nd_dnb_legend_hun: "The Hungarian candidacy"
 nd_dnb_legend_boh: "The Bohemian candidacy"
 nd_dnb_legend_bound: "A bound crown (merged into a rival, or under an outside master)"
 nd_danube_succession_situation_header: "The Question of the Danube"
 nd_danube_succession_situation_body: "Three crowns, one river, one inheritance in dispute.\n\n@arrow_bonus_tier_1! The causes move when something happens: a betrothal sealed, a pact deepened, a diet's verdict, a declared stance, and above all a succession that seats one house on a second throne.\n@arrow_bonus_tier_1! Left untended, both causes fade, and a long quiet closes the question for good.\n@arrow_bonus_tier_1! The Union Cause at #Y 100#!, or at #Y 60#! once one house wears two crowns, calls the Congress of the Danube.\n@arrow_bonus_tier_1! Standing is the weight behind all of it. Hover a standing to see where it comes from."

 # ===== hints =====
 hint_nd_danube_succession: "[GetSituationByKey('nd_danube_succession').GetNameWithNoTooltip] Hints"
 hint_nd_danube_succession_hint_text: "$hint_nd_danube_succession_hint_text_1$\n\n$hint_nd_danube_succession_hint_text_2$"
 hint_nd_danube_succession_hint_text_1: "The question opens when the dynastic web first tightens: a signed pact, a shared ruling house, a faltering succession under a royal marriage, or at the latest the era of foreign inheritances after 1437. This is the road into the Danubian Monarchy. Win it and the crowns we need for that formable country come to us without conquest."
 hint_nd_danube_succession_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Aim our marriages at thrones: the question is decided by whose house wears a second crown. A betrothal that comes due seats our house there, and a Congress called with our house on two thrones lets us weld them into one union on the spot.\n@arrow_bonus_tier_3! Declare for the union whenever we mean to rule all three: the declaration itself feeds the cause, the diet weighs our standing behind it, and if every free crown has declared for it when the Congress is called, it becomes an election: the crowns join us without war, and only a crown that refuses is left open to our claim.\n@arrow_bonus_tier_2! Marry into the other crowns, then #bold Propose the Erbverbruederung#! (in the diplomacy view of the other crown) until the pact reaches tier #Y 3#! (or tier #Y 2#! with a #bold Double Betrothal#!).\n@arrow_bonus_tier_2! Keep our standing at #Y 60#! or above. Military strength, royal marriages, courted diets and holding a rival's capital all raise it.\n@arrow_bonus_tier_2! Watch for a partner crown to falter, through a regency, a missing heir, a child on the throne or collapsed legitimacy. That is when we may wed the thrones or press the [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e], and one won war installs our claimant.\n@arrow_bonus_tier_2! If Poland or another outsider takes a crown into union, #bold Contest the Foreign Crown#! gives every free crown the claim against them.\n@arrow_bonus_tier_1! To walk away instead, back the #bold Old Liberties#! until they reach #Y 100#!, or renounce the question outright once we are dominant."

 # ===== interactions: Propose the Erbverbruederung =====
 nd_dnb_propose_the_pact: "Propose the Erbverbruederung"
 nd_dnb_propose_the_pact_desc: "Offer a mutual succession pact between the two houses, as Rudolf and Charles signed in 1364 and Frederick and Corvinus in 1463: if one line fails, the other inherits. Each acceptance deepens the pact one tier, from league to betrothal compact to the full Erbverbruederung. Pacts ride royal marriages; danger at the gates makes brothers of proud crowns."
 dip_nd_dnb_propose_the_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 nd_dnb_propose_the_pact_act: "Propose a succession pact to [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_propose_the_pact_effect_text: "The pact between the two crowns deepens one tier (sealed a few days hence)."
 nd_dnb_propose_the_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] sealed a succession pact with [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_propose_the_pact_reject_effect_text: "$generic_reject_request_effect_string$"
 nd_dnb_propose_the_pact_reject_effect_text_past: "$generic_reject_request_effect_string_past$"
 PROPOSE_nd_dnb_propose_the_pact: "Bind our succession to $ACTOR$'s house?\n\n$INFO$"
 INCOMING_OFFER_TITLE_nd_dnb_propose_the_pact: "An Offer of Hereditary Brotherhood"
 INCOMING_OFFER_nd_dnb_propose_the_pact: "$ACTOR$ propose an Erbverbruederung: if either line fails, the other house inherits. Do we bind our crowns?\n\n$INFO$"
 nd_dnb_pact_rm_req_tt: "A royal marriage binds the two crowns, or the menace stands at the gates (pacts ride marriages, as the real ones did; danger makes brothers of proud crowns, as at the 1463 Erbverbruederung)"
 nd_dnb_pact_year_req_tt: "The year is 1360 or later (the chancelleries take up hereditary brotherhood in the era of the 1364 pact)"
 nd_dnb_pact_tier_cap_tt: "This pair's pact is below tier 3 (the full Erbverbruederung is the ceiling)"
 nd_dnb_pact_rejected_tt: "The refusal is public; the court will remember the mockery"

 # ===== interactions: Court the Diet =====
 nd_dnb_court_the_diet: "Court the Diet"
 nd_dnb_court_the_diet_desc: "A year's revenue into the other crown's magnate halls. Corvinus bought his election the same way. For ten years their diet remembers the gold: our standing rises, and our next offer of a pact is heard on friendlier benches."
 dip_nd_dnb_court_the_diet_CATEGORY: "CATEGORY_INFLUENCE_ACTIONS"
 nd_dnb_court_the_diet_act: "Court the diet of [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_court_the_diet_effect_text: "Their diet is courted for ten years: +5 standing and +15 on pact acceptance."
 nd_dnb_court_the_diet_effect_text_past: "[SCOPE.sCountry('actor').GetName] courted the diet of [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnb_court_the_diet: "Court the diet of $RECIPIENT$ with a year's revenue?\n\n$INFO$"
 nd_dnb_courted_applied_tt: "Their diet is courted for the next ten years (+5 standing, +15 on pact acceptance)"

 # ===== interactions: Seal the Double Betrothal =====
 nd_dnb_seal_double_betrothal: "Seal the Double Betrothal"
 nd_dnb_seal_double_betrothal_desc: "The 1515 Congress of Vienna move: two weddings promised across the two houses at once. For twenty-five years the promise strengthens both houses, and a stumbling succession in either crown may be pressed on the betrothal compact alone, without the full Erbverbruederung."
 dip_nd_dnb_seal_double_betrothal_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 nd_dnb_seal_double_betrothal_act: "Seal a double betrothal with [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_seal_double_betrothal_effect_text: "A double betrothal binds the pair for 25 years (+10 standing each; a stumbling succession may then be pressed on the betrothal compact alone)."
 nd_dnb_seal_double_betrothal_effect_text_past: "[SCOPE.sCountry('actor').GetName] sealed a double betrothal with [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_seal_double_betrothal_reject_effect_text: "$generic_reject_request_effect_string$"
 nd_dnb_seal_double_betrothal_reject_effect_text_past: "$generic_reject_request_effect_string_past$"
 PROPOSE_nd_dnb_seal_double_betrothal: "Promise our children to $ACTOR$'s house?\n\n$INFO$"
 INCOMING_OFFER_TITLE_nd_dnb_seal_double_betrothal: "A Double Betrothal"
 INCOMING_OFFER_nd_dnb_seal_double_betrothal: "$ACTOR$ propose a double betrothal across the two houses, in the manner of the Congress of Vienna. Do we promise the children?\n\n$INFO$"
 nd_dnb_betrothal_tier_req_tt: "The pair's pact stands at betrothal-compact tier or higher (tier 2+)"
 nd_dnb_betrothal_applied_tt: "The Double Betrothal binds the two houses for 25 years"

 # ===== interactions: Contest the Foreign Crown =====
 nd_dnb_contest_foreign_crown: "Contest the Foreign Crown"
 nd_dnb_contest_foreign_crown_desc: "A crown of the Danube sits junior under an outside master. Invoke the pact tradition against the foreign arrangement: every free crown receives the claim on the captive throne. The war that follows is with the master, and it can be fought together."
 dip_nd_dnb_contest_foreign_crown_CATEGORY: "CATEGORY_HOSTILE_ACTIONS"
 nd_dnb_contest_foreign_crown_act: "Contest the foreign crown over [SCOPE.sCountry('recipient').GetName]."
 nd_dnb_contest_foreign_crown_effect_text: "Every free crown of the Danube gains the [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] on the captive crown."
 nd_dnb_contest_foreign_crown_effect_text_past: "[SCOPE.sCountry('actor').GetName] contested the foreign crown over [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_nd_dnb_contest_foreign_crown: "Invoke the pact tradition against the foreign master of $RECIPIENT$?\n\n$INFO$"

 # ===== accept-reason lines =====
 ND_DNB_ACCEPT_BASE: "Base reluctance of a sovereign court"
 ND_DNB_ACCEPT_MENACE: "Menace at the gates makes brothers"
 ND_DNB_ACCEPT_WEAK: "Our own succession wobbles"
 ND_DNB_ACCEPT_COURTED: "Their gold still glitters in our diet"
 ND_DNB_ACCEPT_UNION_POSTURE: "Our diet has declared for the union cause"
 ND_DNB_ACCEPT_INDEPENDENCE_POSTURE: "Our diet has declared for the old liberties"
 ND_DNB_ACCEPT_PROUD_CROWN: "A stronger house in a calm world reads as a master, not a brother"
 ND_DNB_ACCEPT_ZEITGEIST_UNION: "The mood of the courts favours the union"
 ND_DNB_ACCEPT_ZEITGEIST_LIBERTY: "The old liberties carry the chanceries"

 # ===== generic actions =====
 nd_dnb_convene_the_diet: "Convene the Diet of the Three Crowns"
 nd_dnb_convene_the_diet_desc: "Summon the diets ahead of their decade. The assembled benches weigh the declared crowns by standing and give the leading cause a push, so it is worth calling them while our own cause is ahead."
 nd_dnb_back_the_union: "Back the Union Cause"
 nd_dnb_back_the_union_desc: "Declare our court for one house over the river. While declared, our standing feeds the Union Cause each month."
 nd_dnb_stand_for_liberties: "Stand for the Old Liberties"
 nd_dnb_stand_for_liberties_desc: "Declare our court for the old liberties: every crown its own. While declared, our standing feeds the Old Liberties each month."
 nd_dnb_honor_the_league: "Honor the League"
 nd_dnb_honor_the_league_desc: "The pact's other face: when the Ottomans make war on a pact partner, the league may ride to the defense. Whatever the diets say of union, the crowns do not watch each other drown."
 nd_dnb_league_peace_tt: "Our crown is at peace"
 nd_dnb_league_no_wars: "@trigger_no! No pact partner is defending against the Ottomans"
 nd_dnb_stance_ready_tt: "Our court has not changed its stance in the last 3 years"
 nd_dnb_not_already_union_tt: "Our court does not already back the Union Cause"
 nd_dnb_not_already_liberty_tt: "Our court does not already stand for the Old Liberties"
 nd_dnb_stance_union_applied_tt: "Our court backs the Union Cause (changeable again in 3 years)"
 nd_dnb_stance_liberty_applied_tt: "Our court stands for the Old Liberties (changeable again in 3 years)"
 nd_dnb_convene_ready_tt: "Our court has not forced an early diet in the last 5 years"
 nd_dnb_convene_global_tt: "No diet of the crowns has convened anywhere in the last 5 years"
 nd_dnb_convene_applied_tt: "The crowns are summoned; the next regular diet is ten years out"
 nd_dnb_renounce_the_question: "Renounce the Question"
 nd_dnb_renounce_the_question_desc: "Close the book on the union of the crowns from a position of dominance: nothing is left to court. Each crown keeps its own house, proud; pacts are barred for a generation."
 nd_dnb_renounce_req_tt: "Our standing is #Y 60#! or above while both rivals sit at #Y 40#! or below"
 nd_dnb_renounce_applied_tt: "The Separate Ways are chosen: the situation ends with each crown its own"

 # ===== events =====
 nd_danube.1.t: "The Question of the Danube"
 nd_danube.1.d: "It begins, as these things do, with parchment and a wedding ring. The houses of the middle Danube have started to speak of inheritance across each other's borders: pacts of hereditary brotherhood, betrothals arranged in double pairs, lawyers who can argue a crown into a dowry. Vienna, Buda and Prague each see the same truth from three thrones: one river, three crowns, and sooner or later, one question.\n\nOur court must decide what face to show the diets. The pacts themselves are offered in the diplomacy view of the other crowns; our declarations and the diet are made from the situation panel."
 nd_danube.1.a: "Pursue the union of the crowns."
 nd_danube.1.b: "Our crown stands alone."
 nd_danube.1.c: "Let the courts speak first."
 nd_danube.10.t: "The Diet of the Three Crowns"
 nd_danube.10.d.union: "The estates of the Danube crowns have convened, counted their benches, and the union party carried the hall. The cause of one house gains ground."
 nd_danube.10.d.liberty: "The estates of the Danube crowns have convened, counted their benches, and the old liberties carried the hall. The cause of separate crowns gains ground."
 nd_danube.10.d.hung: "The estates of the Danube crowns have convened and adjourned without a verdict: the benches were too evenly split, or too empty, for either cause to carry."
 nd_danube.10.a: "The diet has spoken."
 nd_danube.11.t: "The Pact Is Sealed"
 nd_danube.11.d: "The instruments are exchanged and the seals pressed: our house and theirs are bound one degree closer in the order of inheritance. The lawyers call it hereditary brotherhood; the diets call it, depending on the bench, an insurance or a noose. Either way it is now parchment with teeth."
 nd_danube.11.a: "The house is stronger for it."
 nd_danube.12.t: "The Austrian Succession Stumbles"
 nd_danube.12.d: "Word from Vienna: the Austrian throne wobbles. A regency, an empty cradle, a legitimacy questioned in the halls where the Privilegium was forged. Whatever the parchment of our pacts is worth, it is worth the most at exactly this hour: the wedding party stirs in our court, and the lawyers have already unrolled the succession instruments."
 nd_danube.12.a: "Marry the thrones."
 nd_danube.12.b: "Invoke the pact."
 nd_danube.12.c: "The moment passes."
 nd_danube.13.t: "The Hungarian Succession Stumbles"
 nd_danube.13.d: "Word from Buda: the crown of Saint Stephen sits loosely. A regency, an heirless king, a diet already counting votes it has not been asked for. Our pacts with the Hungarian house were signed for precisely this hour, and every court on the river knows it."
 nd_danube.13.a: "Marry the thrones."
 nd_danube.13.b: "Invoke the pact."
 nd_danube.13.c: "The moment passes."
 nd_danube.14.t: "The Bohemian Succession Stumbles"
 nd_danube.14.d: "Word from Prague: the Bohemian succession falters. The electors of the realm of the Golden Bull whisper over an uncertain heir, and the pact instruments in our archive have begun to look less like parchment and more like a road. It runs straight to the Hradschin."
 nd_danube.14.a: "Marry the thrones."
 nd_danube.14.b: "Invoke the pact."
 nd_danube.14.c: "The moment passes."
 nd_danube.15.t: "The Pact Is Invoked Against Us"
 nd_danube.15.d: "A rival court has unrolled the old succession instruments against our stumbling throne and pressed its case: by pact, by marriage, by the arithmetic of inheritance, our crown is claimed. The diet can defy them from the coronation hill, or the council can seek terms quietly and hope the claimant's army is slower than his lawyers."
 nd_danube.15.a: "Defy them from the coronation hill."
 nd_danube.15.b: "Seek terms quietly."
 nd_danube.16.t: "The Case Passes to Us as Well"
 nd_danube.16.d: "The contest of the captive crown has been opened, and by the pact tradition of the river the claim passes to every free house of the Danube: ours included. The foreign master will not hand the crown back for a letter."
 nd_danube.16.a: "We hold the case."
 nd_danube.17.t: "A Foreign Hand on the Austrian Crown"
 nd_danube.17.d: "Austria has passed under a foreign union: an outside master now speaks for one of the three crowns of the river. The question of the Danube was never supposed to be answered from abroad, and every free diet on the river knows what precedent this sets."
 nd_danube.17.a: "Note it, and wait."
 nd_danube.17.b: "This cannot stand."
 nd_danube.18.t: "A Foreign Hand on the Hungarian Crown"
 nd_danube.18.d: "Hungary has passed under a foreign union: the crown of Saint Stephen answers to an outside master now. It has happened before, and the river's courts remember how hard it was to undo."
 nd_danube.18.a: "Note it, and wait."
 nd_danube.18.b: "This cannot stand."
 nd_danube.19.t: "A Foreign Hand on the Bohemian Crown"
 nd_danube.19.d: "Bohemia has passed under a foreign union: an outside master holds the realm of the Golden Bull. The free crowns of the Danube must decide whether the question is still theirs to answer."
 nd_danube.19.a: "Note it, and wait."
 nd_danube.19.b: "This cannot stand."
 nd_danube.31.t: "The Austrian Crown Extinguished"
 nd_danube.31.d: "There is no Austria to court, marry, or outmaneuver any longer: the realm on the upper Danube has passed out of the dynastic world entirely, and whatever power holds Vienna now answers no diet and courts no wedding. The question narrows to the crowns that remain."
 nd_danube.31.a: "Note it, and wait."
 nd_danube.31.b: "Close ranks."
 nd_danube.32.t: "The Hungarian Crown Extinguished"
 nd_danube.32.d: "The crown of Saint Stephen has no bearer left to answer for it: the realm has passed out of the dynastic world entirely, and whatever power holds Buda now answers no diet and courts no wedding. The question narrows to the crowns that remain."
 nd_danube.32.a: "Note it, and wait."
 nd_danube.32.b: "Close ranks."
 nd_danube.33.t: "The Bohemian Crown Extinguished"
 nd_danube.33.d: "The realm of the Golden Bull has passed out of the dynastic world entirely: whatever power holds Prague now answers no diet and courts no wedding. The question narrows to the crowns that remain."
 nd_danube.33.a: "Note it, and wait."
 nd_danube.33.b: "Close ranks."
 nd_danube.34.t: "The Congress Acclaims Austria"
 nd_danube.34.d: "The union cause has triumphed, and the assembled courts have named Austria the standard-bearer of one house over the river. The instruments of the acclamation carry a claim against every crown that stands apart, ours among them. What Vienna calls an honor, our chancellery reads as a summons. The acclamation is not yet the union: if the Old Liberties carry the diets before the crowns are gathered, the question will close against it, and proud crowns keep their own kings."
 nd_danube.34.a: "Note it, and wait."
 nd_danube.34.b: "Our crown is not theirs to claim."
 nd_danube.35.t: "The Congress Acclaims Hungary"
 nd_danube.35.d: "The union cause has triumphed, and the assembled courts have named Hungary the standard-bearer of one house over the river. The instruments of the acclamation carry a claim against every crown that stands apart, ours among them. What Buda calls an honor, our chancellery reads as a summons. The acclamation is not yet the union: if the Old Liberties carry the diets before the crowns are gathered, the question will close against it, and proud crowns keep their own kings."
 nd_danube.35.a: "Note it, and wait."
 nd_danube.35.b: "Our crown is not theirs to claim."
 nd_danube.36.t: "The Congress Acclaims Bohemia"
 nd_danube.36.d: "The union cause has triumphed, and the assembled courts have named Bohemia the standard-bearer of one house over the river. The instruments of the acclamation carry a claim against every crown that stands apart, ours among them. What Prague calls an honor, our chancellery reads as a summons. The acclamation is not yet the union: if the Old Liberties carry the diets before the crowns are gathered, the question will close against it, and proud crowns keep their own kings."
 nd_danube.36.a: "Note it, and wait."
 nd_danube.36.b: "Our crown is not theirs to claim."
 nd_danube.37.t: "The Congress Summons the Crowns"
 nd_danube.37.d: "The union cause has triumphed with every court on the river declared for it, and the assembled diets have named our house the standard-bearer. There will be no claims and no summons to war: the crowns are invited to enter the compact of their own will, as Bohemia's estates once elected a king rather than suffer one. Their answers will come to our chancellery."
 nd_danube.37.a: "Let the diets speak."
 nd_danube.37.a.tt: "Each free crown now chooses: enter the compact under our house, or refuse and face our claim"
 nd_danube.38.t: "The Election of the Danube"
 nd_danube.38.d: "The union cause has triumphed with every court declared for it, and the Congress has acclaimed Austria. The summons asks our crown to enter the compact of its own will: our diet and our laws kept, our banner beside theirs, one house over the river. Refusal tears the acclamation, and the claim will be drawn against us."
 nd_danube.38.a: "Enter the compact."
 nd_danube.38.b: "Our crown is not theirs to claim."
 nd_danube.39.t: "The Election of the Danube"
 nd_danube.39.d: "The union cause has triumphed with every court declared for it, and the Congress has acclaimed Hungary. The summons asks our crown to enter the compact of its own will: our diet and our laws kept, our banner beside theirs, one house over the river. Refusal tears the acclamation, and the claim will be drawn against us."
 nd_danube.39.a: "Enter the compact."
 nd_danube.39.b: "Our crown is not theirs to claim."
 nd_danube.40.t: "The Election of the Danube"
 nd_danube.40.d: "The union cause has triumphed with every court declared for it, and the Congress has acclaimed Bohemia. The summons asks our crown to enter the compact of its own will: our diet and our laws kept, our banner beside theirs, one house over the river. Refusal tears the acclamation, and the claim will be drawn against us."
 nd_danube.40.a: "Enter the compact."
 nd_danube.40.b: "Our crown is not theirs to claim."
 nd_danube.20.t: "One House Over the Danube"
 nd_danube.20.d: "It is done. By marriage, by pact, by patience, and where the parchment ran out by the sword, every crown of the middle Danube now answers to one house. The question that opened generations ago is closed, and the chancelleries of Europe will need new maps..."
 nd_danube.20.a: "One river, one house."
 nd_danube.21.t: "The Question Settled by the Sword"
 nd_danube.21.d: "The question of the Danube is closed, not by wedding or pact, but by extinction: of the three crowns that once shared the river, only one still exists. The lawyers' instruments go to the archive unread. The sword needed no genealogy."
 nd_danube.21.a: "The river remembers."
 nd_danube.22.t: "The Separate Ways"
 nd_danube.22.d: "The diets have spoken twice, the last marriage lapsed, the last pact expired unsigned. The crowns of the Danube have chosen to remain three: proud, distinct, and done with the question. The lawyers seal the archives; the courts, for the first time in a generation, speak of something else."
 nd_danube.22.a: "Each crown its own."
 nd_danube.22.a.tt: "Each surviving crown gains 25 years of $STATIC_MODIFIER_NAME_nd_dnb_proud_crown$ and pacts are barred for 30 years"
 nd_danube.23.t: "The Epoch Adjudicated"
 nd_danube.23.d: "A hundred and sixty years of pacts, weddings, diets and half-drawn swords, and still no single house rules the river. The question closes of its own weight. The chancelleries weigh the three crowns one last time, and ours is found the strongest, so what is left of the claim is ours to press or to shelve..."
 nd_danube.23.a: "The pretensions are ours."
 nd_danube.23.a.tt: "We hold the [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] on each surviving rival crown"
 nd_danube.25.t: "The Fold Closes"
 nd_danube.25.d: "Two crowns of the Danube are one house now: a candidacy has folded into its rival's realm, and the three-sided question has become a duel. The remaining free court should read the new arithmetic carefully: the fold that closed on them can close on us."
 nd_danube.25.a: "The duel begins."
 nd_danube.26.t: "The Congress of the Danube"
 nd_danube.26.d: "The union cause has outgrown the chanceries that nursed it. Diets, marriages and pacts have made one house of the river's ambition, and the assembled courts have named its standard-bearer: ours. What the lawyers call an acclamation, the other crowns will read as a summons."
 nd_danube.26.a: "The river has chosen."
 nd_danube.26.a.tt: "Every pact of our house rises to the betrothal compact, and we hold the claim on every free rival crown"
 nd_danube.26.a_tt: "The acclaimed protector of the union cause presses forward with pacts and claims."
 nd_danube.27.t: "Vienna Declares"
 nd_danube.27.d.union: "The Austrian court has declared for the union cause: its weight now feeds the dream of one house over the river."
 nd_danube.27.d.liberty: "The Austrian court has declared for the old liberties: its weight now holds the crowns apart."
 nd_danube.27.a: "Noted."
 nd_danube.27.a_tt: "Austria's standing feeds its declared cause monthly."
 nd_danube.28.t: "Buda Declares"
 nd_danube.28.d.union: "The Hungarian court has declared for the union cause: its weight now feeds the dream of one house over the river."
 nd_danube.28.d.liberty: "The Hungarian court has declared for the old liberties: its weight now holds the crowns apart."
 nd_danube.28.a: "Noted."
 nd_danube.28.a_tt: "Hungary's standing feeds its declared cause monthly."
 nd_danube.29.t: "Prague Declares"
 nd_danube.29.d.union: "The Bohemian court has declared for the union cause: its weight now feeds the dream of one house over the river."
 nd_danube.29.d.liberty: "The Bohemian court has declared for the old liberties: its weight now holds the crowns apart."
 nd_danube.29.a: "Noted."
 nd_danube.29.a_tt: "Bohemia's standing feeds its declared cause monthly."
 nd_danube.30.t: "Murmurs in the Court"
 nd_danube.30.d: "The union question never quite sleeps. This season it is a genealogist with a convenient chart, a magnate faction drinking to 'one river, one crown', a pamphlet against foreign masters nailed to a church door. Small things; but diets are moved by small things."
 nd_danube.30.a: "Let the marriage party speak."
 nd_danube.30.b: "Silence the union talk."

