l_english:

 # Game Rule
 rule_nd_reich_reaction_rule: "National Destinies Reaction of the Reich"
 setting_nd_reich_reaction_enabled: "Enabled"
 setting_nd_reich_reaction_enabled_desc: "Raising the Danubian Monarchy starts the [ShowSituationName('nd_dnm_reaction_of_the_reich')] [situation|e]. The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] is handed the [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e] against the new realm, which is shunned until the breach is closed by war, by recognition, or by outlasting it."
 setting_nd_reich_reaction_disabled: "Disabled"
 setting_nd_reich_reaction_disabled_desc: "The Empire does not answer. Raising the Danubian Monarchy still takes the realm out of the [GetUniqueInternationalOrganization('hre').GetName] and still raises its [country_rank|e], but no [situation|e] follows. The Danubian [disaster|e] chains, the succession question, and the Pragmatic Sanction are unaffected either way."
