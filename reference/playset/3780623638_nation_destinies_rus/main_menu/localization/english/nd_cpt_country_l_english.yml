l_english:
 CPT: "Coptic Egypt"
 CPT_ADJ: "Coptic"
 CPT_f: "Coptic Egypt"
 CPT_f_desc: "Formed by a Miaphysite state ruling the Nile from Cairo, where Coptic scribes and financiers had kept the revenue registers of Egypt for centuries. The window was narrow and closing: the riot and church demolition waves of 1301 and 1321 were recent memory in 1337, and conversion away from the Coptic church only accelerated afterward. A Coptic Egypt therefore had to be seized during the Mamluk collapse that followed al-Nasir Muhammad's death in 1341, resting on the fiscal bureaucracy, the monasteries of Wadi el-Natrun, the Christian kingdoms of Nubia upriver, and the Delta marshes that had once sheltered the Bashmurite revolts."
