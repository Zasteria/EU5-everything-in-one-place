l_english:
 ### Variable tooltips
 nd_lmb_formed_tt: "Lombardy has been formed"
 nd_lmb_e1_done_tt: "The coronation of Lombardy has already been held"
 nd_lmb_path_a_tt: "Chose the #bold Iron Crown#! destiny"
 nd_lmb_path_b_tt: "Chose the #bold Ambrosian Commune#! destiny"

 ### Formation event
 nd_lmb.1.t: "The Kingdom of the Lombards"
 nd_lmb.1.d: "In the basilica at Monza the Corona Ferrea is lifted from Theodolinda's treasury: a band of gold and gems closed, so the canons swear, around a nail of the True Cross. Since the days of the Lombard kings, whoever would rule Italy has knelt for this crown at Pavia or Monza; Frederick Barbarossa wore it, and it broke against the Carroccio at Legnano all the same. Now the cities of the plain answer to one lord again, from the armouries of Milan to the rice water of the Lomellina.\n\nBut two memories contend for this kingdom. The Visconti built a state above the communes: chancery, castle and crown, a duchy that dealt with kings as an equal. And against it stands the older oath: Pontida, the League, the commune of Sant'Ambrogio that governed Milan for three years without a duke and called itself golden. A crown of iron, or a republic of saints and citizens: the regnum must choose what it is.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lmb.1.a: "The Iron Crown"
 nd_lmb.1.a_tt: "The Visconti road. Royal legitimacy, crown authority over the communes, a disciplined ducal army and dynastic standing abroad. The realm centralizes."
 nd_lmb.1.b: "The Ambrosian Commune"
 nd_lmb.1.b_tt: "The road of the League. Civic taxation, communal levies, contented burghers and the building energy of free cities. The burghers rise."

 ### Peace of Lodi event
 nd_lmb.2.t: "The Peace of Lodi"
 nd_lmb.2.d: "In April 1454, in the small Lombard town of Lodi, exhausted envoys set their seals to a peace that ended decades of war between Milan and Venice. Within months it grew into the Italic League: Milan, Venice, Florence, the Pope and Naples bound to keep the peninsula's balance, the first such system Europe had seen. For forty years the peace of Lodi held, and in its shade the peninsula grew rich and brilliant. The question every chancery now debates is what a balance is for: is equilibrium the achievement itself, or merely the quiet in which a prudent state sharpens its sword?"
 nd_lmb.2.a: "Uphold the Italic League"
 nd_lmb.2.a_tt: "The balance is the prize. Warmer relations, war weariness fading, and the toll roads of the plain busy with peaceful trade."
 nd_lmb.2.b: "An armed peace"
 nd_lmb.2.b_tt: "Peace is preparation. Cheaper armies, faster recruitment and quiet eyes in every rival chancery."

 ### Monte di Pieta event
 nd_lmb.3.t: "The Monte di Pieta"
 nd_lmb.3.d: "The word 'Lombard' has meant moneylender from London's Lombard Street to the pawnshops of Bruges: for two centuries the bankers of Milan, Asti and Chieri have carried Lombard credit across Europe, and grown hated for it. Now Franciscan preachers raise a rival from the pulpit: the Monte di Pieta, a charitable bank endowed by the faithful, lending small sums against pledges at little or no interest, so that a poor artisan need not sell his tools to a usurer. Milan's Monte opens in 1483 to the friars' sermons and the bankers' cold fury. The crown must decide whose institution this age belongs to."
 nd_lmb.3.a: "Endow the Monte"
 nd_lmb.3.a_tt: "The friars' bank for the poor. Devotion to the Ambrosian church, calmer streets and families that no longer sell the cradle to pay the lender."
 nd_lmb.3.b: "Shield the banking houses"
 nd_lmb.3.b_tt: "Lombard credit made this realm's name. Cheaper borrowing for the crown, richer trade and merchants who bargain from strength."

 ### Leonardo at the locks event
 nd_lmb.4.t: "The Engineer at the Locks"
 nd_lmb.4.d: "A Florentine engineer in ducal service walks the towpath of the Martesana, sketchbook in hand. Bertola da Novate cut this canal from the Adda in seven years; the Naviglio Grande has watered the plain for two centuries; and where the two systems meet, the levels refuse to agree. The engineer proposes gates hung in pairs, meeting in a shallow V against the current, so that the water itself seals them: a miter lock, drawn in his notebook beside siege engines, bombards and a bronze horse for the duke. The same hand offers the state mastery of water or mastery of war, and the chancery must set him a commission."
 nd_lmb.4.a: "Set him to the waters"
 nd_lmb.4.a_tt: "Locks, basins and towpaths. Faster and cheaper building across the realm, and the plain grows richer every year."
 nd_lmb.4.b: "Set him to the engines of war"
 nd_lmb.4.b_tt: "Bastions surveyed and bombards cast. Sieges pressed harder and artillery served better."

 ### San Carlo plague event
 nd_lmb.5.t: "The Shepherd of the Plague"
 nd_lmb.5.d: "In 1576 the plague enters Milan, and the governor and the great families flee. The archbishop stays. Carlo Borromeo empties his household to feed the quarantined, organizes the parishes into a machinery of relief, and walks barefoot through the dying city with a relic of the Holy Nail, a rope around his neck like a condemned man, offering himself for his people. The lazzaretto fills, the ordinances hold, and Milan learns that a state can fight a pestilence rather than merely endure it. They will call it San Carlo's plague, as if the sickness itself had been conquered by its shepherd."
 nd_lmb.5.a: "The shepherd stays with the flock"
 nd_lmb.5.a_tt: "Recovery organized parish by parish, a people that trusts its church, and steadier government through the crisis."

 ### Stradivari event
 nd_lmb.6.t: "The Workshops of Cremona"
 nd_lmb.6.d: "In a few streets of Cremona, within sound of each other's hammers, the workshops of Amati, Guarneri and Stradivari are perfecting an instrument. Spruce from the alpine valleys, maple, and a varnish whose secret will be argued over for centuries: from these a bottega of a dozen hands produces violins that courts from Madrid to Vienna bid against each other to own. No throne commissioned this supremacy; it grew from a town of luthiers in the Lombard plain, and while the workshops thrive, the name of Cremona is worth an embassy."
 nd_lmb.6.a: "Let the workshops sing"
 nd_lmb.6.a_tt: "Cultural tradition accumulates faster and the name of Cremona carries prestige abroad."

 ### Censimento event
 nd_lmb.7.t: "The Census Completed"
 nd_lmb.7.d: "Begun in 1718 and finished at last in 1760 under Pompeo Neri's direction, the censimento has measured every field, orchard and mulberry row in Lombardy: tens of thousands of maps, each parcel valued, each owner entered in the registers. No state in Europe knows its own land so exactly. The implications are quietly revolutionary: if the register is the only measure, then the palace pays by the same rule as the farm, and the patrician exemptions that have hollowed the treasury for two centuries have no page to hide on. The great families understand this perfectly, which is why they are already at the minister's door."
 nd_lmb.7.a: "One measure for palace and farm"
 nd_lmb.7.a_tt: "Publish the registers and tax by them alone. The treasury fills, the countryside is governed by fact, and the state stands on the census rather than on privilege."
 nd_lmb.7.b: "Accommodate the patriciate"
 nd_lmb.7.b_tt: "Reform gently. The great houses keep their dignities, the crown keeps their loyalty, and the realm keeps its standing among the courts of Europe."

 ### Il Caffe event
 nd_lmb.8.t: "Il Caffe"
 nd_lmb.8.d: "In Milan the brothers Pietro and Alessandro Verri gather economists, jurists and wits around a journal named for the coffee house where such arguments live: Il Caffe. From this circle in 1764 comes a small book by the young Cesare Beccaria, Dei delitti e delle pene, which argues with terrible calm that torture proves nothing and that the gallows degrades the law that raises it. Within a generation it is quoted in Petersburg, Philadelphia and Paris; empresses and republics alike will rewrite their codes against it. A Lombard coffee table has become a tribunal for the penal law of Europe."
 nd_lmb.8.a: "Print every page of it"
 nd_lmb.8.a_tt: "Research quickens and the reforming press feeds the realm's cultural tradition."

 ### Voltaic pile event
 nd_lmb.9.t: "The Voltaic Pile"
 nd_lmb.9.d: "In the physics cabinet at Pavia, Alessandro Volta stacks discs of copper and zinc between brine-soaked cloth and closes the circuit: a steady electric current, the first the world has seen, drawn from a pile of metal on a table. The university that Maria Theresa and Joseph II rebuilt has repaid them with a new force of nature. Volta will demonstrate the pile to Napoleon himself, and the unit of every current that will ever flow will carry a Lombard name."
 nd_lmb.9.a: "A new force of nature"
 nd_lmb.9.a_tt: "Research quickens, institutions spread faster, and Pavia's fame brings prestige."

 ### Timed modifiers: formation
 STATIC_MODIFIER_NAME_nd_lmb_corona_del_regno: "The Iron Crown"
 STATIC_MODIFIER_DESC_nd_lmb_corona_del_regno: "The Corona Ferrea has been taken up in the Visconti manner: a crowned state above the communes, with chancery, castle and standing army."
 STATIC_MODIFIER_NAME_nd_lmb_comune_ambrosiano: "The Ambrosian Commune"
 STATIC_MODIFIER_DESC_nd_lmb_comune_ambrosiano: "The oath of Pontida renewed: the cities of the plain govern themselves under Saint Ambrose, and their militias, purses and building yards answer gladly."

 ### Timed modifiers: advance events
 STATIC_MODIFIER_NAME_nd_lmb_equilibrio_italiano: "The Italian Equilibrium"
 STATIC_MODIFIER_DESC_nd_lmb_equilibrio_italiano: "The Italic League upheld: the balance of Lodi keeps the peninsula's peace and its roads busy."
 STATIC_MODIFIER_NAME_nd_lmb_pace_armata: "An Armed Peace"
 STATIC_MODIFIER_DESC_nd_lmb_pace_armata: "The quiet years of Lodi spent sharpening the sword: cheap armies, fast musters, watchful spies."
 STATIC_MODIFIER_NAME_nd_lmb_carita_francescana: "Franciscan Charity"
 STATIC_MODIFIER_DESC_nd_lmb_carita_francescana: "The Monte di Pieta endowed: credit for the poor, peace in the streets, and the friars preaching gratitude."
 STATIC_MODIFIER_NAME_nd_lmb_piazza_dei_banchi: "The Piazza of the Banks"
 STATIC_MODIFIER_DESC_nd_lmb_piazza_dei_banchi: "The Lombard banking houses shielded: cheap credit for the crown and merchants who lend to half of Europe."
 STATIC_MODIFIER_NAME_nd_lmb_acque_e_conche: "Waters and Locks"
 STATIC_MODIFIER_DESC_nd_lmb_acque_e_conche: "The engineer set to the canals: miter locks, level basins, and a plain that builds and grows."
 STATIC_MODIFIER_NAME_nd_lmb_ingegneria_militare: "Military Engineering"
 STATIC_MODIFIER_DESC_nd_lmb_ingegneria_militare: "The engineer set to war: bastions surveyed, bombards cast, sieges pressed with method."
 STATIC_MODIFIER_NAME_nd_lmb_pastore_della_peste: "The Shepherd of the Plague"
 STATIC_MODIFIER_DESC_nd_lmb_pastore_della_peste: "The archbishop stayed when the governor fled: relief organized parish by parish, and a people that trusts its church."
 STATIC_MODIFIER_NAME_nd_lmb_eta_doro_liutaria: "Golden Age of Lutherie"
 STATIC_MODIFIER_DESC_nd_lmb_eta_doro_liutaria: "The workshops of Cremona at their zenith: every court in Europe bids for a Lombard violin."
 STATIC_MODIFIER_NAME_nd_lmb_catasto_giusto: "The Just Cadastre"
 STATIC_MODIFIER_DESC_nd_lmb_catasto_giusto: "The registers published and enforced: one measure for palace and farm, and a treasury that stands on fact."
 STATIC_MODIFIER_NAME_nd_lmb_patto_coi_patrizi: "Pact with the Patriciate"
 STATIC_MODIFIER_DESC_nd_lmb_patto_coi_patrizi: "The census softened for the great houses: their dignities kept, their loyalty secured, the court's standing enhanced."
 STATIC_MODIFIER_NAME_nd_lmb_lumi_lombardi: "The Lombard Lights"
 STATIC_MODIFIER_DESC_nd_lmb_lumi_lombardi: "Il Caffe in every learned hand: the reforming press of Milan argues, and Europe listens."
 STATIC_MODIFIER_NAME_nd_lmb_pila_di_volta: "The Voltaic Pile"
 STATIC_MODIFIER_DESC_nd_lmb_pila_di_volta: "A steady current from a pile of metal discs: Pavia's laboratory has handed the age a new force."

 ### Advances: age 1
 nd_lmb_lega_lombarda: "The Lombard League"
 nd_lmb_lega_lombarda_desc: "At Pontida the communes swore their oath, and at Legnano in 1176 their militias around the Carroccio broke the army of Frederick Barbarossa. The Peace of Constance sealed the liberties of the Lombard cities."
 nd_lmb_corona_ferrea: "The Iron Crown"
 nd_lmb_corona_ferrea_desc: "The Corona Ferrea of Monza, gold closed around what tradition holds to be a nail of the True Cross. From the Lombard kings to Charles V and Napoleon, whoever would rule Italy sought this crown."
 nd_lmb_rito_ambrosiano: "The Ambrosian Rite"
 nd_lmb_rito_ambrosiano_desc: "Milan keeps the liturgy of Saint Ambrose: its own chant, its own calendar, its own carnival ending days after everyone else's. Popes have tried to Romanize it and failed; the rite is the city."
 nd_lmb_marcite: "The Marcite"
 nd_lmb_marcite_desc: "The Cistercians of Chiaravalle learned to flood meadows with a moving film of spring water, so the grass grew green under winter frost. Cattle fed year round: the foundation of Lombard dairy wealth."
 nd_lmb_armaioli_milanesi: "The Milanese Armourers"
 nd_lmb_armaioli_milanesi_desc: "Around the Via degli Spadari the armourers' guilds of Milan hammered Lombard iron into harness for half of Europe. From these workshops the Missaglia dynasty would rise."
 nd_lmb_maestri_comacini: "The Comacine Masters"
 nd_lmb_maestri_comacini_desc: "The itinerant master builders of the Como lakes, organized in lodges since Lombard times, raised churches, towers and walls across Italy and beyond. To build in stone was a Lombard export."

 ### Advances: age 2
 nd_lmb_armature_da_missaglia: "Missaglia Harness"
 nd_lmb_armature_da_missaglia_desc: "Tommaso and Antonio Missaglia made Milan's white armour the finest in Europe, exported from Spain to Flanders. A man-at-arms in Milanese plate feared neither lance nor bolt."
 nd_lmb_oratori_residenti: "Resident Ambassadors"
 nd_lmb_oratori_residenti_desc: "Francesco Sforza's chancery kept permanent envoys at friendly courts, the first resident embassies in Europe. Milan learned of every scheme in Italy before the schemers had finished dinner."
 nd_lmb_ca_granda: "The Ca' Granda"
 nd_lmb_ca_granda_desc: "In 1456 Francesco Sforza founded the Ospedale Maggiore, merging Milan's scattered hospices into one great house of care with a rational plan by Filarete: civic medicine on a scale Europe had not seen."
 nd_lmb_castello_di_porta_giovia: "The Castle at Porta Giovia"
 nd_lmb_castello_di_porta_giovia_desc: "The Visconti raised a citadel at Porta Giovia and the Sforza rebuilt it grander after the republic tore it down: ducal power in stone, aimed as much at Milan as at Milan's enemies."
 nd_lmb_banchi_lombardi: "The Lombard Banks"
 nd_lmb_banchi_lombardi_desc: "From London's Lombard Street to the fairs of Champagne, 'Lombard' meant lender. At home the Franciscans answered usury with the Monte di Pieta, the charitable bank of 1483."

 ### Advances: age 3
 nd_lmb_navigli: "The Navigli"
 nd_lmb_navigli_desc: "The Naviglio Grande reached Milan in 1272; Bertola da Novate cut the Martesana from the Adda in seven years; Leonardo's miter locks joined the levels. No city in Europe commanded such waters."
 nd_lmb_risaie: "The Rice Estates"
 nd_lmb_risaie_desc: "Under the Sforza, rice took root in the flooded fields of the Lomellina and spread along the canals. The low plain became Europe's rice bowl, and the risaia its signature landscape."
 nd_lmb_pace_di_lodi: "The Peace of Lodi"
 nd_lmb_pace_di_lodi_desc: "In 1454, in a Lombard town, Milan and Venice ended their wars and the Italic League was born: forty years of balance, the first equilibrium system in European diplomacy."
 nd_lmb_archibugiari_bresciani: "The Brescian Gunsmiths"
 nd_lmb_archibugiari_bresciani_desc: "In Gardone Val Trompia the forges turned valley iron into gun barrels; Bartolomeo Beretta's workshop was already casting them in 1526. Brescian barrels armed Venice and half the Mediterranean."
 nd_lmb_cartiere_del_garda: "The Paper Valley of Garda"
 nd_lmb_cartiere_del_garda_desc: "Along the Toscolano gorge, sixty water-driven mills beat linen rags into paper. The valley of the paper mills supplied the presses of Venice, and its merchants sold Lombard paper across Europe."

 ### Advances: age 4
 nd_lmb_riforma_borromaica: "The Borromean Reform"
 nd_lmb_riforma_borromaica_desc: "Carlo Borromeo made Milan the working model of the Counter-Reformation: the seminary of 1564 among the first in Europe, synods, visitations and a clergy that could finally read what it preached."
 nd_lmb_biblioteca_ambrosiana: "The Biblioteca Ambrosiana"
 nd_lmb_biblioteca_ambrosiana_desc: "Federico Borromeo opened his library in 1609 to any reader who could use it, with agents buying manuscripts from Greece to the Levant: one of the first public libraries in Europe."
 nd_lmb_armeria_deuropa: "The Armoury of Europe"
 nd_lmb_armeria_deuropa_desc: "From the Italian Wars to the Thirty Years' War, Milanese and Brescian workshops armed the armies of kings. Whoever held Lombardy held the arsenal of the south."
 nd_lmb_sanita_di_stato: "Sanitation of State"
 nd_lmb_sanita_di_stato_desc: "The Lazzaretto of 1488, the health passes, the plague ordinances of 1576 and 1630: Milan built a public machinery against pestilence that few states matched."

 ### Advances: age 5
 nd_lmb_liutai_di_cremona: "The Luthiers of Cremona"
 nd_lmb_liutai_di_cremona_desc: "Amati taught Guarneri and Stradivari, and a few streets of Cremona set the sound of European music. No instrument since has escaped comparison with theirs."
 nd_lmb_censimento_teresiano: "The Theresian Censimento"
 nd_lmb_censimento_teresiano_desc: "Begun in 1718 and completed in 1760 under Pompeo Neri, the Lombard cadastre measured and valued every parcel of land in the state: the most exact survey in Europe, and the end of taxation by privilege."
 nd_lmb_vigneti_di_valtellina: "The Valtellina Terraces"
 nd_lmb_vigneti_di_valtellina_desc: "On dry-stone terraces above the Adda, mountain vineyards produced wine that crossed the passes to Swiss and Austrian tables: the alpine trade of a landlocked kingdom."
 nd_lmb_ville_di_delizia: "The Ville di Delizia"
 nd_lmb_ville_di_delizia_desc: "The patriciate of Milan built its pleasure villas on the lakes and in the countryside: Villa d'Este at Cernobbio and a hundred kin, splendour rooted in the soil of the estates."

 ### Advances: age 6
 nd_lmb_illuminismo_lombardo: "The Lombard Enlightenment"
 nd_lmb_illuminismo_lombardo_desc: "The Verri brothers' journal Il Caffe and Beccaria's Dei delitti e delle pene made Milan a capital of reform. Europe rewrote its penal codes against a Lombard argument."
 nd_lmb_ateneo_di_pavia: "The Ateneo of Pavia"
 nd_lmb_ateneo_di_pavia_desc: "Founded in 1361 and reborn under Maria Theresa and Joseph II, the University of Pavia housed Spallanzani's experiments and Volta's laboratory: the scientific engine of Lombardy."
 nd_lmb_orto_deuropa: "The Garden of Europe"
 nd_lmb_orto_deuropa_desc: "Travellers agreed that no farmland in the world matched the irrigated Lombard plain: water, rice, wheat and pasture interlocking in a single engineered landscape."
 nd_lmb_regno_ditalia: "The Kingdom of Italy"
 nd_lmb_regno_ditalia_desc: "In the Duomo of Milan in 1805, Napoleon set the Iron Crown on his own head: 'God gave it to me, woe to him who touches it.' Milan was the capital of a Kingdom of Italy once more."

 ### Units
 a_nd_lmb_compagnia_della_morte: "Company of Death"
 a_nd_lmb_compagnia_della_morte_desc: "The sworn guard of the Carroccio in Lombard League tradition: the Company of the Carroccio and the Knights of Death of the chronicles, urban militia oath-bound never to retreat from the standard."
 a_nd_lmb_uomini_darme: "Uomini d'Arme"
 a_nd_lmb_uomini_darme_desc: "Ducal men-at-arms in full Missaglia harness, the finest plate in Europe. Superbly protected and correspondingly slow and costly to field."
 a_nd_lmb_guardia_reale: "Royal Italian Guard"
 a_nd_lmb_guardia_reale_desc: "The guard regiments of the Kingdom of Italy, raised in Milan after the Iron Crown coronation of 1805: elite shock infantry committed where the fire is hottest."

 ### Levies
 levy_nd_lmb_compagnia_della_morte: "Company of Death Levy"
 levy_nd_lmb_compagnia_della_morte_desc: "The communes raise the sworn guard of the Carroccio from their soldiers and burghers."

 ### Buildings
 nd_lmb_tesoro_della_corona: "Treasury of the Iron Crown"
 nd_lmb_tesoro_della_corona_desc: "The chapel-treasury of Monza cathedral, where Theodolinda's basilica keeps the Corona Ferrea. Kings of Italy from the Lombards to Napoleon were crowned with it."
 nd_lmb_marcita: "Marcita"
 nd_lmb_marcita_desc: "A Cistercian water meadow: spring water kept moving over the grass so it grows through winter, feeding cattle the whole year."
 nd_lmb_armeria: "Armeria"
 nd_lmb_armeria_desc: "An armourers' quarter in the Milanese manner, hammering Lombard iron into plate harness for export. The Missaglia workshops armed half of Europe from streets like these."
 nd_lmb_ospedale_maggiore: "Ospedale Maggiore"
 nd_lmb_ospedale_maggiore_desc: "The Ca' Granda: one great civic hospital in place of scattered hospices, in the pattern Francesco Sforza and Filarete set in Milan in 1456."
 nd_lmb_castello_visconteo: "Castello di Porta Giovia"
 nd_lmb_castello_visconteo_desc: "A ducal citadel in the Visconti-Sforza manner: garrison, armoury and the duke's fist over the city that hosts it."
 nd_lmb_monte_di_pieta: "Monte di Pieta"
 nd_lmb_monte_di_pieta_desc: "The Franciscan charitable pawnbank: small loans against pledges at little or no interest, so the poor need not go to the usurer."
 nd_lmb_naviglio: "Naviglio"
 nd_lmb_naviglio_desc: "A navigable canal with locks and towpaths in the Lombard manner, carrying grain, marble and trade while watering the fields it passes."
 nd_lmb_risaia: "Risaia"
 nd_lmb_risaia_desc: "A flooded rice estate of the low plain, fed by the irrigation network that spread rice from the Lomellina across Lombardy."
 nd_lmb_cartiera: "Cartiera"
 nd_lmb_cartiera_desc: "A water-driven paper mill in the Toscolano pattern, beating linen rags into the rag paper that fed the printing presses of Italy."
 nd_lmb_seminario: "Seminario"
 nd_lmb_seminario_desc: "A Tridentine seminary on the Borromean model: the diocese trains its own clergy, and the pulpit finally knows its letters."
 nd_lmb_ambrosiana: "Ambrosiana"
 nd_lmb_ambrosiana_desc: "A public library with its own college of doctors, in the pattern Federico Borromeo set in 1609: open to any reader who can use it."
 nd_lmb_lazzaretto: "Lazzaretto"
 nd_lmb_lazzaretto_desc: "A quarantine hospital outside the walls, with health passes and plague ordinances: the sanitary machinery Milan tested in 1576 and 1630."
 nd_lmb_bottega_liutaia: "Bottega Liutaia"
 nd_lmb_bottega_liutaia_desc: "A luthier workshop in the Cremonese tradition: alpine spruce, maple and a jealously guarded varnish, sold to courts across Europe."
 nd_lmb_villa_di_delizia: "Villa di Delizia"
 nd_lmb_villa_di_delizia_desc: "A patrician pleasure villa on the lakes or among the estates: gardens, galleries and the landlord's presence rooted in the countryside."
 nd_lmb_gabinetto_di_fisica: "Gabinetto di Fisica"
 nd_lmb_gabinetto_di_fisica_desc: "A university physics cabinet in the Pavia pattern: instruments, demonstrations and the laboratory where Volta stacked his pile."

 ### Production methods
 nd_lmb_custodia_della_corona: "Custody of the Crown"
 nd_lmb_custodia_della_corona_desc: "Candles, vestments and the canons' registers: the keeping of the Corona Ferrea and its chapel."
 nd_lmb_gestione_delle_acque: "Management of the Waters"
 nd_lmb_gestione_delle_acque_desc: "Sluices, ditches and winter flooding kept in order by the water masters."
 nd_lmb_pm_armature_bianche: "White Armour"
 nd_lmb_pm_armature_bianche_desc: "Plate harness in the Missaglia manner: Lombard iron, charcoal heat and leather strapping, hammered into export armour."
 nd_lmb_pm_canne_di_gardone: "Barrels of Gardone"
 nd_lmb_pm_canne_di_gardone_desc: "Gun barrels forged and bored in the Val Trompia manner, stocked in walnut and proofed for sale."
 nd_lmb_cura_degli_infermi: "Care of the Sick"
 nd_lmb_cura_degli_infermi_desc: "Medicines, linen and candlelight for the wards of the great hospital."
 nd_lmb_guarnigione_ducale: "Ducal Garrison"
 nd_lmb_guarnigione_ducale_desc: "Arms, masonry and the garrison's wine: the upkeep of the citadel."
 nd_lmb_pegni_e_registri: "Pledges and Registers"
 nd_lmb_pegni_e_registri_desc: "The ledgers of the Monte: pledges taken, redeemed and auctioned under the friars' rule."
 nd_lmb_conche_e_alzaie: "Locks and Towpaths"
 nd_lmb_conche_e_alzaie_desc: "Timber gates, dressed stone and the lockkeepers' tools keep the canal in trade."
 nd_lmb_pm_coltura_del_riso: "Rice Cultivation"
 nd_lmb_pm_coltura_del_riso_desc: "Flooded fields, transplanted seedlings and the timber works of the paddies."
 nd_lmb_pm_carta_di_stracci: "Rag Paper"
 nd_lmb_pm_carta_di_stracci_desc: "Linen rags beaten under water-driven hammers into the white paper of the Toscolano mills."
 nd_lmb_formazione_del_clero: "Formation of the Clergy"
 nd_lmb_formazione_del_clero_desc: "Books, paper and candle wax for the seminarians' long years of study."
 nd_lmb_collegio_dei_dottori: "College of Doctors"
 nd_lmb_collegio_dei_dottori_desc: "The librarians and scholars of the Ambrosiana, buying, copying and cataloguing."
 nd_lmb_quarantena: "Quarantine"
 nd_lmb_quarantena_desc: "Medicines, spirits and timber partitions for the isolation wards of the Lazzaretto."
 nd_lmb_vernice_di_cremona: "Varnish of Cremona"
 nd_lmb_vernice_di_cremona_desc: "Alpine tonewood and the workshop's secret varnish, argued over for centuries."
 nd_lmb_villeggiatura: "Villeggiatura"
 nd_lmb_villeggiatura_desc: "The season in the country: cellars filled and salons furnished for the patrician household."
 nd_lmb_strumenti_scientifici: "Scientific Instruments"
 nd_lmb_strumenti_scientifici_desc: "Brass, glass and copper for the electrometers, condensers and piles of the laboratory."

 ### Destiny advances
 nd_lmb_destiny: "Il Regno Italico"
 nd_lmb_destiny_desc: "The regnum Italicum: the kingdom of the plain that the Corona Ferrea has implied since the Lombard kings. Hold the realm steady and its restoration can begin."
 nd_lmb_dest_eredita_scaligera: "The Scaliger Inheritance"
 nd_lmb_dest_eredita_scaligera_desc: "Break the encirclement of the old wars: take Verona and Parma from the heirs of the della Scala lordship, and keep an army of thirty regiments worthy of a kingdom."
 nd_lmb_dest_conte_di_virtu: "The Count of Virtù"
 nd_lmb_dest_conte_di_virtu_desc: "Follow Gian Galeazzo's road south: bring Bologna and Siena under the Biscione, ring Florence with Lombard garrisons, and hold fifty regiments to keep what is taken."
 nd_lmb_dest_rex_italiae: "Rex Italiae"
 nd_lmb_dest_rex_italiae_desc: "Complete what no Visconti lived to finish: Florence and Rome under the king's peace, an army of seventy five regiments, and prestige worthy of the Iron Crown."
 nd_lmb_dest_credenza: "The Credenza di Sant'Ambrogio"
 nd_lmb_dest_credenza_desc: "Order the commonwealth's finances as the commune once did: embrace the institution of banking and count a thousand ducats of free coin in the common purse."
 nd_lmb_dest_porta_del_mare: "The Gate to the Sea"
 nd_lmb_dest_porta_del_mare_desc: "Give the ledgers a coastline: bring Genoa into the commonwealth's system, put silk on the capital's exchange, and double the common purse to two thousand ducats."
 nd_lmb_dest_repubblica_aurea: "The Golden Republic"
 nd_lmb_dest_repubblica_aurea_desc: "Make the golden name true: a realm of a thousand measures of development, the institution of global trade embraced, and three thousand ducats in the treasury of the commonwealth."

 ### Destiny root event
 nd_lmb.10.t: "The Course of the Regnum"
 nd_lmb.10.d: "The coronation is done, the realm is quiet, and the chanceries of Europe have begun to write the old words again: regnum Italicum, the kingdom of the Lombards, dormant since the emperors let it slip. Whoever holds the Corona Ferrea holds an argument older than any living dynasty: that the plain of the Po is not a province of anyone's empire but a kingdom in its own right, with its own crown, its own rite and its own stubborn cities.\n\nWhat kind of kingdom it is to be, the coronation has already answered. What remains is to make the answer true, league by league and ledger by ledger."
 nd_lmb.10.a: "The regnum sets its course"

 ### Path A stage 1 event
 nd_lmb.11.t: "The Scaliger Inheritance"
 nd_lmb.11.d: "A generation ago the della Scala of Verona held the widest lordship in the plain, and Milan lived hemmed between Scaliger Parma to the south and Scaliger Verona to the east. That ring is broken. From the Adda to the Adige and south across the Po, the cities that once fenced Milan in now march under her banners.\n\nThe men of Verona keep their statutes and their saints; they pay their hearth tax to a Lombard chamber now. Every road out of the plain lies open, and the captains have begun to speak of Tuscany the way merchants speak of a fair."
 nd_lmb.11.a: "From the Adda to the Adige"

 ### Path A stage 2 event
 nd_lmb.12.t: "The Count of Virtù"
 nd_lmb.12.d: "Bologna has opened its gates and Siena has taken the Biscione's protection. The roads into Tuscany and Romagna answer to Lombard garrisons, and Florence wakes to find herself ringed on three sides, her grain roads watched, her bankers writing nervous letters.\n\nIn the castle at Pavia the council weighs two instruments of empire. The jurists point north, to the Empire that still claims to license every crown in Italy: gold paid to an embarrassed King of the Romans buys a diploma that makes conquest lawful and vassalage dignified. The captains point at the map instead: no parchment took Bologna, and a state built by the sword is kept by it."
 nd_lmb.12.a: "Purchase the great diploma"
 nd_lmb.12.b: "No parchment took Bologna"

 ### Path A capstone event
 nd_lmb.13.t: "Rex Italiae"
 nd_lmb.13.d: "Florence keeps the king's peace and Rome has received a Lombard garrison with the honors due a protector. Nothing now stands between the Corona Ferrea and the title it has implied for seven centuries. In Theodolinda's basilica at Monza the canons unlock the treasury, and the court must decide what manner of king walks out of it.\n\nOne counsel is patient: crown and law, the registers carried into every conquered chamber, Italians made subjects rather than tributaries, until the kingdom is a fact no army needs to restate. The other is Roman in the older sense: kingship as command, the peninsula held by the same iron that won it."
 nd_lmb.13.a: "Crown and law at Monza"
 nd_lmb.13.b: "Italy obeys the sword"

 ### Path B stage 1 event
 nd_lmb.14.t: "The Credenza of Sant'Ambrogio"
 nd_lmb.14.d: "The commune's elders have revived an old name: the Credenza di Sant'Ambrogio, the sworn council that once spoke for the popolo against the great families. Its business now is arithmetic. The banking houses have been brought inside the walls of the law, the estimo is assessed by parish and published, and the common purse, counted before witnesses in the sacristy of the basilica, holds more than a thousand ducats of free coin.\n\nNo duke ordered any of this. The cities of the plain have taxed themselves, as the League once did, and found themselves rich."
 nd_lmb.14.a: "The common purse is counted"

 ### Path B stage 2 event
 nd_lmb.15.t: "The Gate to the Sea"
 nd_lmb.15.d: "Genoa has come into the commonwealth's system, and the commune of Saint Ambrose has what every landlocked ledger dreams of: a port. Lombard silk and fustian go down the mountain roads to the Ligurian quays, where the exchange booths quote Milanese cloth in three currencies.\n\nIn the merchant courts two petitions lie side by side. The shipowners ask for keels: a fleet under the commune's flag, so that no Venetian or Catalan convoy can shut the sea road. The bankers ask for fairs: chartered seasons of exchange where bills drawn in Milan settle debts from Bruges to Chios, and the profit of the sea is taken in ink."
 nd_lmb.15.a: "Lay down the keels"
 nd_lmb.15.b: "Charter the exchange fairs"

 ### Path B capstone event
 nd_lmb.16.t: "The Golden Republic"
 nd_lmb.16.d: "They called the republic of 1447 golden for three desperate years; this one has earned the name. Travellers cross the border and write home in disbelief: canals threaded through rice water, schools in market towns, a treasury that publishes its accounts and holds three thousand ducats against the printed page.\n\nThe commonwealth of the Lombard cities is the richest ground in Europe governed by its own citizens, and its council must decide what keeps a golden republic golden. The lawyers offer a constitution: the civic order written down, so that no captain can ever again turn command into a crown. The captains of the gates offer the older answer: walls manned by citizens who own what they defend."
 nd_lmb.16.a: "Write the civic constitution"
 nd_lmb.16.b: "Man the walls with citizens"

 ### Destiny timed modifiers
 STATIC_MODIFIER_NAME_nd_lmb_dest_diploma_ducale: "The Ducal Diploma"
 STATIC_MODIFIER_DESC_nd_lmb_dest_diploma_ducale: "A great title bought with a mountain of florins: conquest made lawful, vassalage made dignified, and the mint quietly asked to cover the price."
 STATIC_MODIFIER_NAME_nd_lmb_dest_spada_del_biscione: "The Sword of the Biscione"
 STATIC_MODIFIER_DESC_nd_lmb_dest_spada_del_biscione: "The state that parchment never built: fast columns, stormed walls, and soldiers who find their courage again overnight."
 STATIC_MODIFIER_NAME_nd_lmb_dest_corona_a_monza: "The Crown at Monza"
 STATIC_MODIFIER_DESC_nd_lmb_dest_corona_a_monza: "Kingship as law: conquered cities entered in the registers, their peoples made subjects, their separatisms starved of grievance."
 STATIC_MODIFIER_NAME_nd_lmb_dest_signore_ditalia: "Lord of Italy"
 STATIC_MODIFIER_DESC_nd_lmb_dest_signore_ditalia: "Kingship as command: siege trains against every recalcitrant wall, garrisons fed and replaced, and a land that devours invaders."
 STATIC_MODIFIER_NAME_nd_lmb_dest_via_del_mare: "The Way of the Sea"
 STATIC_MODIFIER_DESC_nd_lmb_dest_via_del_mare: "Keels on the slips and crews on the rolls: the commune's flag goes to sea and intends to be respected there."
 STATIC_MODIFIER_NAME_nd_lmb_dest_fiere_di_cambio: "The Exchange Fairs"
 STATIC_MODIFIER_DESC_nd_lmb_dest_fiere_di_cambio: "Chartered seasons where bills settle debts from Bruges to Chios: the profit of the sea taken in ink, to the Church's loud discomfort."
 STATIC_MODIFIER_NAME_nd_lmb_dest_costituzione_civica: "The Civic Constitution"
 STATIC_MODIFIER_DESC_nd_lmb_dest_costituzione_civica: "The commonwealth written down: councils that legislate briskly, registers on good Lombard paper, and a citizenry too watchful for complacency."
 STATIC_MODIFIER_NAME_nd_lmb_dest_mura_dei_cittadini: "The Citizen Walls"
 STATIC_MODIFIER_DESC_nd_lmb_dest_mura_dei_cittadini: "The Carroccio's oldest lesson: walls manned by men who own what they defend, garrisons swollen with burghers, and marches that cost the commune little."

 ### Destiny buildings
 nd_lmb_palazzo_reale: "Palazzo Reale"
 nd_lmb_palazzo_reale_desc: "The old court beside the Duomo rebuilt as the seat of a crowned kingdom: throne hall, chancery and the apartments of the Rex Italiae."
 nd_lmb_corte_reale: "The Royal Court"
 nd_lmb_corte_reale_desc: "Paper for the chancery, fine cloth for the household, furniture for the apartments of state."
 nd_lmb_broletto: "Broletto Nuovo"
 nd_lmb_broletto_desc: "The palace of reason on the Piazza dei Mercanti: the bell, the bench and the register, communal government in stone."
 nd_lmb_arengo_del_popolo: "Arengo of the People"
 nd_lmb_arengo_del_popolo_desc: "The assembled commune: paper for the acts, benches for the councils, and tools to keep the bell and the hall in order."

 ### Destiny option tooltips
 nd_lmb.10.a_tt: "The realm stands steady. The first objectives of its destiny are now in reach."
 nd_lmb.11.a_tt: "Verona and Parma obey Milan. The road to Bologna and Siena lies open."
 nd_lmb.12.a_tt: "Lawful title and dignified vassalage: annexation eased, wider diplomacy, and a price the mint must quietly cover."
 nd_lmb.12.b_tt: "The sword keeps what it took: stronger assaults, faster marches and morale that recovers overnight."
 nd_lmb.13.a_tt: "Kingship as law: conquered lands integrate and assimilate faster, and separatism starves."
 nd_lmb.13.b_tt: "Kingship as command: siege guns crack forts, ranks refill cheaply, and the land itself wears down invaders."
 nd_lmb.14.a_tt: "The commune's finances stand ordered. Genoa and the sea road are the next ambition."
 nd_lmb.15.a_tt: "A fleet under the commune's flag: more sailors, faster shipyards and steadier crews."
 nd_lmb.15.b_tt: "The profit of the sea taken in ink: more merchants, richer fine cloth, and a Church that mutters about usury."
 nd_lmb.16.a_tt: "The civic order written down: brisker councils, busier paper mills and a citizenry too watchful for complacency."
 nd_lmb.16.b_tt: "Citizen walls: larger garrisons, harder communal foot and marches that cost the commune little."

 ### BUREAUCRACIES
 lmb_senato_di_milano_bureaucracy: "Senato di Milano"
 lmb_senato_di_milano_bureaucracy_desc: "Louis XII erected the Senate by the ordonnance of Vigevano on 11 November 1499, seventeen members on the model of the parlements of France, and every later master of Milan kept it: Sforza, Spanish and Austrian alike. It judged in last instance, its rulings binding on every lower court, and it registered the sovereign's decrees, refusing those it held contrary to the law of the duchy. A seat on its bench was the summit of a Milanese jurist's career. Joseph II stripped its administrative powers in 1771 and abolished it by edict on 11 February 1786."
 lmb_magistrato_straordinario_bureaucracy: "Magistrato Straordinario"
 lmb_magistrato_straordinario_bureaucracy_desc: "The chamber court of the prince's own patrimony, sitting from 1541 under a president and six questors, three of the toga and three of the cape and sword. It administered fiefs and regalia, confiscations and pecuniary condemnations, vacant inheritances, the royal lakes and rivers, and the licensing of exports of essential goods. Left to rot it becomes what Spanish Milan made of it, a counter selling fiefs and the fiscal immunities that came with them. Maria Theresa's edict of 30 April 1749 folded it into the single Magistrato Camerale."
 lmb_regalia_delle_acque_bureaucracy: "Regalia delle Acque"
 lmb_regalia_delle_acque_bureaucracy_desc: "Running water in the duchy belonged to the prince. From the 1490s the Camera Ducale sold and leased it by the ounce, measured at the bocche where a roggia left the Naviglio, and a concession once bought could be resold or rented on. The Naviglio Grande alone was reckoned at 125,000 ducats a year in Leonardo's time. In 1515 Massimiliano Sforza, needing money against the French, sold the waters, beds and banks of the Grande and the Martesana outright to the city of Milan."
 lmb_tribunale_di_provvisione_bureaucracy: "Tribunale di Provvisione"
 lmb_tribunale_di_provvisione_bureaucracy_desc: "Milan's own magistracy: twelve citizens whose powers the council fixed on 11 April 1280, presided from 1366 by a Vicar of Provision. It ran the annona, buying grain, setting the weight and price of the loaf, keeping the markets, the streets and the city accounts. In 1515 the city won the right to name 150 deputies who elected the vicar and the twelve. The contado paid for the cheap loaf in requisitions at fixed prices, and when the granaries failed the city rioted anyway, as it did at San Martino in November 1628."
 lmb_ufficio_di_sanita_bureaucracy: "Ufficio di Sanità"
 lmb_ufficio_di_sanita_bureaucracy_desc: "Milan registered every death from 1452, each corpse seen by a physician of the health office and reported by the officiali delle bollette in the parishes. The Lazzaretto rose outside Porta Orientale from 1488, 280 rooms around a court almost 400 metres on a side. Francesco II Sforza raised the office to the Magistrato di Sanità on 13 May 1534, and its health passes, sealed houses and cordons answered the plagues of 1576 and 1630. Merchants hated the quarantine and the archbishop's clergy defied the ban on assemblies. Starved of funds the board stops knowing rather than stops policing: 1630 ended in the hunt for the untori."
 lmb_dottrina_cristiana_bureaucracy: "Scuole della Dottrina Cristiana"
 lmb_dottrina_cristiana_bureaucracy_desc: "Castellino da Castello opened a Sunday school at San Giacomo in Porta Nuova in 1536 and taught the children of the poor their catechism together with reading, writing and arithmetic. His Compagnia of 1539 spread the model: fifteen schools when Ormaneto came as vicar general in 1564, twice as many within two years, thirty at Castellino's death. Carlo Borromeo gave the congregation San Dalmazio in 1577 and set the Oblates of Saint Ambrose over it. The Ambrosian church taught Lombardy its letters parish by parish, answering to the archbishop and not to the governor."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_lmb_bureaucracy_authority: "Lombard Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_lmb_bureaucracy_authority: "On formation, [LMB.GetName] may seat the magistracies that governed the Po valley: the sovereign court, the chamber offices of the ducal patrimony, the annona of Milan, the health board and the schools of the Ambrosian church."

