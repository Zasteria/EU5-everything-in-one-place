l_english:
 STATIC_MODIFIER_NAME_nd_sarp_wardens_of_the_passes: "Wardens of the Passes"
 STATIC_MODIFIER_DESC_nd_sarp_wardens_of_the_passes: "Mont Cenis, the Great and the Little St Bernard, and every mule track between them. The crown counts what crosses, feeds armies where nothing grows, and is trusted by nobody."
 STATIC_MODIFIER_NAME_nd_sarp_two_codes_one_crown: "Two Codes, One Crown"
 STATIC_MODIFIER_DESC_nd_sarp_two_codes_one_crown: "The Carta de Logu on the island, the statutes of Savoy on the mainland, and a chancery that can hold both at once. The barons who lose their customary courts do not thank the king for it."
 STATIC_MODIFIER_NAME_nd_sarp_palaiologos_inheritance: "The Palaiologos Inheritance"
 STATIC_MODIFIER_DESC_nd_sarp_palaiologos_inheritance: "Theodore, son of Andronikos II, came west in 1306 and his house held Montferrat for two centuries. The court remembers what it descends from, and spends accordingly."
 STATIC_MODIFIER_NAME_nd_sarp_law_in_the_vulgar_tongue: "Law in the Vulgar Tongue"
 STATIC_MODIFIER_DESC_nd_sarp_law_in_the_vulgar_tongue: "The code is read aloud in Sardinian at every village court, so that the people bound by it can hear what binds them."
 STATIC_MODIFIER_NAME_nd_sarp_oath_of_the_barons: "Oath of the Barons"
 STATIC_MODIFIER_DESC_nd_sarp_oath_of_the_barons: "The feudatari swear to the code in person. They keep their courts and their levies, and the crown keeps their signatures."
 STATIC_MODIFIER_NAME_nd_sarp_edict_enforced: "The Edict Enforced"
 STATIC_MODIFIER_DESC_nd_sarp_edict_enforced: "The valleys are cleared, the churches pulled down, the children baptised. Every Protestant court in Europe hears about it within the month."
 STATIC_MODIFIER_NAME_nd_sarp_cavour_restored: "The Peace of Cavour Restored"
 STATIC_MODIFIER_DESC_nd_sarp_cavour_restored: "The treaty of 1561 is put back in force: freedom of conscience within the marked valleys, and no soldiers above the boundary stones. Rome is not consulted."
 STATIC_MODIFIER_NAME_nd_sarp_galleries_deepened: "The Galleries Deepened"
 STATIC_MODIFIER_DESC_nd_sarp_galleries_deepened: "Two more levels of countermine are cut under the glacis, on the reasoning that a besieger who cannot dig cannot take a citadel."
 STATIC_MODIFIER_NAME_nd_sarp_out_of_the_gates: "Out of the Gates"
 STATIC_MODIFIER_DESC_nd_sarp_out_of_the_gates: "The siege lines are broken and the army does not stop at them. A relieved capital is worth less than a broken enemy."
 STATIC_MODIFIER_NAME_nd_sarp_island_bound_in: "The Island Bound In"
 STATIC_MODIFIER_DESC_nd_sarp_island_bound_in: "Viceroys, courts, surveyors and tax rolls sail for Cagliari. If the crown is to be named for Sardinia, Sardinia will be governed."
 STATIC_MODIFIER_NAME_nd_sarp_sicilian_title_kept: "King of Sicily Still"
 STATIC_MODIFIER_DESC_nd_sarp_sicilian_title_kept: "The exchange is signed and the old style is kept anyway. A claim not renounced is a claim that can be pressed."
 STATIC_MODIFIER_NAME_nd_sarp_fences_go_up: "The Fences Go Up"
 STATIC_MODIFIER_DESC_nd_sarp_fences_go_up: "The commons are measured, fenced and assigned. The graziers prosper. The villages that grazed there discover they own nothing."
 STATIC_MODIFIER_NAME_nd_sarp_commons_defended: "The Commons Defended"
 STATIC_MODIFIER_DESC_nd_sarp_commons_defended: "The ademprivio stands: the right of every village to wood, water and pasture on land no one holds. The improvers are told to buy their own."
 nd_sar_piedmont_e1_done_tt: "The founding of the kingdom has already been marked"
 nd_sar_piedmont.1.a_tt: "The kingdom is built on the passes and on what crosses them."
 nd_sar_piedmont.1.b_tt: "The kingdom is built on two law codes and one registry."
 nd_sar_piedmont.1.c_tt: "The kingdom is built on the descent of the house that raised it."
 nd_sar_piedmont.2.a_tt: "The code is proclaimed in Sardinian at every village court."
 nd_sar_piedmont.2.b_tt: "The feudatari swear to the code and keep their own courts."
 nd_sar_piedmont.3.a_tt: "The valleys are cleared and Protestant Europe is told to mind its business."
 nd_sar_piedmont.3.b_tt: "The treaty of 1561 is restored and the troops are pulled back."
 nd_sar_piedmont.4.a_tt: "Two more levels of countermine are cut under the glacis."
 nd_sar_piedmont.4.b_tt: "The relieving army pursues instead of standing down."
 nd_sar_piedmont.5.a_tt: "Courts, surveyors and tax rolls are sent to govern the island."
 nd_sar_piedmont.5.b_tt: "The Sicilian style is kept and the claim stays open."
 nd_sar_piedmont.6.a_tt: "The commons are surveyed, fenced and registered to those who fenced them."
 nd_sar_piedmont.6.b_tt: "The right of wood, water and pasture is upheld against the surveyors."
 nd_sar_piedmont_formed_tt: "Sardinia-Piedmont has been formed"
 nd_sar_piedmont_path_a_tt: "Chose Wardens of the Passes"
 nd_sar_piedmont_path_b_tt: "Chose Two Codes, One Crown"
 nd_sar_piedmont_path_c_tt: "Chose the Palaiologos Inheritance"
 nd_sar_piedmont.1.t: "A Crown Assembled by Treaty"
 nd_sar_piedmont.1.d: "The kingdom that now exists was never planned. One half is an Alpine duchy that made its living from the doors of Italy, holding Mont Cenis and the two St Bernards and taxing everything that crossed. The other half is an island with its own language, its own law code written by a woman in 1392, and four centuries of practice at outlasting whoever claims to rule it.\n\nNothing joins them but a treaty and a title. The chancery in Turin must now decide what this crown is for.\n\nOne answer is the ground itself: hold the passes, feed armies where nothing grows, and make the kingdom a door that only opens for a price.\n\nThe other is the law: two codes, two peoples, one registry, and courts that answer to the crown rather than to custom.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sar_piedmont.1.d.mfa: "The kingdom that now exists was never planned, and neither was the house that raises it. In 1306 Theodore Palaiologos, son of the Emperor Andronikos II, came west to claim his mother's marquisate of Montferrat, and his line held it until 1533. That road forked once: the family could have carried Constantinople to Italy, kept the Greek rite and the Greek tongue, and made a Byzantine court in the Piedmontese hills. It did not. It heard mass in Latin, married into Savoy, and became Italian.\n\nWhat stands here is the other outcome of that choice. An Alpine duchy that lives off the passes, an island with its own law, a Roman name in the family tree, and a crown that arrived by exchange.\n\nHold the passes. Rule by the codes. Or govern as the purple governed, by descent and by ceremony, and let everyone remember whose blood this is.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sar_piedmont.1.a: "Hold the doors of Italy"
 nd_sar_piedmont.1.b: "Two codes, one registry, one crown"
 nd_sar_piedmont.1.c: "Rule as the purple ruled"
 nd_sar_piedmont.2.t: "The Carta de Logu"
 nd_sar_piedmont.2.d: "Eleanor, Judge of Arborea, has given the island a law. It runs to some one hundred and ninety eight articles and it is written in Sardinian, not Latin, so that shepherds can be read their own rights.\n\nIt sets one penalty for one crime whoever commits it, noble or villager. It gives a widow the right to refuse a second marriage and keep what is hers. It fixes hard punishments for burning a forest or killing another man's stock, on the ground that the island's trees and flocks are not infinite.\n\nIt will be the law of Sardinia for four hundred and thirty five years, which is longer than most of the kingdoms now claiming to own it."
 nd_sar_piedmont.2.a: "Read it aloud in every village"
 nd_sar_piedmont.2.b: "Make the feudatari swear to it"
 nd_sar_piedmont.3.t: "The Piedmontese Easter"
 nd_sar_piedmont.3.d: "In 1561 the Peace of Cavour gave the Waldensians of the high valleys freedom of conscience within marked boundaries. It was the first treaty of its kind in Europe, and it lasted the better part of a century.\n\nThen came the order to leave the lower valleys within three days, in winter, and then the troops. In three days of Easter week 1655 some two thousand people were killed in villages whose names nobody outside the Chisone had heard. The survivors went up into the snow.\n\nThe news reaches London within weeks. Cromwell threatens to intervene, Milton writes a sonnet, and the courts of Protestant Europe want to know what kind of prince does this. The valleys, meanwhile, are still not empty."
 nd_sar_piedmont.3.a: "Finish what the edict began"
 nd_sar_piedmont.3.b: "Put the Peace of Cavour back in force"
 nd_sar_piedmont.4.t: "The Galleries under Turin"
 nd_sar_piedmont.4.d: "For four months in 1706 a French army of forty thousand sat around the capital. Under the citadel runs a lattice of countermine galleries, and the war down there is fought by miners with picks and powder in the dark.\n\nOn the night of 30 August a grenadier party breaks into a lower gallery. A miner named Pietro Micca cannot get the door shut in time and cannot run far enough with a long fuse, so he cuts it short, sends his companion up the stair, and lights it. The gallery holds.\n\nOn 7 September the field army comes down off the hills and the siege breaks. From the ridge at Superga, where the duke swore his vow before the battle, you can see the whole plain."
 nd_sar_piedmont.4.a: "Cut the galleries deeper"
 nd_sar_piedmont.4.b: "March out after them"
 nd_sar_piedmont.5.t: "Sicily for Sardinia"
 nd_sar_piedmont.5.d: "Utrecht gave the duke Sicily and a royal crown in 1713. Seven years later the powers decide, without asking, that Austria should have Sicily and that Sardinia will do instead.\n\nIt is a demotion dressed as an exchange. Sicily is rich, populous and Mediterranean; Sardinia is poor, malarial, and governed by barons who have outlasted three empires. The one thing the island carries is the older royal title, so the crown survives the swap even though almost nothing else does.\n\nVictor Amadeus signs, and then goes on calling himself King of Sicily until 1723, because a title surrendered is harder to recover than a title merely disputed."
 nd_sar_piedmont.5.a: "Take the island seriously"
 nd_sar_piedmont.5.b: "Keep the Sicilian style"
 nd_sar_piedmont.6.t: "The Enclosure Edict"
 nd_sar_piedmont.6.d: "The island has never had private land in the way the mainland understands it. Under the ademprivio every village holds rights of wood, water and pasture over ground that belongs to nobody in particular, and has done since before Aragon arrived.\n\nThe surveyors from Turin call this an obstacle to improvement. The edict of 1820 invites anyone to fence what they use and register it as theirs. Those with capital, stock and a lawyer fence a great deal. Those with only customary rights find that customary rights do not survive a survey.\n\nThe hedges start coming down at night almost immediately, and the resulting lawsuits are still running a century later."
 nd_sar_piedmont.6.a: "Let the fences stand"
 nd_sar_piedmont.6.b: "Defend the ademprivio"
 nd_sar_piedmont_domus_de_logu_tradition: "Courts of the Judgedom"
 nd_sar_piedmont_domus_de_logu_tradition_desc: "Long before any code was written down, the Sardinian judgedoms held their courts in the open air, in Sardinian, with the majore of the village presiding and everyone present entitled to hear the judgement."
 nd_sar_piedmont_tolls_of_the_passes: "Tolls of the Passes"
 nd_sar_piedmont_tolls_of_the_passes_desc: "The counts of Savoy owned poor ground and rich doors. Mont Cenis, the Great and the Little St Bernard carried the silk and salt of Italy northward, and every load paid at the barrier."
 nd_sar_piedmont_barba_of_the_valleys: "The Barba of the Valleys"
 nd_sar_piedmont_barba_of_the_valleys_desc: "Waldensian preachers, called barba after the word for uncle, travelled the Cottian Alps in pairs with scripture copied by hand. Every other medieval heresy in Latin Europe was destroyed. This one was not."
 nd_sar_piedmont_hosts_of_the_giudicati: "Hosts of the Judgedoms"
 nd_sar_piedmont_hosts_of_the_giudicati_desc: "A judgedom could put the whole of its countryside under arms at short notice, which is why an island assigned to Aragon by papal grant in 1297 was still fighting for itself a century later."
 nd_sar_piedmont_carta_de_logu: "The Carta de Logu"
 nd_sar_piedmont_carta_de_logu_desc: "Promulgated by Eleanor of Arborea in 1392 in the Sardinian language, with equal penalties regardless of rank, property rights for widows, and hard protections for forest and livestock. In force until 1827."
 nd_sar_piedmont_brancaleone_war: "Brancaleone's War"
 nd_sar_piedmont_brancaleone_war_desc: "In 1391 Brancaleone Doria took Sassari, Osilo, Villa di Chiesa and Sanluri and left the Aragonese holding two ports. Arborean columns moved and ate on ground their enemies called uninhabitable."
 nd_sar_piedmont_statuta_sabaudiae: "Statuta Sabaudiae"
 nd_sar_piedmont_statuta_sabaudiae_desc: "Amadeus VIII, first Duke of Savoy, gave a scattered inheritance of alpine valleys, Piedmontese plains and the county of Nice one statute in 1430 and a resident council to apply it."
 nd_sar_piedmont_salt_of_cagliari: "The Salt of Cagliari"
 nd_sar_piedmont_salt_of_cagliari_desc: "The saltpans behind Cagliari supplied the western Mediterranean, and the same crown that raised the salt later taxed it again at the alpine barriers on its way to France."
 nd_sar_piedmont_green_count: "The Green Count"
 nd_sar_piedmont_green_count_desc: "Amadeus VI arbitrated between Milan and Venice, and in 1366 took a fleet to Gallipoli to free the Emperor John V Palaiologos from the Bulgarians. Savoy learned early that a small state profits most at the negotiating table."
 nd_sar_piedmont_valli_valdesi: "The Valleys Hold"
 nd_sar_piedmont_valli_valdesi_desc: "In 1487 Innocent VIII preached a crusade against the Waldensians of the Val d'Angrogna. The columns went up the valley and came back down again with nothing, having learned what a defended alpine gorge costs."
 nd_sar_piedmont_viceroyalty: "The Reale Udienza"
 nd_sar_piedmont_viceroyalty_desc: "The high court at Cagliari judged an island of feudatari who owed the crown military service, resented every summons, and could be relied on for both."
 nd_sar_piedmont_printed_carta: "The Printed Carta"
 nd_sar_piedmont_printed_carta_desc: "Around 1480 the Carta de Logu went to press at Cagliari, one of the first vernacular law codes in Europe to be printed in the language of the people it governed."
 nd_sar_piedmont_two_chanceries: "Two Chanceries"
 nd_sar_piedmont_two_chanceries_desc: "Sardinian on the island, Piedmontese in the plain, French at Chambery, Occitan in the high valleys and Latin in the courts. The crown never seriously tried to reduce that to one."
 nd_sar_piedmont_passes_in_arms: "The Passes in Arms"
 nd_sar_piedmont_passes_in_arms_desc: "A garrison at every col and a magazine behind it. Holding the Alps is less a question of walls than of what an army can be fed above the treeline in October."
 nd_sar_piedmont_return_from_exile: "Return from Exile"
 nd_sar_piedmont_return_from_exile_desc: "France erased the duchy in 1536 and held it for twenty three years. Emmanuel Philibert won it back at Saint Quentin, fighting for Spain, and rebuilt a state that had ceased to exist."
 nd_sar_piedmont_turin_the_capital: "Turin the Capital"
 nd_sar_piedmont_turin_the_capital_desc: "In 1563 the court moved from Chambery to Turin. A French speaking alpine county on the wrong side of the mountains decided, deliberately, to become an Italian state."
 nd_sar_piedmont_milizia_paesana: "The Ordinance of the Militia"
 nd_sar_piedmont_milizia_paesana_desc: "From 1566 the countryside was enrolled parish by parish, issued arms and drilled in peacetime. It was among the first standing militia systems in Europe and it cost almost nothing to keep."
 nd_sar_piedmont_monti_frumentari: "The Grain Banks"
 nd_sar_piedmont_monti_frumentari_desc: "From 1624 the Monti Frumentari lent seed grain to Sardinian villages against the coming harvest. They outlasted the Spanish, the Austrians and the Savoyards, and were still lending in 1900."
 nd_sar_piedmont_treaty_of_lyon: "The Treaty of Lyon"
 nd_sar_piedmont_treaty_of_lyon_desc: "In 1601 the duchy gave France Bresse, Bugey and Gex and took Saluzzo in exchange. It surrendered the Rhone side of the Alps and committed the dynasty to Italy for good."
 nd_sar_piedmont_ghetto_of_the_alps: "The Ghetto of the Alps"
 nd_sar_piedmont_ghetto_of_the_alps_desc: "The Peace of Cavour of 1561 granted the Waldensians freedom of conscience inside marked boundaries. Every edict after it narrowed those boundaries, until what remained was a strip of high ground contemporaries called a ghetto."
 nd_sar_piedmont_glorious_return: "The Glorious Return"
 nd_sar_piedmont_glorious_return_desc: "In August 1689 Henri Arnaud ferried nine hundred exiles across Lake Geneva and marched them a hundred and thirty miles back into their own valleys. In 1690 the duke, at war with France, made his heretics his allies."
 nd_sar_piedmont_pietro_micca: "The Countermine Galleries"
 nd_sar_piedmont_pietro_micca_desc: "A besieger takes a citadel by digging under it, so the citadel digs first. The galleries under Turin were fought over in the dark by miners, and in 1706 one of them cut his fuse short."
 nd_sar_piedmont_crown_by_treaty: "A Crown by Treaty"
 nd_sar_piedmont_crown_by_treaty_desc: "Utrecht made the duke King of Sicily in 1713. The Hague took Sicily away in 1720 and gave him Sardinia instead. The title survived the exchange, which was the entire point of accepting it."
 nd_sar_piedmont_regie_costituzioni: "The Regie Costituzioni"
 nd_sar_piedmont_regie_costituzioni_desc: "Printed in six books in 1723 and again in 1729, the royal constitutions gathered the whole law of the mainland into one text and forbade the courts to reason outside it."
 nd_sar_piedmont_filatoio_rosso: "The Throwing Mills"
 nd_sar_piedmont_filatoio_rosso_desc: "The Filatoio Rosso at Caraglio, built in 1676, turned water wheels against throwing frames to twist raw silk into organzine. In 1716 an Englishman named John Lombe came to copy the drawings by candlelight, and the first factory in Britain was a stolen Piedmontese silk mill."
 nd_sar_piedmont_fenestrelle: "Fenestrelle"
 nd_sar_piedmont_fenestrelle_desc: "Begun in 1728 and worked on for more than a century, the fortress climbs seven hundred metres of mountainside to close the Chisone valley. It is the largest alpine fortification in Europe."
 nd_sar_piedmont_cacciatori: "The Cacciatori"
 nd_sar_piedmont_cacciatori_desc: "Light battalions recruited from the best marksmen in the kingdom and sent up ground the line of battle could not climb, which in this kingdom is most of the ground."
 nd_sar_piedmont_dragoni_di_sardegna: "Dragoni di Sardegna"
 nd_sar_piedmont_dragoni_di_sardegna_desc: "Light horse raised on the Campidano and paid out of Turin, one of the few institutions in which the island served the mainland crown as an equal partner rather than a possession."
 nd_sar_piedmont_regia_marina_sarda: "The Sardinian Navy"
 nd_sar_piedmont_regia_marina_sarda_desc: "Giorgio Des Geneys rebuilt the fleet after 1815 out of almost nothing, and in 1825 took it to Tripoli to burn the corsairs at their moorings."
 nd_sar_piedmont_codice_feliciano: "The Code of Charles Felix"
 nd_sar_piedmont_codice_feliciano_desc: "In 1827 a printed royal code replaced the Carta de Logu, four hundred and thirty five years after Eleanor of Arborea proclaimed it. Almost nothing else in Europe had lasted that long."
 nd_sar_piedmont_editto_chiudende: "The Enclosure Edict"
 nd_sar_piedmont_editto_chiudende_desc: "The edict of 1820 invited anyone to fence and register the Sardinian commons. It created a landed class, a landless one, and a body of litigation that outlived the kingdom."
 nd_sar_piedmont_domus_de_logu: "Domus de Logu"
 nd_sar_piedmont_domus_de_logu_desc: "The court house of a Sardinian village, where the majore heard pleas and read the code aloud in the language the parties spoke. Built only on the island, because the island's law was never extended to the mainland."
 nd_sar_piedmont_dogana_alpina: "Dogana Alpina"
 nd_sar_piedmont_dogana_alpina_desc: "A customs post on a pass road, with a barrier, a weighbridge, a clerk and a few soldiers. Its value lies entirely in the fact that there is no way around it."
 nd_sar_piedmont_senato: "Senato"
 nd_sar_piedmont_senato_desc: "A sovereign court that registers royal edicts and may refuse to register them. Savoy kept four, at Turin, Chambery, Nice and Cagliari, each at the head of a province."
 nd_sar_piedmont_cittadella: "Cittadella"
 nd_sar_piedmont_cittadella_desc: "The pentagonal citadel of the capital, with countermine galleries running out under the glacis. It exists for the day the field army has already lost."
 nd_sar_piedmont_monte_frumentario: "Monte Frumentario"
 nd_sar_piedmont_monte_frumentario_desc: "A village grain store that lends seed against the next harvest at a fixed measure of interest. Founded across Sardinia from 1624 and still functioning three centuries later."
 nd_sar_piedmont_filatoio: "Filatoio"
 nd_sar_piedmont_filatoio_desc: "A water powered silk throwing mill. It does not weave anything. It twists raw silk into organzine warp thread, which Lyon and Spitalfields could not make and had to buy."
 nd_sar_piedmont_sbarramento_alpino: "Sbarramento Alpino"
 nd_sar_piedmont_sbarramento_alpino_desc: "A barrier work built across a valley floor in the manner of Exilles, Vinadio and Fenestrelle. On open ground it would be a wall to walk around. In a gorge it is the end of the road."
 nd_sar_piedmont_logu_maintenance: "Village Court"
 nd_sar_piedmont_logu_maintenance_desc: "Parchment, a bench, a lamp and a clerk who can write in Sardinian."
 nd_sar_piedmont_logu_assizes: "Assizes of the Carta"
 nd_sar_piedmont_logu_assizes_desc: "The court now sits to a written code, with printed articles, sworn assessors and a register of judgements that can be appealed against."
 nd_sar_piedmont_dogana_maintenance: "Barrier and Ledger"
 nd_sar_piedmont_dogana_maintenance_desc: "A chain across the road, a scale, and a book in which everything that passes is entered."
 nd_sar_piedmont_salt_toll: "The Salt Tariff"
 nd_sar_piedmont_salt_toll_desc: "Salt from the Cagliari pans is stored at the barrier and released against payment, so the crown taxes the same cargo twice in two seas."
 nd_sar_piedmont_pass_garrison: "Pass Garrison"
 nd_sar_piedmont_pass_garrison_desc: "The toll house is given a wall, a magazine and a company, on the reasoning that a customs post nobody can be forced to respect is not a customs post."
 nd_sar_piedmont_senato_maintenance: "The Bench"
 nd_sar_piedmont_senato_maintenance_desc: "Senators, secretaries, ink and the enormous quantity of paper that a sovereign court consumes."
 nd_sar_piedmont_reale_udienza: "Reale Udienza"
 nd_sar_piedmont_reale_udienza_desc: "The island branch of the court, sitting at Cagliari over feudal cases the barons would much rather have settled among themselves."
 nd_sar_piedmont_senate_registration: "Registration of Edicts"
 nd_sar_piedmont_senate_registration_desc: "No royal edict is law until the court enters it in the register, and the court has been known to take its time."
 nd_sar_piedmont_codified_bench: "The Codified Bench"
 nd_sar_piedmont_codified_bench_desc: "The judges are handed six printed books and told that these contain the law, all of it, and that reasoning outside them is not permitted."
 nd_sar_piedmont_civil_registry: "Civil Registry"
 nd_sar_piedmont_civil_registry_desc: "Births, marriages, deaths, deeds and mortgages, all in the same hand and all in the same building."
 nd_sar_piedmont_cittadella_maintenance: "Citadel Works"
 nd_sar_piedmont_cittadella_maintenance_desc: "Stone for the revetments, powder for the mines, and timber to shore the galleries."
 nd_sar_piedmont_frumentario_maintenance: "Granary Works"
 nd_sar_piedmont_frumentario_maintenance_desc: "A dry stone store, a measured bushel, and a ledger of who owes what against which harvest."
 nd_sar_piedmont_silk_throwing: "Silk Throwing"
 nd_sar_piedmont_silk_throwing_desc: "Raw silk is reeled, doubled and twisted on water driven frames until it becomes organzine, the only warp thread strong enough for a mechanical loom."
 nd_sar_piedmont_sbarramento_maintenance: "Barrier Works"
 nd_sar_piedmont_sbarramento_maintenance_desc: "Cut stone hauled up a mule track, timber for the galleries, and enough muskets to hold a wall nobody can flank."
 a_nd_sar_piedmont_milizia_paesana: "Milizia Paesana"
 a_nd_sar_piedmont_milizia_paesana_desc: "Parish militia raised under the ordinance of 1566, drilled on Sundays and armed at the crown's expense. Stubborn behind a wall in their own valley and badly shaken anywhere else."
 a_nd_sar_piedmont_bande_valdesi: "Bande Valdesi"
 a_nd_sar_piedmont_bande_valdesi_desc: "The valley bands Joshua Janavel armed after 1655, for whom he wrote what may be the first partisan warfare manual in Europe. They know every goat path above the snow line and cannot hold a line of battle for ten minutes."
 a_nd_sar_piedmont_minatori: "Minatori"
 a_nd_sar_piedmont_minatori_desc: "The mine companies of the citadel, who fight underground in the countermine galleries with pick, pistol and powder charge, and who go into a breach first because they know what is behind it."
 a_nd_sar_piedmont_cacciatori: "Cacciatori"
 a_nd_sar_piedmont_cacciatori_desc: "Light battalions of picked marksmen, sent ahead of the line onto ground the line cannot occupy. Devastating in broken country and painfully exposed on a plain."
 a_nd_sar_piedmont_dragoni_sardi: "Dragoni di Sardegna"
 a_nd_sar_piedmont_dragoni_sardi_desc: "Island light horse, mounted on small hardy stock and used to foraging on ground that starves continental cavalry."
 n_nd_sar_piedmont_corvetta_sarda: "Corvetta Sarda"
 n_nd_sar_piedmont_corvetta_sarda_desc: "The ships Giorgio Des Geneys rebuilt the fleet around, handy in narrow water and built for hunting corsairs rather than standing in a line of battle."
 levy_nd_sar_piedmont_milizia_paesana: "Militia Levy"
 levy_nd_sar_piedmont_milizia_paesana_desc: "The parish rolls are called and the countryside turns out with the muskets the crown issued it."
 levy_nd_sar_piedmont_bande_valdesi: "Waldensian Bands"
 levy_nd_sar_piedmont_bande_valdesi_desc: "Raised only from the Occitan speaking communities of the Cottian Alps, which is exactly who the Waldensians were. A minority in arms, not a national army."
 levy_nd_sar_piedmont_dragoni_sardi: "Sardinian Dragoon Levy"
 levy_nd_sar_piedmont_dragoni_sardi_desc: "The island nobility mount and ride for the king, which is one of the few services they render without an argument."
 nd_sar_piedmont_destiny: "The Crown Assembled by Treaty"
 nd_sar_piedmont_destiny_desc: "A marriage contract, a papal grant nobody on the island accepted, and an exchange signed at The Hague by men who had seen neither half of the kingdom. None of the instruments says what this crown is for. Settle the realm and the chancery will have to answer."
 nd_sar_piedmont_dest_far_cols: "The Far Mouths"
 nd_sar_piedmont_dest_far_cols_desc: "Every pass in this kingdom is held at one end only. Take Briancon below the Montgenevre and Martigny below the Great St Bernard, with thirty units under arms, and no road over the western Alps opens without the crown's leave."
 nd_sar_piedmont_dest_sea_gate: "A Quay of Our Own"
 nd_sar_piedmont_dest_sea_gate_desc: "Silk goes down the Mont Cenis road and onto somebody else's ship, and the freight is entered in somebody else's ledger. Take Nice and Savona, with two thousand in the treasury, and the passes end at a Sardinian quay."
 nd_sar_piedmont_dest_whole_arc: "The Whole Arc"
 nd_sar_piedmont_dest_whole_arc_desc: "Geneva was the door Savoy never got through and Genoa the port it was never allowed to want out loud. Take both, with seventy five units in the field and the standing to hold them, and nothing enters Italy from the north or west unwatched."
 nd_sar_piedmont_dest_perequazione: "The Perequazione"
 nd_sar_piedmont_dest_perequazione_desc: "Measure the realm: every plot, every owner, every quality of soil, and no exemption for anyone. Embrace the printing press, raise the realm to five hundred development, and carry the register out over the plain as far as Pavia."
 nd_sar_piedmont_dest_third_custom: "A Third Custom"
 nd_sar_piedmont_dest_third_custom_desc: "Corsica settles what it can in the pieve and feuds over the rest, exactly as Sardinia did before Eleanor wrote her code. Take Bastia and Corte, with paper reaching your markets, and the chancery administers three bodies of law at once."
 nd_sar_piedmont_dest_one_bench: "One Bench"
 nd_sar_piedmont_dest_one_bench_desc: "Every judge in Italy was trained at Bologna or Padua. Take both, embrace the Enlightenment and raise the realm to a thousand development, and the crown appoints the men who teach the law it is codifying."
 nd_sar_piedmont.7.t: "The Question the Treaty Left Open"
 nd_sar_piedmont.7.d: "The instruments that made this kingdom are filed in Turin: a marriage contract, a grant of a crown by a pope who had never been consulted about the island, and an exchange signed at The Hague by ministers who had seen neither half of it. Every one of them says who rules. Not one of them says what the kingdom is for.\n\nThe chancery can answer with the ground. This crown owns the doors of Italy, and doors can be held, counted, shut and charged for.\n\nOr it can answer with the law. This crown already governs two peoples under two codes without pretending they are one people, and a state that can do that can do it for any number of peoples.\n\nSmall states have tried both. No state has tried either while holding the Alps and an island at the same time."
 nd_sar_piedmont.7.a: "Let the record show the crown is settled"
 nd_sar_piedmont.8.t: "The Far Mouths"
 nd_sar_piedmont.8.d: "The customs men sit at Susa and at Aosta and count what comes down the road. What is coming up the far side they cannot see until it is over the col and among them. A door with a lock on one face is not a door.\n\nSo the columns go over the watershed in the campaigning season and down the other slope: to Briancon under the Montgenevre, where the Dauphinois have kept a garrison since anyone can remember, and to Martigny under the Great St Bernard, where the bishop of Sion's men take the toll the crown would rather take itself.\n\nThe engineers who go with the army are told to measure the road as carefully as the walls. Whatever the peace decides, the crown intends to know to the hour how long an army needs to reach each summit from the wrong side of it."
 nd_sar_piedmont.8.a: "Hold both mouths of every pass"
 nd_sar_piedmont.9.t: "A Quay of Our Own"
 nd_sar_piedmont.9.d: "This kingdom has been carrying other people's trade for three centuries. Organzine goes down the Mont Cenis road, onto a Genoese hull or a French one, and the freight, the insurance and the profit are entered in a ledger kept somewhere else. The tolls are real money, but they are the smallest share of what passes.\n\nNice has been ours since 1388 and the Riviera di Ponente is ours now, which means there is finally a coast at the bottom of the mountains. What goes on it is the question.\n\nVillefranche has the deepest anchorage between Toulon and Genoa and a bay a squadron can ride out a winter gale in. The merchants want something else entirely: a free port, no duty on goods in transit, and no questions asked about the faith of the men unloading them."
 nd_sar_piedmont.9.a: "Build the royal harbour at Villefranche"
 nd_sar_piedmont.9.b: "Declare a free port and ask no questions"
 nd_sar_piedmont.10.t: "Both Ends of the Arc"
 nd_sar_piedmont.10.d: "Geneva was the one door this house never got through. On a December night in 1602 the ladders went up against the walls and came back down with men still on them, and the city has kept the anniversary ever since, with a cauldron of soup and a song about a housewife who dropped one.\n\nGenoa was the one port the crown was never permitted to want aloud, and in the end it took a congress of Europe to sign it over.\n\nHolding both ends changes what this kingdom is. Nothing crosses into Italy from the north or the west now except past a Sardinian garrison. What remains to be settled is whether that is a wall or a turnpike: whether the crown means to close the arc and man it, or keep it open and charge every power in Europe for the use of it."
 nd_sar_piedmont.10.a: "Man the whole barrier and close it"
 nd_sar_piedmont.10.b: "Rent out the passes and the regiments"
 nd_sar_piedmont.11.t: "The Measure"
 nd_sar_piedmont.11.d: "The surveyors go out with chains, plane tables and an instruction that reads like a threat: every plot, every holder, every quality of soil, and no exemption for anybody. The nobility object that a fief measured is a fief taxed, which is exactly the intention, and say so at length in petitions that are filed and not answered.\n\nIt takes a generation. At the end of it this is the first state in Europe with a complete written measure of itself, bound in volumes, copied twice and kept. After it the crown never again has to ask a landowner how much land he has, and never again has to believe the reply.\n\nThe measure does not stop at the old frontier. It goes out over the plain toward Pavia, where the Lombard law was written down before anyone in Turin could write, and the surveyors are followed by clerks carrying a second set of registers."
 nd_sar_piedmont.11.a: "Enter every field in the register"
 nd_sar_piedmont.12.t: "The Third Custom"
 nd_sar_piedmont.12.d: "Corsica governs itself the way Sardinia did before Eleanor of Arborea wrote her code. The pieve settles what it can, the elders arbitrate what the pieve cannot, and what neither can settle becomes a feud that outlives everyone who began it. Genoa spent four hundred years failing to change this and left behind towers, garrisons and a great deal of resentment.\n\nThe island is the crown's now, and the chancery has a third body of custom to account for on top of the two it already carries.\n\nThe register can be laid over Corsica entire: the mainland code, the mainland courts, mainland judges riding circuit whether anyone asked for them or not. Or the custom can be taken down as it stands, entered as Corsican law under the crown's seal, and enforced by the crown precisely because it is now the crown's."
 nd_sar_piedmont.12.a: "Extend the code and ride the circuit"
 nd_sar_piedmont.12.b: "Write the custom down and enforce it"
 nd_sar_piedmont.13.t: "One Bench"
 nd_sar_piedmont.13.d: "The doctors of Bologna were teaching Roman law before this house had a county, and Padua has been training the men who govern Venice for almost as long. Both faculties are now the crown's to appoint to, and there is scarcely a judge in Italy who did not sit in one of those halls.\n\nWhich leaves the question this kingdom has never answered. It has ruled two peoples under two codes since the day it was assembled. It can go on doing so indefinitely, or it can stop.\n\nA single civil code binding every subject would make the law the same thing in Cagliari, Casale and Corte, and would make an appeal mean the same thing in all three. It would also end four centuries of Sardinian law and every custom that sheltered under it, and the men who live off the difference between the codes will have a great deal to say."
 nd_sar_piedmont.13.a: "One code, one bench, every subject"
 nd_sar_piedmont.13.b: "Keep the codes and hold both benches"
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_darsena_reale: "The Darsena Reale"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_darsena_reale: "Slipways, a rope walk and a powder magazine at Villefranche, and a squadron that winters in the bay instead of being laid up. The kingdom finally has somewhere to put ships."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_porto_franco: "The Free Port"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_porto_franco: "Goods in transit pay nothing and nobody is asked where he prays. The quays fill within a decade with factors from every coast in the Mediterranean, and the archbishop writes to Turin about it roughly once a month."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_barriera_alpina: "The Alpine Barrier"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_barriera_alpina: "Every valley floor from the lake to the sea carries a work across it, every work carries a magazine, and the militia rolls behind them are called and checked twice a year. The arc is not a frontier any more. It is a position."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_trattati_sussidio: "The Subsidy Treaties"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_trattati_sussidio: "The regiments are hired out by the campaign and the passes by the season, to whichever coalition is paying, and the crown reserves the right to change sides when the terms improve. This is how a duchy became a kingdom."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_codice_prevale: "The Code Prevails"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_codice_prevale: "Circuit judges from the mainland now settle what the feud used to settle, and they are obeyed. The army has not been called out in a generation and its officers have begun to notice."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_terza_consuetudine: "The Third Custom Registered"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_terza_consuetudine: "Clerks take down what the elders have always known, article by article, and the crown seals it. The custom is unchanged and now has an army behind it, which is more than it ever had before."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_solo_codice: "One Code for All Subjects"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_solo_codice: "A contract signed in Cagliari now means precisely what the same words mean in Turin. Lenders notice this before anyone else does, and the terms they offer the crown improve accordingly."
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_codici_distinti: "The Codes Kept Distinct"
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_codici_distinti: "Two benches, two codes, one crown, and no pretence that the subjects of one are the subjects of the other. Courts elsewhere in Europe write to Turin to ask how it is done."
 nd_sar_piedmont_ospizio: "Ospizio del Valico"
 nd_sar_piedmont_ospizio_desc: "The hospice on the summit of a pass, of the kind Bernard of Menthon founded on the two St Bernards. Canons, a grain store above the treeline, poles to mark the track after snow, and men who go out after travellers who have not arrived. A pass open in February is worth several open in July."
 nd_sar_piedmont_ospizio_maintenance: "Hospice Keeping"
 nd_sar_piedmont_ospizio_maintenance_desc: "Firewood hauled up by mule, grain and salt meat laid in before the first snow, and candles enough to keep a light burning where the track turns."
 nd_sar_piedmont_archivio: "Archivio di Corte"
 nd_sar_piedmont_archivio_desc: "The royal archive Victor Amadeus II built at Turin in 1731, one of the first buildings in Europe raised for the single purpose of holding a state's memory. Treaties, cadastral registers, investitures and judgements in one fireproof hall, shelved so that a clerk can find any of them the same morning."
 nd_sar_piedmont_archivio_maintenance: "The Record Office"
 nd_sar_piedmont_archivio_maintenance_desc: "Paper, presses, bound registers, and archivists who spend their lives making certain that a document filed in one reign can be produced in the next."
 nd_sar_piedmont.7.a_tt: "The chancery records that the kingdom is founded and settled."
 nd_sar_piedmont.8.a_tt: "The far mouth of every pass is taken and garrisoned."
 nd_sar_piedmont.9.a_tt: "Villefranche is built up as a royal war harbour."
 nd_sar_piedmont.9.b_tt: "Transit goods pay no duty and no merchant is asked his faith."
 nd_sar_piedmont.10.a_tt: "Every valley of the arc is closed by a work and a magazine."
 nd_sar_piedmont.10.b_tt: "Regiments and passage are hired out to whoever is paying."
 nd_sar_piedmont.11.a_tt: "Every plot in the realm is measured and entered in the register."
 nd_sar_piedmont.12.a_tt: "Mainland judges ride circuit over the island custom."
 nd_sar_piedmont.12.b_tt: "The custom is written down as it stands and sealed by the crown."
 nd_sar_piedmont.13.a_tt: "One civil code is proclaimed over every subject of the crown."
 nd_sar_piedmont.13.b_tt: "Both codes stand and the crown keeps a bench for each."

 # ===== BUREAUCRACIES =====
 sar_piedmont_intendenti_bureaucracy: "Intendenti di Provincia"
 sar_piedmont_intendenti_bureaucracy_desc: "From 1696 Victor Amadeus II put a salaried royal intendant into each province on the French model, a commissioner who answered to Turin and to nobody where he sat. He assessed and gathered the taxes the provincial estates had once voted, audited the accounts of every community, took in the appeals that had gone to the feudal bench, and kept the rolls from which the provincial regiments were filled. Within a generation the Savoyard state was governed more directly than any other in Italy, and a small realm could mobilise like a large one."
 sar_piedmont_regio_economato_bureaucracy: "Regio Economato"
 sar_piedmont_regio_economato_bureaucracy_desc: "By the concordat of 29 May 1727 Benedict XIII conceded to Victor Amadeus II that the fruits of every vacant bishopric and abbey be kept under royal custody and administered by economi the crown appointed, and confirmed the House of Savoy in its right of nomination to the sees. The island was organised the same way from 1733 under a conservator general, and Charles Emmanuel III renewed the settlement in 1741. Set beside the royal placet, which held back any bull the crown had not read, it made the church of the realm answerable to Turin in its purse and in its appointments alike."
 sar_piedmont_ordine_mauriziano_bureaucracy: "Ordine dei Santi Maurizio e Lazzaro"
 sar_piedmont_ordine_mauriziano_bureaucracy_desc: "The bull Pro Commissa Nobis of 13 November 1572 joined the Savoyard Order of Saint Maurice to the hospitaller Order of Saint Lazarus, and from January 1573 the grand mastership was vested in the House of Savoy in perpetuity. Emmanuel Philibert recovered the Lazarite commanderies as endowed livings for his knights, opened the order's hospital at Turin in 1575, and kept a convent house in the citadel of Nice for sea service and another at Turin for service ashore. Two galleys, the Piemontese and the Margarita, sailed under the order's banner in the papal service against the Turks."
 sar_piedmont_magistrato_riforma_bureaucracy: "Magistrato della Riforma"
 sar_piedmont_magistrato_riforma_bureaucracy_desc: "Victor Amadeus II rebuilt the University of Turin between 1717 and 1720 and set a Magistrato della Riforma over all teaching in his states, charged expressly with keeping the religious orders out of it. The regulation of 1729 placed every school under the university and required each schoolmaster to hold a royal diploma from Turin, while the Collegio delle Province boarded students from outside the capital at crown expense, who came back to staff the intendancies and the benches. Scholars have called that settlement the archetype of the Italian public school."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_sar_piedmont_bureaucracy_authority: "Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_sar_piedmont_bureaucracy_authority: "A crown assembled by treaty out of an Alpine duchy and a Mediterranean island keeps standing institutions of its own: the intendant in the province, the economato over the vacant benefice, the order and its commende, the magistracy over the schools. One institutional slot opens beside the capital's own, so two of the four may be kept at once."
