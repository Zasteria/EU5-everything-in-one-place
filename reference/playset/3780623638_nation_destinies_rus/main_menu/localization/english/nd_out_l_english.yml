l_english:

# === Static Modifiers: formation choices ===
 STATIC_MODIFIER_NAME_nd_out_compact_of_the_courts: "The Compact of the Courts"
 STATIC_MODIFIER_DESC_nd_out_compact_of_the_courts: "Sworn at the Sepulchre, before witnesses who between them speak six languages. The Haute Cour keeps the barons, the Cour des Bourgeois the Frankish commons, the Cour de la Fonde the market on a bench of two Frankish and four Syrian jurors, and the Cour de la Chaine the harbour. Beyond them the qadi, the Coptic and Jacobite bishops, the catholicos at Baghdad and the bet din keep their own law and their own judgments. The empire holds because the crown does not insist on being the only court, and that is precisely the price."
 STATIC_MODIFIER_NAME_nd_out_custodian_of_the_sanctuaries: "Custodian of the Sanctuaries"
 STATIC_MODIFIER_DESC_nd_out_custodian_of_the_sanctuaries: "The emperor takes the guardianship of Mecca and Medina, garrisons the pilgrim road from Sinai to the Hejaz, and puts his escort on the Karimi convoys running pepper out of Aden. From Suez to the Gate of Tears the narrow sea answers to a Latin crown, and every Muslim power that wants its people at the Kaaba must now write to Jerusalem. The Latin clergy of the realm call it apostasy, and they say so from every pulpit the crown pays for."
 STATIC_MODIFIER_NAME_nd_out_the_new_towns: "The New Towns"
 STATIC_MODIFIER_DESC_nd_out_the_new_towns: "The one lawful way to change the arithmetic is to bring more people. Surveyors lay out burgess villages on the Magna Mahumeria model along the Nablus road: a single street, a tower, a church, plots held in free tenure with no labour dues and no marriage fee. Settlers come off the pilgrim galleys at Jaffa with a charter in hand. The countryside they are planted in did not ask for them."

# === Static Modifiers: advance events ===
 STATIC_MODIFIER_NAME_nd_out_castles_of_the_brethren: "Castles of the Brethren"
 STATIC_MODIFIER_DESC_nd_out_castles_of_the_brethren: "Krak, Margat, Belvoir and forty more stay in the hands of the Temple and the Hospital, garrisoned out of European revenues and answerable to Rome. The frontier has never been stronger and the crown has never had less say in it."
 STATIC_MODIFIER_NAME_nd_out_castles_of_the_crown: "Castles of the Crown"
 STATIC_MODIFIER_DESC_nd_out_castles_of_the_crown: "The castellany is brought under the Haute Cour and the orders are told that a papal exemption is not a jurisdiction. The keys come in. So do the resignations of the best garrison troops in the Levant."
 STATIC_MODIFIER_NAME_nd_out_charters_renewed: "The Charters Renewed"
 STATIC_MODIFIER_DESC_nd_out_charters_renewed: "Venice, Genoa and Pisa keep their quarters entire: church, oven, bath, weights, court and gallows, and their exemption from the customs. In return the empire has more shipping than any power on either sea."
 STATIC_MODIFIER_NAME_nd_out_quarters_reduced: "The Quarters Reduced"
 STATIC_MODIFIER_DESC_nd_out_quarters_reduced: "The communal gallows come down and the crown's assessor walks onto the wharf for the first time in a century. Some of the western galleys sail for a friendlier port and do not come back."
 STATIC_MODIFIER_NAME_nd_out_one_code_of_acre: "One Code of Acre"
 STATIC_MODIFIER_DESC_nd_out_one_code_of_acre: "The jurists write a single code binding every subject of the empire, and every community that had its own law learns what the word imperial means."
 STATIC_MODIFIER_NAME_nd_out_many_courts_one_crown: "Many Courts, One Crown"
 STATIC_MODIFIER_DESC_nd_out_many_courts_one_crown: "The Livre names the subordinate courts instead of replacing them. Six legal systems stand under one crown, quiet and content, and every statute the empire wishes to pass must now be drafted six times."
 STATIC_MODIFIER_NAME_nd_out_guardianship_kept: "The Guardianship Kept"
 STATIC_MODIFIER_DESC_nd_out_guardianship_kept: "The legate goes home with his letter unread aloud. The sanctuaries stay open, the Hajj keeps its escort, the customs keep their season, and the emperor's confessor stops coming to court."
 STATIC_MODIFIER_NAME_nd_out_legates_obedience: "The Legate's Obedience"
 STATIC_MODIFIER_DESC_nd_out_legates_obedience: "Rome is obeyed. The Latin realm is reconciled with itself and with Christendom, and the news reaches every mosque between Cairo and Aden before the legate has reached the coast."
 STATIC_MODIFIER_NAME_nd_out_one_roll_of_taxation: "One Roll of Taxation"
 STATIC_MODIFIER_DESC_nd_out_one_roll_of_taxation: "One assessment, one roll, one rate, and a subject's faith is no longer a matter for the treasury. It is cheaper to be governed by this empire than it has ever been, and dearer to govern it."
 STATIC_MODIFIER_NAME_nd_out_offering_of_the_sanctuaries: "The Offering of the Sanctuaries"
 STATIC_MODIFIER_DESC_nd_out_offering_of_the_sanctuaries: "The capitation becomes a voluntary offering, collected by the sanctuaries themselves for their own upkeep. The communities pay it gladly and in full, and the crown never sees the ledger."

# === Event variable tooltips ===
 nd_out_formed_tt: "Outremer is proclaimed."
 nd_out_path_a_tt: "Founding settlement: the Compact of the Courts."
 nd_out_path_b_tt: "Founding settlement: Custodian of the Sanctuaries."
 nd_out_path_c_tt: "Founding settlement: the New Towns."
 nd_out_e1_done_tt: "The coronation at the Sepulchre has taken place."

# === Formation Event ===
 nd_out.1.t: "The Crown of Outremer"
 nd_out.1.d: "The crown is set on your head in the Church of the Holy Sepulchre and the herald reads the style out to the nave: King of Jerusalem, Lord of Egypt, Master of Baghdad and Mosul, Guardian of Mecca and Medina, Keeper of the Gate of Tears.\n\nThen the chamberlain hands you the survey, and it is not a triumph. Of every ten souls in this empire, fewer than two hear mass in Latin. The Haute Cour of the barons has jurisdiction over almost none of them. Forty frontier castles are held by the Temple and the Hospital, who answer to Rome. The Venetian, Genoese and Pisan quarters in your own ports keep their own courts, ovens, baths and gallows, and pay you nothing. The revenue that keeps your field army standing is the poll tax on subjects who are not Christian at all, and it is paid in exchange for your protection.\n\nOutremer means overseas. You have inherited a realm, not conquered one, and the question is not how to win it. The question is on what basis you propose to govern people who are not you.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_out.1.a: "Confirm the assises of every community"
 nd_out.1.b: "Take the guardianship of Mecca and Medina"
 nd_out.1.c: "Plant the new towns and settle the West here"

# === Advance Events ===
 nd_out.2.t: "The Castellany of the Orders"
 nd_out.2.d: "The Marshal of the Hospital is shown into the hall and does not kneel. He is not required to: a papal privilege exempts his order from every jurisdiction but Rome's.\n\nSince the 1130s the lay lords of the Latin East have handed their frontier castles to the Temple and the Hospital, because the orders could garrison them and the lords could not. Krak, Margat, Belvoir and forty more are held by brotherhoods paid out of estates in Provence and Aragon, manned by men who took vows in Paris, and commanded by chapters that decide their own campaigns.\n\nNo crown here has ever held the frontier without them. No crown here has ever been able to give them an order."
 nd_out.2.a: "Confirm their castles and their privileges"
 nd_out.2.b: "Summon the castellany before the Haute Cour"
 nd_out.3.t: "The Quarters of the Communes"
 nd_out.3.d: "In 1256 the Venetians and the Genoese fought a war inside Acre, street by street, over the monastery of Saint Sabas, while the kingdom that owned the city watched from the citadel and was not asked.\n\nEach commune holds a walled quarter in your ports with its own church, oven, bath, weights, court and gallows. Their bailli judges their people. Their notaries keep the contracts. Their exemption from the customs is written into charters granted before your grandfather was born, in exchange for the fleets that took these cities in the first place.\n\nThe factors are at the door with the charters, asking for renewal."
 nd_out.3.a: "Renew the charters as they stand"
 nd_out.3.b: "Revoke the exemptions and take the wharves"
 nd_out.4.t: "The Book of the Assises"
 nd_out.4.d: "The jurists have been at work in Acre for four years and the fair copy is ready. It is the first time the law of this realm has existed anywhere but in the memory of men who sat on juries.\n\nThe Livre des Assises de la Cour des Bourgeois sets out the law of the Frankish commons: the viscount who keeps order but casts no vote, the twelve jurors who give the verdict, the pleas of debt and dower and blood. It also names, in plain terms, the courts beneath it: the qadi for the Muslims, the bet din for the Jews, the bishops for the Eastern Christians, and the Fonde for the market where all of them trade.\n\nWriting law down forces a question that custom never had to answer. Whose law is this?"
 nd_out.4.a: "One code, binding on every subject"
 nd_out.4.b: "Name the courts beneath and leave them standing"
 nd_out.5.t: "The Legate at the Sanctuaries"
 nd_out.5.d: "The legate has come from Rome with a demand so obvious that he expects no argument. You hold Mecca. You hold Medina. Christendom has been praying for this for two hundred years and now expects you to close them.\n\nHe has the precedent ready. In 1182 Raynald of Chatillon put five galleys on the Red Sea and landed a party on the coast between the two cities, and the shock of it has never faded on either side.\n\nYour chamberlain has the other ledger. The Hajj brings a hundred thousand people a year through your provision markets, along roads your engineers maintain, under an escort your treasury pays for, and every one of them buys food, water, transport and safe conduct. Half your subjects measure your legitimacy by whether their parents can make that journey."
 nd_out.5.a: "The sanctuaries stay open. Send him home."
 nd_out.5.b: "Rome is obeyed."
 nd_out.6.t: "The Capitation Abolished"
 nd_out.6.d: "The poll tax on your non-Latin subjects is older than the crusade. The Fatimids levied it, the Ayyubids levied it, the Franks took over the registers without changing a column, and for five centuries it has been the largest ordinary revenue of this realm.\n\nIt was never merely a tax. It was the contract: you pay, and the crown protects your faith, your court and your sanctuary. Every warden posted at a shrine and every escort riding with the Hajj was paid for out of it.\n\nThe treasurer points out, without enthusiasm, that a state which has spent five hundred years insisting that a subject's religion is not the crown's business can no longer explain why the crown taxes it."
 nd_out.6.a: "One roll of taxation for every subject"
 nd_out.6.b: "Let the sanctuaries collect it as an offering"

# === Event option tooltips ===
 nd_out.1.a_tt: "Every community keeps its own law and its own bench. The crown gives up being the only court."
 nd_out.1.b_tt: "The crown guarantees the Hajj and taxes the Red Sea. The Latin clergy of the realm will not forgive it."
 nd_out.1.c_tt: "Settlers, charters and planted villages. The one lawful way to change the realm's arithmetic."
 nd_out.2.a_tt: "The orders keep the frontier castles and the crown keeps out of them."
 nd_out.2.b_tt: "The castellany answers to the Haute Cour, and the best garrisons in the Levant hand in their keys."
 nd_out.3.a_tt: "The communes keep their quarters, their courts and their exemption from the customs."
 nd_out.3.b_tt: "The crown takes the wharves and some of the western shipping goes elsewhere."
 nd_out.4.a_tt: "One code for every subject of the empire, whether or not they asked for it."
 nd_out.4.b_tt: "Six legal systems under one crown, quiet and slow."
 nd_out.5.a_tt: "The sanctuaries stay open and the emperor's own church turns against him."
 nd_out.5.b_tt: "Christendom is satisfied and half the realm hears about it."
 nd_out.6.a_tt: "One assessment for every subject, and a hole in the treasury where the poll tax was."
 nd_out.6.b_tt: "The sanctuaries collect their own upkeep and the crown never sees the ledger."

# === Advances ===
 nd_out_rais_and_dragoman: "The Ra'is and the Dragoman"
 nd_out_rais_and_dragoman_desc: "The Franks did not replace the countryside's leadership; they confirmed it. The ra'is was the headman the village already had, of the same speech and faith as his neighbours, holding the better orchard and answering for the community. Facing him stood the lord's dragoman, an interpreter with a fief, and the scribe who kept the accounts. Almost no Frankish lord lived among his tenants, and this pair is why he did not have to."
 nd_out_capitation_of_the_realm: "The Capitation of the Realm"
 nd_out_capitation_of_the_realm_desc: "The crusaders inherited the head tax on non-Muslims and simply reversed the direction, levying it on Muslims and Jews and leaving the registers otherwise untouched. It was the crown's largest ordinary revenue, and it was collected as the price of protection, which meant the treasury and the sanctuaries were bound to each other from the beginning."
 nd_out_mountain_crossbows: "Crossbows of the Mountain"
 nd_out_mountain_crossbows_desc: "William of Tyre describes the Maronites of Mount Lebanon as valiant men who gave the Franks scouts, guides, riders and archers, good with the crossbow in the Italian manner. In 1182 their patriarch sought union with the Latin patriarch of Antioch. They were the one native community that came over to Rome of its own accord, and they were never numerous enough to change the arithmetic of the realm."
 nd_out_rent_not_labour: "Rent, Not Labour"
 nd_out_rent_not_labour_desc: "The crusader states introduced no serfdom, which surprises everyone who hears it. Native peasants owed a share of the crop, in places as little as a quarter, and owed nothing else: no work on the lord's own land, no fee to marry, no dues in kind on the old western pattern. The countryside grew because of it. So did the problem of raising an army from a peasantry that owes no service."
 nd_out_wardens_of_the_sanctuaries: "Wardens of the Sanctuaries"
 nd_out_wardens_of_the_sanctuaries_desc: "A crown officer with a small guard, a stipend and one instruction: the sanctuary stays open, the pilgrims are not molested, and no missionary comes through the gate. The realm contains the Kaaba, the Prophet's Mosque, the Greek and Armenian chapels of the Sepulchre, the Coptic patriarchate, the catholicos of the Church of the East, the Samaritans of Nablus and the Mandaeans of the lower Euphrates."
 nd_out_castellany_of_the_orders: "The Castellany of the Orders"
 nd_out_castellany_of_the_orders_desc: "From the 1130s the lay lords ceded their frontier castles to the Temple and the Hospital, whose papal exemptions placed them outside every local jurisdiction. It produced the strongest fortified frontier in the world, garrisoned at somebody else's expense, inside a realm whose crown could not command it."
 nd_out_darb_al_hajj: "The Darb al-Hajj"
 nd_out_darb_al_hajj_desc: "The pilgrim road ran from Cairo across Sinai and from Damascus down the length of the Hejaz: cisterns cut into rock, forts at a day's march, provision markets at the wells, all maintained out of the treasury so that other people could reach Mecca. An empire that holds both ends of that road is a Christian state paying for the Muslim pilgrimage, and doing it well."
 nd_out_camels_of_the_road: "Camels of the Road"
 nd_out_camels_of_the_road_desc: "An empire with its seat at Jerusalem, its granary at Cairo, its eastern capital at Baghdad and its customs house at Aden moves on camels or it does not move. The Bedouin contractors who carried Raynald's galleys across the Negev in pieces will carry anything for a negotiated rate."
 nd_out_ships_carried_by_camel: "Ships Carried by Camel"
 nd_out_ships_carried_by_camel_desc: "Raynald of Chatillon spent two years building five galleys at Kerak, took them apart, hired Bedouin camels to carry the timbers two hundred kilometres across the Negev to Ayla at the head of the Gulf of Aqaba, and reassembled them on a sea no Frankish keel had ever touched. Saladin's letters record the shock. The empire makes the stunt permanent: a standing yard and a standing squadron on the Red Sea."
 nd_out_communes_of_the_ports: "The Communes of the Ports"
 nd_out_communes_of_the_ports_desc: "Venice, Genoa and Pisa hold walled quarters inside the crown's own harbours, with their own church, oven, bath, weights, court and gallows, and charters exempting them from the customs. They are the reason the realm has shipping at all, and a permanent hole in the assessment."
 nd_out_livre_des_assises: "The Livre des Assises"
 nd_out_livre_des_assises_desc: "Written at Acre between 1240 and 1244. It sets out the law of the Frankish commons under a viscount who keeps order and casts no vote and twelve jurors who give the verdict, and it names the courts beneath it: the qadi, the bet din, the Eastern bishops. The Cour de la Fonde judged the market itself, on a bench of two Frankish jurors and four Syrian."
 nd_out_confraternities_of_acre: "The Confraternities of Acre"
 nd_out_confraternities_of_acre_desc: "Sworn brotherhoods of townsmen with a hall, a patron saint and a muster roll. Saint Andrew and the Holy Spirit at Acre armed their members, drilled them and by the thirteenth century spoke for the city in its own politics. They defend their own walls superbly and are extremely reluctant to march anywhere else."
 nd_out_pilgrim_passage: "The Pilgrim Passage"
 nd_out_pilgrim_passage_desc: "The Jaffa run was a regulated passenger service: fixed fares, a senate-approved contract, a sailing season, and a hull built to carry people rather than cargo or guns. The crown builds its own and stops paying Venice for the privilege of bringing pilgrims to its own capital."
 nd_out_tiraz_of_tinnis: "The Tiraz of Tinnis"
 nd_out_tiraz_of_tinnis_desc: "The state weaving houses of Tinnis and Damietta produced the most valuable linen in the medieval Mediterranean, and every bolt carried a woven band naming the reigning ruler. The crusaders took the workshops over intact, weavers and all. A Latin emperor's tiraz names him in Arabic, which is this empire in a single object."
 nd_out_karimi_compact: "The Karimi Compact"
 nd_out_karimi_compact_desc: "The Karimi were Muslim merchant houses who moved Malabar pepper from Aden up the Red Sea to Qus, Cairo and Alexandria in armed convoys for two centuries. A sack that cost coins at Calicut sold for ten times as much at Alexandria and thirty at Venice. The crown does not replace them. It escorts them, insures them and takes its percentage at the customs house."
 nd_out_custodian_of_the_hajj: "Custodian of the Hajj"
 nd_out_custodian_of_the_hajj_desc: "The strangest style in Christendom, read out in Latin at Jerusalem: Guardian of the Two Sanctuaries. It is not a courtesy. It means that every Muslim power that wants its subjects to reach Mecca has to negotiate with a Catholic emperor, and that the emperor's own legitimacy at home now rests partly on how well he does it."
 nd_out_the_secrete: "The Secrete"
 nd_out_the_secrete_desc: "The fiscal bureau of the crusader kingdom, taken over from the Fatimid diwan down to its Arabic registers, its measures and most of its clerks. The Franks changed the name and very little else, because nobody they brought from Europe knew how to assess a Nile flood or a Damascene caravan."
 nd_out_grove_of_matariya: "The Grove of Matariya"
 nd_out_grove_of_matariya_desc: "One walled garden north of Cairo, watered from a single spring, producing the balsam that both the Latin and the Coptic churches needed for chrism. Marino Sanuto recorded that at Epiphany Christians and Muslims washed together at the well where the Virgin was said to have washed the child's clothes. The Virgin's Tree stood in it, and Latin pilgrims went out of their way to see it."
 nd_out_customs_of_the_narrow_sea: "Customs of the Narrow Sea"
 nd_out_customs_of_the_narrow_sea_desc: "A tariff assessed at Suez, at Qusayr and at the Gate of Tears on a trade the crown protects rather than owns. The convoy pays because the escort is worth more than the duty."
 nd_out_convoy_of_the_karim: "The Convoy of the Karim"
 nd_out_convoy_of_the_karim_desc: "A karim was a convoy, not a company: ships sailing together on the season with an escort. The crown's escort now sails with the pepper fleet, and the empire's revenue depends on it arriving."
 nd_out_brocade_of_the_tiraz: "The Brocade of the Tiraz"
 nd_out_brocade_of_the_tiraz_desc: "Gold thread through the figured weave, and a court demand that keeps three towns of the Delta at their looms. The band still names the emperor, and it is still in Arabic."
 nd_out_cabinet_of_many_tongues: "The Cabinet of Many Tongues"
 nd_out_cabinet_of_many_tongues_desc: "The council stops being Latin. A realm that has governed for four centuries through the ra'is, the dragoman, the qadi and the bishop eventually seats them at the table, because it has run out of arguments for why they should stand behind the chair."
 nd_out_free_port_of_acre: "The Free Port of Acre"
 nd_out_free_port_of_acre_desc: "Acre declared free of transit duty, on the calculation that the empire earns more from the traffic than it ever collected from the tariff. The communes lose the value of their exemption on the same day, which is not a coincidence."
 nd_out_markets_of_the_road: "Markets of the Road"
 nd_out_markets_of_the_road_desc: "A provision market at every station of the pilgrim road, stocked year round. What was built as a devotional obligation turns out to be a working supply chain across two deserts, and an army that marches it never goes hungry."
 nd_out_castles_redeemed: "The Castles Redeemed"
 nd_out_castles_redeemed_desc: "Fortress by fortress, at prices the orders name, the crown buys back the castellany it granted away four centuries earlier. The brethren stay as garrison and the keys change hands."
 nd_out_capitation_abolished: "The Capitation Abolished"
 nd_out_capitation_abolished_desc: "The head tax on non-Latin subjects, older than the crusade and inherited without a change of column, is struck off the roll. It is the logical end of a state built on protecting other people's faiths, and it costs more than any other reform the empire has ever made."
 nd_out_one_law_for_all: "One Law for All"
 nd_out_one_law_for_all_desc: "Six legal systems reduced to one jurisdiction, six centuries after the Haute Cour first told a Syrian plaintiff that it could not hear him."
 nd_out_the_outremerins: "The Outremerins"
 nd_out_the_outremerins_desc: "Outremer means overseas. It was a name given by people in France to describe somewhere else. By now nobody in it is from anywhere else, the Latin spoken here has an accent no Parisian recognises, and the word has quietly stopped meaning abroad and started meaning home."
 nd_out_agency_of_steam: "The Agency of Steam"
 nd_out_agency_of_steam_desc: "Steam on the Red Sea. A convoy that took a season takes a fortnight, the wind ceases to rule the calendar, and the old Karimi houses become an agency of the crown with a schedule instead of a season."
 nd_out_registry_of_the_fonde: "The Registry of the Fonde"
 nd_out_registry_of_the_fonde_desc: "The market court keeps a register instead of a memory: contracts, weights, conversions of coin, and the standing of every witness of every faith who has ever sworn before it."

# === Units ===
 a_nd_out_maronite_crossbow: "Maronite Crossbowmen"
 a_nd_out_maronite_crossbow_desc: "Mountain marksmen from the Lebanon above Tripoli and Beirut, shooting the crossbow in the Italian manner. Deadly on their own slopes and brittle once broken in the open."
 a_nd_out_camel_train: "Camel Train"
 a_nd_out_camel_train_desc: "Bedouin contractors and their beasts, hired at negotiated rates. They cross deserts that stop wagons, carry more than they weigh, and will not fight for you under any circumstances."
 n_nd_out_red_sea_galley: "Red Sea Galley"
 n_nd_out_red_sea_galley_desc: "Built from timber carried in over land, so smaller and more lightly gunned than a Mediterranean hull. It exists to close the Gulf of Aqaba and the Gate of Tears, and it is very good at it."
 a_nd_out_confraternity_militia: "Confraternity Militia"
 a_nd_out_confraternity_militia_desc: "The sworn brotherhoods of the port cities under their own banners and their own elected constables. They will hold their walls against anything and complain the whole way to any other war."
 n_nd_out_pilgrim_galley: "Pilgrim Galley"
 n_nd_out_pilgrim_galley_desc: "A passenger hull on the Jaffa run: deep water tanks, provision for a full season, room for six hundred pilgrims and almost no guns."
 n_nd_out_karim_escort: "Karim Escort"
 n_nd_out_karim_escort_desc: "The crown's escort for the pepper convoy from Aden. Fewer guns and a smaller crew than a line ship, because it must carry water for the Red Sea run, and a presence out of all proportion to its broadside."

# === Levies ===
 levy_nd_out_maronite_crossbow: "Maronite Muster"
 levy_nd_out_maronite_crossbow_desc: "The crossbow levy of the Lebanese highlands, raised from the Levantine communities of the mountain."
 levy_nd_out_confraternity: "Confraternity Muster"
 levy_nd_out_confraternity_desc: "The armed brotherhoods of the port cities, called out from their halls by their own constables."

# === Buildings ===
 nd_out_rais_house: "The Ra'is's House"
 nd_out_rais_house_desc: "The headman's house at the edge of the village: a better roof, a larger orchard, and the only authority in the place that the tenants actually recognise. The crown's dragoman comes here to be told what the harvest was."
 nd_out_sanctuary_wardenship: "Wardenship of the Sanctuary"
 nd_out_sanctuary_wardenship_desc: "A guardhouse, a stipend and a standing order at the gate of a shrine that belongs to someone else. Pilgrims pass. Missionaries do not."
 nd_out_cour_de_la_fonde: "Court of the Fonde"
 nd_out_cour_de_la_fonde_desc: "The market court, sitting on a bench of two Frankish jurors and four Syrian, hearing pleas of weight, coin and contract between merchants of four religions who have no other tribunal in common."
 nd_out_hajj_station: "Station of the Pilgrim Road"
 nd_out_hajj_station_desc: "A cistern, a walled enclosure, a small garrison and a provision market at a day's march from the last one, kept up at the crown's expense for travellers going to a shrine the crown does not venerate."
 nd_out_ayla_yard: "The Yard at Ayla"
 nd_out_ayla_yard_desc: "Frames and planking arrive by camel from the Levant and go into the water on a sea that has no forest of its own. Every keel laid here is an act of logistics before it is an act of shipbuilding."
 nd_out_karimi_house: "House of the Karimi"
 nd_out_karimi_house_desc: "A merchant compound with warehousing, a counting room, a mosque and a cistern, run by families whose credit reaches Calicut. The crown's officer sits at the gate with the tariff and the escort roster."
 nd_out_tiraz_house: "The Tiraz House"
 nd_out_tiraz_house_desc: "The state weaving house of the Delta: flax, dyeworks, and a loom set aside for the inscribed band that names the ruler in the script of the weavers who make it."
 nd_out_balsam_garden: "The Balsam Garden of Matariya"
 nd_out_balsam_garden_desc: "A walled grove outside Cairo, watered from one spring, tapped with iron blades. Its balsam went into the chrism of two churches, and its well drew pilgrims of three faiths at Epiphany."

# === Production Methods ===
 nd_out_rais_maintenance: "Headman's Account"
 nd_out_rais_maintenance_desc: "Ink, bread and oil for the man who tells the crown what the village produced, and for the scribe who writes it down."
 nd_out_wardenship_maintenance: "The Warden's Stipend"
 nd_out_wardenship_maintenance_desc: "Lamp oil, incense for the shrine's own rite, and the paper the warden's reports are written on."
 nd_out_fonde_maintenance: "The Fonde's Bench"
 nd_out_fonde_maintenance_desc: "Registers, the jurors' robes and the oil for the lamps that keep the market court sitting after dark."
 nd_out_fonde_registry: "The Fonde's Registry"
 nd_out_fonde_registry_desc: "Bound volumes, a sealed copy for each party, and wine for the witnesses. Every contract in the market now exists twice."
 nd_out_station_maintenance: "The Station's Cistern"
 nd_out_station_maintenance_desc: "Grain and beasts for the garrison, and stone for the cistern that is the only reason the next stage of the road is survivable."
 nd_out_station_market: "The Station's Market"
 nd_out_station_market_desc: "A stocked provision market at the well: grain, meat, salt and cloth, sold at posted prices to a hundred thousand travellers a year."
 nd_out_ayla_maintenance: "The Ayla Slipway"
 nd_out_ayla_maintenance_desc: "Timber hauled in over land, tar for the seams and cordage from the Levant, because nothing that floats grows within a hundred leagues of this shore."
 nd_out_karimi_maintenance: "The Karimi Counting Room"
 nd_out_karimi_maintenance_desc: "Pepper, aromatics and bale cloth moving through the warehouse on the season's account."
 nd_out_karim_convoy: "The Karim Convoy"
 nd_out_karim_convoy_desc: "The season's fleet sails together under escort: pepper and cloves out of Aden, aromatics from the Hadhramaut, and the cordage and pitch that keep the escort at sea."
 nd_out_steam_agency: "The Steam Agency"
 nd_out_steam_agency_desc: "Coal bunkers at Suez, Qusayr and Aden, a machine shop at each, and a printed schedule where there used to be a sailing season."
 nd_out_balsam_maintenance: "The Balsam Tapping"
 nd_out_balsam_maintenance_desc: "Iron blades, lamp oil and the incense the grove's own chapel burns. The sap is gathered a drop at a time between the feasts."
 nd_out_tiraz_linen: "Tiraz Linen"
 nd_out_tiraz_linen_desc: "Delta flax spun fine and dyed, with an inscribed band woven into the border naming the reigning emperor."
 nd_out_tiraz_brocade: "Tiraz Brocade"
 nd_out_tiraz_brocade_desc: "Figured weave with gold thread through the ground, made for the court, for embassies and for the robes of honour the crown gives its own qadis."

# === Destiny: advances ===
 nd_out_destiny: "The Realm Overseas"
 nd_out_destiny_desc: "The clerks finish the first general survey of the empire since the crusade and the number at the bottom of it has not moved: the crown's own church is a minority among the crown's own subjects, and by the terms on which this crown was proclaimed it always will be. What has changed is that the realm is quiet. Hold that quiet, and the empire may begin to ask what it is for."
 nd_out_dest_assises_in_armenian: "The Assises in Armenian"
 nd_out_dest_assises_in_armenian_desc: "In 1265 Smbat Sparapet, constable of Cilician Armenia, translated the Assises of Antioch into Armenian for a court that was neither Frankish nor Latin. The French original is lost, so the law of Frankish Antioch survives only in that translation. Take Sis and Tarsus, bring the realm's development up to the weight of the ground it stands on, and the compact acquires its first bench outside the founding realm: a kingdom with its own catholicos, its own barons and its own written law, holding all three under your crown."
 nd_out_dest_six_scripts: "The Press of Six Scripts"
 nd_out_dest_six_scripts_desc: "Every statute this empire passes is valid in six jurisdictions and has to reach each of them in the language its bench pleads in. Embrace the printing press, build the treasury and the development to pay for a chancery that prints in Latin, Greek, Arabic, Syriac, Hebrew and Armenian, and the compact stops depending on how fast scribes can copy. The permanent price is what Christendom makes of a Catholic emperor who licenses type for other people's scripture."
 nd_out_dest_charter_of_the_nations: "The Charter of the Nations"
 nd_out_dest_charter_of_the_nations_desc: "The final form of the compact: a written charter for every community in the empire, naming its bench, its quarter and its worship, registered in the Livre and enforceable in court. Take Sultaniyya, where a Latin archbishopric was erected in 1318 with a nominal province covering all of Asia, embrace the enlightenment, and carry the realm's development and your own standing to the height the register implies. A community that holds a charter can also be granted a quarter to keep it in."
 nd_out_dest_crossing_at_aydhab: "The Crossing at Aydhab"
 nd_out_dest_crossing_at_aydhab_desc: "Aydhab had no water, no field and no reason to exist except the wind. The Egyptian pilgrimage came down the Nile to Qus, crossed the desert by camel and took ship here for Jeddah, and the Karimi pepper came back the other way in the same hulls. Take Aydhab and Suakin with a treasury behind you, and both shores of the pilgrim sea answer to Jerusalem: the crossing escorted, the water sold at a posted price, and a percentage of a journey the emperor may not make."
 nd_out_dest_customs_at_hormuz: "The Customs at Hormuz"
 nd_out_dest_customs_at_hormuz_desc: "There has always been a second road. Cargo that does not want the Red Sea takes the Gulf: Hormuz to Basra, Basra up the Euphrates, Aleppo and the sea, without passing one customs house of yours. Take Hormuz and Masqat, with the money to keep a squadron on them, and the eastern trade sits inside a single tariff for the first time since Rome. The permanent price is a field army that is always the second call on the treasury."
 nd_out_dest_pepper_and_bread: "The Pepper and the Bread"
 nd_out_dest_pepper_and_bread_desc: "The two halves of the guardianship, finished together. Put your factors ashore at Kozhikode where the pepper grows and at Diu where the pilgrim fleets of Gujarat load, keep pepper moving through your own markets, and hold the treasury to pay for both. The office then means what it has always actually meant: the crown that feeds Mecca and Medina out of Egyptian wheat at its own expense is the guardian of the sanctuaries, whatever the style says."

# === Destiny: events ===
 nd_out.7.t: "The Realm Overseas"
 nd_out.7.d: "The clerks of the secrete bring up the first general survey of the empire since the crusade. Twelve volumes, six of them in Arabic.\n\nThe number at the bottom has not moved. Fewer than two in ten of your subjects hear mass in Latin. Nothing done since the coronation has changed that, and by the terms on which this crown was proclaimed, nothing lawful will.\n\nWhat has changed is that the realm is quiet. Not converted and not cowed: quiet, the way a market is quiet when everyone in it expects to be paid. That quiet was bought with wardens' stipends, garrisoned cisterns, benches you do not sit on, and a poll tax collected in exchange for protection you actually provide.\n\nThe treasurer asks what the empire is for. It is a fair question, and it is now yours to answer."
 nd_out.7.a: "Set the survey on the table and begin"
 nd_out.8.t: "The Assises in Armenian"
 nd_out.8.d: "Sis sends its constable rather than its king, and he arrives with a manuscript instead of a treaty.\n\nIt is the Assises of Antioch, the law of the Frankish principality, put into Armenian by Smbat Sparapet in 1265 for a court that was neither Frankish nor Latin and had simply asked for a copy. The French original is gone: burned, lost, or never copied again. What lies on your table is the only surviving text of that law, and it survives because a foreign kingdom thought it worth writing down.\n\nHis proposal is plain. Cilicia comes under the compact. The catholicos keeps his church, the barons keep the Assises in the form they already hold them, and the Livre at Acre gains a bench it must be recopied to name.\n\nYour own jurists observe, without pleasure, that the empire is about to be taught its law by a translation."
 nd_out.8.a: "Copy the Livre again, and name the bench at Sis"
 nd_out.9.t: "The Press of Six Scripts"
 nd_out.9.d: "The founder has cast the type and laid it out on the chancery floor: Latin, Greek, Arabic, Syriac, Hebrew and Armenian, six alphabets in six frames, cut here.\n\nThe administrative case is unanswerable. Every statute this empire passes is valid in six jurisdictions and must reach each in the language its bench pleads in. Scribes take a year and disagree with one another. The press takes a fortnight and does not.\n\nThe Latin clergy have worked out the rest of it already. Type that can set the Livre in Hebrew can set the Talmud in Hebrew. Type cut for the qadi's copy of the customs can set the Qur'an. The archbishop of Tyre asks in writing whether the crown intends to print the errors of the infidel at public expense.\n\nThe founder is waiting to be told how many presses to build."
 nd_out.9.a: "License a press for every script"
 nd_out.9.b: "The chancery keeps the type"
 nd_out.10.t: "The Charter of the Nations"
 nd_out.10.d: "The registry is finished. Four hundred and eleven communities: the qadi courts of Aleppo and Cairo, the Shia of the lower Euphrates, the Copts, the Jacobites, the catholicos of the Church of the East at Baghdad, the Maronites of the mountain, the Armenians of Sis, the Samaritans of Nablus, the Mandaeans of the marsh, the Jews of nine cities, the Druze of the Hawran, the Zaydis of the highlands. Each with a bench, a quarter and a schedule of what it owes.\n\nThe chancery has drawn the charters. What it cannot draw is the sentence they turn on.\n\nA charter the community holds is a right, and it may be pleaded against the crown in the crown's own court. A charter the crown grants is a favour, and it may be taken back. The words on the page are almost identical. Nothing else about this empire will be."
 nd_out.10.a: "They hold their charters. Let them plead them."
 nd_out.10.b: "We grant the charters. We keep the granting."
 nd_out.11.t: "The Crossing at Aydhab"
 nd_out.11.d: "Aydhab has no water, no field and no reason to exist except the wind. The pilgrimage comes down the Nile to Qus, crosses the eastern desert on hired camels, and takes ship here for Jeddah in hulls sewn with coir and steered by men who know the reefs from memory. The Karimi pepper comes back in the same bottoms.\n\nIbn Jubayr crossed here in 1183 and wrote that the shipmasters stowed their passengers like crates, on the reasoning that the master was responsible for the vessel and God was responsible for everyone in it.\n\nBoth shores now answer to Jerusalem. The pilgrims are counted, the water is sold at a posted price, the crossing sails under escort, and a Catholic emperor takes his percentage of a journey he is not permitted to make."
 nd_out.11.a: "Post the price of water and the sailing dates"
 nd_out.12.t: "The Customs at Hormuz"
 nd_out.12.d: "There has always been a second road. Cargo out of Malabar that does not want the Red Sea takes the Gulf: Hormuz to Basra, Basra up the Euphrates, and overland to Aleppo, where it reaches the Mediterranean without passing one customs house of yours.\n\nHormuz has fallen, and Masqat with it. For the first time since Rome the whole eastern trade sits inside a single tariff, and it is yours.\n\nThe admiral wants the revenue spent where it was earned: hulls, crews and a squadron kept permanently on the strait, because a road is only closed while somebody is sitting on it. The Karimi houses want the customs farmed to them for a fixed sum paid in advance, and observe that they keep factors in every port on both roads while the crown keeps clerks in none of them."
 nd_out.12.a: "Hold the strait with the fleet"
 nd_out.12.b: "Farm the customs to the houses"
 nd_out.13.t: "The Pepper and the Bread"
 nd_out.13.d: "Two ledgers arrive in the same week.\n\nThe first comes from Kozhikode, where your factors now keep a house, a scale and leave to buy. Pepper at the tree costs a fraction of pepper at Aden, and the difference is the largest single figure this empire has ever entered.\n\nThe second is the grain account for Mecca and Medina. Neither city can feed itself and neither ever could. The wheat goes from Egypt down the Nile to Qus, across the desert to the sea and into Jeddah, against an endowment paid out of the Egyptian treasury for six centuries under four dynasties, and now out of yours. It earns nothing. It is the whole reason the style Guardian of the Two Sanctuaries means anything to the people it names.\n\nThe season is short. One fleet sails first."
 nd_out.13.a: "The factors sail first. Buy at the tree."
 nd_out.13.b: "The grain sails first. Feed the two cities."

# === Destiny: timed modifiers ===
 STATIC_MODIFIER_NAME_nd_out_dest_presses_licensed: "The Presses Licensed"
 STATIC_MODIFIER_DESC_nd_out_dest_presses_licensed: "Six presses in six scripts, licensed and taxed like any other trade. The statutes reach every bench in the language it pleads in, and within a decade the same houses are printing psalters, primers, commentaries and a great deal that no bishop asked for. The archbishop of Tyre keeps a list of it and reads from the list."
 STATIC_MODIFIER_NAME_nd_out_dest_chancery_hand: "The Chancery's Hand"
 STATIC_MODIFIER_DESC_nd_out_dest_chancery_hand: "The type stays inside the palace. Statutes, registers, safe conducts and tariff schedules come off the crown's own press in six alphabets and nothing else does. The administration has never been so exact, and the reading public is precisely as large as the crown requires it to be."
 STATIC_MODIFIER_NAME_nd_out_dest_communities_seated: "The Communities Seated"
 STATIC_MODIFIER_DESC_nd_out_dest_communities_seated: "The charters are rights. Each community's bench is named in the Livre and its charter may be pleaded against the crown in the crown's own court, which happens in the third year and is decided against the crown. The realm has never held together better. Its wars, in consequence, belong to nobody in particular."
 STATIC_MODIFIER_NAME_nd_out_dest_charters_revocable: "Charters at the Crown's Pleasure"
 STATIC_MODIFIER_DESC_nd_out_dest_charters_revocable: "The charters are favours. Every community holds its law by grant, revocable at the crown's pleasure, with a governor seated nearby to make the point without making it aloud. Business is transacted quickly and quietly, and every succession is now a question rather than a formality."
 STATIC_MODIFIER_NAME_nd_out_dest_strait_held: "The Strait Held"
 STATIC_MODIFIER_DESC_nd_out_dest_strait_held: "A squadron on Hormuz, a squadron on the Gate of Tears, and the season's convoys sailing between them under escort. No cargo reaches the Mediterranean by any road the empire does not assess. The field army learns that it is the second call on this treasury and that there is no third."
 STATIC_MODIFIER_NAME_nd_out_dest_customs_farmed: "The Customs Farmed"
 STATIC_MODIFIER_DESC_nd_out_dest_customs_farmed: "The customs of both seas are leased to the houses that already know every factor on the route, for a fixed sum paid in advance. The treasury has never been so liquid so early in the year, and the coin of two oceans arrives faster than the realm's markets can absorb it."
 STATIC_MODIFIER_NAME_nd_out_dest_factors_at_the_source: "Factors at the Source"
 STATIC_MODIFIER_DESC_nd_out_dest_factors_at_the_source: "A house, a scale and a standing price under the pepper trees, with the crown's own hulls on the ocean run and a yard at each end of it. Every seaman in the empire is on that run, and the recruiting sergeants at home are talking to an empty street."
 STATIC_MODIFIER_NAME_nd_out_dest_bread_of_the_two_cities: "The Bread of the Two Cities"
 STATIC_MODIFIER_DESC_nd_out_dest_bread_of_the_two_cities: "The grain fleet sails first, every season, at the crown's expense and for no return whatever. Mecca and Medina eat, and every power from the Maghreb to Gujarat whose subjects wish to make the journey discovers that it has business with Jerusalem."

# === Destiny: buildings ===
 nd_out_dest_chartered_quarter: "The Chartered Quarter"
 nd_out_dest_chartered_quarter_desc: "A walled compound inside the crown's own port with its own gate, oven, bath, cistern, house of worship and bench, granted to a community by charter and registered in the Livre. The Italians bought theirs with fleets. These are issued."
 nd_out_dest_granary_of_two_cities: "The Granary of the Two Cities"
 nd_out_dest_granary_of_two_cities_desc: "Vaults above the landing at Jeddah and Yanbu, holding the Egyptian wheat that feeds Mecca and Medina. The endowment has been paid by four dynasties in six centuries and none of them ever recovered a coin of it, which is precisely why the office was worth holding."

# === Destiny: production methods ===
 nd_out_dest_quarter_maintenance: "The Quarter's Charter"
 nd_out_dest_quarter_maintenance_desc: "Registers for the bench, cloth for the community's own officers, and oil for the gate lamp that is lit at the community's hours rather than the crown's."
 nd_out_dest_granary_maintenance: "The Endowment's Account"
 nd_out_dest_granary_maintenance_desc: "Wheat and beasts bought at the Egyptian price, and cordage and canvas for the ships that carry them down a sea with no harvest of its own."

# === Destiny: event option tooltips ===
 nd_out.7.a_tt: "The realm is quiet and the survey says why. Now decide what the quiet is for."
 nd_out.8.a_tt: "Cilicia comes under the compact, catholicos, barons, Assises and all."
 nd_out.9.a_tt: "Six licensed presses, and a Latin church that reads every list of what they print."
 nd_out.9.b_tt: "The crown prints the statutes and nobody prints anything else."
 nd_out.10.a_tt: "The charters are rights, pleadable against the crown, and the empire's wars are nobody's."
 nd_out.10.b_tt: "The charters are favours, and every succession reopens the question."
 nd_out.11.a_tt: "Both shores of the pilgrim sea, the crossing escorted and the water priced."
 nd_out.12.a_tt: "A squadron on the strait, and a field army told it comes second."
 nd_out.12.b_tt: "The customs leased for cash in advance, and more coin than the markets can take."
 nd_out.13.a_tt: "Pepper bought at the tree, with every seaman in the empire on that run."
 nd_out.13.b_tt: "The two cities are fed at the crown's expense and every power writes to Jerusalem."

# ===== BUREAUCRACIES =====
 out_cour_des_suriens_bureaucracy: "The Court of the Syrians"
 out_cour_des_suriens_bureaucracy_desc: "The Franks judged their own and left everyone else their own bench. The Cour des Syriens sat under the ra'is of the native Christians; the Muslims kept the qadi, the Jews the bet din, and the law followed the person rather than the ground: the Jew swore on the Torah, the Samaritan on the Pentateuch, the Muslim on the Qur'an, the Christian on the Gospels. The jurists of Acre named these subordinate courts when they wrote the Livre des Assises between 1240 and 1244. A crown that is a minority among its own subjects governs by guaranteeing other people's judges, and the price is a jurisdiction it will never hold."
 out_cour_de_la_chaine_bureaucracy: "The Court of the Chain"
 out_cour_de_la_chaine_bureaucracy_desc: "The catena was the chain that closed the harbour of Acre and the customs house that stood beside it, and the Cour de la Chaine was the court that sat there. A bailli presided for the lord over the pleas of mariners and shippers without judging them himself, and the tariff was assessed on every hull that came under the chain. Its procedure was set down at Acre between 1240 and 1244, alongside that of the market court of the Fonde. Every Italian commune in the port claimed exemption from it, which is the whole argument of the Latin East contained in one building."
 out_charters_of_the_communes_bureaucracy: "The Charters of the Communes"
 out_charters_of_the_communes_bureaucracy_desc: "The Pactum Warmundi of 1123 gave Venice a third of Tyre with its own church, oven, bath, weights, court and gallows, and Genoa and Pisa took comparable quarters at Acre over the next century. Venice claimed over every resident of its quarter the same jurisdiction and taxation the king held over his own subjects; Baldwin II refused to concede they were autonomous, and the treaty ran until 1291 regardless. They are why the realm has shipping at all. In 1256 two of them fought the War of Saint Sabas inside the kingdom's own capital, with towers and siege engines, while the crown watched from behind a wall it had granted away."
 out_turcopolier_bureaucracy: "The Office of the Turcopolier"
 out_turcopolier_bureaucracy_desc: "Turcopoles were light horse and mounted archers raised in the East, from Syrian, Greek and Armenian Christians and from Turks who had come over, and Byzantine turcopoles riding with Tatikios on the First Crusade gave the Franks the model. They had a commander of their own, the Turcopolier, who outranked the sergeants in the field, and both the Temple and the Hospital kept the office among their senior dignities. They gave a Frankish army the one thing its knights could not do, which was ride light and ride far. Saladin had the captured ones put to death after Hattin in 1187 as apostates, and the Latin clergy of the realm never quite stopped agreeing with him."
 out_new_towns_bureaucracy: "The New Towns"
 out_new_towns_bureaucracy_desc: "Magna Mahumeria, now al-Bira, stood sixteen kilometres north of Jerusalem and was planted by the canons of the Holy Sepulchre on one of the twenty-one casalia Godfrey of Bouillon had granted them. Ninety-two burgesses swore allegiance there in 1156 and fifty more over the following thirty years, settlers out of southern France, Italy and Spain, holding in burgage tenure for a tithe and a share of the crop, with three smiths, three carpenters, a mason, a shoemaker and a goldsmith among them. Parva Mahumeria and Bethgibelin were the same instrument. It is the only lawful way this crown can change the arithmetic of its own realm: bring people in rather than convert the people already there."
 out_restor_of_the_host_bureaucracy: "The Restor of the Host"
 out_restor_of_the_host_bureaucracy_desc: "In the kingdom of Jerusalem the crown owed a knight a fresh horse for one killed or crippled in its service, an obligation called the restor, and captured Arab horses were crown spoil redistributed through it to knights and turcopoles who had lost their mounts. Europe had no equivalent because Europe could breed its own warhorses and the Latin East could not, so the restor was the difference between a host that could survive a mauling and one that simply ended. The constable's court administered the claims. Its arrears were a standing baronial grievance for two centuries."

# Tooltip for the New Towns prerequisite (formation settlement three)
 out_new_towns_path_c_tt: "The coronation founded the new towns on the Jerusalem road."

# The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_out_bureaucracy_authority: "The Apparatus Overseas"
 AUTO_MODIFIER_DESC_nd_out_bureaucracy_authority: "A Latin crown over a majority it may not convert governs through offices it did not invent, courts it does not own and quarters it granted away. Alongside the capital's standing slot, Outremer may maintain two further institutions of its choosing, out of the native benches, the harbour court, the communes' charters, the Turcopolier's command, the planted new towns and the crown's standing debt in horses."
