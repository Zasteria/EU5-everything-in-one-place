l_english:

 # Game Rule
 rule_nd_danube_succession_rule: "National Destinies Succession of the Danube"
 setting_nd_danube_succession_enabled: "Enabled"
 setting_nd_danube_succession_enabled_desc: "The [ShowSituationName('nd_danube_succession')] [situation|e] opens among Austria, Hungary and Bohemia once their dynasties intertwine, and at the latest after 1437. Pacts, betrothals and a Congress of the Danube decide which crown unites the three. An AI crown that wins the question founds the Danubian Monarchy."
 setting_nd_danube_succession_disabled: "Disabled"
 setting_nd_danube_succession_disabled_desc: "The [ShowSituationName('nd_danube_succession')] [situation|e] never opens. The Danubian Monarchy can still be formed by whoever holds the three crowns by marriage, subjection or conquest. An AI country founds it only under the AI Forms Nations rule, once it meets those requirements on its own."
