l_english:

 # ==========================================================================
 # Occitania (OCC): National Destinies
 # ==========================================================================

 # --- Formation event ------------------------------------------------------
 nd_occ.1.t: "The Country of Written Law"
 nd_occ.1.d: "From the Rhone to the Adour, from the Auvergne down to the Pyrenean watershed, one language is spoken and one kind of law is kept. Here a man's right is written down. The consuls of every town hold a charter in a chest; the viscounts of Bearn swear to the fors before the fors are sworn to them; the notaries copy Justinian and the north copies nobody. Two crowns claim this ground and neither has ever governed it, and now they are at war over Gascony and have other things to think about.\n\nWhat is being founded here is not in doubt. How it holds together is.\n\nToulouse would say that a country is the sum of its charters: that authority rises out of the sworn customs of the towns and the valleys, and that a prince is the man who ratifies them. Orthez would say something else. When Philip of Valois summoned Gaston Febus to his war, the count answered that he would do homage for Foix but that he held Bearn from God and from no man in the world, and he spent the next forty-eight years proving it by keeping both kings guessing.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_occ.1.a: "Lo Pacte Consular: the country is the sum of its charters"
 nd_occ.1.b: "Tenc de Degun: we hold from God and from no man"

 # --- nd_occ.2: the Leys d'Amors -------------------------------------------
 nd_occ.2.t: "The Laws of Love"
 nd_occ.2.d: "Fourteen years before the crowns went to war, seven burgesses of Toulouse announced that on the first of May they would give a golden violet to whoever brought them the best canso in the language of oc. They have done it every year since. It is the only literary competition in Europe with a permanent jury and a written rule book, and Guilhem Molinier has spent a decade turning that rule book into something larger: a grammar, a treatise of rhetoric, a prosody. He calls it the Leys d'Amors, the Laws of Love, and it is the first attempt anyone in Europe has made to legislate for a vernacular the way a jurist legislates for a city.\n\nThe chancellors are asking what the Leys are for. A canon that fixes the language, or a rule of the contest and nothing more?"
 nd_occ.2.a: "Fix the language. One grammar, one spelling, one canon."
 nd_occ.2.b: "Judge the verse, not the dialect. Keep the contest open."

 # --- nd_occ.3: the registers of Pamiers ------------------------------------
 nd_occ.3.t: "The Registers of Pamiers"
 nd_occ.3.d: "There is no Cathar church left. Montsegur fell in 1244 and the two hundred who would not recant walked down into the fire at the foot of the rock. Guilhem Belibaste, the last perfectus anyone can name, was burned at Villerouge-Termenes in 1321. What survives is paperwork.\n\nJacques Fournier, bishop of Pamiers, spent seven years interrogating the shepherds of Montaillou and writing all of it down: what they ate, whose bed they slept in, what they thought happened after death. In 1334 the cardinals at Avignon elected him pope. His register sits in the episcopal archive, and beside it sit the confiscation rolls of the crusade, which record in the same careful hand exactly which Occitan family lost which fief and which northern lineage received it.\n\nThe archive is now yours. So is the question of what to do with it."
 nd_occ.3.a: "Open the confiscation rolls. Every title will be produced."
 nd_occ.3.b: "Let the dead bury the dead. Close the archive and move on."

 # --- nd_occ.4: Orthez, 1347 ------------------------------------------------
 nd_occ.4.t: "From God and From No Man"
 nd_occ.4.d: "The summons arrives at Orthez in the usual form. The king of France requires the service of his vassal the count of Foix, with all his men, for the war in the north.\n\nThe answer that goes back is careful and completely unyielding. For Foix, homage: the count holds Foix of the crown and does not pretend otherwise. For Bearn, nothing. Bearn is held of God, not of any man in the world, and Bearn will be neutral. Gaston, who signs himself Febus and has taken the sun for his device, then spends the rest of his life making the position pay: taking English money and French money in turn, fortifying Montaner and Mauvezin against both, and writing a book about hunting while everyone around him is ruined by a war he declined to join.\n\nThe device works only as long as somebody could enforce it. What is the doctrine to be?"
 nd_occ.4.a: "Armed neutrality: fortify the ridges and answer no summons"
 nd_occ.4.b: "Rent the sword to whichever crown is paying this season"

 # --- nd_occ.5: the plague at Montpellier ------------------------------------
 nd_occ.5.t: "The Surgeon's Hand"
 nd_occ.5.d: "Montpellier has taught medicine since Cardinal Conrad gave it a charter in 1220, out of Arabic and Jewish and Latin authorities together, and it is the first faculty of its kind in Europe. In the spring of 1348 the pestilence comes up the Rhone and the faculty discovers what its authorities are worth. Most of the masters die. Those who run are said to have run first.\n\nGuy de Chauliac, who came out of the Auvergne poor and took his degree here, does not run. He stays at Avignon through the whole of it, catches the disease, survives it, and writes down precisely what he saw, including the fact that he was frightened and that the physicians were useless. His Chirurgia Magna will be copied for two hundred years, largely because it admits how much its author did not know."
 nd_occ.5.a: "Record what we actually see, and dissect to see more"
 nd_occ.5.b: "Bar the gates: health boards, quarantine and burial law"

 # --- nd_occ.6: Sainte-Cecile of Albi ---------------------------------------
 nd_occ.6.t: "The Cathedral That Is a Keep"
 nd_occ.6.d: "Bernard de Castanet, bishop and inquisitor of Albi, laid the first brick in 1282 on a town that had been burned, fined and dispossessed within living memory. What he built has no flying buttresses, no west door and no windows a man could climb through. The walls are brick, five metres thick at the base, and rise straight out of the rock above the Tarn like a donjon. There is one entrance and it can be shut.\n\nTwo hundred years of masons finished it. Nothing in the Midi says more plainly what the conquest thought of the conquered, and nothing was more useful when the free companies came through and the village had nowhere else to put its grain and its children."
 nd_occ.6.a: "Every parish will wall its church"

 # --- nd_occ.7: Bernuy stands surety ----------------------------------------
 nd_occ.7.t: "Blue Gold"
 nd_occ.7.d: "Woad grows anywhere. It grows profitably in a triangle drawn between Toulouse, Albi and Carcassonne, and for a hundred years that triangle sells most of the blue in western Europe. The leaves are crushed under a millstone, rolled into balls called coques, dried on hurdles and ground again, and the whole country smells of it in the autumn.\n\nThe men who handle it build palaces. Jean de Bernuy, a converso out of Burgos who settled in Toulouse and dealt in nothing but woad, becomes rich enough that when Francois I is taken at Pavia and Charles V wants a ransom in gold, it is Bernuy who stands surety for a king of France. An English traveller writes home that the woad has made this the happiest and richest country in Europe.\n\nThe crown would like the pledge. The trade would like the capital."
 nd_occ.7.a: "Pledge the woad fortune. A king will remember it."
 nd_occ.7.b: "Keep the capital in the trade, where it earns"

 # --- nd_occ.8: indigo -------------------------------------------------------
 nd_occ.8.t: "The Devil's Dye"
 nd_occ.8.d: "It comes in through the Atlantic ports in barrels, a black cake from India and the Antilles that yields a deeper blue than woad from a tenth of the bulk. A dyer who has tried it does not go back.\n\nToulouse fights it in the one place it has always fought, which is the statute book. The dye is denounced from pulpits as a corrosive poison that rots the cloth. In 1598 the crown prohibits it in France on pain of death, and the prohibition is renewed and renewed and quietly ignored by every dyer with a customer. The woad country has perhaps two generations left, and it will spend them arguing that the law is on its side."
 nd_occ.8.a: "Prohibit the dye and enforce it in every port we hold"
 nd_occ.8.b: "Open the ports. Better our merchants sell it than theirs."

 # --- nd_occ.9: Villers-Cotterets --------------------------------------------
 nd_occ.9.t: "In the French Mother Tongue and No Other"
 nd_occ.9.d: "The ordinance is a hundred and ninety-two articles long and almost all of it is sensible reform: parish registers of baptism, a proper record of proceedings, an end to trial by written pleading alone. Article one hundred and eleven is four lines. All judgments, registers, enquiries, contracts and every other act of justice in the realm are to be pronounced, recorded and delivered to the parties in the French mother tongue and no other.\n\nIn a country where every notarial instrument for three hundred years has been drawn in Occitan, this is not a rule about spelling. The registers are the state. Whoever writes them decides what language the state thinks in, and the answer has just been settled in Paris."
 nd_occ.9.a: "Our registers stay in the tongue they were always kept in"
 nd_occ.9.b: "A bilingual chancery: every act drawn twice, in both"

 # --- nd_occ.10: Riquet -------------------------------------------------------
 nd_occ.10.t: "The Junction of the Two Seas"
 nd_occ.10.d: "Every engineer since the Romans had understood that a canal from the Garonne to the sea would be worth a fleet, and every one of them had failed on the same thing. Not the digging. The water. A canal must be highest in the middle, and there is nothing at the summit at Naurouze to fill it with.\n\nPierre-Paul Riquet, a tax farmer of Beziers with no formal training, solved it by walking the Montagne Noire and working out that the streams on its northern flank could be gathered by a rigole and carried thirty miles along the contour to the watershed. He was authorised in 1666, broke ground in 1667, employed twelve thousand people, mortgaged his lands, borrowed against his daughters' portions and died in October 1680 owing two million livres, seven months before the first convoy of twenty-five boats left Toulouse for the sea."
 nd_occ.10.a: "The water reached Naurouze. That was the whole problem."

 # --- nd_occ.11: the Desert ---------------------------------------------------
 nd_occ.11.t: "The Church of the Desert"
 nd_occ.11.d: "When the Edict of Nantes is revoked in 1685 the Cevennes do not convert and do not leave. They go up into the ravines and hold their assemblies there, which they call the Desert, and when the preachers are broken on the wheel their congregations start prophesying instead, children among them, in a French none of them otherwise speak.\n\nIn July 1702 they kill the abbe du Chayla at Pont-de-Montvert and the thing becomes a war. A few thousand shepherds and wool carders under Roland Laporte and Jean Cavalier tie down marshals of France for three years by striking at night, burning churches, and being back at the loom by morning. The country will not give them up. It has had three centuries of practice at not giving people up."
 nd_occ.11.a: "Let them preach in the ravines. Send nobody after them."
 nd_occ.11.b: "Impose the peace: garrison the valleys and end it"

 # --- nd_occ.12: Font-Segugne -------------------------------------------------
 nd_occ.12.t: "Seven Poets at Font-Segugne"
 nd_occ.12.d: "On the twenty-first of May 1854 seven young men meet at a country house near Avignon and resolve to give the language of oc a spelling, a dictionary and a literature again. They call themselves the Felibres. Frederic Mistral will spend twenty years on the dictionary and take the Nobel Prize for literature in 1904, and the Jeux Floraux at Toulouse, which have been judging verse in this language since 1324, will still be meeting to do it.\n\nThey disagree almost at once, and about exactly the thing the Consistori argued over five hundred years earlier. Write the language as the Rhone speaks it now, and be read? Or write it as the troubadours wrote it, and reunite a tongue that Paris has spent three centuries breaking into patois?"
 nd_occ.12.a: "Write it as it is spoken. A living tongue, or none."
 nd_occ.12.b: "Write it as the troubadours wrote it. One tongue again."

 # --- Event option tooltips ------------------------------------------------
 nd_occ.1.a_tt: "Sovereignty rises from the sworn charters of the towns and valleys."
 nd_occ.1.b_tt: "Sovereignty descends from a prince who does homage to nobody."
 nd_occ.2.a_tt: "The academy fixes one grammar and the notaries write to it."
 nd_occ.2.b_tt: "Any dialect that can win the violet is admitted to the contest."
 nd_occ.3.a_tt: "Every title granted out of the crusade confiscations is called in."
 nd_occ.3.b_tt: "The settlement of 1229 stands and the archive is sealed."
 nd_occ.4.a_tt: "Fortify the ridges, answer no summons, and be nobody's vassal."
 nd_occ.4.b_tt: "Raise companies and hire them out to whichever crown is paying."
 nd_occ.5.a_tt: "The faculty teaches from the case notes rather than the authorities."
 nd_occ.5.b_tt: "Consuls impose quarantine, health boards and burial law."
 nd_occ.6.a_tt: "Every parish walls its church and stores the harvest inside it."
 nd_occ.7.a_tt: "The woad fortune underwrites a king's ransom and is remembered for it."
 nd_occ.7.b_tt: "The fortune stays in the mills, the hurdles and the credit book."
 nd_occ.8.a_tt: "Indigo is seized and burned wherever our writ runs."
 nd_occ.8.b_tt: "The blue is sold through our warehouses whichever plant it came from."
 nd_occ.9.a_tt: "Acts of justice stay in the language the parties actually speak."
 nd_occ.9.b_tt: "Every act drawn twice, at double the clerkly labour."
 nd_occ.10.a_tt: "The canal is finished and the man who solved it is not there."
 nd_occ.11.a_tt: "The assemblies in the ravines are left alone."
 nd_occ.11.b_tt: "The valleys are garrisoned and the assemblies dispersed."
 nd_occ.12.a_tt: "Spell the language as it is spoken on the Rhone today."
 nd_occ.12.b_tt: "Spell it as the troubadours did and reunite the dialects."

 # ==========================================================================
 # Timed modifiers
 # ==========================================================================
 STATIC_MODIFIER_NAME_nd_occ_lo_pacte_consular: "Lo Pacte Consular"
 STATIC_MODIFIER_DESC_nd_occ_lo_pacte_consular: "Authority rises out of the sworn charters of the towns and valleys. The consulates govern, legislate and build, and the crown ratifies what it did not write."
 STATIC_MODIFIER_NAME_nd_occ_tenc_de_degun: "Tenc de Degun"
 STATIC_MODIFIER_DESC_nd_occ_tenc_de_degun: "A prince who holds of God and of no man in the world. Fortified, legitimate, impossible to summon, and trusted by nobody at all."

 STATIC_MODIFIER_NAME_nd_occ_canon_de_la_lenga: "Canon of the Language"
 STATIC_MODIFIER_DESC_nd_occ_canon_de_la_lenga: "One grammar, one spelling, one prize. The academy decides what the language is, and the notaries follow it."
 STATIC_MODIFIER_NAME_nd_occ_concors_dobert: "The Open Contest"
 STATIC_MODIFIER_DESC_nd_occ_concors_dobert: "The jury judges the verse and asks no questions about the dialect it arrived in. Poets come from Catalonia, Gascony and the Limousin alike."

 STATIC_MODIFIER_NAME_nd_occ_registres_dobertes: "The Rolls Reopened"
 STATIC_MODIFIER_DESC_nd_occ_registres_dobertes: "Every title granted out of the confiscations of the crusade is being produced and examined. The crown gains; the lineages planted on that land do not."
 STATIC_MODIFIER_NAME_nd_occ_patz_dels_mortz: "Peace of the Dead"
 STATIC_MODIFIER_DESC_nd_occ_patz_dels_mortz: "The archive is closed, the settlement stands, and the church has been paid for its blessing on both."

 STATIC_MODIFIER_NAME_nd_occ_neutralitat_armada: "Armed Neutrality"
 STATIC_MODIFIER_DESC_nd_occ_neutralitat_armada: "Every ridge garrisoned, every summons declined. A war fought by everyone else, over ground nobody dares enter."
 STATIC_MODIFIER_NAME_nd_occ_espasa_logada: "The Rented Sword"
 STATIC_MODIFIER_DESC_nd_occ_espasa_logada: "Companies raised in the Midi and hired out to whichever crown is paying, on terms renewed each campaigning season."

 STATIC_MODIFIER_NAME_nd_occ_man_del_cirurgian: "The Surgeon's Hand"
 STATIC_MODIFIER_DESC_nd_occ_man_del_cirurgian: "Observation written down without flattery, including what the physicians got wrong. The faculty teaches from the record, not the authority."
 STATIC_MODIFIER_NAME_nd_occ_portas_barradas: "Barred Gates"
 STATIC_MODIFIER_DESC_nd_occ_portas_barradas: "Health boards, quarantine terms and burial ordinances, enforced by consuls who would rather lose a season's trade than a quarter of the town."

 STATIC_MODIFIER_NAME_nd_occ_fianca_reiala: "Surety for a King"
 STATIC_MODIFIER_DESC_nd_occ_fianca_reiala: "A merchant house of Toulouse has underwritten the ransom of a king of France, and every court in Europe has been told about it."
 STATIC_MODIFIER_NAME_nd_occ_cabal_dels_pasteliers: "The Woad Merchants' Capital"
 STATIC_MODIFIER_DESC_nd_occ_cabal_dels_pasteliers: "The fortune stays in the trade that made it: more mills, more hurdles, more coques, and credit on terms nobody else in the province can get."

 STATIC_MODIFIER_NAME_nd_occ_prohibicion_de_l_indi: "Prohibition of Indigo"
 STATIC_MODIFIER_DESC_nd_occ_prohibicion_de_l_indi: "The foreign dye is denounced, seized and burned wherever it lands. The woad country has bought itself time and made enemies of every port that sells the other thing."
 STATIC_MODIFIER_NAME_nd_occ_ports_dobertz: "Open Ports"
 STATIC_MODIFIER_DESC_nd_occ_ports_dobertz: "If the blue is going to be sold, it will be sold through our warehouses and weighed on our scales."

 STATIC_MODIFIER_NAME_nd_occ_registres_en_lenga_nostra: "Registers in Our Own Tongue"
 STATIC_MODIFIER_DESC_nd_occ_registres_en_lenga_nostra: "The acts of justice are drawn in the language the parties actually speak. It is the country's own state and it is legible to nobody north of the Dordogne."
 STATIC_MODIFIER_NAME_nd_occ_cancelaria_bilingua: "The Bilingual Chancery"
 STATIC_MODIFIER_DESC_nd_occ_cancelaria_bilingua: "Every act drawn twice, in both tongues, at double the clerkly labour and half the ambiguity."

 STATIC_MODIFIER_NAME_nd_occ_glieisa_del_desert: "The Church of the Desert"
 STATIC_MODIFIER_DESC_nd_occ_glieisa_del_desert: "Assemblies in the ravines that nobody is sent to break up. The country has had three centuries of practice at not giving people up."
 STATIC_MODIFIER_NAME_nd_occ_patz_del_rei: "The King's Peace"
 STATIC_MODIFIER_DESC_nd_occ_patz_del_rei: "The valleys garrisoned, the assemblies dispersed and the prophets silenced. Quiet on the surface and nowhere underneath it."

 STATIC_MODIFIER_NAME_nd_occ_grafia_mistralenca: "The Mistralian Graphy"
 STATIC_MODIFIER_DESC_nd_occ_grafia_mistralenca: "Spell it as the Rhone says it. A literature that ordinary people can read aloud without being taught how."
 STATIC_MODIFIER_NAME_nd_occ_grafia_classica: "The Classical Graphy"
 STATIC_MODIFIER_DESC_nd_occ_grafia_classica: "Spell it as the troubadours did, so that Gascony, the Limousin and Provence turn out to have been writing the same language all along."

 # ==========================================================================
 # Variables
 # ==========================================================================
 nd_occ_formed_tt: "Occitania formed"
 nd_occ_path_a_tt: "Consular pact path chosen"
 nd_occ_path_b_tt: "Sovereign lordship path chosen"
 nd_occ_e1_done_tt: "The founding assembly has met"

 # ==========================================================================
 # Advances: Age 1
 # ==========================================================================
 nd_occ_consistori_del_gay_saber: "Consistori del Gay Saber"
 nd_occ_consistori_del_gay_saber_desc: "Seven burgesses of Toulouse founded a poetic academy in 1323 and offered a golden violet, the violeta d'aur, to the best canso brought before them each May. It is the oldest literary institution in the Western world and it was already meeting when this country was founded."
 nd_occ_leys_damors: "Leys d'Amors"
 nd_occ_leys_damors_desc: "Guilhem Molinier's grammar, rhetoric and prosody of the language of oc, compiled through the 1330s and given its definitive prose form in 1341. The first deliberate codification of a European vernacular by a body with the authority to enforce it."
 nd_occ_las_consolats: "The Consulates"
 nd_occ_las_consolats_desc: "Toulouse was governed by twenty-four elected consuls from 1147, called capitouls from 1295, and they left the count little more than his mint. From Montpellier to the smallest bastide, the Midi's towns ran themselves by charter."
 nd_occ_cartas_de_bastida: "Charters of the Bastides"
 nd_occ_cartas_de_bastida_desc: "Over three hundred planned towns founded across the Southwest by pareage contract, laid out on a grid around an arcaded square and settled by charters that sold liberty and tax relief to anyone willing to come."
 nd_occ_dreit_escrich: "Lo Dreit Escrich"
 nd_occ_dreit_escrich_desc: "South of the Charente the land runs on written Roman law recovered from the Justinianic corpus, not on remembered custom. Every transaction passes through a notary and leaves an instrument that will still be readable in three hundred years."
 nd_occ_bidaus: "Bidaus"
 nd_occ_bidaus_desc: "The light foot of the Pyrenean slope: javelins, a knife and no armour worth the name. Hired by both crowns to screen, raid and skirmish, and never asked to hold a line."
 nd_occ_erenca_catara: "The Cathar Inheritance"
 nd_occ_erenca_catara_desc: "The church is gone: Montsegur fell in 1244 and the last perfectus burned in 1321. What is inherited is a confiscation settlement, an inquisitorial archive, and a country that has learned to answer questions carefully and shelter whoever is being hunted."

 # ==========================================================================
 # Advances: Age 2
 # ==========================================================================
 nd_occ_de_diu_e_de_degun: "De Diu e de Degun"
 nd_occ_de_diu_e_de_degun_desc: "Gaston Febus told Philip VI in 1347 that he would do homage for Foix but held Bearn of God and of no man in the world. He kept his lands out of the war for forty-eight years by making both crowns bid for him."
 nd_occ_escola_de_montpelhier: "School of Montpellier"
 nd_occ_escola_de_montpelhier_desc: "Chartered in 1220 and confirmed in 1289, the first faculty of medicine in Europe, teaching from Arabic and Jewish authorities alongside Latin ones and unusually willing to say when its authorities were wrong."
 nd_occ_universitat_de_tolosa: "University of Toulouse"
 nd_occ_universitat_de_tolosa_desc: "Founded in 1229 as a term of the Treaty of Paris, paid for by the defeated count and chartered explicitly to train theologians who would extirpate heresy in the Midi. It became the Midi's own faculty of law."
 nd_occ_glieisas_fortalezas: "Fortified Churches"
 nd_occ_glieisas_fortalezas_desc: "Sainte-Cecile of Albi is a cathedral built as a keep by an inquisitor bishop over a town that had been dispossessed within living memory. Across the Midi the parish church became the village's last redoubt."
 nd_occ_estats_provincials: "The Provincial Estates"
 nd_occ_estats_provincials_desc: "Languedoc, Bearn, Foix, the Rouergue and the Quercy each voted their own taxes in their own assemblies, and in Bearn the lord swore to the fors before the estates swore to him."
 nd_occ_milicia_consulara: "Consular Militia"
 nd_occ_milicia_consulara_desc: "A chartered town owed its own defence. The capitouls commanded the companies of their own quarter, mustering crossbowmen and pavisiers by parish under the town's banner and no lord's."
 nd_occ_transumancia: "Transhumance"
 nd_occ_transumancia_desc: "Every summer the flocks walk the dralhas up onto the causses and the Cevennes and come down again in October, along rights of passage older than the lordships they cross."

 # ==========================================================================
 # Advances: Age 3
 # ==========================================================================
 nd_occ_pais_de_cocanha: "Pais de Cocanha"
 nd_occ_pais_de_cocanha_desc: "For a century the triangle of Toulouse, Albi and Carcassonne supplied most of the blue dye in western Europe. The balls of ground woad were called coques, and they gave the language its phrase for a land of plenty."
 nd_occ_parlament_de_tolosa: "Parlement of Toulouse"
 nd_occ_parlament_de_tolosa_desc: "Established in 1443, the first sovereign court erected outside Paris. It judged in last resort for the entire country of written law and its arrets bound every consulate and seigneurial court beneath it."
 nd_occ_draparia_lengadociana: "The Languedoc Drapery"
 nd_occ_draparia_lengadociana_desc: "Carcassonne, Limoux and Lodeve wove the wool that came down off the causses and dyed it with woad grown thirty miles away. A complete cloth industry inside one province."
 nd_occ_mordent_de_milhau: "The Mordant of Millau"
 nd_occ_mordent_de_milhau_desc: "No dye holds without alum, and the Midi digs its own. Grinding the dried coques to a granulated agranat with alum roughly doubles what a woad harvest is worth."
 nd_occ_bandas_de_gasconha: "Bands of Gascony"
 nd_occ_bandas_de_gasconha_desc: "One of the vieilles bandes from which the standing French infantry was built. Gascon foot were hired as arquebusiers because they shot well, outmarched their own baggage, and took service with whichever crown was paying."
 nd_occ_tartanas: "Tartanes of the Gulf"
 nd_occ_tartanas_desc: "The lateen coaster of the gulf of Lion: shallow enough for a silted lagoon harbour, cheap enough for a consulate to own a dozen, and fast enough downwind to outrun most of what wants to board her."
 nd_occ_lies_e_passarias: "Lies e Passarias"
 nd_occ_lies_e_passarias_desc: "The Pyrenean valleys made their own treaties across the watershed, guaranteeing pasture and non-belligerence whatever their kings were doing. The Traite de la Vache of 1375 has been performed every July since."

 # ==========================================================================
 # Advances: Age 4
 # ==========================================================================
 nd_occ_indi_contra_pastel: "Indigo against Woad"
 nd_occ_indi_contra_pastel_desc: "A tropical dye yielding a deeper blue from a tenth of the bulk destroys the woad economy in two generations. Toulouse fought it in the statute book and France prohibited indigo on pain of death in 1598, which changed nothing."
 nd_occ_edicte_de_castras: "The Chamber of the Edict"
 nd_occ_edicte_de_castras_desc: "A chamber of the Parlement seated at Castres with Catholic and Protestant judges in equal number, to try any cause where a Protestant was party. Not toleration as a favour but parity written into the bench."
 nd_occ_seda_de_las_cevenas: "Silk of the Cevennes"
 nd_occ_seda_de_las_cevenas_desc: "Olivier de Serres published the method in 1600 and the schist terraces of the Gard and the Lozere filled with mulberry and magnaneries, feeding the throwing mills and the weavers of Nimes."
 nd_occ_aiga_ardenta: "Aiga Ardenta"
 nd_occ_aiga_ardenta_desc: "Vital du Four of Eauze listed forty virtues of burnt wine in 1310. By the sixteenth century the Armagnac was distilled for sale and shipped down the Baise and the Garonne in Gascon oak."
 nd_occ_escalas_del_levant: "The Echelles of the Levant"
 nd_occ_escalas_del_levant_desc: "The capitulations of 1536 opened Ottoman ports to French bottoms. The Midi's cloth went east through Marseille and Levantine cotton, hides and drugs came back the other way."
 nd_occ_diocesis_civils: "The Civil Dioceses"
 nd_occ_diocesis_civils_desc: "Languedoc assessed and collected its own taxes through twenty-two civil dioceses, each with an assiette that apportioned the levy among its communities. The bishopric supplied the boundary and the assembly supplied the arithmetic."
 nd_occ_lenga_de_l_estat: "The Language of the State"
 nd_occ_lenga_de_l_estat_desc: "The ordinance of Villers-Cotterets required every act of justice in the realm to be recorded in the French mother tongue and no other. In a country whose entire legal life ran on Occitan instruments, that was a change of sovereign."

 # ==========================================================================
 # Advances: Age 5
 # ==========================================================================
 nd_occ_junccion_dels_dos_mars: "Junction of the Two Seas"
 nd_occ_junccion_dels_dos_mars_desc: "Riquet's canal from the Garonne to the sea, fed from the Montagne Noire by a rigole carried thirty miles along the contour to the summit at Naurouze. Authorised 1666, opened 1681."
 nd_occ_manufacturas_del_levant: "Manufactures for the Levant"
 nd_occ_manufacturas_del_levant_desc: "Villenouvette, Clermont and Lodeve wove londrins seconds, a broadcloth cut, dyed and folded to Ottoman taste and made for no other market on earth."
 nd_occ_verd_de_montpelhier: "Vert-de-gris of Montpellier"
 nd_occ_verd_de_montpelhier_desc: "Copper plates layered with the marc left from pressing grapes, sealed in a cellar for weeks and then scraped. Made almost entirely by women in their own houses, and for two centuries Montpellier supplied nearly all of it in Europe."
 nd_occ_camisards: "The Camisards"
 nd_occ_camisards_desc: "Shepherds and wool carders of the Cevennes who tied down marshals of France from 1702 by striking at night in the ravines and being back at the loom by morning. They could not hold a field and were not trying to."
 nd_occ_cadets_de_gasconha: "Cadets de Gascogne"
 nd_occ_cadets_de_gasconha_desc: "Younger sons of a province with more noble houses and less land than anywhere in the kingdom, riding north to serve as private troopers for the chance of a commission. Charles de Batz of Lupiac was one of several thousand."
 nd_occ_academia_dels_jocs_florals: "Academy of the Floral Games"
 nd_occ_academia_dels_jocs_florals_desc: "In 1694 letters patent turned the Consistori into a royal academy. The competition founded in 1323 had by then run for three hundred and seventy-one years without a break, which no other literary body in Europe could say."
 nd_occ_obras_dels_estats: "Works of the Estates"
 nd_occ_obras_dels_estats_desc: "Languedoc did not wait for the crown to build. The estates surveyed, contracted and paid for the province's roads, bridges and harbour works, and found four fifths of the canal's cost between themselves and the treasury."

 # ==========================================================================
 # Advances: Age 6
 # ==========================================================================
 nd_occ_bacin_de_decazavila: "The Aveyron Basin"
 nd_occ_bacin_de_decazavila_desc: "Coal at Aubin and Cransac lying beside iron in the same seams, worked from 1826 under the Duc Decazes, with the Tarn field at Carmaux and the Cevennes field at Ales behind it. The Midi's one heavy industrial region."
 nd_occ_felibritge: "Lo Felibritge"
 nd_occ_felibritge_desc: "Seven poets meeting at Font-Segugne in 1854 set out to give the language of oc a spelling, a dictionary and a literature again. Frederic Mistral spent twenty years on the dictionary and took the Nobel Prize in 1904."
 nd_occ_cacaires_de_montanha: "Mountain Chasseurs"
 nd_occ_cacaires_de_montanha_desc: "Light companies raised out of the Pyrenean and Cevenol valleys, recruited for exactly what the bidaus were hired for five hundred years earlier, now with a rifle."
 nd_occ_vinha_del_miegjorn: "Vineyard of the Midi"
 nd_occ_vinha_del_miegjorn_desc: "Once the rails reached the coast the Languedoc plain tore out everything else and planted vines from Nimes to Narbonne, and what the market would not drink went to the stills."
 nd_occ_camin_de_ferre: "Railways of the Midi"
 nd_occ_camin_de_ferre_desc: "The Compagnie des chemins de fer du Midi, chartered in 1852, laid its trunk line along the Garonne beside the canal it was built to kill, and tied Bordeaux, Toulouse and the coast into a single market for the first time since Rome."
 nd_occ_ensenhament_public: "Public Instruction"
 nd_occ_ensenhament_public_desc: "A country whose legal language was legislated out of existence in 1539, and whose schools then punished children for speaking it, has one obvious thing to do with a national school system."

 # ==========================================================================
 # Buildings
 # ==========================================================================
 nd_occ_consistori: "Consistori"
 nd_occ_consistori_desc: "The hall of the Consistori del Gay Saber, where the chancellor and the seven maintainers sit each May to judge the cansos brought before them and award the golden violet."
 nd_occ_ostal_comun: "Ostal Comun"
 nd_occ_ostal_comun_desc: "The common house of a consulate: the chest with the town's charter in it, the standard weights, the muster roll, and the bench where the consuls judge their own burgesses."
 nd_occ_bastida: "Bastida"
 nd_occ_bastida_desc: "A planted town laid out with a surveyor's cord: straight streets, an arcaded market square, and a charter of liberties for anyone willing to come and build a house on a plot."
 nd_occ_glieisa_fortalesa: "Fortified Church"
 nd_occ_glieisa_fortalesa_desc: "Brick walls, a tower, one door that can be shut, and a cellar for the grain. When the free companies came through, a village with a walled church still had a village afterwards."
 nd_occ_escola_de_medecina: "Escola de Medecina"
 nd_occ_escola_de_medecina_desc: "A faculty of medicine on the Montpellier model, reading Avicenna and Galen together, dissecting when it can get a body, and unusually willing to record what did not work."
 nd_occ_jac_de_la_dralha: "Jac de la Dralha"
 nd_occ_jac_de_la_dralha_desc: "The summer fold at the head of a transhumance track, with a shepherd's hut, a salt trough and drystone walls, where the flocks of the plain spend the months the plain cannot feed them."
 nd_occ_obrador_del_pastel: "Obrador del Pastel"
 nd_occ_obrador_del_pastel_desc: "The pastel works: a millstone for crushing the woad leaves, hurdles for drying the coques, a mortar for grinding them down, and a smell that carries for a mile."
 nd_occ_cort_sobeirana: "Cort Sobeirana"
 nd_occ_cort_sobeirana_desc: "A sovereign court on the Toulouse model, judging in last resort for the whole country of written law, with its own registry, its own advocates and its own opinion of everyone else's jurisdiction."
 nd_occ_draparia: "Draparia"
 nd_occ_draparia_desc: "Looms, fulling mill, tenter field and dyehouse in one guild precinct, turning causse wool and Lauragais woad into cloth that carries the town's own seal."
 nd_occ_cambra_de_l_edicte: "Cambra de l'Edicte"
 nd_occ_cambra_de_l_edicte_desc: "A chamber of the sovereign court with Catholic and Protestant judges in equal number, seated deliberately away from the capital so that neither confession can claim it sits under the other's eye."
 nd_occ_alambic: "Alambic"
 nd_occ_alambic_desc: "The Gascon still: a copper alembic over a wood fire, turning thin white wine that would not survive the journey into brandy that improves on it."
 nd_occ_canal_de_las_doas_mars: "Canal de las Doas Mars"
 nd_occ_canal_de_las_doas_mars_desc: "A cut between the two seas, with its feeder rigole, its summit basin, its staircase locks and its avenue of planes, carrying in a week what the road carried in a month."
 nd_occ_manufactura_reiala: "Manufactura Reiala"
 nd_occ_manufactura_reiala_desc: "A walled industrial compound with its own dyehouse, presses, drying lofts and resident inspectors, weaving broadcloth cut and folded to the taste of a market three thousand miles away."
 nd_occ_forga_del_roergue: "Forga del Roergue"
 nd_occ_forga_del_roergue_desc: "Blast furnaces and puddling floors set down where the coal and the iron lie in the same hillside, with a company town raised around them out of nothing."

 # ==========================================================================
 # Production methods
 # ==========================================================================
 nd_occ_consistori_maintenance: "Chancery of the Games"
 nd_occ_consistori_maintenance_desc: "Paper for the registers, exemplars of the Leys for the maintainers, and wine for the May judging."
 nd_occ_ostal_maintenance: "Charter Chest"
 nd_occ_ostal_maintenance_desc: "Registers, seals and candles for the consuls' evening sittings, and timber for the market hall roof."
 nd_occ_bastida_maintenance: "Founder's Upkeep"
 nd_occ_bastida_maintenance_desc: "Timber and stone for the arcades and the plot boundaries, and grain held against the first bad year."
 nd_occ_glieisa_maintenance: "Parish Garrison"
 nd_occ_glieisa_maintenance_desc: "Masonry for the walls, timber for the hoardings, weapons in the tower and wax for the altar that justifies all of it."
 nd_occ_escola_maintenance: "Faculty Upkeep"
 nd_occ_escola_maintenance_desc: "Drugs for the apothecary's cabinet, books for the masters, paper for the students and spirits for the anatomy table."
 nd_occ_jac_maintenance: "Fold Upkeep"
 nd_occ_jac_maintenance_desc: "Timber and stone for the walls and the hut, and salt for the troughs that keep a flock coming back to the same ground."
 nd_occ_cort_maintenance: "Registry of the Court"
 nd_occ_cort_maintenance_desc: "Paper and parchment for the arrets, the printed customs for the advocates, wax for the seals and wine for the opening of term."
 nd_occ_cambra_maintenance: "Parity Bench"
 nd_occ_cambra_maintenance_desc: "Two sets of registers, two sets of law books, and a bench that will not sit unless both halves of it are present."
 nd_occ_canal_maintenance: "Lock and Bank Upkeep"
 nd_occ_canal_maintenance_desc: "Dressed stone for the lock chambers, oak for the gates and ironwork for the paddles, replaced on a rolling cycle forever."
 nd_occ_coca_de_pastel: "Coques of Woad"
 nd_occ_coca_de_pastel_desc: "Woad leaves crushed under the mill, rolled by hand into balls and dried on hurdles over a slow wood fire. The simplest form the dye is sold in."
 nd_occ_agranat: "Agranat with Alum"
 nd_occ_agranat_desc: "The dried coques broken down to a granulated powder and fermented with alum from Millau, which fixes the colour and roughly doubles what the harvest fetches."
 nd_occ_verdet: "Vert-de-gris"
 nd_occ_verdet_desc: "Copper plates layered with the marc left from the wine press and sealed in a cellar for weeks, then scraped for the blue-green crust. A Montpellier household trade with no rival in Europe."
 nd_occ_draps_de_lengadoc: "Cloths of Languedoc"
 nd_occ_draps_de_lengadoc_desc: "Causse wool spun, woven, fulled and dyed in the woad of the Lauragais, sealed with the town's mark and sold by the piece."
 nd_occ_seda_de_nimes: "Silk of Nimes"
 nd_occ_seda_de_nimes_desc: "Cevenol raw silk thrown, dyed and woven into taffetas and figured stuffs by the looms of Nimes, which will still be inventing fabrics three hundred years later."
 nd_occ_aigardent: "Burnt Wine"
 nd_occ_aigardent_desc: "Thin Gascon white run once through the copper still, as the friars of Eauze described it in 1310, and racked into oak that grows nearby."
 nd_occ_brandi_de_gasconha: "Armagnac"
 nd_occ_brandi_de_gasconha_desc: "Continuous distillation in the Gascon still and long ageing in black oak, producing a brandy sold by vintage year rather than by the cask."
 nd_occ_londrins_seconds: "Londrins Seconds"
 nd_occ_londrins_seconds_desc: "Broadcloth woven, dyed, pressed and folded to a specification set in Smyrna and Aleppo, inspected under royal seal and shipped east through Marseille."
 nd_occ_fonda_roergata: "Rouergue Smelting"
 nd_occ_fonda_roergata_desc: "Coke from the Aubin seams fed into the blast furnace beside the ore it was dug next to, and puddled into bar and rail."

 # ==========================================================================
 # Units and levies
 # ==========================================================================
 a_nd_occ_bidau: "Bidau"
 a_nd_occ_bidau_desc: "Javelin skirmishers off the Pyrenean slope. They close, throw, and are gone before the counter-charge lands. Ask them to stand and they will not."
 levy_nd_occ_bidau: "Bidau Levy"
 levy_nd_occ_bidau_desc: "Peasant and soldier pops of the mountain country, raised as light foot for screening and raiding."
 a_nd_occ_milicia_consulara: "Consular Militia"
 a_nd_occ_milicia_consulara_desc: "Crossbowmen and pavisiers mustered by town quarter under the consulate's banner. Excellent behind a wall and useless a week's march from it."
 levy_nd_occ_milicia_consulara: "Consular Militia Levy"
 levy_nd_occ_milicia_consulara_desc: "Burgher and soldier pops called out under the town's charter rather than a lord's summons."
 a_nd_occ_arquebusier_gascon: "Gascon Arquebusier"
 a_nd_occ_arquebusier_gascon_desc: "The bands of Gascony: fast, accurate, lightly found and lightly disciplined, and inclined to decide a fight in the first volley or not at all."
 n_nd_occ_tartana: "Tartana"
 n_nd_occ_tartana_desc: "A lateen coaster of the gulf of Lion. Shallow, quick and lightly armed, built to keep the coasting trade moving rather than to fight for it."
 a_nd_occ_cadet_de_gasconha: "Cadet de Gascogne"
 a_nd_occ_cadet_de_gasconha_desc: "Poor noble volunteers riding as private troopers for the chance of a commission. They charge home whether or not it is a good idea, which is the point and the problem."
 a_nd_occ_camisard: "Camisard"
 a_nd_occ_camisard_desc: "Shepherds and wool carders of the Cevennes fighting in shirtsleeves by night, at home in ravines no column can follow them into, and unable to hold a field for an hour."
 levy_nd_occ_camisard: "Camisard Levy"
 levy_nd_occ_camisard_desc: "Peasant and laborer pops of the high Cevennes, raised as irregulars. Deliberately not soldiers, which was the whole character of the rising."
 a_nd_occ_cacaire: "Cacaire de Montanha"
 a_nd_occ_cacaire_desc: "Mountain chasseurs raised from the Pyrenean and Cevenol valleys: rifles, skirmish order, and five hundred years of knowing the ground."

 # ==========================================================================
 # DESTINY TREE
 # ==========================================================================

 # --- Destiny advances -----------------------------------------------------
 nd_occ_destiny: "La Question Sobeirana"
 nd_occ_destiny_desc: "The country exists and its charters are in the chest. What nobody has settled is where its own authority comes from, and a country of written law cannot leave that unwritten. Toulouse answered one way for six centuries and Orthez answered the other way in 1347. The founding assembly chose between them, and everything after this follows from that choice."
 nd_occ_dest_caorsins: "Los Caorsins"
 nd_occ_dest_caorsins_desc: "For a hundred years the ordinary word for a moneylender in London, Rome and the fairs of Champagne was caorsin, after a town of eight thousand people on a bend of the Lot. Dante named Cahors beside Sodom; the cardinals elected a Cahorsin pope in 1316. Take Cahors, embrace banking, and bring the country's own development up to what the two founding provinces are worth."
 nd_occ_dest_privilegi: "Lo Privilegi de Bordeu"
 nd_occ_dest_privilegi_desc: "The burgesses of Bordeaux hold a charter barring the wine of the upland country from the port until their own crop has sold, which in a bad year means Christmas and in a worse one Easter, by which time the fleets have gone. Take Bordeaux, embrace global trade and build a treasury of two thousand, and the interior stops asking permission to reach the ocean."
 nd_occ_dest_pacte_general: "Lo Pacte General"
 nd_occ_dest_pacte_general_desc: "One instrument to which every consulate, valley, viscounty and bastide is a party, and one archive holding the authentic copy of each. Extend it north to Limoges and Aurillac, which speak the language and were never asked to sign anything, and hold three thousand in the treasury with a thousand development behind it. Unlocks the Fiera Franca."
 nd_occ_dest_ports: "Los Ports"
 nd_occ_dest_ports_desc: "A summons is paper until somebody arrives carrying it with an army behind him, and from the west there are two doors. Take Bayonne, English since 1152 and the busiest port between the Gironde and the Ebro, and Saint-Jean-Pied-de-Port at the foot of the Roncevaux road, and keep thirty regiments under arms to hold them."
 nd_occ_dest_navarra: "L'Eretatge de Navarra"
 nd_occ_dest_navarra_desc: "The crown of Navarre passed to Francois Phebus of Foix-Bearn in 1479, then to his sister Catherine and her husband Jean d'Albret. Ferdinand seized the Ebro half in 1512 and the house kept the rest and kept the title, which is how a sovereign king reigned inside France until 1620. Take Pamplona and Tudela with fifty prestige behind the claim."
 nd_occ_dest_mureth: "Lo Deute de Mureth"
 nd_occ_dest_mureth_desc: "At Muret in 1213 Peter II of Aragon put himself in the second line so that nobody could say he had hung back, and Montfort's knights rode through it. The Midi lost the one crown that could have kept it out of France and the Pyrenean crest became a border. Take Jaca and Huesca, where Aragon began, with seventy-five prestige and seventy-five regiments. Unlocks the Castel Sobeiran."

 # --- nd_occ.13: the sovereign question ------------------------------------
 nd_occ.13.t: "The Sovereign Question"
 nd_occ.13.d: "Within a month of the proclamation the question has been put out loud in three different chambers and no answer satisfies more than one of them. A country of written instruments cannot avoid it. Every charter in the chest names the authority that granted it, and if that authority is now this country, then this country has to say where its own right comes from.\n\nThe consuls say it comes upward, out of customs sworn and kept for two hundred years, and that a prince is the man who ratifies them. The men who rode in from Bearn reply that this describes a contract and not a crown, and that a lord who holds of God and of no man in the world owes no assembly an explanation.\n\nBoth sides have produced documents. That is the difficulty with a country of written law."
 nd_occ.13.a: "Let the archives argue. We govern in the meantime."

 # --- nd_occ.14: the men of Cahors -----------------------------------------
 nd_occ.14.t: "The Men of Cahors"
 nd_occ.14.d: "The town has eight thousand people and sits inside a loop of the Lot, and for a hundred years its name has been the ordinary European word for a moneylender. Caorsins financed bishops, wool clips, ransoms and the fairs of Champagne; they were expelled from England twice and invited back both times because nobody else would lend at the pace the crown spent. Dante put them in the seventh circle and named the town in the same line as Sodom.\n\nIn 1316 the cardinals shut in at Lyon elected a Cahorsin, Jacques Duese, a shoemaker's son who had studied law and understood money better than any pope before him, and he reigned at Avignon for eighteen years.\n\nThe Quercy is ours and so is its credit. A country that has kept every transaction on paper for three centuries turns out to have been building a banking system without ever calling it one."
 nd_occ.14.a: "Their paper is as good as coin, and it clears faster."

 # --- nd_occ.15: the privilege of Bordeaux ---------------------------------
 nd_occ.15.t: "The Privilege of Bordeaux"
 nd_occ.15.d: "Every autumn the wine of the upland country comes down the Lot, the Tarn and the Garonne, and every autumn it stops at Bordeaux, because the burgesses of Bordeaux hold a charter saying it must. No wine from above the town may be sold in the port until the Bordelais crop has gone. In a good year that means Martinmas. In a bad one it means Easter, by which time the English fleets have sailed and the barrels have begun to turn.\n\nThe privilege is worth more to the town than its walls, and every king of England renewed it, because the town paid for the renewal each time.\n\nThe town is ours now, and so is the whole country above it. The charter is a sheet of parchment that could be burned this afternoon. Whether it should be is a different question, because every liberty in this country is a sheet of parchment somebody could burn."
 nd_occ.15.a: "Annul it. The river carries whatever is loaded on it."
 nd_occ.15.b: "Confirm it, and take the port's rent for the pact."

 # --- nd_occ.16: the general pact ------------------------------------------
 nd_occ.16.t: "The General Pact"
 nd_occ.16.d: "It takes four years to assemble and when it is done it fills a room. Every consulate, every valley, every viscounty and every bastide in the country deposits an authenticated copy of its charter, its fors or its customs in the archive at Toulouse, and takes away a sealed undertaking that the country will defend them. The rule that comes with it is one line long: nothing binds anyone that is not in the chest.\n\nThe Limousin and the Auvergne have signed, which no king ever thought to ask them to do. Aragon has sent observers. What has been made here is not a kingdom in the northern sense at all, and the clerks who drafted it are not entirely certain what to call it.\n\nThe first general fair under the pact's own peace is proposed for July, on the river bank at Beaucaire."
 nd_occ.16.a: "The archive is the constitution. Keep it and defend it."
 nd_occ.16.b: "Open the fair. Let strangers be judged by their own law."

 # --- nd_occ.17: the passes ------------------------------------------------
 nd_occ.17.t: "The Passes"
 nd_occ.17.d: "A summons is a piece of paper until somebody arrives carrying it with an army behind him, and an army coming into this country from the west arrives through one of two doors.\n\nBayonne has been English since Eleanor married Henry in 1152, and it is the busiest port between the Gironde and the Ebro: whale oil, iron, Navarrese wool and every message that matters. Saint-Jean-Pied-de-Port stands at the foot of the road over Roncevaux, where Charlemagne's rearguard was cut to pieces and where every pilgrim, drover and courier out of Navarre still comes down into Gascony.\n\nBoth are held. The doctrine announced at Orthez in 1347 has stopped being a form of words and become a matter of garrisons, and the difference between the two is roughly eleven hundred men."
 nd_occ.17.a: "Hold the doors and the argument holds itself."

 # --- nd_occ.18: the Navarrese inheritance ---------------------------------
 nd_occ.18.t: "The Navarrese Inheritance"
 nd_occ.18.d: "The crown arrives the way everything in the Pyrenees arrives, through a marriage nobody thought important at the time. Foix, Bearn, Marsan, Albret and now Navarre answer to one court, which means the same man is a vassal in Foix, a sovereign in Bearn and a king across the crest. Any lawyer in Paris asked to describe the arrangement will need three sheets of paper and a quiet afternoon.\n\nIt cannot be governed from two places at once. Orthez is where the doctrine was made and where the fors are sworn before the lord is. Pamplona is a capital of a kingdom that Castile and Aragon both want, and a court that sits there is a court that every chancery in Europe has to answer.\n\nWhere the court sits will decide what this country is for the next two hundred years."
 nd_occ.18.a: "Keep the court at Orthez. The mountain is the realm."
 nd_occ.18.b: "Take the court to Pamplona. Be a king where kings are made."

 # --- nd_occ.19: the debt of Muret -----------------------------------------
 nd_occ.19.t: "The Debt of Muret"
 nd_occ.19.d: "On the twelfth of September 1213, outside a town twelve miles from Toulouse, Peter II of Aragon put himself in the second line with ordinary knights because he had been told he was hanging back and would not have it said twice. Simon de Montfort came out of the gate with everything he had and rode straight through that line. The king was killed in the crush, the Occitan lords behind him never finished forming up, and their army broke.\n\nWithin twenty years the Midi belonged to the north, and the crest of the Pyrenees, which had never been a border in any sense that mattered to anyone living on it, became one.\n\nJaca and Huesca are ours: the valley Aragon came out of and the first city it ever took. Five hundred years late, the debt is finally in a position to be settled. How it is settled is the last thing this country has to decide."
 nd_occ.19.a: "One peace over both slopes. Peter came north as a partner."
 nd_occ.19.b: "Answer Montfort's charge. The crest is a road, not a border."

 # --- Destiny timed modifiers ----------------------------------------------
 STATIC_MODIFIER_NAME_nd_occ_dest_riu_liure: "The Open River"
 STATIC_MODIFIER_DESC_nd_occ_dest_riu_liure: "The privilege is annulled and the Garonne carries whatever is loaded on it. Cahors, Gaillac and Moissac sell in October for the first time in two hundred years."
 STATIC_MODIFIER_NAME_nd_occ_dest_carta_del_port: "The Port's Charter"
 STATIC_MODIFIER_DESC_nd_occ_dest_carta_del_port: "Bordeaux keeps its franchise and the pact takes a share of what the franchise earns. A liberty confirmed is a liberty that will still be there when it is ours to invoke."
 STATIC_MODIFIER_NAME_nd_occ_dest_arquiu_comun: "The Common Archive"
 STATIC_MODIFIER_DESC_nd_occ_dest_arquiu_comun: "Every charter in the country authenticated, copied and deposited in one chest, with the rule that nothing binds anyone that is not in it."
 STATIC_MODIFIER_NAME_nd_occ_dest_patz_de_la_fiera: "The Peace of the Fair"
 STATIC_MODIFIER_DESC_nd_occ_dest_patz_de_la_fiera: "One month a year the pact's peace covers anyone who comes, whatever crown they belong to, and they are judged by the law merchant and nobody else's."
 STATIC_MODIFIER_NAME_nd_occ_dest_cort_d_ortes: "The Court at Orthez"
 STATIC_MODIFIER_DESC_nd_occ_dest_cort_d_ortes: "The court stays where the fors are sworn before the lord is. A realm governed from inside its own mountains, by men who can ride to any of it in four days."
 STATIC_MODIFIER_NAME_nd_occ_dest_cort_de_pampalona: "The Court at Pamplona"
 STATIC_MODIFIER_DESC_nd_occ_dest_cort_de_pampalona: "The court crosses the crest and takes the Navarrese title seriously. Every chancery in Europe now has to write to us as a king, and every courier now has a mountain in the way."
 STATIC_MODIFIER_NAME_nd_occ_dest_dos_versants: "Both Slopes, One Peace"
 STATIC_MODIFIER_DESC_nd_occ_dest_dos_versants: "The Ebro and the Garonne under one settlement, as Peter of Aragon intended when he came north in 1213 and as nobody has managed since."
 STATIC_MODIFIER_NAME_nd_occ_dest_responsa_de_mureth: "The Answer at Muret"
 STATIC_MODIFIER_DESC_nd_occ_dest_responsa_de_mureth: "Montfort's charge answered five centuries late, from the other direction. The crest is treated as a road, and everything on both sides of it is treated as reachable."

 # --- Destiny buildings ----------------------------------------------------
 nd_occ_fiera_franca: "Fiera Franca"
 nd_occ_fiera_franca_desc: "A chartered free fair: franchise, safe-conduct and exemption for a fixed number of days, with its own peace and its own court of the law merchant. Beaucaire had one from 1217 and it drew Catalans, Genoese and Levantines to a river bank for a month every summer."
 nd_occ_fiera_maintenance: "Fairground Upkeep"
 nd_occ_fiera_maintenance_desc: "Canvas and cordage for the booths, paper for the fair court's register, wine for the opening proclamation and salt for a month of feeding strangers."
 nd_occ_castel_sobeiran: "Castel Sobeiran"
 nd_occ_castel_sobeiran_desc: "A prince's own keep on high ground, brick from the ground up in the manner of Montaner and Mauvezin, with a paid garrison, one tower and no bishop, abbot or king holding any claim on a stone of it."
 nd_occ_castel_maintenance: "Garrison of the Keep"
 nd_occ_castel_maintenance_desc: "Brick and dressed stone for the curtain, weapons in the tower, timber for the hoardings and cloth for the men who never go home for the harvest."

 # --- Destiny event option tooltips ----------------------------------------
 nd_occ.13.a_tt: "The question is left open and the chambers keep arguing it."
 nd_occ.14.a_tt: "The credit of the Quercy is taken into the country's own accounts."
 nd_occ.15.a_tt: "The Bordeaux charter is annulled and the upland wine ships when ready."
 nd_occ.15.b_tt: "The charter stands and a share of the port's rent comes to the pact."
 nd_occ.16.a_tt: "The archive at Toulouse becomes the country's constitutional record."
 nd_occ.16.b_tt: "A general fair opens each July under the pact's own peace and court."
 nd_occ.17.a_tt: "Bayonne and the Roncevaux road are garrisoned and stay garrisoned."
 nd_occ.18.a_tt: "The court stays at Orthez and the realm is governed from the mountains."
 nd_occ.18.b_tt: "The court crosses to Pamplona and the Navarrese title is taken up."
 nd_occ.19.a_tt: "The Ebro and the Garonne are settled under one peace."
 nd_occ.19.b_tt: "The crest is treated as a road and both slopes are held by force."

 # ===== BUREAUCRACIES =====
 occ_estats_de_lengadoc_bureaucracy: "Estats de Lengadoc"
 occ_estats_de_lengadoc_bureaucracy_desc: "The provincial estates of Languedoc, in annual session from the 1340s until 1789. Three orders sat: twenty-three bishops under the archbishop of Narbonne as president born, twenty-three barons, and sixty-eight deputies of the towns whose weight was held to parity with the other two. Languedoc was a pays d'etats and never admitted the royal elus. The crown asked, the estates bargained the don gratuit down to a lump sum, and the province then apportioned that sum itself through the assiettes of its civil dioceses, whose composition it regulated from 1553 and whose accounts it won the right to audit in January 1658. Its own receivers collected, its syndics general lived at court to defend its privileges, and the bourse of the estates borrowed in the province's name on paper that lenders rated above the crown's."
 occ_cort_dels_ajudas_bureaucracy: "Cort dels Ajudas"
 occ_cort_dels_ajudas_bureaucracy_desc: "The Cour des Aides, created by Charles VII on 20 April 1437 as only the second in the kingdom and given the whole Midi: Languedoc, the Rouergue, the Quercy and part of Guyenne. Louis XI fixed it at Montpellier in 1467. The Parlement of Toulouse and the estates combined against it and had it suppressed in 1484; it was back by 1486, and the edict of July 1629 merged it with the chamber of accounts of 1523 into the Cour des comptes, aides et finances. Its business was the fisc: registering fiscal edicts, judging the aides and the gabelle in last resort, and hearing exemption claims. It was the one bench in the Midi that could rule a man's nobility usurped and his exemption void."
 occ_lo_compes_bureaucracy: "Lo Compes"
 occ_lo_compes_bureaucracy_desc: "The compoix, the community land register of the Midi. The oldest to survive is of 1320 and most communities kept one down to the Revolution. Every parcel of the terroir taillable was walked, measured, graded for quality and entered in allivrement against the name of its holder, and the whole register was reworked roughly once a lifetime. From it comes the taille reelle: the tax attaches to the land and not to the person, so a parcel entered as taillable stays taillable in a noble's hands, where north of the Loire a noble's purchase left the roll altogether. Three registers stack above one another, the provincial cadastre dividing the levy between dioceses, the diocesan cadastre between communities, and the compoix of the village between neighbours who can all hear it read aloud."
 occ_cort_major_de_bearn_bureaucracy: "Cort Major de Bearn"
 occ_cort_major_de_bearn_bureaucracy_desc: "The Cour Majour, high court of Bearn, which Gaston Febus reduced to twelve barons sitting as jurats at Orthez and which followed the court to Pau after 1464. It judged in last resort, it had to be heard before Bearn engaged itself in any war beyond its own borders, and it received the viscount's oath at his accession: the lord swore to keep the Fors first, and only then did Bearn swear to him. The Fors were compiled from the eleventh century onward and expanded under Febus, and what they guarantee above all is the free household against arbitrary levy. That is the ground Febus was standing on in 1347 when he answered the summons of Philip VI that he would do homage for Foix, but that he held Bearn from God and from no man in the world."

