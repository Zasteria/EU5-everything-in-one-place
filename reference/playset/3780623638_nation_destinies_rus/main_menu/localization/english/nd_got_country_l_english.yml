l_english:
 GOT: "Gothia"
 GOT_ADJ: "Visigothic"
 GOT_f: "Regnum Gothorum"
 GOT_f_desc: "The kings of Asturias, Leon and Castile never claimed to be conquering Iberia. They claimed to be restoring it, holding themselves the lawful heirs of the Gothic kings of Toledo, and that argument of succession is what made the Reconquista a matter of law rather than of appetite. A Castilian or Leonese crown that recovers the peninsula, takes Granada and pushes back across the Pyrenees to Narbonne can stop calling the work a reconquest and simply finish it: Toledo restored as the royal city, the Liber Iudiciorum reissued as the law of the whole realm, and Septimania Gothic again. This is the older and stranger alternative to Spain, a crown resting on church councils, a written code and the Gothic succession instead of on the marriage of two dynasties."
