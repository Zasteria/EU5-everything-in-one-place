l_english:
 OUT: "Outremer"
 OUT_ADJ: "Outremer"
 OUT_f: "Outremer"
 OUT_f_desc: "One Latin crown from the Nile to the Tigris, from Cyprus to the mouth of the Red Sea: the crusade as it was only ever dreamed. Any Catholic power that has carried the project east may proclaim it, whether it came by way of Jerusalem, the Latin Empire, Crusader Africa or a sovereign military order, but only while Catholics remain a minority of its own subjects. Outremer is less a conquest than a permanent problem of government: a Frankish ruling caste of castles, ports and pilgrim roads set over Muslim, Eastern Christian, Jewish and Samaritan communities that keep their own headmen, their own courts and their own faith, and are taxed rather than converted."
