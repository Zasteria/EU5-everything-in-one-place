l_english:

 # ==================== Formation event ====================
 nd_the.1.t: "The Crown of Boniface"
 nd_the.1.d: "In 1204 Boniface of Montferrat was passed over for the imperial crown at Constantinople and took this city instead. For twenty years a Lombard court held Thessalonica; his son Demetrius lost it in 1224, and the title went into a chest in Italy. You have taken it out again.\n\nWhat you have not taken is the city. Thessalonica has three masters and none of them is you. The barons of the countryside hold their fiefs by the sword and come when it suits them. The guilds of the harbour, the porters and sailmakers and the men of the waterfront, govern their own quarters and have shown before what they do to a lord they dislike. And in the great basilica the Greek clergy pray for an emperor who is not you, with the Holy Mountain and every monastery in Macedonia standing behind them.\n\nYou can rule through any one of the three. You cannot rule through all three.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_the.1.a: "Rule through the barons: the fief, the garrison, the citadel"
 nd_the.1.b: "Rule through the commune: charter the guilds and the harbour"
 nd_the.1.c: "Rule through the church: a concordat of the two rites"

 # ==================== Advance events ====================
 nd_the.2.t: "The Holy Mountain Writes to Rome"
 nd_the.2.d: "The abbots of Athos have sent a letter over your head. It is addressed to the Pope, and it lists what Latin knights have done to their houses: doors broken, chapels stripped, monks turned off estates their grandfathers' grandfathers gave the Mountain. Innocent III answered a letter like this one on 17 January 1214 by taking Athos under his own protection, which is to say out of the hands of whichever crown happened to rule it.\n\nYour barons want the rents. The Mountain wants its charters confirmed. Rome is listening to both."
 nd_the.2.a: "Confirm the charters and stand as protector of the Mountain"
 nd_the.2.b: "Let the barons take their rents from the monastic estates"

 nd_the.3.t: "The Zealots Hold the Gates"
 nd_the.3.d: "It began in the harbour. The men of the waterfront came up through the lower town behind Michael and Andreas Palaiologos, the houses of the great families were emptied into the street, and a contemporary wrote that for two or three days Thessalonica looked like a city under enemy occupation. When it was over the aristocracy had fled or been killed, their lands had been shared out, and the Zealots were governing.\n\nThey are not a mob. They keep a council, they collect the customs, they man the walls, and they have already thrown back an army with Turkish and Serbian help behind it. They also refuse every instruction that arrives from outside the walls, including yours. The commune of 1342 held this city for eight years and ended only when the city itself turned on it.\n\nThe crown has three answers, and every one of them has been tried here."
 nd_the.3.a: "Treat with them and set the commune's charter down in writing"
 nd_the.3.b: "Storm the lower town and hang the council in the square"
 nd_the.3.c: "Wait. They will consume themselves, as they did before"

 nd_the.4.t: "Palamas at the Gate"
 nd_the.4.d: "The synod has elected Gregory Palamas archbishop of this city, and this city will not let him in. He waits on Athos and then on Lemnos while the men on the wall shout down that they recognise no appointment made by the party that lost the war. Behind the quarrel stands the greatest theological fight of the century: whether the uncreated light that hesychast monks see in prayer is God himself, which Palamas says it is and which half the learned men of the Greek world call an absurdity.\n\nHe waited three years and entered in 1350. A Latin crown has one option the emperors never had. It can decide that the see is Latin now."
 nd_the.4.a: "Open the cathedral and let the archbishop take his throne"
 nd_the.4.b: "Keep the see and give it to a bishop of our own rite"

 nd_the.5.t: "The Keys of the City"
 nd_the.5.d: "In September 1423 the despot Andronikos Palaiologos, sick and out of money, handed Thessalonica to the Republic of Venice, because Venice was the only power that could feed it. The Venetians held it for seven years, kept the harbour open against everything the sultan could bring against them, and lost it by storm on the morning of 29 March 1430.\n\nThe offer that has reached you is the same offer. Italian galleys, Italian grain, an Italian officer in the citadel, and the defence of the city taken off your hands at a stroke. The alternative is to put weapons into the hands of the very people who last used them on your predecessors."
 nd_the.5.a: "Take the Signoria's galleys and its grain into the harbour"
 nd_the.5.b: "Refuse. Arm the city and let the city defend itself"

 nd_the.6.t: "The Ships from Sepharad"
 nd_the.6.d: "They come in over months, whole congregations at a time, each still calling itself after the town in Castile or Aragon or Portugal that expelled it. They arrive with almost nothing, and with two things worth more than cargo: correspondents in every port of the western Mediterranean, and the entire craft of the woollen cloth, the carding and the fulling and the dye vat and the guild rules that keep a standard honest.\n\nWithin a generation this trade will clothe armies. The only question left to you is where you put it."
 nd_the.6.a: "Charter them in the city, a quarter to each congregation"
 nd_the.6.b: "Settle them through the Macedonian towns, near the fleece"

 nd_the.7.t: "The Union of Florence"
 nd_the.7.d: "The decree of union was read out in the cathedral of Florence in July 1439, and the Greek delegation signed it, some of them weeping. It makes the two churches one, and it makes your crown lawful in the eyes of every Greek who accepts it.\n\nAlmost nobody does. Mark of Ephesus withheld his signature. The monks of the Holy Mountain are preaching against it already. In Constantinople men are saying aloud that they would sooner see the sultan's turban in the city than the Latin mitre. Proclaiming the union from the ambo of Saint Demetrios would settle the legal question and unsettle absolutely everything else."
 nd_the.7.a: "Proclaim the union from the ambo of Saint Demetrios"
 nd_the.7.b: "Let the Greek clergy repudiate it quietly, and say nothing"

 nd_the.8.t: "The Press of Judah Gedaliah"
 nd_the.8.d: "The first printing press anywhere in the Balkan peninsula is set up in this city in 1512 by Judah Gedaliah, who learned the trade in Lisbon and carried the types out with him when he left. It prints in Hebrew. For the next two centuries Salonica is one of the printing capitals of the eastern Mediterranean, and the workmen its shops train carry the craft into every other language spoken on this gulf.\n\nA city that has never once agreed on a creed turns out to agree on a font."
 nd_the.8.a: "Let the presses run"

 nd_the.9.t: "The Twelve Villages Ask for a Charter"
 nd_the.9.d: "The mining villages of the mountain have sent down a proposal, and it is a good one. They will run the workings themselves: their own courts, their own headmen, their own armed wardens on the bullion road, and no crown officer above the tree line. In return they will render one twelfth of the silver every year, weighed and sealed at the mint, and they will stand surety for it against a bad season.\n\nA crown officer costs money and steals. The villages do not steal from a quota they set themselves. What you would be giving away is not the revenue. It is the district."
 nd_the.9.a: "Grant the charter and take the render"
 nd_the.9.b: "Refuse. The mountain is crown land and will be governed so"

 # ==================== Variable tooltips ====================
 nd_the_formed_tt: "The Kingdom of Thessalonica has been restored"
 nd_the_path_a_tt: "The crown rules through the Lombard baronage"
 nd_the_path_b_tt: "The crown rules through the commune of the harbour"
 nd_the_path_c_tt: "The crown rules through a concordat of the two rites"

 # ==================== Timed modifiers ====================
 STATIC_MODIFIER_NAME_nd_the_lombard_crown: "The Lombard Crown"
 STATIC_MODIFIER_DESC_nd_the_lombard_crown: "The kingdom is held as Boniface's knights held it: land in fief to the barons, the capital held by the garrison on the rock above it. The countryside yields; the city seethes."
 STATIC_MODIFIER_NAME_nd_the_charter_of_the_demos: "The Charter of the Demos"
 STATIC_MODIFIER_DESC_nd_the_charter_of_the_demos: "The guilds and the men of the waterfront are recognised as the government of their own city. The harbour prospers and mans the fleet; the crown's writ stops at the gate."
 STATIC_MODIFIER_NAME_nd_the_two_rites: "The Concordat of the Two Rites"
 STATIC_MODIFIER_DESC_nd_the_two_rites: "Saint Demetrios and the Holy Mountain are endowed by a Catholic king, and the Greek rite is guaranteed in law. The Orthodox serve willingly. The realm's own Latins take it as a betrayal."

 STATIC_MODIFIER_NAME_nd_the_protector_of_the_mountain: "Protector of the Holy Mountain"
 STATIC_MODIFIER_DESC_nd_the_protector_of_the_mountain: "The Athonite charters are confirmed under the crown's seal. The monasteries stop writing to Rome and start praying for the king."
 STATIC_MODIFIER_NAME_nd_the_rents_of_the_mountain: "The Rents of the Mountain"
 STATIC_MODIFIER_DESC_nd_the_rents_of_the_mountain: "The knights take their dues from the monastic estates. The barons are satisfied, the harvests come in, and every abbot in Macedonia now has a grievance in writing."

 STATIC_MODIFIER_NAME_nd_the_commune_recognised: "The Commune Recognised"
 STATIC_MODIFIER_DESC_nd_the_commune_recognised: "The Zealot council keeps its customs house, its walls and its charter. Trade through the harbour has never been better managed, and the crown has never had less say in it."
 STATIC_MODIFIER_NAME_nd_the_commune_broken: "The Commune Broken"
 STATIC_MODIFIER_DESC_nd_the_commune_broken: "The lower town is taken street by street and the council hanged. The crown governs its capital directly for the first time in living memory, and the burghers will remember it for longer than that."
 STATIC_MODIFIER_NAME_nd_the_commune_outlasted: "The Commune Outlasted"
 STATIC_MODIFIER_DESC_nd_the_commune_outlasted: "The crown waited, and the city turned on the Zealots without help. Nobody was massacred and nothing was conceded. Nobody thinks better of the king for it either."

 STATIC_MODIFIER_NAME_nd_the_archbishop_enthroned: "The Archbishop Enthroned"
 STATIC_MODIFIER_DESC_nd_the_archbishop_enthroned: "Palamas is escorted to his throne by a Catholic king's guard. The hesychasts have their victory, the city has its shepherd, and the crown has the credit."
 STATIC_MODIFIER_NAME_nd_the_latin_see: "The Latin See"
 STATIC_MODIFIER_DESC_nd_the_latin_see: "The cathedral is given to a bishop of the Roman rite. The liturgy is lawful, the conversions begin, and the congregation prays elsewhere."

 STATIC_MODIFIER_NAME_nd_the_galleys_of_the_signoria: "The Galleys of the Signoria"
 STATIC_MODIFIER_DESC_nd_the_galleys_of_the_signoria: "Venetian hulls in the roadstead and Venetian grain on the quay. The city can be fed through any siege, at the price of an Italian officer with a key to the citadel."
 STATIC_MODIFIER_NAME_nd_the_city_arms_itself: "The City Arms Itself"
 STATIC_MODIFIER_DESC_nd_the_city_arms_itself: "The muster rolls are opened to the quarters and the walls are manned by the men who live behind them. It is the cheapest garrison in Christendom and the least obedient."

 STATIC_MODIFIER_NAME_nd_the_congregations_chartered: "The Chartered Congregations"
 STATIC_MODIFIER_DESC_nd_the_congregations_chartered: "Each congregation is given a quarter, a synagogue and a court of its own. The city fills with looms, letters of credit and printers."
 STATIC_MODIFIER_NAME_nd_the_looms_in_the_towns: "The Looms in the Towns"
 STATIC_MODIFIER_DESC_nd_the_looms_in_the_towns: "The newcomers are settled among the flocks of the Macedonian interior rather than in the capital. The fleece is worked where it is shorn, and the great houses of the port never form."

 STATIC_MODIFIER_NAME_nd_the_union_proclaimed: "The Union Proclaimed"
 STATIC_MODIFIER_DESC_nd_the_union_proclaimed: "The decree of Florence is read from the ambo and the crown's authority over its Greek subjects is finally lawful in canon law. The congregation walks out."
 STATIC_MODIFIER_NAME_nd_the_union_shelved: "The Union Shelved"
 STATIC_MODIFIER_DESC_nd_the_union_shelved: "The decree is filed and never read aloud. The Greeks keep their liturgy and their loyalty, and the Latin courts of Europe draw their own conclusions about this king."

 STATIC_MODIFIER_NAME_nd_the_silver_render: "The Silver Render"
 STATIC_MODIFIER_DESC_nd_the_silver_render: "The twelve villages hold the mountain and pay one twelfth of it. Output has never been higher and no crown officer has set foot above the tree line in years."
 STATIC_MODIFIER_NAME_nd_the_crown_wardens: "The Crown Wardens"
 STATIC_MODIFIER_DESC_nd_the_crown_wardens: "The workings are administered from the capital by salaried men. The district is unambiguously the king's, and it produces rather less than it used to."

 # ==================== Advances ====================
 nd_the_crown_of_boniface: "The Crown of Boniface"
 nd_the_crown_of_boniface_desc: "Boniface of Montferrat took Thessalonica in 1204 when the imperial crown went to Baldwin of Flanders instead, and held it until a Bulgarian ambush killed him in 1207. The title his son Demetrius lost in 1224 is picked up again, along with the reason every holder of it kept a garrison on the acropolis."
 nd_the_gasmouloi_companies: "The Gasmouloi Companies"
 nd_the_gasmouloi_companies_desc: "Children of Greek mothers and Latin fathers, first enrolled as marines by Michael VIII and used by Byzantines, Ottomans and Latin princes alike for the next three centuries. Contemporaries called them excellent soldiers who joined Byzantine prudence to Latin boldness, and trusted them no further than the quay."
 nd_the_metochia_of_the_holy_mountain: "Metochia of the Holy Mountain"
 nd_the_metochia_of_the_holy_mountain_desc: "The monasteries of Athos held dependent estates across Macedonia and Thessaly: fields, mills, olive groves and villages of bound peasants, administered by a steward and answerable to the Mountain rather than to any king."
 nd_the_assize_of_the_two_rites: "The Assize of the Two Rites"
 nd_the_assize_of_the_two_rites_desc: "The Latin states of Greece governed by written assize. This one concedes in law what cannot be changed in fact: the Greek liturgy stands, Greek is a language of record, and the crown's courts learn to work in two tongues at once."
 nd_the_commune_of_the_parathalassioi: "The Commune of the Parathalassioi"
 nd_the_commune_of_the_parathalassioi_desc: "The parathalassioi were the men of the waterfront, and in 1342 they rose behind the Zealots and governed Thessalonica for eight years. Their boats are the only fleet this city has ever really had, and the crown that wants them must come to terms with the quarter that owns them."
 nd_the_palamite_concord: "The Palamite Concord"
 nd_the_palamite_concord_desc: "Gregory Palamas was elected archbishop of this city in 1347 and could not enter it until 1350. Settling the hesychast quarrel decides who speaks for the Greeks of the realm, which for a Catholic king is a more urgent question than what the uncreated light is made of."
 nd_the_thessalian_horse: "The Thessalian Horse"
 nd_the_thessalian_horse_desc: "The plain around Larissa has bred cavalry since before Philip of Macedon and never stopped. Its horse-owning lords rode for whoever held the town, and the town is now yours."
 nd_the_workings_of_sidirokausia: "The Workings of Sidirokausia"
 nd_the_workings_of_sidirokausia_desc: "The iron-burning country of north-eastern Chalkidiki, worked since at least the ninth century for argentiferous ore. In its best years hundreds of kilns burned there at once and it was the most productive mining district in the whole Balkan peninsula."
 nd_the_myron_of_the_martyr: "The Myron of the Martyr"
 nd_the_myron_of_the_martyr_desc: "Saint Demetrios was the myroblytes, the streamer of scented oil. Pilgrims came from Kiev and Palermo to have a stamped ampulla filled at his tomb, and the trade in that oil made medicine one of the city's staple exports."
 nd_the_sea_relieved_city: "The Sea-Relieved City"
 nd_the_sea_relieved_city_desc: "From 1422 Thessalonica lived for eight years on what came in over the Thermaic Gulf and on nothing else. A city on this bay is only as strong as the last convoy that got through, which is a lesson its rulers learned twice."
 nd_the_haven_of_the_congregations: "Haven of the Congregations"
 nd_the_haven_of_the_congregations_desc: "After 1492 Salonica took in more of the expelled Iberian communities than any other city in the Mediterranean. They arrived with the whole craft of the woollen cloth in their heads and rebuilt the city's economy around it within a generation."
 nd_the_thermaic_squadron: "The Thermaic Squadron"
 nd_the_thermaic_squadron_desc: "The light hulls that ran grain past a blockading fleet in the 1420s are kept on as a standing squadron. They are built to arrive, not to fight, and the difference is the whole doctrine."
 nd_the_union_of_florence: "The Union of Florence"
 nd_the_union_of_florence_desc: "The decree of 1439 made the Latin and Greek churches one on paper and satisfied almost nobody. For a Latin dynasty ruling an Orthodox city it is nonetheless the single document that makes the arrangement lawful, and worth a great deal of trouble to enforce."
 nd_the_cupellation_of_the_argyrion: "Cupellation of the Argyrion"
 nd_the_cupellation_of_the_argyrion_desc: "The ore is roasted with lead, the lead is driven off in the bone-ash hearth, and what stays behind is silver. It is the process that turned a hillside of poor galena into tons of bullion a year."
 nd_the_looms_of_the_congregations: "The Looms of the Congregations"
 nd_the_looms_of_the_congregations_desc: "At its height the Salonican wool trade bound whole congregations to the cloth, from the shearing to the seal, and the finished broadcloth was accepted in place of coin by anyone who had soldiers to dress."
 nd_the_mint_of_the_mountain: "The Mint of the Mountain"
 nd_the_mint_of_the_mountain_desc: "A striking house raised beside the workings themselves, so that the metal never has to make the journey down to the sea before it becomes money. It also means the bullion road below it is suddenly worth robbing."
 nd_the_press_of_gedaliah: "The Press of Gedaliah"
 nd_the_press_of_gedaliah_desc: "Judah Gedaliah brought his types out of Lisbon and set up the first printing press in the Balkans here in 1512. It printed Hebrew, and it made this city a centre of the book for two hundred years."
 nd_the_vlach_caravans: "The Vlach Caravans"
 nd_the_vlach_caravans_desc: "The Aromanian muleteers of the Pindus moved everything that could not go by sea: wool and cotton north over the passes to the fairs of Central Europe, credit and news back the other way. Their roads are the realm's second harbour."
 nd_the_mademochoria_charter: "The Charter of the Twelve Villages"
 nd_the_mademochoria_charter_desc: "The mining villages are granted their own courts, headmen and wardens in exchange for a fixed annual render of silver. The crown gets the bullion by the ton and gives up the mountain by the acre."
 nd_the_krokos_of_kozani: "The Crocus of the Highlands"
 nd_the_krokos_of_kozani_desc: "On the cold plateau behind Servia the autumn crocus yields the most valuable crop by weight anywhere in the realm. It is picked before dawn by hand and must be dried the same day, which is why the drying house has to stand in the field."
 nd_the_epistasia_of_the_mountain: "The Epistasia of the Mountain"
 nd_the_epistasia_of_the_mountain_desc: "The crown at last has a seat in the council of the Holy Mountain. The monasteries keep their rule, their charters and their libraries; the king finally has one name to write to instead of twenty."
 nd_the_wardens_of_the_bullion_road: "Wardens of the Bullion Road"
 nd_the_wardens_of_the_bullion_road_desc: "Silver walking down from the workings to the harbour needs men beside it, and the mining villages raise those men themselves. They know every gully on the road because they grew up robbing it."
 nd_the_cotton_of_the_campania: "The Cotton of the Campania"
 nd_the_cotton_of_the_campania_desc: "Macedonian cotton and cotton yarn went out through this gulf in the eighteenth century in quantities that made the old broadcloth trade look modest, and the merchant houses that shipped it kept ledgers in Marseille and Leipzig."
 nd_the_free_port_of_the_gulf: "The Free Port of the Gulf"
 nd_the_free_port_of_the_gulf_desc: "The harbour is thrown open on published terms rather than on customs bargained ship by ship. Every consul in the Mediterranean has an opinion about the terms; every one of them sends ships anyway."
 nd_the_charter_of_the_two_nations: "The Charter of the Two Nations"
 nd_the_charter_of_the_two_nations_desc: "The age gives the crown's Greek subjects a word for what they had always been. A Latin dynasty can answer that with a charter or with a garrison, and only one of those has ever worked in this city."
 nd_the_goldsmiths_of_the_gulf: "The Goldsmiths of the Gulf"
 nd_the_goldsmiths_of_the_gulf_desc: "The silver stops leaving as bar and starts leaving as filigree, worth several times as much and weighing a great deal less. The mountain's output has not changed; the ledger has."

 # ==================== Buildings ====================
 nd_the_eptapyrgion: "Eptapyrgion"
 nd_the_eptapyrgion_desc: "The citadel on the acropolis, above and apart from the town it commands. Every ruler of this city from Boniface onward kept a garrison on this rock, and every one of them did it for the same reason: the walls face outward, but the guns face down."
 nd_the_metochion: "Metochion"
 nd_the_metochion_desc: "A dependency of one of the great monasteries: land, a chapel, a steward and a village of bound peasants, sending grain, oil and spirits back to the mother house on the Holy Mountain. The crown may license it and tax it. It will never own it."
 nd_the_sidirokausia_works: "Sidirokausia Works"
 nd_the_sidirokausia_works_desc: "Roasting kilns strung along the Chalkidiki hills, working argentiferous lead ore into bullion. At its height the district employed thousands of miners and kept hundreds of furnaces alight at once."
 nd_the_myron_hall: "Hall of the Myron"
 nd_the_myron_hall_desc: "The hall beside the martyr's tomb where the scented oil is drawn off, sealed into stamped clay ampullae and sold to pilgrims. Half shrine and half apothecary, and the reason medicine leaves this port by the shipload."
 nd_the_broadcloth_hall: "Broadcloth Hall"
 nd_the_broadcloth_hall_desc: "Carding, spinning, weaving, fulling and dyeing under one roof and one communal rule. The congregations that ran these halls set the standard, policed it themselves, and clothed armies with the result."
 nd_the_argyrokopeion: "Argyrokopeion"
 nd_the_argyrokopeion_desc: "The striking house at the mine. Bar silver goes in and coin comes out without the metal ever having to travel down to the sea, which saves a fortune in escorts and creates a road worth ambushing."
 nd_the_krokos_house: "Krokos House"
 nd_the_krokos_house_desc: "A drying house standing in the crocus fields of the western plateau. The stigmas are picked by hand before the sun is up and must be over the fire the same day, or the year's crop is worth nothing."

 # ==================== Production methods ====================
 nd_the_eptapyrgion_maintenance: "Citadel Garrison"
 nd_the_eptapyrgion_maintenance_desc: "Stone for the curtain, iron for the gates, timber for the hoardings and a standing company that never leaves the rock."
 nd_the_tsipouro_still: "Monastic Still"
 nd_the_tsipouro_still_desc: "Marc left over from the vintage is distilled into tsipouro, a spirit the Athonite houses are traditionally credited with inventing in the fourteenth century."
 nd_the_monastic_scriptorium: "Monastic Scriptorium"
 nd_the_monastic_scriptorium_desc: "Rag and pulp worked into paper for the libraries of the Mountain, whose copyists have been at it without a break since before the city had a Latin king."
 nd_the_argyros_smelting: "Ore Roasting"
 nd_the_argyros_smelting_desc: "Galena roasted over charcoal in small kilns on the hillside, the first and dirtiest stage of getting silver out of Chalkidiki rock."
 nd_the_cupellation: "Cupellation"
 nd_the_cupellation_desc: "The roasted ore is melted with lead and blown in a bone-ash hearth until the lead oxidises away and a bead of refined silver is left sitting in the cup."
 nd_the_ampullae_of_saint_demetrios: "Ampullae of Saint Demetrios"
 nd_the_ampullae_of_saint_demetrios_desc: "Oil from the martyr's tomb sealed into small stamped flasks. Archaeologists dig them out of the ground from Kiev to Sicily, which tells you how far the pilgrims carried them."
 nd_the_salonica_broadcloth: "Salonica Broadcloth"
 nd_the_salonica_broadcloth_desc: "Macedonian fleece carded, woven and fulled into heavy cloth by the guild standard, the trade this city ran on for two hundred years."
 nd_the_fine_broadcloth: "Fine Broadcloth"
 nd_the_fine_broadcloth_desc: "The best fleece dyed in the vat and finished for the export trade, sold by the seal rather than by the yard."
 nd_the_cotton_yarn: "Cotton Yarn"
 nd_the_cotton_yarn_desc: "The looms are turned over to Macedonian cotton, spun into yarn for the northern markets where the demand has outrun anything wool can supply."
 nd_the_akce_striking: "Coin Striking"
 nd_the_akce_striking_desc: "Blanks cut, weighed and struck beside the workings, so that the district's silver becomes money on the mountain rather than in somebody else's capital."
 nd_the_filigree_work: "Filigree Work"
 nd_the_filigree_work_desc: "Drawn wire twisted into filigree by goldsmiths who learned the trade from three traditions at once. It leaves the gulf worth many times its weight in bar."
 nd_the_krokos_drying: "Crocus Drying"
 nd_the_krokos_drying_desc: "Stigmas laid on sieves over a low fire within hours of picking. Handled well the crop is worth its weight in silver; handled badly it is worth nothing at all."

 # ==================== Units ====================
 a_nd_the_gasmouloi: "Gasmouloi"
 a_nd_the_gasmouloi_desc: "Marine skirmishers of mixed Greek and Latin parentage, raised from the port trades. Fast into a landing and murderous along a shoreline, and the first to go when a battle turns, because neither community will die for the other's crown."
 n_nd_the_parathalassioi_galley: "Parathalassioi Galley"
 n_nd_the_parathalassioi_galley_desc: "A crowded, lightly gunned hull owned by the harbour guilds and pulled by the men of the waterfront. Built to keep a lane open under blockade rather than to break a line of battle."
 a_nd_the_thessalian_lancers: "Thessalian Lancers"
 a_nd_the_thessalian_lancers_desc: "Horse from the Larissa plain, the oldest cavalry country in Greece. On the flat they are irresistible. The moment the ground rises, which in this kingdom is soon, they are a liability."
 n_nd_the_thermaic_galliot: "Thermaic Galliot"
 n_nd_the_thermaic_galliot_desc: "The blockade runner of the gulf. Everything is given to speed and to holding the sea lane, and almost nothing to armament, because a ship that stops to fight is a ship that does not arrive."
 a_nd_the_bullion_warden: "Bullion Warden"
 a_nd_the_bullion_warden_desc: "Armed men of the mining villages, raised to walk the silver down to the harbour. Ambush country is their trade and a pitched field is emphatically not."

 # ==================== Levies ====================
 levy_nd_the_gasmouloi: "Gasmouloi Levy"
 levy_nd_the_gasmouloi_desc: "The mixed Greek and Latin population of the waterfront, called up from the port trades rather than from the countryside."
 levy_nd_the_parathalassioi: "Parathalassioi Levy"
 levy_nd_the_parathalassioi_desc: "The boats of the harbour guilds, owned by burghers and pulled by the labourers and peasants of the shore. The same body of men that governed the city as a commune."
 levy_nd_the_thessalian_lancers: "Thessalian Lancer Levy"
 levy_nd_the_thessalian_lancers_desc: "The horse-owning lords of the Thessalian plain, summoned with their own mounts as cavalry levies have always been."
 levy_nd_the_bullion_wardens: "Bullion Warden Levy"
 levy_nd_the_bullion_wardens_desc: "Wardens raised by the mining villages themselves, from the men who work the kilns and the men posted to watch them."

 # ==================== Event guard ====================
 nd_the_e1_done_tt: "$nd_the.1.t$ has already happened"

 # ==================== Option tooltips ====================
 nd_the.1.a_tt: "The Lombard Crown. Crown lands, garrisons, noble levies and the produce of the fiefs. The city's burghers are governed, not consulted."
 nd_the.1.b_tt: "The Charter of the Demos. Burgher satisfaction, urban growth, seaborne trade and sailors. The crown surrenders its grip on its own capital and the barons are cut out."
 nd_the.1.c_tt: "The Concordat of the Two Rites. Toleration of the Greek rite, devotion, willing levies and firmer control. The realm's own Latins take it badly."
 nd_the.2.a_tt: "Toleration of the Greek rite, less separatism and steady prosperity. The Mountain stops writing to Rome."
 nd_the.2.b_tt: "The estates yield to the barons: raw material output and noble satisfaction, paid for in toleration and in unrest."
 nd_the.3.a_tt: "The commune keeps its charter: burgher satisfaction, urban growth and seaborne trade, at the cost of crown authority."
 nd_the.3.b_tt: "The council is destroyed: crown authority, control and a satisfied nobility, bought with the lasting hatred of the burghers."
 nd_the.3.c_tt: "Neither blood nor concession: less separatism, cheaper stability and calmer estates, and a crown that looked helpless for eight years."
 nd_the.4.a_tt: "Palamas takes his throne: toleration of the Greek rite, less separatism, firmer control and prestige."
 nd_the.4.b_tt: "A Latin bishop in the cathedral: toleration of your own rite, faster conversion and devotion, and a restless Greek population."
 nd_the.5.a_tt: "Venetian hulls and Venetian grain: naval morale, sailors and supply, with an Italian officer holding a key to the citadel."
 nd_the.5.b_tt: "The quarters man their own walls: bigger levies, bigger garrisons and content burghers, at the cost of the carrying trade."
 nd_the.6.a_tt: "The congregations are chartered in the capital: urban growth, research, cloth output and toleration of other faiths."
 nd_the.6.b_tt: "The looms go to the interior: wool output, production efficiency and faster assimilation, but no great houses in the port."
 nd_the.7.a_tt: "The union is law: faster conversion, diplomatic standing and devotion, and a congregation that walks out of its own cathedral."
 nd_the.7.b_tt: "The decree is filed and forgotten: toleration of the Greek rite, less separatism and calmer estates, at the price of your standing in Latin Europe."
 nd_the.8.a_tt: "The presses run. Nothing further is asked of the crown."
 nd_the.9.a_tt: "The villages hold the mountain: silver and gold output and satisfied estates, with the crown's officers kept below the tree line."
 nd_the.9.b_tt: "The mountain is administered from the capital: crown authority, control and revenue, and less metal out of the ground."

 # ==================== Destiny tree ====================
 nd_the_destiny: "The Kingdom Resumed"
 nd_the_destiny_desc: "The crisis decade is behind you. The city is standing, the crown is on a head, and for the first time since 1204 the question is not who holds Thessalonica but what Thessalonica is going to be.\n\nRequires a settled realm."

 nd_the_dest_marches: "The Marches of Prosek and Melnik"
 nd_the_dest_marches_desc: "Prosek is a walled cliff over the Vardar where the river cuts its gorge. Melnik is a town wedged into white sandstone in the Pirin. Dobromir Strez held the first and Alexius Slav the second, and between them they closed both roads into the first kingdom of this name. Boniface of Montferrat died in a pass like these on 4 September 1207, and his head was carried to the Bulgarian court.\n\nHold both rocks, with a settled realm and a real army in the field."

 nd_the_dest_epirus: "The Reckoning with Epirus"
 nd_the_dest_epirus_desc: "Theodore Komnenos Doukas came up the western road from Arta in 1224, took this city, and had himself crowned emperor inside it. The Lombard kingdom ended there. Ioannina and Arta are where that was decided, and they are still where the argument lives.\n\nHold both, with the army and the standing to make terms stick."

 nd_the_dest_ravennika: "The Parliament of Ravennika"
 nd_the_dest_ravennika_desc: "In 1209 the lords of Frankish Greece rode to Ravennika, a day west of Zetounion, and did homage for what they held. Otho de la Roche answered for Athens and Thebes, which he held as a fief of this crown. A king whose vassals hold Attica is a king. One whose vassals do not is a marquis with a better title.\n\nHold Thebes and Athens, with the prestige and the calm to make an assembly mean something. Unlocks the castellany of Platamon."

 nd_the_dest_lemnos: "The Alum of Lemnos"
 nd_the_dest_lemnos_desc: "The dye vats of the wool halls run on alum, and the nearest alum in the world is the sealed earth cut on Lemnos one day each August in front of witnesses. The island's harbour is the best on this side of the Aegean, and the fair of Saint Demetrios is only a saint's day unless the eastern goods come to it.\n\nHold Lemnos, fill the treasury, and draw silk into your own market."

 nd_the_dest_negroponte: "The Fondaco at Negroponte"
 nd_the_dest_negroponte_desc: "Boniface granted Euboea to Ravano dalle Carceri in 1205, so the greatest clearing house in the Latin east began as a fief of this crown. The commune wants it back as a counting house rather than a fief, and a counting house is worth nothing unless a bill drawn in one port is honoured in another.\n\nHold Negroponte, with banking embraced and money in hand."

 nd_the_dest_maona: "The Maona of Chios"
 nd_the_dest_maona_desc: "In 1346 a syndicate of Genoese creditors took Chios and ran it for two centuries as a company, on the mastic of a dozen walled villages in the south of the island. A city governed by its own guilds is the one Latin state in the east that might have thought of that first.\n\nHold Chios, with global trade embraced, a full treasury and a settled realm. Unlocks the house of the kommerkion."

 # ==================== Destiny events ====================
 nd_the.10.t: "The Decade Ends"
 nd_the.10.d: "The barricades are down, the gates stand open, and the grain boats come in on the morning wind as though nothing had happened. Men who shouted at each other across a street for eight years are arguing about the price of fish.\n\nWhat is left is a crown, a city, and six provinces of Macedonia and Thessaly. Small, awkwardly shaped, and yours. Everything from here is a decision rather than an emergency."
 nd_the.10.a: "Then let us govern what we hold."

 nd_the.11.t: "The Two Rocks"
 nd_the.11.d: "Prosek is a wall on a cliff, hanging over the Vardar where the river cuts through the gorge, and nothing goes north without its leave. Melnik is a town driven into white sandstone pyramids in the Pirin, and no army has ever taken it from the front.\n\nStrez held the one and Slav the other, and between them they strangled the first kingdom of this name. Your barons spent the winter working out how to reach them, and this spring they did.\n\nThe garrisons are in. The marches have their lords, their charters and their obligations, and the roads north are open for the first time in a century."
 nd_the.11.a: "The passes are held. Let the marches be enfeoffed."

 nd_the.12.t: "The Reckoning with Epirus"
 nd_the.12.d: "The despots of Epirus have never accepted that this kingdom exists. Theodore Komnenos Doukas came out of Arta in 1224 with an army raised in these same hills, took Thessalonica, and set an imperial crown on his own head in the basilica of Saint Demetrios.\n\nYour host is now on his side of the mountains. Ioannina is invested and the plain of Arta lies open behind it. The constable wants a pitched battle and a dictated peace. The marshals want the castles, the mountain tolls and the flocks that come down from the Pindus every autumn, and observe that castles do not run away."
 nd_the.12.a: "Break them in the field and dictate the peace"
 nd_the.12.b: "Take the castles, the tolls and the flocks"

 nd_the.13.t: "The Parliament of Ravennika"
 nd_the.13.d: "They came in 1209 and they have come again: the lord of Athens and Thebes, the marquis of Boudonitza, the men who hold the Neopatras passes, and behind them a crowd of knights who have not left Greece in four generations and think of nowhere else as home.\n\nThe assembly meets in a field a day west of Zetounion, because no hall in the kingdom will hold it. They will swear. The question is what they swear to.\n\nOaths and fiefs leave them what they are, with their courts, their customs and their sons married to your daughters. Taking their knights into the royal host leaves them the land and nothing else, which is what a king does when he means to stop asking."
 nd_the.13.a: "Bind them by oath, fief and marriage"
 nd_the.13.b: "Take their knights into the royal host"

 nd_the.14.t: "The Alum of Lemnos"
 nd_the.14.d: "Every dyer in the wool halls has said the same thing for a decade: the cloth is only as good as the mordant, and the mordant comes off a hillside on Lemnos where the sealed earth is cut one day a year in front of a priest and a crowd.\n\nThe island is taken. Its harbour is the finest in the northern Aegean, and the first cargo of alum was landed on the quay by men who were rowing fishing boats a year ago. In the same week a Genoese hull put in with raw silk and asked, pleasantly, what the harbour dues were."
 nd_the.14.a: "Let it be entered in the ledger."

 nd_the.15.t: "The Fondaco at Negroponte"
 nd_the.15.d: "Euboea was granted away by Boniface himself, to a Veronese who never expected to keep it. It has been the counting house of the Latin east ever since: the bailo's court, the Venetian warehouses, and the only place between Venice and Alexandria where a bill drawn in one city is honoured in another without argument.\n\nIt is yours now, and the Venetians in the fondaco have asked what changes. Their credit is cheap and their hulls are many, and they will not finance a campaign nobody consulted them about. The commune's own tax farmers would rather see them pay the tenth like anyone else."
 nd_the.15.a: "Leave them their quarter and their credit"
 nd_the.15.b: "Charge them the tenth like everyone else"

 nd_the.16.t: "The Maona of Chios"
 nd_the.16.d: "The mastic villages are walled and the resin is weighed under guard, because a pound of it is worth more than a pound of anything else that grows in this sea. Genoa took the island in 1346 with money advanced by a syndicate of its own citizens, and then simply never bought them out.\n\nThe merchants of your harbour have read that arrangement closely and put the same offer in writing. They will advance the cost, take the mastic and the wine, and render an agreed sum every year. The treasury's clerks would rather the crown administered its own island and kept all of it."
 nd_the.16.a: "Charter a company of citizens to farm it"
 nd_the.16.b: "Keep the island in the crown's own hand"

 # ==================== Destiny timed modifiers ====================
 STATIC_MODIFIER_NAME_nd_the_dest_field_of_epirus: "Epirus Broken in the Field"
 STATIC_MODIFIER_DESC_nd_the_dest_field_of_epirus: "The despotate was beaten in the open and the terms were written afterwards. The Greek clergy of the realm have not said what they think of a Latin king campaigning against an Orthodox prince, which is itself an answer."
 STATIC_MODIFIER_NAME_nd_the_dest_castles_of_the_west: "The Castles of the West"
 STATIC_MODIFIER_DESC_nd_the_dest_castles_of_the_west: "Tower by tower and toll by toll. The western lands are being taken apart and absorbed rather than beaten, and the flocks pay for the garrisons that count them."
 STATIC_MODIFIER_NAME_nd_the_dest_oath_of_the_lords: "The Oath of the Lordships"
 STATIC_MODIFIER_DESC_nd_the_dest_oath_of_the_lords: "The lords of Greece hold their fiefs of this crown and say so in public. They also now expect to be consulted about everything else, and an assembly of barons has an opinion on every law it is shown."
 STATIC_MODIFIER_NAME_nd_the_dest_host_of_the_kingdom: "The Host of the Kingdom"
 STATIC_MODIFIER_DESC_nd_the_dest_host_of_the_kingdom: "The knights of the lordships ride under the royal banner. What their fathers kept as private retinues is one army with one paymaster and one set of orders."
 STATIC_MODIFIER_NAME_nd_the_dest_venetian_quarter: "The Venetian Quarter"
 STATIC_MODIFIER_DESC_nd_the_dest_venetian_quarter: "The fondaco keeps its privileges and the harbour keeps its cheap money and its shipping. The men who lend it will not lend for a war, and say so before they are asked."
 STATIC_MODIFIER_NAME_nd_the_dest_kommerkion_levied: "The Kommerkion Levied"
 STATIC_MODIFIER_DESC_nd_the_dest_kommerkion_levied: "The tenth is assessed on every landed cargo by the commune's own officers, without exemption and without apology. The revenue is excellent. So is the resentment, and it travels."
 STATIC_MODIFIER_NAME_nd_the_dest_maona_chartered: "The Maona Chartered"
 STATIC_MODIFIER_DESC_nd_the_dest_maona_chartered: "A company of citizens holds Chios and renders an agreed sum. Credit is cheap, the island's wine is flowing into the harbour, and a city this comfortable has begun to think of itself as finished."
 STATIC_MODIFIER_NAME_nd_the_dest_island_in_hand: "The Island in the Crown's Hand"
 STATIC_MODIFIER_DESC_nd_the_dest_island_in_hand: "Chios is administered by salaried men and defended by the crown's own hulls. Nothing is farmed out, nothing is shared, and the yards work through the winter."

 # ==================== Destiny buildings ====================
 nd_the_platamon_castle: "Castellany of Platamon"
 nd_the_platamon_castle_desc: "The Frankish tower at the mouth of the Vale of Tempe, raised in the first years after 1204 where the coast road is squeezed between Olympos and the sea. Whoever holds it holds the road between the two halves of the kingdom, so the castellan is a great man and the crown's orders travel at the speed of a road it owns."
 nd_the_platamon_maintenance: "Castellany Upkeep"
 nd_the_platamon_maintenance_desc: "Masonry for the curtain wall, weaponry for the guard, tar for roofs and hoardings, and tools for the smith in the bailey."

 nd_the_kommerkion_house: "House of the Kommerkion"
 nd_the_kommerkion_house_desc: "The customs house on the mole, where the tenth on every landed cargo is assessed, disputed and entered. Under a chartered commune the men holding the ledger are elected by the quarter they tax, and a merchant who trades through this port finds his business measured, protected and counted."
 nd_the_kommerkion_maintenance: "Customs House Upkeep"
 nd_the_kommerkion_maintenance_desc: "Paper for the registers, furniture for the counting room, cloth for the officers' gowns, and tools for the scales and the seals."

 # ==================== Destiny option tooltips ====================
 nd_the.10.a_tt: "The kingdom has a direction to choose. Nothing further is asked of the crown."
 nd_the.11.a_tt: "The marches are held: manpower, heavy horse, and a realm drifting towards its nobility."
 nd_the.12.a_tt: "The field decides it: better peace terms and faster recruitment, and a Greek clergy that noticed the war."
 nd_the.12.b_tt: "The west is taken apart: assaults, plunder and faster integration of what is swallowed."
 nd_the.13.a_tt: "Homage and marriage: cheaper annexation and more diplomatic reach, at the cost of an assembly that argues with every law."
 nd_the.13.b_tt: "One army, one paymaster: better light horse, faster morale recovery and cheaper mercenaries."
 nd_the.14.a_tt: "The mordant is supplied: better galleys, and a realm drifting towards its merchants."
 nd_the.15.a_tt: "The fondaco keeps its charter: cheaper merchants and faster building, and financiers who will not fund a war."
 nd_the.15.b_tt: "The tenth is collected: minting income and cheaper construction, and a reputation that suffers for it."
 nd_the.16.a_tt: "The company holds the island: cheap credit and Chian wine, and a city that grows comfortable."
 nd_the.16.b_tt: "The crown holds the island: a stronger cabinet, harder-hitting hulls and faster yards."

 # ==================== Bureaucracies ====================
 the_curia_of_the_lombards_bureaucracy: "Curia of the Lombards"
 the_curia_of_the_lombards_bureaucracy_desc: "Boniface of Montferrat died at Mosynopolis in September 1207 and left an infant heir, so the kingdom passed to the court of Lombard fief holders around the regent Oberto II of Biandrate. In 1208 they shut the gates of the city against Emperor Henry of Flanders and offered the crown to William VI of Montferrat instead of the child; Henry crowned Demetrius in January 1209 and had Oberto imprisoned at Serres. Seating the curia makes that baronage the state. The castellanies of the passes are kept up, the fiefs answer the summer summons, the Greek villages that feed them march too, and the city's own men are shut out of the council."
 the_archon_of_the_demos_bureaucracy: "Archon of the Demos"
 the_archon_of_the_demos_bureaucracy_desc: "For eight years after 1342 authority in Thessalonica was divided between two archontes. The governors sent from the capital, Michael Monomachos, then John Batatzes, then the megas primikerios John Apokaukos, held the landward side; the harbour answered to an archon the demos chose for itself and to the parathalassioi, the sailors and dockhands of the waterfront. Seating that magistracy keeps the arrangement standing: the quarters trade on their own account, the city polices its own streets, the waterfront speaks in the business of the realm, and the crown's writ stops at the land gate."
 the_synaxis_of_karyes_bureaucracy: "Synaxis of Karyes"
 the_synaxis_of_karyes_bureaucracy_desc: "The Holy Mountain has governed itself from Karyes since the tenth century through a Protos and an assembly of abbots, an arrangement fixed by the typikon John Tzimiskes gave the monks in 972 and altered by a chrysobull of Andronikos II in 1312 that made the Protos the Patriarch's appointee rather than the emperor's. Its houses hold metochia across Macedonia and Thessaly, and their granaries are the surest food reserve in the region. A Latin king who seats the Synaxis buys the consent of his Orthodox subjects, and pays for it in exemptions he cannot tax through."

 the_sekreton_of_thessalonike_bureaucracy: "Sekreton of Thessalonike"
 the_sekreton_of_thessalonike_bureaucracy_desc: "Yolanda Irene of Montferrat took up residence in Thessalonica in 1303 and left the city an imperial court of record, the evages sekreton, which the provincial General Judges of the region later replaced. Andronikos III cut the tribunal to four katholikoi kritai in 1329, at least one of them a bishop; it accepted written complaints only, heard expert testimony where it thought fit, deliberated in seclusion and decided by majority, and it existed to curb the abuses of the powerful. It is the one body in this city that answers to the crown rather than to the barons, the harbour or the Holy Mountain, and its whole business is telling all three what they may not do."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_the_bureaucracy_authority: "Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_the_bureaucracy_authority: "The restored kingdom may seat the bodies that govern Thessalonica. With the capital's own seat there is room for two of the four, so most of the city's claimants are always left outside."
