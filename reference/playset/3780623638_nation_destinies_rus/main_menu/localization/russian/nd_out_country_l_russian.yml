l_russian:
 OUT: "Утремер" #NT!
 OUT_ADJ: "Утремерская" #NT!
 OUT_f: "Утремер" #NT!
 OUT_f_desc: "Единая латинская корона от Нила до Тигра, от Кипра до устья Красного моря: крестовый поход, о котором можно было только мечтать. Любая католическая держава, осуществившая проект на востоке, может провозгласить его, будь то Иерусалим, Латинская империя, африканские крестоносцы или суверенный военный орден, но только до тех пор, пока католики остаются меньшинством среди ее собственных подданных. Аутремер - это не столько завоевание, сколько постоянная проблема правительства: франкская правящая каста, владеющая замками, портами и дорогами паломников, правящая мусульманскими, восточно-христианскими, еврейскими и самаритянскими общинами, у которых есть свои вожди, свои суды и своя вера, и они облагаются налогами, а не обращаются в христианство." #NT!
