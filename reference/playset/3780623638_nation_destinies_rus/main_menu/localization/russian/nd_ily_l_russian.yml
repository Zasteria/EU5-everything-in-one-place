l_russian:
 nd_ily_formed_tt: "Иллирия была образована." #NT!
 nd_ily_e1_done_tt: "Провозглашение Иллирии уже было услышано." #NT!
 nd_ily_path_a_tt: "Выберите судьбу #bold Границы Королевства#!" #NT!
 nd_ily_path_b_tt: "Выберите судьбу #bold Sacrum Illyricum#!." #NT!
  
 STATIC_MODIFIER_NAME_nd_ily_confinia_regni: "Конфиния Регни" #NT!
 STATIC_MODIFIER_DESC_nd_ily_confinia_regni: "Границы королевства, на латыни, которые хорватская канцелярия использовала для обозначения своих приграничных округов. Гарнизоны увеличены вдвое, подступы обнажены, и за каждой долиной, ведущей вглубь страны, наблюдают люди, которые удерживают свои поля при условии, что они будут следить за ней. Однако стена не дружит с людьми, стоящими по другую сторону от нее, и многие из них живут в этом царстве." #NT!
 STATIC_MODIFIER_NAME_nd_ily_sacrum_illyricum: "Сакрам Иллирикум" #NT!
 STATIC_MODIFIER_DESC_nd_ily_sacrum_illyricum: "Римские институты иллирийской нации становятся политикой государства. Колледжи финансируются, издательства лицензируются, а священники обучаются языку, на котором уже говорят их прихожане, и отправляются туда, куда ни один епископ не может следовать за ними. Каждый дукат, потраченный на семинарию, — это дукат, не потраченный на полк, и это видно из ведомостей." #NT!
  
 STATIC_MODIFIER_NAME_nd_ily_slavonic_rite: "Славянский обряд" #NT!
 STATIC_MODIFIER_DESC_nd_ily_slavonic_rite: "Деревенский священник хранит свой молитвенник угловатыми буквами, а корона хранит деревенского священника. Их больше, чем канонов, и в них верят." #NT!
 STATIC_MODIFIER_NAME_nd_ily_latin_chapter: "Латинская глава" #NT!
 STATIC_MODIFIER_DESC_nd_ily_latin_chapter: "При каждом славянском приходе размещается ученая латинская глава. Рим доволен, кафедральные школы заполняются, а деревенскому священнику рассказывают, что означает его собственный миссал." #NT!
 STATIC_MODIFIER_NAME_nd_ily_communal_charters: "Коммунальные уставы" #NT!
 STATIC_MODIFIER_DESC_nd_ily_communal_charters: "Прибрежные города возвращаются к короне с подтвержденными уставами, нетронутыми советами и собственными обычаями. Они платят и помнят, кто позволил им хранить их бухгалтерские книги." #NT!
 STATIC_MODIFIER_NAME_nd_ily_bans_writ: "Письмо о запрете" #NT!
 STATIC_MODIFIER_DESC_nd_ily_bans_writ: "Офицеры запрета заседают в мэриях побережья, и избранный кнез им подотчетен. Коммуны теряют прежнюю свободу маневра, а королевство получает береговую линию, которой фактически управляет." #NT!
 STATIC_MODIFIER_NAME_nd_ily_senj_press: "Пресса в Сене" #NT!
 STATIC_MODIFIER_DESC_nd_ily_senj_press: "Капитул каноников на ветреной Адриатической скале владеет типографией и печатает на ней мессу на славянском языке. Нигде больше в латинском христианском мире это не законно." #NT!
 STATIC_MODIFIER_NAME_nd_ily_friars_charter: "Устав монахов" #NT!
 STATIC_MODIFIER_DESC_nd_ily_friars_charter: "Коричневые привычки идут туда, куда не может корона. Согласно хартии султана, францисканцы поддерживают католиков Боснии в вере, а корона сохраняет канал в провинцию, которой она не владеет." #NT!
 STATIC_MODIFIER_NAME_nd_ily_bosnian_claim: "Боснийское заявление" #NT!
 STATIC_MODIFIER_DESC_nd_ily_bosnian_claim: "Босния внесена в канцелярию как украденное королевство, а не как миссионерское поле. Артиллеристы измеряют стены Яйце, пограничникам рассказывают, сколько стоит христианская провинция, а монахам велят ждать." #NT!
 STATIC_MODIFIER_NAME_nd_ily_graz_subsidy: "Субсидия Граца" #NT!
 STATIC_MODIFIER_DESC_nd_ily_graz_subsidy: "Внутренние австрийские сословия платят за кордон, поэтому кордон подчиняется внутренним австрийским сословиям. Солдаты дешевы, хорошо снабжены и уже не полностью принадлежат короне." #NT!
 STATIC_MODIFIER_NAME_nd_ily_banal_frontier: "Банальная граница" #NT!
 STATIC_MODIFIER_DESC_nd_ily_banal_frontier: "Граница остается под запретом и Сабором, как и законопроект. Королевство, которое платит за свои стены, также может решать, куда им бежать." #NT!
 STATIC_MODIFIER_NAME_nd_ily_mission_beyond: "Миссия за границей" #NT!
 STATIC_MODIFIER_DESC_nd_ily_mission_beyond: "Выпускники Лорето и Сан-Джироламо пересекают земли султана с требником, вымышленным именем и дорогой домой. Они отправляют обратно не только души." #NT!
 STATIC_MODIFIER_NAME_nd_ily_native_clergy: "Наше духовенство" #NT!
 STATIC_MODIFIER_DESC_nd_ily_native_clergy: "Колледжи держат своих выпускников у себя дома. Королевство получает самое образованное приходское духовенство по эту сторону Адриатики, а Конгрегация в Риме ничего не получает." #NT!
 STATIC_MODIFIER_NAME_nd_ily_croat_regiments: "Хорватские полки" #NT!
 STATIC_MODIFIER_DESC_nd_ily_croat_regiments: "Легкая лошадка, которая разведывает дальше, ездит сильнее и горит более тщательно, чем все, что Империя может собрать для себя. Пэрис уже украла шарф, который они носят на шее." #NT!
 STATIC_MODIFIER_NAME_nd_ily_crown_confiscation: "Конфискация" #NT!
 STATIC_MODIFIER_DESC_nd_ily_crown_confiscation: "Две головы и земли двух домов, которые были велики еще до того, как в королевстве появился запрет. Корона внезапно становится крупнейшим землевладельцем Хорватии, и знать не забудет, как это произошло." #NT!
 STATIC_MODIFIER_NAME_nd_ily_reconciled_magnates: "Примирившиеся магнаты" #NT!
 STATIC_MODIFIER_DESC_nd_ily_reconciled_magnates: "Предложения зачитываются, а затем смягчаются. Великие дома сохраняют свои земли и головы и после этого служат короне, которая могла бы забрать и то, и другое." #NT!
  
 nd_ily.1.t: "Регнум Иллирикум" #NT!
 nd_ily.1.d: "Сплит наш. Дворец Диоклетиана, который тысячу лет был городом внутри руин, больше не летает над львом Святого Марка, и дорога через перевал Клис открыта внутрь. Далеко на севере офицеры запрета сидят в Загребе, где Градец на холме и епископский Каптол за ущельем ссорятся на протяжении двух столетий, и теперь им говорят, что это один город.\n\nТо, что провозглашается здесь, - это не просто расширение Хорватии. Люди, составившие этот стиль, относятся к тем же людям, что читали Прибоевича Хварского и Шишгорича Шибеникского: каноники, нотариусы и городские патриции, которые называют свою речь иллирийской, а себя — иллирийскими и которые считают, что это побережье и эти внутренние районы являются наследниками классического Иллирика. Рим уже дал им это имя. В церкви Сан-Джироламо-дельи-Иллиричи мессу читают славяноязычные священники, а прочитанные ими письма по легенде были переданы святому Иерониму, а на самом деле - епископу Сени Иннокентием IV.\n\nКоролевство, которое стоит сегодня, имеет стену с одной стороны и кафедру с другой, и оно не может себе позволить и то, и другое в полной силе. Станет ли Иллирия постоянной границей королевства, с гарнизонами до последней долины и непроницаемой для всего, что за ней? Или это будет славянская провинция Рима, тратящая деньги на коллегии и типографии и отправляющая через границу своих священников, а не кавалерию?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_ily.1.a: "Мы — стена. Пусть он будет построен и укомплектован." #NT!
 nd_ily.1.a_tt: "Конфиния Регни. Гарнизоны, наборы, снабжение и истощение против захватчиков. К мусульманскому населению Боснии относятся гораздо меньше." #NT!
 nd_ily.1.b: "Отправьте священника туда, куда не может пойти солдат." #NT!
 nd_ily.1.b_tt: "Сакрам Иллирикум. Обращение в другую веру, обучение духовенства, институты и положение в Риме. От этого страдает рабочая сила." #NT!
  
 nd_ily.2.t: "Язык святого Иеронима" #NT!
 nd_ily.2.d: "Привилегия старая, странно конкретная и совершенно искренняя. В 1248 году папа Иннокентий IV написал Филиппу, епископу Сеньскому, разрешая духовенству его епархии совершать литургию на славянском языке, используя буквы, которые они называли глаголицей. В качестве оправдания было предложено то, что алфавит был изобретен святым Иеронимом, который родился в Далмации и, следовательно, был одним из наших. Это неверно. Джером не имел к этому никакого отношения, а письма пришли из Моравии. В это также верили на протяжении четырехсот лет, это записано в папских документах, и именно поэтому иллирийская церковь в Риме посвящена святому Иерониму, а не кому-либо другому.\n\nНа практике это означает, что крестьянин на холмах Кварнера слышит мессу понятными ему словами от женатого деревенского священника, у которого есть, возможно, три книги и который может прочитать их все. Каноники собора, обученные латыни и завидующие своей латыни, никогда полностью не примирились с этим.\n\nКанцлерия спрашивает, на каком духовенстве намерена строиться корона." #NT!
 nd_ily.2.a: "Глаголяши. Они наши и их слышат." #NT!
 nd_ily.2.a_tt: "Больше сельского духовенства, лучшая терпимость к нашей вере и более жесткий контроль." #NT!
 nd_ily.2.b: "Установите на каждом приходе учёные латинские каноны." #NT!
 nd_ily.2.b_tt: "Лучше образованное духовенство, престиж и положение среди папства." #NT!
  
 nd_ily.3.t: "Задарский мир" #NT!
 nd_ily.3.d: "Он был основан в ризнице францисканского монастыря в Задаре восемнадцатого февраля 1358 года. Венеция отказалась от всего побережья от Кварнера до Дубровника, и дож обязался вычеркнуть слова «герцог Далмации и Хорватии» из своего титула. Ни один осадный поезд не достиг этого. Это было достигнуто терпеливой войной, венгерским и хорватским оружием в Италии, а также тем очевидным фактом, что сами города предпочли далекого короля близкой республике.\n\nКоммуны теперь возвращаются в королевство со своими статутами в руках: Сплит 1312 года, Задар 1305 года, Шибеник 1379 года, каждая из которых представляет собой книгу самоуправления с избранным князем, советом и поселением. презрение к внешним судьям.\n\nВо всех палатах совета от Трогира до Раба вопрос заключается в том, что корона собирается делать с этими книгами." #NT!
 nd_ily.3.a: "Подтвердите каждый закон. Управляйте побережьем, которое согласно." #NT!
 nd_ily.3.a_tt: "Более сильные торговые центры, довольные граждане и лучшая морская торговля." #NT!
 nd_ily.3.b: "Одно королевство, один закон. Запрет судей в городах." #NT!
 nd_ily.3.b_tt: "Более быстрый рост контроля, более сильное королевское сословие и меньше сепаратизма." #NT!
  
 nd_ily.4.t: "Восемь книг за четырнадцать лет" #NT!
 nd_ily.4.d: "Первый хорватский глаголический миссал вышел в печати двадцать второго февраля 1483 года, через двадцать восемь лет после того, как Гутенберг закончил свою Библию, и теперь никто точно не знает, кто и где его напечатал. Несомненно то, что произошло дальше. В 1492 году капитул Сеня отправил священника Блажа Баромича в Венецию для обучения ремеслу; он работал в магазине Торресани, помогал напечатать глаголический требник в 1493 году и вернулся домой со всеми этими знаниями. Типография в Сене работала с 1494 по 1508 год и выпустила восемь книг. Поколение спустя Шимун Кожичич Беня, епископ Модруша, открыл вторую типографию в своем доме в Риеке и напечатал еще шесть книг за тринадцать месяцев.\n\nВосемь книг, затем шесть. Это небольшой тираж по меркам Венеции, которая печатала такое количество за две недели. Это также единственное место в латинском христианском мире, где сама месса печаталась на местном языке и на алфавите, который не мог прочитать ни один римлянин.\n\nКаноники требуют дополнительного предоставления бумаги и свинца." #NT!
 nd_ily.4.a: "Пусть пресса работает. Письма являются нашим свидетельством о праве собственности." #NT!
 nd_ily.4.a_tt: "Увеличение выпуска книг, рост грамотности и более быстрый рост институтов." #NT!
  
 nd_ily.5.t: "Устав Милодража" #NT!
 nd_ily.5.d: "Королевство Босния прекратило свое существование в 1463 году за одно лето. Король Степан Томашевич был схвачен в Ключе и обезглавлен, великие крепости открывались одна за другой, а Мехмед проезжал через страну, которая годом ранее имела свою собственную корону.\n\nУцелела одна только францисканская опека Босны Сребрена, основанная в 1340 году для работы среди боснийской церкви и теперь единственная сохранившаяся в провинции организация латинской церкви. Его опекун, фра Анджео Звиздович, отправился в лагерь султана в Милодраже и ушел с хартией: к монахам нельзя приставать, их дома нельзя захватывать, а те, кто следовал за ними, должны сохранять свое имущество и свои богослужения. С тех пор документ хранится в Фойнице и снова и снова предъявляется османским судьям, которые не ожидали, что он существует.\n\nВ течение четырех столетий монахи будут единственными епископами, которые есть в Боснии. Канцелярия должна решить, является ли это основанием или оскорблением." #NT!
 nd_ily.5.a: "Монахи держат Боснию. Финансируйте их и будьте терпеливы." #NT!
 nd_ily.5.a_tt: "Более быстрое обращение других религиозных групп, лучшая терпимость к ним и более теплые отношения." #NT!
 nd_ily.5.b: "Босния – это украденная корона. Приготовьтесь принять его обратно." #NT!
 nd_ily.5.b_tt: "Лучшие результаты в войне с представителями других конфессий, более сильные осады и более тяжелые сражения с ними в полевых условиях." #NT!
  
 nd_ily.6.t: "Кто платит за кордон" #NT!
 nd_ily.6.d: "Фронтир перестал быть событием и стал местом. От Адриатики в Сене до Дравы теперь это постоянный пояс фортов, сторожевых домов в пределах видимости друг друга и поселений солдатских деревень, организованных с 1553 года в генералитеты Хорватии и Славонии. Люди в нем держат свою землю без повинностей в обмен на наследственную службу, выходят на сигнал тревоги и во всем, кроме названия, представляют собой постоянную армию.\n\nЭто также разорительно дорого, и Сабор не может за нее заплатить. Поместья Штирии, Каринтии и Карниолы могут и предлагались. Однако они не будут платить за солдат, которыми командуют из Загреба.\n\nЭто конституционный вопрос эпохи, замаскированный под проблему бухгалтерского учета. Кто платит Краине, тот владеет ею, а кто владеет ею, тот владеет границей." #NT!
 nd_ily.6.a: "Возьмите австрийские деньги. Сначала стены, потом гордость." #NT!
 nd_ily.6.a_tt: "Дешевое содержание армии и более крупные гарнизоны, оплачиваемые королевской властью." #NT!
 nd_ily.6.b: "Граница принадлежит королевству. Мы найдем деньги." #NT!
 nd_ily.6.b_tt: "Более быстрый рост контроля и более крупные сборы, оплачиваемые за счет содержания армии." #NT!
  
 nd_ily.7.t: "Колледжи для нации под другой короной" #NT!
 nd_ily.7.d: "В 1580 году Григорий XIII основал Иллирийский колледж в Лорето и передал его иезуитам, чтобы мальчики из славянских земель могли стать священниками, способными снова вернуться домой. В 1589 году Сикст V, уже перестроивший в Риме церковь Сан-Джироламо дельи Иллиричи, утвердил буллой Sapientiam Sanctorum прикрепленный к ней капитул славяноязычных священников. За ними последовали Болонья, Фермо и Анкона, создавшие собственные фонды.\n\nЦель никогда не вызывала сомнений. Марин Темперика написал генералу-иезуиту в 1582 году, что единственный славянский язык может перенести проповедника от Адриатики до Черного моря и что орден должен напечатать грамматики и словари, чтобы исправить это. Колледжи существовали для того, чтобы готовить миссионеров для земель, находящихся под властью Османской империи, и, если верить честному учету, они работали хуже. Они также выпускали приходских священников, епископов и писателей на протяжении трех столетий.\n\nНаш собственный фонд сейчас принимает первый набор, и кто-то должен решить, куда направить его выпускников." #NT!
 nd_ily.7.a: "Через границу. Именно для этого они и были созданы." #NT!
 nd_ily.7.a_tt: "Более быстрое обращение других религиозных групп, более сильные миссионерские здания и лучшие шпионские сети." #NT!
 nd_ily.7.b: "В свои приходы. Благотворительность начинается с алтаря." #NT!
 nd_ily.7.b_tt: "Более образованное духовенство, довольное духовенство и многое другое." #NT!
  
 nd_ily.8.t: "Узел на горле" #NT!
 nd_ily.8.d: "Немцы называют их Крабатенами и не могут решить, кавалерия ли это или чума. В разгар войны в Империи около двадцати тысяч из них едут под имперскими знаменами, среди них большинство аркебузиров Валленштейна, и их работа заключается в разведке, преследовании, перерезании конвоев и сжигании всего, что может накормить врага на следующей неделе. Поставьте их против линии пик и стрел, и они не устоят; попросите их разорить провинцию, и она будет разрушена.\n\nФранцузы, которые сражались с ними и нанимали их, заметили льняной шарф, завязанный на шее офицеров, подхватили его и назвали в честь людей, которые его носили. Полки переживут войну, война переживет век, а шарф переживет и то, и другое.\n\nСбор утвержден и знамена выданы." #NT!
 nd_ily.8.a: "Пусть катаются. Империя заплатит за страх." #NT!
 nd_ily.8.a_tt: "Более сильная легкая кавалерия, больше грабежей, более быстрые марши и растущие армейские традиции." #NT!
  
 nd_ily.9.t: "Винер-Нойштадт" #NT!
 nd_ily.9.d: "Петар Зрински был изгнан из Хорватии, а его зять Фран Крсто Франкопан был последним из дома, который владел Крк и Кварнером, насколько кто-либо помнил. Вместе они контролировали треть королевства. Убежденные, что Вена продала границу султану в Васваре и будет продавать ее и дальше, они провели семь лет в переписке с французами, венецианцами, поляками и, наконец, с самими турками, и были преданы каждым из них по очереди.\n\nОни приехали в Вену под охранной грамотой в 1670 году, чтобы просить прощения. Тридцатого апреля 1671 года оба были обезглавлены во дворе Винер-Нойштадта, а их имения, принадлежавшие половине Хорватии, перешли в палату.\n\nПриговор подписан. Что еще не решено, так это то, выполнит ли это корона." #NT!
 nd_ily.9.a: "Оставьте приговор в силе. Берите земли с головами." #NT!
 nd_ily.9.a_tt: "Гораздо более сильное королевское сословие и более жесткий контроль. Дворянство в ярости." #NT!
 nd_ily.9.b: "Простите их. Магнат, который обязан вам своей шеей, лоялен." #NT!
 nd_ily.9.b_tt: "Довольная знать, большие поборы и легитимность. Коронное поместье уступает место." #NT!
  
 nd_ily_glagoljasi: "Глаголяши" #NT!
 nd_ily_glagoljasi_desc: "В 1248 году Иннокентий IV разрешил сеньскому епископу и его духовенству совершать литургию на славянском языке, используя глаголицу, на основании убеждения, что святой Иероним изобрел алфавит. Вера была ошибочной, а привилегия была реальной. Он создал класс женатых, полуграмотных деревенских священников, гораздо более многочисленных, чем латинские каноники, и гораздо более близких к людям, которым они служили." #NT!
 nd_ily_vinodolski_zakonik: "Код Винодола" #NT!
 nd_ily_vinodolski_zakonik_desc: "Записано шестого января 1288 года сорока двумя выборными мужчинами из девяти общин долины Винодол на глаголице и на их собственном языке, чтобы урегулировать именно то, чего графы Крка могли и не могли требовать от них. Это не городской устав, а сельский закон, и он настолько стар, что Русская Правда является единственным предшествующим ему славянским кодексом." #NT!
 nd_ily_banderiji: "Бандерия" #NT!
 nd_ily_banderiji_desc: "До того, как в королевстве появилась постоянная пограничная армия, оно имело знамена своих великих домов: Шубича, Нелипича, Курьяковича, Франкопана, каждый из которых выставлял свою собственную кольчужную свиту под собственным оружием. Великолепный, дорогой и подотчетный лорду перед королем." #NT!
 nd_ily_banska_vlast: "Банальный авторитет" #NT!
 nd_ily_banska_vlast_desc: "Запрет был наместником фактически, если не по титулу. Он созвал Сабор, возглавил бандериум королевства, отчеканенный от его собственного имени в прежние века и судивший под королевским. Хорватия была страной, которой нужно было управлять с ее собственного согласия, и орган запрета был механизмом его получения." #NT!
 nd_ily_posavska_hrastovina: "Дубовые леса Савы" #NT!
 nd_ily_posavska_hrastovina_desc: "В пойменных лесах Савы и Дравы дуб растет медленно, прямо и настолько мелковолокнисто, что корабелы и бондари готовы платить за его транспортировку на очень дальние расстояния. По тем же рекам плывет зерно Паннонской равнины." #NT!
 nd_ily_tricesima: "Тридцатый" #NT!
 nd_ily_tricesima_desc: "Трикесима, королевский обычай, составляющий одну тридцатинную часть, совершаемый на определенных станциях на дорогах между внутренними районами страны и морем. Это финансовая основа королевства, реальным продуктом которого является расстояние между Савой и Адриатикой." #NT!
 nd_ily_zadarski_mir: "Задарский мир" #NT!
 nd_ily_zadarski_mir_desc: "По договору, приведенному к присяге во францисканской ризнице Задара в феврале 1358 года, Венеция отказалась от всего побережья Далмации, и дож лишил герцога Далмации его титула. Города возвращались под власть короны, и каждая последующая Иллирия наследует и побережье, и память о его утрате." #NT!
 nd_ily_glagoljski_notari: "Нотариусы-глаголицы" #NT!
 nd_ily_glagoljski_notari_desc: "Привилегия 1248 г. была литургической. За столетие это стало привычкой всей общественной жизни побережья: договоры аренды, завещания, пограничные соглашения и судебные протоколы, составленные на глаголице и на народном языке, так что человек, не умеющий читать по-латыни, все равно мог получить свой собственный контракт." #NT!
 nd_ily_pavlini: "Полинские отшельники" #NT!
 nd_ily_pavlini_desc: "Единственный религиозный орден, основанный на территории Хорватского и Венгерского королевств, и единственный, который можно было с полным основанием назвать местным. В их доме в Лепоглаве, подаренном графами Целе, находилась старейшая гимназия в стране и, со временем, лучшая библиотека в ней." #NT!
 nd_ily_gradec_zlatna_bula: "Золотая булла Градца" #NT!
 nd_ily_gradec_zlatna_bula_desc: "Бела IV, спасаясь от монголов, предоставил Градцу статус свободного королевского города в 1242 году. Он стоял напротив укрепленного епископом Каптола через ущелье, враждовал с ним в течение следующих трехсот лет, время от времени сжигал его, и между ними двумя они стали Загребом." #NT!
 nd_ily_senjska_tiskara: "Пресса в Сене" #NT!
 nd_ily_senjska_tiskara_desc: "Глаголический миссал 1483 года был напечатан через двадцать восемь лет после Гутенберга. Блаж Баромич изучил это ремесло в Венеции и привез его домой, а типография капитула в Сене работала с 1494 по 1508 год. Нигде больше в Латинской Европе сама месса не печаталась на народном языке." #NT!
 nd_ily_bosna_srebrena: "Босна Сребрена" #NT!
 nd_ily_bosna_srebrena_desc: "Францисканская опека Боснии, основанная в 1340 году, была единственным институтом латинской церкви, пережившим завоевание 1463 года. Фра Анджео Звиздович получил охранную хартию от Мехмеда II в Милодраже, и в течение четырех столетий монахи были единственной католической церковью Боснии." #NT!
 nd_ily_antemurale: "Антемурале христианитатис" #NT!
 nd_ily_antemurale_desc: "Лев X дал королевству титул в письме о запрете Петра Бериславича в 1519 году. Это была лесть, сопряженная с обязательствами. Поле Крбава в 1493 году уже показало, чего стоила стена, когда она рухнула, и она будет периодически разрушаться в течение следующих двух столетий." #NT!
 nd_ily_kaptolske_zidine: "Стены главы" #NT!
 nd_ily_kaptolske_zidine_desc: "Между 1512 и 1520 годами каноники Загреба обнесли стеной собственный собор с башнями и рвом, в то время как город внизу оставался открытым. Эта ситуация повторялась по всему королевству, пока капитул не стал последним защищаемым зданием в приходе." #NT!
 nd_ily_judita: "Юдита" #NT!
 nd_ily_judita_desc: "Марко Марулич из Сплита закончил его двадцать второго апреля 1501 года и напечатал в Венеции в 1521 году: историю Юдифи и Олоферна в хорватских стихах, адресованную непосредственно людям, подвергшимся нападению Османской империи. Он писал на латыни для Европы, его читали Томас Мор и Фрэнсис Ксавьер, а для дома он писал на местном языке." #NT!
 nd_ily_pribojevic: "Де Ориджин Славорум" #NT!
 nd_ily_pribojevic_desc: "Винко Прибоевич предстал перед дворянами Хвара в 1525 году и сказал им, что они иллирийцы, что македонцы Александра были их родственниками и что все славяне от Адриатики до Волги были с ними одной крови. Напечатанное в Венеции в 1532 году и расширенное Мавро Орбини из Рагузы в 1601 году, это заявление дало рассеянному католическому народу единственное имя, которому можно было ответить." #NT!
 nd_ily_haramije: "Харамидже" #NT!
 nd_ily_haramije_desc: "Построен в 1539 году в качестве платного пехотинца для хорватских и славонских фортов с одной конкретной задачей: преследовать османских налетчиков-мартолосов, которые пересекали границу, чтобы захватить людей и продать их. Это была война похищений, и ответом на нее были харамидже." #NT!
 nd_ily_vojna_krajina: "Военный рубеж" #NT!
 nd_ily_vojna_krajina_desc: "Организованная с 1553 года в Хорватское и Славонское генералитеты, Краина владела землей в наследственном владении вопреки наследственной службе. Целое население было переселено в него для размещения гарнизонов, и со временем кордон стал обществом со своим собственным законом, своими капитанами и вообще без землевладельцев." #NT!
 nd_ily_karlovac: "Карлштадт" #NT!
 nd_ily_karlovac_desc: "Заложенная в 1579 году на пустом лугу при встрече Купы и Кораны шестиконечная звезда с сеткой внутри и гарнизоном, оплаченным имениями Внутренней Австрии. Единственный на границе специально построенный город-крепость, имеющий собственный план." #NT!
 nd_ily_ilirski_kolegiji: "Иллирийские колледжи" #NT!
 nd_ily_ilirski_kolegiji_desc: "Григорий XIII открыл Иллирийский колледж в Лорето в 1580 году; Сикст V перестроил Сан-Джироламо-дельи-Иллиричи в Риме и утвердил в нем главу славяноязычных священников буллой Sapientiam Sanctorum в 1589 году. Оба существовали для создания духовенства, которое могло вернуться домой в земли, куда не мог путешествовать ни один епископ." #NT!
 nd_ily_ilirska_gramatika: "Иллирийская грамматика" #NT!
 nd_ily_ilirska_gramatika_desc: "Фауст Вранчич из Шибеника напечатал свой словарь пяти благородных европейских языков в Венеции в 1595 году. Бартол Кашич из Пага опубликовал Institutionum linguae Illyricae в Риме в 1604 году по приказу генерала-иезуита, потому что миссионеру нужен был один иллирийский язык, которого приняли бы и боснийец, и далматинец." #NT!
 nd_ily_skela_spalatensis: "Скала Сплита" #NT!
 nd_ily_skela_spalatensis_desc: "Даниэль Родрига потратил десять лет, убеждая Венецию, и в 1592 году в Сплите открылась скала с таможней и карантином. Боснийский паша согласился позволить караванам идти по этому пути, и сухопутная торговля на Балканах приобрела конечный пункт на Адриатике." #NT!
 nd_ily_crabati: "Хорваты" #NT!
 nd_ily_crabati_desc: "Около двадцати тысяч хорватских легких кавалеристов находились на императорской службе в разгар войны с Германией, среди них было большинство аркебузиров Валленштейна. Они разведывали, преследовали, перерезали конвои и сжигали территорию, а французы позаимствовали шарф, который завязывали на шее, и назвали его в их честь." #NT!
 nd_ily_urota: "Заговор магнатов" #NT!
 nd_ily_urota_desc: "Петар Зрински и Фран Крсто Франкопан, убежденные, что Вена продала границу в Васваре, вступили в сговор с Францией, Венецией, Польшей и, наконец, Портой, и все они были преданы. Тридцатого апреля 1671 года они были обезглавлены в Винер-Нойштадте, и палате перешли величайшие поместья Хорватии." #NT!
 nd_ily_oslobodjenje_slavonije: "Восстановление Славонии" #NT!
 nd_ily_oslobodjenje_slavonije_desc: "Карловиц в 1699 году вернул короне Славонию и Сирмию, опустошенные за полтора века набегов и вновь превратившиеся в дубовый лес. За этим последовало не завоевание, а заселение: колонисты были привезены целыми повозками и пограничные полки высажены на новой линии." #NT!
 nd_ily_rijecka_luka: "Свободный порт" #NT!
 nd_ily_rijecka_luka_desc: "Риека и Бакар были объявлены свободными портами в 1719 году. Впервые во внутренних районах Паннонии появился выход с соленой водой, которым они полностью владели, а не арендовали у заморской республики." #NT!
 nd_ily_karolinska_cesta: "Каролина-роуд" #NT!
 nd_ily_karolinska_cesta_desc: "Проведенная из Карловаца через Горский Котар в Бакар между 1726 и 1732 годами инженером Антоном Матиасом Вайсом, это была первая дорога через эти горы, по которой могла пройти груженая повозка. Все, что было до этого, проезжало через перевалы на вьючной лошади." #NT!
 nd_ily_zupne_skole: "Приходские школы" #NT!
 nd_ily_zupne_skole_desc: "Деревенский священник учил деревенских детей письму, а буквы, которые он учил, были буквами из его собственного молитвенника. Грамотность в этом королевстве распространялась от алтаря, а не вниз от двора, и достигла людей, которых не приняла бы ни одна придворная школа." #NT!
 nd_ily_jozefinska_cesta: "Жозефина и Луизиана" #NT!
 nd_ily_jozefinska_cesta_desc: "«Жозефина» достигла Сеня в 1779 году, а «Лужияна» достигла Риеки в 1811 году, каждая из них была более прямой и лучше предыдущей, пока повозка не смогла переправиться из Савы в Адриатику за несколько дней. Богатством этого королевства всегда было расстояние между ними." #NT!
 nd_ily_zadarsko_sjemeniste: "Семинария в Задаре" #NT!
 nd_ily_zadarsko_sjemeniste_desc: "Матей Караман, архиепископ Задара, напечатал исправленный глаголический миссал в Риме в 1741 году и основал в 1748 году семинарию для обучения священников, которые действительно могли его читать. Привилегии 1248 года исполнилось пятьсот лет, и ее до сих пор преподают мальчикам." #NT!
 nd_ily_rjecoslozje: "Рьекослозье" #NT!
 nd_ily_rjecoslozje_desc: "Иоаким Стулли из Рагузы потратил пятьдесят лет на свой словарь и напечатал его между 1801 и 1810 годами: около восьмидесяти тысяч слов на иллирийском языке, противопоставленных латыни и итальянскому, последний и крупнейший памятник научной иллирийской идеи до того, как политика отобрала это слово у ученых." #NT!
 nd_ily_urbar: "Городское поселение" #NT!
 nd_ily_urbar_desc: "Крестьяне Северина восстали в 1755 году, и ответом стал урбарий: письменный график того, что арендатор должен своему господину и, что еще более примечательно, чего он не должен. Обязательства хорватской и славянской деревни были зафиксированы на бумаге и впоследствии могли быть оспорены в суде." #NT!
 nd_ily_kraljevska_akademija: "Королевская Академия" #NT!
 nd_ily_kraljevska_akademija_desc: "Иезуиты были подавлены в 1773 году, а их загребский колледж в 1776 году стал Королевской академией наук, коронным учреждением, состоящим из библиотеки распущенного ордена, лекционных залов и безработных профессоров." #NT!
  
 nd_ily_glagoljaska_zupa: "Глаголический приход" #NT!
 nd_ily_glagoljaska_zupa_desc: "Деревенская церковь, священник которой читает мессу на славянском языке по миссалу, написанному глаголицей, в соответствии с папской привилегией, предоставленной епископу Сень в 1248 году и никогда не отозванной. Он женат, у него мало книг, и его прихожане понимают каждое его слово. Может быть построено только там, где люди действительно говорят на языке, на который распространяется данная привилегия." #NT!
 nd_ily_tridesetnica: "Станция Тричесима" #NT!
 nd_ily_tridesetnica_desc: "Королевская таможня с весами, хранилищем и охраной, принимающей одну из тридцати от каждого груза, проходящего между внутренними районами и морем. Доходы принадлежат короне, а не городу, и станции стоят только там, где можно остановить движение." #NT!
 nd_ily_glagoljska_tiskara: "Глаголица Пресс" #NT!
 nd_ily_glagoljska_tiskara_desc: "Главную печатную машину с вырезанным глаголическим шрифтом, такую ​​​​как Блаж Баромич привез из Венеции в Сень в 1493 году, а Шимун Кожичич Бенья установил в своем собственном доме в Риеке в 1530 году. Небольшие канцелярские и печатные книги, которые не разрешено печатать ни одной другой типографии в латинско-христианском мире." #NT!
 nd_ily_kaptolska_utvrda: "Глава Крепость" #NT!
 nd_ily_kaptolska_utvrda_desc: "Стены и башни собора были возведены за счет средств капитула по образцу загребского Каптола, построенного между 1512 и 1520 годами. Ключи принадлежат каноникам, они платят гарнизону, а когда приходят рейдеры, приход входит внутрь." #NT!
 nd_ily_ilirski_kolegij: "Иллирийский колледж" #NT!
 nd_ily_ilirski_kolegij_desc: "Колледж-интернат по образцу Лорето и Сан-Джироламо, набирающий мальчиков из славянских земель и выпускающий священников, способных проповедовать на языке, на котором говорит их народ. Его выпускники идут туда, куда не могут епископы, а его библиотека — лучшая в провинции." #NT!
 nd_ily_cardak: "Пограничный блокхаус" #NT!
 nd_ily_cardak_desc: "Деревянная сторожевая изба с огневой площадкой и сигнальным ружьем, одна из цепочек, выстроенных на виду друг у друга вдоль кордона, и вокруг нее расположились солдатские дворы, держащие свою землю от наследственной службы. Стоит только построить на границе, и граница сдвигается." #NT!
  
 nd_ily_zupa_maintenance: "Содержание прихода" #NT!
 nd_ily_zupa_maintenance_desc: "Свечной воск, алтарное вино, ткань для облачения и бумага для записи крещений. Приходской священник ведет единственную письменную запись, в которой когда-либо появится большинство его людей." #NT!
 nd_ily_pm_zupna_skola: "Приходская школа" #NT!
 nd_ily_pm_zupna_skola_desc: "Священник учит деревенских детей читать буквы своего молитвенника в комнате за церковью между сбором урожая и посевом." #NT!
 nd_ily_tridesetnica_maintenance: "Таможенный реестр" #NT!
 nd_ily_tridesetnica_maintenance_desc: "Бухгалтерские книги, печати, ламповый воск и древесина весовой. Каждый груз, который здесь останавливается, учитывается, оценивается и облагается налогом в размере одной тридцать." #NT!
 nd_ily_pm_notarski_ured: "Нотариальная контора" #NT!
 nd_ily_pm_notarski_ured_desc: "Государственный нотариус составляет договоры аренды, завещания и граничные расчеты на народном языке и глаголице, чтобы стороны могли услышать, как им зачитано собственное соглашение." #NT!
 nd_ily_pm_karavanska_skela: "Конечная остановка каравана" #NT!
 nd_ily_pm_karavanska_skela_desc: "Боснийские караваны спускаются к пристани с шерстью, шкурами и воском, задерживаются на сорок дней и возвращаются вглубь страны с венецианской тканью. Скала в Сплите изменила торговый путь посредством споров, а не войны." #NT!
 nd_ily_pm_slobodna_luka: "Свободный портовый склад" #NT!
 nd_ily_pm_slobodna_luka_desc: "Согласно патентам свободного порта, пошлина снимается, а товары лежат в сараях короны в ожидании борта. Веревки, смола и клепки наружу, все остальное внутрь." #NT!
 nd_ily_tiskara_liturgija: "Миссалы и Бревиарии" #NT!
 nd_ily_tiskara_liturgija_desc: "Угловая сеньская глаголица, вырезанная из свинца и установленная канонами, представляет собой единственную народную литургию, которую Рим допускает на латинском Западе." #NT!
 nd_ily_pm_pucka_knjiga: "Книги для мирян" #NT!
 nd_ily_pm_pucka_knjiga_desc: "Стихи, хроники и молитвы на народном языке для людей, не являющихся духовенством, в той линии, которую Марулич открыл Юдитой и никогда полностью не завершил." #NT!
 nd_ily_pm_latinicka_slova: "Иллирийский язык римскими буквами" #NT!
 nd_ily_pm_latinicka_slova_desc: "Грамматика Кашича была написана римским шрифтом, чтобы иезуит в Риме мог выучить иллирийский язык, не изучая предварительно второй алфавит. Компромисс удвоил читательскую аудиторию и вдвое уменьшил загадочность." #NT!
 nd_ily_pm_karamanov_misal: "Исправленный Миссал" #NT!
 nd_ily_pm_karamanov_misal_desc: "Редакция Карамана 1741 года, вырезанная и отлитая в соответствии со стандартами Конгрегации по распространению веры и отправленная обратно по побережью в приходы, которые использовали потертые копии в течение двух столетий." #NT!
 nd_ily_kaptol_maintenance: "Глава Гарнизона" #NT!
 nd_ily_kaptol_maintenance_desc: "Камень для навесной стены, древесина для рекламных щитов, оружие для людей, которых каноники держат на жалованье, и воск для хора, который продолжает петь за ним." #NT!
 nd_ily_pm_kaptolski_arsenal: "Глава Арсенала" #NT!
 nd_ily_pm_kaptolski_arsenal_desc: "Порох, дроби и стрелковое оружие хранятся в подвале собора и выдаются приходу при срабатывании сигнализации. Приграничные епископы хранили лучший запас мушкетов, чем реликвий." #NT!
 nd_ily_kolegij_maintenance: "Фонд колледжа" #NT!
 nd_ily_kolegij_maintenance_desc: "Книги, бумага, ткань для привычек учеников и воск для ночных часов. Колледж, состоящий из мальчиков-резидентов, стабильно проедает свои средства и не производит ничего измеримого в течение шести лет." #NT!
 nd_ily_pm_akademija: "Академия наук" #NT!
 nd_ily_pm_akademija_desc: "Линзы, инструменты и отчет о печати после того, как корона забрала лекционные аудитории распущенного ордена и поместила в них натурфилософию." #NT!
 nd_ily_cardak_maintenance: "Кордон Дозор" #NT!
 nd_ily_cardak_maintenance_desc: "Порох для сигнального пистолета, древесина для платформы, смола для маяка и звери для людей, которые едут по линии между домами." #NT!
 nd_ily_pm_zadruga: "Домашние хозяйства солдат" #NT!
 nd_ily_pm_zadruga_desc: "Большая семья, владеющая границей, тридцать душ под одной крышей, обрабатывающих землю, которую корона не может облагать налогом, при единственном условии, что ее люди окажутся вооруженными, когда их вызовут." #NT!
  
 a_nd_ily_banderij: "Бандерий" #NT!
 a_nd_ily_banderij_desc: "Защищенная кольчугой свита великого дома, поднятая под собственным знаменем и собственным оружием. Великолепно смонтированный, тяжелый в бою, медленный в сборке и путешествующий с поклажей лорда, а не солдата." #NT!
 a_nd_ily_haramija: "Харамидже" #NT!
 a_nd_ily_haramija_desc: "Платный пограничный пехотинец, созданный в 1539 году для охоты на османских налетчиков в лесах и речных районах Савы и Уны. Быстрый, дешевый и легковооруженный, он никогда не предназначался для поддержания боевой линии." #NT!
 a_nd_ily_crabat: "Хорватская легкая кавалерия" #NT!
 a_nd_ily_crabat_desc: "Пограничная кавалерия, нанятая для участия в войне с Германией, не имела себе равных в разведке, преследовании и разрушении сельской местности. Они не выдержат перестрелки, а льняной шарф на их горле дал Европе галстук." #NT!
  
 levy_nd_ily_banderij: "Бандериум Леви" #NT!
 levy_nd_ily_banderij_desc: "Магнаты королевства выставляют свои собственные кольчужные свиты под свои знамена, как они это делали с тех пор, как у короны не было другой армии." #NT!
 levy_nd_ily_haramija: "Харамидже Леви" #NT!
 levy_nd_ily_haramija_desc: "Пограничная пехота, набранная из солдатского и крестьянского населения пограничных крепостей, оплачиваемая капитаном и выпущенная на рейдовые дороги." #NT!
  
  ############################################################################## 
  # DESTINY TREE 
  ############################################################################## 
  
 nd_ily_destiny: "Корона иллирийской нации" #NT!
 nd_ily_destiny_desc: "Иллирия провозглашена, и аргумент, который ее породил, теперь стал политикой. Одно казначейство не может одновременно снабжать гарнизонами каждую долину и обеспечивать каждый колледж, и курс, принятый при провозглашении, - это курс, который канцелярия будет продолжать вносить в реестр, пока он не будет завершен. Требуется: стабильность 75." #NT!
  
 nd_ily_dest_prekodravlje: "За Дравой" #NT!
 nd_ily_dest_prekodravlje_desc: "Драва — не граница. Это дорога, и санджак на дальнем берегу существует для того, чтобы ею пользоваться: страна разбойников с центром в Пече и переправой в Мохаче, которая каждое лето с 1543 года собирает урожай Славонии. Стена, защищенная сзади, - это стена, через которую перелезают. Требуется: собственные Печ и Мохач, численность армии 30 человек." #NT!
  
 nd_ily_dest_alba_graeca: "Альба Грека" #NT!
 nd_ily_dest_alba_graeca_desc: "Канцелярия называет белую крепость у слияния Альба-Грека, а остальной христианский мир называет ее ключом. Тот, кто проводит встречу Савы и Дуная, решает, где будет вестись следующая война, а переправа у Шабаца решает, кто достигнет встречи. Требуется: владеть Шабацем и Белградом, численность армии 50, общее развитие 1000." #NT!
  
 nd_ily_dest_banatski_kordon: "Банатский кордон" #NT!
 nd_ily_dest_banatski_kordon_desc: "Линия теперь идет непрерывно от Адриатики до гор Трансильвании: сторожевые посты в пределах видимости друг друга, переходы, которые разрешены или закрыты, и население, которое удерживает свои поля при условии, что оно окажется по сигналу тревоги. Королевство, которое платит за это из своей казны, не подчиняется чьим-либо приказам. Открывает Пограничный Совет. Требуется: владеть Тимишоарой и Смедерево, численность армии 75, престиж 75, общее развитие 1500." #NT!
  
 nd_ily_dest_propaganda: "Конгрегация пропаганды" #NT!
 nd_ily_dest_propaganda_desc: "В 1622 году Рим основывает Конгрегацию по распространению веры, а четыре года спустя ее многоязычная типография начинает печатать все алфавиты, необходимые миссиям, в том числе угловатые буквы Сенджа. Королевство само становится мастерской этой общины: печатные станки, бумага, семинарии и люди, обслуживающие их, оплачиваются дома, потому что никто больше за них платить не будет. Требуется: включенный типографский станок, книги, производимые или продаваемые на одном из ваших рынков, 1000 золота." #NT!
  
 nd_ily_dest_marcanska_unija: "Союз Марки" #NT!
 nd_ily_dest_marcanska_unija_desc: "Симеон Вратанья отправился в Рим в 1611 году и вернулся домой епископом, находившимся в римском послушании, с нетронутой собственной литургией. Монастырь Марча становится резиденцией союзной епархии православных пастухов, охраняющих границу, а самое опасное население королевства на бумаге становится католиком. Требуется: принял конфессионализм, золото 2000, общее развитие 1000." #NT!
  
 nd_ily_dest_ecclesia_illyrica: "Иллирийская церковь" #NT!
 nd_ily_dest_ecclesia_illyrica_desc: "Ричепути и Фарлати начинают Illyricum Sacrum, реестр всех престолов в Иллирике, начиная с апостолов, в тот момент, когда корона достигает провинции, которую географы до сих пор называют этим именем. Шкодер и Лежа находятся под властью католического короля, как и миссионерское архиепископство в Скопье, так что священники, обученные в Лорето, больше не служат по усмотрению султана. Открывает святилище Мариан. Требуется: владеть всей провинцией Иллирия, владеть Скопье, золото 3000, престиж 75." #NT!
  
 nd_ily.10.t: "Для чего предназначено Царство" #NT!
 nd_ily.10.d: "У канцелярии есть привычка, которой она научилась у нотариусов: все, что решено, сразу же записывают, чтобы никто потом не мог утверждать, что решено было иначе. Чиновники вносят в реестр курс короны, латинские буквы слева и угловые буквы справа, и запись будет зачитываться вслух на каждом Соборе до тех пор, пока есть Сабор, которому можно ее прочитать.\n\nЗа последней сторожевой станцией страна остается той же страной. Тот же карст, тот же дуб, те же деревни, где священник женат и проводится месса. Линия, проведенная через него, — это решение, а не география, и решение можно переместить.\n\nЗа этим следует отработка уже сделанного выбора." #NT!
 nd_ily.10.a: "Внесите его в реестр." #NT!
  
 nd_ily.11.t: "Санджак через реку" #NT!
 nd_ily.11.d: "Полтора века лето начиналось одинаково. Вода упала, броды открылись, и всадники санджака, чье местопребывание — Печ, переправились через Драву в Славонию, взяли то, что можно было прогнать и кого можно было продать, и переправились обратно до того, как бандериум запрета успел собраться.\n\nВ этом году переправа совершается в другом направлении. Мохач, где днем ​​1526 года погибли король и армия, вошел без боя; виноградники на холмах Виллань учитываются и облагаются налогом; а гарнизоны, бывшие зимними квартирами рейдеров, становятся самыми северными постами линии королевства.\n\nГраница переместилась впервые на памяти живущих, и она продвинулась вперед." #NT!
 nd_ily.11.a: "Гарнизон на бродах. Пусть они выучат новую арифметику." #NT!
  
 nd_ily.12.t: "Альба Грека" #NT!
 nd_ily.12.d: "Слияние взято. Там, где Сава впадает в Дунай, находится известняковый хребет с крепостью на нем, которую венгры называют Нандорфехервар, которую канцелярия входит как Альба Грека и которую каждый дипломат в Европе называет просто ключом, потому что с нее начинается дорога на Вену, а также дорога на Константинополь. Шабац, переправа, которая сделала возможным подход, перестраивается с помощью настоящего равелина.\n\nС такой длинной линией вопрос, который можно было отложить, пока он был коротким, больше нельзя откладывать. Люди, которые его держат, — влахи и православные, беженцы, поселившиеся несколько поколений назад на пустынной земле, которые не берут землевладельца, подчиняются своим вождям и являются лучшими легкими войсками в христианском мире. Они снова обратились с просьбой о письменном изложении своих свобод." #NT!
 nd_ily.12.a: "Даруйте уставы. Пусть граница управляет сама собой." #NT!
 nd_ily.12.b: "Никакого устава. Строка — это команда, а не привилегия." #NT!
  
 nd_ily.13.t: "Линия завершена" #NT!
 nd_ily.13.d: "Это закончено. От Адриатики до Трансильванских перевалов теперь простирается непрерывная полоса сторожевых постов, блокпостов, лицензированных переправ и солдатских деревень, каждая в пределах видимости другой, населенных семьями, которые владеют своей землей ровно по одной причине. Тимишоара и ее осушенные болота находятся в поясе. Как и Смедерево на Дунае. Курьер может проехать всю его длину, ни разу не покинув юрисдикцию короны.\n\nЧего никто в Граце не ожидал, так это того, что счет будет оплачен здесь. Субсидия эрцгерцога была отклонена, поместья проголосовали за деньги, и линия принадлежит королевству, которое ее держит.\n\nВоенный совет, который сейчас заседает в нашей столице, спрашивает, для чего предназначена эта линия." #NT!
 nd_ily.13.a: "Запечатайте это. Ничто не пересекается, кроме того места, где мы говорим, что оно пересекается." #NT!
 nd_ily.13.b: "Маршируйте это. Лучшая нога Европы не должна сидеть на месте." #NT!
  
 nd_ily.14.t: "Полиглот Пресс" #NT!
 nd_ily.14.d: "В помещении рядом с площадью Испании Конгрегация по распространению веры держит печатный станок с большим количеством алфавитов, чем любая типография на земле: греческий, сирийский, армянский, арабский, коптский, кириллица и угловатая глаголица, которая разрешена в этом королевстве и нигде больше с 1248 года. Штампы для нее были вырезаны рукой далматина.\n\nПоследующая договоренность не является благотворительностью ни в том, ни в другом направлении. Рим обеспечивает лицензию, стандарт и престиж. Это королевство снабжает бумагой, пожертвованиями, семинариями и, прежде всего, людьми: священниками, которые могут проповедовать на славянском языке и выдавать себя за местных жителей от Савы до Дуная, а это именно то, чего Конгрегация не может нанять больше нигде в латинском христианском мире.\n\nКазначейство без энтузиазма отмечает, сколько это стоит." #NT!
 nd_ily.14.a: "Установите тип. Мы предоставим людей и бумагу." #NT!
  
 nd_ily.15.t: "Епископ в Марке" #NT!
 nd_ily.15.d: "Монастырь стоит в приграничной славянской стране, и человек, только что вернувшийся в него из Рима, является дважды епископом. Симеон Вратанья стал духовным главой православных валахов, разместивших гарнизон на границе; он вернулся, подтвержденный Папой, в послушании Риму, со своей собственной литургией, своим календарем и своим женатым духовенством нетронутыми.\n\nКаждая заинтересованная сторона считает это победой, и ни одна из них не может прийти к согласию относительно того, что было выиграно. В Риме есть уния. У влахов есть собственный епископ и письменная гарантия своего обряда. У капитула в Загребе есть конкурирующий прелат внутри епархии, и он уже начал писать о нем письма и будет писать их и через столетие.\n\nКорона должна решить, какое чтение является официальным." #NT!
 nd_ily.15.a: "Поселение. Подтвердите его и подтвердите обряд." #NT!
 nd_ily.15.b: "Сцена. Латинские епископы и римские школы." #NT!
  
 nd_ily.16.t: "Реестр Иллирийской церкви" #NT!
 nd_ily.16.d: "Два иезуита в Венеции собирают, вид за престолом и епископ за епископом, всю церковную историю Иллирика от апостолов до наших дней. Он будет состоять из восьми томов. Канцелярия проверяет каждую епархию в нем, где когда-то был католический епископ, чтобы узнать, кто владеет городом сейчас, и все чаще ответ таков: мы: Шкодер, Лежа и горная местность позади них, а также резиденция архиепископа в Скопье, из которой всегда осуществлялись миссии в Сербию и Болгарию.\n\nИллирийское название было утверждением ученых на протяжении двухсот лет. Теперь это юрисдикция.\n\nНа одну большую работу есть деньги, а на нее два предложения." #NT!
 nd_ily.16.a: "Постройте храм. Пусть христианский мир придет к нам." #NT!
 nd_ily.16.b: "Обеспечьте колледжи. Рим нуждается в этом больше." #NT!
  
 STATIC_MODIFIER_NAME_nd_ily_dest_statuta_valachorum: "Статута Валакорум" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_statuta_valachorum: "Приграничные дворы получают письменные привилегии: своих старост, свои суды, свою землю, свободную от всякого помещика, а взамен — мушкет в каждом доме и человека на каждом сборе. Корона получает армию, которую ей не нужно платить, и провинцию, которая так и не присоединилась к королевству." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_generalatus: "Генеральство" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_generalatus: "Ни устава, ни привилегий, ни старост. Кордон - это команда с офицерами, проверяющими магазины и рулоны, которые собственно и вызываются. Недостаток энтузиазма он компенсирует тем, что находится там, где ему приказано быть." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_sealed_cordon: "Кордон запечатан" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_sealed_cordon: "Линия закрыта. Товары переправляются на лицензированных станциях под охраной и нигде больше, крепости строятся по плану, а не по панике, и торговцы, которые раньше скользили по холмам по ночам, теперь платят за привилегию не делать этого. Содержание наших собственных предприятий за рубежом обходится гораздо дороже." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_marching_frontier: "Пограничные марши" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_marching_frontier: "Полки кордона отдаются на чужие войны и возвращаются домой со знанием дела. Легкая пехота, которая сражается в разрушенной местности, живет за счет этого и перестраивается после поражений быстрее, чем любой линейный полк в Европе." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_vlach_bishop: "Епископ в Марке" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_vlach_bishop: "Пастухи сохраняют свою литургию, свой календарь и своего прелата и на этих условиях вступают в римское послушание. Их стада кормят границу, а их сыновья пополняют ее роты. Капитул в Загребе считает эту договоренность возмутительной и заявляет об этом в письменном виде на протяжении ста лет." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_latin_obedience: "Латинское послушание" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_latin_obedience: "Союз воспринимается как промежуточная остановка, а не как урегулирование. В приграничных приходах ставятся латинские епископы, в школах преподают римский обряд, и обращение неуклонно происходит. Сборка занимает заметно больше времени, чем раньше, и никто не скажет почему." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_pilgrim_road: "Дорога паломников" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_pilgrim_road: "Говорят, что Святой Дом покоился на скале над переправой через Риеку, прежде чем отправиться в Лорето, и паломники верили в это на протяжении четырехсот лет. Трактиры, производители свечей, продавцы значков и менялы стоят вдоль дороги к святилищу, и корона забирает свою долю от каждого из них." #NT!
 STATIC_MODIFIER_NAME_nd_ily_dest_congregation_men: "Мужчины Конгрегации" #NT!
 STATIC_MODIFIER_DESC_nd_ily_dest_congregation_men: "Риму предстоит распоряжаться самыми образованными людьми королевства, и они отправляются: в Албанию, на Дунай, в любой двор, которому нужен человек, умеющий писать тремя алфавитами и которому можно доверить письмо. Пожертвования, которые их обучили, уходят вместе с ними и никогда больше не облагаются налогом." #NT!
  
 nd_ily_consilium_confiniorum: "Пограничный совет" #NT!
 nd_ily_consilium_confiniorum_desc: "Военный совет пограничья, заседающий в столице этого королевства, а не чужого. Списки сборов, журналы, инженеры и все артиллерийское звено линии управляются с одного стола, и за ним слышны дворянские дома, снабжающие офицеров." #NT!
 nd_ily_consilium_maintenance: "Канцелярия Совета" #NT!
 nd_ily_consilium_maintenance_desc: "Клерки, курьеры, запечатанные журналы, футляры для карт и зеленая ткань, на которой заседает совет." #NT!
 nd_ily_svetiste: "Храм Мариан" #NT!
 nd_ily_svetiste_desc: "Святилище на холме с чудесным образом, религиозный дом, в котором он хранится, и тропа, вычищенная людьми, которые ходят по ней босиком. Они происходят из трех королевств, они приходят верующими, и многие из них не возвращаются домой." #NT!
 nd_ily_svetiste_maintenance: "Содержание храма" #NT!
 nd_ily_svetiste_maintenance_desc: "Свечи у ящика, облачения, алтарное вино и дешевые печатные копии образа." #NT!
  
 nd_ily.10.a_tt: "Путь судьбы, выбранный при провозглашении, теперь открыт на вкладке «Традиции»." #NT!
 nd_ily.11.a_tt: "Дальний берег Дравы наш." #NT!
 nd_ily.12.a_tt: "Увеличение и более быстрое восстановление крестьянских поборов. Завоевания требуют больше времени для интеграции." #NT!
 nd_ily.12.b_tt: "Более быстрый рост гарнизона, более быстрое пополнение и лучшая инициатива на местах." #NT!
 nd_ily.13.a_tt: "Лучше защищенная торговля и больше крепостей. Содержание торговцев за рубежом обходится дороже." #NT!
 nd_ily.13.b_tt: "Более сильная легкая пехота, более быстрое восстановление боевого духа и более медленная утрата армейских традиций." #NT!
 nd_ily.14.a_tt: "Пресса Конгрегации принадлежит нам." #NT!
 nd_ily.15.a_tt: "Больше скота и лучшее качество налогов. Урегулирование является спорным, и стабильность страдает." #NT!
 nd_ily.15.b_tt: "Более быстрая конверсия и более жесткий городской контроль. Вербовка на границе замедляется." #NT!
 nd_ily.16.a_tt: "Больше торговцев, лучшая чеканка и более занятые бюргеры." #NT!
 nd_ily.16.b_tt: "Еще дипломат и выше грамотность. Пожертвования в Mortmain не облагаются налогом." #NT!
  
  # ===== BUREAUCRACIES ===== 
 ily_loca_credibilia_bureaucracy: "Место доверия" #NT!
 ily_loca_credibilia_bureaucracy_desc: "Места подлинной веры. По указу 1231 года юридический акт должен был быть зарегистрирован перед кафедральным капитулом или монашеским монастырем, а Людовик I в 1351 году установил список домов, печать которых делала документ подлинным. Загребский капитул, запечатывающийся под образом святого Стефана с 1297 года, и коллегиальный капитул Чазмы, основанный в 1232 году епископом Степаном II, составляли, печатали и хранили грамоты королевства, ходили по границам спорных земель, вручали повестки и выносили решения от имени короля. Западная Европа нанимала для этой работы мирских нотариусов. Здесь это делали каноники и продолжали делать это до тех пор, пока в 1840-х годах не было отменено феодальное землевладение." #NT!
 ily_sabor_kraljevine_bureaucracy: "Сабор Кралевине" #NT!
 ily_sabor_kraljevine_bureaucracy_desc: "Конгрегация королевства, впервые зарегистрированная в Загребе в 1273 году и объединившаяся 1 сентября 1558 года в одно собрание Хорватии и Славонии. Прелаты, магнаты, бан, вицебан, протонотарий и депутаты графств сидели вместе: голосовали за дику, положенную на каждый очаг, вызывали дворянское восстание, а епископы привозили своих бандерий. Сейм не имел постоянного места и отвечал на вызовы, куда бы его ни направлял запрет, именно поэтому он заседал в замке в Цетине 1 января 1527 года и избрал Фердинанда Габсбурга королем Хорватии самостоятельно, после принесения присяги законам и свободам королевства." #NT!
 ily_visitationes_canonicae_bureaucracy: "Посещения канонических" #NT!
 ily_visitationes_canonicae_bureaucracy_desc: "С 1615 года архидьяконы Загреба объезжали каждый приход епархии и записывали каждый из них: священника и то, что он мог читать, церковь и ее сосуды, приходские поля и их урожай, братства, количество домов и душ, а также поведение людей в них. Двести четырнадцать томов протоколов в переплете сохранились с 1615 года. Это самое близкое к переписи населения, которую проводят священнослужители для короны, которая не может платить геодезистам, а вдоль границы это также реестр деревень, которые придерживаются греческого обряда, а какие перешли." #NT!
 ily_tabula_banalis_bureaucracy: "Табула Баналис" #NT!
 ily_tabula_banalis_bureaucracy_desc: "Карл VI установил Банальный стол в 1723 году и подарил королевству скамью, которая сохранялась круглый год, вместо октавных сроков, согласно которым костюм мог пережить человека, который его принес. Запрет или его вице-бан осуществлялся под председательством семи-девяти судей, а репортером был протонотарий королевства; суд рассматривал важные дела в первой инстанции и апелляции окружных судов, а с 1725 года король назначал его членов. В его списке была земля: кому и чем она принадлежала в стране, которая была захвачена, опустошена и снова отдана в дар, и ни одно поле в Славонии не стоило расчищать, пока на этот вопрос не будет ответа." #NT!
  
  # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_ily_bureaucracy_authority: "Иллирийская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_ily_bureaucracy_authority: "С провозглашением [ILY.GetName] институты, которыми фактически управляла католическая славянская корона (главы, носившие государственную печать, сейм королевства, округ архидьякона и скамья запретов), становятся доступными в качестве переключаемой бюрократии. Здесь предоставляется один слот, а столица добавляет еще один." #NT!
