l_russian:
 IRQ: "Ирак" #NT!
 IRQ_ADJ: "Иракский" #NT!
 IRQ_f: "Ирак" #NT!
 IRQ_f_desc: "Ирак восстанавливает Савад, орошаемые земли между Тигром и Евфратом, которые когда-то приносили пятую часть доходов Халифату, как суверенному мусульманскому государству, управляемому из Багдада. Великие каналы вышли из строя задолго до прихода монголов: Нахраван был прорван во время гражданской войны в 937 году и так и не был должным образом отремонтирован, и последующие столетия Месопотамия провела в качестве пограничной провинции тех, кто владел Тебризом, Каиром или Стамбулом. С 1330-х годов султаны династии Джалаиридов все еще держали в Багдаде настоящий двор, что было достаточным доказательством того, что страна может управлять собой самостоятельно. Формирование Ирака завершает эту работу: каналы снова прорыты, Басра и торговля в Персидском заливе восстановлены, Куфа и города-святыни защищены, а Багдад восстановлен как столица, которая ни перед кем не отчитывается." #NT!
