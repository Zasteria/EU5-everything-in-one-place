l_russian:
  
  # ==================== Formation event ==================== 
 nd_the.1.t: "Корона Бонифация" #NT!
 nd_the.1.d: "В 1204 году Бонифаций Монферратский был передан императорской короне в Константинополе и вместо этого захватил этот город. Двадцать лет лангобардский суд владел Фессалоникой; его сын Деметрий потерял его в 1224 году, и титул ушел в сундук в Италии. Вы снова его забрали.\n\nЧего вы не забрали, так это города. В Фессалониках три господина, и ни один из них не ты. Деревенские бароны держат свои феодальные владения мечом и приходят, когда им удобно. Гильдии гавани, носильщики, парусники и люди с береговой линии управляют своими жилищами и уже показали, что они делают с лордом, который им не нравится. А в великой базилике греческое духовенство молится за императора, который не является вами, а за ним стоит Святая Гора и все монастыри Македонии.\n\nВы можете править через любой из трех. Вы не можете править всеми тремя.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_the.1.a: "Управляйте через баронов: феодом, гарнизоном, цитаделью" #NT!
 nd_the.1.b: "Управляйте через коммуну: учредите гильдии и гавань" #NT!
 nd_the.1.c: "Управляйте через церковь: конкордат двух обрядов" #NT!
  
  # ==================== Advance events ==================== 
 nd_the.2.t: "Святая Гора пишет в Рим" #NT!
 nd_the.2.d: "Игумены Афона прислали письмо через вашу голову. Оно адресовано Папе и перечисляет, что латинские рыцари сделали со своими домами: сломали двери, разграбили часовни, монахи выключили поместья, которые деды их дедов подарили Горе. Иннокентий III ответил на подобное письмо 17 января 1214 года, взяв Афон под свою защиту, то есть из рук той короны, которая им управляла.\n\nВаши бароны хотят ренты. Гора хочет, чтобы ее устав был подтвержден. Рим прислушивается к обоим." #NT!
 nd_the.2.a: "Подтвердите устав и станьте защитником Горы." #NT!
 nd_the.2.b: "Пусть бароны берут арендную плату с монастырских поместий." #NT!
  
 nd_the.3.t: "Зилоты держат ворота" #NT!
 nd_the.3.d: "Все началось в гавани. Люди с набережной прошли через нижний город вслед за Михаилом и Андреасом Палеологами, дома знатных семей были выброшены на улицу, а современник писал, что в течение двух или трех дней Фессалоники выглядели как город, оккупированный врагом. Когда все закончилось, аристократия бежала или была убита, их земли были разделены, и правили фанатики.\n\nОни не толпа. Они держат совет, собирают таможню, охраняют стены и уже отбросили назад армию с помощью Турции и Сербии. Они также отвергают все инструкции, поступающие из-за стен, включая ваши. Коммуна 1342 года удерживала этот город восемь лет и закончилась лишь тогда, когда сам город обратился против нее.\n\nУ короны есть три ответа, и каждый из них здесь был опробован." #NT!
 nd_the.3.a: "Договоритесь с ними и запишите устав коммуны в письменной форме." #NT!
 nd_the.3.b: "Штурмуйте нижний город и повесьте совет на площади." #NT!
 nd_the.3.c: "Ждать. Они поглотят себя, как и раньше" #NT!
  
 nd_the.4.t: "Палама у ворот" #NT!
 nd_the.4.d: "Синод избрал Григория Паламу архиепископом этого города, и этот город не впускает его. Он ждет на Афоне, а затем на Лемносе, пока люди на стене кричат, что они не признают назначения партии, проигравшей войну. За этим спором стоит величайшая теологическая борьба века: является ли нетварный свет, который монахи-исихасты видят в молитве, самим Богом, о чем говорит Палама и который половина ученых греческого мира называет абсурдом.\n\nОн ждал три года и вступил в 1350 году. У латинской короны есть один вариант, которого никогда не было у императоров. Он может решить, что теперь см. на латыни." #NT!
 nd_the.4.a: "Откройте собор и позвольте архиепископу занять свой трон." #NT!
 nd_the.4.b: "Сохраните кафедру и отдайте ее епископу нашего обряда." #NT!
  
 nd_the.5.t: "Ключи от города" #NT!
 nd_the.5.d: "В сентябре 1423 года деспот Андроник Палеолог, больной и лишенный денег, передал Фессалонику Венецианской республике, поскольку Венеция была единственной державой, которая могла ее прокормить. Венецианцы удерживали его семь лет, держали гавань открытой для всего, что султан мог выдвинуть против них, и потеряли ее штурмом утром 29 марта 1430 года.\n\nПредложение, которое вы получили, — это то же самое предложение. Итальянские галеры, итальянское зерно, итальянский офицер в цитадели, и оборона города срывается с ваших рук одним махом. Альтернатива — передать оружие в руки тех самых людей, которые в последний раз использовали его против ваших предшественников." #NT!
 nd_the.5.a: "Отвезите галеры «Синьории» и ее зерно в гавань." #NT!
 nd_the.5.b: "Мусор. Вооружите город и позвольте городу защитить себя" #NT!
  
 nd_the.6.t: "Корабли из Сефарада" #NT!
 nd_the.6.d: "Они приходят в течение нескольких месяцев, целыми общинами, каждая из которых по-прежнему называет себя в честь города в Кастилии, Арагоне или Португалии, который ее изгнал. Они прибывают почти ни с чем, но с двумя вещами, которые стоят больше, чем груз: корреспондентами в каждом порту западного Средиземноморья, а также всем ремеслом шерстяных тканей, чесания и валяния, красильным чаном и правилами гильдии, которые поддерживают честность стандартов.\n\nЧерез поколение это ремесло будет одевать армии. Единственный вопрос, который вам остается, это то, куда вы его поместите." #NT!
 nd_the.6.a: "Устройте их в городе, по четверти на каждую общину." #NT!
 nd_the.6.b: "Расселите их по македонским городам, близ руна" #NT!
  
 nd_the.7.t: "Флорентийский союз" #NT!
 nd_the.7.d: "Декрет об унии был зачитан в соборе Флоренции в июле 1439 года, и греческая делегация подписала его, некоторые из них плакали. Это делает две церкви одной и делает вашу корону законной в глазах каждого грека, который ее принимает.\n\nПочти никто не делает. Марк Эфесский отказался от своей подписи. Монахи Святой Горы уже проповедуют против этого. В Константинополе люди громко заявляют, что они скорее увидят в городе султанский тюрбан, чем латинскую митру. Провозглашение унии от амвона святого Димитрия решило бы юридический вопрос и выбило бы из колеи абсолютно все остальное." #NT!
 nd_the.7.a: "Провозгласите союз у амвона святого Димитрия." #NT!
 nd_the.7.b: "Пусть греческое духовенство тихо откажется от этого и ничего не скажет." #NT!
  
 nd_the.8.t: "Пресса Иуды Гедалии" #NT!
 nd_the.8.d: "Первый печатный станок на Балканском полуострове был установлен в этом городе в 1512 году Иудой Гедалией, который научился ремеслу в Лиссабоне и взял с собой наборы, когда уезжал. Он печатает на иврите. В течение следующих двух столетий Салоники являются одной из полиграфических столиц восточного Средиземноморья, и рабочие, которых обучают ее мастерские, переносят ремесло на все остальные языки, на которых говорят в этом заливе.\n\nГород, который ни разу не договорился о вероучении, оказывается, договорился о шрифте." #NT!
 nd_the.8.a: "Пусть прессы работают" #NT!
  
 nd_the.9.t: "Двенадцать деревень просят хартию" #NT!
 nd_the.9.d: "Горнодобывающие деревни в горах прислали предложение, и оно хорошее. Они будут управлять всем сами: свои суды, свои старосты, свои вооруженные стражи на дороге, ведущей к слиткам, и ни одного королевского офицера выше линии деревьев. Взамен они будут отдавать одну двенадцатую часть серебра каждый год, взвешивать и запечатывать на монетном дворе, и они будут давать гарантию на случай неудачного сезона.\n\nКоролевский офицер требует денег и ворует. Деревни не воруют из установленной ими квоты. То, что вы будете отдавать, не является доходом. Это район." #NT!
 nd_the.9.a: "Предоставьте чартер и возьмите рендер" #NT!
 nd_the.9.b: "Мусор. Гора — земля короны, и ею будут управлять так." #NT!
  
  # ==================== Variable tooltips ==================== 
 nd_the_formed_tt: "Королевство Фессалоники восстановлено." #NT!
 nd_the_path_a_tt: "Корона правит через лангобардское баронство." #NT!
 nd_the_path_b_tt: "Корона правит через коммуну гавани." #NT!
 nd_the_path_c_tt: "Корона правит посредством конкордата двух обрядов." #NT!
  
  # ==================== Timed modifiers ==================== 
 STATIC_MODIFIER_NAME_nd_the_lombard_crown: "Ломбардская Корона" #NT!
 STATIC_MODIFIER_DESC_nd_the_lombard_crown: "Королевство удерживается так, как его держали рыцари Бонифация: земля в феодальном праве баронов, столица принадлежит гарнизону на скале над ней. Деревня уступает; город кипит." #NT!
 STATIC_MODIFIER_NAME_nd_the_charter_of_the_demos: "Хартия демоса" #NT!
 STATIC_MODIFIER_DESC_nd_the_charter_of_the_demos: "Гильдии и жители прибрежной зоны признаются правительством своего города. Гавань процветает и укомплектовывает флот; приказ короны останавливается у ворот." #NT!
 STATIC_MODIFIER_NAME_nd_the_two_rites: "Конкордат двух обрядов" #NT!
 STATIC_MODIFIER_DESC_nd_the_two_rites: "Святой Димитрий и Святая Гора дарованы католическим королем, а греческий обряд гарантирован законом. Православные служат охотно. Латиняне королевства воспринимают это как предательство." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_protector_of_the_mountain: "Защитник Святой Горы" #NT!
 STATIC_MODIFIER_DESC_nd_the_protector_of_the_mountain: "Афонские грамоты утверждаются королевской печатью. Монастыри перестают писать в Рим и начинают молиться за царя." #NT!
 STATIC_MODIFIER_NAME_nd_the_rents_of_the_mountain: "Рента горы" #NT!
 STATIC_MODIFIER_DESC_nd_the_rents_of_the_mountain: "Рыцари берут дань с монастырских имений. Бароны удовлетворены, урожай собран, и у каждого аббата Македонии теперь есть письменное недовольство." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_commune_recognised: "Коммуна признала" #NT!
 STATIC_MODIFIER_DESC_nd_the_commune_recognised: "Совет фанатиков сохраняет свою таможню, свои стены и свой устав. Торговля через гавань никогда не управлялась лучше, и влияние короны в ней никогда не было меньшим." #NT!
 STATIC_MODIFIER_NAME_nd_the_commune_broken: "Коммуна разрушена" #NT!
 STATIC_MODIFIER_DESC_nd_the_commune_broken: "Нижний город захватывается улица за улицей, а совет вешается. Корона впервые на памяти живущих управляет своей столицей напрямую, и бюргеры будут помнить об этом дольше." #NT!
 STATIC_MODIFIER_NAME_nd_the_commune_outlasted: "Коммуна пережила" #NT!
 STATIC_MODIFIER_DESC_nd_the_commune_outlasted: "Корона ждала, и город без помощи обратился против фанатиков. Никто не был убит и ничего не было уступлено. Из-за этого о короле тоже никто не думает лучше." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_archbishop_enthroned: "Архиепископ на троне" #NT!
 STATIC_MODIFIER_DESC_nd_the_archbishop_enthroned: "Паламу сопровождает к трону королевская стража-католик. У исихастов есть победа, у города есть пастырь, и у короны есть заслуга." #NT!
 STATIC_MODIFIER_NAME_nd_the_latin_see: "Латинский Вид" #NT!
 STATIC_MODIFIER_DESC_nd_the_latin_see: "Собор отдан епископу римского обряда. Литургия разрешена, начинаются обращения, и прихожане молятся в другом месте." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_galleys_of_the_signoria: "Галеры Синьории" #NT!
 STATIC_MODIFIER_DESC_nd_the_galleys_of_the_signoria: "Венецианские корпуса на рейде и венецианское зерно на пристани. Город можно прокормить через любую осаду, ценой итальянского офицера с ключом от цитадели." #NT!
 STATIC_MODIFIER_NAME_nd_the_city_arms_itself: "Город вооружается" #NT!
 STATIC_MODIFIER_DESC_nd_the_city_arms_itself: "Списки сбора открыты для помещений, а стены охраняются людьми, живущими за ними. Это самый дешевый гарнизон в христианском мире и наименее послушный." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_congregations_chartered: "Чартерные общины" #NT!
 STATIC_MODIFIER_DESC_nd_the_congregations_chartered: "Каждой общине дается квартал, синагога и собственный двор. Город наполнен ткацкими станками, аккредитивами и принтерами." #NT!
 STATIC_MODIFIER_NAME_nd_the_looms_in_the_towns: "Ткацкие станки в городах" #NT!
 STATIC_MODIFIER_DESC_nd_the_looms_in_the_towns: "Пришельцы расселяются среди стад внутренних районов Македонии, а не в столице. Шерсть обрабатывается там, где ее стригут, и великие портовые дома так и не строятся." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_union_proclaimed: "Союз провозглашен" #NT!
 STATIC_MODIFIER_DESC_nd_the_union_proclaimed: "Указ Флоренции зачитывается с амвона, и власть короны над своими греческими подданными наконец становится законной в каноническом праве. Собрание уходит." #NT!
 STATIC_MODIFIER_NAME_nd_the_union_shelved: "Союз отложен" #NT!
 STATIC_MODIFIER_DESC_nd_the_union_shelved: "Указ хранится и никогда не зачитывается вслух. Греки хранят свою литургию и свою верность, а латинские дворы Европы делают свои выводы об этом короле." #NT!
  
 STATIC_MODIFIER_NAME_nd_the_silver_render: "Серебряный рендер" #NT!
 STATIC_MODIFIER_DESC_nd_the_silver_render: "Двенадцать деревень владеют горой и платят одну двенадцатую ее часть. Производительность никогда не была такой высокой, и ни один королевский чиновник уже много лет не ступал выше линии деревьев." #NT!
 STATIC_MODIFIER_NAME_nd_the_crown_wardens: "Коронные стражи" #NT!
 STATIC_MODIFIER_DESC_nd_the_crown_wardens: "Работами управляют из столицы наемные работники. Район однозначно царский, и производит он гораздо меньше, чем раньше." #NT!
  
  # ==================== Advances ==================== 
 nd_the_crown_of_boniface: "Корона Бонифация" #NT!
 nd_the_crown_of_boniface_desc: "Бонифаций Монферратский захватил Фессалонику в 1204 году, когда императорская корона вместо этого перешла к Болдуину Фландрскому, и удерживал ее до тех пор, пока болгарская засада не убила его в 1207 году. Титул, который его сын Деметрий потерял в 1224 году, снова восстановлен, а также причина, по которой каждый его обладатель держал гарнизон на акрополе." #NT!
 nd_the_gasmouloi_companies: "Компании Гасмулой" #NT!
 nd_the_gasmouloi_companies_desc: "Дети греческих матерей и латинских отцов, впервые зачисленные в морскую пехоту Михаилом VIII и использовавшиеся византийцами, османами и латинскими принцами в течение следующих трех столетий. Современники называли их отличными воинами, сочетавшими византийскую осторожность с латинской смелостью, и доверяли им не дальше пристани." #NT!
 nd_the_metochia_of_the_holy_mountain: "Подворье Святой Горы" #NT!
 nd_the_metochia_of_the_holy_mountain_desc: "Монастыри Афона владели зависимыми владениями по всей Македонии и Фессалии: поля, мельницы, оливковые рощи и деревни связанных крестьян, которыми управлял управляющий и которые подчинялись Горе, а не какому-либо королю." #NT!
 nd_the_assize_of_the_two_rites: "Присяга двух обрядов" #NT!
 nd_the_assize_of_the_two_rites_desc: "Латинские государства Греции управлялись письменными ассизами. Этот закон признает то, что на самом деле изменить нельзя: греческая литургия сохраняется, греческий язык является языком письменной речи, а королевские суды учатся работать на двух языках одновременно." #NT!
 nd_the_commune_of_the_parathalassioi: "Коммуна Параталассии" #NT!
 nd_the_commune_of_the_parathalassioi_desc: "Параталассиои были людьми прибрежной зоны, и в 1342 году они восстали на стороне зелотов и правили Фессалониками в течение восьми лет. Их лодки — единственный флот, который когда-либо имелся в этом городе, и корона, которая хочет их иметь, должна прийти к соглашению с кварталом, которому они принадлежат." #NT!
 nd_the_palamite_concord: "Паламитское соглашение" #NT!
 nd_the_palamite_concord_desc: "Григорий Палама был избран архиепископом этого города в 1347 году и не мог войти в него до 1350 года. Разрешение исихастской ссоры решает, кто будет говорить от имени греков королевства, что для католического короля является более насущным вопросом, чем вопрос, из чего состоит нетварный свет." #NT!
 nd_the_thessalian_horse: "Фессалийский конь" #NT!
 nd_the_thessalian_horse_desc: "На равнине вокруг Лариссы еще со времен Филиппа Македонского царила кавалерия, и она никогда не прекращалась. Его лорды-лошади ехали за тех, кто владел городом, и теперь город ваш." #NT!
 nd_the_workings_of_sidirokausia: "Работа Сидирокаузии" #NT!
 nd_the_workings_of_sidirokausia_desc: "Железорудная страна на северо-востоке Халкидики, где добывали серебросодержащую руду, по крайней мере, с девятого века. В лучшие годы здесь горели сразу сотни печей и это был самый продуктивный горнодобывающий район на всем Балканском полуострове." #NT!
 nd_the_myron_of_the_martyr: "Мирон мученика" #NT!
 nd_the_myron_of_the_martyr_desc: "Святой Димитрий был мироблитом, потоком благовонного масла. Паломники приезжали из Киева и Палермо, чтобы на его могиле заполнить штампованную ампулу, а торговля этим маслом сделала лекарства одним из основных товаров городского экспорта." #NT!
 nd_the_sea_relieved_city: "Город с облегчением от моря" #NT!
 nd_the_sea_relieved_city_desc: "С 1422 года Фессалоника восемь лет жила за счет того, что попадало через залив Термаикос, и больше ни за что. Сила города в этой бухте равна силе последнего прошедшего через него конвоя, и это урок, который его правители усвоили дважды." #NT!
 nd_the_haven_of_the_congregations: "Приют конгрегаций" #NT!
 nd_the_haven_of_the_congregations_desc: "После 1492 года Салоники приняли больше изгнанных иберийских общин, чем любой другой город Средиземноморья. Они прибыли, помня обо всем ремесле шерстяной ткани, и за одно поколение восстановили вокруг него экономику города." #NT!
 nd_the_thermaic_squadron: "Термическая эскадрилья" #NT!
 nd_the_thermaic_squadron_desc: "Легкие корпуса, перевозившие зерно мимо блокирующего флота в 1420-х годах, сохранились в составе постоянной эскадры. Они созданы для того, чтобы прибывать, а не для того, чтобы сражаться, и в этом вся разница." #NT!
 nd_the_union_of_florence: "Флорентийский союз" #NT!
 nd_the_union_of_florence_desc: "Указ 1439 года на бумаге сделал латинскую и греческую церкви едиными и почти никого не удовлетворил. Тем не менее для латинской династии, правящей православным городом, это единственный документ, который делает соглашение законным, и соблюдение которого стоит больших усилий." #NT!
 nd_the_cupellation_of_the_argyrion: "Купелирование Аргириона" #NT!
 nd_the_cupellation_of_the_argyrion_desc: "Руда обжигается со свинцом, свинец выгоняется в горне из костяной золы, а остается серебро. Это процесс, который превратил склон холма бедного галенита в тонны слитков в год." #NT!
 nd_the_looms_of_the_congregations: "Ткацкие станки конгрегаций" #NT!
 nd_the_looms_of_the_congregations_desc: "В период своего расцвета торговля салоникской шерстью связывала с тканью целые общины, от стрижки до печати, и готовое сукно принималось вместо монет всеми, у кого были солдаты, которых нужно было одевать." #NT!
 nd_the_mint_of_the_mountain: "Горный монетный двор" #NT!
 nd_the_mint_of_the_mountain_desc: "Поразительный дом, построенный рядом с самой выработкой, так что металлу никогда не придется спускаться к морю, прежде чем он станет деньгами. Это также означает, что дорогу слитков под ней внезапно стоит ограбить." #NT!
 nd_the_press_of_gedaliah: "Пресса Гедалии" #NT!
 nd_the_press_of_gedaliah_desc: "Иуда Гедалия привез свои шрифты из Лиссабона и в 1512 году основал здесь первую типографию на Балканах. Она печатала на иврите, и это сделало этот город центром книги на двести лет." #NT!
 nd_the_vlach_caravans: "Влахские караваны" #NT!
 nd_the_vlach_caravans_desc: "Арумынские погонщики мулов из Пинда перевезли все, что не могло быть доставлено морем: шерсть и хлопок на север через перевалы к ярмаркам Центральной Европы, кредиты и новости в обратном направлении. Их дороги — вторая гавань королевства." #NT!
 nd_the_mademochoria_charter: "Хартия двенадцати деревень" #NT!
 nd_the_mademochoria_charter_desc: "Шахтерским деревням предоставляются собственные суды, старосты и надзиратели в обмен на фиксированную ежегодную плату серебром. Корона получает слитки тоннами и отдает гору акрами." #NT!
 nd_the_krokos_of_kozani: "Крокус Хайленда" #NT!
 nd_the_krokos_of_kozani_desc: "На холодном плато за Сервией осенние безвременники дают самый ценный по весу урожай во всем королевстве. Его собирают вручную до рассвета и в тот же день необходимо сушить, поэтому сушильный цех должен стоять в поле." #NT!
 nd_the_epistasia_of_the_mountain: "Эпистазия горы" #NT!
 nd_the_epistasia_of_the_mountain_desc: "Корона наконец-то получила место в совете Святой Горы. Монастыри сохраняют свой устав, свои уставы и свои библиотеки; у короля наконец-то появилось одно имя вместо двадцати." #NT!
 nd_the_wardens_of_the_bullion_road: "Стражи Буллионной дороги" #NT!
 nd_the_wardens_of_the_bullion_road_desc: "Сильвер, спускающийся с выработок в гавань, нуждается в людях, и шахтерские деревни сами воспитывают этих людей. Они знают каждый овраг на дороге, потому что выросли, грабя его." #NT!
 nd_the_cotton_of_the_campania: "Хлопок Кампании" #NT!
 nd_the_cotton_of_the_campania_desc: "Македонский хлопок и хлопчатобумажная пряжа переправлялись через этот залив в восемнадцатом веке в количествах, по сравнению с которыми старая торговля сукном выглядела скромно, а торговые дома, поставлявшие их, вели бухгалтерские книги в Марселе и Лейпциге." #NT!
 nd_the_free_port_of_the_gulf: "Свободный порт Персидского залива" #NT!
 nd_the_free_port_of_the_gulf_desc: "Гавань открывается на опубликованных условиях, а не на таможенных условиях, согласованных между кораблями. У каждого консула в Средиземноморье есть свое мнение по поводу этих условий; все равно каждый из них отправляет корабли." #NT!
 nd_the_charter_of_the_two_nations: "Хартия двух наций" #NT!
 nd_the_charter_of_the_two_nations_desc: "Возраст дает греческим подданным короны слово о том, какими они были всегда. Латинская династия может ответить на это грамотой или гарнизоном, и только одна из них когда-либо работала в этом городе." #NT!
 nd_the_goldsmiths_of_the_gulf: "Ювелиры Персидского залива" #NT!
 nd_the_goldsmiths_of_the_gulf_desc: "Серебро перестает уходить в виде слитка и начинает уходить в виде филиграни, которая стоит в несколько раз дороже и весит гораздо меньше. Производительность горы не изменилась; в бухгалтерской книге есть." #NT!
  
  # ==================== Buildings ==================== 
 nd_the_eptapyrgion: "Эптапиргион" #NT!
 nd_the_eptapyrgion_desc: "Цитадель на акрополе, выше и отдельно от города, которым она управляет. Каждый правитель этого города, начиная с Бонифация и далее, держал на этой скале гарнизон, и каждый из них делал это по одной и той же причине: стены обращены наружу, а орудия обращены вниз." #NT!
 nd_the_metochion: "Подворье" #NT!
 nd_the_metochion_desc: "Зависимость одного из великих монастырей: земля, часовня, управляющий и деревня связанных крестьян, отправляющих зерно, масло и спиртные напитки обратно в материнский дом на Святой Горе. Корона может лицензировать это и облагать налогом. Он никогда не будет владеть им." #NT!
 nd_the_sidirokausia_works: "Сидирокаузия Завод" #NT!
 nd_the_sidirokausia_works_desc: "Обжиговые печи, расставленные вдоль холмов Халкидики, перерабатывали серебросодержащую свинцовую руду в слитки. В период своего расцвета в районе работали тысячи шахтеров и одновременно поддерживались горением сотен печей." #NT!
 nd_the_myron_hall: "Зал Мирона" #NT!
 nd_the_myron_hall_desc: "Зал у могилы мученика, где отбирают ароматное масло, запечатывают его в штампованные глиняные ампулы и продают паломникам. Наполовину храм, наполовину аптекарь, и именно поэтому медицина покидает этот порт целыми кораблями." #NT!
 nd_the_broadcloth_hall: "Суконный зал" #NT!
 nd_the_broadcloth_hall_desc: "Чесание, прядение, ткачество, валяние и крашение под одной крышей и под одним общим управлением. Конгрегации, которые управляли этими залами, установили стандарт, сами следили за ним и в результате снабдили армии армиями." #NT!
 nd_the_argyrokopeion: "Аргирокопеон" #NT!
 nd_the_argyrokopeion_desc: "Поразительный дом на шахте. Слиток серебра поступает, а монета выходит без необходимости спуска металла к морю, что экономит целое состояние на сопровождении и создает дорогу, на которую стоит устроить засаду." #NT!
 nd_the_krokos_house: "Крокос Хаус" #NT!
 nd_the_krokos_house_desc: "Сушилка, стоящая среди крокусовых полей на западном плато. Рыльца собираются вручную до восхода солнца и в тот же день должны быть над огнем, иначе годовой урожай ничего не стоит." #NT!
  
  # ==================== Production methods ==================== 
 nd_the_eptapyrgion_maintenance: "Цитадель Гарнизон" #NT!
 nd_the_eptapyrgion_maintenance_desc: "Камень для занавеса, железо для ворот, древесина для щитов и постоянная компания, которая никогда не покидает скалу." #NT!
 nd_the_tsipouro_still: "Монастырский неподвижный" #NT!
 nd_the_tsipouro_still_desc: "Марка, оставшаяся от урожая, перегоняется в ципуро, спирт, изобретенный афонскими домами в четырнадцатом веке." #NT!
 nd_the_monastic_scriptorium: "Монастырский скрипторий" #NT!
 nd_the_monastic_scriptorium_desc: "Тряпки и целлюлоза перерабатывались в бумагу для библиотек Горы, чьи переписчики работали без перерыва еще до того, как в городе появился латинский король." #NT!
 nd_the_argyros_smelting: "Обжиг руды" #NT!
 nd_the_argyros_smelting_desc: "Галену обжигали на углях в маленьких печах на склоне холма — это первый и самый грязный этап получения серебра из камня Халкидики." #NT!
 nd_the_cupellation: "Купелирование" #NT!
 nd_the_cupellation_desc: "Обожженную руду плавят со свинцом и обдувают в печи из костяного пепла до тех пор, пока свинец не окислится и в чашке не останется бусинка рафинированного серебра." #NT!
 nd_the_ampullae_of_saint_demetrios: "Ампулы Святого Димитрия" #NT!
 nd_the_ampullae_of_saint_demetrios_desc: "Масло из могилы мученика, запечатанное в небольшие штампованные флакончики. Археологи выкапывают их из земли от Киева до Сицилии, что говорит о том, как далеко их пронесли паломники." #NT!
 nd_the_salonica_broadcloth: "Салоникское сукно" #NT!
 nd_the_salonica_broadcloth_desc: "Македонское руно прочесано, соткано и сваляно в тяжелую ткань по стандарту гильдии — торговля, которой этот город занимался на протяжении двухсот лет." #NT!
 nd_the_fine_broadcloth: "Тонкое сукно" #NT!
 nd_the_fine_broadcloth_desc: "Лучшая шерсть, окрашенная в чане и готовая для экспортной торговли, продается печатью, а не на складе." #NT!
 nd_the_cotton_yarn: "Хлопчатобумажная пряжа" #NT!
 nd_the_cotton_yarn_desc: "Ткацкие станки переходят на производство македонского хлопка, из которого делают пряжу для северных рынков, где спрос превышает все, что может предложить шерсть." #NT!
 nd_the_akce_striking: "Чеканка монет" #NT!
 nd_the_akce_striking_desc: "Заготовки вырезают, взвешивают и чеканят рядом с выработками, так что серебро округа становится деньгами на горе, а не в чужой столице." #NT!
 nd_the_filigree_work: "Филигранная работа" #NT!
 nd_the_filigree_work_desc: "Натянутая проволока, скрученная в филигрань ювелирами, обучавшимися ремеслу сразу в трех традициях. Его стоимость в барах во много раз превышает его вес." #NT!
 nd_the_krokos_drying: "Крокус Сушка" #NT!
 nd_the_krokos_drying_desc: "Рыльца раскладывали на ситах на слабом огне в течение нескольких часов после сбора. При хорошем обращении урожай на вес серебра; с плохим обращением оно вообще ничего не стоит." #NT!
  
  # ==================== Units ==================== 
 a_nd_the_gasmouloi: "Гасмулой" #NT!
 a_nd_the_gasmouloi_desc: "Морские стрелки смешанного греческого и латинского происхождения, воспитанные в портовых промыслах. Быстро высадитесь на берег, убийственно вдоль береговой линии и первым уйдите, когда начнется битва, потому что ни одно сообщество не умрет за корону другого." #NT!
 n_nd_the_parathalassioi_galley: "Галера Параталассио" #NT!
 n_nd_the_parathalassioi_galley_desc: "Переполненный, с легким артиллерийским корпусом, принадлежащий портовым гильдиям и буксируемый людьми с набережной. Создан для того, чтобы сохранять проход открытым в условиях блокады, а не разрывать линию боя." #NT!
 a_nd_the_thessalian_lancers: "Фессалийские уланцы" #NT!
 a_nd_the_thessalian_lancers_desc: "Лошадь с равнины Лариссы, старейшей кавалерийской страны Греции. В квартире они неотразимы. В тот момент, когда земля поднимется, а это в этом королевстве произойдет очень скоро, они станут обузой." #NT!
 n_nd_the_thermaic_galliot: "Термаический Галлиот" #NT!
 n_nd_the_thermaic_galliot_desc: "Блокадный бегун залива. Все отдано скорости и удержанию морского пути, а вооружению почти ничего, ибо корабль, который останавливается для боя, - это корабль, который не прибывает." #NT!
 a_nd_the_bullion_warden: "Хранитель слитков" #NT!
 a_nd_the_bullion_warden_desc: "Вооруженные люди из шахтерских деревень, призванные доставлять серебро в гавань. Страна засад – это их профессия, а разбитое поле – категорически нет." #NT!
  
  # ==================== Levies ==================== 
 levy_nd_the_gasmouloi: "Гасмулой Леви" #NT!
 levy_nd_the_gasmouloi_desc: "Смешанное греко-латинское население набережной, призванное из портовых промыслов, а не из сельской местности." #NT!
 levy_nd_the_parathalassioi: "Параталассиой Леви" #NT!
 levy_nd_the_parathalassioi_desc: "Лодки портовых гильдий, принадлежавшие бюргерам и влекомые береговыми рабочими и крестьянами. Та же группа людей, которая управляла городом как коммуной." #NT!
 levy_nd_the_thessalian_lancers: "Фессалийский Лансер Леви" #NT!
 levy_nd_the_thessalian_lancers_desc: "Лорды-владельцы лошадей Фессалийской равнины всегда призывались со своими скакунами в качестве кавалерийских рекрутов." #NT!
 levy_nd_the_bullion_wardens: "Хранитель слитков Леви" #NT!
 levy_nd_the_bullion_wardens_desc: "Надзирателей, созданных самими шахтерскими деревнями, из людей, которые работают на печах, и людей, поставленных для наблюдения за ними." #NT!
  
  # ==================== Event guard ==================== 
 nd_the_e1_done_tt: "$nd_the.1.t$ уже произошло" #NT!
  
  # ==================== Option tooltips ==================== 
 nd_the.1.a_tt: "Ломбардская Корона. Коронные земли, гарнизоны, дворянские рекруты и продукция феодальных владений. Городскими бюргерами управляют, а не с ними советуются." #NT!
 nd_the.1.b_tt: "Устав демоса. Удовлетворенность бюргеров, рост городов, морская торговля и моряки. Корона отказывается от контроля над собственной столицей, и бароны уничтожаются." #NT!
 nd_the.1.c_tt: "Конкордат двух обрядов. Терпимость к греческому обряду, преданность, добровольные сборы и более жесткий контроль. Латиняне королевства восприняли это плохо." #NT!
 nd_the.2.a_tt: "Терпимость к греческому обряду, меньше сепаратизма и устойчивое процветание. Гора перестает писать в Рим." #NT!
 nd_the.2.b_tt: "Поместья уступают баронам: сырьевая продукция и дворянское удовлетворение, оплаченное терпимостью и смутой." #NT!
 nd_the.3.a_tt: "Коммуна сохраняет свой устав: удовлетворение горожан, рост городов и морская торговля за счет коронной власти." #NT!
 nd_the.3.b_tt: "Совет разрушен: коронная власть, контроль и удовлетворенное дворянство, купленное стойкой ненавистью бюргеров." #NT!
 nd_the.3.c_tt: "Ни крови, ни уступок: меньше сепаратизма, более дешевая стабильность и более спокойные поместья, и корона, которая восемь лет выглядела беспомощной." #NT!
 nd_the.4.a_tt: "Палама занимает трон: терпимость к греческому обряду, меньше сепаратизма, более жесткий контроль и престиж." #NT!
 nd_the.4.b_tt: "Латинский епископ в соборе: терпимость к собственному обряду, более быстрое обращение и преданность, и беспокойное греческое население." #NT!
 nd_the.5.a_tt: "Венецианские корпуса и венецианское зерно: боевой дух флота, моряки и снабжение, ключ от цитадели держит итальянский офицер." #NT!
 nd_the.5.b_tt: "Кварталы занимают свои собственные стены: большие рекруты, большие гарнизоны и довольные бюргеры за счет транспортной торговли." #NT!
 nd_the.6.a_tt: "Конгрегации зарегистрированы в столице: рост городов, исследования, производство тканей и терпимость к другим конфессиям." #NT!
 nd_the.6.b_tt: "Ткацкие станки идут вглубь страны: производство шерсти, эффективность производства и более быстрая ассимиляция, но больших домов в порту нет." #NT!
 nd_the.7.a_tt: "Союз – это закон: более быстрое обращение, дипломатический статус и преданность, а также прихожане, выходящие из собственного собора." #NT!
 nd_the.7.b_tt: "Декрет подшит и забыт: терпимость к греческому обряду, меньше сепаратизма и более спокойные поместья — ценой вашего положения в Латинской Европе." #NT!
 nd_the.8.a_tt: "Прессы работают. От короны больше ничего не требуют." #NT!
 nd_the.9.a_tt: "Деревни держат гору: добыча серебра и золота и богатые поместья, а офицеры короны держатся ниже линии деревьев." #NT!
 nd_the.9.b_tt: "Гора управляется из столицы: власть короны, контроль и доходы, и меньше металла из земли." #NT!
  
  # ==================== Destiny tree ==================== 
 nd_the_destiny: "Королевство возобновилось" #NT!
 nd_the_destiny_desc: "Кризисное десятилетие осталось позади. Город стоит, корона на голове, и впервые с 1204 года вопрос заключается не в том, кто владеет Фессалоникой, а в том, какой она будет.\n\nТребуется оседлое царство." #NT!
  
 nd_the_dest_marches: "Марши Просека и Мельника" #NT!
 nd_the_dest_marches_desc: "Просек — это обнесенная стеной скала над Вардаром, где река врезается в ущелье. Мельник – город, втиснутый в белый песчаник в Пирине. Добромир Стрез держал первое, а Алексий Славяне второе, и между собой они закрыли обе дороги в первое царство этого имени. Бонифаций Монферратский погиб в таком перевале 4 сентября 1207 года, и его голову перенесли к болгарскому двору.\n\nДержите обе скалы, с заселенным царством и настоящей армией в поле." #NT!
  
 nd_the_dest_epirus: "Расплата с Эпиром" #NT!
 nd_the_dest_epirus_desc: "Теодор Комнин Дукас прибыл по западной дороге из Арты в 1224 году, взял этот город и короновал себя в нем императором. На этом Лангобардское королевство закончилось. Янина и Арта — это место, где это было решено, и они до сих пор являются местом спора.\n\nДержитесь и с армией, и с репутацией, чтобы условия были соблюдены." #NT!
  
 nd_the_dest_ravennika: "Парламент Равенники" #NT!
 nd_the_dest_ravennika_desc: "В 1209 году лорды франкской Греции поехали в Равеннику, на день западнее Зетуниона, и воздали дань уважения тому, что они владели. Отон де ла Рош отвечал за Афины и Фивы, которые он считал феодальными владениями этой короны. Король, вассалы которого владеют Аттикой, — король. Тот, чьи вассалы этого не делают, является маркизом с лучшим титулом.\n\nУдерживайте Фивы и Афины, имея престиж и спокойствие, чтобы собрание что-то значило. Открывает замок Платамона." #NT!
  
 nd_the_dest_lemnos: "Квасцы Лемноса" #NT!
 nd_the_dest_lemnos_desc: "Красильные чаны в шерстяных залах работают на квасцах, а ближайший к ним квасец в мире — это запечатанная земля, вырубленная на Лемносе один раз в августе каждый август на глазах у свидетелей. Гавань острова — лучшая на этой стороне Эгейского моря, а ярмарка Святого Деметрия — всего лишь день святого, если только туда не прибудут восточные товары.\n\nУдерживайте Лемнос, наполняйте казну и доставляйте шелк на свой рынок." #NT!
  
 nd_the_dest_negroponte: "Фондако в Негропонте" #NT!
 nd_the_dest_negroponte_desc: "Бонифаций пожаловал Эвбею Равано далле Карцери в 1205 году, так что величайшая расчетная палата на латинском востоке возникла как феодальное владение этой короны. Коммуна хочет вернуть его в качестве счетной палаты, а не феодального владения, а счетная палата ничего не стоит, если вексель, выписанный в одном порту, не будет учтен в другом.\n\nДержите Негропонте, с банковским делом и деньгами на руках." #NT!
  
 nd_the_dest_maona: "Маона Хиоса" #NT!
 nd_the_dest_maona_desc: "В 1346 году синдикат генуэзских кредиторов захватил Хиос и в течение двух столетий управлял им как компанией, охватывающей дюжину обнесенных крепостными стенами деревень на юге острова. Город, управляемый собственными гильдиями, — единственное латинское государство на востоке, которое могло подумать об этом первым.\n\nДержайте Хиос с развитой глобальной торговлей, полной казной и заселенным королевством. Открывает дом коммерциона." #NT!
  
  # ==================== Destiny events ==================== 
 nd_the.10.t: "Десятилетие заканчивается" #NT!
 nd_the.10.d: "Баррикады разрушены, ворота открыты, и с утренним ветром прибывают лодки с зерном, как ни в чем не бывало. Мужчины, которые кричали друг на друга через улицу в течение восьми лет, спорят о цене на рыбу.\n\nОсталась лишь корона, город и шесть провинций Македония и Фессалии. Маленький, неуклюжей формы и твой. Отсюда все — решение, а не чрезвычайная ситуация." #NT!
 nd_the.10.a: "Тогда давайте управлять тем, что у нас есть." #NT!
  
 nd_the.11.t: "Две скалы" #NT!
 nd_the.11.d: "Просек — это стена на скале, нависающая над Вардаром, где река прорезает ущелье, и без ее разрешения ничто не идет на север. Мельник - это город, втиснутый в пирамиды из белого песчаника в Пирине, и ни одна армия никогда не захватывала его с фронта.\n\nСтрез держал одно, а Славянское другое, и между ними они задушили первое царство с этим названием. Ваши бароны провели зиму, решая, как добраться до них, и этой весной они это сделали.\n\nГарнизоны здесь. У маршей есть свои лорды, свои уставы и свои обязательства, а дороги на север открыты впервые за столетие." #NT!
 nd_the.11.a: "Пропуски сохраняются. Пусть марши будут отменены." #NT!
  
 nd_the.12.t: "Расплата с Эпиром" #NT!
 nd_the.12.d: "Деспоты Эпира никогда не признавали существование этого королевства. Теодор Комнин Дука вышел из Арты в 1224 году с армией, собранной на этих же холмах, взял Фессалоники и возложил императорскую корону на свою голову в базилике Святого Димитрия.\n\nВаше войско теперь на его стороне гор. Янина окружена, и за ней лежит открытая равнина Арта. Констебль хочет решительного сражения и продиктованного мира. Маршалам нужны замки, горные сборы и стада, которые каждую осень спускаются с Пинда, и следят, чтобы замки не убегали." #NT!
 nd_the.12.a: "Разбейте их в поле и диктуйте мир" #NT!
 nd_the.12.b: "Возьмите замки, пошлины и стада" #NT!
  
 nd_the.13.t: "Парламент Равенники" #NT!
 nd_the.13.d: "Они пришли в 1209 году и пришли снова: владыка Афин и Фив, маркиз Будоница, люди, владеющие перевалами Неопатры, а за ними толпа рыцарей, которые не покидали Грецию уже четыре поколения и не считают нигде больше своим домом.\n\nСобрание собирается в поле в дне западнее Зетуниона, потому что ни один зал в королевстве не вместит его. Они будут ругаться. Вопрос в том, чему они присягают.\n\nКлятвы и феодальные владения оставляют их такими, какие они есть, с их дворами, их обычаями и их сыновьями, женатыми на ваших дочерях. Взятие их рыцарей в королевское войско оставляет им землю и ничего больше, что и делает король, когда хочет перестать спрашивать." #NT!
 nd_the.13.a: "Свяжите их клятвой, феодом и браком" #NT!
 nd_the.13.b: "Возьмите своих рыцарей в королевское войско" #NT!
  
 nd_the.14.t: "Квасцы Лемноса" #NT!
 nd_the.14.d: "Каждый красильщик в шерстяных цехах уже десять лет говорит одно и то же: ткань хороша ровно настолько, насколько хороша протрава, а протрава сходит со склона холма на Лемносе, где раз в году запечатанную землю разрезают на глазах священника и толпы.\n\nОстров взят. Его гавань является лучшей в северной части Эгейского моря, и год назад первый груз квасцов был выгружен на пристань людьми, гребшими на рыбацких лодках. На той же неделе прибыл генуэзский корабль с шелком-сырцом и любезно спросил, каковы портовые сборы." #NT!
 nd_the.14.a: "Пусть это будет внесено в бухгалтерскую книгу." #NT!
  
 nd_the.15.t: "Фондако в Негропонте" #NT!
 nd_the.15.d: "Эвбею подарил сам Бонифаций веронцу, который никогда не рассчитывал сохранить ее себе. С тех пор это была контора латинского Востока: суд байло, венецианские склады и единственное место между Венецией и Александрией, где вексель, выписанный в одном городе, безоговорочно принимается в расчет в другом.\n\nТеперь он ваш, и венецианцы в фондако спросили, какие изменения. Их кредиты дешевы, корпусов много, и они не будут финансировать кампанию, о которой с ними никто не советовался. Собственные налоговые фермеры коммуны предпочли бы, чтобы они платили десятую часть, как и все остальные." #NT!
 nd_the.15.a: "Оставьте им свою четверть и свой кредит" #NT!
 nd_the.15.b: "Берите с них десятую долю, как и все остальные" #NT!
  
 nd_the.16.t: "Маона Хиоса" #NT!
 nd_the.16.d: "Деревни из мастики обнесены стенами, а смолу взвешивают под охраной, потому что фунт ее стоит больше, чем фунт всего остального, что растет в этом море. Генуя захватила остров в 1346 году на деньги, предоставленные синдикатом своих граждан, а затем просто так и не выкупила их.\n\nКупцы вашей гавани внимательно прочитали это соглашение и внесли такое же предложение в письменном виде. Они авансируют стоимость, берут мастику и вино и ежегодно выплачивают оговоренную сумму. Служащие казначейства предпочли бы, чтобы корона управляла собственным островом и сохраняла его все." #NT!
 nd_the.16.a: "Наймите компанию граждан для ее ведения сельского хозяйства." #NT!
 nd_the.16.b: "Держите остров в руках короны" #NT!
  
  # ==================== Destiny timed modifiers ==================== 
 STATIC_MODIFIER_NAME_nd_the_dest_field_of_epirus: "Эпир, разбитый в поле" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_field_of_epirus: "Деспотат был разгромлен открыто, а условия были написаны позднее. Греческое духовенство королевства не сказало, что они думают о латинском короле, выступающем против православного князя, что само по себе является ответом." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_castles_of_the_west: "Замки Запада" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_castles_of_the_west: "Башня за башней, плата за платой. Западные земли скорее разбираются и поглощаются, чем избиваются, и стада платят за гарнизоны, которые их считают." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_oath_of_the_lords: "Клятва светлостей" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_oath_of_the_lords: "Лорды Греции владеют своими феодальными владениями этой короны и заявляют об этом публично. Теперь они также ожидают, что с ними посоветуются во всем остальном, и собрание баронов имеет свое мнение по каждому представленному закону." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_host_of_the_kingdom: "Хозяин Королевства" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_host_of_the_kingdom: "Рыцари светлостей едут под королевским знаменем. Их отцы держали в качестве частной свиты одну армию с одним казначеем и одним набором приказов." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_venetian_quarter: "Венецианский квартал" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_venetian_quarter: "Фондако сохраняет свои привилегии, а гавань сохраняет свои дешевые деньги и суда. Люди, которые дают его взаймы, не дадут взаймы на войну и говорят об этом, прежде чем их об этом спросят." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_kommerkion_levied: "Коммеркион взимается" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_kommerkion_levied: "Десятая доля взимается с каждого выгруженного груза собственными чиновниками коммуны без каких-либо льгот и извинений. Доход отличный. Как и обида, и она распространяется." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_maona_chartered: "Маона Чартерный" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_maona_chartered: "Компания граждан удерживает Хиос и выплачивает согласованную сумму. Кредиты дешевы, вино острова течет в гавань, а столь комфортабельный город начал считать себя законченным." #NT!
 STATIC_MODIFIER_NAME_nd_the_dest_island_in_hand: "Остров в руке короны" #NT!
 STATIC_MODIFIER_DESC_nd_the_dest_island_in_hand: "Хиосом управляют наемные люди, и его защищают собственные корпуса короны. Ничего не отдается в аренду, ничего не делится, и дворы работают всю зиму." #NT!
  
  # ==================== Destiny buildings ==================== 
 nd_the_platamon_castle: "Кастеллани Платамона" #NT!
 nd_the_platamon_castle_desc: "Франкская башня в устье долины Темпе, воздвигнутая в первые годы после 1204 года, где прибрежная дорога зажата между Олимпосом и морем. Тот, кто владеет им, держит дорогу между двумя половинами королевства, поэтому кастелян — великий человек, и приказы короны распространяются со скоростью дороги, которой она владеет." #NT!
 nd_the_platamon_maintenance: "Содержание Кастеллани" #NT!
 nd_the_platamon_maintenance_desc: "Каменная кладка для навесной стены, оружие для стражи, деготь для крыш и щитов, а также инструменты для кузнеца во дворе." #NT!
  
 nd_the_kommerkion_house: "Дом Коммеркиона" #NT!
 nd_the_kommerkion_house_desc: "Таможня на моле, где оценивается, оспаривается и вносится десятая часть с каждого выгруженного груза. В зарегистрированной коммуне люди, владеющие бухгалтерской книгой, избираются по кварталам, которые они облагают налогом, и торговец, торгующий через этот порт, обнаруживает, что его бизнес измерен, защищен и подсчитан." #NT!
 nd_the_kommerkion_maintenance: "Содержание таможни" #NT!
 nd_the_kommerkion_maintenance_desc: "Бумага для регистров, мебель для счетной комнаты, ткань для офицерских мантий, инструменты для весов и пломб." #NT!
  
  # ==================== Destiny option tooltips ==================== 
 nd_the.10.a_tt: "У королевства есть выбор. От короны больше ничего не требуют." #NT!
 nd_the.11.a_tt: "Марши удерживаются: живая сила, тяжелая лошадь и королевство приближается к знати." #NT!
 nd_the.12.a_tt: "Все решает поле боя: лучшие условия мира и более быстрая вербовка, а также греческое духовенство, которое заметило войну." #NT!
 nd_the.12.b_tt: "Запад разобрали: нападения, грабежи и ускоренная интеграция проглоченного." #NT!
 nd_the.13.a_tt: "Дань уважения и брак: более дешевая аннексия и больший дипломатический охват за счет собрания, которое спорит со всеми законами." #NT!
 nd_the.13.b_tt: "Одна армия, один казначей: лучшая легкая кавалерия, более быстрое восстановление морального духа и более дешевые наемники." #NT!
 nd_the.14.a_tt: "Протрава обеспечена: лучшие галеры и королевство, приближающееся к торговцам." #NT!
 nd_the.15.a_tt: "Фондако сохраняет свой устав: более дешевые торговцы, более быстрое строительство и финансисты, которые не будут финансировать войну." #NT!
 nd_the.15.b_tt: "Собирается десятое: доходы от чеканки и строительство удешевляются, и от этого страдает репутация." #NT!
 nd_the.16.a_tt: "Компания владеет островом: дешёвые кредиты и шианское вино, а также город, который становится комфортным." #NT!
 nd_the.16.b_tt: "Корона держит остров: более сильный корпус, более прочные корпуса и более быстрые верфи." #NT!
  
  # ==================== Bureaucracies ==================== 
 the_curia_of_the_lombards_bureaucracy: "Курия лангобардов" #NT!
 the_curia_of_the_lombards_bureaucracy_desc: "Бонифаций Монферратский умер в Мосинополисе в сентябре 1207 года, оставив маленького наследника, поэтому королевство перешло ко двору ломбардских феодальных владельцев во главе с регентом Оберто II из Биандрата. В 1208 году они закрыли ворота города перед императором Генрихом Фландрским и предложили корону Вильгельму VI Монферратскому вместо ребенка; Генрих короновал Деметрия в январе 1209 года и заключил Оберто в тюрьму в Серресе. Создание курии делает баронство государством. Замки перевалов сохраняются, феодальные владения отвечают на летний призыв, греческие деревни, которые их кормят, тоже маршируют, а люди города не допускаются в совет." #NT!
 the_archon_of_the_demos_bureaucracy: "Архонт Демоса" #NT!
 the_archon_of_the_demos_bureaucracy_desc: "В течение восьми лет после 1342 года власть в Салониках была разделена между двумя архонтами. Сухопутную сторону держали присланные из столицы наместники Михаил Мономах, затем Иоанн Батацес, затем мегапримикерий Иоанн Апокавк; гавань подчинялась архонту, которого выбрал для себя демос, и параталассиоям, морякам и докерам набережной. Наличие этой магистратуры сохраняет порядок: кварталы торгуют за свой счет, город следит за своими улицами, набережная говорит о делах королевства, а приказы короны останавливаются у земельных ворот." #NT!
 the_synaxis_of_karyes_bureaucracy: "Синаксис Кариеса" #NT!
 the_synaxis_of_karyes_bureaucracy_desc: "Святая Гора управлялась из Карии с десятого века через протоса и собрание игуменов, порядок, установленный типиконом, который Иоанн Цимисхий дал монахам в 972 году, и измененный хризобулой Андроника II в 1312 году, которая сделала Протоса назначенцем патриарха, а не императора. Его дома владеют подворьями по всей Македонии и Фессалии, а их зернохранилища являются самым надежным запасом продовольствия в регионе. Латинский король, возглавляющий Синаксис, покупает согласие своих православных подданных и платит за это льготами, которые он не может облагать налогами." #NT!
  
 the_sekreton_of_thessalonike_bureaucracy: "Секретон Салоникский" #NT!
 the_sekreton_of_thessalonike_bureaucracy_desc: "Иоланда Ирина Монферратская поселилась в Салониках в 1303 году и оставила городу императорский суд записи, evages sekreton, который позже заменили провинциальные генеральные судьи региона. В 1329 году Андроник III сократил трибунал до четырех католиков критов, по крайней мере один из которых был епископом; он принимал только письменные жалобы, заслушивал показания экспертов там, где считал нужным, совещался в уединении и принимал решения большинством, и существовал для того, чтобы обуздать злоупотребления власть имущих. Это единственный орган в этом городе, который подчиняется короне, а не баронам, гавани или Святой Горе, и весь его бизнес состоит в том, чтобы говорить всем троим, чего им нельзя делать." #NT!
  
  # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_the_bureaucracy_authority: "Бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_the_bureaucracy_authority: "В восстановленном королевстве могут разместиться органы управления Салониками. В столице есть место для двоих из четырех, поэтому большинство претендентов города всегда остаются за пределами города." #NT!
