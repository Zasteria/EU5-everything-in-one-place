 STATIC_MODIFIER_NAME_nd_got_regnum_gothorum: "Регнум Готорум" #NT!
 STATIC_MODIFIER_DESC_nd_got_regnum_gothorum: "Восстановленное королевство является юридическим лицом: советы, кодекс и главенство Толедо продолжаются с Реккаредом. Корона, правящая через советы, не правит одна." #NT!
 STATIC_MODIFIER_NAME_nd_got_reiki_gutane: "Рейки Гутане" #NT!
 STATIC_MODIFIER_DESC_nd_got_reiki_gutane: "Королевство, названное на языке Вульфилы. Народ, а не должность, король, которого держит присяга его присягнувший, и имя, которое латинский христианский мир воспринимает как архаизм." #NT!
 STATIC_MODIFIER_NAME_nd_got_no_other_law: "Пусть не ссылается ни на один другой закон" #NT!
 STATIC_MODIFIER_DESC_nd_got_no_other_law: "Пункт Реккесвинта соблюдается в буквальном смысле. Каждый двор в королевстве открывает одну и ту же книгу, и местные обычаи, по которым жили магнаты, просто недопустимы." #NT!
 STATIC_MODIFIER_NAME_nd_got_code_absorbs_custom: "Код принимает то, что находит" #NT!
 STATIC_MODIFIER_DESC_nd_got_code_absorbs_custom: "Либер применяется там, где он уместен, и приглаживается там, где он неуместен. Медленнее, но никому не говорят, что закон их деда никогда не был законом." #NT!
 STATIC_MODIFIER_NAME_nd_got_council_legislates: "Совет принимает законы" #NT!
 STATIC_MODIFIER_DESC_nd_got_council_legislates: "Каноны Толедо — это закон королевства, и люди, которые их пишут, носят митры." #NT!
 STATIC_MODIFIER_NAME_nd_got_king_convokes: "Король созывает" #NT!
 STATIC_MODIFIER_DESC_nd_got_king_convokes: "Совет — царский инструмент, как гласит его первый канон. Он собирается, когда у короны есть для этого дела." #NT!
 STATIC_MODIFIER_NAME_nd_got_fuero_granted: "Фуэро Хусго предоставлено" #NT!
 STATIC_MODIFIER_DESC_nd_got_fuero_granted: "Каждому взятому городу вручают кодекс в качестве устава и говорят, что он всегда подчинялся этому закону. Регистрация юридической фикцией по цене печати." #NT!
 STATIC_MODIFIER_NAME_nd_got_fueros_confirmed: "Города подтверждены" #NT!
 STATIC_MODIFIER_DESC_nd_got_fueros_confirmed: "Каждый город имеет свою собственную хартию, утвержденную королевской властью, и платит за эту привилегию монетами и лояльностью." #NT!
 STATIC_MODIFIER_NAME_nd_got_primacy_pressed: "Первенство Прессовано" #NT!
 STATIC_MODIFIER_DESC_nd_got_primacy_pressed: "Брага созывается, Таррагона отменяется, и крест Толедо предстает перед предстоятелем в каждом соборе полуострова. Никто за пределами Иберии не благодарит нас за это." #NT!
 STATIC_MODIFIER_NAME_nd_got_primacy_of_honour: "Примат чести" #NT!
 STATIC_MODIFIER_DESC_nd_got_primacy_of_honour: "Толедо сохраняет титул и отказывается от юрисдикции. Испанская церковь впервые за четыреста лет находится в мире сама с собой." #NT!
 STATIC_MODIFIER_NAME_nd_got_rite_endowed: "Старый обряд наделен" #NT!
 STATIC_MODIFIER_DESC_nd_got_rite_endowed: "Тринадцать капелланов ежедневно поют в соборе мессу Исидора по напечатанному миссалу на литургии, более древней, чем реформированное папство, которое когда-то подавило ее." #NT!
 STATIC_MODIFIER_NAME_nd_got_rite_conformed: "Соответствует римскому использованию" #NT!
 STATIC_MODIFIER_DESC_nd_got_rite_conformed: "Царство поет то, что поет Рим, а Мосарабская капелла хранит старые книги скорее как память, а не как практику." #NT!
 STATIC_MODIFIER_NAME_nd_got_council_by_right: "Совет заседает по праву" #NT!
 STATIC_MODIFIER_DESC_nd_got_council_by_right: "Собрание, которое корона не может распустить, по примеру Толедо. Королевство теперь имеет конституцию и знает ее." #NT!
 STATIC_MODIFIER_NAME_nd_got_council_by_summons: "Совет заседает по вызову" #NT!
 STATIC_MODIFIER_DESC_nd_got_council_by_summons: "Советы были королевскими с самого первого канона. Корона намерена сохранить их такими." #NT!
 STATIC_MODIFIER_NAME_nd_got_unction_of_wamba: "Помазание Вамбы" #NT!
 STATIC_MODIFIER_DESC_nd_got_unction_of_wamba: "Масло, пролитое митрополитом Толедо 19 сентября 672 года, за восемьдесят два года до того, как любой франкский король был посвящен таким же образом. Личность короля теперь священна. Должность по-прежнему является выборной." #NT!
 STATIC_MODIFIER_NAME_nd_got_code_for_all: "Принцип – это живой закон" #NT!
 STATIC_MODIFIER_DESC_nd_got_code_for_all: "Территориальная юрисдикция доведена до конца. В 654 году это означало гот и римлянин; теперь это означает всех, кто находится в королевстве." #NT!
 STATIC_MODIFIER_NAME_nd_got_code_as_heritage: "Самое старое наследство" #NT!
 STATIC_MODIFIER_DESC_nd_got_code_as_heritage: "«Фуэро Хузго» изучили, напечатали и почитали как основополагающий документ нации, и он остался там, где он есть." #NT!
  
  # ========================================================================== 
  # ADVANCES 
  # ========================================================================== 
 nd_got_liber_iudiciorum: "Либер Юдициорум" #NT!
 nd_got_liber_iudiciorum_desc: "Кодекс Чиндасуинта и Рекчесвинта, обнародованный в 654 году после пересмотра на Восьмом соборе Толедо. Его новшеством была территориальность: один закон как над готами, так и над римлянами, заменивший систему, в которой происхождение решало, какая книга будет открыта для человека." #NT!
 nd_got_concilia_toletana: "Советы Толедо" #NT!
 nd_got_concilia_toletana_desc: "Восемнадцать синодов между 400 и 702 годами, созванных королем и на которых присутствовали епископы, аббаты и графы палатинской канцелярии. Их каноны были обнародованы как королевские законы, что сделало их единственным органом в постримской Европе, который издавал законы одновременно для церкви и короны." #NT!
 nd_got_universal_muster: "Сбор всего народа" #NT!
 nd_got_universal_muster_desc: "Военный закон Вамбы 673 года, пересмотренный Эрвигом в 681 году. Он связывает генералов, графов и гардингов, готов и римлян, свободных и освобожденных рабов, а также, в оригинальном тексте Вамбы, епископов и их вассалов. Ни в одном другом раннесредневековом королевстве не было призыва одновременно по этнической принадлежности, духовенству и рабскому статусу." #NT!
 nd_got_gardingi: "Гардинги" #NT!
 nd_got_gardingi_desc: "Присяжные члены королевского двора, сохраняющие свое звание на основании личной присяги, а не на основании землевладения. Закон о сборах Эрвига называет их орденом рядом с герцогами и графами. Они были противовесом короны знати, которая избирала королей и уничтожала их." #NT!
 nd_got_pyrenean_closures: "Клаузура" #NT!
 nd_got_pyrenean_closures_desc: "Готические перевалы в Паниссаре и через дефиле Корбер: стены через дефиле, а не замки на холмах. Вамба заставил их в 673 году вернуть Септиманию, и они были последним барьером, который арабо-берберские колонны пересекли в 719 году." #NT!
 nd_got_aurifex_regis: "Королевские ювелиры" #NT!
 nd_got_aurifex_regis_desc: "Мастерские, в которых было изготовлено сокровище Гуаррасара: двадцать шесть обетных корон и крестов из золота, сапфира, жемчуга и перегородчатого граната, которые висели над алтарями, а не носили их и были похоронены недалеко от Толедо в 711 году." #NT!
 nd_got_charity_of_masona: "Благотворительность Масоны" #NT!
 nd_got_charity_of_masona_desc: "Масона из Мериды, гот по происхождению, около 580 человек основал больницу с наемными врачами, открытую для каждого желающего, как христианина, так и еврея, финансируемую за счет фиксированной доли доходов престола и предоставляющую кредиты бедным из оборотного фонда." #NT!
 nd_got_regal_coinage: "Королевская чеканка" #NT!
 nd_got_regal_coinage_desc: "Примерно с 575 года Леовигильд нанес свое имя на тремисси, а монетный город - на реверсе, порвав с подражанием имперским проблемам. Королевству служило около сотни монетных дворов, где собирался налог и перемещались армии." #NT!
 nd_got_fuero_charter: "Кодекс как Устав" #NT!
 nd_got_fuero_charter_desc: "Фердинанд III приказал перевести Liber на кастильский язык и в 1241 году предоставил его в качестве муниципального фуэро Кордовы, затем Севильи и Мурсии. Завоеванному городу не давался новый закон; ему сказали, по какому закону он всегда находился." #NT!
 nd_got_officium_palatinum: "Официум Палатинум" #NT!
 nd_got_officium_palatinum_desc: "Графы домашнего хозяйства, казначейства, вотчины и кабинета с королевскими нотариусами: оплачиваемый министерский суд в эпоху домашнего управления, заседающий на советах рядом с епископами." #NT!
 nd_got_littera_toletana: "Литтера Толетана" #NT!
 nd_got_littera_toletana_desc: "Вестготский крохотный шрифт, иберийский книжный шрифт, который пережил королевство на четыре столетия и был вытеснен только тогда, когда реформа Клюниака ввела Каролингское письмо после 1080 года. Все, что полуостров помнил о себе, было написано на нем." #NT!
 nd_got_ecclesiastical_primacy: "Первенство Испании" #NT!
 nd_got_ecclesiastical_primacy_desc: "Бык Cunctis Sanctorum 1088 года восстановил Толедо первобытное положение, которое он занимал при готских королях, и назвал Бернарда Седиракского первым примасом. Брага, Таррагона и Компостела оспаривали его на протяжении веков." #NT!
 nd_got_hispanic_rite: "Испаноязычный обряд" #NT!
 nd_got_hispanic_rite_desc: "Литургия Исидора и Ильдефонса, запрещенная в пользу римского использования в 1080 году и сохранившаяся в шести приходах Толедо. Сиснерос напечатал свой миссал в 1500 году и выделил соборной часовне, чтобы его пели ежедневно." #NT!
 nd_got_palatine_guard: "Спатарии" #NT!
 nd_got_palatine_guard_desc: "Дворцовые меченосцы, постоянная стража двора, где наследование было выборным, и предыдущий король часто умирал от этого. Юлиан Толедский помещает их рядом с Вамбой на пути в Септиманию." #NT!
 nd_got_via_gothica: "Готическая дорога" #NT!
 nd_got_via_gothica_desc: "Толедо расположен посреди Месеты и Нарбонны на берегу Лионского залива, и единственное, что их соединяет, — это старая римская магистральная дорога через Сарагосу и Пиренейские ворота. Пилотируемые путевые станции — это разница между одним царством и двумя." #NT!
 nd_got_law_of_all_peoples: "Закон всех народов" #NT!
 nd_got_law_of_all_peoples_desc: "Кодекс Рекчесвинта запрещает ссылаться на любой другой закон в готском суде. Дело не в исключении, а в охвате: происхождение субъекта больше не определяет его юрисдикцию, поэтому королевство может содержать народы, которые оно не ассимилировало." #NT!
 nd_got_toledan_goldwork: "Опус Интеррасиле" #NT!
 nd_got_toledan_goldwork_desc: "Пронзенные золотые украшения и висячие пендилии более поздних корон Гуаррасара - византийская техника, которую переняли и сохранили толедские мастерские. Сапфир и жемчуг заменяют гранат, который является предметом торговли королевства в ювелирных изделиях." #NT!
 nd_got_permanent_council: "Совет стал постоянным" #NT!
 nd_got_permanent_council_desc: "Восемнадцать советов за три столетия собрались потому, что этого хотел король. Совет, который заседает по праву, а не по вызову, — это другой институт, и готский прецедент — единственный аргумент, от которого корона не может отказаться, не отрицая своего собственного титула." #NT!
 nd_got_general_host: "Генеральный хозяин" #NT!
 nd_got_general_host_desc: "Положение о сборе кодекса было изменено с учетом возраста огнестрельного оружия. Каждый свободный подданный по-прежнему обязан платить повинности, и список ведется теми же городскими судами, которые ведут земельные книги." #NT!
 nd_got_septimanian_march: "Септиманианский марш" #NT!
 nd_got_septimanian_march_desc: "Готская провинция в Галлии: семь престолов от Нарбонны до Нима, удерживаемая в течение двух столетий после того, как Тулуза была потеряна при Вуйе в 507 году. Удержание ее означает размещение гарнизона на дальней стороне горного хребта против того, кто правит Роной." #NT!
 nd_got_narbonne_staple: "Главный продукт Нарбонны" #NT!
 nd_got_narbonne_staple_desc: "Ценность Септимании никогда не заключалась в ее сельскохозяйственных угодьях. Нарбонна была римским магистральным портом в южной Галлии и перекрестком, где Виа Домиция пересекалась с Виа Аквитания, а корона, удерживающая оба конца этой дороги, облагала налогом движение без необходимости в флоте." #NT!
 nd_got_national_jurisprudence: "Национальная юриспруденция" #NT!
 nd_got_national_jurisprudence_desc: "Вильядьего напечатал Fuero Juzgo с комментариями в 1600 году, и его защитники выступили на открытом судебном заседании. Королевству, чьим действующим законодательством является кодекс седьмого века, не нужно изобретать правовую традицию, а достаточно способности обучать той, которая у него есть." #NT!
 nd_got_royal_unction: "Королевское помазание" #NT!
 nd_got_royal_unction_desc: "Квирик Толедский помазал Вамбу 19 сентября 672 года, что стало первым посвящением короля при его вступлении на престол на Латинском Западе, за восемьдесят два года до Пипина Короткого. Это сделало личность короля священной, но не передавало его должность по наследству." #NT!
 nd_got_primatial_chancery: "Первоначальная Канцелярия" #NT!
 nd_got_primatial_chancery_desc: "Кафедра, претендующая на юрисдикцию над всеми остальными митрополитами на полуострове, нуждается в аппарате для ее осуществления. К восемнадцатому веку Толедо было крупнейшей церковной администрацией в Иберии." #NT!
 nd_got_royal_retinue: "Королевская свита" #NT!
 nd_got_royal_retinue_desc: "Гардинги не исчезли. Они были восстановлены в качестве домашней лошади абсолютистского двора, взятой из одних и тех же семей, содержащих комиссию, в которой их предки приносили клятву." #NT!
 nd_got_academy_edition: "Академическое издание" #NT!
 nd_got_academy_edition_desc: "В 1815 году Real Academia Espanola напечатала Fuero Juzgo с латынью и кастильским языком на лицевых страницах, и антиквары спорили о том, является ли самый старый закон королевства одновременно и самым либеральным." #NT!
 nd_got_civil_code: "Гражданский Кодекс" #NT!
 nd_got_civil_code_desc: "Территориальный принцип Либера дошел до конца: каждый житель королевства судится по одному закону, независимо от происхождения. В седьмом веке это означало готов и римлян; в девятнадцатом это означает всех остальных." #NT!
 nd_got_national_conscription: "Национальная воинская повинность" #NT!
 nd_got_national_conscription_desc: "Положение о обязательном сборе переживает любую другую статью кодекса, потому что в конечном итоге каждое государство этого хочет. Королевство, которое с 673 года мобилизовало все свое свободное население, просто сохраняет списки." #NT!
 nd_got_gothic_revival: "Готическое возрождение" #NT!
 nd_got_gothic_revival_desc: "Девятнадцатый век раскопал Гуаррасар и отправил короны в Париж и Мадрид, а мастерские Толеда ответили торговлей дамасскими и перегородчатыми репродукциями. Антикварианство стало экспортным товаром." #NT!
  
  # ========================================================================== 
  # UNITS 
  # ========================================================================== 
 a_nd_got_thiufa: "Тиуфа" #NT!
 a_nd_got_thiufa_desc: "Налог в тысячу человек в соответствии с его тиуфадусом, взимаемый законным принуждением во всех слоях свободного населения. Он удерживает свои позиции, потому что нарушение его стоит человеку его авторитета в законе, и он сражается так, как есть: фермеры, рабочие и священнослужители копьями." #NT!
 a_nd_got_gardingi: "Гардинги" #NT!
 a_nd_got_gardingi_desc: "Присягнувшие королю люди, сохраняющие свое звание на основании личной присяги, а не на земле. Они атакуют в лоб, подрывают боевой дух там, где приземляются, и за оба платят потерями." #NT!
 a_nd_got_spatharii: "Спатарии" #NT!
 a_nd_got_spatharii_desc: "Дворцовые меченосцы, стоящие на страже выборной монархии, похоронившей слишком много королей. Неподвижен в очереди и медленно движется куда-либо еще." #NT!
 a_nd_got_hoste_del_fuero: "Уэсте-дель-Фуэро" #NT!
 a_nd_got_hoste_del_fuero_desc: "Общий хозяин кода с фитильными замками. Вызванные из тех же списков, которые городские суды держат за землю, их можно собрать быстрее, чем любую контрактную армию, и они состоят из горожан, а не из ветеранов." #NT!
 a_nd_got_gardingi_reales: "Гардингос Реалес" #NT!
 a_nd_got_gardingi_reales_desc: "Домашняя лошадь абсолютистского двора, все еще присягнувшая королю и все еще принадлежащая семьям, присягнувшим семь столетий назад. Великолепны в своей работе и плохо подходят для длительной кампании вдали от суда, который им платит." #NT!
 a_nd_got_milicia_del_fuero: "Милисия дель Фуэро" #NT!
 a_nd_got_milicia_del_fuero_desc: "Всеобщая воинская повинность согласно старейшему закону о воинской повинности в Европе. Рулоны уже были там, когда прибыли винтовки." #NT!
  
  # ========================================================================== 
  # LEVIES 
  # ========================================================================== 
 levy_nd_got_thiufa: "Тиуфа Леви" #NT!
 levy_nd_got_thiufa_desc: "Сбор всего свободного населения, набранного как из солдат, крестьян, рабочих, так и из духовенства, потому что закон Вамбы 673 года связывал епископов и их вассалов вместе со всеми остальными." #NT!
 levy_nd_got_gardingi: "Гардинги Леви" #NT!
 levy_nd_got_gardingi_desc: "Присяжные члены королевского двора, выходцы из знатных семей, связанные с королем личной присягой." #NT!
 levy_nd_got_hoste_del_fuero: "Уэсте дель Фуэро Леви" #NT!
 levy_nd_got_hoste_del_fuero_desc: "Общий хозяин кодекса в эпоху фитильного ружья, названный из свитков, хранящихся в городских судах." #NT!
 levy_nd_got_gardingi_reales: "Гардингос Реалес Леви" #NT!
 levy_nd_got_gardingi_reales_desc: "Придворная придворная кавалерия, набранная из тех же знатных домов, которые когда-то приносили гвардейскую присягу." #NT!
 levy_nd_got_milicia_del_fuero: "Милисия дель Фуэро Леви" #NT!
 levy_nd_got_milicia_del_fuero_desc: "Национальная воинская повинность в соответствии с положением о сборе Liber Iudiciorum, спустя одиннадцать столетий после ее написания." #NT!
  
  # ========================================================================== 
  # BUILDINGS 
  # ========================================================================== 
 nd_got_liber_court: "Суд Liber Iudiciorum" #NT!
 nd_got_liber_court_desc: "Суд приходит civitatis и его iudex, хранящий заверенную копию кодекса, который закон Реккесвинта требует от каждой юрисдикции, и которому запрещено открывать любую другую книгу." #NT!
 nd_got_aula_regia: "Аула Регия" #NT!
 nd_got_aula_regia_desc: "Палатинский суд и зал советов: епископы, аббаты, графы и магнаты королевства вместе принимают законы и публикуют свои каноны в качестве королевских законов. Он стоял в Толедо и больше нигде не мог стоять." #NT!
 nd_got_clausurae: "Клаузура" #NT!
 nd_got_clausurae_desc: "Стены, переброшенные через горное ущелье, а не замок на холме. Закрытие Готического перевала скрепило две половины королевства, и их падение в 719 году положило этому конец." #NT!
 nd_got_aurifex: "Королевская мастерская ювелиров" #NT!
 nd_got_aurifex_desc: "Мастерские, в которых над алтарями висели короны: золотые, сапфировые, жемчужные и перегородчатые гранаты, с именем короля, написанным буквами, свисающими с обода." #NT!
 nd_got_xenodochium: "Ксенодохий" #NT!
 nd_got_xenodochium_desc: "Епископальная больница по образцу Масоны, с оплачиваемыми врачами, открытая как для христиан, так и для евреев, и предоставляющая кредиты бедным из фонда, который кафедра пополняет каждый год." #NT!
 nd_got_moneta_regia: "Монета Регия" #NT!
 nd_got_moneta_regia_desc: "Провинциальный монетный двор чеканит тремисси с именем короля на одной стороне и именем города на другой. Его цель — не слитки, а юрисдикция: корона становится видимой в городе, который он редко посещает." #NT!
 nd_got_sedes_primatialis: "Первоначальный Вид" #NT!
 nd_got_sedes_primatialis_desc: "Кафедра, которая созывает других митрополитов, рассматривает апелляции их судов и выносит свой крест в их соборах. Может быть только один, и он аргументирует свою позицию на советах." #NT!
 nd_got_capilla_mozarabe: "Мосарабская часовня" #NT!
 nd_got_capilla_mozarabe_desc: "Часовня, способная ежедневно петь латиноамериканский обряд по напечатанному миссалу, поддерживая литургию, которую Рим запретил и от которой шесть приходов Толедо отказались отказаться." #NT!
 nd_got_mansio_regia: "Мансио Регия" #NT!
 nd_got_mansio_regia_desc: "Королевский перевалочный пункт на Готской дороге, в дне пути от следующей, где курьеры меняют лошадей, а столица посреди месеты продолжает двигаться к морю." #NT!
 nd_got_catedra_del_fuero: "Катедра-дель-Фуэро-Юзго" #NT!
 nd_got_catedra_del_fuero_desc: "Факультет, вся учебная программа которого представляет собой одну книгу седьмого века, и чьи выпускники заполняют суды, применяющие ее." #NT!
  
  # ========================================================================== 
  # PRODUCTION METHODS 
  # ========================================================================== 
 nd_got_liber_court_maintenance: "Судебный реестр" #NT!
 nd_got_liber_court_maintenance_desc: "Пергамент, чернила и пчелиный воск для печатей. Суд, полномочия которого основаны на письменном кодексе, тратит большую часть своего бюджета на его составление." #NT!
 nd_got_aula_regia_maintenance: "Соборное заседание" #NT!
 nd_got_aula_regia_maintenance_desc: "Стоимость сбора епископов и магнатов королевства, их кормления и публикации того, что они договорились." #NT!
 nd_got_clausurae_maintenance: "Перевал Гарнизон" #NT!
 nd_got_clausurae_maintenance_desc: "Камень, древесина и оружие подтянуты к стене через ущелье, рядом с которым никто не живет." #NT!
 nd_got_pm_gold_cloisonne: "Перегородчатая Золотая работа" #NT!
 nd_got_pm_gold_cloisonne_desc: "Гранаты в золотых ячейках, техника ранних корон Гуаррасара и германского мира, который их производил." #NT!
 nd_got_pm_opus_interrasile: "Опус Интеррасиле" #NT!
 nd_got_pm_opus_interrasile_desc: "Пронзенное золото с висящими пендилиями из жемчуга и стекла, позднейшая толедская манера с византийским влиянием." #NT!
 nd_got_pm_revival_goldwork: "Возрождение" #NT!
 nd_got_pm_revival_goldwork_desc: "Репродукция дамаска и перегородчатой ​​эмали для рынка девятнадцатого века, который только что увидел короны Гуаррасара в музейном шкафу." #NT!
 nd_got_xenodochium_maintenance: "Больничный фонд" #NT!
 nd_got_xenodochium_maintenance_desc: "Лекарства, бобовые, вино и белье оплачивались из фиксированной доли доходов престола, как это было предусмотрено уставом Масоны." #NT!
 nd_got_moneta_regia_maintenance: "Чеканка монет" #NT!
 nd_got_moneta_regia_maintenance_desc: "Штампы, топливо и слитки для небольшого провинциального монетного двора, настоящая продукция которого — имя короля." #NT!
 nd_got_sedes_primatialis_maintenance: "Первобытное хозяйство" #NT!
 nd_got_sedes_primatialis_maintenance_desc: "Книги, облачения и вино кафедры, которая имеет собственных канонических юристов и отвечает на апелляции с половины полуострова." #NT!
 nd_got_capilla_mozarabe_maintenance: "Капелланство старого обряда" #NT!
 nd_got_capilla_mozarabe_maintenance_desc: "Тринадцать капелланов, напечатанный молитвенник, свечи и алтарное вино, одаренные навечно." #NT!
 nd_got_mansio_regia_maintenance: "Положения промежуточной станции" #NT!
 nd_got_mansio_regia_maintenance_desc: "Корм, хлеб и средства передвижения для курьеров и войск, передвигающихся между Месетой и Львиным заливом." #NT!
 nd_got_catedra_maintenance: "Факультет Кодекса" #NT!
 nd_got_catedra_maintenance_desc: "Бумага, печатные издания и переплеты для школы, в которой учат по одной книге и больше ни по чему не сдают экзамены." #NT!
  
