l_russian:
  
  # ========================================================================== 
  # FORMATION EVENT 
  # ========================================================================== 
 nd_got.1.t: "Восстановление Регнума" #NT!
 nd_got.1.d: "Гранада пала. Нарбонна отвечает перед судом на Месете. У юристов на столе открытое Fuero Juzgo, а рядом с ними летописцы Альфонсо III, и между ними они расскажут вам, что королевство готов так и не распалось, а лишь прерывалось на протяжении семисот восьмидесяти лет оккупацией, которую ни один совет так и не утвердил.\n\nОстается только произнести имя вслух, и имя - это весь аргумент.\n\nНа латыни это #bold Regnum Готорум#!, королевство советов и кодекса. Это штат Реккаред и Реккесвинт, чей закон связывал как готов, так и римлян, поскольку он был территориальным, а не личным, чьи епископы издавали законы наряду с палатинскими графами в Толедо и чья кафедра имеет главенство над каждой церковью на полуострове. Это заявление о непрерывной юрисдикции, и оно аргументируется на языке, на котором оно было написано.\n\nНа языке Вульфилы это #bold Рейки Гутане#!, правление готов. Это совершенно другое утверждение: не унаследованная должность, а выживший народ с собственным именем, король, который удерживает корону по клятве своих присягнувших людей, и Риму не нужно так говорить. Латинский аппарат всегда представлял собой заимствованную одежду. Снимите его.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_got.1.a: "Regnum Gothorum: королевство советов и кодекса" #NT!
 nd_got.1.b: "Рейки Гутане: правление готов на языке Вульфилы" #NT!
  
  # ========================================================================== 
  # ADVANCE EVENTS 
  # ========================================================================== 
 nd_got.2.t: "Книга Судов" #NT!
 nd_got.2.d: "Чиндасуинт начал его в 642 году, а Рекесвинт обнародовал его в 654 году, после того как епископы Восьмого собора Толедо рассмотрели его титул за титулом. Двенадцать книг, пятьдесят три названия, пятьсот двадцать шесть законов, все на латыни.\n\nНовизна заключалась не в том, что в ней говорилось, а в том, кого она связывала. До этого гота судили по готскому обычаю, а римлянина — по Бревиарию Алариха, и происхождение человека решало, какая книга будет открыта над ним. Либер положил этому конец. Один кодекс, одна юрисдикция, все субъекты короны внутри него и пункт, запрещающий любому судье вообще ссылаться на любой другой закон.\n\nЭто последний пункт, о котором спорят ваши юристы." #NT!
 nd_got.2.a: "Пусть никакой другой закон не цитируется ни в одном суде королевства." #NT!
 nd_got.2.b: "Код принимает обычаи, которые находит, и переживает их." #NT!
 nd_got.3.t: "Советы Толедо" #NT!
 nd_got.3.d: "Восемнадцать из них между 400 и 702 годами, и они никогда не были просто синодами. Король созвал их. Пришли епископы и аббаты, а также графы палатинской канцелярии и светские магнаты королевства, и то, о чем они договорились, было опубликовано как закон королевства.\n\nНа третьем, в 589 году, Реккаред зачитал в комнате свое отречение от арианства, и королевство изменило религию. На четвертом, в 633 году, председательствовал Исидор Севильский, а семьдесят пятый канон сделал королевскую власть формально выборной и наложил анафему на любого человека, который силой захватил корону. Ни одно другое государство-преемник Рима не создало институт, который издавал законы для церкви и короны одновременно, и ни один из них не продержался так долго в одном месте.\n\nВопрос, который ваш суд не может избежать, заключается в том, какая половина этого органа на самом деле держит перо." #NT!
 nd_got.3.a: "Совет издает законы, а король обнародует" #NT!
 nd_got.3.b: "Король созывает и совет подтверждает" #NT!
 nd_got.4.t: "Кодекс как городской устав" #NT!
 nd_got.4.d: "Когда Фердинанд III взял Кордову в 1236 году, он не дал городу нового закона. Он приказал перевести Liber на кастильский язык и передать его в качестве городского фуэро, а также сделал то же самое в Севилье, Мурсии и ряде городов после них.\n\nЭтот шаг тоньше, чем кажется. Завоеванный город, получивший новую хартию, знает, что он завоеван. Городу, получившему Fuero Juzgo, говорят, что он всегда находился под этим законом, что прерывание было аномалией, и что корона скорее вернулась, чем вошла. Регистрация посредством юридической фикции ничего не стоит и действует на людей, которые будут сопротивляться гарнизону.\n\nПродолжать ли это делать, теперь это решение, требующее цены, потому что город, сохраняющий свой собственный устав, платит за привилегию." #NT!
 nd_got.4.a: "Даруйте Fuero Juzgo каждому городу, который мы захватим." #NT!
 nd_got.4.b: "Подтвердите городам их собственные уставы и возьмите плату." #NT!
 nd_got.5.t: "Примат Испании" #NT!
 nd_got.5.d: "Альфонсо VI взял Толедо в 1085 году, и через три года Урбан II издал буллу Cunctis Sanctorum, восстановив епископу первосвященнический статус, который он занимал при готских королях, и назвав Бернарда Седирака первым примасом Испании.\n\nПервенство не является почетным. Это претензия на юрисдикцию над другими митрополитами, на вызов их, на рассмотрение апелляций их судов, на то, чтобы крест несли перед вами в их соборах. Брага оспаривал его на протяжении четырех столетий. Таррагона оспорила это. Компостела построила свое собственное дело из костей апостола.\n\nАргумент в пользу Толедо всегда был один и тот же: здесь собирались советы, здесь писался закон, и королевство остается тем же королевством." #NT!
 nd_got.5.a: "Нажимайте на первенство, пока все в Иберии не согнется" #NT!
 nd_got.5.b: "Примат чести и мир испанской церкви" #NT!
 nd_got.6.t: "Обряд Исидора" #NT!
 nd_got.6.d: "Испаноязычная литургия старше, чем королевство, принявшее ее. Исидор сформировал ее, Ильдефонс и Юлиан Толедский дополнили ее, и ее пели в каждой церкви полуострова в течение пятисот лет. Затем в 1080 году Григорий VII запретил его в пользу использования римлянами, и он сохранился в шести приходах Толедо и больше нигде на земле.\n\nСиснерос не позволил ему умереть. В 1500 году он напечатал Missale Mixtum, в 1502 году — требник, а в часовне в соборе разместил тринадцать капелланов, вся обязанность которых заключалась в том, чтобы ежедневно и вечно петь старую мессу.\n\nКоролевство, сохраняющее свой собственный обряд, сохраняет притязания, существовавшие до реформирующего папства. Королевство, которое откажется от этого, обретет друга в Риме. И то, и другое верно одновременно." #NT!
 nd_got.6.a: "Освятите старый обряд и ежедневно пойте его в соборе." #NT!
 nd_got.6.b: "Соответствуйте римскому использованию и сохраните часовню как память." #NT!
 nd_got.7.t: "Совет стал постоянным" #NT!
 nd_got.7.d: "Восемнадцать советов за триста лет — это один каждые семнадцать лет, и всегда потому, что король чего-то от них хотел. Епископы приходили, когда их призывали, и уходили домой, когда их увольняли, а в перерывах законы принимала единолично корона.\n\nМагнаты и предстоятель теперь привели очевидный аргумент. Если советы являются конституцией королевства и если собственный титул короны основан на том, что она является наследником людей, которые заседали в них, то совет, который заседает только по созыву, вообще не является конституцией. Это одолжение.\n\nКорона может согласиться и быть связанной. Или это может указывать на то, что советы были королевскими с самого первого канона и что король, который не может распустить собрание, не является королем, которого избрали готы." #NT!
 nd_got.7.a: "Совет заседает по праву и не может быть распущен." #NT!
 nd_got.7.b: "Совет заседает, когда его созывают, как это всегда было." #NT!
 nd_got.8.t: "Помазание Вамбы" #NT!
 nd_got.8.d: "Рекчесвинт умер в Гертикосе в сентябре 672 года, и сопровождавшие его магнаты тут же приветствовали Вамбу, старика, который, судя по всему, этого не хотел. Он отказывался, пока герцог не обнажил на него меч.\n\nЗатем он сделал то, чего не делал ни один король на Латинском Западе. Он отправился в Толедо, и девятнадцатого сентября в церкви преторианских святых Петра и Павла митрополит Квирик возлил ему на голову елей. За восемьдесят два года до Пипина Короткого, в королевстве, которое франки называли варварским, церковь посвящала короля при его вступлении на престол.\n\nЭто делало его личность священной. Это не сделало его должность наследственной. Готы продолжали выбирать своих королей и продолжать их убивать, и эти два факта оставались бок о бок до конца жизни королевства." #NT!
 nd_got.8.a: "Пусть масло прольется, как это было в Толедо" #NT!
 nd_got.9.t: "Один закон для каждого жителя" #NT!
 nd_got.9.d: "В 1815 году «Реальная академия» напечатала «Fuero Juzgo» с латынью и кастильским языком на развороте, и люди, писавшие конституции, нашли в ней что-то неудобное. В старейшем законе Европы уже говорилось то, за что они выступали: что закон является территориальным, что он связывает каждого жителя королевства и что происхождение человека не решает, в каком суде он будет стоять.\n\nВ 654 году это означало готов и римлян. Сейчас неясно, что это значит, и в этом-то и заключается суть борьбы.\n\nОдно одно прочтение делает кодекс живым инструментом и применяет его принципы ко всем, кого с тех пор приобрело королевство. Другой превращает его в памятник: старейшее достояние страны, изученное и почитаемое, оставленное там, где оно есть." #NT!
 nd_got.9.a: "Этот принцип является живым законом и связывает всех, кого мы удерживаем." #NT!
 nd_got.9.b: "Кодекс — старейшее наследие страны и памятник." #NT!
  
  # Option hover tooltips 
 nd_got.1.a_tt: "Царство провозглашается на языке соборов и кодекса." #NT!
 nd_got.1.b_tt: "Царство провозглашено на языке Библии Вульфилы." #NT!
 nd_got.2.a_tt: "Положение о монополии Рекчесвинта нарушает все местные обычаи." #NT!
 nd_got.2.b_tt: "Кодекс применяется там, где он уместен, и приукрашивается там, где он не подходит." #NT!
 nd_got.3.a_tt: "Каноны Толедо становятся законом королевства." #NT!
 nd_got.3.b_tt: "Совет остается королевским инструментом, созываемым при необходимости." #NT!
 nd_got.4.a_tt: "Каждому захваченному городу в качестве устава передается Fuero Juzgo." #NT!
 nd_got.4.b_tt: "Города сохраняют свои уставы с королевского одобрения и за определенную плату." #NT!
 nd_got.5.a_tt: "Юрисдикция Толедо давила на Брагу, Таррагону и Компостелу." #NT!
 nd_got.5.b_tt: "Толедо сохраняет титул и отказывается от юрисдикции." #NT!
 nd_got.6.a_tt: "Испаноязычный обряд ежедневно исполнялся на основе печатного миссала." #NT!
 nd_got.6.b_tt: "Царство соответствует римскому использованию и хранит старые книги." #NT!
 nd_got.7.a_tt: "Собрание, которое корона не может распустить." #NT!
 nd_got.7.b_tt: "Собрание, которое собирается, когда у короны есть для этого дела." #NT!
 nd_got.8.a_tt: "Митрополит Толедо посвящает короля при его воцарении." #NT!
 nd_got.9.a_tt: "Территориальная юрисдикция распространялась на каждого жителя королевства." #NT!
 nd_got.9.b_tt: "Кодекс почитается как национальный памятник и остается там, где он стоит." #NT!
  
