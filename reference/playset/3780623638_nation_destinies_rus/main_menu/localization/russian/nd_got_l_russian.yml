 nd_got.10.t: "Болезнь готов" #NT!
 nd_got.10.d: "У ваших юристов каноны снова открыты, и на этот раз спорить не о чем. Семьдесят пятый канон Толедо IV однозначен. Король воспитывается с общего согласия магнатов и епископов всего народа. Он не рожден для этого.\n\nЗатем они переворачивают страницу и читают остаток века. Чиндасуинт отобрал трон у Тулги в результате переворота и уничтожил двести благородных семей, чтобы сохранить его. Вамба был пострижен в бессознательном состоянии и проснулся монахом. Эрвиг совершил предсмертное отречение, в которое никто не поверил. Сыновья Витицы все еще сражались с Родериком, когда корабли пришли из Африки, и франки записали все это под одним заголовком: #italic morbus Gothorum#!, болезнь готов, болезнь убийства ваших королей.\n\nВосстановленное королевство унаследовало титул, кодекс, советы и первенство. Он также унаследовал это. Ничто в конституции не говорит о том, как делается готский король, и пока что-то не будет сделано, каждое смертное одро в Толедо будет представлять собой мобилизацию." #NT!
 nd_got.10.a: "Тогда пусть королевство уладит это, и уладит это навсегда." #NT!
 nd_got.11.t: "Анафема" #NT!
 nd_got.11.d: "Канон зачитывается полностью при открытии собора, в том виде, в каком его оставил Исидор. Король должен быть поднят по общему согласию магнатов и епископов всего народа. Кто захватит корону тиранией, узурпацией, клятвой, принесенной фракцией, или кровью предшественника, тот будет анафемой перед Богом и изгнан из церкви и из всего собрания христиан со всеми соучастниками своего нечестия.\n\nЕпископы поднимаются и повторяют его, а магнаты поднимаются и повторяют его, и впервые с 711 года за приговором стоит собрание, которое действительно может его произнести. То, что они сделали, — это не церемония. Это электорат, и каждый человек в зале теперь знает, что претендент без его голосов - это не конкурирующий король, а отлученный от церкви с армией.\n\nСептиманские епископы сидят рядом с ними. Они были сутью. Канон говорит, что весь народ, и готские выборы, проведенные без кафедр за горами, были бы именно той фракцией, которую осуждает канон." #NT!
 nd_got.11.a: "Пусть ни один человек не станет королем, если он не станет королем в этой комнате." #NT!
 nd_got.12.t: "Казначейство и кошелек" #NT!
 nd_got.12.d: "Поместья покойного короля пересчитываются, и граф поставил вопрос, на который советы ответили в 653 году, и с тех пор каждый двор пытался забыть.\n\nЧиндасуинт конфисковали в таких масштабах, что его семья стала одной из самых богатых на полуострове, и именно его собственный сын Рекчесвинт представил бухгалтерские книги Восьмому совету Толедо, а не унаследовал их по-тихому. Епископы разделили две груды. То, что король приобретает после своего вступления на престол, он приобретает как король, и это принадлежит сокровищнице королевства. То, что он унаследовал до этого, он держит как мужчина, и оно переходит к его детям, как и любая другая земля.\n\nВ этом вся доктрина короны как должности, написанная деньгами, а не латынью. Ваши казначеи хотят знать, к какой куче принадлежит текущая стопка, и они хотели бы получить это в письменном виде." #NT!
 nd_got.12.a: "То, что забирает корона, принадлежит королевству, а не наследникам короля." #NT!
 nd_got.12.b: "Король сохраняет свои земли, а королевство получает от них оплату." #NT!
 nd_got.13.t: "Рекс Эрис Си Прямой Фасиас" #NT!
 nd_got.13.d: "Формула принадлежит Исидору, и она никогда не предназначалась для судебного разбирательства. #italic Rex eris sirecte facias, si non facias non eris.#! Ты станешь королем, если будешь действовать правильно; если вы этого не сделаете, вы не будете им. Он играл на старой этимологии, которая происходит от #italic rex#! от #italic recte#!, и юристы на протяжении четырех столетий отказывались воспринимать это как шутку.\n\nИх аргумент окончен и он герметичен. Корона вручается собранием. Оно передается на основании письменного кодекса. То, что предоставляется на условиях, может быть отозвано на тех же условиях, и поэтому королевская власть - это должность с определенными условиями, а не владение вообще.\n\nКорона может принять это, поклясться в кодексе до того, как нефть коснется ее головы, и стать первой монархией в Европе, которая формально несет ответственность перед своим собственным законом. Или оно может принять аргумент и изменить его направление: кодекс связывает королевство, корона является судьей кодекса, а не его субъектом, а офицеры, обеспечивающие его соблюдение, подчиняются королю." #NT!
 nd_got.13.a: "Король клянется соблюдать кодекс прежде, чем его коснется корона" #NT!
 nd_got.13.b: "Кодекс связывает царство, и корона — судья кодекса." #NT!
 nd_got.14.t: "Сын, коронованный рядом с отцом" #NT!
 nd_got.14.d: "Браулио Сарагосский написал письмо, которое имело большое значение. Чиндасуинту было восемьдесят, в королевстве на этот раз воцарилась тишина, и епископ прямо сказал ему: назови мальчика сейчас, пока еще можно заставить его поклясться.\n\nДвадцатого января 649 года Рекесвинт был коронован рядом со своим живым отцом, а четыре года спустя он унаследовал королевство, и ни один претендент не поехал в Толедо. Это не было чем-то новым. Леовигильд воспитал Герменегильда и Реккареда при своей жизни. Эгика сделал то же самое для Виттизы. Ассоциация не выигрывает спор о выборной королевской власти; это делает аргумент неуместным, потому что люди, которые будут выбирать, уже принесли присягу.\n\nИтак, клятва принята, корона возложена на голову мальчика, и люди, которые ее поклялись, хотят, чтобы ее использовали. За водой находится Септем, который удерживали готы до тех пор, пока граф Юлиан не послал свои корабли за Тариком в 711 году. В королевстве нет старых долгов." #NT!
 nd_got.14.a: "Клятва дана сыну. Теперь проведите их через воду" #NT!
 nd_got.15.t: "Наследство Амаль" #NT!
 nd_got.15.d: "Равенна ваша, а в мавзолее за стеной есть крыша, вырезанная из цельного куска истрийского камня, в триста тонн его, над пустой порфировой ванной. Ариане были изгнаны, а тело давно выброшено, но готы города знают, чье оно было.\n\nТеодорих Амаль правил Италией тридцать три года, выдал свою дочь замуж за вестготского короля, а после Вуйе взял Испанию в свои руки и владел обоими королевствами до 526 года. Это единственный раз, когда род был одним государством, и память об этом засела настолько глубоко, что немецкие поэты до сих пор воспевали Дитриха фон Берн, Теодорих Веронский, восемьсот лет спустя.\n\nКорона, претендующая на народ, а не на должность, только что оправдала это требование. Что она сделает с итальянцами – это вопрос. Собственный ответ Теодориха был #italic цивилитас#!: готы держат меч, римляне держат перо, и ни один из них не берет на себя работу другого. Альтернативой является тот, который выбрали его люди, когда впервые пришли, и он проще. Отдайте присяжным треть земли." #NT!
 nd_got.15.a: "Поселите присягнувших на земле, как это сделали Амали." #NT!
 nd_got.15.b: "Готы сохраняют меч, а Италия сохраняет свои офисы." #NT!
 nd_got.16.t: "Бро, Ада, Реген, Ханда" #NT!
 nd_got.16.d: "Список слов представляет собой копию копии, и каждый клерк, читающий его, замолкает.\n\nВ 1562 году посол императора в Константинополе, фламандец по имени Бусбек, собиравший рукописи и луковицы тюльпанов, вступил в разговор с двумя посланниками из Крыма. Один был грек, выучивший их речь; другой был одним из них и наполовину забыл об этом. Бусбек записал восемьдесят шесть слов. #italic Бро#!, хлеб. #italic Ада#!, яйцо. #italic Реген#!, дождь. #italic Ханда#!, рука. #italic Файдер#!, четыре. #italic Да#!, да.\n\nОн точно знал, что держит в руках. Вы тоже. Это ваш язык, на котором говорят фермеры и виноградари на холмах над Черным морем, за тысячу лет и три тысячи миль от комнаты, где Реккаред отрекся от арианства, в княжестве, которое греки называли Феодоро, и с тех пор на всех картах была отмечена Готия.\n\nОсманцы морили Мангуп голодом более пяти месяцев в 1475 году. Ваши солдаты стоят на нем сейчас, а люди в долине внизу все еще говорят #italic ada#!,3, когда имеется в виду яйцо." #NT!
 nd_got.16.a: "Верните их домой, и пусть люди снова станут одним народом." #NT!
 nd_got.16.b: "Оставьте их там, где они есть, и держите Готию как дальний марш." #NT!
  
  # ========================================================================== 
  # DESTINY TIMED MODIFIERS 
  # ========================================================================== 
 STATIC_MODIFIER_NAME_nd_got_dest_fiscus_regni: "Фискус Регни" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_fiscus_regni: "Казначейство королевства, проверяемое советом и закрытое для королевского двора. Доходы растут, потому что каждый может видеть, куда они идут, а армия, как и все остальные, ждет своей очереди." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_patrimonium_regis: "Патримониум Реджис" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_patrimonium_regis: "Король сохраняет свое наследство, и из него выплачивается королевство. Королевские владения усердно работали, осушали, засаживали и перестраивали, потому что каждый их акр — это собственное существование короны." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_rex_eris: "Рекс Эрис" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_rex_eris: "Корона, которая поклялась кодексу еще до того, как была коронована. Каждая канцелярия христианского мира теперь знает, что договоры, заключенные с этим королевством, переживут человека, подписавшего их, и ведет переговоры соответственно." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_lex_ministrorum: "Лекс Министрорум" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_lex_ministrorum: "Кодекс применяется вниз. Королевские судьи разъезжают по округам, королевские люди наблюдают за судьями, а школы, которые их выпускают, являются лучшими на полуострове. За все это платят торговцы." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_sortes_gothicae: "Сорта Готические" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_sortes_gothicae: "Присягнувшие получили свои наделы, как готы захватили треть Италии в 493 году. Сухопутные отряды собираются быстрее и крупнее и добывают свои богатства из земли, а не с дороги." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_civilitas: "Цивилитас" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_civilitas: "Формула Теодориха, сохраненная так, как он ее сохранил. Готы держат меч, а римляне — перо, и война, которую ведет одна каста королевства, изматывает остальную его часть гораздо меньше." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_gutans_gathered: "Собравшиеся готы" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_gutans_gathered: "Крымские готы пришли на запад и поселились среди своих. Ряды пополняются за счет людей, а не провинций, и корона, прошедшая три тысячи миль за восемьдесят шесть слов, — это не та корона, которую кто-то забудет." #NT!
 STATIC_MODIFIER_NAME_nd_got_dest_marca_gothica: "Марка Готика" #NT!
 STATIC_MODIFIER_DESC_nd_got_dest_marca_gothica: "Готия удерживалась там, где она стоит, с гарнизоном над Черным морем и снабжением по морю. Форты окупаются за счет претензий; факторы, которые могли бы торговать в другом месте, этого не делают." #NT!
  
  # ========================================================================== 
  # DESTINY BUILDINGS 
  # ========================================================================== 
 nd_got_dest_thesaurus: "Публичный тезаурус" #NT!
 nd_got_dest_thesaurus_desc: "Сокровищница королевства, хранившаяся отдельно от палаты короля. То, что король приобретает после своего вступления на престол, подсчитывается здесь и не может быть оставлено его детям, что является доктриной короны как должности, указанной в бухгалтерских книгах, а не на латыни." #NT!
 nd_got_dest_thesaurus_maintenance: "Казначейский аудит" #NT!
 nd_got_dest_thesaurus_maintenance_desc: "Бумага, воск, прессы и простая ткань людей, считающих чужие деньги для получения зарплаты. Казначейство, которое никто не может использовать в частном порядке, — это казначейство, которое нужно видеть, чтобы его можно было проверить." #NT!
 nd_got_dest_thiudangardi: "Тиудангарди" #NT!
 nd_got_dest_thiudangardi_desc: "Готическое слово Вульфилы, обозначающее королевство, означает королевскую ограду: дом, а не должность. Зал, где присягнувших кормят и квартируют и где провозглашают наследника при жизни его отца, в то время как люди, которые в противном случае избрали бы его, стоят в комнате." #NT!
 nd_got_dest_thiudangardi_maintenance: "Бытовое обеспечение" #NT!
 nd_got_dest_thiudangardi_maintenance_desc: "Мясо, вино, древесина и железо для зала, в котором всю зиму кормят вооруженных людей. Клятва возобновляется за столом, а это значит, что столу никогда не позволено быть бедным." #NT!
  
  # Destiny option hover tooltips 
 nd_got.10.a_tt: "Наследование рассматривается как вопрос, подлежащий разрешению." #NT!
 nd_got.11.a_tt: "Избирательным органом становится собрание магнатов и епископов." #NT!
 nd_got.12.a_tt: "Королевские приобретения после воцарения переходят в казну королевства." #NT!
 nd_got.12.b_tt: "Унаследованные королем земли остаются частными, и корона живет за счет них." #NT!
 nd_got.13.a_tt: "Корона клянется кодексу и несет ему ответственность." #NT!
 nd_got.13.b_tt: "Корона обеспечивает соблюдение кодекса через своих собственных чиновников." #NT!
 nd_got.14.a_tt: "Наследника коронуют при жизни отца, а хозяин крестится." #NT!
 nd_got.15.a_tt: "Присяжные отбирают наделы итальянской земли." #NT!
 nd_got.15.b_tt: "Готская армия под римской администрацией, как правил Теодорих." #NT!
 nd_got.16.a_tt: "Крымские готы расселены внутри королевства." #NT!
 nd_got.16.b_tt: "Готия остается там, где она стоит, как далекий марш." #NT!
  
  # ========================================================================== 
  # BUREAUCRACIES 
  # ========================================================================== 
 got_numerarii_bureaucracy: "Нумерарии Фиска" #NT!
 got_numerarii_bureaucracy_desc: "Налоговое законодательство королевства. Придворный наследник сам назначал нумерария каждого города сроком на один год, полностью минуя провинцию: фиск был самым централизованным органом, которым управляли готы. В двух барселонских документах 592 г., De fisco Barcinonensi, записано, как епископы Тарраконенси определяли, что сборщики могли взять и какую плату они могли взимать за это, а Третий собор Толедо (589 г.) уже распорядился ежегодно созвать провинциальный синод, на котором фискальные агенты отвечали за свое поведение. Людей, оценивавших землю, проверяли люди, крестившие ее." #NT!
 got_schola_episcopalis_bureaucracy: "Епископальные школы" #NT!
 got_schola_episcopalis_bureaucracy_desc: "Канон 1 Второго Толедского собора (527 г.) предписывал, чтобы мальчики, отданные в церковь, воспитывались в доме, примыкающем к собору, под присмотром епископа и учителя, пока они не станут достаточно взрослыми, чтобы самим выбирать свою жизнь. Это самая ранняя зарегистрированная соборная школа на Латинском Западе. Четвертый собор (633 г.) сделал правило общим, и в результате этих домов вышли «Этимологии» Исидора, трактаты Ильдефонса и Юлиана, а также нотариальные руки, составившие кодекс." #NT!
 got_sacramentum_fidelitatis_bureaucracy: "Сакраментум Фиделитатис" #NT!
 got_sacramentum_fidelitatis_bureaucracy_desc: "Общая клятва верности, которую приносили королю палатинская должность, епископы и народ при каждом восшествии на престол, излагалась в письменной форме, которую юристы называли «условиями священнодействия». Кодекс Рекесвинта аннулировал любую клятву, принесенную другому лорду, кроме короля, - требование, которое не могла предъявить ни одна монархия к северу от Пиренеев, поскольку там весь политический порядок был построен именно на частных клятвах, которые аннулировал этот закон. Канон 75 Толедо IV (633 г.) положил за это анафему церкви, и Эгика принес свою клятву перед Пятнадцатым собором в 688 г., чтобы спросить, какая часть этого закона все еще связывает его. В клятве не говорится, кто станет королем. Там сказано, что люди, которые клялись, не могут его разрушить." #NT!
 got_conventus_vicinorum_bureaucracy: "Conventus Publicus Vicinorum" #NT!
 got_conventus_vicinorum_bureaucracy_desc: "Публичное собрание соседей - единственная юрисдикция, которую Liber Iudiciorum признает ниже графского суда. Перед ним нужно было создать беглеца, доказать перед ним границу, объявить ему заблудшее население и меньшие обиды деревни, поселившиеся в ней людьми, которые не были обязаны ни одному господину за право судить. Его потомками являются деревенские советы северной Иберии десятого века, поэтому сельские положения кодекса седьмого века все еще действовали как закон спустя четыреста лет после падения королевства." #NT!
  
  # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_got_bureaucracy_authority: "Офисы Регнума" #NT!
 AUTO_MODIFIER_DESC_nd_got_bureaucracy_authority: "Королевство, восстановленное посредством юридических аргументов, наследует должности, названные в аргументах. Помимо создания королевского города, корона может поддерживать в рабочем состоянии один институт готского государства." #NT!
