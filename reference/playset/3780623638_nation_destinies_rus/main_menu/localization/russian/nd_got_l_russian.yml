 nd_got_destiny: "Болезнь готов" #NT!
 nd_got_destiny_desc: "Канон 75 Четвертого Толедского собора 633 года устанавливал, что король назначается с общего согласия магнатов и епископов всего народа, и объявлял анафему любому человеку, принявшему корону в противном случае. В последующие семьдесят лет королей свергали, ослепляли, постригали и убивали, пока франки не придумали название для этой привычки: болезнь готов.\n\nВсе остальное в восстановленной конституции улажено. Кодекс написан, соборы имеют свои каноны, предстоятель имеет свой престол. Открыто только создание короля, и до тех пор, пока королевство не закроется, каждое восшествие на престол — это война, ожидающая кандидата.\n\n#bold Требуется:#! стабильное королевство." #NT!
 nd_got_dest_canon_75: "Семьдесят пятый канон" #NT!
 nd_got_dest_canon_75_desc: "Исидор Севильский председательствовал в Толедо в 633 году, и семьдесят пятый канон — его работа: король воспитывается по общему согласию магнатов и епископов всего народа, и всякий, кто захватит трон любым другим способом, изгоняется из церкви и из королевства.\n\nПрочитайте внимательно формулировку. Там говорится, что епископы всего народа, а весь народ включает и готские престолы за горами. Выборы, проведенные в то время, когда треть епископата подчиняется иностранной короне, не являются выборами, описанными в каноне. Нарбонна уже ваша. Его суфражистки - нет.\n\n#bold Требуется:#! Безье и Агд, а также стабильное королевство." #NT!
 nd_got_dest_fiscus_publicus: "Фиск и наследие" #NT!
 nd_got_dest_fiscus_publicus_desc: "На Восьмом Толедском соборе в 653 году епископам был задан самый неловкий вопрос, который только можно задать суду. Чиндасуинт конфисковал имущество в размерах, которые сделали его семью богатой, а его сын Рекесвинт представил все это совету, вместо того, чтобы хранить это в тайне.\n\nВ результате получилось правило, которому нет равных ни в одном другом королевстве-преемнике. Все, что король приобретает после своего вступления на престол, принадлежит казне королевства, а не его наследникам. Его собственное унаследованное наследство остается его собственностью и переходит, как и имущество любого человека. Король, который не может оставить доходы королевства своим детям, должен передать должность, а не поместье.\n\n#bold Требуется:#! Лодев и Ним, казначейство 2000 года, развитое банковское дело и стабильное королевство." #NT!
 nd_got_dest_rex_sub_lege: "Король по кодексу" #NT!
 nd_got_dest_rex_sub_lege_desc: "Исидор написал это как игру слов, и юристы восприняли это как правило конфискации. #italic Rex eris sirecte facias, si non facias non eris.#! Ты станешь королем, если будешь действовать правильно; если вы этого не сделаете, вы им не станете.\n\nКорона, дарованная собранием на основе письменного кодекса, удерживается на условиях кодекса и может быть потеряна из-за него. Это конец спора, начатого советами: должность переживет человека, закон превосходит должность, а королевство — это лицо закона, которое продолжает носить корону. Его нельзя выиграть с помощью армии. Его можно выиграть, если вы богаты, грамотны, стабильны и стары.\n\n#bold Требуется:#! просветление, 3000 в сокровищнице, 10000 общего развития, 75 престижа и стабильное царство." #NT!
 nd_got_dest_rex_cum_patre: "Король, коронованный при жизни своего отца" #NT!
 nd_got_dest_rex_cum_patre_desc: "Есть только один способ, которым готский король когда-либо побеждал на выборах, и это не аргумент. Пришло время. Чиндасуинту было восемьдесят, и Браулио Сарагосский написал ему письмо, призывая его к этому, и двадцатого января 649 года его сын Рекесвинт был коронован рядом с ним, пока он еще дышал. Леовигильд сделал это для Герменегильда и Реккареда; Эгика сделала это ради Виттизы. Присягнувшие клянутся сыну при жизни отца, и когда отец умирает, выбирать уже нечего.\n\nКороль, созданный своими людьми, обязан им войной. Самый старый долг королевства — это пролив, который граф Юлиан Сеутский открыл в 711 году своими кораблями.\n\n#bold Требуется:#! Сеута и Танжер, а также армия из 30 полков." #NT!
 nd_got_dest_gens_una: "Один народ, два королевства" #NT!
 nd_got_dest_gens_una_desc: "Готы разошлись на Дунае и никогда формально не были двумя народами. Теодорих Амаль правил Италией из Равенны, выдал свою дочь замуж за короля вестготов, а когда этот король пал при Вуйе в 507 году, взял испанское королевство в свои руки и удерживал оба, пока не умер в 526 году. Одно готское королевство от Сицилии до Тежу, в течение девятнадцати лет.\n\nКорона, которая претендует на народ, а не на должность, претендует на весь народ. Другая половина его находится в Равенне под крышей, высеченной из одного камня, а Верона, которую немецкие поэты называли Берном на протяжении восьмисот лет, была собственным городом Теодориха.\n\n#bold Требуется:#! Равенна и Верона, армия из 50 полков и 50 престижей." #NT!
 nd_got_dest_gutthiuda: "Язык все еще разговаривает" #NT!
 nd_got_dest_gutthiuda_desc: "В 1562 году Ожье Гизелен де Бюсбек, посол императора в Константинополе, вступил в разговор с двумя посланниками из Крыма и записал восемьдесят шесть их слов. #italic Бро#! за хлеб. #italic Ада#! за яйцо. #italic Реген#! для дождя. #italic Ханда#! вместо руки.\n\nОн нашел последних людей на земле, говорящих на готском языке: в тысяче лет и трех тысячах миль от Толедо, в горах над Черным морем, в княжестве, которое греки называли Феодоро, и на картах до сих пор отмечена Готия. Каффа под ними — генуэзский порт, ворота в него.\n\nОфис никогда не признает своих обязательств. Народ делает. Иди и возьми их.\n\n#bold Требуется:#! Теодоро и Каффа, армия из 75 полков и 75 очков престижа." #NT!
  
