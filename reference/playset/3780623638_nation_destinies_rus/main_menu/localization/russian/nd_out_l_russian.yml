l_russian:
  
 # === Static Modifiers: formation choices === 
 STATIC_MODIFIER_NAME_nd_out_compact_of_the_courts: "Соглашение судов" #NT!
 STATIC_MODIFIER_DESC_nd_out_compact_of_the_courts: "Присягали у Гроба в присутствии свидетелей, говорящих на шести языках. В Верхнем суде находятся бароны, в Суде буржуазии — франкские общины, в Суде фонда — рынок, состоящий из двух франкских и четырех сирийских присяжных, а в Суде ла Шэня — гавань. Помимо них, свои законы и свои постановления соблюдают кади, коптские и якобитские епископы, католикосы в Багдаде и бет-дин. Империя держится, потому что корона не настаивает на том, чтобы быть единственным двором, и именно в этом заключается цена." #NT!
 STATIC_MODIFIER_NAME_nd_out_custodian_of_the_sanctuaries: "Хранитель Святилищ" #NT!
 STATIC_MODIFIER_DESC_nd_out_custodian_of_the_sanctuaries: "Император берет на себя опеку над Меккой и Мединой, ставит гарнизоны на дороге паломников от Синая до Хиджаза и отправляет свой эскорт в караваны карими, перевозящие перец из Адена. От Суэца до Ворот Слез узкое море подчиняется латинской короне, и каждая мусульманская держава, которая хочет, чтобы ее люди находились в Каабе, теперь должна написать в Иерусалим. Латинское духовенство королевства называет это отступничеством и говорит это с каждой кафедры, за которую платит корона." #NT!
 STATIC_MODIFIER_NAME_nd_out_the_new_towns: "Новые города" #NT!
 STATIC_MODIFIER_DESC_nd_out_the_new_towns: "Единственный законный способ изменить арифметику — привлечь больше людей. Геодезисты размечают деревни горожан по модели Магна Махумерия вдоль дороги Наблуса: единственная улица, башня, церковь, участки, находящиеся в свободном владении, без трудовых взносов и без платы за брак. Поселенцы выходят из паломнических галер в Яффо с чартером в руках. Сельская местность, в которой они посажены, не просила о них." #NT!
  
 # === Static Modifiers: advance events === 
 STATIC_MODIFIER_NAME_nd_out_castles_of_the_brethren: "Замки Братьев" #NT!
 STATIC_MODIFIER_DESC_nd_out_castles_of_the_brethren: "Крак, Маргат, Бельвуар и еще сорок остаются в руках Храма и Госпиталя, гарнизон которых формируется за счет европейских доходов и подотчетен Риму. Граница никогда не была сильнее, и влияние короны на нее никогда не было меньшим." #NT!
 STATIC_MODIFIER_NAME_nd_out_castles_of_the_crown: "Замки короны" #NT!
 STATIC_MODIFIER_DESC_nd_out_castles_of_the_crown: "Кастеллани переходит под юрисдикцию Высшего суда, и орденам сообщают, что освобождение от папской юрисдикции не входит в их компетенцию. Поступают ключи. То же самое происходит и с отставкой лучших солдат гарнизона в Леванте." #NT!
 STATIC_MODIFIER_NAME_nd_out_charters_renewed: "Уставы продлены" #NT!
 STATIC_MODIFIER_DESC_nd_out_charters_renewed: "Венеция, Генуя и Пиза сохраняют свои помещения целыми: церковь, печь, баню, весы, суд и виселицу, а также освобождение от таможенных пошлин. В свою очередь, империя имеет больше судов, чем любая другая держава на любом море." #NT!
 STATIC_MODIFIER_NAME_nd_out_quarters_reduced: "Уменьшенные кварталы" #NT!
 STATIC_MODIFIER_DESC_nd_out_quarters_reduced: "Общественная виселица опускается, и впервые за столетие на пристань выходит королевский заседатель. Некоторые западные галеры направляются в более дружественный порт и не возвращаются обратно." #NT!
 STATIC_MODIFIER_NAME_nd_out_one_code_of_acre: "Один кодекс акров" #NT!
 STATIC_MODIFIER_DESC_nd_out_one_code_of_acre: "Юристы пишут единый кодекс, связывающий каждого подданного империи, и каждое сообщество, имевшее свой собственный закон, узнает, что означает слово «имперский»." #NT!
 STATIC_MODIFIER_NAME_nd_out_many_courts_one_crown: "Много судов, одна корона" #NT!
 STATIC_MODIFIER_DESC_nd_out_many_courts_one_crown: "Ливр называет нижестоящие суды, а не заменяет их. Шесть правовых систем находятся под одной короной, тихие и довольные, и каждый закон, который империя желает принять, теперь должен разрабатываться шесть раз." #NT!
 STATIC_MODIFIER_NAME_nd_out_guardianship_kept: "Опека сохранена" #NT!
 STATIC_MODIFIER_DESC_nd_out_guardianship_kept: "Легат уходит домой, не прочитав вслух письмо. Святилища остаются открытыми, хадж продолжает сопровождать, таможня продолжает работать, а духовник императора перестает приходить в суд." #NT!
 STATIC_MODIFIER_NAME_nd_out_legates_obedience: "Послушание легата" #NT!
 STATIC_MODIFIER_DESC_nd_out_legates_obedience: "Рим повинуется. Латинское царство примирилось само с собой и с христианским миром, и новости достигают каждой мечети между Каиром и Аденом еще до того, как легат достигнет побережья." #NT!
 STATIC_MODIFIER_NAME_nd_out_one_roll_of_taxation: "Один рулон налогообложения" #NT!
 STATIC_MODIFIER_DESC_nd_out_one_roll_of_taxation: "Одна оценка, один список, один тариф, и вера подданного больше не зависит от казны. Управлять этой империей дешевле, чем когда-либо, и дороже, чем управлять ею." #NT!
 STATIC_MODIFIER_NAME_nd_out_offering_of_the_sanctuaries: "Подношение святилищ" #NT!
 STATIC_MODIFIER_DESC_nd_out_offering_of_the_sanctuaries: "Подушная подать становится добровольным подношением, собираемым самими святилищами на свое содержание. Общины платят ее с радостью и в полном объеме, и корона никогда не видит бухгалтерской книги." #NT!
  
 # === Event variable tooltips === 
 nd_out_formed_tt: "Провозглашен Утремер." #NT!
 nd_out_path_a_tt: "Учредительное соглашение: Судебный договор." #NT!
 nd_out_path_b_tt: "Основатель поселения: Хранитель святилищ." #NT!
 nd_out_path_c_tt: "Поселение-основатель: Новые города." #NT!
 nd_out_e1_done_tt: "Коронация у Гроба Господня состоялась." #NT!
  
 # === Formation Event === 
 nd_out.1.t: "Корона Утремера" #NT!
 nd_out.1.d: "Корона возлагается на вашу голову в Храме Гроба Господня, и глашатай читает в нефе стиль: Царь Иерусалима, Владыка Египта, Повелитель Багдада и Мосула, Хранитель Мекки и Медины, Хранитель Врат Слез.\n\nЗатем камергер вручает вам обзор, и это не триумф. Из каждых десяти душ в этой империи менее двух слушают мессу на латыни. Верховный суд баронов не обладает юрисдикцией почти ни над одним из них. Сорок пограничных замков принадлежат Храму и Госпиталю, подчиняющимся Риму. Венецианские, генуэзские и пизанские кварталы в ваших портах содержат свои дворы, печи, бани и виселицы и не платят вам ничего. Доход, который поддерживает вашу действующую армию, — это подушный налог с подданных, которые вообще не являются христианами, и он выплачивается в обмен на вашу защиту.\n\nУтремер означает за границей. Вы унаследовали царство, а не завоевали его, и вопрос не в том, как его завоевать. Вопрос в том, на каком основании вы предлагаете управлять людьми, которые не являются вами.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_out.1.a: "Подтвердите мнение каждого сообщества" #NT!
 nd_out.1.b: "Возьмите на себя опеку над Меккой и Мединой" #NT!
 nd_out.1.c: "Постройте новые города и заселите здесь Запад." #NT!
  
 # === Advance Events === 
 nd_out.2.t: "Кастелланство орденов" #NT!
 nd_out.2.d: "Маршала госпиталя проводят в зал, он не становится на колени. От него это не требуется: папская привилегия освобождает его орден от любой юрисдикции, кроме римской.\n\nС 1130-х годов мирские лорды Латинского Востока передали свои приграничные замки Храму и Больнице, потому что ордены могли размещать в них гарнизоны, а лорды - нет. Крак, Маргат, Бельвуар и еще сорок владеют братствами, получающими зарплату из поместий в Провансе и Арагоне, укомплектованными людьми, принявшими обеты в Париже, и управляемыми капитулами, которые решают свои собственные кампании.\n\nНи одна корона здесь никогда не удерживала границу без них. Ни одна корона здесь никогда не была в состоянии отдать им приказ." #NT!
 nd_out.2.a: "Подтвердите свои замки и свои привилегии" #NT!
 nd_out.2.b: "Созвать кастелянство перед Верхним Куром." #NT!
 nd_out.3.t: "Кварталы Коммуны" #NT!
 nd_out.3.d: "В 1256 году венецианцы и генуэзцы вели войну внутри Акры, улица за улицей, из-за монастыря Святого Саввы, в то время как королевство, владевшее городом, наблюдало из цитадели и не получало вопросов.\n\nКаждая коммуна имеет обнесенный стеной квартал в ваших портах со своей собственной церковью, печью, баней, весами, судом и виселицей. Их бэйли судят свой народ. Их нотариусы хранят контракты. Их освобождение от таможенных пошлин записано в хартиях, выданных до рождения вашего деда, в обмен на флоты, которые захватили эти города в первую очередь.\n\nФакторы уже у дверей хартий, требуя продления." #NT!
 nd_out.3.a: "Обновить уставы в их нынешнем виде" #NT!
 nd_out.3.b: "Отменить льготы и занять причалы" #NT!
 nd_out.4.t: "Книга ассисов" #NT!
 nd_out.4.d: "Юристы работают в Акре уже четыре года, и чистый экземпляр готов. Впервые законы этого королевства существовали где-либо, кроме как в памяти людей, которые заседали в качестве присяжных.\n\nВ «Livre des Assises de la Cour des Bourgeois» изложены законы франкского сообщества: виконт, который следит за порядком, но не голосует, двенадцать присяжных, которые выносят вердикт, заявления о долге, приданое и кровь. В нем также в общих чертах названы нижестоящие суды: кади для мусульман, бет-дин для евреев, епископы для восточных христиан и Фонд для рынка, где все они торгуют.\n\nЗаписание закона ставит вопрос, на который обычай никогда не должен был ответить. Чей это закон?" #NT!
 nd_out.4.a: "Один код, обязательный для каждого предмета" #NT!
 nd_out.4.b: "Назовите суды ниже и оставьте их в покое" #NT!
 nd_out.5.t: "Легат в святилищах" #NT!
 nd_out.5.d: "Легат прибыл из Рима с требованием настолько очевидным, что он не ожидает никаких аргументов. Вы держите Мекку. Вы держите Медину. Христианский мир молился об этом двести лет и теперь ожидает, что вы их закроете.\n\nУ него готов прецедент. В 1182 году Рейнальд Шатильон отправил пять галер в Красное море и высадил отряд на побережье между двумя городами, и шок от этого никогда не утихал с обеих сторон.\n\nУ вашего камергера есть другой гроссбух. Ежегодно хадж приводит сто тысяч человек через ваши продовольственные рынки, по дорогам, которые обслуживают ваши инженеры, под конвоем, который оплачивает ваша казна, и каждый из них покупает еду, воду, транспорт и охранную грамоту. Половина ваших подданных измеряет вашу легитимность тем, смогут ли их родители совершить этот путь." #NT!
 nd_out.5.a: "Святилища остаются открытыми. Отправьте его домой." #NT!
 nd_out.5.b: "Рим повинуется." #NT!
 nd_out.6.t: "Подушный налог отменен" #NT!
 nd_out.6.d: "Подушный налог для ваших нелатинских подданных старше крестового похода. Фатимиды взимали его, Айюбиды взимали его, франки взяли на себя управление регистрами, не меняя ни одной колонки, и в течение пяти столетий это был самый крупный обычный доход этого королевства.\n\nЭто никогда не было просто налогом. Это был договор: вы платите, а корона защищает вашу веру, ваш двор и ваше святилище. Из этих средств оплачивались расходы каждого смотрителя, стоявшего у святилища, и каждого сопровождающего, сопровождавшего хадж.\n\nКазначей без энтузиазма отмечает, что государство, которое пятьсот лет настаивало на том, что религия подданного не является делом короны, больше не может объяснить, почему корона облагает ее налогом." #NT!
 nd_out.6.a: "Один набор налогов для каждого субъекта" #NT!
 nd_out.6.b: "Пусть святилища соберут его как приношение" #NT!
  
 # === Event option tooltips === 
 nd_out.1.a_tt: "Каждая община хранит свой собственный закон и свою судебную коллегию. Корона перестает быть единственным судом." #NT!
 nd_out.1.b_tt: "Корона гарантирует хадж и облагает налогом Красное море. Латинское духовенство королевства этого не простит." #NT!
 nd_out.1.c_tt: "Поселенцы, уставы и поселения. Единственный законный способ изменить арифметику королевства." #NT!
 nd_out.2.a_tt: "Ордена охраняют приграничные замки, а корона не допускает их." #NT!
 nd_out.2.b_tt: "Кастелланство подчиняется Верхнему Куру, и лучшие гарнизоны Леванта передают свои ключи." #NT!
 nd_out.3.a_tt: "Коммуны сохраняют свои помещения, свои суды и освобождение от таможенных пошлин." #NT!
 nd_out.3.b_tt: "Корона занимает причалы, а часть западных судов отправляется в другие места." #NT!
 nd_out.4.a_tt: "Один код для каждого подданного империи, независимо от того, просили они об этом или нет." #NT!
 nd_out.4.b_tt: "Шесть правовых систем под одной короной, тихо и медленно." #NT!
 nd_out.5.a_tt: "Святилища остаются открытыми, а собственная церковь императора восстает против него." #NT!
 nd_out.5.b_tt: "Христианский мир доволен, и об этом узнает половина королевства." #NT!
 nd_out.6.a_tt: "Одна оценка по каждому предмету, а в казне дыра, где был подушный налог." #NT!
 nd_out.6.b_tt: "Святилища сами собирают средства на содержание, и корона никогда не видит бухгалтерскую книгу." #NT!
  
 # === Advances === 
 nd_out_rais_and_dragoman: "Раис и Драгоман" #NT!
 nd_out_rais_and_dragoman_desc: "Франки не заменили руководство деревней; они это подтвердили. Раис был старостой деревни, который уже имел ту же речь и веру, что и его соседи, владел лучшим фруктовым садом и отвечал за общину. Напротив него стоял барский драгоман, переводчик с феодом и писец, который вел счета. Среди его арендаторов почти не проживал ни один франкский лорд, да и эта пара ему не пришлось." #NT!
 nd_out_capitation_of_the_realm: "Капитализация королевства" #NT!
 nd_out_capitation_of_the_realm_desc: "Крестоносцы унаследовали подушный налог с немусульман и просто изменили направление, взимая его с мусульман и евреев, оставив в остальном реестры нетронутыми. Это был самый крупный обычный доход короны, и он собирался в качестве платы за защиту, а это означало, что казна и святилища были связаны друг с другом с самого начала." #NT!
 nd_out_mountain_crossbows: "Арбалеты горы" #NT!
 nd_out_mountain_crossbows_desc: "Вильгельм Тирский описывает маронитов Горного Ливана как доблестных людей, которые дали франкам разведчиков, проводников, наездников и лучников, умеющих обращаться с арбалетом на итальянский манер. В 1182 году их патриарх искал союза с латинским патриархом Антиохии. Это была единственная местная община, которая пришла в Рим по собственному желанию, и их никогда не было достаточно много, чтобы изменить арифметику королевства." #NT!
 nd_out_rent_not_labour: "Аренда, а не труд" #NT!
 nd_out_rent_not_labour_desc: "Государства крестоносцев не ввели крепостного права, что удивляет каждого, кто об этом слышит. Местные крестьяне были должны долю урожая, местами всего лишь четверть, и больше ничего не были должны: ни работы на собственной земле лорда, ни платы за вступление в брак, ни натуральных налогов по старому западному образцу. Благодаря этому сельская местность выросла. Так же возникла проблема формирования армии из крестьян, не обязанных служить." #NT!
 nd_out_wardens_of_the_sanctuaries: "Стражи святилищ" #NT!
 nd_out_wardens_of_the_sanctuaries_desc: "Коронный офицер с небольшой охраной, стипендией и одним указанием: святилище остается открытым, к паломникам не приставают, и ни один миссионер не проходит через ворота. В царстве находятся Кааба, Мечеть Пророка, греческая и армянская часовни Гроба, Коптский патриархат, католикос Церкви Востока, самаритяне Наблуса и мандеи нижнего Евфрата." #NT!
 nd_out_castellany_of_the_orders: "Кастелланство орденов" #NT!
 nd_out_castellany_of_the_orders_desc: "С 1130-х годов светские лорды уступили свои приграничные замки Храму и Больнице, чьи папские льготы поставили их за пределы любой местной юрисдикции. Он создал сильнейшую в мире укреплённую границу с гарнизонами за чужой счёт внутри королевства, чья корона не могла им командовать." #NT!
 nd_out_darb_al_hajj: "Дарб аль-Хадж" #NT!
 nd_out_darb_al_hajj_desc: "Дорога паломников пролегала из Каира через Синай и из Дамаска вниз по Хиджазу: цистерны, высеченные в скалах, форты в дневном переходе, продовольственные рынки у колодцев, и все это содержалось за счет казны, чтобы другие люди могли добраться до Мекки. Империя, которая держит оба конца этого пути, — это христианское государство, которое платит за мусульманское паломничество и делает это хорошо." #NT!
 nd_out_camels_of_the_road: "Верблюды дороги" #NT!
 nd_out_camels_of_the_road_desc: "Империя со столицей в Иерусалиме, житницей в Каире, восточной столицей в Багдаде и таможней в Адене передвигается на верблюдах или не передвигается. Подрядчики-бедуины, которые перевозили галеры Рейнальда по частям через Негев, перевезут что угодно за договорную цену." #NT!
 nd_out_ships_carried_by_camel: "Корабли, перевозимые верблюдом" #NT!
 nd_out_ships_carried_by_camel_desc: "Рейнальд Шатильон потратил два года на постройку пяти галер в Кераке, разобрал их, нанял бедуинских верблюдов, чтобы перевезти бревна на двести километров через Негев в Айлу в истоке залива Акаба, и собрал их заново в море, которого никогда не касался ни один франкский киль. Письма Саладина отражают шок. Империя делает трюк постоянным: стоячая верфь и стоячая эскадра на Красном море." #NT!
 nd_out_communes_of_the_ports: "Коммуны портов" #NT!
 nd_out_communes_of_the_ports_desc: "Венеция, Генуя и Пиза имеют окруженные стенами кварталы внутри собственных гаваней короны, со своей собственной церковью, печью, баней, гирями, судом и виселицей, а также хартиями, освобождающими их от таможенных пошлин. Они являются причиной того, что в королевстве вообще есть доставка, и постоянной дырой в оценке." #NT!
 nd_out_livre_des_assises: "Книга ассизов" #NT!
 nd_out_livre_des_assises_desc: "Написано в Акре между 1240 и 1244 годами. В нем изложены законы франкского сообщества под управлением виконта, который следит за порядком и не имеет права голоса, и двенадцати присяжных заседателей, выносящих вердикт, а также указаны нижестоящие суды: кади, бет-дин, восточные епископы. Суд фонда сам оценивал рынок в составе двух франкских присяжных и четырех сирийцев." #NT!
 nd_out_confraternities_of_acre: "Братства Акры" #NT!
 nd_out_confraternities_of_acre_desc: "Клятвенные братства горожан с залом, святым покровителем и позывным списком. Святой Андрей и Святой Дух в Акре вооружили своих членов, обучили их и к тринадцатому веку стали выступать от имени города в его собственной политике. Они превосходно защищают собственные стены и крайне неохотно маршируют куда-либо еще." #NT!
 nd_out_pilgrim_passage: "Паломнический проход" #NT!
 nd_out_pilgrim_passage_desc: "Рейс в Яффо представлял собой регулируемое пассажирское сообщение: фиксированные тарифы, контракт, одобренный сенатом, сезон плавания и корпус, предназначенный для перевозки людей, а не груза или оружия. Корона строит свою собственную и перестает платить Венеции за привилегию привозить паломников в свою столицу." #NT!
 nd_out_tiraz_of_tinnis: "Тираз Тинниса" #NT!
 nd_out_tiraz_of_tinnis_desc: "Государственные ткацкие дома Тинниса и Дамиетты производили самое ценное полотно в средневековом Средиземноморье, и на каждом рулоне была тканая лента с именем правящего правителя. Крестоносцы завладели мастерскими, ткачами и всем остальным. Тираз латинского императора называет его по-арабски, что означает эту империю в одном объекте." #NT!
 nd_out_karimi_compact: "Соглашение Карими" #NT!
 nd_out_karimi_compact_desc: "Карими были мусульманскими торговыми домами, которые в течение двух столетий перевозили малабарский перец из Адена вверх по Красному морю в Кус, Каир и Александрию в вооруженных конвоях. Мешок, стоивший монет в Каликуте, продавался в десять раз дороже в Александрии и в тридцать в Венеции. Корона их не заменит. Оно их сопровождает, страхует и берет на таможне свой процент." #NT!
 nd_out_custodian_of_the_hajj: "Хранитель хаджа" #NT!
 nd_out_custodian_of_the_hajj_desc: "Самый странный стиль христианского мира, зачитанный на латыни в Иерусалиме: «Хранитель двух святилищ». Это не вежливость. Это означает, что каждая мусульманская держава, желающая, чтобы ее подданные достигли Мекки, должна вести переговоры с католическим императором, и что легитимность императора дома теперь частично зависит от того, насколько хорошо он это делает." #NT!
 nd_out_the_secrete: "Секрет" #NT!
 nd_out_the_secrete_desc: "Фискальное бюро королевства крестоносцев, перешедшее от дивана Фатимидов до арабских регистров, мер и большинства клерков. Франки изменили название и почти ничего другого, потому что никто, кого они привезли из Европы, не знал, как оценить разлив Нила или дамасский караван." #NT!
 nd_out_grove_of_matariya: "Роща Матарии" #NT!
 nd_out_grove_of_matariya_desc: "Один обнесенный стеной сад к северу от Каира, орошаемый из единственного источника, производящий бальзам, необходимый как Латинской, так и Коптской церквям для миропомазания. Марино Сануто записал, что во время Крещения христиане и мусульмане вместе мылись у колодца, где, как говорят, Богородица стирала одежду ребенка. Там стояло Древо Богородицы, и латинские паломники изо всех сил старались увидеть его." #NT!
 nd_out_customs_of_the_narrow_sea: "Обычаи Узкого моря" #NT!
 nd_out_customs_of_the_narrow_sea_desc: "Тариф, взимаемый в Суэце, Кусейре и Воротах Слёз на торговлю, которую корона скорее защищает, чем владеет. Конвой платит, потому что сопровождение дороже пошлины." #NT!
 nd_out_convoy_of_the_karim: "Конвой Карима" #NT!
 nd_out_convoy_of_the_karim_desc: "Карим был конвоем, а не компанией: корабли, плывущие вместе в сезон, с эскортом. Эскорт короны теперь плывет вместе с перцовым флотом, и от его прибытия зависят доходы империи." #NT!
 nd_out_brocade_of_the_tiraz: "Парча Тираза" #NT!
 nd_out_brocade_of_the_tiraz_desc: "Золотая нить сквозь узорчатое плетение и требование суда оставить три города Дельты на своих станках. Группа до сих пор называет имя императора, и оно все еще на арабском языке." #NT!
 nd_out_cabinet_of_many_tongues: "Кабинет многих языков" #NT!
 nd_out_cabinet_of_many_tongues_desc: "Совет перестает быть латинским. Королевство, которое управляло на протяжении четырех столетий посредством раи, драгомана, кади и епископа, в конце концов усадило их за стол, потому что у него закончились аргументы в пользу того, почему они должны стоять за столом." #NT!
 nd_out_free_port_of_acre: "Свободный порт Акко" #NT!
 nd_out_free_port_of_acre_desc: "Акру объявили свободной от транзитной пошлины на том основании, что империя зарабатывает от перевозок больше, чем когда-либо получала от пошлин. Коммуны теряют ценность своего освобождения в тот же день, что не случайно." #NT!
 nd_out_markets_of_the_road: "Рынки дороги" #NT!
 nd_out_markets_of_the_road_desc: "Рынок продовольствия на каждой станции паломнического пути, заполненный круглый год. То, что было построено как религиозное обязательство, оказывается действующей цепочкой поставок через две пустыни, и армия, идущая по ней, никогда не голодает." #NT!
 nd_out_castles_redeemed: "Замки искуплены" #NT!
 nd_out_castles_redeemed_desc: "Крепость за крепостью, по ценам, указанным в приказах, корона выкупает замковые владения, которые она отдала четыре столетия назад. Братья остаются в качестве гарнизона, а ключи переходят из рук в руки." #NT!
 nd_out_capitation_abolished: "Подушный налог отменен" #NT!
 nd_out_capitation_abolished_desc: "Подушный налог на нелатинских подданных, старше крестового похода и унаследованный без смены колонки, исключается из списка. Это логический конец государства, построенного на защите веры других людей, и оно стоит больше, чем любая другая реформа, которую когда-либо проводила империя." #NT!
 nd_out_one_law_for_all: "Один закон для всех" #NT!
 nd_out_one_law_for_all_desc: "Шесть правовых систем сведены к одной юрисдикции, спустя шесть столетий после того, как Верховный суд впервые заявил сирийскому истцу, что не может его слушать." #NT!
 nd_out_the_outremerins: "Аутремерины" #NT!
 nd_out_the_outremerins_desc: "Outremer означает «за границей». Это имя дали люди во Франции, чтобы описать где-то еще. К настоящему времени здесь никто не приехал откуда-либо еще, в латыни, на которой здесь говорят, есть акцент, которого не узнает ни один парижанин, и это слово незаметно перестало означать «за границу» и стало означать «дом»." #NT!
 nd_out_agency_of_steam: "Агентство Steam" #NT!
 nd_out_agency_of_steam_desc: "Пар на Красном море. Конвой, длившийся сезон, идет две недели, ветер перестает управлять календарем, и старые дома Карими становятся агентством короны с графиком вместо сезона." #NT!
 nd_out_registry_of_the_fonde: "Реестр Фонда" #NT!
 nd_out_registry_of_the_fonde_desc: "Рыночный суд вместо памяти ведет реестр: контракты, веса, конвертацию монет и репутацию каждого свидетеля каждой веры, когда-либо присягнувшего перед ним." #NT!
  
 # === Units === 
 a_nd_out_maronite_crossbow: "Маронитские арбалетчики" #NT!
 a_nd_out_maronite_crossbow_desc: "Горные стрелки из Ливана над Триполи и Бейрутом стреляют из арбалета на итальянский манер. Смертельно опасны на склонах и хрупки, когда ломаются на открытом воздухе." #NT!
 a_nd_out_camel_train: "Верблюжий поезд" #NT!
 a_nd_out_camel_train_desc: "Подрядчики-бедуины и их животные, нанятые по договорной цене. Они пересекают пустыни, которые останавливают повозки, несут больше, чем они весят, и не будут сражаться за вас ни при каких обстоятельствах." #NT!
 n_nd_out_red_sea_galley: "Галера Красного моря" #NT!
 n_nd_out_red_sea_galley_desc: "Построенный из древесины, доставленной по суше, он меньше по размерам и легче оснащен артиллерийским вооружением, чем средиземноморский корпус. Он существует для того, чтобы закрыть Залив Акаба и Ворота Слёз, и у него это очень хорошо получается." #NT!
 a_nd_out_confraternity_militia: "Ополчение Братства" #NT!
 a_nd_out_confraternity_militia_desc: "Клятвенные братства портовых городов под своими знаменами и избранными констеблями. Они будут держать свои стены против чего угодно и всю дорогу жаловаться на любую другую войну." #NT!
 n_nd_out_pilgrim_galley: "Паломническая галера" #NT!
 n_nd_out_pilgrim_galley_desc: "Пассажирский корпус на Яффском маршруте: глубокие резервуары для воды, провизия на весь сезон, помещение для шестисот паломников и почти полное отсутствие оружия." #NT!
 n_nd_out_karim_escort: "Карим Эскорт" #NT!
 n_nd_out_karim_escort_desc: "Королевский эскорт перцового конвоя из Адена. Меньше орудий и меньший экипаж, чем у линейного корабля, потому что он должен нести воду для пути по Красному морю, а присутствие совершенно непропорционально его бортовому залпу." #NT!
  
 # === Levies === 
 levy_nd_out_maronite_crossbow: "Маронитский сбор" #NT!
 levy_nd_out_maronite_crossbow_desc: "Арбалетный набор жителей Ливанского нагорья, собранный из горных левантийских общин." #NT!
 levy_nd_out_confraternity: "Сбор Братства" #NT!
 levy_nd_out_confraternity_desc: "Вооруженные братства портовых городов, вызванные из своих залов собственными констеблями." #NT!
  
 # === Buildings === 
 nd_out_rais_house: "Дом Раиса" #NT!
 nd_out_rais_house_desc: "Дом старосты на окраине деревни: крыша получше, сад побольше, и единственная власть в этом месте, которую действительно признают жильцы. Сюда приходит королевский драгоман, чтобы рассказать, какой был урожай." #NT!
 nd_out_sanctuary_wardenship: "Надзор за Святилищем" #NT!
 nd_out_sanctuary_wardenship_desc: "Гауптвахта, стипендия и порядок у ворот чужого храма. Паломники проходят. Миссионеры этого не делают." #NT!
 nd_out_cour_de_la_fonde: "Суд Фонда" #NT!
 nd_out_cour_de_la_fonde_desc: "Рыночный суд, заседающий на скамье двух франкских присяжных и четырех сирийцев, рассматривает дела о весе, монетах и ​​контрактах между торговцами четырех религий, у которых нет другого общего трибунала." #NT!
 nd_out_hajj_station: "Станция Паломнической дороги" #NT!
 nd_out_hajj_station_desc: "Цистерна, обнесенная стеной ограда, небольшой гарнизон и продовольственный рынок в дневном переходе от предыдущего, которые содержатся за счет короны для путешественников, направляющихся к святыне, которую корона не почитает." #NT!
 nd_out_ayla_yard: "Двор в Айле" #NT!
 nd_out_ayla_yard_desc: "Каркасы и обшивка привозятся на верблюдах из Леванта и уходят в воду моря, где нет собственного леса. Каждый заложенный здесь киль — это логистический акт, прежде чем он станет актом судостроения." #NT!
 nd_out_karimi_house: "Дом Карими" #NT!
 nd_out_karimi_house_desc: "Торговый комплекс со складами, счетной комнатой, мечетью и цистерной, которым управляют семьи, чей кредит достигает Каликута. У ворот сидит королевский офицер с тарифом и списком эскорта." #NT!
 nd_out_tiraz_house: "Дом Тираза" #NT!
 nd_out_tiraz_house_desc: "Государственный ткацкий дом Дельты: лен, красильни и ткацкий станок, отведенный для ленты с надписью, на которой имя правителя написано письмом ткачей, которые его делают." #NT!
 nd_out_balsam_garden: "Бальзамический сад Матарии" #NT!
 nd_out_balsam_garden_desc: "Обнесенная стеной роща недалеко от Каира, орошаемая одним источником и постукивавшая железными лезвиями. Его бальзам вошел в миро двух церквей, а его колодец привлек на Крещение паломников трех конфессий." #NT!
  
 # === Production Methods === 
 nd_out_rais_maintenance: "Счет старосты" #NT!
 nd_out_rais_maintenance_desc: "Чернила, хлеб и масло для человека, который сообщает короне, что произвела деревня, и для писца, который это записывает." #NT!
 nd_out_wardenship_maintenance: "Стипендия смотрителя" #NT!
 nd_out_wardenship_maintenance_desc: "Ламповое масло, благовония для ритуала святилища и бумага, на которой пишутся отчеты смотрителя." #NT!
 nd_out_fonde_maintenance: "Скамейка Фонда" #NT!
 nd_out_fonde_maintenance_desc: "Регистры, мантии присяжных и масло для ламп, благодаря которым рыночный суд работает после наступления темноты." #NT!
 nd_out_fonde_registry: "Реестр Фонда" #NT!
 nd_out_fonde_registry_desc: "Тома в переплете, запечатанный экземпляр для каждой стороны и вино для свидетелей. Каждый контракт на рынке теперь существует дважды." #NT!
 nd_out_station_maintenance: "Цистерна станции" #NT!
 nd_out_station_maintenance_desc: "Зерно и скот для гарнизона и камень для цистерны — единственная причина, по которой следующий этап дороги можно пережить." #NT!
 nd_out_station_market: "Рынок станции" #NT!
 nd_out_station_market_desc: "Рынок с продовольствием у колодца: зерно, мясо, соль и ткань, продаваемые по объявленным ценам сотне тысяч путешественников в год." #NT!
 nd_out_ayla_maintenance: "Стапель Айла" #NT!
 nd_out_ayla_maintenance_desc: "Древесина привозится по суше, смола для швов и веревки из Леванта, потому что в радиусе ста лиг от этого берега не растет ничего, что плавает." #NT!
 nd_out_karimi_maintenance: "Счетная комната Карими" #NT!
 nd_out_karimi_maintenance_desc: "Перец, ароматические вещества и тюки ткани перемещаются по складу в зависимости от сезона." #NT!
 nd_out_karim_convoy: "Каримский конвой" #NT!
 nd_out_karim_convoy_desc: "Сезонный флот плывет вместе под эскортом: перец и гвоздика из Адена, ароматические вещества из Хадрамаута, а также снасти и смола, которые удерживают эскорт в море." #NT!
 nd_out_steam_agency: "Агентство Steam" #NT!
 nd_out_steam_agency_desc: "Угольные бункеры в Суэце, Кусайре и Адене, механический цех в каждом и печатное расписание сезона плавания." #NT!
 nd_out_balsam_maintenance: "Бальзамовое постукивание" #NT!
 nd_out_balsam_maintenance_desc: "Железные лезвия, ламповое масло и благовония, которые горит в часовне рощи. Сок собирают по капле между пиршествами." #NT!
 nd_out_tiraz_linen: "Тираз Лен" #NT!
 nd_out_tiraz_linen_desc: "Дельта-лен прялся тонким и окрашенным способом, а по краям была вплетена лента с именем правящего императора." #NT!
 nd_out_tiraz_brocade: "Тираз Парча" #NT!
 nd_out_tiraz_brocade_desc: "Фигурное переплетение золотой нитью через землю, предназначенное для двора, для посольств и для почетных одежд, которые корона дает своим кади." #NT!
  
 # === Destiny: advances === 
 nd_out_destiny: "Царство за рубежом" #NT!
 nd_out_destiny_desc: "Чиновники заканчивают первый общий обзор империи после крестового похода, и цифра внизу не изменилась: собственная церковь короны составляет меньшинство среди собственных подданных короны, и по условиям, на которых была провозглашена эта корона, так будет всегда. Что изменилось, так это то, что в королевстве стало тихо. Промолчите, и империя может начать спрашивать, для чего это нужно." #NT!
 nd_out_dest_assises_in_armenian: "Ассы на армянском языке" #NT!
 nd_out_dest_assises_in_armenian_desc: "В 1265 году Смбат Спарапет, констебль Киликийской Армении, перевел Антиохийские ассисы на армянский язык для суда, который не был ни франкским, ни латинским. Французский оригинал утерян, поэтому закон Франкской Антиохии сохранился только в этом переводе. Возьмите Сис и Тарсус, доведите развитие королевства до веса земли, на которой оно стоит, и договор обретет свою первую скамейку за пределами основавшего королевства: королевство со своими католикосами, своими баронами и собственным писаным законом, держащим всех троих под своей короной." #NT!
 nd_out_dest_six_scripts: "Пресс шести сценариев" #NT!
 nd_out_dest_six_scripts_desc: "Каждый закон, принятый этой империей, действителен в шести юрисдикциях и должен быть принят в каждой из них на языке, на котором она выступает. Используйте печатный станок, создайте казну и развивайтесь, чтобы платить за канцелярию, которая печатает на латыни, греческом, арабском, сирийском, иврите и армянском языке, и договор остановится в зависимости от того, насколько быстро писцы смогут переписывать. Постоянная цена — это то, что христианский мир делает с католическим императором, который лицензирует шрифт для чужих Священных Писаний." #NT!
 nd_out_dest_charter_of_the_nations: "Устав Наций" #NT!
 nd_out_dest_charter_of_the_nations_desc: "Окончательная форма договора: письменная хартия для каждой общины империи с указанием ее скамьи, квартала и культа, зарегистрированная в Ливре и подлежащая исполнению в суде. Возьмите Султанию, где в 1318 году было основано латинское архиепископство с номинальной провинцией, охватывающей всю Азию, примите просвещение и доведите развитие королевства и свое собственное положение до высоты, которую предполагает реестр. Сообществу, владеющему уставом, также может быть предоставлен квартал на его сохранение." #NT!
 nd_out_dest_crossing_at_aydhab: "Переправа в Айдабе" #NT!
 nd_out_dest_crossing_at_aydhab_desc: "В Айдабе не было ни воды, ни поля, ни причины для существования, кроме ветра. Египетские паломники спускались по Нилу в Кус, пересекали пустыню на верблюдах и садились на корабль в Джидду, а перец Карими возвращался обратно в тех же корпусах. Возьмите Айдаб и Суакин с сокровищницей позади себя, и оба берега моря паломничества ответят Иерусалиму: переправа будет сопровождаться, вода будет продаваться по назначенной цене, а процент от путешествия, который император может не совершить." #NT!
 nd_out_dest_customs_at_hormuz: "Таможня в Ормузе" #NT!
 nd_out_dest_customs_at_hormuz_desc: "Всегда была вторая дорога. Груз, не желающий Красного моря, идет через залив: от Ормуза до Басры, от Басры до Евфрата, от Алеппо и до моря, не минуя ни одной вашей таможни. Возьмите Ормуз и Маскат, у которых есть деньги на содержание там эскадры, и восточная торговля впервые со времен Рима будет осуществляться по единому тарифу. Постоянная цена — это полевая армия, которая всегда является вторым по счету ресурсом казны." #NT!
 nd_out_dest_pepper_and_bread: "Перец и хлеб" #NT!
 nd_out_dest_pepper_and_bread_desc: "Две половины опеки завершились вместе. Высадите свои предприятия на берег в Кожикоде, где растет перец, и в Диу, где грузятся флотилии паломников из Гуджарата, обеспечьте перемещение перца через свои собственные рынки и держите казну, чтобы платить за то и другое. В таком случае должность означает то, что она всегда имела в виду на самом деле: корона, которая кормит Мекку и Медину египетской пшеницей за свой счет, является хранителем святилищ, что бы ни говорил стиль." #NT!
  
 # === Destiny: events === 
 nd_out.7.t: "Царство за рубежом" #NT!
 nd_out.7.d: "Секретари проводят первый общий обзор империи со времен крестового похода. Двенадцать томов, шесть из них на арабском языке.\n\nЦифра внизу не изменилась. Менее двух из десяти ваших подданных слушают мессу на латыни. Ничего не было сделано со времени коронации, и это не изменилось, и согласно условиям, на которых была провозглашена эта корона, ничто законное не изменится.\n\nЧто изменилось, так это то, что в королевстве стало тихо. Не преобразованный и не запуганный: тихо, как тихо на рынке, когда все на нем ожидают, что ему заплатят. Эта тишина была куплена за счет стипендий смотрителей, гарнизонных цистерн, скамеек, на которых вы не сидите, и подушного налога, взимаемого в обмен на защиту, которую вы действительно обеспечиваете.\n\nКазначей спрашивает, для чего нужна империя. Это справедливый вопрос, и теперь вам предстоит на него ответить." #NT!
 nd_out.7.a: "Положите опросник на стол и начните" #NT!
 nd_out.8.t: "Ассы на армянском языке" #NT!
 nd_out.8.d: "Сис посылает своего констебля, а не своего короля, и он приходит с рукописью вместо договора.\n\nЭто Антиохийские ассисы, закон франкского княжества, переведенный на армянский язык Смбатом Спарапетом в 1265 году для суда, который не был ни франкским, ни латинским и просто попросил копию. Французский оригинал исчез: сожжен, утерян или никогда больше не копировался. На вашем столе лежит единственный сохранившийся текст этого закона, и он сохранился потому, что чужое королевство сочло его достойным записи.\n\nЕго предложение простое. Киликия подпадает под действие договора. Католикос сохраняет свою церковь, бароны сохраняют ассисы в том виде, в котором они их уже держат, а Ливр в Акре получает скамью, которую ей придется переписать, чтобы назвать ее.\n\nВаши собственные юристы без удовольствия отмечают, что империя вот-вот будет обучаться своим законам посредством перевода." #NT!
 nd_out.8.a: "Скопируйте Ливр еще раз и назовите скамейку в Сис." #NT!
 nd_out.9.t: "Пресс шести сценариев" #NT!
 nd_out.9.d: "Основатель отлил шрифт и разложил его на полу канцелярии: латинский, греческий, арабский, сирийский, иврит и армянский, шесть алфавитов в шести рамках, вырезанные здесь.\n\nАдминистративное дело не подлежит рассмотрению. Каждый закон, принимаемый этой империей, действителен в шести юрисдикциях и должен быть принят в каждой на том языке, на котором защищается ее коллегия. Писцам требуется год, чтобы не согласиться друг с другом. Пресса занимает две недели и не делает этого.\n\nОстальное латинское духовенство уже проработало. Тип, который может установить Ливр на иврите, может установить Талмуд на иврите. Тип, вырезанный для копии кади таможни, может установить Коран. Архиепископ Тирский письменно спрашивает, намерена ли корона печатать заблуждения неверных за государственный счет.\n\nОснователь ждет, чтобы ему сказали, сколько печатных станков нужно построить." #NT!
 nd_out.9.a: "Лицензирование печати для каждого сценария" #NT!
 nd_out.9.b: "Канцелярия сохраняет тип" #NT!
 nd_out.10.t: "Устав Наций" #NT!
 nd_out.10.d: "Реестр завершен. Четыреста одиннадцать общин: дворы кади Алеппо и Каира, шииты нижнего Евфрата, копты, якобиты, католикосы Церкви Востока в Багдаде, марониты горы, армяне Сиса, самаритяне Наблуса, мандеи болот, евреи девяти городов, друзы Хаврана, зайдиты высокогорье. У каждого есть скамейка, четверть и график того, что он должен.\n\nКанцелярия выписала уставы. Чего оно не может вынести, так это приговор, который они выносят.\n\nХартия, которой придерживается сообщество, — это право, и его можно оспорить против короны в собственном суде короны. Хартия, дарованная короной, — это одолжение, и ее можно отобрать. Слова на странице почти идентичны. Больше ничего об этой империи не будет." #NT!
 nd_out.10.a: "Они держат свои уставы. Пусть они умоляют их." #NT!
 nd_out.10.b: "Предоставляем чартеры. Мы сохраняем грант." #NT!
 nd_out.11.t: "Переправа в Айдабе" #NT!
 nd_out.11.d: "В Айдабе нет ни воды, ни поля, ни причины для существования, кроме ветра. Паломники спускаются по Нилу в Кус, пересекают восточную пустыню на наемных верблюдах и садятся сюда на корабль, следующий в Джидду, в корпусах, сшитых из кокосового волокна, под управлением людей, знающих рифы по памяти. Перец Карими возвращается на том же дне.\n\nИбн Джубайр переправился сюда в 1183 году и написал, что капитаны кораблей укладывали своих пассажиров как ящики, мотивируя это тем, что капитан несет ответственность за судно, а Бог несет ответственность за всех, кто на нем.\n\nОба берега теперь подчиняются Иерусалиму. Паломников подсчитывают, воду продают по объявленной цене, переправу плывут под конвоем, а католический император берет свою долю от путешествия, которое ему не разрешено совершать." #NT!
 nd_out.11.a: "Напишите цену воды и даты отплытия" #NT!
 nd_out.12.t: "Таможня в Ормузе" #NT!
 nd_out.12.d: "Всегда была вторая дорога. Груз из Малабара, который не хочет идти по Красному морю, идет через залив: из Ормуза в Басру, из Басры вверх по Евфрату и по суше в Алеппо, где он достигает Средиземного моря, не минуя ни одной вашей таможни. \n\nОрмуз пал, и Маскат вместе с ним. Впервые со времен Рима вся восточная торговля подчиняется единому тарифу, и он ваш.\n\nАдмирал хочет, чтобы доходы тратились там, где они были заработаны: корпуса, экипажи и эскадра постоянно оставались в проливе, потому что дорога закрывается только тогда, когда на ней кто-то сидит. Дома Карими хотят, чтобы таможня передавалась им за фиксированную сумму, уплаченную вперед, и отмечают, что они держат факторы в каждом порту на обеих дорогах, в то время как корона не держит клерков ни в одном из них." #NT!
 nd_out.12.a: "Удерживайте пролив флотом" #NT!
 nd_out.12.b: "Фармить таможню по домам" #NT!
 nd_out.13.t: "Перец и хлеб" #NT!
 nd_out.13.d: "Две книги приходят на одной неделе.\n\nПервая приходит из Кожикоде, где ваши факторы теперь держат дом, весы и отправляются за покупками. Перец на дереве стоит часть перца в Адене, и эта разница составляет самую большую цифру, которую когда-либо вводила эта империя.\n\nВторая — это счет зерна для Мекки и Медины. Ни один город не может прокормить себя и никогда не мог. Пшеница идет из Египта вниз по Нилу в Кус, через пустыню к морю и в Джидду на основе пожертвований, выплачиваемых из египетской казны в течение шести столетий при четырех династиях, а теперь и из вашей. Это ничего не зарабатывает. Именно поэтому стиль «Страж Двух Святилищ» что-то значит для людей, которых он называет.\n\nСезон короткий. Один флот отплывает первым." #NT!
 nd_out.13.a: "Факторы движутся в первую очередь. Купите у дерева." #NT!
 nd_out.13.b: "Зерно плывет первым. Накормите два города." #NT!
  
 # === Destiny: timed modifiers === 
 STATIC_MODIFIER_NAME_nd_out_dest_presses_licensed: "Лицензированные печатные машины" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_presses_licensed: "Шесть типографий с шестью шрифтами, лицензированные и облагаемые налогом, как и любая другая отрасль. Уставы доходят до каждой скамьи на том языке, на котором они защищаются, и в течение десятилетия одни и те же дома печатают псалтыри, буквари, комментарии и многое другое, о чем ни один епископ не просил. Архиепископ Тирский ведет его список и читает по нему." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_chancery_hand: "Рука канцелярии" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_chancery_hand: "Шрифт остается внутри дворца. Уставы, реестры, охранные грамоты и тарифные планы публикуются в королевской печатной машине на шести алфавитах, и ничего больше. Администрация никогда не была столь точной, а читающая публика ровно настолько велика, насколько того требует корона." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_communities_seated: "Сообщества сидят" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_communities_seated: "Хартии – это права. Судья каждой общины указывается в Ливре, и ее устав может быть оспорен против короны в собственном суде короны, что происходит на третий год и решение принимается против короны. Царство никогда еще не держалось лучше. Следовательно, ее войны никому конкретно не принадлежат." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_charters_revocable: "Чартеры к удовольствию Короны" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_charters_revocable: "Чартеры – это одолжение. Каждое сообщество сохраняет свой закон на основании гранта, который может быть отменен по усмотрению короны, а губернатор сидит рядом, чтобы изложить свою точку зрения, не делая этого вслух. Дела ведутся быстро и тихо, и каждая смена власти теперь является вопросом, а не формальностью." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_strait_held: "Пролив удержан" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_strait_held: "Эскадра на Ормузе, эскадра на Воротах Слёз, и между ними под конвоем плывут сезонные конвои. Ни один груз не достигает Средиземноморья по какой-либо дороге, которую империя не оценивает. Полевая армия узнает, что это второй вызов этой казны и что третьего не существует." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_customs_farmed: "Таможня, выращенная на таможне" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_customs_farmed: "Обычаи обоих морей сдаются в аренду тем домам, которые уже знают все детали маршрута, за фиксированную сумму, уплаченную заранее. Казначейство еще никогда не было таким ликвидным в столь начале года, и монеты двух океанов прибывают быстрее, чем рынки королевства могут их поглотить." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_factors_at_the_source: "Факторы в источнике" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_factors_at_the_source: "Дом, весы и постоянная цена под перцовыми деревьями, с собственными корпусами короны на берегу океана и верфью на каждом конце. Каждый моряк в империи находится в бегах, а сержанты-вербовщики дома разговаривают с пустой улицей." #NT!
 STATIC_MODIFIER_NAME_nd_out_dest_bread_of_the_two_cities: "Хлеб двух городов" #NT!
 STATIC_MODIFIER_DESC_nd_out_dest_bread_of_the_two_cities: "Зерновой флот каждый сезон отправляется первым за счет короны и без какой-либо отдачи. Мекка и Медина едят, и каждая держава от Магриба до Гуджарата, чьи подданные желают совершить путешествие, обнаруживает, что у нее есть дела с Иерусалимом." #NT!
  
 # === Destiny: buildings === 
 nd_out_dest_chartered_quarter: "Чартерный квартал" #NT!
 nd_out_dest_chartered_quarter_desc: "Обнесенный стеной комплекс внутри собственного порта короны с собственными воротами, печью, баней, цистерной, молитвенным домом и скамейкой, предоставленный сообществу по уставу и зарегистрированный в Ливре. Итальянцы купили своих флотами. Они выдаются." #NT!
 nd_out_dest_granary_of_two_cities: "Зернохранилище двух городов" #NT!
 nd_out_dest_granary_of_two_cities_desc: "Своды над площадками в Джидде и Янбу, где хранится египетская пшеница, которой кормят Мекку и Медину. Пожертвование было выплачено четырьмя династиями за шесть столетий, и ни одна из них так и не получила от него ни монеты, и именно поэтому эту должность стоило занять." #NT!
  
 # === Destiny: production methods === 
 nd_out_dest_quarter_maintenance: "Устав Квартала" #NT!
 nd_out_dest_quarter_maintenance_desc: "Регистры для скамейки, ткань для должностных лиц общины и масло для лампы у ворот, которая зажигается в часы общины, а не короны." #NT!
 nd_out_dest_granary_maintenance: "Счет Фонда" #NT!
 nd_out_dest_granary_maintenance_desc: "Пшеница и скот, купленные по египетской цене, а также снасти и парусина для кораблей, которые везут их по морю, не имея собственного урожая." #NT!
  
 # === Destiny: event option tooltips === 
 nd_out.7.a_tt: "В королевстве тихо, и в опросе говорится, почему. Теперь решите, для чего нужна тишина." #NT!
 nd_out.8.a_tt: "Киликия подчиняется договору, католикосам, баронам, ассисам и всем остальным." #NT!
 nd_out.9.a_tt: "Шесть лицензированных типографий и латинская церковь, которая читает каждый список того, что они печатают." #NT!
 nd_out.9.b_tt: "Корона печатает законы, и никто больше ничего не печатает." #NT!
 nd_out.10.a_tt: "Хартии — это права, которые можно оспорить против короны, а войны империи — ничьи." #NT!
 nd_out.10.b_tt: "Хартии — это одолжение, и каждая последующая смена вновь открывает этот вопрос." #NT!
 nd_out.11.a_tt: "Оба берега странствующего моря, переправа сопровождается, вода оценивается." #NT!
 nd_out.12.a_tt: "Эскадра в проливе и полевая армия сказали, что она идет второй." #NT!
 nd_out.12.b_tt: "Таможня сдала в аренду за наличные заранее и больше монет, чем могут принять рынки." #NT!
 nd_out.13.a_tt: "Перец, купленный у дерева, вместе со всеми моряками империи, бегущими по нему." #NT!
 nd_out.13.b_tt: "Оба города питаются за счет короны, и каждая держава пишет в Иерусалим." #NT!
  
 # ===== BUREAUCRACIES ===== 
 out_cour_des_suriens_bureaucracy: "Суд сирийцев" #NT!
 out_cour_des_suriens_bureaucracy_desc: "Франки судили по-своему, а всем остальным предоставили свою скамейку запасных. Cour des Syriens находился под опекой местных христиан; мусульмане сохраняли кади, евреи - бет-дин, и закон следовал за личностью, а не за землей: иудей клялся на Торе, самаритянин - на Пятикнижии, мусульманин - на Коране, христианин - на Евангелиях. Юристы Акры назвали эти подчиненные суды, когда они написали «Livre des Assises» между 1240 и 1244 годами. Корона, составляющая меньшинство среди своих подданных, управляет, гарантируя чужих судей, и цена — это юрисдикция, которой она никогда не будет обладать." #NT!
 out_cour_de_la_chaine_bureaucracy: "Цепной суд" #NT!
 out_cour_de_la_chaine_bureaucracy_desc: "Катена представляла собой цепь, закрывавшую гавань Акры и стоявшую рядом с ней таможню, а Кур де ла Шейн — суд, находившийся там. Баилли председательствовал от имени лорда в рассмотрении просьб моряков и грузоотправителей, не вынося их собственного решения, и тариф начислялся на каждый корпус, попадавший под цепь. Его процедура была установлена ​​в Акре между 1240 и 1244 годами, наряду с процедурой рыночного двора Фонда. Каждая итальянская коммуна в порту требовала освобождения от этого, и это весь аргумент Латинского Востока, заключенный в одном здании." #NT!
 out_charters_of_the_communes_bureaucracy: "Хартии коммун" #NT!
 out_charters_of_the_communes_bureaucracy_desc: "Вармундиский договор 1123 года предоставил Венеции треть Тира с собственной церковью, печью, баней, гирями, двором и виселицей, а Генуя и Пиза в течение следующего столетия заняли аналогичные помещения в Акре. Венеция требовала от каждого жителя своего квартала той же юрисдикции и налогообложения, которые король имел в отношении своих подданных; Болдуин II отказался признать их автономию, и, несмотря на это, договор действовал до 1291 года. Именно поэтому в королевстве вообще есть судоходство. В 1256 году двое из них вели войну Святого Саввы внутри столицы королевства, используя башни и осадные машины, в то время как корона наблюдала за происходящим из-за стены, которую она предоставила." #NT!
 out_turcopolier_bureaucracy: "Офис Туркопольера" #NT!
 out_turcopolier_bureaucracy_desc: "Туркополы представляли собой легкую кавалерию и конных лучников, воспитанных на Востоке из сирийских, греческих и армянских христиан, а также из пришедших турок, а византийские туркополы, ехавшие с Татикием во время Первого крестового похода, послужили образцом для франков. У них был собственный командир, Туркопольер, который превосходил по званию полевых сержантов, и и Храм, и Госпиталь сохраняли эту должность среди своих высших сановников. Они дали франкской армии единственное, чего не могли сделать ее рыцари, — это ездить налегке и далеко. Саладин приказал казнить пленных после Хаттина в 1187 году как отступников, и латинское духовенство королевства никогда не переставало соглашаться с ним." #NT!
 out_new_towns_bureaucracy: "Новые города" #NT!
 out_new_towns_bureaucracy_desc: "Магна Махумерия, ныне аль-Бира, стояла в шестнадцати километрах к северу от Иерусалима и была посажена канониками Гроба Господня на одной из двадцати одной казалии, пожалованной им Годфри Бульонским. В 1156 году здесь присягнули девяносто два горожанина, а в последующие тридцать лет — еще пятьдесят, переселенцы из южной Франции, Италии и Испании, владевшие грабительским владением за десятину и долю урожая, среди них были три кузнеца, три плотника, каменщик, сапожник и ювелир. Парва Махумерия и Бетгибелин были одним и тем же инструментом. Это единственный законный способ, которым эта корона может изменить арифметику своего собственного королевства: привлечь людей, а не обратить людей, уже находящихся там." #NT!
 out_restor_of_the_host_bureaucracy: "Восстановитель Хозяина" #NT!
 out_restor_of_the_host_bureaucracy_desc: "В Иерусалимском королевстве корона должна была рыцарю свежую лошадь за одну убитую или искалеченную на ее службе, обязательство, называемое реставратором, а захваченные арабские лошади были добычей короны и через нее перераспределялись между рыцарями и туркополами, потерявшими своих скакунов. У Европы не было эквивалента, потому что Европа могла выращивать своих собственных боевых коней, а Латинский Восток не мог, поэтому реставратор был разницей между войском, которое могло пережить избиение, и войском, которое просто погибло. Констебльский суд удовлетворил иски. Его задолженность была постоянной жалобой баронов на протяжении двух столетий." #NT!
  
 # Tooltip for the New Towns prerequisite (formation settlement three) 
 out_new_towns_path_c_tt: "Коронация основала новые города на иерусалимской дороге." #NT!
  
 # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_out_bureaucracy_authority: "Аппарат за рубежом" #NT!
 AUTO_MODIFIER_DESC_nd_out_bureaucracy_authority: "Латинская корона над большинством, которое она не может преобразовать, управляет через должности, которые она не изобрела, суды, которыми она не владеет, и помещения, которые она предоставила. Помимо постоянного места в столице, Утремер может содержать еще два учреждения по своему выбору, помимо местных скамей, портового суда, уставов коммун, командования Туркопольера, основанных новых городов и постоянного долга короны в лошадях." #NT!
