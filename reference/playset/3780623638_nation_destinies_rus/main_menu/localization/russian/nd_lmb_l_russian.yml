l_russian:
  ### Variable tooltips 
 nd_lmb_formed_tt: "была образована Ломбардия." #NT!
 nd_lmb_e1_done_tt: "Коронация Ломбардии уже состоялась" #NT!
 nd_lmb_path_a_tt: "Выберите судьбу #bold Железной Короны#!." #NT!
 nd_lmb_path_b_tt: "Выберите судьбу #bold Амброзианской Коммуны#!." #NT!
  
  ### Formation event 
 nd_lmb.1.t: "Королевство Лангобардов" #NT!
 nd_lmb.1.d: "В базилике в Монце из сокровищницы Теодолинды извлекается Корона Ферреа: лента из золота и драгоценных камней, замкнутая, как клянутся каноники, вокруг гвоздя Истинного Креста. Со времен лангобардских королей тот, кто правил Италией, преклонял колени ради этой короны в Павии или Монце; Его носил Фредерик Барбаросса, и он все равно сломался в матче с Карроччо в Леньяно. Теперь города равнины снова подчиняются одному лорду, от оружейных складов Милана до рисовых вод Ломеллины.\n\nНо за это королевство борются два воспоминания. Висконти построили государство над коммунами: канцелярию, замок и корону, герцогство, которое обращалось с королями как с равными. И против этого выступает старая клятва: Понтида, Лига, коммуна Сант-Амброджо, которая управляла Миланом в течение трех лет без герцога и называла себя золотой. Железная корона или республика святых и граждан: regnum должен выбрать, что это такое.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_lmb.1.a: "Железная Корона" #NT!
 nd_lmb.1.a_tt: "Дорога Висконти. Королевская легитимность, власть короны над коммунами, дисциплинированная герцогская армия и династическое положение за границей. Царство централизуется." #NT!
 nd_lmb.1.b: "Амброзианская коммуна" #NT!
 nd_lmb.1.b_tt: "Дорога Лиги. Гражданское налогообложение, коммунальные сборы, довольные горожане и строительная энергия свободных городов. Горожане восстают." #NT!
  
  ### Peace of Lodi event 
 nd_lmb.2.t: "Мир Лоди" #NT!
 nd_lmb.2.d: "В апреле 1454 года в небольшом лангобардском городке Лоди измученные послы скрепили печати мира, положившего конец десятилетиям войны между Миланом и Венецией. За несколько месяцев она превратилась в Итальянскую лигу: Милан, Венеция, Флоренция, Папа Римский и Неаполь обязаны были поддерживать баланс полуострова, — первую подобную систему, которую видела Европа. Сорок лет держался мир в Лоди, и в его тени полуостров стал богатым и блестящим. Вопрос, который сейчас обсуждает каждая канцелярия, заключается в том, для чего нужен баланс: является ли равновесие самим достижением или просто спокойствием, в котором благоразумное государство точит свой меч?" #NT!
 nd_lmb.2.a: "Поддерживайте Курсивную Лигу" #NT!
 nd_lmb.2.a_tt: "Баланс – это приз. Теплые отношения, усталость от войны уходит, а платные дороги равнины заняты мирной торговлей." #NT!
 nd_lmb.2.b: "Вооруженный мир" #NT!
 nd_lmb.2.b_tt: "Мир – это подготовка. Более дешевые армии, более быстрый набор и тихие глаза в каждой конкурирующей канцелярии." #NT!
  
  ### Monte di Pieta event 
 nd_lmb.3.t: "Монте ди Пьета" #NT!
 nd_lmb.3.d: "Слово «ломбард» означало ростовщика от лондонской Ломбард-стрит до ломбардов Брюгге: в течение двух столетий банкиры Милана, Асти и Кьери несли ломбардный кредит по всей Европе, и их за это стали ненавидеть. Теперь францисканские проповедники поднимают с кафедры соперника: Монте ди Пьета, благотворительный банк, финансируемый верующими, ссужающий небольшие суммы под залог под небольшой процент или вообще без него, так что бедному ремесленнику не нужно продавать свои инструменты ростовщику. Миланский Монте открывается в 1483 году проповедями монахов и холодной яростью банкиров. Корона должна решить, к какому учреждению принадлежит этот возраст." #NT!
 nd_lmb.3.a: "Пожертвовать Монте" #NT!
 nd_lmb.3.a_tt: "Монахский банк для бедных. Преданность Амвросианской церкви, более спокойные улицы и семьи, которые больше не продают колыбель, чтобы расплатиться с кредитором." #NT!
 nd_lmb.3.b: "Защитите банковские дома" #NT!
 nd_lmb.3.b_tt: "Ломбардный кредит сделал название этого королевства. Более дешевые займы для короны, более богатая торговля и торговцы, которые торгуются, исходя из силы." #NT!
  
  ### Leonardo at the locks event 
 nd_lmb.4.t: "Инженер на шлюзах" #NT!
 nd_lmb.4.d: "Флорентийский инженер на герцогской службе идет по тропинке Мартесаны с альбомом для рисования в руке. Бертола да Новате отрезал этот канал от Адды за семь лет; Навильо Гранде орошает равнину уже два столетия; а там, где две системы встречаются, уровни отказываются согласовываться. Инженер предлагает повесить ворота парами, образуя неглубокую букву V против течения, чтобы сама вода запечатывала их: угловой замок, нарисованный в его блокноте рядом с осадными машинами, бомбардами и бронзовой лошадью для герцога. Одна и та же рука предлагает государственное владение водой или военное мастерство, и канцелярия должна назначить ему поручение." #NT!
 nd_lmb.4.a: "Отправьте его в воду" #NT!
 nd_lmb.4.a_tt: "Шлюзы, бассейны и бечевники. По всему королевству строится быстрее и дешевле, и равнина становится богаче с каждым годом." #NT!
 nd_lmb.4.b: "Подключите его к двигателям войны" #NT!
 nd_lmb.4.b_tt: "Бастионы обследованы и подвергнуты бомбардировкам. Осада усилилась, и артиллерия работала лучше." #NT!
  
  ### San Carlo plague event 
 nd_lmb.5.t: "Пастырь Чумы" #NT!
 nd_lmb.5.d: "В 1576 году чума проникает в Милан, и губернатор и знатные семьи бегут. Архиепископ остается. Карло Борромео опустошает свой дом, чтобы накормить находящихся на карантине, организует приходы в механизм оказания помощи и ходит босиком по умирающему городу с реликвией Святого гвоздя, с веревкой на шее, как приговоренный, предлагая себя за свой народ. Лазаретто наполняется, постановления действуют, и Милан узнает, что государство может бороться с эпидемией, а не просто терпеть ее. Они назовут ее чумой Сан-Карло, как если бы ее пастырь победил саму болезнь." #NT!
 nd_lmb.5.a: "Пастух остается со стадом" #NT!
 nd_lmb.5.a_tt: "Восстановление, организованное приход за приходом, люди, доверяющие своей церкви, и более устойчивое правительство в период кризиса." #NT!
  
  ### Stradivari event 
 nd_lmb.6.t: "Мастерские Кремоны" #NT!
 nd_lmb.6.d: "На нескольких улицах Кремоны, под звуки молотков друг друга, мастерские Амати, Гварнери и Страдивари совершенствуют инструмент. Ель из альпийских долин, клен и лак, о секрете которого будут спорить веками: из них боттега, состоящая из дюжины рук, производит скрипки, за владение которыми суды от Мадрида до Вены спорят друг с другом. Ни один трон не требовал такого превосходства; он вырос из города мастеров на Ломбардской равнине, и хотя мастерские процветают, имя Кремоны достойно посольства." #NT!
 nd_lmb.6.a: "Пусть мастерские поют" #NT!
 nd_lmb.6.a_tt: "Культурные традиции накапливаются быстрее, а имя Кремоны приобретает престиж за рубежом." #NT!
  
  ### Censimento event 
 nd_lmb.7.t: "Перепись завершена" #NT!
 nd_lmb.7.d: "Начавшееся в 1718 году и законченное, наконец, в 1760 году под руководством Помпео Нери, censimento измерило каждое поле, фруктовый сад и ряд тутовых деревьев в Ломбардии: десятки тысяч карт, каждый участок оценен, каждый владелец внесен в реестры. Ни одно государство в Европе не знает так точно свою землю. Последствия являются совершенно революционными: если реестр является единственной мерой, то дворец платит по тем же правилам, что и ферма, и патрицианским льготам, которые опустошали казну в течение двух столетий, не на чем спрятаться. Великие семьи прекрасно это понимают, поэтому они уже у дверей министра." #NT!
 nd_lmb.7.a: "Одна мера для дворца и фермы" #NT!
 nd_lmb.7.a_tt: "Публикуйте регистры и облагайте налогом только по ним. Казначейство наполняется, сельская местность управляется фактами, а государство опирается на перепись, а не на привилегии." #NT!
 nd_lmb.7.b: "Разместить патриция" #NT!
 nd_lmb.7.b_tt: "Реформируйте мягко. Великие дома сохраняют свое достоинство, корона сохраняет свою верность, а королевство сохраняет свое положение среди дворов Европы." #NT!
  
  ### Il Caffe event 
 nd_lmb.8.t: "Иль Кафе" #NT!
 nd_lmb.8.d: "В Милане братья Пьетро и Алессандро Верри собирают экономистов, юристов и острословов вокруг журнала, названного в честь кофейни, где живут такие аргументы: Il Caffe. Из этого круга в 1764 году выходит небольшая книга молодого Чезаре Беккариа «Dei delitti e delle pene», в которой с ужасающим спокойствием доказывается, что пытки ничего не доказывают и что виселица унижает закон, который ее повышает. В течение одного поколения его цитируют в Петербурге, Филадельфии и Париже; И императрицы, и республики одинаково перепишут свои кодексы против него. Журнальный столик Lombard стал трибуналом по уголовному праву Европы." #NT!
 nd_lmb.8.a: "Распечатайте каждую его страницу" #NT!
 nd_lmb.8.a_tt: "Исследования ускоряются, а реформирующаяся пресса питает культурные традиции королевства." #NT!
  
  ### Voltaic pile event 
 nd_lmb.9.t: "Вольтова свая" #NT!
 nd_lmb.9.d: "В кабинете физики в Павии Алессандро Вольта укладывает медные и цинковые диски между тканью, пропитанной рассолом, и замыкает цепь: постоянный электрический ток, первый в мире, который видел, извлекается из груды металла на столе. Университет, который восстановили Мария Терезия и Иосиф II, отплатил им новой силой природы. Вольта продемонстрирует эту груду самому Наполеону, и единица каждого течения, которое когда-либо будет течь, будет носить ломбардское имя." #NT!
 nd_lmb.9.a: "Новая сила природы" #NT!
 nd_lmb.9.a_tt: "Исследования ускоряются, институты распространяются быстрее, а слава Павии приносит престиж." #NT!
  
  ### Timed modifiers: formation 
 STATIC_MODIFIER_NAME_nd_lmb_corona_del_regno: "Железная Корона" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_corona_del_regno: "Корона Ферреа была построена в духе Висконти: коронованное государство над коммунами, с канцелярией, замком и постоянной армией." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_comune_ambrosiano: "Амброзианская коммуна" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_comune_ambrosiano: "Клятва Понтиды возобновлена: города равнины управляются под руководством святого Амвросия, и их ополчения, кошельки и строительные площадки с радостью отвечают этому." #NT!
  
  ### Timed modifiers: advance events 
 STATIC_MODIFIER_NAME_nd_lmb_equilibrio_italiano: "Итальянское равновесие" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_equilibrio_italiano: "Итальянская лига поддержана: баланс Лоди сохраняет мир на полуострове и его дороги заняты." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_pace_armata: "Вооруженный мир" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_pace_armata: "Тихие годы, которые Лоди провел, оттачивая меч: дешевые армии, быстрые сборы, бдительные шпионы." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_carita_francescana: "Францисканская благотворительность" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_carita_francescana: "Монте-ди-Пьета даровал: кредит бедным, мир на улицах и монахов, проповедующих благодарность." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_piazza_dei_banchi: "Площадь Банков" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_piazza_dei_banchi: "Банковские дома Ломбардии защищали: дешевый кредит для короны и торговцев, которые дают взаймы половине Европы." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_acque_e_conche: "Воды и шлюзы" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_acque_e_conche: "Инженер приступил к каналам: косые шлюзы, ровные бассейны и равнина, которая строится и растет." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_ingegneria_militare: "Военная инженерия" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_ingegneria_militare: "Инженер приступил к войне: обследовал бастионы, провел бомбардировки, методично провел осаду." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_pastore_della_peste: "Пастырь Чумы" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_pastore_della_peste: "Архиепископ остался, когда губернатор бежал: помощь организовывалась приход за приходом, и люди доверяли своей церкви." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_eta_doro_liutaria: "Золотой век Лютерии" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_eta_doro_liutaria: "Мастерские Кремоны в расцвете сил: каждый двор Европы претендует на ломбардскую скрипку." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_catasto_giusto: "Справедливый кадастр" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_catasto_giusto: "Реестры опубликованы и приведены в исполнение: одна мера для дворца и фермы и казначейство, основанное на фактах." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_patto_coi_patrizi: "Пакт с Патрициатом" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_patto_coi_patrizi: "Перепись смягчилась для знатных домов: их достоинство было сохранено, их лояльность обеспечена, авторитет двора укрепился." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_lumi_lombardi: "Ломбардские огни" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_lumi_lombardi: "Il Caffe в каждой умелой руке: реформирующая миланская пресса спорит, а Европа слушает." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_pila_di_volta: "Вольтова свая" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_pila_di_volta: "Устойчивый ток из груды металлических дисков: лаборатория Павии придала эпохе новую силу." #NT!
  
  ### Advances: age 1 
 nd_lmb_lega_lombarda: "Ломбардская лига" #NT!
 nd_lmb_lega_lombarda_desc: "В Понтиде коммуны принесли присягу, а в Леньяно в 1176 году их ополчения вокруг Карроччо разбили армию Фридриха Барбароссы. Констанцский мир закрепил свободы лангобардских городов." #NT!
 nd_lmb_corona_ferrea: "Железная Корона" #NT!
 nd_lmb_corona_ferrea_desc: "Корона Ферреа в Монце, золото, заключенное вокруг того, что по традиции считается гвоздем Истинного Креста. От королей Ломбардии до Карла V и Наполеона, кто бы ни правил Италией, стремился к этой короне." #NT!
 nd_lmb_rito_ambrosiano: "Амвросианский обряд" #NT!
 nd_lmb_rito_ambrosiano_desc: "В Милане проводится литургия святого Амвросия: свое пение, свой календарь, свой карнавал, который заканчивается на несколько дней позже всех остальных. Папы пытались романизировать его, но потерпели неудачу; обряд – город." #NT!
 nd_lmb_marcite: "Марсит" #NT!
 nd_lmb_marcite_desc: "Цистерцианцы Кьяравалле научились заливать луга движущейся пленкой весенней воды, так что трава становилась зеленой даже в зимние морозы. Кормление скота круглый год: основа молочного богатства Ломбардии." #NT!
 nd_lmb_armaioli_milanesi: "Миланские оружейники" #NT!
 nd_lmb_armaioli_milanesi_desc: "Вокруг Виа дельи Спадари гильдии оружейников Милана ковали ломбардское железо для изготовления сбруи для половины Европы. Из этих мастерских выросла династия Миссалья." #NT!
 nd_lmb_maestri_comacini: "Мастера Комасин" #NT!
 nd_lmb_maestri_comacini_desc: "Странствующие мастера-строители озер Комо, со времен Ломбардии организованные в домики, возводили церкви, башни и стены по всей Италии и за ее пределами. Строить из камня было экспортным товаром Ломбардии." #NT!
  
  ### Advances: age 2 
 nd_lmb_armature_da_missaglia: "Ремень Миссалья" #NT!
 nd_lmb_armature_da_missaglia_desc: "Томмазо и Антонио Миссалья сделали белые доспехи Милана лучшими в Европе, экспортированные из Испании во Фландрию. Воин в миланских доспехах не боялся ни копья, ни болта." #NT!
 nd_lmb_oratori_residenti: "Постоянные послы" #NT!
 nd_lmb_oratori_residenti_desc: "Канцелярия Франческо Сфорца содержала постоянных посланников при дружественных дворах, первых постоянных посольств в Европе. Милан узнал обо всех планах в Италии еще до того, как интриганы закончили ужин." #NT!
 nd_lmb_ca_granda: "Ка'Гранда" #NT!
 nd_lmb_ca_granda_desc: "В 1456 году Франческо Сфорца основал Больницу Маджоре, объединив разбросанные миланские хосписы в один большой дом ухода по рациональному плану Филарете: гражданская медицина в масштабе, которого Европа не видела." #NT!
 nd_lmb_castello_di_porta_giovia: "Замок в Порта Джовиа" #NT!
 nd_lmb_castello_di_porta_giovia_desc: "Висконти воздвигли цитадель в Порта Джовиа, а Сфорца восстановили ее величественнее после того, как республика снесла ее: герцогская власть в камне была направлена ​​как на Милан, так и на врагов Милана." #NT!
 nd_lmb_banchi_lombardi: "Ломбардные банки" #NT!
 nd_lmb_banchi_lombardi_desc: "От лондонской Ломбард-стрит до ярмарок Шампани слово «Ломбард» означало кредитор. Внутри страны францисканцы ответили на ростовщичество созданием благотворительного банка Монте ди Пьета, созданного в 1483 году." #NT!
  
  ### Advances: age 3 
 nd_lmb_navigli: "Навильи" #NT!
 nd_lmb_navigli_desc: "«Навильо Гранде» достиг Милана в 1272 году; Бертола да Новате за семь лет отделил Мартесану от Адды; Угловые замки Леонардо соединились с уровнями. Ни один город в Европе не располагал такими водами." #NT!
 nd_lmb_risaie: "Рисовые поместья" #NT!
 nd_lmb_risaie_desc: "При Сфорце рис прижился на затопленных полях Ломеллины и распространился по каналам. Низкая равнина стала чашей риса Европы, а рисайя – ее фирменным ландшафтом." #NT!
 nd_lmb_pace_di_lodi: "Мир Лоди" #NT!
 nd_lmb_pace_di_lodi_desc: "В 1454 году в лангобардском городе Милан и Венеция завершили свои войны, и родилась Итальянская лига: сорок лет баланса, первая система равновесия в европейской дипломатии." #NT!
 nd_lmb_archibugiari_bresciani: "Брешианские оружейники" #NT!
 nd_lmb_archibugiari_bresciani_desc: "В Гардоне-Валь-Тромпиа кузницы превращали долинное железо в ружейные стволы; Мастерская Бартоломео Беретты уже отливала их в 1526 году. Брешианские бочки вооружили Венецию и половину Средиземноморья." #NT!
 nd_lmb_cartiere_del_garda: "Бумажная долина Гарды" #NT!
 nd_lmb_cartiere_del_garda_desc: "Вдоль ущелья Тосколано шестьдесят водяных мельниц перемалывают льняные тряпки в бумагу. Долина бумажных фабрик снабжала прессы Венеции, а ее купцы продавали ломбардскую бумагу по всей Европе." #NT!
  
  ### Advances: age 4 
 nd_lmb_riforma_borromaica: "Реформа Борромео" #NT!
 nd_lmb_riforma_borromaica_desc: "Карло Борромео сделал Милан рабочей моделью Контрреформации: семинария 1564 года, одна из первых в Европе, синоды, посещения и духовенство, которое наконец могло читать то, что проповедовало." #NT!
 nd_lmb_biblioteca_ambrosiana: "Библиотека Амброзиана" #NT!
 nd_lmb_biblioteca_ambrosiana_desc: "Федерико Борромео открыл свою библиотеку в 1609 году для любого читателя, который мог ею воспользоваться, а агенты покупали рукописи от Греции до Леванта: одну из первых публичных библиотек в Европе." #NT!
 nd_lmb_armeria_deuropa: "Оружейная палата Европы" #NT!
 nd_lmb_armeria_deuropa_desc: "От итальянских войн до Тридцатилетней войны миланские и брешийские мастерские вооружали армии королей. Тот, кто владел Ломбардией, владел арсеналом юга." #NT!
 nd_lmb_sanita_di_stato: "Санитария государства" #NT!
 nd_lmb_sanita_di_stato_desc: "Лаццаретто 1488 года, санитарные паспорта, постановления о чуме 1576 и 1630 годов: Милан построил общественный механизм борьбы с эпидемией, с которым могли сравниться лишь немногие государства." #NT!
  
  ### Advances: age 5 
 nd_lmb_liutai_di_cremona: "Мастера Кремоны" #NT!
 nd_lmb_liutai_di_cremona_desc: "Амати преподавал Гварнери и Страдивари, а несколько улиц Кремоны задавали звучание европейской музыки. С тех пор ни один инструмент не избежал сравнения с их инструментами." #NT!
 nd_lmb_censimento_teresiano: "Терезианское сенсименто" #NT!
 nd_lmb_censimento_teresiano_desc: "Ломбардский кадастр, начатый в 1718 году и завершенный в 1760 году при Помпео Нери, измерял и оценивал каждый участок земли в государстве: самое точное обследование в Европе и конец налогообложения по привилегиям." #NT!
 nd_lmb_vigneti_di_valtellina: "Террасы Вальтеллина" #NT!
 nd_lmb_vigneti_di_valtellina_desc: "На каменных террасах над Аддой горные виноградники производили вино, которое через перевалы попадало на столы Швейцарии и Австрии: альпийская торговля королевства, не имеющего выхода к морю." #NT!
 nd_lmb_ville_di_delizia: "Вилле ди Делиция" #NT!
 nd_lmb_ville_di_delizia_desc: "Миланский патрициат построил свои увеселительные виллы на озерах и в сельской местности: виллу д'Эсте в Черноббио и сотню родственников, великолепие которых укоренилось в почве поместий." #NT!
  
  ### Advances: age 6 
 nd_lmb_illuminismo_lombardo: "Ломбардское Просвещение" #NT!
 nd_lmb_illuminismo_lombardo_desc: "Журнал братьев Верри «Il Caffe» и «Dei delitti e delle pene» Беккариа сделали Милан столицей реформ. Европа переписала свои уголовные кодексы вопреки аргументам Ломбардии." #NT!
 nd_lmb_ateneo_di_pavia: "Атенео Павии" #NT!
 nd_lmb_ateneo_di_pavia_desc: "Основанный в 1361 году и возрожденный при Марии Терезии и Иосифе II, Университет Павии размещал эксперименты Спалланцани и лабораторию Вольты: научную машину Ломбардии." #NT!
 nd_lmb_orto_deuropa: "Сад Европы" #NT!
 nd_lmb_orto_deuropa_desc: "Путешественники сошлись во мнении, что ни одна сельскохозяйственная земля в мире не сравнится с орошаемой Ломбардской равниной: вода, рис, пшеница и пастбища переплетаются в едином ландшафте." #NT!
 nd_lmb_regno_ditalia: "Королевство Италия" #NT!
 nd_lmb_regno_ditalia_desc: "В Миланском соборе в 1805 году Наполеон возложил на свою голову Железную корону: «Бог дал ее мне, горе тому, кто прикоснется к ней». Милан снова стал столицей Королевства Италия." #NT!
  
  ### Units 
 a_nd_lmb_compagnia_della_morte: "Компания Смерти" #NT!
 a_nd_lmb_compagnia_della_morte_desc: "Присягнувшая стража Карроччо в традициях Ломбардской лиги: рота Карроччо и рыцарей смерти из хроник, городское ополчение, обязанное никогда не отступать от знамени." #NT!
 a_nd_lmb_uomini_darme: "Уомини д'Арме" #NT!
 a_nd_lmb_uomini_darme_desc: "Герцогские воины в полной сбруе Миссальи, лучших доспехах в Европе. Великолепно защищен и, соответственно, медленный и дорогостоящий в эксплуатации." #NT!
 a_nd_lmb_guardia_reale: "Королевская итальянская гвардия" #NT!
 a_nd_lmb_guardia_reale_desc: "Гвардейские полки Королевства Италия, сформированные в Милане после коронации Железной Короны в 1805 году: элитная ударная пехота, действующая там, где огонь сильнее всего." #NT!
  
  ### Levies 
 levy_nd_lmb_compagnia_della_morte: "Компания Смертельного Леви" #NT!
 levy_nd_lmb_compagnia_della_morte_desc: "Коммуны поднимают присяжную охрану Карроччо из своих солдат и горожан." #NT!
  
  ### Buildings 
 nd_lmb_tesoro_della_corona: "Сокровищница Железной Короны" #NT!
 nd_lmb_tesoro_della_corona_desc: "Часовня-сокровищница собора Монцы, где в базилике Теодолинды хранится Корона Ферреа. Им короновались короли Италии от лангобардов до Наполеона." #NT!
 nd_lmb_marcita: "Марсита" #NT!
 nd_lmb_marcita_desc: "Цистерцианский заливной луг: родниковая вода продолжала течь по траве, поэтому она росла всю зиму, кормя скот круглый год." #NT!
 nd_lmb_armeria: "Армерия" #NT!
 nd_lmb_armeria_desc: "Квартал оружейников на миланский манер, где куют ломбардское железо для изготовления доспехов на экспорт. Мастерские Миссальи вооружили половину Европы с таких улиц." #NT!
 nd_lmb_ospedale_maggiore: "Больница Маджоре" #NT!
 nd_lmb_ospedale_maggiore_desc: "Ка'Гранда: одна большая гражданская больница вместо разрозненных хосписов, построенная по образцу Франческо Сфорца и Филарета в Милане в 1456 году." #NT!
 nd_lmb_castello_visconteo: "Кастелло ди Порта Джовиа" #NT!
 nd_lmb_castello_visconteo_desc: "Герцогская цитадель в стиле Висконти-Сфорца: гарнизон, арсенал и кулак герцога над городом, в котором она находится." #NT!
 nd_lmb_monte_di_pieta: "Монте ди Пьета" #NT!
 nd_lmb_monte_di_pieta_desc: "Францисканский благотворительный ломбард: небольшие ссуды под залог под небольшой процент или вообще без него, чтобы беднякам не приходилось обращаться к ростовщику." #NT!
 nd_lmb_naviglio: "Навильо" #NT!
 nd_lmb_naviglio_desc: "Судоходный канал со шлюзами и тропами в ломбардском стиле, по которому перевозится зерно, мрамор и торговля, а также орошаются поля, мимо которых он проходит." #NT!
 nd_lmb_risaia: "Рисайя" #NT!
 nd_lmb_risaia_desc: "Затопленное рисовое поместье на низкой равнине, питаемое ирригационной сетью, по которой рис из Ломеллины распространялся по всей Ломбардии." #NT!
 nd_lmb_cartiera: "Картьера" #NT!
 nd_lmb_cartiera_desc: "Бумажная фабрика с водяным приводом по образцу Тосколано, перерабатывающая льняные тряпки в тряпичную бумагу, которая питала печатные станки Италии." #NT!
 nd_lmb_seminario: "семинар" #NT!
 nd_lmb_seminario_desc: "Тридентская семинария по образцу Борромео: епархия обучает собственное духовенство, а кафедра наконец-то знает свои буквы." #NT!
 nd_lmb_ambrosiana: "Амброзиана" #NT!
 nd_lmb_ambrosiana_desc: "Публичная библиотека с собственной коллегией врачей по образцу, созданному Федерико Борромео в 1609 году: открытая для любого читателя, который может ею воспользоваться." #NT!
 nd_lmb_lazzaretto: "Лаццаретто" #NT!
 nd_lmb_lazzaretto_desc: "Карантинная больница за стенами, с медицинскими пропусками и постановлениями о чуме: санитарное оборудование, испытанное Миланом в 1576 и 1630 годах." #NT!
 nd_lmb_bottega_liutaia: "Боттега Лютайя" #NT!
 nd_lmb_bottega_liutaia_desc: "Мастерская в кремонских традициях: альпийская ель, клен и ревностно охраняемый лак, проданные судам по всей Европе." #NT!
 nd_lmb_villa_di_delizia: "Вилла ди Делиция" #NT!
 nd_lmb_villa_di_delizia_desc: "Аристократическая вилла для удовольствия на озере или среди поместий: сады, галереи и присутствие хозяина, укоренившегося в сельской местности." #NT!
 nd_lmb_gabinetto_di_fisica: "Габинетто ди Физика" #NT!
 nd_lmb_gabinetto_di_fisica_desc: "Университетский физический кабинет в стиле Павии: инструменты, демонстрации и лаборатория, куда Вольта сложил свою стопку." #NT!
  
  ### Production methods 
 nd_lmb_custodia_della_corona: "Опека над Короной" #NT!
 nd_lmb_custodia_della_corona_desc: "Свечи, облачения и реестры каноников: содержание Корона Ферреа и ее часовни." #NT!
 nd_lmb_gestione_delle_acque: "Управление водами" #NT!
 nd_lmb_gestione_delle_acque_desc: "Шлюзы, канавы и зимние паводки содержатся в порядке водными мастерами." #NT!
 nd_lmb_pm_armature_bianche: "Белая броня" #NT!
 nd_lmb_pm_armature_bianche_desc: "Латная сбруя в стиле Миссальи: ломбардское железо, угольная обработка и кожаные ремни, закованные в экспортные доспехи." #NT!
 nd_lmb_pm_canne_di_gardone: "Бочки с Гардоне" #NT!
 nd_lmb_pm_canne_di_gardone_desc: "Стволы ружей выкованы и расточены в манере Валь Тромпия, изготовлены из орехового дерева и проверены на продажу." #NT!
 nd_lmb_cura_degli_infermi: "Уход за больными" #NT!
 nd_lmb_cura_degli_infermi_desc: "Лекарства, белье и свечи для палат великой больницы." #NT!
 nd_lmb_guarnigione_ducale: "Герцогский гарнизон" #NT!
 nd_lmb_guarnigione_ducale_desc: "Оружие, кладка и вино гарнизона: содержание цитадели." #NT!
 nd_lmb_pegni_e_registri: "Залоги и реестры" #NT!
 nd_lmb_pegni_e_registri_desc: "Бухгалтерские книги Монте: взятые в залог, выкупленные и проданные с аукциона под властью монахов." #NT!
 nd_lmb_conche_e_alzaie: "Замки и тропинки" #NT!
 nd_lmb_conche_e_alzaie_desc: "Деревянные ворота, тесаный камень и инструменты шлюзов обеспечивают торговлю на канале." #NT!
 nd_lmb_pm_coltura_del_riso: "Выращивание риса" #NT!
 nd_lmb_pm_coltura_del_riso_desc: "Затопленные поля, пересаженные саженцы и лесозаготовки на рисовых полях." #NT!
 nd_lmb_pm_carta_di_stracci: "Тряпичная бумага" #NT!
 nd_lmb_pm_carta_di_stracci_desc: "Льняные тряпки, прибитые водяными молотками к белой бумаге фабрик Тосколано." #NT!
 nd_lmb_formazione_del_clero: "Формирование духовенства" #NT!
 nd_lmb_formazione_del_clero_desc: "Книги, бумага и свечной воск для долгих лет обучения семинаристов." #NT!
 nd_lmb_collegio_dei_dottori: "Колледж врачей" #NT!
 nd_lmb_collegio_dei_dottori_desc: "Библиотекари и ученые Амброзианы покупают, копируют и каталогизируют." #NT!
 nd_lmb_quarantena: "Карантин" #NT!
 nd_lmb_quarantena_desc: "Лекарства, спиртные напитки и деревянные перегородки для изоляторов Лаццаретто." #NT!
 nd_lmb_vernice_di_cremona: "Лак Кремоны" #NT!
 nd_lmb_vernice_di_cremona_desc: "Альпийская древесина и секретный лак мастерской, о которых спорили веками." #NT!
 nd_lmb_villeggiatura: "Вилледжиатура" #NT!
 nd_lmb_villeggiatura_desc: "Сезон в деревне: подвалы заполнены, салоны обустроены для аристократического двора." #NT!
 nd_lmb_strumenti_scientifici: "Научные инструменты" #NT!
 nd_lmb_strumenti_scientifici_desc: "Латунь, стекло и медь для электрометров, конденсаторов и свай лаборатории." #NT!
  
  ### Destiny advances 
 nd_lmb_destiny: "Иль Реньо Италико" #NT!
 nd_lmb_destiny_desc: "Regnum Italicum: королевство равнин, которое подразумевала Корона Ферреа со времен лангобардских королей. Удерживайте королевство, и его восстановление может начаться." #NT!
 nd_lmb_dest_eredita_scaligera: "Наследство Скалигеров" #NT!
 nd_lmb_dest_eredita_scaligera_desc: "Разорвите окружение старых войн: отберите Верону и Парму у наследников светлости делла Скала и сохраните армию из тридцати полков, достойную королевства." #NT!
 nd_lmb_dest_conte_di_virtu: "Граф Вирту" #NT!
 nd_lmb_dest_conte_di_virtu_desc: "Следуйте по дороге Джана Галеаццо на юг: подведите Болонью и Сиену под Бишоне, окружите Флоренцию лангобардскими гарнизонами и удерживайте пятьдесят полков, чтобы удержать захваченное." #NT!
 nd_lmb_dest_rex_italiae: "Рекс Италия" #NT!
 nd_lmb_dest_rex_italiae_desc: "Завершите то, что не дожил ни один Висконти: Флоренция и Рим под королевским миром, армия из семидесяти пяти полков и престиж, достойный Железной Короны." #NT!
 nd_lmb_dest_credenza: "Креденца ди Сант-Амброджо" #NT!
 nd_lmb_dest_credenza_desc: "Управляйте финансами государства, как когда-то это делала коммуна: примите институт банковского дела и пересчитайте тысячу дукатов свободной монеты в общем кошельке." #NT!
 nd_lmb_dest_porta_del_mare: "Ворота в море" #NT!
 nd_lmb_dest_porta_del_mare_desc: "Дайте бухгалтерским книгам береговую линию: включите Геную в систему Содружества, поставьте шелк на столичную биржу и удвоьте общий кошелек до двух тысяч дукатов." #NT!
 nd_lmb_dest_repubblica_aurea: "Золотая Республика" #NT!
 nd_lmb_dest_repubblica_aurea_desc: "Сделайте золотое имя правдивым: царство тысячи мер развития, институт мировой торговли и три тысячи дукатов в казне Содружества." #NT!
  
  ### Destiny root event 
 nd_lmb.10.t: "Курс Регнума" #NT!
 nd_lmb.10.d: "Коронация состоялась, в королевстве наступила тишина, и канцелярии Европы снова начали писать старые слова: regnum Italicum, королевство лангобардов, дремлющее с тех пор, как императоры упустили его из виду. Тот, кто владеет Корона Ферреа, придерживается аргумента старше, чем любая живая династия: равнина По - это не провинция чьей-либо империи, а самостоятельное королевство, со своей короной, своими обрядами и своими упрямыми городами.\n\nКаким должно быть королевство, коронация уже дала ответ. Остается только сделать ответ правдивым, лига за лигой и регистр за регистром." #NT!
 nd_lmb.10.a: "Regnum устанавливает свой курс" #NT!
  
  ### Path A stage 1 event 
 nd_lmb.11.t: "Наследство Скалигеров" #NT!
 nd_lmb.11.d: "Поколение назад делла Скала Вероны владела самой обширной властью на равнине, а Милан жил между Скалигером Пармой на юге и Скалигером Вероной на востоке. Это кольцо сломано. От Адды до Адидже и на юге за По, города, которые когда-то окружали Милан, теперь маршируют под ее знаменами.\n\nЖители Вероны хранят свои уставы и своих святых; теперь они платят налог на очаг ломбардской палате. Все дороги с равнины открыты, и капитаны начали говорить о Тоскане, как купцы говорят о ярмарке." #NT!
 nd_lmb.11.a: "От Адды до Адидже" #NT!
  
  ### Path A stage 2 event 
 nd_lmb.12.t: "Граф Вирту" #NT!
 nd_lmb.12.d: "Болонья открыла свои ворота, а Сиена взяла на себя защиту Бишоне. Дороги в Тоскану и Романью подчиняются лангобардским гарнизонам, и Флоренция, просыпаясь, обнаруживает, что ее окружили с трех сторон, ее зерновые дороги находятся под наблюдением, ее банкиры пишут нервные письма.\n\nВ замке в Павии совет взвешивает два инструмента империи. Юристы указывают на север, на Империю, которая до сих пор утверждает, что лицензирует каждую корону в Италии: за золото, заплаченное смущенному римскому королю, можно купить диплом, который делает завоевание законным, а вассальную зависимость - достойной. Вместо этого капитаны указывают на карту: ни один пергамент не взял Болонью, и государство, построенное мечом, сохраняется благодаря ему." #NT!
 nd_lmb.12.a: "Купите отличный диплом" #NT!
 nd_lmb.12.b: "Ни один пергамент не взял Болонью" #NT!
  
  ### Path A capstone event 
 nd_lmb.13.t: "Рекс Италия" #NT!
 nd_lmb.13.d: "Флоренция хранит королевский мир, а Рим получил лангобардский гарнизон с почестями, подобающими защитнику. Теперь ничто не стоит между Корона Ферреа и титулом, который она подразумевала на протяжении семи столетий. В базилике Теодолинды в Монце каноники открывают сокровищницу, и суд должен решить, какой король выйдет из нее.\n\nОдин совет терпелив: корона и закон, реестры вносятся в каждую завоеванную палату, итальянцы делаются подданными, а не данниками, пока королевство не станет фактом, который ни одной армии не нужно будет подтверждать. Другой — римский в старом смысле слова: царствование как власть, полуостров удерживается тем же железом, которое завоевало его." #NT!
 nd_lmb.13.a: "Корона и закон в Монце" #NT!
 nd_lmb.13.b: "Италия подчиняется мечу" #NT!
  
  ### Path B stage 1 event 
 nd_lmb.14.t: "Креденца Сант-Амброджо" #NT!
 nd_lmb.14.d: "Старейшины коммуны возродили старое название: Credenza di Sant'Ambrogio, присяжный совет, который когда-то выступал от имени пополо против великих семей. Его дело сейчас — арифметика. Банковские дома были выведены за пределы закона, смета оценивается приходом и публикуется, а общий кошелек, пересчитанный при свидетелях в ризнице базилики, содержит более тысячи дукатов свободной монеты.\n\nНи один герцог не приказывал ничего из этого. Города равнины обложили себя налогами, как когда-то это сделала Лига, и оказались богатыми." #NT!
 nd_lmb.14.a: "Общий кошелек засчитывается" #NT!
  
  ### Path B stage 2 event 
 nd_lmb.15.t: "Ворота в море" #NT!
 nd_lmb.15.d: "Генуя вошла в систему Содружества, а в коммуне Святого Амвросия есть то, о чем мечтает каждый бухгалтер, не имеющий выхода к морю: порт. Ломбардский шелк и фустиан спускаются по горным дорогам к лигурийским набережным, где в обменных пунктах котируются миланские ткани в трех валютах.\n\nВ торговых судах два иска лежат рядом. Судовладельцы просят кили: флот под флагом коммуны, чтобы ни один венецианский или каталонский конвой не смог перекрыть морской путь. Банкиры требуют проведения ярмарок: регулярных обменных сезонов, когда векселя, выписанные в Милане, погашают долги от Брюгге до Хиоса, а морская прибыль фиксируется чернилами." #NT!
 nd_lmb.15.a: "Сложите кили" #NT!
 nd_lmb.15.b: "Чартер биржевых ярмарок" #NT!
  
  ### Path B capstone event 
 nd_lmb.16.t: "Золотая Республика" #NT!
 nd_lmb.16.d: "Республику 1447 года они называли золотой в течение трех отчаянных лет; этот заслужил это имя. Путешественники пересекают границу и с недоверием пишут домой: каналы, проходящие через рисовую воду, школы в торговых городах, казначейство, публикующее свои отчеты и хранящее три тысячи дукатов на печатной странице.\n\nСодружество ломбардских городов — самая богатая земля в Европе, управляемая собственными гражданами, и его совет должен решить, что делает золотую республику золотой. Юристы предлагают конституцию: гражданский порядок, записанный так, чтобы ни один капитан никогда больше не мог превратить командование в корону. Капитаны ворот предлагают более старый ответ: стены, укомплектованные гражданами, владеющими тем, что они защищают." #NT!
 nd_lmb.16.a: "Написать гражданскую конституцию" #NT!
 nd_lmb.16.b: "Укомплектуйте стены горожанами" #NT!
  
  ### Destiny timed modifiers 
 STATIC_MODIFIER_NAME_nd_lmb_dest_diploma_ducale: "Герцогский диплом" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_diploma_ducale: "Великий титул был куплен за гору флоринов: завоевание стало законным, вассальное подчинение стало достойным, а монетный двор тихо попросил покрыть цену." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_spada_del_biscione: "Меч Бишоне" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_spada_del_biscione: "Государство, которое никогда не было построено на пергаменте: быстрые колонны, штурмованные стены и солдаты, которые в одночасье снова обретают храбрость." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_corona_a_monza: "Корона в Монце" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_corona_a_monza: "Царство как закон: завоеванные города вносились в реестры, их народы становились подданными, их сепаратизм лишен обид." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_signore_ditalia: "Лорд Италии" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_signore_ditalia: "Царство как командование: осадные поезда против каждой непокорной стены, гарнизоны накормлены и заменены, а земля пожирает захватчиков." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_via_del_mare: "Путь моря" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_via_del_mare: "Кили на стапелях, экипажи на перекатах: флаг коммуны уходит в море и намерен там его уважать." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_fiere_di_cambio: "Биржевые ярмарки" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_fiere_di_cambio: "Чартерные сезоны, когда векселями погашаются долги от Брюгге до Хиоса: прибыль моря, записанная чернилами, к громкому дискомфорту церкви." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_costituzione_civica: "Гражданская конституция" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_costituzione_civica: "Содружество записано: советы, которые быстро принимают законы, регистрируются на хороших ломбардских бумагах, и граждане, слишком бдительные, чтобы успокаиваться." #NT!
 STATIC_MODIFIER_NAME_nd_lmb_dest_mura_dei_cittadini: "Гражданские стены" #NT!
 STATIC_MODIFIER_DESC_nd_lmb_dest_mura_dei_cittadini: "Самый старый урок Карроччо: стены, укомплектованные людьми, владеющими тем, что они защищают, гарнизоны, раздутые бюргерами, и марши, которые обходятся коммуне дешево." #NT!
  
  ### Destiny buildings 
 nd_lmb_palazzo_reale: "Палаццо Реале" #NT!
 nd_lmb_palazzo_reale_desc: "Старый двор рядом с Дуомо, перестроенный в резиденцию коронованного королевства: тронный зал, канцелярия и апартаменты короля Италии." #NT!
 nd_lmb_corte_reale: "Королевский двор" #NT!
 nd_lmb_corte_reale_desc: "Бумага для канцелярии, прекрасное сукно для домашнего хозяйства, мебель для казенных покоев." #NT!
 nd_lmb_broletto: "Бролетто Нуово" #NT!
 nd_lmb_broletto_desc: "Дворец разума на площади Пьяцца деи Мерканти: колокол, скамейка и регистр, общинное управление в камне." #NT!
 nd_lmb_arengo_del_popolo: "Аренго народа" #NT!
 nd_lmb_arengo_del_popolo_desc: "Собранная коммуна: бумага для актов, скамейки для советов и инструменты для поддержания порядка в колоколе и зале." #NT!
  
  ### Destiny option tooltips 
 nd_lmb.10.a_tt: "Царство стоит устойчиво. Первые цели его судьбы уже близки." #NT!
 nd_lmb.11.a_tt: "Верона и Парма подчиняются Милану. Дорога на Болонью и Сиену открыта." #NT!
 nd_lmb.12.a_tt: "Законный титул и достойный вассалитет: облегчение аннексии, более широкая дипломатия и цена, которую монетный двор должен спокойно покрыть." #NT!
 nd_lmb.12.b_tt: "Меч сохраняет то, что ему нужно: более сильные атаки, более быстрые марши и боевой дух, который восстанавливается за ночь." #NT!
 nd_lmb.13.a_tt: "Царство как закон: завоеванные земли быстрее интегрируются и ассимилируются, а сепаратизм умирает от голода." #NT!
 nd_lmb.13.b_tt: "Царство как командование: осадные орудия разрушают форты, ряды пополняются дешево, а сама земля изматывает захватчиков." #NT!
 nd_lmb.14.a_tt: "Финансы коммуны в порядке. Генуя и морская дорога – следующие амбиции." #NT!
 nd_lmb.15.a_tt: "Флот под флагом коммуны: больше моряков, более быстрые верфи и более устойчивые экипажи." #NT!
 nd_lmb.15.b_tt: "Прибыль моря, записанная в чернилах: больше купцов, более богатая ткань и церковь, бормочущая о ростовщичестве." #NT!
 nd_lmb.16.a_tt: "Гражданский порядок записан: более оживленные советы, более загруженные бумажные фабрики и граждане, слишком бдительные, чтобы успокаиваться." #NT!
 nd_lmb.16.b_tt: "Гражданские стены: более крупные гарнизоны, более твердая общинная нога и марши, которые обходятся общине недорого." #NT!
  
  ### BUREAUCRACIES 
 lmb_senato_di_milano_bureaucracy: "Сенато ди Милано" #NT!
 lmb_senato_di_milano_bureaucracy_desc: "Людовик XII учредил Сенат указом Виджевано 11 ноября 1499 года из семнадцати членов по образцу парламентов Франции, и каждый последующий правитель Милана сохранял его: Сфорца, испанец и австрийец. Он выносил решения в последней инстанции, его решения были обязательными для всех судов низшей инстанции, и он регистрировал указы суверена, отклоняя те, которые, по его мнению, противоречили законам герцогства. Место на его скамье было вершиной карьеры миланского юриста. Иосиф II лишил его административных полномочий в 1771 году и отменил его указом от 11 февраля 1786 года." #NT!
 lmb_magistrato_straordinario_bureaucracy: "Магистрат Страординарио" #NT!
 lmb_magistrato_straordinario_bureaucracy_desc: "Камерный двор вотчины князя, заседавший с 1541 года под председательством президента и шести квесторов, трех в тоге и трех в плаще и мече. Он управлял феодальными владениями и регалиями, конфискациями и денежными арестами, вакантными наследствами, королевскими озерами и реками, а также лицензированием экспорта товаров первой необходимости. Оставленный гнить, он становится тем, что сделал из него испанский Милан: прилавком, продающим феодальные владения и связанные с ними финансовые иммунитеты. Указ Марии Терезии от 30 апреля 1749 года объединил его в единый Magistrato Camerale." #NT!
 lmb_regalia_delle_acque_bureaucracy: "Регалии делле Акке" #NT!
 lmb_regalia_delle_acque_bureaucracy_desc: "Проточная вода в герцогстве принадлежала князю. С 1490-х годов Камера Дукале продавала и сдавала в аренду ее за унции, измеряемую в бочче, где роггиа выходила из Навильо, и однажды купленную концессию можно было перепродать или сдать в аренду. Во времена Леонардо один только Навильо-Гранде стоил 125 000 дукатов в год. В 1515 году Массимилиано Сфорца, нуждаясь в деньгах против французов, продал воды, русла и берега Гранде и Мартезаны прямо городу Милану." #NT!
 lmb_tribunale_di_provvisione_bureaucracy: "Tribunale di Provvisione" #NT!
 lmb_tribunale_di_provvisione_bureaucracy_desc: "Собственная магистратура Милана: двенадцать граждан, полномочия которых совет установил 11 апреля 1280 года, с 1366 года под председательством провизионного викария. Оно управляло анноной, закупало зерно, устанавливало вес и цену буханки, вело рынки, улицы и городские счета. В 1515 году город получил право назначить 150 депутатов, избравших викария, и двенадцать. Контадо платил за дешевый хлеб в виде реквизиций по фиксированным ценам, а когда зернохранилища вышли из строя, город все равно поднял бунт, как это произошло в Сан-Мартино в ноябре 1628 года." #NT!
 lmb_ufficio_di_sanita_bureaucracy: "Уффицио ди Санита" #NT!
 lmb_ufficio_di_sanita_bureaucracy_desc: "В Милане были зарегистрированы все случаи смерти с 1452 года, каждый труп, осмотренный врачом санитарного ведомства и о котором сообщили официальные лица в приходах. Лаццаретто возвышался возле Восточных ворот 1488 года, 280 комнат вокруг двора длиной почти 400 метров. 13 мая 1534 года Франческо II Сфорца передал эту должность магистрату санита, а ее медицинские пропуска, опечатанные дома и кордоны ответили на эпидемии 1576 и 1630 годов. Купцы ненавидели карантин, а духовенство архиепископа игнорировало запрет на собрания. Из-за нехватки средств правление скорее перестает знать, чем прекращает контролировать ситуацию: 1630 год закончился охотой на унтори." #NT!
 lmb_dottrina_cristiana_bureaucracy: "Школа делла Дотрина Кристиана" #NT!
 lmb_dottrina_cristiana_bureaucracy_desc: "Кастеллино да Кастелло открыл воскресную школу в Сан-Джакомо в Порта-Нуова в 1536 году и обучал детей бедняков катехизису, а также чтению, письму и арифметике. Его «Компания» 1539 года распространила эту модель: пятнадцать школ, когда Ормането стал генеральным викарием в 1564 году, вдвое больше в течение двух лет и тридцать после смерти Кастеллино. Карло Борромео подарил общине Сан-Далмацио в 1577 году и возложил на нее Облаты Святого Амвросия. Амвросийская церковь обучала Ломбардию своим буквам приход за приходом, подчиняясь архиепископу, а не губернатору." #NT!
  
  # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_lmb_bureaucracy_authority: "Ломбардская бюрократическая власть" #NT!
 AUTO_MODIFIER_DESC_nd_lmb_bureaucracy_authority: "При формировании [LMB.GetName] может вместить магистратуры, управлявшие долиной реки По: суверенный суд, палаты герцогского наследия, миланскую аннону, совет здравоохранения и школы Амвросианской церкви." #NT!
  
  # Cabinet action carried through formation from Milan's Lombard ambitions. 
  # Text mirrors vanilla mlo_restore_kingdom_lombardy so the action reads as the 
  # same one the player already had. 
 nd_lmb_restore_kingdom_lombardy: "Интеграция ломбардных претензий" #NT!
 nd_lmb_restore_kingdom_lombardy_desc: "Наше стремление объединить бывшие земли Ломбардского королевства является благородным и законным." #NT!
 nd_lmb_restore_kingdom_lombardy_action: "$nd_lmb_restore_kingdom_lombardy$" #NT!
 nd_lmb_restore_kingdom_lombardy_active: "Интеграция ломбардных претензий" #NT!
 nd_lmb_restore_kingdom_lombardy_action_progress: "[Cabinet.GetActionNumProgress|%]" #NT!
