l_russian:
 CPT: "Коптский Египет" #NT!
 CPT_ADJ: "Коптский" #NT!
 CPT_f: "Коптский Египет" #NT!
 CPT_f_desc: "Образованное миафизитским государством, правившим на Ниле из Каира, где коптские писцы и финансисты веками вели бухгалтерские книги Египта. Окно было узким и быстро закрывалось: волны беспорядков и сноса церквей в 1301 и 1321 годах были недавними событиями в 1337 году, и после этого переход из коптской церкви только ускорился. Таким образом, коптский Египет должен был быть захвачен во время краха мамлюков, последовавшего за смертью аль-Насира Мухаммеда в 1341 году, опираясь на финансовую бюрократию, монастыри Вади эль-Натрун, христианские королевства Нубии выше по реке и болота Дельты, которые когда-то служили укрытием для восстаний башмуритов." #NT!
