  # Game Rule 
 rule_nd_danube_succession_rule: "Преемственность национальных судеб на Дунае" #NT!
 setting_nd_danube_succession_enabled: "Включено" #NT!
 setting_nd_danube_succession_enabled_desc: "[ShowSituationName('nd_danube_succession')] [situation|e] открывается между Австрией, Венгрией и Богемией после переплетения их династий, но не позднее 1437 года. Пакты, помолвки и Дунайский конгресс решают, какая корона объединит этих троих. Корона ИИ, выигравшая вопрос, основывает Дунайскую монархию." #NT!
 setting_nd_danube_succession_disabled: "Выключено" #NT!
 setting_nd_danube_succession_disabled_desc: "[ShowSituationName('nd_danube_succession')] [situation|e] никогда не открывается. Дунайскую монархию по-прежнему может создать тот, кто владеет тремя коронами путем брака, подчинения или завоевания. Страна ИИ основывает его только в соответствии с правилом ИИ формирует нации, если она самостоятельно отвечает этим требованиям." #NT!
