l_russian:
 LMB: "Ломбардия" #NT!
 LMB_ADJ: "Ломбардский" #NT!
 LMB_f: "Ломбардия" #NT!
 LMB_f_desc: "Завладейте Железной короной древнего царства Лангобардов и превратите долину По в самостоятельное королевство, короновавшись в Монце или Павии, как когда-то короновались средневековые короли Италии. От коммун Ломбардской лиги, усмиривших Барбароссу при Леньяно, до герцогов Висконти, которые в 1402 году отстояли одну кампанию от королевского титула, когда разразилась эпидемия чумы, Ломбардия всегда была сердцем северной Италии: ее банкирам, ткацким станкам и амброзианской церкви не хватает только короны. Ломбардская держава, владеющая и Миланом, и Павией, может сделать этот последний шаг." #NT!
