l_russian:
 ILY: "Иллирия" #NT!
 ILY_ADJ: "Иллирийский" #NT!
 ILY_f: "Иллирия" #NT!
 ILY_f_desc: "Хорватские и далматинские гуманисты, прелаты и городские патриции называли свой язык иллирийским, а самих себя иллириками в течение трех столетий, прежде чем это слово позаимствовал какой-либо националист. Образованная католической славянской державой, которая объединяет далматинские общины, хорватские области, Славонию и внутренние районы Боснии под одной короной, Иллирия превращает это научное притязание в государство: наследницу классического иллирийского языка, славянской литургии глаголицей, которую Рим разрешил епископам Адриатики, и славянского богослужения глаголическими буквами. Иллирийские колледжи в Риме и Лорето. Это восточная Адриатика, отвечающая сама за себя, а не федерация всех южных славян." #NT!
