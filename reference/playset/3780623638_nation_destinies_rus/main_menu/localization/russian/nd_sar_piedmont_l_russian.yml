l_russian:
 STATIC_MODIFIER_NAME_nd_sarp_wardens_of_the_passes: "Стражи перевалов" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_wardens_of_the_passes: "Мон-Сени, Большой и Малый Сен-Бернар, и все следы мулов между ними. Корона считает то, что пересекает, кормит армии, где ничего не растет, и ей никто не доверяет." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_two_codes_one_crown: "Два кодекса, одна корона" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_two_codes_one_crown: "Хартия де Логу на острове, статуты Савойи на материке и канцелярия, которая может вместить и то, и другое одновременно. Бароны, потерявшие привычные дворы, не благодарят за это короля." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_palaiologos_inheritance: "Наследство Палеологов" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_palaiologos_inheritance: "Теодор, сын Андроника II, приехал на запад в 1306 году, и его дом владел Монферратом в течение двух столетий. Суд помнит, от чего он исходит, и тратит соответственно." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_law_in_the_vulgar_tongue: "Закон на простонародном языке" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_law_in_the_vulgar_tongue: "Кодекс зачитывается вслух на сардинском языке в каждом деревенском суде, чтобы люди, связанные им, могли слышать, что их связывает." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_oath_of_the_barons: "Клятва баронов" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_oath_of_the_barons: "Феудатары лично клянутся соблюдать кодекс. Они сохраняют свои суды и свои сборы, а корона хранит их подписи." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_edict_enforced: "Указ приведен в исполнение" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_edict_enforced: "Долины расчищены, церкви снесены, дети крестились. Каждый протестантский суд Европы узнает об этом в течение месяца." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_cavour_restored: "Кавурский мир восстановлен" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_cavour_restored: "Договор 1561 года снова в силе: свобода совести в отмеченных долинах и отсутствие солдат над пограничными камнями. С Римом не консультируются." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_galleries_deepened: "Галереи стали глубже" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_galleries_deepened: "Под гласисом прорублены еще два уровня контрмин, потому что осаждающий, который не умеет копать, не может взять цитадель." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_out_of_the_gates: "Из ворот" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_out_of_the_gates: "Линии осады прорваны, и армия на них не останавливается. Освобожденная столица стоит меньше, чем разбитый враг." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_island_bound_in: "Остров, окруженный" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_island_bound_in: "Вице-короли, суды, геодезисты и налоговые инспекторы отправляются в Кальяри. Если корона будет названа в честь Сардинии, Сардиния будет управляться." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_sicilian_title_kept: "Король Сицилии Стилл" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_sicilian_title_kept: "Обмен подписывается и в любом случае сохраняется старый стиль. Претензия, от которой не было отказа, — это претензия, на которую можно настаивать." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_fences_go_up: "Заборы поднимаются вверх" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_fences_go_up: "Места общего пользования измерены, огорожены и распределены. Пастухи процветают. Деревни, пасущиеся там, обнаруживают, что им ничего не принадлежит." #NT!
 STATIC_MODIFIER_NAME_nd_sarp_commons_defended: "Палата общин защищена" #NT!
 STATIC_MODIFIER_DESC_nd_sarp_commons_defended: "Ademprivio означает: право каждой деревни на лес, воду и пастбища на земле, которой никто не владеет. Улучшителям советуют покупать самим." #NT!
 nd_sar_piedmont_e1_done_tt: "Основание королевства уже отмечено" #NT!
 nd_sar_piedmont.1.a_tt: "Королевство построено на перевалах и на том, что их пересекает." #NT!
 nd_sar_piedmont.1.b_tt: "Королевство построено на двух сводах законов и одном реестре." #NT!
 nd_sar_piedmont.1.c_tt: "Королевство построено на основании дома, который его воздвиг." #NT!
 nd_sar_piedmont.2.a_tt: "Кодекс провозглашается на сардинском языке в каждом деревенском суде." #NT!
 nd_sar_piedmont.2.b_tt: "Феудатары клянутся соблюдать кодекс и имеют свои собственные суды." #NT!
 nd_sar_piedmont.3.a_tt: "Долины расчищены, а протестантской Европе приказано заняться своими делами." #NT!
 nd_sar_piedmont.3.b_tt: "Договор 1561 года восстанавливается и войска отводятся." #NT!
 nd_sar_piedmont.4.a_tt: "Под гласисом прорублены еще два уровня контрмины." #NT!
 nd_sar_piedmont.4.b_tt: "Армия, пришедшая на помощь, преследует, а не отступает." #NT!
 nd_sar_piedmont.5.a_tt: "Для управления островом направляются суды, геодезисты и налоговые ведомости." #NT!
 nd_sar_piedmont.5.b_tt: "Сицилийский стиль сохранен, и претензия остается открытой." #NT!
 nd_sar_piedmont.6.a_tt: "Земли общего пользования обследованы, огорожены и зарегистрированы на тех, кто их оградил." #NT!
 nd_sar_piedmont.6.b_tt: "Право на лес, воду и пастбища отстаивается в отношении геодезистов." #NT!
 nd_sar_piedmont_formed_tt: "Образована Сардиния-Пьемонт." #NT!
 nd_sar_piedmont_path_a_tt: "Избранные стражи перевалов" #NT!
 nd_sar_piedmont_path_b_tt: "Выберите два кода, одну корону" #NT!
 nd_sar_piedmont_path_c_tt: "Выбрать наследство Палеологов" #NT!
 nd_sar_piedmont.1.t: "Корона, собранная по договору" #NT!
 nd_sar_piedmont.1.d: "Царство, которое существует сейчас, никогда не планировалось. Одна половина — это альпийское герцогство, которое зарабатывало на жизнь у дверей Италии, владея Мон-Сени и двумя сенбернарами и облагая налогом все, что пересекало их. Другая половина — это остров со своим языком, собственным сводом законов, написанным женщиной в 1392 году, и четырьмя столетиями практики выживания того, кто претендует на то, чтобы править им.\n\nИх не объединяет ничего, кроме договора и титула. Канцелярия в Турине теперь должна решить, для чего нужна эта корона.\n\nОдин ответ — это сама земля: удерживать проходы, кормить армии там, где ничего не растет, и сделать королевство дверью, которая открывается только за определенную плату.\n\nДругой — это закон: два кодекса, два народа, один реестр и суды, которые подчиняются короне, а не обычаям.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sar_piedmont.1.d.mfa: "Царство, которое существует сейчас, никогда не планировалось, как и дом, который его воздвиг. В 1306 году Теодор Палеолог, сын императора Андроника II, приехал на запад, чтобы претендовать на маркизат своей матери Монферрат, и его линия удерживала его до 1533 года. Однажды этот путь разветвился: семья могла перенести Константинополь в Италию, сохранить греческий обряд и греческий язык и основать византийский двор на холмах Пьемонта. Это не так. Оно прослушало мессу на латыни, женилось на Савойе и стало итальянцем.\n\nЗдесь есть другой результат этого выбора. Альпийское герцогство, живущее за счет перевалов, остров со своим законом, римским именем в генеалогическом древе и короной, полученной в результате обмена.\n\nДержите перевалы. Правило по кодексам. Или управляйте так, как управляет пурпур, по происхождению и церемониям, и пусть все помнят, чья это кровь.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_sar_piedmont.1.a: "Держите двери Италии" #NT!
 nd_sar_piedmont.1.b: "Два кода, один реестр, одна корона" #NT!
 nd_sar_piedmont.1.c: "Правило, как правил фиолетовый" #NT!
 nd_sar_piedmont.2.t: "Хартия де Логу" #NT!
 nd_sar_piedmont.2.d: "Элеонора, судья Арбореи, дала острову закон. В нем около ста девяноста восьми статей, и он написан на сардинском языке, а не на латыни, так что пастухи могут быть прочитаны в своих правах.\n\nОн устанавливает одно наказание за одно преступление, кто бы его ни совершил, дворянин или сельский житель. Он дает вдове право отказаться от второго брака и сохранить свое. Он устанавливает суровые наказания за сжигание леса или убийство чужого скота на том основании, что деревья и стада острова не бесконечны.\n\nЭтот закон Сардинии будет действовать на четыреста тридцать пять лет, что дольше, чем у большинства королевств, которые сейчас претендуют на его владение." #NT!
 nd_sar_piedmont.2.a: "Прочтите это вслух в каждой деревне" #NT!
 nd_sar_piedmont.2.b: "Заставьте феодатаров поклясться в этом" #NT!
 nd_sar_piedmont.3.t: "Пьемонтская Пасха" #NT!
 nd_sar_piedmont.3.d: "В 1561 году Кавурский мир предоставил вальденсам высокогорных долин свободу совести в определенных границах. Это был первый договор такого рода в Европе, и он длился большую часть столетия.\n\nЗатем последовал приказ покинуть нижние долины в течение трех дней зимой, а затем и войска. За три дня пасхальной недели 1655 года около двух тысяч человек были убиты в деревнях, названия которых никто за пределами Чизоне не слышал. Выжившие ушли в снег.\n\nВести доходят до Лондона в течение нескольких недель. Кромвель угрожает вмешаться, Мильтон пишет сонет, а суды протестантской Европы хотят знать, что за принц это делает. Между тем долины все еще не пустуют." #NT!
 nd_sar_piedmont.3.a: "Закончите то, что начал указ" #NT!
 nd_sar_piedmont.3.b: "Вернуть Кавурский мир в силу" #NT!
 nd_sar_piedmont.4.t: "Галереи под Турином" #NT!
 nd_sar_piedmont.4.d: "Четыре месяца 1706 года сорокатысячная французская армия располагалась вокруг столицы. Под цитаделью проходит решетка противоминных галерей, и войну там ведут шахтеры с кирками и порохом в темноте.\n\nВ ночь на 30 августа отряд гренадеров врывается в нижнюю галерею. Шахтер по имени Пьетро Микка не может вовремя закрыть дверь и не может пробежать достаточно далеко с длинным запалом, поэтому он обрезает ее, отправляет своего товарища вверх по лестнице и поджигает ее. Галерея держится.\n\n7 сентября полевая армия спускается с холмов, и осада прорывается. С хребта Суперги, где герцог дал клятву перед битвой, видна вся равнина." #NT!
 nd_sar_piedmont.4.a: "Вырезайте галереи глубже" #NT!
 nd_sar_piedmont.4.b: "Выходите за ними" #NT!
 nd_sar_piedmont.5.t: "Сицилия для Сардинии" #NT!
 nd_sar_piedmont.5.d: "Утрехт подарил герцогу Сицилию и королевскую корону в 1713 году. Семь лет спустя державы решают, не спрашивая, что Сицилия должна принадлежать Австрии, а вместо нее - Сардиния.\n\nЭто понижение в должности, замаскированное под обмен. Сицилия богата, густонаселена и средиземноморья; Сардиния бедна, заражена малярией и управляется баронами, пережившими три империи. Единственное, что носит остров, - это старый королевский титул, поэтому корона сохраняется при обмене, хотя почти ничего другого не сохраняется.\n\nВиктор Амадей подписывает контракт, а затем продолжает называть себя королем Сицилии до 1723 года, потому что отданный титул труднее восстановить, чем титул, который просто оспаривается." #NT!
 nd_sar_piedmont.5.a: "Отнеситесь к острову серьезно" #NT!
 nd_sar_piedmont.5.b: "Сохраняйте сицилийский стиль" #NT!
 nd_sar_piedmont.6.t: "Указ о вложении" #NT!
 nd_sar_piedmont.6.d: "На острове никогда не было частной земли в том смысле, в каком ее понимают на материке. Согласно ademprivio, каждая деревня имеет права на лес, воду и пастбища на землю, которая никому конкретно не принадлежит, и так было еще до прибытия Арагона.\n\nГеодезисты из Турина называют это препятствием на пути к улучшению. Указ 1820 года предлагал каждому оградить то, чем он пользуется, и зарегистрировать его как свое. Те, у кого есть капитал, акции и адвокат, торгуют очень много. Те, у кого есть только обычные права, обнаруживают, что обычные права не выдерживают проверки.\n\nИзгороди начинают рушиться ночью почти сразу же, и в результате судебные иски продолжаются и столетие спустя." #NT!
 nd_sar_piedmont.6.a: "Пусть заборы стоят" #NT!
 nd_sar_piedmont.6.b: "Защитить адемпривио" #NT!
 nd_sar_piedmont_domus_de_logu_tradition: "Суды судейства" #NT!
 nd_sar_piedmont_domus_de_logu_tradition_desc: "Задолго до того, как какой-либо кодекс был записан, сардинские суды проводили свои суды под открытым небом, на сардинском языке, под председательством мажора деревни, и каждый присутствующий имел право выслушать приговор." #NT!
 nd_sar_piedmont_tolls_of_the_passes: "Плата за перевалы" #NT!
 nd_sar_piedmont_tolls_of_the_passes_desc: "Графы Савойи владели бедной землей и богатыми дверями. Мон-Сени, Большой и Малый Сен-Бернар везли на север шелк и соль Италии, и каждый груз платился у барьера." #NT!
 nd_sar_piedmont_barba_of_the_valleys: "Барба долин" #NT!
 nd_sar_piedmont_barba_of_the_valleys_desc: "Вальденсские проповедники, которых называли «барба» в честь слова «дядя», путешествовали по Коттийским Альпам парами, переписывая Священные Писания от руки. Все остальные средневековые ереси в Латинской Европе были уничтожены. Этот не был." #NT!
 nd_sar_piedmont_hosts_of_the_giudicati: "Хозяева Судей" #NT!
 nd_sar_piedmont_hosts_of_the_giudicati_desc: "Судебное государство могло в кратчайшие сроки поставить под ружье всю свою сельскую местность, поэтому остров, переданный Арагону папским даром в 1297 году, столетие спустя все еще боролся за себя." #NT!
 nd_sar_piedmont_carta_de_logu: "Хартия де Логу" #NT!
 nd_sar_piedmont_carta_de_logu_desc: "Обнародован Элеонорой Арборейской в ​​1392 году на сардинском языке, с равными наказаниями независимо от ранга, правами собственности для вдов и жесткой защитой лесов и домашнего скота. Действул до 1827 года." #NT!
 nd_sar_piedmont_brancaleone_war: "Война Бранкалеоне" #NT!
 nd_sar_piedmont_brancaleone_war_desc: "В 1391 году Бранкалеоне Дориа захватил Сассари, Осило, Вилья-ди-Кьеза и Санлури и оставил арагонцам два порта. Колонны арбореев двигались и поедали землю, которую враги называли необитаемой." #NT!
 nd_sar_piedmont_statuta_sabaudiae: "Статута Сабаудии" #NT!
 nd_sar_piedmont_statuta_sabaudiae_desc: "Амадей VIII, первый герцог Савойский, в 1430 году передал в наследство разрозненным альпийским долинам, равнинам Пьемонта и графству Ницца один статут и постоянный совет для его применения." #NT!
 nd_sar_piedmont_salt_of_cagliari: "Соль Кальяри" #NT!
 nd_sar_piedmont_salt_of_cagliari_desc: "Соляные котлы за Кальяри снабжали западное Средиземноморье, и та же самая корона, которая подняла соль, позже снова облагала ее налогом у альпийских барьеров на пути во Францию." #NT!
 nd_sar_piedmont_green_count: "Зеленый граф" #NT!
 nd_sar_piedmont_green_count_desc: "Амадей VI выступал арбитром между Миланом и Венецией, а в 1366 году направил флот в Галлиполи, чтобы освободить императора Иоанна V Палеолога от болгар. Савойя рано поняла, что маленькое государство больше всего выигрывает за столом переговоров." #NT!
 nd_sar_piedmont_valli_valdesi: "Холд Долины" #NT!
 nd_sar_piedmont_valli_valdesi_desc: "В 1487 году Иннокентий VIII проповедовал крестовый поход против вальденсов Валь д'Ангронья. Колонны поднялись по долине и снова спустились ни с чем, узнав, чего стоит защищенное альпийское ущелье." #NT!
 nd_sar_piedmont_viceroyalty: "Реале Удиенца" #NT!
 nd_sar_piedmont_viceroyalty_desc: "Высокий суд Кальяри вынес решение над островными феодатами, которые были обязаны короне военной службой, возмущались каждым вызовом и на них можно было положиться в обоих случаях." #NT!
 nd_sar_piedmont_printed_carta: "Печатная Хартия вольностей" #NT!
 nd_sar_piedmont_printed_carta_desc: "Около 1480 года в Кальяри была напечатана Carta de Logu — один из первых общенародных сводов законов в Европе, напечатанный на языке народа, которым он управлял." #NT!
 nd_sar_piedmont_two_chanceries: "Две Канцелярии" #NT!
 nd_sar_piedmont_two_chanceries_desc: "Сардинский на острове, пьемонтский на равнине, французский в Шамбери, окситанский в высокогорных долинах и латынь во дворах. Корона никогда серьезно не пыталась свести это число к одному." #NT!
 nd_sar_piedmont_passes_in_arms: "Проходы с оружием в руках" #NT!
 nd_sar_piedmont_passes_in_arms_desc: "Гарнизон на каждом перевале и магазин за ним. Удержание Альп — это не вопрос стен, а вопрос того, чем можно накормить армию выше границы леса в октябре." #NT!
 nd_sar_piedmont_return_from_exile: "Возвращение из изгнания" #NT!
 nd_sar_piedmont_return_from_exile_desc: "Франция уничтожила герцогство в 1536 году и удерживала его двадцать три года. Эммануэль Филибер отыграл его при Сен-Квентине, сражаясь за Испанию, и восстановил государство, которое прекратило свое существование." #NT!
 nd_sar_piedmont_turin_the_capital: "Турин столица" #NT!
 nd_sar_piedmont_turin_the_capital_desc: "В 1563 году двор переехал из Шамбери в Турин. Франкоязычное альпийское графство, расположенное по ту сторону гор, сознательно решило стать итальянским государством." #NT!
 nd_sar_piedmont_milizia_paesana: "Постановление о милиции" #NT!
 nd_sar_piedmont_milizia_paesana_desc: "С 1566 года сельскую местность регистрировали приход за приходом, выдавали оружие и тренировали в мирное время. Это была одна из первых действующих систем ополчения в Европе, и ее содержание почти ничего не стоило." #NT!
 nd_sar_piedmont_monti_frumentari: "Зерновые банки" #NT!
 nd_sar_piedmont_monti_frumentari_desc: "С 1624 года Монти Фрументари ссужали семенной материал сардинским деревням под залог будущего урожая. Они пережили испанцев, австрийцев и савойцев и продолжали давать взаймы в 1900 году." #NT!
 nd_sar_piedmont_treaty_of_lyon: "Лионский договор" #NT!
 nd_sar_piedmont_treaty_of_lyon_desc: "В 1601 году герцогство отдало Франции Бресс, Бюже и Жекс и взамен взяло Салуццо. Он уступил Ронскую сторону Альп и навсегда передал династию Италии." #NT!
 nd_sar_piedmont_ghetto_of_the_alps: "Гетто в Альпах" #NT!
 nd_sar_piedmont_ghetto_of_the_alps_desc: "Кавурский мир 1561 года предоставил вальденсам свободу совести в пределах обозначенных границ. Каждый последующий указ сужал эти границы, пока не осталась полоса возвышенностей, которую современники называли гетто." #NT!
 nd_sar_piedmont_glorious_return: "Славное возвращение" #NT!
 nd_sar_piedmont_glorious_return_desc: "В августе 1689 года Анри Арно переправил девятьсот изгнанников через Женевское озеро и провел их на сто тридцать миль обратно в свои долины. В 1690 году герцог, воевавший с Францией, сделал своих еретиков своими союзниками." #NT!
 nd_sar_piedmont_pietro_micca: "Галереи Контрмины" #NT!
 nd_sar_piedmont_pietro_micca_desc: "Осаждающий захватывает цитадель, копая под ней, поэтому цитадель копает первой. Шахтеры в темноте боролись за галереи под Турином, и в 1706 году у одного из них перегорел предохранитель." #NT!
 nd_sar_piedmont_crown_by_treaty: "Корона по договору" #NT!
 nd_sar_piedmont_crown_by_treaty_desc: "Утрехт сделал герцога королем Сицилии в 1713 году. Гаага отобрала Сицилию в 1720 году и отдала ему вместо этого Сардинию. Титул пережил обмен, в котором и заключался весь смысл его принятия." #NT!
 nd_sar_piedmont_regie_costituzioni: "Реджи Коституциони" #NT!
 nd_sar_piedmont_regie_costituzioni_desc: "Напечатанные в шести книгах в 1723 и 1729 годах, королевские конституции собрали все законы материка в один текст и запретили судам рассуждать за его пределами." #NT!
 nd_sar_piedmont_filatoio_rosso: "Метательные мельницы" #NT!
 nd_sar_piedmont_filatoio_rosso_desc: "Филатойо Россо в Каральо, построенный в 1676 году, превращал водяные колеса вместо метательных рам для скручивания шелка-сырца в органзин. В 1716 году англичанин по имени Джон Ломбе приехал копировать рисунки при свечах, и первой фабрикой в ​​Британии стала украденная пьемонтская шелковая фабрика." #NT!
 nd_sar_piedmont_fenestrelle: "Фенестрелле" #NT!
 nd_sar_piedmont_fenestrelle_desc: "Крепость, строительство которой началось в 1728 году и продолжалось более столетия, поднимается на семисотметровый склон горы и замыкает долину Чизоне. Это крупнейшее альпийское укрепление в Европе." #NT!
 nd_sar_piedmont_cacciatori: "Каччиатори" #NT!
 nd_sar_piedmont_cacciatori_desc: "Легкие батальоны, набранные из лучших стрелков королевства, были отправлены туда, где боевая линия не могла подняться, а в этом королевстве это большая часть территории." #NT!
 nd_sar_piedmont_dragoni_di_sardegna: "Драконы ди Сардиния" #NT!
 nd_sar_piedmont_dragoni_di_sardegna_desc: "Легкая кавалерия, выращенная на Кампидано и оплачиваемая из Турина, одного из немногих учреждений, в котором остров служил материковой короне как равноправный партнер, а не как владение." #NT!
 nd_sar_piedmont_regia_marina_sarda: "Сардинский флот" #NT!
 nd_sar_piedmont_regia_marina_sarda_desc: "Джорджио Де Жене восстановил флот после 1815 года практически из ничего и в 1825 году отвёл его в Триполи, чтобы сжечь корсаров на их причалах." #NT!
 nd_sar_piedmont_codice_feliciano: "Кодекс Чарльза Феликса" #NT!
 nd_sar_piedmont_codice_feliciano_desc: "В 1827 году напечатанный королевский кодекс заменил Хартию де Логу, через четыреста тридцать пять лет после ее провозглашения Элеонорой Арборейской. Почти ничто другое в Европе не длилось так долго." #NT!
 nd_sar_piedmont_editto_chiudende: "Указ о вложении" #NT!
 nd_sar_piedmont_editto_chiudende_desc: "Указ 1820 года предлагал любому желающему ограждать и регистрировать сардинские общины. Он создал землевладельческий класс, безземельный класс и судебную систему, которая пережила королевство." #NT!
 nd_sar_piedmont_domus_de_logu: "Домус де Логу" #NT!
 nd_sar_piedmont_domus_de_logu_desc: "Здание суда сардинской деревни, где майор выслушивал просьбы и зачитывал кодекс вслух на языке сторон. Построен только на острове, поскольку закон острова никогда не распространялся на материк." #NT!
 nd_sar_piedmont_dogana_alpina: "Догана Альпина" #NT!
 nd_sar_piedmont_dogana_alpina_desc: "Таможенный пост на перевале со шлагбаумом, весами, служащим и несколькими солдатами. Его ценность целиком и полностью заключается в том, что обойти его невозможно." #NT!
 nd_sar_piedmont_senato: "Сенато" #NT!
 nd_sar_piedmont_senato_desc: "Суверенный суд, который регистрирует королевские указы и может отказать в их регистрации. Савойя держала четырех человек: в Турине, Шамбери, Ницце и Кальяри, каждый во главе провинции." #NT!
 nd_sar_piedmont_cittadella: "Читтаделла" #NT!
 nd_sar_piedmont_cittadella_desc: "Пятиугольная цитадель столицы с контрминными галереями, уходящими под гласис. Он существует для того дня, когда полевая армия уже проиграла." #NT!
 nd_sar_piedmont_monte_frumentario: "Монте Фрументарио" #NT!
 nd_sar_piedmont_monte_frumentario_desc: "Деревенский зернохранилище, которое дает взаймы семена под следующий урожай под фиксированный процент. Основан на Сардинии в 1624 году и продолжает функционировать три столетия спустя." #NT!
 nd_sar_piedmont_filatoio: "Филатойо" #NT!
 nd_sar_piedmont_filatoio_desc: "Шелкометальная фабрика с водяным приводом. Он ничего не плетет. Он скручивает шелк-сырец в нить органзиновой основы, которую Лайон и Спиталфилдс не могли производить и вынуждены были покупать." #NT!
 nd_sar_piedmont_sbarramento_alpino: "Сбарраменто-Альпино" #NT!
 nd_sar_piedmont_sbarramento_alpino_desc: "Барьерное сооружение построено на дне долины в стиле Эксиллеса, Винадио и Фенестрелле. На открытой местности это была бы стена, которую можно было бы обойти. В ущелье — конец пути." #NT!
 nd_sar_piedmont_logu_maintenance: "Деревенский суд" #NT!
 nd_sar_piedmont_logu_maintenance_desc: "Пергамент, скамейка, лампа и клерк, умеющий писать по-сардински." #NT!
 nd_sar_piedmont_logu_assizes: "Присяжные Хартии вольностей" #NT!
 nd_sar_piedmont_logu_assizes_desc: "Суд теперь заседает по письменному кодексу, с печатными статьями, присяжными заседателями и реестром решений, которые можно обжаловать." #NT!
 nd_sar_piedmont_dogana_maintenance: "Барьер и Леджер" #NT!
 nd_sar_piedmont_dogana_maintenance_desc: "Цепь через дорогу, весы и книга, в которую заносится все, что проходит." #NT!
 nd_sar_piedmont_salt_toll: "Соляной тариф" #NT!
 nd_sar_piedmont_salt_toll_desc: "Соль из кастрюль Кальяри хранится у барьера и выдается под плату, поэтому корона облагает налогом один и тот же груз дважды в двух морях." #NT!
 nd_sar_piedmont_pass_garrison: "Перевал Гарнизон" #NT!
 nd_sar_piedmont_pass_garrison_desc: "Платному пункту дают стену, журнал и компанию на том основании, что таможенный пост, которого нельзя заставить уважать, не является таможенным постом." #NT!
 nd_sar_piedmont_senato_maintenance: "Скамейка" #NT!
 nd_sar_piedmont_senato_maintenance_desc: "Сенаторы, секретари, чернила и огромное количество бумаги, которую потребляет суверенный суд." #NT!
 nd_sar_piedmont_reale_udienza: "Реале Удиенца" #NT!
 nd_sar_piedmont_reale_udienza_desc: "Островное отделение суда, заседавшее в Кальяри по феодальным делам, которые бароны предпочли бы улаживать между собой." #NT!
 nd_sar_piedmont_senate_registration: "Регистрация указов" #NT!
 nd_sar_piedmont_senate_registration_desc: "Ни один королевский указ не является законом, пока суд не внесет его в реестр, а суд, как известно, не торопится." #NT!
 nd_sar_piedmont_codified_bench: "Кодифицированная скамья" #NT!
 nd_sar_piedmont_codified_bench_desc: "Судьям вручают шесть печатных книг и говорят, что они содержат закон целиком и что рассуждения за его пределами не допускаются." #NT!
 nd_sar_piedmont_civil_registry: "ЗАГС" #NT!
 nd_sar_piedmont_civil_registry_desc: "Рождения, браки, смерти, сделки и ипотека — все в одних руках и в одном здании." #NT!
 nd_sar_piedmont_cittadella_maintenance: "Цитадель работает" #NT!
 nd_sar_piedmont_cittadella_maintenance_desc: "Камень для облицовки, порошок для шахт и древесина для укрепления галерей." #NT!
 nd_sar_piedmont_frumentario_maintenance: "Зернохранилище" #NT!
 nd_sar_piedmont_frumentario_maintenance_desc: "Хранилище сухих камней, мерный бушель и бухгалтерская книга, в которой указано, кто и какой урожай должен." #NT!
 nd_sar_piedmont_silk_throwing: "Шелковое метание" #NT!
 nd_sar_piedmont_silk_throwing_desc: "Шелк-сырец наматывают, складывают вдвое и скручивают на водяных рамах до тех пор, пока он не становится органзином — единственной нитью основы, достаточно прочной для механического ткацкого станка." #NT!
 nd_sar_piedmont_sbarramento_maintenance: "Барьерный завод" #NT!
 nd_sar_piedmont_sbarramento_maintenance_desc: "Обработанный камень протащил тропу для мулов, древесину для галерей и достаточно мушкетов, чтобы удержать стену, которую никто не сможет обойти." #NT!
 a_nd_sar_piedmont_milizia_paesana: "Милиция Паэсана" #NT!
 a_nd_sar_piedmont_milizia_paesana_desc: "Приходское ополчение, созданное по указу 1566 года, тренировалось по воскресеньям и вооружалось за счет короны. Упрямые за стеной в своей долине и сильно потрясенные где-либо еще." #NT!
 a_nd_sar_piedmont_bande_valdesi: "Банде Вальдези" #NT!
 a_nd_sar_piedmont_bande_valdesi_desc: "Банды долины Джошуа Джанавеля были вооружены после 1655 года, для которых он написал, возможно, первое руководство по партизанской войне в Европе. Они знают каждую козью тропу выше линии снега и не могут удерживать боевой порядок в течение десяти минут." #NT!
 a_nd_sar_piedmont_minatori: "Минатори" #NT!
 a_nd_sar_piedmont_minatori_desc: "Минные роты цитадели, которые сражаются под землей в противоминных галереях с помощью кирки, пистолета и порохового заряда и которые первыми идут в пролом, потому что знают, что за ним." #NT!
 a_nd_sar_piedmont_cacciatori: "Каччиатори" #NT!
 a_nd_sar_piedmont_cacciatori_desc: "Легкие батальоны отборных стрелков, отправленные впереди линии на территорию, которую линия не может занять. Разрушительно в разбитой стране и болезненно обнажено на равнине." #NT!
 a_nd_sar_piedmont_dragoni_sardi: "Драконы ди Сардиния" #NT!
 a_nd_sar_piedmont_dragoni_sardi_desc: "Островная легкая лошадь, восседающая на небольшом выносливом поголовье и привыкшая добывать пищу на земле, где голодает континентальная кавалерия." #NT!
 n_nd_sar_piedmont_corvetta_sarda: "Корветта Сарда" #NT!
 n_nd_sar_piedmont_corvetta_sarda_desc: "Корабли Джорджио Де Жене перестроили флот вокруг, удобны в узкой воде и построены для охоты на корсаров, а не для стояния в боевом строю." #NT!
 levy_nd_sar_piedmont_milizia_paesana: "Милиция Леви" #NT!
 levy_nd_sar_piedmont_milizia_paesana_desc: "Называются приходские списки, и сельская местность выходит с мушкетами, выданными ей короной." #NT!
 levy_nd_sar_piedmont_bande_valdesi: "Вальденсские банды" #NT!
 levy_nd_sar_piedmont_bande_valdesi_desc: "Выросли только из окситанскоязычных общин Коттийских Альп, которыми и были вальденсы. Вооруженное меньшинство, а не национальная армия." #NT!
 levy_nd_sar_piedmont_dragoni_sardi: "Сардинский драгун Леви" #NT!
 levy_nd_sar_piedmont_dragoni_sardi_desc: "Островная знать садится верхом и скачет за королем, что является одной из немногих услуг, которые они оказывают без споров." #NT!
 nd_sar_piedmont_destiny: "Корона, собранная по договору" #NT!
 nd_sar_piedmont_destiny_desc: "Брачный контракт, папский грант, который никто на острове не принял, и обмен, подписанный в Гааге людьми, которые не видели ни половины королевства. Ни в одном из инструментов не написано, для чего нужна эта корона. Урегулируйте королевство, и канцелярии придется ответить." #NT!
 nd_sar_piedmont_dest_far_cols: "Дальние рты" #NT!
 nd_sar_piedmont_dest_far_cols_desc: "Каждый проход в этом королевстве проводится только с одного конца. Возьмите Бриансон ниже Монженевра и Мартиньи ниже Большого Сенбернара с тридцатью подразделениями под ружьем, и ни одна дорога через западные Альпы не откроется без разрешения короны." #NT!
 nd_sar_piedmont_dest_sea_gate: "Наша собственная набережная" #NT!
 nd_sar_piedmont_dest_sea_gate_desc: "Шелк идет по дороге Мон-Сени на чужой корабль, а груз заносится в чужую бухгалтерскую книгу. Возьмите Ниццу и Савону с двумя тысячами в казне, и перевалы закончатся у сардинской пристани." #NT!
 nd_sar_piedmont_dest_whole_arc: "Вся арка" #NT!
 nd_sar_piedmont_dest_whole_arc_desc: "Женева была дверью, через которую «Савой» никогда не проходил, а Генуя — портом, о котором никогда не позволялось говорить вслух. Возьмите оба, имея семьдесят пять отрядов на поле боя и стоящую позицию, чтобы их удерживать, и ничто не проникнет в Италию с севера или запада без присмотра." #NT!
 nd_sar_piedmont_dest_perequazione: "Переквационе" #NT!
 nd_sar_piedmont_dest_perequazione_desc: "Измерьте царство: каждый участок, каждого хозяина, каждое качество почвы и никаких льгот ни для кого. Воспользуйтесь печатным станком, поднимите уровень развития королевства до пятисот и проведите реестр по равнине до Павии." #NT!
 nd_sar_piedmont_dest_third_custom: "Третий обычай" #NT!
 nd_sar_piedmont_dest_third_custom_desc: "Корсика улаживает все, что может, в пироге и враждует из-за остального, точно так же, как это делала Сардиния до того, как Элеонора написала свой кодекс. Возьмите Бастию и Корт, бумага которых доходит до ваших рынков, и канцелярия одновременно управляет тремя сводами законов." #NT!
 nd_sar_piedmont_dest_one_bench: "Одна скамейка" #NT!
 nd_sar_piedmont_dest_one_bench_desc: "Каждый судья в Италии прошел обучение в Болонье или Падуе. Возьмите оба, примите Просвещение и поднимите королевство на тысячу уровней развития, и корона назначит людей, которые будут преподавать закон, который она кодифицирует." #NT!
 nd_sar_piedmont.7.t: "Вопрос, который Договор оставил открытым" #NT!
 nd_sar_piedmont.7.d: "Документы, создавшие это королевство, хранятся в Турине: брачный контракт, дар короны папой, с которым никогда не советовались по поводу острова, и обмен, подписанный в Гааге министрами, которые не видели ни одной его половины. Каждый из них говорит, кто правит. Ни один из них не говорит, для чего предназначено королевство.\n\nКанцлерия может ответить землей. Этой короне принадлежат двери Италии, и двери можно удерживать, считать, закрывать и платить за них.\n\nИли она может ответить законом. Эта корона уже управляет двумя народами под двумя кодексами, не притворяясь, что они один народ, и государство, которое может сделать это, может сделать это для любого количества народов.\n\nНебольшие государства попробовали и то, и другое. Ни одно государство не попыталось одновременно удержать Альпы и остров." #NT!
 nd_sar_piedmont.7.a: "Пусть запись покажет, что корона решена" #NT!
 nd_sar_piedmont.8.t: "Дальние рты" #NT!
 nd_sar_piedmont.8.d: "Таможенники сидят в Сузах и Аосте и считают, что попадается по дороге. Того, что приближается к дальней стороне, они не смогут увидеть, пока оно не окажется за седловиной и не окажется среди них. Дверь с замком на одной стороне - это не дверь.\n\nТаким образом, колонны пересекают водораздел в сезон кампании и спускаются по другому склону: к Бриансону под Монженевром, где дофинуа держат гарнизон с тех пор, как кто-либо помнит, и к Мартиньи под Большим Сен-Бернаром, где люди епископа Сиона берут дань, которую корона предпочла бы взять сама.\n\nИнженерам, которые идут с армией, велят измерять дорогу так же осторожно, как и стены. Что бы ни решил мир, корона намерена с точностью до часа знать, сколько времени понадобится армии, чтобы достичь каждой вершины с другой ее стороны." #NT!
 nd_sar_piedmont.8.a: "Держите оба рта при каждом проходе" #NT!
 nd_sar_piedmont.9.t: "Наша собственная набережная" #NT!
 nd_sar_piedmont.9.d: "Это королевство уже три столетия занимается чужой торговлей. «Органзин» идет по дороге Мон-Сени к генуэзскому или французскому судну, а фрахт, страховка и прибыль заносятся в бухгалтерскую книгу, которая хранится где-то в другом месте. Плата за проезд взимается реальными деньгами, но это лишь малая часть того, что проходит.\n\nНицца принадлежит нам с 1388 года, и теперь Ривьера-ди-Поненте принадлежит нам, а это значит, что у подножия гор наконец-то появилось побережье. Что происходит, вот в чем вопрос.\n\nВильфранш имеет самую глубокую якорную стоянку между Тулоном и Генуей и бухту, в которой эскадра может переждать зимний шторм. Купцы хотят совсем другого: свободного порта, никаких пошлин на транзитные товары и никаких вопросов о вере людей, их разгружающих." #NT!
 nd_sar_piedmont.9.a: "Постройте королевскую гавань в Вильфранше." #NT!
 nd_sar_piedmont.9.b: "Объявите свободный порт и не задавайте вопросов" #NT!
 nd_sar_piedmont.10.t: "Оба конца дуги" #NT!
 nd_sar_piedmont.10.d: "Женева была единственной дверью, через которую этот дом так и не прошел. Декабрьской ночью 1602 года лестницы поднялись к стенам и спустились обратно, а на них все еще были люди, и с тех пор город отмечает годовщину с котлом супа и песней о домохозяйке, которая его уронила.\n\nГенуя была единственным портом, о котором короне никогда не разрешалось желать громко, и в конце концов потребовался конгресс Европы, чтобы подписать ее.\n\nУдержание обоих концов меняет то, что представляет собой это королевство. Теперь ничто не проникает в Италию с севера или запада, кроме как мимо сардинского гарнизона. Остается решить, будет ли это стена или магистраль: намерена ли корона закрыть дугу и укомплектовать ее людьми или оставить ее открытой и взимать плату со всех сил в Европе за ее использование." #NT!
 nd_sar_piedmont.10.a: "Возьми весь барьер и закрой его." #NT!
 nd_sar_piedmont.10.b: "Сдать в аренду пропуска и полки" #NT!
 nd_sar_piedmont.11.t: "Мера" #NT!
 nd_sar_piedmont.11.d: "Геодезисты выходят с цепями, планшетами и инструкцией, которая читается как угроза: каждый участок, каждый землевладелец, каждое качество почвы и никаких льгот ни для кого. Объект дворянства, измеряемый феодом, - это феод, облагаемый налогом, что и является намерением, и об этом подробно говорится в петициях, которые подаются и не получают ответа.\n\nЭто занимает поколение. В конце концов, это первое государство в Европе, имеющее полную письменную документацию о себе, переплетенную в тома, дважды скопированную и сохраненную. После этого короне больше никогда не придется спрашивать у землевладельца, сколько у него земли, и никогда больше не придется верить ответу.\n\nЭта мера не ограничивается старой границей. Она идет по равнине в сторону Павии, где закон Ломбардии был записан еще до того, как кто-либо в Турине мог писать, а за геодезистами следуют клерки, несущие второй комплект регистров." #NT!
 nd_sar_piedmont.11.a: "Введите каждое поле в реестре" #NT!
 nd_sar_piedmont.12.t: "Третий обычай" #NT!
 nd_sar_piedmont.12.d: "Корсика управляет собой так же, как Сардиния до того, как Элеонора Арборейская написала свой кодекс. Братья решают то, что могут, старейшины решают то, что они не могут решить, а то, что ни один из них не может урегулировать, становится враждой, которая переживет всех, кто ее начал. Генуя потратила четыреста лет, не сумев изменить это, и оставила после себя башни, гарнизоны и массу негодования.\n\nТеперь остров принадлежит короне, и у канцелярии есть третий корпус обычаев, который приходится учитывать помимо двух, которые она уже имеет.\n\nРеестр может быть проложен по всей Корсике: материковый кодекс, материковые суды, материковые судьи, разъезжающие по округе, независимо от того, просил ли об этом кто-нибудь или нет. Или же этот обычай можно отменить в его нынешнем виде, зарегистрировать как корсиканский закон под печатью короны и обеспечить соблюдение короной именно потому, что теперь он принадлежит короне." #NT!
 nd_sar_piedmont.12.a: "Расширьте код и прокатитесь по трассе" #NT!
 nd_sar_piedmont.12.b: "Запишите обычай и соблюдайте его" #NT!
 nd_sar_piedmont.13.t: "Одна скамейка" #NT!
 nd_sar_piedmont.13.d: "Доктора Болоньи преподавали римское право еще до того, как в этом доме появилось графство, а в Падуе почти столько же времени обучали людей, управляющих Венецией. Оба факультета теперь назначаются короной, и едва ли найдется судья в Италии, который не заседал бы в одном из этих залов.\n\nЭто оставляет вопрос, на который это королевство никогда не отвечало. Со дня своего создания он управлял двумя народами в соответствии с двумя кодексами. Это может продолжаться бесконечно, а может и прекратиться.\n\nЕдиный гражданский кодекс, обязательный для каждого субъекта, сделает закон одинаковым в Кальяри, Казале и Корте, а апелляция будет означать одно и то же во всех трех. Это также положило бы конец четырем столетиям сардинских законов и всем обычаям, которые под ними прятались, и людям, живущим за счет разницы между кодексами, будет что сказать." #NT!
 nd_sar_piedmont.13.a: "Один код, одна скамейка, каждый предмет" #NT!
 nd_sar_piedmont.13.b: "Сохраните коды и держите обе скамейки." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_darsena_reale: "Дарсена Реале" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_darsena_reale: "Стапели, канатная дорога и пороховой склад в Вильфранше, а также эскадрилья, зимующая в бухте, а не стоящая на приколе. Королевству наконец-то есть куда поставить корабли." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_porto_franco: "Свободный порт" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_porto_franco: "За транзитные товары ничего не платят, и никого не спрашивают, где он молится. Причалы в течение десятилетия заполняются людьми со всех берегов Средиземноморья, и архиепископ пишет об этом в Турин примерно раз в месяц." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_barriera_alpina: "Альпийский барьер" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_barriera_alpina: "В каждой долине от озера до моря проходит какая-нибудь работа, на каждой работе есть журнал, а за ними дважды в год вызываются и проверяются ополченцы. Дуга больше не является границей. Это позиция." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_trattati_sussidio: "Договоры о субсидиях" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_trattati_sussidio: "Полки нанимаются в ходе кампании и в зависимости от сезона, в зависимости от того, какая коалиция платит, и корона оставляет за собой право переходить на другую сторону, когда условия улучшатся. Так герцогство стало королевством." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_codice_prevale: "Кодекс преобладает" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_codice_prevale: "Окружные судьи с материка теперь решают то, что раньше решало вражда, и им подчиняются. Армию не вызывали уже целое поколение, и ее офицеры начали это замечать." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_terza_consuetudine: "Третья таможня зарегистрирована" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_terza_consuetudine: "Клерки записывают то, что всегда знали старейшины, статья за статьей, и корона скрепляет это. Обычай не изменился, и теперь за ним стоит армия, больше, чем когда-либо прежде." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_solo_codice: "Один код для всех предметов" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_solo_codice: "Контракт, подписанный в Кальяри, теперь означает именно то, что те же слова означают в Турине. Кредиторы замечают это раньше, чем кто-либо другой, и условия, которые они предлагают короне, соответственно улучшаются." #NT!
 STATIC_MODIFIER_NAME_nd_sar_piedmont_dest_codici_distinti: "Коды сохраняют свою индивидуальность" #NT!
 STATIC_MODIFIER_DESC_nd_sar_piedmont_dest_codici_distinti: "Две скамейки, два кодекса, одна корона, и никаких претензий на то, что подданные одного являются подданными другого. Суды других стран Европы пишут в Турин вопросы, как это делается." #NT!
 nd_sar_piedmont_ospizio: "Оспицио дель Валико" #NT!
 nd_sar_piedmont_ospizio_desc: "Хоспис на вершине перевала, вроде тех, что Бернар Ментонский основал на двух сенбернарах. Каноны, зернохранилище над линией деревьев, шесты для обозначения тропы после снега и люди, которые выходят за не прибывшими путниками. Один пропуск, открытый в феврале, стоит нескольких открытых в июле." #NT!
 nd_sar_piedmont_ospizio_maintenance: "Хоспис" #NT!
 nd_sar_piedmont_ospizio_maintenance_desc: "Дрова, запряженные мулами, зерно и соленое мясо, заложенные до первого снега, и достаточное количество свечей, чтобы поддерживать свет на поворотах дороги." #NT!
 nd_sar_piedmont_archivio: "Архив Корте" #NT!
 nd_sar_piedmont_archivio_desc: "Королевский архив, построенный Виктором Амадеем II в Турине в 1731 году, — одно из первых зданий в Европе, построенных с единственной целью — хранить память о государстве. Договоры, кадастровые реестры, инвестиционные документы и судебные решения собраны в одном несгораемом зале, разложенном на полках, чтобы клерк мог найти любой из них в одно и то же утро." #NT!
 nd_sar_piedmont_archivio_maintenance: "Регистратура" #NT!
 nd_sar_piedmont_archivio_maintenance_desc: "Бумага, прессы, переплетенные реестры и архивариусы, которые всю свою жизнь следят за тем, чтобы документ, поданный в одно царствование, мог быть изготовлен в другое." #NT!
 nd_sar_piedmont.7.a_tt: "Канцелярия сообщает, что королевство основано и заселено." #NT!
 nd_sar_piedmont.8.a_tt: "Дальний вход каждого перевала взят и размещен гарнизон." #NT!
 nd_sar_piedmont.9.a_tt: "Вильфранш построен как королевская военная гавань." #NT!
 nd_sar_piedmont.9.b_tt: "Транзитные товары не облагаются пошлиной, и ни от одного торговца не спрашивают его веры." #NT!
 nd_sar_piedmont.10.a_tt: "Каждая долина дуги закрыта произведением и журналом." #NT!
 nd_sar_piedmont.10.b_tt: "Полки и проезд сдаются в аренду тому, кто платит." #NT!
 nd_sar_piedmont.11.a_tt: "Каждый участок в королевстве измеряется и вносится в реестр." #NT!
 nd_sar_piedmont.12.a_tt: "Судьи с материка объезжают остров по обычаю." #NT!
 nd_sar_piedmont.12.b_tt: "Обычай записан в его нынешнем виде и скреплен короной." #NT!
 nd_sar_piedmont.13.a_tt: "Для каждого подданного короны провозглашается один гражданский кодекс." #NT!
 nd_sar_piedmont.13.b_tt: "Оба кодекса остаются в силе, и корона сохраняет скамейку запасных для каждого." #NT!
  
  # ===== BUREAUCRACIES ===== 
 sar_piedmont_intendenti_bureaucracy: "Интенденты провинции" #NT!
 sar_piedmont_intendenti_bureaucracy_desc: "С 1696 года Виктор Амадей II назначил в каждую провинцию наемного королевского интенданта по французскому образцу, комиссара, который подчинялся Турину и никому на своем месте. Он начислял и собирал налоги, по которым когда-то голосовали провинциальные сословия, проверял счета каждой общины, принимал апелляции, поступившие в феодальную скамью, и вел списки, из которых пополнялись провинциальные полки. В течение одного поколения Савойское государство управлялось более непосредственно, чем любое другое в Италии, и маленькое королевство могло мобилизоваться так же, как большое." #NT!
 sar_piedmont_regio_economato_bureaucracy: "Регион Экономато" #NT!
 sar_piedmont_regio_economato_bureaucracy_desc: "Конкордатом от 29 мая 1727 года Бенедикт XIII уступил Виктору Амадею II, что плоды каждого вакантного епископства и аббатства будут храниться под королевской опекой и управляться экономикой, назначенной короной, и подтвердил Савойскому дому право выдвигать кандидатуры на кафедры. Остров был организован таким же образом с 1733 года под управлением генерального консерватора, а Карл Эммануил III возобновил поселение в 1741 году. Расположенный рядом с королевской плацдармом, который сдерживал любую буллу, которую корона не прочитала, он сделал церковь королевства ответственной перед Турином как в своем кошельке, так и в своих назначениях." #NT!
 sar_piedmont_ordine_mauriziano_bureaucracy: "Ordine dei Santi Maurizio e Lazzaro" #NT!
 sar_piedmont_ordine_mauriziano_bureaucracy_desc: "Булла Pro Commissa Nobis от 13 ноября 1572 года присоединила Савойский орден Святого Мориса к госпитальерскому ордену Святого Лазаря, а с января 1573 года титул Великого Магистра был передан Савойскому дому навечно. Эммануэль Филибер вернул себе лазаритские командоры в качестве средства к существованию для своих рыцарей, открыл госпиталь ордена в Турине в 1575 году и содержал монастырский дом в цитадели Ниццы для морской службы и еще один в Турине для службы на берегу. Две галеры, «Пьемонтская» и «Маргарита», шли под знаменами ордена на папской службе против турок." #NT!
 sar_piedmont_magistrato_riforma_bureaucracy: "Магистрато делла Риформа" #NT!
 sar_piedmont_magistrato_riforma_bureaucracy_desc: "Виктор Амадей II перестроил Туринский университет между 1717 и 1720 годами и назначил магистрата делла Риформа над всем преподаванием в своих штатах, которому было поручено не допускать в него религиозных орденов. Постановление 1729 года передало каждую школу в подчинение университета и требовало, чтобы каждый школьный учитель имел королевский диплом из Турина, в то время как Колледжо делле провинции принимал студентов из-за пределов столицы за счет короны, которые возвращались, чтобы укомплектовать интендантства и скамейки. Ученые назвали это поселение архетипом итальянской государственной школы." #NT!
  
