l_russian:
 GOT: "Готия" #NT!
 GOT_ADJ: "Вестготский" #NT!
 GOT_f: "Королевство Готия" #NT!
 GOT_f_desc: "Короли Астурии, Леона и Кастилии никогда не заявляли о завоевании Иберии. Они утверждали, что восстанавливают его, считая себя законными наследниками готских королей Толедо, и именно этот аргумент о престолонаследии сделал Реконкисту вопросом закона, а не аппетита. Кастильская или леонская корона, которая вернет себе полуостров, захватит Гранаду и двинется обратно через Пиренеи к Нарбонне, может перестать называть это завоеванием и просто завершить его: Толедо будет восстановлен как королевский город, Судебная книга будет переиздана как закон всего королевства, а Септимания снова станет готической. Это более старая и странная альтернатива Испании: корона основывается на церковных соборах, письменном кодексе и готическом наследовании, а не на браке двух династий." #NT!
