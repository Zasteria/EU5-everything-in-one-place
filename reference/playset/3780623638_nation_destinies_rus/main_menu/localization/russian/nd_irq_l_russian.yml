l_russian:
  
  # ============================================================ 
  # Formation event 
  # ============================================================ 
 nd_irq.1.t: "Город мира" #NT!
 nd_irq.1.d: "Переделан лодочный мост через Тигр и хутба читается под новым названием. В Ираке снова есть правительство.\n\nЧего у него нет, так это того, что сделало его богатым. Савад был самой прибыльной налоговой провинцией в исламском мире в течение трехсот лет, потому что каналы работали. В 937 году в жестокой войне между двумя турецкими полководцами Нахраван был перерезан. Никто, у кого были деньги на его ремонт, никогда не удерживал позиции достаточно долго, чтобы попытаться. К приходу монголов налоговые поступления уже упали вдвое; Хулагу унаследовал труп и был обвинен в убийстве.\n\nТаким образом, новое государство должно решить, для чего нужен Багдад. Аль-Мансур назвал это место Мадинат ас-Салам, Городом Мира, и в течение двух столетий это было сразу два города: резиденция Повелителя правоверных и место, где в одной комнате спорили несторианский врач, сабианский астроном и персидский грамматик, и все получали деньги из казны. Эти два Багдада не пали вместе, и они не могут быть восстановлены первыми.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_irq.1.a: "Дар аль-Хилафа: Багдад снова правит исламом" #NT!
 nd_irq.1.a_tt: "Престиж, легитимность, контроль и облегчение войны против других конфессий. К шиитам в городах-святынях относятся меньше." #NT!
 nd_irq.1.b: "Мадинат аль-Салам: Багдад снова учит этому" #NT!
 nd_irq.1.b_tt: "Исследования, грамотность, институты и широкая толерантность к другим конфессиям. Меньше мужчин отвечают на призыв." #NT!
  
  # ============================================================ 
  # Advance events 
  # ============================================================ 
 nd_irq.2.t: "Разлом в Нахраване" #NT!
 nd_irq.2.d: "Инженеры прошли путь от отвода Тигриса мимо Бакубы до старого хвоста Васита, и их отчет не обнадеживает. Двести километров русла местами заилены до верха, регуляторы разграблены ради кладки, на русло переселены целые деревни, потому что русло — единственная почва, которая еще удерживает влагу.\n\nЕго можно копать. Его уже выкопали. Вопрос, на который диван не может ответить, заключается в том, кто платит, и у Ирака всегда было только два ответа. Аббасиды в своих силах собрали деревни барщиной и за сезон открыли канал. Аббасиды в своей слабости продали сооружения людям, владевшим землей рядом с ними, и так и не получили воду обратно." #NT!
 nd_irq.2.a: "Соберите деревни. Государство роет свой канал." #NT!
 nd_irq.2.a_tt: "Более быстрое строительство, более высокие доходы и более жесткий контроль. Деревни Савада помнят барщину." #NT!
 nd_irq.2.b: "Передавайте работы землевладельцам за долю урожая." #NT!
 nd_irq.2.b_tt: "Выше производство, процветание и развитие. Корона уступает позиции землевладельцам." #NT!
  
 nd_irq.3.t: "Четыре двери" #NT!
 nd_irq.3.d: "Школа Аль-Мустансира открылась в 1234 году с чего-то, чего не пыталась сделать ни одна школа: четыре айвана в одном дворе, по одному для каждой из суннитских юридических школ, чтобы ханафит и ханбалит пересекали одну и ту же мостовую, направляясь преподавать. За ними стояли библиотека, больница и аптека. Монголы много сожгли, и это сохранилось; он все еще стоит на левом берегу.\n\nПреподавательские должности вакантны, а пожертвования переданы в дар короны. Тот, кого пригласят в эти двери, определит, что означает иракское образование на следующие три столетия." #NT!
 nd_irq.3.a: "Вырезаем пятую дверь. Привлеките юристов Хиллы." #NT!
 nd_irq.3.a_tt: "Исследования, грамотность и толерантность шиитов. Православное духовенство менее преданно." #NT!
 nd_irq.3.b: "Сделайте это судебной академией королевства." #NT!
 nd_irq.3.b_tt: "Законотворчество, стабильность и контроль. К шиитам в городах-святынях относятся меньше." #NT!
  
 nd_irq.4.t: "Пороги" #NT!
 nd_irq.4.d: "Их называют Атабат, пороги: Али в Наджафе на краю пустыни, Хусейн в Кербеле, два имама в Казимайне через воду от Багдада, святилище Аскари в Самарре. Четыре священных города в сотне миль от столицы, каждый со своими семьями-хранителями, своими пожертвованиями и собственной тихой дипломатией.\n\nОни не только религиозны. Деньги приходят из Авада в Индии и из Исфахана. Трупы прибывают караваном для захоронения в Долине Мира, и люди, которые их несут, приносят новости. Правитель Багдада, который игнорирует города-святыни, игнорирует самое богатое и имеющее лучшие связи учреждение в своей стране." #NT!
 nd_irq.4.a: "Наделяйте их, назначайте хранителей, принимайте пожертвования." #NT!
 nd_irq.4.a_tt: "Преданность, престиж и доходы храма. Священные города становятся неспокойными под руководством назначенной руки." #NT!
 nd_irq.4.b: "Оставьте им собственное правительство. Идите по дорогам паломников." #NT!
 nd_irq.4.b_tt: "Сухопутная торговля, процветание и положение за границей. Корона отказывается от своих прав на пожертвования." #NT!
  
 nd_irq.5.t: "Устье залива" #NT!
 nd_irq.5.d: "Все, что достигает Багдада из Индии, сначала останавливается в истоке Залива, потому что корпус, построенный для открытого моря, не может преодолевать отмели нижних рек, а речное судно не может пройти Залив. Перегрузка происходит в Басре независимо от того, планирует это кто-то или нет.\n\nЧто изменилось, так это то, что европейская держава теперь сидит в проливе и взимает плату за проход. На реях можно построить гураб, весельный, тяжеловооруженный и достаточно мелкий для бара, который побьет все, что находится на плаву, в закрытой воде и сильно проиграет за ее пределами. Или порт можно открыть для каждого флага, при том понимании, что таможня зарабатывает больше денег, чем эскадра." #NT!
 nd_irq.5.a: "Держи штангу. Без нашего разрешения никто не пройдет." #NT!
 nd_irq.5.a_tt: "Более сильные галеры, более жесткие блокады и большее присутствие на море. Страна устала от боевых действий." #NT!
 nd_irq.5.b: "Откройте рейд. Каждый флаг приземляется, и каждый флаг приносит пользу." #NT!
 nd_irq.5.b_tt: "Торговая держава, морская торговля и убежище для иностранных религий. Соседи думают о нас меньше." #NT!
  
 nd_irq.6.t: "Домашнее хозяйство" #NT!
 nd_irq.6.d: "Хасан-паша приехал из Стамбула губернатором и начал покупать грузинских мальчиков. Он заставил их обратиться в христианство, дать им образование, обучить их верховой езде и счетам, а также поженить членов семей друг друга. В течение одного поколения его кулы были единственной компетентной администрацией между Мосулом и Персидским заливом, а в течение двух лет они выбирали губернатора.\n\nЭто старейшее соглашение в регионе, и оно ни разу не закончилось так, как задумал покупатель. Домохозяйство лояльное, дисциплинированное и эффективное. Кроме того, это все больше и больше государство, и у него нет родословной, которую можно было бы поклясться." #NT!
 nd_irq.6.a: "Пусть домохозяйство управляет. Оно хорошо управляет." #NT!
 nd_irq.6.a_tt: "Тяжелая кавалерия, дисциплина и коронные сословия. Купленный дом – это не династия." #NT!
 nd_irq.6.b: "Посадите шейхов племени рядом с ним и сбалансируйте их." #NT!
 nd_irq.6.b_tt: "Большие поборы, больше рабочей силы и довольное дворянство. Диван ничего не решает быстро." #NT!
  
 nd_irq.7.t: "Индийский канал" #NT!
 nd_irq.7.d: "Пятьсот тысяч рупий прибыли из Авада, посланные министрами, которые никогда не увидят Ирак, чтобы прорезать канал от Евфрата до Наджафа, чтобы в городе-святыне была вода. Это сработало лучше, чем кто-либо хотел. Реке новое русло понравилось, и она стала отдавать ему предпочтение. Пустыня между Наджафом и Кербелой была распахана в течение десяти лет, и суннитские племена переехали сюда, чтобы возделывать ее.\n\nВниз по течению на старом рукаве Хилла вода падает. Сады там аббасидские. Удержание обоих каналов означает строительство каменного регулятора на развилке, работу такого масштаба, которую никто в Ираке не предпринимал со времен халифов, и платить за нее серебром, которого у казны нет." #NT!
 nd_irq.7.a: "Пусть Хиндия рулит. Наджаф цветет, а Хилла потеряна." #NT!
 nd_irq.7.a_tt: "Рост населения, развитие и преданность. Города на старой ветке приходят в упадок." #NT!
 nd_irq.7.b: "Постройте регулятор на развилке и удерживайте обе ветви." #NT!
 nd_irq.7.b_tt: "Скорость построения, процветание и развитие. За это платит монетный двор." #NT!
  
  # ============================================================ 
  # Formation variables 
  # ============================================================ 
 nd_irq_formed_tt: "Ирак образовался." #NT!
 nd_irq_path_a_tt: "Цель основания: Дар аль-Хилафа, политическая столица." #NT!
 nd_irq_path_b_tt: "Цель основания: Мадинат аль-Салам, столица цивилизации." #NT!
  
  # ============================================================ 
  # Timed modifiers 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_irq_dar_al_khilafa: "Дар аль-Хилафа" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dar_al_khilafa: "Дом Халифата. Багдад снова претендует на право быть третейским судьей между мусульманскими правителями, и шииты городов-святынь слышат это требование именно так, как оно подразумевается." #NT!
 STATIC_MODIFIER_NAME_nd_irq_madinat_al_salam: "Мадинат аль-Салам" #NT!
 STATIC_MODIFIER_DESC_nd_irq_madinat_al_salam: "Его дал Город Мира под названием аль-Мансур. Переводчикам, врачам и канцтоварам платят раньше, чем солдатам, а казармы опустошаются первыми." #NT!
  
 STATIC_MODIFIER_NAME_nd_irq_corvee_of_the_sawad: "Барщина Савада" #NT!
 STATIC_MODIFIER_DESC_nd_irq_corvee_of_the_sawad: "Деревни собраны с корзинами и веревками, а канал открыт в сезон. Савад помнит, как его собирали." #NT!
 STATIC_MODIFIER_NAME_nd_irq_farmed_waterworks: "Фермерские водопроводные станции" #NT!
 STATIC_MODIFIER_DESC_nd_irq_farmed_waterworks: "Землевладельцы роют собственный канал ради постоянной доли урожая. Его продолжают выкапывать, и корона больше никогда не решает в одиночку, куда направить воду." #NT!
 STATIC_MODIFIER_NAME_nd_irq_the_fifth_door: "Пятая дверь" #NT!
 STATIC_MODIFIER_DESC_nd_irq_the_fifth_door: "Юристы-имамиты Хиллы преподают во дворе Мустансирии рядом с четырьмя суннитскими школами. Ни одно другое медресе на земле не вмещает их всех." #NT!
 STATIC_MODIFIER_NAME_nd_irq_school_of_the_qadis: "Школа Кади" #NT!
 STATIC_MODIFIER_DESC_nd_irq_school_of_the_qadis: "Каждый судья в королевстве имеет лицензию, подписанную в одном дворе, и этот двор решает, какой закон." #NT!
 STATIC_MODIFIER_NAME_nd_irq_patron_of_the_thresholds: "Покровитель порогов" #NT!
 STATIC_MODIFIER_DESC_nd_irq_patron_of_the_thresholds: "Корона наделяет святыни, назначает их хранителей и хранит пожертвования. Семьи-хранители не прощают, чтобы их назначали." #NT!
 STATIC_MODIFIER_NAME_nd_irq_road_of_the_pilgrims: "Дорога паломников" #NT!
 STATIC_MODIFIER_DESC_nd_irq_road_of_the_pilgrims: "Города-святыни имеют собственное правительство. Государство сопровождает караваны из Ирана и Индии и взимает пошлины, которые оплачиваются лучше, чем могли бы получить пожертвования." #NT!
 STATIC_MODIFIER_NAME_nd_irq_squadron_at_the_bar: "Эскадрон в Баре" #NT!
 STATIC_MODIFIER_DESC_nd_irq_squadron_at_the_bar: "Канонерские лодки с веслами удерживают Шатт-эль-Араб там, где он встречается с соленой водой. Ничто не проходит без разрешения, и ссора из-за этого никогда не прекращается." #NT!
 STATIC_MODIFIER_NAME_nd_irq_open_roadstead: "Открытый рейд" #NT!
 STATIC_MODIFIER_DESC_nd_irq_open_roadstead: "Басра забирает все флаги и защищает каждый корпус вверх по реке. Таможня зарабатывает больше, чем флот, и соседи называют это слабостью." #NT!
 STATIC_MODIFIER_NAME_nd_irq_rule_of_the_kuls: "Правление Кулов" #NT!
 STATIC_MODIFIER_DESC_nd_irq_rule_of_the_kuls: "Купленный дом владеет диваном, казной и наследованием. Он управляет Ираком лучше, чем Стамбул, и не может создать династию." #NT!
 STATIC_MODIFIER_NAME_nd_irq_divan_of_shaykhs: "Диван шейхов" #NT!
 STATIC_MODIFIER_DESC_nd_irq_divan_of_shaykhs: "Мунтафик, Хазаил и Зубайд сидят во дворе рядом с домом. Вместе они могут собрать каждого гонщика в Ираке и быстро ни о чем не договориться." #NT!
 STATIC_MODIFIER_NAME_nd_irq_waters_to_najaf: "Воды в Наджаф" #NT!
 STATIC_MODIFIER_DESC_nd_irq_waters_to_najaf: "Евфрат занимает новое русло. Пустыня между городами-святынями распахивается, а старая ветвь Хиллы остается в иле." #NT!
 STATIC_MODIFIER_NAME_nd_irq_regulator_at_the_fork: "Регулятор на развилке" #NT!
 STATIC_MODIFIER_DESC_nd_irq_regulator_at_the_fork: "Каменный шлюз удерживает оба рукава Евфрата открытыми, это крупнейшее гидротехническое сооружение в Ираке со времен халифов, и оно оплачивается монетами, которые казначейство должно было чеканить." #NT!
  
  # ============================================================ 
  # Advances 
  # ============================================================ 
 nd_irq_sawad_cadastre: "Исследование Савада" #NT!
 nd_irq_sawad_cadastre_desc: "Измеренный кадастр Ануширвана, наложенный на Месопотамию, унаследованный целиком в результате арабского завоевания и действующий от дивана аль-хараджа: каждый джариб орошаемой земли в рулоне и налог, установленный на измерении." #NT!
 nd_irq_nahrawan_breach: "Разлом в Нахраване" #NT!
 nd_irq_nahrawan_breach_desc: "Канал, по которому вода Тигра перекачивалась на двести километров для питания столицы, был прорезан в 937 году во время войны между двумя турецкими полководцами и так и не был отремонтирован должным образом. Восстановление главных регуляторов является основополагающим актом этой страны." #NT!
 nd_irq_nakhil_husbandry: "Пальмовое хозяйство" #NT!
 nd_irq_nakhil_husbandry_desc: "Финиковую пальму размножают побегами, а не семенами, и сажают в трехъярусном саду: цитрусовые под пальмами, а овощи под цитрусовыми. Плодоносит на засоленной почве в засушливом воздухе, чего не сделает ни одно садовое дерево." #NT!
 nd_irq_bataih_refuge: "Батаих" #NT!
 nd_irq_bataih_refuge_desc: "Пояс болот между Куфой, Васитом и Басрой, где Зандж удерживал четырнадцать лет из столицы, которой не могла достичь ни одна кавалерийская армия. Кто знает дороги, тому принадлежит земля." #NT!
 nd_irq_mudhif_halls: "Залы Рида" #NT!
 nd_irq_mudhif_halls_desc: "Мудхиф — это зал из связок тростника, возведенный на острове из циновок и грязи и перестраиваемый каждое поколение. Это укрепление в такой же степени, как и гостевой дом, и армия, которая хочет, должна пробираться к нему." #NT!
 nd_irq_kuttab_of_the_diwan: "Писцы Дивана" #NT!
 nd_irq_kuttab_of_the_diwan_desc: "Класс секретарей, который фактически управлял халифатом. Ибн Мукла зафиксировал пропорции арабского письма, поэтому документ, написанный в Басре, считался авторитетным в Багдаде; здесь бюрократия — это литературная профессия с домашним стилем." #NT!
 nd_irq_mustansiriya_revived: "Мустансирия" #NT!
 nd_irq_mustansiriya_revived_desc: "Школа Аль-Мустансира, открытая в 1234 году, стала первой в мире, где все четыре школы суннитского права преподавали под одной крышей с библиотекой, больницей и аптекой. Он пережил 1258 год и стоит до сих пор." #NT!
 nd_irq_warraqin_quarter: "Квартал канцелярских товаров" #NT!
 nd_irq_warraqin_quarter_desc: "Производители бумаги Харуна аль-Рашида работали на льняных и конопляных тряпках, потому что это то, что было в Ираке. На рынке, который рос вокруг них, было более сотни магазинов, и аль-Джахиз арендовал один на день, чтобы ознакомиться с товарами." #NT!
 nd_irq_atabat_compact: "Пороги" #NT!
 nd_irq_atabat_compact_desc: "Наджаф, Кербела, Казимайн и Самарра: четыре города-святыни в центре страны, привлекающие паломников, пожертвования и трупы из Ирана и Индии. Государство здесь либо примиряется с ними, либо борется с ними вечно." #NT!
 nd_irq_ayyarun_brotherhoods: "Айярун" #NT!
 nd_irq_ayyarun_brotherhoods_desc: "Вооруженные молодые люди из кварталов Багдада, наполовину братство, наполовину банда, связанные клятвой футува. Они управляли городом, когда халиф не мог этого сделать, и укомплектовывали стены в осаде за осадой." #NT!
 nd_irq_baghdad_atelier: "Багдадское ателье" #NT!
 nd_irq_baghdad_atelier_desc: "Султан Ахмад Джалаир держал в Багдаде мастерскую живописи и писал для нее стихи. В рукописях, созданных там около 1400 г., персидская миниатюра перестает быть украшением и становится картиной." #NT!
 nd_irq_ubulla_roadstead: "Рейд Убулла" #NT!
 nd_irq_ubulla_roadstead_desc: "Набережная в истоке залива, который географы называли одним из четырех земных рая. Туда переваливают всё из Индии, потому что морской корпус не может поднять мели вверх по течению." #NT!
 nd_irq_ghurab_squadron: "Эскадрилья Гураба" #NT!
 nd_irq_ghurab_squadron_desc: "Ворон: весельное артиллерийское судно, достаточно мелкое для бара Шатт-эль-Араб и достаточно вооруженное, чтобы спорить с каракой в ​​закрытой воде. С их помощью Басра боролась за устье реки на протяжении двух столетий." #NT!
 nd_irq_muntafiq_emirate: "Эмират Мунтафик" #NT!
 nd_irq_muntafiq_emirate_desc: "Конфедерация нижнего Евфрата, состоявшая частично из оседлых земледельцев и частично из верблюжьих кочевников, которая пережила каждого губернатора, посланного против нее, и удерживала дорогу между Басрой и пустыней." #NT!
 nd_irq_walls_of_baghdad: "Стены Багдада" #NT!
 nd_irq_walls_of_baghdad_desc: "Город переходил из рук в руки в результате осады в 1508, 1534, 1623 и 1638 годах, а последнее нападение Мурада IV стоило ему трети его армии. Город, осажденный каждым следующим поколением, прежде всего держит свои цистерны полными." #NT!
 nd_irq_muqasama_assessment: "Мукасама" #NT!
 nd_irq_muqasama_assessment_desc: "Аль-Махди заменил фиксированный налог на площадь долей фактического урожая: половина на орошаемых паводками землях, треть под водяным колесом, четверть под колесом животных. Казначейство теперь теряет, когда канал заиливается, и это единственная мера, которая заставляет его проводить дноуглубительные работы." #NT!
 nd_irq_afrasiyab_basra: "Афрасиаб Басра" #NT!
 nd_irq_afrasiyab_basra_desc: "В течение семидесяти лет Басрой управляла семья, которая отвечала на запросы Стамбула только тогда, когда это было им выгодно, и держала порт открытым для португальских, голландских и английских факторов, персидских паломников и армянских посредников." #NT!
 nd_irq_attabiya_looms: "Аттаби Ткачество" #NT!
 nd_irq_attabiya_looms_desc: "Размоченная полоса шелка, положенная на хлопок, названная в честь квартала Багдада, в котором ее ткали, и протянувшаяся настолько далеко, что это слово дошло до английского как полосатый. Это единственный роскошный текстиль, который может производить хлопковая страна, где почти нет шелка." #NT!
 nd_irq_desert_crossing: "Пересечение пустыни" #NT!
 nd_irq_desert_crossing_desc: "Дорога из Багдада в Алеппо проходит прямо через сирийскую пустыню, а не вдоль рек на север, и экономит шесть недель любому, кто осмелится это сделать. К 1780-м годам письма Лондона в Бомбей пошли именно таким путем." #NT!
 nd_irq_shrine_awqaf: "Пожертвования храма" #NT!
 nd_irq_shrine_awqaf_desc: "Кто назначает хранителя, кто считает подношения, чьи паломники допускаются. За пожертвования в архивах боролись так же жестко, как за любую границу, а деньги, стоящие за ними, поступали из Авада и Исфахана." #NT!
 nd_irq_bitumen_of_hit: "Битум хита" #NT!
 nd_irq_bitumen_of_hit_desc: "Сипы существовали со времен Вавилона и описаны Геродотом. Смола заделала все суда на Евфрате и все боны, построенные в Басре. Именно так страна, где нет сосновых лесов, обеспечивает водонепроницаемость флота." #NT!
 nd_irq_kul_household: "Домашнее хозяйство" #NT!
 nd_irq_kul_household_desc: "Хасан-паша покупал грузинских мальчиков, обращал их в другую веру, обучал их и женил на семьях друг друга. В течение одного поколения кулы выбирали губернатора Багдада." #NT!
 nd_irq_hindiyya_channel: "Канал Хиндия" #NT!
 nd_irq_hindiyya_channel_desc: "Деньги, отправленные из Авада, проложили канал в Наджаф в 1790-х годах. Это сработало так хорошо, что Евфрат изменил русло, пустыня между городами-святынями превратилась в сельскохозяйственные угодья, а старая ветвь Хиллы начала умирать." #NT!
 nd_irq_mamluk_pashalik: "Мамлюк Пашалик" #NT!
 nd_irq_mamluk_pashalik_desc: "Паши Багдада правили как династия во всем, кроме названия: они собирали дань, назначали судей и воевали с Персией самостоятельно, не спрашивая, могут ли они это сделать." #NT!
 nd_irq_basra_customs_farm: "Таможня Басры" #NT!
 nd_irq_basra_customs_farm_desc: "Самая богатая ферма в Ираке с единственным доходом, и тот, кто ею владеет, может заплатить за армию. Все, что перемещалось между Персидским заливом и Багдадом, приходилось взвешивать на этой пристани." #NT!
 nd_irq_najaf_hawza: "Хауза Наджафа" #NT!
 nd_irq_najaf_hawza_desc: "Преподавательские кружки обосновались в Наджафе, и за старшим юристом приехали следить из Лакхнау до Джабаль-Амиля. Семинария, не имеющая за собой государства, стала самой широкой властью в исламе после самого султаната." #NT!
 nd_irq_midhat_land_code: "Земельный кодекс" #NT!
 nd_irq_midhat_land_code_desc: "Соплеменникам предлагались права собственности на землю, которую их кланы совместно обрабатывали на протяжении веков. Шейхи зарегистрировали его на свое имя, и реформа, направленная на создание мелких землевладельцев, создала землевладельцев." #NT!
 nd_irq_zawra_press: "Аль-Заура" #NT!
 nd_irq_zawra_press_desc: "Пресс прибывает в дом правительства в 1869 году и печатает первую газету в Ираке. Переписчики на рынке канцелярских товаров воспроизводили книги по одной на протяжении тысячи лет." #NT!
 nd_irq_river_steamers: "Речные пароходы" #NT!
 nd_irq_river_steamers_desc: "Колёсные пароходы на Тигре превращают месяц плавания на плоту и по тропе в четыре дня. Зерно, которое раньше никогда не могло попасть в порт, вдруг может попасть в порт, и вся география страны снова перестраивается вокруг двух рек." #NT!
 nd_irq_conscription_of_the_tribes: "Призыв племен" #NT!
 nd_irq_conscription_of_the_tribes_desc: "Призыв достигает Ирака, и племена отвечают двадцатилетним восстанием. Государство, которому нужны солдаты из Мунтафика и Шаммара, должно размещать гарнизоны на территории, откуда оно набирает рекрутов, и, в конце концов, оно получает людей." #NT!
 nd_irq_saniyya_domain: "Домен Санияя" #NT!
 nd_irq_saniyya_domain_desc: "Корона забирает себе лучшую землю: мелиорированные болота, фасад канала, пальмовый пояс Шатт-эль-Араб, которым управляет напрямую и не платит провинциальных налогов. Частная империя внутри государственной." #NT!
  
  # ============================================================ 
  # Buildings 
  # ============================================================ 
 nd_irq_nahrawan_headworks: "Канал-Хед-Воркс" #NT!
 nd_irq_nahrawan_headworks_desc: "Регуляторы из каменной кладки на водозаборе, чтобы инженер мог решить, сколько реки впадает в канал, и перекрыть его, когда паводок спадет. Можно строить только там, где есть река или озеро." #NT!
 nd_irq_kharaj_diwan: "Харадж Диван" #NT!
 nd_irq_kharaj_diwan_desc: "Регистр орошаемых земель: геодезические веревки, налоговые ведомости и клерки, которые их хранят. Оно знает, что должен каждый джариб округа и сколько он заплатил." #NT!
 nd_irq_nakhil_grove: "Финиковая пальмовая роща" #NT!
 nd_irq_nakhil_grove_desc: "Пальмы, посаженные рядами вдоль берега реки на земле, слишком засоленной и слишком сухой для любого фруктового сада, с цитрусовыми и овощами в их тени. Басра отправляла финики даже в Китай." #NT!
 nd_irq_suq_al_warraqin: "Сук аль-Варракин" #NT!
 nd_irq_suq_al_warraqin_desc: "Рынок канцелярских товаров: переписчики, работающие на заказ в витринах, книготорговцы и читатели, которые рассматривают ассортимент книготорговцев как библиотеку, которую можно взять напрокат. В оригинальном Багдаде находилось более сотни магазинов." #NT!
 nd_irq_mustansiriya: "Аль-Медраса аль-Мустансирия" #NT!
 nd_irq_mustansiriya_desc: "Четыре айвана в одном дворе для четырех юридических школ, за ними библиотека, больница и аптека. Его можно построить только в Багдаде, потому что он там только один." #NT!
 nd_irq_atabat_hadra: "Святилище" #NT!
 nd_irq_atabat_hadra_desc: "Обнесенная стеной хадра великой гробницы с ее жилищем, кухней, могильником и семьями хранителей. Можно построить только в городах-святынях: Куфе, Кербеле, Багдаде и Самарре." #NT!
 nd_irq_mudhif_redoubt: "Редут Мудхиф" #NT!
 nd_irq_mudhif_redoubt_desc: "Тростниковый зал на искусственном острове с обслуживающими его дамбами и каналами для лодок. Можно строить только на водно-болотных угодьях, что в Ираке означает Батаих, и нигде больше." #NT!
 nd_irq_ubulla_wharf: "Убулла-Уорф" #NT!
 nd_irq_ubulla_wharf_desc: "Перегрузочная пристань в верхней части залива, где морские корпуса передают свой груз речным судам, которые могут доставить мели вверх по течению, и где верфи строят и то, и другое." #NT!
 nd_irq_attabiya_workshop: "Аттабия вырисовывается" #NT!
 nd_irq_attabiya_workshop_desc: "Мастерицы-ткачи укладывают шелковую полосу на хлопчатобумажную основу. Можно построить только там, где на рынке есть хлопок, в этом и состоит весь смысл рецепта аттаби." #NT!
  
  # ============================================================ 
  # Production methods 
  # ============================================================ 
 nd_irq_headworks_maintenance: "Дноуглубительные работы и облицовка" #NT!
 nd_irq_headworks_maintenance_desc: "Ил поднимается корзиной, берега облицованы кирпичом и тростниковым ковриком, шлюзовые ворота перевешиваются каждый сезон. Канал, который не вырыт дноуглубительными работами, — это поле, которое останется в течение десятилетия." #NT!
 nd_irq_diwan_maintenance: "Налоговые ведомости" #NT!
 nd_irq_diwan_maintenance_desc: "Бухгалтерские книги, печати и мерные веревки, а также бумагу для трехкратного копирования оценки, чтобы в деревне, районе и казне было по одной." #NT!
 nd_irq_nakhil_harvest: "Посадка ответвлений" #NT!
 nd_irq_nakhil_harvest_desc: "Новые пальмы выращены не из камней, а из побегов проверенных матерей, поэтому роща сохраняет свое разнообразие. Альпинисты обрабатывают кроны веревкой и ножом во время опыления и снова во время сбора урожая." #NT!
 nd_irq_nakhil_canal_fed: "Канал-Фед Гроув" #NT!
 nd_irq_nakhil_canal_fed_desc: "Срезанная ветка доставляет воду прямо к корням, а не покидает пальмы, чтобы найти уровень грунтовых вод, и ряды можно посадить глубже вглубь суши. Плотные деревянные подпорки удерживают берега." #NT!
 nd_irq_warraqin_copying: "Копировщики на заказ" #NT!
 nd_irq_warraqin_copying_desc: "Покупатель называет заголовок, и писец воспроизводит его чернилами, желчью и сажей в переплете из тисненой кожи. По одной копии за раз, поэтому большая библиотека занимает целую жизнь." #NT!
 nd_irq_warraqin_press: "Пресса" #NT!
 nd_irq_warraqin_press_desc: "Литой шрифт и винтовой пресс в тех же витринах, где работали переписчики. Годовая продукция становится недельной, а переписчики становятся наборщиками или ничем." #NT!
 nd_irq_mustansiriya_maintenance: "Медресе, библиотека и Бимаристан" #NT!
 nd_irq_mustansiriya_maintenance_desc: "Стипендии для четырех факультетов, бумага и переплет для библиотеки, а также стекло и готовые лекарства, которые потребляют больница и аптека." #NT!
 nd_irq_hadra_maintenance: "Храмовая служба" #NT!
 nd_irq_hadra_maintenance_desc: "Лампы, благовония, тканевое покрытие сундука гробницы, обновленное к годовщине, и мрамор для мощения, протертый тысячей лет ног." #NT!
 nd_irq_mudhif_maintenance: "Резка тростника" #NT!
 nd_irq_mudhif_maintenance_desc: "Касаб разрезают, связывают и переставляют каждые несколько лет, потому что тростник гниет. Из того же материала изготавливаются маты, насыпь дамбы и крыша каждого дома в поселке." #NT!
 nd_irq_wharf_maintenance: "Веревка и такелаж" #NT!
 nd_irq_wharf_maintenance_desc: "Импортная древесина для корпусов, которую невозможно вырастить на месте, веревки из речного волокна, а также склады смолы и снастей, рабочий причал горит насквозь." #NT!
 nd_irq_wharf_bitumen_caulking: "Битумное уплотнение" #NT!
 nd_irq_wharf_bitumen_caulking_desc: "Смола из Хита просачивается на замену импортным магазинам. Это ближе, дешевле и лучше, и именно поэтому страна, где нет соснового леса, все еще может сохранять корпуса прочными." #NT!
 nd_irq_attabi_weaving: "Аттаби Плетение" #NT!
 nd_irq_attabi_weaving_desc: "Полосу шелковой основы укладывают на хлопковую основу, а затем каландрируют, чтобы полоса смачивалась. Немного шелка имеет большое значение, и именно это делает ткань вообще возможной здесь." #NT!
  
  # ============================================================ 
  # Units and levies 
  # ============================================================ 
 a_nd_irq_madan_marshmen: "Маданские болотники" #NT!
 a_nd_irq_madan_marshmen_desc: "Застрельщики Батаиха на тростниковых лодках, которые сражаются из машхуфа и вдоль дорог, которые только они могут найти. На открытой равнине это люди без доспехов с рыбьими копьями." #NT!
 levy_nd_irq_madan_marshmen: "Мадан Леви" #NT!
 levy_nd_irq_madan_marshmen_desc: "Выращены только из населения, живущего на самих болотах. Набор - это Батаих, а не национальное ополчение с болотным названием." #NT!
 a_nd_irq_ayyarun: "Айярун" #NT!
 a_nd_irq_ayyarun_desc: "Заклятые братства городских кварталов. Свирепы за баррикадой и бесполезны в полевом строю: они подрывают боевой дух врага и не могут взять на себя атаку." #NT!
 levy_nd_irq_ayyarun: "Айярун Леви" #NT!
 levy_nd_irq_ayyarun_desc: "Набрано из горожан и рабочих, живущих за стенами, а не из сельской местности, потому что именно там находятся домики футувва." #NT!
 a_nd_irq_muntafiq_horse: "Мунтафикская лошадь" #NT!
 a_nd_irq_muntafiq_horse_desc: "Всадники на краю пустыни, которые решают, состоится ли битва вообще, и проигрывают ее, когда вместо этого выбор получает враг." #NT!
 levy_nd_irq_muntafiq_horse: "Мунтафик Леви" #NT!
 levy_nd_irq_muntafiq_horse_desc: "Благородная кавалерия, собранная на сухой земле между Евфратом и Недждом. Сила конфедерации никогда не заключалась в орошаемом Саваде." #NT!
 n_nd_irq_ghurab: "Гураб" #NT!
 n_nd_irq_ghurab_desc: "«Ворон»: мелкое весловое артиллерийское судно, у которого корпус заменен на орудия. Это правильная торговля в устье реки и неправильная в открытом море." #NT!
 a_nd_irq_kul_horsemen: "Кулские всадники" #NT!
 a_nd_irq_kul_horsemen_desc: "Грузинская семья багдадских паш, купленная еще мальчиками и обучавшаяся в течение десяти лет. Их никогда не бывает много, и на их создание уходят годы, и именно поэтому они в конечном итоге стали править Ираком." #NT!
  
  # ============================================================ 
  # Destiny tree: advances 
  # ============================================================ 
 nd_irq_destiny: "Реестр вод" #NT!
 nd_irq_destiny_desc: "Стоячая полоса всех водоотводов, плотин и шлюзов в стране: канал, деревни, пьющие из него воду, год, когда его в последний раз выкапывали, уровень ила в его устье, измеренный по отмеченному столбу. Ирак раскапывали в экстренных случаях на протяжении шестисот лет людьми, которые никогда не записывали то, что нашли." #NT!
 nd_irq_dest_hulwan_gate: "Ворота Халвана" #NT!
 nd_irq_dest_hulwan_gate_desc: "Дорога Хорасан выходит из Савада в Хулване, проходит через скалу в Бехистуне и не выравнивается до Хамадана, который греки называли Экбатаной. Каждая армия, когда-либо захватившая Багдад, спускалась по нему, как и половина воды, питающей восточную равнину, потому что Дияла и Карха обе берут начало за этими хребтами. Возьмите Керманшах и Хамадан и выставьте армию на водораздел: государство, удерживающее равнину, а не перевалы, удерживает богатую комнату с открытой дверью." #NT!
 nd_irq_dest_western_wing: "Западное крыло" #NT!
 nd_irq_dest_western_wing_desc: "Алеппо и Дамаск были второй половиной халифата и единственной дорогой к морю, не проходящей через ничей пролив. Возьмите их обоих и вырастите страну настолько, чтобы платить за их удержание, потому что удержание Сирии обходится дороже, чем победа." #NT!
 nd_irq_dest_shadow_caliph: "Теневой халиф" #NT!
 nd_irq_dest_shadow_caliph_desc: "Аббасиды жили в Каире на стипендию мамлюков с 1261 года, участвуя в процессиях и подписывая дипломы, которые делают султанов легитимными. Возьмите Каир и Иерусалим, сохраните армию и имя, достаточно большое, чтобы в него поверили, и верните строй домой." #NT!
 nd_irq_dest_maragha_instruments: "Инструменты Мараги" #NT!
 nd_irq_dest_maragha_instruments_desc: "Обсерватория Туси на холме над Марагой, финансируемая из пожертвований и укомплектованная людьми из Дамаска, Мосула, Тифлиса и Китая, которые не всегда могли разговаривать друг с другом, кроме как в большом количестве. Возьмите Марагу, примите Ренессанс и постройте страну, потому что инструменты ничего не стоят без людей, которые их читают." #NT!
 nd_irq_dest_ingenious_devices: "Гениальные устройства" #NT!
 nd_irq_dest_ingenious_devices_desc: "Сотня машин Бану Муса, рукоятка аль-Джазари, которая превращает круг колеса в прямой толчок насоса, и сасанидские плотины в Шуштаре, которые поднимают Карун уже тысячу лет. Возьмите Шуштар, займитесь мануфактурами и готовьте серебро, потому что техника окупается до того, как она заработает." #NT!
 nd_irq_dest_corrected_tables: "Исправленные таблицы" #NT!
 nd_irq_dest_corrected_tables_desc: "В Самарканде находятся бумажные фабрики, пришедшие на запад после Таласа и секстанта Улугбека, затонувшего в траншее длиной сорок метров. Возьмите его, примите научную революцию и пересчитайте звездный каталог для собственного меридиана Багдада, потому что зидж написан для одной широты и вежливо неверен везде." #NT!
  
  # ============================================================ 
  # Destiny tree: events 
  # ============================================================ 
 nd_irq.8.t: "Реестр вод" #NT!
 nd_irq.8.d: "Инспекторы завершили первую проверку. Каждый водоотвод от Самарры до истока залива сейчас в ударе: название канала, деревни, которые пьют из него, год, когда его в последний раз очищали, глубина ила в его устье, измеренная по отмеченному столбу. Четыреста с лишним записей, треть из них описывают произведения, в которых вообще больше нет воды.\n\nЭтого списка раньше никто не держал. Халифы рыли дноуглубительные работы, когда их вынуждал к этому голод, а паши рыли дноуглубительные работы, когда им платил шейх, и в обоих случаях знания умерли вместе с инженером. Изменения в реестре невелики и тотальны: засоренный канал теперь представляет собой строку в бухгалтерской книге с датой рядом с ней, и кого-то можно спросить, почему дата не сдвинулась." #NT!
 nd_irq.8.a: "Пусть инспекторы катаются, и пусть катаются еще раз в следующем году." #NT!
  
 nd_irq.9.t: "Ворота Халвана" #NT!
 nd_irq.9.d: "Дорога выходит из Савада у Хулвана и за первым хребтом проходит мимо скалы в Бехистуне, где Дарий вырезал свой отчет о гражданской войне слишком высоко, чтобы кто-либо мог до него добраться и исправить. Оно не выровняется до Хамадана. Каждая армия, когда-либо спускавшаяся на эту равнину, располагалась там в первую очередь.\n\nХалифы научились этому дорогой ценой, как и буиды, сами вышедшие из этих гор, и ильханы, и все остальные. По этому же пути спускаются еще две реки: Дияла и Карха, которые между ними орошают всю восточную половину Савада и поднимаются за хребтом, на котором мы сейчас стоим. Багдад находится в девяти днях пути от Хамадана для курьера и гораздо меньше, чем для кавалерии. Сейчас расставлены гарнизоны, перевалы удерживаются до водораздела, и впервые за долгое время равнина обороняется где-то еще, а не на равнине." #NT!
 nd_irq.9.a: "Дверь закрыта и заперта, а за стойкой наблюдают." #NT!
  
 nd_irq.10.t: "Западное крыло" #NT!
 nd_irq.10.d: "Алеппо отказался от своей цитадели, а в мечети Омейядов в Дамаске впервые за шестьсот лет прозвучала хутба от имени Багдада. Западная половина старого халифата находится под контролем, а вместе с ней и дороги к морю, и паломнический маршрут, идущий на юг.\n\nКак сохранить его — это старый вопрос, и на Сирию всегда можно было дать только два ответа. Омейяды разделили страну на аджнады, военные округа, каждый из которых имел гарнизон, финансируемый из собственных доходов, под руководством губернатора, намеренно присланного откуда-то еще. Аббасиды в своей слабости поступили наоборот: оставили эмиров Алеппо, Хамы и Дамаска в их цитаделях и прислали им почетные мантии, диплом и титул, и им подчинялись ровно до тех пор, пока мантии продолжали прибывать." #NT!
 nd_irq.10.a: "Разрежьте его на аджнад. Иракские гарнизоны, губернаторы извне." #NT!
 nd_irq.10.b: "Пришлите почетные одежды. Эмиры сохраняют свои цитадели." #NT!
  
 nd_irq.11.t: "Теневой халиф" #NT!
 nd_irq.11.d: "Аббасид жил в Каире с 1261 года, когда один из оставшихся в живых членов семьи достиг Египта, и Бейбарс провозгласил его в течение месяца. С тех пор его потомки жили там на стипендию, участвуя в процессиях, скрепляя дипломы, делающие мамлюкского султана законным, и не допуская никаких решений, более важных, чем выбор одежды.\n\nТеперь дом принадлежит нам, и город, который хранил его при себе. То, что будет сделано дальше, урегулирует то, на что это государство претендовало все это время. Баннеры могут выйти из хранилища, и заявление может быть сделано в полный голос, который будет услышан от Феса до Самарканда и на него ответит большая часть жителей. Или же человека можно тихо сопроводить домой и посадить над канцелярией, при том понимании, что на самом деле действует приказ с печатью внизу." #NT!
 nd_irq.11.a: "Поднимите черный. Пусть будет прочитана хутба по Багдаду." #NT!
 nd_irq.11.b: "Приведите его домой к столу. Управляйте через диваны." #NT!
  
 nd_irq.12.t: "Инструменты Мараги" #NT!
 nd_irq.12.d: "Хулагу позволил Туси построить его на холме над городом и профинансировал его за счет пожертвований, и это единственная причина, по которой он пережил человека, который за него заплатил. На меридиане есть сектор, вырезанный в скале, армиллярная сфера, библиотека, которую никто никогда честно не пересчитывал, и персонал, в который входил китайский астроном, а также люди из Дамаска, Мосула и Тифлиса, которые не могли достоверно разговаривать друг с другом, кроме как в цифрах.\n\nИнструменты упакованы в ящики и привязаны веревками и идут по дороге, и более половины сотрудников согласились путешествовать с ними. То, что приходит, — это не здание. Это метод: наблюдайте в течение тридцати лет, записывайте все, включая неудачи, и никогда не доверяйте таблице, которую вы не сверили с небом самостоятельно." #NT!
 nd_irq.12.a: "Выгружайте их осторожно. Найдите дома мужчин и заплатите им." #NT!
  
 nd_irq.13.t: "Гениальные устройства" #NT!
 nd_irq.13.d: "Две книги и одна река решают эту проблему. Бану Муса написала первую в Багдаде сотню устройств из клапанов, поплавков и саморегулирующихся ламп. Аль-Джазари написал вторую в Амиде и нарисовал рукоятку, которая превращает круг колеса в прямой толчок насоса, и это самый полезный рисунок, который когда-либо делал кто-либо в этой стране. Обе книги были приняты при дворе как забавы. Оба описывают машины, поднимающие воду.\n\nРека — это Карун в Шуштаре, где Шапур поручил пленным римским инженерам перекинуть через ручей плотину с мостом наверху и прорубить канал в твердой скале, чтобы доставить излишки воды на мельницы. Оно работает уже тысячу лет. Наши собственные инженеры измерили это и вернулись без шума." #NT!
 nd_irq.13.a: "Поставьте машины на землю. Поднимите воду на террасы." #NT!
 nd_irq.13.b: "Держите их в мастерских. Часы и квадранты продаются." #NT!
  
 nd_irq.14.t: "Исправленные таблицы" #NT!
 nd_irq.14.d: "В Самарканде было две вещи, в которых всегда нуждался Багдад. Первая — это фабрики, перерабатывающие льняные тряпки в кашу, ремесло, пришедшее на запад после Таласа и вообще сделавшее здесь возможным рынок канцелярских товаров. Второй — это секстант Улугбека, затонувший в траншее длиной сорок метров, и каталог из тысячи восемнадцати звезд, рассчитанный с его помощью его народом, первый за восемь столетий, который ничего не был должен Птолемею.\n\nТаблицы пересчитываются для меридиана Багдада, потому что для одной широты написан зидж, а во всех остальных случаях он вежливо неправильный. Для чего нужны перерасчеты, это спор в диване сейчас. Астрономы хотят, чтобы налоговый год был привязан к Солнцу, поскольку каждые три десятилетия лунный год наступает на месяц раньше сбора урожая, а харадж продолжает приходить к уплате еще до того, как появится урожай, которым можно будет его оплатить. Продавцы канцелярских товаров хотят, чтобы восточная дорога оставалась открытой, а бумага была дешевой." #NT!
 nd_irq.14.a: "Установите год Хараджа по солнцу. Облагайте налогом урожай, а не календарь." #NT!
 nd_irq.14.b: "Держите бумажную дорогу открытой. Пусть книга стоит столько, сколько стоит хлеб." #NT!
  
  # ============================================================ 
  # Destiny tree: timed modifiers 
  # ============================================================ 
 STATIC_MODIFIER_NAME_nd_irq_dest_jund_of_syria: "Джунд Сирии" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_jund_of_syria: "По плану Омейядов Сирия разделилась на военные округа, гарнизоны каждого из которых были выведены из Ирака под командованием губернатора из другого места. Это справедливо, и домашние поместья платят за многие марши, которых они никогда не увидят." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_investiture_of_emirs: "Инвеститура эмиров" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_investiture_of_emirs: "Лорды Алеппо, Хамы и Дамаска сохраняют свои цитадели и держат их от имени Багдада, на мантии почета и с запечатанной грамотой. Дешево, долговечно и точно так же надежно, как очередное посольство." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_black_banners: "Черные знамена" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_black_banners: "Аббасидская черная закончилась на складе, а хутба читается по Багдаду от Феса до Самарканда. Армии, идущие под его началом, знают, для чего они нужны, и это стоит больше, чем большинство вещей, которые можно купить в казне." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_writ_of_the_diwans: "Письмо Диванов" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_writ_of_the_diwans: "Халиф восседает над канцелярией, и претензии осуществляются с помощью печатей, реестров и курьеров, которые их несут. Крупное заведение учится снимать деньги прежде, чем научится чему-то еще." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_water_engines: "Водяные двигатели" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_water_engines: "Нории на террасах Евфрата, дулабы на Дияле, насосы там, где берег слишком высок для того и другого. Земля, которую никто бы не вспахал, сейчас неубрана, а верфи, на которых построили технику, заплатили задолго до того, как она заработала." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_clock_and_quadrant: "Часы и квадрант" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_clock_and_quadrant: "Водяные часы, астролябии, градуированные квадранты и подъемное оборудование изготавливались на заказ в багдадских мастерских и продавались на восток и запад. Рынок чудес всегда был лучше, чем рынок канавы." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_corrected_calendar: "Исправленный календарь" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_corrected_calendar: "Год Хараджа привязан к солнцу, поэтому налог падает, когда собран урожай, а не смещается на месяц вперед каждые три десятилетия. У юристов есть свои взгляды на календари, и никто из них не молчит." #NT!
 STATIC_MODIFIER_NAME_nd_irq_dest_road_of_paper: "Дорога бумаги" #NT!
 STATIC_MODIFIER_DESC_nd_irq_dest_road_of_paper: "Самаркандскую дорогу оставляют открытой, а мельницы копируют дома. Книга перестает быть завещанием и становится товаром, который радует всех, кроме тех, чей авторитет основан на ее обладании." #NT!
  
  # ============================================================ 
  # Destiny tree: buildings and production methods 
  # ============================================================ 
 nd_irq_dar_al_barid: "Дар аль-Барид" #NT!
 nd_irq_dar_al_barid_desc: "Станция поста халифа: конюшня и переоборудование, комната курьера, запечатанные почтовые сумки и сахиб аль-Барид, который живет здесь и чье настоящее поручение — докладывать губернатору по соседству. Можно построить в городах старой халифской дорожной сети." #NT!
 nd_irq_dulab_works: "Дулаб работает" #NT!
 nd_irq_dulab_works_desc: "Верфь, где строят и ремонтируют водоподъемную технику: дулаб, приводимый в движение волами, науру, движимую током, с привязанными к краю глиняными горшками и кривошипно-поршневые насосы из аль-Джазари. Можно строить на реке и озере, потому что машине, поднимающей воду, нужна вода под ней." #NT!
 nd_irq_marsad: "Марсад" #NT!
 nd_irq_marsad_desc: "Обсерватория: квадрант, разрезанный на меридиане, мастерская, которая напиливает собственную градуированную медь, и комната со столами, которые хранятся в течение тридцати лет, на которые фактически уходит программа наблюдений. Только города, и только под небом написаны его таблицы." #NT!
 nd_irq_barid_maintenance: "Почтовые лошади и почтовые сумки" #NT!
 nd_irq_barid_maintenance_desc: "На каждом этапе сменные кони кормятся и обуваются, шорное снаряжение, запечатанные кожаные сумки и бумага, достаточная для того, чтобы написать каждый отчет дважды, чтобы один экземпляр уехал, а другой остался в журнале." #NT!
 nd_irq_dulab_maintenance: "Колеса и горшки" #NT!
 nd_irq_dulab_maintenance_desc: "Ступицы и весла, вырезанные из пальмы и импортной древесины, сотни глиняных горшков, привязанных к краям, веревки, скрученные из финикового волокна, и железные конструкции, переустанавливаемые каждый раз, когда река выходит на берег." #NT!
 nd_irq_marsad_maintenance: "Латунь, Стекло и Столы" #NT!
 nd_irq_marsad_maintenance_desc: "Градуированные латунные конечности, вырезанные и подпиленные вручную, стекла для наблюдения и ламп, а также бумага, в которую записаны и переплетены тридцать лет ночных наблюдений." #NT!
  
  # ============================================================ 
  # Destiny tree: option tooltips 
  # ============================================================ 
 nd_irq.8.a_tt: "С этого момента инспекторы ездят по банкам каждый год." #NT!
 nd_irq.9.a_tt: "Дорога Хорасан проходит до водораздела." #NT!
 nd_irq.10.a_tt: "Более быстрый набор и более сильная тяжелая нога. Поместья возмущены законопроектом." #NT!
 nd_irq.10.b_tt: "Верные подданные, более теплые отношения за рубежом и еще один посланник в пути." #NT!
 nd_irq.11.a_tt: "Боевой счет, армейские традиции и восстановление морального духа под черным знаменем." #NT!
 nd_irq.11.b_tt: "Контроль в городах и более быстрая шпионская сеть. Заведение скользит." #NT!
 nd_irq.12.a_tt: "Инструменты и люди, которые их читают, размещены в Багдаде." #NT!
 nd_irq.13.a_tt: "Большие сельские хозяйства и больше сырья. Заем обходится дороже." #NT!
 nd_irq.13.b_tt: "Торговый доход, торговый потенциал и довольное мещанское поместье." #NT!
 nd_irq.14.a_tt: "Больше налога на наследство и дешевле покупать продукты питания. Священнослужители громко возражают." #NT!
 nd_irq.14.b_tt: "Грамотные рабочие, еще одна культура и более спокойное духовенство." #NT!
  
  # ============================================================ 
  # BUREAUCRACIES 
  # ============================================================ 
  
 irq_mirab_nawba_bureaucracy: "Мираб и поворот воды" #NT!
 irq_mirab_nawba_bureaucracy_desc: "Навба — это поворот: измеренный промежуток, в течение которого одна деревня и внутри нее одна семья могут выйти из канала. Мираб — это хозяин воды, который ведет список поворотов, открывает и закрывает водозабор, а также объявляет ежегодную очистку, которая не позволяет илу закрыть водозабор. Харун ар-Рашид приказал закрыть устья Нахравана, выкопать их и вновь открыть по тому же принципу между 786 и 806 годами. Вода в Месопотамии — это запись в книге учета, прежде чем она становится ресурсом, и кто-то должен вести книгу." #NT!
  
 irq_soyurghal_bureaucracy: "Суюргал" #NT!
 irq_soyurghal_bureaucracy_desc: "Союргал — это монгольский термин, обозначающий бессрочный грант, и это то, что Джалаириды оставили после себя в Ираке. Кара Юсуф платил своим эмирам и своим родственникам из доходов от переданной земли, а не монетами, и в течение одного поколения это назначение превратилось в наследственное владение с собственным иммунитетом от налогов. Узун Хасан провел целое царствование, пытаясь вернуть эти доходы в прямой сбор, но так и не завершил работу. Армия, которая ничего не стоит казне, — это армия, которую казна не может отозвать." #NT!
  
 irq_jahbadhiyya_bureaucracy: "Джахбадхия" #NT!
 irq_jahbadhiyya_bureaucracy_desc: "С 908 по 932 год визири Багдада держали на постоянной основе двух еврейских банкиров, Юсуфа ибн Финхаса и Харуна ибн Имрана. Они авансировали в казну фиксированную сумму первого числа каждого месяца в счет доходов Ахваза, держали депозиты торговых домов и распределяли между Багдадом и провинциями по письменному распоряжению сакк, который выдавал Англии свои чеки. Ибн аль-Фурат не мог бы управлять без них и не мог полностью доверять им, что является постоянным условием любого государства, которое берет взаймы." #NT!
  
 irq_naqib_al_ashraf_bureaucracy: "Накиб аль-Ашраф" #NT!
 irq_naqib_al_ashraf_bureaucracy_desc: "Накиб ведет шаджару, реестр потомков Пророка, записывая их рождения и смерти, разрешая их ссоры, выплачивая им стипендии и вычеркивая ложных претендентов. Никаба Багдада около 1000 года принадлежала Абу Ахмаду аль-Хусейну ибн Мусе, отцу поэта аш-Шарифа ар-Ради, и при османах эта должность находилась в руках дома Гайлани. В Ираке реестр пересекает сектантскую линию, а не следует за ней, потому что семьи сайидов и племенные шейхи заявляют об одном и том же происхождении по обе стороны от нее." #NT!
  
  # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_irq_bureaucracy_authority: "Офисы Савада" #NT!
 AUTO_MODIFIER_DESC_nd_irq_bureaucracy_authority: "Багдад снова является столицей, а не провинцией, поэтому [IRQ.GetName] может укомплектовывать и оплачивать постоянные офисы Месопотамии: список очереди каналов, реестр грантов, банкиров дивана и реестр священного происхождения." #NT!
