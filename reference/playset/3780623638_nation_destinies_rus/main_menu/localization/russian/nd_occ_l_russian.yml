 STATIC_MODIFIER_NAME_nd_occ_lo_pacte_consular: "Консульство Ло Пакте" #NT!
 STATIC_MODIFIER_DESC_nd_occ_lo_pacte_consular: "Власть возникает на основе клятвенных хартий городов и долин. Консульства управляют, издают законы и строят, а корона утверждает то, чего не писала." #NT!
 STATIC_MODIFIER_NAME_nd_occ_tenc_de_degun: "Тенк де Дегун" #NT!
 STATIC_MODIFIER_DESC_nd_occ_tenc_de_degun: "Принц, который держится за Бога и ни за кого в мире. Укрепленный, законный, которого невозможно вызвать, и которому вообще никто не доверяет." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_canon_de_la_lenga: "Канон языка" #NT!
 STATIC_MODIFIER_DESC_nd_occ_canon_de_la_lenga: "Одна грамматика, одно правописание, один приз. Академия решает, какой язык, а нотариусы следуют этому." #NT!
 STATIC_MODIFIER_NAME_nd_occ_concors_dobert: "Открытый конкурс" #NT!
 STATIC_MODIFIER_DESC_nd_occ_concors_dobert: "Жюри оценивает стихотворение и не задает вопросов о диалекте, на котором оно написано. Поэты приезжают как из Каталонии, Гаскони, так и из Лимузена." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_registres_dobertes: "«Роллс» вновь открылся" #NT!
 STATIC_MODIFIER_DESC_nd_occ_registres_dobertes: "Каждый титул, полученный в результате конфискации крестового похода, предъявляется и исследуется. Корона выигрывает; линии, посаженные на этой земле, этого не делают." #NT!
 STATIC_MODIFIER_NAME_nd_occ_patz_dels_mortz: "Мир мертвых" #NT!
 STATIC_MODIFIER_DESC_nd_occ_patz_dels_mortz: "Архив закрыт, поселение стоит, и церкви заплатили за благословение на обоих." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_neutralitat_armada: "Вооруженный нейтралитет" #NT!
 STATIC_MODIFIER_DESC_nd_occ_neutralitat_armada: "На каждом хребте были размещены гарнизоны, каждый вызов отклонялся. Война, в которой участвуют все остальные, и на земле никто не смеет вступить." #NT!
 STATIC_MODIFIER_NAME_nd_occ_espasa_logada: "Арендованный меч" #NT!
 STATIC_MODIFIER_DESC_nd_occ_espasa_logada: "Компании, созданные в Миди и нанятые той короне, которая платит, на условиях, обновляемых каждый сезон предвыборной кампании." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_man_del_cirurgian: "Рука хирурга" #NT!
 STATIC_MODIFIER_DESC_nd_occ_man_del_cirurgian: "Наблюдение, записанное без лести, включая то, что врачи ошиблись. Факультет преподает на основе протоколов, а не авторитетов." #NT!
 STATIC_MODIFIER_NAME_nd_occ_portas_barradas: "Зарешеченные ворота" #NT!
 STATIC_MODIFIER_DESC_nd_occ_portas_barradas: "Советы по здравоохранению, условия карантина и постановления о захоронении, соблюдение которых обеспечивается консулами, которые скорее потеряют сезонную торговлю, чем четверть города." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_fianca_reiala: "Поручительство для короля" #NT!
 STATIC_MODIFIER_DESC_nd_occ_fianca_reiala: "Торговый дом Тулузы обязался выкупить короля Франции, и об этом было доложено каждому двору в Европе." #NT!
 STATIC_MODIFIER_NAME_nd_occ_cabal_dels_pasteliers: "Столица торговцев Ваадой" #NT!
 STATIC_MODIFIER_DESC_nd_occ_cabal_dels_pasteliers: "Состояние остается в торговле, которая его заработала: больше мельниц, больше препятствий, больше коков и кредит на условиях, которые никто другой в провинции не может получить." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_prohibicion_de_l_indi: "Запрет Индиго" #NT!
 STATIC_MODIFIER_DESC_nd_occ_prohibicion_de_l_indi: "Иностранную краску осуждают, конфискуют и сжигают везде, где она попадает. Страна вад выиграла себе время и нажила врагов в каждом порту, где продаются другие товары." #NT!
 STATIC_MODIFIER_NAME_nd_occ_ports_dobertz: "Открытые порты" #NT!
 STATIC_MODIFIER_DESC_nd_occ_ports_dobertz: "Если синий будет продаваться, то он будет продаваться через наши склады и взвешиваться на наших весах." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_registres_en_lenga_nostra: "Регистры на нашем языке" #NT!
 STATIC_MODIFIER_DESC_nd_occ_registres_en_lenga_nostra: "Акты правосудия оформляются на том языке, на котором фактически говорят стороны. Это собственное государство страны, и к северу от Дордони оно никому не понятно." #NT!
 STATIC_MODIFIER_NAME_nd_occ_cancelaria_bilingua: "Двуязычная канцелярия" #NT!
 STATIC_MODIFIER_DESC_nd_occ_cancelaria_bilingua: "Каждый акт составлен дважды, на обоих языках, что требует вдвое больше канцелярского труда и вдвое меньше двусмысленности." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_glieisa_del_desert: "Церковь пустыни" #NT!
 STATIC_MODIFIER_DESC_nd_occ_glieisa_del_desert: "Собрания в оврагах, которые никто не посылает разгонять. Страна имеет трехвековую практику не сдавать людей." #NT!
 STATIC_MODIFIER_NAME_nd_occ_patz_del_rei: "Королевский мир" #NT!
 STATIC_MODIFIER_DESC_nd_occ_patz_del_rei: "В долинах разместились гарнизоны, собрания разошлись, а пророки замолчали. Тихо на поверхности и нигде под ней." #NT!
  
 STATIC_MODIFIER_NAME_nd_occ_grafia_mistralenca: "Мистральская графика" #NT!
 STATIC_MODIFIER_DESC_nd_occ_grafia_mistralenca: "Назовите это так, как говорит Рона. Литература, которую обычные люди могут читать вслух, даже не обучаясь этому." #NT!
 STATIC_MODIFIER_NAME_nd_occ_grafia_classica: "Классическая графика" #NT!
 STATIC_MODIFIER_DESC_nd_occ_grafia_classica: "Назовите его так, как это делали трубадуры, так что Гасконь, Лимузен и Прованс все время писали на одном и том же языке." #NT!
  
  # ========================================================================== 
  # Variables 
  # ========================================================================== 
 nd_occ_formed_tt: "Окситания образовалась" #NT!
 nd_occ_path_a_tt: "Выбран путь консульского пакта" #NT!
 nd_occ_path_b_tt: "Выбран путь суверенного светлости" #NT!
 nd_occ_e1_done_tt: "Учредительное собрание собралось" #NT!
  
  # ========================================================================== 
  # Advances: Age 1 
  # ========================================================================== 
 nd_occ_consistori_del_gay_saber: "Консистори дель Гей Сабер" #NT!
 nd_occ_consistori_del_gay_saber_desc: "Семь горожан Тулузы основали поэтическую академию в 1323 году и предлагали золотую фиалку, виолу д'аур, лучшим кансо, представляемым им каждый май. Это старейшее литературное учреждение в западном мире, и оно собиралось уже тогда, когда была основана эта страна." #NT!
 nd_occ_leys_damors: "Лей д'Аморс" #NT!
 nd_occ_leys_damors_desc: "Грамматика, риторика и просодия языка oc Гильема Молинье, составленная в 1330-х годах и получившая окончательную прозаическую форму в 1341 году. Первая преднамеренная кодификация европейского разговорного языка органом, уполномоченным обеспечивать его соблюдение." #NT!
 nd_occ_las_consolats: "Консульства" #NT!
 nd_occ_las_consolats_desc: "Тулузой управляли двадцать четыре избранных консула с 1147 года, названных капитолиями с 1295 года, и они оставили графу немногим больше, чем его монетный двор. От Монпелье до самого маленького бастида, города Юга управлялись по уставу." #NT!
 nd_occ_cartas_de_bastida: "Уставы бастид" #NT!
 nd_occ_cartas_de_bastida_desc: "Более трехсот запланированных городов, основанных по всему Юго-Западу на основании договоров о паритете, расположенных по сетке вокруг аркадной площади и заселенных на основании хартий, которые продавали свободу и налоговые льготы любому желающему приехать." #NT!
 nd_occ_dreit_escrich: "Ло Дрейт Эскрих" #NT!
 nd_occ_dreit_escrich_desc: "К югу от Шаранты земля управляется писаным римским правом, извлеченным из свода Юстиниана, а не запомнившимся обычаем. Каждая сделка проходит через нотариуса и оставляет документ, который можно будет прочитать и через триста лет." #NT!
 nd_occ_bidaus: "Бидаус" #NT!
 nd_occ_bidaus_desc: "Легкое подножие пиренейского склона: дротики, нож и никаких доспехов, достойных названия. Нанят обеими коронами для проверки, набегов и перестрелок, и его никогда не просили держать оборону." #NT!
 nd_occ_erenca_catara: "Наследство катаров" #NT!
 nd_occ_erenca_catara_desc: "Церкви больше нет: Монсегюр пал в 1244 году, а последний Perfectus сгорел в 1321 году. В наследство унаследовано поселение о конфискации, инквизиционный архив и страна, которая научилась внимательно отвечать на вопросы и укрывать тех, на кого охотятся." #NT!
  
  # ========================================================================== 
  # Advances: Age 2 
  # ========================================================================== 
 nd_occ_de_diu_e_de_degun: "Де Диу и де Дегун" #NT!
 nd_occ_de_diu_e_de_degun_desc: "Гастон Фебус сказал Филиппу VI в 1347 году, что он отдаст дань уважения Фуа, но считает Беарна Богом, а не человеком в мире. Он удерживал свои земли от участия в войне в течение сорока восьми лет, заставляя обе короны претендовать на него." #NT!
 nd_occ_escola_de_montpelhier: "Школа Монпелье" #NT!
 nd_occ_escola_de_montpelhier_desc: "Основанный в 1220 году и утвержденный в 1289 году, первый медицинский факультет в Европе, преподающий у арабских и еврейских авторитетов наряду с латинскими и необычайно готовый сказать, когда его авторитеты ошибаются." #NT!
 nd_occ_universitat_de_tolosa: "Университет Тулузы" #NT!
 nd_occ_universitat_de_tolosa_desc: "Основанный в 1229 году в соответствии с Парижским договором, оплаченный побежденным графом и специально уполномоченный обучать теологов, которые будут искоренять ересь на Юге. Он стал собственным юридическим факультетом Миди." #NT!
 nd_occ_glieisas_fortalezas: "Укрепленные церкви" #NT!
 nd_occ_glieisas_fortalezas_desc: "Сент-Сесиль Альби — это собор, построенный епископом-инквизитором в качестве крепости в городе, который еще на памяти живущих был лишен собственности. Приходская церковь на другом берегу реки Миди стала последним оплотом деревни." #NT!
 nd_occ_estats_provincials: "Провинциальные поместья" #NT!
 nd_occ_estats_provincials_desc: "Лангедок, Беарн, Фуа, Руэрг и Керси каждый проголосовал за свои налоги на своих собраниях, и в Беарне сеньор присягнул форам раньше, чем поместья присягнули ему." #NT!
 nd_occ_milicia_consulara: "Консульская милиция" #NT!
 nd_occ_milicia_consulara_desc: "Зарегистрированный город должен был защищаться самостоятельно. Капитулы командовали ротами своего квартала, собирая арбалетчиков и павизиров по приходам под знаменем города, а не лорда." #NT!
 nd_occ_transumancia: "Отгонное животноводство" #NT!
 nd_occ_transumancia_desc: "Каждое лето стада поднимаются по дралхам на Косс и Севенны и снова спускаются в октябре, пользуясь правами прохода старше, чем владения, которые они пересекают." #NT!
  
  # ========================================================================== 
  # Advances: Age 3 
  # ========================================================================== 
 nd_occ_pais_de_cocanha: "Паис-де-Коканья" #NT!
 nd_occ_pais_de_cocanha_desc: "В течение столетия треугольник Тулуза, Альби и Каркассон поставлял большую часть синей краски в Западную Европу. Шары земляной вайды назывались коками, и они дали языку название «земля изобилия»." #NT!
 nd_occ_parlament_de_tolosa: "Парламент Тулузы" #NT!
 nd_occ_parlament_de_tolosa_desc: "Основанный в 1443 году, это первый суверенный суд, построенный за пределами Парижа. Он судил в последней инстанции для всей страны писаного права, и его полномочия связывали каждое консульство и сеньорский суд, находившийся под ним." #NT!
 nd_occ_draparia_lengadociana: "Лангедокская драпировка" #NT!
 nd_occ_draparia_lengadociana_desc: "Каркассон, Лиму и Лодев ткали шерсть, слетевшую с коссов, и красили ее вайдой, выращенной в тридцати милях от них. Полноценная суконная промышленность внутри одной провинции." #NT!
 nd_occ_mordent_de_milhau: "Протрава Мийо" #NT!
 nd_occ_mordent_de_milhau_desc: "Ни один краситель не держится без квасцов, а Миди роет сам себя. Измельчение высушенного кока до гранулированного аграната с квасцами примерно вдвое увеличивает стоимость урожая вайи." #NT!
 nd_occ_bandas_de_gasconha: "Банды Гаскони" #NT!
 nd_occ_bandas_de_gasconha_desc: "Одна из vieilles Bandes, из которой была построена постоянная французская пехота. Гасконскую пехоту нанимали в качестве аркебузиров, потому что они хорошо стреляли, превосходили свой собственный багаж и шли на службу к той короне, которая платила за это." #NT!
 nd_occ_tartanas: "Тартаны Персидского залива" #NT!
 nd_occ_tartanas_desc: "Латинские каботажные суда Львиного залива: достаточно мелкие для заиленной гавани в лагуне, достаточно дешевые, чтобы консульство могло иметь дюжину, и достаточно быстрые с подветренной стороны, чтобы обогнать большую часть тех, кто хочет подняться на борт." #NT!
 nd_occ_lies_e_passarias: "Ложь и Пассариас" #NT!
 nd_occ_lies_e_passarias_desc: "Пиренейские долины заключили свои собственные договоры по всему водоразделу, гарантирующие пастбища и невоинственность, что бы ни делали их короли. С тех пор Traite de la Vache 1375 года исполняется каждый июль." #NT!
  
  # ========================================================================== 
  # Advances: Age 4 
  # ========================================================================== 
 nd_occ_indi_contra_pastel: "Индиго против Ваада" #NT!
 nd_occ_indi_contra_pastel_desc: "Тропический краситель, дающий более глубокий синий цвет из десятой части массы, разрушает экономику вайд за два поколения. Тулуза боролась с этим в своде законов, а Франция запретила индиго под страхом смерти в 1598 году, что ничего не изменило." #NT!
 nd_occ_edicte_de_castras: "Палата Эдикта" #NT!
 nd_occ_edicte_de_castras_desc: "Палата парламента, заседающая в Кастре, с равным числом католических и протестантских судей для рассмотрения любого дела, в котором участвует протестант. Не толерантность как одолжение, а паритет, записанный на скамейке запасных." #NT!
 nd_occ_seda_de_las_cevenas: "Шелк Севенн" #NT!
 nd_occ_seda_de_las_cevenas_desc: "Оливье де Серр опубликовал этот метод в 1600 году, и сланцевые террасы Гара и Лозера заполнились шелковицей и мандарином, питавшими метательные фабрики и ткачей Нима." #NT!
 nd_occ_aiga_ardenta: "Айга Ардента" #NT!
 nd_occ_aiga_ardenta_desc: "Виталь дю Фур из Оза перечислил сорок достоинств жженого вина в 1310 году. К шестнадцатому веку арманьяк перегоняли для продажи и отправляли по рекам Бэ и Гаронне в гасконском дубе." #NT!
 nd_occ_escalas_del_levant: "Эшеллы Леванта" #NT!
 nd_occ_escalas_del_levant_desc: "Капитуляция 1536 года открыла османские порты для французских баз. Ткань Миди шла на восток через Марсель и левантийский хлопок, шкуры и наркотики возвращались обратно." #NT!
 nd_occ_diocesis_civils: "Гражданские епархии" #NT!
 nd_occ_diocesis_civils_desc: "Лангедок начислял и собирал свои собственные налоги через двадцать две гражданские епархии, каждая из которых имела Ассиетту, которая распределяла сборы между своими общинами. Епископство предоставило границу, а собрание предоставило арифметику." #NT!
 nd_occ_lenga_de_l_estat: "Язык государства" #NT!
 nd_occ_lenga_de_l_estat_desc: "Постановление Виллер-Коттре требовало, чтобы каждый акт правосудия в королевстве записывался на родном французском языке и ни на каком другом. В стране, вся правовая жизнь которой основывалась на окситанских документах, это была смена суверена." #NT!
  
  # ========================================================================== 
  # Advances: Age 5 
  # ========================================================================== 
 nd_occ_junccion_dels_dos_mars: "Соединение двух морей" #NT!
 nd_occ_junccion_dels_dos_mars_desc: "Канал Рике, идущий от Гаронны к морю, питаемый от Черной горы с помощью риголы, проложенной по контуру на тридцать миль до вершины Науруза. Утвержден в 1666 г., открыт в 1681 г." #NT!
 nd_occ_manufacturas_del_levant: "Производство для Леванта" #NT!
 nd_occ_manufacturas_del_levant_desc: "Вильнувет, Клермон и Лодев ткали лондрен-секунды — сукно, выкроенное из ткани, окрашенное и сложенное по османскому вкусу и не предназначенное ни для одного другого рынка на земле." #NT!
 nd_occ_verd_de_montpelhier: "Вер-де-гри Монпелье" #NT!
 nd_occ_verd_de_montpelhier_desc: "Медные пластины, покрытые выжимками, оставшимися от прессования винограда, запечатанными в подвале на несколько недель, а затем соскоблены. Почти полностью они изготавливались женщинами в их собственных домах, и в течение двух столетий Монпелье поставлял почти всю продукцию в Европу." #NT!
 nd_occ_camisards: "Камизарды" #NT!
 nd_occ_camisards_desc: "Пастухи и чесальщики шерсти из Севенн, которые сковывали маршалов Франции с 1702 года, нанося удары по ночам в ущельях и возвращаясь к ткацкому станку утром. Они не могли удержать поле и не пытались." #NT!
 nd_occ_cadets_de_gasconha: "Кадеты де Гасконь" #NT!
 nd_occ_cadets_de_gasconha_desc: "Младшие сыновья провинции с большим количеством благородных домов и меньшим количеством земли, чем где-либо в королевстве, едут на север, чтобы служить частными солдатами в надежде получить комиссию. Шарль де Бац из Люпиака был одним из нескольких тысяч." #NT!
 nd_occ_academia_dels_jocs_florals: "Академия Цветочных игр" #NT!
 nd_occ_academia_dels_jocs_florals_desc: "В 1694 году патент на грамоту превратил Консистори в королевскую академию. Конкурс, основанный в 1323 году, к тому времени просуществовал без перерыва триста семьдесят один год, чего не могла сказать ни одна другая литературная организация в Европе." #NT!
 nd_occ_obras_dels_estats: "Работы поместий" #NT!
 nd_occ_obras_dels_estats_desc: "Лангедок не стал ждать, пока будет построена корона. Поместья обследовали, заключили контракты и оплатили провинциальные дороги, мосты и портовые работы, а также выделили четыре пятых стоимости канала между собой и казной." #NT!
  
  # ========================================================================== 
  # Advances: Age 6 
  # ========================================================================== 
 nd_occ_bacin_de_decazavila: "Бассейн Аверон" #NT!
 nd_occ_bacin_de_decazavila_desc: "Уголь в Обене и Крансаке, лежащий рядом с железом в тех же пластах, разрабатывался с 1826 года под руководством Дюка Деказа, за ним находились Тарнское месторождение в Кармо и Севеннское месторождение в Але. Единственный тяжелый промышленный регион Миди." #NT!
 nd_occ_felibritge: "Ло Фелибритге" #NT!
 nd_occ_felibritge_desc: "Семь поэтов, встретившись в Фон-Сегюнь в 1854 году, решили снова дать языку правописание, словарь и литературу. Фредерик Мистраль двадцать лет работал над словарем и получил Нобелевскую премию в 1904 году." #NT!
 nd_occ_cacaires_de_montanha: "Горные егеря" #NT!
 nd_occ_cacaires_de_montanha_desc: "Легкие роты, собранные из долин Пиренеев и Севенолов, набранные именно для того, за что нанимались бидау пятьсот лет назад, теперь с винтовкой." #NT!
 nd_occ_vinha_del_miegjorn: "Виноградник Миди" #NT!
 nd_occ_vinha_del_miegjorn_desc: "Как только рельсы достигли побережья, равнина Лангедока вырвала все остальное и засадила виноградниками от Нима до Нарбонны, а то, что не пили на рынке, отправилось в перегонные кубы." #NT!
 nd_occ_camin_de_ferre: "Железные дороги Миди" #NT!
 nd_occ_camin_de_ferre_desc: "Компания Compagnie des chemins defer du Midi, основанная в 1852 году, проложила свою магистраль вдоль Гаронны рядом с каналом, который она была построена, чтобы уничтожить, и впервые со времен Рима связала Бордо, Тулузу и побережье в единый рынок." #NT!
 nd_occ_ensenhament_public: "Общественное обучение" #NT!
 nd_occ_ensenhament_public_desc: "Страна, законный язык которой был запрещен законом в 1539 году и чьи школы затем наказывали детей за его использование, имеет одну очевидную особенность, связанную с национальной школьной системой." #NT!
  
  # ========================================================================== 
  # Buildings 
  # ========================================================================== 
 nd_occ_consistori: "Консистори" #NT!
 nd_occ_consistori_desc: "Зал Consistori del Gay Sabre, где канцлер и семь сопровождающих заседают каждый май, чтобы оценить представленные им кансо и вручить золотую фиалку." #NT!
 nd_occ_ostal_comun: "Осталь Комун" #NT!
 nd_occ_ostal_comun_desc: "Обычный дом консульства: сундук с городской хартией, стандартные гири, список для сбора и скамья, на которой консулы судят своих горожан." #NT!
 nd_occ_bastida: "Бастида" #NT!
 nd_occ_bastida_desc: "Засаженный городок, построенный геодезистом: прямые улицы, рыночная площадь с аркадами и хартия свобод для всех, кто хочет прийти и построить дом на участке." #NT!
 nd_occ_glieisa_fortalesa: "Укрепленная церковь" #NT!
 nd_occ_glieisa_fortalesa_desc: "Кирпичные стены, башня, одна запирающаяся дверь и погреб для зерна. Когда пришли свободные отряды, деревня с обнесенной стеной церковью и после этого все еще оставалась деревней." #NT!
 nd_occ_escola_de_medecina: "Медицинская школа" #NT!
 nd_occ_escola_de_medecina_desc: "Медицинский факультет по образцу Монпелье, вместе читающий Авиценну и Галена, анализирующий, когда можно получить тело, и необычайно готовый фиксировать то, что не сработало." #NT!
 nd_occ_jac_de_la_dralha: "Жак де ла Дралья" #NT!
 nd_occ_jac_de_la_dralha_desc: "Летняя загон в начале отгонной тропы с пастушьей хижиной, соляной корытом и стенами из сухого камня, где стада равнины проводят месяцы, когда равнина не может их прокормить." #NT!
 nd_occ_obrador_del_pastel: "Обрадор дель Пастель" #NT!
 nd_occ_obrador_del_pastel_desc: "Пастель работает: жернов для измельчения листьев вайи, барьеры для сушки коков, ступка для их измельчения и запах, разносящийся на милю." #NT!
 nd_occ_cort_sobeirana: "Корт Собейрана" #NT!
 nd_occ_cort_sobeirana_desc: "Суверенный суд по тулузской модели, выносящий решения в последней инстанции для всей страны писаного права, со своим собственным регистром, своими адвокатами и собственным мнением о юрисдикции всех остальных." #NT!
 nd_occ_draparia: "Драпария" #NT!
 nd_occ_draparia_desc: "Ткацкие станки, валяльная фабрика, ширильное поле и красильня на территории одной гильдии, превращающие каусскую шерсть и лаурагайскую ваду в ткань, имеющую собственную печать города." #NT!
 nd_occ_cambra_de_l_edicte: "Камбра де л'Эдикте" #NT!
 nd_occ_cambra_de_l_edicte_desc: "Палата верховного суда с равным количеством католических и протестантских судей, намеренно расположенная вдали от столицы, чтобы ни одна конфессия не могла претендовать на то, чтобы она находилась на виду у другой." #NT!
 nd_occ_alambic: "Аламбик" #NT!
 nd_occ_alambic_desc: "Гасконский перегонный куб: медный перегонный куб над дровяным огнем, превращающий жидкое белое вино, которое не выдержало бы путешествия, в бренди, улучшающий его качество." #NT!
 nd_occ_canal_de_las_doas_mars: "Канал де лас Доас Марс" #NT!
 nd_occ_canal_de_las_doas_mars_desc: "Разрыв между двумя морями, с его притоком, бассейном на вершине, лестничными шлюзами и проспектом самолетов, переносящим за неделю то, что дорога перенесла за месяц." #NT!
 nd_occ_manufactura_reiala: "Мануфактура Рейала" #NT!
 nd_occ_manufactura_reiala_desc: "Обнесенный стеной промышленный комплекс с собственной красильной, прессами, сушильными помещениями и постоянными инспекторами, ткавшими сукно, раскроенным и сложенным по вкусу рынка в трех тысячах миль отсюда." #NT!
 nd_occ_forga_del_roergue: "Форга дель Роэрг" #NT!
 nd_occ_forga_del_roergue_desc: "Доменные печи и лужеобразные полы расположены там, где уголь и железо лежат на одном и том же склоне, а вокруг них из ничего вырос город компании." #NT!
  
  # ========================================================================== 
  # Production methods 
  # ========================================================================== 
 nd_occ_consistori_maintenance: "Канцелярия игр" #NT!
 nd_occ_consistori_maintenance_desc: "Бумага для журналов, образцы Лей для обслуживающего персонала и вино для майского судейства." #NT!
 nd_occ_ostal_maintenance: "Чартерный сундук" #NT!
 nd_occ_ostal_maintenance_desc: "Реестры, печати и свечи для вечерних заседаний консулов, а также древесина для крыши рыночного зала." #NT!
 nd_occ_bastida_maintenance: "Содержание Основателя" #NT!
 nd_occ_bastida_maintenance_desc: "Древесина и камень для аркад и границ участков, а также зерно, сохраненное на случай первого неудачного года." #NT!
 nd_occ_glieisa_maintenance: "Приходской гарнизон" #NT!
 nd_occ_glieisa_maintenance_desc: "Каменная кладка стен, древесина щитов, оружие в башне и воск для алтаря, который все это оправдывает." #NT!
 nd_occ_escola_maintenance: "Содержание факультета" #NT!
 nd_occ_escola_maintenance_desc: "Лекарства для аптекарского кабинета, книги для мастеров, бумага для студентов и спиртные напитки для анатомического стола." #NT!
 nd_occ_jac_maintenance: "Сложить содержание" #NT!
 nd_occ_jac_maintenance_desc: "Древесина и камень для стен и хижины, и соль для корыт, из-за которых стадо возвращается на одну и ту же землю." #NT!
 nd_occ_cort_maintenance: "Секретариат Суда" #NT!
 nd_occ_cort_maintenance_desc: "Бумага и пергамент для арестов, печатные обычаи для адвокатов, воск для печатей и вино для открытия срока." #NT!
 nd_occ_cambra_maintenance: "Скамья паритета" #NT!
 nd_occ_cambra_maintenance_desc: "Два комплекта регистров, два комплекта книг по праву и скамья, которая не устоит, если не будет обеих ее половин." #NT!
 nd_occ_canal_maintenance: "Обслуживание замков и банков" #NT!
 nd_occ_canal_maintenance_desc: "Обработанный камень для шлюзовых камер, дуб для ворот и железо для лопастей, замененные в цикле прокатки навсегда." #NT!
 nd_occ_coca_de_pastel: "Коки Вада" #NT!
 nd_occ_coca_de_pastel_desc: "Листья вайи измельчали ​​под мельницей, скатывали вручную в шарики и сушили на плетнях над медленным дровяным огнем. Самый простой вид, в котором продается краситель." #NT!
 nd_occ_agranat: "Агранат с квасцами" #NT!
 nd_occ_agranat_desc: "Высушенные коки измельчаются до гранулированного порошка и ферментируются квасцами из Мийо, что фиксирует цвет и примерно вдвое увеличивает урожай." #NT!
 nd_occ_verdet: "Вер-де-гри" #NT!
 nd_occ_verdet_desc: "Медные пластины покрыты выжимками, оставшимися от винного пресса, и запечатаны в подвале на несколько недель, а затем очищены до сине-зеленой корочки. Домашняя торговля в Монпелье, не имеющая конкурентов в Европе." #NT!
 nd_occ_draps_de_lengadoc: "Ткани Лангедока" #NT!
 nd_occ_draps_de_lengadoc_desc: "Косская шерсть прядется, сотканна, валяна и окрашена в ваде Лаураге, запечатана клеймом города и продается поштучно." #NT!
 nd_occ_seda_de_nimes: "Шелк Нима" #NT!
 nd_occ_seda_de_nimes_desc: "Севенольский шелк-сырец, выброшенный, окрашенный и сотканный из тафты и узорчатых тканей на ткацких станках Нима, где триста лет спустя все еще будут изобретать ткани." #NT!
 nd_occ_aigardent: "Жженое вино" #NT!
 nd_occ_aigardent_desc: "Тонкий гасконский белый цвет проходит через медный перегонный куб, как его описали монахи Оза в 1310 году, и врезается в дуб, растущий неподалеку." #NT!
 nd_occ_brandi_de_gasconha: "Арманьяк" #NT!
 nd_occ_brandi_de_gasconha_desc: "Непрерывная дистилляция в гасконских перегонных кубах и длительная выдержка в черном дубе, позволяющая производить бренди, продаваемый по году урожая, а не в бочках." #NT!
 nd_occ_londrins_seconds: "Лондринские секунды" #NT!
 nd_occ_londrins_seconds_desc: "Сукно соткано, окрашено, спрессовано и сложено в соответствии со спецификациями, установленными в Смирне и Алеппо, проверено под королевской печатью и отправлено на восток через Марсель." #NT!
 nd_occ_fonda_roergata: "Рургская плавильная печь" #NT!
 nd_occ_fonda_roergata_desc: "Кокс из пластов Обена подавался в доменную печь вместе с рудой, рядом с которой она была выкопана, и собирался в прутки и рельсы." #NT!
  
  # ========================================================================== 
  # Units and levies 
  # ========================================================================== 
 a_nd_occ_bidau: "Бидау" #NT!
 a_nd_occ_bidau_desc: "Стрелки с копьями у пиренейского склона. Они приближаются, бросают и уходят до того, как попадает встречный заряд. Попросите их встать, и они не встанут." #NT!
 levy_nd_occ_bidau: "Бидау Леви" #NT!
 levy_nd_occ_bidau_desc: "Крестьяне и солдаты горной страны, подготовленные как легкая нога для проверки и набегов." #NT!
 a_nd_occ_milicia_consulara: "Консульская милиция" #NT!
 a_nd_occ_milicia_consulara_desc: "Арбалетчики и павизиры собрались по городскому кварталу под знаменем консульства. Прекрасно за стеной и бесполезно в недельном переходе от нее." #NT!
 levy_nd_occ_milicia_consulara: "Сбор консульской милиции" #NT!
 levy_nd_occ_milicia_consulara_desc: "Бюргеры и солдаты взывали по городскому уставу, а не по призыву лорда." #NT!
 a_nd_occ_arquebusier_gascon: "Гасконский аркебузьер" #NT!
 a_nd_occ_arquebusier_gascon_desc: "Банды Гаскони: быстрые, точные, легко обнаруживаемые и слабодисциплинированные, склонные решить исход боя с первого залпа или не решить его вообще." #NT!
 n_nd_occ_tartana: "Тартана" #NT!
 n_nd_occ_tartana_desc: "Латинские горки Львиного залива. Неглубокий, быстрый и легковооруженный, построенный для поддержания движения прибрежной торговли, а не для борьбы за нее." #NT!
 a_nd_occ_cadet_de_gasconha: "Кадет де Гасконь" #NT!
 a_nd_occ_cadet_de_gasconha_desc: "Бедные благородные добровольцы, едущие в качестве частных солдат в надежде получить комиссию. Они взимают плату за то, хорошая это идея или нет, и в этом суть и проблема." #NT!
 a_nd_occ_camisard: "Камизард" #NT!
 a_nd_occ_camisard_desc: "Пастухи и чесальщики шерсти в Севеннах сражаются по ночам в рубашках без рукавов, сидя дома в ущельях, куда ни одна колонна не может последовать за ними, и не в состоянии удерживать поле в течение часа." #NT!
 levy_nd_occ_camisard: "Камисар Леви" #NT!
 levy_nd_occ_camisard_desc: "Крестьяне и рабочие из высоких Севенн, воспитанные как нерегулярные граждане. Намеренно не солдаты, в этом и заключался весь характер восстания." #NT!
 a_nd_occ_cacaire: "Какэр-де-Монтанья" #NT!
 a_nd_occ_cacaire_desc: "Горные охотники, поднятые из долин Пиренеев и Севенолов: винтовки, боевой порядок и пятьсот лет знания местности." #NT!
  
  # ========================================================================== 
  # DESTINY TREE 
  # ========================================================================== 
  
  # --- Destiny advances ----------------------------------------------------- 
 nd_occ_destiny: "Ла Вопрос Собейрана" #NT!
 nd_occ_destiny_desc: "Страна существует и ее уставы в сундуке. Никто не решил, откуда исходит его собственная власть, и страна писаного закона не может оставить это неписаным. Тулуза на протяжении шести столетий отвечала одним путем, а Ортез ответил другим в 1347 году. Учредительное собрание выбрало между ними, и все дальнейшее вытекает из этого выбора." #NT!
 nd_occ_dest_caorsins: "Лос-Каорсинс" #NT!
 nd_occ_dest_caorsins_desc: "В течение ста лет ростовщика в Лондоне, Риме и на ярмарках Шампанского обычно называли ростовщиком, в честь города с населением в восемь тысяч человек на излучине Лота. Данте назвал Каор рядом с Содомом; кардиналы избрали папой Кагорсена в 1316 году. Возьмите Каор, займитесь банковским делом и доведите собственное развитие страны до уровня, которого стоят две провинции-основатели." #NT!
 nd_occ_dest_privilegi: "Ло Привилеги де Бордеу" #NT!
 nd_occ_dest_privilegi_desc: "Горожане Бордо имеют хартию, запрещающую ввоз вина из горной страны в порт до тех пор, пока не будет продан их собственный урожай, что в плохой год означает Рождество, а в худший - Пасху, когда флот уже ушел. Возьмите Бордо, займитесь глобальной торговлей и постройте казну на две тысячи человек, и внутренние районы перестанут спрашивать разрешения достичь океана." #NT!
 nd_occ_dest_pacte_general: "Общий договор" #NT!
 nd_occ_dest_pacte_general_desc: "Один документ, стороной которого являются каждое консульство, долина, виконтство и бастида, и один архив, хранящий подлинные копии каждого из них. Расширьте его на север до Лиможа и Орийака, которые говорят на этом языке и которых никогда не просили подписывать что-либо, и держите в казне три тысячи, а за ними стоит тысяча проектов. Открывает выставку Fiera Franca." #NT!
 nd_occ_dest_ports: "Лос-Портс" #NT!
 nd_occ_dest_ports_desc: "Вызов остается бумажным до тех пор, пока кто-нибудь не принесет его с армией за спиной, а с запада есть две двери. Возьмите Байонну, английскую с 1152 года, самый оживленный порт между Жирондой и Эбро, и Сен-Жан-Пье-де-Пор у подножия дороги Ронсево, и держите под ружьем тридцать полков, чтобы удерживать их." #NT!
 nd_occ_dest_navarra: "Эретатж де Наварра" #NT!
 nd_occ_dest_navarra_desc: "Корона Наварры перешла к Франсуа Фебу Фуа-Беарну в 1479 году, затем к его сестре Екатерине и ее мужу Жану д'Альбре. Фердинанд захватил половину Эбро в 1512 году, а дом сохранил остальную часть и сохранил титул, и именно так суверенный король правил во Франции до 1620 года. Возьмите Памплону и Туделу, имея за собой пятьдесят престижных претензий." #NT!
 nd_occ_dest_mureth: "Ло Дойте де Мюрет" #NT!
 nd_occ_dest_mureth_desc: "При Мюре в 1213 году Петр II Арагонский поставил себя во вторую линию, чтобы никто не мог сказать, что он отстал, и рыцари Монфора проехали через нее. Миди потерял единственную корону, которая могла бы удержать его от Франции, и Пиренейский гребень стал границей. Возьмите Хаку и Уэску, где начинался Арагон, с семьюдесятью пятью престижами и семьюдесятью пятью полками. Открывает Кастель Собейран." #NT!
  
  # --- nd_occ.13: the sovereign question ------------------------------------ 
 nd_occ.13.t: "Суверенный вопрос" #NT!
 nd_occ.13.d: "В течение месяца после провозглашения вопрос был озвучен в трех разных палатах, и ни один ответ не удовлетворил более чем одну из них. Страна письменных инструментов не может избежать этого. В каждой хартии в сундуке указывается власть, которая ее предоставила, и если эта власть теперь принадлежит этой стране, то эта страна должна сказать, откуда исходит ее собственное право.\n\nКонсулы говорят, что оно исходит из обычаев, присягнувших и соблюдаемых в течение двухсот лет, и что принц - это человек, который их ратифицирует. Люди, приехавшие из Беарна, отвечают, что речь идет о контракте, а не о короне, и что лорд, который придерживается Бога, а не человека в мире, не обязан ни перед каким собранием давать объяснения.\n\nОбе стороны представили документы. В этом трудность страны с писаным законом." #NT!
 nd_occ.13.a: "Пусть архивы спорят. А пока мы управляем." #NT!
  
  # --- nd_occ.14: the men of Cahors ----------------------------------------- 
 nd_occ.14.t: "Люди Каора" #NT!
 nd_occ.14.d: "В городе проживает восемь тысяч человек, и он расположен внутри Лота, и на протяжении ста лет его название было обычным европейским словом, обозначающим ростовщика. Каорсинс финансировал епископов, зажимы для шерсти, выкупы и ярмарки Шампанского; их дважды высылали из Англии и оба раза приглашали обратно, потому что никто другой не давал денег в долг такими темпами, как тратилась корона. Данте поместил их в седьмой круг и назвал город по тому же принципу, что и Содом.\n\nВ 1316 году кардиналы, запертые в Лионе, избрали кагорсена, Жака Дюза, сына сапожника, который изучал право и разбирался в деньгах лучше, чем любой папа до него, и правил в Авиньоне восемнадцать лет.\n\nКерси принадлежит нам, и его заслуга тоже. Страна, которая в течение трех столетий хранила каждую транзакцию на бумаге, оказывается, строила банковскую систему, даже не называя ее таковой." #NT!
 nd_occ.14.a: "Их бумага не хуже монеты и очищается быстрее." #NT!
  
  # --- nd_occ.15: the privilege of Bordeaux --------------------------------- 
 nd_occ.15.t: "Привилегия Бордо" #NT!
 nd_occ.15.d: "Каждую осень вино из горной страны стекает по Лоту, Тарну и Гаронне и каждую осень останавливается в Бордо, потому что у горожан Бордо есть хартия, согласно которой так должно быть. Никакое вино из города не может продаваться в порту, пока не соберется бордосский урожай. В хороший год это означает Мартинмас. В плохом это означает Пасху, когда английский флот отплыл и бочки начали вращаться.\n\nЭта привилегия ценнее для города, чем его стены, и каждый король Англии продлевал ее, потому что город каждый раз платил за обновление.\n\nГород теперь наш, как и вся страна над ним. Хартия представляет собой лист пергамента, который можно сжечь сегодня днём. Должно ли это быть так, это другой вопрос, потому что каждая свобода в этой стране — это лист пергамента, который кто-то может сжечь." #NT!
 nd_occ.15.a: "Аннулируйте это. Река несет все, что на ней погружено." #NT!
 nd_occ.15.b: "Подтвердите это и получите арендную плату за порт." #NT!
  
  # --- nd_occ.16: the general pact ------------------------------------------ 
 nd_occ.16.t: "Генеральный пакт" #NT!
 nd_occ.16.d: "На сборку уходит четыре года, и когда все будет готово, оно заполнит комнату. Каждое консульство, каждая долина, каждое виконтство и каждый бастид в стране сдают заверенную копию своей хартии, своих форсов или своих обычаев в архив в Тулузе и забирают с собой запечатанное обязательство, что страна будет их защищать. Прилагаемое к нему правило состоит из одной строки: ничто не связывает никого, кроме сундука.\n\nЛимузен и Овернь подписали контракт, о чем ни один король никогда не думал просить их об этом. Арагон прислал наблюдателей. То, что здесь создано, вовсе не является королевством в северном смысле, и клерки, составившие его проект, не совсем уверены, как его назвать.\n\nПервая всеобщая ярмарка в соответствии с собственным миром пакта намечена на июль на берегу реки в Бокере." #NT!
 nd_occ.16.a: "Архив – это конституция. Берегите его и защищайте." #NT!
 nd_occ.16.b: "Откройте ярмарку. Пусть чужие судятся по своим законам." #NT!
  
  # --- nd_occ.17: the passes ------------------------------------------------ 
 nd_occ.17.t: "Перевалы" #NT!
 nd_occ.17.d: "Вызов — это лист бумаги, пока кто-нибудь не прибудет с ним с армией за спиной, а армия, приходящая в эту страну с запада, прибывает через одну из двух дверей.\n\nБайонна является английской с тех пор, как Элеонора вышла замуж за Генриха в 1152 году, и это самый загруженный порт между Жирондой и Эбро: китовый жир, железо, наваррская шерсть и все, что имеет значение. Сен-Жан-Пье-де-Пор стоит у подножия дороги через Ронсево, где арьергард Карла Великого был разбит на куски и где каждый паломник, погонщик и курьер из Наварры все еще спускается в Гасконь.\n\nИ то и другое удерживается. Доктрина, провозглашенная в Ортезе в 1347 году, перестала быть формой слов и стала вопросом гарнизонов, и разница между ними составляет примерно тысячу сто человек." #NT!
 nd_occ.17.a: "Держите двери, и спор утихнет сам собой." #NT!
  
  # --- nd_occ.18: the Navarrese inheritance --------------------------------- 
 nd_occ.18.t: "Наваррское наследство" #NT!
 nd_occ.18.d: "Корона приходит, как и все в Пиренеях, через брак, который в то время никто не считал важным. Фуа, Беарн, Марсан, Альбре и теперь Наварра подчиняются одному двору, а это означает, что один и тот же человек является вассалом Фуа, сувереном Беарна и королем по другую сторону герба. Любому юристу в Париже, которого попросят описать эту договоренность, потребуются три листа бумаги и тихий день.\n\nЕй нельзя управлять из двух мест одновременно. Ортез — это место, где была создана доктрина и где форсы приносят присягу перед лордом. Памплона — столица королевства, которого хотят и Кастилия, и Арагон, и суд, который заседает там, — это суд, перед которым должна ответить каждая канцелярия в Европе.\n\nТам, где заседает суд, будет решаться, какой будет эта страна на следующие двести лет." #NT!
 nd_occ.18.a: "Оставьте корт в Ортезе. Гора – это царство." #NT!
 nd_occ.18.b: "Отвезите суд в Памплону. Будь королем там, где делаются короли." #NT!
  
  # --- nd_occ.19: the debt of Muret ----------------------------------------- 
 nd_occ.19.t: "Долг Мюре" #NT!
 nd_occ.19.d: "Двенадцатого сентября 1213 года, недалеко от города в двенадцати милях от Тулузы, Петр II Арагонский поставил себя во вторую линию вместе с обычными рыцарями, потому что ему сказали, что он держится в стороне и не хотел, чтобы это повторялось дважды. Симон де Монфор вышел из ворот со всем, что у него было, и проехал прямо через эту линию. Король был убит в давке, окситанские лорды, стоявшие за ним, так и не закончили построение, и их армия распалась.\n\nВ течение двадцати лет Миди принадлежал северу, и гребень Пиренеев, который никогда не был границей ни в каком смысле, который имел бы значение для кого-либо, живущего на ней, стал таковым.\n\nХака и Уэска ​​— наши: долина Арагон, из которой вышла Арагон, и первый город, который он когда-либо взял. Спустя пятьсот лет долг, наконец, может быть погашен. Как это будет решено – это последнее, что должна решить эта страна." #NT!
 nd_occ.19.a: "Один мир над обоими склонами. Питер приехал на север в качестве партнера." #NT!
 nd_occ.19.b: "Ответьте на обвинение Монфора. Гребень — это дорога, а не граница." #NT!
  
  # --- Destiny timed modifiers ---------------------------------------------- 
 STATIC_MODIFIER_NAME_nd_occ_dest_riu_liure: "Открытая река" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_riu_liure: "Привилегия аннулируется, и «Гаронна» несет все, что на ней загружено. Кагор, Гайак и Муассак продаются в октябре впервые за двести лет." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_carta_del_port: "Устав порта" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_carta_del_port: "«Бордо» сохраняет свою франшизу, и договор получает долю от доходов, которые получает франшиза. Подтвержденная свобода — это свобода, которая все еще будет существовать, когда мы сможем к ней обратиться." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_arquiu_comun: "Общий архив" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_arquiu_comun: "Каждый устав в стране заверяется, копируется и хранится в одном сундуке, с правилом, что ничто не связывает никого, чего нет в нем." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_patz_de_la_fiera: "Мир ярмарки" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_patz_de_la_fiera: "Один месяц в году мир пакта распространяется на всех, кто приходит, к какой бы короне они ни принадлежали, и их судит законный торговец и никто другой." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_cort_d_ortes: "Суд в Ортезе" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_cort_d_ortes: "Суд остается там, где форсы приносят присягу перед лордом. Царство, управляемое изнутри гор людьми, которые могут доехать до любого из них за четыре дня." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_cort_de_pampalona: "Суд в Памплоне" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_cort_de_pampalona: "Суд переступает черту и серьезно относится к титулу Наварры. Каждая канцелярия в Европе теперь должна писать нам как королю, и у каждого курьера теперь есть гора на пути." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_dos_versants: "Оба склона, один мир" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_dos_versants: "Эбро и Гаронна под одним поселением, как и намеревался Петр Арагонский, когда пришел на север в 1213 году, и чего с тех пор никому не удавалось." #NT!
 STATIC_MODIFIER_NAME_nd_occ_dest_responsa_de_mureth: "Ответ в Мюре" #NT!
 STATIC_MODIFIER_DESC_nd_occ_dest_responsa_de_mureth: "Нападение Монфора ответило с опозданием на пять веков, но с другой стороны. Гребень рассматривается как дорога, а все, что по обе стороны от него, считается достижимым." #NT!
  
  # --- Destiny buildings ---------------------------------------------------- 
 nd_occ_fiera_franca: "Фьера Франка" #NT!
 nd_occ_fiera_franca_desc: "Зафрахтованная свободная ярмарка: франшиза, охранная грамота и освобождение от уплаты налогов на определенное количество дней, со своим собственным миром и своим собственным торговым судом. Один из них был построен в Бокере в 1217 году и каждое лето привлекал каталонцев, генуэзцев и левантийцев на берег реки на месяц." #NT!
 nd_occ_fiera_maintenance: "Содержание ярмарки" #NT!
 nd_occ_fiera_maintenance_desc: "Холст и веревки для палаток, бумага для регистра справедливого суда, вино для вступительной речи и соль на месяц кормления незнакомцев." #NT!
 nd_occ_castel_sobeiran: "Кастель Собейран" #NT!
 nd_occ_castel_sobeiran_desc: "Собственная крепость принца на возвышенности, кирпичная с нуля, в духе Монтанера и Мовезена, с оплачиваемым гарнизоном, одной башней и ни одним епископом, аббатом или королем, не претендующим ни на один камень." #NT!
 nd_occ_castel_maintenance: "Гарнизон крепости" #NT!
 nd_occ_castel_maintenance_desc: "Кирпич и тесаный камень для занавеса, оружие в башне, древесина для щитов и ткань для людей, которые никогда не возвращаются домой на сбор урожая." #NT!
  
  # --- Destiny event option tooltips ---------------------------------------- 
 nd_occ.13.a_tt: "Вопрос остается открытым, и палаты продолжают его обсуждать." #NT!
 nd_occ.14.a_tt: "Кредит Керси учитывается на собственных счетах страны." #NT!
 nd_occ.15.a_tt: "Хартия Бордо аннулируется, и горные вина отправляются по мере готовности." #NT!
 nd_occ.15.b_tt: "Хартия остается в силе, и в договор идет доля арендной платы за порт." #NT!
 nd_occ.16.a_tt: "Архив Тулузы становится конституционным архивом страны." #NT!
 nd_occ.16.b_tt: "Общая ярмарка открывается каждый июль в соответствии с собственным миром и двором пакта." #NT!
 nd_occ.17.a_tt: "В Байонне и на дороге Ронсево размещены гарнизоны и остаются гарнизоны." #NT!
 nd_occ.18.a_tt: "Суд находится в Ортезе, а управление королевством осуществляется с гор." #NT!
 nd_occ.18.b_tt: "Суд переезжает в Памплону, и титул Наварры принимается." #NT!
 nd_occ.19.a_tt: "Эбро и Гаронна заключены в соответствии с одним миром." #NT!
 nd_occ.19.b_tt: "Гребень рассматривается как дорога, и оба склона удерживаются силой." #NT!
  
  # ===== BUREAUCRACIES ===== 
 occ_estats_de_lengadoc_bureaucracy: "Эстат де Ленгадок" #NT!
 occ_estats_de_lengadoc_bureaucracy_desc: "Провинциальные поместья Лангедока на ежегодной сессии с 1340-х по 1789 год. Заседали три ордена: двадцать три епископа под началом архиепископа Нарбоннского в качестве президента, двадцать три барона и шестьдесят восемь депутатов городов, чей вес был равен двум другим. Лангедок был государством и никогда не признавал королевского избрания. Корона просила, поместья заключали дон-гратуит в единовременную сумму, а провинция затем распределяла эту сумму сама через ассиеты своих гражданских епархий, состав которых она регулировала с 1553 года и чьи счета она получила право проверять в январе 1658 года. выше короны." #NT!
 occ_cort_dels_ajudas_bureaucracy: "Корт-дельс-Аюдас" #NT!
 occ_cort_dels_ajudas_bureaucracy_desc: "Cour des Aides, созданный Карлом VII 20 апреля 1437 года как второй в королевстве и включающий весь Юг: Лангедок, Руэрг, Керси и часть Гиенны. Людовик XI закрепил его в Монпелье в 1467 году. Парламент Тулузы и поместья объединились против него и запретили его в 1484 году; он вернулся к 1486 году, и эдикт от июля 1629 года объединил его со счетной палатой 1523 года в Счетную палату, помощников и финансов. Его делом было фискальное управление: регистрация финансовых указов, вынесение суждений помощникам и габель в последней инстанции, а также рассмотрение заявлений об освобождении от уплаты налогов. Это была единственная скамья на Миди, которая могла управлять узурпацией дворянства человека и аннулированием его освобождения." #NT!
 occ_lo_compes_bureaucracy: "Ло Компес" #NT!
 occ_lo_compes_bureaucracy_desc: "Компуа, общинная земельная книга Миди. Самый старый из сохранившихся - 1320 года, и большинство общин сохранили его до революции. Каждый участок терруара, хранящийся в хвосте, был пройден, измерен, оценен по качеству и внесен в реестр на имя его владельца, а весь реестр переделывался примерно раз в жизни. Из этого следует «taille reelle»: налог прилагается к земле, а не к человеку, поэтому участок, внесенный в качестве подлежащего сдаче, остается подлежащим продаже в руках дворянина, тогда как к северу от Луары покупка дворянина вообще выходила из списка. Три реестра расположены друг над другом: провинциальный кадастр, разделяющий сборы между епархиями, епархиальный кадастр между общинами и состав деревни между соседями, которые все могут слышать, как его читают вслух." #NT!
 occ_cort_major_de_bearn_bureaucracy: "Корт Майор де Беарн" #NT!
 occ_cort_major_de_bearn_bureaucracy_desc: "Cour Majour, высокий суд Беарна, который Гастон Фебус сократил до двенадцати баронов, заседавших в качестве юратов в Ортезе, и который следовал за судом в По после 1464 года. Он выносил решение в последней инстанции, его нужно было заслушать, прежде чем Беарн вступит в какую-либо войну за пределами своих границ, и он получил присягу виконта при его вступлении на престол: лорд поклялся сначала сохранить Форс, и только после этого Беарн присягнул ему. Форы составлялись, начиная с одиннадцатого века, и расширялись при Фебусе, и они прежде всего гарантируют свободу домашнего хозяйства от произвольных налогов. Именно на этой почве стоял Феб в 1347 году, когда он ответил на призыв Филиппа VI о том, что он воздаст должное Фуа, но что он держит Беарн от Бога и ни от одного человека в мире." #NT!
  
  # The auto-modifier governing the slot grant on formation 
 AUTO_MODIFIER_NAME_nd_occ_bureaucracy_authority: "Учреждения Миди" #NT!
 AUTO_MODIFIER_DESC_nd_occ_bureaucracy_authority: "Окситания правит с помощью письменных инструментов, и каждый инструмент имеет посох. Помимо создания столицы, совет может содержать два постоянных учреждения." #NT!
