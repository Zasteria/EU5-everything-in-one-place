l_russian:
  
  # ========================================================================== 
  # Occitania (OCC): National Destinies 
  # ========================================================================== 
  
  # --- Formation event ------------------------------------------------------ 
 nd_occ.1.t: "Страна писаного права" #NT!
 nd_occ.1.d: "От Роны до Адура, от Оверни до водораздела Пиренеев говорят на одном языке и соблюдают одни законы. Здесь записано право человека. Консулы каждого города держат в сундуке грамоту; виконты Беарна присягают форам еще до того, как форы присягают им; нотариусы копируют Юстиниана, а север никого не копирует. Две короны претендуют на эту землю, и ни одна из них никогда ею не управляла, а теперь они воюют из-за Гаскони и им есть о чем подумать.\n\nТо, что здесь основывается, не подлежит сомнению. Вот как она держится вместе.\n\nТулуза сказала бы, что страна — это сумма ее хартий: эта власть возникает из заклятых обычаев городов и долин, и что принц — это человек, который их ратифицирует. Ортез сказал бы что-то другое. Когда Филипп Валуа призвал Гастона Фебуса на свою войну, граф ответил, что он воздаст должное Фуа, но что он держит Беарн от Бога и ни от одного человека в мире, и следующие сорок восемь лет он провел, доказывая это, заставляя обоих королей гадать.\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_occ.1.a: "Lo Pacte Consular: страна — это сумма ее уставов" #NT!
 nd_occ.1.b: "Тенк де Дегун: мы держимся от Бога и ни от кого" #NT!
  
  # --- nd_occ.2: the Leys d'Amors ------------------------------------------- 
 nd_occ.2.t: "Законы любви" #NT!
 nd_occ.2.d: "За четырнадцать лет до того, как короны вступили в войну, семь горожан Тулузы объявили, что первого мая они вручат золотую фиалку тому, кто принесет им лучшее кансо на языке ок. С тех пор они делают это каждый год. Это единственный литературный конкурс в Европе с постоянным жюри и письменным сводом правил, и Гильем Молинье потратил десятилетие на то, чтобы превратить этот свод правил в нечто большее: грамматику, риторический трактат, просодию. Он называет это Leys d'Amors, Законами любви, и это первая попытка кого-либо в Европе издать законы на местном языке так, как юрист издает законы для города.\n\nКанцлеры спрашивают, для чего нужны законы. Канон, фиксирующий язык, или правила конкурса и ничего более?" #NT!
 nd_occ.2.a: "Исправьте язык. Одна грамматика, одно правописание, один канон." #NT!
 nd_occ.2.b: "Судите по стиху, а не по диалекту. Держите конкурс открытым." #NT!
  
  # --- nd_occ.3: the registers of Pamiers ------------------------------------ 
 nd_occ.3.t: "Регистры Памьера" #NT!
 nd_occ.3.d: "Катарской церкви не осталось. Монсегюр пал в 1244 году, и двести тех, кто не отрекся, спустились в огонь у подножия скалы. Гильем Белибаст, последний перфектус, которого кто-либо может назвать, был сожжен в Виллеруж-Термене в 1321 году. Сохранились только документы.\n\nЖак Фурнье, епископ Памье, провел семь лет, допрашивая пастухов Монтайю и записывая все это: что они ели, на чьей кровати спали, что, по их мнению, происходило после смерти. В 1334 году кардиналы Авиньона избрали его папой. Его реестр находится в епископском архиве, а рядом с ним лежат списки конфискаций крестового похода, в которых одним и тем же осторожным почерком записано, какая именно окситанская семья потеряла какое феодальное владение и какая северная линия его получила.\n\nАрхив теперь ваш. Вот и вопрос, что с этим делать." #NT!
 nd_occ.3.a: "Откройте рулоны конфискации. Каждое название будет выпущено." #NT!
 nd_occ.3.b: "Пусть мертвые хоронят мертвых. Закройте архив и идите дальше." #NT!
  
  # --- nd_occ.4: Orthez, 1347 ------------------------------------------------ 
 nd_occ.4.t: "От Бога и ни от кого" #NT!
 nd_occ.4.d: "Вызов приходит Ортезу в обычном виде. Король Франции требует службы своего вассала графа Фуа со всеми его людьми для войны на севере.\n\nОтвет, который приходит назад, осторожен и совершенно непреклонен. Фуа – почтение: граф держит Фуа короной и не претендует на иное. Для Беарна – ничего. Беарн принадлежит Богу, а не какому-либо человеку в мире, и Беарн будет нейтральным. Гастон, который подписывает себя как Фебус и взял солнце в качестве своего устройства, затем проводит остаток своей жизни, зарабатывая на должности: поочередно беря английские и французские деньги, защищая Монтанера и Мовезена от обоих и написав книгу об охоте, в то время как все вокруг него разорены войной, к которой он отказался присоединиться.\n\nЭтот метод работает только до тех пор, пока кто-то может его обеспечить. Какой должна быть доктрина?" #NT!
 nd_occ.4.a: "Вооруженный нейтралитет: укрепляйте хребты и не отвечайте на призывы" #NT!
 nd_occ.4.b: "Арендуйте меч той короне, которая платит в этом сезоне." #NT!
  
  # --- nd_occ.5: the plague at Montpellier ------------------------------------ 
 nd_occ.5.t: "Рука хирурга" #NT!
 nd_occ.5.d: "Монпелье преподает медицину с тех пор, как кардинал Конрад дал ему хартию в 1220 году, совместно арабскими, еврейскими и латинскими властями, и это первый факультет такого рода в Европе. Весной 1348 года на Рону поднимается чума, и факультет узнает, чего стоят его власти. Большинство мастеров умирают. Говорят, что те, кто бежит, бежали первыми.\n\nГи де Шолиак, вышедший из бедноты Оверни и получивший здесь степень, не баллотируется. Он все это время остается в Авиньоне, подхватывает болезнь, переживает ее и записывает в точности все, что видел, включая то, что он был напуган и что врачи были бесполезны. Его «Великую хирургию» будут копировать в течение двухсот лет, главным образом потому, что она признает, как многого не знал ее автор." #NT!
 nd_occ.5.a: "Запишите то, что мы на самом деле видим, и проанализируйте, чтобы увидеть больше" #NT!
 nd_occ.5.b: "Запирайте ворота: советы по здравоохранению, карантин и закон о захоронениях" #NT!
  
  # --- nd_occ.6: Sainte-Cecile of Albi --------------------------------------- 
 nd_occ.6.t: "Собор-крепость" #NT!
 nd_occ.6.d: "Бернар де Кастане, епископ и инквизитор Альби, заложил первый кирпич в 1282 году на город, который был сожжен, оштрафован и лишен собственности на памяти живущих. В том, что он построил, нет аркбутанов, западной двери и окон, через которые человек мог бы пролезть. Стены кирпичные, толщиной пять метров у основания, возвышаются прямо из скалы над Тарном, словно донжон. Здесь один вход, и его можно закрыть.\n\nЕго строили каменщики двести лет. Ничто на Миди не говорит более ясно, что завоеванные думали о побежденных, и ничто не было более полезным, когда пришли свободные отряды и деревне больше некуда было девать свое зерно и своих детей." #NT!
 nd_occ.6.a: "Каждый приход поставит стену в свою церковь" #NT!
  
  # --- nd_occ.7: Bernuy stands surety ---------------------------------------- 
 nd_occ.7.t: "Голубое золото" #NT!
 nd_occ.7.d: "Вада растет где угодно. Он прибыльно растет в треугольнике, образованном между Тулузой, Альби и Каркассоном, и в течение ста лет этот треугольник продает большую часть синего цвета в Западной Европе. Листья измельчают под жерновом, скатывают в шарики, называемые коками, сушат на плетнях и снова измельчают, и осенью вся страна пахнет ими.\n\nЛюди, которые с ними обращаются, строят дворцы. Жан де Бернюи, конверсо из Бургоса, который поселился в Тулузе и не торговал ничем, кроме вады, становится настолько богатым, что, когда Франсуа I схвачен в Павии, а Карл V хочет выкуп в золоте, именно Бернюи выступает поручителем за короля Франции. Английский путешественник пишет домой, что вада сделала эту страну самой счастливой и богатой в Европе.\n\nКорона хотела бы получить залог. Торговля хотела бы капитала." #NT!
 nd_occ.7.a: "Пообещайте удачу вайде. Король запомнит это." #NT!
 nd_occ.7.b: "Держите капитал в торговле, где он зарабатывает" #NT!
  
  # --- nd_occ.8: indigo ------------------------------------------------------- 
 nd_occ.8.t: "Краска дьявола" #NT!
 nd_occ.8.d: "Он поступает через атлантические порты в бочках — черный пирог из Индии и Антильских островов, из десятой части которого получается более глубокий синий цвет, чем у вайды. Красильщик, попробовавший это, не возвращается назад.\n\nТулуза сражается с ним в одном месте, где всегда сражалась, а именно в своде законов. Краску с кафедры осуждают как едкий яд, разлагающий ткань. В 1598 году корона запрещает это во Франции под страхом смерти, и этот запрет возобновляется и возобновляется, и каждый красильщик, имеющий клиента, спокойно игнорирует его. У страны-ваад осталось, возможно, два поколения, и они проведут их, доказывая, что закон на ее стороне." #NT!
 nd_occ.8.a: "Запретить использование красителя и обеспечить его соблюдение в каждом порту, который мы контролируем." #NT!
 nd_occ.8.b: "Откройте порты. Лучше наши купцы его продадут, чем у них." #NT!
  
  # --- nd_occ.9: Villers-Cotterets -------------------------------------------- 
 nd_occ.9.t: "На французском родном языке и ни на каком другом" #NT!
 nd_occ.9.d: "Постановление состоит из ста девяноста двух статей, и почти все они представляют собой разумную реформу: приходские книги о крещении, надлежащий протокол судебных заседаний, прекращение судебного разбирательства только путем письменного заявления. Статья сто одиннадцатая состоит из четырех строк. Все судебные решения, протоколы, запросы, контракты и любые другие акты правосудия в королевстве должны быть произнесены, записаны и доставлены сторонам на родном французском языке и ни на каком другом.\n\nВ стране, где все нотариальные акты на протяжении трехсот лет были составлены на окситанском языке, это не является правилом относительно правописания. Реестры являются государственными. Тот, кто их пишет, решает, на каком языке думает государство, и ответ только что был решен в Париже." #NT!
 nd_occ.9.a: "Наши регистры остаются на том языке, на котором они всегда хранились." #NT!
 nd_occ.9.b: "Двуязычная канцелярия: каждый акт проводится дважды, в обоих случаях." #NT!
  
  # --- nd_occ.10: Riquet ------------------------------------------------------- 
 nd_occ.10.t: "Место соединения двух морей" #NT!
 nd_occ.10.d: "Каждый инженер, начиная с римлян, понимал, что канал от Гаронны до моря стоит целого флота, и каждый из них потерпел неудачу в одном и том же. Не копание. Вода. Канал должен быть самым высоким посередине, а на вершине Науруза нет ничего, чем можно было бы его заполнить.\n\nПьер-Поль Рике, налоговый фермер из Безье без формального образования, решил эту проблему, пройдя по Черной горе и вычислив, что потоки на ее северном склоне можно собрать с помощью риголы и провести тридцать миль по контуру до водораздела. Он получил полномочия в 1666 году, начал работу в 1667 году, нанял двенадцать тысяч человек, заложил свои земли, взял в долг под залог долей своих дочерей и умер в октябре 1680 года, задолжав два миллиона ливров, за семь месяцев до того, как первый конвой из двадцати пяти лодок вышел из Тулузы в море." #NT!
 nd_occ.10.a: "Вода дошла до Науруза. В этом была вся проблема." #NT!
  
  # --- nd_occ.11: the Desert --------------------------------------------------- 
 nd_occ.11.t: "Церковь пустыни" #NT!
 nd_occ.11.d: "Когда в 1685 году был отменен Нантский эдикт, севенцы не обратились в другую веру и не уехали. Они поднимаются в ущелья и проводят там свои собрания, которые они называют Пустыней, а когда проповедники ломаются на колесе, вместо этого начинают пророчествовать их прихожане, в том числе дети, по-французски никто из них не говорит. \n\nВ июле 1702 года они убивают аббата дю Шайла в Пон-де-Монвер, и дело перерастает в войну. Несколько тысяч пастухов и чесальщиков шерсти под командованием Ролана Лапорта и Жана Кавалье сковывают маршалов Франции на три года, бастуя по ночам, поджигая церкви и возвращаясь к ткацкому станку к утру. Страна их не отдаст. У него есть трехвековой опыт не сдавать людей." #NT!
 nd_occ.11.a: "Пусть проповедуют в оврагах. Никого не посылайте за ними." #NT!
 nd_occ.11.b: "Навяжите мир: разместите гарнизоны в долинах и положите конец этому" #NT!
  
  # --- nd_occ.12: Font-Segugne ------------------------------------------------- 
 nd_occ.12.t: "Семь поэтов в Фон-Сегюне" #NT!
 nd_occ.12.d: "Двадцать первого мая 1854 года семь молодых людей встречаются в загородном доме недалеко от Авиньона и решают снова дать языку правописание, словарь и литературу. Они называют себя Фелибрами. Фредерик Мистраль потратит двадцать лет на словарь и получит Нобелевскую премию по литературе в 1904 году, а «Игры Флоро» в Тулузе, которые оценивают стихи на этом языке с 1324 года, все еще будут собираться для этого.\n\nОни расходятся во мнениях почти сразу, и именно о том, о чем спорили консистори более пятисот лет назад. Написать язык, на котором сейчас говорит Рона, и быть прочитанным? Или написать ее так, как ее написали трубадуры, и воссоединить язык, который Париж три столетия ломал на наречие?" #NT!
 nd_occ.12.a: "Напишите так, как говорится. Живой язык или его отсутствие." #NT!
 nd_occ.12.b: "Напишите это так, как написали трубадуры. Опять один язык." #NT!
  
  # --- Event option tooltips ------------------------------------------------ 
 nd_occ.1.a_tt: "Суверенитет возникает из клятвенных хартий городов и долин." #NT!
 nd_occ.1.b_tt: "Суверенитет исходит от принца, который никому не оказывает почтения." #NT!
 nd_occ.2.a_tt: "Академия исправляет одну грамматику, а нотариусы ее пишут." #NT!
 nd_occ.2.b_tt: "К участию в конкурсе допускаются любые диалекты, получившие фиолетовую награду." #NT!
 nd_occ.3.a_tt: "Каждый титул, полученный в результате конфискации во время крестового похода, подлежит отзыву." #NT!
 nd_occ.3.b_tt: "Поселение 1229 года стоит, архив запечатан." #NT!
 nd_occ.4.a_tt: "Укрепляйте хребты, не отвечайте на призывы и не будьте ничьим вассалом." #NT!
 nd_occ.4.b_tt: "Создавайте компании и сдавайте их в аренду той короне, которая платит." #NT!
 nd_occ.5.a_tt: "Преподаватели преподают на основании историй болезни, а не авторитетных источников." #NT!
 nd_occ.5.b_tt: "Консулы вводят карантин, советы по здравоохранению и закон о захоронении." #NT!
 nd_occ.6.a_tt: "Каждый приход окружает свою церковь и хранит в ней урожай." #NT!
 nd_occ.7.a_tt: "Вада-состояние гарантирует выкуп короля, и его помнят за это." #NT!
 nd_occ.7.b_tt: "Состояние остается в мельницах, препятствиях и кредитной книге." #NT!
 nd_occ.8.a_tt: "Индиго конфискуют и сжигают везде, где действует наш указ." #NT!
 nd_occ.8.b_tt: "Синий продается через наши склады, независимо от того, с какого завода он поступил." #NT!
 nd_occ.9.a_tt: "Акты правосудия остаются на том языке, на котором стороны фактически говорят." #NT!
 nd_occ.9.b_tt: "Каждый акт составляется дважды, что требует двойного труда клерка." #NT!
 nd_occ.10.a_tt: "Канал закончен, а человека, который его решил, больше нет." #NT!
 nd_occ.11.a_tt: "Собрания в оврагах остаются в покое." #NT!
 nd_occ.11.b_tt: "В долинах размещены гарнизоны, а собрания рассредоточены." #NT!
 nd_occ.12.a_tt: "Назовите язык, на котором сегодня говорят на Роне." #NT!
 nd_occ.12.b_tt: "Напишите его, как это делали трубадуры, и воссоедините диалекты." #NT!
  
  # ========================================================================== 
  # Timed modifiers 
