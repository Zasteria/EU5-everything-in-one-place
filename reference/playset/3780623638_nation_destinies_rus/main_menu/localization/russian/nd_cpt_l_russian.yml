l_russian:
  
  # ===== Event guard and destiny variables ===== 
  # nd_cpt_e1_done_tt lives here rather than in the shared 
  # nd_event_guards file, following the nd_dnm precedent, so this country's 
  # localization is self-contained. 
 nd_cpt_e1_done_tt: "$nd_cpt.1.t$ уже произошло" #NT!
 nd_cpt_formed_tt: "был провозглашен Коптский Египет." #NT!
 nd_cpt_path_a_tt: "Решил править через диван" #NT!
 nd_cpt_path_b_tt: "Выбрали править через патриархат" #NT!
 nd_cpt_path_c_tt: "Решил править через вооруженную сельскую местность" #NT!
  
  # ===== Formation event ===== 
 nd_cpt.1.t: "Книга и Крест" #NT!
 nd_cpt.1.d: "Аль-Насир Мухаммад мертв, и его сыновья раскалывают султанат между собой. Казначейство пусто, амиры вцепились друг другу в глотку, и единственные люди в Каире, которые знают, где на самом деле находятся деньги, — это коптские писцы дивана. На этой неделе перестали выдавать ключи.\n\nНикто в городе не понимает, что это такое. Копты составляют, пожалуй, каждый пятый египтянин, и эта доля падает каждое десятилетие. В 1301 году все церкви в Каире были закрыты, а христианам было приказано носить синие тюрбаны; в 1321 году было снесено около шестидесяти церквей. Каждый из этих лет вызывал волну преобразований, и люди, которые сейчас занимают налоговые должности, выросли, подсчитывая потери.\n\nЭто государство создается против течения, классом, единственное оружие которого состоит в том, что без него ничего не работает. Итак, первый вопрос одновременно является и последним: какое это будет государство?\n\n#bold Этот выбор открывает путь судьбы на вкладке «Традиции».#!" #NT!
 nd_cpt.1.a: "Ведите бухгалтерскую книгу, больше ничего не меняйте" #NT!
 nd_cpt.1.b: "Отдать землю патриарху" #NT!
 nd_cpt.1.c: "Принесите клятву, которую дали башмурцы" #NT!
  
  # ===== Advance events ===== 
 nd_cpt.2.t: "Болота Башмура" #NT!
 nd_cpt.2.d: "С башмурской традицией существует проблема, и люди, возрождающие ее, точно знают, в чем она заключается.\n\nПоследнее восстание Башмура было подавлено в 831 году. Аль-Мамун лично пришел на юг и натравил аль-Афшина на болотные деревни; пленные мужчины были казнены, женщины и дети проданы, поселения сожжены до тростниковых зарослей. Сам Башмур прекратил свое существование. За этим последовала первая большая волна обращений, и ни одна попытка организованного коптского восстания больше никогда не предпринималась.\n\nПятьсот лет — слишком долгий срок для того, чтобы традиция сохранилась. То, что передается деревням Дельты, — это не воспоминания, а история, собранная из фрагментов хроник и намеренно проповедуемая. Государство решило, что это не имеет значения. Сельская местность, которая верит, что когда-то воевала, будет сражаться." #NT!
 nd_cpt.2.a: "Пусть священники прочитают это вместе с мучениками" #NT!
 nd_cpt.2.b: "Пусть болотные шейхи расскажут по-своему." #NT!
  
 nd_cpt.3.t: "Бакт, пробитый" #NT!
 nd_cpt.3.d: "Пакт, подписанный в Донголе в 652 году, пережил все династии, унаследовавшие его: зерно, чечевица, вино и ткань шли вверх по реке из Египта, а сюда прибывало четыреста рабов в год. Он действовал почти семьсот лет, что делает его самым долго соблюдаемым договором, когда-либо зарегистрированным, и он распался на протяжении последнего поколения. В 1317 году клиент султана превратил тронный зал в Донголе в мечеть, и в Макурии разразилась гражданская война.\n\nПосланники, отправленные на юг в этом году, везут старый текст с вычеркнутым одним пунктом. Христиан нельзя продавать христианскому суду. Это самая дешевая статья соглашения и единственная, которую нубийцы когда-либо ненавидели, и отказ от нее обходится Каиру в дань, которую он может позволить себе потерять в обмен на единственную дружественную границу, которая у него есть." #NT!
 nd_cpt.3.a: "Зерно на юге, слоновая кость на севере, и никаких рабов." #NT!
  
 nd_cpt.4.t: "Абуна" #NT!
 nd_cpt.4.d: "Митрополит Эфиопской церкви рукоположен в Александрии и нигде больше. Император, находящийся за тысячу миль вверх по Голубому Нилу, не может рукоположить священника без епископа, которого назначает этот престол, и на протяжении веков эфиопские посольства приезжали на север с дарами и ждали, иногда десятилетиями, в то время как трон Святого Марка не торопился.\n\nРычаги действуют и в другую сторону, и оба двора знают это. Египет — страна, которая существует потому, что каждое лето прибывает река, и река течет с высокогорья. В Каире не раз говорилось, что эфиопы могут его повернуть, и не раз говорили в Гондаре, что могут.\n\nВ передней ждет посланник с обычной просьбой." #NT!
 nd_cpt.4.a: "Посвятите человека, о котором они просили" #NT!
 nd_cpt.4.b: "Пусть кафе еще немного постоит пустым." #NT!
  
 nd_cpt.5.t: "Роук" #NT!
 nd_cpt.5.d: "Исследование заняло два года и позволило повторно измерить каждый возделываемый феддан в Египте. Его служащие работали в армейских динарах, валюте, которая существует только на бумаге и только для этой цели, и когда они были закончены, доля султана в начисленном доходе возросла с четырех двадцать четвертых до десяти. Мужчины, которые ходили по полям, составляли реестры и утверждали, что итоги были в подавляющем большинстве коптами.\n\nРегистры снова открываются. Половина деревень Саида потеряла людей со времени последнего подсчета из-за чумы, бегства и обращения в веру, и в бухгалтерских книгах они до сих пор показывают полную численность. Писцы хотят знать, какую цифру записать." #NT!
 nd_cpt.5.a: "Запишите, что на самом деле обнаружили геодезисты." #NT!
 nd_cpt.5.b: "Сохраните старые итоги и позвольте им ходатайствовать" #NT!
  
 nd_cpt.6.t: "Архонты" #NT!
 nd_cpt.6.d: "Горстка коптских семей теперь держит доходы целых провинций на налоговых фермах. Они авансируют деньги в казну под счет поступлений в следующем году, они ведут счета, которые решают, каков будет сбор в следующем году, и из прибыли они жертвуют церкви, выкупают пленных и дают образование своим собственным сыновьям.\n\nЭто коптская позиция в ее наиболее полной и самой открытой форме. Все, что есть в сообществе, сосредоточено, возможно, в двадцати семьях и бухгалтерской книге, и один неудачный сезон или один правитель, решивший, что арифметика — это воровство, забрали бы все это сразу. Это не гипотеза. Так было и в 1293 году, и в 1301 году, и в 1321 году, и в 1354 году." #NT!
 nd_cpt.6.a: "Пусть они сразу скупают фермы" #NT!
 nd_cpt.6.b: "Сохраняйте фермы и платите им зарплату" #NT!
  
 nd_cpt.7.t: "За пределами досягаемости палаты" #NT!
 nd_cpt.7.d: "В результате голосования это государство стало миафизитским. Вопрос был поднят в поместье с коптским большинством, признание изменилось, и это изменение было полностью законным.\n\nТа же процедура выполняется в обратном порядке. Палата, вес которой стал суннитской, может совершить то же движение в другом направлении, и с каждым десятилетием обращения арифметика становится проще. В обозримом будущем не будет года, когда это станет тяжелее.\n\nТак что исповедь пишется вообще вне политики. Он сделан вне досягаемости любой будущей палаты, любого иностранного покровителя, который мог бы потребовать его как условие, и любого победителя, который мог бы получить его за столом мира. Цена точная, и ее платим мы так же, как и кто-либо другой: эта корона уже не сможет изменить своей веры ни по какой причине, никогда." #NT!
 nd_cpt.7.a: "Пусть это будет решено и пусть оно не будет вновь открыто" #NT!
  
 nd_cpt.8.t: "Отец реформ" #NT!
 nd_cpt.8.d: "Кирилл Четвертый был патриархом семь лет и умер в сорок пять лет. В то время он основал первые современные коптские школы, запустил второй типографский станок, когда-либо действовавший в Египте, открыл школу для девочек в Каире, когда почти никто в стране этого не сделал, и заставил церковь покупать книги, а не копировать их.\n\nЕго аргумент был арифметическим. Сообщество потратило пятьсот лет, теряя людей, и не собиралось возвращать ни одного из них своей многочисленностью. Что оно могло сделать, так это стать самым образованным населением Египта и позволить государству обнаружить, что им невозможно управлять без них. Это старейшая из существующих коптских стратегий, переработанная для эпохи печатных станков." #NT!
 nd_cpt.8.a: "Купите пресс и откройте школу для девочек." #NT!
  
  # ===== Formation timed modifiers ===== 
 STATIC_MODIFIER_NAME_nd_cpt_ledger_state: "Книга хранит состояние" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_ledger_state: "Клерки управляют как клерки. Мечети остаются открытыми, кади сохраняют свои суды, мусульманские знатные люди сохраняют свои офисы, а государство является коптским только наверху. Он выживает благодаря своей незаменимости, а это означает, что он не обещает затронуть ничью веру." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_patriarchs_land: "Патриарх забирает землю" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_patriarchs_land: "Монашеские поместья становятся королевскими землями, коптский календарь становится налоговым годом, а исповедь навязывается в сельской местности. Самый быстрый путь выхода из статуса меньшинства, который, скорее всего, закончится тем, что за него ответит все сообщество." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_marsh_oath: "Клятва на болотах" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_marsh_oath: "Восстание, подавленное в 831 году, раскопано, проповедуется и присягается. Все участники знают, что традиция скорее изобретается, чем продолжается. В любом случае он вооружает Дельту, и иностранные суды расценивают результат как крестьянское восстание, а не как королевство." #NT!
  
  # ===== Advance event timed modifiers ===== 
 STATIC_MODIFIER_NAME_nd_cpt_martyrs_of_bashmur: "Мученики Башмурские" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_martyrs_of_bashmur: "Башмур входит в святцы святых и читается с амвона вместе с остальными. Церковь владеет этой историей, и люди, которые маршируют, делают это потому, что им приказал священник." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_shaykhs_of_the_marsh: "Шейхи болот" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_shaykhs_of_the_marsh: "Деревни Дельты хранят информацию, и государство не имеет права ее редактировать. Менее полезна в качестве доктрины, значительно труднее провести армию." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_baqt_renewed: "Обновленный бакт" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_baqt_renewed: "Зерно и ткань вверх по реке, слоновая кость и золото вниз, а пункт о рабстве был исключен из договора семисотлетней давности." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_abuna_consecrated: "Освященный Абуной" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_abuna_consecrated: "Столичная Эфиопия, о которой просили, была создана без десятилетнего ожидания. Щедрость в этом вопросе Гондар помнит очень давно." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_see_left_vacant: "Престол остался вакантным" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_see_left_vacant: "Ни один митрополит не послан. Вся церковь ожидает согласия Александрии, и всем заинтересованным лицам напоминают, кто является держателем рукоположения." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_survey_as_it_is: "Опрос в его нынешнем виде" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_survey_as_it_is: "Регистры исправлены в соответствии с тем, что обнаружили геодезисты. Доходы падают, деревни перестают скрываться, и корона узнает, чем она на самом деле управляет." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_survey_as_it_was: "Старая оценка" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_survey_as_it_was: "В регистрах хранятся старые итоговые данные, и деревни могут подать петицию. Они сначала заплатят, а потом подадут петицию и запомнят, какая контора написала эту цифру." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_archons_buy_the_farms: "Архонты покупают фермы" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_archons_buy_the_farms: "Двадцать домохозяйств напрямую владеют доходами Египта и тратят полученную прибыль на церкви, школы и выкуп заключенных. Сообщество никогда не было более богатым и незащищенным." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_farms_stay_with_the_crown: "Фермы остаются с короной" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_farms_stay_with_the_crown: "Архонтам платят зарплату, и они ведут бухгалтерский учет, а доходы остаются там, где их может видеть казначейство. Никто в конторе не доволен." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_beyond_the_chamber: "За пределами палаты" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_beyond_the_chamber: "Признание было написано вне политики. Его нельзя отменить голосованием, потребовать в качестве условия или добиться за столом переговоров, и мы также не можем отказаться от него." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_fathers_of_reform: "Отец реформ" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_fathers_of_reform: "Прессы, школы и классы для девочек в Каире. Сообщество, которое не может победить с помощью цифр, решает выиграть с помощью школьного образования." #NT!
  
  # ===== Advances: Age of Traditions ===== 
 nd_cpt_diwan_of_the_copts: "Диван коптов" #NT!
 nd_cpt_diwan_of_the_copts_desc: "Коптские семьи управляли финансовыми бюро Египта в виде непрерывных секретарских династий, передавая торговлю от отца к сыну, и именно этот опыт, а не какая-либо охранная хартия, удерживал их на своем посту во время каждой чистки. Коптское государство начинается с реестра, потому что реестр — единственное, чем оно уже владеет." #NT!
 nd_cpt_house_of_the_flood_gauge: "Дом паводкового датчика" #NT!
 nd_cpt_house_of_the_flood_gauge_desc: "Микьяс на острове Равда, перестроенный в 861 году и читаемый каждое лето. Высота наводнения определила оценку года еще до того, как было пройдено хотя бы одно поле. Тот, кто читает колонку, пишет налоговую ведомость." #NT!
 nd_cpt_keeps_of_the_desert: "Крепости пустыни" #NT!
 nd_cpt_keeps_of_the_desert_desc: "После набегов на Скетис монастыри Вади-эль-Натрун воздвигли каср: каменную башню над колодцем и складом, построенную для того, чтобы община могла пережить осаду, а не выиграть ее. В этом предложении содержится вся коптская военная доктрина." #NT!
 nd_cpt_bashmurite_memory: "Память Башмурита" #NT!
 nd_cpt_bashmurite_memory_desc: "Последнее восстание Башмура было подавлено в 831 году, его деревни сожжены, а жители проданы, и никакого организованного коптского восстания за ним не последовало. Пять веков спустя не осталось никакой традиции, которую можно было бы возродить, только история. Государство проповедует это несмотря ни на что, потому что сельская местность, которая верит, что когда-то воевала, будет сражаться." #NT!
 nd_cpt_era_of_the_martyrs: "Эпоха мучеников" #NT!
 nd_cpt_era_of_the_martyrs_desc: "Коптский год отсчитывается от преследования Диоклетиана в 284 году, поэтому община отсчитывает свой собственный календарь от худшего события, которое когда-либо с ней случалось. Народ, который рассчитывает время на выживание, трудно сломить, угрожая ему." #NT!
  
  # ===== Advances: Age of Renaissance ===== 
 nd_cpt_school_of_the_scalae: "Школа Лестницы" #NT!
 nd_cpt_school_of_the_scalae_desc: "Аль-Сафи ибн аль-Ассаль кодифицировал коптское каноническое право в 1238 году, а Ибн Кабар завершил свою богайро-арабскую Scala Magna перед своей смертью в 1324 году. Церковь записывала свой собственный язык и закон именно в том поколении, которое наблюдало, как оба начали умирать." #NT!
 nd_cpt_the_renewed_baqt: "Обновленный Бакт" #NT!
 nd_cpt_the_renewed_baqt_desc: "Пакт 652 года действовал почти семьсот лет и сейчас рушится: зерно и ткань на юге, рабы и слоновая кость на севере. Христианский Египет продлевает его, исключая пункт о рабстве, что обходится казне в самую дешевую статью договора и покупает единственную дружественную границу, которая у него есть." #NT!
 nd_cpt_rumat_al_hadaq: "Румат аль-Хадак" #NT!
 nd_cpt_rumat_al_hadaq_desc: "Удары по глазам, названные так потому, что стреляли в лицо. Нубийские лучники отразили арабские вторжения в 641 и 652 годах, и с тех пор Египет их покупает. Государство, которое не может собрать солдат из враждебной страны, нанимает лучников из дружественной страны." #NT!
 nd_cpt_the_abuna_of_ethiopia: "Абуна Эфиопии" #NT!
 nd_cpt_the_abuna_of_ethiopia_desc: "Александрия посвящает митрополита Эфиопской церкви, поэтому император в тысяче миль вверх по реке зависит от епископа из Каира. Каир, в свою очередь, зависит от реки, текущей с его высокогорья. Ни один из судов так и не осмелился воспользоваться этим рычагом воздействия." #NT!
 nd_cpt_lamp_of_the_shadows: "Лампа теней" #NT!
 nd_cpt_lamp_of_the_shadows_desc: "В «Мисбах аз-Зульме» Ибн Кабара вся коптская канцелярия представлена ​​в двадцати четырех главах. Ее автор провел гонения 1321 года в бегах и умер в 1324 году. Это церковь, которая записывает себя на бумагу, потому что больше не может быть уверена, что о ней будут помнить." #NT!
  
  # ===== Advances: Age of Discovery ===== 
 nd_cpt_marsh_redoubts: "Болотные редуты" #NT!
 nd_cpt_marsh_redoubts_desc: "Башмур представлял собой узкие песчаные берега между зарослями тростника, снабженные рыбой и птицей, и окончание его стоило халифу личной экспедиции и армии под командованием аль-Афшина. Земля выполнила большую часть работы, и земля все еще здесь." #NT!
 nd_cpt_wardens_of_the_towers: "Стражи башен" #NT!
 nd_cpt_wardens_of_the_towers_desc: "Не боевые монахи. Вооруженных слуг, арендаторов и зависимых жителей деревни великий монастырь мог разместить на своих стенах, для укрытия которых была возведена башня над колодцем и складом." #NT!
 nd_cpt_the_monastery_farms: "Монастырские фермы" #NT!
 nd_cpt_the_monastery_farms_desc: "Сент-Энтони — это окруженная стеной деревня: переулки с двухэтажными домами, зерновая мельница, пресс для оливок, пальмовые сады и цистерны, питаемые источником, который до сих пор дает сто кубометров воды в день. Монашеское богатство в Египте заключалось в земле и воде, а не в милостыне." #NT!
 nd_cpt_the_rawk_survey: "Роук" #NT!
 nd_cpt_the_rawk_survey_desc: "Кадастровая съемка 1313–1315 годов переизмерила каждый феддан в Египте в армейских динарах и увеличила долю султана в начисленном доходе с четырех двадцать четвертых до десяти. Этим руководили коптские чиновники, и это наиболее ясная картина того, чем на самом деле занимался этот класс." #NT!
 nd_cpt_tongue_of_the_fathers: "Язык отцов" #NT!
 nd_cpt_tongue_of_the_fathers_desc: "Афанасий Кусский написал свою грамматику в четырнадцатом веке и прямо сказал, что люди этой страны забыли свой язык, в то время как другие не отказались от своего. Государство все равно этому учит, не питая иллюзий относительно того, что оно делает." #NT!
  
  # ===== Advances: Age of Reformation ===== 
 nd_cpt_the_paid_corps: "Платный корпус" #NT!
 nd_cpt_the_paid_corps_desc: "Христианская казна не может содержать аристократию рабов-солдат с помощью земельных грантов и религиозных облигаций, поэтому она держит ее наличными: мамлюки покупали напрямую, платили монетами из дивана и оставались верными ровно до тех пор, пока погашается платеж." #NT!
 nd_cpt_the_archon_households: "Дома Архонтов" #NT!
 nd_cpt_the_archon_households_desc: "Арахина были семьями коптских финансистов, которые обрабатывали доходы, обслуживали беев и строили церкви на окраинах. Богатство, сосредоточенное в руках горстки домохозяйств, является хрупким и единственным доступным способом удержать государство." #NT!
 nd_cpt_confession_beyond_reversal: "Исповедь, не поддающаяся изменению" #NT!
 nd_cpt_confession_beyond_reversal_desc: "Это государство стало миафизитским, потому что сословие с коптским большинством вынесло этот вопрос в парламент. Та же процедура работает в обратном направлении, и демография с каждым десятилетием облегчает ее. Таким образом, признание выписано из политики: оно больше не может быть отменено законодательным путем, навязано покровителем или получено за столом переговоров, и мы больше не можем отказаться от него." #NT!
 nd_cpt_the_union_declined: "Союз отказался" #NT!
 nd_cpt_the_union_declined_desc: "Коптская делегация прибыла во Флоренцию в 1442 году, и Евгений IV обратился к ним с буллой унии. Константинополь также ухаживал за Александрией. Александрия разговаривала со всеми и ни к кому не присоединялась, именно поэтому маленькая церковь остается церковью." #NT!
  
  # ===== Advances: Age of Absolutism ===== 
 nd_cpt_the_endowment_house: "Дом пожертвований" #NT!
 nd_cpt_the_endowment_house_desc: "Коптские пожертвования оплачивали церкви, школы, похороны и выкуп заключенных, а семья, которая от них зависела, переезжала туда, где ими управляли. Меньшинство, которое не может превзойти своих соседей по породе, все равно может решать, где ему жить." #NT!
 nd_cpt_iltizam_ledgers: "Илтизамские книги" #NT!
 nd_cpt_iltizam_ledgers_desc: "Откупное земледелие передало доходы целых округов в руки людей, которые вели его бухгалтерию. Будет ли это совершенство коптской позиции или ее окончательное разоблачение, полностью зависит от того, в каком десятилетии вы спрашиваете." #NT!
 nd_cpt_endurance_of_the_community: "Устойчивость сообщества" #NT!
 nd_cpt_endurance_of_the_community_desc: "За эти два столетия не зафиксировано ни одной победы, вот в чем дело. Достижение в том, что в конце их все еще есть сообщество." #NT!
 nd_cpt_the_holy_synod: "Священный Синод" #NT!
 nd_cpt_the_holy_synod_desc: "Правительство осуществляется постоянным собором епископов, а не одним патриархом и его домом, что окончательно разрешает споры о престолонаследии, из-за которых трон Святого Марка неоднократно оставлялся вакантным в течение многих лет." #NT!
  
  # ===== Advances: Age of Revolutions ===== 
 nd_cpt_the_cyrillian_schools: "Кириллические школы" #NT!
 nd_cpt_the_cyrillian_schools_desc: "Кирилл IV, патриарх с 1854 по 1861 год, основал первые современные коптские школы, импортировал второй печатный станок для работы в Египте и открыл школу для девочек в Каире. Его помнят как отца реформ, и он умер в сорок пять лет." #NT!
 nd_cpt_the_coptic_press: "Коптская пресса" #NT!
 nd_cpt_the_coptic_press_desc: "Бохайрская литургия напечатана подвижным шрифтом, каноническое право печатается, а не копируется, а скалы тринадцатого века наконец-то достигли большего числа читателей, чем мог бы выдержать любой скрипторий." #NT!
 nd_cpt_a_nation_of_the_nile: "Нация Нила" #NT!
 nd_cpt_a_nation_of_the_nile_desc: "Аргумент о том, что копты не являются меньшинством в Египте, а являются старейшим существом в нем, и что египетская нация, следовательно, принадлежит им, а не является чем-то, что следует терпеть внутри." #NT!
 nd_cpt_census_of_the_faithful: "Перепись верующих" #NT!
 nd_cpt_census_of_the_faithful_desc: "Впервые правильно подсчитать сообщество и узнать, как именно прошли последние пять столетий." #NT!
  
  # ===== Units ===== 
 a_nd_cpt_bashmurite: "Башмурит" #NT!
 a_nd_cpt_bashmurite_desc: "Ополчение Дельта-Марш поднялось по одной истории. Они знают каналы, живут рыбой и птицей и почти бесполезны в открытой пустыне. Поднимаются только за счет набора, потому что это восстание сельской местности, а не полка, который содержит государство." #NT!
 a_nd_cpt_nubian_bowmen: "Нубийские лучники" #NT!
 a_nd_cpt_nubian_bowmen_desc: "Румат аль-Хадак – стрельба по зрачкам. Разрушительная стрельба из лука и готовность отступить, отражают, чья это война, по их мнению. Набирался только на южной границе и в Нубии, куда проходили контингенты Бакта." #NT!
 a_nd_cpt_qasr_warden: "Каср Страж" #NT!
 a_nd_cpt_qasr_warden_desc: "Вооруженных слуг и зависимых жителей деревни великий монастырь мог разместить на своих стенах. Они удерживают позиции и переносят осады. Они никуда быстро не маршируют." #NT!
 a_nd_cpt_paid_corps: "Платный корпус" #NT!
 a_nd_cpt_paid_corps_desc: "Мамлюкская кавалерия содержится в христианской казне, без земельных наделов и конфессиональных обязательств перед своим казначеем. Отличная лошадь и первая формация, которая развалилась в тот момент, когда штат стал выглядеть бедным." #NT!
  
  # ===== Levies ===== 
 levy_nd_cpt_bashmurite: "Башмурит Леви" #NT!
 levy_nd_cpt_bashmurite_desc: "Деревни болот Дельты взывали к власти в связи с восстанием, подавленным пятьсот лет назад. Только крестьяне: класса коптских солдат не существует, и государство не претендует на иное." #NT!
 levy_nd_cpt_qasr_warden: "Каср Страж Леви" #NT!
 levy_nd_cpt_qasr_warden_desc: "Собственные вооруженные иждивенцы монастыря, набранные из домов, находящихся в его штате, а не из сельской местности вокруг него." #NT!
  
  # ===== Buildings ===== 
 nd_cpt_diwan_office: "Диван коптов" #NT!
 nd_cpt_diwan_office_desc: "Налоговое бюро, укомплектованное семьями секретарей, которые управляли египетскими финансами при каждой династии со времен завоевания. Его можно поднять только там, где доминирующей религией является община, потому что коптскому налоговому управлению нужны коптские клерки. Карта вашей финансовой машины — это карта вашего меньшинства." #NT!
 nd_cpt_miqyas: "Дом паводкового датчика" #NT!
 nd_cpt_miqyas_desc: "Нилометр острова Равда, мраморная колонна в затонувшем колодце, каждое лето читает чиновник, чьи показания определяют оценку года. Был один, который имел значение, и он находился в столице." #NT!
 nd_cpt_qasr_tower: "Каср" #NT!
 nd_cpt_qasr_tower_desc: "Крепость пустынного монастыря: каменная башня над колодцем и зернохранилищем, к которой ведет подъемный мост, построенная для того, чтобы община могла пережить осаду, которую у нее не было возможности выиграть. Выращен только на окраинах засушливой пустыни, где стоят огромные дома." #NT!
 nd_cpt_scalae_school: "Школа Лестницы" #NT!
 nd_cpt_scalae_school_desc: "Учебный дом по бохайрской грамматике и каноническому праву, кодифицированный ас-Сафи ибн аль-Ассалем, названный в честь Scala Magna Ибн Кабара. Оно следует сообществу, а не карте, потому что священники, которые учили его, были священниками, которые его использовали." #NT!
 nd_cpt_baqt_house: "Дом Бакта" #NT!
 nd_cpt_baqt_house_desc: "Пограничный обмен в Асуане и Кусе, где договор 652 года был отменен: зерно и ткань шли вверх по реке, слоновая кость и золото шли вниз, а при христианском Египте ни в одном направлении не было рабов." #NT!
 nd_cpt_bashmur_redoubt: "Башмурский редут" #NT!
 nd_cpt_bashmur_redoubt_desc: "Прорубили каналы, пробили тростниковые заросли и подняли берег. Доктрина, которая стоила аль-Мамуну личной экспедиции в 831 году, восстановлена ​​государством, которому нужно, чтобы она стала верной во второй раз. Только водно-болотные угодья Дельты имеют для этого почву." #NT!
 nd_cpt_deir_estate: "Дейр Эстейт" #NT!
 nd_cpt_deir_estate_desc: "Монастырь как экономика, а не дом молитвы: зерновая мельница, пресс для оливок, пальмовые сады, цистерны и окруженная стеной деревня арендаторов. Его можно расположить только вокруг уже существующего монастыря." #NT!
 nd_cpt_archon_house: "Дом Архонта" #NT!
 nd_cpt_archon_house_desc: "Домохозяйство коптского финансиста, который обрабатывает доходы округа, откладывает деньги правительству под счет поступлений в следующем году и жертвует церкви из прибыли. Он расположен в центре рынка, потому что именно там движутся деньги." #NT!
 nd_cpt_endowment_house: "Дом пожертвований" #NT!
 nd_cpt_endowment_house_desc: "Офис, который управляет пожертвованиями сообщества: церквями, школами, похоронами и выкупом заключенных. Семьи, которые от него зависят, переезжают туда, где им управляют, таким образом, это привлекает сообщество внутрь городов, контролируемых государством." #NT!
 nd_cpt_cyrillian_school: "Кириллийская школа" #NT!
 nd_cpt_cyrillian_school_desc: "Современная школа по образцу Кирилла IV, заложенному в 1850-х годах: печатные книги вместо переписных, арифметика и языки рядом с литургией, классы для девочек. Основан на старых учебных домах церкви, а не основан на новых." #NT!
  
  # ===== Production methods ===== 
 nd_cpt_diwan_maintenance: "Регистры доходов" #NT!
 nd_cpt_diwan_maintenance_desc: "Бумага, чернила и переплетенные журналы оценок и сборов хранятся в руках, которым обучали в одних и тех же семьях на протяжении шести столетий." #NT!
 nd_cpt_diwan_iltizam_ledgers: "Илтизам Леджерс" #NT!
 nd_cpt_diwan_iltizam_ledgers_desc: "Более тяжелая бухгалтерия откупного земледелия: авансы, задолженность и текущий счет между доходами округа и домохозяйством, которое их купило." #NT!
 nd_cpt_miqyas_maintenance: "Летнее чтение" #NT!
 nd_cpt_miqyas_maintenance_desc: "Сохраняя колодец чистым, столбец верным и рекорд непобитым, чтобы оценку этого года можно было сравнить с прошлогодней отметкой." #NT!
 nd_cpt_qasr_maintenance: "Башня и Склад" #NT!
 nd_cpt_qasr_maintenance_desc: "Каменная кладка, заполненный зернохранилище и ухоженная сладость, потому что смысл крепости — в том, как долго ее можно будет закрыть." #NT!
 nd_cpt_scalae_maintenance: "Грамматика и канон" #NT!
 nd_cpt_scalae_maintenance_desc: "Скопированные лестницы, словари и сборники канонов, а также свечи для их чтения." #NT!
 nd_cpt_scalae_press: "Бохайрская пресса" #NT!
 nd_cpt_scalae_press_desc: "Шрифт, формы и чернила принтера. Литургия началась один раз и пробила тысячу раз, чего никогда не удавалось ни одному скрипторию." #NT!
 nd_cpt_baqt_maintenance: "Пограничный подсчет" #NT!
 nd_cpt_baqt_maintenance_desc: "Зерно, ткань и скот учитываются в счет того, что поступает вниз по реке, под присмотром обеих групп клерков." #NT!
 nd_cpt_bashmur_maintenance: "Рид и Стейк" #NT!
 nd_cpt_bashmur_maintenance_desc: "Нарубить лес, поставить грядки, сушеную рыбу для склада и достаточно железа, чтобы вооружить деревню, которая держит берег." #NT!
 nd_cpt_deir_maintenance: "Мельница, Пресса и Сад" #NT!
 nd_cpt_deir_maintenance_desc: "Содержание автономного дома: зерновая мельница, пресс для оливок, цистерны и пальмовые сады за стеной." #NT!
 nd_cpt_archon_maintenance: "Счетная палата" #NT!
 nd_cpt_archon_maintenance_desc: "Бухгалтерские книги, корреспонденция и достойная обстановка, которую семья хранит, когда хочет, чтобы правительство почувствовало, что оно обращается к учреждению." #NT!
 nd_cpt_endowment_maintenance: "Благотворительный счет" #NT!
 nd_cpt_endowment_maintenance_desc: "Хлеб, ткань, масло и свечи, выданные в счет пожертвования, вместе с реестром, в котором точно записано, кто их получил." #NT!
 nd_cpt_cyrillian_maintenance: "Книги и сланцы" #NT!
 nd_cpt_cyrillian_maintenance_desc: "Печатные тексты, лампы, чернила и стекла для окон покупались, а не копировались, а это вся реформа в одной строке." #NT!
  
  # ===== DESTINY: advances ===== 
 nd_cpt_destiny: "Больше не защищенный народ" #NT!
 nd_cpt_destiny_desc: "Дхимма представляла собой договор: защита и общинная автономия в обмен на подушный налог и список инвалидов. Христианский Египет не может быть его участником ни в том, ни в другом направлении, поэтому реестр защищенных лиц закрывается, и каждый житель страны становится просто субъектом, а в этом состоянии никто здесь не находился уже семьсот лет. Приют общины исчез вместе со всеми его унижениями. Осталось решить, как провести следующие два столетия." #NT!
 nd_cpt_dest_qadis_kept: "Кади сохраняют свои суды" #NT!
 nd_cpt_dest_qadis_kept_desc: "Утвердите четырех главных судей Каира, по одному от каждой юридической школы, и оставьте брак, наследство и пожертвования там, где они есть. В пятничной проповеди не может быть названо имя этого государя, поэтому упоминается халиф Аббасидов, который жил в городе в качестве пенсионера с 1261 года. Требуется оседлое царство, тысяча в казне, банковское дело и торговля перцем на нашем рынке." #NT!
 nd_cpt_dest_pepper_crossing: "Перекресток перца" #NT!
 nd_cpt_dest_pepper_crossing_desc: "Айдхаб – это место, где карими высаживают перец из Адена и паломники переправляются в Джидду. Карими — мусульманские финансисты, занимающиеся пряностями, чей капитал делает казну похожей на провинциальную, и они постоянно дают ей кредиты. Каир, который не проверяет ничью веру, — единственный Каир, который они будут продолжать использовать. Переправьтесь и завладейте королевством, достаточно богатым, чтобы в него стоило переходить." #NT!
 nd_cpt_dest_indispensable: "Незаменимый" #NT!
 nd_cpt_dest_indispensable_desc: "Суакин переходит на переправу, когда Айдхаб закончен, и к тому времени спор окончен: ничто в Египте не движется без людей, которые ведут его счета, и ничто в океанской торговле не движется без Египта. Требуется южный переход, три тысячи в казне, высокое положение и мировая торговля эпохи. Открывает Бюро пожертвований." #NT!
 nd_cpt_dest_scrolls_of_timotheos: "Свитки Тимофея" #NT!
 nd_cpt_dest_scrolls_of_timotheos_desc: "В 1372 году патриарх рукоположил в Каире епископа по имени Тимофей для Фараса и Касра Ибрима. Он отправился на юг, умер там и был похоронен в склепе Ибрима, а рядом с ним лежали грамоты о посвящении. Их нашли шесть столетий спустя, и он — последний епископ Нубии, которого можно назвать. Возьмите обе кафедры с тридцатью полками и тихим королевством и прекратите посвящать людей на землю, которую церковь не может удержать." #NT!
 nd_cpt_dest_throne_hall_dongola: "Тронный зал в Донголе" #NT!
 nd_cpt_dest_throne_hall_dongola_desc: "В 1317 году тронный зал царей Мукурии был переоборудован в мечеть, а текст фундамента был высечен на камне с датой. Макурия не закончила тот год, но и не восстановилась. Возьмите Донголу и Керму с пятьюдесятью полками, приняв конфессиональную эпоху и достаточно развитое королевство, чтобы удержать реку позади вас." #NT!
 nd_cpt_dest_all_africa: "Патриарх всей Африки" #NT!
 nd_cpt_dest_all_africa_desc: "Титул не является выдумкой: Папа Александрийский и Патриарх всей Африки на Святом Престоле Святого Марка. Пентаполис Киренаики был собственной провинцией Александрии до Халкидона, а Соба был резиденцией Алвы на Голубом Ниле. Удерживайте и то, и другое, с семьюдесятью пятью полками и соответствующим статусом, и юрисдикция перестанет быть подписью и станет страной. Открывает митрополию." #NT!
  
  # ===== DESTINY: events ===== 
 nd_cpt.9.t: "Реестр закрыт" #NT!
 nd_cpt.9.d: "Клерки, которые вели реестр покровительствуемых лиц, потратили неделю на то, чтобы выяснить, что теперь они являются правительством и что регистрировать больше нечего.\n\nДхимма — это контракт, и его стороной должен быть мусульманский суверен. Больше нет ни одного. Списки подушного налога недействительны, синие тюрбаны недействительны, запрет на езду на лошадях недействителен, а церковь, которую терпели, является церковью короны. Ничто из этого не делает коптов многочисленными. Это делает пятую часть страны ответственной за все это, а остальные четыре пятых теперь просто подданные, и это статус, в который Египет никого не помещал со времени завоевания.\n\nИ дверь распахивается в обе стороны. Это состояние было создано движением, переносимым в камере, а камера может снова перенести то же движение обратно; каждое десятилетие преобразований облегчает эту арифметику для тех, кто хочет попробовать. Впереди не будет года, в котором будет сложнее.\n\nПоэтому единственный вопрос, который стоит задать, — это что делать со временем." #NT!
 nd_cpt.9.a: "Тогда давайте будем государством, а не сообществом" #NT!
  
 nd_cpt.10.t: "Скамейка и проповедь" #NT!
 nd_cpt.10.d: "Два решения принимаются на одной неделе и имеют один и тот же ответ.\n\nПервое — это скамейка запасных. В Каире есть четыре главных судьи, по одному на каждую юридическую школу, заседающие в этом порядке с тех пор, как Бейбарс установил его в 1265 году, и между ними рассматриваются все мусульманские браки, наследства и пожертвования в Египте. Христианское правительство могло бы воспользоваться этой юрисдикцией для своих судов. Вместо этого этот повторно назначает всех четверых поименно в обычной церемонии, и меняется лишь то, чья печать стоит на ордере.\n\nВторая — пятничная проповедь, в которой упоминается имя государя, и не может быть названо этого. Халиф Аббасидов жил в Каире в качестве пенсионера с 1261 года, не имея никаких полномочий, кроме его собственного достоинства, и в проповеди будет названо его имя. Никто в мечети не поймет, что это значит. Никого не просят притворяться." #NT!
 nd_cpt.10.a: "Утвердите четырех судей и оставьте проповедь в покое" #NT!
  
 nd_cpt.11.t: "Карими в Айдабе" #NT!
 nd_cpt.11.d: "Переправа наша, а значит и цена на перец наша. Он поднимается из Адена на дне Карими, переносится по суше от Красного моря до Куса, спускается по реке в Каир и выходит через Александрию в венецианские и генуэзские корпуса, и каждый его этап финансируется примерно пятьюдесятью мусульманскими семьями, чей кредит лучше, чем у казначейства.\n\nКорона может взять на себя эту прибыль. Это было сделано: объявить товары перцовой короны, покупать по цене короны, продавать по цене короны и позволить великим домам работать агентами или не работать вообще. Доход поступает сразу, и он очень велик.\n\nЭто также учит каждого купца на океане, что цена египетского маршрута устанавливается указом, а цены на маршруты через Ормуз и Басру — нет." #NT!
 nd_cpt.11.a: "Декларировать товары «перцовая корона»" #NT!
 nd_cpt.11.b: "Возьмите на себя ответственность и оставьте торговлю им" #NT!
  
 nd_cpt.12.t: "Бюро пожертвований" #NT!
 nd_cpt.12.d: "Вакф Египта огромен. Мечети, медресе, больницы, питьевые фонтанчики, хлеб для бедных и заработная плата каждого проповедника в стране выплачиваются из земли и магазинов, закрепленных навечно, и в офисе, который контролирует все это, есть коптские служащие с тех пор, как оно существует.\n\nЭтот офис теперь подчиняется христианской короне, и нигде нет прецедента того, что ему следует делать дальше. Пожертвования нельзя просто забрать. Государство, захватившее земли мечетей, сделало бы именно то, чего оно обещало не делать, и сделало бы это с четырьмя пятыми своих подданных.\n\nТак что остаётся лишь вопрос рук. Надзиратели, владеющие этими фондами, в большинстве своем являются знатными людьми, и их отчеты, мягко говоря, приблизительны." #NT!
 nd_cpt.12.a: "Оставьте это своим контролерам и проверяйте ежегодно." #NT!
 nd_cpt.12.b: "Вынеси это из дивана, как и все остальное." #NT!
  
 nd_cpt.13.t: "Епископ похоронен в Ибриме" #NT!
 nd_cpt.13.d: "Освящение записывается, как и погребение. Тимофей был назначен епископом Фараса и Каср-Ибрима в Каире в 1372 году и отправился на юг, на территорию, которая сокращалась в течение ста лет. Он умер там и был похоронен в склепе, рядом с ним лежали грамоты о посвящении, одно на коптском языке, другое на арабском, и они все еще были читаемы, когда склеп был открыт шесть столетий спустя.\n\nОн последний епископ Нубии, которого можно назвать. То, что предстает перед ним, является образцом всей эпохи: Александрия продолжала наполнять кафедры настоящими людьми и запечатанными документами в стране, у которой не было средств для защиты, и одна за другой кафедры перестали отвечать.\n\nКорона предлагает освятить следующую и послать с ней солдат вверх по реке." #NT!
 nd_cpt.13.a: "Освятите следующего и отправьте с ним солдат" #NT!
  
 nd_cpt.14.t: "Надпись 1317 г." #NT!
 nd_cpt.14.d: "Тронный зал в Донголе представлял собой двухэтажный кирпичный зал с куполообразным залом, где цари Мукурии принимали посольства, а в 1317 году его смыли, переоборудовали и превратили в мечеть. Фундаментальный текст был высечен в камне и врезан в стену. Оно датировано и все еще там.\n\nЦарство королевства не закончилось в этом году. Оно продолжалось фрагментами еще столетие: короли назначались из Каира, а короли отказывались это делать, и закончилось, и никто не удосужился указать, когда. В 1317 году закончилась идея о том, что зал принадлежал христианскому королю.\n\nЗал снова стал нашим. Это не только религиозное решение: есть нубийцы, которые предпочли бы иметь собственного короля, чем губернатора, присланного из Египта, и в Донголе есть община мечети, которой не существовало три поколения назад." #NT!
 nd_cpt.14.a: "Снимите надпись и поставьте алтарь обратно." #NT!
 nd_cpt.14.b: "Выйдите из мечети и коронуйте короля, которого мы выберем." #NT!
  
 nd_cpt.15.t: "Патриарх всей Африки" #NT!
 nd_cpt.15.d: "Этому титулу уже тысяча лет, и для большинства из них он означал знак вежливости. Папа Александрийский и Патриарх всей Африки на Святом Престоле Святого Марка, юрисдикция которого простирается от Пентаполя Киренаики до водопадов и мимо них до слияния в Собе, и почти нет средств добраться до любого из них.\n\nСейчас это не вежливость. Барса удерживается, Соба удерживается, кафедры заполнены людьми, которые приходят живыми, а церковь является крупнейшей церковью в Африке, отвечающей одному стулу.\n\nЭто поднимает вопрос, на который в конечном итоге приходится отвечать каждой церкви такого размера, обычно плохо. Митрополит, находящийся за тысячу миль вверх по реке, не может ждать решения Каира, да и не всегда захочет." #NT!
 nd_cpt.15.a: "Один престол и каждый епископ, назначаемый с него" #NT!
 nd_cpt.15.b: "Каждый видит своего митрополита и свой язык" #NT!
  
  # ===== DESTINY: timed modifiers ===== 
 STATIC_MODIFIER_NAME_nd_cpt_dest_pepper_monopoly: "Перец объявлен королевским товаром" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_pepper_monopoly: "Корона покупает груз по своей цене и продает его по своей цене, а великие дома либо работают ее агентами, либо не работают вообще. Доход является немедленным и огромным, и он хранится на складах, а не в руках рекрутеров-сержантов." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_karimi_toll: "Плата и ничего более" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_karimi_toll: "Переправа облагается налогом по ставке, с которой торговцы могут жить, и торговля остается на усмотрение людей, которые ее понимают. Их кредит становится самым дешевым, который когда-либо видел казначейство, и маршрут не движется на восток." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_their_own_overseers: "Их собственные надзиратели" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_their_own_overseers: "Пожертвования остаются в руках владельцев, и диван проверяет отчеты раз в год без комментариев. В сельской местности тихо, города управляемы, население растет, а это неоднозначное благо, и каждый знает чье." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_diwan_keeps_the_books: "Диван хранит книги" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_diwan_keeps_the_books: "Фонды управляются из налоговой службы, как и любой другой счет в стране. Цифры, наконец, точны, и средства на строительство действительно доходят до зданий. С домохозяйствами, в которых раньше хранились бумаги, не проводились консультации." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_hall_reconsecrated: "Зал заново освящен" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_hall_reconsecrated: "Надпись выходит из стены, зал моется и на месте престола ставится алтарь. Каждый каменщик между водопадами сейчас восстанавливает церкви, и так будет еще одно поколение." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_king_of_our_choosing: "Король по нашему выбору" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_king_of_our_choosing: "Мечеть стоит, а перед ней восседает нубийский король, держа свой трон из Каира, именно так Египет поступал с Донголой на протяжении восьмидесяти лет. Это ничего не стоит для каменной кладки и многого для наблюдения." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_held_from_alexandria: "Удержано из Александрии" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_held_from_alexandria: "Один престол, один обряд, один календарь, и каждый епископ от Барки до слияния назначается из одной канцелярии. Сельская местность удерживается крепче, чем когда-либо, а дом патриарха находится в правительстве." #NT!
 STATIC_MODIFIER_NAME_nd_cpt_dest_every_see_its_own: "Каждый видит свое" #NT!
 STATIC_MODIFIER_DESC_nd_cpt_dest_every_see_its_own: "Каждая кафедра имеет своего митрополита, свою литургию и свой язык и отвечает Александрии в учении и ни в чем другом. Провинции набирают собственных людей, самостоятельно устраняют ущерб и перестают чувствовать себя оккупированными." #NT!
  
  # ===== DESTINY: buildings ===== 
 nd_cpt_diwan_al_ahbas: "Бюро пожертвований" #NT!
 nd_cpt_diwan_al_ahbas_desc: "Офис, контролирующий благочестивые фонды большинства: землю мечетей, арендную плату за медресе, фонтаны, больницы и заработную плату проповедников, находится в ведении тех же клерков, которые проверяют все остальное в стране. Пока это так, в этом городе никто не предпринимает никаких усилий по преобразованию, и это именно то, что было заключено." #NT!
 nd_cpt_metropolitan_see: "Митрополит Престол" #NT!
 nd_cpt_metropolitan_see_desc: "Кафедра епископа с собором, хозяйством и освященной территорией, восстановленная в провинциях, на которые претендовал престол святого Марка еще до Халкидона. Коптские семьи селятся там, где находится кафедра. Все, кто там уже живет, имеют право заметить, что их никто не спрашивал первым." #NT!
  
  # ===== DESTINY: production methods ===== 
 nd_cpt_ahbas_maintenance: "Реестры вакфа" #NT!
 nd_cpt_ahbas_maintenance_desc: "Акты пожертвований, списки арендной платы и годовой отчет каждого фонда в округе, скопированные для честного копирования и хранящиеся там, где обе стороны могут с ними ознакомиться." #NT!
 nd_cpt_see_maintenance: "Миро и свечи" #NT!
 nd_cpt_see_maintenance_desc: "Ладан, воск, одежду и вино литургии переносятся вверх по реке, потому что ничего из этого не делается рядом с креслом, которое в нем нуждается." #NT!
  
  # ===== BUREAUCRACIES ===== 
 cpt_altar_lot_bureaucracy: "Алтарь" #NT!
 cpt_altar_lot_bureaucracy_desc: "Папа Александрийский избирается из числа монахов, а не из епископов, поскольку епископ обручен своей кафедре и не может быть смещен с нее. Когда Михаил IV умер в 1102 году, епископы и священники отправились в пустыню Скетиды, несколько дней сидели со старейшинами пустыни и вышли с Макарием II. Если собрание не могло прийти к согласию, фамилии отправлялись к алтарю, и ребенок с завязанными глазами рисовал одно из них. С 640 года утверждение правителя стало формальностью, и коптская корона наследует это ограничение вместе с церковью: это преемственность, которую ни один государь не организует заранее." #NT!
 cpt_kharaji_year_bureaucracy: "Год Хараджи" #NT!
 cpt_kharaji_year_bureaucracy_desc: "Налоговый год Египта ведется по коптскому солнечному календарю, а не по лунному, поскольку оценка следует за наводнением, а наводнение не следует за луной. Каждый режим со времени завоевания сохранял коптские месяцы для хараджа только по этой причине, и Египет все еще считал по ним налоги в 1875 году. Колонна на острове Равда, перестроенном в 861 году, читается каждое лето; на высоте шестнадцати локтей канал прорезается, и год открывается при хорошей оценке, а на короткое наводнение отвечают ремиссией, записанной в списке, а не сбором, налагаемым на урожай, который так и не взошёл." #NT!
 cpt_zimam_ledgers_bureaucracy: "Письма Зимама" #NT!
 cpt_zimam_ledgers_bureaucracy_desc: "В десятом веке бухгалтеры Египта сократили коптские унциалы до быстрого криволинейного набора цифр, хуруф аз-зимам, или букв регистров, и в течение следующих девятисот лет хранились сметы, ведомости арендной платы и аудиты. Этому учили в семьях секретарей, а не в школах. Это механизм, который всего лишь содержит коптский Диван: служащих увольняли из фискальных бюро по крайней мере девять раз между 1280 и 1450 годами и каждый раз отзывали, потому что книги предыдущей администрации были нечитаемы для тех, кто не был в руках." #NT!
 cpt_arakhina_purse_bureaucracy: "Кошелек Арахины" #NT!
 cpt_arakhina_purse_bureaucracy_desc: "Арахины были коптскими знатными мирянами, которые занимались сельским хозяйством, банковскими чиновниками и гарантировали всех, кто был ниже них, покрывая дефицит подушевого дохода общины, выкупая заключенных и оплачивая церкви со своих собственных счетов. Причина имела значение: налогообложение было главным двигателем обращения в средневековом Египте, поэтому дом, который платил налог более бедной семье, покупал дальнейшее существование этой семьи в качестве коптов. К семнадцатому веку эти дома имели больший практический вес в коптских делах, чем патриарх, и споры о том, кто из мирян или епископы должны распоряжаться пожертвованиями, продолжались до тех пор, пока общинный совет не урегулировал этот вопрос в 1874 году." #NT!
  
  # The auto-modifier governing the bureaucracy slot grant on formation 
 AUTO_MODIFIER_NAME_nd_cpt_bureaucracy_authority: "Офисы сообщества" #NT!
 AUTO_MODIFIER_DESC_nd_cpt_bureaucracy_authority: "При формировании [CPT.GetName] может стать местом размещения институтов, которыми коптская община управляла сама, пока ею управляли другие: выборы в пустыне, оценка наводнения, бухгалтерская книга и кошелек знати. Потенциал намеренно узок, поскольку режим меньшинства не может укомплектовать каждый аппарат одновременно." #NT!
