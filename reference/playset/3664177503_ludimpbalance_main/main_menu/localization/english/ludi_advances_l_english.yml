 ludi_slave_raider_holdouts: "Slave Raider Holdouts"
 ludi_slave_raider_holdouts_desc: "Coastal strongholds sustain the ships and crews needed to support the slave-raiding trade."
 ludi_slave_raider_holdouts_building: "Slave Raider Holdouts"
 ludi_slave_raider_holdouts_building_desc: "A fortified coastal base supporting raiders and providing a steady flow of sailors."
 ludi_bohemian_muskets: "Bohemian Muskets"
 ludi_bohemian_muskets_desc: "Bohemian infantry formations make disciplined use of firearms, improving the battlefield power of light infantry."
