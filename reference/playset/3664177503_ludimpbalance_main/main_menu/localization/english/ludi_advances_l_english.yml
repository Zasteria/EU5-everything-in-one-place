 ludi_quality_quantity_law_advance: "Standing Armies"
 ludi_quality_quantity_law_advance_desc: "Research into military organization unlocks a law allowing the state to favor larger forces or better-trained forces."
 ludi_romanian_light_cavalry: "Moldovan Horsemen"
