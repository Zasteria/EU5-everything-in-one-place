l_english:
 famine: "The Great Asian Famine"
 famine_desc: "The Great Asian Famine ravages India and China from 1338 to 1342, collapsing local food production and slowing population growth across the affected regions."
 ludi_great_asian_famine_active_years_tt: "The Great Asian Famine is active from #Y 1338#! to #Y 1342#!."
 ludi_great_asian_famine_years_header: "Active Years"
 ludi_great_asian_famine_years_value: "1338-1342"
 ludi_great_asian_famine_deaths_header: "Deaths Recorded"
 ludi_great_asian_famine_deaths_tt: "Total population lost in the affected areas of India and China since the Great Asian Famine began, shown as full population rather than internal population units."
 ludi_great_asian_famine_overview_header: "Active: 1338-1342"
 ludi_great_asian_famine_panel_overview: "The Great Asian Famine affects India and China from 1338 to 1342. Affected locations suffer -400% local food production and -7% population growth. Use the actions below to relieve a targeted province or force higher national goods production for the duration of the famine."
 famine_affected_location_tt: "This location is affected by the Great Asian Famine."
 ludi_famine_relieve_province: "Emergency Grain Relief"
 ludi_famine_relieve_province_desc: "Spend 200 ducats to shield a targeted famine-affected province from the effects of the Great Asian Famine."
 ludi_famine_choose_relief_province: "Choose Famine Relief Province"
 ludi_famine_no_relief_provinces: "No famine-affected provinces are available for relief."
 ludi_famine_relieve_province_effect_tt: "Spend #Y 200#! ducats. Owned famine-affected locations in the targeted province gain #Y Emergency Grain Relief#! until the Great Asian Famine ends, giving #P +400.00%#! Local Monthly Food and #P +7.00%#! Local Population Growth."
 ludi_famine_goods_drive: "Forced Rural Production"
 ludi_famine_goods_drive_desc: "Increase national goods production by 50% for the duration of the Great Asian Famine, at the cost of monthly expenses equal to 20% of current total income."
 ludi_famine_goods_drive_effect_tt: "Gain #Y Forced Rural Production#! until the Great Asian Famine ends, giving #P +50.00%#! Raw Materials Output. Also gain #Y Forced Rural Production Costs#! until the Great Asian Famine ends, adding a monthly gold expense equal to #N 20.00%#! of current total income."
 STATIC_MODIFIER_NAME_ludi_famine_modifier: "Great Asian Famine"
 STATIC_MODIFIER_DESC_ludi_famine_modifier: "Food production has collapsed and population growth has slowed under a devastating regional famine."
 STATIC_MODIFIER_NAME_ludi_famine_relief_modifier: "Emergency Grain Relief"
 STATIC_MODIFIER_DESC_ludi_famine_relief_modifier: "Emergency stores and rationing offset the local effects of the Great Asian Famine."
 STATIC_MODIFIER_NAME_ludi_famine_goods_drive_modifier: "Forced Rural Production"
 STATIC_MODIFIER_DESC_ludi_famine_goods_drive_modifier: "The countryside is being pushed to produce more raw goods during the Great Asian Famine."
 STATIC_MODIFIER_NAME_ludi_famine_goods_drive_cost_modifier: "Forced Rural Production Costs"
 STATIC_MODIFIER_DESC_ludi_famine_goods_drive_cost_modifier: "Maintaining emergency production quotas consumes a portion of national income."

