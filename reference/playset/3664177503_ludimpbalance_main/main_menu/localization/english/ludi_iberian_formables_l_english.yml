l_english:
 ARA_f: "$ARA$"
 ARA_f_desc: "The realms of Aragon, Catalonia, and Valencia have long been bound together by shared institutions, commerce, and the authority of the Crown. By securing these historic territories, we can restore the Crown of Aragon as a united Mediterranean power."
 CAS_f: "$CAS$"
 CAS_f_desc: "The kingdoms of the Castilian Crown have been divided by rival claimants and regional powers. By bringing the historic lands of Castile back under one sovereign, we can restore the kingdom and reclaim its place among the great powers of Iberia."
