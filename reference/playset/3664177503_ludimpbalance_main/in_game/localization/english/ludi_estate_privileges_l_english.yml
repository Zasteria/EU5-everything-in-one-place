l_english:
 religious_tolerance_privilege:0 "Religious Tolerance"
 religious_tolerance_privilege_desc:0 "Peace within the realm requires that Christians of differing confessions, and even those who follow other faiths, be permitted to worship without persecution. By restraining the dominance of the established church, we can foster a more tolerant and humanist society."
 Ludi_peasants_quality:0 "Peasant Rights"
 Ludi_peasants_quality_desc:0 "By granting the peasantry greater freedoms and protections, we recognize their rights and allow them a larger voice in the life of the realm."
 ludi_quality_quantity_law:0 "Standing Armies"
 ludi_quality_quantity_law_desc:0 "This law determines whether military policy favors larger forces or better-trained forces."
 ludi_quantity_policy:0 "Quantity Focus"
 ludi_quantity_policy_desc:0 "Prioritize the size of our forces and the ability to field more soldiers."
 ludi_quality_policy:0 "Quality Focus"
 ludi_quality_policy_desc:0 "Prioritize the training and quality of our forces over their numbers."
