 ludi_mountain_mine_expansion_discovery_desc:0 "Improves mountain mining, allowing each Mountain Mine to support one additional level."
 ludi_mountain_mine_expansion_reformation:0 "Deep Mountain Shafts"
 ludi_mountain_mine_expansion_reformation_desc:0 "Improves mountain mining, allowing each Mountain Mine to support one additional level."
 ludi_mountain_mine_expansion_absolutism:0 "Regulated Mountain Mines"
 ludi_mountain_mine_expansion_absolutism_desc:0 "Improves mountain mining, allowing each Mountain Mine to support one additional level."
 ludi_mountain_mine_expansion_revolutions:0 "Industrial Mountain Mining"
 ludi_mountain_mine_expansion_revolutions_desc:0 "Improves mountain mining, allowing each Mountain Mine to support one additional level."
 ludi_european_free_folk:0 "Free European Folk"
 ludi_european_free_folk_desc:0 "Free European holders of land, rooted in communities of owning peasants, are happy to defend the fields that sustain them. In the Middle Ages, Europe's free folk built resilient communities, productive farms, and institutions that made our civilization the best in the world."
 ludi_arabic_golden_age:0 "Arabic Golden Age"
 ludi_arabic_golden_age_desc:0 "Free peasants sustain prosperous communities across the Arabic world, supporting learning, commerce, and the public revenue. Their flourishing society strengthens the peasantry, improves taxation, and turns the realm toward mysticism."
 dop_law_brandenburg_estate_settlement:0 "Brandenburg Estate Settlement"
 dop_law_brandenburg_estate_settlement_desc:0 "Having survived the Turmoil in Brandenburg, the crown has renegotiated estate obligations into a more reliable fiscal settlement, allowing the state to draw more revenue from every estate."
 STATIC_MODIFIER_NAME_ludi_pra_estate_settlement:0 "Prussian Estate Settlement"
 STATIC_MODIFIER_DESC_ludi_pra_estate_settlement:0 "Having survived the Turmoil in Prussia, the crown has renegotiated estate obligations into a more reliable fiscal settlement."
 arctic_settlement:0 "Arctic Settlement"
 arctic_settlement_desc:0 "A literal settlement of arctic bear people."
 AUTO_MODIFIER_NAME_very_high_legitimacy:0 "Very High [legitimacy|e]"
 religious_tolerance_privilege:0 "Religious Tolerance"
 religious_tolerance_privilege_desc:0 "Peace within the realm requires that Christians of differing confessions, and even those who follow other faiths, be permitted to worship without persecution. By restraining the dominance of the established church, we can foster a more tolerant and humanist society."
 ludi_french_armored_knights:0 "French Armored Knights"
 ludi_french_armored_knights_desc:0 "In answer to the English longbow and disciplined defensive lines, French commanders place renewed emphasis on heavily armored knights. Concentrated charges and improved battlefield coordination allow these formations to break enemy positions and reclaim the initiative."
 ludi_the_fighting_rus:0 "The Fighting Rus"
 ludi_the_fighting_rus_desc:0 "From the forests and riverlands of Rus emerge hardened infantry traditions shaped by bitter winters, frontier warfare, and generations of struggle. Fighting in close order with discipline and determination, these foot soldiers form a steadfast core around which the armies of the Rus can rally."
 NGF_f:0 "North German Federation"
 NGF_f_desc:0 "The northern German lands have long been divided among rival princes and cities. By uniting them under a federal government, we can create a powerful state capable of defending and advancing the interests of North Germany."
 SGF_f:0 "South German Federation"
 SGF_f_desc:0 "The southern German lands share deep cultural and economic ties despite their political division. A federation centered on the Danube and southern Germany would unite these states into a prosperous and influential power."
 NGF:0 "North German Federation"
 NGF_ADJ:0 "North German"
 SGF:0 "South German Federation"
 SGF_ADJ:0 "South German"
 ludi_ngf_unified_line:0 "Unified German Line"
 ludi_ngf_unified_line_desc:0 "The federation standardizes recruitment and battlefield doctrine across the northern German lands, strengthening its heavy infantry."
 ludi_ngf_federal_staff:0 "Federal General Staff"
 ludi_ngf_federal_staff_desc:0 "A common military staff coordinates the armies of the federation with exceptional discipline."
 ludi_sgf_alpine_granaries:0 "Southern German Granaries"
 ludi_sgf_alpine_granaries_desc:0 "The fertile southern lands are integrated into a common system of storage and provisioning, supporting lasting prosperity."
 ludi_sgf_diplomatic_union:0 "Federal Diplomacy"
 ludi_sgf_diplomatic_union_desc:0 "The southern federation speaks with one voice abroad, giving its diplomats greater influence."
 ludi_ruthenian_reunification:0 "Ruthenian Reunification"
 ludi_ruthenian_reunification_desc:0 "The lands of Ruthenia are brought together under a common administration, restoring prosperity and stability to the realm."
 ludi_ruthenian_dnieper_host:0 "The Dnieper Host"
 ludi_ruthenian_dnieper_host_desc:0 "The frontier traditions of the Dnieper are organized into a dependable system of levies, strengthening the realm without creating an oversized permanent army."
