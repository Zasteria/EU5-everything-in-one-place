l_english:
 ludi_farming_communities:0 "Farming Communities"
 ludi_farming_communities_desc:0 "A true reason for keeping this location rural buddy boy"
 ludi_hill_iron_mine:0 "Hill Iron Mine"
 ludi_hill_iron_mine_desc:0 "A compact iron mine that exploits accessible ore deposits in hilly terrain."
 ludi_hill_iron_mine_maintenance:0 "Hill Iron Extraction"
 ludi_hill_iron_mine_maintenance_desc:0 "Laborers use tools to extract iron from shallow seams running through the hills."
 ludi_hill_mine_advance:0 "Hill Mine"
 ludi_hill_mine_advance_desc:0 "Improved surveying and excavation techniques make small iron deposits in hilly terrain commercially viable."
 ludi_mountain_copper_mine:0 "Mountain Mine"
 ludi_mountain_copper_mine_desc:0 "A dedicated mountain mine that extracts an additional local supply of copper."
 ludi_mountain_copper_mine_maintenance:0 "Mountain Copper Extraction"
 ludi_mountain_copper_mine_maintenance_desc:0 "Laborers work difficult mountain seams to produce copper for the local market."
 ludi_mountain_copper_mine_max_level:0 "Mountain Mine Maximum Level"
 ludi_mountain_mine_expansion_traditions:0 "Mountain Mine Expansion"
 ludi_mountain_mine_expansion_traditions_desc:0 "Improves mountain mining, allowing each Mountain Mine to support one additional level."
