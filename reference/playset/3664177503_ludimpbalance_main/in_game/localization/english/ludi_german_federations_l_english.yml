l_english:
 NGF_f:0 "North German Federation"
 NGF_f_desc:0 "The northern German lands have long been divided among rival princes and cities. By uniting them under a federal government, we can create a powerful state capable of defending and advancing the interests of North Germany."
 SGF_f:0 "South German Federation"
 SGF_f_desc:0 "The southern German lands share deep cultural and economic ties despite their political division. A federation centered on the Danube and southern Germany would unite these states into a prosperous and influential power."
 NGF:0 "North German Federation"
 NGF_ADJ:0 "North German"
 SGF:0 "South German Federation"
 SGF_ADJ:0 "South German"
 ludi_ngf_unified_line:0 "Unified German Line"
 ludi_ngf_unified_line_desc:0 "The federation standardizes recruitment and battlefield doctrine across the northern German lands, strengthening its heavy infantry."
 ludi_ngf_federal_staff:0 "Federal General Staff"
 ludi_ngf_federal_staff_desc:0 "A common military staff coordinates the armies of the federation with exceptional discipline."
 ludi_sgf_alpine_granaries:0 "Southern German Granaries"
 ludi_sgf_alpine_granaries_desc:0 "The fertile southern lands are integrated into a common system of storage and provisioning, supporting lasting prosperity."
 ludi_sgf_diplomatic_union:0 "Federal Diplomacy"
 ludi_sgf_diplomatic_union_desc:0 "The southern federation speaks with one voice abroad, giving its diplomats greater influence."
