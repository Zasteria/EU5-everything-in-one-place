l_spanish:
 STATIC_MODIFIER_NAME_nd_cat_crown_unmade: "The Crown Unmade"
 STATIC_MODIFIER_DESC_nd_cat_crown_unmade: "The Crown of Aragon was a union of equals. By taking the Principality's name the state has told Aragon and Valencia that they are possessions, and their estates have heard it."
 STATIC_MODIFIER_NAME_nd_cat_sworn_principality: "The Sworn Principality"
 STATIC_MODIFIER_DESC_nd_cat_sworn_principality: "The prince has sworn the Constitutions before the estates acknowledged him. He rules by contract: beloved in the Corts, obeyed in the country, and bound hand and foot by his own oath."
 STATIC_MODIFIER_NAME_nd_cat_govern_de_la_terra: "Government of the Land"
 STATIC_MODIFIER_DESC_nd_cat_govern_de_la_terra: "The Diputació del General taxes, arms and judges in the name of the land itself. The accounts are kept better than any king kept them. Crowned neighbours and great barons draw their own conclusions about a country that manages without a master."
 STATIC_MODIFIER_NAME_nd_cat_taula_segura: "The Safe Table"
 STATIC_MODIFIER_DESC_nd_cat_taula_segura: "The Taula de Canvi keeps to its founding rule and lends to the city alone. Every deposit is covered, the coin stays good, and the city borrows cheaply on the strength of it."
 STATIC_MODIFIER_NAME_nd_cat_taula_oberta: "The Open Table"
 STATIC_MODIFIER_DESC_nd_cat_taula_oberta: "The Taula de Canvi honours merchants' bills. More cargoes sail on credit than ever sailed on coin, and more promises circulate than there is silver to keep them."
 STATIC_MODIFIER_NAME_nd_cat_capitans_de_la_terra: "Captains of the Land"
 STATIC_MODIFIER_DESC_nd_cat_capitans_de_la_terra: "The miquelets serve under officers named by the Diputació and answer to nobody else. The estates trust an army they pay themselves, and the villages send their sons to it."
 STATIC_MODIFIER_NAME_nd_cat_a_sou_de_l_aliat: "In the Ally's Pay"
 STATIC_MODIFIER_DESC_nd_cat_a_sou_de_l_aliat: "The miquelets draw a foreign king's wages and march under his marshals. They are better fed and better supplied than they have ever been, and the estates watch their own men take another prince's oath."
 STATIC_MODIFIER_NAME_nd_cat_a_ultranca: "Resistance to the Last"
 STATIC_MODIFIER_DESC_nd_cat_a_ultranca: "The estates have voted to defend the Constitutions whatever it costs. Guildsmen stand the walls, priests carry powder, and nobody talks about what happens if the walls fall."
 STATIC_MODIFIER_NAME_nd_cat_capitulacio_honrosa: "An Honourable Capitulation"
 STATIC_MODIFIER_DESC_nd_cat_capitulacio_honrosa: "Terms were sought while there was still something to bargain with. The fields are unburned and the workshops are open. The men who signed are not greeted in the street."
 nd_cat.1.t: "The Principality of Catalonia"
 nd_cat.1.d: "From the marsh of Salses to the Ebro and from the Pyrenees to the sea, the land the notaries call the Principatus Cathaloniae answers to one government and to no other realm's convenience. It has laws older than most kingdoms: the Usatges, the Constitutions voted in Corts, the customs of Barcelona. What it has never settled is where its sovereignty rests.\n\nOne answer is the old formula of the oath. The prince comes before the estates, swears to keep the Constitutions, and only then is acknowledged: a count bound by contract, strong in the goodwill of the estates and weak in his own right.\n\nThe other answer was given whenever a prince broke his word. Then the Diputació del General, the standing committee of the Corts, raised taxes and soldiers in the name of the land itself, and found that the land could be governed without him, though no crowned neighbour ever forgave it the lesson.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cat.1.d.crown: "For two centuries the Counts of Barcelona were also Kings of Aragon, and their Crown was a union of equals: Aragon, Catalonia, Valencia and Mallorca, each with its own laws and its own Corts, none the province of another. That union is now set aside. The state takes the Principality's name and keeps the Principality's capital, and Zaragoza and Valencia are left to work out what they have become. Their estates will not thank us.\n\nWhat remains to settle is where Catalan sovereignty rests. One answer is the old formula of the oath: the prince swears the Constitutions before the estates and only then is acknowledged, a count bound by contract, strong in the goodwill of the estates and weak in his own right.\n\nThe other answer was given whenever a prince broke his word. Then the Diputació del General raised taxes and soldiers in the name of the land itself, and found that the land could be governed without him, though no crowned neighbour ever forgave it the lesson.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cat.1.a: "The prince swears first, and then we obey."
 nd_cat.1.b: "The land governs itself through its Deputies."
 nd_cat.1.a_tt: "A count bound by his oath: the estates are with him and his own hand is weaker."
 nd_cat.1.b_tt: "The Diputació rules in the land's name: efficient at home and distrusted abroad."
 nd_cat.2.t: "Once Every Year"
 nd_cat.2.d: "Barcelona, the winter of 1283. King Peter the Great has taken Sicily, been excommunicated for it, and expects a French crusade across the Pyrenees. He needs money, and the estates gathered in Corts know it. Before they vote him anything they obtain two constitutions that every later prince will have to swear.\n\nBy the first, the king shall hold a general court for the Catalans once every year. By the second, he shall make no general statute for Catalonia without the approval and consent of the prelates, barons, knights and citizens. The order of business is fixed as well: grievances are heard and redressed first, and the subsidy is voted afterwards. A tax granted that way is a tax people pay."
 nd_cat.2.a: "Volem, estatuïm e ordenam."
 nd_cat.2.a_tt: "We will, we enact and we ordain: the formula of a law made by prince and estates together."
 nd_cat.3.t: "The Table of Exchange"
 nd_cat.3.d: "On the twentieth of January 1401 the Council of One Hundred sets up a table in the exchange of Barcelona, covered with a carpet that bears the city's arms. Private money changers have failed one after another, taking widows' dowries and orphans' portions down with them. From today the city keeps deposits itself, under its own guarantee, and moves money between accounts by a word spoken at the table and entered in its books.\n\nThe founders give the Taula de Canvi a hard rule: it may lend to the city, and to no private person whatever. The merchants on the exchange floor are already asking why a bank so safe should be of so little use to them."
 nd_cat.3.a: "Deposits are sacred. The Table lends to the city alone."
 nd_cat.3.b: "Let a merchant's bill be honoured at the Table."
 nd_cat.3.a_tt: "The bank stays safe and of use only to the city."
 nd_cat.3.b_tt: "Trade grows on credit, and so does the paper in circulation."
 nd_cat.4.t: "The Miquelets"
 nd_cat.4.d: "Corpus Christi, 1640. The reapers come down into Barcelona with their sickles, the viceroy dies on the beach trying to reach a galley, and a royal army marches on the Principality to teach it obedience. The Diputació has no regiments. It has mountains, and in them men who have carried a gun since boyhood: charcoal burners, smugglers, shepherds, and bandits pardoned for the occasion.\n\nFormed into companies under captains such as Josep Margarit, they take the name of miquelets and hold the passes. They want powder, pay and officers who know a siege from a skirmish. A powerful neighbour offers all three, on condition that the companies take his wages and serve under his marshals."
 nd_cat.4.a: "They are the land's own men, under the land's own captains."
 nd_cat.4.b: "Take the ally's pay, his powder and his marshals."
 nd_cat.4.a_tt: "The companies stay poor, numerous and the estates' own."
 nd_cat.4.b_tt: "The companies are fed and supplied by a foreign king, and sworn to him."
 nd_cat.5.t: "The Junta de Braços"
 nd_cat.5.d: "Barcelona, July 1713. The allies have signed their peace at Utrecht and sailed away. The imperial viceroy has handed over his keys and left. A Bourbon army stands before the walls with orders to abolish the Constitutions. The three estates meet as the Junta de Braços to decide whether to submit.\n\nThe churchmen will not vote for bloodshed. The nobles vote to treat. Then Manuel de Ferrer i Sitges speaks, the nobles change their vote, and the commons carry it: Catalonia will resist to the last. On the ninth of July drums beat the declaration through the streets.\n\nEveryone in the hall knows the arithmetic. Everyone also knows that an honourable surrender offered today would be accepted."
 nd_cat.5.a: "We shall defend the Constitutions to the last wall."
 nd_cat.5.b: "Treat now, while there is still something to save."
 nd_cat.5.a_tt: "Every wall is held, whatever the war costs."
 nd_cat.5.b_tt: "The country is spared and the surrender is remembered."
 nd_cat.6.t: "The Drummer of El Bruc"
 nd_cat.6.d: "June 1808. A French column of nearly four thousand marches out of Barcelona to punish Manresa and take Lleida. At the pass of El Bruc, under the rock teeth of Montserrat, it meets the sometent of Igualada, Manresa and the villages around: men called out by the church bells with whatever gun hung over the hearth.\n\nTradition adds a boy from Santpedor with a drum, whose echo off the mountain sounded like an army on the march. The column turns back. A week later it tries again and is turned back again. Within the month the Junta Superior of the Principality orders forty tercios of miquelets raised.\n\nAn empire that has beaten every regular army in Europe has found the kind of war it does not know how to win."
 nd_cat.6.a: "Via fora! To the passes!"
 nd_cat.6.a_tt: "The sometent is out and the tercios are forming."
 nd_cat_formed_tt: "Catalonia has been formed"
 nd_cat_path_a_tt: "Chose the Sworn Principality"
 nd_cat_path_b_tt: "Chose the Government of the Land"
 nd_cat_taula_needs_council_tt: "A council hall of any tier stands in this location"
 nd_cat_carreratge_needs_barcelona_tt: "The owner of this location holds Barcelona"
 nd_cat_via_fora: "Via Fora!"
 nd_cat_via_fora_desc: "The usatge Princeps namque obliges every man of the land to turn out when the prince is attacked. The summons is a cry passed from parish to parish with the bells: Via fora! It can be raised only in defence of the land, and in defence of the land nothing in Christendom musters faster."
 nd_cat_recognoverunt_proceres: "Recognoverunt Proceres"
 nd_cat_recognoverunt_proceres_desc: "In 1284 King Peter confirms the customs of Barcelona in one hundred and sixteen chapters, named from their opening words. With the Council of One Hundred that has governed the city since 1265, the charter makes the capital a republic of its own citizens inside the prince's realm."
 nd_cat_una_vegada_lo_any: "Una Vegada lo Any"
 nd_cat_una_vegada_lo_any_desc: "Once every year: by the constitution of 1283 the prince must call the Corts annually and may make no general law without them. Grievances are redressed before the subsidy is voted, so the subsidy, once voted, is paid."
 nd_cat_fargues_del_pirineu: "Forges of the Pyrenees"
 nd_cat_fargues_del_pirineu_desc: "Ore from the Canigó and the Ripollès, charcoal from the slope above, a torrent for the hammers. The valleys of the Catalan Pyrenees have smelted iron since the counts, by a method the rest of Europe will come to call the Catalan forge."
 nd_cat_banca_municipal: "The Municipal Table"
 nd_cat_banca_municipal_desc: "In 1401 Barcelona opens a table of exchange and deposit owned by the city and run by citizens the council elects. It keeps the public money, guards private savings, and settles debts by transfer in its books. Perpinyà, Girona, Tarragona, Vic and Lleida found tables of their own."
 nd_cat_carreratge: "Carreratge"
 nd_cat_carreratge_desc: "A town or village is declared, in law, a street of Barcelona. Its people become citizens of the capital and can never again be sold or pledged to a lord. From the 1380s Igualada, Moià, Granollers, Mataró and dozens more take the bargain, some of them two days' ride from the city walls."
 nd_cat_draps_de_la_terra: "Draps de la Terra"
 nd_cat_draps_de_la_terra_desc: "Cloth of the land: middling woollens from Barcelona, Perpinyà, Puigcerdà, Berga and Banyoles. Around 1400 some thirty thousand pieces a year leave Catalan ports, and for two generations they outsell Flemish and Italian cloth in the markets of Sicily."
 nd_cat_dret_del_general: "Dret del General"
 nd_cat_dret_del_general_desc: "The duty on everything that enters or leaves the Principality, and the bolla on every piece of cloth. The estates voted these taxes in the 1360s and kept them: they are collected at the Diputació's own customs tables and belong to the General, not to the prince. Catalonia can bear a heavier tariff than a king could impose, the estates are content with a tax that is their own, and the prince sees less of it."
 nd_cat_mas_i_hereu: "Mas i Hereu"
 nd_cat_mas_i_hereu_desc: "The farm and the heir. After the Sentence of Guadalupe the freed tenant holds his farmstead on a perpetual lease and leaves it whole to one child, the hereu or the pubilla. The land is never divided, the house stands for centuries, and the younger children take a dowry to the towns."
 nd_cat_insaculacio: "Insaculació"
 nd_cat_insaculacio_desc: "From 1498 the offices of Barcelona are filled by lot, as the Diputació's have been since 1493. The names of every man judged fit to serve go into a bag, and a child draws one. There is no election to buy and no faction worth arming."
 nd_cat_ordinacions_d_assegurances: "Ordinances of Insurance"
 nd_cat_ordinacions_d_assegurances_desc: "Between 1435 and 1484 the councillors of Barcelona write the oldest insurance code in Europe. A policy must be drawn by a notary, a claim is paid within months, and a Catalan hull may be insured for more of its value than a foreign one."
 nd_cat_vidre_catala: "Vidre Català"
 nd_cat_vidre_catala_desc: "Every New Year's Day the glassmakers of Barcelona set out their stalls at the Born. Their enamelled and gilded ware is bought for the tables of Castile and Rome, and Italians who should know say it stands beside the glass of Murano."
 nd_cat_miquelets_de_la_terra: "Miquelets of the Land"
 nd_cat_miquelets_de_la_terra_desc: "In 1640 the Diputació raises companies of mountain men to hold the passes: a short gun, two pistols, a dagger and rope sandals. They are called miquelets, and for two centuries no army will cross Catalonia without hearing from them."
 nd_cat_canons_de_ripoll: "Barrels of Ripoll"
 nd_cat_canons_de_ripoll_desc: "The barrel forgers and lock makers of Ripoll turn forge iron into the best firearms made in the Spains. Their short flintlock, the pedrenyal, is banned by one viceroy after another and carried by every man who can afford it."
 nd_cat_galeres_del_general: "Galleys of the General"
 nd_cat_galeres_del_general_desc: "The Corts of 1599 vote a squadron of galleys to clear the coast of Barbary corsairs. The ships belong to the Diputació del General and are paid from its own taxes: a navy owned by a parliament."
 nd_cat_visita_del_general: "The Visita"
 nd_cat_visita_del_general_desc: "Every three years a tribunal of visitors opens the books of the Generalitat and tries every officer who served in the term just ended, from the deputies down to the customs guards. What was taken is paid back."
 nd_cat_regiments_de_muntanya: "Regiments of the Mountain"
 nd_cat_regiments_de_muntanya_desc: "Between 1705 and 1714 the miquelets are mustered as regiments of mountain fusiliers, with colonels, companies and pay books. Around each regiment gather volunteers who will keep fighting in the hills after the cities have fallen."
 nd_cat_banderes_dels_gremis: "Banners of the Guilds"
 nd_cat_banderes_dels_gremis_desc: "Each trade of Barcelona musters its own company under its own banner and stands its own stretch of wall. Together they are the Coronela, and the chief councillor of the city is their colonel."
 nd_cat_fenix_de_catalunya: "Fènix de Catalunya"
 nd_cat_fenix_de_catalunya_desc: "In 1683 Narcís Feliu de la Penya publishes his plan for a Catalonia reborn through making and selling: companies, new cloths, a free port. In the same years the factors of Amsterdam and London arrive at Reus to buy brandy by the shipload."
 nd_cat_molins_paperers: "Paper Mills of Capellades"
 nd_cat_molins_paperers_desc: "Along the Anoia the mills stand four storeys high, with hammers in the cellar and drying lofts under the roof. Their rag paper carries the stamped forms of an empire, from Madrid to Lima."
 nd_cat_resistencia_a_ultranca: "Resistència a Ultrança"
 nd_cat_resistencia_a_ultranca_desc: "In July 1713, abandoned by every ally, the estates of Catalonia vote to defend their Constitutions to the last. For fourteen months a city of guildsmen, students and priests holds its walls against the armies of two crowns."
 nd_cat_junta_de_comerc: "Junta de Comerç"
 nd_cat_junta_de_comerc_desc: "The merchants' board of Barcelona, chartered in 1758. With the university exiled to Cervera, the Junta opens free schools of its own in the exchange building: navigation, drawing, chemistry, mechanics. Whatever a trading country needs to know is taught there to anyone who walks in."
 nd_cat_pollacres_del_maresme: "Polacres of the Maresme"
 nd_cat_pollacres_del_maresme_desc: "In 1778 the American trade is opened to Catalan ports. The beach yards of Arenys, Canet and Mataró launch polacres by the hundred, and brandy and printed cloth go out to Havana in hulls built a morning's walk from the vineyards."
 nd_cat_timbal_del_bruc: "The Drum of El Bruc"
 nd_cat_timbal_del_bruc_desc: "In June 1808 the sometent turns back a French column at the pass of El Bruc, and the Junta Superior orders forty tercios of miquelets raised. The mountains go to war again, as they did in 1640 and in 1705."
 nd_cat_indians: "The Indians"
 nd_cat_indians_desc: "They went out to Cuba and Puerto Rico as shop boys and came home rich, and people called them indians or americanos. Their money builds houses with palm trees in the garden, and then banks, mills, schools and the harbour wall of the town they were born in."
 a_nd_cat_miquelets: "Miquelets"
 a_nd_cat_miquelets_desc: "Mountain irregulars raised by the Diputació: a short gun, two pistols and a dagger. They are deadly from a hillside and in an ambush. On open ground they break sooner than drilled foot."
 levy_nd_cat_miquelets: "Miquelet Levy"
 levy_nd_cat_miquelets_desc: "Catalan peasants and laborers of the hill country, called out in companies to hold the passes."
 n_nd_cat_galera_del_general: "Galera del General"
 n_nd_cat_galera_del_general_desc: "A galley of the squadron the Corts voted in 1599, owned by the Diputació and built to run down corsairs off the home coast. It is quick and handy, and no ship for a long blockade."
 a_nd_cat_fusellers_de_muntanya: "Fusellers de Muntanya"
 a_nd_cat_fusellers_de_muntanya_desc: "Miquelets on a regimental footing. They outshoot line infantry and will hold a slope against twice their number. In a stand-up fight on level ground their loose order costs them."
 a_nd_cat_fusellers_voluntaris: "Fusellers Voluntaris"
 a_nd_cat_fusellers_voluntaris_desc: "The volunteer companies that gather around the mountain regiments: the same men as the old miquelets, with a better musket and a sergeant."
 levy_nd_cat_fusellers_voluntaris: "Volunteer Fusilier Levy"
 levy_nd_cat_fusellers_voluntaris_desc: "Catalan peasants and laborers raised as volunteer companies of mountain fusiliers."
 a_nd_cat_coronela: "Coronela"
 a_nd_cat_coronela_desc: "The guild militia of Barcelona: tailors, tanners, notaries, stevedores and students, each company under its trade's banner. They do not break on their own walls. They will not march far from them either."
 levy_nd_cat_coronela: "Coronela Levy"
 levy_nd_cat_coronela_desc: "Catalan burghers mustered by guild, each trade as a company under its own banner."
 a_nd_cat_tercos_de_miquelets: "Terços de Miquelets"
 a_nd_cat_tercos_de_miquelets_desc: "The tercios of miquelets ordered by the Junta Superior in 1808. They fight in the same hills at the same trade, and with a better musket."
 levy_nd_cat_tercos_de_miquelets: "Miquelet Tercio Levy"
 levy_nd_cat_tercos_de_miquelets_desc: "Catalan peasants and laborers raised by tercio against an occupying army."
 n_nd_cat_pollacra: "Pollacra"
 n_nd_cat_pollacra_desc: "The polacre of the Maresme yards. She is fast and roomy, built as a merchantman and gunned like one, and she sails under a letter of marque when there is a war on."
 nd_cat_farga: "Farga"
 nd_cat_farga_desc: "A Catalan forge: a low hearth, a water-driven hammer and, in later centuries, the trompa, a column of falling water that drags the blast down with it. It stands where ore, charcoal and a torrent meet, which is never on the plain."
 nd_cat_farga_ferro_i_claus: "Iron and Nails"
 nd_cat_farga_ferro_i_claus_desc: "Bar iron drawn into nails, keys and edge tools, and sent down the valley by the mule load."
 nd_cat_farga_pedrenyals: "Pedrenyals"
 nd_cat_farga_pedrenyals_desc: "Barrels and flintlocks in the manner of Ripoll: short guns for a saddle or a sash, made by three guilds that each sign their part."
 nd_cat_taula_de_canvi: "Taula de Canvi"
 nd_cat_taula_de_canvi_desc: "The town's own table of exchange and deposit. It keeps the public money and the citizens' savings, settles debts by transfer in its books, and may lend to the town and to no one else."
 nd_cat_taula_de_canvi_maintenance: "Books of the Table"
 nd_cat_taula_de_canvi_maintenance_desc: "Ledgers, and the reserve of coin that stands behind every entry in them."
 nd_cat_carrer_de_barcelona: "Carrer de Barcelona"
 nd_cat_carrer_de_barcelona_desc: "This place is, in law, a street of Barcelona. Its people are citizens of the capital, trade under the capital's exemptions, and can never be sold to a lord. When the city's host is called they march under the banner of Santa Eulàlia."
 nd_cat_carreratge_maintenance: "Dues of the Street"
 nd_cat_carreratge_maintenance_desc: "The parchments of the charter, the banner, and arms for the contingent the place owes to the host of Barcelona."
 nd_cat_obrador_de_paraires: "Obrador de Paraires"
 nd_cat_obrador_de_paraires_desc: "The workshop of a paraire, the clothier of a Catalan town. He buys the wool, puts out the carding, spinning and weaving, fulls and finishes the piece, and sends it to the port under the lead seal of the bolla."
 nd_cat_paraires_draps_de_llana: "Draps de Llana"
 nd_cat_paraires_draps_de_llana_desc: "Middling woollens, mordanted with alum, dyed in the piece and sealed for export."
 nd_cat_masia: "Masia"
 nd_cat_masia_desc: "A stone farmhouse on its own land, held on a lease that cannot be raised and passed whole to a single heir. There are fields around it and woodland above it, and the same family name has been over the door for three hundred years."
 nd_cat_masia_maintenance: "Upkeep of the Mas"
 nd_cat_masia_maintenance_desc: "Tools for the fields, timber for the beams and tiles for the roof."
 nd_cat_forn_de_vidre: "Forn de Vidre"
 nd_cat_forn_de_vidre_desc: "A glass furnace of the Barcelona guild, whose enamelled and gilded ware is sold at the fair of the first of January."
 nd_cat_vidre_esmaltat: "Enamelled Glass"
 nd_cat_vidre_esmaltat_desc: "Clear glass blown thin, painted in green and white enamel and fired a second time."
 nd_cat_fassina: "Fassina"
 nd_cat_fassina_desc: "A brandy still among the vines. The wine of the Camp de Tarragona is too thin to travel, so it is burned where it is pressed and only the spirit goes down to the quay."
 nd_cat_aiguardent_de_reus: "Aiguardent of Reus"
 nd_cat_aiguardent_de_reus_desc: "Wine distilled to proof and barrelled for the factors of Amsterdam and London. Reus, Paris and London, they say, set the price."
 nd_cat_moli_paperer: "Molí Paperer"
 nd_cat_moli_paperer_desc: "A paper mill on a mountain stream. Water hammers beat the rags to pulp in the cellar, and the sheets dry in open lofts under the roof."
 nd_cat_paper_de_draps: "Rag Paper"
 nd_cat_paper_de_draps_desc: "Linen and hemp rags beaten to pulp, moulded by the sheet and sized for the pen."
 nd_cat_escoles_de_llotja: "Escoles de Llotja"
 nd_cat_escoles_de_llotja_desc: "The free schools of the Junta de Comerç, held in the exchange building: pilots, draughtsmen, chemists and mechanics, taught at the merchants' expense because the university has been sent away."
 nd_cat_escoles_de_llotja_maintenance: "Masters and Instruments"
 nd_cat_escoles_de_llotja_maintenance_desc: "Paper, printed texts, and the instruments of the pilot and the draughtsman."
 nd_cat_dest_valencia_share_tt: "We or our non-sovereign subjects hold at least 75% of the locations in the Valencia area"
 nd_cat_dest_taules_tt: "At least 4 of our locations have a Taula de Canvi"
 nd_cat_dest_barcelona_45_tt: "Barcelona has at least 45 development"
 nd_cat_dest_barcelona_60_tt: "Barcelona has at least 60 development"
 nd_cat_dest_paraires_tt: "At least 4 of our locations have an Obrador de Paraires"
 nd_cat_destiny: "From Salses to Tortosa"
 nd_cat_destiny_desc: "The Peace and Truce sworn at Fondarella in 1173 is the first text to name the land by its bounds: from Salses to Tortosa and Lleida. Whoever keeps the peace between those marks governs Catalonia. Keep the country steady, and it can turn to what it chose at its founding: a prince who gathers the lands of the Catalan tongue one oath at a time, or a land that taxes, borrows and builds through its own Deputies."
 nd_cat_dest_regne_dins_la_mar: "Regne dins la Mar"
 nd_cat_dest_regne_dins_la_mar_desc: "James the Conqueror called Mallorca a kingdom in the sea and then willed it away to a younger son. In 1343 Peter the Ceremonious came back for it with a lawsuit and a fleet. Hold Palma, Ciutadella on Menorca and Ibiza: three islands of Catalan speech two days' sail from Barcelona, which no prince of the mainland can leave in another crown's hand."
 nd_cat_dest_jurar_els_furs: "Jurar els Furs"
 nd_cat_dest_jurar_els_furs_desc: "In 1261 James the Conqueror gave València a law of its own and bound every successor to come to the city and swear it within a month of his accession. A kingdom that has been sworn to is a kingdom that obeys. Hold València and Xàtiva (Játiva) and three quarters of the Valencian country, and stand high enough in honour that its estates will come to hear the oath."
 nd_cat_dest_mata_de_jonc: "La Mata de Jonc"
 nd_cat_dest_mata_de_jonc_desc: "Ramon Muntaner gave the kings of the house of Barcelona the parable of the clump of rushes: bound with one cord, ten strong men cannot pull it up; unbound, a child of eight pulls it out rush by rush. Gather the last rushes of the Catalan tongue: Fraga, Benabarre and Valderrobres on the march of Aragon, Oriola (Orihuela) beyond Xixona, and l'Alguer (Alghero) in Sardinia. Unlocks the Pobla, the chartered village by which the house of Barcelona peopled what it took."
 nd_cat_dest_principat_i_comtats: "Principat i Comtats"
 nd_cat_dest_principat_i_comtats_desc: "The Diputació styled its jurisdiction the Principality of Catalonia and the Counties of Rosselló and Cerdanya, and in 1659 a treaty signed on an island in the Bidasoa cut the Counties away. Hold Perpinyà (Perpignan) and Puigcerdà, and have a thousand in gold in the chest: the General pays for its frontier out of its own duties or it does not keep one."
 nd_cat_dest_censals_del_general: "Censals del General"
 nd_cat_dest_censals_del_general_desc: "From the 1360s the Diputació paid its way by selling censals: pensions paid out of its duties for ever, which only the General itself could choose to buy back. The paper was as good as the tables of exchange that paid it on the day. Embrace banking, have a Taula de Canvi open in four places, raise Barcelona to 45 development and hold two thousand in gold. The General may then sell a government bond of its own."
 nd_cat_dest_lo_general: "Lo General de Catalunya"
 nd_cat_dest_lo_general_desc: "A land that governs itself has to pay for itself, and the fifteenth century knew how: make cloth, sell it, and keep the duties. The Corts shut foreign cloth out in 1422 and voted the country's trade its protection again in 1481. Three years later the sea law of Barcelona's consuls went to the press. Embrace the printing press, have paraires' workshops open in four places, raise Barcelona to 60 development, bring the valleys of Andorra under the General as land or as a subject, and hold three thousand in gold. Unlocks the Taula del General, the customs table of the Diputació."
 nd_cat.7.t: "From Salses to Tortosa"
 nd_cat.7.d: "The notaries have a formula for the country, and it is older than any dynasty that has reigned in it. In 1173, at Fondarella, the count's peace was sworn over a land named by its edges: from Salses to Tortosa and Lleida, with their bounds. Nobody at Fondarella called it a kingdom and nobody has since. It is a principality, which in practice means a body of law with a country attached.\n\nThat country has one government again. Its neighbours did not agree to this. There is always a crown inland that thinks the Principality a province which has mislaid itself, and a France that has wanted the passes since Charlemagne.\n\nWhere sovereignty rests was settled in the oath hall. What remains is to make the answer true on the ground."
 nd_cat.7.a: "Then let the land be worth the formula."
 nd_cat.8.t: "A Kingdom in the Sea"
 nd_cat.8.d: "When James the Conqueror took Mallorca in 1229 he set down in his own book that God had granted him what no king in Spain had managed: a kingdom in the sea. Then he willed it to a younger son, and for nearly seventy years the islands had a king of their own, with a palace at Perpinyà and a coinage he had no right to strike.\n\nPeter the Ceremonious ended that in 1343 with a lawsuit, a fleet and a week's campaign. Besides the kingdom he brought home its king's book of household ordinances, the most careful in Christendom, and had it put into Catalan as the rule of his own court.\n\nThe islands answer to Barcelona again. A galley that clears the harbour at dusk raises the mountains of Mallorca on the second morning."
 nd_cat.8.a: "The islands shall never again be parted from the land."
 nd_cat.9.t: "The Oath at València"
 nd_cat.9.d: "The law of the kingdom of València is plain about who goes first. Within a month of his accession the prince must come to the city, stand before the three estates, and swear the Furs that James the Conqueror gave the kingdom in 1261. Until he has sworn, nobody there owes him anything.\n\nThe estates are waiting. So are several of the prince's own councillors, who point out that València was won by Catalan and Aragonese arms, that about a third of its people are Moors living under their own judges, and that a second body of law is a second set of men entitled to say no. The Usatges and the Constitutions, they say, would travel perfectly well."
 nd_cat.9.a: "València is a kingdom. The prince will swear its Furs."
 nd_cat.9.b: "One prince and one law, from Salses to Guardamar."
 nd_cat.10.t: "The Bundle of Rushes"
 nd_cat.10.d: "Ramon Muntaner fought for the house of Barcelona from Gallipoli to Djerba, and into the chronicle of his old age he set a piece of advice for its kings. Take a clump of rushes, he wrote, and bind it with a stout cord. Ten strong men pulling together will not tear it out of the ground. Untie the cord, and a child of eight will pull up the whole clump, one rush at a time.\n\nThe cord is tied. From Salses to Guardamar and from Fraga to Maó, and across the water at l'Alguer, people of one speech answer to one prince. Each land has sworn him and been sworn to, and each keeps its own Corts and its own purse.\n\nThe estates now ask whether a bundle bound by oaths should also sit in one room."
 nd_cat.10.a: "Call them to Montsó: one General Corts for every land."
 nd_cat.10.b: "Each land keeps its own Corts, and the prince goes to each."
 nd_cat.11.t: "The Principality and the Counties"
 nd_cat.11.d: "Every act of the General opens with the same words: the Principality of Catalonia and the Counties of Rosselló and Cerdanya. The formula is no courtesy. The Diputació keeps its local deputies in Perpinyà and Puigcerdà as it keeps them in Girona and Tortosa, its collectors sit at the pass of Salses, and the wine of the Rosselló pays the same duty as the wine of the Penedès.\n\nA Catalonia that stopped at the Albera was the formula with a hole in it. The hole is closed. The road from Barcelona runs to the lagoon of Salses under one law again, and the customs tables along it answer to one set of books."
 nd_cat.11.a: "From Salses to the Sénia, one land and one General."
 nd_cat.12.t: "The Censals of the General"
 nd_cat.12.d: "A country without a prince has no crown jewels to pawn. What the General has is the duty on everything that crosses the border and the bolla on every piece of cloth, and since the Corts of the 1360s it has known how to turn a tax that comes in slowly into money that is on the table today. It sells censals. A buyer pays a capital sum, and the General pays him a pension out of the duties every year for ever, or until the General chooses to buy the pension back.\n\nThe pensions are paid on the day, at the tables of exchange the towns have opened, and so the paper is held to be as safe as land. Chapters hold it, and convents, guilds and widows. Now the factors of Genoese and Florentine houses are asking to buy, and they offer to take a lower pension than any citizen would."
 nd_cat.12.a: "Sell to whoever brings silver. Cheap money is cheap money."
 nd_cat.12.b: "The land shall owe its debts to its own people."
 nd_cat.13.t: "Lo General de Catalunya"
 nd_cat.13.d: "The old books called the whole body of those who paid the duties lo General, and in time the name passed to the house that kept their accounts. That house now has a table in every town from Perpinyà to Tortosa: a collector, a second clerk who keeps a second book against him, and a chest of lead seals. Sealed cloth goes down to the port by the bale, the sea law of Barcelona's consuls is sold in print, and the city is twice what it was.\n\nThe honoured citizens and the importers of fine cloth, whom the street calls the Biga, want the port open: let every nation's ships unload, and let the General take its duty on what they land. The merchants and craftsmen of the Busca want what the Corts voted in 1422. The bolla was made to seal Catalan cloth, they say, and foreign cloth should pay dearly for the lead."
 nd_cat.13.a: "Open the port. Let every flag unload at Barcelona."
 nd_cat.13.b: "Seal our own cloth, and tax the stranger's at the gate."
 STATIC_MODIFIER_NAME_nd_cat_dest_regne_per_si: "A Kingdom of Its Own"
 STATIC_MODIFIER_DESC_nd_cat_dest_regne_per_si: "The prince has sworn the Furs at València. The kingdom keeps its law, its Moors keep their judges, and settlers come to a country where a charter means what it says."
 STATIC_MODIFIER_NAME_nd_cat_dest_una_sola_llei: "One Law"
 STATIC_MODIFIER_DESC_nd_cat_dest_una_sola_llei: "The Usatges and the Constitutions run from Salses to Guardamar. The prince's officers know one book wherever they sit, and newcomers learn the tongue it is written in. Those who farmed under older franchises have not forgotten them."
 STATIC_MODIFIER_NAME_nd_cat_dest_corts_generals: "General Corts at Montsó"
 STATIC_MODIFIER_DESC_nd_cat_dest_corts_generals: "Catalans, Valencians and Mallorcans sit together in one town on the Cinca and vote one grant. Galleys are laid down in every yard at once, and the hosts of every land muster to one summons."
 STATIC_MODIFIER_NAME_nd_cat_dest_cada_regne: "Each Land Its Own Corts"
 STATIC_MODIFIER_DESC_nd_cat_dest_cada_regne: "The prince rides from one sworn land to the next and bargains with each in its own hall. No neighbour fears a crown so plainly bound, and every embassy is welcome somewhere. A bale of cloth pays at each land's customs tables on its way across them."
 STATIC_MODIFIER_NAME_nd_cat_dest_censals_oberts: "Censals for All Comers"
 STATIC_MODIFIER_DESC_nd_cat_dest_censals_oberts: "Genoese and Florentine houses buy the General's pensions in large lots, at a rate no citizen would accept. The money is cheap. The men who hold the paper also read the accounts it is paid from."
 STATIC_MODIFIER_NAME_nd_cat_dest_censals_de_la_terra: "The Land Its Own Creditor"
 STATIC_MODIFIER_DESC_nd_cat_dest_censals_de_la_terra: "Only the land's own people hold the General's pensions: chapters, convents, guilds and widows. Half of Barcelona lives a little on the public credit, and has every reason to want the government that pays it to last."
 STATIC_MODIFIER_NAME_nd_cat_dest_port_obert: "The Open Port"
 STATIC_MODIFIER_DESC_nd_cat_dest_port_obert: "Any ship may unload at Barcelona once the General has taken its duty. Foreign factors take houses by the sea wall, and their ways of doing business come ashore with them."
 STATIC_MODIFIER_NAME_nd_cat_dest_bolla_de_plom: "The Lead Seal"
 STATIC_MODIFIER_DESC_nd_cat_dest_bolla_de_plom: "Catalan cloth goes out under the lead seal of the bolla and foreign cloth pays dearly at the gate. The looms are busy and journeymen become masters. The factors whose bales are taxed write home to their kings about it."
 nd_cat_dest_pobla: "Pobla"
 nd_cat_dest_pobla_desc: "A village founded by charter. The prince marks out the streets, grants each settler a house plot and fields on easy terms, and names the day by which he must be living there. James II of Mallorca ordered a dozen laid out at a stroke in 1300, and l'Alguer was peopled with Catalans this way in 1354."
 nd_cat_dest_pobla_maintenance: "Franchises of the Pobla"
 nd_cat_dest_pobla_maintenance_desc: "Tools, timber and stone for the houses the charter obliges each settler to raise."
 nd_cat_dest_taula_del_general: "Taula del General"
 nd_cat_dest_taula_del_general_desc: "A customs table of the Diputació. Two officers keep it, the collector and the clerk who writes a second book to check him. Nothing crosses the town's bounds or leaves a loom without paying the General its duty and taking its seal."
 nd_cat_dest_taula_del_general_maintenance: "Collidor i Credencer"
 nd_cat_dest_taula_del_general_maintenance_desc: "Ledgers kept in two hands, lead for the seals of the bolla, and the scales and stamps of the table."
 nd_cat.7.a_tt: "The Principality holds its bounds and turns to the course it chose."
 nd_cat.8.a_tt: "The islands are joined to the Principality by the prince's oath."
 nd_cat.9.a_tt: "València keeps a law of its own, and the prince is bound by it."
 nd_cat.9.b_tt: "Catalan law is carried south, over the older franchises of the kingdom."
 nd_cat.10.a_tt: "Every land votes its men and its galleys in one assembly."
 nd_cat.10.b_tt: "The lands stay separate under one oath, and trade pays at each border."
 nd_cat.11.a_tt: "The Counties answer to the General's deputies again."
 nd_cat.12.a_tt: "The debt is large and cheap, and strangers hold it."
 nd_cat.12.b_tt: "The debt stays at home, and those who hold it stand by the government."
 nd_cat.13.a_tt: "Barcelona opens to the trade of every nation."
 nd_cat.13.b_tt: "The looms are protected, and foreign merchants resent it."

 # ===== BUREAUCRACIES =====
 cat_consell_de_cent_bureaucracy: "Consell de Cent"
 cat_consell_de_cent_bureaucracy_desc: "The government of Barcelona. James I named four paers in 1249, a council of one hundred jurats gave it its name in 1265, and from 1274 five consellers were elected each Saint Andrew's Day. From 1373 it met in the Saló de Cent. Its first duty was bread: it bought Sicilian and Sardinian wheat ahead with the city's money, and by the privilege called vi vel gratis it could make any grain ship in its waters unload, willingly or by force. Each year it also chose the mostassaf, who checked weights and prices, and the obrers, who kept the walls and the harbour mole."
 cat_batllia_general_bureaucracy: "Batllia General"
 cat_batllia_general_bureaucracy_desc: "The batlle general, documented from the thirteenth century, kept everything that was the prince's own: rents and tolls, mills, mines, salt pans, forests and public waters. In his land books, the capbreus, every tenant declared on oath what he held and what he owed. By grants called establiments he let water for a mill or ore for a forge against a yearly rent, and his court collected amortització whenever the Church acquired royal land. In 1399 Martin I declared the patrimony inalienable, and places pledged to lords bought their way back into it."
 cat_vegueries_bureaucracy: "Vegueries"
 cat_vegueries_bureaucracy_desc: "The veguer was the prince's officer in a district: judge of first instance, keeper of the Peace and Truce, and captain of the district's host. The Corts of Barcelona of 1228 kept him out of baronial and church land unless the Peace was broken or justice denied. Under James II there were about eighteen vegueries, drawn along the valleys. A veguer served three years, and at the end of them judges of the table sat to hear any complaint against him: the purga de taula."
 cat_tribunal_de_contrafaccions_bureaucracy: "Tribunal de Contrafaccions"
 cat_tribunal_de_contrafaccions_bureaucracy_desc: "A court for breaches of the Constitutions, voted by the Corts of 1701-1702 and improved by those of 1705-1706. Six judges sat in the Palau de la Generalitat: three doctors of the Reial Audiència for the prince, and a churchman, a nobleman and a citizen for the estates. A tie was settled by lot and never by a royal casting vote. It heard complaints against the prince's officers and against lords who wronged their vassals, on the rule sworn in 1481 that whatever is done against the Constitutions is void."

 # The auto-modifier governing the slot grant on formation
 AUTO_MODIFIER_NAME_nd_cat_bureaucracy_authority: "Offices of the Principality"
 AUTO_MODIFIER_DESC_nd_cat_bureaucracy_authority: "The Principality keeps offices of its own: a city council, a bailiff of the patrimony, an officer in every district and a court for its Constitutions. The country can sustain two more standing institutions."
