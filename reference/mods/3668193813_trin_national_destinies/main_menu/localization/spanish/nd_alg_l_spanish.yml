l_spanish:
 STATIC_MODIFIER_NAME_nd_alg_the_well_guarded: "The Well-Guarded City"
 STATIC_MODIFIER_DESC_nd_alg_the_well_guarded: "Al-Jaza'ir al-Mahrusa: a walled harbour town of captains, gunners and soldiers that lives from the sea and fears nothing that comes by it. The shipyards work day and night, the batteries are never unmanned, and every prize is a blow struck for the faith. The tribes of the interior are left to themselves, and they know it."
 STATIC_MODIFIER_NAME_nd_alg_emir_of_the_tell: "Emir of the Tell"
 STATIC_MODIFIER_DESC_nd_alg_emir_of_the_tell: "The ruler rides among the tribes and sits with the shaykhs of the lodges. Horsemen answer his summons from the Moulouya to the Soummam, and newly won districts are bound in by oath and marriage. The merchants and captains of the ports serve this state. They no longer lead it, and they resent the change."
 STATIC_MODIFIER_NAME_nd_alg_khaldun_at_court: "The Chamberlain Returns"
 STATIC_MODIFIER_DESC_nd_alg_khaldun_at_court: "Ibn Khaldun is back in the chancery. No man in the Maghreb knows the Arab tribes better or is better heard in their tents, and no court from Fez to Cairo is ignorant of his name."
 STATIC_MODIFIER_NAME_nd_alg_science_of_civilization: "The Science of Civilization"
 STATIC_MODIFIER_DESC_nd_alg_science_of_civilization: "Left alone at Qalat Ibn Salama, Ibn Khaldun finishes his Introduction. Copies pass from hand to hand among the scholars of the realm, who find in it a new way to ask why states rise and fall."
 STATIC_MODIFIER_NAME_nd_alg_stones_of_the_penon: "Stones of the Penon"
 STATIC_MODIFIER_DESC_nd_alg_stones_of_the_penon: "The Spanish fort is coming down block by block, and its stones are going into the sea to make a causeway. Behind the growing mole the yards are already laying new keels."
 STATIC_MODIFIER_NAME_nd_alg_guns_on_the_rock: "Guns on the Rock"
 STATIC_MODIFIER_DESC_nd_alg_guns_on_the_rock: "The captured fort on the islet stands, repaired and rearmed. Our own cannon now cover the anchorage from the walls that once held it hostage."
 STATIC_MODIFIER_NAME_nd_alg_saint_guarded_city: "The Saint-Guarded City"
 STATIC_MODIFIER_DESC_nd_alg_saint_guarded_city: "The people hold that holy men of the city, Wali Dada and Sidi Betka among them, raised the storm that wrecked the emperor's fleet. Their tombs are crowded, the lodges are honoured, and no one doubts that God watches over the city."
 STATIC_MODIFIER_NAME_nd_alg_victors_of_1541: "Victors of 1541"
 STATIC_MODIFIER_DESC_nd_alg_victors_of_1541: "The gunners of the gates and the horsemen who rode down the emperor's camp have been rewarded before the whole city. The garrison walks tall, and the forts are kept as their pride requires."
 STATIC_MODIFIER_NAME_nd_alg_redemption_silver: "Redemption Silver"
 STATIC_MODIFIER_DESC_nd_alg_redemption_silver: "The friars have emptied their chests and the bagnios with them. Spanish pieces of eight go to the mint to be struck again in our name, and the consuls report that Algiers keeps its bargains."
 STATIC_MODIFIER_NAME_nd_alg_captive_craftsmen: "Captive Craftsmen"
 STATIC_MODIFIER_DESC_nd_alg_captive_craftsmen: "The carpenters, caulkers, founders and masons among the captives are not for sale at any price. They work in the arsenal and on the public buildings under guard, and teach their trades to our own men."
 STATIC_MODIFIER_NAME_nd_alg_house_of_bacri: "The Houses of Bacri and Busnach"
 STATIC_MODIFIER_DESC_nd_alg_house_of_bacri: "The grain trade runs through the two great merchant houses, who know every buyer from Marseille to Livorno. They take their share, and the port has never been busier."
 STATIC_MODIFIER_NAME_nd_alg_beylik_grain_monopoly: "The Beylik's Grain"
 STATIC_MODIFIER_DESC_nd_alg_beylik_grain_monopoly: "The ruler sells from his own silos through his own agents. Every cargo of wheat that leaves the harbour pays the treasury directly, and no merchant stands between the palace and the profit."
 STATIC_MODIFIER_NAME_nd_alg_peace_of_the_emir: "The Emir's Peace"
 STATIC_MODIFIER_DESC_nd_alg_peace_of_the_emir: "A treaty has bought time. Battalions are drilled, khalifas are appointed over the provinces, and magazines and workshops rise in the strongholds of the interior."
 STATIC_MODIFIER_NAME_nd_alg_jihad_of_the_emir: "The Emir's War"
 STATIC_MODIFIER_DESC_nd_alg_jihad_of_the_emir: "There will be no treaty. Every tribe is in the saddle, the columns move faster than any enemy can follow, and volunteers come in from the whole of the Tell."
 nd_alg.1.t: "The Throne of the Central Maghreb"
 nd_alg.1.d: "Between Fez and Tunis there has always been a middle land, and no one has held it for long. The Zayyanid sultans ruled it from Tlemcen with one eye on the Marinid armies. The mountain confederations of the Jurjura, the Arab tribes of the Mitidja and the oasis lords of the south each kept their own counsel. Now the Tell answers to one court, and the white town on the bay, al-Jaza'ir of the Banu Mazghanna, gives the realm its name.\n\nTwo roads open from here. The first turns the realm toward the sea: a walled harbour city of captains, gunners and soldiers, living from prizes, ransoms and the customs house, feared in every Christian port and thin on the ground beyond its own plain. The court itself would sit in Algiers. The second turns the realm inland: an emir who rides among the tribes, binds the marabouts and their lodges to his cause, and rules the Tell from the saddle while the ports serve him and do not lead him.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_alg.1.a: "Algiers the Well-Guarded: we face the sea"
 nd_alg.1.a_tt: "Sailors, shipbuilding, sea trade, stronger walls and harder terms for enemies of the faith. The court moves to Algiers if the city is held. The tribes of the interior are slighted."
 nd_alg.1.b: "An emir among the tribes: we rule the Tell"
 nd_alg.1.b_tt: "Light cavalry, morale and faster integration of new lands. The tribes and the clergy are satisfied. The burghers of the ports are slighted."
 nd_alg.2.t: "The Castle of Ibn Salama"
 nd_alg.2.d: "In 1375 Abd al-Rahman ibn Khaldun, weary of courts, rode out of Tlemcen on an errand for Sultan Abu Hammu and did not come back. He had served Fez, Granada, Bejaia and Tlemcen, had been chamberlain and prisoner by turns, and had bargained with the Arab tribes for whichever prince then employed him. Under the protection of the Awlad Arif he shut himself in Qalat Ibn Salama, a small fortress on the edge of the high plains, and in five months wrote the introduction to a history of the world. Dynasties, he argued, are born of the solidarity of desert peoples, soften within three generations of city life, and fall to the next hard men from the margins.\n\nThe man who explains why kingdoms die is living in ours. A ruler who needs an envoy the tribes will listen to could call him back to the chancery. A ruler who can wait could leave him to his book."
 nd_alg.2.a: "Summon him: no one handles the tribes as he does"
 nd_alg.2.a_tt: "Diplomatic reputation, satisfied tribes and a more able cabinet."
 nd_alg.2.b: "Leave him to his castle and his book"
 nd_alg.2.b_tt: "Research, cultural influence and prestige."
 nd_alg.3.t: "The Rock in the Harbour"
 nd_alg.3.d: "Since 1510 a Spanish fort has stood on the largest of the islets that give al-Jaza'ir its name, three hundred paces from the city gate. Its guns command the anchorage, and no ship enters or leaves without the leave of its castellan. In May 1529 Khayr al-Din brought up his batteries, breached the walls after twenty days of fire, and took the garrison of Martin de Vargas alive.\n\nThe captured rock can be used in one of two ways. Pulled down stone by stone with the labour of its own garrison, it would make a causeway joining the islets to the shore: a mole behind which a whole fleet could lie safe from the north wind. Left standing and armed with our own cannon, it would be a sea fort that no enemy squadron could pass."
 nd_alg.3.a: "Break it stone by stone and build the mole"
 nd_alg.3.a_tt: "Faster shipbuilding and greater maritime presence."
 nd_alg.3.b: "Keep the fort and mount our own guns on it"
 nd_alg.3.b_tt: "Stronger fort defence and larger garrisons."
 nd_alg.4.t: "The Emperor's Storm"
 nd_alg.4.d: "On 23 October 1541 Charles V landed east of Algiers with twenty-four thousand men and the largest armada the western sea had seen. Andrea Doria commanded the fleet, and Hernan Cortes and the Duke of Alba rode in the emperor's train. Hasan Agha held the city with a few thousand Turks, Andalusi arquebusiers and townsmen. On the second night a gale from the north-east broke over the bay. It soaked the powder, tore a hundred and fifty ships from their anchors and drove them onto the shore, where tribesmen from the hills finished what the sea had begun. The emperor marched his starving army to Cape Matifou and sailed away.\n\nThe city tells the story two ways. In the lanes they say that holy men, Wali Dada and Sidi Betka among them, prayed and beat the sea until the storm rose. In the barracks they say that the gunners at the Bab Azzoun gate and the horsemen who charged the sodden camp did the work, and that saints do not load cannon."
 nd_alg.4.a: "The saints guard this city: honour their tombs"
 nd_alg.4.a_tt: "Tolerance of the true faith, a satisfied clergy and cheaper stability."
 nd_alg.4.b: "Our guns and horsemen broke them: reward the soldiery"
 nd_alg.4.b_tt: "Army morale, army tradition and cheaper forts."
 nd_alg.5.t: "The Fathers of the Redemption"
 nd_alg.5.d: "Two Trinitarian friars in white habits marked with a red and blue cross have landed with chests of coin collected in the parishes of Spain and France. Their order and the Mercedarians come every few years to buy back captives, and their arrival is a market day. The owners parade their slaves, the pasha takes his tenth, and the customs house takes its fee on every head that leaves.\n\nThere are thousands of captives in the bagnios, taken at sea or carried off from the coasts of Italy, Spain and beyond. Most are worth only their ransom. Some are worth more than any ransom: ship carpenters, caulkers, sailmakers, gun founders and masons, whom the captains would sooner keep in chains at the arsenal than sell for any price the friars can pay."
 nd_alg.5.a: "Sell them all: silver is silver"
 nd_alg.5.a_tt: "Diplomatic reputation and more income from the mint."
 nd_alg.5.b: "Sell the idle. The craftsmen stay at the arsenal"
 nd_alg.5.b_tt: "Faster shipbuilding and faster construction."
 nd_alg.6.t: "The Grain of the Beylik"
 nd_alg.6.d: "The harvests of the Mitidja, the Chelif and the plains of Constantine now feed more than the Regency. Since 1793 the south of France and the armies of the Republic in Italy have eaten Algerian wheat, bought on credit. The trade runs through two Jewish houses of Livornese origin settled in Algiers, Bacri and Busnach, who advance the dey his money, hold the export licences, and carry the unpaid bills of Paris on their books. Their warehouses are full and their enemies are many. In 1805 a janissary shot Naphtali Busnach at the gate of the palace, and the mob sacked the Jewish quarter.\n\nThe ruler can leave the grain trade to the merchant houses, who know every port from Marseille to Livorno and take their share. Or he can take it into his own hands, sell from the beylik's silos through his own agents, and keep both the profit and the quarrel with Paris for himself."
 nd_alg.6.a: "Let the merchant houses carry the trade"
 nd_alg.6.a_tt: "Merchant power and export efficiency. The burghers are satisfied."
 nd_alg.6.b: "The beylik sells its own grain"
 nd_alg.6.b_tt: "Tax efficiency and crown power."
 nd_alg.7.t: "The Oath under the Elm"
 nd_alg.7.d: "On 27 November 1832, on the plain of Ghriss outside Mascara, the Hashim, the Banu Amir and the Gharaba gathered under a great elm and swore allegiance to a man of twenty-four. Abd al-Qadir, son of Muhyi al-Din of the Qadiri lodge at the Guetna, took the title Commander of the Faithful and refused that of sultan. Algiers had fallen to a French army two years before and Oran soon after, and the tribes of the west chose an emir to do what the dey's soldiers could not.\n\nHe meant to build what this land had never had: regular battalions in uniform, paid from a treasury and not from plunder, khalifas appointed over every province, and a mint, magazines and foundries in fortified towns out of reach of the coast. That work needs years. A treaty with the generals at Oran would buy them, at the price of naming the invader a neighbour. War without pause would keep every tribe in the saddle and leave no time to build."
 nd_alg.7.a: "Sign, and use the peace to build a state"
 nd_alg.7.a_tt: "Faster recruitment, faster construction and a more able cabinet."
 nd_alg.7.b: "No treaty with the invader: the tribes ride now"
 nd_alg.7.b_tt: "Army morale, manpower and faster marches."
 nd_alg_zughba_riders_pact: "Pact with the Zughba"
 nd_alg_zughba_riders_pact_desc: "The Banu Amir and the Suwayd, Arab tribes of the Zughba who came west with the Banu Hilal, hold the plains from Oran to the Sersou. The sultans of Tlemcen gave them pasture, stipends and the right to collect taxes in the ruler's name, and in return their horsemen rode in every Zayyanid army. They are the state's cavalry, and its creditors."
 nd_alg_abu_tashfin_builders: "Builders of Abu Tashfin"
 nd_alg_abu_tashfin_builders_desc: "Abu Tashfin I, who ruled Tlemcen from 1318 to 1337, was remembered as a builder. He raised the Tashfiniya madrasa, faced in carved stucco and glazed tile, and dug the Great Basin west of the city to water its gardens. The work was done by Andalusi masters and by thousands of captive craftsmen, whose skills stayed in the country after them."
 nd_alg_wax_wool_and_hides: "Wax, Wool and Hides"
 nd_alg_wax_wool_and_hides_desc: "What the Catalans, Genoese and Marseillais came to buy in the ports of the central Maghreb was the produce of its hills: beeswax, raw wool and tanned hides. So much wax left Bejaia that the French still call a candle a bougie. The trade passed through Honaine, Oran and Algiers under treaties that fixed the customs at a tenth."
 nd_alg_between_fez_and_tunis: "Between Fez and Tunis"
 nd_alg_between_fez_and_tunis_desc: "The middle kingdom of the Maghreb was the weakest of the three and outlived stronger neighbours by never facing them alone. Yaghmurasan and his heirs set Granada and Castile against the Marinids, Aragon against the Hafsids, and one Arab tribe against another, and kept agents at every court that might one day send an army."
 nd_alg_mirror_for_princes: "A Mirror for Princes"
 nd_alg_mirror_for_princes_desc: "Abu Hammu Musa II won back his fathers' throne in 1359 and held it, with interruptions, for thirty years. A poet and a man of letters, he wrote for his heir a manual of kingship, the Wasitat al-Suluk fi Siyasat al-Muluk: how to choose a vizier, how to read a face, how to keep an army paid and a court honest. His son deposed him all the same."
 nd_alg_muqaddimah: "The Muqaddimah"
 nd_alg_muqaddimah_desc: "Between 1375 and 1378 Ibn Khaldun lived at Qalat Ibn Salama, on the edge of the high plains, under the protection of the Awlad Arif. There he wrote the Introduction to his universal history: an account of how tribes bound by solidarity found dynasties, how cities soften them, and why no state lasts beyond a few generations. He drew his examples from the country around him."
 nd_alg_zawiya_network: "Lodges of the Marabouts"
 nd_alg_zawiya_network_desc: "As the power of the sultans shrank, holy men filled the space they left. A marabout settled in the hills, gathered students, fed travellers, and judged the quarrels of the tribes around him. After his death the lodge passed to his descendants with his tomb at its heart. By the fifteenth century the hill country was governed more by its zawiyas than by any court."
 nd_alg_besieged_city: "The City That Returns"
 nd_alg_besieged_city_desc: "The Marinids besieged Tlemcen for eight years, from 1299 to 1307, and built a second city, al-Mansura, beside it to house their army. They took it in 1337 and again in 1352. Each time the Zayyanids went into the desert, waited among the tribes, and came back. A realm that has been conquered so often learns to endure war and to rebuild after it."
 nd_alg_andalusi_new_towns: "New Towns of the Andalusians"
 nd_alg_andalusi_new_towns_desc: "The exiles of Granada, and after them the Moriscos, came to the central Maghreb in their tens of thousands. Khayr al-Din's ships carried many of them across. They founded Blida in 1535 under the saint Sidi Ahmad al-Kabir and Kolea in 1550, and they refilled the half-empty walls of Cherchell, Tenes and Dellys, bringing irrigation, orchards and the trades of the Spanish towns."
 nd_alg_penon_and_mole: "The Penon and the Mole"
 nd_alg_penon_and_mole_desc: "In 1510 the Spanish built a fort on the largest islet off Algiers, within cannon shot of the walls. Khayr al-Din took it in 1529 and had it demolished. With its stone, and two years of captive labour, he joined the islets to the shore by a causeway. The open roadstead became a closed harbour, and the city a naval power."
 nd_alg_levend_companies: "Companies of Levends"
 nd_alg_levend_companies_desc: "The brothers Aruj and Khayr al-Din came to the Maghreb with a following of their own: sea volunteers from Lesbos and the Anatolian coast, joined by Andalusi exiles with scores to settle. These levends served for a share of the prize, fought on deck and on the beach alike, and were the first army the new state possessed."
 nd_alg_gharnati_nuba: "The Nuba of Granada"
 nd_alg_gharnati_nuba_desc: "The exiles brought their music with them. The nuba, a suite of songs in a fixed order of rhythms, had been the court music of al-Andalus. It survived in the houses of the refugees as the sanaa of Algiers and the gharnati of Tlemcen, taught by ear from master to pupil, and it became the classical music of the country."
 nd_alg_al_mahrusa: "Al-Mahrusa"
 nd_alg_al_mahrusa_desc: "After the emperor's fleet was wrecked before the walls in 1541 the city took the name al-Mahrusa, the Well-Guarded. In 1545 Hasan Pasha built a fort on the hill where Charles V had pitched his tent, and later rulers ringed the bay with batteries. French, Spanish, Danish and English squadrons bombarded Algiers in the centuries that followed. None of them took it from the sea."
 nd_alg_baba_merzoug: "Baba Merzoug"
 nd_alg_baba_merzoug_desc: "In 1542 a Venetian founder at Algiers cast a bronze cannon seven metres long for Hasan Agha. The gunners called it Baba Merzoug, Father Fortunate, and it threw a ball nearly five kilometres across the bay. The foundry that made it armed the forts, the fleet and the columns sent into the interior."
 nd_alg_three_beyliks: "The Three Beyliks"
 nd_alg_three_beyliks_desc: "The country beyond the plain of Algiers was divided among three beys: Titteri at Medea from 1548, the West at Mazouna from 1563, and the East at Constantine from 1567. Each governed behind his own mountains with a small garrison and the horsemen of the allied tribes. From time to time he came to Algiers in person, bringing the tribute of his province with him."
 nd_alg_round_ships: "Round Ships"
 nd_alg_round_ships_desc: "Around 1606 the Dutch renegade Simon Danseker showed the captains of Algiers how to build and handle the round ship of the northern seas, which needs no rowers and can keep the ocean in winter. Within a generation the corsairs had passed the Straits. Murad Rais raided Iceland in 1627 and carried off the village of Baltimore in Ireland in 1631."
 nd_alg_bagnios_and_redemption: "Bagnios and Redemption"
 nd_alg_bagnios_and_redemption_desc: "The captives of the state were locked at night in the bagnios: walled yards with tiers of sleeping cells, a chapel, and taverns kept by the captives themselves. By day they rowed, quarried and hauled stone for the mole. The Trinitarian and Mercedarian fathers came with alms collected across Europe to buy them back, and the ransom trade became a fixed part of the city's income."
 nd_alg_usta_musa_aqueducts: "Andalusi Aqueducts"
 nd_alg_usta_musa_aqueducts_desc: "The city on its steep hill had always been short of water. Its rulers brought the springs of the Telemly, Birtraria, the Hamma and Ain Zeboudja to Algiers along stone channels and through lead pipes, and the work was done by Andalusi builders. The best remembered of the Andalusi masters of the city is Usta Musa, who with his sons Ali and Ibrahim raised several of its civil, religious and defensive works. By the eighteenth century more than a hundred public fountains ran in the lanes of the upper and lower town."
 nd_alg_mahalla: "The Mahalla"
 nd_alg_mahalla_desc: "Twice a year, in spring and autumn, a column of janissaries left each provincial capital with the horsemen of the allied tribes to collect the taxes. This was the mahalla. It camped among the tribes until they paid, in grain, livestock or coin, and punished those who did not. The army paid for itself, and the country was reminded each season who ruled it."
 nd_alg_zwawa_companies: "Companies of the Zwawa"
 nd_alg_zwawa_companies_desc: "The Zwawa, the Kabyles of the Jurjura, paid no tax to Algiers and sold it their sons instead. They hired out by the season as infantry to the deys and the beys, served in the columns and the garrisons, and went home to their villages with their pay. When the French took Algiers they enrolled the same men and kept the name: zouaves."
 nd_alg_barraniya_corporations: "Corporations of the Barraniya"
 nd_alg_barraniya_corporations_desc: "The barraniya were the outsiders who came to work in Algiers, and each people had its trade and its own chief. The Mozabites, Ibadis from the desert, kept the baths, the butchers' stalls and the mills almost as a monopoly. Men of Biskra were porters and water carriers, Kabyles were labourers and gardeners, and men of Laghouat sold oil. An amin answered to the city for each."
 nd_alg_beylik_estates: "Estates of the Beylik"
 nd_alg_beylik_estates_desc: "The best land of the Mitidja and the Chelif valley belonged to the state. It was divided into farms called haouch, worked by sharecroppers known as khammes, who kept a fifth of the harvest. The rest went to the beylik's silos, to feed the garrison, the fleet and the city, and in good years the ports of southern Europe."
 nd_alg_captive_shipwrights: "Captive Shipwrights"
 nd_alg_captive_shipwrights_desc: "A captive who could build a ship was never sold back. Carpenters, caulkers, ropemakers and sailmakers taken at sea were put to work in the arsenal under their own foremen, with a wine ration and a wage to keep them at it. Much of the fleet that took them had been built by men like them."
 nd_alg_wheat_for_marseille: "Wheat for Marseille"
 nd_alg_wheat_for_marseille_desc: "In the last decades of the eighteenth century the Regency turned from prizes to grain. Wheat from the beylik's estates and from the tribes' tithes was sold to Marseille, Livorno and Gibraltar, and from 1793 it fed the south of France and the armies of the Republic. The debts left unpaid by Paris were still being argued over when a dey struck the French consul with his fly whisk in 1827."
 nd_alg_rais_hamidou: "Rais Hamidou"
 nd_alg_rais_hamidou_desc: "Hamidou ibn Ali was born in Algiers, the son of a tailor, and went to sea as a boy. He rose to command the Regency's fleet, a native of the city in a service long led by Turks and renegades. In 1802 he took a Portuguese frigate of forty-four guns by boarding and added her to his squadron. He died on his own quarterdeck in 1815, fighting an American squadron off Cape Gata."
 nd_alg_askar_muhammadi: "The Muhammadan Army"
 nd_alg_askar_muhammadi_desc: "The Emir Abd al-Qadir raised the first regular army the country had known. His foot, the askar, wore a uniform, drew pay and rations, and drilled to the commands of deserters from European armies. They were enrolled from every tribe alike and commanded by officers the Emir appointed, with ranks, regulations and a written code of discipline."
 nd_alg_tagdempt: "Tagdempt"
 nd_alg_tagdempt_desc: "In 1836 the Emir rebuilt the ruined town of Tagdempt on the high plains, the old Tahert of the Rustamids, and made it his capital. Behind the mountains, a week's march from the sea, he placed his mint, his magazines and his workshops. Boghar, Taza, Saida and Sebdou made a line of such strongholds along the edge of the Tell, beyond the reach of any fleet."
 nd_alg_muhammadiyya_foundry: "The Emir's Foundries"
 nd_alg_muhammadiyya_foundry_desc: "At Tagdempt and Miliana the Emir set up foundries and powder mills, worked by local smiths and by European craftsmen hired or captured. They cast cannon, repaired muskets and made powder from the saltpetre of the country. The mint at Tagdempt struck a coinage of his own, the muhammadiyya, in silver and copper."
 nd_alg_smala: "The Smala"
 nd_alg_smala_desc: "When the fortified towns fell, the Emir's capital took to the road. The Smala was a city of tents holding some thirty thousand people: his family, his treasury, his library, his workshops and the households of his men. It pitched in four concentric circles, each tribe in its appointed place, and could strike camp and vanish into the steppe in a morning."
 a_nd_alg_zughba_riders: "Zughba Riders"
 a_nd_alg_zughba_riders_desc: "Arab horsemen of the Banu Amir and the Suwayd on Barb mounts, serving the ruler for pasture and pay. They scout, raid and pursue across open country faster than any heavier horse, and they do not stand to be charged."
 a_nd_alg_levends: "Levends"
 a_nd_alg_levends_desc: "Sea volunteers who fight for a share of the prize. They board ships, land on hostile beaches and storm coastal towns with arquebus and blade, and they wear no armour that would drown them."
 a_nd_alg_tobjiya: "Tobjiya"
 a_nd_alg_tobjiya_desc: "The gunners of Algiers, serving great bronze pieces cast in the city's own foundry. Their guns are long, heavy and slow to move, and they batter walls and ships at ranges no lighter cannon can match."
 n_nd_alg_bertone: "Bertone"
 n_nd_alg_bertone_desc: "The round ship of the Atlantic raids: a square-rigged sailing vessel, lightly built for the chase and crowded with fighting men for the boarding. It needs no rowers and keeps the sea in winter."
 n_nd_alg_rais_frigate: "Rais's Frigate"
 n_nd_alg_rais_frigate_desc: "A frigate of forty-four guns of the kind Rais Hamidou commanded, built in the arsenal of Algiers or taken from an enemy. Heavily armed for its class and manned with a large crew for boarding."
 a_nd_alg_zwawa_foot: "Zwawa Foot"
 a_nd_alg_zwawa_foot_desc: "Kabyle infantry from the villages of the Jurjura, serving for pay. Sure-footed, good shots, and at their best in broken hill country, where they have fought all their lives."
 a_nd_alg_askar_muhammadi: "Askar Muhammadi"
 a_nd_alg_askar_muhammadi_desc: "The regular infantry of the Emir: uniformed, paid and drilled in the European manner, and held to a written code. They stand in line and keep their fire when tribal levies would scatter."
 levy_nd_alg_zwawa_foot: "Zwawa Foot Levy"
 levy_nd_alg_zwawa_foot_desc: "Hill villagers hired by the season as infantry, in the manner of the Zwawa of the Jurjura."
 levy_nd_alg_askar_muhammadi: "Askar Muhammadi Levy"
 levy_nd_alg_askar_muhammadi_desc: "Regular battalions enrolled from every tribe and town alike, in place of the old tribal contingents."
 nd_alg_zawiya: "Zawiya"
 nd_alg_zawiya_desc: "The lodge of a marabout and his descendants: a Quranic school, a guest house, a store of alms and a court of arbitration around the founder's tomb. It teaches the children of the hill tribes and settles their feuds, and it pays no tax and takes no orders."
 nd_alg_khayr_al_din_mole: "Mole of Khayr al-Din"
 nd_alg_khayr_al_din_mole_desc: "A stone causeway joining offshore rocks to the land, in the manner of the mole Khayr al-Din built at Algiers from the ruins of the Spanish fort. Behind it ships lie sheltered from the north wind, and cargo passes easily between sea and shore."
 nd_alg_bordj: "Bordj"
 nd_alg_bordj_desc: "A gun fort on the heights above a harbour, like the Bordj Moulay Hassan raised in 1545 on the hill where Charles V had camped. Its cannon cover the beaches, and an army that tries to land beneath it will be a long time getting ashore."
 nd_alg_bagnio: "Bagnio"
 nd_alg_bagnio_desc: "A walled prison yard where the captives of the state are locked at night. Each morning they are marched out in gangs to quarry and dress stone for the harbour works and the fortifications."
 nd_alg_andalusi_aqueduct: "Andalusi Aqueduct"
 nd_alg_andalusi_aqueduct_desc: "Stone channels and lead pipes that carry the hill springs into a walled city and feed its public fountains, built on the model of the aqueducts that Andalusi builders raised at Algiers."
 nd_alg_haouch: "Haouch"
 nd_alg_haouch_desc: "A grain farm of the state's own domain, let to sharecroppers who keep a fifth of the crop and deliver the rest to the ruler's silos."
 nd_alg_tagdempt_arsenal: "Tagdempt Arsenal"
 nd_alg_tagdempt_arsenal_desc: "Musket workshops, powder mills and a foundry inside the walls of an inland stronghold, on the model of the Emir Abd al-Qadir's arsenal at Tagdempt. It stands far from the coast by design: what a fleet cannot reach, a fleet cannot burn."
 nd_alg_zawiya_upkeep: "Lodge Upkeep"
 nd_alg_zawiya_upkeep_desc: "Wheat and meat for the guests and the students, wax for the lamps of the tomb, and paper for the school."
 nd_alg_mole_upkeep: "Mole Upkeep"
 nd_alg_mole_upkeep_desc: "Stone to replace what each winter's storms carry away, with timber, tar and tools for the quays."
 nd_alg_bordj_upkeep: "Bordj Upkeep"
 nd_alg_bordj_upkeep_desc: "Guns and small arms for the garrison, stone for the walls and tools for the gun carriages."
 nd_alg_bagnio_quarry_gangs: "Quarry Gangs"
 nd_alg_bagnio_quarry_gangs_desc: "Captives quarry rough stone and dress it into blocks for the mole, the walls and the forts."
 nd_alg_bagnio_arsenal_gangs: "Arsenal Gangs"
 nd_alg_bagnio_arsenal_gangs_desc: "Skilled captives work in the arsenal, turning timber, hemp and tar into masts, spars, cordage and sails."
 nd_alg_aqueduct_upkeep: "Aqueduct Upkeep"
 nd_alg_aqueduct_upkeep_desc: "Masonry for the channels, lead for the pipes, and tools for the keepers of the fountains."
 nd_alg_haouch_upkeep: "Estate Upkeep"
 nd_alg_haouch_upkeep_desc: "Ploughs and tools, draught oxen, and timber for the farm buildings and the silos."
 nd_alg_tagdempt_musket_workshops: "Musket Workshops"
 nd_alg_tagdempt_musket_workshops_desc: "Smiths forge barrels and locks from bar iron over charcoal and coal, and stock the finished muskets in walnut."
 nd_alg_tagdempt_cannon_casting: "Cannon Casting"
 nd_alg_tagdempt_cannon_casting_desc: "The foundry casts field guns in bronze from copper and tin."
 nd_alg_formed_tt: "Formed #bold Algiers#!"
 nd_alg_path_a_tt: "Chose the #bold Well-Guarded City#! destiny"
 nd_alg_path_b_tt: "Chose the #bold Emir of the Tell#! destiny"
 # ===== DESTINY =====
 nd_alg_dest_algiers_34_tt: "We own #bold Algiers#! and it has at least 34 development"
 nd_alg_dest_algiers_54_tt: "We own #bold Algiers#! and it has at least 54 development"
 nd_alg_dest_tahert_23_tt: "We own #bold Tahert#! and it has at least 23 development"
 nd_alg_dest_khalifa_seat_limit_tt: "We have fewer than 8 Khalifa's Seats built or under construction"
 nd_alg_destiny: "The Middle Land"
 nd_alg_destiny_desc: "The country between the Moulouya and the lands of Tunis has been a kingdom, a province and a battlefield by turns, and whoever holds it must decide what it is for. A realm that faces the sea lives from its harbour, its captains and the fear of its name. A realm that faces inland lives from the tribes, the lodges and the horsemen of the high plains. That choice was made when Algiers was proclaimed. What follows from it has to be earned.\n\nKeep the realm at 75 stability."
 nd_alg_dest_brothers_harbours: "Harbours of the Brothers"
 nd_alg_dest_brothers_harbours_desc: "In 1514 Aruj Barbarossa and his brothers drove a Genoese garrison out of Jijel with the help of the Kabyles of the hills, and made the little coral port their base. Two years later the townsmen of Algiers called them in against the Spanish fort in their bay. The forests behind Jijel gave the brothers timber for their galiots, and Algiers gave them a town to build on.\n\nOwn Jijel, raise Algiers to 34 development, and hold 1,000 gold."
 nd_alg_dest_fleet_of_the_rais: "The Fleet of the Rais"
 nd_alg_dest_fleet_of_the_rais_desc: "In 1555 Salah Rais took Bejaia from the Spanish, and with it the Kabyle coast whose forests supplied the arsenal. The captains of Algiers formed a corporation of their own, the taifa of the rais, which owned the ships, shared the prizes and bent to no ruler for long. Father Pierre Dan counted some seventy sailing ships in the harbour in 1634. Spanish silver, taken at sea or paid in ransom, was the common coin of the city.\n\nOwn Bejaia, keep a navy of 40 ships, have silver produced or traded in one of our markets, and hold 2,000 gold."
 nd_alg_dest_tribute_of_kings: "Tribute of the Kings"
 nd_alg_dest_tribute_of_kings_desc: "By the eighteenth century the lesser sea powers of Europe found it cheaper to pay Algiers than to fight it. Denmark, Sweden, Holland and Venice, and later the United States, bought peace with yearly presents of masts, cordage, powder, cannon and coin, delivered by their consuls. In 1756 the army of Algiers took Tunis and set its beys to paying a yearly tribute. The harbour town of the Banu Mazghanna had become one of the great cities of the Mediterranean.\n\nOwn Tunis, keep a navy of 60 ships, raise Algiers to 54 development, and hold 3,000 gold. Unlocks the Badestan."
 nd_alg_dest_gates_of_the_desert: "Gates of the Desert"
 nd_alg_dest_gates_of_the_desert_desc: "Biskra, chief town of the oases of the Ziban, and Msila in the Hodna stand where the high plains fall away to the Sahara. Whoever holds them commands the winter pastures of the Arab tribes, and so the tribes themselves. Ibn Khaldun lived for years at Biskra under the Banu Muzni and raised the Dawawida horsemen there for the sultan of Tlemcen. In 1838 the Emir Abd al-Qadir sent a khalifa to the Ziban for the same reason.\n\nOwn Biskra and Msila, and keep a strong army under arms (army size 30)."
 nd_alg_dest_iron_gates: "The Iron Gates"
 nd_alg_dest_iron_gates_desc: "The road from Algiers to Constantine runs through the Biban, the Iron Gates, a defile so narrow in places that a loaded mule can barely pass. In the mountains above it stood the Kalaa of the Ait Abbas, whose lords took toll from every column that went through, and beyond it lay the plain of Setif. In October 1839 a French army marched through the gates, and the Emir Abd al-Qadir went to war over it. Behind these ranges, at Tagdempt on the site of old Tahert, he had built a capital of his own where no fleet could reach it.\n\nOwn the Kalaa of Ait Abbas and Setif, raise Tahert to 23 development, and keep a great army under arms (army size 50)."
 nd_alg_dest_commander_of_the_faithful: "Commander of the Faithful"
 nd_alg_dest_commander_of_the_faithful_desc: "Constantine on its rock was the seat of the eastern beylik, and held out under Ahmad Bey for seven years after Algiers fell. Touggourt and Ouargla, the oasis towns of the northern Sahara, had paid tribute to the north since Salah Rais marched a column to them in 1552. A ruler who holds all three is obeyed from the Moulouya to the Tunisian marches and from the Tell to the desert, and may take the title the tribes of the west gave Abd al-Qadir.\n\nOwn Constantine, Touggourt and Ouargla, reach 75 prestige, and keep a great host under arms (army size 75). Unlocks the Khalifa's Seat."
 nd_alg.8.t: "Two Faces of One Country"
 nd_alg.8.d: "The central Maghreb has always looked two ways. From the terraces of Algiers a man sees only water: the bay, the mole, the sails of the captains coming home with prizes in tow. From the walls of Tlemcen or the ridge above Mascara he sees only land: wheat plains, cork forest, and beyond the last range the pale steppe where the tribes move with their flocks.\n\nNo ruler has held both for long. The city of the captains kept the coast and left the tribes to their shaykhs, visiting them twice a year with an armed column to collect what it could. The emirs of the interior commanded the horsemen and the lodges, and watched the ports fall to whoever came by sea. The realm has chosen which face it shows the world. What remains is to make that choice into a state."
 nd_alg.8.a: "Then let us build it"
 nd_alg.8.a_tt: "The road chosen at formation is open in the Traditions tab."
 nd_alg.9.t: "The Brothers at Jijel"
 nd_alg.9.d: "Jijel is a small place: a rocky point, a cove, coral boats drawn up on the shingle, and behind it hills thick with oak and pine. When Aruj took it from the Genoese in 1514 he shared the corn and goods from his prizes with the hill people, and they made him their lord. From that cove he tried again for Bejaia, where a Spanish ball had already cost him an arm. From it he sailed for Algiers.\n\nNow the cove is ours, and the timber of the hills comes down to our yards. Algiers itself is filling with Andalusi exiles, Kabyle labourers and renegades of every nation, all building upward on the slope below the citadel. The harbour that once sheltered a dozen fishing boats holds a squadron."
 nd_alg.9.a: "The sea provides for those who dare it"
 nd_alg.9.a_tt: "Next on this road: Bejaia, a fleet of 40 ships and silver in our markets."
 nd_alg.10.t: "Seventy Sail"
 nd_alg.10.d: "Bejaia's garrison has marched out, and the Kabyle forests that feed the arsenal are ours from end to end. The harbour of Algiers is crowded gunwale to gunwale with galiots and brigantines, and more each year of the tall round ships that can keep the ocean in winter. The men who command them are a nation of their own. Turks, Albanians, Corsicans, Calabrians, Flemings and Englishmen who have taken the turban sit together in the corporation of the captains, and their prizes pay for the mosques, the fountains and the soldiers' bread.\n\nA fleet of this size can be used in two ways. Left to themselves, the captains will fit out their own ships, choose their own cruises and bring home whatever sells, and every shore in Christendom will learn to fear them. Kept together under the ruler's flag, the same ships are a battle fleet that can stand in line beside any squadron in the Mediterranean."
 nd_alg.10.a: "Let every captain choose his own cruise"
 nd_alg.10.a_tt: "Faster fleets and cheaper privateers. Other countries resent us more."
 nd_alg.10.b: "The fleet sails as one, under our flag"
 nd_alg.10.b_tt: "More naval damage, cheaper ship repairs and more navy tradition from battles."
 nd_alg.11.t: "The Presents of the Consuls"
 nd_alg.11.d: "Every spring the consuls come up the hill to the palace with their presents. The Dane brings masts and cordage, the Swede powder and cannon, the Hollander cables and sailcloth, and each brings a purse besides. In return their merchantmen carry a pass that our captains honour. Tunis sends its yearly tribute, and with it a cargo of oil for the lamps of the mosques of Algiers. The powers that do not pay lose their ships, and in time they pay too.\n\nThe council is divided over what to do with so much peace. Some hold that Algiers should sell a pass to every flag that can afford one, and live from presents and the customs house. Others answer that the cruise is the city's trade. If there is peace with all the Christians at once, the captains will have nothing to hunt and the soldiers nothing to share, so one treaty must always be allowed to lapse."
 nd_alg.11.a: "Sell peace to every flag that can pay for it"
 nd_alg.11.a_tt: "Trade income, cheaper light ships and cheaper imports."
 nd_alg.11.b: "Algiers is never at peace with everyone"
 nd_alg.11.b_tt: "Harder peace terms and ships that take less damage. Fewer diplomatic relations."
 nd_alg.12.t: "The Queen of the Ziban"
 nd_alg.12.d: "Biskra lies where the last ridge of the Aures drops to the desert: a forest of date palms, a mud-walled town, and the tomb of Sidi Uqba a morning's ride to the south-east. Every autumn the Arab tribes of the high plains come down through the gap at El Kantara to winter among the oases, and every spring they go back up to the wheat country of the Hodna and the Tell. Their road is ours now, at both ends.\n\nA tribe that must pass our gates twice a year to feed its flocks can be counted, taxed and summoned to war. The sultans of Tlemcen knew it, and sent Ibn Khaldun himself to Biskra to win those tribes over. The shaykhs have come in to make their submission, and to ask who will be set over them."
 nd_alg.12.a: "Set a khalifa over the Ziban"
 nd_alg.12.a_tt: "Next on this road: the Kalaa of Ait Abbas, Setif and a greater Tahert."
 nd_alg.13.t: "Men of the Book, Men of the Sword"
 nd_alg.13.d: "The Iron Gates are open to us, and the Kalaa above them flies our flag. From the plain of Setif to the high plains the country is ours to order, and at Tagdempt, on the ruins of old Tahert, a capital is rising where no fleet will ever find it: a mint, storehouses, workshops and a library.\n\nTwo kinds of great family lead the tribes here. The lords of the sword, the jawad, claim descent from the Arab conquerors and have always commanded the horsemen. Such are the Mokrani of the Medjana, who took toll at the Gates from the Turks themselves. The men of the book, the marabouts, descend from saints, keep the lodges and settle quarrels, and the people trust them more than any governor. Each province needs a khalifa to rule it in our name, and each kind of family expects the office."
 nd_alg.13.a: "Name khalifas from the houses of the marabouts"
 nd_alg.13.a_tt: "Proximity spreads faster and literacy grows. The nobles are slighted."
 nd_alg.13.b: "Confirm the lords of the sword in their commands"
 nd_alg.13.b_tt: "Faster levy musters, cheaper light cavalry and faster levy recovery."
 nd_alg.14.t: "The Oath of All the Tribes"
 nd_alg.14.d: "Constantine has opened its gates, and the sultans of Touggourt and Ouargla have sent horses and dates in sign of submission. From the Moulouya to the Medjerda and from the sea cliffs to the palm groves there is no tribe that has not sworn. The shaykhs have gathered to offer the ruler the title of Commander of the Faithful.\n\nA title is not yet a state. One party in the council wants to finish the work within: every tribe to pay the same tithe on its harvest and its herds, no clan exempt for old service, and the proceeds to fill the storehouses of the khalifas and pay the regular battalions. The other party looks to the coast, where port towns still trade with whom they please. Forbid the tribes to sell them grain, cattle or horses, they say, and close every road to the sea until those towns obey."
 nd_alg.14.a: "One law and one tithe for every tribe"
 nd_alg.14.a_tt: "More food, satisfied peasants and cheaper reinforcement."
 nd_alg.14.b: "Close the roads until the ports obey"
 nd_alg.14.b_tt: "Attrition for invaders and faster sieges. Less merchant power from the sea."
 STATIC_MODIFIER_NAME_nd_alg_dest_free_cruising: "Free Cruising"
 STATIC_MODIFIER_DESC_nd_alg_dest_free_cruising: "The captains fit out their own ships and hunt where they please. Their sails are seen from the Canaries to the Adriatic, and no coast of Christendom forgives it."
 STATIC_MODIFIER_NAME_nd_alg_dest_rulers_squadron: "The Ruler's Squadron"
 STATIC_MODIFIER_DESC_nd_alg_dest_rulers_squadron: "The fleet sails together under one flag and one admiral. It fights in line, wins a name in battle, and is refitted in the state's own arsenal."
 STATIC_MODIFIER_NAME_nd_alg_dest_passes_and_presents: "Passes and Presents"
 STATIC_MODIFIER_DESC_nd_alg_dest_passes_and_presents: "Every flag that pays may sail in peace. The consuls deliver their presents in masts, cordage, powder and coin, and the customs house has never been busier."
 STATIC_MODIFIER_NAME_nd_alg_dest_never_at_peace: "Never at Peace with All"
 STATIC_MODIFIER_DESC_nd_alg_dest_never_at_peace: "One treaty is always allowed to lapse, so the captains always have a flag to hunt. The crews are hardened by a war that never ends, and the terms we dictate are hard. Fewer courts care to keep an envoy here."
 STATIC_MODIFIER_NAME_nd_alg_dest_khalifas_of_the_book: "Khalifas of the Book"
 STATIC_MODIFIER_DESC_nd_alg_dest_khalifas_of_the_book: "The provinces are governed by men of the saintly houses. The lodges carry the ruler's word into every tribe and teach its children. The old warrior nobility has been passed over, and does not forget it."
 STATIC_MODIFIER_NAME_nd_alg_dest_lords_of_the_sword: "Lords of the Sword"
 STATIC_MODIFIER_DESC_nd_alg_dest_lords_of_the_sword: "The great families of the sword keep their commands. When the ruler calls, their horsemen are in the saddle within days, mounted and armed at their own cost."
 STATIC_MODIFIER_NAME_nd_alg_dest_one_tithe_for_all: "One Tithe for All"
 STATIC_MODIFIER_DESC_nd_alg_dest_one_tithe_for_all: "Every tribe pays the tithe on its harvest and its herds, and none is exempt. The storehouses of the khalifas are full, the cultivators know what they owe, and the regular battalions are fed and brought up to strength on time."
 STATIC_MODIFIER_NAME_nd_alg_dest_closed_roads: "The Closed Roads"
 STATIC_MODIFIER_DESC_nd_alg_dest_closed_roads: "No grain, cattle or horses go down to the towns that will not obey. Horsemen watch every track to the sea, and an enemy who marches inland finds the country emptied before him. The harbours stand idle."
 nd_alg_dest_badestan: "Badestan"
 nd_alg_dest_badestan_desc: "The closed market street of the lower town where everything the captains bring in is sold: cargoes, ships' stores and captives. The ruler's share is set aside before the first bid, and merchants of every nation, the consuls among them, come to buy back what their countrymen lost at sea."
 nd_alg_dest_badestan_upkeep: "Badestan Upkeep"
 nd_alg_dest_badestan_upkeep_desc: "Paper for the clerks who register each prize, cloth for the awnings, and timber and tools for the stalls and the weighing house."
 nd_alg_dest_khalifa_seat: "Khalifa's Seat"
 nd_alg_dest_khalifa_seat_desc: "The residence of a khalifa in an inland town, with its guard of regulars, its judge, its secretaries and its storehouse for the tithe. The Emir Abd al-Qadir divided his state among eight such governors, most of them chosen from the families of the marabouts, and set each of them well back from the coast."
 nd_alg_dest_khalifa_seat_upkeep: "Seat Upkeep"
 nd_alg_dest_khalifa_seat_upkeep_desc: "Paper for the registers, arms for the guard, horses for the couriers and tools for the storehouse."

 # ===== BUREAUCRACIES =====
 alg_diwan_of_the_ojaq_bureaucracy: "Divan of the Ojaq"
 alg_diwan_of_the_ojaq_bureaucracy_desc: "The council of the Janissary corps of Algiers: some sixty senior officers under the Agha of the Two Moons, who presided for two lunar months and then left the corps for good. Every soldier rose by years of service alone, about one rank in three years, and the pay was counted out in the president's presence. In 1659 the Divan took the government from the pasha and from 1689 it chose the dey. About half the deys it raised were killed in office, until Ali Khodja broke the corps in 1817."
 alg_dannush_bureaucracy: "Dannush of the Beys"
 alg_dannush_bureaucracy_desc: "The tribute of the three provinces, carried to Algiers under escort. Twice a year the lieutenant of each bey, of Constantine, of Titteri and of the West, came with the coin, grain, horses and mules his province owed, and from time to time the bey came himself. Gifts of a fixed size went to every officer of the state from the dey down. A bey who came late or came short was deposed, and some paid with their lives."
 alg_makhzen_tribes_bureaucracy: "Makhzen Tribes"
 alg_makhzen_tribes_bureaucracy_desc: "Tribes settled on the land of the state that paid no tax beyond the tithe of the Quran. In return they rode to war, escorted the tax columns and collected from the subject tribes, the rayah. The Douair and the Zmala of the plain of Oran were the best known. By 1800 the Janissaries numbered some four thousand, and the makhzen could put thirty thousand horsemen in the field. The Emir Abd al-Qadir abolished the distinction, and in 1835 the Douair and the Zmala went over to the French."
 alg_wakil_al_kharj_bureaucracy: "Wakil al-Kharj of the Marine"
 alg_wakil_al_kharj_bureaucracy_desc: "The steward of the harbour of Algiers, one of the five great officers of the dey. He kept the arsenal and its stores and ran the port, his clerks registered every prize and set aside the share of the state before the sale, and the consuls dealt with him. The masts, cordage, powder and guns that Denmark, Sweden and Holland sent each year as the price of peace went into his storehouses."

 AUTO_MODIFIER_NAME_nd_alg_bureaucracy_authority: "Powers of the Regency"
 AUTO_MODIFIER_DESC_nd_alg_bureaucracy_authority: "The great offices of Algiers were called the powers. The country may hold bureaucracies, with one slot beside the one its capital gives."
