l_spanish:
 STATIC_MODIFIER_NAME_nd_por_alem_mar_em_africa: "Beyond the Sea in Africa"
 STATIC_MODIFIER_DESC_nd_por_alem_mar_em_africa: "The Reconquista did not end at Faro. The great houses and the military orders cross the strait with papal bulls in their baggage, and the towns that used to trade with Morocco pay for the fleet that carries them."
 STATIC_MODIFIER_NAME_nd_por_mar_oceano: "The Ocean Sea"
 STATIC_MODIFIER_DESC_nd_por_mar_oceano: "The crown is the first shipowner of the realm and the merchants of Lisbon and Porto are its partners. Yards are busy and crews are easy to find. The great houses wanted lordships in Morocco and were given customs ledgers."
 STATIC_MODIFIER_NAME_nd_por_casa_dos_vinte_e_quatro: "The House of Twenty-Four"
 STATIC_MODIFIER_DESC_nd_por_casa_dos_vinte_e_quatro: "Two men from each of the twelve crafts of Lisbon sit in the city's council, and the king's chancery is run by doctors of law. The dynasty remembers who made it, and the old houses remember too."
 STATIC_MODIFIER_NAME_nd_por_nova_nobreza: "The New Nobility"
 STATIC_MODIFIER_DESC_nd_por_nova_nobreza: "The captains of Aljubarrota hold the lands of the houses that followed Castile. They owe the dynasty everything and will fight for it. What they hold, the crown no longer does."
 STATIC_MODIFIER_NAME_nd_por_o_encoberto: "The Hidden One"
 STATIC_MODIFIER_DESC_nd_por_o_encoberto: "The king did not die in Africa. He waits on an island in the mist and will come home on a morning of fog. A people that believes this cannot be governed by strangers, and does not care to be taught anything new."
 STATIC_MODIFIER_NAME_nd_por_desengano: "The Disenchantment"
 STATIC_MODIFIER_DESC_nd_por_desengano: "The king is dead and the ransom of his captains has emptied the kingdom. The men who must pay it have stopped waiting for miracles and started keeping accounts. Nobody sings about them."
 STATIC_MODIFIER_NAME_nd_por_baixa_pombalina: "The Lower Town Rebuilt"
 STATIC_MODIFIER_DESC_nd_por_baixa_pombalina: "Straight streets, one pattern of house front, a timber cage in every wall. The merchants who paid the rebuilding tax own the new city. The families whose palaces stood in the way were not asked."
 STATIC_MODIFIER_NAME_nd_por_real_barraca: "The Royal Tent"
 STATIC_MODIFIER_DESC_nd_por_real_barraca: "The court lives in a palace of wood and canvas on the hill of Ajuda, where nothing can fall on the king. It is cheap and quiet and the ministers are always at hand. Below it the city waits among its ruins."
 nd_por.1.t: "The Kingdom at the Edge of the Sea"
 nd_por.1.d: "Portugal is finished, in the sense that a house is finished. The last Moorish town of the Algarve fell in 1249. The border with Castile was drawn at Alcanices in 1297 and nobody has moved it since. There is no frontier left at home on which a younger son can win a lordship, and every great house in the kingdom has younger sons.\n\nThere are two opinions at court about where they should go. One says the war was never about the Algarve: it was about the Moor, and the Moor is still there, a day's sail south, in Ceuta and Tangier and Fez. Carry the cross over the strait, give the orders and the nobility their proper work, and let Rome bless and pay for it.\n\nThe other opinion is held by men who own ships. They say Morocco is a wall to break lances on, and that the kingdom's real border is the one nobody has drawn: the sea to the west and south, with its fish, its islands and whatever lies beyond Cape Bojador. They want the king's timber, the king's favour, and the nobility kept out of the way.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_por.1.d.restored: "The crown of Afonso Henriques is worn again. From the Minho to the Mondego the towns have opened their gates to a king of Portugal, the charters of the concelhos are confirmed in his name, and the five shields are back on the banner. The kingdom is old enough to remember what it was. It must now decide what it is for.\n\nThere are two opinions at court. One says Portugal was made by the war against the Moor and has no other trade: the Moor is still there, a day's sail south, in Ceuta and Tangier and Fez. Carry the cross over the strait, give the orders and the nobility their proper work, and let Rome bless and pay for it.\n\nThe other opinion is held by men who own ships. They say Morocco is a wall to break lances on, and that the kingdom's real border is the one nobody has drawn: the sea to the west and south, with its fish, its islands and whatever lies beyond Cape Bojador. They want the king's timber, the king's favour, and the nobility kept out of the way.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_por.1.a: "The war is not over. It has only crossed the strait."
 nd_por.1.b: "Our frontier is the Ocean Sea. Build ships."
 nd_por.1.a_tt: "Sieges, crusading bulls and a contented nobility. The towns pay for it and resent it."
 nd_por.1.b_tt: "Ships, crews and merchants in partnership with the crown. The great houses are sidelined."
 nd_por_formed_tt: "Portugal has been formed"
 nd_por_path_a_tt: "Chose the #bold Crusade Beyond the Sea#! destiny"
 nd_por_path_b_tt: "Chose the #bold Ocean Sea#! destiny"
 nd_por.2.t: "The Cortes of Coimbra"
 nd_por.2.d: "Coimbra, the spring of 1385. King Fernando is two years dead. His daughter is married to the King of Castile, whose army has already besieged Lisbon once and is coming again. The estates of the realm have gathered to decide who is king, which is not a question estates are supposed to be asked.\n\nDoctor João das Regras, trained at Bologna, speaks for days. He takes the claimants one at a time: the Queen of Castile, born of a marriage that was no marriage; the sons of Inês de Castro, bastards who bore arms against their country. When he has finished there is nobody left, and the throne is vacant, and a vacant throne is the estates' to fill. On the sixth of April they acclaim João, Master of Avis, a bastard himself.\n\nFour months later the Constable Nuno Álvares Pereira makes the lawyer's argument good on the field of Aljubarrota. The new king owes his crown to a lawyer and the towns, and his life to a soldier and his captains. Both will expect to be remembered."
 nd_por.2.a: "The towns made this king. Let the crafts sit in council."
 nd_por.2.b: "The sword kept this king. Reward the Constable's men."
 nd_por.2.a_tt: "Lawyers and craftsmen serve the crown: better taxes and laws, and resentful nobles."
 nd_por.2.b_tt: "A loyal fighting nobility, endowed with land the crown gives away."
 nd_por.3.t: "The Desired One"
 nd_por.3.d: "On the fourth of August 1578 King Sebastian, twenty-four years old and unmarried, led the nobility of Portugal against the Sharif of Morocco at Alcácer Quibir. By evening he was gone, with eight thousand dead and fifteen thousand taken. A body was shown and buried. Nobody who had known him well would swear to it.\n\nTwo years later the crown passed to Philip of Castile. In the taverns they began to recite the verses of Bandarra, a cobbler of Trancoso dead these twenty years, who had written of a king who is hidden and will return. A man in Penamacor said he was Sebastian. So did a hermit in Ericeira, a pastry cook in Madrigal and a Calabrian in Venice. All four were hanged or sent to the galleys, and the verses were recited all the same.\n\nThe kingdom can live on this hope, and be the harder to rule for it. Or it can pay the ransoms, count what is left, and admit that the fog off the bar of the Tagus is only fog."
 nd_por.3.a: "He will come back on a morning of fog."
 nd_por.3.b: "The king is dead. The kingdom is not."
 nd_por.3.a_tt: "A stubborn, faithful people that will not be ruled by strangers, and learns slowly."
 nd_por.3.b_tt: "Sober accounts and capable ministers. Nobody writes verses about them."
 nd_por.4.t: "The Lines of Elvas"
 nd_por.4.d: "Elvas, January 1659. Don Luis de Haro has sat before the town for three months with fourteen thousand foot and the best siege train in Spain. He has not got in. The walls are new: seven bastions and their ravelins, laid out by the Jesuit Cosmander to the Dutch method, with the fort of Santa Luzia covering the one hill that overlooks them. Inside there is plague, and bread for a few days more.\n\nOn the morning of the fourteenth a relief army comes out of the fog from Estremoz, eight thousand men under the Count of Cantanhede, many of them auxiliaries who were ploughing in the autumn. They go straight at the Spanish siege lines and are over them before noon. Haro leaves his guns, his baggage and his papers.\n\nThe frontier of the Alentejo is flat and open and has been ridden over by every army that ever wanted Lisbon. It is not open any more."
 nd_por.4.a: "Let them try Almeida next."
 nd_por.4.a_tt: "The bastioned frontier has held."
 nd_por.5.t: "Bury the Dead and Feed the Living"
 nd_por.5.d: "All Saints' Day, 1755, half past nine in the morning, the churches full. The ground shakes for six minutes. Those who run to the open quays are met by the river, which draws back and then returns as a wall. What the sea leaves, the fire takes over five days: the palace, the opera house opened seven months before, the India House, the royal library, some tens of thousands of people.\n\nThe king asks what is to be done, and his minister Carvalho answers in seven words. Gallows are put up for looters, grain prices are fixed, and the corpses are sunk at sea against the wishes of the Church. Within a month the old engineer Manuel da Maia lays his choices on the table. Rebuild as it was. Rebuild with wider streets. Or raze what stands and lay out a new city on the old ground, to a plan, with a timber cage in every wall that soldiers have tested by stamping around it.\n\nThere is one more choice, which Maia lists and the king already favours: leave the ruins, and settle the court on the high ground to the west, at Belém and Ajuda, where nothing fell."
 nd_por.5.a: "Raze it and build to the plan. One city, one pattern."
 nd_por.5.b: "The court stays on the hill of Ajuda, under canvas."
 nd_por.5.a_tt: "A new capital, built fast and well by its merchants, over the old families' ground."
 nd_por.5.b_tt: "A cheap, secure court and a stronger crown, while the lower town lies in ruins."
 nd_por.6.t: "The Lines of Torres Vedras"
 nd_por.6.d: "October 1810. Marshal Masséna has sixty thousand men, the Emperor's orders to drive the English into the sea, and four days' march left to Lisbon. On the eleventh his advance guard climbs a ridge near Sobral and stops.\n\nAhead, from the Tagus to the Atlantic, every hill is a fort. One hundred and fifty-two redoubts, six hundred guns, valleys dammed into marsh, slopes cut into cliffs, a second line behind the first. It was built in a year on ground a Portuguese major had mapped, by Portuguese labourers, and it is manned by Portuguese militia and ordenanças so that the field army stands free behind it. No spy, deserter or newspaper told the French it was there.\n\nBehind Masséna the country is empty. The mills are broken, the grain is gone or buried, the people have walked to Lisbon with their cattle. He looks at the Lines for a month. Then he falls back to Santarém to starve through the winter, and in March he goes home with a third of his army missing."
 nd_por.6.a: "He can look as long as he likes."
 nd_por.6.a_tt: "The invader starves in front of the Lines."
 nd_por_pinhal_de_leiria: "The Pinewood of Leiria"
 nd_por_pinhal_de_leiria_desc: "Maritime pine sown behind the dunes to stop the sand from burying Leiria's fields, under Afonso III, and enlarged by King Dinis. The crown keeps it with its own wardens and its own law. No tree is cut but for the king's ships."
 nd_por_bolsa_dos_mercadores: "The Merchants' Purse"
 nd_por_bolsa_dos_mercadores_desc: "In 1293 King Dinis confirms what the traders of his realm agreed among themselves: every ship loading for Flanders, England or France pays by her tonnage into a common chest, and the chest answers for lawsuits, ransoms and losses abroad. Under Fernando I it becomes a register and mutual insurance of every decked ship in the kingdom."
 nd_por_ordem_de_cristo: "The Order of Christ"
 nd_por_ordem_de_cristo_desc: "When the Pope suppressed the Temple, King Dinis argued for seven years that its Portuguese castles had been given to defend Portugal. In 1319 he won: a new order, with the same lands and many of the same knights, and the king's voice in the choice of its master."
 nd_por_inquiricoes_gerais: "The General Inquiries"
 nd_por_inquiricoes_gerais_desc: "Royal commissioners ride from parish to parish and swear the oldest men of every village: what here is the king's, what is a lord's, and by what title does he hold it? The answers are written down, and a lord who cannot show his parchment finds the crown has a better memory than he does."
 nd_por_besteiros_dos_concelhos: "Crossbowmen of the Concelhos"
 nd_por_besteiros_dos_concelhos_desc: "Every town of the realm owes the king a fixed count of crossbowmen, chosen from its craftsmen and entered on a roll by an officer called the anadel. They keep their own weapons, practise on feast days, and are excused certain dues for it."
 nd_por_cortes_de_coimbra: "The Cortes of Coimbra"
 nd_por_cortes_de_coimbra_desc: "In April 1385 the estates declare the throne of Portugal vacant and fill it themselves, on the argument of the lawyer João das Regras and with the procurators of the towns loudest in the hall. A dynasty that began in an assembly is slow to despise one."
 nd_por_tactica_do_quadrado: "The Square at Aljubarrota"
 nd_por_tactica_do_quadrado_desc: "A small host on ground of its own choosing: ditches and wolf pits on the flanks, men at arms on foot in the centre, crossbowmen and English archers on the wings. On 14 August 1385 the chivalry of Castile rode into it. The Constable's lesson is that ground and steadiness beat numbers."
 nd_por_guarda_mor_da_torre: "Keeper of the Tower"
 nd_por_guarda_mor_da_torre_desc: "The crown's parchments are kept in a tower of the castle of Lisbon, and their keeper is also the chronicler of the realm. Fernão Lopes holds both offices from 1418 and writes the lives of the kings from the documents in his own charge, weighing one witness against another."
 nd_por_tratado_de_windsor: "The Treaty of Windsor"
 nd_por_tratado_de_windsor_desc: "In 1386 Portugal and England swear an inviolable, eternal, solid, perpetual and true league of friendship, and seal it with the marriage of João I and Philippa of Lancaster. Neither crown ever denounces it."
 nd_por_naus_da_india: "Naus of India"
 nd_por_naus_da_india_desc: "The ships of the first voyage to India were of a hundred and twenty tuns. Within a lifetime the yards of Lisbon are launching carracks of a thousand, with four decks and castles like towers, to bring a year's pepper home in one hull."
 nd_por_pracas_de_africa: "The Fortresses of Africa"
 nd_por_pracas_de_africa_desc: "Ceuta in 1415, then Alcácer Ceguer, Arzila and Tangier: walled towns on the Moroccan shore with the country outside the gate in enemy hands. Their captains live by the raid, and a young nobleman earns his knighthood there or nowhere."
 nd_por_engenhos_da_madeira: "The Mills of Madeira"
 nd_por_engenhos_da_madeira_desc: "Cane from Sicily, money from Genoa, and water brought along the cliffs in channels cut by hand. By the 1490s the island that was all forest sends more sugar to Flanders than Cyprus does, and its mill is copied in São Tomé and Brazil."
 nd_por_irmandade_da_misericordia: "The Brotherhood of Mercy"
 nd_por_irmandade_da_misericordia_desc: "Queen Leonor's brotherhood of 1498 is bound to the fourteen works of mercy and governed by gentlemen and craftsmen in equal number. Within a generation every town in the kingdom has its Holy House, and then every town the Portuguese hold overseas."
 nd_por_cartazes: "The Cartaz"
 nd_por_cartazes_desc: "From 1502 no ship may sail the Indian Ocean without a Portuguese pass naming her master, her cargo and her ports. It costs little. A ship met at sea without one, or off the course written on it, is a lawful prize."
 nd_por_capitaes_mores: "Captains-Major"
 nd_por_capitaes_mores_desc: "King Sebastian's regiment of 1570 enrols every man from eighteen to sixty in a company of two hundred and fifty, under a captain-major chosen from the first families of his town. They muster on Sundays with whatever arms they have."
 nd_por_cosmografo_mor: "The Cosmographer-Major"
 nd_por_cosmografo_mor_desc: "An office made in 1547 for Pedro Nunes. He examines every pilot and chart maker, keeps the master chart, and proves that a ship held on one compass bearing sails a spiral. João de Castro's rutters record the compass's error at every anchorage from Lisbon to Suez."
 nd_por_sebastianismo: "Sebastianism"
 nd_por_sebastianismo_desc: "The king lost at Alcácer Quibir was never seen dead by anyone the people would believe. So he is not dead: he is hidden, and he will come back. Under sixty years of Castilian kings the hope is a way of saying no."
 nd_por_aguardente_de_cana: "Cane Brandy"
 nd_por_aguardente_de_cana_desc: "A still is set up beside the boiling house and fed with the skimmings and molasses the sugar master throws away. The spirit pays the mill hands, and on the coast of Angola it buys more than cloth does."
 nd_por_padroado_real: "The Royal Patronage"
 nd_por_padroado_real_desc: "By papal grant the King of Portugal names every bishop from Brazil to Japan, pays every missionary's passage and builds every church. No priest sails east except in a Portuguese ship, and Portuguese becomes the language of the altar and the quay from Mozambique to Macau."
 nd_por_pracas_abaluartadas: "The Bastioned Frontier"
 nd_por_pracas_abaluartadas_desc: "After 1640 the border towns are rebuilt to the Dutch method by the Jesuit Cosmander and the Frenchman Nicolas de Langres: Elvas, Almeida, Valença, Campo Maior. Low walls, deep dry ditches, and no approach that is not swept from two sides."
 nd_por_tercos_de_auxiliares: "The Auxiliary Terços"
 nd_por_tercos_de_auxiliares_desc: "In 1646 a second line is picked from the ordenanças: married men and farmers, formed into terços by district, armed and drilled like the paid troops and sent home between campaigns. They hold the fortresses so that the army can take the field."
 nd_por_socalcos_do_douro: "Terraces of the Douro"
 nd_por_socalcos_do_douro_desc: "The schist is broken with iron bars and stacked into dry walls, and the hillside above the river becomes a stair of narrow terraces, each wide enough for two rows of vines. It is the labour of generations, and the English will pay for the wine."
 nd_por_azulejaria: "The Age of Blue and White"
 nd_por_azulejaria_desc: "Painted tiles cover whole church walls, palace stairs and garden benches: saints, hunts, sea fights and fables in cobalt on white. Masters sign their panels like painters, and crates of them are shipped to Bahia and Goa."
 nd_por_frotas_do_brasil: "The Brazil Fleets"
 nd_por_frotas_do_brasil_desc: "From 1649 the General Company of the Commerce of Brazil owes the crown thirty-six warships, and no sugar ship crosses the Atlantic outside its convoy. The fleets go out with wine, flour, oil and salt cod, and come home with the harvest."
 nd_por_reconstrucao_de_lisboa: "The Rebuilding of Lisbon"
 nd_por_reconstrucao_de_lisboa_desc: "After the earthquake of 1755 the lower town is laid out again on a grid, with houses to one pattern and pieces cut to standard sizes off site. Inside every wall is the gaiola, a cage of crossed timbers that bends where stone would break."
 nd_por_reais_fabricas: "The Royal Factories"
 nd_por_reais_fabricas_desc: "The crown sets up works under its own name to make what the kingdom buys abroad: silk at the Rato, woollens at Covilhã and Portalegre, glass at Marinha Grande. Each has a monopoly, foreign masters, and a ledger the minister reads himself."
 nd_por_junta_do_comercio: "The Board of Trade"
 nd_por_junta_do_comercio_desc: "In 1755 the merchants of Lisbon are given a board with the crown's authority over trade, the fleets and the factories. Its first complaint is that Portuguese merchants cannot keep books, and its answer is a school."
 nd_por_regimentos_de_milicias: "Regiments of Militia"
 nd_por_regimentos_de_milicias_desc: "The old auxiliary terços are renamed, numbered and put in uniform, one regiment to each recruiting district. They are farmers and shopkeepers under local gentlemen, called out in wartime to hold a fortress or a river line."
 nd_por_linhas_de_torres: "The Lines Before Lisbon"
 nd_por_linhas_de_torres_desc: "Three belts of redoubts across the peninsula of Lisbon, built in a year without the enemy learning of them, and in front of them a country stripped of everything an army could eat. The invader may come as far as he likes. He will not be fed."
 a_nd_por_besteiros_do_conto: "Besteiros do Conto"
 a_nd_por_besteiros_do_conto_desc: "Crossbowmen of the tally: craftsmen of the towns, entered on the king's roll and armed at their own cost. A windlass crossbow hits hard and is slow to span."
 levy_nd_por_besteiros_do_conto: "Besteiros do Conto Levy"
 levy_nd_por_besteiros_do_conto_desc: "The crossbowmen each concelho owes the king, called out from its crafts."
 a_nd_por_fronteiros: "Fronteiros"
 a_nd_por_fronteiros_desc: "Light horse of the Moroccan fortresses, riding short in the Moorish fashion. They are out of the gate before dawn and back by dark with cattle and captives. Light mail and a leather shield do not stop much."
 n_nd_por_nau_da_carreira: "Nau da Carreira"
 n_nd_por_nau_da_carreira_desc: "The great carrack of the India run: three or four decks of pepper and porcelain under towering castles. Her hull is built to survive the Cape. She carries few guns for her size and is slow."
 a_nd_por_ordenancas: "Companhias de Ordenança"
 a_nd_por_ordenancas_desc: "The enrolled men of a district, in companies of two hundred and fifty under their captain-major. They know every lane of their own parish and are slow to march out of it."
 levy_nd_por_ordenancas: "Ordenança Levy"
 levy_nd_por_ordenancas_desc: "Every able man of the district, mustered under the captain-major."
 a_nd_por_auxiliares: "Terços de Auxiliares"
 a_nd_por_auxiliares_desc: "The second line of the Restoration War: men picked from the ordenanças, drilled like regulars and sent home between campaigns. They hold a wall well and march slowly."
 levy_nd_por_auxiliares: "Auxiliary Terço Levy"
 levy_nd_por_auxiliares_desc: "The district's auxiliary terço, called from the plough to the frontier."
 a_nd_por_milicias: "Regimentos de Milícias"
 a_nd_por_milicias_desc: "District regiments of farmers and shopkeepers under local gentlemen. In 1810 they stood in the redoubts before Lisbon while the army waited behind them."
 levy_nd_por_milicias: "Militia Regiment Levy"
 levy_nd_por_milicias_desc: "The militia regiment of each recruiting district, called out for the war."
 nd_por_pinhal_do_rei: "Pinhal do Rei"
 nd_por_pinhal_do_rei_desc: "The King's Pinewood: a crown forest of maritime pine behind the coastal dunes, with its own wardens. It gives the shipyards planking, masts, pitch and tar."
 nd_por_pinhal_aprestos_navais: "Naval Stores"
 nd_por_pinhal_aprestos_navais_desc: "Pine is felled and squared for planking and spars, and the stumps and resin are burned down for tar."
 nd_por_casa_da_bolsa: "Casa da Bolsa"
 nd_por_casa_da_bolsa_desc: "The house of the merchants' common purse. Every ship that loads here pays into the chest, and the chest replaces a lost hull and ransoms a taken crew."
 nd_por_casa_da_bolsa_maintenance: "The Common Chest"
 nd_por_casa_da_bolsa_maintenance_desc: "Ledgers for the register of ships, and the cordage and canvas the purse replaces."
 nd_por_torre_do_tombo: "Torre do Tombo"
 nd_por_torre_do_tombo_desc: "The Tower of the Register: the crown's archive of treaties, charters and titles, kept by the chronicler of the realm. A king who can produce the parchment wins his case."
 nd_por_torre_do_tombo_maintenance: "The Registers"
 nd_por_torre_do_tombo_maintenance_desc: "Paper and bound registers, wax for the seals and leather for the bindings."
 nd_por_engenho: "Engenho"
 nd_por_engenho_desc: "A cane mill: rollers turned by oxen or water, a boiling house with its row of copper kettles, and a purging house where the sugar loaves drain white."
 nd_por_engenho_acucar: "Milling and Boiling"
 nd_por_engenho_acucar_desc: "Cane is crushed between rollers and the juice boiled down over wood fires. The kettles eat a forest."
 nd_por_engenho_aguardente: "Cane Brandy Still"
 nd_por_engenho_aguardente_desc: "Skimmings and molasses from the boiling house are fermented and distilled into aguardente."
 nd_por_misericordia: "Santa Casa da Misericórdia"
 nd_por_misericordia_desc: "The Holy House of Mercy: a brotherhood of gentlemen and craftsmen that runs the hospital, feeds prisoners, buries the poor, raises foundlings and dowers orphan girls."
 nd_por_misericordia_maintenance: "Works of Mercy"
 nd_por_misericordia_maintenance_desc: "Physic for the sick, shirts and shrouds, and bread and wine for the prisoners."
 nd_por_quinta: "Quinta"
 nd_por_quinta_desc: "A wine estate of the upper Douro: a house, a press and a hillside cut into narrow terraces held up by dry walls of schist."
 nd_por_quinta_vinha_em_socalcos: "Terraced Vineyard"
 nd_por_quinta_vinha_em_socalcos_desc: "Vines on walled terraces. The walls are mended after every winter and the grapes are carried down in baskets."
 nd_por_olaria_de_azulejo: "Olaria de Azulejo"
 nd_por_olaria_de_azulejo_desc: "A tile kiln. Its potters glaze earthenware white with tin and paint it in cobalt blue, by the panel for churches and by the crate for Brazil."
 nd_por_olaria_faianca_e_azulejo: "Faience and Painted Tile"
 nd_por_olaria_faianca_e_azulejo_desc: "Clay is fired, dipped in tin glaze, painted in cobalt and fired again."
 nd_por_real_fabrica: "Real Fábrica"
 nd_por_real_fabrica_desc: "A royal factory: one large works under the crown's name, with a monopoly, foreign masters and orders to replace an import."
 nd_por_real_fabrica_de_panos: "Royal Woollen Works"
 nd_por_real_fabrica_de_panos_desc: "Army cloth and baize woven from the flocks of the Serra da Estrela, as at Covilhã and Portalegre."
 nd_por_real_fabrica_de_vidros: "Royal Glass Works"
 nd_por_real_fabrica_de_vidros_desc: "Window glass and crystal fired with pine from the royal forest, as at Marinha Grande."
 nd_por_real_fabrica_das_sedas: "Royal Silk Works"
 nd_por_real_fabrica_das_sedas_desc: "Damasks and velvets for the court and for Brazil, as at the Rato in Lisbon."
 nd_por_aula_do_comercio: "Aula do Comércio"
 nd_por_aula_do_comercio_desc: "The School of Commerce: three years of arithmetic, foreign weights and measures, exchange, insurance and double-entry bookkeeping, taught to merchants' sons at the state's expense."
 nd_por_aula_do_comercio_maintenance: "Lessons in Bookkeeping"
 nd_por_aula_do_comercio_maintenance_desc: "Paper, printed tables and textbooks, and glass for the schoolroom windows."
 nd_por_dest_lisbon_developed_tt: "#bold Lisbon#! is ours and has reached #bold 82#! development"
 nd_por_destiny: "The Kingdom at the Edge of the Sea"
 nd_por_destiny_desc: "The frontier at home is closed and the court has chosen where the next one lies. Keep the realm steady and the choice made at the kingdom's founding opens its road: across the strait to Morocco, or out onto the Ocean Sea. The quays of Lisbon, Porto and Lagos will man the ships either way."
 nd_por_dest_chave_do_estreito: "The Key of the Strait"
 nd_por_dest_chave_do_estreito_desc: "Take #bold Ceuta#! from Morocco and hold 1,000 gold. In August 1415 King João I crossed with two hundred ships and three of his sons and took the city in a day. The fleet was paid for with loans, and a garrison across the water has to be paid every year after."
 nd_por_dest_algarve_de_alem_mar: "The Algarve Beyond the Sea"
 nd_por_dest_algarve_de_alem_mar_desc: "Take #bold Tangier#! and #bold Asilah#! and reach 50 prestige. Arzila fell to Afonso V in August 1471 and Tangier, abandoned by its people, was occupied days later. From that year the kings of Portugal were kings of the Algarves on this side and beyond the sea in Africa."
 nd_por_dest_mouros_de_pazes: "The Moors of Peace"
 nd_por_dest_mouros_de_pazes_desc: "Take #bold Safi#!, #bold Azemmour#!, #bold Mazagan#! and #bold Agadir#! and reach 75 prestige. Under Manuel I the banner went down the Atlantic coast, and the tribes of the plain behind the ports made their peace: tribute in wheat and horses, and their horsemen in the captains' raids. For a few years Portuguese riders were seen from the walls of Marrakesh."
 nd_por_dest_ilhas_do_mar_oceano: "The Islands of the Ocean Sea"
 nd_por_dest_ilhas_do_mar_oceano_desc: "Settle #bold Funchal#! on Madeira and #bold Angra#! in the Azores, and hold 1,000 gold. Nobody lived on either. Madeira was settled from about 1420 and burned for seven years to clear its forest; the Azores followed, sown with wheat and stocked with cattle before the first families landed."
 nd_por_dest_resgate_do_ouro: "The Gold of Guinea"
 nd_por_dest_resgate_do_ouro_desc: "Hold #bold Arguin#! and #bold Anomansah#! (the Mine), have gold produced or traded in one of your markets, and hold 2,000 gold. The factory on the island of Arguin, from 1445, drew off the caravans that had carried gold north to Morocco. The castle of São Jorge da Mina, shipped out in numbered stones in 1482, stood where the gold came down to the coast."
 nd_por_dest_estado_da_india: "The State of India"
 nd_por_dest_estado_da_india_desc: "Hold #bold Goa#!, have pepper produced or traded in the market of your capital, raise #bold Lisbon#! to 82 development and reach 75 prestige. Afonso de Albuquerque took Goa in 1510 and made it the seat of an empire of harbours. Its pepper paid for a Lisbon twice the size of the one that sent the first fleet."
 nd_por.7.t: "Two Roads from the Quay"
 nd_por.7.d: "The council has met and the argument is over, for this reign at least. The shipwrights of the Ribeira have their orders and the treasurer has his. Whether the fleet that is fitting out carries horses and siege ladders for the Moroccan shore, or water casks and trade goods for a longer voyage, the kingdom has stopped looking at its land border. Castile lies behind it. Everything it wants now lies over water."
 nd_por.7.a: "God grant us fair winds."
 nd_por.7.a_tt: "The destiny chosen at the kingdom's founding is open in the Traditions tab."
 nd_por.8.t: "The Key of the Strait"
 nd_por.8.d: "The banner of Saint Vincent flies from the citadel of Ceuta. The city that watched the strait for the kings of Fez now watches it for Portugal. The king has knighted his sons in the great mosque, washed and consecrated that morning, and a garrison of volunteers stays behind when the fleet sails home.\n\nThe caravans that used to end here have already found other gates. What Portugal holds is a wall, a harbour and a claim on everything beyond them."
 nd_por.8.a: "We hold one gate of Africa. There are others."
 nd_por.8.a_tt: "Ceuta is held. Tangier and Asilah are next."
 nd_por.9.t: "King on Both Sides of the Sea"
 nd_por.9.d: "Tangier and Arzila are Portuguese, and the king's style has a new clause: lord of the Algarves on this side and beyond the sea in Africa. Weavers in Flanders are at work on hangings that show the assault, the king in the breach, the fleet at anchor.\n\nThe captains want to know what the towns are for. Some would keep them as lists in which the king and his nobility win honour every season. Others say a town with no farmers, no craftsmen and no bishop is only a camp, and that camps are lost."
 nd_por.9.a: "A king wins his name in the breach, like his fathers."
 nd_por.9.a_tt: "Bolder, steadier armies led by a fighting court that has little time for study."
 nd_por.9.b: "Send householders. A town we live in is a town we keep."
 nd_por.9.b_tt: "Settlers move readily, garrisons recover at home, and the clergy gain new sees."
 nd_por.10.t: "The Moors of Peace"
 nd_por.10.d: "From Azamor to the Cape of Gué the ports are the king's, and the plain behind them has come to terms. The tribes of the Dukkala send their wheat to the royal granaries and their sons to ride beside the captains of Safi. Their own alcaide, a Berber lord in the king's pay, collects the tribute and keeps the peace.\n\nNot every captain trusts it. The men who made their names on the raid say that a Moor at peace is a Moor waiting, and that the only safe frontier is one kept empty by fire for three days' ride."
 nd_por.10.a: "Treaties, tribute and allied lances. Let them fight for us."
 nd_por.10.a_tt: "Cheaper hired troops, more envoys, and fewer of our own people lost in war."
 nd_por.10.b: "No peace with the Moor. Raid every season."
 nd_por.10.b_tt: "Faster battles and a nobility in arms. Ravaged land recovers more slowly."
 nd_por.11.t: "Islands Nobody Owned"
 nd_por.11.d: "There is a town at Funchal now, with a church, a customs house and water running in channels cut along the cliffs. On Terceira the bay of Angra shelters ships that have come up from the south on the long tack out into the ocean, the only way home against the wind.\n\nNo king was defeated to win these islands and no people was driven off them. They were found empty and made into Portugal by ploughs, vines and the younger sons of the Algarve."
 nd_por.11.a: "The sea has more of them. Sail on."
 nd_por.11.a_tt: "Madeira and the Azores are settled. The coast of Guinea lies beyond."
 nd_por.12.t: "The Gold of Guinea"
 nd_por.12.d: "The gold that used to cross the desert to Fez and Tunis now comes down to the beach, where the king's castle of São Jorge buys it with cloth, brass basins and horses. A caravel can carry home in one hold what a caravan took a year to bring.\n\nThere are two ways to run such a trade. The crown can keep it: its own house in Lisbon, its own ships, and the death of any stranger found south of the Canaries. Or it can do what King Afonso did with Fernão Gomes, and lease the whole coast to a merchant who pays rent and must push the discovery a hundred leagues further every year."
 nd_por.12.a: "The Mine is the king's. Strike the cruzado in his name."
 nd_por.12.a_tt: "Sound coin, cheap coast guards, and ships refitted far from home."
 nd_por.12.b: "Lease it. Let the merchant pay rent and find new coast."
 nd_por.12.b_tt: "Quicker expeditions, more ship's stores, and higher trade subsidies."
 nd_por.13.t: "The State of India"
 nd_por.13.d: "The pepper fleet is in the Tagus and the price in Antwerp is whatever Lisbon says it is. Goa is the king's, with a governor, a mint and a cathedral rising where the mosque stood.\n\nThe men who built this disagree about what holds it up. Dom Francisco de Almeida wrote to the king that every fortress is a hostage and that all his strength should be afloat. Afonso de Albuquerque took Goa precisely so that there would be a city to come home to, and married his soldiers to its women so that they would stay. In the villages of the Alentejo there are fewer men at every harvest."
 nd_por.13.a: "Let all our power be on the sea."
 nd_por.13.a_tt: "Tougher, quicker fleets and a lasting presence at sea."
 nd_por.13.b: "Fortresses and married settlers. Make the East ours."
 nd_por.13.b_tt: "Converts and growing towns overseas. The peasantry at home resents the drain."
 STATIC_MODIFIER_NAME_nd_por_dest_o_africano: "The African"
 STATIC_MODIFIER_DESC_nd_por_dest_o_africano: "The king leads the assault himself and the court follows him into the breach. There is little time left over for charts."
 STATIC_MODIFIER_NAME_nd_por_dest_moradores: "Householders of the African Towns"
 STATIC_MODIFIER_DESC_nd_por_dest_moradores: "Married settlers, craftsmen and a bishop: the conquered towns become Portuguese towns."
 STATIC_MODIFIER_NAME_nd_por_dest_campo_de_pazes: "The Field of Peace"
 STATIC_MODIFIER_DESC_nd_por_dest_campo_de_pazes: "Tribes under treaty pay their tribute in wheat and horses and ride with the captains."
 STATIC_MODIFIER_NAME_nd_por_dest_guerra_viva: "The Living War"
 STATIC_MODIFIER_DESC_nd_por_dest_guerra_viva: "No treaties. Every season the garrisons ride out, and the country within reach of them stays burnt."
 STATIC_MODIFIER_NAME_nd_por_dest_casa_da_mina: "House of the Mine"
 STATIC_MODIFIER_DESC_nd_por_dest_casa_da_mina: "The Guinea trade is the crown's own: its house keeps the books, its castle refits the caravels, and its gold is struck into honest coin."
 STATIC_MODIFIER_NAME_nd_por_dest_contrato_da_guine: "The Guinea Contract"
 STATIC_MODIFIER_DESC_nd_por_dest_contrato_da_guine: "The coast is leased to a merchant of Lisbon, who pays rent and must discover a hundred leagues of it every year."
 STATIC_MODIFIER_NAME_nd_por_dest_poder_no_mar: "All Power on the Sea"
 STATIC_MODIFIER_DESC_nd_por_dest_poder_no_mar: "Almeida's rule: a fortress is a hostage, a fleet commands every harbour at once."
 STATIC_MODIFIER_NAME_nd_por_dest_casados: "The Married Men"
 STATIC_MODIFIER_DESC_nd_por_dest_casados: "Albuquerque's rule: soldiers given a wife, a house and a plot in the cities of the East. The villages at home empty to fill them."
 nd_por_dest_paco_da_ribeira: "Paço da Ribeira"
 nd_por_dest_paco_da_ribeira_desc: "The Palace on the Riverbank: the king's house built on the quay itself, beside the shipyard, with the House of India and its pepper stores under the same roof."
 nd_por_dest_paco_da_ribeira_maintenance: "Court on the Waterfront"
 nd_por_dest_paco_da_ribeira_maintenance_desc: "Paper for the ledgers of the House of India, fine cloth and furniture for the court, and glass for the windows that look out on the fleet."

 # ===== BUREAUCRACIES =====
 por_juizes_de_fora_bureaucracy: "Juízes de Fora"
 por_juizes_de_fora_bureaucracy_desc: "The judge from outside: a magistrate named by the king and sent to a town where he has no kin, first under Afonso IV in 1327. He hears its suits and presides over its council, and the corregedor of the district rides in behind him to inspect both. More than fifty towns were governed this way by 1580. In the lands of a great lord the king's judges do not enter."
 por_casa_dos_vinte_e_quatro_bureaucracy: "Companhia das Naus"
 por_casa_dos_vinte_e_quatro_bureaucracy_desc: "The Company of Ships, set up by King Fernando in 1380. Every ship above fifty tuns is entered in a register, and two in every hundred of what she earns in freight is paid into a common purse, one kept at Lisbon and one at Porto. A ship lost or damaged at sea is made good out of the purse, and the loss is shared among all the owners."
 por_mesa_da_consciencia_bureaucracy: "Mesa da Consciência e Ordens"
 por_mesa_da_consciencia_bureaucracy_desc: "The Board of Conscience, set up by João III at Évora in December 1532 to advise him on whatever touched his conscience as king. From 1551 the orders of Christ, Santiago and Avis are governed from its table: their commanderies, their churches and their knights. It also keeps the University of Coimbra, the ransom of captives and the goods of those who die beyond the sea."
 por_conselho_ultramarino_bureaucracy: "Conselho Ultramarino"
 por_conselho_ultramarino_bureaucracy_desc: "The Overseas Council, created by João IV on 14 July 1642 and seated the next year under the Marquis of Montalvão: a noble president, two councillors of the sword and one of the robe. Every letter from India, Brazil, Guinea and the islands is read here, and the council advises the king on each post to be filled and each service to be rewarded. It was dissolved in 1833."

 # The auto modifier that grants the country's slots on formation
 AUTO_MODIFIER_NAME_nd_por_bureaucracy_authority: "Tribunals of the Court of Lisbon"
 AUTO_MODIFIER_DESC_nd_por_bureaucracy_authority: "Two institutions can be kept by the crown of Portugal from the day the kingdom is formed."
