l_polish:
 STATIC_MODIFIER_NAME_nd_mll_ciutat_e_regne: "The City Governs the Kingdom"
 STATIC_MODIFIER_DESC_nd_mll_ciutat_e_regne: "The jurats and merchants of Ciutat de Mallorca rule the islands from inside the walls. Ships are laid down and the sea lanes lengthen, and the villages pay for a council in which they are outvoted."
 STATIC_MODIFIER_NAME_nd_mll_part_forana: "The Part Forana Has Its Share"
 STATIC_MODIFIER_DESC_nd_mll_part_forana: "The villages hold the seats and see the accounts that King Sancho's ruling promised them. The countryside builds, feeds and musters willingly, and the City's merchants find the council slower to do their bidding."
 STATIC_MODIFIER_NAME_nd_mll_universal_consignacio: "The Universal Consignació"
 STATIC_MODIFIER_DESC_nd_mll_universal_consignacio: "The creditors' treasurer collects the kingdom's taxes and pays the interest before anything else. Lenders trust such a debtor and lend cheaply. Little is left for the kingdom itself."
 STATIC_MODIFIER_NAME_nd_mll_pensions_suspeses: "Interest Suspended"
 STATIC_MODIFIER_DESC_nd_mll_pensions_suspeses: "The jurats have stopped paying the bondholders. The taxes stay on the island and the villages breathe. No banker in Barcelona will forget it."
 STATIC_MODIFIER_NAME_nd_mll_saccomanni: "The Saccomanni"
 STATIC_MODIFIER_DESC_nd_mll_saccomanni: "Paid Italian foot have scattered the villagers, the leaders have been hanged and a fine lies on every parish. The Crown's hand is felt in the countryside as never before, and it is remembered."
 STATIC_MODIFIER_NAME_nd_mll_revisio_de_comptes: "The Accounts Opened"
 STATIC_MODIFIER_DESC_nd_mll_revisio_de_comptes: "The books of the public debt are read aloud from 1405 onward with the villages' syndics at the table. The countryside has gone home. The families who lived off the fund do not forgive it."
 STATIC_MODIFIER_NAME_nd_mll_fins_al_darrer_dia: "To the Last Day"
 STATIC_MODIFIER_DESC_nd_mll_fins_al_darrer_dia: "Every bastion was manned until nothing more could be done, and the island learned what it can endure. Abroad, a kingdom that would not treat is a kingdom nobody hurries to befriend."
 STATIC_MODIFIER_NAME_nd_mll_capitulacio_honrosa: "An Honourable Capitulation"
 STATIC_MODIFIER_DESC_nd_mll_capitulacio_honrosa: "Terms were asked for and given. Lives, goods and harvests were spared and trade resumed within the season. The name of the place is not spoken with the same respect."
 nd_mll.1.t: "The City and Kingdom of Mallorca"
 nd_mll.1.d: "James the Conqueror called it a kingdom in the sea, and it is one: four islands, a crown of their own, and no parliament. What governs here is styled the Universitat of the City and Kingdom of Mallorca, six jurats and a great council, and the order of the words is the whole quarrel. Inside the walls of Ciutat de Mallorca live the merchants who freight ships for Barbary, Flanders and the Levant, lend the Crown its money and hold most of the council's seats. Outside lies the Part Forana, thirty-odd villages that grow the grain, pay their share of every tax and since 1315 keep ten syndics of their own to say so. Whoever wears the crown must decide which of the two the kingdom is.\n\nThe City offers ships, credit and the trade of the whole western sea. The villages offer bread, men and peace at home.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mll.1.a: "The kingdom is its City. Let the jurats govern."
 nd_mll.1.b: "The kingdom is its villages. Seat their syndics."
 nd_mll.1.a_tt: "Longer sea trade, stronger merchants and faster shipbuilding. The villages resent it."
 nd_mll.1.b_tt: "Contented peasants, more food, cheaper rural building and larger levies. The merchants resent it."
 nd_mll_formed_tt: "Mallorca has been formed"
 nd_mll_path_a_tt: "Chose the #bold City of Mallorca#! destiny"
 nd_mll_path_b_tt: "Chose the #bold Part Forana#! destiny"
 nd_mll.2.t: "The Holy Contract"
 nd_mll.2.d: "Three bad harvests, a flood that drowned the lower City in 1403, and a generation of galleys armed for kings who never repaid them: the kingdom owes more than it can count, and most of it to citizens of Barcelona. In 1405 the jurats sign what the creditors call the Contracte Sant. Nearly every tax the kingdom raises will go into one fund, the Universal Consignació. The creditors will name its treasurer each year. Interest is paid first, the Catalan bondholders before the Mallorcan ones, and whatever remains pays down the principal until the debt is gone.\n\nThe debt was never to be gone. Twenty years later the jurats stopped paying, and Barcelona sent lawyers. The paper is on the table now, and the ink is not yet dry."
 nd_mll.2.a: "A kingdom that keeps its word can always borrow."
 nd_mll.2.b: "The island eats first. Suspend the interest."
 nd_mll.2.a_tt: "Cheaper loans and more credit. The taxes go to the creditors."
 nd_mll.2.b_tt: "The taxes stay at home and the peasants are content. Loans cost more."
 nd_mll.3.t: "The Forans Before the Walls"
 nd_mll.3.d: "An audit has found six hundred thousand pounds gone astray from the public fund, and the villages have had enough of paying for it. In July 1450 the men of the Part Forana march on the City under Simó Ballester, whom they call the Crooked, and sit down before the gates. They ask that the debt be struck off and that the villages be governed apart from the City. They go home on promises. They come back in April 1451, and again in May, and the third time they cut the aqueduct.\n\nThe king is in Naples and has soldiers to spare: Italian foot called saccomanni, who are paid by the month and have no cousins on the island. His lieutenant the queen has already offered the villages an inquiry instead."
 nd_mll.3.a: "Send for the saccomanni. Rebels are not bargained with."
 nd_mll.3.b: "Open the books from 1405 and seat the syndics."
 nd_mll.3.a_tt: "A stronger Crown and cheaper mercenaries. The peasants do not forget."
 nd_mll.3.b_tt: "Contented peasants and cheaper stability. The City's rentiers resent it."
 nd_mll.4.t: "The Eleventh of May"
 nd_mll.4.d: "Before dawn the watch on the headland counts the sails and lights the fire. By the time the corsairs are ashore and marching on Sóller in two columns, Captain Joan Angelats has the men of the valley drawn up behind a stream, and riders are away to Bunyola and Alaró for more. He does not wait for them. One column is met in the open and broken. The other reaches the town and finds it nearly empty of men, and is still loading its plunder when the victors come back down the road. In one house two sisters are said to have killed a raider on their own threshold with the bar of the door.\n\nThe ships left without their captives. Sóller has kept the day ever since."
 nd_mll.4.a: "Every parish its captain, and every man on the roll."
 nd_mll.4.a_tt: "The parish militia has proved itself on the beach."
 nd_mll.5.t: "The Last to Fall"
 nd_mll.5.d: "Mallorca declared for the Archduke Charles in 1706 and has kept his flag for nine years. Barcelona fell last September. Since then the islands have been all that is left of his cause in Spain, and the powers that promised to defend it have signed their peace and sailed home. In June 1715 a French and Spanish army under the Chevalier d'Asfeld comes ashore on the east coast with siege guns. Alcúdia opens its gates. The City has good bastions, a garrison, a viceroy who talks of honour, and a population that has seen what was done to Barcelona.\n\nIf the walls are held, the laws and liberties of the kingdom will be defended to the end, and the end is certain. If terms are asked for, lives and property may be saved. Nothing has been promised about the laws."
 nd_mll.5.a: "The bastions were built for this. Man them."
 nd_mll.5.b: "Ask for terms while there is something left to save."
 nd_mll.5.a_tt: "Stronger fortresses and steadier troops. Other courts keep their distance."
 nd_mll.5.b_tt: "War weariness fades and the land prospers. Prestige suffers."
 nd_mll.6.t: "Captain Toni's Launches"
 nd_mll.6.d: "Antoni Barceló was born in Palma on New Year's Day 1717, the son of the skipper who ran the mail xebec to Barcelona. He went to sea in that ship as a boy, commanded her at eighteen, and fought off so many Barbary raiders on the crossing that the navy took him on without his ever having sat in a classroom. Officers who had studied their trade looked down on him. He ended as lieutenant general of the fleet.\n\nBefore Gibraltar in 1779 he put a heavy gun in the bow of an oared launch, shielded it with iron plate, and sent them against the Rock by night in dozens. They were too low to hit and too many to chase. He took the same boats to Algiers in 1783 and again in 1784. Every navy in the Mediterranean built gunboats afterwards."
 nd_mll.6.a: "No school taught him. The sea did."
 nd_mll.6.a_tt: "Gunboats of Barceló's pattern can now be built."
 nd_mll.7.t: "A Friar from Petra"
 nd_mll.7.d: "Miquel Josep Serra was born in Petra, in the middle of the island, in 1713. He took the name Juníper with the Franciscan habit, earned his doctorate, and held the chair of Scotist philosophy at the Lullian university in the City. In 1749 he gave it up and sailed for New Spain, as the founder of that university's doctrine had once sailed for Tunis. Two of his own students went with him, Francesc Palou and Joan Crespí.\n\nOn 16 July 1769, lame in one leg and fifty-five years old, he raised a cross at San Diego. He founded eight more missions up that coast before he died at Carmel in 1784, and Palou wrote his life."
 nd_mll.7.a: "Sempre endavant, mai enrere."
 nd_mll.7.a_tt: "Always forward, never back: the friar's own motto."
 nd_mll_art_de_ramon_llull: "Art of Ramon Llull"
 nd_mll_art_de_ramon_llull_desc: "Ramon Llull of Ciutat de Mallorca left a courtier's life to write a method by which the truths of the faith could be shown to an unbeliever through reason alone. He wrote it in Latin, in Arabic and in his own Catalan. In 1276 the Infant James endowed a college at Miramar, on the cliffs of the north coast, where thirteen friars learned Arabic before they crossed to Barbary."
 nd_mll_sindicat_de_fora: "Sindicat de Fora"
 nd_mll_sindicat_de_fora_desc: "In 1315 King Sancho settled the quarrel between the City and the villages by giving the countryside a body of its own. Ten syndics are chosen each Christmas and two of them hold the keys of the chest. They sit in the kingdom's great council and share out its taxes among the villages."
 nd_mll_cavalls_armats: "Cavalls Armats"
 nd_mll_cavalls_armats_desc: "When the island was shared out among its conquerors in 1230, every great portion carried a duty: a war horse and a rider in mail, kept ready for the defence of the kingdom and shown at muster. The duty passes with the land to whoever holds it."
 nd_mll_sal_d_eivissa: "Salt of Ibiza"
 nd_mll_sal_d_eivissa_desc: "The pans of Ibiza have been worked since the Phoenicians. After the conquest of 1235 the islanders hold them in common, and the white heaps on the shore pay for their walls and their bread. Ships from Genoa and from the northern seas load there."
 nd_mll_ordinacions_de_1300: "Ordinances of 1300"
 nd_mll_ordinacions_de_1300_desc: "James II has new towns marked out across the countryside. Each settler receives five quarterades to plough and plant and ten of scrub for his animals, against a rent paid in coin. In the same year the king strikes the kingdom's own money in gold, silver and billon, so that the rent can be paid in it."
 nd_mll_riu_de_l_or: "The River of Gold"
 nd_mll_riu_de_l_or_desc: "On 10 August 1346 Jaume Ferrer left Mallorca in an uixer to find the river from which the gold of the Sahara was said to come. The mapmakers of the City drew his ship off the coast of Africa with the date beside it. They did not record that he came back. Other Mallorcan ships were already trading to the Canaries."
 nd_mll_senyals_de_portopi: "Signals of Portopí"
 nd_mll_senyals_de_portopi_desc: "The tower at the mouth of Portopí is named in the king's will of 1300. A fire burns on it by night. By day its keepers hoist black balls to show the City how many ships are in sight, and from which quarter. A chain can be drawn across the harbour below it."
 nd_mll_contracte_sant: "Contracte Sant"
 nd_mll_contracte_sant_desc: "By the contract of 1405 the kingdom's revenues are paid into a single fund administered by its creditors, who appoint the treasurer and are paid before any other charge. The kingdom's credit is secured. Its purse is no longer its own."
 nd_mll_obra_de_mallorca: "Obra de Mallorca"
 nd_mll_obra_de_mallorca_desc: "The gold lustreware of Valencia and Málaga reaches Pisa and Florence in Mallorcan ships, and the Italians call it maiolica after the island that carries it. The same hulls go on through the straits to Bruges and London with oil, figs and cloth."
 nd_mll_revolta_forana: "Revolta Forana"
 nd_mll_revolta_forana_desc: "Between 1450 and 1452 the villages rose against the City over a public debt that they paid and others spent. They besieged it three times. The king's mercenaries broke them at Rafal Garcés, their leaders were executed and a fine of 150,000 pounds was laid on the countryside. The villages have not forgotten how to assemble."
 nd_mll_germania: "Germania of Mallorca"
 nd_mll_germania_desc: "On Fat Thursday of 1521 the guilds of the City freed seven imprisoned artisans and took the government. Joan Crespí, a clothworker, led them first, and then Joanot Colom, a hatter. Their demand was the Santa Quitació, the paying off of the public debt for good. They held the island for two years, all but Alcúdia."
 nd_mll_estudi_general_lullia: "Estudi General Lul·lià"
 nd_mll_estudi_general_lullia_desc: "In 1483 King Ferdinand granted the kingdom's council the general school it had asked for. Philosophy, law, theology and medicine are taught there, and there is a chair for the Art of Ramon Llull. A Mallorcan need no longer cross the sea for a degree."
 nd_mll_picapedrers: "Picapedrers"
 nd_mll_picapedrers_desc: "The stonecutters of the island learn their trade on the soft golden stone of Santanyí. Guillem Sagrera of Felanitx built the merchants' exchange in the City with twisted columns that branch into the vault without a capital. He directed the works of the cathedral of Perpignan, and King Alfonso sent for him to raise the great hall of the Castel Nuovo in Naples."
 nd_mll_homes_d_armes: "Homes d'Armes"
 nd_mll_homes_d_armes_desc: "Every parish keeps a roll of its men able to bear arms, under a captain who answers to the viceroy. When the coast towers signal a landing the companies gather at the appointed place without waiting for orders. At Sóller on 11 May 1561 they beat a corsair fleet on their own."
 nd_mll_oli_de_la_serra: "Oil of the Serra"
 nd_mll_oli_de_la_serra_desc: "Through the sixteenth century the slopes of the Serra de Tramuntana are terraced with dry stone and planted with olives. Every great estate presses its own fruit. For three hundred years oil is most of what the island sells abroad, to Marseille, to Barbary and to the soap boilers of the north."
 nd_mll_murada_renaixentista: "Bastioned Walls"
 nd_mll_murada_renaixentista_desc: "After the raids of the 1550s Italian engineers lay out new walls for the City and for the upper town of Ibiza: low, thick and angled, so that every stretch of curtain is swept by guns from the bastion beside it. The work takes generations, and the islanders pay for it."
 nd_mll_pau_de_les_bandositats: "Peace of the Bandositats"
 nd_mll_pau_de_les_bandositats_desc: "A duel over a courtship in 1598 divided the island's nobility into Canamunt and Canavall, the upper town and the lower. Each party hired bandits. A judge of the royal court was shot in the street in 1619. In 1645 the bishop had both sides swear peace in public on the Born."
 nd_mll_xabecs_de_cors: "Corsair Xebecs"
 nd_mll_xabecs_de_cors_desc: "The shipowners of the island fit out xebecs under letters of marque: three lateen sails on a narrow hull, with oars for a calm. It is the Barbary raider's own ship. In Mallorcan hands it hunts him along the coast and carries the mail to Barcelona when there is nothing to chase."
 nd_mll_port_de_mao: "Port of Mahón"
 nd_mll_port_de_mao_desc: "The harbour of Mahón runs five kilometres inland between low cliffs, deep enough for any ship and sheltered from every wind. Sailors say the best ports of the Mediterranean are June, July, August and Mahón. A fleet that holds it can winter within reach of every coast of the western sea."
 nd_mll_grans_mestres_cotoner: "The Cotoner Grand Masters"
 nd_mll_grans_mestres_cotoner_desc: "Rafael Cotoner of Mallorca was elected Grand Master of the Order of Saint John in 1660. His brother Nicolau followed him in 1663 and ruled for seventeen years. Nicolau enclosed the harbour towns of Malta within the lines that bear the family's name, and the island's nobles serve their caravans in the Order's galleys."
 nd_mll_darrer_reducte: "The Last Redoubt"
 nd_mll_darrer_reducte_desc: "Mallorca held for the Archduke Charles from 1706. It was still holding ten months after Barcelona had fallen, and capitulated on 2 July 1715, the last land of the Crown of Aragon to do so. An island that has held out alone knows what a siege costs."
 nd_mll_llanxes_de_barcelo: "Barceló's Gunboats"
 nd_mll_llanxes_de_barcelo_desc: "Antoni Barceló of Palma mounts one heavy gun in the bow of an oared launch and sends them out by the dozen. They attack at night and in calms, when a ship of the line cannot turn to bring her broadside to bear. They were used against Gibraltar in 1779 and against Algiers in 1783 and 1784."
 nd_mll_gin_de_mao: "Gin of Mahón"
 nd_mll_gin_de_mao_desc: "The garrison and the fleet in the harbour of Mahón wanted gin, and the island had juniper and wine but no grain to spare. The distillers of the port run wine spirit through juniper berries in copper stills over a wood fire. They sell it in stoneware jars with a handle for the thumb."
 nd_mll_teles_de_llengues: "Cloth of Tongues"
 nd_mll_teles_de_llengues_desc: "The yarn is bound in bundles and dyed before it goes on the loom, so that the colour takes only between the knots. Woven, the pattern shows as flames with blurred edges, the same on both faces of the cloth. The technique came from the East along the silk roads, and on the island it is used for bed curtains and hangings."
 nd_mll_missions_de_fra_juniper: "Missions of Fra Juníper"
 nd_mll_missions_de_fra_juniper_desc: "Juníper Serra of Petra left his chair at the Lullian university in 1749 for the missions of New Spain. From 1769 he founded nine missions along the coast of Upper California, beginning at San Diego. Two fellow Mallorcans, Francesc Palou and Joan Crespí, went with him."
 nd_mll_societat_economica: "Societat Econòmica d'Amics del País"
 nd_mll_societat_economica_desc: "Founded in 1778, the society gathers landowners, canons and merchants who read papers to one another on almonds, mulberries and the draining of marshes. It offers prizes for improved ploughs and opens schools of drawing and mathematics for the sons of artisans."
 a_nd_mll_cavalls_armats: "Cavalls Armats"
 a_nd_mll_cavalls_armats_desc: "The riders owed by the island's great landholders, in mail with shield and lance. The same men muster together every year and charge as one troop. They are the island's guard and are slow to move far from it."
 levy_nd_mll_cavalls_armats: "Cavalls Armats Levy"
 levy_nd_mll_cavalls_armats_desc: "Nobles of the kingdom, riding out on the armed horses their lands owe."
 n_nd_mll_uixer: "Uixer"
 n_nd_mll_uixer_desc: "A broad galley with one mast and a square sail, built with a door in the stern for loading horses. It carries more than a round ship of its day and has a stouter hull. Under oars and a single sail it is slow."
 a_nd_mll_forans: "Forans"
 a_nd_mll_forans_desc: "Men of the villages with crossbows, slings and boar spears. They come on hard and in numbers. Against paid soldiers in open ground they do not hold for long."
 levy_nd_mll_forans: "Forans Levy"
 levy_nd_mll_forans_desc: "Peasants of the Part Forana, assembled by their villages."
 a_nd_mll_agermanats: "Agermanats"
 a_nd_mll_agermanats_desc: "Sworn brothers of the City's guilds, armed with pikes and breastplates from its own stores. They stand their ground like men defending their own street. Nobody has taught them to manoeuvre."
 levy_nd_mll_agermanats: "Agermanats Levy"
 levy_nd_mll_agermanats_desc: "Burghers and laborers of the guilds, mustered under their own captains."
 a_nd_mll_milicia_forana: "Milícia Forana"
 a_nd_mll_milicia_forana_desc: "Parish companies mustered by smoke from the coast towers. They fight on paths and terraces they have walked all their lives and are hard to kill there. They are farmers and will not march far from the harvest."
 levy_nd_mll_milicia_forana: "Milícia Forana Levy"
 levy_nd_mll_milicia_forana_desc: "Peasants and laborers on the parish rolls, called out when a landing is signalled."
 n_nd_mll_xabec: "Xabec de Cors"
 n_nd_mll_xabec_desc: "A long, low corsair with three lateen sails, sweeps for a calm and more guns than a galley of her size. She is fast and well armed. Her hull is light and cannot take a long pounding."
 n_nd_mll_llanxa_canonera: "Llanxa Canonera"
 n_nd_mll_llanxa_canonera_desc: "An oared launch with one heavy gun in the bow behind an iron-plated bulwark. In numbers they close with far larger ships in a calm and can lie off a harbour mouth for weeks. Hull and crew are those of a launch."
 nd_mll_collegi_de_llengues: "Col·legi de Llengües"
 nd_mll_collegi_de_llengues_desc: "A house on the shore where friars study the language of the people they mean to convert. They spend years at grammar and disputation before they take ship. Books and scholars from across the sea pass through it."
 nd_mll_collegi_de_llengues_maintenance: "Grammars and Lamps"
 nd_mll_collegi_de_llengues_maintenance_desc: "Paper and books for the students, wool for their habits, and wax to read by."
 nd_mll_casa_del_sindicat: "Casa del Sindicat"
 nd_mll_casa_del_sindicat_desc: "The house in a market town where the syndics of the villages meet. They keep the register of what each village owes, share out the kingdom's taxes among them, and send their complaints to the council in the City."
 nd_mll_casa_del_sindicat_maintenance: "Registers of the Villages"
 nd_mll_casa_del_sindicat_maintenance_desc: "Paper and bound registers for every village's assessment, and cloth for the syndics' gowns."
 nd_mll_carregador_de_sal: "Carregador de Sal"
 nd_mll_carregador_de_sal_desc: "A stone quay beside the salt pans, with the salt heaped to dry behind it. Here it is weighed, sold and carried aboard in baskets. Ships that can come alongside take away more of it."
 nd_mll_carregador_de_sal_maintenance: "Quay and Baskets"
 nd_mll_carregador_de_sal_maintenance_desc: "Timber for the staging, iron tools for the heaps, and tar against the sea."
 nd_mll_torre_de_senyals: "Torre de Senyals"
 nd_mll_torre_de_senyals_desc: "A harbour tower that shows a light by night and hoists signals by day to tell the town what ships are in sight. A chain is drawn across the harbour mouth from its foot. No cargo enters unannounced."
 nd_mll_torre_de_senyals_maintenance: "Lamp Oil and Signals"
 nd_mll_torre_de_senyals_maintenance_desc: "Olive oil for the lamps, cloth and spars for the signals, and stone and tar to keep the tower sound."
 nd_mll_tafona: "Tafona"
 nd_mll_tafona_desc: "The oil press of a mountain estate. A mule turns a millstone over the olives in a stone trough, the pulp is stacked in mats under a beam as long as the room, and the oil runs off into a row of settling jars."
 nd_mll_tafona_oli: "Pressing the Harvest"
 nd_mll_tafona_oli_desc: "Olives from the terraces, pressed with scalding water heated over firewood and stored in clay jars."
 nd_mll_arsenal_de_mao: "Arsenal de Maó"
 nd_mll_arsenal_de_mao_desc: "A naval yard in the harbour of Mahón, with careening wharves, a mast house, storehouses for cordage and shot, and a hospital on the island in the roadstead. A fleet that refits here is at sea a month before any other."
 nd_mll_arsenal_de_mao_maintenance: "Naval Stores"
 nd_mll_arsenal_de_mao_maintenance_desc: "Tar, cordage, timber, sailcloth and tools for the ships, and stone for the wharves."
 nd_mll_destilleria_de_gin: "Destil·leria de Gin"
 nd_mll_destilleria_de_gin_desc: "A gin house on the quay. Wine spirit is run through juniper berries in copper stills over a wood fire and sold by the jar to ships' companies and to the garrison."
 nd_mll_gin_de_ginebro: "Juniper Gin"
 nd_mll_gin_de_ginebro_desc: "Wine distilled over juniper berries in a copper still, on a fire of local wood."
 nd_mll_teler_de_llengues: "Teler de Llengües"
 nd_mll_teler_de_llengues_desc: "A weaver's shop of the cloth of tongues. The yarn is tied and dyed in the yard, then woven on a narrow loom into lengths patterned with soft-edged flames."
 nd_mll_roba_de_llengues: "Roba de Llengües"
 nd_mll_roba_de_llengues_desc: "Linen and hemp yarn, bound, dipped in the vat and woven so that the pattern shows alike on both faces."
 nd_mll_dest_palma_ciutat_tt: "#bold Palma#! is ours, has grown into a city and has at least 29 development"
 nd_mll_dest_palma_developed_tt: "#bold Palma#! is ours and has at least 46 development"
 nd_mll_dest_manacor_market_tt: "#bold Manacor#! is ours, has a Market Village and has at least 29 development"
 nd_mll_dest_pollensa_developed_tt: "#bold Pollensa#! is ours and has at least 23 development"
 nd_mll_dest_market_villages_tt: "At least 3 of our locations have a Market Village"
 nd_mll_dest_ciutadella_town_tt: "#bold Ciutadella#! is ours and has grown into a town or more"
 nd_mll_dest_ibiza_salt_tt: "#bold Ibiza#! is ours, has a Carregador de Sal and has at least 29 development"
 nd_mll_dest_pollensa_town_tt: "#bold Pollensa#! is ours, has grown into a town or more and has at least 36 development"
 nd_mll_dest_ciutadella_developed_tt: "#bold Ciutadella#! is ours and has at least 54 development"
 nd_mll_destiny: "The City and Kingdom"
 nd_mll_destiny_desc: "A kingdom of four islands is governed by whoever can keep the City and the villages at one table. Hold the realm steady and its road opens: the City's road leads out to sea, the villages' road leads inland.\n\nRequires stability of at least 75."
 nd_mll_dest_consolat_de_mar: "Consolat de Mar"
 nd_mll_dest_consolat_de_mar_desc: "In 1326, under the regency of Philip of Mallorca, the merchants of the City were given a court of their own. Its consuls are chosen each year on Saint John's Eve from among the merchants, and they judge freight, wrecks and partnerships by the sea customs of Barcelona without waiting on the king's judges.\n\nRaise Palma to a city with at least 29 development, and hold 1000 gold and 50 prestige. A merchants' court needs a city worth pleading in."
 nd_mll_dest_consolat_de_bugia: "Consolat de Bugia"
 nd_mll_dest_consolat_de_bugia_desc: "Pisans, Genoese and Catalans all kept warehouses at Bugia on the Barbary coast, each nation under its consul. The town shipped so much wax that the French came to call a candle a bougie. Ramon Llull preached there and, by one account, was stoned for it.\n\nOwn Béjaïa, bring beeswax into one of our markets, and hold 2000 gold. The City wants the port itself and not a rented yard inside it."
 nd_mll_dest_illes_de_la_fortuna: "Illes de la Fortuna"
 nd_mll_dest_illes_de_la_fortuna_desc: "Mallorcan ships sailed for the Canaries from 1342. In 1351 Pope Clement VI blessed a voyage of the captains Joan Doria and Jaume Segarra carrying friars and twelve converted islanders, and created a diocese of the Fortunate Isles for them. The friars who preached on Gran Canaria were killed in a rising in 1391.\n\nOwn Tamaraceite on Gran Canaria, raise Palma to at least 46 development, and hold 3000 gold and 75 prestige. This time the mission has a harbour and a kingdom behind it."
 nd_mll_dest_fires_i_mercats: "Fires i Mercats"
 nd_mll_dest_fires_i_mercats_desc: "The villages of the plain live by their market days. King Sancho gave Sineu its fair in 1318, and the syndics of the Part Forana met by turns there and at Inca. A village with a market sells its own grain and is not at the mercy of the City's buyers.\n\nGive Manacor a Market Village and at least 29 development, raise Pollensa to at least 23 development, keep Market Villages in three of our locations, and hold stability at 75."
 nd_mll_dest_illes_menors: "Les Illes Menors"
 nd_mll_dest_illes_menors_desc: "Menorca and Ibiza are the kingdom too, and neither is a suburb of the City. Ciutadella governs Menorca from behind its own walls, and Ibiza lives by the salt that ships of every flag come to load.\n\nRaise Ciutadella to a town, give Ibiza a Carregador de Sal and at least 29 development, and hold 2000 gold."
 nd_mll_dest_regne_dins_la_mar: "A Kingdom in the Sea"
 nd_mll_dest_regne_dins_la_mar_desc: "James III lost his islands to his overlord and died at Llucmajor in 1349 trying to win them back. A kingdom whose villages feed it, man its walls and fill its musters need not end that way.\n\nBe no one's subject, raise Pollensa to a town with at least 36 development, raise Ciutadella to at least 54 development, and hold 75 prestige and 75 stability."
 nd_mll.8.t: "The City and the Kingdom at One Table"
 nd_mll.8.d: "The jurats have sat with the syndics of the villages through a whole season and nobody has left the hall in anger. It is a small thing, and it has not happened often. With the house in order the council can speak of what lies outside it: the sea roads the City wants and the fields the villages mean to keep."
 nd_mll.8.a: "Then let us look past the walls."
 nd_mll.8.a_tt: "The destiny paths can now be pursued."
 nd_mll.9.t: "The Consuls of the Sea"
 nd_mll.9.d: "On Saint John's Eve the merchants choose their consuls, and from the next morning any shipmaster with a quarrel over freight or a lost cargo may have it heard within days and by men who know the trade. Shippers from Genoa and Barbary have begun to write the court of Mallorca into their contracts."
 nd_mll.9.a: "The sea has its own law, and now its own judges."
 nd_mll.9.a_tt: "The City's merchants answer to a court of their own."
 nd_mll.10.t: "Market Day"
 nd_mll.10.d: "The carts come in before dawn. Grain, wine, pigs and rope change hands in the square, the syndics take their dues at a table by the church door, and by noon the tavern is full. A buyer from the City offers his usual price for wheat and is told, for the first time, to go and ask elsewhere."
 nd_mll.10.a: "Let him ask. The villages can wait."
 nd_mll.10.a_tt: "The market villages sell their own harvest."
 nd_mll.11.t: "The Banner over Bugia"
 nd_mll.11.d: "The town on the gulf is ours, with its wax, its hides and its road into the mountains. The merchants would rather have a treaty than a fortress: let the emir's people trade as before and pay their dues to our consul. The captains answer that a port held by leave of its neighbours is held until the next quarrel, and ask for a garrison and a squadron of galleys."
 nd_mll.11.a: "Treat with the emir. We came for the trade."
 nd_mll.11.a_tt: "More trade income and tolerance. Wars of religion win us less."
 nd_mll.11.b: "Garrison the rock and keep galleys in the bay."
 nd_mll.11.b_tt: "A cheaper fleet, faster garrisons and more prizes taken at sea."
 nd_mll.12.t: "The Islands and Their Councils"
 nd_mll.12.d: "Ciutadella has its walls and its market, and the salt quay of Ibiza is busy from spring to autumn. Both islands send to ask what they are to be. They have their own councils and want them kept, with their own fishermen and shepherds deciding what concerns them. The king's officers would sooner see one governor on each island who answers to the Crown alone."
 nd_mll.12.a: "Each island shall keep its own council."
 nd_mll.12.a_tt: "More wool and fuller granaries. Laws take longer to pass."
 nd_mll.12.b: "One governor for each island, and one law."
 nd_mll.12.b_tt: "Less separatism, more control, and the sea divides the realm less."
 nd_mll.13.t: "Charts of the Ocean Sea"
 nd_mll.13.d: "With a harbour on Gran Canaria the chart makers of the City can at last draw the ocean coast from their own pilots' reports. Dulcert's chart of 1339 and the great atlas of 1375 made their trade famous, and princes pay well for such work. The consuls must decide whether the new charts are goods to be sold or secrets to be kept."
 nd_mll.13.a: "Sell them to any prince who pays."
 nd_mll.13.a_tt: "Better margins and faster research. Our secrets travel with the charts."
 nd_mll.13.b: "Keep the pattern chart under the consuls' key."
 nd_mll.13.b_tt: "Less attrition at sea, cheaper explorers and longer colonial range."
 nd_mll.14.t: "No Lord but the King"
 nd_mll.14.d: "No overlord's officer waits in the harbour and no summons to a foreign court lies unanswered on the table. The villages paid for this in men and grain and they know it. Their captains ask that the parish companies be kept under arms and the rock castles in repair, since what was won can be claimed again. The syndics would rather see the men at home among the vines."
 nd_mll.14.a: "Keep the companies under arms."
 nd_mll.14.a_tt: "Levies recover faster and more forts can be kept. Neighbours grow wary."
 nd_mll.14.b: "Send the men home. The harvest will not wait."
 nd_mll.14.b_tt: "More wine and fruit, and peasants who can read."
 STATIC_MODIFIER_NAME_nd_mll_dest_pau_amb_l_emir: "Treaty with the Emir"
 STATIC_MODIFIER_DESC_nd_mll_dest_pau_amb_l_emir: "Bugia is held under a treaty. Its people trade as before and pay their dues to our consul. A kingdom bound by such a treaty cannot press a war of religion hard."
 STATIC_MODIFIER_NAME_nd_mll_dest_presidi_de_bugia: "Garrison of Bugia"
 STATIC_MODIFIER_DESC_nd_mll_dest_presidi_de_bugia: "Soldiers hold the rock and galleys lie in the bay. The squadron pays part of its keep in prizes."
 STATIC_MODIFIER_NAME_nd_mll_dest_universitats_de_les_illes: "A Council for Each Island"
 STATIC_MODIFIER_DESC_nd_mll_dest_universitats_de_les_illes: "Menorca and Ibiza govern their own flocks and granaries. Three councils are slower to agree than one."
 STATIC_MODIFIER_NAME_nd_mll_dest_governador_de_les_illes: "Governors of the Islands"
 STATIC_MODIFIER_DESC_nd_mll_dest_governador_de_les_illes: "A royal governor answers for each island, and the sea between them is treated as the king's road."
 STATIC_MODIFIER_NAME_nd_mll_dest_cartes_per_a_tothom: "Charts for Every Court"
 STATIC_MODIFIER_DESC_nd_mll_dest_cartes_per_a_tothom: "The chart makers sell to any prince who pays. Their shops prosper and learned men gather round them. What every court can buy is no secret."
 STATIC_MODIFIER_NAME_nd_mll_dest_cartes_sota_clau: "Charts under Lock and Key"
 STATIC_MODIFIER_DESC_nd_mll_dest_cartes_sota_clau: "The pattern chart is kept by the consuls and copied only for the kingdom's own pilots, who lose fewer ships and sail further for it."
 STATIC_MODIFIER_NAME_nd_mll_dest_viles_en_armes: "The Villages under Arms"
 STATIC_MODIFIER_DESC_nd_mll_dest_viles_en_armes: "The parish companies drill and the rock castles are kept in repair. The neighbours have noticed."
 STATIC_MODIFIER_NAME_nd_mll_dest_pau_entre_iguals: "The Men Sent Home"
 STATIC_MODIFIER_DESC_nd_mll_dest_pau_entre_iguals: "The musters are stood down. The vines and orchards have their hands back, and the parishes spend on schoolmasters what the companies would have cost."
 nd_mll_dest_obrador_de_bruixolers: "Obrador de Bruixolers"
 nd_mll_dest_obrador_de_bruixolers_desc: "The shop of a master of sea charts and compasses. Pilots home from a voyage come here to have the coast corrected on vellum, and leave with a needle that points true."
 nd_mll_dest_obrador_de_bruixolers_maintenance: "Vellum and Needles"
 nd_mll_dest_obrador_de_bruixolers_maintenance_desc: "Skins for the charts, paper for the drafts, pigments for the wind roses, and fine tools for the compass needles."

 # ===== BUREAUCRACIES =====
 mll_gran_i_general_consell_bureaucracy: "Gran i General Consell"
 mll_gran_i_general_consell_bureaucracy_desc: "The kingdom has no Corts. In their place sits the council created with the jurats in 1249, which since King Sancho's ruling of 1315 seats the villages beside the four estates of the City and lets them see how the common money is spent. It votes the kingdom's own taxes, sees to the wheat, and sends syndics to the king's court. After 1447 it counts 84 members, 56 for the City and 28 for the Part Forana, and nothing is decided unless two thirds of them are present."
 mll_juraria_bureaucracy: "Juraria"
 mll_juraria_bureaucracy_desc: "Six jurats, licensed by King James in 1249, govern the City and the Kingdom for one year, unpaid and forbidden to refuse: a knight who presides, two citizens, two merchants and one artisan. They sit in the Sala de la Juraria on the Plaça de Cort, defend the franchises against the king's officers, keep the common purse and buy the island's wheat. Since 1447 their names are drawn by lot from sacks of men approved beforehand, and much depends on who fills the sacks."
 mll_morberia_bureaucracy: "Morberia"
 mll_morberia_bureaucracy_desc: "A board of health created by the Gran i General Consell in 1467 and given its statutes in 1475, after plague had come by sea too often. No ship may land people or goods without the leave of the morbers. Crews under suspicion keep quarantine, at first in the towers of Portopí, and a lazaretto was agreed in 1497."
 mll_collegi_de_la_mercaderia_bureaucracy: "Col·legi de la Mercaderia"
 mll_collegi_de_la_mercaderia_bureaucracy_desc: "The college of the merchants of the City, given its first rule in 1403 and its own revenue by King Martin in 1409: a penny on goods passing through the port. Two defenders of the merchandise, a treasurer and a council of twenty merchants spend it on the mole, the harbour of Portopí and its towers. Knights are shut out, and more than one has laid down his rank to be elected."

 # The auto modifier that grants the country's slots on formation
 AUTO_MODIFIER_NAME_nd_mll_bureaucracy_authority: "Offices of the City and Kingdom of Mallorca"
 AUTO_MODIFIER_DESC_nd_mll_bureaucracy_authority: "Two institutions of the kingdom of Mallorca can be kept at once, chosen among the Gran i General Consell, the Juraria, the Morberia and the Col·legi de la Mercaderia."
