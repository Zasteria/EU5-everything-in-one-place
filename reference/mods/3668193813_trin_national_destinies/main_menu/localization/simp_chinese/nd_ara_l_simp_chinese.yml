l_simp_chinese:
 # ===== Timed modifiers =====
 STATIC_MODIFIER_NAME_nd_ara_reino_en_su_tierra: "The Kingdom in Its Own Land"
 STATIC_MODIFIER_DESC_nd_ara_reino_en_su_tierra: "The king keeps his court at Zaragoza and governs with the four arms of the Cortes. The barons and the frontier towns turn out for a kingdom that is theirs, and the crown asks before it commands."
 STATIC_MODIFIER_NAME_nd_ara_cabeza_de_la_corona: "Head of the Crown"
 STATIC_MODIFIER_DESC_nd_ara_cabeza_de_la_corona: "Aragon gives its name and its crown to a house that rules many realms, each by its own law. The dynasty is honoured abroad and obeyed overseas; at home the barons count what the sea costs them."
 STATIC_MODIFIER_NAME_nd_ara_obediencia_de_peniscola: "Obedience of Peñíscola"
 STATIC_MODIFIER_DESC_nd_ara_obediencia_de_peniscola: "The kingdom holds to its own pope on his rock above the sea. Its clergy are of one mind, and the rest of Christendom calls it schismatic."
 STATIC_MODIFIER_NAME_nd_ara_sustraccion_de_obediencia: "Obedience Withdrawn"
 STATIC_MODIFIER_DESC_nd_ara_sustraccion_de_obediencia: "The kingdom has left Benedict XIII to his rock and joined the council that ended the Schism. Every court in Europe is grateful. The old pope's canons and kinsmen are not."
 STATIC_MODIFIER_NAME_nd_ara_expulsion_de_los_moriscos: "The Moriscos Expelled"
 STATIC_MODIFIER_DESC_nd_ara_expulsion_de_los_moriscos: "The decree has been carried out. There is one faith in the kingdom, and along the Ebro the water runs past fields that nobody is left to work."
 STATIC_MODIFIER_NAME_nd_ara_vasallos_amparados: "The Lords' Vassals Sheltered"
 STATIC_MODIFIER_DESC_nd_ara_vasallos_amparados: "The lords have kept their Morisco vassals. The channels are cleaned, the rents are paid, and the Inquisition writes long letters to the court."
 STATIC_MODIFIER_NAME_nd_ara_guerra_y_cuchillo: "War to the Knife"
 STATIC_MODIFIER_DESC_nd_ara_guerra_y_cuchillo: "Every house is a redoubt and no street is given up while one neighbour of it lives. The besieger bleeds for each wall, and the city bleeds with him."
 STATIC_MODIFIER_NAME_nd_ara_ejercito_de_reserva: "An Army Kept in the Field"
 STATIC_MODIFIER_DESC_nd_ara_ejercito_de_reserva: "The army was not shut up inside the walls. It holds the hills and the roads, fed by every village, and grows with each month of the war. The capital remembers who stayed and who marched out."

 # ===== Formation event =====
 nd_ara.1.t: "The Crown at La Seo"
 nd_ara.1.d: "The bells of La Seo ring over Zaragoza. Before the altar where the kings of Aragon have been crowned since the days of the Reconquest, a new king kneels, and before he rises he must swear: to keep the Fueros, to judge no man outside the law of the land, to honour the Justicia who stands between the crown and its subjects. Only then do the four arms of the kingdom acknowledge him. From the Pyrenean valleys to the sierras of Teruel the old kingdom has one lord again.\n\nIt was never a kingdom that agreed on what it was for. Its barons want a king who lives among them, holds the Castilian march and the passes, and spends Aragonese money on Aragonese ground. Its dynasty has always looked the other way, down the Ebro to the sea, where crowns are to be had for a house bold enough to take them, and where Aragon is the oldest title among many.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ara.1.d.crown: "At his coronation in La Seo of Zaragoza, Peter the Ceremonious would not let the archbishop set the crown on his head. He took it from the altar and crowned himself, so that no one could say he held it of any power on earth. It was an Aragonese crown, taken in the Aragonese capital under an Aragonese oath, and it sits on the head of a house whose money is counted in Barcelona and whose ambitions lie in Sardinia, Sicily and beyond.\n\nThe kingdom that gives the Crown its name has always known it. In 1283 its barons formed a Union and forced the General Privilege from a king who had conquered Sicily without asking them. They will pay for the Castilian march, the passes and their own walls. For wars beyond the sea they have never seen why they should pay at all. Sooner or later every king of this house must settle what Aragon is: the land he rules from, or the title he rules by.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ara.1.a: "A king of Aragon lives in Aragon and rules with its estates."
 nd_ara.1.b: "Aragon is the first of our crowns. It will not be the last."
 nd_ara.1.a_tt: "The barons and the frontier turn out for you, and the crown's own hand is weaker."
 nd_ara.1.b_tt: "Subjects and foreign courts honour the dynasty, and the Aragonese barons resent the cost."
 nd_ara_formed_tt: "Aragon has been formed"
 nd_ara_path_a_tt: "Chose the Kingdom in Its Own Land"
 nd_ara_path_b_tt: "Chose the Head of the Crown"
 nd_ara_gabinete_needs_library_tt: "A library stands in this location"

 # ===== Advance events =====
 nd_ara.2.t: "The Villages Without the Town"
 nd_ara.2.d: "When Alfonso the Battler took the valleys of the Jalón and the Jiloca he had more land than men. He gave the frontier to anyone who would hold it, under fueros so generous that a murderer who settled at Calatayud could not be pursued there. Each town was granted a territory of a hundred villages or more to rule and to tax.\n\nThe villages did the fighting and the paying, and in time they would no longer do it for the town's benefit. One community after another obtained from the king its separation: its own assembly, the plega, where every village had a voice; its own chest; its own officers chosen for the year; its own seat in the Cortes beside the cities. The towns of Calatayud, Daroca, Teruel and Albarracín kept their walls and their names. The land around them governs itself, pays the king directly and sends him its own companies. On a frontier that every lord in Castile covets, no one has found a cheaper way to keep it."
 nd_ara.2.a: "Let the villages keep their chest and their banner."
 nd_ara.2.a_tt: "The communities of the southern march are part of the kingdom's fabric."
 nd_ara.3.t: "The War of the Two Peters"
 nd_ara.3.d: "Peter of Castile has crossed the border with the largest army in Spain. Tarazona has fallen, then Calatayud after a siege its citizens sustained alone for months, then Teruel. The king of Aragon has little money and fewer knights; his barons argue over the price of their service while the Castilians burn the valley of the Jalón.\n\nWhat stands in the way is the towns. The sobrejunteros call out the hosts of the juntas. Daroca shuts its gates, holds, and is made a city for it. The commoner horsemen of the communities, men who keep a horse because the fuero frees them from tax for it, ride down foragers and cut the roads behind the invader. The war drags on for nearly twenty years and ends in Castile's own civil strife. When the accounts are drawn up, the kingdom finds that it was saved by people it had never thought of as soldiers."
 nd_ara.3.a: "The towns have earned their privileges twice over."
 nd_ara.3.a_tt: "The hosts of the frontier towns are part of the kingdom's defence."
 nd_ara.4.t: "The Pope of the Rock"
 nd_ara.4.d: "Pedro de Luna was born in the castle of Illueca, taught canon law at Montpellier, and in 1394 was elected pope at Avignon as Benedict XIII. He promised to resign if that would heal the Schism. He has not resigned. France has besieged him in his own palace, the Council of Pisa has deposed him, and now the Council of Constance, with the Emperor behind it, demands the same. He answers from the fortress of Peñíscola, a rock joined to the coast by a strip of sand, that the only cardinal alive who was created before the Schism began is himself, and that the true Church is therefore wherever he is. \"This is Noah's Ark,\" he says.\n\nHe is Aragonese, of one of the kingdom's great houses. His hand was felt at Caspe when the succession was settled, and half the bishops of the realm owe him their sees. The Emperor has come to Perpignan in person to ask the king to abandon him."
 nd_ara.4.a: "He is the true pope, and he is ours. We keep faith with Peñíscola."
 nd_ara.4.b: "The Church must be one again. We withdraw our obedience."
 nd_ara.4.a_tt: "The clergy stand with the crown, and Christendom calls the kingdom schismatic."
 nd_ara.4.b_tt: "Every court is grateful, and the old pope's party at home is not."
 nd_ara.5.t: "The Germans of the Calle de la Imprenta"
 nd_ara.5.d: "A Fleming named Matthew set up the first press in Zaragoza in 1475 and printed a manual for parish priests. He did not stay. The men who did were Pablo and Juan Hurus, from Constance on the lake, who came as merchants in the German trade and saw another business to be had.\n\nThey bring type cut in the German manner and, what no other printer in Spain has, woodblocks: whole series bought or copied from Augsburg, Ulm and Lyon. A reader in Zaragoza can now open Aesop, Boccaccio's famous women or a pilgrim's journey to the Holy Land and find a picture on every other leaf. The Fueros of the kingdom come off the same press, and in 1499 the first history of Aragon written in the common tongue. When Pablo goes home, his foreman Jorge Coci keeps the shop, and for thirty years more its books are the handsomest printed in the peninsula."
 nd_ara.5.a: "Print the Fueros. Every court in the kingdom should own them."
 nd_ara.5.a_tt: "The press of Zaragoza is at work."
 nd_ara.6.t: "The Vassals of the Lords"
 nd_ara.6.d: "Seventy thousand people in this kingdom, one in six, are New Christians of Moorish descent. Their fathers were baptised by decree in 1526. They live where they have always lived, on the irrigated land of the Ebro, the Jalón and the Huerva, as vassals of the Count of Aranda, the Duke of Villahermosa, the Count of Fuentes. They keep the water channels, grow the fruit and the garden crops, fire the pottery of Muel, and pay their lords dues that no Old Christian would pay. \"He who has Moors has gold,\" the saying goes.\n\nValencia's Moriscos were shipped out last autumn. Now the order has come for Aragon: all of them, within the season, by the Pyrenean passes or the port of Los Alfaques. The Inquisition says they never ceased to be Moors. The lords have sent an embassy to court to say that their vassals are peaceable, that the kingdom's laws forbid exile without trial, and that the estates of half the nobility will be worthless in a year."
 nd_ara.6.a: "The decree stands. They go."
 nd_ara.6.b: "The kingdom's law protects them. Hear the lords."
 nd_ara.6.a_tt: "One faith and a contented Church, and the best land of the Ebro left untilled."
 nd_ara.6.b_tt: "The lords and the harvest are safe, and the Church takes it as an affront."
 nd_ara.7.t: "The Kingdom's Own Tercios"
 nd_ara.7.d: "Catalonia has gone over to the King of France. French armies have already crossed the Cinca once and taken Monzón. For the first time in three centuries Aragon is a frontier again. The king has come to Zaragoza in person and summoned the Cortes.\n\nThe four arms sit for more than a year. They will not give the money to the king's treasurers, who would spend it in Flanders. What they vote instead is men: two thousand foot in tercios of the kingdom, raised town by town and community by community, officered by Aragonese gentlemen, paid by the Diputación from its own customs, and bound to serve on the kingdom's own border and nowhere else. The king accepts. It is less than he asked and more than he has had from any other realm of his crown."
 nd_ara.7.a: "Raised by the kingdom, paid by the kingdom, to defend the kingdom."
 nd_ara.7.a_tt: "The Cortes have voted soldiers on their own terms."
 nd_ara.8.t: "The Fountain of the Unbelievers"
 nd_ara.8.d: "Charles V began a great channel from the Ebro at Tudela to water the plain of Zaragoza. It never reached the city. For two hundred years it silted, broke its banks and was patched, and a company that took it over on borrowed Dutch money went bankrupt.\n\nIn 1771 the works were given to Ramón Pignatelli, a canon of the cathedral and a count's son, who knew some mathematics and feared nobody. He rebuilt the weir, carried the channel over the Jalón on an aqueduct of stone, and cut locks so that barges could come down from Navarre. Engineers said the water would never climb to Zaragoza. On the feast of Saint John in 1784 it arrived. Pignatelli had a fountain raised on the bank, and cut into it in Latin: \"For the conviction of the unbelieving and the ease of travellers.\" Wheat now grows where there was esparto grass, and barges load at the wharf of Casablanca for Tudela."
 nd_ara.8.a: "Let the unbelievers come and drink."
 nd_ara.8.a_tt: "The Canal Imperial is finished."
 nd_ara.9.t: "The City That Would Not Surrender"
 nd_ara.9.d: "Zaragoza has no fortress. It has a medieval wall of brick and earth, a ring of convents, and fifty thousand people who rose in May, armed themselves from the Aljafería and put a young brigadier named Palafox at their head. The French general expected to dine in the city on the day he arrived. Summoned to yield, Palafox sent three words: \"War to the knife.\"\n\nThe parishes have formed their own companies under priests, farmers and shopkeepers. At the Portillo gate, when every gunner was down, a girl took the match from a dead man's hand and fired the gun into the column. The enemy is inside the walls now, and fights for one house at a time, through the party walls, by mine and bayonet. Fever is killing more than the French are.\n\nThere is still an army. It could be kept in the city to defend every street to the end, or sent out while the roads are open, to hold the country and come back."
 nd_ara.9.a: "War to the knife. Not one house without a fight."
 nd_ara.9.b: "Save the army. A city can be retaken, and soldiers cannot."
 nd_ara.9.a_tt: "Every wall is defended and the besieger bleeds, at a terrible cost to the city."
 nd_ara.9.b_tt: "The army grows in the hills, and the capital remembers that it marched out."

 # ===== Advances: age 1 =====
 nd_ara_comunidades_de_aldeas: "Communities of Villages"
 nd_ara_comunidades_de_aldeas_desc: "The villages of the southern march have won their separation from the towns that ruled them. Grouped in #italic sesmas#!, governed by a general assembly and seated in the Cortes in their own right, the communities of Calatayud, Daroca, Teruel and Albarracín tax themselves, answer to the king alone and send their own companies to the frontier."
 nd_ara_casa_de_ganaderos: "Casa de Ganaderos"
 nd_ara_casa_de_ganaderos_desc: "By a privilege of James I in 1218 the stock breeders of Zaragoza are a body of their own. They elect a #italic Justicia#! who tries rustlers on the spot and keeps a gallows on the road to San Gregorio, and their flocks may graze every open pasture in the kingdom. The lesser towns have their #italic ligallos#! on the same model."
 nd_ara_caballerias_de_honor: "Caballerías de Honor"
 nd_ara_caballerias_de_honor_desc: "The king grants his great barons, the #italic ricoshombres#!, the revenues of towns in lots called #italic caballerías#!. Each lot is worth five hundred sueldos and owes him one knight, armed and mounted, for the season. Beside them ride the #italic mesnaderos#!, the knights of his own household."
 nd_ara_alarifes_mudejares: "Mudéjar Master Builders"
 nd_ara_alarifes_mudejares_desc: "The Ebro valley has clay and little stone, and the men who know how to build with clay are Muslims who stayed after the conquest. Their #italic alarifes#! raise the kingdom's churches and palaces in brick, carved plaster, painted timber and green and purple tile. A bell tower in Teruel is a minaret that has learned to carry bells."
 nd_ara_cuatro_brazos: "The Four Arms"
 nd_ara_cuatro_brazos_desc: "Every other realm of the Crown calls three estates to its Cortes. Aragon calls four: the great barons, the knights and squires, the Church, and the towns with the communities. The lesser nobility sit and vote apart from the magnates, and a king who knows his business can have one arm of the nobility answer the other."

 # ===== Advances: age 2 =====
 nd_ara_huestes_concejiles: "Hosts of the Towns"
 nd_ara_huestes_concejiles_desc: "When Castile invades, it is the towns that hold. The #italic sobrejunteros#! call out the hosts of the juntas, and the commoner horsemen of the frontier, townsmen whom the fuero frees from tax for keeping a horse and arms, ride with them. They are not knights, and they have beaten knights."
 nd_ara_azafran_de_aragon: "Saffron of Aragon"
 nd_ara_azafran_de_aragon_desc: "The dry plains of the Jiloca and the middle Ebro grow the costliest crop in Europe, weighed by the ounce and sealed by sworn inspectors. German trading companies keep agents in Zaragoza for the October harvest, and what they pay for it comes back as silver, cloth and, in time, printing presses."
 nd_ara_papa_luna: "Papa Luna"
 nd_ara_papa_luna_desc: "Pedro Martínez de Luna of Illueca, canon lawyer and cardinal, is elected pope at Avignon in 1394 as Benedict XIII. Half of Christendom calls him antipope. In his own kingdom he fills the sees, endows the schools and has La Seo crowned with a Mudéjar lantern, and he will die at ninety-four on the rock of Peñíscola without having yielded an inch."
 nd_ara_estudio_general_de_huesca: "Estudio General of Huesca"
 nd_ara_estudio_general_de_huesca_desc: "In 1354 Peter the Ceremonious founds a school of all the faculties at Huesca, in the old palace of the kings, so that Aragonese need no longer go to Lleida or Montpellier to learn their own law. Later ages will call it the Sertoriana, after the academy that Sertorius is said to have kept in the same city."

 # ===== Advances: age 3 =====
 nd_ara_imprenta_de_los_hurus: "The Hurus Press"
 nd_ara_imprenta_de_los_hurus_desc: "Pablo and Juan Hurus of Constance make Zaragoza one of the first presses of Spain. Their books carry German woodcuts on every other leaf, and from their shop come the Fueros of the kingdom and the first history of Aragon in the common tongue."
 nd_ara_alabastro_del_ebro: "Alabaster of the Ebro"
 nd_ara_alabastro_del_ebro_desc: "The stone of Gelsa and Fuentes can be cut with a knife when it leaves the quarry and takes a polish like marble. Gil Morlanes and Damián Forment carve it into altarpieces as tall as a house, the Pilar's first among them, and every chapter in the kingdom wants one."
 nd_ara_espadas_del_perrillo: "Swords of the Little Dog"
 nd_ara_espadas_del_perrillo_desc: "Julián del Rey, a Moorish swordsmith who took baptism, signs his blades with a small running dog. Short, broad and hard to break, the swords of the #italic perrillo#! are known wherever Spanish is spoken, and the smiths of Zaragoza have trade enough for a street of their own."
 nd_ara_observancias_del_reino: "Observances of the Kingdom"
 nd_ara_observancias_del_reino_desc: "The Fueros say what the Cortes enacted. They do not say how the courts have read them. In 1437 the Justicia Martín Díez de Aux sets the usages of the kingdom's tribunals down in nine books, and the #italic Observancias#! are held as law beside the Fueros themselves."

 # ===== Advances: age 4 =====
 nd_ara_guardia_del_reino: "Guardia del Reino"
 nd_ara_guardia_del_reino_desc: "Bandits hold the mountain roads, and the king's officers may not cross a lordship's bounds in pursuit. The Diputación raises its own companies of horse and foot, paid from the kingdom's customs and answering to the kingdom alone, to ride down highwaymen wherever they run."
 nd_ara_derecho_de_manifestacion: "Right of Manifestation"
 nd_ara_derecho_de_manifestacion_desc: "Any prisoner in Aragon may appeal to the Justicia to be \"manifested\". The king's judges must then hand him over, and he is lodged in the Justicia's own prison, where no one may put him to torture, until a lawful sentence is shown. Foreigners write of it with astonishment."
 nd_ara_vasallos_moriscos: "Morisco Vassals"
 nd_ara_vasallos_moriscos_desc: "One Aragonese in six is a Morisco. They are settled thick on the watered land of the Ebro and its tributaries as vassals of the great lords, who protect them because they pay more than any Christian tenant would. Their potters at Muel fire a tableware that shines like gold."
 nd_ara_zaragoza_la_harta: "Zaragoza the Well Fed"
 nd_ara_zaragoza_la_harta_desc: "The council builds a merchants' exchange whose vault stands on columns like a palm grove. Bankers such as Gabriel Zaporta, who lends to the Emperor, raise brick palaces with arcaded galleries under deep carved eaves. Travellers call the city #italic la harta#!, the well fed."

 # ===== Advances: age 5 =====
 nd_ara_servicio_de_armas: "Servicio de Armas"
 nd_ara_servicio_de_armas_desc: "With a French army in Catalonia, the Cortes vote the king soldiers in place of money: tercios raised, officered and paid by the kingdom itself, sworn to defend its own border and to serve nowhere else."
 nd_ara_circulo_de_lastanosa: "Lastanosa's Circle"
 nd_ara_circulo_de_lastanosa_desc: "Vincencio Juan de Lastanosa of Huesca has filled his house with thousands of books, cabinets of coins and cameos, an armoury, fossils, lenses and a garden of plants from both Indies. Poets, antiquaries and Jesuits come to stay, and Baltasar Gracián's books are printed at his expense."
 nd_ara_arbitristas_aragoneses: "Aragonese Arbitristas"
 nd_ara_arbitristas_aragoneses_desc: "The guilds petition the Cortes to shut out French cloth so that the kingdom may clothe itself. The chronicler Dormer answers in print that a land with no sea needs trade more than it needs walls. The duties go up, the looms of Zaragoza and Albarracín find work, and the argument runs for a generation."
 nd_ara_polvora_de_villafeliche: "Powder of Villafeliche"
 nd_ara_polvora_de_villafeliche_desc: "Along a single irrigation channel at Villafeliche on the Jiloca stand close to two hundred small water mills, each grinding saltpetre, sulphur and charcoal. It is the largest powder works in Spain, and the king's artillery is seldom short."

 # ===== Advances: age 6 =====
 nd_ara_proyecto_de_pignatelli: "Pignatelli's Canal"
 nd_ara_proyecto_de_pignatelli_desc: "Canon Ramón Pignatelli takes charge of the Emperor's ruined channel and rebuilds it from the weir down: a hundred and ten kilometres from Tudela to below Zaragoza, with locks for barges and an aqueduct over the Jalón. The water arrives in 1784, against the opinion of every engineer who had said it could not."
 nd_ara_voluntarios_de_aragon: "Volunteers of Aragon"
 nd_ara_voluntarios_de_aragon_desc: "In 1762 hunters, muleteers and smugglers of the Pyrenean valleys are formed into a regiment that fights in open order, aims its fire and marches where the line cannot follow. It is the first light infantry the army has raised, and its men wear the kingdom's name."
 nd_ara_los_sitios: "The Sieges"
 nd_ara_los_sitios_desc: "A city without modern walls holds a French army for two months, and then a second and larger one for two months more, parish by parish and house by house. When Zaragoza falls there is little left of it to occupy, and all Europe has learned its name."
 nd_ara_academia_de_san_luis: "Academy of San Luis"
 nd_ara_academia_de_san_luis_desc: "The drawing school where José Luzán taught a gilder's son from Fuendetodos named Francisco de Goya becomes, in 1792, the Royal Academy of Fine Arts of San Luis, with chairs of painting, sculpture and architecture and prizes awarded every year."
 nd_ara_partido_aragones: "The Aragonese Party"
 nd_ara_partido_aragones_desc: "Round the Count of Aranda, president of the Council of Castile and for fourteen years ambassador in Paris, gather the soldiers and grandees of the old Crown. They hold that the realm is better served by men who have commanded armies than by lawyers who have only copied decrees."

 # ===== Units and levies =====
 a_nd_ara_mesnaderos: "Mesnaderos"
 a_nd_ara_mesnaderos_desc: "Knights of the king's household and of the barons' fees: mailed, well mounted and raised on a frontier where a charge is pressed home."
 levy_nd_ara_mesnaderos: "Mesnadero Levy"
 levy_nd_ara_mesnaderos_desc: "Aragonese nobles serving for the caballerías they hold of the king."
 a_nd_ara_caballeros_villanos: "Caballeros Villanos"
 a_nd_ara_caballeros_villanos_desc: "Commoner horsemen of the frontier towns. They are light, quick on the wings and used to raiding. They are not knights, and do not stand a knights' charge for long."
 levy_nd_ara_caballeros_villanos: "Caballeros Villanos Levy"
 levy_nd_ara_caballeros_villanos_desc: "Aragonese townsmen who keep a horse and arms under the frontier fueros."
 a_nd_ara_guardia_del_reino: "Guardia del Reino"
 a_nd_ara_guardia_del_reino_desc: "The Diputación's own riders, who know every track and ford of the kingdom. They are quick to turn a flank and quick to be gone, and are armed for a pursuit more than for a pitched battle."
 a_nd_ara_tercio_del_reino: "Tercio del Reino"
 a_nd_ara_tercio_del_reino_desc: "Foot raised, officered and paid by the kingdom, sworn to serve on its own border. Men defending the next valley to their own do not run."
 levy_nd_ara_tercio_del_reino: "Tercio del Reino Levy"
 levy_nd_ara_tercio_del_reino_desc: "Aragonese of every town and community, raised by the vote of the Cortes."
 a_nd_ara_voluntarios_de_aragon: "Voluntarios de Aragón"
 a_nd_ara_voluntarios_de_aragon_desc: "Light infantry of the Pyrenean valleys: open order, aimed fire and a fast march over broken ground. A light regiment musters fewer men than one of the line."
 a_nd_ara_escopeteros: "Escopeteros de las Parroquias"
 a_nd_ara_escopeteros_desc: "The gunmen of a city under siege, each parish in its own company. They shoot from windows, roofs and garden walls, and every shot is aimed."
 levy_nd_ara_escopeteros: "Parish Escopetero Levy"
 levy_nd_ara_escopeteros_desc: "Aragonese of every condition, armed by parish to defend their own streets."

 # ===== Buildings and production methods =====
 nd_ara_casa_de_la_comunidad: "Casa de la Comunidad"
 nd_ara_casa_de_la_comunidad_desc: "The house where the villages of a community meet in general assembly, keep their chest and their charters, and muster their companies. The town whose name the community bears has no voice in it."
 nd_ara_casa_de_la_comunidad_maintenance: "Chest and Banner"
 nd_ara_casa_de_la_comunidad_maintenance_desc: "The assembly's records, and arms, harness and rations for the companies the villages owe the frontier."
 nd_ara_ligallo: "Ligallo"
 nd_ara_ligallo_desc: "The stock breeders' brotherhood of an Aragonese town. It keeps the brand book, returns strays, hires the shepherds for the summer drive to the mountains and tries rustlers before a judge of its own."
 nd_ara_ligallo_maintenance: "Salt and Shears"
 nd_ara_ligallo_maintenance_desc: "Salt for the flocks, shears for the clip and hurdles for the folds."
 nd_ara_alfar_mudejar: "Alfar Mudéjar"
 nd_ara_alfar_mudejar_desc: "A Mudéjar kiln yard at the edge of the walls, where clay from the river bank becomes brick for towers and glazed tile to set into them."
 nd_ara_alfar_ladrillo_y_azulejo: "Brick and Glazed Tile"
 nd_ara_alfar_ladrillo_y_azulejo_desc: "Fired brick for walls and vaults, with green and purple lead-glazed tile for the bands and stars that are set into them."
 nd_ara_alfar_loza_de_muel: "Lustreware of Muel"
 nd_ara_alfar_loza_de_muel_desc: "White-glazed tableware painted with a lustre that fires to the colour of gold, in the manner of the Morisco potters of Muel."
 nd_ara_azafranal: "Azafranal"
 nd_ara_azafranal_desc: "A saffron field and its drying floor. The crocus flowers for two weeks in October. Every flower is picked before noon, and its three threads are pulled by hand the same night and toasted over embers."
 nd_ara_azafranal_rosa_del_azafran: "The Saffron Rose"
 nd_ara_azafranal_rosa_del_azafran_desc: "Picking, stripping and toasting: a hundred and fifty thousand flowers for a single kilogram of threads."
 nd_ara_taller_de_alabastro: "Taller de Alabastro"
 nd_ara_taller_de_alabastro_desc: "A carvers' workshop: a master, a dozen journeymen, blocks carted up from the quarries of the lower Ebro, and altarpieces contracted years ahead."
 nd_ara_taller_de_alabastro_maintenance: "Blocks and Chisels"
 nd_ara_taller_de_alabastro_maintenance_desc: "Quarried stone, carving irons and timber for scaffolds and crates."
 nd_ara_espaderia: "Espadería"
 nd_ara_espaderia_desc: "A swordsmiths' street, where forgers, grinders, hilt makers and scabbard makers each keep their own trade and their own mark."
 nd_ara_espaderia_hojas_del_perrillo: "Blades of the Little Dog"
 nd_ara_espaderia_hojas_del_perrillo_desc: "Bar iron from Albarracín and the Moncayo, forged over charcoal into short broad blades and fitted with leather grips and scabbards."
 nd_ara_carcel_de_manifestados: "Cárcel de Manifestados"
 nd_ara_carcel_de_manifestados_desc: "The Justicia's own prison. A prisoner who has himself manifested is lodged here, out of reach of the king's officers, until a lawful sentence is shown. Every estate rests easier for it, and the crown's hand is weaker."
 nd_ara_carcel_de_manifestados_maintenance: "Court and Keep"
 nd_ara_carcel_de_manifestados_maintenance_desc: "Paper and law books for the Justicia's lieutenants, the prisoners' keep and the guard's arms."
 nd_ara_gabinete_de_curiosidades: "Gabinete de Curiosidades"
 nd_ara_gabinete_de_curiosidades_desc: "A learned gentleman's collection opened to visitors: books and manuscripts, coins and medals, armour, shells, fossils, lenses and clocks, with a garden of foreign plants behind the house."
 nd_ara_gabinete_de_curiosidades_maintenance: "The Collection"
 nd_ara_gabinete_de_curiosidades_maintenance_desc: "New books, glass cases and lenses, paper for the catalogue and the occasional cameo."
 nd_ara_canal_imperial: "Canal Imperial"
 nd_ara_canal_imperial_desc: "A reach of the great canal along the right bank of the Ebro, with its locks, aqueducts and sluice houses. It waters the fields below it and carries grain barges to the city's wharf."
 nd_ara_canal_imperial_maintenance: "Banks and Lock Gates"
 nd_ara_canal_imperial_maintenance_desc: "Masonry for the banks, and tools and timber for the lock gates."

 # ===== Destiny tree =====
 nd_ara_dest_comunidades_tt: "At least 4 of our locations have a Casa de la Comunidad"
 nd_ara_dest_alfares_tt: "At least 3 of our locations have an Alfar Mudéjar"
 nd_ara_dest_espaderias_tt: "At least 3 of our locations have an Espadería"
 nd_ara_dest_zaragoza_45_tt: "We own Zaragoza and it has at least 45 development"
 nd_ara_dest_zaragoza_60_tt: "We own Zaragoza and it has at least 60 development"
 nd_ara_destiny: "The Oath Before the Justicia"
 nd_ara_destiny_desc: "No king of Aragon is acknowledged until he has sworn the Fueros in La Seo of Zaragoza. Hold the kingdom steady, and then decide what the oath was for. The path chosen at the formation of the kingdom opens from here: the Kingdom in Its Own Land, or the Head of the Crown."
 nd_ara_dest_extremadura: "The Extremadura of Aragon"
 nd_ara_dest_extremadura_desc: "The southern march was won by Alfonso the Battler and held by its own villages, which governed themselves in four communities. Raise a Casa de la Comunidad in four locations, and take Molina, which the Battler conquered in 1129 and which gave itself to Peter the Ceremonious in 1369 rather than serve a French captain. It has been called Molina de Aragón ever since."
 nd_ara_dest_corte_en_zaragoza: "The Court at Zaragoza"
 nd_ara_dest_corte_en_zaragoza_desc: "A king who lives in Aragon holds the Castilian march himself and builds where he lives. Take Soria, which the Battler repeopled and Castile kept at his death. Grow Zaragoza to 45 development, half as much again as the town of 1337, set Mudéjar kilns to work in three locations for the brick and tile of its towers, and keep 2,000 gold in the treasury."
 nd_ara_dest_aragon_y_pamplona: "King of Aragon and Pamplona"
 nd_ara_dest_aragon_y_pamplona_desc: "From 1076 to 1134 one king ruled Aragon and Navarre, and the two parted at the Battler's death. Bring Pamplona and Tudela under the crown, by conquest or as the land of a subject. Grow Zaragoza to 60 development, twice the town of 1337, keep sword forges at work in three locations, and hold 3,000 gold and 75 prestige. The kings of Aragon will have a palace worthy of them in the Aljafería."
 nd_ara_dest_cerdena_y_corcega: "The Kingdom of Sardinia and Corsica"
 nd_ara_dest_cerdena_y_corcega_desc: "In 1297 the pope made James II king of two islands he did not hold. Half of Sardinia has been taken since. Finish it: bring in Oristano, the seat of the judges of Arborea, and Castelsardo, the rock of the Doria, and plant the crown in Corsica at Bonifacio, where no king of Aragon ever ruled. The land of a subject counts as ours."
 nd_ara_dest_trinacria: "Trinacria"
 nd_ara_dest_trinacria_desc: "Sicily has had kings of a younger branch of the house since 1296. In 1392 Martin the Younger landed with an army to take it from its barons, and at his death in 1409 it passed to the crown for good. Bring Messina, Catania and Syracuse under the crown or under a subject of it, with 50 prestige and 2,000 gold."
 nd_ara_dest_el_magnanimo: "The Magnanimous"
 nd_ara_dest_el_magnanimo_desc: "Alfonso V carried the house to the mainland of Italy and beyond it. Hold Gaeta, his first foothold in the kingdom of Naples, Malta at the end of Sicily, and Krujë in Albania, where Skanderbeg swore fealty to him in 1451; a vassal's land counts, as it did then. Embrace the Renaissance that his court lived by, and hold 3,000 gold and 75 prestige. The king's castellans will keep the harbours of his realms from a Castillo Aragonés."

 # ===== Destiny events =====
 nd_ara.10.t: "The Oath Before the Justicia"
 nd_ara.10.d: "The formula the Aragonese liked to repeat was never spoken in La Seo, and everyone in the kingdom believed it had been: we, who are worth as much as you, make you our king, on condition that you keep our laws and liberties; and if not, not. What the king does swear is plainer and binds him as tightly. He will keep the Fueros, and the Justicia will judge between him and his subjects.\n\nThe kingdom is quiet and the oath is taken. What remains is the old question of what a king of Aragon is for."
 nd_ara.10.a: "And if not, not."
 nd_ara.10.a_tt: "The destiny of Aragon lies open in the Traditions tab."
 nd_ara.11.t: "The Communities of the March"
 nd_ara.11.d: "The villages of Calatayud, Daroca, Teruel and Albarracín meet in their own assemblies, keep their own chest and send their own men to the Cortes. They owe the towns above them nothing and the frontier everything, and when the summons comes their companies are on the road before the barons have finished arguing about precedence.\n\nNow the march has its last piece. Molina, which would not have a French captain for its lord, has a king of Aragon instead, and has taken his kingdom's name for its own."
 nd_ara.11.a: "The march is whole, and it guards itself."
 nd_ara.11.a_tt: "The communities of the southern march stand behind the crown."
 nd_ara.12.t: "The Court at Zaragoza"
 nd_ara.12.d: "The king winters in the Aljafería and the city has grown fat on it. Brick towers striped with green tile rise over every parish, the bridge is crowded with carts, and Soria answers to officers who ride out from Zaragoza and are back within the week.\n\nA court that stays in one place must lean on someone. The citizens point to the privilege the Battler gave them in 1129, by which twenty sworn men may take the city's justice into their own hands. The king's chamberlains point to the Ordinances of the Household, which set down every office of the palace and what each is owed."
 nd_ara.12.a: "Confirm the Privilege of the Twenty."
 nd_ara.12.a_tt: "The towns grow and obey, with the citizens of Zaragoza as the crown's allies."
 nd_ara.12.b: "Order the household as the Ceremonious did."
 nd_ara.12.b_tt: "The court is splendid and cheap to staff, and the galleys are left to rot."
 nd_ara.13.t: "King of Aragon and Pamplona"
 nd_ara.13.d: "For the first time since the Battler died at Poleñino, one king's writ runs from the passes of Roncesvalles to the sierras of Teruel. He had no son and left his kingdom to three military orders; his barons would not have it, and the Navarrese went home and chose a king of their own. Generations of treaties and marriages did not mend what that year broke.\n\nIt is mended now, and the question is how to keep it. The Battler held his conquests in two ways: with charters that brought settlers and gave them law, and with brotherhoods of knights sworn to the frontier."
 nd_ara.13.a: "Give the new lands charters and settlers."
 nd_ara.13.a_tt: "Settlers fill the countryside and it is cheaper to build and work."
 nd_ara.13.b: "Keep the frontier under arms."
 nd_ara.13.b_tt: "Armies recover faster, waste less, and castles rise more cheaply."
 nd_ara.14.t: "The Kingdom of Sardinia and Corsica"
 nd_ara.14.d: "The title was a pope's bargain: two islands, neither of them his to give, in exchange for a Sicily the house would not surrender anyway. A generation of kings has paid for it in galleys, fevers and silver, and the Aragonese barons have asked at every Cortes what Sardinia is to them.\n\nThe answer is flying over Oristano and the Doria's rock, and for the first time over a Corsican harbour. The judges of Arborea and the captains of Genoa have learned what the charter of 1297 meant."
 nd_ara.14.a: "Two islands, as the charter said."
 nd_ara.14.a_tt: "The crown's subjects and its home waters are more secure."
 nd_ara.15.t: "Trinacria"
 nd_ara.15.d: "Sicily chose a prince of the house of Barcelona after the Vespers and has kept a king of its own ever since, to the despair of popes and the profit of its barons. Now the island answers to the senior line again, and its parliament has sent to ask on what terms.\n\nThe Sicilians want their chapters sworn: their own law, their own offices, their grain sold through their own ports. The king's council would rather put Aragonese and Catalan castellans into the royal castles and the grain ports, and trust nobody who has changed kings twice in a lifetime."
 nd_ara.15.a: "Swear the chapters of the kingdom of Sicily."
 nd_ara.15.a_tt: "The island keeps its law, and its harbours serve the crown's ships and merchants."
 nd_ara.15.b: "Put the king's own men in the royal castles."
 nd_ara.15.b_tt: "The crown's officers watch the barons and sell the grain licences."
 nd_ara.16.t: "The King Who Did Not Come Home"
 nd_ara.16.d: "The king holds court in Italy among poets, lawyers and captains of fortune. A prince of Albania has sworn to him, his castellan keeps the harbour of Malta, and letters reach Zaragoza a season late.\n\nThe queen and the Cortes write that the kingdom has not seen its king in years, that justice waits on his signature and that the barons will vote nothing more for wars they cannot find on a map. His Italian councillors answer that a house with so many crowns must sit where they meet."
 nd_ara.16.a: "The court stays where the realms meet."
 nd_ara.16.a_tt: "Captains and artists flock to the court, and Aragon's levies are slow to muster."
 nd_ara.16.b: "The king sails home to hold his Cortes."
 nd_ara.16.b_tt: "The realms' revenues are coined at home and the fleet keeps them joined."

 # ===== Destiny timed modifiers =====
 STATIC_MODIFIER_NAME_nd_ara_dest_privilegio_de_los_veinte: "Privilege of the Twenty"
 STATIC_MODIFIER_DESC_nd_ara_dest_privilegio_de_los_veinte: "The king has confirmed the privilege by which twenty sworn citizens keep the justice of Zaragoza. The towns take their lead from the capital."
 STATIC_MODIFIER_NAME_nd_ara_dest_ordinaciones_de_la_casa: "Ordinances of the Household"
 STATIC_MODIFIER_DESC_nd_ara_dest_ordinaciones_de_la_casa: "Every office of the palace is written down with its duties and its wages. The court at Zaragoza is the best ordered in Spain, and nobody in it thinks about the sea."
 STATIC_MODIFIER_NAME_nd_ara_dest_cartas_pueblas: "Charters of Settlement"
 STATIC_MODIFIER_DESC_nd_ara_dest_cartas_pueblas: "The gathered lands are held as the Battler held his: with a charter, a plot and a law for every settler who will come."
 STATIC_MODIFIER_NAME_nd_ara_dest_milicia_de_monreal: "Militia of Monreal"
 STATIC_MODIFIER_DESC_nd_ara_dest_milicia_de_monreal: "Brotherhoods of knights sworn to the frontier keep its castles and its roads, as the Battler's militia did at Monreal del Campo."
 STATIC_MODIFIER_NAME_nd_ara_dest_capitulos_del_reino: "Chapters of the Kingdom"
 STATIC_MODIFIER_DESC_nd_ara_dest_capitulos_del_reino: "The king has sworn the chapters of Sicily. The island keeps its law and its parliament, and opens its harbours to the crown."
 STATIC_MODIFIER_NAME_nd_ara_dest_castellanos_del_rey: "The King's Castellans"
 STATIC_MODIFIER_DESC_nd_ara_dest_castellanos_del_rey: "Officers from the old realms hold the royal castles and the grain ports of Sicily. They report on the barons and sell the licences to export."
 STATIC_MODIFIER_NAME_nd_ara_dest_corte_en_ultramar: "A Court Beyond the Sea"
 STATIC_MODIFIER_DESC_nd_ara_dest_corte_en_ultramar: "The king keeps his court in Italy. Captains and men of letters crowd to it, and the barons of Aragon are slow to arm for a lord they never see."
 STATIC_MODIFIER_NAME_nd_ara_dest_retorno_del_rey: "The King's Return"
 STATIC_MODIFIER_DESC_nd_ara_dest_retorno_del_rey: "The king has come home to hold his Cortes. The revenues of his realms are coined in the kingdom, and a fleet keeps them within reach."

 # ===== Destiny buildings =====
 nd_ara_dest_aljaferia: "Real Palacio de la Aljafería"
 nd_ara_dest_aljaferia_desc: "The palace of the Moorish kings outside the walls of Zaragoza, enlarged by every king of Aragon who lived in it. The coronation procession sets out from its gate, and Mudéjar masters have raised a throne room over the old arcades."
 nd_ara_dest_aljaferia_maintenance: "Keeping the Palace"
 nd_ara_dest_aljaferia_maintenance_desc: "Hangings and furniture for the royal rooms, paper for the chancery and brick for the endless works."
 nd_ara_dest_castillo_aragones: "Castillo Aragonés"
 nd_ara_dest_castillo_aragones_desc: "A royal castle over the harbour of a town beyond the sea, held by a castellan of the king's own choosing. It keeps the town for the crown whoever else rules the country round it."
 nd_ara_dest_castillo_aragones_maintenance: "Garrison and Walls"
 nd_ara_dest_castillo_aragones_maintenance_desc: "Arms for the garrison, and stone and tools to keep the sea walls sound."

 # ===== BUREAUCRACIES =====
 ara_sobrejunterias_bureaucracy: "Sobrejunterías"
 ara_sobrejunterias_bureaucracy_desc: "In 1274 the kingdom was divided into juntas, leagues of towns sworn to shelter no malefactor and to ride after any who fled. At the head of each stood a sobrejuntero named by the king and answerable to the governor of Aragon. By the fuero of James II he executed the sentences of the Justicia and of every other judge, pursued thieves and killers, and restored what had been stolen, and he could seize no one without a mandate."
 ara_privilegio_de_los_veinte_bureaucracy: "Privilegio de los Veinte"
 ara_privilegio_de_los_veinte_bureaucracy_desc: "On 5 February 1129 Alfonso the Battler granted Zaragoza the right of wrong for wrong. A citizen who had been injured could call on twenty men chosen by the city, who seized the offender and laid waste his property wherever it lay, with no judge of the king present. The city still used it against the villages of Mozota and Mezalocha in 1560, and in 1589 the Diputación sent the count of Aranda to court to complain of its excesses. It was abolished with the fueros in 1707."
 ara_real_audiencia_bureaucracy: "Real Audiencia de Aragón"
 ara_real_audiencia_bureaucracy_desc: "The king's own bench in Zaragoza, grown out of the royal chancery and presided by the king or his lieutenant general. In 1528 Charles V made it a college, so that the regent of the chancery could give no sentence without four councillors, and a criminal chamber of five was added in 1565. The Cortes of Tarazona of 1592 gave it the keeping of public order as well. It was the rival of the court of the Justicia, which until then had been the kingdom's one high court."
 ara_diecisiete_judicantes_bureaucracy: "Diecisiete Judicantes"
 ara_diecisiete_judicantes_bureaucracy_desc: "The Cortes of Calatayud of 1461 set a tribunal over the court of the Justicia. Each year seventeen men were drawn by lot from the four arms of the kingdom, and none of them might be a lawyer. Any subject could denounce a lieutenant of the Justicia before them, and their vote could cost a judge his office. In Aragon the man who judged the king's officers was himself judged by the kingdom."

 AUTO_MODIFIER_NAME_nd_ara_bureaucracy_authority: "Offices of the Kingdom of Aragon"
 AUTO_MODIFIER_DESC_nd_ara_bureaucracy_authority: "Two institutions of the kingdom of Aragon can be kept at once, chosen among the Sobrejunterías, the Privilegio de los Veinte, the Real Audiencia and the Diecisiete Judicantes."
