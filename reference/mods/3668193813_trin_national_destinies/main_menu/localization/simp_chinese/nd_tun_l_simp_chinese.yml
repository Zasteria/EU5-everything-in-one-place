l_simp_chinese:
 STATIC_MODIFIER_NAME_nd_tun_sultan_of_the_tribes: "Sultan of the Tribes"
 STATIC_MODIFIER_DESC_nd_tun_sultan_of_the_tribes: "The grants of the Arab tribes have been confirmed. Their horsemen answer the sultan's summons and their chiefs keep the caravan roads, and for that the crown has given up revenue it will not see again."
 STATIC_MODIFIER_NAME_nd_tun_master_of_the_customs_house: "Master of the Customs House"
 STATIC_MODIFIER_DESC_nd_tun_master_of_the_customs_house: "The grants of the tribes have been taken back. A salaried guard, paid from the customs of the port, garrisons the country, and the sultan's collectors go where they have not been seen in a generation. The tribes have not forgiven it."
 STATIC_MODIFIER_NAME_nd_tun_shadow_of_the_emperor: "In the Emperor's Shadow"
 STATIC_MODIFIER_DESC_nd_tun_shadow_of_the_emperor: "A Spanish garrison holds the harbour fort and the Emperor's galleys cruise offshore. The walls are safe and the Christian ports are open to our merchants. In the mosques the ruler is spoken of as a kept man."
 STATIC_MODIFIER_NAME_nd_tun_regency_of_the_sultan: "The Sultan's Regency"
 STATIC_MODIFIER_DESC_nd_tun_regency_of_the_sultan: "The Sultan's captains command the harbour and his janissaries drill in the citadel. They are the best soldiers and sailors in the inland sea, and they take their orders from their own officers."
 STATIC_MODIFIER_NAME_nd_tun_rule_of_the_deys: "Rule of the Deys"
 STATIC_MODIFIER_DESC_nd_tun_rule_of_the_deys: "The companies of the garrison choose their own chief. An army that elects its commander fights for him, and fills its ranks without being asked."
 STATIC_MODIFIER_NAME_nd_tun_bey_of_the_camp: "Bey of the Camp"
 STATIC_MODIFIER_DESC_nd_tun_bey_of_the_camp: "The officer who leads the tax column has been raised above the garrison. Twice a year the camp crosses the country, and the taxes of the grain lands and the oases reach the capital."
 STATIC_MODIFIER_NAME_nd_tun_sons_of_the_country: "Sons of the Country"
 STATIC_MODIFIER_DESC_nd_tun_sons_of_the_country: "The Turkish companies have been broken up. Mountaineers, tribesmen and the townsmen of Tunis now carry the bey's muskets, and the capital sleeps more soundly for it."
 STATIC_MODIFIER_NAME_nd_tun_pardoned_ojak: "The Pardoned Companies"
 STATIC_MODIFIER_DESC_nd_tun_pardoned_ojak: "The mutineers have been pardoned and kept in pay. They remain the steadiest infantry the bey commands, and the Porte has noted the courtesy shown to its soldiers."
 STATIC_MODIFIER_NAME_nd_tun_flag_of_commerce: "A Flag of Commerce"
 STATIC_MODIFIER_DESC_nd_tun_flag_of_commerce: "The corsair hulls carry oil, grain and wool under a flag the powers have agreed to respect. Consuls who once came to ransom captives now come to sign contracts."
 STATIC_MODIFIER_NAME_nd_tun_last_cruise: "The Last Cruise"
 STATIC_MODIFIER_DESC_nd_tun_last_cruise: "The captains have put to sea for one more season, with the bey's leave and against the will of Europe. The prizes are good. The dispatches going home from every consulate are not."
 nd_tun.1.t: "The Throne of Tunis"
 nd_tun.1.d: "The Friday sermon in the Zaytuna names the sultan, the customs house at the Sea Gate fills with Pisan, Genoese and Catalan coin, and a day's ride from the walls none of it counts for much. Beyond the gardens of the capital the country belongs to the Arab tribes. The Ku'ub and their kin hold whole districts in grant, escort the caravans or plunder them as the season suggests, and send their horsemen to the sultan's wars when it pleases them. In the south, Gabes, Gafsa and the oases of the Djerid obey their own lords.\n\nEvery ruler of this house has had to decide what the throne of Tunis is. It can be the seat of an arbiter, who confirms the tribes in their grants, takes their cavalry in return and rules the interior through its own chiefs. Or it can be the seat of a paymaster, who takes back what was granted, hires a guard with the customs of the port and holds the country himself. The first costs the crown its revenue and much of its authority. The second costs it peace.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tun.1.d_newcomer: "Tunis has a new master. Most of Ifriqiya, from the hills behind Bougie to the shore of Tripoli, now answers to one court, and the Friday sermon in the Zaytuna names a ruler who did not inherit it. The merchants of the Sea Gate have paid their customs to the new treasury without complaint. The country beyond the walls is another matter.\n\nThere the Arab tribes hold whole districts in grant from sultans who are gone, and they are waiting to learn what those grants are worth now. A new ruler can confirm them, take the tribes' cavalry in return and rule the interior through its own chiefs, as the old house did in its weak years. Or the grants can be taken back, a guard hired with the customs of the port, and the country held from the capital, as the old house did in its strong ones. The first costs the crown its revenue and much of its authority. The second costs it peace.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tun.1.a: "Confirm the grants. The tribes will be the sultan's sword."
 nd_tun.1.a_tt: "Light cavalry, larger levies and safer caravan roads. The tribes are satisfied. The crown loses power, and the realm moves toward decentralization."
 nd_tun.1.b: "Revoke them. The customs of the port will pay for a guard."
 nd_tun.1.b_tt: "Control, tax income, cheaper army upkeep and merchant power. The realm moves toward centralization. The tribes are angered and stability falls."
 nd_tun_formed_tt: "Holds the throne of #bold Tunis#!"
 nd_tun_path_a_tt: "Chose the #bold Sultan of the Tribes#! destiny"
 nd_tun_path_b_tt: "Chose the #bold Master of the Customs House#! destiny"
 nd_tun.2.t: "The Imam of the Zaytuna"
 nd_tun.2.d: "For more than forty years Muhammad ibn Arafa has led the prayer in the Mosque of the Olive Tree, and for most of them he has been its preacher and chief mufti as well. Students come to his circle from Tlemcen, Fez and Granada, and his rulings on Maliki law are copied wherever that school is followed. He is austere, immovable in argument and jealous of the mosque's standing. When a celebrated historian, lately returned to the city of his birth, began to draw students away from him, it was the historian who found it wise to leave for Cairo.\n\nThe court has learned to live with the imam, because what the Zaytuna approves the city accepts. A sultan who has the mosque behind him needs fewer soldiers in the streets."
 nd_tun.2.a: "What the Zaytuna approves, the city accepts."
 nd_tun.2.a_tt: "The Zaytuna can now be built in Tunis."
 nd_tun.3.t: "Between the Emperor and the Sultan"
 nd_tun.3.d: "Khayr al-Din Barbarossa took Tunis for the Ottoman Sultan in 1534 and drove out its ruler. A year later the Emperor Charles came himself with some four hundred ships, stormed La Goulette, let his army sack the city for three days and put the ruler back, on terms: a Spanish garrison in the harbour fort, a yearly tribute, and freedom for every Christian captive. Since then each master of Tunis has been somebody's man. The Emperor's viceroys in Sicily and the Sultan's captains at Tripoli and Algiers each offer protection, and each means the same thing by it.\n\nThere is no third offer. The only question left to the court is whose soldiers it would rather have in the citadel."
 nd_tun.3.a: "Better the Emperor's garrison in the harbour than the Turk in the palace."
 nd_tun.3.a_tt: "Stronger walls, sea trade and warmer relations abroad. The faithful resent it."
 nd_tun.3.b: "The Sultan is a Muslim. Open the gates to his captains."
 nd_tun.3.b_tt: "Discipline, stronger galleys and manpower. The crown loses power to the garrison."
 nd_tun.4.t: "The Revolt of the Deys"
 nd_tun.4.d: "The Sultan's conquest left four thousand janissaries in Tunis, in forty companies, each under a junior officer the men call their dey, their uncle. In October 1591 the deys rose against the senior officers of the garrison, killed those they could find, and announced that the companies would from now on choose one of their own number to command the army and the city. The pasha sent from Constantinople keeps his title and his salary. Nobody consults him.\n\nThe soldiers hold the capital. The countryside is another matter. Its taxes are gathered twice a year by an armed column, and the officer who leads that column, the bey, has the respect of the tribes and most of the treasury passing through his hands. Whoever rules must lean on one of them."
 nd_tun.4.a: "Let the companies choose their dey. The army is the state."
 nd_tun.4.a_tt: "Army morale, faster recruitment and army tradition. The realm moves toward decentralization."
 nd_tun.4.b: "Raise the bey of the camp. He who gathers the taxes shall rule."
 nd_tun.4.b_tt: "Tax income, control and faster armies. The realm moves toward centralization."
 nd_tun.5.t: "The Exiles of Spain"
 nd_tun.5.d: "In 1609 the King of Spain ordered every Morisco out of his kingdoms. Tens of thousands crossed to Tunis within a few seasons, many of them robbed on the way, and Uthman Dey did what few rulers on that coast did: he let them in and gave them land. They rebuilt the old towns of the Medjerda valley and Cap Bon, Testour, Soliman, Grombalia and Zaghouan among them, and planted irrigated orchards of a kind the country had half forgotten. In the capital they set up the workshops of a trade they had carried out of Spain in their heads: the knitted, fulled and scarlet woollen cap.\n\nWithin a lifetime the chechia of Tunis will be worn from Algiers to Constantinople, and the cap makers will be the richest guild in the country."
 nd_tun.5.a: "Give them land. Their hands will repay it."
 nd_tun.5.a_tt: "Chechia Workshops can now be built in towns and cities."
 nd_tun.6.t: "The Night of the Janissaries"
 nd_tun.6.d: "Hammuda Pasha has ruled for nearly thirty years, and the country has not known better ones. Oil and grain go out to Marseille and Livorno, the Venetians who bombarded Sousse and Sfax were outlasted, and in 1807 the army of Algiers, which had treated Tunis as a tributary for half a century, was beaten on the frontier. Most of the army that did it was not Turkish. The bey has filled his ranks with Zwawa mountaineers and the horsemen of the makhzen tribes, and the janissaries of the capital have understood what that means for them.\n\nOn the night of 30 August 1811 they rose, plundered the souks and seized the citadel. By morning the Zwawa, the tribes and the townsmen of Tunis had them surrounded. The mutiny is over. What remains to decide is whether the corps survives it."
 nd_tun.6.a: "Break the corps. The country's own sons will carry its arms."
 nd_tun.6.a_tt: "Manpower, stronger light infantry and cheaper stability."
 nd_tun.6.b: "Pardon them and keep them in pay. They are still our best foot."
 nd_tun.6.b_tt: "Discipline, stronger heavy infantry and diplomatic reputation."
 nd_tun.7.t: "The End of the Corso"
 nd_tun.7.d: "In April 1816 Lord Exmouth anchored off La Goulette with a British squadron and a list of demands, and the bey signed: no more Christian slaves, and the captives in the bagnios to go home. Three years later a French and a British admiral came together to read out what the powers had decided at Aix-la-Chapelle. The corso itself, the licensed war at sea that had fed Tunis for three centuries, was to stop.\n\nThe captains are furious and the treasury is anxious. But the oil of the Sahel now earns more in a season than the prizes did, and it needs the same ships and the same sailors. The fleet can be turned to carrying. Or it can put to sea once more, while there is still a fleet."
 nd_tun.7.a: "Sign. Let the corsairs carry oil to Marseille."
 nd_tun.7.a_tt: "Exports, warmer relations abroad and merchant capacity. The realm moves toward free trade."
 nd_tun.7.b: "One more season. Let Europe learn what it is asking for."
 nd_tun.7.b_tt: "Naval morale, captured ships and cheaper privateers. Diplomatic reputation suffers, and the realm grows more belligerent."
 nd_tun_iqta_of_the_kuub: "Iqta of the Ku'ub"
 nd_tun_iqta_of_the_kuub_desc: "The Banu Sulaym came out of Egypt three centuries ago, and their leading clan, the Ku'ub, has made itself indispensable to every sultan since. They hold districts of the interior in grant, and they pay for them in the only coin they have: horsemen who know every well between Kairouan and Tripoli."
 nd_tun_sahel_olive_groves: "Olive Groves of the Sahel"
 nd_tun_sahel_olive_groves_desc: "From Sousse to Sfax the coast is one grove. Its oil lights the lamps of Alexandria and makes the soap of Genoa, and the stone presses of the Sahel villages work from the first rains until spring."
 nd_tun_souks_of_the_zaytuna: "Souks of the Zaytuna"
 nd_tun_souks_of_the_zaytuna_desc: "Abu Zakariya laid out the perfumers' market against the wall of the Great Mosque in 1240, and the other crafts took their places around it in order of dignity: booksellers and cloth merchants nearest the mosque, dyers and smiths farthest off. Each street answers to a warden chosen from its own masters."
 nd_tun_zaghouan_aqueduct: "The Waters of Zaghouan"
 nd_tun_zaghouan_aqueduct_desc: "Al-Mustansir rebuilt the Roman aqueduct that once fed Carthage and turned it toward Tunis. Its water fills the fountains of the city and the pools of the royal gardens at Abu Fihr, and a capital that had lived on cisterns can grow."
 nd_tun_zaytuna_of_ibn_arafa: "The Zaytuna of Ibn Arafa"
 nd_tun_zaytuna_of_ibn_arafa_desc: "Under the imam Ibn Arafa the Mosque of the Olive Tree becomes the court of last appeal for the Maliki west. Its teaching circles train the judges and notaries of the whole country, and its opinion is something even a sultan must reckon with."
 nd_tun_loud_of_the_syrtis: "Boatmen of the Lesser Syrtis"
 nd_tun_loud_of_the_syrtis_desc: "The Gulf of Gabes has the strongest tides of the inland sea, and its banks ground any keeled ship. The islanders of Kerkennah and Djerba work it in the loud, a flat-bottomed lateen boat that fishes sponges, carries oil jars and slips over shoals where a galley cannot follow."
 nd_tun_abolition_of_the_mukus: "Abolition of the Market Dues"
 nd_tun_abolition_of_the_mukus_desc: "Abu Faris struck from the books the market dues that the law of Islam did not sanction, to the delight of the souks and the alarm of his treasurers. He made up the loss at sea, from the ruler's fifth of every prize his licensed captains brought home."
 nd_tun_defence_of_mahdia: "The Defence of Mahdia"
 nd_tun_defence_of_mahdia_desc: "In 1390 a crusade of French knights carried in Genoese ships sat before Mahdia for sixty-one days. The town held on its narrow peninsula, a relieving army camped in sight of the siege lines, and the crusaders sailed home with a treaty and little else."
 nd_tun_coral_of_marsa_al_kharaz: "Coral of Marsa al-Kharaz"
 nd_tun_coral_of_marsa_al_kharaz_desc: "The reefs off Tabarka and Marsa al-Kharaz yield the finest red coral in the inland sea. The sultans do not fish it themselves. They lease the banks to Catalans and Genoese for a yearly rent, and they have learned what a foreigner will pay for a privilege."
 nd_tun_marabouts_of_the_steppe: "Marabouts of the Steppe"
 nd_tun_marabouts_of_the_steppe_desc: "Where the sultan's judges do not travel, the saints do. A lodge beside a holy man's tomb gives the tribes a place to settle a blood feud, shelter a traveller and school a son, and the shaykh who keeps it can turn a raiding party around with a word."
 nd_tun_between_emperor_and_sultan: "Between the Emperor and the Sultan"
 nd_tun_between_emperor_and_sultan_desc: "Barbarossa, Charles of Habsburg, Uluj Ali, Don John of Austria and Sinan Pasha each took Tunis in turn. Its rulers kept their throne for forty years by owing something to all of them, and by knowing at every moment which fleet was nearer."
 nd_tun_day_of_los_gelves: "The Day of Los Gelves"
 nd_tun_day_of_los_gelves_desc: "In August 1510 a Spanish army landed on Djerba, marched inland through the palm groves and found the wells guarded. Thirst broke its ranks before the islanders charged. Thousands died on the beach, and for a generation no Christian captain liked the look of that shore."
 nd_tun_revolt_of_the_deys: "The Revolt of the Deys"
 nd_tun_revolt_of_the_deys_desc: "The forty companies of the Turkish garrison have thrown off their senior officers and set one of their own captains over the country. From now on the soldiers of Tunis are a power in their own right, a closed corps that recruits its sons and answers to its own council."
 nd_tun_morisco_settlement: "Settlement of the Moriscos"
 nd_tun_morisco_settlement_desc: "The Moriscos driven out of Spain have been given the empty lands of the Medjerda valley and Cap Bon. They bring waterwheels, fruit trees, tiled roofs and the craft of the red woollen cap, which they alone know how to make."
 nd_tun_renegade_shipwrights: "Renegade Shipwrights"
 nd_tun_renegade_shipwrights_desc: "The English pirate John Ward came to Tunis in 1606 with a stolen ship and an offer, and Uthman Dey accepted both. He and his like taught the captains of the port to build and sail the round ship: high sided, square rigged, heavy with guns and free of the oar bench, a ship that can cruise in winter and beyond the straits."
 nd_tun_bagnios_and_redemption: "Bagnios and Redemption"
 nd_tun_bagnios_and_redemption_desc: "The captives of the corso are lodged in the bagnios of the port, great locked courtyards with their own taverns and chapels. They row, they careen hulls, they wait. Each year friars arrive from Spain, France and Italy with chests of alms to buy them home, and the price of a man is argued like any other."
 nd_tun_porto_farina: "Porto Farina"
 nd_tun_porto_farina_desc: "Usta Murad, a Genoese who rose to be dey, fortified the lagoon of Porto Farina and made it the winter harbour of the corsairs. Behind its bar and its forts the captains lay up their ships, and the notables who own them fit out the next season's cruise."
 nd_tun_zwawa_companies: "Zwawa Companies"
 nd_tun_zwawa_companies_desc: "The beys hire the Zwawa, Kabyle mountaineers of the Djurdjura, by the thousand. They march with the tax column, garrison the forts of the interior and owe nothing to the Turkish companies of the capital, which is why the beys want them."
 nd_tun_souk_of_the_chaouachis: "Souk of the Chaouachis"
 nd_tun_souk_of_the_chaouachis_desc: "Muhammad Bey built the cap makers three market streets of their own in 1691. Spanish wool is knitted in the suburbs, fulled at the mills of El Battan on the Medjerda, dyed scarlet in the water of Zaghouan and finished in the souk, and the guild's warden answers for every cap that leaves it."
 nd_tun_grana_of_livorno: "The Grana of Livorno"
 nd_tun_grana_of_livorno_desc: "Jewish merchant houses from Livorno have settled in Tunis, where they are called the Grana. They ship the country's oil, wool and wax to Italy, advance the money for ransoms, and keep their own synagogue, court and quarter apart from the old community of the city."
 nd_tun_makhzen_tribes: "The Makhzen Tribes"
 nd_tun_makhzen_tribes_desc: "Certain tribes pay no tax. The Drid and their like ride with the bey's camp instead, collect from their neighbours on his behalf, and furnish the cavalry of every campaign. It is the old bargain of the sultans, kept this time on the ruler's terms."
 nd_tun_hammuda_pasha: "The Age of Hammuda Pasha"
 nd_tun_hammuda_pasha_desc: "Under Hammuda Pasha the oil of the Sahel and the grain of the north find buyers in Marseille and Livorno at wartime prices. The bey licenses the exports himself, the Sahel plants new groves, and the treasury is full for the first time in memory."
 nd_tun_bardo_nizami: "The Regular Battalions"
 nd_tun_bardo_nizami_desc: "Husayn Bey raises the country's first regular battalions in 1831, uniformed and drilled on the new Ottoman and French pattern in the barracks beside the Bardo palace. They are the beginning of a different kind of army, and they are expensive."
 nd_tun_end_of_the_corso: "The End of the Corso"
 nd_tun_end_of_the_corso_desc: "The taking of Christian captives has been renounced and the privateering licences withdrawn. The captains' ships do not rot at their moorings. They load oil, and the sea lanes they once hunted now carry their cargoes."
 a_nd_tun_kuub_horsemen: "Ku'ub Horsemen"
 a_nd_tun_kuub_horsemen_desc: "Light horse of the Arab tribes, armed with lance and javelin and mounted on the small hard horses of the steppe. They scout, raid and pursue. They do not stand against a formed line, and nobody asks them to."
 levy_nd_tun_kuub_horsemen: "Ku'ub Horsemen"
 levy_nd_tun_kuub_horsemen_desc: "Tribal cavalry owed to the sultan for the lands the tribes hold in grant."
 n_nd_tun_loud: "Kerkennah Loud"
 n_nd_tun_loud_desc: "A flat-bottomed lateen boat built for the shoals of the Gulf of Gabes. It carries less than a round ship and draws almost no water, so it comes and goes on banks where pursuers run aground."
 a_nd_tun_ojak: "Ojak of Tunis"
 a_nd_tun_ojak_desc: "The Turkish companies of the garrison and their sons born in the country. Matchlock infantry with the drill and the pride of the Sultan's own janissaries, and with a council of their own."
 levy_nd_tun_ojak: "Ojak of Tunis"
 levy_nd_tun_ojak_desc: "The companies of the Turkish garrison, mustered under their deys."
 n_nd_tun_bertone: "Renegade Bertone"
 n_nd_tun_bertone_desc: "A round ship in the northern fashion, square rigged and high sided, armed with more guns than any galley can carry. Slower than a pinnace under oars or in light airs, and far harder to board."
 a_nd_tun_zwawa: "Zwawa Companies"
 a_nd_tun_zwawa_desc: "Kabyle mountaineers in the bey's pay, armed with long muskets and at their best on broken ground. They serve for the season and are not expected to hold a field against cavalry."
 a_nd_tun_makhzen_horse: "Makhzen Horse"
 a_nd_tun_makhzen_horse_desc: "The cavalry of the tax-exempt tribes, armed now with musket and sabre. They ride with the bey's camp every year and know the country better than any map."
 levy_nd_tun_makhzen_horse: "Makhzen Horse"
 levy_nd_tun_makhzen_horse_desc: "Horsemen of the tribes that ride with the bey's camp and pay no tax for it."
 a_nd_tun_nizami: "Bardo Nizami"
 a_nd_tun_nizami_desc: "Regular infantry in the new style, in frock coat and red cap, drilled to fire by rank. They hold their ground better than any troops the country has had, and their kit and pay weigh on every march."
 nd_tun_olive_press: "Sahel Olive Press"
 nd_tun_olive_press_desc: "A stone mill and a beam press under one vaulted roof, with a yard of jars waiting for the carters. A village with its own press sells oil and not olives."
 nd_tun_olive_press_maintenance: "Millstones and Jars"
 nd_tun_olive_press_maintenance_desc: "Press beams, millstones and the clay jars the oil travels in."
 nd_tun_zaytuna: "The Zaytuna"
 nd_tun_zaytuna_desc: "The Mosque of the Olive Tree, at the heart of Tunis since the first century of Islam. Its colonnades hold the teaching circles that train the judges, notaries and preachers of the country, and the sultans have endowed it with libraries of many thousand volumes."
 nd_tun_zaytuna_maintenance: "Teaching Circles"
 nd_tun_zaytuna_maintenance_desc: "Paper, books, mats and lamp wax for the masters and their students."
 nd_tun_coral_fishery: "Coral Fishery"
 nd_tun_coral_fishery_desc: "A beach of drying racks and a fleet of small boats that drag weighted wooden crosses over the reef to tear the red coral loose. The branches are sorted on shore and sold by weight."
 nd_tun_coral_fishery_maintenance: "Coral Boats"
 nd_tun_coral_fishery_maintenance_desc: "Timber, cordage and nets for the boats that work the reef."
 nd_tun_zawiya: "Marabout's Zawiya"
 nd_tun_zawiya_desc: "A domed tomb, a prayer hall, a guest room and a school, kept by the descendants of the saint who lies there. The tribes bring it their quarrels and their tithes, and some of their sons stay to study and do not go back to the tents."
 nd_tun_zawiya_maintenance: "Alms and Hospitality"
 nd_tun_zawiya_maintenance_desc: "Bread for guests, cloth for the poor and candles for the tomb."
 nd_tun_chechia_workshop: "Chechia Workshop"
 nd_tun_chechia_workshop_desc: "A master cap maker's shop. The caps arrive knitted from the suburbs as loose white bags, and leave after fulling, carding and dyeing as the stiff scarlet chechia that half the Muslim world wears."
 nd_tun_chechia_felting: "Knitting and Felting"
 nd_tun_chechia_felting_desc: "Wool is knitted, shrunk and felted by hand, then dyed red in the workshop's own vat."
 nd_tun_chechia_zaghouan_dyeing: "Zaghouan Dye Works"
 nd_tun_chechia_zaghouan_dyeing_desc: "The caps are fulled at the water mills of El Battan, then mordanted with alum and dyed with kermes in the water of Zaghouan. More caps from every master, and a red that does not fade."
 nd_tun_bagnio: "Bagnio"
 nd_tun_bagnio_desc: "A walled courtyard where the captives of the corso are locked in at night. By day they pull the oars, haul timber and scrape hulls in the port. A bagnio with no captives in it is an empty yard."
 nd_tun_bagnio_maintenance: "Rations and Irons"
 nd_tun_bagnio_maintenance_desc: "Bread, coarse cloth, timber and tools for the captives and their work."
 nd_tun_corsair_lagoon: "Corsair Lagoon"
 nd_tun_corsair_lagoon_desc: "A sheltered basin behind a bar and a pair of forts, where the corsair ships winter and their owners fit them out for the season. Every notable of the port has a share in a hull, and every hull answers the ruler's summons."
 nd_tun_corsair_lagoon_maintenance: "Careening and Fitting Out"
 nd_tun_corsair_lagoon_maintenance_desc: "Pitch, cordage, timber and sailcloth for the ships laid up in the basin."
 nd_tun_dest_kairouan_developed_tt: "#bold Kairouan#! has at least 18 development"
 nd_tun_dest_tunis_developed_39_tt: "We own #bold Tunis#! and it has at least 39 development"
 nd_tun_dest_tunis_developed_47_tt: "We own #bold Tunis#! and it has at least 47 development"
 nd_tun_dest_tunis_developed_62_tt: "We own #bold Tunis#! and it has at least 62 development"
 nd_tun_destiny: "Between the Steppe and the Sea"
 nd_tun_destiny_desc: "Tunis faces the gulf, and the country behind it faces the steppe. Whoever rules from the citadel must lean on one of them: on the tribes and their horsemen, or on the customs house and the guard it pays for.\n\nKeep the realm stable. The road chosen on the throne of Tunis then opens."
 nd_tun_dest_lords_of_the_zab: "Lords of the Zab"
 nd_tun_dest_lords_of_the_zab_desc: "The palm groves of the Zab were a province of the first Hafsids, held for them by the lords of Biskra and their allies among the Dawawida Arabs. Further south, Ghadames loaded the caravans for the Sudan and acknowledged Tunis when Tunis was strong. Both paid as much as they judged wise.\n\nBring Biskra and Ghadames into the realm, as our own land or a vassal's, and let the court's name stand high."
 nd_tun_dest_peace_of_the_steppe: "The Peace of the Steppe"
 nd_tun_dest_peace_of_the_steppe_desc: "In 1057 the nomads ruined Kairouan. Under the Hafsids the city became their market, where the camps sold wool, hides and horses and bought grain and cloth, and the tribes that kept the sultan's peace ranged from the hills of Constantine to the shore of the Great Syrtis.\n\nBring Surt, on the Great Syrtis, into the realm, as our own land or a vassal's, hold Kairouan and let it grow, and keep a large army under the standard."
 nd_tun_dest_homage_of_the_west: "The Homage of the West"
 nd_tun_dest_homage_of_the_west_desc: "Abu Zakariya rode into Tlemcen in 1242 at the head of the tribes and gave the city back to its emir as a vassal's holding. Abu Faris did the same in 1424, and each time the courts further west thought it wise to send gifts.\n\nHold Constantine, Algiers and Tlemcen, as our own land or a vassal's, with great prestige. The Qubbat Asarak can then be raised in Tunis."
 nd_tun_dest_grants_revoked: "The Grants Revoked"
 nd_tun_dest_grants_revoked_desc: "Tripoli obeyed the Banu Thabit, and Gabes and Djerba the Banu Makki: families that held their towns in grant and kept the customs of their harbours for themselves. Abu al-Abbas and Abu Faris put an end to them one by one and sent governors of their own.\n\nOwn Tripoli and Ajim, the port of Djerba, directly, with no vassal between. Let Tunis grow by a quarter and fill the treasury."
 nd_tun_dest_guard_of_the_sea_gate: "The Guard of the Sea Gate"
 nd_tun_dest_guard_of_the_sea_gate_desc: "The customs house at the Sea Gate took a tenth of all that the Italian and Catalan merchants landed, and that money kept a corps the tribes could not match: paid by the month, lodged in the citadel, loyal to whoever paid it.\n\nEmbrace professional armies, keep Béjaïa in the realm, let Tunis grow by half and fill the treasury."
 nd_tun_dest_corsair_sea: "The Corsair Sea"
 nd_tun_dest_corsair_sea_desc: "In 1429 a Hafsid fleet landed on Malta, besieged its capital and sailed home with three thousand captives and without the island. Whoever holds Malta watches the narrow sea between Sicily and Cap Bon.\n\nBring Malta into the realm, keep forty ships, let Tunis grow to twice its old size and fill the treasury. The Coral Souk can then be built on the reef coast."
 nd_tun.8.t: "Between the Steppe and the Sea"
 nd_tun.8.d: "The country is quiet. The prayer is said in the ruler's name from the shore of Tripoli to the hills behind Bougie, the caravans from the Djerid come in when they are expected, and the foreign consuls at the Sea Gate have stopped asking who will sit in the citadel next year.\n\nIfriqiya has always had two faces. One looks inland, over the steppe and the oases, where power is counted in horsemen and in the chiefs who answer a summons. The other looks out over the gulf, where it is counted in ships at anchor and in the coin taken at the customs house. The court has already chosen which of them it trusts. Now it can find out how far that choice will carry."
 nd_tun.8.a: "Then let us see how far it carries."
 nd_tun.9.t: "Lords of the Zab"
 nd_tun.9.d: "Biskra sits where the last ridge of the Aures falls into the desert, and whoever holds it holds the palm groves of the Zab and the road down to Touggourt and Ouargla. Its governors have always been strong men with a tribe behind them, and they have sent the sultan as much as they judged wise. Further south, the merchants of Ghadames load cloth and copper for the Sudan and bring back gold dust, and they too have kept their gates their own.\n\nBoth now answer to the court in earnest. The tribute of the oases comes north under the escort of the same horsemen who used to levy it for themselves, and the shaykhs who brought this about expect to be remembered for it."
 nd_tun.9.a: "The desert pays those it respects."
 nd_tun.10.t: "The Peace of the Steppe"
 nd_tun.10.d: "From the hills of Constantine to the shore of the Great Syrtis the tribes are at peace with the sultan and, for the moment, with each other. Kairouan shows it. The city the nomads once ruined has become their market: wool, hides, butter and horses come in from the camps, and grain, dates and cloth go out. Its tanners and weavers cannot find hands enough.\n\nPeace among horsemen does not keep by itself. Thousands of young men own a lance and a mare and have no use for either. The chiefs put it plainly to the court: give them a war beyond the frontier, or give them a reason to stay with their flocks."
 nd_tun.10.a: "Send them raiding beyond the frontier."
 nd_tun.10.b: "Open the markets of Kairouan to their flocks."
 nd_tun.11.t: "The Homage of the West"
 nd_tun.11.d: "The sultan's camp stands under the walls of Tlemcen, and the horsemen of half the Maghreb stand in it: Sulaym from the east, Dawawida from the Zab, Zenata who changed sides on the march. Twice before a ruler of Tunis came this far. Abu Zakariya took the city and handed it back to its emir on condition of homage. Abu Faris chose among its princes as a man chooses a horse.\n\nThe city has opened its gates again, and envoys are already on the road to Tunis to learn what that means. The emir can be given his throne back as the sultan's man, at the usual price in robes, horses and stipends. Or the camp can stay in the west and see what else will open."
 nd_tun.11.a: "Give him back his throne, as our man."
 nd_tun.11.b: "Keep the camp in the west. There is more to take."
 nd_tun.12.t: "The Grants Revoked"
 nd_tun.12.d: "For generations Tripoli and Djerba were ruled by families who called themselves the sultan's servants and behaved as his equals. They kept the customs of their harbours and opened their gates to an army from Tunis only when it was too large to refuse. They are gone. A governor appointed from Tunis, paid from Tunis and recalled to Tunis sits in each citadel, and the harbour dues are counted by clerks who answer to the treasury.\n\nThe tribes of the hinterland have noticed that their own grants were written by the same hand. The merchants at the Sea Gate have noticed something else: a letter from the sultan now means the same thing in every port of the realm."
 nd_tun.12.a: "One treasury, and every port a gate to it."
 nd_tun.13.t: "The Guard of the Sea Gate"
 nd_tun.13.d: "The customs house takes a tenth of everything the Pisans, Genoese, Catalans and Venetians land, and the sum is now large enough to keep an army that owes nothing to any tribe. Its companies are paid by the month, lodged in the citadel and drilled under the ruler's eye. The capital has grown to feed and clothe them, and the lords of the interior have learned to count them before refusing a tax.\n\nWho should fill the ranks is disputed. There are Frankish men at arms in the suburb, under their own captain and with their own chapel, who fight well and can never hope to rule a Muslim country. And there are the freedmen of the palace, Christian captives freed when they turned Muslim, who owe the ruler everything and can be trusted with a province as readily as with a company."
 nd_tun.13.a: "Hire the Franks. A soldier who cannot rule is a safe one."
 nd_tun.13.b: "Raise the freedmen of the palace. They are ours."
 nd_tun.14.t: "The Corsair Sea"
 nd_tun.14.d: "Malta has fallen, and with it the watch the Christians kept on the narrow sea between Sicily and Cap Bon. Forty sail lie off La Goulette and at Bizerte. No ship passes from one half of the inland sea to the other without the sultan's captains knowing its cargo, and the coral boats of Trapani and Genoa buy their licence at Tabarka or stay in port. The branches they used to carry home raw are being cut and drilled in the country's own workshops.\n\nThe consuls at the Sea Gate have come to the palace together, which they seldom do, with an offer. Their cities will pay a yearly sum in gold for letters of safe conduct that the sultan's captains will honour. The captains have an offer of their own. A sea this narrow, they say, is worth more hunted than rented."
 nd_tun.14.a: "Let the captains hunt. This sea is ours to harvest."
 nd_tun.14.b: "Sell the consuls their safe conducts, in gold."
 STATIC_MODIFIER_NAME_nd_tun_dest_riders_beyond_the_frontier: "Riders Beyond the Frontier"
 STATIC_MODIFIER_DESC_nd_tun_dest_riders_beyond_the_frontier: "The young men of the tribes have leave to raid past the border. They travel light, live off what they find and are home before the enemy has mustered."
 STATIC_MODIFIER_NAME_nd_tun_dest_flocks_of_the_steppe: "Flocks of the Steppe"
 STATIC_MODIFIER_DESC_nd_tun_dest_flocks_of_the_steppe: "The tribes drive their herds to the markets of Kairouan and are paid in coin. Wool and meat are plentiful. The flocks graze where wheat was sown, and the farmers of the plain have nobody to complain to."
 STATIC_MODIFIER_NAME_nd_tun_dest_throne_held_from_tunis: "A Throne Held from Tunis"
 STATIC_MODIFIER_DESC_nd_tun_dest_throne_held_from_tunis: "The emir of Tlemcen rules by the sultan's diploma. The western frontier is quiet and the court's name carries to Fez and Granada. Keeping a king costs robes, horses and stipends every year."
 STATIC_MODIFIER_NAME_nd_tun_dest_camp_in_the_west: "The Camp in the West"
 STATIC_MODIFIER_DESC_nd_tun_dest_camp_in_the_west: "The sultan's camp has not gone home. Tribes join it for their share, towns open their gates sooner than face a siege, and its losses are made good on the march."
 STATIC_MODIFIER_NAME_nd_tun_dest_frankish_militia: "The Frankish Militia"
 STATIC_MODIFIER_DESC_nd_tun_dest_frankish_militia: "Christian men at arms serve in the guard under their own captain and hear mass in their own chapel in the suburb. More of their kind arrive each season looking for the same pay. The preachers of the Zaytuna call it a scandal."
 STATIC_MODIFIER_NAME_nd_tun_dest_freedmen_of_the_palace: "Freedmen of the Palace"
 STATIC_MODIFIER_DESC_nd_tun_dest_freedmen_of_the_palace: "Captives freed when they turned Muslim serve in the guard and govern the towns. They carry out an order as it was given, and there is always another of them ready for promotion."
 STATIC_MODIFIER_NAME_nd_tun_dest_licensed_corso: "The Licensed Corso"
 STATIC_MODIFIER_DESC_nd_tun_dest_licensed_corso: "The captains cruise with the sultan's licence and the treasury takes its fifth. Their ships keep the sea in all weathers and close any harbour they are sent against. Fewer courts now send envoys to Tunis."
 STATIC_MODIFIER_NAME_nd_tun_dest_price_of_peace: "The Price of Peace"
 STATIC_MODIFIER_DESC_nd_tun_dest_price_of_peace: "The trading cities pay in gold each year for letters of safe conduct. The mint strikes the payment into dinars, the merchants sail unmolested, and half the fleet can be laid up."
 nd_tun_dest_qubbat_asarak: "Qubbat Asarak"
 nd_tun_dest_qubbat_asarak_desc: "A great domed pavilion at the head of a wide stair, as al-Mustansir raised in the citadel of Tunis in 1253. Here the sultan reviews his horsemen, receives the envoys of other kings and renews each year the grants of the shaykhs who come to kiss his hand. Its honours reach the whole realm only while Tunis is the capital."
 nd_tun_dest_qubbat_asarak_maintenance: "Robes of Honour"
 nd_tun_dest_qubbat_asarak_maintenance_desc: "Fine cloth, horses and paper for the gifts and diplomas handed out at each audience."
 nd_tun_dest_coral_souk: "Coral Souk"
 nd_tun_dest_coral_souk_desc: "A street of turners and drillers who cut the red coral of the reef into beads and polish them for the markets of Cairo and the Sudan. The branches used to leave the country raw, in Genoese and Trapanese hulls. A port can have one only where the market it belongs to produces coral."
 nd_tun_dest_coral_carving: "Coral Carving"
 nd_tun_dest_coral_carving_desc: "Raw coral is sawn, drilled and polished into beads and set as jewelry."
 nd_tun.8.a_tt: "The road chosen on the throne of Tunis is open."
 nd_tun.9.a_tt: "Subjects pay more, and the levies of the tribes assemble faster."
 nd_tun.10.a_tt: "Army initiative, faster marches off the roads and a higher supply limit."
 nd_tun.10.b_tt: "More wool and livestock. The wheat harvest suffers."
 nd_tun.11.a_tt: "Prestige and less war exhaustion. The court costs more to keep."
 nd_tun.11.b_tt: "Better peace terms, cheaper reinforcement and faster sieges."
 nd_tun.12.a_tt: "Conquered land is integrated faster, and control grows in towns and cities."
 nd_tun.13.a_tt: "More mercenaries for hire, at a lower price. Cultural tradition suffers."
 nd_tun.13.b_tt: "A more effective cabinet, cheaper generals and faster lawmaking."
 nd_tun.14.a_tt: "Stronger blockades and hardier privateers. Diplomatic range shrinks."
 nd_tun.14.b_tt: "Cheaper merchants and fleets, and more income from minting."

 # ===== BUREAUCRACIES =====
 tun_shaykh_al_muwahhidin_bureaucracy: "Shaykh al-Muwahhidin"
 tun_shaykh_al_muwahhidin_bureaucracy_desc: "Abu Zakariya, who founded the Hafsid state in 1229, set one man over the Almohad shaykhs who had come east with his house: the Chief of the Almohads, the ruler's deputy. Ibn Khaldun wrote that he appointed and dismissed officials and led the army. The shaykhs swore in each new sultan, and more than one chief chose him. Ibn al-Lihyani, chief from 1295, took the throne for himself in 1311, and Ibn Tafragin raised a boy of thirteen to it in 1350 and ruled in his name for fourteen years."
 tun_hijaba_bureaucracy: "Hijaba"
 tun_hijaba_bureaucracy_desc: "The hajib began as the steward of the sultan's household, who paid its salaries and kept its kitchens and stables. As the Hafsid sultans withdrew from view he became the only door to them, and in the end he commanded the army and gave counsel as well. Ibn Tafragin took the office in 1343, and Ibn Khaldun held it at Bejaia in 1365. Abu al-Abbas, who came to the throne in 1370, abolished it and governed in person."
 tun_freedman_qaids_bureaucracy: "Freedman Qaids"
 tun_freedman_qaids_bureaucracy_desc: "Sultan Uthman (1435 to 1488) kept his kinsmen out of the provinces and sent royal retainers to govern them, many of them European captives freed when they turned Muslim. In 1452 even Bejaia, long the seat of Hafsid princes, was given to such a qaid. A man outside the dynasty owed everything to the ruler and could lose it in a day: the minister Nabil ibn Abi Qattaya, whom the Italians called the first after the king, was executed in 1453 and his fortune seized. The beys later ruled the same way through their mamluks, among them Yusuf, keeper of the seal from 1782."
 tun_lizma_bureaucracy: "Lizma"
 tun_lizma_bureaucracy_desc: "A lizma was the lease of a revenue: the customs of a port, the trade in hides, salt or tobacco, the supply of the army, even a governorship, each sold for a sum paid in advance. The Hafsids leased the coral of Tabarka to a merchant of Barcelona in 1446 and to Genoese from 1451. Under the beys the farmers were native merchant houses such as the Djellouli of Sfax and the Ben Ayed of Djerba, who governed districts and fitted out ships while they held the farms, and passed them from father to son."

 AUTO_MODIFIER_NAME_nd_tun_bureaucracy_authority: "Offices of the Court of Tunis"
 AUTO_MODIFIER_DESC_nd_tun_bureaucracy_authority: "The court of Tunis has room for one more institution: the Chief of the Almohads, the Hijaba, the Freedman Qaids or the Lizma."
