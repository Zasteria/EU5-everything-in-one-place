l_simp_chinese:
 nd_fra.1.t: "The Kingdom Made Whole"
 nd_fra.1.d.hyw: "The English claim to the crown of France has failed in the field. Their captains have surrendered their keys and sailed for home, and the lilies fly over towns that have not seen a French governor in a generation. A century of war has changed the crown it was fought over: the king who ends it keeps a standing army paid from a permanent tax, a train of guns that can open any wall in a week, and a kingdom that has learned to look to Paris.\n\n$nd_fra.1.d.choice$"
 nd_fra.1.d.appanages: "The last of the great appanages has come home to the crown. The princes of the blood who once held their fiefs as all but sovereign princes, with their own courts, their own taxes and their own quarrels, now hold titles and pensions and nothing more. Every bailiff and seneschal in the kingdom answers to the royal council, and an ordinance sealed in Paris is obeyed from Picardy to Languedoc.\n\n$nd_fra.1.d.choice$"
 nd_fra.1.d.formed: "Paris is ours, and with Paris the crown of France. The machinery of the old kingdom did not die with its dynasty: the Parlement still sits on the Île de la Cité, the Chambre des comptes still audits the royal domain, and the bailiffs and seneschals still hold their courts in the provinces, waiting to learn whose seal they now obey.\n\n$nd_fra.1.d.choice$"
 nd_fra.1.d.choice: "What kind of monarchy will this kingdom be? The lawyers of the Parlement and the doctors of the Sorbonne have one answer: the king of France is emperor in his own realm, his sovereignty is one and indivisible, and a kingdom of one king should have one faith and one law. The old counsellors have another. The kings of France, they say, are the greatest in Christendom because they accept three bridles, religion, justice and police: a king who keeps the faith, submits his edicts to his courts and respects the ancient laws of the realm needs no other fortress.\n\n#bold France's destiny now opens in the Traditions tab. Its roads are not chosen here: they open through deeds, on the Rhine and across the Channel.#!"
 nd_fra.1.a: "One king, one faith, one law."
 nd_fra.1.b: "A king bridled by religion, justice and police."
 nd_fra_formed_tt: "France has claimed its destiny"
 nd_fra_e1_done_tt: "The kingdom has been made whole"

 STATIC_MODIFIER_NAME_nd_fra_un_roi_une_foi_une_loi: "Un Roi, Une Foi, Une Loi"
 STATIC_MODIFIER_DESC_nd_fra_un_roi_une_foi_une_loi: "The king is emperor in his own realm. His council governs, his courts register what he wills, and there is room in his kingdom for one church alone."
 STATIC_MODIFIER_NAME_nd_fra_monarchie_temperee: "The Bridled Monarchy"
 STATIC_MODIFIER_DESC_nd_fra_monarchie_temperee: "Claude de Seyssel wrote in 1519 that the French crown was great because it accepted three bridles: religion, justice and police. The king keeps the faith, lets his parlements examine his edicts, and asks the estates for what he takes."

 nd_fra.2.t: "The Concordat of Bologna"
 nd_fra.2.d: "Three months after Marignano, Francis I met Pope Leo X at Bologna, and in August 1516 the two agreed a treaty that remade the French church. The Pragmatic Sanction of Bourges, under which cathedral chapters and abbeys had elected their own heads since 1438, is dead. From now on the king names the archbishops, bishops and abbots of his kingdom, some six hundred benefices, and the pope confirms them and takes the first year's revenues.\n\nThe Parlement of Paris refuses to register the treaty. The University preaches against it, and the clergy call it the surrender of the liberties of the Gallican church. The king's patience is not infinite."
 nd_fra.2.a: "Register it by the king's most express command."
 nd_fra.2.b: "Register it, and let the Parlement record its protest."
 STATIC_MODIFIER_NAME_nd_fra_benefices_du_roi: "The King's Benefices"
 STATIC_MODIFIER_DESC_nd_fra_benefices_du_roi: "Every mitre and abbey in the kingdom is a gift in the king's hand, and the great families have learned where to ask for one."
 STATIC_MODIFIER_NAME_nd_fra_libertes_gallicanes: "Gallican Liberties"
 STATIC_MODIFIER_DESC_nd_fra_libertes_gallicanes: "The concordat stands, but so does the principle behind the old Sanction: the church of France is governed in France, and its courts will say so."

 nd_fra.3.t: "Silk for the Kingdom"
 nd_fra.3.d: "In 1536 Francis I granted letters patent to Étienne Turquet and Barthélemy Naris, two Piedmontese merchants settled at Lyon, to weave cloths of gold, silver and silk in the city. Their workers were freed from taxes and from watch and militia duty on the single condition that they wove within the walls. The looms have multiplied faster than anyone expected, and every bale of raw silk they consume still comes over the Alps from Italy or up the Rhône from the Levant.\n\nThe consuls of Lyon ask for more: that all raw silk entering the kingdom pass through their city and pay its dues there. Tours, which has woven silk for the crown since Louis XI, protests that the kingdom's silk should not belong to one town."
 nd_fra.3.a: "Grant Lyon the staple of raw silk."
 nd_fra.3.b: "Plant mulberries, and let every town weave."
 STATIC_MODIFIER_NAME_nd_fra_lyon_silk_staple: "The Silk Staple of Lyon"
 STATIC_MODIFIER_DESC_nd_fra_lyon_silk_staple: "All raw silk entering the kingdom passes the customs house of Lyon, and the Fabrique draws the best of it first."
 STATIC_MODIFIER_NAME_nd_fra_soieries_du_royaume: "Silks of the Kingdom"
 STATIC_MODIFIER_DESC_nd_fra_soieries_du_royaume: "Mulberries on the slopes of the Cévennes and the Rhône, and looms in Tours, Nîmes and Lyon alike: the kingdom means to grow its own silk."

 nd_fra.4.t: "The Canal of the Two Seas"
 nd_fra.4.d: "Pierre-Paul Riquet was a farmer of the salt tax, not an engineer, but he had walked the hills of the Montagne Noire for years and understood what no one else had: that their streams could be gathered in a reservoir and led to the watershed at Naurouze, to feed a canal running both ways, to the Garonne and to the Mediterranean. Colbert won him the king's edict in 1666. Riquet poured his own fortune into the works, bought the canal as a fief in 1668, and drove twelve thousand labourers through fourteen years of digging.\n\nHe died in October 1680, months before the work was done. In May 1681 the waters were let in, and barges of Lauragais wheat began to move between Toulouse and the Étang de Thau."
 nd_fra.4.a: "Let the waters in."
 STATIC_MODIFIER_NAME_nd_fra_canal_des_deux_mers_opened: "The Canal Royal Opens"
 STATIC_MODIFIER_DESC_nd_fra_canal_des_deux_mers_opened: "Grain, wine and cloth move by barge between the Garonne and the Mediterranean, and the Lauragais has a market for everything it can grow."

 nd_fra.5.t: "The Reds and the Blues"
 nd_fra.5.d: "On 13 August 1765 the king adopted the system of Jean-Baptiste Vaquette de Gribeauval: field guns of four, eight and twelve pounds, cast solid and bored true, on lighter carriages with iron axles and interchangeable parts, laid with elevation screws and tangent sights. Gribeauval had served with the Austrian artillery in the last war and seen what light, standard guns could do.\n\nThe old artillery hates it. Joseph-Florent de Vallière, whose father standardized the heavy guns in 1732, calls the new pieces toys that cannot breach a wall. The corps has split by the colour of its coats: the red waistcoats of the old uniform for Vallière, the all-blue coats of the reform for Gribeauval. The minister must decide whom to back."
 nd_fra.5.a: "The Blues: light guns that keep pace with the army."
 nd_fra.5.b: "The Reds: heavy guns that open any fortress."
 STATIC_MODIFIER_NAME_nd_fra_les_bleus: "Gribeauval's Artillery"
 STATIC_MODIFIER_DESC_nd_fra_les_bleus: "Standard calibres, interchangeable parts and schools that teach gunnery as mathematics: the French guns move with the infantry and fire faster than any in Europe."
 STATIC_MODIFIER_NAME_nd_fra_les_rouges: "Vallière's Artillery"
 STATIC_MODIFIER_DESC_nd_fra_les_rouges: "The heavy siege train of 1732 stays in service and in favour, and French gunners remain the masters of the breach."

 nd_fra.6.t: "The Decree of 23 August"
 nd_fra.6.d: "On 23 August 1793 the Convention voted the decree Bertrand Barère had read to it: from this moment until the enemy is driven from the territory of the Republic, all the French are in permanent requisition for the service of the armies. The young men shall go to fight; the married men shall forge arms and carry supplies; the women shall make tents and clothing and serve in the hospitals; the children shall turn old linen into bandages; the old men shall be carried to the public squares to rouse the courage of the warriors.\n\nWithin a year the armies count more than seven hundred thousand men. The levy of three hundred thousand in the spring had already set the Vendée alight, and the countryside has not forgiven it."
 nd_fra.6.a: "The whole nation is under arms."
 STATIC_MODIFIER_NAME_nd_fra_nation_en_armes: "The Nation in Arms"
 STATIC_MODIFIER_DESC_nd_fra_nation_en_armes: "Every man of age is a soldier, every workshop an arsenal, every village a depot. The countryside pays for it."

 nd_fra_de_moneta: "De Moneta"
 nd_fra_de_moneta_desc: "Around 1356 Nicole Oresme, grand master of the College of Navarre and later counsellor to Charles V, wrote that the coinage belongs to the community and not to the prince, and that a king who debases it for profit is a tyrant and a thief. Charles V took the lesson: the gold franc struck in 1360 to pay King John's ransom held its weight for a generation."
 nd_fra_librairie_du_roi: "The King's Library"
 nd_fra_librairie_du_roi_desc: "In 1368 Charles V moved the royal books into the falconry tower of the Louvre, and by 1373 his keeper Gilles Malet had inventoried more than nine hundred volumes, the largest library any king of France had owned. Charles did not only collect: he had the learning of the schools put into French, so that his counsellors could read it. Nicole Oresme translated Aristotle's Ethics, Politics and On the Heavens for him, Raoul de Presles translated Augustine's City of God, and the king made Oresme a bishop for his pains. The collection is the root of the Bibliothèque du roi."
 nd_fra_francs_archers: "The Francs-Archers"
 nd_fra_francs_archers_desc: "The ordinance of Montil-lès-Tours of 28 April 1448 required every parish of the kingdom to choose one man skilled with the bow, equip him, and let him practise on Sundays and feast days. In return he was free, franc, of the taille. It was the first attempt at a permanent French infantry, and it marched in the last campaigns of the Hundred Years' War."
 nd_fra_artillerie_du_roi: "The King's Artillery"
 nd_fra_artillerie_du_roi_desc: "The brothers Jean and Gaspard Bureau gave Charles VII the finest siege train in Europe. His grandson Charles VIII took its heirs over the Alps in 1494: some seventy bronze guns on wheeled carriages, drawn by horses fast enough to keep pace with the army, firing iron shot. At Monte San Giovanni in February 1495 they breached in hours a fortress that had once held out for seven years."
 nd_fra_soieries_de_lyon: "The Silks of Lyon"
 nd_fra_soieries_de_lyon_desc: "Louis XI tried to plant silk weaving at Lyon in 1466 and moved it to Tours when the Lyonnais balked at the cost. Francis I tried again in 1536 with Piedmontese masters and tax exemptions, and this time it took. Four years later Lyon held the kingdom's monopoly on raw silk, and its Fabrique became the first luxury industry of Europe."
 nd_fra_concordat_de_bologne: "The Concordat of Bologna"
 nd_fra_concordat_de_bologne_desc: "Agreed in 1516 by Francis I and Leo X, the Concordat gave the king the right to name every archbishop, bishop and abbot in France. The crown held the patronage of the French church from then until the Revolution, and paid its nobility in abbeys and mitres."
 nd_fra_paix_perpetuelle: "The Perpetual Peace"
 nd_fra_paix_perpetuelle_desc: "Beaten at Marignano in 1515, the Swiss made a perpetual peace with France at Fribourg the next year, and in 1521 an alliance that let the king raise Swiss regiments on Swiss soil. Swiss pikemen served the French crown from then until the Swiss Guards died defending the Tuileries in 1792."
 nd_fra_mousquetaires_de_la_garde: "The Musketeers of the Guard"
 nd_fra_mousquetaires_de_la_garde_desc: "In 1622 Louis XIII armed the carabins of his father's guard with muskets and made them a company of gentlemen, the Mousquetaires du Roi. Mounted to march and dismounted to fight, they rode wherever the king went, and a place in their ranks was the first step of a noble military career."
 nd_fra_labourage_et_paturage: "Labourage et Pâturage"
 nd_fra_labourage_et_paturage_desc: "Ploughing and pasture are the two breasts that feed France, said Maximilien de Sully, Henri IV's superintendent of finances, and he spent the peace after the Wars of Religion draining marshes, protecting the peasants' cattle and tools from seizure for debt, and freeing the grain trade. In 1600 Olivier de Serres dedicated his Théâtre d'agriculture to the king; it remained the handbook of French farming for two centuries."
 nd_fra_meuriers_du_roi: "The King's Mulberries"
 nd_fra_meuriers_du_roi_desc: "Every year the kingdom sent a fortune in gold over the Alps to buy Italian silk. Barthélemy de Laffemas, Henri IV's controller of commerce, and Olivier de Serres persuaded the king to grow it at home: from 1601 twenty thousand mulberry trees were planted in the Tuileries gardens, and nurseries were ordered across the kingdom. The Cévennes, the Vivarais and the lower Rhône became silk country."
 nd_fra_hotel_royal_des_invalides: "The Hôtel Royal des Invalides"
 nd_fra_hotel_royal_des_invalides_desc: "By the edict of 24 February 1670 Louis XIV founded a house where those who had given their blood for the monarchy could end their days in peace. Libéral Bruant built it on the plain of Grenelle, and by 1676 it housed thousands of old and crippled soldiers with their own chapel, workshops and infirmary. A soldier who knew he would not end as a beggar was a soldier who enlisted again."
 nd_fra_canal_des_deux_mers: "The Canal of the Two Seas"
 nd_fra_canal_des_deux_mers_desc: "Between 1666 and 1681 Pierre-Paul Riquet cut a canal across Languedoc from the Garonne at Toulouse to the Mediterranean, fed by a reservoir in the Montagne Noire and climbing over the watershed at Naurouze through more than sixty locks. It was the greatest work of civil engineering in Europe since the Romans."
 nd_fra_manufactures_royales: "The Royal Manufactures"
 nd_fra_manufactures_royales_desc: "Jean-Baptiste Colbert meant France to buy nothing abroad that it could make at home. The crown bought the Gobelins workshops in 1662 and gathered the kingdom's tapestry weavers there; in 1665 it chartered the Manufacture royale de glaces to break the Venetian monopoly on mirrors, and within twenty years French glass lined the Hall of Mirrors at Versailles."
 nd_fra_corps_des_galeres: "The Corps of Galleys"
 nd_fra_corps_des_galeres_desc: "At Marseille the king kept the last great galley fleet of the Christian Mediterranean, some forty galleys at its height around 1690, rowed by convicts, deserters, Huguenots and Turkish slaves chained to the oars. The corps needed rowers by the thousand and sailors by the handful."
 nd_fra_etapes_et_magasins: "Étapes and Magazines"
 nd_fra_etapes_et_magasins_desc: "Michel Le Tellier and his son Louvois fed the armies of Louis XIV from royal magazines stocked in the frontier fortresses over the winter, and from the étapes, fixed halts where marching troops found bread and forage waiting. A French army could open its campaign weeks before its enemies had grass for their horses."
 nd_fra_systeme_gribeauval: "The Gribeauval System"
 nd_fra_systeme_gribeauval_desc: "Adopted in 1765, Gribeauval's system gave the French field artillery standard calibres, interchangeable parts, iron axles, elevation screws and a school of mathematics for its officers. It was the artillery with which the armies of the Revolution fought, and its guns were still in service a generation later."
 nd_fra_physiocratie: "Physiocracy"
 nd_fra_physiocratie_desc: "In 1758 François Quesnay, physician to Madame de Pompadour, drew his Tableau économique at Versailles: all wealth springs from the land, and the state should tax the net product of agriculture alone and let grain move freely. His disciples, the first school of economists in Europe, persuaded the crown to free the grain trade in 1763 and 1764."
 nd_fra_porcelaine_de_sevres: "The Porcelain of Sèvres"
 nd_fra_porcelaine_de_sevres_desc: "The porcelain works founded at Vincennes moved to Sèvres in 1756, near Madame de Pompadour's château of Bellevue, and became the king's own in 1759. When kaolin was found at Saint-Yrieix near Limoges in 1768, Sèvres learned to fire true hard paste, and its services became the diplomatic gifts of the monarchy."
 nd_fra_requisition_permanente: "Réquisition Permanente"
 nd_fra_requisition_permanente_desc: "Louis XIV's milice of 1688 had already drawn men for the army by lot, parish by parish. The decree of 23 August 1793 went further than any king had dared: all the French were placed in permanent requisition for the service of the armies, and within a year more than seven hundred thousand men were under arms."
 nd_fra_departements_et_metre: "Départements and the Metre"
 nd_fra_departements_et_metre_desc: "In 1790 the Constituent Assembly abolished the old provinces, with their separate estates, customs and laws, and drew eighty-three départements, each small enough to cross on horseback in a day. In 1795 the Republic replaced the kingdom's hundreds of local measures with the metre, the gram and the litre, defined from the meridian that Delambre and Méchain were surveying from Dunkirk to Barcelona."

 nd_fra_librairie_du_louvre: "Librairie du Louvre"
 nd_fra_librairie_du_louvre_desc: "The king's library in a tower of his own palace: three floors of panelled rooms, the books chained to their desks, the windows glazed and barred, and a keeper who answers to the king alone."
 nd_fra_librairie_maintenance: "Library Upkeep"
 nd_fra_librairie_maintenance_desc: "Parchment and paper for the copyists, new books for the shelves, and candles for the keeper's rounds."
 nd_fra_fabrique_lyonnaise: "Fabrique of Lyon"
 nd_fra_fabrique_lyonnaise_desc: "Workshops of master silk weavers under the rules and privileges of the Fabrique, the great corporation of Lyon silk. Their drawlooms turn Italian and Levantine raw silk, and silver thread, into the brocades and damasks every court in Europe wants."
 nd_fra_pm_soie_lyonnaise: "Lyon Silks"
 nd_fra_pm_soie_lyonnaise_desc: "Raw silk woven into damasks and figured silks on the drawlooms of the Fabrique."
 nd_fra_pm_drap_d_or: "Brocaded Silks"
 nd_fra_pm_drap_d_or_desc: "Silk woven with silver thread into brocade, the trade Turquet and Naris were chartered for in 1536."
 nd_fra_magnanerie: "Magnanerie"
 nd_fra_magnanerie_desc: "A silkworm house of the southern hills: racks of trays under a tiled roof, fed with mulberry leaves from the terraces outside, where the village rears the worms through their five weeks and reels the cocoons."
 nd_fra_pm_magnanerie: "Silkworm Rearing"
 nd_fra_pm_magnanerie_desc: "Silkworms reared on mulberry leaves, their cocoons reeled into raw silk."
 nd_fra_manufacture_royale: "Manufacture Royale"
 nd_fra_manufacture_royale_desc: "A manufacture chartered by the crown, with a monopoly, a subsidy, foreign masters lured with pensions, and inspectors to enforce Colbert's regulations. Tapestry, mirror glass and, later, porcelain are made here to the standard of the king's own palaces."
 nd_fra_pm_tapisserie_des_gobelins: "Gobelins Tapestry"
 nd_fra_pm_tapisserie_des_gobelins_desc: "Wool dyed in the Gobelins vats and woven on high-warp looms after cartoons by the king's painters."
 nd_fra_pm_glaces_de_saint_gobain: "Saint-Gobain Mirror Glass"
 nd_fra_pm_glaces_de_saint_gobain_desc: "Plate glass cast on iron tables, the method the manufacture perfected in 1688, then ground, polished and silvered."
 nd_fra_pm_porcelaine_de_sevres: "Sèvres Porcelain"
 nd_fra_pm_porcelaine_de_sevres_desc: "Hard-paste porcelain of Limousin kaolin, painted and gilded for the king's table and the courts of Europe."
 nd_fra_hotel_des_invalides: "Hôtel des Invalides"
 nd_fra_hotel_des_invalides_desc: "The great house of the army's veterans on the plain of Grenelle: barracks for thousands of old soldiers, infirmaries, workshops, and the gilded dome of the Church of Saint-Louis over them all."
 nd_fra_invalides_maintenance: "Pensioners' Upkeep"
 nd_fra_invalides_maintenance_desc: "Bread, wine, clothing and medicines for the house's old soldiers."
 nd_fra_canal_du_midi: "Canal Royal de Languedoc"
 nd_fra_canal_du_midi_desc: "A stretch of Riquet's canal, with its locks, basins and quays where grain barges load and the mail boat to Toulouse ties up."
 nd_fra_canal_maintenance: "Canal Upkeep"
 nd_fra_canal_maintenance_desc: "Dredging, stone for the lock walls and timber for the gates."

 a_nd_fra_artillerie_royale: "Artillerie du Roi"
 a_nd_fra_artillerie_royale_desc: "Bronze guns on wheeled carriages, drawn by horses and firing iron shot: light enough to keep pace with the army, heavy enough to open a medieval wall in an afternoon."
 a_nd_fra_mousquetaires_du_roi: "Mousquetaires du Roi"
 a_nd_fra_mousquetaires_du_roi_desc: "Two companies of gentlemen of the king's household: mounted to march, dismounted to fight, and never numerous."
 n_nd_fra_galere_reale: "Galère du Roi"
 n_nd_fra_galere_reale_desc: "A great galley of the Marseille corps, gilded at the stern and rowed by chained convicts rather than free seamen."
 a_nd_fra_canons_gribeauval: "Canons de Gribeauval"
 a_nd_fra_canons_gribeauval_desc: "Standard field guns of four, eight and twelve pounds on light carriages with iron axles: fast to move and faster to serve, but no substitute for the heavy siege train."
 a_nd_fra_francs_archers: "Francs-Archers"
 a_nd_fra_francs_archers_desc: "One archer from every parish, free of the taille in return for practising at the butts on Sundays and marching at the king's summons."
 a_nd_fra_requisitionnaires: "Réquisitionnaires"
 a_nd_fra_requisitionnaires_desc: "Young men of the permanent requisition, drilled in a few weeks and sent forward in columns with the bayonet."
 levy_nd_fra_francs_archers: "Francs-Archers"
 levy_nd_fra_requisitionnaires: "Réquisitionnaires"

 nd_fra_dest_no_english_in_france_tt: "No location in France is held by England, Great Britain or one of their subjects"
 nd_fra_dest_naval_parity_tt: "Neither England nor Great Britain has a larger navy"
 nd_fra_dest_alsace_share_tt: "We or our non-sovereign subjects hold at least 75% of the locations in Alsace"
 nd_fra_dest_franche_comte_share_tt: "We or our non-sovereign subjects hold at least 80% of the locations in Franche-Comté"
 nd_fra_dest_rhineland_share_tt: "We or our non-sovereign subjects hold at least 75% of the locations in the Rhineland"
 nd_fra_dest_hesse_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in Hesse"
 nd_fra_dest_brabant_share_tt: "We or our non-sovereign subjects hold at least 60% of the locations in Brabant"
 nd_fra_dest_wallonia_share_tt: "We or our non-sovereign subjects hold at least 75% of the locations in Wallonia"

 nd_fra_destiny: "The Destiny of France"
 nd_fra_destiny_desc: "France's destiny runs along two frontiers, and a reign may walk both. East lies the Empire and the Rhine; west lies the Channel, England, and the sea beyond it. Nothing here is chosen in council: each step opens when France has taken the towns or built the power it names.\n\nKeep the realm at 75 stability."
 nd_fra_dest_trois_eveches: "The Three Bishoprics"
 nd_fra_dest_trois_eveches_desc: "In 1552 Henri II occupied Metz, Toul and Verdun, three imperial cities ruled by their bishops that commanded the roads of the Meuse and the Moselle, and François de Guise held Metz against Charles V through the winter that followed. The Peace of Westphalia made them French in law in 1648.\n\nOwn Metz, Toul and Verdun, and keep a sizeable army in the field."
 nd_fra_dest_alsace: "Alsace and the Comté"
 nd_fra_dest_alsace_desc: "The treaties of Westphalia (1648) gave France the Habsburg rights in Alsace, the Peace of Nijmegen (1678) gave it Franche-Comté, and in 1681 Strasbourg surrendered to Louvois's army. The new provinces kept their German speech and their Lutheran churches, and the crown learned to govern them as they were.\n\nOwn Strasbourg, Colmar and Besançon, and hold three quarters of Alsace and four fifths of Franche-Comté, directly or through subjects."
 nd_fra_dest_frontieres_naturelles: "The Natural Frontiers"
 nd_fra_dest_frontieres_naturelles_desc: "Caesar wrote that the Rhine divided the Gauls from the Germans, and French statecraft quoted him for the better part of two thousand years. In 1793 Danton told the Convention that the limits of France were marked out by nature, at the Rhine, the ocean, the Pyrenees and the Alps. In 1795 the Republic annexed the Austrian Netherlands, and the left bank of the Rhine followed.\n\nOwn Aachen, Cologne, Mainz and Brussels, and hold, directly or through subjects, three quarters of the Rhineland and of Wallonia, three fifths of Brabant and half of Hesse. Unlocks the Place forte du Rhin."
 nd_fra_dest_calais: "The English Driven Out"
 nd_fra_dest_calais_desc: "The Hundred Years' War was won with guns: the artillery of Jean and Gaspard Bureau took back Normandy in 1449 and 1450 and Guyenne in 1453. England kept Calais for another century, until François de Guise stormed it in January 1558, and Jersey, which French troops held from 1461 to 1468, stayed English.\n\nOwn Calais and Jersey, and leave no location in France to England, Great Britain or their subjects."
 nd_fra_dest_la_royale: "La Royale"
 nd_fra_dest_la_royale_desc: "Richelieu made himself Grand Master of Navigation in 1626 and made Brest a naval base. Colbert founded Rochefort, enlarged Toulon, enrolled the seamen of every coast for the king's service and in 1669 gave the navy a ministry of its own. By 1690 the French fleet was the largest in Europe, and off Beachy Head it beat the English and the Dutch together.\n\nOwn Brest, keep a navy of at least 50 ships and a treasury of 2,000 gold, and let neither England nor Great Britain have a larger navy."
 nd_fra_dest_seconde_guerre_de_cent_ans: "The Second Hundred Years' War"
 nd_fra_dest_seconde_guerre_de_cent_ans_desc: "Between 1689 and 1815 France and Britain fought seven wars, and after the first they were fought at sea and overseas as much as in Europe: for Canada and the Ohio, for the sugar islands, for the trade of India. Historians call the whole struggle the Second Hundred Years' War.\n\nOwn Stadacona (the site of Quebec), Marién on Hispaniola (the site of Cap-Français) and Pondicherry, embrace Global Trade, and reach 75 prestige. Unlocks the Arsenal de Marine."

 nd_fra.8.t: "Two Frontiers"
 nd_fra.8.d: "France is whole, and its neighbours have noticed. Two old quarrels wait for a king with the means to settle them.\n\nTo the east lies the Empire: bishops, free cities and princes strung along the Meuse, the Moselle and the Rhine, on land that was Frankish before it was German, and every one of their fortresses a door into France. To the west lies the sea, and across it England, whose kings called themselves kings of France for a century and still hold what they can of its coast.\n\nNo council has to choose between them. France's destiny will be written by what its armies take and what its shipyards build."
 nd_fra.8.a: "Let deeds decide."

 nd_fra.9.t: "The Voyage to Austrasia"
 nd_fra.9.d: "In the spring of 1552 Henri II allied with the Protestant princes of Germany against the Emperor, and his price was three imperial cities that commanded the roads into Lorraine. Toul and Verdun opened their gates to the royal army. Metz, the richest city on the Moselle, admitted the constable de Montmorency with what it took for a small escort, and found it had let in an army.\n\nCharles V came back in October with the largest army he had ever raised and a siege train to match. François de Guise held Metz through the winter, building a new wall behind every breach, while typhus and frost destroyed the besiegers. On the first day of 1553 the Emperor raised the siege. The Three Bishoprics are French in all but the treaty, and the treaty will come."
 nd_fra.9.a: "The door into Lorraine is ours."

 nd_fra.10.t: "Strasbourg"
 nd_fra.10.d: "The treaties of Westphalia gave the king the Habsburg rights in Alsace in words careful enough that each side could read them its own way. The ten imperial cities of the Decapolis said they were still free; the king's lawyers said they were his. The chambers of reunion at Metz, Besançon and Breisach settled the question one old charter at a time, and on 30 September 1681, with thirty thousand men under Louvois before its walls, Strasbourg's magistrates signed a capitulation. Three weeks later the king entered the city and heard a Te Deum in its cathedral.\n\nThe capitulation leaves the city its Lutheran churches, its German law, its university and its magistrates. The lawyers of the reunion chambers say there is a great deal more of Germany waiting to be found in the archives."
 nd_fra.10.a: "Do not touch the affairs of Alsace."
 nd_fra.10.b: "Let the chambers of reunion keep searching."

 nd_fra.11.t: "The Frontier of Gaul"
 nd_fra.11.d: "Caesar wrote that the Rhine divided the Gauls from the Germans, and French jurists and ministers have quoted him ever since: Gaul, they said, ends where nature ends it, at the Rhine, the Alps, the Pyrenees and the ocean, and whatever France held short of those limits was only borrowed.\n\nNow the lilies fly along the left bank. Aachen, where Charlemagne lies buried, is French, and so are Cologne and Mainz, whose archbishops crowned and elected emperors, and Brussels, the old capital of the Netherlands. The generals agree that the river must be held. They do not agree on what it is for."
 nd_fra.11.a: "The Rhine is a wall. Let them break on it."
 nd_fra.11.b: "The Rhine is a road. Hold every bridge."

 nd_fra.12.t: "Calais"
 nd_fra.12.d: "The English came back to France in 1415 and were driven out a generation later by guns. The Bureau brothers' artillery took the Norman towns one after another in 1449 and 1450; at Formigny, on 15 April 1450, two culverins drew the English archers off their stakes to be cut down, and at Castillon, on 17 July 1453, the guns of an entrenched camp killed old Talbot and ended the war in Guyenne. Pierre de Brézé's men took Jersey in 1461 and held it for seven years. Calais, the last English town on the continent, held out behind its marshes for a century more, until François de Guise crossed them in the frost of January 1558 and took the town in a week.\n\nThe English hold nothing in France now. Mary Tudor is said to have told her ladies that when she died, they would find Calais lying in her heart."
 nd_fra.12.a: "Not one French town flies the leopards now."

 nd_fra.13.t: "Beachy Head and La Hougue"
 nd_fra.13.d: "On 10 July 1690, off Beachy Head, the comte de Tourville met the English and Dutch fleets together and beat them, and for a summer the Channel was French. Two years later, off Barfleur, he fought a fleet nearly twice his size, and fifteen of his ships, driven onto the beaches at Cherbourg and La Hougue, were burned where they lay.\n\nThe arsenals can build the ships again. Whether they should is another matter: a fleet is ruinously expensive, and a battle is a gamble. Vauban has sent the king a memorandum. Lend the ships to the corsairs of Saint-Malo and Dunkirk, he writes, and make war on the enemy's trade instead of on his fleet."
 nd_fra.13.a: "Rebuild the squadrons and seek battle."
 nd_fra.13.b: "Lend the king's ships to the corsairs."

 nd_fra.14.t: "The Second Hundred Years' War"
 nd_fra.14.d: "The wars with England no longer end at the Channel. They are fought on the Saint Lawrence and the Ohio, off the Coromandel coast and among the islands of the Caribbean, for furs and sugar, coffee and Indian cloth, and for the sea lanes that carry them. A later age would call the whole long struggle the Second Hundred Years' War.\n\nThe lilies fly over Quebec on its rock above the river, over Cap-Français on the coast of Saint-Domingue, and over Pondicherry, and the arsenals of Brest, Toulon and Rochefort can build the fleets to hold them. The ministers still argue about what the empire is for. The cane fields of Saint-Domingue, worked by hundreds of thousands of enslaved Africans, send home more wealth than all of Canada. New France and the Carnatic are held not by settlers but by allies."
 nd_fra.14.a: "The sugar islands are worth more than snow."
 nd_fra.14.b: "Hold New France and India through our allies."

 STATIC_MODIFIER_NAME_nd_fra_dest_affaires_d_alsace: "The Affairs of Alsace"
 STATIC_MODIFIER_DESC_nd_fra_dest_affaires_d_alsace: "Do not touch the affairs of Alsace, the royal administration says. The province keeps its Lutheran churches, its German law and its magistrates, and repays the crown with a quiet loyalty."
 STATIC_MODIFIER_NAME_nd_fra_dest_chambres_de_reunion: "The Chambers of Reunion"
 STATIC_MODIFIER_DESC_nd_fra_dest_chambres_de_reunion: "The king's lawyers at Metz, Besançon and Breisach search the old charters for every village that ever owed homage to a French fief, and the king's armies collect it. The princes of the Empire have begun to talk of a league."
 STATIC_MODIFIER_NAME_nd_fra_dest_rhin_rempart: "The Rhine as a Wall"
 STATIC_MODIFIER_DESC_nd_fra_dest_rhin_rempart: "Fortresses from Landau to Luxembourg and a frontier stripped of forage: an army that crosses the Rhine will starve before it reaches the Meuse."
 STATIC_MODIFIER_NAME_nd_fra_dest_rhin_passage: "The Rhine as a Road"
 STATIC_MODIFIER_DESC_nd_fra_dest_rhin_passage: "Bridgeheads at Kehl, Huningue and Mainz, and armies that march into Germany when they please. The money meant for the realm's roads and quays goes to the Army of the Rhine instead."
 STATIC_MODIFIER_NAME_nd_fra_dest_guerre_d_escadre: "The War of Squadrons"
 STATIC_MODIFIER_DESC_nd_fra_dest_guerre_d_escadre: "The navy rebuilds its squadrons and seeks out the enemy's fleet. Every shipwright and carpenter in the realm is working in the arsenals."
 STATIC_MODIFIER_NAME_nd_fra_dest_guerre_de_course: "The War on Trade"
 STATIC_MODIFIER_DESC_nd_fra_dest_guerre_de_course: "The king's frigates sail under corsair captains out of Saint-Malo and Dunkirk, and the insurers of London count their losses."
 STATIC_MODIFIER_NAME_nd_fra_dest_iles_a_sucre: "The Sugar Islands"
 STATIC_MODIFIER_DESC_nd_fra_dest_iles_a_sucre: "Guadeloupe, Martinique and Saint-Domingue send home sugar and coffee grown by enslaved Africans, worth more than all of Canada, and the merchants of Bordeaux and Nantes grow rich on the trade."
 STATIC_MODIFIER_NAME_nd_fra_dest_nouvelle_france: "New France and the Carnatic"
 STATIC_MODIFIER_DESC_nd_fra_dest_nouvelle_france: "Some forty nations made peace with the French at Montreal in 1701, and Dupleix's nawabs rule the Carnatic in the Company's interest. The empire is held through its allies."

 nd_fra_place_forte_du_rhin: "Place forte du Rhin"
 nd_fra_place_forte_du_rhin_desc: "A fortress of the eastern frontier in Vauban's manner: low bastioned walls sunk in deep ditches, ravelins and hornworks covering every approach, and magazines to feed the garrison through a long siege."
 nd_fra_place_forte_maintenance: "Fortress Upkeep"
 nd_fra_place_forte_maintenance_desc: "Stone for the revetments, and guns, muskets and tools for the garrison."
 nd_fra_arsenal_de_marine: "Arsenal de Marine"
 nd_fra_arsenal_de_marine_desc: "A royal naval arsenal: building slips and dry docks, a ropewalk, timber ponds, forges and powder magazines, and a corps of shipwrights who build ships of the line to the navy's own designs."
 nd_fra_arsenal_maintenance: "Arsenal Stores"
 nd_fra_arsenal_maintenance_desc: "Oak and pine for the hulls, hemp, pitch and tar for the rigging, and tools for the yards."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_fra_bureaucracy_authority: "The Institutions of the Crown"
 AUTO_MODIFIER_DESC_nd_fra_bureaucracy_authority: "The kingdom made whole governs through institutions of its own making: companies paid by the month, commissioners sent out from Paris, offices bought and sold, taxes leased to financiers, and courts that must register the king's will before it becomes law. Beside the capital's own slot, France may keep two more of them."
 nd_fra_bureaucracies_unlocked_tt: "France has been made whole: its appanages consolidated, the Hundred Years' War won, or the kingdom formed anew"
 nd_fra_no_appanages_tt: "No prince of the blood holds an appanage of the crown"

 fra_compagnies_d_ordonnance_bureaucracy: "Compagnies d'Ordonnance"
 fra_compagnies_d_ordonnance_bureaucracy_desc: "At Orléans in 1439 the Estates granted Charles VII a taille to pay his soldiers and forbade any lord to raise companies without the king's leave. The princes rose in the Praguerie of 1440 and lost. By the Grande Ordonnance of Louppy-le-Château, 26 May 1445, the king kept the best captains of the écorcheurs in fifteen companies of a hundred lances, paid every month and lodged in the towns, and hunted the rest out of the kingdom. Paid, they were the first standing army in Europe; unpaid, they were routiers again."
 fra_intendants_bureaucracy: "The Intendants"
 fra_intendants_bureaucracy_desc: "Commissioners of justice, police and finance, revocable at the king's pleasure and owning nothing of their office. Chancellor Séguier made them permanent in every généralité after France entered the Thirty Years' War in 1635: they assessed the taille, raised the militia, fed the armies, and watched the governors and the courts through their subdélégués. The magistrates of the Chambre Saint-Louis made their abolition the first of their demands in 1648, and Mazarin gave way everywhere but the frontier provinces. The intendants were back within five years and stayed until 1789."
 fra_paulette_bureaucracy: "Venal Offices and the Paulette"
 fra_paulette_bureaucracy_desc: "From 1522 Francis I sold judicial and financial offices through the Bureau des parties casuelles, and on 12 December 1604 Henri IV and Sully let their holders keep them for good: an officer who paid the droit annuel, a sixtieth of his office's value each year, could sell it or leave it to his heirs. Named after Charles Paulet, the first to farm it, the paulette made the king's judges and tax officials the owners of their posts, and the greatest offices made their buyers noble. The deputies of the nobility asked the Estates-General of 1614 to abolish it, in vain. By 1789 there were some fifty-one thousand venal offices, and no minister had ever found the money to buy them back."
 fra_ferme_generale_bureaucracy: "The Ferme Générale"
 fra_ferme_generale_bureaucracy_desc: "The king leased his indirect taxes to a company of financiers: the salt tax, the excises on wine and tobacco, and the customs at the frontiers and between the provinces. The leases were gathered into one Ferme générale in 1680, and from 1726 forty farmers general bid for each six-year lease, paid the crown its price in advance, and kept whatever more they could collect. Up to twenty-five thousand clerks and armed guards enforced the forced purchase of salt and hunted the faux-sauniers and smugglers such as Louis Mandrin. The Revolution abolished the Ferme in 1790 and guillotined twenty-eight of its farmers, Lavoisier among them, on 8 May 1794."
 fra_parlements_bureaucracy: "The Parlements"
 fra_parlements_bureaucracy_desc: "The sovereign courts of the kingdom judged appeals, policed their cities, and registered the king's edicts before they became law, with a right of remonstrance when they would not. Charles VII gave Languedoc the first provincial parlement at Toulouse on 11 October 1443, and a dozen more followed. A king could force registration in a lit de justice, but the magistrates owned their seats, and through the appel comme d'abus they judged the church courts as well: in 1762 the Parlement of Paris ordered the Jesuits dissolved. When Maupeou exiled the Paris magistrates in 1771 and put judges of his own choosing in their place, the kingdom called it despotism, and Louis XVI recalled the old courts in 1774."
