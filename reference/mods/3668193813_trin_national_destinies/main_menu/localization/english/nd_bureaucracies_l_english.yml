l_english:

 # Game Rule
 rule_nd_bureaucracies_rule: "National Destinies Bureaucracies"
 setting_nd_bureaucracies_enabled: "Enabled"
 setting_nd_bureaucracies_enabled_desc: "Each formable country gains 4 to 8 historical institutions on formation: [bureaucracies|e] with a funding slider, and slots to run some of them at once. The advances, reforms and law the mod adds for them are available."
 setting_nd_bureaucracies_disabled: "Disabled"
 setting_nd_bureaucracies_disabled_desc: "The institutions of formable countries and their slots do not appear, nor do the advances, reforms and law the mod adds for them. The game's own [bureaucracies|e] are unchanged."
