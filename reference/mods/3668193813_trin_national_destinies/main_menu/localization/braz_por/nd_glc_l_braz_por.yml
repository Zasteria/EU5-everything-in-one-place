l_braz_por:
 # ===== TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_glc_patrimonio_do_apostolo: "Patrimony of the Apostle"
 STATIC_MODIFIER_DESC_nd_glc_patrimonio_do_apostolo: "The kingdom is governed from Compostela, where the archbishop is first lord of the land and the Voto comes in from half of Spain. The townsmen are ruled by the mitre again and do not like it."
 STATIC_MODIFIER_NAME_nd_glc_cidade_do_rei: "The King's Town"
 STATIC_MODIFIER_DESC_nd_glc_cidade_do_rei: "The court sits at A Coruña, a royal borough that never had a lord but the king. Merchants and shipmasters have the king's ear, and the chapter of Santiago resents the slight."
 STATIC_MODIFIER_NAME_nd_glc_homenaxe_a_lancaster: "Homage to Lancaster"
 STATIC_MODIFIER_DESC_nd_glc_homenaxe_a_lancaster: "The kingdom holds with the English claimant and his Portuguese ally. English ships crowd the ports, and the lords who prospered under the Trastámara are passed over."
 STATIC_MODIFIER_NAME_nd_glc_ouro_de_baiona: "The Gold of Bayonne"
 STATIC_MODIFIER_DESC_nd_glc_ouro_de_baiona: "The claim was sold for a great sum and a marriage. The kingdom is at peace and its lords are paid, and nobody thinks the better of it."
 STATIC_MODIFIER_NAME_nd_glc_torres_derrubadas: "The Towers Thrown Down"
 STATIC_MODIFIER_DESC_nd_glc_torres_derrubadas: "Every tower house in the kingdom has been razed by the Irmandade. Town and countryside arm themselves gladly, and every great house is an enemy of the government that allowed it."
 STATIC_MODIFIER_NAME_nd_glc_xustiza_do_rei: "The King's Justice"
 STATIC_MODIFIER_DESC_nd_glc_xustiza_do_rei: "The brotherhood was sent home and the lords answer for their towers to a royal judge. The Crown stands between the two, and the villages that rose for nothing remember it."
 # ===== FORMATION EVENT =====
 nd_glc.1.t: "The Kingdom of Galicia"
 nd_glc.1.d: "From the Eo to the Miño and from Fisterra to the passes of the Cebreiro, the land at the end of the world has a king and a government of its own again. It has been a kingdom in name since García was crowned in 910, and for most of that time the name was all it had: a title in another king's style, governed by whoever he sent.\n\nIt has two heads. At Compostela the archbishop is lord of the city and of the Terra de Santiago, his chapter draws a measure of grain from every plough between here and the Rioja, and the roads of Christendom end at his door. At A Coruña, under the Roman lighthouse, stands a borough that was founded by a king and has never had another lord, and its ships are in Bristol and Bruges every summer. The townsmen of Santiago have risen against their archbishops twice. The canons think A Coruña a fishing harbour with pretensions.\n\nThe court must sit in one of them.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_glc.1.a: "The kingdom is the Apostle's. The court stays at Compostela."
 nd_glc.1.b: "The king's own town, on the ocean. The court goes to A Coruña."
 nd_glc.1.a_tt: "A contented church, richer taxes and wider renown. The townsmen are left resentful."
 nd_glc.1.b_tt: "Contented townsmen, sea trade, shipbuilding and a stronger Crown. The capital moves to A Coruña if it is owned, and the clergy are left resentful."
 nd_glc_formed_tt: "Galicia has been formed"
 nd_glc_path_a_tt: "Chose the #bold Patrimony of the Apostle#! destiny"
 nd_glc_path_b_tt: "Chose the #bold King's Town#! destiny"
 nd_glc_acibeche_needs_cathedral_tt: "A cathedral stands in this location"
 nd_glc_torres_prohibidas_tt: "Every #bold Torre do Señor#! in the kingdom is destroyed, and none can be built again."
 # ===== ADVANCE EVENTS =====
 nd_glc.2.t: "A King from over the Sea"
 nd_glc.2.d: "In July 1386 John of Gaunt, Duke of Lancaster, came ashore at A Coruña with an English army and the claim of his wife Constance, daughter of King Peter, to the crown of Castile. Santiago opened its gates. He set up a court and a chancery at Ourense, and there the lords and towns of Galicia did him homage without much pressing: they had held for Peter while he lived, and for the King of Portugal after him, and had no love for the house that killed him.\n\nThe duke has married a daughter to the King of Portugal and means to march on León in the spring. He is also, it is said, listening to offers. His rival will pay a fortune and marry his own heir to the duke's other daughter if the claim is quietly laid down.\n\nThe kingdom that did him homage will be asked which it prefers."
 nd_glc.2.a: "We swore to Queen Constance. Let the English ships come."
 nd_glc.2.b: "A claim is worth what is paid for it. Take the gold."
 nd_glc.2.a_tt: "Better relations abroad and more sea trade. Part of the nobility is alienated."
 nd_glc.2.b_tt: "Cheaper stability, a cheaper court and satisfied nobles. Prestige suffers."
 nd_glc.3.t: "The Santa Irmandade"
 nd_glc.3.d: "It began in the spring of 1467 with a royal licence to form a brotherhood against highway robbers. Within weeks the towns had sworn, then the parishes, then the canons and a good many squires, and the brotherhood had judges and captains of its own and, by the count of men who saw it, eighty thousand under arms. They did not go after robbers. They went from castle to castle with ladders and picks, and where a garrison would not open they stormed it, and then they took the walls down stone by stone. In two years about a hundred and thirty strongholds were levelled. The Count of Lemos fled to Ponferrada. The Archbishop of Santiago fled to Portugal.\n\n\"The sparrows are hunting the falcons,\" a witness said.\n\nThe lords are gathering men beyond the border, with handguns the brotherhood does not have. The brotherhood asks for one thing before they come: that what has been pulled down shall stay down, by law, for ever."
 nd_glc.3.a: "Let no tower stand, and let none be raised again."
 nd_glc.3.b: "The towers stay, and their lords answer to the king's judges."
 nd_glc.3.a_tt: "Every Torre do Señor is razed and can never be rebuilt. Peasants and townsmen are won over and levies grow. The nobles are enraged."
 nd_glc.3.b_tt: "A stronger Crown and satisfied nobles. The peasants are left resentful."
 nd_glc.4.t: "The House of Spices"
 nd_glc.4.d: "The ship Victoria came home in September with eighteen men and a hold full of cloves, having gone round the world to fetch them. Three months later, on 22 December 1522, the emperor signed the charter the lords and towns of Galicia had begged of him while he waited at A Coruña for a wind: all the trade of the Spice Islands is to pass through a house in that port, with its own factor, treasurer and accountant. Their argument was simple. The harbour is deep and safe in any weather, and it lies far nearer to Antwerp than Seville does.\n\nA fleet is already fitting out below the Tower of Hercules for the Moluccas."
 nd_glc.4.a: "Let Seville keep the Indies. The East is ours."
 nd_glc.4.a_tt: "The Casa da Especiaría can be built in one port of the kingdom."
 nd_glc.5.t: "Quen teña honra, que me siga"
 nd_glc.5.d: "In May 1589 Drake and Norris put some twelve thousand men ashore at A Coruña. The fishermen's quarter was lost at once. Then a mine brought down a stretch of the wall of the high town, and an English ensign went up the rubble with the colours and a column behind him.\n\nMaría Mayor Fernández de Cámara y Pita, whose husband had just been killed beside her, took up a pike and killed the ensign. \"Whoever has honour, follow me,\" she said, and the women, the boys and what was left of the garrison followed her, and the breach was held. Within days the English were back on their ships.\n\nEvery parish on the coast now keeps a muster roll and a chest of arquebuses."
 nd_glc.5.a: "A wall is as strong as the people behind it."
 nd_glc.5.a_tt: "The Milicia do Reino levy can be raised."
 nd_glc.6.t: "The Reconquest of Vigo"
 nd_glc.6.d: "The French came in January 1809 and took every town in the kingdom in six weeks. The country people did not ask the towns' leave to fight them. Parish by parish the bells were rung, and abbots, students and half-pay officers found themselves captains of thousands of men with fowling pieces and scythes. On 28 March they stormed the gate of Vigo with an axe and took twelve hundred prisoners and the garrison's pay chest. It is said to be the first town in Europe to throw the French out by its own hands.\n\nIn June the same men, drilled a little and named the Division of the Miño, cut two arches of the bridge at Sampaio and held the far bank for two days against Marshal Ney. He marched out of Galicia and did not come back.\n\nThe students of Santiago had gone to the war the summer before, with Minerva on their colours."
 nd_glc.6.a: "To rescue the king, Minerva has joined Mars."
 nd_glc.6.a_tt: "The Paisanaxe levy can be raised and the Batallón Literario recruited."
 # ===== ADVANCES =====
 nd_glc_voto_de_santiago: "Voto de Santiago"
 nd_glc_voto_de_santiago_desc: "A measure of the first grain and the first wine from every yoke of oxen is owed to the church of the Apostle by the peasants of the north, from Galicia to the Rioja. The charter that grants it bears the name of King Ramiro and the date of the battle of Clavijo. It was written by a canon of Compostela three hundred years later, and it is collected all the same."
 nd_glc_pertigueiro_maior: "Pertigueiro Maior"
 nd_glc_pertigueiro_maior_desc: "The archbishop cannot shed blood, so a layman carries his staff: the Pertigueiro Maior de Santiago, who leads the host of the Terra de Santiago, keeps its peace and judges in its name. The greatest houses of the kingdom compete for the office.\n\nUnlocks the #bold Hoste da Mitra#! levy."
 nd_glc_cantigas_de_amigo: "Cantigas de Amigo"
 nd_glc_cantigas_de_amigo_desc: "A girl stands on the shore at Vigo and asks the waves whether they have seen her lover. Martín Codax, Mendinho and Xohán de Cangas sing in Galician, and so do the kings of Castile and Portugal when they write of love, because no other tongue of the peninsula is thought fit for it."
 nd_glc_acibecheiros_e_concheiros: "Acibecheiros and Concheiros"
 nd_glc_acibecheiros_e_concheiros_desc: "On the north side of the cathedral the jet carvers and the badge casters keep their stalls. A scallop shell in tin for the hat, a figure of the Apostle or a closed fist in black jet against the evil eye: no pilgrim goes home without one, and the guild burns any piece cut from stone that might crack.\n\nUnlocks the #bold Obradoiro de Acibeche#!."
 nd_glc_cerco_dos_mareantes: "The Cerco of the Mariners"
 nd_glc_cerco_dos_mareantes_desc: "The cerco is a seine so large that a whole quarter of a town must put to sea to shoot it. It is owned in shares and governed by the mariners' confraternity, which fixes the days, divides the catch and holds the right to sell salted fish abroad. Pontevedra grows to be the largest town in the kingdom on the sardine.\n\nUnlocks the #bold Confraría de Mareantes#!."
 nd_glc_vino_do_ribeiro: "Wine of the Ribeiro"
 nd_glc_vino_do_ribeiro_desc: "The abbeys keep priories among the vines of the Avia and the Miño to supply their own tables. What the monks do not drink goes down the river to the ports and from there to England, Flanders and Brittany. It was already the dearest wine sold in Santiago in 1133.\n\nUnlocks the #bold Priorado Viñateiro#!."
 nd_glc_fernan_perez_o_boo: "Fernán Pérez o Boo"
 nd_glc_fernan_perez_o_boo_desc: "Fernán Pérez de Andrade, called the Good, lord of Pontedeume, Ferrol and Vilalba, built seven bridges, seven churches, seven monasteries and seven hospitals, and put his boar on every one. The bridge over the Eume has seventy-nine arches. He also built the castles that made his tenants pay for it all.\n\nUnlocks the #bold Torre do Señor#!."
 nd_glc_rei_de_alen_mar: "A King from over the Sea"
 nd_glc_rei_de_alen_mar_desc: "The kingdom held for King Peter against his bastard brother, then for the King of Portugal, then for the Duke of Lancaster when he landed at A Coruña in 1386 and kept court at Ourense. Its lords and towns learned to treat with Lisbon, London and Bayonne on their own account."
 nd_glc_santa_irmandade: "Santa Irmandade"
 nd_glc_santa_irmandade_desc: "In 1467 the towns, the parishes, the canons and the lesser gentry swear a brotherhood, elect their own judges and captains, and in two years pull down some hundred and thirty castles and tower houses.\n\nUnlocks the #bold Irmandiños#! levy."
 nd_glc_estudo_vello: "Estudo Vello"
 nd_glc_estudo_vello_desc: "In 1495 the notary Lope Gómez de Marzoa founds a grammar school for poor boys in Santiago. A bull of Julius II lets it teach the higher faculties, and Archbishop Fonseca buys the old pilgrims' hospital to house it as a college."
 nd_glc_trato_da_especiaria: "The Spice Trade of the North"
 nd_glc_trato_da_especiaria_desc: "A Coruña has a deep harbour that is safe in any weather and lies far nearer to Flanders than Seville. On those grounds the emperor grants it the trade of the Moluccas in 1522, and Loaísa's fleet sails from it three years later.\n\nUnlocks the #bold Casa da Especiaría#!."
 nd_glc_real_audiencia: "Real Audiencia do Reino"
 nd_glc_real_audiencia_desc: "A governor and a bench of judges are sent in 1480 to hear any man's suit against his lord, with a troop of horse to enforce what they decide. Castles may not be rebuilt and the abbeys are put under visitation. The chroniclers call it the taming of the kingdom."
 nd_glc_quen_tena_honra: "Quen Teña Honra"
 nd_glc_quen_tena_honra_desc: "When the English breached the wall of A Coruña in 1589, María Pita killed the ensign who led the assault and the townspeople held the gap. Since then every parish of the coast is mustered, armed from the royal store and drilled to hold a wall until the regulars come.\n\nUnlocks the #bold Milicia do Reino#! levy."
 nd_glc_carpinteiros_de_ribeira: "Carpinteiros de Ribeira"
 nd_glc_carpinteiros_de_ribeira_desc: "The shipwrights of the rías build on the open beach by eye, lapping each plank over the last. Their trincado carries sardines in peacetime. In wartime it carries a letter of marque and twenty men with cutlasses.\n\nUnlocks the #bold Trincado#!."
 nd_glc_irmans_nodal: "The Nodal Brothers"
 nd_glc_irmans_nodal_desc: "Bartolomé and Gonzalo García de Nodal of Pontevedra sail in 1618 with two caravels to see whether the Dutch have truly found a way past the end of America. They pass the new strait, round the Horn, return through Magellan's strait and come home within the year without losing a man."
 nd_glc_colexio_do_cardeal: "Colexio do Cardeal"
 nd_glc_colexio_do_cardeal_desc: "Cardinal Rodrigo de Castro gives the Jesuits a college at Monforte de Lemos in 1593: a front of granite as long as a palace, a school for the sons of the gentry, and on its walls the painters he had come to know as Archbishop of Seville."
 nd_glc_fidalguia_dos_pazos: "The Gentry of the Pazos"
 nd_glc_fidalguia_dos_pazos_desc: "The fidalgo takes land from a monastery on a long lease at an old rent, lets it again to the man who works it at a new one, and builds a house of granite with a chapel, a dovecote and a cypress on the difference.\n\nUnlocks the #bold Pazo#!."
 nd_glc_barroco_compostelan: "Baroque of Compostela"
 nd_glc_barroco_compostelan_desc: "Domingo de Andrade raises the clock tower of the cathedral, and those who come after him cut granite into flat plates and hang them on a front like joinery. The canteiros who do the work speak a jargon of their own, so that no client can follow what they say about him.\n\nUnlocks the #bold Obradoiro de Canteiros#!."
 nd_glc_departamento_maritimo: "Maritime Department of the North"
 nd_glc_departamento_maritimo_desc: "In 1726 the ría of Ferrol, which can be entered only by a channel a cannon shot wide, is made the seat of the navy of the north. A fishing village becomes a dockyard with a town attached.\n\nUnlocks the #bold Reais Estaleiros#!."
 nd_glc_segadores: "Segadores"
 nd_glc_segadores_desc: "Every June the gangs walk to Castile with their sickles to cut another man's wheat, and in August they walk home with the wages. The silver pays the rent. For three months the villages are left to the women and the old."
 nd_glc_doce_apostolos: "The Twelve Apostles"
 nd_glc_doce_apostolos_desc: "Twelve ships of the line are laid down side by side on the slips of Esteiro to the plans of Jorge Juan, and the yard names them for the Apostles. When a British army lands in 1800 to burn the dockyard, it is beaten off on the heights of Brión.\n\nUnlocks the #bold Navío do Apostolado#!."
 nd_glc_correos_maritimos: "Correos Marítimos"
 nd_glc_correos_maritimos_desc: "From 1764 a packet leaves A Coruña every month for Havana with the mail of the Indies, and soon another for the River Plate. Each may carry a cargo out and a cargo home, and the port has a consulate of merchants of its own within a generation."
 nd_glc_fomentadores_da_salga: "The Fomentadores"
 nd_glc_fomentadores_da_salga_desc: "Catalans come to the rías with the drag net and the press. They pack the sardine in salt under weighted beams until the oil runs out, and sell it the length of the Mediterranean. The old confraternities take them to court and lose.\n\nUnlocks the #bold Salga de Prensa#! method of the Confraría de Mareantes."
 nd_glc_ferro_e_louza: "Iron and Earthenware"
 nd_glc_ferro_e_louza_desc: "Antonio Raimundo Ibáñez builds a blast furnace in the wooded parish of Sargadelos and casts pots and shot there. In 1806 he adds a pottery that prints its ware from copper plates in the manner of Bristol.\n\nUnlocks the #bold Real Fábrica de Sargadelos#!."
 nd_glc_reconquista_de_vigo: "Reconquest of Vigo"
 nd_glc_reconquista_de_vigo_desc: "In March 1809 the country people of the south take Vigo from its French garrison. In June they hold the bridge of Sampaio against Marshal Ney, and the French leave Galicia for good.\n\nUnlocks the #bold Paisanaxe#! levy and the #bold Batallón Literario#!."
 # ===== UNITS AND LEVIES =====
 a_nd_glc_hoste_da_mitra: "Hoste da Mitra"
 a_nd_glc_hoste_da_mitra_desc: "The tenants of the Terra de Santiago with shield, spear and iron cap, sworn on the Apostle's altar. They form quickly and strike hard. They are tenants and not a household, and pressed hard they go home."
 levy_nd_glc_hoste_da_mitra: "Hoste da Mitra Levy"
 levy_nd_glc_hoste_da_mitra_desc: "Peasants, laborers and soldiers called out under the Pertigueiro Maior."
 a_nd_glc_irmandinos: "Irmandiños"
 a_nd_glc_irmandinos_desc: "Sworn men of the Santa Irmandade: townsmen with crossbows, peasants with bills and scythes on poles, under captains they chose. They are furious at a castle gate and have no armour to speak of."
 levy_nd_glc_irmandinos: "Irmandiño Levy"
 levy_nd_glc_irmandinos_desc: "Peasants, laborers and burghers sworn to the brotherhood."
 a_nd_glc_milicia_do_reino: "Milicia do Reino"
 a_nd_glc_milicia_do_reino_desc: "The parish companies of the coast, armed with arquebus and pike from the royal store. They are steady behind a wall and first to the alarm. They are not trained to manoeuvre."
 levy_nd_glc_milicia_do_reino: "Milicia do Reino Levy"
 levy_nd_glc_milicia_do_reino_desc: "Peasants, laborers, soldiers and burghers on the muster roll of their parish."
 n_nd_glc_trincado: "Trincado"
 n_nd_glc_trincado_desc: "The clinker-built coaster of the rías, with a raked mast and a single lug sail. It is fast, needs few hands and can be hauled up a beach. It is lightly built and lightly armed."
 n_nd_glc_navio_do_apostolado: "Navío do Apostolado"
 n_nd_glc_navio_do_apostolado_desc: "A two-decker of Esteiro, framed in northern oak to the plans of Jorge Juan. It is stout and sails well. It carries fewer guns than a three-decker."
 a_nd_glc_paisanaxe: "Paisanaxe"
 a_nd_glc_paisanaxe_desc: "The armed country people of 1809, with fowling pieces, scythes made into pikes and a few captured muskets, led by an abbot or a retired captain. They know every lane and strike first. Held under fire in the open, they waver."
 levy_nd_glc_paisanaxe: "Paisanaxe Levy"
 levy_nd_glc_paisanaxe_desc: "Peasants and laborers raised by the parish bell against an occupying army."
 a_nd_glc_batallon_literario: "Batallón Literario"
 a_nd_glc_batallon_literario_desc: "The students and masters of the University of Santiago, formed in forty-two days in 1808 with Minerva on their colours. They are keen and hard to frighten. They were never taught to spare themselves."
 # ===== BUILDINGS AND PRODUCTION METHODS =====
 nd_glc_obradoiro_de_acibeche: "Obradoiro de Acibeche"
 nd_glc_obradoiro_de_acibeche_desc: "A workshop of jet carvers and badge casters at the door of a cathedral. Scallop shells, figures of the Apostle and amulets are cut in black jet and set in silver, and the pilgrim's badge is cast in tin."
 nd_glc_acibeche_e_prata: "Jet and Silver"
 nd_glc_acibeche_e_prata_desc: "Carved jet is set in silver, and the scallop badge is cast in tin for those who cannot afford it."
 nd_glc_confraria_de_mareantes: "Confraría de Mareantes"
 nd_glc_confraria_de_mareantes_desc: "The mariners' confraternity of a fishing town. It owns the great seine in shares, decides who may shoot it and when, keeps the lamp of its chapel lit and buries its dead."
 nd_glc_cerco_real: "Cerco Real"
 nd_glc_cerco_real_desc: "The confraternity's own seine is shot from the boats of the whole quarter, and the catch is salted in open tubs."
 nd_glc_salga_de_prensa: "Salga de Prensa"
 nd_glc_salga_de_prensa_desc: "The sardine is packed in salt in casks and pressed under weighted beams until the oil runs out. It keeps for a year and travels as far as Italy."
 nd_glc_priorado_vinateiro: "Priorado Viñateiro"
 nd_glc_priorado_vinateiro_desc: "A house of two or three monks among the vines, with a press, a cellar and the tenants who work the terraces for a share. The wine goes up to the abbey and down the river to the ships."
 nd_glc_vino_do_priorado: "Priory Wine"
 nd_glc_vino_do_priorado_desc: "The vines are staked and dressed, and the wine is pressed and laid down in the priory's own casks."
 nd_glc_torre_do_senor: "Torre do Señor"
 nd_glc_torre_do_senor_desc: "The tower house of a lord: a square keep of granite on a rock, a handful of squires and crossbowmen, and the right to make every tenant in sight of it carry stone and mount guard. The nobles are stronger for it and the district hates it."
 nd_glc_torre_do_senor_maintenance: "Keeping the Tower"
 nd_glc_torre_do_senor_maintenance_desc: "The walls are mended, the squires are armed and mounted, and the lord's table is supplied with wine."
 nd_glc_casa_da_especiaria: "Casa da Especiaría"
 nd_glc_casa_da_especiaria_desc: "The House of Spices: a factor, a treasurer and an accountant of the Crown in a northern port, with a warehouse for the cloves and the right to fit out the fleets that fetch them. There is one in the whole kingdom."
 nd_glc_casa_da_especiaria_maintenance: "Registers and Outfitting"
 nd_glc_casa_da_especiaria_maintenance_desc: "Every cargo is entered in the books, and the fleets are supplied with cordage, canvas and gear from the house's stores."
 nd_glc_pazo: "Pazo"
 nd_glc_pazo_desc: "The country house of a fidalgo, in granite, with a coat of arms over the door, a chapel, a dovecote and a cypress. The family lives on the rents of the valley and sees that the valley is worked."
 nd_glc_pazo_maintenance: "Keeping the House"
 nd_glc_pazo_maintenance_desc: "The roof and the garden wall are kept up, and the rooms are furnished as a gentleman's should be."
 nd_glc_obradoiro_de_canteiros: "Obradoiro de Canteiros"
 nd_glc_obradoiro_de_canteiros_desc: "A yard of granite masons. The stone arrives from the quarry in the rough and leaves as ashlar, mouldings and balusters."
 nd_glc_canteria_de_gra: "Dressed Granite"
 nd_glc_canteria_de_gra_desc: "Rough blocks are squared, moulded and numbered for the building they are meant for."
 nd_glc_reais_estaleiros: "Reais Estaleiros"
 nd_glc_reais_estaleiros_desc: "The royal dockyards of a maritime department: slips side by side, a mast pond, a rope walk, forges and stores inside one wall. Ships are built and repaired faster where the yards stand. There is one in the whole kingdom."
 nd_glc_reais_estaleiros_maintenance: "Stores of the Arsenal"
 nd_glc_reais_estaleiros_maintenance_desc: "Timber, tar, cordage, tools and iron are kept in the magazines for the ships on the slips."
 nd_glc_fabrica_de_sargadelos: "Real Fábrica de Sargadelos"
 nd_glc_fabrica_de_sargadelos_desc: "A blast furnace and a pottery in one wooded parish, with ore from the hill, charcoal from the oak woods and white clay from the next valley."
 nd_glc_sargadelos_ferro_coado: "Cast Iron"
 nd_glc_sargadelos_ferro_coado_desc: "Ore is smelted with charcoal and cast into pots, grates and tools."
 nd_glc_sargadelos_louza_fina: "Louza Fina"
 nd_glc_sargadelos_louza_fina_desc: "Fine white earthenware is glazed with lead and decorated by transfer from engraved copper plates."
 # ===== DESTINY TREE =====
 nd_glc_dest_santiago_25_tt: "#bold Santiago de Compostela#! is ours and its development is at least #bold 25#!"
 nd_glc_dest_santiago_30_tt: "#bold Santiago de Compostela#! is ours and its development is at least #bold 30#!"
 nd_glc_dest_santiago_40_tt: "#bold Santiago de Compostela#! is ours, is a city, and its development is at least #bold 40#!"
 nd_glc_dest_tres_confrarias_tt: "At least #bold 3#! of our locations have a #bold Confraría de Mareantes#!"
 nd_glc_dest_coruna_29_tt: "#bold A Coruña#! is ours and its development is at least #bold 29#!"
 nd_glc_dest_casa_erguida_tt: "The #bold Casa da Especiaría#! stands in one of our ports"
 nd_glc_dest_coruna_34_tt: "#bold A Coruña#! is ours, is at least a town, and its development is at least #bold 34#!"
 nd_glc_dest_cravo_na_coruna_tt: "#bold A Coruña#! is ours and #bold cloves#! are produced or traded in its market"
 nd_glc_dest_coruna_46_tt: "#bold A Coruña#! is ours, is a city, and its development is at least #bold 46#!"
 nd_glc_destiny: "The Two Heads of the Kingdom"
 nd_glc_destiny_desc: "Galicia has a king again, and the question the court settled when it chose its seat now has to be answered with deeds. The shrine and the harbour each have a road ahead of them, and the kingdom will take the one it chose. Keep the realm steady and the first step can be taken."
 nd_glc_dest_pio_latrocinio: "The Pious Theft"
 nd_glc_dest_pio_latrocinio_desc: "Braga was the mother church of old Gallaecia, and Compostela has never forgiven it. In 1102 Bishop Diego Gelmírez visited its churches as a guest and left with the bodies of its saints in his baggage. Take Braga itself, and let Santiago de Compostela grow to a development of 25 with the treasury to pay for what follows."
 nd_glc_dest_dereitos_de_merida: "The Rights of Mérida"
 nd_glc_dest_dereitos_de_merida_desc: "In 1120 Pope Calixtus II made Compostela a metropolitan see and gave it the rights of Mérida, whose archbishops had been gone since the conquest. With them came bishoprics far from Galicia. Hold Ciudad Rodrigo and Coria, embrace the Renaissance, and raise Santiago de Compostela to a development of 30."
 nd_glc_dest_provincia_do_apostolo: "The Province of the Apostle"
 nd_glc_dest_provincia_do_apostolo_desc: "Until 1393 the bishops of Lamego, Guarda and Évora were consecrated by the archbishop of Santiago, whatever the King of Portugal thought of it. Hold all three, and make Santiago de Compostela a city with a development of 40, so that the province has a capital worth the name."
 nd_glc_dest_mar_de_inglaterra: "The Sea of England"
 nd_glc_dest_mar_de_inglaterra_desc: "Salted sardine, Ribeiro wine and pilgrims on the return leg: the ships of the rías are in Bristol and Bruges every summer. Build a Confraría de Mareantes in three locations along the coast and raise A Coruña to a development of 29."
 nd_glc_dest_armada_do_cravo: "The Clove Fleet"
 nd_glc_dest_armada_do_cravo_desc: "A Coruña is a safe harbour and lies nearer to the buyers of the north than Seville does. That was the whole argument for the House of Spices, and it was a good one. Build the Casa da Especiaría, embrace the New World, and make A Coruña a town with a development of 34."
 nd_glc_dest_illas_do_cravo: "The Clove Islands"
 nd_glc_dest_illas_do_cravo_desc: "Seven ships left A Coruña for the Moluccas in July 1525 and one arrived. The Emperor sold the claim four years later, and the House of Spices closed. Hold Tidore, directly or through a colony or company, bring its cloves to the market of A Coruña, and make the port a city with a development of 46."
 nd_glc.7.t: "The Two Heads of the Kingdom"
 nd_glc.7.d: "The court has its seat and the kingdom has had time to get used to it. The archbishop's chapter and the shipmasters of the king's town have each sent a memorial setting out what the Crown should do next. They do not agree on a single point, which surprises nobody. One of them was written by the side that won the argument at the founding, and that is the one the council will read."
 nd_glc.7.a: "The seat is chosen. Now the kingdom must earn it."
 nd_glc.7.a_tt: "The path chosen at the formation of the kingdom can now be followed."
 nd_glc.8.t: "The Saints Come Home"
 nd_glc.8.d: "When Diego Gelmírez carried Saint Fructuosus and three other saints out of Braga in 1102, his own chroniclers called it a pious theft and thought the phrase did him credit. Braga called it a theft and left out the adjective.\n\nBraga is now ours, and its canons have been told that the relics will stay where they are. They were also told, politely, that a church which could not keep its saints had no business keeping its rank. Pilgrims who used to stop at Braga on the Portuguese road now have one shrine fewer to choose between."
 nd_glc.8.a: "The saints chose Compostela. So has Braga, now."
 nd_glc.8.a_tt: "The old metropolis of Gallaecia answers to Santiago."
 nd_glc.9.t: "The Rights of Mérida"
 nd_glc.9.d: "The bull of 1120 gave Compostela a province on parchment: the sees that had once answered to Mérida, strung along the Portuguese march from the Douro to the Tagus. For two centuries the archbishops consecrated bishops they could not protect, in cities that belonged to other kings.\n\nCiudad Rodrigo and Coria now belong to this one. The archbishop can summon his suffragans and expect them to come. The chapter is divided on what to do with them when they arrive: sit in judgment over their quarrels, or take their best young clerks and teach them at Compostela."
 nd_glc.9.a: "Every appeal in the province ends at the archbishop's court."
 nd_glc.9.a_tt: "Less separatism and unrest for 15 years. Fewer sailors."
 nd_glc.9.b: "Send us your canons. They will go home knowing more."
 nd_glc.9.b_tt: "Better-read clergy, faster research and cheaper advisors for 15 years."
 nd_glc.10.t: "The Province of the Apostle"
 nd_glc.10.d: "In 1393 Pope Boniface IX made Lisbon a metropolitan see and gave it Lamego, Guarda and Évora, and the last Portuguese bishop stopped writing to Compostela. That has been undone. The province runs from Fisterra to the plains beyond the Tagus, and Santiago is a city fit to head it.\n\nTwo proposals are before the archbishop. One is to throw the doors open: to keep every Holy Year with all the ceremony the treasury can bear and let the pilgrims do the rest. The other is older and more dangerous. Toledo calls itself Primate of the Spains and Braga has used the same title. Compostela has the Apostle, and now it has the province."
 nd_glc.10.a: "Open the Holy Door. Let all Christendom walk here."
 nd_glc.10.a_tt: "Towns and cities draw people and prosper, and prestige grows, for 20 years."
 nd_glc.10.b: "There is one Apostle in Spain, and one Primate."
 nd_glc.10.b_tt: "More diplomats and faster conversion for 20 years. The court costs more."
 nd_glc.11.t: "The Sea of England"
 nd_glc.11.d: "The mariners' confraternities shoot their seines from Ribadeo round to the Miño, and what they salt goes north in their own ships with the wine of the Ribeiro on top of it. A Coruña has grown on the proceeds. Its merchants keep a factor in Bristol, they know the price of cloth in Bruges before the court does, and they have begun to ask why the kingdom's trade should stop where the charts do."
 nd_glc.11.a: "A harbour that feeds Bristol can do more than that."
 nd_glc.11.a_tt: "The mariners of the rías make A Coruña a port that counts."
 nd_glc.12.t: "The Clove Fleet"
 nd_glc.12.d: "The House of Spices has its factor, its treasurer and an empty warehouse. Cloves grow on a handful of islands on the far side of the world, and somebody has to go and fetch them.\n\nIn 1525 the fleet that sailed from A Coruña was paid for in good part by the factor himself, Cristóbal de Haro of Burgos, and by the German bankers who stood behind him. The Crown commanded it and the merchants owned it. The same offer is on the table now. The other course is for the king to pay for his own ships and owe nobody a share of the cargo."
 nd_glc.12.a: "Let the factor raise the money. He knows where it is."
 nd_glc.12.a_tt: "Cheaper and larger loans for 15 years. Levies are smaller."
 nd_glc.12.b: "The king's ships, the king's cloves."
 nd_glc.12.b_tt: "A cheaper navy, faster expeditions and less attrition at sea for 15 years."
 nd_glc.13.t: "The Clove Islands"
 nd_glc.13.d: "Of the seven ships that left A Coruña in 1525 one reached the Spice Islands, and the men who landed from it held out among the clove trees for years waiting for a relief that never came. Their king had sold the islands while they waited.\n\nNobody has sold Tidore this time. The cloves come round half the world to the quays under the Tower of Hercules, and the merchants of the town have a court of their own to settle what they are worth. The council must decide what the islands are for: a cargo to be sold on to Flanders and England as fast as it can be landed, or a possession to be fortified and kept."
 nd_glc.13.a: "Sell to the north. That was always the point."
 nd_glc.13.a_tt: "Better selling prices and trade power for 20 years. Forts cost more to keep."
 nd_glc.13.b: "Build a fort on Tidore. Nobody sells it again."
 nd_glc.13.b_tt: "Larger garrisons, loyal subjects and safer sea lanes for 20 years."
 STATIC_MODIFIER_NAME_nd_glc_dest_xulgado_metropolitano: "The Metropolitan's Court"
 STATIC_MODIFIER_DESC_nd_glc_dest_xulgado_metropolitano: "Appeals from every see of the province are heard at Compostela. The far cities are held closer, and a kingdom that looks inland mans fewer ships."
 STATIC_MODIFIER_NAME_nd_glc_dest_escola_dos_conegos: "The Canons' School"
 STATIC_MODIFIER_DESC_nd_glc_dest_escola_dos_conegos: "The chapters of the province send their young clerks to study at Compostela, and the kingdom has its pick of them."
 STATIC_MODIFIER_NAME_nd_glc_dest_ano_santo: "Holy Year"
 STATIC_MODIFIER_DESC_nd_glc_dest_ano_santo: "When the feast of Saint James falls on a Sunday the Holy Door is opened, and the roads to Compostela fill."
 STATIC_MODIFIER_NAME_nd_glc_dest_primado_das_espanas: "Primate of the Spains"
 STATIC_MODIFIER_DESC_nd_glc_dest_primado_das_espanas: "The archbishop claims the first place among the churches of Spain. Legates and preachers go out, and the court that receives the answers costs more to keep."
 STATIC_MODIFIER_NAME_nd_glc_dest_credito_de_haro: "The Factor's Credit"
 STATIC_MODIFIER_DESC_nd_glc_dest_credito_de_haro: "The merchants pay for the fleet and take their share. Money is cheap, and men who can earn wages on the quays do not answer the muster."
 STATIC_MODIFIER_NAME_nd_glc_dest_frota_de_loaisa: "The King's Fleet"
 STATIC_MODIFIER_DESC_nd_glc_dest_frota_de_loaisa: "The Crown fits out the clove fleet at its own cost and keeps the yards and victuallers that served it."
 STATIC_MODIFIER_NAME_nd_glc_dest_cravo_para_flandres: "Cloves for Flanders"
 STATIC_MODIFIER_DESC_nd_glc_dest_cravo_para_flandres: "The cloves are sold on to the north as fast as they are landed. The money goes to the counting houses and not to the walls."
 STATIC_MODIFIER_NAME_nd_glc_dest_forte_de_tidore: "The Fort at Tidore"
 STATIC_MODIFIER_DESC_nd_glc_dest_forte_de_tidore: "A garrison on the island and ships to keep the passage. The islands are held, and those who serve the Crown overseas know it will not sell them."
 nd_glc_dest_real_consulado: "Real Consulado"
 nd_glc_dest_real_consulado_desc: "The merchants' own court: a prior and two consuls who settle suits of trade without lawyers, and who keep a school of navigation for pilots and a library open to the town."
 nd_glc_dest_real_consulado_maintenance: "Consulado Upkeep"
 nd_glc_dest_real_consulado_maintenance_desc: "Paper and books for the court and its library, instruments for the school of navigation and cloth for the hall."

 # ===== BUREAUCRACIES =====
 glc_adiantado_maior_bureaucracy: "Adiantado Maior de Galicia"
 glc_adiantado_maior_bureaucracy_desc: "In 1263 Alfonso X set an adiantado maior over Galicia in place of the old meiriño maior. He stands for the king in the kingdom: he calls out its counts and knights, judges, and keeps the peace, and he is owed his table wherever he rides. The Castro of Lemos and the Sarmiento of Ribadavia have held the office, and the Cortes of 1312 set the king's own judges beside it."
 glc_foros_de_tres_voces_bureaucracy: "Foros de Tres Voces"
 glc_foros_de_tres_voces_bureaucracy_desc: "Since the Cistercians wrote the first of them at the end of the twelfth century, land in Galicia is let by foro: the monastery or the lord keeps the lordship of the ground and the tiller holds its use for three lives, or for three kings and twenty-nine years more, against a fixed rent in kind. When the term ends the land returns and the improvements are paid for. Four fifths of the tilled land is held so, much of it sublet by the gentry who stand between the abbot and the plough."
 glc_alfolins_do_sal_bureaucracy: "Alfolíns do Sal"
 glc_alfolins_do_sal_bureaucracy_desc: "Salt belongs to the king, and it is sold from his stores in the ports, the alfolíns, where each town draws the measure assigned to it and may buy nowhere else. The towns protested in the Cortes of 1318, 1345 and 1351 and were not heard. On the rías the store decides the season: without salt the sardine cannot be kept, and the salting houses of Pontevedra stand beside the alfolíns."
 glc_real_padroado_do_hospital_bureaucracy: "Real Padroado do Grande Hospital"
 glc_real_padroado_do_hospital_bureaucracy_desc: "The Catholic Monarchs found the sick pilgrims of Santiago badly kept, and on 3 May 1499 charged Diego de Muros, dean of the chapter, with building them a hospital under royal patronage, endowed with a third of the Voto de Santiago of Granada. A pilgrim who shows the compostela is lodged three days without charge, and the constitutions of Charles V of 1524 call the house the Grande Hospital Real. Most of its beds are filled by the people of the city and the country round."

 # The auto modifier that grants the country's slots on formation
 AUTO_MODIFIER_NAME_nd_glc_bureaucracy_authority: "Offices of the Kingdom of Galicia"
 AUTO_MODIFIER_DESC_nd_glc_bureaucracy_authority: "The court of Galicia has room for two institutions of its own: the Adiantado Maior de Galicia, the Foros de Tres Voces, the Alfolíns do Sal or the Real Padroado do Grande Hospital."
