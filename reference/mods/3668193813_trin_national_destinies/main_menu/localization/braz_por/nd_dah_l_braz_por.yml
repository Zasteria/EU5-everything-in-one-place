l_braz_por:
 nd_dah_ghezo_reforms: "Ghezo's Reforms"
 nd_dah_ghezo_reforms_desc: "King Ghezo transformed Dahomey from a tributary of the Oyo Empire into a formidable military power. He formalized the Agojie female warriors into a standing regiment of thousands, professionalized the army with European drill techniques, and reorganized provincial governance under rotating military governors who served at the king's pleasure."
 nd_dah_palm_oil_economy: "Palm Oil Transition"
 nd_dah_palm_oil_economy_desc: "As British cruisers pressed on the overseas slave trade, Ghezo and the merchants of Whydah turned to palm oil. Captives who would once have been sold abroad were set to work in the palm groves, and the first casks left the beach beside the slave ships. By the 1830s the oil was a steady second export, though it never matched the revenue of the slave trade."
 nd_dah_xwetanu_ceremonies: "Annual Customs"
 nd_dah_xwetanu_ceremonies_desc: "The Xwetanu, Dahomey's Annual Customs, was the kingdom's most important ceremonial institution. This weeks-long festival combined ancestor veneration, military reviews, political councils, trade fairs, and the redistribution of wealth. It was the arena where the king displayed his power, resolved disputes between factions, and set policy for the coming year."
 nd_dah_abomey_artisans: "Abomey Artisan Tradition"
 nd_dah_abomey_artisans_desc: "The Royal Palaces of Abomey housed a remarkable artistic tradition. Palace artisans created polychrome clay bas-reliefs commemorating each king's reign, elaborate applique textiles depicting military victories, and carved wooden bocio figures imbued with spiritual power. Each king's palace added to a 200-year architectural chronicle of Fon civilization."
 nd_dah_behanzin_resistance: "Breaking the Yoke of Oyo"
 nd_dah_behanzin_resistance_desc: "For a century Dahomey paid a yearly tribute to the Alafin of Oyo. Ghezo refused it, and when Oyo sent an army in 1823 to collect by force, the Fon met it in the hill country north of Abomey and broke it. The kingdom was armed for that war with guns bought at Whydah, and its soldiers used the bush and the hills they knew to wear the invader down."
 a_nd_dah_agojie_veterans: "Agojie Veterans"
 a_nd_dah_agojie_veterans_desc: "The formalized Agojie regiment under Ghezo numbered up to 6,000 women, roughly a third of Dahomey's total military. Rigorously trained in pain endurance, speed, and close combat, they were organized into specialized sub-units: huntresses, riflewomen, reapers, archers, and gunners. European observers consistently judged them superior to their male counterparts in effectiveness and bravery."
 a_nd_dah_fon_riflemen: "Fon Musketeers"
 a_nd_dah_fon_riflemen_desc: "Ghezo's line infantry, armed with trade muskets bought at Whydah and drilled to fire by ranks. In the war against Oyo these soldiers used their knowledge of the country to mount ambushes and harassing retreats through forest and bush."
 nd_dah_palm_oil_works: "Palm Oil Works"
 nd_dah_palm_oil_works_desc: "Processing facilities for the extraction and preparation of palm oil for export. Under Ghezo's direction, Dahomey's economy shifted from the slave trade to palm oil production, with former captives redirected to work the palm plantations that fed these workshops."
 nd_dah_palm_oil_processing: "Palm Oil Processing"
 nd_dah_palm_oil_processing_desc: "Oil is pressed from the fruit and kernels of the oil palm and sold as the base of soaps, salves and ointments."
 nd_dah_royal_atelier: "Royal Artisan Atelier"
 nd_dah_royal_atelier_desc: "Workshop attached to the royal palace complex where master artisans produce the distinctive bas-relief panels, applique textiles, and carved figures that chronicle Dahomey's history and glorify the reign of each king."
 nd_dah_bas_relief_craft: "Bas-Relief Craft"
 nd_dah_bas_relief_craft_desc: "Artisans work clay from ant-hills into polychrome bas-reliefs, pressing mineral pigment dyes and fired pottery fragments into wet surfaces to create the vivid panels that adorn the walls of Abomey's royal palaces."
 levy_nd_dah_fon_riflemen: "Fon Musketeer Levy"
 levy_nd_dah_fon_riflemen_desc: "Mobilized Fon infantry armed with trade muskets, drawn from the peasant and soldier populations to defend the kingdom."
 STATIC_MODIFIER_NAME_nd_dah_standing_army: "Dahomey Standing Army"
 STATIC_MODIFIER_DESC_nd_dah_standing_army: "Ghezo's professionalization of Dahomey's military created one of West Africa's most formidable fighting forces, with permanent regiments drilled in European techniques and the legendary Agojie at its core."
 STATIC_MODIFIER_NAME_nd_dah_royal_monopoly: "Royal Trade Monopoly"
 STATIC_MODIFIER_DESC_nd_dah_royal_monopoly: "The Dahomean crown exercised near-total control over foreign trade, with the Yovogan (viceroy of Whydah) managing all transactions with European merchants and ensuring the kingdom extracted maximum value from its exports."
 nd_dah.1.t: "The Transformation of Dahomey"
 nd_dah.1.d: "King Ghezo has overthrown his predecessor Adandozan with the help of the Brazilian slave trader Francisco Felix de Sousa, ending Dahomey's humiliating tribute to the Oyo Empire. The new king faces a choice that will define a generation: pour the kingdom's resources into building the most professional army in West Africa, or tighten the crown's grip on trade to build an economic powerhouse that can sustain Dahomey's independence through wealth rather than war alone.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dah.1.a: "Forge the Agojie into an unbreakable sword"
 nd_dah.1.b: "The Yovogan shall control every cowrie that flows through Whydah"
 nd_dah.2.t: "The Tribute Refused"
 nd_dah.2.d: "Since the days of Tegbesu the kings of Dahomey have sent a yearly tribute to the Alafin of Oyo: cowries, cloth, guns and people. Ghezo has sent the Alafin's envoys home with nothing. Oyo, torn by its own wars, has gathered what cavalry it still commands and marched to take by force what was refused.\n\nThe army of Dahomey has met the invaders in the hill country north of Abomey. The horsemen of the savanna have found no open ground to charge across, only muskets firing from the bush and a kingdom that knows every path. The Oyo host is broken and its commander is dead. No tribute will go north again."
 nd_dah.2.a: "Dahomey will not kneel"
 nd_dah_formed_tt: "Dahomey has been formed"
 nd_dah_path_a_tt: "Chose Dahomey Standing Army"
 nd_dah_path_b_tt: "Chose Royal Trade Monopoly"
 AUTO_MODIFIER_NAME_nd_dah_bureaucracy_authority: "Bureaucratic Office of Dahomey"
 AUTO_MODIFIER_DESC_nd_dah_bureaucracy_authority: "The palace at Abomey keeps permanent offices of its own. Three more institutions of Fon governance may be kept at a time."
 dah_migan_mehu_bureaucracy: "Migan and Mehu"
 dah_migan_mehu_bureaucracy_desc: "The Ahosu of Dahomey ruled through two paramount ministers deliberately drawn from non-royal lineages: the Migan, chief executioner and prime minister, who handled justice and internal security, and the Mehu, comptroller of the royal household, who managed finance and foreign trade. Houegbadja institutionalized the pairing in the late seventeenth century, and beneath it sat lesser officers: the Yovogan at Whydah, the Sogan over the royal stables, the Tokpo over agriculture. Under Ghezo (king from 1818) the duumvirate became the engine of Dahomey's military-fiscal recovery from Oyo tribute."
 dah_yovogan_whydah_bureaucracy: "Yovogan of Whydah"
 dah_yovogan_whydah_bureaucracy_desc: "After Agaja conquered the kingdom of Whydah in 1727 Dahomey absorbed the Atlantic slave-trading port of Glehue and posted a permanent royal viceroy (the Yovogan, literally 'chief of the white men') to govern the harbor and tax every cargo passing through the European factories. The Yovogan held a monopoly on price negotiation with European captains, levied a per-head export duty, and remitted gold and goods to Abomey on a fixed schedule. Under Ghezo the office began to deal in palm oil as British anti-slavery patrols pressed on the Atlantic slave market."
 dah_agojie_corps_bureaucracy: "Agojie Corps"
 dah_agojie_corps_bureaucracy_desc: "The Agojie (Mino, 'our mothers'), known to Europeans as the Dahomey Amazons, were a corps of female soldiers attached to the royal palace. Originating under Queen Hangbe in the early eighteenth century as elephant huntresses and palace guards, they were formalized under Agaja and expanded under Ghezo into a standing regiment of perhaps six thousand troops, roughly a third of the kingdom's military strength. Officially wives of the king, they lived inside the palace walls in barracks under their own female officers and gave the throne a permanent striking force outside the male nobility's cavalry."
 dah_xwetanu_customs_bureaucracy: "Xwetanu Annual Customs"
 dah_xwetanu_customs_bureaucracy_desc: "The Xwetanu, Dahomey's Annual Customs, was a weeks-long festival held each dry season at Abomey that combined ancestor veneration, military review, judicial assize, trade fair, and royal redistribution of wealth. The Ahosu personally handed out cowries, cloth, captives, and titles to the assembled chiefs and ministers; offerings were made at the tombs of previous kings; new decrees were proclaimed and disputes arbitrated. Under Ghezo the Customs lasted six weeks and consumed the surplus of the entire year."
 dah_nesuhwe_cult_bureaucracy: "Nesuhwe Royal Cult"
 dah_nesuhwe_cult_bureaucracy_desc: "The Nesuhwe was the cult of the deified royal ancestors of Dahomey, administered at Abomey under the Tassinon, chief priest of the royal-line spirits. Each deceased king entered the Nesuhwe pantheon and received continuous offerings at his tomb-shrine; Quenum diviners performed Fa consultation on royal business. The Nesuhwe stood alongside but distinct from the wider Vodun pantheon of Mawu-Lisa, Legba, Sakpata, and Hevioso whose priests served commoners. By making the kings themselves objects of cult worship, the Nesuhwe wove the throne directly into Fon religious life."
