 STATIC_MODIFIER_NAME_nd_rjp_sword_of_rajputana: "Épée du Rajputana"
 STATIC_MODIFIER_DESC_nd_rjp_sword_of_rajputana: "Les clans Rajput ont été regroupés en une seule lame. Sous la bannière du Rajputana uni, l’aristocratie guerrière part à la guerre comme une seule et même unité, sa valeur ancestrale canalisée dans un instrument de conquête et de défense qui rivalise avec n’importe quelle armée du sous-continent."
 STATIC_MODIFIER_NAME_nd_rjp_desert_throne: "Trône du désert"
 STATIC_MODIFIER_DESC_nd_rjp_desert_throne: "Du cœur aride du Rajasthan s’élève un royaume de splendeur. Les cours Rajput allient dévotion hindoue, mécénat artistique et ambition architecturale, transformant les palais-forteresses en centres culturels qui attirent des marchands, des érudits et des artisans de tout le sous-continent."
 STATIC_MODIFIER_NAME_nd_rjp_sanga_united_clans: "Clans unis de Sangram"
 STATIC_MODIFIER_DESC_nd_rjp_sanga_united_clans: "Sous Rana Sanga, les clans Rajput en guerre ont mis de côté leurs querelles pour former une puissante confédération. Ensemble, ils commandent des armées qu’aucun sultan ne peut égaler."
 STATIC_MODIFIER_NAME_nd_rjp_sanga_mewar_defiance: "Le défi de Mewar"
 STATIC_MODIFIER_DESC_nd_rjp_sanga_mewar_defiance: "Mewar est seul face à tous ceux qui arrivent. Là où d'autres plient le genou, la lignée Sisodia continue de se battre, les collines et les déserts du Rajputana sont leur bouclier et honorent leur forteresse qu'aucun siège ne peut briser."
 nd_rjp.1.t: "La montée du Rajputana"
 nd_rjp.1.d: "The great Rajput clans have been united under a single banner. For centuries, the Chauhans, Rathores, Sisodias, and Kachhwahas have each defended their own kingdoms, Mewar with its impregnable Chittorgarh, Marwar with its desert horsemen, Amber with its diplomatic cunning. Now these proud warrior houses stand together as one realm: Rajputana.\n\nThe question before us is what manner of kingdom this confederation shall become. The sword-arms of a hundred clans hunger for glory, their cavalry feared across Hindustan. But the courts of Rajasthan also overflow with poets, painters, and architects whose work rivals any in the world. Shall we let the blade define us, or the throne?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rjp.1.a: "Nos épées traceront les frontières du Rajputana."
 nd_rjp.1.b: "Nos palais feront l'envie des rois."
 nd_rjp.2.t: "Confédération de Rana Sanga"
 nd_rjp.2.d: "Maharana Sangram Singh I of Mewar, Rana Sanga, has achieved what was thought impossible: the unification of the Rajput clans into a fighting confederacy capable of challenging the mightiest powers of northern India. By 1521, his domain stretches from Mandu in the south to Agra in the northeast and the Indus in the west. He has won eighteen pitched battles against the Sultans of Delhi, Malwa, and Gujarat, earning a reputation as the greatest warrior-king of his age.\n\nHis body bears the marks of his campaigns (eighty wounds, the loss of an arm and an eye) yet his spirit remains unbroken. The Rajput clans rally to his banner not through coercion but through the magnetism of his valor. The question is whether this confederacy should press outward as a united force, or channel its strength into making Mewar an impregnable bastion of Rajput independence."
 nd_rjp.2.a: "Que les clans chevauchent ensemble sous une même bannière."
 nd_rjp.2.b: "Mewar ne pliera jamais : nos collines sont notre trône."
 nd_rjp.3.t: "Le Lion de Mewar"
 nd_rjp.3.d: "At Haldighati in 1576, Maharana Pratap Singh of Mewar faced the full might of the Mughal Empire with barely half their numbers. Though the battle itself was inconclusive, what followed defined Mewar's character for generations. Rather than submit as other Rajput houses had done, Pratap retreated into the Aravalli hills and waged a guerrilla war that kept Mewar's independence alive. He abandoned his palaces, lived in the wilderness, and rebuilt his forces one village at a time.\n\nBy the time of his death in 1597, Pratap had recovered nearly all of Mewar's lost territories through sheer persistence. His legend (the king who chose exile over surrender, who ate bread made from grass seeds rather than bow to an emperor) became the defining story of Rajput honor. No wealth, no comfort, no imperial favor was worth the price of freedom."
 nd_rjp.3.a: "Son sacrifice ne sera jamais oublié."
 nd_rjp.4.t: "La ville rose"
 nd_rjp.4.d: "In 1727, Maharaja Sawai Jai Singh II of Amber founded a new capital city on the plains below his hilltop fortress. Unlike the organic sprawl of most Indian cities, Jaipur was planned from the ground up according to the principles of Vastu Shastra and the Shilpa Shastra, incorporating a precise grid layout with wide boulevards, standardized building heights, and zoned districts for different trades.\n\nJai Singh was no mere builder. He was also one of the foremost astronomers of his age. His Jantar Mantar observatory, constructed with massive stone instruments of his own design, produced astronomical tables more accurate than those of contemporary European observatories. The city he built would become the jewel of Rajputana: a monument to the idea that Rajput civilization could rival any in the world in both learning and beauty."
 nd_rjp.4.a: "Une ville à la hauteur de nos ambitions."
 nd_rjp.5.t: "Les Lanciers de Jodhpur"
 nd_rjp.5.d: "The Sardar Risala of Marwar, better known as the Jodhpur Lancers, traces its lineage to 1212, when Raja Rao Shinajee formed a personal bodyguard of mounted warriors. Over seven centuries, this unit evolved from feudal retinue to one of the finest cavalry formations in India. Armed with lance, saber, and an unshakeable belief in the Rathore martial tradition, the Jodhpur Lancers carried the warrior spirit of Rajputana into the modern age.\n\nTheir horsemanship remains legendary, bred on the hardy Marwari horses of the Thar Desert, these cavalrymen fight with a ferocity and skill that has earned respect from every army they have faced."
 nd_rjp.5.a: "La lance Rathore ne faiblit jamais."
 nd_rjp_clan_oaths: "Serments du clan Rajput"
 nd_rjp_clan_oaths_desc: "Les liens féodaux entre les clans Rajputana, scellés par des serments de sang et des alliances matrimoniales, constituent l'épine dorsale de la force militaire du Rajputana. Chaque clan fournit à son thakur des guerriers montés liés par l'honneur."
 nd_rjp_hill_fort_tradition: "Tradition du fort de la colline"
 nd_rjp_hill_fort_tradition_desc: "Les Rajputs sont devenus maîtres de la fortification défensive, construisant des forteresses au sommet d'une colline qui utilisaient le terrain naturel des Aravallis et du Thar pour créer des positions pratiquement imprenables."
 nd_rjp_stepwell_engineering: "Ingénierie des puits à degrés"
 nd_rjp_stepwell_engineering_desc: "Dans le paysage aride du Rajasthan, la construction de baolis, des puits à gradins élaborés descendant de nombreux étages sous terre, ont fourni un stockage d'eau fiable et sont devenus des merveilles architecturales à part entière."
 nd_rjp_kshatriya_dharma: "Kshatriya Dharma"
 nd_rjp_kshatriya_dharma_desc: "Le code du guerrier Rajput, enraciné dans les traditions Kshatriya des écritures hindoues, exigeait la valeur martiale, la protection des faibles, le dévouement à son seigneur et la volonté de se battre et de mourir plutôt que d'accepter le déshonneur."
 nd_rjp_desert_caravans: "Caravanes du désert"
 nd_rjp_desert_caravans_desc: "Le commerce coulait à travers le désert du Thar le long d'anciennes routes caravanières reliant les ports du Gujarat à la plaine du Gange. Les royaumes Rajput se sont enrichis en taxant et en protégeant ces corridors commerciaux vitaux."
 nd_rjp_temple_architecture: "Architecture des temples"
 nd_rjp_temple_architecture_desc: "Les royaumes Rajput du Rajasthan ont produit d'extraordinaires temples hindous et jaïns, avec des structures en grès et en marbre finement sculptées sur des sites comme Ranakpur et Dilwara, démontrant la maîtrise de l'art sculptural."
 nd_rjp_chittorgarh_resistance: "Résistance de Chittorgarh"
 nd_rjp_chittorgarh_resistance_desc: "Trois fois assiégée par des dirigeants musulmans, la garnison de Chittorgarh a choisi à trois reprises la mort plutôt que la reddition. La forteresse est devenue le symbole du défi Rajput, ses défenseurs l'étalon par lequel le courage était mesuré."
 nd_rjp_court_poetry: "Tradition de la poésie de cour"
 nd_rjp_court_poetry_desc: "Les tribunaux Rajput maintenaient des traditions bardiques élaborées. Les poètes de la cour, charans et bhats, composaient des ballades héroïques célébrant la valeur du clan, documentant l'histoire dynastique à travers des vers qui servaient à la fois de chronique et d'inspiration."
 nd_rjp_jauhar_tradition: "Tradition Jauhar-Saka"
 nd_rjp_jauhar_tradition_desc: "La coutume Rajput du jauhar, sacrifice de soi massif des femmes d'une forteresse assiégée, combinée au saka, l'accusation de mort finale des hommes, représentait le refus ultime de se soumettre. Cette tradition a rendu la résistance Rajput terriblement absolue."
 nd_rjp_marwari_merchants: "Réseaux de marchands Marwari"
 nd_rjp_marwari_merchants_desc: "Depuis les villes désertiques de Shekhawati et Marwar, les marchands du Rajasthan ont construit des réseaux commerciaux s'étendant à travers l'Inde. Leur réputation de sens financier et de fiabilité a fait du commerçant Marwari un incontournable du commerce indien."
 nd_rjp_kumbhalgarh_wall: "Mur de Kumbhalgarh"
 nd_rjp_kumbhalgarh_wall_desc: "La grande forteresse de Rana Kumbha comportait des murs s'étendant sur 36 kilomètres, parmi les plus longs murs de fortification continus au monde. Ce vaste périmètre défensif abritait des temples, des fermes et des colonies au sein de son circuit."
 nd_rjp_akhara_martial_schools: "Écoles martiales d'Akhara"
 nd_rjp_akhara_martial_schools_desc: "Les guerriers Rajput se sont entraînés dès l'enfance dans les akharas, des gymnases de combat où ils maîtrisaient l'escrime, la lutte, le tir à l'arc et le combat à cheval. Ces institutions ont produit génération après génération de combattants qualifiés."
 nd_rjp_marwari_horse_tradition: "The Tilwara Horse Fair"
 nd_rjp_marwari_horse_tradition_desc: "Each spring the dry bed of the Luni at Tilwara fills with horses, camels and cattle for the fair held in the name of Rawal Mallinath. The studs of Marwar send their colts to be seen, and the Rathore thakurs buy the remounts their horsemen ride to war."
 nd_rjp_sanga_confederacy: "Confédération de Sanga"
 nd_rjp_sanga_confederacy_desc: "Rana Sanga a uni les clans Rajput en une formidable confédération militaire, remportant dix-huit batailles rangées contre les sultans de Delhi, Malwa et Gujarat. Son royaume à son apogée s'étendait du Mandu à l'Indus."
 nd_rjp_marwari_merchant_houses: "Maisons de marchands de Marwari"
 nd_rjp_marwari_merchant_houses_desc: "The Havelis of Shekhawati (ornate merchant mansions decorated with frescoes, mirror work, and gold leaf) displayed the vast wealth accumulated by Marwari traders. These mansions became centers of commerce and culture."
 nd_rjp_mughal_alliance: "Alliance Rajput-Moghole"
 nd_rjp_mughal_alliance_desc: "À commencer par Raja Man Singh d'Amber, plusieurs maisons Rajput ont conclu des alliances matrimoniales et des partenariats militaires avec l'empire moghol. Les généraux Rajput sont devenus parmi les commandants les plus fiables et les plus compétents de l'armée moghole."
 nd_rjp_miniature_painting: "The Court Karkhanas"
 nd_rjp_miniature_painting_desc: "The Rajput courts keep workshops inside the palace on the model of the imperial karkhanas: one for arms, one for cloth, one for books and one for pictures. Each has its keeper and its ledger, and what it makes is the raja's to give."
 nd_rjp_prataps_resistance: "La résistance guérilla de Pratap"
 nd_rjp_prataps_resistance_desc: "After Haldighati, Maharana Pratap abandoned his palaces and waged a guerrilla campaign from the Aravalli hills, recovering nearly all of Mewar's lost territory through persistence and intimate knowledge of the terrain. The Bhil bowmen of those hills fought beside him at Haldighati and guided his bands through the passes for twenty years afterwards."
 nd_rjp_camel_corps: "Risala de chameau"
 nd_rjp_camel_corps_desc: "Les corps de cavalerie à dos de chameaux de Marwar et de Bikaner étaient particulièrement adaptés aux vastes étendues désertiques de l'ouest du Rajputana. À partir du XVe siècle, ces unités assuraient la mobilité sur des terrains où la cavalerie conventionnelle avait du mal."
 nd_rjp_aurangzeb_resistance: "Résistance d'Aurangzeb"
 nd_rjp_aurangzeb_resistance_desc: "Lorsque l'intolérance religieuse de l'empereur Aurangzeb menaça l'autonomie Rajput et les traditions hindoues, les royaumes Rajput se révoltèrent. Les guerres qui suivirent épuisèrent les ressources mogholes et accélérèrent le déclin de l'empire."
 nd_rjp_jaipur_founding: "Fondation de Jaipur"
 nd_rjp_jaipur_founding_desc: "Le Maharaja Sawai Jai Singh II a fondé la ville planifiée de Jaipur en 1727, incorporant les principes du Vastu Shastra aux côtés de ses propres observations astronomiques. La Ville Rose est devenue un modèle d’urbanisme en Inde."
 nd_rjp_opium_trade_advance: "Commerce de l'opium du Rajasthan"
 nd_rjp_opium_trade_advance_desc: "The poppy fields of Malwa and Rajputana produced opium that became one of the most lucrative trade commodities of the era. Rajput kingdoms derived substantial revenue from controlling the cultivation and export of this valuable product."
 nd_rjp_jagirdari_system: "Système Jagirdari"
 nd_rjp_jagirdari_system_desc: "Le système féodal Rajput des jagirs, concessions de terres aux nobles guerriers en échange du service militaire, a créé une structure de mobilisation militaire décentralisée mais efficace. Chaque jagirdar entretenait une suite proportionnelle à sa propriété."
 nd_rjp_jantar_mantar: "Observatoires Jantar Mantar"
 nd_rjp_jantar_mantar_desc: "Maharaja Sawai Jai Singh II constructed five astronomical observatories across India, the largest in Jaipur. Using massive masonry instruments of his own design, he produced star catalogs of remarkable accuracy."
 nd_rjp_royal_karkhanas: "Karkhanas royaux"
 nd_rjp_royal_karkhanas_desc: "Les tribunaux Rajput entretenaient des ateliers gérés par l'État, les karkhanas, produisant des textiles, des armes, des bijoux et d'autres produits de luxe. Ces ateliers combinaient des techniques artisanales traditionnelles avec des normes artistiques fixées par le mécénat royal."
 nd_rjp_musketeer_tradition: "Tradition des mousquetaires Rajput"
 nd_rjp_musketeer_tradition_desc: "L'aristocratie guerrière Rajput, longtemps attachée à l'épée et à la lance, a progressivement adopté les armes à feu sans abandonner son éthos martial. Les mousquetaires Rajput combinaient la discipline de l'infanterie moderne avec la valeur personnelle de la tradition Kshatriya."
 nd_rjp_marwari_banking: "Banques Marwari"
 nd_rjp_marwari_banking_desc: "Depuis leurs origines désertiques, les financiers Marwari ont établi des opérations bancaires et de prêt d’argent dans toute l’Inde. Leurs hundis, lettres de change, facilitaient les échanges à longue distance et leur valurent une réputation de banquiers du sous-continent."
 nd_rjp_autonomy_treaties: "Traités d'autonomie"
 nd_rjp_autonomy_treaties_desc: "Alors que le pouvoir moghol diminuait, les royaumes Rajput négocièrent des traités garantissant leur autonomie interne. Ces accords préservaient l'autorité des dirigeants Rajput sur leurs domaines tout en reconnaissant une suzeraineté nominale."
 nd_rjp_textile_renaissance: "Renaissance textile du Rajasthan"
 nd_rjp_textile_renaissance_desc: "The block-printing and tie-dyeing traditions of Rajasthan, particularly the famed bandhani and ajrakh techniques, produced textiles prized across India and beyond. Cities like Jaipur and Sanganer became centers of the textile trade.\n\n#italic Available in: $nd_rjp_karkhana$#!"
 nd_rjp_court_patronage: "Patronage de la Cour Rajput"
 nd_rjp_court_patronage_desc: "The later Rajput courts became renowned patrons of music, dance, painting, and literature. The artistic traditions nurtured in palaces from Udaipur to Jaipur produced some of the finest expressions of Indian culture.\n\n#italic Available in: $nd_rjp_suratkhana$#!"
 nd_rjp_jodhpur_lancers: "Lanciers de Jodhpur"
 nd_rjp_jodhpur_lancers_desc: "Les Sardar Risala de Marwar, les Jodhpur Lancers, ont retracé leur lignée de 1212 jusqu'à l'ère moderne. Armés de lance et de sabre sur des chevaux Marwari, ils incarnaient sept siècles de tradition martiale de Rathore."
 nd_rjp_princely_reforms: "Réformes de l'État princier"
 nd_rjp_princely_reforms_desc: "Les dirigeants Rajput les plus progressistes ont introduit des réformes administratives, créant des tribunaux, des établissements d'enseignement et des systèmes fiscaux modernes tout en préservant l'autorité traditionnelle des maisons dirigeantes."
 nd_rjp_marwari_industrialists: "Industriels Marwari"
 nd_rjp_marwari_industrialists_desc: "Les familles de marchands Marwari, après avoir accumulé de vastes richesses grâce au commerce et à la banque, se sont tournées vers l'entreprise industrielle. Leurs investissements dans le textile, l’exploitation minière et l’industrie manufacturière ont jeté les bases de l’industrie indienne moderne."
 nd_rjp_martial_legacy: "L'héritage martial Rajput"
 nd_rjp_martial_legacy_desc: "Les traditions guerrières des clans Rajput (des siècles de combat de cavalerie, de défense de forteresse et un code d'honneur qui privilégiait avant tout la valeur) ont perduré jusqu'à l'ère moderne, constituant la base d'un service militaire distingué."
 nd_rjp_heritage_architecture: "Architecture du patrimoine"
 nd_rjp_heritage_architecture_desc: "Les palais, forts et temples du Rajasthan représentent des siècles de réalisations architecturales. Des palais lacustres d'Udaipur à la citadelle de grès de Jaisalmer, ces structures constituent des monuments de la civilisation Rajput."
 nd_rjp_desert_irrigation: "Irrigation du désert"
 nd_rjp_desert_irrigation_desc: "Les systèmes modernes de barrages et de canaux ont transformé le paysage aride du Rajasthan, apportant de l'eau aux régions qui dépendaient des pluies saisonnières et des puits à degrés depuis des siècles. Cette infrastructure a permis l'expansion agricole dans les marges du Thar."
 a_nd_rjp_rajput_sowar: "Rajput Sowar"
 a_nd_rjp_rajput_sowar_desc: "Cavalerie féodale des clans Rajput, guerriers à cheval liés par des serments de clan pour se battre pour leur thakur. Armés de lance et d'épée tulwar, ils chargent avec la fureur née de générations de tradition martiale."
 a_nd_rjp_marwari_lancer: "Marwari Lancer"
 a_nd_rjp_marwari_lancer_desc: "Cavalerie d'élite montée sur les chevaux Marwari distinctifs du désert du Thar. Élevés pour l'endurance et le courage, ces chevaux et leurs cavaliers excellent dans les raids rapides à travers les plaines arides du Rajputana."
 a_nd_rjp_chela_swordsman: "Chela épéiste"
 a_nd_rjp_chela_swordsman_desc: "L'infanterie de garnison s'entraînait dans les akharas des villes forteresses Rajput. Ces épéistes servent de dernière ligne de défense lorsque les murs sont percés, combattant avec une détermination fanatique enracinée dans la tradition jauhar."
 a_nd_rjp_camel_risala: "Risala de chameau"
 a_nd_rjp_camel_risala_desc: "Cavalerie du désert montée sur des chameaux, particulièrement adaptée aux opérations dans le vaste désert du Thar. Là où la cavalerie conventionnelle hésite dans le sable, la risala maintient sa mobilité, transportant des fournitures à travers des étendues sans eau."
 a_nd_rjp_rajput_musketeer: "Mousquetaire Rajput"
 a_nd_rjp_rajput_musketeer_desc: "Infanterie Rajput modernisée armée de mousquets à mèche et plus tard de mousquets à silex. Ces guerriers combinent le courage personnel de la tradition Kshatriya avec le tir discipliné de la doctrine de l'infanterie moderne."
 a_nd_rjp_jodhpur_lancer: "Lancier de Jodhpur"
 a_nd_rjp_jodhpur_lancer_desc: "La cavalerie légendaire du clan Rathore, héritière de sept siècles de guerre à cheval dans les déserts de Marwar. Armés d'une lance à pointe d'acier et d'un sabre incurvé, ils font la fierté de la tradition militaire du Rajputana."
 a_nd_rjp_bhil_archer: "Bhil Archer"
 a_nd_rjp_bhil_archer_desc: "Bowmen of the Bhil hill people of the Aravallis, sworn allies of the house of Mewar, whose arms show a Bhil standing beside a Rajput. They know every pass and ravine of the range and loose their long bamboo bows from cover, but they wear no armour and do not stand in a line."
 a_nd_rjp_rajputana_rifles: "Rajputana Rifles"
 a_nd_rjp_rajputana_rifles_desc: "Rifle battalions recruited from the Rajput clans, the sons of sowars and fortress swordsmen drilled as modern light infantry. They hold their ground under fire with the steadiness the old code demanded, and pay for that pride in casualties."
 nd_rjp_durg: "Rajput Durg"
 nd_rjp_durg_desc: "Une forteresse au sommet d'une colline construite dans la tradition architecturale Rajput, utilisant la capacité de défense naturelle de la chaîne d'Aravalli et des marges du Thar pour créer une place forte pratiquement imperméable aux assauts."
 nd_rjp_durg_maintenance: "Garnison de Durg"
 nd_rjp_durg_maintenance_desc: "Entretien des murs de pierre et des armements d'une forteresse Rajput perchée au sommet d'une colline."
 nd_rjp_baoli: "Puits à degrés Baoli"
 nd_rjp_baoli_desc: "Un puits étagé élaboré descendant profondément sous terre, fournissant un stockage d'eau fiable dans le climat aride du Rajasthan. Ces merveilles d’ingénierie servent également de lieux de rassemblement sympas pour la communauté."
 nd_rjp_baoli_maintenance: "Entretien du puits à degrés"
 nd_rjp_baoli_maintenance_desc: "Entretien des escaliers en pierre et des canaux d'eau d'un puits à degrés du Rajasthan."
 nd_rjp_marble_temple: "Maru-Gurjara Temple"
 nd_rjp_marble_temple_desc: "A temple in the carved style of western India, every pillar, ceiling and doorway worked into figures and lacework in white marble or sandstone. The great examples at Dilwara and Ranakpur were paid for by ministers and merchants, stand in remote Aravalli valleys, and draw pilgrims from across the subcontinent."
 nd_rjp_marble_temple_maintenance: "Temple Stonecutters"
 nd_rjp_marble_temple_maintenance_desc: "Hereditary sompura stonecutters keep the carving in repair with marble from the quarries, common stone and fine chisels."
 nd_rjp_haveli: "Marwari Haveli"
 nd_rjp_haveli_desc: "Un manoir marchand orné de fresques, de miroirs et de façades en grès sculpté. Ces havelis servent à la fois de résidence et de comptoir pour les riches familles commerçantes Marwari."
 nd_rjp_haveli_maintenance: "Entretien du Haveli"
 nd_rjp_haveli_maintenance_desc: "Entretenir les éléments décoratifs élaborés et les opérations commerciales d'un manoir marchand Marwari."
 nd_rjp_akhara: "Rajput Akhara"
 nd_rjp_akhara_desc: "Un terrain d'entraînement de guerriers traditionnel où les jeunes Rajputs apprennent l'escrime, la lutte, le tir à l'arc et le combat monté auprès de vétérans expérimentés. Ces institutions constituent le fondement de la culture martiale Rajput."
 nd_rjp_akhara_maintenance: "Fournitures de formation Akhara"
 nd_rjp_akhara_maintenance_desc: "Fournir des armes, des chevaux et des provisions aux guerriers s'entraînant dans un akhara Rajput."
 nd_rjp_karkhana: "Rajasthan Karkhana"
 nd_rjp_karkhana_desc: "Un atelier royal produisant des textiles raffinés, de la ferronnerie, des bijoux et des armes sous le patronage de la cour. Ces entreprises publiques combinent l’artisanat traditionnel du Rajasthan avec les ressources des trésors princiers."
 nd_rjp_karkhana_maintenance: "Production textile de Karkhana"
 nd_rjp_karkhana_maintenance_desc: "Les artisans de la cour transforment les tissus et les teintures en textiles raffinés, avec des broderies au fil de cuivre ajoutant une ornementation distinctive du Rajasthan."
 nd_rjp_block_printing: "Sanganeri Block Printing"
 nd_rjp_block_printing_desc: "Printers of the chhipa community stamp cotton cloth with carved teak blocks and fix the colours in the mineral-rich waters of Sanganer and Bagru, turning plain cloth into printed textiles sold across India."
 nd_rjp_marwari_stud: "Marwari Stud"
 nd_rjp_marwari_stud_desc: "A stud farm of the Marwari horse, the desert breed of the Rathores. It is kept in dry country, where horses are already raised in the local market."
 nd_rjp_suratkhana: "Suratkhana"
 nd_rjp_suratkhana_desc: "The painters' department of a Rajput court. Masters and apprentices grind pigments, burnish paper and paint the folios of the Mewar, Bundi and Kishangarh schools."
 nd_rjp_folio_painting: "Folio Painting"
 nd_rjp_folio_painting_desc: "Paper and mineral pigments are made into painted folios, kept as loose leaves in cloth wrappers."
 nd_rjp_poppy_fields: "Poppy Fields"
 nd_rjp_poppy_fields_desc: "Fields of opium poppy on the Mewar and Kota uplands. They are planted where medicinal crops are already grown for the local market."
 nd_rjp_opium_lancing: "Opium Lancing"
 nd_rjp_opium_lancing_desc: "The capsules are lanced at dusk and the sap is scraped at dawn, kneaded in earthen pans and packed in wooden chests."
 nd_rjp_vedhshala: "Jantar Mantar"
 nd_rjp_vedhshala_desc: "An observatory of great masonry instruments, as Sawai Jai Singh II built at Jaipur, Delhi, Ujjain, Mathura and Varanasi. It is found only in cities."
 nd_rjp_vedhshala_upkeep: "Observatory Upkeep"
 nd_rjp_vedhshala_upkeep_desc: "Masonry and plaster for the instruments, paper for the tables of observations and tools for the brass fittings."
 nd_rjp_marwari_breeding: "Élevage de chevaux Marwari"
 nd_rjp_marwari_breeding_desc: "Mares and stallions of the Marwari line are bred on millet fodder. The foals are hardy, enduring and known by their inward-curving ears."
 nd_rjp_bandhani_dyeing: "Teinture par nœuds Bandhani"
 nd_rjp_bandhani_dyeing_desc: "Cloth is tied in thousands of small knots and dyed bath after bath. The patterned veils and turbans are prized across India and beyond."
 levy_nd_rjp_rajput_sowar: "Prélèvement Rajput Sowar"
 levy_nd_rjp_rajput_sowar_desc: "Cavalerie féodale levée auprès des clans nobles Rajput."
 levy_nd_rjp_chela_swordsman: "Prélèvement sur l'épéiste Chela"
 levy_nd_rjp_chela_swordsman_desc: "Infanterie de garnison levée dans les villes fortifiées de Rajputana."
 levy_nd_rjp_bhil_archers: "Bhil Archers Levy"
 levy_nd_rjp_bhil_archers_desc: "Hill bowmen raised from the Bhil villages of the Aravallis."
 levy_nd_rjp_jodhpur_lancer: "Prélèvement sur les Lancer de Jodhpur"
 levy_nd_rjp_jodhpur_lancer_desc: "Cavalerie d'élite levée auprès de la noblesse Rathore de Marwar."
 nd_rjp_court_arts: "Court Albums"
 nd_rjp_court_arts_desc: "Whole series are commissioned by the court: ragamalas, the Gita Govinda, portraits of the darbar. More painters are kept, and the pages are finished in gold."
 nd_rjp_formed_tt: "Rajputana a été formé"
 nd_rjp_path_a_tt: "Choisissez l'épée du Rajputana"
 nd_rjp_path_b_tt: "Choisissez le trône du désert"
 nd_rjp_dest_amber_developed_tt: "We hold #bold Amber#! and it has at least 45 development"
 nd_rjp_dest_nagahrada_developed_tt: "We hold #bold Nagahrada#! and it has at least 38 development"
 nd_rjp_destiny: "Destin du Rajputana"
 nd_rjp_destiny_desc: "Les clans sont unis, le royaume proclamé. Maintenant, Rajputana doit choisir sa voie : l’épée ou le trône définiront-ils cet âge ? Atteignez la stabilité à travers le royaume pour commencer le chemin."
 nd_rjp_dest_iron_throne: "Le trône de fer de Delhi"
 nd_rjp_dest_iron_throne_desc: "Aucun royaume Rajput ne peut revendiquer la suprématie sur l’Hindoustan sans détenir Delhi, siège des sultans et des empereurs. Marchez vers le nord, saisissez la capitale et prouvez que les armes Rajput sont les maîtres de l'Inde."
 nd_rjp_dest_malwa_campaign: "La campagne Malwa"
 nd_rjp_dest_malwa_campaign_desc: "Une fois Delhi sécurisée, la confédération Rajput doit briser le pouvoir du sultanat de Malwa et projeter sa force au plus profond du cœur du Gange. Prenez Ujjain et la ville sainte de Varanasi pour établir la domination Rajput sur le centre de l'Inde."
 nd_rjp_dest_rajput_imperium: "L'Empire Rajput"
 nd_rjp_dest_rajput_imperium_desc: "La pierre angulaire de la puissance militaire Rajput : un empire s’étendant de l’Indus au Gange. Prenez Lahore et Lucknow, commandez la plus grande armée d'Inde et faites du roi-guerrier Rajput le dirigeant incontesté du sous-continent."
 nd_rjp_dest_marwari_ascendancy: "L'ascendant Marwari"
 nd_rjp_dest_marwari_ascendancy_desc: "Les réseaux marchands Marwari doivent s'étendre au-delà du Thar. Attirez la soie sur les marchés du Rajputana et construisez un trésor digne du trône du désert. C’est la richesse, et non la guerre, qui définira ce royaume."
 nd_rjp_dest_jewel_of_india: "Joyau de l'Inde"
 nd_rjp_dest_jewel_of_india_desc: "Rajputana must become the cultural and intellectual heart of India. Embrace modern banking, build Amber into the planned city that Jaipur became, and earn the prestige that comes from civilization, not just conquest."
 nd_rjp_dest_eternal_rajputana: "Rajputana éternel"
 nd_rjp_dest_eternal_rajputana_desc: "The final flowering: a civilization that endures through the ages. Master the printing press, bring marble to the markets, and raise in the lake country of Nagahrada, the old seat of Mewar, palaces that rival any in the world."
 nd_rjp.6.t: "Le destin du Rajputana"
 nd_rjp.6.d: "Rajputana est enfin uni. Les vents du désert portent la promesse de grandeur, que ce soit à travers le choc de l'acier ou la splendeur des palais de marbre, ce royaume laissera sa marque dans les siècles."
 nd_rjp.6.a: "Notre destin nous attend."
 nd_rjp.7.t: "Le trône de fer de Delhi"
 nd_rjp.7.d: "The Rajput banner flies over Delhi. For generations, the sultans ruled from this city while Rajput kings defended their desert strongholds. Now the tables are turned. A Rajput lord sits where the Sultan of Delhi once held court, and the warrior-clans who once fought merely to survive now command the greatest prize in northern India.\n\nThe seizure of Delhi sends a message that reverberates across the subcontinent: the age of the Sultanate is over. The age of Rajputana has begun."
 nd_rjp.7.a: "Les guerriers du désert tiennent le trône des rois."
 nd_rjp.8.t: "La campagne Malwa"
 nd_rjp.8.d: "The rich lands of Malwa and the Gangetic plain have fallen before Rajput arms. Ujjain, the ancient city sacred to Shiva, now shelters a Rajput garrison. The holy ghats of Varanasi, where pilgrims have bathed since time immemorial, lie within our borders.\n\nThis is more than a military campaign. It is the assertion of Rajput civilizational authority over the heartland of India. The question is how to consolidate these vast conquests."
 nd_rjp.8.a: "Que les vainqueurs prennent ce que l'épée a gagné."
 nd_rjp.8.b: "Établir l’autorité Rajput par la loi et l’ordre."
 nd_rjp.9.t: "L'Empire Rajput"
 nd_rjp.9.d: "From Lahore to Lucknow, from the Thar Desert to the banks of the Ganga, the Rajput empire now encompasses the greatest extent of any kingdom ruled by the warrior-clans. What began as a confederation of desert fortress-states has become the dominant power of the subcontinent.\n\nThe Kshatriya dharma has been fulfilled beyond the dreams of any ancestor. The question is what form this empire shall take in the centuries to come."
 nd_rjp.9.a: "Construisez une armée impériale permanente pour tenir le royaume."
 nd_rjp.9.b: "Maintenir la tradition confédérée des clans."
 nd_rjp.10.t: "L'ascendant Marwari"
 nd_rjp.10.d: "Les maisons de marchands du Shekhawati et de Marwar ont étendu leurs réseaux commerciaux bien au-delà du désert. La soie provenant de pays lointains circule sur les marchés du Rajputana et les trésors du royaume se gonflent de la richesse du commerce. La réputation de Marwari pour son sens financier a fait de Rajputana un centre de commerce indien."
 nd_rjp.10.a: "La richesse afflue vers ceux qui en connaissent la valeur."
 nd_rjp.11.t: "Joyau de l'Inde"
 nd_rjp.11.d: "Rajputana has become a beacon of civilization. The planned cities, the observatories, the miniature painting schools, the textile workshops, together they represent a flowering of culture that rivals any in the world. Scholars and artisans flock to the courts of the Rajput kings, drawn by patronage and the refinement of a kingdom that has chosen beauty over bloodshed.\n\nThe question is whether to invest further in the cultural splendor that defines Rajputana, or to empower the merchant houses that fund it all."
 nd_rjp.11.a: "Laissez la Ville rose briller comme un phare de la culture."
 nd_rjp.11.b: "Les princes marchands ont gagné leur place à la cour."
 nd_rjp.12.t: "Rajputana éternel"
 nd_rjp.12.d: "The marble palaces stand eternal against the desert wind. Rajputana has become more than a kingdom. It is a civilization, a living testament to what the Rajput spirit can achieve when directed toward creation rather than destruction. The Jal Mahal rises from the waters of Man Sagar, its white marble shimmering in the desert sun, a palace that seems to float between earth and sky.\n\nThis is the legacy of the Desert Throne: a kingdom that endures not through fear of its armies, but through the admiration of the world."
 nd_rjp.12.a: "Préserver notre patrimoine pour toujours."
 nd_rjp.12.b: "Investissez dans les connaissances qui construisent l’avenir."
 STATIC_MODIFIER_NAME_nd_rjp_dest_victors_march: "La marche des vainqueurs"
 STATIC_MODIFIER_DESC_nd_rjp_dest_victors_march: "L'armée Rajput balaie les territoires conquis, se renforce rapidement et s'empare du butin de guerre. La maintenance de la forteresse souffre à mesure que les ressources sont affectées à la campagne."
 STATIC_MODIFIER_NAME_nd_rjp_dest_rajput_hegemony: "Hégémonie Rajput"
 STATIC_MODIFIER_DESC_nd_rjp_dest_rajput_hegemony: "L'autorité du trône Rajput est établie sur les terres conquises, garantissant des conditions de paix favorables et la loyauté des dirigeants soumis."
 STATIC_MODIFIER_NAME_nd_rjp_dest_kshatriya_empire: "Empire Kshatriya"
 STATIC_MODIFIER_DESC_nd_rjp_dest_kshatriya_empire: "A standing imperial army befitting a subcontinent-spanning empire, though paying it month after month debases the coin."
 STATIC_MODIFIER_NAME_nd_rjp_dest_confederate_sword: "Épée confédérée"
 STATIC_MODIFIER_DESC_nd_rjp_dest_confederate_sword: "La vieille tradition confédérée des clans Rajput, une armée flexible bâtie sur des soldats professionnels à bas prix, complétés par des mercenaires et des réseaux de renseignement."
 STATIC_MODIFIER_NAME_nd_rjp_dest_pink_city_glory: "Gloire de la ville rose"
 STATIC_MODIFIER_DESC_nd_rjp_dest_pink_city_glory: "L'influence culturelle des villes planifiées et des traditions artistiques du Rajputana rayonne à travers l'Inde, même si le maintien d'une telle splendeur exige des dépenses judiciaires toujours plus somptueuses."
 STATIC_MODIFIER_NAME_nd_rjp_dest_merchant_princes: "Princes marchands du Rajputana"
 STATIC_MODIFIER_DESC_nd_rjp_dest_merchant_princes: "The Marwari merchant houses wield influence rivaling that of the warrior-nobility, their financial networks enabling diplomatic flexibility and a seat beside the thakurs at court."
 STATIC_MODIFIER_NAME_nd_rjp_dest_living_heritage: "Patrimoine vivant"
 STATIC_MODIFIER_DESC_nd_rjp_dest_living_heritage: "Les palais, temples et forteresses du Rajputana sont préservés et agrandis en tant que monuments vivants de la civilisation Rajput, attirant les populations dans l'orbite culturelle du royaume."
 STATIC_MODIFIER_NAME_nd_rjp_dest_desert_renaissance: "Renaissance du désert"
 STATIC_MODIFIER_DESC_nd_rjp_dest_desert_renaissance: "La modernisation agricole et la construction de routes transforment les marges arides du Rajasthan, tandis que les innovations militaires nées de la guerre dans le désert accentuent l'avantage du royaume."
 nd_rjp_rajput_citadel: "Citadelle Rajput"
 nd_rjp_rajput_citadel_desc: "L'expression suprême de l'architecture militaire Rajput : un complexe de forteresses massives au sommet d'une colline avec des murs concentriques, des armureries souterraines et des positions conçues pour dominer le paysage environnant. Une citadelle depuis laquelle un empereur Rajput commande son domaine."
 nd_rjp_citadel_maintenance: "Garnison de la Citadelle"
 nd_rjp_citadel_maintenance_desc: "Entretenir les murs de pierre, les armureries et la garnison d'une citadelle impériale Rajput."
 nd_rjp_jal_mahal: "Jal Mahal"
 nd_rjp_jal_mahal_desc: "Un palais construit sur les eaux d'un lac artificiel, ses murs de marbre et ses pavillons de grès surgissant de la surface comme un mirage devenu réalité. Le Jal Mahal est l'expression ultime de l'ambition architecturale Rajput, de la beauté, de l'ingénierie et de la splendeur royale réunies."
 nd_rjp_jal_mahal_maintenance: "Entretien du palais"
 nd_rjp_jal_mahal_maintenance_desc: "Entretenir les façades en marbre, les pavillons peints et les jardins paysagers du palais d'eau."

 # ===== BUREAUCRACIES =====

 rjp_bhat_charan_bardic_bureaucracy: "Cour bardique de Bhat-Charan"
 rjp_bhat_charan_bardic_bureaucracy_desc: "Les castes héréditaires bardiques-généalogistes du Rajasthan (les Bhats conservant les vamshavalis écrits des archives judiciaires et les Charans gardant leurs homologues oraux) préservent les rôles de lignée dont dépend toute revendication Rajput du statut de Kshatriya. Leur poésie lie l'aristocratie guerrière à un passé héroïque continu, et la menace charan de traga (automutilation rituelle qui place le nom d'un roi sous la honte publique) reste l'un des rares mécanismes capables de retenir un souverain Rajput en plein règne."

 rjp_thikana_pattedari_bureaucracy: "Thikana Pattedari"
 rjp_thikana_pattedari_bureaucracy_desc: "La pratique Mewari et Marwari consistant à diviser le royaume en thikanas détenus par des jagirdars ou des pattedars sur des chakri héréditaires : le service militaire. Chaque grande maison lève son propre contingent de cavalerie sous la direction de son thakur supérieur : les Seize Umrao de Mewar, les Huit Sardars de Jodhpur, les Douze Kotri de Bikaner. Le système déploie la majeure partie de la cavalerie Rajput sans armée permanente salariée, mais délègue un véritable pouvoir territorial aux maisons de guerriers dont les listes sont antérieures à tout trône au-dessus d'elles."

 rjp_saptanga_mantriparishad_bureaucracy: "Sapta-Anga Mantriparishad"
 rjp_saptanga_mantriparishad_bureaucracy_desc: "Le conseil privé du Maharana, organisé selon la théorie classique de l'art de gouverner à sept membres de l'Arthashastra et du Manusmriti : swami (souverain), amatya (ministre), janapada (population du royaume), durga (forts), kosha (trésor), danda (force) et mitra (alliés). Les pradhans de ces portefeuilles siègent sous le Maharana, un banc ministériel autochtone antérieur à l’appareil du diwan moghol et articulant la souveraineté Rajput en termes sanscritiques ininterrompus."

 rjp_kuldevi_shrine_bureaucracy: "Réseau de sanctuaires Kuldevi"
 rjp_kuldevi_shrine_bureaucracy_desc: "Les sanctuaires de déesses claniques-tutélaires liant chaque dynastie Rajput à un culte souverain-féminin : Eklingji à Kailashpuri, devant lequel les Sisodiyas de Mewar règnent en serviteurs de la déesse ; Karni Mata à Deshnoke pour les Rathores de Bikaner ; Jamwai Mata pour les Kachhwahas d'Ambre ; Naganechi Mata pour les Rathores de Marwar ; Ashapuri pour les Chauhans. Aucun couronnement Rajput n'est complet sans la reconnaissance des kuldevi, et les prêtres administrateurs de ces sanctuaires constituent la constitution rituelle ininterrompue du royaume."

 rjp_hindola_itinerant_court_bureaucracy: "Cour itinérante d'Hindola"
 rjp_hindola_itinerant_court_bureaucracy_desc: "Le darbar mobile porté par un palanquin par lequel les dirigeants Rajput exercent leur souveraineté - parcourant leurs thikanas et tenant leur cour dans les forteresses successives. Les Sisodiyas se déplacent entre Chittor, Kumbhalgarh et Udaipur; les Rathores entre Mandore, Mehrangarh et Jodhpur. Le palanquin hindola, le parapluie royal chhatra et la maison mobile font de chaque grand fort une capitale temporaire : une souveraineté de présence plutôt que de lieu, dans laquelle le roi se trouve partout où descend sa suite."

 rjp_mansabdari_compromise_bureaucracy: "Compromis de Mansabdari"
 rjp_mansabdari_compromise_bureaucracy_desc: "L'intégration après 1562 des chefs Rajput dans le système moghol mansab, en commençant par Raja Bharmal de la fille d'Amber, Jodha Bai, épousant Akbar et mûrissant sous Raja Man Singh I (mansab 7000), Mirza Raja Jai ​​Singh et Maharaja Jaswant Singh de Marwar. Les dirigeants Rajput détiennent des rangs impériaux et commandent les armées mogholes tout en conservant chez eux leurs jagirs ancestraux - une institution à double loyauté qui apporte richesse, prestige et l'ambiguïté corrosive de servir un trône extraterrestre dont les ordres pourraient un jour exiger du sang Rajput contre leurs compatriotes Rajputs."

 rjp_vijaya_stambha_bureaucracy: "Culte commémoratif Vijaya Stambha"
 rjp_vijaya_stambha_bureaucracy_desc: "Le culte institutionnel de la mémoire de l'honneur martial était centré sur le Vijaya Stambha de neuf étages du Maharana Kumbha à Chittor (1448, commémorant sa victoire sur Mahmud Khilji de Malwa) et sur l'ancien Kirti Stambha, complété par le complexe mémorial jauhar-saka marquant les trois sièges de Chittor en 1303, 1535 et 1568, lorsque les femmes de la forteresse furent immolées. eux-mêmes et les guerriers sont partis en robes safran pour la dernière sortie. Le pèlerinage à ces monuments introduit chaque nouvelle génération dans le dharma de la mort martiale."

 AUTO_MODIFIER_NAME_nd_rjp_bureaucracy_authority: "Autorité bureaucratique du Maharana"
 AUTO_MODIFIER_DESC_nd_rjp_bureaucracy_authority: "On the unification of Rajputana, the Maharana inherits the institutional substrate of every Rajput house that swore the bardic oath, and gains the standing to host historical bureaucracies."
