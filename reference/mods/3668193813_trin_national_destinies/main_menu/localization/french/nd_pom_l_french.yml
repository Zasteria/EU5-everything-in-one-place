l_french:
 STATIC_MODIFIER_NAME_nd_pom_griffins_dominion: "Le domaine du Griffon"
 STATIC_MODIFIER_DESC_nd_pom_griffins_dominion: "Sous la volonté de fer des ducs Griffin, les villes agitées et les barons agités de Poméranie ont été mis au pas. Le duché parle d'une seule voix, celle du duc."
 STATIC_MODIFIER_NAME_nd_pom_wendish_quarter: "Le quartier Wendish"
 STATIC_MODIFIER_DESC_nd_pom_wendish_quarter: "La Poméranie a adopté l'esprit hanséatique. Ses villes se gouvernent elles-mêmes, ses marchands naviguent librement et sa richesse provient des comptoirs de Stralsund et de Stettin, et non de la cour ducale."
 STATIC_MODIFIER_NAME_nd_pom_hanseatic_zenith: "Zénith hanséatique"
 STATIC_MODIFIER_DESC_nd_pom_hanseatic_zenith: "Les marchands de Poméranie sont au sommet du commerce baltique, leurs navires et leurs comptoirs font l'envie des mers du Nord."
 STATIC_MODIFIER_NAME_nd_pom_ducal_assertion: "Affirmation ducale"
 STATIC_MODIFIER_DESC_nd_pom_ducal_assertion: "Le duc Griffin a réaffirmé son contrôle sur les villes hanséatiques, plaçant leurs revenus sous la surveillance ducale."
 nd_pom.1.t: "La bannière du griffon"
 nd_pom.1.d: "The red griffin spreads its wings across Pomerania. For five centuries the House of Griffin has ruled these Baltic shores, navigating between the ambitions of Brandenburg to the south and the autonomy of the great Hanseatic cities within their own borders. Now, with Pomerania united, a choice must be made about the duchy's future.\n\nThe Griffin dukes have long struggled to impose their authority over cities like Stralsund and Stettin, whose Hanseatic privileges grant them near-independence. Shall the duke assert his ancient rights and forge a centralized state? Or shall he embrace the commercial republic within his realm, ruling in partnership with the merchant oligarchs whose wealth built these shores?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pom.1.a: "La parole du Griffin fait loi en Poméranie"
 nd_pom.1.b: "Que les villes hanséatiques soient notre force"
 nd_pom.2.t: "Le magasin de l'Oder"
 nd_pom.2.d: "Stettin a assuré sa position de porte d'entrée de l'Oder. Les céréales du Brandebourg et de la Grande Pologne coulent en aval vers les ports de Poméranie, tandis que le sel et le hareng voyagent vers l'intérieur des terres au retour. Les quarante corporations et les quais animés de la ville témoignent de sa richesse. Mais cette prospérité entraîne ses propres tensions : l'avenir commercial du duché sera-t-il guidé par la discipline collective de la ligue, ou par la main directe du duc ?"
 nd_pom.2.a: "La Hanse assure notre prospérité"
 nd_pom.2.b: "Le duc gouvernera le commerce"
 nd_pom.3.t: "Les murs de Stralsund"
 nd_pom.3.d: "Albrecht von Wallenstein, the mightiest general in the Empire, has brought his army before the walls of Stralsund. The city council refused the Capitulation of Franzburg, and now the imperial host camps before eleven gates and thirty watchtowers. Wallenstein reportedly swore he would take the city even if it were chained to heaven itself.\n\nBut Stralsund endures. Danish and Swedish ships break the blockade to supply the garrison. The burghers man the walls alongside professional soldiers. After weeks of fruitless assault, the imperial army withdraws. Stralsund has proven that a well-fortified city, defended by determined citizens, can resist even the most powerful army in Europe."
 nd_pom.3.a: "Le Griffin défie même les chaînes du ciel"
 nd_pom.4.t: "L'Université de Greifswald"
 nd_pom.4.d: "On October 17, 1456, Duke Wartislaw IX of Pomerania-Wolgast inaugurated a new university at Greifswald, established through the initiative and generous patronage of the city's mayor, Heinrich Rubenow. With papal approval already secured, the institution opens its doors as one of the few centers of learning in the entire Baltic region.\n\nThe university draws students from across the Hanseatic world, Scandinavians, Livonians, and Germans gather to study law, theology, and the arts. Within its first decades, hundreds of foreign scholars will pass through its halls, making Greifswald a beacon of learning amid the commerce of the Wendish Hanse."
 nd_pom.4.a: "Que le savoir fleurisse sur ces rives de la Baltique"
 nd_pom_wendish_shores: "Rives de Wendish"
 nd_pom_wendish_shores_desc: "Les Slaves de Poméranie pêchaient dans ces eaux baltiques et récoltaient l'ambre de ses côtes depuis des temps immémoriaux."
 nd_pom_griffin_dukedom: "Duché de Griffin"
 nd_pom_griffin_dukedom_desc: "La maison Griffin, portant sa bête héraldique rouge depuis le XIIe siècle, a établi l'autorité ducale sur les terres de Poméranie."
 nd_pom_christianization: "Christianisation de la Poméranie"
 nd_pom_christianization_desc: "La conversion des Slaves de Poméranie fit entrer le duché dans le monde chrétien latin, fondant des évêchés et des monastères le long de la côte."
 nd_pom_town_charters: "Chartes de la ville"
 nd_pom_town_charters_desc: "Les ducs de Poméranie accordèrent des droits municipaux aux établissements côtiers, déclenchant la croissance de villes qui allaient devenir des puissances hanséatiques."
 nd_pom_hanseatic_membership: "Adhésion hanséatique"
 nd_pom_hanseatic_membership_desc: "Les villes de Poméranie ont rejoint le quartier wendish de la Ligue hanséatique, liant ainsi leur fortune au plus grand réseau commercial d'Europe du Nord."
 nd_pom_stralsund_emporium: "Magasin de Stralsund"
 nd_pom_stralsund_emporium_desc: "Stralsund est devenue la deuxième ville de la Hanse, avec 300 navires battant sa bannière à travers la Baltique."
 nd_pom_herring_trade: "Foires au hareng"
 nd_pom_herring_trade_desc: "The great herring fairs of the Baltic coast have made Pomeranian ports the center of the northern fish trade. On the herring coasts the towns keep their Vitten, where the catch is salted and packed."
 nd_pom_greifswald_university: "Université de Greifswald"
 nd_pom_greifswald_university_desc: "Fondée en 1456 par le duc Wartislaw IX, l'université de Greifswald est l'une des plus anciennes d'Europe du Nord, attirant des universitaires de tout le monde hanséatique."
 nd_pom_baltic_fleet: "Flotte Baltique"
 nd_pom_baltic_fleet_desc: "Les constructeurs navals de Poméranie ont élargi la flotte du duché, faisant de la côte un centre de puissance maritime."
 nd_pom_stettin_emporium: "Magasin Stettin"
 nd_pom_stettin_emporium_desc: "Stettin domine le commerce sur la rivière Oder, les céréales de l'arrière-pays et le sel de la côte transitant par ses quais animés."
 nd_pom_amber_craft: "Artisanat d'ambre baltique"
 nd_pom_amber_craft_desc: "Les artisans de Poméranie ont élevé le travail de l'ambre au rang d'art raffiné, créant des bijoux et des objets de dévotion prisés dans toute l'Europe."
 nd_pom_burgher_autonomy: "Autonomie des bourgeois"
 nd_pom_burgher_autonomy_desc: "The Hanseatic towns have secured legal privileges that limit ducal interference, creating a unique balance between feudal and mercantile governance."
 nd_pom_kaperfahrt: "Papier à lettres"
 nd_pom_kaperfahrt_desc: "Les nobles de Poméranie et même certains ducs se sont livrés à des actes de piraterie sanctionnés par l'État, s'emparant de navires rivaux pour affirmer leur contrôle maritime sur le sud de la Baltique."
 nd_pom_stralsund_defenses: "Défenses de Stralsund"
 nd_pom_stralsund_defenses_desc: "Les murs légendaires de Stralsund, ses onze portes et ses trente tours de guet, se sont révélés imprenables même contre l'armée impériale de Wallenstein en 1628."
 nd_pom_evangelical_reform: "Réforme évangélique"
 nd_pom_evangelical_reform_desc: "Pomerania embraced the Protestant Reformation early, transforming its churches and universities into centers of Lutheran scholarship.\n\n#italic Available in: $nd_pom_greifswalder_kollegium$#!"
 nd_pom_last_griffin: "Le dernier griffon"
 nd_pom_last_griffin_desc: "Le duc Bogislaw XIV, le dernier de la dynastie Griffin qui a duré cinq siècles, a traversé l'impossible politique de la guerre de Trente Ans avec une habileté diplomatique."
 nd_pom_wartime_resilience: "Résilience en temps de guerre"
 nd_pom_wartime_resilience_desc: "Bien que la guerre de Trente Ans ait détruit les deux tiers de la population de Poméranie, les communautés survivantes se sont reconstruites avec une détermination farouche."
 nd_pom_urban_reconstruction: "Reconstruction urbaine"
 nd_pom_urban_reconstruction_desc: "After the devastation of the Thirty Years' War, Pomeranian towns slowly rebuilt their infrastructure and commercial networks."
 nd_pom_junker_estates: "Domaines Junker"
 nd_pom_junker_estates_desc: "La noblesse terrienne de Poméranie a consolidé de grands domaines agricoles, favorisant la production de céréales destinées à l'exportation via les ports baltes."
 nd_pom_baltic_admiralty: "Amirauté Baltique"
 nd_pom_baltic_admiralty_desc: "Sous l'administration suédoise puis prussienne, la Poméranie a maintenu ses traditions navales, formant des marins pour la flotte baltique."
 nd_pom_academic_renaissance: "Renaissance académique"
 nd_pom_academic_renaissance_desc: "L’Université de Greifswald, aujourd’hui la plus ancienne université du royaume suédois, connaît une renaissance scientifique sous un patronage éclairé."
 nd_pom_enlightenment_scholarship: "Bourse des Lumières"
 nd_pom_enlightenment_scholarship_desc: "Les érudits de Greifswald contribuent aux Lumières en produisant des ouvrages sur la philosophie naturelle, la jurisprudence et l'histoire régionale de la Baltique."
 nd_pom_stettin_industrialization: "Industrialisation de Stettin"
 nd_pom_stettin_industrialization_desc: "Stettin's Oder River port industrializes, with shipyards, foundries, and manufacturing transforming the medieval trading town into a modern city.\n\n#italic Available in: $nd_pom_amber_workshop$#!"
 nd_pom_modern_shipyards: "Chantiers navals modernes"
 nd_pom_modern_shipyards_desc: "Pomeranian shipyards adopt modern construction techniques, building faster and more capable vessels for the Baltic trade. The galeass, sailed by a handful of men, becomes the coast's own ship."
 nd_pom_economic_integration: "Intégration économique"
 nd_pom_economic_integration_desc: "La Poméranie s'intègre dans la sphère économique allemande plus large, ses ports reliant l'arrière-pays agricole aux marchés mondiaux."
 a_nd_pom_coastal_militia: "Milice côtière de Poméranie"
 a_nd_pom_coastal_militia_desc: "Bourgeois armés et paysans côtiers entraînés à la défense de leurs villes fortifiées, ces milices constituent l’épine dorsale de l’autodéfense de Poméranie."
 n_nd_pom_kogge: "Kogge de Poméranie"
 n_nd_pom_kogge_desc: "Le robuste rouage hanséatique, cheval de bataille du commerce balte. Ces navires à large faisceau transportent de vastes cargaisons dans les eaux agitées du nord et peuvent être armés pour la guerre."
 n_nd_pom_schnigge: "Pomeranian Schnigge"
 n_nd_pom_schnigge_desc: "A shallow, swift vessel under sail and oar. The Hanse towns send such ships out as scouts and guard ships. Under a ducal letter the same ship is a privateer."
 n_nd_pom_galeasse: "Pomeranian Galeass"
 n_nd_pom_galeasse_desc: "The two-masted coasting trader of the Baltic, built in the yards of the Pomeranian coast. It is sailed by a handful of men and is lightly built and lightly armed."
 n_nd_pom_stralsund_frigate: "Frégate Stralsund"
 n_nd_pom_stralsund_frigate_desc: "Un navire de défense côtière spécialement construit par les chantiers navals de Stralsund, conçu pour patrouiller les détroits étroits et défendre les ports de Poméranie."
 nd_pom_hansekontor: "Kompaniehaus"
 nd_pom_hansekontor_desc: "The house of a merchant company in a Hanse town of Pomerania. The shipmasters and the merchants who sail to the herring markets keep a hall, a common chest and a rule of their own here, and settle their contracts among themselves."
 nd_pom_greifswalder_kollegium: "Collège Greifswalder"
 nd_pom_greifswalder_kollegium_desc: "Un bâtiment collégial de l'Université de Greifswald, l'un des plus anciens centres d'apprentissage d'Europe du Nord."
 nd_pom_coastal_bastion: "Bastion côtier"
 nd_pom_coastal_bastion_desc: "Défenses portuaires fortifiées inspirées des murs légendaires de Stralsund, conçues pour protéger les ports de Poméranie des assauts navals."
 nd_pom_amber_workshop: "Atelier Ambre"
 nd_pom_amber_workshop_desc: "A craftsmen's workshop where Baltic amber is turned into beads, polished and later set in silver for sale across the Hanseatic trading network."
 nd_pom_oder_warehouse: "Oud Entrepôt"
 nd_pom_oder_warehouse_desc: "Un entrepôt commercial le long des quais de la rivière Oder, stockant des céréales, du sel et d'autres marchandises circulant à travers le réseau commercial animé de Stettin."
 nd_pom_vitte: "Vitte"
 nd_pom_vitte_desc: "A herring station on the beach by the fishing grounds: a fenced compound of booths kept by a Hanse town. In the season the catch is gutted, salted and packed in barrels for the Lenten trade."
 nd_pom_herring_salting: "Herring Salting"
 nd_pom_herring_salting_desc: "The herring is gutted, laid in salt and packed in barrels branded with the town's mark."
 nd_pom_hansekontor_maintenance: "Company House Upkeep"
 nd_pom_hansekontor_maintenance_desc: "The regular costs of the company house: timber for repairs, cloth for the hall and paper for the accounts."
 nd_pom_kollegium_maintenance: "Entretien du collège"
 nd_pom_kollegium_maintenance_desc: "Les frais d'entretien d'une université, le papier pour les manuscrits, les livres pour la bibliothèque, la cire d'abeille pour les bougies."
 nd_pom_scholarly_printing: "Impression savante"
 nd_pom_scholarly_printing_desc: "The university keeps a press of its own. Paper, ink and lead type become books, where before the college only bought them."
 nd_pom_bastion_maintenance: "Entretien du bastion"
 nd_pom_bastion_maintenance_desc: "L'entretien des fortifications côtières nécessite de la pierre pour les murs, du fer pour les portes et des armes pour la garnison."
 nd_pom_amber_workshop_maintenance: "Entretien de l'atelier"
 nd_pom_amber_workshop_maintenance_desc: "L'entretien de l'atelier d'ambre nécessite des outils pour la sculpture, de la cire d'abeille pour le polissage et du bois pour les établis."
 nd_pom_paternoster_turning: "Paternoster Turning"
 nd_pom_paternoster_turning_desc: "Raw Baltic amber is turned on the lathe into beads and strung as rosaries, the trade of the paternoster makers."
 nd_pom_amber_jewelry: "Amber Set in Silver"
 nd_pom_amber_jewelry_desc: "Polished amber is set in silver as brooches, clasps and ornaments for the wealthy across Europe."
 nd_pom_warehouse_maintenance: "Entretien de l'entrepôt"
 nd_pom_warehouse_maintenance_desc: "L'entretien d'un entrepôt au bord de la rivière nécessite du bois pour les quais, de la pierre pour les fondations et du goudron pour l'imperméabilisation."
 nd_pom_formed_tt: "La Poméranie s'est formée"
 nd_pom_path_a_tt: "Choisissez le destin#bold Griffin Crown#!"
 nd_pom_path_b_tt: "Choisissez le destin#bold Wendish League#!"
 nd_pom_destiny: "Le destin du griffon"
 nd_pom_destiny_desc: "La Poméranie unie se trouve à la croisée des chemins. Le griffon rouge doit choisir son avenir : une autorité ducale forgée dans le fer, ou une richesse hanséatique bâtie sur l'ambre et le sel."
 nd_pom_dest_iron_crown: "La couronne de fer"
 nd_pom_dest_iron_crown_desc: "Sécurisez Schwerin et affirmez l'autorité de Griffin sur les duchés voisins. Le duc de Poméranie doit prouver qu'il est plus qu'une figure de proue : il commande des armées, et ne se contente pas de compter les maisons."
 nd_pom_dest_march_south: "La marche vers le sud"
 nd_pom_dest_march_south_desc: "Poussez dans le Brandebourg et saisissez Berlin et Rostock. L'Oder est une rivière de Poméranie ; tout son cours devrait traverser les terres Griffin."
 nd_pom_dest_baltic_dominion: "Domination Baltique"
 nd_pom_dest_baltic_dominion_desc: "Forgez un véritable royaume balte s'étendant de Magdebourg à Königsberg. La dynastie des Griffons gouvernera la plus grande principauté entre l'Elbe et la Vistule."
 nd_pom_dest_amber_road: "La route de l'Ambre"
 nd_pom_dest_amber_road_desc: "Prenez la capitale hanséatique de Lübeck et établissez la suprématie commerciale de la Poméranie. L'ambre de la Baltique, l'or du Nord, coulera dans nos ports."
 nd_pom_dest_counting_houses: "Les maisons de comptage"
 nd_pom_dest_counting_houses_desc: "Maîtrisez les institutions de la finance moderne et assurez-vous que le sel (l’élément vital du commerce du hareng) circule sur le marché des capitaux."
 nd_pom_dest_mare_balticum: "Jument Balticum"
 nd_pom_dest_mare_balticum_desc: "Dominate Baltic trade from Lubeck to Visby. Take Visby and the Scanian herring coast at Malmo, where the Peace of Stralsund once gave the towns the castles of the Sound, and enforce the Wendish League's monopoly over the northern seas."
 nd_pom.5.t: "Le destin du griffon"
 nd_pom.5.d: "La Poméranie unie : le griffon rouge déploie désormais ses ailes sur la côte baltique. Mais de quel genre de royaume s’agira-t-il ? Le destin de la Griffin House n’est pas encore écrit. Il nous appartient de choisir la voie qui définira la Poméranie pour les siècles à venir."
 nd_pom.5.a: "Notre destin attend"
 nd_pom.6.t: "La couronne de fer"
 nd_pom.6.d: "Schwerin est tombé sous les armes de Poméranie. Les ducs de Mecklembourg, qui autrefois considéraient les Griffons comme de simples seigneurs côtiers, s'agenouillent désormais devant notre bannière. Avec une armée professionnelle à notre disposition et les revenus des ports hanséatiques finançant nos ambitions, le duc Griffin n'est plus le premier parmi ses pairs : il est en vérité un souverain."
 nd_pom.6.a: "Le Griffin commande et le Nord obéit"
 nd_pom.7.t: "La marche vers le sud"
 nd_pom.7.d: "Berlin et Rostock sont à nous. L'Oder, de ses sources jusqu'à la mer, traverse désormais le territoire des Griffin. Les seigneurs de marche du Brandebourg ont été humiliés et le duc de Poméranie regarde vers le sud, à travers des terres qui semblaient autrefois incroyablement lointaines. Comment allons-nous consolider ces conquêtes : par le biais d’une armée permanente qui ne répond qu’au duc, ou par des marches frontalières qui projettent notre pouvoir vers l’extérieur ?"
 nd_pom.7.a: "Construire une armée ducale professionnelle"
 nd_pom.7.b: "Établir des marches frontalières fortifiées"
 nd_pom.8.t: "Domination Baltique"
 nd_pom.8.d: "De l'Elbe à la Vistule, le griffon rouge survole aussi bien les forteresses que les villes. Magdebourg et Königsberg (sièges des archevêques et des grands maîtres) répondent désormais à la Poméranie. Ce qui a commencé comme un modeste duché côtier est devenu la puissance dominante de la plaine d'Allemagne du Nord. La dynastie Griffin a réalisé ce qui semblait impossible. Devons-nous gouverner par la puissance militaire ou par les institutions de gouvernance ?"
 nd_pom.8.a: "Nos armées sont le fondement de notre puissance"
 nd_pom.8.b: "Nous bâtirons des institutions pour gouverner"
 nd_pom.9.t: "La route de l'Ambre"
 nd_pom.9.d: "Lübeck, la reine de la Hanse, arbore la bannière Griffin. La plus grande ville commerciale du nord de l'Europe est désormais une possession de Poméranie. L'ambre, le sel, les céréales et le hareng transitent par nos ports en quantités qui auraient stupéfié nos ancêtres. La Hanse wendoise a trouvé son champion : non pas une ligue de marchands querelleurs, mais un duché unifié avec le pouvoir d'imposer le libre-échange à la pointe de l'épée si nécessaire."
 nd_pom.9.a: "La route de l'ambre mène à la Poméranie"
 nd_pom.10.t: "Les maisons de comptage"
 nd_pom.10.d: "Les comptoirs de Stettin et de Stralsund sont devenus de véritables institutions bancaires, gérant les lettres de crédit et les changes à travers la Baltique. Le sel de Luneburg et de Kolberg circule sur notre marché des capitaux, préservant le hareng qui constitue la base du commerce du Nord. Devons-nous consolider cette richesse par un contrôle monopolistique ou par des guildes agréées qui attirent les talents de toute l’Europe ?"
 nd_pom.10.a: "Établir un contrôle monopolistique sur les métiers clés"
 nd_pom.10.b: "Charte de guildes pour favoriser la prospérité"
 nd_pom.11.t: "Jument Balticum"
 nd_pom.11.d: "La mer Baltique est un lac de Poméranie. De Lübeck à Visby, les grands entrepôts du commerce du Nord répondent à la Ligue Wendish sous le patronage de Griffin. Nos marchands font du commerce dans tous les ports, de Bergen à Novgorod. Notre flotte assure la paix du commerce. La richesse du nord passe par les mains des Poméraniens. Allons-nous ouvrir nos ports au monde, ou les princes marchands gouverneront-ils en seigneurs souverains du commerce ?"
 nd_pom.11.a: "Déclarer les ports de Poméranie libres et ouverts"
 nd_pom.11.b: "Laissons les princes marchands gouverner"
 STATIC_MODIFIER_NAME_nd_pom_dest_ducal_army: "Armée Ducale"
 STATIC_MODIFIER_DESC_nd_pom_dest_ducal_army: "Le duc Griffin a établi une armée professionnelle permanente, remplaçant les levées féodales peu fiables par des troupes qui ne répondent qu'à la couronne ducale."
 STATIC_MODIFIER_NAME_nd_pom_dest_border_march: "Marche frontalière"
 STATIC_MODIFIER_DESC_nd_pom_dest_border_march: "Des marches frontalières fortifiées sécurisent les frontières élargies de la Poméranie, projetant la puissance des Griffin sur les terres voisines."
 STATIC_MODIFIER_NAME_nd_pom_dest_iron_scepter: "Sceptre de fer"
 STATIC_MODIFIER_DESC_nd_pom_dest_iron_scepter: "La machine militaire de Poméranie est la terreur de l'Europe du Nord, ses vétérans endurcis par des décennies de conquête."
 STATIC_MODIFIER_NAME_nd_pom_dest_griffin_throne: "Le trône du Griffon"
 STATIC_MODIFIER_DESC_nd_pom_dest_griffin_throne: "La dynastie Griffin règne grâce à une gouvernance sophistiquée, liant les vassaux et les sujets par la loyauté institutionnelle plutôt que par la seule peur."
 STATIC_MODIFIER_NAME_nd_pom_dest_salt_monopoly: "Monopole du sel"
 STATIC_MODIFIER_DESC_nd_pom_dest_salt_monopoly: "Le contrôle de la Poméranie sur le commerce du sel baltique a donné au duché un levier commercial inégalé, attirant les personnes et les marchandises vers ses marchés."
 STATIC_MODIFIER_NAME_nd_pom_dest_guild_charter: "Charte de guilde"
 STATIC_MODIFIER_DESC_nd_pom_dest_guild_charter: "Les guildes agréées attirent des artisans qualifiés de toute l’Europe vers les villes de Poméranie, même si le coût du maintien d’une armée en temps de paix augmente."
 STATIC_MODIFIER_NAME_nd_pom_dest_free_port: "Port franc"
 STATIC_MODIFIER_DESC_nd_pom_dest_free_port: "Les ports de Poméranie sont déclarés ouverts à toutes les nations, attirant des marchands, des espions et des innovateurs de tous les coins du monde connu."
 STATIC_MODIFIER_NAME_nd_pom_dest_merchant_prince: "Prince marchand"
 STATIC_MODIFIER_DESC_nd_pom_dest_merchant_prince: "Les grandes familles marchandes de Stralsund et de Stettin gouvernent comme des princes du commerce, leur richesse et leur influence assurant la cohésion du royaume."
 nd_pom_griffinburg: "Griffinbourg"
 nd_pom_griffinburg_desc: "Un puissant palais-forteresse ducal couronné du griffon rouge, incarnant l'autorité militaire de la dynastie des Griffin sur sa domination balte."
 nd_pom_griffinburg_maintenance: "Entretien de Griffinburg"
 nd_pom_griffinburg_maintenance_desc: "L'entretien de la forteresse ducale nécessite de la pierre pour les murs, des armes pour la garnison, du fer pour les portes et des outils pour les réparations."
 nd_pom_stapelhaus: "Stapelhaus"
 nd_pom_stapelhaus_desc: "Une grande maison hanséatique de base où les marchandises sont stockées, pesées et taxées avant d'être réexportées : le cœur commercial de la Ligue Wendish."
 nd_pom_stapelhaus_maintenance: "Entretien de Stapelhaus"
 nd_pom_stapelhaus_maintenance_desc: "L’exploitation de la maison de production de base nécessite du bois pour le stockage, du tissu pour l’emballage, du papier pour les comptes et du sel pour conserver les marchandises."

 # ===== BUREAUCRACIES =====
 pom_pomeranian_landtag_bureaucracy: "Landtag de Poméranie"
 pom_pomeranian_landtag_bureaucracy_desc: "L'assemblée des domaines du duché de Poméranie, comprenant les prélats du chapitre de Cammin, la noblesse résidente des cercles de Poméranie orientale et occidentale et les députés des villes hanséatiques de Stettin, Stralsund, Greifswald, Anklam et Stargard. Les ducs de Greifen ont convoqué le Landtag pour ratifier la fiscalité monétaire, le financement de la guerre et la politique ecclésiastique ; son veto sur les prélèvements extraordinaires a lié chaque duc au consensus et a donné lieu à la rare session unitaire à Treptow an der Rega le 13 décembre 1534, où les domaines ont accepté conjointement la Réforme luthérienne, l'événement politique fondateur de la Poméranie du XVIe siècle."

 pom_wolgast_hofgericht_bureaucracy: "Hofgericht de Wolgast"
 pom_wolgast_hofgericht_bureaucracy_desc: "La haute cour ducale que Philippe Ier a établie dans sa résidence de Wolgast dans les années 1530, dans laquelle le duc lui-même siégeait pour juger, en tant qu'affirmation délibérée de la justice princière sur le Patrimonialgerichte du noble Rittergueter. Le Hofgericht enregistrait les litiges fonciers, les plaidoyers pénaux d'intérêt ducal et les appels des tribunaux municipaux hanséatiques ; ses registres écrits sont devenus les archives juridiques que la chancellerie de Greifen consultait encore sous Bogislaw XIV un siècle plus tard, et le fondement institutionnel dont le tribunal de Poméranie suédoise à Greifswald et le Hofgericht brandebourgeois-prussien ont hérité intacts après 1648."

 pom_wendish_hanse_quarter_bureaucracy: "Quartier Wendish Hanse"
 pom_wendish_hanse_quarter_bureaucracy_desc: "La fédération de Stralsund, Stettin, Greifswald, Anklam, Demmin, Kolberg et Stargard au sein du tiers wendish de la Ligue hanséatique, a accordé sa propre représentation au Hansetag de Lübeck à partir de la fin du XIIIe siècle. Stralsund comptait à elle seule quelque trois cents navires sous son pavillon au XIVe siècle, juste derrière Luebeck dans la Baltique. Les conseils municipaux patriciens conservaient le jus civitatis, le privilège de la monnaie et l'amirauté sur leur arrière-pays, payant le duc pour sa protection plutôt que de se soumettre à lui - une anomalie constitutionnelle qui éclatait périodiquement en révolte ouverte contre les Greifen, comme lors des soulèvements de Stralsund de 1391 et 1407."

 pom_kirchenordnung_bureaucracy: "Bugenhagen Kirchenordnung"
 pom_kirchenordnung_bureaucracy_desc: "La constitution de l'Église luthérienne rédigée par le docteur Pomeranus Johannes Bugenhagen de Wollin, à la demande des ducs Barnim XI et Philippe Ier en 1534-1535 et finalement mise en œuvre en 1563. Elle dissout l'ancien patrimoine du chapitre de Cammin, transféra les revenus de l'évêché entre les mains ducales en tant que Stift laïc et réorganisa la vie paroissiale sous la direction de surintendants responsables des secours aux pauvres, de l'enseignement scolaire et de la catéchèse. examen de chaque ménage. La Réforme de Poméranie était autant un acte d'administration d'État que de théologie, liant le clergé luthérien à la cour ducale et dotant le duché de l'infrastructure paroissiale alphabétisée qui ferait de Greifswald et de Stralsund des pépinières d'apprentissage piétiste un siècle plus tard."

 pom_rittergut_gutsherrschaft_bureaucracy: "Rittergut Gutsherrschaft"
 pom_rittergut_gutsherrschaft_bureaucracy_desc: "Le régime seigneurial des domaines chevaleresques de Poméranie, dans lequel le propriétaire Junker exerçait la Gutsherrschaft sur une paysannerie asservie : réglementant les mariages, extrayant le Gesindezwangsdienst obligatoire des fils cadets et cultivant le domaine directement avec le travail de corvée pour expédier les céréales de la Baltique vers l'ouest via les ports hanséatiques. Le règlement sur les paysans et les bergers de 1616 codifia la forme la plus sévère du système, et un quart de tous les domaines chevaleresques passèrent aux nobles suédois après 1648 sans perturber un seul fardeau paysan. Le Rittergueter fournissait la levée de cavalerie et le corps des officiers ; leurs seigneurs attendaient et obtenaient une autonomie juridictionnelle presque complète de la part du duc."

 # ===== BUREAUCRACY AUTHORITY =====
 AUTO_MODIFIER_NAME_nd_pom_bureaucracy_authority: "Autorité bureaucratique de Poméranie"
 AUTO_MODIFIER_DESC_nd_pom_bureaucracy_authority: "The proclamation of Pomerania as the unitary heritor of the Greifen dukes establishes the institutional apparatus of a Baltic borderland: the Landtag of estates, the Wolgast Hofgericht, the Wendish Hanse quarter, the Bugenhagen Kirchenordnung, and the Rittergut Gutsherrschaft. Three of these institutions may be kept at once."
