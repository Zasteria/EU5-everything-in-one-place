l_french:

 # Game Rule
 rule_nd_dnm_crises_rule: "National Destinies Danubian Disasters"
 setting_nd_dnm_crises_enabled: "Enabled"
 setting_nd_dnm_crises_enabled_desc: "The Danubian Monarchy can suffer two [disasters|e] of its own: the [ShowDisasterName('nd_dnm_nationalities_question')] and the [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')]. In the years after its founding the question of the inheritance is raised at court, and the answers given shape how the second begins."
 setting_nd_dnm_crises_disabled: "Disabled"
 setting_nd_dnm_crises_disabled_desc: "Neither [disaster|e] starts, and the question of the inheritance is not raised at court. The setting is read at the moment a disaster would start: one already under way runs until it is ended, and what the question of the inheritance has already changed stays in place."
