l_french:
 STATIC_MODIFIER_NAME_nd_maz_piast_legacy: "L'héritage des derniers Piasts"
 STATIC_MODIFIER_DESC_nd_maz_piast_legacy: "La maison ducale de Mazovie, dernière de la lignée Piast, s'appuie sur des siècles de mémoire dynastique pour forger un royaume défini par le service noble et la défense des frontières."
 STATIC_MODIFIER_NAME_nd_maz_gate_of_the_vistula: "Porte de la Vistule"
 STATIC_MODIFIER_DESC_nd_maz_gate_of_the_vistula: "Varsovie contrôle le grand passage fluvial où les céréales, le bois et l'ambre coulent de l'intérieur vers la Baltique, et le duché entend tirer profit de chaque barge qui passe."
 nd_maz.1.t: "L'ascendant du duché"
 nd_maz.1.d: "The Mazovian lands are united under our banner, and Warsaw stands as the jewel of the Vistula. For generations, the Piast dukes of Mazovia have balanced between independence and vassalage, between the martial traditions of the petty nobility and the mercantile promise of the river trade. Now the duchy must choose its path. Shall we look inward to the legacy of the Piast bloodline, rallying our dense nobility to arms and asserting our ancient dynastic rights? Or shall we look outward along the Vistula, embracing Warsaw's potential as a great crossroads of commerce and learning?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_maz.1.a: "Nous sommes les héritiers des Piast : notre sang est notre force."
 nd_maz.1.b: "La Vistule regorge d'or : Varsovie sera notre porte d'entrée."
 nd_maz.2.t: "Sous les bannières mazoviennes à Grunwald"
 nd_maz.2.d: "Au cours de l'été 1410, le contingent mazovien marcha aux côtés des forces du roi Ladislas Jagellon contre l'ordre teutonique à Grunwald. Le duc Siemowit de Mazovie mena ses chevaliers dans la plus grande bataille que la région ait jamais connue, et l'État teutonique fut brisé. Les bannières mazoviennes flottaient avec honneur ce jour-là, et le souvenir de ce triomphe partagé lie depuis lors la noblesse du duché dans une fierté martiale. Nos chevaliers ont prouvé que la valeur des Mazoviens est égale à celle de la chrétienté."
 nd_maz.2.a: "L'honneur de Grunwald vit dans nos bannières."
 nd_maz.3.t: "Varsovie : la nouvelle capitale"
 nd_maz.3.d: "Le duc Janusz Ier a déplacé le siège ducal de Czersk à Varsovie, reconnaissant ce qu'est devenue la traversée du fleuve. Autrefois modeste village de pêcheurs bénéficiant des droits de Magdebourg, Varsovie est devenue une ville prospère d'artisans, de marchands et de petits nobles. L'achèvement de la cathédrale Saint-Jean lui a conféré une gravité spirituelle ; le déplacement de la cour ducale lui confère une autorité politique. Des greniers et des quais bordent les rives de la Vistule et la nouvelle ville s'étend au-delà des anciens murs. Ce qui était autrefois périphérique est devenu central."
 nd_maz.3.a: "De cette ville, la Mazovie prospérera."
 nd_maz.4.t: "Les greniers de la Vistule"
 nd_maz.4.d: "Le seigle de Mazovie se déverse dans les entrepôts fluviaux de Varsovie et de Plock, chargé sur des barges à fond plat qui parcourent la Vistule vers le nord jusqu'aux ports de la Baltique. Le commerce des céréales a transformé l'économie du duché, enrichissant la petite noblesse qui cultive les cultures et les bourgeois qui s'occupent du commerce. Chaque récolte relie désormais la Mazovie au monde entier, le seigle qui pousse dans nos champs nourrit les villes de Gdansk à Amsterdam."
 nd_maz.4.a: "Notre récolte soutient les nations."
 STATIC_MODIFIER_NAME_nd_maz_grunwald_valor: "Valeur de Grunwald"
 STATIC_MODIFIER_DESC_nd_maz_grunwald_valor: "Le souvenir des bannières mazoviennes flottant à Grunwald inspire le courage martial dans tout le duché."
 STATIC_MODIFIER_NAME_nd_maz_warsaw_ascendant: "Ascendant de Varsovie"
 STATIC_MODIFIER_DESC_nd_maz_warsaw_ascendant: "Le transfert du siège ducal à Varsovie a accéléré la croissance de la ville en tant que centre d'administration et d'apprentissage."
 nd_maz_piast_strongholds: "Forteresses des Piast"
 nd_maz_piast_strongholds_desc: "Les colonies fortifiées en bois le long des rivières de Mazovie, entretenues depuis les premiers ducs Piast, constituent l'épine dorsale de la défense des frontières."
 nd_maz_szlachta_horsemen: "Cavaliers de Szlachta"
 nd_maz_szlachta_horsemen_desc: "La petite noblesse de Mazovie chevauche une cavalerie légère, pas assez riche pour une armure lourde, mais des cavaliers qualifiés qui répondent à l'appel ducal en nombre extraordinaire."
 nd_maz_rye_fields: "Champs de seigle de Mazovie"
 nd_maz_rye_fields_desc: "The lowland soils of Mazovia yield abundant harvests of rye, the staple grain that feeds the duchy and fuels its growing export trade."
 nd_maz_ducal_court_plock: "Cour ducale de Plock"
 nd_maz_ducal_court_plock_desc: "La cour Piast de Plock administre le duché avec un mélange de coutumes polonaises et de tradition locale mazovienne."
 nd_maz_parish_churches: "Églises paroissiales de Mazovie"
 nd_maz_parish_churches_desc: "Un réseau d'églises en pierre et en bois unit la campagne mazovienne sous la foi catholique."
 nd_maz_grunwald_banners: "Bannières Grunwald"
 nd_maz_grunwald_banners_desc: "Le contingent de chevaliers de Mazovie qui combattit à la bataille de Grunwald en 1410 consolida la réputation martiale du duché."
 nd_maz_czersk_castle: "Château de Czersk"
 nd_maz_czersk_castle_desc: "La forteresse gothique en brique de Czersk, érigée par le duc Janusz Ier, est le symbole architectural du pouvoir ducal de Mazovie."
 nd_maz_warsaw_capital: "Varsovie : la nouvelle capitale"
 nd_maz_warsaw_capital_desc: "Le transfert du siège ducal à Varsovie par le duc Janusz Ier en 1413 marqua la transformation de la ville de traversée fluviale en centre politique."
 nd_maz_vistula_granaries: "Greniers de la Vistule"
 nd_maz_vistula_granaries_desc: "Les entrepôts fluviaux de Varsovie et de Plock stockent les céréales du duché pour le transport sur la Vistule vers les marchés baltes."
 nd_maz_dense_nobility: "Noblesse dense"
 nd_maz_dense_nobility_desc: "Over twenty percent of Mazovia's population claims noble status, a uniquely dense gentry class that provides manpower beyond what the duchy's size would suggest. Most plough their own fields and ride to war as mounted crossbowmen."
 nd_maz_magdeburg_charters: "Chartes de Magdebourg"
 nd_maz_magdeburg_charters_desc: "L'adoption de la loi de Magdebourg confère aux villes de Mazovie l'autonomie gouvernementale, des droits juridiques codifiés et une réglementation structurée du marché."
 nd_maz_pospolite_ruszenie: "Pospolite Ruszenie"
 nd_maz_pospolite_ruszenie_desc: "La levée générale de la petite noblesse de Mazovie, la ruszenie pospolite, rassemble une milice disproportionnée issue de la dense classe noble du duché."
 nd_maz_timber_rafting_advance: "Rafting en bois"
 nd_maz_timber_rafting_advance_desc: "Mazovian timber is assembled into great rafts and floated down the Vistula to Gdansk, connecting the duchy's forests to the Baltic shipbuilding trade. The rafts are bound at the binduga, the timber yard on the river bank."
 nd_maz_dozynki_tradition: "Tradition Dozynki"
 nd_maz_dozynki_tradition_desc: "Les fêtes des récoltes de Mazovie unissent seigneur et paysan dans une célébration commune, renforçant les liens sociaux et la continuité culturelle."
 nd_maz_warsaw_new_town: "Nouvelle ville de Varsovie"
 nd_maz_warsaw_new_town_desc: "The expansion of Warsaw beyond its medieval walls, with new suburbs for brewers, weavers, and artisans, signals the city's growing vitality."
 nd_maz_crown_integration: "Intégration de la Couronne"
 nd_maz_crown_integration_desc: "L'incorporation de la Mazovie à la couronne polonaise suite à l'extinction de la lignée masculine Piast en 1526 apporte de nouvelles connexions administratives."
 nd_maz_grain_fleet: "Flotte céréalière de la Vistule"
 nd_maz_grain_fleet_desc: "Des convois organisés de barges fluviales transportent des céréales de Mazovie vers la Baltique, faisant du duché un maillon clé du commerce d'exportation de céréales de la Pologne."
 nd_maz_szlachta_privileges: "Privilèges Szlachta"
 nd_maz_szlachta_privileges_desc: "Les libertés dorées de la szlachta polono-lituanienne prennent particulièrement racine en Mazovie, où le nombre de la petite noblesse leur confère un poids politique démesuré."
 nd_maz_sejm_sessions: "Sessions du Sejm de Varsovie"
 nd_maz_sejm_sessions_desc: "The holding of Sejm sessions in Warsaw cements the city's role as the de facto political capital of the Commonwealth."
 nd_maz_agricultural_reforms: "Réformes agricoles"
 nd_maz_agricultural_reforms_desc: "Modernized farming techniques and estate management improve yields across the Mazovian lowlands."
 nd_maz_river_customs: "Douanes fluviales"
 nd_maz_river_customs_desc: "Les gares de péage le long de la Vistule tirent des revenus du flux incessant de barges transportant des céréales, du bois et des marchandises vers la mer."
 nd_maz_mazovian_resilience: "La résilience mazovienne"
 nd_maz_mazovian_resilience_desc: "Through the upheavals of invasion and foreign domination, the Mazovian identity endures, stubborn, practical, and rooted in the land. In 1708 the Kurpie, hunters and bee keepers of the northern forest, fell on the Swedish king's column on the causeway at Kopanski Most."
 nd_maz_warsaw_enlightenment: "Varsovie des Lumières"
 nd_maz_warsaw_enlightenment_desc: "Le ferment intellectuel des Lumières atteint Varsovie, inspirant de nouvelles écoles, imprimeries et mouvements de réforme."
 nd_maz_industrial_vistula: "Vistule industrielle"
 nd_maz_industrial_vistula_desc: "Early manufactories spring up along the Vistula, harnessing river power and trade connections for the first stirrings of industrial production. The linen works founded for Philippe de Girard's flax spinning machines gives its name to a new town, Zyrardow."
 nd_maz_national_identity: "Identité nationale mazovienne"
 nd_maz_national_identity_desc: "À une époque d'empires et de révolutions, le caractère distinctif de la Mazovie (son dialecte, ses coutumes et ses nobles traditions) se cristallise en une identité régionale consciente."
 nd_maz_warsaw_urban_growth: "Croissance urbaine de Varsovie"
 nd_maz_warsaw_urban_growth_desc: "La population de Varsovie augmente à mesure que la ville se développe pour devenir une véritable métropole, attirant des migrants de toute la région grâce à ses institutions et ses opportunités."
 a_nd_maz_szlachta_cavalry: "Cavalerie Mazovienne Szlachta"
 a_nd_maz_szlachta_cavalry_desc: "Des cavaliers légers issus de la petite noblesse dense de Mazovie, pas lourdement blindés, mais des cavaliers nombreux et compétents qui répondent à l'appel ducal en nombre extraordinaire."
 a_nd_maz_rycerz: "Rycerz mazovienne"
 a_nd_maz_rycerz_desc: "Chevaliers Piast en armure qui ont prouvé leur valeur à Grunwald, ces cavaliers lourds constituent l'élite martiale du duché de Mazovie."
 a_nd_maz_pospolite: "Milice pospolite"
 a_nd_maz_pospolite_desc: "Le prélèvement général de la petite noblesse de Mazovie, de durs défenseurs qui se battent pour leurs propres fermes et leurs familles, nécessitant peu de ravitaillement du trésor ducal."
 nd_maz_grod: "Dieu ducal"
 nd_maz_grod_desc: "Une colonie fortifiée en bois de la tradition Piast, combinant garnison, grenier et centre administratif le long des rivières de Mazovie."
 nd_maz_vistula_wharf: "Quai de la Vistule"
 nd_maz_vistula_wharf_desc: "Un entrepôt et un débarcadère au bord de la rivière où les céréales, le bois et les marchandises sont chargés sur des barges pour être transportés sur la Vistule."
 nd_maz_kancelaria: "Kancelaria de Mazovie"
 nd_maz_kancelaria_desc: "La chancellerie ducale, où la loi de Magdebourg est administrée et où les affaires du duché sont enregistrées de manière de plus en plus systématique."
 nd_maz_timber_rafting: "Rafting en bois"
 nd_maz_timber_rafting_desc: "Logs are dressed into masts and spars, lashed into rafts with hemp, and floated to the Baltic shipyards with the pitch that goes with them."
 nd_maz_grod_upkeep: "Entretien du terrain"
 nd_maz_grod_upkeep_desc: "Les palissades en bois et les magasins d'armes nécessitent un entretien constant."
 nd_maz_wharf_operations: "Opérations du quai"
 nd_maz_wharf_operations_desc: "Le travail quotidien de chargement des barges, d'entretien des quais et de gestion des flux du commerce fluvial."
 nd_maz_chancellery_costs: "Opérations de la Chancellerie"
 nd_maz_chancellery_costs_desc: "Papier, encre et scribes pour tenir les archives administratives du duché."
 nd_maz_binduga: "Binduga"
 nd_maz_binduga_desc: "The timber yard on the river bank, where logs hauled from the forest are sorted and bound into rafts for the float to Gdansk."
 nd_maz_linen_works: "Zyrardow Linen Works"
 nd_maz_linen_works_desc: "A spinning works built around Philippe de Girard's flax machines. The linen is sold bleached, and the settlement beside the works bears his name."
 nd_maz_linen_spinning: "Mechanical Flax Spinning"
 nd_maz_linen_spinning_desc: "Flax bought from the north is spun by machine and woven into linen. Coal is burnt for the engines and the bleaching."
 a_nd_maz_zagrodowa: "Zagrodowa Horse"
 a_nd_maz_zagrodowa_desc: "Yeoman gentry who plough their own fields. Too poor for a lance and harness, they ride as mounted crossbowmen, lightly protected and very many."
 levy_nd_maz_zagrodowa: "Zagrodowa Horse Levy"
 levy_nd_maz_zagrodowa_desc: "The yeoman gentry of Mazovia are called out with crossbow and horse."
 a_nd_maz_kurpie: "Kurpie Marksmen"
 a_nd_maz_kurpie_desc: "Hunters and bee keepers of the Green Forest on the Narew. Deadly from cover among the trees, without drill or bayonets in the open."
 levy_nd_maz_kurpie: "Kurpie Marksmen Levy"
 levy_nd_maz_kurpie_desc: "The peasants of the forest districts are called out with their own rifles."
 levy_nd_maz_szlachta_cavalry: "Prélèvement de cavalerie de Szlachta"
 levy_nd_maz_szlachta_cavalry_desc: "Les petits nobles de Mazovie partent en guerre à l'appel du duc, formant une force de cavalerie légère d'une densité remarquable."
 a_nd_maz_pancerni: "Pancerni de Mazovie"
 a_nd_maz_pancerni_desc: "Cavalerie moyennement blindée issue de la szlachta mazovienne, des cavaliers polyvalents qui comblent le fossé entre les raiders légers et les lanciers lourds."
 nd_maz_pancerni_tradition: "Tradition de la cavalerie Pancerni"
 nd_maz_pancerni_tradition_desc: "Les pancerni de Mazovie, cavaliers blindés mais agiles, représentent l'évolution des traditions montées de la petite noblesse."
 nd_maz_toll_station: "Gare de péage de la Vistule"
 nd_maz_toll_station_desc: "Un poste de douane au bord du fleuve où les percepteurs prélèvent des droits sur chaque barge traversant les eaux de Mazovie."
 nd_maz_toll_operations: "Perception des péages"
 nd_maz_toll_operations_desc: "L'appareil bureaucratique des douanes fluviales, des registres, des sceaux et des fonctionnaires qui veillent à ce que la Couronne reçoive sa part."
 nd_maz_szlachta_manor: "Manoir Szlachta"
 nd_maz_szlachta_manor_desc: "La modeste propriété rurale d'un petit noble de Mazovie, plus une ferme que un palais, mais l'épine dorsale de la main-d'œuvre du duché."
 nd_maz_manor_upkeep: "Opérations du manoir"
 nd_maz_manor_upkeep_desc: "Les céréales et le bétail soutiennent la maison noble et ses serviteurs."
 nd_maz_printing_house: "Imprimerie de Varsovie"
 nd_maz_printing_house_desc: "Un centre d'édition des Lumières, produisant des livres, des brochures et des journaux qui diffusent de nouvelles idées à travers la Mazovie."
 nd_maz_printing_costs: "Opérations d'impression"
 nd_maz_printing_costs_desc: "Le papier et les teintures sont consommés comme encre et papier par les presses, produisant des livres et des brochures destinés au lectorat croissant de Varsovie."
 nd_maz_formed_tt: "La Mazovie a été formée"
 nd_maz_path_a_tt: "Choisissez l'héritage des derniers Piasts"
 nd_maz_path_b_tt: "Choisissez la Porte de la Vistule"
 nd_maz_destiny: "Destin Mazovien"
 nd_maz_destiny_desc: "Le duché est formé et son avenir s'étend devant nous. Le destin de la Mazovie attend ceux qui ont la stabilité et la vision nécessaires pour le poursuivre."
 nd_maz_dest_border_march: "Marche frontalière de Piast"
 nd_maz_dest_border_march_desc: "The Teutonic frontier has long threatened Mazovia. Seize the Chelmno Land and Torun and raise ducal strongholds in three of our locations to establish a fortified border march under Piast authority."
 nd_maz_dest_border_grods_tt: "A #bold $nd_maz_grod$#! stands in at least #bold 3#! of our locations"
 nd_maz_dest_crusade: "Croisade Mazovie"
 nd_maz_dest_crusade_desc: "With the border secured, the time has come to break the Teutonic state entirely. Take Marienburg, Elbing and Konigsberg to dismantle the Order's power."
 nd_maz_dest_piast_shield: "Bouclier des Piasts"
 nd_maz_dest_piast_shield_desc: "The Piast dynasty stands as the shield of Christendom's northern frontier. Hold Memel and reach Riga to command the entire eastern Baltic coast and cement Mazovian military supremacy."
 nd_maz_dest_baltic_outlet: "Sortie Baltique"
 nd_maz_dest_baltic_outlet_desc: "Les céréales de Mazovie coulent le long de la Vistule, mais d'autres profitent à l'embouchure du fleuve. Prenez Gdansk pour contrôler le débouché de la Baltique et garder les richesses entre les mains des Mazoviens."
 nd_maz_dest_vistula_commerce: "Commerce de la Vistule"
 nd_maz_dest_vistula_commerce_desc: "Une fois le débouché baltique sécurisé, faire de Varsovie un centre commercial majeur. Adoptez le secteur bancaire, attirez l'ambre sur le marché des capitaux et construisez un empire commercial le long du fleuve."
 nd_maz_dest_vistula_crown: "Couronne de la Vistule"
 nd_maz_dest_vistula_crown_desc: "Command the entire length of the Vistula from Krakow to Gdansk. Raise wharves and granaries in four of its towns and amass the wealth to make Warsaw the undisputed center of Central European commerce."
 nd_maz_dest_vistula_wharves_tt: "A #bold $nd_maz_vistula_wharf$#! stands in at least #bold 4#! of our locations"
 nd_maz.5.t: "Le destin mazovien"
 nd_maz.5.d: "La Mazovie est unie et stable. La bannière Piast flotte sur Varsovie et c'est à nous de façonner l'avenir du duché. Que ce soit par l'épée ou par l'or, la Mazovie laissera sa marque sur le monde."
 nd_maz.5.a: "Notre destin commence maintenant."
 nd_maz.6.t: "La marche à la frontière sécurisée"
 nd_maz.6.d: "Les bannières mazoviennes flottent désormais sur Torun et le pays de Chelmno. Pendant des générations, l'Ordre Teutonique a harcelé notre frontière nord, exigeant un tribut et attaquant nos villages. Pas plus. La frontière est sécurisée et les petites szlachta qui sont allées à la guerre rentrent chez elles en héros. La réputation martiale du duché grandit et de plus grandes ambitions s'animent dans le cœur de la noblesse mazovienne."
 nd_maz.6.a: "La frontière est la nôtre."
 nd_maz.7.t: "L'État teutonique brisé"
 nd_maz.7.d: "Marienburg est tombé. Königsberg se soumet. L’Ordre Teutonique, autrefois redoutable, qui a terrorisé nos ancêtres pendant des siècles, repose sous les armes de Mazovie. Les grands châteaux de l'Ordre servent désormais les intérêts de la Mazovie, et les richesses de la côte d'ambre prussienne affluent dans notre trésor. Comment consolider cette conquête durement gagnée ?"
 nd_maz.7.a: "Dépouiller les châteaux de l'Ordre pour notre défense."
 nd_maz.7.b: "Rassemblez tous les nobles qui peuvent se joindre à notre cause."
 nd_maz.8.t: "Bouclier des Piasts"
 nd_maz.8.d: "De Varsovie à Riga, la Baltique orientale s’incline devant la puissance mazovienne. Ce qui a commencé comme un modeste duché sur la Vistule est devenu un État militaire s'étendant sur les plaines du nord. La dynastie Piast, dernière de son ancienne lignée, a forgé un empire grâce à la discipline et au courage de sa dense cavalerie szlachta. Comment l’histoire se souviendra-t-elle de cet exploit ?"
 nd_maz.8.a: "En tant que conquérants qui dictaient leurs conditions aux rois."
 nd_maz.8.b: "Comme rempart qui tenait la frontière nord."
 nd_maz.9.t: "Le point de vente baltique sécurisé"
 nd_maz.9.d: "Gdansk est à nous. Le grand port à l'embouchure de la Vistule, où ont toujours été destinés les céréales et le bois de Mazovie, arbore désormais la bannière Piast. Ce ne sont plus les marchands étrangers qui fixent les termes de l’échange pour nos récoltes. Les barges qui partent de Varsovie arrivent sur nos propres quais, et la richesse qui enrichissait autrefois les étrangers hanséatiques remplit désormais les coffres de Mazovie."
 nd_maz.9.a: "Les richesses du fleuve nous parviennent enfin."
 nd_maz.10.t: "Maîtres du commerce de la Vistule"
 nd_maz.10.d: "Les marchés de Varsovie bourdonnent de commerce. L'ambre et les céréales circulent dans notre capitale, les banquiers accordent des crédits aux commerçants de toute la région et la Vistule est devenue l'artère commerciale la plus rentable d'Europe centrale. Notre influence commerciale s'étend bien au-delà de ce que la taille modeste du duché pourrait laisser penser. Comment allons-nous tirer parti de cette position ?"
 nd_maz.10.a: "Nos céréales nourrissent les nations : laissons la diplomatie suivre."
 nd_maz.10.b: "Dessinez toutes les routes vers Varsovie grâce au commerce et aux traités."
 nd_maz.11.t: "Couronne de la Vistule"
 nd_maz.11.d: "Des mines de sel de Cracovie au port de Gdansk, tout le corridor de la Vistule répond au commerce mazovienne. Ce que d’autres nations ont réalisé grâce à la conquête, nous l’avons construit grâce à des comptoirs et des greniers. Varsovie constitue un grand centre commercial de l'Europe centrale, où les marchands de la Baltique jusqu'à la mer Noire viennent faire des affaires. La bannière Piast est devenue un symbole non pas de guerre, mais de prospérité."
 nd_maz.11.a: "Varsovie sera le centre commercial du Nord."
 nd_maz.11.b: "Nous dirigerons une ligue des villes de la Vistule."
 STATIC_MODIFIER_NAME_nd_maz_dest_teutonic_spoils: "Butin teutonique"
 STATIC_MODIFIER_DESC_nd_maz_dest_teutonic_spoils: "Les fortifications et armureries capturées de l'Ordre Teutonique ont été réutilisées pour la défense de Mazovie."
 STATIC_MODIFIER_NAME_nd_maz_dest_szlachta_banners: "Les bannières de Szlachta déployées"
 STATIC_MODIFIER_DESC_nd_maz_dest_szlachta_banners: "Tous les petits nobles de Mazovie répondent à l'appel aux armes, gonflant nos rangs mais mettant à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_maz_dest_piast_hegemony: "Hégémonie Piast"
 STATIC_MODIFIER_DESC_nd_maz_dest_piast_hegemony: "La dynastie Piast dicte ses conditions à ses voisins depuis une position de force militaire inattaquable."
 STATIC_MODIFIER_NAME_nd_maz_dest_frontier_bulwark: "Rempart frontière"
 STATIC_MODIFIER_DESC_nd_maz_dest_frontier_bulwark: "La Mazovie constitue un rempart inébranlable à la frontière nord, attirant des mercenaires et des fournitures de tout le royaume."
 STATIC_MODIFIER_NAME_nd_maz_dest_grain_fortune: "Fortune en céréales"
 STATIC_MODIFIER_DESC_nd_maz_dest_grain_fortune: "La richesse générée par le commerce des céréales de la Vistule ouvre des portes diplomatiques et finance des réseaux de renseignement à travers l’Europe."
 STATIC_MODIFIER_NAME_nd_maz_dest_amber_road: "Route de l'Ambre"
 STATIC_MODIFIER_DESC_nd_maz_dest_amber_road: "Le contrôle des routes commerciales de l'ambre attire les marchands et les vassaux étrangers dans l'orbite commerciale de Varsovie."
 STATIC_MODIFIER_NAME_nd_maz_dest_warsaw_emporium: "Magasin de Varsovie"
 STATIC_MODIFIER_DESC_nd_maz_dest_warsaw_emporium: "Le statut de Varsovie en tant que grand centre commercial projette une influence diplomatique, même si le maintien de l'infrastructure commerciale détourne les ressources militaires."
 STATIC_MODIFIER_NAME_nd_maz_dest_vistula_league: "Ligue de la Vistule"
 STATIC_MODIFIER_DESC_nd_maz_dest_vistula_league: "A confederation of Vistula trading cities under Mazovian leadership expands our diplomatic reach, though the cities bargain their taxes down in return."
 nd_maz_arsenal: "Arsenal de Mazovie"
 nd_maz_arsenal_desc: "Un dépôt d'armes et une armurerie centralisés approvisionnant la machine militaire Piast en armes, armures et équipements de siège."
 nd_maz_arsenal_upkeep: "Opérations d'Arsenal"
 nd_maz_arsenal_upkeep_desc: "Les forgerons d'armes et les armuriers s'efforcent de maintenir les forces du duché équipées des meilleures armes."
 nd_maz_kontora: "Vistule Kontora"
 nd_maz_kontora_desc: "Un grand comptoir et une bourse commerciale où les marchands négocient les termes du commerce de la Vistule selon la loi mazovienne."
 nd_maz_kontora_operations: "Administration de Kontora"
 nd_maz_kontora_operations_desc: "Les commis, les facteurs et les scribes gèrent les registres et les contrats de la bourse commerciale la plus fréquentée de la Vistule."

# ===== BUREAUCRACIES =====
 maz_statuty_mazowieckie_bureaucracy: "Statut de Mazovie"
 maz_statuty_mazowieckie_bureaucracy_desc: "Le code de procédure pénale du duc Siemowit III promulgué à Sochaczew le 27 avril 1377 et révisé en 1390. Les statuts réglementaient le wergeld pour le meurtre d'un wlodyka ou d'un paysan aisé, définissaient les conditions d'une querelle légale et liaient les tribunaux ducaux à une procédure écrite. L'adoption par la Mazovie d'une loi statutaire un demi-siècle avant les propres codifications systématiques de la Couronne a donné au duché de cadets de Siemowit une autorité juridique disproportionnée par rapport à son territoire et a fait du texte de Sochaczew une référence pour les tribunaux fonciers de Mazovie longtemps après son incorporation dans la Couronne polonaise en 1526."

 maz_mazovian_sejmiki_bureaucracy: "Sejmiki de Czersk et Varsovie"
 maz_mazovian_sejmiki_bureaucracy_desc: "Les assemblées nobles de Mazovie qui ratifièrent le premier privilège foncier général du duché à Nowe Miasto le 21 juin 1414, accordé conjointement aux szlachta des districts de Czersk et de Varsovie par Janusz Ier. Les sejmiki conservèrent le droit de consentir à des impôts extraordinaires et à des prélèvements militaires, codifiant une coutume consultative qui survécut à l'incorporation à la Couronne en 1526 et qui donna plus tard aux voïvodies de Mazovie leur caractère distinctif. position pré-sejm dans la vie constitutionnelle polonaise."

 maz_ksiegi_ziemskie_bureaucracy: "Ksiegi Ziemskie Mazowieckie"
 maz_ksiegi_ziemskie_bureaucracy_desc: "Les séries de registres fonciers mandatés par les ducs de Mazovie étaient conservés district par district à partir de la deuxième décennie du XVe siècle, avec des volumes séparés ouverts à Rozan en 1412, à Makow en 1413 et aux districts de Czersk et de Varsovie à partir de 1414. Les ksiegi enregistraient les héritages, les ventes de terres, les hypothèques et les dots dans des registres que les successeurs et les créanciers pouvaient consulter au tribunal régional ; pour les szlachta comme pour les villes de la Vistule, les rôles écrits transformaient la propriété de la mémoire orale en un titre juridiquement contraignant."

 maz_plock_chapter_bureaucracy: "Chapitre de la cathédrale de Plock"
 maz_plock_chapter_bureaucracy_desc: "Le collège canonique desservant la cathédrale de l'Assomption de Plock, organisé sous Wladyslaw Herman de la communauté bénédictine de Saint Laurentius et élevé en chapitre pleinement constitué sous le métropolite Gniezno. Par la charte de Conrad de Mazovie de 1239, le chapitre co-administrait quelque 240 villae et vingt praedia de terres épiscopales ; les chanoines fournissaient les commis de chancellerie instruits du duché, conservaient les archives de l'évêché et couronnaient huit des premiers princes Piast dans la nef de la cathédrale où ils furent également enterrés aux côtés des ducs de Mazovie."

 maz_ducal_chancery_bureaucracy: "Chancellerie ducale de Varsovie"
 maz_ducal_chancery_bureaucracy_desc: "La chancellerie Piast Janusz Ier fut transférée du château de Czersk à Varsovie en assumant le règne unique du duché oriental en 1413, et à partir de laquelle il sortit le grand corpus des privilèges mazoviennes à partir de 1414. La chancellerie employait des notaires formés par la cathédrale du chapitre de Plock, entretenait le sceau ducal, rédigeait les mandats et les confirmations et fournissait le personnel juridique qui ouvrait les livres des tribunaux de district dans toute la Mazovie. Après l'incorporation en 1526, son personnel fournissait la nouvelle voïvodie de Mazovie sans interruption de la routine administrative."

# ===== BUREAUCRACY AUTHORITY =====
 AUTO_MODIFIER_NAME_nd_maz_bureaucracy_authority: "Autorité bureaucratique de Mazovie"
 AUTO_MODIFIER_DESC_nd_maz_bureaucracy_authority: "The proclamation of Mazovia under the Piast cadet line establishes the duchy's institutional apparatus inherited from Plock, Czersk, and Warsaw: the Statutes of Sochaczew, the sejmiki of the eastern districts, the Mazovian land-court books, the cathedral chapter at Plock, and the ducal chancery removed to Warsaw by Janusz I. Three bureaucracy slots are granted."
