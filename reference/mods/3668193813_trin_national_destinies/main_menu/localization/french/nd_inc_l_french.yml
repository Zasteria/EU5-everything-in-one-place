l_french:
 STATIC_MODIFIER_NAME_nd_children_of_inti: "Enfants d'Inti"
 STATIC_MODIFIER_DESC_nd_children_of_inti: "Le Sapa Inca se présente comme le fils vivant du Soleil et ses guerriers marchent sous la bannière dorée d'Inti avec une dévotion inébranlable. Le mandat divin de l'empire inspire un engagement total en faveur de la défense et de l'expansion de Tawantinsuyu."
 STATIC_MODIFIER_NAME_nd_lords_of_the_four_quarters: "Seigneurs des Quatre Quartiers"
 STATIC_MODIFIER_DESC_nd_lords_of_the_four_quarters: "Le génie de Tawantinsuyu ne réside pas seulement dans la conquête, mais dans l'administration qui s'ensuit. Grâce au système de travail mita, aux entrepôts qullqa et aux registres quipu, les Incas gouvernent le plus grand empire des Amériques avec une efficacité remarquable."
 nd_inc.1.t: "L'essor de Tawantinsuyu"
 nd_inc.1.d: "The four quarters of the world now bend to the will of a single Sapa Inca. From the frigid heights of the Altiplano to the steaming jungles of the Anti Suyu, from the arid coasts of the Kunti Suyu to the vast plains of the Qulla Suyu, the realm of the four parts stands united.\n\nThe transformation from a small kingdom in the Cusco valley into a continental empire demands a choice. Shall the Sapa Inca rule as the divine son of Inti, binding his people through religious fervor and military strength? Or shall he prove his mandate through masterful administration, weaving the disparate peoples of the Andes into a single prosperous state?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_inc.1.a: "Nous sommes les Enfants du Soleil !"
 nd_inc.1.b: "Les Quatre Quartiers prospéreront comme un seul."
 nd_inc.2.t: "Les réformes de Pachacuti"
 nd_inc.2.d: "The great Sapa Inca Pachacuti (the Earthshaker, the World-Transformer) has remade the state from its foundations. What was once a modest kingdom centered on the Cusco valley has been reorganized into the vast Tawantinsuyu, the realm of the four quarters.\n\nPachacuti rebuilt Cusco in the shape of a puma, established the system of four suyus each governed by an apu, reformed the mita labor service into a tool of imperial construction, and codified the laws that bind a hundred conquered peoples into one empire. His military campaigns crushed the Chancas and extended Inca dominion across the Andes.\n\nBut will his legacy be remembered primarily as a conqueror who forged an empire through martial prowess, or as a builder whose administrative genius created the most organized state in the pre-Columbian Americas?"
 nd_inc.2.a: "Il a secoué la terre avec ses armées."
 nd_inc.2.b: "Il a fait de Cusco une merveille du monde."
 STATIC_MODIFIER_NAME_nd_inc_earthshaker_legacy: "L'héritage du Earthshaker"
 STATIC_MODIFIER_DESC_nd_inc_earthshaker_legacy: "Le génie militaire de Pachacuti inspire nos commandants. Ses tactiques d'assaut coordonné et de guerre psychologique trouvent un écho dans les rangs des armées de Tawantinsuyu."
 STATIC_MODIFIER_NAME_nd_inc_builder_of_cusco: "Constructeur de Cusco"
 STATIC_MODIFIER_DESC_nd_inc_builder_of_cusco: "La vision de Pachacuti d'un Cusco reconstruit (planifié, ordonné, magnifique) pousse nos architectes et administrateurs à construire un empire digne de Sapa Inca."
 nd_inc.3.t: "La retraite à Vilcabamba"
 nd_inc.3.d: "When foreign invaders seized Cusco and shattered the old order, the sons of the Sapa Inca did not surrender. Manco Inca retreated into the cloud forests of Vilcabamba, founding a Neo-Inca state that would resist for nearly forty years. From this remote mountain stronghold, the last Incas launched raids against the occupiers, maintained the old ceremonies, and kept the flame of Tawantinsuyu alive.\n\nThe spirit of Vilcabamba teaches two lessons. One is that mountains and jungle can shield a people from any invader, that guerrilla resistance can bleed an empire. The other is that survival sometimes demands adaptation: learning the enemy's language, adopting their useful tools, and finding allies among those who also resist."
 nd_inc.3.a: "Les montagnes sont notre forteresse."
 nd_inc.3.b: "Nous devons apprendre de tous ceux qui viennent."
 STATIC_MODIFIER_NAME_nd_inc_spirit_of_vilcabamba: "Esprit de Vilcabamba"
 STATIC_MODIFIER_DESC_nd_inc_spirit_of_vilcabamba: "Le défi à l’égard de l’État néo-inca à Vilcabamba perdure. Nos guerriers savent que les montagnes elles-mêmes combattent à leurs côtés et qu’aucun envahisseur ne peut détenir ce que les Andes choisissent de récupérer."
 STATIC_MODIFIER_NAME_nd_inc_diplomatic_adaptation: "Adaptation diplomatique"
 STATIC_MODIFIER_DESC_nd_inc_diplomatic_adaptation: "Le pragmatisme des dirigeants néo-incas (leur volonté d'apprendre des langues étrangères, d'adopter des technologies utiles et de forger des alliances inattendues) renforce la capacité de Tawantinsuyu à naviguer dans un monde en évolution."
 nd_inc.4.t: "L'héritage de Tupac Amaru"
 nd_inc.4.d: "The name Tupac Amaru has become a rallying cry across the Andes. Whether it is the last Inca emperor executed by foreign conquerors in 1572, or the mestizo descendant who raised hundreds of thousands in revolt two centuries later, the name embodies the refusal of Andean peoples to accept subjugation.\n\nTupac Amaru II's rebellion of 1780 mobilized indigenous communities across Peru and Bolivia, shaking colonial rule to its foundations. His vision was of an Andean state free from foreign domination, where the old social structures would be restored and the dignity of the indigenous peoples upheld.\n\nThis legacy offers two paths: the fire of armed rebellion that would sweep away all foreign influence, or the patient work of building solidarity among all Andean peoples to create a state that draws strength from their shared heritage."
 nd_inc.4.a: "Que le feu de la rébellion brûle !"
 nd_inc.4.b: "Notre force réside dans notre unité."
 STATIC_MODIFIER_NAME_nd_inc_fire_of_rebellion: "Feu de rébellion"
 STATIC_MODIFIER_DESC_nd_inc_fire_of_rebellion: "L’esprit révolutionnaire de Tupac Amaru traverse nos armées. Chaque soldat sait qu’il ne se bat pas seulement pour un roi, mais pour la libération de tout un peuple."
 STATIC_MODIFIER_NAME_nd_inc_andean_solidarity: "Solidarité andine"
 STATIC_MODIFIER_DESC_nd_inc_andean_solidarity: "Les liens entre les communautés andines (Quechua, Aymara et tous les peuples des montagnes) constituent le fondement d'un État qui tire sa légitimité du patrimoine commun d'un continent."
 nd_inc_qhapaq_nan: "Qhapaq Nan"
 nd_inc_qhapaq_nan_desc: "La Grande Route Inca, qui s'étend sur plus de 30 000 kilomètres à travers les Andes, permet un déplacement rapide des armées, des administrateurs et des marchandises commerciales à travers l'empire."
 nd_inc_ayllu_reciprocity: "Réciprocité Ayllu"
 nd_inc_ayllu_reciprocity_desc: "Le système ayllu de travail communautaire et d'obligation mutuelle constitue le fondement social de l'État inca, garantissant qu'aucune famille ne soit confrontée seule à des difficultés et que les demandes de l'État soient satisfaites grâce à un effort collectif."
 nd_inc_sapa_inca_divinity: "Sapa Divinité Inca"
 nd_inc_sapa_inca_divinity_desc: "Le statut de Sapa Inca en tant que fils vivant d'Inti confère au dirigeant de l'empire une autorité religieuse incontestée, renforcée par la construction de temples et l'accomplissement de rituels sacrés."
 nd_inc_qullqa_logistics: "Qullqa Logistique"
 nd_inc_qullqa_logistics_desc: "Le vaste réseau d'entrepôts d'État le long des routes incas garantit que les armées ne souffrent jamais de la faim, que les provinces frappées par le désastre reçoivent des secours et que les excédents de l'empire soient distribués là où ils sont le plus nécessaires."
 nd_inc_andean_metallurgy: "Métallurgie andine"
 nd_inc_andean_metallurgy_desc: "Les peuples andins maîtrisaient le travail du cuivre, de l’étain et de leur alliage de bronze des siècles avant l’arrivée des Européens. Les métallurgistes incas produisaient des armes, des outils et des objets de cérémonie d'une qualité remarquable."
 nd_inc_waru_waru: "Waru Waru"
 nd_inc_waru_waru_desc: "La technique agricole de plein champ de waru waru crée des surfaces de plantation élevées entourées de canaux d'eau, protégeant les cultures du gel, améliorant le drainage et augmentant considérablement les rendements dans l'environnement difficile des hautes terres."
 nd_inc_pachacuti_reforms: "Réformes Pachacuti"
 nd_inc_pachacuti_reforms_desc: "La réorganisation radicale de l'État inca sous Pachacuti (divisant l'empire en quatre suyus, établissant le système mita, reconstruisant Cusco et codifiant la loi impériale) transforma un royaume régional en le plus grand empire des Amériques précolombiennes."
 nd_inc_anti_suyu_expansion: "Extension anti-Suyu"
 nd_inc_anti_suyu_expansion_desc: "La conquête inca des basses terres de la jungle orientale, les Anti Suyu, a nécessité le développement de tactiques militaires entièrement nouvelles. L'infanterie légère entraînée à la guerre dans la jungle est devenue essentielle pour les opérations dans les forêts tropicales denses à l'est des Andes."
 nd_inc_mit_a_imperial: "Mita Impériale"
 nd_inc_mit_a_imperial_desc: "L’expansion de la taxe sur le travail mita en un système complet de travail dirigé par l’État permet la construction de routes, de terrasses, d’entrepôts et de forteresses à travers l’empire, transformant chaque citoyen en un bâtisseur de Tawantinsuyu."
 nd_inc_capacocha_ritual: "Rituel Capacocha"
 nd_inc_capacocha_ritual_desc: "La cérémonie de la capacocha, rituel le plus sacré de l'État inca, consacre les moments les plus importants de l'empire : l'avènement d'un nouveau Sapa Inca, les grandes victoires militaires ou les temps de crise. Les enfants des quatre suyus sont amenés à Cusco avant de retourner dans leur province d'origine, reliant la périphérie au centre par une expérience sacrée partagée."
 nd_inc_yanacona_service: "Service Yanacona"
 nd_inc_yanacona_service_desc: "Les yanacona, serviteurs de l'État libérés des obligations ayllu, forment une classe dévouée d'administrateurs, d'artisans et d'entretien des routes qui servent directement les Sapa Incas, fournissant à l'empire un cadre fidèle de professionnels qualifiés."
 nd_inc_vilcabamba_resistance: "Résistance de Vilcabamba"
 nd_inc_vilcabamba_resistance_desc: "L'État néo-inca de Vilcabamba a survécu pendant près de quatre décennies dans les forêts de nuages, prouvant que les peuples andins pouvaient résister même aux envahisseurs les plus puissants en exploitant leur connaissance du terrain montagneux et leurs tactiques de guérilla."
 nd_inc_highland_gunpowder: "Poudre à canon des Highlands"
 nd_inc_highland_gunpowder_desc: "L’adaptation des armes à feu à la guerre dans les hautes terres nécessite des tactiques différentes de celles du combat dans les plaines. En altitude, le son se propage plus loin, la poudre brûle différemment et la rareté de l'air affecte à la fois la portée et la précision. Les mousquetaires incas maîtrisent ces défis grâce à un entraînement rigoureux dans des conditions montagnardes."
 nd_inc_tocricuc_administration: "Administration de Tocricuc"
 nd_inc_tocricuc_administration_desc: "Les tocricuc, gouverneurs provinciaux nommés par les Sapa Incas, sont les yeux, les oreilles et les mains du gouvernement central dans chaque coin de l'empire. Leur autorité garantit l'exécution des décrets impériaux et le maintien de leur conformité locale."
 nd_inc_silver_mountain: "Montagne d'Argent"
 nd_inc_silver_mountain_desc: "Les Andes contiennent certains des gisements d’argent et de métaux précieux les plus riches de la planète. Le développement de techniques avancées d’extraction et de fusion transforme ces richesses montagneuses en fondement économique d’un trésor impérial."
 nd_inc_inca_road_renewal: "Rénovation de la route inca"
 nd_inc_inca_road_renewal_desc: "The restoration and expansion of the ancient Qhapaq Nan road network ensures rapid communication and troop movement across the vast Andean terrain, binding the four quarters together as they were in the empire's golden age."
 nd_inc_neo_inca_reform: "Réforme néo-inca"
 nd_inc_neo_inca_reform_desc: "S'appuyant à la fois sur les anciennes traditions incas et sur la science militaire moderne, le Tawantinsuyu réformé crée des forces permanentes disciplinées, capables de défendre les hauts plateaux contre tout envahisseur."
 nd_inc_andean_textile_trade: "Commerce textile andin"
 nd_inc_andean_textile_trade_desc: "Highland wool and lowland cotton, woven in the obrajes of the Andes, become sought-after trade goods: qumpi, the fine cloth once reserved for the Sapa Inca's gifts, and awasqa, the plain cloth every household owed the state. The quality of Andean textiles, inheriting a tradition stretching back thousands of years, rivals the finest cloth of any civilization."
 nd_inc_tupac_amaru_legacy: "L'héritage de Tupac Amaru"
 nd_inc_tupac_amaru_legacy_desc: "The name Tupac Amaru echoes across the centuries: from the last emperor beheaded in Cusco's plaza to the great rebellion of 1780 that shook colonial rule to its foundations. As in that rising, the communities can be called out by their kurakas in the name of the Inca."
 nd_inc_andean_terrace_renewal: "Renouvellement de la terrasse andine"
 nd_inc_andean_terrace_renewal_desc: "Les anciens systèmes de terrasses sont restaurés et étendus grâce aux connaissances agricoles modernes, augmentant considérablement la production alimentaire dans les régions des hautes terres et nourrissant une population croissante."
 nd_inc_mountain_artillery: "Artillerie de montagne"
 nd_inc_mountain_artillery_desc: "Le placement de l'artillerie dans les cols de montagne et les fortifications en hauteur crée des positions défensives presque imprenables. Aucune armée ne peut attaquer une forteresse andine sans payer un terrible prix en sang."
 nd_inc_apu_governance: "Gouvernance de l'Apu"
 nd_inc_apu_governance_desc: "Les apus sacrés, esprits des montagnes vénérés à travers les Andes, sont invoqués dans la gouvernance de chaque suyu. Les administrateurs provinciaux tirent leur légitimité de leur lien avec ces sommets sacrés, mêlant autorité spirituelle et gouvernance pratique."
 nd_inc_tawantinsuyu_restored: "Tawantinsuyu restauré"
 nd_inc_tawantinsuyu_restored_desc: "Le royaume des quatre quartiers se relève avec une armée moderne digne de ses ambitions anciennes. Des régiments disciplinés, entraînés à la guerre dans les hautes et basses terres, portent la bannière de Tawantinsuyu dans une nouvelle ère."
 nd_inc_andean_enlightenment: "Lumières andines"
 nd_inc_andean_enlightenment_desc: "Les yachay wasi, maisons d'apprentissage, diffusent l'alphabétisation et le savoir dans toutes les Andes, produisant une nouvelle génération d'administrateurs, de scientifiques et de philosophes instruits qui s'appuient à la fois sur la sagesse indigène et sur les connaissances du monde en général."
 nd_inc_industrial_andes: "Andes industrielles"
 nd_inc_industrial_andes_desc: "The rich mineral resources of the Andes (copper, tin, silver, gold) are processed with modern smelting techniques, transforming the mountains into the industrial heartland of a resurgent Tawantinsuyu.\n\n#italic Available in: $nd_inc_mita_workshop$#!"
 nd_inc_inti_raymi_revival: "La renaissance d'Inti Raymi"
 nd_inc_inti_raymi_revival_desc: "Le grand Festival du Soleil, l'Inti Raymi, est relancé en tant que célébration culturelle suprême de Tawantinsuyu, attirant des pèlerins des quatre quartiers à Cusco pour neuf jours de cérémonies, de festins et de renouvellement du mandat divin de l'empire."
 nd_inc_modern_chasqui: "Chasqui moderne"
 nd_inc_modern_chasqui_desc: "L'ancien système de relais qui transportait autrefois les messages à travers les Andes à une vitesse remarquable est modernisé avec des stations postales, des tours de signalisation et des réseaux de messagerie organisés, garantissant que la parole de Sapa Inca atteint sans délai tous les coins du royaume."
 nd_inc_sovereign_andes: "Andes souveraines"
 nd_inc_sovereign_andes_desc: "Les Andes constituent une puissance souveraine, avec ses armées disciplinées, son peuple uni et ses montagnes invaincues. Les enfants du Soleil ont repris leur destin en main et ont forgé un État qu’aucune puissance étrangère ne peut subjuguer."
 a_nd_inc_runa_infantry: "Infanterie runa"
 a_nd_inc_runa_infantry_desc: "Enrôlés via le système de travail mita, les fantassins runa constituent l'épine dorsale de l'armée inca. Ces soldats ordinaires apportent une endurance endurcie par les montagnes et une loyauté inébranlable au service des Sapa Inca."
 a_nd_inc_slinger: "Frondeurs incas"
 a_nd_inc_slinger_desc: "Formés dès l'enfance dans les villages des hautes terres, les frondeurs incas peuvent lancer des pierres avec une précision dévastatrice à des vitesses dépassant les 100 kilomètres par heure. Leurs volées à distance affaiblissent les formations ennemies avant le début de l'assaut principal."
 a_nd_inc_anti_suyu_warrior: "Guerriers anti-Suyu"
 a_nd_inc_anti_suyu_warrior_desc: "Spécialistes de la guerre dans la jungle, ces fantassins légers sont recrutés à la frontière orientale de l'empire. Ils excellent dans les embuscades, les déplacements rapides à travers une végétation dense et les combats sur des terrains où les formations lourdes ne peuvent pas opérer."
 a_nd_inc_highland_musketeer: "Mousquetaires des Highlands"
 a_nd_inc_highland_musketeer_desc: "Formés au maniement des armes à feu en altitude, où la poudre brûle différemment et où l'air raréfié affecte la balistique, les mousquetaires des hautes terres combinent la précision exigée par la guerre en montagne avec la puissance de feu dévastatrice des armes à poudre."
 a_nd_inc_mountain_guard: "Garde de montagne"
 a_nd_inc_mountain_guard_desc: "Défenseurs d'élite des cols andins, les gardes de montagne sont entraînés à tenir des positions contre toute attente. Leur connaissance du terrain des hautes terres, combinée à un équipement moderne et à une discipline de fer, les rend redoutables dans les engagements défensifs."
 a_nd_inc_tawantinsuyu_regiment: "Régiment Tawantinsuyu"
 a_nd_inc_tawantinsuyu_regiment_desc: "Première force de combat de l'Empire Inca restauré, ces régiments combinent les anciennes traditions martiales andines avec la science militaire moderne. Ils se battent avec la même maîtrise dans les cols de montagne et dans les plaines ouvertes."
 a_nd_inc_tupamaros: "Tupamaros"
 a_nd_inc_tupamaros_desc: "The communities of the highlands, called out by their kurakas in the name of the Inca as in the rising of 1780. Slingers and lancers in their thousands with few muskets among them, they are not easily scattered and suffer heavily under fire."
 nd_inc_coricancha: "Coricancha"
 nd_inc_coricancha_desc: "Le Temple du Soleil, dont les murs étaient autrefois recouverts d'or, constitue le cœur spirituel de Tawantinsuyu. Dans son enceinte, le Willaq Umu et ses prêtres entretiennent les feux sacrés et accomplissent les rituels qui lient l'empire à son divin patron."
 nd_inc_imperial_qullqa: "Qullqa impériale"
 nd_inc_imperial_qullqa_desc: "Entrepôts d'État remplis de pommes de terre séchées, de maïs, de quinoa et de fournitures militaires. Le réseau qullqa veille à ce qu'aucune province ne soit confrontée à la famine et à ce que les armées puissent être nourries pendant n'importe quelle campagne, incarnant ainsi le génie redistributif de l'économie inca."
 nd_inc_mita_workshop: "Atelier Mita"
 nd_inc_mita_workshop_desc: "Un atelier organisé par l'État où les ouvriers mita produisent des marchandises sous la direction impériale. Le travail du métal, la maçonnerie et le tissage sont réalisés avec l'efficacité du travail organisé, transformant les matières premières en outils de l'empire."
 nd_inc_silver_foundry: "Fonderie d'argent"
 nd_inc_silver_foundry_desc: "Une fonderie avancée pour traiter les riches minerais d’argent et de cuivre des Andes. Utilisant des fours éoliens traditionnels de Huayra améliorés par des techniques modernes, ces fonderies transforment la richesse des montagnes en trésor impérial."
 nd_inc_textile_obraje: "Obraje andin"
 nd_inc_textile_obraje_desc: "Un atelier textile des hautes terres produisant des tissus fins à partir de laine de lama et d'alpaga. Les traditions de tissage andines, qui remontent à des milliers d'années, produisent des textiles d'une qualité extraordinaire qui se vendent à des prix élevés sur les marchés du monde entier."
 nd_inc_yachay_wasi: "Yachay Wasi"
 nd_inc_yachay_wasi_desc: "Une maison d'apprentissage où les connaissances des Andes (astronomie, agriculture, médecine, ingénierie et gouvernance) sont enseignées parallèlement à l'apprentissage du monde au sens large. Le yachay wasi préserve et transmet l'héritage intellectuel de Tawantinsuyu."
 nd_inc_coricancha_maintenance: "Offrandes au temple"
 nd_inc_coricancha_maintenance_desc: "De l'argent, des teintures et de l'encens sont offerts pour entretenir l'enceinte sacrée du Coricancha et honorer Inti."
 nd_inc_qullqa_maintenance: "Dispositions de l'entrepôt"
 nd_inc_qullqa_maintenance_desc: "Un approvisionnement constant en pommes de terre, maïs et outils remplit la qullqa impériale, prête à être redistribuée à travers l'empire."
 nd_inc_mita_workshop_maintenance: "Matériel d'atelier"
 nd_inc_mita_workshop_maintenance_desc: "Les ouvriers de Mita transforment le cuivre et la laine en outils et instruments pour l'État."
 nd_inc_silver_foundry_maintenance: "Carburant de fusion"
 nd_inc_silver_foundry_maintenance_desc: "Les fours éoliens de Huayra transformaient les minerais andins en argent raffiné à l’aide de charbon de bois et de flux de cuivre."
 nd_inc_obraje_maintenance: "Matériaux de tissage"
 nd_inc_obraje_maintenance_desc: "La laine des hautes terres et les teintures naturelles sont tissées pour créer des textiles andins fins d'une qualité extraordinaire."
 nd_inc_awasqa_weaving: "Awasqa Weaving"
 nd_inc_awasqa_weaving_desc: "Lowland cotton is woven into awasqa, the plain cloth every household owed the state and the storehouses issued to the army."
 nd_inc_yachay_wasi_maintenance: "Fournitures académiques"
 nd_inc_yachay_wasi_maintenance_desc: "Le papier, les teintures et les livres sont consommés par les étudiants et les universitaires qui étudient au yachay wasi."
 nd_inc_andean_smelting: "Fonderie andine"
 nd_inc_andean_smelting_desc: "Les fonderies des Highlands transforment le minerai de cuivre avec du charbon de bois en outils et en ferronnerie."
 levy_nd_inc_runa_infantry: "Runa Lévy"
 levy_nd_inc_runa_infantry_desc: "Les conscrits paysans élevés grâce à l'obligation de travail mita, formaient l'infanterie de masse des armées incas."
 levy_nd_inc_tupamaros: "Tupamaro Levy"
 levy_nd_inc_tupamaros_desc: "Peasants of the ayllus and laborers of the mines and workshops, raised by their kurakas when the Inca calls."
 nd_inc_formed_tt: "Inca a été formé"
 nd_inc_path_a_tt: "Les enfants choisis d'Inti"
 nd_inc_path_b_tt: "Choisissez les seigneurs des quatre quartiers"
 nd_inc_destiny: "Destin de Tawantinsuyu"
 nd_inc_destiny_desc: "L'Empire Inca est restauré. Les quatre quartiers étant unis sous un seul Sapa Inca, le moment est venu d'accomplir le plus grand destin de Tawantinsuyu : que ce soit par la conquête divine ou par une administration magistrale."
 nd_inc_dest_coast: "Maîtres de la côte"
 nd_inc_dest_coast_desc: "The great coastal kingdoms of Chan Chan and Arequipa must submit to the will of the Sapa Inca. These ancient centers are conquered, and storehouses are filled in three places to feed the host on its march to the sea."
 nd_inc_dest_quarters: "Les quatre trimestres prolongés"
 nd_inc_dest_quarters_desc: "The borders of Tawantinsuyu are pressed to their natural limits. The northern frontier must reach Quito, and the southern Altiplano centered on sacred Tiwanaku must acknowledge the Sapa Inca's dominion. Willkawaman, which stands on the royal road as far from Quito as from the southern frontier, is built up as the middle of the realm. Storehouses stand in six places along the roads the armies take."
 nd_inc_dest_tawantin: "Empire du Soleil"
 nd_inc_dest_tawantin_desc: "The supreme achievement of Inti's children: a continental empire stretching from Tumbes on the Pacific coast to the Atacama frontier at Arica, with Chuqiyapu secured in the heartland, and ordered into four suyus as Pachacuti's reforms laid down. No force on earth can challenge Tawantinsuyu."
 nd_inc_dest_quipu: "L'économie Quipu"
 nd_inc_dest_quipu_desc: "Le génie de l’administration inca résidait dans sa capacité à gérer une vaste économie sans monnaie ni écriture. Adoptez désormais les institutions financières modernes tout en conservant l’esprit redistributif du système quipu. Veiller à ce que l’argent circule sur les marchés des capitaux."
 nd_inc_dest_tampu: "The Provincial Capitals"
 nd_inc_dest_tampu_desc: "Capitals are raised in the provinces in the image of Qusqu, each with its plaza, its hall of feasts and its sun temple, where the lords of the province are received and given their tasks. Hatun Xauxa, the capital of the Mantaro valley, is built up, and professional military organization is embraced to protect this prosperity."
 nd_inc_dest_suyu: "Cœur des Quatre Suyus"
 nd_inc_dest_suyu_desc: "The culmination of Tawantinsuyu's administrative genius: a state so prosperous and well-governed that it becomes the economic heart of the continent. Qusqu, the navel of the four suyus, is built up, the scientific revolution is embraced, wealth is accumulated, and gold flows through the empire's markets."
 nd_inc_dest_qullqa_3_tt: "An #bold Imperial Qullqa#! stands in at least #bold 3#! of our locations"
 nd_inc_dest_qullqa_6_tt: "An #bold Imperial Qullqa#! stands in at least #bold 6#! of our locations"
 nd_inc_dest_willkawaman_developed_tt: "We own #bold Willkawaman#! and its development is at least #bold 10#!"
 nd_inc_dest_hatun_xauxa_developed_tt: "We own #bold Hatun Xauxa#! and its development is at least #bold 13#!"
 nd_inc_dest_qusqu_developed_tt: "We own #bold Qusqu#! and its development is at least #bold 8#!"
 nd_inc.5.t: "Le destin de Tawantinsuyu"
 nd_inc.5.d: "Les quatre quartiers se retrouvent unis et le regard du Sapa Inca se tourne vers l'horizon. Ce qui a commencé comme une restauration de la gloire ancienne exige désormais une vision plus grande : un destin digne du peuple élu d’Inti. La voie à suivre déterminera si Tawantinsuyu restera dans les mémoires comme l’empire le plus puissant des Amériques ou comme l’État le plus brillamment administré que le monde ait jamais connu."
 nd_inc.5.a: "Notre destin nous attend."
 nd_inc.6.t: "Les royaumes côtiers"
 nd_inc.6.d: "The great adobe cities of the coast (Chan Chan of the Chimu, the terraced settlements of Arequipa) now fly the banner of Tawantinsuyu. Where once independent kingdoms controlled the rich fishing grounds and irrigated valleys of the Pacific shore, now the Sapa Inca's authority extends from the mountain peaks to the ocean itself.\n\nThe conquest of the coast gives Tawantinsuyu access to resources that the highlands alone could never provide: marine wealth, irrigated cotton fields, and the strategic depth of a two-front empire."
 nd_inc.6.a: "La côte se plie à la volonté d'Inti."
 nd_inc.7.t: "Agrandissement des Quatre Quartiers"
 nd_inc.7.d: "With Quito secured in the north and sacred Tiwanaku brought under the eagle banner in the south, Tawantinsuyu has grown beyond the wildest dreams of the earliest Sapa Incas. The empire now spans climatic zones from equatorial heat to the frigid Altiplano.\n\nThis vast expansion demands a choice in how the empire sustains its military power. Shall the Sapa Inca prioritize rapid mobilization of new armies from the conquered territories, or develop an intelligence network to anticipate threats before they materialize?"
 nd_inc.7.a: "Mobilisez les peuples conquis."
 nd_inc.7.b: "La connaissance est l'arme la plus tranchante."
 nd_inc.8.t: "Empire de l'Ascendant Soleil"
 nd_inc.8.d: "From Tumbes in the tropical north to the arid frontier at Arica, from the highland capital at Qusqu to the Altiplano stronghold of Chuqiyapu, Tawantinsuyu has achieved what no other American state has accomplished: continental dominion under a single divine ruler.\n\nThis supreme achievement demands a doctrine for maintaining eternal supremacy. Shall the empire adopt a posture of perpetual readiness for total war, crushing any threat before it can grow? Or shall it fortify its mountain strongholds into an impregnable defensive network, making any invasion of the Andes suicidal?"
 nd_inc.8.a: "Nous écraserons tous ceux qui nous défient."
 nd_inc.8.b: "Les montagnes sont notre bouclier éternel."
 nd_inc.9.t: "Le Quipu compte vrai"
 nd_inc.9.d: "The quipucamayocs, the keepers of the knotted cords, have long managed the most complex economy in the pre-Columbian Americas without written language or minted currency. Now, as modern financial institutions take root in the Andes, the administrative genius of the quipu system merges with banking and market economics.\n\nSilver from the mountain mines flows through the capital markets, and the redistributive tradition of the Inca state adapts to the demands of a monetized economy. The result is something unprecedented: an empire that combines the social safety net of communal redistribution with the dynamism of market exchange."
 nd_inc.9.a: "Le quipu et la pièce servent un seul maître."
 nd_inc.10.t: "The Provincial Capitals Raised"
 nd_inc.10.d: "Along the royal road stand cities that no province built for itself. Each is laid out in the image of Qusqu around a plaza wide enough to hold a province, with a platform from which the governor speaks for the Sapa Inca. Here the lords of the conquered peoples are feasted with maize beer and cloth from the state's stores, and here they are told what labour their people owe.\n\nThese cities can serve different purposes. Their plazas may become the fairs of an Andean market that draws merchants from across the continent, or they may serve first as courts of hospitality, extending the reach of Tawantinsuyu's influence far beyond its borders."
 nd_inc.10.a: "Let the markets flourish in every plaza."
 nd_inc.10.b: "Nos routes transportent de l'influence ainsi que des marchandises."
 nd_inc.11.t: "Cœur des Quatre Suyus"
 nd_inc.11.d: "Tawantinsuyu has achieved what the Sapa Inca Pachacuti could only have dreamed: an empire so wealthy, so efficiently governed, and so deeply rooted in the knowledge of both ancient Andean traditions and modern science that it stands as the economic heart of an entire continent.\n\nGold and silver flow through the empire's markets. The quipucamayocs now work alongside trained administrators. The scientific revolution has taken root in the yachay wasi academies. Two visions of the future present themselves: continental hegemony through diplomatic and economic dominance, or a perfected redistributive state that becomes a model for all civilizations."
 nd_inc.11.a: "Nous dirigerons le continent."
 nd_inc.11.b: "L'État doit pourvoir à tous."
 STATIC_MODIFIER_NAME_nd_inc_dest_rapid_mobilization: "Mobilisation rapide"
 STATIC_MODIFIER_DESC_nd_inc_dest_rapid_mobilization: "Le système de main-d’œuvre mita est adapté à un projet militaire capable de lever des armées dans les quatre quartiers à une vitesse extraordinaire, même si le détournement de la main-d’œuvre du commerce affaiblit les réseaux marchands."
 STATIC_MODIFIER_NAME_nd_inc_dest_imperial_scouts: "Éclaireurs impériaux"
 STATIC_MODIFIER_DESC_nd_inc_dest_imperial_scouts: "Le réseau de relais chasqui est reconverti en appareil de renseignement, transmettant des rapports sur les mouvements ennemis et les intrigues étrangères à travers les Andes à une vitesse remarquable."
 STATIC_MODIFIER_NAME_nd_inc_dest_total_war: "Doctrine de guerre totale"
 STATIC_MODIFIER_DESC_nd_inc_dest_total_war: "L’empire adopte une doctrine de préparation permanente à la guerre, maintenant des réserves de mercenaires et accélérant les campagnes au prix d’emprunts accrus pour soutenir l’économie de guerre."
 STATIC_MODIFIER_NAME_nd_inc_dest_mountain_fortress: "Doctrine de la forteresse de montagne"
 STATIC_MODIFIER_DESC_nd_inc_dest_mountain_fortress: "Les Andes elles-mêmes deviennent une arme. Les cols de montagne sont fortifiés, les réseaux de garnisons étendus et les opérations de renseignement renforcées, rendant toute invasion de Tawantinsuyu d'un coût prohibitif."
 STATIC_MODIFIER_NAME_nd_inc_dest_andean_markets: "Intégration du marché andin"
 STATIC_MODIFIER_DESC_nd_inc_dest_andean_markets: "The plazas of the provincial capitals become the backbone of a continent-spanning market system. Merchant capacity expands, inflation stabilizes, and even the smallest ayllu benefits from guaranteed minimum trade revenue."
 STATIC_MODIFIER_NAME_nd_inc_dest_road_diplomacy: "Diplomatie routière"
 STATIC_MODIFIER_DESC_nd_inc_dest_road_diplomacy: "Le réseau routier de Qhapaq Nan étend la portée diplomatique de Tawantinsuyu bien au-delà de ses frontières, permettant aux ambassades et aux missions commerciales de se rendre dans des pays lointains, même si l'orientation vers l'extérieur laisse les forces de garnison s'étirer."
 STATIC_MODIFIER_NAME_nd_inc_dest_continental_hegemon: "Hégémon continental"
 STATIC_MODIFIER_DESC_nd_inc_dest_continental_hegemon: "Tawantinsuyu se présente comme la puissance économique et diplomatique incontestée du continent, son prestige attirant les vassaux et ses administrateurs habiles à intégrer les peuples conquis."
 STATIC_MODIFIER_NAME_nd_inc_dest_redistributive_state: "L’État redistributif"
 STATIC_MODIFIER_DESC_nd_inc_dest_redistributive_state: "L'ancien principe inca de redistribution est perfectionné : les impôts sont collectés équitablement, les villes se développent de manière organique et chaque citoyen progresse grâce au mérite. L’État pourvoit et le peuple prospère."
 nd_inc_inti_huasi_wamani: "Inti Huasi Wamani"
 nd_inc_inti_huasi_wamani_desc: "La Maison de la Guerre du Soleil : un complexe militaire sacré où les guerriers reçoivent la bénédiction d'Inti avant de marcher au combat. Dans ses murs, les commandants planifient leurs campagnes sous des disques solaires dorés et les soldats s'entraînent parmi les autels où les offrandes assurent la victoire divine."
 nd_inc_imperial_tampu: "Hatun Qhatu"
 nd_inc_imperial_tampu_desc: "The great market of a provincial capital, held in the open plaza beside the royal road under the eye of the Inca's officers. Maize and coca from the valleys, salt and dried fish from the coast and wool from the high pastures change hands here, and the stores behind the plaza feed the crowd on the days of the fair."
 nd_inc_inti_huasi_maintenance: "Offrandes du Temple de Guerre"
 nd_inc_inti_huasi_maintenance_desc: "Les armes, les tissus et la cire d'abeille soutiennent les rituels sacrés et les préparations martiales de l'Inti Huasi Wamani."
 nd_inc_tampu_maintenance: "Market Provisions"
 nd_inc_tampu_maintenance_desc: "Salt, tools and wool are kept in the stores of the Hatun Qhatu for the days of the fair."

 AUTO_MODIFIER_NAME_nd_inc_bureaucracy_authority: "Appareil Tawantinsuyu"
 AUTO_MODIFIER_DESC_nd_inc_bureaucracy_authority: "The institutions of the Inca state (the Willaq Umu and his priesthood of the Sun, the four-suyu governorate centered on Cuzco, the quipu record-keepers, the mit'a rotational labour levy, the mitma resettlement system, the cloistered Acllahuasi, and the great Qhapaq Nan road network) have matured into a coherent administrative apparatus. Four of them can be kept at a time."

 inc_panaqa_system_bureaucracy: "Willaq Umu and the Priesthood of the Sun"
 inc_panaqa_system_bureaucracy_desc: "The Willaq Umu, the priest who speaks, stood at the head of the cult of Inti and was by custom a brother or uncle of the Sapa Inca. He held the office for life, named the priests of the Sun in every province and kept the calendar of the state festivals from the Coricancha in Cuzco. In each conquered province fields and herds were set apart for the Sun and worked by the ayllus in their turn, and their harvest fed the feasts at which the ruler was shown to his people as the son of Inti. A priesthood that answered to the ruler's own kin made his descent a matter of doctrine. Left unprovided, it left the feasts unheld and the lords of Cuzco without their place in them."

 inc_four_suyu_governorate_bureaucracy: "Gouvernorat de Tawantinsuyu Four-Suyu"
 inc_four_suyu_governorate_bureaucracy_desc: "Le nom de l'empire était Tawantinsuyu, signifiant les quatre régions unies : Chinchaysuyu au nord-ouest, Antisuyu dans l'est du Montana, Collasuyu s'étendant au sud jusqu'au Maule et Cuntisuyu s'étendant jusqu'à la côte Pacifique. Chaque suyu était gouverné par un Apu issu des proches parents des Sapa Inca, qui coordonnait les inspecteurs royaux provinciaux de Tucuyricoc et supervisait les seigneurs locaux curaca en dessous d'eux. La division des quatre suyu a transformé les royaumes andins conquis en une seule géométrie administrative intelligible centrée sur la place centrale de Cuzco : le nombril du monde."

 inc_quipucamayoc_bureaucracy: "Gardiens des records de Quipucamayoc"
 inc_quipucamayoc_bureaucracy_desc: "L'empire fonctionnait sans écriture sur des cordes nouées appelées quipus, dont les plis, les couleurs, les types de nœuds et les positions des nœuds codaient les données de recensement, les affectations d'hommages, les rotations de mit'a et la chronologie dynastique. Les Quipucamayoc étaient des administrateurs spécialisés formés dans les écoles yachay wasi de Cuzco, issus de familles nobles et d'enfants de curacas conquis; eux seuls pouvaient lire les cordons. Le système suivait la population de chaque ayllu du royaume avec une granularité décimale (decuria, siècle, demi-millier, mille) et constituait l’épine dorsale indispensable de chaque mission fiscale inca, de chaque liste de travail et de tout rassemblement militaire."

 inc_mita_levy_bureaucracy: "Prélèvement rotatif sur le travail Mit'a"
 inc_mita_levy_bureaucracy_desc: "Chaque mâle adulte des ayllus conquis devait aux Sapa Incas une rotation fixe du travail chaque année - sur les terres de l'État, dans les mines de la région de Potosi, sur la route Qhapaq Nan, dans les greniers royaux de Cuzco et de Quito et dans le service militaire saisonnier. Une caste distincte de Yanakuna fournissait des serviteurs de palais et d'élite à plein temps en dehors de la rotation. La mit'a a fourni la main-d'œuvre qui a construit Sacsayhuaman, Machu Picchu et tout le réseau routier impérial en moins d'un siècle - mais c'était une obligation due aux ayllu plutôt qu'à l'individu, et elle devenait brutale lorsque la rotation tombait sur une communauté déjà épuisée par la sécheresse ou la guerre."

 inc_mitma_resettlement_bureaucracy: "Système de réinstallation Mitma"
 inc_mitma_resettlement_bureaucracy_desc: "Lorsqu’une région résistait à l’incorporation ou détenait une valeur stratégique, l’État inca déplaçait des populations entières. Les ayllus fidèles parlant quechua du cœur de Cuzco ont été transplantés dans le territoire conquis, et la population conquise a été, à son tour, divisée en fragments et installée à travers l'empire, de la côte d'Atacama à la sierra équatorienne. La mitma a simultanément dilué la cohésion ethnique locale, répandu la langue impériale quechua et donné à chaque zone rebelle un contrepoids de colons fidèles à la couronne. C'était l'instrument le plus agressif de la formation de l'État andin et il a laissé une empreinte démographique permanente visible dans la répartition moderne du quechua dans l'ouest de l'Amérique du Sud."

 inc_acllahuasi_bureaucracy: "Aclláhuasi"
 inc_acllahuasi_bureaucracy_desc: "The House of the Chosen Women, where daughters of provincial curacas selected for their beauty and lineage were cloistered from age ten to weave qompi cloth for the Sapa Inca, brew chicha for the state festivals of Inti, and serve as priestesses in the temples of the sun. A few became secondary wives of the emperor; most became mamacuna, permanent religious specialists serving the cult for life. The institution doubled as a hostage system (a curaca whose daughter served in the Acllahuasi of Cuzco was a curaca whose loyalty was guaranteed) and as the state's principal manufacturer of fine textiles, the most important non-food good in the entire Andean economy."

 inc_qhapaq_nan_tampu_bureaucracy: "Chakakamayuq, Keepers of the Bridges"
 inc_qhapaq_nan_tampu_bureaucracy_desc: "The royal road crosses the gorges of the Andes on hanging bridges of twisted grass rope, the longest of them over the Apurimac. Each bridge is the charge of a chakakamayuq, a keeper drawn with his helpers from the villages nearby, who owe the work as their mit'a. Every year the villages twist new cables and hang the bridge afresh; every day the keeper watches who crosses and with what load, and nobody passes without the state's leave. Armies and llama trains cross a kept bridge in a morning. A bridge left one season without new rope falls into the river, and the province beyond it is a province alone."
