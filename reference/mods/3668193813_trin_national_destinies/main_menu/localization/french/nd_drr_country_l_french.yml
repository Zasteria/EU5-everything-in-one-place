l_french:
 DRR: "Durranis"
 DRR_ADJ: "Durrani"
 DRR_f: "Empire Durrani"
 DRR_f_desc: "Forgez un empire dirigé par les Pachtounes s'étendant au carrefour de la Perse, de l'Asie centrale et de l'Hindoustan, dans la tradition de la loya jirga d'Ahmad Shah Durrani à Kandahar en 1747. L'empire Durrani était la deuxième plus grande puissance musulmane de son époque, liant la confédération tribale afghane, le Khorasan, le Sind et le Pendjab en un seul royaume sous l'étendard des Abdali."
