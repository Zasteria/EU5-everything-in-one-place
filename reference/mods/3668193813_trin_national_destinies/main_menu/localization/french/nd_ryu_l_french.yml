l_french:
 STATIC_MODIFIER_NAME_nd_ryu_bridge_of_nations: "Bankoku Shinryo"
 STATIC_MODIFIER_DESC_nd_ryu_bridge_of_nations: "Le royaume Ryukyu se déclare le pont entre toutes les nations, un carrefour maritime reliant les grandes civilisations de l'Asie de l'Est et du Sud-Est par le commerce, la diplomatie et les échanges culturels."
 STATIC_MODIFIER_NAME_nd_ryu_sovereignty_of_isles: "Souveraineté des îles"
 STATIC_MODIFIER_DESC_nd_ryu_sovereignty_of_isles: "Sous la main de fer de la dynastie Sho, les îles sont soudées en un royaume unifié avec une identité culturelle distincte, ses guerriers formés à l'art du Te et ses forteresses commandant toutes les approches."
 STATIC_MODIFIER_NAME_nd_ryu_unified_kingdom: "Royaume unifié de Chuzan"
 STATIC_MODIFIER_DESC_nd_ryu_unified_kingdom: "Les trois royaumes en guerre ont été unis sous un trône unique à Shuri, apportant une gouvernance et une légitimité centralisées aux îles Ryukyu."
 STATIC_MODIFIER_NAME_nd_ryu_island_confederation: "Confédération insulaire"
 STATIC_MODIFIER_DESC_nd_ryu_island_confederation: "Bien qu'uni de nom, le royaume préserve l'autonomie de ses domaines constitutifs, favorisant la coopération et la prospérité par le consensus plutôt que par la coercition."
 STATIC_MODIFIER_NAME_nd_ryu_island_defiance: "Défi de l'île"
 STATIC_MODIFIER_DESC_nd_ryu_island_defiance: "Les habitants des îles Ryukyu canalisent leurs souffrances vers une résistance féroce, développant de nouvelles traditions martiales à partir des outils mêmes de leur travail quotidien."
 STATIC_MODIFIER_NAME_nd_ryu_pragmatic_survival: "Survie pragmatique"
 STATIC_MODIFIER_DESC_nd_ryu_pragmatic_survival: "Incapable de rivaliser avec la puissance militaire étrangère, le royaume fait preuve de ruse, entretenant ses réseaux commerciaux, son appareil de renseignement et ses relations diplomatiques pour préserver autant que possible sa souveraineté."
 nd_ryu.1.t: "Le royaume de Ryukyu"
 nd_ryu.1.d: "The islands are united under one crown. From the coral harbors of Naha to the stone ramparts of Nakijin, the Ryukyu archipelago speaks with a single voice for the first time. Ships bearing the royal standard already call at ports from Siam to Korea, from Malacca to Ningbo. The question before us now is what kind of kingdom we shall build.\n\nShall Ryukyu embrace its destiny as the Bankoku Shinryo, the Bridge Between All Nations, opening its harbors to every wind and every people, growing wealthy as the indispensable intermediary of the Eastern seas? Or shall we forge the islands into a sovereign fortress-kingdom, cultivating our own martial traditions and cultural identity, beholden to no foreign power?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ryu.1.a: "Nous sommes le pont entre toutes les nations."
 nd_ryu.1.b: "Ces îles ne s'inclinent devant aucun trône étranger."
 nd_ryu.2.t: "Les Trois Royaumes Unis"
 nd_ryu.2.d: "In 1429, Sho Hashi completed what his father Sho Shisho had begun: the unification of the three rival kingdoms of Okinawa. Hokuzan, the northern mountain kingdom centered on Nakijin Castle, fell first in 1416. Nanzan, the southern domain based at Shimajiri-Oozato, submitted thirteen years later. The central kingdom of Chuzan, with its magnificent Shuri Castle remodeled after the Forbidden City itself, now commands the entire island.\n\nSho Hashi has adopted the Chinese hierarchical court system and established Naha as the kingdom's great harbor. The Ming Emperor has recognized his authority with an investiture seal. But how shall this new kingdom be governed?"
 nd_ryu.2.a: "Un trône, une loi, un royaume."
 nd_ryu.2.b: "Que chaque domaine garde ses coutumes au sein de l'ensemble."
 nd_ryu.3.t: "La cloche Bankoku Shinryo"
 nd_ryu.3.d: "A great bronze bell has been cast and hung at Shuri Castle, bearing an inscription that will define the kingdom for centuries to come. It reads: 'Ryukyu is a magnificent country in the South Seas, gathering the finest essence of the three kingdoms of Korea, China, and Japan. Ryukyu is the Bridge Between All Nations, and its ships are filled with the precious products of all lands.'\n\nThe Bankoku Shinryo, the Bridge Between All Nations, is more than a boast. It is a declaration of purpose. While great empires build walls and raise armies, this small island kingdom has found its power in the space between civilizations, carrying silk from China, swords from Japan, spices from Siam, and horses from Korea across the great ocean highways."
 nd_ryu.3.a: "Que la cloche sonne à travers les mers."
 nd_ryu.4.t: "Les grands jours de Chuzan"
 nd_ryu.4.d: "King Sho Shin ascended the throne in 1477 and inaugurated what chroniclers would call the Great Days of Chuzan: the golden age of the Ryukyu Kingdom. His reign transformed the islands from a loose collection of feudal domains into a true centralized state.\n\nThe aji, the feudal lords, were compelled to leave their castles and reside in the capital at Shuri, where the king could watch them. Their weapons were collected and stored in the royal armory, not destroyed, but concentrated under the crown's control. The hiki system was reorganized into a disciplined force with military, police, and administrative duties.\n\nBeyond these political reforms, Sho Shin patronized the arts with extraordinary generosity. The Sonohyan Utaki stone gate was erected as a sacred site of prayer before the king's journeys. Bingata dyeing and Ryukyuan lacquerware reached heights of sophistication that impressed even the refined courts of Beijing and Kyoto."
 nd_ryu.4.a: "Un âge d'or pour les âges."
 nd_ryu.5.t: "La naissance du Kobudo"
 nd_ryu.5.d: "In the wake of the Satsuma invasion of 1609, the warriors of Ryukyu found themselves disarmed and subjugated. The Satsuma domain imposed strict bans on the possession of weapons, seeking to prevent any possibility of rebellion. But the spirit of the Ryukyuan warrior could not be so easily suppressed.\n\nFarmers, fishermen, and commoners adapted the tools of their daily labor into instruments of war. The bo staff evolved from walking sticks and carrying poles. The sai emerged from modified animal prods. The tonfa came from millstone handles. The nunchaku from grain flails. The kama from harvesting sickles. The ekku from boat oars.\n\nIn secret, the traditions of Te, the indigenous martial art of the Ryukyuan aristocracy, merged with these improvised weapon techniques to create something entirely new: Kobudo, the ancient martial way. Trained in darkness, passed from master to student in absolute secrecy, this tradition would eventually give birth to karate itself."
 nd_ryu.5.a: "Nous ne serons jamais vraiment conquis."
 nd_ryu.5.b: "La survie exige plus que de la combativité."
 nd_ryu.6.t: "Les écoles de Te"
 nd_ryu.6.d: "Over generations, the martial traditions of the Ryukyu Islands have crystallized into distinct schools, each reflecting the character of its place of origin. Shuri-te, practiced by the aristocracy in the shadow of the royal castle, emphasizes speed, agility, and decisive strikes. Naha-te, born in the commercial port city, favors close-quarters power and breathing techniques drawn from Chinese kung fu. Tomari-te, from the fishing village between them, blends elements of both.\n\nThese styles are no longer merely techniques of self-defense. They have become a philosophical discipline, a way of understanding the body, the mind, and the relationship between them. Masters codify their knowledge into kata, precise forms that encode combat wisdom in movements that can be practiced openly without revealing their martial purpose."
 nd_ryu.6.a: "La main est plus puissante que l'épée."
 nd_ryu_gusuku_architecture: "Architecture Gusuku"
 nd_ryu_gusuku_architecture_desc: "Les forteresses en pierre aux murs incurvés caractéristiques des îles Ryukyu, mélangeant des techniques de construction chinoises, japonaises et indigènes dans des ouvrages défensifs d'une résilience unique."
 nd_ryu_noro_priestesses: "Prêtresses Noro"
 nd_ryu_noro_priestesses_desc: "Les femmes chefs spirituelles qui président les bosquets sacrés d'utaki et maintiennent la santé spirituelle des communautés Ryukyuan par la prière et les rituels."
 nd_ryu_early_te: "L'art du thé"
 nd_ryu_early_te_desc: "Le système de combat indigène de l'aristocratie Ryukyuan, mettant l'accent sur les techniques de combat à mains nues qui finiront par évoluer vers le karaté."
 nd_ryu_island_fisheries: "Pêches insulaires"
 nd_ryu_island_fisheries_desc: "Des communautés de pêcheurs côtières organisées qui soutiennent la population insulaire et forment les marins qui feront partie de l'équipage de la flotte marchande du royaume."
 nd_ryu_seafaring_tradition: "Navigation Ryukyuan"
 nd_ryu_seafaring_tradition_desc: "Des siècles de navigation océanique entre les îles dispersées de la chaîne des Ryukyu, renforçant le savoir-faire marin qui sous-tend le commerce maritime du royaume."
 nd_ryu_sho_hashi_unification: "L'unification de Sho Hashi"
 nd_ryu_sho_hashi_unification_desc: "La fusion des trois royaumes rivaux d'Okinawa (Hokuzan, Chuzan et Nanzan) sous une seule couronne au château de Shuri en 1429."
 nd_ryu_entrepot_network: "Réseau commercial d'entrepôt"
 nd_ryu_entrepot_network_desc: "Le rôle du royaume en tant qu'intermédiaire maritime, réexportant des marchandises entre la Chine, le Japon, la Corée et l'Asie du Sud-Est depuis sa position centrale dans la mer de Chine orientale."
 nd_ryu_lacquerware_craft: "Laque Ryukyuan"
 nd_ryu_lacquerware_craft_desc: "Des laques de luxe si raffinées que les envoyés Ming se sont rendus à Ryukyu spécifiquement pour l'acheter, combinant les techniques chinoises avec l'esthétique distinctive d'Okinawa."
 nd_ryu_naha_harbor: "Port de Naha"
 nd_ryu_naha_harbor_desc: "Le développement de Naha en tant que port principal du royaume, équipé pour desservir les jonques commerciales qui relient Ryukyu à tous les grands ports d'Asie de l'Est."
 nd_ryu_tribute_diplomacy: "Diplomatie d'hommage"
 nd_ryu_tribute_diplomacy_desc: "Maîtrise du système tributaire Ming, garantissant un accès commercial préférentiel et une reconnaissance impériale grâce à une culture diplomatique minutieuse."
 nd_ryu_golden_age: "Grands jours de Chuzan"
 nd_ryu_golden_age_desc: "L'âge d'or sous le roi Sho Shin, lorsque les seigneurs aji étaient amenés à Shuri, les armes étaient centralisées et les arts prospéraient sous le patronage royal."
 nd_ryu_bingata_tradition: "Tradition Bingata"
 nd_ryu_bingata_tradition_desc: "L'art royal de la teinture textile unique à Okinawa, synthétisant les techniques indiennes, chinoises et javanaises en motifs floraux vifs réservés à l'aristocratie."
 nd_ryu_tsuboya_pottery: "Poterie Tsuboya"
 nd_ryu_tsuboya_pottery_desc: "Production de céramique consolidée dans le district de Tsuboya, unifiant les fours dispersés en un centre efficace pour les produits nationaux et la poterie d'exportation."
 nd_ryu_awamori_craft: "Distillation Awamori"
 nd_ryu_awamori_craft_desc: "L'esprit traditionnel Ryukyuan distillé à partir de riz thaïlandais à l'aide de moule koji noir, une technique apportée du Siam via les réseaux commerciaux du royaume."
 nd_ryu_maransen_fleet: "Flotte Maransen"
 nd_ryu_maransen_fleet_desc: "Des jonques commerciales rapides et maniables, spécialement construites pour les routes maritimes d'Asie de l'Est, transportant des marchandises entre Naha et tous les grands ports de Malacca à Ningbo."
 nd_ryu_bankoku_shinryo: "Bankoku Shinryo"
 nd_ryu_bankoku_shinryo_desc: "Le Pont entre toutes les nations : la déclaration inscrite sur la grosse cloche du château de Shuri, proclamant le rôle de Ryukyu en tant que carrefour maritime de l'Asie de l'Est."
 nd_ryu_dual_sovereignty: "Double souveraineté"
 nd_ryu_dual_sovereignty_desc: "L’art délicat d’entretenir simultanément des relations tributaires avec la Chine et le Japon Satsuma, en préservant une certaine autonomie grâce à l’ambiguïté diplomatique."
 nd_ryu_kobudo_development: "Kobudo"
 nd_ryu_kobudo_development_desc: "Ancienne voie martiale née de l'interdiction des armes, transformant les outils agricoles et ménagers en instruments de guerre (bo, sai, tonfa, nunchaku) kama."
 nd_ryu_satsuma_era_trade: "Commerce de l’ère Satsuma"
 nd_ryu_satsuma_era_trade_desc: "Sous la supervision de Satsuma, le royaume a paradoxalement élargi ses réseaux commerciaux, le domaine encourageant le commerce Ryukyu-Chine à mener des échanges commerciaux indirects entre le Japon et la Chine."
 nd_ryu_convoy_protection: "Protection des convois commerciaux"
 nd_ryu_convoy_protection_desc: "Des navires de patrouille défendant les flottes marchandes du royaume contre les pirates dans la mer de Chine orientale, documenté jusqu'au tournant du 19e siècle."
 nd_ryu_island_defense: "Défense de la chaîne insulaire"
 nd_ryu_island_defense_desc: "Fortification répartie sur tout l'archipel, tirant parti des avantages défensifs naturels de la géographie insulaire contre tout envahisseur potentiel."
 nd_ryu_pechin_administration: "Bureaucratie péchinienne"
 nd_ryu_pechin_administration_desc: "La classe administrative qui a gouverné Ryukyu pendant des siècles de double souveraineté, maintenant une gouvernance insulaire efficace malgré la suzeraineté étrangère."
 nd_ryu_performing_arts: "Arts du spectacle Ryukyuan"
 nd_ryu_performing_arts_desc: "Les traditions de cour raffinées de la danse dramatique Kumiodori, de la musique sanshin et de la poésie classique qui définissent l'identité culturelle d'Okinawa."
 nd_ryu_sugar_cultivation: "Culture du sucre"
 nd_ryu_sugar_cultivation_desc: "La production organisée de canne à sucre introduite de Chine, est devenue un produit d'exportation majeur qui a soutenu l'économie du royaume au cours des siècles suivants."
 nd_ryu_maritime_heritage: "Patrimoine maritime"
 nd_ryu_maritime_heritage_desc: "Des siècles de tradition maritime ininterrompue, depuis les premiers voyages inter-îles jusqu'aux grandes expéditions commerciales de l'âge d'or, transmises de génération en génération."
 nd_ryu_karate_codification: "Codification du Karaté"
 nd_ryu_karate_codification_desc: "La systématisation des styles de combat Te dans des écoles formelles (Shuri-te, Naha-te et Tomari-te), chacune codant des générations de sagesse de combat dans des kata codifiés."
 nd_ryu_okinawan_identity: "Identité d'Okinawa"
 nd_ryu_okinawan_identity_desc: "L'affirmation d'une identité culturelle Ryukyuan distincte, ni chinoise ni japonaise mais uniquement okinawaienne, enracinée dans des siècles de civilisation indépendante."
 nd_ryu_meiji_resistance: "Résistance Meiji"
 nd_ryu_meiji_resistance_desc: "Défi à l’annexion forcée et à l’assimilation culturelle, alors que le peuple Ryukyuan lutte pour préserver sa langue, ses coutumes et sa souveraineté."
 nd_ryu_modern_crafts: "Renaissance de l’artisanat moderne"
 nd_ryu_modern_crafts_desc: "L'adaptation de l'artisanat traditionnel Ryukyuan (laques, textiles bingata, poterie Tsuboya) aux marchés modernes tout en préservant les techniques ancestrales."
 nd_ryu_maritime_legacy: "Héritage maritime"
 nd_ryu_maritime_legacy_desc: "Le point culminant de siècles de connaissances maritimes des Ryukyuans, de la navigation sur les récifs coralliens au passage en haute mer, assurant ainsi la connexion des îles avec le reste du monde."
 n_nd_ryu_maransen: "Maransen"
 n_nd_ryu_maransen_desc: "Des jonques commerciales rapides Ryukyuan optimisées pour les routes maritimes d'Asie de l'Est, combinant les techniques de construction navale chinoise avec le matelotage local."
 a_nd_ryu_kobudo_militia: "Milice Kobudo"
 a_nd_ryu_kobudo_militia_desc: "Des combattants armés d'armes improvisées (bo, sai, tonfa, nunchaku) nées des interdictions d'armes qui ont contraint les habitants des Ryukyuan à transformer les outils du quotidien en instruments de guerre."
 n_nd_ryu_umibune: "Umibune"
 n_nd_ryu_umibune_desc: "Navires de patrouille Ryukyuan conçus pour protéger les convois commerciaux du royaume contre les pirates en mer de Chine orientale."
 n_nd_ryu_patrol_junk: "Déchets de patrouille"
 n_nd_ryu_patrol_junk_desc: "Des navires Ryukyuan plus légers ont été mobilisés grâce au système de prélèvement pour les opérations de défense côtière et de lutte contre la piraterie."
 nd_ryu_trading_house: "Maison de commerce Ryukyuan"
 nd_ryu_trading_house_desc: "Un entrepôt commercial et un service de courtage au service du commerce d'entrepôt du royaume, facilitant l'échange de marchandises entre les marchands chinois, japonais, coréens et d'Asie du Sud-Est."
 nd_ryu_utaki: "Sanctuaire Utaki"
 nd_ryu_utaki_desc: "Bosquets sacrés et sites de prière présidés par les prêtresses Noro, cœur spirituel des communautés Ryukyuan où des prières sont offertes pour de bonnes récoltes et des voyages sûrs."
 nd_ryu_bingata_workshop: "Atelier Bingata"
 nd_ryu_bingata_workshop_desc: "Un atelier textile royal produisant les tissus teints aux couleurs vives uniques au royaume Ryukyu, avec des motifs réservés aux différents rangs de l'aristocratie."
 nd_ryu_lacquerware_workshop: "Atelier de laque"
 nd_ryu_lacquerware_workshop_desc: "Un atelier produisant les exquises laques Ryukyuan prisées dans toute l'Asie de l'Est, combinant plusieurs couches de laque avec des techniques décoratives complexes."
 nd_ryu_tsuboya_kiln: "Four Tsuboya"
 nd_ryu_tsuboya_kiln_desc: "Un centre de production de poterie consolidé dans la tradition Tsuboya, cuisant à la fois des articles domestiques fonctionnels et de grands pots de stockage utilisés pour le vieillissement de l'awamori."
 nd_ryu_awamori_distillery: "Distillerie Awamori"
 nd_ryu_awamori_distillery_desc: "Une distillerie produisant l'esprit traditionnel Ryukyuan à partir de riz thaïlandais et de moisissure koji noire, vieilli dans des pots en argile pour développer sa saveur distinctive."
 nd_ryu_gusuku: "Forteresse de Gusuku"
 nd_ryu_gusuku_desc: "Une forteresse en pierre typique des Ryukyuan avec des murs aux courbes gracieuses, combinant les principes défensifs de l'architecture militaire chinoise et japonaise avec les techniques de construction indigènes."
 nd_ryu_harbor: "Port de Ryukyuan"
 nd_ryu_harbor_desc: "Installations portuaires améliorées conçues pour desservir les jonques commerciales qui relient le royaume Ryukyu à tous les grands ports d'Asie de l'Est et du Sud-Est."
 nd_ryu_karate_dojo: "Dojo de Karaté"
 nd_ryu_karate_dojo_desc: "Une salle d'entraînement où sont enseignés les arts martiaux systématisés de Shuri-te, Naha-te et Tomari-te, produisant des combattants disciplinés issus de la population insulaire."
 nd_ryu_sugar_mill: "Moulin à sucre Ryukyuan"
 nd_ryu_sugar_mill_desc: "Une installation de transformation de la canne à sucre en sucre raffiné, une culture introduite de Chine qui est devenue l'une des exportations les plus précieuses du royaume."
 nd_ryu_fishing_settlement: "Village de pêcheurs de Ryukyuan"
 nd_ryu_fishing_settlement_desc: "Une communauté de pêche côtière organisée fournissant à la fois subsistance et formation maritime à la population insulaire."
 nd_ryu_gusuku_maintenance: "Entretien Gusuku"
 nd_ryu_gusuku_maintenance_desc: "L'entretien des murs de pierre courbés distinctifs de la forteresse."
 nd_ryu_entrepot_operations: "Opérations d'entrepôt"
 nd_ryu_entrepot_operations_desc: "Gérer le flux de marchandises via la maison de commerce en provenance de plusieurs partenaires commerciaux."
 nd_ryu_shrine_offerings: "Offrandes au sanctuaire"
 nd_ryu_shrine_offerings_desc: "Rice, incense and awamori presented at the utaki shrine by the Noro priestesses."
 nd_ryu_bingata_dyeing: "Teinture Bingata"
 nd_ryu_bingata_dyeing_desc: "Teindre des tissus fins à l'aide de pigments importés et de la technique distinctive du pochoir Bingata, unique au royaume Ryukyu."
 nd_ryu_lacquer_finishing: "Finition laque"
 nd_ryu_lacquer_finishing_desc: "Produire des laques de qualité pour l'exportation grâce à l'application minutieuse de plusieurs couches de laque et de techniques décoratives."
 nd_ryu_ceramics_firing: "Cuisson de la céramique"
 nd_ryu_ceramics_firing_desc: "Cuisson de l'argile en poterie dans des fours consolidés dans la tradition Tsuboya."
 nd_ryu_spirit_distillation: "Distillation d'alcool"
 nd_ryu_spirit_distillation_desc: "Distiller du riz thaïlandais avec de la moisissure koji noire pour produire de l'awamori, l'esprit traditionnel Ryukyuan."
 nd_ryu_harbor_maintenance: "Entretien du port"
 nd_ryu_harbor_maintenance_desc: "Entretien des installations portuaires, des quais et des aides à la navigation."
 nd_ryu_dojo_upkeep: "Entretien du dojo"
 nd_ryu_dojo_upkeep_desc: "Entretien de la salle d'entraînement et aménagement pour les étudiants en arts martiaux."
 nd_ryu_cane_processing: "Traitement de la canne"
 nd_ryu_cane_processing_desc: "Broyage, ébullition et raffinage de la canne à sucre en sucre exportable."
 nd_ryu_fishing_nets: "Opérations de pêche"
 nd_ryu_fishing_nets_desc: "Pêche côtière organisée utilisant des filets, des lignes et des techniques traditionnelles pour approvisionner les communautés insulaires."
 levy_nd_ryu_kobudo_militia: "Prélèvement de la milice Kobudo"
 levy_nd_ryu_kobudo_militia_desc: "Milice paysanne Ryukyuan armée d'armes improvisées tirées d'outils agricoles et de pêche."
 levy_nd_ryu_patrol_junk: "Prélèvement sur les déchets de patrouille"
 levy_nd_ryu_patrol_junk_desc: "Navires de défense côtière issus des communautés marchandes des îles Ryukyu."
 nd_ryu_formed_tt: "Ryukyu a été formé"
 nd_ryu_path_a_tt: "J'ai choisi Bankoku Shinryo"
 nd_ryu_path_b_tt: "A choisi la souveraineté des îles"
 nd_ryu_destiny: "Destin du royaume Ryukyu"
 nd_ryu_destiny_desc: "Les îles sont unies, les ports regorgent de navires et le monde vous fait signe. Que ce soit en tant que pont entre les nations ou en tant que royaume-forteresse souverain, il nous appartient de forger le destin de Ryukyu."
 nd_ryu_dest_eastern_hub: "Centre commercial de l'Est"
 nd_ryu_dest_eastern_hub_desc: "Assurer le contrôle de la porte commerciale japonaise à Hakata et assurer la circulation de la soie sur le marché des capitaux de Ryukyuan. Atteignez 1 000 pièces d’or pour financer l’expansion du réseau d’entrepôts."
 nd_ryu_dest_sea_dominance: "Domination des mers orientales"
 nd_ryu_dest_sea_dominance_desc: "Les grands ports de Malacca et de Guangzhou doivent tomber sous l'influence des Ryukyuan. Avec 2 000 pièces d'or au trésor et le prestige d'une puissance maritime, le royaume contrôle les voies maritimes de l'Asie de l'Est."
 nd_ryu_dest_bridge_nations: "Le vrai Bankoku Shinryo"
 nd_ryu_dest_bridge_nations_desc: "La réalisation ultime du Pont entre toutes les nations. Contrôlez Temasek, Tondo et le grand port de Quanzhou à Jinjiang. Amassez 3 000 pièces d’or, gagnez le plus grand prestige et adoptez l’institution bancaire pour devenir le carrefour indispensable du commerce mondial."
 nd_ryu_dest_satsuma_revenge: "Vengeance contre Satsuma"
 nd_ryu_dest_satsuma_revenge_desc: "L'humiliation de l'invasion de Satsuma sera récompensée en nature. Prenez Kagoshima, le siège des Shimazu, avec une armée d'au moins 30 000 hommes et la stabilité nécessaire pour soutenir une guerre de libération."
 nd_ryu_dest_island_power: "Domination de la chaîne d'îles"
 nd_ryu_dest_island_power_desc: "Étendre la souveraineté des Ryukyuan sur toute la chaîne d'îles, d'Amami Oshima à Tsushima. Déployez une armée de 50 000 hommes et maintenez un trésor de 2 000 pièces d’or pour projeter votre puissance à travers les détroits."
 nd_ryu_dest_shuri_ascendant: "Ascendant Shuri"
 nd_ryu_dest_shuri_ascendant_desc: "L'affirmation ultime de la souveraineté des Ryukyuans. Conquérez Osaka et Kyoto, les cœurs commerciaux et impériaux du Japon lui-même. Alignez 75 000 hommes, détenez 3 000 pièces d’or et gagnez le prestige digne d’une puissance continentale."
 nd_ryu.7.t: "Le destin d'un royaume"
 nd_ryu.7.d: "Le royaume de Ryukyu se trouve à la croisée des chemins. Les îles sont unies, les ports sont pleins et le monde attend de voir ce que deviendra ce petit mais fier royaume. Le chemin que nous avons choisi nous définira pour des générations : que nous nous tournions vers l'extérieur pour embrasser le commerce mondial ou que nous nous tournions vers l'intérieur pour forger une nation insulaire incassable, le destin de Ryukyu commence maintenant."
 nd_ryu.7.a: "Notre destin nous attend."
 nd_ryu.8.t: "Porte d'entrée au Japon"
 nd_ryu.8.d: "Les marchands Ryukyuan contrôlent désormais le port de Hakata, grande porte d'entrée du commerce japonais. Les navires portant l'étendard royal côtoient les jonques chinoises et les navires coréens, et la soie du continent circule librement dans nos entrepôts. Le réseau d'entrepôts qui a soutenu Ryukyu pendant des siècles atteint désormais le cœur de son plus grand marché. Les marchands de Naha font la fête, mais les mers au-delà vous attendent avec des récompenses encore plus importantes."
 nd_ryu.8.a: "Le commerce oriental est le nôtre."
 nd_ryu.9.t: "Maîtres des mers orientales"
 nd_ryu.9.d: "From the Strait of Malacca to the Pearl River Delta, the Ryukyuan trade network spans the breadth of maritime Asia. Guangzhou's silk and porcelain, Malacca's spices and tin, all pass through Ryukyuan hands. No merchant fleet sails these waters without reckoning with the kingdom that sits at their crossroads.\n\nShall we assert our dominance through naval supremacy, protecting our routes with warships that command respect? Or shall we build a network of tributary partners, binding lesser states to our commercial empire through diplomacy and mutual dependence?"
 nd_ryu.9.a: "Nos navires de guerre gouverneront ces eaux."
 nd_ryu.9.b: "Liez-les-nous par le commerce et les hommages."
 nd_ryu.10.t: "Le pont entre toutes les nations"
 nd_ryu.10.d: "What the bell of Shuri Castle proclaimed centuries ago has at last become reality. From Temasek at the tip of the Malay Peninsula to Tondo in the Philippine archipelago, from Quanzhou's ancient harbor to the spice islands beyond, Ryukyuan ships connect every corner of the maritime world. The kingdom that once counted its wealth in coral and shellfish now holds the keys to global commerce.\n\nShall we consolidate this position as the world's indispensable crossroads, drawing all trade through our harbors? Or shall we leverage our connections to become the supreme diplomatic power of the eastern seas, mediating between empires?"
 nd_ryu.10.a: "Toutes les routes de la mer passent par Ryukyu."
 nd_ryu.10.b: "Nous serons l'arbitre des océans."
 nd_ryu.11.t: "La chute de Satsuma"
 nd_ryu.11.d: "Kagoshima brûle. Le grand château des Shimazu, d'où fut lancée l'invasion de 1609, arbore désormais l'étendard de la dynastie Sho. Pendant deux siècles, les habitants des îles Ryukyu ont enduré l’asservissement, leurs armes confisquées, leur souveraineté n’étant qu’une fiction polie entretenue pour le commerce chinois. Pas plus. Les traditions martiales nées en secret (le kobudo, le karaté, l’esprit féroce de l’île qu’aucun occupant ne pouvait écraser) ont été justifiées sur le champ de bataille. Satsuma a récolté ce qu’il a semé."
 nd_ryu.11.a: "La honte de 1609 est vengée."
 nd_ryu.12.t: "Seigneurs de la chaîne d'îles"
 nd_ryu.12.d: "The Ryukyuan kingdom now stretches from the subtropical waters around Sakishima to the cold straits of Tsushima. Every island between Okinawa and the Japanese mainland acknowledges the authority of Shuri. The question now is how to consolidate this far-flung island domain.\n\nShall we fortify every harbor and headland, making the archipelago an impregnable chain of island fortresses? Or shall we mobilize the warrior spirit of the island population, transforming every fisherman and farmer into a soldier ready to defend the realm?"
 nd_ryu.12.a: "Chaque île sera une forteresse."
 nd_ryu.12.b: "Chaque insulaire sera un guerrier."
 nd_ryu.13.t: "Le trône de Shuri commande le continent"
 nd_ryu.13.d: "The impossible has been achieved. Osaka, the great commercial metropolis of Japan, and Kyoto, the seat of the imperial court itself, now answer to the Kingdom of Ryukyu. A tiny island nation, once dismissed as a vassal state fit only for tribute trade, has conquered the heartland of one of the world's great civilizations. The martial arts born from oppression (the empty-handed fighting styles, the weaponized farming tools, the fierce spirit of an unconquerable people) have carried the banner of Shuri to heights no one dared imagine.\n\nShall we press onward in conquest, or consolidate our island empire into an unassailable fortress?"
 nd_ryu.13.a: "Qu'aucune terre ne soit hors de notre portée."
 nd_ryu.13.b: "Fortifiez ce que nous avons gagné."
 STATIC_MODIFIER_NAME_nd_ryu_dest_naval_supremacy: "Suprématie navale"
 STATIC_MODIFIER_DESC_nd_ryu_dest_naval_supremacy: "Les navires de guerre Ryukyuan patrouillent sur les routes commerciales de l'Asie de l'Est, assurant un passage sûr à la flotte marchande du royaume et dissuadant quiconque voudrait contester sa domination maritime."
 STATIC_MODIFIER_NAME_nd_ryu_dest_tributary_network: "Réseau affluent"
 STATIC_MODIFIER_DESC_nd_ryu_dest_tributary_network: "Un réseau de dépendances commerciales et de relations diplomatiques lie les petits États à l'empire commercial de Ryukyu, même si le maintien de ce réseau met à rude épreuve le budget militaire du royaume."
 STATIC_MODIFIER_NAME_nd_ryu_dest_world_crossroads: "Carrefour du monde"
 STATIC_MODIFIER_DESC_nd_ryu_dest_world_crossroads: "Ryukyu est devenu le lien indispensable du commerce maritime mondial, une position qui attire des colons, des marchands et des érudits des quatre coins du monde connu."
 STATIC_MODIFIER_NAME_nd_ryu_dest_ocean_diplomacy: "Diplomatie océanique"
 STATIC_MODIFIER_DESC_nd_ryu_dest_ocean_diplomacy: "Le réseau inégalé de relations diplomatiques du royaume maritime lui permet d'agir comme médiateur entre les empires, d'obtenir des conditions favorables et de projeter son influence bien au-delà de ses côtes insulaires."
 STATIC_MODIFIER_NAME_nd_ryu_dest_fortress_islands: "Îles forteresses"
 STATIC_MODIFIER_DESC_nd_ryu_dest_fortress_islands: "Chaque port et promontoire de la chaîne d'îles a été fortifié selon la tradition gusuku, créant un réseau défensif imprenable qui dissuade l'invasion et écrase la rébellion."
 STATIC_MODIFIER_NAME_nd_ryu_dest_warrior_mobilization: "Mobilisation des guerriers"
 STATIC_MODIFIER_DESC_nd_ryu_dest_warrior_mobilization: "Les traditions martiales du kobudo et du karaté ont été systématisées dans une doctrine de mobilisation nationale, entraînant chaque insulaire valide à renforcer les armées du royaume en cas de besoin."
 STATIC_MODIFIER_NAME_nd_ryu_dest_island_conquest: "Conquête de l'île"
 STATIC_MODIFIER_DESC_nd_ryu_dest_island_conquest: "The kingdom's armies march with the fierce determination of an island people who refused to be conquered, carrying the martial traditions of Ryukyu to the mainland, though naval readiness suffers as resources flow to land campaigns."
 STATIC_MODIFIER_NAME_nd_ryu_dest_island_fortification: "Fortification de l'île"
 STATIC_MODIFIER_DESC_nd_ryu_dest_island_fortification: "Les conquêtes durement gagnées sont assurées grâce à une fortification et une mobilisation rapides, transformant chaque nouveau territoire en un autre maillon de la chaîne imprenable du royaume insulaire."
 nd_ryu_grand_entrepot: "Grand Entrepôt"
 nd_ryu_grand_entrepot_desc: "L'expression ultime du rôle de Ryukyu en tant que pont entre toutes les nations : un vaste complexe commercial où les marchandises de tous les coins de l'Asie maritime sont stockées, classées et réexportées à travers le monde."
 nd_ryu_shuri_citadel: "Citadelle de Shuri"
 nd_ryu_shuri_citadel_desc: "Un magnifique palais-forteresse dans la tradition du grand gusuku, siège de la souveraineté martiale de la dynastie Sho sur un empire insulaire qui impose désormais le respect des puissances continentales."
 nd_ryu_entrepot_administration: "Administration de l'entrepôt"
 nd_ryu_entrepot_administration_desc: "Gérer les vastes opérations d'entreposage et de courtage du grand complexe commercial."
 nd_ryu_citadel_garrison: "Garnison de la Citadelle"
 nd_ryu_citadel_garrison_desc: "Entretenir la garnison forteresse-palais et ses réserves d'armes et de provisions."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_ryu_bureaucracy_authority: "Autorité bureaucratique de la dynastie Sho"
 AUTO_MODIFIER_DESC_nd_ryu_bureaucracy_authority: "The unified Chuzan court at Shuri-jo administers the islands through a recognisable bureaucratic apparatus: the Sanshikan, the magiri, the Hiki rotation, the Kumemura chancery, the tribute registry, the Goseki peerage, and the noro hierarchy. The court has room for four more institutions."

 ryu_sanshikan_council_bureaucracy: "Conseil des Trois Sanshikan"
 ryu_sanshikan_council_bureaucracy_desc: "Les trois ministres en chef de rang sessei (sansoshi), issus de la lignée princière Sho-kin et de la haute pairie, qui gouvernèrent collectivement sous le roi après les réformes de Sho Shin (r. 1477-1526). Chaque ministre détenait un portefeuille (intérieur, finances, rituel) et les décisions nécessitaient un consensus entre les trois. Le Sanshikan a signé la correspondance diplomatique de Ryukyuan et a officiellement reçu les envoyés d'investiture chinois à Shuri-jo, articulant un exécutif conciliaire qui a survécu près de quatre siècles jusqu'à l'abolition de Meiji en 1879."

 ryu_magiri_administration_bureaucracy: "Administration du district de Magiri"
 ryu_magiri_administration_bureaucracy_desc: "Subdivision territoriale du royaume en magiri (districts ruraux), chacun administré par un officier jito-dai ou magiri-shu relevant de la cour royale. Les magiri organisaient des prélèvements sur les cultivateurs pour le travail des corvées, une taxation du riz en nature et la corvée gozaisho pour la construction de tributs à Naha. Codifiés dans le Ryukyu-koku Yuraiki et dans les registres ultérieurs, les magiri ont remplacé les anciennes propriétés du clan aji en tant qu'unité opérationnelle de l'administration royale - une action centralisatrice qui a atteint chaque village utaki et chaque hameau de pêcheurs de l'archipel."

 ryu_hiki_naval_rotation_bureaucracy: "Rotation navale Hiki"
 ryu_hiki_naval_rotation_bureaucracy_desc: "L'organisation des quais de Naha-jo qui équipait les jonques océaniques (shinko-sen) du royaume selon un système de rotation. Trois corps de hiki - Setado, Aragusuku et Yagachi dans les rouleaux Sho Shin - ont assumé la responsabilité des voyages d'hommage biennaux à Fuzhou, la réception des sappushi à l'arrivée des envoyés Ming et la patrouille des approches de Sakishima contre les escadrons de pirates Wako. Chaque randonnée possédait ses propres entrepôts, ses chemins de cordage et ses marins chevronnés dans le port de Naha, donnant au petit royaume un bras maritime discipliné sans commune mesure avec sa population."

 ryu_kumemura_diaspora_bureaucracy: "Administration de la diaspora chinoise de Kumemura"
 ryu_kumemura_diaspora_bureaucracy_desc: "Les Min-jin Sanju-roku Sei - les trente-six familles installées par l'empereur Hongwu dans le village de Kume près de Naha en 1392. Leurs descendants héréditaires ont fourni au royaume des scribes chinois classiques, des navigateurs formés au Hai-tao Zhen-jing, des interprètes pour les missions d'hommage et le personnel érudit confucianiste de la chancellerie. Kumemura dirigeait sa propre école confucéenne, le Meirindo (fondée en 1718), et élaborait les protocoles de réception sapposhi qui régissaient chaque cérémonie d'investiture des Ming et Qing jusqu'aux derniers jours du royaume."

 ryu_tribute_mission_bureaucracy: "Appareil de mission hommage"
 ryu_tribute_mission_bureaucracy_desc: "Le registre Shinko-sho dédié organise les ambassades d'hommage biennales du royaume auprès de la cour des Ming - et après 1644, de la cour des Qing - à Fuzhou et à Pékin, avec des députations parallèles auprès du daimyat de Satsuma à Kagoshima après l'invasion de Shimazu en 1609. L'appareil préparait des cadeaux sappo composés de soufre, de sucre raffiné, de chevaux et de laques ; autorisé les jonques de l'ambassade; et formé les chefs de mission seii-shi aux protocoles de double souveraineté : présentant Ryukyu comme un affluent chinois à Pékin tout en rendant discrètement hommage à Edo via Kagoshima."

 ryu_goseki_peerage_bureaucracy: "Pairie senior de Goseki"
 ryu_goseki_peerage_bureaucracy_desc: "La hiérarchie formalisée de la pairie de Wo-ji, Aji-ufu, Aji, Oyakata et Pechin qui, sous Sho Shin, a consolidé les anciens seigneurs du clan aji en une noblesse résidant à la cour classée selon la couleur du bonnet hachimaki. Le conseil de Goseki ratifia l'avancement des rangs, enregistra de nouveaux fiefs sur les listes du royaume et contrôla la préséance à la cour de Shuri. Le système liait les seigneurs insulaires agités (autrefois maîtres autonomes du Hokuzan, du Nanzan et du Sakishima) en une seule aristocratie consciente de son rang, regroupée autour du trône."

 ryu_omoro_liturgical_bureaucracy: "Cour liturgique d'Omoro Saushi"
 ryu_omoro_liturgical_bureaucracy_desc: "L'office sacerdotal de la Kikoe-Ogimi - prêtresse suprême noro, traditionnellement sœur du roi régnant - présidant les prêtresses noro du royaume et la compilation de l'Omoro Saushi, l'anthologie liturgique de chants sacrés du royaume en vingt-deux livres compilée entre 1531 et 1623. La Kikoe-Ogimi a accompli les rites d'investiture du roi à Sefa-Utaki, sanctifiés. la hiérarchie noro inter-îles qui liait l'archipel en un seul tissu rituel et politique et formalisait le complément femme-prêtresse à la cour masculine de Shuri."
