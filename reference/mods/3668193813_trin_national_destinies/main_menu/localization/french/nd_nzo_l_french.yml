l_french:
 STATIC_MODIFIER_NAME_nd_tiger_banner_of_the_black_mywa: "Bannière du Tigre du Mywa Noir"
 STATIC_MODIFIER_DESC_nd_tiger_banner_of_the_black_mywa: "La caste des guerriers Black Mywa, dont sont issus les dirigeants de Nanzhao, a réaffirmé sa domination martiale. Les Luojuzi, Tiger Sons, marchent à nouveau à l'avant-garde, leurs casques rouges flamboyants comme un feu à travers les hautes terres. Chaque centaine d’hommes donne un Fils Tigre, et chaque Fils Tigre vaut dix soldats ordinaires."
 STATIC_MODIFIER_NAME_nd_southern_silk_road: "Route de la Soie du Sud"
 STATIC_MODIFIER_DESC_nd_southern_silk_road: "Nanzhao est à cheval sur le carrefour des empires. La Tea Horse Road transporte le thé Pu'er au Tibet et ramène les chevaux ; la Route de la Soie du Sud relie la Birmanie, l'Inde et la Chine par les cols montagneux du Yunnan. Les marchands et artisans Bai transforment cette bénédiction géographique en prospérité durable."
 STATIC_MODIFIER_NAME_nd_tiger_sons_resurgent: "Les Fils du Tigre réapparaissent"
 STATIC_MODIFIER_DESC_nd_tiger_sons_resurgent: "L'esprit de la victoire de la guerre de Tianbao brûle dans les armées de Nanzhao. Les Tiger Sons mènent depuis le front et les hommes de moindre importance trouvent du courage dans leur exemple."
 STATIC_MODIFIER_NAME_nd_diplomatic_equilibrium: "Équilibre diplomatique"
 STATIC_MODIFIER_DESC_nd_diplomatic_equilibrium: "Ayant prouvé que même les Tang ne peuvent pas submerger le royaume par la force, Nanzhao négocie en position de force. L'équilibre entre les grandes puissances est le bouclier du Yunnan."
 STATIC_MODIFIER_NAME_nd_blessings_of_chongsheng: "Bénédictions de Chongsheng"
 STATIC_MODIFIER_DESC_nd_blessings_of_chongsheng: "Les Trois Pagodes sont les gardiennes éternelles de la foi et du royaume. Les pèlerins de toute l’Asie se rendent à Chongsheng et leur dévotion enrichit à la fois le pouvoir spirituel et temporel du royaume."
 STATIC_MODIFIER_NAME_nd_lords_of_the_irrawaddy: "Seigneurs de l'Irrawaddy"
 STATIC_MODIFIER_DESC_nd_lords_of_the_irrawaddy: "La conquête des Pyu a démontré la capacité de Nanzhao à projeter sa puissance bien au-delà de son cœur de montagne. La vallée de l’Irrawaddy tombe sous l’ombre de la Bannière du Tigre."
 STATIC_MODIFIER_NAME_nd_pyu_tributary_network: "Réseau d'affluents Pyu"
 STATIC_MODIFIER_DESC_nd_pyu_tributary_network: "Plutôt que de gouverner par l'épée seule, Nanzhao entraîne les villes Pyu conquises dans un réseau de relations tributaires. Leur richesse coule en amont et leur autonomie achète leur fidélité."
 STATIC_MODIFIER_NAME_nd_tea_horse_prosperity: "Prospérité du cheval de thé"
 STATIC_MODIFIER_DESC_nd_tea_horse_prosperity: "La Tea Horse Road est la bouée de sauvetage du commerce des Highlands. Thé du Yunnan pour les chevaux tibétains, soie chinoise pour les pierres précieuses birmanes : les caravanes ne se reposent jamais et les revenus des péages ne cessent jamais."
 nd_nzo.1.t: "Restauration de Nanzhao"
 nd_nzo.1.d: "The scattered peoples of Yunnan are united once more under a single banner. From the shores of Lake Erhai to the passes of the Ailao Mountains, the kingdom that once defied the Tang Dynasty and conquered the cities of the Irrawaddy is reborn.\n\nBut the character of this restoration remains to be determined. The Black Mywa warrior aristocracy stands ready to forge the kingdom through conquest, as their ancestors did when the Luojuzi, the Tiger Sons, led Nanzhao's armies to victories that shook the greatest empire on earth. Yet others point to Yunnan's position at the crossroads of civilizations, where the Southern Silk Road and the Tea Horse Road converge, and argue that commerce and culture will build a more enduring legacy than any sword.\n\nWhat spirit shall define the reborn kingdom?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_nzo.1.a: "Levez la bannière du Tigre. Laissez le Black Mywa partir en guerre !"
 nd_nzo.1.b: "Ouvrez les cols. Que les caravanes apportent la prospérité !"
 nd_nzo.2.t: "L'héritage de la guerre de Tianbao"
 nd_nzo.2.d: "In 751, when the Tang governor of Jiannan marched 80,000 soldiers into Yunnan to punish what he saw as a rebellious vassal, King Geluofeng met the invasion at Xiaguan. The battle was decisive: the Tang army was annihilated, their governor slain, and their ambitions to subjugate Nanzhao shattered for a generation.\n\nThe victory echoed across Asia. It proved that a highland kingdom of skilled warriors, fighting on familiar terrain, could humble even the mightiest empire. The Tianbao War became the founding myth of Nanzhao's independence: the moment when a confederation of mountain tribes proved itself a sovereign power.\n\nHow shall we honor this legacy?"
 nd_nzo.2.a: "Les Tiger Sons mèneront toujours depuis le front."
 nd_nzo.2.b: "La force mérite le respect et le respect apporte la paix."
 nd_nzo.3.t: "Les Trois Pagodes de Chongsheng"
 nd_nzo.3.d: "King Quan Fengyou commissioned the greatest architectural achievement in Yunnan's history: the Three Pagodas of Chongsheng Temple. The central Qianxun Pagoda rises nearly seventy meters into the sky: one of the tallest structures in all of China. Together with the temple complex of 890 rooms and 11,400 Buddha statues, it stands as the spiritual heart of the kingdom.\n\nAzhali Buddhism, the Tantric school unique to Yunnan, finds its grandest expression here. Worship of Avalokitesvara, the Great Black Deva, and the Guardian King of the North draws pilgrims from across the Buddhist world. The monastery's monks preserve learning, practice medicine, and advise the throne."
 nd_nzo.3.a: "Puissent les Trois Pagodes subsister pendant dix mille ans."
 nd_nzo.4.t: "Conquête des cités-États Pyu"
 nd_nzo.4.d: "In the 830s, Nanzhao's armies swept down from the highlands into the Irrawaddy valley, where the ancient Pyu civilization had flourished for centuries. One by one, the great Pyu cities (Sri Ksetra, Halingyi, Binnaka) fell to the Tiger Banner. The Pyu kingdom, weakened by internal divisions, could not withstand the onslaught.\n\nThis was not mere raiding. Nanzhao carried off skilled artisans, musicians, and scholars, enriching its own culture with Pyu achievements. The conquest opened the road to Burma and the Indian Ocean, transforming Nanzhao from a highland power into a regional empire.\n\nHow shall we govern our new domains?"
 nd_nzo.4.a: "Plantez la Bannière du Tigre sur les rives de l'Irrawaddy."
 nd_nzo.4.b: "Liez les Pyu en affluents : leur richesse nous sert mieux que leur ruine."
 nd_nzo.5.t: "Domination de la route du thé et du cheval"
 nd_nzo.5.d: "The ancient caravan routes through Yunnan have grown into one of the great commercial arteries of Asia. The Tea Horse Road carries Pu'er tea northward to Tibet and Sichuan, where it is traded for horses, salt, and silver. The Southern Silk Road connects China to Burma, India, and beyond, with Yunnan as the indispensable waypoint.\n\nCaravanserais dot the mountain passes. Bai merchants handle trade in a dozen languages. The toll revenues and transit taxes fill the royal treasury, and Yunnan's position as the middleman between civilizations makes it wealthier than its modest territory might suggest."
 nd_nzo.5.a: "Les caravanes ne se reposeront jamais."
 nd_nzo_luojuzi_tradition: "Tradition Luojuzi"
 nd_nzo_luojuzi_tradition_desc: "Les Luojuzi, les Fils du Tigre, constituaient l'avant-garde d'élite de Nanzhao. Pour cent soldats, le plus fort était choisi. Ils portaient des casques rouges, des armures de cuir et des boucliers de bronze, mais combattaient pieds nus pour gagner en vitesse et en agilité."
 nd_nzo_salt_extraction: "Extraction de sel du Yunnan"
 nd_nzo_salt_extraction_desc: "Des puits de sel parsemaient le paysage du Yunnan, fournissant une source de revenus cruciale contrôlée par la couronne. Le sel et l’or étaient extraits dans de nombreuses régions du royaume."
 nd_nzo_mywa_caste_system: "Système de castes Mywa"
 nd_nzo_mywa_caste_system_desc: "La société Nanzhao est divisée entre les Mywa blancs administratifs de l'ouest du Yunnan et les Mywa noirs militaristes de l'est. Ce système de double caste assurait à la fois la gouvernance et les prouesses martiales."
 nd_nzo_six_zhaos_legacy: "L'héritage des Six Zhao"
 nd_nzo_six_zhaos_legacy_desc: "En 738, Piluoge unifia les Six Zhaos, les six principautés de l'ouest du Yunnan, en un seul royaume sous la reconnaissance des Tang. Cette unification a jeté les bases du pouvoir de Nanzhao."
 nd_nzo_azhali_buddhism: "Bouddhisme Azhali"
 nd_nzo_azhali_buddhism_desc: "L'école tantrique ésotérique connue sous le nom de bouddhisme Azhali était unique au Yunnan, mêlant les traditions indiennes du Vajrayana aux pratiques spirituelles locales et à la dévotion à Avalokitesvara."
 nd_nzo_highland_warfare: "Guerre des Hautes Terres"
 nd_nzo_highland_warfare_desc: "Les guerriers Nanzhao ont exploité le terrain accidenté du Yunnan (cols de montagne, vallées de jungle et gorges fluviales) pour vaincre des armées plusieurs fois supérieures à leur taille."
 nd_nzo_bai_weaving: "Tradition du tissage Bai"
 nd_nzo_bai_weaving_desc: "Le peuple Bai a développé des techniques distinctives de teinture par nœuds pour les tissus en coton et en soie, créant ainsi des motifs qui sont devenus célèbres dans toute la région."
 nd_nzo_elephant_warfare: "Guerre des éléphants"
 nd_nzo_elephant_warfare_desc: "Les chefs de Nanzhao chevauchaient des éléphants de guerre au combat. L'armure laquée en peau d'éléphant du royaume était appréciée dans toute la région comme étant presque imperméable aux flèches."
 nd_nzo_zhunu_crossbows: "Gardes d'arbalète Zhunu"
 nd_nzo_zhunu_crossbows_desc: "Les unités de garde Red Crossbow, Zhunu, brandissaient de puissantes arbalètes montées qui pouvaient abattre la cavalerie à une distance extrême. Pendant les sièges, les tirs d'arbalètes depuis les murs abattaient des centaines d'assaillants."
 nd_nzo_tianbao_war_legacy: "L'héritage de la guerre de Tianbao"
 nd_nzo_tianbao_war_legacy_desc: "La victoire décisive sur l'invasion Tang de 751 prouva que Nanzhao pouvait s'opposer à l'empire le plus puissant du monde. Cet héritage de défi définit l'identité du royaume."
 nd_nzo_three_pagodas: "Trois pagodes de Chongsheng"
 nd_nzo_three_pagodas_desc: "La pagode Qianxun et le complexe du temple Chongsheng, avec 890 salles et 11 400 statues de Bouddha, représentaient le summum de la réussite spirituelle et architecturale de Nanzhao."
 nd_nzo_copper_mining: "Extraction de cuivre du Yunnan"
 nd_nzo_copper_mining_desc: "Le Yunnan possédait les plus grandes réserves de cuivre de Chine. L'extraction et la fusion du cuivre constituaient une industrie majeure, produisant des matières premières pour les pièces de monnaie, les armes et les objets de cérémonie."
 nd_nzo_imperial_court: "Culture de la cour impériale"
 nd_nzo_imperial_court_desc: "Lorsque le roi Shilong s'est proclamé empereur et a réorienté le royaume autour du bouddhisme, il a établi une culture de cour mêlant la sophistication Tang aux traditions Bai."
 nd_nzo_pyu_conquest: "Conquête des Pyu"
 nd_nzo_pyu_conquest_desc: "Dans les années 830, Nanzhao a décimé les anciennes cités-États Pyu de la vallée de l'Irrawaddy, capturant des artisans, des érudits et des musiciens qui ont enrichi la culture du royaume."
 nd_nzo_meng_cavalry_tradition: "Tradition de la cavalerie Meng"
 nd_nzo_meng_cavalry_tradition_desc: "Le clan Mengshe, dont descendaient les dirigeants de Nanzhao, élevait des chevaux des hautes terres et entraînait une cavalerie habile à la guerre en montagne et aux manœuvres de flanc rapides."
 nd_nzo_tea_horse_road: "Route du thé et du cheval"
 nd_nzo_tea_horse_road_desc: "L'ancienne route des caravanes transportant le thé Pu'er jusqu'au Tibet et ramenant les chevaux est devenue l'une des grandes artères commerciales d'Asie, avec le Yunnan comme plaque tournante incontournable."
 nd_nzo_lacquered_armor_tradition: "Tradition d'armure laquée"
 nd_nzo_lacquered_armor_tradition_desc: "Dali a produit certaines des plus belles armures en cuir laqué d'Asie, fabriquées à partir de peau d'éléphant et traitées jusqu'à ce qu'elles soient presque aussi dures que le fer. Les ensembles étaient envoyés à la cour Song comme cadeaux diplomatiques."
 nd_nzo_yunnan_silversmithing: "Orfèvrerie du Yunnan"
 nd_nzo_yunnan_silversmithing_desc: "Les mines d'argent du Yunnan et sa tradition de travail en filigrane complexe ont produit des bijoux et des objets de cérémonie prisés dans toute la région."
 nd_nzo_bai_literary_tradition: "Tradition littéraire Bai"
 nd_nzo_bai_literary_tradition_desc: "La poésie et la prose Bai, influencées par la tradition littéraire chinoise mais écrites en langue Bai, ont atteint des sommets remarquables au cours de la période Dali."
 nd_nzo_highland_fortification: "Fortification des Hautes Terres"
 nd_nzo_highland_fortification_desc: "Les forteresses de montagne de Nanzhao exploitaient le terrain naturel (cols étroits, falaises abruptes et gorges fluviales) pour créer des positions défensives qui multipliaient l'avantage des défenseurs."
 nd_nzo_dali_marble_craft: "Artisanat en marbre de Dali"
 nd_nzo_dali_marble_craft_desc: "Le marbre distinctif extrait près de Dali, avec ses motifs naturels uniques, était prisé pour la construction et à des fins artistiques dans tout le sud de la Chine."
 nd_nzo_standing_army_reform: "Réforme de l'armée permanente"
 nd_nzo_standing_army_reform_desc: "À son apogée, Nanzhao maintenait une armée permanente de 100 000 soldats expérimentés sous une loi militaire stricte : une réalisation remarquable pour un royaume des hautes terres."
 nd_nzo_salt_monopoly: "Monopole du sel"
 nd_nzo_salt_monopoly_desc: "Le contrôle de la Couronne sur les puits de sel du Yunnan fournissait une source de revenus fiable qui finançait à la fois la cour et l'armée."
 nd_nzo_multi_ethnic_governance: "Gouvernance multiethnique"
 nd_nzo_multi_ethnic_governance_desc: "La population diversifiée du Yunnan (Bai, Yi, Tai, Tibétains et autres) nécessitait une gouvernance flexible qui s'adaptait aux différentes coutumes tout en maintenant l'autorité centrale."
 nd_nzo_puer_tea_mastery: "Maîtrise du thé Pu'er"
 nd_nzo_puer_tea_mastery_desc: "Le thé Pu'er du Yunnan, vieilli et compressé en briques pour être transporté sur la route du thé et du cheval, est devenu l'un des produits commerciaux les plus précieux d'Asie."
 nd_nzo_avalokitesvara_devotion: "Dévotion à Avalokiteshvara"
 nd_nzo_avalokitesvara_devotion_desc: "Devotion to Avalokitesvara (Guanyin, the Goddess of Mercy) was central to Azhali Buddhism. The state religion unified the diverse peoples of Yunnan under a shared spiritual identity, and gilt bronze images of the Acuoye Guanyin were cast for its altars."
 nd_nzo_mountain_pass_control: "Contrôle des cols de montagne"
 nd_nzo_mountain_pass_control_desc: "Les cols montagneux du Yunnan étaient des points d'étranglement naturels pour les armées et le commerce. Les contrôler signifiait contrôler l’accès à toute la frontière sud-ouest."
 nd_nzo_lacquer_guard_tradition: "Tradition de garde de laque"
 nd_nzo_lacquer_guard_tradition_desc: "Les troupes d'élite vêtues de la célèbre armure laquée en peau d'éléphant représentaient le summum du savoir-faire militaire de Nanzhao, des guerriers aussi endurcis que l'armure qu'ils portaient."
 nd_nzo_centralized_administration: "Administration centralisée"
 nd_nzo_centralized_administration_desc: "La couronne a consolidé son contrôle sur les diverses provinces du Yunnan, remplaçant la confédération lâche du début par un appareil bureaucratique plus centralisé."
 nd_nzo_yunnan_mining_boom: "Boom minier du Yunnan"
 nd_nzo_yunnan_mining_boom_desc: "Les vastes gisements d'argent et de cuivre du Yunnan ont alimenté un boom économique. La production d'argent de la province contribuerait à terme à hauteur de plusieurs millions de taels à la production nationale de la Chine."
 nd_nzo_tea_trade_expansion: "Expansion du commerce du thé"
 nd_nzo_tea_trade_expansion_desc: "À mesure que la demande pour le thé du Yunnan se répandait à travers l'Asie, le réseau de routes caravanières s'étendait, reliant des marchés de plus en plus éloignés aux entrepôts de thé Pu'er."
 nd_nzo_highland_defense_doctrine: "Doctrine de défense des Highlands"
 nd_nzo_highland_defense_doctrine_desc: "Des siècles de guerre dans les hautes terres se sont cristallisés en une doctrine formelle : utilisez le terrain, harcelez les lignes de ravitaillement, évitez les batailles rangées en terrain découvert et laissez les montagnes se battre pour vous."
 nd_nzo_bai_artistic_renaissance: "Renaissance artistique Bai"
 nd_nzo_bai_artistic_renaissance_desc: "Sous le patronage centralisé, les artistes Bai ont atteint de nouveaux sommets dans la peinture, la sculpture, la ferronnerie et l'architecture, synthétisant les influences de la Chine, du Tibet et de l'Asie du Sud-Est."
 nd_nzo_modern_governance: "Gouvernance moderne"
 nd_nzo_modern_governance_desc: "Les institutions traditionnelles du Yunnan sont réformées pour relever les défis d'un monde en évolution, en équilibrant l'héritage du système des castes Mywa avec l'efficacité administrative moderne."
 nd_nzo_industrial_mining: "Exploitation minière industrielle"
 nd_nzo_industrial_mining_desc: "Les techniques modernes transforment l'ancienne industrie minière du Yunnan, augmentant considérablement la production de cuivre, d'argent, d'étain et de plomb."
 nd_nzo_bai_scholarship: "Bourse Bai"
 nd_nzo_bai_scholarship_desc: "Une nouvelle génération d'érudits Bai combine les traditions littéraires de leurs ancêtres avec les méthodes d'enquête modernes, produisant des œuvres d'une importance durable."
 nd_nzo_commercial_modernization: "Modernisation commerciale"
 nd_nzo_commercial_modernization_desc: "Les anciennes routes caravanières sont modernisées avec de meilleures routes, des poids et mesures standardisés et des traités commerciaux formels."
 nd_nzo_modern_military: "Militaire moderne"
 nd_nzo_modern_military_desc: "Les traditions de défense des Highlands sont complétées par des exercices, une organisation et des tactiques modernes, créant une armée qui combine l'expertise de la montagne avec la discipline contemporaine."
 nd_nzo_national_identity: "Identité nationale de Nanzhao"
 nd_nzo_national_identity_desc: "Les divers peuples du Yunnan forgent une conscience nationale partagée, en s'appuyant sur l'héritage des six zhaos unis, des Trois Pagodes et de la Route du Thé et du Cheval."
 a_nd_nzo_luojuzi: "Luojuzi"
 a_nd_nzo_luojuzi_desc: "Les Tiger Sons, l'avant-garde d'élite de Nanzhao. Choisis parmi cent soldats, ils portent des casques rouges, des armures de cuir et des boucliers de bronze, combattant pieds nus pour la vitesse."
 a_nd_nzo_wuman_warrior: "Wuman Warriors"
 a_nd_nzo_wuman_warrior_desc: "Clan fighters of the Black Mywa, the hill peoples east of Dali whom the Chinese called Wuman. They come down from their ridges in felt cloaks and lacquered leather under their own chiefs, strike from ambush with spear and crossbow, and go home when the chief who led them falls."
 a_nd_nzo_war_elephant: "Éléphant de guerre de Nanzhao"
 a_nd_nzo_war_elephant_desc: "Les chefs montaient au combat sur des éléphants blindés, leurs bardes laquées en peau d'éléphant détournant les flèches et les lances. L’impact psychologique à lui seul a été dévastateur."
 a_nd_nzo_crossbow_guard: "Garde d'arbalète Zhunu"
 a_nd_nzo_crossbow_guard_desc: "Les gardes de l'Arbalète Rouge, armés de puissantes arbalètes montées, excellaient à la fois dans les combats sur le terrain et dans la défense de siège dans les montagnes du Yunnan."
 a_nd_nzo_meng_cavalry: "Cavalerie Meng"
 a_nd_nzo_meng_cavalry_desc: "Cavaliers des Highlands du clan dirigeant Mengshe, entraînés à la guerre en montagne. Des flancs rapides qui exploitent le terrain qui paralyse la cavalerie plus lourde."
 a_nd_nzo_yunnan_garrison: "Infanterie de la garnison du Yunnan"
 a_nd_nzo_yunnan_garrison_desc: "Soldats professionnels de l'armée permanente de Nanzhao, équipés et entraînés selon la stricte loi militaire. Des combattants de montagne robustes qui résistent à toute agression."
 a_nd_nzo_lacquer_guard: "Garde Laque Dali"
 a_nd_nzo_lacquer_guard_desc: "Infanterie d'élite vêtue de la célèbre armure laquée en peau d'éléphant, presque aussi dure que le fer, mais plus légère et plus flexible. Les meilleurs soldats du Yunnan."
 nd_nzo_salt_wells: "Puits de sel"
 nd_nzo_salt_wells_desc: "Installations d'extraction des abondants gisements de sel du Yunnan, une source de revenus cruciale contrôlée par la couronne depuis l'époque des premiers rois Nanzhao."
 nd_nzo_chongsheng_monastery: "Monastère de Chongsheng"
 nd_nzo_chongsheng_monastery_desc: "Un grand complexe de temples bouddhistes inspiré du temple historique de Chongsheng avec ses trois pagodes : le cœur spirituel des royaumes de Nanzhao et de Dali."
 nd_nzo_copper_smelter: "Fonderie de cuivre"
 nd_nzo_copper_smelter_desc: "Des installations d'extraction et de fusion des vastes gisements de cuivre du Yunnan : les plus grandes réserves de Chine, alimentant une demande insatiable de monnaie et d'armes."
 nd_nzo_silver_workshop: "Atelier Argent"
 nd_nzo_silver_workshop_desc: "Un atelier artisanal Bai spécialisé dans les bijoux complexes en filigrane d'argent : une tradition artisanale qui a rendu Dali célèbre dans tout le Yunnan et au-delà."
 nd_nzo_workshop_upkeep: "Argenterie de base"
 nd_nzo_workshop_upkeep_desc: "Objets simples en argent fabriqués par des artisans Bai à l'aide de fours à charbon et de techniques de martelage traditionnelles."
 nd_nzo_tiedye_workshop: "Bai Tie-Dye Workshop"
 nd_nzo_tiedye_workshop_desc: "A workshop of the Bai towns around Lake Erhai, where plain cloth is bound, dyed in indigo, and sold as patterned cloth far beyond Yunnan. It is found where the Bai are the people of the place."
 nd_nzo_marble_quarry: "Cangshan Marble Quarry"
 nd_nzo_marble_quarry_desc: "A quarry in marble country, like those on the slopes of the Cangshan range above Dali. Its stone carries veins that read as mountains and clouds, and is sought for building and for the slabs set into screens and furniture."
 nd_nzo_tea_mountain: "Tea Mountain Garden"
 nd_nzo_tea_mountain_desc: "A hillside of old tea trees in tea country, like the six tea mountains beyond the Lancang. The leaf is pressed into bricks and cakes on the spot and carried north with the caravans."
 nd_nzo_caravanserai: "Caravansérail"
 nd_nzo_caravanserai_desc: "Haltes de repos et postes de traite le long de la route du thé et du cheval et de la route méridionale de la soie, où les marchands de Chine, du Tibet, de Birmanie et d'Inde échangent des marchandises et des informations."
 nd_nzo_lacquer_armory: "Armurerie de laque"
 nd_nzo_lacquer_armory_desc: "Ateliers produisant la célèbre armure laquée Dali en peau d'éléphant : traitée et durcie jusqu'à ce qu'elle soit presque aussi résistante que le fer, mais pourtant plus légère et plus flexible."
 nd_nzo_dragon_pass_fort: "Dragon Pass Fort"
 nd_nzo_dragon_pass_fort_desc: "A wall and gate thrown across a mountain defile, after the Dragon Head and Dragon Tail passes that closed the Dali plain between the Cangshan range and Lake Erhai. An army that cannot force the gate must find another way over the mountain."
 nd_nzo_puer_warehouse: "Entrepôt de thé Pu'er"
 nd_nzo_puer_warehouse_desc: "Installations de stockage pour le vieillissement et la compression du précieux thé Pu'er du Yunnan en briques pour le transport le long de la Tea Horse Road."
 nd_nzo_azhali_temple: "Temple d'Azhali"
 nd_nzo_azhali_temple_desc: "Un temple de l'école bouddhiste tantrique Azhali unique au Yunnan, consacré à Avalokitesvara et au Grand Deva Noir."
 nd_nzo_salt_processing_pm: "Faire bouillir le sel"
 nd_nzo_salt_processing_pm_desc: "La saumure des puits de sel est bouillie au feu de bois dans des casseroles d'évaporation en argile pour produire des cristaux de sel."
 nd_nzo_monastery_maintenance: "Entretien monastique"
 nd_nzo_monastery_maintenance_desc: "L’entretien du complexe du temple nécessite un approvisionnement constant en pierre de taille, en bois, en bougies en cire d’abeille et en papier pour les écritures."
 nd_nzo_smelting_pm: "Fusion du cuivre"
 nd_nzo_smelting_pm_desc: "Le minerai de cuivre brut est fondu dans des fours à charbon de bois revêtus de pierre selon la méthode traditionnelle du Yunnan."
 nd_nzo_caravan_supply_pm: "Approvisionnement des caravanes"
 nd_nzo_caravan_supply_pm_desc: "Fournir des bêtes de somme, du fourrage céréalier, des rations de sel et des selleries en cuir aux caravanes marchandes traversant les cols."
 nd_nzo_lacquer_workshop_pm: "Armure en laque"
 nd_nzo_lacquer_workshop_pm_desc: "La peau d'éléphant est découpée, tannée avec des teintures et de la laque, puis durcie pour former des plaques d'armure adaptées aux armes à pointe de bronze."
 nd_nzo_pass_garrison_pm: "Pass Garrison"
 nd_nzo_pass_garrison_pm_desc: "Stone for the wall, timber for the gate and the watchtowers, and arms for the men who hold them."
 nd_nzo_tea_aging_pm: "Vieillissement du thé"
 nd_nzo_tea_aging_pm_desc: "Les feuilles de thé Pu'er sont pressées en briques à l'aide d'outils en bois, stockées dans des pots en poterie et vieillies pour développer leur saveur distinctive."
 nd_nzo_temple_offerings_pm: "Offrandes au temple"
 nd_nzo_temple_offerings_pm_desc: "De l'encens, des bougies en cire d'abeille et des pansements d'autel en tissu fin soutiennent les rituels et les cérémonies quotidiennes du culte bouddhiste Azhali."
 nd_nzo_bai_tiedye_pm: "Tie-Dye Bai"
 nd_nzo_bai_tiedye_pm_desc: "Cloth is bound tight with thread, dipped in the indigo vat, and untied into white patterns on blue, a craft passed down through generations of Bai households."
 nd_nzo_silver_filigree_pm: "Filigrane d'argent"
 nd_nzo_silver_filigree_pm_desc: "Les maîtres orfèvres créent des bijoux en filigrane complexes et des objets de cérémonie, transformant l'argent abondant du Yunnan en œuvres d'art prisées."
 nd_nzo_marble_working_pm: "Travail du marbre Dali"
 nd_nzo_marble_working_pm_desc: "The veined marble of the Cangshan range is cut with iron tools and timber scaffolding, then polished into building stone and picture slabs."
 levy_nd_nzo_luojuzi: "Prélèvement de Luojuzi"
 levy_nd_nzo_luojuzi_desc: "Des Fils Tigre issus de l'armée ordinaire : le plus fort sur cent."
 levy_nd_nzo_wuman_warriors: "Wuman Warriors Levy"
 levy_nd_nzo_wuman_warriors_desc: "Clan bands called out from the Yi hill country by their own chiefs."
 levy_nd_nzo_meng_cavalry: "Prélèvement de cavalerie Meng"
 levy_nd_nzo_meng_cavalry_desc: "Cavaliers des Highlands issus de la classe de guerriers nobles du clan dirigeant Mengshe."
 nd_nzo_crown_salt_pm: "Administration du sel de la couronne"
 nd_nzo_crown_salt_pm_desc: "Production de sel contrôlée par l'État, utilisant des méthodes d'ébullition intensives et des bassins d'évaporation en argile, un monopole royal qui finance à la fois la cour et l'armée."
 nd_nzo_guanyin_casting_pm: "Acuoye Guanyin Casting"
 nd_nzo_guanyin_casting_pm_desc: "Slender images of the Acuoye Guanyin are cast in bronze by the lost-wax method and gilded, for the altars of temples and households alike."
 nd_nzo_tea_brick_pm: "Traitement des briques de thé"
 nd_nzo_tea_brick_pm_desc: "Tea leaves are picked from the old groves, steamed, compressed into bricks using wooden presses, and wrapped in paper for the caravans of the Tea Horse Road."
 nd_nzo_formed_tt: "Nanzhao a été formé"
 nd_nzo_path_a_tt: "Choisissez la bannière du tigre du Mywa noir"
 nd_nzo_path_b_tt: "Choisissez la Route de la Soie du Sud"
 nd_nzo_destiny: "Destin de Nanzhao"
 nd_nzo_destiny_desc: "Le royaume renaît, mais son destin n’est pas encore écrit. Stabilisez le royaume et choisissez la voie qui définira Nanzhao pour des générations."
 nd_nzo_dest_shan_conquest: "Conquête des États Shan"
 nd_nzo_dest_shan_conquest_desc: "Les hauts plateaux Shan à l’est du Yunnan sont fragmentés entre de petits dirigeants. Pour étendre la portée de la Bannière du Tigre, placez Kengtung et Hsenwi sous la domination de Nanzhao et levez une armée digne du Black Mywa."
 nd_nzo_dest_irrawaddy_empire: "Empire de l'Irrawaddy"
 nd_nzo_dest_irrawaddy_empire_desc: "The ancient Pyu cities of the Irrawaddy valley once fell to Nanzhao's armies. Repeat that feat by conquering Pagan and Thaton and holding half of the Irrawaddy valley, building an empire that stretches from Yunnan's highlands to the sea."
 nd_nzo_dest_irrawady_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in the Irrawady area"
 nd_nzo_dest_taihe_developed_tt: "We own #bold Tàihé#! and its development is at least #bold 54#!"
 nd_nzo_dest_tiger_empire: "L'Empire du Tigre"
 nd_nzo_dest_tiger_empire_desc: "La vision ultime du Black Mywa : un empire qui domine à la fois le bassin fertile du Sichuan et les basses terres de l'Irrawaddy. Prenez Chengdu et Sagaing pour commander les deux grands systèmes fluviaux du continent."
 nd_nzo_dest_tea_horse_dominion: "Domination du cheval de thé"
 nd_nzo_dest_tea_horse_dominion_desc: "La route du thé et des chevaux relie le Yunnan au Tibet, transportant le thé Pu'er au nord et les chevaux au sud. Étendez la portée commerciale de Nanzhao jusqu'à Lhassa même et amassez un trésor digne de la Route de la Soie du Sud."
 nd_nzo_dest_crossroads_of_asia: "Carrefour de l'Asie"
 nd_nzo_dest_crossroads_of_asia_desc: "Le Yunnan se situe au point de rencontre des civilisations chinoise, indienne, tibétaine et d’Asie du Sud-Est. Étendez le réseau commercial jusqu'à Angkor, adoptez le système bancaire moderne et transformez le royaume en carrefour commercial de l'Asie."
 nd_nzo_dest_emporium_of_asia: "Magasin d'Asie"
 nd_nzo_dest_emporium_of_asia_desc: "From Vientiane to Guangzhou, the Southern Silk Road links the Indian Ocean to the South China Sea. Control both endpoints, build up Tàihé, the capital on Lake Erhai, to 54 development, and build the greatest trading empire mainland Asia has ever seen."
 nd_nzo.6.t: "Le destin de Nanzhao"
 nd_nzo.6.d: "Le royaume est restauré, son peuple uni sous l’ancienne bannière. Les fondations sont posées, la question est maintenant de savoir sur quoi nous allons bâtir dessus. Les guerriers Black Mywa aiguisent leurs lames tandis que les marchands Bai comptent leur argent. Les deux chemins mènent à la gloire, mais de manières très différentes."
 nd_nzo.6.a: "Notre destin commence maintenant."
 nd_nzo.7.t: "Les États Shan"
 nd_nzo.7.d: "The fragmented Shan principalities have been brought to heel. From Kengtung's valleys to Hsenwi's highlands, the Tiger Banner now flies where once a dozen petty lords squabbled over scraps. The Shan chiefs kneel before the throne of Nanzhao, and their warriors swell our ranks.\n\nThis is only the beginning. The Irrawaddy valley beckons to the south: the ancient road to empire that our ancestors walked when they destroyed the Pyu and shook the foundations of the world."
 nd_nzo.7.a: "Les Shan s'inclinent devant la bannière du Tigre."
 nd_nzo.8.t: "La bannière du tigre sur la Birmanie"
 nd_nzo.8.d: "Pagan has fallen. Thaton has fallen. The great cities of the Irrawaddy valley, which once belonged to the Pyu before our ancestors razed them, are ours again. The ghost of King Quan Fengyou smiles from the heavens as the Tiger Banner is planted on the banks of the river that feeds Burma.\n\nAn empire now stretches from the highlands of Yunnan to the lowlands of the Irrawaddy delta. But empires must be governed as well as conquered. How shall we consolidate these vast new territories?"
 nd_nzo.8.a: "Avancez : les Tiger Sons ne s’arrêtent pour rien."
 nd_nzo.8.b: "Fortifiez ce que nous détenons et construisons notre force."
 nd_nzo.9.t: "L'Empire du Tigre"
 nd_nzo.9.d: "Chengdu and Sagaing stand under the Tiger Banner. The fertile Sichuan basin, breadbasket of China, feeds our coffers, while the Irrawaddy lowlands secure our dominion over mainland Southeast Asia. No highland kingdom in history has achieved what Nanzhao has built: an empire spanning the two great river systems of the Asian mainland.\n\nThe Black Mywa dreamed of this for generations. Now we must decide the character of the empire we have forged. Shall the sword remain our instrument, or shall the institutions of governance temper the blade?"
 nd_nzo.9.a: "L'épée a bâti cet empire : l'épée le soutiendra."
 nd_nzo.9.b: "L’empire nécessite une gouvernance, pas seulement une conquête."
 nd_nzo.10.t: "La route du thé et du cheval est à nous"
 nd_nzo.10.d: "Lhasa, the rooftop of the world, now trades through our hands. The Tea Horse Road, that ancient artery carrying Pu'er tea to Tibet and returning horses and silver, belongs entirely to Nanzhao. From the tea gardens of Simao to the monasteries of central Tibet, every brick of compressed tea and every Tibetan pony passes through our territory.\n\nThe caravansaries are full, the toll houses overflow, and the Bai merchants smile as they count the profits of geography made manifest."
 nd_nzo.10.a: "Les caravanes nous apporteront les richesses du monde."
 nd_nzo.11.t: "Carrefour de l'Asie"
 nd_nzo.11.d: "What began as a mountain kingdom's control of a few caravan routes has become something extraordinary. Nanzhao's trade network now stretches from the tea gardens of Yunnan to the temples of Angkor. Chinese silk, Tibetan silver, Burmese gems, and Khmer spices all pass through our markets.\n\nBai merchants handle commerce in a dozen languages. The banking houses of the capital hold deposits from traders across the continent. Yunnan has become what geography always intended: the crossroads of Asia."
 nd_nzo.11.a: "Étendre le réseau : plus de commerçants, plus de routes."
 nd_nzo.11.b: "Investissez dans nos artisans et intégrez nos peuples."
 nd_nzo.12.t: "Magasin d'Asie"
 nd_nzo.12.d: "From Vientiane to Guangzhou, the Southern Silk Road is ours. The greatest commercial artery of mainland Asia, connecting the Indian Ocean trade to the South China Sea, runs through Nanzhao's territory. No merchant crosses our borders without leaving silver behind.\n\nThe Bai trading diaspora spans the continent. Our markets set prices that merchants in Canton and Calcutta must accept. The kingdom that began as six highland chieftains has become the commercial heart of Asia."
 nd_nzo.12.a: "Que toutes les nations viennent commercer sur nos marchés."
 nd_nzo.12.b: "Les marchands partageront le pouvoir avec le trône."
 STATIC_MODIFIER_NAME_nd_nzo_dest_tiger_march: "Marche du Tigre"
 STATIC_MODIFIER_DESC_nd_nzo_dest_tiger_march: "Les Tiger Sons mènent l’armée en avant sans pause. Les ennemis se soumettent ou sont balayés. Le rythme de la conquête met à rude épreuve le trésor et le peuple, mais les Black Mywa ne connaissent pas d'autre solution."
 STATIC_MODIFIER_NAME_nd_nzo_dest_highland_consolidation: "Consolidation des hautes terres"
 STATIC_MODIFIER_DESC_nd_nzo_dest_highland_consolidation: "L'empire fait une pause pour digérer ses conquêtes. Les renforts affluent, des garnisons sont établies et des mercenaires complètent l'armée tandis que le noyau des hautes terres se rétablit."
 STATIC_MODIFIER_NAME_nd_nzo_dest_sword_emperor: "Empereur de l'épée"
 STATIC_MODIFIER_DESC_nd_nzo_dest_sword_emperor: "L'empereur gouverne par l'épée et par l'intermédiaire de la noblesse guerrière. Les levées nobles gonflent l'armée et de nouvelles armes de guerre tonnent sur le champ de bataille, même si le coût d'une expansion sans fin met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_nzo_dest_highland_mandate: "Mandat des Highlands"
 STATIC_MODIFIER_DESC_nd_nzo_dest_highland_mandate: "L’empire adopte les atours d’une gouvernance légitime. Le roi guerrier devient un empereur doté d’un mandat, reconnu et craint par toutes les grandes puissances du monde."
 STATIC_MODIFIER_NAME_nd_nzo_dest_merchant_network: "Réseau marchand"
 STATIC_MODIFIER_DESC_nd_nzo_dest_merchant_network: "Les marchands Bai se répartissent à travers le continent, établissant des postes commerciaux et des relations diplomatiques. Chaque nouvelle route entraîne de nouveaux partenariats, et l'influence du Yunnan s'étend à travers l'argent plutôt que l'acier."
 STATIC_MODIFIER_NAME_nd_nzo_dest_artisan_guilds: "Guildes d'artisans"
 STATIC_MODIFIER_DESC_nd_nzo_dest_artisan_guilds: "Le royaume investit dans la diversité de sa population. Orfèvres Bai, tisserands Yi, potiers Tai : tous trouvent leur place dans des guildes prospères qui renforcent le tissu social tout en enrichissant le trésor."
 STATIC_MODIFIER_NAME_nd_nzo_dest_world_emporium: "Magasin mondial"
 STATIC_MODIFIER_DESC_nd_nzo_dest_world_emporium: "Les marchés de Nanzhao accueillent des commerçants de toutes nations et de toutes confessions. Les monastères bouddhistes bénissent le commerce, les compagnies mercenaires protègent les routes et les explorateurs du royaume recherchent des partenaires toujours plus lointains."
 STATIC_MODIFIER_NAME_nd_nzo_dest_merchant_kings: "Rois marchands"
 STATIC_MODIFIER_DESC_nd_nzo_dest_merchant_kings: "La vieille noblesse guerrière cède la place à une nouvelle aristocratie marchande. La richesse des bourgeois et le pouvoir des guildes remodèlent les institutions du royaume, le clergé du temple servant d'intermédiaire entre la couronne et le commerce."
 nd_nzo_imperial_war_camp: "Camp de guerre impérial"
 nd_nzo_imperial_war_camp_desc: "Un poste de commandement fortifié pour coordonner les campagnes à travers le vaste Empire du Tigre, combinant la conception d'une forteresse des hautes terres avec la logistique nécessaire pour projeter la puissance du Yunnan au Sichuan et à l'Irrawaddy."
 nd_nzo_war_camp_maintenance: "Opérations des camps de guerre"
 nd_nzo_war_camp_maintenance_desc: "Le maintien du camp de guerre impérial nécessite un approvisionnement constant en armes, chevaux de guerre, bois pour les fortifications et cuir pour l'équipement."
 nd_nzo_crossroads_emporium: "Carrefour Emporium"
 nd_nzo_crossroads_emporium_desc: "Une grande salle commerciale où les marchands de Chine, du Tibet, de Birmanie, d'Inde et d'Asie du Sud-Est convergent pour échanger des marchandises sous la protection et le profit de Nanzhao."
 nd_nzo_emporium_maintenance: "Opérations du magasin"
 nd_nzo_emporium_maintenance_desc: "Le fonctionnement du grand magasin nécessite du tissu pour les étals du marché, du papier pour les registres et les contrats, du thé pour les commerçants et des outils pour peser et mesurer."

 qingping_council_bureaucracy: "Conseil de Qingping"
 qingping_council_bureaucracy_desc: "Les qingping guan (six ministres en chef issus des clans dirigeants de la confédération des Six Zhao) formaient le cabinet consultatif suprême des rois de Nanzhao, calqué sur la pratique de la chancellerie Tang mais adapté aux réalités aristocratiques des hauts plateaux. Le conseil délibéra sur la guerre, la fiscalité et les ambassades, tout en excluant jalousement les marchands et les étrangers du processus décisionnel central. Sa force résidait dans la légitimation des décrets royaux par le consensus aristocratique; sa faiblesse, en ralentissant la propagation du contrôle de la couronne dans les basses terres et les maisons de comptage."

 acharya_master_state_bureaucracy: "État-maître Acharya"
 acharya_master_state_bureaucracy_desc: "Les maîtres bouddhistes tantriques Azhali (???) ont servi le royaume de Dali de 937 à 1253 non seulement en tant qu'officiants rituels, mais aussi en tant que scribes, archivistes et commis de chancellerie au sein de l'administration royale. Leur autorité découlait des lignées maître-disciple plutôt que de la naissance, brisant le monopole des vieux clans aristocratiques sur les fonctions alphabétisées. Un État Acharya maintenu diffuse l'alphabétisation et intègre les peuples conquis par le biais de rituels partagés ; négligé, il ne fait que consolider un clergé qui a remplacé les nobles sans gouverner à leur place."

 tusi_chieftaincy_bureaucracy: "Système de chefferie Tusi"
 tusi_chieftaincy_bureaucracy_desc: "Le cadre tusi (??), formalisé sous les Yuan et intensifié par les Ming, reconnaissait les chefs indigènes héréditaires des peuples Yi, Bai, Hmong et Tai comme administrateurs locaux du royaume en échange d'hommages et de prélèvements. Le système a levé de formidables armées des hautes terres et pacifié les frontières à moindre coût, mais chaque génération d'héritage confirmé a endurci les chefs en un pouvoir parallèle que le trône ne pouvait pas démanteler en toute sécurité. Laisser le système se dégrader n’affaiblit pas les chefs : cela affame simplement les registres centraux qui les suivaient autrefois."

 chamasi_tea_horse_office_bureaucracy: "Bureau du Thé-Cheval (Chamasi)"
 chamasi_tea_horse_office_bureaucracy_desc: "De la fin des Tang jusqu'aux Ming, le chamasi (???) était un bureau monopolistique d'État réglementant le commerce transfrontalier du thé contre des chevaux le long de la route du thé et du cheval à travers le Yunnan. Les fonctionnaires taxaient les caravanes, fixaient les taux d'échange entre le thé en brique et les monts frontaliers et les maisons de marchands agréées, capturant pour le trône la richesse de l'un des circuits commerciaux les plus lucratifs de l'Asie médiévale. Un chamasi en activité transforme la Route de la Soie du Sud en une artère fiscale ; un pays délabré engendre des réseaux de contrebande, des raids aux frontières contre des caravanes mal gardées et des péages perdus."

 AUTO_MODIFIER_NAME_nd_nzo_bureaucracy_authority: "Bureau bureaucratique de Nanzhao"
 AUTO_MODIFIER_DESC_nd_nzo_bureaucracy_authority: "On formation, the kingdom is granted the framework of permanent administrative office. This opens two slots in which the ruler may install historical institutions of governance."
