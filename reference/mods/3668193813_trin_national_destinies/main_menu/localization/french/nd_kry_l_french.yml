l_french:
 STATIC_MODIFIER_NAME_nd_kry_mountain_wall: "Mur de montagne des Daylamites"
 STATIC_MODIFIER_DESC_nd_kry_mountain_wall: "Pendant des siècles, les guerriers de Daylam ont tenu les cols d'Albourz contre tous les empires qui cherchaient à les conquérir. Gilan perpétue cet héritage, ses armées étant entraînées aux tactiques du mur de boucliers et à la guerre au javelot qui ont fait craindre les Daylamites de Bagdad à Boukhara."
 STATIC_MODIFIER_NAME_nd_kry_caspian_silk_roads: "Les routes de la soie de la Caspienne"
 STATIC_MODIFIER_DESC_nd_kry_caspian_silk_roads: "Les mûriers et les ateliers de soie de Gilan produisent le fil le plus fin de toute l'Asie. Des bazars animés de Rasht au port d'Anzali, les richesses de la Caspienne s'écoulent vers l'extérieur, transportées par les marchands arméniens et grecs aux quatre coins du monde connu."
 STATIC_MODIFIER_NAME_nd_kry_mountain_independence: "Indépendance de la montagne"
 STATIC_MODIFIER_DESC_nd_kry_mountain_independence: "Sous la canopée des forêts d'Alborz, le peuple Gilani se souvient de ce que les grands empires ont appris : que certaines terres ne valent tout simplement pas le prix d'une conquête. Laissez venir les habitants des plaines : les montagnes les dévoreront comme elles l’ont toujours fait."
 STATIC_MODIFIER_NAME_nd_kry_silk_integration: "Intégration de la soie"
 STATIC_MODIFIER_DESC_nd_kry_silk_integration: "En intégrant les institutions et les marchés du monde entier, Gilan transforme sa richesse en soie en une modernisation durable. Ce que l’empire exige en obéissance, Gilan le rembourse au décuple en revenus. Et ce faisant, il acquiert son propre caractère indispensable."
 nd_kry.1.t: "La fondation de Gilan"
 nd_kry.1.d: "The green province of Gilan rises from the mist-shrouded forests of the Alborz, where the Caspian Sea crashes against shores lined with mulberry groves and rice paddies. For centuries, this land sheltered the Daylamite warriors who toppled caliphates and founded dynasties from their mountain strongholds. Now, united under a single banner, Gilan must choose its path: shall it embrace the fierce independence of its mountain heritage, raising armies from the highland villages that no conqueror could ever subdue? Or shall it harness the wealth of its legendary silk trade, turning the Caspian into a highway of commerce that binds distant markets to the loom-houses of Rasht and Lahijan?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_kry.1.a: "Nous sommes les héritiers de Daylam. Laissons parler nos montagnes"
 nd_kry.1.b: "La soie sera notre épée et la Caspienne notre domination"
 nd_kry.2.t: "L'héritage des guerriers Daylamites"
 nd_kry.2.d: "Dans les siècles qui ont précédé l’essor des dynasties turques, ce sont les hommes de Daylam qui détenaient l’équilibre du pouvoir dans le monde islamique. Armés de boucliers peints et du javelot zupin à deux pointes, ils formaient des murs de boucliers impénétrables dans les étroits cols de montagne de l'Alborz. Les émirs bouyides qui conquirent Bagdad en 945 étaient eux-mêmes des Daylamites, et leur infanterie resta le noyau d'élite de chaque armée perse pendant des générations. Aujourd'hui, alors que Gilan redécouvre cet héritage martial, les anciens terrains d'entraînement résonnent à nouveau du choc des boucliers contre les boucliers et du sifflement des javelots dans l'air des montagnes."
 nd_kry.2.a: "Le mur de bouclier tient."
 nd_kry.3.t: "La dynastie Karkiya"
 nd_kry.3.d: "Depuis leur capitale à Lahijan, nichée entre les forêts de la plaine côtière et les sommets de l'Alborz, la dynastie Karkiya a établi un État chiite zaydi pas comme les autres. Alors que de grands empires naissent et s'effondrent à travers la Perse, les Karkiya ont maintenu leur indépendance grâce à une diplomatie astucieuse, un terrain infranchissable et la loyauté de leurs sujets montagnards. Sous leur patronage, Lahijan est devenue un centre d'érudition et de jurisprudence islamique, ses madrasas attirant des étudiants du monde chiite alors même que ses bazars regorgent de fils de soie destinés à des marchés lointains."
 nd_kry.3.a: "Que les Karkiya règnent longtemps."
 nd_kry.4.t: "L'ombre safavide"
 nd_kry.4.d: "Le Shah safavide a tourné son regard vers Gilan. Ce que les Mongols, les Timurides et d’innombrables autres n’ont pas pu accomplir par la force, Shah Abbas Ier l’a réalisé grâce à un encerclement patient et à un pouvoir écrasant. En 1592, le dernier dirigeant de Karkiya fut déposé et Gilan fut absorbé par l'empire safavide. Mais il ne s'agit pas ici d'une simple histoire de conquête : le Shah convoite par-dessus tout la soie de Gilan et a fait de la province la pierre angulaire de son empire commercial. La question à laquelle Gilan est désormais confronté est de savoir s’il doit résister à cette transformation ou s’il doit saisir les opportunités qu’elle offre. Les montagnes offrent toujours un refuge à ceux qui veulent se battre, mais les ateliers de soie offrent un autre type de pouvoir."
 nd_kry.4.a: "Les montagnes nous ont déjà abrités : elles le seront encore"
 nd_kry.4.b: "Nous nous intégrerons au tissu de l'empire"
 nd_kry_daylami_heritage: "Patrimoine dailamite"
 nd_kry_daylami_heritage_desc: "Les traditions martiales des guerriers Daylamites qui conquirent Bagdad et fondèrent la dynastie Bouyide."
 nd_kry_shield_wall_tradition: "Tradition du mur de bouclier"
 nd_kry_shield_wall_tradition_desc: "La formation de combat Daylamite distinctive, utilisant de grands boucliers peints et des javelots zupin à deux dents pour créer une ligne défensive impénétrable."
 nd_kry_alborz_fortifications: "Fortifications de l'Albourz"
 nd_kry_alborz_fortifications_desc: "Les forteresses de montagne de la chaîne de l'Albourz, anciennes places fortes qui ont abrité l'indépendance de Gilan pendant des siècles."
 nd_kry_caspian_rice_paddies: "Rizières caspiennes"
 nd_kry_caspian_rice_paddies_desc: "Les rizières en terrasses des basses terres côtières du Gilan, alimentées par les pluies abondantes de la Caspienne."
 nd_kry_caspian_sericulture: "Sériciculture caspienne"
 nd_kry_caspian_sericulture_desc: "L'art ancien de la culture de la soie à Gilan, où les mûriers et les magnaneries parsèment le luxuriant paysage caspien."
 nd_kry_zaydi_refuge: "Refuge Zaydi"
 nd_kry_zaydi_refuge_desc: "Les montagnes de Gilan abritent les communautés chiites Zaydi depuis le IXe siècle, offrant un refuge contre la persécution abbasside et nourrissant une identité religieuse distinctive."
 nd_kry_karkiya_dynasty: "Dynastie Karkiya"
 nd_kry_karkiya_dynasty_desc: "La dynastie Zaydi Shi'a Karkiya qui a gouverné l'est de Gilan depuis Lahijan pendant plus de deux siècles, maintenant son indépendance par le terrain et la diplomatie."
 nd_kry_rasht_bazaar_tradition: "Tradition du bazar de Rasht"
 nd_kry_rasht_bazaar_tradition_desc: "Le grand bazar de Rasht, où la soie, le riz et les produits caspiens sont commercialisés depuis la fondation de la ville à l'époque sassanide."
 nd_kry_caspian_navigation: "Navigation caspienne"
 nd_kry_caspian_navigation_desc: "Les traditions maritimes des communautés côtières de Gilan, dont les boutres et les navires de commerce sillonnent la Caspienne d'Anzali à Bakou et au-delà."
 nd_kry_lahijan_madrasa: "Médersa Lahijan"
 nd_kry_lahijan_madrasa_desc: "Les madrasas et bibliothèques de Lahijan, centre d'apprentissage et de jurisprudence Zaydi sous le patronage de Karkiya."
 nd_kry_dual_dynasty_tolerance: "Tolérance de la double dynastie"
 nd_kry_dual_dynasty_tolerance_desc: "La coexistence de la dynastie sunnite Amira Dobbaj à l'ouest du Gilan et des chiites Karkiya à l'est, un exemple rare d'accommodement sectaire."
 nd_kry_highland_raiders: "Pillards des Highlands"
 nd_kry_highland_raiders_desc: "Cavalerie légère issue des vallées montagneuses boisées de Gilan, experte dans les attaques de flanc rapides à travers un terrain qui stopperait les cavaliers plus lourds."
 nd_kry_silk_monopoly: "Monopole de la soie"
 nd_kry_silk_monopoly_desc: "At its peak, Gilan produced nearly half of all Persian silk, making it the largest silk exporter in Asia and the envy of European merchants.\n\n#italic Available in: $nd_kry_abrisham_khaneh$#!"
 nd_kry_bandar_anzali: "Bandar-e Anzali"
 nd_kry_bandar_anzali_desc: "Le port d'Anzali, porte d'entrée de Gilan vers la mer Caspienne et principal canal d'exportation de soie vers la Russie, le Caucase et l'Asie centrale."
 nd_kry_caspian_war_fleet: "Flotte de guerre caspienne"
 nd_kry_caspian_war_fleet_desc: "Galères de guerre armées construites dans les ports de Gilan pour la défense des routes commerciales de la mer Caspienne et des eaux côtières."
 nd_kry_caspian_fisheries: "Pêcheries caspiennes"
 nd_kry_caspian_fisheries_desc: "Les riches pêcheries de la côte caspienne, récoltant l'esturgeon, le corégone et d'autres espèces pour nourrir la population croissante de Gilan."
 nd_kry_gilaki_literature: "Littérature Gilaki"
 nd_kry_gilaki_literature_desc: "La riche tradition littéraire de la langue Gilaki, une langue iranienne distincte préservant la poésie et les chroniques remontant à des siècles."
 nd_kry_merchant_networks: "Réseaux marchands"
 nd_kry_merchant_networks_desc: "Les communautés marchandes arméniennes et grecques qui géraient le commerce de la soie de Gilan, reliant la Caspienne aux marchés européens et ottomans."
 nd_kry_safavid_integration: "Intégration safavide"
 nd_kry_safavid_integration_desc: "La transformation de Gilan sous la domination safavide, alors que Shah Abbas Ier réorganisait la province pour maximiser les revenus de la soie pour le trésor impérial."
 nd_kry_state_silk_monopoly: "Monopole d'État de la soie"
 nd_kry_state_silk_monopoly_desc: "The Safavid crown's direct control over Gilan's silk trade, farming out exports through Armenian merchants to maximize royal income."
 nd_kry_tofangchi_tradition: "Tradition Tofangchi"
 nd_kry_tofangchi_tradition_desc: "Les mousquetaires Gilani tofangchi, recrutés dans les mêmes communautés montagnardes qui produisaient autrefois des guerriers javelot Daylamites."
 nd_kry_chaykhaneh_culture: "Culture Chaykhaneh"
 nd_kry_chaykhaneh_culture_desc: "L'introduction de la culture du thé dans le climat humide de Gilan et la diffusion des maisons de thé en tant que centres de vie sociale et intellectuelle."
 nd_kry_fortress_modernization: "Modernisation de la forteresse"
 nd_kry_fortress_modernization_desc: "Gilan's ancient mountain fortresses are refitted for firearms, and the villages that owe them castle guard now serve with the musket."
 nd_kry_rasht_expansion: "Expansion rapide"
 nd_kry_rasht_expansion_desc: "La croissance de Rasht pour devenir le centre urbain dominant de Gilan, sa population augmentant de travailleurs de la soie, de marchands et d'administrateurs."
 nd_kry_modern_sericulture: "Sériciculture moderne"
 nd_kry_modern_sericulture_desc: "The modernization of Gilan's silk industry: selected silkworm eggs, rearing sheds raised on posts above the damp ground, and mechanized looms."
 nd_kry_caspian_fleet: "Flotte caspienne"
 nd_kry_caspian_fleet_desc: "Une force navale modernisée capable de projeter la puissance Gilani à travers la mer Caspienne."
 nd_kry_provincial_governance: "Gouvernance provinciale"
 nd_kry_provincial_governance_desc: "Administration centralisée des diverses activités économiques de Gilan, de la production de soie à la culture du riz en passant par la pêche caspienne."
 nd_kry_rice_fish_economy: "Économie du riz et du poisson"
 nd_kry_rice_fish_economy_desc: "The diversified food economy of Gilan, combining irrigated rice paddies with the rich fisheries of the Caspian Sea.\n\n#italic Available in: $nd_kry_shilat_khaneh$#!"
 nd_kry_mountain_warfare: "Guerre en montagne"
 nd_kry_mountain_warfare_desc: "Des tactiques perfectionnées pour combattre dans les montagnes boisées de l'Alborz, combinant les méthodes traditionnelles Daylamites avec la discipline moderne."
 nd_kry_zaydi_scholarship: "Bourse Zaydi"
 nd_kry_zaydi_scholarship_desc: "The enduring scholarly traditions of Gilan's Zaydi community, contributing to Islamic jurisprudence and philosophy."
 nd_kry_industrial_silk: "Production industrielle de soie"
 nd_kry_industrial_silk_desc: "Factory-scale silk processing using modern techniques to meet growing global demand for Persian silk textiles.\n\n#italic Available in: $nd_kry_abrisham_khaneh$#!"
 nd_kry_anzali_modern_port: "Port moderne d'Anzali"
 nd_kry_anzali_modern_port_desc: "La transformation de Bandar-e Anzali en une installation portuaire moderne, gérant l'essentiel du commerce de la mer Caspienne."
 nd_kry_gilani_constitutionalism: "Constitutionnalisme Gilani"
 nd_kry_gilani_constitutionalism_desc: "La tradition de gouvernance indépendante de Gilan trouve une nouvelle expression dans le mouvement constitutionnel, alors que les commerçants et les universitaires plaident en faveur d'institutions représentatives."
 nd_kry_enlightened_province: "Province éclairée"
 nd_kry_enlightened_province_desc: "L'épanouissement de la pensée des Lumières à Gilan, nourrie par la longue tradition de tolérance intellectuelle et de rationalisme zaydi de la province."
 nd_kry_gilani_identity: "Identité Gilani"
 nd_kry_gilani_identity_desc: "Une conscience nationale mature, forgée à partir de l’héritage martial Daylamite, de l’identité religieuse Zaydi, de la particularité linguistique Gilaki et de siècles de prospérité financée par la soie."
 nd_kry_economic_diversification: "Diversification économique"
 nd_kry_economic_diversification_desc: "L'expansion de l'économie de Gilan au-delà de la soie vers le thé, le riz, la pêche et l'industrie manufacturière, renforçant ainsi la résilience face au déclin de n'importe quel produit de base."
 a_nd_kry_zupin_thrower: "Lanceurs Zupin"
 a_nd_kry_zupin_thrower_desc: "Tirailleurs de javelot d'élite armés du zupin à deux dents, l'arme emblématique des guerriers Daylamites. Rapides et mortels à distance, ils harcèlent les formations ennemies avant que le mur de bouclier ne se ferme."
 a_nd_kry_daylami_shieldwall: "Mur de bouclier dailamite"
 a_nd_kry_daylami_shieldwall_desc: "Infanterie lourde entraînée à l'ancien art daylamite du mur de boucliers. Armés de grands boucliers peints, de haches de combat et de javelots zupin, ils forment une ligne défensive impénétrable en terrain montagneux."
 n_nd_kry_caspian_dhow: "Boutre caspien"
 n_nd_kry_caspian_dhow_desc: "Un navire commercial robuste conçu pour la mer Caspienne, transportant des balles de soie Gilan d'Anzali vers les ports de Russie, du Caucase et de Transoxiane."
 a_nd_kry_mountain_raider: "Pillard des montagnes Gilani"
 a_nd_kry_mountain_raider_desc: "Cavalerie légère originaire des vallées montagneuses boisées de Gilan, experte dans les attaques de flanc rapides sur un terrain capable d'arrêter les cavaliers plus lourds. Ils sacrifient la durabilité du blindage au profit de la vitesse et de la maniabilité."
 a_nd_kry_tofangchi_gilani: "Tofangchi-ye Gilani"
 a_nd_kry_tofangchi_gilani_desc: "Mousquetaires Gilani recrutés dans les communautés montagnardes de l'Alborz. Héritant de la tradition daylamite d'infanterie disciplinée, ils manient les armes à feu avec la même ténacité que leurs ancêtres ont apportée aux zupin."
 n_nd_kry_caspian_war_galley: "Galère de guerre caspienne"
 n_nd_kry_caspian_war_galley_desc: "Une galère armée conçue pour les opérations dans les eaux fermées de la mer Caspienne, avec une coque renforcée et un armement plus lourd que les galères marchandes standards."
 nd_kry_abrisham_khaneh: "Abrisham Khaneh"
 nd_kry_abrisham_khaneh_desc: "Un atelier de soie où des artisans qualifiés élèvent des vers à soie sur des feuilles de mûrier et tissent le fil pour en faire des tissus fins. Les ateliers de soierie de Gilan sont à l'origine de son légendaire commerce d'exportation."
 nd_kry_qaleh_rudkhan: "Qaleh Rudkhan"
 nd_kry_qaleh_rudkhan_desc: "Une forteresse de montagne perchée au milieu des forêts denses de la chaîne d'Alborz, contrôlant les cols qui mènent au cœur de Gilan. Ces places fortes abritent l'indépendance de la province depuis l'Antiquité."
 nd_kry_bazaar_rasht: "Bazar-e Rasht"
 nd_kry_bazaar_rasht_desc: "Le grand marché couvert de Rasht, où convergent marchands de soie, commerçants de riz et pêcheurs caspiens. Les commerçants arméniens et grecs y maintiennent des quartiers permanents, reliant Gilan aux marchés mondiaux."
 nd_kry_madrasa_lahijan: "Madrasa-ye Lahijan"
 nd_kry_madrasa_lahijan_desc: "Un centre d'érudition Zaydi Shi'a dans la capitale Karkiya de Lahijan, enseignant la jurisprudence, la théologie et les sciences sous le patronage du clergé."
 nd_kry_chaykhaneh: "Chaykhaneh"
 nd_kry_chaykhaneh_desc: "Une maison de thé traditionnelle Gilani servant de lieu de rassemblement pour les marchands, les érudits et les gens ordinaires. Ces institutions sociales favorisent l'unité culturelle et la prospérité locale."
 nd_kry_shilat_khaneh: "Shilat-khaneh"
 nd_kry_shilat_khaneh_desc: "Une installation de pêche caspienne gérant la récolte d'esturgeons, de corégones et d'autres espèces dans les eaux riches au large de la côte de Gilan."
 nd_kry_silk_weaving: "Tissage de la soie"
 nd_kry_silk_weaving_desc: "Tisse du fil de soie brute dans un tissu fin en utilisant des teintures et des techniques raffinées au fil des générations de savoir-faire Gilani."
 nd_kry_advanced_silk_processing: "Traitement avancé de la soie"
 nd_kry_advanced_silk_processing_desc: "Des techniques avancées de teinture et de tissage transforment de plus grandes quantités de soie brute en tissus fins et luxueux, prisés dans tout le monde perse."
 nd_kry_fortress_upkeep: "Garnison de la forteresse"
 nd_kry_fortress_upkeep_desc: "La garnison permanente et l'entretien de la forteresse de montagne, nécessitant de la pierre pour les réparations et des armes pour les défenseurs."
 nd_kry_caspian_trade_goods: "Marchandises commerciales caspiennes"
 nd_kry_caspian_trade_goods_desc: "Le flux de riz et de soie à travers le bazar de Rasht, reliant la générosité agricole de Gilan aux réseaux marchands du monde entier."
 nd_kry_zaydi_teaching: "Enseignement Zaydi"
 nd_kry_zaydi_teaching_desc: "Le programme scientifique de la madrasa Lahijan, produisant des juristes, des théologiens et des administrateurs formés dans la tradition Zaydi."
 nd_kry_lagoon_fishing: "Lagoon Fishing"
 nd_kry_lagoon_fishing_desc: "Whitefish and pike are netted in the Anzali lagoon and the river mouths and salted for the inland markets."
 nd_kry_steam_filature: "Steam Filature"
 nd_kry_steam_filature_desc: "Cocoons are unwound over steam-heated basins, and the thread is dyed and woven at a scale no hand reel could match. The filature burns coal."
 nd_kry_anzali_harbor: "Anzali Lagoon Harbor"
 nd_kry_anzali_harbor_desc: "The anchorage behind the sandbar of Anzali, where the lagoon shelters ships from the Caspian storms. Silk goes out from its landing to Astrakhan, Baku and Darband."
 nd_kry_harbor_upkeep: "Harbor Upkeep"
 nd_kry_harbor_upkeep_desc: "Timber for the landing stages, and tar and cordage for the boats that lighten cargo across the bar."
 nd_kry_telembar: "Telembar"
 nd_kry_telembar_desc: "A thatched shed raised on posts, where silkworms are fed on mulberry leaves from hatching to cocoon. Every silk village of the Gilan lowlands keeps them among its gardens."
 nd_kry_telembar_upkeep: "Shed Upkeep"
 nd_kry_telembar_upkeep_desc: "Timber and thatch for the shed, reed mats for the rearing shelves and knives for the leaf harvest."
 a_nd_kry_qaleh_tofangchi: "Castle Tofangchi"
 a_nd_kry_qaleh_tofangchi_desc: "Villagers of the Alborz valleys who owe guard to the forest castles and serve with the musket. They shoot from walls and breastworks and are hard to dislodge."
 levy_nd_kry_qaleh_tofangchi: "Castle Tofangchi Levy"
 levy_nd_kry_qaleh_tofangchi_desc: "Mountain villagers called up with their muskets to hold the castles and the passes."
 nd_kry_sturgeon_fishing: "Pêche à l'esturgeon"
 nd_kry_sturgeon_fishing_desc: "Opérations de pêche spécialisées récoltant le précieux esturgeon de la Caspienne. Le sel est essentiel à la conservation des captures destinées au transport vers les marchés lointains."
 nd_kry_tea_service: "Service à thé"
 nd_kry_tea_service_desc: "The tea service of the chaykhaneh: tea, loaf sugar and locally made pottery, in a gathering place that binds communities together."
 levy_nd_kry_daylami_shieldwall: "Prélèvement sur le mur de bouclier Dailamite"
 levy_nd_kry_daylami_shieldwall_desc: "Les villageois des montagnes formés dans l'ancienne formation du mur de bouclier, appelés pour défendre les cols de Gilan en temps de guerre."
 nd_kry_formed_tt: "Gilan a été formé"
 nd_kry_path_a_tt: "Choisissez le mur de montagne des Daylamites"
 nd_kry_path_b_tt: "Choisissez les routes de la soie de la Caspienne"
 nd_kry_destiny: "Destin de Gilan"
 nd_kry_destiny_desc: "Une fois la formation de Gilan terminée, un destin plus grand l'attend. Stabilisez le nouvel État et choisissez la voie qui définira son avenir."
 nd_kry_dest_alborz_dominion: "Domaine d'Albourz"
 nd_kry_dest_alborz_dominion_desc: "Sécuriser le littoral caspien du Tabaristan au Gorgan. Les guerriers Daylamites qui marchaient autrefois depuis ces montagnes pour conquérir Bagdad se relèveront sous les bannières Gilani."
 nd_kry_dest_persian_bulwark: "Rempart persan"
 nd_kry_dest_persian_bulwark_desc: "Seize Tabriz and Ardabil, the great cities of Azerbaijan, and keep the Daylamite foot under arms as a standing army. With these strongholds, Gilan commands the mountain passes between the Caspian and the Persian heartland."
 nd_kry_dest_daylami_imperium: "Impérial Daylami"
 nd_kry_dest_daylami_imperium_desc: "D’Ispahan à Derbent, la nouvelle dynastie Bouyide régnera. Prenez le trône de Perse et tenez la porte du Caucase, complétant ainsi ce que les émirs Daylamites ont commencé il y a mille ans."
 nd_kry_dest_silk_crossroads: "Carrefour de la Soie"
 nd_kry_dest_silk_crossroads_desc: "Prenez Qazvin et Soltaniyeh, le grand carrefour où les caravanes de soie de Gilan rencontrent les marchands de Perse. Contrôlez les routes intérieures et la richesse suivra."
 nd_kry_dest_caspian_emporium: "Magasin caspien"
 nd_kry_dest_caspian_emporium_desc: "Faites de Gilan le centre incontesté du commerce caspien. Assurez-vous que la soie circule sur le marché des capitaux et faites appel aux institutions bancaires qui financeront un empire commercial."
 nd_kry_dest_golden_thread: "Le fil d'or"
 nd_kry_dest_golden_thread_desc: "Prolonger les routes de la soie de la Caspienne au Golfe Persique. Avec Ormuz en main et le commerce mondial adopté, les marchands Gilani relieront deux mers dans un réseau de fil d'or."
 nd_kry.5.t: "Le destin de Gilan"
 nd_kry.5.d: "La bannière verte de Gilan flotte au-dessus d’un royaume uni. Les forêts brumeuses de l'Alborz, les mûriers des basses terres, les quais animés d'Anzali - tous répondent à une seule autorité pour la première fois depuis des générations. Mais la formation n’est qu’un début. Le monde au-delà de ces montagnes est vaste et Gilan doit y trouver sa raison d’être. Allons-nous regarder vers l’intérieur, en fortifiant les cols qui ont abrité notre indépendance, ou vers l’extérieur, en suivant les fils de soie qui relient nos métiers à tisser aux quatre coins du monde ?"
 nd_kry.5.a: "Le destin de Gilan commence aujourd'hui."
 nd_kry.6.t: "Domination de l'Albourz"
 nd_kry.6.d: "Les soldats Gilani veillent sur le Tabaristan et le Gorgan. Toute la rive sud de la mer Caspienne, depuis les marais de Sefid Rud jusqu'à la frontière steppique d'Astarabad, tombe sous notre protection. L’ancien cœur des Dailamites est enfin réuni. Nos commandants rapportent que les cols de montagne sont sécurisés et que la plaine côtière s'ouvre devant nous. La question est maintenant de savoir jusqu’où les fils de Daylam osent marcher."
 nd_kry.6.a: "Les montagnes sont à nous. Les plaines suivront."
 nd_kry.7.t: "Le rempart de la Perse"
 nd_kry.7.d: "Tabriz has fallen. The jewel of Azerbaijan, seat of Il-Khanid emperors and Qara Qoyunlu kings, now answers to the mountain lords of Gilan. With Ardabil secured as well (the very birthplace of the Safavid order), our realm straddles the boundary between the Caucasus and the Iranian plateau. The Daylamite foot who took them are no longer a levy sent home at harvest: they are kept and paid the year round. We stand at a crossroads: do we press forward with the aggressive momentum that brought us here, or consolidate these hard-won gains into an unbreakable defensive position?"
 nd_kry.7.a: "Allez de l’avant : l’élan est le nôtre."
 nd_kry.7.b: "Fortifiez ce que nous détenons : laissez-les s’abattre sur nous."
 nd_kry.8.t: "L'Empire Daylami"
 nd_kry.8.d: "Ispahan, la moitié du monde, s'agenouille devant la dynastie des montagnes. Depuis la porte du Caucase à Derbent jusqu'à l'ancien siège des rois mèdes à Hamadan, le royaume des nouveaux émirs bouyides dépasse même les domaines de leurs illustres prédécesseurs. Les érudits de la cour se demandent si cette réussite appelle à une expansion agressive de la tradition bouyide (marcher sur Bagdad comme Ahmad ibn Buya l’a fait autrefois) ou à la consolidation patiente d’un empire des hautes terres qui peut survivre à n’importe quel challenger."
 nd_kry.8.a: "Marchez vers l’extérieur : nous sommes les nouveaux Buyids."
 nd_kry.8.b: "Règle depuis les montagnes : notre royaume est une forteresse suffisante."
 nd_kry.9.t: "Le carrefour de la soie"
 nd_kry.9.d: "Les caravansérails de Qazvin et Soltaniyeh arborent désormais les couleurs Gilani. Chaque balle de soie quittant les ateliers de tissage de Rasht et de Lahijan traverse notre territoire pour se diriger vers les marchés du monde entier. Les marchands arméniens qui négociaient autrefois avec les gouverneurs étrangers traitent désormais directement avec nous. Les routes commerciales intérieures sont les nôtres, et avec elles, le levier nécessaire pour remodeler le commerce à travers la Perse."
 nd_kry.9.a: "Le carrefour appartient désormais à Gilan."
 nd_kry.10.t: "Le magasin caspien"
 nd_kry.10.d: "La soie circule sur tous les marchés de notre domaine. Les institutions bancaires qui enrichissaient autrefois les commerçants italiens sont désormais au service des commerçants Gilani, finançant des entreprises qui auraient été impossibles il y a une génération. Notre port d'Anzali bourdonne d'activité alors que les navires de toutes les rives de la Caspienne se font concurrence pour acheter ce que nos métiers à tisser produisent. La question est de savoir comment exploiter au mieux cette richesse : allons-nous investir dans l’intégration verticale, en contrôlant chaque étape, du ver à soie au tissu fini ? Ou devrions-nous nous concentrer sur la monopolisation des marchés eux-mêmes, en éliminant les concurrents par le simple pouvoir financier ?"
 nd_kry.10.a: "Control the production, from worm to cloth."
 nd_kry.10.b: "Contrôlez les marchés : le profit suit le monopole."
 nd_kry.11.t: "Le fil d'or"
 nd_kry.11.d: "Le détroit d'Ormuz, porte d'entrée entre le golfe Persique et l'océan Indien, relève de l'autorité Gilani. Ce qui a commencé dans les brumeuses plantations de mûriers de la côte caspienne s’étend désormais jusqu’aux eaux chaudes de la mer d’Oman. Deux grands plans d'eau, reliés par un fil de soie et d'or qui traverse le cœur de notre domaine. Le tribunal débat des implications : certains plaident en faveur d’étendre notre portée diplomatique à tous les coins du monde commercial, tandis que d’autres y voient une opportunité de transformer Gilan lui-même en un centre de culture raffinée et de pouvoir commercial."
 nd_kry.11.a: "Laissez le fil d’or s’étendre à travers le monde."
 nd_kry.11.b: "Laissez la richesse transformer Gilan lui-même."
 STATIC_MODIFIER_NAME_nd_kry_dest_mountain_vanguard: "Avant-garde de la montagne"
 STATIC_MODIFIER_DESC_nd_kry_dest_mountain_vanguard: "Les tactiques agressives qui ont pris Tabriz définissent désormais notre doctrine militaire. Les commandants Gilani recherchent la bataille avec impatience, acquérant de l'expérience au prix de négliger l'entretien des fortifications."
 STATIC_MODIFIER_NAME_nd_kry_dest_highland_discipline: "Discipline des Highlands"
 STATIC_MODIFIER_DESC_nd_kry_dest_highland_discipline: "Les garnisons disciplinées des cols d'Albourz sont devenues un modèle pour toute l'armée. La réduction des coûts et l’amélioration de l’intelligence se font au prix d’une perspective plus insulaire."
 STATIC_MODIFIER_NAME_nd_kry_dest_buyid_restoration: "Restauration Bouyide"
 STATIC_MODIFIER_DESC_nd_kry_dest_buyid_restoration: "L’esprit conquérant des premiers émirs bouyides revit. Nos armées marchent plus vite, annexent plus efficacement et trouvent avec une facilité pratique une justification à la guerre."
 STATIC_MODIFIER_NAME_nd_kry_dest_mountain_emperor: "Empereur de la montagne"
 STATIC_MODIFIER_DESC_nd_kry_dest_mountain_emperor: "Le royaume des montagnes est consolidé en un État-forteresse imprenable. De nouvelles fortifications et des garnisons loyales sécurisent chaque passage, même si le repli sur soi met à rude épreuve les relations diplomatiques."
 STATIC_MODIFIER_NAME_nd_kry_dest_silk_factor: "Facteur de soie"
 STATIC_MODIFIER_DESC_nd_kry_dest_silk_factor: "Les marchands Gilani contrôlent chaque étape de la production et du commerce de la soie. L'influence des marchands grandit, les sujets s'intègrent plus rapidement et la classe bourgeoise prospère sous le nouvel ordre commercial."
 STATIC_MODIFIER_NAME_nd_kry_dest_caspian_monopolist: "Monopoleur caspien"
 STATIC_MODIFIER_DESC_nd_kry_dest_caspian_monopolist: "Les institutions financières servent les intérêts commerciaux des Gilani, en réduisant les coûts d'emprunt, en élargissant l'assiette fiscale des bourgeois et en maintenant la satisfaction de tous les domaines grâce à une prospérité partagée."
 STATIC_MODIFIER_NAME_nd_kry_dest_thread_of_empires: "Fil des Empires"
 STATIC_MODIFIER_DESC_nd_kry_dest_thread_of_empires: "Les réseaux commerciaux Gilani s'étendent de la Caspienne à l'océan Indien. La portée diplomatique et les revenus d’exportation montent en flèche, même si l’empire commercial tentaculaire met à rude épreuve l’armée."
 STATIC_MODIFIER_NAME_nd_kry_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_kry_dest_merchant_princes: "La richesse en soie de Gilan transforme la province en un centre de développement urbain et de gouvernance raffinée. Les dépenses judiciaires diminuent et les coûts de construction diminuent à mesure que les capitaux marchands affluent dans chaque projet."
 nd_kry_daylami_citadel: "Citadelle de Daylami"
 nd_kry_daylami_citadel_desc: "Une grande forteresse de montagne dans la tradition Daylamite, combinant une architecture défensive ancienne avec une ingénierie militaire moderne. Sa garnison commande les cols environnants et sert de symbole de la tradition militaire Daylami renaissante."
 nd_kry_silk_bourse: "Bourse de la Soie"
 nd_kry_silk_bourse_desc: "Un grand échange commercial où les marchands de soie Gilani, les facteurs arméniens et les acheteurs étrangers convergent pour négocier des contrats et fixer les prix. La bourse concentre les informations sur le marché et les instruments financiers, faisant de Gilan le centre du commerce international de la soie."
 nd_kry_citadel_garrison: "Garnison de la Citadelle"
 nd_kry_citadel_garrison_desc: "La garnison permanente de la citadelle de Daylami, entretenue avec des pierres pour la fortification et des armes pour ses défenseurs."
 nd_kry_bourse_operations: "Opérations boursières"
 nd_kry_bourse_operations_desc: "Les opérations quotidiennes de la bourse de la soie, consommant du papier pour les contrats et les dossiers, du tissu pour les échantillons et les présentoirs, et du tissu fin comme marchandise échangée."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_kry_bureaucracy_authority: "Autorité bureaucratique Gilani"
 AUTO_MODIFIER_DESC_nd_kry_bureaucracy_authority: "A united Gilan has room for one more institution: the Karkiya Sayyid Rule, the Biapas-Biapish Diwan, the Sefidrud Rice Cadaster or the Royal Silk Customs."
 kry_karkiya_sayyid_rule_bureaucracy: "Règle de Karkiya Sayyid"
 kry_karkiya_sayyid_rule_bureaucracy_desc: "À partir de 1370, la dynastie Sayyid Karkiya de Lahijan dirigea Biapish en tant que seigneurs héréditaires chiites duodécimains revendiquant une descendance hassanide par l'intermédiaire du Prophète, fusionnant la légitimité dynastique avec l'autorité religieuse un siècle complet avant la conversion safavide de l'Iran. Le sultan-Ali Mirza a hébergé le jeune Ismail à Lahijan dans les années 1490. Tous les contrats et commissions militaires passaient par la maison dont le sang les sanctifiait ; lorsqu'il est maintenu, le royaume acquiert la discipline d'une royauté sacrée, mais la négligence permet aux oulémas d'éclipser le trône et d'aliéner l'aristocratie laïque."
 kry_biapas_biapish_diwan_bureaucracy: "Diwan Biapas-Biapish"
 kry_biapas_biapish_diwan_bureaucracy_desc: "Gilan was constitutionally divided into Biapish (east of the Sefidrud, ruled from Lahijan by the Karkiya) and Biapas (west, ruled from Fuman and later Rasht by the Ishaqvand and the Hazaraspid amirs of Amir Dubaj). Each half kept its own diwan, its own contingent, and its own customs of rule, with cross-jurisdictional matters settled by joint conference. The dual-khanate compact preserved local autonomy against outside conquest, but at the cost of a permanently divided crown, and Safavid governors after 1592 inherited a province that still spoke as two voices."
 kry_sefidrud_rice_cadaster_bureaucracy: "Cadastre du riz de Sefidrud"
 kry_sefidrud_rice_cadaster_bureaucracy_desc: "Le registre foncier et hydraulique des rizières du delta de Sefidrud, recensé en jiribs et annoté pour les droits d'irrigation le long des qanats et des seuils alimentant chaque parcelle. Mis à jour chaque saison par les chefs de village kadkhuda relevant de Rasht et de Lahijan, le cadastre fixait le tribut de riz dû par chaque village et les taux de métayage entre propriétaire et cultivateur. Le surplus de riz humide de Gilan alimentait la rive caspienne de Tabriz à Astrakhan ; Lorsque le registre s'est effondré, les propriétaires ont saisi les droits d'eau en amont et les paysans en dessous d'eux sont morts de faim."
 kry_royal_silk_customs_bureaucracy: "Douanes royales de la soie"
 kry_royal_silk_customs_bureaucracy_desc: "Sous Shah Abbas I (r. 1588-1629), le trône safavide fit de Gilan la première province mondiale de soie brute en établissant des facteurs royaux à Rasht et Bandar-e Anzali qui achetaient toute la récolte de soie provinciale à un prix fixe, puis la revendaient aux marchands arméniens Julfan et aux facteurs russes pour de l'argent dur sous des registres douaniers scellés. Le système a enrichi la couronne et ses intermédiaires marchands tout en transférant une grande partie des surplus des cultivateurs à l'État, et a lié Gilan aux réseaux commerciaux à longue distance de la Caspienne et de la Méditerranée pendant deux siècles."
