l_french:
 STATIC_MODIFIER_NAME_nd_rus_third_rome_ascendant: "Troisième Ascendant de Rome"
 STATIC_MODIFIER_DESC_nd_rus_third_rome_ascendant: "Moscow stands as the successor to Rome and Constantinople, the last guardian of true Orthodox Christianity. Its sovereign rules as God's chosen vessel on earth, and from this sacred authority flows the power to hold all the Russian lands under a single crown."
 STATIC_MODIFIER_NAME_nd_rus_empire_of_the_steppe: "Beyond the Stone"
 STATIC_MODIFIER_DESC_nd_rus_empire_of_the_steppe: "Russia's future lies not in the cramped courts of Europe but beyond the Stone, as the Urals are called, in the forests and rivers that run east to the ocean. The Cossack and the fur trapper carry Moscow's banner into the wilderness, and every river crossed and every stockade raised extends the realm."
 nd_rus.1.t: "La naissance de la Russie"
 nd_rus.1.d: "The scattered principalities of the Rus have been gathered under one sovereign. Moscow, Novgorod, Tver and Vladimir obey one throne, and its holder is styled Sovereign of All Rus. It is a kingdom among kingdoms and not yet an empire: a tsar's crown is still to be claimed, and what kind of realm will claim it is disputed.\n\nThe Orthodox clergy speak of Moscow as the Third Rome, the last bastion of true Christianity, destined to lead the faithful until the end of days. The sovereign's authority, they argue, derives from God alone, and the realm's purpose is to be the guardian of Orthodoxy.\n\nOthers look east, beyond the Stone, as the Urals are called, to the forests of Siberia, where fortunes are measured in furs and the land has no end. The Cossacks and frontiersmen who push the border further need not priests but powder and provisions. They see a realm that grows by conquest and trade until it reaches the ocean.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rus.1.a: "Moscow is the Third Rome. There shall be no fourth."
 nd_rus.1.b: "Our road lies east, beyond the Stone and on to the ocean."
 nd_rus.2.t: "Le Corps Streltsy"
 nd_rus.2.d: "A new kind of soldier marches through the streets of Moscow. Armed with matchlock muskets and heavy bardiches, the Streltsy are Russia's first permanent standing infantry, salaried, uniformed, and drilled in the use of firearms. Unlike the feudal cavalry of the boyars, these men owe their loyalty directly to the Tsar. Initially numbering some three thousand, the corps has grown to garrison every major city, their distinctive colored coats becoming a symbol of centralized military power.\n\nThe question now is how to employ them. As a disciplined field force, trained in European-style volley fire and capable of standing against any army on the continent? Or as garrison troops, manning the walls of Russian cities and frontier fortresses, providing the backbone of the realm's defensive network?"
 nd_rus.2.a: "Formez-les comme une armée de campagne professionnelle."
 nd_rus.2.b: "Station them as the realm's garrison backbone."
 nd_rus.3.t: "The Chosen Thousand"
 nd_rus.3.d: "A thousand picked servitors have been settled on estates within reach of Moscow. They hold their land of the tsar alone and stand ready for any errand of the crown: an embassy, a command, an inquiry into a governor's accounts.\n\nThe great houses watch them with unease. Men who owe everything to one master can be turned against anyone. Some at court urge that they be made the tsar's own household, set apart from the boyar council and answering to no court but his. Others hold that they should serve within the old order, in the offices and regiments where the realm is short of able men."
 nd_rus.3.a: "They are the tsar's men alone. Let them watch the great houses."
 nd_rus.3.b: "Let them serve in the offices and the regiments, under the old order."
 nd_rus.4.t: "The Heraldmaster's Office"
 nd_rus.4.d: "A Heraldmaster has been set under the Senate with a single task: to know every man who owes service. His clerks draw up the rolls of the nobility, find out who is hiding on his estates, and enter among the nobles the commoners whose rank has earned it. Coats of arms are drawn for families that never had one.\n\nThe old boyar families are outraged to see the sons of clerks inscribed beside them. But the state needs able officers and administrators, and now it knows where to find them: a new service nobility whose loyalty is to the state and not to clan or tradition."
 nd_rus.4.a: "Le mérite sera la mesure d'un homme."
 nd_rus.5.t: "La science de la victoire"
 nd_rus.5.d: "General Alexander Suvorov has transformed Russian military doctrine with his treatise 'The Science of Victory.' His principles are brutally simple: train relentlessly, move fast, strike with the bayonet. 'The bullet is a fool, the bayonet a fine fellow,' he teaches his grenadiers. His campaigns have proven the doctrine sound: undefeated in over sixty battles, Suvorov's soldiers march faster, hit harder, and fight with a fury that confounds their enemies.\n\nHis methods emphasize speed over caution, attack over defense, and the initiative of individual soldiers over rigid formation drill. Russian grenadiers trained in his school are among the finest infantry in Europe."
 nd_rus.5.a: "La baïonnette ne ment jamais."
 STATIC_MODIFIER_NAME_nd_rus_streltsy_discipline: "Discipline de terrain Streltsy"
 STATIC_MODIFIER_DESC_nd_rus_streltsy_discipline: "Le corps Streltsy est formé comme une armée de campagne professionnelle, entraîné au tir à la volée et aux manœuvres disciplinées."
 STATIC_MODIFIER_NAME_nd_rus_streltsy_garrison: "Réseau de garnison Streltsy"
 STATIC_MODIFIER_DESC_nd_rus_streltsy_garrison: "The Streltsy garrisons provide a permanent defensive backbone across the realm's cities and fortresses."
 STATIC_MODIFIER_NAME_nd_rus_oprichnina_terror: "The Tsar's Own Household"
 STATIC_MODIFIER_DESC_nd_rus_oprichnina_terror: "The chosen servitors answer to the tsar alone. The great houses are watched, and no boyar or province is beyond their reach."
 STATIC_MODIFIER_NAME_nd_rus_oprichnina_restraint: "Servitors Within the Old Order"
 STATIC_MODIFIER_DESC_nd_rus_oprichnina_restraint: "The chosen servitors are spread through the offices and commands of the realm. Able men serve beside the boyars, and the council governs without fear."
 nd_rus_druzhina_tradition: "Tradition Druzhina"
 nd_rus_druzhina_tradition_desc: "The druzhina (the personal retinue of mounted warriors serving the prince) forms the core of early Russian military power: sworn household men who ride to war beside their lord and sit in his council in peace."
 nd_rus_northern_thebaid: "Northern Thebaid"
 nd_rus_northern_thebaid_desc: "In 1337 Sergius of Radonezh raises a wooden church to the Trinity in the forest north of Moscow. His disciples carry the rule further into the wilderness, founding hermitage after hermitage from Beloozero to the White Sea, and peasants follow the monks into land no prince had ever taxed."
 nd_rus_veche_assemblies: "Charters of Governance"
 nd_rus_veche_assemblies_desc: "When a land comes under Moscow, the grand prince gives it a charter: what the governor may take for his keep, what each fine is, and how a thief or a murderer is tried. The Dvina land received such a charter in 1397. A land that knows what it owes is slower to rise."
 nd_rus_fur_trade: "Fondations du commerce des fourrures"
 nd_rus_fur_trade_desc: "Les forêts du nord de la Russie produisent une abondance de zibeline, de renard et d'hermine, constituant l'épine dorsale du premier commerce russe et attirant des marchands d'aussi loin que Constantinople et le monde islamique."
 nd_rus_gathering_of_lands: "Rassemblement des terres russes"
 nd_rus_gathering_of_lands_desc: "Sous Ivan III, Moscou absorbe systématiquement les principautés russes indépendantes (Novgorod, Tver, Iaroslavl, Rostov), forgeant un État unifié à partir de la mosaïque d’apanages médiévaux."
 nd_rus_third_rome: "Troisième Rome"
 nd_rus_third_rome_desc: "After the fall of Constantinople in 1453, Moscow claims the mantle of the Third Rome: the last guardian of Orthodox Christianity, with its sovereign as God's representative on earth."
 nd_rus_sudebnik: "Scribe Books"
 nd_rus_sudebnik_desc: "The grand prince's scribes ride through each newly gathered land and write down every village, every plough and every due, as they did in the lands of Novgorod in the 1490s. The scribe books tell Moscow what a district owes and who holds it, and no local custom can be pleaded against them."
 nd_rus_merchant_courts: "Tradition Gostiny Dvor"
 nd_rus_merchant_courts_desc: "Le Gostiny Dvor (tribunaux marchands où les commerçants de toute la Russie et des pays étrangers se réunissent pour faire des affaires) devient la pierre angulaire de la vie commerciale russe, réglementée par l'État pour l'ordre et les revenus."
 nd_rus_stone_kremlins: "Town Stewards"
 nd_rus_stone_kremlins_desc: "In each fortified town a steward is chosen from the service gentry of the district to see to its walls, its store of powder and shot, and the dues that pay for them. When raiders come, the countryside shelters in the yards kept within the walls."
 nd_rus_pomestye_system: "Domaines de service Pomestye"
 nd_rus_pomestye_system_desc: "The pomestye system grants conditional land estates to military servitors in exchange for mounted service, creating a new class of service nobles bound to the sovereign's army."
 nd_rus_boyar_duma: "Douma des boyards"
 nd_rus_boyar_duma_desc: "The Boyar Duma, an advisory council of the highest-ranking nobles and clergy, deliberates on matters of state, war, and law at the sovereign's pleasure."
 nd_rus_streltsy_corps: "Corps Streltsy"
 nd_rus_streltsy_corps_desc: "Ivan IV crée les Streltsy, la première infanterie permanente russe armée d'armes à feu. Salariés et en uniforme, ils représentent une étape décisive vers une armée professionnelle."
 nd_rus_oprichnina: "The Chosen Thousand"
 nd_rus_oprichnina_desc: "In 1550 Ivan IV orders a thousand of his best servitors settled on estates within reach of Moscow, to be at hand for any errand of the crown. They owe their land to the tsar alone. From picked men of this kind he later draws the black-clad horsemen of his own household."
 nd_rus_siberian_conquest: "Conquête sibérienne"
 nd_rus_siberian_conquest_desc: "The conquest of the Khanate of Sibir opens the way to the vast wilderness beyond the Urals, where Cossack explorers and fur traders push the frontier ever eastward toward the Pacific. They coast the Arctic shore and work the great rivers in the koch, the round-hulled boat of the Pomors that the ice lifts instead of crushing."
 nd_rus_orthodox_arts: "Renaissance culturelle orthodoxe"
 nd_rus_orthodox_arts_desc: "La peinture d'icônes russe, l'architecture d'église et la musique liturgique atteignent de nouveaux sommets de réalisation artistique, créant une tradition culturelle orthodoxe distinctive qui rivalise avec l'art de Byzance lui-même."
 nd_rus_smuta_resilience: "Résilience Smuta"
 nd_rus_smuta_resilience_desc: "Le Temps des Troubles met la Russie à l’épreuve jusqu’à son point de rupture (famine, invasion, guerre civile et prétendants au trône) mais la nation perdure, émergeant avec un sentiment approfondi d’identité nationale et de résilience."
 nd_rus_grain_spirits: "Industrie des spiritueux céréaliers"
 nd_rus_grain_spirits_desc: "Les distillateurs russes perfectionnent la production de spiritueux à base de céréales, créant ainsi une industrie nationale qui génère des revenus importants pour le trésor public grâce à des ventes monopolistiques."
 nd_rus_cossack_hosts: "Hôtes cosaques"
 nd_rus_cossack_hosts_desc: "The semi-autonomous Cossack communities of the Don, Zaporozhian Sich, and Yaik are formalized as military hosts, giving the Tsar superb light cavalry in exchange for land and self-governance."
 nd_rus_prikazy_system: "Zemsky Sobor"
 nd_rus_prikazy_system_desc: "The Assembly of the Land. The tsar calls the boyars, the clergy, the service gentry and the townsmen together to hear what the realm will bear. In 1613 the assembly chooses Michael Romanov as tsar, and through his reign it sits year after year and votes the taxes for his wars."
 nd_rus_patriarch: "Patriarcat de Moscou"
 nd_rus_patriarch_desc: "La création du Patriarcat de Moscou en 1589 élève l’Église russe à la pleine indépendance, confirmant ainsi l’autorité spirituelle de Moscou sur tous les croyants orthodoxes."
 nd_rus_new_regiments: "Nouveaux régiments de formation"
 nd_rus_new_regiments_desc: "Des officiers formés en Europe entraînent les soldats russes aux méthodes militaires occidentales, créant de « nouvelles formations » de régiments d'infanterie, de dragons et de reiters qui complètent la cavalerie traditionnelle Streltsy et féodale."
 nd_rus_ural_ironworks: "Usines sidérurgiques de l'Oural"
 nd_rus_ural_ironworks_desc: "Les montagnes de l'Oural recèlent de vastes gisements de minerai de fer et la création de fonderies financées par l'État transforme la Russie en l'un des plus grands producteurs européens de fer et de canons."
 nd_rus_ulozheniye: "White Settlements Abolished"
 nd_rus_ulozheniye_desc: "After the Moscow rising of 1648 the tax free suburbs that boyars and monasteries keep beside the towns are taken from them. Their craftsmen and traders are entered among the tsar's own townsmen and pay with them. The towns are quiet, and their dues go to the crown."
 nd_rus_don_host: "Hôte cosaque du Don"
 nd_rus_don_host_desc: "The Don Cossacks are formally recognized as a military estate of the realm, providing elite light cavalry for the Tsar's campaigns in exchange for autonomy on their ancestral lands along the Don River."
 nd_rus_petrine_navy: "Réformes navales pétrines"
 nd_rus_petrine_navy_desc: "Pierre le Grand, après avoir travaillé comme apprenti charpentier naval dans des chantiers navals hollandais et anglais, revient pour construire en Russie une marine à partir de rien : en créant des académies navales, des chantiers navals et la nouvelle capitale de Saint-Pétersbourg comme fenêtre sur la mer."
 nd_rus_baltic_fleet: "Flotte Baltique"
 nd_rus_baltic_fleet_desc: "La création de la flotte baltique transforme la Russie d'une puissance enclavée en une force navale capable de contester la mer Baltique, de défier la domination suédoise et de garantir l'accès de la Russie au commerce européen."
 nd_rus_table_of_ranks: "Heraldmaster's Office"
 nd_rus_table_of_ranks_desc: "The Heraldmaster's office, set under the Senate in 1722 with Stepan Kolychev at its head, keeps the roll of every man in the sovereign's service, sees that no noble evades it, and enters among the nobility the commoners whose rank has earned it."
 nd_rus_guberniya: "Système de Guberniya"
 nd_rus_guberniya_desc: "The realm is reorganized into guberniyas (provinces governed by appointed governors answerable directly to the central government), replacing the old patchwork of local administration."
 nd_rus_military_colonies: "Colonisation militaire"
 nd_rus_military_colonies_desc: "Soldier-settlers are established in frontier regions, combining military duty with agricultural cultivation to provide both defense and sustenance for the expanding realm."
 nd_rus_suvorov_school: "École militaire de Souvorov"
 nd_rus_suvorov_school_desc: "Les doctrines d'Alexandre Suvorov sur la vitesse, l'agression et l'assaut à la baïonnette produisent une génération de grenadiers d'élite qui combattent avec une férocité et une initiative tactique inégalées."
 nd_rus_great_power_diplomacy: "Diplomatie des grandes puissances"
 nd_rus_great_power_diplomacy_desc: "Russia's emergence as a European great power demands a sophisticated diplomatic corps, and Russia now maintains ambassadors at every major court, wielding influence from Paris to Constantinople."
 nd_rus_enlightenment: "Lumières russes"
 nd_rus_enlightenment_desc: "Catherine the Great corresponds with Voltaire and Diderot, establishes the Free Economic Society, and founds schools across the country. Russian letters, science, and philosophy flourish as never before."
 nd_rus_industrial_dawn: "L’aube industrielle"
 nd_rus_industrial_dawn_desc: "The first stirrings of industrialization reach Russia as mechanized production begins in textiles and metalworking, and state-sponsored factories multiply across the Urals and around Moscow. The arms works at Izhevsk and Zlatoust turn Ural steel into muskets and blades for the army.\n\n#italic Available in: $nd_rus_ural_foundry$#!"
 a_nd_rus_streltsy: "Streltsy"
 a_nd_rus_streltsy_desc: "L'infanterie de mousquets debout de Moscou, en uniforme et salariée, armée d'armes à feu à mèche et de lourdes bardiches. L’épine dorsale de la puissance militaire russe à l’ère de la poudre à canon."
 a_nd_rus_cossack_cavalry: "Cavalerie légère cosaque"
 a_nd_rus_cossack_cavalry_desc: "Steppe horsemen from the frontier communities, expert riders and raiders who serve as the Tsar's eyes and ears across the vast southern borderlands. They ride round an enemy and do not stand in front of one."
 a_nd_rus_druzhina: "Druzhina"
 a_nd_rus_druzhina_desc: "The prince's own retinue: mailed horsemen sworn to him in person, who carry the bow of the steppe beside the lance and the sword."
 a_nd_rus_pomestnoe_voysko: "Pomestnoe Voysko"
 a_nd_rus_pomestnoe_voysko_desc: "The landed army of Muscovy. Every service estate sends its riders in quilted coats with bow, quiver and sabre. No host in the east musters more horsemen, and none is quicker to ride home at harvest."
 a_nd_rus_soldaty: "Soldaty of the New Order"
 a_nd_rus_soldaty_desc: "Foot regiments drilled in pike and shot by hired Scottish, Dutch and German colonels. They hold a line as no gentry levy can, for as long as the conscripts in the ranks stay with the colours."
 n_nd_rus_koch: "Koch"
 n_nd_rus_koch_desc: "The ice boat of the Pomors: a round hull with a second skin of larch at the waterline, one mast and one square sail. A dozen men sail it and it carries forty more. Slow and almost unarmed, it goes where no other ship can follow."
 a_nd_rus_oprichnik: "Cavalerie opritchnik"
 a_nd_rus_oprichnik_desc: "Les hommes de main personnels du tsar, des cavaliers vêtus de noir qui portent une tête de chien et un balai en selle, symboles de leur mission consistant à détecter et à balayer la trahison."
 a_nd_rus_don_cossack: "Don Cosaque"
 a_nd_rus_don_cossack_desc: "Elite horsemen of the Don Cossack Host, veteran cavalrymen who combine steppe riding traditions with disciplined military service to the crown."
 a_nd_rus_suvorov_grenadier: "Grenadier de Souvorov"
 a_nd_rus_suvorov_grenadier_desc: "Infanterie d'élite entraînée à la doctrine de Suvorov sur la vitesse et l'assaut à la baïonnette. « La balle est un imbécile, la baïonnette un brave garçon » : ces hommes incarnent ce credo."
 n_nd_rus_baltic_frigate: "Frégate Baltique"
 n_nd_rus_baltic_frigate_desc: "Un navire de guerre rapide de la flotte russe de la Baltique, construit dans les nouveaux chantiers navals de Saint-Pétersbourg pour contester la domination suédoise sur les mers du Nord."
 nd_rus_gostiny_dvor: "Gostiny Dvor"
 nd_rus_gostiny_dvor_desc: "Un tribunal marchand où les commerçants de toute la Russie et des pays étrangers se rassemblent pour vendre leurs marchandises sous la réglementation de l'État, favorisant ainsi le commerce ordonné et la collecte des impôts."
 nd_rus_gostiny_dvor_upkeep: "Entretien Gostiny Dvor"
 nd_rus_gostiny_dvor_upkeep_desc: "Coûts d'entretien pour l'entretien de la cour marchande : bois pour la construction, pierre pour les réparations, papier pour les registres commerciaux et les contrats, et tissu pour l'exposition et les besoins des marchands."
 nd_rus_kreml: "Siege Yard"
 nd_rus_kreml_desc: "A yard kept inside the walls of a fortified town by the landholders of its district, with a caretaker in peace and room for their households, grain and arms in war. The town steward sees that the walls, the guns and the yards are ready."
 nd_rus_kreml_garrison: "Town Garrison"
 nd_rus_kreml_garrison_desc: "The gunners and gate guards of the town: weapons and firearms for the men, stone for the walls, and tools for the works."
 nd_rus_ural_foundry: "Usines sidérurgiques de l'Oural"
 nd_rus_ural_foundry_desc: "A state-sponsored iron foundry in the Ural Mountains, smelting the region's vast ore deposits into iron and steel for the state's arsenals."
 nd_rus_iron_smelting: "Fonderie de fer de l'Oural"
 nd_rus_iron_smelting_desc: "Fusion à l'échelle industrielle du minerai de fer de l'Oural en acier de haute qualité à l'aide de hauts fourneaux alimentés au charbon de bois et au coke."
 nd_rus_naval_academy: "Académie navale"
 nd_rus_naval_academy_desc: "Une école de navigation et de construction navale établie dans la tradition pétrine, formant des officiers et des artisans pour construire et piloter la flotte russe en pleine croissance."
 nd_rus_naval_academy_upkeep: "Entretien de l'Académie navale"
 nd_rus_naval_academy_upkeep_desc: "Coûts d'entretien de l'académie navale : bois et fournitures navales pour les navires-écoles, outils pour l'enseignement des charpentiers navals et papier pour les cartes et les programmes de navigation."
 nd_rus_fur_post: "Poste de traite des fourrures"
 nd_rus_fur_post_desc: "Une station commerciale frontalière où les trappeurs apportent des peaux de zibeline, de renard et d'hermine pour les collecter, les classer et les expédier vers les marchés de Moscou et au-delà."
 nd_rus_fur_post_upkeep: "Entretien du poste de traite"
 nd_rus_fur_post_upkeep_desc: "Entretien du poste frontalier : outils pour les trappeurs et travaux de réparation, bois de construction pour la structure du poste et sel pour conserver les peaux avant expédition au marché."
 nd_rus_vodka_distillery: "Distillerie de Vodka"
 nd_rus_vodka_distillery_desc: "Une distillerie d'alcool de céréales produisant une liqueur russe distinctive qui génère des revenus importants grâce à des ventes monopolistiques contrôlées par l'État."
 nd_rus_arms_works: "Ural Arms Works"
 nd_rus_arms_works_desc: "Forging Ural steel and birch stocks into muskets for the army, as the state works at Izhevsk and Zlatoust do."
 nd_rus_pustyn: "Forest Hermitage"
 nd_rus_pustyn_desc: "A pustyn, a wilderness monastery of log cells around a wooden church. The monks clear the forest, the peasants who settle beside them clear more, and the pagan villages of the north hear the liturgy for the first time."
 nd_rus_pustyn_upkeep: "Hermitage Upkeep"
 nd_rus_pustyn_upkeep_desc: "Timber for the cells and the palisade, beeswax for the candles, and salt to keep the winter fish."
 nd_rus_vodka_production: "Distillation de Vodka"
 nd_rus_vodka_production_desc: "La distillation du grain de blé en spiritueux hautement résistants destinés à la consommation intérieure et à l'exportation."
 levy_nd_rus_druzhina: "Druzhina"
 levy_nd_rus_druzhina_desc: "The household horsemen of the prince and his boyars, called out for war."
 levy_nd_rus_pomestnoe_voysko: "Landed Cavalry Muster"
 levy_nd_rus_pomestnoe_voysko_desc: "Mounted archers owed by the holders of service estates."
 levy_nd_rus_cossack_cavalry: "Prélèvement cosaque"
 levy_nd_rus_cossack_cavalry_desc: "Cavalerie légère issue des communautés frontalières cosaques."
 levy_nd_rus_don_cossack: "Prélèvement cosaque du Don"
 levy_nd_rus_don_cossack_desc: "Cavalerie d'élite issue de l'armée cosaque du Don."
 nd_rus_formed_tt: "La Russie s'est formée"
 nd_rus_path_a_tt: "Choisissez le destin#bold Troisième Rome Ascendant#!"
 nd_rus_path_b_tt: "Chose the #bold Beyond the Stone#! destiny"
 nd_rus_dest_tobolsk_town_tt: "We own #bold Tobolsk#! and it has grown into a town or a city"
 nd_rus_dest_irkutsk_town_tt: "We own #bold Irkutsk#! and it has grown into a town or a city"
 nd_rus_destiny: "Sovereign of All Rus"
 nd_rus_destiny_desc: "Russia has been forged from the scattered principalities of the Rus. Now its sovereign must show that the new state has the stability and authority to endure. Only a realm at peace with itself can pursue the ambitions that lie ahead, a tsar's crown among them."
 nd_rus_dest_mother_cities: "Retour des villes mères"
 nd_rus_dest_mother_cities_desc: "Récupérez Kiev, berceau baptismal de la Rus, et Vilnius, capitale du Grand-Duché qui contestait la prétention de Moscou à la suprématie orthodoxe. Adoptez le système bancaire moderne pour financer les campagnes occidentales."
 nd_rus_dest_baltic_window: "La fenêtre baltique"
 nd_rus_dest_baltic_window_desc: "Seize the great Baltic ports of Riga and Tallinn to break through to European maritime trade, and embrace the global trade that passes through them. Amass the treasury required to sustain a westward-facing realm."
 nd_rus_dest_third_rome_fulfilled: "La troisième Rome monte"
 nd_rus_dest_third_rome_fulfilled_desc: "Take Constantinople itself and restore the Hagia Sophia to Orthodox worship. Only a powerful and renowned realm can claim the mantle of Rome."
 nd_rus_dest_eastern_road: "La route de l'Est"
 nd_rus_dest_eastern_road_desc: "Conquérir Kazan, qui bloque la route vers l'Est, et s'emparer de Tobolsk, porte d'entrée vers la Sibérie. Établir des institutions bancaires pour financer la vaste entreprise d’expansion vers l’Est."
 nd_rus_dest_siberian_wealth: "Richesse sibérienne"
 nd_rus_dest_siberian_wealth_desc: "Let Tobolsk, the stockade above the Irtysh, grow into the capital town of Siberia. Build a fur trade that feeds the markets of Moscow and the world. The printing press must reach the frontier."
 nd_rus_dest_continental_colossus: "Colosse continental"
 nd_rus_dest_continental_colossus_desc: "Carry the Russian state to the far side of Siberia. Irkutsk, on the road to Lake Baikal, must grow from a stockade into a town. The Enlightenment must illuminate even the furthest provinces, the treasury must overflow, and the world must recognize Russian greatness."
 nd_rus.6.t: "Sovereign of All Rus"
 nd_rus.6.d: "The Russian state has achieved a measure of stability that few thought possible in these turbulent lands. The boyars have been brought to heel, the Church blesses the sovereign's authority, and the common people look to Moscow as the center of their world. This stability is not an end but a beginning: the foundation on which an empire may yet be proclaimed.\n\nThe question now is what Russia shall become."
 nd_rus.6.a: "The realm stirs."
 nd_rus.7.t: "Le retour des villes mères"
 nd_rus.7.d: "Kyiv, where Grand Prince Vladimir received baptism and brought Christianity to the Rus, has been restored to the Russian realm. Vilnius, capital of the Grand Duchy of Lithuania (Russia's oldest rival for dominion over the Orthodox east), has fallen to Moscow's armies. These are not mere conquests but the assertion of a civilizational claim.\n\nPilgrims flock to the Monastery of the Caves in Kyiv, and the churches ring with celebration. Russia's claim as the guardian of Orthodoxy is strengthened immeasurably by the return of these cities to her sphere."
 nd_rus.7.a: "The western lands acknowledge Moscow."
 nd_rus.8.t: "La percée baltique"
 nd_rus.8.d: "The great ports of Riga and Tallinn are now Russian. For the first time, Russia has direct access to European maritime trade routes, and Russian merchants can deal with Hamburg, Amsterdam, and London without intermediaries. The Baltic is no longer a Swedish or Hanseatic lake.\n\nThis breakthrough poses a fundamental question for the country. Should Russia embrace the ways of Europe (its courts, its fashions, its diplomatic culture) and take its place as a European great power? Or should the Third Rome stand apart, a fortress of Orthodox faith and Russian tradition, drawing strength from its distinctiveness rather than conformity?"
 nd_rus.8.a: "Ouvrez les portes de la civilisation européenne."
 nd_rus.8.b: "Nous sommes la forteresse de la vraie foi."
 nd_rus.9.t: "La troisième Rome monte"
 nd_rus.9.d: "The unthinkable has been achieved. The double-headed eagle flies above the walls of Constantinople, and the great dome of the Hagia Sophia once again resounds with Orthodox liturgy. The prophecy of the monk Filofey is fulfilled: Moscow, the Third Rome, has reclaimed the Second.\n\nThe ruler of Russia now stands as the supreme leader of the Orthodox world, protector of millions of believers from the Balkans to the Caucasus. But how shall this universal authority be exercised? Through the spiritual prestige of the Ecumenical Throne, absorbing the Orthodox peoples into a commonwealth of faith? Or through the iron authority of a new Caesar, whose military might enforces the peace?"
 nd_rus.9.a: "Nous unirons les fidèles sous un même trône."
 nd_rus.9.b: "Que le monde tremble devant le nouveau César."
 nd_rus.10.t: "Ouverture de la route de l'Est"
 nd_rus.10.d: "Russian forces have crossed the Ural Mountains and seized Tobolsk, capital of the Siberian Khanate. The Khanate of Kazan, which long blocked the eastern road, has been subdued. The way into the boundless Siberian wilderness lies open.\n\nCossack scouts report rivers teeming with fish, forests dark with sable, and vast grasslands stretching to horizons beyond counting. An entire continent awaits not merely Moscow's flag but Russian settlers, institutions, and commerce."
 nd_rus.10.a: "Vers l'est ! Toujours vers l'est !"
 nd_rus.11.t: "La richesse de la Sibérie"
 nd_rus.11.d: "Russia's vast eastern territories have begun to yield their riches in earnest. Fur caravans stretch from the taiga to Moscow, the printing press has reached provincial capitals, Tobolsk has grown into a town, and Russian settlements dot the river systems from the Urals to the Yenisey. Siberia is no longer merely conquered: it is becoming productive.\n\nThe question now is how to extract and organize this wealth. The yasak system of fur tribute, imposed on native peoples in exchange for nominal protection, funnels enormous wealth to the treasury but at the cost of local stability. Alternatively, encouraging mass Russian settlement would permanently integrate Siberia but require a different investment in roads, farms, and administration."
 nd_rus.11.a: "Imposer le yasak. La Sibérie paiera son tribut."
 nd_rus.11.b: "Envoyez des colons. La Sibérie deviendra la Russie."
 nd_rus.12.t: "Le colosse continental"
 nd_rus.12.d: "Russia has achieved what no empire in history has matched: a continental domain stretching across eleven time zones, developed and administered, its institutions reaching from the Baltic to the Pacific watershed. The Enlightenment has penetrated even the remotest guberniyas, and the treasury reflects the wealth of a hundred peoples and a thousand rivers.\n\nThis colossus faces a fundamental choice in how to wield its continental mass. As a land power without equal, Russia can dominate the Eurasian heartland through sheer territorial depth and military doctrine. Or Russia can look beyond the continent, building a Pacific fleet to project power across the ocean and engage with the maritime civilizations of East Asia."
 nd_rus.12.a: "Nous sommes les seigneurs du continent."
 nd_rus.12.b: "Build a Pacific fleet. The ocean is next."
 STATIC_MODIFIER_NAME_nd_rus_dest_european_window: "Fenêtre européenne"
 STATIC_MODIFIER_DESC_nd_rus_dest_european_window: "La Russie ouvre ses portes à la culture, au commerce et aux idées européennes, en s’ouvrant sur le monde au-delà de la sphère orthodoxe."
 STATIC_MODIFIER_NAME_nd_rus_dest_orthodox_bastion: "Bastion orthodoxe"
 STATIC_MODIFIER_DESC_nd_rus_dest_orthodox_bastion: "La Troisième Rome se distingue de l’Occident latin et protestant, tirant sa force de la pureté de sa foi orthodoxe et de l’unité de son peuple."
 STATIC_MODIFIER_NAME_nd_rus_dest_ecumenical_throne: "Trône œcuménique"
 STATIC_MODIFIER_DESC_nd_rus_dest_ecumenical_throne: "The ruler of Russia sits upon the Ecumenical Throne, spiritual father of all Orthodox Christians, wielding the soft power of faith to bind nations in a commonwealth of believers."
 STATIC_MODIFIER_NAME_nd_rus_dest_new_caesar: "Le nouveau César"
 STATIC_MODIFIER_DESC_nd_rus_dest_new_caesar: "Un nouvel empereur romain s’est levé en Orient et le monde tremble devant le rétablissement de la puissance militaire de la Troisième Rome."
 STATIC_MODIFIER_NAME_nd_rus_dest_yasak_tribute: "Système d'hommage Yasak"
 STATIC_MODIFIER_DESC_nd_rus_dest_yasak_tribute: "Le système yasak extraie des tributs de fourrures des peuples sibériens, canalisant d’immenses richesses vers Moscou au détriment des relations locales avec les vaincus."
 STATIC_MODIFIER_NAME_nd_rus_dest_settler_wave: "Colonisation coloniale"
 STATIC_MODIFIER_DESC_nd_rus_dest_settler_wave: "Les colons russes affluent vers l’est par grandes vagues, établissant des villages et des fermes permanents qui lient irrévocablement la Sibérie à la mère patrie."
 STATIC_MODIFIER_NAME_nd_rus_dest_heartland_power: "Puissance du cœur"
 STATIC_MODIFIER_DESC_nd_rus_dest_heartland_power: "La Russie contrôle le cœur de l’Eurasie, ses armées soutenues par une profondeur continentale et une doctrine stratégique qui rendent la puissance navale inutile."
 STATIC_MODIFIER_NAME_nd_rus_dest_pacific_horizon: "Horizon Pacifique"
 STATIC_MODIFIER_DESC_nd_rus_dest_pacific_horizon: "La Russie construit une flotte dans le Pacifique et regarde au-delà du continent, s’engageant auprès des civilisations maritimes de l’Asie de l’Est tout en négligeant certaines constructions nationales."
 nd_rus_cathedral_of_east: "Cathédrale de l'Est"
 nd_rus_cathedral_of_east_desc: "Une magnifique cathédrale orthodoxe construite pour consacrer la revendication de la Russie en tant que Troisième Rome, rivalisant en splendeur avec les grandes églises de Constantinople et de Rome."
 nd_rus_cathedral_of_east_upkeep: "Liturgie de la Cathédrale"
 nd_rus_cathedral_of_east_upkeep_desc: "Les services liturgiques solennels qui soutiennent l'autorité spirituelle de la cathédrale, nécessitent de l'encens pour l'encensement, des pierres précieuses pour la décoration des icônes, du tissu fin pour les vêtements sacerdotaux et des bougies en cire d'abeille pour la nef."
 nd_rus_ostrog_fort: "Line Fortress"
 nd_rus_ostrog_fort_desc: "A bastioned fort of earth and timber on one of the fortified lines that the eighteenth century drew across southern Siberia, from Omsk up the Irtysh to Ust-Kamenogorsk. Its garrison holds the country behind it, where the fur tribute is gathered in peace."
 nd_rus_ostrog_fort_upkeep: "Line Garrison"
 nd_rus_ostrog_fort_upkeep_desc: "The garrison that mans the bastions and rides the patrols between the forts: weapons and firearms, lumber for repairs, leather for winter gear, and salt for provisions."
 mestnichestvo_bureaucracy: "Chamber of Genealogy"
 mestnichestvo_bureaucracy_desc: "The chamber set up in 1682, when Tsar Feodor III burned the books of precedence by which the boyar clans had claimed commands according to the rank of their forebears. Every noble house hands in its descent, and the clerks enter it in a single register, bound in 1687 as the Velvet Book. The clans keep their honor on paper. When the register is neglected they dispute it again at court and at the muster."
 pomestie_registry_bureaucracy: "Registre Pomestie"
 pomestie_registry_bureaucracy_desc: "Le système de terres de service conditionnel administré par le Razryadnyy Prikaz, accordant des domaines (pomestiya) aux serviteurs à cheval en échange d'un service militaire à vie. Contrairement à la votchina héréditaire, un pomestie revenait à la couronne si son détenteur ne parvenait pas à se rassembler, produisant une cavalerie salariée sans le fardeau d'une solde en espèces. Les commis du registre ont suivi les rôles, attribué des subventions et, au fil des générations, ont augmenté les paysans, cultivant ces terres de plus en plus près du servage formel, culminant avec l'Ulozheniye de 1649."
 prikazy_bureaucracy: "D'iaki"
 prikazy_bureaucracy_desc: "The clerks of the Muscovite state. A d'iak is a man of common birth who learned his letters as an under-clerk in one of the offices at Moscow and rose by his pen. He is paid in coin and in land, he drafts every decree, and the highest of his kind sit in the Duma beside the boyars who are his betters by birth. Unpaid, he lives on what petitioners bring him."
 oprichnina_bureaucracy: "Prikaz of Secret Affairs"
 oprichnina_bureaucracy_desc: "The private office of Tsar Alexis, kept from 1654 until his death in 1676. It has a d'iak and a handful of clerks, and no boyar or man of the Duma may enter it. Its clerks ride beside ambassadors and governors and write to the tsar what they see, and through it he gives orders that pass no council. The great houses resent an office that watches them and answers to no one else."
 nd_rus_bureaucracy_unlock: "Chancellerie moscovite"
 nd_rus_bureaucracy_unlock_desc: "La chancellerie grand-princière de Moscou se transforme en un appareil institutionnel formel, capable d'enregistrer les subventions de service, d'envoyer des missions diplomatiques et d'enrôler les serviteurs du royaume. C’est sur cette base que les institutions d’État distinctives de la Russie (le prikaz, le pomestie, le livre de préséance) commencent à prendre leur forme durable."
 AUTO_MODIFIER_NAME_nd_rus_bureaucracy_authority: "Chancellerie moscovite"
 AUTO_MODIFIER_DESC_nd_rus_bureaucracy_authority: "The grand-princely chancery at Moscow has matured into a permanent institutional apparatus: registering service grants, dispatching diplomatic missions, and enrolling the realm's servitors. From this foundation Russia's distinctive institutions of state begin to take their durable form. Russia can sustain three more standing institutions."
 yamskaya_sluzhba_bureaucracy: "Iamskaïa Sloujba"
 yamskaya_sluzhba_bureaucracy_desc: "Le système de relais postaux hérité par la Moscovie de ses suzerains mongols et formalisé sous le Yamskoy Prikaz, par lequel les courriers porteurs de décrets princiers se déplaçaient par étapes entre des stations d'igname espacées d'une journée de trajet le long des grandes routes. Le système transportait les commandes de Moscou jusqu'aux frontières en quelques jours plutôt qu'en semaines, tissant un royaume dont les distances auraient autrement défié toute règle centralisée. Il était soutenu par une corvée paysanne appelée yamskaya povinnost', et son réseau dense de stations servait également d'appareil de renseignement secret rendant compte des affaires locales à la chancellerie."
 sobornoye_ulozheniye_bureaucracy: "Syshchiki"
 sobornoye_ulozheniye_bureaucracy_desc: "Commissioners sent from Moscow to the southern and eastern districts to find peasants who have fled their lords. Since the code of 1649 there is no limit of years on a claim: whoever is written in the census books is returned, with his children and his goods, to the estate or the monastery he left. The landlords are served, and the road out of bondage is closed."
