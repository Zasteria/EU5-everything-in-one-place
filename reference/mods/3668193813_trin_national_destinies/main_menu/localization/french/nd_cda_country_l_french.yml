l_french:
 CDA: "Catalonia-Aragon"
 CDA_ADJ: "Catalan-Aragonais"
 CDA_f: "Empire aragonais"
 CDA_f_desc: "Forger la thalassocratie méditerranéenne catalane-aragonaise qui a brièvement lié l'Ibérie à l'Italie sous un seul souverain, la voie alternative de l'unification qui a pris fin lorsque la Castille a absorbé l'Aragon en 1469. Restaurer l'union personnelle multi-royaumes d'Alphonse V le Magnanime, détenant les sièges royaux de Barcelone, Naples et Palerme, et dirigeant l'Aragon, la Catalogne, Valence, les Baléares, la Sardaigne, la Sicile et le Mezzogiorno à partir d'une cour itinérante. Un empire marchand maritime composé de consulats catalans, de mercenaires d'Almogavar, du Consolat de Mar et de la Senyera Reial d'Aragon qui regardait vers l'est à travers la mer au lieu de regarder vers l'ouest en direction de la Castille."
