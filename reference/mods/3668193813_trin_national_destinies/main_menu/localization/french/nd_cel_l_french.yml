l_french:
 STATIC_MODIFIER_NAME_nd_cel_tir_na_saor: "Tir na Saor"
 STATIC_MODIFIER_DESC_nd_cel_tir_na_saor: "L’Union Celtique se construit non pas sur la conquête mais sur le droit partagé. Depuis les tribunaux brehonnais d'Irlande jusqu'aux cyfraith du Pays de Galles et aux lois des Bretons, les peuples celtes ont choisi la confédération plutôt que l'assujettissement, une terre où chaque nation garde sa langue et ses coutumes au sein d'un ensemble plus vaste."
 STATIC_MODIFIER_NAME_nd_cel_claidheamh_mor: "Claidhemh Mor"
 STATIC_MODIFIER_DESC_nd_cel_claidheamh_mor: "La Grande Épée est tirée. Des hommes à la hache de Gallowglass aux porteurs de Claymore des Highlands, des arbalétriers bretons aux ferblants de Cornouailles défendant leurs mines, les peuples celtes ont forgé une fraternité militaire qui transforme chaque flanc de colline en forteresse et chaque lande en terrain de massacre."
 nd_cel.1.t: "L'Union celtique"
 nd_cel.1.d: "The impossible has been achieved. From the mist-shrouded shores of Brittany to the wind-swept Hebrides, from the green valleys of Wales to the stone walls of Connacht, the Celtic peoples stand united for the first time since the Romans drove them to the western edges of the world.\n\nBut unity is not uniformity. The Gaels and Brythons, the Cornish and Bretons, each bring their own laws, their own songs, their own way of war. The question now is what binds this union together: shared law and cultural kinship, allowing each nation its own character within a confederal embrace? Or the brotherhood of arms, a Celtic military tradition that has terrified empires from Rome to London?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cel.1.a: "Tir na Saor. Nous sommes liés par la loi, pas par l'épée."
 nd_cel.1.b: "Claidhemh Mor. Laissez la Grande Épée parler au nom de tous les Celtes."
 nd_cel.2.t: "Codification des lois Bréhon"
 nd_cel.2.d: "The ancient Brehon legal tradition, preserved through centuries of oral transmission and monastic copying, has now been systematically codified for the Celtic Union. Where English common law relied on precedent and royal authority, the Brehon system was built on arbitration, restitution, and communal consensus.\n\nScholars have gathered the scattered texts, the Senchus Mor, the Book of Aicill, the laws of hospitality and kinship, and harmonized them with Welsh cyfraith and Breton coutumes into a unified Celtic legal code. The Brehon courts now sit in every town, their judges trained in a tradition older than any parliament."
 nd_cel.2.a: "Que la justice découle de la sagesse de nos ancêtres."
 nd_cel.3.t: "Le renouveau de l’art insulaire"
 nd_cel.3.d: "The scriptoria of the Celtic monasteries have entered a new golden age. Master illuminators trained in the intricate knotwork patterns of the Book of Kells and the Lindisfarne Gospels are producing manuscripts of breathtaking beauty. But this is no mere antiquarian exercise, the monks have adapted their ancient techniques to new subjects: histories, legal codes, natural philosophy, and navigational charts.\n\nThe swirling interlace designs that once adorned only gospel pages now grace the halls of learning across the Celtic lands. From Iona to Clonmacnoise, from St. David's to the abbeys of Brittany, the Celtic scriptorium tradition proves that beauty and scholarship are inseparable."
 nd_cel.3.a: "L'art ancien parle d'une voix nouvelle."
 nd_cel.4.t: "Le retour des oies sauvages"
 nd_cel.4.d: "For generations, the finest Celtic warriors sought service abroad, Irish regiments in the armies of France and Spain, Scottish mercenaries in Scandinavian service, Breton sailors under foreign flags. They called themselves the Wild Geese, exiles who dreamed of returning to a free Celtic homeland.\n\nNow that dream is real. Veterans hardened by battles at Fontenoy, Cremona, and a dozen other continental engagements are streaming home. They bring with them not just martial skill but knowledge of foreign tactics, siege engineering, diplomatic connections, and intelligence networks cultivated across European courts. The question is how to employ them."
 nd_cel.4.a: "Formez-les dans la Garde Celtique. Nos meilleurs soldats reviennent se battre."
 nd_cel.4.b: "Leurs relations à l’étranger valent plus que leurs épées."
 nd_cel_kern_warfare: "Guerre de Kern"
 nd_cel_kern_warfare_desc: "Le ceithearnach, infanterie légère d'escarmouche armée de javelots, d'arcs et d'épées courtes, a constitué l'épine dorsale des armées gaéliques pendant des siècles."
 nd_cel_dun_tradition: "Fortification de Dun"
 nd_cel_dun_tradition_desc: "La tradition celtique des forts et des ringforts, depuis les grands duns d'Irlande jusqu'aux brochs d'Écosse, constituait des places fortes défensives à travers le paysage."
 nd_cel_rundale_system: "Système Rundale"
 nd_cel_rundale_system_desc: "Le système rundale d'agriculture coopérative, où les terres arables étaient périodiquement redistribuées entre les familles, soutenait les communautés agricoles celtiques."
 nd_cel_cattle_economy: "Économie du bétail"
 nd_cel_cattle_economy_desc: "Dans le monde celtique, la richesse se mesurait en bétail. Les grandes foires aux bestiaux comme Ballinasloe attiraient des commerçants de toutes les îles."
 nd_cel_brehon_tradition: "Tradition Bréhon"
 nd_cel_brehon_tradition_desc: "The Brehon legal system, based on arbitration and restitution rather than punishment, governed Irish society for over a millennium."
 nd_cel_celtic_horsemanship: "Équitation celtique"
 nd_cel_celtic_horsemanship_desc: "Les Celtes étaient des cavaliers réputés depuis l'Antiquité. Le hobelar, cavalier léger adapté aux terrains accidentés, était une innovation celtique adoptée même par les Anglais."
 nd_cel_island_galleys: "Galères de l'île"
 nd_cel_island_galleys_desc: "Le Birlinn, la galère des West Highlands, était le navire de guerre des seigneurs des îles et des chefs des Hébrides, rapide, maniable et mortel dans les eaux côtières."
 nd_cel_monastic_learning: "Apprentissage monastique"
 nd_cel_monastic_learning_desc: "Les monastères celtiques d'Iona, de Clonmacnoise et de Bangor étaient des centres d'apprentissage à une époque où une grande partie de l'Europe avait oublié de lire."
 nd_cel_bardic_schools: "Écoles bardiques"
 nd_cel_bardic_schools_desc: "Les écoles bardiques formaient les poètes aux mètres complexes et aux connaissances généalogiques requises d'un filid. Un maître barde avait un statut égal à celui d’un roi."
 nd_cel_wool_trade: "Commerce de la laine celtique"
 nd_cel_wool_trade_desc: "Scottish and Irish wool, processed through Cistercian monastic estates, was a prized export to the textile markets of Flanders.\n\n#italic Available in: $nd_cel_clachan$#!"
 nd_cel_tanistry: "Tanistique"
 nd_cel_tanistry_desc: "The Celtic system of succession by the most capable kinsman, rather than primogeniture, produced capable leaders but also succession disputes."
 nd_cel_monastic_seafaring: "Navigation monastique"
 nd_cel_monastic_seafaring_desc: "Les moines celtes étaient de remarquables voyageurs. La navigation légendaire de Saint Brendan sur l'Atlantique reflète une véritable tradition de navigation monastique en currachs."
 nd_cel_atlantic_seamanship: "Matelotage dans l'Atlantique"
 nd_cel_atlantic_seamanship_desc: "Les marins celtes maîtrisaient les eaux dangereuses de l'Atlantique bien avant l'ère de la voile, construisant des ports et des havres de Galway à Brest."
 nd_cel_fianna_tradition: "Tradition Fianna"
 nd_cel_fianna_tradition_desc: "Les Fianna étaient des bandes de guerriers mythologiques qui vivaient dans la nature, entraînés à la fois aux armes et à la poésie. Leur tradition a inspiré les formations de bandes d'élite."
 nd_cel_hedge_schools: "Écoles de haie"
 nd_cel_hedge_schools_desc: "When penal laws banned Catholic and Irish-language education, the hedge school masters taught in secret, in fields, behind hedges, in barns, keeping learning alive."
 nd_cel_mercenary_tradition: "Tradition mercenaire"
 nd_cel_mercenary_tradition_desc: "Les guerriers celtes ont servi comme mercenaires à travers l'Europe pendant des siècles, Gallowglass au service des Irlandais, les Écossais dans les armées suédoises, les Irlandais dans les régiments français et espagnols."
 nd_cel_gaelic_lordship: "Seigneurie gaélique"
 nd_cel_gaelic_lordship_desc: "La consolidation des seigneuries gaéliques sous l'Union celtique rassemble les tuatha dispersés en une structure politique cohérente."
 nd_cel_cornish_mining: "Exploitation minière de Cornouailles"
 nd_cel_cornish_mining_desc: "Cornwall's tin and copper mines have been worked since the Bronze Age. Cornish mining expertise was exported across the world. The tinners smelt their black tin in blowing houses on the moor."
 nd_cel_guerrilla_warfare: "Guérilla"
 nd_cel_guerrilla_warfare_desc: "Les guérilleros forestiers, des guérilleros forestiers, ont perfectionné leurs tactiques d'embuscade dans les bois denses et les tourbières des terres celtiques."
 nd_cel_brehon_revival: "Le renouveau de Bréhon"
 nd_cel_brehon_revival_desc: "The systematic revival and codification of Brehon law provides the Celtic Union with a legal tradition distinct from English common law.\n\n#italic Available in: $nd_cel_brehon_court$#!"
 nd_cel_language_revival: "Renaissance de la langue"
 nd_cel_language_revival_desc: "Organized efforts to preserve and promote Gaelic, Welsh, Breton, and Cornish, binding the Celtic peoples through their shared linguistic heritage. Scriptures, grammars and verse are set in type in the old tongues.\n\n#italic Available in: $nd_cel_scriptorium$#!"
 nd_cel_celtic_trade_league: "Ligue commerciale celtique"
 nd_cel_celtic_trade_league_desc: "Un réseau commercial panceltique reliant les ports de Dublin, Glasgow, Cardiff, Brest et Falmouth pour un avantage commercial mutuel."
 nd_cel_celtic_christianity: "Christianisme celtique"
 nd_cel_celtic_christianity_desc: "Le christianisme celtique, avec l'accent mis sur les communautés monastiques, la peregrinatio et l'autonomie locale, offre un chemin distinctif entre Rome et la réforme."
 nd_cel_siege_resilience: "Résilience au siège"
 nd_cel_siege_resilience_desc: "Des siècles de défense contre des envahisseurs plus importants ont appris aux peuples celtes à faire de chaque traversée de colline et de rivière un obstacle mortel."
 nd_cel_wild_geese_tradition: "Tradition des oies sauvages"
 nd_cel_wild_geese_tradition_desc: "Les Oies sauvages, soldats celtes ayant servi dans les armées continentales, rapportent dans leur pays un savoir-faire militaire durement acquis."
 nd_cel_smuggling_networks: "Réseaux de contrebande"
 nd_cel_smuggling_networks_desc: "Celtic coastal communities developed extensive smuggling networks to evade English trade restrictions, moving goods through hidden coves and remote harbors."
 nd_cel_constitutional_tradition: "Tradition constitutionnelle"
 nd_cel_constitutional_tradition_desc: "S'appuyant sur la tradition juridique brehonienne, le cyfraith gallois et la pensée des Lumières, l'Union celtique développe son propre cadre constitutionnel."
 nd_cel_atlantic_fisheries: "Pêches de l'Atlantique"
 nd_cel_atlantic_fisheries_desc: "The rich fishing grounds of the Celtic Sea and North Atlantic sustain coastal communities and provide a steady supply of experienced sailors. Pilchards and sardines are salted and pressed in the fish cellars of the coves."
 nd_cel_linen_industry: "Industrie du Lin"
 nd_cel_linen_industry_desc: "Irish and Scottish linen production, from flax cultivation to bleaching and weaving, becomes a major export industry. Beetling mills on the rivers give the web its close finish and sheen."
 nd_cel_penal_resistance: "Résistance pénale"
 nd_cel_penal_resistance_desc: "L’expérience de survivre à des siècles de législation pénale et de répression culturelle a forgé une volonté collective inébranlable."
 nd_cel_industrial_heartlands: "Cœurs industriels"
 nd_cel_industrial_heartlands_desc: "Le charbon gallois et le fer écossais sont à l'origine de la révolution industrielle celtique, transformant les vallées et les plaines en ateliers du monde."
 nd_cel_literary_renaissance: "Renaissance littéraire"
 nd_cel_literary_renaissance_desc: "Une floraison de littérature en langue celtique, depuis les poèmes ossianiques jusqu'à la tradition galloise eisteddfod, inspire la conscience nationale."
 nd_cel_cooperative_movement: "Mouvement coopératif"
 nd_cel_cooperative_movement_desc: "S'appuyant sur d'anciennes traditions d'agriculture communautaire et d'entraide, le mouvement coopératif celtique transforme le secteur bancaire et l'agriculture."
 nd_cel_pan_celtic_congress: "Congrès panceltique"
 nd_cel_pan_celtic_congress_desc: "Les délégués de toutes les nations celtes se réunissent pour coordonner leurs politiques, célébrer leur patrimoine commun et présenter un front diplomatique uni."
 nd_cel_national_army: "Armée nationale celtique"
 nd_cel_national_army_desc: "La professionnalisation de l'armée celtique, s'appuyant sur des générations de traditions martiales, de Gallowglass à Wild Geese."
 a_nd_cel_ceithearnach: "Ceithearnach"
 a_nd_cel_ceithearnach_desc: "Infanterie légère d'escarmouche armée de javelots et d'épées courtes. Rapide et agressif, le Kern harcelait ses ennemis avec des tirs de missiles avant de se rapprocher au corps à corps."
 n_nd_cel_birlinn: "Birlin"
 n_nd_cel_birlinn_desc: "La cuisine West Highland, propulsée à la fois par voile et par rame. Rapide et maniable dans les eaux côtières, le birlinn était le navire de guerre des seigneurs des Hébrides."
 a_nd_cel_fianna: "Fianna"
 a_nd_cel_fianna_desc: "Infanterie de bande d'élite inspirée de la mythologique Fianna. Ces troupes de choc combinent charges féroces et discipline de fer."
 a_nd_cel_woodkern: "Boiserie"
 a_nd_cel_woodkern_desc: "Des guérilleros forestiers qui excellent dans les embuscades et le harcèlement sur les terrains boisés et vallonnés. Le cauchemar de toute armée d’occupation."
 a_nd_cel_wild_geese: "Oies sauvages"
 a_nd_cel_wild_geese_desc: "Vétérans du service continental, ces soldats aguerris allient la férocité martiale celtique à la discipline tactique européenne."
 n_nd_cel_currach: "Pillard de Currach"
 n_nd_cel_currach_desc: "Un navire rapide et léger construit pour les raids côtiers de l'Atlantique. La tradition du currach remonte à des millénaires et ces navires excellent dans le blocus et le harcèlement des navires ennemis."
 nd_cel_dun_fort: "Fort de Dun"
 nd_cel_dun_fort_desc: "Une colline celtique construite selon d'anciens principes défensifs, un terrain dominant, d'épais murs de pierre et des provisions pour un long siège."
 nd_cel_scriptorium: "Scriptorium"
 nd_cel_scriptorium_desc: "Un centre d'écriture monastique de tradition insulaire, produisant des manuscrits enluminés et formant la prochaine génération d'érudits."
 nd_cel_rath_market: "Marché de Rath"
 nd_cel_rath_market_desc: "Un marché celtique traditionnel et un lieu de rassemblement sur un ancien site de Rath, où les foires aux bestiaux, le commerce et les procédures judiciaires de Brehon soutiennent la communauté rurale."
 nd_cel_teach_ceoil: "Enseigner Ceoil"
 nd_cel_teach_ceoil_desc: "Une Maison de la Musique où les bardes se forment aux arts anciens de la poésie, de la généalogie et de la composition musicale, cœur culturel de la civilisation celtique."
 nd_cel_clachan: "Clachan"
 nd_cel_clachan_desc: "Une coopérative agricole organisée selon le système rundale, où les familles travaillent sur des terres partagées et mettent en commun leur bétail."
 nd_cel_port_dunan: "Port-Dunan"
 nd_cel_port_dunan_desc: "Un port côtier celtique construit à la fois pour le commerce et la guerre, abritant birlinns et currachs dans son mouillage protégé."
 nd_cel_brehon_court: "Cour de Bréhon"
 nd_cel_brehon_court_desc: "Un tribunal fonctionnant selon la tradition brehonienne, où des juristes qualifiés arbitrent les différends selon les principes juridiques celtiques."
 nd_cel_dun_garrison: "Garnison de Dun"
 nd_cel_dun_garrison_desc: "Armes et provisions pour entretenir la garnison défensive du fort de Dun."
 nd_cel_manuscript_production: "Production de manuscrits"
 nd_cel_manuscript_production_desc: "Les moines produisent des manuscrits enluminés et des ouvrages savants dans la tradition insulaire."
 nd_cel_cattle_fair: "Foire aux bestiaux"
 nd_cel_cattle_fair_desc: "Des foires aux bestiaux régulières attirent des commerçants de toutes les terres celtes."
 nd_cel_bardic_upkeep: "Patronage bardique"
 nd_cel_bardic_upkeep_desc: "Soutenir les bardes nécessite une hospitalité et des vêtements raffinés dignes de leur statut élevé."
 nd_cel_communal_farming: "Agriculture Communautaire"
 nd_cel_communal_farming_desc: "The township turns its shared grazing to sheep and shears wool for trade."
 nd_cel_harbor_upkeep: "Entretien du port"
 nd_cel_harbor_upkeep_desc: "Bois et fournitures pour l'entretien du port et de sa flotte."
 nd_cel_rundale_upkeep: "Rundale Upkeep"
 nd_cel_rundale_upkeep_desc: "Spades, timber and breeding stock for a township that works its infield in shared strips."
 nd_cel_vernacular_press: "Vernacular Press"
 nd_cel_vernacular_press_desc: "A press beside the writing room sets scriptures, grammars and verse in type in Gaelic, Welsh, Breton and Cornish."
 nd_cel_hedge_school: "Hedge School"
 nd_cel_hedge_school_desc: "A master and his scholars in a barn, a cabin by the ditch or the lee of a hedge. Reading, arithmetic, Latin and the old verse are taught for a fee of turf and meal, out of sight of the magistrates."
 nd_cel_hedge_school_upkeep: "Hedge School Upkeep"
 nd_cel_hedge_school_upkeep_desc: "Paper, slates and a few battered books passed from hand to hand."
 nd_cel_blowing_house: "Blowing House"
 nd_cel_blowing_house_desc: "The tinners' smelting house on a moorland stream. Black tin from the stream works is blown to white metal with charcoal and a water-driven bellows, then carried to the coinage town to be assayed and stamped."
 nd_cel_tin_blowing: "Tin Blowing"
 nd_cel_tin_blowing_desc: "Black tin is smelted over charcoal under the blast of a bellows and cast into blocks."
 nd_cel_pilchard_cellar: "Pilchard Cellar"
 nd_cel_pilchard_cellar_desc: "The fish palace of a Cornish cove, the press of a Breton port. The catch is laid in salt against the walls for a month, then packed in casks and pressed for the Lenten markets of the south."
 nd_cel_pilchard_curing: "Pilchard Curing"
 nd_cel_pilchard_curing_desc: "Pilchards and sardines are bulked in salt, packed head outward in casks and pressed."
 nd_cel_beetling_mill: "Beetling Mill"
 nd_cel_beetling_mill_desc: "The last stage of linen. Rows of wooden beetles lifted by a water wheel pound the bleached web for days until the weave closes and takes a sheen."
 nd_cel_linen_beetling: "Linen Beetling"
 nd_cel_linen_beetling_desc: "Bleached linen is pounded under water-driven beetles into fine damask and cambric."
 nd_cel_formal_jurisprudence: "Jurisprudence formelle"
 nd_cel_formal_jurisprudence_desc: "Papier et cire à cacheter pour l'administration formelle du code juridique Brehon relancé."
 STATIC_MODIFIER_NAME_nd_cel_brehon_codified: "Loi Bréhon codifiée"
 STATIC_MODIFIER_DESC_nd_cel_brehon_codified: "La codification systématique du droit Brehon assure une cohérence juridique dans l'ensemble de l'Union celtique."
 STATIC_MODIFIER_NAME_nd_cel_insular_art: "Renaissance de l’art insulaire"
 STATIC_MODIFIER_DESC_nd_cel_insular_art: "Une renaissance de l'enluminure de manuscrits celtiques et de la tradition artistique enrichit la vie culturelle de l'union."
 STATIC_MODIFIER_NAME_nd_cel_wild_geese_return_a: "La Garde Celtique"
 STATIC_MODIFIER_DESC_nd_cel_wild_geese_return_a: "Les Oies sauvages de retour forment un corps de garde d'élite, apportant une expertise militaire continentale aux armées celtiques."
 STATIC_MODIFIER_NAME_nd_cel_wild_geese_return_b: "Les yeux de toute l’Europe"
 STATIC_MODIFIER_DESC_nd_cel_wild_geese_return_b: "Les Oies sauvages de retour exploitent leurs connexions continentales pour obtenir un avantage diplomatique et la collecte de renseignements."
 levy_nd_cel_fianna: "Bande de guerre Fianna"
 levy_nd_cel_fianna_desc: "Bandes de guerriers d'élite élevées dans la tradition de la mythologique Fianna."
 nd_cel_formed_tt: "L'Union celtique a été créée"
 nd_cel_path_a_tt: "Choisissez Tir na Saor"
 nd_cel_path_b_tt: "Choisissez Claidheamh Mor"
 nd_cel_destiny: "Destin celtique"
 nd_cel_destiny_desc: "L’Union Celtique reste unie. Maintenant commence le travail de construction d’une nation digne de ce nom, que ce soit par le biais d’une loi et d’une culture partagées, ou par la force des armes celtes."
 nd_cel_dest_brehon_accord: "L'accord Bréhon"
 nd_cel_dest_brehon_accord_desc: "Establish a unified legal code across all Celtic lands, embracing the ancient Brehon tradition of arbitration and restitution to bind the union's diverse peoples under shared law. Rennes, whose courts keep the written custom of Brittany, is held and built up."
 nd_cel_dest_rennes_developed_tt: "#bold Rennes#! is owned directly and has at least #bold 31#! development"
 nd_cel_dest_celtic_academy: "L'Académie celtique"
 nd_cel_dest_celtic_academy_desc: "Found a great center of learning that draws scholars from every Celtic nation, advancing knowledge and nurturing the institutions needed for a modern confederation. St Andrews, where the first university of Scotland was chartered, is held and built up to half again what it was."
 nd_cel_dest_st_andrews_developed_tt: "#bold St Andrews#! is owned directly and has at least #bold 29#! development"
 nd_cel_dest_celtic_renaissance: "La Renaissance celtique"
 nd_cel_dest_celtic_renaissance_desc: "Achieve a golden age of Celtic culture, a flowering of art, literature, and scholarship that proves the Celtic peoples are the equals of any civilization in Europe. Edinburgh, its city of printers and literary societies, is held and built up to twice what it was."
 nd_cel_dest_edinburgh_developed_tt: "#bold Edinburgh#! is owned directly and has at least #bold 51#! development"
 nd_cel_dest_march_duns_tt: "#bold Dun Forts#! stand in at least #bold 5#! owned locations"
 nd_cel_dest_dominion_harbours_tt: "#bold Port Dunans#! stand in at least #bold 3#! owned locations"
 nd_cel_dest_dublin_developed_tt: "#bold Dublin#! is owned directly and has at least #bold 58#! development"
 nd_cel_dest_celtic_march: "La marche celtique"
 nd_cel_dest_celtic_march_desc: "Reclaim the old Celtic territories of Cornwall and Cumbria from English control, pushing the borders of the union to their historic extent. The march is held by five Dun Forts."
 nd_cel_dest_atlantic_dominion: "Domination atlantique"
 nd_cel_dest_atlantic_dominion_desc: "Seize control of the northern seas by taking the Orkney Islands and establishing a foothold in Normandy, dominating the approaches to the Celtic heartland. Three Port Dunans shelter the fleets that keep them."
 nd_cel_dest_western_empire: "L'Empire d'Occident"
 nd_cel_dest_western_empire_desc: "Build a pan-Atlantic Celtic empire stretching from Iceland to Bordeaux, with London itself under Celtic rule, the final reversal of centuries of English domination. Dublin, seat of the high kingship, is held and built up to twice what it was."
 nd_cel.5.t: "Le chemin devant nous"
 nd_cel.5.d: "The Celtic Union is no longer a dream whispered in smoky halls or sung in half-remembered ballads. It is real, a nation of nations stretching from Brittany to the Hebrides. But the harder work lies ahead. Any fool can raise a banner; it takes wisdom to build something that endures.\n\nThe elders and chieftains, the bards and lawmakers, the merchants and sailors, all look to us now. The choices we make in these first years will echo through centuries."
 nd_cel.5.a: "Bâtissons quelque chose qui survivra à nous tous."
 nd_cel.6.t: "L'accord Bréhon"
 nd_cel.6.d: "From the hill of Tara to the courts of Rennes, the judges have spoken. A grand council of Brehon jurists, Welsh cyfreithwyr, and Breton coutumiers has produced something unprecedented: a unified Celtic legal code that honors the distinct traditions of each nation while binding them under common principles.\n\nThe Accord enshrines the old Celtic virtues, arbitration over punishment, restitution over revenge, the rights of the tuath alongside the authority of the ri. It is not an imitation of English common law or Roman civil law. It is something older, and perhaps something wiser."
 nd_cel.6.a: "La loi est le nerf qui lie nos nations."
 nd_cel.7.t: "Un Cheilteach d'Ollscoil"
 nd_cel.7.d: "The Celtic Academy has opened its doors. In a great hall that mingles the interlace patterns of Iona with the mathematical precision of the modern age, scholars from every Celtic nation gather to study, debate, and create.\n\nBut already a dispute has arisen about the Academy's purpose. Some argue it should focus on preserving and reviving the Celtic languages and arts, a bulwark against the cultural tide of larger neighbors. Others believe the Academy must look forward, embracing new sciences and practical knowledge to ensure the union's material prosperity."
 nd_cel.7.a: "Préserver notre patrimoine. Les langues passent en premier."
 nd_cel.7.b: "Adoptez les nouvelles sciences pour une union plus forte."
 nd_cel.8.t: "Aisling sur gCeilteach"
 nd_cel.8.d: "They call it the Celtic Vision, an Aisling made real. From the scriptoria of Clonmacnoise to the eisteddfodau of Wales, from the literary salons of Rennes to the music halls of Edinburgh, a cultural flowering is sweeping the Celtic lands that rivals any renaissance.\n\nPoets compose in Gaelic and Brythonic with a confidence not seen since the age of the bards. Artists blend the ancient knotwork tradition with new techniques. Scholars publish works of philosophy, natural history, and mathematics that command respect across Europe.\n\nThe question now is how to direct this energy. The filid, the master poets who once held status equal to kings, argue for a return to the ancient bardic tradition where culture serves the nation's soul. The new intellectuals counter that culture must also serve commerce and practical innovation."
 nd_cel.8.a: "La tradition filide : la culture comme âme de la nation."
 nd_cel.8.b: "Le nouvel apprentissage : la culture comme moteur du progrès."
 nd_cel.9.t: "La marche celtique"
 nd_cel.9.d: "Celtic banners fly over Cornwall and Cumbria for the first time in centuries. The tin mines of Kernow and the mountain passes of the north are ours. In village squares across the newly liberated territories, people who had almost forgotten their Celtic heritage are relearning the old tongues, rediscovering the songs their grandmothers sang in secret.\n\nThe English called us savages. Let them look upon what savages can build."
 nd_cel.9.a: "Les frontières du monde celtique s’élargissent."
 nd_cel.10.t: "Maîtres des mers du Nord"
 nd_cel.10.d: "The Norse jarl of Orkney has bent the knee. Celtic ships patrol from the Pentland Firth to the Seine estuary. On the Normandy coast, our foothold gives us a voice in continental affairs that no English king can ignore.\n\nThe Celtic peoples have always been mariners. From Saint Brendan's legendary voyages to the birlinn fleets of the Hebridean lords, the Atlantic has been our highway. Now it is becoming our domain. The question is what to do with this mastery."
 nd_cel.10.a: "Construisez une flotte de guerre pour contrôler ces eaux."
 nd_cel.10.b: "Plantez des colonies celtiques outre-Atlantique."
 nd_cel.11.t: "Ard Ri na nIarthar"
 nd_cel.11.d: "London has fallen to Celtic arms. The city that for centuries was the seat of power that ground the Celtic nations underfoot is now a Celtic possession. From Reykjavik's volcanic shores to the vineyards of Bordeaux, from the Orkneys to the Thames, the Celtic Union commands an empire that stretches across the entire western seaboard of Europe.\n\nThe ancient bards prophesied this day, when the scattered children of the Celts would rise as one and reclaim what was taken from them. The high kingship, the Ard Ri, is no longer a title from legend. It is the reality of a people who refused to disappear."
 nd_cel.11.a: "Règle par la force. Personne ne nous défiera plus."
 nd_cel.11.b: "Règle par le prestige. Que le monde reconnaisse notre grandeur."
 STATIC_MODIFIER_NAME_nd_cel_dest_aisling_mor_a: "Gardiens de la langue"
 STATIC_MODIFIER_DESC_nd_cel_dest_aisling_mor_a: "L'accent mis par l'Académie sur la préservation linguistique et culturelle renforce l'identité celtique, améliorant ainsi la production matérielle et les recettes fiscales dans toute l'union."
 STATIC_MODIFIER_NAME_nd_cel_dest_aisling_mor_b: "Les nouvelles sciences"
 STATIC_MODIFIER_DESC_nd_cel_dest_aisling_mor_b: "L'adoption par l'Académie des connaissances pratiques stimule le développement et le commerce, même si l'expansion rapide entraîne des pressions inflationnistes mineures."
 STATIC_MODIFIER_NAME_nd_cel_dest_fili_tradition_a: "Voix du Filide"
 STATIC_MODIFIER_DESC_nd_cel_dest_fili_tradition_a: "La renaissance de la tradition bardique étend la portée diplomatique celtique et guérit les cicatrices des conflits passés, rationalisant ainsi la gouvernance."
 STATIC_MODIFIER_NAME_nd_cel_dest_fili_tradition_b: "Moteur de progrès"
 STATIC_MODIFIER_DESC_nd_cel_dest_fili_tradition_b: "Le nouvel apprentissage transforme les arts celtiques en avantage commercial, responsabilisant les marchands tout en aiguisant les tactiques militaires."
 STATIC_MODIFIER_NAME_nd_cel_dest_sea_wolves_a: "Seigneurs des vagues"
 STATIC_MODIFIER_DESC_nd_cel_dest_sea_wolves_a: "Une puissante flotte de guerre celtique domine les mers du nord, même si l'accent mis sur la construction navale ralentit la récupération des forces terrestres."
 STATIC_MODIFIER_NAME_nd_cel_dest_sea_wolves_b: "Enfants de Brendan"
 STATIC_MODIFIER_DESC_nd_cel_dest_sea_wolves_b: "Suivant le sillage des légendaires moines-navigateurs, les colons celtes se sont répandus à travers l'Atlantique, construisant de nouvelles communautés dans des terres lointaines."
 STATIC_MODIFIER_NAME_nd_cel_dest_ard_ri_a: "La Justice du Haut Roi"
 STATIC_MODIFIER_DESC_nd_cel_dest_ard_ri_a: "L'Ard Ri règne grâce à la suprématie militaire, à une diplomatie rapide et au butin de la conquête."
 STATIC_MODIFIER_NAME_nd_cel_dest_ard_ri_b: "La gloire du Haut Roi"
 STATIC_MODIFIER_DESC_nd_cel_dest_ard_ri_b: "L'Ard Ri commande grâce au prestige et à la loyauté des peuples soumis, réduisant ainsi le coût de l'affirmation de la domination celtique."
 nd_cel_ceardlann: "Ceardlann"
 nd_cel_ceardlann_desc: "Un atelier celtique d'art et d'apprentissage où maîtres artisans, érudits et artistes collaborent pour produire des œuvres mêlant tradition ancienne et savoir moderne."
 nd_cel_ceardlann_maintenance: "Fournitures pour les érudits"
 nd_cel_ceardlann_maintenance_desc: "Du papier, du verre et des tissus fins pour soutenir les érudits et les artistes du Ceardlann."
 nd_cel_ard_dun: "Ard Dun"
 nd_cel_ard_dun_desc: "Une grande haute forteresse celtique commandant des approches stratégiques, construite pour résister à tout siège et garnir les armées de l'Empire d'Occident."
 nd_cel_ard_dun_maintenance: "Garnison de la forteresse"
 nd_cel_ard_dun_maintenance_desc: "Armes, pierres, bétail et outils pour entretenir la haute forteresse et sa garnison."

 # Bureaucracies: 7 historically-grounded Celtic-world institutions
 AUTO_MODIFIER_NAME_nd_cel_bureaucracy_authority: "Autorité confédérale"
 AUTO_MODIFIER_DESC_nd_cel_bureaucracy_authority: "The federal apparatus of the Celtic Union has matured into a permanent institutional framework, registering judgements of the brehons, the assemblies of the islands, the schools of the filidh, and the chartered courts of the tinners. Four of these institutions can be kept at a time."

 cel_brehon_law_bureaucracy: "Senchas Mar"
 cel_brehon_law_bureaucracy_desc: "Le corpus du droit coutumier irlandais ancien composé dans l'Ulster au VIIIe siècle et transmis par la suite par des familles juridiques héréditaires - les MacEgans du Connacht, les O'Davorens du Burren, les MacClancy de Thomond - dont les écoles ont survécu à la réforme de l'Église irlandaise du XIIe siècle et ont continué à être utilisées activement dans toutes les seigneuries gaéliques jusqu'à la reconquête des Stuart. Les brehons fonctionnaient comme des arbitres et des conseillers principaux plutôt que comme des juges au sens moderne du terme, et étaient traités comme des neutres dans tout conflit. Leurs jugements liaient les grands et les petits mais s'accordaient difficilement avec le privilège seigneurial."

 cel_cyfraith_hywel_bureaucracy: "Cyfraith Hywel"
 cel_cyfraith_hywel_bureaucracy_desc: "La tradition juridique galloise codifiée lors du synode de Hendy-gwyn-ar-Daf au milieu du Xe siècle sous Hywel Dda, survivant dans une quarantaine de livres de droit manuscrits et utilisée activement dans toutes les seigneuries marcheuses jusqu'aux Actes d'Union de 1535-1542. La loi galloise divisait la société en cinq classes juridiques, reconnaissait les droits des femmes dans le mariage et la propriété à un degré exceptionnel dans l'Europe médiévale, et était administrée par des ynaid (juges) professionnels plutôt que par des ecclésiastiques - ce qui la mettait en tension avec les revendications canoniques des évêques."

 cel_council_of_the_isles_bureaucracy: "Conseil des îles"
 cel_council_of_the_isles_bureaucracy_desc: "L'organe délibérant de la Seigneurie des Îles, qui s'est réuni sur Eilean na Comhairle dans le Loch Finlaggan sur Islay. Seize conseillers - quatre grands barons (Maclean de Duart, MacLeod de Harris, MacLeod de Lewis, Maclean de Loch Buie), quatre thanes (MacKinnon, MacNeil de Barra, MacNeil de Gigha et un autre) et quatre parents du clan Donald, en présence de l'abbé d'Iona et de l'évêque des îles - ont émis des chartes foncières et prononcé des jugements sous la présidence du MacDonald en tant que berger du Îles. Jacques IV limoge Finlaggan en 1493."

 cel_bardic_schools_bureaucracy: "Aos Dana"
 cel_bardic_schools_bureaucracy_desc: "Les familles savantes professionnelles héréditaires d'Irlande et d'Écosse gaéliques - filidh, seanchaidh, breithim, lucht ciuil - s'entraînaient pendant sept à douze ans dans les écoles bardiques qui se déroulaient de novembre à mai. Au milieu du XVIe siècle, plus de quatre cents de ces familles détenaient des concessions de terres exonérées d'impôts en échange de leurs services aux dynasties dirigeantes en tant que poètes, généalogistes, juristes, médecins et historiens. Le système s'est effondré avec la fuite des comtes en 1607 et la dépossession du patronage gaélique."

 cel_tanistry_bureaucracy: "Tanistique"
 cel_tanistry_bureaucracy_desc: "Succession élective gaélique de l'Irlande et de l'Écosse médiévales par laquelle le tanaïste - héritier présomptif et adjoint - était choisi du vivant du titulaire parmi les derbfine, la parenté de quatre générations d'agnats masculins éligibles. Le système favorisait le guerrier confirmé par rapport au premier-né, produisant des dirigeants capables mais aussi d'âpres querelles dynastiques lorsque les branches rivales d'une même maison faisaient valoir chacune leurs revendications. La tanistrie a été préservée dans la chefferie du clan des Highlands et la seigneurie irlandaise jusqu'à son abolition formelle sous Jacques VI en 1607."

 cel_coyne_and_livery_bureaucracy: "Coyne et livrée"
 cel_coyne_and_livery_bureaucracy_desc: "Le prélèvement gratuit de logement et de nourriture (coinmheadh ​​irlandais est buannacht) par lequel les seigneurs gaéliques et hiberno-normands soutenaient leur kern, leur potence et leurs cavaliers sur la population - l'impôt le plus important de l'Irlande de la fin du Moyen Âge. Coyne fournissait de la nourriture et de la literie aux soldats du seigneur ; la livrée fournissait du fourrage et des écuries pour leurs chevaux. L'administration Tudor a interdit cette pratique, la qualifiant de « damnable », mais elle est restée le fondement indispensable de la puissance militaire gaélique jusqu'à ce que les Plantations la balayent."

 cel_stannary_charter_bureaucracy: "Charte Stannaire"
 cel_stannary_charter_bureaucracy_desc: "Institution minière d'étain de Cornouailles, agréée par le roi Jean en 1201 et confirmée par Édouard III en 1337 avec la création du duché de Cornouailles. Vingt-quatre stannateurs - six élus dans chacun des quatre stannaries de Tywarnhaile, Blackmoor, Foweymoore et Penwith - se sont réunis à Crockern Tor et à Truro pour légiférer sur les limites de l'étain, exemptés des impôts communs et de toute juridiction à l'exception des tribunaux de Stannary. Leur parlement détenait un veto sur les lois de Westminster affectant l'exploitation minière ; suspendue par Henri VII en 1496, elle fut restaurée par Charte de Grâce en 1508."
