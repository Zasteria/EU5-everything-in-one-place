l_french:
 MCA: "Muisca"
 MCA_ADJ: "Musique"
 MCA_f: "Confédération Muisca"
 MCA_f_desc: "La Confédération Muisca regroupe les chefferies des hauts plateaux de l'Altiplano Cundiboyacense sous une seule autorité politique. En réunissant les domaines des Zipa à Bacat et des Zaque à Hunza, aux côtés de l'enceinte sacrée de Suamox, une confédération de maîtres orfèvres et marchands d'émeraudes apparaît comme la puissance dominante des hauts plateaux colombiens."
