l_french:
 STATIC_MODIFIER_NAME_nd_thunder_of_sango: "Tonnerre de Sango"
 STATIC_MODIFIER_DESC_nd_thunder_of_sango: "Le déifié Alaafin Sango, seigneur du tonnerre et de la foudre, veille sur nos cavaliers. En son nom, les charges de cavalerie qui ont secoué la savane résonneront à nouveau."
 STATIC_MODIFIER_NAME_nd_voice_of_the_oyo_mesi: "Voix de l'Oyo Mesi"
 STATIC_MODIFIER_DESC_nd_voice_of_the_oyo_mesi: "Les sept conseillers parlent au nom du peuple. Grâce à la sagesse des Bashorun et à l’équilibre des Ogboni, aucun tyran ne pourra régner sans contrôle à Oyo."
 nd_oye.1.t: "L'empire Oyo s'élève"
 nd_oye.1.d: "The scattered Yoruba kingdoms have been united under a single Alaafin. From the sacred city of Ile-Ife to the frontier marches, the Oyo Empire now commands the allegiance of millions. But what kind of empire shall this be? The memory of Sango (the third Alaafin, deified as the god of thunder) calls for military glory and cavalry supremacy. Yet the Oyo Mesi, the council of seven, reminds us that Oyo's true strength lies not in the charge of horsemen alone but in the constitutional balance that prevents any single hand from holding too much power. The Bashorun awaits our answer. The Ogboni elders watch. The decision we make now will echo through the ages.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_oye.1.a: "Laissez parler le tonnerre ! Sango chevauche avec notre cavalerie."
 nd_oye.1.b: "L'Oyo Mesi nous guidera. Aucun roi ne règne seul."
 nd_oye.2.t: "L'Eso d'Ikoyi"
 nd_oye.2.d: "À la caserne d'Ikoyi, soixante-dix jeunes chefs de guerre ont été officiellement investis sous le nom d'Eso : le corps de cavalerie d'élite de l'empire. Nommés par l'Oyo Mesi et confirmés par l'Alaafin, ces guerriers vivent selon un code comparable aux ordres chevaleresques des terres lointaines. Les Eso constitueront l'épine dorsale de nos armées, mais une question se pose : doivent-ils rester un corps d'élite distinct relevant uniquement de l'Alaafin, ou doivent-ils être répartis entre les armées provinciales pour renforcer l'ensemble ?"
 nd_oye.2.a: "Les Eso appartiennent aux Alaafin : une épée à part."
 nd_oye.2.b: "Répartissez-les largement. Chaque armée bénéficiera de leurs compétences."
 STATIC_MODIFIER_NAME_nd_oye_eso_spirit: "Esprit de l'Eso"
 STATIC_MODIFIER_DESC_nd_oye_eso_spirit: "Les soixante-dix chefs de guerre d'Ikoyi chevauchent comme un seul corps de cavalerie d'élite dont le dévouement inspire le respect."
 STATIC_MODIFIER_NAME_nd_oye_cavalry_integration: "Intégration de la cavalerie"
 STATIC_MODIFIER_DESC_nd_oye_cavalry_integration: "L'expertise de l'Eso a été répartie dans toute l'armée, augmentant la qualité de chaque formation."
 nd_oye.3.t: "L'ascendant Bashorun"
 nd_oye.3.d: "Le Bashorun, chef de l’Oyo Mesi, a gagné en autorité. En tant que premier ministre de l'empire, le Bashorun exerce désormais une influence qui rivalise avec celle d'Alaafin lui-même. Dans les cas les plus extrêmes, la tradition accorde au Bashorun le terrible pouvoir de la calebasse : le droit d'offrir à l'Alaafin des œufs de perroquet, l'obligeant à l'abdication rituelle si son règne a sombré dans la tyrannie. C’est là le génie constitutionnel d’Oyo : le pouvoir contrôlé par le pouvoir, l’autorité contrebalancée par la responsabilité. Mais de quel côté la balance va-t-elle pencher ?"
 nd_oye.3.a: "Le Bashorun parle au nom du peuple. Renforcez le conseil."
 nd_oye.3.b: "L'Alaafin est souverain. Réaffirmez l’autorité royale."
 STATIC_MODIFIER_NAME_nd_oye_bashorun_power: "Ascendance Bashorun"
 STATIC_MODIFIER_DESC_nd_oye_bashorun_power: "Le Bashorun et l’Oyo Mesi exercent une surveillance étroite, garantissant une gouvernance responsable au prix d’une action royale décisive."
 STATIC_MODIFIER_NAME_nd_oye_alaafin_reassertion: "Résurrection d'Alaafin"
 STATIC_MODIFIER_DESC_nd_oye_alaafin_reassertion: "L'Alaafin a réaffirmé le mandat divin du trône, concentrant l'autorité pour un règne rapide et décisif."
 nd_oye.4.t: "Dahomey subjugué"
 nd_oye.4.d: "Après des années de campagne, le Royaume du Dahomey a été contraint d'accepter la suzeraineté d'Oyo. Un tribut annuel en cauris, en tissus et en esclaves affluera vers le nord jusqu'à la cour d'Alaafin. Plus important encore, Oyo contrôle désormais les routes vers les ports côtiers (Ajase, Badagry et les villes lagunaires), ouvrant ainsi l'empire au commerce atlantique. Les rois Fon peuvent s'irriter sous notre joug, mais pour l'instant la cavalerie de l'Eso a parlé et le Dahomey a écouté."
 nd_oye.4.a: "Laissez couler l’hommage. La portée d'Oyo s'étend jusqu'à la mer."
 nd_oye.5.t: "L'Aare-Ona-Kakanfo"
 nd_oye.5.d: "Une nouvelle institution a été créée : l'Aare-Ona-Kakanfo, commandant suprême de toutes les armées d'Oyo sur le terrain. Par tradition, les Aare-Ona-Kakanfo doivent résider dans une province frontalière, gardant le plus grand guerrier de l'empire loin de la capitale et de toute tentation de s'emparer du trône. Il commande personnellement chaque campagne et son autorité sur le champ de bataille est absolue. C'est la réponse d'Oyo au dilemme éternel des États militaires : comment maintenir une armée puissante sans laisser son commandant devenir une menace pour l'État."
 nd_oye.5.a: "La frontière ne sera jamais sans surveillance."
 nd_oye_sacred_origins: "Origines sacrées d'Ile-Ife"
 nd_oye_sacred_origins_desc: "L'héritage spirituel d'Ile-Ife, berceau du peuple Yoruba, insuffle à notre empire un dessein divin et une profondeur culturelle."
 nd_oye_mounted_traditions: "Traditions montées"
 nd_oye_mounted_traditions_desc: "Le contact avec les peuples Nupe et Saharien a enseigné aux Yoruba l'art de la guerre à cheval, commençant une tradition de cavalerie qui définirait l'identité militaire d'Oyo."
 nd_oye_ogboni_authority: "Autorité Ogboni"
 nd_oye_ogboni_authority_desc: "La société secrète Ogboni, composée d'hommes libres âgés, sert de contrôle judiciaire à la fois aux Alaafin et aux Oyo Mesi."
 nd_oye_yoruba_guilds: "Guildes artisanales yoruba"
 nd_oye_yoruba_guilds_desc: "Des guildes d'artisans spécialisés produisent des tissus, des ferronneries, des perles et des poteries d'une qualité remarquable, destinées à l'usage local et à l'exportation."
 nd_oye_walled_towns: "Villes fortifiées"
 nd_oye_walled_towns_desc: "D'énormes fortifications en terre, les odi, entourent les villes yoruba, offrant une formidable défense contre les pillards et les royaumes rivaux."
 nd_oye_yam_cultivation: "Culture de l'igname"
 nd_oye_yam_cultivation_desc: "L'agriculture intensive d'ignames et de céréales fait vivre les populations denses des villes yoruba."
 nd_oye_oyo_mesi: "Conseil d'Oyo Mesi"
 nd_oye_oyo_mesi_desc: "Les sept principaux conseillers de l’empire servent à la fois de collège électoral et d’organe législatif, représentant la voix de la nation."
 nd_oye_eso_training: "Entraînement de cavalerie Eso"
 nd_oye_eso_training_desc: "A la caserne d'Ikoyi, les soixante-dix chefs de guerre Eso entraînent la cavalerie d'élite de l'empire à l'art du combat monté."
 nd_oye_afin_tradition: "Tradition du palais Afin"
 nd_oye_afin_tradition_desc: "L'Afin, le complexe du palais d'Alaafin, constitue le cœur cérémoniel et administratif de l'empire Oyo."
 nd_oye_sango_cult: "Culte Sango"
 nd_oye_sango_cult_desc: "Le culte de Sango, le troisième Alaafin déifié et seigneur du tonnerre, renforce la légitimité royale et inspire la dévotion."
 nd_oye_horse_trade: "Commerce de chevaux transsaharien"
 nd_oye_horse_trade_desc: "La cavalerie d'Oyo dépend d'un approvisionnement régulier en chevaux importés à travers le Sahara, échangés contre des noix de cola, des textiles et d'autres biens."
 nd_oye_textile_expansion: "Industrie textile"
 nd_oye_textile_expansion_desc: "Les tisserands yoruba produisent le célèbre tissu aso-oke, un textile de luxe commercialisé dans toute l'Afrique de l'Ouest et au-delà."
 nd_oye_bashorun_system: "Établissement Bashorun"
 nd_oye_bashorun_system_desc: "Le Bashorun, chef de l'Oyo Mesi, est premier ministre et a le pouvoir de contrôler même l'Alaafin lui-même."
 nd_oye_tributary_system: "Système tributaire"
 nd_oye_tributary_system_desc: "Grâce à la pression militaire et au savoir-faire diplomatique, Oyo a établi un réseau d’États tributaires, dont le puissant royaume du Dahomey."
 nd_oye_market_networks: "Réseaux de marché royaux"
 nd_oye_market_networks_desc: "Les Oja Oba, marchés royaux réglementés sous l'autorité des Alaafin, servent d'artères commerciales à l'empire."
 nd_oye_ifa_divination: "Divination Ifa"
 nd_oye_ifa_divination_desc: "L'oracle Ifa, administré par les prêtres d'Orunmila, conserve un vaste corpus de versets sacrés codant la connaissance et la sagesse yoruba."
 nd_oye_mounted_archer_corps: "Horse Archers of the Provinces"
 nd_oye_mounted_archer_corps_desc: "The provincial towns send light horse trained in archery to the wars of the seventeenth century. They extend the empire's reach across the savanna, screening the Esho and the heavy cavalry and raiding enemy supply lines."
 nd_oye_ajase_trade: "Ajase Commerce Atlantique"
 nd_oye_ajase_trade_desc: "Grâce au port côtier d'Ajase, Oyo se connecte au monde commercial atlantique, échangeant des marchandises avec des marchands européens et américains."
 nd_oye_egungun_tradition: "Tradition Egungun"
 nd_oye_egungun_tradition_desc: "Le culte de la mascarade d'Egungun honore les ancêtres disparus, renforçant les liens sociaux et l'identité culturelle à travers l'empire."
 nd_oye_aare_ona_kakanfo: "Aare-Ona-Kakanfo"
 nd_oye_aare_ona_kakanfo_desc: "Le commandant militaire suprême, obligé de vivre à la frontière, incarne la solution ingénieuse d'Oyo au problème de la puissance militaire qui menace la stabilité politique."
 nd_oye_vassal_administration: "Administration vassale"
 nd_oye_vassal_administration_desc: "Le système tributaire sophistiqué d'Oyo extrait richesse et loyauté des royaumes sujets tout en leur accordant une autonomie significative."
 nd_oye_kola_dominance: "Dominance de la noix de Kola"
 nd_oye_kola_dominance_desc: "Le contrôle du commerce de la noix de cola, stimulant prisé dans tout le Sahel et au-delà, donne à Oyo un énorme levier économique."
 nd_oye_constitutional_balance: "Équilibre constitutionnel"
 nd_oye_constitutional_balance_desc: "L'équilibre tripartite entre Alaafin, Oyo Mesi et Ogboni garantit qu'aucune institution ne peut dominer la gouvernance d'Oyo."
 nd_oye_ogun_smithing: "Travail des métaux d'Ogun"
 nd_oye_ogun_smithing_desc: "Sous le patronage d'Ogun, divinité du fer et de la guerre, les forgerons yoruba forgent des armes et des outils d'une qualité exceptionnelle."
 nd_oye_yoruba_urbanization: "Urbanisation yoruba"
 nd_oye_yoruba_urbanization_desc: "Les villes denses et prospères du pays Yoruba comptent parmi les plus grandes d’Afrique de l’Ouest et sont des centres de vie artisanale, commerciale et culturelle."
 nd_oye_indigo_trade: "Commerce de teinture à l'indigo"
 nd_oye_indigo_trade_desc: "Les teinturiers yoruba maîtrisent l'art de l'indigo et produisent des textiles richement colorés qui coûtent cher sur les marchés régionaux."
 nd_oye_balogun_system: "Système Balogun"
 nd_oye_balogun_system_desc: "Les chefs de guerre provinciaux, les Balogun, commandent des armées professionnelles, assurant une hiérarchie militaire disciplinée sous l'Aare-Ona-Kakanfo."
 nd_oye_diplomatic_craft: "Artisanat diplomatique"
 nd_oye_diplomatic_craft_desc: "Les diplomates d'Oyo gèrent avec sophistication les relations complexes avec les commerçants européens, les royaumes voisins et les États tributaires."
 nd_oye_agricultural_reform: "Réforme agricole"
 nd_oye_agricultural_reform_desc: "L'amélioration des techniques agricoles et de la gestion des terres soutient la population et les centres urbains croissants de l'empire."
 nd_oye_firearms_adoption: "Adoption des armes à feu"
 nd_oye_firearms_adoption_desc: "Les armes à feu européennes sont intégrées dans l'armée d'Oyo aux côtés de la cavalerie traditionnelle, créant ainsi une force interarmes polyvalente."
 nd_oye_atlantic_commerce: "Commerce atlantique"
 nd_oye_atlantic_commerce_desc: "Le port d'Ajase prospère en tant que porte d'entrée d'Oyo vers le monde atlantique, canalisant les richesses du commerce intercontinental."
 nd_oye_royal_jurisprudence: "Jurisprudence royale"
 nd_oye_royal_jurisprudence_desc: "La codification du droit coutumier yoruba renforce le cadre juridique de l'empire et étend l'autorité royale."
 nd_oye_political_resilience: "Résilience politique"
 nd_oye_political_resilience_desc: "Les traditions constitutionnelles d'Oyo prouvent leur valeur en temps de crise, permettant à l'empire de survivre aux bouleversements internes."
 nd_oye_military_adaptation: "Adaptation militaire"
 nd_oye_military_adaptation_desc: "L'empire adapte ses traditions militaires à la nature changeante de la guerre, mêlant les prouesses de la cavalerie aux tactiques modernes."
 nd_oye_cultural_renaissance: "Renaissance culturelle yoruba"
 nd_oye_cultural_renaissance_desc: "L’épanouissement des arts, de la littérature et de la philosophie yoruba renforce l’identité culturelle à une époque de transformation mondiale."
 nd_oye_market_modernization: "Modernisation du marché"
 nd_oye_market_modernization_desc: "Les marchés yoruba traditionnels évoluent vers des centres commerciaux sophistiqués, intégrant de nouveaux produits et méthodes commerciales."
 nd_oye_confederal_reform: "Réforme confédérale"
 nd_oye_confederal_reform_desc: "La gouvernance décentralisée permet à divers peuples de conserver leur identité tout en contribuant à la force de l'empire."
 nd_oye_diaspora_traditions: "Traditions de la diaspora"
 nd_oye_diaspora_traditions_desc: "L'influence culturelle yoruba s'étend bien au-delà des frontières de l'empire, portée par les commerçants, les érudits et les courants de l'histoire."
 a_nd_oye_ilari: "Garde royale Ilari"
 a_nd_oye_ilari_desc: "Les Ilari sont les gardes du corps personnels des Alaafin, identifiables par leur tête à moitié rasée. Issus de la maison du palais, ils servent à la fois de gardes et de messagers de l'autorité royale."
 a_nd_oye_heavy_cavalry: "Cavalerie lourde Oyo"
 a_nd_oye_heavy_cavalry_desc: "Cavaliers en armure montés sur de grands chevaux importés de tout le Sahara. Cette cavalerie lourde délivre des charges de choc dévastatrices qui brisent les formations ennemies."
 a_nd_oye_heavy_cavalry_levy: "Cavalerie lourde Oyo"
 a_nd_oye_heavy_cavalry_levy_desc: "Cavaliers nobles élevés grâce au système de prélèvement, combattant dans la tradition de cavalerie lourde de l'empire d'Oyo."
 a_nd_oye_balogun_guard: "Garde Balogun"
 a_nd_oye_balogun_guard_desc: "Infanterie professionnelle servant sous les ordres des chefs de guerre provinciaux. La Garde Balogun représente l'évolution de l'armée d'Oyo, de la domination de la cavalerie à la guerre interarmes."
 a_nd_oye_mounted_archers: "Savanna Horse Archers"
 a_nd_oye_mounted_archers_desc: "Light horse of the provincial towns, armed with bows and javelins. Where the titled Esho charge home, these riders scout, turn a flank and harass across the open savanna, on mounts bought from the north."
 nd_oye_afin: "Afin"
 nd_oye_afin_desc: "Le complexe du palais d'Alaafin, un vaste complexe de cours, de salles d'audience et d'espaces rituels qui constitue le cœur politique et cérémoniel de l'empire."
 nd_oye_oja_oba: "Oja Oba"
 nd_oye_oja_oba_desc: "Un marché royal réglementé sous l'autorité d'Alaafin, où des marchands de toute l'Afrique de l'Ouest font le commerce de noix de cola, de textiles, de bétail et de produits de luxe."
 nd_oye_oko_oba: "Oko Oba"
 nd_oye_oko_oba_desc: "Une ferme royale pour la culture organisée de l'igname. Les ignames constituaient la base alimentaire de la population d'Oyo et le surplus agricole qui soutenait ses ambitions impériales."
 nd_oye_farm_upkeep: "Opérations agricoles"
 nd_oye_farm_upkeep_desc: "Bois et outils pour les manches de houes, les granges de stockage et les clôtures autour des champs d'igname royale."
 nd_oye_ogboni_lodge: "Ogboni Lodge"
 nd_oye_ogboni_lodge_desc: "Le lieu de rencontre de la société secrète Ogboni, où les anciens hommes libres délibèrent sur des questions de justice, de religion et des limites appropriées du pouvoir royal."
 nd_oye_ile_ikoyi: "Île Ikoyi"
 nd_oye_ile_ikoyi_desc: "La caserne et les terrains d'entraînement du corps de cavalerie Eso à Ikoyi, où les soixante-dix jeunes chefs de guerre perfectionnent leurs compétences en combat monté."
 nd_oye_sango_shrine: "Sanctuaire Sango"
 nd_oye_sango_shrine_desc: "Un temple dédié à Sango, Alaafin déifié et seigneur du tonnerre, où les fidèles honorent la divinité avec des tambours bata et des offrandes rituelles."
 nd_oye_kola_grove: "Kola Grove"
 nd_oye_kola_grove_desc: "A grove of kola trees in the forest country. The nuts are chewed, offered to guests and gods, and carried north across the savanna, where they are paid for in horses."
 nd_oye_ile_ise: "Île d'Ise"
 nd_oye_ile_ise_desc: "A house of Yoruba weavers and dyers, where cotton is woven on the narrow loom and cloth is steeped in indigo pits in the guild tradition."
 nd_oye_odi: "Odi"
 nd_oye_odi_desc: "Un mur de fortification en terre massif entourant une ville yoruba, construit en terre battue et renforcé de bois. Ces murs pouvaient atteindre une hauteur de vingt pieds."
 nd_oye_ile_bata: "Île Bata"
 nd_oye_ile_bata_desc: "Une salle de tambours où les maîtres batteurs fabriquent et jouent les tambours sacrés bata, utilisés dans le culte du Sango et comme système de communication longue distance à travers l'empire."
 nd_oye_aso_oke_weaving: "Tissage Aso-Oke"
 nd_oye_aso_oke_weaving_desc: "Narrow strips of cotton cloth are woven with sanyan, the wild silk of the savanna, into the aso-oke worn by chiefs and at festivals."
 nd_oye_kola_processing: "Kola Picking"
 nd_oye_kola_processing_desc: "The pods are cut from the trees, and the nuts are wrapped in leaves and packed in baskets and pots that keep them moist on the caravan road north."
 nd_oye_indigo_dyeing: "Teinture indigo"
 nd_oye_indigo_dyeing_desc: "Cloth is steeped in the indigo pits of the dyers' quarter until it takes a blue so deep it is nearly black."
 nd_oye_ogun_ironwork: "Travail du fer d'Ogun"
 nd_oye_ogun_ironwork_desc: "Iron is worked at the forge under the eye of Ogun, deity of iron, into blades, spearheads, and arrowheads."
 nd_oye_yam_farming: "Culture d'igname"
 nd_oye_yam_farming_desc: "Culture intensive d'ignames et de céréales, aliments de base du pays Yoruba, produisant des excédents pour les villes en pleine croissance de l'empire."
 nd_oye_afin_maintenance: "Entretien du palais"
 nd_oye_afin_maintenance_desc: "Le tissu, les teintures, le papier, les meubles et les tissus fins étaient consommés pour maintenir la splendeur du palais d'Alaafin et ses fonctions administratives."
 nd_oye_market_maintenance: "Opérations de marché"
 nd_oye_market_maintenance_desc: "Le bétail et les tissus consommés pour faire fonctionner et approvisionner le marché royal."
 nd_oye_ogboni_maintenance: "Entretien du lodge"
 nd_oye_ogboni_maintenance_desc: "Les matériaux rituels consommés lors des cérémonies Ogboni et de l'entretien des loges."
 nd_oye_ikoyi_maintenance: "Entretien des casernes"
 nd_oye_ikoyi_maintenance_desc: "Les chevaux, les armes et le cuir étaient consommés pour entretenir la caserne de cavalerie d'Eso et équiper ses guerriers."
 nd_oye_shrine_maintenance: "Offrandes au sanctuaire"
 nd_oye_shrine_maintenance_desc: "Le bétail et les matériaux rituels consommés pour honorer Sango dans son sanctuaire."
 nd_oye_craft_maintenance: "Production de tissus"
 nd_oye_craft_maintenance_desc: "Yoruba artisans weave dyed cotton into cloth of remarkable quality in the guild workshop tradition."
 nd_oye_odi_maintenance: "Entretien des murs"
 nd_oye_odi_maintenance_desc: "Le bois, la pierre et les outils utilisés pour entretenir les murs de fortification en terre des villes yoruba."
 nd_oye_drum_maintenance: "Matériaux du tambour"
 nd_oye_drum_maintenance_desc: "Le bois et le cuir consommés pour la fabrication et l’entretien des tambours sacrés bata."
 levy_nd_oye_ilari: "Garde royale Ilari"
 levy_nd_oye_ilari_desc: "Le garde du corps personnel d'Alaafin, issu de la classe des soldats de la maison du palais."
 levy_nd_oye_heavy_cavalry: "Cavalerie lourde Oyo"
 levy_nd_oye_heavy_cavalry_desc: "Cavalerie de race noble élevée grâce au système de prélèvement, combattant dans la tradition de guerre à cheval blindée d'Oyo."
 nd_oye_formed_tt: "L'Empire Oyo a été formé"
 nd_oye_path_a_tt: "Choisissez le Tonnerre de Sango"
 nd_oye_path_b_tt: "Choisissez la voix de l'Oyo Mesi"
 nd_oye_destiny: "Destin de l'empire Oyo"
 nd_oye_destiny_desc: "L'Empire Oyo a été proclamé. Des fondations stables doivent être posées avant que l’empire puisse poursuivre ses plus grandes ambitions."
 nd_oye_dest_nupe_conquest: "Soumission de Nupe"
 nd_oye_dest_nupe_conquest_desc: "The Nupe kingdom has long rivaled Oyo for control of the Middle Niger. Conquer Bida and Lokoja to secure the empire's northern flank and open the road to the Sahel. The Eso must first have their barracks."
 nd_oye_dest_hausa_campaign: "La campagne Haoussa"
 nd_oye_dest_hausa_campaign_desc: "Nupe étant brisé, les riches cités-États haoussa de Kano et Katsina nous attirent. Leurs marchés, leurs teintureries et leurs ouvrages en cuir représentent les richesses les plus riches de l'ouest du Soudan."
 nd_oye_dest_lord_of_sahel: "Seigneur du Sahel"
 nd_oye_dest_lord_of_sahel_desc: "From the forests of Yorubaland to the sands of the Sahel, the Oyo Empire shall eclipse the old empires of Mali and Songhai. Timbuktu and Gao must acknowledge Sango's thunder, and Oyo-Ile must grow to a development of 18, twice what it was."
 nd_oye_dest_coastal_access: "Portée côtière"
 nd_oye_dest_coastal_access_desc: "La vision d'Oyo Mesi exige le contrôle de la côte. Sécurisez Ajase et Accra pour établir le commerce maritime de l'empire et relier les marchés yoruba au monde atlantique."
 nd_oye_dest_trade_ascendancy: "Ascendant commercial"
 nd_oye_dest_trade_ascendancy_desc: "Une fois les ports côtiers sécurisés, l’empire doit développer des institutions financières sophistiquées et garantir la circulation de l’ivoire sur nos marchés. Adoptez le secteur bancaire et dominez le commerce de l’ivoire."
 nd_oye_dest_merchant_empire: "L'empire marchand"
 nd_oye_dest_merchant_empire_desc: "The constitutional genius of the Oyo Mesi has built an empire of commerce. Extend our trade networks to Kumasi and Djenne, the great market cities of West Africa, and keep a Royal Market in four locations."
 nd_oye.6.t: "Le destin d'Oyo"
 nd_oye.6.d: "L'Alaafin siège sur le trône d'un empire stable. Des bosquets sacrés d'Ile-Ife aux villes frontalières, le peuple Oyo regarde son souverain avec impatience. Ce qui a commencé comme une union de royaumes yoruba est maintenant prêt à devenir quelque chose de plus grand. La question n’est pas de savoir si Oyo s’élèvera, mais à quelle hauteur."
 nd_oye.6.a: "Le destin d'Oyo est écrit dans les étoiles."
 nd_oye.7.t: "Le Nupe subjugué"
 nd_oye.7.d: "La cavalerie des Eso a déferlé sur le Niger et brisé la puissance du royaume Nupe. Bida, leur ancienne capitale, arbore désormais la bannière des Alaafin. Le Moyen Niger, longtemps contesté, est le nôtre. Le contrôle de Lokoja, au confluent des fleuves Niger et Bénoué, nous donne la maîtrise des grands cours d'eau. La route vers le Sahel est ouverte."
 nd_oye.7.a: "Le Nupe apprendra à servir l'Alaafin."
 nd_oye.8.t: "La chute de Kano"
 nd_oye.8.d: "Les grandes murailles de Kano sont tombées aux mains de la cavalerie d'Oyo. Les cités-États haoussa, célèbres pour leur richesse, leurs puits de teinture d'indigo et leur rôle dans le commerce transsaharien, sont désormais soumises à l'autorité d'Alaafin. Il s’agit d’une conquête sans précédent dans l’histoire yoruba. Mais comment gouverner ces villes lointaines et riches ? Le débat des généraux : conserver l’avantage avec une rapidité implacable, ou consolider nos lignes d’approvisionnement pour la longue campagne à venir ?"
 nd_oye.8.a: "Frappez pendant que le fer est chaud. La vitesse est notre arme."
 nd_oye.8.b: "Sécurisez nos lignes d’approvisionnement. La savane est vaste."
 nd_oye.9.t: "Seigneur du Sahel"
 nd_oye.9.d: "Des forêts du pays Yoruba à la boucle du Niger, des bibliothèques de Tombouctou au port fluvial de Gao, l'empire d'Oyo contrôle désormais un domaine qui éclipse les anciens empires du Mali et de Songhaï. Le nom d'Alaafin est prononcé avec admiration depuis la côte atlantique jusqu'aux confins du Sahara. Le tonnerre du Sango résonne dans tout l’ouest du Soudan. Allons-nous gouverner ce vaste domaine par l’autorité divine, ou par l’administration pragmatique d’une hégémonie établie ?"
 nd_oye.9.a: "Le tonnerre de Sango commande l'obéissance."
 nd_oye.9.b: "Un empire durable nécessite des institutions durables."
 nd_oye.10.t: "Les ports de l'Atlantique"
 nd_oye.10.d: "La stratégie d'Oyo Mesi porte ses fruits. Ajase et les villes côtières de la Gold Coast répondent désormais aux marchands d'Alaafin. Des canoës chargés de tissus, de noix de kola et d'ivoire parcourent les lagons à la rencontre des commerçants européens et américains sur la côte. L'intérieur des Yoruba, longtemps isolé de la mer, offre désormais une fenêtre sur le monde atlantique. Les architectes constitutionnels de l’Oyo Mesi ont prouvé que la richesse afflue plus facilement vers ceux qui font du commerce que vers ceux qui se contentent de conquérir."
 nd_oye.10.a: "La mer transportera la richesse d'Oyo vers le monde."
 nd_oye.11.t: "Les marchés de l'ivoire"
 nd_oye.11.d: "Les marchés d'Oyo sont devenus le carrefour du commerce ouest-africain. L'ivoire de l'intérieur, les tissus des métiers à tisser yoruba, les noix de cola des forêts et les marchandises européennes de la côte transitent tous par nos marchés réglementés sous l'œil vigilant de l'Oyo Mesi. Les institutions bancaires ont pris racine et la sophistication financière de l'empire rivalise avec celle des puissances commerciales lointaines. Mais comment déployer cette puissance commerciale ? Devrions-nous construire de grandes villes marchandes ou investir dans les routes et les relations qui soutiennent le commerce ?"
 nd_oye.11.a: "Construisez les marchés. Laissez les commerçants venir à nous."
 nd_oye.11.b: "Investissez dans les routes. Le commerce suit le chemin."
 nd_oye.12.t: "L'empire marchand"
 nd_oye.12.d: "De Kumasi à l'ouest jusqu'à Djenné sur le Niger, les marchands d'Oyo dominent le commerce de l'Afrique de l'Ouest. La vision constitutionnelle d'Oyo Mesi a créé quelque chose de sans précédent : un empire construit non pas sur des charges de cavalerie mais sur le droit des contrats, des marchés réglementés et de la finesse diplomatique. L'Alaafin règne mais ne gouverne pas seul ; le conseil gouverne mais ne peut pas aller trop loin. Cet équilibre, affiné au fil des générations, a produit un empire d’une stabilité et d’une prospérité remarquables. Quelle sera son expression ultime ?"
 nd_oye.12.a: "La sagesse du conseil fait la force de l’empire."
 nd_oye.12.b: "Ouvrez les portes. Oyo fait du commerce avec le monde entier."
 STATIC_MODIFIER_NAME_nd_oye_dest_cavalry_supremacy: "Suprématie de cavalerie"
 STATIC_MODIFIER_DESC_nd_oye_dest_cavalry_supremacy: "La cavalerie Eso frappe avec une vitesse dévastatrice, écrasant les défenseurs avant qu'ils ne puissent organiser une riposte."
 STATIC_MODIFIER_NAME_nd_oye_dest_scorched_savanna: "Savane brûlée"
 STATIC_MODIFIER_DESC_nd_oye_dest_scorched_savanna: "La maîtrise logistique d'Oyo de la savane garantit que nos armées sont nourries pendant que l'ennemi meurt de faim, même si le coût du maintien de lignes de ravitaillement distantes met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_oye_dest_sango_dominion: "Le domaine de Sango"
 STATIC_MODIFIER_DESC_nd_oye_dest_sango_dominion: "L'autorité divine du Sango commande une obéissance rapide. Les peuples conquis se soumettent aux élus du dieu du tonnerre et de nouveaux guerriers affluent sous la bannière d'Alaafin."
 STATIC_MODIFIER_NAME_nd_oye_dest_sahel_hegemony: "Hégémonie sahélienne"
 STATIC_MODIFIER_DESC_nd_oye_dest_sahel_hegemony: "Le vaste Sahel a été pacifié et intégré dans une administration impériale stable, avec des villes fortifiées assurant la paix."
 STATIC_MODIFIER_NAME_nd_oye_dest_market_mastery: "Maîtrise du marché"
 STATIC_MODIFIER_DESC_nd_oye_dest_market_mastery: "Les marchés réglementés d'Oyo sont devenus le moteur commercial de l'Afrique de l'Ouest, même si la bureaucratie croissante exige sa part."
 STATIC_MODIFIER_NAME_nd_oye_dest_ivory_roads: "Routes d'Ivoire"
 STATIC_MODIFIER_DESC_nd_oye_dest_ivory_roads: "Les routes commerciales partant d'Oyo transportent l'ivoire, le tissu et les noix de kola vers des marchés lointains, liant divers peuples dans une culture commerciale commune."
 STATIC_MODIFIER_NAME_nd_oye_dest_oyo_mesi_ascendant: "Oyo Mesi Ascendant"
 STATIC_MODIFIER_DESC_nd_oye_dest_oyo_mesi_ascendant: "La maîtrise constitutionnelle de l’Oyo Mesi a produit un empire de lois, de routes et de sophistication diplomatique sans égal en Afrique de l’Ouest."
 STATIC_MODIFIER_NAME_nd_oye_dest_atlantic_gateway: "Porte de l'Atlantique"
 STATIC_MODIFIER_DESC_nd_oye_dest_atlantic_gateway: "Les ports côtiers d'Oyo relient l'intérieur au monde atlantique, canalisant les richesses du commerce intercontinental vers le cœur de l'empire."
 nd_oye_ile_ogun: "Île Ogun"
 nd_oye_ile_ogun_desc: "Un sanctuaire de guerre sacré dédié à Ogun, divinité du fer et de la guerre, servant à la fois d'arsenal et de centre spirituel pour les campagnes militaires de l'empire."
 nd_oye_ogun_arsenal_maintenance: "Opérations d'Arsenal"
 nd_oye_ogun_arsenal_maintenance_desc: "Les armes, le fer, le cuir et les chevaux consommés pour entretenir l'arsenal sacré d'Ogun et équiper les armées de l'empire."
 nd_oye_ile_owu: "Île Owu"
 nd_oye_ile_owu_desc: "Une grande maison de guilde marchande où les commerçants yoruba, régis par les réglementations commerciales de l'Oyo Mesi, coordonnent les vastes réseaux commerciaux de l'empire."
 nd_oye_owu_maintenance: "Opérations de guilde"
 nd_oye_owu_maintenance_desc: "Le tissu, l'ivoire, le papier et la poterie étaient consommés pour faire fonctionner la maison de la guilde des marchands et tenir ses registres commerciaux."

 # ===== BUREAUCRACIES =====
 oye_oyo_mesi_bureaucracy: "Oyo Mesi"
 oye_oyo_mesi_bureaucracy_desc: "Les sept chefs héréditaires de la métropole d'Oyo (les Bashorun, Agbaakin, Samu, Alapini, Laguna, Akiniku et Asipa) dont les fonctions étaient réparties dans sept clans spécifiques de la capitale. Ils ratifiaient l'adhésion de chaque Alaafin, vérifiaient le trésor et détenaient le droit constitutionnel de présenter à un roi la calebasse d'œufs de perroquet qui lui ordonnait de se suicider. Le Bashorun Gaha a exercé cette prérogative en série à partir des années 1750 jusqu'à ce qu'Alaafin Abiodun le renverse en 1774."
 oye_ogboni_society_bureaucracy: "Société Ogboni"
 oye_ogboni_society_bureaucracy_desc: "La confrérie initiatique secrète d'hommes âgés jurés à la divinité de la terre Onile, se distinguant par les paires de figurines edan en bronze portées autour du cou. La loge iledi faisait office de tribunal de dernière instance de la ville pour les affaires capitales et prononçait le verdict métaphysique requis avant qu'un roi yoruba puisse être destitué. Les magistrats Ogboni dirigèrent effectivement Egba Abeokuta après 1830, et des loges parallèles Osugbo gouvernèrent Ijebu jusque tard dans l'ère coloniale."
 oye_eso_kakanfo_bureaucracy: "Eso et Aare-Ona-Kakanfo"
 oye_eso_kakanfo_bureaucracy_desc: "The seventy titled cavalry officers of the Eso, personally appointed by the Alaafin, served under the Aare-Ona-Kakanfo, the supreme field-general constitutionally forbidden to quarter inside the capital. The Kakanfo was bound by oath to win battles or commit suicide, and his provincial seat (at Ikoyi, then Iwoye, finally Ilorin) was meant to prevent military coups. In 1817 Aare Afonja inverted the design when he revolted from Ilorin and broke Old Oyo."
 oye_ilari_corps_bureaucracy: "Porteurs du titre Ilari"
 oye_ilari_corps_bureaucracy_desc: "Plusieurs centaines de fonctionnaires royaux (certains hommes, certaines femmes, tous distingués par une tête rasée d'un côté et teinte à l'indigo ou au bois de cam de l'autre) issus des esclaves royaux, des captifs et des clients plutôt que des clans libres métropolitains. Ils servaient de messagers d'Alaafin, de collecteurs de tributs, d'envoyés résidents et d'exécuteurs des mandats royaux. Parce que leurs fonctions étaient personnelles et révocables, le corps Ilari était le contrepoids bureaucratique du trône au pouvoir lignager de l'Oyo Mesi."
 oye_ajele_residency_bureaucracy: "Résidence provinciale d'Ajele"
 oye_ajele_residency_bureaucracy_desc: "Les Ilari seniors étaient en poste comme résidents permanents dans les cours des rois tributaires de l'empire - d'Egba, Egbado, Onko, Ijebu, Ketu, Owu et, plus important encore, du royaume Fon du Dahomey, qui payait un tribut annuel à Oyo de 1730 à 1818 environ. Oyo-Île. Leurs extorsions furent l’un des principaux moteurs des rébellions de 1817 à 1836 qui mirent fin à l’empire."
 oye_babalawo_ifa_bureaucracy: "Conseil Babalawo Ifa"
 oye_babalawo_ifa_bureaucracy_desc: "Le collège des babalawo supérieurs (« pères des secrets ») qui consultaient la divination Ifa pour chaque décision royale majeure : le choix d'un nouvel Alaafin parmi les princes éligibles, le calendrier des guerres, la propitiation requise pour lever une famine, les signes contre la loyauté d'un tributaire. En lisant la distribution de seize noix de palme sur un corpus de 256 versets Odu, l'autorité de l'Awo traversait tous les royaumes yoruba et était respectée par les Fon (en tant que Fa) et les Edo. Leur consultation annuelle à l'Ile-Ife liait la vie religieuse de l'empire à une seule tradition divinatoire."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_oye_bureaucracy_authority: "Autorité bureaucratique d'Oyo"
 AUTO_MODIFIER_DESC_nd_oye_bureaucracy_authority: "On formation, the Oyo Empire gains the right to host the historical institutions of Yoruba imperial governance: the Mesi, the Ogboni, the Eso, the Ilari, the Ajele, and the Babalawo Ifa council. Three of the six can be kept at once."
 nd_oye_igbodu: "Igbodu"
 nd_oye_igbodu_desc: "The grove of Ifa at the edge of the town. Here the babalawo are initiated, and spend years learning by heart the verses of the two hundred and fifty-six odu."
 nd_oye_igbodu_upkeep: "Grove Offerings"
 nd_oye_igbodu_upkeep_desc: "Palm nuts for the divining, kola to be shared, and animals for sacrifice are brought to the grove."
 nd_oye_agbede: "Agbede"
 nd_oye_agbede_desc: "The forge of a Yoruba town. A shrine to Ogun stands by the anvil, and no smith begins work before the deity has been greeted."
 nd_oye_gunsmithing: "Gunsmithing"
 nd_oye_gunsmithing_desc: "Trade muskets are repaired and copied at the forge, and locks and shot are made for them."
 nd_oye_dest_ikoyi_barracks_tt: "At least one owned location has an #bold Ile Ikoyi#!"
 nd_oye_dest_oyo_ile_18_tt: "#bold Oyo-Ile#! is owned and has development of at least #bold 18#!"
 nd_oye_dest_royal_markets_tt: "At least #bold 4#! owned locations have an #bold Oja Oba#!"
