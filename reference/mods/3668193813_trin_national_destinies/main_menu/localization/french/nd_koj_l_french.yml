l_french:
 STATIC_MODIFIER_NAME_nd_defender_of_the_faith: "Défenseur de la foi"
 STATIC_MODIFIER_DESC_nd_defender_of_the_faith: "Le Royaume de Jérusalem constitue le bouclier de la chrétienté en Orient, un rempart contre les infidèles soutenu par la foi et les épées de ses chevaliers."
 STATIC_MODIFIER_NAME_nd_crossroads_of_commerce: "Carrefour du Commerce"
 STATIC_MODIFIER_DESC_nd_crossroads_of_commerce: "Les ports et les marchés de Terre Sainte canalisent les richesses de l’Est et de l’Ouest, faisant de Jérusalem le pivot sur lequel tourne le commerce méditerranéen."
 STATIC_MODIFIER_NAME_nd_koj_assizes_legacy: "L'héritage des assises"
 STATIC_MODIFIER_DESC_nd_koj_assizes_legacy: "La codification des Assises de Jérusalem fournit un cadre juridique complet qui régit les affaires d'Outremer avec sagesse et précédent."
 STATIC_MODIFIER_NAME_nd_koj_walls_of_outremer: "Murs d'Outremer"
 STATIC_MODIFIER_DESC_nd_koj_walls_of_outremer: "Les grandes forteresses concentriques de Terre Sainte représentent le summum de l'architecture défensive, leurs murs en couches et leurs terrains d'exécution sont une leçon de pierre."
 nd_koj.1.t: "Le Royaume restauré"
 nd_koj.1.d: "Jerusalem is ours. The Holy City, over which so many have fought and died, has been taken under the banner of the Cross. Pilgrims weep at the sight of the Holy Sepulchre, knights kneel in prayer upon the Temple Mount, and merchants eye the bustling ports of Acre and Tyre with barely concealed avarice. The Kingdom of Jerusalem is proclaimed anew, but what manner of kingdom shall it be? Shall we be a fortress of the faith, a militant state dedicated to the defense of Christendom's holiest sites? Or shall we embrace our position at the crossroads of three continents, growing rich on the trade that flows through our ports and caravansaries?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_koj.1.a: "Nous sommes l'épée et le bouclier du Christ !"
 nd_koj.1.b: "Laissons les richesses de l’Orient et de l’Occident couler entre nos mains."
 nd_koj.2.t: "Les assises de Jérusalem"
 nd_koj.2.d: "Les juristes du royaume ont achevé le grand travail de codification. S'appuyant sur les coutumes des colons francs, les traditions des communes italiennes et les nécessités pratiques de diriger un royaume diversifié sur des terres hostiles, ils ont compilé les Assises de Jérusalem, le code juridique le plus complet de la chrétienté à l'est de Constantinople. La Haute Cour et la Cour des Bourgeois disposent désormais d'un précédent écrit clair pour guider leurs délibérations, depuis les questions d'obligations féodales et de régime foncier jusqu'à la réglementation du commerce et les droits des bourgeois. Devons-nous renforcer la main de la couronne grâce à ce nouvel instrument juridique, ou l'utiliser pour stabiliser le royaume ?"
 nd_koj.2.a: "La loi est le fondement d’un bon gouvernement."
 nd_koj.2.b: "Les bonnes lois attirent les bons colons."
 nd_koj.3.t: "La forteresse concentrique"
 nd_koj.3.d: "Nos ingénieurs ont mis au point une approche révolutionnaire de la fortification. S'appuyant sur les leçons amères de la guerre de siège contre les sapeurs et les engins de siège sarrasins, ils ont développé le château concentrique, composé de plusieurs anneaux de courtines, chacun commandant celui qui le précède, avec des tours positionnées pour des champs de tir imbriqués. Les murs intérieurs s'élèvent au-dessus des murs extérieurs, afin que les défenseurs puissent tirer sur leurs camarades en contrebas. Les entrées tordues, les trous meurtriers et les mâchicoulis transforment chaque approche en un terrain de massacre. Le Krak des Chevaliers, Belvoir et Margat sont les monuments de ce nouvel art de la défense. Devons-nous continuer à investir dans ces puissantes forteresses ?"
 nd_koj.3.a: "Construisez des murs qui résisteront jusqu’au Jour du Jugement."
 nd_koj.3.b: "Ces murs briseront tout siège."
 nd_koj_feudal_outremer: "Outremer féodal"
 nd_koj_feudal_outremer_desc: "Les colons francs ont établi une administration féodale adaptée aux réalités de la gouvernance d'un royaume côtier étroit entouré de puissances hostiles, mêlant la coutume occidentale aux pratiques locales."
 nd_koj_arriere_ban: "Arrière-Ban d'Outremer"
 nd_koj_arriere_ban_desc: "Contrairement à l’Europe où le service féodal était limité à quarante jours, les rois de Jérusalem exigeaient de leurs vassaux une année complète de service militaire, une nécessité née d’une menace existentielle constante."
 nd_koj_turcopole_tradition: "Tradition Turcopole"
 nd_koj_turcopole_tradition_desc: "Les Turcopoles étaient des cavaliers légers recrutés localement qui servaient d'éclaireurs, d'archers à cheval et de tirailleurs. Souvent issus de Seldjoukides christianisés ou de chrétiens syriens, ils représentaient jusqu'à la moitié des forces montées du royaume."
 nd_koj_pilgrim_roads: "Routes de pèlerinage"
 nd_koj_pilgrim_roads_desc: "La protection et la fiscalité des pèlerins se rendant sur les lieux saints constituaient une source de revenus majeure pour le royaume, la population de Jérusalem doublant pendant la saison estivale des pèlerinages."
 nd_koj_sugar_estates: "Domaines sucriers du Levant"
 nd_koj_sugar_estates_desc: "The Crusaders found sugarcane already under cultivation in the Levant and expanded its production dramatically. Most sugar consumed in thirteenth-century Europe originated from the Crusader states.\n\n#italic Available in: $nd_koj_sugar_press$#!"
 nd_koj_concentric_fortification: "Fortification concentrique"
 nd_koj_concentric_fortification_desc: "Le château concentrique, avec ses multiples anneaux de courtines et ses champs de tir imbriqués, a été perfectionné dans les États croisés en réponse aux techniques de siège avancées de leurs adversaires musulmans."
 nd_koj_acre_entrepot: "Entrepôt d'acres"
 nd_koj_acre_entrepot_desc: "Acre a remplacé Alexandrie en tant que port commercial le plus important de la Méditerranée orientale, accueillant des commerçants de Byzance, d'Afrique du Nord, d'Arabie et des républiques maritimes italiennes."
 nd_koj_italian_quarter: "Quartier italien"
 nd_koj_italian_quarter_desc: "Les républiques maritimes italiennes, Venise, Gênes et Pise, entretenaient des quartiers commerciaux autonomes dans les ports d'Outremer, leurs ressources financières et leur force navale étant essentielles à la survie du royaume."
 nd_koj_templar_banking: "Banque des Templiers"
 nd_koj_templar_banking_desc: "Les Templiers ont développé un premier système bancaire et de crédit, permettant aux pèlerins de déposer des fonds en Europe et de les retirer en Terre Sainte, une innovation financière née d'une nécessité pratique."
 nd_koj_assizes_of_jerusalem: "Assises de Jérusalem"
 nd_koj_assizes_of_jerusalem_desc: "Les assises de Jérusalem constituaient le code juridique féodal le plus complet de la période médiévale, régissant tout, depuis le régime foncier et les obligations féodales jusqu'à la réglementation commerciale et les droits des bourgeois."
 nd_koj_outremer_navy: "Marine d'Outremer"
 nd_koj_outremer_navy_desc: "Bien que dépendant de la puissance navale italienne, le royaume de Jérusalem entretenait sa propre flotte de galères de guerre pour patrouiller la côte levantine, protéger la marine marchande et soutenir les opérations amphibies."
 nd_koj_holy_land_relics: "Reliques de Terre Sainte"
 nd_koj_holy_land_relics_desc: "The trade in holy relics, souvenirs, and religious artifacts was a lucrative industry in the Crusader states, feeding the insatiable appetite of European Christendom for tangible connections to sacred sites. Carvers work olive wood and mother of pearl into rosaries and crosses for the pilgrims to carry home."
 nd_koj_desert_warfare: "Guerre du désert"
 nd_koj_desert_warfare_desc: "Des générations de guerre contre les Ayyoubides et les Mamelouks ont appris aux croisés à adapter leurs tactiques au terrain aride du Levant, en apprenant à gérer les approvisionnements en eau, à éviter les embuscades et à combattre dans la chaleur torride."
 nd_koj_hospitaller_medicine: "Médecine Hospitalière"
 nd_koj_hospitaller_medicine_desc: "Les Chevaliers Hospitaliers entretenaient le grand hôpital Saint-Jean à Jérusalem, où des médecins s'appuyant sur les traditions médicales européennes et arabes soignaient les malades et les blessés sans distinction de religion ou de rang."
 nd_koj_crossroads_diplomacy: "Diplomatie à la croisée des chemins"
 nd_koj_crossroads_diplomacy_desc: "Situé à la jonction de trois continents, le royaume de Jérusalem entretenait des relations diplomatiques complexes avec Byzance, les républiques italiennes, la papauté et parfois même leurs voisins musulmans."
 nd_koj_frankish_chivalry: "Chevalerie franque"
 nd_koj_frankish_chivalry_desc: "La charge de cavalerie lourde franque était l'arme la plus redoutée de l'arsenal des Croisés, des chevaliers en armure sur des destriers s'écrasant sur les formations ennemies avec l'élan d'une avalanche de fer."
 nd_koj_levantine_commerce: "Commerce levantin"
 nd_koj_levantine_commerce_desc: "À la fin du royaume, les revenus commerciaux avaient éclipsé les rentes féodales en tant que principale source de revenus royaux, les ports d'Acre et de Tyr servant de voies vitales pour le commerce Est-Ouest."
 nd_koj_holy_land_garrison: "Garnison de Terre Sainte"
 nd_koj_holy_land_garrison_desc: "Le système de garnison permanente des États croisés, maintenu par les ordres militaires et les obligations féodales, permettait à une petite population chrétienne de détenir de vastes territoires contre des ennemis numériquement supérieurs."
 nd_koj_crusader_legacy: "L'héritage des croisés"
 nd_koj_crusader_legacy_desc: "L'héritage du royaume croisé perdure, dans les grands châteaux encore debout, dans les traditions juridiques qui ont influencé la jurisprudence européenne et dans les échanges culturels entre l'Est et l'Ouest qu'il a facilités."
 nd_koj_kingdom_restored: "Royaume restauré"
 nd_koj_kingdom_restored_desc: "Le Royaume de Jérusalem s'élève à nouveau dans une nouvelle ère, son ancienne revendication sur la Ville Sainte étant dotée d'une nouvelle vie et d'un nouveau but."
 nd_koj_eastern_diplomacy: "Diplomatie orientale"
 nd_koj_eastern_diplomacy_desc: "Naviguer dans le réseau complexe d’alliances et de rivalités du Moyen-Orient moderne nécessite les mêmes compétences diplomatiques qui soutenaient autrefois une étroite bande de territoire chrétien au milieu d’un océan de puissances musulmanes."
 nd_koj_holy_city_renown: "Renommée de la ville sainte"
 nd_koj_holy_city_renown_desc: "Jérusalem est une ville sacrée pour trois confessions, et son dirigeant occupe une position d'une importance culturelle et religieuse inégalée, imposant l'attention et le respect du monde entier."
 nd_koj_jaffa_gardens: "Gardens of Jaffa"
 nd_koj_jaffa_gardens_desc: "The plain behind Jaffa is planted with orange, lemon and pomegranate, each grove watered from its own well by a wheel that a mule turns. Twice in this age the town is sacked, and twice the gardens are planted again."
 a_nd_koj_turcopoles: "Turcopoles"
 a_nd_koj_turcopoles_desc: "Cavalerie légère recrutée localement servant d'éclaireurs, d'archers à cheval et de tirailleurs. Souvent issus de Seldjoukides christianisés ou de chrétiens syriens, ils étaient indispensables aux armées de campagne des Croisés."
 a_nd_koj_crusader_sergeants: "Frankish Sergeants"
 a_nd_koj_crusader_sergeants_desc: "Hommes d'armes à cheval qui constituaient l'épine dorsale des armées de campagne des Croisés. Mieux équipés que les levées ordinaires mais sans rang chevaleresque, ils constituaient le noyau d'infanterie stable de chaque engagement."
 n_nd_koj_outremer_galley: "Cuisine Outremer"
 n_nd_koj_outremer_galley_desc: "Une galère de guerre construite et équipée dans les ports de Terre Sainte, adaptée aux exigences particulières de la guerre côtière levantine et de la protection des routes commerciales."
 a_nd_koj_frankish_knights: "Chevaliers francs"
 a_nd_koj_frankish_knights_desc: "La cavalerie lourde d'élite d'Outremer, des chevaliers blindés montés sur de puissants destriers, formés dès leur jeunesse aux arts de la guerre et dédiés à la défense de la Terre Sainte."
 nd_koj_hall_of_justice: "Salle de justice des croisés"
 nd_koj_hall_of_justice_desc: "Cour de justice administrant les assises de Jérusalem, où les coutumes des colons francs sont codifiées et appliquées à la gouvernance d'Outremer."
 nd_koj_concentric_fortress: "Forteresse concentrique"
 nd_koj_concentric_fortress_desc: "Une forteresse révolutionnaire à plusieurs anneaux avec des champs de tir superposés, perfectionnée par les ingénieurs croisés en réponse aux techniques de siège avancées de leurs adversaires musulmans."
 nd_koj_levantine_fondaco: "Court of the Chain"
 nd_koj_levantine_fondaco_desc: "The king's customs house and sea court in a port, named for the chain that closes the harbour of Acre. Every cargo landed is written down and taxed by its clerks, and its jurors judge the pleas of sailors and merchants. The Italian communes keep their own fondachi in the town; the Chain is where they must pay."
 nd_koj_pilgrim_workshop: "Pilgrim Workshop"
 nd_koj_pilgrim_workshop_desc: "A workshop of carvers in a town of the Holy Land. Rosaries, crosses and small models of the Holy Sepulchre are cut from olive wood and inlaid with mother of pearl."
 nd_koj_sugar_press: "Presse à sucre"
 nd_koj_sugar_press_desc: "Un moulin à eau pour broyer la canne à sucre cultivée sur les domaines des Croisés. L'industrie sucrière levantine comptait parmi les entreprises les plus rentables des royaumes latins."
 nd_koj_mill_upkeep: "Opérations de l'usine"
 nd_koj_mill_upkeep_desc: "Bois, outils et meules pour la roue hydraulique, les rouleaux et les cuves bouillantes du pressoir à sucre."
 nd_koj_hospitaller_infirmary: "Infirmerie Hospitalière"
 nd_koj_hospitaller_infirmary_desc: "Un hôpital construit dans la tradition des Chevaliers Hospitaliers, où des médecins formés à la fois à la médecine européenne et arabe soignent les malades et les blessés."
 nd_koj_royal_palace: "Palais Royal de Jérusalem"
 nd_koj_royal_palace_desc: "Le siège de la monarchie croisée restaurée, un palais digne du souverain qui détient la ville la plus sainte de la chrétienté."
 nd_koj_bayyara: "Bayyara"
 nd_koj_bayyara_desc: "A walled orchard with its own well-house. A wheel lifts the water into a pool, and channels carry it to the trees through the dry months."
 nd_koj_sugar_processing: "Transformation du sucre"
 nd_koj_sugar_processing_desc: "Crushing Levantine sugarcane in water-driven mills and boiling the juice over wood fires into exportable sugar, a lucrative industry inherited from the Arabs and expanded by the Crusaders."
 nd_koj_relic_trade: "Pilgrim Wares"
 nd_koj_relic_trade_desc: "Olive wood and shell are carved into rosaries, crosses and keepsakes of the holy places, and sold to pilgrims and to the merchants who ship them west."
 nd_koj_justice_maintenance: "Administration des tribunaux"
 nd_koj_justice_maintenance_desc: "Tenir les dossiers juridiques, la correspondance administrative et les vêtements formels d'un tribunal croisé."
 nd_koj_fortress_maintenance: "Entretien de la forteresse"
 nd_koj_fortress_maintenance_desc: "Entretenir les murs de pierre massifs, les tours, les armureries et la menuiserie d'une forteresse concentrique."
 nd_koj_fondaco_maintenance: "Clerks of the Chain"
 nd_koj_fondaco_maintenance_desc: "The customs house is kept in paper for its registers, cloth for the sealed bales and timber for the harbour boom and the quay."
 nd_koj_infirmary_maintenance: "Entretien de l'infirmerie"
 nd_koj_infirmary_maintenance_desc: "Approvisionnement d’une infirmerie hospitalière en médicaments, matériel médical et linge propre."
 nd_koj_palace_maintenance: "Entretien du palais"
 nd_koj_palace_maintenance_desc: "Entretenir les murs en pierre, les beaux meubles et le trésor d'un palais royal."
 nd_koj_bayyara_upkeep: "Orchard Upkeep"
 nd_koj_bayyara_upkeep_desc: "Buckets and gearing for the wheel, timber for its frame, and the mule that turns it."
 STATIC_MODIFIER_NAME_nd_koj_outremer_settlement: "Règlement d'Outremer"
 STATIC_MODIFIER_DESC_nd_koj_outremer_settlement: "De bonnes lois et une gouvernance juste attirent les colons en Terre Sainte, construisant une base de population stable qui soutient le royaume par la colonisation plutôt que par la seule conquête."
 STATIC_MODIFIER_NAME_nd_koj_castle_doctrine: "Doctrine du château"
 STATIC_MODIFIER_DESC_nd_koj_castle_doctrine: "Les forteresses concentriques d'Outremer sont plus que de simples murs ; c'est une doctrine de défense, un système de places fortes qui rend le royaume presque imprenable."
 nd_koj_formed_tt: "Le Royaume de Jérusalem a été formé"
 nd_koj_path_a_tt: "A choisi le défenseur de la foi"
 nd_koj_path_b_tt: "Choisissez Carrefour du Commerce"
 nd_koj_destiny: "Destin de Jérusalem"
 nd_koj_destiny_desc: "Le royaume de Jérusalem a été restauré. Il lui faut désormais choisir son destin : partir en croisade pour la foi ou construire un empire commercial."
 nd_koj_dest_crusader_states: "Les États croisés"
 nd_koj_dest_crusader_states_desc: "The historic Crusader States are reunited under one crown. Antioch and the County of Tripoli are secured, and Kerak beyond the Jordan, the castle of the old lordship of Oultrejourdain, is held again, to forge a unified Christian front in the Levant."
 nd_koj_dest_march_east: "Marche vers l'Est"
 nd_koj_dest_march_east_desc: "The Cross is carried into the heartlands of Islam. The great cities of Damascus, Homs and Aleppo must fall to complete the Crusader dominion over Syria."
 nd_koj_dest_new_crusade: "La nouvelle croisade"
 nd_koj_dest_new_crusade_desc: "The ultimate crusade is launched, southward to Cairo and onward to Mecca and Medina, the holy cities of Arabia. No Christian king has ever achieved what is now attempted."
 nd_koj_dest_levantine_ports: "Ports levantins"
 nd_koj_dest_levantine_ports_desc: "Sécurisez les grands ports de commerce de la Méditerranée orientale. Chypre et Beyrouth sont les clés du contrôle des voies maritimes levantines."
 nd_koj_dest_silk_road: "La Route de la Soie occidentale"
 nd_koj_dest_silk_road_desc: "Puisez les richesses de l’Orient à travers vos marchés. La soie et l'encens doivent circuler entre les mains des croisés, faisant de Jérusalem le terminus occidental des grandes routes commerciales."
 nd_koj_dest_emporium: "Emporium des trois continents"
 nd_koj_dest_emporium_desc: "Construisez un empire commercial s’étendant d’Alexandrie à Constantinople. Contrôlez le carrefour où se rencontrent l’Europe, l’Asie et l’Afrique."
 nd_koj.4.t: "Le destin de Jérusalem"
 nd_koj.4.d: "La couronne de Jérusalem repose sur un front qui porte le poids de la prophétie. Nous avons restauré le Royaume, mais quel royaume allons-nous construire ? Les choix faits lors de notre fondation se répercutent dans l’histoire, et maintenant le chemin s’ouvre devant nous. Que ce soit en tant que défenseurs de la foi ou maîtres du commerce, nous graverons notre destin dans la pierre des siècles."
 nd_koj.4.a: "Notre destin nous attend."
 nd_koj.5.t: "Les États croisés réunis"
 nd_koj.5.d: "Les bannières d'Antioche et de Tripoli flottent à nouveau à côté de la croix de Jérusalem. Pour la première fois depuis les premières croisades, les États chrétiens du Levant sont unis sous une seule couronne. La principauté d'Antioche, fondée par Bohémond, et le comté de Tripoli, creusé par Raymond de Toulouse, ont été rapatriés. Ce qui a été brisé par la reconquête musulmane et la division franque a été reconstitué."
 nd_koj.5.a: "Les Francs d'Outremer forment à nouveau un seul peuple."
 nd_koj.6.t: "La marche vers l'Est"
 nd_koj.6.d: "Damas est tombé. Alep est tombée. Les grandes villes musulmanes de Syrie, qui ont résisté à un siècle d’ambition croisée, s’inclinent désormais devant la croix de Jérusalem. Saladin lui-même n'a pas réussi à conserver ce que nous avons pris, et le domaine des Atabeg est brisé. La question est maintenant de savoir comment exercer ce pouvoir sans précédent. Devons-nous avancer comme le marteau de Dieu, nous enfonçant toujours plus profondément dans les terres des infidèles ? Ou allons-nous consolider, en construisant une paix durable sur les terres que nous avons déjà conquises ?"
 nd_koj.6.a: "Nous sommes le marteau de Dieu. Que personne ne reste debout."
 nd_koj.6.b: "Construisez la paix de Jérusalem sur toute la Syrie."
 nd_koj.7.t: "La nouvelle croisade triomphante"
 nd_koj.7.d: "Le Caire est tombé sous la croix. Les villes saintes d'Arabie sont sous notre protection. Ce qu’aucune croisade n’a jamais réalisé, ce dont Richard Cœur de Lion rêvait, a été accompli. Le cœur ayyoubide, le bastion mamelouk, les villes sacrées de l’Islam lui-même, répondent tous à la couronne de Jérusalem. Le monde regarde avec étonnement. Resterons-nous dans les mémoires comme l’Épée du Christ, les guerriers invincibles qui ont conquis l’Orient ? Ou en tant qu'architectes d'un nouveau Royaume des Cieux, un royaume où l'héritage sacré de la Terre Sainte transforme tout ce qu'il touche ?"
 nd_koj.7.a: "Nous sommes l’épée du Christ et personne ne peut résister."
 nd_koj.7.b: "Nous bâtirons un Royaume des Cieux sur terre."
 nd_koj.8.t: "Les ports levantins sécurisés"
 nd_koj.8.d: "Famagouste et Beyrouth, les joyaux jumeaux de la Méditerranée orientale, arborent désormais la bannière de Jérusalem. Avec Chypre sous notre contrôle, aucun navire ne traverse la mer Levantine sans notre permission. L'ancien port de Beyrouth, autrefois la fierté de la Phénicie, canalise désormais les richesses de trois continents entre les mains des croisés. Les marchands italiens qui nous tenaient autrefois en otage avec leurs flottes viennent maintenant en suppliants, mendiant des places dans nos ports débordants."
 nd_koj.8.a: "Les voies maritimes du Levant sont à nous."
 nd_koj.9.t: "La Route de la Soie occidentale"
 nd_koj.9.d: "La soie du Cathay, l'encens d'Arabie, les épices de l'Inde affluent sur les marchés de Terre Sainte. Nous sommes devenus ce à quoi Venise et Gênes aspiraient à être : de véritables intermédiaires entre l’Orient et l’Occident. Nos caravansérails regorgent de marchandises, nos comptoirs résonnent du tintement de l'or et nos facteurs siègent dans tous les ports, de Chypre à Constantinople. Devons-nous approfondir davantage les routes caravanières, devenant les seigneurs du commerce terrestre ? Ou devons-nous construire un réseau d’agents et de facteurs, contrôlant le commerce par la connaissance et les connexions plutôt que par le territoire ?"
 nd_koj.9.a: "Contrôlez les caravanes et nous contrôlons l’Est."
 nd_koj.9.b: "Nos agents connaîtront tous les secrets du marché."
 nd_koj.10.t: "Emporium des trois continents"
 nd_koj.10.d: "Alexandrie et Constantinople, les deux plus grandes villes commerciales du monde antique, répondent désormais à la couronne de Jérusalem. Nous sommes situés au carrefour de l’Europe, de l’Asie et de l’Afrique, et toutes les routes commerciales importantes passent par notre domaine. Le rêve d’un commerce méditerranéen universel, gouverné depuis la Terre Sainte, s’est réalisé. Quel héritage cette réalisation laissera-t-elle ? Deviendrons-nous la perle de l’Orient, une puissance navale qui commande les mers ? Ou le pont d’or entre les civilisations, un royaume où l’apprentissage et la prospérité circulent librement entre tous les peuples ?"
 nd_koj.10.a: "Commandez les mers et le monde entier est à nous."
 nd_koj.10.b: "Reliez les civilisations. Laissez l’apprentissage s’épanouir."
 STATIC_MODIFIER_NAME_nd_koj_dest_hammer_of_god: "Marteau de Dieu"
 STATIC_MODIFIER_DESC_nd_koj_dest_hammer_of_god: "Les armées de Jérusalem marchent sans repos, instrument imparable de la colère divine. Pourtant, les campagnes incessantes portent atteinte à l’esprit du royaume."
 STATIC_MODIFIER_NAME_nd_koj_dest_pax_hierosol: "Pax Hiérosolymitana"
 STATIC_MODIFIER_DESC_nd_koj_dest_pax_hierosol: "La paix de Jérusalem s'étend sur toute la Syrie. Les peuples conquis sont intégrés dans le giron grâce à une gouvernance juste et à une intégration patiente."
 STATIC_MODIFIER_NAME_nd_koj_dest_sword_of_christ: "Épée du Christ"
 STATIC_MODIFIER_DESC_nd_koj_dest_sword_of_christ: "Le royaume de Jérusalem possède l’armée la plus puissante de la chrétienté, même si l’entretien de ses forteresses éloignées met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_koj_dest_kingdom_of_heaven: "Royaume des Cieux"
 STATIC_MODIFIER_DESC_nd_koj_dest_kingdom_of_heaven: "Un royaume d'harmonie et de splendeur où l'héritage sacré de la Terre Sainte inspire la réussite artistique et la stabilité sociale."
 STATIC_MODIFIER_NAME_nd_koj_dest_caravan_lords: "Seigneurs des caravanes"
 STATIC_MODIFIER_DESC_nd_koj_dest_caravan_lords: "Les routes commerciales terrestres de l'Est passent entre les mains des Croisés, apportant soie et produits de luxe sur les marchés de Terre Sainte."
 STATIC_MODIFIER_NAME_nd_koj_dest_factor_kings: "Rois de la Maison des Comptes"
 STATIC_MODIFIER_DESC_nd_koj_dest_factor_kings: "Un vaste réseau d'agents et de facteurs confère au royaume une intelligence commerciale inégalée, même si le développement agricole souffre d'être négligé."
 STATIC_MODIFIER_NAME_nd_koj_dest_pearl_of_orient: "Perle de l'Orient"
 STATIC_MODIFIER_DESC_nd_koj_dest_pearl_of_orient: "La puissance navale de Jérusalem contrôle la Méditerranée orientale, ses navires de guerre et ses navires marchands étant maîtres de toutes les voies maritimes."
 STATIC_MODIFIER_NAME_nd_koj_dest_golden_bridge: "Pont d'Or"
 STATIC_MODIFIER_DESC_nd_koj_dest_golden_bridge: "Un royaume cosmopolite où les connaissances de l’Orient et de l’Occident se mélangent librement, même si le flot de richesses entraîne ses propres pressions inflationnistes."
 nd_koj_church_militant: "Militant de l'Église"
 nd_koj_church_militant_desc: "Une commanderie fortifiée des ordres militaires, mi-église, mi-forteresse, où les moines s'entraînent comme guerriers et administrent la conversion des terres conquises."
 nd_koj_church_militant_maintenance: "Opérations de commanderie"
 nd_koj_church_militant_maintenance_desc: "Entretien de l'armurerie, de la chapelle et de la garnison d'une commanderie d'ordre militaire en Terre Sainte."
 nd_koj_eastern_exchange: "Bourse de l'Est"
 nd_koj_eastern_exchange_desc: "Une grande bourse commerciale où des marchands de trois continents échangent sous un même toit, un monument à la position du Royaume de Jérusalem à la croisée des chemins du monde."
 nd_koj_exchange_maintenance: "Opérations d'échange"
 nd_koj_exchange_maintenance_desc: "Exploiter une grande bourse commerciale avec tenue de registres, changement de devises et gestion d'entrepôts dans plusieurs salles de marché."
 AUTO_MODIFIER_NAME_nd_koj_bureaucracy_authority: "Autorité administrative des croisés"
 AUTO_MODIFIER_DESC_nd_koj_bureaucracy_authority: "The reborn Kingdom of Jerusalem inherits the layered apparatus of the Latin East: the Haute Cour of barons, the Cour des Bourgeois of Latin commoners, the Patriarchate of the Holy Sepulchre, the military orders' parallel commanderies, and the codified Assises. Jerusalem may sustain three bureaucracies of its choosing."
 koj_haute_cour_bureaucracy: "Haute Cour"
 koj_haute_cour_bureaucracy_desc: "La Haute Cour de Jérusalem, tribunal féodal des tenants en chef du royaume. Constituée sous Godefroid de Bouillon après 1099 et codifiée par Jean d'Ibelin dans le Livre des Assises de la Haute Cour vers 1265, elle entendait les affaires impliquant les vassaux du roi, jugeait les disputes de fiefs et d'hommages, ratifiait les successions et, par la doctrine de la conjuratio, pouvait contraindre le roi lui-même à honorer le contrat féodal sous peine d'être libéré de l'hommage. La Haute Cour était le moteur constitutionnel de l’Orient latin : les rois gouvernaient avec son consentement et les grandes guerres baronniales du XIIIe siècle se déroulaient en son nom."
 koj_cour_des_bourgeois_bureaucracy: "Cour des Bourgeois"
 koj_cour_des_bourgeois_bureaucracy_desc: "Le Tribunal des Bourgeois, tribunal urbain des roturiers latins du royaume. Codifiée dans le Livre des Assises de la Cour des Bourgeois vers 1240 (d'après un original perdu vers 1150), elle avait juridiction sur la propriété, les dettes, les successions et les délits mineurs parmi la classe burgensis - artisans, marchands, sergents et colons pèlerins. Un jury de douze bourgeois siégeait sous la direction d'un vicomte royal ; les affaires commerciales ont suivi la Lex Mercatoria. Acre, Tyr, Jaffa, Césarée, Naplouse et Jérusalem avaient chacune leur propre Cour des Bourgeois, distincte de la Haute Cour féodale au-dessus d'elles."
 koj_latin_patriarchate_bureaucracy: "Patriarcat Latin de Jérusalem"
 koj_latin_patriarchate_bureaucracy_desc: "Le Patriarcat latin de Jérusalem, érigé sous Daimbert de Pise en 1099 pour remplacer la hiérarchie grecque dans le Saint-Sépulcre conquis. Le patriarche détenait le quartier du patriarche (une juridiction urbaine distincte dans la ville sainte), administrait la dîme du royaume et présidait les tribunaux ecclésiastiques qui exerçaient leur juridiction sur le mariage et le testament francs. Après 1291, le siège fut conservé sous forme titulaire à Acre et plus tard à Chypre. Le Patriarcat était le contrepoids spirituel à la Haute Cour et le pont juridique vers l'appareil canonique de Rome."
 koj_military_orders_charter_bureaucracy: "Charte des Ordres Militaires"
 koj_military_orders_charter_bureaucracy_desc: "La charte royale régissant les ordres templier, hospitalier et (plus tard) teutonique au sein du royaume. Les ordres militaires détenaient de vastes domaines - le Krak des Chevaliers, Margat, Atlit, Belvoir - en dehors des obligations féodales ordinaires, ne répondaient qu'à leurs Grands Maîtres et au Pape et fournissaient les armées permanentes les plus fiables du royaume. Leur appareil administratif parallèle composé de commanderies, de trésors et d'infirmeries dirigeait un État dans l'État ; la charte définissait ce que les ordres devaient au royaume et ce dont ils étaient exemptés."
 koj_assises_de_jerusalem_bureaucracy: "Assises de Jérusalem"
 koj_assises_de_jerusalem_bureaucracy_desc: "The codified feudal law of the kingdom, originally inscribed on the Lettres du Sepulcre kept in the Holy Sepulchre and lost when Saladin took Jerusalem in 1187. The corpus was reconstructed from memory by jurists in exile (John of Ibelin's Livre des Assises around 1265, Philip of Novara, James of Ibelin) and survived as the legal foundation of the kingdom of Cyprus and, in adapted form, the Assises de Romanie of Frankish Greece. The Assises codified the feudal contract, the criminal pleas of the king, and the jurisdiction of the kingdom's courts."
