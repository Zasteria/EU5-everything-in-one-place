l_french:
 STATIC_MODIFIER_NAME_nd_nub_land_of_the_bow: "Terre de l'Arc"
 STATIC_MODIFIER_DESC_nd_nub_land_of_the_bow: "Les anciens Égyptiens appelaient cette terre Ta-Seti, le Pays de l’Arc. Pendant des millénaires, les archers nubiens étaient redoutés dans tout le monde antique, employés comme mercenaires de l’Égypte à la Perse. Aujourd’hui, alors que la Nubie se relève, ses traditions guerrières renaissent. L’arc est plus qu’une arme ; c'est le symbole d'un peuple qui n'a jamais été véritablement conquis."
 STATIC_MODIFIER_NAME_nd_nub_golden_corridor: "Le couloir d'or"
 STATIC_MODIFIER_DESC_nd_nub_golden_corridor: "La Nubie se trouve à cheval sur la seule route sécurisée entre l’Afrique subsaharienne et la Méditerranée, le corridor du Nil. L'or, l'ivoire, l'ébène, l'encens et les animaux exotiques circulent vers le nord par les mains des Nubiens, tandis que les céréales, le lin et les produits manufacturés circulent vers le sud. Le royaume qui contrôle ce couloir contrôle les richesses de deux mondes."
 nd_nub.1.t: "La restauration de la Nubie"
 nd_nub.1.d: "The scattered Nubian lands are united once more. For centuries, the kingdoms of Makuria and Alodia channeled the wealth of Africa northward along the Nile, their archers the terror of any who dared invade, their churches adorned with paintings that rivaled Constantinople. Though those kingdoms fell to internal strife and foreign pressure, the Nubian people endured. Now a new chapter begins. Will Nubia restore itself as a military power whose bowmen make empires tremble, or as the indispensable trade corridor linking Africa's riches to the wider world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_nub.1.a: "Nous sommes les héritiers de Ta-Seti : que nos flèches assombrissent le ciel."
 nd_nub.1.b: "Or, ivoire et encens : le Nil portera notre fortune."
 nd_nub.2.t: "La gloire de Faras"
 nd_nub.2.d: "La cathédrale de Faras était autrefois le joyau de la Nubie chrétienne. Ses murs portaient de magnifiques peintures, des archanges aux traits nubiens sombres, des évêques aux vêtements resplendissants, la Vierge Marie rendue dans un style mêlant l'iconographie byzantine à une sensibilité distinctement africaine. Les maîtres Faras ont développé une école d'art unique dans le monde médiéval, où les figures sacrées se tournaient vers les adorateurs mortels plutôt que l'inverse. Cette tradition d'excellence artistique définit l'identité culturelle nubienne. Devons-nous restaurer Faras en tant que centre vivant de la foi, ou honorer son héritage en tant que phare de l’apprentissage et de la réussite artistique ?"
 nd_nub.2.a: "Restaurez la cathédrale : que la foi soit notre fondement."
 nd_nub.2.b: "Les maîtres Faras inspirent une nouvelle ère d’apprentissage nubien."
 nd_nub.3.t: "L'héritage du Baqt"
 nd_nub.3.d: "En 652, le royaume de Makurie signa le Baqt avec les gouverneurs arabes d'Égypte, l'un des traités les plus anciens de l'histoire. Pendant plus de six siècles, cet accord a garanti la paix le long du Nil : la Nubie envoyait des esclaves, des girafes et des produits exotiques vers le nord, tandis que l'Égypte fournissait en retour des céréales, du vin et des textiles. Le Baqt n’était pas simplement un accord commercial mais un chef-d’œuvre diplomatique qui tenait à distance les armées du califat lorsqu’elles conquéraient tout sur leur passage. Cette tradition de diplomatie avisée reste une partie du patrimoine de la Nubie. Devons-nous honorer l'héritage du Baqt en tant que tradition diplomatique ou en tant que fondement de nos réseaux commerciaux ?"
 nd_nub.3.a: "Le Baqt nous enseigne qu’un sage traité vaut plus que mille soldats."
 nd_nub.3.b: "Les routes commerciales du Baqt nous rendront riches au-delà de toute mesure."
 nd_nub.4.t: "La synthèse Funj"
 nd_nub.4.d: "Lorsque le peuple Funj accéda au pouvoir en 1504, il construisit un nouveau sultanat à Sennar sur les ruines de Christian Alodia. Mais les Funj ne se sont pas contentés de remplacer une civilisation par une autre. Bien qu’ils aient adopté l’islam, ils ont préservé les coutumes africaines et les rituels préislamiques parallèlement à leur nouvelle foi. Les voyageurs européens ont décrit un « empire africain à façade musulmane », un royaume où les érudits islamiques enseignaient dans les madrasas tandis que les cérémonies traditionnelles se poursuivaient dans les campagnes. Cette synthèse de l'ancien et du nouveau, de l'Afrique et de l'islam, a créé une identité soudanaise unique. La Nubie adoptera-t-elle le renouveau islamique orthodoxe ou célébrera-t-elle l’héritage syncrétique qui rend sa culture distinctive ?"
 nd_nub.4.a: "Que la lumière de la vraie foi illumine notre pays."
 nd_nub.4.b: "Notre force réside dans le mélange des traditions."
 nd_nub.5.t: "La Saqia transforme le Nil"
 nd_nub.5.d: "La saqia, la roue hydraulique entraînée par des bœufs, a révolutionné l'agriculture nubienne. Contrairement à l'Égypte, où la crue annuelle du Nil irrigue naturellement les terres, l'agriculture nubienne dépend entièrement de l'irrigation mécanique. Une seule saqia, tournant toute la journée, peut arroser deux hectares de terres cultivées au bord de la rivière. À mesure que les saqias se multiplient le long du Nil, les villages s'agrandissent, les populations augmentent et l'étroite bande de verdure le long des berges du fleuve s'élargit. Le grincement rythmique de la roue hydraulique est devenu le battement du cœur de la vie nubienne."
 nd_nub.5.a: "Le fleuve donne la vie à tous ceux qui savent y puiser."
 STATIC_MODIFIER_NAME_nd_nub_faras_restored: "Faras restauré"
 STATIC_MODIFIER_DESC_nd_nub_faras_restored: "La cathédrale de Faras a été restaurée pour devenir un centre de dévotion chrétienne nubienne, ses murs portant à nouveau les magnifiques peintures qui impressionnaient autrefois les pèlerins du monde chrétien."
 STATIC_MODIFIER_NAME_nd_nub_faras_beacon: "Phare du Nil"
 STATIC_MODIFIER_DESC_nd_nub_faras_beacon: "Les traditions artistiques et savantes de Faras ont été relancées en tant que centre d'apprentissage, où les techniques des maîtres anciens inspirent les nouvelles générations d'érudits et d'artistes nubiens."
 STATIC_MODIFIER_NAME_nd_nub_baqt_diplomacy: "La tradition du Bakt"
 STATIC_MODIFIER_DESC_nd_nub_baqt_diplomacy: "L'héritage diplomatique de la Nubie, forgé par le traité séculaire de Baqt avec l'Égypte, donne à ses envoyés une compréhension instinctive de la manière de négocier à partir d'une position de confiance culturelle."
 STATIC_MODIFIER_NAME_nd_nub_baqt_commerce: "Commerce du Baqt"
 STATIC_MODIFIER_DESC_nd_nub_baqt_commerce: "Les réseaux commerciaux établis dans le cadre de l’accord historique de Baqt continuent d’acheminer les marchandises entre l’Afrique subsaharienne et la Méditerranée via les mains des Nubiens."
 STATIC_MODIFIER_NAME_nd_nub_funj_islamic_renewal: "Renouveau islamique"
 STATIC_MODIFIER_DESC_nd_nub_funj_islamic_renewal: "L’érudition islamique orthodoxe a pris racine en Nubie, avec des hommes saints et des érudits créant des écoles d’apprentissage qui relient la terre au monde islamique au sens large."
 STATIC_MODIFIER_NAME_nd_nub_funj_syncretic_heritage: "Patrimoine syncrétique"
 STATIC_MODIFIER_DESC_nd_nub_funj_syncretic_heritage: "La Nubie embrasse son identité à plusieurs niveaux, ses traditions chrétiennes, islamiques et africaines tissées ensemble dans une culture qui transcende les frontières de toute religion."
 nd_nub_ta_seti_archery: "Tir à l'arc Ta-Seti"
 nd_nub_ta_seti_archery_desc: "Les archers de Ta-Seti, le « Pays de l'arc », étaient craints dans tout le monde antique. Cette tradition d'excellence du tir à l'arc perdure chez les guerriers nubiens qui s'entraînent dès l'enfance avec le grand arc long."
 nd_nub_gold_mining: "Wadi Allaqi Or"
 nd_nub_gold_mining_desc: "Les gisements d'or du Wadi Allaqi et du désert oriental constituent une source de richesse nubienne depuis l'époque des pharaons. Des opérations minières systématiques extraient le métal précieux qui finance les royaumes."
 nd_nub_saqia_expansion: "Irrigation Saqia"
 nd_nub_saqia_expansion_desc: "La roue hydraulique actionnée par des bœufs, la saqia, transforme l'étroite plaine inondable du Nil en terres agricoles productives, rendant le désert vert champ après champ."
 nd_nub_painted_pottery: "Poterie peinte nubienne"
 nd_nub_painted_pottery_desc: "Les potiers nubiens produisent des objets distinctifs décorés de symboles chrétiens (poissons, colombes, croix et feuilles de palmier) dans des styles mêlant les traditions africaines et méditerranéennes."
 nd_nub_nile_corridor: "Commerce du corridor du Nil"
 nd_nub_nile_corridor_desc: "Nubia commands the Nile corridor, the only secure route for African exotica to reach the Mediterranean. Ivory, ebony, incense, and exotic animals pass through Nubian hands."
 nd_nub_coptic_roots: "Racines coptes"
 nd_nub_coptic_roots_desc: "La conversion de la Nubie au christianisme avant 600 après JC a établi des liens profonds avec l'Égypte copte et le monde chrétien au sens large, créant ainsi un héritage spirituel qui persiste à travers les siècles."
 nd_nub_fortress_building: "Fortifications du Nil"
 nd_nub_fortress_building_desc: "Des villes fortifiées et des tours de guet bordent le Nil, protégeant les colonies nubiennes des pilleurs du désert et des envahisseurs étrangers. Ces forteresses de pierre contrôlent les points d'étranglement du fleuve."
 nd_nub_pitati_tradition: "Archers Pitati"
 nd_nub_pitati_tradition_desc: "Les Pitati étaient des contingents d'archers nubiens d'élite si réputés que les pharaons égyptiens les réquisitionnaient nommément. Cette tradition du tir à l’arc professionnel produit des guerriers d’une habileté extraordinaire."
 nd_nub_makurian_cavalry: "Cavaliers makuriens"
 nd_nub_makurian_cavalry_desc: "La cavalerie de Makuria patrouille le couloir du Nil à cheval, armée de lance et d'arc. Ces cavaliers constituent la première ligne de défense contre les incursions bédouines et les armées étrangères."
 nd_nub_monastic_centers: "Centres monastiques"
 nd_nub_monastic_centers_desc: "Les grands monastères de Nubie (Banganarti, Ghazali et autres) servent de centres d'apprentissage, de pèlerinage et de production artistique, préservant l'alphabétisation en grec, copte et vieux nubien."
 nd_nub_faras_tradition: "Tradition de la cathédrale de Faras"
 nd_nub_faras_tradition_desc: "Les réalisations artistiques des maîtres de la cathédrale de Faras, leur style unique de peinture murale mêlant l'iconographie byzantine à l'humanité africaine, représentent le summum de l'expression culturelle nubienne."
 nd_nub_ivory_trade: "Réseaux commerciaux de l’ivoire"
 nd_nub_ivory_trade_desc: "Les marchands nubiens contrôlent le commerce de l’ivoire depuis l’intérieur de l’Afrique jusqu’aux marchés méditerranéens, exploitant des entrepôts et des caravanes qui transportent cette précieuse denrée le long d’anciennes routes."
 nd_nub_desert_leathercraft: "Maroquinerie du désert"
 nd_nub_desert_leathercraft_desc: "Nubian leatherworkers transform animal hides into fine goods (saddles, shields, containers, and decorative items) using techniques perfected over generations in the desert climate."
 nd_nub_dongola_court: "Cour du Vieux Dongola"
 nd_nub_dongola_court_desc: "Les traditions administratives du Vieux Dongola, capitale de la Makurie depuis plus de sept siècles, constituent la base d'une gouvernance organisée le long du Nil."
 nd_nub_baqt_legacy: "L'héritage du Baqt"
 nd_nub_baqt_legacy_desc: "Le Baqt, le traité entre la Makurie et les gouverneurs arabes d'Égypte qui a duré plus de six siècles, a établi la réputation de la Nubie en tant que puissance diplomatique capable de négocier la paix avec les empires les plus puissants."
 nd_nub_citadel_garrison: "Garnison de la Citadelle"
 nd_nub_citadel_garrison_desc: "Les villes fortifiées du Nil produisent des troupes de garnison professionnelles entraînées à la défense des murs de pierre et des passages de rivières, une infanterie lourde construite pour tenir tête à tout assaut."
 nd_nub_red_sea_incense: "Encens Mer Rouge"
 nd_nub_red_sea_incense_desc: "The incense trade routes connecting the Horn of Africa to the Red Sea coast pass through Nubian-controlled territory, bringing fragrant wealth from distant lands. From Aydhab and Suakin the jalba, a ship sewn without a nail, carries resin and pilgrims across to Arabia."
 nd_nub_four_scripts: "Quatre scripts"
 nd_nub_four_scripts_desc: "Les scribes nubiens maîtrisent quatre systèmes d'écriture (vieux nubien, grec, copte et arabe), leur donnant accès aux traditions savantes des mondes chrétien et islamique."
 nd_nub_cataract_defenses: "Défenses contre la cataracte"
 nd_nub_cataract_defenses_desc: "Les cataractes du Nil forment des points d'étranglement naturels que les défenseurs nubiens fortifient et exploitent. Toute armée remontant le fleuve doit traverser ces passages mortels sous une pluie de flèches."
 nd_nub_funj_synthesis: "Synthèse Funj"
 nd_nub_funj_synthesis_desc: "Le sultanat de Funj a créé un mélange culturel unique, une foi islamique superposée aux traditions africaines, créant une identité soudanaise qui transcende les frontières de toute civilisation."
 nd_nub_sennar_scholarship: "Bourse Sennar"
 nd_nub_sennar_scholarship_desc: "Under the Funj sultans the holy men of the Nile open their own schools. The masid of a learned family teaches the Quran and Maliki law, and students walk to it from across the Nile valley and beyond."
 nd_nub_caravan_trade: "Commerce de caravanes"
 nd_nub_caravan_trade_desc: "Long-distance caravan routes connect Nubia to the markets of Egypt, the Horn of Africa, and the Sahel, carrying slaves, gold, and agricultural products to distant buyers. The dates of the Nile palms travel with them as wine.\n\n#italic Available in: $nd_nub_nile_workshops$#!"
 nd_nub_sultanate_authority: "Autorité du Sultanat"
 nd_nub_sultanate_authority_desc: "Les sultans de Funj consolident leur autorité sur les divers peuples de la vallée du Nil, imposant une administration centralisée sur des chefferies et des territoires tribaux autrefois indépendants."
 nd_nub_butana_cavalry: "Cavaliers Butana"
 nd_nub_butana_cavalry_desc: "The Butana steppe between the Nile and the Atbara river breeds hardy horses and fiercer riders. These mounted warriors range across the open grasslands, raiding and patrolling vast distances. The sultans of Sennar mount their mailed guard, the Black Horse, on the same breed."
 nd_nub_kordofan_expansion: "Extension du Cordofan"
 nd_nub_kordofan_expansion_desc: "L'autorité nubienne s'étend vers l'ouest dans les hauts plateaux du Kordofan et des monts Nouba, intégrant de nouveaux peuples et ressources dans le domaine du royaume."
 nd_nub_sennar_firearms: "Mousquetaires de Sennar"
 nd_nub_sennar_firearms_desc: "Le sultanat de Funj adopte la technologie des armes à feu, équipant l'infanterie de mousquets acquis grâce à des contacts commerciaux en mer Rouge. Une nouvelle ère de puissance militaire nubienne commence."
 nd_nub_sennar_golden_age: "L'âge d'or de Sennar"
 nd_nub_sennar_golden_age_desc: "Under the late Funj sultans, Sennar reaches its peak as a thriving capital, a city of markets, mosques, and mansions where African, Arab, and Ottoman influences mingle. Lengths of its cotton cloth, the damur, pass as money in its markets.\n\n#italic Available in: $nd_nub_nile_workshops$#!"
 nd_nub_blue_nile_agriculture: "Agriculture du Nil Bleu"
 nd_nub_blue_nile_agriculture_desc: "Les terres fertiles le long du Nil Bleu, enrichies par les inondations saisonnières, produisent d'abondantes récoltes de céréales et de coton qui soutiennent la population croissante du sultanat."
 nd_nub_hamaj_regency: "Régence Hamaj"
 nd_nub_hamaj_regency_desc: "Les régents Hamaj qui en sont venus à dominer le défunt tribunal de Funj ont introduit des réformes administratives qui rationalisent la gouvernance, même si elles réduisent les sultans eux-mêmes au rang de figures de proue."
 nd_nub_suakin_trade: "Passerelle Suakin"
 nd_nub_suakin_trade_desc: "Le port de Suakin sur la mer Rouge relie la Nubie au monde commercial de l’océan Indien, apportant la richesse des routes des épices et donnant accès aux marchés de toute l’Arabie et au-delà."
 nd_nub_military_reform: "Réforme militaire"
 nd_nub_military_reform_desc: "Les réformes militaires de la fin de la période professionnalisent l'armée nubienne, en introduisant des exercices militaires, un équipement standardisé et une discipline tactique pour compléter le courage traditionnel des guerriers."
 nd_nub_nubian_identity: "Identité nubienne"
 nd_nub_nubian_identity_desc: "Une fierté renouvelée pour l’identité culturelle nubienne (son art, sa langue et ses traditions uniques) apparaît comme le fondement d’une conscience nationale nubienne moderne."
 nd_nub_modern_irrigation: "Irrigation moderne"
 nd_nub_modern_irrigation_desc: "Les techniques avancées d’irrigation transforment la vallée du Nil, élargissant les terres arables bien au-delà de ce que l’ancienne saqia pouvait atteindre et soutenant une population croissante."
 nd_nub_resistance_tradition: "Tradition de la Résistance"
 nd_nub_resistance_tradition_desc: "La Nubie a une tradition millénaire de résistance à la domination étrangère, de l’Assyrie à Rome en passant par les califats arabes. Ce défi n’est pas de l’entêtement mais une profonde conviction culturelle que la souveraineté nubienne n’est pas négociable."
 nd_nub_sufi_networks: "Réseaux soufis"
 nd_nub_sufi_networks_desc: "Sufi orders spread through the Nubian countryside, providing spiritual leadership, social services, and a unifying popular religion that transcends tribal and ethnic boundaries."
 nd_nub_nile_mercantile: "Marchand du Nil"
 nd_nub_nile_mercantile_desc: "Des réseaux commerciaux interculturels relient les commerçants nubiens aux marchés d’Afrique et du Moyen-Orient, créant ainsi une classe commerciale qui dépasse les frontières religieuses et ethniques."
 nd_nub_modern_governance: "Gouvernance moderne"
 nd_nub_modern_governance_desc: "La modernisation administrative apporte une tenue de registres centralisée, une fiscalité standardisée et une bureaucratie professionnelle à un royaume qui gouvernait autrefois par l'autorité personnelle et les coutumes tribales."
 a_nd_nub_nubian_archers: "Archers nubiens"
 a_nd_nub_nubian_archers_desc: "Les archers légendaires de Ta-Seti, armés de grands arcs longs en bois de palmier séché. Formés dès l'enfance, ces archers peuvent frapper des cibles avec une précision dévastatrice à des distances qui étonnent les observateurs étrangers."
 a_nd_nub_pitati: "Archers Pitati"
 a_nd_nub_pitati_desc: "Archers professionnels d'élite nommés d'après le terme égyptien désignant les contingents d'archers nubiens. Les Pitati combinent la maîtrise traditionnelle nubienne de l'arc avec une discipline militaire organisée."
 a_nd_nub_nile_horsemen: "Cavaliers du Nil"
 a_nd_nub_nile_horsemen_desc: "Cavalerie makurienne armée de lances et d'arcs, patrouillant le couloir du Nil sur des chevaux robustes. Ces cavaliers sont aussi à l'aise en selle qu'à pied, capables de combattre comme des archers montés ou des cavaliers de choc."
 a_nd_nub_dongola_guard: "Gardes Dongola"
 a_nd_nub_dongola_guard_desc: "Infanterie lourde issue des traditions de garnison du vieux Dongola et des villes fortifiées du Nil. Ces soldats sont entraînés à maintenir les murs et les passages de rivières contre toute attente."
 a_nd_nub_sennar_musketeers: "Mousquetaires de Sennar"
 a_nd_nub_sennar_musketeers_desc: "Infanterie à poudre du sultanat de Funj, équipée de mousquets acquis grâce au commerce de la mer Rouge. Ils représentent l’évolution de la tradition militaire nubienne vers l’ère des armes à feu."
 nd_nub_saqia: "Roue hydraulique Saqia"
 nd_nub_saqia_desc: "Une roue hydraulique entraînée par des bœufs qui soulève l’eau de la rivière pour irriguer les champs le long de l’étroite plaine inondable du Nil. La saqia est l’épine dorsale de toute l’agriculture nubienne."
 nd_nub_nile_fortress: "Forteresse du Nil"
 nd_nub_nile_fortress_desc: "Une place forte fortifiée en pierre et en brique crue occupant une position stratégique le long du Nil. Ces forteresses contrôlent le trafic fluvial et servent de refuge contre les pillards du désert."
 nd_nub_monastery: "Monastère nubien"
 nd_nub_monastery_desc: "Un centre de dévotion et d'apprentissage chrétiens, où les moines conservent des manuscrits en grec, copte et vieux nubien. Le scriptorium et la chapelle peinte du monastère attirent des pèlerins du monde chrétien."
 nd_nub_gold_camp: "Camp de traitement de l'or"
 nd_nub_gold_camp_desc: "Un camp minier dans le désert oriental où le quartz aurifère est broyé et lavé pour extraire le métal précieux qui a fait la richesse de la Nubie depuis l'époque des pharaons."
 nd_nub_ivory_warehouse: "Entrepôt d'ivoire"
 nd_nub_ivory_warehouse_desc: "Un entrepôt fortifié où les défenses en ivoire de l'intérieur de l'Afrique sont collectées, classées et préparées pour être vendues aux marchands méditerranéens. La position de la Nubie sur le Nil en fait l'entrepôt naturel de ce commerce de luxe."
 nd_nub_pottery_workshop: "Atelier de poterie"
 nd_nub_pottery_workshop_desc: "Un atelier produisant des poteries peintes distinctives de Nubie, des récipients décorés de symboles chrétiens et de motifs géométriques dans un style unique à la vallée du Nil."
 nd_nub_madrasa: "Masid"
 nd_nub_madrasa_desc: "The compound of a holy family of the Funj period: a Quran school, a mosque, a guest house and the tomb of the founder, kept by his descendants. Law is taught here from the Maliki handbooks, and the students who leave it open schools of their own."
 nd_nub_saqia_operation: "Opération Saqia"
 nd_nub_saqia_operation_desc: "L'entretien de la roue hydraulique entraînée par des bœufs nécessite du bétail pour alimenter le mécanisme et du bois pour réparer les engrenages et les seaux en bois."
 nd_nub_fortress_upkeep: "Entretien de la forteresse"
 nd_nub_fortress_upkeep_desc: "L'entretien des fortifications en pierre du Nil nécessite un approvisionnement constant en pierre de taille pour les réparations et en armes pour armer la garnison."
 nd_nub_monastery_maintenance: "Entretien du monastère"
 nd_nub_monastery_maintenance_desc: "Le monastère a besoin de cire d'abeille pour les bougies et l'usage liturgique, ainsi que de papier pour le scriptorium où les moines copient les manuscrits."
 nd_nub_gold_processing: "Traitement de l'or"
 nd_nub_gold_processing_desc: "Le bois alimente les feux utilisés pour chauffer les roches aurifères avant de les broyer, extrayant ainsi le métal précieux qui a fait la richesse de la Nubie depuis l'époque des pharaons."
 nd_nub_ivory_storage: "Rangement ivoire"
 nd_nub_ivory_storage_desc: "Le stockage et la protection des précieuses défenses en ivoire nécessitent des entrepôts de bois robustes et une gestion minutieuse."
 nd_nub_pottery_production: "Production de poterie"
 nd_nub_pottery_production_desc: "Les potiers nubiens façonnent des récipients en argile locale et les décorent de motifs peints distinctifs à l'aide de colorants, produisant ainsi la célèbre poterie de la vallée du Nil."
 nd_nub_madrasa_upkeep: "Masid Upkeep"
 nd_nub_madrasa_upkeep_desc: "Paper for the copying of law books, cloth for the students and incense for the tomb of the founder."
 nd_nub_leatherworking: "Travail du cuir nubien"
 nd_nub_leatherworking_desc: "Hides are salted, tanned with the pods of the Nile acacia and worked into shields, saddles and water skins."
 nd_nub_nile_workshops: "Nile Workshops"
 nd_nub_nile_workshops_desc: "The craft quarter of a Nile town. Leather is made here first. Smiths, date wine makers and cotton weavers are added as their crafts are taken up, and each town works the craft its market can feed."
 nd_nub_coral_harbor: "Coral Harbour"
 nd_nub_coral_harbor_desc: "A harbour in the manner of Suakin: an island of merchants' houses built from coral blocks, reached through one channel in the reef. Pilgrim ships and the India trade are sheltered here."
 nd_nub_coral_harbor_upkeep: "Harbour Upkeep"
 nd_nub_coral_harbor_upkeep_desc: "Coral blocks for the houses and quays, timber for their balconies, and stores for the ships at anchor."
 n_nd_nub_jalba: "Jalba"
 n_nd_nub_jalba_desc: "A Red Sea ship whose planks are sewn with coir and caulked with shark oil, without a nail in the hull. It is loaded with pilgrims and resin far beyond what its size suggests, and it does not bear rough handling."
 a_nd_nub_black_horse: "Black Horse"
 a_nd_nub_black_horse_desc: "The mailed cavalry of the sultans of Sennar. Rider and horse are covered in mail and quilting, and the broadsword is carried. They are mounted on the horses of the Butana and Dongola."
 levy_nd_nub_black_horse: "Black Horse Levy"
 levy_nd_nub_black_horse_desc: "Nobles of the Blue Nile, mustered in mail on Butana horses as the heavy cavalry of the realm."
 levy_nd_nub_archers: "Prélèvement d'archer nubien"
 levy_nd_nub_archers_desc: "Paysans et soldats formés à l'art traditionnel nubien du grand arc long, appelés aux armes en cas de besoin."
 levy_nd_nub_horsemen: "Prélèvement des cavaliers du Nil"
 levy_nd_nub_horsemen_desc: "Nobles et soldats du couloir du Nil, montés sur des chevaux robustes et armés de lances et d'arcs, regroupés en levées de cavalerie."
 nd_nub_metalworking: "Travail des métaux nubiens"
 nd_nub_metalworking_desc: "Iron is worked over charcoal into hoes, waterwheel fittings and blades."
 nd_nub_date_wine: "Traitement du vin de datte"
 nd_nub_date_wine_desc: "Dates of the Nile palms are fermented in jars into wine, a drink known on this river since the time of the pharaohs."
 nd_nub_cotton_weaving: "Tissage de coton nubien"
 nd_nub_cotton_weaving_desc: "Cotton of the Blue Nile is woven into damur, the plain cloth whose lengths pass as money at Sennar."
 nd_nub_nile_metalwork: "Ferronnerie du Nil"
 nd_nub_nile_metalwork_desc: "Nubian smiths work iron and copper from the Eastern Desert into tools, weapons, and ornamental objects, supporting both agriculture and warfare along the Nile.\n\n#italic Available in: $nd_nub_nile_workshops$#!"
 nd_nub_formed_tt: "La Nubie s'est formée"
 nd_nub_path_a_tt: "Choisissez le pays de l'arc"
 nd_nub_path_b_tt: "Choisissez le couloir doré"
 nd_nub_destiny: "Destin de la Nubie"
 nd_nub_destiny_desc: "Les terres nubiennes sont à nouveau unies. Que ce soit par la proue ou la route commerciale, le destin du royaume l'attend."
 nd_nub_dest_upper_nile: "Le Haut Nil sécurisé"
 nd_nub_dest_upper_nile_desc: "Conquer Upper Egypt and secure the Nile corridor from the cataracts to the delta approaches. Requires ownership of Aswan and Qus, and a Nile Fortress in 3 locations."
 nd_nub_dest_fortresses_3_tt: "A #bold Nile Fortress#! stands in at least #bold 3#! of our locations"
 nd_nub_dest_fortresses_5_tt: "A #bold Nile Fortress#! stands in at least #bold 5#! of our locations"
 nd_nub_dest_horn_march: "La marche au-delà"
 nd_nub_dest_horn_march_desc: "Extend Nubian military power into the Ethiopian highlands and the Kordofan steppe. Requires ownership of Axum and El Obeid, a Nile Fortress in 5 locations, and prestige of 50."
 nd_nub_dest_pharaoh: "Pharaon de Kouch"
 nd_nub_dest_pharaoh_desc: "Complete the dream of the 25th Dynasty, rule Egypt from Cairo to the sea and command the holy cities of Arabia. Requires ownership of Cairo, Alexandria and Mecca, prestige of 75, and 3,000 gold."
 nd_nub_dest_ivory_road: "La route de l'ivoire"
 nd_nub_dest_ivory_road_desc: "Faire de la Nubie la porte d’entrée de l’ivoire africain vers les marchés mondiaux. Nécessite 1 000 pièces d'or, l'institution bancaire et de l'ivoire négocié sur un marché national."
 nd_nub_dest_red_sea: "La porte de la mer Rouge"
 nd_nub_dest_red_sea_desc: "Seize the port of Massawa and connect the Nile corridor to the Indian Ocean. Requires ownership of Massawa, Suakin held and built up to a development of 9, 2,000 gold, and pearls in the capital market."
 nd_nub_dest_suakin_developed_tt: "#bold Suakin#! is ours and has reached a development of 9"
 nd_nub_dest_crossroads: "Carrefour du monde"
 nd_nub_dest_crossroads_desc: "Contrôlez les routes commerciales reliant l’Afrique, l’Arabie et l’océan Indien. Nécessite la possession de Djeddah et d'Aden, 3 000 pièces d'or et un prestige de 75."
 nd_nub.6.t: "Le destin de la Nubie"
 nd_nub.6.d: "Le royaume nubien est réunifié, son peuple fier et ses frontières sécurisées. L'héritage ancien de Kouch, Méroé, Makurie et Alodia perdure dans chaque forteresse de pierre le long du Nil et dans chaque prière de chaque église et mosquée. Désormais, la question passe de la survie à l’ambition. Quelle marque cette Nubie restaurée laissera-t-elle sur le monde ?"
 nd_nub.6.a: "Notre destin nous attend."
 nd_nub.7.t: "Le Haut Nil sécurisé"
 nd_nub.7.d: "Les armées nubiennes ont marché vers le nord, au-delà des cataractes, et ont pris Assouan et Qus. Pour la première fois depuis les grands pharaons de la 25e dynastie, des soldats koushites montent la garde en Haute-Égypte. Les anciens temples de Philae et d'Edfou, construits à l'époque où les rois nubiens portaient la double couronne, sont à nouveau sous la protection d'un État nubien. Les fellahins de la vallée du Nil lèvent les yeux de leurs champs pour apercevoir des guerriers à la peau foncée dont les ancêtres régnaient autrefois de Memphis à Napata."
 nd_nub.7.a: "Les cataractes s'inclinent devant nous."
 nd_nub.8.t: "La marche au-delà"
 nd_nub.8.d: "The armies of Nubia have achieved what no Nile kingdom has managed in centuries. In the west, the Kordofan steppe and its wealth of cattle and iron submit to Nubian authority. In the south, the ancient rival Axum has fallen, its mountain fortresses now garrisoned by Nubian troops. The kingdom's strategic position is formidable. It commands the Nile, the Red Sea coast, and the approaches to both Egypt and the Horn of Africa.\n\nBut the manner of our expansion defines our character. Shall we ride the fury of our warriors, pressing forward with relentless momentum? Or shall we consolidate our gains through careful logistics, building the infrastructure of lasting empire?"
 nd_nub.8.a: "Fureur et élan : que rien ne se dresse devant nous."
 nd_nub.8.b: "Fortifier, approvisionner, consolider : puis avancer."
 nd_nub.9.t: "Pharaon de Kouch"
 nd_nub.9.d: "It is done. A Nubian king sits in Cairo, as Piye and Taharqa once sat in Memphis. The pyramids of Giza and the pyramids of Meroe are united under a single crown for the first time in over two thousand years. The holy city of Mecca acknowledges Nubian suzerainty. From the Mediterranean to the Red Sea, from the cataracts to the Arabian desert, a new empire has risen from the land that Egypt once called the 'wretched Kush.'\n\nHow shall the Pharaoh of Kush rule this vast domain? As a conqueror whose armies keep the peace through overwhelming force? Or as a divine ruler whose legitimacy flows from the ancient traditions of both Nubian and Egyptian kingship?"
 nd_nub.9.a: "Nous sommes les vainqueurs : nos armées sont notre loi."
 nd_nub.9.b: "Nous sommes le souverain divin de deux terres."
 nd_nub.10.t: "La route de l'ivoire"
 nd_nub.10.d: "Les marchands d'ivoire de Nubie ont établi un réseau commercial qui s'étend des terres à éléphants de l'intérieur de l'Afrique jusqu'aux banques de la Méditerranée. Les défenses qui étaient autrefois commercialisées par poignées sur les marchés villageois affluent désormais par tonnes dans les entrepôts nubiens, classées, transformées et expédiées aux acheteurs du monde connu. L’institution bancaire a pris racine et l’or afflue dans les coffres nubiens aussi sûrement que le Nil coule vers le nord."
 nd_nub.10.a: "Les routes de l’ivoire nous rendront riches au-delà de toute mesure."
 nd_nub.11.t: "La porte de la mer Rouge"
 nd_nub.11.d: "The port of Massawa is ours, and with it control of the western shore of the Red Sea. Nubia now commands both the Nile corridor and the maritime route to the Indian Ocean. Pearls from the Red Sea, spices from India, and silk from China pass through Nubian-controlled harbors alongside the ivory, gold, and incense that have always been the kingdom's stock in trade.\n\nBut the Red Sea is contested waters. Shall we invest in controlling the sea lanes themselves, building a fleet to secure our maritime commerce? Or shall we focus on making our ports the most efficient and best-connected in the region, drawing trade through institutional excellence?"
 nd_nub.11.a: "Commandez les voies maritimes : notre flotte gardera nos richesses."
 nd_nub.11.b: "Construisez les plus beaux ports de la mer Rouge."
 nd_nub.12.t: "Carrefour du monde"
 nd_nub.12.d: "Nubian traders operate in Jeddah and Aden. The kingdom that once controlled only a narrow strip of the Nile now commands the junction where African, Arabian, and Indian Ocean trade routes converge. Gold from the Eastern Desert, ivory from the interior, incense from the Horn, pearls from the Red Sea, spices from India: all pass through Nubian hands. The commercial class of Sennar and Suakin has become one of the wealthiest in the region.\n\nShall we extend our reach across the Indian Ocean itself, building a naval presence that projects Nubian power to distant shores? Or shall we turn inward, using our wealth to build infrastructure that makes Nubia the indispensable hub where all roads meet?"
 nd_nub.12.a: "Nos navires navigueront vers l'Inde et au-delà."
 nd_nub.12.b: "Tous les chemins traversent la Nubie."
 STATIC_MODIFIER_NAME_nd_nub_dest_warrior_fury: "Fureur des archers"
 STATIC_MODIFIER_DESC_nd_nub_dest_warrior_fury: "The momentum of Nubian conquest fuels rapid reinforcement and fierce morale recovery, though the villages that send the bowmen grow weary of it."
 STATIC_MODIFIER_NAME_nd_nub_dest_logistic_war: "Logistique de l'Empire"
 STATIC_MODIFIER_DESC_nd_nub_dest_logistic_war: "Des lignes d’approvisionnement efficaces et un recrutement rapide construisent une machine militaire qui soutient l’expansion, même si le coût d’une mobilisation constante met à rude épreuve la trésorerie."
 STATIC_MODIFIER_NAME_nd_nub_dest_nile_conqueror: "Conquérant du Nil"
 STATIC_MODIFIER_DESC_nd_nub_dest_nile_conqueror: "Le Pharaon de Kouch règne grâce à une force militaire écrasante, entretenant des armées et des mercenaires bon marché tout en déclarant la guerre à volonté."
 STATIC_MODIFIER_NAME_nd_nub_dest_divine_pharaoh: "Divin Pharaon"
 STATIC_MODIFIER_DESC_nd_nub_dest_divine_pharaoh: "Le pharaon de Kouch s'appuie sur d'anciennes traditions de royauté divine, imposant la loyauté des sujets et le respect des rivaux à la table des négociations."
 STATIC_MODIFIER_NAME_nd_nub_dest_sea_lanes: "Domination de la mer Rouge"
 STATIC_MODIFIER_DESC_nd_nub_dest_sea_lanes: "Les flottes nubiennes patrouillent dans la mer Rouge, sécurisant les routes commerciales et bloquant leurs rivaux, même si l'orientation maritime laisse les forces terrestres étirées dans la marche."
 STATIC_MODIFIER_NAME_nd_nub_dest_port_mastery: "Port du Monde"
 STATIC_MODIFIER_DESC_nd_nub_dest_port_mastery: "Les ports nubiens deviennent des centres d’échanges institutionnels et de renseignements, attirant à la fois les érudits et les espions, même si leur caractère cosmopolite érode le prestige traditionnel."
 STATIC_MODIFIER_NAME_nd_nub_dest_indian_ocean: "Portée de l'océan Indien"
 STATIC_MODIFIER_DESC_nd_nub_dest_indian_ocean: "Les navires marchands et les navires de guerre nubiens sillonnent l’océan Indien, projetant leur puissance par le biais du commerce et de la force navale à travers un réseau diplomatique toujours plus vaste."
 STATIC_MODIFIER_NAME_nd_nub_dest_continental_hub: "Nexus continental"
 STATIC_MODIFIER_DESC_nd_nub_dest_continental_hub: "La Nubie investit sa richesse commerciale dans les infrastructures et l’intégration, construisant un carrefour continental où les biens et les personnes convergent à un coût minime."
 nd_nub_throne_of_kush: "Trône de Kush"
 nd_nub_throne_of_kush_desc: "Un grand centre de commandement militaire et siège royal sur le modèle des anciens palais de Napata et de Méroé, à partir duquel le pharaon de Kouch dirige les armées d'un empire restauré."
 nd_nub_throne_provisioning: "Armurerie royale"
 nd_nub_throne_provisioning_desc: "Des armes, des chevaux de guerre, des pierres taillées pour la fortification et des harnais en cuir soutiennent la garnison et approvisionnent les armées de la couronne koushite."
 nd_nub_nile_emporium: "Magasin du Nil"
 nd_nub_nile_emporium_desc: "Un vaste complexe commercial où s'échangent sous un même toit de l'ivoire, de l'encens, de l'or et des produits exotiques provenant de trois continents, le joyau de l'empire marchand de Nubie."
 nd_nub_emporium_trade: "Opérations du magasin"
 nd_nub_emporium_trade_desc: "L'ivoire, l'encens, les tissus fins et le papier circulent dans les réserves et les comptoirs du grand magasin."
 nub_eparchate_of_nobadia_bureaucracy: "Éparcat de Nobadia"
 nub_eparchate_of_nobadia_bureaucracy_desc: "The senior provincial office of Christian Makuria, a viceroyalty governing the northern Nubadian lands from Faras and later Qasr Ibrim. The Eparch (styled 'Lord of the Mountain' in his own letters and 'domestikos' in Greek correspondence) oversaw the Egyptian frontier, regulated travel permits across the cataracts, supervised the Baqt exchange, and answered directly to the king at Old Dongola. The office is documented in Old Nubian letters and Mamluk chancery records from the 8th to 13th centuries."
 nub_baqt_treaty_bureaucracy: "Système du traité Baqt"
 nub_baqt_treaty_bureaucracy_desc: "Ce pacte diplomatique et commercial unique, conclu vers 652 entre la Makurie et les gouverneurs arabes d'Égypte, a duré plus de six siècles. Il s'agit du traité le plus ancien entre une puissance musulmane et un État chrétien du monde médiéval. Un échange annuel envoyait des esclaves, de l'ivoire et des girafes vers le nord contre des céréales, du vin, des tissus et des chevaux vers le sud, mené par des agents nubiens salariés et des marchands de dhimmi sous mandat royal. Fonctionnellement ministère permanent des Affaires étrangères, le Baqt a également maintenu une paix permanente là où tous les autres voisins chrétiens du califat sont tombés."
 nub_faras_bishopric_bureaucracy: "Évêché de Faras"
 nub_faras_bishopric_bureaucracy_desc: "Le siège de la cathédrale de Pakhoras (Faras), siège du métropolite copte de Nubie. Son scriptorium produisait des manuscrits liturgiques nubiens anciens; ses murs peints (archanges, nativités et évêques dans un idiome syncrétique byzantin-africain retrouvé par les archéologues en 1961) légitimaient à la fois les rois et le clergé. L'évêché administrait les terres de l'Église dans tout le nord, respectait le calendrier et formait le clergé alphabétisé qui occupait tous les autres bureaux de l'État chrétien nubien."
 nub_sennar_palace_bureaucracy: "Administration du palais Sennar"
 nub_sennar_palace_bureaucracy_desc: "The Funj sultan's court at Sennar (founded 1504) was organised around the manjil heir-vizier, the qadi al-quda, and a hierarchy of palace offices staffed by jellaba slave-soldiers and Ja'aliyyin scribes. It replaced the Christian-era kingship with an Islamic absolutist court while preserving older African ceremonial. The Scottish traveller James Bruce, who reached Sennar in 1772, called it 'an African empire with a Muslim facade.'"
 nub_hamaj_regency_bureaucracy: "Régence Hamaj"
 nub_hamaj_regency_bureaucracy_desc: "Après le coup d'État de 1761, les vizirs-régents Hamaj, issus de la noblesse Funj-Ja'aliyyin, éclipsèrent les sultans de Sennar et gouvernèrent par l'intermédiaire d'un conseil de chefs de lignée tribale. La couronne n'a survécu que de nom ; la véritable autorité était dévolue aux grands clans de la confédération Butana et Ja'aliyyin. Cet arrangement a stabilisé le royaume dans son déclin en donnant à l'aristocratie noble et tribale une voix formelle, mais a érodé le pouvoir central jusqu'à ce que l'invasion égyptienne de 1820 mette fin au sultanat."
 AUTO_MODIFIER_NAME_nd_nub_bureaucracy_authority: "Appareil administratif permanent"
 AUTO_MODIFIER_DESC_nd_nub_bureaucracy_authority: "Nubia's layered institutional heritage (the Christian eparchate of the cataracts, the Baqt diplomatic apparatus, the cathedral see, and the later Funj palace and Hamaj regency) has left the court room for three permanent institutions."
