l_french:
 STATIC_MODIFIER_NAME_nd_hasina_of_the_highlands: "Hasina des Hautes Terres"
 STATIC_MODIFIER_DESC_nd_hasina_of_the_highlands: "The sacred power of the highlands flows through the centralized state. Through irrigation, codified law, and the divine mandate of the andriana, the realm transforms its mountain heartland into the breadbasket of an island nation."
 STATIC_MODIFIER_NAME_nd_island_of_a_thousand_ports: "L'île aux mille ports"
 STATIC_MODIFIER_DESC_nd_island_of_a_thousand_ports: "Les côtes de Madagascar regorgent de pirogues à balancier transportant des marchandises à travers le canal du Mozambique et au-delà. Suivant la tradition Sakalava, l’île unifiée projette sa puissance à travers l’océan Indien grâce à la suprématie navale et aux flottes marchandes."
 STATIC_MODIFIER_NAME_nd_sorabe_scholarly_tradition: "Tradition savante Sorabe"
 STATIC_MODIFIER_DESC_nd_sorabe_scholarly_tradition: "Les érudits d'Antemoro ont introduit l'art de l'écriture à la cour, en enregistrant les lois, les prophéties et les histoires dans l'écriture arabo-malgache sorabe."
 STATIC_MODIFIER_NAME_nd_fanompoana_state_labor: "Travail de l’État de Fanompoana"
 STATIC_MODIFIER_DESC_nd_fanompoana_state_labor: "The state commands the labor of its subjects for public works, irrigation canals, roads, fortifications, and military service. The state grows powerful, but the cost falls heavy on the common people."
 STATIC_MODIFIER_NAME_nd_fanompoana_commuted_taxes: "Fanompoana commué en impôts"
 STATIC_MODIFIER_DESC_nd_fanompoana_commuted_taxes: "Rather than demanding labor directly, the state accepts payment in rice and silver. The people prosper in their freed time, and the treasury swells with the fruits of a more efficient economy."
 nd_mir.1.t: "L'unification de Madagascar"
 nd_mir.1.d: "The great island stands unified at last. For generations, the Merina of the highlands, the Sakalava of the western coasts, the Betsileo of the southern mountains, and the Antemoro scholars of the southeast each built kingdoms of their own. Now, through conquest, diplomacy, and the sacred authority of hasina, one ruler commands them all.\n\nBut unification poses a fundamental question. Madagascar's strength has always been dual: the productive highland rice terraces that feed millions, and the vast coastline whose outrigger fleets connect the island to the trade routes of the Indian Ocean. The new realm must choose which of these traditions will define its character.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mir.1.a: "Nous cultiverons les hautes terres et régnerons depuis les collines sacrées."
 nd_mir.1.b: "Nous commanderons les mers depuis mille ports."
 nd_mir.2.t: "Les Manuscrits Sorabe"
 nd_mir.2.d: "The Antemoro scholars of the southeastern coast are the keepers of a remarkable tradition. Descended from Arab and Swahili merchants who settled at the mouth of the Matitanana River, they developed the Sorabe: a system of writing the Malagasy language using Arabic script. Their manuscripts record not only religious texts but also astrological charts, medical remedies, genealogies, and the histories of kings.\n\nRecognizing the power of literacy, the court has invited Antemoro ombiasy to serve as scribes, astrologers, and advisors. For the first time, the laws of the realm and the pronouncements of its rulers will be recorded in writing, bringing order and permanence to what was once transmitted only through oral tradition."
 nd_mir.2.a: "Que la sagesse du Sorabe illumine notre cour."
 nd_mir.3.t: "La question de Fanompoana"
 nd_mir.3.d: "The fanompoana, the system of corvee labor owed by all free subjects to the state, has been the engine of the realm's growth. Through fanompoana, irrigation canals have been dug, fortifications raised, roads cut through the jungle, and armies marched to war. Every great work of the state has been built on the backs of its people.\n\nBut the system strains under its own weight. Farmers pulled from their fields during planting season return to find their families hungry. Artisans conscripted to distant construction sites cannot ply their trades. The question now confronting the state is whether to intensify fanompoana to fuel greater ambitions, or to commute the obligation into taxes paid in rice and coin, freeing the people to labor for themselves while still filling the state treasury."
 nd_mir.3.a: "Le travail du peuple est le fondement de l’État."
 nd_mir.3.b: "Laissez-les plutôt payer en riz et en argent."
 nd_mir.4.t: "La colline sacrée d'Ambohimanga"
 nd_mir.4.d: "Rising from the central highlands northeast of Antananarivo, the fortified hill of Ambohimanga has become the spiritual heart of the realm. Its rova (a complex of wooden palaces, stone walls, and sacred enclosures) embodies the union of political authority and ancestral power that defines Malagasy rule.\n\nThe great gates of Ambohimanga, sealed each night by rolling a massive stone disc across the entrance, guard not merely a settlement but a concept: that the land itself is sacred, and that those who rule from its heights do so with the blessing of the razana: the ancestors who watch over their descendants from the world beyond."
 nd_mir.4.a: "Ambohimanga sera notre citadelle éternelle."
 nd_mir.5.t: "The Modernization of the Realm"
 nd_mir.5.d: "A new wind blows through the highlands. Inspired by contact with European powers (particularly the British, who have sent military advisors and missionaries), the state undertakes a sweeping program of modernization. Merina soldiers drill in European formations, learning to fire muskets in disciplined volleys rather than the traditional warrior charges.\n\nBeyond the military, the reforms touch every aspect of the realm. A Latin alphabet replaces the Sorabe script for official correspondence. Schools open to teach reading and arithmetic. Artisans are organized into workshops producing goods for the state. The old ways are not abandoned. The fady still govern daily life, and the ancestors still watch from Ambohimanga. But they are joined now by new techniques and new ambitions."
 nd_mir.5.a: "Nous maîtriserons les outils du monde moderne."
 nd_mir_austronesian_seafaring: "Patrimoine marin austronésien"
 nd_mir_austronesian_seafaring_desc: "Les ancêtres traversaient l’océan Indien en pirogue à balancier. Leurs descendants perpétuent cette tradition maritime le long des côtes malgaches."
 nd_mir_vazimba_legacy: "L'héritage des Vazimba"
 nd_mir_vazimba_legacy_desc: "Les guerriers des hauts plateaux qui ont déplacé les premiers habitants de Madagascar ont forgé une tradition martiale de lance et de bouclier qui perdure dans les compagnies Mpiambina."
 nd_mir_irrigated_rice_paddies: "Rizières irriguées"
 nd_mir_irrigated_rice_paddies_desc: "La technique Betsileo de culture du riz irrigué en terrasses transforme les vallées des hauts plateaux en terres agricoles les plus productives de l'océan Indien."
 nd_mir_zebu_cattle_tradition: "Tradition du bétail zébu"
 nd_mir_zebu_cattle_tradition_desc: "Zebu cattle are wealth, status, and sacred obligation in Malagasy society. Their horns crown the tombs of the great, their meat feeds the living, and their hides bind the Sorabe manuscripts. The herds are kept in sunken pens beside the villages of the cattle country."
 nd_mir_fady_taboo_system: "Système Fady Tabou"
 nd_mir_fady_taboo_system_desc: "Le système élaboré des fady (tabous ancestraux régissant le comportement, la nourriture, les lieux et le temps) lie la société malgache par une obligation spirituelle partagée."
 nd_mir_andriana_caste_system: "Ordre des Castes d'Andriana"
 nd_mir_andriana_caste_system_desc: "The codification of the andriana noble caste, the hova freemen, and the andevo servile class creates a stable social hierarchy rooted in ancestral status and written decree."
 nd_mir_highland_settlement: "Règlement des Highlands"
 nd_mir_highland_settlement_desc: "Les hauts plateaux du centre offrent des défenses naturelles, un sol fertile et une protection contre le paludisme qui sévit sur les côtes, entraînant une colonisation et une croissance démographique."
 nd_mir_fokonolona_governance: "Assemblées du village Fokon'olona"
 nd_mir_fokonolona_governance_desc: "Les fokon'olona, ​​conseils de village composés d'anciens et de notables, gouvernent les affaires locales par consensus, arbitrent les conflits et organisent le travail communal bien avant qu'un roi n'en revendique la souveraineté."
 nd_mir_highland_ironworking: "Travail du fer dans les Highlands"
 nd_mir_highland_ironworking_desc: "The smiths of the highlands smelt iron from laterite ores using charcoal furnaces, producing the tools, weapons, and agricultural implements that sustain the realm."
 nd_mir_lamba_silk_weaving: "Tissage de Soie Lamba"
 nd_mir_lamba_silk_weaving_desc: "Le lamba, tissu de soie ou de coton tissé porté comme châle par les vivants et comme linceul pour les morts, est l'expression suprême de l'art textile malgache. Le plus beau lamba akotofahana prend des mois à tisser."
 nd_mir_sorabe_writing: "Tradition d’écriture sorabe"
 nd_mir_sorabe_writing_desc: "The Antemoro ombiasy developed the Sorabe script, Malagasy written in Arabic characters, to record astrology, medicine, history, and royal genealogies. They wrote on a paper of their own making, beaten from the bark of the avoha tree."
 nd_mir_antemoro_astrologers: "Astrologues de la cour d'Antemoro"
 nd_mir_antemoro_astrologers_desc: "Les ombiasy Antemoro servent d'astrologues et de conseillers à la cour des rois malgaches, lisant la vintana : le destin écrit dans les étoiles et les phases de la lune."
 nd_mir_sakalava_expansion: "Expansion des Sakalava"
 nd_mir_sakalava_expansion_desc: "The Sakalava kingdoms of Menabe and Boina expand aggressively along the western coast, their warriors moving swiftly through a landscape they know intimately. Wherever Sakalava live, the levy is a warband of spearmen who know that country."
 nd_mir_indian_ocean_contacts: "Contacts commerciaux dans l’océan Indien"
 nd_mir_indian_ocean_contacts_desc: "Des marchands arabes, swahilis et plus tard européens font escale dans les ports de Madagascar, échangeant des tissus, des poteries et des produits métalliques contre du riz, du bétail, de la cire d'abeille et des captifs réduits en esclavage."
 nd_mir_outrigger_war_fleets: "Flottes de guerre à balancier"
 nd_mir_outrigger_war_fleets_desc: "Les pirogues de guerre Sakalava, de grands lakana à balancier transportant trente guerriers ou plus, parcourent le canal du Mozambique en grandes flottes de raid saisonnières, frappant les Comores et la côte est-africaine."
 nd_mir_rova_fortification: "Fortification de Rova"
 nd_mir_rova_fortification_desc: "Les complexes rova ​​perchés au sommet d'une colline (palais-citadelles fortifiés en pierre, en bois et en argile durcie) combinent résidence politique et point fort militaire, leurs portes massives en forme de disque de pierre étant scellées chaque nuit."
 nd_mir_menabe_boina_kingdoms: "Royaumes Menabe et Boina"
 nd_mir_menabe_boina_kingdoms_desc: "Les deux grands royaumes Sakalava, Menabe au sud et Boina au nord, dominent ensemble l'ouest de Madagascar et étendent leur influence sur toute l'île."
 nd_mir_hasina_sacred_power: "Autorité sacrée Hasina"
 nd_mir_hasina_sacred_power_desc: "Hasina, the sacred power flowing from the ancestors through those who rule, legitimizes their authority and transforms political obedience into spiritual obligation."
 nd_mir_slave_trade_profits: "Commerce des esclaves dans l'océan Indien"
 nd_mir_slave_trade_profits_desc: "Les économies de plantation des Mascareignes de la Réunion et de Maurice créent une demande insatiable de travailleurs esclaves, que les royaumes malgaches remplissent en réalisant des profits substantiels."
 nd_mir_coastal_raiding: "Tradition des raids côtiers"
 nd_mir_coastal_raiding_desc: "Des raiders malgaches en flottes à balancier descendent sur les colonies côtières de l'ouest de l'océan Indien, saisissant des captifs et des marchandises dans des frappes éclair avant de se retirer en mer."
 nd_mir_trano_gasy_architecture: "Trano Gasy Architecture"
 nd_mir_trano_gasy_architecture_desc: "Le trano gasy (la maison traditionnelle malgache en brique, en bois et en chaume, orientée nord-sud selon des principes cosmiques) évolue vers une tradition architecturale aristocratique dans les hauts plateaux."
 nd_mir_fanompoana_system: "Système de travail Fanompoana"
 nd_mir_fanompoana_system_desc: "The fanompoana, corvee labor owed by all free subjects to the state, builds canals, roads, and fortifications, and raises armies. It is the engine of state power and the burden of the common people. Service in the field is counted as part of the labor owed, and the levy is called up with it."
 nd_mir_standing_army_reform: "Réforme de l'armée permanente"
 nd_mir_standing_army_reform_desc: "The state raises permanent regiments, the tafika, armed with a mix of traditional spears and acquired muskets, drilling them into a disciplined standing force."
 nd_mir_antananarivo_capital: "Antananarivo comme capitale"
 nd_mir_antananarivo_capital_desc: "La ville aux mille collines devient la capitale incontestée d'un Madagascar unifié, ses marchés, ses palais et ses ateliers attirant la population de toute l'île."
 nd_mir_betsileo_integration: "Intégration Betsileo"
 nd_mir_betsileo_integration_desc: "The conquered Betsileo kingdoms are integrated into the Merina state, their agricultural expertise, especially terraced rice cultivation, enriching the unified realm."
 nd_mir_musket_acquisition: "Acquisition et fabrication de mousquets"
 nd_mir_musket_acquisition_desc: "Through trade with Europeans and the forced labor of skilled ironworkers, the realm acquires and maintains a growing arsenal of firearms."
 nd_mir_channel_trade_control: "Commerce du canal du Mozambique"
 nd_mir_channel_trade_control_desc: "Control of the ports along Madagascar's western coast gives the realm leverage over the trade routes crossing the Mozambique Channel between Africa and the Indian Ocean."
 nd_mir_andrianampoinimerina_reforms: "Les réformes d'Andrianampoinimerina"
 nd_mir_andrianampoinimerina_reforms_desc: "The great unifier codifies law, reorganizes the caste system, builds irrigation works, and establishes a centralized administration, transforming a highland chiefdom into a state worthy of the name."
 nd_mir_radama_modernization: "La modernisation de Radama"
 nd_mir_radama_modernization_desc: "Le roi Radama adopte les techniques militaires européennes et invite les conseillers britanniques à entraîner son armée aux exercices de mousquet, aux tactiques de formation et à la guerre disciplinée."
 nd_mir_british_alliance: "Alliance britannique"
 nd_mir_british_alliance_desc: "Le traité anglo-merina de 1820 échange l’abolition de la traite négrière contre une assistance militaire britannique, une reconnaissance diplomatique et un accès à la technologie moderne."
 nd_mir_merina_hegemony: "Hégémonie Merina"
 nd_mir_merina_hegemony_desc: "The highland state extends its authority over two-thirds of Madagascar through military conquest and administrative integration, bringing the coastal peoples under highland control. Soldier-settlers, the voanjo, are planted among the conquered to hold them."
 nd_mir_malagasy_literacy: "Campagne d'alphabétisation malgache"
 nd_mir_malagasy_literacy_desc: "Protestant missionaries and state schools spread literacy across the highlands, replacing the Sorabe script with a Latin alphabet and opening education beyond the Antemoro scholarly caste."
 nd_mir_rice_surplus_economy: "Économie excédentaire de riz"
 nd_mir_rice_surplus_economy_desc: "L’irrigation étendue et l’agriculture intensive en terrasses produisent des excédents de riz qui alimentent la croissance démographique, la spécialisation urbaine et le commerce d’exportation."
 nd_mir_coast_conquest: "Conquête côtière"
 nd_mir_coast_conquest_desc: "The Merina navy projects highland power to the coasts, securing ports and trade routes that connect the unified realm to the wider Indian Ocean world."
 nd_mir_ranavalona_isolation: "L'isolement provocant de Ranavalona"
 nd_mir_ranavalona_isolation_desc: "Queen Ranavalona I expels foreign missionaries and traders, seals the realm against European encroachment, and maintains independence through military strength and ruthless self-sufficiency."
 nd_mir_malagasy_industrialization: "Proto-industrialisation malgache"
 nd_mir_malagasy_industrialization_desc: "Les ateliers organisés par l'État produisent des textiles, du savon, des briques et de la ferronnerie pour la consommation intérieure, réduisant ainsi la dépendance à l'égard des produits importés."
 nd_mir_unified_kingdom: "Unified Government of Madagascar"
 nd_mir_unified_kingdom_desc: "A single administrative apparatus governs the entire island, with local governors appointed from the capital replacing the independent kings of old."
 nd_mir_port_modernization: "Modernisation du port"
 nd_mir_port_modernization_desc: "The realm modernizes its coastal harbors to handle larger vessels and greater trade volumes, connecting Madagascar to global commerce."
 nd_mir_malagasy_sovereignty: "Souveraineté malgache"
 nd_mir_malagasy_sovereignty_desc: "Un Madagascar indépendant, gouverné par ses propres lois et traditions, impose le respect parmi les nations de l'océan Indien."
 nd_mir_cultural_renaissance: "Renaissance culturelle malgache"
 nd_mir_cultural_renaissance_desc: "La synthèse des traditions montagnardes et côtières, austronésiennes et africaines, traditionnelles et modernes crée une identité culturelle malgache distinctive qui transcende les anciennes divisions ethniques."
 n_nd_mir_lakana: "Lakana"
 n_nd_mir_lakana_desc: "Le lakana est la pirogue à balancier traditionnelle malgache, descendante directe des navires qui transportèrent les premiers colons austronésiens à travers l'océan Indien. Léger, rapide et parfaitement adapté aux eaux côtières."
 a_nd_mir_mpiambina: "Guerriers Mpiambina"
 a_nd_mir_mpiambina_desc: "Guerriers à lance des Highlands qui constituent l'épine dorsale des levées Merina. Armés de lances à pointe de fer et de boucliers en peau de bœuf, ils combattent avec la férocité des hommes défendant leurs collines ancestrales."
 a_nd_mir_sakalava_warband: "Sakalava Warband"
 a_nd_mir_sakalava_warband_desc: "Spearmen of the western plains with hide shields and no armour. They move fast through a country they know and strike first, and they pay for it when the fight turns into a slog."
 n_nd_mir_lakana_raider: "Pillard Lakana"
 n_nd_mir_lakana_raider_desc: "Un canoë de guerre plus grand conçu pour les expéditions de raids transmanche. Ces balanciers transportent trente guerriers ou plus et peuvent distancer n'importe quel navire européen dans les eaux côtières peu profondes."
 a_nd_mir_tafika: "Tafika Les habitués"
 a_nd_mir_tafika_desc: "The standing regiments of the Merina army, armed with a mix of traditional spears and traded muskets. Drilled and disciplined, they are the instrument of the state's authority."
 a_nd_mir_merina_musketeers: "Mousquetaires Merina"
 a_nd_mir_merina_musketeers_desc: "Soldats entraînés aux exercices de mousquet européens par des conseillers militaires britanniques dans le cadre du programme de modernisation du roi Radama. Ils tirent en volées disciplinées et maintiennent leur formation sous le feu."
 nd_mir_rice_terrace: "Terrasse de riz"
 nd_mir_rice_terrace_desc: "Rizières en terrasses irriguées creusées dans les collines des hautes terres, alimentées par des systèmes de canaux soigneusement entretenus. Les Betsileo ont perfectionné cette technique pour en faire l'agriculture la plus productive de l'océan Indien."
 nd_mir_rice_terrace_maintenance: "Irrigation de terrasse"
 nd_mir_rice_terrace_maintenance_desc: "L’entretien des murs de terrasse, des canaux d’irrigation et des outils agricoles nécessite un entretien constant."
 nd_mir_rova: "Citadelle de Rova"
 nd_mir_rova_desc: "A fortified hilltop palace complex of stone walls, timber halls, and sacred enclosures. The rova combines military strongpoint with the ruler's residence and spiritual center: its massive stone disc gates sealed each night against intruders."
 nd_mir_rova_upkeep: "Entretien Rova"
 nd_mir_rova_upkeep_desc: "Les murs en pierre et les structures en bois du rova ​​nécessitent des réparations et un renforcement continus."
 nd_mir_lamba_workshop: "Maison de tissage Lamba"
 nd_mir_lamba_workshop_desc: "Un atelier dédié au tissage du lamba : le tissu distinctif en soie et coton malgache. Les plus beaux lamba akotofahana, avec leurs motifs géométriques complexes, prennent des mois à être réalisés sur des métiers à tisser traditionnels."
 nd_mir_lamba_production: "Production de lambas"
 nd_mir_lamba_production_desc: "Tissage de soie fine avec des teintures naturelles pour créer le lamba akotofahana, le tissu prisé de la noblesse malgache."
 nd_mir_fokonolona_hall: "Salle de l'Assemblée Fokon'olona"
 nd_mir_fokonolona_hall_desc: "Lieu de rassemblement des fokon'olona : le conseil villageois des anciens qui gouverne les affaires locales par consensus. Ici, les conflits sont négociés, le travail communautaire organisé et le fady observé."
 nd_mir_fokonolona_upkeep: "Entretien de l'assemblage"
 nd_mir_fokonolona_upkeep_desc: "La salle des réunions du village nécessite de l'entretien et du bois pour les réparations."
 nd_mir_trano_gasy: "Domaine Trano Gasy"
 nd_mir_trano_gasy_desc: "Le trano gasy (la maison traditionnelle malgache en briques cuites et en bois, orientée le long des directions cardinales selon des principes cosmiques) est l'expression architecturale du statut aristocratique des hauts plateaux."
 nd_mir_trano_gasy_upkeep: "Entretien du patrimoine"
 nd_mir_trano_gasy_upkeep_desc: "Entretien de la charpente bois et des murs en briques du domaine aristocratique."
 nd_mir_zebu_ranching_pm: "Élevage de bovins zébus"
 nd_mir_zebu_ranching_pm_desc: "Zebu cattle, with their distinctive humped backs, are central to Malagasy life. They provide meat, milk, hides, and horn, and serve as the primary measure of wealth and status. The herd is penned at night, salted, and driven out to graze."
 nd_mir_valan_omby: "Zebu Kraal"
 nd_mir_valan_omby_desc: "The valan'omby is the cattle pen of a Malagasy village, a pit ringed with earth and stone where the zebu are kept and counted. Before planting the herd is driven through the flooded paddies to trample the mud. It can stand only where the land is cattle country."
 nd_mir_iron_smelting_pm: "Fonderie de fer des Highlands"
 nd_mir_iron_smelting_pm_desc: "Highland smiths smelt iron in charcoal furnaces, forging the tools and agricultural implements that sustain the realm."
 nd_mir_indian_ocean_goods_pm: "Commerce des marchandises de l’océan Indien"
 nd_mir_indian_ocean_goods_pm_desc: "Les soies, teintures et poteries importées des commerçants de l'océan Indien sont tissées et finies en textiles malgaches distinctifs."
 levy_nd_mir_lakana: "Prélèvement côtier de Lakana"
 levy_nd_mir_lakana_desc: "Coastal villagers manning their outrigger canoes in service of the state."
 levy_nd_mir_mpiambina: "Prélèvement sur les hautes terres de Mpiambina"
 levy_nd_mir_mpiambina_desc: "Les paysans et les soldats des Highlands se sont rassemblés pour former des guerriers à la lance traditionnels."
 levy_nd_mir_sakalava_warband: "Sakalava Warband Levy"
 levy_nd_mir_sakalava_warband_desc: "The fighting men of the Sakalava, called out by their kings from the villages of the west coast."
 a_nd_mir_fanompoana_levy: "Fanompoana Levies"
 a_nd_mir_fanompoana_levy_desc: "Free subjects called to arms as part of the labor owed to the state. Every able man is liable, so the ranks are full. They open with thrown spears and the fire of a few traded muskets, and they are thinking of their rice fields."
 levy_nd_mir_fanompoana: "Fanompoana Levy"
 levy_nd_mir_fanompoana_desc: "Peasants, laborers and soldiers called up under the labor service owed to the state."
 nd_mir_tsena_market: "Marché de Tséna"
 nd_mir_tsena_market_desc: "Un marché central animé où le riz, le bétail, les tissus et les produits importés changent de mains. Le tsena attire des marchands de toute l’île et relie les producteurs des hautes terres aux commerçants côtiers."
 nd_mir_tsena_upkeep: "Étals de marché"
 nd_mir_tsena_upkeep_desc: "Entretien des étals de bois et de poteries du marché."
 nd_mir_musket_workshop: "Atelier de mousquet"
 nd_mir_musket_workshop_desc: "A specialized iron-working facility where skilled artisans, conscripted through fanompoana, repair imported muskets, manufacture spearheads, and forge the weapons that arm the realm's expanding military."
 nd_mir_musket_workshop_input: "Fabrication d'armes"
 nd_mir_musket_workshop_input_desc: "Forging iron and reworking imported weapons into serviceable firearms for the realm's armies."
 nd_mir_sekoly: "École Sékoly"
 nd_mir_sekoly_desc: "An educational institution where missionaries and state teachers instruct students in reading, writing, and arithmetic, spreading literacy beyond the traditional Antemoro scholarly caste."
 nd_mir_antemoro_paperworks: "Antemoro Paperworks"
 nd_mir_antemoro_paperworks_desc: "The scribes of the Matitanana valley boil and beat the bark of the avoha tree into a soft, strong paper and dry it in the sun. On it they write the Sorabe: astrology, medicine and the genealogies of kings."
 nd_mir_antemoro_paper_pm: "Avoha Bark Paper"
 nd_mir_antemoro_paper_pm_desc: "Bark and plant fibre are boiled, pounded to a pulp, spread on frames and dried into sheets."
 nd_mir_voanjo_colony: "Voanjo Colony"
 nd_mir_voanjo_colony_desc: "A settlement of soldier-farmers sent from the highlands to hold a conquered province. It can be planted only among a people the state has not accepted, and it is dissolved when they are."
 nd_mir_voanjo_colony_upkeep: "Colonists' Allowance"
 nd_mir_voanjo_colony_upkeep_desc: "Seed rice, tools and arms for the settlers until their own fields bear."
 nd_mir_sekoly_upkeep: "Fournitures scolaires"
 nd_mir_sekoly_upkeep_desc: "Papier et bois pour l'enseignement et l'entretien de l'école."
 nd_mir_musket_repair_pm: "Fabrication d'armes malgaches"
 nd_mir_musket_repair_pm_desc: "State-organized workshops manufacturing and repairing firearms and ammunition for the realm's expanding military."
 nd_mir_textile_export_pm: "Exportations textiles malgaches"
 nd_mir_textile_export_pm_desc: "Dyeing and finishing the realm's distinctive cloth into fine textiles for export through coastal ports."
 nd_mir_rice_surplus_pm: "Paddy Clay Pottery"
 nd_mir_rice_surplus_pm_desc: "With rice to spare, hands are freed from the fields. The clay of the paddy banks is dug in the dry season and fired into the pots in which rice is cooked, stored and carried to market."
 nd_mir_formed_tt: "Madagascar s'est formé"
 nd_mir_path_a_tt: "A choisi Hasina des Highlands"
 nd_mir_path_b_tt: "Choisissez l’île aux mille ports"
 nd_mir_destiny: "Destin de Madagascar"
 nd_mir_destiny_desc: "The great island is unified. Now its people must choose how to wield that unity: whether to deepen the roots of the highland state or cast their outrigger sails across the Indian Ocean."
 nd_mir_dest_highland_consolidation: "Consolidation des hautes terres"
 nd_mir_dest_highland_consolidation_desc: "The rice terraces of the highlands must become the foundation of a prosperous centralized state. Fill the state granaries, raise a town on the hill of Antananarivo, and ensure rice flows through the capital's markets."
 nd_mir_dest_antananarivo_town_tt: "We own #bold Antananarivo#! and it has become a town or a city"
 nd_mir_dest_fianarantsoa_town_tt: "We own #bold Fianarantsoa#! and it has become a town or a city"
 nd_mir_dest_antananarivo_city_tt: "We own #bold Antananarivo#! and it has become a city"
 nd_mir_dest_highland_dominion: "Domination des Hautes Terres"
 nd_mir_dest_highland_dominion_desc: "The realm reaches beyond the island. Seize the gold-rich port of Sofala on the African mainland, embrace modern banking, and raise a second highland town at Fianarantsoa to hold the Betsileo country."
 nd_mir_dest_highland_empire: "L'empire des Highlands"
 nd_mir_dest_highland_empire_desc: "A continental power rising from an island. Extend control over the Mozambique coast, make Antananarivo a city, spread the written word through the realm, and marshal an army that can defend Malagasy sovereignty against any power on earth."
 nd_mir_dest_comoros_conquest: "Conquête des Comores"
 nd_mir_dest_comoros_conquest_desc: "Les îles des Comores (Anjouan, Grande Comore et Mayotte) sont les tremplins naturels de Madagascar vers la côte africaine. Saisissez-les et établissez la domination malgache sur le nord du canal du Mozambique."
 nd_mir_dest_swahili_reach: "Portée swahili"
 nd_mir_dest_swahili_reach_desc: "Les grandes villes commerciales swahilies de Zanzibar et de Kilwa contrôlent le commerce de l’océan Indien depuis des siècles. Prenez-les, introduisez l'ivoire sur vos marchés et faites de Madagascar la plaque tournante du commerce de l'Afrique de l'Est."
 nd_mir_dest_ocean_empire: "L'Empire des Océans"
 nd_mir_dest_ocean_empire_desc: "From Mombasa to Mauritius, the Indian Ocean bows to Malagasy power. Command the trade routes, embrace global commerce, and build an empire of a thousand ports that stretches from Africa to the open sea."
 nd_mir.6.t: "L'île unifiée"
 nd_mir.6.d: "For the first time in living memory, a single authority governs all of Madagascar. From the highland capital to the remotest fishing village on the southern coast, the word of the capital carries the weight of law. The realm has stability. Now it must find purpose."
 nd_mir.6.a: "Notre destin nous attend."
 nd_mir.7.t: "Les Greniers des Hautes Terres"
 nd_mir.7.d: "The terraced paddies of the central highlands produce rice in abundance that surpasses anything known on this island before. The irrigation canals reach further each year, the hillsides are carved into new fields, and the state granaries overflow with surplus. Antananarivo grows fat on the labor of its people, and the realm's wealth is measured not in gold or silk but in the white grain that feeds millions.\n\nThe highland consolidation is complete. The question now is where this agrarian power will be directed."
 nd_mir.7.a: "La terre nous nourrit. Maintenant, nous allons façonner le monde."
 nd_mir.8.t: "Domination au-delà du rivage"
 nd_mir.8.d: "Malagasy soldiers stand on foreign soil. The conquest of Sofala brings the realm something it has never had before: access to the gold trade that has enriched the Swahili coast for centuries. The state treasury swells with new revenue, and the realm's influence extends across the Mozambique Channel.\n\nBut power abroad demands choices at home. The state must decide how to invest this new wealth."
 nd_mir.8.a: "Investissez dans l’irrigation et le bien-être de la population."
 nd_mir.8.b: "Fortifiez nos forteresses des hautes terres."
 nd_mir.9.t: "Empire des Hautes Terres"
 nd_mir.9.d: "The realm that began as a collection of highland villages now commands territory stretching from the interior of Madagascar to the African coast. Malagasy governors administer foreign ports. Malagasy soldiers garrison foreign fortresses. The printing press spreads literacy from the capital to the provinces, binding the realm together with the written word.\n\nThis is the apex of Malagasy power. The state must choose how to wield it."
 nd_mir.9.a: "Nous projetterons notre puissance à travers le continent."
 nd_mir.9.b: "Nous défendrons notre souveraineté contre tout venant."
 nd_mir.10.t: "La chute des Comores"
 nd_mir.10.d: "The outrigger war fleets of Madagascar have swept across the Mozambique Channel. One by one, the sultanates of the Comoro Islands (Anjouan, Grand Comore, Mayotte) have fallen to Malagasy arms. The channel that separates Madagascar from Africa is now a Malagasy lake.\n\nFrom these island outposts, the fleet can range further than ever before. The Swahili coast beckons."
 nd_mir.10.a: "La chaîne est la nôtre. La côte suivra."
 nd_mir.11.t: "Maîtres de la côte swahili"
 nd_mir.11.d: "Zanzibar and Kilwa (the ancient jewels of East African commerce) now fly the Malagasy banner. Ivory, gold, and enslaved captives flow through markets that Madagascar controls. The realm has become the dominant power of the western Indian Ocean.\n\nThe question is whether to entrench this trading empire through commercial institutions or to ride the monsoon winds to even greater reach."
 nd_mir.11.a: "Établir des usines commerciales permanentes."
 nd_mir.11.b: "Maîtrisez les routes commerciales de la mousson."
 nd_mir.12.t: "Ny Ranomasina Indianina"
 nd_mir.12.d: "The Indian Ocean (Ny Ranomasina Indianina in the Malagasy tongue) has become a Malagasy sea. From Mombasa on the African coast to Mauritius in the open ocean, Malagasy ships dominate the trade routes. The outrigger canoe that once carried a handful of Austronesian settlers to an uninhabited island has become the instrument of an empire.\n\nThe realm must decide how to govern this vast maritime domain."
 nd_mir.12.a: "Dirigez les mers en tant que sultans de l'océan Austral."
 nd_mir.12.b: "Construisez un empire commercial de mille ports."
 STATIC_MODIFIER_NAME_nd_mir_dest_irrigation_works: "State Irrigation Works"
 STATIC_MODIFIER_DESC_nd_mir_dest_irrigation_works: "The state invests its new continental revenues into expanding the highland irrigation network, bringing water to terraces that will feed the growing kingdom for generations."
 STATIC_MODIFIER_NAME_nd_mir_dest_fortress_network: "Réseau de forteresses des Highlands"
 STATIC_MODIFIER_DESC_nd_mir_dest_fortress_network: "La richesse de Sofala finance une chaîne de forteresses rova ​​à travers les hauts plateaux, créant un réseau défensif imprenable qu'aucun envahisseur ne peut briser."
 STATIC_MODIFIER_NAME_nd_mir_dest_continental_ambition: "Ambition continentale"
 STATIC_MODIFIER_DESC_nd_mir_dest_continental_ambition: "The highland empire looks outward. A professional army, hardened by campaigns on the African mainland, projects Malagasy power across the region, though the neglected navy pays the price."
 STATIC_MODIFIER_NAME_nd_mir_dest_defiant_sovereignty: "Souveraineté défiante"
 STATIC_MODIFIER_DESC_nd_mir_dest_defiant_sovereignty: "Madagascar stands alone and inviolate. The realm's diplomatic skill and mercenary reserves ensure that no foreign power can threaten its independence."
 STATIC_MODIFIER_NAME_nd_mir_dest_trading_factories: "Usines commerciales swahili"
 STATIC_MODIFIER_DESC_nd_mir_dest_trading_factories: "Les usines commerciales malgaches permanentes sur la côte swahilie servent à la fois d'avant-postes commerciaux et de stations de collecte de renseignements."
 STATIC_MODIFIER_NAME_nd_mir_dest_monsoon_routes: "Routes commerciales de la mousson"
 STATIC_MODIFIER_DESC_nd_mir_dest_monsoon_routes: "La maîtrise des vents de mousson permet aux commerçants malgaches de faire du commerce à travers l’océan Indien avec des frais généraux minimes, réduisant ainsi l’inflation et les coûts d’emprunt."
 STATIC_MODIFIER_NAME_nd_mir_dest_sultan_southern_seas: "Sultan des mers du Sud"
 STATIC_MODIFIER_DESC_nd_mir_dest_sultan_southern_seas: "The Malagasy state commands respect as the preeminent power of the southern Indian Ocean, backed by disciplined cavalry and artillery and a wide diplomatic network."
 STATIC_MODIFIER_NAME_nd_mir_dest_thousand_port_empire: "Empire aux mille ports"
 STATIC_MODIFIER_DESC_nd_mir_dest_thousand_port_empire: "Un vaste empire maritime maintenu non pas par une seule armée mais par un réseau de ports, de mercenaires et d’États vassaux qui rend la guerre bon marché et la résistance coûteuse."
 nd_mir_rova_manjakamiadana: "Rova Manjakamiadana"
 nd_mir_rova_manjakamiadana_desc: "The Great Palace of Manjakamiadana ('Where It Is Pleasant to Rule') crowns the highest hill of Antananarivo. Built of stone and rosewood, it is the supreme symbol of Merina sovereignty: part ruler's residence, part administrative center, part sacred site where the hasina of the ancestors concentrates."
 nd_mir_rova_manjakamiadana_upkeep: "Entretien du palais"
 nd_mir_rova_manjakamiadana_upkeep_desc: "Les fondations en pierre, les salles en palissandre et les enceintes sacrées du grand palais nécessitent un soin constant de la part d'artisans qualifiés."
 nd_mir_lakana_arsenal: "Arsenal de Lakana"
 nd_mir_lakana_arsenal_desc: "Un grand chantier naval et arsenal naval où sont construites et entretenues les plus grandes pirogues de guerre de la flotte malgache. Des rangées de lakana se dressent dans des cales couvertes, leurs coques calfeutrées avec de la fibre de coco et leurs stabilisateurs équipés de plates-formes pour les archers et les mousquetaires."
 nd_mir_lakana_arsenal_upkeep: "Entretien de l'Arsenal"
 nd_mir_lakana_arsenal_upkeep_desc: "Bois, goudron et corde pour l'entretien de la flotte de guerre et de son infrastructure de cale de halage."
 mir_fokonolona_bureaucracy: "Fokonolona"
 mir_fokonolona_bureaucracy_desc: "Le fokonolona est le conseil villageois, unité fondatrice de la vie politique malgache. Andrianampoinimerina l'a officialisé lors de la réunification de l'Imerina (1787), en réunissant les anciens et les notables en assemblée ouverte pour répartir le travail communal, entretenir les canaux d'irrigation, régler les différends par l'oratoire kabary et contrôler les tabous locaux. Les décrets royaux étaient lus sur la place de l'Assemblée ; la parole du roi parvenait à chaque village par l'intermédiaire des anciens et non par l'intermédiaire de magistrats nommés. Les observateurs français du XIXe siècle la considéraient comme l’institution africaine la plus véritablement participative qu’ils aient rencontrée."
 mir_fanompoana_bureaucracy: "Fanompoana"
 mir_fanompoana_bureaucracy_desc: "Fanompoana was the corvee labour owed personally to the sovereign in lieu of monetary tax. Modest under Andrianampoinimerina, it became permanent for ironworkers and apprenticed gunsmiths under Radama I (from 1820), and metastasised under Ranavalona I: fanompoana labourers fed the royal workshops with charcoal and iron, and the standing army was filled by conscription-as-fanompoana. The system gave the crown a body of state labour the silver treasury could never afford, and the villages of Imerina were thinned under the combined weight of corvee, conscription, and famine."
 mir_andriana_caste_bureaucracy: "Hiérarchie des castes d'Andriana"
 mir_andriana_caste_bureaucracy_desc: "The Merina social order rested on three principal castes: Andriana nobles, Hova free commoners, and Andevo slaves, with the Andriana further divided into six endogamous sub-strata, each with inherited offices, marriage rules, and tomb-privilege. Hova managed rice-lands as owners and traders but could not rise to noble rank; Andevo were considered olona maloto (impure) and barred from owning land. Andrianampoinimerina codified the rules; Ranavalona I defended them against missionary egalitarianism. The caste system was the architecture of Merina political life."
 mir_sampy_keepers_bureaucracy: "Mpitahry Sampy"
 mir_sampy_keepers_bureaucracy_desc: "Les Mpitahiry Sampy étaient les lignées gardiennes des douze grandes idoles royales - Kelimalaza, Ramahavaly, Manjakatsiroa et autres - consolidées par les successeurs d'Andriamasinavalona. Chaque sampy avait sa propre voix oraculaire, son propre calendrier sacrificiel et son propre sacerdoce gardien ; collectivement, ils conféraient la hasina (pouvoir sacré) au roi et validaient ses décrets. Andrianampoinimerina cherchait leurs oracles avant les campagnes ; Ranavalona Ier, après avoir expulsé les missionnaires en 1835, fit du culte de la politique d'État royale et relança la cérémonie des bains royaux Fandroana en leur présence."
 mir_mantasoa_works_bureaucracy: "Royal Workshops of Ilafy"
 mir_mantasoa_works_bureaucracy_desc: "In the early 1830s Jean Laborde, a French castaway and a blacksmith's son, set up a factory for Ranavalona I at Ilafy, north of Antananarivo, where muskets were made and gunpowder was mixed for the royal monopoly. It followed the workshops of Radama I, in which artisan missionaries had taught smithing, tanning, weaving and soap boiling since the 1820s. Fanompoana labourers carried in the charcoal and the iron. The workshops gave the kingdom arms it did not have to buy from Europeans, at the cost of the villages that fed and fuelled them."
 AUTO_MODIFIER_NAME_nd_mir_bureaucracy_authority: "Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_mir_bureaucracy_authority: "With the great island unified under a single government at Antananarivo, the state can begin to chart a permanent administrative apparatus: village fokonolona, fanompoana corvee, Andriana caste, Sampy keepers, or the royal workshops of Ilafy. Its authority provides two slots for them."
