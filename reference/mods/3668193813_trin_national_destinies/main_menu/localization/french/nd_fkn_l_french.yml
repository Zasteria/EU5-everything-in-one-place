l_french:
 STATIC_MODIFIER_NAME_nd_fkn_princes_faith: "La foi des princes"
 STATIC_MODIFIER_DESC_nd_fkn_princes_faith: "Les princes-évêques de Franconie manient à la fois la crosse et l'épée, gouvernant leurs domaines en tant que seigneurs temporels autant qu'en bergers spirituels. Sous leur direction, la foi lie les territoires dispersés dans un seul but."
 STATIC_MODIFIER_NAME_nd_fkn_craftsmens_spirit: "L'esprit des artisans"
 STATIC_MODIFIER_DESC_nd_fkn_craftsmens_spirit: "Les maîtres artisans de Nuremberg ne répondent pas aux corporations mais au conseil municipal lui-même. Ce système d'innovation réglementée, où le savoir-faire est récompensé et la concurrence féroce, fait que les ateliers de la ville font l'envie de l'Europe."
 nd_fkn.1.t: "Le Cercle Franconien"
 nd_fkn.1.d: "The disparate territories of Franconia (prince-bishoprics, margraviates, free cities, and knightly domains) have at last been drawn together under a single banner. But which tradition shall define this union?\n\nThe prince-bishops of Wurzburg and Bamberg offer the model of ecclesiastical authority, where spiritual conviction provides the foundation for temporal governance. Their cathedrals and residences anchor the region in faith and learning.\n\nAlternatively, Nuremberg's master craftsmen represent a different path. Unburdened by guild restrictions, the city's workshops produce metalwork, clocks, and printed works that are the finest in the Empire. Their inventive spirit could transform Franconia into a center of innovation.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_fkn.1.a: "Les évêques dirigeront notre peuple dans la foi et la gouvernance"
 nd_fkn.1.b: "Laissez les ateliers de Nuremberg éclairer la voie à suivre"
 nd_fkn.2.t: "La fondation du cercle franconien"
 nd_fkn.2.d: "On 2 July 1500, the Imperial Diet at Augsburg established the Franconian Circle as one of the six original administrative districts of the Empire. This institution gives the patchwork of Franconian territories a collective voice: a Kreistag where prince-bishops, margraves, free cities, and imperial knights may coordinate defense, regulate coinage, and preserve the Landfrieden.\n\nThe Circle's strength lies in cooperation among its diverse members. But some see an opportunity to assert Franconian independence within the Empire's framework, building military capacity that serves our interests first."
 nd_fkn.2.a: "La coopération nous renforce tous"
 nd_fkn.2.b: "Nous devons compter sur notre propre force"
 nd_fkn.3.t: "La guerre des paysans en Franconie"
 nd_fkn.3.d: "The spring of 1525 has brought revolution to Franconia. Peasant bands under leaders like Florian Geyer and his fearsome Black Troop have swept through the Tauber valley, storming castles and demanding rights long denied. The greatest peasant army in all Germany has assembled before Wurzburg, threatening the very seat of episcopal power.\n\nThe rebellion will be crushed; of that there is little doubt. But the memory of Geyer's Black Troop and the Twelve Articles will linger. We must decide how to rebuild: with concessions that address legitimate grievances, or with the iron hand of noble authority reasserted."
 nd_fkn.3.a: "S'attaquer aux causes profondes du mécontentement"
 nd_fkn.3.b: "Rétablir l’ordre d’une main de fer"
 nd_fkn.4.t: "Les cathédrales de Franconie"
 nd_fkn.4.d: "The great cathedrals of Bamberg and Wurzburg stand as monuments to centuries of Franconian devotion. The Bamberg Cathedral, founded by the sainted Emperor Henry II in 1007, houses the enigmatic Bamberger Reiter: the first monumental equestrian sculpture since antiquity, a crowned horseman whose true identity remains a mystery.\n\nIn Wurzburg, the Romanesque cathedral dedicated to St. Kilian anchors the spiritual life of Lower Franconia. Together, these houses of God are not merely places of worship but seats of learning, repositories of art, and symbols of the intertwined spiritual and temporal authority that defines Franconian governance."
 nd_fkn.4.a: "Leurs flèches dureront aussi longtemps que la Franconie elle-même"
 STATIC_MODIFIER_NAME_nd_fkn_circle_cooperation: "Coopération en cercle"
 STATIC_MODIFIER_DESC_nd_fkn_circle_cooperation: "Le Cercle franconien fonctionne comme un modèle de coopération impériale, son Kreistag réunissant divers domaines pour maintenir la paix et coordonner la défense."
 STATIC_MODIFIER_NAME_nd_fkn_circle_independence: "Cercle d'autonomie"
 STATIC_MODIFIER_DESC_nd_fkn_circle_independence: "Plutôt que de dépendre des structures impériales, la Franconie construit sa propre capacité militaire, garantissant ainsi que le Cercle puisse se défendre selon ses propres conditions."
 STATIC_MODIFIER_NAME_nd_fkn_peasant_concessions: "Concessions paysannes"
 STATIC_MODIFIER_DESC_nd_fkn_peasant_concessions: "Au lendemain de la guerre des paysans, des réformes mesurées répondent à certains des griefs qui ont poussé des hommes comme Florian Geyer à la rébellion."
 STATIC_MODIFIER_NAME_nd_fkn_peasant_suppression: "Autorité restaurée"
 STATIC_MODIFIER_DESC_nd_fkn_peasant_suppression: "La noblesse réaffirme avec force ses prérogatives, garantissant que les désordres de 1525 ne se reproduiront plus."
 nd_fkn_stem_duchy_heritage: "Tige Patrimoine du Duché"
 nd_fkn_stem_duchy_heritage_desc: "La Franconie était la patrie de la dynastie Salienne, dont les rois et les empereurs dirigeaient l'Empire depuis ce cœur de la Francie orientale."
 nd_fkn_ritterschaft: "La Ritterschaft"
 nd_fkn_ritterschaft_desc: "Les Chevaliers Impériaux de Franconie forment une classe martiale distincte, devant directement allégeance à l'Empereur plutôt qu'à un quelconque prince territorial."
 nd_fkn_main_river_viticulture: "Viticulture de la rivière Main"
 nd_fkn_main_river_viticulture_desc: "Les pentes le long de la rivière Main abritent la plus grande région viticole médiévale d'Europe, avec plus de 40 000 hectares cultivés au 14e siècle."
 nd_fkn_cathedral_foundations: "Fondations de la cathédrale"
 nd_fkn_cathedral_foundations_desc: "Les cathédrales de Bamberg et de Würzburg ancrent l'identité spirituelle de la Franconie, servant de centres d'apprentissage, d'art et d'autorité ecclésiastique."
 nd_fkn_nuremberg_metalcraft: "Artisanat métallique de Nuremberg"
 nd_fkn_nuremberg_metalcraft_desc: "Les maîtres artisans de Nuremberg produisent des ouvrages en métal d'une précision inégalée - des cloches d'église et des armures aux ciseaux, bijoux et clous - le tout sous l'œil vigilant du conseil municipal."
 nd_fkn_episcopal_governance: "Gouvernance épiscopale"
 nd_fkn_episcopal_governance_desc: "Les princes-évêques de Franconie exercent une autorité à la fois spirituelle et temporelle, gouvernant leurs territoires en tant que princes ecclésiastiques de l'Empire."
 nd_fkn_bamberg_flowering: "Floraison culturelle de Bamberg"
 nd_fkn_bamberg_flowering_desc: "La renaissance culturelle de Bamberg, de l'énigmatique sculpture du Cavalier au mécénat des arts et du savoir, élève la réputation de la Franconie à travers la chrétienté."
 nd_fkn_imperial_city_charters: "Chartes de la Cité Impériale"
 nd_fkn_imperial_city_charters_desc: "Nuremberg, Rothenburg et Schweinfurt détiennent des chartes de villes impériales libres, ne répondant qu'à l'empereur et gouvernant leur propre commerce et leur justice."
 nd_fkn_nuremberg_printing: "Imprimerie de Nuremberg"
 nd_fkn_nuremberg_printing_desc: "L'atelier Koberger de Nuremberg produit la Chronique de Nuremberg et d'autres chefs-d'œuvre, faisant de la ville un centre de la révolution européenne de l'imprimerie."
 nd_fkn_circle_administration: "Administration du Cercle"
 nd_fkn_circle_administration_desc: "Le Kreistag de Franconie coordonne la défense, la monnaie et le maintien de la paix sur les divers territoires d'évêques, de margraves et de villes libres du Cercle."
 nd_fkn_peasant_war_legacy: "L'héritage de la guerre paysanne"
 nd_fkn_peasant_war_legacy_desc: "La guerre dévastatrice des paysans de 1525 et la troupe noire de Florian Geyer ont laissé des leçons durables sur la force et la fureur du peuple de Franconie."
 nd_fkn_cannon_foundries: "Fonderies de canons"
 nd_fkn_cannon_foundries_desc: "Nuremberg's metalworking expertise extends naturally to arms production, with foundries casting cannons and forging weaponry for the Empire's armies.\n\n#italic Available in: $nd_fkn_meisterhaus$#!"
 nd_fkn_confessional_frontier: "Frontière confessionnelle"
 nd_fkn_confessional_frontier_desc: "La Franconie se situe sur la ligne de fracture entre les territoires catholiques et protestants, obligeant ses dirigeants à gérer les tensions confessionnelles avec pragmatisme."
 nd_fkn_kreisarmee_reforms: "Réformes du Kreisarmee"
 nd_fkn_kreisarmee_reforms_desc: "Les forces militaires du Cercle sont professionnalisées en une véritable Kreisarmee, attirant des soldats disciplinés des villes et des recrues entraînées des campagnes."
 nd_fkn_nuremberg_clockworks: "Horlogerie de Nuremberg"
 nd_fkn_nuremberg_clockworks_desc: "Peter Henlein's portable spring-driven clocks, the 'Nuremberg Eggs,' represent the pinnacle of precision engineering and make the city famous across Europe.\n\n#italic Available in: $nd_fkn_meisterhaus$#!"
 nd_fkn_landfrieden_enforcement: "Application de Landfrieden"
 nd_fkn_landfrieden_enforcement_desc: "The Circle takes responsibility for maintaining the Imperial Peace within its borders, suppressing feuds and highway robbery to secure trade routes. Mounted men on the cities' pay ride the roads and escort the merchants."
 nd_fkn_franconian_baroque: "Baroque franconien"
 nd_fkn_franconian_baroque_desc: "Balthasar Neumann's masterful Wurzburg Residenz and the region's baroque churches represent a flowering of Franconian artistic achievement. Their windows and mirrors come from the court's own glassworks in the Steigerwald."
 nd_fkn_standing_kreiskompanie: "Kreiskompanie debout"
 nd_fkn_standing_kreiskompanie_desc: "Les forces de garnison permanentes maintiennent l'ordre et défendent les frontières du Cercle, équipées de l'artillerie des fonderies renommées de Franconie."
 nd_fkn_commercial_code: "Code de commerce"
 nd_fkn_commercial_code_desc: "Un code de droit commercial unifié réglemente le commerce à travers la mosaïque fragmentée de territoires de Franconie, réduisant ainsi les frictions et encourageant l'activité commerciale."
 nd_fkn_episcopal_scholarship: "Bourse épiscopale"
 nd_fkn_episcopal_scholarship_desc: "Les traditions savantes de l'Université de Würzburg et de Bamberg produisent des érudits et des administrateurs qui servent à la fois l'Église et l'État."
 nd_fkn_civic_enlightenment: "Illumination civique"
 nd_fkn_civic_enlightenment_desc: "La tradition urbaine d'autonomie civique de Franconie fournit un terrain fertile aux idéaux des Lumières en matière de raison, d'éducation et de réforme constitutionnelle."
 nd_fkn_industrial_modernization: "Modernisation industrielle"
 nd_fkn_industrial_modernization_desc: "The centuries-old crafts tradition transforms into modern manufacturing as Franconian workshops adopt industrial methods and new materials.\n\n#italic Available in: $nd_fkn_meisterhaus$#!"
 nd_fkn_national_integration: "Intégration nationale"
 nd_fkn_national_integration_desc: "L'étonnant patchwork de territoires franconiens - évêchés, margraviats, villes libres et domaines chevaleresques - commence à se fondre en un tout unifié."
 nd_fkn_constitutional_reforms: "Réformes constitutionnelles"
 nd_fkn_constitutional_reforms_desc: "La gouvernance libérale remplace l'ancien régime d'absolutisme princier et d'autorité cléricale, apportant des institutions représentatives en Franconie."
 a_nd_fkn_ritter: "Ritter franconien"
 a_nd_fkn_ritter_desc: "Cavalerie lourde des chevaliers impériaux, issue de la Ritterschaft franconienne et devant directement allégeance à l'empereur."
 a_nd_fkn_stadtsoldat: "Soldat de Nuremberg"
 a_nd_fkn_stadtsoldat_desc: "Soldats disciplinés de la ville issus de la bourgeoisie et de la garnison de Nuremberg, entraînés dans le cadre du système militaire du conseil municipal."
 a_nd_fkn_einspaennige: "Einspännige"
 a_nd_fkn_einspaennige_desc: "Mounted men on the permanent pay of the Franconian cities, each serving with a single horse. They ride escort for the merchants on the road to the Frankfurt fair and run down those who break the peace."
 a_nd_fkn_feldbatterie: "Feldbatterie franconienne"
 a_nd_fkn_feldbatterie_desc: "Batteries d'artillerie de campagne fabriquées dans les fonderies renommées de Nuremberg, combinant une ferronnerie franconienne supérieure avec les dernières techniques d'artillerie."
 levy_nd_fkn_ritter: "Prélèvement Ritter franconien"
 levy_nd_fkn_ritter_desc: "Cavalerie noble issue de la Ritterschaft franconienne, les chevaliers impériaux qui doivent une allégeance directe à l'empereur."
 levy_nd_fkn_stadtsoldat: "Prélèvement du Stadtsoldat de Nuremberg"
 levy_nd_fkn_stadtsoldat_desc: "Milice urbaine composée de bourgeois et de soldats professionnels de Nuremberg et d'autres villes impériales libres."
 nd_fkn_meisterhaus: "Maison des maîtres"
 nd_fkn_meisterhaus_desc: "Un atelier de maître artisan de Nuremberg où des artisans qualifiés produisent des métaux, des outils et des instruments de précision dans le cadre du système réglementé du conseil municipal."
 nd_fkn_residenz: "Résidence du Prince-Évêque"
 nd_fkn_residenz_desc: "Siège de la gouvernance épiscopale, où le prince-évêque exerce à la fois l'autorité spirituelle et la seigneurie temporelle sur ses territoires."
 nd_fkn_weinberghaus: "Maison Weinberg"
 nd_fkn_weinberghaus_desc: "Un domaine viticole de Franconie situé sur les pentes ensoleillées de la vallée du Main, produisant les vins distinctifs qui constituaient autrefois la plus grande région viticole d'Europe."
 nd_fkn_hofglashuette: "Hofglashütte"
 nd_fkn_hofglashuette_desc: "A court glassworks in the forest, of the kind Balthasar Neumann ran at Schleichach to glaze and mirror the Residenz. What the court does not need is sold abroad."
 nd_fkn_pm_mirror_glass: "Mirror Glass"
 nd_fkn_pm_mirror_glass_desc: "Sand is melted over beechwood fires into clear plate, then ground, polished and backed for windows and mirrors."
 nd_fkn_druckerei: "Druckerei"
 nd_fkn_druckerei_desc: "Une imprimerie de Nuremberg où les maîtres imprimeurs produisent des livres, des brochures et des journaux qui diffusent le savoir et la réforme à travers l'Empire."
 nd_fkn_pm_metalworking: "Travail des métaux à Nuremberg"
 nd_fkn_pm_metalworking_desc: "Les maîtres artisans forgent des outils, des instruments et du matériel avec du fer et du cuivre de Franconie."
 nd_fkn_pm_arms_production: "Production d'armes"
 nd_fkn_pm_arms_production_desc: "L'atelier se tourne vers la production militaire, forgeant des épées, des armures et des canons de canon pour les armées du Cercle."
 nd_fkn_pm_clockworks: "Mécanismes d'horlogerie de précision"
 nd_fkn_pm_clockworks_desc: "Suivant les innovations de Peter Henlein, l'atelier produit des garde-temps à ressort et des instruments de précision."
 nd_fkn_pm_industrial_tooling: "Outillage industriel"
 nd_fkn_pm_industrial_tooling_desc: "Les méthodes modernes transforment le travail traditionnel des métaux en production industrielle d’acier."
 nd_fkn_pm_meisterhaus_maintenance: "Entretien de l'atelier"
 nd_fkn_pm_meisterhaus_maintenance_desc: "Coûts permanents liés à l’entretien de l’équipement, des outils et des ateliers de la forge."
 nd_fkn_pm_residenz_maintenance: "Entretien de la résidence"
 nd_fkn_pm_residenz_maintenance_desc: "Le maintien du siège de gouvernement du prince-évêque nécessite de la pierre, du verre et des fournitures administratives."
 nd_fkn_pm_wine_production: "Vin de Franconie"
 nd_fkn_pm_wine_production_desc: "Les vins distinctifs de la vallée du Main sont mis en bouteille et vendus, poursuivant une tradition viticole datant de l'époque de Charlemagne."
 nd_fkn_pm_weinberghaus_maintenance: "Entretien du vignoble"
 nd_fkn_pm_weinberghaus_maintenance_desc: "Entretien des vignes et entretien des caves à vin et du matériel de pressurage."
 nd_fkn_pm_printing: "Imprimerie de Nuremberg"
 nd_fkn_pm_printing_desc: "Les maîtres imprimeurs produisent des livres et des brochures, perpétuant la tradition de l'atelier Koberger."
 nd_fkn_pm_druckerei_maintenance: "Entretien de la presse"
 nd_fkn_pm_druckerei_maintenance_desc: "Entretenir les presses à imprimer, les jeux de caractères et les installations des ateliers."
 nd_fkn_formed_tt: "La Franconie s'est formée"
 nd_fkn_path_a_tt: "La voie de la Foi des Princes a été choisie"
 nd_fkn_path_b_tt: "La voie de l'Esprit des Artisans a été choisie"
 nd_fkn_dest_wurzburg_developed_tt: "We own #bold Würzburg#! and its development is at least #bold 40#!"
 nd_fkn_dest_nuremberg_developed_tt: "We own #bold Nuremberg#! and its development is at least #bold 36#!"
 nd_fkn.5.t: "Le destin de la Franconie"
 nd_fkn.5.d: "Le Cercle franconien est enfin uni, ses territoires disparates réunis sous une vision unique. Qu'ils soient guidés par la crosse ou le marteau de l'artisan, les choix que nous faisons aujourd'hui façonneront notre chemin à travers les âges à venir."
 nd_fkn.5.a: "Notre destin attend"
 nd_fkn.6.t: "Autorité archiépiscopale"
 nd_fkn.6.d: "Mayence est tombée sous notre contrôle : le siège du Primat d'Allemagne, le premier archevêché du Saint Empire romain germanique. Avec l'ancien monastère de Fulda, ces fondations ecclésiastiques placent la Franconie au cœur spirituel de la chrétienté au nord des Alpes. Les princes-évêques parlent désormais d’une voix qui impose le respect dans tout l’Empire."
 nd_fkn.6.a: "L’Église guide notre royaume"
 nd_fkn.7.t: "Siège du Primat"
 nd_fkn.7.d: "The three Rhenish archbishoprics (Mainz, Cologne, and Trier), the prince-electors who crown emperors and shape the fate of the Empire, all now acknowledge Franconian authority. This concentration of ecclesiastical power is unprecedented since the days of Charlemagne himself.\n\nWe may use this authority to bind the Rhineland's diverse peoples into a centralized whole, or we may invest in the episcopal courts themselves, making them centers of learning and conversion that transform culture from within."
 nd_fkn.7.a: "Unifier la Rhénanie sous une seule autorité"
 nd_fkn.7.b: "Investissez dans nos tribunaux et nos écoles épiscopales"
 nd_fkn.8.t: "Défenseur de la foi"
 nd_fkn.8.d: "From Aachen, where Charlemagne was crowned, to Salzburg, where Boniface planted the cross among the pagans, the great archbishoprics of the German lands all stand under Franconian stewardship. No realm in Christendom commands such a concentration of spiritual authority.\n\nThis power invites a choice: shall Franconia serve as the sword of the faith, a Catholic champion ready to defend the Church against all threats? Or shall we follow the path of the Landfrieden: using our authority to impose peace and stability across the fractured landscape of the Empire?"
 nd_fkn.8.a: "Nous serons l'épée de la foi"
 nd_fkn.8.b: "Nous serons les garants de la paix"
 nd_fkn.9.t: "Libre-échange impérial"
 nd_fkn.9.d: "Les grands salons de Francfort fonctionnent désormais sous la bannière franconienne. La ville où les empereurs sont couronnés et où les marchands de toute l'Europe se rassemblent pour échanger des marchandises est la preuve que l'artisanat et le sens commercial franconiens peuvent rivaliser avec n'importe quel rival. Avec l’implantation d’institutions bancaires dans nos villes, l’avenir appartient à ceux qui maîtrisent les flux de capitaux."
 nd_fkn.9.a: "Laissez le commerce prospérer sous notre surveillance"
 nd_fkn.10.t: "Atelier de l'Empire"
 nd_fkn.10.d: "Franconia's workshops have become the engine of the Empire's economy. From Nuremberg's precision instruments to the trade goods flowing through our markets, our craftsmen set the standard that others strive to match. The tools made in our cities build the buildings, forge the weapons, and drive the machinery of progress across Central Europe.\n\nWe may deepen our mastery of craftsmanship itself, investing in the Meister tradition that ensures quality above all else, or we may leverage our position to secure trade fair privileges that draw commerce from across the continent."
 nd_fkn.10.a: "Investissez dans nos maîtres et leur métier"
 nd_fkn.10.b: "Garantir des privilèges en matière de salons pour nos villes"
 nd_fkn.11.t: "La révolution industrielle"
 nd_fkn.11.d: "The transformation is complete. From medieval workshop to modern manufactory, Franconia has led the way in the industrious revolution that remakes the old order. Augsburg's banking houses and Leipzig's trade fairs now orbit around Franconian enterprise, and the hum of machinery has replaced the ring of the blacksmith's hammer.\n\nThis new power demands a new order. Shall we embrace the factory and the furnace, driving forward with industrial ambition regardless of the old ways it displaces? Or shall we channel our commercial strength into building a new kind of civic society, where merchants and craftsmen govern themselves in the spirit of the free imperial cities?"
 nd_fkn.11.a: "L'usine est l'avenir"
 nd_fkn.11.b: "Que l'esprit marchand gouverne notre république"
 nd_fkn_destiny: "Le destin de la Franconie"
 nd_fkn_destiny_desc: "Le cercle franconien est formé. Maintenant, son destin doit s'accomplir : que ce soit par l'autorité de la crosse ou l'ingéniosité de l'atelier."
 nd_fkn_dest_archbishopric: "Autorité archiépiscopale"
 nd_fkn_dest_archbishopric_desc: "Sécuriser le grand archevêché de Mayence et le monastère de Fulda, plaçant ainsi la Franconie au cœur spirituel de l'Empire."
 nd_fkn_dest_primate: "Siège du Primat"
 nd_fkn_dest_primate_desc: "Bring the three Rhenish archbishoprics (Mainz, Cologne, and Trier) under Franconian authority, commanding the prince-electors who crown emperors, and build Würzburg into a residence fit for a primate."
 nd_fkn_dest_defender: "Défenseur de la foi"
 nd_fkn_dest_defender_desc: "Control the four great German archbishoprics from Aachen to Salzburg and take up the cause of the confession, establishing Franconia as the paramount spiritual authority in Christendom."
 nd_fkn_dest_free_commerce: "Libre-échange impérial"
 nd_fkn_dest_free_commerce_desc: "Sécurisez les grands salons commerciaux de Francfort et adoptez le système bancaire moderne, transformant ainsi la Franconie en le cœur commercial de l'Empire."
 nd_fkn_dest_workshop: "Atelier de l'Empire"
 nd_fkn_dest_workshop_desc: "Build Nuremberg into the Empire's foremost manufacturing city, with tools flowing from our workshops to markets across Central Europe."
 nd_fkn_dest_industrial: "La révolution industrielle"
 nd_fkn_dest_industrial_desc: "Dominate the great commercial hubs of Augsburg and Leipzig, embrace the manufactories, and lead the transformation from craft workshop to manufacture."
 STATIC_MODIFIER_NAME_nd_fkn_dest_rhenish_unity: "Unité rhénane"
 STATIC_MODIFIER_DESC_nd_fkn_dest_rhenish_unity: "Les terres situées le long du Rhin sont regroupées sous l'autorité épiscopale franconienne, créant un bloc de pouvoir centralisé au cœur de l'Empire."
 STATIC_MODIFIER_NAME_nd_fkn_dest_episcopal_courts: "Tribunaux épiscopaux"
 STATIC_MODIFIER_DESC_nd_fkn_dest_episcopal_courts: "Les cours des princes-évêques deviennent des centres d'apprentissage et d'administration ecclésiastique, façonnant la culture et la foi de leurs sujets."
 STATIC_MODIFIER_NAME_nd_fkn_dest_catholic_champion: "Champion catholique"
 STATIC_MODIFIER_DESC_nd_fkn_dest_catholic_champion: "La Franconie se présente comme l'épée de la foi catholique, ses armées étant prêtes à défendre l'Église et à imposer sa volonté aux hérétiques et aux incroyants."
 STATIC_MODIFIER_NAME_nd_fkn_dest_prince_of_peace: "Prince de la Paix"
 STATIC_MODIFIER_DESC_nd_fkn_dest_prince_of_peace: "Suivant la tradition des Landfrieden, la Franconie utilise son autorité spirituelle pour arbitrer les différends et maintenir la stabilité à travers l'Empire fracturé."
 STATIC_MODIFIER_NAME_nd_fkn_dest_meister_tradition: "Maître Tradition"
 STATIC_MODIFIER_DESC_nd_fkn_dest_meister_tradition: "Le système des maîtres artisans franconiens produit des biens d'une telle qualité que les armées et les ateliers de tout l'Empire en dépendent - même si le travail le plus raffiné exige son prix en matériaux."
 STATIC_MODIFIER_NAME_nd_fkn_dest_trade_fair_privilege: "Privilège de salon"
 STATIC_MODIFIER_DESC_nd_fkn_dest_trade_fair_privilege: "Les privilèges impériaux accordent aux villes franconiennes le droit d'organiser de grandes foires commerciales, attirant des marchands et des capitaux de toute l'Europe."
 STATIC_MODIFIER_NAME_nd_fkn_dest_manufactory_revolution: "Révolution manufacturière"
 STATIC_MODIFIER_DESC_nd_fkn_dest_manufactory_revolution: "La transformation d'atelier en usine se déroule à un rythme soutenu, même si la perturbation des anciens modèles économiques rend le royaume moins avide de guerres coûteuses."
 STATIC_MODIFIER_NAME_nd_fkn_dest_merchant_republic_spirit: "Esprit de la République marchande"
 STATIC_MODIFIER_DESC_nd_fkn_dest_merchant_republic_spirit: "Les traditions civiques des villes impériales libres inspirent un nouveau modèle de gouvernance où les intérêts commerciaux et les idéaux libéraux façonnent l’État."
 nd_fkn_hochstift: "Hochstift"
 nd_fkn_hochstift_desc: "Un complexe cathédrale-palais épiscopal où le prince-évêque exerce à la fois une autorité spirituelle et temporelle, combinant une grande église avec une école de théologie et un siège de gouvernement."
 nd_fkn_handelshaus: "Maison de commerce"
 nd_fkn_handelshaus_desc: "Une maison de commerce franconienne qui coordonne le commerce, l'entreposage et la fabrication sous un même toit, incarnant l'esprit industrieux des villes impériales libres."
 nd_fkn_pm_hochstift_scriptorium: "Scriptorium épiscopal"
 nd_fkn_pm_hochstift_scriptorium_desc: "Les érudits et les scribes du chapitre de la cathédrale produisent des ouvrages théologiques, des histoires et des textes administratifs qui répandent l'influence du diocèse."
 nd_fkn_pm_hochstift_maintenance: "Entretien de la cathédrale"
 nd_fkn_pm_hochstift_maintenance_desc: "Entretenir la cathédrale, son mobilier liturgique et les bureaux administratifs de la cour princière-évêque."
 nd_fkn_pm_handelshaus_trade: "Commerce marchand"
 nd_fkn_pm_handelshaus_trade_desc: "La maison de commerce transforme les matières premières en produits finis, coordonnant les chaînes d'approvisionnement à travers le réseau commercial de l'Empire."
 nd_fkn_pm_handelshaus_maintenance: "Entretien de la maison de commerce"
 nd_fkn_pm_handelshaus_maintenance_desc: "Entretien de l'entrepôt, des bureaux et des installations commerciales du Handelshaus."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_fkn_bureaucracy_authority: "Autorité administrative franconienne"
 AUTO_MODIFIER_DESC_nd_fkn_bureaucracy_authority: "The unified Franconian state inherits the layered apparatus of the Imperial Circle, the prince-bishoprics, and the Nuremberg patriciate: three bureaucracies of its choosing may be sustained from the day Franconia is formed."

 fkn_kreistag_bureaucracy: "Frnkischer Kreistag"
 fkn_kreistag_bureaucracy_desc: "L'assemblée du Cercle impérial de Franconie, instituée sous la réforme de Maximilien Ier en 1500 et se réunissant à Nuremberg sous une direction duumvirale de l'évêque de Bamberg et du margrave de Brandebourg-Ansbach. Le Kreistag inscrivait la contribution de chaque domaine au registre impérial, élisait les juges du Reichskammergericht, supervisait la monnaie franconienne et exécutait le Landfrieden. Des dix cercles impériaux, c'était le plus cohérent et le seul à maintenir un prélèvement permanent sur les Kreistroops jusqu'en 1806."

 fkn_domkapitel_bureaucracy: "Domkapitel"
 fkn_domkapitel_bureaucracy_desc: "The cathedral chapters of Bamberg and Würzburg, which elected the prince-bishops via Wahlkapitulationen, binding electoral capitulations, that constrained episcopal taxation, legislation, and appointments. From the 15th century the Domkapitel of Würzburg routinely co-governed the Hochstift; the Bamberg chapter ran episcopal justice through its Hofgericht and licensed the diocesan press. No prince-bishop could circumvent his canons, and the chapter's seat outlasted every individual bishop."

 fkn_innerer_rat_bureaucracy: "Rat intérieur"
 fkn_innerer_rat_bureaucracy_desc: "Le Petit Conseil de Nuremberg, formalisé vers 1320 et fermé à une liste de quarante-deux familles patriciennes par le statut de danse de 1521. Son septemvirat de ltere Herren et son triumvirat d'Oberste Hauptleute supervisaient chaque bureau municipal ; à partir de la charte de Sigismond de 1424, le conseil organisa les insignes impériaux au Heilig-Geist-Spital et organisa la Heiltumsweisung annuelle qui était le point d'ancrage de la foire commerciale de Nuremberg. Une petite oligarchie a dirigé la ville libre la plus riche de l’Empire pendant près de cinq siècles."

 fkn_ritterkanton_bureaucracy: "Canton de Ritter"
 fkn_ritterkanton_bureaucracy_desc: "Le canton franconien des chevaliers impériaux, organisé sous Maximilien Ier vers 1500 et formalisé en 1577 comme l'un des trois Ritterkreise. Les six cantons de Franconie - Odenwald, Gebrg, Steigerwald, Altmhl, Baunach et Rhn-Werra - tenaient leurs propres capitaines, archives et listes d'immatriculation. Ils payaient volontairement des Charitativsubsidien à l'empereur en lieu et place d'impôts, et leurs terres étaient exonérées de tout souverain territorial. Le Reichsritter formait une noblesse dans la noblesse, structurellement hostile à la centralisation."

 fkn_landfrieden_bureaucracy: "Landfriede"
 fkn_landfrieden_bureaucracy_desc: "L'ordonnance régionale de paix publique, en vigueur en Franconie depuis le Landfriede de Wrzburg de 1287 jusqu'à l'Ewiger Landfriede de Maximilien de 1495 et administrée après 1500 par les commissaires Landfriedenswahrung du Kreistag. Il interdit les querelles entre domaines, proclama la paix sur les grandes routes commerciales de Nuremberg à Francfort et de Wrtzbourg à Erfurt et poursuivit Friedensbrecher à travers le Reichskammergericht. Là où cela tenait, les marchés franconiens prospéraient ; là où cela a échoué, les Reichsritter ont repris leurs raids."
