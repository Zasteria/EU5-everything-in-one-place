l_french:
 STATIC_MODIFIER_NAME_nd_khalsa_raj: "Khalsa Raj"
 STATIC_MODIFIER_DESC_nd_khalsa_raj: "Le Khalsa Raj proclame la souveraineté grâce à la force du Panth. Chaque sikh est un soldat, chaque soldat un saint, et le Pendjab est uni sous l’épée à double tranchant du Khanda."
 STATIC_MODIFIER_NAME_nd_five_rivers_prosperity: "La prospérité des cinq rivières"
 STATIC_MODIFIER_DESC_nd_five_rivers_prosperity: "La terre située entre les cinq rivières a toujours abrité de grandes civilisations. Avec une tolérance envers toutes les confessions et une maîtrise de l'irrigation et du commerce, le Pendjab prospère en tant que carrefour du commerce et de la culture."
 STATIC_MODIFIER_NAME_nd_pun_baptism_of_steel: "Baptême d'Acier"
 STATIC_MODIFIER_DESC_nd_pun_baptism_of_steel: "Le Khande ki Pahul a fait des Khalsa des guerriers sans égal. Chaque Sikh initié porte de l’acier et est prêt à défendre sa foi jusqu’à la mort."
 STATIC_MODIFIER_NAME_nd_pun_brotherhood_of_the_pure: "Confrérie des Purs"
 STATIC_MODIFIER_DESC_nd_pun_brotherhood_of_the_pure: "Le Khalsa est plus qu'une armée. C'est une fraternité d'égaux liés par la dévotion, où la caste n'a aucun sens et où chaque membre sert la communauté par un service désintéressé."
 STATIC_MODIFIER_NAME_nd_pun_lion_of_lahore: "Lion de Lahore"
 STATIC_MODIFIER_DESC_nd_pun_lion_of_lahore: "Le Maharaja a apporté la discipline européenne à l'armée Khalsa. Avec une infanterie formée par les Français, une artillerie réformée et un commandement uni, l’Empire sikh dispose de la meilleure armée indigène du sous-continent."
 STATIC_MODIFIER_NAME_nd_pun_sarkar_i_khalsa: "Sarkar-i-Khalsa"
 STATIC_MODIFIER_DESC_nd_pun_sarkar_i_khalsa: "Le gouvernement du Khalsa apporte stabilité et prospérité au Pendjab. Sous une domination éclairée, les cinq fleuves nourrissent une terre de commerce, de culture et d’harmonie religieuse."
 nd_pun.1.t: "La formation du Pendjab"
 nd_pun.1.d: "The land of the five rivers stands united under a single banner. From the fertile Doabs watered by the Jhelum, Chenab, Ravi, Beas, and Sutlej to the ancient walls of Lahore, Punjab has always been a crossroads, of invaders and traders, of faiths and cultures, of East and West. Now, for the first time, a Punjabi state commands the loyalty of all these lands.\n\nBut what kind of Punjab shall this be? The martial traditions of the Khalsa call for a warrior state, where the sword and the scripture are wielded as one, and the Panth defends its sovereignty through strength of arms. Or shall Punjab embrace the legacy of its five rivers, a land of abundance and tolerance, where commerce flows as freely as the waters, and people of all faiths find shelter?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pun.1.a: "Khalsa Raj : la souveraineté du Pur"
 nd_pun.1.b: "Les Cinq Rivières nourriront tous ceux qui habitent ici"
 nd_pun.2.t: "Le baptême de l'épée à double tranchant"
 nd_pun.2.d: "On the day of Vaisakhi, before a gathering of thousands at Anandpur, the Guru called for volunteers willing to offer their heads for the faith. Five men stepped forward, a water-carrier, a farmer, a washerman, a barber, and a cook. No Kshatriya warriors, no Brahmin priests. The Guru baptized them with sweetened water stirred by a double-edged sword, and they became the Panj Pyare, the Five Beloved. Then, in an act that shattered every convention of caste and hierarchy, the Guru knelt and asked the Five to baptize him in turn.\n\nThe Khalsa was born, a fraternity where the lowest became the highest, where every member was both saint and soldier, where the surname Singh proclaimed that caste was abolished and every Sikh stood equal before the Almighty. This was not merely a military reform but a social revolution. How shall the Khalsa define itself?"
 nd_pun.2.a: "Nous sommes forgés dans l'acier : l'épée est notre écriture"
 nd_pun.2.b: "Nous sommes les purs : notre fraternité est notre force"
 nd_pun.3.t: "Le Lion du Pendjab"
 nd_pun.3.d: "From a one-eyed boy who lost his father at age twelve, to the unquestioned master of the Punjab, the Maharaja's rise is the stuff of legend. He united the fractious Misls not through bloodshed alone, but through cunning diplomacy, strategic marriages, and the force of his personality. He captured Lahore at nineteen, without firing a shot.\n\nNow the Maharaja turns his gaze to the army. He has recruited European officers, veterans of Napoleon's campaigns, to drill his infantry in the French manner and organize his artillery on modern principles. The Fauj-i-Khas, his model brigade, already rivals any force on the subcontinent. The ancient Zamzama cannon, captured from the Afghans, stands before the gates of Lahore as a symbol of Sikh power.\n\nThe question is whether this military revolution shall serve conquest or consolidation."
 nd_pun.3.a: "Le Lion rugit : que nos ennemis tremblent"
 nd_pun.3.b: "Le Sarkar-i-Khalsa gouvernera avec sagesse"
 nd_pun.4.t: "Le gourou éternel"
 nd_pun.4.d: "The Adi Granth has been compiled, a sacred scripture unlike any other. It contains not only the hymns of the Sikh Gurus but the words of Hindu Bhakti saints and Muslim Sufi mystics, composed in multiple languages and musical modes. Guru Arjan has declared that the Granth shall reside in the Harmandir Sahib at Amritsar, open to all who seek wisdom regardless of caste or creed.\n\nIn time, the tenth Guru will declare this scripture the eternal, living Guru of the Sikhs, a perpetual teacher that transcends any mortal authority. The Guru Granth Sahib embodies the revolutionary Sikh principle that divine truth belongs to no single people, language, or tradition, but speaks through all of them."
 nd_pun.4.a: "La Parole est notre Guru, maintenant et pour toujours"
 nd_pun_five_rivers_irrigation: "Irrigation des Cinq Rivières"
 nd_pun_five_rivers_irrigation_desc: "Le Doab, situé entre les cinq rivières du Pendjab, donne des récoltes extraordinaires lorsqu'il est correctement irrigué par des systèmes de canaux et des roues persanes."
 nd_pun_lahore_learning: "Les écoles d'apprentissage de Lahore"
 nd_pun_lahore_learning_desc: "Sous les Ghaznavides et le sultanat de Delhi, Lahore est devenue un centre renommé de poésie persane, de jurisprudence islamique et d'échanges universitaires."
 nd_pun_doab_horsemen_tradition: "Cavaliers Doab"
 nd_pun_doab_horsemen_tradition_desc: "Les plaines plates situées entre les rivières du Pendjab abritent une excellente cavalerie, des cavaliers rapides habitués aux raids et à la guerre de frontières."
 nd_pun_persian_wheel_tradition: "Technologie de roue persane"
 nd_pun_persian_wheel_tradition_desc: "The introduction of the Persian wheel transforms Punjab's agriculture, lifting water from deep wells to irrigate the dry uplands between the rivers, far from any bank."
 nd_pun_khyber_crossroads: "Carrefour du Khyber"
 nd_pun_khyber_crossroads_desc: "Le Pendjab garde le terminus oriental du col de Khyber, par lequel circulent conquérants et caravanes. Le contrôle de cette porte d’entrée signifie le contrôle du commerce entre l’Asie centrale et l’Inde."
 nd_pun_sultanate_garrison: "Tradition de la garnison du Sultanat"
 nd_pun_sultanate_garrison_desc: "Les villes du Pendjab (Lahore, Multan, Sialkot) ont servi pendant des siècles de villes-forteresses à la frontière nord-ouest du sultanat."
 nd_pun_guru_nanaks_message: "Message du gourou Nanak"
 nd_pun_guru_nanaks_message_desc: "En 1469, Guru Nanak est né dans le village de Talwandi, au Pendjab. Son message (« Il n’y a pas d’hindou, il n’y a pas de musulman ») proclamait l’unité de toute l’humanité sous un seul Dieu, jetant ainsi les bases du sikhisme."
 nd_pun_guru_ka_langar: "Gourou Ka Langar"
 nd_pun_guru_ka_langar_desc: "La tradition de cuisine communautaire établie par les gourous sikhs sert des repas gratuits à tous les visiteurs, sans distinction de caste, de croyance ou de rang, une déclaration radicale d'égalité."
 nd_pun_mughal_lahore: "Lahore moghole"
 nd_pun_mughal_lahore_desc: "Sous les Moghols, Lahore devient l'une des plus grandes villes du monde. Les jardins Shalimar, la mosquée Badshahi et le fort de Lahore transforment la ville en un joyau de la civilisation indo-islamique."
 nd_pun_multan_indigo: "Indigo Multan"
 nd_pun_multan_indigo_desc: "Le sud du Pendjab, autour de Multan, développe de vastes plantations d'indigo, produisant ce précieux colorant bleu destiné à l'exportation à travers le sous-continent et au-delà."
 nd_pun_gurmukhi_script: "Script Gurmukhi"
 nd_pun_gurmukhi_script_desc: "Guru Angad, le deuxième gourou sikh, standardise le script Gurmukhi pour l'enregistrement du punjabi. Cette innovation littéraire garantit que les écritures sikhs sont accessibles au peuple, et non enfermées dans le sanskrit de l'élite."
 nd_pun_gatka_tradition: "Tradition Gatka"
 nd_pun_gatka_tradition_desc: "L'art martial sikh du gatka entraîne les guerriers à l'utilisation de l'épée, du bouclier, du bâton et de la lance. Cela devient un élément central de l’identité martiale du Khalsa."
 nd_pun_guru_granth_sahib: "Gourou Granth Sahib"
 nd_pun_guru_granth_sahib_desc: "La compilation de l'Adi Granth, élevé plus tard au rang de Guru Granth Sahib, rassemble les hymnes des gourous sikhs, des saints hindous Bhakti et des soufis musulmans dans une écriture d'une inclusivité sans précédent."
 nd_pun_harmandir_sahib: "Harmandir Sahib"
 nd_pun_harmandir_sahib_desc: "The foundation of the Golden Temple at Amritsar creates the spiritual heart of Sikhism, a temple built lower than its surroundings to teach humility, with doors open on all four sides to welcome all. It can be built at Sultanwind, the village on whose land Amritsar stands."
 nd_pun_miri_piri: "Doctrine Miri-Piri"
 nd_pun_miri_piri_desc: "Guru Hargobind wears two swords, Miri for temporal authority, Piri for spiritual authority. The doctrine establishes that Sikhs must be prepared to defend their faith by force of arms, and the Akal Sena, the first Sikh army, musters at Amritsar."
 nd_pun_sikh_dharamsalas: "Sikhs Dharamsalas"
 nd_pun_sikh_dharamsalas_desc: "Des réseaux de dharamsalas, de maisons de repos et de centres communautaires, répartis dans tout le Pendjab, offrent abri et subsistance aux voyageurs et pèlerins de toutes confessions."
 nd_pun_akal_takht: "Akal Takht"
 nd_pun_akal_takht_desc: "Le Trône de l'Intemporel, établi à Amritsar par Guru Hargobind, devient le siège suprême de l'autorité temporelle sikh, l'institution à partir de laquelle le Panth émet des décrets politiques et spirituels."
 nd_pun_five_rivers_trade: "Commerce des Cinq Rivières"
 nd_pun_five_rivers_trade_desc: "Les rivières du Pendjab sont des artères commerciales. Le commerce circule le long de leurs rives et à travers les villes du Doab, reliant les marchés de l'Asie centrale aux richesses de la plaine du Gange."
 nd_pun_khalsa_formation: "Formation Khalsa"
 nd_pun_khalsa_formation_desc: "En 1699, Guru Gobind Singh institue le Khalsa, l'Ordre du Pur. Lors de la cérémonie du Khande ki Pahul, les Sikhs sont baptisés comme des saints-soldats, liés par une identité commune qui transcende les castes."
 nd_pun_misl_cavalry_tradition: "Cavalerie Misl"
 nd_pun_misl_cavalry_tradition_desc: "Les douze Misls de la Confédération sikh déploient une cavalerie rapide qui excelle dans la guérilla, attaquant les lignes d'approvisionnement mogholes et afghanes à travers les plaines du Pendjab."
 nd_pun_dal_khalsa: "Dal Khalsa"
 nd_pun_dal_khalsa_desc: "Le Dal Khalsa unifie l'assemblée militaire sikh. Bien que les Misls restent indépendants, ils se rassemblent sous la bannière du Khalsa combiné pour de grandes campagnes."
 nd_pun_khalsa_coinage: "Monnaie Khalsa"
 nd_pun_khalsa_coinage_desc: "La confédération sikh frappe ses propres pièces de monnaie, la roupie Nanakshahi, portant les noms des gourous plutôt que ceux d'un souverain temporel, affirmant la souveraineté monétaire sikh."
 nd_pun_rakhi_system: "Système Rakhi"
 nd_pun_rakhi_system_desc: "Les Sikh Misls prélèvent le Rakhi, une taxe de protection sur les villages en échange de leur défense contre les pillards et les envahisseurs. Cela devient le fondement fiscal du contrôle territorial sikh."
 nd_pun_akali_warriors: "Guerriers Akali"
 nd_pun_akali_warriors_desc: "The Akalis, 'Followers of the Timeless One', are the fearless vanguard of the Khalsa. Heavily armed with traditional weapons, they refuse European training and fight with the ferocity of religious devotion. Their companies can be raised as shock troops."
 nd_pun_ranjit_singhs_empire: "L'empire de Ranjit Singh"
 nd_pun_ranjit_singhs_empire_desc: "Maharaja Ranjit Singh unites the twelve Misls under his personal rule, establishing the Sikh Empire with its capital at Lahore. His reign brings unprecedented stability, religious tolerance, and military power to Punjab. The chiefs who once led the Misls now ride for him as the Ghorcharas, the irregular horse of the court."
 nd_pun_fauj_i_khas_advance: "Fauj-i-Khas"
 nd_pun_fauj_i_khas_advance_desc: "Le Fauj-i-Khas est la brigade d'élite modèle de l'armée Khalsa, composée d'infanterie formée en France, de cavalerie de modèle britannique et d'une troupe d'artillerie dirigée par des officiers européens. C'est la meilleure force indigène du sous-continent."
 nd_pun_lahore_foundry: "Fonderie de Lahore"
 nd_pun_lahore_foundry_desc: "Sous tutelle européenne, le Pendjab développe des fonderies d'artillerie modernes à Lahore. Les équipages des canons Khalsa atteignent une précision extraordinaire, rivalisant avec n'importe quelle artillerie du monde."
 nd_pun_shawl_trade: "Commerce de châles d'Amritsar"
 nd_pun_shawl_trade_desc: "Amritsar becomes the hub of the Kashmiri shawl trade. Over a hundred thousand artisans weave, dye, and embroider fine shawls for export to Europe and the courts of Asia.\n\n#italic Available in: $nd_pun_shawl_karkhana$#!"
 nd_pun_khalsa_modernization: "Modernisation de Khalsa"
 nd_pun_khalsa_modernization_desc: "The Sikh Empire recruits European officers, veterans of the Napoleonic Wars, to modernize training, logistics, and tactics. Ranjit Singh transforms a feudal cavalry force into a modern combined-arms army."
 nd_pun_golden_temple: "Le Temple d'Or"
 nd_pun_golden_temple_desc: "Le Maharaja Ranjit Singh recouvre les étages supérieurs du Harmandir Sahib de 750 kilogrammes d'or pur, transformant le cœur spirituel du sikhisme en l'une des structures religieuses les plus magnifiques au monde."
 nd_pun_khalsa_regular_army: "Armée régulière de Khalsa"
 nd_pun_khalsa_regular_army_desc: "L'armée moderne de Khalsa dispose de soldats réguliers bien entraînés, équipés de mousquets et de baïonnettes européens, organisés en bataillons avec des sous-officiers professionnels."
 nd_pun_punjabi_industry: "Industrie du Pendjabi"
 nd_pun_punjabi_industry_desc: "Les ateliers et forges de Lahore et d'Amritsar se développent dans la production proto-industrielle, fabriquant des armes, des textiles et de la métallurgie."
 nd_pun_sikh_governance: "Gouvernance constitutionnelle sikh"
 nd_pun_sikh_governance_desc: "La tradition des Gurmata, la prise de décision collective par le Khalsa Panth à l'Akal Takht, évolue vers un système sophistiqué de gouvernance équilibrant les autorités militaires, religieuses et civiles."
 nd_pun_breadbasket: "Corbeille à pain du Pendjab"
 nd_pun_breadbasket_desc: "Punjab's fertile Doab lands and expanded canal irrigation make it the breadbasket of the subcontinent, feeding millions and generating agricultural surplus for export."
 nd_pun_martial_legacy: "L'héritage martial sikh"
 nd_pun_martial_legacy_desc: "Les traditions martiales des Khalsa perdurent à travers les générations. La philosophie du guerrier sikh (courage, discipline et volonté de sacrifice) devient légendaire à travers le monde."
 nd_pun_punjabi_renaissance: "Renaissance du Pendjabi"
 nd_pun_punjabi_renaissance_desc: "L'épanouissement de la littérature, de la musique et de l'expression artistique punjabi s'appuie sur les fondements de l'écriture Gurmukhi et sur la synthèse culturelle favorisée par des siècles de coexistence sikh, hindoue et musulmane."
 a_nd_pun_doab_horsemen: "Cavaliers Doab"
 a_nd_pun_doab_horsemen_desc: "Cavaliers rapides venus des plaines situées entre les rivières du Pendjab, experts dans les raids et les escarmouches aux frontières."
 a_nd_pun_lahori_garrison: "Garnison de Lahori"
 a_nd_pun_lahori_garrison_desc: "Infanterie de garnison disciplinée issue des villes fortifiées du Pendjab, entraînée à la défense des murs et des citadelles."
 a_nd_pun_akal_sena: "Akal Sena"
 a_nd_pun_akal_sena_desc: "The Guru's own army, raised by Hargobind after he girded on the two swords. Volunteers who bring their own arms and ask no pay: a few hundred men who do not give ground."
 a_nd_pun_akali: "Akali Companies"
 a_nd_pun_akali_desc: "Blue-clad Akalis with sword, steel quoit and towering turban. They refuse drill, armor and retreat, and the regulars form up behind the gap they leave."
 a_nd_pun_ghorchara: "Ghorchara"
 a_nd_pun_ghorchara_desc: "The irregular horse of the Lahore court: gentlemen in mail and silk, each armed and mounted at his own cost. Superb riders and fighters one by one, and no man's idea of a drilled regiment."
 a_nd_pun_nihang: "Guerriers Nihang"
 a_nd_pun_nihang_desc: "L'intrépide Akali choque les troupes du Khalsa, lourdement armées d'armes traditionnelles et animées par une dévotion religieuse inébranlable."
 a_nd_pun_misl_cavalry: "Cavalerie Misl"
 a_nd_pun_misl_cavalry_desc: "Cavaliers de guérilla rapides de la Confédération Sikh, experts en manœuvres de flanc et en raids éclair."
 a_nd_pun_fauj_i_khas: "Fauj-i-Khas"
 a_nd_pun_fauj_i_khas_desc: "Infanterie d'élite de l'armée Khalsa, entraînée par des officiers européens aux tactiques modernes et entraînée selon les normes les plus élevées."
 a_nd_pun_khalsa_artillery: "Artillerie Khalsa"
 a_nd_pun_khalsa_artillery_desc: "Équipages de canons modernisés de l'empire sikh, entraînés par des officiers français et italiens pour atteindre une précision extraordinaire."
 a_nd_pun_khalsa_regulars: "Les habitués de Khalsa"
 a_nd_pun_khalsa_regulars_desc: "Infanterie moderne bien entraînée de l'armée réformée Khalsa, équipée de mousquets européens et organisée en bataillons professionnels."
 nd_pun_doab_canal: "Canal Doab"
 nd_pun_doab_canal_desc: "Un canal d'irrigation puisant l'eau des rivières du Pendjab pour alimenter les terres fertiles du Doab qui les séparent."
 nd_pun_gurdwara: "Gurdwara"
 nd_pun_gurdwara_desc: "Un temple sikh doté d'une cuisine communautaire qui sert des repas gratuits à tous les visiteurs, incarnant les principes sikhs d'égalité et de service désintéressé."
 nd_pun_lahore_arsenal: "Arsenal de Lahore"
 nd_pun_lahore_arsenal_desc: "Une fonderie et un arsenal militaires produisant des armes à feu et de l'artillerie modernes pour l'armée de Khalsa."
 nd_pun_shawl_karkhana: "Châle Karkhana"
 nd_pun_shawl_karkhana_desc: "Un atelier textile où les artisans tissent, teignent et brodent de fins châles pour l'exportation du luxe."
 nd_pun_dharamsala: "Dharamsala"
 nd_pun_dharamsala_desc: "Une maison de repos sikh et un centre communautaire offrant abri et subsistance aux voyageurs et pèlerins de tous horizons."
 nd_pun_khalsa_training_ground: "Terrain d'entraînement de Khalsa"
 nd_pun_khalsa_training_ground_desc: "Une académie militaire moderne où des officiers formés en Europe entraînent l'armée Khalsa aux tactiques interarmes."
 nd_pun_canal_maintenance: "Entretien des canaux"
 nd_pun_canal_maintenance_desc: "L’entretien des canaux d’irrigation nécessite un dragage régulier, la réparation des berges et l’entretien des écluses."
 nd_pun_langar_provisions: "Dispositions Langar"
 nd_pun_langar_provisions_desc: "La cuisine communautaire nécessite un approvisionnement constant en céréales, en riz et en carburant pour nourrir tous ceux qui viennent chercher un repas."
 nd_pun_arsenal_production: "Production d'Arsenal"
 nd_pun_arsenal_production_desc: "La fonderie consomme du fer, des outils et des armes existantes pour forger des armes et des munitions modernes pour l'armée Khalsa."
 nd_pun_shawl_weaving: "Tissage de châle"
 nd_pun_shawl_weaving_desc: "Les artisans tissent de la laine de qualité avec des teintures importées pour produire des châles fins et distinctifs prisés dans le monde entier."
 nd_pun_dharamsala_upkeep: "Entretien de Dharamsala"
 nd_pun_dharamsala_upkeep_desc: "L'entretien des maisons de repos nécessite des céréales pour les invités, du bois pour les réparations et de l'encens pour la prière et les rituels."
 nd_pun_training_provisions: "Dispositions de formation"
 nd_pun_training_provisions_desc: "Les installations d'entraînement militaire nécessitent des armes à feu pour les exercices, des chevaux pour l'instruction de la cavalerie et du cuir pour la sellerie et l'équipement."
 nd_pun_rahat: "Persian Wheel Well"
 nd_pun_rahat_desc: "A rahat: a masonry well with a chain of clay pots turned by a pair of oxen. It waters the uplands between the rivers, where no canal can be cut."
 nd_pun_rahat_upkeep: "Wheel Upkeep"
 nd_pun_rahat_upkeep_desc: "Timber for the gear and the yoke, clay pots for the chain, and oxen to walk the circle."
 nd_pun_darbar_sahib: "Darbar Sahib"
 nd_pun_darbar_sahib_desc: "The temple in the pool of Amritsar, built lower than the ground around it and open on all four sides. Pilgrims come from every corner of Punjab, and many of them stay."
 nd_pun_harmandir_upkeep: "Temple Upkeep"
 nd_pun_harmandir_upkeep_desc: "Grain for a langar that feeds whoever comes, stone for the causeway and the pool, and fine cloth to dress the scripture."
 nd_pun_indigo_cultivation: "Culture indigo"
 nd_pun_indigo_cultivation_desc: "Les plantes d'indigo cultivées dans le sud du Pendjab sont transformées en une teinture bleue précieuse pour le commerce du textile."
 levy_nd_pun_nihang: "Prélèvement Nihang"
 levy_nd_pun_nihang_desc: "Guerriers religieux Akali issus des fidèles sikhs, combattant avec des armes traditionnelles et une dévotion sans faille."
 levy_nd_pun_ghorchara: "Ghorchara Muster"
 levy_nd_pun_ghorchara_desc: "The noble horsemen who hold their land from the Maharaja and ride at his call."
 levy_nd_pun_doab_horsemen: "Prélèvement des cavaliers du Doab"
 levy_nd_pun_doab_horsemen_desc: "Cavalerie légère levée auprès des populations paysannes et militaires des plaines fluviales du Pendjab."
 nd_pun_rakhi_post: "Poste Rakhi"
 nd_pun_rakhi_post_desc: "Un poste de protection sikh où le prélèvement Rakhi est collecté dans les villages en échange d'une défense contre les pillards et les bandits."
 nd_pun_rakhi_collection: "Collection Rakhi"
 nd_pun_rakhi_collection_desc: "Les patrouilles sikhs armées collectent des taxes de protection auprès des villages environnants, exigeant des armes, des chevaux pour la couverture montée et du cuir pour l'équipement de patrouille."
 nd_pun_formed_tt: "Le Pendjab a été formé"
 nd_pun_path_a_tt: "A choisi Khalsa Raj"
 nd_pun_path_b_tt: "Choisissez la prospérité des Cinq Rivières"
 nd_pun_destiny: "Le destin du Pendjab"
 nd_pun_destiny_desc: "Le Pendjab est uni. Le pays des cinq fleuves a choisi sa voie, il faut désormais la forger par l'action, la conquête et l'industrie."
 nd_pun_dest_peshawar_developed_tt: "We hold #bold Peshawar#! and it has at least 48 development"
 nd_pun_dest_amritsar_developed_tt: "We hold #bold Sultanwind#! (Amritsar) and it has at least 50 development"
 nd_pun_dest_sword_of_the_panth: "Épée de la Panthe"
 nd_pun_dest_sword_of_the_panth_desc: "Sécurisez la frontière nord en conquérant le Cachemire et en construisant une armée digne du Khalsa. Posséder Srinagar avec au moins 30 000 soldats sous les armes."
 nd_pun_dest_march_to_kabul: "Marche vers Kaboul"
 nd_pun_dest_march_to_kabul_desc: "Carry the Khalsa banner into Afghanistan, conquering the ancient seat of Ghaznavid power. Hold Kabul with high prestige, and build Peshawar, the gate of the Khyber, into the fortress of the frontier."
 nd_pun_dest_empire_of_the_khalsa: "Empire des Khalsa"
 nd_pun_dest_empire_of_the_khalsa_desc: "Construisez le plus grand empire sikh que le monde ait jamais vu, s'étendant de Kandahar à Delhi. Possédez les deux villes avec un trésor et une armée massifs."
 nd_pun_dest_rivers_of_gold: "Rivières d'or"
 nd_pun_dest_rivers_of_gold_desc: "Transformer la richesse cotonnière du Pendjab en domination commerciale. Accumulez de l’or et assurez-vous que le coton circule sur le marché des capitaux."
 nd_pun_dest_crossroads_of_faith: "Carrefour de la foi"
 nd_pun_dest_crossroads_of_faith_desc: "Make Punjab a beacon of learning and tolerance by embracing modern banking institutions and raising Amritsar, founded on the village land of Sultanwind, into a city of pilgrims and merchants."
 nd_pun_dest_breadbasket_of_nations: "Le grenier des nations"
 nd_pun_dest_breadbasket_of_nations_desc: "Devenez le cœur commercial du sous-continent. Adoptez l’imprimerie, sécurisez le port commercial de Thatta dans le Sind et amassez de grandes richesses."
 nd_pun.5.t: "Le destin du Pendjab"
 nd_pun.5.d: "The five rivers flow eternal, but the state that commands them must prove itself worthy of permanence. Punjab stands at a crossroads, not merely of geography, where the passes of Central Asia meet the plains of Hindustan, but of destiny itself. The choices made now will determine whether this nation becomes a footnote in the chronicles of greater empires, or whether it carves its own name into the stone of history.\n\nThe path has been chosen. Now it must be walked."
 nd_pun.5.a: "Le Pendjab perdurera"
 nd_pun.6.t: "L'épée dégainée"
 nd_pun.6.d: "The Vale of Kashmir has fallen to the armies of Punjab. Where once the Mughal governors and Afghan warlords contested this paradise of mountains and lakes, the banner of the Khalsa now flies over Srinagar. The northern frontier is secured, but this is only the beginning.\n\nThe mountains that once sheltered Punjab's enemies are now its rampart. From these heights, the warriors of the Panth look westward toward Kabul and southward toward Delhi. The sword of the Khalsa, once drawn, does not rest until its destiny is fulfilled."
 nd_pun.6.a: "La frontière est à nous : maintenant nous regardons au-delà"
 nd_pun.7.t: "La chute de Kaboul"
 nd_pun.7.d: "The ancient city of Kabul (seat of the Ghaznavids who once plundered Punjab, stronghold of the Durrani who terrorized Lahore) has fallen to the Khalsa. The irony is not lost on the veterans of the campaign: the descendants of those who suffered the depredations of Afghan invaders have carried their standard to the very heart of Afghanistan.\n\nThe capture of Kabul transforms Punjab from a regional power into a subcontinental one. But with conquest comes the question of how to govern these new territories. Shall the army press forward with the momentum of victory, or shall discipline and order be imposed on the expanding frontier?"
 nd_pun.7.a: "Appuyez sur l'avantage : l'avant-garde mène"
 nd_pun.7.b: "La discipline avant tout : consolider la frontière"
 nd_pun.8.t: "Empire sans égal"
 nd_pun.8.d: "From the passes of Kandahar to the walls of Delhi, from the snows of Kashmir to the deserts of Sindh, the Khalsa Empire now stretches across the breadth of the subcontinent's northwest. No power on earth has matched this achievement, an empire forged not from dynastic inheritance but from the collective will of the Panth.\n\nThe Zamzama cannon, 'the Fire-Breathing Dragon', stands before the gates of Lahore as a symbol of what the Khalsa has wrought. But every empire faces the choice between the sword that conquers and the hand that governs. Shall Punjab project its military power outward, demanding submission from its neighbors? Or shall the empire's intelligence and diplomacy bind its conquests into a lasting dominion?"
 nd_pun.8.a: "Le Lion rugit : qu'ils tremblent"
 nd_pun.8.b: "Le tonnerre de Zamzama oblige à l'obéissance"
 nd_pun.9.t: "Les rivières rapportent leur richesse"
 nd_pun.9.d: "The great cotton caravans of Punjab have begun to flow, from the fields of the Doab to the markets of the capital, from the spinning wheels of Multan to the trading houses of Lahore. Cotton is white gold, and Punjab sits atop an ocean of it.\n\nThe five rivers that give this land its name are more than waterways for irrigation and navigation. They are arteries of commerce, carrying the raw wealth of the interior to the markets of the world. The merchant who controls the confluence controls the trade of half a continent."
 nd_pun.9.a: "Les rivières nous rendront riches"
 nd_pun.10.t: "Où toutes les confessions se rencontrent"
 nd_pun.10.d: "Punjab has become what Guru Nanak envisioned, a land where Hindu and Muslim, Sikh and Christian, merchant and mystic find common ground. The embrace of modern banking has transformed the bazaars of Lahore and Amritsar into centers of international finance. Money, like water, flows where the channels are deepest, and Punjab's channels run deep indeed.\n\nThe question now is how to leverage this prosperity. Shall the wealth of the Doab feed the growth of the land itself, turning Punjab into a garden of abundance? Or shall the community kitchen of the langar feed not just bodies but the integration of all peoples into a single Punjabi identity?"
 nd_pun.10.a: "Le Doab débordera d’abondance"
 nd_pun.10.b: "Le langar nourrit tous ceux qui viennent"
 nd_pun.11.t: "Cœur du sous-continent"
 nd_pun.11.d: "The merchants of Thatta bow before the trading houses of Punjab. The printing presses of Lahore spread knowledge in a dozen languages. From the salt mines of Khewra to the cotton fields of Multan, from the shawl workshops of Amritsar to the river ports of the five Doabs, Punjab has become the indispensable crossroads of South Asian commerce.\n\nThis is not an empire of the sword but an empire of the ledger book and the grain measure, and it is no less powerful for that. The question that remains is whether Punjab shall project this commercial power outward through diplomacy and trade, or whether it shall perfect its internal economy to become a self-sustaining civilization."
 nd_pun.11.a: "Nos marchands atteindront tous les tribunaux"
 nd_pun.11.b: "Nos métiers à tisser et nos champs nourrissent le monde"
 STATIC_MODIFIER_NAME_nd_pun_dest_khalsa_vanguard: "Avant-garde de Khalsa"
 STATIC_MODIFIER_DESC_nd_pun_dest_khalsa_vanguard: "L'avant-garde Khalsa mène l'avancée, se renforçant rapidement et pillant les richesses des terres conquises pour alimenter de nouvelles campagnes."
 STATIC_MODIFIER_NAME_nd_pun_dest_frontier_discipline: "Discipline de frontière"
 STATIC_MODIFIER_DESC_nd_pun_dest_frontier_discipline: "Iron discipline sustains the Khalsa on the Afghan frontier, reducing war weariness and attracting mercenaries to the banner, though the forts of the frontier are costly to keep."
 STATIC_MODIFIER_NAME_nd_pun_dest_lion_of_punjab: "Lion du Pendjab"
 STATIC_MODIFIER_DESC_nd_pun_dest_lion_of_punjab: "Le Lion du Pendjab dicte ses conditions aux ennemis vaincus, annexant des territoires à moindre coût et déclarant des guerres avec la confiance des invaincus."
 STATIC_MODIFIER_NAME_nd_pun_dest_zamzama_thunder: "Zamzama Tonnerre"
 STATIC_MODIFIER_DESC_nd_pun_dest_zamzama_thunder: "Le tonnerre de Zamzama résonne à travers tout l’empire, liant les sujets via des réseaux de loyauté et de renseignement ; bien que le coût de l’empire pèse sur le trésor."
 STATIC_MODIFIER_NAME_nd_pun_dest_doab_abundance: "Abondance de Doab"
 STATIC_MODIFIER_DESC_nd_pun_dest_doab_abundance: "Les terres fertiles du Doab produisent une telle abondance que le séparatisme s'estompe et que de nouvelles voies diplomatiques s'ouvrent, attirant les voisins dans l'orbite du Pendjab."
 STATIC_MODIFIER_NAME_nd_pun_dest_langar_of_nations: "Langar des Nations"
 STATIC_MODIFIER_DESC_nd_pun_dest_langar_of_nations: "L'hospitalité légendaire du Pendjab intègre divers peuples et attire des mercenaires à faible coût, même si le confort de la prospérité affaiblit l'avantage de l'armée en campagne."
 STATIC_MODIFIER_NAME_nd_pun_dest_five_rivers_emporium: "Magasin des Cinq Rivières"
 STATIC_MODIFIER_DESC_nd_pun_dest_five_rivers_emporium: "Les diplomates et les marchands de bétail du Pendjab s'adressent à tous les tribunaux du sous-continent, même si l'engagement du pays en faveur de la tolérance rend les guerres de religion politiquement coûteuses."
 STATIC_MODIFIER_NAME_nd_pun_dest_cultural_synthesis: "Synthèse culturelle"
 STATIC_MODIFIER_DESC_nd_pun_dest_cultural_synthesis: "La confluence des traditions sikhes, hindoues et musulmanes transforme les ateliers du Pendjab en moteurs de production, les exportations de laine et de sel alimentant de vastes réseaux d'approvisionnement."
 nd_pun_dest_khalsa_durbar: "Khalsa Durbar"
 nd_pun_dest_khalsa_durbar_desc: "La cour souveraine de l'empire Khalsa, où les commandants militaires et les administrateurs civils se réunissent sous l'autorité du Panth pour gouverner le vaste domaine sikh."
 nd_pun_dest_durbar_administration: "Administration de Durbar"
 nd_pun_dest_durbar_administration_desc: "La cour impériale consomme des armes pour la garde, du papier pour les dossiers administratifs et des tissus pour les ornements cérémoniels de la souveraineté."
 nd_pun_dest_doab_mandi: "Doab Mandi"
 nd_pun_dest_doab_mandi_desc: "Un grand marché aux passages fluviaux où les marchandises de l'Asie centrale, de la plaine du Gange et du Deccan convergent dans l'étreinte commerciale du Pendjab."
 nd_pun_dest_mandi_operations: "Opérations Mandi"
 nd_pun_dest_mandi_operations_desc: "Le marché a besoin de tissu pour les échantillons commerciaux, de papier pour les contrats, de sel pour la conservation et d'outils pour peser et mesurer les marchandises."

# ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_pun_bureaucracy_authority: "Khalsa Diwans"
 AUTO_MODIFIER_DESC_nd_pun_bureaucracy_authority: "L’appareil administratif du Pendjab (la grande assemblée sikh de l’Akal Takht, la confédération misl des cavaliers, le Khalsa Panth, le Durbar de Lahore du Maharaja et les registres fiscaux des Daftar) est devenu une structure institutionnelle permanente. L'autorité circule à travers les registres et les convocations plutôt qu'à travers la personne d'un dirigeant, et le royaume fonctionne désormais comme une institution plutôt que comme un tribunal."

 pun_sarbat_khalsa_bureaucracy: "Sarbat Khalsa"
 pun_sarbat_khalsa_bureaucracy_desc: "L'assemblée biennale de l'ensemble du Khalsa, convoquée à Amritsar à Baisakhi et Diwali. Assis à l'Akal Takht face au Harmandir Sahib, les chefs misl, les Granthis et les Akali Jathedars résolvèrent les différends et publièrent des gurmatas - des décrets pris en présence du Guru Granth Sahib - sur la guerre, les traités et l'excommunication. Ce sont les gurmata de 1733 qui élirent Kapur Singh chef du Dal Khalsa ; Grâce à de telles convocations, les Sikhs du XVIIIe siècle ont maintenu leur unité politique sans État central. Ranjit Singh cessa discrètement de convoquer le Sarbat Khalsa après 1805, reconnaissant que son autorité était incompatible avec la sienne."

 pun_misl_confederacy_bureaucracy: "Confédération Misl"
 pun_misl_confederacy_bureaucracy_desc: "Les douze confédérations de cavalerie qui divisaient le Pendjab entre c. 1716 et 1799 : Sukerchakia, Bhangi, Ahluwalia, Ramgarhia, Phulkian, Singhpuria, Krora Singhia, Nakkai, Faizullapuria, Karor Singhia, Nishanwalia et Dallewalia. Chaque misl était une bande de guerre aristocratique dont les sardars détenaient des territoires sous le système rakhi : rente de protection payée par les villages à la bande dont les cavaliers patrouillaient dans leurs champs. La confédération pouvait déployer des dizaines de milliers de cavaliers contre les invasions d'Ahmad Shah Abdali, mais ne répondait à aucun souverain; Ranjit Singh a maîtrisé les misls un par un entre 1799 et 1809, dépossédant ceux qui ne voulaient pas se soumettre et intégrant le reste dans son armée permanente."

 pun_khalsa_panth_bureaucracy: "Panthe Khalsa"
 pun_khalsa_panth_bureaucracy_desc: "L'ordre des purs, fondé par Guru Gobind Singh à Anandpur sur Baisakhi 1699 avec l'initiation du Panj Pyare et l'institution de l'amrit pahul. Le Khalsa fusionnait dévotion religieuse et service militaire : chaque Sikh initié devenait un Singh ou un Kaur, lié par les cinq kakars et le code Rahit Maryada, et obligé de porter les armes pour défendre le dharma. Le Panth a soutenu la résistance sikh tout au long des persécutions génocidaires mogholes des années 1740 et 1750, lorsque Banda Singh Bahadur et les Dal Khalsa combattaient depuis les forêts de Lakhi Jangal, et est resté par la suite le fondement moral de chaque formation militaire sikh."

 pun_lahore_durbar_bureaucracy: "Lahore Durbar"
 pun_lahore_durbar_bureaucracy_desc: "Tribunal central du Maharaja Ranjit Singh, établi à Lahore lors de son couronnement en 1801 et présidé par le vakil-i-mutlaq Dhian Singh Dogra. Le Durbar émettait des firmans, vérifiait les recettes provinciales, faisait la médiation entre les sardars des misls absorbés et projetait l'autorité du maharaja à travers un État punjabi multi-religieux s'étendant de Peshawar au Sutlej. Grâce au Durbar, Ranjit Singh a rassemblé les frères hindous Dogra, le musulman punjabi Fakir Azizuddin et un groupe de conseillers européens en un seul appareil administratif. L’institution ne lui survécut que brièvement : les luttes régicides de 1839 à 1843 l’effondrèrent en quatre ans."

 pun_fauj_i_khas_bureaucracy: "Fauj-i-Khas"
 pun_fauj_i_khas_bureaucracy_desc: "La brigade modèle, créée par Ranjit Singh à partir de 1822 et entraînée sur les lignes françaises et italiennes par des vétérans des armées de Napoléon. Jean-François Allard organise la cavalerie, Jean-Baptiste Ventura l'infanterie, Claude-Auguste Court l'artillerie et Paolo di Avitabile la gendarmerie de la frontière de Khyber. La division d'élite de l'armée de Khalsa entraînait en trois langues, combattait en ligne et en colonne disciplinées et alignait une artillerie à cheval qui ne rivalisait en Asie que avec celle de la Compagnie des Indes orientales. Hari Singh Nalwa a utilisé le Fauj-i-Khas lors des conquêtes de Multan, du Cachemire et de Peshawar, brisant trois siècles d'ascendant afghan sur l'Indus avant sa mort à Jamrud en 1837."

 pun_daftar_i_bahi_bureaucracy: "Daftar-i-Bahi"
 pun_daftar_i_bahi_bureaucracy_desc: "Le système de registre des recettes est administré depuis Lahore par Diwan Sawan Mal de Multan et Diwan Dina Nath, qui ont construit sur le défunt jagirdari moghol mais ont enregistré chaque subvention dans un bahi (livre de comptes) permanent. Les jagirs sikhs étaient attachés au service militaire plutôt qu'au droit héréditaire : un sardar qui ne parvenait pas à livrer son contingent de cavaliers perdait son affectation sur les terres de la khalsa. Les scribes des Daftar étaient issus des bourgeois du Pendjabi Khatri et de la classe brahmane Pandit, et tenaient simultanément des registres de revenus en écritures persane, punjabi et landa, permettant au maharaja d'imposer un royaume multiconfessionnel à partir d'un seul trésor."

 pun_akali_nihangs_bureaucracy: "Akali Nihangs"
 pun_akali_nihangs_bureaucracy_desc: "The immortal warriors of the Akal Takht, the blue-clad ascetic order founded by Guru Hargobind in 1606 to embody the principle of miri-piri: temporal and spiritual sword in one. The Nihangs formed the orthodoxy guard of the Khalsa, served as guides on Sikh battlefields from Chamkaur (1704) to the Anglo-Sikh wars, and famously held Akali Phula Singh's jathedari against Ranjit Singh himself in the Lahore Durbar of 1819, when the Akali jathedar publicly fined the maharaja for moral lapses. In 1809 his Akalis fell upon the escort of the British envoy Metcalfe at Amritsar. The order answered to the Guru Granth Sahib and the rahit, not to a court, and its independence was a guarantor of Sikh orthodoxy against royal accommodation."
