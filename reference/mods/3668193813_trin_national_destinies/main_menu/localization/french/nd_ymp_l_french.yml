l_french:
 # === Variable tooltips ===
 nd_ymp_formed_tt: "L'Empire Yamato a été proclamé"
 nd_ymp_path_a_tt: "L'empire suit le chemin de la conquête continentale de Hideyoshi"
 nd_ymp_path_b_tt: "L'empire est gouverné par la bureaucratie continentale du bakufu"
 nd_ymp_dest_liaodong_share_tt: "At least #bold 75%#! of the locations of Liaodong are ours"
 nd_ymp_dest_selenga_share_tt: "At least #bold 50%#! of the locations of the Upper Selenga are ours"
 nd_ymp_dest_u_share_tt: "At least #bold 50%#! of the locations of Ü are ours"
 nd_ymp_dest_taiwan_share_tt: "At least #bold 50%#! of the locations of Taiwan are ours"
 nd_ymp_dest_luzon_share_tt: "At least #bold 50%#! of the locations of Luzon are ours"
 nd_ymp_dest_marianas_share_tt: "At least #bold 50%#! of the locations of the Marianas are ours"
 nd_ymp_path_c_tt: "L’empire incarne la synthèse sino-japonaise"

 # === Static modifier names and descriptions ===
 STATIC_MODIFIER_NAME_nd_ymp_continental_conquest: "La conquête continentale de Hideyoshi"
 STATIC_MODIFIER_DESC_nd_ymp_continental_conquest: "Le bakufu rejette le sakoku. Les armées de samouraïs qui ont écrasé le Japon Sengoku marchent désormais sur la Corée, le Liaodong et le Yangtsé. L'invasion Imjin de 1592 réussit là où les Taiko moururent en essayant."

 STATIC_MODIFIER_NAME_nd_ymp_imperial_bureaucracy: "Bureaucratie impériale Tokugawa"
 STATIC_MODIFIER_DESC_nd_ymp_imperial_bureaucracy: "Administration Edo, projetée à l'échelle continentale. Les gouverneurs Han administrent la Corée et la Mandchourie. Des érudits confucéens travaillent à la chancellerie impériale. Le trône du chrysanthème est au-dessus de tout."

 STATIC_MODIFIER_NAME_nd_ymp_sino_japanese_synthesis: "Synthèse sino-japonaise"
 STATIC_MODIFIER_DESC_nd_ymp_sino_japanese_synthesis: "Les lettres coréennes, l’érudition Ming et les rituels japonais fusionnent en une seule civilisation impériale d’Asie de l’Est. Trois enseignements, un empire. Les érudits et les samouraïs appartiennent à la même caste."

 STATIC_MODIFIER_NAME_nd_ymp_invasion_logistics: "Logistique d'invasion Imjin"
 STATIC_MODIFIER_DESC_nd_ymp_invasion_logistics: "La leçon apprise par Hideyoshi : une armée qui traverse la mer doit être nourrie à travers la mer. Les dépôts de ravitaillement continentaux remplacent la logistique des raids à courte cadence."

 STATIC_MODIFIER_NAME_nd_ymp_disciplined_columns: "Colonnes disciplinées"
 STATIC_MODIFIER_DESC_nd_ymp_disciplined_columns: "Tirs de volée rotatifs à trois rangs et exercices à colonne ashigaru, perfectionnés par des années de campagne sur le sol coréen."

 STATIC_MODIFIER_NAME_nd_ymp_yi_sun_sin_legacy: "L'héritage de Yi Sun-sin"
 STATIC_MODIFIER_DESC_nd_ymp_yi_sun_sin_legacy: "L'amiral nous a vaincus à Hansando. Nous avons pris ses navires. Sa tactique appartient désormais à la flotte impériale."

 STATIC_MODIFIER_NAME_nd_ymp_pacific_dominance: "Domination du Pacifique"
 STATIC_MODIFIER_DESC_nd_ymp_pacific_dominance: "Geobukseon, atakebune et sekibune patrouillent sur toutes les voies maritimes, de Hokkaido à Macao."

 STATIC_MODIFIER_NAME_nd_ymp_sacred_sovereignty: "Souveraineté sacrée"
 STATIC_MODIFIER_DESC_nd_ymp_sacred_sovereignty: "Le Mikado n'est plus un prêtre captif à Kyoto. Le trône du chrysanthème est le centre politique de l'empire."

 STATIC_MODIFIER_NAME_nd_ymp_imperial_household: "Ministère de la Maison Impériale"
 STATIC_MODIFIER_DESC_nd_ymp_imperial_household: "Le kunaisho administre les domaines continentaux de l'empereur comme le bakufu administre le royaume."

 STATIC_MODIFIER_NAME_nd_ymp_daimyo_protectorates: "Protectorats Daimyo"
 STATIC_MODIFIER_DESC_nd_ymp_daimyo_protectorates: "Les provinces coréennes et mandchoues sont accordées comme han continental aux daimyos supérieurs. Loyauté en échange d'une terre loin d'Edo."

 STATIC_MODIFIER_NAME_nd_ymp_direct_imperial_rule: "Règle impériale directe"
 STATIC_MODIFIER_DESC_nd_ymp_direct_imperial_rule: "Le bakufu règne par l'intermédiaire de préfets nommés à Edo, et non par l'intermédiaire de seigneurs héréditaires. Les impôts continentaux vont directement au trésor impérial."

 STATIC_MODIFIER_NAME_nd_ymp_national_essence: "Kokutai : essence nationale"
 STATIC_MODIFIER_DESC_nd_ymp_national_essence: "L’empire n’est pas un État dirigé par un dirigeant ; c'est le dirigeant doté d'un État. La théologie Kokutai lie les sujets coréens et chinois au sein du corps impérial."

 STATIC_MODIFIER_NAME_nd_ymp_pan_asian_emperorship: "Empereur pan-asiatique"
 STATIC_MODIFIER_DESC_nd_ymp_pan_asian_emperorship: "L'empereur Yamato revendique le Mandat du Ciel autrefois détenu par le Fils du Ciel à Pékin. La Corée, Ryukyu, le Tonkin et Taiwan le reconnaissent."

 STATIC_MODIFIER_NAME_nd_ymp_syncretic_clergy: "Clergé des Trois Enseignements"
 STATIC_MODIFIER_DESC_nd_ymp_syncretic_clergy: "Moine bouddhiste, érudit confucianiste et prêtre shinto se forment dans les mêmes académies. L’empire les ordonne comme un seul corps."

 STATIC_MODIFIER_NAME_nd_ymp_scholar_priests: "Prêtres-érudits"
 STATIC_MODIFIER_DESC_nd_ymp_scholar_priests: "Le clergé de l'empire lit les classiques Han, récite les sutras du Mahayana et accomplit les rites shinto. L'alphabétisation est une vertu religieuse."

 # === Formation event ===
 nd_ymp.1.t: "L'empire Yamato est proclamé"
 nd_ymp.1.d: "From Tsushima the long-feared news reaches Edo: Pyongyang is taken, Hanseong has fallen, the Yangtze cities have surrendered tribute. The Imjin invasion that Toyotomi Hideyoshi began in 1592 has at last succeeded. The bakufu rejects the old isolationist counsel; sakoku will not be sealed. Daimyo who fought from Pusan to the Yellow River return to Edo as continental governors. Korean scholars stand beside Buddhist abbots in the imperial chancery. The Mikado, freed from his gilded captivity in Kyoto, takes the chrysanthemum seal as ruler not of a small archipelago but of all East Asia.\n\nFrom Hokkaido to the Yangtze the empire stretches. The bakufu must now decide what kind of empire to become.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ymp.1.a: "La conquête continentale de Hideyoshi"
 nd_ymp.1.b: "La bureaucratie continentale du Bakufu"
 nd_ymp.1.c: "Trois enseignements, une civilisation"

 # === Advance DHE: Imjin Doctrine ===
 nd_ymp.2.t: "La doctrine Imjin codifiée"
 nd_ymp.2.d: "Les leçons de la première invasion ratée de Hideyoshi ont été réduites au manuel. Les généraux qui débarquèrent à Pusan ​​en 1592 furent affamés pour rentrer chez eux en 1598 parce que les navires de ravitaillement ne pouvaient pas suivre le rythme des colonnes en marche. La nouvelle doctrine n’est pas sentimentale : une armée qui traverse la mer doit d’abord construire sa ligne de ravitaillement, puis mener ses batailles. Des châteaux s'élèvent à chaque point d'étranglement entre Pusan ​​et Pyongyang avant qu'un seul ashigaru n'avance à l'intérieur des terres. Le bakufu a décidé comment la deuxième invasion n'échouerait pas."
 nd_ymp.2.a: "Construisez d’abord les routes d’approvisionnement"
 nd_ymp.2.b: "Percez les colonnes jusqu'à ce qu'elles marchent dans leur sommeil"

 # === Advance DHE: Geobukseon Adoption ===
 nd_ymp.3.t: "Les bateaux-tortues sont à nous"
 nd_ymp.3.d: "L'amiral Yi Sun-sin a coulé la première flotte d'invasion à Hansando avec des navires de guerre couverts et au toit de fer que nos charpentiers n'avaient jamais imaginés. Aujourd'hui, ces mêmes constructeurs navals, amenés des arsenaux de Joseon à Edo en tant que maîtres rémunérés de leur métier, construisent des géobukseon pour la marine impériale. L'ironie n'échappe à personne : le navire qui a vaincu Hideyoshi est devenu le vaisseau amiral de Hideyoshi. La première flotte blindée de fer du Pacifique fait voler le chrysanthème."
 nd_ymp.3.a: "Honorez Yi Sun-sin dans le sanctuaire naval impérial"
 nd_ymp.3.b: "Envoyez la nouvelle flotte dominer toutes les voies du Pacifique"

 # === Advance DHE: Chrysanthemum Throne ===
 nd_ymp.4.t: "Le trône du chrysanthème monte"
 nd_ymp.4.d: "Pendant des siècles, le Mikado a été un prisonnier sacré : confiné à Kyoto, bénéficiant d'honneurs rituels, vidé de tout pouvoir politique. L'Empire Yamato y met fin. Le kiku-no-gomon, le chrysanthème à seize pétales, n'est plus le sceau d'un prêtre captif. C'est l'étendard impérial d'Edo à Pyongyang en passant par le Yangtsé. Les édits de l'empereur sont publiés dans le même souffle que ceux du bakufu, et les érudits confucianistes de Pékin ont juré de leur obéir tous les deux."
 nd_ymp.4.a: "Le Mikado règne en majesté sacrée"
 nd_ymp.4.b: "La maison impériale administre comme une grande fonction"

 # === Advance DHE: Continental Bakufu ===
 nd_ymp.5.t: "Le Bakufu s'étend sur tous les continents"
 nd_ymp.5.d: "Le shogunat, qui gouvernait autrefois uniquement les îles d'origine, administre désormais les préfectures coréennes, les garnisons du Liaodong et les circuits fiscaux du Yangtsé. Les Daimyo détenant des fiefs à Pusan ​​fréquentent Edo aussi facilement que ceux détenant des fiefs à Sendai. Les yamen impériaux, calqués sur les bureaux bureaucratiques Ming mais dotés de confucéens formés par des samouraïs, gèrent les rôles d'imposition continentaux. La question est de savoir s’il faut confier la gouvernance aux grandes maisons de daimyo ou confier toute l’administration directement à la chancellerie impériale."
 nd_ymp.5.a: "Accorder un han continental à un fidèle daimyo"
 nd_ymp.5.b: "Gouverné par les préfets impériaux d'Edo"

 # === Advance DHE: Kokutai Ideology ===
 nd_ymp.6.t: "La doctrine de l’essence nationale"
 nd_ymp.6.d: "Les théologiens kokutai, s'appuyant sur la renaissance de l'érudition autochtone par Motoori Norinaga et sur l'idéal confucéen de l'empereur sage, articulent quelque chose de nouveau : une doctrine de la souveraineté impériale comme principe cosmique. L’empire n’est pas un régime politique doté d’un empereur. L'empire est l'empereur, et ses sujets, japonais, coréens ou chinois, partagent sa descendance divine par la seule loyauté. La doctrine naturalise simultanément les sujets coréens et chinois en tant que corps impérial et garantit la suprématie du Yamato sur eux."
 nd_ymp.6.a: "Gardez la doctrine à portée de main : l'essence des îles d'origine"
 nd_ymp.6.b: "Projeter la doctrine vers l’extérieur : un empereur pan-asiatique"

 # === Advance DHE: Three Teachings ===
 nd_ymp.7.t: "Les trois enseignements synthétisés"
 nd_ymp.7.d: "Dans les nouvelles académies continentales, le programme fusionne ce que les autres empires gardaient séparé. Un érudit-samouraï étudie les classiques confucéens le matin, les sutras du Mahayana l'après-midi et la liturgie shinto au crépuscule. Aucune de ces traditions, selon la chancellerie impériale, ne contredit les autres. Bouddha est une manifestation du kami ; le sage confucéen est un bodhisattva bouddhiste ; l'observance rituelle et l'administration politique sont des formes d'une seule et même pratique. Edo remplace Kyoto, Hanseong et Pékin comme siège des trois traditions à la fois."
 nd_ymp.7.a: "Former ensemble le clergé dans les trois traditions"
 nd_ymp.7.b: "Exigez que l'élite alphabétisée maîtrise les trois classiques"

 # === Advance localization ===
 nd_ymp_imperial_heian_inheritance: "Héritage impérial Heian"
 nd_ymp_imperial_heian_inheritance_desc: "Le Mikado, souverain rituel depuis Heian-kyo, reprend l'autorité temporelle. L’empire continental repose sur la plus ancienne lignée impériale d’Asie de l’Est."

 nd_ymp_wakou_maritime_tradition: "Tradition Maritime du Wakou"
 nd_ymp_wakou_maritime_tradition_desc: "Les pirates-commerçants de Tsushima et de Goto ont attaqué les côtes coréennes et chinoises pendant des siècles. Leur matelotage, transféré à la marine impériale, devient une projection de puissance dans le Pacifique."

 nd_ymp_yamabushi_orders: "Commandes Yamabushi"
 nd_ymp_yamabushi_orders_desc: "Les guerriers ascétiques des montagnes du mont Hiei et de Koyasan apportent la discipline monastique au service impérial. Soldats autant que prêtres, prêtres autant que soldats."

 nd_ymp_mahayana_state_patronage: "Patronage de l’État Mahayana"
 nd_ymp_mahayana_state_patronage_desc: "Les écoles Tendai et Shingon deviennent des armes de l'État impérial. De grandes pagodes s'élèvent à Edo, Hanseong et Yangzhou comme sites de légitimité impériale-bouddhiste."

 nd_ymp_yamashiro_fortifications: "Fortifications de Yamashiro"
 nd_ymp_yamashiro_fortifications_desc: "L'architecture des châteaux de montagne, raffinée pour le terrain accidenté des îles d'origine, s'exporte au-delà des frontières coréennes et mandchoues."

 nd_ymp_continental_ambition: "Ambition continentale"
 nd_ymp_continental_ambition_desc: "À partir du moment où le bakufu unifié s’élève, Edo regarde vers l’ouest, à travers Tsushima. Le continent est l’objet naturel de la puissance japonaise."

 nd_ymp_atakebune_doctrine: "Doctrine Atakebune"
 nd_ymp_atakebune_doctrine_desc: "Les navires châteaux armés de canons, hauts et lents, dominent les batailles en eaux rapprochées qui décident du contrôle maritime de l'Asie de l'Est."

 nd_ymp_tanegashima_firearms: "Armes à feu de Tanegashima"
 nd_ymp_tanegashima_firearms_desc: "L'arquebuse à mèche, copiée sur les naufragés portugais de Tanegashima en 1543, est produite en série dans les arsenaux impériaux à des échelles qui éclipsent celles de l'Europe."

 nd_ymp_daimyo_patronage: "Patronage des Arts Daimyo"
 nd_ymp_daimyo_patronage_desc: "Raffinement Higashiyama : cérémonie du thé, peinture à l'encre, pas de théâtre, polissage de l'épée. Le dojo impérial considère tout cela comme une seule tradition martiale et esthétique."

 nd_ymp_lacquerware_mastery: "Maîtrise de la laque"
 nd_ymp_lacquerware_mastery_desc: "Les ateliers Wajima et Echizen, perfectionnant l'application de l'urushi au fil de décennies de superposition, produisent des récipients prisés de Pékin à Lisbonne."

 nd_ymp_ikko_suppression: "Suppression des Ikko-ikki"
 nd_ymp_ikko_suppression_desc: "Oda et Hideyoshi brisèrent les confédérations militantes de la Terre Pure. Le bakufu hérite d’un continent sans armées religieuses indépendantes."

 nd_ymp_concentric_castles: "Architecture de château concentrique"
 nd_ymp_concentric_castles_desc: "Les donjons en pierre de style Azuchi avec des champs de tirs d'arquebuses superposés deviennent la fortification impériale standard, érigée à chaque point d'étranglement entre Pusan ​​et Pyongyang."

 nd_ymp_nanban_trade: "Commerce Nanban"
 nd_ymp_nanban_trade_desc: "Les caraques portugaises apportent de la soie chinoise, des épices indiennes et de l'argent du Nouveau Monde à l'économie du Pacifique. Les courtiers impériaux de Nagasaki contrôlent les flux."

 nd_ymp_imjin_doctrine: "La doctrine Imjin"
 nd_ymp_imjin_doctrine_desc: "Hideyoshi a échoué parce que ses lignes d'approvisionnement ne pouvaient pas correspondre à son ambition. La nouvelle doctrine est la suivante : l’approvisionnement d’abord, l’avance ensuite. Les armées continentales de Yamato ne meurent jamais de faim."

 nd_ymp_ashigaru_musket_ranks: "Rangs du mousquet Ashigaru"
 nd_ymp_ashigaru_musket_ranks_desc: "Des tirs de volée rotatifs à trois rangs, la perfection impériale de la tactique d'Oda, brisent les charges de cavalerie de la Mandchourie à Yangzhou."

 nd_ymp_geobukseon_adoption: "Adoption de Geobukseon"
 nd_ymp_geobukseon_adoption_desc: "Le bateau-tortue coréen au toit de fer qui a vaincu la première invasion est désormais construit dans les chantiers impériaux d'Edo et de Tsushima. Le vaisseau amiral de l'empire est une idée capturée."

 nd_ymp_continental_cavalry: "Cavalerie continentale"
 nd_ymp_continental_cavalry_desc: "Les samouraïs formés sur les sentiers étroits de Honshu traversent désormais la steppe de Mandchourie. Les bushi s'adaptent ou meurent."

 nd_ymp_continental_castles: "Châteaux continentaux"
 nd_ymp_continental_castles_desc: "Pyongyang, Hanseong, Liaoyang. Des donjons japonais en pierre s'élèvent au-dessus des murs coréens et des briques crues chinoises. Le continent est en train d'être refait dans l'architecture Yamato."

 nd_ymp_pacific_trade_routes: "Routes commerciales du Pacifique"
 nd_ymp_pacific_trade_routes_desc: "L'argent de Manille, la soie de Macao et les laques d'Edo se déplacent sur des fonds impériaux. Le Pacifique n'est plus un lac espagnol."

 nd_ymp_diplomatic_reach: "Portée diplomatique"
 nd_ymp_diplomatic_reach_desc: "Les envoyés impériaux à Pékin, Hanseong, Manille, Lhassa et Bangkok portent le sceau du chrysanthème. L’empire s’adresse à tous ses voisins comme à un égal ou à un supérieur."

 nd_ymp_chrysanthemum_throne: "Le trône du chrysanthème"
 nd_ymp_chrysanthemum_throne_desc: "Le kiku-no-gomon n'est plus un artifice courtois d'un empereur captif. C'est le sceau impérial d'un empire continental. Le Mikado règne dans les faits et dans la forme."

 nd_ymp_continental_bakufu: "Bakufu continental"
 nd_ymp_continental_bakufu_desc: "Le bakufu administre les préfectures coréennes et les garnisons mandchoues par l'intermédiaire des gouverneurs han et des yamen impériaux. Le shogunat a traversé la mer."

 nd_ymp_three_teachings: "Les trois enseignements"
 nd_ymp_three_teachings_desc: "Le bouddhisme Mahayana, le classicisme confucéen et le rituel shinto fusionnent en une seule orthodoxie impériale. Aucun des trois n’est autorisé à revendiquer la primauté sur les autres."

 nd_ymp_samurai_officer_corps: "Corps des officiers samouraïs"
 nd_ymp_samurai_officer_corps_desc: "La caste des guerriers héréditaires devient le cadre des officiers professionnels de l'armée impériale. De la Mandchourie à Kyushu, les samouraïs commandent à tous les niveaux."

 nd_ymp_confucian_examinations: "Examens confucianistes"
 nd_ymp_confucian_examinations_desc: "Le bakufu adopte le système d'examen Ming, modifié pour le statut de samouraï. Les samouraïs érudits qui réussissent les examens impériaux font partie du personnel de chaque yamen continental."

 nd_ymp_continental_garrisons: "Garnisons continentales"
 nd_ymp_continental_garrisons_desc: "Des régiments impériaux permanents contrôlent toutes les grandes villes coréennes et mandchoues. Les provinces conquises ne redeviennent plus invincibles."

 nd_ymp_lacquerware_export: "Exportation de laque impériale"
 nd_ymp_lacquerware_export_desc: "Les ateliers Daimyo à Wajima, Echizen et Hanseong s'adaptent aux volumes du commerce mondial. Les laques Yamato sont un produit de luxe dans toutes les cours européennes."

 nd_ymp_kokutai_ideology: "Idéologie impériale du Kokutai"
 nd_ymp_kokutai_ideology_desc: "La doctrine de l'essence nationale : la lignée impériale est la source de l'identité japonaise, et le corps impérial absorbe en lui les sujets coréens et chinois."

 nd_ymp_imperial_censorate: "Censure impériale"
 nd_ymp_imperial_censorate_desc: "Des censeurs de type Ming, mais composés d'érudits formés par des samouraïs et répondant à Edo, contrôlent chaque gouverneur continental pour corruption et déloyauté."

 nd_ymp_pacific_command: "Commandement maritime du Pacifique"
 nd_ymp_pacific_command_desc: "La marine impériale, qui n'est plus une flotte de défense côtière, exerce le commandement des eaux bleues depuis Hokkaido jusqu'à la mer de Chine méridionale."

 nd_ymp_population_integration: "Intégration de la population continentale"
 nd_ymp_population_integration_desc: "Les sujets coréens et chinois sont progressivement assimilés à la citoyenneté impériale. L’empire est un seul corps de sujets, par la loi et par l’idéologie."

 nd_ymp_han_state_building: "Bâtiment de l'État Han"
 nd_ymp_han_state_building_desc: "Les han continentaux, calqués sur le système han des îles d'origine mais beaucoup plus vastes, sont systématiquement développés. Routes, marchés, écoles, greniers."

 nd_ymp_imperial_workshops: "Ateliers Impériaux"
 nd_ymp_imperial_workshops_desc: "Les fours à soie et à porcelaine impériaux absorbent les techniques coréennes et Ming. Les produits monopolistiques de l’empire surpassent tous ses rivaux asiatiques."

 nd_ymp_sankin_kotai_continentalized: "Sankin-kotai continental"
 nd_ymp_sankin_kotai_continentalized_desc: "Les Daimyo de Corée et de Mandchourie fréquentent Edo selon le même horaire de fréquentation alternative que les seigneurs de l'île d'origine. L'empire est lié par le voyage."

 nd_ymp_early_meiji_modernization: "Première modernisation industrielle"
 nd_ymp_early_meiji_modernization_desc: "L’empire s’industrialise une génération avant le Japon historique. Les moulins à vapeur, les fonderies et les chantiers navals remplacent les ateliers des daimyos."

 nd_ymp_imperial_army_modernization: "Modernisation de l'armée impériale"
 nd_ymp_imperial_army_modernization_desc: "Des divisions de conscrits sur le modèle européen, entraînées par des officiers samouraïs, déployées sur tout le continent. La plus grande armée permanente d’Asie de l’Est."

 nd_ymp_imperial_navy_modernization: "Modernisation de la Marine Impériale"
 nd_ymp_imperial_navy_modernization_desc: "Cuirassés à vapeur construits à Edo et Yokosuka. Le Pacifique est patrouillé par la flotte la plus moderne à l’est de Suez."

 nd_ymp_pan_asianism: "Pan-asiatisme"
 nd_ymp_pan_asianism_desc: "La doctrine selon laquelle l’Asie de l’Est doit être dirigée par Yamato devient une politique impériale. Les diplomates de Bangkok, Hué, Manille et Lhassa portent le message."

 nd_ymp_continental_rail: "Train continental"
 nd_ymp_continental_rail_desc: "Edo à Hanseong à Pyongyang à Pékin, en fer et à vapeur. Le continent est limité par un réseau ferroviaire impérial unique."

 nd_ymp_imperial_schools: "Écoles impériales"
 nd_ymp_imperial_schools_desc: "L’enseignement public universel propage la doctrine du kokutai, la loyauté impériale et l’alphabétisation standardisée d’Hokkaido au Yangtsé."

 nd_ymp_civilization_mission: "Mission de civilisation Yamato"
 nd_ymp_civilization_mission_desc: "L’empire assume le devoir de civiliser l’Asie de l’Est à sa propre image. Une doctrine qui justifie l’ordre continental à lui-même."

 # === Unit localization ===
 n_nd_ymp_sekibune: "Sékibune"
 n_nd_ymp_sekibune_desc: "Galère de raid Wakou. Léger, rapide, rempli de marines pour les actions d'abordage et les débarquements côtiers."

 a_nd_ymp_yamabushi: "Yamabushi"
 a_nd_ymp_yamabushi_desc: "Moines guerriers ascétiques des monts Hiei et Koyasan. Intrépide dans les combats en montagne, motivé par le zèle religieux."

 n_nd_ymp_imperial_atakebune: "Atakebune impérial"
 n_nd_ymp_imperial_atakebune_desc: "Produit phare de la classe Hideyoshi. Navire-château aux parois hautes, hérissé de canons, construit pour briser les flottes coréennes et chinoises au corps à corps."

 a_nd_ymp_continental_ashigaru: "Ashigaru continental"
 a_nd_ymp_continental_ashigaru_desc: "Infanterie paysanne armée de mousquets entraînée pour les campagnes continentales. Le choc des volées d'arquebuses à portée de Mandchourie."

 n_nd_ymp_imperial_geobukseon: "Géobukseon impérial"
 n_nd_ymp_imperial_geobukseon_desc: "Le bateau-tortue coréen au toit de fer qui a vaincu la première invasion. Maintenant construit dans les chantiers impériaux et arborant l'étendard du chrysanthème."

 a_nd_ymp_imperial_samurai_cavalry: "Cavalerie samouraï impériale"
 a_nd_ymp_imperial_samurai_cavalry_desc: "Bushi adapté au combat dans les steppes mandchoues. Lance, arc et katana sur chair de cheval continentale robuste."

 a_nd_ymp_imperial_musketeers: "Mousquetaires impériaux"
 a_nd_ymp_imperial_musketeers_desc: "Régiments de mousquets professionnels dirigés par des samouraïs. L'infanterie de ligne permanente de l'armée continentale impériale."

 n_nd_ymp_imperial_man_of_war: "Navire de guerre impérial"
 n_nd_ymp_imperial_man_of_war_desc: "Navire de guerre de haute mer de classe Pacifique. Conception de pont de canon lourd adaptée au contrôle maritime à longue portée d'Hokkaido à Macao."

 a_nd_ymp_imperial_conscripts: "Conscrits impériaux"
 a_nd_ymp_imperial_conscripts_desc: "Infanterie de ligne de conscrits moderne, équipée sur le modèle européen et dirigée par des officiers formés par des samouraïs. L'armée de masse de l'industriel impérial Yamato."

 # === Levy localization ===
 levy_nd_ymp_imperial_samurai: "Prélèvement des samouraïs impériaux"
 levy_nd_ymp_imperial_samurai_desc: "Cavalerie Bushi convoquée depuis le han continental. L'épine dorsale montée de l'armée impériale."

 levy_nd_ymp_yamabushi: "Prélèvement Yamabushi"
 levy_nd_ymp_yamabushi_desc: "Guerriers monastiques issus des grandes terres des temples. Militants religieux au service impérial."

 levy_nd_ymp_continental_ashigaru: "Prélèvement continental Ashigaru"
 levy_nd_ymp_continental_ashigaru_desc: "Des conscrits paysans armés de mousquets ont été levés dans les provinces coréennes, mandchoues et chinoises pour des campagnes continentales."

 # === Building localization ===
 nd_ymp_imperial_chancery: "Chancellerie Impériale"
 nd_ymp_imperial_chancery_desc: "Le siège administratif du gouvernement continental du Mikado, calqué sur les précédents Heian-kyo mais doté d'un personnel composé d'érudits-samouraïs formés au Confucianisme."

 nd_ymp_great_pagoda: "Grande Pagode Impériale"
 nd_ymp_great_pagoda_desc: "Complexe bouddhiste Tendai et Shingon à l'échelle impériale. Site de liturgie bouddhique d'État d'Edo à Hanseong en passant par le Yangtsé."

 nd_ymp_continental_castle: "Château continental de Yamashiro"
 nd_ymp_continental_castle_desc: "L'architecture japonaise des châteaux de montagne s'exporte à travers le continent. Donjon en pierre, champs d'arquebuses superposés, garnison permanente."

 nd_ymp_arsenal_foundry: "Fonderie de l'Arsenal Impérial"
 nd_ymp_arsenal_foundry_desc: "Des armes à feu de production de masse issues de la tradition de Tanegashima, adaptées à l'équipement des armées continentales."

 nd_ymp_imperial_dojo: "Dojo Impérial"
 nd_ymp_imperial_dojo_desc: "Académie de formation d'officiers où les samouraïs apprennent l'épée, l'arc, la lance, la calligraphie et les classiques confucéens en tant que discipline martiale et esthétique unique."

 nd_ymp_lacquer_workshop: "Atelier de Laque Impériale"
 nd_ymp_lacquer_workshop_desc: "La tradition des ateliers Wajima et Echizen adaptée à l'exportation impériale. Récipients urushi en couches prisés de Pékin à Lisbonne."

 nd_ymp_atakebune_shipyard: "Chantier naval d'Atakebune"
 nd_ymp_atakebune_shipyard_desc: "Fonderie navale impériale construite pour produire des navires de guerre atakebune, geobukseon et des eaux bleues du Pacifique à l'échelle industrielle."

 nd_ymp_imperial_yamen: "Yamen Impérial"
 nd_ymp_imperial_yamen_desc: "Bureau administratif continental de style Ming, composé d'érudits confucéens formés par des samouraïs. Le visage du bakufu dans les provinces conquises."

 nd_ymp_scholar_samurai_academy: "Académie des érudits-samouraïs"
 nd_ymp_scholar_samurai_academy_desc: "Institution d'examen confucianiste où les étudiants samouraïs se préparent aux examens impériaux. Bushi et bureaucrate ont été formés comme une seule caste."

 nd_ymp_kokutai_shrine: "Sanctuaire impérial de Kokutai"
 nd_ymp_kokutai_shrine_desc: "Sanctuaire d'essence nationale du culte impérial. Site où la théologie kokutai lie les sujets coréens, chinois et japonais au trône du chrysanthème."

 nd_ymp_imperial_arsenal: "Arsenal industriel impérial"
 nd_ymp_imperial_arsenal_desc: "Des usines d'armes de l'ère de la vapeur produisent des armes à feu, des canons et de l'artillerie modernes pour l'armée impériale de conscrits."

 # === Production method localization ===
 nd_ymp_chancery_upkeep: "Entretien de la Chancellerie"
 nd_ymp_chancery_upkeep_desc: "Papier, pierres à encre, meubles laqués, livres. L'appareil administratif du gouvernement impérial."

 nd_ymp_pagoda_devotion: "Dévotion à la pagode"
 nd_ymp_pagoda_devotion_desc: "Sutras copiés sur papier impérial, bougies de cire, encens et bois de construction pour les salles de culte."

 nd_ymp_castle_garrison: "Entretien de la garnison du château"
 nd_ymp_castle_garrison_desc: "Armes, montures, uniformes et provisions pour la garnison permanente du château."


 nd_ymp_tanegashima_production: "Production d'armes à feu à Tanegashima"
 nd_ymp_tanegashima_production_desc: "Le fer, le charbon et le bois alimentent les chaînes de production d'arquebuses à mèche issues des maîtres de Tanegashima."

 nd_ymp_firearms_workshop: "Atelier d'armes à feu modernisé"
 nd_ymp_firearms_workshop_desc: "Fabrication d'armes à feu impériales alimentées au salpêtre, adaptées aux armées continentales."

 nd_ymp_dojo_upkeep: "Entretien du dojo"
 nd_ymp_dojo_upkeep_desc: "Épées polies, fourreaux laqués, robes formelles et manuels de formation. La norme esthétique et martiale des samouraïs impériaux."

 nd_ymp_lacquerware_production: "Production de laque"
 nd_ymp_lacquerware_production_desc: "Urushi superposé sur des récipients en bois, poli en profondeur. La qualité impériale standard d’exportation."

 nd_ymp_export_lacquerware: "Laque d'exportation impériale"
 nd_ymp_export_lacquerware_desc: "Pièces en laque dorée doublées de soie conçues pour les cabinets princiers européens. La plus haute qualité de production de l’atelier impérial."

 nd_ymp_shipyard_upkeep: "Entretien du chantier naval"
 nd_ymp_shipyard_upkeep_desc: "Bois d'œuvre, fournitures navales, goudron et fer pour les chantiers impériaux. Les murs en bois de l'empire sont construits et réparés ici."

 nd_ymp_yamen_upkeep: "Entretien du Yamen"
 nd_ymp_yamen_upkeep_desc: "Registres, registres, meubles laqués et classiques confucianistes. Le coût administratif de la gouvernance d’un empire continental."


 nd_ymp_academy_upkeep: "Entretien de l'Académie"
 nd_ymp_academy_upkeep_desc: "Livres, papier, bureaux laqués et robes de cérémonie pour les cadets érudits-samouraïs."

 nd_ymp_kokutai_rites: "Rites impériaux du Kokutai"
 nd_ymp_kokutai_rites_desc: "Papier impérial, bougies en cire d'abeille, offrandes d'encens et de riz entretiennent le culte impérial continental."

 nd_ymp_imperial_silkworks: "Soierie Impériale"
 nd_ymp_imperial_silkworks_desc: "Raw silk woven and dyed on the court's own looms into ceremonial cloth, worn from Edo to Hanseong to Beijing."
 nd_ymp_imperial_weaving_office: "Imperial Weaving Office"
 nd_ymp_imperial_weaving_office_desc: "The court's weaving office of the Heian age, revived on a continental scale. Korean and Ming weavers work beside the looms of Nishijin, and the brocade is sold under the imperial seal."

 nd_ymp_industrial_cannons: "Production de canons industriels"
 nd_ymp_industrial_cannons_desc: "Le fer fondu au charbon était versé dans des moules d'artillerie modernes. La puissance de feu industrielle de l’empire."

 nd_ymp_state_textbooks: "Manuels d'État impériaux"
 nd_ymp_state_textbooks_desc: "Standardized kokutai-doctrine textbooks, imperial loyalty primers and continental geography, set in lead type and printed for every imperial school."
 nd_ymp_textbook_bureau: "Textbook Bureau"
 nd_ymp_textbook_bureau_desc: "The office of the education ministry that writes, approves and prints every primer used in the empire's schools. One reader for every child from Hokkaido to the Yangtze."

 # ===== BUREAUCRACIES =====
 ymp_tairiku_bakufu_bureaucracy: "Tairiku Bakufu"
 ymp_tairiku_bakufu_bureaucracy_desc: "Le conseil et le système bugyo d'Edo roju, reproduits en tant que chambres secondaires à Hanseong et dans la capitale Ming conquise. L’administration continentale standardisée remplace le gouvernement militaire. La couronne acquiert une portée administrative directe dans tout l’empire ; les daimyo voient leur autonomie clanique limitée par un appareil parallèle ne relevant que de la cour impériale."

 ymp_sankin_kotai_bureaucracy: "Sankin-Kotai continentalisé"
 ymp_sankin_kotai_bureaucracy_desc: "Le système de fréquentation alternative codifié par Iemitsu en 1635 s'étendait à l'ensemble d'un empire s'étendant sur l'archipel et sur le continent. Daimyo de Corée et Liaodong sont présents au siège impérial ; leurs processions continentales enrichissent les postes et drainent les trésors des clans tout en rendant la rébellion coordonnée logistiquement intenable. Les citadins prospèrent le long du réseau post-routier ; la noblesse saigne l'argent dans les voyages cérémoniels."

 ymp_kokudaka_governance_bureaucracy: "Gouvernance de Kokudaka"
 ymp_kokudaka_governance_bureaucracy_desc: "L'évaluation du rendement du riz kokudaka s'étendait des îles d'origine jusqu'à la Corée et le cœur des Ming. Les Daimyo deviennent gouverneurs de provinces continentales, évalués en koku de revenus standardisés, redevables de prélèvements et de corvées proportionnelles à leur rendement évalué. Les nobles saluent la continuité de la gouvernance clanique projetée à l'étranger ; la Couronne troque sa portée fiscale directe contre un réseau gérable de feudataires."

 ymp_sankyo_itchi_bureaucracy: "Sankyo Itchi"
 ymp_sankyo_itchi_bureaucracy_desc: "La Concorde des Trois Enseignements. Le programme intellectuel d’Edo de Suzuki Shosan, Hayashi Razan et Yamazaki Ansai, qui synthétisait le bouddhisme Mahayana, le confucianisme et le shintoïsme en une seule idéologie d’État, est ici promu du projet scientifique à la doctrine impériale. La sangha Mahayana, les académies confucianistes coréennes et les sacerdoces shinto sont liés au sein d’une église impériale unifiée s’étendant sur tout le continent."

 ymp_metsuke_censorate_bureaucracy: "Metsuke Censure"
 ymp_metsuke_censorate_bureaucracy_desc: "Une fusion des inspecteurs metsuke et ometsuke du bakufu avec la censure de Yushitai héritée des Ming conquis. Des samouraïs érudits formés aux classiques confucéens mènent des audits surprises à travers l’empire, relevant directement de la cour impériale. Une classe d'inspecteurs instruits émerge, transcendant les lignes d'autorité des daimyo et ne répondant à aucun clan."

 ymp_suigun_bugyo_bureaucracy: "Suigun Bugyo"
 ymp_suigun_bugyo_bureaucracy_desc: "Le commandement naval unifié synthétise les escadrons phares atakebune de Hideyoshi sous Kuki Yoshitaka avec les amiraux du clan marin suigun de la mer intérieure. Rejetant le sakoku, le bakufu accorde une licence aux anciennes lignées de pirates wakou en tant que corsaires d'État sous des lettres de marque portant le sceau rouge shuinjo. Les villes portuaires de Setouchi, Pusan ​​et du Yangtze deviennent des entrepôts navals."

 # ===== AUTO MODIFIER =====
 AUTO_MODIFIER_NAME_nd_ymp_bureaucracy_authority: "Autorité bureaucratique continentale"
 AUTO_MODIFIER_DESC_nd_ymp_bureaucracy_authority: "Avec la proclamation de l'Empire Yamato, le bakufu acquiert la capacité institutionnelle d'héberger les bureaucraties historiques régissant le royaume continental."

 # ===== DESTINY TREE =====

 # --- Destiny advance names and descriptions ---
 nd_ymp_destiny: "Le trône du chrysanthème couronne un empire"
 nd_ymp_destiny_desc: "L'empire Yamato est proclamé et le Mikado porte la couronne d'une puissance mondiale d'Asie de l'Est. Le bakufu doit maintenant choisir quel genre d’empire il deviendra."

 nd_ymp_dest_liaodong_subjugation: "L'assujettissement du Liaodong"
 nd_ymp_dest_liaodong_subjugation_desc: "Liaoyang et Shenyang doivent tomber. La première étape de l’hégémonie continentale consiste à écraser tout ce qui reste de Mandchourie qui pourrait menacer l’arrière coréen."

 nd_ymp_dest_mongolia_amur: "La steppe et l'Amour"
 nd_ymp_dest_mongolia_amur_desc: "Karakorum, Shangdu and the Amur frontier. The empire pushes past the Great Wall, past the limits of Ming reach, and writes the imperial seal across Mongol grass. Only a standing army can winter on the steppe."

 nd_ymp_dest_continental_empire: "L'empire continental"
 nd_ymp_dest_continental_empire_desc: "Lhasa, Thang Long, Hue, Vijaya. From Tibet to the South China Sea, the chrysanthemum supplants every rival sovereign on the Asian mainland."

 nd_ymp_dest_taiwan_subjugation: "La frontière de Taiwan"
 nd_ymp_dest_taiwan_subjugation_desc: "Formose est la première conquête océanique de l'empire. Le Pacifique commence là où finissent les îles natales, et la flotte impériale doit garder chaque passage vers le sud."

 nd_ymp_dest_manila_hijack: "Le galion de Manille détourné"
 nd_ymp_dest_manila_hijack_desc: "Maynila et Tondo saisis. L'argent d'Acapulco ne traverse plus le Pacifique jusqu'aux coffres espagnols. Les lingots du Nouveau Monde nourrissent désormais Edo, et non Madrid."

 nd_ymp_dest_pacific_thalassocracy: "Thalassocratie du Pacifique"
 nd_ymp_dest_pacific_thalassocracy_desc: "Hawaï, les Mariannes, le Kamtchatka. L'étendard du chrysanthème flotte sur toutes les rives du Pacifique, et le plus grand océan du monde est un lac impérial."

 # --- Destiny event titles, descriptions, and option text ---
 nd_ymp.8.t: "Le trône du chrysanthème couronne un empire"
 nd_ymp.8.d: "Le Mikado, libéré de sa captivité rituelle, monte sur un trône continental. Le kiku-no-gomon survole Edo, Hanseong et le Yangtze. Pourtant, un empire couronné n’est pas encore une destinée. Le bakufu doit choisir où dépenser le prochain siècle d’énergie impériale : vers l’ouest à travers le continent, ou vers l’est à travers le Pacifique. L’une ou l’autre voie définira l’empire Yamato pour toujours."
 nd_ymp.8.a: "Le destin de l'empire commence"

 nd_ymp.9.t: "Liaodong soumis"
 nd_ymp.9.d: "Liaoyang et Shenyang se soumettent. La porte mandchoue est scellée sous la garnison impériale. L’arrière coréen et la ligne de ravitaillement japonaise sont désormais à l’abri de toute revanche nordiste. Le corps des officiers samouraïs fait sa première expérience de gouvernement direct d'une province continentale, avec des samouraïs érudits formés au confucianisme remplissant les yamen et dressant des régiments impériaux derrière leurs murs."
 nd_ymp.9.a: "En route vers la steppe"

 nd_ymp.10.t: "Karakorum et l'Amour"
 nd_ymp.10.d: "La cavalerie mongole ne fait plus de raids ; ils chevauchent sous les bannières impériales. L'ancienne capitale Yuan à Karakorum, le bassin de l'Amour détenu par les Toungouses et les éclaireurs russes, le couloir qui les sépare tous tombent aux mains des expéditions impériales. L’empire s’étend plus au nord et à l’ouest qu’aucun souverain japonais n’a jamais osé. La question est de savoir s’il faut absorber les peuples des steppes en tant qu’auxiliaires de cavalerie, ou se concentrer sur les lignes de ravitaillement qui maintiennent la cohésion d’une armée continentale."
 nd_ymp.10.a: "Enrôlez les seigneurs des steppes comme maréchaux impériaux"
 nd_ymp.10.b: "Construire le réseau d’approvisionnement de l’Amour"

 nd_ymp.11.t: "L'empire continental"
 nd_ymp.11.d: "Lhassa livre le Dalaï Lama à la protection impériale. Thang Long et Hue reconnaissent le chrysanthème comme suzerain de tout le Vietnam. L’empire s’étend désormais sur toutes les grandes civilisations asiatiques : japonaise, coréenne, han, mandchoue, mongole, tibétaine, vietnamienne. Le bakufu doit maintenant exprimer ce qui les unit. Le mandat impérial comme légitimité cosmique, ou les légions permanentes qui détiennent chaque capitale continentale."
 nd_ymp.11.a: "Proclamer le mandat de Yamato sur toute l'Asie"
 nd_ymp.11.b: "Les légions continentales sont la colonne vertébrale de l'empire"

 nd_ymp.12.t: "Taiwan devient impériale"
 nd_ymp.12.d: "Les peuples Paiwan et Siraya se soumettent au drapeau impérial. Les détroits des Pescadores et de Taiwan sont des eaux impériales. Depuis Edo, la chaîne Ryukyu et maintenant Formose, l'empire forme un arc continu à travers le Pacifique occidental. La marine impériale a sa première base en eaux profondes au sud des îles d'origine, et les Espagnols de Manille commencent à repenser leur emprise sur l'archipel."
 nd_ymp.12.a: "Au sud des Philippines"

 nd_ymp.13.t: "Le galion de Manille est à nous"
 nd_ymp.13.d: "Maynila et Tondo tombent face à une flotte combinée de raiders atakebune, geobukseon et sekibune. Les galions espagnols qui échangent l'argent d'Acapulco contre la soie de Manille sont à la merci de l'empire. Le bakufu doit décider : rediriger le flux d'argent vers les coffres impériaux et faire du commerce via Edo, ou accorder les îles Philippines aux vassaux impériaux dans le cadre d'un système de protectorats tributaires."
 nd_ymp.13.a: "Monopole impérial sur le commerce des galions"
 nd_ymp.13.b: "Protectorats d'archipel sous les vice-rois daimyo"

 nd_ymp.14.t: "Le Pacifique est Yamato"
 nd_ymp.14.d: "Les chefs hawaïens jurent la vassalité. Les îles Mariannes cultivent le chrysanthème. Les navires impériaux font escale au Kamtchatka et à Petropavlovsk, refusant à jamais le Pacifique russe aux Romanov. L'océan Pacifique n'est plus espagnol, ni anglais, ni européen ; c'est le lac impérial de Yamato. La dernière tâche du bakufu est de choisir comment gouverner cet empire océanique."
 nd_ymp.14.a: "Patrouillez sur toutes les voies maritimes : la domination des eaux bleues"
 nd_ymp.14.b: "Couronner une civilisation du Pacifique sous le chrysanthème"

 # --- Variable tooltip alias for path_b (unused destiny branch) is reused above ---

 # --- Destiny timed modifier names and descriptions ---
 STATIC_MODIFIER_NAME_nd_ymp_dest_steppe_marshals: "Maréchaux des steppes"
 STATIC_MODIFIER_DESC_nd_ymp_dest_steppe_marshals: "Les khans mongols servent de maréchaux de cavalerie impériale. Les chevaux des steppes approvisionnent les écuries impériales. La cavalerie auxiliaire de l'empire parcourt la steppe comme s'il s'agissait de Honshu."

 STATIC_MODIFIER_NAME_nd_ymp_dest_amur_logistics: "Logistique frontalière de l'Amour"
 STATIC_MODIFIER_DESC_nd_ymp_dest_amur_logistics: "Des chaînes de dépôts impériaux partent de Pusan ​​jusqu'au Yalu et jusqu'à l'Amour. L'armée continentale ne meurt jamais de faim ; l'argent de l'empire brûle pour financer les greniers."

 STATIC_MODIFIER_NAME_nd_ymp_dest_mandate_of_yamato: "Le mandat de Yamato"
 STATIC_MODIFIER_DESC_nd_ymp_dest_mandate_of_yamato: "The chrysanthemum throne claims cosmic legitimacy over all East Asia. Wars of imperial mandate are easy to declare and easier to settle. The court grows complacent in its own supremacy, and spends accordingly."

 STATIC_MODIFIER_NAME_nd_ymp_dest_continental_legion: "La Légion Continentale"
 STATIC_MODIFIER_DESC_nd_ymp_dest_continental_legion: "Des régiments impériaux permanents détiennent toutes les capitales continentales. Les conscrits et les épées sous contrat servent à la solde impériale. Le trésor saigne pour ce privilège."

 STATIC_MODIFIER_NAME_nd_ymp_dest_galleon_traffic: "Info trafic Galleon"
 STATIC_MODIFIER_DESC_nd_ymp_dest_galleon_traffic: "L'argent d'Acapulco, la soie de Manille et les laques d'Edo se déplacent tous sous des fonds impériaux. Le commerce du Pacifique est un monopole impérial et les diplomates impériaux sont présents partout où il touche."

 STATIC_MODIFIER_NAME_nd_ymp_dest_archipelago_protectorates: "Protectorats de l'archipel"
 STATIC_MODIFIER_DESC_nd_ymp_dest_archipelago_protectorates: "Les vassaux des Philippines, de Bornéo et des Moluques administrent leurs îles à leurs propres frais. Les boulons de tissu impériaux alimentent le commerce des épices. L’empire tourne son regard vers l’extérieur, au-delà des mers."

 STATIC_MODIFIER_NAME_nd_ymp_dest_blue_water_dominion: "Domination des Eaux Bleues"
 STATIC_MODIFIER_DESC_nd_ymp_dest_blue_water_dominion: "Le bois d'œuvre et les magasins navals du Pacifique maintiennent la flotte impériale en patrouille d'Hokkaido à Hawaï. Les guerres contre les incroyants à travers l’océan tournent en faveur de l’empire."

 STATIC_MODIFIER_NAME_nd_ymp_dest_chrysanthemum_pacific: "Chrysanthème Pacifique"
 STATIC_MODIFIER_DESC_nd_ymp_dest_chrysanthemum_pacific: "Imperial paper and fine cloth dress every Pacific court that swears to the chrysanthemum. Patronage flows out from the throne, and Hawaiian, Polynesian, and Marianan vassals keep faith with the house that clothes them."

 # --- Destiny building names and descriptions ---
 nd_ymp_continental_garrison_command: "Commandement de la garnison continentale impériale"
 nd_ymp_continental_garrison_command_desc: "Forteresse impériale permanente et commandement opérationnel de l'armée continentale. Construit uniquement au cœur de l'empire continental, il dirige les garnisons de Lhassa à Hué jusqu'à l'Amour."

 nd_ymp_pacific_naval_command: "Commandement naval du Pacifique"
 nd_ymp_pacific_naval_command_desc: "Quartier général naval impérial en eaux profondes. Coordonne les flottes de patrouille du Pacifique, les convois de galions de Manille et les stations hawaïennes et mariannes sous un seul drapeau impérial."

 # --- Destiny production method localization ---
 nd_ymp_dest_garrison_command_upkeep: "Entretien de la garnison continentale"
 nd_ymp_dest_garrison_command_upkeep_desc: "Armes, armes à feu, chevaux, uniformes et rations de riz pour les régiments impériaux permanents détenant chaque capitale continentale."

 nd_ymp_dest_pacific_command_upkeep: "Entretien du Commandement naval du Pacifique"
 nd_ymp_dest_pacific_command_upkeep_desc: "Les provisions navales, le bois, le goudron, les armes et le poisson salé répondent aux besoins incessants de la patrouille du Pacifique."
