l_french:
 STATIC_MODIFIER_NAME_nd_blut_und_eisen: "Du sang et du fer"
 STATIC_MODIFIER_DESC_nd_blut_und_eisen: "La nation allemande s’est construite non pas par des discours et des votes majoritaires, mais par le fer et le sang. Nos armées marchent avec une discipline inébranlable et nos forges brûlent jour et nuit pour armer la force militaire la plus puissante d’Europe."
 STATIC_MODIFIER_NAME_nd_zollverein_legacy: "L'héritage du Zollverein"
 STATIC_MODIFIER_DESC_nd_zollverein_legacy: "Avant l’existence d’un État allemand, il existait un marché allemand. L’union douanière qui unissait économiquement les terres allemandes alimente désormais un empire d’industrie, d’érudition et d’influence diplomatique qui façonne le continent."
 nd_ger.1.t: "L'unification de l'Allemagne"
 nd_ger.1.d: "The dream of centuries has been realized. From the fractured mosaic of principalities, free cities, and kingdoms, a single German state has emerged, an empire that speaks with one voice and commands the respect of all Europe. The question now is not whether Germany will be great, but what kind of greatness it will pursue. Will this new empire be built on the strength of its armies, its drill fields echoing with the cadence that once shook the continent? Or will it be the triumph of industry and commerce, the Zollverein's vision fulfilled, a nation bound by rail, trade, and the relentless march of progress?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ger.1.a: "C'est par le sang et le fer que l'Allemagne perdurera."
 nd_ger.1.b: "Le commerce et l'industrie seront notre fondement."
 nd_ger.2.t: "La Réforme"
 nd_ger.2.d: "Le clouage de quatre-vingt-quinze thèses sur la porte d’une église de Wittenberg a ébranlé les fondements de la chrétienté. Le défi lancé par Martin Luther à l'autorité papale, amplifié par les presses à imprimer qui sont elles-mêmes une invention allemande, a déclenché une révolution confessionnelle qui divise les terres allemandes entre l'ancienne foi et la nouvelle. Les princes choisissent leur camp non seulement par conviction mais par calcul, la Réforme offre l'affranchissement de l'impôt romain et l'affirmation de la souveraineté territoriale. Comment l’Allemagne va-t-elle gérer ce bouleversement ?"
 nd_ger.2.a: "Tenez bon dans notre confession, une seule foi, un seul peuple."
 nd_ger.2.b: "Cuius regio, eius religio. Le pragmatisme préserve la paix."
 nd_ger.3.t: "La paix de Westphalie"
 nd_ger.3.d: "Après trente ans de la guerre la plus dévastatrice que l'Europe ait jamais connue, une guerre qui a tué peut-être un tiers de la population allemande, les puissances épuisées se sont rassemblées à Osnabruck et à Munster pour forger un nouvel ordre. Les traités de Westphalie établissent des principes qui vont remodeler le monde : la souveraineté des États, le droit des dirigeants à déterminer la religion de leur territoire et l'équilibre des pouvoirs comme fondement des relations internationales. L’Allemagne en sort marquée mais avec un nouveau cadre de coexistence."
 nd_ger.3.a: "La souveraineté est sacrée. Aucun pouvoir ne peut dicter ses ordres à un autre."
 nd_ger.3.b: "L’équilibre et la diplomatie empêcheront la prochaine catastrophe."
 nd_ger.4.t: "La révolution Gutenberg"
 nd_ger.4.d: "L'invention par Johannes Gutenberg de l'imprimerie à caractères mobiles à Mayence vers 1440 a déclenché une révolution plus profonde que n'importe quelle bataille. Ce qui prenait autrefois des années à un moine pour copier à la main peut désormais être produit à des centaines d'exemplaires en quelques semaines. Les idées se répandent comme une traînée de poudre à travers les terres allemandes et au-delà, des ouvrages savants, des textes religieux, des pamphlets politiques et des traités scientifiques jaillissent des presses de Mayence, Strasbourg, Nuremberg et Augsbourg. Le monopole du savoir détenu par l’Église et l’élite est brisé à jamais. L’Allemagne est au centre de cette transformation, ses imprimeurs façonnant la vie intellectuelle de tout un continent."
 nd_ger.4.a: "La presse sera l'épée de l'esprit."
 nd_ger.5.t: "Le Zollverein"
 nd_ger.5.d: "L’union douanière allemande, le Zollverein, a réalisé grâce au commerce ce que la diplomatie et la guerre n’ont pas pu réaliser : l’unification pratique des territoires allemands. En commençant par les réformes douanières de la Prusse et en absorbant progressivement les États, le Zollverein a démoli des centaines de barrières tarifaires intérieures, créé un marché unifié de millions de personnes et posé les rails de fer qui lient l'économie allemande en un seul moteur de production. Des usines se développent le long du Rhin et de la Ruhr, les commerçants commercent librement de Hambourg à Munich et l'ancienne mosaïque de petits péages cède la place à l'économie moderne."
 nd_ger.5.a: "Intégration par le commerce. Que l’union douanière s’approfondisse."
 nd_ger.5.b: "Investissez dans l’industrie. Les usines seront notre force."
 STATIC_MODIFIER_NAME_nd_ger_confessional_conviction: "Conviction confessionnelle"
 STATIC_MODIFIER_DESC_nd_ger_confessional_conviction: "L’Allemagne est unie dans la foi, tirant la force de son identité religieuse pour construire une société plus cohésive."
 STATIC_MODIFIER_NAME_nd_ger_cuius_regio: "Cuius Regio, Eius Religio"
 STATIC_MODIFIER_DESC_nd_ger_cuius_regio: "L’acceptation pragmatique de la diversité confessionnelle a apporté la stabilité aux terres allemandes, permettant au commerce et à la diplomatie de prospérer là où la guerre de religion menaçait autrefois."
 STATIC_MODIFIER_NAME_nd_ger_westphalian_sovereignty: "Souveraineté westphalienne"
 STATIC_MODIFIER_DESC_nd_ger_westphalian_sovereignty: "Le principe de souveraineté de l'État, né des cendres de la guerre de Trente Ans, confère à l'Allemagne une autorité diplomatique et une cohésion interne que ses rivaux lui envient."
 STATIC_MODIFIER_NAME_nd_ger_westphalian_balance: "Equilibre westphalien"
 STATIC_MODIFIER_DESC_nd_ger_westphalian_balance: "L’Allemagne a adopté le rôle d’arbitre dans les affaires européennes, tirant parti de sa position centrale et de son expertise diplomatique pour maintenir l’équilibre des pouvoirs."
 STATIC_MODIFIER_NAME_nd_ger_customs_integration: "Intégration douanière"
 STATIC_MODIFIER_DESC_nd_ger_customs_integration: "Le démantèlement des barrières tarifaires intérieures a créé un vaste marché unifié, stimulant le commerce et la prospérité sur l’ensemble du territoire allemand."
 STATIC_MODIFIER_NAME_nd_ger_industrial_investment: "Investissement industriel"
 STATIC_MODIFIER_DESC_nd_ger_industrial_investment: "Des investissements massifs dans les usines, les chemins de fer et les infrastructures ont transformé l’Allemagne en une puissance industrielle."
 nd_ger_guild_heritage: "Héritage de guilde"
 nd_ger_guild_heritage_desc: "Le système complexe de guildes artisanales qui gouvernaient les villes allemandes établissait des normes de qualité, protégeait les artisans et créait les institutions civiques qui définiraient la vie urbaine allemande pendant des siècles."
 nd_ger_mining_tradition: "Tradition minière"
 nd_ger_mining_tradition_desc: "Les mines d'argent des montagnes du Harz et de l'Erzgebirge ont alimenté le commerce allemand et attiré des mineurs, des ingénieurs et des métallurgistes dont l'expertise a transformé la région en le cœur minier de l'Europe."
 nd_ger_reichstag_tradition: "Tradition du Reichstag"
 nd_ger_reichstag_tradition_desc: "La Diète impériale, rassemblant des princes, des évêques et des représentants des villes libres, a établi une tradition de négociation et de compromis qui a façonné la culture politique allemande."
 nd_ger_hanseatic_roots: "Racines hanséatiques"
 nd_ger_hanseatic_roots_desc: "La Ligue hanséatique reliait les marchands allemands de Lübeck à Novgorod, établissant des postes de traite et des réseaux commerciaux qui dominèrent le commerce de l'Europe du Nord pendant des siècles."
 nd_ger_minnesang: "Tradition du Minnesang"
 nd_ger_minnesang_desc: "La poésie d'amour courtoise du Minnesanger, de Walther von der Vogelweide, de Wolfram von Eschenbach et de leurs pairs a établi une tradition littéraire allemande qui rivalisait avec les troubadours de France."
 nd_ger_gutenberg_press: "Presse Gutenberg"
 nd_ger_gutenberg_press_desc: "L'imprimerie à caractères mobiles de Johannes Gutenberg, développée à Mayence vers 1440, a lancé une révolution dans la diffusion des connaissances qui a remodelé la civilisation européenne."
 nd_ger_universitat_tradition: "Tradition universitaire"
 nd_ger_universitat_tradition_desc: "La création d’universités à Heidelberg, Leipzig, Cologne et Erfurt a créé des centres d’apprentissage qui ont attiré des universitaires de toute l’Europe et ont jeté les bases du leadership intellectuel allemand."
 nd_ger_imperial_banking: "Banque Impériale"
 nd_ger_imperial_banking_desc: "The Fugger and Welser banking houses of Augsburg financed emperors, popes, and colonial ventures, making southern Germany the financial capital of Europe in the Renaissance era. Their fortune was smelted before it was lent: at the Saiger works silver was parted from copper ore with lead, and the Fuggers held the trade in both metals.\n\n#italic Available in: $nd_ger_bergwerk$#!"
 nd_ger_civic_tradition: "Autonomie civique"
 nd_ger_civic_tradition_desc: "The tradition of self-governing free imperial cities (Nuremberg, Augsburg, Hamburg, Frankfurt) created spaces of burgher independence, commercial innovation, and civic pride unique to the German political landscape. A free city brewed and sold drink by its own right, and the cellar under the town hall paid for the hall.\n\n#italic Available in: $nd_ger_rathaus$#!"
 nd_ger_meistersinger: "Guildes des Maîtres Chanteurs"
 nd_ger_meistersinger_desc: "Les guildes des Meistersinger de Nuremberg, d'Augsbourg et d'autres villes allemandes ont organisé l'art du chant en un métier discipliné, préservant et faisant progresser les traditions culturelles allemandes grâce à une composition compétitive."
 nd_ger_reformation_crucible: "Creuset de la Réforme"
 nd_ger_reformation_crucible_desc: "The Protestant Reformation, ignited by Martin Luther's challenge to papal authority in 1517, was born on German soil and forever transformed the relationship between faith, politics, and individual conscience in the Western world. Its weapon was the press: cheap pamphlets, the Flugschriften, carried the quarrel into every market town.\n\n#italic Available in: $nd_ger_druckerei$#!"
 nd_ger_arms_manufacture: "Fabrication d'armes"
 nd_ger_arms_manufacture_desc: "Les armuriers et forgerons d'armes allemands, en particulier dans des centres comme Nuremberg, Augsbourg et Solingen, produisaient certaines des meilleures armes et armures d'Europe, approvisionnant les armées et les princes de tout le continent."
 nd_ger_schwarze_reiter_tradition: "Tradition Schwarze Reiter"
 nd_ger_schwarze_reiter_tradition_desc: "Les Black Riders ont révolutionné la guerre de cavalerie en faisant du pistolet leur arme principale, en utilisant la formation caracole pour lancer des volées dévastatrices avant de charger chez eux l'épée à la main."
 nd_ger_silver_rush: "Ruée vers l'argent en Allemagne"
 nd_ger_silver_rush_desc: "The exploitation of rich silver deposits in the Erzgebirge and Harz Mountains created a torrent of precious metal that funded German princes, powered the mint cities, and attracted mining expertise from across Europe.\n\n#italic Available in: $nd_ger_bergwerk$#!"
 nd_ger_territorial_admin: "Administration territoriale"
 nd_ger_territorial_admin_desc: "Le développement de bureaucraties territoriales professionnelles dans les États allemands, dotées de fonctionnaires qualifiés, d’une tenue systématique des registres et d’une loi codifiée, a créé certaines des administrations les plus efficaces du début de l’Europe moderne."
 nd_ger_westphalian_order: "Ordre westphalien"
 nd_ger_westphalian_order_desc: "La Paix de Westphalie en 1648 a mis fin à la guerre de Trente Ans et a établi les principes fondamentaux des relations internationales modernes : la souveraineté des États, la non-ingérence et l'équilibre des pouvoirs."
 nd_ger_confessional_state: "État confessionnel"
 nd_ger_confessional_state_desc: "L’intégration de l’autorité religieuse dans la gouvernance de l’État, qu’il soit protestant ou catholique, a créé un modèle allemand distinctif de politique confessionnelle qui a façonné la société, l’éducation et la culture pendant des siècles."
 nd_ger_drill_tradition: "Tradition des exercices militaires"
 nd_ger_drill_tradition_desc: "Les innovations systématiques en matière d'exercices mises au point par Léopold d'Anhalt-Dessau, la baguette de fer, la marche à pas serré et les procédures de chargement standardisées, ont transformé l'infanterie allemande en soldats les plus disciplinés d'Europe."
 nd_ger_solingen_forges: "Forges de Solingen"
 nd_ger_solingen_forges_desc: "The blade-smiths of Solingen and the gunsmiths of Suhl produced weapons of legendary quality, making Germany the armory of Europe and establishing an industrial tradition that endures to this day.\n\n#italic Available in: $nd_ger_waffenschmiede$#!"
 nd_ger_cameralism: "Administration de la liste des caméras"
 nd_ger_cameralism_desc: "Le caméralisme, la science allemande des finances et de l’administration de l’État, a formé des générations de fonctionnaires à la collecte systématique des recettes, à la gestion économique et à l’organisation rationnelle de l’État."
 nd_ger_jaeger_corps: "Schützen Companies"
 nd_ger_jaeger_corps_desc: "Every German town kept a shooting guild, and its best shots carried rifled pieces of their own. The states drew picked marksmen from them, the Schützen, who fought in open order ahead of the line as skirmishers and sharpshooters."
 nd_ger_feldartillerie_advance: "Deutsche Feldartillerie"
 nd_ger_feldartillerie_advance_desc: "Les écoles d'artillerie allemandes, s'appuyant sur des siècles d'expertise métallurgique, produisaient des canons de campagne d'une portée et d'une précision exceptionnelles qui se révéleraient décisives sur les champs de bataille d'Europe."
 nd_ger_aufklarung: "Déclaration"
 nd_ger_aufklarung_desc: "Les Lumières allemandes, l’Aufklarung, ont produit Kant, Lessing et Goethe et ont défendu la raison, l’éducation et la réforme de la gouvernance. Son impact sur les universités, l’administration et la culture allemandes a été transformateur."
 nd_ger_prussian_bureaucracy: "Modèle bureaucratique prussien"
 nd_ger_prussian_bureaucracy_desc: "La fonction publique prussienne, avec ses examens rigoureux, sa formation systématique et son efficacité incorruptible, est devenue le modèle de bureaucratie moderne que les États de toute l’Europe cherchaient à imiter."
 nd_ger_standing_army: "Doctrine de l'Armée permanente"
 nd_ger_standing_army_desc: "The transition from unreliable mercenary bands to permanent, professionally trained standing armies gave German states the military foundation for sustained campaigns and effective defense. In Prussia the canton regulation of 1733 gave every regiment a district of its own, whose enrolled men drilled with it each spring and went home to the plough."
 nd_ger_landwehr_system: "Système Landwehr"
 nd_ger_landwehr_system_desc: "La Landwehr, créée pendant les guerres de libération contre Napoléon, a créé une milice citoyenne combinant ferveur patriotique et entraînement militaire, augmentant ainsi considérablement la main-d’œuvre disponible de l’État allemand."
 nd_ger_zollverein: "Zollverein"
 nd_ger_zollverein_desc: "L’union douanière allemande, le Zollverein, a éliminé des centaines de barrières tarifaires internes et a créé un espace économique unifié qui a rendu l’unification allemande non seulement envisageable mais inévitable."
 nd_ger_industrialization: "Industrialisation allemande"
 nd_ger_industrialization_desc: "The transformation of the Rhineland, Ruhr, and Silesia into industrial powerhouses, with coal mines, steel mills, and railway networks, propelled Germany from an agricultural patchwork into a modern industrial economy.\n\n#italic Available in: $nd_ger_bergwerk$#!"
 nd_ger_humboldtian_education: "Éducation humboldtienne"
 nd_ger_humboldtian_education_desc: "La réforme universitaire de Wilhelm von Humboldt, unissant la recherche et l'enseignement, mettant l'accent sur la liberté académique et valorisant la Bildung plutôt que la simple formation professionnelle, a créé le modèle d'université de recherche moderne adopté dans le monde entier."
 nd_ger_realpolitik: "Realpolitique"
 nd_ger_realpolitik_desc: "L’approche pragmatique et axée sur les intérêts de la politique étrangère associée à Bismarck, où la diplomatie était au service du pouvoir, les alliances étaient des outils et l’idéalisme cédait à l’avantage calculé, a remodelé la politique européenne."
 a_nd_ger_schwarze_reiter: "Schwarze Reiter"
 a_nd_ger_schwarze_reiter_desc: "Les Black Riders sont une cavalerie de pistolets lourdement blindée qui emploie la formation caracole, avançant en rangs pour lancer des volées de pistolets avant de s'éloigner pour recharger. Leurs armures noircies et leurs volées tonitruantes terrorisent les formations ennemies."
 a_nd_ger_jaeger: "Schützen"
 a_nd_ger_jaeger_desc: "Picked marksmen with rifled pieces, drawn from the shooting guilds of the towns. They fight in open order ahead of the line and work round a flank, and their aimed fire kills at a range a musket cannot answer. A rifle is slow to load and carries no bayonet, so they lose men fast when caught in the open."
 a_nd_ger_landwehr: "Landwehr"
 a_nd_ger_landwehr_desc: "Les Landwehr sont des citoyens-soldats issus de la population générale, formés aux exercices militaires de base et armés par l’État. Ce qui leur manque en termes de professionnalisme, ils le compensent par leur nombre et leur détermination patriotique."
 a_nd_ger_feldartillerie: "Deutsche Feldartillerie"
 a_nd_ger_feldartillerie_desc: "Les batteries d'artillerie de campagne allemandes, bénéficiant de siècles d'expertise métallurgique et d'un entraînement systématique au tir, délivrent des bombardements dévastateurs avec une précision et une portée exceptionnelles."
 nd_ger_bergwerk: "Travaux de montagne"
 nd_ger_bergwerk_desc: "Un complexe minier allemand exploitant les riches gisements minéraux d’Europe centrale. Des mineurs et des ingénieurs qualifiés extraient l'argent, le cuivre et le fer à l'aide de techniques avancées développées dans le Harz et l'Erzgebirge."
 nd_ger_rathaus: "Hôtel de ville"
 nd_ger_rathaus_desc: "L'hôtel de ville, siège de l'autonomie bourgeoise et symbole de la fierté civique allemande. Ici se réunit le conseil municipal, la justice est rendue et la vie commerciale de la ville est réglée."
 nd_ger_druckerei: "Druckerei"
 nd_ger_druckerei_desc: "Une imprimerie suivant la tradition de Gutenberg, produisant des livres, des brochures et des ouvrages scientifiques qui diffusent les connaissances et l'alphabétisation à travers les terres allemandes et au-delà."
 nd_ger_waffenschmiede: "Waffenschmiede"
 nd_ger_waffenschmiede_desc: "Une fonderie d'armes allemande où des maîtres forgerons forgent des armes, des armures et des armes à feu de qualité réputée. La tradition des lames Solingen et des mousquets Suhl approvisionne les armées de toute l'Europe."
 nd_ger_universitat: "Université"
 nd_ger_universitat_desc: "Une université de recherche allemande dans la tradition d'Heidelberg et de Leipzig, où les chercheurs font progresser les connaissances grâce à une enquête systématique et où les étudiants reçoivent une Bildung qui façonne l'esprit autant qu'elle le remplit."
 nd_ger_bergwerk_maintenance: "Extraction du fer"
 nd_ger_bergwerk_maintenance_desc: "Les mineurs extraient le minerai de fer des puits profonds des districts miniers allemands, en utilisant des supports en bois et des outils spécialisés pour exploiter les riches veines du Harz et de l'Erzgebirge."
 nd_ger_rathaus_maintenance: "Administration civique"
 nd_ger_rathaus_maintenance_desc: "Les salles du conseil en pierre, en papier et meublées étaient nécessaires au maintien des fonctions administratives et civiques d'une mairie allemande."
 nd_ger_druckerei_maintenance: "Opérations d'impression"
 nd_ger_druckerei_maintenance_desc: "Le papier et l'encre sont transformés en livres imprimés, en brochures et en ouvrages scientifiques par des compositeurs qualifiés travaillant sur les presses des imprimeries allemandes."
 nd_ger_waffenschmiede_maintenance: "Production d'armes"
 nd_ger_waffenschmiede_maintenance_desc: "Le fer est fondu et forgé en armes à l'aide de fours au charbon de bois, produisant des lames et des armures d'un solide savoir-faire allemand."
 nd_ger_universitat_maintenance: "Opérations académiques"
 nd_ger_universitat_maintenance_desc: "Le papier, les livres et les instruments en verre nécessaires à la mission de recherche et d'enseignement d'une université allemande."
 nd_ger_silver_processing: "Traitement de l'argent"
 nd_ger_silver_processing_desc: "Le minerai d'argent est extrait de la matrice rocheuse et raffiné en lingots commercialisables, à l'aide de techniques perfectionnées dans les districts miniers de Saxe et du Harz."
 nd_ger_arms_forging: "Forgeage d'armes"
 nd_ger_arms_forging_desc: "Les maîtres armuriers forgent le fer et le cuivre pour fabriquer des armes d'une qualité exceptionnelle, les lames de Solingen et les canons de mousquet de Suhl qui équipent les meilleures armées d'Europe."
 nd_ger_brewing: "Council Brewhouse"
 nd_ger_brewing_desc: "Beer is brewed in the council's own house and sold from the cellar under the hall. Grain, firewood and cooper's tools are consumed, and the proceeds keep the town hall."
 nd_ger_saigerhuette: "Saigerhütte"
 nd_ger_saigerhuette_desc: "Silver-bearing copper is melted together with lead. The lead draws the silver out of the copper and is then burned off, leaving refined silver behind."
 nd_ger_flugschriften: "Flugschriften"
 nd_ger_flugschriften_desc: "Pamphlets of a few leaves, set in lead type and sold unbound and uncoloured for the price of a meal. A press turns out far more of them than of bound books."
 nd_ger_kokshochofen: "Kokshochofen"
 nd_ger_kokshochofen_desc: "A blast furnace fired with coke instead of charcoal. The first on the continent was blown in at Gleiwitz in 1796, and the furnaces of the Ruhr followed from 1849."
 a_nd_ger_kantonisten: "Kantonisten"
 a_nd_ger_kantonisten_desc: "Men enrolled from boyhood in the canton of their regiment. They drill with it for two months each spring and spend the rest of the year on their farms: steady under fire, slow into action."
 levy_nd_ger_kantonisten: "Kantonisten"
 levy_nd_ger_kantonisten_desc: "The enrolled men of a regiment's canton, called to the colours from their villages."
 levy_nd_ger_landwehr: "Milice de la Landwehr"
 levy_nd_ger_landwehr_desc: "Citoyens-soldats de la Landwehr, appelés parmi la population pour défendre la patrie en cas de besoin."
 nd_ger_formed_tt: "L'Allemagne est formée"
 nd_ger_path_a_tt: "Choisissez le destin#bold Sang et Fer#!"
 nd_ger_path_b_tt: "Choisissez l'héritage#bold du destin Zollverein#!"
 nd_ger_destiny: "La question allemande"
 nd_ger_destiny_desc: "L'Allemagne a été unifiée, mais la question de savoir ce qu'elle deviendra reste sans réponse. Ce nouvel empire poursuivra-t-il l’hégémonie militaire sur le continent, ou construira-t-il un colosse économique qui remodèlera le commerce européen ?"
 nd_ger.6.t: "La question allemande"
 nd_ger.6.d: "L'unification de l'Allemagne a résolu une question mais en a soulevé une plus grande. Une nation d’une telle force, d’une telle population et d’une telle position centrale ne peut tout simplement pas exister ; il doit choisir une direction. Les armées qui ont forgé cet État sont prêtes, et les usines qui les ont armés bourdonnent de potentiel. Que deviendra l’Allemagne ?"
 nd_ger.6.a: "L'Allemagne trouvera son destin."
 nd_ger.7.t: "Les guerres d'unification"
 nd_ger.7.d: "Les canons ont parlé et les cartes redessinées. Les armées allemandes ont marché vers l'est jusqu'à la Vistule et vers l'ouest jusqu'à la Moselle, s'emparant des forteresses et des ports qui sécurisent les frontières du Reich. Le corps des officiers revient triomphant, forgé dans le feu de la campagne pour devenir le meilleur instrument militaire d'Europe. Les grandes puissances s’en rendent compte et commencent à avoir peur."
 nd_ger.7.a: "Nos armées ont prouvé leur valeur."
 nd_ger.8.t: "Elsass-Lothringen"
 nd_ger.8.d: "L'annexion de la Lorraine et la consolidation des territoires baltes de la Prusse font de l'Allemagne la puissance militaire incontestée de l'Europe centrale. Nos forteresses sont hérissées d'artillerie, nos lignes de ravitaillement s'étendent de la mer du Nord jusqu'aux Carpates. La question est maintenant de doctrine : allons-nous perfectionner l’art de la guerre de siège, en réduisant les forteresses ennemies avec une précision méthodique ? Ou devrions-nous adopter la guerre de mouvement, en frappant en profondeur avant que l’ennemi ne puisse réagir ?"
 nd_ger.8.a: "Réduisez leurs forteresses en décombres."
 nd_ger.8.b: "Frappez vite, avant qu'ils sachent que nous arrivons."
 nd_ger.9.t: "Petite Europe"
 nd_ger.9.d: "Des aigles allemands survolent Varsovie et Cracovie. Le rêve de Mitteleuropa, un continent organisé sous direction allemande, est devenu réalité. De la Rhénanie industrielle aux champs de céréales de Pologne, des ports baltes aux cols alpins, un empire d’une puissance sans précédent s’étend au cœur de l’Europe. Comment ce colosse se comportera-t-il parmi les nations ?"
 nd_ger.9.a: "Notre force garantira la paix."
 nd_ger.9.b: "L’État existe pour faire la guerre."
 nd_ger.10.t: "Handelsherrschaft"
 nd_ger.10.d: "La vision du Zollverein a été réalisée. Les banques allemandes étendent le crédit de Francfort à Vienne, le charbon de la Ruhr alimente les usines de toute l’union douanière, et les commerçants qui marchandaient autrefois pour de petits péages contrôlent désormais des marchés qui s’étendent sur tout le territoire allemand. Le démantèlement des barrières internes a créé un espace économique unifié, différent de tout ce que l’Europe a connu, et jeté les bases de quelque chose de plus grand."
 nd_ger.10.a: "L'union douanière n'est qu'un début."
 nd_ger.11.t: "Marché industriel"
 nd_ger.11.d: "La transformation est stupéfiante. Là où se trouvaient autrefois des ateliers et des corporations d'artisans dispersés, de vastes complexes industriels bordent désormais les rivières et les voies ferrées des terres allemandes. L'acier coule des fourneaux de la Ruhr, la chimie des laboratoires du Rhin, les machines des ateliers de Saxe. Le développement allemand a dépassé ses rivaux. Mais comment ce colosse industriel va-t-il organiser son économie, par le biais d’une concurrence ouverte ou d’une direction étatique ?"
 nd_ger.11.a: "Laissons le marché décider. Le libre-échange enrichit tout le monde."
 nd_ger.11.b: "L’État doit diriger l’économie."
 nd_ger.12.t: "Monde du monde"
 nd_ger.12.d: "L’industrie allemande et le capital allemand ont remodelé l’économie d’un continent. Des comptoirs de Hambourg aux bourses de Francfort, des bassins houillers de la Ruhr aux laboratoires de Berlin, l'Allemagne est devenue l'atelier de l'Europe et l'envie du monde. Les sciences prospèrent dans les universités allemandes et les produits allemands sont vendus à des prix élevés sur tous les marchés. La question est de savoir si l’avenir de l’Allemagne réside dans les vagues du commerce mondial ou dans les usines qui ont déjà refait la société."
 nd_ger.12.a: "L'Allemagne doit contrôler les mers commerciales."
 nd_ger.12.b: "L'usine va refaire le monde."
 nd_ger_krupp_stahlwerk: "Krupp Stahlwerk"
 nd_ger_krupp_stahlwerk_desc: "Une immense usine sidérurgique et d'armement dans la tradition de la dynastie Krupp. Ici, les montagnes de charbon et de fer de la Ruhr sont transformées en canons et en plaques de blindage les plus raffinés du monde, alimentant la domination militaro-industrielle de l'Allemagne."
 nd_ger_krupp_maintenance: "Production d'armes"
 nd_ger_krupp_maintenance_desc: "Le fer, le charbon et l'acier alimentent les fours du Stahlwerk, sous forme de canons de canon, de douilles d'obus et de plaques de blindage d'une qualité inégalée."
 nd_ger_handelskammer: "Chambre de commerce"
 nd_ger_handelskammer_desc: "Chambre de commerce allemande où commerçants, banquiers et industriels coordonnent les affaires économiques du Reich. Les accords commerciaux, les informations sur le marché et les différends commerciaux sont gérés avec l’efficacité prussienne."
 nd_ger_handelskammer_maintenance: "Opérations Commerciales"
 nd_ger_handelskammer_maintenance_desc: "Le papier, le verre et les beaux meubles soutiennent les opérations administratives de la chambre de commerce."
 nd_ger_dest_einigung: "Guerres d'unification"
 nd_ger_dest_einigung_desc: "Sécurisez les frontières du nouvel État allemand en vous emparant du port baltique de Dantzig et de la forteresse lorraine de Metz. Tous deux sont des piliers stratégiques, l’un contrôle la Vistule et l’accès à la Baltique, l’autre garde les abords depuis la France."
 nd_ger_dest_elsass: "Elsass-Lothringen"
 nd_ger_dest_elsass_desc: "Consolidez la suprématie militaire allemande en sécurisant Königsberg à l’est et en construisant une armée professionnelle qui fait l’envie de l’Europe. Les grandes puissances doivent apprendre à respecter la force allemande."
 nd_ger_dest_mitteleuropa: "Petite Europe"
 nd_ger_dest_mitteleuropa_desc: "Realize the dream of a German-led Central Europe by extending power over Warsaw and Krakow. Build the mightiest army on the continent on the Standing Army Doctrine and earn the prestige befitting a great empire. Unlocks the Krupp Stahlwerk."
 nd_ger_dest_zollverein: "Agrandissement du Zollverein"
 nd_ger_dest_zollverein_desc: "Construire l’infrastructure financière et la base de ressources pour alimenter l’industrie allemande. Adoptez le système bancaire moderne, remplissez votre trésorerie et assurez-vous que le charbon circule sur les marchés qui alimentent les usines du futur."
 nd_ger_dest_industrie: "Marché industriel"
 nd_ger_dest_industrie_desc: "Transform Germany into an industrial powerhouse. Embrace industrialization, build Essen up from a village on a coal seam into a city of furnaces, and ensure steel production feeds the factories of the Ruhr and Rhine."
 nd_ger_dest_essen_developed_tt: "We own #bold Essen#! and its development is at least #bold 29#!"
 nd_ger_dest_welthandel: "Monde du monde"
 nd_ger_dest_welthandel_desc: "Achieve economic supremacy over Europe. Amass vast wealth, earn worldwide prestige, embrace the scientific revolution, and build Hamburg into the port through which German goods reach the world. Unlocks the Handelskammer."
 nd_ger_dest_hamburg_developed_tt: "We own #bold Hamburg#! and its development is at least #bold 58#!"
 STATIC_MODIFIER_NAME_nd_ger_dest_siege_mastery: "Maîtrise du siège"
 STATIC_MODIFIER_DESC_nd_ger_dest_siege_mastery: "L'artillerie et les ingénieurs de siège allemands ont perfectionné la réduction systématique des fortifications ennemies, même si les dépenses liées aux opérations de siège prolongées mettent à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_ger_dest_bewegungskrieg: "Guerre civile"
 STATIC_MODIFIER_DESC_nd_ger_dest_bewegungskrieg: "La doctrine allemande met l'accent sur les opérations décisives rapides, frappant avant que l'ennemi puisse se concentrer, briser sa volonté et dicter ses conditions. Des victoires rapides engendrent la confiance, peut-être trop."
 STATIC_MODIFIER_NAME_nd_ger_dest_armed_peace: "Paix armée"
 STATIC_MODIFIER_DESC_nd_ger_dest_armed_peace: "La puissance militaire écrasante de l’Allemagne garantit l’ordre européen. Aucune puissance n’ose défier le Reich, et le prestige allemand atteint son apogée en tant qu’arbitre des affaires continentales."
 STATIC_MODIFIER_NAME_nd_ger_dest_total_war: "Guerre totale"
 STATIC_MODIFIER_DESC_nd_ger_dest_total_war: "L’État est un instrument de guerre, et la guerre est l’instrument de l’État. La machine militaire allemande mobilise toutes les ressources pour la conquête, même si la marine souffre de négligence."
 STATIC_MODIFIER_NAME_nd_ger_dest_open_market: "Marché libre"
 STATIC_MODIFIER_DESC_nd_ger_dest_open_market: "Les politiques économiques ouvertes de l’Allemagne attirent des talents et des capitaux de toute l’Europe, intégrant divers peuples dans une union commerciale florissante, même si l’autorité centrale se relâche dans le processus."
 STATIC_MODIFIER_NAME_nd_ger_dest_directed_economy: "Économie dirigée"
 STATIC_MODIFIER_DESC_nd_ger_dest_directed_economy: "L’État dirige le développement industriel avec l’efficacité prussienne, en assimilant les peuples et en rationalisant la gouvernance, même si la construction navale souffre à mesure que les ressources affluent vers les usines."
 STATIC_MODIFIER_NAME_nd_ger_dest_handelsmacht: "Handelsmacht"
 STATIC_MODIFIER_DESC_nd_ger_dest_handelsmacht: "L’Allemagne projette sa puissance commerciale à travers les mers, construisant une présence maritime qui rivalise avec les anciens empires commerciaux. La marine contrôle les voies de navigation, même si les forces terrestres reçoivent moins d'attention."
 STATIC_MODIFIER_NAME_nd_ger_dest_industriekaiser: "Industriekaiser"
 STATIC_MODIFIER_DESC_nd_ger_dest_industriekaiser: "L’industrie et l’innovation allemandes remodèlent la société européenne. Les usines, les laboratoires et les universités du Reich sont à la tête du monde et tous les domaines prospèrent grâce au moteur du progrès."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_ger_bureaucracy_authority: "Reichsverwaltung"
 AUTO_MODIFIER_DESC_nd_ger_bureaucracy_authority: "The unified German state inherits the densest institutional toolkit in Europe: two supreme courts, ten Imperial Circles, the Hanseatic free-city order, the Sachsenspiegel and its sister codes, and (if history runs late enough) the Prussian General Directory and the Zollverein. Germany can sustain four more standing institutions."

 ger_reichskammergericht_bureaucracy: "Reichskammergericht"
 ger_reichskammergericht_bureaucracy_desc: "The Imperial Chamber Court founded at the 1495 Diet of Worms as the price of the Ewiger Landfrieden: the eternal peace that abolished the right of feud. Sat at Frankfurt, then Speyer, then Wetzlar, with its judges chosen overwhelmingly by the Imperial Estates rather than the Emperor and its budget paid by the Empire itself. For three centuries it gave princes and free cities a credible legal forum against imperial overreach, anchoring the Reich's character as a constitutional, judicialised polity."

 ger_reichshofrat_bureaucracy: "Reichshofrat"
 ger_reichshofrat_bureaucracy_desc: "Le Conseil aulique, la cour suprême de l'empereur à la Hofburg à Vienne, réglementé par Ferdinand Ier en 1559 avec un président, un vice-chancelier et dix-huit conseillers, tous payés par la bourse impériale. Il détenait une juridiction exclusive sur les fiefs détenus directement par l'empereur et sur les questions d'intérêt dynastique, et les plaideurs affluaient vers lui parce qu'il régnait plus rapidement que le Reichskammergericht et détenait l'autorité personnelle des Habsbourg. Un contrepoids direct au tribunal des domaines de Wetzlar."

 ger_reichskreise_bureaucracy: "Reichskreise"
 ger_reichskreise_bureaucracy_desc: "Les dix cercles impériaux créés par Maximilien Ier à partir de 1500 pour organiser la défense commune, collecter les impôts impériaux et (après 1512) appliquer les verdicts du Reichskammergericht. Chaque Kreis était dirigé par deux Kreisdirektoren, normalement les principaux princes laïcs et ecclésiastiques, et son Kreistag rassemblait des contingents de la Reichsarmee et réglementait la monnaie. Les milieux souabe et franconien en particulier ont donné du mordant au droit impérial dans le sud et l’ouest territorialement fracturés."

 ger_sachsenspiegel_bureaucracy: "Sachsenspiegel"
 ger_sachsenspiegel_bureaucracy_desc: "The Mirror of the Saxons, compiled in Middle Low German between 1220 and 1235 by the Saxon administrator Eike von Repgow at the request of Count Hoyer of Falkenstein. Its Landrecht (territorial law) and Lehnrecht (feudal law) became the template for the Schwabenspiegel, the Deutschenspiegel, and most local custumals across the German lands. Courts in parts of Saxony and Westphalia were still applying its provisions as late as 1900, a thicket of codified custom that bound princes as firmly as it bound peasants."

 ger_hansetag_bureaucracy: "Hansetag et Kontoré"
 ger_hansetag_bureaucracy_desc: "Le régime général irrégulier de la Ligue hanséatique à Lübeck et ses quatre grandes usines commerciales au Steelyard de Londres, Bruges, Bergen et Novgorod. Chaque Kontor était une universitas mercatorum agréée avec son propre trésor, son sceau, son tribunal, son code de règles et ses échevins élus, accordant aux villes hanséennes un ordre commercial et juridique parallèle en dehors de la juridiction princière territoriale. Même après le dernier Hansetag officiel de la Ligue en 1669, les villes libres de Lübeck, Hambourg et Brême ont conservé leurs privilèges hanséatiques jusqu'au XIXe siècle."

 ger_generaldirektorium_bureaucracy: "Directeur général"
 ger_generaldirektorium_bureaucracy_desc: "Frederick William I's General Directory, established by the Instructions of 20 December 1722 to merge the General Finance Directorate, the War Commissariat, and the Domains Administration into a single ministerial board with the Soldatenkonig as its president. Its four ministers split the kingdom by both province and function, audited the royal accounts daily, and made Brandenburg-Prussia the first European state where civil and military administration ran on the same disciplined fiscal cassettes, the foundation of Prussian power."

 ger_zollverein_bureaucracy: "Zollverein"
 ger_zollverein_bureaucracy_desc: "L'Union douanière allemande a été conclue à Berlin le 22 mars 1833 et est entrée en vigueur le 1er janvier 1834. Le traité a aboli environ 1 800 barrières tarifaires internes entre les États allemands, a consolidé plus de trente monnaies en deux et a attiré 28 des 39 membres de la Confédération allemande dans une zone de libre-échange dirigée par la Prusse. Seule l’Autriche a refusé d’y adhérer, avec des conséquences fatidiques. Les chemins de fer, les monnaies et les tarifs uniformes du Zollverein constituaient le substrat économique sur lequel l'unification politique fut réalisée une génération plus tard."
