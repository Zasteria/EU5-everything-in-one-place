l_french:
 STATIC_MODIFIER_NAME_nd_golden_throne_of_niani: "Trône d'or de Niani"
 STATIC_MODIFIER_DESC_nd_golden_throne_of_niani: "Les richesses de l'Empire Manden coulent à travers nos marchés comme les eaux du Niger. La poussière d'or et le sel remplissent nos coffres, et le nom de notre Mansa est prononcé avec révérence de Tombouctou au Caire."
 STATIC_MODIFIER_NAME_nd_mandate_of_the_gbara: "Mandat des Gbara"
 STATIC_MODIFIER_DESC_nd_mandate_of_the_gbara: "La Grande Assemblée a parlé. Les ton-tigui sont prêts, le corps des farari chevauche sous nos ordres et les seize maîtres des carquois promettent leur loyauté. L'empire sera tenu par la force des armes du Manden."
 STATIC_MODIFIER_NAME_nd_keepers_of_timbuktu: "Gardiens de Tombouctou"
 STATIC_MODIFIER_DESC_nd_keepers_of_timbuktu: "Les bibliothèques de Tombouctou détiennent la sagesse des âges, des manuscrits sur la jurisprudence, l'astronomie, la médecine et l'histoire remplissent les étagères de Sankoré. Nous sommes les gardiens de ce savoir."
 STATIC_MODIFIER_NAME_nd_trade_of_timbuktu: "Commerce de Tombouctou"
 STATIC_MODIFIER_DESC_nd_trade_of_timbuktu: "Tombouctou se trouve à la croisée des chemins du monde. Les caravanes du Sahara rencontrent les marchands fluviaux du Niger et les marchandises de trois continents changent de mains sur nos marchés."
 STATIC_MODIFIER_NAME_nd_lords_of_the_caravan: "Seigneurs de la caravane"
 STATIC_MODIFIER_DESC_nd_lords_of_the_caravan: "Les grandes caravanes de mille chameaux traversent les sables brûlants sous nos ordres. Le sel de Taghaza, l'or de Bure, la cola de la forêt, tous transitent par le territoire manden et remplissent les bourses manden."
 nd_mal.1.t: "La restauration de l'empire du Manden"
 nd_mal.1.d: "The fragments of the great empire founded by Sundiata Keita have been gathered once more under a single banner. From the banks of the Niger to the edges of the Sahara, the Manden people are united again. The Gbara, the great assembly of clan chiefs, convenes at Kangaba to decide the direction of the restored empire.\n\nWill we follow in the footsteps of Mansa Musa, whose golden pilgrimage dazzled the courts of Cairo and Mecca, making Mali the wealthiest realm in the known world? Or shall we heed the legacy of Sundiata the Lion King, whose warriors carved an empire from the savannah, and build our strength upon the might of the ton-tigui and the fearsome farari cavalry?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mal.1.a: "Laissez l’or parler plus fort que les épées."
 nd_mal.1.b: "L'empire a été conquis par des guerriers, et les guerriers le conserveront."
 nd_mal.2.t: "Les Manuscrits de Tombouctou"
 nd_mal.2.d: "In the madrasas of Timbuktu, a remarkable flowering of scholarship has taken root. The scholars of Sankore have assembled a vast collection of manuscripts, texts on Islamic jurisprudence, astronomy, mathematics, medicine, and the histories of the Sahel. Scholars travel from as far as Fez and Cairo to study alongside our ulama, and the Timbuktu Manuscripts are becoming known as one of the great intellectual treasures of the Islamic world.\n\nThese manuscripts represent an immense wealth, both intellectual and material. Shall we invest in preserving and expanding this scholarly tradition, or leverage Timbuktu's fame to attract more traders and commerce to our markets?"
 nd_mal.2.a: "La connaissance est la vraie richesse. Conservez les manuscrits."
 nd_mal.2.b: "Que la renommée de Tombouctou remplisse nos marchés de commerçants."
 nd_mal.3.t: "Les grandes caravanes du Sahara"
 nd_mal.3.d: "The trans-Saharan trade routes that have enriched our empire for generations continue to thrive. Vast caravans of a thousand camels and more cross the burning desert, guided by Berber navigators who read the stars as sailors read the sea. At Taghaza, great slabs of salt are cut from the earth and loaded onto camels for the long journey south. At Bure and Bambuk, gold dust is weighed and exchanged for the salt that is worth its weight in the precious metal.\n\nOur empire sits astride these routes like a spider at the center of its web. Every caravan that passes through our territory pays tribute to the Mansa, and the wealth of nations flows through Manden hands."
 nd_mal.3.a: "Nous sommes les seigneurs des routes caravanières."
 nd_mal.4.t: "La Grande Mosquée de Djinguereber"
 nd_mal.4.d: "The Djinguereber Mosque, commissioned by Mansa Musa himself and designed by the Andalusian architect Abu Es Haq es Saheli, stands as the crown jewel of Sudano-Sahelian architecture. Built of banco, sun-dried mud brick reinforced with palm wood, the mosque towers over Timbuktu, its three inner courts, two minarets, and prayer halls serving as both a house of worship and a center of learning.\n\nThe mosque has become a model for Islamic architecture throughout West Africa. Its distinctive style, organic, monumental, and perfectly adapted to the Sahel climate, represents the unique synthesis of Manden creativity and Islamic devotion that defines our civilization."
 nd_mal.4.a: "Un monument digne de la gloire de Mansa."
 nd_mal.5.t: "Réformes de la Charte du Manden"
 nd_mal.5.d: "The Kouroukan Fouga, the great charter proclaimed at Kurukan Fuga after Sundiata's victory at the Battle of Krina, has served as the constitutional foundation of our empire since its founding. Its forty-four edicts established the federation of Mandinka clans, codified property rights, mandated environmental protections, and guaranteed individual freedoms, including the abolition of slavery among the Manden.\n\nNow a new generation of leaders seeks to adapt these ancient principles to the challenges of a changing world. The charter's emphasis on consensus governance through the Gbara assembly, its recognition of craft guild autonomy, and its provisions for social mobility offer a framework for a more modern administration."
 nd_mal.5.a: "La sagesse des fondateurs perdure."
 nd_mal_griot_tradition: "Tradition orale des griots"
 nd_mal_griot_tradition_desc: "Les griots, jali en Manden, sont les gardiens de l'histoire, de la généalogie et du droit. Par le chant et la récitation, ils préservent l’épopée de Soundiata et les actes des Mansaya."
 nd_mal_niani_trade_tradition: "Tradition commerciale de Niani"
 nd_mal_niani_trade_tradition_desc: "La capitale Niani se situe au carrefour des routes commerciales du Niger, où les marchandises de la forêt, de la savane et du désert convergent vers des marchés animés."
 nd_mal_clan_governance: "Gouvernance du clan Manden"
 nd_mal_clan_governance_desc: "Le système politique du Manden repose sur la fédération des clans établie par le Kouroukan Fouga, l'assemblée Gbara apportant conseil et consensus."
 nd_mal_islam_of_the_mansa: "Islam des Mansa"
 nd_mal_islam_of_the_mansa_desc: "Les Mansaya ont embrassé l'Islam très tôt, le mélangeant avec les traditions Manden pour créer une civilisation islamique ouest-africaine distinctive."
 nd_mal_timbuktu_manuscripts: "Manuscrits de Tombouctou"
 nd_mal_timbuktu_manuscripts_desc: "Les grandes bibliothèques et madrasas de Tombouctou abritent des centaines de milliers de manuscrits sur la jurisprudence, l'astronomie et l'histoire, trésor intellectuel du monde islamique."
 nd_mal_trans_saharan_caravans: "Caravanes transsahariennes"
 nd_mal_trans_saharan_caravans_desc: "Vast caravans of a thousand camels cross the desert, carrying salt south and gold north. Mali sits at the heart of this commerce."
 nd_mal_hajj_of_the_mansa: "Hajj de Mansa"
 nd_mal_hajj_of_the_mansa_desc: "Le pèlerinage légendaire de Mansa Musa à La Mecque en 1324 a étonné les cours d'Égypte et d'Arabie par sa démonstration de richesse, établissant la réputation du Mali dans le monde connu."
 nd_mal_djinguereber_mosque: "Mosquée Djinguereber"
 nd_mal_djinguereber_mosque_desc: "Commandée par Mansa Musa et conçue par l'architecte andalou Abu Es Haq es Saheli, cette grande mosquée définit la tradition architecturale soudano-sahélienne."
 nd_mal_wangara_gold_trade: "Commerce de l'or de Wangara"
 nd_mal_wangara_gold_trade_desc: "Le réseau marchand Wangara contrôle les gisements aurifères de Bure et Bambuk grâce à un système de commerce silencieux, faisant du Mali la source d'une grande partie de l'or mondial."
 nd_mal_saharan_musket_trade: "Commerce de mousquets sahariens"
 nd_mal_saharan_musket_trade_desc: "Les armes à feu acquises grâce au commerce transsaharien avec les États d’Afrique du Nord commencent à transformer la guerre du Manden, complétant les tactiques traditionnelles à l’arc et à la lance."
 nd_mal_niger_river_fleet: "Flotte du fleuve Niger"
 nd_mal_niger_river_fleet_desc: "Des pirogues de guerre et des navires de commerce sillonnent le fleuve Niger, artère vitale de l'empire, transportant des marchandises et des guerriers entre les grandes villes commerçantes."
 nd_mal_manden_reforms: "Réformes de la Charte du Manden"
 nd_mal_manden_reforms_desc: "Les principes du Kouroukan Fouga, gouvernance consensuelle, autonomie des corporations artisanales et mobilité sociale, sont adaptés pour répondre aux défis d'une nouvelle ère."
 nd_mal_gold_dust_economy: "Économie de la poussière d’or"
 nd_mal_gold_dust_economy_desc: "La poussière d'or sert de monnaie dans tout l'empire, pesée selon des mesures standardisées. Les marchés de l’or de Niani et Tombouctou fixent des prix qui se répercutent à travers l’Afrique et au-delà."
 nd_mal_sankore_scholars: "Boursiers de Sankoré"
 nd_mal_sankore_scholars_desc: "Les savants de la Madrasa Sankoré représentent le summum intellectuel de l’islam ouest-africain, produisant des ouvrages sur la jurisprudence malékite étudiés du Sahel au Maghreb."
 nd_mal_tonjon_cavalry: "Cavalerie Ton-Jon"
 nd_mal_tonjon_cavalry_desc: "Les ton-jon, à l'origine d'anciens esclaves bénéficiant du statut de guerrier, ont évolué pour devenir une force de cavalerie professionnelle servant les Mansa comme un instrument militaire loyal au-delà de la politique des clans."
 nd_mal_mande_cloth_weaving: "Tissage de tissus Mandé"
 nd_mal_mande_cloth_weaving_desc: "The bogolan, mud cloth, tradition and strip-woven textiles of the Mande people are both artistically distinctive and commercially valuable throughout West Africa.\n\n#italic Available in: $nd_mal_sahel_caravanserai$#!"
 nd_mal_maliki_jurisprudence: "Jurisprudence Maliki"
 nd_mal_maliki_jurisprudence_desc: "L’école malékite de droit islamique, dominante au Sahel, fournit un cadre juridique complet qui régit le commerce, l’héritage et les relations sociales à travers l’empire."
 nd_mal_provincial_farimba: "Farimba provinciale"
 nd_mal_provincial_farimba_desc: "Les farima, gouverneurs de province issus de l'aristocratie guerrière, administrent les provinces les plus éloignées de l'empire, collectant les tributs et maintenant l'ordre au nom des Mansa."
 nd_mal_kola_trade_routes: "Routes commerciales de Kola"
 nd_mal_kola_trade_routes_desc: "Kola nuts from the southern forests are a prized stimulant throughout the Islamic world. Controlling these trade routes adds another dimension to Mali's commercial dominance."
 nd_mal_firearms_adoption: "Adoption des armes à feu"
 nd_mal_firearms_adoption_desc: "Les armes à feu acquises grâce au commerce transsaharien et à la fabrication locale commencent à transformer la composition des armées mandenes, créant une nouvelle classe d'infanterie armée de mousquets."
 nd_mal_tata_fortifications: "Fortifications de Tata"
 nd_mal_tata_fortifications_desc: "Les tata, complexes fortifiés en briques séchées au soleil, protègent les colonies mandenes des raids. Leurs murailles épaisses et leurs tours défensives sont adaptées à l'environnement sahélien."
 nd_mal_imperial_centralization: "Centralisation impériale"
 nd_mal_imperial_centralization_desc: "Les réformes administratives renforcent l'autorité des Mansa sur les provinces, réduisant l'autonomie des chefs locaux et créant une bureaucratie impériale plus unifiée."
 nd_mal_niger_trade_network: "Réseau commercial du Niger"
 nd_mal_niger_trade_network_desc: "Le fleuve Niger sert d’autoroute commerciale reliant les principales villes de l’empire. Le contrôle du commerce fluvial complète les routes caravanières terrestres."
 nd_mal_mande_diaspora: "Diaspora Mandé"
 nd_mal_mande_diaspora_desc: "Les commerçants, artisans et érudits de langue mandé ont établi des communautés dans toute l’Afrique de l’Ouest, diffusant la langue, la culture et le commerce bien au-delà des frontières de l’empire."
 nd_mal_sofa_reform: "Canapé Réforme Militaire"
 nd_mal_sofa_reform_desc: "La tradition des guerriers canapés est modernisée avec des exercices et une organisation d'influence européenne, créant une force d'infanterie professionnelle disciplinée pour la nouvelle ère."
 nd_mal_secular_education: "Éducation Maktab"
 nd_mal_secular_education_desc: "S'appuyant sur la tradition des madrasa, un réseau d'écoles maktab étend l'alphabétisation et l'apprentissage au-delà de l'élite scientifique à un segment plus large de la société."
 nd_mal_groundnut_economy: "Économie de l’arachide"
 nd_mal_groundnut_economy_desc: "La culture et l’exportation de l’arachide transforment l’économie agricole, fournissant une culture de rente qui intègre le Mali aux marchés mondiaux des matières premières."
 nd_mal_modern_governance: "Gouvernance moderne"
 nd_mal_modern_governance_desc: "Des méthodes administratives modernes sont adoptées pour gouverner l’empire, mêlant les traditions manden de gouvernement consensuel et l’efficacité bureaucratique."
 nd_mal_epic_tradition: "Tradition épique"
 nd_mal_epic_tradition_desc: "Les traditions orales des griots, l'épopée de Soundiata, les chroniques des Mansaya, constituent un patrimoine culturel vivant qui définit l'identité manden à travers les siècles."
 a_nd_mal_saharan_musketeer: "Mousquetaire saharien"
 a_nd_mal_saharan_musketeer_desc: "Infanterie armée de mousquets acquis grâce au commerce transsaharien, combinant la discipline tactique traditionnelle du Manden avec la technologie des armes à feu."
 a_nd_mal_tonjon_horseman: "Ton-Jon Cavalier"
 a_nd_mal_tonjon_horseman_desc: "Guerriers de cavalerie professionnels issus de la classe des guerriers ton-jon, célèbres pour leur vitesse, leur férocité dans les raids et leur loyauté absolue envers les Mansa."
 a_nd_mal_mande_arquebusier: "Mandé Arquebusier"
 a_nd_mal_mande_arquebusier_desc: "L'infanterie Manden s'est entraînée à l'utilisation des arquebuses, représentant la maturation de la guerre par armes à feu au Sahel."
 n_nd_mal_niger_canoe: "Canoë de guerre du Niger"
 n_nd_mal_niger_canoe_desc: "Des pirogues robustes construites pour la guerre fluviale et le commerce sur le Niger, dirigées par des marins expérimentés qui connaissent chaque coude et chaque banc de sable du grand fleuve."
 a_nd_mal_reformed_sofa: "Canapé réformé"
 a_nd_mal_reformed_sofa_desc: "La tradition des guerriers canapés a été réformée avec des exercices et une discipline modernes, créant une force d'infanterie professionnelle qui perpétue l'héritage martial du vieux Mali."
 nd_mal_griot_pavilion: "Pavillon des Griots"
 nd_mal_griot_pavilion_desc: "Un lieu de rassemblement où les griots, gardiens héréditaires de l'histoire orale, interprètent les épopées et les généalogies qui unissent la société mandénienne."
 nd_mal_sahel_caravanserai: "Caravansérail du Sahel"
 nd_mal_sahel_caravanserai_desc: "Une halte fortifiée le long des routes commerciales transsahariennes, offrant abri, eau et marchés aux grandes caravanes traversant le désert."
 nd_mal_madrasa: "Manuscript Library"
 nd_mal_madrasa_desc: "The house library of a scholar family, after those of Timbuktu. Books bought from the caravans of the north are copied here by paid scribes, lent to students, and handed down as the family's wealth. Law, grammar, astronomy and medicine are read in its court."
 nd_mal_salt_depot: "Dépôt de sel"
 nd_mal_salt_depot_desc: "Entrepôt et marché pour le commerce du sel, les grandes plaques de sel gemme de Taghaza sont stockées, divisées et vendues aux marchands se dirigeant vers le sud."
 nd_mal_sudano_sahelian_mosque: "Mosquée soudano-sahélienne"
 nd_mal_sudano_sahelian_mosque_desc: "Une mosquée monumentale construite dans le style distinctif en briques crues banco du Sahel, servant à la fois de centre de culte et de siège d'apprentissage."
 nd_mal_gold_dust_market: "Marché de la poussière d'or"
 nd_mal_gold_dust_market_desc: "Un marché spécialisé où la poussière d'or est pesée, valorisée et négociée. Les marchés de l’or du Mali fixent des prix qui influencent le commerce à travers l’Afrique et la Méditerranée."
 nd_mal_tata_fortress: "Forteresse de Tata"
 nd_mal_tata_fortress_desc: "Un ensemble fortifié en briques séchées au soleil avec des tours défensives, adapté au paysage sahélien. La tradition tata protège les colonies des raids et des invasions."
 nd_mal_maktab: "École Maktab"
 nd_mal_maktab_desc: "Une école offrant une alphabétisation de base et une éducation coranique à l'ensemble de la population, étendant la tradition de la madrasa au-delà de l'élite savante."
 nd_mal_griot_upkeep: "Patronage des Griots"
 nd_mal_griot_upkeep_desc: "Soutenir les griots avec des teintures pour leurs vêtements de cérémonie, de la poterie pour leurs instruments et des tissus pour leurs tenues de spectacle."
 nd_mal_caravanserai_upkeep: "Approvisionnement du caravansérail"
 nd_mal_caravanserai_upkeep_desc: "Approvisionnement du caravansérail en bétail, céréales et sel pour les commerçants et leurs animaux lors de la traversée du désert."
 nd_mal_madrasa_upkeep: "Copyists and Paper"
 nd_mal_madrasa_upkeep_desc: "Paper for the copyists, books bought from the caravans to be copied, and incense for the reading court."
 nd_mal_salt_depot_upkeep: "Stockage du sel"
 nd_mal_salt_depot_upkeep_desc: "Maintenir les stocks de sel au dépôt, avec du bois pour les étagères et des conteneurs de poterie pour la distribution aux commerçants."
 nd_mal_mosque_upkeep: "Entretien de la mosquée"
 nd_mal_mosque_upkeep_desc: "Argile et bois pour le replâtrage et la réparation annuels de la structure en briques crues du banco, et encens pour le culte."
 nd_mal_gold_market_upkeep: "Opérations de marché"
 nd_mal_gold_market_upkeep_desc: "Outils et poterie pour peser et mesurer la poussière d'or, avec papier pour les grands livres et les registres commerciaux."
 nd_mal_tata_upkeep: "Entretien de la forteresse"
 nd_mal_tata_upkeep_desc: "Argile et bois pour réparer les murs en briques crues et les palissades en bois, avec des armes pour armer la garnison."
 nd_mal_maktab_upkeep: "Fournitures scolaires"
 nd_mal_maktab_upkeep_desc: "Du papier et des livres pour les étudiants et les enseignants du maktab, ainsi que du tissu pour le matériel d'écriture et les uniformes des étudiants."
 nd_mal_somono_landing: "Somono Landing"
 nd_mal_somono_landing_desc: "A river station of the Somono, the boatmen of the Niger. In return for their privileges the ruler's grain, salt, soldiers and orders are carried along the river in their sewn canoes."
 nd_mal_somono_landing_upkeep: "Canoe Yard"
 nd_mal_somono_landing_upkeep_desc: "Planks, cord and tools for the sewn canoes that are kept at the landing."
 nd_mal_bogolan_cloth_pm: "Production de tissu Bogolan"
 nd_mal_bogolan_cloth_pm_desc: "Les artisans produisent le bogolan, le tissu de boue distinctif du Mandé, en teignant du coton tissé localement avec de la boue fermentée et des pigments naturels, créant ainsi des textiles raffinés prisés dans toute l'Afrique de l'Ouest."
 levy_nd_mal_tonjon_horseman: "Ton-Jon Cavalier Prélèvement"
 levy_nd_mal_tonjon_horseman_desc: "Cavalerie professionnelle issue de la classe des guerriers ton-jon."
 levy_nd_mal_reformed_sofa: "Prélèvement sur les canapés réformés"
 levy_nd_mal_reformed_sofa_desc: "Infanterie de canapé modernisée issue de la classe paysanne et militaire."
 nd_mal_formed_tt: "Le Mali est formé"
 nd_mal_path_a_tt: "A choisi le trône d'or de Niani"
 nd_mal_path_b_tt: "A choisi le mandat des Gbara"
 nd_mal_destiny: "Le destin de Manden"
 nd_mal_destiny_desc: "L’empire restauré est prêt à tracer sa voie. Que ce soit à travers l'or ou le fer, la volonté des Mansa façonnera l'avenir du Sahel."
 nd_mal_dest_crossroads: "Carrefour du Sahara"
 nd_mal_dest_crossroads_desc: "Timbuktu and Djenne, the twin jewels of the Niger Bend, are held for the Mansa by vassals. Place them under the Mansa's own governors and build them up, so that caravans from the desert and river merchants from the south meet in cities that are truly ours."
 nd_mal_dest_timbuktu_developed_tt: "#bold Timbuktu#! is ours and has reached a development of 13"
 nd_mal_dest_djenne_developed_tt: "#bold Djenne#! is ours and has reached a development of 15"
 nd_mal_dest_salt_gold: "Sel et Or"
 nd_mal_dest_salt_gold_desc: "Take the salt mines of Taghaza from the vassals who hold them into the Mansa's own hand, and establish banking institutions to manage the immense wealth flowing through our markets."
 nd_mal_dest_empire_gold: "Empire d'Or"
 nd_mal_dest_empire_gold_desc: "Complete the golden chain from Sijilmasa in the north to the gold fields of the south, and make Niani a capital worthy of it. Let the wealth of Manden be spoken of from Marrakech to Cairo."
 nd_mal_dest_niani_developed_tt: "#bold Niani#! is ours and has reached a development of 36"
 nd_mal_dest_march_gao: "Marche sur Gao"
 nd_mal_dest_march_gao_desc: "The Songhai city of Gao has long rivaled Manden power on the Niger. Its princes pay tribute and wait for their hour. Rule Gao directly and secure the eastern frontier."
 nd_mal_dest_hausa_campaigns: "Les campagnes Haoussa"
 nd_mal_dest_hausa_campaigns_desc: "The wealthy city-states of Hausaland, Kano and Katsina, control the trade routes east to Bornu and beyond. Conquer them, and hold half of Katsina's country directly, to extend Manden hegemony across the entire Sahel."
 nd_mal_dest_hausaland_held_tt: "At least half of the #bold northern Hausa lands#! are ours"
 nd_mal_dest_gold_coast: "Seigneur de la Côte d'Or"
 nd_mal_dest_gold_coast_desc: "The Akan goldfields around Kumasi and Bono Manso are the source of the gold that made Mali legendary. Seize these lands, hold half of the Akan country directly, and control the wealth at its very source."
 nd_mal_dest_akan_held_tt: "At least half of the #bold Akan lands#! are ours"
 nd_mal.6.t: "Le destin de Manden"
 nd_mal.6.d: "L'empire est restauré, mais notre travail ne fait que commencer. Le Gbara se réunit pour déclarer la vision des Mansa pour l'avenir du Manden. Le chemin que nous choisissons maintenant résonnera à travers les âges."
 nd_mal.6.a: "Que la volonté de Mansa soit faite."
 nd_mal.7.t: "Carrefour du Sahara"
 nd_mal.7.d: "Tombouctou et Djenné sont à nous. La Boucle du Niger, ce grand croissant où le fleuve tourne vers le sud à la lisière du désert, est désormais entièrement sous le contrôle des Manden. Les caravanes arrivant du nord trouvent des percepteurs du Manden qui attendent à chaque porte, et les érudits de Sankoré s'inclinent devant un patron du Manden."
 nd_mal.7.a: "Le coude de la rivière répond seul au Mansa."
 nd_mal.8.t: "Maîtres du Sel et de l'Or"
 nd_mal.8.d: "The salt mines of Taghaza are ours, completing our grip on the two commodities that drive the trans-Saharan trade. Salt from the north, gold from the south, both now pass through Manden hands. Our bankers have adopted the methods of the great trading houses, and the Mansa's treasury overflows.\n\nShall we invest this wealth in monopolizing the salt trade itself, or in patronizing the scholars and institutions that make Timbuktu the intellectual capital of Africa?"
 nd_mal.8.a: "Monopoliser le commerce du sel."
 nd_mal.8.b: "Patronner les savants de Tombouctou."
 nd_mal.9.t: "Empire d'Or"
 nd_mal.9.d: "From Sijilmasa in the Maghreb to the gold fields of the south, the entire golden chain lies under Manden control. No empire in Africa, perhaps none in the world, commands such wealth. The name of the Mansa is spoken with awe in the courts of Europe, the palaces of Cairo, and the bazaars of Baghdad.\n\nWill we leverage this golden empire to dominate through diplomacy and annexation, or invest in building a lasting cultural legacy that will define West Africa for centuries?"
 nd_mal.9.a: "Laissez l’or parler dans tous les tribunaux."
 nd_mal.9.b: "Construisez un héritage qui survivra à l’or."
 nd_mal.10.t: "Marche sur Gao"
 nd_mal.10.d: "Gao, la capitale Songhaï, est tombée aux mains des Manden. Pendant des générations, les Songhaï ont rivalisé avec le Mali pour la domination du Niger, attaquant nos provinces orientales et défiant l'autorité des Mansa. Cette époque est révolue. La frontière orientale est sécurisée et la voie vers de nouvelles conquêtes est ouverte."
 nd_mal.10.a: "Gao s'incline devant les héritiers du Roi Lion."
 nd_mal.11.t: "Les campagnes Haoussa"
 nd_mal.11.d: "Our armies have swept through Hausaland, bringing the great city-states of Kano and Katsina under the Mansa's banner. These ancient trading centers, with their connections to Bornu, Egypt, and the distant east, now pay tribute to Manden.\n\nShall we use this momentum to reform our cavalry and press further conquests, or extract systematic tribute to fund a professional standing army?"
 nd_mal.11.a: "Réformez la cavalerie pour de nouvelles campagnes."
 nd_mal.11.b: "Extrayez l'hommage et construisez une armée permanente."
 nd_mal.12.t: "Seigneur de la Côte d'Or"
 nd_mal.12.d: "Kumasi and the Akan goldfields are ours. We have achieved what no Mansa before us dared, controlling not merely the trade in gold, but the mines themselves. The empire of Sundiata has been surpassed. From the salt flats of the Sahara to the forests of the Gold Coast, the Mansa's writ runs unchallenged.\n\nShall we use this unrivaled power for further military dominion, or consolidate our vast conquests into a lasting Pax Mandinka?"
 nd_mal.12.a: "L'épée de Soundiata ne connaît pas de repos."
 nd_mal.12.b: "Forgez une paix durable dans nos domaines."
 STATIC_MODIFIER_NAME_nd_mal_dest_salt_monopoly: "Monopole du sel de Mansa"
 STATIC_MODIFIER_DESC_nd_mal_dest_salt_monopoly: "Les Mansa contrôlent le commerce du sel de la mine au marché, fixant les prix qui enrichissent le trésor et financent les ambitions de l'empire."
 STATIC_MODIFIER_NAME_nd_mal_dest_timbuktu_patronage: "Patronage de Tombouctou"
 STATIC_MODIFIER_DESC_nd_mal_dest_timbuktu_patronage: "Le généreux patronage des Mansa envers les érudits et les madrasas de Tombouctou a fait de la ville un phare du savoir qui attire les plus grands esprits du monde islamique."
 STATIC_MODIFIER_NAME_nd_mal_dest_gold_emperor: "L'Empereur d'Or"
 STATIC_MODIFIER_DESC_nd_mal_dest_gold_emperor: "La richesse et la portée diplomatique des Mansa sont sans précédent. L'or achète des alliés, des vassaux et de l'influence à travers le monde connu."
 STATIC_MODIFIER_NAME_nd_mal_dest_mansa_legacy: "L'héritage des Mansa"
 STATIC_MODIFIER_DESC_nd_mal_dest_mansa_legacy: "Les Mansa ont choisi d’investir dans un héritage au-delà de la conquête, une civilisation d’apprentissage, d’art et de culture qui définira l’Afrique de l’Ouest pendant des siècles."
 STATIC_MODIFIER_NAME_nd_mal_dest_savanna_riders: "Cavaliers de la savane"
 STATIC_MODIFIER_DESC_nd_mal_dest_savanna_riders: "La cavalerie réformée du Manden balaie la savane ouverte à une vitesse dévastatrice, recrutant et entraînant des guerriers sur les terres conquises."
 STATIC_MODIFIER_NAME_nd_mal_dest_hausa_tribute: "Hommage du pays haoussa"
 STATIC_MODIFIER_DESC_nd_mal_dest_hausa_tribute: "L’extraction systématique du tribut des riches cités-États haoussa finance une armée professionnelle et fournit des alliés mercenaires."
 STATIC_MODIFIER_NAME_nd_mal_dest_sword_of_sundiata: "Épée de Soundiata"
 STATIC_MODIFIER_DESC_nd_mal_dest_sword_of_sundiata: "La puissance militaire des Mansa est absolue. Aucune forteresse ne peut résister aux armes combinées de l'infanterie, de la cavalerie et de la guerre de siège du Manden."
 STATIC_MODIFIER_NAME_nd_mal_dest_pax_mandinka: "Pax Mandingue"
 STATIC_MODIFIER_DESC_nd_mal_dest_pax_mandinka: "La paix des Mansa s'étend à travers le Sahel et au-delà. Les terres fatiguées par la guerre se rétablissent sous une gouvernance stable du Manden, et les maladies et la dévastation reculent."
 nd_mal_house_of_gold: "Maison de l'Or"
 nd_mal_house_of_gold_desc: "Un grand trésor et palais commercial où la richesse du commerce transsaharien est pesée, stockée et redistribuée. Les meilleurs marchands et banquiers d’Afrique de l’Ouest mènent leurs affaires sous ses dômes dorés."
 nd_mal_sundiata_hall: "Salle de Soundiata"
 nd_mal_sundiata_hall_desc: "Un palais-forteresse fortifié en l'honneur du fondateur de l'empire, où le Mansa tient sa cour avec ses chefs de guerre et où sont honorés les plus grands guerriers de l'empire."
 nd_mal_house_of_gold_upkeep: "Opérations de trésorerie"
 nd_mal_house_of_gold_upkeep_desc: "De l'or pour les réserves du trésor, des bijoux pour les cadeaux diplomatiques, du papier pour les registres commerciaux et des tissus fins pour les dignitaires qui y font des affaires."
 nd_mal_sundiata_hall_upkeep: "Garnison de Hall"
 nd_mal_sundiata_hall_upkeep_desc: "Armes et armures pour la garde d'élite, pierre pour les murs de la forteresse, cuir pour l'équipement militaire et chevaux pour la cavalerie qui y est stationnée."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_mal_bureaucracy_authority: "Appareil Impérial Manden"
 AUTO_MODIFIER_DESC_nd_mal_bureaucracy_authority: "The Kurukan Fuga of 1236 bound the twelve Mandinka kingdoms into a single federation under the Mansa, with the Gbara assembly, the dyamana governors, the Wangara merchant network, the Sankore scholars, the niamakala caste corporations, and the ton-tigi cavalry orders all interlocking into a coherent imperial machine. The court of the Mansa has room for two more institutions of the Manden state."

 mal_gbara_assembly_bureaucracy: "Assemblée Gbara"
 mal_gbara_assembly_bureaucracy_desc: "Le grand conseil institué par la charte Kurukan Fuga de 1236, où une trentaine de sièges représentaient la fédération des clans mandingues : seize lignées de guerriers ton-tigi, quatre mori-kanda-lolou gardiens de la foi pour le conseil islamique, quatre clans de caste niamakala pour les affaires artisanales et corporatives, et quatre clans djeli en tant que maîtres de la parole et des archives historiques. Les Gbara conseillaient les Mansa, ratifiaient les successions et incarnaient le contrat fédéral qui liait les douze royaumes vassaux à Niani. Son consensus était à la fois un atout pour la légitimité et un frein au trône."

 mal_dyamana_government_bureaucracy: "Gouvernement provincial de Dyamana"
 mal_dyamana_government_bureaucracy_desc: "Le Mali était une fédération de douze royaumes sous les Mansa, chacun dirigé par un dyamani-tigui (maître de province) confirmé par la cour impériale mais choisi par la coutume locale - élection, héritage ou rotation entre lignées reconnues. Les territoires conquis en dehors du noyau du Manden étaient placés sous la direction d'un gouverneur militaire farba nommé directement par les Mansa, qui percevait les tributs et les douanes et détenait l'autorité judiciaire locale. La double structure d’un fédéralisme consensuel pour le cœur du pays et d’un gouvernement direct pour la périphérie distinguait l’Empire du Mali de son successeur affluent Songhaï."

 mal_sankore_madrasa_bureaucracy: "Complexe de la médersa Sankoré"
 mal_sankore_madrasa_bureaucracy_desc: "Au 14e siècle, Tombouctou abritait trois grandes madrasas congrégationnelles : la Djinguereber, construite en 1327 sous Mansa Musa selon un projet de l'Andalou Es-Saheli ; le Sidi Yahya, fondé vers 1440 ; et l'ancienne mosquée de Sankoré, qui est devenue un centre de jurisprudence, de mathématiques, d'astronomie et de grammaire malékites. À son apogée, le complexe accueillait quelque vingt-cinq mille étudiants et une classe de juristes en robe noire dont les fatawas étaient sollicitées du Caire à Marrakech. La culture des bibliothèques qu’ils ont entretenue a survécu à la conquête marocaine de 1591, entre des mains privées, dispersée dans le désert jusqu’au jour du retour."

 mal_wangara_diaspora_bureaucracy: "Diaspora commerciale de Wangara"
 mal_wangara_diaspora_bureaucracy_desc: "Les marchands musulmans au long cours connus sous le nom de Wangara au Sahel et Dyula dans les forêts du sud, issus des souches Soninké et Mandingue et liés par un rite malékite commun. Dès le XIVe siècle, les Wangara organisent la prospection et le transport de l'or de Bambuk, de Bure et du pays Akan, les caravanes de sel de Taghaza, la bourse aux noix de cola de Kong et le commerce saharien du papier et du livre. Leur réseau de colonies décentralisées de quartiers marchands dans les villes commerçantes non musulmanes (Begho, Kong, Bobo-Dioulasso, Bonduku) étendait la portée commerciale du Manden bien au-delà de la frontière politique formelle de l’empire."

 mal_niamakala_castes_bureaucracy: "Sociétés de caste de Niamakala"
 mal_niamakala_castes_bureaucracy_desc: "Les castes artisanales endogames formalisées dans le Kurukan Fuga de 1236 : les forgerons numu qui seuls pouvaient travailler le fer, les maroquiniers garanke, les griots-bardes djeli qui instruisaient les princes et racontaient l'empire, et les fune chantres de louanges islamiques. Chaque clan détenait un monopole héréditaire sur son métier et une place reconnue à la cour des Mansa. Une endogamie stricte et un tabou rituel séparaient les niamakala des horon nés libres, mais en retour les castes exerçaient une autorité collective sur leurs métiers qu'aucun édit royal ne pouvait à la légère renverser - l'épine dorsale institutionnelle de l'artisanat et de la mémoire du Manden."

 mal_ton_tigi_cavalry_bureaucracy: "Ordre de cavalerie Ton-tigi"
 mal_ton_tigi_cavalry_bureaucracy_desc: "The carriers of the quiver, the sixteen warrior lineages who at the Kurukan Fuga were granted the right to bear arms in the Mansa's name. Mounted on Sahelian horses imported through the trans-Saharan trade and equipped with imported chainmail and the lance, the farari (brave men) of the ton-tigi were the empire's striking force and the personal retinue of the Mansa on campaign. Their hereditary privileges, including the right to retain captives as dyon royal slaves, made them the indispensable but fractious aristocratic underlay of Manden military power, and, eventually, its undoing."
