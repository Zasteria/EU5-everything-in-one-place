l_french:
 STATIC_MODIFIER_NAME_nd_tgd_restore_protectorates: "Restaurer les protectorats"
 STATIC_MODIFIER_DESC_nd_tgd_restore_protectorates: "La gloire de Tang réside dans sa portée au-delà des montagnes. De la Porte de Jade aux rives de la Caspienne, les protectorats généraux ont sécurisé un empire s'étendant sur la steppe, le désert et l'oasis. Grâce à leur puissance militaire et à leur ruse diplomatique, les Tang ont mis de l'ordre dans les régions occidentales et contrôlé les artères du commerce continental."
 STATIC_MODIFIER_NAME_nd_tgd_golden_age_of_letters: "L'âge d'or des lettres"
 STATIC_MODIFIER_DESC_nd_tgd_golden_age_of_letters: "Sous le patronage des Tang, toutes les confessions étaient les bienvenues à Chang'an. Li Bai a levé sa coupe vers la lune, Du Fu a pleuré les souffrances du peuple et Wang Wei a peint des paysages qui ont dissous la frontière entre poésie et peinture. Moines bouddhistes d'Inde, prêtres nestoriens de Perse et missionnaires manichéens d'Asie centrale débattaient librement à l'ombre du palais Daming."
 STATIC_MODIFIER_NAME_nd_tgd_protectorate_restored: "Protectorat restauré"
 STATIC_MODIFIER_DESC_nd_tgd_protectorate_restored: "Le protectorat général visant à pacifier l'Ouest a été rétabli, étendant l'autorité militaire à tout le bassin du Tarim et aux cols de Tianshan. Les garnisons sécurisent les routes commerciales tandis que les forces de cavalerie mobiles projettent leur puissance au plus profond de la steppe."
 STATIC_MODIFIER_NAME_nd_tgd_examination_perfected: "Examen perfectionné"
 STATIC_MODIFIER_DESC_nd_tgd_examination_perfected: "Le système d'examen jinshi a été affiné jusqu'à atteindre sa forme la plus élevée. Tout homme de talent, quelle que soit sa naissance, peut servir le Fils du Ciel grâce à son excellence littéraire et à ses compétences administratives."
 nd_tgd.1.t: "La restauration Tang"
 nd_tgd.1.d: "Chang'an blazes with new glory. The ancient capital of the Tang, where once two million souls from every corner of the known world gathered beneath crimson palace gates, lives again. From Jingzhao to Kashgar, from the Yellow River to the Tianshan, an empire that once defined civilization itself stirs from centuries of slumber.\n\nThe Tang at its zenith was not merely a Chinese dynasty. It was a cosmopolitan world-empire where Turkic generals led Chinese armies, Persian merchants thronged the Western Market, and Buddhist sutras sat alongside Nestorian gospels and Manichaean hymns. Now the question falls to you: what shall define this restoration?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tgd.1.a: "Marchez vers l’ouest ! Restaurez les protectorats au-delà de la Porte de Jade."
 nd_tgd.1.b: "Laissez le pinceau conquérir ce que l'épée ne peut pas."
 nd_tgd.2.t: "Le protectorat d'Anxi restauré"
 nd_tgd.2.d: "In the year 640, Emperor Taizong established the Protectorate General to Pacify the West at Xizhou, later moving its seat to Kucha. At its height, the Anxi Protectorate commanded four major garrisons (at Kucha, Khotan, Kashgar, and Karashahr) securing the entire Tarim Basin and projecting Tang authority deep into Transoxiana.\n\nThe An Lushan Rebellion of 755 forced the withdrawal of Anxi's garrisons to defend the heartland, and the Protectorate was gradually lost to the Tibetan Empire and Turkic powers. Now, with our banners flying once more over the Western Regions, the Anxi Protectorate is restored, its relay stations, garrison towns, and caravan guards ensuring safe passage for merchants, monks, and diplomats alike."
 nd_tgd.2.a: "Les régions de l’Ouest sont à nouveau sécurisées."
 nd_tgd.2.b: "Un triomphe, mais le travail continue."
 nd_tgd.3.t: "L'examen impérial perfectionné"
 nd_tgd.3.d: "The keju examination, first systematized under the Sui, reached its golden form under the Tang. The jinshi degree, Presented Scholar, became the highest achievement a man could aspire to, tested not merely in rote memorization but in literary composition, policy analysis, and moral philosophy.\n\nUnder Empress Wu Zetian, the system was thrown open wider than ever before, breaking the grip of aristocratic families on government positions. The examination halls of Chang'an saw candidates from every province compete on merit alone. This meritocratic revolution produced statesmen like Zhang Jiuling, whose governance earned him the title of model chancellor for all dynasties to follow."
 nd_tgd.3.a: "Que le mérite seul détermine qui servira le trône."
 nd_tgd.3.b: "L'examen est un outil, pas une religion."
 nd_tgd.4.t: "La stèle nestorienne"
 nd_tgd.4.d: "In 781, a limestone stele was erected in Chang'an recording the arrival of Nestorian Christianity in China a century and a half earlier. The inscription, written in both Chinese and Syriac, tells how the Persian monk Aluoben arrived at the Tang court in 635 and was received by Emperor Taizong, who examined his scriptures and declared: 'The Way has no unchanging name, sages have no unchanging method. Teaching is established to suit the land, and secretly help all living things.'\n\nThis spirit of religious tolerance defined the Tang cosmopolis. Buddhist monasteries, Daoist temples, Zoroastrian fire altars, Manichaean light-houses, Islamic mosques, and Nestorian churches stood within the same city walls, each contributing to a civilization that measured greatness not by uniformity but by the breadth of its embrace."
 nd_tgd.4.a: "Tous les chemins mènent à la vérité sous le paradis Tang."
 nd_tgd.5.t: "L'infanterie Modao"
 nd_tgd.5.d: "The modao, a fearsome two-handed sword nearly seven feet in length, was the signature weapon of Tang heavy infantry. Wielded in dense formations by select troops, the modao created a wall of steel that could stop a cavalry charge dead. At the Battle of the Mohe River in 732, the modao infantry of the Tang general Zhang Shougui broke wave after wave of Khitan cavalry, leaving the steppe warriors stunned by the discipline and killing power of these foot soldiers.\n\nThe modao required years of training and exceptional strength. Units equipped with these weapons were drawn from the most experienced soldiers of the frontier garrisons, men who had spent their lives fighting nomadic raiders and understood how to use terrain and formation to neutralize the mobility advantage of mounted enemies."
 nd_tgd.5.a: "Le modao parle plus fort que n’importe quel argument."
 nd_tgd.6.t: "La renaissance de la Route de la Soie"
 nd_tgd.6.d: "The Silk Road under Tang management was not merely a trade route. It was the nervous system of Eurasian civilization. From Chang'an's bustling Western Market, caravans departed carrying silk, porcelain, tea, and paper westward through the Hexi Corridor and the Jade Gate, crossing the Taklamakan's northern and southern rim roads to reach Kashgar, Samarkand, Baghdad, and ultimately Constantinople.\n\nIn return came Arabian horses, Persian glass, Indian spices, Roman gold coins, and Central Asian music that transformed Tang court entertainment. Sogdian merchants, the 'FedEx of the ancient world', ran networks of trading houses from Chang'an to the Mediterranean. The Tang government maintained relay stations, regulated merchants, and garrisoned oasis towns, creating the safest and most profitable trade corridor the world had ever known."
 nd_tgd.6.a: "La Route relie tous les peuples sous le ciel."
 nd_tgd_fubing_system: "Système de milice Fubing"
 nd_tgd_fubing_system_desc: "Le système de fubing attribue des terres aux agriculteurs-soldats qui servent en rotation dans la capitale ou dans les garnisons frontalières, fournissant ainsi une vaste réserve de milices entraînées à un coût minime pour l'État."
 nd_tgd_equal_field_system: "Système à champ égal"
 nd_tgd_equal_field_system_desc: "Le système juntien distribue les terres de l'État de manière égale entre les hommes adultes, garantissant ainsi les recettes fiscales tout en empêchant les concentrations dangereuses de richesses entre les mains de l'aristocratie."
 nd_tgd_post_road_system: "Routes postales impériales"
 nd_tgd_post_road_system_desc: "Un réseau de stations relais espacées tous les trente kilomètres relie la capitale aux provinces frontalières les plus éloignées, permettant des communications rapides, des mouvements de troupes et un contrôle administratif."
 nd_tgd_modao_tradition: "Infanterie lourde Modao"
 nd_tgd_modao_tradition_desc: "Le modao, une longue lame dévastatrice à deux mains, permet à l'infanterie d'élite de former des murs d'acier impénétrables contre les charges de cavalerie, une tradition née aux frontières Tang."
 nd_tgd_jiedushi_system: "Gouvernorats militaires de Jiedushi"
 nd_tgd_jiedushi_system_desc: "Les commissaires militaires régionaux exercent une autorité civile et militaire combinée sur les circuits frontaliers, maintenant des armées de garnison professionnelles pour se défendre contre les incursions nomades."
 nd_tgd_buddhist_patronage: "Patronage d'État bouddhiste"
 nd_tgd_buddhist_patronage_desc: "Le parrainage impérial des monastères bouddhistes, des projets de traduction et des réseaux de pèlerins crée une vaste infrastructure religieuse qui améliore l'alphabétisation, les échanges culturels et la stabilité sociale."
 nd_tgd_xuanjia_tradition: "Cavalerie lourde de Xuanjia"
 nd_tgd_xuanjia_tradition_desc: "Les xuanjia, cataphractaires à « armure noire », représentent la cavalerie lourde Tang à son meilleur : des cavaliers entièrement blindés sur des chevaux bardés, capables de lancer des charges de choc dévastatrices."
 nd_tgd_silk_road_mastery: "Maîtrise de la Route de la Soie"
 nd_tgd_silk_road_mastery_desc: "Le contrôle des Tang sur les principales artères de la Route de la Soie transforme le commerce terrestre d’un pari dangereux en une entreprise réglementée, rentable et sécurisée reliant l’Est et l’Ouest."
 nd_tgd_sancai_ceramics: "Tradition de la céramique Sancai"
 nd_tgd_sancai_ceramics_desc: "La poterie émaillée tricolore distinctive des Tang (avec des tons ambre, vert et crème) devient à la fois une icône culturelle et un produit d'exportation précieux."
 nd_tgd_nestorian_stele: "Stèle Nestorienne"
 nd_tgd_nestorian_stele_desc: "L'érection de la stèle nestorienne à Chang'an symbolise le pluralisme religieux Tang, où coexistent sous la protection impériale le christianisme, l'islam, le manichéisme, le zoroastrisme, le bouddhisme et le taoïsme."
 nd_tgd_hanlin_scholars: "Académie Hanlin"
 nd_tgd_hanlin_scholars_desc: "L'Académie Hanlin rassemble les érudits les plus brillants de l'empire pour rédiger des édits impériaux, rédiger des documents d'État et donner des conseils politiques, un réservoir d'excellence administrative."
 nd_tgd_frontier_horse_archers: "Archers à cheval de frontière"
 nd_tgd_frontier_horse_archers_desc: "Recrutés parmi les populations mixtes de la frontière (turques, sogdiennes et chinoises), ces archers montés rapides servent d'éclaireurs, de pillards et de forces de flanc."
 nd_tgd_grotto_devotion: "Dévotion au temple de la grotte"
 nd_tgd_grotto_devotion_desc: "Les grands complexes de temples rupestres de Dunhuang, Longmen et Yungang représentent des siècles de sculpture, de peinture et de dévotion, dépositaires de l'art et de l'érudition bouddhistes."
 nd_tgd_anxi_protectorate: "Protectorat Anxi"
 nd_tgd_anxi_protectorate_desc: "Le Protectorat général pour pacifier l'Ouest contrôle le bassin du Tarim à travers quatre garnisons à Kucha, Khotan, Kashgar et Karashahr, sécurisant les approches occidentales de l'empire."
 nd_tgd_imperial_silk: "Production impériale de soie"
 nd_tgd_imperial_silk_desc: "Les ateliers de soie contrôlés par l'État produisent les plus beaux textiles du monde, des brocarts tissés avec du fil d'or aux gazes très fines prisées du Japon à Byzance."
 nd_tgd_poetry_golden_age: "L'âge d'or de la poésie"
 nd_tgd_poetry_golden_age_desc: "Les Tang produisent plus de 48 000 poèmes de plus de 2 200 auteurs. Li Bai, Du Fu, Wang Wei et Bai Juyi établissent le canon littéraire qui définira la civilisation chinoise."
 nd_tgd_jinshi_perfected: "Examen Jinshi perfectionné"
 nd_tgd_jinshi_perfected_desc: "Le diplôme jinshi (testant la composition littéraire, l’analyse politique et la philosophie morale) devient la voie suprême vers le service gouvernemental, brisant les monopoles aristocratiques du pouvoir."
 nd_tgd_shencea_tradition: "Gardes impériaux de Shencea"
 nd_tgd_shencea_tradition_desc: "L'armée de Shencea, à l'origine la garde du corps de l'empereur, devient la force militaire la plus puissante de feu Tang, comptant 150 000 soldats professionnels."
 nd_tgd_sogdian_networks: "Réseaux marchands sogdiens"
 nd_tgd_sogdian_networks_desc: "Sogdian merchants from Samarkand and Bukhara operate vast trading networks stretching from Chang'an to Constantinople, serving as the commercial backbone of the Silk Road."
 nd_tgd_tea_horse_trade: "Commerce de thé et de chevaux"
 nd_tgd_tea_horse_trade_desc: "L'échange stratégique de thé chinois contre des chevaux nomades crée une économie frontalière mutuellement dépendante qui stabilise les relations frontalières et fournit à l'empire des montures de cavalerie supérieures."
 nd_tgd_confessional_tolerance: "Tolérance confessionnelle"
 nd_tgd_confessional_tolerance_desc: "La tradition Tang du pluralisme religieux est étendue et formalisée, garantissant que les communautés de toutes confessions contribuent pacifiquement à la prospérité de l'empire."
 nd_tgd_silk_road_renaissance: "Renaissance de la Route de la Soie"
 nd_tgd_silk_road_renaissance_desc: "Une nouvelle vague de commerce sur la Route de la Soie apporte une richesse et des échanges culturels sans précédent, alors que l'amélioration des infrastructures et des relations diplomatiques ouvre de nouveaux corridors commerciaux."
 nd_tgd_frontier_modernization: "Réforme militaire aux frontières"
 nd_tgd_frontier_modernization_desc: "L’armée frontalière est modernisée grâce à un équipement standardisé, une formation professionnelle et des structures de commandement réformées, créant ainsi une force mobile et disciplinée."
 nd_tgd_grand_canal_trade: "Intégration du Grand Canal"
 nd_tgd_grand_canal_trade_desc: "Le Grand Canal relie les excédents de riz du Yangtsé au cœur du nord, permettant un commerce intérieur massif et soutenant la population de la région de la capitale."
 nd_tgd_imperial_consolidation: "Consolidation Impériale"
 nd_tgd_imperial_consolidation_desc: "L'autorité impériale est étendue et solidifiée grâce à la réforme administrative, à l'intégration culturelle et à la suppression du séparatisme régional."
 nd_tgd_woodblock_printing: "Impression sur bois"
 nd_tgd_woodblock_printing_desc: "Woodblock printing enables the mass reproduction of texts (Buddhist sutras, Confucian classics, and government decrees) spreading literacy and institutional knowledge across the empire.\n\n#italic Unlocks: $nd_tgd_woodblock_printshop$#!"
 nd_tgd_gunpowder_alchemy: "Alchimie de la poudre à canon"
 nd_tgd_gunpowder_alchemy_desc: "Les alchimistes Tang à la recherche de l'élixir d'immortalité tombent sur une découverte plus immédiate : la poudre à canon. Les flèches enflammées, les bombes incendiaires et les proto-roquettes transforment la guerre de siège."
 nd_tgd_centralized_bureaucracy: "Bureaucratie centralisée"
 nd_tgd_centralized_bureaucracy_desc: "Le système bureaucratique basé sur les examens atteint sa pleine maturité, produisant une classe dirigeante entièrement sélectionnée sur la base de son mérite et de sa loyauté envers la cour centrale."
 nd_tgd_maritime_silk_road: "Route maritime de la soie"
 nd_tgd_maritime_silk_road_desc: "Alors que les routes terrestres sont perturbées, le commerce maritime via Guangzhou, Quanzhou et la mer de Chine méridionale se développe pour rivaliser, voire dépasser, en volume, celui de la Route de la Soie continentale."
 nd_tgd_porcelain_mastery: "Maîtrise de l'exportation de la porcelaine"
 nd_tgd_porcelain_mastery_desc: "Chinese porcelain, 'white gold', becomes the most sought-after commodity in world trade. Ship after ship carries blue-and-white wares to markets from Zanzibar to Lisbon.\n\n#italic Available in: $nd_tgd_sancai_kiln$#!"
 nd_tgd_standing_frontier_army: "Armée frontalière permanente"
 nd_tgd_standing_frontier_army_desc: "Le système de garnison frontalière évolue vers une armée permanente permanente, avec des soldats professionnels servant toute l'année dans des positions fortifiées bien approvisionnées le long de la frontière."
 nd_tgd_cosmopolitan_court: "Cour cosmopolite"
 nd_tgd_cosmopolitan_court_desc: "La cour impériale accueille les talents de toutes les nations et cultures, intégrant des administrateurs, des généraux, des artistes et des marchands étrangers dans le tissu de la gouvernance."
 nd_tgd_tea_culture: "Culture du thé formalisée"
 nd_tgd_tea_culture_desc: "Le Classique du thé de Lu Yu a établi la philosophie et la pratique de la préparation du thé comme un grand art. Les salons de thé deviennent des centres de vie sociale, diplomatique et littéraire."
 nd_tgd_border_management: "Gestion stratégique des frontières"
 nd_tgd_border_management_desc: "Un système complet de murs, de cols, de villes de garnison et de protocoles diplomatiques crée une défense en profondeur le long des frontières nord et ouest."
 nd_tgd_industrial_silk: "Production industrielle de soie"
 nd_tgd_industrial_silk_desc: "Mechanized looms and organized factory production transform silk manufacture from artisanal craft to industrial enterprise, vastly increasing output and export capacity.\n\n#italic Available in: $nd_tgd_silk_workshop$#!"
 nd_tgd_modern_academy: "Système d'académie moderne"
 nd_tgd_modern_academy_desc: "Le système d'examens traditionnel évolue pour intégrer des matières modernes (sciences, ingénierie, langues étrangères) tout en conservant ses fondements méritocratiques."
 nd_tgd_continental_rail: "Réseau ferroviaire continental"
 nd_tgd_continental_rail_desc: "Des rails en fer tracent les anciens couloirs de la Route de la Soie, reliant Chang'an à la frontière occidentale et au-delà avec une rapidité et une fiabilité que les caravanes de chameaux ne pourraient jamais égaler."
 nd_tgd_modern_army: "Réforme de l'armée moderne"
 nd_tgd_modern_army_desc: "La tradition des garnisons frontalières se transforme en une armée professionnelle moderne dotée d’une formation, d’un équipement et d’une doctrine tactique standardisés tirés de la science militaire mondiale."
 nd_tgd_cultural_renaissance: "Renaissance culturelle"
 nd_tgd_cultural_renaissance_desc: "Une nouvelle génération d’artistes, de poètes et de penseurs s’appuie sur le canon littéraire Tang pour créer une renaissance culturelle qui célèbre à la fois le patrimoine et l’innovation."
 nd_tgd_silk_road_revival: "La renaissance de la Route de la Soie"
 nd_tgd_silk_road_revival_desc: "Les infrastructures modernes, les accords diplomatiques et les traités commerciaux font revivre l’ancienne Route de la Soie en tant que corridor commercial florissant, reliant les marchés d’Asie de l’Est à l’Asie centrale et au-delà."
 a_nd_tgd_modao_infantry: "Infanterie Modao"
 a_nd_tgd_modao_infantry_desc: "Infanterie lourde d'élite brandissant le redoutable modao, une lame à deux mains de sept pieds capable de couper à la fois le cheval et le cavalier. Ces spécialistes de l'anti-cavalerie forment des murs d'acier impénétrables."
 a_nd_tgd_xuanjia_cavalry: "Cavalerie lourde de Xuanjia"
 a_nd_tgd_xuanjia_cavalry_desc: "Les cataphractaires « Black Armor » des Tang, des cavaliers entièrement blindés montés sur des chevaux bardés, délivrant des charges de choc dévastatrices qui brisent les formations ennemies."
 a_nd_tgd_frontier_horse_archer: "Archers à cheval de frontière"
 a_nd_tgd_frontier_horse_archer_desc: "Cavalerie légère recrutée parmi les populations mixtes de la frontière, turques, sogdiennes et chinoises. Des raiders rapides et agiles, experts dans la reconnaissance, le flanc et le harcèlement des lignes de ravitaillement ennemies."
 a_nd_tgd_shencea_guards: "Gardes impériaux de Shencea"
 a_nd_tgd_shencea_guards_desc: "L'armée d'élite de Shencea, à l'origine la garde du corps personnelle de l'empereur, est devenue la formation militaire la plus puissante de feu Tang, professionnelle, disciplinée et farouchement loyale."
 a_nd_tgd_fubing_militia: "Milice Fubing"
 a_nd_tgd_fubing_militia_desc: "Des agriculteurs-soldats servant en rotation dans le cadre du système fubing, fournissant une vaste réserve d'infanterie entraînée à un coût minime pour l'État."
 a_nd_tgd_frontier_levy_cavalry: "Cavalerie de prélèvement aux frontières"
 a_nd_tgd_frontier_levy_cavalry_desc: "Cavaliers mixtes des steppes turques et chinoises issus des garnisons frontalières, combinant les compétences d'équitation nomades avec la discipline militaire Tang."
 nd_tgd_caravanserai: "Caravansérail de la Route de la Soie"
 nd_tgd_caravanserai_desc: "Un relais fortifié le long de la Route de la Soie offrant un abri, de la nourriture, du fourrage et un marché sécurisé aux caravanes marchandes traversant les routes commerciales occidentales."
 nd_tgd_woodblock_printshop: "Woodblock Print Shop"
 nd_tgd_woodblock_printshop_desc: "A workshop of block carvers and printers. Texts are cut in reverse into pear and jujube wood, inked and pressed onto paper, sheet after sheet."
 nd_tgd_woodblock_printing_pm: "Block Printing"
 nd_tgd_woodblock_printing_pm_desc: "Paper, carved wooden blocks and ink are made into printed books."
 nd_tgd_steam_filature: "Steam Filature"
 nd_tgd_steam_filature_desc: "Coal fired reeling machines and power looms turn raw silk into fine cloth in far greater quantity than the hand loom."
 nd_tgd_sancai_kiln: "Four à céramique Sancai"
 nd_tgd_sancai_kiln_desc: "Fours spécialisés produisant le célèbre Tang sancai (poterie émaillée tricolore ambre, vert et crème) prisé comme produits de luxe et cadeaux diplomatiques dans toute l'Eurasie."
 nd_tgd_frontier_garrison: "Garnison frontière"
 nd_tgd_frontier_garrison_desc: "Un poste de commandement militaire jiedushi à la frontière, maintenant une garnison professionnelle permanente pour se défendre contre les incursions nomades et projeter l'autorité impériale."
 nd_tgd_grotto_temple: "Temple-grotte bouddhiste"
 nd_tgd_grotto_temple_desc: "Un complexe de temples troglodytes creusé à flanc de falaise, décoré de peintures murales et de bouddhas sculptés. Centres de dévotion, d'érudition et de réalisation artistique dans la tradition bouddhiste Tang."
 nd_tgd_hanlin_academy: "Académie impériale de Hanlin"
 nd_tgd_hanlin_academy_desc: "La plus haute institution scientifique de l'empire, où les diplômés jinshi les plus brillants rédigent des édits impériaux, compilent des histoires et conseillent le Fils du Ciel sur les questions d'État."
 nd_tgd_silk_workshop: "Atelier Impérial de Soie"
 nd_tgd_silk_workshop_desc: "Des ateliers de tissage de la soie supervisés par l'État produisent les plus beaux textiles du monde, des brocarts, des gazes et des damas destinés aux marchés de Nara à Bagdad."
 nd_tgd_relay_station: "Station relais impériale"
 nd_tgd_relay_station_desc: "Une station routière entretenant des chevaux frais et des provisions pour les courriers impériaux, permettant aux messages de voyager de la capitale à la frontière en quelques jours plutôt qu'en semaines."
 nd_tgd_caravan_upkeep: "Entretien de la station de caravane"
 nd_tgd_caravan_upkeep_desc: "Entretien du caravansérail, y compris le fourrage pour les bêtes de somme, le tissu pour l'emballage des marchandises commerciales et le bois pour les réparations structurelles."
 nd_tgd_sancai_production: "Cuisson de la poterie Sancai"
 nd_tgd_sancai_production_desc: "La production de céramiques émaillées tricolores à partir d'argile locale, d'émaux à base de plomb et de températures de four soigneusement contrôlées."
 nd_tgd_garrison_upkeep: "Approvisionnement de la garnison"
 nd_tgd_garrison_upkeep_desc: "Fournitures militaires pour la garnison frontalière, notamment des armes, de l'équipement pour chevaux, des uniformes et du bétail pour les rations."
 nd_tgd_grotto_maintenance: "Entretien du temple de la grotte"
 nd_tgd_grotto_maintenance_desc: "Entretien du complexe du temple troglodytique, y compris la sculpture sur pierre, les pigments colorants pour la restauration des peintures murales, la cire d'abeille pour les bougies dévotionnelles et l'encens pour le culte."
 nd_tgd_academy_upkeep: "Entretien de l'Académie"
 nd_tgd_academy_upkeep_desc: "Fournitures scolaires pour l'Académie impériale, notamment du papier pour les examens, des livres pour la bibliothèque et de la soie pour les documents officiels."
 nd_tgd_silk_weaving: "Tissage de la soie impériale"
 nd_tgd_silk_weaving_desc: "La production de tissus fins de luxe à partir de soie brute et de teintures, en utilisant des techniques de tissage traditionnelles Tang perfectionnées au fil des siècles."
 nd_tgd_relay_upkeep: "Entretien de la station relais"
 nd_tgd_relay_upkeep_desc: "Approvisionnement de la station relais en chevaux frais, en céréales pour les cavaliers et les montures, et en bois pour l'entretien de la structure."
 levy_nd_tgd_frontier_cavalry: "Prélèvement de cavalerie frontalière"
 levy_nd_tgd_frontier_cavalry_desc: "Cavalerie des steppes issue des garnisons frontalières, combinant les traditions d'équitation turques avec l'organisation militaire Tang."
 levy_nd_tgd_fubing: "Prélèvement de la milice Fubing"
 levy_nd_tgd_fubing_desc: "Des agriculteurs-soldats appelés aux armes dans le cadre du système de service par rotation fubing, fournissant des réserves d'infanterie entraînées à un coût minime."
 nd_tgd_tea_house: "Maison de transformation du thé"
 nd_tgd_tea_house_desc: "A workshop where tea leaf is steamed, pounded and pressed into bricks that travel to the frontier markets, where they are exchanged for horses."
 nd_tgd_tea_processing: "Brick Tea Pressing"
 nd_tgd_tea_processing_desc: "Tea leaf and firewood for steaming and pressing the bricks sent to the horse markets."
 nd_tgd_gunpowder_foundry: "Fonderie de poudre à canon"
 nd_tgd_gunpowder_foundry_desc: "Un atelier militaire produisant des flèches de feu, des bombes incendiaires et des proto-fusées à partir de salpêtre, de fer et d'autres matériaux, application pratique des découvertes alchimiques Tang."
 nd_tgd_fire_arrow_production: "Production de flèches de feu"
 nd_tgd_fire_arrow_production_desc: "La fabrication de flèches de feu et d'armes incendiaires à base de mélanges de poudre à canon, d'armes de siège et anti-cavalerie dévastatrices."
 nd_tgd_canal_warehouse: "Entrepôt du Grand Canal"
 nd_tgd_canal_warehouse_desc: "Un important centre de stockage et de distribution le long du Grand Canal, facilitant la circulation des céréales, de la soie et des produits manufacturés entre le nord et le sud de la Chine."
 nd_tgd_canal_operations: "Opérations des canaux"
 nd_tgd_canal_operations_desc: "Entretien et exploitation du complexe d'entrepôts du Grand Canal, y compris la réparation des quais, les installations de stockage et la manutention des marchandises."
 nd_tgd_export_ceramics: "Exporter la céramique"
 nd_tgd_export_ceramics_desc: "Production en série d'articles en porcelaine décorée pour les marchés d'exportation à travers l'Eurasie, en utilisant des techniques de glaçage raffinées et des conceptions standardisées."
 nd_tgd_examination_hall: "Salle d'examen confucianiste"
 nd_tgd_examination_hall_desc: "Une salle d'examen provinciale où les candidats jinshi sont testés sur leur composition littéraire, leur analyse politique et leur philosophie morale, la porte d'entrée méritocratique vers le service impérial."
 nd_tgd_examination_upkeep: "Entretien des examens"
 nd_tgd_examination_upkeep_desc: "Fournitures pour le système d'examen, notamment du papier pour les livrets d'examen, des textes de référence pour les examinateurs et du tissu pour l'identification des candidats."
 nd_tgd_border_watchtower: "Tour de guet frontalière"
 nd_tgd_border_watchtower_desc: "Une tour de signalisation à la frontière fournit une alerte précoce en cas d'incursions nomades grâce à des feux de balise visibles sur de vastes distances de steppe et de désert."
 nd_tgd_watchtower_upkeep: "Entretien de la tour de guet"
 nd_tgd_watchtower_upkeep_desc: "Entretien de la tour de guet frontalière, y compris les armes pour la garnison, le bois pour les réparations structurelles et la pierre pour la fortification."
 nd_tgd_formed_tt: "La dynastie Tang a été formée"
 nd_tgd_path_a_tt: "Choisissez la restauration occidentale"
 nd_tgd_path_b_tt: "Choisissez l’ascendant culturel"
 nd_tgd_dest_changan_developed_tt: "Owns #bold Chang'an#! (Jingzhao) and its development is at least #bold 43#!"
 nd_tgd_dest_luoyang_developed_tt: "Owns #bold Luoyang#! and its development is at least #bold 76#!"
 nd_tgd_destiny: "Le destin des Tang"
 nd_tgd_destiny_desc: "La dynastie Tang a été restaurée. Une fois la stabilité assurée, le Fils du Ciel doit maintenant choisir une voie pour l'avenir de l'empire : la conquête vers l'ouest pour récupérer les protectorats, ou la culture intérieure des arts et du savoir qui ont défini la civilisation Tang à son apogée."
 nd_tgd_dest_silk_road_command: "Commandement de la Route de la Soie"
 nd_tgd_dest_silk_road_command_desc: "Sécurisez les grandes villes de la Route de la Soie, Samarkand et Boukhara. Le contrôle de ces anciens carrefours signifie la domination sur les artères commerciales les plus riches reliant l’Est et l’Ouest."
 nd_tgd_dest_steppe_hegemony: "Hégémonie des steppes"
 nd_tgd_dest_steppe_hegemony_desc: "Étendre l'autorité des Tang sur le cœur mongol de Karakorum et la porte bactrienne de Balkh. La steppe doit s'incliner devant le Trône du Dragon avant que la marche puisse continuer."
 nd_tgd_dest_tianxia_restored: "Tianxia restaurée"
 nd_tgd_dest_tianxia_restored_desc: "Terminez la restauration de All Under Heaven en plantant des bannières Tang à Delhi et à Bagdad. Ces deux anciennes capitales marquent l’horizon le plus lointain de l’ambition Tang, un empire universel s’étendant du fleuve Jaune à l’Euphrate."
 nd_tgd_dest_literary_canon: "Le canon littéraire"
 nd_tgd_dest_literary_canon_desc: "Cultivate a literary and institutional renaissance that surpasses even the original Tang golden age. Embrace banking and raise Chang'an, the city of the poets, above what it was."
 nd_tgd_dest_universal_learning: "Apprentissage universel"
 nd_tgd_dest_universal_learning_desc: "Faire de la capitale Tang le centre du commerce mondial et de l'érudition. Assurez-vous que la soie circule sur vos marchés et remplissez votre trésorerie pour financer le plus grand système universitaire que le monde ait jamais vu."
 nd_tgd_dest_celestial_mandate: "Le mandat céleste"
 nd_tgd_dest_celestial_mandate_desc: "Achieve the ultimate synthesis of knowledge and civilization. Embrace the printing press, rebuild Luoyang, the eastern capital, to twice its size, and demonstrate that Tang learning encompasses all fields of human inquiry."
 nd_tgd.7.t: "Le mandat perdure"
 nd_tgd.7.d: "The empire stands stable. From the terraces of the Daming Palace, the restored Tang surveys a realm at peace, a realm that awaits the direction its new master will give it. The question before the Son of Heaven is not whether the Tang will endure, but what form its endurance will take.\n\nThe ancestors built an empire that straddled the known world. They also built a civilization that illuminated it. Both paths lie open."
 nd_tgd.7.a: "Le mandat perdure."
 nd_tgd.8.t: "Les quatre garnisons sécurisées"
 nd_tgd.8.d: "When General Guo Xiaoke captured Kucha in 648, he established the pattern for all Tang operations in the Western Regions: swift cavalry strikes followed by permanent garrison towns connected by relay stations. Now Samarkand and Bukhara, cities that even Emperor Taizong only reached through diplomacy, fly our banner.\n\nSogdian merchants who once traded under Turkic protection now acknowledge Tang suzerainty. The great bazaars of Transoxiana funnel their wealth eastward along roads patrolled by our cavalry. What Taizong dreamed: we have accomplished."
 nd_tgd.8.a: "La Route de la Soie répond au Trône du Dragon."
 nd_tgd.9.t: "Les arcs des steppes"
 nd_tgd.9.d: "Karakorum, seat of Genghis Khan's empire, now acknowledges Tang authority. Balkh, the 'Mother of Cities' that Alexander the Great once conquered, falls under our protection. The steppe peoples who for centuries threatened the northern frontier have been brought within the imperial order.\n\nThis achievement surpasses anything the original Tang accomplished. Even at its zenith, the Tang's control of the steppe was contested and temporary. We have made it permanent. The question now is how best to govern these vast conquests."
 nd_tgd.9.a: "Extrayez un hommage pour financer l’expansion impériale."
 nd_tgd.9.b: "Adopter la mobilité nomade pour nos armées."
 nd_tgd.10.t: "Tout sous le ciel"
 nd_tgd.10.d: "Delhi and Baghdad, twin poles of world civilization, now acknowledge the supremacy of the Dragon Throne. No empire in history has achieved what we have accomplished: a single sovereign authority stretching from the rice paddies of the Yangtze to the bazaars of Mesopotamia, from the steppes of Mongolia to the Gangetic plain.\n\nThe Tang at its original height was one great power among several. The Tang restored is something else entirely, a universal empire that has absorbed or subordinated every major civilization on the Eurasian mainland. The concept of Tianxia, 'All Under Heaven,' is no longer a philosophical ideal. It is a geopolitical reality."
 nd_tgd.10.a: "Établissez la Pax Sinica sur tous les pays."
 nd_tgd.10.b: "Le mandat exige une expansion éternelle."
 nd_tgd.11.t: "Le nouveau canon littéraire"
 nd_tgd.11.d: "Li Bai wrote of moonlight and wine. Du Fu mourned the suffering of the common people. Wang Wei painted landscapes that dissolved the boundary between word and image. For centuries, their works defined the summit of human literary achievement.\n\nNow a new generation of poets, essayists, and philosophers has emerged, heirs to the Tang tradition who have absorbed and transcended it. Banks fund scholarly expeditions. New printing techniques spread knowledge faster than ever before. The empire's vast population, more literate than ever, hungers for texts of every kind."
 nd_tgd.11.a: "Un nouvel âge d’or des lettres commence."
 nd_tgd.12.t: "L'Académie de toutes les nations"
 nd_tgd.12.d: "The original Hanlin Academy gathered China's finest minds in a single institution. What we have built dwarfs it in every dimension. Our academies attract scholars from every nation, Persian astronomers, Indian mathematicians, Turkic linguists, Korean historians. Silk revenue funds endowed chairs and research programs.\n\nThe capital's markets overflow with the products of this intellectual ferment: astronomical instruments, medical treatises, geographical atlases, and engineering manuals. Where Tang scholars once translated Buddhist sutras from Sanskrit, our academics synthesize knowledge from every tradition into a unified corpus."
 nd_tgd.12.a: "J'ai fondé des académies à travers tout l'empire."
 nd_tgd.12.b: "Laissez les commerçants et les érudits s’enrichir mutuellement."
 nd_tgd.13.t: "La bibliothèque céleste"
 nd_tgd.13.d: "The Siku Quanshu, the Complete Library of the Four Treasuries, was a dream of total knowledge: every book worth preserving, copied, catalogued, and stored for eternity. We have surpassed even that ambition.\n\nOur Imperial Library contains not merely Chinese texts but the accumulated wisdom of every civilization our scholars have encountered. Greek philosophy sits beside Buddhist metaphysics. Arab algebra illuminates Confucian cosmology. Indian medicine complements Chinese pharmacology. This is not merely a collection of books. It is the complete intellectual heritage of humanity, gathered under one roof and synthesized into a coherent whole."
 nd_tgd.13.a: "Harmonie de tout apprentissage sous le ciel."
 nd_tgd.13.b: "Laissez une centaine d’écoles de pensée s’affronter."
 STATIC_MODIFIER_NAME_nd_tgd_dest_iron_tribute: "Hommage de fer"
 STATIC_MODIFIER_DESC_nd_tgd_dest_iron_tribute: "Les peuples des steppes conquis paient un tribut en chevaux, bétail et argent, enrichissant le trésor impérial et finançant de nouvelles campagnes d'expansion."
 STATIC_MODIFIER_NAME_nd_tgd_dest_steppe_logistics: "Logistique des steppes"
 STATIC_MODIFIER_DESC_nd_tgd_dest_steppe_logistics: "Les techniques d'équitation nomades et les vastes troupeaux de chevaux des peuples des steppes conquises ont été intégrés dans la doctrine militaire Tang, améliorant ainsi la vitesse et la récupération de l'armée."
 STATIC_MODIFIER_NAME_nd_tgd_dest_pax_sinica: "Pax Sinica"
 STATIC_MODIFIER_DESC_nd_tgd_dest_pax_sinica: "With all major civilizations under Tang authority, a universal peace descends. The roads are safe, and peoples of every origin settle within the cosmopolitan Tang order."
 STATIC_MODIFIER_NAME_nd_tgd_dest_mandate_of_conquest: "Mandat de conquête"
 STATIC_MODIFIER_DESC_nd_tgd_dest_mandate_of_conquest: "Le mandat du Fils du Ciel exige que toutes les terres reconnaissent sa souveraineté. Chaque nouvelle victoire amplifie le prestige Tang et réduit le coût des campagnes ultérieures."
 STATIC_MODIFIER_NAME_nd_tgd_dest_academy_network: "Réseau d'académies"
 STATIC_MODIFIER_DESC_nd_tgd_dest_academy_network: "Un réseau d'académies impériales à travers les provinces améliore l'alphabétisation et la production alimentaire grâce à l'application des connaissances savantes à l'agriculture et à la gouvernance."
 STATIC_MODIFIER_NAME_nd_tgd_dest_merchant_scholars: "Érudits marchands"
 STATIC_MODIFIER_DESC_nd_tgd_dest_merchant_scholars: "La fusion de la richesse commerciale et de l’ambition scientifique produit une classe de marchands érudits qui étendent l’influence culturelle Tang à travers des routes commerciales atteignant tous les coins du monde connu."
 STATIC_MODIFIER_NAME_nd_tgd_dest_confucian_synthesis: "Synthèse confucéenne"
 STATIC_MODIFIER_DESC_nd_tgd_dest_confucian_synthesis: "Une grande synthèse des pensées confucianiste, bouddhiste et taoïste produit un cadre philosophique unifié qui réduit le coût de l’adoption institutionnelle et renforce le contrôle administratif."
 STATIC_MODIFIER_NAME_nd_tgd_dest_hundred_schools: "Cent écoles renaissent"
 STATIC_MODIFIER_DESC_nd_tgd_dest_hundred_schools: "Le pluralisme intellectuel s’épanouit alors que des écoles de pensée concurrentes (légalistes, mohistes, taoïstes, confucianistes et traditions étrangères) stimulent l’innovation dans tous les domaines de la connaissance humaine."
 nd_tgd_protectorate_command: "Commandement du Protectorat"
 nd_tgd_protectorate_command_desc: "Le quartier général militaire suprême de toutes les opérations Tang dans les territoires occidentaux, combinant le commandement de garnison, la collecte de renseignements et la coordination diplomatique sous une seule autorité."
 nd_tgd_protectorate_upkeep: "Provisionnement des commandes"
 nd_tgd_protectorate_upkeep_desc: "Fournitures militaires pour le commandement du protectorat, notamment des armes, des montures de cavalerie, de l'équipement en cuir et des pierres pour la fortification."
 nd_tgd_imperial_library: "Bibliothèque impériale"
 nd_tgd_imperial_library_desc: "Le plus grand référentiel de connaissances de l’histoire de l’humanité, hébergeant des textes de toutes les civilisations et les synthétisant en un corpus unifié d’apprentissage qui fait progresser tous les domaines de la recherche humaine."
 nd_tgd_library_upkeep: "Entretien de la bibliothèque"
 nd_tgd_library_upkeep_desc: "Entretien de la bibliothèque impériale, notamment du papier pour copier les textes, des livres pour les acquisitions, de la soie pour la reliure et de l'encens pour préserver les manuscrits des parasites."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_tgd_bureaucracy_authority: "Appareil impérial Da Tang"
 AUTO_MODIFIER_DESC_nd_tgd_bureaucracy_authority: "The reconstituted Tang state inherits the Sansheng Liubu trinity, the Yu-shi-tai with its six Liushi censorial bureaus, and the Hanlin scholars founded under Xuanzong in 738. Three institutional slots open, allowing the dynasty to entrench three of its six great Tang offices."

 tgd_sansheng_liubu_bureaucracy: "Sansheng Liubu"
 tgd_sansheng_liubu_bureaucracy_desc: "Les trois départements et six conseils : le Zhongshu (Secrétariat impérial) rédigeait des édits, le Menxia (Chancellerie) les révisait et pouvait y opposer son veto, et le Shangshu (Département des Affaires d'État) exécutait la politique approuvée par l'intermédiaire des six conseils du personnel, des revenus, des rites, de la guerre, de la justice et des travaux. Héritée et raffinée des Sui, la forme Tang est le modèle institutionnel que chaque dynastie chinoise ultérieure (Song, Yuan, Ming, Qing) a adapté. Lorsqu'ils travaillent, les édits rédigés passent l'examen et parviennent aux provinces; Lorsque les trois départements se retrouvent dans une impasse, la chancellerie oppose son veto plus rapidement que le secrétariat ne peut rédiger, et les conseils d'administration cessent d'exécuter."

 tgd_keju_examinations_bureaucracy: "Examens Tang Keju"
 tgd_keju_examinations_bureaucracy_desc: "Les Tang ont hérité de l'innovation de l'examen Sui et ont élevé le diplôme jinshi (655) dans la voie du prestige, aux côtés du mingjing (classiques), du mingfa (droit), du mingsuan (mathématiques) et d'autres filières. L'impératrice Wu Zetian a ouvert les examens à une base de candidats beaucoup plus large, environ 690 personnes, et a utilisé les cohortes jinshi qui en ont résulté pour briser l'emprise du grand clan sur les hautes fonctions. Une classe officielle d'érudits et de fonctionnaires lettrés s'élève au mérite ; l'aristocratie héréditaire est définitivement exclue des postes civils les plus élevés. Lorsque le système se détériore, les documents fuient, les examinateurs sont soudoyés et le factionnalisme de la clique poétique remplace la compétence administrative."

 tgd_juntian_zuyongdiao_bureaucracy: "Juntien et Zu-Yong-Diao"
 tgd_juntian_zuyongdiao_bureaucracy_desc: "Le système d'égalité des champs (Juntien) accordait à chaque homme adulte une part personnelle et une part d'héritage des terres des réserves impériales ; en échange, il devait du Zu (des céréales), du Yong (un service de travail annuel de vingt jours) et du Diao (un morceau de tissu). Reconstruit à partir du précédent Wei du Nord et codifié dans le Code Tang, le système a transformé chaque agriculteur en un soldat-contribuable enregistré. Il a financé le haut Tang depuis le règne de Taizong jusqu'au début du VIIIe siècle. Une fois que de puissants clans ont commencé à absorber les parcelles paysannes, les registres ont divergé de la réalité et les 780 Liang Shui Fa les ont remplacés : le même sort attend toute version négligée du système."

 tgd_fubing_militia_bureaucracy: "Système de milice Fubing"
 tgd_fubing_militia_bureaucracy_desc: "De 606 à 749, le système Fubing recrutait lui-même des soldats à partir de listes égales : chaque garnison fu envoyait des hommes à tour de rôle vers la capitale et la frontière pour des périodes de service, et les soldats payaient leur propre subsistance à partir de la part de terre qu'ils détenaient chez eux. Le résultat fut une vaste armée bon marché de soldats-propriétaires motivés et fidèles au trône. L'effondrement du système a reflété celui du système d'égalité des champs : alors que les registres fonciers étaient fictifs et que les rotations n'étaient pas remplies, les Tang se sont tournés vers le bingmu professionnel et vers les armées stationnées aux frontières sous Jiedushi - dont la loyauté envers leur commandant, et non le trône, a mis fin à la dynastie."

 tgd_yushitai_censorate_bureaucracy: "Yu-shi-tai et les Six Bureaux"
 tgd_yushitai_censorate_bureaucracy_desc: "Dirigé par le Yushi Dafu, le Censorat Tang a organisé son travail à travers trois divisions : les censeurs de Taiyuan à la cour, les censeurs du personnel de Dianyuan qui s'occupent du gouvernement quotidien et les censeurs d'enquête Chayuan qui vérifient les fonctionnaires partout dans le royaume, les six bureaux de Liushi affectant un observateur dédié à chaque conseil principal. Les censeurs détenaient le droit de rendre hommage directement à l'empereur et pouvaient destituer n'importe quel fonctionnaire, y compris les grands conseillers. Une censure vigoureuse a maintenu l'honnêteté de l'administration ; un pays capturé, avec des censeurs soudoyés par les grands clans qu'ils étaient censés surveiller, accéléra le déclin dynastique."

 tgd_jiedushi_protectorates_bureaucracy: "Jiedushi et protectorats frontaliers"
 tgd_jiedushi_protectorates_bureaucracy_desc: "Le Protectorat d'Anxi (640) administrait le bassin du Tarim et les régions occidentales; le protectorat d'Anbei (647) gouvernait les nomades des steppes; la réorganisation Anxi-Beiting a étendu la portée des Tang jusqu'au Pamir. À partir de 711, ceux-ci se sont cristallisés dans les commandements Jiedushi : des commissaires militaires détenant une autorité militaire, fiscale et civile consolidée le long de la frontière. Le système a donné aux hauts Tang une profondeur stratégique et une résilience d’approvisionnement sans précédent. Cela donna également à An Lushan, Jiedushi des trois commandements frontaliers, les ressources nécessaires pour marcher sur Chang'an en 755 - la rébellion qui brisa à jamais le pouvoir central Tang."
