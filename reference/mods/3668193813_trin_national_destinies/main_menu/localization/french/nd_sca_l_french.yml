l_french:
 STATIC_MODIFIER_NAME_nd_sca_lords_of_the_northern_seas: "Seigneurs des mers du Nord"
 STATIC_MODIFIER_DESC_nd_sca_lords_of_the_northern_seas: "Le Nord uni contrôle les eaux de l’Arctique à la Baltique. Nos quilles coupent chaque vague, nos marchands remplissent chaque port et nos navires de guerre gardent les détroits étroits que tous doivent traverser."
 STATIC_MODIFIER_NAME_nd_sca_all_thing_of_the_north: "Tout-chose du Nord"
 STATIC_MODIFIER_DESC_nd_sca_all_thing_of_the_north: "Depuis les anciennes assemblées des Thing jusqu’aux chambres du conseil de l’union, les Scandinaves ont gouverné par le consentement et la loi. Ce royaume n’est pas limité par la seule conquête mais par la coutume partagée et la voix des hommes libres."
 nd_sca.1.t: "L'unification de la Scandinavie"
 nd_sca.1.d: "The dream that Margaret I once held (a single crown uniting Denmark, Norway, and Sweden) has been realized anew. Where the Kalmar Union was undone by rivalry and distance, this Scandinavian realm stands on firmer foundations. From the herring-rich waters of the Sound to the iron mountains of Bergslagen, from the fjords of Norway to the forests of Finland, one people now speaks with one voice.\n\nBut what voice shall it be? Shall we look outward, as our Viking ancestors did, commanding the seas and building an empire of trade and sail? Or shall we look inward, binding our diverse peoples through the ancient tradition of the Thing, governance by assembly, law, and consent?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sca.1.a: "Notre destin repose sur les vagues."
 nd_sca.1.b: "La loi et l’assemblée nous uniront."
 STATIC_MODIFIER_NAME_nd_sca_reformation_zeal: "Zèle de Réforme"
 STATIC_MODIFIER_DESC_nd_sca_reformation_zeal: "La pure parole de l'Évangile, prêchée dans les langues du Nord, a balayé la vieille église latine. Notre peuple adore avec une conviction renouvelée."
 STATIC_MODIFIER_NAME_nd_sca_crown_over_church: "Couronne sur l'église"
 STATIC_MODIFIER_DESC_nd_sca_crown_over_church: "En s'emparant des terres de l'Église et en plaçant les évêques sous l'autorité royale, la couronne scandinave a acquis une immense richesse et un contrôle incontesté sur la vie spirituelle du royaume."
 nd_sca.2.t: "La Réforme du Nord"
 nd_sca.2.d: "The winds of religious reform sweeping through Europe have found fertile ground in Scandinavia. Following the lead of Martin Luther, reformers like Hans Tausen in Denmark and Olaus Petri in Sweden have translated scripture into the vernacular tongues of the North. The old Catholic hierarchy, already weakened by distance from Rome and the independence of Nordic bishops, has crumbled before the new faith.\n\nChristian III of Denmark and Gustav Vasa of Sweden have both seen the political advantages of reform, vast church lands can be seized for the crown, and national churches under royal control strengthen state authority. But the Reformation is more than a land grab. For common Scandinavians, hearing the Gospel in their own language for the first time is a profound spiritual experience.\n\nHow shall this united North shape its reformed church?"
 nd_sca.2.a: "Que l'Évangile soit prêché dans toutes les langues du Nord."
 nd_sca.2.b: "La richesse de l'Église appartient à la couronne."
 STATIC_MODIFIER_NAME_nd_sca_carolean_fury: "Cold Steel"
 STATIC_MODIFIER_DESC_nd_sca_carolean_fury: "Cold steel and an unflinching advance under fire have made Scandinavian infantry the terror of European battlefields."
 STATIC_MODIFIER_NAME_nd_sca_allotment_discipline: "Muster Discipline"
 STATIC_MODIFIER_DESC_nd_sca_allotment_discipline: "Every farm district keeps a soldier in peacetime and fields him in war. The realm can mobilize with remarkable speed and at small cost."
 nd_sca.3.t: "Cold Steel"
 nd_sca.3.d: "The articles of war have made one army of the realm's many regiments. The model is the army of Charles XI and Charles XII, whose soldiers were kept by the farms of their own province and drilled the year round.\n\nOn the battlefield that army rejected the European habit of standing volley fire. Its infantry advanced in silence under enemy musketry until close range, delivered a single volley and went in at once with bayonet and pike: the ga-pa doctrine. At Narva, eight thousand of them shattered a Russian army of forty thousand.\n\nHow shall Scandinavia carry this martial legacy forward?"
 nd_sca.3.a: "Le ga-pa brisera n'importe quelle ligne !"
 nd_sca.3.b: "The muster rolls are our true strength."
 nd_sca.4.t: "La Grande Montagne de Cuivre"
 nd_sca.4.d: "For centuries, the copper mine at Falun has been the treasury of the North. At its peak in the mid-seventeenth century, the Great Copper Mountain produced two-thirds of all the copper in Europe. The Privy Council called it the realm's strongest fortification (not of stone, but of coin. Swedish wars, diplomacy, and state-building were financed by Falun's endless seams of ore.\n\nThe fire-setting method) enormous bonfires lit deep underground to crack the rock, has carved out chambers of cathedral proportions. When the great cave-in of 1687 opened a pit visible for miles, it only revealed how much had already been extracted. The mine endures, a monument to Nordic industry and the patient extraction of wealth from unyielding stone."
 nd_sca.4.a: "La richesse de la montagne sert le royaume."
 nd_sca_thing_assemblies: "Assemblages d'objets"
 nd_sca_thing_assemblies_desc: "La tradition scandinave de la Chose (des assemblées en plein air où des hommes libres se réunissaient pour régler des différends, déclarer la loi et choisir des dirigeants) a façonné la gouvernance dans le monde nordique."
 nd_sca_viking_seamanship: "Matelotage viking"
 nd_sca_viking_seamanship_desc: "Des générations de compétences maritimes nordiques, perfectionnées au large de l’Atlantique et de la Baltique, perdurent dans les traditions de construction navale et les connaissances en navigation des peuples scandinaves."
 nd_sca_stave_church_tradition: "Tradition de l'église en bois debout"
 nd_sca_stave_church_tradition_desc: "Les églises en bois debout de Norvège et de Suède, mêlant dévotion chrétienne et savoir-faire nordique, constituent des monuments de la synthèse culturelle unique de la Scandinavie."
 nd_sca_norse_runic_legacy: "Héritage runique nordique"
 nd_sca_norse_runic_legacy_desc: "La tradition runique du Nord, des pierres commémoratives aux archives administratives, a favorisé une culture d'alphabétisation et de tenue de registres antérieure à l'apprentissage du latin en Scandinavie."
 nd_sca_allodial_rights: "Droits allodiaux"
 nd_sca_allodial_rights_desc: "The Scandinavian tradition of odelsrett, the right of families to own and inherit land free from feudal obligation, created a class of independent freeholders unmatched in Europe. Every freeholder kept arms by law and answered the levy in person."
 nd_sca_herring_markets: "Marchés du hareng"
 nd_sca_herring_markets_desc: "Les grands marchés du hareng de Scanie attiraient des marchands de toute l'Europe du Nord, faisant du commerce du hareng salé l'un des fondements du commerce scandinave."
 nd_sca_bergslagen_ironworks: "Usine sidérurgique de Bergslagen"
 nd_sca_bergslagen_ironworks_desc: "Les mines de fer et de cuivre du district de Bergslagen, dans le centre de la Suède, fournissent des matières premières pour les outils, les armes et l'exportation depuis la période médiévale."
 nd_sca_hanseatic_challenge: "Défi hanséatique"
 nd_sca_hanseatic_challenge_desc: "En brisant l'emprise commerciale de la Ligue hanséatique, les marchands scandinaves ont établi leurs propres réseaux commerciaux à travers la Baltique et la mer du Nord."
 nd_sca_nordic_law_codes: "Codes juridiques nordiques"
 nd_sca_nordic_law_codes_desc: "La codification des lois provinciales nordiques, du code national norvégien de Magnus Lagabote aux lois provinciales suédoises, a créé un cadre juridique unifié pour la gouvernance."
 nd_sca_scandinavian_court_culture: "Culture de cour scandinave"
 nd_sca_scandinavian_court_culture_desc: "L'apprentissage de la Renaissance et le mécénat artistique aux cours de Copenhague et de Stockholm ont favorisé une identité culturelle scandinave distinctive."
 nd_sca_naval_yards: "Chantiers navals nordiques"
 nd_sca_naval_yards_desc: "Les chantiers navals royaux spécialement construits à Copenhague, Karlskrona et dans d'autres ports ont donné à la Scandinavie la capacité de construire et d'entretenir de puissantes flottes baltes."
 nd_sca_northern_reformation: "Réforme du Nord"
 nd_sca_northern_reformation_desc: "L’adoption du luthéranisme dans toute la Scandinavie a transformé l’Église en un instrument du pouvoir d’État tout en donnant aux gens ordinaires les Écritures dans leur propre langue."
 nd_sca_hakkapeliitta_tradition: "Finnish Horse"
 nd_sca_hakkapeliitta_tradition_desc: "The huovit, mounted men kept at the crown's castles in Finland, ride small hardy horses on raids along the eastern frontier and strike before an enemy has formed. Their grandsons will be called the Hakkapeliitta."
 nd_sca_baltic_dominion: "Domination Baltique"
 nd_sca_baltic_dominion_desc: "Le contrôle scandinave des deux rives de la mer Baltique a fait de la région un lac nordique, doté d'une puissance diplomatique et navale à la hauteur."
 nd_sca_falun_copper_mountain: "La Grande Montagne de Cuivre"
 nd_sca_falun_copper_mountain_desc: "La mine de cuivre de Falun, qui produisait les deux tiers du cuivre d'Europe à son apogée, était considérée comme la plus grande fortification du royaume : sa richesse finança les guerres et la gouvernance suédoises pendant des siècles."
 nd_sca_swedish_navy_expansion: "Expansion de la marine suédoise"
 nd_sca_swedish_navy_expansion_desc: "L’expansion de la marine royale suédoise d’une force de défense côtière à une flotte hauturière capable de projeter sa puissance à travers la Baltique et au-delà."
 nd_sca_adelsvalde: "Adelsvalde"
 nd_sca_adelsvalde_desc: "L'époque de la domination noble dans la politique scandinave, lorsque l'aristocratie contrôlait une grande partie de la terre, de l'armée et de l'appareil gouvernemental."
 nd_sca_timber_exports: "Exportations de bois"
 nd_sca_timber_exports_desc: "Les vastes forêts de Scandinavie ont fourni à l'Europe du bois, du goudron et des réserves navales, des matériaux essentiels à l'ère de la voile et au boom de la construction des premières villes modernes."
 nd_sca_crown_reduction: "Réduction de la couronne"
 nd_sca_crown_reduction_desc: "La réduction de Charles XI, la récupération systématique des terres de la couronne aliénées à la noblesse, rétablissent les finances royales et brisent le pouvoir des grands magnats."
 nd_sca_carolean_tradition: "Articles of War"
 nd_sca_carolean_tradition_desc: "The articles of war are read to every company and bind officer and private to the same drill, the same prayers and the same punishments. Infantry trained under them holds its fire until the range is short and then goes in with the bayonet."
 nd_sca_indelningsverket: "Knektehållet"
 nd_sca_indelningsverket_desc: "By the contract of 1682 each province keeps a regiment of foot in perpetuity. Its farms are grouped into rotes, and every rote keeps one soldier and gives him a croft, so that a trained army is maintained cheaply in peace and mustered quickly for war."
 nd_sca_linjeskip_fleet: "Flotte de navires de ligne"
 nd_sca_linjeskip_fleet_desc: "La construction de navires de ligne dédiés a donné à la marine scandinave la puissance de feu nécessaire pour affronter les grandes puissances maritimes en bataille ouverte."
 nd_sca_scandinavian_absolutism: "Absolutisme scandinave"
 nd_sca_scandinavian_absolutism_desc: "La transition vers une monarchie absolue au Danemark, en Norvège et en Suède a centralisé le pouvoir de l'État, permettant des programmes de construction et de réforme administrative ambitieux."
 nd_sca_scandinavian_east_india: "Entreprises scandinaves des Indes orientales"
 nd_sca_scandinavian_east_india_desc: "Les Compagnies danoise et suédoise des Indes orientales ont ouvert des routes commerciales directes vers l'Asie, important du thé, de la porcelaine et de la soie tout en établissant des avant-postes coloniaux de Tranquebar à Canton."
 nd_sca_nordic_enlightenment: "Lumières nordiques"
 nd_sca_nordic_enlightenment_desc: "Le siècle des Lumières en Scandinavie a favorisé la recherche scientifique, la réforme universitaire et le développement de l'alphabétisation, en s'appuyant sur la forte tradition éducative de la région."
 nd_sca_freedom_of_the_press: "Liberté de la presse"
 nd_sca_freedom_of_the_press_desc: "La loi suédoise de 1766 sur la liberté de la presse, la première au monde, a établi le principe selon lequel les citoyens ont le droit de publier et de lire sans censure gouvernementale."
 nd_sca_scandinavism: "Scandinavie"
 nd_sca_scandinavism_desc: "Le mouvement scandinave du XIXe siècle a promu l’unité culturelle et politique entre les peuples nordiques, célébrant une histoire, une langue et une identité communes."
 nd_sca_industrial_modernization: "Modernisation industrielle"
 nd_sca_industrial_modernization_desc: "The transformation of Scandinavia from an agrarian society to an industrial one, driven by mining, forestry, and the mechanization of traditional industries.\n\n#italic Available in: $nd_sca_bergslagen_forge$#!"
 nd_sca_scandinavian_neutrality: "Neutralité scandinave"
 nd_sca_scandinavian_neutrality_desc: "La tradition scandinave de neutralité armée, qui consistait à maintenir des défenses solides tout en évitant de s'impliquer dans des conflits entre grandes puissances, a préservé l'indépendance à travers les bouleversements de l'ère napoléonienne."
 n_nd_sca_langskip: "Saut de langue"
 n_nd_sca_langskip_desc: "Des navires de guerre rapides et à faible tirant d'eau issus de la conception des drakkars vikings, construits pour les raids et la patrouille côtière dans les eaux étroites du Nord."
 n_nd_sca_langskip_levy: "Équipage Langskip"
 n_nd_sca_langskip_levy_desc: "Des équipages de drakkars recrutés issus de communautés côtières ayant des siècles de tradition maritime."
 a_nd_sca_hakkapeliitta: "Huovi"
 a_nd_sca_hakkapeliitta_desc: "Castle horsemen of the Finnish frontier on small, hardy mounts. They are quick to strike and at home in the forest, and too lightly protected for a long melee."
 n_nd_sca_orlogsskib: "Orlogsskib"
 n_nd_sca_orlogsskib_desc: "Un navire de guerre scandinave rapide conçu à la fois pour les patrouilles baltes et les combats en haute mer, équilibrant la puissance de feu et la vitesse nécessaire pour dominer les détroits étroits."
 a_nd_sca_carolean: "Caroléen"
 a_nd_sca_carolean_desc: "Infanterie d'élite de style suédois entraînée à la doctrine ga-pa, avance disciplinée sous le feu suivie d'une charge dévastatrice à la baïonnette à courte portée."
 a_nd_sca_carolean_levy: "Legd Soldiers"
 a_nd_sca_carolean_levy_desc: "Soldiers sent by the legds, groups of farms that each find, clothe and keep one man. They drill at the church green after the Sunday service and march when the realm calls."
 levy_nd_sca_carolean: "Legd Levy"
 levy_nd_sca_carolean_desc: "One soldier from every legd of farms, drilled on Sundays and kept ready on the rolls of his company."
 n_nd_sca_linjeskip: "Linjeskip"
 n_nd_sca_linjeskip_desc: "Un navire de ligne scandinave, plus rapide que ses homologues européens, conçu pour les eaux peu profondes de la Baltique où la manœuvrabilité compte autant que le poids en bordée."
 a_nd_sca_bondeuppbad: "Bondeuppbåd"
 a_nd_sca_bondeuppbad_desc: "Free farmers called out under the old provincial laws, each bringing the shield, spear and crossbow he is bound to keep at home. They fight for land that is their own, and they fight without armour."
 levy_nd_sca_bondeuppbad: "Bondeuppbåd Levy"
 levy_nd_sca_bondeuppbad_desc: "The freeholders of the countryside, summoned in person with the arms the law makes each of them own."
 a_nd_sca_adelsfana: "Adelsfana"
 a_nd_sca_adelsfana_desc: "The banner of the nobility: armoured horsemen with wheel-lock pistols, furnished by noble estates in return for their freedom from tax."
 levy_nd_sca_adelsfana: "Adelsfana Levy"
 levy_nd_sca_adelsfana_desc: "Mounted service owed by the nobility, one armoured horseman for a set measure of tax-free land."
 nd_sca_stave_church: "Église en bois debout"
 nd_sca_stave_church_desc: "Églises en bois construites selon la technique nordique des poteaux et des linteaux, décorées de sculptures complexes mêlant l'imagerie chrétienne à d'anciens motifs nordiques."
 nd_sca_bergslagen_forge: "Forge de Bergslagen"
 nd_sca_bergslagen_forge_desc: "Une usine sidérurgique dans la tradition de Bergslagen, fusionnant du fer osmund de haute qualité à partir de minerai suédois à l'aide de hauts fourneaux alimentés au charbon de bois."
 nd_sca_orlogsvarvet: "Orlogsvarvet"
 nd_sca_orlogsvarvet_desc: "Un chantier naval royal construit dans la tradition scandinave, avec des cales sèches couvertes et des cales pour la construction de navires de guerre toute l'année."
 nd_sca_tingsted: "Tingsted"
 nd_sca_tingsted_desc: "Une salle de réunion formelle perpétuant l'ancienne tradition Thing, où les représentants locaux se réunissent pour délibérer sur la loi, la fiscalité et la gouvernance."
 nd_sca_sildesalteri: "Salière de hareng"
 nd_sca_sildesalteri_desc: "Une installation côtière de salage et de mise en fûts de hareng dans la tradition scanienne, produisant du poisson en conserve destiné à l'exportation dans toute l'Europe du Nord."
 nd_sca_koppargruva: "Koppargruva"
 nd_sca_koppargruva_desc: "Une installation d'extraction de cuivre utilisant la méthode d'allumage du feu mise au point à Falun, d'énormes incendies souterrains brisent la roche minéralisée pour l'extraction."
 nd_sca_ostindisk_kontor: "Kontor des Indes orientales"
 nd_sca_ostindisk_kontor_desc: "Une maison de commerce sur le modèle des sociétés danoises et suédoises des Indes orientales, qui s'occupe de l'importation et de la revente de produits de luxe asiatiques."
 nd_sca_soldattorp: "Soldattorp"
 nd_sca_soldattorp_desc: "A soldier's croft. The farms of a district keep one soldier between them and give him a cottage, a field and a cow, which he works between musters. Only the realm's own provinces carry the allotment."
 nd_sca_stave_church_upkeep: "Entretien de l'église en bois debout"
 nd_sca_stave_church_upkeep_desc: "Goudronnage régulier, remplacement du bois et tissu pour les pansements d'autel afin de préserver et de faire fonctionner l'église en bois debout malgré le climat nordique rigoureux."
 nd_sca_osmund_iron_smelting: "Fonderie de fer d'Osmund"
 nd_sca_osmund_iron_smelting_desc: "La production de fer et d'acier osmund de haute qualité à partir de minerai et de charbon de bois suédois dans la tradition de Bergslagen."
 nd_sca_shipyard_upkeep: "Consommation des magasins navals"
 nd_sca_shipyard_upkeep_desc: "La demande constante du chantier naval en bois, en goudron et en fournitures navales pour construire et entretenir la flotte."
 nd_sca_assembly_maintenance: "Entretien de l'assemblage"
 nd_sca_assembly_maintenance_desc: "Entretenir la salle de réunion, ses terrains et les archives papier des lois et des délibérations pour les sessions régulières de gouvernance."
 nd_sca_herring_salting: "Salage du hareng"
 nd_sca_herring_salting_desc: "La méthode traditionnelle scanienne de salage, de mise en fûts et d'emballage du hareng avec des outils et du sel pour la conservation et le commerce à longue distance."
 nd_sca_fire_setting_extraction: "Extraction pour allumer le feu"
 nd_sca_fire_setting_extraction_desc: "L'ancienne technique minière consistant à faire de grands feux sous terre pour casser la roche minéralisée, utilisée à Falun depuis des siècles."
 nd_sca_east_india_trade: "Commerce des Indes orientales"
 nd_sca_east_india_trade_desc: "L'importation et l'entreposage de produits de luxe asiatiques (thé, porcelaine et soie) pour distribution sur les marchés d'Europe du Nord."
 nd_sca_soldattorp_upkeep: "Croft Upkeep"
 nd_sca_soldattorp_upkeep_desc: "Timber for the cottage, a cow for the byre and the cloth of the uniform, all owed by the farms that keep the soldier."
 nd_sca_lancashire_forging: "Lancashire Forging"
 nd_sca_lancashire_forging_desc: "Bar iron refined in closed hearths fired with charcoal, the method that kept Swedish iron in demand once coke-fired works had taken the bulk trade."
 nd_sca_formed_tt: "La Scandinavie s'est formée"
 nd_sca_path_a_tt: "Choisissez le destin#bold Lords of the Northern Seas#!"
 nd_sca_path_b_tt: "Choisissez le destin#bold All-Thing du Nord#!"
 nd_sca_dest_uppsala_developed_tt: "We own #bold Uppsala#! and its development is at least #bold 24#!"
 nd_sca_dest_stockholm_developed_tt: "We own #bold Stockholm#! and its development is at least #bold 34#!"
 nd_sca_dest_kobenhavn_developed_tt: "We own #bold Copenhagen#! and its development is at least #bold 50#!"
 nd_sca_destiny: "Destin scandinave"
 nd_sca_destiny_desc: "Le Nord uni se trouve à la croisée des chemins. La stabilité assurée, le royaume scandinave peut désormais poursuivre le destin qu'il s'est choisi, qu'il s'agisse de la maîtrise des mers ou de la perfection de la gouvernance par assemblée."
 nd_sca_dest_sound_toll: "Maîtrise du son"
 nd_sca_dest_sound_toll_desc: "Prenez le contrôle de Lübeck et du passage de l'Oresund. Une fois les institutions bancaires établies, faites passer la richesse de chaque navire qui passe entre la mer du Nord et la Baltique entre des mains scandinaves."
 nd_sca_dest_north_sea: "Domination sur la mer du Nord"
 nd_sca_dest_north_sea_desc: "Récupérez les anciens territoires nordiques de l’Écosse et des Orcades. Avec Édimbourg sous la bannière du Nord et l’or qui circule dans le Trésor, la mer du Nord redevient une autoroute scandinave."
 nd_sca_dest_northern_empire: "L'Empire du Nord"
 nd_sca_dest_northern_empire_desc: "Reach from Novgorod to Greenland: the Varangian route reborn and the abandoned western settlements reclaimed. Embrace global trade and build a colonial admiralty to coordinate a realm that straddles oceans."
 nd_sca_dest_law_of_north: "La loi du Nord"
 nd_sca_dest_law_of_north_desc: "Establish the foundations of Scandinavian governance. With banking institutions funding courts and schools, build up Uppsala, seat of the archbishop and home of the law of Uppland, and spread the legal traditions of the Thing across the realm."
 nd_sca_dest_riksdag: "L'ascendant du Riksdag"
 nd_sca_dest_riksdag_desc: "The printing press carries Nordic ideas of governance to every corner of the realm. Build Stockholm up into a capital fit to seat the estates, and fill the treasury to fund a modern legislative assembly."
 nd_sca_dest_beacon: "Phare de la Liberté"
 nd_sca_dest_beacon_desc: "Become the Enlightenment's model state. Make Copenhagen the first city of the North, twice the town it was, and win the prestige to show that liberty and order are not opposites but complements. Build a Riksdagshus worthy of the world's most advanced legislature."
 nd_sca.5.t: "Le destin scandinave"
 nd_sca.5.d: "The Scandinavian realm has achieved a stability that the Kalmar Union never knew. Where that older union was plagued by succession crises and Swedish revolts, this kingdom rests on firmer ground. Now the question turns from survival to ambition: what shall this united North become?\n\nThe choice made at our founding set the course. Now, with stability secured, the first steps of that destiny can begin."
 nd_sca.5.a: "Notre destin se dévoile."
 nd_sca.6.t: "Maîtrise du son"
 nd_sca.6.d: "The Oresund, that narrow passage between Helsingborg and Helsingor, has been called the Golden Gate of the North. Every vessel passing from the North Sea to the Baltic must thread this needle, and now both shores belong to Scandinavia. With Lubeck itself brought under our control, the Hanseatic merchants who once dictated terms to Nordic kings now trade at our sufferance.\n\nThe Sound Toll, once a modest Danish levy, can now become the foundation of Scandinavian maritime supremacy. Every cask of herring, every bolt of cloth, every ingot of iron that moves between east and west pays tribute to the Northern Crown."
 nd_sca.6.a: "Le son est à nous."
 nd_sca.7.t: "Domination sur la mer du Nord"
 nd_sca.7.d: "The North Sea, once the highway of Viking raiders, is again a Scandinavian lake. Edinburgh, seat of Scottish kings, flies the Northern banner, and the Orkney Islands have returned to Norse rule after centuries under the Scottish crown. Gold flows through our markets, funding the warships and merchant vessels that enforce our claim.\n\nBritish and Dutch traders eye our growing fleet with alarm. Two visions emerge among the admiralty: shall we build warships to rule by force, or merchantmen to rule by profit?"
 nd_sca.7.a: "Nos navires de guerre imposeront le respect."
 nd_sca.7.b: "Nos marchands posséderont la richesse."
 nd_sca.8.t: "L'Empire du Nord"
 nd_sca.8.d: "From Edinburgh to Novgorod, from Brattahlid to the Baltic, the Northern Empire stretches across the known world. The Varangian route, that ancient path from Scandinavia to Byzantium, is reborn under a single crown. In the west, the Greenland settlements, abandoned for centuries, have been reclaimed.\n\nThis is a realm that straddles oceans and continents. Shall we embrace our role as a true thalassocracy, a maritime empire governed from the quarterdeck, or shall we honor the Norse settlers who first carved civilization from Greenland's ice, and build an empire of colonists and homesteaders?"
 nd_sca.8.a: "Nous régnons depuis les vagues."
 nd_sca.8.b: "Nous nous installons là où la mer nous porte."
 nd_sca.9.t: "La loi du Nord"
 nd_sca.9.d: "The ancient tradition of the Thing, governance by assembly and consent, has been renewed across the Scandinavian realm. Where medieval law codes once served individual provinces, a unified legal tradition now binds the entire North. Banking institutions fund the construction of courts and schools in every corner of the kingdom, and Uppsala, seat of the archbishop and home of the law of Uppland, has grown with them.\n\nThe allodial rights that protect Nordic freeholders are no longer mere custom but codified law. Prosperity grows as secure property rights and consistent justice attract settlement and trade. The foundations of modern Scandinavian governance are being laid, not by conquest, but by consensus."
 nd_sca.9.a: "La loi parle au nom de tous les hommes libres."
 nd_sca.10.t: "L'ascendant du Riksdag"
 nd_sca.10.d: "The Scandinavian Riksdag, evolved from the ancient Thing assemblies into a modern deliberative body, has become the most powerful legislature in Northern Europe. The printing press carries its debates to every literate household, and Stockholm has grown into a capital fit to seat the four estates.\n\nDebates rage in the assembly hall. Progressive voices demand that the Riksdag drive innovation and modernization. Conservative members argue that the body's true strength lies in balancing the estates and preserving harmony among the realm's diverse peoples."
 nd_sca.10.a: "Le Riksdag mènera les réformes."
 nd_sca.10.b: "Le Riksdag équilibre les successions."
 nd_sca.11.t: "Phare de la Liberté"
 nd_sca.11.d: "The Nordic model has become the envy of Europe. Philosophers cite Scandinavian governance as proof that liberty and order are not opposites but complements. The Freedom of the Press Act, the world's first, has been extended across the realm, and Enlightenment ideals find their fullest expression in Northern institutions.\n\nTwo visions compete for the soul of this Northern beacon: shall we formalize our governance in a written constitution, establishing rights that no monarch can revoke? Or shall we use our moral authority to mediate the conflicts of Europe, becoming the peaceful arbiter of nations?"
 nd_sca.11.a: "Nous écrirons les droits de tous les Nordiques."
 nd_sca.11.b: "Nous arbitrerons la paix des nations."
 STATIC_MODIFIER_NAME_nd_sca_dest_war_fleet: "Suprématie de la flotte de guerre"
 STATIC_MODIFIER_DESC_nd_sca_dest_war_fleet: "L'amirauté scandinave construit des navires de guerre pour dominer par la force la mer du Nord. Les bases navales de Bergen à Édimbourg projettent leur puissance à travers les approches de l’Atlantique."
 STATIC_MODIFIER_NAME_nd_sca_dest_merchant_marine: "Domination de la marine marchande"
 STATIC_MODIFIER_DESC_nd_sca_dest_merchant_marine: "Les marchands scandinaves envahissent tous les ports, d'Archangel à Lisbonne. Les commerçants du Nord contrôlent le flux des marchandises à travers les détroits et la haute mer."
 STATIC_MODIFIER_NAME_nd_sca_dest_thalassocracy: "Thalassocratie du Nord"
 STATIC_MODIFIER_DESC_nd_sca_dest_thalassocracy: "Un empire maritime gouverné depuis la dunette. Les amiraux scandinaves commandent des flottes qui patrouillent du Groenland à Novgorod, renforçant la domination de la Couronne du Nord sur toutes les voies maritimes."
 STATIC_MODIFIER_NAME_nd_sca_dest_settler_empire: "Empire des colons"
 STATIC_MODIFIER_DESC_nd_sca_dest_settler_empire: "Là où la mer entraîne les Scandinaves, ils construisent. Du Groenland aux colonies lointaines, les colons nordiques ont construit de nouvelles propriétés dans la nature sauvage, transférant leurs lois et leurs coutumes sur de nouvelles terres."
 STATIC_MODIFIER_NAME_nd_sca_dest_riksdag_reform: "Réformes du Riksdag"
 STATIC_MODIFIER_DESC_nd_sca_dest_riksdag_reform: "Le Riksdag mène un programme de modernisation, de réforme de l'administration, de promotion de l'innovation et d'extension de la gouvernance représentative à tous les coins du royaume."
 STATIC_MODIFIER_NAME_nd_sca_dest_estate_balance: "Harmonie successorale"
 STATIC_MODIFIER_DESC_nd_sca_dest_estate_balance: "Le génie du Riksdag ne réside pas dans un changement radical mais dans l'équilibre entre les intérêts des nobles, du clergé, des bourgeois et des paysans, en maintenant l'harmonie entre les divers domaines grâce à des délibérations minutieuses."
 STATIC_MODIFIER_NAME_nd_sca_dest_constitution: "Charte constitutionnelle"
 STATIC_MODIFIER_DESC_nd_sca_dest_constitution: "Une constitution écrite consacre les droits des citoyens scandinaves. Aucun monarque ne peut révoquer ce que les représentants du peuple ont établi dans la loi."
 STATIC_MODIFIER_NAME_nd_sca_dest_arbiter: "Arbitre des nations"
 STATIC_MODIFIER_DESC_nd_sca_dest_arbiter: "L'autorité morale de la Scandinavie, bâtie sur des siècles de gouvernance représentative et de tolérance religieuse, en fait le médiateur naturel des conflits européens."
 nd_sca_kolonikontor: "Amirauté coloniale"
 nd_sca_kolonikontor_desc: "Un quartier général combiné de commandement naval et de commerce pour coordonner les entreprises coloniales scandinaves, sur le modèle des grandes amirautés des puissances maritimes."
 nd_sca_admiralty_operations: "Opérations de l'Amirauté"
 nd_sca_admiralty_operations_desc: "Le flux constant de provisions navales, de correspondance administrative et de tissus pour les uniformes et les gréements était nécessaire à la coordination d'un empire colonial maritime."
 nd_sca_riksdagshus: "Riksdagshus"
 nd_sca_riksdagshus_desc: "Une grande salle de réunion dans la tradition parlementaire nordique, où les représentants des domaines se réunissent pour délibérer sur la loi, la fiscalité et la gouvernance du royaume."
 nd_sca_riksdag_upkeep: "Administration de l'Assemblée"
 nd_sca_riksdag_upkeep_desc: "L'appareil bureaucratique nécessitait pour gérer une législature constitutionnelle, des greffiers, des archives imprimées et des livres de droit, ainsi que de la pierre pour l'entretien de la salle de réunion elle-même."
 sca_kalmar_riksrad_bureaucracy: "Kalmar Riksrd"
 sca_kalmar_riksrad_bureaucracy_desc: "Le Conseil conjoint du royaume des trois royaumes nordiques, issu de l'assemblée des magnats Marguerite Ier, convoqué à Kalmar en juin 1397 pour couronner Erik de Poméranie. Le riksrd de chaque royaume faisait siéger ses évêques, ses grands magnats laïcs et les commandants de ses châteaux les plus puissants : Akershus et Bergenhus en Norvège, Stockholm et Kalmar en Suède, Roskilde et Copenhague au Danemark. Les conseils ratifiaient les rois, arbitraient les conflits de succession et s'accrochaient au principe selon lequel le royaume devait être administré par ses propres dignitaires selon ses propres lois : un frein à la centralisation royale que les monarques de l'Union, de Marguerite à Christian II, n'appréciaient pas et tentaient de contourner."
 sca_oresund_toll_bureaucracy: "Cotisations sonores"
 sca_oresund_toll_bureaucracy_desc: "Le resundstolden, un péage sur chaque quille étrangère traversant l'étroit détroit entre Helsingr et Helsingborg, décrété par Erik de Poméranie en 1429. Depuis la grande forteresse de Kronborg, les artilleurs danois faisaient respecter la conformité pendant des siècles - un navire qui refusait de s'arrêter pouvait être coulé au milieu du chenal. Réformées en 1567, passant d'une redevance par navire à une taxe ad valorem de un à deux pour cent sur la valeur des marchandises, les redevances du Sound, à leur apogée, fournissaient jusqu'aux deux tiers des revenus de l'État danois et faisaient de chaque nation commerçante européenne un tributaire réticent de la couronne du Nord."
 sca_riksdag_estates_bureaucracy: "Riksdag des domaines"
 sca_riksdag_estates_bureaucracy_desc: "Le Riksens Stnder, le parlement suédois de quatre domaines, remonte à l'assemblée qu'Engelbrekt Engelbrektsson convoqua à Arboga en janvier 1435 lors de sa rébellion contre l'union de Kalmar. Alors que la plupart des parlements européens comptaient trois domaines, le corps nordique en comprenait un quatrième (les bondestndet, les paysans libres du royaume) aux côtés des nobles, du clergé et des bourgeois. Formalisé sous Gustav Vasa en 1527 et constitutionnalisé après 1719, le Riksdag à quatre États a donné aux communes scandinaves une voix dans une législation que l'on ne trouve nulle part ailleurs en Europe et a obligé la monarchie à gouverner avec le consentement de l'ensemble du royaume."
 sca_lensvesen_bureaucracy: "Système d'objectif"
 sca_lensvesen_bureaucracy_desc: "Le système d'administration provinciale de la fin du Moyen Âge par lequel la couronne nordique déléguait le pouvoir aux lensherrer détenant des châteaux royaux - Akershus à Oslo, Bergenhus à Bergen, Aalborghus dans le nord du Jutland, Stockholm en Suède - en échange de revenus, de soldats et de serments de fidélité. Sous chaque lensherre, les lensmnd se trouvaient des fonctionnaires royaux inférieurs qui collectaient les impôts, rassemblaient les obligations, jugeaient les petites affaires et représentaient le roi aux réunions. Le système len a uni le royaume à faible coût, mais a créé une classe de magnats dont les châteaux, les hommes et les revenus pourraient se retourner contre la couronne lors du prochain conflit de succession."
 sca_reduktion_bureaucracy: "Réduction"
 sca_reduktion_bureaucracy_desc: "The recurring Nordic act of crown reclamation, by which alienated lands were resumed from those who held them. Gustav Vasa's reduktion, ratified at the Diet of Västerås in 1527, transferred to the Swedish crown the church estates that had constituted twenty-one percent of the realm's land, producing nearly forty percent of state revenue by mid-century and underwriting the rise of a centralized monarchy. The pattern repeated under Karl XI's Great Reduktion after 1680, this time at the expense of the high nobility. Whether aimed at bishops or barons, reduktion left a long memory of fear among those whose estates rested on royal grant."
 sca_hanseatic_kontor_bureaucracy: "Kontor hanséatique"
 sca_hanseatic_kontor_bureaucracy_desc: "Le Tyskebryggen à Bergen, le dernier et le plus septentrional des quatre grands kontors hanséatiques, s'est établi vers 1350 en tant qu'enclave privée de marchands allemands bénéficiant de leur propre trésor, tribunal, législation et sceau sous la souveraineté norvégienne. Les deux mille Hansards du kontor détenaient un quasi-monopole sur l'exportation du stockfish des pêcheries des Lofoten, payant un faible droit d'environ 148 kilos de céréales par navire et faisant du commerce selon leurs propres lois sur le sol norvégien. Ses quais enrichirent les coutumes du royaume mais exclurent les bourgeois indigènes du commerce atlantique pendant quatre siècles - le kontor ne fut fermé au profit des marchands norvégiens qu'en 1754."
 sca_bremerholm_admiralty_bureaucracy: "Amirauté de Bremerholm"
 sca_bremerholm_admiralty_bureaucracy_desc: "Base navale dédiée fondée par le roi Hans du Danemark en 1510 sur l'îlot de Bremerholm dans le port de Copenhague, du nom des marchands et des charpentiers navals de Brême qui y travaillèrent pour la première fois. Christian IV l'a agrandi en un vaste complexe de cales de halage, de téléphériques, de grues à mât et de quartiers pour les officiers, et à partir de 1690, l'opération s'est étendue à travers le canal jusqu'à Nyholm. L'équipage de la flotte elle-même était composé d'udskrevne - des paysans côtiers enrôlés par tirage au sort dans les paroisses maritimes du Danemark et de la Norvège en vertu d'une ordonnance navale royale - une corve mécontente des villages de pêcheurs qui l'approvisionnaient mais indispensable à une marine qui surveillait le Sund et la Baltique."
 AUTO_MODIFIER_NAME_nd_sca_bureaucracy_authority: "Chancellerie nordique"
 AUTO_MODIFIER_DESC_nd_sca_bureaucracy_authority: "La chancellerie de la couronne nordique unifiée est devenue un appareil institutionnel permanent : ​​enregistrant les péages et les rôles d'impôt du Sound au Finnmark, scellant les fiefs à Akershus et Bergenhus, envoyant des brefs au riksrd de trois royaumes. C'est sur cette base que les institutions étatiques distinctives de la Scandinavie commencent à prendre leur forme durable."
