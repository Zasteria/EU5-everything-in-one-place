l_french:
 STATIC_MODIFIER_NAME_nd_way_of_flower_wars: "Voie de la guerre des fleurs"
 STATIC_MODIFIER_DESC_nd_way_of_flower_wars: "L'Empire aztèque a perfectionné l'art de la guerre rituelle. Les armées ne marchent pas seulement pour conquérir, mais pour prouver la suprématie de Huitzilopochtli sur tous ses rivaux. Chaque champ de bataille devient un terrain sacré où les guerriers gagnent de la gloire en capturant des adversaires dignes."
 STATIC_MODIFIER_NAME_nd_pochteca_road: "La route de la Pochteca"
 STATIC_MODIFIER_DESC_nd_pochteca_road: "Les marchands à distance de l'empire, les pochteca, ont été élevés au rang de pilier de l'État. Leurs caravanes transportent du cacao, des plumes de quetzal et de l'obsidienne jusqu'aux confins de la Méso-Amérique, et leurs réseaux de renseignement servent d'yeux et d'oreilles aux Huey Tlatoani."
 STATIC_MODIFIER_NAME_nd_cuachicqueh_ascendancy: "Ascendance des Tondus"
 STATIC_MODIFIER_DESC_nd_cuachicqueh_ascendancy: "Les Cuachicqueh, guerriers qui ont juré de ne jamais reculer au combat, sont devenus l'incarnation vivante de la vertu martiale aztèque. Leurs visages peints et leurs têtes rasées sèment la terreur chez tous les ennemis."
 STATIC_MODIFIER_NAME_nd_codex_wisdom: "Sagesse des codex"
 STATIC_MODIFIER_DESC_nd_codex_wisdom: "Les scribes de l'empire ont entrepris un effort systématique pour enregistrer et préserver leurs connaissances dans des codex peints, depuis les observations astronomiques jusqu'aux rouleaux d'hommage, depuis les plantes médicinales jusqu'aux généalogies des maisons dirigeantes."
 STATIC_MODIFIER_NAME_nd_tribute_reform_centralist: "Collecte d'hommage centralisée"
 STATIC_MODIFIER_DESC_nd_tribute_reform_centralist: "Les collectionneurs d'hommages impériaux répondent désormais directement au Huey Tlatoani. Les gouverneurs provinciaux sont remplacés par des agents de l'administration centrale, qui veillent à ce que chaque balle de coton, chaque chargement de cacao et chaque envoi d'obsidienne parvienne aux coffres de Tenochtitlan."
 STATIC_MODIFIER_NAME_nd_tribute_reform_federalist: "Compact Altepetl fédéré"
 STATIC_MODIFIER_DESC_nd_tribute_reform_federalist: "Plutôt que d’imposer un contrôle central toujours plus lourd, l’empire a formalisé l’autonomie de son altepetl constitutif. Les tlatoques locaux conservent leur autorité en échange d'un tribut fiable et d'un service militaire, un système qui engendre la loyauté plutôt que le ressentiment."
 nd_azt.1.t: "L'empire aztèque s'élève"
 nd_azt.1.d: "From the marshes of Lake Texcoco, the Mexica have built the greatest empire the Americas have ever seen. Tenochtitlan stands as the jewel of a realm stretching from sea to sea, its canals and causeways a testament to the genius of its people. Now, as the Huey Tlatoani proclaims dominion over all Mesoamerica, the empire must decide its path. Will the flower wars continue to forge an unbreakable warrior elite, expanding the empire's reach through martial glory? Or will the pochteca merchant-spies become the instruments of a new kind of power, one built on trade routes, tribute networks, and the flow of cacao rather than blood?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_azt.1.a: "Que la Guerre des Fleurs fasse rage éternellement !"
 nd_azt.1.b: "La pochteca sera le nerf de l'empire."
 nd_azt.2.t: "Le serment des tondus"
 nd_azt.2.d: "Une nouvelle génération de Cuachicqueh, les Tondus, a achevé ses rites d'initiation. Ces guerriers d'élite se rasent la tête, ne laissant qu'une seule mèche sur l'oreille gauche, et peignent une moitié de leur visage en bleu et l'autre moitié en rouge ou en jaune. Ils jurent devant les dieux qu’ils ne reculeront jamais devant la bataille, qu’ils ne reculeront jamais. En temps de guerre, ils sont toujours les premiers à affronter l’ennemi et les derniers à quitter le terrain. Leur serment est absolu : victoire ou mort, sans juste milieu. Les autres ordres guerriers, les Jaguar Knights et les Eagle Warriors, considèrent le Cuachicqueh comme l'expression ultime de la dévotion martiale. Leur présence sur le champ de bataille renforce la détermination de chaque guerrier de l’armée."
 nd_azt.2.a: "Leur serment les lie et nous inspire tous."
 nd_azt.3.t: "Le grand projet du Codex"
 nd_azt.3.d: "Les scribes du calmecac ont entrepris un projet ambitieux : la compilation systématique de toutes les connaissances aztèques dans une série complète de codex. À l'aide de papier d'écorce d'amate et de pigments minéraux vibrants, les tlacuiloque, peintres-scribes professionnels, enregistrent la sagesse accumulée par l'empire. Les almanachs Tonalamatl retracent le calendrier sacré et ses rituels. Les rouleaux d'hommage répertorient les obligations exactes de chaque sujet altepetl. Les codex de plantes médicinales documentent des centaines de plantes médicinales, leur préparation et leurs utilisations, des connaissances qui rivalisent avec tout ce qui existe dans l'Ancien Monde. Les enregistrements astronomiques suivent les mouvements de Vénus, du Soleil et de la Lune avec une précision extraordinaire. Il ne s’agit pas simplement de tenir des registres. Il s’agit de la création d’une infrastructure intellectuelle qui permettra aux connaissances de l’empire d’être transmises, débattues et élargies pendant des générations."
 nd_azt.3.a: "La connaissance est le fondement de l'empire."
 nd_azt.4.t: "Réforme du système de tribut"
 nd_azt.4.d: "Le système de tribut aztèque s'est étendu, plus de quatre cents altepetls rendent régulièrement hommage à Tenochtitlan sous la forme de manteaux de coton et de costumes de guerrier, de fèves de cacao, de poussière d'or, de plumes de quetzal et de jade. Mais le système montre des signes de tension. Certaines provinces résistent à leurs évaluations, d’autres cachent leur véritable richesse, et la logistique de collecte et de stockage des tributs sur de telles distances est devenue lourde. Les conseillers de Huey Tlatoani présentent deux voies à suivre : renforcer le contrôle central en remplaçant les tlatoques locaux par des fonctionnaires nommés par l'empereur qui répondent directement à Tenochtitlan, ou formaliser un pacte qui respecte l'autonomie locale en échange d'un tribut fiable et d'un engagement militaire."
 nd_azt.4.a: "Tous les hommages reviennent à Tenochtitlan."
 nd_azt.4.b: "Laissons les Altepetl se gouverner eux-mêmes, à condition qu'ils paient."
 nd_azt.5.t: "Une renaissance mésoaméricaine"
 nd_azt.5.d: "Quelque chose de remarquable s’agite dans l’Empire aztèque. Les écoles calmecac, autrefois axées principalement sur la formation de prêtres et de guerriers, sont devenues des centres de recherche intellectuelle plus large. Les érudits nahuatl débattent de philosophie, composent de la poésie lyrique dans la tradition de Nezahualcoyotl et repoussent les limites de la connaissance astronomique. Les artisans de Tenochtitlan produisent des œuvres d'orfèvrerie, de plumes et de sculptures sur pierre d'une sophistication à couper le souffle. Les ingénieurs continuent d'étendre et d'affiner le système chinampa et l'infrastructure hydraulique de la ville. Cette floraison de culture et de connaissances rivalise avec tout ce que l’Ancien Monde a produit, une renaissance de caractère uniquement mésoaméricain, s’appuyant sur des milliers d’années de civilisation accumulée dans les traditions olmèques, mayas, toltèques et maintenant aztèques."
 nd_azt.5.a: "Le Cinquième Soleil illumine une nouvelle ère d’apprentissage."
 nd_azt_chinampa_system: "Agriculture de Chinempa"
 nd_azt_chinampa_system_desc: "Les jardins flottants de la Vallée de Mexico produisent de multiples récoltes par an, nourrissant une population qui rivalise avec celle du monde."
 nd_azt_atlatl_tradition: "Tradition Atlatl"
 nd_azt_atlatl_tradition_desc: "Le lance-lance est une arme déterminante de la guerre mésoaméricaine depuis des millénaires. Les tirailleurs aztèques armés d'atlatl font pleuvoir des projectiles mortels sur leurs ennemis au-delà de la portée de mêlée."
 nd_azt_tlachtli_courts: "Terrains de balle Tlachtli"
 nd_azt_tlachtli_courts_desc: "Le jeu de balle rituel remplit des fonctions à la fois religieuses et politiques, résolvant les différends entre les villes et honorant les dieux à travers des compétitions sportives."
 nd_azt_pochteca_network: "Réseau commercial Pochteca"
 nd_azt_pochteca_network_desc: "Les marchands de longue distance pochteca entretiennent des routes commerciales couvrant toute la Méso-Amérique, vendant des produits de luxe et servant de collecteurs de renseignements pour l'empire."
 nd_azt_aqueduct_engineering: "Ingénierie des aqueducs"
 nd_azt_aqueduct_engineering_desc: "Des aqueducs jumeaux transportent l'eau douce des sources de Chapultepec jusqu'à la ville insulaire de Tenochtitlan, une merveille d'ingénierie qui fait vivre une population de plus de 200 000 habitants."
 nd_azt_obsidian_mastery: "Maîtrise de l'obsidienne"
 nd_azt_obsidian_mastery_desc: "Les artisans aztèques fabriquent des armes, des outils et des miroirs en obsidienne volcanique avec un savoir-faire extraordinaire. Le macuahuitl, une épée en bois tranchante en obsidienne, peut décapiter un cheval."
 nd_azt_calpulli_organisation: "Organisation Calpulli"
 nd_azt_calpulli_organisation_desc: "Les calpulli, quartiers claniques qui forment l'épine dorsale administrative des villes aztèques, coordonnent la fiscalité, l'utilisation des terres, l'éducation et la conscription militaire au niveau local."
 nd_azt_cuachicqueh_order: "Ordre des Cuachicqueh"
 nd_azt_cuachicqueh_order_desc: "Les Tondus constituent l’élite guerrière suprême de l’Empire aztèque. Ils jurent de ne jamais battre en retraite et mènent toujours l'avant-garde au combat."
 nd_azt_flower_wars_doctrine: "Doctrine de la guerre des fleurs"
 nd_azt_flower_wars_doctrine_desc: "Les xochiyaoyotl, ou guerres de fleurs, sont des conflits rituels qui maintiennent les guerriers alertes, fournissent des captifs à sacrifier et démontrent la supériorité martiale de l'empire sans nécessiter une conquête totale."
 nd_azt_tribute_administration: "Administration des hommages"
 nd_azt_tribute_administration_desc: "Une bureaucratie de calpixque (collecteurs d'hommages) assure le flux constant de marchandises de plus de quatre cents altepetl sujets vers le trésor impérial."
 nd_azt_codex_tradition: "Tradition du Codex"
 nd_azt_codex_tradition_desc: "Les scribes aztèques, les tlacuiloque, créent des codex peints élaborés enregistrant tout, des observations astronomiques aux évaluations d'hommages et à la phytothérapie."
 nd_azt_cacao_trade: "Commerce du cacao"
 nd_azt_cacao_trade_desc: "Les fèves de cacao servent à la fois de monnaie et de produit de luxe dans toute la Méso-Amérique. Le contrôle du commerce du cacao donne à l’empire un levier économique sur toute la région."
 nd_azt_reformed_defenses: "Défenses réformées"
 nd_azt_reformed_defenses_desc: "L'empire renforce ses fortifications frontalières et son système de garnison, en construisant des forteresses teocalli qui allient force défensive et importance religieuse."
 nd_azt_nahuatl_imperialism: "L'impérialisme nahuatl"
 nd_azt_nahuatl_imperialism_desc: "La langue et la culture nahuatl sont activement promues dans tous les domaines de l'empire, liant les peuples soumis à l'identité aztèque par le biais d'une langue, d'une religion et de coutumes communes."
 nd_azt_coyote_runners: "Coureurs de coyotes"
 nd_azt_coyote_runners_desc: "Les coureurs d'élite constituent le réseau de communication rapide de l'empire et une force de raid rapide, parcourant de vastes distances à travers les montagnes et les jungles de la Méso-Amérique."
 nd_azt_military_reformation: "Réforme militaire"
 nd_azt_military_reformation_desc: "Le système d'ordre guerrier traditionnel est réformé pour incorporer de nouvelles doctrines tactiques, la discipline et la formation remplacent l'héroïsme individuel comme fondement de la puissance militaire aztèque."
 nd_azt_centralised_tribute: "Réforme centralisée des hommages"
 nd_azt_centralised_tribute_desc: "Le système des tributs est fondamentalement réorganisé sous une administration impériale directe, remplaçant la mosaïque d'arrangements locaux par une bureaucratie centralisée."
 nd_azt_hydraulic_mastery: "Maîtrise hydraulique"
 nd_azt_hydraulic_mastery_desc: "Des générations d'expérience dans le domaine des chinampas, des aqueducs et du contrôle des crues ont produit une classe d'ingénieurs hydrauliques sans équivalent dans les Amériques."
 nd_azt_imperial_law_code: "Code de droit impérial"
 nd_azt_imperial_law_code_desc: "Un code juridique complet remplace les décisions ad hoc des tlatoques individuels, assurant une justice cohérente dans tout l'empire et renforçant l'autorité centrale."
 nd_azt_tlacochcalcatl_tradition: "Tradition Tlacochcalcatl"
 nd_azt_tlacochcalcatl_tradition_desc: "Nommés d'après le Maître de la Maison des Fléchettes, ces gardes impériaux réformés représentent le summum de l'évolution militaire aztèque, disciplinés, bien équipés et totalement loyaux."
 nd_azt_mesoamerican_renaissance: "Renaissance mésoaméricaine"
 nd_azt_mesoamerican_renaissance_desc: "Une floraison d'arts, de sciences et de philosophie transforme l'empire aztèque en un centre d'apprentissage qui s'appuie sur des milliers d'années de civilisation mésoaméricaine accumulée."
 nd_azt_modern_armies: "Armées modernes"
 nd_azt_modern_armies_desc: "L'armée aztèque achève sa transformation d'un système d'ordre guerrier à une armée moderne dotée d'un équipement standardisé, d'exercices tactiques et d'un corps d'officiers professionnels."
 nd_azt_trade_modernisation: "Modernisation du commerce"
 nd_azt_trade_modernisation_desc: "Les anciens réseaux commerciaux pochteca sont modernisés avec de nouvelles méthodes de comptabilité, de crédit et d'entreposage, permettant au commerce aztèque de rivaliser avec n'importe quelle nation."
 nd_azt_national_identity: "Identité nationale"
 nd_azt_national_identity_desc: "Les divers peuples de l'empire (Nahua, Mixtèque, Zapotèque, Totonaque et des dizaines d'autres) commencent à se forger une identité commune en tant que citoyens de l'État aztèque."
 nd_azt_industrial_dawn: "L’aube industrielle"
 nd_azt_industrial_dawn_desc: "Les ingénieurs et artisans aztèques appliquent leur ingéniosité traditionnelle à de nouvelles techniques de fabrication, amorçant ainsi la transformation de l'économie de l'empire, passant d'un tribut agraire à une production industrielle."
 a_nd_azt_cuachicqueh: "Cuachicqueh"
 a_nd_azt_cuachicqueh_desc: "Les Shorn Ones, infanterie de choc d'élite qui se rasent la tête et se maquillent le visage, jurant devant les dieux de ne jamais battre en retraite. Ils mènent chaque charge et tiennent chaque ligne."
 a_nd_azt_atlatl_skirmisher: "Tirailleurs d'Atlatl"
 a_nd_azt_atlatl_skirmisher_desc: "Des guerriers de Levy armés de l'atlatl, un ancien lance-lance qui offre une portée dévastatrice et une puissance de frappe même aux troupes de conscription."
 a_nd_azt_tlacochcalcatl_guard: "Garde Tlacochcalcatl"
 a_nd_azt_tlacochcalcatl_guard_desc: "Infanterie impériale réformée nommée en l'honneur du commandant militaire suprême. Ces soldats disciplinés combinent la férocité aztèque traditionnelle avec des formations tactiques modernes."
 a_nd_azt_coyote_runner: "Coureur de coyote"
 a_nd_azt_coyote_runner_desc: "Swift scouts and raiders who serve as the empire's rapid response force, crossing mountains and jungles with extraordinary speed."
 nd_azt_tlachtli: "Terrain de balle Tlachtli"
 nd_azt_tlachtli_desc: "Un terrain de pierre pour le jeu de balle rituel qui sert à la fois la dévotion religieuse et la diplomatie politique, réglant les différends entre altepetl par le biais de compétitions sportives sacrées."
 nd_azt_chinampa_terrace: "Terrasse Chinampa"
 nd_azt_chinampa_terrace_desc: "Jardins flottants construits sur des lits de lacs peu profonds, produisant chaque année de multiples récoltes de maïs, de haricots, de courges et de fleurs."
 nd_azt_pochteca_warehouse: "Entrepôt Pochteca"
 nd_azt_pochteca_warehouse_desc: "Un entrepôt sécurisé où les marchands de longue distance pochteca inventorient et redistribuent les marchandises, du cacao aux plumes de quetzal en passant par l'obsidienne et les tissus fins."
 nd_azt_aqueduct: "Aqueduc aztèque"
 nd_azt_aqueduct_desc: "Un canal de pierre apportant l'eau douce des sources des hautes terres, soutenant la population et la santé des villes aztèques construites sur des îles lacustres."
 nd_azt_obsidian_workshop: "Atelier Obsidienne"
 nd_azt_obsidian_workshop_desc: "Un atelier où des maîtres artisans produisent des épées macuahuitl, des pointes de flèches, des outils chirurgicaux et des miroirs en obsidienne volcanique, l'équivalent de l'acier en Méso-Amérique."
 nd_azt_tianquiztli: "Marché de Tianquiztli"
 nd_azt_tianquiztli_desc: "Un grand marché où les marchands échangent de tout, des fèves de cacao aux manteaux de coton, en passant par les ornements en jade et les plumes de quetzal. Le tianquiztli de Tlatelolco attirait quotidiennement des dizaines de milliers de commerçants."
 nd_azt_nahuatl_academy: "Académie nahuatl"
 nd_azt_nahuatl_academy_desc: "Un centre d'apprentissage qui étend la tradition calmecac à une érudition plus large, formant des administrateurs, des scribes et des universitaires en droit, histoire, philosophie et sciences naturelles."
 nd_azt_teocalli_fortress: "Forteresse de Teocalli"
 nd_azt_teocalli_fortress_desc: "Un complexe de temples fortifiés qui combine l'autorité sacrée des dieux avec la force pratique des murs de pierre et des quartiers de garnison. Ces points forts ancrent les défenses de l'empire."
 nd_azt_mesoamerican_manufactory: "Manufacture mésoaméricaine"
 nd_azt_mesoamerican_manufactory_desc: "Un complexe d'ateliers où l'artisanat traditionnel aztèque rencontre de nouvelles méthodes de production, produisant des textiles, des outils en obsidienne, des céramiques et de la ferronnerie à l'échelle industrielle."
 nd_azt_ritual_maintenance: "Offrandes rituelles"
 nd_azt_ritual_maintenance_desc: "L'entretien du terrain de balle nécessite de l'encens pour la fumée sacrée, des teintures cérémoniales pour les joueurs et de la cire d'abeille pour l'allumage des torches lors des cérémonies nocturnes."
 nd_azt_chinampa_farming: "Culture du Chinampa"
 nd_azt_chinampa_farming_desc: "Les agriculteurs qui travaillent dans les plates-bandes flottantes utilisent des outils pour cultiver le riche sol du lit du lac, produisant chaque année d'abondantes récoltes de maïs à partir de plusieurs saisons de croissance."
 nd_azt_cacao_processing: "Transformation du cacao"
 nd_azt_cacao_processing_desc: "Le traitement et le stockage des fèves de cacao nécessitent des récipients en céramique pour le broyage et la fermentation, des fèves de cacao comme stock et du tissu pour emballer et transporter les produits finis."
 nd_azt_water_maintenance: "Entretien des canaux d'eau"
 nd_azt_water_maintenance_desc: "L'aqueduc nécessite de la pierre pour réparer les canaux, du bois pour les écluses et les échafaudages, ainsi que des outils pour les équipes d'entretien qui maintiennent l'eau coulante toute l'année."
 nd_azt_obsidian_working: "Travail de l'obsidienne"
 nd_azt_obsidian_working_desc: "Les maîtres artisans taillent l'obsidienne volcanique en lames de macuahuitl, en pointes de flèches et en outils chirurgicaux, des armes plus tranchantes que n'importe quel bronze."
 nd_azt_market_maintenance: "Administration du marché"
 nd_azt_market_maintenance_desc: "Le fonctionnement du tianquiztli nécessite des récipients en céramique, du tissu pour les stands et les auvents, ainsi que du sel, un produit commercial clé qui sert de facto d'unité d'échange dans toute la Méso-Amérique."
 nd_azt_academy_maintenance: "Fournitures de l'Académie"
 nd_azt_academy_maintenance_desc: "L'académie a besoin de papier et de pigments minéraux pour la production de codex, ainsi que de bougies en cire d'abeille pour éclairer les travaux scientifiques de fin de soirée."
 nd_azt_fortress_maintenance: "Garnison de la forteresse"
 nd_azt_fortress_maintenance_desc: "La forteresse de Teocalli a besoin de pierre pour l'entretien structurel, d'armes pour armer sa garnison et de bois pour l'entretien des palissades, des plates-formes et de l'équipement de siège."
 nd_azt_manufactory_maintenance: "Matériel d'atelier"
 nd_azt_manufactory_maintenance_desc: "Les artisans façonnent la pierre et le bois en outils, appliquant les techniques mésoaméricaines traditionnelles à l’échelle industrielle."
 levy_nd_azt_atlatl_skirmisher: "Prélèvement des tirailleurs d'Atlatl"
 levy_nd_azt_atlatl_skirmisher_desc: "Des levées paysannes armées du traditionnel lance-lance."
 levy_nd_azt_coyote_runner: "Prélèvement sur les coureurs de coyote"
 levy_nd_azt_coyote_runner_desc: "Swift scouts and raiders drawn from the soldier class."
 nd_azt_formed_tt: "L'empire aztèque a été formé"
 nd_azt_path_a_tt: "Choisissez la voie de la guerre des fleurs"
 nd_azt_path_b_tt: "Choisissez la route de la Pochteca"
 nd_azt_destiny: "Destin de l'empire aztèque"
 nd_azt_destiny_desc: "L'empire aztèque est forgé. Les Huey Tlatoani doivent maintenant démontrer que ce royaume peut perdurer : qu’il est plus qu’une ombre passagère sur la face du Cinquième Soleil. Prouvez la stabilité de l’empire et la voie à suivre se révélera."
 nd_azt_dest_chichimecah: "Conquête des Chichimèques"
 nd_azt_dest_chichimecah_desc: "The wild northern frontier has long defied Aztec authority. The Chichimec peoples (nomadic hunters and raiders) must be brought to heel. The silver-rich lands of the Guachichil and the coastal settlements of Aridoamerica are seized to secure the empire's northern flank, and two subject lords pay tribute to Tenochtitlan."
 nd_azt_dest_fifth_sun: "Empire du Cinquième Soleil"
 nd_azt_dest_fifth_sun_desc: "With the north secured, the armies of the Fifth Sun march south into the highland kingdoms of Central America. Cuauhtemallan and the trading port of Naco must fall under Aztec dominion, and half of the Guatemalan highlands is held by the empire or its subject lords."
 nd_azt_dest_lords_americas: "Seigneurs des Amériques"
 nd_azt_dest_lords_americas_desc: "The ultimate ambition: an empire spanning the entire American continent. The great chiefdom of Cofitachequi in the southeast and the ancient mound city of Cahokia in the heartland must both acknowledge Aztec supremacy, and five subject lords pay tribute. Only then can the Huey Tlatoani truly claim the title Lord of the Americas."
 nd_azt_dest_cacao_monopoly: "Le monopole du cacao"
 nd_azt_dest_cacao_monopoly_desc: "Cacao beans are the currency and lifeblood of Mesoamerican trade. The pochteca must ensure that the empire's capital market controls the flow of this precious commodity. The treasury is filled and Tochtepec is built up, the town where the merchants keep their houses on the road to the cacao lands."
 nd_azt_dest_great_tianquiztli: "Le Grand Tianquiztli"
 nd_azt_dest_great_tianquiztli_desc: "The marketplace of Tlatelolco once amazed even the Spanish conquistadors. Now something greater still is built around it in Tenochtitlan: a continental trade network linking silver mines, cacao plantations, and luxury goods from every corner of the Americas. Modern financial institutions are embraced to fund this vision."
 nd_azt_dest_merchants_world: "Marchands du monde"
 nd_azt_dest_merchants_world_desc: "The pochteca have outgrown Mesoamerica. Their guilds were once those of twelve towns of the Valley; now merchant houses stand in twelve towns of the empire, the Caribbean trade routes are held through Habana, and the cacao heartlands of Chalchuapa are secured. The Aztec merchant class can project economic power across the entire known world."
 nd_azt_dest_highlands_share_tt: "We or our subjects hold at least #bold half#! of the locations of the #bold Tezulutlan#! area"
 nd_azt_dest_tochtepec_developed_tt: "We own #bold Tochtepec#! and its development is at least #bold 6#!"
 nd_azt_dest_tenochtitlan_developed_tt: "We own #bold Tenochtitlan#! and its development is at least #bold 24#!"
 nd_azt_dest_twelve_towns_tt: "A #bold Pochteca Warehouse#! stands in at least #bold 12#! of our locations"
 nd_azt.6.t: "Le destin d'un empire"
 nd_azt.6.d: "L'Empire aztèque se trouve au seuil d'une nouvelle ère. Tenochtitlan, la ville insulaire des canaux et des chaussées, est le cœur battant d'un royaume qui s'étend des rives du Pacifique jusqu'à la côte du Golfe. Mais les ambitions de Huey Tlatoani s'étendent bien au-delà des frontières de la Méso-Amérique. Les dieux exigent plus : plus d'hommages, plus de gloire, plus de preuves que les Mexicas sont le peuple élu du Cinquième Soleil. La voie choisie lors de la fondation de l'empire commence désormais à porter ses fruits et le destin du peuple aztèque attend de s'accomplir."
 nd_azt.6.a: "Le Cinquième Soleil ne se couchera jamais."
 nd_azt.7.t: "Les chutes de la frontière nord"
 nd_azt.7.d: "La frontière Chichimèque (cette vaste étendue sauvage et aride au-delà de la vallée du Mexique) est la grande affaire inachevée de l’empire depuis des générations. Maintenant, c'est fini. Les guerriers Guachichil, qui attaquaient autrefois les caravanes aztèques en toute impunité, s'agenouillent devant le Huey Tlatoani. Les montagnes argentées du nord sont à nous, et les flancs de l’empire sont enfin sécurisés. Les guerriers des fleurs qui ont conquis ces terres ont prouvé que la doctrine martiale aztèque s'adapte à tous les terrains : désert, montagne ou jungle."
 nd_azt.7.a: "Le nord s'incline devant Tenochtitlan."
 nd_azt.8.t: "La marche vers le sud"
 nd_azt.8.d: "Les armées du Cinquième Soleil ont déferlé sur l’Amérique centrale. La forteresse des hautes terres de Cuauhtemallan et le centre commercial côtier de Naco arborent tous deux l'étendard aztèque. Aucune puissance au sud de la vallée du Mexique ne peut résister aux guerriers des fleurs. Mais comment l’empire consolidera-t-il ces conquêtes ? Les capitaines de guerre plaident pour une disponibilité constante : les tambours de guerre ne doivent jamais se taire. Mais les prêtres du temple conseillent que ces conquêtes soient consacrées aux dieux, en construisant des garnisons sacrées qui lient les peuples conquis par la crainte religieuse autant que par la force militaire."
 nd_azt.8.a: "Que les tambours de guerre tonnent sans cesse."
 nd_azt.8.b: "Consacrez ces terres à Huitzilopochtli."
 nd_azt.9.t: "Seigneurs des Amériques"
 nd_azt.9.d: "C'est fait. La grande chefferie de Cofitachequi, célèbre pour ses perles et son cuivre, s'est soumise à l'autorité aztèque. L'ancienne ville de Cahokia, un lieu sacré pour les peuples dont les Mexicas n'avaient jamais entendu parler il y a une génération, héberge désormais un gouverneur aztèque. L'empire s'étend des plaines gelées du nord aux jungles fumantes du sud. Aucun royaume dans les Amériques, et peut-être peu dans le monde entier, ne peut rivaliser avec la domination aztèque en termes d'étendue ou de puissance. Les Huey Tlatoani doivent maintenant décider comment projeter cette hégémonie sans précédent sur des distances aussi vastes."
 nd_azt.9.a: "Nos lames d'obsidienne imposeront notre volonté."
 nd_azt.9.b: "Nous gouvernerons comme le Soleil règne : par rayonnement."
 nd_azt.10.t: "Les rois du cacao"
 nd_azt.10.d: "La pochteca a réalisé quelque chose de remarquable. Grâce à un réseau d'accords commerciaux, d'achats stratégiques et de rivaux occasionnels discrètement éliminés, l'Empire aztèque contrôle désormais le flux de cacao via son marché des capitaux. Chaque tasse de xocolatl bue de la côte du Golfe à la côte du Pacifique enrichit les coffres de Tenochtitlan. La fève de cacao, autrefois simple boisson de luxe, est devenue l’instrument de l’hégémonie économique aztèque. Les princes marchands des guildes pochteca ont gagné leur place aux côtés des ordres guerriers dans les conseils des Huey Tlatoani."
 nd_azt.10.a: "Le cacao coule comme du sang dans notre empire."
 nd_azt.11.t: "Le marché continental"
 nd_azt.11.d: "Le tianquiztli de Tenochtitlan est devenu quelque chose que le monde n'a jamais vu auparavant : un marché où les marchandises de tout un continent changent de mains. L'argent des mines du nord, le cacao des basses terres tropicales, l'obsidienne des hauts plateaux volcaniques, le coton des plaines côtières : tous circulent via des réseaux commerciaux contrôlés par les Aztèques. Les pochteca ont même adopté des innovations bancaires venues d’outre-mer, les adaptant pour servir une vision commerciale typiquement mésoaméricaine. Mais comment gouverner cet empire économique ?"
 nd_azt.11.a: "Les seigneurs du cacao guideront notre prospérité."
 nd_azt.11.b: "Construisez des navires et recherchez de nouveaux marchés au-delà de la mer."
 nd_azt.12.t: "Marchands du monde"
 nd_azt.12.d: "Les pochteca ont réalisé ce qu'aucun Aztèque n'aurait jamais imaginé possible. Depuis leur île du lac Texcoco, ils ont construit un réseau commercial qui s'étend sur les océans et les continents. Les comptoirs commerciaux aztèques parsèment les Caraïbes. Le cacao, l'obsidienne et les plumes s'écoulent vers l'extérieur ; l'argent, les tissus fins et les luxes exotiques reviennent. Les Huey Tlatoani doivent maintenant décider comment canaliser cette richesse sans précédent : les routes de l'empire transporteront-elles des colons et des administrateurs pour fonder de nouvelles provinces, ou les guildes marchandes embaucheront-elles des soldats et des marins étrangers pour protéger et étendre leur réseau sans cesse croissant ?"
 nd_azt.12.a: "Notre peuple colonisera chaque route qu'il empruntera."
 nd_azt.12.b: "Laissez l’or acheter ce que l’obsidienne ne peut pas prendre."
 STATIC_MODIFIER_NAME_nd_azt_dest_war_drums: "Tonnerre des tambours de guerre"
 STATIC_MODIFIER_DESC_nd_azt_dest_war_drums: "Les tambours de guerre de l'Empire aztèque résonnent sans cesse. Les levées sont remplies de guerriers enthousiastes, et le coût de la guerre a été réduit grâce à une pratique constante. Chaque province frontalière reste prête pour la prochaine campagne."
 STATIC_MODIFIER_NAME_nd_azt_dest_sacred_conquest: "Conquête sacrée"
 STATIC_MODIFIER_DESC_nd_azt_dest_sacred_conquest: "The conquered lands have been consecrated to Huitzilopochtli. Temple-fortresses garrison every major settlement, and the conquered peoples are drawn to the cult of the god who defeated their own. But sustaining armies across such vast territories takes its toll."
 STATIC_MODIFIER_NAME_nd_azt_dest_obsidian_hegemony: "Hégémonie d'obsidienne"
 STATIC_MODIFIER_DESC_nd_azt_dest_obsidian_hegemony: "The reach of Aztec arms now extends across the continent. Tributary lords keep faith with Tenochtitlan, the levies of the provinces fight as hardened warriors, every battle adds to the army's renown, and the empire's colonial ambitions know no bounds."
 STATIC_MODIFIER_NAME_nd_azt_dest_sun_lords: "Radiance des Seigneurs du Soleil"
 STATIC_MODIFIER_DESC_nd_azt_dest_sun_lords: "L'Empire aztèque gouverne par le prestige et la crainte autant que par la force. Des compagnies mercenaires venues de peuples lointains servent les Huey Tlatoani, et les dirigeants étrangers cherchent à s'allier avec les Seigneurs du Soleil. Mais entretenir un réseau de mécénat aussi vaste n’est pas sans coût."
 STATIC_MODIFIER_NAME_nd_azt_dest_cacao_lords: "Domination des seigneurs du cacao"
 STATIC_MODIFIER_DESC_nd_azt_dest_cacao_lords: "Les princes marchands pochteca exercent un pouvoir économique qui rivalise avec celui de n’importe quel ordre guerrier. Leurs réseaux reconstruisent les provinces déchirées par la guerre et leurs relations diplomatiques étendent la portée de l'empire. Mais la richesse engendre la complaisance."
 STATIC_MODIFIER_NAME_nd_azt_dest_market_kings: "Ambition des rois du marché"
 STATIC_MODIFIER_DESC_nd_azt_dest_market_kings: "Les ambitions commerciales de l’empire se sont tournées vers la mer. Les chantiers navals produisent des navires pour transporter le commerce au-delà des côtes, et les explorateurs tracent de nouvelles routes vers des marchés lointains. Mais l’accent mis sur le commerce a un coût pour la préparation militaire."
 STATIC_MODIFIER_NAME_nd_azt_dest_golden_roads: "Les routes d'or"
 STATIC_MODIFIER_DESC_nd_azt_dest_golden_roads: "Les colons et administrateurs aztèques parcourent le vaste réseau routier de l'empire, établissant de nouvelles provinces et intégrant les peuples conquis. Les différences religieuses ne constituent pas un obstacle à l’expansion : les routes de l’empire accueillent tous ceux qui se soumettent au Huey Tlatoani."
 STATIC_MODIFIER_NAME_nd_azt_dest_world_merchants: "Empire des marchands du monde"
 STATIC_MODIFIER_DESC_nd_azt_dest_world_merchants: "Les pochteca sont devenues de véritables marchands mondiaux, leurs réseaux commerciaux étant protégés par des soldats engagés et soutenus par une flotte croissante. La portée économique de l'empire s'étend à tous les rivages que les navires aztèques peuvent atteindre."
 nd_azt_sun_temple: "Complexe du Temple du Soleil"
 nd_azt_sun_temple_desc: "Un grand complexe temple-forteresse dédié à Huitzilopochtli, combinant l'autorité sacrée du dieu de la guerre avec la force pratique d'une garnison impériale. Le plus grand complexe de ce type en dehors de Tenochtitlan même."
 nd_azt_pochteca_palace: "Palais de la Pochteca"
 nd_azt_pochteca_palace_desc: "Un magnifique siège commercial où les princes marchands pochteca coordonnent le vaste réseau commercial de l'empire. Des entrepôts, des comptoirs et des salles de réception diplomatiques entourent une cour centrale du marché."
 nd_azt_sun_temple_maintenance: "Garnison du Temple"
 nd_azt_sun_temple_maintenance_desc: "Le complexe du Temple du Soleil a besoin de pierre pour les réparations, d'armes pour armer sa garnison et d'encens sacré pour les feux perpétuels qui honorent Huitzilopochtli."
 nd_azt_palace_maintenance: "Administration du palais"
 nd_azt_palace_maintenance_desc: "Le fonctionnement du palais Pochteca nécessite du cacao pour les cadeaux de cérémonie et les échantillons commerciaux, du tissu pour les expositions diplomatiques et du papier pour les vastes registres qui suivent le commerce continental."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_azt_bureaucracy_authority: "Autorité impériale mexicaine"
 AUTO_MODIFIER_DESC_nd_azt_bureaucracy_authority: "The Triple Alliance of Tenochtitlan, Tetzcoco, and Tlacopan, sealed in 1428, produced a permanent imperial apparatus over the lake-cities and their tributary altepetl: the huey tlatoani's tribunal, the Tlatocan council of high lords, the calpixqui tribute-overseers, and the calmecac priest-academies. Four of the empire's great offices can be kept at a time."

 azt_excan_tlatoloyan_bureaucracy: "Excan Tlatoloyan"
 azt_excan_tlatoloyan_bureaucracy_desc: "Après la destruction d'Azcapotzalco en 1428, Itzcoatl de Tenochtitlan, Nezahualcoyotl de Tetzcoco et Totoquilhuaztli de Tlacopan acceptèrent de partager le tribut impérial dans un rapport de 2 : 2 : 1 et de coordonner les campagnes. L'associé principal Tenochtitlan présidait, mais les tribunaux de Tetzcoco et les contingents militaires de Tlacopan étaient administrés de manière indépendante. L'alliance a duré quatre-vingt-dix ans, projetant la puissance mexicaine du Pacifique jusqu'au Golfe. Lorsque les partenaires ont dérivé, les villes tributaires ont senti une faiblesse et le périmètre s'est effondré."

 azt_calpixqui_tribute_bureaucracy: "Service Calpixque"
 azt_calpixqui_tribute_bureaucracy_desc: "Les calpixques (« ceux qui veillent ») étaient des surveillants impériaux stationnés dans les villes conquises pour tenir les registres des tributs. Le Codex Mendoza préserve le calendrier : chacune des trente-huit provinces tributaires livrait des quantités fixes de manteaux de coton, de fèves de cacao, de plumes de quetzal, de poussière d'or, de chaux, de copal et de guerriers deux fois par an. Les calpixqui expédiaient des marchandises à Tenochtitlan, enregistraient les déficits et organisaient des expéditions punitives en cas de non-paiement. Un service diligent enrichit le trône; un système laxiste a laissé les provinces écrémer jusqu'à ce que l'hommage devienne fictif."

 azt_pochteca_guild_bureaucracy: "Guilde Pochteca"
 azt_pochteca_guild_bureaucracy_desc: "The pochteca were the long-distance merchant brotherhood of Tlatelolco, organized in twelve great cities and answerable to their own tribunal at the Tlatelolco market, the largest in the Americas. They carried obsidian, cacao, gold ornaments, and quetzal feathers from Soconusco to the Gulf coast in armed caravans. A specialized branch, the naualoztomeca or 'disguised merchants', reported on unconquered lands while trading in them; their intelligence justified subsequent imperial campaigns. Their wealth let them buy the costume of nobility, which the hereditary pipiltin bitterly resented."

 azt_calmecac_schools_bureaucracy: "Écoles Calmécac"
 azt_calmecac_schools_bureaucracy_desc: "Les calmecac étaient les académies sacerdotales attachées à chaque temple majeur, où les garçons du rang pipiltin et les enfants du roturier sélectionnés entraient en tant que petits enfants. Ils apprirent l'écriture picturale des codex, le calendrier divinatoire tonalpohualli, l'art oratoire dans le registre raffiné des huehuetlatolli, les histoires et les disciplines du jeûne et de l'auto-mortification. Les diplômés de Calmecac occupaient les rangs de la prêtrise, de la haute magistrature et de capitaine général ; Sous les réformes de Tlacaelel, ils sont devenus les producteurs officiels d'élites alphabétisées de l'empire. Leur prestige les protégeait de la politique de cour, et une classe de prêtres et de nobles complaisants pouvait serrer les rangs contre les étrangers."

 azt_calpulli_wards_bureaucracy: "Quartiers de Calpulli"
 azt_calpulli_wards_bureaucracy_desc: "Les calpulli étaient les unités du clan de paroisse de Tenochtitlan et de l'affluent altepetl : des propriétaires terriens collectifs dont les aînés attribuaient le milpa aux ménages membres, envoyaient les garçons au telpochcalli (l'école militaire roturière), alignaient un gang de rotation pour la corvée d'État sur les chinampas et les chaussées, et représentaient leurs membres devant les tribunaux. Chaque calpulli avait son propre temple et son propre patron. Calpulli était le fondement de la vie civique mexicaine et le terrain de recrutement de l'armée impériale ; les paroisses bien entretenues remplissaient les quotas, tandis que les paroisses négligées se fragmentaient en lignées rivales pour le rare milpa."

 azt_cuauhpipiltin_orders_bureaucracy: "Commandes Cuauhpipiltin"
 azt_cuauhpipiltin_orders_bureaucracy_desc: "Les guerriers aigles et jaguars (cuauhpipiltin, « aigles-nobles ») formaient la méritocratie militaire d’élite de l’empire. Un roturier qui faisait quatre prisonniers ennemis en combat singulier était élevé au rang de cuauhpilli avec le droit de porter du coton, de boire de l'octli, de dîner au palais royal et de posséder des terres en son propre nom. Moctezuma I a codifié les rangs des quotas de captifs ; Tlacaelel fit des ordres un contrepoids permanent au pipiltin héréditaire. Ils menèrent les assauts les plus féroces de l'empire; en déclin, ils dégénérèrent en chasseurs de captifs avides de statut qui se battaient pour la gloire individuelle tandis que la cohorte se dissolvait autour d'eux."

 azt_tlatocan_council_bureaucracy: "Conseil de Tlatocán"
 azt_tlatocan_council_bureaucracy_desc: "Le Tlatocan était le conseil suprême assis à côté du huey tlatoani à Tenochtitlan, comprenant le cihuacoatl (ministre en chef et vizir de facto), le tlacochcalcatl et le tlacateccatl (les deux capitaines généraux), les grands prêtres et les principaux seigneurs pipiltin. Il élisait chaque nouveau tlatoani parmi la lignée royale à la mort de son prédécesseur et siégeait pour juger les crimes graves. Des tlatoques forts (Itzcoatl avec Tlacaelel, Moctezuma Ier, Ahuitzotl) ployèrent le conseil à leur volonté; les plus faibles étaient gérés par lui, et un Tlatocan divisé pouvait paralyser le trône par des intrigues factionnelles."
