l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_the_prophet: "Épée du Prophète"
 STATIC_MODIFIER_DESC_nd_sword_of_the_prophet: "L’État arabe uni sera forgé grâce à l’épée de la foi, sa cavalerie balayant le désert pour rassembler les tribus dispersées sous une seule bannière. De La Mecque jusqu’aux oasis les plus lointaines, l’appel aux armes résonnera."
 STATIC_MODIFIER_NAME_nd_cradle_of_civilization: "Berceau de la civilisation"
 STATIC_MODIFIER_DESC_nd_cradle_of_civilization: "L'Arabie se situe au carrefour de trois continents, héritière des routes de l'encens, du commerce des pèlerinages et des traditions savantes qui ont illuminé le monde de Bagdad à Cordoue. Cet héritage de commerce et d’apprentissage sera le fondement d’un État plus grand."
 STATIC_MODIFIER_NAME_nd_aia_mocha_trade_boom: "Boom du commerce du moka"
 STATIC_MODIFIER_DESC_nd_aia_mocha_trade_boom: "Le port de Mocha regorge de commerce alors que les marchands d'Europe, d'Inde et d'Afrique convergent pour commercer les grains sombres et aromatiques qui ont conquis les palais du monde entier."
 STATIC_MODIFIER_NAME_nd_aia_wahhabi_zeal: "Le zèle wahhabite"
 STATIC_MODIFIER_DESC_nd_aia_wahhabi_zeal: "Le message réformiste austère a balayé la péninsule, purgeant ce que ses partisans considèrent comme des innovations et ramenant les fidèles aux pratiques primitives des premières générations."
 STATIC_MODIFIER_NAME_nd_aia_wahhabi_pragmatism: "Réforme pragmatique"
 STATIC_MODIFIER_DESC_nd_aia_wahhabi_pragmatism: "L’impulsion en faveur d’un renouveau religieux a été tempérée par le réalisme politique, créant un État qui valorise la clarté doctrinale tout en conservant la flexibilité diplomatique nécessaire pour gouverner une péninsule diversifiée."
 nd_aia.1.t: "L'unification de l'Arabie"
 nd_aia.1.d: "After generations of tribal fragmentation, the Arabian Peninsula is united under a single banner for the first time since the early caliphates. The holy cities of Mecca and Medina, the incense ports of Yemen, the pearl-rich shores of the Gulf, and the vast Najdi interior all answer to one sovereign.\n\nThis is a moment of profound significance. The land that gave birth to Islam and served as the crossroads of ancient trade routes is whole again. But what path shall this reborn Arabia follow? Shall it raise the banner of jihad and ride forth to expand the faith by force of arms, as the first caliphs did? Or shall it look inward, cultivating the trade networks and scholarly traditions that made Arabia the envy of empires?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_aia.1.a: "Partez sous la bannière de la foi !"
 nd_aia.1.b: "Nous serons à nouveau le carrefour du monde."
 nd_aia.2.t: "Le Café Moka"
 nd_aia.2.d: "The port of Mocha on the Red Sea coast has become the center of a new and extraordinary trade. Coffee, first cultivated in the highlands of Yemen by Sufi mystics seeking to stay awake for night prayers, has captivated the tastes of the wider world. European, Indian, and Ottoman merchants crowd the harbor, their ships laden with silver and goods to exchange for sacks of dark, aromatic beans.\n\nCoffeehouses have sprung up across Arabia and beyond, becoming centers of conversation, commerce, and political debate. The governors of Mocha grow wealthy from export duties, and the highland farmers tend their precious plants with jealous care, prohibiting the export of fertile seeds to prevent rivals from establishing their own plantations."
 nd_aia.2.a: "Moka sera le joyau de notre empire commercial."
 nd_aia.2.b: "Contrôlez les plantations, contrôlez les richesses."
 nd_aia.3.t: "La Réforme wahhabite"
 nd_aia.3.d: "A religious scholar from the Najd, Muhammad ibn Abd al-Wahhab, has ignited a movement that is transforming the peninsula. Preaching a return to what he considers the pure, original practices of Islam, he denounces the veneration of saints, the elaborate rituals of Sufi orders, and what he sees as centuries of accumulated superstition and innovation.\n\nHis alliance with a local ruler has created a formidable religio-political movement. Warriors inspired by his teachings sweep through the desert, toppling shrines and demanding submission to their austere vision of the faith. The movement's energy is undeniable, but its rigid interpretation of doctrine risks alienating moderate subjects and neighboring powers alike.\n\nHow shall we respond to this upheaval of the spirit?"
 nd_aia.3.a: "Embrassez le feu purificateur de la réforme."
 nd_aia.3.b: "Canaliser la réforme avec une gouvernance pragmatique."
 nd_aia.4.t: "L'avènement de l'Ikhwan"
 nd_aia.4.d: "A new breed of warrior has emerged from the settlements of the Najdi desert. The Ikhwan, the 'Brothers,' are former Bedouin tribesmen who have abandoned their nomadic ways to settle in agricultural communities dedicated to religious study and military training.\n\nDriven by intense religious conviction, they combine the desert endurance and riding skills of their ancestors with a fanatical discipline that makes them fearsome on the battlefield. They fight not for plunder or tribal honor, but for the glory of God and the expansion of the true faith. Their settlements, the hijra, serve as both military garrisons and centers of religious instruction."
 nd_aia.4.a: "Ces guerriers seront l'avant-garde de notre destin."
 nd_aia_bedouin_raiders: "Traditions des raids bédouins"
 nd_aia_bedouin_raiders_desc: "La razzia bédouine, le raid éclair à travers le désert, est à la fois un art de guerre et un mode de vie, affiné au fil des siècles de conflits tribaux dans les déserts arabes."
 nd_aia_incense_route: "La Route des Encens"
 nd_aia_incense_route_desc: "Pendant des millénaires, les richesses du sud de l’Arabie ont afflué vers le nord le long des routes caravanières transportant de l’encens et de la myrrhe depuis les bosquets du Dhofar et de l’Hadramaout jusqu’aux marchés de la Méditerranée."
 nd_aia_falaj_irrigation: "Spate Irrigation"
 nd_aia_falaj_irrigation_desc: "When the rains break in the mountains, the wadis of the Tihama and the Hadramawt run for a few days. Earth and stone barrages turn the flood onto the fields, and each village takes its turn at the water by a rule older than any dynasty."
 nd_aia_tribal_confederacy: "Confédération tribale"
 nd_aia_tribal_confederacy_desc: "La gouvernance arabe repose sur l'équilibre délicat des alliances tribales, où un cheikh suprême maintient son autorité par le biais de son prestige personnel, de ses obligations mutuelles et de la répartition du butin des pillages."
 nd_aia_pearl_diving: "Pêche des perles"
 nd_aia_pearl_diving_desc: "Les eaux peu profondes du golfe Persique produisent des perles d'un éclat extraordinaire, récoltées par des plongeurs qui descendent au fond de la mer avec rien d'autre qu'une pierre lestée et des protège-doigts en cuir."
 nd_aia_desert_navigation: "Navigation dans le désert"
 nd_aia_desert_navigation_desc: "Les navigateurs bédouins lisent le désert comme les marins lisent la mer, par les étoiles, les vents dans le sable et les subtiles variations du terrain qui marquent les chemins entre des oasis lointaines."
 nd_aia_dhow_shipbuilding: "Construction navale de boutres"
 nd_aia_dhow_shipbuilding_desc: "Ce boutre distinctif au gréement latin, avec sa coque en planches cousues et son faible tirant d'eau, est parfaitement adapté aux vents de mousson de l'océan Indien et aux eaux peu profondes du Golfe."
 nd_aia_hajj_economy: "L’économie du Hajj"
 nd_aia_hajj_economy_desc: "Des millions de pèlerins se rendant chaque année à La Mecque et à Médine créent un vaste moteur économique de caravansérails, d'approvisionnements, de guides et de marchands qui fait vivre le Hedjaz."
 nd_aia_qadi_courts: "Tribunaux Qadi"
 nd_aia_qadi_courts_desc: "Le cadi, instruit dans la jurisprudence islamique, sert de juge dans les litiges tant civils que pénaux, fournissant un cadre d'ordre public enraciné dans le Coran et les hadiths."
 nd_aia_date_palm_groves: "Culture du palmier dattier"
 nd_aia_date_palm_groves_desc: "The date palm is the tree of life in Arabia, providing food, timber, fiber for rope, and shade for other crops. Its cultivation in irrigated oases is the foundation of settled Arabian life."
 nd_aia_arabian_horse_breeding: "Élevage de chevaux arabes"
 nd_aia_arabian_horse_breeding_desc: "Le cheval arabe de race pure, élevé pour son endurance, sa loyauté et sa rapidité au cours de millénaires de soins sélectifs, est la monture de cavalerie la plus prisée au monde. Les tribus bédouines protègent la lignée de leurs juments avec autant de zèle que leur honneur."
 nd_aia_sufi_mysticism: "Mysticisme soufi"
 nd_aia_sufi_mysticism_desc: "Les ordres mystiques de l’Islam ont de profondes racines en Arabie, où les cheikhs soufis dirigent les communautés dans des exercices spirituels, dans la poésie et dans la poursuite de la connaissance divine par l’expérience directe."
 nd_aia_mocha_coffee: "Commerce du café moka"
 nd_aia_mocha_coffee_desc: "Le port de Mocha au Yémen est devenu la seule porte d'entrée pour l'approvisionnement mondial en café, une denrée qui a donné naissance à un réseau mondial de cafés et à un monopole lucratif."
 nd_aia_indian_ocean_trade: "Commerce maritime dans l’océan Indien"
 nd_aia_indian_ocean_trade_desc: "Les boutres arabes empruntent les routes de la mousson depuis des siècles, reliant la mer Rouge et le golfe Persique à l'Inde, à l'Afrique de l'Est et aux îles aux épices de l'Asie du Sud-Est."
 nd_aia_imamate_governance: "Gouvernance de l'imamat"
 nd_aia_imamate_governance_desc: "L'imamat ibadite d'Oman et l'imamat zaïdi du Yémen représentent des traditions arabes distinctes d'autorité politico-religieuse, où l'imam combine leadership spirituel et gouvernance temporelle."
 nd_aia_desert_fortresses: "Forteresses du désert"
 nd_aia_desert_fortresses_desc: "Le qasr, une forteresse fortifiée du désert en briques crues et en pierre, garde les routes commerciales et les sources d'eau de l'intérieur, servant à la fois de garnison militaire et de centre d'autorité tribale."
 nd_aia_spice_middlemen: "Intermédiaires en épices"
 nd_aia_spice_middlemen_desc: "Les marchands arabes ont longtemps servi d’intermédiaires dans le commerce des épices, achetant du poivre, de la cannelle et des clous de girofle auprès de producteurs indiens et d’Asie du Sud-Est et les revendant à des prix énormes aux acheteurs européens et ottomans."
 nd_aia_musket_adoption: "Adoption des armes à feu arabes"
 nd_aia_musket_adoption_desc: "L'adoption des armes à feu par les guerriers arabes transforme la guerre dans le désert, combinant la mobilité des nomades à cheval avec la puissance de feu dévastatrice du mousquet à mèche."
 nd_aia_sharif_authority: "Autorité chérifienne"
 nd_aia_sharif_authority_desc: "Les chérifs de La Mecque, prétendant descendre du prophète Mahomet, exercent une autorité qui transcende les frontières tribales, conférant une légitimité à tout dirigeant pouvant obtenir leur soutien."
 nd_aia_aden_entrepot: "L'entrepôt d'Aden"
 nd_aia_aden_entrepot_desc: "Le port naturel d'Aden, dominant le détroit entre la mer Rouge et l'océan Indien, est un entrepôt vital pour le commerce maritime depuis l'Antiquité."
 nd_aia_tribal_cavalry_reform: "Réforme de la cavalerie tribale"
 nd_aia_tribal_cavalry_reform_desc: "Le style de raid bédouin traditionnel est formalisé en formations de cavalerie disciplinées, conservant la mobilité et l'équitation du désert tout en ajoutant une coordination tactique et un objectif stratégique."
 nd_aia_camel_corps: "Corps de chameaux"
 nd_aia_camel_corps_desc: "Le dromadaire, capable de parcourir de grandes distances sans eau, permet la création d’unités militaires capables de traverser des terrains infranchissables pour les armées conventionnelles."
 nd_aia_wahhabi_reform: "Mouvement réformateur wahhabite"
 nd_aia_wahhabi_reform_desc: "L’alliance entre le réformateur religieux Muhammad ibn Abd al-Wahhab et la maison des Saoud en 1744 crée un puissant mouvement politico-religieux qui transforme la péninsule arabique."
 nd_aia_ikhwan_warriors: "Les guerriers Ikhwan"
 nd_aia_ikhwan_warriors_desc: "Les Ikhwan, guerriers bédouins sédentaires dédiés à l'étude religieuse et au service militaire, combinent l'endurance des nomades du désert avec la discipline des fanatiques motivés."
 nd_aia_arabian_modernization: "Modernisation arabe"
 nd_aia_arabian_modernization_desc: "Les contacts avec les puissances ottomanes et européennes introduisent de nouvelles idées de gouvernance, de technologie et d’éducation dans la péninsule, stimulant les efforts de modernisation sans abandonner la tradition."
 nd_aia_oasis_agriculture: "Agriculture oasienne"
 nd_aia_oasis_agriculture_desc: "Advanced irrigation techniques transform scattered oases into productive agricultural centers, supporting larger populations and providing the economic base for a centralized state.\n\n#italic Available in: $nd_aia_date_grove$#!"
 nd_aia_pearl_trade_boom: "Boom du commerce des perles"
 nd_aia_pearl_trade_boom_desc: "The insatiable global demand for Gulf pearls has transformed coastal communities into prosperous trading centers, with pearl merchants commanding wealth that rivals that of the great caravan traders.\n\n#italic Available in: $nd_aia_pearl_house$#!"
 nd_aia_gulf_patrol: "Patrouille navale du Golfe"
 nd_aia_gulf_patrol_desc: "Des navires de patrouille armés gardent les voies maritimes vitales du golfe Persique et de la mer Rouge, protégeant le commerce arabe des pirates et projetant leur puissance au-delà de la frontière maritime."
 nd_aia_modern_arab_army: "Armée arabe moderne"
 nd_aia_modern_arab_army_desc: "La création d’une armée permanente formée aux méthodes militaires européennes marque la transformation de l’Arabie d’une confédération de guerriers tribaux en un État moderne capable de projeter un pouvoir centralisé."
 nd_aia_arab_nationalism: "Réveil national arabe"
 nd_aia_arab_nationalism_desc: "Une nouvelle conscience d’une identité arabe partagée, enracinée dans une langue, une histoire et une culture communes, inspire un mouvement pour l’unité politique et l’autodétermination à travers la péninsule."
 nd_aia_port_modernization: "Modernisation du port"
 nd_aia_port_modernization_desc: "La modernisation des ports arabes avec des quais, des entrepôts et des installations de réparation de style européen relie la péninsule à l’économie mondiale de l’ère industrielle."
 nd_aia_desert_infrastructure: "Infrastructure du désert"
 nd_aia_desert_infrastructure_desc: "La construction de routes et de lignes de communication à travers le vaste intérieur arabe lie pour la première fois les oasis dispersées et les territoires tribaux en un État unifié."
 nd_aia_tribal_conscription: "Conscription tribale"
 nd_aia_tribal_conscription_desc: "L’obligation tribale traditionnelle de fournir des guerriers sur demande est formalisée dans un système de conscription, garantissant que chaque colonie contribue à la défense de l’État unifié."
 nd_aia_unified_arab_state: "État arabe unifié"
 nd_aia_unified_arab_state_desc: "Le point culminant de siècles d’efforts, un État arabe centralisé qui a transcendé les divisions tribales, intégrant divers peuples sous une administration commune et une identité partagée."
 a_nd_aia_bedouin_raider: "Pillard bédouin"
 a_nd_aia_bedouin_raider_desc: "Cavalerie du désert ultra-rapide issue des levées tribales, experte en razzia, la frappe de raid traditionnelle des Bédouins qui terrorise les caravanes et les peuples sédentaires depuis des temps immémoriaux."
 a_nd_aia_musketeer: "Mousquetaire arabe"
 a_nd_aia_musketeer_desc: "Infanterie disciplinée armée de mousquets à mèche, entraînée à lancer des volées dévastatrices avant de dégainer ses épées courbes pour un combat rapproché dans la tradition arabe."
 a_nd_aia_najdi_cavalry: "Cavalerie Najdi"
 a_nd_aia_najdi_cavalry_desc: "Cavalerie tribale réformée du cœur du Najd, combinant l'équitation traditionnelle du désert avec des formations tactiques disciplinées. Suprême dans la guerre aride et désertique."
 a_nd_aia_camel_rider: "Cavalier de chameau"
 a_nd_aia_camel_rider_desc: "Mounted on the hardy dromedary, these riders can traverse vast stretches of waterless desert, serving as scouts, raiders and light cavalry where no horse-mounted force can follow."
 a_nd_aia_ikhwan: "Guerrier Ikhwan"
 a_nd_aia_ikhwan_desc: "Infanterie fanatiquement dévouée, issue des communautés bédouines sédentaires, les Ikhwan combattent avec une ferveur née de profondes convictions religieuses, ce qui en fait de redoutables troupes de choc."
 a_nd_aia_modern_infantry: "Infanterie arabe moderne"
 a_nd_aia_modern_infantry_desc: "Infanterie régulière formée aux méthodes militaires européennes, équipée d'armes modernes et organisée en formations disciplinées capables de mener des campagnes soutenues."
 a_nd_aia_tribal_conscript: "Conscrit tribal"
 a_nd_aia_tribal_conscript_desc: "Des guerriers enrôlés issus des communautés tribales sédentaires, fournissant l'infanterie de masse nécessaire à la défense de l'État arabe élargi."
 n_nd_aia_dhow: "Boutre arabe"
 n_nd_aia_dhow_desc: "Le navire de commerce emblématique au gréement latin du monde arabe, rapide et agile dans les vents de mousson, bien que légèrement armé par rapport aux navires de guerre européens."
 n_nd_aia_ocean_dhow: "Boutre de l'océan Indien"
 n_nd_aia_ocean_dhow_desc: "Une variante océanique plus grande du boutre traditionnel, capable de parcourir les longues routes de mousson entre l'Arabie, l'Inde et l'Afrique de l'Est."
 n_nd_aia_patrol_ship: "Navire de patrouille du Golfe"
 n_nd_aia_patrol_ship_desc: "Un navire côtier armé conçu pour patrouiller les eaux peu profondes du golfe Persique et de la mer Rouge, protégeant les routes commerciales des pirates et des intrus étrangers."
 nd_aia_incense_warehouse: "Entrepôt d'encens"
 nd_aia_incense_warehouse_desc: "Un entrepôt fortifié pour les précieuses résines d'encens et de myrrhe, anciennes richesses de l'Arabie du Sud qui coulaient autrefois le long des routes caravanières vers le monde méditerranéen."
 nd_aia_falaj_system: "Wadi Barrage"
 nd_aia_falaj_system_desc: "A deflector of earth and stone across the wadi bed. It turns the seasonal flood into canals and onto the fields, which are soaked once and sown at once."
 nd_aia_date_grove: "Date Palm Grove"
 nd_aia_date_grove_desc: "An irrigated palm garden of the oasis. The dates are picked, dried and packed in jars for the caravans and the ships."
 nd_aia_hajj_caravanserai: "Caravansérail du Hajj"
 nd_aia_hajj_caravanserai_desc: "Une étape sur les routes de pèlerinage vers la Mecque, fournissant de la nourriture, de l'eau, un abri et des opportunités commerciales au flot incessant de fidèles effectuant le hajj."
 nd_aia_coffeehouse: "Café Moka"
 nd_aia_coffeehouse_desc: "Un lieu de rassemblement où marchands, érudits et voyageurs échangent des nouvelles et des idées autour de tasses de café noir et aromatique des hauts plateaux yéménites."
 nd_aia_desert_qasr: "Qasr du désert"
 nd_aia_desert_qasr_desc: "Une forteresse fortifiée du désert en briques crues et en pierre, protégeant les routes commerciales et les sources d'eau de l'intérieur arabe contre les pillards et les envahisseurs."
 nd_aia_entrepot: "Entrepôt Entrepôt"
 nd_aia_entrepot_desc: "Un entrepôt commercial majeur dans une ville portuaire, où les marchandises en provenance d'Inde, d'Afrique et d'Europe sont stockées, triées et revendues, constituant l'épine dorsale du commerce maritime arabe."
 nd_aia_pearl_house: "Maison de plongée Perle"
 nd_aia_pearl_house_desc: "Une maison marchande spécialisée dans le commerce des perles du Golfe, triant, classant et vendant les pierres précieuses brillantes qui constituent la principale richesse de la côte arabe depuis des millénaires."
 nd_aia_modern_port: "Port moderne"
 nd_aia_modern_port_desc: "Une installation portuaire équipée de quais, de grues et de chantiers de réparation modernes, reliant l'Arabie au commerce maritime à vapeur de l'ère industrielle."
 nd_aia_pearl_harvest: "Récolte de perles"
 nd_aia_pearl_harvest_desc: "Les plongeurs descendent dans les parcs à huîtres du golfe Persique, récoltant les perles brillantes qui ont fait la richesse de la côte du golfe pendant des millénaires."
 nd_aia_date_processing: "Traitement des dates"
 nd_aia_date_processing_desc: "La récolte, le séchage et le conditionnement des dattes provenant des vastes palmeraies de la péninsule pour le commerce à travers le monde islamique."
 nd_aia_oasis_farming: "Agriculture oasienne"
 nd_aia_oasis_farming_desc: "Fruit trees are planted under the palms, and fodder and vegetables under those. Worked with iron tools and draught animals, the grove yields far more."
 nd_incense_storage: "Stockage d'encens"
 nd_incense_storage_desc: "Stockage et tri de l'encens et de la myrrhe provenant des routes commerciales de l'encens d'Arabie, avec des emballages en tissu préservant les précieuses résines pour l'exportation."
 nd_falaj_maintenance: "Barrage Upkeep"
 nd_falaj_maintenance_desc: "Stone for the deflector, timber for the sluices and tools for the men who rebuild the earth bank after every flood."
 nd_hajj_provisions: "Dispositions du Hajj"
 nd_hajj_provisions_desc: "Provisioning pilgrim caravans with livestock, grain and waterskins for the journey to Mecca."
 nd_coffee_service: "Service de café"
 nd_coffee_service_desc: "Approvisionnement et torréfaction des grains de café de Moka, servis dans des tasses en céramique aux marchands et aux érudits qui fréquentent le café."
 nd_qasr_garrison: "Garnison de Qasr"
 nd_qasr_garrison_desc: "Armer et approvisionner la garnison d'une forteresse fortifiée du désert, en armes, en pierre pour la réparation des murs et en cuir pour l'entretien des armures et de l'équipement."
 nd_entrepot_operations: "Opérations d'entrepôt"
 nd_entrepot_operations_desc: "Gérer le stockage et la redistribution des textiles, des poteries et des conserves importés dans un important entrepôt commercial, où le sel préserve les cargaisons contre le long voyage en mer."
 nd_pearl_sorting: "Tri des perles"
 nd_pearl_sorting_desc: "Trier, classer et polir les perles du Golfe avec du tissu fin, en utilisant les outils du métier de plongeur pour les préparer à la vente aux marchands internationaux."
 nd_port_operations: "Opérations portuaires"
 nd_port_operations_desc: "Exploiter une installation portuaire moderne avec des quais à bois et des magasins navals."
 STATIC_MODIFIER_NAME_nd_aia_coffee_monopoly: "Monopole du café"
 STATIC_MODIFIER_DESC_nd_aia_coffee_monopoly: "Un contrôle strict sur les plantations de café des hauts plateaux yéménites et sur les installations d'exportation de Mocha crée un monopole sur le produit le plus en vogue au monde."
 nd_aia_formed_tt: "L'Arabie a été formée"
 nd_aia_path_a_tt: "Choisissez l'épée du prophète"
 nd_aia_path_b_tt: "Choisissez le berceau de la civilisation"
 nd_aia_dest_lower_egypt_share_tt: "At least #bold 50%#! of the locations of #bold Lower Egypt#! are ours"
 nd_aia_dest_levant_share_tt: "At least #bold 50%#! of the locations of the #bold Levant#! are ours"
 nd_aia_dest_jeddah_developed_tt: "We own #bold Jeddah#! and its development is at least #bold 11#!"
 nd_aia_dest_adan_developed_tt: "We own #bold Aden#! and its development is at least #bold 28#!"
 nd_aia_destiny: "Destin de l'Arabie"
 nd_aia_destiny_desc: "Avec l’Arabie unie, la question de son avenir se pose avec éclat. La péninsule doit-elle se tourner vers l’extérieur, vers la conquête et la foi, ou vers l’intérieur, vers le commerce et la civilisation ? La stabilité du royaume doit d’abord être assurée avant que l’une ou l’autre voie puisse être suivie."
 nd_aia_dest_crescent: "Le Croissant Fertile"
 nd_aia_dest_crescent_desc: "The lands of the Fertile Crescent, Damascus, seat of the Umayyads, and Baghdad, city of the Abbasids, were once the heartlands of Arab civilization. To restore the caliphate, these ancient capitals must be reclaimed, and with them Kufa, the camp city of the first conquests."
 nd_aia_dest_jihad: "Jihad des fidèles"
 nd_aia_dest_jihad_desc: "The holy city of Jerusalem and the ancient land of Egypt must be brought under the banner of the restored Arab state. With Cairo, half of Lower Egypt behind it and Jerusalem's sanctity, the caliphate's claim to lead the Muslim world becomes unassailable."
 nd_aia_dest_caliphate: "Le califat restauré"
 nd_aia_dest_caliphate_desc: "From Aleppo to Basra, from Mosul to the desert's edge, the full extent of the original caliphate must be reunited under Arab rule, with half of the Levant held and not its cities alone. This is the ultimate ambition, a new golden age of Islamic civilization, governed from Arabia."
 nd_aia_dest_gulf: "Maîtres du Golfe"
 nd_aia_dest_gulf_desc: "Le détroit d’Ormuz et les ports d’Oman contrôlent les flux commerciaux entre l’océan Indien et le golfe Persique. Pour devenir le carrefour du monde, l’Arabie doit d’abord maîtriser ces points d’étranglement vitaux et accumuler les richesses qu’ils génèrent."
 nd_aia_dest_monsoon: "Les routes de la mousson"
 nd_aia_dest_monsoon_desc: "Arabian merchants have sailed the monsoon winds for millennia, but modern commerce demands modern institutions. Banking, the incense that once made Arabia rich, and Jeddah, where the India fleets come in on the monsoon, must all be harnessed to build a trading civilization that rivals any in the world."
 nd_aia_dest_crossroads: "Carrefour des continents"
 nd_aia_dest_crossroads_desc: "Aden commands the passage between the Red Sea and the Indian Ocean, the hinge between three continents. With the port built up into a great city, the pepper of India passing through its markets and vast wealth accumulated, Arabia can claim its ultimate destiny, not as a conqueror, but as the indispensable hub through which the world's commerce must flow."
 nd_aia.5.t: "Ascendant Arabie"
 nd_aia.5.d: "La péninsule est unie, les tribus ont prêté allégeance et les villes saintes sont sous notre protection. Pour la première fois depuis des siècles, un État arabe suscite le respect parmi les puissances du monde. La question n’est plus de savoir si l’Arabie va s’élever, mais jusqu’à quel point."
 nd_aia.5.a: "Notre destin nous attend."
 nd_aia.6.t: "Le croissant récupéré"
 nd_aia.6.d: "Damas et Bagdad, les joyaux jumeaux de la civilisation arabe, répondent une fois de plus à un souverain arabe. Les grandes mosquées qui faisaient écho aux décrets des califes passés résonneront à nouveau avec l’autorité d’un État arabe renouvelé. Le Croissant Fertile, grenier des empires, nourrit nos ambitions comme il nourrissait autrefois les Abbassides."
 nd_aia.6.a: "Les anciennes capitales sont à nouveau les nôtres."
 nd_aia.7.t: "La Terre Sainte sécurisée"
 nd_aia.7.d: "Jérusalem est sous notre protection, et les richesses de l'Égypte coulent dans notre trésor. L’État arabe restauré contrôle désormais à la fois l’autorité spirituelle des lieux saints et les ressources matérielles de la vallée du Nil. Pourtant, la question se pose : allons-nous avancer avec ferveur militante, prenant d’assaut toutes les forteresses sur notre passage ? Ou devons-nous consolider ces vastes acquis avec des garnisons et de la patience, laissant notre force croître derrière des murs fortifiés ?"
 nd_aia.7.a: "Appuyez sur l'attaque sans pitié !"
 nd_aia.7.b: "Fortifiez ce que nous détenons et devenez forts."
 nd_aia.8.t: "Le califat renaît"
 nd_aia.8.d: "From the shores of the Mediterranean to the headwaters of the Tigris, from the deserts of Sinai to the mountains of Kurdistan, the caliphate lives again. Not since the age of Harun al-Rashid has an Arab sovereign commanded such vast domains. The world watches as Arabia takes its place among the great empires of history.\n\nBut how shall this restored caliphate define itself? As the sword that expands the faith through force of arms? Or as the just ruler who governs diverse peoples with wisdom and wins their loyalty through fair dealing?"
 nd_aia.8.a: "Par l’épée de Dieu, nous vaincrons !"
 nd_aia.8.b: "La justice et la sagesse seront notre héritage."
 nd_aia.9.t: "Maîtres du détroit"
 nd_aia.9.d: "Le grand point d’étranglement d’Ormuz est le nôtre et l’ancien port de Mascate bat pavillon arabe. Tout navire passant entre l’océan Indien et le golfe Persique doit désormais reconnaître la suprématie arabe. Les richesses de l’Inde, de la Perse et de l’Afrique de l’Est coulent à travers les eaux que nous contrôlons."
 nd_aia.9.a: "Le Golfe est une mer d'Arabie."
 nd_aia.10.t: "Les vents de mousson"
 nd_aia.10.d: "Our merchants ride the monsoon winds from the Gulf to India and beyond, while our banks finance the trade that passes through our ports. The ancient incense routes have given way to a modern commercial network, but Arabia remains at its center.\n\nShall we build a navy to protect and enforce our maritime dominion by force? Or shall we focus on the institutions of trade, the banks, the exchanges, the merchant houses, that make our ports indispensable regardless of who commands the seas?"
 nd_aia.10.a: "Commandez les mers avec des navires de guerre arabes !"
 nd_aia.10.b: "Construisons les institutions qui nous rendent riches."
 nd_aia.11.t: "Carrefour du monde"
 nd_aia.11.d: "Arabia stands at the intersection of three continents, and the world's trade flows through our ports. From Aden to Hormuz, from Jeddah to Muscat, Arabian merchants connect Europe with Asia and Africa with the East. Our banking houses finance ventures across oceans, and our markets set prices that echo in distant capitals.\n\nThis is the zenith of Arabian commerce. Shall we use this position to foster a new golden age of arts, learning, and diplomacy? Or shall we press our commercial advantage to its fullest, ensuring that Arabia remains the indispensable crossroads through which all trade must pass?"
 nd_aia.11.a: "Inaugurez un nouvel âge d’or !"
 nd_aia.11.b: "Nous sommes le carrefour. Le monde nous paie."
 STATIC_MODIFIER_NAME_nd_aia_dest_militant_jihad: "Jihad militant"
 STATIC_MODIFIER_DESC_nd_aia_dest_militant_jihad: "Les guerriers du califat prennent d’assaut les fortifications avec un courage fanatique, écrasant les défenseurs par leur agressivité et leur initiative tactique."
 STATIC_MODIFIER_NAME_nd_aia_dest_caliphal_garrison: "Garnison califale"
 STATIC_MODIFIER_DESC_nd_aia_dest_caliphal_garrison: "Un réseau de garnisons fortifiées sécurise les vastes nouveaux territoires du califat, avec des murs renforcés et des troupes disciplinées maintenant l'ordre dans les terres conquises."
 STATIC_MODIFIER_NAME_nd_aia_dest_sword_of_islam: "Épée de l'Islam"
 STATIC_MODIFIER_DESC_nd_aia_dest_sword_of_islam: "La machine militaire du califat fonctionne avec une efficacité impitoyable, menant des campagnes sur de vastes distances tandis que les fidèles combattent avec un dévouement infatigable."
 STATIC_MODIFIER_NAME_nd_aia_dest_just_caliph: "Le juste calife"
 STATIC_MODIFIER_DESC_nd_aia_dest_just_caliph: "Le calife gouverne avec sagesse et équité, gagnant la loyauté de divers peuples grâce à une administration juste et à des réseaux de renseignement astucieux."
 STATIC_MODIFIER_NAME_nd_aia_dest_maritime_dominion: "Domination maritime"
 STATIC_MODIFIER_DESC_nd_aia_dest_maritime_dominion: "Les navires de guerre arabes assurent le contrôle des voies maritimes vitales, bloquant leurs rivaux et protégeant les flottes marchandes qui transportent les richesses de trois continents."
 STATIC_MODIFIER_NAME_nd_aia_dest_trading_empire: "Empire commercial"
 STATIC_MODIFIER_DESC_nd_aia_dest_trading_empire: "Un vaste réseau de navires marchands relie les ports arabes aux marchés de l’océan Indien, soutenu par des capitaines expérimentés et des accords bancaires avantageux."
 STATIC_MODIFIER_NAME_nd_aia_dest_golden_age: "Âge d'or arabe"
 STATIC_MODIFIER_DESC_nd_aia_dest_golden_age: "Une renaissance des arts, du savoir et de la diplomatie rayonne de la péninsule arabique, alors que la richesse du commerce finance des universitaires, des artistes et des ambassadeurs à travers le monde connu."
 STATIC_MODIFIER_NAME_nd_aia_dest_worlds_crossroads: "Carrefour du monde"
 STATIC_MODIFIER_DESC_nd_aia_dest_worlds_crossroads: "L’Arabie est devenue le lien indispensable du commerce mondial, où convergent toutes les routes commerciales et où chaque commerçant doit rendre hommage aux gardiens du détroit."
 nd_aia_caliphal_diwan: "Diwan calife"
 nd_aia_caliphal_diwan_desc: "Le bureau administratif central du califat restauré, où les scribes enregistrent les décrets, les registres fiscaux sont tenus et où les affaires de gouvernance d'un vaste empire sont menées avec une précision méthodique."
 nd_aia_trade_exchange: "Bourse commerciale arabe"
 nd_aia_trade_exchange_desc: "Un grand marché où des marchands de trois continents font des affaires, avec des halles de commerce permanentes, des entrepôts sécurisés et des facteurs résidents représentant les intérêts commerciaux de l'Inde à l'Europe."
 nd_aia_diwan_administration: "Administration de Diwan"
 nd_aia_diwan_administration_desc: "Le fonctionnement de la bureaucratie califale nécessite des rames de papier pour les archives, du tissu fin pour les robes des fonctionnaires et de la cire d'abeille pour les sceaux qui authentifient les décrets impériaux."
 nd_aia_exchange_operations: "Opérations d'échange"
 nd_aia_exchange_operations_desc: "La gestion d'un échange commercial majeur nécessite du papier pour les contrats et les registres, du tissu pour emballer les marchandises et des outils pour peser, mesurer et sécuriser les marchandises."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_aia_bureaucracy_authority: "Administration panarabe"
 AUTO_MODIFIER_DESC_nd_aia_bureaucracy_authority: "The institutions of the peninsula (the Sharifate of the Two Sanctuaries, the imamates of Sa'da and Nizwa, the dirah of the desert tribes, the customs houses of the coast, and the religio-political compacts of the Najdi heartland) can now be permanently established as the institutional backbone of a unified Arabia. Two bureaucracy slots are open for them, beside the one that sharia law keeps."

 aia_sharifate_haramain_bureaucracy: "Garde des deux saintes mosquées"
 aia_sharifate_haramain_bureaucracy_desc: "Fondé en 1201 lorsque le chérif Qatadah ibn Idris s'empara de La Mecque aux mains des Banu Thaqif, le chérifiat hachémite dirigea le Hedjaz sous des suzerainetés successives - mamelouke, puis ottomane après 1517 - jusqu'en 1925. Le chérif tirait sa légitimité religieuse de la descendance du Prophète par l'intermédiaire d'al-Hasan ibn Ali, et exerçait la sidana pratique de la Kaaba et du Prophète. Mosquée. Les sultans ottomans se sont appelés Khadim al-Haramayn al-Sharifayn après la conquête de l'Égypte par Selim Ier ; le surrah d'or expédié chaque année de Damas et du Caire était distribué par le bureau du chérif parmi les oulémas résidents, les grandes dotations waqf et les pauvres des Deux Sanctuaires."

 aia_zaydi_imamate_bureaucracy: "Zaydi Imamat de Saada"
 aia_zaydi_imamate_bureaucracy_desc: "En septembre 1597, al-Mansur al-Qasim, un Zaydi Sayyid de la lignée rassid, proclama l'imamat à Sa'da contre l'imposition ottomane du fiqh Hanafi sur les hauts plateaux yéménites. En 1608, les imams Qasimid avaient récupéré les districts des hautes terres et signé une trêve de dix ans avec la Porte ; en 1636, ils avaient expulsé les garnisons ottomanes de Moka et de Tihama. L'imamat gouvernait par l'intermédiaire des sada - des juges érudits sayyid se réclamant d'une descendance hachémite - qui dispensaient la jurisprudence zaydi-hadawi à partir des centres de district de Sa'da, Sanaa et Shihara, convoquant des prélèvements tribaux par appel religieux plutôt que par mandat féodal."

 aia_ibadi_imamate_bureaucracy: "Ibadhi Imamat de Nizwa"
 aia_ibadi_imamate_bureaucracy_desc: "L'imamat Ibadhi d'Oman, proclamé pour la première fois en 750 de notre ère et relancé en 793 et ​​à plusieurs reprises par la suite, était une théocratie élective. L'Imam était choisi par l'assemblée des oulémas - les ahl al-hall wa-l-aqd - et pouvait être destitué par le même organe s'il était jugé insuffisant. La capitale alternait entre Nizwa et Rustaq ; Les walis provinciaux étaient nommés par l'Imam parmi les familles savantes. L'imamat estimait que le pouvoir politique et militaire absolu ne devait jamais appartenir à un seul homme, produisant un gouvernement nettement décentralisé qui a perduré jusqu'au XXe siècle aux côtés du sultanat côtier de Mascate."

 aia_dirah_pasture_bureaucracy: "Dirah et Hima"
 aia_dirah_pasture_bureaucracy_desc: "La dirah était le territoire tribal coutumier des confédérations Najdi et Bédouine (non pas une frontière fixe mais une revendication élastique sur les pâturages, les points d'eau et les pâturages saisonniers, renforcée par des raids (ghazu) et un arbitrage cheikhly. Les réserves hima réservent des terres pour des animaux nommés à des saisons déterminées ; les puits étaient marqués, les dettes de sang jugées au majlis et l'accès négocié entre cheikhs lors de foires neutres. Aucun État central ne pourrait fonctionner dans le Najd sans lier les grandes confédérations) Anaiza, Shammar, Mutair, Qahtan : par des subventions ou par les armes; les régimes sédentaires qui ignoraient le dirah ont perdu leurs revenus provenant des marges du désert en une génération."

 aia_mocha_customs_bureaucracy: "Administration des douanes de Moka"
 aia_mocha_customs_bureaucracy_desc: "Après la conquête ottomane du Yémen en 1538, chaque navire de la mer Rouge fut tenu par décret de faire escale à Moka et d'y payer les douanes. Au XVIIe siècle, environ 10 000 tonnes de haricots transitaient chaque année dans ses entrepôts, séchés ou torréfiés avant d'être exportés pour empêcher la germination en dehors du Yémen. Après 1636, les imams Qasimid héritèrent de la fonction de nakhuda al-bunduq et maintinrent le régime ottoman : un divan composé de trois fonctionnaires (le wali, le muhtasib et le nakhuda al-bahr) fixant des droits de douane de cinq à dix pour cent sur les importations et un tarif fixe par bahar de café. Les usines européennes de Mocha (anglaises, néerlandaises, françaises) payaient le même tarif jusqu'au XVIIIe siècle."

 aia_diriyah_pact_bureaucracy: "Pacte de Diriyah"
 aia_diriyah_pact_bureaucracy_desc: "En 1744 (1157 AH), dans la ville oasis d'Ad-Diriyah dans le Najd, Muhammad ibn Abd al-Wahhab et l'émir local Muhammad ibn Saud jurèrent mutuellement bay'a : l'érudit religieux dirigerait la doctrine et la dawah, l'émir fournirait les armes et la direction politique. Le pacte a créé le premier État saoudien (1744-1818) et un appareil politico-religieux fusionné dans lequel les mutawwiun chevauchaient avec les commandants saoudiens, les cadis nommés par la maison d'al-Sheikh appliquaient une jurisprudence hanbalite stricte et les revenus étaient extraits sous forme de zakat des tribus conquises. Les confréries Ikhwan issues de ce pacte ont propagé la doctrine wahhabite à travers la péninsule au début du XIXe siècle."
