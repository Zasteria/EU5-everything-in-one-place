 YAV: "Yavana"
 YAV_ADJ: "Yavana"
 YAV_f: "Empire Yavana"
 YAV_f_desc: "L'empire Yavana représente une renaissance des anciens royaumes indo-grecs qui prospéraient autrefois sur les terres du Sind et du Gandhara. « Yavana », le terme utilisé dans les sources indiennes pour désigner les Grecs et leurs descendants, évoque l'extraordinaire synthèse gréco-bouddhiste qui a produit certains des plus grands arts et philosophies du sous-continent. Sous un dirigeant bouddhiste Sammitiya d'origine sindhi, cette restauration fusionne les traditions politiques hellénistiques avec la culture dharmique de la vallée de l'Indus, récupérant l'héritage de Ménandre et Démétrius."
