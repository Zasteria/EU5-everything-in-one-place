l_french:
 STATIC_MODIFIER_NAME_nd_catholic_shield: "Le bouclier catholique"
 STATIC_MODIFIER_DESC_nd_catholic_shield: "La Bavière est le principal défenseur de la foi catholique dans l'Empire, ses armées tempérées par la conviction religieuse et son peuple uni dans une orthodoxie zélée."
 STATIC_MODIFIER_NAME_nd_wittelsbach_inheritance: "L'héritage Wittelsbach"
 STATIC_MODIFIER_DESC_nd_wittelsbach_inheritance: "La dynastie des Wittelsbach maîtrise l'art de la politique dynastique, tissant un réseau de mariages, d'alliances et de mécénat culturel qui étend l'influence de la Bavière bien au-delà de ses frontières."
 STATIC_MODIFIER_NAME_nd_bavarian_catholic_league_arms: "Armes de la Ligue catholique"
 STATIC_MODIFIER_DESC_nd_bavarian_catholic_league_arms: "L'appareil militaire de la Ligue catholique fournit à la Bavière une infanterie disciplinée et des effectifs suffisants pour défendre la foi."
 STATIC_MODIFIER_NAME_nd_bavarian_jesuit_diplomacy: "Diplomatie jésuite"
 STATIC_MODIFIER_DESC_nd_bavarian_jesuit_diplomacy: "La Compagnie de Jésus sert d'instrument diplomatique à la Bavière, ses collèges formant des administrateurs fidèles et ses missions étendant l'influence bavaroise à travers l'Europe catholique."
 STATIC_MODIFIER_NAME_nd_bavarian_primogeniture_law: "Loi sur la primogéniture"
 STATIC_MODIFIER_DESC_nd_bavarian_primogeniture_law: "La loi de l'indivisibilité garantit que les terres bavaroises passent intactes à un seul héritier, mettant ainsi fin à des siècles de partage ruineux."
 STATIC_MODIFIER_NAME_nd_bavarian_landtag_compact: "Landtag Compact"
 STATIC_MODIFIER_DESC_nd_bavarian_landtag_compact: "Les domaines de Bavière ont conclu un pacte avec le duc, échangeant l'obéissance contre la représentation et créant un système de gouvernance stable."
 nd_bav.1.t: "L'unification de la Bavière"
 nd_bav.1.d: "The fractured lands of the Bavarian duchies are at last united under one banner. Munich, enriched by the salt trade and blessed by the Church, stands ready to lead a realm that stretches from the Alpine passes to the Danube plains. The question now is what kind of Bavaria we shall build. Shall we forge ourselves into the sword of the Catholic faith, marshalling our armies as the shield of orthodoxy against heresy? Or shall we follow the path of our Wittelsbach ancestors, masters of dynastic intrigue, patrons of art and learning, weaving alliances through marriage and culture rather than conquest?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bav.1.a: "Nous sommes le Bouclier de la Foi !"
 nd_bav.1.b: "Les Wittelsbach perdureront grâce à leur politique."
 nd_bav.2.t: "La réunification de la Bavière"
 nd_bav.2.d: "La guerre de succession de Landshut est terminée. Après des années de conflit entre les lignes rivales des Wittelsbach de Bavière-Munich et de Bavière-Landshut, les terres de la dynastie sont réunies pour la première fois depuis des générations. Le duc Albrecht IV a triomphé, mais le prix à payer a été élevé : l'arbitrage impérial a confisqué certains territoires et les domaines exigent des concessions. Le duc propose désormais une mesure révolutionnaire : une loi de primogéniture qui rendrait le duché à jamais indivisible. Les états, réunis en assemblée, pèsent leur réponse. Le duché adoptera-t-il une primogéniture stricte, concentrant tout le pouvoir sur une seule ligne ? Ou les successions doivent-elles exiger un pacte, échangeant leur consentement contre des droits de représentation garantis ?"
 nd_bav.2.a: "Un duc, une Bavière : indivisible et éternelle."
 nd_bav.2.b: "Le Landtag aura sa voix."
 nd_bav.3.t: "La Ligue catholique"
 nd_bav.3.d: "Alors que les princes protestants forment leur Union et que l'hérésie se propage à travers l'Empire, le duc Maximilien Ier de Bavière a répondu en fondant la Ligue catholique. Cette alliance de princes impériaux catholiques, financés par la richesse bavaroise et dirigés par la détermination bavaroise, constitue la force militaire la plus puissante de l’Allemagne catholique. Sous le brillant commandement du comte Tilly, l'armée de la Ligue, composée de 25 000 hommes (bien entraînés, bien approvisionnés et brûlants d'un zèle confessionnel) a déjà fait ses preuves sur le champ de bataille. La question est de savoir comment la Bavière utilisera ce formidable instrument : comme un marteau de force militaire pour écraser la résistance protestante, ou comme un outil diplomatique soutenu par la persuasion des Jésuites pour récupérer les âmes par l’éducation et la conversion ?"
 nd_bav.3.a: "Laissez les armées de Tilly parler pour la foi."
 nd_bav.3.b: "Les Jésuites seront notre meilleure arme."
 nd_bav.4.t: "Munich baroque"
 nd_bav.4.d: "Une transformation est en train de balayer Munich. L'église des Théatins s'élève au-dessus de l'horizon, sa façade baroque italienne témoigne des ambitions de la dynastie. À Nymphenburg, un palais d'été d'une grandeur étonnante prend forme au milieu de jardins à la française qui rivalisent avec Versailles. La cour de Wittelsbach est devenue un phare du mécénat artistique, les architectes italiens, les peintres flamands et les musiciens allemands affluent dans la capitale bavaroise. La Residenz devient de plus en plus magnifique avec chaque génération de constructeurs. Ce qui était autrefois un modeste siège ducal parmi tant d'autres de l'Empire est devenue l'une des principales capitales culturelles d'Europe, ses bâtiments proclamant la puissance bavaroise et la splendeur catholique à tous ceux qui les contemplent."
 nd_bav.4.a: "Munich rivalisera avec les grandes cours d'Europe."
 nd_bav_salt_road_tradition: "Tradition de la route du sel"
 nd_bav_salt_road_tradition_desc: "Les anciennes routes du sel de Reichenhall et Berchtesgaden en passant par Munich jusqu'à Augsbourg ont fait la richesse de la Bavière. Le contrôle de ces routes est le fondement du commerce bavarois."
 nd_bav_alpine_passes: "Fortification du col alpin"
 nd_bav_alpine_passes_desc: "La frontière sud de la Bavière suit les cols alpins, points d'étranglement naturels fortifiés depuis des temps immémoriaux pour contrôler le commerce et repousser les envahisseurs."
 nd_bav_hofbrau_tradition: "Hofbräu Tradition"
 nd_bav_hofbrau_tradition_desc: "La tradition des brasseries de cour, qui a culminé avec la fondation de la Hofbrauhaus, reflète à la fois l'ingéniosité économique bavaroise et l'importance sociale des lieux de rassemblement communaux."
 nd_bav_wittelsbach_court: "Culture de la cour de Wittelsbach"
 nd_bav_wittelsbach_court_desc: "La dynastie Wittelsbach cultive une cour au goût raffiné et à l’ambition cosmopolite, attirant des artistes et des érudits de toute l’Europe."
 nd_bav_landshut_reunification: "Réunification de Landshut"
 nd_bav_landshut_reunification_desc: "La guerre de succession de Landshut a mis fin aux siècles de partition bavaroise. En vertu de la loi de primogéniture de 1506 d'Albrecht IV, le duché devint à jamais indivisible."
 nd_bav_munich_staple_rights: "Droits de base de Munich"
 nd_bav_munich_staple_rights_desc: "Le droit de base de Munich exige que tout le sel transitant par la ville soit mis en vente avant de poursuivre son voyage, enrichissant ainsi la capitale et consolidant son rôle de cœur commercial de la Bavière."
 nd_bav_rentmeister_system: "Système Rentmeister"
 nd_bav_rentmeister_system_desc: "La division de la Bavière en districts administratifs dirigés par Rentmeisters a créé un système efficace de perception des impôts et de gouvernance régionale."
 nd_bav_catholic_league: "Ligue catholique"
 nd_bav_catholic_league_desc: "Fondée par Maximilien Ier en 1609, la Ligue catholique réunissait les princes impériaux catholiques sous la direction bavaroise, alignant l'une des armées les plus redoutables de la guerre de Trente Ans."
 nd_bav_jesuit_colleges: "Collèges jésuites"
 nd_bav_jesuit_colleges_desc: "La Compagnie de Jésus a créé des collèges dans toute la Bavière qui ont servi d'instruments à la fois d'éducation et de contre-réforme, formant des administrateurs fidèles et reconvertissant les populations protestantes."
 nd_bav_maximilian_reforms: "Les réformes fiscales de Maximilien"
 nd_bav_maximilian_reforms_desc: "Le duc Maximilien Ier réorganisa les finances bavaroises avec une rigueur sans précédent, créant un trésor de guerre qui finança la Ligue catholique et fit de la Bavière la principauté catholique la plus forte."
 nd_bav_standing_army: "Armée permanente bavaroise"
 nd_bav_standing_army_desc: "Créée par l'électeur Maximilien II Emanuel en 1682, l'armée bavaroise permanente a remplacé les levées temporaires par des soldats professionnels, y compris la cavalerie distinctive des Chevaulegers."
 nd_bav_baroque_patronage: "Patronage baroque"
 nd_bav_baroque_patronage_desc: "Les électeurs de Wittelsbach ont transformé Munich en un chef-d'œuvre baroque en faisant construire l'église des Théatins, le château de Nymphenburg et l'agrandissement de la résidence."
 nd_bav_salt_monopoly: "Monopole du sel"
 nd_bav_salt_monopoly_desc: "Le monopole ducal sur la production de sel bavarois concentrait d'énormes richesses entre les mains de l'État, finançant aussi bien des aventures militaires que du mécénat culturel."
 nd_bav_montgelas_reforms: "Réformes Montgelas"
 nd_bav_montgelas_reforms_desc: "Le comte Montgelas modernisa la Bavière à partir de 1799, abolissant les privilèges féodaux, sécularisant les terres de l'Église, introduisant l'égalité civile et créant un État bureaucratique moderne."
 nd_bav_kingdom_sovereignty: "Souveraineté du Royaume"
 nd_bav_kingdom_sovereignty_desc: "Élevée au rang de royaume par Napoléon en 1806, la Bavière atteint pour la première fois la pleine souveraineté, réorganisant son armée selon des lignes modernes et s'établissant comme une puissance européenne à part entière."
 nd_bav_reinheitsgebot_industry: "Industrie du reinheitsgebot"
 nd_bav_reinheitsgebot_industry_desc: "L'industrialisation du brassage bavarois combine des siècles d'expertise en matière de loi de pureté avec des techniques modernes, des fours à malt au charbon, des processus mécaniques et une distribution ferroviaire pour produire de la bière à une échelle sans précédent."
 a_nd_bav_ritter: "Ritter bavarois"
 a_nd_bav_ritter_desc: "Cavalerie lourde blindée issue de la petite noblesse bavaroise, les Ritter chargent avec une force dévastatrice dans la tradition féodale des chevaliers impériaux."
 a_nd_bav_kreisinfanterie: "Kreisinfanterie"
 a_nd_bav_kreisinfanterie_desc: "Infanterie disciplinée du Cercle Impérial, entraînée dans la tradition espagnole du tercio et endurcie par les guerres de religion. Ils combattent avec la conviction des hommes qui défendent leur foi."
 a_nd_bav_chevaulegers: "Chevaulegers bavarois"
 a_nd_bav_chevaulegers_desc: "Light cavalry of the Bavarian standing army, in the French-influenced tradition of the Bavarian military. Trained for reconnaissance and pursuit, and in the wars of Napoleon the whole of the Bavarian line cavalry, so it is drilled to charge home as well."
 nd_bav_salzkontor: "Marché de Salzbourg"
 nd_bav_salzkontor_desc: "Une maison de commerce du sel qui gère l'achat, le stockage et la distribution du produit le plus précieux de Bavière le long des anciennes routes du sel."
 nd_bav_jesuitenkolleg: "Collège des Jésuites"
 nd_bav_jesuitenkolleg_desc: "Un collège de la Compagnie de Jésus, combinant une éducation classique rigoureuse avec la théologie de la Contre-Réforme pour former des administrateurs et des universitaires catholiques fidèles."
 nd_bav_hofbrauhaus: "Hofbräuhaus"
 nd_bav_hofbrauhaus_desc: "La brasserie de la cour sert à la fois d'entreprise économique et d'institution sociale, produisant de la bière bavaroise raffinée tout en offrant un lieu de rassemblement favorisant la loyauté civique."
 nd_bav_barockschloss: "Château baroque"
 nd_bav_barockschloss_desc: "Un magnifique palais baroque dans la tradition de Wittelsbach, proclamant les ambitions culturelles de la dynastie à travers une architecture italienne, des jardins à la française et une décoration intérieure somptueuse."
 nd_bav_salt_processing: "Traitement du sel"
 nd_bav_salt_processing_desc: "Le raffinage et la distribution du sel alpin nécessitent des entrepôts en pierre, du bois comme combustible et des tissus pour le sac et le stockage."
 nd_bav_jesuit_curriculum: "Programme d'études jésuite"
 nd_bav_jesuit_curriculum_desc: "Le Ratio Studiorum exige un approvisionnement constant en manuels imprimés et en traités théologiques, ainsi qu'en bougies en cire d'abeille pour éclairer les études du soir."
 nd_bav_court_brewing: "Brassage de la Cour"
 nd_bav_court_brewing_desc: "La brasserie ducale malt du blé et tonne des fûts de bois pour produire de la bière bavaroise raffinée."
 nd_bav_baroque_upkeep: "Entretien baroque"
 nd_bav_baroque_upkeep_desc: "L'entretien d'un palais baroque nécessite de la pierre pour les réparations, des tissus fins pour les tapisseries et des meubles raffinés pour les appartements d'État."
 nd_bav_salzwerk: "Salzwerk"
 nd_bav_salzwerk_desc: "Une raffinerie de sel traitant le sel gemme des Alpes par évaporation et purification, fournissant ainsi le produit commercial le plus lucratif de Bavière."
 nd_bav_brauerei: "Brasserie"
 nd_bav_brauerei_desc: "Une brasserie à l'échelle industrielle produisant de la bière selon la loi de pureté Reinheitsgebot, consommant de grandes quantités de blé et de charbon."
 nd_bav_salt_refining: "Raffinage du sel"
 nd_bav_salt_refining_desc: "Le sel gemme des Alpes est traité par évaporation et purification dans des fours en pierre alimentés au bois, produisant du sel raffiné destiné au commerce."
 nd_bav_industrial_brewing: "Brasserie industrielle"
 nd_bav_industrial_brewing_desc: "Le brassage à l'échelle industrielle du Reinheitsgebot utilise des fours à malt alimentés au charbon et de grandes quantités de blé pour produire de la bière à un volume sans précédent."
 levy_nd_bav_ritter: "Prélèvement Ritter bavarois"
 levy_nd_bav_ritter_desc: "Cavalerie noble issue de la petite aristocratie bavaroise pour servir de troupes de choc lourdes."
 nd_bav_formed_tt: "La Bavière est créée"
 nd_bav_path_a_tt: "Choisissez le bouclier catholique"
 nd_bav_path_b_tt: "Choisissez l'héritage Wittelsbach"
 nd_bav_destiny: "Destin bavarois"
 nd_bav_destiny_desc: "La Bavière unie se trouve à la croisée des chemins. Le destin du royaume de Wittelsbach, qu’il soit forgé dans le feu du zèle catholique ou façonné par la ruse dynastique, est désormais entre nos mains."
 nd_bav_dest_salzburg_crusade: "La croisade de Salzbourg"
 nd_bav_dest_salzburg_crusade_desc: "Sécuriser le grand évêché catholique de Salzbourg et la ville impériale d'Augsbourg pour ancrer la position de la Bavière en tant que principal défenseur de la foi dans le sud de l'Allemagne."
 nd_bav_dest_palatinate_claim: "La revendication du Palatinat"
 nd_bav_dest_palatinate_claim_desc: "S'emparer de Heidelberg et de l'électorat du Palatinat, comme Maximilien Ier l'a fait après la bataille de la Montagne Blanche, faisant de la Bavière la première puissance militaire parmi les princes catholiques."
 nd_bav_dest_catholic_supremacy: "Suprématie catholique"
 nd_bav_dest_catholic_supremacy_desc: "Placer Prague et Vienne sous domination bavaroise, éclipsant ainsi les Habsbourg eux-mêmes en tant que puissance catholique suprême en Europe centrale."
 nd_bav_dest_golden_treasury: "Le trésor d'or"
 nd_bav_dest_golden_treasury_desc: "Établissez les fondations financières de la Bavière en adoptant le système bancaire moderne et en accumulant une formidable trésorerie digne de l'ambition de Wittelsbach."
 nd_bav_dest_cultural_metropolis: "Métropole culturelle"
 nd_bav_dest_cultural_metropolis_desc: "Transform the capital into a cultural center: a city in rank and not only in name, the printing press embraced, and an international reputation cultivated."
 nd_bav_dest_wittelsbach_zenith: "Zénith de Wittelsbach"
 nd_bav_dest_wittelsbach_zenith_desc: "Achieve the pinnacle of Wittelsbach power: a vast treasury, unmatched prestige, mastery of global trade networks, and Munich rebuilt as Ludwig I rebuilt it, with new quarters, the Ludwigstrasse and the Konigsplatz. Requires Munich held and raised to 54 development."
 nd_bav_dest_munich_developed_tt: "We own #bold Munich#! and its development is at least #bold 54#!"
 nd_bav.5.t: "Le destin bavarois"
 nd_bav.5.d: "La Bavière est formée et la voie que nous avons choisie nous attend. Les traditions de nos ancêtres nous guident, mais c'est nous qui devons forger l'avenir. Que ce soit par l’épée ou par l’art politique, le nom de Wittelsbach résonnera à travers les âges."
 nd_bav.5.a: "Notre destin nous attend."
 nd_bav.6.t: "Le sel et l'épée"
 nd_bav.6.d: "Salzbourg, l'ancien prince-évêché dont les mines de sel rivalisaient autrefois avec les nôtres, arbore désormais la bannière bavaroise. Et Augsbourg (cette grande ville impériale où la fatidique Confession a été lue, où catholiques et protestants ont tracé pour la première fois leurs lignes de bataille théologiques) a été amenée dans notre giron. Avec la richesse des mines de Salzbourg et la puissance commerciale des banquiers d'Augsbourg assurées, la position de la Bavière en tant que champion catholique du sud est incontestable. Les routes du sel et les routes des épées ne font plus qu'une."
 nd_bav.6.a: "La foi a son bouclier."
 nd_bav.7.t: "L'électorat du Palatinat"
 nd_bav.7.d: "Heidelberg est tombé. Le siège du Palatinat, autrefois bastion de l’hérésie calviniste et étincelle qui a déclenché les grandes guerres de religion, est désormais le nôtre. De même que Maximilien Ier a arraché à Frédéric V la dignité électorale après la bataille de White Mountain, nous avons également réclamé ce qui était dû à la valeur catholique. La question est de savoir comment consolider ce triomphe. Devons-nous imiter le marteau de Tilly, en transformant nos armées en un instrument de conquête imparable ? Ou devrions-nous lever haut l'étendard de la Ligue, inspirant les princes catholiques de tout l'Empire à se rallier à notre cause ?"
 nd_bav.7.a: "Forgez à nouveau le marteau de Tilly."
 nd_bav.7.b: "Rassemblez les princes à notre bannière."
 nd_bav.8.t: "Empire catholique"
 nd_bav.8.d: "Prague et Vienne s'inclinent toutes deux devant le lion bavarois. La défenestration de Prague a plongé l'Europe dans des décennies de guerre, aujourd'hui les flèches de cette ville brillent sous l'autorité de Wittelsbach. Et Vienne, siège des Habsbourg pendant des siècles, a cédé la place à une plus grande puissance catholique. La Bavière a réalisé ce que même le plus ambitieux de ses ducs n’avait jamais osé rêver : la suprématie sur tout le cœur catholique de l’Europe centrale. Devons-nous construire un imperium de forteresses et de lignes de ravitaillement pour détenir ces vastes conquêtes, ou poursuivre une stratégie de guerres rapides et de victoires décisives pour maintenir nos ennemis perpétuellement en déséquilibre ?"
 nd_bav.8.a: "Construisez la forteresse de la chrétienté."
 nd_bav.8.b: "Frappez rapidement, comme à White Mountain."
 nd_bav.9.t: "Le Trésor de Wittelsbach"
 nd_bav.9.d: "Les caveaux de Munich débordent. Grâce à l'adoption judicieuse de pratiques bancaires modernes et à une gestion prudente des ressources de notre royaume, la Bavière a accumulé une richesse qui attirerait l'attention des Fugger eux-mêmes. Les revenus du sel, les bénéfices des brasseries, la gestion prudente des domaines ducaux : tous ont contribué à un trésor qui offre aux Wittelsbach des options que la puissance militaire à elle seule ne pourrait jamais offrir. L'or ouvre des portes que les épées ne peuvent pas ouvrir."
 nd_bav.9.a: "La richesse est le fondement de tout pouvoir."
 nd_bav.10.t: "Ascendant munichois"
 nd_bav.10.d: "Munich has outgrown its old walls and is counted among the cities of the Empire. The printing presses of Bavaria churn out texts that scholars across Europe seek out. The Wittelsbach court has become a magnet for artists, philosophers, and men of learning. Munich is no longer merely the capital of a German duchy. It is becoming a European cultural center in its own right. Shall we focus on building Munich into a true academy city, drawing the finest minds to our court? Or shall we extend the Wittelsbach diplomatic network, weaving alliances and dynastic ties across the continent?"
 nd_bav.10.a: "Munich sera une académie pour toute l'Europe."
 nd_bav.10.b: "Étendre le réseau d’alliances de Wittelsbach."
 nd_bav.11.t: "Le Zénith de Wittelsbach"
 nd_bav.11.d: "The Wittelsbach dynasty has reached its apex. A treasury overflowing with gold, a realm of unmatched prestige, a capital twice the town it was, mastery of global trade networks: Bavaria has transcended its origins as a frontier duchy to become one of Europe's great powers through culture, diplomacy, and economic might rather than conquest alone. King Ludwig's vision of Munich as the 'Athens on the Isar' is no longer a dream but a reality. The Glyptothek and Pinakothek stand as monuments to a civilization that chose to build rather than destroy. Shall we crown this achievement with a golden age of arts and urban splendor, or pursue a grand dynastic vision that reshapes the political map of Europe?"
 nd_bav.11.a: "Que Munich devienne l’Athènes de l’Isar."
 nd_bav.11.b: "La vision de Wittelsbach doit remodeler l’Europe."
 STATIC_MODIFIER_NAME_nd_bav_dest_tilly_hammer: "Le marteau de Tilly"
 STATIC_MODIFIER_DESC_nd_bav_dest_tilly_hammer: "L'armée a été forgée pour devenir un instrument d'une efficacité dévastatrice, entraînée selon les méthodes du grand comte Tilly, un recrutement rapide et un moral implacable, même si le coût d'une telle machine de guerre met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_bav_dest_league_banner: "Bannière de la Ligue"
 STATIC_MODIFIER_DESC_nd_bav_dest_league_banner: "Sous la bannière de la Ligue catholique, les armées bavaroises se renforcent rapidement et combattent avec la fureur d'hommes qui croient que Dieu est de leur côté."
 STATIC_MODIFIER_NAME_nd_bav_dest_catholic_imperium: "Empire catholique"
 STATIC_MODIFIER_DESC_nd_bav_dest_catholic_imperium: "Un vaste réseau de forteresses protège l'empire catholique de Bavière, avec des lignes d'approvisionnement s'étendant à travers l'Europe centrale ; bien que la finesse diplomatique ait été sacrifiée au profit de la domination militaire."
 STATIC_MODIFIER_NAME_nd_bav_dest_white_mountain: "Doctrine de la Montagne Blanche"
 STATIC_MODIFIER_DESC_nd_bav_dest_white_mountain: "La doctrine de la guerre rapide et décisive, telle qu'elle a été pratiquée lors de la bataille de White Mountain, permet à la Bavière de faire valoir ses revendications rapidement et de négocier en force, même si la construction nationale souffre de l'orientation militaire."
 STATIC_MODIFIER_NAME_nd_bav_dest_munich_academy: "Académie de Munich"
 STATIC_MODIFIER_DESC_nd_bav_dest_munich_academy: "Les académies et salons de Munich attirent des universitaires et des artistes de toute l'Europe, répandant l'influence culturelle bavaroise et assimilant de nouvelles populations dans le giron de Wittelsbach."
 STATIC_MODIFIER_NAME_nd_bav_dest_wittelsbach_network: "Réseau Wittelsbach"
 STATIC_MODIFIER_DESC_nd_bav_dest_wittelsbach_network: "Le réseau diplomatique de Wittelsbach s'étend sur tout le continent, liant les alliés et les sujets à la Bavière par le mariage, les traités et les obligations mutuelles ; bien que le maintien d'une telle toile laisse moins d'argent aux épées louées."
 STATIC_MODIFIER_NAME_nd_bav_dest_athens_on_isar: "Athènes sur l'Isar"
 STATIC_MODIFIER_DESC_nd_bav_dest_athens_on_isar: "Munich est devenue l'Athènes de l'Isar, une ville à l'architecture magnifique, à l'administration efficace et à la splendeur culturelle, même si la cour savante a peu de patience pour la logistique militaire."
 STATIC_MODIFIER_NAME_nd_bav_dest_ludwig_vision: "La vision de Ludwig"
 STATIC_MODIFIER_DESC_nd_bav_dest_ludwig_vision: "La grande vision du roi Louis d'une Bavière prospère, stable et autosuffisante s'est réalisée, un royaume où le séparatisme est inconnu et où la population est bien nourrie, même si la réputation pacifiste de la nation fait de la guerre une entreprise coûteuse."
 nd_bav_mariensaule: "Mariensaule"
 nd_bav_mariensaule_desc: "Une imposante colonne mariale érigée au cœur de la ville, proclamant la dévotion de la Bavière à la Vierge Marie et son triomphe sur l'hérésie, la peste et les invasions étrangères."
 nd_bav_marian_devotion: "Dévotion mariale"
 nd_bav_marian_devotion_desc: "Les célébrations et processions régulières autour de la Mariensaule nécessitent de la cire d'abeille pour les bougies, de la pierre pour l'entretien et du tissu pour les vêtements et les bannières."
 nd_bav_glyptothek: "Glyptothèque"
 nd_bav_glyptothek_desc: "Un musée néoclassique abritant une magnifique collection de sculptures grecques et romaines, incarnant la vision du roi Louis Ier de Munich en tant que capitale culturelle de l'Europe."
 nd_bav_sculpture_collection: "Collection de sculptures"
 nd_bav_sculpture_collection_desc: "L'entretien de la collection de sculptures classiques de la Glyptothèque nécessite de la pierre pour les réparations, du papier pour les catalogues et du verre pour les vitrines."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_bav_bureaucracy_authority: "Autorité administrative de Wittelsbach"
 AUTO_MODIFIER_DESC_nd_bav_bureaucracy_authority: "Munich's chancery is mature enough to operate institutional ministries: the Wittelsbach state may sustain three bureaucracies of its choosing."

 bav_geheimer_rat_bureaucracy: "Rat Geheimer"
 bav_geheimer_rat_bureaucracy_desc: "Créé par Albert IV en 1488 et réorganisé par Albert V en 1570, le Geheimer Rat devient le conseil exécutif central du duché de Bavière. Un petit corps de juristes qualifiés préparait des décrets pour le duc, supervisait la chancellerie et, à partir de 1620, dirigeait le gouvernement de guerre de Maximilien Ier, supplantant l'ancien Hofrat comme siège du pouvoir exécutif à Munich."

 bav_hofkammer_bureaucracy: "Chambre Hof"
 bav_hofkammer_bureaucracy_desc: "La Chambre aulique de Munich, réorganisée par Guillaume IV dans les années 1530 et de nouveau par Maximilien Ier après 1598, dirigeait les insignes de Wittelsbach : le monopole du sel de Reichenhall et Traunstein, les douanes de Wasserburg et Burghausen, le Munzamt ducal et les revenus des domaines de la couronne. Ses comptes disciplinés faisaient des revenus du sel bavarois l'un des revenus régaliens les plus riches de l'Empire et finançaient la Ligue catholique."

 bav_landstaende_bureaucracy: "Landstaende bavaroise"
 bav_landstaende_bureaucracy_desc: "La Diète des États bavarois composée de prélats, de nobles et de députés municipaux qui se réunissait irrégulièrement à Munich et à Landshut à partir du XIVe siècle. Le Landtag de 1577 a produit la Landesfreiheitserklarung, la charte territoriale formalisant les droits successoraux pour consentir à une imposition extraordinaire. La Diète co-gouverna le duché avec ses ducs jusqu'à ce que les urgences de guerre de Maximilien Ier le mettent à l'écart après 1620, et il fut finalement dissous par les réformes de Montgelas en 1808."

 bav_geistlicher_rat_bureaucracy: "Rat Geistlicher"
 bav_geistlicher_rat_bureaucracy_desc: "Le Conseil Ecclésiastique créé par Albert V en 1570 pour orienter le dur virage du duché vers la Contre-Réforme. Composé de conseillers jésuites formés, il supervisait les nominations épiscopales, agréait les imprimeurs, dirigeait les séminaires bavarois et supervisait le réseau des collèges jésuites d'Ingolstadt, Munich, Dillingen et Landshut. Sous Maximilien Ier, la Bavière devient l'arsenal intellectuel de la Ligue catholique."

 bav_hofmark_bureaucracy: "Hofmarken"
 bav_hofmark_bureaucracy_desc: "The Bavarian system of patrimonial seigneurial jurisdiction codified in the Landrecht of 1518 and successive Landgerichtsordnungen, by which abbeys, knights, and noble landholders exercised lower courts, police powers, and tax collection over their tenants. The rentmeister coordinated, but the Hofmarksherren ran daily justice, and the system survived every reform until its abolition by the Bavarian constitution of 1818."
