l_french:
 STATIC_MODIFIER_NAME_nd_hau_walls_of_amina: "Les murs d'Amina"
 STATIC_MODIFIER_DESC_nd_hau_walls_of_amina: "Dans la tradition de la reine Amina de Zazzau, nous étendrons notre domaine par la force des armes, en construisant des murs autour de chaque ville que nous conquérons et en sécurisant les routes commerciales avec de la cavalerie et du fer."
 STATIC_MODIFIER_NAME_nd_hau_crossroads_of_the_sahel: "Carrefour du Sahel"
 STATIC_MODIFIER_DESC_nd_hau_crossroads_of_the_sahel: "La richesse des nations transite par nos marchés. Des champs aurifères du sud aux mines de sel du Sahara, chaque caravane qui traverse le Sahel enrichit nos caisses et répand notre renommée."
 STATIC_MODIFIER_NAME_nd_hau_chronicle_of_kings: "Chronique des Rois"
 STATIC_MODIFIER_DESC_nd_hau_chronicle_of_kings: "Les traces écrites de notre histoire confèrent de l'autorité à notre dynastie et inspirent la fierté de notre peuple. Nos actes sont écrits pour la postérité."
 STATIC_MODIFIER_NAME_nd_hau_rumfa_reforms: "Les Lumières de Rumfa"
 STATIC_MODIFIER_DESC_nd_hau_rumfa_reforms: "Suivant le modèle de Muhammad Rumfa, notre engagement en faveur de l’apprentissage islamique et de la bonne gouvernance a élevé notre civilisation et attiré des érudits du monde musulman."
 nd_hau.1.t: "L’unification du pays haoussa"
 nd_hau.1.d: "The ancient Hausa Bakwai, the seven true city-states born of the Bayajidda legend, have at last been brought under one rule. Kano, Katsina, Zazzau, Daura, Gobir, Rano, and Biram: each renowned for its own strengths, each now part of a greater whole. The question that faces us is what kind of nation we shall build from these proud cities. Shall we follow the path of Queen Amina, expanding our borders by the sword and shielding our people behind walls of earth and iron? Or shall we turn our energies to the great markets and trade routes that already make our cities the envy of the Sahel, becoming the commercial heart of West Africa?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_hau.1.a: "Construisez les murs. Montez à cheval. Conquérir."
 nd_hau.1.b: "Les caravanes apportent plus de richesses que n'importe quelle armée."
 nd_hau.2.t: "La Chronique de Kano"
 nd_hau.2.d: "Nos érudits ont compilé une chronique des rois de Kano, retraçant la lignée de nos dirigeants depuis le légendaire Bagauda jusqu'à nos jours. Écrit en écriture arabe, ce document remarquable relate l'ascension et la chute des dynasties, l'avènement de l'Islam, les grandes guerres et alliances qui ont façonné notre nation, ainsi que les actes des rois, sages et insensés. Il s’agit de l’une des plus grandes œuvres historiques de notre continent, témoignant que notre civilisation a une histoire qui mérite d’être racontée et préservée à travers les âges."
 nd_hau.2.a: "Que notre histoire reste gravée dans les mémoires."
 nd_hau.3.t: "Les réformes de Muhammad Rumfa"
 nd_hau.3.d: "Muhammad Rumfa, Sarki de Kano, a transformé notre plus grande ville en un centre d'apprentissage et de gouvernance islamique. Il a construit des mosquées et des madrasas, invité des érudits d'Égypte, de Tunis et du Maroc et a chargé le grand érudit al-Maghili d'écrire un traité sur les obligations des dirigeants musulmans. Le Taqaddum, le code de gouvernance de Rumfa, établit les réglementations du marché, les protocoles judiciaires et le cadre d'un État islamique juste. Il ne s’agit pas simplement d’une réforme de l’administration ; c'est l'élévation de toute notre civilisation."
 nd_hau.3.a: "Embrassez le chemin de l’apprentissage et de la foi."
 nd_hau.3.b: "Centraliser l'autorité au sein du tribunal de Sarki."
 nd_hau_wall_building_tradition: "Fortification de Birni"
 nd_hau_wall_building_tradition_desc: "La construction de murs massifs en terre autour des villes haoussa, créant des centres urbains fortifiés capables de résister à des sièges prolongés."
 nd_hau_bayajidda_legacy: "L'héritage de Bayajidda"
 nd_hau_bayajidda_legacy_desc: "Le mythe fondateur des Haoussa Bakwai, sept cités-États descendantes du héros Bayajidda, fournit le cadre culturel de l’identité politique haoussa."
 nd_hau_sahel_agriculture: "Agriculture sahélienne"
 nd_hau_sahel_agriculture_desc: "Le développement de techniques agricoles adaptées au milieu sahélien, centrées sur les céréales, le coton, les légumes et l'élevage, avec le travail du métal pour produire les outils nécessaires à la culture."
 nd_hau_spread_of_islam: "Propagation de l'Islam"
 nd_hau_spread_of_islam_desc: "L'arrivée de l'Islam par l'intermédiaire des marchands transsahariens a transformé la société urbaine haoussa, en introduisant l'alphabétisation, les traditions juridiques et les liens avec le monde islamique au sens large."
 nd_hau_equestrian_nobility: "Noblesse équestre"
 nd_hau_equestrian_nobility_desc: "The Hausa aristocracy developed a horse-riding culture that became the foundation of their military power. Every sarki and titled lord rides to war with his barade, the mounted champions of his household."
 nd_hau_kano_chronicle: "La Chronique de Kano"
 nd_hau_kano_chronicle_desc: "L'un des documents historiques les plus importants d'Afrique, la Chronique de Kano retrace l'histoire de la ville depuis sa fondation légendaire jusqu'aux règnes de ses rois."
 nd_hau_indigo_dyeing: "Teinture indigo"
 nd_hau_indigo_dyeing_desc: "The establishment of the famous dye pits of Kano, producing vibrant indigo-dyed cloth that became one of Hausaland's most valued exports.\n\n#italic Available in: $nd_hau_kofar_mata$#!"
 nd_hau_yan_lifida_tradition: "Tradition Yan Lifida"
 nd_hau_yan_lifida_tradition_desc: "Le développement de la Yan Lifida, cavalerie lourde d'élite portant une armure de coton matelassée en couches avec une cotte de mailles, en tant que première force militaire des États haoussa."
 nd_hau_rumfa_reforms_advance: "Les réformes de Rumfa"
 nd_hau_rumfa_reforms_advance_desc: "Les réformes de gouvernance transformatrices de Muhammad Rumfa de Kano, qui a construit des mosquées et des madrasas, établi des réglementations du marché et élevé Kano au rang de centre d’érudition islamique."
 nd_hau_trans_saharan_links: "Liens transsahariens"
 nd_hau_trans_saharan_links_desc: "L’établissement de Kano et Katsina en tant que nœuds majeurs du réseau commercial transsaharien, reliant les régions productrices d’or à l’Afrique du Nord."
 nd_hau_queen_amina: "Campagnes de la reine Amina"
 nd_hau_queen_amina_desc: "La reine Amina de Zazzau a mené une campagne de conquête de 34 ans, étendant le territoire haoussa de Bauchi à Nupe et construisant des murs de fortification à travers le pays."
 nd_hau_sarauta_governance: "Gouvernance de Sarauta"
 nd_hau_sarauta_governance_desc: "La formalisation du système de gouvernance sarauta, organisant l'administration par le biais des Sarki et d'un conseil de neuf anciens représentant les intérêts royaux, cléricaux et commerciaux."
 nd_hau_leather_exports: "Exportations de cuir"
 nd_hau_leather_exports_desc: "The development of Hausa leatherwork into a major export industry, with industrial-scale indigo processing to dye the leather and cloth that made Kano famous.\n\n#italic Available in: $nd_hau_kofar_mata$#!"
 nd_hau_artisan_guilds: "Guildes d'artisans"
 nd_hau_artisan_guilds_desc: "The organization of Hausa artisans into specialized guilds (blacksmiths, weavers, dyers, leatherworkers, and builders), each with internal governance and market privileges. The builders shape tubali, the sun-dried bricks of Hausa walls and vaults.\n\n#italic Available in: $nd_hau_kofar_mata$#!"
 nd_hau_gobir_frontier: "Frontière de Gobir"
 nd_hau_gobir_frontier_desc: "The northernmost Hausa state of Gobir maintained a permanent military establishment to defend Hausaland against foreign invaders from the Sahara. Behind its horsemen stand the yan baka, country bowmen whose arrows are poisoned."
 nd_hau_gunpowder_adoption: "Adoption de la poudre à canon"
 nd_hau_gunpowder_adoption_desc: "L'adoption des armes à feu grâce au commerce transsaharien, créant une infanterie de mousquetaires (Yan Bindiga) pour compléter les forces de cavalerie traditionnelles."
 nd_hau_leather_trade: "Maroquinerie Majema"
 nd_hau_leather_trade_desc: "Le raffinement du travail du cuir haoussa par les artisans majema, utilisant le tannage végétal avec des gousses de bagaruwa pour produire de la maroquinerie fine destinée à l'exportation."
 nd_hau_market_competition: "Concurrence sur le marché"
 nd_hau_market_competition_desc: "La rivalité entre Katsina et Kano pour la domination du commerce transsaharien pousse les deux villes à développer des institutions de marché sophistiquées."
 nd_hau_ajami_scholarship: "Bourse Ajami"
 nd_hau_ajami_scholarship_desc: "Le développement du haoussa ajami, l'écriture de la langue haoussa en écriture arabe, créant une classe d'érudits alphabétisés qui a produit des ouvrages juridiques, historiques et religieux."
 nd_hau_zango_networks: "Réseaux Zango"
 nd_hau_zango_networks_desc: "The establishment of zango, resident Hausa merchant communities, along major trade routes from the forest belt to the Sahara, extending commercial influence far beyond Hausaland. The mail and iron they bring home go into the quilted armor of the cavalry.\n\n#italic Lifida Armoring is available in: $nd_hau_kofar_mata$#!"
 nd_hau_centralized_sarauta: "Sarauta centralisée"
 nd_hau_centralized_sarauta_desc: "La consolidation de l'autorité royale sous un sarki fort qui centralisait la collecte des impôts et le commandement militaire, renforçant ainsi l'appareil d'État."
 nd_hau_urban_growth: "Croissance urbaine"
 nd_hau_urban_growth_desc: "L'expansion des villes haoussa dans les grands centres urbains, Kano et Katsina rivalisant avec Tombouctou en termes de population et d'activité commerciale."
 nd_hau_cotton_industry: "Industrie du coton"
 nd_hau_cotton_industry_desc: "The development of cotton agriculture and textile weaving as a major industry, with Hausa cloth traded throughout West Africa.\n\n#italic Available in: $nd_hau_kofar_mata$#!"
 nd_hau_standing_army: "Armée permanente"
 nd_hau_standing_army_desc: "The evolution of Hausa military organization from ad hoc levies to permanent standing forces in the major city-states, first among them the dogarai, the palace guard that answers to the sarki alone."
 nd_hau_sahel_diplomacy: "Diplomatie sahélienne"
 nd_hau_sahel_diplomacy_desc: "Traditions diplomatiques haoussa de négociation et de construction d’alliances entre cités-États, gérant l’équilibre complexe des pouvoirs à travers le Sahel."
 nd_hau_defense_of_autonomy: "Défense de l'autonomie"
 nd_hau_defense_of_autonomy_desc: "La défense de l’indépendance de la cité-État haoussa contre les pressions extérieures, en préservant les traditions d’autonomie gouvernementale qui définissent le pays haoussa."
 nd_hau_commercial_sophistication: "Sophistication commerciale"
 nd_hau_commercial_sophistication_desc: "The continued refinement of Hausa commercial institutions, with market towns serving as centers of regional and long-distance trade. The red goatskin of the Hausa tanners is sold in Europe as Morocco leather.\n\n#italic Available in: $nd_hau_majema_tannery$#!"
 nd_hau_cultural_resilience: "Résilience culturelle"
 nd_hau_cultural_resilience_desc: "The preservation and development of Hausa cultural identity through oral tradition, distinctive architecture, and specialized craft production. At the festival every titled household rides past its ruler in the durbar, pageant and muster in one."
 nd_hau_sahel_stewardship: "Gestion du Sahel"
 nd_hau_sahel_stewardship_desc: "L’expansion des techniques agricoles pour gérer l’environnement fragile du Sahel et soutenir les populations urbaines croissantes."
 nd_hau_maliki_jurisprudence: "Jurisprudence Maliki"
 nd_hau_maliki_jurisprudence_desc: "Le développement d’un système juridique combinant la jurisprudence islamique de l’école Maliki avec le droit coutumier Haoussa, créant un cadre de gouvernance pragmatique."
 a_nd_hau_yan_lifida: "Yan Lifida"
 a_nd_hau_yan_lifida_desc: "Cavalerie lourde d'élite haoussa portant une armure en coton matelassé (lifida) et une cotte de mailles (sulke), montée sur des chevaux blindés. Ces redoutables guerriers servaient de garde du corps de l'émir et de force de choc des armées haoussa."
 a_nd_hau_yan_lifida_levy: "Yan Lifida (Lévy)"
 a_nd_hau_yan_lifida_levy_desc: "Cavalerie lourde élevée par Levy issue de l'aristocratie haoussa, équipée d'une armure matelassée et d'une cotte de mailles dans la tradition Yan Lifida."
 a_nd_hau_yan_bindiga: "Yan Bindiga"
 a_nd_hau_yan_bindiga_desc: "Mousquetaires haoussa armés d'armes à feu acquises grâce au commerce transsaharien. Cette infanterie à poudre fournissait une puissance de feu dévastatrice pour compléter la charge de cavalerie traditionnelle."
 a_nd_hau_yan_bindiga_levy: "Yan Bindiga (Lévy)"
 a_nd_hau_yan_bindiga_levy_desc: "Mousquetaires élevés à Levy, équipés d'armes à feu commerciales, issus de la soldatesque commune des cités-États haoussa."
 nd_hau_birni_walls: "Murs de Birni"
 nd_hau_birni_walls_desc: "D’énormes murs de fortification en terre entourant des villes haoussa entières et leur arrière-pays agricole. Les murs de Kano s'étendaient à eux seuls sur 23 kilomètres, atteignant une hauteur de 15 mètres avec une épaisseur de base de 12 mètres."
 nd_hau_kofar_mata: "Puits de teinture de Kofar Mata"
 nd_hau_kofar_mata_desc: "Des fosses de teinture circulaires produisant le tissu teint à l'indigo vibrant qui a rendu Kano célèbre dans toute l'Afrique de l'Ouest et à travers le Sahara. Le coton violet de Kano rivalisait autrefois avec les richesses légendaires de Tombouctou."
 nd_hau_tsangaya: "École Tsangaya"
 nd_hau_tsangaya_desc: "Un centre d'études islamiques où sont enseignés l'apprentissage coranique et l'alphabétisation arabe, produisant une classe d'érudits alphabétisés qui administre les cités-États et tient des registres juridiques et historiques."
 nd_hau_sarauta_hall: "Salle du conseil de Sarauta"
 nd_hau_sarauta_hall_desc: "Le siège de la gouvernance haoussa où le Sarki et son conseil de neuf anciens délibèrent sur les questions d'État, équilibrant les intérêts de la couronne, du clergé et des guildes marchandes."
 nd_hau_zango_post: "Poste de traite de Zango"
 nd_hau_zango_post_desc: "Une station commerciale de la diaspora Haoussa où les commerçants résidents servent de relais pour les caravanes et de centres de renseignements commerciaux, étendant les réseaux commerciaux Haoussa bien au-delà du pays d'origine."
 nd_hau_majema_tannery: "Tannerie Majema"
 nd_hau_majema_tannery_desc: "Un atelier de maroquiniers majema, utilisant le tannage végétal traditionnel avec des gousses de bagaruwa pour produire des articles en cuir souple qui ont rendu le pays Hausa célèbre à travers le Sahara et au-delà."
 nd_hau_birni_maintenance: "Entretien du mur de Birni"
 nd_hau_birni_maintenance_desc: "L’entretien continu des immenses fortifications en terre qui protègent nos villes."
 nd_hau_dyepit_operations: "Opérations dans les fosses de teinture"
 nd_hau_dyepit_operations_desc: "Teindre des tissus bruts avec de l'indigo dans les célèbres fosses de teinture de Kano pour produire des textiles fins et vibrants commercialisés à travers le Sahara."
 nd_hau_school_upkeep: "Entretien de l'école"
 nd_hau_school_upkeep_desc: "Les coûts d'entretien des écoles tsangaya, y compris le papier et le matériel d'écriture pour l'enseignement, le tissu pour les robes des érudits et la cire d'abeille pour les lampes utilisées pendant les études du soir."
 nd_hau_council_upkeep: "Administration du Conseil"
 nd_hau_council_upkeep_desc: "Les frais administratifs liés au maintien du conseil de Sarauta, y compris le papier pour la tenue des registres, le tissu pour la tenue officielle et le tissu fin pour les nominations cérémonielles de la salle du conseil."
 nd_hau_zango_upkeep: "Entretien du Zango"
 nd_hau_zango_upkeep_desc: "Les coûts de fonctionnement liés au maintien d’une communauté commerciale de la diaspora Haoussa, y compris les provisions pour les commerçants résidents."
 nd_hau_tanning_process: "Processus de bronzage"
 nd_hau_tanning_process_desc: "Le tannage transforme le cuir en cuir souple selon les méthodes traditionnelles bagaruwa-pod perfectionnées par les artisans majema."
 nd_hau_blacksmith_tradition: "Travail des métaux haoussa"
 nd_hau_blacksmith_tradition_desc: "Les forgerons traditionnels haoussa forgent le fer et le bois pour fabriquer des outils agricoles, des armes et des armures."
 nd_hau_indigo_processing: "Traitement indigo"
 nd_hau_indigo_processing_desc: "Transformation de la teinture indigo et des fibres brutes en tissus teints fins à une échelle commerciale pour l'exportation à travers le Sahel."
 nd_hau_cotton_weaving: "Tissage de coton haoussa"
 nd_hau_cotton_weaving_desc: "Raw cotton woven in narrow strips on the Hausa loom and dyed in the pits beside it."
 nd_hau_refined_leatherwork: "Travail du cuir raffiné"
 nd_hau_refined_leatherwork_desc: "Goatskin tanned soft and dyed red, the fine leather that made Hausa artisans renowned across the trade routes of Africa."
 nd_hau_grain_processing: "Transformation des céréales du Sahel"
 nd_hau_grain_processing_desc: "Brassage des céréales du Sahel pour en faire de la bière, la boisson de base qui fait vivre à la fois les villes et les garnisons de cavalerie du pays haoussa."
 nd_hau_lifida_armoring: "Armure de Lifida"
 nd_hau_lifida_armoring_desc: "La production d'armures en coton matelassé et d'accessoires en cotte de mailles pour la cavalerie lourde Yan Lifida, combinant l'artisanat textile local avec la ferronnerie importée."
 nd_hau_tubali_brickmaking: "Tubali Brickmaking"
 nd_hau_tubali_brickmaking_desc: "The builders' guild molds clay into tubali, pear-shaped sun-dried bricks, and cuts the palm beams that carry Hausa vaults."
 nd_hau_durbar_ground: "Durbar Ground"
 nd_hau_durbar_ground_desc: "The open ground before the palace where the hawan sallah is ridden. Each titled household parades its horsemen past the ruler in full trappings, and the ruler counts them."
 nd_hau_durbar_upkeep: "Durbar Upkeep"
 nd_hau_durbar_upkeep_desc: "Horses for the royal stable, fine cloth for the riders' gowns, and leather for saddles and trappings."
 a_nd_hau_barade_levy: "Barade"
 a_nd_hau_barade_levy_desc: "Mounted champions of the Hausa lords, lancers in gown and turban who ride ahead of the host and close fast."
 a_nd_hau_yan_baka_levy: "Yan Baka"
 a_nd_hau_yan_baka_levy_desc: "Country bowmen whose arrows are dipped in poison. A scratch is enough. They carry no shield and do not last once the enemy reaches them."
 a_nd_hau_dogarai: "Dogarai"
 a_nd_hau_dogarai_desc: "The palace guard of the sarki, household men always under arms who answer to him alone. Few in number and the last to leave a field."
 levy_nd_hau_barade: "Barade Levy"
 levy_nd_hau_barade_desc: "The mounted champions each Hausa lord brings to the muster."
 levy_nd_hau_yan_baka: "Yan Baka Levy"
 levy_nd_hau_yan_baka_desc: "Bowmen called up from the farming villages, shooting poisoned arrows."
 levy_nd_hau_yan_lifida: "Yan Lifida Lévy"
 levy_nd_hau_yan_lifida_desc: "Cavalerie noble issue de l'aristocratie haoussa, chevauchant des chevaux blindés et portant l'armure matelassée distinctive de lifida avec une cotte de mailles."
 levy_nd_hau_yan_bindiga: "Yan Bindiga Lévy"
 levy_nd_hau_yan_bindiga_desc: "Infanterie mousquetaire recrutée parmi les soldats ordinaires, armée d'armes à feu acquises via les réseaux commerciaux transsahariens."
 STATIC_MODIFIER_NAME_nd_hau_political_centralization: "Centralisation politique"
 STATIC_MODIFIER_DESC_nd_hau_political_centralization: "Les réformes de Muhammad Rumfa concentrent l'autorité dans la cour de Sarki, créant ainsi une administration plus efficace, capable de gouverner les affaires complexes d'un État en pleine croissance."
 nd_hau_formed_tt: "Le pays haoussa a été formé"
 nd_hau_path_a_tt: "Choisissez les murs d’Amina"
 nd_hau_path_b_tt: "A choisi Carrefour du Sahel"
 nd_hau_dest_walls_4_tt: "At least #bold 4#! of our locations have #bold Birni Walls#!"
 nd_hau_dest_walls_8_tt: "At least #bold 8#! of our locations have #bold Birni Walls#!"
 nd_hau_destiny: "Le destin du pays haoussa"
 nd_hau_destiny_desc: "Les Hausa Bakwai sont réunis sous une même bannière. Il nous faut maintenant prouver que cette union n’est pas un accident de l’histoire mais le début de quelque chose de plus grand. La stabilité et l'ordre sont les premières exigences."
 nd_hau_dest_sword_1: "L'épée chevauche le sud et le nord"
 nd_hau_dest_sword_1_desc: "Dans la tradition de la reine Amina, nous étendrons notre domination au-delà du cœur du pays haoussa. Les royaumes Nupe au sud et les Touareg de l'Air au nord doivent tous deux reconnaître notre suprématie."
 nd_hau_dest_sword_2: "Conquête de Bornu et Oyo"
 nd_hau_dest_sword_2_desc: "The great rival kingdoms of Bornu and Oyo stand as the only obstacles to Hausa hegemony in the western Sudan. Their capitals must fall to our armies, and four of our towns must be walled as Amina walled hers."
 nd_hau_dest_sword_3: "Empire du Sahel"
 nd_hau_dest_sword_3_desc: "From Timbuktu to Benin, from the Niger bend to the forests of the south, a Hausa empire shall unite the western Sudan under one crown, with eight of its towns behind birni walls. This is the culmination of Amina's vision."
 nd_hau_dest_caravan_1: "Coton et caravanes"
 nd_hau_dest_caravan_1_desc: "Notre richesse commence avec les champs de coton et les teintureries qui rendent le tissu Kano célèbre à travers le continent. Nous devons garantir que le coton circule sur nos marchés et que notre trésorerie soit pleine."
 nd_hau_dest_caravan_2: "Carrefour des Empires"
 nd_hau_dest_caravan_2_desc: "Hausaland sits at the crossroads of every major trade route in the western Sudan. By embracing new financial institutions and building up Katsina, where the Saharan road ends, we can become the commercial heart of Africa."
 nd_hau_dest_katsina_developed_tt: "#bold Katsina#! is ours and has reached a development of 30"
 nd_hau_dest_caravan_3: "Le grand marché"
 nd_hau_dest_caravan_3_desc: "Let Kano and Katsina be spoken of alongside the great markets of the world. With salt from the Sahara flowing through our markets, Kano grown to twice its old size and our treasury overflowing, we shall build a commercial empire that outlasts any conqueror."
 nd_hau_dest_kano_developed_tt: "#bold Kano#! is ours and has reached a development of 40"
 nd_hau.4.t: "Le destin du pays haoussa"
 nd_hau.4.d: "Les sept véritables États sont unis et un seul Sarki règne depuis la plus grande ville de l’ouest du Soudan. Mais l’unité n’est que le début. Le monde au-delà de nos murs est vaste et la voie que nous choisissons aujourd’hui façonnera le destin de notre peuple pour des générations. Les bases sont posées. Maintenant, il faut construire."
 nd_hau.4.a: "Notre destin commence aujourd'hui."
 nd_hau.5.t: "Nupe et Air Soumettre"
 nd_hau.5.d: "Notre cavalerie s'est dirigée vers le sud jusqu'aux rives du Niger et vers le nord jusqu'aux oasis de l'Air. Les princes Nupe et les chefs touareg ont appris ce que la reine Amina a enseigné à leurs ancêtres il y a des siècles : que les Haoussa vont où ils veulent et que ceux qui résistent sont brisés. Les routes commerciales au sud et les sentiers caravaniers au nord traversent désormais le territoire sous notre protection."
 nd_hau.5.a: "L'épée ouvre toutes les routes."
 nd_hau.6.t: "La chute de Bornu et Oyo"
 nd_hau.6.d: "Les deux grands royaumes rivaux qui encerclaient le pays haoussa depuis des siècles ont été mis au pas. Ngazargamu, la forteresse-capitale de l'empire Bornu, a ouvert ses portes à nos forces. A l'ouest, la grande ville d'Oyo-Ile, siège des Alaafin, reconnaît la suprématie haoussa. Nous sommes la puissance dominante de l’ouest du Soudan. Comment allons-nous administrer ces conquêtes ?"
 nd_hau.6.a: "Règle par l'hommage et la reconnaissance."
 nd_hau.6.b: "Forgez les vaincus en une seule armée."
 nd_hau.7.t: "Empire du Sahel"
 nd_hau.7.d: "Des anciennes bibliothèques de Tombouctou aux ateliers de bronze du Bénin, des mosquées savantes de Djenné aux grands marchés de Kano, un empire haoussa s'étend désormais sur tout l'ouest du Soudan. Depuis l’époque de Songhaï et du Mali, aucune puissance n’a jamais commandé un tel territoire en Afrique de l’Ouest. Nous avons réalisé la vision de la reine Amina et l’avons dépassée au centuple. Comment l’histoire se souviendra-t-elle de cet exploit ?"
 nd_hau.7.a: "Nous administrerons cet empire avec sagesse."
 nd_hau.7.b: "La conquête n'est jamais terminée."
 nd_hau.8.t: "La route du coton"
 nd_hau.8.d: "Les marchés de Kano regorgent de coton : brut des champs, filé, tissé et teint dans l'indigo profond qui est devenu notre marque de fabrique. Les caravanes transportent nos textiles vers le nord à travers le Sahara et vers le sud jusqu'aux royaumes forestiers. La richesse qui coule entre nos mains prouve qu’une balle de coton peut valoir plus qu’une ville capturée. Notre trésorerie grandit, et avec elle notre influence."
 nd_hau.8.a: "La richesse est le véritable pouvoir."
 nd_hau.9.t: "Le carrefour s'épanouit"
 nd_hau.9.d: "Le pays haoussa est devenu ce que sa géographie a toujours promis : le carrefour indispensable du commerce ouest-africain. Chaque caravane du Sahara, chaque convoi commercial de la ceinture forestière, chaque marchand en quête d'or, de sel, de cuir ou de textiles passe par nos villes. Nos institutions bancaires sont devenues matures, nos marchés sont sophistiqués et nos villes s’enrichissent grâce au flux de marchandises. Dans quoi allons-nous investir ?"
 nd_hau.9.a: "Investissez dans nos commerçants et nos marchés."
 nd_hau.9.b: "Investissez dans les universitaires et les relations diplomatiques."
 nd_hau.10.t: "Le Grand Marché de Kano"
 nd_hau.10.d: "On dit que tout peut être acheté au grand marché de Kano : le sel du Sahara, la cola des forêts, le cuir si bien travaillé que les Européens l'appellent cuir du Maroc sans savoir qu'il venait de nos tanneries, les tissus teints dans l'indigo le plus profond, les outils en fer, les chevaux, les livres et les marchandises provenant de terres dont la plupart des gens n'ont jamais entendu parler. Notre empire commercial fait l’envie de l’Afrique. Comment allons-nous utiliser cette richesse ?"
 nd_hau.10.a: "Élargissez davantage notre portée commerciale."
 nd_hau.10.b: "Devenez mécènes du savoir et des arts."
 STATIC_MODIFIER_NAME_nd_hau_dest_conqueror_of_nations: "Conquérant des nations"
 STATIC_MODIFIER_DESC_nd_hau_dest_conqueror_of_nations: "La soumission des royaumes rivaux à l'autorité haoussa nous a donné l'expérience de la gestion des peuples conquis et de l'extraction des tributs."
 STATIC_MODIFIER_NAME_nd_hau_dest_iron_discipline: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_hau_dest_iron_discipline: "Les campagnes constantes aux frontières ont endurci nos troupes et enseigné à nos commandants l'art d'entretenir les fortifications avec un minimum de dépenses."
 STATIC_MODIFIER_NAME_nd_hau_dest_sahelian_imperium: "Impérial sahélien"
 STATIC_MODIFIER_DESC_nd_hau_dest_sahelian_imperium: "The administration of a vast Sahelian empire requires sophisticated intelligence networks and the ability to project power quickly. The price of empire is eternal vigilance, and the tribes of the conquered lands resent the watch kept on them."
 STATIC_MODIFIER_NAME_nd_hau_dest_eternal_conquest: "Conquête éternelle"
 STATIC_MODIFIER_DESC_nd_hau_dest_eternal_conquest: "La machine de guerre haoussa est devenue un moteur d’expansion autonome, recrutant de nouveaux soldats à mesure que les provinces sont conquises. La diplomatie est une réflexion après coup."
 STATIC_MODIFIER_NAME_nd_hau_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_hau_dest_merchant_princes: "Les grandes maisons marchandes de Kano et Katsina ont investi massivement dans la production de coton, utilisant leur richesse pour orienter leur politique. Les dépenses militaires restent limitées."
 STATIC_MODIFIER_NAME_nd_hau_dest_scholarly_exchange: "Échange scientifique"
 STATIC_MODIFIER_DESC_nd_hau_dest_scholarly_exchange: "Le flux d’érudits et de diplomates à travers les villes haoussas a renforcé nos liens avec le reste du monde et apporté de nouvelles connaissances à nos tribunaux."
 STATIC_MODIFIER_NAME_nd_hau_dest_emporium_of_africa: "Emporium de l'Afrique"
 STATIC_MODIFIER_DESC_nd_hau_dest_emporium_of_africa: "Le pays haoussa est devenu le centre commercial incontournable de l'Afrique de l'Ouest, ses marchands et ses diplomates sont accueillis dans toutes les cours, ses marchés attirant des commerçants du monde entier."
 STATIC_MODIFIER_NAME_nd_hau_dest_patron_of_learning: "Patron de l'apprentissage"
 STATIC_MODIFIER_DESC_nd_hau_dest_patron_of_learning: "L’investissement dans l’érudition et l’apprentissage islamique a élargi nos horizons et approfondi notre compréhension du monde, même si notre préparation militaire en a quelque peu souffert."
 nd_hau_gidan_sarki: "Gidan Sarki"
 nd_hau_gidan_sarki_desc: "Le palais impérial des Sarki de tout le pays haoussa, un magnifique complexe alliant la grandeur d'une cour royale à l'infrastructure de commandement militaire nécessaire pour gouverner un empire continental. Ses murs font écho à l'autorité des héritiers d'Amina."
 nd_hau_gidan_sarki_upkeep: "Administration du palais"
 nd_hau_gidan_sarki_upkeep_desc: "Les coûts d'entretien du palais impérial, y compris les armes pour la garde royale, les tissus fins pour les cérémonies et le papier pour la bureaucratie."
 nd_hau_fatauci_house: "Maison Fatauçi"
 nd_hau_fatauci_house_desc: "La grande salle des marchés du fatauci, le principal commerçant du réseau commercial haoussa. Depuis ce bâtiment, les vastes routes caravanières s'étendant du Sahara aux forêts sont coordonnées, les accords négociés et la richesse des nations comptée."
 nd_hau_fatauci_operations: "Opérations des maisons de commerce"
 nd_hau_fatauci_operations_desc: "Les opérations quotidiennes de la Maison Fatauci nécessitent du tissu pour emballer les marchandises commerciales, du sel saharien comme moyen d'échange et du papier pour la tenue des registres commerciaux."

 # ===== BUREAUCRACIES =====
 hau_sarauta_bureaucracy: "Conseil de Sarauta"
 hau_sarauta_bureaucracy_desc: "Le corps gradué de fonctionnaires titrés qui entourait le sarki d'un birni haoussa : le Galadima en tant qu'administrateur de la capitale et conseiller principal ; le Madawaki comme commandant de la cavalerie ; le Waziri comme président du conseil ; le Sarkin Yaki comme maréchal ; le Magajin Gari et le mai unguwa en tant qu'anciens de la paroisse. Les titres étaient nominatifs, non strictement héréditaires, et le conseil de neuf faiseurs de rois (à Kano, le Tara-ta-Kano) confirmait chaque nouveau sarki parmi les princes éligibles. Le système a donné à l’État haoussa une aristocratie active sans primogéniture, mais il a également maintenu le dirigeant en permanence dépendant du consentement de ses grands hommes titrés."
 hau_alkali_court_bureaucracy: "Cour alcaline"
 hau_alkali_court_bureaucracy_desc: "Le juge en chef (l'alkalai alcalin) présidait une hiérarchie de cadis malékites dont les tribunaux statuaient sur les questions d'héritage, de contrat, de famille et de waqf selon le Mukhtasar de Khalil ibn Ishaq et la Risala d'Ibn Abi Zayd. La jurisprudence malékite a atteint les villes haoussa grâce aux érudits Wangara au XVe siècle et grâce aux liens de Katsina avec la tradition Sankore de Tombouctou; sous Muhammadu Korau (r. c. 1445-93), Katsina est devenue le principal site d'érudition juridique islamique en pays haoussa. Les tribunaux alcalins fonctionnaient parallèlement à la justice sarauta pour les non-musulmans, générant une tension productive qui dura jusqu'au jihad."
 hau_kano_chronicle_bureaucracy: "Bureau des Chroniques de Kano"
 hau_kano_chronicle_bureaucracy_desc: "Chronique dynastique en langue arabe, continuellement mise à jour, conservée à la cour des Sarki, répertoriant chaque dirigeant de Kano depuis le légendaire Bagauda (vers 999) avec la date d'accession, les actes de guerre et les grands événements du règne. La chronique n'était pas un document passif mais un instrument de travail de légitimité, récité à chaque nouvelle installation et consulté pour régler les questions de rang et de préséance. Des chroniques sœurs (la chronique de Katsina, la Chanson de Bagauda, ​​la Chronique de Wangara, le Rawdat al-afkar) l'ont rejoint à travers le bakwai. Une fois bien ancrée, l'autorité de la chronique est difficile à mettre de côté, même lorsque ses scribes sont devenus négligents."
 hau_wangara_diaspora_bureaucracy: "Compact de Wangarawa"
 hau_wangara_diaspora_bureaucracy_desc: "La présence sédentaire des marchands-érudits Soninké-Wangara dans les grands marchés haoussa, dont les caravanes reliaient le pays haoussa à la boucle du Niger, aux mines de sel de Taghaza et aux forêts de kola de Gonja. La Chronique de Kano rapporte que sous Sarki Yaji (r. c. 1349-85), les Wangarawa, peut-être jusqu'à cent soixante sous Cheikh Abdurrahman Zaite, se sont installés à Kano et ont amené l'Islam avec eux. Leurs successeurs ont ancré Katsina et Kano sous le nom de sarakuman kasuwa (« rois du marché ») agissant comme agents commerciaux, prêteurs sur gages et clercs à gages. Le pacte repose sur une fiscalité légère et la protection judiciaire des commerçants étrangers; la noblesse indigène haoussa était mécontente de chaque concession."
 hau_birnin_walls_bureaucracy: "Ordre Birnin"
 hau_birnin_walls_bureaucracy_desc: "L'ordre de la ville fortifiée, par lequel les grands remparts de terre du birane haoussa enfermaient le palais royal, le marché central et les quartiers densément peuplés sous l'autorité des chefs de quartier (mai unguwa). Les murs de Kano - commencés sous Gijimasu (r. c. 1095-1134) et achevés sous Kanajeji - s'élevaient de dix à douze mètres par endroits et étaient parmi les plus grands d'Afrique. Birnin Zazzau, attribué en partie à la reine Amina de Zaria (r. c. 1576), et les murs de Katsina et Daura en ont conservé le modèle. Le mai unguwa déclarait les impôts, recrutait la milice et entretenait les portes la nuit, transformant l'enveloppe fortifiée en un ordre civique fonctionnel."
 hau_maguzawa_compact_bureaucracy: "Compact de Maguzawa"
 hau_maguzawa_compact_bureaucracy_desc: "L'accommodement non écrit par lequel les villages Haoussa non musulmans - les Maguzawa, « ceux qui ont fui » les conversions du XVe siècle - étaient autorisés à conserver leurs sanctuaires bori, leurs chefferies ancestrales et leurs fêtes saisonnières au sein de birane gouvernée par les musulmans. En échange, ils payaient un tribut sous forme de céréales, de tissus et de fer, et fournissaient des contributions aux guerres des sarki. Le pacte fut durable : il survécut à l’islamisation des tribunaux, à la montée des tribunaux alcalins et aux longues guerres du Bornu. Seul le jihad Sokoto de 1804, qui classait les Maguzawa comme apostats plutôt que comme dhimmis, y mit fin."

 AUTO_MODIFIER_NAME_nd_hau_bureaucracy_authority: "Bakawa des Birni"
 AUTO_MODIFIER_DESC_nd_hau_bureaucracy_authority: "Les bakawa (les grands bureaux titrés de la cité-État haoussa, depuis le Galadima de la capitale jusqu'au mai unguwa de chaque quartier) sont devenus un appareil institutionnel permanent. Le sarki peut désormais soutenir les tribunaux, les chroniques et les pactes marchands qui distinguent un véritable birni d'une chefferie de campagne."
