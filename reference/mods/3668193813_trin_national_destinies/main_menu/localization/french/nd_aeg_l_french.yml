 # ===== TOOLTIP HOOKS FOR EVENT VARIABLES =====
 nd_aeg_formed_tt: "Aegyptus a été forgé."
 nd_aeg_path_a_tt: "Sur les traces du sultan-pharaon mamelouk."
 nd_aeg_path_b_tt: "Sur les traces du calife d'Egypte."
 nd_aeg_path_c_tt: "Sur la voie de la synthèse copte-islamique."
 nd_aeg_dest_baghdad_developed_tt: "Baghdad is ours and its development is at least #bold 27#!"
 nd_aeg_dest_tripolitania_share_tt: "At least #bold 50%#! of the locations of the Tripoli area are ours"
 nd_aeg_dest_iraq_share_tt: "At least #bold 50%#! of the locations of Arab Iraq are ours"
 nd_aeg_dest_ethiopia_share_tt: "At least #bold 50%#! of the locations of Central Ethiopia are ours"
 nd_aeg_dest_cairo_developed_tt: "Cairo is ours and its development is at least #bold 40#!"
 nd_aeg_dest_cairo_academy_tt: "Cairo is ours and its development is at least #bold 48#!"
 nd_aeg_dest_suez_developed_tt: "Suez is ours and its development is at least #bold 42#!"

 # ===== STATIC MODIFIERS: FORMATION CHOICES =====
 STATIC_MODIFIER_NAME_nd_aeg_sultan_pharaoh: "Le sultan-pharaon mamelouk"
 STATIC_MODIFIER_DESC_nd_aeg_sultan_pharaoh: "L'aristocratie esclavagiste de la citadelle règne depuis le Caire en tant qu'héritière des pharaons. Le Nil est le trône ; la lance, l'arc et l'épée sont les insignes. L’hégémonie mamelouke est le nouvel ordre dynastique."
 STATIC_MODIFIER_NAME_nd_aeg_caliph_of_egypt: "Le calife d'Egypte"
 STATIC_MODIFIER_DESC_nd_aeg_caliph_of_egypt: "Le Caire restaure la ligne abbasside qui a survécu à la chute de Bagdad. Le sultan comme protecteur du calife. Les oulémas d'al-Azhar ont fixé la loi du royaume. La jurisprudence sunnite constitue l’épine dorsale de la gouvernance."
 STATIC_MODIFIER_NAME_nd_aeg_coptic_synthesis: "La synthèse copte-islamique"
 STATIC_MODIFIER_DESC_nd_aeg_coptic_synthesis: "Des fils pharaoniques, coptes et islamiques tissés dans une seule identité égyptienne. Les commis du diwan sont coptes ; les soldats de la citadelle sont musulmans ; les monuments du désert appartiennent à tous. L'Egypte à part la Oumma."

 # ===== STATIC MODIFIERS: ADVANCE EVENTS =====
 STATIC_MODIFIER_NAME_nd_aeg_dynastic_legitimacy: "Légitimité dynastique pharaonique"
 STATIC_MODIFIER_DESC_nd_aeg_dynastic_legitimacy: "Le sultan se situe dans la lignée de Memphis et de Thèbes. Les chroniqueurs de la cour réécrivent la généalogie jusqu'à Ménès."
 STATIC_MODIFIER_NAME_nd_aeg_imperial_centralization: "Centralisation impériale"
 STATIC_MODIFIER_DESC_nd_aeg_imperial_centralization: "Le Caire absorbe les diwans, le système iqta et les gouverneurs provinciaux en un seul tribunal."

 STATIC_MODIFIER_NAME_nd_aeg_azhar_jurisprudence: "Jurisprudence Azhari"
 STATIC_MODIFIER_DESC_nd_aeg_azhar_jurisprudence: "Les quatre écoles de droit sunnites convergent à al-Azhar. Les fatawas du Caire pèsent depuis l’Andalousie jusqu’à Aceh."
 STATIC_MODIFIER_NAME_nd_aeg_azhar_outreach: "Sensibilisation Azhari"
 STATIC_MODIFIER_DESC_nd_aeg_azhar_outreach: "Des étudiants viennent de tous les coins du monde sunnite pour étudier à l’académie. Ils reviennent en tant que missionnaires de l'autorité du Caire."

 STATIC_MODIFIER_NAME_nd_aeg_pilgrim_revenue: "Revenus des caravanes du Hajj"
 STATIC_MODIFIER_DESC_nd_aeg_pilgrim_revenue: "Les pèlerins paient des péages, apportent des marchandises et font du commerce via le Caire. La procession du Mahmal vers la Mecque est une pierre angulaire fiscale."
 STATIC_MODIFIER_NAME_nd_aeg_protector_of_holy_cities: "Protecteur des Deux Villes Saintes"
 STATIC_MODIFIER_DESC_nd_aeg_protector_of_holy_cities: "Le Caire garantit la sécurité de La Mecque et de Médine. Le chérif de La Mecque reconnaît la suzeraineté du sultan."

 STATIC_MODIFIER_NAME_nd_aeg_arsenal_of_cairo: "L'Arsenal du Caire"
 STATIC_MODIFIER_DESC_nd_aeg_arsenal_of_cairo: "Les fonderies de canons de la citadelle fondaient des canons de siège et de l'artillerie de campagne en bronze. Les Mamelouks ne dédaignent plus le nouvel incendie."
 STATIC_MODIFIER_NAME_nd_aeg_mamluk_continuity: "Continuité de la cavalerie mamelouke"
 STATIC_MODIFIER_DESC_nd_aeg_mamluk_continuity: "La lance, l'arc et l'épée conservent leur place. Les esclaves de la citadelle décident toujours du terrain. Le cheval reste le trône de la guerre."

 STATIC_MODIFIER_NAME_nd_aeg_caliphal_authority: "Autorité califale"
 STATIC_MODIFIER_DESC_nd_aeg_caliphal_authority: "Le sultan présente le calife à chaque prière du vendredi. La khutba est lue en son nom dans tout le royaume."
 STATIC_MODIFIER_NAME_nd_aeg_caliphal_diplomacy: "Diplomatie califale"
 STATIC_MODIFIER_DESC_nd_aeg_caliphal_diplomacy: "Les dirigeants sunnites étrangers demandent l'investiture du calife. Les ambassadeurs de Delhi à Grenade s'inclinent devant la cour du Caire."

 STATIC_MODIFIER_NAME_nd_aeg_canal_revenue: "Revenus du canal de Suez"
 STATIC_MODIFIER_DESC_nd_aeg_canal_revenue: "La coupure entre les mers fait de l’Égypte le péage du commerce mondial."
 STATIC_MODIFIER_NAME_nd_aeg_world_crossroads: "Carrefour du monde"
 STATIC_MODIFIER_DESC_nd_aeg_world_crossroads: "Le Caire et Alexandrie deviennent les entrepôts entre l'Europe, l'Afrique et l'océan Indien."

 STATIC_MODIFIER_NAME_nd_aeg_national_renaissance: "Renaissance nationale égyptienne"
 STATIC_MODIFIER_DESC_nd_aeg_national_renaissance: "Les courants pharaoniques, coptes et arabes sont reconnus comme un héritage partagé. La nahda fleurit dans les librairies et les presses du Caire."
 STATIC_MODIFIER_NAME_nd_aeg_khedival_reform: "Réforme du Khédival"
 STATIC_MODIFIER_DESC_nd_aeg_khedival_reform: "Ministères, écoles et réseaux ferroviaires à l’européenne. L’Égypte se modernise sans renoncer à sa souveraineté."

 # ===== FORMATION EVENT =====
 nd_aeg.1.t: "Le Trône des Deux Terres"
 nd_aeg.1.d: "Cairo's banners now fly over Memphis, Damascus, Mecca, Dongola, and Cyrene. The crown of the Two Lands has been placed upon a sultan's head, and the world watches the citadel of Salah ad-Din with both reverence and fear.\n\nThe ulama of al-Azhar speak of caliphal restoration. The amirs of the Bahriyya speak of unbroken Mamluk continuity. The Coptic patriarchs and Muslim merchants of Alexandria speak, more quietly, of an Egypt distinct from any wider umma, a land older than every empire that has ever claimed it.\n\nWhat shall the new Aegyptus be?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_aeg.1.a: "Nous gouvernons en tant que sultans mamelouks, héritiers des pharaons"
 nd_aeg.1.b: "Le Caire sera le siège du Califat"
 nd_aeg.1.c: "Egypte pharaonique, copte et islamique"

 # ===== ADVANCE EVENT 2: Pharaonic Dynastic Claim =====
 nd_aeg.2.t: "La couronne des deux terres"
 nd_aeg.2.d: "Court chroniclers, working in Cairo's libraries, trace the Sultan's lineage backward through the Ayyubids, the Fatimids, the Tulunids, the Roman Augusti, the Ptolemies, and the Saite kings, and still further through the priest-historians of Memphis to the unification of Upper and Lower Egypt under Menes.\n\nThe pharaonic uraeus and the Mamluk turban appear together on coins struck in the citadel. The genealogy is a fiction, but a useful one: it makes the Sultan unique among Muslim rulers, the only one whose line reaches back five thousand years."
 nd_aeg.2.a: "Faire du Sultan une figure sacrée de la dynastie"
 nd_aeg.2.b: "Centraliser les diwans et les gouverneurs de province au Caire"

 # ===== ADVANCE EVENT 3: al-Azhar =====
 nd_aeg.3.t: "La lampe d'Al-Azhar"
 nd_aeg.3.d: "Founded in 970 by the Fatimid general Jawhar al-Siqilli, restored as a Sunni academy by Salah ad-Din, al-Azhar is now the foremost juridical institution of the Sunni world. The four madhhabs each have their iwan; students arrive from West Africa, India, the Caucasus, and Andalusia, and return home as judges, preachers, and missionaries of Cairo's authority.\n\nThe Shaykh al-Azhar is, in practice, the chief jurist of Sunni Islam. His fatwas carry weight where no army can reach."
 nd_aeg.3.a: "Codifier la loi sunnite des iwans d'al-Azhar"
 nd_aeg.3.b: "Envoyer les diplômés d'Azhari à l'étranger comme missionnaires du Caire"

 # ===== ADVANCE EVENT 4: Hajj Custodianship =====
 nd_aeg.4.t: "Serviteur des Deux Saintes Mosquées"
 nd_aeg.4.d: "The mahmal procession leaves Cairo each year, the kiswa folded inside its palanquin: the embroidered black silk that drapes the Kaaba, woven in Egypt and renewed annually. The Sharif of Mecca, descendant of the Prophet, rides out to meet it; he holds his throne by the Sultan's leave.\n\nTo guard the hajj is to guard Islam itself. To bear the title #bold Khadim al-Haramayn ash-Sharifayn#! (Servant of the Two Noble Sanctuaries) is to claim primacy over every Muslim ruler from Andalusia to Aceh."
 nd_aeg.4.a: "Tirez les revenus des caravanes de pèlerins et des péages"
 nd_aeg.4.b: "Prendre le titre Khadim al-Haramayn"

 # ===== ADVANCE EVENT 5: Gunpowder Transition =====
 nd_aeg.5.t: "Les Canons de Bronze de la Citadelle"
 nd_aeg.5.d: "The amirs of the citadel have long despised the firearm: it is the weapon of footmen, unworthy of the slave-aristocracy that fights from horseback with the lance. At Marj Dabiq in 1516, this contempt cost the Mamluks their state.\n\nThis time, history bends. Bronze is cast in the citadel's foundries. Cairo's arsenal pours out artillery for the field and the siege. The argument among the amirs is not whether to adopt the new weapons, but whether the Mamluk way of war must be remade entirely, or whether the cannon can serve the cavalry without replacing it."
 nd_aeg.5.a: "Construisez le nouvel arsenal et le train d'artillerie de campagne"
 nd_aeg.5.b: "Maintenir la cavalerie mamelouke au cœur de la guerre"

 # ===== ADVANCE EVENT 6: Cairo Caliphate =====
 nd_aeg.6.t: "Le Successeur du Prophète, au Caire"
 nd_aeg.6.d: "When Hulagu's Mongols sacked Baghdad in 1258, a fugitive of the Abbasid line was brought to Cairo. The Mamluk sultans hosted this shadow caliphate for two and a half centuries: the Caliph blessed the Sultan's accession, the Sultan kept the Caliph in dignified obscurity. After the Ottomans, the line was meant to end.\n\nIt does not end. Cairo proclaims the Caliph in his own right. The black banners of the Abbasids fly again over the citadel. The khutba in every mosque of Aegyptus invokes him by name."
 nd_aeg.6.a: "Exercez l'autorité spirituelle du calife"
 nd_aeg.6.b: "Utiliser le califat comme outil de diplomatie"

 # ===== ADVANCE EVENT 7: Suez Ambitions =====
 nd_aeg.7.t: "La coupure entre les mers"
 nd_aeg.7.d: "The Pharaohs built canals from the Nile to the Red Sea: Necho II, Darius the Persian, Ptolemy II, Trajan, Amr ibn al-As. The cuts silted up; the dream did not. Egyptian engineers walk the Bitter Lakes again with theodolites and excavation diagrams.\n\nA full canal between the Mediterranean and the Red Sea would shorten the world. Goods that round the Cape would instead pass through Egyptian customs houses. Whoever holds the canal would hold the meeting-point of three continents."
 nd_aeg.7.a: "Facturer des péages sur chaque navire entre les mers"
 nd_aeg.7.b: "Faire du Caire le carrefour du commerce mondial"

 # ===== ADVANCE EVENT 8: Pan-Egyptian Identity =====
 nd_aeg.8.t: "Les trois fils d'Egypte"
 nd_aeg.8.d: "In the printing presses of Bulaq and the lecture halls of al-Azhar, scholars of the nahda articulate a new account of who the Egyptians are. They are the people of Pharaoh: the same hands that built the pyramids still till the Nile valley. They are the people of the Coptic patriarchs, who preserved the Egyptian language in the liturgy of Saint Mark. They are the people of Amr ibn al-As, who brought Arabic and Islam without erasing what was already there.\n\nNot Arab, not African, not Mediterranean, but all of these and uniquely none. The new Aegyptian must learn what the new Aegyptus has always been."
 nd_aeg.8.a: "Lettres de la Renaissance, archéologie, presses"
 nd_aeg.8.b: "Ministères de la modernisation, écoles, usines"

 # ===== ADVANCES =====
 nd_aeg_pharaonic_claim: "Revendication dynastique pharaonique"
 nd_aeg_pharaonic_claim_desc: "Le sultan est intronisé non seulement comme commandant des émirs mamelouks mais aussi comme héritier d'une lignée dynastique tracée à travers les Ptolémées et les rois saïtes jusqu'à l'unification des Deux Terres. Les généalogistes judiciaires fusionnent la légitimité islamique et préislamique."
 nd_aeg_coptic_islamic_synthesis: "Synthèse copte-islamique"
 nd_aeg_coptic_islamic_synthesis_desc: "La population égyptienne musulmane, copte chrétienne et juive est traitée comme une continuité civilisationnelle plutôt que comme un conquérant et un conquis. Les fêtes coptes, les fêtes islamiques et les anciennes saisons agricoles égyptiennes se partagent le calendrier."
 nd_aeg_nile_irrigation: "Ingénierie de l'irrigation du Nil"
 nd_aeg_nile_irrigation_desc: "Shadouf, l'irrigation des bassins et le nettoyage des canaux ont été élevés au rang de science d'État. Le Nilomètre de Roda calibre les impôts en fonction de l'inondation. La famine est un échec politique, pas un acte de Dieu."
 nd_aeg_bedouin_auxiliaries: "Cavalerie auxiliaire bédouine"
 nd_aeg_bedouin_auxiliaries_desc: "Les tribus Banu Sulaym, Banu Hilal et Hejazi fournissent des chevaux légers à l'armée impériale en échange de l'autonomie du désert et des droits de pâturage."
 nd_aeg_citadel_doctrine: "Doctrine de la Citadelle de Saladin"
 nd_aeg_citadel_doctrine_desc: "La forteresse de Mokattam, érigée par Salah ad-Din contre les croisés, devient le modèle d'une doctrine de fortification pour chaque ville égyptienne dominant le quartier urbain, occupée par des Mamelouks, siège du gouverneur."

 nd_aeg_al_azhar_scholarship: "Bourse al-Azhar"
 nd_aeg_al_azhar_scholarship_desc: "L'académie millénaire du Caire devient l'institution juridique suprême du monde sunnite. Les quatre madhhabs, les sciences des hadiths, le kalam et la grammaire arabe sont enseignés à grande échelle à des érudits de tous les quartiers de la Oumma."
 nd_aeg_khan_al_khalili: "Khan al-Khalili"
 nd_aeg_khan_al_khalili_desc: "Le vaste quartier du bazar du Caire, fondé sous le sultan Barquq en 1382 et en constante expansion. Les marchands d'épices, les orfèvres, les parfumeurs et les tisserands de soie occupent les wikalat et qaysariyyat regroupés autour de la mosquée Hussein."
 nd_aeg_mamluk_lancer: "La renaissance du Lancier mamelouk"
 nd_aeg_mamluk_lancer_desc: "L’aristocratie esclavagiste est rétablie en tant que bras d’élite. La lance, l'arc composite et le saif sont maîtrisés dans le maydan ; les traités furusiyya sont étudiés comme une doctrine vivante."
 nd_aeg_damascus_silk: "Axe de la soie de Damas"
 nd_aeg_damascus_silk_desc: "Damas et Alep, attirées par l'État égyptien, fournissent des tissus de soie et de damas qui transitent par le Caire jusqu'à la Méditerranée. La capitale intérieure du Levant est un deuxième pôle de commerce impérial."
 nd_aeg_hajj_custodianship: "Garde du Hajj"
 nd_aeg_hajj_custodianship_desc: "Le Sultan, en tant que Serviteur des Deux Saintes Mosquées, organise et protège la caravane annuelle du Mahmal. La sécurité des pèlerins devient un monopole d’État ; la kiswa de la Kaaba est tissée en Egypte."
 nd_aeg_mamluk_maydan: "Mamelouk Maydan"
 nd_aeg_mamluk_maydan_desc: "Les terrains d'entraînement ouverts où les Mamelouks pratiquent l'équitation, le tir à l'arc, l'escrime et les charges de lance selon les manuels furusiyya. Les rituels de l'aristocratie militaire se sont renforcés à l'époque de la Renaissance."

 nd_aeg_pharaonic_monumentalism: "Architecture monumentale pharaonique"
 nd_aeg_pharaonic_monumentalism_desc: "Travaux publics à l'échelle du Nouvel Empire : mosquées colossales, horloges à eau, grandes portes, avenues axiales. Le sultan en tant que pharaon laisse des témoignages de pierre dans toutes les grandes villes."
 nd_aeg_red_sea_trade: "Commerce des pèlerins de la mer Rouge"
 nd_aeg_red_sea_trade_desc: "La route de Suez à Djeddah, et au-delà jusqu'à l'océan Indien, dominée par les marchands égyptiens et yéménites. Les épices, le café et les textiles passent par les douanes du Caire en route vers Alexandrie."
 nd_aeg_nubian_gold: "Or nubien"
 nd_aeg_nubian_gold_desc: "Les champs aurifères de Dongola et les routes de transbordement sahariennes acheminent les lingots via Assouan vers les monnaies du Caire. Le dirham d'Égyptus circule de Gênes à Calicut."
 nd_aeg_coptic_monasticism: "Continuité monastique copte"
 nd_aeg_coptic_monasticism_desc: "Les monastères du désert de Wadi Natrun, Sainte-Catherine et Saint-Antoine préservent les traditions manuscrites, l'apprentissage agricole et l'alphabétisation copte. Intégré au système de bibliothèque impériale."
 nd_aeg_bahriyya_marines: "Marines de Bahriyya"
 nd_aeg_bahriyya_marines_desc: "Les premiers Mamelouks Bahri tirent leur nom de la caserne du Nil sur l'île de Roda. La doctrine revient sous forme de flottes d'infanterie fluviale et amphibie du Nil, de galères de la mer Rouge, de patrouilles côtières méditerranéennes."

 nd_aeg_gunpowder_transition: "Transition de poudre à canon"
 nd_aeg_gunpowder_transition_desc: "La réticence historique des Mamelouks à adopter l’artillerie est surmontée. Les fonderies du Caire fondaient des canons en bronze ; des trains d'artillerie de campagne accompagnent l'armée impériale ; les sièges sont menés avec des batteries de réduction au lieu de longs blocus."
 nd_aeg_cairo_caliphate: "Le califat du Caire restauré"
 nd_aeg_cairo_caliphate_desc: "La lignée abbasside préservée au Caire depuis 1261 est élevée du statut d'ombre honoraire à celui de calife en exercice. Le Sultan devient Protecteur ; le calife confère la légitimité ; ensemble, ils parlent pour l’islam sunnite."
 nd_aeg_cyrenaica_frontier: "Frontière de la Cyrénaïque"
 nd_aeg_cyrenaica_frontier_desc: "Le littoral libyen de Benghazi à Ajdabiya, longtemps frontière entre l'Égypte et le Maghreb, est administré par des caravanes fortifiées et des pactes tribaux avec les confréries de style Sanusi."
 nd_aeg_sultan_pharaoh_dynasty: "Dynastie Sultan-Pharaon"
 nd_aeg_sultan_pharaoh_dynasty_desc: "Le principe mamelouk de l’élévation du statut d’esclave-soldat se confond avec la revendication dynastique héréditaire. La dynastie tient parce que la citadelle et le sacerdoce reconnaissent le même dirigeant."
 nd_aeg_burji_guard: "Garde Impériale Burji"
 nd_aeg_burji_guard_desc: "Les troupes circassiennes de la citadelle de Burjiyya, du nom des tours (burj) où elles étaient cantonnées, deviennent le noyau d'infanterie discipliné de l'armée impériale."

 nd_aeg_pharaonic_administration: "Administration Civile Pharaonique"
 nd_aeg_pharaonic_administration_desc: "La bureaucratie diwanienne, les commis coptes et les bureaux d'archives de style hellénistique ont fusionné en une administration globale. Les kashifs répondent au Caire ; Le Caire répond au Sultan-Pharaon."
 nd_aeg_modernized_cavalry: "Cavalerie mamelouke modernisée"
 nd_aeg_modernized_cavalry_desc: "L'aristocratie esclavagiste s'adapte : pistolets à cheval, tactiques de dragons, armes combinées avec l'artillerie. La lance et l'arc ne disparaissent pas, mais ils partagent la selle avec la carabine."
 nd_aeg_nile_state_irrigation: "Irrigation de l'État du Nil"
 nd_aeg_nile_state_irrigation_desc: "Le travail de Corve, mobilisé par les pharaons-sultans d’autrefois, est à nouveau mobilisé sous le régime absolutiste. Des canaux sont dragués, des barrages sont érigés et l'agriculture de bassin s'étend jusqu'en Haute-Égypte et en Nubie."
 nd_aeg_coptic_bureaucracy: "Classe bureaucratique copte"
 nd_aeg_coptic_bureaucracy_desc: "Le diwan al-mal et les bureaux des recettes sont dominés par des familles chrétiennes coptes instruites, multilingues et dépendantes du sultan plutôt que des oulémas. Un contrepoids à la citadelle comme à la mosquée."
 nd_aeg_imperial_cairo: "Le Caire Impérial"
 nd_aeg_imperial_cairo_desc: "Al-Qahira, la Victorieuse, devient la métropole des trois continents. La population approche le million. Les ambassades de toutes les puissances sunnites et chrétiennes envahissent le quartier de la Citadelle."

 nd_aeg_suez_ambitions: "Les ambitions de Suez"
 nd_aeg_suez_ambitions_desc: "Le rêve pharaonique de couper entre les mers renaît. Les ingénieurs étudient le tracé, les lacs Bitter sont creusés et le canal de Port-Saïd à Suez est ouvert. Il appartient à l'Égypte, est administré par l'Égypte et est financé par un péage égyptien."
 nd_aeg_khedival_modernization: "Modernisation du Khédival"
 nd_aeg_khedival_modernization_desc: "Les ministères de style européen, les armées de conscrits, les écoles normales et les chemins de fer ont tous été entrepris sans renoncer à leur souveraineté. Le Caire apprend de Paris et d’Istanbul sans pour autant être soumis à l’un ou l’autre."
 nd_aeg_industrial_spring: "Printemps industriel égyptien"
 nd_aeg_industrial_spring_desc: "Filatures de coton du delta du Nil, arsenaux du Caire, raffineries de sucre à Minya et chantiers navals d'Alexandrie. L'industrie égyptienne commence à alimenter les armées égyptiennes et les marchés égyptiens."
 nd_aeg_pan_egyptian_identity: "Identité panégyptienne"
 nd_aeg_pan_egyptian_identity_desc: "L’héritage pharaonique, copte et arabe articulé comme un seul héritage national. L’Égyptien n’est ni simplement arabe, ni simplement africain, ni simplement méditerranéen. L’Égypte est sa propre civilisation, plus ancienne et plus grande que n’importe quel successeur."

 # ===== UNITS =====
 a_nd_aeg_bedouin_horse: "Auxiliaire bédouin"
 a_nd_aeg_bedouin_horse_desc: "Cheval léger tiré des tribus Banu Sulaym, Banu Hilal et Hejazi. Raiders et éclaireurs rapides ; légèrement blindé, immunisé contre l'attrition du désert."
 a_nd_aeg_bedouin_horse_levy: "Auxiliaire bédouin"
 a_nd_aeg_bedouin_horse_levy_desc: "Des levées de cavalerie tribale levées auprès des nobles frontaliers du désert."
 a_nd_aeg_mamluk_lancer: "Lancier mamelouk"
 a_nd_aeg_mamluk_lancer_desc: "L'aristocratie esclavagiste de la citadelle : cavalerie blindée entraînée dès l'enfance à la lance, à l'arc composite et au saif. Le bras de choc de l'armée impériale."
 a_nd_aeg_mamluk_lancer_levy: "Lancier mamelouk"
 a_nd_aeg_mamluk_lancer_levy_desc: "Cavalerie de famille mamelouke des émirs, élevée grâce au système de prélèvement de l'aristocratie esclave."
 a_nd_aeg_bahriyya: "Marines de Bahriyya"
 a_nd_aeg_bahriyya_desc: "Infanterie fluviale et amphibie cantonnée dans la caserne du Nil. Formé pour traverser l'eau, monter à bord des navires et déborder de la rivière."
 a_nd_aeg_bahriyya_levy: "Marines de Bahriyya"
 a_nd_aeg_bahriyya_levy_desc: "Infanterie fluviale issue de la population de la flotte du Nil."
 a_nd_aeg_burji_guard: "Garde Impériale Burji"
 a_nd_aeg_burji_guard_desc: "Troupes circassiennes de la citadelle de Burjiyya, du nom des tours où elles étaient cantonnées. Lourdement blindé, discipliné, l'épine dorsale défensive de l'armée impériale."
 a_nd_aeg_burji_guard_levy: "Garde Impériale Burji"
 a_nd_aeg_burji_guard_levy_desc: "Troupes de garnison de la Citadelle levées du domaine des soldats."
 a_nd_aeg_khedival_nizam: "Khédival Nizam"
 a_nd_aeg_khedival_nizam_desc: "Infanterie de ligne entraînée en Europe de la réforme Khedival en uniforme, enrôlée, équipée de mousquets rayés. La nouvelle manière égyptienne de faire la guerre."

 # ===== LEVIES =====
 levy_nd_aeg_bedouin_horse: "Prélèvement auxiliaire bédouin"
 levy_nd_aeg_mamluk_lancer: "Prélèvement des Lanciers Mamelouks"
 levy_nd_aeg_bahriyya: "Prélèvement maritime de Bahriyya"
 levy_nd_aeg_burji_guard: "Prélèvement de la garde Burji"

 # ===== BUILDINGS =====
 nd_aeg_citadel_of_saladin: "Citadelle de Saladin"
 nd_aeg_citadel_of_saladin_desc: "La forteresse sur la crête de Mokattam, érigée par Salah ad-Din contre les croisés. Garnison par la Burjiyya et siège du sultan-pharaon, elle surplombe le Caire comme palais et arsenal."
 nd_aeg_shaduf_network: "Réseau Nil Shadouf"
 nd_aeg_shaduf_network_desc: "Systèmes d'irrigation à levier et contrepoids, canaux de bassin et entretien des digues. Le Nilomètre régit la saison des impôts ; la corve entretient les canaux ; la récolte nourrit trois continents."
 nd_aeg_al_azhar: "al-Azhar"
 nd_aeg_al_azhar_desc: "Académie suprême de droit sunnite, fondée en 970 au Caire. Les quatre madhhabs ont chacune leur iwan ; les étudiants arrivent de tous les coins de la Oumma ; Les fatwas azhari pèsent depuis l’Andalousie jusqu’à Aceh."
 nd_aeg_khalili_bazaar: "Bazar Khan al-Khalili"
 nd_aeg_khalili_bazaar_desc: "Le vaste quartier du bazar du Caire. Les marchands d'épices, les orfèvres, les parfumeurs, les tisserands de soie, les cafés et les caravanes de pèlerins se regroupent autour de la mosquée Hussein."
 nd_aeg_maydan: "Mamelouk Maydan"
 nd_aeg_maydan_desc: "Le terrain d'entraînement ouvert où les Mamelouks pratiquent l'équitation, le tir à l'arc, l'escrime et les charges de lance selon les manuels furusiyya. La forge de l'aristocratie esclavagiste."
 nd_aeg_pharaonic_monument: "Monument pharaonique"
 nd_aeg_pharaonic_monument_desc: "Architecture colossale à la mode du Nouvel Empire : grandes mosquées, avenues axiales, horloges à eau, portes flanquées de sphinx. Le Sultan en tant que Pharaon écrit son nom sur la pierre de ses villes."
 nd_aeg_coptic_monastery: "Monastère copte"
 nd_aeg_coptic_monastery_desc: "Ermitages du désert et fondations fortifiées de l'église copte orthodoxe Wadi Natrun, Saint-Antoine, Sainte-Catherine. Préserver les manuscrits, l’apprentissage agricole et l’alphabétisation copte sous le patronage impérial."
 nd_aeg_cairo_arsenal: "Arsenal du Caire"
 nd_aeg_cairo_arsenal_desc: "Fonderies de canons en bronze de la citadelle. Les mosquées impériales deviennent des terrains d'essai d'artillerie ; les maîtres fondateurs du Caire sont les rivaux d'Istanbul et de Venise."
 nd_aeg_nubian_mint: "Menthe de Nubie"
 nd_aeg_nubian_mint_desc: "Le complexe monétaire d'Assouan qui transforme l'or Dongola et les lingots sahariens en dirhams et dinars d'Égypte. Met en circulation le nom du Sultan-Pharaon de Gênes à Calicut."

 # ===== DESTINY ADVANCES =====
 nd_aeg_destiny: "Destin d'Égyptus"
 nd_aeg_destiny_desc: "La couronne des Deux Terres a été posée. La voie s'ouvre désormais, que l'empire s'étende vers l'extérieur par la conquête, ou vers l'intérieur en tant que civilisation qui n'a pas besoin de bouger pour se faire sentir."
 nd_aeg_dest_maghreb_reach: "Portée maghrébine"
 nd_aeg_dest_maghreb_reach_desc: "Push west of Cyrenaica into the Ifriqiyan littoral. Take Tripoli and Kairouan (the old Aghlabid and Hafsid heartland) and place Aegyptian governors on the African coast that no Mamluk ever held. Requires Tripoli, Kairouan and half of the Tripoli area."
 nd_aeg_dest_mesopotamian_push: "Poussée mésopotamienne vers l’est"
 nd_aeg_dest_mesopotamian_push_desc: "Cross the Syrian desert and seize Baghdad and Mosul, the cities the Mongols broke. The Tigris valley becomes an Aegyptian province; the City of Peace, an Aegyptian garrison. Requires Mosul, Baghdad held and rebuilt to development 27, and half of Arab Iraq."
 nd_aeg_dest_pharaonic_empire: "Empire pharaonique des trois continents"
 nd_aeg_dest_pharaonic_empire_desc: "Push south past Nubia into the Ethiopian highlands and the Horn frontier. Gondar and Harar fall under the Pharaonic crown, and the ports of Massawa and Zeila with them. Requires Gondar, Harar, Massawa, Zeila, half of the central Ethiopian highlands, and prestige 75. Unlocks the Pharaonic Obelisk."
 nd_aeg_dest_cairo_culture: "Le Caire, capitale culturelle"
 nd_aeg_dest_cairo_culture_desc: "The presses of Bulaq, the libraries of the citadel, the lecture halls of al-Azhar. Cairo becomes the city where knowledge is made, copied, and exported. Requires the Printing Press, Cairo at development 40, and 1000 gold."
 nd_aeg_dest_azhar_world: "al-Azhar comme Académie mondiale"
 nd_aeg_dest_azhar_world_desc: "Cairo emerges as the intellectual center of the Sunni world, the city that took Baghdad's place. Requires Cairo at development 48, silk in the capital market, and prestige 50."
 nd_aeg_dest_suez_canal: "La coupure du canal de Suez"
 nd_aeg_dest_suez_canal_desc: "The Pharaonic dream of cutting between the seas, completed at last, as the answer to the sea road round Africa. Aegyptian engineers, Aegyptian capital, Aegyptian tolls. Requires the New World institution, Suez built up to development 42, 3000 gold, and prestige 75. Unlocks the Suez Canal."

 # ===== DESTINY EVENTS =====
 nd_aeg.9.t: "Le chemin du destin"
 nd_aeg.9.d: "The crown rests. The choice is made. The amirs of the citadel and the ulama of al-Azhar have spoken; the merchants of Khan al-Khalili and the Coptic patriarchs have offered their counsel. Whatever Aegyptus is to become, the road now opens before it.\n\nIn the chronicles of Cairo, this is the year that ends one history and begins another."
 nd_aeg.9.a: "En avant donc vers notre destin"
 nd_aeg.10.t: "Bannières sur Kairouan"
 nd_aeg.10.d: "La cavalerie égyptienne franchit les dunes à l'ouest de Syrte et pénètre dans la plaine d'Ifriqiyan. Les portes de Tripoli s'ouvrent sans siège ; la garnison hafside de Kairouan négocie la reddition dans un délai d'une semaine. La mosquée mahdiste, le ribat aghlabide et les grandes citernes omeyyades répondent désormais au Caire. Le Maghreb n’a pas connu de domination égyptienne depuis les Fatimides."
 nd_aeg.10.a: "L'Occident est à nous"
 nd_aeg.11.t: "Bagdad, Ville de Paix"
 nd_aeg.11.d: "Les colonnes égyptiennes franchissent le Tigre et acceptent la reddition de Bagdad, la ville détruite par Hulagu, ville que les Jalayirids, Aq Qoyunlu et les Safavides tenaient tour à tour. Les bannières noires des Abbassides flottent à nouveau sur les murs ronds. Mossoul tombe une saison plus tard. Les émirs du Caire débattent de ce qu'il faut faire du cœur de la Mésopotamie : le restaurer comme siège de la légitimité, ou le conserver comme frontière dure ?"
 nd_aeg.11.a: "Restaurer Bagdad comme deuxième siège impérial"
 nd_aeg.11.b: "Considérez la Mésopotamie comme une marche orientale militarisée"
 nd_aeg.12.t: "Un empire de trois continents"
 nd_aeg.12.d: "Les troupes égyptiennes franchissent l’escarpement éthiopien. L'empereur Salomonide de Gondar accepte la vassalité ; Les murs Adali de Harar tombent. Le territoire du Caire s'étend désormais sur l'Afrique du Maghreb à la Corne, l'Asie du Levant au Tigre et les mers intermédiaires. Les astrologues de la cour estiment qu’aucun pouvoir depuis Rome n’a détenu une telle part du monde. Les émirs demandent : est-ce un empire pharaonique de pierre, ou une monarchie universelle de légitimité ?"
 nd_aeg.12.a: "Élevez des obélisques sur trois continents"
 nd_aeg.12.b: "Projetez le Pharaon-Sultan comme monarque universel"
 nd_aeg.13.t: "Les Presses de Boulaq"
 nd_aeg.13.d: "Le Caire n'est plus seulement le siège des armées et la citadelle des pharaons, c'est la ville où l'on fabrique des livres. Les presses Bulaq fonctionnent jour et nuit ; aux copistes des grandes bibliothèques s'ajoutent des compositeurs arabes capables de produire un Coran en une semaine. Les monastères coptes, les iwans d'al-Azhar et l'école de médecine de Mansoura attirent tous des érudits de tous les quartiers de la Oumma."
 nd_aeg.13.a: "Le Caire écrit les livres que le monde lira"
 nd_aeg.14.t: "Le Caire dépasse Bagdad"
 nd_aeg.14.d: "Pendant cinq siècles, le savoir sunnite s'est mesuré à la gloire perdue de Bagdad, la Maison de la Sagesse, le mouvement de traduction, la grande chaîne des califes et des vizirs. Avec la conquête égyptienne, la richesse égyptienne et le patronage égyptien, ce fantôme est enfin mis au repos. Le Cheikh al-Azhar est désormais, de fait et de nom, le principal juriste de l’islam sunnite. Les émirs demandent : al-Azhar doit-il être un siège d'apprentissage ou le successeur de la pleine autorité civilisationnelle de Bagdad ?"
 nd_aeg.14.a: "al-Azhar, siège mondial du savoir"
 nd_aeg.14.b: "Le Caire comme nouvelle civilisation de Bagdad elle-même"
 nd_aeg.15.t: "Les deux mers réunies"
 nd_aeg.15.d: "After eight years of corvée labor, dredging, and stone-cutting, the cut between the seas is open. The first ship (an Aegyptian galley flying the Pharaoh-Sultan's banner) sails from Suez to Port Said in a single voyage. Trade that once rounded Africa now passes through Aegyptian customs houses; the world's commerce flows across Aegyptian land.\n\nThe amirs ask: is the canal a fiscal mechanism (tolls and taxes) or a civilizational achievement (Cairo and Alexandria as the entrepots of all peoples)?"
 nd_aeg.15.a: "Le monde paie son tribut à Égyptus"
 nd_aeg.15.b: "Le Caire, point de rencontre de tous les peuples"

 # ===== DESTINY TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_aeg_dest_baghdad_restored: "Bagdad restauré"
 STATIC_MODIFIER_DESC_nd_aeg_dest_baghdad_restored: "La Ville de la Paix arbore les bannières du Caire. Le calife bénit les armes égyptiennes ; les diwans de Mésopotamie répondent aux kashifs égyptiens."
 STATIC_MODIFIER_NAME_nd_aeg_dest_eastern_marches: "Les marches de l'Est"
 STATIC_MODIFIER_DESC_nd_aeg_dest_eastern_marches: "La Mésopotamie constituait une frontière dure avec des caravanes fortifiées, des garnisons mobiles et des pactes tribaux. Les déserts érodent le soldat autant que l’ennemi."
 STATIC_MODIFIER_NAME_nd_aeg_dest_three_continents: "Empire des Trois Continents"
 STATIC_MODIFIER_DESC_nd_aeg_dest_three_continents: "La puissance égyptienne s'est projetée du Maghreb à la Corne jusqu'à la Mésopotamie. Les prélèvements sont levés sur tous les continents ; l’épuisement de la guerre est supporté par une base plus large."
 STATIC_MODIFIER_NAME_nd_aeg_dest_universal_pharaoh: "Le Pharaon Universel"
 STATIC_MODIFIER_DESC_nd_aeg_dest_universal_pharaoh: "Les diplomates du Caire servent dans tous les tribunaux ; les nouvelles provinces s'intègrent rapidement; le rôle impérial est rempli. Mais nourrir une cour universelle met à rude épreuve les récoltes du Nil."
 STATIC_MODIFIER_NAME_nd_aeg_dest_seat_of_learning: "Siège d'apprentissage"
 STATIC_MODIFIER_DESC_nd_aeg_dest_seat_of_learning: "Les érudits s’élèvent plus vite, le rayonnement culturel s’étend vers l’extérieur, les terres dévastées se reconstruisent plus rapidement sous le patronage du Caire."
 STATIC_MODIFIER_NAME_nd_aeg_dest_cairo_baghdad: "Le nouveau Bagdad"
 STATIC_MODIFIER_DESC_nd_aeg_dest_cairo_baghdad: "Le Caire revendique le titre civilisationnel perdu par Bagdad. Les domaines acceptent la direction du Caire ; l’autorité religieuse rayonne d’al-Azhar. Le mécénat à cette échelle coûte cher."
 STATIC_MODIFIER_NAME_nd_aeg_dest_world_tollkeeper: "Gardien du péage du monde"
 STATIC_MODIFIER_DESC_nd_aeg_dest_world_tollkeeper: "Every ship between the seas pays Aegyptian tolls. The customs houses may set their tariffs higher; gold flows in monthly."
 STATIC_MODIFIER_NAME_nd_aeg_dest_meeting_of_seas: "Rencontre des mers"
 STATIC_MODIFIER_DESC_nd_aeg_dest_meeting_of_seas: "Le Caire et Alexandrie deviennent les entrepôts de trois continents. Les marins et les migrants affluent ; les chantiers navals fonctionnent à pleine capacité ; Les flottes égyptiennes ont un moral élevé."

 # ===== DESTINY BUILDINGS =====
 nd_aeg_pharaonic_obelisk: "Obélisque pharaonique"
 nd_aeg_pharaonic_obelisk_desc: "D'imposantes stèles de granit, érigées dans les villes conquises par des maçons égyptiens à l'époque du Nouvel Empire. Le cartouche hiéroglyphique du Sultan-Pharaon marque la limite de sa portée. Tripoli, Bagdad, Gondar, chaque ville une stèle, chaque stèle une revendication."
 nd_aeg_suez_canal: "Le canal de Suez"
 nd_aeg_suez_canal_desc: "La coupure entre les mers, achevée sous les ingénieurs égyptiens et la capitale égyptienne. La Méditerranée et la Mer Rouge se sont jointes ; le commerce mondial passe par les coutumes égyptiennes ; Le Caire perçoit des péages sur une centaine de drapeaux."

 # ===== DESTINY BUILDING MAINTENANCE PMs =====
 nd_aeg_obelisk_maintenance: "Obélisque en pierre"
 nd_aeg_obelisk_maintenance_desc: "Granit extrait d'une carrière à Assouan, transporté par barge du Nil, taillé et habillé par des maçons égyptiens à la manière du Nouvel Empire."
 nd_aeg_suez_canal_maintenance: "Entretien des canaux"
 nd_aeg_suez_canal_maintenance_desc: "Les lacs Bitter s'envasent continuellement ; dragueurs, maçons et éclusiers maintiennent la coupure entre les mers."

 # ===== BUREAUCRACIES =====
 # Slot grant on formation
 AUTO_MODIFIER_NAME_nd_aeg_bureaucracy_authority: "Diwan du Sultan-Pharaon"
 AUTO_MODIFIER_DESC_nd_aeg_bureaucracy_authority: "On formation, Aegyptus inherits the institutional apparatus of the Mamluk-Pharaonic state and may host historical Aegyptian bureaucracies."

 # 1. Iqta-Halqa System
 aeg_iqta_halqa_bureaucracy: "Iqta wa-Halqa"
 aeg_iqta_halqa_bureaucracy_desc: "Standardisée par Baybars et Qalawun à la fin du XIIIe siècle, l'iqta liait le rang d'un émir au montant de ses impôts ; Sous les régiments mamelouks, l'ajnad al-halqa enrôla une cavalerie égyptienne et affranchie sous le commandement direct du sultan. Ensemble, les deux registres ont géré chaque campagne depuis Ayn Jalut jusqu'à la frontière du Hedjaz."

 # 2. Diwan al-Mal
 aeg_diwan_al_mal_bureaucracy: "Diwan al-Khass"
 aeg_diwan_al_mal_bureaucracy_desc: "The Sultan's privy purse. Al-Nasir Muhammad created its controller, the nazir al-khass, in 1310, and twice let the vizierate lapse beside it. It took the customs of Alexandria and the Sultan's own trading, and its controller became the first financial officer of the realm. The men who ran it came from the Coptic secretarial families that had kept Egypt's books since the Fatimids: Karim al-Din al-Kabir first, then the hated al-Nashw. Whenever popular pressure drove such men out, the purse called them back. No one else could keep the books."

 # 3. Mashyakhat al-Azhar
 aeg_mashyakhat_azhar_bureaucracy: "Mashyakhat al-Azhar"
 aeg_mashyakhat_azhar_bureaucracy_desc: "Fondé par les Fatimides en 970 et converti à l'enseignement sunnite après la prise de pouvoir de Saladin en 1171, al-Azhar est devenu l'institution suprême de la jurisprudence sunnite après la chute de Bagdad aux mains des Mongols en 1258. Le Hay'at Kibar al-Ulama a rassemblé d'éminents juristes des quatre madhhabs et a émis des fatwas contraignantes du Maroc à l'Indonésie ; le Cheikh d'al-Azhar était la plus haute fonction religieuse du royaume."

 # 4. Khidmat al-Haramayn
 aeg_khidmat_haramayn_bureaucracy: "Khidmat al-Haramayn"
 aeg_khidmat_haramayn_bureaucracy_desc: "From the mid-fourteenth century the Mamluk sultans claimed the title Khadim al-Haramayn al-Sharifayn (Servant of the Two Noble Sanctuaries). The mahmal, an ornate ceremonial litter dispatched annually with the Egyptian pilgrim caravan, asserted Cairo's sovereignty over the Hejaz road. Sultan al-Ashraf Barsbay used the custodianship to legitimize a foreign-born military caste against rival Muslim claims."

 # 5. Karimi Tujjar al-Khan
 aeg_karimi_tujjar_bureaucracy: "Karimi Tujjar al-Khan"
 aeg_karimi_tujjar_bureaucracy_desc: "Les Karimi étaient les grands marchands d'épices et de produits de luxe de l'Égypte médiévale, attestés dès le Xe siècle fatimide et consolidés en société commerciale au XIIIe, avec des membres musulmans, juifs et coptes. Khan al-Khalili, fondé en 1382 par l'émir Jaharkas al-Khalili, devint leur quartier général ; au début du XVIe siècle, le district comptait vingt et un khans et wikalas à usage commercial actif."
