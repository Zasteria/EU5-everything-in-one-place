l_french:

 # Game Rule
 rule_nd_mandate_crisis_rule: "Crise du mandat"
 setting_nd_mandate_crisis_enabled: "Activé"
 setting_nd_mandate_crisis_enabled_desc: "L’empereur de Chine pourrait être confronté à une crise de mandat lorsque[celestial_authority_gc|e]tomberait trop bas, fragmentant potentiellement l’empire en États en guerre. Cette crise peut survenir plusieurs fois au cours du jeu."
 setting_nd_mandate_crisis_disabled: "Désactivé"
 setting_nd_mandate_crisis_disabled_desc: "La situation de crise de mandat est désactivée. La Chine unifiée ne sera pas confrontée à des événements de fragmentation du cycle dynastique."

 # Situation
 nd_mandate_crisis: "Crise du mandat"
 nd_mandate_crisis_desc: "Le Mandat du Ciel vacille. L'emprise de la dynastie sur le royaume s'affaiblit à mesure que le mécontentement se propage dans les provinces. Sans une action décisive, l’empire pourrait se diviser en États belligérants, chacun revendiquant le droit de gouverner."

 # Situation Panel
 nd_mc_resolved_end_tt: "La crise du mandat a été résolue par la réforme, la reconquête ou la montée d'une nouvelle dynastie."
 nd_mc_cooldown_tt: "Le royaume n’a que récemment surmonté une crise de mandat et ne peut pas encore en affronter une autre."
 nd_mc_hard_timer_tt: "This occurrence of the Mandate Crisis has not yet run its 50-year course"
 nd_mc_phase_header: "Phase de crise"
 nd_mc_provinces_header: "États séparatistes"
 nd_mc_panel_paths_header: "Le cycle dynastique"
 nd_mc_panel_paths_body: "The crisis unfolds in two phases.\n\n#T Phase 1, Unrest:#! Corruption, factionalism and provincial discontent grip the court. The Emperor may still reform the realm and renew the Mandate before it is too late.\n\n#T Phase 2, Fragmentation:#! If [celestial_authority_gc|e] keeps falling, provinces break away under rebel warlords, each pressing its own claim to the Mandate.\n\nThe crisis resolves one of three ways: the dynasty #T reforms#! and endures, the Emperor #T reconquers#! the breakaway states by force, or a #T challenger#! seizes the realm and founds a new dynasty."

 # International Organization
 nd_mandate_challengers: "Challengers de mandat"
 nd_mandate_challengers_desc: "Ceux qui contestent le droit de la dynastie régnante à diriger l’Empire du Milieu."

 # Static Modifiers
 STATIC_MODIFIER_NAME_nd_mandate_crisis_unrest: "Crise du mandat : troubles"
 STATIC_MODIFIER_DESC_nd_mandate_crisis_unrest: "Les troubles croissants menacent la stabilité de la dynastie."
 STATIC_MODIFIER_NAME_nd_mandate_crisis_fragmentation: "Crise du mandat : fragmentation"
 STATIC_MODIFIER_DESC_nd_mandate_crisis_fragmentation: "L’empire se fracture. Les chefs de guerre se lèvent dans les provinces."
 STATIC_MODIFIER_NAME_nd_mandate_crisis_reformed: "Dynastie réformée"
 STATIC_MODIFIER_DESC_nd_mandate_crisis_reformed: "La dynastie a surmonté la crise interne grâce à des réformes décisives."
 STATIC_MODIFIER_NAME_nd_mandate_crisis_reconquest: "Mandat réaffirmé"
 STATIC_MODIFIER_DESC_nd_mandate_crisis_reconquest: "La dynastie a écrasé tous ses adversaires et a réaffirmé son mandat de gouverner."
 STATIC_MODIFIER_NAME_nd_mandate_crisis_new_dynasty: "Nouvelle Dynastie"
 STATIC_MODIFIER_DESC_nd_mandate_crisis_new_dynasty: "Une nouvelle dynastie a revendiqué le Mandat du Ciel et rétabli l'ordre dans le royaume."

 # Legend Keys
 nd_mc_legend_emperor: "Empereur"
 nd_mc_legend_challenger: "Le challenger le plus fort"
 nd_mc_legend_loyalist: "Loyaliste"
 nd_mc_legend_rebel: "Rebelle"
 nd_mc_legend_neutral: "Neutre"

 # Tooltips
 nd_mc_emperor_tt: "Territoire de l'Empereur"
 nd_mc_challenger_tt: "Territoire du plus grand challenger du Mandat"
 nd_mc_loyalist_tt: "Territoire d'un chef de guerre fidèle à l'empereur"
 nd_mc_rebel_tt: "Territoire d'un chef de guerre en rébellion contre l'Empereur"
 nd_mc_neutral_tt: "Territoire d'un chef de guerre non engagé"
 nd_mc_claimed_mandate_tt: "We have claimed the Mandate of Heaven"
 nd_mc_phase_2_starts_tt: "La crise s'est aggravée. Les provinces échappent au contrôle impérial."
 nd_mc_release_country_tt: "Un nouveau chef de guerre s'élève dans les provinces, s'emparant du territoire de l'Empereur."
 nd_mc_release_culture_country_tt: "Les dirigeants provinciaux déclarent leur indépendance et créent un nouvel État."
 nd_mc_lose_characters_tt: "Les fonctionnaires et généraux les plus compétents rejoignent le nouveau régime."
 nd_mc_has_already_enacted_tt: "Nous avons déjà mis en œuvre cette réforme pendant la crise actuelle."
 nd_mc_emperor_allegiance: "Allégeance"

 # Event: The Heavens Grow Dark (on_start, emperor)
 nd_mandate_crisis.1.title: "Les cieux s'assombrissent"
 nd_mandate_crisis.1.desc: "Omens speak of the dynasty's decline. Tax revenues dwindle as provincial governors hoard resources. The frontier garrisons send desperate pleas for reinforcement, while peasant agitators spread whispers of a new age. The Mandate of Heaven, it seems, is no longer certain.\n\nUnless we act decisively, the empire itself may unravel."
 nd_mandate_crisis.1.a: "Nous devons maintenir la cohésion du royaume."

 # Event: Whispers of Unrest (on_start, neighbors)
 nd_mandate_crisis.2.title: "Murmures d'agitation"
 nd_mandate_crisis.2.desc: "Reports from the Middle Kingdom speak of growing disorder. The Emperor's authority wanes in the provinces, and ambitious men eye the throne. If the dynasty falls, a period of chaos will follow, and with chaos comes opportunity."
 nd_mandate_crisis.2.a: "Nous suivrons de près l’évolution de la situation."

 # Event: The Dynasty Endures (resolution, reform)
 nd_mandate_crisis.3.title: "La dynastie perdure"
 nd_mandate_crisis.3.desc: "Through careful reform and steady governance, the crisis has been averted. The bureaucracy has been purged of corruption, the frontier secured, and the people's grievances addressed. The Mandate of Heaven remains with our house, for now.\n\nHistory teaches that no dynasty rules forever. But today, we have earned another generation of peace."
 nd_mandate_crisis.3.a: "Que cela reste une période de renouveau."

 # Event: The Mandate Renewed (resolution, reconquest)
 nd_mandate_crisis.4.title: "Le mandat renouvelé"
 nd_mandate_crisis.4.desc: "The rebels have been crushed, the warlords scattered. Through force of arms, we have reunified the realm and proven that the Mandate of Heaven was never truly lost. The provinces bow once more to our authority.\n\nLet the histories record that this dynasty was tested in the fires of rebellion and emerged stronger."
 nd_mandate_crisis.4.a: "Le royaume est à nouveau entier."

 # Event: A New Dynasty Rises (resolution, new dynasty)
 nd_mandate_crisis.5.title: "Une nouvelle dynastie se lève"
 nd_mandate_crisis.5.desc: "The old order has fallen. Where once a single dynasty commanded the obedience of all under Heaven, now a new power has risen from the ashes of rebellion. The Mandate of Heaven passes to those who prove worthy of it through strength, virtue, and the will of the people.\n\nA new era begins."
 nd_mandate_crisis.5.a: "Le Mandat du Ciel est le nôtre."

 # Phase 1 Flavor Events
 nd_mandate_crisis.10.title: "Corruption des eunuques"
 nd_mandate_crisis.10.desc: "Les eunuques du palais ont accumulé une influence alarmante sur les procédures judiciaires. Des rapports indiquent qu’ils siphonnent les recettes fiscales destinées à la défense des frontières dans leurs propres coffres. Leurs réseaux de favoritisme sapent l’autorité des fonctionnaires nommés dans l’ensemble de la bureaucratie."
 nd_mandate_crisis.10.a: "Purger les pires contrevenants."
 nd_mandate_crisis.10.a_tt: "Une purge rétablira l’ordre mais créera des ennemis à la cour."
 nd_mandate_crisis.10.b: "Leur loyauté vaut plus que leur honnêteté."
 nd_mandate_crisis.10.b_tt: "Tolérer la corruption érode l'autorité morale de la dynastie."

 nd_mandate_crisis.11.title: "Consolidation des terres"
 nd_mandate_crisis.11.desc: "Les familles riches et les fonctionnaires des tribunaux acquièrent de vastes domaines agricoles, déplaçant les petits exploitants agricoles qui travaillent la terre. Le rôle des impôts diminue à mesure que ces magnats bénéficient d'exonérations, tandis que les paysans déplacés rejoignent les rangs croissants des pauvres sans racines."
 nd_mandate_crisis.11.a: "Ordonner la redistribution des saisies illégales de terres."
 nd_mandate_crisis.11.a_tt: "La noblesse n'oubliera pas cet affront."
 nd_mandate_crisis.11.b: "Les grandes familles sont les piliers du royaume."
 nd_mandate_crisis.11.b_tt: "Les paysans sont désespérés sans terre."

 nd_mandate_crisis.12.title: "Négligence des frontières"
 nd_mandate_crisis.12.desc: "Les commandants le long de la frontière signalent des fortifications en ruine et des désertions parmi leurs troupes de garnison. Sans renforcement, les régions frontalières seront vulnérables aux raids et incursions des puissances voisines."
 nd_mandate_crisis.12.a: "Envoyez des fonds et des troupes à la frontière."
 nd_mandate_crisis.12.a_tt: "Cher, mais nécessaire."
 nd_mandate_crisis.12.b: "La frontière doit se débrouiller seule."
 nd_mandate_crisis.12.b_tt: "Les provinces frontalières pourraient perdre confiance dans notre protection."

 nd_mandate_crisis.13.title: "Griefs des paysans"
 nd_mandate_crisis.13.desc: "Les anciens des villages de tout le royaume adressent des pétitions au trône, répertoriant une litanie de griefs : impôts écrasants, magistrats corrompus, travail forcé sans compensation. Le ton des pétitions devient plus audacieux, certains se demandant ouvertement si le Ciel favorise toujours notre maison."
 nd_mandate_crisis.13.a: "Réduire le fardeau fiscal des citoyens."
 nd_mandate_crisis.13.a_tt: "Les revenus diminueront, mais les troubles pourraient s’atténuer."
 nd_mandate_crisis.13.b: "Supprimez les agitateurs et faites respecter l’ordre."
 nd_mandate_crisis.13.b_tt: "Le silence ne signifie pas consentement."

 nd_mandate_crisis.14.title: "Dissidence religieuse"
 nd_mandate_crisis.14.desc: "Heterodox religious movements are gaining adherents in the provinces, particularly among the dispossessed peasantry. Their teachings often carry implicit, and sometimes explicit, challenges to the legitimacy of the ruling dynasty."
 nd_mandate_crisis.14.a: "Permettez-leur leurs croyances, à condition qu’ils paient des impôts."
 nd_mandate_crisis.14.a_tt: "La tolérance peut saper notre autorité spirituelle."
 nd_mandate_crisis.14.b: "Ces sectes constituent une menace pour l’ordre social."
 nd_mandate_crisis.14.b_tt: "La persécution crée des martyrs."

 nd_mandate_crisis.15.title: "La famine en province"
 nd_mandate_crisis.15.desc: "Les mauvaises récoltes ont frappé les provinces éloignées. Sans réserves impériales de céréales, la population risque la famine. Les autorités locales rapportent que les paysans affamés forment déjà des bandes armées, attaquant les greniers et les collecteurs d'impôts."
 nd_mandate_crisis.15.a: "Ouvrez les greniers impériaux et envoyez des secours."
 nd_mandate_crisis.15.a_tt: "Le trésor souffrira, mais le peuple se souviendra de notre miséricorde."
 nd_mandate_crisis.15.b: "Chaque province doit gérer ses propres affaires."
 nd_mandate_crisis.15.b_tt: "La famine engendre la rébellion."

 # Phase 2 Events
 nd_mandate_crisis.20.title: "Un seigneur de guerre se lève"
 nd_mandate_crisis.20.desc: "Les commandants provinciaux ont pris le contrôle de leurs territoires, déclarant leur indépendance du gouvernement central. Ils prétendent que la dynastie a perdu le Mandat du Ciel et qu'un nouvel ordre doit émerger du chaos."
 nd_mandate_crisis.20.a: "Cette rébellion sera écrasée."
 nd_mandate_crisis.20.play_as_tag: "Devenez ce pays"

 nd_mandate_crisis.21.title: "Rébellion culturelle"
 nd_mandate_crisis.21.desc: "Les peuples[?target_culture.GetName]de la périphérie se sont soulevés contre la domination impériale. Les dirigeants locaux ont déclaré la formation d'un nouvel État, ralliant leur peuple à des appels à l'autodétermination et à la fin de la fiscalité oppressive de la dynastie."
 nd_mandate_crisis.21.a: "Ils regretteront ce défi."
 nd_mandate_crisis.21.play_as_tag: "Devenez ce pays"

 nd_mandate_crisis.23.title: "Les fractures de l’Empire"
 nd_mandate_crisis.23.desc: "The first provinces have broken away from imperial control. What began as internal unrest has become open rebellion. Warlords declare themselves rulers of their own domains, and the empire's unity exists now only on maps drawn in the capital.\n\nThe dynasty must either reconquer these breakaway states or accept the loss of the Mandate."
 nd_mandate_crisis.23.a: "Nous nous battrons pour restaurer le royaume."

 # Warlord/Neighbor Events
 nd_mandate_crisis.30.title: "Déclarer pour l'Empereur"
 nd_mandate_crisis.30.desc: "The Mandate Crisis presents us with a choice. The reigning Emperor has been weakened, but the dynasty still holds the capital and commands significant forces. Declaring our loyalty could secure us favorable treatment, or tie our fate to a sinking ship."
 nd_mandate_crisis.30.a: "Nous sommes aux côtés de l'Empereur."
 nd_mandate_crisis.30.a_tt: "Notre allégeance à l'Empereur se renforce."
 nd_mandate_crisis.30.b: "Nous tracerons notre propre voie."

 nd_mandate_crisis.31.title: "Réclamez le mandat"
 nd_mandate_crisis.31.desc: "La dynastie a perdu le Mandat du Ciel. Les signes sont indubitables : famine, rébellion, fracture du royaume. Nous avons la force de forger un nouvel ordre. Que notre bannière soit levée au-dessus des autres, nous serons les fondateurs d'une nouvelle dynastie."
 nd_mandate_crisis.31.a: "Nous revendiquons le Mandat du Ciel !"
 nd_mandate_crisis.31.a_tt: "Nous nous déclarons les dirigeants légitimes de l’Empire du Milieu."
 nd_mandate_crisis.31.b: "Le moment n’est pas encore venu."

 nd_mandate_crisis.32.title: "Opportunité à l'étranger"
 nd_mandate_crisis.32.desc: "La Chine est en pleine tourmente. La dynastie qui exigeait autrefois un tribut de la moitié du monde connu est en train de se déchirer. Les provinces frontalières sont faiblement défendues et leurs garnisons sont rappelées pour combattre dans des guerres internes. Si jamais nous souhaitions nous développer aux dépens de la Chine, il n’y a peut-être pas de meilleur moment."
 nd_mandate_crisis.32.a: "Préparez-vous à la guerre."
 nd_mandate_crisis.32.b: "Nous ne nous mêlerons pas de leurs affaires."

 # Generic Actions (bare keys for action system)
 nd_mc_reform_bureaucracy: "Réformer la bureaucratie"
 nd_mc_reform_bureaucracy_desc: "Restructurer l'appareil administratif, en supprimant les fonctionnaires corrompus et en rationalisant la gouvernance."
 nd_mc_purge_eunuchs: "Purger les eunuques"
 nd_mc_purge_eunuchs_desc: "Brisez le pouvoir de la faction des eunuques du palais et restaurez l'autorité des fonctionnaires nommés."
 nd_mc_appease_generals: "Apaiser les généraux"
 nd_mc_appease_generals_desc: "Envoyez des fonds et des honneurs aux commandants des frontières pour garantir leur loyauté continue."
 nd_mc_grant_autonomy: "Accorder l’autonomie provinciale"
 nd_mc_grant_autonomy_desc: "Faciliter le contrôle central sur les provinces, réduisant ainsi les griefs au détriment de l’autorité directe."
 nd_mc_negotiate_surrender: "Négocier avec le seigneur de guerre"
 nd_mc_negotiate_surrender_desc: "Offrez des conditions favorables à un chef de guerre rebelle en échange de sa soumission."
 nd_mc_imperial_edict: "Édit impérial de légitimité"
 nd_mc_imperial_edict_desc: "Publier une déclaration formelle condamnant tous les challengers comme des rebelles illégitimes."
 nd_mc_declare_loyalty: "Déclarez votre loyauté à l'empereur"
 nd_mc_declare_loyalty_desc: "Prêtez allégeance à la dynastie régnante et acceptez le maintien de son règne."
 nd_mc_seek_mandate: "Rechercher le mandat"
 nd_mc_seek_mandate_desc: "Déclarons-nous les héritiers légitimes du Mandat du Ciel et défions l'Empereur pour la suprématie."
