l_french:
 EDO: "Benin"
 EDO_ADJ: "Béninois"
 EDO_f: "Royaume du Bénin"
 EDO_f_desc: "Le Royaume du Bénin était l’un des États les plus puissants et les plus sophistiqués de l’Afrique de l’Ouest précoloniale, centré sur le peuple Edo et la ville du Bénin. Dirigé par l'Oba, le royaume était réputé pour son administration centralisée, sa formidable armée et son art de cour extraordinaire, les célèbres bronzes du Bénin. Un dirigeant d’Edo qui consolide le cœur du Bénin et le bas Niger peut redonner au royaume sa grandeur d’antan."
