l_french:
 STATIC_MODIFIER_NAME_nd_chi_celestial_authority: "Autorité céleste"
 STATIC_MODIFIER_DESC_nd_chi_celestial_authority: "Le Fils du Ciel gouverne Tout Sous le Ciel. Le Mandat rétabli, la bureaucratie impériale s'étend dans chaque province, chaque préfecture, chaque village. Les salles d'examen se remplissent d'érudits, les censeurs éradiquent la corruption et l'autorité du Trône du Dragon rayonne comme le soleil lui-même. Tous les peuples du royaume se penchent vers le centre."
 STATIC_MODIFIER_NAME_nd_chi_maritime_ascendancy: "Ascendance maritime"
 STATIC_MODIFIER_DESC_nd_chi_maritime_ascendancy: "Les flottes au trésor de l’Empire du Milieu repartent, leurs voiles assombrissant l’horizon depuis la mer de Chine méridionale jusqu’aux côtes africaines. Les chantiers navals de Nanjing et de Longjiang grondent de constructions, les marchands de Canton et de Quanzhou s'engraissent grâce aux bénéfices de la route maritime de la soie, et la Bannière du Dragon flotte sur des ports qui n'ont jamais vu d'équivalent."
 nd_chi.1.t: "Le mandat rétabli"
 nd_chi.1.d: "The fractured lands of China are united once more beneath a single sovereign. The Mandate of Heaven, that ancient compact between ruler and cosmos, has passed to a dynasty that has proven its worthiness through conquest and governance alike. The Middle Kingdom stands restored. But the question of how to wield this immense power remains.\n\nThe bureaucratic traditions of millennia offer one path: perfect the imperial administration, extend the examination system, draw all authority to the Dragon Throne. The tributary states will acknowledge celestial supremacy, and the realm will be governed by scholars trained in the classics.\n\nBut the seas call with a different promise. The shipyards of the coast can launch fleets that dwarf anything the world has seen. The maritime silk road carries porcelain, silk, and tea to every shore. China's wealth need not stop at its borders. It can flow outward on the tide.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_chi.1.a: "Le trône du dragon commande à tout ce qui se trouve sous le ciel"
 nd_chi.1.b: "Laissons les flottes au trésor transporter notre civilisation sur tous les rivages"
 nd_chi.2.t: "Le bataillon des machines divines"
 nd_chi.2.d: "The Shenjiying, the Divine Machine Battalion, represents a revolution in military organization. Founded to harness the devastating potential of gunpowder weapons that China itself invented, this elite formation combines arquebusiers, rocketers, and cannoneers into a disciplined fighting force unlike anything the world has seen.\n\nThe fire lance, the world's first gunpowder weapon, was a Chinese invention. Now its descendants (the hand cannon, the matchlock, the volley gun) are organized into permanent military divisions with standardized equipment and regular drill. The Huolongjing, the Fire Dragon Manual, codifies these weapons and their tactical employment. The question is whether to commit fully to this firearms revolution or to maintain it as one tool among many."
 nd_chi.2.a: "Les Shenjiying seront l'avant-garde de nos armées"
 nd_chi.2.b: "Un digne ajout à notre tradition militaire"
 nd_chi.3.t: "La réforme du whip unique"
 nd_chi.3.d: "The grand minister Zhang Juzheng has proposed a sweeping transformation of the imperial tax system. The current maze of land taxes, labor obligations, and tribute payments (levied in grain, silk, silver, and corvee labor across dozens of separate categories) would be consolidated into a single silver payment. The fish-scale registers will be redrawn, the land resurveyed, and the gentry's tax evasion confronted directly.\n\nThe numbers speak for themselves: silver revenues could nearly triple within a decade. But this reform strikes at the privileges of the landed gentry, the very class that staffs the bureaucracy. And tying all taxation to silver makes the empire dependent on the flow of foreign silver through maritime trade: a vulnerability that could prove dangerous if that flow is ever disrupted."
 nd_chi.3.a: "Mettre en œuvre le whip unique dans toutes les provinces"
 nd_chi.3.b: "La réforme est bonne en principe"
 nd_chi.4.t: "Le mouvement d’auto-renforcement"
 nd_chi.4.d: "The humiliations of recent decades have made one thing painfully clear: the Middle Kingdom's military technology has fallen behind the Western barbarians. A coalition of reform-minded officials (Li Hongzhang, Zeng Guofan, Zuo Zongtang) advocate a program of selective modernization. 'Chinese learning for the essential principles, Western learning for practical application,' they argue.\n\nThe Jiangnan Arsenal in Shanghai, the Fuzhou Shipyard, the Tianjin Military Academy: these institutions represent a new China, one that masters foreign technology without abandoning its own civilization. But conservatives at court question whether Western methods can be adopted without Western ideas following close behind. Can the empire modernize its arms while preserving the Confucian order?"
 nd_chi.4.a: "Adopter les méthodes occidentales : l’empire doit être fort"
 nd_chi.4.b: "Préserver les principes essentiels de notre civilisation"
 STATIC_MODIFIER_NAME_nd_chi_shenjiying_legacy: "L'héritage des Shenjiying"
 STATIC_MODIFIER_DESC_nd_chi_shenjiying_legacy: "Les innovations du bataillon de la machine divine dans la guerre à la poudre continuent d'influencer la doctrine militaire chinoise."
 STATIC_MODIFIER_NAME_nd_chi_single_whip_efficiency: "Efficacité d'un seul fouet"
 STATIC_MODIFIER_DESC_nd_chi_single_whip_efficiency: "La consolidation des impôts en un seul paiement en argent a rationalisé la collecte des recettes dans tout l’empire."
 STATIC_MODIFIER_NAME_nd_chi_self_strengthening_momentum: "Une dynamique d’auto-renforcement"
 STATIC_MODIFIER_DESC_nd_chi_self_strengthening_momentum: "Les arsenaux et les académies du Mouvement d’auto-renforcement conduisent à une modernisation rapide de l’industrie et de l’armée chinoises."
 STATIC_MODIFIER_NAME_nd_chi_yangwu_traditionalism: "Traditionalisme de Yangwu"
 STATIC_MODIFIER_DESC_nd_chi_yangwu_traditionalism: "La préservation des principes confucéens parallèlement à une modernisation sélective soutient l’autorité culturelle de l’Empire du Milieu."
 nd_chi_junk_tradition: "Tradition indésirable"
 nd_chi_junk_tradition_desc: "Le patrimoine maritime de la Chine remonte à des millénaires. La jonque océanique (avec ses compartiments étanches, son gouvernail équilibré et ses voiles lattées) est le navire le plus avancé de son époque. Des victoires navales de la dynastie Song aux routes commerciales côtières, la construction navale chinoise représente une tradition ininterrompue d'ingénierie maritime."
 nd_chi_keju_system: "Système d'examen Keju"
 nd_chi_keju_system_desc: "Le système d'examens impériaux sélectionne les fonctionnaires au moyen de tests rigoureux d'apprentissage classique, de composition littéraire et d'analyse politique. Cette institution méritocratique, affinée au fil des siècles, produit une classe dirigeante de bureaucrates érudits dont la loyauté va au trône plutôt qu'aux seigneurs régionaux."
 nd_chi_silk_weaving: "Tradition du tissage de la soie"
 nd_chi_silk_weaving_desc: "La production chinoise de soie, perfectionnée au cours de quatre millénaires, reste inégalée dans le monde. Les ateliers de tissage parrainés par l'État de Suzhou, Hangzhou et Nanjing produisent des tissus d'une qualité extraordinaire qui se vendent à des prix élevés sur toutes les routes commerciales, de la steppe à la Méditerranée."
 nd_chi_treasure_fleet: "Flotte au trésor"
 nd_chi_treasure_fleet_desc: "Les grands chantiers navals de Longjiang et de Nanjing lancent les plus grands navires que le monde ait jamais vus. La flotte au trésor, composée de centaines de navires transportant des milliers de marins et de soldats, projette la puissance chinoise à travers l’océan Indien, de l’Asie du Sud-Est jusqu’aux côtes africaines."
 nd_chi_naval_levy: "Système de prélèvement naval"
 nd_chi_naval_levy_desc: "Les populations côtières du Fujian, du Zhejiang et du Guangdong fournissent des marins et des charpentiers expérimentés à la marine impériale. Ces communautés maritimes, avec leurs générations de traditions maritimes, constituent l'épine dorsale de la puissance navale chinoise."
 nd_chi_imperial_kilns: "Fours impériaux"
 nd_chi_imperial_kilns_desc: "L'usine impériale de porcelaine de Jingdezhen, établie sous l'empereur Hongwu, transforme la ville en capitale mondiale de la porcelaine. Directement administrés par la cour, les fours produisent des marchandises d'une qualité inégalée : une seule commande impériale peut exiger des centaines de milliers de pièces."
 nd_chi_yongle_grandeur: "Yongle Grandeur"
 nd_chi_yongle_grandeur_desc: "L'ambitieux programme de construction de l'empereur Yongle (la Cité interdite, la restauration du Grand Canal, l'expansion de Pékin) représente l'élan de construction impériale le plus concentré depuis la dynastie Qin. Ces projets remodèlent le paysage physique de la Chine elle-même."
 nd_chi_divine_machine: "Bataillon de machines divines"
 nd_chi_divine_machine_desc: "La Shenjiying, l'une des trois divisions d'élite de la garnison de la capitale, se consacre entièrement aux opérations d'armes à feu. Armées de canons à main, de lance-roquettes multiples et de proto-mousquets décrits dans le Huolongjing, ces troupes représentent la pointe de la guerre à poudre."
 nd_chi_firearm_levies: "Prélèvements sur les armes à feu"
 nd_chi_firearm_levies_desc: "Le succès du modèle Shenjiying incite à étendre la formation sur les armes à feu au système de prélèvement plus large. Les garnisons provinciales équipent de plus en plus leurs troupes d'armes à poudre, créant ainsi une réserve nationale d'opérateurs d'armes à feu qualifiés."
 nd_chi_haijin_defense: "Défense côtière de Haijin"
 nd_chi_haijin_defense_desc: "La politique d'interdiction maritime de Haijin, quels que soient ses effets sur le commerce, conduit à la construction d'un vaste réseau de défense côtière. Des tours de guet fortifiées, des stations de patrouille navale et des postes de garnison bordent la côte du Liaodong au Guangdong, formant une chaîne défensive contre les pirates wokou et les intrus étrangers."
 nd_chi_canal_mastery: "Maîtrise du Grand Canal"
 nd_chi_canal_mastery_desc: "Le Grand Canal restauré, qui s'étend sur 1 700 kilomètres de Hangzhou à Pékin, est la plus longue voie navigable artificielle au monde. Des millions de travailleurs entretiennent ses écluses, ses remblais et ses canaux d'alimentation. Cette merveille d'ingénierie relie le nord et le sud de la Chine, transportant des céréales, de la soie et de la porcelaine jusqu'à la capitale et unissant l'économie de l'empire en un seul tissu."
 nd_chi_single_whip_reform: "Réforme du whip unique"
 nd_chi_single_whip_reform_desc: "La vaste réforme fiscale de Zhang Juzheng consolide l’éventail ahurissant des impôts de l’ère Ming (impôt foncier, service du travail, prélèvements locaux, obligations tributaires) en un seul paiement en argent. Des levés fonciers complets, des registres d'écailles de poisson redessinés et une collecte directe d'argent ont presque triplé les revenus de l'État en une décennie."
 nd_chi_fuchuan_warship: "Navire de guerre Fuchuan"
 nd_chi_fuchuan_warship_desc: "Le fuchuan, le « navire béni », est l’épine dorsale de la marine océanique chinoise. Ces grands navires à fond plat transportent un armement lourd, peuvent accueillir de grands équipages et peuvent naviguer à la fois dans les bas-fonds côtiers et en haute mer. Armé de canons en bronze et de flèches de feu, le fuchuan représente la puissance navale chinoise à l'ère de la voile."
 nd_chi_porcelain_trade: "Domination du commerce de la porcelaine"
 nd_chi_porcelain_trade_desc: "La porcelaine chinoise, « or blanc » pour les Européens qui la convoitent, domine le commerce mondial du luxe. Les fours de Jingdezhen produisent des millions de pièces chaque année, exportées via Canton et la route maritime de la soie vers les marchés du Japon, de l'Asie du Sud-Est, du Moyen-Orient et de l'Europe. Aucun concurrent ne peut égaler la qualité, l’ampleur ou la variété de la production céramique chinoise."
 nd_chi_mandarin_duck: "Formation de canard mandarin"
 nd_chi_mandarin_duck_desc: "La formation innovante de douze hommes de « canard mandarin » du général Qi Jiguang combine des piquiers, des épéistes, des boucliers et des porteurs de brosses à loups dans une unité tactique flexible conçue pour contrer les raiders wokou rapides. Cette approche interarmes, codifiée dans les traités militaires de Qi, représente un nouveau standard de sophistication tactique."
 nd_chi_canton_system: "Système de cantons"
 nd_chi_canton_system_desc: "The Qing government's restriction of all foreign maritime trade to the single port of Canton creates a controlled commercial environment where the Thirteen Factories, licensed Chinese merchant houses, serve as intermediaries between Western traders and the Chinese interior. The system generates enormous customs revenue while keeping foreign influence contained.\n\n#italic Available in: $nd_chi_porcelain_kiln$#!"
 nd_chi_banner_integration: "Intégration de bannières"
 nd_chi_banner_integration_desc: "L'expansion du système des Huit Bannières pour incorporer des unités mongoles et chinoises Han crée une armée impériale multiethnique. Les vingt-quatre bannières (huit Mandchoues, huit Mongoles, huit Han) fournissent une force de garnison permanente stationnée dans les villes stratégiques de l'empire, intégrant diverses traditions guerrières dans une structure de commandement unifiée."
 nd_chi_literary_compilations: "Compilations encyclopédiques"
 nd_chi_literary_compilations_desc: "Les projets littéraires massifs de la cour Qing (le Dictionnaire Kangxi, la Bibliothèque complète des Quatre Trésors, les Statuts rassemblés) représentent le programme de compilation de connaissances le plus ambitieux de l'histoire de l'humanité. Le Siku Quanshu comprend à lui seul plus de 36 000 volumes, préservant et systématisant l’intégralité du patrimoine intellectuel chinois."
 nd_chi_self_strengthening: "Mouvement d’auto-renforcement"
 nd_chi_self_strengthening_desc: "Le Mouvement Yangwu, « mouvement des affaires étrangères », représente la première tentative systématique de modernisation militaire et industrielle de la Chine. L'arsenal de Jiangnan à Shanghai, le chantier naval de Fuzhou, l'Académie militaire de Tianjin et des dizaines d'installations plus petites apportent la technologie industrielle occidentale sur le sol chinois selon le principe « essence chinoise, méthodes occidentales »."
 nd_chi_tongzhi_restoration: "Restauration Tongzhi"
 nd_chi_tongzhi_restoration_desc: "La restauration Tongzhi représente un effort concerté visant à revitaliser la dynastie Qing grâce à un retour aux principes de gouvernance confucéens combinés à une réforme administrative pratique. La répression des rébellions de Taiping et de Nian, la réorganisation de l’administration provinciale et la revigoration du système d’examen démontrent que l’ordre ancien conserve à la fois vitalité et légitimité."
 nd_chi_maritime_customs: "Modernisation des douanes maritimes"
 nd_chi_maritime_customs_desc: "La création du Service impérial des douanes maritimes, sous une direction étrangère mais appartenant à des Chinois, introduit une comptabilité moderne, des tarifs standardisés et une collecte efficace des recettes dans le système portuaire chinois. Les recettes douanières deviennent une source fiable de revenus pour le gouvernement central et un modèle de modernisation administrative."
 nd_chi_reform_spirit: "Esprit de réforme"
 nd_chi_reform_spirit_desc: "L’esprit de réforme qui a animé les Cent Jours de 1898 représente, même brièvement, une vision de modernisation institutionnelle globale : un système éducatif moderne, un gouvernement constitutionnel, une économie industrielle. Même si le mouvement initial a été écrasé, ses idées ne peuvent rester impensées. Le génie de la réforme, une fois libéré, remodèle tous les débats politiques ultérieurs."
 a_nd_chi_shenjiying: "Shenjiying"
 a_nd_chi_shenjiying_desc: "Le Bataillon des Machines Divines : une infanterie d'élite à poudre à canon armée de canons à main, de fusils à mèche et de lance-roquettes. Fondée comme l'une des trois divisions d'élite de la garnison de la capitale, la Shenjiying représente la maîtrise par la Chine de la révolution des armes à feu qu'elle a inventée."
 a_nd_chi_shenjiying_levy: "Prélèvement Shenjiying"
 a_nd_chi_shenjiying_levy_desc: "Troupes de la garnison provinciale entraînées selon la tradition Shenjiying de la guerre à la poudre."
 n_nd_chi_war_junk: "Déchets de guerre"
 n_nd_chi_war_junk_desc: "Une jonque océanique lourdement armée, construite pour le combat naval. Dotées de compartiments étanches, de grands quartiers d’équipage et d’un armement lourd, les débris de guerre constituent l’épine dorsale de la puissance navale chinoise."
 n_nd_chi_war_junk_levy: "Prélèvement sur les déchets de guerre"
 n_nd_chi_war_junk_levy_desc: "Une jonque de guerre levée par des prélèvements et dont l'équipage est composé de populations côtières ayant des générations de traditions maritimes."
 n_nd_chi_fuchuan: "Fuchuan"
 n_nd_chi_fuchuan_desc: "Le « navire béni » : un grand navire de guerre à fond plat armé de canons en bronze et de flèches enflammées. Le fuchuan peut naviguer à la fois dans les bas-fonds côtiers et en haute mer, transportant des équipages plus nombreux et un armement plus lourd que les navires de guerre standards."
 nd_chi_examination_hall: "Salle d'examen impériale"
 nd_chi_examination_hall_desc: "Un complexe administré par l'État où les candidats passent les examens impériaux et concourent pour des postes dans la fonction publique grâce à la maîtrise des classiques confucéens, de la composition littéraire et de l'analyse politique."
 nd_chi_examination_upkeep: "Administration des examens"
 nd_chi_examination_upkeep_desc: "Papier, livres et tissus fins pour les érudits : le déroulement régulier des examens impériaux exige un approvisionnement constant en matériel d'écriture, en textes classiques et en tenue vestimentaire appropriée pour les examinateurs et les candidats."
 nd_chi_porcelain_kiln: "Four Impérial à Porcelaine"
 nd_chi_porcelain_kiln_desc: "Un complexe de fours supervisé par l'État produisant de la porcelaine de la plus haute qualité destinée à l'usage impérial et à l'exportation. La division du travail (avec des spécialistes distincts pour le façonnage, le vitrage, la peinture et la cuisson) permet une production à l'échelle industrielle."
 nd_chi_porcelain_production: "Opérations du four"
 nd_chi_porcelain_production_desc: "Argile kaolin fine façonnée et cuite dans des fours à dragon pour produire de la porcelaine de qualité impériale."
 nd_chi_coastal_defense: "Fort de défense côtière"
 nd_chi_coastal_defense_desc: "Une installation côtière fortifiée combinant une tour de guet, une caserne de garnison et une station de patrouille navale. Fait partie de la chaîne de défense maritime de l'empire contre la piraterie et les intrusions étrangères."
 nd_chi_coastal_garrison_upkeep: "Entretien de la garnison côtière"
 nd_chi_coastal_garrison_upkeep_desc: "Les armes, les pierres pour les fortifications et les outils maintiennent la garnison de défense côtière armée et ses murs en bon état."
 nd_chi_grand_shipyard: "Grand chantier naval"
 nd_chi_grand_shipyard_desc: "Une immense installation de construction navale capable de construire les plus grands navires du monde. Plusieurs cales sèches, parcs à bois et postes d'amarrage permettent la construction simultanée de jonques de guerre et de navires au trésor."
 nd_chi_shipyard_maintenance: "Opérations du chantier naval"
 nd_chi_shipyard_maintenance_desc: "Le bois, les approvisionnements navals et les outils de charpentier naval soutiennent la construction et l'équipement constants des jonques de guerre et des navires au trésor."
 nd_chi_nanjing_arsenal: "Arsenal de Nankin"
 nd_chi_nanjing_arsenal_desc: "Une usine d’armement moderne produisant des armes à feu, de l’artillerie et des munitions en utilisant des méthodes industrielles occidentales. L'arsenal représente l'engagement du Mouvement d'auto-renforcement en faveur de la modernisation militaire."
 nd_chi_arsenal_operations: "Fabrication d'arsenal"
 nd_chi_arsenal_operations_desc: "Les armes à feu, l'artillerie, le stock de fer et le charbon pour les fourneaux soutiennent la production continue d'armes et de munitions modernes de l'arsenal."
 levy_nd_chi_shenjiying: "Prélèvement Shenjiying"
 levy_nd_chi_shenjiying_desc: "Troupes armées de poudre à canon issues des soldats de la garnison dans la tradition Shenjiying."
 levy_nd_chi_war_junk: "Prélèvement sur les déchets de guerre"
 levy_nd_chi_war_junk_desc: "Jonques de guerre dont l'équipage est composé de communautés côtières et de travailleurs maritimes."
 nd_chi_canton_export: "Opérations d'exportation des cantons"
 nd_chi_canton_export_desc: "Porcelaine orientée vers l'exportation, décorée d'émaux surglacés colorés pour les marchés occidentaux, produite selon le système de canton par l'intermédiaire des treize usines."
 nd_chi_formed_tt: "La Chine s'est formée"
 nd_chi_path_a_tt: "Choisissez l’Autorité Céleste"
 nd_chi_path_b_tt: "Choisissez l’ascendance maritime"
 nd_chi_destiny: "Le mandat perdure"
 nd_chi_destiny_desc: "La Chine est réunifiée et le Mandat du Ciel assuré. L’Empire du Milieu se trouve désormais à la croisée des chemins : va-t-il se tourner vers l’intérieur pour parfaire son administration céleste, ou vers l’extérieur pour projeter sa civilisation au-delà des mers ? La stabilité est primordiale : le royaume doit être en paix avant que le grand travail puisse commencer."
 nd_chi_dest_pacify: "Pacifier les frontières"
 nd_chi_dest_pacify_desc: "The kingdoms of the south have long challenged imperial authority. Bring Dali in the mountains of Yunnan under the Dragon Banner and extend the mandate into Dai Viet. Only when the frontiers are secure can the empire turn its attention to greater ambitions."
 nd_chi_dest_nine_prov: "Les Neuf Provinces Unies"
 nd_chi_dest_nine_prov_desc: "The ancient ideal of the Nine Provinces encompassed all civilized lands under heaven. Bring Kashgar and Samarkand into the imperial sphere to demonstrate that no corner of the Western Regions lies beyond the Dragon Throne's reach. The southern capital on the Yangtze is built up until its wealth matches the empire's territorial ambitions."
 nd_chi_dest_nanjing_developed_tt: "Shangyuan (Nanjing) is ours and has been built up to a development of at least 62"
 nd_chi_dest_all_under: "Tout sous le ciel"
 nd_chi_dest_all_under_desc: "Tianxia, All Under Heaven, is not merely a phrase but a destiny. When the Dragon Throne commands from Delhi to the Ili, when the capital at Dadu has grown to twice its size and no rival can match the empire's military strength, the Mandate of Heaven becomes universal fact. Build the Forbidden Palace as the seat of this eternal administration."
 nd_chi_dest_dadu_developed_tt: "Dadu is ours and has been built up to a development of at least 90"
 nd_chi_dest_sea_routes: "Rouvrir les routes maritimes"
 nd_chi_dest_sea_routes_desc: "Les restrictions de Haijin ont étouffé l'avantage maritime naturel de la Chine. Renversez cet isolement : saisissez le point d’étranglement de Malacca et assurez la circulation de la soie sur les marchés sous influence impériale. Les routes maritimes qui transportaient autrefois les flottes de Zheng He doivent être rouvertes au commerce chinois."
 nd_chi_dest_treasure: "L'ascendant de la flotte au trésor"
 nd_chi_dest_treasure_desc: "Les voyages de Zheng He ont prouvé que la Chine pouvait projeter sa puissance à travers l’océan Indien. Maintenant, rendez cette projection permanente. Sécurisez Palembang et Calicut, les portes d’entrée des îles aux épices et de la côte de Malabar, et faites appel à des institutions financières modernes pour financer cette entreprise océanique."
 nd_chi_dest_dragon_shore: "Bannière de dragon sur chaque rivage"
 nd_chi_dest_dragon_shore_desc: "D’Ormuz à l’embouchure du golfe Persique à Mogadiscio sur la côte africaine en passant par Temasek au carrefour de tout le commerce asiatique : la Bannière du Dragon doit flotter sur tous les grands ports du monde maritime. Construisez le Treasure Wharf pour soutenir cette entreprise navale sans précédent."
 nd_chi.5.t: "Le mandat perdure"
 nd_chi.5.d: "The Middle Kingdom is whole once more. The fractured warring states have been brought to heel, the mandate secured through conquest and wisdom alike. The Dragon Throne stands supreme over the most populous and productive civilization on earth.\n\nBut supremacy demands direction. The empire's resources are vast but not infinite. The question that has haunted every dynasty since the First Emperor now confronts us: in which direction shall the Middle Kingdom grow?"
 nd_chi.5.a: "Le mandat est sécurisé : pour l’instant"
 nd_chi.6.t: "Les frontières pacifiées"
 nd_chi.6.d: "The kingdom of Dali in the mountains of Yunnan has been brought under imperial authority, and Dai Viet acknowledges the Dragon Throne. For the first time in centuries, the empire's frontiers are truly secure.\n\nThe generals who achieved these victories now look to the court for their next orders. The bureaucracy is already extending its reach into the newly pacified territories, establishing examination halls and tax registers where once there was only chaos."
 nd_chi.6.a: "Les généraux des frontières ont mérité leur récompense"
 nd_chi.7.t: "Les Neuf Provinces Unies"
 nd_chi.7.d: "The ancient dream of the Nine Provinces, all civilized lands under one sovereign, approaches reality. The oasis cities of the Tarim and Samarkand's bazaars now operate under the protection of the Dragon Banner. The empire stretches from the Yangtze to the banks of the Oxus.\n\nThis achievement demands a choice in governance. Some ministers advocate strengthening the mandate through diplomatic prestige and loyal subjects, using the empire's growing spy networks to prevent rebellion before it starts. Others argue for a program of military fortification: garrison the frontiers with permanent forces, invest in siege capabilities, and make the empire literally impregnable."
 nd_chi.7.a: "Règle grâce à l'autorité morale du mandat"
 nd_chi.7.b: "Fortifiez chaque frontière et garnissez chaque passage"
 nd_chi.8.t: "Tout sous le ciel"
 nd_chi.8.d: "Tianxia is achieved. The Dragon Throne commands an empire of unprecedented scope: from the subcontinental plains to the Central Asian steppes, from the tropical south to the frozen north. No dynasty in Chinese history has ruled so much, so firmly.\n\nThe scholars at court debate the meaning of this achievement. The hawks argue that universal empire demands universal preparedness: the army traditions, the diplomatic machinery, the mechanisms of war must be perfected to maintain this dominion forever. The Confucian idealists counter that true universal rule requires harmony, and the empire should heal its conquered lands, build its prestige through cultural achievement, and let the sheer weight of its civilization make rebellion unthinkable."
 nd_chi.8.a: "L’empire universel exige une vigilance universelle"
 nd_chi.8.b: "Que l'harmonie céleste gouverne tout sous le ciel"
 nd_chi.9.t: "Les routes maritimes rouvertes"
 nd_chi.9.d: "The Strait of Malacca, that narrow passage through which half the world's trade must flow, now answers to the Dragon Throne. Chinese merchants, freed from the restrictions of the Haijin, are already establishing trading posts and warehouses in every port from Java to Siam.\n\nThe silk that once traveled overland on the backs of camels now moves by sea in the holds of junks, faster and in far greater quantity. The maritime silk road is reborn, and this time it flies the Dragon Banner."
 nd_chi.9.a: "Les flottes au trésor naviguent à nouveau"
 nd_chi.10.t: "L'ascendant de la flotte au trésor"
 nd_chi.10.d: "Chinese naval power now stretches from the Spice Islands to the Malabar Coast. Palembang and Calicut, the twin gateways of the Indian Ocean, operate under imperial authority. The treasure fleet has achieved what Zheng He could only demonstrate: permanent Chinese dominion over the maritime world.\n\nThe silver that flows into China from this oceanic empire is staggering. The question is how to channel it. Some advocate reinvesting in the trade network itself: better intelligence, more diplomatic connections, a web of commercial relationships that makes Chinese trade indispensable. Others push for naval supremacy pure and simple: faster ships, better-trained crews, a fleet that can project power anywhere."
 nd_chi.10.a: "La marée d'argent enrichit tout le royaume"
 nd_chi.10.b: "La domination navale sécurise les routes commerciales"
 nd_chi.11.t: "Bannière de dragon sur chaque rivage"
 nd_chi.11.d: "From the Persian Gulf to the coast of Africa, from the straits of Southeast Asia to the harbors of India: every major port of the maritime world now acknowledges Chinese supremacy. The treasure fleet dwarfs any rival navy. Chinese merchants dominate every market they enter.\n\nThis is an achievement without historical parallel. The question now is whether to use this maritime supremacy for military purposes (projecting the empire's power into every theater, reducing the cost of overseas warfare) or for economic ones, using the maritime silk road as a highway of trade that enriches the realm through commerce and mercenary recruitment rather than conquest."
 nd_chi.11.a: "L'océan lui-même est le domaine de l'empire"
 nd_chi.11.b: "Laissez la route maritime de la soie lier le monde"
 STATIC_MODIFIER_NAME_nd_chi_dest_mandate_vigor: "La vigueur du mandat"
 STATIC_MODIFIER_DESC_nd_chi_dest_mandate_vigor: "L'autorité morale du Trône du Dragon impose la loyauté des sujets et le respect des tribunaux étrangers. Les agents impériaux surveillent chaque province à la recherche de signes de déloyauté."
 STATIC_MODIFIER_NAME_nd_chi_dest_frontier_garrisons: "Garnisons frontalières"
 STATIC_MODIFIER_DESC_nd_chi_dest_frontier_garrisons: "Des garnisons militaires permanentes le long de chaque frontière rendent l’empire imprenable. Les ingénieurs de siège sont prêts à réduire toute forteresse qui oserait résister à l’autorité impériale."
 STATIC_MODIFIER_NAME_nd_chi_dest_universal_empire: "Empire universel"
 STATIC_MODIFIER_DESC_nd_chi_dest_universal_empire: "Les mécanismes de domination universelle sont perfectionnés : une tradition militaire professionnelle, un appareil diplomatique efficace et le pouvoir de dicter ses conditions à tout adversaire."
 STATIC_MODIFIER_NAME_nd_chi_dest_celestial_harmony: "Harmonie céleste"
 STATIC_MODIFIER_DESC_nd_chi_dest_celestial_harmony: "L’empire gouverne par l’harmonie plutôt que par la force. Les terres dévastées se rétablissent rapidement sous une administration bienveillante, et le prestige de la dynastie perdure à travers les générations."
 STATIC_MODIFIER_NAME_nd_chi_dest_silver_tide: "Marée d'argent"
 STATIC_MODIFIER_DESC_nd_chi_dest_silver_tide: "Le flux d’argent via les routes commerciales contrôlées par la Chine enrichit chaque recoin du royaume. Les matières premières affluent des territoires d’outre-mer tandis que les relations diplomatiques se multiplient."
 STATIC_MODIFIER_NAME_nd_chi_dest_fleet_dominance: "Domination de la flotte"
 STATIC_MODIFIER_DESC_nd_chi_dest_fleet_dominance: "Les escadrons légers de la flotte au trésor patrouillent sur toutes les voies maritimes. Les forces navales en mouvement rapide projettent leur puissance loin de chez elles, même si les forces terrestres reçoivent moins d’attention."
 STATIC_MODIFIER_NAME_nd_chi_dest_ocean_sovereign: "Souverain des océans"
 STATIC_MODIFIER_DESC_nd_chi_dest_ocean_sovereign: "L’empire projette sa puissance militaire sur tous les océans. Les campagnes à l’étranger sont lancées facilement et les lignes d’approvisionnement s’étendent jusqu’aux extrémités de la terre."
 STATIC_MODIFIER_NAME_nd_chi_dest_silk_road_sea: "Route de la Soie de la Mer"
 STATIC_MODIFIER_DESC_nd_chi_dest_silk_road_sea: "La route maritime de la soie génère une telle richesse que l’empire peut se permettre des armées de mercenaires et des coûts militaires réduits. Le seul danger est la complaisance qu’engendre la richesse."
 nd_chi_forbidden_palace: "Palais interdit"
 nd_chi_forbidden_palace_desc: "Le complexe administratif suprême de l'empire universel : un vaste palais à partir duquel le Fils du Ciel gouverne Tout Sous le Ciel. Ses salles abritent la bureaucratie la plus étendue de l’histoire de l’humanité, ses archives contiennent les archives de chaque province et ses salles d’examen produisent les fonctionnaires érudits qui administrent un empire sans égal."
 nd_chi_palace_upkeep: "Administration du palais"
 nd_chi_palace_upkeep_desc: "Papier pour les archives interminables, tissus fins pour les cérémonies de la cour, meubles pour les mille chambres et outils pour un entretien constant : le Palais Interdit consomme des ressources dignes du siège de l'empire universel."
 nd_chi_treasure_wharf: "Quai au trésor"
 nd_chi_treasure_wharf_desc: "Un immense complexe naval spécialement construit pour la flotte au trésor : plusieurs cales sèches, magasins de bois, voileries et postes d'amarrage capables de construire et d'entretenir les plus grands navires de guerre et navires marchands que le monde ait jamais vu. De ce quai, la Bannière du Dragon est transportée sur tous les rivages."
 nd_chi_wharf_operations: "Opérations du quai"
 nd_chi_wharf_operations_desc: "Bois des forêts du sud, provisions navales de la côte, goudron pour l'imperméabilisation et outils pour les charpentiers navals : le Quai du Trésor nécessite un flux constant de matériaux pour maintenir la flotte en état de naviguer."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_chi_bureaucracy_authority: "Autorité bureaucratique impériale"
 AUTO_MODIFIER_DESC_nd_chi_bureaucracy_authority: "The cumulative weight of Sui-Tang precedent, Song administrative refinement, and Yuan-Ming consolidation produces a permanent institutional apparatus. Permanent ministries, examination boards, censorial offices, and palace bureaus form a self-sustaining government: the most extensive bureaucracy on earth. Three institutional slots open for the great offices of the dynasty, and a capital as large as Dadu gives a fourth."

 chi_keju_examinations_bureaucracy: "Système d'examen impérial"
 chi_keju_examinations_bureaucracy_desc: "Codifié par les Sui en 605 et amené à maturité sous les Tang et les Song, les Keju sélectionnaient les fonctionnaires par concours écrit sur les classiques confucianistes. Les diplômes Sheng-yuan, Juren et Jinshi définissaient une classe officielle d'érudits lettrés fidèle au trône sur les aristocrates héréditaires. Les Ming ont intensifié le système en 1370 et les Qing l'ont maintenu jusqu'à son abolition formelle en 1905, produisant un gouvernement civil méritocratique mais interdisant définitivement aux grands clans l'accès aux plus hautes fonctions et invitant à la tricherie, au factionnalisme et à la vente de diplômes endémiques pendant les périodes de déclin."

 chi_six_ministries_bureaucracy: "Three Provincial Commissions"
 chi_six_ministries_bureaucracy_desc: "In 1376 the Hongwu Emperor abolished the branch secretariats the Yuan had left behind and divided each province between three offices: one for administration and tax, one for justice and surveillance, one for the garrisons. None could give orders to the others, and each answered to a different office in the capital. No governor could turn a province into a kingdom of his own. The price was three offices that quarrelled over every boundary between them, until the court began sending grand coordinators to make them work together."

 chi_censorate_bureaucracy: "Offices of Scrutiny"
 chi_censorate_bureaucracy_desc: "Six small offices, one beside each ministry. Their supervising secretaries read every edict and memorial that passed, kept a copy, and could send an edict back unissued. From 1573 they also held the register of deadlines by which each ministry was judged. They answered to no minister, and they stood outside the Censorate until the Yongzheng Emperor merged the two in 1723. At their best they stopped a bad order before it went out. At their worst they were the trenches of every factional war at court."

 chi_hanlin_academy_bureaucracy: "Académie Hanlin"
 chi_hanlin_academy_bureaucracy_desc: "Fondé sous les Tang et élevé par les Song, le Hanlin Yuan était l'institut littéraire d'élite de l'empire. Issus des plus hauts diplômés jinshi, ses membres rédigeaient des édits impériaux, compilaient les histoires dynastiques, encadraient l'héritier présomptif et préservaient l'orthodoxie. L'Académie conférait au trône une légitimité culturelle inégalée, mais une classe d'académiciens choyés avait tendance à se cristalliser en cliques factionnelles dont l'approbation des actions de l'empereur devenait de plus en plus creuse."

 chi_grand_secretariat_bureaucracy: "Office of Transmission"
 chi_grand_secretariat_bureaucracy_desc: "Founded by the Hongwu Emperor in 1377. Every memorial to the throne came through it, whether from a provincial official or from a commoner with a grievance. Its clerks copied each one, entered it in a register, and sent the original up. The emperor heard from every province, and no minister stood between him and the paper. Whoever held the office could also hold a memorial back, and under weak emperors that is what happened."

 chi_eunuch_bureau_bureaucracy: "Bureau des eunuques impériaux"
 chi_eunuch_bureau_bureaucracy_desc: "Le Si-li Jian, dirigé par le directeur des cérémonies, est apparu à l'époque de Yongle comme le bureau des eunuques détenant le sceau impérial. Les eunuques, ne devant leur loyauté qu'au trône, permettaient aux empereurs de contourner la bureaucratie érudite et de diriger une administration parallèle. Le système a produit des autocraties impitoyablement efficaces sous Zhengde et Wanli. Mais aussi les dictatures notoires de Wang Zhen, Liu Jin et Wei Zhongxian, qui ont discrédité la dynastie et accéléré l’effondrement des Ming."

 chi_lifan_yuan_bureaucracy: "Lifan Yuan"
 chi_lifan_yuan_bureaucracy_desc: "Créé par Hong Taiji en 1638 et élevé au rang ministériel par les Qing, le Lifan Yuan, Cour des affaires coloniales, administrait la Mongolie, le Tibet et plus tard le Xinjiang par le biais d'un appareil distinct des six ministères. Opérant en mongol, tibétain, mandchou ainsi qu'en chinois, elle gérait les ligues et les bannières, supervisait la cour du Dalaï Lama et structurait les relations tributaires avec les régimes politiques d'Asie intérieure. Sa gouvernance frontalière à double voie a maintenu la loyauté de la steppe aussi longtemps que la dynastie est restée vigoureuse ; la négligence a provoqué la révolte des Junggar et le long effritement de la frontière impériale."
