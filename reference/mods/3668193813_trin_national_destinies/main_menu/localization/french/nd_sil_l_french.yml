l_french:
 STATIC_MODIFIER_NAME_nd_sil_crossroads_of_crowns: "Carrefour des Trois Couronnes"
 STATIC_MODIFIER_DESC_nd_sil_crossroads_of_crowns: "La Silésie se situe depuis longtemps à l’intersection des mondes polonais, bohème et allemand. Plutôt que d’être déchirés par ces revendications concurrentes, nous avons fait de notre héritage multiethnique une source de force, accueillant les colons, méditant les différends et gouvernant par le compromis."
 STATIC_MODIFIER_NAME_nd_sil_linen_and_silver: "Le pays du lin et de l'argent"
 STATIC_MODIFIER_DESC_nd_sil_linen_and_silver: "La richesse de la Silésie découle des métiers à tisser de ses tisserands et des profondeurs de ses mines. Notre toile de lin atteint les marchés d'Amsterdam et de Londres, tandis que l'argent et le plomb de Silésie alimentent les monnaies d'Europe centrale. C'est un pays bâti sur l'industrie et l'entreprise."
 nd_sil.1.t: "Le duché de Silésie"
 nd_sil.1.d: "The disparate Silesian duchies stand united at last under a single banner. For centuries this land has been divided among rival Piast branches, each petty duke guarding his patch of the Oder valley. Now the walled towns of Breslau, Schweidnitz, and Liegnitz answer to one authority.\n\nBut what kind of Silesia shall we build? Our duchy sits at the crossroads where Polish, Bohemian, and German cultures mingle, a place of many tongues and traditions, where Magdeburg law governs towns and Silesian linen reaches distant markets. Shall we embrace this diversity as our defining strength, governing through diplomacy and multi-ethnic tolerance? Or shall we look to the looms and mineshafts that have always been the true source of Silesian wealth, building an industrial heartland that rivals Flanders and Saxony?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sil.1.a: "Nous sommes le pont entre trois royaumes."
 nd_sil.1.b: "Notre richesse est tissée dans du tissu et creusée dans la pierre."
 STATIC_MODIFIER_NAME_nd_sil_mongol_resilience: "Résilience de Legnica"
 STATIC_MODIFIER_DESC_nd_sil_mongol_resilience: "Le souvenir du duc Henri le Pieux et de son sacrifice contre la horde mongole renforce nos défenseurs. Ce qui a été détruit a été reconstruit plus fort."
 STATIC_MODIFIER_NAME_nd_sil_mongol_remembrance: "Martyre d'Henri le Pieux"
 STATIC_MODIFIER_DESC_nd_sil_mongol_remembrance: "La mort du duc Henri à Legnica a fait de lui un martyr chrétien et un symbole du défi silésien. Son sacrifice a apporté des pèlerins, du prestige et un dévouement renouvelé à la défense de notre terre."
 nd_sil.2.t: "L'Ombre de Legnica"
 nd_sil.2.d: "In the spring of 1241, the Mongol tumens swept through Silesia like a brushfire. At Legnica, Duke Henry II the Pious gathered what forces he could, Silesian knights, Templar brothers, Bavarian miners turned soldiers, and rode out to meet the horde. The battle was a catastrophe. Henry was killed, his head paraded on a Mongol lance. Yet the Mongols did not stay. Whether turned back by their losses or called east by the death of the Great Khan, they withdrew, leaving Silesia devastated but unconquered.\n\nThe memory of Legnica burns in Silesian consciousness. Shall we honor Henry's sacrifice by hardening our defenses so thoroughly that no invader will ever breach them again? Or shall we make the martyred duke a symbol of our eternal defiance, a rallying cry that draws warriors and pilgrims alike to our banner?"
 nd_sil.2.a: "Plus jamais la Silésie ne tombera."
 nd_sil.2.b: "Le sacrifice d'Henry inspirera des générations."
 STATIC_MODIFIER_NAME_nd_sil_protestant_zeal: "Ferveur protestante silésienne"
 STATIC_MODIFIER_DESC_nd_sil_protestant_zeal: "La Réforme a balayé les églises de Breslau avec la passion d'une véritable conviction. Les sermons de Johann Hess résonnent dans toutes les paroisses et les fidèles considèrent la Silésie comme un bastion de la foi nouvelle."
 STATIC_MODIFIER_NAME_nd_sil_silesian_tolerance: "Pluralisme religieux silésien"
 STATIC_MODIFIER_DESC_nd_sil_silesian_tolerance: "Dans un pays où l'île de la cathédrale catholique et les quartiers marchands protestants partagent la même ville, la Silésie a appris que la coexistence engendre la prospérité. Nos érudits débattent librement et nos commerçants accueillent tous."
 nd_sil.3.t: "La Réforme à Breslau"
 nd_sil.3.d: "In 1523, the Breslau town council unanimously appointed Johann Hess, a student of Wittenberg and close friend of Melanchthon, as pastor of St. Maria Magdalena. Within a few years, nearly every church in Breslau turned Protestant, save the ancient cathedral on its island. The city became a beacon of the Reformation in the east, drawing scholars and preachers from across the Empire.\n\nYet Silesia's religious geography is complex. Catholic orders still hold their monasteries, Schwenckfelder mystics preach in the countryside, and the Habsburg overlords eye this Protestant surge with growing alarm. Shall we embrace the Reformation with evangelical zeal, making Breslau a fortress of the new faith? Or shall we follow the Silesian instinct for accommodation, letting Protestant and Catholic, mystic and rationalist, coexist in a land that has always thrived on diversity?"
 nd_sil.3.a: "Breslau sera une ville de la vraie foi."
 nd_sil.3.b: "Que tous ceux qui recherchent la vérité soient les bienvenus ici."
 STATIC_MODIFIER_NAME_nd_sil_weavers_concessions: "Pacte des tisserands"
 STATIC_MODIFIER_DESC_nd_sil_weavers_concessions: "Le soulèvement des tisserands silésiens nous a forcé la main, mais les concessions aux travailleurs pauvres pourraient encore s'avérer la voie la plus sage. Une main-d’œuvre satisfaite tisse plus vite et mieux."
 STATIC_MODIFIER_NAME_nd_sil_industrial_discipline: "Ordre Industriel"
 STATIC_MODIFIER_DESC_nd_sil_industrial_discipline: "La révolte des tisserands a été écrasée. L'ordre doit être maintenu dans les ateliers et les métiers à tisser ne doivent pas se taire. Les tissus silésiens continueront à atteindre tous les marchés d'Europe."
 nd_sil.4.t: "Le soulèvement des tisserands silésiens"
 nd_sil.4.d: "In the hill country around Peterswaldau and Langenbielau, the linen weavers have risen in desperate fury. For generations these cottage workers were the backbone of Silesian prosperity, their cloth exported to England, the Netherlands, and the distant colonies. But mechanized competition from British factories has driven prices into the ground, while merchants squeeze ever harder. The weavers, reduced to starvation wages, have smashed the merchants' houses and destroyed their account books.\n\nThe uprising has been put down by Prussian troops, but the underlying tension remains. Shall we make concessions to the working poor, better wages, regulated conditions, accepting that a content workforce is a productive one? Or shall we restore order with an iron hand, ensuring that Silesian industry maintains its discipline and its competitive edge in the global marketplace?"
 nd_sil.4.a: "Accordez la dignité aux tisserands et ils tisseront avec fierté."
 nd_sil.4.b: "Les métiers de la Silésie ne doivent pas être arrêtés par le désordre."
 nd_sil_piast_fortifications: "Fortifications Piast"
 nd_sil_piast_fortifications_desc: "Les ducs silésiens Piast ont érigé des forteresses en pierre à travers leurs duchés, du château de Wroclaw aux forts des collines des contreforts des Sudètes, créant un réseau de positions défensives contre les Mongols, les Hussites et les prétendants rivaux."
 nd_sil_legnica_legacy: "L'héritage de Legnica"
 nd_sil_legnica_legacy_desc: "La bataille de Legnica en 1241 a défini l'identité martiale de la Silésie. La charge de cavalerie du duc Henri le Pieux contre l'avant-garde mongole, bien que vouée à l'échec, démontra la tradition Piast de guerre à cheval qui caractérisait la culture militaire silésienne."
 nd_sil_oder_commerce: "Commerce sur l'Oder"
 nd_sil_oder_commerce_desc: "La rivière Oder forme l'épine dorsale commerciale de la Silésie, transportant des céréales, du bois et des tissus en aval jusqu'aux ports de la Baltique et amenant le sel, le hareng et les produits de luxe étrangers en amont jusqu'aux marchés animés de Breslau."
 nd_sil_magdeburg_law: "Loi silésienne de Magdebourg"
 nd_sil_magdeburg_law_desc: "Les ducs Piast ont invité les colons allemands en Silésie en vertu de la loi de Magdebourg, accordant aux villes l'autonomie gouvernementale, les droits de marché et l'indépendance judiciaire. Ce cadre juridique a transformé les colonies silésiennes en centres urbains prospères."
 nd_sil_piast_fragmentation: "Fragmentation de Piast"
 nd_sil_piast_fragmentation_desc: "La division de la Silésie entre les branches rivales des Piast, qui comptaient à un moment donné dix-sept duchés distincts, a engendré une culture politique particulière : des négociations sans fin, des allégeances flexibles et un talent pour gérer la diversité qui ont bien servi la Silésie sous de plus grands empires."
 nd_sil_linen_weaving: "Tissage de lin silésien"
 nd_sil_linen_weaving_desc: "From the sixteenth century onward, Silesian linen became a prized commodity across Europe. Village weavers in the Sudeten foothills produced cloth that rivaled Flemish and Irish linen, exported through merchant networks to markets as far as the Americas.\n\n#italic Available in: $nd_sil_linen_workshop$#!"
 nd_sil_urban_militia: "Tradition de la milice urbaine"
 nd_sil_urban_militia_desc: "Les villes fortifiées de Silésie entretenaient des milices citoyennes armées d'arbalètes et plus tard d'armes de poing. Ces bourgeois ont défendu leurs privilèges commerciaux avec la même ténacité qu’ils ont appliquée au commerce, formant ainsi une force de défense urbaine fiable."
 nd_sil_breslau_emporium: "Magasin de Breslau"
 nd_sil_breslau_emporium_desc: "Breslau sat astride the junction of the Amber Road and the Via Regia, making it one of Central Europe's great trading cities. Its cloth halls, salt markets, and commodity exchanges connected the Baltic to the Mediterranean. The dark beer of Schweidnitz has been drawn in the cellar beneath its town hall since 1273."
 nd_sil_hussite_defenses: "Défenses hussites"
 nd_sil_hussite_defenses_desc: "Les raids hussites dévastateurs des années 1420 et 1430, qui détruisirent plus de trente villes silésiennes, imposèrent une reconstruction complète des fortifications urbaines. Les murs de pierre, les portes renforcées et les garnisons permanentes sont devenus la norme dans tout le duché."
 nd_sil_crown_land_admin: "Administration des terres de la Couronne"
 nd_sil_crown_land_admin_desc: "Lorsque la Silésie passa à la couronne de Bohême en 1335, puis aux Habsbourg, sa gouvernance fut réorganisée sous des systèmes administratifs centralisés qui apportèrent efficacité fiscale et uniformité juridique à ce duché autrefois fragmenté."
 nd_sil_silver_lead_mines: "Mines d'argent et de plomb"
 nd_sil_silver_lead_mines_desc: "Les montagnes de Haute-Silésie contenaient de riches gisements d'argent et de plomb, exploités par des mineurs qualifiés utilisant des techniques de plus en plus sophistiquées. Tarnowitz et d'autres villes minières sont devenues des centres d'expertise métallurgique."
 nd_sil_oder_trade_tradition: "Réseau de commerce extérieur"
 nd_sil_oder_trade_tradition_desc: "La position de Breslau sur l'Oder, combinée à son appartenance à la Ligue hanséatique, a créé un vaste réseau commercial reliant les tissus et les richesses minières de Silésie au commerce balte, aux marchés de Bohême et aux banques italiennes."
 nd_sil_landsknechte_tradition: "Landsknechte silésienne"
 nd_sil_landsknechte_tradition_desc: "Les villes silésiennes ont fourni une infanterie disciplinée de pique-et-tir aux armées impériales, en s'appuyant sur la tradition militaire allemande du Landsknechte. Ces soldats professionnels ont apporté les dernières innovations tactiques à la guerre silésienne."
 nd_sil_three_crown_diplomacy: "Diplomatie des Trois Couronnes"
 nd_sil_three_crown_diplomacy_desc: "La position de la Silésie entre les couronnes polonaise, bohème et impériale exigeait des compétences diplomatiques exceptionnelles. Les ducs et les conseils municipaux de Silésie sont devenus adeptes de l'art de jouer les suzerains les uns contre les autres, obtenant des privilèges grâce à des négociations minutieuses."
 nd_sil_silesian_printing: "Imprimerie silésienne"
 nd_sil_silesian_printing_desc: "L'introduction de l'imprimerie à Breslau à la fin du XVe siècle a catalysé la vie intellectuelle silésienne. Des tracts protestants, des ouvrages savants et des archives commerciales provenaient des presses silésiennes, faisant du duché un centre d'apprentissage d'Europe centrale."
 nd_sil_breslau_reformation: "Réforme de Breslau"
 nd_sil_breslau_reformation_desc: "La nomination de Johann Hess en 1523 fit de Breslau un bastion oriental du protestantisme. Les églises de la ville se sont converties en masse et la Silésie est devenue l'un des territoires les plus contestés sur le plan religieux de l'Empire."
 nd_sil_mountain_jaegers: "Jaegers des montagnes de Silésie"
 nd_sil_mountain_jaegers_desc: "Les montagnes boisées de la chaîne des Sudètes ont engendré des chasseurs et des bûcherons qualifiés qui, entraînés aux tactiques d'escarmouche, sont devenus une infanterie légère efficace. Ces Jaegers silésiens excellaient dans les embuscades et la guerre irrégulière sur des terrains accidentés."
 nd_sil_linen_export_boom: "Boom des exportations de lin"
 nd_sil_linen_export_boom_desc: "By the seventeenth century, Silesian linen dominated European markets. Merchants from Schweidnitz organized purchase networks reaching every cottage loom in the mountain villages, while export agents shipped cloth to Holland, England, Spain, and their colonial empires. The same valleys send out cut glass from the forest huts of the Schaffgotsch lands."
 nd_sil_habsburg_governance: "Gouvernance des Habsbourg"
 nd_sil_habsburg_governance_desc: "Sous l'administration des Habsbourg à partir de 1526, la Silésie fut intégrée à l'appareil bureaucratique complexe de la monarchie autrichienne. Les fonctionnaires impériaux, les collecteurs d'impôts et les réformes juridiques ont apporté une gouvernance centralisée aux principautés autrefois autonomes."
 nd_sil_religious_coexistence: "Coexistence religieuse silésienne"
 nd_sil_religious_coexistence_desc: "The Treaty of Altranstadt in 1707 secured Protestant worship rights in Silesia, codifying a tradition of religious coexistence that had deep roots in the duchy's multi-ethnic character. Catholic, Protestant, and Schwenckfelder communities learned to share the same valleys. The three Churches of Peace at Glogau, Jauer and Schweidnitz, raised in timber before the town walls after 1648, are its monuments."
 nd_sil_upper_silesian_coal: "Charbon de Haute-Silésie"
 nd_sil_upper_silesian_coal_desc: "Les vastes gisements de charbon de Haute-Silésie ont commencé à être systématiquement exploités à la fin du XVIIIe siècle, propulsés par les premières machines à vapeur de la région. Cette richesse noire allait transformer la Silésie en l'une des grandes zones industrielles d'Europe centrale."
 nd_sil_fusilier_tradition: "Tradition des fusiliers silésiens"
 nd_sil_fusilier_tradition_desc: "Les guerres de Silésie entre la Prusse et l'Autriche ont fait du duché un creuset d'innovation militaire. Les régiments silésiens, entraînés selon le système frédéricien, devinrent parmi les meilleures infanteries de ligne d'Europe."
 nd_sil_breslau_university: "Université de Breslau"
 nd_sil_breslau_university_desc: "The Jesuit university founded in 1702, and its later merger with the Protestant Viadrina in 1811, created a powerhouse of learning that attracted scholars from across the German-speaking world."
 nd_sil_contested_borderland: "Frontière contestée"
 nd_sil_contested_borderland_desc: "Les trois guerres de Silésie entre Frédéric le Grand et Marie-Thérèse ont fait du duché le territoire le plus disputé d'Europe. Cette militarisation constante a forgé une population endurcie, habituée aux exigences de la guerre."
 nd_sil_linen_monopoly: "Monopole du lin silésien"
 nd_sil_linen_monopoly_desc: "At its peak, Silesian linen was exported to England, the Netherlands, France, Spain, Portugal, Scandinavia, Russia, Turkey, and even the markets of Africa and the Americas, a proto-industrial achievement rivaling any in Europe. The finest of it was the white veil linen of Hirschberg, bleached on the valley meadows and sold by the merchant lords of the town.\n\n#italic Available in: $nd_sil_linen_workshop$#!"
 nd_sil_industrial_silesia: "Silésie industrielle"
 nd_sil_industrial_silesia_desc: "La mécanisation de l'industrie silésienne, les métiers à vapeur remplaçant les tisserands, les fours à charbon remplaçant le charbon de bois, transformèrent le duché en l'une des grandes régions industrielles de l'Europe du XIXe siècle."
 nd_sil_weavers_revolt: "La révolte des tisserands"
 nd_sil_weavers_revolt_desc: "Le soulèvement désespéré des tisserands de lin silésiens en 1844, écrasé par les troupes prussiennes, est devenu un symbole du coût humain de l’industrialisation et a inspiré des générations de réformateurs sociaux et d’organisateurs ouvriers."
 nd_sil_iron_and_steel: "Fer et acier de Silésie"
 nd_sil_iron_and_steel_desc: "Upper Silesia's combination of coal, iron ore, and zinc deposits created a heavy industrial complex that rivaled the Ruhr. Steelworks and foundries transformed the landscape and drew workers from across Central Europe.\n\n#italic Available in: $nd_sil_coal_works$#!"
 nd_sil_enlightened_breslau: "Breslau illuminée"
 nd_sil_enlightened_breslau_desc: "Les salons, théâtres et maisons d'édition de Breslau en ont fait l'une des capitales culturelles de l'Allemagne de l'Est. La ville a nourri des poètes, des philosophes et des scientifiques qui ont contribué au mouvement des Lumières au sens large."
 nd_sil_national_awakening: "Réveil national silésien"
 nd_sil_national_awakening_desc: "Le XIXe siècle a amené des mouvements nationaux polonais et allemands concurrents en Silésie, chacun revendiquant l'héritage du duché. Cet éveil de la conscience nationale a remodelé l'identité silésienne et ses relations avec les États voisins."
 a_nd_sil_piast_lancers: "Lanciers Piast silésiens"
 a_nd_sil_piast_lancers_desc: "Cavalerie légère issue des suites ducales Piast, habile aux raids et à la reconnaissance à travers la vallée de l'Oder."
 a_nd_sil_crossbowmen: "Arbalétriers silésiens"
 a_nd_sil_crossbowmen_desc: "Milice bourgeoise armée d'arbalètes, issue des villes fortifiées de Breslau, Schweidnitz et Liegnitz."
 a_nd_sil_jaegers: "Jaegers silésiens"
 a_nd_sil_jaegers_desc: "Light infantry skirmishers recruited from the hunters and woodsmen of the Sudeten mountain forests. They shoot first and aim well, and do not stand a charge."
 a_nd_sil_fusiliers: "Fusiliers silésiens"
 a_nd_sil_fusiliers_desc: "L'infanterie de ligne s'est entraînée dans les traditions rigoureuses des campagnes silésiennes de Frédéric, stable sous le feu et précise dans les volées."
 nd_sil_ducal_stronghold: "Bastion ducal de Silésie"
 nd_sil_ducal_stronghold_desc: "Résidence fortifiée des ducs Piast, alliant centre administratif et garnison militaire. Ces bastions ont ancré la défense silésienne contre les incursions mongoles, hussites et rivales."
 nd_sil_ducal_stronghold_upkeep: "Entretien de la garnison"
 nd_sil_ducal_stronghold_upkeep_desc: "Pierre, armes et outils pour entretenir la garnison et les défenses de la forteresse ducale."
 nd_sil_linen_workshop: "Atelier de lin de Silésie"
 nd_sil_linen_workshop_desc: "Un atelier de tissage produisant du lin fin de Silésie pour l'exportation. Les métiers à tisser de village et les maisons de finition urbaines travaillent ensemble pour créer des textiles prisés sur les marchés européens."
 nd_sil_linen_workshop_upkeep: "Production de lin"
 nd_sil_linen_workshop_upkeep_desc: "Fibres et teintures de lin transformées en toile de lin silésienne sur les métiers à tisser du village."
 nd_sil_mining_pit: "Puits minier de Silésie"
 nd_sil_mining_pit_desc: "Une exploitation minière d'argent et de plomb dans les montagnes de Haute-Silésie, employant des mineurs qualifiés et des techniques d'extraction de plus en plus sophistiquées."
 nd_sil_mining_pit_upkeep: "Opérations minières"
 nd_sil_mining_pit_upkeep_desc: "Le bois pour les étais de mine et le fer pour les outils soutiennent les opérations minières."
 nd_sil_breslau_kontor: "Conseiller commercial de Breslau"
 nd_sil_breslau_kontor_desc: "Une maison de commerce de tradition hanséatique, canalisant le commerce est-ouest qui passe par la position de Breslau, au carrefour de la Route de l'Ambre et de la Via Regia."
 nd_sil_breslau_kontor_upkeep: "Opérations commerciales"
 nd_sil_breslau_kontor_upkeep_desc: "Tissu, papier et sel consommés pour la tenue des registres commerciaux, les inventaires d'échantillons et les opérations commerciales."
 nd_sil_protestant_academy: "Académie protestante de Silésie"
 nd_sil_protestant_academy_desc: "Un établissement d'enseignement né de la Réforme, formant le clergé, les enseignants et les dirigeants civiques à la théologie protestante et à l'apprentissage humaniste."
 nd_sil_protestant_academy_upkeep: "Dépenses académiques"
 nd_sil_protestant_academy_upkeep_desc: "Papier, livres et bougies pour l'enseignement, la correspondance scientifique et la publication de traités protestants."
 nd_sil_coal_works: "Usines de charbon de Silésie"
 nd_sil_coal_works_desc: "Une des premières opérations industrielles d'extraction de charbon en Haute-Silésie, exploitant les vastes gisements qui feraient de la région l'une des grandes zones industrielles d'Europe centrale."
 nd_sil_coal_works_upkeep: "Équipement minier"
 nd_sil_coal_works_upkeep_desc: "Bois et fer pour les étais des fosses, les outils et les machines à vapeur qui pompent l'eau des puits profonds."
 nd_sil_mechanized_mill: "Moulin mécanisé silésien"
 nd_sil_mechanized_mill_desc: "Une usine textile fonctionnant à la vapeur qui représente la transformation de l'industrie silésienne du tissage artisanal à la production mécanisée."
 nd_sil_mechanized_mill_upkeep: "Opérations d'usine"
 nd_sil_mechanized_mill_upkeep_desc: "Des moteurs à vapeur alimentés au charbon font fonctionner les métiers à tisser mécanisés qui tissent les fibres de lin pour en faire des tissus à l'échelle industrielle."
 levy_nd_sil_piast_lancers: "Lanciers Piast silésiens"
 levy_nd_sil_piast_lancers_desc: "Serviteurs à cheval des ducs silésiens Piast, issus de la noblesse et des soldats professionnels."
 levy_nd_sil_crossbowmen: "Arbalétriers de la ville de Silésie"
 levy_nd_sil_crossbowmen_desc: "Milice urbaine issue de la classe bourgeoise et des soldats de garnison des villes commerciales fortifiées de Silésie."
 nd_sil_linen_finishing: "Finition du lin de Silésie"
 nd_sil_linen_finishing_desc: "Des techniques raffinées de blanchiment et de finition qui confèrent au lin silésien sa qualité et son éclat distinctifs."
 nd_sil_schleierleinen: "Hirschberg Veil Linen"
 nd_sil_schleierleinen_desc: "Woven linen is boiled in wood ash lye and laid out on the meadows for weeks until it is white and sheer. It needs no dye at all."
 nd_sil_friedenskirche: "Church of Peace"
 nd_sil_friedenskirche_desc: "A Lutheran church granted by the Peace of Westphalia to a town of Habsburg Silesia: built of timber, clay and straw outside the walls, without tower or bell. It can be raised only where the people follow another faith than their ruler. Its congregation stays quiet, and stays Protestant."
 nd_sil_friedenskirche_upkeep: "Parish Upkeep"
 nd_sil_friedenskirche_upkeep_desc: "Timber for the frame and galleries, candles, and hymnals for a congregation of thousands."
 nd_sil_brewhouse: "Schweidnitz Brewhouse"
 nd_sil_brewhouse_desc: "A town brewhouse of the kind that made Schweidnitz known: dark strong beer, brewed by right of the town charter and carted to the cellars of Breslau."
 nd_sil_beer_brewing: "Schweidnitz Beer"
 nd_sil_beer_brewing_desc: "Wheat is malted and brewed over a wood fire into the dark strong beer of the Silesian towns."
 nd_sil_glass_hut: "Sudeten Glass Hut"
 nd_sil_glass_hut_desc: "A glassworks in the mountain forest, of the kind worked at Schreiberhau since 1366. The hut is moved on when the wood around it is burnt."
 nd_sil_glassmaking: "Silesian Cut Glass"
 nd_sil_glassmaking_desc: "Sand is melted with wood ash and Silesian lead into a clear heavy glass, which the valley's cutters engrave."
 nd_sil_iron_smelting: "Fonderie de fer silésienne"
 nd_sil_iron_smelting_desc: "Usines sidérurgiques au charbon transformant le minerai de Haute-Silésie en fonte brute et en acier pour la construction, l'armement et l'industrie."
 nd_sil_formed_tt: "La Silésie s'est formée"
 nd_sil_path_a_tt: "A choisi le carrefour des trois couronnes"
 nd_sil_path_b_tt: "Choisissez le pays du lin et de l'argent"
 nd_sil_destiny: "Destin silésien"
 nd_sil_destiny_desc: "La Silésie unie est prête à tracer sa voie. Les duchés fracturés de Piast ont été regroupés en un seul État, et la question est désormais de savoir quel type de puissance la Silésie deviendra."
 nd_sil_dest_three_crowns_1: "La couronne polonaise"
 nd_sil_dest_three_crowns_1_desc: "Les liens les plus anciens de la Silésie s'étendent au sud et à l'est jusqu'à Cracovie, siège des rois Piast qui dirigeaient autrefois ces terres. Pour faire nos preuves en tant que pont entre les royaumes, nous devons d’abord récupérer la ville où a commencé l’histoire de la Silésie et de la Pologne."
 nd_sil_dest_three_crowns_2: "La couronne de Bohême"
 nd_sil_dest_three_crowns_2_desc: "Prague nous fait signe. La couronne de Bohême revendique la Silésie depuis 1335, et nous allons maintenant inverser cette relation. Contrôlez la ville dorée et ses banques, et la politique de l’Europe centrale se pliera à la diplomatie silésienne."
 nd_sil_dest_three_crowns_3: "La couronne impériale"
 nd_sil_dest_three_crowns_3_desc: "Vienne, siège des Habsbourg et de la Diète impériale, est la récompense ultime. Ce n'est qu'en plaçant les trois villes de la couronne sous l'autorité silésienne que nous pourrons accomplir le destin de l'État carrefour, non pas sujet des empires, mais leur arbitre."
 nd_sil_dest_industry_1: "Bohème Argent"
 nd_sil_dest_industry_1_desc: "Les légendaires mines d'argent de Kutna Hora financent les rois de Bohême depuis des siècles. L'extension du contrôle silésien sur ces mines permettrait de réunir les districts miniers les plus riches d'Europe centrale sous une seule administration."
 nd_sil_dest_industry_2: "Commerce balte"
 nd_sil_dest_industry_2_desc: "L'Oder transporte notre linge vers le nord, mais le commerce baltique est dominé par Lübeck et ses partenaires hanséatiques. Pour devenir une véritable puissance commerciale, la Silésie doit s'emparer de la porte baltique et contrôler toute la chaîne, du métier à tisser au navire."
 nd_sil_dest_industry_3: "Cœur industriel"
 nd_sil_dest_industry_3_desc: "Leipzig's trade fairs draw merchants from across Europe. Combined with Silesian coal, iron, and linen, control of this commercial hub would make our industrial heartland the workshop of Central Europe. Breslau itself is to be built up into a great city."
 nd_sil_dest_wroclaw_developed_tt: "We own #bold Breslau#! and its development is at least #bold 52#!"
 nd_sil.5.t: "Le destin silésien"
 nd_sil.5.d: "Le duché est uni et notre cap est fixé. Que ce soit grâce à la diplomatie entre couronnes ou à la richesse des métiers à tisser et des puits de mines, la Silésie atteindra tout son potentiel. Les traditions des ducs Piast, leur courage, leur esprit d'entreprise, leur talent à gouverner la diversité nous feront avancer dans une nouvelle ère."
 nd_sil.5.a: "La Silésie accomplira son destin."
 nd_sil.6.t: "Les chutes de Cracovie aux bras de Silésie"
 nd_sil.6.d: "The ancient capital of the Piast kings now flies the Silesian banner. Krakow, where Boleslaw the Brave was crowned and where generations of Polish monarchs held court, has passed under our authority. It is a potent symbol, the branch of the Piast dynasty that ruled Silesia has now reclaimed the seat of its ancestors.\n\nThe Polish crown, once Silesia's overlord, must now reckon with a Silesian state that controls the headwaters of both the Oder and the Vistula."
 nd_sil.6.a: "L'héritage Piast est restauré."
 nd_sil.7.t: "Prague sous la suzeraineté silésienne"
 nd_sil.7.d: "Two of the three crowns are ours. Prague, the golden city on the Moldau, whose Bohemian kings once summoned Silesian dukes to pay homage, now answers to Breslau. The reversal is extraordinary, from vassal to overlord in the span of generations.\n\nWith Prague comes its chancery, its banking houses, and its centuries of administrative tradition. Shall we absorb the Bohemian bureaucratic apparatus to run our growing realm with precision? Or shall we embrace the martial legacy of the Hussite wars, drawing on Bohemia's proven military traditions to forge an army that can challenge any power in Central Europe?"
 nd_sil.7.a: "Absorbez la chancellerie de Bohême."
 nd_sil.7.b: "Embrassez l’héritage militaire hussite."
 nd_sil.8.t: "Arbitre des Trois Couronnes"
 nd_sil.8.d: "Vienna is ours. The seat of Habsburg power, the capital of the Holy Roman Empire, the city that has dictated Central European politics for centuries, all under the Silesian banner. From Krakow to Prague to Vienna, the three crowns that once competed for control of Silesia now answer to it.\n\nThis is unprecedented. A duchy once divided among seventeen petty princes has become the paramount power of Central Europe. Shall we use this position to become the Empire's supreme arbitrator, settling disputes from the Baltic to the Adriatic through diplomacy? Or shall we embrace the reality of our new power and forge a Central European hegemony backed by overwhelming military might?"
 nd_sil.8.a: "Nous serons le juste arbitre de l'Empire."
 nd_sil.8.b: "L’Europe centrale s’incline devant la puissance silésienne."
 nd_sil.9.t: "Les mines de Kutná Hora"
 nd_sil.9.d: "Silesian miners now work alongside their Bohemian counterparts in the legendary silver mines of Kutna Hora. For centuries, the groschen minted from this silver financed Bohemian kings and paid Imperial armies. Now that wealth flows through Silesian banks and Silesian counting houses.\n\nCombined with our own mines at Tarnowitz and Zlotoryja, Silesia now controls the richest mineral belt in Central Europe. The looms and the mines, the twin pillars of Silesian prosperity, grow stronger together."
 nd_sil.9.a: "Argent de Bohême, lin de Silésie."
 nd_sil.10.t: "Navires silésiens dans le port de Lübeck"
 nd_sil.10.d: "The great Hanseatic port of Lubeck answers to Silesia. For the first time, the linen and minerals that flow down the Oder need not pass through middlemen to reach the Atlantic markets; our own merchants control the entire chain from workshop to wharf.\n\nShall we claim the old Hanseatic trading privileges for ourselves, opening our markets to the free flow of Baltic commerce? Or shall we exploit our monopoly over the Oder shipping route, taxing every bale of cloth and barrel of goods that passes between Silesia and the sea?"
 nd_sil.10.a: "Réclamez les privilèges hanséatiques."
 nd_sil.10.b: "Monopoliser la route maritime de l’Oder."
 nd_sil.11.t: "L'Atelier de l'Europe Centrale"
 nd_sil.11.d: "Leipzig's great trade fairs, the Michaelmas Fair, the Easter Fair, the New Year Fair, now serve as the showroom for Silesian industry. Coal from Upper Silesia fires the furnaces, iron feeds the forges, and linen drapes the stalls. Our industrial heartland stretches from the Sudeten mountains to the Saxon plain.\n\nThis is the apex of the Silesian economic miracle. Shall we entrust this vast industrial complex to the factory owners and mine operators, letting their capital and ambition drive relentless growth? Or shall we foster a spirit of merchant enterprise, keeping commerce open, credit cheap, and markets competitive?"
 nd_sil.11.a: "Laissons les chefs d’usine diriger notre croissance."
 nd_sil.11.b: "Le commerce et l'entreprise seront notre voie."
 STATIC_MODIFIER_NAME_nd_sil_dest_bohemian_chancellery: "Chancellerie de Bohême"
 STATIC_MODIFIER_DESC_nd_sil_dest_bohemian_chancellery: "L'appareil administratif de la couronne de Bohême a été intégré à la gouvernance silésienne, apportant des siècles d'expertise bureaucratique à notre royaume en pleine croissance."
 STATIC_MODIFIER_NAME_nd_sil_dest_hussite_alliance: "L'héritage militaire hussite"
 STATIC_MODIFIER_DESC_nd_sil_dest_hussite_alliance: "Les traditions martiales des guerres hussites ont été absorbées dans la doctrine militaire silésienne. Les forts à chariots, les tactiques de siège agressives et l'esprit combatif des héritiers de Zizka renforcent nos armées."
 STATIC_MODIFIER_NAME_nd_sil_dest_imperial_arbitrator: "Arbitre impérial"
 STATIC_MODIFIER_DESC_nd_sil_dest_imperial_arbitrator: "Le contrôle de la Silésie sur les trois villes de la couronne en fait l'arbitre naturel des conflits d'Europe centrale. Nos diplomates règlent les conflits de la Baltique aux Alpes."
 STATIC_MODIFIER_NAME_nd_sil_dest_central_european_hegemon: "Hégémon d’Europe centrale"
 STATIC_MODIFIER_DESC_nd_sil_dest_central_european_hegemon: "La main-d’œuvre et les ressources combinées de trois royaumes soutiennent un établissement militaire qu’aucune puissance d’Europe centrale ne peut contester. L’hégémonie silésienne est maintenue par l’épée."
 STATIC_MODIFIER_NAME_nd_sil_dest_hanseatic_privileges: "Privilèges hanséatiques"
 STATIC_MODIFIER_DESC_nd_sil_dest_hanseatic_privileges: "Les anciens droits commerciaux et privilèges de marché hanséatiques servent désormais les marchands silésiens, ouvrant les ports de la Baltique à notre linge, nos minéraux et nos produits manufacturés."
 STATIC_MODIFIER_NAME_nd_sil_dest_oder_shipping_monopoly: "Monopole d'expédition"
 STATIC_MODIFIER_DESC_nd_sil_dest_oder_shipping_monopoly: "Le contrôle de l'ensemble de la voie navigable de l'Oder, de la source à la mer, confère à la Silésie la mainmise sur le commerce nord-sud de l'Europe centrale. Chaque commerçant paie le péage silésien."
 STATIC_MODIFIER_NAME_nd_sil_dest_factory_lords: "Seigneurs d'usine"
 STATIC_MODIFIER_DESC_nd_sil_dest_factory_lords: "Les grands industriels de Haute-Silésie mènent une expansion incessante, construisant des usines, détruisant des mines et attirant des travailleurs de toute l’Europe centrale. Growth comes at the price of social complacency."
 STATIC_MODIFIER_NAME_nd_sil_dest_merchant_republic_spirit: "Esprit de la République marchande"
 STATIC_MODIFIER_DESC_nd_sil_dest_merchant_republic_spirit: "La vieille tradition de Breslau d'auto-gouvernance marchande s'est étendue à tout le cœur industriel de Silésie. Le crédit bon marché, la protection des mercenaires et le commerce libéral alimentent une prospérité durable."
 nd_sil_diplomatic_residence: "Résidence diplomatique silésienne"
 nd_sil_diplomatic_residence_desc: "Une résidence somptueuse au cœur de Breslau accueillant des ambassadeurs de toute l'Europe centrale. Ce grand bâtiment sert de terrain neutre où se règlent les affaires de trois couronnes."
 nd_sil_diplomatic_residence_upkeep: "Dépenses diplomatiques"
 nd_sil_diplomatic_residence_upkeep_desc: "Les tissus fins, le papier et les meubles étaient consommés au cours du cycle constant de réceptions et de négociations diplomatiques."
 nd_sil_trade_hall: "Halle commerciale de Silésie"
 nd_sil_trade_hall_desc: "Un grand marché commercial où les tissus, les minéraux et les produits manufacturés de Silésie s'échangent aux côtés des produits baltes. Le cœur battant de l’économie d’Europe centrale."
 nd_sil_trade_hall_upkeep: "Opérations Commerciales"
 nd_sil_trade_hall_upkeep_desc: "Des documents papier, des échantillons de tissus et des outils de pesée et de mesure soutiennent les opérations quotidiennes de la bourse."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_sil_bureaucracy_authority: "Schlesische Verwaltung"
 AUTO_MODIFIER_DESC_nd_sil_bureaucracy_authority: "La Silésie hérite de la boîte à outils institutionnelle à plusieurs niveaux d’une région frontalière de la couronne de Bohême : le Frstentag des ducs et des villes royales à Breslau, l’Oberamt du gouverneur de Bohême, la principauté temporelle de l’évêché de Wroclaw sur Nysa-Grodkw, le code minier imprimé qui régissait le boom de l’argent-plomb de Tarnowitz et la mosaïque de duchés de cadets de Piast. Choisissez les institutions à maintenir en vie."

 sil_furstentag_bureaucracy: "Étiquette Schlesischer Frstentag"
 sil_furstentag_bureaucracy_desc: "La Diète des princes de Silésie, convoquée à Breslau, réunissait les ducs cadets de Piast et d'Erbfrsten, le prince-évêque de Wroclaw et les députés des six villes royales de Silésie. Le Frstentag accordait des impôts, augmentait le prélèvement territorial et réglait les différends entre les duchés. Comparés à la Bohême ou à la Saxe, les domaines silésiens étaient inhabituellement fragmentés, mais difficiles à contraindre pour le roi de Bohême : ils traitaient la couronne comme un partenaire extérieur et survécurent comme un véritable contrôle du pouvoir royal jusqu'aux réformes de Ferdinand II après 1629."

 sil_oberamt_bureaucracy: "Oberamt Schlesisches"
 sil_oberamt_bureaucracy_desc: "Siège social de la couronne de Bohême en Silésie, dirigé par l'Oberlandeshauptmann à Wroclaw. Le premier titulaire, l'évêque Konrad d'Oels, fut nommé le 16 avril 1422 par le roi Sigismond pour organiser la défense contre les Hussites. Sous Matthias Corvinus, la fonction devint permanente en 1474, devançant les gouverneurs territoriaux des duchés et exerçant une juridiction volontaire sur les princes. Après 1629, l'empereur Ferdinand II transforma l'Oberamt d'un corps représentatif en une bureaucratie purement impériale et le principal instrument de la centralisation des Habsbourg en Silésie."

 sil_bischofsamt_bureaucracy: "Bistum Breslau"
 sil_bischofsamt_bureaucracy_desc: "Le prince-évêché de Wroclaw comme régime temporel. L'évêque Jaroslaw d'Opole reçut Nysa de son père Boleslaw Ier en 1198 ; en 1290, le duc Henrik IV confirma la souveraineté de l'évêque sur Nysa et Ottmachau, et l'évêque Przeclaw de Pogorzela acheta le duché de Grodkw en 1342. Par la suite, les évêques de Breslau dirigèrent de leur propre chef le duché de Nysa-Grodkw, prirent préséance sur les autres dirigeants silésiens et dirigèrent le réseau d'écoles catholiques qui ancra la province contre l'empiétement luthérien de la Saxe voisine et Bohême."

 sil_bergordnung_bureaucracy: "Tarnowitzer Bergordnung"
 sil_bergordnung_bureaucracy_desc: "Le code minier de Haute-Silésie. La galène, un minerai de plomb contenant de l'argent, a été découverte à Tarnowice vers 1490 ; en 1526, le duc Jan II d'Opole et le margrave Georges de Brandebourg-Ansbach publièrent l'Akt Wolnosci Grniczej accordant la Bergfreiheit, et en 1528 l'Ordunek Grny codifia les droits des mineurs libres, les parts de minerai et la discipline des équipes. Au milieu du XVIe siècle, Tarnowskie Gry était le plus grand centre minier d'Europe centrale et orientale - quelque sept mille puits de base et sept galeries de drainage - attirant des mineurs de tout l'Empire et transformant la Haute-Silésie en un atout fiscal des Habsbourg qui survécut intact jusqu'à la conquête de Frédéric II en 1742."

 sil_erbfurstentumer_bureaucracy: "Schlesische Erbfrstentmer"
 sil_erbfurstentumer_bureaucracy_desc: "Les duchés cadets Piast héréditaires. À la suite du Testament de Boleslas III en 1138, la Silésie fut partagée entre les descendants de Ladislas II l'Exilé et progressivement divisée en Liegnitz, Brieg, Schweidnitz-Jauer, Glogau, Sagan, Münsterberg-Oels, Teschen et une douzaine de principautés mineures. Chaque duché conservait sa propre cour ducale et sa propre administration domestique ; le dernier Piast silésien, Georges-Guillaume de Liegnitz, mourut en 1675. Le système multiplia les fonctions nobles et produisit une tradition de droit civil plus riche que les principautés allemandes centralisées, mais il fragmenta également la souveraineté d'une manière que la couronne de Bohême a passé trois siècles à tenter d'inverser."
