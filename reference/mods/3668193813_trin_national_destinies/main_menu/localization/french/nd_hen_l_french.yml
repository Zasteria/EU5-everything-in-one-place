 STATIC_MODIFIER_NAME_nd_hen_yr_awen: "Année Awen"
 STATIC_MODIFIER_DESC_nd_hen_yr_awen: "L’inspiration poétique divine traverse à nouveau les bardes du Vieux Nord. Là où les Cynfeirdd chantaient autrefois les héros, une nouvelle génération préserve la langue cumbrique et les anciennes lois du peuple brithonique."
 STATIC_MODIFIER_NAME_nd_hen_cleddyf_y_gogledd: "Cleddyf et Gogledd"
 STATIC_MODIFIER_DESC_nd_hen_cleddyf_y_gogledd: "L'épée du Nord est à nouveau tirée. Alors qu'Urien chassait autrefois les Angles des rives de Lindisfarne, les guerriers de Hen Ogledd marchent pour reconquérir chaque colline et chaque vallée qui étaient autrefois Brythonic."
 STATIC_MODIFIER_NAME_nd_hen_gododdin_recited: "Les héros de Catraeth"
 STATIC_MODIFIER_DESC_nd_hen_gododdin_recited: "Les vers de Y Gododdin résonnent dans chaque salle. Trois cents sont allés à Catraeth et presque tous sont tombés, mais leur sacrifice est devenu la norme immortelle par laquelle tous les guerriers du Vieux Nord sont mesurés."
 STATIC_MODIFIER_NAME_nd_hen_rock_of_clyde: "Rocher de la Clyde"
 STATIC_MODIFIER_DESC_nd_hen_rock_of_clyde: "Alt Clut se présente une fois de plus comme le siège imprenable du pouvoir brithonique. Là où Dumbarton Rock s'élève au-dessus de la rivière, aucun envahisseur ne peut passer sans être contesté."
 nd_hen.1.t: "Le vieux Nord renaît"
 nd_hen.1.d: "The disparate Brythonic kingdoms of the north (Rheged, Gododdin, Strathclyde, Elmet) have been reunited under a single crown for the first time since the age of Urien and Taliesin. The Cumbric tongue is spoken from the Firth of Forth to the Humber, and the old genealogies of the Gwyr y Gogledd bind this realm together.\n\nBut what kind of realm shall this be? The bards who preserved the memory of the Old North through centuries of Saxon and Norse domination now look to us for guidance. Shall we be the guardians of an ancient culture reborn, nurturing the poetic and legal traditions that make us distinct? Or shall we be the avengers of Catraeth, wielding the sword to carve out a kingdom worthy of Urien's legacy?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_hen.1.a: "Laissez les Awen nous guider - nous sommes les gardiens de la flamme"
 nd_hen.1.b: "L'épée du Nord ne restera pas dans son fourreau"
 nd_hen.2.t: "Y Gododdin"
 nd_hen.2.d: "In the great hall, by firelight, a bard rises to recite the oldest and most sacred verses of the Brythonic people. Y Gododdin: the elegy of Aneirin for the three hundred warriors who rode from Din Eidyn to Catraeth, there to fight against overwhelming Anglian numbers. Nearly all were slain, yet their names live on in immortal verse.\n\nThe poem's opening lines are known to every warrior in the realm: 'Gwyr a aeth Gatraeth oedd ffraeth eu llu': 'Men went to Catraeth, keen was their host.' It is not merely a memorial but a sacred bond between past and present, reminding all who hear it that courage in the face of destruction is the highest virtue of the Old North.\n\nTonight, the warriors who listen vow to be worthy of those ancient heroes."
 nd_hen.2.a: "Leur sacrifice ne sera jamais oublié"
 nd_hen.3.t: "Le Rocher de la Clyde"
 nd_hen.3.d: "Dumbarton Rock (Alt Clut in the old tongue, the Rock of the Clyde) has been the seat of Brythonic power in the north since before memory. Rising two hundred and forty feet above the river, its basalt summit has never been taken by direct assault. When the Norse kings Amlaib and Imar besieged it in 870, they required four months and the cutting of its water supply to force its submission.\n\nNow the fortress has been expanded and reinforced with the latest defensive works. A new curtain wall encircles the summit, and the garrison has been doubled. From this impregnable perch, the rulers of Hen Ogledd can command the entire course of the Clyde and control all movement between the Scottish Lowlands and the western sea."
 nd_hen.3.a: "Alt Clut restera éternel"
 nd_hen_gododdin_legacy: "Y Gododdin"
 nd_hen_gododdin_legacy_desc: "L'ancien poème d'Aneirin commémorant les guerriers brithoniques tombés à la bataille de Catraeth inspire aux soldats de Hen Ogledd des récits de bravoure altruiste."
 nd_hen_teulu_warband: "The Gosgordd"
 nd_hen_teulu_warband_desc: "La bande personnelle du roi composée de serviteurs à cheval, liés par serment et par parenté, constitue le noyau d'élite de la tradition militaire brithonique."
 nd_hen_cattle_lords: "Seigneurs des troupeaux"
 nd_hen_cattle_lords_desc: "L'économie pastorale de l'élevage du nord brithonique, où la richesse se mesure en bétail et où le pouvoir de la cour royale découle de ses troupeaux."
 nd_hen_cynfeirdd: "Le Cynfeirdd"
 nd_hen_cynfeirdd_desc: "Les premiers poètes (Taliesin et Aneirin au premier rang) qui ont chanté les exploits des rois brithoniques et préservé l'identité culturelle du Vieux Nord à travers des siècles de conflit."
 nd_hen_cumbric_law: "Loi Cumbrique"
 nd_hen_cumbric_law_desc: "The legal customs of the Brythonic north, blending ancient tribal practice with remnants of Roman administration into a distinctive jurisprudence."
 nd_hen_alt_clut_fortress: "Alt Clut"
 nd_hen_alt_clut_fortress_desc: "Le Rocher de la Clyde, Dumbarton Rock, où les rois brithoniques tiennent leur cour depuis le départ des légions romaines. Son sommet basaltique résiste au siège depuis des siècles."
 nd_hen_brythonic_smiths: "Forge brithonique"
 nd_hen_brythonic_smiths_desc: "The metalworkers of the Old North produce fine swords, shields, and torcs in a tradition stretching back to the Iron Age Britons. The gof keeps his forge under the protection of the law."
 nd_hen_clyde_trade: "Commerce de Clyde"
 nd_hen_clyde_trade_desc: "The River Clyde serves as the commercial artery of the western Old North, connecting the interior with Irish and continental traders. Hides tanned in the bark houses along its banks go downriver as leather."
 nd_hen_cumbric_church: "L'église de Cumbric"
 nd_hen_cumbric_church_desc: "Le christianisme du Vieux Nord suit des traditions insulaires distinctes de celles de Rome et de Cantorbéry, avec ses propres pratiques monastiques et son propre calendrier."
 nd_hen_frontier_spearmen: "Lanciers de la frontière"
 nd_hen_frontier_spearmen_desc: "Les terres frontalières de Hen Ogledd engendrent des lanciers disciplinés, endurcis par une guerre de frontière constante contre les Angles, les Gaels et les Scandinaves."
 nd_hen_wool_trade: "Commerce de la laine du Nord"
 nd_hen_wool_trade_desc: "The upland pastures of the Pennines and Southern Uplands produce high-quality wool, which Brythonic weavers transform into sought-after cloth. Fulling mills are raised on the upland streams."
 nd_hen_northern_alliance: "L'Alliance du Nord"
 nd_hen_northern_alliance_desc: "Suivant l'exemple d'Urien de Rheged qui forgeait des coalitions entre les rois brithoniques contre l'ennemi commun, le Vieux Nord maîtrise l'art de la diplomatie des alliances."
 nd_hen_border_strongholds: "Forteresses frontalières"
 nd_hen_border_strongholds_desc: "A network of hilltop fortifications guards the marches of Hen Ogledd, each stronghold mutually supporting its neighbors and controlling the passes."
 nd_hen_manuscript_tradition: "Tradition manuscrite"
 nd_hen_manuscript_tradition_desc: "The bardic halls of the Old North produce illuminated manuscripts preserving the poetry, laws, and histories of the Brythonic people for posterity.\n\n#italic Available in: $nd_hen_neuadd_y_beirdd$#!"
 nd_hen_border_riders: "Cavaliers frontaliers"
 nd_hen_border_riders_desc: "Des raiders à cheval rapides qui patrouillent les marches frontalières, experts en tactiques de délit de fuite sur le terrain accidenté du pays frontalier."
 nd_hen_bardic_preservation: "Préservation bardique"
 nd_hen_bardic_preservation_desc: "The bardic schools of the Old North systematically preserve and teach the Cumbric language, ensuring the oral traditions and legal codes survive the pressure of surrounding cultures."
 nd_hen_kingdom_reunited: "Royaume réuni"
 nd_hen_kingdom_reunited_desc: "Les royaumes brithoniques séparés du nord sont consolidés sous une seule couronne, mettant fin à des siècles de fragmentation et concrétisant la vision d'un Vieux Nord unifié."
 nd_hen_pennine_mines: "Mines Pennines"
 nd_hen_pennine_mines_desc: "The lead and coal deposits of the Pennine hills have been exploited since Roman times. Under Brythonic governance, organized mining brings new wealth to the Old North. Bole hearths are lit on the windy brows above the ore fields."
 nd_hen_standing_army: "Milwyr et Gogledd"
 nd_hen_standing_army_desc: "L'ancien système de bandes de guerre teulu cède la place à une armée permanente permanente (les Soldats du Nord) entraînés et équipés selon les normes modernes tout en conservant l'esprit martial des guerriers Gododdin."
 nd_hen_coastal_trade: "Commerce côtier"
 nd_hen_coastal_trade_desc: "Les ports de la Clyde, de Solway et de la côte de Northumbrie se transforment en centres prospères de commerce côtier et transmanche avec l'Irlande, la Scandinavie et le continent."
 nd_hen_council_of_the_north: "Conseil du Nord"
 nd_hen_council_of_the_north_desc: "S'appuyant sur les traditions brithoniques de conseil et de consentement, un conseil formel conseille la couronne et façonne la gouvernance du royaume."
 nd_hen_northern_industry: "Industrie du Nord"
 nd_hen_northern_industry_desc: "The coalfields and iron deposits of the Old North support a growing proto-industrial economy, forging weapons, tools, and the material foundations of modern power.\n\n#italic Available in: $nd_hen_gefail$#!"
 nd_hen_cumbric_revival: "La renaissance du Cumbric"
 nd_hen_cumbric_revival_desc: "Une renaissance littéraire et culturelle récupère la langue cumbrique après des siècles de marginalisation, produisant de nouvelles poésies, histoires et textes juridiques inspirés de la tradition Cynfeirdd."
 nd_hen_industrial_north: "Nord industriel"
 nd_hen_industrial_north_desc: "Les bassins houillers du nord et les vallées fluviales deviennent le cœur d'une révolution industrielle, avec des moulins, des fonderies et des usines transformant le paysage de Hen Ogledd."
 nd_hen_clyde_shipyards: "Chantiers navals de Clyde"
 nd_hen_clyde_shipyards_desc: "Les rives de la rivière Clyde, qui abritaient autrefois de simples villages de pêcheurs, abritent désormais de grands chantiers navals qui lancent des navires destinés au commerce et à la guerre sur les océans du monde."
 nd_hen_democratic_tradition: "Tradition démocratique"
 nd_hen_democratic_tradition_desc: "L'ancienne pratique brithonique de gouvernance par conseil et consentement évolue vers une tradition démocratique moderne, donnant la parole aux gens ordinaires du Vieux Nord."
 a_nd_hen_teulu: "Gosgordd"
 a_nd_hen_teulu_desc: "The king's personal warband of mounted retainers, the gosgordd ride as the elite shock cavalry of the Old North. Bound by oaths of loyalty and inspired by the heroes of Y Gododdin, they charge with reckless valor."
 a_nd_hen_gosgordd: "Gosgordd"
 a_nd_hen_gosgordd_desc: "Lanciers frontaliers de Hen Ogledd, les gosgordd sont des fantassins endurcis entraînés sur le terrain accidenté des marches frontalières. Ils excellent à tenir bon face à un nombre supérieur dans les collines et les cols de montagne."
 a_nd_hen_border_rider: "Cavalier frontalier"
 a_nd_hen_border_rider_desc: "Des pillards à cheval rapides qui connaissent tous les cols, gués et vallées cachées du pays frontalier. Ils frappent rapidement, pillent rapidement et disparaissent avant que l'ennemi puisse réagir."
 a_nd_hen_milwyr: "Milwyr et Gogledd"
 a_nd_hen_milwyr_desc: "Les Soldats du Nord, une force d'infanterie permanente et disciplinée qui remplace les anciennes troupes de guerre par des troupes professionnelles équipées d'armes et de tactiques modernes."
 levy_nd_hen_teulu: "Gosgordd"
 levy_nd_hen_teulu_desc: "Les serviteurs montés assermentés du roi, liés par serment de monter à ses côtés au combat."
 levy_nd_hen_gosgordd: "Lanciers de Gosgordd"
 levy_nd_hen_gosgordd_desc: "Infanterie frontalière prélevée dans les communautés frontalières, endurcie par des générations de conflits."
 levy_nd_hen_border_rider: "Prélèvement des frontaliers"
 levy_nd_hen_border_rider_desc: "Cavaliers légers recrutés lors des marches frontalières, éclaireurs experts et pillards."
 nd_hen_llys: "Llys"
 nd_hen_llys_desc: "La salle d'audience royale d'un roi brithonique, où la justice est rendue, où le tribut du bétail est collecté et où les bardes chantent les généalogies de la maison régnante."
 nd_hen_neuadd_y_beirdd: "Neuadd et Beirdd"
 nd_hen_neuadd_y_beirdd_desc: "La salle des Bardiques, où les traditions poétiques de Taliesin et d'Aneirin sont enseignées aux nouvelles générations et où la langue cumbrique est préservée à travers les vers et les chants."
 nd_hen_dinas: "Dinas"
 nd_hen_dinas_desc: "Une forteresse perchée dans la tradition brithonique, dominant la campagne environnante depuis une position élevée. Construites sur des affleurements rocheux naturels, ces forteresses sont presque insensibles aux assauts."
 nd_hen_court_of_justice: "Cour de justice"
 nd_hen_court_of_justice_desc: "Les Llys rendent la justice selon les coutumes juridiques de Cumbric, résolvant les différends et collectant les tributs de tout le royaume."
 nd_hen_cattle_tithe: "Cattle Tithe Tanning"
 nd_hen_cattle_tithe_desc: "The hides of the cattle rendered to the court are laid in pits of oak bark for a year and come out as leather for trade."
 nd_hen_wool_weaving: "Fulling"
 nd_hen_wool_weaving_desc: "The web woven from upland wool is beaten in fuller's earth under water-driven hammers until it thickens into cloth."
 nd_hen_gefail: "Gefail"
 nd_hen_gefail_desc: "The forge of the gof. In Brythonic law smithcraft is one of the three arts a bondsman's son may not learn without his lord's leave, and the court smith is an officer of the king's household."
 nd_hen_ironmongery: "Ironmongery"
 nd_hen_ironmongery_desc: "The forges turn from the sword to the trade in nails, edge tools and hardware."
 nd_hen_barcdy: "Barcdy"
 nd_hen_barcdy_desc: "The bark house, a tannery on the river bank. Hides lie in pits of oak bark and running water before they are carried downriver."
 nd_hen_pandy: "Pandy"
 nd_hen_pandy_desc: "The fulling mill on an upland stream. A water wheel lifts the hammers that beat and thicken the web."
 nd_hen_bole_hill: "Bole Hill"
 nd_hen_bole_hill_desc: "A smelting hearth on a windy brow of the ore field. Lead ore and brushwood are stacked in a ring of stones, and the west wind does the work of bellows."
 nd_hen_bole_smelting: "Bole Smelting"
 nd_hen_bole_smelting_desc: "Ore from the grooves is smelted with brushwood on the open hill when the wind is strong."
 nd_hen_bardic_training: "Entraînement bardique"
 nd_hen_bardic_training_desc: "Le Neuadd y Beirdd maintient la tradition rigoureuse de l'éducation bardique, formant des apprentis poètes aux mètres complexes et aux généalogies de la tradition cumbrique."
 nd_hen_manuscript_copying: "Copie de manuscrits"
 nd_hen_manuscript_copying_desc: "The hall turns to copying for patrons: illuminated books of the poetry, laws, and histories of the Old North."
 nd_hen_garrison_upkeep: "Garnison frontière"
 nd_hen_garrison_upkeep_desc: "La garnison des Dinas maintient sa surveillance sur les marches frontalières, consommant armes, provisions et matériaux de construction."
 nd_hen_forge_work: "Forge brithonique"
 nd_hen_forge_work_desc: "The smiths produce fine weapons in the tradition of Brythonic metalwork, forging swords, spearheads, and shields."
 nd_hen_formed_tt: "Formé#bold Poule Ogledd#!"
 nd_hen_path_a_tt: "A choisi le destin#bold An Awen#!"
 nd_hen_path_b_tt: "Choisissez le destin#bold Cleddyf et Gogledd#!"
 nd_hen_dest_halls_2_tt: "At least #bold 2#! of our locations have a #bold Neuadd y Beirdd#!"
 nd_hen_destiny: "Le Vieux Nord consolidé"
 nd_hen_destiny_desc: "Les royaumes brithoniques ont été réunis sous une seule couronne. La stabilité doit être maintenue avant que le royaume puisse poursuivre son plus grand destin."
 nd_hen_dest_cumbric_schools: "Écoles du Cynfeirdd"
 nd_hen_dest_cumbric_schools_desc: "Establish centers of Brythonic learning by raising bardic halls in two towns and securing a supply of paper for the scribes and scholars who will carry the Cumbric tradition forward."
 nd_hen_dest_brythonic_union: "L'Union brithonique"
 nd_hen_dest_brythonic_union_desc: "Retrouvez les Gallois Brythons en prenant Carmarthen, l'ancien siège de Deheubarth. Avec l'imprimerie diffusant la littérature cumbrique et l'or pour financer le projet, tous les peuples brithoniques peuvent être rassemblés sous une seule bannière."
 nd_hen_dest_prifysgol: "Prifysgol et Gogledd"
 nd_hen_dest_prifysgol_desc: "Found the University of the North, a great center of Brythonic scholarship rivaling any in Europe. This requires Glasgow, the see of Kentigern, held and built up to twice what it was, high prestige, and bardic halls in four towns from which its masters are drawn."
 nd_hen_dest_glasgow_developed_tt: "#bold Glasgow#! is owned directly and has at least #bold 46#! development"
 nd_hen_dest_london: "Caer Ludd"
 nd_hen_dest_london_desc: "Take London (Caer Ludd in the old tongue, the city founded by King Lud according to Brythonic legend). The old road south from York runs through Lincoln, which must be held as well."
 nd_hen_dest_celtic_seas: "Maîtres des mers Celtiques"
 nd_hen_dest_celtic_seas_desc: "Contrôlez la mer d'Irlande en prenant Dublin et les Cornouailles, reliant les peuples celtiques d'Irlande, du Pays de Galles et du Vieux Nord sous la domination brithonique."
 nd_hen_dest_bretagne: "Fils de Brutus"
 nd_hen_dest_bretagne_desc: "According to Geoffrey of Monmouth, the Britons descend from Brutus of Troy. Reach across the Channel to Rouen in Normandy and to Rennes, claiming kinship with the Bretons and dominion over both shores. This is the apex of Brythonic military power."
 nd_hen.4.t: "Le Vieux Nord consolidé"
 nd_hen.4.d: "Hen Ogledd stands firm. The old kingdoms of Rheged, Gododdin, and Strathclyde answer to a single crown for the first time in centuries. The realm is stable, the borders are secured, and the people look to their king for direction.\n\nThe question that has haunted the Brythonic north since the fall of the Roman order is answered at last: the Old North endures. Now comes the harder question: what shall it become?"
 nd_hen.4.a: "Le Vieux Nord perdure"
 nd_hen.5.t: "Écoles du Cynfeirdd"
 nd_hen.5.d: "Across the realm, the schools of the Cynfeirdd have been transformed. What were once informal gatherings of bards passing down oral traditions have become organized institutions of learning. Young scholars now study not only the intricate meters of Cumbric poetry but also philosophy, law, mathematics, and the natural sciences.\n\nPaper (once a rare luxury) flows through the markets of the Old North. The works of Taliesin and Aneirin are copied, studied, and expanded upon. New treatises in the Cumbric tongue rival anything produced in Latin or French. The intellectual foundations of a Brythonic renaissance have been laid."
 nd_hen.5.a: "L'Awen illumine tous ceux qui recherchent la connaissance"
 nd_hen.6.t: "L'Union brithonique"
 nd_hen.6.d: "Carmarthen has fallen to us, or rather, returned to us. The ancient seat of Deheubarth, the heartland of Welsh Brythonic civilization, is united with the Old North for the first time since the post-Roman era. The scholars of the north and the bards of Wales find that they share more than a common linguistic ancestor: they share a vision of Brythonic civilization restored.\n\nThe printing press now carries Cumbric and Welsh texts to every corner of the realm. But how shall we channel this cultural momentum? Through great gatherings of poets and scholars that celebrate our shared heritage? Or through the restoration of the ancient Brythonic legal codes that once governed all Prydain?"
 nd_hen.6.a: "Convoquez l'Eisteddfod - un festival des arts"
 nd_hen.6.b: "Restaurer le Cyfraith : la loi des Britanniques"
 nd_hen.7.t: "Prifysgol et Gogledd"
 nd_hen.7.d: "The University of the North opens its doors. Built in the Brythonic scholarly tradition but embracing the new learning the presses carry across Europe, it stands as proof that a language once dismissed as the speech of herdsmen and cattle-raiders can serve as the medium for the highest learning.\n\nScholars from across the Celtic world (Wales, Ireland, Cornwall, Brittany) flock to the Prifysgol. The question now is what shall define this institution's character. Shall it look outward, building networks of trade and diplomacy that carry Brythonic ideas across Europe? Or shall it look inward, nurturing the poetic and literary traditions that make the Cumbric world unique?"
 nd_hen.7.a: "Vers l'extérieur - que nos érudits marchent parmi les nations"
 nd_hen.7.b: "Vers l'intérieur : laissez les Awen parler à travers une nouvelle ère"
 nd_hen.8.t: "La chute de Londres"
 nd_hen.8.d: "Caer Ludd has fallen. London (the greatest city in England, the heart of Anglo-Saxon power) flies the banner of Hen Ogledd. The city that the Brythonic Britons lost to the Saxons in the dark centuries after Rome has been reclaimed by their descendants.\n\nAccording to Geoffrey of Monmouth, London was founded by King Lud, who named it Caer Ludd. Whether the legend is true matters less than what it represents: the city belongs to the Britons by right of ancient inheritance. The warriors of the Old North march through streets that their ancestors last walked a thousand years ago.\n\nThe Anglo-Saxon chroniclers wrote that the Britons fled westward forever. They were wrong."
 nd_hen.8.a: "Caer Ludd est à nouveau à nous"
 nd_hen.9.t: "Maîtres des mers Celtiques"
 nd_hen.9.d: "Dublin and Cornwall are ours. The Irish Sea is now a Brythonic lake, and the Celtic peoples of three islands (Britain, Ireland, and the scattered Atlantic communities) look to the Old North as their champion.\n\nBut the nature of this hegemony remains to be determined. Shall we forge a confederation of Celtic peoples, binding them through alliance and shared purpose while respecting their distinct identities? Or shall we fortify our island domains into an impregnable bastion, making Britain itself the greatest fortress in the world?"
 nd_hen.9.a: "Une confédération de peuples celtes"
 nd_hen.9.b: "Une forteresse insulaire invincible"
 nd_hen.10.t: "Fils de Brutus"
 nd_hen.10.d: "Rouen has fallen. The banner of Hen Ogledd flies on the continent. The Brythonic people, who retreated from Brittany to the margins of Britain, have returned to claim their ancient kinship with the Bretons, and more.\n\nGeoffrey of Monmouth wrote that Brutus of Troy founded Britain and gave it his name. Whether myth or memory, the claim carries weight: the Britons have proven that they are a people of destiny, capable of conquering not merely an island but reaching across the sea. The question now is how to wield this unprecedented power."
 nd_hen.10.a: "In the spirit of Urien: conquest and glory"
 nd_hen.10.b: "Un empire celtique lié par le sang et la langue"
 STATIC_MODIFIER_NAME_nd_hen_dest_eisteddfod: "L'Eisteddfod"
 STATIC_MODIFIER_DESC_nd_hen_dest_eisteddfod: "De grands festivals de poésie, de musique et d’érudition attirent des artistes du monde brithonique, répandant leur influence culturelle et guérissant les cicatrices de siècles de conflit."
 STATIC_MODIFIER_NAME_nd_hen_dest_cyfraith: "Cyfraith et Brythoniaid"
 STATIC_MODIFIER_DESC_nd_hen_dest_cyfraith: "Les anciens codes juridiques des Britanniques ont été restaurés et codifiés, offrant ainsi un cadre juste et tolérant pour gouverner un peuple diversifié."
 STATIC_MODIFIER_NAME_nd_hen_dest_enlightened_north: "Nord éclairé"
 STATIC_MODIFIER_DESC_nd_hen_dest_enlightened_north: "Les érudits de Prifysgol et Gogledd construisent des réseaux à travers l'Europe, transmettant les idées brithoniques dans le monde entier et rétablissant les relations commerciales et diplomatiques."
 STATIC_MODIFIER_NAME_nd_hen_dest_age_of_verse: "L'âge du vers"
 STATIC_MODIFIER_DESC_nd_hen_dest_age_of_verse: "Un âge d'or de la poésie et du chant du Cumbric. La tradition bardique atteint des sommets jamais vus depuis Taliesin, et le prestige culturel du monde brithonique attire des convertis et des admirateurs."
 STATIC_MODIFIER_NAME_nd_hen_dest_celtic_alliance: "Alliance celtique"
 STATIC_MODIFIER_DESC_nd_hen_dest_celtic_alliance: "Une confédération de peuples celtes sous la direction de Brythonic, liés par une langue et un objectif communs. Les nations soumises sont des partenaires fidèles et non des provinces conquises."
 STATIC_MODIFIER_NAME_nd_hen_dest_island_fortress: "Forteresse de l'île"
 STATIC_MODIFIER_DESC_nd_hen_dest_island_fortress: "La Grande-Bretagne est devenue un bastion imprenable. La terre assure sa propre défense, même si la mentalité de forteresse restreint le commerce extérieur."
 STATIC_MODIFIER_NAME_nd_hen_dest_urien_reborn: "Urien renaît"
 STATIC_MODIFIER_DESC_nd_hen_dest_urien_reborn: "L'esprit d'Urien de Rheged revit chez un roi conquérant. Les armées du Vieux Nord sont disciplinées et vastes, même si des campagnes interminables mettent à rude épreuve la trésorerie."
 STATIC_MODIFIER_NAME_nd_hen_dest_celtic_empire: "Empire celtique"
 STATIC_MODIFIER_DESC_nd_hen_dest_celtic_empire: "Un royaume panceltique s'étendant de l'Écosse à la Bretagne, lié par le sang et la langue. Le pouvoir de dicter les conditions de la paix se fait au prix d’une volonté perpétuelle de guerre."
 nd_hen_prifysgol: "Prifysgol et Gogledd"
 nd_hen_prifysgol_desc: "L'Université du Nord, un grand centre d'apprentissage brithonique où la tradition bardique rencontre la nouvelle science. Des érudits du monde celtique étudient la poésie, le droit, la philosophie naturelle et les mathématiques dans la langue cumbrique."
 nd_hen_caer_ludd: "Caer Ludd"
 nd_hen_caer_ludd_desc: "La légendaire forteresse brithonique de Londres, reconstruite comme citadelle militaire d'un peuple celtique conquérant. Ses murs massifs et sa garnison dominent la Tamise et la campagne environnante."
 nd_hen_university_upkeep: "Entretien universitaire"
 nd_hen_university_upkeep_desc: "Les érudits, scribes et conférenciers du Prifysgol ont besoin d'un approvisionnement constant en livres, papier, cire d'abeille pour allumer les bougies et en tissu pour leurs vêtements."
 nd_hen_caer_ludd_garrison: "Garnison de la Citadelle"
 nd_hen_caer_ludd_garrison_desc: "La garnison de Caer Ludd a besoin d'armes, de pierres pour les réparations, de fer pour les fortifications et de provisions pour rester prête."

 # ===== BUREAUCRACIES =====
 cyfraith_hywel_bureaucracy: "Cyfraith Hywel"
 cyfraith_hywel_bureaucracy_desc: "Le code juridique gallois attribué à Hywel Dda au milieu du Xe siècle, conservé dans les rédactions d'Iorwerth, Cyfnerth et Blegywryd. Il codifie les galanas (prix du sang apparenté), le sarhad (insulte-amende) et le mach (garantie assermentée), administrés par les tribunaux cwmwd d'uchelwyr. Le clergé conservait les manuscrits ; les lois favorisaient les amendes progressives plutôt que les querelles, ce que les grandes familles n'appréciaient pas."
 llys_a_maerdref_bureaucracy: "Llys et Maerdref"
 llys_a_maerdref_bureaucracy_desc: "La cour royale (llys) et son village de domaine (maerdref), où les esclaves du taeogion cultivaient le plateau du roi et où le maer collectait les aliments de l'aube. Le roi progressait dans son circuit cycliste à travers le maerdrefi, consommant les rendus en personne. La royauté itinérante soutenait la bande de guerre en mouvement, mais liait les esclaves au sol pendant des générations."
 penteulu_bureaucracy: "Penteulu"
 penteulu_bureaucracy_desc: "Le capitaine de la troupe à cheval du roi (teulu), second officier de la cour après l'edling. Le teulu de cent vingt serviteurs liés par serment, issus de maisons nobles, servait de force de frappe et de garde du corps du roi. Y Gododdin commémore une telle bande de guerre, les trois cents qui sont partis vers le sud pour mourir à Catraeth."
 bardd_teulu_bureaucracy: "Bardd Teulu et Phencerdd"
 bardd_teulu_bureaucracy_desc: "L'ordre bardique, formellement classé par les lois de Hywel en pencerdd (maître barde, payé par concours de chaise), bardd teulu (poète de l'orchestre de guerre chanté avant la bataille) et petit cerddorion. Les bardes préservaient les généalogies des rois, chantaient les louanges de la dynastie et pouvaient légitimer ou défaire un dirigeant avec leurs vers. Leur langue était le Cumbric et, à travers eux, la langue brithonique portait un poids au-delà des frontières."
 cwmwd_courts_bureaucracy: "Système judiciaire Cwmwd"
 cwmwd_courts_bureaucracy_desc: "Each cwmwd was an autonomous legal-territorial unit of half or a third of a cantref, with its own court of uchelwyr presided over by a rhaglaw (legal officer) and policed by a rhingyll (bailiff). By the thirteenth century the cwmwd court had eclipsed the cantref court as the primary venue for Welsh law. Local justice, local power, and a thousand local lords."
 clas_communities_bureaucracy: "Communautés de classe"
 clas_communities_bureaucracy_desc: "Églises mères de la tradition chrétienne brithonique, administrées par des familles cléricales héréditaires où l'abbaye se transmettait de père en fils ou d'oncle en neveu. Govan, Glasgow et le clasau de Cumbria servaient de centres religieux et administratifs pour de vastes territoires. Leur caractère héréditaire préserva le savoir brithonique mais résista à la réforme romaine ; le clergé et les nobles se mariaient librement."
 galanas_cenedl_bureaucracy: "Responsabilité de la famille Galanas"
 galanas_cenedl_bureaucracy_desc: "Sous Cyfraith Hywel, le cenedl (la parenté paternelle de quatre générations) était l'unité de responsabilité légale. Le prix du sang de Galanas pour homicide était payé et reçu collectivement, le tableau étant gradué selon le statut. Le crime était réglé entre cenedlau et non entre le sujet et le roi. Les familles protégeaient les leurs; le trône, dépourvu du monopole de la justice, apprit à gouverner par eux plutôt que par eux."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_hen_bureaucracy_authority: "Tradition de la cour brithonique"
 AUTO_MODIFIER_DESC_nd_hen_bureaucracy_authority: "Hen Ogledd inherits the institutional vocabulary of Cyfraith Hywel and the Brythonic courts: cwmwd, llys, teulu, clas. Four of these institutions can be kept at a time."
