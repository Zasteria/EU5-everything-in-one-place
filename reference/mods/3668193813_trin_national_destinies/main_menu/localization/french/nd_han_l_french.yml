l_french:
 STATIC_MODIFIER_NAME_nd_hanoverian_succession: "La succession hanovrienne"
 STATIC_MODIFIER_DESC_nd_hanoverian_succession: "L’Act of Settlement lie notre dynastie à la couronne britannique, ouvrant des canaux de commerce, de subventions et d’obligations militaires partagées à travers la mer du Nord."
 STATIC_MODIFIER_NAME_nd_welf_renaissance: "La renaissance du bien-être social"
 STATIC_MODIFIER_DESC_nd_welf_renaissance: "La Maison Welf trace sa propre voie, en investissant dans les universités, la recherche scientifique et les arts pour construire un phare de la pensée des Lumières dans le nord de l’Allemagne."
 nd_han_formed_tt: "Hanovre a été formé"
 nd_han_path_a_tt: "Choisissez la succession hanovrienne"
 nd_han_path_b_tt: "Choisissez la Welf Renaissance"
 nd_han_dest_gottingen_developed_tt: "We own #bold Göttingen#! and its development is at least #bold 33#!"
 nd_han_dest_georgia_augusta_stands_tt: "We own #bold Göttingen#! and a #bold Welf University#! stands there"
 nd_han.1.t: "La consolidation de Hanovre"
 nd_han.1.d: "The scattered Brunswick-Luneburg principalities are united under a single Welf banner. The question before us is not merely one of governance, but of orientation. To the west lies Britain, where our dynasty may one day wear a second crown: an alliance that would bring naval power, trade wealth, and military subsidies, but also entanglement in wars far from our borders. To the south lies the Empire, where Gottingen's scholars are forging new ideas and the Harz mines still yield silver: a path of self-reliance, intellectual ambition, and German identity.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_han.1.a: "Regardez vers la mer : l’avenir de notre dynastie repose sur la Grande-Bretagne"
 nd_han.1.b: "Regardez à Göttingen. Nous serons une lumière d'apprentissage"
 nd_han.2.t: "The Emperor's Rescuer"
 nd_han.2.d: "In the war over the Landshut inheritance, King Maximilian has been dragged from his horse among the Bohemian foot at Wenzenbach. Duke Eric of Calenberg has cut his way to him and brought him out alive, wounded himself in the doing. Maximilian has knighted the duke on the field and named him a friend of his house. We may use this favour to amplify our standing among the courts of the Empire, or we may double down on the military service that earned us this honor, cementing our reputation as indispensable defenders of the Empire."
 nd_han.2.a: "Notre voix aura du poids dans tous les tribunaux"
 nd_han.2.b: "L'Empire a plus besoin de nos épées que de nos paroles"
 nd_han.3.t: "The Scholars of Helmstedt"
 nd_han.3.d: "While the Empire tears itself apart over confession, the Welf university at Helmstedt goes its own way. Georg Calixtus, professor of theology since 1614, teaches that Lutherans, Reformed and Catholics share the faith of the first five centuries and may be reconciled upon it. The orthodox of Wittenberg denounce him as a mixer of religions; the dukes keep him in his chair. Beside him Hermann Conring lectures on medicine, on politics and on the true origins of German law. Students come from every Protestant land of the north, and the councillors of the Welf courts are trained in a school that prefers argument to anathema."
 nd_han.3.a: "Let knowledge flourish in the halls of Helmstedt"
 nd_han.4.t: "Le miracle à Minden"
 nd_han.4.d: "Le matin du 1er août 1759, six bataillons d'infanterie britanniques et deux hanovriens avancent en ligne à travers une plaine ouverte contre la cavalerie française massée près de la ville de Minden. Contre toute doctrine et toute attente, leurs tirs de volée disciplinés brisent charge après charge. Dans l'après-midi, l'armée du maréchal Contades est en retraite. La bataille de Minden prouve qu'une infanterie bien entraînée, gardant son sang-froid et sa formation, peut vaincre la cavalerie la plus redoutable d'Europe. Les soldats hanovriens qui se sont tenus à Minden ont gravé leur courage dans l'histoire militaire."
 nd_han.4.a: "Appuyez sur l'avantage. Portez le combat à l'ennemi"
 nd_han.4.b: "Tenez le cap : notre force réside dans notre fermeté"
 nd_han.5.t: "The King at Dettingen"
 nd_han.5.d: "On 27 June 1743 the allied army of British, Hanoverians and Austrians is caught on the bank of the Main near Dettingen, with the French across its road and French guns firing from over the river. George II, Elector of Hanover and King of Great Britain, dismounts, draws his sword and leads the foot forward himself. The French household cavalry charges and breaks on the steady fire of the line; by evening the French are driven back across the river with heavy loss. No king of Great Britain will lead an army in battle again, and the Hanoverian regiments that stood beside him that day will carry the name of Dettingen with pride."
 nd_han.5.a: "Their steadiness shall never be forgotten"
 STATIC_MODIFIER_NAME_nd_han_electoral_prestige: "Imperial Favour"
 STATIC_MODIFIER_DESC_nd_han_electoral_prestige: "The man who saved the Emperor is heard with respect in every court of the Empire."
 STATIC_MODIFIER_NAME_nd_han_imperial_service: "Service Impérial"
 STATIC_MODIFIER_DESC_nd_han_imperial_service: "Nos troupes sont le bouclier de l'Empire : l'Empereur récompense ceux qui répondent à son appel."
 STATIC_MODIFIER_NAME_nd_han_gottingen_enlightenment: "The Helmstedt School"
 STATIC_MODIFIER_DESC_nd_han_gottingen_enlightenment: "Helmstedt's moderate theology and its learned jurists draw students from across the Protestant north."
 STATIC_MODIFIER_NAME_nd_han_minden_discipline: "Discipline de Minden"
 STATIC_MODIFIER_DESC_nd_han_minden_discipline: "La leçon de Minden : le feu discipliné gagne les batailles. Appuyez sur l'avantage pendant que l'ennemi roule."
 STATIC_MODIFIER_NAME_nd_han_minden_steadfastness: "La fermeté de Minden"
 STATIC_MODIFIER_DESC_nd_han_minden_steadfastness: "La leçon de Minden : tenez bon et laissez l’ennemi percer votre ligne."
 STATIC_MODIFIER_NAME_nd_han_kgl_pride: "Pride of Dettingen"
 STATIC_MODIFIER_DESC_nd_han_kgl_pride: "The Hanoverian foot that stood under the eye of its Elector at Dettingen has earned a reputation as the finest German infantry in Europe."
 nd_han_welf_dynasty: "Dynastie Welf"
 nd_han_welf_dynasty_desc: "La Maison Welf fait partie des plus anciennes dynasties princières d’Europe, retraçant sa lignée à travers des siècles de politique impériale."
 nd_han_harz_mining: "Extraction d'argent du Harz"
 nd_han_harz_mining_desc: "Les mines d'argent des montagnes du Harz ont enrichi les ducs de Welf pendant des générations, finançant leurs cours et leurs armées."
 nd_han_sachsenspiegel: "Tradition du Sachsenspiegel"
 nd_han_sachsenspiegel_desc: "Le Sachsenspiegel, composé vers 1220, a codifié le droit coutumier saxon et est devenu le fondement de la pratique juridique dans le nord de l'Allemagne."
 nd_han_trade_routes: "Commerce de Basse-Saxe"
 nd_han_trade_routes_desc: "Les bourgs de Hildesheim, Braunschweig et Hanovre se situent au carrefour des routes commerciales du nord de l'Allemagne reliant les villes hanséatiques à l'intérieur."
 nd_han_celle_stud: "Marstall of Celle"
 nd_han_celle_stud_desc: "The dukes of Lüneburg leave their old city for Celle in 1378 and make the castle on the Aller their court. Beside it stands the ducal Marstall, where the riding and war horses of the household are kept and bred from the hardy stock of the heath."
 nd_han_calenberg_rise: "Ascendant de Calenberg"
 nd_han_calenberg_rise_desc: "La Principauté de Calenberg consolide le pouvoir entre les branches concurrentes de Brunswick, centralisant l'administration sous un seul dirigeant Welf."
 nd_han_herrenhausen_tradition: "The Ducal Residences"
 nd_han_herrenhausen_tradition_desc: "Shut out of the city of Brunswick by its burghers, the dukes make Wolfenbüttel their seat in 1432, as the Lüneburg line made Celle before them. Moated castles are rebuilt as courts, with a chapel, a chancery and a hall for the painters and singers the duke keeps."
 nd_han_wasserregal: "Oberharzer Wasserregal"
 nd_han_wasserregal_desc: "Une merveille d'ingénierie avec 107 barrages, 310 km de fossés et des dizaines de roues hydrauliques : le Wasserregal alimente les mines du Harz grâce à une ingénieuse gestion hydraulique."
 nd_han_leibniz_court: "Academia Julia"
 nd_han_leibniz_court_desc: "Duke Julius of Brunswick-Wolfenbüttel founds a university at Helmstedt in 1576, the Academia Julia, and gives his pits the same care as his scholars. The deep adit at the Rammelsberg that bears his name, begun generations before him, is driven through in 1585 and drains workings that had stood under water since about 1300.\n\n#italic Available in: $nd_han_oberharzer_bergwerk$#!"
 nd_han_electoral_dignity: "The Emperor's Rescuer"
 nd_han_electoral_dignity_desc: "At Wenzenbach near Regensburg in 1504, Duke Eric of Calenberg saves the life of King Maximilian in the press of battle and is knighted on the field. The Welfs stand high in the favour of the house of Austria."
 nd_han_garde_du_corps_tradition: "Welf Reisige"
 nd_han_garde_du_corps_tradition_desc: "The Welf dukes of the sixteenth century ride to war at the head of their Reisige: armoured horsemen of the ducal household and of the knightly families of Calenberg and Wolfenbüttel."
 nd_han_circle_director: "Directeur du Cercle de Basse-Saxe"
 nd_han_circle_director_desc: "En tant que directeur du Cercle impérial de Basse-Saxe, Hanovre est responsable de la mobilisation des forces de défense du Cercle et de la protection de la région contre les menaces extérieures."
 nd_han_act_of_settlement: "The Ninth Electorate"
 nd_han_act_of_settlement_desc: "In 1692 Emperor Leopold I raises Duke Ernest Augustus to prince-elector: a ninth seat in the college that chooses the Emperor. His wife Sophia, granddaughter of James I, carries a claim to the English throne, which Parliament confirms to her and her heirs in 1701."
 nd_han_subsidy_troops: "Troupes de subvention"
 nd_han_subsidy_troops_desc: "Les ducs de Welf louent leurs soldats bien entraînés à Venise, en France, en Espagne, en Angleterre et auprès de l'empereur, transformant ainsi la main-d'œuvre militaire en monnaie diplomatique."
 nd_han_bremen_verden: "Lauenburg and the Elbe"
 nd_han_bremen_verden_desc: "When the last duke of Saxe-Lauenburg dies in 1689, George William of Celle occupies the duchy. The Welfs now hold the Elbe crossing at Lauenburg, its toll, and the old salt road and canal to Lübeck and the Baltic."
 nd_han_gottingen_university: "The Helmstedt School"
 nd_han_gottingen_university_desc: "From 1635 the Academia Julia at Helmstedt is the common university of all the Welf lines. Georg Calixtus teaches there that the divided churches can be reconciled, and Hermann Conring founds the study of German legal history."
 nd_han_military_reform: "Réforme militaire hanovrienne"
 nd_han_military_reform_desc: "L'armée hanovrienne est réorganisée en une force professionnelle permanente, formée selon les normes exigées par ses engagements envers l'Empire et la couronne britannique."
 nd_han_minden_legacy: "L'héritage de Minden"
 nd_han_minden_legacy_desc: "À Minden en 1759, l'infanterie hanovrienne avança en formation ouverte contre la cavalerie française et la brisa avec des tirs de volée disciplinés : un triomphe de l'entraînement sur la tradition."
 nd_han_kings_german_legion: "The Pragmatic Army"
 nd_han_kings_german_legion_desc: "In 1743 sixteen thousand Hanoverians march to the Main with the British and Austrians, and at Dettingen the Elector-King leads them in person against the French. The red-coated foot of the electorate proves itself the equal of any in Europe."
 nd_han_gottingen_school: "École de Göttingen"
 nd_han_gottingen_school_desc: "In 1734 the Elector founds the Georgia Augusta at Gottingen, with an open library and no confessional oath. There Schlozer and his colleagues pioneer modern historiography, statistical analysis, and comparative politics, transforming how Europeans understand their own past."
 nd_han_british_subsidies: "Subventions britanniques"
 nd_han_british_subsidies_desc: "La Grande-Bretagne subventionne la défense de Hanovre à hauteur de centaines de milliers de livres sterling par an, finançant les fortifications, les garnisons et l’armée qui garde l’électorat."
 nd_han_jager_tradition: "Jager hanovrien"
 nd_han_jager_tradition_desc: "Recruited from the foresters and gamekeepers of Lower Saxony, Hanoverian Jager fight as light infantry, expert marksmen trained to exploit wooded and broken terrain. When the French occupy the electorate in 1803 many cross to Britain and serve in the light battalions of the King's German Legion."
 nd_han_kingdom_elevation: "Royaume de Hanovre"
 nd_han_kingdom_elevation_desc: "Le Congrès de Vienne élève Hanovre du rang d'électorat au rang de royaume en 1814, reconnaissant sa loyauté et ses sacrifices pendant les guerres napoléoniennes."
 nd_han_constitutional_reform: "Constitution hanovrienne"
 nd_han_constitutional_reform_desc: "Le Staatsgrundgesetz de 1833 établit un cadre constitutionnel pour le royaume de Hanovre, équilibrant les prérogatives royales et le gouvernement représentatif."
 nd_han_clausthal_academy: "Académie des Mines de Clausthal"
 nd_han_clausthal_academy_desc: "L'école des mines de Clausthal applique la science et l'ingénierie modernes aux anciennes mines du Harz, des techniques industrielles pionnières qui se sont répandues dans les districts miniers allemands."
 a_nd_han_subsidientruppen: "Suppléments subsidiaires"
 a_nd_han_subsidientruppen_desc: "Des soldats hanovriens professionnels engagés auprès des puissances alliées, des réguliers bien entraînés et fiables qui combattent partout où les traités de leur duc l'exigent."
 a_nd_han_garde_du_corps: "Reisige"
 a_nd_han_garde_du_corps_desc: "Armoured horsemen of the Welf dukes, drawn from the ducal household and the knightly families of the land. They are steady under fire and are kept for the decisive charge."
 a_nd_han_kgl_infantry: "Hanoverian Redcoats"
 a_nd_han_kgl_infantry_desc: "The red-coated regulars of the Elector-King, drilled to the same manual as the British foot beside whom they serve and tempered at Dettingen and in the long defence of the electorate."
 a_nd_han_jager: "Jager hanovrien"
 a_nd_han_jager_desc: "Des fusiliers issus des forêts de Basse-Saxe, habiles à tirer des escarmouches, à tendre des embuscades et à faire en sorte que chaque tir compte sur un terrain accidenté."
 levy_nd_han_subsidientruppen: "Suppléments subsidiaires"
 levy_nd_han_subsidientruppen_desc: "Infanterie professionnelle hanovrienne subventionnée issue de la paysannerie et de soldats entraînés, embauchée pour servir les puissances alliées."
 levy_nd_han_garde_du_corps: "Reisige"
 levy_nd_han_garde_du_corps_desc: "Armoured horsemen called out from the ducal household and the knightly families of the Welf lands."
 levy_nd_han_jager: "Jager hanovrien"
 levy_nd_han_jager_desc: "Infanterie légère entraînée en forêt, issue des forestiers et des gardes-chasse de Basse-Saxe."
 nd_han_oberharzer_bergwerk: "Usine de montagne d'Oberharzer"
 nd_han_oberharzer_bergwerk_desc: "Une mine d'argent du Harz Mountain équipée de l'ingénieux système de gestion de l'eau du Wasserregal : barrages, fossés et roues hydrauliques qui alimentent l'extraction en profondeur."
 nd_han_sachsenspiegel_gericht: "Sachsenspiegel Gericht"
 nd_han_sachsenspiegel_gericht_desc: "Un tribunal administrant la justice selon le Sachsenspiegel : le code fondateur du droit coutumier saxon qui a façonné la pratique juridique dans le nord de l'Allemagne."
 nd_han_landgestut: "Ducal Marstall"
 nd_han_landgestut_desc: "The stables and stud of a Welf court. Horses bred on the heath pastures are raised here for the duke's riders and for the plough, supplying the cavalry and enriching the rural economy."
 nd_han_georgia_augusta: "Welf University"
 nd_han_georgia_augusta_desc: "A university of the Welf lands, with a library open to its scholars and a press of its own, that draws students from across Europe and trains the councillors of the state."
 nd_han_herrenhausen: "Welf Residence"
 nd_han_herrenhausen_desc: "A moated castle rebuilt as a princely court: chapel, great hall and chancery around one yard, where the duke keeps his council, his painters and his singers."
 nd_han_pm_harz_silver: "Extraction d'argent du Harz"
 nd_han_pm_harz_silver_desc: "Exploitation traditionnelle des veines d'argent du Harz, à l'aide d'outils en fer et de fusion de charbon de bois pour extraire le minerai d'argent pour le trésor du Welf."
 nd_han_pm_harz_deep_shaft: "Exploitation minière en profondeur"
 nd_han_pm_harz_deep_shaft_desc: "La puissance hydraulique du Wasserregal permet une exploitation minière plus profonde, atteignant des veines d'argent plus riches sous la nappe phréatique avec des renforts en fer et une fusion au charbon."
 nd_han_pm_harz_windkunst: "Deep Drainage Adit"
 nd_han_pm_harz_windkunst_desc: "A long adit driven in from the valley lets the water of the pits run out by its own weight, as Duke Julius had done at the Rammelsberg. Timber and ironwork for the gallery take the place of fuel."
 nd_han_pm_industrial_mining: "Exploitation minière industrielle"
 nd_han_pm_industrial_mining_desc: "Les pompes à vapeur et les arbres renforcés de fer apportent des méthodes industrielles modernes aux anciennes mines du Harz, brûlant du charbon pour alimenter les moteurs d'extraction."
 nd_han_pm_bergwerk_maintenance: "Entretien des mines"
 nd_han_pm_bergwerk_maintenance_desc: "Le bois pour les supports des puits, la pierre pour les murs et le fer pour les outils maintiennent les mines opérationnelles."
 nd_han_pm_horse_breeding: "Marstall Horse Breeding"
 nd_han_pm_horse_breeding_desc: "Selective breeding of heath horses on grain feed, supplying cavalry mounts and draft animals."
 nd_han_pm_stud_maintenance: "Entretien du haras"
 nd_han_pm_stud_maintenance_desc: "Hay, grain, and livestock care sustain the breeding stock of the Marstall."
 nd_han_pm_university_press: "Presse universitaire"
 nd_han_pm_university_press_desc: "The university's printing workshops produce scholarly works, legal commentaries, and scientific treatises for distribution across the German world."
 nd_han_pm_scholarly_press: "Presse savante"
 nd_han_pm_scholarly_press_desc: "Une presse universitaire élargie produisant à plus grande échelle les publications historiques et scientifiques influentes de Göttingen."
 nd_han_pm_university_maintenance: "Entretien de l'université"
 nd_han_pm_university_maintenance_desc: "Les livres, le papier et le mobilier entretiennent les amphithéâtres et la bibliothèque."
 nd_han_pm_herrenhausen_maintenance: "Residence Upkeep"
 nd_han_pm_herrenhausen_maintenance_desc: "Marble, glass, fine furniture, and imported dyes keep the hall and chapel of the residence fit for a prince."
 nd_han_pm_gericht_maintenance: "Entretien du tribunal"
 nd_han_pm_gericht_maintenance_desc: "Papier, mobilier et références juridiques entretiennent le palais de justice du Sachsenspiegel."
 nd_han_destiny: "Destin des Welfs"
 nd_han_destiny_desc: "Les terres de Brunswick-Lunebourg sont réunies sous une seule bannière Welf. Que nous regardions vers l'ouest, de l'autre côté de la mer, ou vers les bibliothèques de l'Empire, notre destin nous attend."
 nd_han_dest_north_sea_coast: "Côte de la mer du Nord"
 nd_han_dest_north_sea_coast_desc: "Assurez le contrôle de Brême et d'Oldenbourg pour contrôler les estuaires de la Weser et de l'Ems, donnant à Hanovre un accès direct aux routes commerciales de la mer du Nord."
 nd_han_dest_british_crown: "La couronne britannique"
 nd_han_dest_british_crown_desc: "The Act of Settlement opens the path to London. Once it is passed, bring the British crown under Welf rule and unite the two kingdoms across the North Sea."
 nd_han_dest_north_sea_imperium: "Impérial de la mer du Nord"
 nd_han_dest_north_sea_imperium_desc: "D’Édimbourg à Amsterdam, la mer du Nord est un lac hanovrien. Commandez ses rivages, ses flottes et son commerce."
 nd_han_dest_university_network: "Réseau universitaire"
 nd_han_dest_university_network_desc: "Étendre le modèle de Göttingen à Erfurt et au-delà. Adoptez le système bancaire moderne pour financer un réseau d’universités qui fera de Hanovre la capitale scientifique de l’Empire."
 nd_han_dest_aufklarung: "L'Aufklarung"
 nd_han_dest_aufklarung_desc: "The printing press carries Gottingen's ideas across Germany. Build Gottingen into a university town of the first rank, produce books for the scholarly market, and lead the German Enlightenment."
 nd_han_dest_beacon_of_reason: "Phare de la Raison"
 nd_han_dest_beacon_of_reason_desc: "Hanover stands as the intellectual beacon of Europe. Raise a Welf University in Gottingen, the Georgia Augusta, secure Leipzig's book trade, and build a society where reason and tolerance flourish."
 nd_han.6.t: "Destin des Welfs"
 nd_han.6.d: "La consolidation de Hanovre marque un début et non une fin. La Maison Welf se trouve à la croisée des chemins. À l’ouest, les marées de la mer du Nord nous attirent : la succession britannique, le commerce maritime et le pouvoir d’une double couronne. Au sud, les amphithéâtres de Göttingen et les bibliothèques de l’Empire offrent une autre grandeur : celle bâtie non pas sur des navires de guerre mais sur des idées. La voie que nous choisissons maintenant définira ce que deviendra Hanovre."
 nd_han.6.a: "Notre destin attend"
 nd_han.7.t: "La Weser et l'Ems"
 nd_han.7.d: "Avec Brême et Oldenbourg sous notre contrôle, Hanovre contrôle les estuaires de la Weser et de l'Ems. Le commerce de la mer du Nord transite par nos ports. Les chantiers navals de Brême construisent des navires qui transportent des marchandises hanovriennes vers la Grande-Bretagne, les Pays-Bas et au-delà. C'est sur cette base que sera construit un Hanovre maritime."
 nd_han.7.a: "La mer du Nord est notre autoroute"
 nd_han.8.t: "Une couronne à travers la mer"
 nd_han.8.d: "La dynastie Welf porte la couronne britannique. Londres, la plus grande ville du monde, reconnaît un monarque hanovrien. L’union personnelle offre d’immenses opportunités : nous pouvons tirer parti du poids diplomatique de la direction de deux royaumes pour remodeler l’équilibre des pouvoirs, ou nous pouvons exploiter les réseaux commerciaux de la mer du Nord pour remplir notre trésor de revenus commerciaux."
 nd_han.8.a: "Deux couronnes, une dynastie : notre diplomatie est suprême"
 nd_han.8.b: "Deux ports, une mer : nos marchands prospéreront"
 nd_han.9.t: "Seigneurs de la mer du Nord"
 nd_han.9.d: "Des ports d'Édimbourg aux comptoirs d'Amsterdam, la mer du Nord répond à Hanovre. Nos flottes patrouillent dans ses eaux, nos marchands dominent son commerce, notre dynastie dirige ses plus grands royaumes. Nous pouvons exploiter notre avantage en mer, en construisant une véritable thalassocratie qui défie les anciennes puissances navales, ou nous pouvons utiliser notre richesse maritime pour ancrer une position inattaquable sur le continent."
 nd_han.9.a: "Commandez les vagues : notre marine gouvernera la mer"
 nd_han.9.b: "Ancrer le continent : nos richesses sécurisent nos frontières"
 nd_han.10.t: "Le réseau scientifique"
 nd_han.10.d: "Avec l'intégration de la vénérable université d'Erfurt dans l'orbite hanovrienne et le financement bancaire moderne de nos ambitions académiques, le modèle de Göttingen se répand. Nos universités attirent des chercheurs de tout l’Empire : des théologiens, des juristes, des historiens et des philosophes naturels qui débattent librement dans la tradition de Leibniz. Hanovre devient synonyme d'apprentissage."
 nd_han.10.a: "La connaissance est notre vraie richesse"
 nd_han.11.t: "Lumière de l'Aufklarung"
 nd_han.11.d: "Les imprimeries de Göttingen et de Hanovre produisent des livres, des brochures et des revues scientifiques qui remodèlent la manière dont les Allemands perçoivent le droit, la gouvernance et le monde naturel. Nos universités sont le moteur intellectuel de l’Empire. Nous pouvons pousser davantage vers une érudition laïque, en adoptant la tolérance religieuse et l’apprentissage cosmopolite, ou nous pouvons canaliser cette énergie intellectuelle vers une administration caméraliste systématique, faisant de Hanovre un modèle de gouvernance rationnelle."
 nd_han.11.a: "Que la raison triomphe du dogme"
 nd_han.11.b: "Laissez la méthode triompher de la coutume"
 nd_han.12.t: "Phare de la Raison"
 nd_han.12.d: "Hanovre est la preuve qu'un petit État allemand peut rivaliser avec les grandes puissances, non pas par la seule conquête, mais par le pouvoir des idées. Nos universités forment les meilleurs savants d'Europe, notre tolérance attire les talents de toutes les confessions, notre librairie transporte l'Aufklarung aux quatre coins du continent. Nous pouvons nous appuyer sur ce réseau intellectuel pour projeter une puissance douce et une influence diplomatique, ou nous pouvons exploiter les fruits pratiques de la pensée des Lumières pour construire un État militaire industrialisé et moderne."
 nd_han.12.a: "La plume est plus puissante : nos idées remodèlent l’Europe"
 nd_han.12.b: "Le savoir appliqué, la science au service de l'État"
 STATIC_MODIFIER_NAME_nd_han_dest_personal_union: "Union royale"
 STATIC_MODIFIER_DESC_nd_han_dest_personal_union: "L'union personnelle de Hanovre et de la Grande-Bretagne donne à nos diplomates une influence inégalée dans toutes les cours d'Europe."
 STATIC_MODIFIER_NAME_nd_han_dest_north_sea_trade: "Commerce de la mer du Nord"
 STATIC_MODIFIER_DESC_nd_han_dest_north_sea_trade: "Les flottes marchandes des deux royaumes remplissent nos ports des richesses du commerce de la mer du Nord."
 STATIC_MODIFIER_NAME_nd_han_dest_thalassocracy: "Thalassocratie Hanovrienne"
 STATIC_MODIFIER_DESC_nd_han_dest_thalassocracy: "Nos navires de guerre contrôlent la mer du Nord, même si l’armée souffre de négligence alors que les ressources affluent vers les chantiers navals."
 STATIC_MODIFIER_NAME_nd_han_dest_continental_anchor: "Bastion Continental"
 STATIC_MODIFIER_DESC_nd_han_dest_continental_anchor: "La richesse maritime finance une armée mobile et bien approvisionnée qui assure la position de Hanovre en tant que point d'ancrage de toute coalition continentale."
 STATIC_MODIFIER_NAME_nd_han_dest_secular_learning: "Bourse laïque"
 STATIC_MODIFIER_DESC_nd_han_dest_secular_learning: "Nos universités enseignent librement, sans contrainte par l’orthodoxie confessionnelle, même si l’establishment religieux s’irrite de cette tolérance."
 STATIC_MODIFIER_NAME_nd_han_dest_cameralist_state: "État de la caméraliste"
 STATIC_MODIFIER_DESC_nd_han_dest_cameralist_state: "Une administration systématique et une discipline budgétaire font de Hanovre un modèle de gouvernance rationnelle, même si la prudence bureaucratique ralentit le chemin vers la guerre."
 STATIC_MODIFIER_NAME_nd_han_dest_republic_of_letters: "République des Lettres"
 STATIC_MODIFIER_DESC_nd_han_dest_republic_of_letters: "Le réseau universitaire de Hanovre s'étend sur tout le continent, conférant à nos diplomates et hommes d'État une autorité intellectuelle que peu peuvent égaler."
 STATIC_MODIFIER_NAME_nd_han_dest_industrial_enlightenment: "Lumières industrielles"
 STATIC_MODIFIER_DESC_nd_han_dest_industrial_enlightenment: "Les fruits pratiques de l’érudition Aufklarung (chimie, métallurgie, ingénierie) sont consacrés à la construction d’une armée moderne et bien équipée."
 nd_han_admiralitat: "Amirauté hanovrienne"
 nd_han_admiralitat_desc: "Un quartier général naval coordonnant les forces maritimes combinées des domaines de la mer du Nord de Hanovre, supervisant la construction de la flotte, la défense du port et la protection des convois commerciaux."
 nd_han_pm_admiralitat_maintenance: "Entretien de l'Amirauté"
 nd_han_pm_admiralitat_maintenance_desc: "Le bois, les fournitures navales et les formalités administratives maintiennent l'Amirauté opérationnelle."
 nd_han_akademie: "Académie du Wissenschaften"
 nd_han_akademie_desc: "Une académie royale des sciences dans la tradition de Leibniz, réunissant la philosophie naturelle, les mathématiques et l'ingénierie appliquée au sein d'une seule institution vouée à l'avancement des connaissances humaines."
 nd_han_pm_akademie_maintenance: "Entretien de l'Académie"
 nd_han_pm_akademie_maintenance_desc: "Les livres, le papier, les instruments en verre et le matériel scientifique soutiennent les recherches de l'Académie."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_han_bureaucracy_authority: "Welfische Verwaltung"
 AUTO_MODIFIER_DESC_nd_han_bureaucracy_authority: "The Welf electorate inherits an institutional toolkit unusual for a German territorial state: a Privy Council that ran the country in the elector-king's absence, a permanent standing army that fought from Vienna to Yorktown, the Oberappellationsgericht at Celle, the Deutsche Kanzlei in London that managed the personal union with Britain, the Calenberg-Lüneburg estates that survived where Brandenburg's did not, and, after 1734, the Georgia Augusta at Göttingen, the foremost Enlightenment university of the Empire. Three of these institutions can be sustained from the day Hanover is formed."

 han_geheimes_ratskollegium_bureaucracy: "Geheimes Ratskollegium"
 han_geheimes_ratskollegium_bureaucracy_desc: "Le Conseil privé de Hanovre, organisé par le Regimentsordnung de 1618 en Ratsstuben spécialisés - le Konsistorium pour les affaires ecclésiastiques, le Kriegsrat pour la guerre et le Haushaltsrat pour les finances. Après l'union personnelle de 1714, le Geheimer Rat devint le gouvernement de facto de l'électorat, conseillant le prince absent par le biais de notes écrites transmises via la Deutsche Kanzlei à Londres. C’était l’épine dorsale institutionnelle d’un État gouverné par contumace par un roi-électeur qui visitait rarement ses terres allemandes."

 han_landstaende_bureaucracy: "Hannoversche Landstnde"
 han_landstaende_bureaucracy_desc: "Les domaines territoriaux des terres de Calenberg-Lneburg-Grubenhagen, organisés en trois curies : les prélats des abbayes sécularisées, la Ritterschaft des chevaliers de campagne et les députés des petites villes du Welf. Le Landstnde négociait des subventions fiscales, supervisait le Klosterfonds et survivait en tant que véritable contrepoids aux négociations avec l'électeur absent. Hanovre n'a jamais produit le genre d'absolutisme que le Brandebourg-Prusse a connu : l'Act of Settlement de 1714 a implicitement préservé les domaines en obligeant la couronne britannique à ne pas mener de guerres avec le Hanovre sans son consentement."

 han_hannoversches_heer_bureaucracy: "Hannoversches Heer"
 han_hannoversches_heer_bureaucracy_desc: "L'armée hanovrienne permanente, levée par Ernest Auguste dans les années 1680 et rendue permanente après l'élévation de 1692 au rang d'électeur. Les Heer combattirent au siège de Vienne en 1683 sous le futur George Ier, servirent dans toutes les guerres de l'Empire, de la Succession d'Espagne à la Révolution américaine, et - après l'union personnelle - partageèrent un monarque mais jamais de trésor avec l'armée britannique. Le recrutement était assuré par la Werbung dans les campagnes, avec des prélèvements cantonaux qui pesaient lourdement sur la paysannerie pendant les années de guerre."

 han_deutsche_kanzlei_bureaucracy: "Deutsche Kanzlei à Londres"
 han_deutsche_kanzlei_bureaucracy_desc: "The German Chancery, established by ordinance on 29 August 1714 to govern Hanover from London during the elector-king's absence. The Kanzlei was a small office of three Hanoverian ministers attached to the British court who transmitted memoranda between the Geheimer Rat at Hanover and the elector, and, crucially, kept Hanoverian foreign policy formally separate from British. Friction between the Kanzlei's German ministers and the elector's British advisors was constant, and the office became notorious in Westminster as the channel through which Hanoverian interests leaked into British policy."

 han_oberappellationsgericht_bureaucracy: "Oberappellationsgericht zu Celle"
 han_oberappellationsgericht_bureaucracy_desc: "La Haute Cour d'appel de Celle, créée sous le nom de Cellesche Hofgericht en 1711, avec Weipart Ludwig von Fabrice comme premier président. L'Oberappellationsgericht a hérité de la chancellerie judiciaire de l'ancienne résidence ducale de Lneburg-Celle (1378-1705) et en a fait le plus haut tribunal civil des terres du Welf. Ses décisions sur l'héritage noble, la juridiction seigneuriale et les droits du Klster étaient définitives dans tout l'électorat, et le tribunal a continué à fonctionner sous les régimes successeurs longtemps après la réorganisation du Hofgericht lui-même en Appellationshof en 1810."

 han_georgia_augusta_bureaucracy: "Géorgie Augusta zu Göttingen"
 han_georgia_augusta_bureaucracy_desc: "L'Université de Göttingen, fondée en 1734 par le roi George II de Grande-Bretagne à la demande de son premier ministre hanovrien Gerlach Adolph von Mnchhausen, dont l'enseignement commençait en 1737. Conçue dès le départ comme une université des Lumières, la Georgia Augusta refusa les serments confessionnels traditionnels, recruta la faculté de droit piétiste de Halle et plaça l'érudition critique historique et les sciences naturelles au centre du programme d'études. À la fin du XVIIIe siècle, elle produisait plus de fonctionnaires hanovriens que toute autre institution et formait les fondateurs de l’histoire allemande moderne (Schlzer et Heeren) ainsi que le physicien Lichtenberg."
