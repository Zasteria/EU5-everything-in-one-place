l_french:
 STATIC_MODIFIER_NAME_nd_air_desert_sovereignty: "Souveraineté du désert"
 STATIC_MODIFIER_DESC_nd_air_desert_sovereignty: "Les Touareg chevauchent comme ils chevauchent depuis toujours, seigneurs invaincus du Sahara. La noblesse Ihaggaren commande à dos de chameau, et aucune armée étrangère ne peut la poursuivre à travers les sables infinis. Le désert lui-même est une forteresse, une arme et un trône."
 STATIC_MODIFIER_NAME_nd_air_gateway_of_the_sahara: "Porte du Sahara"
 STATIC_MODIFIER_DESC_nd_air_gateway_of_the_sahara: "Agadez se situe au carrefour du monde. Des salines de Bilma aux marchés de l'or du pays haoussa, du Maghreb à la boucle du Niger, toutes les caravanes franchissent nos portes. Les Touareg ont transformé leur désert en le plus grand corridor commercial d'Afrique."
 STATIC_MODIFIER_NAME_nd_air_amenokal_authority: "Autorité de l'Amenokal"
 STATIC_MODIFIER_DESC_nd_air_amenokal_authority: "L'Amenokal, chef suprême de la confédération, règne avec l'autorité de la tradition et le consentement des groupes de tambours. Sa parole fait loi dans tout le désert."
 STATIC_MODIFIER_NAME_nd_air_council_of_drum_groups: "Conseil des groupes de tambours"
 STATIC_MODIFIER_DESC_nd_air_council_of_drum_groups: "Les groupes de tambours de la confédération se réunissent en conseil, chacun représenté par son amghar. Le consensus règne et le sultanat perdure grâce à la négociation plutôt qu’à la contrainte."
 STATIC_MODIFIER_NAME_nd_air_salt_caravan_wealth: "Richesse de la caravane de sel"
 STATIC_MODIFIER_DESC_nd_air_salt_caravan_wealth: "Les caravanes azalaï reviennent chargées de briques de sel de Bilma, négociées avec des profits fabuleux sur les marchés du sud. Les richesses du désert passent entre les mains des Touaregs."
 STATIC_MODIFIER_NAME_nd_air_caravan_protection: "Protection des caravanes"
 STATIC_MODIFIER_DESC_nd_air_caravan_protection: "Des cavaliers touareg escortent les grandes caravanes à travers le Ténéré, leur présence garantissant un passage en toute sécurité sur le tronçon le plus dangereux de la route transsaharienne."
 STATIC_MODIFIER_NAME_nd_air_agadez_minaret: "Minaret d'Agadez"
 STATIC_MODIFIER_DESC_nd_air_agadez_minaret: "L'imposant minaret en briques crues d'Agadez, la plus haute structure du monde, témoigne de la piété et de l'ambition du sultanat."
 nd_air.1.t: "Montée de l'Air"
 nd_air.1.d: "The scattered Kel Ayr clans have united under a single banner. From the volcanic peaks of the Air Mountains to the burning sands of the Tenere, from the oasis gardens of Timia to the bustling markets of Agadez, the Tuareg people stand together.\n\nBut unity poses a question that the Tuareg have debated for generations. The Ihaggaren, the sword-bearing noble caste who ride their magnificent meharis across the open desert, see the confederation as a vehicle for Tuareg dominion over the Sahara. They would preserve the ancient ways: raiding, tribute-taking, the warrior's code that has made the Tuareg feared from the Maghreb to the Niger.\n\nYet Agadez itself tells a different story. This cosmopolitan city, where Tuareg nobles, Hausa merchants, and scholars from Timbuktu rub shoulders in the shadow of the great mosque, has grown wealthy not from the sword but from the caravan. The trans-Saharan trade in salt, gold, and slaves passes through our gates, and those who control the routes control the wealth of nations.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_air.1.a: "Nous sommes les seigneurs du désert. Que les sables soient notre domination !"
 nd_air.1.b: "Agadez sera la porte du Sahara !"
 nd_air.2.t: "Le sultanat prend forme"
 nd_air.2.d: "Around 1405, the fractious Tuareg clans of the Air region reached a remarkable agreement. Recognizing that constant inter-clan feuding weakened them against their neighbors, the expansionist Bornu Empire to the east, the Hausa city-states to the south, they resolved to create a neutral arbiter. The first Sultan, Yunus, was deliberately chosen for his neutrality: the son of a distant Tuareg father from Targa in Libya and a local servant woman, he belonged to no powerful local clan and thus could mediate impartially.\n\nThe institution proved its worth. His successor, Alhasan, moved the seat of the Sultanate to the newly-founded city of Agadez, where Tuareg, Hausa, and trans-Saharan merchants already mingled. The Sultan's drum, the ettebel, became the symbol of confederal unity, and the beat of that drum summoned the clans to council.\n\nNow the question is how this new Sultanate should govern. Shall the Amenokal rule with the authority of a centralized monarch, or shall the drum groups retain their ancient autonomy in a council of equals?"
 nd_air.2.a: "L'Aménokal parle et le désert obéit."
 nd_air.2.b: "Les groupes de tambours gouverneront par conseil et consensus."
 nd_air.3.t: "La route du sel"
 nd_air.3.d: "Twice each year, at the beginning of November and again in March, the great salt caravans depart from Agadez. These azalai, processions of hundreds, sometimes thousands, of camels, cross the vast emptiness of the Tenere desert on a three-week journey to the natron salt pans of Bilma and Kaouar. There they trade grain, dates, and cloth for great slabs of mineral salt, each weighing as much as a man can lift.\n\nThe return journey is more dangerous still, for the camels are now laden and slow. But the reward is immense: salt, a commodity more precious than silver in the kingdoms to the south, where it is traded weight-for-weight against gold at the markets of Kano and Katsina. The Tuareg clans who organize and protect these caravans stand to control one of the most lucrative trade routes in the world.\n\nShall we maximize the profits from this commerce, or shall we use the caravans to project military power across the desert?"
 nd_air.3.a: "Le commerce du sel nous rendra riches au-delà de toute mesure."
 nd_air.3.b: "Nos cavaliers garderont chaque grain de sel avec une lance et une épée."
 nd_air.4.t: "La Grande Mosquée d'Agadez"
 nd_air.4.d: "In the heart of Agadez, a remarkable structure rises above the mud-brick city. Attributed to the architect Sheikh Zakaria and constructed around 1515, the Grand Mosque features a pyramidal minaret standing twenty-seven meters high, the tallest mud-brick minaret in the world. Its stepped, tapering form narrows progressively upward, with protruding palm trunk beams embedded at intervals serving as both reinforcement and scaffolding for the annual replastering that keeps the structure standing against wind and rain.\n\nThe mosque was built during the period of Songhai influence, reflecting the synthesis of Sahelian, North African, and local Tuareg architectural traditions that makes Agadez unique. It serves not only as a place of worship but as a symbol of the city's importance, a beacon visible across the desert, telling approaching caravans that they have reached the gateway of the Sahara.\n\nThe faithful gather beneath its arches. The city takes pride in this monument to faith and ingenuity."
 nd_air.4.a: "Un phare de foi au cœur du désert."
 nd_air_mehari_tradition: "Tradition Méhari"
 nd_air_mehari_tradition_desc: "L'art ancien de la guerre dans le désert à dos de chameau, perfectionné par des générations d'Ihaggaren touareg chevauchant des méharis rapides à travers le Sahara."
 nd_air_caravan_guardians: "Gardiens de caravane"
 nd_air_caravan_guardians_desc: "Tours de guet fortifiées et escortes armées protégeant les routes commerciales transsahariennes vitales à travers le territoire aérien."
 nd_air_trans_saharan_routes: "Merchants of Takedda"
 nd_air_trans_saharan_routes_desc: "The people of Takedda live by trade alone. Each year they travel to Egypt and bring back its fine cloth, and they vie with one another in the number of their slaves. Their houses of red stone are storeroom and counting room at once."
 nd_air_camel_mastery: "Maîtrise des chameaux"
 nd_air_camel_mastery_desc: "Selective breeding of meharis for speed and endurance, the foundation of Tuareg economic and military power. The studs are kept in the valleys of the massif, where the herds rest between caravans."
 nd_air_ihaggaren_code: "Code Ihaggaren"
 nd_air_ihaggaren_code_desc: "Le code non écrit de la caste noble touarègue, régissant l'honneur, la guerre et les obligations de l'aristocratie porteuse d'épée."
 nd_air_kel_ayr_bonds: "Obligations de Kel Ayr"
 nd_air_kel_ayr_bonds_desc: "Les liens de parenté et les alliances matrilinéaires unissent la confédération Kel Ayr, permettant la coopération entre des clans farouchement indépendants."
 nd_air_takouba_tradition: "Tradition Takouba"
 nd_air_takouba_tradition_desc: "Maîtrise de la takouba, épée droite à double tranchant caractéristique de la noblesse touarègue, donnée aux jeunes hommes à leur majorité."
 nd_air_inadan_smiths: "Inadan Smiths"
 nd_air_inadan_smiths_desc: "The inadan caste of smiths and artisans who forge takouba blades, craft silver jewelry, and cut the sandals for which Agadez is known."
 nd_air_agadez_cross: "Croix d'Agadez"
 nd_air_agadez_cross_desc: "The distinctive silver cross of Agadez, symbol of protection and identity, crafted by inadan silversmiths and worn by every Tuareg traveler.\n\n#italic Available in: $nd_air_inadan_forge$#!"
 nd_air_sahelian_islam: "Islam sahélien"
 nd_air_sahelian_islam_desc: "Le mélange distinctif de l’islam pratiqué au Sahel, combinant l’observance sunnite orthodoxe et les traditions culturelles touarègues locales."
 nd_air_sultanate_founding: "Officers of the Sultan's House"
 nd_air_sultanate_founding_desc: "A sultan chosen from outside the drum groups has no tribe behind him, so a household is built in its place. Its officers are his own men and no chief's: a master of the courtyard, a judge, and the minister the Hausa call #italic sarkin turawa#!, who deals with the merchants of the north and leads the salt caravan."
 nd_air_matrilineal_alliances: "Alliances matrilinéaires"
 nd_air_matrilineal_alliances_desc: "La pratique touarègue de l'héritage matrilinéaire et du mariage entre cousins ​​croisés, créant un réseau d'alliances qui unit la confédération."
 nd_air_camel_lancers: "Lanciers de chameaux"
 nd_air_camel_lancers_desc: "La redoutable tactique de combat de Kel Ayr consistant à lancer des lances à dos de chameau avant de charger chez lui avec les épées takouba dégainées."
 nd_air_azalai_tradition: "Tradition Azalaï"
 nd_air_azalai_tradition_desc: "Les caravanes de sel semestrielles d'Agadez vers les salines de Bilma et Kaouar, l'une des routes commerciales les plus ardues et les plus rentables au monde."
 nd_air_bilma_salt_pans: "Salines de Bilma"
 nd_air_bilma_salt_pans_desc: "Extraction and processing of natron salt from the pans of Bilma, traded across West Africa at enormous profit. Part of the natron goes to the dyers, who use it in their vats.\n\n#italic Available in: $nd_air_indigo_dyeworks$#!"
 nd_air_indigo_cloth_trade: "Commerce de tissus indigo"
 nd_air_indigo_cloth_trade_desc: "La teinture indigo profonde qui donne aux Touareg leur réputation de « peuple bleu », leur tissu est prisé dans tout le Sahel."
 nd_air_desert_navigation: "Navigation dans le désert"
 nd_air_desert_navigation_desc: "Une expertise touarègue inégalée dans la lecture des étoiles, des vents et du terrain pour naviguer dans les étendues sans relief du Ténéré."
 nd_air_sovereignty_restored: "Souveraineté restaurée"
 nd_air_sovereignty_restored_desc: "Après l'effondrement de la suzeraineté Songhaï suite à l'invasion marocaine de 1591, le sultanat d'Agadez a réaffirmé son indépendance."
 nd_air_agadez_garrison: "Garnison d'Agadez"
 nd_air_agadez_garrison_desc: "La milice urbaine d'Agadez, issue de la population sédentaire de la ville pour défendre ses murailles et ses marchés."
 nd_air_desert_scholarship: "Bourse du désert"
 nd_air_desert_scholarship_desc: "L'érudition islamique est florissante à Agadez, où des érudits de tout le Sahel se rassemblent pour étudier la théologie, le droit et l'astronomie."
 nd_air_ghazw_raids: "Raids Ghazw"
 nd_air_ghazw_raids_desc: "La tradition touarègue des raids dans le désert, des frappes rapides de cavalerie qui mettent à nu un ennemi avant de disparaître dans le sable."
 nd_air_agadez_market_tolls: "Péages du marché d’Agadez"
 nd_air_agadez_market_tolls_desc: "Taxation systématique des marchandises transitant par Agadez, le plus grand marché entre le Maghreb et le pays haoussa."
 nd_air_air_mountains_refuge: "Walls of Agadez"
 nd_air_air_mountains_refuge_desc: "Leo Africanus knew Agadez as a walled city whose king kept a strong guard. Behind the wall a beaten host finds water, grain and time to gather itself again."
 nd_air_drum_group_council: "Conseil du groupe de tambour"
 nd_air_drum_group_council_desc: "Le conseil des groupes de tambours, chacun dirigé par son amghar, se réunit pour résoudre les différends, attribuer les droits de pâturage et coordonner les affaires de la confédération."
 nd_air_saharan_ghazis: "Ghazis sahariens"
 nd_air_saharan_ghazis_desc: "Guerriers sacrés touareg d'élite combinant l'ancienne tradition de cavalerie du désert avec le zèle martial islamique."
 nd_air_sultanate_reform: "Réforme du Sultanat"
 nd_air_sultanate_reform_desc: "Centralisation de l'autorité du sultanat, étendant la gouvernance directe du sultan au-delà d'Agadez à la confédération plus large."
 nd_air_desert_logistics: "Logistique du désert"
 nd_air_desert_logistics_desc: "Maîtrise du ravitaillement et des déplacements dans le désert, permettant aux armées touarègues d'opérer sur de vastes distances là où d'autres périraient."
 nd_air_warrior_code: "Code du guerrier"
 nd_air_warrior_code_desc: "La codification des traditions martiales touarègues en un code guerrier formel régissant le combat, l'honneur et le traitement des ennemis vaincus."
 nd_air_tuareg_identity: "Identité touarègue"
 nd_air_tuareg_identity_desc: "L'identité culturelle touarègue durable, la langue tamasheq, le voile, les bijoux en argent, la poésie, persistant à travers des siècles de pression extérieure."
 nd_air_unconquerable_sahara: "Sahara invincible"
 nd_air_unconquerable_sahara_desc: "Le Sahara reste invincible. Aucune colonne européenne, aucune armée ottomane, aucune puissance étrangère ne peut tenir le désert face à des guerriers qui connaissent chaque dune et chaque oued."
 nd_air_confederal_resilience: "Résilience confédérale"
 nd_air_confederal_resilience_desc: "La remarquable durabilité du système confédéral touareg, survivant à la conquête, à la sécheresse et à la pression coloniale grâce à la solidarité collective."
 nd_air_pastoral_adaptation: "Adaptation pastorale"
 nd_air_pastoral_adaptation_desc: "L'adaptation continue des pratiques pastorales touarègues aux conditions environnementales et économiques changeantes du Sahara."
 a_nd_air_mehari_raiders: "Méhari Raiders"
 a_nd_air_mehari_raiders_desc: "Des pillards rapides du désert montés sur des chameaux de course, les mehari. Ces guerriers touareg frappent sans prévenir et disparaissent dans le sable avant qu’une quelconque réponse organisée puisse se former."
 a_nd_air_takouba_swordsmen: "Épéistes Takouba"
 a_nd_air_takouba_swordsmen_desc: "Guerriers touareg d'élite de la caste noble Ihaggaren, brandissant le takouba distinctif, une épée droite à double tranchant d'une longueur moyenne de quatre-vingts centimètres, associée à un bouclier en cuir suffisamment grand pour couvrir le corps d'un homme."
 a_nd_air_kel_ayr_lancers: "Kel Ayr Lanciers"
 a_nd_air_kel_ayr_lancers_desc: "Lanciers à dos de chameau de la confédération Kel Ayr qui lancent des lances à dos de chameau avant de conclure avec des épées takouba. Leurs charges de flanc dispersent les formations ennemies à travers le désert."
 a_nd_air_agadez_spearmen: "Lanciers d'Agadez"
 a_nd_air_agadez_spearmen_desc: "Des prélèvements urbains disciplinés tirés de la population sédentaire d'Agadez, un mélange de citadins touaregs, de marchands haoussa et d'artisans qui défendent la ville et ses marchés."
 a_nd_air_saharan_ghazis: "Ghazis sahariens"
 a_nd_air_saharan_ghazis_desc: "Saints guerriers du désert qui combinent l'ancienne tradition de cavalerie touarègue avec le zèle martial islamique, partant à la guerre sous la bannière verte de la foi."
 nd_air_caravanserai: "Red Stone Merchant House"
 nd_air_caravanserai_desc: "The house of a long-distance trader, built of red stone as at Takedda. Storerooms stand below, a yard holds his camels and porters, and in one room the accounts with Egypt and the Hausa towns are kept."
 nd_air_inadan_forge: "Forge d'Inadan"
 nd_air_inadan_forge_desc: "A workshop of the inadan smithing caste, where takouba blades are forged, silver jewelry crafted, and the sandals of Agadez cut."
 nd_air_banco_mosque: "Mosquée du Banco"
 nd_air_banco_mosque_desc: "Mosquée en briques crues de style sahélien distinctif, son minaret surplombé de poutres en tronc de palmier qui servent d'échafaudage permanent pour l'entretien annuel."
 nd_air_indigo_dyeworks: "Teintures indigo"
 nd_air_indigo_dyeworks_desc: "Une usine de teinture où le tissu est imprégné d'indigo profond, produisant le tissu qui donne aux Touareg leur réputation de peuple bleu du désert."
 nd_air_salt_depot: "Dépôt de sel"
 nd_air_salt_depot_desc: "Un entrepôt et un centre de distribution des briques de sel de natron amenées de Bilma par les caravanes azalaï, l'une des marchandises les plus précieuses d'Afrique de l'Ouest."
 nd_air_desert_watchtower: "Tour de guet du désert"
 nd_air_desert_watchtower_desc: "Un poste d'observation fortifié sur les routes des caravanes, tenu par des guerriers touaregs qui gardent les voies commerciales contre les bandits et les pillards rivaux."
 nd_air_caravanserai_upkeep: "Household Provisions"
 nd_air_caravanserai_upkeep_desc: "Livestock, grain, and salt for the merchant's household, his porters and their animals."
 nd_air_mehari_stud: "Mehari Stud"
 nd_air_mehari_stud_desc: "A herd of riding camels kept in a valley of the massif and bred for speed and endurance, apart from the pack herds of the plain. It can stand only on highland pasture. Its camels mount the riders."
 nd_air_forge_upkeep: "Forge Takouba"
 nd_air_forge_upkeep_desc: "Les forgerons inadan forgent le fer et le cuivre pour fabriquer des épées takouba et d'autres armes prisées dans tout le Sahara."
 nd_air_mosque_upkeep: "Entretien de la mosquée"
 nd_air_mosque_upkeep_desc: "Pierre et bois pour le replâtrage annuel et l'entretien structurel de la mosquée en briques crues, et encens pour le culte."
 nd_air_dyeworks_upkeep: "Teinture indigo"
 nd_air_dyeworks_upkeep_desc: "Tissu imprégné d'une teinture indigo profonde, produisant le fin tissu bleu qui fait la renommée des Touareg."
 nd_air_salt_depot_upkeep: "Opérations du dépôt de sel"
 nd_air_salt_depot_upkeep_desc: "Inventaire de sel, animaux de bât et outils nécessaires au fonctionnement du dépôt et à la distribution du sel sur les marchés."
 nd_air_watchtower_upkeep: "Garnison de la Tour de Guet"
 nd_air_watchtower_upkeep_desc: "Fortifications en pierre, armes et provisions pour la garnison qui tient la tour de guet du désert."
 nd_air_salt_processing: "Natron Dye Bath"
 nd_air_salt_processing_desc: "Natron from the salt pans is stirred into the indigo vat. The dye takes with less indigo, and more cloth leaves the works for each load of dye."
 nd_air_silver_crafting: "Fabrication de bijoux en argent"
 nd_air_silver_crafting_desc: "L'artisanat inadan consistant à travailler l'argent et le cuivre pour en faire des croix, des amulettes et des ornements distinctifs qui marquent l'identité touarègue."
 nd_air_camel_breeding: "Programme d'élevage de chameaux"
 nd_air_camel_breeding_desc: "Selective breeding of camels fed on millet and salt, producing the finest riding and pack animals in the Sahara."
 levy_nd_air_mehari_raiders: "Prélèvement Mehari Raider"
 levy_nd_air_mehari_raiders_desc: "Tuareg clansmen raised as camel-mounted desert raiders, riding in the traditional style of the Ihaggaren."
 levy_nd_air_agadez_spearmen: "Prélèvement des lanciers d'Agadez"
 levy_nd_air_agadez_spearmen_desc: "Prélèvements urbains prélevés sur la population sédentaire d'Agadez pour défendre la ville et ses marchés."
 nd_air_desert_madrasa: "Médersa du désert"
 nd_air_desert_madrasa_desc: "École islamique de tradition sahélienne, où les érudits étudient la théologie, le droit et l'astronomie sous le patronage du sultanat."
 nd_air_madrasa_upkeep: "Opérations de la madrasa"
 nd_air_madrasa_upkeep_desc: "Papier et tissu pour la bibliothèque et les étudiants de l'école, et pierre pour l'entretien des structures."
 nd_air_leather_trade: "Sandals of Agadez"
 nd_air_leather_trade_desc: "Hides are tanned red and cut into the broad sandals of Agadez and the small leather boxes travellers carry. Both go south with the caravans to the Hausa towns."
 nd_air_saharan_commerce: "Commerce saharien"
 nd_air_saharan_commerce_desc: "The maturation of trans-Saharan trade networks into a sophisticated commercial system linking the Mediterranean to the Niger. Sandals from the smiths' quarter go out with every caravan.\n\n#italic Available in: $nd_air_inadan_forge$#!"
 nd_air_trade_exchange: "Bourse commerciale saharienne"
 nd_air_trade_exchange_desc: "Un marché modernisé où les marchands caravaniers, les artisans locaux et les commerçants étrangers se réunissent pour échanger des marchandises selon des conditions réglementées."
 nd_air_exchange_upkeep: "Opérations d'échange"
 nd_air_exchange_upkeep_desc: "Pierre, papier et outils nécessaires à l'entretien des installations d'échange et à la tenue des registres."
 nd_air_modern_trade: "Commerce moderne"
 nd_air_modern_trade_desc: "Adaptation of the ancient caravan trade to the changing economic realities of the modern era, with regulated marketplaces and systematic record-keeping."
 nd_air_formed_tt: "L'air s'est formé"
 nd_air_path_a_tt: "Choisissez la souveraineté du désert"
 nd_air_path_b_tt: "Choisissez la Porte du Sahara"
 nd_air_destiny: "Destin de l'Air"
 nd_air_destiny_desc: "Le Sultanat de l’Air est forgé. Désormais, les Touareg doivent décider de leur voie : conquériront-ils le sud fertile ou maîtriseront-ils les routes commerciales qui traversent le désert ?"
 nd_air_dest_hausaland: "La campagne du pays haoussa"
 nd_air_dest_hausaland_desc: "Les riches cités-États haoussa du sud sont depuis longtemps la cible des raids touaregs. Il est désormais temps de transformer les raids en conquête. Saisissez Katsina et écrasez Gobir pour établir la domination touarègue sur le Sahel central."
 nd_air_dest_kano: "La chute de Kano"
 nd_air_dest_kano_desc: "Kano, the richest city in Hausaland, is the prize that will make the Tuareg the masters of the central Sahel. Its vast markets, its dye pits, its walls, all must submit to our rule, and half of the southern Hausa country with them."
 nd_air_dest_south_hausa_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in South Hausaland"
 nd_air_dest_north_hausa_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in North Hausaland"
 nd_air_dest_saharan_empire: "Empire saharien"
 nd_air_dest_saharan_empire_desc: "From the Bornu Empire's capital at Ngazargamu to the Kebbi stronghold of Sokoto, the entire central Sahel must bow to Tuareg authority, and half of the northern Hausa country must be held. This is the capstone of a desert empire stretching from the Air Mountains to the shores of Lake Chad."
 nd_air_dest_salt_road: "La route du sel"
 nd_air_dest_salt_road_desc: "Les marais salants de Bilma sont l’élément vital du commerce transsaharien. En assurant un contrôle direct sur cette source, les Touareg peuvent dicter le prix du produit le plus précieux d’Afrique de l’Ouest."
 nd_air_dest_fezzan_link: "Le lien Fezzan"
 nd_air_dest_fezzan_link_desc: "L'oasis de Ghat dans le Fezzan est la porte nord de la route transsaharienne. En contrôlant à la fois Bilma et Ghat, les Touareg tiennent entre leurs mains tout le corridor central du commerce saharien."
 nd_air_dest_master_of_routes: "Maître des Routes"
 nd_air_dest_master_of_routes_desc: "Tombouctou, la légendaire cité de l'or et du savoir, est le terminus occidental du grand réseau commercial saharien. En étendant le contrôle touareg jusqu’à la boucle du Niger, Air devient le maître incontesté du commerce transsaharien."
 nd_air.5.t: "Le chemin de l'air"
 nd_air.5.d: "The Sultanate of Air stands united. The Tuareg confederation has proven its strength, and the drum groups beat with a single rhythm. But the question that has always divided our people remains: what shall we build with this unity?\n\nThe desert is our dominion. The choice we make now will shape the destiny of the Tuareg for generations to come."
 nd_air.5.a: "Le destin d'Air commence maintenant."
 nd_air.6.t: "Les portes du pays haoussa"
 nd_air.6.d: "The Hausa city-states have grown fat behind their walls, trading the produce of their fertile lands while paying tribute to whichever power can muster enough riders to threaten their gates. For too long, the Tuareg have been content to raid and withdraw. No more.\n\nKatsina, with its famous textile markets and strategic position on the trade routes, and Alkalawa, the seat of the Gobir kings who have contested Tuareg supremacy for generations, both have fallen to our cavalry. The Hausa learn what the Saharan peoples have always known: there is no wall high enough to stop a Tuareg charge."
 nd_air.6.a: "La colère du désert ne connaît pas de murs."
 nd_air.7.t: "Kano Soumet"
 nd_air.7.d: "The great walls of Kano, which have stood for centuries, have opened to our forces. This is no mere border town, Kano is the greatest commercial center in all of Hausaland, home to the famous indigo dye pits that produce cloth traded as far as Egypt and Morocco. Its sprawling markets deal in leather, grain, kola nuts, and slaves.\n\nNow we must decide how to govern this prize. Shall we extract tribute in the traditional Tuareg manner, seasonal demands backed by the threat of the mehari, or shall we establish a permanent garrison and integrate Kano into our confederal system?"
 nd_air.7.a: "L'hommage est la manière de faire des Touareg. Prenez ce dont nous avons besoin et continuez votre route."
 nd_air.7.b: "Plantez notre bannière à Kano et tenez-la pour toujours."
 nd_air.8.t: "Empire des Sables"
 nd_air.8.d: "From the Air Mountains to the shores of Lake Chad, from the dunes of the Tenere to the banks of the Niger, the Tuareg have built what no one believed possible: a true Saharan empire. Ngazargamu, the ancient Bornu capital, has fallen. Sokoto bends the knee. The Hausa city-states are tributaries or provinces.\n\nThis achievement defies the conventional wisdom that desert nomads cannot build lasting states. The question now is what kind of empire this shall be. Shall we remain what we have always been, raiders supreme, extracting wealth from the settled peoples while preserving our nomadic freedom? Or shall we become something new, true emperors who govern as well as conquer?"
 nd_air.8.a: "Nous chevauchons, nous faisons des raids, nous gouvernons, à la manière des Touareg."
 nd_air.8.b: "La couronne d'un empereur pèse plus que le voile d'un cavalier."
 nd_air.9.t: "Seigneurs du sel de Bilma"
 nd_air.9.d: "The natron salt pans of Bilma now lie under direct Tuareg control. For centuries, the azalai caravans have crossed the Tenere to purchase salt here, but the Tuareg have been middlemen and escorts rather than owners. No longer.\n\nWith Bilma in our hands, we control the source. Every brick of salt that leaves these pans, traded weight-for-weight against gold in the markets of the south, enriches the Sultanate directly. The wealth of the desert flows through Tuareg hands at last."
 nd_air.9.a: "Le sel est à nous, et avec lui, la richesse des nations."
 nd_air.10.t: "Porte d'entrée vers le Nord"
 nd_air.10.d: "The oasis town of Ghat, nestled in the Fezzan at the foot of the Acacus Mountains, has long been the northern terminus of the central trans-Saharan route. Tuareg caravans have always passed through Ghat, but now we hold it ourselves.\n\nWith Bilma in the south and Ghat in the north, the entire central corridor of the Saharan trade is a Tuareg road. Mediterranean goods flow south through our territory; Sahelian gold, salt, and slaves flow north. We are the indispensable middlemen.\n\nShall we maximize our position as intermediaries, taxing every bale and slave that crosses our territory? Or shall we invest in the oasis infrastructure itself, turning every waypoint into a prosperous market town?"
 nd_air.10.a: "Chaque grain de sable traversé par les caravanes, nous le taxons."
 nd_air.10.b: "Construisez des puits, construisez des marchés, faites fleurir le désert."
 nd_air.11.t: "La route d'or"
 nd_air.11.d: "Timbuktu, the city of three hundred and thirty-three saints, the seat of the Sankore Madrasa, the legendary destination of Mansa Musa's pilgrimage, Timbuktu is ours. With it, the Tuareg control the entire breadth of the trans-Saharan trade, from the salt pans of Bilma in the east to the gold markets of the Niger bend in the west, from the Mediterranean shores of the Fezzan to the banks of the great river.\n\nNo merchant, no caravan, no trade good crosses the Sahara without Tuareg permission and Tuareg profit. This is the culmination of centuries of desert mastery, the Tuareg have transformed the most inhospitable landscape on earth into the most profitable."
 nd_air.11.a: "L’or coule vers le nord, le sel vers le sud, et nous profitons des deux."
 nd_air.11.b: "Laissez Agadez rivaliser avec Tombouctou en tant que ville d’apprentissage et de commerce."
 STATIC_MODIFIER_NAME_nd_air_dest_kano_tribute: "Hommage à Kano"
 STATIC_MODIFIER_DESC_nd_air_dest_kano_tribute: "Hommage saisonnier exigé de Kano à la manière traditionnelle des Touaregs : des chameaux chargés de tissus indigo, de cuir et de céréales transportés vers le nord jusqu'à Agadez, alimentant le recrutement mais négligeant la construction permanente."
 STATIC_MODIFIER_NAME_nd_air_dest_kano_garrison: "Garnison de Kano"
 STATIC_MODIFIER_DESC_nd_air_dest_kano_garrison: "Une garnison touareg permanente tient Kano, établissant des réseaux de renseignement à travers le pays haoussa et accélérant le rythme de la guerre dans le désert, même si les coûts de l'occupation font grimper les prix."
 STATIC_MODIFIER_NAME_nd_air_dest_eternal_raiders: "Raiders éternels"
 STATIC_MODIFIER_DESC_nd_air_dest_eternal_raiders: "L’empire touareg fonctionne selon le principe ancien : chevaucher, attaquer, extraire et avancer. Les guerres sont menées avec une initiative infatigable, même si l’érudition souffre dans une société qui privilégie l’épée au-dessus de la plume."
 STATIC_MODIFIER_NAME_nd_air_dest_desert_emperor: "Empereur du désert"
 STATIC_MODIFIER_DESC_nd_air_dest_desert_emperor: "L'Aménokal est devenu un véritable empereur, gouvernant les peuples conquis avec un brio tactique et un mélange de tradition confédérale touarègue et d'autorité centralisée."
 STATIC_MODIFIER_NAME_nd_air_dest_saharan_middlemen: "Intermédiaires sahariens"
 STATIC_MODIFIER_DESC_nd_air_dest_saharan_middlemen: "Les Touareg profitent de chaque transaction sur la route transsaharienne, réduisant les dépenses militaires et améliorant leur prestige, même si la classe marchande montre peu d'intérêt pour la guerre de siège."
 STATIC_MODIFIER_NAME_nd_air_dest_oasis_network: "Réseau Oasis"
 STATIC_MODIFIER_DESC_nd_air_dest_oasis_network: "Investment in wells, waypoints, and market infrastructure transforms the harsh desert corridor into a chain of prosperous oasis towns that draw settlers from the camps, though reliance on hired soldiers grows."
 STATIC_MODIFIER_NAME_nd_air_dest_gold_and_salt: "L'or et le sel"
 STATIC_MODIFIER_DESC_nd_air_dest_gold_and_salt: "Le monopole touareg sur le commerce transsaharien atteint son apogée : l’influence culturelle rayonne à travers le Sahel et la portée diplomatique s’étend, même si le succès engendre une dangereuse complaisance."
 STATIC_MODIFIER_NAME_nd_air_dest_cosmopolitan_hub: "Centre cosmopolite"
 STATIC_MODIFIER_DESC_nd_air_dest_cosmopolitan_hub: "Agadez devient une ville d'érudits, de commerçants et d'artisans venus de tout le Sahara et du Sahel, où la tolérance envers les diverses confessions attire des diplomates et des commerçants de pays lointains."
 nd_air_war_camp: "Camp de guerre saharien"
 nd_air_war_camp_desc: "Une base fortifiée pour les campagnes dans le désert, où les guerriers se rassemblent, les chameaux sont abreuvés et les armes sont aiguisées avant les grands raids vers le sud."
 nd_air_war_camp_upkeep: "Dispositions du camp de guerre"
 nd_air_war_camp_upkeep_desc: "Armes, bétail et cuir nécessaires pour entretenir le camp de guerre et équiper les guerriers pour les campagnes dans le désert."
 nd_air_grand_caravanserai: "Grand Caravansérail"
 nd_air_grand_caravanserai_desc: "La plus grande étape de la route transsaharienne, un complexe fortifié d'entrepôts, d'écuries, de puits et de quartiers marchands où convergent les caravanes de toutes les directions."
 nd_air_grand_caravanserai_upkeep: "Opérations du Grand Caravansérail"
 nd_air_grand_caravanserai_upkeep_desc: "Pierre, bétail, sel et tissu nécessaires à l'entretien du grand caravansérail et à l'approvisionnement des grandes caravanes."

 # ===== BUREAUCRACIES =====
 air_agadez_sultanate_bureaucracy: "Scribes of the Agadez Chronicle"
 air_agadez_sultanate_bureaucracy_desc: "The sultans of Agadez kept scribes who wrote in Arabic. Each reign was set down in the chronicle of the house, from Yunus onward, so that a sultan could show whose heir he was. The same men wrote his letters to Bornu, to the Hausa kings and to the scholars of Cairo, from where al-Suyuti answered a sultan of Agadez in the 1490s. Foreign princes knew the Aïr by those letters. The drum chiefs, whose word had been the only record, saw what a written court could do without them."
 air_cure_salee_bureaucracy: "Compact de vente de remèdes"
 air_cure_salee_bureaucracy_desc: "Le congrès annuel aux salines d'In-Gall et des salines de Tegidda-n-Tesemt, où à la fin des pluies les confédérations Kel Touareg se réunissaient pour abreuver leurs troupeaux, régler les différends, se marier entre groupes de tambours et confirmer le sultan dans ses fonctions. Chaque chef de tambour apportait du sel, des dattes et des animaux en tribut ; chacun a retiré le droit de migrer vers le nord dans les plaines du Tamesna pour la saison sèche. La fête était la constitution de travail de l'Ar - aucun sultan ne pouvait l'ignorer, aucune tribu ineslemen ne pouvait échapper à ses tarifs - et plus elle durait, plus il devenait difficile de la mettre de côté, puisque les migrations de troupeaux elles-mêmes s'étaient organisées autour de son calendrier."
 air_kel_owey_caravan_bureaucracy: "Caravane compacte Kel Owey"
 air_kel_owey_caravan_bureaucracy_desc: "Le système de garant des caravanes touareg, par lequel les confédérations Kel Owey et Kel Geres dirigeaient, arrosaient et protégeaient le grand azalaï de sel et de mil entre les marais salants de Bilma et les marchés haoussa de Kano et Katsina, prenant en retour les tiws (devoir de caravane) des marchands de Ghadamès, Tuat et Kano. Le pacte reposait sur un monopole effectif de la connaissance du désert : seul un guide touareg expérimenté pouvait trouver de l'eau sur les longues traversées entre Fachi et Bilma. Les notables de Kel Owey s'enrichirent grâce à elle, les bergers imrad effectuèrent le travail et n'apprécièrent pas la coupe, et les caravaniers esclaves iklan transportèrent les charges sur le dos desquels le système reposait."
 air_ineslemen_tariqat_bureaucracy: "Ineslemen Tariqat"
 air_ineslemen_tariqat_bureaucracy_desc: "Le réseau des tribus cléricales-marabouts - les Kel es-Suq, les Iberkawan, héritiers des lignées almoravides - qui se situaient en dehors des imajeghen nobles et guerriers mais à l'intérieur de la société touarègue Kel. Leurs écoles à Assod, Tadeliza et Agadez enseignaient la grammaire arabe, le fiqh Maliki et les litanies de l'ordre Qadiriyya ; leurs juges arbitraient les litiges commerciaux de Tahoua à Iférouane ; leurs lettres d'introduction ont ouvert tous les marchés de Tombouctou à Murzuq. La noblesse guerrière les tolérait parce qu’ils apportaient l’alphabétisation, la légitimité et une neutralité reconnue, mais elle était mécontente de l’autorité morale que conféraient la lecture et l’écriture."

 AUTO_MODIFIER_NAME_nd_air_bureaucracy_authority: "Tambour du Sultanat"
 AUTO_MODIFIER_DESC_nd_air_bureaucracy_authority: "Le temalla - le grand tambour de guerre qui voyage avec le sultan et ne retentit qu'à son accession et à l'appel des confédérations - est venu se reposer à Agadez en tant qu'institution permanente plutôt que comme propriété empruntée au dernier chef de tambour qui l'a détenu. Le Sultanat peut désormais soutenir l'une des institutions permanentes par lesquelles l'Ar se gouverne lui-même."
