l_french:
 VJN: "Karnata"
 VJN_ADJ: "Karnata"
 VJN_f: "Empire du Karnata"
 VJN_f_desc: "Restaurer la dignité impériale de Vijayanagara, le grand empire hindou du sud. Forgé dans le creuset de la résistance contre les sultanats du Deccan et élevé à son apogée sous Krishnadeva Raya, le Karnata Rajya unit les peuples dravidiens sous la bannière-sanglier de Varaha, gardien du dharma, patron des temples et maître des côtes marchandes d'épices."
