l_french:
 # === ADVANCE NAMES AND DESCRIPTIONS ===
 nd_pgr_gold_of_suvarnadvipa: "L'or de Suvarnadvipa"
 nd_pgr_gold_of_suvarnadvipa_desc: "Depuis l’Antiquité, Sumatra est connue sous le nom de Suvarnadvipa, l’Île d’Or. Les hauts plateaux Minangkabau de Tanah Datar contiennent certains des gisements d'or alluviaux les plus riches d'Asie du Sud-Est, et Adityawarman a fondé son royaume spécifiquement pour contrôler cette richesse. Les mineurs des hautes terres parcourent les rivières et creusent des gisements à flanc de colline, envoyant des caravanes d'or sur les pentes de Bukit Barisan jusqu'aux ports côtiers."
 nd_pgr_matrilineal_adat: "Adat matrilinéaire"
 nd_pgr_matrilineal_adat_desc: "Les Minangkabau pratiquent le plus grand système matrilinéaire au monde. La propriété, la terre et la maison ancestrale passent par la lignée féminine. Les femmes possèdent le rumah gadang et les hommes qui se marient déménagent dans la maison de leur femme. Cet adat, le droit coutumier, régit l'héritage, le mariage et le règlement des différends par le biais d'un système élaboré de conseils de clan et de chefs élus."
 nd_pgr_rumah_gadang_tradition: "Tradition Rumah Gadang"
 nd_pgr_rumah_gadang_tradition_desc: "La rumah gadang, littéralement « grande maison », est la maison longue emblématique de Minangkabau avec son toit relevé spectaculaire ressemblant à des cornes de buffle. Ces habitations communautaires abritent une famille matrilinéaire élargie, servent de salles de cérémonie et symbolisent la continuité du clan. Leurs façades en bois sculpté racontent l'histoire du patrimoine de chaque famille."
 nd_pgr_silek_tradition: "Tradition Silek"
 nd_pgr_silek_tradition_desc: "Les premières traditions structurées de pencak silat proviennent des hauts plateaux de Minangkabau, où les jeunes hommes apprennent l'art du surau parallèlement à l'étude coranique et aux coutumes adat. Silek Minangkabau met l'accent sur un jeu de jambes fluide, des coups de pied rapides et des parades défensives. Chaque Nagari considère sa tradition du silat comme un héritage du village, pusaka anak nagari, destiné à protéger ceux qui s'aventurent sur le rantau."
 nd_pgr_nagari_governance: "Gouvernance de Nagari"
 nd_pgr_nagari_governance_desc: "Le nagari est l'unité fondamentale de l'organisation politique du Minangkabau, une république villageoise autonome avec son propre conseil d'anciens élus, ses propres lois adat et ses propres procédures judiciaires. Contrairement aux royaumes centralisés, l'autorité de Pagarruyung repose sur le prestige et l'arbitrage plutôt que sur la force militaire, chaque nagari conservant une autonomie considérable."
 nd_pgr_highland_terraces: "Terrasses des Highlands"
 nd_pgr_highland_terraces_desc: "Les hauts plateaux volcaniques de l'ouest de Sumatra sont sculptés en terrasses de riz humides élaborées qui dévalent les pentes du Bukit Barisan. Ces champs irrigués sawah étaient parmi les premiers sites de culture du riz dans le monde malais, nourrissant une population croissante des hautes terres et fournissant la base agricole de la prospérité de Minangkabau."
 nd_pgr_rajo_tigo_selo: "Rajo Tigo Selo"
 nd_pgr_rajo_tigo_selo_desc: "Le Royaume de Pagarruyung est gouverné par le Rajo Tigo Selo, les Trois Rois Assis les jambes croisées. Raja Alam à Pagaruyung détient le pouvoir exécutif, Raja Adat à Buo arbitre le droit coutumier et Raja Ibadat à Sumpur Kudus supervise les affaires religieuses. Ce triumvirat équilibre l’autorité du monde, les coutumes traditionnelles et l’orientation spirituelle, chacun vérifiant les autres."
 nd_pgr_merantau_tradition: "Tradition de Merantau"
 nd_pgr_merantau_tradition_desc: "Les Minangkabau sont animés par le merantau, la tradition qui consiste à quitter son pays natal pour chercher fortune, connaissances et expériences dans des pays lointains. Les jeunes hommes, exclus de l'héritage foncier en vertu du système matrilinéaire, s'aventurent à établir des réseaux commerciaux à travers l'archipel. Cette diaspora crée un réseau de communautés marchandes Minangkabau de Malacca à Java."
 nd_pgr_gold_caravan_routes: "Itinéraires des caravanes dorées"
 nd_pgr_gold_caravan_routes_desc: "Les entrepreneurs aurifères de Minangkabau conduisent des caravanes d'une centaine d'hommes ou plus à pied sur les pentes accidentées du Bukit Barisan jusqu'aux ports de la côte ouest. Ces routes de l’or relient les mines des hautes terres de Tanah Datar aux réseaux commerciaux maritimes de l’océan Indien, faisant de Pagarruyung un maillon crucial du commerce mondial de l’or."
 nd_pgr_surau_education: "Éducation Surau"
 nd_pgr_surau_education_desc: "Le surau est le cœur de l'éducation Minangkabau. Dans ce bâtiment communal, de jeunes garçons et hommes vivent ensemble, apprenant à réciter le Coran, à étudier les connaissances religieuses, à maîtriser le pencak silat et à s'imprégner des traditions adat grâce à l'enseignement oral. Le système Surau produit non seulement des érudits locaux, mais aussi des penseurs islamiques de calibre international qui se sont répandus dans tout le Nusantara."
 nd_pgr_highland_islamization: "Islamisation des hautes terres"
 nd_pgr_highland_islamization_desc: "L'Islam arrive progressivement dans les hauts plateaux de Minangkabau au cours du XVIe siècle, transformant le royaume hindou-bouddhiste d'Adityawarman en un sultanat islamique. Le premier dirigeant musulman, connu dans la tradition sous le nom de Sultan Alif, marque le début d’un remarquable compromis entre la loi coranique et la coutume matrilinéaire qui définira l’identité Minangkabau pendant des siècles."
 nd_pgr_minang_bladesmithing: "Fabrication de lames Minangkabau"
 nd_pgr_minang_bladesmithing_desc: "Les forgerons de Minangkabau sont des métallurgistes experts, forgeant les keris, les klewang et d'autres armes blanches pour les guerriers locaux et les exportant vers les États voisins. Les hulubalang, officiers militaires et gardes du corps royaux, portent ces armes finement travaillées comme symboles de leur rang. La production d'armes approvisionne non seulement les défenseurs de Pagarruyung mais aussi les marchés d'Aceh."
 nd_pgr_pepper_trade: "Commerce du poivre"
 nd_pgr_pepper_trade_desc: "Les pentes occidentales des hauts plateaux de Minangkabau produisent de grandes quantités de poivre noir, une denrée qui attire les marchands étrangers vers les ports de Sumatra. Le poivre rejoint l'or comme pilier de l'économie d'exportation du royaume, les commerçants de Minangkabau contrôlant la chaîne d'approvisionnement depuis les plantations des hautes terres jusqu'aux entrepôts côtiers."
 nd_pgr_adat_basandi_syarak: "Adat Basandi Syarak"
 nd_pgr_adat_basandi_syarak_desc: "Les Minangkabau réalisent une synthèse remarquable : 'Adat basandi syarak, syarak basandi Kitabullah', la coutume est basée sur la loi islamique, la loi islamique est basée sur le Coran. Ce cadre philosophique réconcilie l'héritage matrilinéaire avec la jurisprudence islamique, créant un système juridique unique dans lequel l'héritage élevé passe par les femmes et l'héritage faible suit les règles coraniques."
 nd_pgr_minang_diaspora: "Diaspora Minangkabau"
 nd_pgr_minang_diaspora_desc: "Les communautés Minangkabau rantau s'étendent désormais dans tout le monde malais. De Malacca à Negeri Sembilan, de Java à Bornéo, des réseaux de migrants composés de commerçants, d'érudits et d'artisans entretiennent des liens étroits avec leurs hauts plateaux tout en dominant le commerce local partout où ils s'installent. Leur réputation d’astuce et de soutien mutuel en fait de redoutables concurrents économiques."
 nd_pgr_cassia_cultivation: "Culture de Cassia"
 nd_pgr_cassia_cultivation_desc: "Les forêts des hautes terres de l'ouest de Sumatra produisent de l'écorce de cassia, un proche parent de la cannelle, prisée en Asie et en Europe comme épice et conservateur. Les agriculteurs de Minangkabau cultivent la cassia aux côtés du poivre, diversifiant ainsi l'économie d'exportation au-delà de l'or et créant une nouvelle source de richesse à partir du sol volcanique."
 nd_pgr_fortified_nagari: "Nagari fortifié"
 nd_pgr_fortified_nagari_desc: "À mesure que les menaces extérieures grandissent, dues à l'expansion d'Aceh, à la rivalité javanaise et finalement à l'empiétement européen, les villages Minangkabau se fortifient. Les Nagari, déjà autonomes, construisent désormais des remparts en terre, des palissades en bambou et des murs en pierre. Le terrain des hauts plateaux de Bukit Barisan sert de fortification naturelle, faisant de chaque nagari fortifié une formidable position défensive."
 nd_pgr_bukit_barisan_mastery: "Maîtrise du Bukit Barisan"
 nd_pgr_bukit_barisan_mastery_desc: "La chaîne de montagnes Bukit Barisan, l'épine volcanique de Sumatra, est la patrie des Minangkabau. Des générations de personnes vivant dans les hautes terres ont produit des guerriers qui connaissent chaque col, chaque ravin et chaque point d'embuscade. Les armées d’invasion sont confrontées à un cauchemar de défilés étroits, d’averses tropicales et de défenseurs qui se fondent dans un terrain qu’ils connaissent depuis leur naissance."
 nd_pgr_expanding_rantau: "Expansion des réseaux Rantau"
 nd_pgr_expanding_rantau_desc: "La tradition merantau évolue de l'aventure individuelle à l'expansion commerciale organisée. Les colonies commerciales Minangkabau le long du détroit de Malacca et dans tout l’archipel forment des réseaux de soutien mutuel, d’intelligence partagée et de négociation collective. Le rantau devient non seulement un rite de passage mais le fondement d'un empire marchand sans frontières."
 nd_pgr_basa_ampek_balai: "Basa Ampek Balai"
 nd_pgr_basa_ampek_balai_desc: "Le Basa Ampek Balai, Conseil des Quatre Pouvoirs, représente la plus haute instance judiciaire et délibérative en dessous du Rajo Tigo Selo. Ces quatre grands ministres tranchent les différends que les Nagari individuels ne peuvent pas résoudre, coordonnent la politique dans les vallées des hautes terres et maintiennent le tissu constitutionnel d'un royaume remarquablement décentralisé."
 nd_pgr_matrilineal_succession: "Succession matrilinéaire"
 nd_pgr_matrilineal_succession_desc: "Alors que les royaumes de la région se déchirent lors de crises de succession, le système matrilinéaire Minangkabau offre une stabilité remarquable. Les titres et les propriétés descendent dans la lignée maternelle, éliminant ainsi la compétition fratricide qui gangrène les royaumes patrilinéaires. Lorsqu’un dirigeant meurt, le suivant est déjà déterminé par le consensus du lignage et du clan."
 nd_pgr_highland_coffee: "Café des Highlands"
 nd_pgr_highland_coffee_desc: "Les sols volcaniques et les altitudes fraîches des hauts plateaux de Minangkabau se révèlent idéaux pour la culture du café. À mesure que l’appétit mondial pour le café augmente, les agriculteurs des hautes terres ajoutent cette culture de rente à leur économie agricole diversifiée, rejoignant ainsi le poivre, la cassia et le gambier parmi les principaux produits d’exportation."
 nd_pgr_silat_mastery: "Maîtrise du Silat"
 nd_pgr_silat_mastery_desc: "Au fil des siècles, le Minangkabau silat évolue de la tradition martiale du village vers un système de combat sophistiqué. Les maîtres développent des styles distinctifs, les mouvements fluides du silek harimau imitant le tigre, les techniques explosives du silek tuo s'appuyant sur la sagesse ancestrale. Ces maîtres forment la prochaine génération de guerriers qui transmettront cet art à travers le rantau."
 nd_pgr_scholarly_tradition: "Tradition savante Minangkabau"
 nd_pgr_scholarly_tradition_desc: "Le système éducatif surau produit des universitaires de calibre international. Les oulémas Minangkabau se rendent à La Mecque, au Caire et dans les grandes madrasas du monde islamique, revenant avec des connaissances qu'ils diffusent à travers un réseau croissant d'écoles religieuses. Ces érudits écrivent des textes influents en arabe et en malais, ce qui vaut à Pagarruyung une réputation de centre d'apprentissage islamique."
 nd_pgr_gambier_production: "Gambier-Production"
 nd_pgr_gambier_production_desc: "Le Gambier, un extrait des feuilles d'Uncaria gambir utilisé pour le tannage, la teinture et comme accompagnement de bétel, devient une culture d'exportation majeure du Minangkabau aux côtés du tabac. Les précipitations abondantes et le sol volcanique riche des hautes terres soutiennent une culture intensive, le produit étant expédié des ports côtiers vers les marchés de l'Asie du Sud-Est."
 nd_pgr_istano_basa: "Istano Basa Pagaruyung"
 nd_pgr_istano_basa_desc: "L'Istano Basa, le Grand Palais de Pagaruyung, est le symbole suprême de la souveraineté Minangkabau. Construit dans le style traditionnel rumah gadang mais à une échelle magnifique, ses multiples sommets de toit représentent l'autorité du Rajo Tigo Selo. Le palais n'est pas simplement une résidence royale mais le cœur spirituel et politique de tout le monde Minangkabau."
 nd_pgr_rantau_mercantile: "Empire marchand de Rantau"
 nd_pgr_rantau_mercantile_desc: "La diaspora Minangkabau est devenue un empire marchand sans frontières. Les communautés Rantau de chaque grande ville portuaire de l’archipel coordonnent le commerce, partagent des informations sur le marché et fournissent des réseaux de crédit qui rivalisent avec les sociétés coloniales européennes. Les marchands Minangkabau dominent le commerce régional grâce à une organisation collective plutôt qu’à la force militaire."
 nd_pgr_padri_movement: "Mouvement de réforme Padri"
 nd_pgr_padri_movement_desc: "Les pèlerins de retour de La Mecque apportent une idéologie réformatrice d'inspiration wahhabite sur les hauts plateaux de Minangkabau. Le mouvement Padri exige une loi islamique stricte pour remplacer l’accommodement syncrétique de l’adat et du syarak. Menés par des personnalités charismatiques comme Tuanku Nan Renceh, les réformateurs remettent en question l'autorité traditionnelle des chefs adat et du Rajo Tigo Selo lui-même, plongeant le royaume dans une crise existentielle."
 nd_pgr_tuanku_fortresses: "Forteresses de Tuanku"
 nd_pgr_tuanku_fortresses_desc: "Les dirigeants Padri, chacun portant le titre de Tuanku, construisent des forteresses fortifiées à travers les hautes terres. Tuanku Imam Bonjol et Tuanku Rao construisent non seulement des positions défensives, mais aussi des communautés autosuffisantes avec des mosquées, des marchés et des terres agricoles derrière leurs murs. Ces forteresses servent à la fois de bases militaires et de centres de l’ordre islamique réformé."
 nd_pgr_negeri_sembilan: "Negeri Sembilan"
 nd_pgr_negeri_sembilan_desc: "De l’autre côté du détroit de Malacca, les migrants Minangkabau ont créé Negeri Sembilan, les Neuf États, une confédération régie par la loi matrilinéaire adat transplantée de leur pays d’origine. Cette colonie d'outre-mer entretient des liens directs avec Pagarruyung, avec son Yang di-Pertuan Besar choisi dans la famille royale Minangkabau. Il s’agit de l’exemple le plus réussi d’exportation culturelle Minangkabau."
 nd_pgr_highland_resistance: "Tradition de la Résistance des Hautes Terres"
 nd_pgr_highland_resistance_desc: "Les hauts plateaux de Bukit Barisan n’ont jamais été facilement conquis. Chaque entrée de vallée devient un point d'étranglement, chaque nagari une forteresse potentielle. Lorsque les puissances coloniales arrivent avec une puissance de feu supérieure, les Minangkabau se tournent vers des tactiques de guérilla perfectionnées au fil des générations, des embuscades, du retrait, du réapprovisionnement à partir de jardins cachés des hautes terres et en sachant que les montagnes elles-mêmes sont leur plus grand allié."
 nd_pgr_imam_bonjol: "La Résistance de l'Imam Bonjol"
 nd_pgr_imam_bonjol_desc: "Tuanku Imam Bonjol, mystique, stratège et visionnaire, mène une résistance légendaire contre les forces coloniales néerlandaises depuis sa forteresse des hautes terres. Pendant des années, Bonjol tient les Néerlandais à distance grâce à la guérilla, aux manœuvres diplomatiques et à la loyauté inébranlable de ses partisans. Son siège de trois ans devient un symbole du défi Minangkabau contre la domination étrangère."
 nd_pgr_adat_vs_padri: "Adat contre Padri"
 nd_pgr_adat_vs_padri_desc: "Les guerres Padri révèlent la tension fondamentale au sein de la société Minangkabau : entre l’ancienne coutume matrilinéaire et la pureté islamique réformiste. Il ne s’agit pas simplement d’un conflit militaire mais intellectuel. La résolution, une synthèse renouvelée de l’adat et de l’islam qui survit jusqu’à l’ère moderne, produit certaines des réflexions juridiques et philosophiques les plus sophistiquées du monde malais."
 nd_pgr_minang_renaissance: "Renaissance Minangkabau"
 nd_pgr_minang_renaissance_desc: "Du creuset des guerres Padri émerge une renaissance intellectuelle Minangkabau. Les universitaires, les écrivains et les philosophes s’interrogent sur la relation entre tradition et modernité, islam et coutumes, identité locale et engagement mondial. Ce ferment produit une littérature, une théorie juridique et une réforme éducative qui feront des Minangkabau l'un des peuples les plus productifs intellectuellement de l'archipel."
 nd_pgr_modern_rantau: "Économie de Rantau moderne"
 nd_pgr_modern_rantau_desc: "La tradition merantau passe d'une pratique culturelle à une stratégie économique. Les entrepreneurs de Minangkabau créent des entreprises dans tout l'archipel indonésien et au-delà, créant des chaînes d'approvisionnement, des réseaux de restaurants de type franchise et des organisations d'entraide. Leur sens commercial, aiguisé par des siècles de tradition commerciale, en fait l’un des groupes économiquement les plus prospères d’Asie du Sud-Est."
 nd_pgr_nusantara_scholars: "Chercheurs Nusantara"
 nd_pgr_nusantara_scholars_desc: "Les érudits de Minangkabau occupent des positions de premier plan dans l’éducation, le journalisme, la littérature et la pensée politique islamiques à travers le Nusantara. La tradition surau d'apprentissage rigoureux, combinée à l'impulsion merantau de s'engager avec le monde au sens large, produit des intellectuels qui font le lien entre la tradition locale et la modernité mondiale. Leur influence façonne le paysage intellectuel de toute la région."
 nd_pgr_padang_cultural_export: "Exportation culturelle de Padang"
 nd_pgr_padang_cultural_export_desc: "La cuisine Padang, avec son rendang élaboré, son sambal fougueux et ses riches currys à base de noix de coco, devient la tradition culinaire la plus reconnaissable d'Asie du Sud-Est. Les migrants de Rantau établissent des restaurants Padang dans chaque ville où ils s'installent, créant ainsi un réseau d'exportation culturelle informel mais puissant. Nasi Padang devient un symbole de l'identité Minangkabau bien au-delà des hauts plateaux."

 # === UNIT NAMES AND DESCRIPTIONS ===
 a_nd_pgr_pesilat: "Pésilat"
 a_nd_pgr_pesilat_desc: "Pratiquants du silek Minangkabau, l'art martial ancien des hauts plateaux. Les Pesilat se battent avec un jeu de jambes fluide, des coups de pied explosifs et des dagues keris, en s'appuyant sur l'agilité et l'initiative sur une armure lourde. Ils sont formés dès l'enfance au surau, apprenant le combat parallèlement à la récitation coranique et aux coutumes adat."
 a_nd_pgr_hulubalang: "Hulubalang"
 a_nd_pgr_hulubalang_desc: "Les hulubalang sont les officiers militaires et les gardes du corps de la royauté Minangkabau. Armés de keris, d'épées klewang et de boucliers finement ciselés, ils servent sans solde, gagnant leur part grâce au mérite militaire et au pillage. Cavaliers expérimentés et escrimeurs experts, ils constituent la force de combat professionnelle de Pagarruyung."
 a_nd_pgr_nagari_defenders: "Défenseurs Nagari"
 a_nd_pgr_nagari_defenders_desc: "Milice villageoise fortifiée issue des Nagari autonomes. Ces défenseurs connaissent chaque sentier, ravin et point d'embuscade sur leur territoire des hautes terres. Derrière les palissades et les remparts de terre, ils combattent avec une détermination tenace, transformant chaque nagari en une forteresse qui doit être réduite individuellement par tout conquérant potentiel."
 a_nd_pgr_silat_masters: "Maîtres Silat"
 a_nd_pgr_silat_masters_desc: "Praticiens les plus accomplis du Minangkabau silat, ces guerriers maîtrisent des techniques avancées : le bond du tigre du silek harimau, la sagesse ancestrale du silek tuo. Leur combinaison dévastatrice de vitesse, de précision et de mouvements imprévisibles les rend redoutés au corps à corps dans tout l'archipel."
 a_nd_pgr_rantau_militia: "Milice de Rantau"
 a_nd_pgr_rantau_militia_desc: "Milice Levy recrutée dans les communautés de la diaspora Minangkabau. Ces colons rantau se battent pour protéger les réseaux commerciaux qui les soutiennent loin des hauts plateaux. Légèrement armés mais mobiles, ils patrouillent sur les routes commerciales et les colonies marchandes en garnison, leur loyauté envers leur patrie n'étant pas atténuée par la distance."
 a_nd_pgr_highland_guerrilla: "Guérillas des Highlands"
 a_nd_pgr_highland_guerrilla_desc: "Des résistants montagnards qui mènent une guérilla depuis les hauts plateaux de Bukit Barisan. S'appuyant sur des siècles de tradition défensive des hautes terres, ils tendent des embuscades aux colonnes d'invasion dans des défilés étroits, disparaissent dans les pentes couvertes de jungle et se nourrissent de jardins cachés des hautes terres. Leur connaissance du terrain rend les opérations militaires conventionnelles contre eux extrêmement coûteuses."
 n_nd_pgr_rantau_trader: "Commerçant de Rantau"
 n_nd_pgr_rantau_trader_desc: "Un navire commercial rapide et légèrement armé conçu pour le commerce maritime de la diaspora Minangkabau. Ces navires transportent de l'or, du poivre, de la casse et d'autres produits des hautes terres vers les marchés de l'archipel, en privilégiant la vitesse et la capacité de chargement plutôt que la puissance de feu. Le commerçant rantau est le prolongement maritime de la tradition merantau."

 # === BUILDING NAMES AND DESCRIPTIONS ===
 nd_pgr_gold_smeltery: "Fonderie d'or"
 nd_pgr_gold_smeltery_desc: "Une installation de traitement de l'or alluvionnaire des rivières des hautes terres de Tanah Datar. Les orfèvres de Minangkabau raffinent l'or brut en lingots et en pièces ornementales, produisant ainsi la richesse qui a incité Adityawarman à établir son royaume sur les hauts plateaux de Sumatra."
 nd_pgr_rumah_gadang: "Rumah Gadang"
 nd_pgr_rumah_gadang_desc: "La maison longue emblématique de Minangkabau avec son imposant toit en corne de buffle. Cette habitation communautaire abrite une famille matrilinéaire élargie, sert de salle de cérémonie et stocke la richesse et l'héritage accumulés du clan. Sa façade sculptée et peinte raconte l'histoire de l'ascendance de chaque famille."
 nd_pgr_sawah_terraces: "Terrasses Sawah"
 nd_pgr_sawah_terraces_desc: "Terrasses de riz humides élaborées creusées dans les hauts plateaux volcaniques de l'ouest de Sumatra. Le système sawah canalise l'eau de montagne à travers des réseaux d'irrigation complexes pour alimenter les rizières en terrasses, produisant des récoltes de riz qui soutiennent la population des hautes terres et soutiennent la prospérité de Minangkabau."
 nd_pgr_rantau_trading_post: "Poste de traite de Rantau"
 nd_pgr_rantau_trading_post_desc: "Un avant-poste commercial établi par les migrants Minangkabau rantau. Ces postes servent de plaques tournantes pour le réseau commercial de la diaspora, fournissant entreposage, crédit et soutien mutuel aux commerçants migrants éloignés des hauts plateaux."
 nd_pgr_surau: "Surau"
 nd_pgr_surau_desc: "Le centre d'apprentissage communal traditionnel de Minangkabau où les jeunes hommes vivent, prient et étudient. Les garçons apprennent la récitation coranique, la jurisprudence islamique, le pencak silat et les coutumes adat sous la direction d'érudits résidents. Le surau a produit des générations d’intellectuels nusantara."
 nd_pgr_pepper_warehouse: "Entrepôt de poivre"
 nd_pgr_pepper_warehouse_desc: "Une installation de stockage et de transformation du poivre noir récolté sur les hauts plateaux de l'ouest de Minangkabau. Le poivre est séché, trié par qualité et stocké ici avant d'être transporté vers les ports côtiers pour être exporté vers le reste du monde."
 nd_pgr_cassia_plantation: "Plantation de Cassia"
 nd_pgr_cassia_plantation_desc: "Une plantation des hautes terres cultivant l'écorce de cassia, la version de la cannelle de Sumatra. L'écorce aromatique est extraite des arbres cultivés, séchée et emballée pour l'exportation. Cassia rejoint le poivre et l'or en tant que pilier de l'économie d'exportation de Minangkabau."
 nd_pgr_coffee_plantation: "Plantation de café des Highlands"
 nd_pgr_coffee_plantation_desc: "Une plantation de café Arabica profitant du sol volcanique, des températures fraîches et des précipitations abondantes des hauts plateaux de Minangkabau. Alors que la demande mondiale de café augmente, ces plantations des hautes terres deviennent une nouvelle source de richesse majeure pour Pagarruyung."
 nd_pgr_gambier_gardens: "Jardins Gambier"
 nd_pgr_gambier_gardens_desc: "Parcelles de culture du gambier et du tabac dans les vallées d'altitude. L'extrait de Gambier est utilisé dans le bronzage, la teinture et comme compagnon de la mastication du bétel dans toute l'Asie du Sud-Est, tandis que le tabac trouve des marchés faciles dans tout l'archipel."
 nd_pgr_tuanku_fortress: "Forteresse de Tuanku"
 nd_pgr_tuanku_fortress_desc: "Une forteresse fortifiée construite par les dirigeants Padri dans les vallées des hautes terres. Ces forteresses combinent des ouvrages défensifs militaires avec des communautés autonomes, des mosquées, des marchés, des puits et des parcelles agricoles à l'intérieur de leurs murs. Le plus célèbre, Bonjol, résista trois ans au siège hollandais."
 nd_pgr_literary_academy: "Académie littéraire"
 nd_pgr_literary_academy_desc: "Un centre intellectuel où les érudits de Minangkabau écrivent, débattent et enseignent. La renaissance qui a suivi la guerre de Padri produit une littérature, une philosophie juridique et une réforme de l’éducation qui façonnent la pensée dans tout l’archipel indonésien."
 nd_pgr_padang_restaurant: "Restaurant Padang"
 nd_pgr_padang_restaurant_desc: "Un établissement culinaire Minangkabau servant du nasi Padang, des plats élaborés à plusieurs plats comprenant du rendang, du sambal et des currys à base de noix de coco. Ces restaurants, établis par les migrants rantau partout où ils s'installent, servent à la fois d'entreprises commerciales et d'ambassades culturelles de l'identité Minangkabau."

 # === PRODUCTION METHOD NAMES AND DESCRIPTIONS ===
 nd_pgr_gold_smelting: "Fonderie d'or"
 nd_pgr_gold_smelting_desc: "Raffine l'or alluvial brut des rivières des hautes terres en métal pur destiné à la monnaie, aux bijoux et à l'exportation."
 nd_pgr_rumah_maintenance: "Entretien de Rumah Gadang"
 nd_pgr_rumah_maintenance_desc: "Conserver les boiseries sculptées élaborées et le toit de chaume de la maison longue traditionnelle. Du bois pour les réparations structurelles, du tissu pour les tentures cérémonielles et des outils pour les artisans qui maintiennent les façades sculptées en bon état."
 nd_pgr_terracing_labor: "Travaux de terrassement"
 nd_pgr_terracing_labor_desc: "Cultive du riz humide sur des terrasses volcaniques des hautes terres alimentées par des canaux d'irrigation de montagne."
 nd_pgr_rantau_trade_goods: "Marchandises commerciales de Rantau"
 nd_pgr_rantau_trade_goods_desc: "Soie et teintures importées commercialisées via le réseau de la diaspora Minangkabau."
 nd_pgr_surau_upkeep: "Entretien de Surau"
 nd_pgr_surau_upkeep_desc: "Du papier pour les manuscrits coraniques et les textes d'étude, du tissu pour les vêtements et le mobilier de prière, et de l'encens pour la salle de prière, les matériaux qui soutiennent le surau en tant que centre d'apprentissage et de dévotion."
 nd_pgr_pepper_processing: "Transformation du poivre"
 nd_pgr_pepper_processing_desc: "Le poivre noir des pentes des hautes terres est amené ici pour être séché, calibré et emballé dans des caisses. Les caisses et les installations de bois sont construites et entretenues avec du bois, tandis que les outils maintiennent les équipements de tri et de pressage en état de fonctionnement."
 nd_pgr_cassia_harvesting: "Récolte de Cassia"
 nd_pgr_cassia_harvesting_desc: "Enlève et sèche l'écorce de cassia des arbres cultivés des hautes terres, produisant une épice prisée pour l'exportation."
 nd_pgr_coffee_processing: "Traitement du café"
 nd_pgr_coffee_processing_desc: "Récolte, sèche et torréfie les grains de café Arabica des Highlands pour le marché mondial."
 nd_pgr_gambier_processing: "Traitement Gambier"
 nd_pgr_gambier_processing_desc: "Extrait du gambier et cultive du tabac dans les vallées des hauts plateaux pour l'exportation régionale."
 nd_pgr_fortress_upkeep: "Entretien de la forteresse"
 nd_pgr_fortress_upkeep_desc: "Entretien des défenses en pierre et en bois de la forteresse des hautes terres de Padri."
 nd_pgr_literary_supplies: "Fournitures littéraires"
 nd_pgr_literary_supplies_desc: "Papier et encre pour la production littéraire et philosophique des chercheurs."
 nd_pgr_rendang_cuisine: "Cuisine Rendang"
 nd_pgr_rendang_cuisine_desc: "La cuisine s'appuie sur le riz comme base de base, sur le bœuf et le buffle issus du bétail des hautes terres, ainsi que sur le poivre noir et le piment ardent qui définissent la cuisine de Padang. Le rendang mijoté, les riches currys à la noix de coco et le sambal sont préparés frais pour le service de chaque jour."

 # === LEVY NAMES AND DESCRIPTIONS ===
 levy_nd_pgr_rantau_militia: "Prélèvement de la milice de Rantau"
 levy_nd_pgr_rantau_militia_desc: "Prélèvement de milices de la diaspora légèrement armées auprès des communautés commerçantes de Minangkabau."
 levy_nd_pgr_highland_guerrillas: "Prélèvement de guérilla des Highlands"
 levy_nd_pgr_highland_guerrillas_desc: "Prélèvement de résistants montagnards des hauts plateaux de Bukit Barisan."

 # === STATIC MODIFIER NAMES AND DESCRIPTIONS ===
 STATIC_MODIFIER_NAME_nd_pgr_malayapura_restored: "Malayapura Restored"
 STATIC_MODIFIER_DESC_nd_pgr_malayapura_restored: "The court faces downriver. Highland gold moves along the Batang Hari to the sea under a maharaja whose title the Javanese courts have reason to acknowledge, and the old Melayu line is spoken of as unbroken."
 STATIC_MODIFIER_NAME_nd_pgr_alam_minangkabau: "Alam Minangkabau"
 STATIC_MODIFIER_DESC_nd_pgr_alam_minangkabau: "The court faces inward. The crown arbitrates where the nagari cannot agree and otherwise leaves them to themselves, while young men go out on merantau and return with what the world taught them."
 STATIC_MODIFIER_NAME_nd_pgr_syarak_harmony: "Harmonie de Syarak et Adat"
 STATIC_MODIFIER_DESC_nd_pgr_syarak_harmony: "La réconciliation formelle de la jurisprudence islamique avec le droit coutumier matrilinéaire crée une société stable et tolérante."
 STATIC_MODIFIER_NAME_nd_pgr_adat_primacy: "Primauté de l'Adat"
 STATIC_MODIFIER_DESC_nd_pgr_adat_primacy: "La coutume matrilinéaire est considérée comme la source suprême du droit, offrant une stabilité et une légitimité enracinées dans une tradition ancienne."
 STATIC_MODIFIER_NAME_nd_pgr_padri_zeal: "Padri Zèle"
 STATIC_MODIFIER_DESC_nd_pgr_padri_zeal: "La ferveur réformiste du mouvement Padri inspire une discipline stricte et un dévouement sans compromis à la cause."
 STATIC_MODIFIER_NAME_nd_pgr_adat_resilience: "Résilience Adat"
 STATIC_MODIFIER_DESC_nd_pgr_adat_resilience: "Les chefs traditionnels adat se mobilisent pour défendre leurs coutumes ancestrales, renforçant ainsi leurs positions et leur détermination."
 STATIC_MODIFIER_NAME_nd_pgr_bonjol_defiance: "Le défi de Bonjol"
 STATIC_MODIFIER_DESC_nd_pgr_bonjol_defiance: "La résistance légendaire de l’imam Bonjol incite la nation tout entière à s’opposer à la domination étrangère, quel qu’en soit le prix."

 # === EVENT LOCALIZATION ===
 nd_pgr.1.t: "Maharajadhiraja of Malayapura"
 nd_pgr.1.d: "Adityawarman had the statue carved on the Batang Hari, at Padang Roco where the river still runs wide enough for seagoing craft. The inscription cut into its base names him Maharajadhiraja, great king over kings, of Malayapura. It is a Melayu title in Sanskrit letters, written by a prince the Javanese courts raised, and every word of it is a claim on what Srivijaya once held.\n\nYet the kingdom taking shape around him is not on the river at all. It is up in the valleys of Tanah Datar, where the rice terraces climb the slopes below the Bukit Barisan and each nagari settles its own disputes in its own balai, answering to a council of clan elders and to no one else. A king may be honoured there. He is not obeyed there in the way kings are obeyed downriver.\n\nThe court must decide which of the two it means to be."
 nd_pgr.1.a: "Downriver, where the gold goes and the great kings are named"
 nd_pgr.1.b: "Upriver, where the nagari govern themselves and always have"
 nd_pgr.2.t: "Adat Basandi Syarak"
 nd_pgr.2.d: "The Minangkabau highlands face a question that has simmered for generations: how shall the ancient matrilineal adat coexist with the demands of Islamic law? The formula has been spoken for decades, 'Adat basandi syarak, syarak basandi Kitabullah', but now our scholars and chiefs must give it practical meaning.\n\nThe Rajo Tigo Selo and the Basa Ampek Balai have debated the matter. Property and lineage shall continue through the mother's line as 'high inheritance,' while a father's personal earnings may pass to his children as 'low inheritance' under Quranic rules. But the balance between these two authorities remains contested.\n\nShall we emphasize the harmonious synthesis, letting syarak and adat strengthen each other? Or shall we declare that the adat, tested by centuries of practice, holds primacy in our governance?"
 nd_pgr.2.a: "Syarak and Adat shall be one garment"
 nd_pgr.2.b: "The Adat is the foundation upon which all else rests"
 nd_pgr.3.t: "The Padri Storm"
 nd_pgr.3.d: "Pilgrims returning from Mecca bring more than faith: they bring the fire of reform. Led by men like Tuanku Nan Renceh, the Padri movement demands that Minangkabau society conform to strict Islamic law. Gambling houses are burned. Cockfighting is forbidden. The traditional chiefs who tolerate these customs under the banner of adat are denounced as insufficiently devout.\n\nThe kingdom trembles. In some valleys, the Padri seize power by force. In others, adat chiefs rally their people to resist. The conflict threatens to tear apart the fabric of Minangkabau society, the very synthesis of adat and syarak that has held the highlands together for centuries.\n\nOur response to the Padri movement will shape the character of Pagarruyung for generations. Do we embrace the reformers' discipline and zeal, or defend the ancestral customs that have sustained our people since time immemorial?"
 nd_pgr.3.a: "The purification of our faith shall strengthen us"
 nd_pgr.3.b: "Our ancestors' wisdom cannot be cast aside"
 nd_pgr.4.t: "The Fortress of Bonjol"
 nd_pgr.4.d: "From his highland fortress, Tuanku Imam Bonjol wages a war that will become legend. For three years, Dutch colonial forces, equipped with modern artillery and disciplined European infantry, batter against the defenses of Bonjol. And for three years, the fortress holds.\n\nImam Bonjol is no mere warlord. A mystic, a scholar, and a brilliant strategist, he has built Bonjol into a self-sustaining community, with mosques, markets, gardens, and wells all within its walls. His fighters know every trail through the surrounding mountains. Dutch supply lines are ambushed. Reinforcements are harassed. The terrain itself fights on Bonjol's side.\n\nThough the fortress will eventually fall, through Dutch treachery at a false negotiation rather than military defeat, the resistance of Imam Bonjol becomes an eternal symbol of Minangkabau courage. His defiance echoes through the centuries: the highlands cannot be conquered by force alone."
 nd_pgr.4.a: "Let our mountains remember his name"
 nd_pgr.5.t: "Istano Basa Pagaruyung"
 nd_pgr.5.d: "The great palace of Pagaruyung rises above the highland valley like a vision from the age of Adityawarman himself. Its roof, a magnificent cascade of buffalo-horn peaks, can be seen from across Tanah Datar, a statement of sovereignty visible to all.\n\nThe Istano Basa is built in the rumah gadang tradition but on a scale that dwarfs any clan house. Its three main sections house the courts of the Rajo Tigo Selo. The carved and painted facades depict the history and mythology of the Minangkabau people, the journey from Pariangan Padang Panjang, the legend of the victorious water buffalo that gave the people their name.\n\nWithin these walls, the business of the kingdom is conducted: adat disputes are arbitrated, foreign ambassadors are received, and the elaborate ceremonies of the Minangkabau court unfold. The Istano Basa is not merely a building: it is the heart of a civilization."
 nd_pgr.5.a: "The pride of all Alam Minangkabau"
 nd_pgr_formed_tt: "Pagarruyung a été formé"
 nd_pgr_e1_done_tt: "$nd_pgr.1.t$ has already happened"
