 nd_pgr_path_b_tt: "Chose Alam Minangkabau"

 # === BUREAUCRACIES ===
 rajo_tigo_selo_bureaucracy: "Rajo Tigo Selo"
 rajo_tigo_selo_bureaucracy_desc: "Le Royaume de Pagarruyung est gouverné par le Rajo Tigo Selo, les Trois Rois Assis les jambes croisées. Raja Alam à Pagaruyung détient le pouvoir exécutif, Raja Adat à Buo arbitre le droit coutumier et Raja Ibadat à Sumpur Kudus supervise les affaires religieuses. Le maintien du triumvirat maintient la coutume et la foi alignées sur le trône ; le négliger laisse les trois tribunaux s'écarter les uns des autres, laissant l'exécutif paralysé entre les anciens de Raja Adat et les religieux de Raja Ibadat."
 basa_ampek_balai_bureaucracy: "Basa Ampek Balai"
 basa_ampek_balai_bureaucracy_desc: "Au-dessous des Trois Rois se trouve le Basa Ampek Balai, le Conseil des Quatre Pouvoirs : Bandaharo à Sungai Tarab, Makhudum à Sumanik, Indomo à Saruaso et Tuan Kadhi à Padang Ganting. Ces quatre grands ministres tranchent les différends entre les Nagari, coordonnent le commerce des hautes terres et dirigent les rouages ​​quotidiens du royaume. Correctement financé, le conseil est l’instrument bureaucratique le plus efficace jamais produit par les Highlands ; Sous-financés, les quatre bureaux se transforment en clientélisme en quête de rente et en pression sur les revenus des villages paysans."
 nagari_republic_bureaucracy: "Conseil de la République de Nagari"
 nagari_republic_bureaucracy_desc: "Le nagari est l'unité fondamentale de l'organisation politique du Minangkabau, une république villageoise autonome avec des penghulu élus, ses propres lois adat et ses propres procédures judiciaires. Reconnaître l'autonomie des Nagari comme un fait constitutionnel permanent pousse l'autorité vers le bas et hors des mains du trône. Les villages rendent la pareille avec du grain, de la main d'œuvre et une loyauté tranquille tant que le trône respecte leur autonomie ; dès que le roi exige des prélèvements au-delà de la coutume, chaque nagari devient un centre potentiel de rébellion."
 lareh_koto_piliang_bureaucracy: "Lareh Koto Piliang"
 lareh_koto_piliang_bureaucracy_desc: "La tradition politique Minangkabau reconnaît deux laraih, deux courants de coutumes constitutionnelles : le Bodi Caniago égalitaire de Datuak Parpatiah Nan Sabatang et l'aristocratique Koto Piliang de Datuak Katumanggungan. L'adoption du Koto Piliang lareh codifie une hiérarchie de titres penghulu dans laquelle les grands clans sont toujours au-dessus des autres, disciplinant les nagari des hautes terres et produisant des prélèvements nobles fiables. Cependant, laissé à l'état de calcification, le système devient un pur privilège héréditaire, étouffant à la fois les communautés marchandes de rantau et les villages inférieurs."

 # === BUREAUCRACY AUTHORITY (auto-modifier) ===
 AUTO_MODIFIER_NAME_nd_pgr_bureaucracy_authority: "Autorité royale Pagarruyung"
 AUTO_MODIFIER_DESC_nd_pgr_bureaucracy_authority: "On formation, the Rajo Alam claims the right to install the historic institutional apparatus of the Minangkabau kingdom. Two more institutions may be kept at a time."

 # === DESTINY ADVANCES ===
 nd_pgr_destiny: "The Seat at Tanah Datar"
 nd_pgr_destiny_desc: "The kingdom has a name and a seat, and the message goes out from the highland valleys to every nagari that will hear it. What follows depends on which way the court turns: downriver toward the sea and the great courts, or inward toward the villages and the world their sons build abroad. Hold the realm steady while the answer takes shape."
 nd_pgr_dest_padang_roco: "Padang Roco"
 nd_pgr_dest_padang_roco_desc: "The Amoghapasa statue stands at Padang Roco on the Batang Hari, far below the highland seat, and the inscription Adityawarman cut into its base is a claim on the whole Melayu inheritance. A claim written on a riverbank is worth what the riverbank is worth. Take Jambi and the river mouth at Muara Sabak, so that highland gold reaches seagoing craft under one flag, and let the court's standing rise with it."
 nd_pgr_dest_maharajadhiraja: "Maharajadhiraja"
 nd_pgr_dest_maharajadhiraja_desc: "Palembang was the Melayu seat long before Jambi and longer before Pagaruyung, and Siak watches the Strait where every cargo out of Sumatra must pass. A king who holds the old capital and the narrows both is the successor his own inscription says he is. Take them, and have the treasury full enough that the claim is heard rather than laughed at."
 nd_pgr_dest_gold_road: "The Gold Road to the Sea"
 nd_pgr_dest_gold_road_desc: "Kota Kapur on Bangka carries the oldest Srivijayan inscription and the tin islands with it. Barus on the western coast was selling camphor to Alexandria before any of this began. Hold both, with a treasury and a name to match, and the old maritime realm is standing again in Minangkabau hands. The wharves that weigh the gold are built at the ports."
 nd_pgr_dest_merantau_world: "The Young Men Go Out"
 nd_pgr_dest_merantau_world_desc: "A boy leaves the surau with his letters, his silek and nothing else, and the village measures him by what he brings home. Push the custom as far as it will go: take the nearest rantau on the southern coast at Mukomuko, teach enough of the alam to read and reckon, and put Minangkabau traders into markets the crown itself has never entered."
 nd_pgr_dest_adat_perpatih: "Adat Perpatih Abroad"
 nd_pgr_dest_adat_perpatih_desc: "Across the water on the peninsula, Minangkabau settlers govern themselves by Adat Perpatih, their own law carried inland and planted there whole. Take root at Kajang, let the rantau ledgers and credit run on the same footing as any banking house in the world, and raise the reading of the alam again. Village law travels better than village armies."
 nd_pgr_dest_alam_minangkabau: "Alam Minangkabau"
 nd_pgr_dest_alam_minangkabau_desc: "The alam is darek and rantau together: the highland valleys that never submitted to anyone, and every town from the Muar river to Malacca where a Minangkabau house keeps its own custom and sends money home. Hold the peninsular ports, carry the letters to every village, and put merchants in markets across the archipelago. Then the rantau house can be built anywhere the trade reaches."

 # === DESTINY EVENTS ===
 nd_pgr.10.t: "The Word Goes Out from Tanah Datar"
 nd_pgr.10.d: "Riders leave the highland valleys carrying the same sentence to every balai in the alam: there is a king at Pagaruyung, and this is his name. In some nagari the elders hear it out, agree that it is fitting, and go back to arguing about a buffalo. In others the messenger is fed, thanked and quietly ignored.\n\nNeither reaction is defiance. The Minangkabau have always held that the king is the apex of the world and the nagari is where the world is actually run, and they see no contradiction in the two. What the court decides to do with that arrangement is the whole question of the reign."
 nd_pgr.10.a: "Let the message go as far as it will carry"
 nd_pgr.11.t: "The Statue on the Riverbank"
 nd_pgr.11.d: "The Batang Hari runs slow and brown past Padang Roco, wide enough here that a seagoing prau can come up on the tide. The Amoghapasa stands where it was set down, and the letters cut around its base are read aloud for the assembled headmen: Maharajadhiraja, great king over kings, of Malayapura.\n\nThe headmen are impressed. They are also aware that the boats carrying highland gold downstream pass three sets of hands before they reach salt water, and that none of those hands belong to Pagaruyung. Now they do. What was cut in stone in a season of ceremony has taken a generation of war to make true."
 nd_pgr.11.a: "The river is ours from the mountains to the tide"
 nd_pgr.12.t: "The Old Capital"
 nd_pgr.12.d: "Palembang has been taken. The Musi delta, the site of the palace of the Srivijayan maharajas, the reach of water from which a thousand years of Malay kingship claims descent, now answers to a court in a highland valley whose roofs are shaped like buffalo horns.\n\nThe court is not sure how to be an empire. The ministers who understand the nagari have no vocabulary for a river capital of foreign merchants, and the merchants have no interest in adat. Two remedies are proposed, and they are not compatible. One party wants the court itself rebuilt: ranks, envoys, ceremonial in the Javanese manner Adityawarman knew as a boy. The other says a maharaja is whoever controls the road, and asks for the road."
 nd_pgr.12.a: "Build the court in the manner that raised our founder"
 nd_pgr.12.b: "Clear the portages and widen the caravan road"
 nd_pgr.13.t: "Camphor, Tin and the Open Sea"
 nd_pgr.13.d: "Barus in the west, whose camphor reached Alexandria when the Minangkabau were still a rumour in the hills. Kota Kapur in the east, where a stone cut with a Srivijayan curse against the disloyal has stood since before Islam came to the archipelago. Both are held, and between them lies everything the old thalassocracy ever claimed.\n\nWhat to do with it divides the council. Highland men can learn the sea, though the coast will take its price in fever from people bred to cool valleys. Or the kingdom can do what it has always done best, which is to be the source: strike the gold into coin under the king's own die and let others carry it."
 nd_pgr.13.a: "Teach highland men the sea and build our own hulls"
 nd_pgr.13.b: "Strike the coin here and let others do the sailing"
 nd_pgr.14.t: "What They Bring Back"
 nd_pgr.14.d: "The custom is old and the rule is simple. A young man who stays in his mother's house all his life is nobody. He goes out with his letters from the surau, whatever silek he has learned and no land of his own, because under adat the land is his sisters' and always was. He comes back when he has something to come back with.\n\nThis generation has gone further than any before it. There are Minangkabau in the coastal towns down to Mukomuko, in market ports where nobody had heard the name a lifetime ago, keeping accounts in two scripts and sending silver up the rivers to villages that never saw them leave."
 nd_pgr.14.a: "Every son who returns brings the world back with him"
 nd_pgr.15.t: "The Law Crosses the Water"
 nd_pgr.15.d: "Inland from the peninsular coast, the settlements are governed by clan mothers, elected headmen and the same rules of inheritance that hold in Tanah Datar. Nobody conquered these valleys. Families arrived, cleared ground, sent for relatives and carried their law with them, and the law worked well enough that their neighbours adopted it.\n\nThe court is asked what it wants this to become. Some say leave it exactly as it is and let the balai settle its own disputes, because that is the arrangement that made it work. Others say the moment is here to move people in numbers, fill the towns, and turn a scattering of villages into a presence nobody can dislodge."
 nd_pgr.15.a: "Leave the balai to settle their own affairs"
 nd_pgr.15.b: "Move families across in numbers while the way is open"
 nd_pgr.16.t: "Darek and Rantau, One World"
 nd_pgr.16.d: "Count it honestly and the alam is no longer a highland kingdom with a few traders abroad. It is a network: the valleys, the coastal ports, the peninsular settlements, the market towns from the Muar river to Malacca, held together by clan obligation, credit, marriage and the certainty that a Minangkabau anywhere will lodge a Minangkabau from anywhere else.\n\nWhat holds a thing like that together is the argument in the balai now. One side says learning, the surau in every village turning out reciters and jurists and men who can keep a ledger. The other says every nagari should be able to put its own men under arms on its own word, and answer to nobody for it."
 nd_pgr.16.a: "Put a surau in every village and fill it"
 nd_pgr.16.b: "Let every nagari raise its own men on its own word"

 # === DESTINY TIMED MODIFIERS ===
 STATIC_MODIFIER_NAME_nd_pgr_dest_court_of_malayapura: "Court of Malayapura"
 STATIC_MODIFIER_DESC_nd_pgr_dest_court_of_malayapura: "Ranks, envoys and ceremonial in the manner of the Javanese court that raised Adityawarman. The treasury spends on protocol what it does not spend on garrisons."
 STATIC_MODIFIER_NAME_nd_pgr_dest_river_road: "The River Road"
 STATIC_MODIFIER_DESC_nd_pgr_dest_river_road: "Cleared portages, marked fords and a track down the Bukit Barisan wide enough for a caravan of a hundred carriers walking single file."
 STATIC_MODIFIER_NAME_nd_pgr_dest_sea_road: "Highland Men at Sea"
 STATIC_MODIFIER_DESC_nd_pgr_dest_sea_road: "Shipwrights on the coast and crews drawn from valleys that never saw salt water. The lowland ports take their price in fever, which is why the darek stayed in the hills."
 STATIC_MODIFIER_NAME_nd_pgr_dest_royal_mint: "The King's Die"
 STATIC_MODIFIER_DESC_nd_pgr_dest_royal_mint: "Highland gold struck into coin under the royal mark, with the river polities downstream paying their share in and the diggings cheaper to open."
 STATIC_MODIFIER_NAME_nd_pgr_dest_balai_arbitration: "The Balai Settles It"
 STATIC_MODIFIER_DESC_nd_pgr_dest_balai_arbitration: "A crown that arbitrates is heard in valleys where a crown that commands is not. Distance through the hills stops being an excuse for ignoring the seat."
 STATIC_MODIFIER_NAME_nd_pgr_dest_merantau_generation: "A Generation on the Road"
 STATIC_MODIFIER_DESC_nd_pgr_dest_merantau_generation: "Whole families crossing at once, filling the towns and returning rich to the villages. While they are moving, nobody is counting them."
 STATIC_MODIFIER_NAME_nd_pgr_dest_surau_world: "A Surau in Every Village"
 STATIC_MODIFIER_DESC_nd_pgr_dest_surau_world: "Boys sleeping in the village hall learn recitation, law and reckoning together, and the ones who go furthest come back to teach."
 STATIC_MODIFIER_NAME_nd_pgr_dest_nagari_militia: "The Nagari Under Arms"
 STATIC_MODIFIER_DESC_nd_pgr_dest_nagari_militia: "Every village raising its own men on its own authority. They muster fast and they go home fast, and nothing of the campaign outlives it."

 # === DESTINY BUILDINGS ===
 nd_pgr_bandar_emas: "Bandar Emas"
 nd_pgr_bandar_emas_desc: "The gold port. Highland dust and nuggets come down the Bukit Barisan by carrier, are weighed on the king's scales, sealed under the king's mark and loaded where the water is deep enough for seagoing craft. The seal is worth more than the guard: a cargo that carries it is accepted at every port in the Strait without reweighing."
 nd_pgr_bandar_upkeep: "Wharf Upkeep"
 nd_pgr_bandar_upkeep_desc: "Piling, decking and tarred rope for the wharves, and paper for the weighmasters, who record every sealed consignment twice."
 nd_pgr_rumah_rantau: "Rumah Rantau"
 nd_pgr_rumah_rantau_desc: "The rantau house. A clan buys a compound in a town under another king, sends its young men to live in it, and keeps its own custom inside the walls: its own cooking, its own arbitration, its own claim on every newcomer from home. The men who fill it are taken from the capital and mostly do not return, but the money does, and so does the trade that follows the name."
 nd_pgr_rantau_house_upkeep: "Rantau House Upkeep"
 nd_pgr_rantau_house_upkeep_desc: "Rice and cloth for a household of young men far from their mothers' land, and paper for the letters and ledgers that keep them tied to it."
