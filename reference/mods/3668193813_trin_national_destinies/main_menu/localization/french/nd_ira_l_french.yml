l_french:
 STATIC_MODIFIER_NAME_nd_shahanshah_militant: "Shahanshah : Roi des Rois"
 STATIC_MODIFIER_DESC_nd_shahanshah_militant: "Le trône de Perse exige la domination. En tant que Shahanshah, le Roi des rois, nos armées tonneront sur le plateau iranien et au-delà, portant la bannière de l'empire aux quatre coins du monde connu. La cavalerie qui a écrasé les Ottomans à Chaldiran et les Ouzbeks à Merv roule à nouveau."
 STATIC_MODIFIER_NAME_nd_nesf_e_jahan: "Ispahan Nesf-e Jahan"
 STATIC_MODIFIER_DESC_nd_nesf_e_jahan: "Ispahan représente la moitié du monde, comme le dit le proverbe. Sous les Shahs, la Perse deviendra un phare de civilisation où fleurissent l’art, le commerce et le savoir. Les grands bazars bourdonneront du commerce entre la Chine et l'Europe, et la beauté de l'architecture persane inspirera l'admiration à travers les âges."
 STATIC_MODIFIER_NAME_nd_guardian_of_shiism: "Gardien de la foi chiite"
 STATIC_MODIFIER_DESC_nd_guardian_of_shiism: "La Perse apparaît comme la forteresse du chiisme duodécimain face à un monde d’empires sunnites. Grâce à l’autorité du Shah et à la sagesse des oulémas, la nation forgera un lien indissoluble entre l’État et la foi. L’unité religieuse sera le fondement sur lequel sera construit un empire durable."
 nd_ira.1.t: "La montée de la Perse"
 nd_ira.1.d: "The Iranian Plateau stands united under a single crown. From the Zagros Mountains to the shores of the Caspian, from the deserts of Khorasan to the marshes of Mesopotamia, the diverse peoples of Persia answer to one sovereign. This is the moment that Cyrus and Darius once knew, the birth of an empire that stretches across continents and cultures.\n\nBut the character of this empire remains to be decided. Shall we ride forth as conquerors, as the Achaemenids and Sassanids before us? Shall we build Isfahan into the wonder of the world, a capital that makes the courts of Europe weep with envy? Or shall we forge the religious unity that will define Persia for centuries, becoming the unshakeable bastion of the Shia faith?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ira.1.a: "Nous chevaucherons en tant que roi des rois !"
 nd_ira.1.b: "Ispahan sera la moitié du monde."
 nd_ira.1.c: "Nous sommes les gardiens de la vraie foi."
 nd_ira.2.t: "Ispahan : la moitié du monde"
 nd_ira.2.d: "Shah Abbas has chosen Isfahan as his capital, and the city has been transformed beyond recognition. The magnificent Naqsh-e Jahan Square, one of the largest public squares in the world, stands as the beating heart of the empire. The Shah Mosque's turquoise dome gleams in the sun, the Ali Qapu Palace overlooks all commerce, and the Bazaar-e Bozorg stretches for kilometers through vaulted corridors.\n\nForeigners who visit declare that Isfahan is indeed 'half the world,' for here one may find everything that exists elsewhere. The Chahar Bagh Avenue, lined with gardens and pavilions, connects the Armenian quarter of New Julfa to the royal palaces. Shall we invest in Isfahan's cultural magnificence, making it a monument to Persian civilization? Or shall we channel its energy into commercial networks that will enrich the entire empire?"
 nd_ira.2.a: "Laissez la beauté d'Ispahan inspirer les âges."
 nd_ira.2.b: "Laissez les bazars d'Ispahan enrichir l'empire."
 nd_ira.3.t: "La conversion de la Perse"
 nd_ira.3.d: "The transformation of Persia from a predominantly Sunni land to the heartland of Twelver Shiism is one of the most dramatic religious upheavals in Islamic history. Under Shah Ismail, the process began with the declaration that Shia Islam was the state religion. Sunni ulama were given the choice of conversion, exile, or death. Arab Shia scholars were brought from Jabal Amil in Lebanon, from Bahrain, and from southern Iraq to fill the theological void and establish new institutions of learning.\n\nThe Safavid state now faces a choice in how to consolidate this transformation. Shall we pursue zealous enforcement of doctrinal purity, using the power of the state to ensure complete religious conformity? Or shall we invest in theological scholarship, building the intellectual foundations that will make Twelver Shiism self-sustaining through the strength of its learning?"
 nd_ira.3.a: "Appliquez la pureté de la foi."
 nd_ira.3.b: "Investissez dans l’érudition et l’apprentissage chiites."
 nd_ira.4.t: "Le Corps Zamburak"
 nd_ira.4.d: "A new innovation has appeared on the battlefield, the zamburak, a small swivel cannon mounted on the back of a camel. These mobile artillery pieces combine the speed of cavalry with the firepower of cannon, allowing Persian forces to bring devastating firepower to bear in the open deserts and plains where conventional artillery would bog down.\n\nThe zamburakchi corps proved decisive at the Battle of Karnal in 1739, where Nader Shah's camel-mounted guns shattered the Mughal army and its war elephants. The corps operates in batteries of dozens or even hundreds of camels, creating a mobile wall of fire that can redeploy faster than any wheeled artillery. This Persian innovation will give our armies a unique tactical advantage across the arid landscapes of our domain."
 nd_ira.4.a: "Les chameaux de guerre tonneront sur nos ennemis."
 nd_ira.5.t: "Le nouvel ordre : la réforme militaire"
 nd_ira.5.d: "Persian observers returning from Europe bring troubling reports. The armies of France, Prussia, and Russia have undergone transformations that make them far more effective than the traditional forces of the East. Regular drill, standardized equipment, professional officer corps, and systematic logistics have created military machines of unprecedented efficiency.\n\nThe question facing the Persian court is how to respond. Some argue that Persia must adopt European methods wholesale, importing instructors, purchasing modern weapons, and reorganizing the army along European lines. Others insist that Persian military traditions have their own strengths (cavalry mobility, knowledge of terrain, and the warrior spirit of the tribal levies) and that reform should synthesize the best of both worlds rather than abandoning centuries of Persian martial heritage."
 nd_ira.5.a: "Adopter les méthodes et la discipline européennes."
 nd_ira.5.b: "Synthétisez le meilleur de l’Orient et de l’Occident."
 nd_ira.6.t: "Le réveil constitutionnel"
 nd_ira.6.d: "A remarkable movement has emerged among Persian intellectuals, merchants, and progressive clergy. Inspired by constitutional developments in Europe and the Ottoman Tanzimat reforms, they argue that Persia needs a fundamental transformation of its system of government. The absolute power of the Shah, they contend, has led to corruption, stagnation, and foreign exploitation.\n\nThe Constitutional Revolution represents a watershed moment in Persian history, the first modern attempt to limit royal authority through a written constitution and an elected parliament, the Majlis. Whether it succeeds fully or is partially reversed, it marks the beginning of Persia's engagement with modern political thought and the aspiration for a government accountable to its people."
 nd_ira.6.a: "La voix du peuple sera entendue."
 STATIC_MODIFIER_NAME_nd_ira_isfahan_glory: "Gloire d'Ispahan"
 STATIC_MODIFIER_DESC_nd_ira_isfahan_glory: "La splendeur architecturale d'Ispahan et son mécénat culturel en ont fait une merveille du monde."
 STATIC_MODIFIER_NAME_nd_ira_isfahan_commerce: "Commerce d'Ispahan"
 STATIC_MODIFIER_DESC_nd_ira_isfahan_commerce: "Les bazars et les réseaux commerciaux d'Ispahan en ont fait le cœur commercial du Moyen-Orient."
 STATIC_MODIFIER_NAME_nd_ira_shia_zealotry: "Le fanatisme chiite"
 STATIC_MODIFIER_DESC_nd_ira_shia_zealotry: "La pureté imposée du chiisme duodécimain a créé une profonde unité religieuse sur les terres perses."
 STATIC_MODIFIER_NAME_nd_ira_shia_scholarship: "Bourse chiite"
 STATIC_MODIFIER_DESC_nd_ira_shia_scholarship: "L’investissement dans les collèges théologiques et la tradition scientifique a fait de la Perse le centre intellectuel du monde chiite."
 STATIC_MODIFIER_NAME_nd_ira_european_drill: "Exercice militaire européen"
 STATIC_MODIFIER_DESC_nd_ira_european_drill: "Les régiments perses s'entraînent désormais selon les méthodes européennes, avec des formations disciplinées et des tactiques modernes."
 STATIC_MODIFIER_NAME_nd_ira_persian_synthesis: "Synthèse militaire persane"
 STATIC_MODIFIER_DESC_nd_ira_persian_synthesis: "Le meilleur de la tradition de la cavalerie perse a été combiné à des innovations modernes sélectives."
 nd_ira_ribat_tradition: "Tradition du Ribat"
 nd_ira_ribat_tradition_desc: "Le réseau de ribat, relais fortifiés le long des routes commerciales perses, servait à la fois de garnisons militaires et d'abris pour les voyageurs, projetant la puissance perse à travers le vaste intérieur."
 nd_ira_qanat_systems: "Irrigation de Qanat"
 nd_ira_qanat_systems_desc: "Les qanat, aqueducs souterrains qui transportent l'eau des aquifères des montagnes vers les plaines arides, constituent l'une des plus grandes réalisations techniques de la Perse, permettant l'agriculture dans des régions autrement inhabitables."
 nd_ira_bazaar_economy: "Économie du bazar"
 nd_ira_bazaar_economy_desc: "Le bazar couvert, ou bazar-e bozorg, est le cœur économique de chaque ville perse, un vaste labyrinthe de passages voûtés où les guildes organisent la production, les marchands négocient les prix et le wazarbed supervise l'ordre commercial."
 nd_ira_persian_diplomacy: "Tradition diplomatique persane"
 nd_ira_persian_diplomacy_desc: "La cour perse a maintenu des traditions diplomatiques sophistiquées depuis l'époque achéménide, employant un protocole élaboré, des envoyés multilingues et l'art stratégique des cadeaux pour gérer les relations avec les empires voisins."
 nd_ira_keshikchi_guard: "Garde Keshikchi"
 nd_ira_keshikchi_guard_desc: "Les Keshikchi, cavalerie garde du corps royale héritée des traditions timuride et mongole, forment une garde d'élite de cavaliers ayant juré de protéger la personne du souverain. Sélectionnés parmi les meilleurs guerriers des familles nobles, ils servent à la fois de cavalerie de choc et de symbole de l'autorité royale."
 nd_ira_caspian_silk: "Industrie de la soie caspienne"
 nd_ira_caspian_silk_desc: "The lush provinces of Gilan and Mazandaran along the Caspian coast produce some of the finest raw silk in the world. Shah Abbas centralized this industry into a royal monopoly, making silk Persia's most valuable export to European markets."
 nd_ira_persian_miniatures: "Peinture miniature persane"
 nd_ira_persian_miniatures_desc: "La tradition de la miniature persane, perfectionnée par des maîtres comme Bihzad, combine des détails exquis avec des couleurs vibrantes pour illustrer les grandes œuvres de la littérature persane. Les ateliers de la cour de Tabriz, Qazvin et Ispahan produisent des manuscrits enluminés précieux de Constantinople à Delhi."
 nd_ira_royal_court_culture: "Culture de la Cour Royale"
 nd_ira_royal_court_culture_desc: "La cour royale perse est depuis longtemps un centre de culture cosmopolite, où poètes, musiciens, peintres et érudits du monde islamique se réunissent sous le patronage du Shah. Cette tradition d'ouverture culturelle permet à la Perse d'absorber et de synthétiser diverses influences."
 nd_ira_caravanserai_network: "Réseau de caravansérails"
 nd_ira_caravanserai_network_desc: "Shah Abbas a ordonné la construction de caravansérails à intervalles réguliers le long de toutes les principales routes commerciales, des auberges fortifiées offrant un hébergement gratuit, des écuries et une sécurité aux marchands. Ce vaste programme d’infrastructures a transformé la Perse en la terre la plus accueillante pour le commerce terrestre de tout le Moyen-Orient."
 nd_ira_chapar_riders: "Cavaliers Chapar"
 nd_ira_chapar_riders_desc: "Le système chapar, un réseau de courriers montés assurant des stations relais à travers tout l'empire, trouve ses origines dans le célèbre service postal de l'Empire achéménide, la « Route Royale ». Ces cavaliers rapides transportent des dépêches, des renseignements et des commandements royaux sur de vastes distances à une vitesse remarquable."
 nd_ira_royal_workshops: "Ateliers royaux"
 nd_ira_royal_workshops_desc: "The karkhane, royal workshops attached to the court, produce luxury goods of extraordinary quality. Under Safavid patronage, these workshops in Isfahan employ hundreds of craftsmen working in silk weaving, carpet knotting, metalwork, and ceramics, their products destined for both domestic consumption and export.\n\n#italic Available in: $nd_ira_karkhane$#!"
 nd_ira_haft_rang_tilework: "Carrelage Haft Rang"
 nd_ira_haft_rang_tilework_desc: "The haft rang (seven-color) tile technique allows Persian artisans to create the stunning polychromatic facades that adorn mosques, palaces, and madrasas across Iran. The intricate geometric and floral patterns of Persian tilework represent one of the highest achievements of Islamic decorative art.\n\n#italic Available in: $nd_ira_karkhane$#!"
 nd_ira_divan_governance: "Gouvernance du Divan"
 nd_ira_divan_governance_desc: "Le divan perse, conseil royal des ministres, constitue l’épine dorsale administrative de l’empire. Le grand vizir, les gouverneurs de province et les fonctionnaires spécialisés gèrent la fiscalité, la justice et la correspondance à travers une tradition bureaucratique élaborée et affinée au fil des siècles."
 nd_ira_carpet_tradition: "Termeh Looms of Kerman and Yazd"
 nd_ira_carpet_tradition_desc: "Under the Safavids the weavers of Kerman and Yazd turned the soft down of the Kerman goat into termeh, a close patterned cloth of many colours. It was worn at court as sashes and coats, given by the Shah as robes of honour, and carried abroad by the merchants of the Gulf ports.\n\n#italic Available in: $nd_ira_karkhane$#!"
 nd_ira_zamburak_corps: "Corps Zamburak"
 nd_ira_zamburak_corps_desc: "Le zamburak, canon pivotant monté sur dos de chameau, donne aux armées perses une artillerie mobile adaptée aux déserts et plaines du plateau iranien. Employé pour la première fois à grande échelle par Nader Shah, le corps zamburakchi s'est révélé d'une efficacité dévastatrice lors de la bataille de Karnal."
 nd_ira_theological_colleges: "Collèges théologiques"
 nd_ira_theological_colleges_desc: "L’État safavide a investi massivement dans des madrasas dédiées à la théologie chiite duodécimaine, faisant venir des érudits du Liban, de Bahreïn et d’Irak pour établir une nouvelle intelligentsia religieuse. Ces institutions sont devenues le fondement intellectuel de l’islam chiite en Perse."
 nd_ira_isfahan_nesf_jahan: "Ispahan Nesf-e Jahan"
 nd_ira_isfahan_nesf_jahan_desc: "Ispahan nesf-e jahan, Ispahan est la moitié du monde. Sous Shah Abbas, la capitale a été transformée avec la magnifique place Naqsh-e Jahan, la mosquée Shah, le palais Ali Qapu et l'avenue Chahar Bagh, créant ainsi l'une des plus belles villes du monde."
 nd_ira_tuyul_system: "Système de concession de terres Tuyul"
 nd_ira_tuyul_system_desc: "Le système tuyul attribue des revenus fonciers de la couronne aux commandants militaires et aux fonctionnaires en lieu et place de leur salaire. Cet arrangement garantit la loyauté de l'élite provinciale tout en permettant au gouvernement central d'extraire des revenus sans une grande bureaucratie civile."
 nd_ira_shia_conversion_policy: "Politique de conversion chiite"
 nd_ira_shia_conversion_policy_desc: "La transformation safavide de la Perse, d’un pays à prédominance sunnite au cœur du chiisme duodécimain, constitue l’un des changements religieux les plus spectaculaires de l’histoire islamique. La conversion parrainée par l’État, l’importation d’érudits chiites et la création d’institutions religieuses ont créé une identité nationale durable."
 nd_ira_shahsavan_tribes: "Confédération tribale Shahsavan"
 nd_ira_shahsavan_tribes_desc: "Les Shahsavan, littéralement « ceux qui aiment le Shah », sont une confédération tribale organisée par Shah Abbas pour contrebalancer le pouvoir de l'aristocratie Qizilbash. Fidèles directement au trône, ils fournissent une cavalerie fiable qui sert de frein aux chefs de tribus trop puissants."
 nd_ira_imperial_post: "Système postal impérial"
 nd_ira_imperial_post_desc: "Le système de relais postal Chapar-khaneh entretient un réseau de stations à travers l'empire, chacune équipée de chevaux et de cavaliers neufs. Ce système, issu de l'angareion achéménide, permet aux commandements et renseignements royaux de voyager d'un bout à l'autre de la Perse en quelques jours."
 nd_ira_persian_gulf_fleet: "Flotte du golfe Persique"
 nd_ira_persian_gulf_fleet_desc: "Le programme naval Afsharid, initié par Nader Shah, a établi une flotte perse basée à Bushire, dans le golfe Persique. Bien que la Perse soit traditionnellement une puissance terrestre, la flotte du Golfe projette sa puissance le long des routes commerciales maritimes vitales et défie la domination des escadres navales européennes."
 nd_ira_nastaliq_calligraphy: "Calligraphie Nastaliq"
 nd_ira_nastaliq_calligraphy_desc: "L'écriture nastaliq, développée en Perse comme un style cursif élégant, est devenue la tradition calligraphique déterminante du monde persan. Ses courbes fluides et ses proportions gracieuses ornent les manuscrits, les inscriptions et les documents administratifs, incarnant l'idéal esthétique persan."
 nd_ira_maragheh_observatory: "Tradition de l'Observatoire de Maragheh"
 nd_ira_maragheh_observatory_desc: "L'Observatoire de Maragheh, fondé sous les Ilkhanides par Nasir al-Din Tusi, a établi en Perse une tradition scientifique qui a persisté pendant des siècles. Les astronomes et mathématiciens persans ont continué à apporter leurs contributions à l'astronomie d'observation, à l'optique et à l'algèbre longtemps après que l'observatoire lui-même soit tombé en ruine."
 nd_ira_nizam_jadid_reform: "Réforme Nizam-i Jadid"
 nd_ira_nizam_jadid_reform_desc: "Influencés par les succès militaires des puissances européennes, les réformateurs persans prônent un « nouvel ordre », réorganisant l'armée selon les modèles européens avec des officiers professionnels, des exercices réguliers, un équipement standardisé et des tactiques modernes."
 nd_ira_qajar_modernization: "Modernisation Qajar"
 nd_ira_qajar_modernization_desc: "L'école polytechnique Dar ul-Funun, fondée à Téhéran en 1851, fut la première institution moderne d'enseignement supérieur en Perse. Il enseignait les langues européennes, la médecine, l'ingénierie et les sciences militaires, formant ainsi une nouvelle génération de professionnels persans qui dirigeraient la modernisation du pays."
 nd_ira_constitutional_movement: "Mouvement constitutionnel"
 nd_ira_constitutional_movement_desc: "La Révolution constitutionnelle persane représente l’aspiration à une gouvernance moderne, à une constitution écrite, à un parlement élu (le Majlis) et à l’État de droit. Ce mouvement a reçu le soutien d'intellectuels, de commerçants et du clergé progressiste qui cherchaient à limiter l'absolutisme royal."
 nd_ira_persian_trade_reform: "Réforme commerciale persane"
 nd_ira_persian_trade_reform_desc: "La modernisation du commerce persan (y compris la création de bureaux de douane, de poids et mesures standardisés et d'un système bancaire moderne) ouvre l'économie au commerce international tout en protégeant les producteurs nationaux de l'exploitation étrangère."
 a_nd_ira_keshikchi: "Garde Keshikchi"
 a_nd_ira_keshikchi_desc: "Cavalerie de gardes du corps royaux d'élite issue de la tradition timouride keshik, jurée de protéger la personne du Shah."
 a_nd_ira_chapar: "Cavalier Chapar"
 a_nd_ira_chapar_desc: "Courriers à cheval rapide du système postal perse, formés comme pillards de cavalerie légère lorsqu'ils sont appelés à la guerre."
 a_nd_ira_zamburak: "Zamburak"
 a_nd_ira_zamburak_desc: "Canons pivotants montés sur chameaux qui amènent l'artillerie mobile dans les déserts et les plaines du plateau iranien."
 a_nd_ira_zamburak_levy: "Prélèvement Zamburak"
 a_nd_ira_zamburak_levy_desc: "Des levées tribales équipées de canons pivotants montés sur des chameaux, levées auprès des peuples nomades de l'intérieur aride de la Perse."
 a_nd_ira_shahsavan: "Cavalerie Shahsavan"
 a_nd_ira_shahsavan_desc: "Cavalerie tribale de la confédération Shahsavan, organisée comme contrepoids au pouvoir Qizilbash et fidèle directement au Shah."
 a_nd_ira_nizam_jadid: "Garde Nizam-i Jadid"
 a_nd_ira_nizam_jadid_desc: "Infanterie perse réformée formée aux exercices et tactiques européens, équipée d'armes à feu et de baïonnettes modernes."
 n_nd_ira_gulf_galley: "Cuisine du Golfe Persique"
 n_nd_ira_gulf_galley_desc: "Galères rapides du programme naval Afsharid, conçues pour les eaux peu profondes et les forts courants du golfe Persique."
 nd_ira_ribat: "Ribat"
 nd_ira_ribat_desc: "Une étape fortifiée le long des routes commerciales perses, servant à la fois de garnison militaire et d'abri pour les caravanes."
 nd_ira_ribat_upkeep: "Garnison de Ribat"
 nd_ira_ribat_upkeep_desc: "L'entretien de la garnison et des provisions du ribat nécessite de la pierre pour les réparations, du bois pour les fortifications et du bétail pour les soldats."
 nd_ira_bazaar: "Bazar-e Bozorg"
 nd_ira_bazaar_desc: "Le grand bazar couvert, vaste labyrinthe de passages voûtés où corporations, marchands et artisans mènent la vie commerciale de la ville."
 nd_ira_bazaar_maintenance: "Opérations de bazar"
 nd_ira_bazaar_maintenance_desc: "Les opérations quotidiennes du bazar nécessitent des textiles pour les marchands de draps, des poteries pour les artisans et du papier pour les registres commerciaux des marchands."
 nd_ira_caravanserai: "Caravansérail"
 nd_ira_caravanserai_desc: "Une auberge fortifiée en bord de route offrant hébergement gratuit et sécurité aux marchands, commandée par le Shah pour encourager le commerce à travers l'empire."
 nd_ira_caravanserai_upkeep: "Entretien du caravansérail"
 nd_ira_caravanserai_upkeep_desc: "L'entretien du caravansérail nécessite de la pierre pour les réparations structurelles, du bois pour les stalles et la toiture, ainsi que du bétail pour nourrir le flux constant de voyageurs."
 nd_ira_karkhane: "Karkhane"
 nd_ira_karkhane_desc: "Atelier royal produisant des produits de luxe (textiles en soie, tapis fins et céramiques décoratives) sous le patronage direct du Shah."
 nd_ira_karkhane_maintenance: "Opérations de l'atelier royal"
 nd_ira_karkhane_maintenance_desc: "Le karkhane tisse de la soie caspienne brute avec des teintures persanes pour en faire des textiles raffinés qui apportent gloire et richesse à la cour."
 nd_ira_madrasa: "Madrasa-yi Sultani"
 nd_ira_madrasa_desc: "Un collège théologique royal formant des érudits et des juristes chiites, renforçant les fondements religieux de l’État perse."
 nd_ira_madrasa_upkeep: "Opérations de la madrasa"
 nd_ira_madrasa_upkeep_desc: "La madrasa a besoin de papier et de livres pour soutenir ses activités scientifiques, ainsi que d'encens pour la vie rituelle de ses étudiants et de son clergé."
 nd_ira_chapar_khaneh: "Chapar-Khaneh"
 nd_ira_chapar_khaneh_desc: "Une station relais postale impériale équipée de chevaux et de cavaliers neufs, assurant les communications à travers le vaste empire perse."
 nd_ira_chapar_khaneh_upkeep: "Opérations de la station relais"
 nd_ira_chapar_khaneh_upkeep_desc: "La station relais a besoin de chevaux et de fourrage pour ses courriers, ainsi que de bois de construction pour entretenir les écuries et dépendances du poste."
 nd_ira_dar_ul_funun: "Dar ul-Funun"
 nd_ira_dar_ul_funun_desc: "Un institut polytechnique moderne enseignant les sciences, les langues et les arts militaires européens, à l'avant-garde de la modernisation perse."
 nd_ira_dar_ul_funun_upkeep: "Opérations de l'Institut"
 nd_ira_dar_ul_funun_upkeep_desc: "L'école polytechnique a besoin de papier et de livres pour l'enseignement des sciences modernes, et d'instruments en verre pour ses laboratoires de médecine, de chimie et de philosophie naturelle."
 nd_ira_carpet_weaving: "Termeh Weaving"
 nd_ira_carpet_weaving_desc: "Fine goat wool and dyes were woven into patterned termeh cloth on the draw looms of the royal workshop."
 nd_ira_talambar: "Talambar"
 nd_ira_talambar_desc: "The raised, thatched rearing shed of Gilan and Mazandaran, where silkworms are fed on mulberry leaves through the spring and their cocoons reeled into raw silk."
 nd_ira_silkworm_rearing: "Silkworm Rearing"
 nd_ira_silkworm_rearing_desc: "Mulberry leaves are carried to the trays each day until the worms spin, and the cocoons are reeled into the raw silk of the Caspian shore."
 nd_ira_tile_glazing: "Vitrage de carrelage persan"
 nd_ira_tile_glazing_desc: "Clay is painted in seven mineral colors and fired once in the royal kilns, giving the polychrome tile that faces the mosques and palaces of Persia."
 levy_nd_ira_shahsavan: "Prélèvement tribal Shahsavan"
 levy_nd_ira_shahsavan_desc: "Cavalerie levée auprès de la confédération tribale Shahsavan, féroces cavaliers fidèles au Shah."
 levy_nd_ira_zamburak: "Prélèvement Zamburak"
 levy_nd_ira_zamburak_desc: "Artillerie de chameaux prélevée auprès des peuples nomades de l'intérieur de la Perse, experts dans la guerre mobile."
 levy_nd_ira_keshikchi: "Prélèvement de la garde Keshikchi"
 levy_nd_ira_keshikchi_desc: "Cavalerie de gardes du corps d'élite recrutée parmi les maisons nobles de la cour perse."
 nd_ira_formed_tt: "La Perse s'est formée"
 nd_ira_path_a_tt: "A choisi Shahanshah : le roi des rois"
 nd_ira_path_b_tt: "Choisissez Ispahan Nesf-e Jahan"
 nd_ira_path_c_tt: "Élu gardien de la foi chiite"
 nd_ira_destiny: "Destin de la Perse"
 nd_ira_destiny_desc: "Persia has risen. The throne of the Shahs commands a vast domain from the Zagros to the Hindu Kush, and its many peoples answer to one crown. Now the character of this empire must be forged: through conquest or through civilization."
 nd_ira_dest_shahanshah: "Les manèges Shahanshah"
 nd_ira_dest_shahanshah_desc: "Récupérez les terres des anciens empires. Prenez Bagdad, siège du califat abbasside, et Samarkand, joyau de la Transoxiane. Le Roi des Rois exige la domination sur toutes les terres situées entre le Tigre et l'Oxus."
 nd_ira_dest_iran_zamin: "Maître d'Iran-Zamin"
 nd_ira_dest_iran_zamin_desc: "Étendre l’hégémonie perse de Damas à l’ouest jusqu’au Caucase au nord. L'ordre du Shahanshah doit s'étendre à la fois au Croissant Fertile et aux terres du Shirvanshah."
 nd_ira_dest_cyrus_reborn: "L'Empire de Cyrus renaît"
 nd_ira_dest_cyrus_reborn_desc: "Fulfill the ultimate Persian ambition: an empire stretching from Constantinople to Delhi, surpassing even the Achaemenids. The camel guns of the zamburak corps go before the army, and Mashhad, the capital of the conqueror of Delhi, is built up with the spoils. Build the Apadana as a monument to this achievement: a throne room where envoys from every nation come to pay tribute."
 nd_ira_dest_mashhad_developed_tt: "Mashhad is ours and has been built up to a development of at least 22"
 nd_ira_dest_silk_road: "Maîtrise de la Route de la Soie"
 nd_ira_dest_silk_road_desc: "Faire de la Perse le lien commercial de la Route de la Soie. Assurez la circulation de la soie sur les marchés des capitaux et remplissez le trésor de la richesse du commerce est-ouest."
 nd_ira_dest_institutional: "Avant-garde institutionnelle"
 nd_ira_dest_institutional_desc: "Lead the Islamic world in institutional development. Embrace modern banking and build up Isfahan, where the money changers of the Qaysariyya bazaar keep the accounts of the realm, into a beacon of Persian civilization."
 nd_ira_dest_isfahan_developed_tt: "Isfahan is ours and has been built up to a development of at least 24"
 nd_ira_dest_nesf_jahan: "Ispahan Nesf-e Jahan"
 nd_ira_dest_nesf_jahan_desc: "Ispahan représente la moitié du monde. Adoptez le commerce mondial, attirez les pierres précieuses sur les marchés des capitaux et construisez la magnifique place Naqsh-e Jahan, un monument proclamant la splendeur perse aux quatre coins du monde."
 nd_ira.7.t: "Le destin de la Perse"
 nd_ira.7.d: "The crown of Persia has been claimed, and the ancient lands of the Shahs are once more united under a single sovereign. From the snow-capped peaks of the Zagros to the sun-baked shores of the Persian Gulf, the diverse peoples of Iran answer to one throne.\n\nBut unification is merely the beginning. The great empires of Persia (the Achaemenids, the Sassanids, the Safavids) were not content merely to rule the plateau. Each sought to leave an indelible mark upon the world, whether through conquest, commerce, or culture.\n\nWhat destiny awaits this new Persian empire?"
 nd_ira.7.a: "Notre destin sera écrit dans les étoiles."
 nd_ira.8.t: "Les manèges Shahanshah"
 nd_ira.8.d: "Baghdad has fallen to Persian arms, and the ancient cities of Transoxiana acknowledge the Shahanshah's sovereignty. From the banks of the Tigris to the orchards of Samarkand, the lands that once formed the heart of the Islamic world now bow to the Persian crown.\n\nThe conquest of Baghdad carries immense symbolic weight: the city of the Caliphs, the seat of the House of Wisdom, now flies the banner of Persia. And with Samarkand, the tomb of Timur himself is in Persian hands. The Shahanshah has announced to the world that the age of Persian empire has returned."
 nd_ira.8.a: "Le Roi des Rois a parlé."
 nd_ira.9.t: "Maître d'Iran-Zamin"
 nd_ira.9.d: "The boundaries of Persian power have expanded far beyond the Iranian Plateau. Damascus, one of the oldest continuously inhabited cities on earth, acknowledges Persian suzerainty. The oil fires of Baku on the Caspian shore illuminate a new frontier of Persian influence in the Caucasus.\n\nThe Shahanshah now commands a realm that recalls the extent of the Sassanid Empire at its greatest. The question before the court is how to press this advantage. Some generals urge an aggressive posture: the wrath of the Shahanshah must be felt by all who resist. Others counsel the restoration of the ancient satrapy system, binding conquered lands through administration rather than terror."
 nd_ira.9.a: "Que nos ennemis tremblent devant nous."
 nd_ira.9.b: "Restaurez la sagesse des satrapes."
 nd_ira.10.t: "L'Empire de Cyrus renaît"
 nd_ira.10.d: "It is done. Persian banners fly over Constantinople, that ancient jewel of empires, and over Delhi, gateway to the riches of India. The Shahanshah now rules a domain that surpasses even the dreams of Cyrus the Great: from the Bosphorus to the Ganges, from the Caucasus to the Persian Gulf.\n\nThis is not merely a military achievement but a civilizational statement. The construction of the Apadana (a grand audience hall modeled on the ancient Persepolis) will serve as the throne room of this reborn empire. Here, ambassadors from every nation will present themselves before the King of Kings.\n\nBut how shall this vast empire be governed? Through the iron discipline of an immortal military machine? Or through the art of diplomacy, binding diverse peoples in willing allegiance?"
 nd_ira.10.a: "Nous sommes l'Empire Immortel, éternel et incassable."
 nd_ira.10.b: "Nous sommes le Roi des Nations, le père de tous les peuples."
 nd_ira.11.t: "Maîtrise de la Route de la Soie"
 nd_ira.11.d: "The caravans that cross the Iranian Plateau carry the finest silk in the world: Persian silk, processed and finished by the artisans of Isfahan and Kerman. European merchants compete fiercely for access to Persian markets, while from the east, Chinese porcelain and Indian spices flow through the caravanserais that dot the Silk Road.\n\nPersia sits at the crossroads of the world, and the Shahs have leveraged this position brilliantly. The royal silk monopoly channels vast wealth into the treasury, while the bazaars of the great cities hum with the commerce of nations. This is the foundation upon which a different kind of empire will be built: not one of conquest, but of commerce."
 nd_ira.11.a: "Les richesses du monde transitent par la Perse."
 nd_ira.12.t: "Avant-garde institutionnelle"
 nd_ira.12.d: "Persia has embraced the institutions of the modern world not as a follower but as a leader. The banking houses of Isfahan rival those of Venice and Amsterdam, while Persian scholars and administrators have adapted new ideas to serve the needs of an ancient civilization.\n\nThis institutional sophistication gives Persia a profound advantage over its neighbors. The question is how to deploy it. Shah Abbas famously maintained royal monopolies over key industries, channeling their profits directly to the crown. But others argue that freeing the bazaars from royal control would unleash even greater commercial energy, turning every merchant into an engine of Persian prosperity."
 nd_ira.12.a: "La couronne détiendra les monopoles."
 nd_ira.12.b: "Libérez les bazars pour faire du commerce sans limite."
 nd_ira.13.t: "Ispahan Nesf-e Jahan"
 nd_ira.13.d: "Isfahan is half the world. The old Persian proverb has become literal truth. The Naqsh-e Jahan Square (the Image of the World) stands complete, one of the largest and most beautiful public spaces ever constructed. The Shah Mosque's turquoise dome catches the light of dawn. The Ali Qapu Palace surveys the commercial bustle below. The Bazaar-e Bozorg stretches for kilometers through vaulted corridors where merchants from fifty nations trade in goods from every corner of the earth.\n\nForeigners who visit are struck speechless. This is not merely a city but a monument to what Persian civilization can achieve through commerce and culture rather than conquest. Shall Isfahan become a wonder that inspires ages to come? Or shall it serve as the hub of a global trading network that makes Persia the indispensable crossroads of the world?"
 nd_ira.13.a: "Laissez les merveilles d'Ispahan inspirer l'éternité."
 nd_ira.13.b: "Qu'Ispahan soit le carrefour de tous les échanges commerciaux."
 STATIC_MODIFIER_NAME_nd_ira_dest_wrath_of_shahanshah: "Colère du Shahanshah"
 STATIC_MODIFIER_DESC_nd_ira_dest_wrath_of_shahanshah: "La fureur du Shahanshah est légendaire. Les ennemis qui résistent sont confrontés à un siège brutal et à une soumission totale, ce qui rend le coût de la défiance au-delà de ce que n'importe quel ennemi peut supporter."
 STATIC_MODIFIER_NAME_nd_ira_dest_satrapy_system: "Système de satrapie restauré"
 STATIC_MODIFIER_DESC_nd_ira_dest_satrapy_system: "L'ancien système perse de gouvernance provinciale par le biais des satrapies a été restauré, permettant une annexion et une intégration efficaces des territoires conquis."
 STATIC_MODIFIER_NAME_nd_ira_dest_immortal_empire: "L'Empire Immortel"
 STATIC_MODIFIER_DESC_nd_ira_dest_immortal_empire: "Comme les Dix Mille Immortels des Achéménides, cet empire perdure grâce à une discipline de fer et une expansion incessante, ses armées infatigables et ses réseaux de renseignement étendus."
 STATIC_MODIFIER_NAME_nd_ira_dest_king_of_nations: "Roi des nations"
 STATIC_MODIFIER_DESC_nd_ira_dest_king_of_nations: "Le Shahanshah ne règne pas seulement par la peur, mais par l'art de la gouvernance, liant divers peuples dans un réseau diplomatique, offrant la paix à ceux qui le souhaitent et un rétablissement rapide à ceux qui sont dévastés."
 STATIC_MODIFIER_NAME_nd_ira_dest_royal_monopolies: "Monopoles royaux"
 STATIC_MODIFIER_DESC_nd_ira_dest_royal_monopolies: "Le Shah maintient des monopoles sur des industries clés, canalisant les bénéfices commerciaux directement vers la couronne et finançant un État mercantiliste, même si l’état de préparation militaire souffre de l’accent mis sur le commerce."
 STATIC_MODIFIER_NAME_nd_ira_dest_free_bazaars: "Bazars gratuits"
 STATIC_MODIFIER_DESC_nd_ira_dest_free_bazaars: "Les bazars de Perse commercent librement sans interférence royale, attirant des marchands du monde entier et favorisant les relations diplomatiques grâce au commerce ouvert."
 STATIC_MODIFIER_NAME_nd_ira_dest_wonder_of_the_world: "Merveille du monde"
 STATIC_MODIFIER_DESC_nd_ira_dest_wonder_of_the_world: "Les réalisations architecturales et culturelles d'Ispahan en ont fait une merveille du monde, poussant la Perse vers l'innovation et concentrant les meilleurs talents dans la capitale."
 STATIC_MODIFIER_NAME_nd_ira_dest_crossroads_of_trade: "Carrefour des échanges"
 STATIC_MODIFIER_DESC_nd_ira_dest_crossroads_of_trade: "La position de la Perse à l'intersection des routes commerciales maritimes et terrestres a été pleinement réalisée, avec la flotte du golfe Persique assurant le commerce et une politique tournée vers l'extérieur engageant le reste du monde."
 nd_ira_apadana: "Apadana"
 nd_ira_apadana_desc: "Une grande salle d'audience impériale inspirée de l'ancienne Apadana à Persépolis, où les ambassadeurs de chaque nation soumise présentent un hommage devant le trône du Shahanshah."
 nd_ira_apadana_upkeep: "Opérations de la Cour Impériale"
 nd_ira_apadana_upkeep_desc: "Le maintien de la grandeur de la cour impériale nécessite de la pierre fine pour la salle à colonnes, des textiles en soie pour la salle du trône, des meubles pour recevoir les dignitaires et du papier pour la vaste correspondance administrative de l'empire."
 nd_ira_naqsh_e_jahan: "Place Naqsh-e Jahan"
 nd_ira_naqsh_e_jahan_desc: "L'image du monde - une place publique monumentale et un centre commercial au cœur d'Ispahan, combinant la mosquée du Shah, le palais Ali Qapu et l'entrée du Grand Bazar."
 nd_ira_naqsh_e_jahan_upkeep: "Opérations carrées"
 nd_ira_naqsh_e_jahan_upkeep_desc: "Le commerce quotidien et la vie cérémonielle de la place Naqsh-e Jahan nécessitent des textiles raffinés pour les marchands, des céramiques pour les étals du bazar, du papier pour les archives commerciales et des pierres précieuses pour les bijoutiers qui attirent de riches clients du monde entier."


 # ===== BUREAUCRACIES =====
 ira_divan_i_ala_bureaucracy: "Divan-i-A'la"
 ira_divan_i_ala_bureaucracy_desc: "Chancellerie suprême du royaume, dirigée par le Vazir-i-Azam (Grand Vizir) sous Shah Tahmasp et élaborée dans sa forme classique par Shah Abbas Ier après son transfert de capitale à Ispahan en 1598. Le Divan-i-A'la préside les diwans des finances, de l'armée, de la dotation religieuse et de la maison royale, le Grand Vizir entendant les pétitions chaque matin et signant les édits sous le tughra royal. Un vizir compétent (​​Mirza Salman, Itimad al-Dawla) peut faire régner un jeune shah; un vizirat vide laisse les ministères se quereller et les revenus ne sont pas perçus. La chancellerie existe pour lier les diwans en un seul trône, c'est pourquoi l'umara des uymaqs la déteste."
 ira_sadr_us_sudur_bureaucracy: "Sadr-us-Sudur"
 ira_sadr_us_sudur_bureaucracy_desc: "Le chef sadr du royaume, bureau suprême du clergé chiite duodécimain, formalisé par Shah Ismail Ier après sa déclaration en 1501 du chiisme duodécimain comme religion d'État et divisé par Shah Tahmasp en Sadr-i-Khassa (supervisant les dotations du domaine royal) et le Sadr-i-Mamalik (supervisant celles du royaume dans son ensemble). Le sadr contrôle les propriétés waqf qui financent les madrasas de Najaf, Karbala et Ispahan, nomme des Cheikhs al-Islam dans les grandes villes et supervise la longue conversion d'une population en grande partie sunnite en 1501 en le cœur duodécimain qu'elle est devenue en 1700. Sous le sultan Shah Husayn, le poste cède la place au plus militant Mulla-bashi - un durcissement clérical qui aide à perdre Ispahan au profit des Afghans en 1700. 1722."
 ira_ghulam_corps_bureaucracy: "Corps de la maison Ghulam"
 ira_ghulam_corps_bureaucracy_desc: "L'armée permanente des esclaves royaux de Shah Abbas Ier, instituée vers 1599 avec la conversion et l'enrôlement de garçons chrétiens du Caucase - Géorgiens, Arméniens, Circassiens - capturés ou rendus hommage au-delà du Caucase, élevés dans le palais et assignés à des fonctions et à des revenus de tuyul comme maison personnelle du shah. Sur le modèle du devshirme ottoman et de l'iqta mamelouke, le corps ghulam donne pour la première fois sur le trône un corps d'officiers et de gouverneurs qui ne doivent rien aux chefs uymaq turkmènes et tout au Padshah. À la mort de Shah Abbas en 1629, les ghulams occupent les grands postes de gouverneur du Fars, de l'Azerbaïdjan et du Khorasan ; le Qurchi-bashi a pour égal un Qullar-aghasi qui commande le corps des esclaves sur le terrain."
 ira_qizilbash_uymaq_bureaucracy: "Confédération Qizilbash Uymaq"
 ira_qizilbash_uymaq_bureaucracy_desc: "Les sept (plus tard neuf) tribus turcomanes - Shamlu, Ustajlu, Takkalu, Rumlu, Afshar, Qajar, Zulqadr et autres - dont la cavalerie a placé Shah Ismail sur le trône à Sharur en 1501 et a remporté les longues campagnes contre les Ouzbeks de Boukhara et les Ottomans à Hoy. Les Qizilbash, les « têtes rouges » pour leur taj à douze plis de dévotion chiite, assurent les grandes fonctions de l'État - le commandant Qurchi-bashi de la garde du corps, le tuteur royal lala, les beglerbegs régionaux - jusqu'au début du siècle safavide, et la grande guerre civile de 1576-1590 entre les factions Oustajlu et Shamlu a failli briser la dynastie. Shah Abbas Ier construit le corps des ghulam précisément pour échapper à cette dépendance ; l’institution reste un puissant réservoir militaire, mais au prix d’une perpétuelle responsabilisation des chefs uymaq."
 ira_tofangchi_corps_bureaucracy: "Corps de mousquets Tofangchi"
 ira_tofangchi_corps_bureaucracy_desc: "L'infanterie de mousquetaires permanente instituée par Shah Abbas Ier dans le cadre de sa réforme militaire d'après 1590, était en grande partie issue de la paysannerie persane du plateau central plutôt que des tribus turkmènes. Formés par Robert Sherley et les conseillers anglais qui atteignirent Qazvin en 1598, les tofangchi sont la réponse du trône à la ligne de mousquets des janissaires qui ensanglantèrent les Safavides à Chaldiran en 1514, et ils s'associent au nouveau corps de tupchi (artillerie) pour donner à la Perse une armée de poudre et de plomb indépendante de la confédération de cavalerie. Les tofangchi étaient peut-être au nombre de douze mille à la mort d'Abbas ; le recrutement dans les villages est le prix que paie la paysannerie."
 ira_mostowfi_bureaucracy: "Mostowfi-ul-Mamalik"
 ira_mostowfi_bureaucracy_desc: "Chief Accountant of the Realm, head of the Diwan-i-Mostowfi, who maintains the registers of every iqta and tuyul assignment, audits the provincial mostowfis under him, and presents the annual budget (dastur al-amal) to the shah and the Grand Vizier. The office traces through Buyid and Seljuq practice into the Safavid state, where Mirza Salman Jaberi's reorganization of the 1570s standardizes the registers; under the Qajar shahs, Mirza Aqa Khan Nuri and Amir Kabir each use the office to attempt fiscal reform against the appanages of the princes. A working mostowfiya prevents officers from drawing salaries from villages already assigned to another, the chief pathology of every Iranian fiscal regime."
 ira_mamalik_i_mahrusa_bureaucracy: "Mamalik-i-Mahrusa"
 ira_mamalik_i_mahrusa_bureaucracy_desc: "Le système apanage des « domaines gardés » de la dynastie Qajar, par lequel les fils et frères adultes du shah sont nommés gouverneurs généraux des grandes provinces (Abbas Mirza à Tabriz sur l'Azerbaïdjan, Mohammad Ali Mirza à Kermanshah, Hosayn Ali Mirza Farmanfarma à Chiraz sur le Fars) chacun tenant une cour, prélevant des impôts, levant des régiments et signant des traités avec des envoyés étrangers en tant que sous-monarque. sous le trône de Téhéran. Le système étend la portée des Qajar à travers un royaume sans service postal fonctionnel ni bureaucratie rémunérée, mais les cours princières dirigent leurs propres armées, contractent leurs propres emprunts auprès d'agents russes et britanniques et se combattent fréquemment à la mort d'un shah. La succession de 1834, qui nécessita l'intervention britannique pour asseoir Mohammad Shah, était le produit naturel du système."

 AUTO_MODIFIER_NAME_nd_ira_bureaucracy_authority: "Diwans de l'État Sublime"
 AUTO_MODIFIER_DESC_nd_ira_bureaucracy_authority: "The Shahanshah of Iran commands a layered apparatus of diwans, sadrs, and mostowfis, perfected from the Safavid reform of Shah Abbas to the Qajar appanage. The throne may institute three of the great Persian bureaucracies, choosing whose hand will rule the realm: the chancery, the slave corps, the uymaq, or the princes."
