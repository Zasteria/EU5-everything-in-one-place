l_french:
 STATIC_MODIFIER_NAME_nd_tib_ganden_phodrang: "Ganden Phodrang"
 STATIC_MODIFIER_DESC_nd_tib_ganden_phodrang: "Le gouvernement théocratique unifié établi sous le Dalaï Lama, fusionnant l'autorité spirituelle avec le pouvoir temporel par l'intermédiaire du conseil de Kashag. Les monastères servent de centres d'apprentissage, de gouvernance et de coordination militaire."
 STATIC_MODIFIER_NAME_nd_tib_dharma_kings: "La Voie des Rois du Dharma"
 STATIC_MODIFIER_DESC_nd_tib_dharma_kings: "Dans la tradition des grands rois tibétains (Songtsen Gampo, Trisong Detsen et Ralpacan), un souverain-guerrier règne sur le plateau avec une ferme autorité, protégeant le dharma tout en commandant les armées qui le défendent."
 nd_tib.1.t: "Unification du Toit du Monde"
 nd_tib.1.d: "Tibet is united. From the windswept passes of the Changtang to the forested valleys of Kham, the plateau stands as one realm. But the question of how this realm shall be governed echoes through every monastery and fortress.\n\nThe Gelugpa monks offer a vision of sacred governance: the Ganden Phodrang, where the incarnate Dalai Lama guides both faith and statecraft through a council of learned ministers. In their monasteries, ten thousand monks study, pray, and prepare to administer an empire of the spirit.\n\nYet others look to the tradition of the Dharma Kings, those warrior-sovereigns who forged Tibet through conquest and patronage alike. A strong hand on the reins of power, they say, is what kept the plateau safe from the empires that ring its borders: China, Mongolia, the Mughals.\n\nWhich path shall Tibet follow?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tib.1.a: "Laissez la sagesse du Dalaï Lama guider notre nation"
 nd_tib.1.b: "Le Tibet a besoin d'un roi-guerrier, pas d'un moine"
 STATIC_MODIFIER_NAME_nd_tib_potala_glory: "Gloire du Potala"
 STATIC_MODIFIER_DESC_nd_tib_potala_glory: "Le magnifique palais du Potala couronne la colline de Marpo Ri au-dessus de Lhassa, ses tours blanches et rouges étant visibles à des kilomètres à travers la vallée. Monument à l’unité du pouvoir spirituel et temporel, il inspire le respect à tous ceux qui le contemplent."
 nd_tib.2.t: "Le palais au-dessus des nuages"
 nd_tib.2.d: "The Potala Palace rises from the summit of Marpo Ri, the Red Hill of Lhasa. Thirteen stories of stone and timber, its White Palace houses the chambers of governance while the Red Palace contains chapels, tombs, and libraries of sacred texts. Tens of thousands of laborers and artisans have worked for decades to realize this vision.\n\nStarted in 1645 by the Fifth Dalai Lama, the palace took nearly fifty years to complete: its construction continuing in secret after his death under the stewardship of the regent Desi Sangye Gyatso. With over a thousand rooms, ten thousand shrines, and two hundred thousand statues, it stands as the greatest architectural achievement of the Tibetan plateau.\n\nThe Potala is more than a palace. It is a statement: that Tibet's civilization, nestled among the highest mountains on Earth, can produce works to rival any empire below."
 nd_tib.2.a: "Un monument digne du Toit du Monde"
 STATIC_MODIFIER_NAME_nd_tib_khampa_rising: "L'Insurrection de Khampa"
 STATIC_MODIFIER_DESC_nd_tib_khampa_rising: "Les féroces cavaliers Khampa de l'est du Tibet se sont ralliés à la bannière, apportant à l'armée nationale leurs prouesses martiales légendaires et leur connaissance approfondie de la guerre en montagne."
 STATIC_MODIFIER_NAME_nd_tib_plateau_command: "Commandement du Plateau"
 STATIC_MODIFIER_DESC_nd_tib_plateau_command: "L'intégration des territoires Khampa sous commandement centralisé a renforcé l'emprise de l'État sur sa vaste frontière orientale, canalisant l'énergie des guerriers vers un service discipliné."
 nd_tib.3.t: "Les guerriers du Kham"
 nd_tib.3.d: "The people of Kham, the Khampas, are unlike any other Tibetans. Towering in stature, fierce in temperament, they are born to the saddle and the sword. Their reputation as warriors is unmatched on the plateau, and the mountain passes of eastern Tibet ring with the thunder of their horses.\n\nFor centuries, the Khampas have maintained a semi-autonomous existence, their tribal chiefs answering only loosely to Lhasa. Now, as Tibet's unified state matures, the question arises: how shall these formidable warriors be incorporated into the nation?\n\nOne path embraces their independence: granting the Khampa chieftains autonomy in exchange for their ferocious cavalry when called to war. The other demands integration, placing Khampa warriors under Lhasa's direct command, disciplining their fury into organized military power."
 nd_tib.3.a: "Laissez les Khampas circuler librement : leur fureur est notre bouclier"
 nd_tib.3.b: "Amenez-les sous le commandement du Kashag"
 nd_tib.4.t: "Les quatre tantras de guérison"
 nd_tib.4.d: "The tradition of Sowa Rigpa, the Science of Healing, reaches its full flowering. Building on the Gyushi, the Four Medical Tantras compiled in the twelfth century by Yuthok Yonten Gonpo, Tibetan physicians have developed one of the most sophisticated medical systems in Asia.\n\nDrawing from Indian Ayurveda, Chinese medicine, Persian healing arts, and native Bon practices, the Four Tantras describe the human body as a landscape of elements in balance. Illness comes from their disturbance; healing comes from their restoration through herbs gathered at high altitude, mineral compounds, dietary regulation, and spiritual practice.\n\nThe establishment of medical colleges, Mentsekhang, in major monasteries ensures that this knowledge is preserved and transmitted. Physicians trained in these institutions serve communities across the plateau, their skills in demand from Nepal to Mongolia."
 nd_tib.4.a: "La science de la guérison illumine notre terre"
 nd_tib.5.t: "Dharma dans l'encre et le bois"
 nd_tib.5.d: "The great printing houses of Tibet (at Narthang, Derge, and Lhasa) have transformed the preservation of Buddhist knowledge. Thousands of woodblocks, each painstakingly carved in reverse by master craftsmen, produce pages of scripture with a speed and accuracy that hand-copying could never match.\n\nUnlike the movable type of China, Tibetan printers favored permanent woodblocks. A single block, once carved, could produce faithful copies for centuries: an appealing permanence for monasteries that saw themselves as guardians of an unbroken lineage of authentic Buddhist teaching. The Derge Parkhang alone houses over two hundred thousand blocks.\n\nThis revolution in textual production has spread literacy through the monastic system, standardized religious practice across the plateau, and created a body of printed literature rivaling any civilization on Earth."
 nd_tib.5.a: "Le dharma se propage sur des ailes imprimées"
 nd_tib_warrior_monks: "Tradition du moine guerrier"
 nd_tib_warrior_monks_desc: "Les grands monastères du Tibet entretiennent leurs propres contingents armés : les dob-dob, moines guerriers qui allient prouesses physiques et dévotion religieuse, servant d'exécutants et de défenseurs de l'ordre monastique."
 nd_tib_yak_butter_economy: "Économie du beurre de yak"
 nd_tib_yak_butter_economy_desc: "La transformation du beurre de yak pour le commerce, les offrandes rituelles de lampes et le thé au beurre emblématique soutiennent à la fois les économies monastiques et pastorales du plateau."
 nd_tib_dzong_system: "Système de forteresse de Dzong"
 nd_tib_dzong_system_desc: "Le dzong (un monastère fortifié combinant garnison militaire, centre administratif et complexe religieux) constitue l'épine dorsale du contrôle territorial tibétain sur l'ensemble du plateau."
 nd_tib_tea_horse_road: "Route du thé et du cheval"
 nd_tib_tea_horse_road_desc: "Les anciennes routes caravanières reliaient les régions productrices de thé de Chine aux hauts plateaux d'élevage de chevaux du Tibet, facilitant l'échange de chevaux, de sel et de laine tibétains contre du thé, de la soie et des produits manufacturés chinois."
 nd_tib_phagmodrupa_legacy: "L'héritage de Phagmodrupa"
 nd_tib_phagmodrupa_legacy_desc: "Les traditions administratives établies sous la dynastie Phagmodrupa, un équilibre entre autorité féodale et surveillance monastique, continuent de façonner la gouvernance tibétaine."
 nd_tib_sowa_rigpa: "Sowa Rigpa"
 nd_tib_sowa_rigpa_desc: "La science de la guérison : le système médical sophistiqué du Tibet basé sur les quatre tantras, s'inspirant des traditions indiennes, chinoises, perses et bon pour traiter les maladies du corps et de l'esprit."
 nd_tib_woodblock_printing: "Imprimeries sur bois"
 nd_tib_woodblock_printing_desc: "Les grandes imprimeries de Narthang, Derge et Lhassa produisent des écritures bouddhistes à partir de blocs de bois permanents, diffusant ainsi l'alphabétisation et normalisant la pratique religieuse sur tout le plateau."
 nd_tib_salt_monopoly: "Monopole de Salt Lake"
 nd_tib_salt_monopoly_desc: "Les vastes lacs salés du Tibet offrent un monopole sur ce produit essentiel, commercialisé au sud du Népal et de l'Inde en échange de céréales et de produits manufacturés."
 nd_tib_sectarian_wars: "Conflit sectaire"
 nd_tib_sectarian_wars_desc: "Les luttes prolongées entre les factions Kagyu, Gelug et Bon pour la suprématie ont endurci les soldats tibétains à travers des générations de guerre civile."
 nd_tib_mountain_warfare: "Doctrine du col de montagne"
 nd_tib_mountain_warfare_desc: "Des siècles de défense des cols les plus élevés de la Terre ont produit une approche tibétaine unique de la guerre en montagne : utiliser l'altitude, le terrain et l'air lui-même comme armes contre les envahisseurs des plaines."
 nd_tib_highland_textiles: "Textiles des Highlands"
 nd_tib_highland_textiles_desc: "La laine et la fourrure tibétaines, récoltées auprès de troupeaux de yacks et de gibier sauvage à des altitudes extrêmes, sont des produits prisés sur les marchés de l'Inde, de la Chine et de l'Asie centrale."
 nd_tib_khampa_cavalry: "Tradition de la cavalerie Khampa"
 nd_tib_khampa_cavalry_desc: "Les féroces cavaliers du Kham, la culture guerrière de l'est du Tibet, apportent des compétences inégalées dans la guerre de cavalerie en montagne, leurs chevaux étant élevés pour l'endurance en altitude."
 nd_tib_gelugpa_ascendancy: "Ascendance Gelugpa"
 nd_tib_gelugpa_ascendancy_desc: "La montée en puissance de l'école Yellow Hat transforme la vie religieuse tibétaine, établissant l'autorité spirituelle du Dalaï Lama sur le plateau et en Mongolie."
 nd_tib_dzong_garrisons: "Système de garnison de Dzong"
 nd_tib_dzong_garrisons_desc: "Formation militaire formalisée pour les moines stationnés dans les forteresses de dzong, créant une force de garnison professionnelle combinant discipline religieuse et compétences martiales."
 nd_tib_choyon_alliance: "Alliance Choyon"
 nd_tib_choyon_alliance_desc: "La relation patron-prêtre entre lamas tibétains et khans mongols : un chef-d’œuvre diplomatique où l’autorité spirituelle est échangée contre une protection militaire et une légitimité politique."
 nd_tib_tibetan_coinage: "Monnaie tibétaine"
 nd_tib_tibetan_coinage_desc: "Le développement d’une monnaie tibétaine standardisée facilite les échanges commerciaux à travers le plateau et avec les puissances voisines, remplaçant ainsi le fastidieux échange de briques de thé et de sel."
 nd_tib_kashag_council: "Conseil de Kashag"
 nd_tib_kashag_council_desc: "La création officielle du Kashag, un conseil des ministres mêlant autorité laïque et cléricale, en tant que principal organe administratif de l'État tibétain."
 nd_tib_potala_palace: "Palais du Potala"
 nd_tib_potala_palace_desc: "La construction du Palais du Potala sur Marpo Ri : treize étages de pierre, la plus grande réalisation architecturale du plateau tibétain et siège de l'autorité à la fois spirituelle et temporelle."
 nd_tib_desi_regency: "Tradition Régence"
 nd_tib_desi_regency_desc: "La tradition administrative pragmatique établie par Desi Sangye Gyatso, qui a gouverné le Tibet pendant l'interrègne après la mort du Cinquième Dalaï Lama, la cachant pendant quinze ans tout en consolidant le pouvoir de l'État."
 nd_tib_narthang_press: "Extension de l'impression Narthang"
 nd_tib_narthang_press_desc: "L'expansion de l'impression sur bois de Narthang et Derge à des dizaines de monastères à travers le plateau, créant un réseau de production scientifique inégalé en Asie centrale."
 nd_tib_plateau_horsemen: "Tactiques de cavalerie du plateau"
 nd_tib_plateau_horsemen_desc: "Le raffinement des tactiques de cavalerie pour les exigences uniques de la guerre à haute altitude : un équipement plus léger, des chevaux élevés pour l'air et l'accent mis sur les mouvements rapides sur de vastes distances."
 nd_tib_luxury_exports: "Commerce de la soie et du musc"
 nd_tib_luxury_exports_desc: "La position du Tibet, à cheval sur les routes entre la Chine et l'Asie du Sud, permet un commerce lucratif de produits de luxe : le musc, la soie, les herbes médicinales et les métaux précieux transitent par les cols des hautes terres."
 nd_tib_monastic_taxation: "Fiscalité monastique"
 nd_tib_monastic_taxation_desc: "La systématisation des domaines monastiques et de leur fiscalité fournit au gouvernement de Ganden Phodrang une base de revenus fiable, car les monastères servent à la fois de propriétaires, d'établissements d'enseignement et de percepteurs d'impôts."
 nd_tib_modern_reforms: "Modernisation des plateaux"
 nd_tib_modern_reforms_desc: "Tentatives de modernisation des institutions tibétaines : introduction de nouvelles méthodes administratives, éducation élargie et engagement avec le reste du monde tout en préservant l'identité culturelle unique du plateau."
 nd_tib_standing_army: "Armée permanente tibétaine"
 nd_tib_standing_army_desc: "La création de la première armée permanente professionnelle du Tibet, remplaçant le recours aux levées monastiques et à la cavalerie tribale par des soldats entraînés et disciplinés équipés d'armes modernes."
 nd_tib_communal_traditions: "Traditions foncières communales"
 nd_tib_communal_traditions_desc: "Les pratiques communales de gestion des terres et les structures familiales polyandres du Tibet, qui stabilisent la population et garantissent une utilisation durable des ressources agricoles limitées du plateau."
 nd_tib_dharma_preservation: "Préservation du Dharma"
 nd_tib_dharma_preservation_desc: "L'effort systématique visant à préserver et à développer l'érudition bouddhiste tibétaine : copier des textes, former des érudits et maintenir les universités monastiques qui ont servi de dépositaires de connaissances pendant des siècles."
 nd_tib_plateau_trade_network: "Réseau commercial du Plateau"
 nd_tib_plateau_trade_network_desc: "La maturation du système commercial des hautes terres du Tibet : reliant Lhassa à Calcutta, Katmandou, Pékin et la Route de la Soie grâce à un réseau de caravanes, de postes de traite et de relations commerciales établies."
 a_nd_tib_dob_dob: "Dob-dob"
 a_nd_tib_dob_dob_desc: "Moines guerriers des grands monastères du Tibet, les dob-dob sont de redoutables combattants qui allient ferveur religieuse et prouesses physiques. Armés de bâtons et de frondes, ils patrouillent dans les terrains monastiques et forment une infanterie de choc en temps de guerre."
 a_nd_tib_khampa_horsemen: "Cavaliers Khampa"
 a_nd_tib_khampa_horsemen_desc: "Les guerriers à cheval du Kham naissent en selle. Armés d'épées, d'arcs et de fusils à mèche, ces féroces cavaliers sont des pillards experts qui connaissent tous les cols et vallées de l'est du Tibet."
 a_nd_tib_garrison_monks: "Moines de garnison"
 a_nd_tib_garrison_monks_desc: "Des moines-soldats disciplinés formés pour défendre les monastères-forteresses dzong. Combinant conviction religieuse et exercice militaire, ils forment la force de garnison permanente de l’État tibétain."
 a_nd_tib_plateau_riders: "Cavaliers du Plateau"
 a_nd_tib_plateau_riders_desc: "Cavalerie d'élite de haute altitude équipée d'armes plus légères et de chevaux de selle élevés pour l'air raréfié du plateau. Rapides et agiles, ils excellent dans les manœuvres de flanc à travers la vaste steppe tibétaine."
 a_nd_tib_regulars: "Des habitués tibétains"
 a_nd_tib_regulars_desc: "Soldats professionnels de la première armée permanente du Tibet, formés à la discipline militaire moderne tout en conservant l'expertise en guerre en montagne qui a toujours été la plus grande défense du plateau."
 nd_tib_dzong: "Dzong"
 nd_tib_dzong_desc: "Une immense forteresse-monastère qui sert de bastion militaire, de centre administratif et de complexe religieux. Construit sur des hauteurs imposantes avec d'épais murs de pierre, le dzong est l'épine dorsale du contrôle territorial tibétain."
 nd_tib_tea_horse_post: "Poste de traite des chevaux de thé"
 nd_tib_tea_horse_post_desc: "Une station de caravanes sur l'ancienne route du thé et des chevaux, où les chevaux tibétains, le sel et la laine sont échangés contre du thé, de la soie et des produits manufacturés chinois. Ces poteaux soutiennent la bouée de sauvetage commerciale du plateau."
 nd_tib_mentsekhang: "Mentsekhang"
 nd_tib_mentsekhang_desc: "Une faculté de médecine enseignant le Sowa Rigpa : la science tibétaine de la guérison. Les médecins formés ici maîtrisent les Quatre Tantras, traitant les maladies à l'aide de remèdes à base de plantes, de composés minéraux et de pratiques spirituelles."
 nd_tib_printing_house: "Imprimerie"
 nd_tib_printing_house_desc: "Un atelier monastique d'impression sur bois où des maîtres artisans sculptent les écritures en blocs permanents. Une seule imprimerie peut contenir des dizaines de milliers de blocs, produisant des textes bouddhistes destinés à être distribués sur tout le plateau."
 nd_tib_butter_workshop: "Atelier Lampe à Beurre"
 nd_tib_butter_workshop_desc: "Une installation de transformation du beurre de yak pour fabriquer des lampes rituelles qui éclairent chaque monastère du plateau, ainsi que du thé au beurre qui nourrit les moines et les nomades dans l'air raréfié et froid."
 nd_tib_salt_warehouse: "Entrepôt de sel"
 nd_tib_salt_warehouse_desc: "Une installation de stockage et de traitement du sel récolté dans les lacs salés de haute altitude du Tibet, l'un des produits commerciaux les plus précieux du plateau."
 nd_tib_choyon_temple: "Temple Choyon"
 nd_tib_choyon_temple_desc: "Un grand complexe de temples dédié à la relation patron-prêtre qui lie le Tibet à ses alliés mongols, servant de centre de cérémonie diplomatique et d'échange culturel."
 nd_tib_wool_workshop: "Atelier de laine des Highlands"
 nd_tib_wool_workshop_desc: "Un atelier textile transformant la laine fine des yaks et des moutons tibétains en tissus prisés dans toute l'Asie pour sa chaleur et sa durabilité."
 nd_tib_potala_shrine: "Sanctuaire du Potala"
 nd_tib_potala_shrine_desc: "Un complexe de dévotion sacré inspiré par la grandeur architecturale du palais du Potala, servant de centre de culte bouddhiste, de mécénat artistique et de prestige culturel."
 nd_tib_communal_granary: "Grenier Communautaire"
 nd_tib_communal_granary_desc: "Une installation communautaire de stockage de nourriture suivant l'ancienne tradition tibétaine de gestion communautaire des ressources, garantissant la survie pendant les hivers rigoureux du plus haut plateau de la Terre."
 nd_tib_dzong_upkeep: "Entretien de Dzong"
 nd_tib_dzong_upkeep_desc: "La réparation et l'approvisionnement en cours des murs massifs en pierre et des structures en bois de la forteresse-monastère."
 nd_tib_caravan_trade: "Commerce de caravanes"
 nd_tib_caravan_trade_desc: "L'échange de thé et de chevaux via le poste de traite des Highlands."
 nd_tib_medical_herbs: "Cueillette d'herbes médicinales"
 nd_tib_medical_herbs_desc: "Collecte et préparation d'herbes médicinales d'altitude selon la tradition des Quatre Tantras, appuyées par des textes savants, des bandages en lin et des lampes à beurre pour le travail du collège."
 nd_tib_printing_materials: "Impression sur bois"
 nd_tib_printing_materials_desc: "Le papier et le bois sont sculptés dans des blocs de bois permanents, produisant des écritures bouddhistes et des textes savants destinés à être distribués sur tout le plateau."
 nd_tib_butter_processing: "Traitement du beurre"
 nd_tib_butter_processing_desc: "Le lait de yak est baratté en beurre, transformé sous forme clarifiée et transformé en combustible pour lampes : ce qui donne une production équivalente à la cire d'abeille utilisée dans les monastères et commercialisée à travers le plateau."
 nd_tib_salt_processing: "Traitement du sel"
 nd_tib_salt_processing_desc: "Récolte et raffinage du sel des lacs d'altitude du plateau tibétain."
 nd_tib_ritual_offerings: "Offrandes rituelles"
 nd_tib_ritual_offerings_desc: "Encens et soie consommés lors des cérémonies élaborées de la tradition diplomatique patron-prêtre."
 nd_tib_wool_weaving: "Tissage de laine"
 nd_tib_wool_weaving_desc: "La laine des Highlands et les teintures naturelles sont tissées dans un tissu tibétain durable prisé dans toute l'Asie."
 nd_tib_shrine_offerings: "Offrandes au sanctuaire"
 nd_tib_shrine_offerings_desc: "Des offrandes d'encens et d'argent qui soutiennent les activités de dévotion du complexe sacré."
 nd_tib_highland_storage: "Stockage des Highlands"
 nd_tib_highland_storage_desc: "Produits céréaliers et animaux conservés pour la communauté pendant les hivers rigoureux du Tibet."
 levy_nd_tib_garrison_monks: "Prélèvement sur les moines de garnison"
 levy_nd_tib_garrison_monks_desc: "Des moines-soldats disciplinés appelaient depuis les forteresses du dzong pour défendre le plateau."
 levy_nd_tib_dob_dob: "Prélèvement Dob-dob"
 levy_nd_tib_dob_dob_desc: "Des moines guerriers étaient rassemblés dans les grands monastères pour servir d'infanterie de choc."
 nd_tib_formed_tt: "Le Tibet s'est formé"
 nd_tib_path_a_tt: "Choisissez Ganden Phodrang"
 nd_tib_path_b_tt: "Choisissez la voie des rois du Dharma"

 # Bureaucracy authority: granted post-formation
 AUTO_MODIFIER_NAME_nd_tib_bureaucracy_authority: "Autorité du Ganden Phodrang"
 AUTO_MODIFIER_DESC_nd_tib_bureaucracy_authority: "Out of the Fifth Dalai Lama's reorganization of the plateau emerges a layered government of councils, secretariats, and dzong-magistrates. The throne may institute three of the great Tibetan bureaucracies, choosing which institutions will define the unified theocracy."

 # Bureaucracies
 tib_kashag_bureaucracy: "Conseil de Kashag"
 tib_kashag_bureaucracy_desc: "Codifié par les réformes de Qianlong de 1751 après l'assassinat du régent laïc Gyurme Namgyal, le Kashag fit asseoir quatre ministres kalon dans une seule chambre : trois nobles laïcs issus des grandes maisons de Lhassa (Lhalu, Yuthok, Phunkhang) et un moine-kalon nommé par le Dalaï Lama. Aucun ministre ne peut agir sans le consentement des autres. Le Kashag était l'empire de la paperasse qui dirigeait les affaires quotidiennes du plateau et s'est avéré l'institution la plus stable construite par le Tibet, mais il a intégré l'aristocratie laïque de manière permanente au sein du Ganden Phodrang."

 tib_yiktsang_bureaucracy: "Secrétariat ecclésiastique de Yiktsang"
 tib_yiktsang_bureaucracy_desc: "Le cabinet parallèle des quatre trungyikchenmo, les moines-secrétaires en chef qui s'occupaient de toutes les questions touchant les monastères : ordinations, conflits doctrinaux, domaines monastiques, audit du labrang du Dalaï Lama et nomination des dzongpon aux dzongs monastiques. À l’image du Kashag dans chaque préfecture, le Yiktsang a fait du Ganden Phodrang une double administration littérale : et a rendu le clergé structurellement indispensable à tout acte d’État."

 tib_densa_sum_bureaucracy: "Densa Sum : Les Trois Piliers"
 tib_densa_sum_bureaucracy_desc: "Les trois grands monastères Gelugpa de la plaine de Lhassa : Sera (fondé en 1419 par Sakya Yeshe), Drepung (1416 par Jamyang Choje, le plus grand monastère du monde avec plus de dix mille moines), et Ganden (1409 par Tsongkhapa, siège du Ganden Tripa). Leurs abbés pouvaient opposer leur veto aux nominations dans la régence et leurs représentants siégeaient à l'Assemblée nationale de Tsongdu. Lors du coup d’État de Wangchuk Shatra en 1862, ce sont les moines de Drepung qui ont marché sur le Potala. Les Trois Piliers ont fait du bouddhisme tibétain une force politique d’État, et non seulement une foi."

 tib_mi_tser_bureaucracy: "Système immobilier Mi-tser"
 tib_mi_tser_bureaucracy_desc: "Les domaines à revenus du plateau étaient répartis en trois catégories : shung-gyu (domaines gouvernementaux exploités par des sujets tsongpa), choji (domaines monastiques soutenant des tulku spécifiques) et gerba (domaines nobles héréditaires des grandes maisons de Lhassa). Chaque domaine comportait des obligations de u-lag (corvée de transport forcé), de tsa-tang (provisions militaires) et de rendu de produits. Les mi-tser (littéralement « propriété humaine ») devaient du travail au propriétaire foncier qui contrôlait leur village natal. Le système maintenait la noblesse solvable et l'armée approvisionnée, mais liait la paysannerie à son lieu de naissance par des obligations héritées."

 tib_dzongpon_bureaucracy: "Magistrature de Dzongpon"
 tib_dzongpon_bureaucracy_desc: "Les magistrats de district des cinquante-trois forteresses dzong qui assuraient l'autorité de Ganden Phodrang sur tout le plateau, de Shigatse et Gyantse dans le Tsang à Chamdo et Markham dans le Kham. Chaque dzong était administré par une nomination jumelée : un dzongpon laïc tiré du registre noble du Tse-yik, un moine-dzongpon du rôle du Yiktsang, tous deux tournant pour un mandat de trois ans afin qu'aucun magistrat ne puisse s'enraciner localement de manière permanente. Le dzong abritait le grenier, le registre des corvées, le rassemblement de la milice et le tribunal local."

 tib_monlam_chenmo_bureaucracy: "Grand festival de prière de Monlam Chenmo"
 tib_monlam_chenmo_bureaucracy_desc: "Fondé par Tsongkhapa en 1409, le Grand Festival de Prière est devenu le rituel central de l'État de Ganden Phodrang. Pendant vingt et un jours à compter du quatrième jour du premier mois lunaire, l'administration laïque de la ville s'est suspendue et l'abbé Drepung Shartse a assumé la fonction de tsogchen shal-ngo, magistrat du festival, avec autorité de police sur Lhassa et le droit d'imposer une amende, de fouetter ou de bannir tout habitant. Vingt mille moines se sont rassemblés dans le quartier de Jokhang pour réciter, débattre et traiter derrière la grande image de Maitreya. Le festival met chaque année en scène l’unité du dharma et de l’État pour l’ensemble de la population."

 # ===== DESTINY TREE =====
 nd_tib_destiny: "Destin du Tibet"
 nd_tib_destiny_desc: "Le plateau a été unifié auparavant, et à deux reprises, par des moyens opposés. Le tsenpo de Yarlung l'a fait avec de la cavalerie et un traité, tenant le couloir Hexi et recevant un tribut de Chang'an. Les hiérarques Gelug l'ont fait avec des monastères et des magistrats, gouvernant depuis Lhassa sans aucun roi. Les deux sont toujours disponibles. Il reste à choisir à quel Tibet le monde devra faire face."
 nd_tib_dest_lhasa_settlement: "La colonie de Lhassa"
 nd_tib_dest_lhasa_settlement_desc: "In 1642 the Fifth Dalai Lama was installed as sovereign of Tibet and the Gelug order became the state itself. The seat of government is moved from Sakya to Lhasa, Shigatse grows around the monastery of Tashilhunpo, and the seats of the two great hierarchs are brought under one administration. The sectarian wars that consumed the plateau for three centuries are settled by making one sect the government."
 nd_tib_dest_lhasa_capital_tt: "Lhasa is the capital"
 nd_tib_dest_shigatse_developed_tt: "Shigatse is ours and has been built up to a development of at least 14"
 nd_tib_dest_dzong_magistracy: "La magistrature du Dzong"
 nd_tib_dest_dzong_magistracy_desc: "Fifty-three fortress-districts carry Ganden Phodrang authority to the edges of the plateau. Each dzong holds the granary, the corvee register, the militia muster and the court, and each is run by a paired appointment (one lay magistrate, one monk) rotated every three years so no magistrate strikes local roots. Gyantse, whose fortress has stood since 1390, is built up as the model of them, and Chamdo on the Kham road is held directly."
 nd_tib_dest_gyantse_developed_tt: "Gyantse is ours and has been built up to a development of at least 9"
 nd_tib_dest_monlam_chenmo: "La grande fête de prière"
 nd_tib_dest_monlam_chenmo_desc: "For twenty-one days each year the lay administration of Lhasa suspends itself and a Drepung abbot governs the city with the power to fine, flog and banish. Twenty thousand monks fill the Jokhang precinct. Tsongkhapa founded it in 1409 as a festival; the Ganden Phodrang keeps it as the annual proof that dharma and state are the same thing. The festival needs a city fit to hold it, and Derge in Kham under the direct hand of Lhasa."
 nd_tib_dest_lhasa_developed_tt: "Lhasa is ours and has been built up to a development of at least 30"
 nd_tib_dest_tsenpo_restored: "Le Tsenpo restauré"
 nd_tib_dest_tsenpo_restored_desc: "Tibet had kings before it had abbots. The Yarlung dynasty came out of the valley of Nedong with a sworn aristocracy and a cavalry army, and the monasteries served the crown rather than replacing it. Restoring that crown means the old seat at Nedong is rebuilt as a town, no emperor in China is acknowledged as overlord, and the plateau's warlike clans as far as Dartsedo answer to a throne again."
 nd_tib_dest_nedong_town_tt: "Nedong is ours and has grown into a town"
 nd_tib_dest_plateau_marches: "Les Marches du Plateau"
 nd_tib_dest_plateau_marches_desc: "Les cols himalayens sont les portes de l'empire : le Ladakh à l'ouest, les vallées népalaises au sud. L'ancien empire les détenait avec des garnisons permanentes et traitait les montagnes comme une frontière à administrer plutôt que comme un mur derrière lequel se cacher."
 nd_tib_dest_bod_chen_po: "Bod Chen Po"
 nd_tib_dest_bod_chen_po_desc: "Le Grand Tibet, comme l’appelait la chancellerie Tang. Entre 786 et 848, le tsenpo détenait purement et simplement le couloir Hexi, coupant la Chine de l'Asie centrale et taxant tout le commerce de la soie à Shazhou et Ganzhou. En 763, une armée tibétaine prit Chang'an et installa son propre empereur. Cet empire est celui qui est en train d’être reconstruit."
 nd_tib.10.t: "La question du plateau"
 nd_tib.10.d: "Les ministres l’ont dit clairement. Le Tibet peut être gouverné comme une Église ou comme un royaume, et les deux ont besoin d'hommes différents dans les mêmes fonctions. Les abbés veulent que le dzong soit doté de moines et que les revenus soient promis aux grandes maisons de prière. Les seigneurs du Kham et du Ngari veulent un tsenpo, un rassemblement et le retour de l'ancienne frontière. Le retard ne favorise ni l’un ni l’autre."
 nd_tib.10.a: "Le plateau choisira sa propre route"
 nd_tib.11.t: "Une secte, un État"
 nd_tib.11.d: "Les hiérarques Gelug de Lhassa et les abbés de Shigatse se sont mis d’accord sur des conditions, et l’accord est qu’il n’y a pas de conditions : les chapeaux jaunes gouvernent. Trois siècles de guerre sectaire ne se terminent pas par un compromis mais par un règlement, et les monastères qui ont résisté voient leurs domaines transférés à ceux qui n'ont pas résisté. Le plateau est calme pour la première fois de mémoire d’homme."
 nd_tib.11.a: "Le Ganden Phodrang gouverne"
 nd_tib.12.t: "Les forteresses du royaume"
 nd_tib.12.d: "Les dzong sont prêts : grenier, registre, rassemblement et tribunal sous un même toit, de Gyantse à Tsang à Chamdo sur la route du Kham. Reste à décider qui y siège. Le Yiktsang a suffisamment de moines pour occuper tous les postes ; le registre noble des Tse-yik compte des hommes qui connaissent déjà les districts et les familles qui y vivent."
 nd_tib.12.a: "Nominations en binôme, moine et laïc, alternées tous les trois ans"
 nd_tib.12.b: "Personnel du registre noble - ils connaissent le terrain"
 nd_tib.13.t: "Vingt mille moines"
 nd_tib.13.d: "Le Monlam Chenmo est devenu trop grand pour le quartier de Jokhang. Un pavillon permanent accueillerait toute l'assemblée et ferait de l'autorité du festival sur Lhassa une question d'architecture plutôt que de coutume. Il existe un autre point de vue : la question sectaire n’a jamais été véritablement réglée et le moment est venu de la régler par décret, alors que les Chapeaux jaunes occupent toutes les fonctions qui méritent d’être occupées."
 nd_tib.13.a: "Construisez le pavillon - laissez le festival parler au nom de l'État"
 nd_tib.13.b: "Réglez les sectes par décret pendant que les bureaux sont à nous"
 nd_tib.14.t: "Une couronne hors de stockage"
 nd_tib.14.d: "Les insignes des rois Yarlung sont conservés dans les réserves du monastère depuis six cents ans, catalogués comme reliques. On le fait sortir, et les clans du Kham qui ne s'inclineraient jamais devant un abbé viennent à Lhassa pour jurer. On dit aux abbés que la couronne protège le dharma. Toutes les personnes présentes comprennent que l’ordre de préséance a changé."
 nd_tib.14.a: "Le tsenpo est couronné"
 nd_tib.15.t: "Les portes des montagnes"
 nd_tib.15.d: "Le Ladakh et les vallées népalaises sont pris, et les cols avec eux. Tenir une frontière aussi longue est une question de méthode : des garnisons permanentes en pierre, nourries et payées depuis Lhassa, ou les clans de chevaux du Kham la chevauchant comme ils l'ont toujours monté, moins cher et plus rapide et responsable devant leurs propres chefs."
 nd_tib.15.a: "Garnissez les cols en pierre"
 nd_tib.15.b: "Élevez les clans Kham et laissez-les parcourir la frontière"
 nd_tib.16.t: "Grand Tibet"
 nd_tib.16.d: "Shazhou et Ganzhou sont à nous, et avec eux le couloir qui transporte toutes les caravanes entre la Chine et l’Occident. La chancellerie Tang appela cet État Bod chen po et négocia avec lui sur un pied d'égalité. Le corridor peut être tenu comme le tenait l'ancien empire, en force, avec les garnisons et les troupeaux de chevaux que cela implique - ou il peut être simplement taxé, ce qui coûte moins cher et offense moins."
 nd_tib.16.a: "Tenez-le comme le tsenpo le tenait"
 nd_tib.16.b: "Prenez les péages et laissez les caravanes tranquilles"
 STATIC_MODIFIER_NAME_nd_tib_dest_dzong_network: "Réseau Dzong"
 STATIC_MODIFIER_DESC_nd_tib_dest_dzong_network: "Paired lay and monastic magistrates rotate through fifty-three fortress-districts on three-year terms. No magistrate strikes local roots, every district keeps its granary and muster in working order, and the corvee turns out when it is called."
 STATIC_MODIFIER_NAME_nd_tib_dest_lay_magistracy: "Magistrature laïque"
 STATIC_MODIFIER_DESC_nd_tib_dest_lay_magistracy: "The dzong are staffed from the Tse-yik's noble registry. The great houses get the offices, the offices get men who already know the districts, and the trade that moves through the fortress towns is taxed by people with an interest in it continuing. The houses do not give the offices back."
 STATIC_MODIFIER_NAME_nd_tib_dest_great_prayer: "La grande prière"
 STATIC_MODIFIER_DESC_nd_tib_dest_great_prayer: "Un pavillon permanent accueille toute l'assemblée du Monlam. Chaque année, pendant trois semaines, le magistrat du festival gouverne Lhassa, et l'unité du dharma et de l'État est mise en scène devant l'ensemble de la population plutôt que débattue en conseil."
 STATIC_MODIFIER_NAME_nd_tib_dest_gelug_primacy: "Primauté Guéloug"
 STATIC_MODIFIER_DESC_nd_tib_dest_gelug_primacy: "The sectarian question is closed by decree while the yellow hats hold every office worth holding. Rival estates are transferred, rival lineages are recognised as branches, and the plateau's religious map is redrawn to match its administrative one. The other schools are no longer suffered as rivals."
 STATIC_MODIFIER_NAME_nd_tib_dest_marchlands: "Les Marches"
 STATIC_MODIFIER_DESC_nd_tib_dest_marchlands: "Garnisons de pierre sur les cols de l'Himalaya, nourries et payées depuis Lhassa. La frontière est administrée plutôt que simplement surveillée, et une armée qui y opère n'est jamais loin d'un poste ravitaillé."
 STATIC_MODIFIER_NAME_nd_tib_dest_khampa_levies: "Prélèvements Khampa"
 STATIC_MODIFIER_DESC_nd_tib_dest_khampa_levies: "The Kham horse-clans ride the frontier as they always have, answerable to their own chiefs and mustered by summons rather than by pay. Cheaper than garrisons and faster than garrisons, and the chiefs who lead them keep their own counsel."
 STATIC_MODIFIER_NAME_nd_tib_dest_great_tibet: "Bod Chen Po"
 STATIC_MODIFIER_DESC_nd_tib_dest_great_tibet: "Le couloir Hexi est tenu en force, comme le voulait le tsenpo : les garnisons de Shazhou et de Ganzhou remontent les troupeaux derrière elles, et le souvenir de chaque siège que les armées du plateau ont jamais mené est inscrit dans la manière dont elles mèneront le prochain."
 STATIC_MODIFIER_NAME_nd_tib_dest_silk_road_tolls: "Les péages du corridor"
 STATIC_MODIFIER_DESC_nd_tib_dest_silk_road_tolls: "Les caravanes sont taxées plutôt que commandées. Shazhou et Ganzhou gardent leurs marchands, leurs marchands gardent leurs routes, et le plateau prend une part de tout ce qui circule entre la Chine et l'ouest sans payer les garnisons dont aurait besoin son maintien pur et simple."

 nd_tib_monlam_pavilion: "Pavillon Monlam"
 nd_tib_monlam_pavilion_desc: "Une salle permanente pour le Grand Festival de Prière, élevée à côté du Jokhang afin que les vingt mille moines qui viennent chaque printemps n'aient plus à remplir les rues. En dehors des semaines de fête, il abrite les cours de débat et l'aumônerie, et les abbés qui dirigent les deux sont les mêmes qui dirigent la ville trois semaines par an."
 nd_tib_tsenpo_citadel: "Citadelle de Tsenpo"
 nd_tib_tsenpo_citadel_desc: "La capitale de guerre des rois Yarlung reconstruite en pierre : terrain de rassemblement, armurerie, enclos de remontée et caserne de la garde royale à l'intérieur d'un mur. L'ancien empire menait ses campagnes à partir d'endroits comme celui-ci, et une armée qui se rassemble ici est nourrie et cavalière avant d'atteindre la frontière."

 nd_tib_monlam_provisioning: "Approvisionnement du festival"
 nd_tib_monlam_provisioning_desc: "De l'encens pour les lampes d'offrande, du beurre et de la viande pour vingt mille convives, du brocart pour les images de procession et de la cire d'abeille par charrettes. L'aumônerie achète pendant trois semaines le doublement de la population de Lhassa et l'achète un an à l'avance."
 nd_tib_citadel_garrison: "Garnison de la Citadelle"
 nd_tib_citadel_garrison_desc: "Des armes provenant des forges du plateau, des remontages et de la viande provenant des troupeaux royaux, et du feutre et de la laine de quoi maintenir en vie une garde montante pendant un hiver tibétain en altitude."
