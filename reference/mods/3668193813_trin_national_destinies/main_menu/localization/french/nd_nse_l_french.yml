l_french:
 STATIC_MODIFIER_NAME_nd_nse_whale_road: "La route des baleines"
 STATIC_MODIFIER_DESC_nd_nse_whale_road: "La mer n'est pas une barrière mais une autoroute. Nos flottes relient trois royaumes en un seul, et la route des baleines transporte nos marchands, nos guerriers et nos lois vers toutes les rives du monde nordique."
 STATIC_MODIFIER_NAME_nd_nse_crown_of_three_kingdoms: "Couronne des Trois Royaumes"
 STATIC_MODIFIER_DESC_nd_nse_crown_of_three_kingdoms: "L'Angleterre, le Danemark et la Norvège répondent à une seule couronne. Ce que Cnut a forgé grâce à la conquête, nous le maintiendrons grâce à la loi et à la gouvernance, unissant trois peuples en un seul imperium."
 nd_nse.1.t: "L’empire de la mer du Nord renaît"
 nd_nse.1.d: "The dream of Cnut the Great lives again. Where once a single king united the thrones of England, Denmark, and Norway through force of arms and force of personality, we have surpassed even that legendary achievement. The North Sea, that vast grey expanse that separates lesser nations, is now our inner lake, our highway, our lifeblood.\n\nBut an empire held together by water faces a fundamental question that Cnut himself never answered: what kind of power shall we be? The sea that unites us also defines us. We can embrace that identity fully, becoming the supreme maritime power of the age, our fleets unchallenged from the Faeroes to the Skagerrak. Or we can use the sea merely as the connective tissue of something greater: a unified crown that governs three nations as one, blending Anglo-Saxon law with Norse custom into a new imperial tradition.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_nse.1.a: "La route des baleines est notre empire"
 nd_nse.1.b: "Une couronne, trois royaumes, une loi"
 nd_nse.2.t: "Le Danegeld perfectionné"
 nd_nse.2.d: "What began as tribute extorted from terrified Anglo-Saxon kings has become the most efficient tax system in northern Europe. The Danegeld, once a shameful payment to buy off Viking raiders, is now a sophisticated land tax, assessed by hide and collected by royal reeves across every shire. No other kingdom can match the thoroughness of our fiscal administration.\n\nThe question before us is how to direct this extraordinary revenue stream. We can tighten the collection apparatus further, ensuring that every last penny flows to the royal treasury and strengthening crown control over distant provinces. Or we can redirect a portion of this wealth into commercial infrastructure, reinvesting the Danegeld into the trade networks that make our empire prosperous."
 nd_nse.2.a: "Resserrer l’appareil budgétaire"
 nd_nse.2.b: "Réinvestir dans le commerce et la prospérité"
 nd_nse.3.t: "Le Leidang reforgé"
 nd_nse.3.d: "The ancient leidang system, the naval levy that once mustered the fleets of Scandinavia, has been reformed for a new age. Under the old system, each coastal district was obligated to provide one ship and crew for seasonal expeditions. Now we have systematized and expanded this obligation across the entire North Sea Empire, from the fjords of Norway to the estuaries of eastern England.\n\nEvery skipreide and every shire along our vast coastline now contributes to a standing naval reserve. When the empire calls, hundreds of ships can be mustered within weeks. The sea that others fear is our fortress wall."
 nd_nse.3.a: "La mer du Nord connaîtra nos quilles"
 nd_nse.4.t: "La grande chose païenne"
 nd_nse.4.d: "In the ancient Norse tradition, the Thing was where free men gathered to settle disputes, proclaim laws, and hold their rulers accountable. Now, representatives from every corner of the North Sea Empire (English earls and Danish jarls, Norwegian lagmen and Scottish thanes) have gathered in the greatest assembly our world has ever seen.\n\nThis is more than a legal proceeding. It is the moment when three distinct peoples begin to see themselves as one. The laws proclaimed today will be written in three languages and enforced from Trondheim to Canterbury. What the sword began, the law will complete."
 nd_nse.4.a: "Laisse la loi lier ce que l'épée a forgé"
 nd_nse.5.t: "Maîtrise de la mer du Nord"
 nd_nse.5.d: "The launching of our great ships of the line marks the culmination of centuries of naval tradition. From the dragon-prowed longships that first terrorized the coasts of Europe to these towering floating fortresses bristling with cannon, the evolution of North Sea naval power has been relentless.\n\nNo fleet in the world can challenge our command of the northern waters. The approaches to every major port from Bergen to London lie under our guns. The herring fleets sail unmolested. The trade convoys arrive without interruption. The North Sea Empire is, at last, precisely what its name always promised: an empire of the sea."
 nd_nse.5.a: "Nous sommes les maîtres des profondeurs du nord"
 STATIC_MODIFIER_NAME_nd_nse_danegeld_extraction: "Extraction de Danegeld"
 STATIC_MODIFIER_DESC_nd_nse_danegeld_extraction: "Un système perfectionné de fiscalité foncière garantit que chaque peau du royaume contribue au trésor royal."
 STATIC_MODIFIER_NAME_nd_nse_danegeld_reinvestment: "Réinvestissement Danegeld"
 STATIC_MODIFIER_DESC_nd_nse_danegeld_reinvestment: "Les recettes fiscales sont réinjectées dans les infrastructures commerciales, enrichissant ainsi le royaume grâce au commerce."
 STATIC_MODIFIER_NAME_nd_nse_leidang_reforged: "Le Leidang reforgé"
 STATIC_MODIFIER_DESC_nd_nse_leidang_reforged: "Un système de prélèvement naval réformé permet une mobilisation rapide des flottes de chaque district côtier de l'empire."
 STATIC_MODIFIER_NAME_nd_nse_heathen_thing_legacy: "L'héritage de la grande chose"
 STATIC_MODIFIER_DESC_nd_nse_heathen_thing_legacy: "Le précédent de la Grande Assemblée a établi une tradition de gouvernance inclusive parmi les divers peuples de l’empire."
 STATIC_MODIFIER_NAME_nd_nse_north_sea_mastery: "Maîtrise de la mer du Nord"
 STATIC_MODIFIER_DESC_nd_nse_north_sea_mastery: "Suprématie navale incontestée sur les eaux du nord, soutenue par la flotte de combat la plus puissante de la région."
 nd_nse_huscarl_tradition: "Huscarl Tradition"
 nd_nse_huscarl_tradition_desc: "The institution of the huscarls, professional household warriors modeled on the legendary Jomsvikings, provides the North Sea Empire with an elite standing infantry force."
 nd_nse_danegeld_system: "Le système Danegeld"
 nd_nse_danegeld_system_desc: "Initialement hommage rendu aux pillards vikings, le Danegeld a été transformé en un impôt foncier sophistiqué administré via le système de comté anglo-saxon."
 nd_nse_dreki_warship: "Le navire de guerre Dreki"
 nd_nse_dreki_warship_desc: "Le navire dragon : le redoutable dreki : est l'expression suprême de l'ingénierie navale nordique : rapide, navigable et terrifiant à voir."
 nd_nse_norse_trade_routes: "Routes commerciales nordiques"
 nd_nse_norse_trade_routes_desc: "Viking-era trade networks spanning from Byzantium to Vinland provide the foundation for North Sea commerce, carried in the broad-beamed knarr."
 nd_nse_thingstead_tradition: "La tradition des choses"
 nd_nse_thingstead_tradition_desc: "The Norse Thing, an assembly of free men for lawmaking and dispute resolution, is institutionalized as a permanent governing body."
 nd_nse_skaldic_heritage: "Héritage Skaldique"
 nd_nse_skaldic_heritage_desc: "La riche tradition de la poésie scaldique nordique, de la sculpture sur pierre runique et de l'histoire orale préserve et célèbre l'identité culturelle de l'empire."
 nd_nse_leidang_origins: "Origines de Leidang"
 nd_nse_leidang_origins_desc: "L'ancien système de prélèvement naval scandinave, exigeant que chaque district côtier fournisse un navire et un équipage, constitue l'épine dorsale des réserves militaires de l'empire."
 nd_nse_snekkja_fleet: "La flotte Snekkja"
 nd_nse_snekkja_fleet_desc: "Les drakkars rapides et agiles, connus sous le nom de snekkjas, constituent l'épine dorsale de la flotte de patrouille et de raid de l'empire, devançant tous les navires en haute mer."
 nd_nse_leidang_reform: "Réforme de Leidang"
 nd_nse_leidang_reform_desc: "L'ancien système de leidang est réformé pour produire le Thingmannalid : une suite permanente de soldats professionnels financés par des impôts permanents."
 nd_nse_jelling_legacy: "L'héritage de Jelling"
 nd_nse_jelling_legacy_desc: "Les grandes pierres runiques de Jelling, érigées par Harald Bluetooth pour marquer la conversion du Danemark au christianisme, symbolisent la capacité de l'empire à relier les traditions païennes et chrétiennes."
 nd_nse_longship_yards_tradition: "Tradition des chantiers de drakkar"
 nd_nse_longship_yards_tradition_desc: "Des installations de construction navale spécialisées utilisant la technique de construction de clinker nordique distinctive produisent des navires d'une navigabilité inégalée."
 nd_nse_north_sea_trade_league: "Ligue commerciale de la mer du Nord"
 nd_nse_north_sea_trade_league_desc: "Un réseau formalisé de partenariats commerciaux à travers la mer du Nord, s’appuyant sur des siècles d’entreprise commerciale viking."
 nd_nse_runestone_legacy: "Héritage des pierres runiques"
 nd_nse_runestone_legacy_desc: "La tradition consistant à élever des pierres runiques sculptées pour commémorer de grands actes et préserver le savoir représente une forme unique d'alphabétisation publique et de mémoire culturelle."
 nd_nse_witan_council: "Le Conseil Witan"
 nd_nse_witan_council_desc: "The Anglo-Saxon Witenagemot, the assembly of wise men, is blended with Norse Thing traditions to create a powerful advisory council for the crown."
 nd_nse_busse_warship: "Le navire de guerre Busse"
 nd_nse_busse_warship_desc: "Le busse est un grand navire de guerre lourdement construit, dérivé du knarr marchand, capable de transporter à la fois des troupes et des armements lourds à travers la mer du Nord."
 nd_nse_great_thing: "La grande chose"
 nd_nse_great_thing_desc: "An empire-wide assembly brings together representatives from every corner of the North Sea realm, establishing precedents for cross-cultural governance."
 nd_nse_cod_stockfish_trade: "Commerce de morue et de stockfish"
 nd_nse_cod_stockfish_trade_desc: "La transformation et l’exportation de morue séchée et de stockfish deviennent la pierre angulaire du commerce en mer du Nord, nourrissant l’Europe tout en enrichissant l’empire."
 nd_nse_stave_church_architecture: "Architecture de l'église en bois debout"
 nd_nse_stave_church_architecture_desc: "Les églises nordiques en bois debout, avec leurs pignons à tête de dragon et leurs sculptures en bois complexes, représentent la fusion unique de la foi chrétienne et de la tradition artistique viking."
 nd_nse_hird_discipline: "Discipline du Hird"
 nd_nse_hird_discipline_desc: "The royal hird, the professional military retinue of the Norse kings, develops rigorous training standards that raise the quality of the empire's standing forces."
 nd_nse_naval_prowess: "Prouesses navales"
 nd_nse_naval_prowess_desc: "Des générations d’expérience en navigation culminent dans une doctrine navale qui combine le matelotage nordique avec une coordination tactique avancée."
 nd_nse_shire_integration: "Intégration Shire"
 nd_nse_shire_integration_desc: "Le système anglo-saxon de gouvernance locale s'étend à travers tout l'empire, assurant une administration uniforme des hauts plateaux écossais jusqu'aux fjords norvégiens."
 nd_nse_north_sea_frigate: "Frégate de la mer du Nord"
 nd_nse_north_sea_frigate_desc: "Des frégates spécialement conçues et optimisées pour les eaux agitées de la mer du Nord et de l'Atlantique, alliant vitesse et puissance de feu nécessaires pour patrouiller de vastes territoires maritimes."
 nd_nse_confessional_unity: "Unité confessionnelle"
 nd_nse_confessional_unity_desc: "La tradition de l'Empire de la mer du Nord, qui consiste à rapprocher les païens et les chrétiens, les catholiques et les protestants, crée une tolérance inhabituelle à l'égard de la diversité religieuse."
 nd_nse_reformed_leidang: "Leidang réformé"
 nd_nse_reformed_leidang_desc: "The medieval naval levy system is modernized into a comprehensive military obligation, producing both sailors for the fleet and soldiers for the army.\n\n#italic Available in: $nd_nse_hirdstova$#!"
 nd_nse_wool_cloth_trade: "Commerce de laine et de tissu"
 nd_nse_wool_cloth_trade_desc: "English wool and Scandinavian dyeing techniques combine to produce cloth that rivals the finest Flemish textiles.\n\n#italic Available in: $nd_nse_longship_yards$#!"
 nd_nse_crown_law_reform: "Réforme du droit de la Couronne"
 nd_nse_crown_law_reform_desc: "Un code juridique unifié s'inspire à la fois de la common law anglo-saxonne et des traditions juridiques scandinaves, renforçant ainsi l'autorité royale à travers l'empire."
 nd_nse_hanseatic_rivalry: "Rivalité hanséatique"
 nd_nse_hanseatic_rivalry_desc: "Competition with the Hanseatic League drives the North Sea Empire to develop its own merchant networks and trade infrastructure.\n\n#italic Available in: $nd_nse_danelaw_mint$#!"
 nd_nse_fortress_harbors: "Ports forteresses"
 nd_nse_fortress_harbors_desc: "Les principaux ports côtiers sont fortifiés par des ouvrages défensifs qui protègent à la fois la flotte et les routes commerciales qui soutiennent l'empire."
 nd_nse_rate_of_line: "Tarif de la ligne"
 nd_nse_rate_of_line_desc: "La construction de navires de ligne massifs marque l’émergence de l’Empire de la mer du Nord en tant que puissance navale de premier ordre, capable de projeter sa force à travers l’Atlantique."
 nd_nse_absolute_thalassocracy: "Thalassocratie Absolue"
 nd_nse_absolute_thalassocracy_desc: "La suprématie navale de l'Empire de la mer du Nord devient totale : aucune flotte n'ose défier nos navires de guerre, et toutes les routes commerciales dans les eaux du nord opèrent sous notre protection."
 nd_nse_navigation_acts: "Actes de navigation"
 nd_nse_navigation_acts_desc: "Législation exigeant que le commerce avec l'empire se fasse sur des navires battant pavillon de l'empire, garantissant ainsi la domination de la marine marchande sur le commerce de la mer du Nord."
 nd_nse_cultural_convergence: "Convergence culturelle"
 nd_nse_cultural_convergence_desc: "Des siècles de gouvernance partagée ont commencé à forger une nouvelle identité à partir des anciennes divisions : ni tout à fait nordique, ni tout à fait anglaise, mais quelque chose de sans précédent."
 nd_nse_imperial_navy_reform: "Réforme de la Marine Impériale"
 nd_nse_imperial_navy_reform_desc: "Une réorganisation complète de la flotte introduit des conceptions de navires standardisées, une formation professionnelle des officiers et un commandement naval centralisé."
 nd_nse_colonial_mandate: "Mandat colonial"
 nd_nse_colonial_mandate_desc: "La portée maritime de l’Empire de la mer du Nord s’étend au-delà des eaux européennes, établissant des colonies et des postes commerciaux de l’autre côté de l’Atlantique."
 nd_nse_constitutional_assembly: "Assemblée constitutionnelle"
 nd_nse_constitutional_assembly_desc: "Un organe législatif permanent représentant les trois royaumes assure la gouvernance constitutionnelle tout en préservant l'unité de la couronne."
 nd_nse_nordhavskorvet: "Nordhavskorvet"
 nd_nse_nordhavskorvet_desc: "Des corvettes rapides et modernes conçues pour patrouiller et faire respecter les lois sur les vastes territoires maritimes de l'empire de la mer du Nord."
 nd_nse_industrial_shipyards: "Chantiers navals industriels"
 nd_nse_industrial_shipyards_desc: "Steam-powered machinery and iron construction techniques transform the empire's shipyards, enabling the rapid production of modern warships.\n\n#italic Available in: $nd_nse_longship_yards$#!"
 nd_nse_north_sea_enlightenment: "Lumières de la mer du Nord"
 nd_nse_north_sea_enlightenment_desc: "Une floraison d’érudition et de recherche scientifique à travers l’empire, s’appuyant sur les traditions intellectuelles combinées de la Scandinavie et de la Grande-Bretagne."
 nd_nse_maritime_insurance: "Assurance Maritime"
 nd_nse_maritime_insurance_desc: "Formalized systems of maritime insurance reduce the financial risk of North Sea trade, encouraging greater commercial investment and longer voyages."
 nd_nse_modern_navy_doctrine: "Doctrine navale moderne"
 nd_nse_modern_navy_doctrine_desc: "Une doctrine navale complète intégrant les dernières tactiques d'artillerie, de signalisation et de flotte garantit le contrôle continu des mers par l'empire."
 nd_nse_free_trade_dominion: "Domination du libre-échange"
 nd_nse_free_trade_dominion_desc: "Le contrôle inégalé de l'empire sur les voies de navigation de la mer du Nord lui permet de dicter les conditions du libre-échange à travers l'Europe du Nord."
 nd_nse_parliamentary_union: "Union parlementaire"
 nd_nse_parliamentary_union_desc: "A unified parliament representing England, Denmark, Norway, and the islands formalizes the constitutional basis of the North Sea Empire."
 a_nd_nse_huscarl: "Huscarl"
 a_nd_nse_huscarl_desc: "Guerriers d'élite issus de la garde personnelle de Cnut, les huscarls sont de redoutables troupes de choc armées de la grande hache danoise. Leur charge dévastatrice brise les formations ennemies, même si leur agressivité berserker les rend vulnérables à une pression morale soutenue."
 a_nd_nse_thingmannalid: "Thingmannalid"
 a_nd_nse_thingmannalid_desc: "Les « Assembly Men » forment la suite disciplinée des rois de la mer du Nord. Entraînés aux manœuvres tactiques rapides, ils frappent avec initiative et précision, même si leur armure plus légère troque la protection contre la vitesse."
 levy_nd_nse_huscarl: "Huscarl Lévy"
 levy_nd_nse_huscarl_desc: "Des guerriers domestiques d'élite armés de haches, issus de la noblesse et des soldats professionnels de l'Empire de la mer du Nord."
 levy_nd_nse_thingmannalid: "Prélèvement de Thingmannalid"
 levy_nd_nse_thingmannalid_desc: "Des soldats disciplinés recrutés dans les classes de paysans et de soldats, formés aux traditions martiales de l'assemblée de Thing."
 levy_nd_nse_leidang: "Leidang"
 levy_nd_nse_leidang_desc: "The ship levy of the coastal districts. Each skipreide owes the king one longship with its crew and two months of provisions."
 n_nd_nse_leidang_ship: "Leidang Ship"
 n_nd_nse_leidang_ship_desc: "A twenty-bench longship furnished, crewed and provisioned by a single ship district for the king's summer fleet. Lighter than a war galley and quick under oar and sail, it carries the district's armed farmers as well as its rowers."
 n_nd_nse_knarr: "Knarr"
 n_nd_nse_knarr_desc: "The broad, deep-hulled trader of the Norse sea roads, built to cross open ocean to Iceland and Greenland under a single square sail. It sails faster and needs fewer hands than a cog, though it carries less."
 n_nd_nse_dreki: "Drek"
 n_nd_nse_dreki_desc: "Le bateau-dragon, avec sa proue sculptée en forme de serpent et son faible tirant d'eau, est le navire de guerre emblématique des Scandinaves : suffisamment rapide pour naviguer sur les rivières, suffisamment navigable pour traverser les océans."
 n_nd_nse_snekkja: "Snekkja"
 n_nd_nse_snekkja_desc: "Le « serpent » : un drakkar agile et rapide, idéal pour les patrouilles, les raids et la reconnaissance sur le vaste territoire maritime de l'empire."
 n_nd_nse_busse: "Busse"
 n_nd_nse_busse_desc: "Grand navire de guerre lourdement construit, issu du marchand knarr, le busse transporte un armement important tout en conservant la navigabilité de la conception navale nordique."
 n_nd_nse_frigate: "Frégate de la mer du Nord"
 n_nd_nse_frigate_desc: "Un navire de guerre spécialement conçu et optimisé pour les conditions difficiles de la mer du Nord, combinant vitesse et armement pour patrouiller efficacement les vastes côtes de l'empire."
 n_nd_nse_rate: "Tarif de la ligne"
 n_nd_nse_rate_desc: "Un navire de ligne massif représentant le summum de l'ingénierie navale de la mer du Nord, hérissé de canons et construit pour résister aux tempêtes les plus féroces de l'Atlantique."
 n_nd_nse_corvette: "Nordhavskorvet"
 n_nd_nse_corvette_desc: "Une corvette moderne conçue pour l'Atlantique Nord : rapide, bien armée et capable d'opérations indépendantes étendues dans les eaux lointaines de l'empire."
 nd_nse_thingstead: "Choses à la place"
 nd_nse_thingstead_desc: "Une salle d'assemblée permanente où les représentants se réunissent pour proclamer des lois, régler des différends et demander des comptes aux dirigeants, dans la tradition nordique."
 nd_nse_longship_yards: "Chantiers de drakkars"
 nd_nse_longship_yards_desc: "Des installations de construction navale spécialisées utilisant la construction de clinker nordique, produisant les navires en état de navigabilité qui sont le nerf de l'empire de la mer du Nord."
 nd_nse_herring_hall: "Salle du hareng"
 nd_nse_herring_hall_desc: "The hall of a fishing town, where the catch of the North Sea herring and cod fisheries is landed, salted, barrelled and sold. The fisheries are the backbone of the empire's maritime commerce."
 nd_nse_danelaw_mint: "Menthe Danelaw"
 nd_nse_danelaw_mint_desc: "Une monnaie royale produisant de la monnaie standardisée, l'instrument fiscal du système fiscal Danegeld qui finance l'empire."
 nd_nse_hirdstova: "Hirdstova"
 nd_nse_hirdstova_desc: "Une salle d'entraînement militaire où le groupe royal - la suite de guerriers professionnels des rois nordiques - perfectionne ses compétences en matière d'armes et de tactique."
 nd_nse_stave_church: "Église en bois debout"
 nd_nse_stave_church_desc: "Une église chrétienne typiquement nordique construite à partir de grandes douves en bois, ornée de sculptures de dragons mêlant le symbolisme chrétien à l'art viking."
 nd_nse_runestone: "Runestone"
 nd_nse_runestone_desc: "A carved and painted memorial stone raised beside a road, a bridge or a thing place, naming the dead and the kin who raised it for every passer-by to read."
 nd_nse_thing_administration: "Administration des objets"
 nd_nse_thing_administration_desc: "Les affaires courantes de gouvernance menées à travers le système d’assemblée traditionnel nordique."
 nd_nse_clinker_shipbuilding: "Construction navale à clinker"
 nd_nse_clinker_shipbuilding_desc: "La technique nordique distinctive consistant à chevaucher des planches calfeutrées avec de la laine et du goudron, produisant des navires d'une flexibilité et d'une navigabilité exceptionnelles."
 nd_nse_norse_weaving: "Tissage de voile nordique"
 nd_nse_norse_weaving_desc: "La production de voiles en laine teintes selon les motifs distinctifs de la flotte de la mer du Nord, combinant la laine anglaise et les traditions de tissage scandinaves."
 nd_nse_industrial_shipbuilding: "Construction navale industrielle"
 nd_nse_industrial_shipbuilding_desc: "Machines à vapeur et techniques de construction en fer appliquées à la construction navale."
 nd_nse_stockfish_processing: "Transformation du stockfish"
 nd_nse_stockfish_processing_desc: "The catch is landed at the hall, salted or dried, and packed in barrels of the town's own coopers for long-distance trade."
 nd_nse_herring_salting: "Salage du hareng"
 nd_nse_herring_salting_desc: "La conservation traditionnelle du hareng en fûts de saumure pour l'exportation dans toute l'Europe."
 nd_nse_silver_minting: "Frappe d'argent"
 nd_nse_silver_minting_desc: "La production de pièces de monnaie en argent standardisées, la monnaie qui sous-tend le système fiscal du Danegeld."
 nd_nse_hanseatic_trade_tools: "Outils de commerce hanséatique"
 nd_nse_hanseatic_trade_tools_desc: "La production d'instruments de pesage de précision et d'outils commerciaux pour concurrencer les normes marchandes hanséatiques."
 nd_nse_mint_administration: "Administration de la Monnaie"
 nd_nse_mint_administration_desc: "Appareil bureaucratique supervisant la production de pièces et empêchant la dépréciation de la monnaie."
 nd_nse_retinue_training: "Continuer la formation"
 nd_nse_retinue_training_desc: "Les exercices martiaux quotidiens et l’entretien de l’équipement de la suite des guerriers professionnels."
 nd_nse_weaponry_forging: "Forge d'armes"
 nd_nse_weaponry_forging_desc: "La production d'armes et d'armures pour les forces militaires professionnelles de l'empire, combinant le travail des métaux nordiques avec les traditions de forge anglaise."
 nd_nse_woodcarving_tradition: "Tradition de la sculpture sur bois"
 nd_nse_woodcarving_tradition_desc: "La tradition nordique complexe du travail du bois décoratif a produit des meubles sculptés qui mélangent l'iconographie chrétienne avec des motifs artistiques païens."
 nd_nse_parish_upkeep: "Entretien de la paroisse"
 nd_nse_parish_upkeep_desc: "L'entretien courant et les fournitures liturgiques pour les services religieux de l'église en bois debout."
 nd_nse_runestone_upkeep: "Stone Carving"
 nd_nse_runestone_upkeep_desc: "Stone for new memorials, chisels for the carver, and red and black paint to keep the runes legible."
 nd_nse_formed_tt: "Formed the #bold North Sea Empire#!"
 nd_nse_path_a_tt: "Choisissez le destin#bold Whale Road#!"
 nd_nse_path_b_tt: "Choisissez le destin#bold de la Couronne des Trois Royaumes#!"
 nd_nse_dest_thingsteads_tt: "A #bold Thingstead#! stands in at least #bold 3#! of our locations"
 nd_nse_dest_kobenhavn_developed_tt: "We own #bold Copenhagen#! and its development is at least #bold 31#!"
 nd_nse_dest_london_developed_tt: "We own #bold London#! and its development is at least #bold 75#!"
 nd_nse_destiny: "Destin de la mer du Nord"
 nd_nse_destiny_desc: "L'empire qui s'étend sur trois royaumes et contrôle la plus grande mer du monde connu se trouve à la croisée des chemins. Quel sera son destin ?"
 nd_nse_dest_channel: "Maîtrise de la Manche"
 nd_nse_dest_channel_desc: "Prenez le contrôle des grandes villes commerçantes des Pays-Bas. Bruges et Amsterdam sont les clés du commerce de l’Europe du Nord : entre nos mains, elles financeront un empire bâti sur le commerce."
 nd_nse_dest_hansa: "Assujettissement hanséatique"
 nd_nse_dest_hansa_desc: "La Ligue hanséatique domine depuis trop longtemps le commerce en mer du Nord. Lübeck et Hambourg doivent se mettre à genoux. Leurs flottes marchandes serviront notre couronne ou seront balayées des mers."
 nd_nse_dest_atlantic: "Thalassocratie Atlantique"
 nd_nse_dest_atlantic_desc: "La récompense ultime : le contrôle des approches de l'Atlantique. Avec Rouen et Lisbonne à notre portée, aucun navire ne navigue entre la Méditerranée et la Baltique sans notre autorisation. L’Empire de la mer du Nord devient l’arbitre du commerce mondial."
 nd_nse_dest_crown: "Consolidation du royaume"
 nd_nse_dest_crown_desc: "Before the empire can expand, it must be unified. Let a Thingstead sit in three towns, hold Nidaros where Saint Olaf lies and the kings of Norway are hailed, and build Copenhagen up from a bishop's harbour town into a royal seat on the Sound, so that each of the three kingdoms answers to one law."
 nd_nse_dest_eastern: "La marche de l'Est"
 nd_nse_dest_eastern_desc: "The Varangians once sailed east to build kingdoms among the Slavs. Now the North Sea Empire shall follow in their wake: take Oreshek at the head of the Neva, Staraya Ladoga where the Norse first settled, and Novgorod itself, and the river road to the east is ours."
 nd_nse_dest_imperium: "Impérial du Nord"
 nd_nse_dest_imperium_desc: "Paris, the jewel of Western Christendom, must acknowledge northern supremacy. With the French capital under our control and London grown to twice its old size, the North Sea Empire becomes the undisputed power of Europe."
 nd_nse.6.t: "Un destin prend forme"
 nd_nse.6.d: "The North Sea Empire has proven its stability and endurance. What began as an ambitious union of crowns has become a true nation, recognized by its neighbors and feared by its rivals. The foundations are laid. Now the question is what to build upon them.\n\nOur advisors point to the great map in the council chamber, where the blue expanse of our inner sea dominates the center. To the south lie the rich trading cities of Flanders and the Hanse. To the east, the vast forests and rivers where the Varangians once carved kingdoms from the wilderness. The empire's future lies in the direction we choose to march."
 nd_nse.6.a: "Notre destin attend"
 nd_nse.7.t: "La Manche tombe sous notre ombre"
 nd_nse.7.d: "The great trading cities of the Low Countries, Bruges with its cloth halls and Amsterdam with its warehouses, now fly our banner. The narrowest and busiest stretch of water in northern Europe has become our toll gate. Every bolt of Flemish cloth, every barrel of Rhenish wine, every cargo of Baltic timber that passes through the Channel now enriches our treasury.\n\nThe merchants of these cities, once fiercely independent, have discovered that the protection of the North Sea Empire's fleet is worth the price of submission. Our customs officers sit in their counting houses, and our warships patrol the approaches."
 nd_nse.7.a: "La Manche est notre marché"
 nd_nse.8.t: "La chute de la Ligue hanséatique"
 nd_nse.8.d: "Lubeck, that proud city that styled itself Queen of the Hanse, has fallen. Hamburg, the gateway to the interior of Germany, flies our colors. The Hanseatic League, for centuries the dominant commercial power of the North Sea and Baltic, has been broken as an independent force.\n\nTheir warehouses and counting houses, their ships and their trade routes, their accumulated knowledge of markets from Novgorod to London: all of it now passes into our hands. The question is what to do with this inheritance.\n\nWe can absorb their networks quietly, inheriting their merchant contacts and trade intelligence to build our own commercial empire even greater than theirs. Or we can crush them utterly, enforcing our monopoly on North Sea trade with an iron fist and eliminating any future competition."
 nd_nse.8.a: "Absorber leurs réseaux commerciaux"
 nd_nse.8.b: "Renforcer notre monopole par la force"
 nd_nse.9.t: "Seigneurs de l'Atlantique"
 nd_nse.9.d: "With Rouen in Normandy and Lisbon on the Tagus under our control, the North Sea Empire has achieved something unprecedented: dominion over the entire Atlantic seaboard from the Arctic to the Mediterranean approaches. No ship can enter or leave the great ocean without passing through waters we command.\n\nThe wealth of the New World, the spice trade, the African gold coast, all the great commercial arteries of the age flow through channels we control. This is the ultimate expression of thalassocratic power.\n\nWe can use this position to open the Atlantic to free commerce under our protection, building infrastructure and inviting trade. Or we can assert total control, making every merchant fleet dependent on our goodwill and every naval power subordinate to our admiralty."
 nd_nse.9.a: "Ouvrir l'Atlantique au libre-échange"
 nd_nse.9.b: "Affirmez une domination totale sur toutes les routes"
 nd_nse.10.t: "Le royaume consolidé"
 nd_nse.10.d: "The dream of three kingdoms united under one law has moved from aspiration to reality. The institutions of governance (the shire courts and Thing assemblies, the royal chancellery and the church hierarchy) now function as a single system from the Shetlands to Jutland, from Dublin to Uppsala.\n\nNidaros keeps the shrine of Saint Olaf under our banner, and Copenhagen has grown from a harbour town into a royal seat on the Sound. Markets operate under uniform regulations, and the king's writ runs unchallenged in every province. The foundation has been laid for something greater: an empire that can project power far beyond its original borders."
 nd_nse.10.a: "Les trois royaumes ne font vraiment qu'un"
 nd_nse.11.t: "La marche de l’Est établie"
 nd_nse.11.d: "Novgorod, the great trading city of the East, has fallen to our armies, and with it Ladoga and the fortress at the head of the Neva. The Varangian dream has been fulfilled at last: the route from Scandinavia to the Byzantine frontier is once again under Norse control. Where Rurik and his companions once came as adventurers, we come as conquerors.\n\nThe eastern frontier stretches before us, vast and full of possibility. We can press forward aggressively, using Novgorod as a launching point for further expansion into the Russian heartland. Or we can consolidate this gain, fortifying the eastern frontier and building it into an impregnable bastion that secures our flank while we develop the interior."
 nd_nse.11.a: "Appuyez sur l'avance vers l'est"
 nd_nse.11.b: "Fortifier et consolider la frontière"
 nd_nse.12.t: "Imperium du Nord proclamé"
 nd_nse.12.d: "Paris has fallen. The most prestigious city in Western Christendom, the seat of the Capetian kings, the heart of medieval learning and culture: it is ours. With this conquest, the North Sea Empire has transcended its origins as a maritime union and become the dominant power of the European continent.\n\nThe realm now stretches from the Arctic wastes of Greenland to the banks of the Seine, from the forests of Novgorod to the coasts of Ireland. No empire since Rome has commanded such a vast and diverse territory in Europe.\n\nThe question of how to govern this colossus admits of two answers. We can rule through overwhelming military force, subjugating all resistance and extracting the wealth of conquered provinces. Or we can seek to harmonize the diverse peoples of the empire, integrating them through law and shared governance into a true universal monarchy."
 nd_nse.12.a: "Soumettez tous ceux qui résistent"
 nd_nse.12.b: "Harmoniser les peuples de l'empire"
 STATIC_MODIFIER_NAME_nd_nse_dest_channel_networks: "Réseaux commerciaux hanséatiques"
 STATIC_MODIFIER_DESC_nd_nse_dest_channel_networks: "Les renseignements commerciaux absorbés et les contacts marchands de l'ancienne Ligue hanséatique alimentent notre expansion commerciale."
 STATIC_MODIFIER_NAME_nd_nse_dest_channel_monopoly: "Monopole de la mer du Nord"
 STATIC_MODIFIER_DESC_nd_nse_dest_channel_monopoly: "Ruthless enforcement of our trade monopoly eliminates competition and bends rival merchants to our will, and every neighbour resents it."
 STATIC_MODIFIER_NAME_nd_nse_dest_atlantic_trade: "Libre-échange atlantique"
 STATIC_MODIFIER_DESC_nd_nse_dest_atlantic_trade: "Les politiques commerciales ouvertes attirent des marchands des quatre coins du monde, finançant des projets de construction massifs à travers l’empire."
 STATIC_MODIFIER_NAME_nd_nse_dest_atlantic_dominion: "Domination atlantique"
 STATIC_MODIFIER_DESC_nd_nse_dest_atlantic_dominion: "Le contrôle total des routes commerciales de l'Atlantique permet à l'empire d'intégrer des territoires lointains tout en conservant un établissement militaire chevronné."
 STATIC_MODIFIER_NAME_nd_nse_dest_march_east: "Offensive de l'Est"
 STATIC_MODIFIER_DESC_nd_nse_dest_march_east: "L'élan de la campagne de l'Est fait avancer les armées de l'empire à grande vitesse, même si le coût des mercenaires augmente à chaque nouvelle frontière."
 STATIC_MODIFIER_NAME_nd_nse_dest_fortify: "Bastion Frontière"
 STATIC_MODIFIER_DESC_nd_nse_dest_fortify: "La frontière orientale est fortifiée pour former une ligne défensive imprenable, protégeant le flanc de l'empire contre tout venant."
 STATIC_MODIFIER_NAME_nd_nse_dest_subjugate: "Soumission impériale"
 STATIC_MODIFIER_DESC_nd_nse_dest_subjugate: "Les provinces conquises sont mises au pas par la force militaire, leurs richesses étant extraites pour les coffres de l'empire au prix du mécontentement des nobles."
 STATIC_MODIFIER_NAME_nd_nse_dest_harmonize: "Des peuples harmonisés"
 STATIC_MODIFIER_DESC_nd_nse_dest_harmonize: "Une politique d'intégration culturelle et de gouvernance partagée lie les divers peuples de l'empire, même si les efforts visant à maintenir l'harmonie interne sapent la volonté de guerres prolongées."
 nd_nse_admiralty_house: "Maison de l'Amirauté"
 nd_nse_admiralty_house_desc: "Le quartier général suprême de l'administration navale de l'Empire de la mer du Nord, coordonnant la flotte la plus puissante du monde atlantique."
 nd_nse_imperial_chancery: "Chancellerie Impériale"
 nd_nse_imperial_chancery_desc: "Le cœur administratif de l'Imperium du Nord, où les lois sont rédigées en trois langues et expédiées aux quatre coins du royaume."
 nd_nse_admiralty_operations: "Opérations de l'Amirauté"
 nd_nse_admiralty_operations_desc: "Les opérations quotidiennes de l'amirauté de la mer du Nord, la coordination des mouvements de la flotte et des horaires des convois commerciaux."
 nd_nse_chancery_administration: "Administration de la chancellerie"
 nd_nse_chancery_administration_desc: "Le vaste appareil bureaucratique de la chancellerie impériale, traitant les édits et la correspondance entre trois royaumes."

 # ===== BUREAUCRACIES =====
 nse_hird_witherlogh_bureaucracy: "Hird et Witherlogh"
 nse_hird_witherlogh_bureaucracy_desc: "Le corps de la maison royale, composé de trois à quatre mille guerriers professionnels que Cnut retint de sa flotte d'invasion de 1018, était régi par le Witherlogh - la Lex Castrensis enregistrée par Svend Aggesen, mêlant la coutume nordique des serviteurs à la procédure du droit canonique. Le troisième ne répondait qu'au roi, sans passer par les comtes et les ealdormen des comtés ; Les règlements de Cnut exigeaient que chaque housecarl porte une splendide armure et une épée à double tranchant à poignée dorée."
 nse_heregeld_bureaucracy: "Heregeld"
 nse_heregeld_bureaucracy_desc: "La taxe militaire annuelle s'appuyait sur le précédent de la taxe maritime de 1012 et était célèbre pour 72 000 livres d'argent des comtés plus 10 500 de Londres en 1018, puis collectée chaque année jusqu'en 1051. Évaluée sur la peau et appliquée par confiscation des terres au préfet du comté, le heregeld exigeait des registres de tenure précis qui anticipaient l'enquête Domesday d'un demi-siècle."
 nse_witenagemot_bureaucracy: "Witenagemot"
 nse_witenagemot_bureaucracy_desc: "Le conseil anglo-saxon des sages : archevêques, évêques, abbés, ealdormen et hauts thegns : était convoqué au gré du roi pour consentir aux lois et attester des subventions. L'adhésion de Cnut à Oxford en 1018, où Danois et Anglais acceptèrent conjointement les lois d'Edgar Ier, fut scellée par cet organe. Les lois de Cnut, rédigées par Wulfstan d'York entre 1020 et 1023, furent promulguées par son intermédiaire."
 nse_wapentake_riding_bureaucracy: "Wapentake et l'équitation"
 nse_wapentake_riding_bureaucracy_desc: "Les cent cours du Danelaw, où le wapentake (la prise d'armes, la confirmation par les bras levés) remplaçait les cent du sud et la circonscription (thrithjungr, troisième partie) divisait les grands comtés du nord du Yorkshire, Lindsey et Lincoln. Douze carucates pour cent obtenaient l’évaluation hongre, et les sokemen (entre trente et cinquante pour cent de la population rurale de l’est de l’Angleterre) détenaient des libertés intermédiaires inconnues au sud de la Tamise."
 nse_skipreida_leidang_bureaucracy: "Skipreia Leidang"
 nse_skipreida_leidang_bureaucracy_desc: "The Scandinavian coastal levy of ship-districts first attested at the Battle of Hjorungavagr in 985 and reorganised under Haakon the Good. Each skipreide outfitted, crewed, and provisioned a single warship for two to three months. Cnut wove this fleet-conscription together with the Anglo-Saxon ship-soke, the duty of inland shires to fund coastal vessels, giving his federation a unified naval apparatus that drew on both shores of the North Sea."
 nse_anglo_danish_mission_bureaucracy: "Mission anglo-danoise"
 nse_anglo_danish_mission_bureaucracy_desc: "L'instrument de Cnut pour évangéliser la moitié scandinave de son empire, ancré sur Wulfstan, archevêque d'York. À partir du pèlerinage romain de 1027, des évêques formés en Angleterre furent envoyés dans les nouveaux sièges du nord : Bernhard en Skania, Gerbrand à Roskilde et Ranier en Fyn. La mission était un contre-pied délibéré aux prétentions de Hambourg-Brême sur l'Église danoise, liant l'autorité royale aux évêchés de Lund à Trondheim."
 nse_reformed_coinage_bureaucracy: "Monnaie réformée"
 nse_reformed_coinage_bureaucracy_desc: "Le régime monétaire anglo-saxon tardif des monnayeurs royaux nommés opérant à partir de douze hôtels de monnaie désignés, codifié par le code 928 d'Aethelstan et renforcé par la grande réforme d'Edgar et les refontes périodiques d'Aethelred. Chaque centime portait le nom et le lieu de frappe du monnayeur ; les renouvellements forcés de l'étalon d'argent ont permis à la Couronne d'écrémer le seigneuriage. Sous Cnut, le système fut étendu à travers le Sound, semant les premières pièces d'argent régulières frappées à Lund et Sigtuna."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_nse_bureaucracy_authority: "Autorité bureaucratique de l'Empire de la mer du Nord"
 AUTO_MODIFIER_DESC_nd_nse_bureaucracy_authority: "The North Sea Empire keeps the offices of Cnut's Anglo-Danish state: the hird, the heregeld, the council of the wise and the ship districts of both shores. It can sustain four standing institutions of its own."
