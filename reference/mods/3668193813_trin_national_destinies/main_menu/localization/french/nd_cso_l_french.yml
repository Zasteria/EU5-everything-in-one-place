l_french:
 STATIC_MODIFIER_NAME_nd_cso_maritime_supremacy: "Trésor des mers du Sud"
 STATIC_MODIFIER_DESC_nd_cso_maritime_supremacy: "Avec Hangzhou comme capitale étincelante, la Song restaurée possède le plus grand réseau commercial maritime du monde connu, ses ports regorgeant de jonques transportant de la soie, de la porcelaine et du thé vers chaque rivage."
 STATIC_MODIFIER_NAME_nd_cso_confucian_meritocracy: "Mandat du pinceau"
 STATIC_MODIFIER_DESC_nd_cso_confucian_meritocracy: "La restauration Song place l’érudition au-dessus de tout. Grâce à des examens civils rigoureux et à la sagesse de la philosophie néo-confucéenne, le royaume est gouverné par les érudits plutôt que par les puissants."
 STATIC_MODIFIER_NAME_nd_cso_paper_money_expansion: "Prolifération monétaire"
 STATIC_MODIFIER_DESC_nd_cso_paper_money_expansion: "Le papier-monnaie circule librement sur les marchés Song, lubrifiant le commerce et enrichissant les marchands de tout le Yangtsé."
 STATIC_MODIFIER_NAME_nd_cso_paper_money_regulation: "Discipline fiscale"
 STATIC_MODIFIER_DESC_nd_cso_paper_money_regulation: "Une réglementation minutieuse du papier-monnaie prévient l'inflation et renforce les réserves du Trésor."
 STATIC_MODIFIER_NAME_nd_cso_yangtze_offensive: "Dragons de rivière libérés"
 STATIC_MODIFIER_DESC_nd_cso_yangtze_offensive: "La flotte Song frappe depuis le Yangtsé, les roues à aubes tournent et les bombes tonnerres tombent sur l'ennemi comme de la grêle."
 STATIC_MODIFIER_NAME_nd_cso_yangtze_consolidation: "Le mur de la rivière"
 STATIC_MODIFIER_DESC_nd_cso_yangtze_consolidation: "Le Yangtsé devient une barrière infranchissable, des positions fortifiées et des flottes de patrouilles interdisant tout passage aux envahisseurs du Nord."
 STATIC_MODIFIER_NAME_nd_cso_zhuxi_orthodoxy: "L'ascendant des quatre livres"
 STATIC_MODIFIER_DESC_nd_cso_zhuxi_orthodoxy: "Les commentaires de Zhu Xi deviennent le fondement de tout apprentissage, unifiant le royaume sous une seule philosophie morale."
 STATIC_MODIFIER_NAME_nd_cso_zhuxi_pragmatism: "L'enquête sur les choses"
 STATIC_MODIFIER_DESC_nd_cso_zhuxi_pragmatism: "L'accent néoconfucéen mis sur le gewu, l'investigation des choses, stimule l'érudition pratique et l'efficacité administrative."
 nd_cso.1.t: "Restauration de la chanson"
 nd_cso.1.d: "The banners of the Song fly once more over Hangzhou. Where the dynasty once retreated south before the Jurchen onslaught, it now commands the wealthiest and most sophisticated realm in the world. The Yangtze valley teems with commerce, its cities dwarf any in Europe, and its innovations in paper money, gunpowder, and printing have no equal.\n\nBut the Song faces a choice that has defined it since its founding: what kind of power shall it be? The empire's strength has always lain not in its armies but in its merchants and scholars. Will the restored dynasty build upon its unrivaled maritime commerce, or turn inward to perfect the Neo-Confucian bureaucracy that makes governance itself an art?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cso.1.a: "Nos navires transporteront les richesses des Song dans toutes les mers."
 nd_cso.1.b: "La salle d'examen est le fondement de l'empire."
 nd_cso.2.t: "La révolution du papier-monnaie"
 nd_cso.2.d: "In the markets of Hangzhou and Chengdu, merchants exchange slips of paper backed by the Song treasury, the world's first government-issued paper currency, the jiaozi. What began as private merchant drafts has become a revolution in finance. The printing bureaus at Huizhou and Hangzhou employ over a thousand workers each, producing the currency that lubricates a commercial economy of unprecedented scale.\n\nYet paper money is a double-edged sword. Too much in circulation breeds inflation and erodes trust. Too little starves commerce of the liquidity it needs to thrive. The court must decide: expand the money supply to fuel trade, or impose strict regulation to preserve fiscal stability?"
 nd_cso.2.a: "Imprimez plus de devises : le commerce doit circuler librement."
 nd_cso.2.b: "Réguler l’offre : la stabilité avant tout."
 nd_cso.3.t: "Tonnerre sur le Yangtsé"
 nd_cso.3.d: "At the Battle of Caishi in 1161, Song paddle-wheel warships ambushed a far larger Jin transport fleet on the Yangtze. Thundercrash bombs launched from deck-mounted trebuchets shattered the enemy vessels while Song oarsmen drove their paddle-wheeled craft through the wreckage at speeds no conventional galley could match. The Jin force was annihilated, and the Yangtze line held.\n\nThis victory proves that innovation trumps numbers. Our naval engineers have mastered the paddle-wheel mechanism, producing vessels that can navigate upriver against the current, maneuver in narrow channels, and close rapidly on enemy ships. The question now is how to exploit this advantage."
 nd_cso.3.a: "Construisez une flotte offensive pour mener la guerre vers le nord."
 nd_cso.3.b: "Fortifiez le Yangtze : rendez notre cœur du pays invulnérable."
 nd_cso.4.t: "La synthèse de Maître Zhu"
 nd_cso.4.d: "The philosopher Zhu Xi has completed his monumental commentaries on the Four Books of the Confucian tradition, the Analects, the Mencius, the Great Learning, and the Doctrine of the Mean. His synthesis of earlier Neo-Confucian thought into a coherent philosophical system emphasizes li (principle) as the ordering force of the cosmos, and gewu (investigation of things) as the path to understanding.\n\nZhu Xi's work will reshape Chinese intellectual life for centuries. His commentaries can become the orthodox foundation of the examination system, producing officials steeped in moral philosophy, or his emphasis on investigation can be channeled toward practical governance and empirical inquiry."
 nd_cso.4.a: "Faites des Quatre Livres l’unique fondement de l’apprentissage."
 nd_cso.4.b: "Encouragez l’investigation des choses dans tous les domaines."
 nd_cso.5.t: "La lance à feu prend forme"
 nd_cso.5.d: "Song alchemists and military engineers have perfected the fire lance, a bamboo or metal tube packed with gunpowder and projectiles, mounted on a spear shaft. In battle, the operator ignites the charge, sending a gout of flame and metal fragments into the enemy ranks before engaging with the spear. It is terrifying, devastating, and unlike anything the world has seen.\n\nThe Wujing Zongyao, our comprehensive military manual, records the formulas for gunpowder mixtures of varying strength. Fire lances are now being issued to infantry units stationed along the Yangtze defenses, giving Song soldiers a decisive advantage in close combat against superior northern cavalry."
 nd_cso.5.a: "La lance à feu deviendra notre arme phare."
 nd_cso.6.t: "Types mobiles et mots imprimés"
 nd_cso.6.d: "The artisan Bi Sheng has devised a method of printing using individual ceramic characters arranged on an iron plate, coated in a mixture of pine resin and wax. When heated, the characters set firm; when cooled, they can be rearranged for the next page. Though woodblock printing remains dominant for large runs, Bi Sheng's movable type opens the possibility of printing any text without the expense of carving entire blocks.\n\nAlready the printing houses of Hangzhou produce more books in a single year than most kingdoms possess in their entire libraries. This technology, combined with Song paper-making expertise, is creating the most literate society the world has ever known."
 nd_cso.6.a: "La connaissance sera le fondement du pouvoir des Song."
 nd_cso_paddle_wheel_fleet: "Tradition des roues à aubes"
 nd_cso_paddle_wheel_fleet_desc: "La marine Song a été la pionnière des navires de guerre à roues à aubes, entraînés par des tapis roulants, capables d'une vitesse et d'une maniabilité remarquables sur les rivières et les eaux côtières."
 nd_cso_jiaozi_system: "Système monétaire Jiaozi"
 nd_cso_jiaozi_system_desc: "Le premier papier-monnaie émis par un gouvernement au monde, permettant une économie commerciale d'une ampleur sans précédent."
 nd_cso_iron_smelting: "Industrie du fer de la chanson"
 nd_cso_iron_smelting_desc: "En 1078, la Chine Song produisait 125 000 tonnes de fer par an, soit six fois plus en utilisant des hauts fourneaux alimentés au charbon."
 nd_cso_civilian_supremacy: "Suprématie civile"
 nd_cso_civilian_supremacy_desc: "Le principe Song du wen sur wu, l’autorité civile sur l’armée, créant l’État bureaucratique le plus sophistiqué de son époque."
 nd_cso_river_navy_levy: "Prélèvements de la marine fluviale"
 nd_cso_river_navy_levy_desc: "Les Song maintinrent une marine fluviale permanente à partir de 1132, la première marine permanente de l'histoire chinoise, composée de marins fluviaux enrôlés."
 nd_cso_yangtze_defense: "Ligne de défense du Yangtsé"
 nd_cso_yangtze_defense_desc: "Le grand fleuve servait de principale barrière défensive des Song du Sud, fortifiée de garnisons, de balises de signalisation et de flottes de patrouille."
 nd_cso_fire_lance_corps: "Corps de Lance du Feu"
 nd_cso_fire_lance_corps_desc: "Les soldats Song brandissant des lances à feu, des lances chargées de poudre qui projetaient des flammes et des éclats d'obus, représentaient la première infanterie à poudre au monde."
 nd_cso_fire_lance_levies: "Prélèvements de lances à feu"
 nd_cso_fire_lance_levies_desc: "Des troupes de lances à feu enrôlées issues de la population générale, apportant les premières armes à poudre au système de prélèvement Song."
 nd_cso_movable_type: "Impression à caractères mobiles"
 nd_cso_movable_type_desc: "L'invention par Bi Sheng des caractères mobiles en céramique vers 1040 a révolutionné la production de livres et a fait de la Chine Song la société la plus alphabétisée de la planète."
 nd_cso_zhuxi_synthesis: "Synthèse néo-confucéenne"
 nd_cso_zhuxi_synthesis_desc: "Les commentaires de Zhu Xi sur les Quatre Livres ont unifié la philosophie néo-confucéenne et sont devenus le fondement intellectuel de la gouvernance chinoise pendant sept siècles."
 nd_cso_commercial_revolution: "Révolution commerciale"
 nd_cso_commercial_revolution_desc: "La transformation économique des Song, d'un État tributaire agricole à une puissance commerciale, entraînée par l'urbanisation, le papier-monnaie et le commerce maritime."
 nd_cso_tea_trade: "Réseaux commerciaux de thé"
 nd_cso_tea_trade_desc: "Le thé est devenu le produit commercial le plus important de la dynastie Song, les maisons de thé agréées par le gouvernement servant de plaques tournantes pour le commerce et les échanges culturels."
 nd_cso_tower_ships: "Construction de navires-tours"
 nd_cso_tower_ships_desc: "Navires de guerre blindés à plusieurs ponts transportant des centaines de soldats et des trébuchets montés sur le pont, dominant la guerre fluviale et côtière."
 nd_cso_thundercrash_weapons: "Armes de tonnerre"
 nd_cso_thundercrash_weapons_desc: "Bombes à poudre à enveloppe en fer lancées à partir de trébuchets, du nom du son terrifiant qu'elles produisaient, une des premières formes d'artillerie explosive."
 nd_cso_compass_navigation: "Navigation par boussole"
 nd_cso_compass_navigation_desc: "Les marins Song ont été les premiers à utiliser le compas magnétique pour la navigation maritime, permettant ainsi des voyages océaniques fiables vers l'Asie du Sud-Est et au-delà."
 nd_cso_porcelain_mastery: "Maîtrise de l'exportation de la porcelaine"
 nd_cso_porcelain_mastery_desc: "Le céladon Song et la porcelaine blanche sont devenus les produits de luxe les plus recherchés en Asie et dans le monde de l’océan Indien."
 nd_cso_legal_codification: "Codification juridique"
 nd_cso_legal_codification_desc: "Révision et compilation systématiques des codes juridiques Song, créant l'un des systèmes juridiques les plus complets du monde médiéval."
 nd_cso_maritime_silk_route: "Route maritime de la soie"
 nd_cso_maritime_silk_route_desc: "Les routes terrestres étant coupées par les puissances hostiles des steppes, les marchands Song établirent des routes commerciales maritimes transportant de la soie, de la porcelaine et du thé à travers l'océan Indien."
 nd_cso_ironclad_vessels: "Roues à aubes en fer"
 nd_cso_ironclad_vessels_desc: "En 1203, les ingénieurs Song blindaient les navires de guerre à roues à aubes avec des plaques de fer, créant ainsi les premiers navires blindés au monde."
 nd_cso_trade_junk_fleet: "Flotte commerciale de Hangzhou"
 nd_cso_trade_junk_fleet_desc: "Des jonques rapides et navigables basées à Hangzhou, combinant capacité de fret marchand et armement défensif pour le commerce maritime à longue distance."
 nd_cso_iron_bombs: "Bombes à enveloppe en fer"
 nd_cso_iron_bombs_desc: "La transition des bombes à poudre à coque souple aux bombes à poudre à enveloppe en fer a considérablement augmenté leur létalité et leur rayon d'explosion."
 nd_cso_waterway_mastery: "Maîtrise des voies navigables"
 nd_cso_waterway_mastery_desc: "La maîtrise des canaux, des écluses et du transport fluvial par les Song a créé un réseau commercial interne inégalé dans le monde."
 nd_cso_examination_reform: "Réforme des examens"
 nd_cso_examination_reform_desc: "Extension et perfectionnement du système d'examen de la fonction publique, élargissant l'accès à la fonction publique sur la seule base du mérite."
 nd_cso_rice_intensification: "Intensification des rizières"
 nd_cso_rice_intensification_desc: "L’introduction de variétés de riz Champa à maturation précoce et de techniques de double culture a considérablement augmenté la production alimentaire dans la vallée du Yangtsé."
 nd_cso_naval_supremacy: "Suprématie navale de la chanson"
 nd_cso_naval_supremacy_desc: "L'aboutissement de siècles d'innovation navale (roues à aubes, armement à poudre, revêtement en fer) établissant une domination incontestée sur l'eau."
 nd_cso_monetary_policy: "Politique monétaire avancée"
 nd_cso_monetary_policy_desc: "Gestion sophistiquée de l'approvisionnement en papier-monnaie, des taux d'intérêt et des réserves gouvernementales, pionnière en matière de pratiques fiscales modernes."
 nd_cso_industrial_iron: "Forges industrielles"
 nd_cso_industrial_iron_desc: "Expansion of coal-fired blast furnaces to industrial scale, producing steel for weapons, tools, and infrastructure across the realm.\n\n#italic Available in: $nd_cso_iron_foundry$#!"
 nd_cso_literary_tradition: "Compilations littéraires"
 nd_cso_literary_tradition_desc: "La tradition Song des compilations encyclopédiques, préservant et systématisant les connaissances dans tous les domaines, de l'astronomie à l'agriculture."
 nd_cso_coastal_defense: "Modernisation de la défense côtière"
 nd_cso_coastal_defense_desc: "Fortification de la côte sud avec des batteries, des tours de guet et des flottes de patrouille pour protéger le commerce maritime Song."
 nd_cso_industrial_modernization: "Modernisation industrielle"
 nd_cso_industrial_modernization_desc: "Application des traditions d'ingénierie Song à la production industrielle moderne, à la mécanisation des ateliers et à l'expansion de la production."
 nd_cso_maritime_modernization: "Modernisation maritime"
 nd_cso_maritime_modernization_desc: "Modernisation de la flotte marchande et navale Song, intégrant les progrès de la construction navale et de la technologie de navigation."
 nd_cso_constitutional_reform: "Réforme constitutionnelle"
 nd_cso_constitutional_reform_desc: "Formalisation de la tradition méritocratique Song en principes constitutionnels de gouvernance et d’État de droit."
 nd_cso_modern_education: "Système éducatif moderne"
 nd_cso_modern_education_desc: "Transformation du système académique néo-confucéen en un réseau éducatif moderne, maintenant la tradition Song d’alphabétisation universelle."
 nd_cso_delta_industry: "Industrie du Delta du Yangtsé"
 nd_cso_delta_industry_desc: "Le delta du Yangtsé, déjà la région la plus productive de la planète, devient le moteur d’une économie industrielle moderne."
 n_nd_cso_paddle_warship: "Navire de guerre à roues à aubes"
 n_nd_cso_paddle_warship_desc: "Un vaisseau propulsé par un tapis roulant d'une vitesse remarquable, armé de trébuchets montés sur le pont pour lancer des bombes à poudre. Les bateaux à aubes Song pouvaient déjouer les manœuvres de n'importe quelle galère contemporaine."
 n_nd_cso_paddle_warship_levy: "Navire de guerre à roues à aubes"
 n_nd_cso_paddle_warship_levy_desc: "Un navire à roues à aubes enrôlé de la flotte de la rivière Song."
 a_nd_cso_fire_lance: "Infanterie de lances de feu"
 a_nd_cso_fire_lance_desc: "Des soldats d'élite brandissant des lances à feu, des tubes remplis de poudre à canon montés sur des tiges de lance qui projettent des flammes et des éclats d'obus avant que le porteur ne se rapproche de la mêlée. Une arme terrifiante unique à la guerre des Song."
 a_nd_cso_fire_lance_levy: "Milice de lances de feu"
 a_nd_cso_fire_lance_levy_desc: "Infanterie enrôlée équipée de lances à feu, apportant des armes à poudre au système de prélèvement Song."
 n_nd_cso_tower_ship: "Navire-tour"
 n_nd_cso_tower_ship_desc: "Un navire de guerre blindé à plusieurs ponts transportant des centaines de soldats et des trébuchets montés sur le pont. Les navires-tours dominaient les combats fluviaux et côtiers grâce à leur taille et à leur puissance de feu."
 a_nd_cso_thundercrash: "Bombardier Thundercrash"
 a_nd_cso_thundercrash_desc: "Les premières artilleries à poudre lançaient des bombes explosives à enveloppe en fer avec un effet dévastateur. Nommé pour le fracas terrifiant de leur détonation."
 n_nd_cso_ironclad_galley: "Cuisine blindée"
 n_nd_cso_ironclad_galley_desc: "Un navire de guerre à roues à aubes blindé de plaques de fer rivetées, combinant la vitesse d'une galère avec une protection sans précédent contre les tirs ennemis."
 n_nd_cso_trade_junk: "Jonque commerciale de Hangzhou"
 n_nd_cso_trade_junk_desc: "Un navire marchand rapide et navigable en provenance de Hangzhou, armé pour se défendre sur la route maritime de la soie. Ces jonques transportaient des marchandises Song jusqu'en Afrique de l'Est."
 nd_cso_iron_foundry: "Fonderie de fer Song"
 nd_cso_iron_foundry_desc: "Un complexe de hauts fourneaux alimentés au charbon produisant du fer et de l'acier à l'échelle industrielle. En 1078, les fonderies Song produisaient plus de fer que l’Angleterre n’en produirait sept siècles plus tard."
 nd_cso_currency_bureau: "Bureau du papier-monnaie"
 nd_cso_currency_bureau_desc: "Une imprimerie gouvernementale produisant du papier-monnaie jiaozi, employant plus d'un millier de travailleurs pour frapper la première monnaie fiduciaire au monde."
 nd_cso_naval_shipyard: "Chantier naval de Song"
 nd_cso_naval_shipyard_desc: "Une installation spécialisée dans la construction de navires de guerre à roues à aubes, avec des chantiers d'essais sur tapis roulant et des ateliers de montage de ferronnerie."
 nd_cso_printing_house: "Imprimerie de chansons"
 nd_cso_printing_house_desc: "Une maison d'édition produisant des livres utilisant à la fois des techniques de gravure sur bois et de caractères mobiles, approvisionnant la société la plus alphabétisée de la planète."
 nd_cso_gunpowder_arsenal: "Arsenal de poudre à canon"
 nd_cso_gunpowder_arsenal_desc: "Un centre de recherche et de fabrication d'armes produisant des lances à feu, des bombes tonnerres et des mélanges de poudre à canon selon les formules de Wujing Zongyao."
 nd_cso_tea_house: "Maison de thé de la chanson"
 nd_cso_tea_house_desc: "Un établissement commercial et culturel agréé où les marchands négocient des accords lors de cérémonies du thé élaborées, servant de plaque tournante à la fois pour le commerce et la culture littéraire."
 nd_cso_riverine_fort: "Fort du fleuve Yangtsé"
 nd_cso_riverine_fort_desc: "Une garnison fortifiée commandant un point stratégique sur le Yangtsé, faisant partie du réseau de défense fluviale des Song du Sud qui a tenu la ligne contre l'invasion du nord pendant plus d'un siècle."
 nd_cso_academy: "Académie d'apprentissage"
 nd_cso_academy_desc: "Un centre d'études néo-confucéen dédié aux enseignements de Zhu Xi, où des érudits officiels poursuivent l'investigation des choses et la culture du caractère moral."
 nd_cso_blast_furnace: "Haut fourneau alimenté au charbon"
 nd_cso_blast_furnace_desc: "Fonderie de fer industrielle utilisant du charbon et des soufflets alimentés à l'eau, produisant de l'acier à une échelle sans précédent."
 nd_cso_advanced_smelting: "Production d'acier avancée"
 nd_cso_advanced_smelting_desc: "Techniques de fusion raffinées utilisant des alliages de cuivre et du charbon de qualité supérieure, produisant un acier de qualité supérieure pour les armes et les outils."
 nd_cso_currency_printing: "Impression de devises"
 nd_cso_currency_printing_desc: "Impression spécialisée de papier-monnaie à l'aide d'encre multicolore, de papier en fibre de soie et de motifs complexes pour prévenir la contrefaçon."
 nd_cso_shipyard_upkeep: "Opérations du chantier naval"
 nd_cso_shipyard_upkeep_desc: "Entretien des installations de construction de roues à aubes, y compris les parcs à bois, les ateliers de ferronnerie et les zones d'assemblage de tapis roulants."
 nd_cso_book_printing: "Impression de livres"
 nd_cso_book_printing_desc: "Production de masse de livres utilisant des techniques de gravure sur bois et de caractères mobiles, diffusant l'alphabétisation et les connaissances dans tout le royaume."
 nd_cso_arsenal_upkeep: "Opérations d'Arsenal"
 nd_cso_arsenal_upkeep_desc: "Production et stockage d'armes à poudre, y compris le mélange de salpêtre, de soufre et de charbon de bois selon des formules classifiées."
 nd_cso_tea_service: "Service à thé"
 nd_cso_tea_service_desc: "La préparation et le service élaborés du thé à l'aide de poteries fines et de récipients scellés à la cire d'abeille, au cœur de la vie commerciale et culturelle Song."
 nd_cso_fort_garrison: "Garnison du fort"
 nd_cso_fort_garrison_desc: "Approvisionnement et armement des fortifications du fleuve Yangtze avec des armes, des pierres pour les réparations et du riz pour la garnison."
 nd_cso_academy_upkeep: "Entretien de l'Académie"
 nd_cso_academy_upkeep_desc: "Fourniture de papier, de livres et d'huile de lampe aux académies néo-confucéennes où les érudits étudient les classiques et se préparent aux examens."
 levy_nd_cso_fire_lance: "Prélèvement de lance de feu"
 levy_nd_cso_fire_lance_desc: "Infanterie de lances de feu enrôlée des villes de garnison Song."
 levy_nd_cso_paddle_warship: "Prélèvement sur les roues à aubes"
 levy_nd_cso_paddle_warship_desc: "Navires à roues à aubes enrôlés des villes fluviales Song, avec équipage composé de riverains et de pêcheurs."
 nd_cso_silk_workshop: "Atelier de soie chantée"
 nd_cso_silk_workshop_desc: "Une installation de tissage spécialisée produisant les meilleurs textiles en soie au monde. Les ateliers de soie Song combinaient les techniques traditionnelles avec de nouveaux modèles de métiers à tisser pour créer des tissus commercialisés jusqu'en Méditerranée."
 nd_cso_porcelain_kiln: "Four à porcelaine Song"
 nd_cso_porcelain_kiln_desc: "Une installation de cuisson de céladon produisant la porcelaine vert jade distinctive qui est devenue le produit de luxe le plus recherché en Asie et dans le monde de l'océan Indien."
 nd_cso_silk_weaving: "Tissage de la soie"
 nd_cso_silk_weaving_desc: "Transformation de la soie brute en tissu fin à l'aide de techniques avancées de métier à tisser et de teintures naturelles, produisant des textiles d'une qualité inégalée."
 nd_cso_celadon_production: "Production de céladon"
 nd_cso_celadon_production_desc: "Cuisson d'argile raffinée avec du charbon pour produire de la porcelaine céladon Song, appréciée pour son vernis translucide vert jade."
 nd_cso_formed_tt: "Southern Song a été formé"
 nd_cso_path_a_tt: "Choisissez la prospérité maritime"
 nd_cso_path_b_tt: "Choisissez les examens impériaux"
 nd_cso_destiny: "Destin de la chanson"
 nd_cso_destiny_desc: "La dynastie Song est à nouveau ressuscitée. L’empire restauré doit désormais tracer son avenir : regardera-t-il vers l’extérieur, au-delà des mers, ou vers l’intérieur pour perfectionner l’art de la gouvernance ?"
 nd_cso_dest_fujian_ports: "Les entrepôts du Fujian"
 nd_cso_dest_fujian_ports_desc: "Quanzhou et Zhangzhou sont les plus grands ports du monde. Sécurisez-les, remplissez le trésor et les océans s'ouvriront devant nous."
 nd_cso_dest_nanyang_trade: "Seigneurs des Nanyang"
 nd_cso_dest_nanyang_trade_desc: "Les îles aux épices et le détroit de Malacca sont les points d’étranglement de l’Asie maritime. Les flottes au trésor Song doivent contrôler ces eaux."
 nd_cso_dest_ocean_hegemony: "Maîtres de toutes les mers"
 nd_cso_dest_ocean_hegemony_desc: "De la côte de Malabar au golfe Persique, les marchands Song feront du commerce dans tous les ports. Aucune mer ne sera fermée à nos flottes."
 nd_cso_dest_southern_order: "Ordre du Royaume du Sud"
 nd_cso_dest_southern_order_desc: "Before the Song can look north, it must perfect governance in the south. Establish modern banking, hold Hangzhou and raise its development to 48, and forge a bureaucracy without equal."
 nd_cso_dest_northern_recovery: "Récupérer les plaines centrales"
 nd_cso_dest_northern_recovery_desc: "Kaifeng et Luoyang, les anciennes capitales Song, doivent être restituées à la dynastie. La frontière nord doit être sécurisée par la force des armes."
 nd_cso_dest_mandate_perfected: "Le mandat perfectionné"
 nd_cso_dest_mandate_perfected_desc: "With the old capitals restored and Dadu itself under Song control, the dynasty must rebuild Kaifeng to a development of 73, twice what it was, and reach a prestige that proves the Mandate of Heaven is truly theirs."
 nd_cso.7.t: "La chanson perdure"
 nd_cso.7.d: "Contre toute attente, la dynastie Song a survécu à ses crises et en est ressortie plus forte qu’avant. Les érudits de l’Académie parlent d’un mandat renouvelé : d’une dynastie qui a fait ses preuves grâce à sa persévérance et à sa bonne gouvernance. Que l'avenir se situe sur les vagues ou dans les salles d'examen, la Chanson écrira le prochain chapitre de sa longue histoire."
 nd_cso.7.a: "Le chant durera dix mille ans."
 nd_cso.8.t: "Les ports du Fujian"
 nd_cso.8.d: "The great harbor of Quanzhou (known to Arab merchants as Zayton) and the bustling entrepot of Zhangzhou are now firmly under Song control. Together with the workshops of Hangzhou, they form a commercial triangle of unmatched wealth. Foreign merchants from Arabia, India, and the Spice Islands crowd the wharves, trading pepper and incense for Song silk and porcelain.\n\nThe Superintendent of Maritime Trade reports customs revenues beyond anything the treasury has seen. The oceans themselves seem to beckon."
 nd_cso.8.a: "Que la bannière Song flotte au-dessus de chaque mât."
 nd_cso.9.t: "Maîtrise du Nanyang"
 nd_cso.9.d: "Song influence now stretches across the South China Sea to the Strait of Malacca. Our merchants dominate the trade in spices, camphor, and tropical hardwoods that flows through these waters. The great entrepots of Palembang and Malacca, once independent kingdoms, now operate under Song commercial supervision.\n\nThis achievement has no precedent in Chinese history. The dynasty that was mocked for retreating south has built something no northern empire ever possessed: a maritime sphere of influence spanning thousands of li."
 nd_cso.9.a: "Monopoliser le commerce des épices à la source."
 nd_cso.9.b: "Liez ces royaumes aux Song en tant qu'affluents."
 nd_cso.10.t: "Les océans chantés"
 nd_cso.10.d: "Song treasure fleets now anchor in the harbors of India and the Persian Gulf. The compass-guided junks of Hangzhou carry porcelain and silk to markets that once seemed impossibly distant. At Calicut, Song merchants negotiate alongside Arab traders. At Hormuz, the gateway to the Mediterranean trade, Song goods command premium prices.\n\nThis is a commercial empire without parallel: built not on conquest alone, but on the superiority of Song navigation, shipbuilding, and the sheer volume of luxury goods our workshops produce."
 nd_cso.10.a: "Continuez la vision de Zheng He d'une exploration pacifique."
 nd_cso.10.b: "Affirmez le mandat Song sur ces eaux."
 nd_cso.11.t: "Un royaume bien ordonné"
 nd_cso.11.d: "The southern provinces have been transformed. Where once there was frontier wilderness and restive minorities, there are now thriving cities connected by canals, governed by examination-selected magistrates, and linked to the capital through an efficient postal system. The banking houses of Hangzhou finance development across the realm.\n\nThe scholars say that this is what the ancient sages envisioned: governance through moral example and bureaucratic competence, not through force. The south is ready to serve as the foundation for greater things."
 nd_cso.11.a: "Le sud est bien ordonné. Qu’est-ce qui vient ensuite ?"
 nd_cso.12.t: "Le retour vers le Nord"
 nd_cso.12.d: "Song banners fly once more over Kaifeng and Luoyang, the ancient capitals where the dynasty was born. The restoration of the northern heartland has been the dream of every Song patriot since the Jurchen invasion drove the court south. The old Imperial Way in Kaifeng is being rebuilt, its marketplaces and pleasure quarters restored to their former glory.\n\nBut the north has changed in the centuries of foreign rule. Its people have adopted different customs, its fields lie partially fallow, and its cities have shrunk. The question is whether to reconquer aggressively or integrate patiently."
 nd_cso.12.a: "Appuyez sur la reconquête : le Nord doit être libéré."
 nd_cso.12.b: "Intégrez progressivement le nord à l’ordre Song."
 nd_cso.13.t: "La dynastie parfaite"
 nd_cso.13.d: "From Hangzhou in the south to Dadu in the north, the Song dynasty now governs the most developed, most literate, and most prosperous realm the world has ever known. The civil examination system selects the best minds regardless of birth. The imperial library preserves the accumulated wisdom of three millennia. The land produces more rice, iron, silk, and porcelain than any other civilization.\n\nScholars speak of a new golden age: one that surpasses even the legendary era of the Three Sovereigns. The Song has not merely restored the Mandate of Heaven; it has perfected it."
 nd_cso.13.a: "Construisez une bureaucratie éternelle pour survivre à n’importe quelle dynastie."
 nd_cso.13.b: "Favorisez une renaissance des arts et de l’apprentissage."
 STATIC_MODIFIER_NAME_nd_cso_dest_spice_monopoly: "Monopole du commerce des épices"
 STATIC_MODIFIER_DESC_nd_cso_dest_spice_monopoly: "Le contrôle des Song sur les routes commerciales de Nanyang a créé un quasi-monopole sur le flux d'épices vers les marchés d'Asie de l'Est."
 STATIC_MODIFIER_NAME_nd_cso_dest_tributary_network: "Réseau affluent de Nanyang"
 STATIC_MODIFIER_DESC_nd_cso_dest_tributary_network: "Les royaumes maritimes d'Asie du Sud-Est reconnaissent la suzeraineté Song, envoyant des missions d'hommage et recevant en retour des privilèges commerciaux."
 STATIC_MODIFIER_NAME_nd_cso_dest_zheng_he_legacy: "L'héritage des flottes au trésor"
 STATIC_MODIFIER_DESC_nd_cso_dest_zheng_he_legacy: "Les flottes de trésors Song parcourent l’océan Indien, projetant leur puissance maritime et leur influence commerciale sur tous les rivages."
 STATIC_MODIFIER_NAME_nd_cso_dest_maritime_mandate: "Mandat maritime"
 STATIC_MODIFIER_DESC_nd_cso_dest_maritime_mandate: "Les Song revendiquent eux-mêmes la souveraineté sur les mers, imposant des normes commerciales et percevant des péages à chaque point d’étranglement."
 STATIC_MODIFIER_NAME_nd_cso_dest_reconquest_fervor: "Ferveur de reconquête"
 STATIC_MODIFIER_DESC_nd_cso_dest_reconquest_fervor: "The liberation of the old capitals has ignited patriotic fervor across the realm. Song armies march north with the zeal of a righteous cause, and the court's purse is emptied to keep them marching."
 STATIC_MODIFIER_NAME_nd_cso_dest_northern_integration: "Intégration du Nord"
 STATIC_MODIFIER_DESC_nd_cso_dest_northern_integration: "Patient administration and cultural outreach gradually restore Song identity in the long-alienated northern provinces. Every statute must now be made to fit the north as well as the south."
 STATIC_MODIFIER_NAME_nd_cso_dest_eternal_bureaucracy: "La bureaucratie éternelle"
 STATIC_MODIFIER_DESC_nd_cso_dest_eternal_bureaucracy: "Un système d'examen perfectionné et un code juridique complet créent une bureaucratie capable de gouverner efficacement, quel que soit celui qui siège sur le trône."
 STATIC_MODIFIER_NAME_nd_cso_dest_renaissance_court: "Renaissance de la chanson"
 STATIC_MODIFIER_DESC_nd_cso_dest_renaissance_court: "La cour Song devient le mécène d’un nouvel âge d’or des arts, des lettres et de la philosophie naturelle, attirant des érudits du monde entier."
 nd_cso_treasure_fleet_harbor: "Port de la flotte au trésor"
 nd_cso_treasure_fleet_harbor_desc: "Une immense installation portuaire spécialement construite, capable de construire, d'équiper et d'approvisionner les énormes jonques de la flotte au trésor qui projettent la puissance Song sur tous les océans."
 nd_cso_treasure_fleet_maintenance: "Entretien de la flotte au trésor"
 nd_cso_treasure_fleet_maintenance_desc: "Approvisionnement et entretien du port de la grande flotte au trésor, consommant de grandes quantités de bois, de provisions navales et d'accessoires en fer."
 nd_cso_imperial_library: "Bibliothèque impériale"
 nd_cso_imperial_library_desc: "Le plus grand référentiel de connaissances au monde, hébergeant des millions de volumes couvrant toutes les branches de l'apprentissage. La Bibliothèque Impériale préserve et systématise la sagesse accumulée de la civilisation chinoise."
 nd_cso_imperial_library_maintenance: "Entretien de la bibliothèque"
 nd_cso_imperial_library_maintenance_desc: "L'entretien des vastes collections de la Bibliothèque impériale nécessite un approvisionnement constant en papier, en encre et un soin expert pour préserver les textes anciens."
 cso_three_departments_bureaucracy: "Les trois départements"
 cso_three_departments_bureaucracy_desc: "Sansheng (les départements Zhongshu (rédaction), Menxia (révision) et Shangshu (exécution)) formaient le sommet de la gouvernance impériale Tang et Song. Chaque édit impérial passait par les chanceliers du Zhongshu Sheng pour sa rédaction, le droit de remontrance formelle du Menxia Sheng, et ensuite seulement par le Shangshu Sheng pour exécution par les Six Conseils en dessous. Les Song ont affiné le système dans sa forme la plus articulée avant que l'empereur Yongle n'abolisse la chancellerie en 1380 ; Fonctionnant correctement, les Trois départements ont produit une loi consensuelle et une gouvernance stable, mais des chanceliers rivaux pouvaient bloquer les décrets pendant des années."
 cso_song_examinations_bureaucracy: "Le système d’examen des chansons"
 cso_song_examinations_bureaucracy_desc: "Fondé sous les Sui en 605, le keju atteint une ampleur et un prestige sans précédent sous les Song. À la fin des Song du Nord, environ 50 000 candidats passaient les examens préfectoraux à chaque cycle, les jinshi réussis entrant dans une carrière civile garantie. La réforme du programme de 1071 de Wang Anshi a remplacé la composition poétique par un essai politique pratique (cewen) sur la signification des classiques, brisant le monopole littéraire de l'aristocratie et produisant une élite officielle et érudite profondément instruite. Le système a également engendré des cliques factionnelles amères et, dans les périodes de déclin, une tricherie généralisée et la vente de diplômes."
 cso_censorate_bureaucracy: "Remonstrance Bureau"
 cso_censorate_bureaucracy_desc: "The Song gave criticism an office of its own. The Remonstrance Bureau was founded around 1017 and fully staffed from 1032 under Emperor Renzong. Censors impeached officials. Remonstrators went further: they read what passed between the emperor and his ministers and argued against the policy itself. In 1050 Bao Zheng, serving there, fought the promotion of the uncle of the emperor's favourite consort until the emperor took half of it back. A bureau captured by a faction became that faction's weapon, as in the purges that undid Wang Anshi's reforms."
 cso_hanlin_academy_bureaucracy: "Académie Hanlin"
 cso_hanlin_academy_bureaucracy_desc: "Fondé sous Tang Xuanzong et élevé par Song Taizu en 960, le Hanlin Yuan était l'académie du pinceau, l'institut littéraire le plus prestigieux de l'empire. Les académiciens de Hanlin rédigèrent des édits impériaux du plus haut grade, compilèrent les histoires dynastiques et encadrèrent l'héritier présomptif. Le Song Hanlin a produit les lettrés déterminants de l'époque : Ouyang Xiu, Sima Guang, Su Shi et Wang Anshi lui-même ont tous servi dans ses murs. Une académie vigoureuse confère au trône un prestige culturel inégalé ; une faction choyée divisée en factions Yuanyou et Shaosheng dont les soutiens sont devenus creux."
 cso_xinfa_reforms_bureaucracy: "Les nouvelles politiques de Wang Anshi"
 cso_xinfa_reforms_bureaucracy_desc: "Le programme de réforme Xinfa du chancelier Wang Anshi (1069-1076) a tenté la restructuration la plus ambitieuse de la gouvernance Song. Qing miao a accordé des prêts de printemps aux paysans à des taux inférieurs à ceux des prêteurs sur gages du village ; Junshu Pingtiao a stocké des céréales dans des entrepôts d'État pour atténuer les spéculations sur la famine ; les baojia ont organisé les ménages ruraux en milices à responsabilité mutuelle ; et les bureaux d'échange du marché shi yi fa ont placé la réglementation commerciale sous l'égide de l'État. Le programme divisait l'élite en factions réformistes et conservatrices dont les querelles ont fait rage pendant deux générations."
 cso_salt_tea_monopoly_bureaucracy: "Monopole du sel et du thé"
 cso_salt_tea_monopoly_bureaucracy_desc: "Les commissions Yan-Cha Si géraient les monopoles de l'État Song sur le sel, le thé et (à certaines périodes) l'alun, l'alcool et l'encens. Les revenus du sel fournissaient à eux seuls environ la moitié des revenus de l’État des Song du Nord au plus fort. Les marchands agréés achetaient des billets de transport (yan-yin) auprès des commissions régionales, tandis que les bureaux cha-fa réglementaient le commerce du thé du Yangzi en échange d'importations de chevaux frontaliers en provenance des Tibétains et des Tangoutes. Le système a enrichi le trésor et les marchands agréés, mais a suscité une contrebande généralisée, des abus du cartel du sel et le ressentiment des paysans face aux prix gonflés."
 cso_jiao_shu_printing_bureaucracy: "Imprimerie Jiao Shu"
 cso_jiao_shu_printing_bureaucracy_desc: "L’imprimerie d’État Song a fait de la Chine Song la société la plus instruite et la plus sophistiquée sur le plan monétaire de son époque. Les presses impériales de Kaifeng et de Hangzhou ont produit des éditions faisant autorité des classiques confucéens, des Vingt-Quatre Histoires, du Tripitaka bouddhiste et, après 1040, des expériences sur les caractères mobiles de Bi Sheng. Le bureau Jiaozi, établi à Chengdu en 1023, a émis le premier papier-monnaie imprimé par le gouvernement au monde contre les réserves de cuivre. Mal gérée, l'émission excessive de billets par le bureau a déclenché les effondrements inflationnistes qui ont tourmenté les derniers trésors des Song du Nord et du Sud."
 AUTO_MODIFIER_NAME_nd_cso_bureaucracy_authority: "Autorité bureaucratique de la chanson"
 AUTO_MODIFIER_DESC_nd_cso_bureaucracy_authority: "Centuries of Tang precedent refined into Song administrative perfection. The Three Departments, the expanded keju, the Remonstrance Bureau, the Hanlin Academy, the Wang Anshi reforms, the state monopolies, and the imperial printing offices form an institutional apparatus unmatched in the contemporary world. Four institutional slots open, allowing the restored Song to entrench four of its great offices."
 nd_cso_dest_hangzhou_48_tt: "#bold Hangzhou#! is owned and has development of at least #bold 48#!"
 nd_cso_dest_kaifeng_73_tt: "#bold Kaifeng#! is owned and has development of at least #bold 73#!"
