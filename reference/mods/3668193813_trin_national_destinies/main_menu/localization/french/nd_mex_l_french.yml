l_french:
 STATIC_MODIFIER_NAME_nd_tres_garantias: "Trois garanties"
 STATIC_MODIFIER_DESC_nd_tres_garantias: "Les trois piliers sacrés du Plan de Iguala (Religion, Indépendance et Union) unissent les divers peuples du Mexique en une seule nation sous la bannière de l'ordre et de la tradition."
 STATIC_MODIFIER_NAME_nd_grito_de_dolores: "Cri de Dolorès"
 STATIC_MODIFIER_DESC_nd_grito_de_dolores: "L’esprit révolutionnaire d’Hidalgo et de Morelos perdure. Le Mexique est une nation forgée par le soulèvement populaire, où la souveraineté populaire transcende l'ancien ordre colonial."
 nd_mex.1.t: "La naissance du Mexique"
 nd_mex.1.d: "A new nation rises from the ashes of three centuries of colonial rule. The land that was once New Spain (its silver mines, its haciendas, its cathedrals, its peoples of a hundred origins) must now find its own path. Two visions compete for the soul of the new republic. The conservatives look to the Plan de Iguala and its Three Guarantees: the primacy of the Catholic faith, absolute independence from Spain, and the union of all peoples regardless of origin, an orderly transition led by the army and the church. The liberals invoke the Grito de Dolores, the midnight cry of Father Hidalgo that launched a decade of popular revolution, a Mexico built on the sovereignty of the common people, where colonial privileges are swept away and a new republican order rises from below.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mex.1.a: "Religion, Indépendance, Union : les Trois Garanties seront notre fondement."
 nd_mex.1.b: "Le Cri de Dolorès résonne encore : la révolution populaire continue !"
 STATIC_MODIFIER_NAME_nd_mex_bourbon_reform_centralize: "Système d'intendance"
 STATIC_MODIFIER_DESC_nd_mex_bourbon_reform_centralize: "Les réformes administratives des Bourbons ont centralisé la gouvernance à travers le système d'intendance, remplaçant l'ancien réseau d'alcalde mayor par des administrateurs professionnels qui répondent directement à la couronne."
 STATIC_MODIFIER_NAME_nd_mex_bourbon_reform_trade: "Décret sur le libre commerce"
 STATIC_MODIFIER_DESC_nd_mex_bourbon_reform_trade: "La libéralisation des réglementations commerciales coloniales a ouvert de nouveaux ports et routes commerciales, brisant l'ancien système de monopole et permettant aux marchands mexicains de commercer plus librement."
 STATIC_MODIFIER_NAME_nd_mex_la_reforma_secular: "Laws of 1833"
 STATIC_MODIFIER_DESC_nd_mex_la_reforma_secular: "The tithe and the monastic vow are no longer enforced by civil law, the Pontifical University is closed and public instruction is placed under a directorate of the state. Congress legislates where the Church once ruled."
 STATIC_MODIFIER_NAME_nd_mex_la_reforma_national: "Civic Militia"
 STATIC_MODIFIER_DESC_nd_mex_la_reforma_national: "Citizens of every state are enrolled in the civic militia to defend the republic and its laws. Armed by their own states, they are bound to the nation's cause and not to the generals of the regular army."
 nd_mex.2.t: "Les réformes Bourbon"
 nd_mex.2.d: "La dynastie des Bourbons a apporté des changements radicaux à l'administration de la Nouvelle-Espagne. L’ancien système des Habsbourg de gouvernement indirect via les élites locales et les intermédiaires de l’Église est remplacé par une bureaucratie rationalisée conçue pour extraire davantage de revenus et renforcer le contrôle métropolitain. Le système d'intendance remplace la mosaïque de corregidores et d'alcaldes mayores par des administrateurs professionnels. Les restrictions sur le commerce colonial sont assouplies. L'armée se professionnalise. Ces réformes renforceront l’État, mais elles risquent également de s’aliéner les élites créoles qui jouissent depuis longtemps d’une autonomie sous l’ancien système. La question est de savoir s’il faut adopter pleinement la centralisation ou concentrer les réformes sur l’expansion commerciale."
 nd_mex.2.a: "Centraliser l'administration : l'efficacité exige de l'ordre."
 nd_mex.2.b: "Ouvrir les ports : la prospérité passe par le libre-échange."
 nd_mex.3.t: "The Reform of 1833"
 nd_mex.3.d: "With President Santa Anna retired to his hacienda, Vice President Valentin Gomez Farias governs, and with Jose Maria Luis Mora at his side he carries the first liberal reform through Congress. The payment of tithes and the keeping of monastic vows are no longer enforced by civil law. The missions of the Californias are secularized, the Pontifical University is closed and a directorate of public instruction takes its place. The regular army is to be reduced and its fuero is questioned, while the states arm their civic militias. The bishops protest, and garrisons pronounce under the cry of religion and fueros. The reform can be pressed in the schools and the law, or the republic can be defended in arms."
 nd_mex.3.a: "The laws stand: the Church shall not rule the schools or the courts."
 nd_mex.3.b: "Arm the civic militia: the republic is defended by its citizens."
 nd_mex.4.t: "La révolution de l'argent"
 nd_mex.4.d: "Dans les mines de Zacatecas, une avancée métallurgique est en train de transformer l’économie coloniale. Bartolomé de Medina a développé le procédé patio, amalgame de mercure appliqué à l'échelle industrielle, qui permet d'extraire l'argent de minerais auparavant trop pauvres pour être exploités. L’impact est stupéfiant. La production d'argent explose et les pesos mexicains commencent à circuler à travers le monde, des marchés de Séville aux boutiques de soie de Manille, des comptoirs d'Amsterdam aux salons de thé de Canton. La Nouvelle-Espagne devient le moteur de la première économie véritablement mondiale et le peso en argent devient la première monnaie internationale au monde."
 nd_mex.4.a: "L'argent mexicain affluera aux quatre coins du monde."
 nd_mex.5.t: "Le cri de Dolorès"
 nd_mex.5.d: "Aux premières heures du 16 septembre 1810, dans la petite ville de Dolores, dans le Bajio, le père Miguel Hidalgo y Costilla sonne les cloches de l'église pour convoquer ses paroissiens. Ce qu'il proclame ce matin-là résonnera à travers les siècles : mort au mauvais gouvernement, mort aux gachupines, vive la Vierge de Guadalupe. En quelques jours, une armée hétéroclite de dizaines de milliers de personnes (métisses, peuples indigènes, mineurs, paysans) marche sur Guanajuato, puis San Luis Potosi, puis Mexico elle-même. L’insurrection durera onze ans, coûtera des centaines de milliers de vies et produira une nation comme le monde n’en a jamais connue : ni entièrement espagnole ni entièrement indigène, mais quelque chose d’entièrement nouveau."
 nd_mex.5.a: "Une nouvelle nation naît du courage du peuple."
 nd_mex_encomienda_system: "Système Encomienda"
 nd_mex_encomienda_system_desc: "L'encomienda accorde aux colons espagnols le droit d'extraire du travail et des tributs des communautés autochtones, établissant ainsi les bases de l'agriculture et de l'exploitation minière coloniales."
 nd_mex_silver_mining: "Révolution des mines d’argent"
 nd_mex_silver_mining_desc: "The development of mercury amalgamation transforms silver extraction, making Mexico the world's largest silver producer and its currency the first global medium of exchange.\n\n#italic Available in: $nd_mex_hacienda_grande$#!"
 nd_mex_cochineal_trade: "Commerce de cochenilles"
 nd_mex_cochineal_trade_desc: "La teinture de cochenille issue du cactus nopal devient la deuxième exportation la plus précieuse du Mexique, produisant un pourpre vif qui colore les robes des monarques et des cardinaux européens."
 nd_mex_viceregal_administration: "Administration vice-royale"
 nd_mex_viceregal_administration_desc: "L'audiencia, le vice-roi et la Real Hacienda forment l'épine dorsale institutionnelle de la Nouvelle-Espagne, gouvernant un territoire s'étendant de l'Amérique centrale aux Philippines."
 nd_mex_colegio_tradition: "Collège Tradition"
 nd_mex_colegio_tradition_desc: "La fondation de collèges et de l'Université royale et pontificale du Mexique crée une tradition intellectuelle distinctive mêlant la scolastique européenne à l'expérience du Nouveau Monde."
 nd_mex_hacienda_system: "Système Hacienda"
 nd_mex_hacienda_system_desc: "Les grands domaines agricoles combinent l'agriculture, l'élevage et parfois l'exploitation minière pour alimenter l'économie coloniale, devenant ainsi l'institution dominante du Mexique rural."
 nd_mex_casta_society: "Société Casta"
 nd_mex_casta_society_desc: "La taxonomie raciale complexe du Mexique colonial (Espagnols, créoles, métis, mulâtres et des dizaines d’autres catégories) crée paradoxalement une société d’une fluidité et d’une synthèse culturelles remarquables."
 nd_mex_silver_peso: "Peso Argent"
 nd_mex_silver_peso_desc: "Le peso de ocho mexicain, la pièce de huit, devient la première monnaie mondiale, acceptée de Canton à Constantinople."
 nd_mex_manila_galleon_trade: "Commerce des galions de Manille"
 nd_mex_manila_galleon_trade_desc: "Le nao de China relie Acapulco à Manille, transportant l'argent mexicain vers l'Asie et revenant avec de la soie, des épices et de la porcelaine par la première route commerciale transpacifique au monde."
 nd_mex_presidio_line: "Ligne Presidio"
 nd_mex_presidio_line_desc: "Une chaîne de garnisons fortifiées s'étend à travers la frontière nord, défendant le territoire habité contre les Comanches, les Apaches et d'autres pillards indigènes."
 nd_mex_soldados_de_cuera: "Soldados de Cuera"
 nd_mex_soldados_de_cuera_desc: "Les dragons en armure de cuir des présidios frontaliers sont une tradition militaire typiquement mexicaine, une cavalerie armée de lance, de bouclier et de mousquet, adaptée aux conditions difficiles des régions frontalières du nord."
 nd_mex_baroque_identity: "baroque mexicain"
 nd_mex_baroque_identity_desc: "Le style churrigueresque ultra-orné mélange le baroque espagnol avec les traditions artistiques indigènes, créant des cathédrales et des bâtiments publics qui incarnent l'âme métisse du Mexique."
 nd_mex_bourbon_reforms: "Réformes Bourbon"
 nd_mex_bourbon_reforms_desc: "Les vastes réformes administratives de la dynastie des Bourbons (système d'intendance, libéralisation du commerce, professionnalisation militaire) modernisent la Nouvelle-Espagne mais sèment les graines du mécontentement créole."
 nd_mex_mining_boom: "Boom minier"
 nd_mex_mining_boom_desc: "Industrial-scale silver extraction from the great mines of Guanajuato and Zacatecas generates wealth that flows across the globe, making New Spain the richest colony in the Americas.\n\n#italic Available in: $nd_mex_hacienda_grande$#!"
 nd_mex_criollo_consciousness: "Conscience Criollo"
 nd_mex_criollo_consciousness_desc: "Les Espagnols nés au Mexique développent une identité distincte, une fierté pour leur patrie américaine et un ressentiment à l'égard des privilèges péninsulaires, fondement intellectuel du mouvement indépendantiste."
 nd_mex_independence_movement: "Mouvement pour l'indépendance"
 nd_mex_independence_movement_desc: "Du Grito d'Hidalgo au Congrès de Chilpancingo de Morelos en passant par les campagnes de guérilla de Guerrero, le mouvement indépendantiste forge une nouvelle identité nationale à travers une décennie de guerre révolutionnaire."
 nd_mex_guerrilla_tradition: "Tradition de guérilla"
 nd_mex_guerrilla_tradition_desc: "Les guérilleros insurgés, les combattants métis et indigènes qui ont mené une guerre irrégulière contre les forces royalistes, établissent une tradition militaire mexicaine de résistance populaire qui perdure depuis des générations."
 nd_mex_plan_de_iguala: "Plan d'Iguala"
 nd_mex_plan_de_iguala_desc: "Le Plan des Trois Garanties unit les républicains insurgés et les conservateurs royalistes, créant une large coalition qui parvient à l'indépendance par la négociation plutôt que par la conquête."
 nd_mex_constitution_1824: "Constitution de 1824"
 nd_mex_constitution_1824_desc: "La première constitution républicaine du Mexique établit un système fédéral inspiré en partie de celui des États-Unis, avec des représentants élus, une séparation des pouvoirs et une souveraineté résidant dans la nation."
 nd_mex_pulque_industry: "Industrie Pulque"
 nd_mex_pulque_industry_desc: "The commercial cultivation of maguey and industrial production of pulque transforms an ancient sacred beverage into one of Mexico's most important domestic industries.\n\n#italic Available in: $nd_mex_hacienda_grande$#!"
 nd_mex_la_reforma: "Reform of 1833"
 nd_mex_la_reforma_desc: "Under Vice President Gomez Farias the first liberal reform is passed. Tithes and monastic vows lose the force of civil law, the Pontifical University is closed and public instruction is placed under the state."
 nd_mex_rurales_corps: "Tribunal of the Acordada"
 nd_mex_rurales_corps_desc: "The judge of the Acordada and his mounted lieutenants ride the roads of the country against highwaymen. A bandit taken is tried and sentenced where he is caught, with no appeal to the courts of the capital."
 nd_mex_mestizo_nation: "Nation métisse"
 nd_mex_mestizo_nation_desc: "Le Mexique adopte le métissage (le mélange des héritages indigène, européen et africain) comme principe déterminant de l'identité nationale, créant ainsi une société qui transcende les catégories raciales de l'ère coloniale."
 nd_mex_nationalization: "Secularization of the Missions"
 nd_mex_nationalization_desc: "By the law of 1833 the missions of the Californias are taken from the friars. Their lands and herds pass to the state and to settlers, and the republic claims the patronage over the Church that the kings of Spain once held."
 nd_mex_industrialization: "Banco de Avio"
 nd_mex_industrialization_desc: "Founded in 1830 at the urging of Lucas Alaman, the Banco de Avio lends public money for machinery. Mechanized cotton mills are raised in Puebla, and the flooded silver mines of Real del Monte are drained with steam engines."
 nd_mex_veracruz_trade: "Commerce de Veracruz"
 nd_mex_veracruz_trade_desc: "Le port de Veracruz, porte d'entrée du Mexique vers l'Atlantique et les Caraïbes, devient la plaque tournante d'un commerce maritime en expansion reliant les exportations mexicaines aux marchés mondiaux."
 nd_mex_federalist_republic: "République fédéraliste"
 nd_mex_federalist_republic_desc: "Le système fédéral accorde l'autonomie aux divers États et régions du Mexique, équilibrant l'autorité centrale et la gouvernance locale dans une nation vaste et hétérogène."
 a_nd_mex_soldados_de_cuera: "Soldados de Cuera"
 a_nd_mex_soldados_de_cuera_desc: "Dragons frontaliers blindés de cuir, armés de lance, de bouclier et de mousquet. Née et élevée à la frontière nord, cette cavalerie présidiale est endurcie par des décennies de guerre contre les pillards Comanche et Apache."
 a_nd_mex_guerrilleros: "Guérilleros insurgés"
 a_nd_mex_guerrilleros_desc: "Combattants irréguliers du mouvement indépendantiste, paysans métis, mineurs et guerriers indigènes qui mènent une guérilla dans les montagnes et les barrancas du centre du Mexique."
 a_nd_mex_rurales: "Riders of the Acordada"
 a_nd_mex_rurales_desc: "Mounted lieutenants and commissioners of the Acordada, the tribunal of the roads. Fast light cavalry in small bands who hunt bandits across the countryside and are feared for their summary justice."
 n_nd_mex_manila_galleon: "Galion de Manille"
 n_nd_mex_manila_galleon_desc: "Les nao de China, d'énormes navires au trésor qui naviguent sur la route Acapulco-Manille, transportent de l'argent mexicain vers l'ouest et reviennent chargés de soie, d'épices et de porcelaine asiatiques. Les navires commerciaux les plus grands et les plus riches du Pacifique."
 nd_mex_casa_de_moneda: "Maison de la Monnaie"
 nd_mex_casa_de_moneda_desc: "La Monnaie royale frappe l'argent mexicain en pesos de ocho, la pièce de huit, qui circule comme la première monnaie mondiale depuis les marchés de Canton jusqu'aux comptoirs d'Amsterdam."
 nd_mex_hacienda_grande: "Hacienda Grande"
 nd_mex_hacienda_grande_desc: "Un grand domaine agricole combinant agriculture, élevage et industrie rurale. L'hacienda domine la campagne mexicaine, fournissant de la nourriture et des matières premières tout en employant des centaines de travailleurs liés par le péonage de dettes."
 nd_mex_presidio: "Presidio Fronterizo"
 nd_mex_presidio_desc: "Une garnison frontalière fortifiée composée de soldats professionnels. Le presidio défend le territoire habité contre les envahisseurs indigènes et sert de noyau de civilisation à la frontière nord."
 nd_mex_cochineal_obraje: "Cochenille Obraje"
 nd_mex_cochineal_obraje_desc: "Un atelier de transformation de la teinture de cochenille issue de l'insecte cactus nopal en pigment le plus cher au monde, prisé pour colorer les robes des monarques européens et des cardinaux catholiques."
 nd_mex_colegio_real: "Collège Real"
 nd_mex_colegio_real_desc: "Un collège royal où les élites espagnoles et indigènes sont formées en théologie, en droit et en arts libéraux, créant ainsi une tradition intellectuelle typiquement mexicaine."
 nd_mex_baroque_cathedral: "Cathédrale baroque"
 nd_mex_baroque_cathedral_desc: "Une magnifique cathédrale churrigueresque de style baroque mexicain ultra-orné, mêlant l'architecture ecclésiastique espagnole à des motifs artistiques indigènes dans une expression éblouissante de l'identité culturelle métisse."
 nd_mex_mint_operations: "Opérations de la Monnaie"
 nd_mex_mint_operations_desc: "Les maîtres orfèvres transforment l'argent raffiné en pièces de monnaie et en métaux précieux exquis, produisant ainsi les pesos de ocho qui circulent à travers le monde."
 nd_mex_hacienda_labor: "Travail de l'Hacienda"
 nd_mex_hacienda_labor_desc: "L'hacienda fait vivre sa main-d'œuvre grâce à l'élevage de bétail, à la culture de céréales et aux outils nécessaires pour travailler la terre."
 nd_mex_presidio_garrison: "Garnison du Presidio"
 nd_mex_presidio_garrison_desc: "La garnison frontalière a besoin d'un approvisionnement constant en armes, chevaux, armes à feu et équipement en cuir pour maintenir ses capacités défensives."
 nd_mex_cochineal_processing: "Traitement de la cochenille"
 nd_mex_cochineal_processing_desc: "Les ouvriers récoltent les insectes cochenilles dans les champs de cactus nopal, puis les sèchent soigneusement et les broient en carmin, la teinture la plus précieuse au monde."
 nd_mex_seminary_upkeep: "Entretien du séminaire"
 nd_mex_seminary_upkeep_desc: "Le collège a besoin de papier et de livres pour l'enseignement, de tissus pour l'ameublement et les vêtements, ainsi que de bougies en cire d'abeille pour l'étude et les cérémonies."
 nd_mex_cathedral_upkeep: "Entretien de la cathédrale"
 nd_mex_cathedral_upkeep_desc: "L'entretien des façades en pierre élaborées, des vitraux et des intérieurs dorés d'une cathédrale baroque nécessite un investissement constant dans la pierre, le verre, le tissu pour les vêtements vestimentaires et les bougies en cire d'abeille."
 nd_mex_mercury_amalgamation: "Fusion de mercure"
 nd_mex_mercury_amalgamation_desc: "Le processus de terrassement répand du mercure sur le minerai broyé dans de vastes cours, extrayant ainsi l'argent d'une roche auparavant trop pauvre pour être exploitée."
 nd_mex_pulque_fermentation: "Fermentation Pulque"
 nd_mex_pulque_fermentation_desc: "Les champs de Maguey produisent de l'aguamiel qui est fermenté en pulque, l'ancienne boisson sacrée des Aztèques, aujourd'hui produite commercialement pour la population croissante du Mexique."
 levy_nd_mex_guerrilleros: "Guérilleros insurgés"
 levy_nd_mex_guerrilleros_desc: "Des combattants irréguliers issus du peuple pour mener une guérilla pour défendre la nation."
 nd_mex_industrial_refining: "Affinage industriel de l’argent"
 nd_mex_industrial_refining_desc: "Les Haciendas de Beneficio raffinent des quantités massives de minerai d'argent en utilisant un amalgame de mercure à l'échelle industrielle, approvisionnant ainsi les monnaies qui produisent la monnaie mondiale."
 n_nd_mex_guardacostas: "Corsario Guardacostas"
 n_nd_mex_guardacostas_desc: "Des frégates de patrouille côtière rapides qui protègent les vastes côtes du Golfe et du Pacifique du Mexique contre les pirates, les contrebandiers et l'empiétement étranger."
 nd_mex_formed_tt: "Le Mexique a été formé"
 nd_mex_path_a_tt: "Choisissez les trois garanties#bold Destinée#!"
 nd_mex_path_b_tt: "Choisissez le destin#bold Cri de Dolores#!"
 nd_mex_destiny: "Destin mexicain"
 nd_mex_destiny_desc: "Le Mexique s’est construit sous le feu de la révolution et sous le poids de l’héritage colonial. Il lui faut désormais choisir sa voie : empire ou république, conquête ou commerce, l'épée ou le peso d'argent."
 nd_mex_dest_northern_march: "Marche du Nord"
 nd_mex_dest_northern_march_desc: "Repoussez les frontières des vastes terres d'Aridoamerica. Sécurisez Culiacan et le pays de l'argent du nord et établissez une domination militaire sur les territoires frontaliers sauvages."
 nd_mex_dest_empire_of_anahuac: "Empire d'Anahuac"
 nd_mex_dest_empire_of_anahuac_desc: "Étendez l’autorité mexicaine dans le désert de Sonora et à travers le Rio Grande. Professionnalisez l’armée et établissez des garnisons qui projettent la puissance impériale jusqu’aux confins du continent."
 nd_mex_dest_continental_destiny: "Destin continental"
 nd_mex_dest_continental_destiny_desc: "The Mexican Empire stretches from California to Guatemala, from the Gulf to the Pacific. A continental power rivaling any in the Old World, secured by the greatest army in the Americas and by the artillery that only a state of its size can cast and field."
 nd_mex_dest_silver_republic: "République d'argent"
 nd_mex_dest_silver_republic_desc: "The republic is built on the bedrock of silver. Guanajuato, whose Valenciana vein made it the richest silver camp of New Spain, is built up, the markets are widened, and the Mexican peso becomes the currency of the Americas."
 nd_mex_dest_liberal_republic: "République libérale"
 nd_mex_dest_liberal_republic_desc: "The wealth of cocoa and silver is channelled into banks and trade that serve the people. Veracruz, for three centuries the one licensed port of the viceroyalty, is opened and built up as the gate of free commerce."
 nd_mex_dest_arsenal_of_democracy: "Arsenal de la démocratie"
 nd_mex_dest_arsenal_of_democracy_desc: "Mexico is transformed from an exporter of raw materials into an industrial republic. In Mexico City, where the Academy of San Carlos and the College of Mines once stood alone, science is embraced and schools are built, and a republic is shown to rival any monarchy in prosperity and progress."
 nd_mex_dest_guanajuato_developed_tt: "We own #bold Guanajuato#! and its development is at least #bold 13#!"
 nd_mex_dest_veracruz_developed_tt: "We own #bold Veracruz#! and its development is at least #bold 8#!"
 nd_mex_dest_mexico_city_developed_tt: "We own #bold Mexico City#! and its development is at least #bold 32#!"
 nd_mex.6.t: "Une nation prend forme"
 nd_mex.6.d: "Les fondations du Nouveau-Mexique sont posées. Des mines d'argent du Bajio aux plantations de cacao de la côte du Golfe, des anciennes pyramides de Teotihuacan aux marchés animés d'Oaxaca, cette terre recèle un potentiel de grandeur. La question n’est pas de savoir si le Mexique va s’élever, mais quelle forme cette ascension prendra."
 nd_mex.6.a: "Le destin du Mexique l'attend."
 nd_mex.7.t: "La marche du Nord"
 nd_mex.7.d: "Les soldats mexicains marchent vers le nord au-delà de l’ancienne ligne du Presidio, pénétrant dans le vaste pays argenté que les nations Chichimeca défendent depuis longtemps. Culiacan et la frontière nord sont désormais sous l'aigle mexicain. Avec ces territoires sécurisés, le trésor gonfle et l’armée se renforce."
 nd_mex.7.a: "La frontière avance sous l'aigle et le serpent."
 nd_mex.8.t: "Empire d'Anahuac"
 nd_mex.8.d: "L'empire mexicain s'étend désormais du désert de Sonora jusqu'aux rives du Rio Grande. La question est de savoir comment gouverner ce domaine élargi. Certains généraux conseillent une main de fer : des campagnes militaires rapides pour écraser toute résistance et renforcer l'autorité centrale. D'autres se tournent vers le modèle du Plan de Iguala d'Iturbide : une grande cour qui lie les élites provinciales par la diplomatie, les honneurs et la gouvernance partagée."
 nd_mex.8.a: "Règle avec discipline : l’empire a besoin d’une main de fer."
 nd_mex.8.b: "Gagnez les cœurs à la cour : la loyauté accordée gratuitement dure."
 nd_mex.9.t: "Destin continental"
 nd_mex.9.d: "Des déserts de Californie aux jungles du Guatemala, l’Empire mexicain est devenu la puissance dominante de l’hémisphère occidental. C’est la vision qui se réalise : un grand empire américain qui soit l’égal de n’importe quelle puissance européenne. L’armée qui a sécurisé ce territoire doit désormais s’organiser pour le défendre."
 nd_mex.9.a: "Construisez la plus grande armée des Amériques."
 nd_mex.9.b: "Laissons la diplomatie cimenter ce que l’épée a gagné."
 nd_mex.10.t: "La Fondation Argent"
 nd_mex.10.d: "La république a choisi une voie différente de celle des bâtisseurs d’empire. Plutôt que de rassembler des armées pour la conquête, le Mexique se tourne vers les richesses de son sol. Les mines d'argent de Guanajuato, Zacatecas et Taxco constituent le fondement d'une république prospère."
 nd_mex.10.a: "Le peso sera le fondement de la république."
 nd_mex.11.t: "La République Libérale"
 nd_mex.11.d: "Les institutions financières de la jeune république mûrissent. Les banques gèrent les flux d'argent, les marchands de cacao négocient les prix sur le marché mondial et les réseaux commerciaux s'étendent du Golfe au Pacifique. Deux visions émergent pour l'avenir économique du Mexique."
 nd_mex.11.a: "Le peso d'argent deviendra l'étalon."
 nd_mex.11.b: "Construisez des marchés qui servent les gens, et non quelques-uns."
 nd_mex.12.t: "Arsenal de la démocratie"
 nd_mex.12.d: "Le Mexique est au seuil d’une nouvelle ère. La révolution scientifique a atteint les Amériques, et la république dispose de l’argent, de la main-d’œuvre et des institutions nécessaires pour s’industrialiser. Les écoles se multiplient à travers le pays et une nouvelle génération de scientifiques et d'ingénieurs mexicains se prépare à transformer les matières premières en produits finis."
 nd_mex.12.a: "Construisez les écoles : l’éducation est l’avenir."
 nd_mex.12.b: "Une république éclairée n’a pas besoin d’empire."
 STATIC_MODIFIER_NAME_nd_mex_dest_iron_hand: "Main de fer"
 STATIC_MODIFIER_DESC_nd_mex_dest_iron_hand: "La discipline militaire et les campagnes rapides renforcent l'autorité mexicaine à travers la frontière. L'armée se déplace rapidement et frappe fort, même si la guerre constante a des conséquences néfastes sur la nation."
 STATIC_MODIFIER_NAME_nd_mex_dest_imperial_court: "Cour Impériale"
 STATIC_MODIFIER_DESC_nd_mex_dest_imperial_court: "La cour mexicaine, calquée sur les monarchies européennes, lie les élites provinciales par la diplomatie, les titres et la gouvernance partagée. Une cour composée de nombreuses nations, unies sous l'aigle."
 STATIC_MODIFIER_NAME_nd_mex_dest_continental_army: "Armée continentale"
 STATIC_MODIFIER_DESC_nd_mex_dest_continental_army: "Une armée permanente massive organisée selon des lignes modernes, capable de soutenir des opérations dans tout l’hémisphère occidental."
 STATIC_MODIFIER_NAME_nd_mex_dest_american_dynasty: "Dynastie américaine"
 STATIC_MODIFIER_DESC_nd_mex_dest_american_dynasty: "L'Empire mexicain impose le respect grâce à son prestige diplomatique et à ses relations dynastiques, étendant son influence à travers l'hémisphère."
 STATIC_MODIFIER_NAME_nd_mex_dest_silver_standard: "Étalon Argent"
 STATIC_MODIFIER_DESC_nd_mex_dest_silver_standard: "Le peso d’argent mexicain devient la norme de confiance du commerce hémisphérique, finançant une marine marchande et une tradition navale croissante."
 STATIC_MODIFIER_NAME_nd_mex_dest_peoples_market: "Marché populaire"
 STATIC_MODIFIER_DESC_nd_mex_dest_peoples_market: "Les banques coopératives et les marchés ouverts canalisent la richesse en argent vers le citoyen commun. Le maintien de l'armée souffre à mesure que les ressources affluent vers les institutions civiles."
 STATIC_MODIFIER_NAME_nd_mex_dest_industrial_dawn: "L’aube industrielle"
 STATIC_MODIFIER_DESC_nd_mex_dest_industrial_dawn: "Les usines mexicaines produisent des biens destinés à l’exportation à travers le Pacifique et au-delà. Une nouvelle classe d’industriels projette la puissance commerciale mexicaine vers des rivages lointains."
 STATIC_MODIFIER_NAME_nd_mex_dest_enlightened_republic: "République éclairée"
 STATIC_MODIFIER_DESC_nd_mex_dest_enlightened_republic: "Le Mexique montre l'exemple : une république éclairée dont la force navale et les compétences diplomatiques méritent le respect du monde entier."
 nd_mex_palacio_imperial: "Palais Impérial"
 nd_mex_palacio_imperial_desc: "Le siège de l'empereur mexicain, un grand palais digne d'une puissance continentale. C’est à partir de là que l’empire est administré et que le destin des Amériques est façonné."
 nd_mex_imperial_court: "Entretien de la Cour Impériale"
 nd_mex_imperial_court_desc: "Le palais impérial a besoin de tissus fins pour le mobilier de cérémonie, de papier pour la bureaucratie impériale, de meubles pour les grandes salles et d'outils pour une rénovation constante."
 nd_mex_escuela_nacional: "École Nationale"
 nd_mex_escuela_nacional_desc: "Une école préparatoire nationale qui transforme la jeunesse mexicaine en citoyens informés, incarnant l'engagement de la république en faveur de l'éducation universelle et du progrès scientifique."
 nd_mex_school_supplies: "Fournitures scolaires"
 nd_mex_school_supplies_desc: "L'école nationale a besoin de papier et de livres pour l'enseignement, ainsi que de tissus pour les uniformes et l'ameublement."

 # ===== BUREAUCRACIES =====
 mex_plan_de_iguala_bureaucracy: "Plan d'Iguala"
 mex_plan_de_iguala_bureaucracy_desc: "Les trois garanties d'Iturbide du 24 février 1821 - Religion, Indépendance, Union - donnèrent au nouvel État mexicain sa seule doctrine fondatrice largement acceptée, réunissant les royalistes péninsulaires, les libéraux criollos et les troupes de caste sous la bannière catholique-monarchique-criollo de l'armée Trigarante. Soutenu, il lie une nation racialement hétérogène sous des symboles partagés. Négligé, le consensus se fracture le long des lignes de fracture qu’il avait masquées."
 mex_patronato_eclesiastico_bureaucracy: "Patronato Ecclésiastique"
 mex_patronato_eclesiastico_bureaucracy_desc: "Inherited from the Spanish Bourbons, the Real Patronato gives the Mexican state the right to nominate bishops, collect tithes, and try clerics in church courts under the fuero eclesiastico. The church returns the favour by lending capital at favourable rates and disciplining rural parishes, but Jose Maria Luis Mora and the liberals from 1833 onward will demand the fueros' abolition as the price of a modern republic."
 mex_caudillismo_bureaucracy: "Système de caudillos"
 mex_caudillismo_bureaucracy_desc: "Mexican politics from Iturbide's 1822 coronation through Santa Anna's first presidency in 1833 ran on regional military strongmen who raised personal armies, issued pronunciamientos, and rotated through the National Palace at gunpoint. The caudillo system delivers light cavalry across the Bajio in days and levies from local clientele, and delivers presidential instability on the same schedule."
 mex_hacienda_latifundia_bureaucracy: "Hacienda Latifundia"
 mex_hacienda_latifundia_bureaucracy_desc: "Le grand domaine rural, issu de l'encomienda coloniale et consolidé sous les réformes bourboniennes, domine l'agriculture mexicaine du plateau central jusqu'au Yucatan. Les Hacendados détiennent des peons de dette (peones acasillados) liés à la tienda de raya, approvisionnent les marchés urbains en céréales et paient leurs salaires en certificats. Le système nourrit les villes et finance l’aristocratie foncière au prix d’une servitude permanente pour la dette rurale et d’une stagnation des rendements."
 mex_republicas_de_indios_bureaucracy: "Républiques indiennes"
 mex_republicas_de_indios_bureaucracy_desc: "A colonial institution the 1821 republic formally abolished yet preserved in practice for decades: the segregated indigenous community, governed by elected alcaldes and gobernadores, paying communal tribute, and holding inalienable village lands (tierras comunales) outside the Spanish-American legal order. The shell protects Mexico's indigenous majority, but liberals already press to break up the comunales and put them on the open market."
 mex_siete_leyes_bureaucracy: "Siete Leyes et Departamentos"
 mex_siete_leyes_bureaucracy_desc: "The Centralist Republic of 1836 dissolved the federal states of the 1824 Constitution into appointive Departamentos under presidentially-named governors and property-qualified Juntas. A Supremo Poder Conservador, drawn from the Bourbon cameralist tradition, gained the power to veto Congress and depose the president. The machinery suppressed regional rebellion at the price of provoking it: Zacatecas in 1835 and Texas in 1836 were the warning."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_mex_bureaucracy_authority: "Autorité institutionnelle mexicaine"
 AUTO_MODIFIER_DESC_nd_mex_bureaucracy_authority: "The offices of the Bourbon viceroyalty are inherited by Mexico. Three institutions can be kept at a time."
