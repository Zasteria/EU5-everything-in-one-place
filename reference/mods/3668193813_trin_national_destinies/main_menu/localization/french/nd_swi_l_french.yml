l_french:
 STATIC_MODIFIER_NAME_nd_swi_armed_neutrality: "Neutralité armée"
 STATIC_MODIFIER_DESC_nd_swi_armed_neutrality: "La Confédération suisse a choisi la voie de la neutralité armée, une nation qui ne mène aucune guerre à l’étranger mais se rend imprenable chez elle. Derrière les murs des montagnes et les milices cantonales, les Eidgenossen forgent une république qui ne répond à aucun empereur, roi ou pape."
 STATIC_MODIFIER_NAME_nd_swi_reislaufer_tradition: "Tradition Reislufer"
 STATIC_MODIFIER_DESC_nd_swi_reislaufer_tradition: "Les cantons ont fait honneur à leur réputation martiale et envoient leurs fils combattre au service des rois d'Europe. Les mercenaires suisses constituent l’infanterie la plus redoutée du continent, et l’or des retraites qui retourne dans les vallées alpines enrichit une nation de guerriers."
 STATIC_MODIFIER_NAME_nd_swi_perpetual_peace: "Paix perpétuelle"
 STATIC_MODIFIER_DESC_nd_swi_perpetual_peace: "Après des décennies d'effusion de sang dans les guerres italiennes, les Suisses ont conclu une paix durable qui remodèle leur place en Europe, non plus des agresseurs, mais des neutres respectés dont la parole a du poids précisément parce qu'ils ne tirent plus l'épée."
 STATIC_MODIFIER_NAME_nd_swi_reformation_spirit: "Esprit de la Réforme"
 STATIC_MODIFIER_DESC_nd_swi_reformation_spirit: "Les enseignements de Zwingli et de Calvin ont balayé les cantons suisses, mettant un nouvel accent sur l'alphabétisation, l'éducation et la relation directe de l'individu avec les Écritures."
 STATIC_MODIFIER_NAME_nd_swi_counter_reformation_zeal: "Zèle contre-réforme"
 STATIC_MODIFIER_DESC_nd_swi_counter_reformation_zeal: "Les cantons catholiques se sont ralliés à la défense de l'ancienne foi, renforçant leur dévouement et leurs efforts missionnaires contre la marée protestante."
 nd_swi.1.t: "La naissance de l'Eidgenossenschaft"
 nd_swi.1.d: "The Swiss cantons have achieved what seemed impossible: from scattered mountain communities bound only by oaths of mutual defense, a new nation has been forged in the heart of Europe. The Confederation stands as proof that free men need not bow to any prince. But what kind of nation shall this be?\n\nThe alpine passes command the trade routes between Italy and northern Europe. The cantonal militias have shattered every army sent against them. The question is not whether Switzerland will endure, but what it will become: a fortress unto itself, or a nation whose warriors march under foreign banners for gold and glory.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_swi.1.a: "Nous serons une forteresse ; personne ne traversera nos montagnes sans y être invité"
 nd_swi.1.b: "Nos brochets sont en location. Que les rois d'Europe soumissionnent pour notre service"
 nd_swi.2.t: "La paix perpétuelle de 1516"
 nd_swi.2.d: "The disasters of the Italian Wars, the bloodbath at Marignano where Swiss pikemen fell in their thousands against French artillery, the futile sieges and broken alliances, have taught the Confederation a bitter lesson. War abroad brings glory to individuals but ruin to the state.\n\nThe Treaty of Perpetual Peace with France, signed in Fribourg in 1516, marks a turning point. Switzerland will no longer fight wars of conquest. In exchange, the French crown gains the right to recruit Swiss mercenaries, but the Confederation itself stands apart from European conflicts, its neutrality purchased not with weakness but with the demonstrated ferocity of its citizens."
 nd_swi.2.a: "Que cette paix perdure ; notre force réside dans notre retenue"
 nd_swi.3.t: "La Réforme Suisse"
 nd_swi.3.d: "The Confederation faces its gravest internal crisis. Huldrych Zwingli in Zurich and later John Calvin in Geneva have torn apart the religious unity that bound the cantons together. Catholic and Protestant cantons eye each other with suspicion, and the Kappel Wars have already spilled blood between brothers.\n\nYet from this crucible of confessional strife, something unexpected emerges: a grudging tolerance born of necessity. Neither side can crush the other without destroying the Confederation itself. The Swiss must find a way to live with their differences, or perish divided."
 nd_swi.3.a: "Adoptez le nouvel apprentissage. Laissons les Écritures et la raison nous guider"
 nd_swi.3.b: "Tenez bon à la vraie foi ; les anciennes méthodes nous ont bien servi"
 nd_swi.4.t: "L’essor du secteur bancaire genevois"
 nd_swi.4.d: "Since Bishop Adhémar Fabri granted Genevan bankers permission to charge interest in 1387, the city has grown into one of Europe's premier financial centers. The great trade fairs draw merchants and financiers from across the continent, and Calvin's pragmatic reinterpretation of usury laws has further loosened the constraints on commerce.\n\nSwiss banking houses now manage the wealth of princes and merchants alike. The counting houses of Geneva, Basel, and Zurich form a financial network that spans the continent, discreet, efficient, and answerable only to their cantonal councils."
 nd_swi.4.a: "L'or afflue vers ceux qui tiennent leurs promesses et leur silence"
 nd_swi.5.t: "L'art de la précision"
 nd_swi.5.d: "Huguenot refugees fleeing persecution in France have brought their extraordinary skill in horology to Geneva, where the art of watchmaking has taken root and flourished. Swiss ateliers now produce the finest timepieces in Europe, intricate mechanisms of gears and springs that measure the hours with unprecedented accuracy.\n\nWhat began as a craft for wealthy patrons is becoming an industry. The precision demanded by watchmaking drives innovation in metalwork, optics, and engineering. The Swiss reputation for meticulous craftsmanship, already established in arms and textiles, now finds its ultimate expression in the exquisite mechanisms ticking away in workshops from Geneva to Schaffhausen."
 nd_swi.5.a: "La précision est la vertu suisse, dans la guerre, dans la finance et maintenant dans l'artisanat"
 nd_swi_letzi_fortifications: "Fortifications du Letzi"
 nd_swi_letzi_fortifications_desc: "La construction de murs de barrière Letzi à travers les vallées alpines et les abords des lacs, canalisant les envahisseurs vers des zones de destruction préparées."
 nd_swi_alpine_halberdiers: "Hallebardiers alpins"
 nd_swi_alpine_halberdiers_desc: "Les guerriers des montagnes qui brandissaient la hallebarde, une arme typiquement suisse combinant hache, crochet et pointe, avec un effet dévastateur contre les chevaliers en armure."
 nd_swi_alpine_crossbowmen: "Arbalétriers alpins"
 nd_swi_alpine_crossbowmen_desc: "Des tireurs d'élite suisses se sont entraînés à l'utilisation de l'arbalète en terrain montagneux, fournissant un soutien à distance avant que les hallebardiers ne se rapprochent pour tuer."
 nd_swi_communal_oath: "Serment communautaire"
 nd_swi_communal_oath_desc: "La tradition de l'Eidgenossenschaft, le serment juré de défense mutuelle qui lie les communautés libres sans suzeraineté féodale."
 nd_swi_alpine_passes: "Commerce des cols alpins"
 nd_swi_alpine_passes_desc: "Control of the great alpine passes, the Gotthard, Simplon, and Great St Bernard, that connect northern and southern Europe. The valleys along each road carry the merchants' bales by stages, from one Sust to the next."
 nd_swi_sempach_legacy: "L'héritage de Sempach"
 nd_swi_sempach_legacy_desc: "La victoire de Sempach en 1386 qui a transformé les Suisses de paysans rebelles en une puissance militaire reconnue et redoutée dans toute l'Europe."
 nd_swi_tagsatzung_tradition: "Tagsatzung Tradition"
 nd_swi_tagsatzung_tradition_desc: "L'institution de la Tagsatzung, la diète fédérale où les délégués cantonaux négociaient la politique par consensus plutôt que par commandement."
 nd_swi_gevierthaufen: "Tactiques de Gevierthaufen"
 nd_swi_gevierthaufen_desc: "The development of the Gevierthaufen, massive pike columns of thousands of disciplined infantrymen advancing in coordinated echelons. Every canton musters its able men and picks the Auszug, the first call, to fill the column."
 nd_swi_mercenary_contracts: "Capitulations de mercenaires"
 nd_swi_mercenary_contracts_desc: "L'institutionnalisation du service mercenaire, les gouvernements cantonaux négociant des accords formels de capitulation avec des puissances étrangères."
 nd_swi_textile_industry: "Industrie textile suisse"
 nd_swi_textile_industry_desc: "La production textile florissante était centrée sur Saint-Gall, Zurich et Bâle, spécialisée dans le lin, la laine et plus tard la soie."
 nd_swi_alpine_hospices: "Hospices alpins"
 nd_swi_alpine_hospices_desc: "Le réseau d'hospices entretenu par les ordres monastiques le long des grands cols alpins, offrant refuge et soins aux voyageurs et pèlerins."
 nd_swi_swiss_guard_heritage: "Patrimoine de la Garde Suisse"
 nd_swi_swiss_guard_heritage_desc: "Le prestige du service militaire suisse, incarné par la Garde suisse pontificale, témoignage ultime de la réputation martiale suisse."
 nd_swi_pike_warfare: "Guerre des brochets suisses"
 nd_swi_pike_warfare_desc: "La perfection de la tactique de l'équerre qui a fait de l'infanterie suisse la terreur des champs de bataille européens, de Grandson à Novare."
 nd_swi_reislaufer_service: "Service Reislufer"
 nd_swi_reislaufer_service_desc: "La tradition mercenaire professionnelle des Reislufer, des soldats suisses qui louaient leurs services au plus offrant dans toute l'Europe."
 nd_swi_perpetual_peace_advance: "Paix perpétuelle"
 nd_swi_perpetual_peace_advance_desc: "Le Traité de paix perpétuelle avec la France en 1516, marquant le tournant décisif de la Suisse des guerres de conquête."
 nd_swi_geneva_banking: "Banque à Genève"
 nd_swi_geneva_banking_desc: "L'essor de Genève en tant que place financière européenne, s'appuyant sur ses foires commerciales médiévales et l'approche pragmatique de l'usure de Calvin."
 nd_swi_printing_and_learning: "Impression et apprentissage"
 nd_swi_printing_and_learning_desc: "L'émergence de Bâle comme centre de l'imprimerie et de l'érudition humaniste, siège d'Erasmus et des grandes maisons d'édition."
 nd_swi_civic_governance: "Gouvernance civique"
 nd_swi_civic_governance_desc: "La tradition suisse de l'autonomie municipale à travers des conseils municipaux élus, établissant les bases du républicanisme démocratique."
 nd_swi_reformation_crossroads: "Carrefour de la Réforme"
 nd_swi_reformation_crossroads_desc: "L'expérience suisse de la Réforme, où Zwingli et Calvin ont remodelé le christianisme depuis Zurich et Genève, tandis que les cantons catholiques tenaient bon."
 nd_swi_cantonal_sovereignty: "Souveraineté cantonale"
 nd_swi_cantonal_sovereignty_desc: "Le principe selon lequel chaque canton conserve la souveraineté sur ses affaires intérieures, créant une forme de gouvernance décentralisée unique."
 nd_swi_watchmaking_tradition: "Tradition horlogère"
 nd_swi_watchmaking_tradition_desc: "L'implantation de l'horlogerie suisse, amenée par les réfugiés huguenots à Genève et répandue dans les montagnes du Jura."
 nd_swi_arsenal_system: "Système d'arsenal"
 nd_swi_arsenal_system_desc: "Le système d'arsenal cantonal maintient des stocks d'armes et d'équipements afin que chaque citoyen puisse être armé dans les heures qui suivent un appel au service."
 nd_swi_swiss_musketeer_corps: "Mousquetaires suisses"
 nd_swi_swiss_musketeer_corps_desc: "Des soldats suisses adoptent les armes à poudre tout en conservant leur discipline traditionnelle et leur savoir-faire en matière de combat en montagne."
 nd_swi_civic_humanism: "Humanisme civique suisse"
 nd_swi_civic_humanism_desc: "La tradition intellectuelle combinant les idéaux républicains classiques avec la gouvernance communale suisse, florissante à Bâle et à Zurich."
 nd_swi_cantonal_militia_system: "Système de milice cantonale"
 nd_swi_cantonal_militia_system_desc: "Le système de milice modernisé prescrit par le traité fédéral, obligeant chaque canton à maintenir un contingent permanent de soldats entraînés."
 nd_swi_helvetic_banking: "Banque Helvétique"
 nd_swi_helvetic_banking_desc: "La maturation du secteur bancaire suisse depuis ses origines lors des salons de Genève jusqu'à devenir des institutions financières sophistiquées au service de toute l'Europe."
 nd_swi_armed_neutrality_doctrine: "Doctrine de la neutralité armée"
 nd_swi_armed_neutrality_doctrine_desc: "L'officialisation de la neutralité armée comme doctrine de l'État suisse, la paix par la force, défendue par chaque citoyen."
 nd_swi_anti_absolutism: "Anti-absolutisme"
 nd_swi_anti_absolutism_desc: "Le rejet par principe de la Suisse de la monarchie absolutiste, maintenant les traditions républicaines tandis que les rois d'Europe concentrent le pouvoir."
 nd_swi_cheese_dairy_trade: "Commerce de fromage et de produits laitiers"
 nd_swi_cheese_dairy_trade_desc: "Le développement de l'élevage laitier alpin et de la production fromagère suisse en une industrie d'exportation majeure, notamment l'Emmental et le Gruyre."
 nd_swi_shooting_tradition: "Tradition de tir"
 nd_swi_shooting_tradition_desc: "La tradition suisse des festivals de tir communautaires et des compétitions de tir de précision, garantissant à chaque citoyen le maintien de sa préparation militaire."
 nd_swi_federal_constitution: "Constitution fédérale"
 nd_swi_federal_constitution_desc: "L'adoption d'une constitution fédérale moderne établissant un gouvernement central permanent tout en préservant l'autonomie cantonale."
 nd_swi_precision_manufacturing: "Fabrication de précision"
 nd_swi_precision_manufacturing_desc: "L’expansion de l’artisanat de précision suisse de l’horlogerie vers une fabrication et une ingénierie industrielles plus larges."
 nd_swi_swiss_sharpshooters: "Tireurs d'élite suisses"
 nd_swi_swiss_sharpshooters_desc: "Des tireurs d'élite combinant la tradition du tir suisse avec des armes à feu rayées modernes, excellant dans la guerre en montagne."
 nd_swi_financial_center: "Place financière"
 nd_swi_financial_center_desc: "L'émergence de la Suisse en tant que place financière prééminente d'Europe, fondée sur la discrétion bancaire, la stabilité politique et l'État de droit."
 nd_swi_popular_education: "Éducation populaire"
 nd_swi_popular_education_desc: "L'engagement de la Suisse en faveur d'une éducation publique universelle, inspiré par la philosophie éducative de Pestalozzi, produit l'une des populations les plus alphabétisées d'Europe."
 nd_swi_professional_diplomacy: "Diplomatie professionnelle"
 nd_swi_professional_diplomacy_desc: "L’expertise suisse en tant que médiateur et diplomate neutre, s’appuyant sur des siècles d’équilibre entre voisins puissants."
 a_nd_swi_halberdiers: "Hallebardiers suisses"
 a_nd_swi_halberdiers_desc: "Guerriers des montagnes brandissant la hallebarde, une arme combinée composée d'une hache, d'un crochet et d'une pointe qui pouvait tirer les chevaliers de leur cheval et ouvrir une armure. Leur habileté sur terrain accidenté est inégalée."
 a_nd_swi_crossbowmen: "Arbalétriers suisses"
 a_nd_swi_crossbowmen_desc: "Les tireurs d'élite alpins pleuvent sur les ennemis depuis leurs positions en montagne, adoucissant les formations avant que les hallebardiers ne chargent."
 a_nd_swi_pike_square: "Place Suisse du Brochet"
 a_nd_swi_pike_square_desc: "Le Gevierthaufen en miniature, un bloc discipliné de piquiers entraînés à tenir une formation sous la charge de cavalerie et sous le feu de l'artillerie. Leur mur de pointes d'acier est presque impénétrable."
 a_nd_swi_musketeer: "Mousquetaire suisse"
 a_nd_swi_musketeer_desc: "Infanterie suisse qui s'est adaptée à la guerre à la poudre tout en conservant sa discipline légendaire et ses traditions de combat en montagne."
 a_nd_swi_auszug: "Auszug Pikemen"
 a_nd_swi_auszug_desc: "The first call of the cantonal levy: men picked at the muster, each bringing his own long pike, breastplate and iron helm. Packed into the great column, they broke the knights of Burgundy at Grandson, Murten and Nancy."
 a_nd_swi_cantonal_militia: "Milice cantonale"
 a_nd_swi_cantonal_militia_desc: "Citoyens-soldats du système de milice suisse modernisé, combinant l'exercice du mousquet avec l'esprit combatif traditionnel suisse. Chaque homme est un soldat, chaque canton une forteresse."
 a_nd_swi_sharpshooter: "Tireur d'élite suisse"
 a_nd_swi_sharpshooter_desc: "Des tireurs d’élite issus de la tradition du tir suisse, alliant fabrication de précision et savoir-faire de la guerre en montagne. Leur précision à distance est dévastatrice."
 nd_swi_letzi_wall: "Mur de Letzi"
 nd_swi_letzi_wall_desc: "Mur de barrière construit à l'approche d'une vallée alpine ou d'un lac, conçu pour canaliser les envahisseurs vers des positions défensives préparées. Les Letzi des premiers cantons forestiers pouvaient s'étendre sur des kilomètres."
 nd_swi_tagsatzung_hall: "Salle des balises"
 nd_swi_tagsatzung_hall_desc: "Une salle où les délégués cantonaux se réunissent pour débattre et décider de la politique fédérale par consensus. La Tagsatzung incarne le principe suisse selon lequel l’autorité découle du peuple."
 nd_swi_counting_house: "Maison des Comptes de Genève"
 nd_swi_counting_house_desc: "Une institution financière qui gère les dépôts, accorde des crédits et facilite le réseau complexe de commerce qui traverse les cols alpins de la Suisse."
 nd_swi_textile_manufactory: "Manufacture textile suisse"
 nd_swi_textile_manufactory_desc: "Un atelier produisant le linge de maison et les lainages raffinés qui ont fait de Saint-Gall, Zurich et Bâle des centres du commerce textile européen."
 nd_swi_horological_workshop: "Atelier d'horlogerie"
 nd_swi_horological_workshop_desc: "Un atelier où les maîtres horlogers fabriquent des garde-temps complexes d'une précision inégalée, expression ultime du savoir-faire suisse."
 nd_swi_arsenal: "Arsenal Suisse"
 nd_swi_arsenal_desc: "Un stock d'armes cantonal et une armurerie contenant les armes, les munitions et l'équipement nécessaires pour mobiliser la milice à tout moment."
 nd_swi_sust: "Sust"
 nd_swi_sust_desc: "The staging warehouse of a pass road. The valley's muleteers carry goods over their own stage and no further, so every bale and barrel rests here overnight, safe from weather and thieves, and pays the transit due that keeps the mule track open."
 nd_swi_alpine_hospice: "Hospice alpin"
 nd_swi_alpine_hospice_desc: "Refuge entretenu par des ordres religieux le long des grands cols alpins, offrant des soins aux voyageurs et pèlerins traversant les montagnes."
 nd_swi_rathaus: "Hôtel de ville suisse"
 nd_swi_rathaus_desc: "Un hôtel de ville où des conseils élus gouvernent les affaires communales, l'incarnation physique de l'autonomie républicaine suisse."
 nd_swi_schiessstand: "Schiesstand"
 nd_swi_schiessstand_desc: "Un champ de tir communal où les citoyens pratiquent le tir de précision, maintenant ainsi la préparation militaire qui est le devoir de tout Suisse."
 nd_swi_dairy_cooperative: "Coopérative laitière"
 nd_swi_dairy_cooperative_desc: "Une usine de transformation laitière alpine où les bergers mettent leur lait en commun pour produire les fromages qui ont fait la renommée de la laiterie suisse dans toute l'Europe."
 nd_swi_diplomatic_residence: "Résidence diplomatique"
 nd_swi_diplomatic_residence_desc: "Un terrain neutre où les émissaires étrangers se réunissent et où se déroulent les négociations, mettant à profit la réputation d'impartialité et de discrétion de la Suisse."
 nd_swi_letzi_garrison: "Garnison de Letzi"
 nd_swi_letzi_garrison_desc: "Des gardiens armés qui patrouillent les murs du Letzi, entretiennent les fortifications et se tiennent prêts à défendre les cols."
 nd_swi_tagsatzung_upkeep: "Administration de l'Assemblée"
 nd_swi_tagsatzung_upkeep_desc: "Les clercs, scribes et messagers qui tiennent les archives et la correspondance de l'assemblée cantonale."
 nd_swi_counting_house_operations: "Opérations bancaires"
 nd_swi_counting_house_operations_desc: "Les opérations financières complexes du comptoir, la gestion des comptes, l'octroi de lettres de crédit et la gestion des devises."
 nd_swi_textile_processing: "Traitement des textiles"
 nd_swi_textile_processing_desc: "Tissage de fibres de laine et de lin en tissus finis selon le système des corporations suisses, suivant la tradition des marchands de textile de Saint-Gall et de Bâle."
 nd_swi_watchmaking_craft: "Artisanat horloger"
 nd_swi_watchmaking_craft_desc: "Fabriquer des mécanismes de montre complexes à partir d’argent et de cuivre, produisant des montres exquises prisées dans toute l’Europe."
 nd_swi_arsenal_maintenance: "Entretien de l'Arsenal"
 nd_swi_arsenal_maintenance_desc: "L'entretien de l'arsenal cantonal, le nettoyage, la réparation et le stockage des armes et du matériel de la milice citoyenne."
 nd_swi_sust_upkeep: "Muleteers' Stage"
 nd_swi_sust_upkeep_desc: "Pack animals and their fodder, timber for the storehouse, and the ropes, saddles and scales of the muleteers' cooperative."
 nd_swi_hospice_care: "Soins palliatifs"
 nd_swi_hospice_care_desc: "Les provisions nécessaires pour maintenir un hospice alpin, de la nourriture, du carburant et des fournitures pour les voyageurs traversant les cols de montagne."
 nd_swi_rathaus_administration: "Administration de la Mairie"
 nd_swi_rathaus_administration_desc: "L'administration municipale gère les affaires quotidiennes du gouvernement municipal depuis le Rathaus."
 nd_swi_schiessstand_supply: "Fourniture de champ de tir"
 nd_swi_schiessstand_supply_desc: "Munitions et équipements pour le champ de tir communal où les citoyens maintiennent leur adresse au tir."
 nd_swi_cheese_production: "Production de fromage"
 nd_swi_cheese_production_desc: "La transformation du lait alpin en fromages à pâte dure qui peuvent survivre à de longs voyages jusqu'au marché à travers l'Europe."
 nd_swi_diplomatic_expenses: "Dépenses diplomatiques"
 nd_swi_diplomatic_expenses_desc: "Les coûts liés au maintien d’un terrain neutre pour la diplomatie internationale, la correspondance, l’hospitalité et la discrétion."
 levy_nd_swi_halberdier: "Prélèvement suisse sur la hallebardier"
 levy_nd_swi_halberdier_desc: "Les paysans des montagnes appelaient aux armes avec leurs hallebardes, poursuivant la tradition qui battit les armées des Habsbourg à Morgarten et Sempach."
 levy_nd_swi_auszug: "Auszug"
 levy_nd_swi_auszug_desc: "The picked first call of every canton, raised to fill the pike column when the Confederation marches."
 levy_nd_swi_cantonal_militia: "Prélèvement cantonal de la milice"
 levy_nd_swi_cantonal_militia_desc: "Citoyens-soldats élevés dans le cadre du système de milice cantonale, où tout homme valide est entraîné et équipé pour la défense de la Confédération."
 nd_swi_formed_tt: "La Suisse est constituée"
 nd_swi_path_a_tt: "Choisissez la neutralité armée"
 nd_swi_path_b_tt: "Choisissez Reislufer Tradition"
 nd_swi_dest_geneve_developed_tt: "We own #bold Geneva#! and its development is at least #bold 31#!"
 nd_swi_dest_basel_developed_tt: "We own #bold Basel#! and its development is at least #bold 24#!"
 nd_swi_dest_zurich_developed_tt: "We own #bold Zurich#! and its development is at least #bold 48#!"
 nd_swi_destiny: "Destin Suisse"
 nd_swi_destiny_desc: "La Confédération est formée. Choisissez maintenant la voie qui définira son héritage : une forteresse de liberté et de finance, ou un empire construit par les meilleurs soldats du monde."
 nd_swi_dest_alpine_bank: "Fondation bancaire alpine"
 nd_swi_dest_alpine_bank_desc: "Consolidate control over the Swiss cantons and establish the financial institutions that will make the Confederation Europe's most trusted banker. Requires banking institutions, 1,000 gold, and Geneva grown rich on its fairs."
 nd_swi_dest_banking_capital: "Capitale bancaire européenne"
 nd_swi_dest_banking_capital_desc: "Transform Switzerland into the financial heart of Europe. The counting houses of Geneva, Basel, and Zurich must become indispensable to every prince and merchant on the continent. Requires printing press, 2,000 gold, high prestige, and Basel built up as a city of printers and bankers."
 nd_swi_dest_perpetual_republic: "La République perpétuelle"
 nd_swi_dest_perpetual_republic_desc: "Achieve the ultimate expression of Swiss governance: a republic so stable, so prosperous, and so scientifically advanced that it endures when empires fall. Requires scientific revolution, 3,000 gold, the highest prestige, and Zurich grown into a city of banks and learned societies."
 nd_swi_dest_ticino_gateway: "Porte d'entrée vers l'Italie"
 nd_swi_dest_ticino_gateway_desc: "Cross the Alps and seize the Italian gateway. Bellinzona and Como command the passes into the Lombard plain, the first step toward a Swiss empire south of the mountains. Requires both cities, an army of 30,000, and 1,000 gold."
 nd_swi_dest_lombard_conquest: "Conquête lombarde"
 nd_swi_dest_lombard_conquest_desc: "Dominate the richest plain in Europe. Milano and Brescia (the workshops of Italy) must bow to Swiss arms. Requires both cities, the pike squares of Swiss Pike Warfare, an army of 50,000, high prestige, and 2,000 gold."
 nd_swi_dest_helvetic_empire: "Le Grand Empire Helvétique"
 nd_swi_dest_helvetic_empire_desc: "Forgez un empire s'étendant du Rhin au Pô. Strasbourg, Vérone et Turin doivent tous arborer la croix blanche. Nécessite les trois villes, une armée de 75 000 hommes, le plus haut prestige et 3 000 pièces d'or."
 nd_swi.6.t: "Le destin de l'Eidgenossenschaft"
 nd_swi.6.d: "La Confédération est constituée, mais son véritable caractère reste à déterminer. Les délégués cantonaux ont prêté serment et la croix blanche flotte au-dessus des cols alpins. Maintenant, le véritable travail commence : forger une nation à partir de communautés libres qui doivent décider si elles doivent se tourner vers l'intérieur ou vers l'extérieur, s'il faut construire des murs ou les dépasser."
 nd_swi.6.a: "Le serment nous lie - maintenant construisons dessus"
 nd_swi.7.t: "Fondements de la finance suisse"
 nd_swi.7.d: "The alpine cantons have embraced modern banking practices, and the counting houses multiply. Where once the Swiss were known only for their arms, they are now gaining a reputation for something equally powerful: discretion with other people's money. Geneva's trade fairs draw merchants and financiers from across Europe, and the Swiss franc is becoming a currency of trust.\n\nThe foundation is laid. What was once a collection of mountain peasants defending their valleys is becoming a sophisticated financial state."
 nd_swi.7.a: "La confiance est notre monnaie et nous ne la dévaloriserons jamais"
 nd_swi.8.t: "Les banquiers d'Europe"
 nd_swi.8.d: "Switzerland has achieved what no mountain nation was expected to achieve: it has become the banking capital of Europe. The counting houses of Geneva manage the wealth of kings. Basel's financiers underwrite the trade of nations. Zurich's discretion is legendary.\n\nThis prosperity brings a choice: invest in peaceful development and stable governance, or leverage this financial power to project Swiss prestige across the continent."
 nd_swi.8.a: "Investir dans nos cantons : la prospérité est une récompense en soi"
 nd_swi.8.b: "Faites savoir au monde que la neutralité suisse a un prix"
 nd_swi.9.t: "La République perpétuelle"
 nd_swi.9.d: "What the ancient Romans could not achieve (a republic that endures), the Swiss have accomplished. While empires rise and fall around them, the Confederation stands: prosperous, neutral, and free. The Swiss model of governance, where power flows from the people upward through cantonal assemblies, has become an inspiration to political thinkers across Europe.\n\nThis pinnacle demands a final choice: embrace constitutional liberalism as a beacon to the world, or consolidate financial power as the quiet architects of European prosperity."
 nd_swi.9.a: "Que notre constitution soit une lumière pour toutes les nations"
 nd_swi.9.b: "L’or parle plus fort que les constitutions"
 nd_swi.10.t: "Les chutes du Tessin"
 nd_swi.10.d: "Swiss pike columns have crossed the Alps and seized the gateway to Italy. Bellinzona's three castles (Castelgrande, Montebello, and Sasso Corbaro) now fly the white cross. Como, that jewel of the Lombard lakes, has been brought under Confederate control.\n\nThe Italian princes take notice. The Swiss are no longer content to defend their mountains. They are marching south, and their pikes are as sharp as their ambition."
 nd_swi.10.a: "L'Italie est ouverte devant nous - les piques ouvriront la voie"
 nd_swi.11.t: "Maîtres de Lombardie"
 nd_swi.11.d: "Milano has fallen. The richest city in northern Italy (its workshops, its armories, its great cathedral) now answers to Swiss authority. Brescia's renowned arms industry supplies the very weapons that conquered it. The Swiss Confederation has achieved what the Holy Roman Empire spent centuries failing to maintain: firm control over the Lombard plain.\n\nThe question now is how to maintain this empire. Train an elite corps of professional Reislaufer, or mobilize the full manpower of every canton?"
 nd_swi.11.a: "La qualité plutôt que la quantité : forgez les meilleurs soldats d'Europe"
 nd_swi.11.b: "Chaque Suisse est un soldat : ​​mobilisons-les tous"
 nd_swi.12.t: "Le Grand Empire Helvétique"
 nd_swi.12.d: "From Strasbourg on the Rhine to Verona on the Adige, from Turin at the foot of the western Alps to the ancient cantons of the Eidgenossen: the white cross commands an empire that no one believed possible. Swiss pikemen, who once fought only to defend their valleys, now garrison the great cities of Europe.\n\nThis is the Switzerland that Marignano never happened to, or rather, the Switzerland that won at Marignano and kept marching. The final question: rule through shock and discipline, or through the glory that draws warriors to your banner?"
 nd_swi.12.a: "La discipline et la vitesse décident des batailles"
 nd_swi.12.b: "Que la gloire soit notre agent de recrutement"
 STATIC_MODIFIER_NAME_nd_swi_dest_peaceful_prosperity: "Prospérité paisible"
 STATIC_MODIFIER_DESC_nd_swi_dest_peaceful_prosperity: "La neutralité suisse rapporte son plus grand dividende : un développement intérieur ininterrompu et des cantons satisfaits."
 STATIC_MODIFIER_NAME_nd_swi_dest_prestigious_neutrality: "Une neutralité prestigieuse"
 STATIC_MODIFIER_DESC_nd_swi_dest_prestigious_neutrality: "La neutralité suisse impose le respect dans toute l’Europe, même si l’entretien de l’armée permanente devient coûteux sans guerres réelles pour justifier son coût."
 STATIC_MODIFIER_NAME_nd_swi_dest_liberal_constitution: "Constitution libérale"
 STATIC_MODIFIER_DESC_nd_swi_dest_liberal_constitution: "Le modèle constitutionnel suisse inspire les penseurs politiques de toute l’Europe, accordant à la Confédération une influence diplomatique bien au-delà de sa taille."
 STATIC_MODIFIER_NAME_nd_swi_dest_financial_hegemony: "Hégémonie financière"
 STATIC_MODIFIER_DESC_nd_swi_dest_financial_hegemony: "Les banques suisses sont devenues les architectes discrets de la prospérité européenne, leurs réseaux financiers s’étendant sur tout le continent."
 STATIC_MODIFIER_NAME_nd_swi_dest_elite_reislaufer: "Reislufer d'élite"
 STATIC_MODIFIER_DESC_nd_swi_dest_elite_reislaufer: "The Swiss have invested in quality over quantity, producing the finest professional infantry in Europe, though domestic construction suffers from the martial focus."
 STATIC_MODIFIER_NAME_nd_swi_dest_mass_mobilization: "Mobilisation de masse"
 STATIC_MODIFIER_DESC_nd_swi_dest_mass_mobilization: "Chaque canton rassemble tous ses effectifs et les compagnies de mercenaires affluent sous la bannière confédérée pour bénéficier de primes réduites."
 STATIC_MODIFIER_NAME_nd_swi_dest_shock_and_terror: "Choc et terreur"
 STATIC_MODIFIER_DESC_nd_swi_dest_shock_and_terror: "Les armées suisses frappent à une vitesse dévastatrice et se renforcent rapidement, même si les dépenses liées à une campagne constante font monter les prix dans le pays."
 STATIC_MODIFIER_NAME_nd_swi_dest_glory_seekers: "Chercheurs de gloire"
 STATIC_MODIFIER_DESC_nd_swi_dest_glory_seekers: "La légende des prouesses martiales suisses attire des guerriers de toute l’Europe qui cherchent à combattre sous la bannière de la croix blanche."
 nd_swi_exchange_house: "Bourse Suisse"
 nd_swi_exchange_house_desc: "Une institution financière de premier plan où les richesses de l'Europe sont gérées avec la légendaire discrétion suisse : dépôts, lettres de crédit et change effectués à huis clos."
 nd_swi_exchange_operations: "Opérations d'échange"
 nd_swi_exchange_operations_desc: "Les opérations financières complexes de la maison de change : gérer les comptes, faciliter le commerce international et tenir les grands livres méticuleux exigés par les banques suisses."
 nd_swi_reislaufer_barracks: "Caserne Reislufer"
 nd_swi_reislaufer_barracks_desc: "Une installation militaire professionnelle où les soldats suisses sont formés aux arts de la guerre au brochet, au combat en montagne et aux formations disciplinées qui ont fait d'eux la terreur des champs de bataille européens."
 nd_swi_barracks_upkeep: "Entretien des casernes"
 nd_swi_barracks_upkeep_desc: "L'entretien d'une installation militaire professionnelle - armes, armes à feu, équipement en cuir et outils pour l'entraînement des soldats d'élite suisses."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_swi_bureaucracy_authority: "Eidgenossische Verwaltung"
 AUTO_MODIFIER_DESC_nd_swi_bureaucracy_authority: "The Confederation operates through a uniquely layered confederal order: the Tagsatzung as a federal diet, the Bundesbriefe as self-binding pacts, the Landsgemeinden as sovereign citizen-assemblies, the Pensionenwesen as fiscal-military export industry, the Gemeine Herrschaften as joint-canton dominion, and the Reformed magistracy as civic discipline. Three of these institutions can be sustained from the day the Confederation is formed."

 swi_tagsatzung_bureaucracy: "Tagsatzung"
 swi_tagsatzung_bureaucracy_desc: "La Diète fédérale de l'ancienne Confédération suisse. Chaque canton a envoyé deux délégués, liés par mandat de leur conseil local, à des séances de consensus tournant entre Baden, Lucerne, Zurich et Frauenfeld : jamais une capitale permanente. Du XVe siècle jusqu'au 12 septembre 1848, date à laquelle la diète assemblée adopta la première Constitution fédérale et se dissout dans le parlement bicaméral moderne, la Tagsatzung était l'appareil fonctionnel du gouvernement confédéral : lent, cantonal, structurellement allergique à l'autorité royale."

 swi_stanser_verkommnis_bureaucracy: "Stanser Verkommnis"
 swi_stanser_verkommnis_bureaucracy_desc: "Le Traité de Stans, conclu le 22 décembre 1481 après la médiation de dernière minute de l'ermite Niklaus von Flue, sauva la Confédération de la guerre civile entre cantons ruraux et urbains à propos du butin des guerres de Bourgogne. Il confirma le Pfaffenbrief de 1370 et le Sempacherbrief de 1393, interdisa les assemblées non autorisées, réglementa le partage proportionnel des terres conquises et obligea les cantons à s'entraider contre la sédition interne. L’épine dorsale institutionnelle des pactes auto-contraignants (le Bundesbriefe) qui a transformé une ligue défensive de trois en un système politique cohérent de treize cantons."

 swi_landsgemeinde_bureaucracy: "Landsgemeinde"
 swi_landsgemeinde_bureaucracy_desc: "L'assemblée souveraine en plein air de citoyens armés, en usage continu à Uri, Schwyz, Unterwald, Glaris, Zoug et Appenzell à partir des XIIIe et XIVe siècles. Les électeurs se réunissaient chaque année sur la Landsgemeindeplatz pour élire Landammann et les juges, ratifier le budget et décider des lois à main levée. Glaris tient son assemblée sans interruption depuis 1387 et Appenzell Rhodes-Intérieures depuis 1403. La forme d'autonomie la plus directe de l'Europe de l'époque moderne et un reproche structurel permanent à la juridiction noble."

 swi_pensionenwesen_bureaucracy: "Pensionenwesen"
 swi_pensionenwesen_bureaucracy_desc: "Le système de retraite du service extérieur qui a transformé les prouesses militaires suisses en revenus cantonaux. Après le traité de Fribourg de 1516, les cantons institutionnalisent les contrats de capitulation avec les couronnes étrangères : la France, la papauté, l'Espagne, la Savoie, la République néerlandaise et d'autres versent des pensions fixes aux trésors cantonaux en échange du droit de recruter des régiments suisses sur le sol suisse. En 1740, plus de 12 000 Suisses servaient uniquement avec la solde française. Les retraites maintenaient les impôts intérieurs à un niveau bas, rendaient les élites cantonales dépendantes des princes étrangers et suscitaient une condamnation religieuse allant de Zwingli aux réformateurs de la fin du XVIIIe siècle qui finirent par abolir le système."

 swi_gemeine_herrschaften_bureaucracy: "Gemeine Herrschaften"
 swi_gemeine_herrschaften_bureaucracy_desc: "Les bailliages communs : territoires soumis conjointement conquis et administrés conjointement par des groupes de cantons. L'Argovie (1415), la Thurgovie (1460), le Rheintal (1490) et les bailliages ultramontains au sud des Alpes (Bellizona, Lugano, Locarno, Mendrisio et le reste du Tessin actuel) pris au duché de Milan pendant les guerres d'Italie. Chacun était gouverné par un Landvogt alterné tous les deux ans par l'un des cantons cosseigneuriaux. Le système extrayait des revenus des sujets non cantonaux sans les admettre à la citoyenneté, finançait les dépenses confédérales et fut amèrement ressenti par les populations du bailliage jusqu'à ce que les Français l'abolissent en 1798."

 swi_sittenmandate_bureaucracy: "Mandat de siège de Zurich"
 swi_sittenmandate_bureaucracy_desc: "Les Mandats moraux de Zurich, corpus de la législation civico-religieuse votée par le Rat de Zurich depuis la réforme de Zwingli et reproduite à Genève, Bâle, Berne et Schaffhouse. Quelque 400 ordonnances émises entre 1520 et 1675 réglementaient les jurons, les jeux de hasard, la tenue vestimentaire, l'assistance aux sermons, le baptême des nouveau-nés, la forme des pierres tombales, les heures d'ouverture des tavernes et la conduite des mendiants. Appliqués par une magistrature fusionnant conseil municipal et consistoire, les mandats produisirent les populations civiques les plus disciplinées d'Europe et rattachèrent indissociablement l'Église réformée à l'État cantonal."
