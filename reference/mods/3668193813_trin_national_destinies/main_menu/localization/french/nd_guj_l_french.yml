l_french:
 STATIC_MODIFIER_NAME_nd_sultan_al_barr_wa_al_bahr: "Sultan de Terre et de Mer"
 STATIC_MODIFIER_DESC_nd_sultan_al_barr_wa_al_bahr: "À l’instar de Mahmud Begada, qui se faisait appeler Sultan al-Barr wa al-Bahr, le Gujarat étend sa puissance à la fois sur son arrière-pays et sur la mer d’Oman."
 STATIC_MODIFIER_NAME_nd_gateway_of_the_ocean: "Porte de l'Océan Indien"
 STATIC_MODIFIER_DESC_nd_gateway_of_the_ocean: "Les ports du Gujarat se situent au carrefour des routes commerciales les plus riches du monde et ses marchands sont devenus des partenaires indispensables de l'Afrique de l'Est à l'Asie du Sud-Est."
 STATIC_MODIFIER_NAME_nd_fortress_conqueror: "Conquérant des forteresses"
 STATIC_MODIFIER_DESC_nd_fortress_conqueror: "Dans la tradition de Mahmud Begada, qui a réduit les citadelles imprenables de Champaner et Junagadh, les armées du Gujarat se spécialisent dans la réduction patiente des bastions ennemis."
 STATIC_MODIFIER_NAME_nd_lord_of_diu: "Seigneur de Diu"
 STATIC_MODIFIER_DESC_nd_lord_of_diu: "Suite au développement par Mahmud Begada d'une puissante flotte au large de Diu, le Gujarat commande les approches de la mer d'Oman vers le sous-continent indien."
 STATIC_MODIFIER_NAME_nd_coastal_bulwark: "Rempart côtier"
 STATIC_MODIFIER_DESC_nd_coastal_bulwark: "Piqué par l'arrivée des intrus européens, le Gujarat a investi massivement dans les fortifications côtières et dans la préparation navale pour défendre ses côtes."
 STATIC_MODIFIER_NAME_nd_adopted_cannonry: "Canonnière adoptée"
 STATIC_MODIFIER_DESC_nd_adopted_cannonry: "Plutôt que de se retirer du défi européen, le Gujarat a adopté la technologie de la poudre à canon et la construction navale moderne pour rivaliser avec ses rivaux en mer."
 nd_guj.1.t: "Le sultanat du Gujarat"
 nd_guj.1.d: "The banner of Gujarat flies over the lands between the Rann of Kutch and the Gulf of Khambat. For generations, the merchants of Cambay and Surat have enriched these shores with the wealth of the Indian Ocean, while the sultans have carved a kingdom from the contested borderlands of western India.\n\nNow, as Gujarat stands united under a single crown, its ruler must decide what the sultanate shall become. Will it follow the path of Mahmud Begada, the Sultan of Land and Sea, building a military state that projects power across both its hinterland and the Arabian Sea? Or shall it embrace its destiny as the gateway of the Indian Ocean, a mercantile empire where trade and diplomacy are the instruments of greatness?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_guj.1.a: "Nous serons le Sultan de la Terre et de la Mer !"
 nd_guj.1.b: "Le Gujarat sera la porte de l'océan Indien."
 nd_guj.2.t: "Les conquêtes de Mahmud Begada"
 nd_guj.2.d: "Sultan Mahmud Begada has earned his name, 'Lord of Two Forts', through the conquest of the seemingly impregnable fortresses of Champaner and Junagadh. The Rajput stronghold of Champaner, perched atop its rocky plateau, fell only after a prolonged and determined siege. Junagadh, seat of the Chudasama dynasty at the foot of sacred Mount Girnar, was brought to heel soon after.\n\nThese victories have transformed Gujarat from a coastal sultanate into a major power of western India. Yet Mahmud's ambitions extend beyond land. He has appointed Malik Ayyaz, a trusted commander of humble origin, as governor of Diu, where a formidable fleet is being assembled to secure Gujarat's maritime interests.\n\nWill the Sultan continue to expand through conquest on land, or turn his gaze toward the sea?"
 nd_guj.2.a: "Les forteresses de l'Inde tomberont devant nous."
 nd_guj.2.b: "Notre destin repose sur les vagues."
 nd_guj.3.t: "La bataille de Diu"
 nd_guj.3.d: "The waters off Diu have run red with blood. A great fleet assembled by the Mamluk Sultanate of Egypt, supported by Gujarat's own warships and ships from Calicut, has clashed with the Portuguese Estado da India. The outcome has demonstrated the terrible power of European heavy cannon at sea.\n\nThe Portuguese victory at Diu in 1509 has shaken the established order of Indian Ocean trade. For centuries, Gujarat's merchants sailed these waters freely, their dhows carrying cotton and spices to every port from Zanzibar to Malacca. Now, European interlopers demand passes and tribute from Gujarati vessels in their own waters.\n\nGujarat must respond. Shall the sultanate fortify its coastline and prepare to resist these foreign aggressors, or study their methods and adopt their technology to compete on equal terms?"
 nd_guj.3.a: "Fortifiez chaque port : ils ne débarqueront pas sans opposition."
 nd_guj.3.b: "Apprenez leurs méthodes. Construisez leurs navires. Battez-les à leur propre jeu."
 nd_guj.4.t: "La gloire de Champaner-Pavagadh"
 nd_guj.4.d: "Following the conquest of Champaner, Sultan Mahmud Begada has transformed the ancient hill fortress into a magnificent new capital. Where once stood only Rajput battlements, a city of mosques, palaces, and gardens is rising. The Jama Masjid of Champaner, with its soaring minarets and 172 intricately carved pillars, represents the pinnacle of Indo-Islamic architecture: a synthesis of Hindu structural traditions and Islamic decorative arts found nowhere else in India.\n\nThe Kevada Masjid, the Nagina Masjid, and the Shahar ki Masjid each display a different facet of this unique architectural tradition. The Mandvi customs house speaks to Gujarat's continuing commercial vitality, while the Citadel Jahanpanah proclaims the sultanate's military strength.\n\nChampaner-Pavagadh stands as a monument to Gujarat's golden age."
 nd_guj.4.a: "Un témoignage de notre civilisation."
 nd_guj.5.t: "La diaspora marchande gujarati"
 nd_guj.5.d: "Gujarati merchants have established permanent trading communities across the entire Indian Ocean world. In the ports of Aden and Hormuz, in the bazaars of Malacca and the Malabar Coast, Gujarati traders are recognized by their distinctive dress and their legendary commercial acumen.\n\nThese merchants carry more than goods: they carry Gujarat's culture, language, and religious traditions to distant shores. Jain and Hindu merchants from Saurashtra and Kutch have built temples in East Africa. Muslim traders from Cambay have established mosques in Southeast Asia. The Gujarati diaspora has created a commercial network that spans half the globe, connected by family ties, shared language, and mutual trust.\n\nThis network gives Gujarat an intelligence advantage and commercial reach that no army could achieve."
 nd_guj.5.a: "Nos commerçants sont nos plus grands ambassadeurs."
 nd_guj_stepwell_engineering: "Ingénierie des puits à degrés"
 nd_guj_stepwell_engineering_desc: "Les puits à degrés vav du Gujarat comptent parmi les structures de gestion de l'eau les plus sophistiquées du monde médiéval, alliant prouesses techniques et architecture sacrée."
 nd_guj_muzaffarid_court: "Tribunal de Muzaffarid"
 nd_guj_muzaffarid_court_desc: "Les traditions administratives établies par la dynastie Muzaffarid après l'indépendance de Delhi offrent au Gujarat un système de gouvernance efficace et stable."
 nd_guj_dhow_tradition: "Tradition de construction de boutre"
 nd_guj_dhow_tradition_desc: "Les constructeurs navals du Gujarat ont perfectionné la construction des boutres : des navires rapides au gréement latin, parfaitement adaptés aux vents de mousson de l'océan Indien."
 nd_guj_cambay_trade: "Réseau commercial de Cambay"
 nd_guj_cambay_trade_desc: "Le port de Cambay est une plaque tournante du commerce international depuis des siècles, reliant le Gujarat au golfe Persique, à la mer Rouge et à l'Afrique de l'Est."
 nd_guj_early_tolerance: "Tolérance du Sultanat"
 nd_guj_early_tolerance_desc: "Le sultanat du Gujarat gouverne une population diversifiée de musulmans, d'hindous et de jaïns, maintenant la stabilité sociale grâce à des accommodements religieux pragmatiques."
 nd_guj_ghulam_tradition: "Tradition militaire de Ghulam"
 nd_guj_ghulam_tradition_desc: "Le système ghulam fournit aux sultans du Gujarat un corps de cavalerie esclave-soldats dont la loyauté repose entièrement sur le trône plutôt que sur un quelconque noble local."
 nd_guj_habshi_guards: "Garde du palais Habshi"
 nd_guj_habshi_guards_desc: "Les guerriers abyssins, les Habshis, servent de gardes de palais d'élite et de commandants militaires dans le sultanat du Gujarat, appréciés pour leurs compétences martiales et leur loyauté personnelle."
 nd_guj_begada_conquests: "Les conquêtes de Begada"
 nd_guj_begada_conquests_desc: "Le sultan Mahmud Begada a gagné son nom de Seigneur des Deux Forts en conquérant les forteresses apparemment imprenables de Champaner et Junagadh."
 nd_guj_patola_weaving: "Tissage de soie Patola"
 nd_guj_patola_weaving_desc: "The double-ikat Patola silk of Patan represents the most technically demanding textile art in India, producing fabrics treasured by royalty across the subcontinent."
 nd_guj_champaner_capital: "Champaner-Pavagadh"
 nd_guj_champaner_capital_desc: "La transformation de Champaner conquis en une magnifique capitale représente l'âge d'or de l'architecture indo-islamique dans l'ouest de l'Inde."
 nd_guj_bandhani_craft: "Artisanat Bandhani"
 nd_guj_bandhani_craft_desc: "The ancient Gujarati art of Bandhani, resist tie-dyeing, produces brilliantly colored textiles prized across the Indian Ocean world.\n\n#italic Available in: $nd_guj_karkhana$#!"
 nd_guj_battle_of_diu: "Bataille de Diu"
 nd_guj_battle_of_diu_desc: "L'affrontement entre la flotte du Gujarat et les navires de guerre portugais au large de Diu en 1509 marqua un tournant dans la guerre navale dans l'océan Indien et dans l'expansion européenne."
 nd_guj_ghurab_warfare: "Guerre des Ghurab"
 nd_guj_ghurab_warfare_desc: "Le ghurab, un navire de guerre à rames armé de canons, représente l'adaptation par le Gujarat des traditions navales arabes à l'ère de la poudre à canon."
 nd_guj_bahadur_shah_legacy: "L'héritage de Bahadur Shah"
 nd_guj_bahadur_shah_legacy_desc: "La résistance provocante du sultan Bahadur Shah contre l'empire moghol et les Portugais a démontré la détermination du Gujarat à maintenir son indépendance."
 nd_guj_indigo_industry: "Industrie des teintures indigo"
 nd_guj_indigo_industry_desc: "L'industrie de transformation de l'indigo du Gujarat produit de grandes quantités de colorant bleu pour la production textile nationale et l'exportation vers les marchés de l'océan Indien."
 nd_guj_merchant_diaspora: "Diaspora marchande gujarati"
 nd_guj_merchant_diaspora_desc: "Les marchands gujarati ont établi des communautés commerciales permanentes d'Aden à Malacca, créant ainsi un réseau commercial qui s'étend sur tout l'océan Indien."
 nd_guj_mercantile_law: "Droit commercial"
 nd_guj_mercantile_law_desc: "Les traditions juridiques du Gujarat en matière de résolution des différends commerciaux s'appuient à la fois sur la jurisprudence islamique et sur les coutumes commerciales locales, offrant ainsi un cadre stable au commerce international."
 nd_guj_reformed_cavalry: "Cavalerie réformée"
 nd_guj_reformed_cavalry_desc: "La cavalerie du Gujarat est passée de la tradition ghulam à une force provinciale professionnelle équipée d'armes à feu et entraînée aux tactiques modernes."
 nd_guj_surat_shipbuilding: "Chantiers navals de Surate"
 nd_guj_surat_shipbuilding_desc: "Les chantiers navals de Surat sont devenus l'un des principaux centres de construction navale de l'océan Indien, produisant des navires pour des clients nationaux et étrangers."
 nd_guj_surat_entrepot: "Entrepôt de Surate"
 nd_guj_surat_entrepot_desc: "Surate a éclipsé Cambay en tant que premier port du Gujarat, devenant un entrepôt international où les marchands européens, arabes, persans et indiens se rencontrent et font du commerce."
 nd_guj_communal_harmony: "Harmonie communautaire"
 nd_guj_communal_harmony_desc: "La tradition de gouvernance multiconfessionnelle du Gujarat, réunissant côte à côte les communautés jaïn, hindoue et musulmane, crée une société stable et prospère."
 nd_guj_european_gunnery: "Artillerie européenne"
 nd_guj_european_gunnery_desc: "Les chantiers navals de Surat ont intégré les techniques de tir navales européennes, produisant des navires de guerre combinant le savoir-faire indien et la puissance de feu européenne."
 nd_guj_mughal_textile_hub: "Centre textile moghol"
 nd_guj_mughal_textile_hub_desc: "Sous l'administration moghole, l'industrie textile du Gujarat s'est considérablement développée, fournissant des tissus de coton et de la soie aux marchés allant de la Turquie ottomane à la Chine Ming."
 nd_guj_surat_presidency: "Présidence de Sourate"
 nd_guj_surat_presidency_desc: "Surate est devenue le premier port de l'empire moghol, une ville cosmopolite où la richesse de l'Inde rencontre les réseaux commerciaux du monde."
 nd_guj_hundi_networks: "Réseaux bancaires Hundi"
 nd_guj_hundi_networks_desc: "Les banquiers et prêteurs d’argent gujarati ont développé le système hundi : un réseau sophistiqué de lettres de change qui facilite les échanges commerciaux dans tout l’océan Indien."
 nd_guj_fortified_cities: "Villes fortifiées"
 nd_guj_fortified_cities_desc: "Les principales villes du Gujarat sont protégées par de formidables murs et fortifications, héritage de siècles de conflits entre le sultanat, Mughal, Maratha et les puissances européennes."
 nd_guj_revenue_reform: "Réforme des revenus"
 nd_guj_revenue_reform_desc: "La collecte centralisée des impôts et les procédures administratives standardisées ont rationalisé le système fiscal du Gujarat, augmentant ainsi la part de la couronne dans l'immense richesse de la région."
 nd_guj_cotton_mechanization: "Mécanisation du coton"
 nd_guj_cotton_mechanization_desc: "Early mechanization of cotton processing (ginning, carding, and spinning) has begun to transform Gujarat's textile industry from artisanal craft to proto-industrial production.\n\n#italic Available in: $nd_guj_cotton_mill$#!"
 nd_guj_industrial_textiles: "Textiles industriels"
 nd_guj_industrial_textiles_desc: "L'industrie textile du Gujarat est pleinement industrialisée, avec des usines mécanisées produisant de grandes quantités de tissus en coton et de tissus fins pour les marchés mondiaux."
 nd_guj_naval_modernization: "Modernisation navale"
 nd_guj_naval_modernization_desc: "La marine du Gujarat a été reconstruite avec des bateaux à vapeur modernes et des navires à coque en fer, réaffirmant le contrôle traditionnel de la région sur la mer d'Oman."
 nd_guj_cultural_revival: "Renouveau culturel"
 nd_guj_cultural_revival_desc: "Une appréciation renouvelée du patrimoine architectural et des traditions textiles uniques du Gujarat entraîne une renaissance culturelle qui attire des universitaires et des artistes de tout le sous-continent."
 nd_guj_global_diaspora: "Diaspora mondiale"
 nd_guj_global_diaspora_desc: "La diaspora gujarati s'est étendue au-delà de l'océan Indien pour englober le monde entier, avec des communautés marchandes à Londres, Zanzibar, Singapour et au-delà."
 a_nd_guj_habshi_guard: "Garde Habshi"
 a_nd_guj_habshi_guard_desc: "Gardes du palais d'élite abyssiniens, appréciés pour leurs prouesses martiales et leur loyauté inébranlable envers le sultan."
 a_nd_guj_ghulam_cavalry: "Cavalerie Ghulam"
 a_nd_guj_ghulam_cavalry_desc: "Cavalerie lourde de soldats esclaves dont la loyauté repose entièrement sur le trône, formant la force de frappe mobile du sultanat."
 n_nd_guj_dhow: "Boutre gujarati"
 n_nd_guj_dhow_desc: "Un navire de commerce rapide au gréement latin, construit par les maîtres charpentiers du Gujarat pour les vents de mousson de l'océan Indien."
 n_nd_guj_ghurab: "Galère de guerre Ghurab"
 n_nd_guj_ghurab_desc: "Un navire de guerre à rames armé de canons, conçu pour les patrouilles dans la mer d'Oman et la guerre côtière."
 a_nd_guj_sipahi: "Sipahi-e-Gujarat"
 a_nd_guj_sipahi_desc: "Cavalerie provinciale réformée équipée d'armes à feu et entraînée aux tactiques interarmes de l'époque de la poudre à canon."
 n_nd_guj_surat_frigate: "Frégate de Surate"
 n_nd_guj_surat_frigate_desc: "Un navire de guerre d'influence européenne construit dans les chantiers navals de Surat, alliant savoir-faire indien et artillerie moderne."
 n_nd_guj_merchant_cruiser: "Croiseur marchand Surate"
 n_nd_guj_merchant_cruiser_desc: "Un grand navire marchand armé construit aux chantiers navals de Surat, conçu pour protéger les convois commerciaux lointains du Gujarat à travers l'océan Indien."
 nd_guj_vav: "Vav Puits à degrés"
 nd_guj_vav_desc: "Puits d'eau monumentaux à gradins alliant architecture sacrée et gestion pratique de l'eau, une caractéristique de l'ingénierie gujarati."
 nd_guj_karkhana: "Atelier Karkhana"
 nd_guj_karkhana_desc: "Une manufacture textile royale produisant des tissus fins, de la soie et des tissus teints pour la consommation intérieure et l'exportation."
 nd_guj_emporium: "Magasin de Cambay"
 nd_guj_emporium_desc: "Une grande maison de commerce au carrefour du commerce de l'océan Indien, où les marchands arabes, persans et indiens échangent les richesses de trois continents."
 nd_guj_jama_masjid: "Jama Masjid"
 nd_guj_jama_masjid_desc: "Une magnifique mosquée congrégationaliste de style indo-islamique, servant à la fois de centre de culte et de centre d'apprentissage religieux."
 nd_guj_mandvi: "Bureau des douanes de Mandvi"
 nd_guj_mandvi_desc: "Un bâtiment administratif portuaire qui collecte les tarifs et supervise le commerce maritime, garantissant le bon déroulement des échanges et le recrutement naval."
 nd_guj_dye_works: "Travaux de teinture Rangrez"
 nd_guj_dye_works_desc: "Une installation industrielle pour la transformation de l'indigo, du curcuma et d'autres colorants utilisés dans la célèbre industrie textile du Gujarat."
 nd_guj_hundi_house: "Maison bancaire Hundi"
 nd_guj_hundi_house_desc: "Institution financière spécialisée dans les lettres de change et l'assurance maritime, reliant les commerçants du Gujarat aux réseaux bancaires de tout l'océan Indien."
 nd_guj_cotton_mill: "Filature de coton du Gujarat"
 nd_guj_cotton_mill_desc: "Une usine textile proto-industrielle où l'égrenage, le cardage et la filature mécanisés transforment le coton brut en tissu à une échelle sans précédent."
 nd_guj_vav_upkeep: "Entretien du puits à degrés"
 nd_guj_vav_upkeep_desc: "Stone and tools to maintain the carved galleries and water channels of the stepwell, and timber for the lifting gear."
 nd_guj_karkhana_operations: "Patola Double-Ikat"
 nd_guj_karkhana_operations_desc: "Silk is dyed thread by thread before weaving, so that the pattern falls true on both faces of the cloth. A single length takes months."
 nd_guj_emporium_costs: "Coûts d'exploitation du magasin"
 nd_guj_emporium_costs_desc: "Timber and storage jars for the warehouses, and paper for the ledgers of the counting houses."
 nd_guj_masjid_upkeep: "Entretien de la mosquée"
 nd_guj_masjid_upkeep_desc: "Pierre, tissu et encens pour l'entretien continu, les cérémonies de prière et l'embellissement de la mosquée congrégationaliste."
 nd_guj_mandvi_operations: "Opérations des douanes"
 nd_guj_mandvi_operations_desc: "Du bois pour la réparation des quais, du papier pour les dossiers douaniers et les manifestes d'expédition, et des outils pour l'entretien du port."
 nd_guj_dye_processing: "Traitement des colorants"
 nd_guj_dye_processing_desc: "Plantes d'indigo et autres matières premières transformées en teintures textiles vibrantes."
 nd_guj_hundi_operations: "Opérations bancaires"
 nd_guj_hundi_operations_desc: "Paper, cloth and sealing wax for the bills of exchange, ledgers and correspondence that sustain the hundi network."
 nd_guj_mill_operations: "Opérations de l'usine"
 nd_guj_mill_operations_desc: "Le coton brut était égrené et filé en tissu à l'aide de machines alimentées au bois."
 nd_guj_bandhani_dyeing: "Teinture par nœuds Bandhani"
 nd_guj_bandhani_dyeing_desc: "Cotton cloth is tied in thousands of small knots and dyed bath after bath, leaving patterns of bright dots."
 nd_guj_mechanized_cotton: "Traitement mécanisé du coton"
 nd_guj_mechanized_cotton_desc: "Des machines fonctionnant à l’eau transforment le coton brut en tissu à une échelle sans précédent."
 levy_nd_guj_ghulam: "Prélèvement de cavalerie Ghulam"
 levy_nd_guj_ghulam_desc: "Cavaliers soldats-esclaves issus des foyers militaires du sultanat."
 nd_guj_formed_tt: "Le Gujarat a été formé"
 nd_guj_path_a_tt: "A choisi le sultan de la terre et de la mer"
 nd_guj_path_b_tt: "Choisissez la porte d'entrée de l'océan Indien"
 nd_guj_destiny: "Gujarat United"
 nd_guj_destiny_desc: "Une fois le Gujarat formé et la stabilité rétablie, le sultanat est prêt à poursuivre son destin national. Que ce soit par la conquête ou le commerce, l'avenir du Gujarat sera écrit dans les annales de l'histoire."
 nd_guj_dest_malwa_campaign: "Campagne à Malwa"
 nd_guj_dest_malwa_campaign_desc: "Le plateau fertile de Malwa, avec ses anciennes villes de Mandu et Ujjain, attire les armées du Gujarat. Le contrôle de cet arrière-pays sécurisera le flanc oriental du sultanat et fournira la richesse agricole nécessaire à de nouvelles conquêtes."
 nd_guj_dest_konkan_conquest: "Conquête du Konkan"
 nd_guj_dest_konkan_conquest_desc: "La côte du Konkan, qui s'étend au sud du Gujarat à Goa, est parsemée de ports riches tombés sous contrôle étranger ou rival. La prise de Chaul et de Goa donnera au sultanat le contrôle de la côte ouest de l'Inde et refusera ces ports aux intrus européens."
 nd_guj_dest_sultan_supreme: "Sultan Suprême"
 nd_guj_dest_sultan_supreme_desc: "De l’Indus au Gange, du Sind à Delhi même, le sultan du Gujarat revendique sa domination sur le cœur du sous-continent. Ce n'est qu'en occupant ces anciens sièges du pouvoir que le dirigeant du Gujarat pourra véritablement se qualifier de suprême."
 nd_guj_dest_cambay_developed_tt: "We hold #bold Khambat#! (Cambay) and it has at least 39 development"
 nd_guj_dest_cambay_revival: "Renaissance de Cambay"
 nd_guj_dest_cambay_revival_desc: "Before Gujarat can command the Indian Ocean, it must first revive the legendary prosperity of Cambay. Ensure cotton flows through the capital market, fill the treasury, and build up the port of Cambay itself."
 nd_guj_dest_hormuz_gateway: "Porte d'entrée d'Ormuz"
 nd_guj_dest_hormuz_gateway_desc: "La forteresse insulaire d’Ormuz contrôle l’entrée du golfe Persique, la route commerciale la plus riche de l’océan Indien. Les marchands du Gujarat y font du commerce depuis longtemps ; maintenant, le sultanat doit s’en emparer purement et simplement et établir un contrôle direct sur ce point d’étranglement vital."
 nd_guj_dest_ocean_empire: "Empire de l'océan Indien"
 nd_guj_dest_ocean_empire_desc: "De Kilwa, sur la côte africaine, à Malacca, aux portes de la mer de Chine méridionale, l'empire commercial du Gujarat s'étend sur tout l'océan Indien. Le contrôle de ces ports lointains couronne le sultanat comme le maître incontesté du commerce océanique."
 nd_guj.6.t: "Gujarat United"
 nd_guj.6.d: "The lands of Gujarat are united under a single banner. From the salt flats of Kutch to the teak forests of the southern hills, from the ancient port of Cambay to the rising docks of Surat, this sultanate commands both the wealth of the land and the trade of the sea.\n\nThe path ahead is ours to choose. Let us build upon this foundation and forge a destiny worthy of our people."
 nd_guj.6.a: "Notre destin commence maintenant."
 nd_guj.7.t: "La chute de Malwa"
 nd_guj.7.d: "Our armies have marched through the Vindhya passes and planted Gujarat's banner over the ancient cities of Malwa. The fortress-capital of Mandu, perched on its great plateau, and the sacred city of Ujjain, seat of astronomers and scholars, now answer to the sultanate.\n\nThe fertile black-soil plains of Malwa will feed our armies, while its strategic position opens the road to central India. The Sultan of Land and Sea advances."
 nd_guj.7.a: "Malwa est à nous. La campagne continue."
 nd_guj.8.t: "Le Konkan sécurisé"
 nd_guj.8.d: "The fall of Chaul and Goa has given Gujarat unbroken command of the western Indian coastline. Portuguese factories and Deccani garrisons alike have been swept aside. Our fleets now patrol from the Gulf of Kutch to the Malabar approaches without challenge.\n\nWith the Konkan coast secured, the sultan must decide how best to consolidate these gains. Shall we train our engineers in the systematic reduction of fortresses, turning Gujarat's army into the premier siege force of the subcontinent? Or shall we invest in heavy warships to project naval power across the Arabian Sea?"
 nd_guj.8.a: "Formez des ingénieurs de siège pour briser n'importe quelle forteresse."
 nd_guj.8.b: "Construisez une flotte pour commander la mer d’Oman."
 nd_guj.9.t: "Sultan Suprême"
 nd_guj.9.d: "From Thatta on the Indus to Delhi on the Yamuna, the Sultan of Gujarat now rules over lands that once belonged to the great empires of the subcontinent. The ancient Sultanate of Delhi, the Sindhi ports of the Indus delta, the rich plains of Hindustan: all now acknowledge Gujarat's supremacy.\n\nThis is the apex of Gujarati power. The sultan must now decide how to govern this vast empire. Shall we establish a magnificent imperial court in the tradition of the great Sultanates, overawing our subjects with the splendor of our administration? Or shall we rule through a network of intelligence and intrigue, ensuring no rebellion can take root undetected?"
 nd_guj.9.a: "Établissez une cour impériale d’une splendeur inégalée."
 nd_guj.9.b: "Règle par l'intelligence et un contrôle subtil."
 nd_guj.10.t: "La renaissance de Cambay"
 nd_guj.10.d: "The port of Cambay (Khambhat) has been restored to its legendary prosperity. Cotton bales fill the warehouses, merchants crowd the bazaars, and the sound of hammers rings from the shipyards. Gujarat's treasury overflows with the profits of commerce, and the city has grown to carry the trade.\n\nThis is only the beginning. The Indian Ocean awaits."
 nd_guj.10.a: "Nos marchands porteront la bannière du Gujarat dans chaque port."
 nd_guj.11.t: "La Perle du Golfe"
 nd_guj.11.d: "The fortress-island of Hormuz, commanding the narrow strait that connects the Persian Gulf to the Indian Ocean, now flies Gujarat's banner. Every ship carrying the silks of Persia, the dates of Arabia, and the horses of the Gulf must pass under our guns.\n\nWith Hormuz secured, Gujarat controls the richest chokepoint in the Indian Ocean trade system. The sultan must decide how to leverage this position. Shall we invest in infrastructure, building new ports and warehouses to handle the flood of commerce? Or shall we empower our merchant communities abroad, turning the Gujarati diaspora into a network of commercial princes who dominate distant markets?"
 nd_guj.11.a: "Construisez des ports dignes de notre nouveau dominion."
 nd_guj.11.b: "Donnez à nos commerçants les moyens de gouverner les marchés lointains."
 nd_guj.12.t: "Empire de l'océan Indien"
 nd_guj.12.d: "From Kilwa on the Swahili Coast to Malacca at the gateway to the South China Sea, Gujarat's commercial empire now spans the entire Indian Ocean. Gujarati merchants sit in the counting houses of every major port. Gujarati ships dominate every sea lane. Gujarati cloth, dyes, and spices fill the markets of three continents.\n\nNo other power has achieved such commercial dominion over the world's richest ocean. The sultan must decide the character of this unprecedented empire. Shall Gujarat rule the waves as a sovereign maritime power, projecting political authority across the ocean? Or shall we perfect our role as the world's great textile producer, clothing the nations of the earth in Gujarati cotton and silk?"
 nd_guj.12.a: "Nous serons souverains de l'océan Indien."
 nd_guj.12.b: "Le monde portera le tissu du Gujarat."
 STATIC_MODIFIER_NAME_nd_guj_dest_siege_masters: "Maîtres de siège"
 STATIC_MODIFIER_DESC_nd_guj_dest_siege_masters: "Les ingénieurs militaires du Gujarat maîtrisent l'art de la réduction des forteresses, forment des sapeurs spécialisés et déploient des techniques minières dévastatrices contre les murs ennemis."
 STATIC_MODIFIER_NAME_nd_guj_dest_arabian_sea_command: "Commandement de la mer d'Oman"
 STATIC_MODIFIER_DESC_nd_guj_dest_arabian_sea_command: "La flotte du Gujarat domine la mer d'Oman, ses navires de guerre lourds patrouillant sur les routes commerciales et extrayant le tribut des navires marchands de passage."
 STATIC_MODIFIER_NAME_nd_guj_dest_imperial_court: "Cour impériale du Gujarat"
 STATIC_MODIFIER_DESC_nd_guj_dest_imperial_court: "Une magnifique administration impériale centrée sur le darbar, où le sultan reçoit les tributs des rois vassaux et rend la justice sur un vaste domaine."
 STATIC_MODIFIER_NAME_nd_guj_dest_spymaster_sultan: "Sultan, maître-espion"
 STATIC_MODIFIER_DESC_nd_guj_dest_spymaster_sultan: "Le sultan règne grâce à un vaste réseau de renseignements, avec des agents intégrés dans chaque province et chaque tribunal, garantissant qu'aucune menace ne passe inaperçue."
 STATIC_MODIFIER_NAME_nd_guj_dest_builder_of_ports: "Constructeur de ports"
 STATIC_MODIFIER_DESC_nd_guj_dest_builder_of_ports: "Des investissements massifs dans les infrastructures portuaires à travers le réseau commercial créent un réseau de ports construits en Gujarati qui dominent le commerce dans l’océan Indien."
 STATIC_MODIFIER_NAME_nd_guj_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_guj_dest_merchant_princes: "La diaspora marchande du Gujarat est passée du statut de communauté commerciale à celui de pouvoir politique, les princes commerciaux gujarati contrôlant les marchés d'Aden à Malacca."
 STATIC_MODIFIER_NAME_nd_guj_dest_ocean_sovereign: "Souverain des océans"
 STATIC_MODIFIER_DESC_nd_guj_dest_ocean_sovereign: "Le Gujarat contrôle l'océan Indien non seulement en tant que puissance commerciale mais aussi en tant que souverain politique, avec des ports vassaux et des États tributaires reconnaissant la suprématie maritime du sultanat."
 STATIC_MODIFIER_NAME_nd_guj_dest_cloth_of_gold: "Tissu d'or"
 STATIC_MODIFIER_DESC_nd_guj_dest_cloth_of_gold: "L'industrie textile du Gujarat a acquis une domination mondiale, la soie et les tissus fins du Gujarati ornant les élites de toutes les civilisations, de l'Europe à la Chine."
 nd_guj_darbar_i_khas: "Darbar-i-Khas"
 nd_guj_darbar_i_khas_desc: "Une magnifique salle d'audience impériale où le sultan suprême reçoit les hommages des rois vassaux et rend la justice, symbole de la domination du Gujarat sur le sous-continent."
 nd_guj_bandar_bozorg: "Bandar-e-Bozorg"
 nd_guj_bandar_bozorg_desc: "Un grand complexe portuaire servant de plaque tournante centrale de l'empire commercial du Gujarat dans l'océan Indien, avec de vastes entrepôts, chantiers navals et comptoirs gérant le commerce de trois continents."
 nd_guj_darbar_upkeep: "Entretien Darbar"
 nd_guj_darbar_upkeep_desc: "Tissus fins, meubles et papiers pour les cérémonies, archives et mobilier de la salle d'audience impériale."
 nd_guj_bandar_operations: "Grandes opérations portuaires"
 nd_guj_bandar_operations_desc: "Bois, goudron, papier et outils pour l'entretien continu des quais, des entrepôts et des installations navales du grand port."

 # ===== BUREAUCRACIES =====
 guj_mahajan_panchayat_bureaucracy: "Mahajan Panchayat"
 guj_mahajan_panchayat_bureaucracy_desc: "Les tribunaux des guildes commerçantes Banya, Lohana et Vora de Cambay, Surat, Patan et Ahmedabad. Les conseils des mahajans, composés de cinq anciens, réglaient les différends commerciaux selon le droit commercial coutumier et garantissaient les lettres de change (hundi) qui déplaçaient les capitaux à travers l'océan Indien. Le Sultanat et le Mughal Subah du Gujarat ont reconnu la compétence des mahajans en matière commerciale ; en échange, les mahajans contractèrent des emprunts pour le trône en cas de besoin financier, et les grandes maisons Banya de Surat devinrent les partenaires silencieux de toutes les entreprises outre-mer, depuis la mer Rouge jusqu'au détroit de Malacca."
 guj_khambhat_bandar_bureaucracy: "Khambhat Bandar"
 guj_khambhat_bandar_bureaucracy_desc: "Le bureau de Mutasaddi-i-Bandar, chef de l'administration douanière de Khambhat (Cambay), grand magasin médiéval de l'océan Indien occidental et principal port du sultanat dès le XIVe siècle. Le bandar collectait les douanes maritimes chauth-i-bahri sur chaque cargaison de chevaux d'Ormuz, d'esclaves de Zanj, d'épices de Malabar et de soie de Chine qui traversait le golfe de Khambhat. Surat a hérité de l'appareil après l'ensablement de la rade de Cambay à la fin du XVIe siècle, mais le bureau du Mutasaddi a survécu intact jusqu'à l'ère moghole."
 guj_pal_sea_levy_bureaucracy: "Prélèvement Pal pour la protection de la mer"
 guj_pal_sea_levy_bureaucracy_desc: "La taxe de protection de la mer côtière (pal ou pancham) payée par les marchands gujarati et les communautés côtières de Kathiawar à la flotte du Sultanat pour l'escorte contre les pirates de Malabar et, après 1500, contre les croiseurs portugais opérant depuis Diu et Goa. La marine de boutres et de ghurabs du Sultanat était presque entièrement financée par des collections d'amis. Les villages côtiers supportaient le prélèvement de manière disproportionnée et le ressentaient amèrement, mais le système a construit la seule marine d'État de l'océan Indien capable de combattre les Portugais dans des conditions à peu près égales jusqu'à la catastrophe de Diu en 1509."
 guj_bohra_dawah_bureaucracy: "Bohra Dawat-i-Hadiyah"
 guj_bohra_dawah_bureaucracy_desc: "L'administration institutionnelle de la communauté ismaélienne Tayyibi Mustaali dont le Da'i al-Mutlaq opérait depuis le Yémen et, après 1539, depuis Sidhpur et Surat. La diaspora marchande Bohra dirigeait le commerce longue distance de l'indigo, des textiles de coton et du salpêtre dans l'océan Indien, de Cambay à Aden, Moka et Mombasa, l'estrade collectant les dîmes religieuses et jugeant les affaires intérieures par l'intermédiaire de leurs propres cadis. Le sultanat sunnite a toléré avec inquiétude le réseau car il apportait de l'argent et des chevaux arabes ; les oulémas orthodoxes l'ont dénoncé comme une déviance chiite depuis les chaires d'Ahmedabad."
 guj_begada_fortress_bureaucracy: "Système Begada Hill-Fort"
 guj_begada_fortress_bureaucracy_desc: "La chaîne de citadelles fortifiées - Champaner, Pavagadh, Junagadh, Idar - que Mahmud Begada a sécurisée entre 1458 et 1511 comme colonne vertébrale du contrôle territorial gujarati. Chaque fort était détenu par un amir-i-qila en garnison de cavalerie ghulam et de gardes Habshi, et les concessions de terres iqta soutenant les garnisons étaient alternées pour empêcher la formation de seigneuries de forteresse héréditaires. Champaner servit brièvement de deuxième capitale ; le système a donné au sultanat sa résistance remarquable contre les armées mogholes jusqu'en 1573 et est resté par la suite l'instrument de contrôle interne du Mughal Subah."
 guj_darbari_brahmin_bureaucracy: "Conseil des brahmanes Darbari"
 guj_darbari_brahmin_bureaucracy_desc: "La pratique gujarati distinctive consistant à retenir des comptables et des conseillers hindous au diwan-i-khalsa, issus des brahmanes Nagar de Vadnagar et des brahmanes Audich du nord du Gujarat. Les diwans brahmanes maintenaient les registres des revenus dans des écritures dérivées du gujarati et du sanskrit, faisant office d'intermédiaire entre la cour de langue persane et les cultivateurs hindous ruraux, et ont survécu aux transitions dynastiques qui ont balayé leurs homologues musulmans. Le Mughal Subah du Gujarat a officialisé la pratique; les mêmes lignées brahmanes servirent plus tard les Marathes et la Compagnie des Indes orientales sans interruption : la continuité institutionnelle de la comptabilité hindoue sous chaque régime."

 AUTO_MODIFIER_NAME_nd_guj_bureaucracy_authority: "Sultanat Diwans du Gujarat"
 AUTO_MODIFIER_DESC_nd_guj_bureaucracy_authority: "De la chancellerie d'Ahmedabad et du Bandar de Cambay aux tribunaux mahajans de Surat et aux qiladars des collines de Champaner, les institutions du Gujarat se sont installées dans un appareil administratif permanent. Les registres fiscaux du sultan, les registres des douanes des ports occidentaux, les registres dawat de l'estrade de Bohra et les comptes des diwans brahmanes forment désormais une archive continue qui survit à tout règne."
