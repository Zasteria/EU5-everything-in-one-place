l_french:
 nd_ayu_water_defenses: "Défenses des douves de l'île"
 nd_ayu_water_defenses_desc: "Ayutthaya se trouve au confluent de trois rivières, Chao Phraya, Pa Sak et Lopburi, sur une île artificielle créée en creusant des canaux pour relier ces voies navigables. Ce réseau de douves et de canaux rend la ville pratiquement imprenable au siège conventionnel."
 nd_ayu_khmer_inheritance: "Héritage Khmer"
 nd_ayu_khmer_inheritance_desc: "Les fondateurs d'Ayutthaya ont absorbé les traditions administratives de l'empire khmer en déclin, adoptant ses rituels de cour, ses titres dérivés du sanskrit et sa bureaucratie hiérarchique. Le concept du roi en tant que devaraja, une incarnation divine régnant à partir d'un centre cosmique, confère à la souveraineté d'Ayutthayan une autorité transcendante."
 nd_ayu_river_patrol: "Flottille de Chao Phraya"
 nd_ayu_river_patrol_desc: "Le contrôle du fleuve Chao Phraya est la bouée de sauvetage d’Ayutthaya. Des bateaux de guerre patrouillent sur les voies navigables, interceptent les pillards et escortent les navires marchands à travers les artères fluviales du royaume."
 nd_ayu_dharmaraja: "Tradition du Dharmaraja"
 nd_ayu_dharmaraja_desc: "Le roi Ramathibodi Ier a déclaré le bouddhisme Theravada religion officielle d'Ayutthaya en 1360 et a fait venir des moines de Ceylan pour établir de nouveaux ordres. La tradition Dharmaraja associe la royauté bouddhiste au rituel brahmanique, faisant du dirigeant à la fois le protecteur de la foi et l'incarnation vivante de la loi juste."
 nd_ayu_phrai_foundations: "Conscription de Phrai"
 nd_ayu_phrai_foundations_desc: "Chaque homme libre d'Ayutthaya est enregistré comme phrai, un sujet obligé de fournir un travail de corvée à la couronne pendant la moitié de l'année. Ce système, administré par les seigneurs nai locaux, donne au roi une vaste réserve de main-d'œuvre pour les travaux publics, les campagnes militaires et les projets de construction de l'État."
 nd_ayu_entrepot: "Entrepôt cosmopolite"
 nd_ayu_entrepot_desc: "La situation d'Ayutthaya, au carrefour des routes commerciales maritimes entre la Chine, l'Inde et les îles aux épices, attire des marchands de toute l'Asie. Les communautés étrangères (chinoises, indiennes, perses, puis européennes) établissent leurs propres quartiers hors des murs de la ville, chacun gouverné par son propre chef mais contribuant au trésor du royaume."
 nd_ayu_nihonmachi: "Quartier Nihonmachi"
 nd_ayu_nihonmachi_desc: "Les chrétiens et ronin japonais fuyant la persécution des Tokugawa établissent un quartier prospère sur la rive est de la Chao Phraya. À son apogée dans les années 1620, le Nihonmachi abrite plus de 1 500 Japonais, dont quelque six cents guerriers qui servent le roi siamois en tant que mercenaires d'élite. Leurs compétences martiales et leur discipline en font un formidable ajout à la garde royale."
 nd_ayu_deerskin_trade: "Commerce d'exportation de peau de cerf"
 nd_ayu_deerskin_trade_desc: "Ayutthaya's forests teem with deer, and their hides are prized across East Asia. Japanese and Chinese merchants purchase thousands of skins annually for armor, clothing, and bookbinding. The deerskin trade becomes one of Ayutthaya's most profitable exports alongside sappanwood and rice."
 nd_ayu_palace_law: "Loi Palatine"
 nd_ayu_palace_law_desc: "La codification du droit royal établit des hiérarchies de préséance claires, réglemente le comportement des fonctionnaires et définit les devoirs des sujets envers la couronne. Ce cadre juridique, s'appuyant à la fois sur la tradition khmère et sur les principes bouddhistes Theravada, soutiendra la gouvernance siamoise pendant des siècles."
 nd_ayu_royal_barges: "Barges de guerre royales"
 nd_ayu_royal_barges_desc: "Les barges de guerre royales d'Ayutthaya sont à la fois des armes de guerre et des symboles de majesté. Minutieusement sculptés et dorés, ces navires portent des mousquetaires et des canons sur leur proue tandis que des rameurs les propulsent à travers la Chao Phraya avec une précision synchronisée. Un cortège complet de deux cents barges est un spectacle qui impressionne aussi bien les visiteurs étrangers que les sujets."
 nd_ayu.1.t: "L'île entre les rivières"
 nd_ayu.1.d: "Where the Chao Phraya, Pa Sak, and Lopburi rivers converge, our engineers have carved canals to complete what nature began. Ayutthaya now sits upon an island, surrounded on all sides by deep water, accessible only by boat or by bridges we control. No army can approach our walls without first crossing the rivers under our archers' fire. But this island is more than a fortress. The rivers that protect us also carry the trade of nations. Chinese junks, Indian dhows, and Malay praus crowd our wharves. We must decide: shall Ayutthaya be known as the impregnable citadel that none dare assault, or as the great crossroads where the wealth of Asia changes hands?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ayu.1.a: "Que nos douves soient nos remparts."
 nd_ayu.1.b: "Que nos rivières soient nos autoroutes."
 nd_ayu.2.t: "Le Nihonmachi"
 nd_ayu.2.d: "Une communauté remarquable s'est implantée sur la rive est de la Chao Phraya, face au quartier portugais. Les chrétiens japonais et les samouraïs sans maître, les ronin, fuyant les persécutions du shogunat Tokugawa ont établi leur propre quartier, le Nihonmachi. Leur chef gouverne avec notre permission, et leurs guerriers ont offert leurs épées à notre service. Ces ronin ne ressemblent à aucun soldat que nous ayons connu : disciplinés, intrépides au corps à corps et totalement loyaux envers quiconque mérite leur respect. Déjà, près de six cents guerriers japonais forent en formation le long des berges de la rivière, leurs lames d'acier scintillant sous le soleil tropical. Les marchands parmi eux vendent des peaux de cerf, du bois de sappan et de la soie, enrichissant notre trésor tandis que leurs guerriers renforcent notre garde."
 nd_ayu.2.a: "Un ajout digne à notre royaume."
 STATIC_MODIFIER_NAME_nd_ayu_impregnable_island: "Île imprenable"
 STATIC_MODIFIER_DESC_nd_ayu_impregnable_island: "Les défenses hydrauliques d'Ayutthaya font de la capitale une forteresse sans égal en Asie du Sud-Est."
 STATIC_MODIFIER_NAME_nd_ayu_river_crossroads: "Carrefour de la rivière"
 STATIC_MODIFIER_DESC_nd_ayu_river_crossroads: "Les rivières d'Ayutthaya transportent le commerce des nations, enrichissant tous ceux qui habitent sur leurs rives."
 n_nd_ayu_rua_rop: "Rua Rop"
 n_nd_ayu_rua_rop_desc: "Bateaux de guerre à faible tirant d'eau qui patrouillent dans la Chao Phraya et ses affluents, transportant des archers et des mousquetaires pour intercepter les pillards et les pirates."
 a_nd_ayu_phrai_lek: "Phrai Lek"
 a_nd_ayu_phrai_lek_desc: "Infanterie conscrite issue du système de corvée, ces soldats paysans effectuent leurs mois obligatoires dans les armées royales."
 a_nd_ayu_ronin_guard: "Garde rônin"
 a_nd_ayu_ronin_guard_desc: "Les samouraïs japonais sans maître qui ont fui la persécution de Tokugawa et servent désormais le roi d'Ayutthayan en tant que mercenaires étrangers d'élite, craints pour leur discipline et leur maîtrise de l'épée."
 n_nd_ayu_rua_suwan: "Rua Suwan Ratchakan"
 n_nd_ayu_rua_suwan_desc: "Les barges de guerre royales dorées d'Ayutthaya, richement sculptées et équipées de canons montés sur la proue, utilisées à la fois pour les processions cérémonielles et les combats fluviaux."
 nd_ayu_island_fortress: "Forteresse des douves de l'île"
 nd_ayu_island_fortress_desc: "Un système de canaux, de douves et de barrières d'eau exploitant la géographie insulaire d'Ayutthaya pour créer des défenses aquatiques en couches qui rendent la ville presque imperméable au siège."
 nd_ayu_fortress_upkeep: "Entretien des canaux et des douves"
 nd_ayu_fortress_upkeep_desc: "Bois et pierre pour entretenir les murs du canal, les écluses et les remblais défensifs qui protègent la ville insulaire."
 nd_ayu_foreign_quarter: "Trimestre du commerce extérieur"
 nd_ayu_foreign_quarter_desc: "Un quartier désigné à l'extérieur des murs de la ville où les marchands étrangers (chinois, indiens, persans, japonais et européens) établissent leurs propres communautés sous la gouvernance de chefs nommés."
 nd_ayu_foreign_quarter_upkeep: "Wharves and Godowns"
 nd_ayu_foreign_quarter_upkeep_desc: "Timber for the landing stages and warehouses of the quarter, and paper and cloth for the headmen who keep its accounts."
 nd_ayu_deerskin_yard: "Deerskin Yard"
 nd_ayu_deerskin_yard_desc: "Hides brought down from the upland forests are dried, salted, sorted by grade and baled here for the ships that sail to Japan with the monsoon."
 nd_ayu_deerskin_processing: "Deerskin Curing"
 nd_ayu_deerskin_processing_desc: "Deer hides are salted, dried on frames and baled for export to Japan and China."
 nd_ayu_royal_wat: "Wat Royal"
 nd_ayu_royal_wat_desc: "Un grand complexe de temples bouddhistes servant de cœur spirituel au royaume, abritant des reliques sacrées, soutenant l'éducation monastique et légitimant l'autorité royale par le patronage religieux."
 nd_ayu_temple_patronage: "Patronage du temple"
 nd_ayu_temple_patronage_desc: "L'approvisionnement continu en céramiques pour les offrandes dévotionnelles et en teintures pour la décoration des temples et les robes monastiques."
 levy_nd_ayu_phrai_lek: "Phrai Lek Levy"
 levy_nd_ayu_phrai_lek_desc: "Conscrits de corvée issus du système phrai, mobilisés en masse pour servir dans les armées royales lors des campagnes."
 levy_nd_ayu_rua_suwan: "Prélèvement sur les barges de guerre royales"
 levy_nd_ayu_rua_suwan_desc: "Des barges de guerre dorées, dirigées par des riverains et commandées par des capitaines bourgeois, issus des communautés riveraines de Chao Phraya."
 nd_ayu_formed_tt: "Ayutthaya a été créée"
 nd_ayu_path_a_tt: "Choisissez l’île imprenable"
 nd_ayu_path_b_tt: "Choisissez River Crossroads"
 ayu_krom_tha_bureaucracy: "Krom Tha"
 ayu_krom_tha_bureaucracy_desc: "Les douanes maritimes d'Ayutthaya étaient organisées de manière unique en deux départements portuaires égaux : le Krom Tha Khwa (port droit), traditionnellement dirigé par un officier d'origine chinoise et gérant le trafic d'Asie de l'Est, et le Krom Tha Sai (port gauche), dirigé par des administrateurs chiites persans - le plus célèbre est la famille Bunnag, descendante du cheikh Ahmad Qomi arrivé en 1602 - et gérant le commerce indien, persan, arabe et européen. La bifurcation a donné au trône deux appareils douaniers parallèles et une place institutionnalisée pour les officiers nés à l'étranger dans les plus hauts rangs de la cour."
 ayu_tamruat_phon_bureaucracy: "Tamruat Phon"
 ayu_tamruat_phon_bureaucracy_desc: "La police du palais royal : un corps de garde au sein du ministère Wang distinct de l'armée de campagne, recruté parmi les familles Mon et Khmer de confiance et responsable uniquement devant le roi et le Maha Uparat. Le Tamruat Phon a escorté le roi pendant les processions, a procédé à des arrestations secrètes de rivaux à la cour et a décidé de l'issue de chaque crise de succession d'Ayutthayan, depuis Borommatrailokkanat jusqu'à la déposition du roi Suriyamarin en 1767."
 ayu_yodfa_elephant_corps_bureaucracy: "Corps des éléphants de Yodfa"
 ayu_yodfa_elephant_corps_bureaucracy_desc: "Après son combat singulier de 1593 avec le prince héritier birman à Nong Sarai, le roi Naresuan réorganisa le corps des éléphants d'Ayutthayan en un cadre professionnel héréditaire. Les Yodfa ont établi des stations d'élevage d'éléphants de guerre dans le haut Chao Phraya, des dynasties de cornacs issues des États clients de Lan Na et du Lao, et une escorte de piquiers réfugiés Mon a accordé des terres à Ayutthayan en échange de services. Le corps a déployé l'infanterie la plus fiable d'Ayutthaya tout au long du XVIIe siècle, repoussant les invasions de Toungoo et projetant sa suzeraineté sur le Cambodge et les sultanats du nord de la Malaisie."
 ayu_krom_mahatlek_bureaucracy: "Krom Mahatlek"
 ayu_krom_mahatlek_bureaucracy_desc: "La cour des pages royales enrôlait les fils des nobles d'Ayutthayan, des dirigeants vassaux et des officiers étrangers de haut rang comme garçons servant dans le palais intérieur. Les pages dormaient par terre à l'extérieur des appartements du roi, diffusaient ses messages et apprenaient la gouvernance en observant le conseil. Une fois devenus majoritaires, ils sont entrés dans les ministères à quatre piliers en tant qu'officiers subalternes, garantissant ainsi que la prochaine génération de gouverneurs aurait été personnellement approuvée par le trône. Le système fonctionnait également comme un appareil à otages : le fils d'un vassal rebelle était toujours à un coup d'épée de la garde du roi."
 ayu_kromakan_asa_bureaucracy: "Kromakan Asa"
 ayu_kromakan_asa_bureaucracy_desc: "Plus que tout autre État d’Asie du Sud-Est, Ayutthaya a intégré des officiers nés à l’étranger dans sa haute administration. Le Kromakan Asa enrôla des Perses sous le cheikh Ahmad Qomi (1602), le Japonais Yamada Nagamasa comme gouverneur de Nakhon Si Thammarat dans les années 1620, le Grec Constantine Phaulkon sous le nom de Phra Khlang sous le roi Narai (1685-88), des artilleurs portugais au parc d'artillerie d'Asa Cherokat et des ingénieurs français sous Desfarges en 1687. Chaque étranger reçut le rang Sakdina et un Krom de son propre client. communauté, ouvrant des canaux uniques pour les armes à feu, la science de la fortification et la diplomatie du golfe Persique."
 AUTO_MODIFIER_NAME_nd_ayu_bureaucracy_authority: "Autorité bureaucratique d'Ayutthaya"
 AUTO_MODIFIER_DESC_nd_ayu_bureaucracy_authority: "The court of Ayutthaya has room for three more institutions, drawn from the Krom Tha twin ports, the Tamruat Phon palace police, the Yodfa elephant corps, the Mahatlek pages court, and the Kromakan Asa foreign officer corps."
