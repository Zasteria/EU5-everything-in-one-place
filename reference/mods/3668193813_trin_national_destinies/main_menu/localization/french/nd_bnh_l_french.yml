l_french:
 # === Variable tooltips (required for hidden_effect set_variable lines) ===
 nd_bnh_formed_tt: "Beth Nahrain a été formée."
 nd_bnh_path_a_tt: "Après la Restauration du Patriarche."
 nd_bnh_path_b_tt: "À la suite des défenseurs de Tur Abdin."
 nd_bnh_path_c_tt: "Après la Renaissance d'Edessene."
 # === Formation Event Modifiers ===
 STATIC_MODIFIER_NAME_nd_bnh_patriarchs_restoration: "La restauration du patriarche"
 STATIC_MODIFIER_DESC_nd_bnh_patriarchs_restoration: "Le Catholicos d'Orient trône à Mossoul, les lettres patriarcales remontent de Trichur à Tabriz, et les paroisses rurales mésopotamiennes sont réorganisées sous le patronage royal. Le clergé de langue araméenne constitue la colonne vertébrale du nouvel État."
 STATIC_MODIFIER_NAME_nd_bnh_tur_abdin_defenders: "Les défenseurs de Tur Abdin"
 STATIC_MODIFIER_DESC_nd_bnh_tur_abdin_defenders: "Les deyrayoutho de Mor Gabriel et Deir al-Zafaran jurent fidélité royale. Les milices des hauts plateaux des villages chrétiens garnissent la frontière du nouveau royaume ; les chapitres monastiques intendent les troupes qu'ils lèvent."
 STATIC_MODIFIER_NAME_nd_bnh_edessene_renaissance: "La Renaissance d'Édessène"
 STATIC_MODIFIER_DESC_nd_bnh_edessene_renaissance: "Le royaume fait revivre la concorde latino-syriaque de l’ère des Croisés que le comté d’Edesse incarnait autrefois. Les marchands italiens sont reçus à Mossoul, les clercs latins enseignent aux côtés des écoliers araméens et le royaume est considéré comme un pair chrétien respectable dans les chancelleries occidentales."
 # === DHE Modifiers ===
 STATIC_MODIFIER_NAME_nd_bnh_translators_mosul: "Traducteurs de Mossoul"
 STATIC_MODIFIER_DESC_nd_bnh_translators_mosul: "Le cercle de traduction de Bar Hebraeus à Mossoul traduit la philosophie grecque, la médecine persane et l'astronomie arabe en syriaque et en araméen, fournissant ainsi à chaque siège chrétien oriental un corpus utilisable."
 STATIC_MODIFIER_NAME_nd_bnh_qanat_revival: "La renaissance du Qanat"
 STATIC_MODIFIER_DESC_nd_bnh_qanat_revival: "Les géomètres qanat de la couronne cartographient chaque ligne aquifère brisée dans les basses terres du Tigre et de l'Euphrate. L'ingénierie hydraulique de l'ère sassanide est restaurée et les champs de Sawad se remplissent de paysans revenant des hautes terres."
 STATIC_MODIFIER_NAME_nd_bnh_river_caravans: "Caravanes fluviales"
 STATIC_MODIFIER_DESC_nd_bnh_river_caravans: "Le corridor Mossoul-Bagdad est rouvert sous licence royale. Les guildes caravanières de langue araméenne taxent le trafic Tigre-Euphrate, et les marchands mésopotamiens atteignent le golfe Persique, Alep et les hauts plateaux d'Anatolie."
 STATIC_MODIFIER_NAME_nd_bnh_mor_gabriel_endowment: "Dotation Mor Gabriel"
 STATIC_MODIFIER_DESC_nd_bnh_mor_gabriel_endowment: "La dotation royale officialise Mor Gabriel en tant qu'institution du royaume. Son scriptorium devient les archives de la chancellerie ; son abbé siège au conseil royal."
 STATIC_MODIFIER_NAME_nd_bnh_eastern_missions: "Missions orientales"
 STATIC_MODIFIER_DESC_nd_bnh_eastern_missions: "Le Patriarcat envoie à nouveau des métropolites dans les diocèses de la Route de la Soie. Samarkand, Tabriz et la côte de Malabar envoient des remerciements à Mossoul ; La prière araméenne s'entend de la Méditerranée jusqu'à la mer de Chine méridionale."
 STATIC_MODIFIER_NAME_nd_bnh_mesopotamian_consolidation: "Consolidation mésopotamienne"
 STATIC_MODIFIER_DESC_nd_bnh_mesopotamian_consolidation: "Le royaume concentre tout son poids administratif sur son cœur mésopotamien. L'araméen supplante l'arabe et le kurde dans les villages Sawad, et les registres diocésains du patriarcat sont réédités en syriaque."
 # === Formation Event ===
 nd_bnh.1.t: "Le Conseil de Mossoul"
 nd_bnh.1.d: "Beth Nahrain, the Land Between the Rivers, is proclaimed at Mosul. The Catholicos of the East, the abbots of Tur Abdin, the Latin chaplains who survive from the County of Edessa, and the Aramaic-speaking notables of the Sawad gather in the cathedral of the Old Town. The Mongol overlordship has finally fractured; the ancient Christian polity of Mesopotamia must now decide what character it will assume.\n\nThree visions stand on the council floor. The Catholicos argues for a kingdom rebuilt around the Patriarchate, the surviving institution that gives the Aramaic-speaking peoples a continuous identity. The abbots of Tur Abdin demand a militarized highland kingdom, monastic-fortress at its core, ready to outlast every overlord that comes after. The Edessene faction, heirs of the Crusader-Syriac condominium, urge engagement with the Latin west and the Italian merchant republics: the kingdom as a respectable Christian peer.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bnh.1.a: "Le Catholicos dirigera la restauration du Patriarcat."
 nd_bnh.1.b: "Tur Abdin nous gardera et fortifiera les hauts plateaux."
 nd_bnh.1.c: "Edessa commercera avec nous et engagera l'Occident latin."
 # === DHE 2: Translators of Mosul ===
 nd_bnh.2.t: "L'entrepôt des mystères"
 nd_bnh.2.d: "Gregory Bar Hebraeus, Maphrien de l'Est, complète son Entrepôt de Mystères, un commentaire biblique syriaque s'appuyant sur l'érudition grecque, persane et arabe et son Chronicon, l'histoire universelle qui ancre l'identité de Beth Nahrain. La maison de traduction de Mossoul traduit Aristote, Galien et Ptolémée dans la langue vernaculaire araméenne, et de l'araméen vers le latin et l'arabe qui entourent le royaume. La Mésopotamie savante chrétienne que l'on croyait perdue en 1258 est à nouveau debout, et ses livres sont lus de Trichur à Reims."
 nd_bnh.2.a: "L'apprentissage de l'araméen vit."
 # === DHE 3: Mongol-Broken Land ===
 nd_bnh.3.t: "Les canaux brisés"
 nd_bnh.3.d: "Le royaume hérite d'une campagne dévastée. Les réseaux de qanat au sud de Mossoul, soutenus par les administrations sassanide et abbasside, ont été brisés lors des campagnes mongoles ; des pans entiers du Sawad sont revenus à la garrigue. Les géomètres de la couronne présentèrent au roi deux réponses stratégiques. La première : reconstruire le réseau d’irrigation, récupérer le cœur agricole mésopotamien et réinstaller les villages paysans qui approvisionnaient les grandes villes. La seconde : annuler l'irrigation, canaliser la main-d'œuvre et les capitaux du royaume vers le corridor commercial terrestre qui relie déjà Mossoul à Bagdad et à Bassorah."
 nd_bnh.3.a: "Restaurez les qanats. La terre doit nourrir le royaume."
 nd_bnh.3.b: "Reconstruire les routes commerciales. Des caravanes, pas des canaux."
 # === DHE 4: Mor Gabriel Endowment ===
 nd_bnh.4.t: "La couronne de safran"
 nd_bnh.4.d: "La cour royale officialise Mor Gabriel, le monastère fondé en 397, le plus ancien monastère chrétien en activité sur terre, en tant qu'institution du royaume. Son abbé reçoit le titre de Royal Maphrian ; son scriptorium est incorporé à la chancellerie royale ; sa chambre judiciaire est reconnue comme le sommet du droit canonique syriaque. Beth Nahrain se lie aux monastères aux pierres de safran qui ont porté la Mésopotamie chrétienne à travers neuf siècles de suzeraineté."
 nd_bnh.4.a: "Mor Gabriel est le cœur du royaume."
 # === DHE 5: Eastern Missions ===
 nd_bnh.5.t: "Les diocèses éloignés"
 nd_bnh.5.d: "Le Catholicos présente au roi les registres des diocèses orientaux : Samarkand, Tabriz, Khanbaliq, la côte de Malabar, les lettres synodales des métropolitains dont les troupeaux récitent encore des prières araméennes depuis le Pamir jusqu'au golfe du Bengale. Le patriarcat propose d'envoyer de nouveaux métropolitains, de restaurer les registres missionnaires et de réactiver le réseau. Mais d’autres soutiennent que le royaume devrait concentrer son énergie chez lui : au cœur de la Mésopotamie, et non sur les frontières lointaines."
 nd_bnh.5.a: "Envoyez les métropolitains vers l’est. L’Église d’Orient vit."
 nd_bnh.5.b: "Consolidez à la maison. La Mésopotamie d’abord."
 # === Heritage Advances ===
 nd_bnh_catholicate_of_seleucia: "Catholicat de Séleucie"
 nd_bnh_catholicate_of_seleucia_desc: "Le siège patriarcal de l’Église d’Orient est rétabli à Mossoul, avec une juridiction formelle réaffirmée sur les diocèses de la diaspora. Le Catholicos devient le premier ministre spirituel du royaume."
 nd_bnh_mor_gabriel_network: "Réseau Mor Gabriel"
 nd_bnh_mor_gabriel_network_desc: "Les monastères Tur Abdin Mor Gabriel, Deir al-Zafaran et Mor Hananyo sont reconnus comme un réseau d'État, avec leurs scriptoria, leurs chambres judiciaires et leurs concessions de terres rurales formalisées dans une charte royale."
 nd_bnh_tur_abdin_highlanders: "Tur Abdin Highlanders"
 nd_bnh_tur_abdin_highlanders_desc: "La milice des villages monastiques des hautes terres de Tur Abdin, les mêmes combattants qui tenaient la région sous les suzerains Artuqid, Mongol et Aq Qoyunlu, est formalisée comme un prélèvement du royaume."
 nd_bnh_sawad_irrigation: "Irrigation de Sawad"
 nd_bnh_sawad_irrigation_desc: "L'infrastructure des qanat et des canaux des basses terres du Tigre et de l'Euphrate est reconstruite sous l'administration de la Couronne. Les géomètres cartographient les réseaux brisés de l'ère mongole ; le corps royal répare les brèches."
 nd_bnh_hudaye_book: "Livre des lois Hudaye"
 nd_bnh_hudaye_book_desc: "La codification par Bar Hebraeus du droit civil chrétien mésopotamien (1276), le Hudaye, le Livre des Directions, est adopté comme corpus juridique du royaume, s'appuyant sur les précédents romains, sassanides et islamiques à travers un cadre syriaque."
 nd_bnh_syriac_translation_movement: "Mouvement de traduction syriaque"
 nd_bnh_syriac_translation_movement_desc: "Les programmes de traduction médiévaux sont restaurés. La philosophie grecque, la médecine persane et l'astronomie arabe entrent en grande quantité en syriaque et sont transmises de là à la chrétienté latine et aux cours arabophones."
 nd_bnh_maphrianate: "Maphrianat d'Orient"
 nd_bnh_maphrianate_desc: "Le Maphrian, le vicaire oriental du patriarche, gouverne les diocèses mésopotamiens depuis Mossoul tandis que le patriarche gouverne depuis Antioche. L'administration religieuse à deux têtes étend la portée diplomatique du royaume."
 nd_bnh_mosul_baghdad_caravans: "Caravanes Mossoul-Bagdad"
 nd_bnh_mosul_baghdad_caravans_desc: "Le grand corridor de commerce terrestre mésopotamien est rouvert, reliant les routes des hautes terres anatoliennes au golfe Persique. L'araméen reste la lingua franca des caravanes."
 nd_bnh_edessene_schoolmen: "Ecoliers d'Edessene"
 nd_bnh_edessene_schoolmen_desc: "L'héritage de l'École d'Édesse, relancé grâce aux académies latino-syriaques du comté d'Édesse. Les études grecques et latines fertilisent le programme syriaque."
 nd_bnh_tur_abdin_wardens: "Gardiens de Tur Abdin"
 nd_bnh_tur_abdin_wardens_desc: "Les gardiens des chapitres monastiques de Mor Gabriel et des forteresses environnantes sont professionnalisés en une garde d'infanterie à construire, la formation régulière issue de la milice des hautes terres."
 nd_bnh_mesopotamian_revival: "Renaissance mésopotamienne"
 nd_bnh_mesopotamian_revival_desc: "La reconstruction systématique du réseau de canaux au sud de Mossoul. Les ingénieurs royaux entreprennent ce que la catastrophe mongole avait brisé : une renaissance agricole mésopotamienne sur des fondations sassanides."
 nd_bnh_silk_road_metropolitanate: "Métropole de la Route de la Soie"
 nd_bnh_silk_road_metropolitanate_desc: "Les diocèses de la Route de la Soie du Patriarcat, Samarkand, Khanbaliq et Malabar, sont réactivés dans le cadre d'une politique d'État. Le réseau missionnaire de l’Église d’Orient devient un instrument diplomatique du royaume."
 nd_bnh_bar_hebraeus_court: "Cour de Bar Hebraeus"
 nd_bnh_bar_hebraeus_court_desc: "Le cercle de médecins, d'astronomes et de traducteurs du mathématicien Maphrian constitue l'académie du royaume. La bourse trilingue grec-syriaque-arabe de son école de Mossoul devient une institution publique."
 nd_bnh_christian_diwan: "Christian Diwan"
 nd_bnh_christian_diwan_desc: "Le royaume adapte le modèle du diwan sassanide-abbasside à la gouvernance chrétienne. Les scribes en écriture araméenne gèrent en parallèle les comptes fiscaux, militaires et ecclésiastiques."
 nd_bnh_jundishapur_tradition: "Tradition de Jundishapur"
 nd_bnh_jundishapur_tradition_desc: "La tradition médico-académique issue de l'académie sassanide de Gondeshapur, où les médecins chrétiens nestoriens avaient conservé la médecine galénique, est restaurée en tant qu'institution du royaume."
 nd_bnh_patriarchal_diaspora: "Réseau de la diaspora patriarcale"
 nd_bnh_patriarchal_diaspora_desc: "La correspondance du Patriarcat avec les communautés de la diaspora du Levant à Malabar est transformée en un instrument diplomatique formel sous le patronage royal."
 nd_bnh_highland_garrison: "Système de garnison des Highlands"
 nd_bnh_highland_garrison_desc: "Le système monastique et militaire de Tur Abdin est étendu à une ligne de forts des hautes terres à l'échelle du royaume répondant à Mor Gabriel. Chaque forteresse possède son propre chapitre monastique."
 nd_bnh_riverine_pontoneers: "Pontonniers fluviaux"
 nd_bnh_riverine_pontoneers_desc: "Le corps du génie du royaume est spécialisé dans les travaux de ponts et de pontons Tigre-Euphrate, héritier des ingénieurs fluviaux sassanides et abbassides."
 nd_bnh_crown_of_two_rivers: "Couronne des Deux Fleuves"
 nd_bnh_crown_of_two_rivers_desc: "Le royaume institutionnalise son identité mésopotamienne dans une doctrine constitutionnelle : le roi comme protecteur des Deux Fleuves, de tous ceux qui habitent entre eux, syriaques, arabes, kurdes et arméniens."
 nd_bnh_aramaic_civil_service: "Fonction publique araméenne"
 nd_bnh_aramaic_civil_service_desc: "Le syriaque bureaucratique est codifié pour une administration à l'échelle du royaume, parallèlement aux langues officielles arabe et persane des États voisins. Des scribes en écriture araméenne équipent chaque diwan."
 nd_bnh_catholicate_constitutional: "Catholicisme constitutionnel"
 nd_bnh_catholicate_constitutional_desc: "Le Catholicos de l’Est occupe un siège consultatif officiel au sein du tribunal absolutiste, l’équivalent chrétien des traditions juridiques des oulémas sunnites et chiites."
 nd_bnh_mosul_foundries: "Fonderies de Mossoul"
 nd_bnh_mosul_foundries_desc: "Le fer des montagnes Hakkari et le cuivre des collines de Diyarbakir alimentent l'industrie d'armement du royaume, concentrée à Mossoul."
 nd_bnh_syriac_print: "Révolution de l’imprimerie syriaque"
 nd_bnh_syriac_print_desc: "Le royaume adopte l'imprimerie syriaque à caractères mobiles. Les écritures araméennes, les lois et les chroniques ont enfin une vie imprimée, transmise à travers la diaspora."
 nd_bnh_mesopotamian_industry: "Industrie mésopotamienne"
 nd_bnh_mesopotamian_industry_desc: "Les moulins fluviaux, les fonderies et les ateliers textiles du bas Tigre sont intégrés en une seule base industrielle. La Mésopotamie rejoint les économies productives du monde moderne."
 nd_bnh_civic_synod: "Synode civique araméen"
 nd_bnh_civic_synod_desc: "Le synode patriarcal est transformé en chambre civique, donnant au christianisme araméen une voix constitutionnelle formelle dans la gouvernance du royaume à la fin de l'ère."
 # === Buildings ===
 nd_bnh_catholicate_palace: "Palais catholique"
 nd_bnh_catholicate_palace_desc: "Le siège patriarcal de Mossoul. Le Catholicos de l'Est y tient son tribunal, administre la justice diocésaine et tient le registre en écriture araméenne des églises de la diaspora."
 nd_bnh_tur_abdin_monastery: "Monastère de Tur Abdin"
 nd_bnh_tur_abdin_monastery_desc: "Un complexe monastique perché sur le modèle Mor Gabriel / Deir al-Zafaran. Scriptorium, chambre judiciaire et auberge de pèlerins ; l'institution qui a retenu la population chrétienne mésopotamienne à travers chaque changement de suzerain."
 nd_bnh_qanat_works: "Travaux de Qanat"
 nd_bnh_qanat_works_desc: "Canaux d'irrigation souterrains drainant les aquifères des montagnes vers les champs des basses terres, héritage technique de la Mésopotamie sassanide et abbasside, restauré sous les arpenteurs de la couronne."
 nd_bnh_translation_house: "Maison de traduction syriaque"
 nd_bnh_translation_house_desc: "La philosophie grecque, la médecine persane et l'astronomie arabe entrent ici en syriaque, puis sont transmises vers l'ouest via le canal d'Edessene vers le latin. Le descendant institutionnel des traducteurs chrétiens de Bayt al-Hikma."
 nd_bnh_river_caravanserai: "Caravansérail fluvial"
 nd_bnh_river_caravanserai_desc: "Les grandes auberges routières du corridor Mossoul-Bagdad, tenues par des guildes syro-chrétiennes de langue araméenne. L'artère fluviale du commerce mésopotamien."
 nd_bnh_bar_hebraeus_library: "Bibliothèque Bar Hebraeus"
 nd_bnh_bar_hebraeus_library_desc: "La grande bibliothèque de Mossoul de Maphrian Bar Hebraeus, héritée par ses successeurs et reconstruite pour devenir l'institution d'enseignement phare du royaume. Le Magasin des Mystères a été compilé pour la première fois ici."
 nd_bnh_jundishapur_school: "École de médecine de Jundishapur"
 nd_bnh_jundishapur_school_desc: "Académie de médecine restaurée du royaume, héritière spirituelle du Gondeshapur sassanide où les médecins nestoriens avaient conservé la médecine galénique. Chirurgiens, herboristes et astronomes s'y forment."
 nd_bnh_highland_fortress: "Forteresse des Hautes Terres"
 nd_bnh_highland_fortress_desc: "Le modèle Tur Abdin s’est étendu à tout le royaume. Chaque forteresse combine une place forte défensive avec un petit chapitre monastique assurant l'aumônerie et les services judiciaires à sa garnison."
 nd_bnh_mosul_foundry: "Fonderie de Mossoul"
 nd_bnh_mosul_foundry_desc: "Le fer des montagnes Hakkari, le cuivre des collines de Diyarbakir, le tout forgé dans les usines d'armement centrales du royaume. Les canons coulés ici arment l'armée de Beth Nahrain de la fin de l'ère."
 nd_bnh_river_manufactory: "Manufacture fluviale"
 nd_bnh_river_manufactory_desc: "Moulins fluviaux alimentant la fabrication de textiles et de papier, le bas Tigre s'est transformé en un corridor industriel. Production de papier et de livres en langue araméenne pour la diaspora."
 # === Building Production Methods ===
 nd_bnh_catholicate_upkeep: "Entretien du catholicisme"
 nd_bnh_catholicate_upkeep_desc: "Bougies d'autel, papier d'état civil, livres liturgiques et encens pour le siège patriarcal et sa chancellerie diocésaine."
 nd_bnh_tur_abdin_upkeep: "Entretien du monastère"
 nd_bnh_tur_abdin_upkeep_desc: "Des bougies pour l'office de nuit, des manuscrits pour le scriptorium et de l'encens pour le sanctuaire du chapitre perché."
 nd_bnh_qanat_upkeep: "Entretien des Qanat"
 nd_bnh_qanat_upkeep_desc: "Pierre, étaiements en bois et outils d'arpentage pour garder les canaux souterrains dégagés et les champs de plaine arrosés."
 nd_bnh_translation_books_pm: "Traduction en syriaque"
 nd_bnh_translation_books_pm_desc: "Philosophie grecque, médecine persane et astronomie arabe traduites en syriaque et destinées aux écoles de l'Orient et de l'Occident latin."
 nd_bnh_caravanserai_upkeep: "Entretien du caravansérail"
 nd_bnh_caravanserai_upkeep_desc: "Du tissu, des chevaux frais, du bois et des bougies pour que les auberges en bord de route du couloir Mossoul-Bagdad restent ouvertes aux caravanes."
 nd_bnh_library_upkeep: "Entretien de la bibliothèque"
 nd_bnh_library_upkeep_desc: "Papier, volumes de référence, bougies et encens pour les salles de lecture et les copistes de la grande bibliothèque de Mossoul."
 nd_bnh_jundishapur_upkeep: "Entretien de la faculté de médecine"
 nd_bnh_jundishapur_upkeep_desc: "Papier, traités médicaux et médicaments composés pour les salles et les amphithéâtres de l'académie des médecins restaurée."
 nd_bnh_highland_fortress_upkeep: "Entretien de la forteresse"
 nd_bnh_highland_fortress_upkeep_desc: "Pierre de carrière, maçonnerie taillée, armes et outils pour maintenir et réparer les forteresses des hautes terres et leurs garnisons monastiques."
 nd_bnh_foundry_pm: "Fonderie de canons"
 nd_bnh_foundry_pm_desc: "Du fer de montagne Hakkari, du charbon de bois et des outils finis intégrés à l'artillerie de l'armée Beth Nahrain de la fin de la période."
 nd_bnh_river_paper_pm: "Moulin à papier de rivière"
 nd_bnh_river_paper_pm_desc: "Le lin, le chiffon et le calibrage des grains étaient transformés par les moulins fluviaux en papier de langue araméenne pour les scribes et les presses du royaume."
 nd_bnh_print_house_pm: "Impression araméenne"
 nd_bnh_print_house_pm_desc: "Le papier et la reliure étaient utilisés dans les journaux araméens imprimés en masse, les manuels syriaques et les codes de droit vernaculaires."
 # === Units & Levies ===
 a_nd_bnh_tur_abdin_highlander: "Tur Abdin Highlander"
 a_nd_bnh_tur_abdin_highlander_desc: "Levée d'infanterie dans les villages d'altitude de Tur Abdin autour de Mor Gabriel, spécialistes de la défense des montagnes. La milice qui a tenu la région sous neuf siècles de suzerains."
 a_nd_bnh_tur_abdin_warden: "Gardien de Tur Abdin"
 a_nd_bnh_tur_abdin_warden_desc: "Le directeur de chapitre monastique professionnalisé, recruté et entraîné dans une formation régulière d'infanterie lourde. Défenseurs disciplinés du flanc nord du royaume."
 levy_nd_bnh_tur_abdin_highlanders: "Prélèvement des Highlanders de Tur Abdin"
 nd_bnh_aramaic_print_press: "Presse araméenne"
 nd_bnh_aramaic_print_press_desc: "L'imprimerie de l'ère industrielle du royaume. Les journaux araméens, les manuels syriaques et les codes de lois vernaculaires passent de la technique du scriptorium à la production de masse."
 nd_bnh_aramaic_print_house: "Imprimerie araméenne"
 nd_bnh_aramaic_print_house_desc: "Le complexe d'imprimerie industrielle du défunt royaume, produisant en masse des journaux araméens, des manuels scolaires syriaques et du droit vernaculaire pour la diaspora et les écoles nationales du royaume."
 # === Destiny Tree ===
 # Path tooltips: destiny path A (imperial) gates on the formation choice
 # nd_bnh_path_b (Tur Abdin Defenders); destiny path B (civilization)
 # gates on nd_bnh_path_a (Patriarch's Restoration).
 nd_bnh_dest_path_a_tt: "Choisissez le chemin de formation#bold Tur Abdin Defenders#!-- la fondation militariste nécessaire pour marcher vers la restauration d'Aur."
 nd_bnh_dest_mosul_developed_tt: "Mosul is ours and its development is at least 38"
 nd_bnh_dest_nisibis_developed_tt: "Nusaybin is ours and its development is at least 32"
 nd_bnh_dest_malabar_pepper_tt: "Pepper is produced or traded in the market of our capital"
 nd_bnh_dest_path_b_tt: "Choisissez le chemin de formation#bold Restauration du Patriarche#!- la fondation scientifique nécessaire pour parcourir la Lumière de l'Est."
 # === Destiny Advance Names ===
 nd_bnh_destiny: "Le mandat de Mor Aur"
 nd_bnh_destiny_desc: "Beth Nahrain se lève. Le royaume doit maintenant déclarer quel genre de régime politique il entend être : l’héritier militariste d’Aur dont la route traverse Mossoul, Bagdad et Damas vers la restauration impériale de l’Assyrie ; ou le pôle civilisationnel de la chrétienté orientale, l’intermédiaire chrétien entre l’ouest latin et l’est de la Route de la Soie. Le mandat du Mor revient au roi."
 nd_bnh_dest_a1: "Sedra des Deux Villes"
 nd_bnh_dest_a1_desc: "L'ordre du général Maphrian atteint Mossoul et Bagdad. Les villes jumelles du Tigre appartiennent au royaume et la route impériale commence."
 nd_bnh_dest_a2: "Marche du général maphrien"
 nd_bnh_dest_a2_desc: "The kingdom's banners reach Tabriz and Basra. Tabriz, where the Ilkhans had once held a Christian-court memory, returns to the Mor; Basra, the Shatt al-Arab, opens the Gulf to Aššur. Mosul, the seat of the kingdom, is built up to bear the march."
 nd_bnh_dest_a3: "La couronne d'Aur"
 nd_bnh_dest_a3_desc: "Damas, Le Caire et Ispahan reconnaissent le général maphrien. Le prestige du royaume le couronne comme successeur légitime de l'Assyrie ; la voie vers la restauration impériale est ouverte. (Formulaire ASR.)"
 nd_bnh_dest_b1: "Hudaye de la diaspora"
 nd_bnh_dest_b1_desc: "Le Hudaye est lu sur l'ancien siège d'Antioche et la soie d'Urfa relie le marché patriarcal à la Route de la Soie. L’intermédiaire chrétien-syriaque tient bon."
 nd_bnh_dest_b2: "Beth Hekma restaurée"
 nd_bnh_dest_b2_desc: "The treasury endows the Translator-Patriarchs of Mosul. The printing press is embraced at Seleucia, Nisibis is built up again around its ancient school, and the diaspora dioceses send back acknowledgments in Syriac, Greek, and Latin."
 nd_bnh_dest_b3: "Les Sièges du Mor"
 nd_bnh_dest_b3_desc: "Samarkand and Jerusalem return to the patriarchal register. The pepper of the Malabar sees is sold in the capital; the kingdom is read across Eurasia as the lawful Christian intermediary, the lasting Light of the East."
 # === Destiny Event Texts ===
 nd_bnh.6.t: "Le mandat de Mor Aur"
 nd_bnh.6.d: "Le Catholicos et l'abbé de Mor Gabriel se réunissent devant le roi avec une proposition solennelle : que le destin du royaume n'est pas encore écrit. Deux voies sont ouvertes. La première est la restauration impériale : le royaume suit la route du Tigre, prend Bagdad, prend Damas, prend le Caire, jusqu'à ce que la couronne d'Aur passe de la mémoire à la loi et que l'empire assyrien se rétablisse. Au fond de la seconde réside la vocation civilisationnelle : le royaume est le pôle chrétien-syriaque durable entre l’Europe latine et l’Asie de la mémoire Tang, le patriarcat qui détient les diocèses de la Route de la Soie, les Patriarches-Traducteurs dont Beth Hekma lit en trois langues."
 nd_bnh.6.a: "Le mandat est pris. Le destin sera écrit."
 nd_bnh.7.t: "Les villes jumelles"
 nd_bnh.7.d: "Mossoul et Bagdad sont pris. Le Tigre coule entièrement sous la bannière du royaume ; les villages de langue araméenne le long du fleuve accueillent le général maphrien ; les anciens noyaux administratifs abbassides sont réorganisés sous le diwan royal. La première étape de la route impériale est parcourue."
 nd_bnh.7.a: "Continuation vers Aur."
 nd_bnh.8.t: "Marche du général maphrien"
 nd_bnh.8.d: "Tabriz et Bassorah tombent. La mémoire ilkhanide des princes chrétiens de Tabriz est invoquée ; le Chatt al-Arab ouvre le Golfe au commerce royal. La colonne en marche du général maphrien est désormais suffisamment forte pour se projeter au-delà de la frontière levantine ou iranienne. Le conseil royal demande comment il sera approvisionné."
 nd_bnh.8.a: "Partez sous la bannière Strategos."
 nd_bnh.8.b: "Construisez le corps de pontons fluviaux."
 nd_bnh.9.t: "La couronne d'Aur"
 nd_bnh.9.d: "Damascus, Cairo, and Isfahan acknowledge the Maphrian-General. The Latin chanceries call him the Assyrian; the Persian courts call him Lord of Two Rivers; the Mamluk seat at Cairo sends back tribute. The Catholicos crowns him as Mor Aššur, lawful king of Assyria, in the cathedral of Mosul. The imperial restoration stands. Beth Nahrain has prepared the way for the Assyrian Empire."
 nd_bnh.9.a: "Couronne-moi protecteur du Levant."
 nd_bnh.9.b: "Augmentez les prélèvements Aur sur chaque terre conquise."
 nd_bnh.10.t: "Hudaye de la diaspora"
 nd_bnh.10.d: "Antioche est restituée au royaume et le livre des lois Hudaye est lu à l'ancien siège patriarcal. La soie arrive de nouveau à Mossoul par les caravanes d'Urfa ; les diocèses de la Route de la Soie reconnaissent l’intermédiaire chrétien-syriaque comme siège patriarcal légitime. La Lumière de l’Orient s’allume."
 nd_bnh.10.a: "La Lumière de l’Orient s’allume."
 nd_bnh.11.t: "Beth Hekma restaurée"
 nd_bnh.11.d: "Le trésor royal dote les traducteurs-patriarches de Mossoul. L'imprimerie est adoptée à Séleucie ; Les écritures araméennes, grecques et arabes sont rédigées en caractères mobiles dans les œuvres patriarcales. Les diocèses de la diaspora envoient des remerciements depuis Trichur, Tabriz et Reims. Le royaume doit maintenant décider comment sa machine civilisationnelle sera gouvernée."
 nd_bnh.11.a: "Refondé la Maison de la Sagesse sous le patriarcat."
 nd_bnh.11.b: "Convoquer le synode de Séleucie et le consolider."
 nd_bnh.12.t: "Les Sièges du Mor"
 nd_bnh.12.d: "Samarkand and Jerusalem return to the patriarchal register. Malabar pepper is sold in the capital's market. The Latin chanceries, the Persian courts, the Tang-memory ministries of the Mongol successor states all read Beth Nahrain as the lawful Christian intermediary, the lasting pole between west and east. The Light of the East stands; the kingdom is complete without imperial pretension."
 nd_bnh.12.a: "Envoyez les métropolitains dans les diocèses éloignés."
 nd_bnh.12.b: "Dotez l'Académie araméenne et consolidez-la chez vous."
 # === Destiny Timed Modifier Names ===
 STATIC_MODIFIER_NAME_nd_bnh_dest_strategos_march: "Marche Stratégos"
 STATIC_MODIFIER_DESC_nd_bnh_dest_strategos_march: "La colonne du général maphrien se déplace sous l'ancienne bannière byzantine-sassanide du Stratège : choc de cavalerie lourde, pillage de chaque ville tombée et un royaume payant le prix politique d'une campagne permanente."
 STATIC_MODIFIER_NAME_nd_bnh_dest_riverine_logistics: "Corps de logistique fluviale"
 STATIC_MODIFIER_DESC_nd_bnh_dest_riverine_logistics: "Les pontoniers royaux reconstruisent le réseau de pontons Tigre-Euphrate comme colonne vertébrale logistique. Chaque pont, fort et dépôt est aménagé par des ingénieurs en écriture araméenne ; les ministères de la construction du royaume bourdonnent au rythme du temps de paix."
 STATIC_MODIFIER_NAME_nd_bnh_dest_crown_of_assur: "La couronne d'Aur"
 STATIC_MODIFIER_DESC_nd_bnh_dest_crown_of_assur: "Le général maphrien est couronné protecteur du Levant. Les armées royales combattent sous le mandat sacré de la Couronne ; la guerre contre les États hérétiques environnants est considérée comme juste ; mais tous les voisins se souviennent du Caire et tardent à subir de nouvelles provocations."
 STATIC_MODIFIER_NAME_nd_bnh_dest_assyrian_levies: "Prélèvements d'Aur"
 STATIC_MODIFIER_DESC_nd_bnh_dest_assyrian_levies: "Chaque ville conquise envoie son quota de levées sous bannières royales. Les registres de mercenaires du royaume gonflent, les ministères casus belli rédigent quotidiennement de nouvelles provocations et la machine impériale avance."
 STATIC_MODIFIER_NAME_nd_bnh_dest_house_of_wisdom: "Maison de la Sagesse"
 STATIC_MODIFIER_DESC_nd_bnh_dest_house_of_wisdom: "Les patriarches-traducteurs de Mossoul ont refondé le Bayt al-Hikma sous dotation royale. Des diplomates sont envoyés dans toutes les chancelleries, depuis Reims jusqu'à Cathay ; les centres commerciaux patriarcaux se développent ; mais les allocations des Mor et les subventions de la diaspora dévalorisent la pièce."
 STATIC_MODIFIER_NAME_nd_bnh_dest_seleucia_synod: "Le synode de Séleucie"
 STATIC_MODIFIER_DESC_nd_bnh_dest_seleucia_synod: "Le synode du patriarcat se réunit à Séleucie, siège de l'époque sassanide. Les sujets, les alliés et les provinces métropolitaines jurent tous fidélité à la cathédrale ; le développement du royaume s'aggrave tranquillement ; les envoyés royaux négocient avec un poids surprenant."
 STATIC_MODIFIER_NAME_nd_bnh_dest_metropolitanate: "Métropole lointaine"
 STATIC_MODIFIER_DESC_nd_bnh_dest_metropolitanate: "Le Patriarcat envoie des métropolites à Samarkand, Trichur et dans les ports méditerranéens. Le commerce maritime gonfle ; le royaume embauche des mercenaires de la diaspora à bas prix ; les domaines de la bourgeoisie et du clergé travaillent de concert."
 STATIC_MODIFIER_NAME_nd_bnh_dest_aramaic_academy: "Académie araméenne"
 STATIC_MODIFIER_DESC_nd_bnh_dest_aramaic_academy: "The kingdom endows the Aramaic Academy at Mosul as the highest civic institution. Spy networks, military tacticians, and patriarchal officers train here; but the kingdom's scholar-classes settle into the comfortable certainty of being the Light of the East, and old ways harden."
 # === Destiny Buildings ===
 nd_bnh_ziggurat_of_assur: "Ziggourat d'Aur"
 nd_bnh_ziggurat_of_assur_desc: "Un monument impérial de style assyrien restauré au siège du général maphrien. Mi-temple d'État, mi-caserne de la garde impériale, la ziggourat annonce la restauration assyrienne à tous les peuples environnants et lie le noyau mésopotamien conquis à la capitale dynastique."
 nd_bnh_beth_hekma: "Beth Hekma"
 nd_bnh_beth_hekma_desc: "Le royaume de Bayt al-Hikma a été relancé, reconstruit sous le patriarcat de Séleucie-Ctésiphon. Traducteurs, astronomes, médecins et juristes synodaux travaillent en parallèle ; l'institution qui fait de Beth Nahrain la Lumière durable de l'Orient."
 # === Destiny Building PM Loc ===
 nd_bnh_ziggurat_of_assur_upkeep: "Entretien de la ziggourat"
 nd_bnh_ziggurat_of_assur_upkeep_desc: "La maçonnerie, l'armement et les outils nécessaires à l'entretien du monument impérial et de sa caserne de garnison."
 nd_bnh_beth_hekma_upkeep: "Entretien de Beth Hekma"
 nd_bnh_beth_hekma_upkeep_desc: "Papier, livres, encens et cire d'abeille pour l'académie patriarcale des traducteurs, astronomes et médecins."
 # === Bureaucracies ===
 bnh_catholicate_of_the_east_bureaucracy: "Catholicisme d'Orient"
 bnh_catholicate_of_the_east_bureaucracy_desc: "Le Catholicos-Patriarche d'Orient préside depuis la cathédrale de Mossoul, ses métropolites nommés dans toute la Mésopotamie, en Perse et dans les missions survivantes du Kerala et de Khanbaliq. Le tribunal patriarcal juge le mariage chrétien, l'héritage et la discipline synodale en tant que bras parallèle du royaume. Lorsqu'elle est soutenue, la portée de l'Église magnifie la dévotion et la conversion royales ; Lorsqu'ils sont négligés, le clergé et les notables ruraux sont mécontents du détournement de la dîme vers une cour à laquelle ils ne participent plus."
 bnh_maphrianate_of_tagrit_bureaucracy: "Maphrianat de Tagrit"
 bnh_maphrianate_of_tagrit_bureaucracy_desc: "Le Maphrien de l'Est, venant du monastère de Mor Mattai et juste derrière le patriarche d'Antioche, détient les diocèses syriaques orthodoxes à l'est de l'Euphrate. Bar Hebraeus occupa cette fonction à partir de 1264 et l'utilisa pour rédiger la Chronographie. Soutenu, le Maphrianate forme une classe cléricale alphabétisée et codifie le droit canonique syriaque ; négligées, les frictions avec Antioche alimentent l’antagonisme externe et la lente dégradation de la stabilité."
 bnh_tur_abdin_defenders_bureaucracy: "Défenseurs de Tur Abdin"
 bnh_tur_abdin_defenders_bureaucracy_desc: "Les monastères-falaises du plateau de Tur Abdin (Mor Gabriel (fondé en 397), Deir al-Zafaran, Mor Yaqub de Salah) et leurs réseaux de milices villageoises détenaient les hauts plateaux mésopotamiens comme une frontière chrétienne autogérée sous les suzerains successifs d’Artuqid, Ilkhan, Aq Qoyunlu et ottoman. La reconnaissance royale officialise les évêques-abbés comme gouverneurs des frontières. L'infanterie légère et soutenue combat plus fort et récupère plus rapidement; négligés, les évêques gardent leurs armes mais cessent d'envoyer des revenus à Mossoul."
 bnh_aramaic_chancery_bureaucracy: "Chancellerie araméo-syriaque"
 bnh_aramaic_chancery_bureaucracy_desc: "Les scriptoria de Mor Mattai, Mor Gabriel et Deir al-Zafaran formaient des scribes qui servaient non seulement l'Église mais aussi les tribunaux sassanides, abbassides et ilkhanides en syriaque et en araméen. La Crème de sagesse de Bar Hebraeus et la correspondance judiciaire bilingue syriaque-arabe du XIIIe siècle documentent une classe cléricale-bureaucratique instruite. Refondée en fonction publique permanente, la chancellerie fait des ménages bourgeois et religieux de Mossoul, d'Edesse et de Nusaybin l'épine dorsale alphabétisée du royaume."
 # === Bureaucracy Authority Auto-Modifier ===
 AUTO_MODIFIER_NAME_nd_bnh_bureaucracy_authority: "Autorité bureaucratique de Beth Nahrain"
 AUTO_MODIFIER_DESC_nd_bnh_bureaucracy_authority: "On formation, Beth Nahrain gains the ability to host historical Syriac Christian bureaucracies."
