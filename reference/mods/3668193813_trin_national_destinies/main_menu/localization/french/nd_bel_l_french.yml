l_french:
 STATIC_MODIFIER_NAME_nd_bel_workshop_of_the_world: "Atelier du Monde"
 STATIC_MODIFIER_DESC_nd_bel_workshop_of_the_world: "Les gisements de charbon, les fonderies de fer et les usines de machines de la Belgique en ont fait le moteur industriel de l'Europe continentale. Du Sillon Industriel aux usines textiles de Gand, l'industrie manufacturière belge ouvre la voie à l'ère moderne."
 STATIC_MODIFIER_NAME_nd_bel_scrap_of_paper: "Morceau de papier, Bouclier des Nations"
 STATIC_MODIFIER_DESC_nd_bel_scrap_of_paper: "Les grandes puissances ont garanti la neutralité belge par traité. Ce petit État situé au carrefour de l’Europe ne survit pas grâce à la force des armes, mais grâce à la force du droit international, aux compétences diplomatiques et à la prospérité tranquille qu’apporte la paix."
 STATIC_MODIFIER_NAME_nd_bel_constitutional_spirit: "Esprit de la Constitution"
 STATIC_MODIFIER_DESC_nd_bel_constitutional_spirit: "La Constitution belge de 1831 constitue un modèle de gouvernance libérale, protégeant les libertés individuelles tout en liant deux communautés linguistiques sous une monarchie constitutionnelle."
 STATIC_MODIFIER_NAME_nd_bel_industrial_momentum: "Dynamisme industriel"
 STATIC_MODIFIER_DESC_nd_bel_industrial_momentum: "Les mines de charbon du Borinage et les hauts fourneaux de Liège ont transformé la vallée de Sambre-Meuse en un couloir de fumée, d'acier et de production incessante."
 nd_bel.1.t: "La naissance de la Belgique"
 nd_bel.1.d: "The revolution has succeeded. From the opera house in Brussels to the barricades of the September Days, the people of the southern provinces have thrown off the yoke of the United Kingdom of the Netherlands. Now a new nation takes shape, one that must forge its own identity from the Flemish cloth halls of Ghent, the Walloon forges of Liege, and the cosmopolitan salons of Brussels.\n\nThe great powers watch with interest. Belgium sits at the crossroads of Europe, and the path it chooses now will determine whether this small nation becomes a workshop of industry or a haven of diplomacy and peace.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bel.1.a: "Allumez les fourneaux : la Belgique sera la forge de l’Europe !"
 nd_bel.1.b: "Que le traité soit notre bouclier et compromette notre force."
 nd_bel.2.t: "La Constitution belge"
 nd_bel.2.d: "On February 7, 1831, the National Congress adopted what would become one of the most progressive constitutions in Europe. It established a constitutional monarchy with broad guarantees of individual liberties, freedom of the press, freedom of association, freedom of worship, and freedom of education. The title 'King of the Belgians' rather than 'King of Belgium' was a deliberate choice, emphasizing that sovereignty rested with the people, not the crown.\n\nThe Belgian model would inspire constitutional reformers across the continent for decades to come, proving that a diverse nation could govern itself through law rather than force."
 nd_bel.2.a: "Une constitution digne d'un peuple libre."
 nd_bel.3.t: "Le Sillon Industriel"
 nd_bel.3.d: "The Sambre-Meuse river valley has been transformed. From Mons to Liege, the old agricultural landscape has given way to a continuous corridor of coal pits, blast furnaces, machine shops, and railway lines. John Cockerill's integrated ironworks at Seraing has become the largest manufacturing complex on the continent, producing everything from steam engines to iron rails.\n\nBelgium is now the first country on the European mainland to fully industrialize, and the Sillon Industriel, the 'Industrial Furrow', stands as living proof that the age of coal and steel has arrived."
 nd_bel.3.a: "Les fourneaux ne doivent jamais refroidir."
 nd_bel.4.t: "La Bourse d'Anvers"
 nd_bel.4.d: "In 1531, a magnificent new building opened its doors in Antwerp, the world's first purpose-built commodities exchange. Here, merchants from across Europe gather to trade not just goods but futures, options, and bills of exchange. The Bourse has transformed Antwerp from a mere port into the financial capital of the continent, where the price of pepper from the Indies and silver from the Americas is set daily.\n\nThe inscription above its entrance reads: 'For the use of merchants of all nations and all languages', a fitting motto for a city that welcomes the world."
 nd_bel.4.a: "Le commerce ne connaît pas de frontières."
 nd_bel.5.t: "Les primitifs flamands"
 nd_bel.5.d: "A revolution in painting has emerged from the workshops of Flanders. Jan van Eyck, working at the Burgundian court in Bruges, has perfected the technique of oil painting, achieving a luminosity and detail that astonishes all who see his work. His Ghent Altarpiece, completed in 1432, is hailed as the greatest painting in Europe.\n\nRogier van der Weyden in Brussels, Hans Memling in Bruges, and Hugo van der Goes in Ghent continue the tradition, establishing the Low Countries as the artistic center of northern Europe. Italian masters cross the Alps to study their techniques."
 nd_bel.5.a: "Que le monde s'émerveille devant la maîtrise flamande."
 nd_bel_flemish_cloth_halls: "Halles aux draps flamandes"
 nd_bel_flemish_cloth_halls_desc: "Les grands Lakenhallen d'Ypres, de Bruges et de Gand, où les tissus flamands étaient inspectés, classés et vendus à des marchands de toute l'Europe."
 nd_bel_bruges_banking: "Banque à Bruges"
 nd_bel_bruges_banking_desc: "Les innovations financières de Bruges, où les banquiers d'affaires italiens ont créé la première bourse et ont été les pionniers des instruments de financement du commerce international."
 nd_bel_burgundian_tapestries: "Tapisseries Bourguignonnes"
 nd_bel_burgundian_tapestries_desc: "Les ateliers de tapisserie de Bruxelles, Tournai et Arras qui ont produit les plus belles œuvres d'art tissées d'Europe, ornant les cours des rois de Paris à Rome."
 nd_bel_flemish_primitives: "Primitifs flamands"
 nd_bel_flemish_primitives_desc: "L'école révolutionnaire des peintres néerlandais (Van Eyck, Van der Weyden, Memling) qui perfectionna la peinture à l'huile et transforma l'art européen."
 nd_bel_walloon_guards_tradition: "Tradition des Gardes wallonnes"
 nd_bel_walloon_guards_tradition_desc: "La tradition de l'infanterie catholique d'élite recrutée en Wallonie, servant comme soldats professionnels dans les armées espagnoles et formant plus tard l'épine dorsale de l'identité militaire belge."
 nd_bel_antwerp_bourse: "Bourse d'Anvers"
 nd_bel_antwerp_bourse_desc: "La première bourse de matières premières au monde, créée à Anvers en 1531, où les marchands de toutes les nations échangeaient des marchandises, des contrats à terme et des lettres de change."
 nd_bel_plantin_press: "Presse Plantin"
 nd_bel_plantin_press_desc: "L'imprimerie de Christophe Plantin à Anvers est devenue la plus grande d'Europe, publiant la Bible polyglotte et faisant des Pays-Bas un centre de production de livres."
 nd_bel_fortified_cities: "Villes fortifiées"
 nd_bel_fortified_cities_desc: "Les centres urbains fortifiés des Pays-Bas méridionaux (Anvers, Bruxelles, Gand, Namur) dont les murailles et bastions en faisaient de redoutables places fortes."
 nd_bel_liege_arms_industry: "Industrie d'armement liégeoise"
 nd_bel_liege_arms_industry_desc: "The weapons manufactories of Liege and its surroundings, producing firearms, edged weapons, and armor of renowned quality for armies across Europe.\n\n#italic Available in: $nd_bel_liege_armory$#!"
 nd_bel_abbey_brewing: "Tradition brassicole de l'abbaye"
 nd_bel_abbey_brewing_desc: "Les traditions brassicoles monastiques des brasseries trappistes et abbayes belges, où les moines ont perfectionné l'art de la fabrication de la bière au fil des siècles."
 nd_bel_lace_industry: "Industrie de la dentelle bruxelloise"
 nd_bel_lace_industry_desc: "La délicate dentelle à l'aiguille et aux fuseaux de Bruxelles, Bruges et Malines, textiles de luxe prisés dans les cours d'Europe."
 nd_bel_collateral_councils: "Conseils collatéraux"
 nd_bel_collateral_councils_desc: "Le Conseil d'État, le Conseil privé et le Conseil des finances qui gouvernaient le sud des Pays-Bas sous la domination des Habsbourg, assuraient la continuité administrative."
 nd_bel_antwerp_diamond_exchange: "Bourse du Diamant d'Anvers"
 nd_bel_antwerp_diamond_exchange_desc: "Antwerp's diamond cutting quarter, where skilled craftsmen transformed rough stones into brilliant gems, making the city the world capital of the diamond trade.\n\n#italic Available in: $nd_bel_diamantwijk$#!"
 nd_bel_cockerill_ironworks: "Usine sidérurgique de Cockerill"
 nd_bel_cockerill_ironworks_desc: "Le complexe de fabrication intégré de John Cockerill à Seraing près de Liège, la plus grande usine sidérurgique du continent européen, produisant des moteurs à vapeur, des rails et des machines."
 nd_bel_sillon_industriel: "Sillon Industriel"
 nd_bel_sillon_industriel_desc: "Le corridor industriel le long de la vallée de la Sambre-Meuse, de Mons à Liège, où l'extraction du charbon, la sidérurgie et la fabrication de machines ont fait de la Belgique le premier pays industrialisé du continent."
 nd_bel_civic_guard_tradition: "Tradition de la Garde civique"
 nd_bel_civic_guard_tradition_desc: "La Garde Civique, la milice citoyenne qui a défendu la Révolution belge et maintenu l'ordre dans le nouvel État, s'appuyant sur l'ancienne tradition des milices urbaines des Pays-Bas."
 nd_bel_canal_infrastructure: "Infrastructures de canaux"
 nd_bel_canal_infrastructure_desc: "Le réseau de canaux reliant les systèmes fluviaux de l'Escaut, de la Meuse et du Rhin, permettant le transport à bas prix du charbon, de l'acier et des produits manufacturés à travers les Pays-Bas."
 nd_bel_verviers_wool: "Industrie Lainière Verviétoise"
 nd_bel_verviers_wool_desc: "The mechanized wool processing industry of Verviers, where William Cockerill installed the first spinning machines on the continent, transforming artisan workshops into modern factories.\n\n#italic Available in: $nd_bel_tapisserie$#!"
 nd_bel_constitution_of_1831: "Constitution de 1831"
 nd_bel_constitution_of_1831_desc: "L'une des constitutions les plus libérales d'Europe, établissant la liberté de la presse, la liberté d'association et une monarchie constitutionnelle où la souveraineté appartient au peuple."
 nd_bel_chasseurs_ardennais: "Chasseurs Ardennais"
 nd_bel_chasseurs_ardennais_desc: "Spécialistes de l'infanterie légère d'élite des forêts et collines ardennaises, connus pour leur ténacité, leur savoir-faire de terrain et leur béret vert avec insigne de sanglier."
 nd_bel_continental_railways: "Chemins de fer continentaux"
 nd_bel_continental_railways_desc: "Le réseau ferroviaire pionnier de la Belgique, le premier sur le continent européen, reliant Bruxelles à Malines en 1835 et s'étendant rapidement pour relier tous les grands centres industriels."
 nd_bel_national_bank: "Banque Nationale"
 nd_bel_national_bank_desc: "La Banque nationale de Belgique, créée pour assurer la stabilité financière, gérer la monnaie et répondre aux besoins de crédit de la nouvelle économie industrielle."
 nd_bel_walloon_steelworks: "Aciéries wallonnes"
 nd_bel_walloon_steelworks_desc: "The mature steel industry of Wallonia, where the Bessemer process and open-hearth furnaces produce the structural steel that builds railways, bridges, and factories across Europe.\n\n#italic Available in: $nd_bel_cockerillsmelterij$#!"
 nd_bel_linguistic_compromise: "Compromis linguistique"
 nd_bel_linguistic_compromise_desc: "L'accommodement pragmatique entre les communautés flamande et wallonne, reconnaissant que la force de la Belgique réside dans l'unité par la diversité plutôt que dans l'assimilation forcée."
 a_nd_bel_walloon_guards: "Gardes wallons"
 a_nd_bel_walloon_guards_desc: "Infanterie professionnelle d'élite recrutée en Wallonie catholique. Initialement élevés pour le service espagnol, ces soldats disciplinés sont réputés pour leur fermeté au combat et leur loyauté envers leurs commandants."
 a_nd_bel_civic_guard: "Garde Civique"
 a_nd_bel_civic_guard_desc: "Milices citoyennes armées issues de la population urbaine. Héritière de l'ancienne tradition des milices civiques des Pays-Bas, la Garde Civique défend l'État belge avec la ferveur de ceux qui se sont battus pour leur propre liberté."
 a_nd_bel_chasseurs_ardennais: "Chasseurs Ardennais"
 a_nd_bel_chasseurs_ardennais_desc: "Infanterie légère d'élite des Ardennes, entraînée à la guerre en forêt, aux tactiques d'embuscade et aux déplacements rapides sur terrain difficile. Leurs bérets verts les désignent comme les « Loups verts » de l'armée belge."
 nd_bel_lakenhalle: "Lakenhalle"
 nd_bel_lakenhalle_desc: "Une grande salle d'inspection et de commerce de tissus dans la tradition flamande, où les textiles sont classés en fonction de leur qualité et vendus à des marchands de toute l'Europe."
 nd_bel_tapisserie: "Tapisserie"
 nd_bel_tapisserie_desc: "Un atelier de tapisserie dans la tradition bourguignonne, où des tisserands qualifiés créent de magnifiques œuvres textiles à partir de laine, de soie et de teintures précieuses."
 nd_bel_abdijbrouwerij: "Abdijbrouwerij"
 nd_bel_abdijbrouwerij_desc: "Une brasserie monastique où les moines trappistes élaborent des bières distinctives en utilisant des recettes traditionnelles perfectionnées au cours de siècles de travail contemplatif."
 nd_bel_drukkerij: "Drukkerie"
 nd_bel_drukkerij_desc: "Un atelier d'imprimerie dans la tradition de l'Officina de Christophe Plantin, produisant des livres, des cartes et des brochures qui diffusent le savoir à travers l'Europe."
 nd_bel_diamantwijk: "Diamantwijk"
 nd_bel_diamantwijk_desc: "Un quartier de taille et de polissage de diamants où des maîtres artisans transforment les pierres brutes en pierres précieuses brillantes, ce qui en fait le centre mondial du commerce du diamant."
 nd_bel_vesting: "Acquisition"
 nd_bel_vesting_desc: "Une forteresse vedette dans la tradition du sud des Pays-Bas, avec des bastions inclinés et des défenses en couches conçues pour résister à l'artillerie de siège."
 nd_bel_liege_armory: "Armurerie de Liège"
 nd_bel_liege_armory_desc: "Un atelier d'armement dans la tradition de la Principauté de Liège, où des armuriers qualifiés produisent des armes à feu et des armements de qualité reconnue pour les armées de toute l'Europe."
 nd_bel_cockerillsmelterij: "Fonderie de Cockerills"
 nd_bel_cockerillsmelterij_desc: "Une fonderie de fer et des machines intégrées fonctionnent dans le style du complexe de Cockerill à Seraing, produisant de l'acier, des moteurs à vapeur et des machines industrielles."
 nd_bel_lakenhalle_upkeep: "Entretien de la Halle aux Draps"
 nd_bel_lakenhalle_upkeep_desc: "La laine brute, les colorants, les tissus finis et les registres de papier étaient nécessaires au bon fonctionnement des opérations d'inspection et de commerce du hall."
 nd_bel_tapestry_weaving: "Tissage de tapisserie"
 nd_bel_tapestry_weaving_desc: "L'artisanat minutieux du tissage de grandes tapisseries à partir de laine, de soie et de teintures précieuses, chaque pièce étant une œuvre d'art dont la réalisation peut prendre des mois."
 nd_bel_abbey_ale_brewing: "Brassage de la bière d'abbaye"
 nd_bel_abbey_ale_brewing_desc: "L'art monastique de brasser des bières riches et complexes à partir de blé, de miel et de recettes secrètes transmises de génération en génération de moines trappistes."
 nd_bel_book_printing: "Impression de livres"
 nd_bel_book_printing_desc: "Le métier de composer, d'imprimer et de relier des livres, des traités théologiques aux cartes de navigation, dans la tradition du grand atelier de Plantin."
 nd_bel_diamond_cutting: "Taille du diamant"
 nd_bel_diamond_cutting_desc: "L'art précis de cliver, tailler et polir les diamants bruts pour en faire des pierres précieuses brillantes, un métier qui a fait d'Anvers la capitale mondiale du diamant."
 nd_bel_vesting_upkeep: "Entretien de la forteresse"
 nd_bel_vesting_upkeep_desc: "Pierre, armement, armes à feu, canons et outils nécessaires pour maintenir les bastions et la garnison d'une forteresse stellaire en pleine préparation défensive."
 nd_bel_cockerill_steel_making: "Production d'acier Cockerill"
 nd_bel_cockerill_steel_making_desc: "Processus intégré de fusion du minerai de fer avec du coke pour produire de l'acier de haute qualité pour les chemins de fer, les ponts et les machines industrielles."
 nd_bel_liege_firearms_production: "Production d'armes à feu à Liège"
 nd_bel_liege_firearms_production_desc: "Les ateliers d'armes renommés de Liège, produisant des mousquets, des pistolets et des fusils d'une qualité exceptionnelle pour les armées de toute l'Europe."
 levy_nd_bel_civic_guard: "Garde Civique"
 levy_nd_bel_civic_guard_desc: "Milice citoyenne belge, volontaires armés des villes qui défendent leurs communautés."
 nd_bel_formed_tt: "La Belgique est constituée"
 nd_bel_path_a_tt: "A choisi l'Atelier du Monde"
 nd_bel_path_b_tt: "Choisissez un morceau de papier, Bouclier des Nations"
 nd_bel_destiny: "Destin belge"
 nd_bel_destiny_desc: "La Belgique est née de la révolution. La voie à suivre commence par une gouvernance stable, et ce n’est qu’alors que la nation pourra poursuivre la destinée qu’elle a choisie."
 nd_bel_dest_liege_developed_tt: "We own #bold Liège#! and its development is at least #bold 36#!"
 nd_bel_dest_brussels_developed_tt: "We own #bold Brussels#! and its development is at least #bold 46#!"
 nd_bel_dest_forge_belt: "La ceinture de forge"
 nd_bel_dest_forge_belt_desc: "Sécuriser les frontières industrielles. Le charbon d'Aix-la-Chapelle et les forges de Cambrai doivent passer sous contrôle belge pour alimenter l'atelier du monde."
 nd_bel_dest_ruhr: "Le couloir de la Ruhr"
 nd_bel_dest_ruhr_desc: "Extend Belgian industrial dominion into the Westphalian coalfields. Essen's furnaces shall feed Belgian ambition, and Liège, the forge on the Meuse, must grow to match the scale of this enterprise."
 nd_bel_dest_continental_forge: "Forge Continentale"
 nd_bel_dest_continental_forge_desc: "De la Meuse au Rhin, de la Flandre à la Seine, la Belgique domine le cœur industriel de l'Europe. Cologne et Paris reconnaissent la suprématie belge."
 nd_bel_dest_treaty: "Le bouclier du traité"
 nd_bel_dest_treaty_desc: "Derrière le bouclier d’une neutralité garantie, la Belgique prospère. Adoptez le système bancaire moderne et accumulez la richesse qui rend un petit État indispensable."
 nd_bel_dest_model: "Constitution modèle"
 nd_bel_dest_model_desc: "The Belgian constitution inspires reformers across Europe. Extend your diplomatic influence to The Hague and build Brussels up into a capital worthy of the congress that wrote it."
 nd_bel_dest_heart_of_europe: "Coeur de l'Europe"
 nd_bel_dest_heart_of_europe_desc: "Bruxelles est devenue la capitale diplomatique du continent. Les produits de luxe circulent sur les marchés belges et les hommes d'État du monde entier se rassemblent dans les halls belges."
 STATIC_MODIFIER_NAME_nd_bel_dest_industrial_expansion: "Expansion industrielle"
 STATIC_MODIFIER_DESC_nd_bel_dest_industrial_expansion: "L’industrie belge se développe le long des gisements de charbon et des vallées fluviales, protégée par des barrières tarifaires et soutenue par une main-d’œuvre bon marché."
 STATIC_MODIFIER_NAME_nd_bel_dest_coal_barons: "Barons du charbon"
 STATIC_MODIFIER_DESC_nd_bel_dest_coal_barons: "Les capitaines d’industrie exercent une énorme influence, canalisant les bénéfices des mines vers des entreprises commerciales tandis que les travailleurs supportent le coût des perturbations industrielles."
 STATIC_MODIFIER_NAME_nd_bel_dest_beacon_of_liberty: "Phare de la Liberté"
 STATIC_MODIFIER_DESC_nd_bel_dest_beacon_of_liberty: "La constitution libérale de la Belgique et son engagement en faveur de l'éducation et de l'innovation en font un modèle pour les penseurs progressistes, même si l'esprit pacifiste rend la guerre plus coûteuse."
 STATIC_MODIFIER_NAME_nd_bel_dest_pragmatic_compromise: "Compromis pragmatique"
 STATIC_MODIFIER_DESC_nd_bel_dest_pragmatic_compromise: "Le génie belge du compromis et de l’accommodement maintient la cohésion d’une nation diversifiée et gagne la loyauté de ses partenaires par la conciliation plutôt que par la coercition."
 STATIC_MODIFIER_NAME_nd_bel_dest_iron_discipline: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_bel_dest_iron_discipline: "Les armes belges et la discipline belge font l'envie de l'Europe. La forge industrielle a été transformée à des fins militaires, même si l’accent incessant mis sur la force martiale se fait au détriment d’activités plus douces."
 STATIC_MODIFIER_NAME_nd_bel_dest_arsenal_of_europe: "Arsenal d'Europe"
 STATIC_MODIFIER_DESC_nd_bel_dest_arsenal_of_europe: "Des armureries de Liège aux fonderies de la Ruhr, les armes belges équipent la moitié du continent. La patrie est une forteresse, même si la complaisance industrielle menace l’innovation."
 STATIC_MODIFIER_NAME_nd_bel_dest_congress_of_nations: "Congrès des Nations"
 STATIC_MODIFIER_DESC_nd_bel_dest_congress_of_nations: "Bruxelles est devenue le siège de la diplomatie européenne, où les traités sont signés, les différends arbitrés et l'équilibre des pouvoirs maintenu grâce à la médiation belge."
 STATIC_MODIFIER_NAME_nd_bel_dest_merchant_republic: "République marchande"
 STATIC_MODIFIER_DESC_nd_bel_dest_merchant_republic: "Les marchands belges dominent le carrefour du commerce européen. La bourse d'Anvers fixe les prix, les banques bruxelloises fixent les conditions et le port d'Ostende relie le continent au monde."
 nd_bel.6.t: "Un destin forgé"
 nd_bel.6.d: "Belgium stands. Born from revolution, bound by constitution, this small nation at the crossroads of Europe has proven that it can endure. The great powers may have guaranteed our borders, but it is we who must decide what kind of nation we shall become.\n\nThe path ahead is ours to choose."
 nd_bel.6.a: "La Belgique perdurera."
 nd_bel.7.t: "La ceinture de forge sécurisée"
 nd_bel.7.d: "The borderlands have fallen into Belgian hands. Aachen's workshops and Cambrai's forges now serve Belgian industry. The coal and iron of the frontier feed a growing appetite for steel, and the blast furnaces burn day and night.\n\nThis is just the beginning. Greater prizes lie beyond, the vast coalfields of the Ruhr await."
 nd_bel.7.a: "Les fourneaux ne doivent jamais refroidir."
 nd_bel.8.t: "Sous le bouclier du traité"
 nd_bel.8.d: "The treaty of guarantee holds firm. Behind this shield of paper and ink, Belgium prospers in ways that empires cannot. Our banks lend to kings, our merchants trade with all, and our neutrality is the foundation upon which continental peace rests.\n\nLet others wage war. Belgium shall grow rich in peace."
 nd_bel.8.a: "La paix est notre forteresse."
 nd_bel.9.t: "Le couloir de la Ruhr"
 nd_bel.9.d: "Belgian industry now extends deep into the Westphalian coalfields. The integration of Ruhr coal with Belgian steel has created an industrial complex without equal on the continent. Liège has grown into a city of furnaces along the Meuse, smoke rises from a thousand chimneys, and the railway links grow thicker by the month.\n\nBut power of this scale demands choices. Shall we protect our industries behind tariff walls, or shall we let the coal barons reshape our society as they see fit?"
 nd_bel.9.a: "Augmentez les tarifs : protégez l’industrie belge !"
 nd_bel.9.b: "Laissons les industriels bâtir leurs empires."
 nd_bel.10.t: "Le modèle belge"
 nd_bel.10.d: "Reformers from Berlin to Buenos Aires study the Belgian constitution, and come to see it at work in a Brussels grown into a true capital. Our separation of powers, our guarantee of individual liberties, our accommodation of linguistic diversity, these innovations have made Belgium a model for nations seeking to govern themselves through law rather than force.\n\nShall we lean into this role as a beacon of progressive reform, or shall we emphasize the pragmatic compromises that hold our own diverse nation together?"
 nd_bel.10.a: "Que la Belgique soit un phare de liberté !"
 nd_bel.10.b: "Le compromis est le génie belge."
 nd_bel.11.t: "La Forge Continentale"
 nd_bel.11.d: "From the spires of Cologne to the boulevards of Paris, Belgium commands the industrial heart of Europe. The great cities of the continent acknowledge what the coal barons and steel magnates always knew, that the nation that controls the forge controls the future.\n\nBelgian arms and Belgian steel have built an empire of industry. Shall we forge iron discipline to defend it, or shall we become the arsenal that arms all of Europe?"
 nd_bel.11.a: "Discipline : la forge exige de l'ordre."
 nd_bel.11.b: "Laissons les armes belges approvisionner le continent."
 nd_bel.12.t: "Le cœur de l'Europe"
 nd_bel.12.d: "Brussels has become what Vienna once was, the diplomatic capital of the continent. In the grand palaces along the Rue de la Loi, ambassadors negotiate, treaties are drafted, and the affairs of nations are settled over Belgian chocolate and Trappist ale.\n\nThe world comes to Brussels. Shall we become the permanent congress of nations, or shall we let our merchants transform this diplomatic capital into a commercial one?"
 nd_bel.12.a: "Bruxelles arbitrera les affaires des nations."
 nd_bel.12.b: "Que le commerce soit la langue de la diplomatie."
 nd_bel_wapenfabriek: "Wapenfabriek"
 nd_bel_wapenfabriek_desc: "Une usine d'armement nationale belge, combinant la tradition armurière de Liège avec l'acier de la Ruhr et la fabrication à l'échelle industrielle pour produire des armes pour les armées européennes."
 nd_bel_national_arms_production: "Production nationale d'armes"
 nd_bel_national_arms_production_desc: "La production industrielle d'armes et d'équipements militaires, combinant du fer, du charbon et des outils de précision dans un complexe industriel qui éclipse l'atelier d'armurier traditionnel."
 nd_bel_palais_des_nations: "Palais des Nations"
 nd_bel_palais_des_nations_desc: "Un grand palais diplomatique où les hommes d'État européens se réunissent pour négocier des traités, arbitrer des différends et gérer les affaires des nations grâce à l'hospitalité belge."
 nd_bel_diplomatic_upkeep: "Hospitalité diplomatique"
 nd_bel_diplomatic_upkeep_desc: "Les dépenses considérables liées à l'entretien d'un palais diplomatique, d'une papeterie raffinée, d'un mobilier luxueux, de vins importés et du cadre élégant attendu par les dignitaires en visite."

 # ===== BUREAUCRACIES =====
 bel_joyous_entry_bureaucracy: "Joyeuse entrée du Brabant"
 bel_joyous_entry_bureaucracy_desc: "La charte constitutionnelle accordée par la duchesse Jeanne et le duc Venceslas le 3 janvier 1356, liant tout duc successeur au droit coutumier et exigeant le consentement des successions pour les nouveaux impôts et les nominations ducales. Soutenue à nouveau par chaque prince à son Inkomst, la charte consacre le droit de désobéissance aux ordres illégaux et fait du Brabant le premier pays des Pays-Bas à contraindre son prince par une loi écrite."
 bel_great_council_mechelen_bureaucracy: "Grand Conseil de Malines"
 bel_great_council_mechelen_bureaucracy_desc: "Charles le Téméraire fit de Malines le siège de la Cour suprême des Pays-Bas en 1473 ; Philippe le Beau l'a rendu permanent en 1504. Siégeant dans la Schepenhuis, le Grand Conseil entendait les appels de tous les conseils provinciaux des dix-sept provinces et exerçait la cassation contre les tribunaux seigneuriaux locaux, liant le royaume en une seule juridiction jusqu'à l'abolition française de 1795."
 bel_collateral_councils_bureaucracy: "Conseils collatéraux"
 bel_collateral_councils_bureaucracy_desc: "La réforme de Charles Quint du 1er octobre 1531 réorganisa le gouvernement central des Pays-Bas des Habsbourg en trois conseils bruxellois : le Conseil d'État pour les grandes affaires de guerre et de dynastie, le Conseil privé ou Geheime Raad pour les ordonnances juridiques et administratives et le Conseil des Finances. Le trio s'occupa des affaires quotidiennes des Dix-Sept Provinces sous Granvelle, Egmont, Orange et Horne jusqu'à l'effondrement du régime dans les années 1790."
 bel_antwerp_bourse_bureaucracy: "Bourse d'Anvers"
 bel_antwerp_bourse_bureaucracy_desc: "La première bourse de marchandises au monde spécialement construite, ouverte en 1531 sur une conception gothique brabançonne de Domien de Waghemakere. Chaque nation marchande étrangère (portugaise, espagnole, anglaise, hanséatique, florentine) maintenait un emplacement debout sous la colonnade où les lettres de change et le poivre d'Anvers étaient cotés aux côtés des draps anglais. Le modèle fut copié par le Royal Exchange de Gresham à Londres, puis par Amsterdam, Rotterdam, Lille et toutes les grandes capitales commerciales."
 bel_four_members_bureaucracy: "Quatre députés flamands"
 bel_four_members_bureaucracy_desc: "The parliament of the Flemish wool economy, formed by Ghent, Bruges, Ypres and the Franc of Bruges. The cloth-hall guilds in each city gave the Members a base of armed weavers and fullers; their refusal of taxation could, and did, bankrupt counts and dukes. By the 1360s guild deans drew civic salaries and sat alongside patricians, making the Members a body in which craftsmen helped shape the laws of their own cities."
 bel_etats_de_liege_bureaucracy: "Trois domaines de Liège"
 bel_etats_de_liege_bureaucracy_desc: "L'Arrêté de 1684 fixe la constitution de la principauté : le prince-évêque ne doit gouverner qu'en accord avec le haut clergé de Saint-Lambert, quinze familles nobles nommées représentant la campagne, et la bourgeoisie organisée en trente-deux métiers. Les maires et les conseillers étaient issus de seize chambres électorales à vie. L'arrangement a duré jusqu'à la Révolution liégeoise de 1789-91 et l'annexion française de 1795."
 bel_societe_generale_bureaucracy: "Société Générale de Belgique"
 bel_societe_generale_bureaucracy_desc: "Fondée en 1822 par le roi Guillaume Ier sous le nom d'Algemeene Maatschappij ter a commencé le volksvlijt et héritée intacte par le nouvel État belge en 1830. Sous Ferdinand de Meeus, la Société Générale a été la pionnière de la banque industrielle sur le continent, finançant les mines de charbon du Hainaut, les usines sidérurgiques de Lige et, à partir de 1834, le deuxième réseau ferroviaire public au monde. Avec la Banque de Belgique de 1835, elle fit de Bruxelles la capitale financière des débuts de l'Europe industrielle."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_bel_bureaucracy_authority: "Autorité institutionnelle belge"
 AUTO_MODIFIER_DESC_nd_bel_bureaucracy_authority: "Belgium inherits the layered institutional history of the Southern Netherlands: the medieval charters of Brabant and Flanders, the Burgundian-Habsburg councils, the Liégeois three estates, and the constitutional monarchy of 1831. It can sustain four of these institutions."
