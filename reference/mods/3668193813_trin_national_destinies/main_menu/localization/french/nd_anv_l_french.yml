l_french:
 # === Formation Event ===
 nd_anv.1.t: "La couronne des deux royaumes"
 nd_anv.1.d: "From the rough cliffs of Northumbria to the sun-warmed vineyards of the Garonne, the lions of the Plantagenets now reign over a single house of dominions. Henry's bequest, gathered by inheritance, marriage and conquest, defies every map of Christendom: an empire that knows no language and answers to no peer.\n\nYet the Angevin Empire is no kingdom in any received sense. London speaks the rough English of the Saxon shires; Rouen and Caen speak the langue d'oil of the Norman barons; Poitiers and Bordeaux sing in the Occitan of the troubadours; Angers obeys an angevin steward; Dublin and Wexford answer a Norman lord through Welsh marcher captains. To rule them all the King must choose how he shall rule.\n\nSome at court urge a kingdom of one law: the royal writ, the King's Bench, the Exchequer of Westminster reaching across the Channel, a crown that flattens custom into a single common right. Others, marshalled by the great barons of Normandy, Aquitaine and the Marches, urge a federation of fiefs: the King as the supreme suzerain among peers, his realm a tapestry of feudal courts, tournaments and homage given freely.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_anv.1.a: "Un roi, une loi, une ordonnance outre-Manche"
 nd_anv.1.b: "Une confédération de barons sous une couronne chevaleresque"

 # === Formation Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_anv_common_law_crown: "Common Law de la Couronne"
 STATIC_MODIFIER_DESC_nd_anv_common_law_crown: "Les ordonnances royales, les juges d'Eyre et l'Échiquier de Westminster lient les duchés en une seule juridiction. Les douanes se plient à la loi du Roi."
 STATIC_MODIFIER_NAME_nd_anv_chivalric_confederation: "Confédération chevaleresque"
 STATIC_MODIFIER_DESC_nd_anv_chivalric_confederation: "Le Roi règne en suzerain parmi les magnats. Tournois, serments d'hommages et hosties féodales rendent le royaume redoutable en armes même s'il reste un patchwork de coutumes."

 # === DHE Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_anv_assize_clarendon: "Assises de Clarendon"
 STATIC_MODIFIER_DESC_nd_anv_assize_clarendon: "Les cours royales circulent à travers le royaume ; les jurys de présentation révèlent des malfaiteurs cachés. L'ordre voyage avec les juges du Roi."
 STATIC_MODIFIER_NAME_nd_anv_constitutions_clarendon: "Constitutions de Clarendon"
 STATIC_MODIFIER_DESC_nd_anv_constitutions_clarendon: "Le clergé qui brise la paix du roi est confronté à la loi du roi. La couronne s'affirme contre les privilèges de l'Église."
 STATIC_MODIFIER_NAME_nd_anv_courts_of_love: "Les tribunaux d'amour"
 STATIC_MODIFIER_DESC_nd_anv_courts_of_love: "La cour d'Aliénor à Poitiers remodèle les mœurs de la chrétienté. Les troubadours, la romance et l'amour courtois transforment l'idéal chevaleresque."
 STATIC_MODIFIER_NAME_nd_anv_great_charter: "La Grande Charte"
 STATIC_MODIFIER_DESC_nd_anv_great_charter: "Runnymede a donné naissance à une charte des libertés. Les barons jurent fidélité en échange de limites écrites à l'arbitraire royal."
 STATIC_MODIFIER_NAME_nd_anv_baronial_reaction: "Réaction baronniale"
 STATIC_MODIFIER_DESC_nd_anv_baronial_reaction: "La Couronne résiste aux demandes des barons. L'autorité royale est préservée au prix d'une aristocratie lésée."

 # === Advances: Age 1 Traditions ===
 nd_anv_exchequer_of_westminster: "Échiquier de Westminster"
 nd_anv_exchequer_of_westminster_desc: "Les rouleaux de pipes et le tissu à carreaux Le Trésor de Roger de Salisbury transforme les comptes royaux en l'instrument fiscal le plus sophistiqué de l'Europe du XIIe siècle."
 nd_anv_assize_courts: "Cours d'assises et juges royaux"
 nd_anv_assize_courts_desc: "Les réformes d'Henri II envoient des juges royaux chevaucher le royaume. Les conflits fonciers, les homicides et les vols remontent désormais jusqu'à la couronne plutôt que de se dissiper dans les salles seigneuriales."
 nd_anv_marcher_castles: "Châteaux à Marcheurs"
 nd_anv_marcher_castles_desc: "Les chaînes de pierre perdurent le long des marches galloises et de la frontière normande. Fortification concentrique portée de l'Est par les Plantagenêts et leurs ingénieurs normands."
 nd_anv_welsh_archers: "Archers gallois au service royal"
 nd_anv_welsh_archers_desc: "Les archers longs de Gwent et de Powys, restés sous contrat royal depuis les campagnes galloises. Les flèches à empennage noir qui transperçaient le courrier français dans chaque champ Plantagenet."
 nd_anv_norman_chivalry: "Chevalerie normande"
 nd_anv_norman_chivalry_desc: "Hommes d'armes montés dans de longs hauberts en mailles, descendants de l'aristocratie normande conquérante. Le bras de choc de l'hôte Plantagenêt."
 nd_anv_forest_law: "Loi forestière"
 nd_anv_forest_law_desc: "Les forêts royales sont de vastes réserves sous juridiction directe de la couronne. Les Verderers, les Regarders et les tribunaux forestiers sévères produisent des revenus détestés et un domaine royal sans précédent."

 # === Advances: Age 2 Renaissance ===
 nd_anv_brabancons_routiers: "Brabanons et Routiers"
 nd_anv_brabancons_routiers_desc: "Les compagnies mercenaires flamandes et de plaine qui se battent pour le plus offrant angevin. Discipliné, professionnel et craint la pointe de l'armée Plantagenêt."
 nd_anv_gascon_crossbowmen: "Arbalétriers gascons"
 nd_anv_gascon_crossbowmen_desc: "Les milices arbalétriers de Bordeaux, Bayonne et des ports gascons. Des arbalétriers à pied qui protégeaient les flottes viticoles et tenaient les marches du sud."
 nd_anv_courtly_love: "L'amour courtois et les troubadours"
 nd_anv_courtly_love_desc: "Cour d'Aliénor d'Aquitaine à Poitiers Marie de France, Bernart de Ventadorn, Chrétien de Troyes. La romance chevaleresque s’affine et s’exporte à travers la chrétienté."
 nd_anv_winchester_assize: "Assises d'armes"
 nd_anv_winchester_assize_desc: "Aux Assises d'Armes de 1181 chaque homme libre devait être équipé selon ses biens. La base d'une milice nationale trois siècles avant tout égal."
 nd_anv_bordeaux_wine_trade: "Négoce des Vins de Bordeaux"
 nd_anv_bordeaux_wine_trade_desc: "Les flottes qui transportent le bordeaux gascon de Bordeaux à Londres, un commerce transmanche qui lie l'Aquitaine à la couronne anglaise par l'argent autant que par le serment."
 nd_anv_cinque_ports: "Confédération des Cinq Ports"
 nd_anv_cinque_ports_desc: "Hastings, Sandwich, Douvres, Romney, Hythe, les villes ont juré de fournir des navires au roi en échange de chartes d'autonomie gouvernementale. La flotte de la Manche par contrat féodal."

 # === Advances: Age 3 Discovery ===
 nd_anv_charter_towns: "Villes à charte et bourgeois"
 nd_anv_charter_towns_desc: "Henri II et ses fils accordent des chartes d'arrondissement à travers le royaume. Les communes autonomes de commerçants sous protection royale sont le berceau de la liberté urbaine."
 nd_anv_long_bowmen: "Tactiques massives à l’arc long"
 nd_anv_long_bowmen_desc: "La doctrine des attaques de flèches sur la cavalerie en progression, pratiquée à Falkirk, perfectionnée à Crécy. L'archer à l'arc long discipliné dans les rangs profonds."
 nd_anv_aquitanian_estates: "Domaines d'Aquitaine"
 nd_anv_aquitanian_estates_desc: "Parlements coutumiers de Bordeaux, Poitiers et Saintes, où nobles, prélats et citadins gascons consentaient à l'impôt ducal. Un précédent constitutionnel."
 nd_anv_chancellors_writ: "Le bref du chancelier"
 nd_anv_chancellors_writ_desc: "L'ordonnance royale standardisée s'applique à toute l'Angleterre et aux duchés. La bureaucratie de la Chancellerie du Roi devient l'épine dorsale de la gouvernance transmanche."
 nd_anv_anglo_norman_ships: "Les rouages ​​de la Manche Angevine"
 nd_anv_anglo_norman_ships_desc: "Les rouages ​​de la Manche en clinker de Sandwich et de Rouen, bêtes de somme d'une marine marchande thalassocratique, transportant la laine anglaise, le vin gascon et le hareng normand."
 nd_anv_writ_of_summons: "Bref d'assignation"
 nd_anv_writ_of_summons_desc: "Les magnats sont convoqués nommément pour assister au conseil du roi. Le germe d’une tradition parlementaire qui survivra au régime politique angevin lui-même."

 # === Advances: Age 4 Reformation ===
 nd_anv_anglo_norman_law_schools: "Facultés de droit anglo-normandes"
 nd_anv_anglo_norman_law_schools_desc: "Les Auberges de Cour et les facultés de droit de Caen et d'Angers dispensent une jurisprudence transmanche enseignée en latin et anglo-normand, formant les magistrats des deux couronnes."
 nd_anv_calais_staple: "La laine de base"
 nd_anv_calais_staple_desc: "Toute la laine brute anglaise était acheminée vers une seule agrafe royale, scellée et taxée avant d'atteindre les métiers à tisser des Flandres. Le monopole le plus lucratif de la couronne."
 nd_anv_garrisons_pale: "Garnisons du Pale"
 nd_anv_garrisons_pale_desc: "Les capitaines de marcheurs et les garnisons royales détiennent la seigneurie d'Irlande, la principauté galloise et la frontière normande comme une chaîne de districts fortifiés sous les vice-rois."
 nd_anv_great_council: "Le Grand Conseil"
 nd_anv_great_council_desc: "Le magnum concilium des magnats et des prélats, l'organe consultatif angevin permanent qui, avec le temps, donne naissance au Parlement et aux États généraux."

 # === Advances: Age 5 Absolutism ===
 nd_anv_admiralty_at_arms: "Amirauté d'armes"
 nd_anv_admiralty_at_arms_desc: "Les escadrons unifiés de l'amirauté Plantagenêt de la Manche, les convois du golfe de Gascogne, les patrouilles de la mer d'Irlande. Une seule marine pour deux royaumes séparés par l'eau salée."
 nd_anv_garde_du_roi: "Garde du Roi"
 nd_anv_garde_du_roi_desc: "Les troupes de la maison royale, messieurs retraités, yeomen de la garde, cavalerie de la maison. Un noyau permanent de soldats professionnels fidèles à la seule couronne."
 nd_anv_two_jurisdictions: "Deux juridictions, une couronne"
 nd_anv_two_jurisdictions_desc: "Common law anglaise dans l'île, droit civil écrit dans les duchés, jurisprudence volontairement asymétrique qui respecte la coutume tout en préservant l'intégrité souveraine."
 nd_anv_atlantic_woollens: "Lainages Atlantique"
 nd_anv_atlantic_woollens_desc: "Le drap anglais tissé, foulé et teint chez lui, n'est plus exporté brut. L'intégration verticale de l'économie textile Plantagenêt."

 # === Advances: Age 6 Revolutions ===
 nd_anv_redcoat_drill: "Foret tunique rouge"
 nd_anv_redcoat_drill_desc: "La ligne percée de mousquets et de baïonnettes en écarlate le tir de volée discipliné des réguliers angevins, redoublé par les écoles d'officiers anglo-normandes."
 nd_anv_rule_at_sea: "Règle en mer"
 nd_anv_rule_at_sea_desc: "Murs en bois de la Manche, de l'Atlantique et de la Méditerranée, la doctrine des navires de ligne qui fait du pavillon angevin le maître de trois mers à la fois."
 nd_anv_constitutional_fusion: "Fusion constitutionnelle"
 nd_anv_constitutional_fusion_desc: "Une assemblée bicamérale des seigneurs et des communes, siégeant alternativement à Westminster et à Rouen, ratifie une constitution écrite liant la couronne, la pairie et le peuple."

 # === DHE Events ===
 nd_anv.2.t: "Les assises de Clarendon"
 nd_anv.2.d: "At the council of Clarendon Henry has summoned bishops, barons and royal justices to a hunting lodge in Wiltshire. The chequered cloth of the Exchequer is unrolled. Justices in eyre are commissioned to ride the realm: to inquire by sworn juries of presentment into hidden murders, robberies and the receivers of malefactors. From this hour forward, the law of the King flows where the King's writ runs.\n\nFor a generation no royal court has reached so deep into the shires; for a century no royal justice has bound the duchies of the continent into a single jurisprudence. The judges depart for their circuits before the candles burn out."
 nd_anv.2.a: "Que la loi du roi pénètre dans chaque comté"

 nd_anv.3.t: "Les Constitutions de Clarendon"
 nd_anv.3.d: "Henry has summoned his bishops to set in writing the customs of his grandfather's reign. The Constitutions return to crown the trial of clerks who commit felony, the appeal of bishops to Rome only by royal leave, the King's voice in the election of prelates. Thomas Becket has affixed his seal, and then taken it back.\n\nThe quarrel between altar and throne is an old one in Latin Christendom, but no king before Henry has dared to codify the privileges of the crown so plainly against the immunities of the Church. Where now lies the King's edge?"
 nd_anv.3.a: "Appuyez sur l'ordre de la couronne, le roi fait des prélats comme il fait des comtes"
 nd_anv.3.b: "Faites un concordat, le roi qui gagne, l'Église gagne tout."
 STATIC_MODIFIER_NAME_nd_anv_clarendon_press: "Couronne Érastienne"
 STATIC_MODIFIER_DESC_nd_anv_clarendon_press: "La couronne s'affirme sur la prélature. Les évêques sont des officiers royaux en mitre."
 STATIC_MODIFIER_NAME_nd_anv_clarendon_concord: "Concordat de Clarendon"
 STATIC_MODIFIER_DESC_nd_anv_clarendon_concord: "Le roi et l'Église parlent d'une seule voix. Le clergé prêche pour la couronne."

 nd_anv.4.t: "La Cour de Poitiers"
 nd_anv.4.d: "Eleanor (Queen of England, Duchess of Aquitaine, Countess of Poitou) has taken her household to her own city of Poitiers. About her gather the troubadours of the south: Bernart de Ventadorn, the polished Marie de France, the young Chrétien de Troyes. They sing of #italic fin amor#!: of an exalted, almost ritual love between knight and lady that subordinates feudal violence to courtly grace.\n\nThe knightly culture of Poitiers will travel back across the Channel with the Queen's chamberlains and minstrels. From this court will come the cycle of Arthur and the Holy Grail, the rules of the tournament, the very vocabulary of romance. The world of feudal Christendom is being courteously remade."
 nd_anv.4.a: "Affiner notre chevalerie comme le voudrait la reine"

 nd_anv.5.t: "Runnymède"
 nd_anv.5.d: "On the meadow at Runnymede, between Windsor and Staines, the King has met the assembled barons of the realm in arms. After Bouvines and the loss of Normandy the magnates will be forced no longer; they have drawn up a charter of liberties: sixty-three clauses guaranteeing baronial counsel, the privileges of the Church, the customs of London, the freedom of merchants and the lawful judgment of peers.\n\nWill the crown grant the charter, accept the limits of its prerogative and bind the magnates to faith? Or will it stake everything on royal arms, stand against the demand and put the empire to the test of war?"
 nd_anv.5.a: "Posez le sceau à Runnymede"
 nd_anv.5.b: "Rejeter la charte, la couronne est sa propre mesure"

 nd_anv.6.t: "La bataille de la Manche"
 nd_anv.6.d: "Off the cliffs of the South Foreland, the Angevin fleet of the Cinque Ports has met the foe in the narrow sea. Cogs of Sandwich and Hythe, sails black against the autumn sky, drive the longships of the enemy into the white surf of the chalk. The Channel henceforth belongs to the Angevin admiral.\n\nNo king of the West has held both shores of the narrow sea since the Romans. Now the salt water that once divided the Plantagenet realm becomes its inland highway."
 nd_anv.6.a: "Maîtrisez la Manche et laissez les flottes de laine naviguer sans encombre"

 nd_anv.7.t: "La laine de base à Calais"
 nd_anv.7.d: "By royal proclamation, no fleece of English wool may pass to the looms of Flanders save through the King's staple. Sealed bales are taxed at the staple's chequer; the price of wool is set by the King's merchants; the crown's revenue from wool exceeds, in good years, all other royal income put together.\n\nThe Flemish weavers grumble. The Italian bankers extend further credit on the security of the staple. The English clothiers begin, slowly, to weave their wool at home. The Plantagenet purse has rarely been so heavy."
 nd_anv.7.a: "La laine d'Angleterre, l'argent des Flandres"

 # === Custom Buildings ===
 nd_anv_exchequer_hall: "Salle de l'Échiquier"
 nd_anv_exchequer_hall_desc: "Le drap à carreaux, les rouleaux de calumet et les assignations. Les comptes royaux sont calculés par des compteurs sur une table à damier ; les shérifs rendent leurs fermes devant les barons du roi deux fois par an."
 nd_anv_concentric_castle: "Château concentrique"
 nd_anv_concentric_castle_desc: "Murs concentriques, tours murales, poternes et grand donjon, le château Plantagenêt perfectionné à Douvres, château Gaillard et Beaumaris. Les fortifications les plus formidables de l'Europe du XIIe siècle."
 nd_anv_assize_court: "Cour d'assises"
 nd_anv_assize_court_desc: "Une salle royale où les juges du roi à Eyre entendent les plaidoyers en matière de terres, d'homicide et d'intrusion. La justice de la couronne, apportée au comté par bref et sceau."
 nd_anv_chivalric_tournament_field: "Terrain de tournoi chevaleresque"
 nd_anv_chivalric_tournament_field_desc: "Les lices, les pavillons, les hérauts en tabard. Un terrain de tournoi sous licence où la chevalerie du royaume s'entraîne aux armes et rivalise pour l'honneur et la rançon."
 nd_anv_chartered_borough: "Arrondissement à charte"
 nd_anv_chartered_borough_desc: "Ville autonome sous charte royale, avec sa propre corporation de marchands, sa cour de la poudre à tarte et sa ferme du bourg. Les bourgeois paient directement la couronne en remplacement des cotisations seigneuriales."
 nd_anv_gascon_winery: "Domaine Gascon"
 nd_anv_gascon_winery_desc: "Les vignobles de Garonne et Dordogne Bordeaux, Saint-milion, Cahors. Claret et vin rouge pressés pour le marché de la Manche et les cours de la chrétienté occidentale."
 nd_anv_cinque_port_yard: "Chantier portuaire de Cinque"
 nd_anv_cinque_port_yard_desc: "Un port affrété par la confédération Cinque Ports, juré de fournir des rouages ​​et des équipages au roi en échange de l'autonomie gouvernementale et d'une cour d'amirauté."
 nd_anv_anglo_norman_law_school: "Faculté de droit anglo-normande"
 nd_anv_anglo_norman_law_school_desc: "Une auberge de tribunal ou de faculté de droit enseignant en parallèle la common law d'Angleterre et le droit coutumier de Normandie. Magistrats du double royaume Plantagenêt formés sous un même toit."

 # === PM Loc ===
 nd_anv_exchequer_upkeep: "Comptabilité des rouleaux de tuyaux"
 nd_anv_exchequer_upkeep_desc: "Compteurs, rouleaux de tuyaux, parchemin, cire et salaires des commis aux chèques."
 nd_anv_concentric_castle_upkeep: "Entretien de la garnison du château"
 nd_anv_concentric_castle_upkeep_desc: "Pierre à réparer, armes pour la garde, nourriture pour la garnison et salaires des agents et des sergents."
 nd_anv_assize_court_upkeep: "Séances de la cour d'assises"
 nd_anv_assize_court_upkeep_desc: "De la cire pour les sceaux, du papier pour les rouleaux de plaidoyer, l'hospitalité pour les juges du roi qui parcourent leur tournée."
 nd_anv_tournament_upkeep: "Patronage de tournoi"
 nd_anv_tournament_upkeep_desc: "Pavillons, bannières, armes, tissus fins pour les surcots et la livrée des hérauts assurent l'entretien de l'apparat chevaleresque."
 nd_anv_chartered_borough_upkeep: "Charges communes d'arrondissement"
 nd_anv_chartered_borough_upkeep_desc: "Les dépenses du pavage de la commune des bourgeois, de la régulation du marché, de la surveillance et de la garde, et de la collecte des fermes royales."
 nd_anv_gascon_wine_production: "Vin Gascon Millésime"
 nd_anv_gascon_wine_production_desc: "Pressurage du vin du raisin de Garonne pour les flottes de la Manche et les cours de la Chrétienté."
 nd_anv_cinque_port_yard_upkeep: "Dispositions de cour et cordage"
 nd_anv_cinque_port_yard_upkeep_desc: "Fournitures navales, bois de construction et cordages pour les rouages ​​de l'escadron Cinque Ports."
 nd_anv_law_school_upkeep: "Bourse de la faculté de droit"
 nd_anv_law_school_upkeep_desc: "Livres, papiers et traitements des docteurs de droit commun et coutumier."

 # === Custom Units ===
 a_nd_anv_welsh_archers: "Archers gallois"
 a_nd_anv_welsh_archers_desc: "Les archers longs de Gwent et Powys, élevés par contrat Plantagenet. Leurs flèches noires d'un mètre de long transpercent les mailles et dévastent les charges de cavalerie."
 a_nd_anv_norman_chivalry: "Chevaliers Normands"
 a_nd_anv_norman_chivalry_desc: "Hommes d'armes montés dans de longs hauberts en maille, descendants des conquérants normands. Le bras de choc de l'hôte Plantagenêt."
 a_nd_anv_brabancons: "Brabanons"
 a_nd_anv_brabancons_desc: "Infanterie mercenaire flamande et brabançonne engagée par la couronne. Discipliné, professionnel et redouté du Pays de Galles au Limousin."
 a_nd_anv_gascon_crossbowmen: "Arbalétriers gascons"
 a_nd_anv_gascon_crossbowmen_desc: "Les milices arbalétriers de Bordeaux, Bayonne et des ports gascons. Infanterie urbaine disciplinée tenant les marches du sud."
 a_nd_anv_longbowmen: "Archers longs Plantagenêt"
 a_nd_anv_longbowmen_desc: "Infanterie massive à arcs longs entraînée sous contrat royal, la tempête de flèches disciplinée de l'hôte Plantagenêt. La terreur de la chevalerie française à partir de Crécy."
 a_nd_anv_household_cavalry: "Cavalerie domestique"
 a_nd_anv_household_cavalry_desc: "Messieurs les retraités et les yeomen de la garde, le cheval de maison debout du roi, maillé dans le dernier style et fidèle à la couronne seule."
 n_nd_anv_channel_cog: "Rouage de canal"
 n_nd_anv_channel_cog_desc: "Le rouage de la Manche en clinker de Sandwich et Rouen, large de largeur et haut de côté. Le cheval de bataille de la marine marchande Plantagenêt."
 n_nd_anv_great_ship: "Grand navire de ligne"
 n_nd_anv_great_ship_desc: "Un navire de premier ordre de la ligne de l'amirauté angevine, armé à flancs et construit pour dominer les mers étroites et le golfe de Gascogne."

 # === Levies ===
 levy_nd_anv_welsh_archers: "Archers gallois"
 levy_nd_anv_welsh_archers_desc: "Prélèvement sur les arcs longs augmenté dans les comtés gallois."
 levy_nd_anv_norman_chivalry: "Chevaliers Normands"
 levy_nd_anv_norman_chivalry_desc: "Relève de cavalerie lourde issue de l'aristocratie normande des deux rives de la Manche."
 levy_nd_anv_gascon_crossbowmen: "Arbalétriers gascons"
 levy_nd_anv_gascon_crossbowmen_desc: "Prélèvement d'arbalètes urbaines des ports et bastides gascons."
 levy_nd_anv_longbowmen: "Archers longs Plantagenêt"
 levy_nd_anv_longbowmen_desc: "Prélèvement d'arcs longs massifs formés dans les comtés anglais."

 # === Variable tooltips ===
 nd_anv_formed_tt: "Création de l'Empire angevin"
 nd_anv_path_a_tt: "Voie de common law de la Couronne choisie"
 nd_anv_path_b_tt: "Voie de la Confédération chevaleresque choisie"
 nd_anv_dest_calais_developed_tt: "Owns #bold Calais#! and its development is at least #bold 35#!"
 nd_anv_dest_angers_developed_tt: "Owns #bold Angers#! and its development is at least #bold 42#!"

 # === Age 6 industrial advance ===
 nd_anv_industrial_plantagenet: "Plantagenêt industriel"
 nd_anv_industrial_plantagenet_desc: "Le fer des marches galloises, le charbon du Pays Noir, les moulins à eau le long de chaque rivière. Les domaines Plantagenêt entrent dans l'ère industrielle avec le fer et la vapeur."

 # === Destiny Tree ===
 nd_anv_destiny: "Le long chemin Plantagenêt"
 nd_anv_destiny_desc: "La Couronne des Deux Royaumes est liée par héritage, mais son long destin n'est pas encore écrit. Le royaume Plantagenêt se tournera-t-il vers l’ouest vers la mer salée et les îles britanniques, ou vers le sud et l’est jusqu’au cœur de la France ? Le choix fait lors de la formation exige désormais un programme."

 # Path A: Insular Atlantic Power
 nd_anv_dest_isles_pacified: "Pacification des îles britanniques"
 nd_anv_dest_isles_pacified_desc: "The Common Law cannot reach where royal writ does not run. Bring Lothian and Gaelic Munster within the Plantagenet jurisdiction: pacify Edinburgh and the MacCarthy country at Killarney, and bind the whole archipelago to a single crown."
 nd_anv_dest_narrow_seas: "Maîtresse des mers étroites"
 nd_anv_dest_narrow_seas_desc: "Hold the Channel from the Cinque Ports to the Flemish coast: take Antwerp and Dunkirk, the two anchors of the cloth trade, and ensure that no fleet sails between them without paying the King of England's toll. Build the war chest and raise Calais, the staple port, to half again its size."
 nd_anv_dest_atlantic_crown: "La couronne atlantique"
 nd_anv_dest_atlantic_crown_desc: "Plant the leopards of England in the islands of the Atlantic. Take Madeira and the Azores, embrace the New World, and raise an admiralty whose squadrons range the deep ocean from a Cinque-Ports nucleus to the Sargasso Sea."

 # Path B: Continental Plantagenet
 nd_anv_dest_lost_duchies: "Récupérer les duchés perdus"
 nd_anv_dest_lost_duchies_desc: "La Touraine et le Maine appartenaient à Henri du droit de son père, perdu aux mains des Capet à Bouvines. Récupérer Tours et Le Mans, et rétablir le cœur du patrimoine angevin."
 nd_anv_dest_empire_of_loire: "Empire de la Loire"
 nd_anv_dest_empire_of_loire_desc: "Take Paris itself and the royal city of Orléans. Field a host of fifty thousand knights, sergeants and routiers, and make Angers, cradle of the dynasty, half again as great, a seat worthy of an emperor of the West."
 nd_anv_dest_crown_christendom: "Couronne de la chrétienté"
 nd_anv_dest_crown_christendom_desc: "Toulouse, Dijon, Reims le Languedoc, le cœur bourguignon et la ville du sacre des rois de France. Déployez un hôte Plantagenet qu'aucune puissance continentale ne peut égaler. Couronnez un empire chevaleresque qui humilie chaque voisin."

 # === Destiny Events ===
 nd_anv.8.t: "Le programme long du roi"
 nd_anv.8.d: "The chancery has drawn up a long memorandum on the Plantagenet realm's prospects. All have offered their counsel on the years to come: the clerks of Westminster, the prelates of Rouen, the seneschals of Aquitaine.\n\nThe King retires with his closest advisers to weigh what the Crown of Two Realms shall pursue beyond the immediate cares of statecraft. A long programme, written in the King's own hand and sealed with the lions, takes its place in the chancery archive at Westminster."
 nd_anv.8.a: "Mettez les lions sur un long chemin"

 nd_anv.9.t: "La pacification des îles"
 nd_anv.9.d: "Lothian has bowed to the King's writ; the Lord Justiciar's circuit reaches now into Munster. From the cliffs of Cape Wrath to the Atlantic harbours of Cork, the same royal seal authenticates a charter, the same justices in eyre hear pleas of trespass, the same coin runs in the markets.\n\nThe British Isles are no longer a confused tangle of frontiers. They are one realm, bound by one common law beneath a single crown."
 nd_anv.9.a: "Un archipel, une couronne"

 nd_anv.10.t: "Les mers étroites"
 nd_anv.10.d: "From the South Foreland to the dunes of Flanders, from Sandwich to Antwerp, the narrow sea is now a Plantagenet lake. The Cinque-Ports cogs convoy the wool fleets unmolested; the King's admiral collects toll from every Hansa kogge that beats up the strait.\n\nThe Channel was once the salt-water frontier that divided the Plantagenet realm. It is now its inland highway. How shall the Crown order its admiralty?"
 nd_anv.10.a: "Construisez les escadrons de King's Channel"
 nd_anv.10.b: "Élever l'aliment de base de Calais au rang de monopole royal"

 nd_anv.11.t: "Au-delà des approches occidentales"
 nd_anv.11.d: "The leopards now flutter from the rigging of caravels lying in the harbour of Funchal; the silver-and-gold of the Azores trade rolls in to the Bristol custom-house. Word of the New World has taken root in Westminster and Rouen. The Plantagenet admiralty rules a sea-empire whose extent no medieval king could have imagined.\n\nWith such reach come hard choices. Shall the King build a deep-ocean battle fleet of the western approaches, or weave a network of trading factories along the Atlantic seaboard?"
 nd_anv.11.a: "Une flotte de combat hauturière"
 nd_anv.11.b: "Un réseau d'usines commerciales"

 nd_anv.12.t: "Le cœur de l'Anjou restauré"
 nd_anv.12.d: "Tours, the city of Saint Martin; Le Mans, the city of Henry's birth. The Angevin patrimony (Touraine and Maine, the heart of the Plantagenet inheritance) is restored to the family line.\n\nThe King's herald reads the homage in three languages. The bells of every parish church ring out from Angers to Rennes. The chivalry of the realm rides north from Bordeaux and south from Caen to a tournament held in the King's own hand at Le Mans."
 nd_anv.12.a: "Par droit d'héritage et d'armes"

 nd_anv.13.t: "Paris et Orléans"
 nd_anv.13.d: "The Île-de-la-Cité, Notre-Dame de Paris, the Sainte-Chapelle. Orléans on the Loire, the heart of royal France. The Capetian patrimony is in Plantagenet hands; the King of France is the Plantagenet's prisoner, his vassal, or his fugitive.\n\nNo king of the West has held both crowns since Charlemagne. Shall the Plantagenet humble the Capet line forever, or hold the Loire valley as a chivalric court where the great vassals of the realm pay homage in Eleanor's manner?"
 nd_anv.13.a: "Les Humbles Capet dépouillent la Couronne de France"
 nd_anv.13.b: "Une cour de Loire de palatins et d'hommage"

 nd_anv.14.t: "La couronne de la chrétienté"
 nd_anv.14.d: "From Toulouse in the Languedoc to Dijon in Burgundy and the coronation city of Reims, the King reigns as suzerain of the West. The leopards stand beside the eagle of the Empire as equals, perhaps as superiors. The chivalry of three crowns rides under the Plantagenet banner.\n\nIs this an empire of arms, a martial Plantagenet imperium that humbles every continental power, or a feudal lordship of palatine vassals, knit together by oaths of homage and tournaments held in the King's hand?"
 nd_anv.14.a: "Un empereur d’Occident, par la force des armes"
 nd_anv.14.b: "Une seigneurie féodale d'hommage palatin"

 # === Destiny Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_anv_dest_channel_admiralty: "Amirauté de la Manche"
 STATIC_MODIFIER_DESC_nd_anv_dest_channel_admiralty: "Les escadrons unifiés de Sandwich, Portsmouth et Le Havre. Les rouages ​​et les galères de deux côtes sous un seul Lord High Amiral."
 STATIC_MODIFIER_NAME_nd_anv_dest_staple_monopoly: "Monopole de base"
 STATIC_MODIFIER_DESC_nd_anv_dest_staple_monopoly: "La laine d’Angleterre, le vin de Gascogne, le tissu des Flandres passent tous par les fibres royales. Les marchands de la couronne fixaient les prix de trois royaumes."
 STATIC_MODIFIER_NAME_nd_anv_dest_western_approaches: "Approches occidentales"
 STATIC_MODIFIER_DESC_nd_anv_dest_western_approaches: "Les escadrons de ligne s'étendent de Brest au golfe de Gascogne et au-delà. Le drapeau Plantagenêt est le maître des grands fonds marins même si les marches de l'armée s'allongent."
 STATIC_MODIFIER_NAME_nd_anv_dest_atlantic_factories: "Usines de l'Atlantique"
 STATIC_MODIFIER_DESC_nd_anv_dest_atlantic_factories: "Usines commerciales à Funchal, Ponta Delgada et au Cap-Vert. Les marchands Plantagenêt exploitent l'offre atlantique d'esclaves, de sucre et d'or."
 STATIC_MODIFIER_NAME_nd_anv_dest_capet_humbled: "Le Capet humilié"
 STATIC_MODIFIER_DESC_nd_anv_dest_capet_humbled: "La fleur de lys royale repose dans la poussière à Westminster. L’animateur Plantagenet évolue avec l’élan d’une campagne qui ne peut être arrêtée."
 STATIC_MODIFIER_NAME_nd_anv_dest_loire_courts: "Les tribunaux de la Loire"
 STATIC_MODIFIER_DESC_nd_anv_dest_loire_courts: "Le Val de Loire devient une cour d'hommage palatin. Les grands vassaux du royaume jurent fidélité à la manière de Poitiers, tandis que les bourgeois se plaignent d'être ignorés."
 STATIC_MODIFIER_NAME_nd_anv_dest_western_imperator: "Imperateur d'Occident"
 STATIC_MODIFIER_DESC_nd_anv_dest_western_imperator: "Anointed at Reims, the Plantagenet stands beside the Holy Roman Emperor as an equal. The chivalry of the West rides under his banner, and the fleet is left to fend for itself."
 STATIC_MODIFIER_NAME_nd_anv_dest_palatines_homage: "Hommage des Palatins"
 STATIC_MODIFIER_DESC_nd_anv_dest_palatines_homage: "Les comtes palatins de Toulouse, de Bourgogne et du Languedoc s'inclinent devant la cour du Roi. Leurs prélèvements et leurs trésors affluent vers Westminster à un rythme lent mais inexorable."

 # === Destiny Buildings ===
 nd_anv_dest_admiralty_house: "Maison de l'Amirauté"
 nd_anv_dest_admiralty_house_desc: "Le siège des cales sèches du Lord High Admiral, des chantiers d'avitaillement, des voileries et du bureau de la marine. Une amirauté Plantagenêt unifiée avec des escadres de la Manche, du golfe de Gascogne et des approches de l'Atlantique."
 nd_anv_dest_admiralty_upkeep: "Opérations du chantier de l'Amirauté"
 nd_anv_dest_admiralty_upkeep_desc: "Fournitures navales, bois d'œuvre, goudron et outils pour les cales sèches et les chantiers d'avitaillement du roi."
 nd_anv_dest_chivalric_palatinate: "Palatinat chevaleresque"
 nd_anv_dest_chivalric_palatinate_desc: "Une grande salle d'hommage palatin, sur le modèle du comté palatin de Chester et de la cour ducale aquitaine de Bordeaux. Les comtes palatins jurent fidélité dans la main du roi et partent à l'appel du roi avec leurs hôtes féodaux au complet."
 nd_anv_dest_palatinate_upkeep: "Entretien de la Cour Palatine"
 nd_anv_dest_palatinate_upkeep_desc: "Beaux tissus, armes, meubles et cire pour la grande salle des hommages palatins et ses cérémonies chevaleresques."

 # === Bureaucracies ===
 nd_anv_bureaucracy_authority: "Administration Plantagenêt"
 AUTO_MODIFIER_NAME_nd_anv_bureaucracy_authority: "Administration Plantagenêt"
 AUTO_MODIFIER_DESC_nd_anv_bureaucracy_authority: "Les organes administratifs du royaume angevin (la Curia Regis itinérante, la chancellerie et l’échiquier de Westminster, la sénéchalie d’Aquitaine et les ports affrétés de la Manche) se sont durcis en un appareil institutionnel permanent. La couronne des deux royaumes ne gouverne désormais plus par la seule présence dynastique, mais par des brefs, des audits et des privilèges permanents renouvelés à l'arrivée de chaque souverain."

 nd_anv_curia_regis_itinerant_bureaucracy: "Curia Regis itinérante"
 nd_anv_curia_regis_itinerant_bureaucracy_desc: "La cour intérieure du roi, composée de juges, connétables, chambellans et clercs, voyageait avec les souverains Plantagenêt entre Westminster, Rouen, Caen, Le Mans, Angers, Chinon et Poitiers. Le Dialogus de Scaccario de Richard FitzNeal ​​(vers 1179) décrit une curie qui s'occupait de l'audit fiscal, des plaidoyers royaux, de la correspondance étrangère et des affaires dynastiques de manière interchangeable, quel que soit l'endroit où se trouvait le roi. C'était une institution de mouvement : ​​l'antécédent des Plaidoyers Communs et du Banc du Roi sédentaires qui ne se sont développés qu'après les réformes de 1234. Bien que bien financée, la curie lie le royaume transmanche en un seul corps politique; Lorsqu'elle est négligée, la maison du roi devient un circuit confortable et les grands barons commencent à ressentir du ressentiment à chaque visite."

 nd_anv_clarendon_apparatus_bureaucracy: "Constitutions de l'appareil Clarendon"
 nd_anv_clarendon_apparatus_bureaucracy_desc: "L'ensemble des instruments administratifs codifiés au Conseil de Clarendon en janvier 1164 : les seize articles affirmant la juridiction royale sur les commis criminels, l'utrum d'assises attirant les affaires foncières devant les tribunaux royaux, la loi forestière royale administrée par les forestiers et les verderers du roi, et le système de brefs de chancellerie qui convoquait les sujets sous le sceau du roi. La querelle avec Becket à propos de l'article sur les commis criminels fut amère et se termina par un martyre à Cantorbéry, mais l'appareil au sens large tint bon : le gouvernement Plantagenêt devint un État bref. Bien qu'elle soit maintenue, l'autorité royale atteint les sujets directement par parchemin plutôt que par l'intermédiaire du seigneur ; bien que négligée, l'église se souvient de Becket et de la stabilité qui s'effiloche."

 nd_anv_aquitanian_curia_bureaucracy: "Cours Plénières d'Aquitaine"
 nd_anv_aquitanian_curia_bureaucracy_desc: "La grande curie du duc-roi à Poitiers puis à Bordeaux, où les magnats aquitains - les comtes d'Angoulême, du Périgord, de La Marche, d'Armagnac et le seigneur d'Albret - rendaient conseil, entendaient des appels et confirmaient le droit coutumier du duché. Aliénor d'Aquitaine soutient la cour de Poitiers après 1168 ; Richard Ier, en tant que comte du Poitou, en fit son centre politique ; sous les derniers Angevins, le sénéchal de Gascogne présidait en l'absence du roi. Contrairement à l'État écrit d'Angleterre, l'Aquitaine ducale restait de nature fédérale : une province Plantagenêt dont les magnats parlaient en tant que pairs plutôt que sujets, dont les vins nourrissaient l'hôte du roi et dont la loyauté dépendait de la dignité de leur consultation."

 nd_anv_cinque_ports_bureaucracy: "Confédération des Cinq Ports"
 nd_anv_cinque_ports_bureaucracy_desc: "Les Plantagenêt négocient avec les villes navales de Hastings, New Romney, Hythe, Dover et Sandwich, rejointes plus tard par les anciennes villes de Rye et Winchelsea. En échange du service maritime de cinquante-sept navires pendant quinze jours chaque année, les ports reçurent de vastes libertés en vertu de la Charte de 1278 : leur propre cour d'amirauté à Shepway, l'exonération des taxes et douanes royales, le droit d'envoyer des barons porter la verrière lors des couronnements et l'immunité effective des ordres royaux à l'intérieur de leurs murs. La Couronne acheta une flotte permanente du type le moins cher ; les bourgeois obtinrent une autonomie dont aucun autre arrondissement anglais ne jouissait. L'accord a tenu jusqu'à ce qu'Henri VIII réaménage finalement la marine royale à des conditions différentes."
